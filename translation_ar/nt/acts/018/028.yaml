    reason: lexical_alternative
lexical_decisions:
- source_word: εὐτόνως
  choice: بقوة
  rationale: ينقل شدة المحاجّة وفاعليتها بعبارة عربية طبيعية، من غير حصر المعنى في مجرد الحماسة.
- source_word: διακατηλέγχετο
  choice: كان يفنّد حجج
  rationale: يدل الفعل على الدحض التام المتكرر أو المستمر؛ وصيغة «كان يفنّد» تنقل قوة الماضي الناقص، وإضافة «حجج» تجعل التعبير العربي طبيعيًا من غير تغيير موضوع الفعل.
- source_word: τοῖς Ἰουδαίοις
  choice: اليهود
  rationale: ترجمة مباشرة تحافظ على تعيين الجماعة في النص؛ والسياق يشير إلى المحاورين اليهود، لا إلى حكم عام على جميع اليهود.
- source_word: δημοσίᾳ
  choice: على الملأ
  rationale: تعبير عربي واضح ود dignified يدل على أن المحاجّة جرت علنًا أمام الناس.
- source_word: ἐπιδεικνὺς
  choice: مبيّنًا
  rationale: ينقل فعل العرض البرهاني الذي يوضح الوسيلة التي فنّد بها الحجج، من دون المبالغة في معنى الإثبات القاطع.
- source_word: διὰ τῶν γραφῶν
  choice: من خلال الكتب المقدسة
  rationale: يحافظ على دلالة الوسيلة في διά مع المضاف إليه، ويبين أن النصوص المقدسة كانت أداة الاستدلال.
- source_word: τὸν χριστὸν
  choice: المسيح
  rationale: المصطلح هنا لقب للممسوح الموعود، و«المسيح» هو المقابل العربي الراسخ الذي يحفظ السياق اليهودي الكتابي.
- source_word: Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية المألوفة للاسم الشخصي Ἰησοῦς.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: أن يسوع هو المسيح
  rationale: صياغة عربية طبيعية لخبر الجملة المصدرية، مع حفظ إمكان فهم التركيب أيضًا بمعنى «أن المسيح هو يسوع» في الحاشية.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو اللقب العربي الكتابي المستقر للممسوح الموعود، ويلائم البرهنة من الكتب المقدسة من غير تحويل اللقب إلى اسم شخصي محض.
- issue: ترتيب طرفي الجملة εἶναι τὸν χριστὸν Ἰησοῦν
  choice: أن يسوع هو المسيح
  alternative: أن المسيح هو يسوع
  rationale: التركيب اليوناني يحتمل تمثيل العلاقة بالترتيبين؛ اختير الترتيب العربي الأكثر طبيعية، مع إبقاء البديل في الحاشية حفاظًا على الغموض النحوي الحقيقي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل «على الملأ» للعلنية، و«كان يفنّد حجج» لنقل الاستمرار وقوة الدحض، مع تجنب الألفاظ الجدلية القديمة مثل «يدحضهم» أو «يبكّتهم» حين قد توحي بإدانة الأشخاص بدل تفنيد أقوالهم.
