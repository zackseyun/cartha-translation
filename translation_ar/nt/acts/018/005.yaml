base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: ar
  text: ولكن لما قدم سيلا وتيموثاوس من مكدونية، كان بولس منشغلًا بالكلمة[a]، يشهد لليهود مؤكدًا أن يسوع هو المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان مدفوعًا بالكلمة»، أو: «كان مستغرقًا في الرسالة». يمكن أن يدل الفعل اليوناني على أن المرء مأخوذ بأمر، أو واقع تحت ضغطه، أو متفرغ له.'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «خريستوس»، أي «المسيح» أو «الممسوح». واللفظ هنا لقب، فالمعنى أن يسوع هو المسيح الموعود.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ولكن لما
  rationale: تنقل أداة الربط δέ مع الدلالة الزمنية لـὡς، وتأتي عربيةً طبيعية في الانتقال إلى الحدث التالي.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: نزل ... من مكدونية
  rationale: تحافظ على اصطلاح السفر في κατέρχομαι بمعنى النزول أو القدوم، من غير تحويله إلى «رجع» الذي لا يصرح به الفعل.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: سيلا وتيموثاوس
  rationale: تنقل الشخصين معًا بسلاسة؛ ولا تستلزم صيغة τε ... καί إضافة «كلاهما» في العربية.
- source_word: συνείχετο
  choice: كان ... منهمكًا
  rationale: تعبر عن كون بولس مأخوذًا بالعمل أو مستغرقًا فيه، مع إبقاء احتمالي الضغط أو الإلزام في الحاشية بدل حسمهما في المتن.
- source_word: τῷ λόγῳ
  choice: بالكلمة
  rationale: تحافظ على لفظ λόγος وعلى الاختصار اللوقاوي الشائع للدلالة على رسالة البشارة؛ والباء تلائم تعلق الفعل بها مع بقاء احتمال معنى «مدفوعًا بالكلمة».
- source_word: διαμαρτυρόμενος
  choice: يشهد ... مؤكدًا
  rationale: يجمع بين دلالة الشهادة وقوة التوكيد في διαμαρτύρομαι، بعبارة عربية واضحة غير متكلفة.
- source_word: τοῖς Ἰουδαίοις
  choice: لليهود
  rationale: المقصود في السياق جماعة اليهود الدينية والقومية، لا سكان اليهودية على وجه التحديد.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: أن يسوع هو المسيح
  rationale: تعكس البنية الخبرية التي تعرّف يسوع بأنه المسيح الموعود، وتحافظ على «المسيح» بوصفه لقبًا مفهومًا في العربية الكتابية والعامة.
theological_decisions:
- issue: هل Χριστός هنا لقب أم جزء شبيه بالاسم؟
  choice: المسيح
  alternative: المسيح يسوع / كريستوس
  rationale: 'ورود Χριστός مع أداة التعريف وفي موقع الخبر ضمن شهادة موجهة إلى اليهود يبرز معناه اللقبي: يسوع هو الممسوح الموعود. ولفظ «المسيح» هو المقابل العربي الطبيعي الذي يحفظ هذا المعنى.'
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «منهمكًا بالكلمة» في المتن لسلامته ووضوحه، مع توثيق اتساع دلالة العبارة اليونانية في الحاشية. جميع علامتي الحاشية مثبتتان عند العبارتين المعنيتين.
