source:
  edition: SBLGNT
  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: ar
  text: ولمّا أراد أن يعبر إلى أخائية، شجّعه الإخوة وكتبوا إلى التلاميذ أن يرحّبوا به. فلمّا وصل، قدّم عونًا كبيرًا للذين آمنوا بالنعمة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قدّم بالنعمة عونًا كبيرًا للذين آمنوا». يمكن أن تتعلّق العبارة اليونانية المترجمة «بالنعمة» بعون أبلّوس بدلًا من تعلّقها بإيمان المؤمنين.'
    reason: alternative_reading
lexical_decisions:
- source_word: βουλομένου δὲ αὐτοῦ
  choice: ولمّا أراد
  rationale: ينقل تركيب المضاف المطلق بوصفه ظرفًا يبيّن قصد أبلّوس، ويحفظ معنى الإرادة بعبارة عربية طبيعية.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: أن يعبر إلى أخائية
  rationale: يحفظ إيحاء الانتقال أو العبور من أفسس إلى إقليم أخائية، من غير إثقال العبارة.
- source_word: προτρεψάμενοι
  choice: شجّعه
  rationale: يفيد الحثّ المؤيد والإيجابي في السياق، وهو أنسب من ألفاظ قد توحي بالتوبيخ أو الإلزام.
- source_word: οἱ ἀδελφοὶ
  choice: الإخوة
  rationale: يحافظ على صيغة المصدر المذكرة، مع احتمال أن تكون في الاستعمال المسيحي المبكر شاملة لجماعة المؤمنين الأوسع.
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: كتبوا إلى التلاميذ
  rationale: ترجمة مباشرة وطبيعية تحفظ لفظ «التلاميذ» المميز في سفر الأعمال.
- source_word: ἀποδέξασθαι αὐτόν
  choice: أن يرحّبوا به
  rationale: يعبّر عن الاستقبال الحسن المقصود في السياق بصورة أوضح من «يقبلوه» أو «يتلقّوه».
- source_word: ὃς παραγενόμενος
  choice: فلمّا وصل
  rationale: يصوغ الضمير الموصول مع اسم الفاعل في جملة زمنية عربية سلسة، مع استئناف الحديث عن أبلّوس.
- source_word: συνεβάλετο πολὺ
  choice: قدّم عونًا كبيرًا
  rationale: ينقل معنى المساعدة النافعة والكبيرة بعبارة عربية فصيحة وواضحة، ويتلاءم مع مفعول المنفعة الوارد بعده.
- source_word: τοῖς πεπιστευκόσιν
  choice: للذين آمنوا
  rationale: يحفظ دلالة الإيمان الذي تحقق واستقر، من غير افتعال صيغة عربية ثقيلة لمحاكاة التام اليوناني.
- source_word: διὰ τῆς χάριτος
  choice: بالنعمة
  rationale: عبارة موجزة تحفظ معنى الوسيلة، وتربطها في النص الرئيس بإيمانهم، من غير إضافة «الله» لأنها غير مصرّح بها في اليونانية.
theological_decisions:
- issue: موضع تعلّق عبارة διὰ τῆς χάριτος
  choice: 'تتعلّق العبارة بالذين آمنوا: «للذين آمنوا بالنعمة»'
  alternative: 'تتعلّق بعون أبلّوس: «قدّم بالنعمة عونًا كبيرًا للذين آمنوا»'
  rationale: الأقرب نحويًا وسياقيًا أن تصف العبارة كيفية إيمانهم، لكن تركيب اليونانية يسمح بتعلّقها بمساعدة أبلّوس؛ لذلك أُثبت الوجه الأرجح في المتن وحُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أخائية» اسمًا تاريخيًا للإقليم، وحُفظ «الإخوة» وفق الصيغة اليونانية مع إدراك إمكان استعمالها للجماعة المؤمنة الأوسع. وُضع مؤشر الحاشية بعد موضع الغموض النحوي مباشرة.
