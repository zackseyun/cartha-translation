translation:
  language: ar
  text: 'قائلين: «هذا الرجل يقنع الناس بأن يعبدوا الله على خلاف الشريعة».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ضد الشريعة» أو «بما ينتهك الشريعة».'
    reason: lexical_alternative
  - marker: b
    text: 'يرجح أن المتَّهِمين يقصدون الشريعة اليهودية، مع أن اليونانية تقول فقط: «الشريعة».'
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'قائلين: «...»'
  rationale: اسم الفاعل هنا يقدّم مضمون الاتهام، وعلامتا النقطتين والاقتباس تنقلان ὅτι طبيعيًّا بوصفه مدخلًا إلى القول المباشر.
- source_word: Παρὰ τὸν νόμον
  choice: على خلاف الشريعة
  rationale: تفيد παρά مع المنصوب المخالفة أو التجاوز. وتحافظ هذه الصياغة على النبرة القانونية من غير أن تحسم هل المقصود مجرد التعارض أم الانتهاك.
- source_word: ἀναπείθει
  choice: يقنع
  rationale: ينقل معنى التأثير في الآخرين واستمالتهم، من غير إدخال معنى سلبي أقوى مثل «يضلّل»، وهو معنى لا يفرضه اللفظ اليوناني.
- source_word: οὗτος
  choice: هذا الرجل
  rationale: يحفظ قوة الإشارة في سياق الاتهام من غير صياغة ازدرائية زائدة.
- source_word: τοὺς ἀνθρώπους
  choice: الناس
  rationale: لفظ ἄνθρωποι عام هنا ويشير إلى البشر، لا إلى الذكور وحدهم.
- source_word: σέβεσθαι τὸν θεόν
  choice: بأن يعبدوا الله
  rationale: يشير σέβομαι في هذا السياق إلى التعبد الديني؛ و«يعبدوا الله» تعبير عربي واضح وطبيعي.
- source_word: τὸν νόμον
  choice: الشريعة
  rationale: «الشريعة» أنسب في العربية لهذا السياق الديني القانوني، مع عدم إضافة وصف «اليهودية» الذي لا يرد صراحة في اليونانية.
theological_decisions:
- issue: مرجع «الشريعة» في الاتهام
  choice: إبقاء «الشريعة» بلا وصف في المتن
  alternative: الشريعة اليهودية؛ شريعتنا
  rationale: يرجح سياقًا أن المتهمين يقصدون الشريعة اليهودية، لكن النص اليوناني يقول فقط «الشريعة»، ولذلك تُحفظ هذه الدرجة من عدم التصريح في المتن ويُشرح المرجع المحتمل في الحاشية.
- issue: دلالة ἀναπείθει الأخلاقية
  choice: يقنع
  alternative: يضلّل؛ يستميل
  rationale: لا يفرض الفعل في ذاته حكمًا بأن الإقناع تضليل، فلا ينبغي استيراد هذا الحكم من موقف المتهمين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الشريعة» بدل «القانون» لتناسب المرجع الديني المرجح، مع إبقاء العبارة غير موصوفة حفظًا لصياغة الأصل. وُضعت علامتا الحاشية بعد الجملة التي تتصلان بها.
