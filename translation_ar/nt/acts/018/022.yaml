source:
  edition: SBLGNT
  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: ar
  text: وبعدما نزل إلى قيصرية، صعد وسلَّم على الكنيسة[a]، ثم نزل إلى أنطاكية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي على الأرجح الكنيسة في أورشليم؛ فكثير من الترجمات تذكر أورشليم صراحة هنا، لكنها غير مذكورة في النص اليوناني.
    reason: توضيح الوجهة المرجحة مع الحفاظ على عدم تصريح الأصل بها.
lexical_decisions:
- source_word: κατελθὼν
  choice: بعدما نزل
  rationale: صيغة اسم الفاعل الأوريستي تدل على فعل سابق للفعل الرئيس، وتحافظ «نزل» على لغة لوقا الاتجاهية والطبوغرافية.
- source_word: Καισάρειαν
  choice: قيصرية
  rationale: الصيغة العربية المألوفة لاسم المكان، والمقصود من السياق قيصرية الساحلية.
- source_word: ἀναβὰς
  choice: صعد
  rationale: تحافظ على الدلالة الاتجاهية من غير إضافة «إلى أورشليم»، لأن الوجهة غير مصرَّح بها في النص اليوناني.
- source_word: ἀσπασάμενος
  choice: سلَّم على
  rationale: تعبير عربي طبيعي ودقيق لمعنى التحية في هذا السياق، وأقل تفسيرًا من «زار».
- source_word: τὴν ἐκκλησίαν
  choice: الكنيسة
  rationale: المقابل العربي المألوف للجماعة المسيحية في سياق سفر أعمال الرسل.
- source_word: κατέβη
  choice: نزل
  rationale: يحفظ التعبير الاتجاهي والطبوغرافي وأسلوب لوقا في وصف السفر.
- source_word: Ἀντιόχειαν
  choice: أنطاكية
  rationale: الصيغة العربية القياسية، ويُفهم من السياق أنها أنطاكية السورية.
theological_decisions:
- issue: هل تُذكر أورشليم صراحةً بوصفها الوجهة المفهومة من «صعد»؟
  choice: إبقاء الوجهة ضمنية في المتن
  alternative: «صعد إلى أورشليم وسلَّم على الكنيسة»
  rationale: تسلسل الرحلة يرجّح أن المقصود هو الصعود إلى أورشليم، لكن النص اليوناني لا يسمّيها؛ لذلك تُحفظ دلالة النص واحتماله من غير توسيع تفسيري، ويُذكر الترجيح في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة؛ استُخدم «سلَّم على» بدل «حيّا» لطبيعته في السرد، وحُفظت أفعال الاتجاه كما في اليونانية.
