  footnotes:
  - marker: a
    text: أو «من أمام منصة القضاء» أو «من المحكمة»؛ تشير الكلمة اليونانية βῆμα إلى المقعد الرسمي للقاضي أو المنصة التي تُعقد عندها المحاكمة.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: أداة عطف تواصل السرد ببساطة، من غير إضافة دلالة زمنية أو سببية غير مصرّح بها.
- source_word: ἀπήλασεν
  choice: طردهم
  rationale: الفعل يدل هنا على إبعاد حازم بسلطة، و«طرد» يحفظ هذه القوة بصورة طبيعية وموجزة.
- source_word: αὐτοὺς
  choice: هم (ضمير المفعول في «طردهم»)
  rationale: يحيل الضمير إلى المذكورين في السياق السابق من غير تحديد زائد.
- source_word: ἀπὸ τοῦ βήματος
  choice: من أمام كرسي القضاء
  rationale: يشير βῆμα في هذا السياق إلى المقعد الرسمي أو المنصة التي تُنظر عندها القضايا؛ وإضافة «أمام» توضّح أن المطرودين أُبعدوا عن موضع المحاكمة، لا أنهم كانوا فوق الكرسي نفسه.
