  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: ar
  text: وكان يحاور في المجمع كلَّ سبت، ساعيًا إلى إقناع اليهود واليونانيين[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يناقش» أو «يناظر»؛ فالفعل اليوناني قد يدل على حوار قائم على الاستدلال أو على المحاجّة.
    reason: lexical_alternative
  - marker: b
    text: 'أو «وكان يقنع». وقد تبرز صيغة الماضي الناقص استمرار السعي، ولذلك يمكن فهمها: «كان يحاول إقناع».'
    reason: lexical_alternative
  - marker: c
    text: 'قد يكون المقصود يونانيين لهم صلة بالمجمع؛ ويفهم بعضهم اللفظ بمعنى أوسع: «الأمميين».'
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: كان يحاور
  rationale: الفعل في صيغة الماضي الناقص يدل على نشاط متكرر ومستمر، و«يحاور» تنقل معنى النقاش القائم على الاستدلال من غير أن تحصره في خصومة أو مناظرة حادة.
- source_word: δὲ
  choice: الواو في «وكان»
  rationale: أداة ربط سردية خفيفة هنا، فنقلتها الواو العربية الطبيعية من غير إظهار تباين قوي.
- source_word: ἐν τῇ συναγωγῇ
  choice: في المجمع
  rationale: ترجمة مكانية مباشرة، و«المجمع» هو التعبير العربي المألوف لموضع اجتماع اليهود وعبادتهم.
- source_word: κατὰ πᾶν σάββατον
  choice: كلَّ سبت
  rationale: تنقل الدلالة التوزيعية للعبارة، وتنسجم مع تكرر الفعل الذي تفيده صيغة الماضي الناقص.
- source_word: ἔπειθέν
  choice: ساعيًا إلى إقناع
  rationale: تحفظ دلالة النشاط المستمر الموجَّه إلى الإقناع، من غير أن توحي بأن جميع السامعين اقتنعوا بالفعل.
- source_word: τε
  choice: منقولة ضمن تركيب الجملة بلا حرف مستقل
  rationale: تربط فعل الإقناع بما سبقه ربطًا خفيفًا؛ وقد أدّى التركيب العربي هذا الربط طبيعيًا من غير تكرار عاطف ثقيل.
- source_word: Ἰουδαίους
  choice: اليهود
  rationale: يدل اللفظ هنا على اليهود بوصفهم جماعة إثنية دينية، لا على سكان اليهودية وحدهم.
- source_word: Ἕλληνας
  choice: اليونانيين
  rationale: يحافظ على اللفظ المحدد في الأصل ولا يعممه إلى «الأمم» ولا يضيف وصف «خائفي الله» غير المذكور صراحة.
theological_decisions:
- issue: هوية Ἕλληνας في سياق المجمع
  choice: اليونانيين من غير مزيد من التحديد
  alternative: الأمميين؛ أو اليونانيين من خائفي الله
  rationale: يسميهم النص «يونانيين» فقط. وقد يكونون من غير اليهود المرتبطين بالمجمع، لكن الآية لا تصفهم صراحة بخائفي الله؛ لذلك أبقيت الاحتمال مفتوحًا.
- issue: هل يفيد ἔπειθέν نجاح الإقناع أم محاولة مستمرة؟
  choice: ساعيًا إلى إقناع
  alternative: وكان يقنع
  rationale: يمكن أن يُترجم الفعل حرفيًا بصيغة «كان يقنع»، لكن الماضي الناقص في هذا السياق يسمح بإبراز السعي المتكرر من غير الجزم بأن الإقناع تحقق لدى الجميع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «كان يحاور» لإظهار التكرر والاستمرار، و«ساعيًا إلى إقناع» لصون الفرق بين جهد الإقناع ونجاحه، مع إبقاء «اليونانيين» كما في الأصل وعدم تضييق هويتهم.
