  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: ar
  text: أمّا كريسبُس، رئيس المجمع، فآمن بالرب مع جميع أهل بيته. وكان كثيرون من الكورنثيين يسمعون فيؤمنون ويُعمَّدون.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز أن تُصاغ العبارة بأسلوب أكثر سلاسة: «وكثيرون من الكورنثيين، لمّا سمعوا، آمنوا وتعمّدوا». تستعمل اليونانية صيغًا تصوّر هذه الاستجابة وهي تتوالى مع الزمن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρίσπος
  choice: كريسبُس
  rationale: نقل صوتي للاسم الشخصي اليوناني بصيغة واضحة في العربية.
- source_word: ἀρχισυνάγωγος
  choice: رئيس المجمع
  rationale: تعبير موجز وطبيعي يدل على المسؤول القيادي في المجمع اليهودي من غير تحديد زائد لطبيعة منصبه الإدارية.
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: آمن بالرب
  rationale: ينقل فعل الإيمان وصيغة الاسم «الرب» كما وردت، من غير توسيعها إلى «الرب يسوع» رغم وضوح المرجع من السياق.
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: مع جميع أهل بيته
  rationale: يفيد οἶκος هنا أهل البيت لا المبنى، وتحفظ العبارة معنى المصاحبة والشمول.
- source_word: πολλοὶ τῶν Κορινθίων
  choice: كثيرون من الكورنثيين
  rationale: يحفظ التركيب التبعي الدال على كثيرين من بين أهل كورنثوس.
- source_word: ἀκούοντες
  choice: يسمعون
  rationale: يحافظ على الحدث المتزامن المتكرر، مع إبقاء مفعول السماع مفهومًا من السياق كما في اليونانية.
- source_word: ἐπίστευον
  choice: فيؤمنون
  rationale: المضارع العربي في سياق «كان» مع الفاء يصوّر استجابة كانت تتوالى، وهو أنسب من ماضٍ بسيط لإبراز الجانب غير التام في اليونانية.
- source_word: ἐβαπτίζοντο
  choice: ويُعمَّدون
  rationale: يحفظ البناء للمجهول والجانب الاستمراري أو المتكرر للفعل اليوناني.
theological_decisions:
- issue: مدى اشتراك أهل البيت في الإيمان
  choice: إبقاء العبارة «آمن بالرب مع جميع أهل بيته» من غير شرح لكيفية إيمان كل فرد.
  alternative: التصريح بأن كل فرد آمن شخصيًا، أو اعتبار العبارة وصفًا جماعيًا محضًا.
  rationale: النص يصف كريسبُس مؤمنًا مع جميع أهل بيته، لكنه لا يفصّل طبيعة مشاركة كل فرد؛ لذلك تُحفظ سعة العبارة من غير حسم مذهبي.
- issue: مرجع لقب «الرب»
  choice: ترجمة κύριος بـ«الرب» فقط.
  alternative: «الرب يسوع».
  rationale: يرجح السياق في أعمال الرسل أن المقصود هو يسوع، لكن الأصل في هذه الآية يورد اللقب وحده، فحُفظ كما هو.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «رئيس المجمع» بوصفه تعبيرًا مفهومًا للدور، وحُفظ تدرّج الاستجابات في الجملة الثانية من غير التضحية بسلاسة الأسلوب.
