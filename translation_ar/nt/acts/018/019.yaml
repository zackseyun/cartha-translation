lexical_decisions:
- source_word: κατήντησαν
  choice: وصلوا
  rationale: يدل الفعل على بلوغ مقصد أو الوصول إليه، وصيغة الجمع محفوظة كما في اليونانية.
- source_word: δὲ
  choice: و / أمّا
  rationale: أُدّيت الأداة الأولى بواو السرد، والثانية بـ«أمّا» لإبراز المقابلة بين بقاء رفيقي بولس ودخوله هو إلى المجمع.
- source_word: κἀκείνους
  choice: هما
  rationale: الضمير يعود بحسب السياق السابق إلى أكيلا وبريسكلا. وتقتضي العربية الطبيعية استعمال ضمير التثنية، مع إبقاء الاسمين خارج متن الآية.
- source_word: κατέλιπεν
  choice: ترك
  rationale: ينقل معنى إبقاء شخصين في موضع مع مواصلة الفاعل طريقه أو نشاطه.
- source_word: αὐτοῦ
  choice: هناك
  rationale: استُعملت للدلالة المكانية، أي في أفسس.
- source_word: αὐτὸς
  choice: هو
  rationale: حُفظ توكيد الضمير والمقابلة بصيغة «أمّا هو».
- source_word: εἰσελθὼν
  choice: فدخل
  rationale: حُوّلت صيغة اسم الفاعل الظرفية إلى فعل متتابع طبيعي في العربية يهيئ للفعل الرئيس.
- source_word: συναγωγήν
  choice: المجمع
  rationale: «المجمع» هو التعبير العربي الواضح للمكان اليهودي المخصص للاجتماع والعبادة في هذا السياق.
- source_word: διελέξατο
  choice: تحاور مع
  rationale: يفيد الفعل حديثًا قائمًا على العرض والمناقشة المتبادلة، لا مجرد خطاب أحادي ولا خصومة حادة بالضرورة.
- source_word: τοῖς Ἰουδαίοις
  choice: اليهود
  rationale: ترجمة مباشرة للتسمية الإثنية الدينية، من غير تضييقها على القادة.
