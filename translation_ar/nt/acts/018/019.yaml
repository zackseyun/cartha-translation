  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: ar
  text: ووصلوا إلى أفسس[a]، فتركهم هناك[b]. أمّا هو فدخل المجمع وتحاور[c] مع اليهود.
  philosophy: optimal-equivalence
