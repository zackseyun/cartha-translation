review_pass:
  verdict: revise
  source_fidelity: 'الترجمة دقيقة في معظم عناصرها: «جدّفوا» تحافظ على اتساع βλασφημούντων من غير تعيين متعلَّقه، و«نفض ثيابه» و«دمكم على رؤوسكم أنتم» و«أنا بريء» و«غير اليهود» تعكس النص والسياق على نحو سليم. لكن «أمّا هم فقاوموا» لا تُظهر بوضوح القيمة الزمنية للتركيب اليوناني في سياق «ولكن حين/لما كانوا يعارضون».'
  naturalness: الفصحى سليمة والنبرة مناسبة، إلا أن افتتاح الآية بـ«أمّا هم فقاوموا» أقل سلاسة وأضعف اتصالًا زمنيًا من «ولكن لما قاوموا وجدّفوا». كما ينبغي وضع علامة الحاشية الخاصة بـ«غير اليهود» مباشرة بعد العبارة التي تشرحها.
  terminology: «جدّفوا» اختيار مباشر ومشروع للفعل اليوناني، ولا يضيف مفعولًا غير مذكور. و«غير اليهود» يبين المقصود السياقي من τὰ ἔθνη، مع إبقاء «الأمم» في الحاشية. مصطلح «بريء» مناسب لمعنى καθαρὸς هنا، أي البراءة من التبعة.
