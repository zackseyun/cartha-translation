  to: 'ولكن لما قاوموا وجدّفوا، نفض ثيابه وقال لهم: «دمكم على رؤوسكم أنتم![a] أنا بريء. ومن الآن سأذهب إلى غير اليهود[b].»'
  rationale: عُدّل الافتتاح إلى «ولكن لما» لإظهار الرابط الزمني والمقابلة في النص اليوناني مع الحفاظ على الإيجاز والفصحى الواضحة. ونُقلت علامة الحاشية b لتتصل مباشرة بعبارة «غير اليهود». ولم يُغيَّر معنى الآية أو درجة الغموض في «جدّفوا».
