  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: ar
  text: 'ولكن لما قاوموا وجدّفوا، نفض ثيابه وقال لهم: «دمكم على رؤوسكم أنتم![a] أنا بريء. ومن الآن سأذهب إلى غير اليهود[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «دمكم على رؤوسكم» تعبير يعني أن مسؤولية العواقب تقع عليكم أنتم.
    reason: cultural_note
  - marker: b
    text: 'حرفيًا: «إلى الأمم»؛ والمقصود هنا غير اليهود.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: قاوموا
  rationale: ينقل معنى اتخاذ موقف معارض ومقاوم لبولس ورسالته، بعبارة عربية واضحة وموجزة.
- source_word: βλασφημούντων
  choice: جدّفوا
  rationale: يحافظ على الدلالة المباشرة للفعل اليوناني وعلى غموض متعلَّق التجديف، فلا يضيف «عليه» أو «ضده» مع أن النص لا يصرّح بالمفعول.
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: فنفض ثيابه
  rationale: صياغة طبيعية قريبة من اليونانية، وتبقي الإيماءة الرمزية من غير شرح داخل المتن.
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: دمكم على رؤوسكم أنتم
  rationale: يحفظ التعبير الاصطلاحي ونبرته القضائية المهيبة، مع إبراز ضمير المخاطبين الذي تكرره اليونانية.
- source_word: καθαρὸς ἐγώ
  choice: أنا بريء
  rationale: ينقل المعنى المجازي، أي انتفاء المسؤولية أو الذنب، أوضح من الترجمة الحرفية «أنا طاهر».
- source_word: ἀπὸ τοῦ νῦν
  choice: ومن الآن
  rationale: تعبير عربي طبيعي يدل على انتقال حاسم ابتداءً من هذه اللحظة.
- source_word: εἰς τὰ ἔθνη
  choice: إلى غير اليهود
  rationale: يوضح المقصود السياقي من ἔθνη في مقابل جمهور المجمع، مع إثبات البديل الحرفي في الحاشية.
- source_word: πορεύσομαι
  choice: سأذهب
  rationale: ترجمة مباشرة وطبيعية للفعل في سياق التوجه الرسالي.
theological_decisions:
- issue: صيغة المسؤولية في «دمكم على رؤوسكم»
  choice: الإبقاء على التعبير الكتابي بوصفه إعلانًا بأن تبعة العواقب تقع عليهم لا على بولس.
  alternative: فهم العبارة على أنها لعنة صريحة أقوى.
  rationale: السياق وصدى لغة الحارس والمسؤولية يؤيدان إعلان البراءة من التبعة بعد أداء الشهادة، من غير أن يفرض النص معنى اللعنة الأقوى.
- issue: متعلَّق فعل βλασφημούντων
  choice: «جدّفوا» بلا مفعول مذكور.
  alternative: «شتموه» أو «تكلموا عليه بإهانة».
  rationale: النص اليوناني لا يذكر مفعولًا، وقد يدل الفعل على التجديف أو الكلام المهين؛ لذلك تحفظ الصياغة العربية توتر الدلالة ولا تضيف أن بولس هو المتعلَّق صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. استُخدم «أمّا هم» لإظهار المقابلة التي تفيدها δέ، وحُفظت العبارة الاصطلاحية بدل تسطيحها إلى شرح. وُضعت جميع علامات الحواشي في المتن.
