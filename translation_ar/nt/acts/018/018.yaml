source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: ar
  text: وبعد أن بقي بولس أيامًا كثيرة أخرى، ودَّع الإخوة[a] وأبحر متجهًا إلى سورية، وكانت معه بريسكيلا وأكيلا. وكان قد قصَّ شعر رأسه في كنخريا[b][c]، لأنه كان عليه نذر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود بـ«الإخوة» هنا على الأرجح جماعة المؤمنين، بما فيها الرجال والنساء.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة العبارة: «حلق رأسه»؛ فالفعل اليوناني قد يدل على قص الشعر أو جزّه، ولا يحسم مقدار ما أُزيل منه.'
    reason: lexical_alternative
  - marker: c
    text: يرى بعض المفسرين أن أكيلا هو الذي قص شعره بسبب النذر، لكن تركيب اليونانية يرجّح أن المقصود هو بولس. ولا يحدد النص نوع النذر، وإن ربطه كثيرون بنذر شبيه بنذر النذير.
    reason: alternative_reading
lexical_decisions:
- source_word: προσμείνας ἡμέρας ἱκανὰς
  choice: بقي أيامًا كثيرة أخرى
  rationale: ينقل معنى الاستمرار مدة إضافية معتبرة، ويجعل اسم الفاعل السابق للفعل الرئيس طبيعيًا في العربية.
- source_word: τοῖς ἀδελφοῖς ἀποταξάμενος
  choice: ودَّع الإخوة
  rationale: تعبير عربي واضح يحفظ معنى أخذ الإذن والمفارقة، مع إبقاء اللفظ العائلي المذكر الوارد في اليونانية.
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: أبحر متجهًا إلى سورية
  rationale: يحفظ معنى الانطلاق بحرًا نحو الوجهة.
- source_word: καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: وكانت معه بريسكيلا وأكيلا
  rationale: يصوغ العبارة جملة عربية سليمة ويُبقي كليهما رفيقين لبولس دون إدماج العبارة في الفعل السابق على نحو قد يطمس بنيتها.
- source_word: κειράμενος ... τὴν κεφαλήν
  choice: كان قد قصَّ شعر رأسه
  rationale: الفعل κείρω يدل على القص أو الجز، ولا يوجب بذاته الحلاقة الكاملة؛ لذلك يتجنب النص العربي التحديد الزائد.
- source_word: ἐν Κεγχρεαῖς
  choice: في كنخريا
  rationale: تعريب واضح لاسم الميناء مع نقل حرف الجر المكاني.
- source_word: εἶχεν γὰρ εὐχήν
  choice: لأنه كان عليه نذر
  rationale: ينقل اصطلاح امتلاك النذر بوصفه التزامًا قائمًا، من غير تحديد نوع النذر.
theological_decisions:
- issue: مرجع اسم الفاعل κειράμενος
  choice: إسناد قص الشعر إلى بولس
  alternative: إسناده إلى أكيلا
  rationale: اسم الفاعل مذكر مفرد، والأقرب نحويًا أن يعود إلى بولس، فاعل الجملة الرئيس؛ ومع ذلك يُذكر الرأي الآخر في الحاشية لأنه معروف تفسيريًا.
- issue: طبيعة النذر εὐχή
  choice: نذر غير محدد النوع
  alternative: نذر نذير
  rationale: النص يقول «نذرًا» فقط ولا يصرح بأنه نذر نذير، فلا تُضاف خصوصية طقسية غير منصوص عليها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تسلسل الأفعال، واستُخدم «قصَّ شعر رأسه» لتجنب الجزم بالحلاقة الكاملة، و«كان عليه نذر» للتعبير الطبيعي عن التزام النذر دون تعيين نوعه.
