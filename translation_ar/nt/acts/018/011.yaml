  text: فأقام هناك سنةً وستةَ أشهر، يعلِّم بينهم كلمة الله.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: أقام هناك
  rationale: الفعل يعني حرفيًا «جلس»، لكنه يُستعمل هنا سياقيًا بمعنى المكث أو الإقامة مدةً في مكان؛ و«أقام هناك» تعبير عربي طبيعي يحفظ هذا المعنى.
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تصل إقامة بولس بما سبق من تشجيع إلهي؛ والفاء تلائم تتابع السرد من غير أن تضيف معنى تعارض قوي.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: سنةً وستةَ أشهر
  rationale: ترجمة مباشرة للمفعول فيه الدال على مدة الإقامة، بصياغة عربية فصيحة وطبيعية.
- source_word: διδάσκων
  choice: يعلِّم
  rationale: يحفظ معنى الفعل المستمر المصاحب لإقامته، وتؤدي الجملة الحالية هذا المعنى بوضوح في العربية.
- source_word: ἐν αὐτοῖς
  choice: بينهم
  rationale: تفيد العبارة الحضور والنشاط في وسط الجماعة؛ و«بينهم» أوضح وأطبع عربيًا من الترجمة الحرفية «فيهم».
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: كلمة الله
  rationale: تحفظ العبارة الكتابية المألوفة والرنين اللاهوتي للأصل، مع إمكان فهمها بوصفها رسالة الله المُعلنة.
