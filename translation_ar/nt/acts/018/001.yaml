  text: بعد ذلك غادر أثينا وذهب إلى كورنثوس.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: بعد ذلك
  rationale: تعبير انتقالي زمني طبيعي في العربية، يحفظ تتابع أحداث السرد من غير تكلّف حرفي.
- source_word: χωρισθεὶς
  choice: غادر
  rationale: اسم الفاعل اليوناني المبني للمجهول يُستعمل هنا استعمالًا اصطلاحيًا بمعنى الرحيل عن مكان؛ و«غادر» يؤدي المعنى بوضوح وطبيعية.
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: أثينا
  rationale: حرف الجر ἐκ يدل على الانطلاق من المكان، وهذا المعنى متضمن طبيعيًا في تعدية «غادر» إلى اسم المدينة مباشرة.
- source_word: ἦλθεν
  choice: ذهب
  rationale: مع أن الفعل قد يعني «جاء»، فإن «ذهب» أنسب في السرد العربي لحركة بولس من أثينا إلى مدينة أخرى، من غير تغيير للاتجاه المقصود.
- source_word: εἰς Κόρινθον
  choice: إلى كورنثوس
  rationale: حرف الجر εἰς يدل على الحركة نحو المكان أو إليه، و«إلى كورنثوس» هي الصياغة العربية الطبيعية للسفر بين مدينتين.
