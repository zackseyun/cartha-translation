  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: ar
  text: وبعد أن غادر ذلك المكان، دخل بيتَ رجلٍ اسمه تيتيوس يوستوس، كان يعبد الله[a]، وكان بيته ملاصقًا للمجمع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان يتقي الله» أو «كان من عابدي الله». تصف العبارة اليونانية أمميًا متعبدًا لإله إسرائيل.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كان متاخمًا للمجمع» أو «كان يشترك مع المجمع في حد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: وانتقل من هناك
  rationale: ينقل فعل الحركة والابتعاد عن الموضع السابق بصياغة عربية طبيعية، مع إبقاء تسلسل الحدث السابق للفعل الرئيس.
- source_word: εἰσῆλθεν εἰς οἰκίαν τινὸς
  choice: فدخل بيت رجل
  rationale: الفاء تُظهر تعاقب الانتقال والدخول، و«بيت رجل» تؤدي معنى الإضافة مع ضمير التنكير من غير تكلف عبارة «رجل معين».
- source_word: ὀνόματι Τιτίου Ἰούστου
  choice: اسمه تيتيوس يوستوس
  rationale: صياغة عربية مألوفة للتعريف بالاسم، مع نقل الاسمين عن اليونانية صوتيًا.
- source_word: σεβομένου τὸν θεόν
  choice: كان يعبد الله
  rationale: تؤدي المعنى الوصفي للمشاركة اليونانية بوضوح، من غير تحويلها في المتن إلى لقب اجتماعي ديني اصطلاحي.
- source_word: συνομοροῦσα
  choice: ملاصقًا
  rationale: يفيد أن البيت كان متاخمًا للمجمع أو مشتركًا معه في حد، وهو أدق وأفصح من تعبير قد يوحي بمجرد القرب.
- source_word: τῇ συναγωγῇ
  choice: للمجمع
  rationale: «المجمع» هو المقابل العربي المألوف للسυναγωγή في سياق دور العبادة اليهودية.
theological_decisions:
- issue: وصف تيتيوس يوستوس بعبارة σεβόμενος τὸν θεόν
  choice: كان يعبد الله
  alternative: كان يتقي الله؛ كان من عابدي الله
  rationale: النص يصف تعبده لله، لكنه لا يفرض في المتن لقبًا تقنيًا من قبيل «متقي الله» بوصفه فئة اجتماعية دينية محددة. تحافظ الصياغة الوصفية على المعنى دون زيادة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت جملتان فعليتان متعاقبتان لإبراز حركة بولس ثم دخوله، واستُعمل «ملاصقًا» لبيان التجاور البنيوي لا مجرد القرب المكاني. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرهما الحاشيتان.
