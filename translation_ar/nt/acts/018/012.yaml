lexical_decisions:
- source_word: Γαλλίωνος
  choice: غاليون
  rationale: نقل صوتي للاسم اليوناني بصيغة عربية واضحة ومألوفة في الترجمات الكتابية.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد انتقالًا سرديًّا فيه مسحة من المقابلة مع ما سبق.
- source_word: ἀνθυπάτου ὄντος
  choice: حين كان ... حاكمًا قنصليًّا
  rationale: ينقل التركيب المطلق في اليونانية بوصفه إطارًا زمنيًّا، ويحافظ على اللقب الإداري الروماني المحدد بدل تعميمه إلى مجرد «حاكم».
- source_word: Ἀχαΐας
  choice: أخائية
  rationale: الصيغة العربية الشائعة لاسم المقاطعة الرومانية.
- source_word: κατεπέστησαν
  choice: هبَّ ... على
  rationale: يعبّر عن التحرك العدائي ضد بولس من غير أن يفترض وقوع عنف جسدي لم يصرّح به النص.
- source_word: ὁμοθυμαδὸν
  choice: معًا
  rationale: ينقل معنى العمل المتضافر والموحّد بلغة عربية طبيعية موجزة.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: يحافظ على اللفظ الصريح في النص اليوناني من غير تضييقه إلى «القادة»، مع حاشية تمنع تعميمه على جميع اليهود.
- source_word: τῷ Παύλῳ
  choice: على بولس
  rationale: يتلاءم حرف الجر «على» مع فعل التحرك العدائي «هبَّ» ويبيّن أن بولس هو المستهدف.
- source_word: ἤγαγον αὐτὸν
  choice: اقتادوه
  rationale: يناسب سوق شخص إلى جهة قضائية من غير إضافة إيحاء «الجرّ» القسري الأشد.
- source_word: ἐπὶ τὸ βῆμα
  choice: إلى منصة القضاء
  rationale: يبيّن أن المقصود المنصة أو المقعد الرسمي الذي تُنظر أمامه القضايا، بصياغة مفهومة للقارئ المعاصر.
theological_decisions:
- issue: دلالة οἱ Ἰουδαῖοι في سياق نزاع
  choice: اليهود
  alternative: قادة اليهود؛ بعض اليهود المحليين
  rationale: النص يقول حرفيًّا «اليهود» ولا يحدد القادة وحدهم. لكن السياق يتحدث عن الجماعة المحلية التي تحركت ضد بولس، ولذلك توضّح الحاشية حدود المرجع من غير تغيير ألفاظ المتن.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة سردية رصينة. استُخدم «حاكمًا قنصليًّا» للمحافظة على دقة اللقب الروماني، و«منصة القضاء» لإيضاح المشهد القانوني. وُضع مؤشر الحاشية [a] بعد «اليهود» لأن الحاشية تشرح مرجع هذه العبارة.
