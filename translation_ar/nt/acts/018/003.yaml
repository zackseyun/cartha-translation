review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، لكن إضافة «معهما» مع «وعمل» ليست مصرّحًا بها في اليونانية؛ فالنص يقول إنه أقام لديهما وعمل، دون تحديد صريح أنه عمل معهما. كما أن الحاشية الحالية تجعل البديل «كان يعمل في صناعة الجلود مثلهما»، وهو أوسع من دلالة اللفظ ولا يلائم موضع الإحالة.
  naturalness: الصياغة فصيحة في الجملة، لكن «بحكم حرفتهما» بعد «صانعي خيام» ثقيلة قليلًا. و«إذ كانت حرفتهما صناعة الخيام» أوضح وأيسر في العربية الحديثة.
  terminology: «صانعا خيام» هو المعنى التقليدي والأرجح لـ σκηνοποιοί. ويجوز حفظ احتمال أوسع في الحاشية، بصياغته بوصفه احتمالًا معجميًا للعاملين في الجلود أو الحرفة المتصلة بها، دون الجزم بأنه الوصف المقصود.
