    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: ولأنه كان يمتهن الحرفة نفسها
  rationale: تفيد صيغة διά مع المصدر المعرّف السببية، وتدل ὁμότεχνος على الاشتراك في الحرفة. والصياغة العربية واضحة وتحافظ على العلاقة السببية من غير استباق لتحديد نوع الحرفة.
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: أقام عندهما
  rationale: يفيد μένω البقاء أو الإقامة، وπαρ’ αὐτοῖς هنا يشير إلى الإقامة لدى أكيلا وبريسكلا. و«أقام عندهما» تعبير عربي طبيعي ملائم للسياق.
- source_word: ἠργάζετο
  choice: وعمل معهما
  rationale: يدل الفعل على مزاولة العمل، وصيغة الماضي الناقص توحي بالاستمرار. أُضيف «معهما» لإظهار أن العمل كان في إطار الحرفة المشتركة، وهو مفهوم من السياق اليوناني.
- source_word: σκηνοποιοὶ
  choice: صانعي خيام
  rationale: المعنى التقليدي والأرجح للكلمة هو صانعو الخيام، مع بقاء احتمال دلالتها الأوسع على العاملين بالجلود أو بحرفة متصلة بصناعة الخيام؛ لذلك أُثبت البديل في الحاشية.
- source_word: τῇ τέχνῃ
  choice: بحكم حرفتهما
  rationale: تشير τέχνη إلى الحرفة أو المهنة، واستعمال الداتيف هنا يبيّن أن صنع الخيام كان حرفتهما المعتادة لا عملاً عارضًا.
