revisions:
- from: ولأنه كان يمتهن الحرفة نفسها[a]، أقام عندهما وعمل معهما، إذ كانا صانعي خيام بحكم حرفتهما.
  to: ولأنه كان يمارس الحرفة نفسها، أقام عندهما وعمل، إذ كانت حرفتهما صناعة الخيام[a].
  rationale: حُذفت الإضافة غير المصرح بها «معهما»، ونُقلت إحالة البديل المعجمي إلى «صناعة الخيام» حيث تقع الكلمة اليونانية المعنية. كما عُدّلت الحاشية لتذكر الاحتمال المعجمي دون إدخال عناصر سردية أو مقارنة غير موجودة في الأصل، وصيغت خاتمة الآية بأسلوب عربي حديث طبيعي يحفظ أن صنع الخيام كان مهنتهما.
  reviewer_model: gpt-5.6-terra
