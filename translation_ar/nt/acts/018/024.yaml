base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: ar
  text: ووصل إلى أفسس يهوديٌّ اسمه أبلوس، إسكندريّ الأصل، وكان رجلًا بليغًا[a] ومتمكّنًا من الكتب المقدسة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «رجلًا عالمًا»؛ فاللفظة اليونانية λόγιος قد تدل على الفصاحة أو على سعة العلم.
    reason: بديل معجمي يحفظ الغموض الحقيقي في اللفظة اليونانية.
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: يهوديٌّ
  rationale: يدل هنا على انتماء أبلّوس اليهودي الديني والقومي، لا على كونه من منطقة اليهودية، إذ يذكر النص أنه من الإسكندرية.
- source_word: δέ
  choice: و
  rationale: أداة انتقال سردي خفيفة؛ والواو تنقل هذا الترابط طبيعيًا من غير أن توحي بتعارض قوي أو بزمن غير مصرّح به.
- source_word: τις
  choice: التنكير في «يهوديٌّ»
  rationale: يُدخل اللفظ شخصًا جديدًا بقدر من عدم التعيين، ويؤدي التنكير العربي هذا المعنى طبيعيًا من غير إضافة تعبير ثقيل مثل «يهوديّ ما».
- source_word: Ἀπολλῶς ὀνόματι
  choice: اسمه أبلّوس
  rationale: صياغة عربية واضحة وطبيعية للتعبير الاصطلاحي الذي يعرّف باسم الشخص.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: من أهل الإسكندرية
  rationale: ينقل منشأه وانتماءه إلى الإسكندرية بلغة عربية طبيعية، من غير استعمال ألفاظ حديثة قد توهم معنى عرقيًا.
- source_word: ἀνὴρ λόγιος
  choice: رجلًا بليغًا
  rationale: يحافظ على دلالة ἀνήρ المذكرة، ويترجم λόγιος بمعنى الفصاحة، مع إثبات معنى «متعلّمًا» الممكن في الحاشية.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: وصل إلى أفسس
  rationale: ينقل بلوغ الوجهة بصياغة عربية موجزة وطبيعية، ويحافظ على اتجاه الحركة إلى المدينة.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: وكان متمكّنًا من الكتب المقدسة
  rationale: يعبر «متمكّنًا» عن المقدرة الراسخة والمعرفة القوية المقصودة من δυνατός، وتشير «الكتب المقدسة» في هذا السياق اليهودي إلى الأسفار المعترف بقداستها.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت الواو للانتقال السردي، وتُركت دلالة τις للتنكير الطبيعي في العربية. تجنبت الصياغة ألفاظًا قديمة ثقيلة، وحافظت الحاشية على الاحتمالين الدلاليين للفظة λόγιος.
