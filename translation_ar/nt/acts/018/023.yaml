  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: ar
  text: وبعد أن أمضى هناك بعض الوقت، رحل، وجال بالتتابع في إقليم غلاطية وفريجية، مثبِّتًا جميع التلاميذ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مارًّا بالترتيب في إقليم غلاطية وفريجية»، أو: «متنقّلًا تباعًا في إقليم غلاطية وفريجية».'
    reason: بدائل لفظية لعبارتي διερχόμενος وκαθεξῆς، إذ يمكن فهمهما بوصفهما مرورًا متسلسلًا عبر المناطق.
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: بعد أن أمضى هناك بعض الوقت
  rationale: التعبير الاصطلاحي يعني قضاء مدة من الزمن. أُضيفت «هناك» اعتمادًا على السياق السابق لتوضيح أن الإقامة كانت في الموضع المذكور قبلاً.
- source_word: ἐξῆλθεν
  choice: رحل
  rationale: الفعل يعني حرفيًا «خرج»، لكنه في سياق السفر يدل طبيعيًا على مغادرة المكان والانطلاق في الرحلة.
- source_word: διερχόμενος
  choice: جال
  rationale: يصف حركة متواصلة عبر الأقاليم، و«جال» عربية طبيعية موجزة تؤدي معنى المرور والسفر خلالها.
- source_word: καθεξῆς
  choice: بالتتابع
  rationale: تفيد الكلمة التوالي أو السير وفق تسلسل، مع بقاء النص غير محدد بشأن ترتيب الأماكن الدقيق.
- source_word: τὴν Γαλατικὴν χώραν
  choice: إقليم غلاطية
  rationale: تحافظ «إقليم» على دلالة χώρα بوصفها منطقة أو ناحية، من غير حصرها تقنيًا في الولاية الرومانية.
- source_word: καὶ Φρυγίαν
  choice: وفريجية
  rationale: نُقل اسم الموضع بصيغته العربية المألوفة، ويُفهم «إقليم» دلاليًا مع الاسمين من دون تكرار ثقيل.
- source_word: στηρίζων
  choice: مثبِّتًا
  rationale: يدل الفعل على جعل شخص ثابتًا أو قويًا. «مثبِّتًا» يحفظ الصورة الدلالية ولا يقصر العمل على التشجيع النفسي وحده.
- source_word: πάντας τοὺς μαθητάς
  choice: جميع التلاميذ
  rationale: «التلاميذ» هو المقابل الراسخ لأتباع يسوع في سفر الأعمال، و«جميع» تنقل πάντας بوضوح.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم تركيب خبري سلس، مع إبقاء تتابع الأفعال وحال «مثبِّتًا» قريبين من بنية النص اليوناني، والحفاظ على عدم تحديد مسار الرحلة تفصيليًا.
