  text: Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: ar
  text: ومن ميليتس أرسل إلى أفسس واستدعى شيوخ الكنيسة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أرسل في طلب شيوخ الكنيسة». يجمع النص اليوناني بين «أرسل إلى أفسس» و«استدعى»، أي إنه بعث رسالة أو رسلًا يطلب حضورهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: ومن ميليتس
  rationale: تفيد ἀπό مع المضاف إليه الانطلاق من مكان، وتنقل «من ميليتس» ذلك بوضوح. وجاءت الواو لتؤدي وظيفة δέ الرابطة الخفيفة من غير أن تضيف معنى زمنيًا أو تقابلًا قويًا.
- source_word: πέμψας εἰς Ἔφεσον
  choice: أرسل إلى أفسس
  rationale: اسم الفاعل اليوناني يدل على فعل سبق الاستدعاء أو صاحبه في تسلسل الحدث. والصياغة العربية الطبيعية «أرسل إلى أفسس» تحفظ الوجهة، من غير تحديد ما إذا كان المرسَل رسولًا أم رسالة، إذ لا يصرح النص بذلك.
- source_word: μετεκαλέσατο
  choice: استدعى
  rationale: الفعل المتوسط يفيد أنه طلب حضورهم إليه. و«استدعى» عربية واضحة تؤدي معنى طلب المجيء، من غير أن يلزم منها الإكراه.
- source_word: τοὺς πρεσβυτέρους
  choice: شيوخ
  rationale: يشير اللفظ في هذا السياق الكنسي إلى قادة معترف بهم في الجماعة، لا إلى كبار السن فحسب. و«شيوخ» تحافظ على الدلالة المألوفة من غير فرض نظام طائفي لاحق.
- source_word: τῆς ἐκκλησίας
  choice: الكنيسة
  rationale: يدل اللفظ في سياق لوقا وأعمال الرسل على جماعة المؤمنين المسيحية. و«الكنيسة» هي المقابل العربي الطبيعي المستقر هنا.
theological_decisions:
- issue: دلالة πρεσβυτέρους في السياق الكنسي
  choice: شيوخ الكنيسة بوصفهم قادة معترفًا بهم في الجماعة
  alternative: كبار السن في الجماعة، أو القسوس بوصفها تسمية تقنية لاحقة
  rationale: سياق الخطاب اللاحق واستعمال سفر الأعمال يدلان على مسؤولية قيادية، بينما يحفظ لفظ «شيوخ» المعنى من غير إدخال بنية كنسية طائفية متأخرة.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة وموقرة. حُفظ تركيب الإرسال إلى أفسس ثم الاستدعاء، مع توضيح البديل الطبيعي في الحاشية، ولم يُضف إلى النص ما يحدد وسيلة الإرسال.
