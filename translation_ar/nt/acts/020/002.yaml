lexical_decisions:
- source_word: διελθὼν
  choice: بعدما اجتاز
  rationale: اسم فاعل ماضٍ يدل على حدث سبق الفعل الرئيس؛ و«بعدما اجتاز» يحفظ هذا التعاقب بصياغة عربية طبيعية.
- source_word: τὰ μέρη ἐκεῖνα
  choice: تلك المناطق
  rationale: تشير العبارة إلى النواحي الجغرافية المذكورة في السياق، و«المناطق» أوضح من الترجمة الحرفية «الأجزاء».
- source_word: παρακαλέσας
  choice: شجّعهم
  rationale: يمكن أن يدل الفعل على التشجيع أو الحث أو التعزية. وفي سياق زيارة المؤمنين وتقويتهم، ينقل «شجّعهم» المعنى الرعوي الواسع دون حصره في الوعظ أو التوبيخ.
- source_word: αὐτοὺς
  choice: هم
  rationale: يعود الضمير على المؤمنين في المناطق المذكورة، ونُقل متصلًا بالفعل وفق الأسلوب العربي الطبيعي.
- source_word: λόγῳ πολλῷ
  choice: بكلام كثير
  rationale: يحفظ هذا الاختيار صورة العبارة اليونانية القريبة من الحرفية، مع بيان دلالاتها الاصطلاحية المحتملة في الحاشية.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: جاء إلى اليونان
  rationale: ينقل فعل الحركة والغاية الجغرافية بوضوح، مع الحفاظ على منظور النص في استعمال «جاء».
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة ذات وظيفة انتقالية، وتؤدي الواو هذه الوظيفة طبيعيًا في العربية قبل التركيب الزمني.
