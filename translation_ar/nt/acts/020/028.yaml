  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: ar
  text: انتبهوا لأنفسكم وللرعية كلها، التي أقامكم الروح القدس فيها مشرفين، لترعوا كنيسة الله[a]، التي اقتناها بدم مَن يخصّه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «كنيسة الرب» بدلًا من «كنيسة الله».'
    reason: textual_variant
  - marker: b
    text: 'أو: «التي اقتناها بدم ابنه الخاص»؛ والترجمة التقليدية: «التي اقتناها بدمه الخاص». واليونانية حرفيًا موجزة: «بدم خاصّته».'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε
  choice: انتبهوا
  rationale: فعل أمر يفيد اليقظة المستمرة والعناية الواعية، وصيغة «انتبهوا لأنفسكم» عربية طبيعية وتحفظ القوة الرعوية دون إضفاء طابع عسكري.
- source_word: παντὶ τῷ ποιμνίῳ
  choice: للرعية كلها
  rationale: تحفظ «الرعية» الاستعارة الرعوية وتدل على الجماعة كلها، مع نقل παντί بلفظ «كلها».
- source_word: ἐν ᾧ
  choice: التي ... فيها
  rationale: تحفظ معنى وجود المشرفين داخل الرعية نفسها، في تركيب عربي واضح وطبيعي.
- source_word: ἔθετο
  choice: أقامكم
  rationale: يفيد τίθημι هنا التعيين في مهمة؛ و«أقامكم» تعبير عربي كتابي واضح لا يبالغ في الطابع المؤسسي.
- source_word: ἐπισκόπους
  choice: مشرفين
  rationale: ينقل المعنى الوظيفي للإشراف والمراقبة، دون استيراد الدلالات الكنسية اللاحقة المحتملة للفظ «أساقفة».
- source_word: ποιμαίνειν
  choice: لترعوا
  rationale: يحفظ الفعل صورة الراعي المرتبطة بلفظ الرعية، وهو طبيعي في العربية.
- source_word: ἐκκλησίαν
  choice: كنيسة
  rationale: المقصود جماعة المؤمنين المسيحية، و«كنيسة» هي المقابل العربي الراسخ والواضح.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: يتبع نص SBLGNT الذي يقرأ θεοῦ؛ وتُذكر قراءة «الرب» في الحاشية بوصفها اختلافًا نصيًا.
- source_word: περιεποιήσατο
  choice: اقتنى
  rationale: ينقل معنى الاقتناء للنفس في صيغة الوسط، من غير حصر الصورة في معاملة تجارية كما قد يوحي «اشترى».
- source_word: διὰ τοῦ αἵματος
  choice: بدم
  rationale: تنقل الباء معنى الوسيلة الذي تؤديه διά مع المضاف إليه، بصياغة عربية موجزة وطبيعية.
- source_word: τοῦ ἰδίου
  choice: خاصته
  rationale: يحفظ الصفة الاسمية اليونانية المقتضبة وإبهامها المقصود نسبيًا؛ ويمكن فهمها بمعنى «الذي له»، وغالبًا ما تُفسر بأنها تشير إلى ابنه، دون إدخال كلمة «ابن» في المتن.
theological_decisions:
- issue: مرجع وقوة العبارة τοῦ αἵματος τοῦ ἰδίου
  choice: «بدم خاصته» في المتن
  alternative: «بدم ابنه الخاص» أو «بدمه الخاص»
  rationale: العبارة اليونانية موجزة ويمكن فهم ἰδίου فيها صفةً اسمية بمعنى «خاصته/الذي له»، مع تقدير «الابن» عند كثيرين، بينما درج تقليديًا فهمها «بدمه الخاص». يحفظ المتن التوتر الدلالي ولا يحسم المسألة بإضافة غير صريحة، وتوضح الحاشية القراءتين.
- issue: الاختلاف النصي في τοῦ θεοῦ
  choice: «كنيسة الله»
  alternative: «كنيسة الرب»
  rationale: يُتبع نص SBLGNT المعطى، مع إثبات القراءة النصية المهمة الأخرى في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظت الصورة الرعوية بتناسق «الرعية/ترعوا»، واستُعمل «مشرفين» لتجنب تحميل ἐπισκόπους بنية كنسية متأخرة. وُضعت علامتا الحاشية في المتن بحسب المطلوب.
