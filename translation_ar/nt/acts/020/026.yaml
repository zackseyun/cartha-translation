  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: ar
  text: لذلك أُشهِدُكم في هذا اليوم أني بريء من دم الجميع[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «طاهر من دم الجميع»؛ فالعبارة اليونانية تعني البراءة من الذنب أو المسؤولية عما يصيب الآخرين.'
    reason: lexical_alternative
  - marker: b
    text: 'يرجَّح أن هذه العبارة تلمّح إلى صورة الرقيب في حزقيال وما يرتبط بها من مسؤولية الدم (مثل حزقيال 3: 18–19؛ 33: 6–9).'
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: لذلك
  rationale: تفيد هنا الاستنتاج مما سبق في كلام بولس، و«لذلك» واضحة وطبيعية في العربية.
- source_word: μαρτύρομαι ὑμῖν
  choice: أُشهِدُكم
  rationale: صياغة عربية فصيحة ذات نبرة رسمية تحفظ معنى الإدلاء بشهادة شخصية جازمة، من غير إضافة دلالة قضائية لا يفرضها النص.
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: في هذا اليوم
  rationale: تحفظ الصيغة المؤكدة والمهيبة في الأصل، بدل اختزالها إلى «اليوم» فقط.
- source_word: καθαρός εἰμι
  choice: أني بريء
  rationale: «بريء» تؤدي في هذا السياق معنى التنزه عن الذنب والمسؤولية، وهي أوضح عربيًا من النقل الحرفي «طاهر».
- source_word: ἀπὸ τοῦ αἵματος πάντων
  choice: من دم الجميع
  rationale: تحافظ على صورة الدم الكتابية وعلى شمول πάντων، مع بقاء المعنى الاصطلاحي موضحًا في الحاشية.
theological_decisions:
- issue: معنى البراءة من دم الجميع
  choice: التحرر من الذنب أو المسؤولية عن مصير الآخرين بعد أداء واجب الإنذار والتعليم
  alternative: أن يكون المقصود فقط نفي التسبب الحرفي في موت أي شخص
  rationale: السياق المباشر يتناول أمانة بولس في إعلان مشورة الله، والعبارة تستدعي على الأرجح صورة الرقيب في حزقيال. أبقت الترجمة صورة «الدم» ولم تستبدلها بتفسير مذهبي مباشر.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «أُشهِدُكم» للمحافظة على النبرة الرسمية، وأُبقيت استعارة «الدم» لما لها من صلة كتابية مقصودة، مع شرح معناها في الحاشية.
