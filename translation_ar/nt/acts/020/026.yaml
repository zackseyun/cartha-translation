  source_fidelity: 'النص العربي ينقل بدقة البنية الاستنتاجية في «لذلك»، وفعل الشهادة الرسمي، والتحديد الزمني «في هذا اليوم»، ومحتوى الشهادة: «أني بريء من دم الجميع». ويحافظ على صورة «الدم» الاصطلاحية دون تحويلها إلى تفسير مباشر في المتن.'
  naturalness: الصياغة فصيحة واضحة وذات نبرة احتفالية مناسبة للسياق الخطابي. «أُشهِدُكم في هذا اليوم» استعمال عربي كتابي/رسمي مفهوم هنا، و«بريء من دم الجميع» تركيب عربي طبيعي يحفظ قوة العبارة.
  terminology: اختيار «بريء» مناسب لـ καθαρός في سياق ذنب الدم، و«دم الجميع» يحافظ على شمول πάντων وعلى الاستدعاء الكتابي. الحاشية (أ) تبيّن المعنى الاصطلاحي دون إلغاء الاستعارة، والحاشية (ب) تقدم إحالة حزقيال بصيغة غير جازمة ملائمة.
