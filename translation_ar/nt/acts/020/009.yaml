source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: ar
  text: وكان شابٌّ اسمه أفتيخوس جالسًا في النافذة، وقد أخذ يستغرق في نوم عميق بينما كان بولس يتحدث مدة طويلة. ولما غلبه النوم، سقط إلى أسفل من الطابق الثالث، فحُمل ميتًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فالتُقط ميتًا». يمكن أن يعني الفعل اليوناني «حُمل» أو «التُقط».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεζόμενος δέ τις νεανίας
  choice: وكان شابٌّ... جالسًا
  rationale: يصف اسم الفاعل هيئة الشاب المستمرة، وتؤدي «كان... جالسًا» هذا المعنى بصياغة عربية طبيعية. لم تُترجم τις بلفظ مستقل لأن التنكير في «شاب» يؤدي وظيفتها هنا دون ثقل.
- source_word: ὀνόματι Εὔτυχος
  choice: اسمه أفتيخوس
  rationale: تعبير عربي واضح وطبيعي للدلالة على الاسم الشخصي، مع نقل الاسم اليوناني صوتيًا.
- source_word: ἐπὶ τῆς θυρίδος
  choice: في النافذة
  rationale: تشير θυρίς إلى نافذة أو فتحة نافذة، والسياق يدل على جلوسه في موضع النافذة بحيث أمكن أن يسقط منها. تجنبت إضافة «حافتها» لأنها غير مصرّح بها.
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: فأخذ يغرق في نوم عميق
  rationale: تحفظ الصياغة معنى التدرج في استيلاء النوم عليه، كما تنقل صورة الانحدار التي يوحي بها الفعل.
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: بينما كان بولس يطيل الكلام
  rationale: التركيب يفيد استمرار بولس في الحديث مدة طويلة. «يطيل الكلام» موجزة وطبيعية، ولا تفرض معنى المناظرة على διαλέγομαι في هذا السياق.
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: ولما غلبه النوم
  rationale: تنقل اللحظة الحاسمة التي استولى فيها النوم عليه، بعد الوصف التدريجي السابق، وتوضح العلاقة الظرفية والسببية دون توسع.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: سقط إلى أسفل من الطابق الثالث
  rationale: تنقل τριστέγου بوصفه الطابق الثالث، وتحفظ دلالة κάτω الصريحة على الحركة إلى أسفل.
- source_word: ἤρθη νεκρός
  choice: فرفعوه ميتًا
  rationale: الفعل المبني للمجهول من αἴρω يحتمل الرفع أو الأخذ من الموضع. صيغة الجمع العربية طبيعية في المبني للمعلوم ذي الفاعل غير المعيّن، و«ميتًا» تحافظ على تقرير النص الصريح.
theological_decisions:
- issue: هل تُخفف دلالة νεκρός إلى «كأنه ميت» أو «ظنوه ميتًا»؟
  choice: ميتًا
  alternative: كأنه ميت / ظنوه ميتًا
  rationale: اليونانية تقرر موته مباشرة بلا علامة على الظن أو عدم اليقين؛ لذلك ينبغي إبقاء التوتر السردي واللاهوتي وعدم إدخال احتراز تفسيري.
- issue: كيفية فهم ἤρθη في خاتمة الآية
  choice: فرفعوه
  alternative: فأخذوه / فحملوه
  rationale: يحفظ «رفعوه» المعنى المباشر للفعل ويتلاءم مع رفع الجسد بعد السقوط، مع التنبيه في الحاشية إلى البديل المعجمي الممكن بدل حسمه ضمن النص.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة سردية رصينة. حافظت الصياغة على تدرج النوم ثم غلبته، وعلى التصريح بأنه كان ميتًا، وتجنبت إضافة تفاصيل غير منصوص عليها مثل حافة النافذة أو الأرض.
