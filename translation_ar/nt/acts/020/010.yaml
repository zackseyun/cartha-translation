base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: ar
  text: 'فنزل بولس وألقى بنفسه عليه وضمَّه إليه، وقال: «لا تضطربوا، لأن حياته فيه[a]».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن نفسه فيه». يمكن للكلمة اليونانية ψυχή أن تعني «الحياة» أو «النفس» أو «الذات»؛ و«الحياة» أنسب هنا لأن السياق يتناول هل مات الشاب أم هو حي.'
    reason: lexical_alternative
  - marker: b
    text: قد يُفهم كلام بولس على أن الشاب لم يكن قد مات، أو على أن حياته أُعيدت إليه؛ ولا تحسم الصياغة اليونانية نفسها أيَّ الاحتمالين هو المقصود.
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: فنزل
  rationale: يحفظ معنى النزول من موضع الاجتماع العلوي، ويصوغ اسم الفاعل اليوناني في تسلسل عربي طبيعي.
- source_word: δὲ
  choice: فـ
  rationale: تفيد الانتقال إلى استجابة بولس لما سبق، من غير إثقال العبارة بتباين أقوى مما تقتضيه الأداة اليونانية.
- source_word: ἐπέπεσεν αὐτῷ
  choice: وانكبَّ عليه
  rationale: ينقل الفعل الجسدي المباشر ويحافظ على صداه المحتمل مع مشاهد إيليا وأليشع، مع وضوح العبارة في العربية المعاصرة.
- source_word: συμπεριλαβὼν
  choice: ثم عانقه
  rationale: يفيد إحاطته بذراعيه وضمه إليه، وهو تعبير عربي موجز وطبيعي.
- source_word: Μὴ θορυβεῖσθε
  choice: لا تضطربوا
  rationale: يشمل الانفعال والبلبلة في الجمع، ويلائم خطاب بولس للجماعة بعد السقوط.
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: لأن حياته
  rationale: ψυχή هنا تتعلق بحالة الشاب بين الموت والحياة؛ واختيار «حياته» يتجنب تحميل اللفظ معنى أنثروبولوجيًا تقنيًا لا يفرضه السياق.
- source_word: ἐν αὐτῷ ἐστιν
  choice: فيه
  rationale: صياغة مباشرة تبقي العبارة محايدة بشأن ما إذا كانت الحياة لم تفارقه أم عادت إليه.
theological_decisions:
- issue: دلالة ψυχή في سياق الحياة والموت
  choice: حياته
  alternative: نفسه
  rationale: السياق يركّز على الحالة الجسدية لأفتيخوس بعد سقوطه، و«الحياة» معنى معروف للفظ اليوناني هنا، من غير تقرير مذهب خاص في طبيعة النفس.
- issue: هل لم يمت أفتيخوس أصلًا أم أُعيد إلى الحياة؟
  choice: 'إبقاء المتن محايدًا: «لأن حياته فيه»'
  alternative: «إنه حي» أو «لأن حياته عادت إليه»
  rationale: العبارة اليونانية تثبت أن حياته فيه، لكنها لا تصرّح هل بقيت فيه أم رُدّت إليه؛ لذلك لا ينبغي حسم الاحتمال في الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «انكبَّ عليه» للمحافظة على الفعل الجسدي والصدى الكتابي المحتمل، و«لا تضطربوا» لنقل الانفعال والبلبلة معًا. وُضع مؤشرا الحاشيتين في المتن، مع ربط [a] بالبديل المعجمي وربط [b] بالغموض التفسيري.
