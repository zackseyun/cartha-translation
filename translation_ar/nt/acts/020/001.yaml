base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: ar
  text: وبعد أن هدأ الشغب، أرسل بولس في طلب التلاميذ، فشجّعهم وودّعهم[a]، ثم خرج متوجّهًا إلى مقدونية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وسلّم عليهم»؛ فاللفظ اليوناني قد يدل على التحية، وقد يدل في سياق المغادرة على الوداع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον
  choice: وبعد أن هدأ الشغب
  rationale: يفيد التركيب مع μετά والتعبير بالمصدر المعرّف التعاقب الزمني بعد انتهاء الاضطراب، و«هدأ الشغب» تعبير عربي طبيعي ينقل سياق الفتنة العامة.
- source_word: μεταπεμψάμενος
  choice: أرسل بولس في طلب
  rationale: صيغة الوسط تدل على أنه أرسل من يستدعي التلاميذ إليه؛ و«أرسل في طلب» تؤدي هذا المعنى بوضوح.
- source_word: τοὺς μαθητὰς
  choice: التلاميذ
  rationale: يحافظ اللفظ على مصطلح لوقا المعتاد للدلالة على أتباع يسوع، من غير توسيعه إلى «المؤمنين».
- source_word: παρακαλέσας
  choice: فشجّعهم
  rationale: الفعل واسع الدلالة وقد يعني الحث أو التشجيع أو التعزية؛ و«شجّعهم» يلائم سياق ما بعد الاضطراب من غير حصر المعنى في التوبيخ أو المواساة.
- source_word: ἀσπασάμενος
  choice: وودّعهم
  rationale: الأصل يدل عادة على التحية، لكنه في سياق المغادرة يمكن أن يفيد أخذ الوداع؛ اختير «ودّعهم» بحسب السياق مع إثبات البديل المعجمي في الحاشية.
- source_word: ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν
  choice: ثم خرج متوجّهًا إلى مقدونية
  rationale: ينقل التعبير فعل المغادرة وقصد السفر إلى الوجهة المذكورة بلغة عربية طبيعية، مع إبقاء «خرج» مقابلاً صريحًا للفعل اليوناني.
