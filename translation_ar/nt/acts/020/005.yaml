  yaml_path: translation/nt/acts/020/005.yaml
  text: These men went on ahead and were waiting for us in Troas[a].
translation:
  language: ar
  text: هؤلاء سبقونا، وكانوا ينتظروننا في ترواس.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصورة أقرب إلى اللفظ: «هؤلاء، إذ سبقوا، كانوا ينتظروننا في ترواس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: هؤلاء
  rationale: اسم إشارة لجمع المذكر يعود على الرفقاء المذكورين سابقًا، ودلالته واضحة في السياق العربي من غير حاجة إلى إضافة «الرجال».
- source_word: δὲ
  choice: —
  rationale: أداة ربط خفيفة، ولا يلزم تمثيلها بحرف عطف صريح هنا لأن الانتقال طبيعي في العربية.
- source_word: προσελθόντες
  choice: سبقونا
  rationale: اسم فاعل يدل في سياق الرحلة على أن المذكورين تقدموا جماعة الراوي؛ و«سبقونا» عربية موجزة وطبيعية تحافظ على علاقة الحدث بما بعده.
- source_word: ἔμενον
  choice: كانوا ينتظروننا
  rationale: الفعل في صيغة الماضي الناقص يفيد الاستمرار، ومع المفعول الشخصي ἡμᾶς يدل سياقيًا على البقاء انتظارًا لوصولهم.
- source_word: ἡμᾶς
  choice: نا في «سبقونا» و«ينتظروننا»
  rationale: ضمير المتكلمين الجمع؛ صُرّح به مع الانتظار، كما أُدخل في ترجمة فعل السبق لتوضيح أن هؤلاء تقدموا جماعة الراوي، وهو ما يقتضيه السياق.
- source_word: ἐν Τρῳάδι
  choice: في ترواس
  rationale: ترجمة مكانية مباشرة لحرف الجر مع اسم الموضع.
theological_decisions: []
