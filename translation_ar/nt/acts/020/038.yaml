  text: ὀδυνώμενοι μάλιστα ἐπὶ τῷ λόγῳ ᾧ εἰρήκει ὅτι οὐκέτι μέλλουσιν τὸ πρόσωπον αὐτοῦ θεωρεῖν. προέπεμπον δὲ αὐτὸν εἰς τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/038.yaml
  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: ar
  text: وكانوا يتألّمون، ولا سيما بسبب قوله[a] إنهم لن يروا وجهه بعدُ[b]. ثم رافقوه إلى السفينة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بسبب الكلمة التي كان قد قالها».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «لن يروا وجهه بعدُ»، وهو تعبير شخصي معناه أنهم لن يروه ثانيةً.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «شيّعوه إلى السفينة»؛ فقد يدل الفعل على مرافقة المسافر تكريمًا له عند توديعه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: يتألّمون
  rationale: ينقل الألم النفسي والحزن العميق في سياق الوداع، من غير إضافة معنى الحِداد.
- source_word: μάλιστα
  choice: ولا سيما
  rationale: تبيّن أن القول المذكور كان أشد أسباب ألمهم، بصياغة عربية فصيحة وطبيعية.
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: بسبب قوله
  rationale: صياغة عربية واضحة تحفظ علاقة السبب بالقول السابق، فيما تذكر الحاشية الصورة اليونانية الأقرب إلى الحرفية.
- source_word: οὐκέτι μέλλουσιν τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: إنهم لن يروا وجهه بعدُ
  rationale: تحفظ التعبير الشخصي «وجهه» ودلالة المستقبل المنظور إليه من لحظة الكلام، وتؤدي οὐκέτι طبيعيًا من دون تقويته إلى «أبدًا».
- source_word: προέπεμπον
  choice: رافقوه
  rationale: يدل الفعل على مرافقة شخص في طريقه عند توديعه، وقد تؤدي العربية هذا المعنى بوضوح من خلال السياق والحاشية.
- source_word: εἰς τὸ πλοῖον
  choice: إلى السفينة
  rationale: ترجمة مباشرة ملائمة لسياق السفر البحري في سفر الأعمال.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «يتألّمون» لإبراز الألم الوجداني، و«لن يروا وجهه بعدُ» للمحافظة على الصورة اليونانية من غير تشديدها إلى «لن يروه أبدًا». جميع علامات الحواشي مثبتة في المتن.
