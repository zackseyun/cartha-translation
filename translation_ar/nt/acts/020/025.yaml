source:
  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: ar
  text: والآن، ها أنا أعلم أنكم جميعًا، أنتم الذين جلت بينكم معلنًا الملكوت، لن تروا وجهي بعد اليوم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ νῦν ἰδοὺ
  choice: والآن، ها أنا
  rationale: ينقل الانتقال الخطابي وأداة لفت الانتباه بصياغة عربية طبيعية مهيبة، من غير إثقال النص بتعبير حرفي مثل «انظروا».
- source_word: διῆλθον
  choice: جُلت بينكم
  rationale: يفيد تنقّل بولس في وسط المخاطَبين، ويحافظ على دلالة الاجتياز المتكرر في السياق الخدمي.
- source_word: κηρύσσων
  choice: مناديًا
  rationale: يعكس فعل الإعلان العلني، وهو أدق هنا من تعبير عام مثل «متكلمًا».
- source_word: τὴν βασιλείαν
  choice: بالملكوت
  rationale: «الملكوت» تعبير عربي كتابي واضح ومستقر، ويحافظ على الإطلاق الموجود في اليونانية من دون إضافة «ملكوت الله» غير المذكورة نصًا.
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: لن تروا وجهي بعد اليوم
  rationale: صياغة عربية طبيعية تنقل معنى عدم رؤية وجهه مرة أخرى، مع إبقاء الصورة الشخصية المباشرة.
theological_decisions:
- issue: تحديد المقصود بالملكوت
  choice: الملكوت
  alternative: ملكوت الله
  rationale: المصدر اليوناني يذكر «الملكوت» بإطلاق؛ لذلك لم تُضف عبارة تفسيرية تحدد المضاف إليه، مع أن السياق المسيحي يوضحه.
- issue: مدى النفي في ὑμεῖς πάντες
  choice: أنكم جميعًا ... لن تروا وجهي
  alternative: لن يرى وجهي أحد منكم
  rationale: يحافظ هذا على خطاب بولس المباشر للجماعة وعلى توكيد «جميعًا»، من دون تغيير المعنى إلى تركيب اسمي مختلف.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. روعي تقديم «أنكم جميعًا» ثم الجملة الوصفية الاعتراضية لتقريب بنية اليونانية مع بقاء العبارة طبيعية ومفهومة.
