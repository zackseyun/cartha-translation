base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: ar
  text: لأني لم أحجم عن أن أعلن لكم مشورة الله كلها[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قصد الله كله»، أو «خطة الله كلها»، أو «إرادة الله كلها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: لأني
  rationale: تفيد γάρ تعليل الكلام السابق، و«لأني» تؤدي هذا الربط بعبارة عربية طبيعية.
- source_word: ὑπεστειλάμην
  choice: لم أتراجع
  rationale: يحمل الفعل المتوسط هنا معنى الإحجام أو التراجع عن القيام بالأمر؛ و«لم أتراجع» تحفظ الصورة وتناسب الاستعمال القريب في أعمال 20:20.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: عن أن أعلن
  rationale: المصدر المعرّف مع μή يبيّن الفعل الذي لم يتراجع بولس عن أدائه، وἀναγγέλλω هنا بمعنى الإعلان أو الإخبار الواضح.
- source_word: πᾶσαν
  choice: كاملةً
  rationale: مع الاسم المفرد تفيد الشمول والاكتمال، فجاءت «كاملةً» لتؤكد أنه لم يحجب شيئًا من مضمون المشورة.
- source_word: τὴν βουλὴν
  choice: مشورة
  rationale: يمكن أن تدل βουλή على المشورة أو القصد أو الخطة أو الإرادة. وتحفظ «مشورة» سعة الدلالة من غير حصرها في جانب واحد.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: إضافة مباشرة تبيّن أن المشورة صادرة عن الله أو خاصة به.
- source_word: ὑμῖν
  choice: لكم
  rationale: تؤدي دلالة المفعول غير المباشر مع فعل الإعلان، وتحفظ خطاب بولس المباشر للمخاطبين.
theological_decisions:
- issue: دلالة βουλὴ τοῦ θεοῦ
  choice: مشورة الله كاملةً
  alternative: قصد الله كله؛ خطة الله كلها؛ إرادة الله كلها
  rationale: العبارة اليونانية تتسع لمعاني المشورة والقصد والخطة والإرادة. اختيرت «مشورة الله» في المتن للمحافظة على هذه السعة، مع إثبات البدائل في الحاشية تجنبًا لحسم التوتر الدلالي واللاهوتي بلا ضرورة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على الاستعارة في معنى عدم التراجع، وعلى سعة βουλή بحاشية تعرض البدائل الدلالية الأساسية.
