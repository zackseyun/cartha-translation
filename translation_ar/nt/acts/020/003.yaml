  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: ar
  text: وبعدما قضى هناك ثلاثة أشهر، دُبِّرت عليه مؤامرة من اليهود[a] وهو على وشك أن يبحر إلى سورية، فعزم أن يرجع عن طريق مكدونية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود هنا جماعة من اليهود دبّرت المؤامرة على بولس، لا جميع اليهود بلا تمييز.
    reason: إيضاح سياقي يمنع التعميم العرقي مع الحفاظ على لفظ النص اليوناني في المتن.
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: وبعدما قضى هناك ثلاثة أشهر
  rationale: الفعل مع التعبير الزمني يعني اصطلاحًا قضاء مدة. وأُضيفت «هناك» اعتمادًا على سياق الآية السابقة، حيث كان بولس في اليونان.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: دُبِّرت عليه مؤامرة
  rationale: ينقل هذا التعبير الظرفي معنى نشوء تدبير عدائي موجَّه ضد بولس، مع إبقاء الفاعل المذكور بعده في تركيب عربي طبيعي.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: من اليهود
  rationale: يحافظ على التسمية الصريحة في النص اليوناني، مع إيضاح نطاقها السياقي في حاشية تجنبًا للتعميم على جميع اليهود.
- source_word: μέλλοντι ἀνάγεσθαι
  choice: وهو على وشك أن يبحر
  rationale: «على وشك» تنقل دلالة قرب الحدث، و«يبحر» تلائم الاستعمال الملاحي للفعل في سياق السفر.
- source_word: εἰς τὴν Συρίαν
  choice: إلى سورية
  rationale: ينقل حرف الجر الدال على وجهة الرحلة بصياغة عربية مباشرة.
- source_word: ἐγένετο γνώμης
  choice: فعزم
  rationale: ينقل التعبير الاصطلاحي الدال على اتخاذ قرار، بلغة عربية موجزة وكريمة.
- source_word: τοῦ ὑποστρέφειν
  choice: أن يرجع
  rationale: يبين مضمون القرار ويحافظ على معنى العودة.
- source_word: διὰ Μακεδονίας
  choice: عن طريق مكدونية
  rationale: ينقل دلالة المسار في διά مع المضاف إليه، من غير أن يوحي بأن مكدونية هي الوجهة النهائية.
theological_decisions:
- issue: مدلول عبارة «اليهود» في سياق الصراع
  choice: إبقاء «اليهود» في المتن مع حاشية تحدد مدلولها السياقي
  alternative: «بعض اليهود» أو «اليهود المعارضون»
  rationale: النص اليوناني يذكر «اليهود» صراحة، فلا تُضاف في المتن قيود غير ملفوظة. لكن السياق يشير إلى جماعة معينة دبّرت المؤامرة، لا إلى جميع أفراد الشعب اليهودي بلا تمييز، ولذلك يرد الإيضاح في الحاشية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل المبني للمجهول في «دُبِّرت» للمحافظة على بنية الحدث في العبارة اليونانية، ثم ذُكر مدبرو المؤامرة صراحة. ووُضع رمز الحاشية مباشرة بعد «اليهود» لأنه الموضع الذي تتعلق به.
