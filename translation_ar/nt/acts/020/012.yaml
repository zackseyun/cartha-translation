  language: ar
  text: وأخذوا الفتى حيًّا، فتعزَّوا كثيرًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: أخذوا
  rationale: الفعل ἄγω يدل على الاقتياد أو الإحضار بحسب السياق. و«أخذوا» صياغة عربية طبيعية هنا، مع بقاء جهة الحركة غير مصرَّح بها كما في اليونانية.
- source_word: παῖδα
  choice: الفتى
  rationale: يمكن أن تعني الكلمة طفلًا أو فتى أو خادمًا. وهي هنا تعود إلى أفتيخوس، الذي وُصف قبل ذلك بأنه νεανίας؛ لذلك يعبّر «الفتى» عن صغر سنه من غير إيحاء بالعبودية.
- source_word: ζῶντα
  choice: حيًّا
  rationale: حال تصف الفتى وقت أخذه، وتبرز أنه كان حيًّا بعد سقوطه.
- source_word: παρεκλήθησαν
  choice: تعزَّوا
  rationale: للفعل معنى واسع يشمل التشجيع والتعزية والمواساة. وفي سياق السقوط والموت ثم وجود الفتى حيًّا، فالتعزية هي الأنسب.
- source_word: οὐ μετρίως
  choice: كثيرًا
  rationale: 'هذا تعبير قائم على النفي، ومعناه الحرفي «ليس بقدر قليل/معتدل»، والمقصود به التأكيد: كثيرًا أو جدًا. ترجمة «كثيرًا» واضحة وطبيعية في العربية.'
