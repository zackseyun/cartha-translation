  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: ar
  text: لأن بولس كان قد قرَّر أن يبحر متجاوزًا أفسس، لئلا يضطر إلى قضاء وقت في آسيا[a]؛ إذ كان يسرع ليكون في أورشليم يوم الخمسين، إن أمكنه ذلك[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود بـ«آسيا» هنا الولاية الرومانية المسماة آسيا في غربي آسيا الصغرى، لا قارة آسيا المعروفة اليوم.
    reason: cultural_note
  - marker: b
    text: 'أو: «ليصل إلى أورشليم يوم الخمسين، إن أمكنه ذلك». يمكن أن تشدّد العبارة اليونانية إما على وجوده هناك في ذلك اليوم وإما على وصوله إليها حينئذ.'
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: كان قد قرَّر
  rationale: ينقل دلالة الماضي الأسبق، ويبيّن أن القرار اتُّخذ قبل مرحلة السفر المذكورة.
- source_word: παραπλεῦσαι
  choice: أن يتجاوز أفسس بحرًا
  rationale: يحفظ معنى المرور بمحاذاة المكان أو تجاوزه عن طريق البحر، بصياغة عربية طبيعية.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: لئلا يضطر إلى قضاء وقت
  rationale: صياغة عربية واضحة للتعبير اليوناني الاصطلاحي، وتحفظ غرض تجنّب استهلاك الوقت من غير جمود حرفي.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: في آسيا
  rationale: يُبقي الاسم الجغرافي الوارد في النص، مع توضيح المقصود التاريخي في الحاشية.
- source_word: ἔσπευδεν
  choice: كان يسرع
  rationale: يعكس صيغة الماضي الناقص الدالة على السعي المتواصل والعجلة في سياق الرحلة.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: إن أمكن
  rationale: ينقل معنى الاحتمال والشرط بإيجاز عربي طبيعي.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: يوم الخمسين
  rationale: يحافظ على الاسم الكتابي المتداول للعيد وعلى الدلالة الزمنية المباشرة.
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: ليكون في أورشليم
  rationale: يعبّر عن الغاية، أي وجوده في أورشليم في ذلك اليوم، مع إبقاء احتمال التركيز على الوصول في الحاشية.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الصيغة العربية الكتابية المألوفة لاسم المدينة.
- source_word: πεντηκοστῆς
  choice: الخمسين
  rationale: الاسم العربي الكتابي الراسخ للعيد المعروف أيضًا بعيد الأسابيع.
theological_decisions:
- issue: هل تفيد عبارة γενέσθαι εἰς Ἱεροσόλυμα الوجود في أورشليم أم الوصول إليها؟
  choice: ليكون في أورشليم
  alternative: ليصل إلى أورشليم
  rationale: التركيب يحتمل إبراز الحالة المقصودة، أي الحضور هناك في يوم الخمسين، أو إبراز الوصول في ذلك اليوم. اختيرت دلالة الوجود في المتن، وحُفظ البديل في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «يتجاوز أفسس بحرًا» لإظهار المعنى الملاحي، و«يوم الخمسين» بوصفه الاسم الكتابي العربي المألوف. وُضع شرط «إن أمكن» في آخر الجملة قريبًا من الغاية التي يقيّدها، مع الحفاظ على الغموض الحقيقي في دلالة الوجود أو الوصول بواسطة الحاشية.
