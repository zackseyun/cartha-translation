  source_fidelity: 'المعنى العام مضبوط: القرار السابق، وتجنّب قضاء وقت في ولاية آسيا، والعجلة للوصول/الوجود في أورشليم يوم الخمسين. لكن «يتجاوز أفسس بحرًا» أقل سلاسة في العربية وقد تُفهم على أن أفسس نفسها تُتجاوز «بحرًا»؛ والأوضح أن يُسند الإبحار إلى بولس مع بيان تجاوزه للمدينة. كما أن إظهار مرجع الشرط في «إن أمكنه ذلك» أدق وأطبع.'
