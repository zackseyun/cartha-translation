  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: ar
  text: إذ كنت أخدم الرب بكل تواضع، وبدموع وتجارب أصابتني وسط مكائد اليهود[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «امتحانات» أو «إغراءات»؛ والمقصود هنا على الأرجح شدائد خارجية نشأت عن المعارضة.
    reason: lexical_alternative
  - marker: b
    text: أي مكائد خصوم يهود محددين لبولس، وليس قولًا عن جميع اليهود.
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: خادمًا
  rationale: اسم فاعل حالي يصف كيفية خدمة بولس المستمرة؛ و«خادمًا» عربي طبيعي يحفظ معنى تكريس الخدمة من غير أن يشدد هنا على منزلة العبودية.
- source_word: τῷ κυρίῳ
  choice: الرب
  rationale: يحفظ اللقب الوارد في اليونانية من غير زيادة تفسيرية؛ والسياق يشير على الأرجح إلى الرب يسوع.
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: بكل تواضع
  rationale: صياغة عربية واضحة تحفظ دلالة المصاحبة والقوة الشاملة لكلمة πάσης.
- source_word: δακρύων
  choice: بدموع
  rationale: يحفظ الصورة المحسوسة والانفعال الواضح في صيغة الجمع اليونانية.
- source_word: πειρασμῶν
  choice: تجارب
  rationale: اللفظ اليوناني يحتمل التجارب والاختبارات والفتن؛ والسياق يرجح الشدائد الخارجية الناشئة عن المعارضة، مع إبقاء البدائل في الحاشية.
- source_word: τῶν συμβάντων μοι
  choice: أصابتني
  rationale: تعبير عربي موجز وطبيعي يدل على التجارب التي وقعت لبولس.
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: بسبب مكائد
  rationale: تنقل «بسبب» القوة السببية أو الظرفية المرجحة لحرف الجر ἐν هنا، إذ نشأت التجارب في سياق المكائد.
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: الترجمة المباشرة للفظ، من غير تضييقه نصيًا إلى القادة أو تحويله إلى «اليهوديين»؛ وتوضح الحاشية أن المقصود خصوم محددون في السياق.
theological_decisions:
- issue: احتمال إساءة فهم عبارة «اليهود» على نحو معادٍ لليهود
  choice: إبقاء «اليهود» في المتن مع توضيح سياقي في الحاشية
  alternative: القادة اليهود / اليهوديون
  rationale: النص اليوناني يذكر Ἰουδαίων صراحة ولا يحدد القادة وحدهم. لكن السياق يتحدث عن المتآمرين المحددين ضد بولس، لا عن جميع اليهود.
- issue: الدلالة المحتملة لكلمة πειρασμῶν
  choice: «تجارب» في المتن مع ذكر «اختبارات» و«فتن» في الحاشية
  alternative: اختبارات / فتن
  rationale: السياق يربطها بالمكائد، فيرجح الشدائد الخارجية، مع الحفاظ على المدى الدلالي الحقيقي للكلمة.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموقرة. استُعملت بنية الحال «خادمًا» لمواصلة تركيب السياق السابق، وفُصلت عناصر الكيفية بعلامات ترقيم خفيفة لتيسير القراءة.
