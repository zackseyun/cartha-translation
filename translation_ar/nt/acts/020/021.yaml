  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: ar
  text: مؤديًا شهادةً مؤكدةً لليهود واليونانيين معًا بشأن التوبة إلى الله والإيمان بربنا يسوع[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الثقة بربنا يسوع».'
    reason: بديل معجمي ممكن للفظة πίστις يبرز عنصر الاتكال الشخصي.
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: شاهِدًا بجدية
  rationale: ينقل معنى الشهادة المؤكدة والجادة في اسم الفاعل اليوناني، مع الحفاظ على اتصاله النحوي بالسياق السابق.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: لليهود واليونانيين على السواء
  rationale: يحفظ طرفي العبارة كما وردا، ويُظهر أن الشهادة كانت موجهة إلى الفريقين كليهما.
- source_word: μετάνοιαν
  choice: التوبة
  rationale: «التوبة» هي المقابل العربي الطبيعي الراسخ، وتشمل التحول الأخلاقي والروحي ولا تختزل اللفظة في مجرد تغيير ذهني.
- source_word: εἰς θεόν
  choice: إلى الله
  rationale: تفيد εἰς هنا اتجاه التوبة ووجهتها نحو الله، وهو ما تؤديه العربية بوضوح.
- source_word: πίστιν
  choice: الإيمان
  rationale: يناسب وجود مفعول الإيمان الصريح في العبارة، ويحفظ المصطلح اللاهوتي العام دون منع معنى الثقة.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: بربنا يسوع
  rationale: الباء هي الصياغة العربية الطبيعية مع «الإيمان»، وتحفظ يسوع بوصفه المتعلَّق الذي يتجه إليه الإيمان.
- source_word: κύριον
  choice: ربنا
  rationale: يحفظ لقب κύριος ووزنه المسيحاني، كما يحفظ ضمير المتكلم الجمع ἡμῶν.
theological_decisions:
- issue: دلالة πίστις في العبارة الموجهة إلى يسوع
  choice: الإيمان بربنا يسوع
  alternative: الثقة بربنا يسوع
  rationale: لأن يسوع مذكور صراحة بوصفه متعلَّق πίστις، فالمقصود إيمان موجَّه إليه، لا جدل «إيمان المسيح» في تراكيب المضاف إليه. وتُحفظ «الثقة» بديلًا معجميًا في الحاشية.
translation_notes:
  register: عربية فصحى واضحة ووقورة. استُخدم التركيب الحالي «شاهِدًا» للمحافظة على الصلة بالسياق السابق، و«على السواء» لإبراز اقتران اليهود واليونانيين. وُضع marker الحاشية في المتن.
