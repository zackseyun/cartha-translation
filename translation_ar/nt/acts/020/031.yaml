  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: ar
  text: لذلك اسهروا، متذكّرين أنني طوال ثلاث سنوات، ليلًا ونهارًا، لم أكفّ عن نصح[a] كل واحد بدموع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تحذير». يدل الفعل اليوناني على النصح والتقويم، وقد يبرز فيه أيضًا معنى التحذير.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تفيد النتيجة والاستنتاج مما سبق، وتحافظ على الصلة المنطقية بوضوح.
- source_word: γρηγορεῖτε
  choice: اسهروا
  rationale: فعل أمر مضارع يدعو إلى يقظة مستمرة؛ و«اسهروا» تعبير عربي كتابي واضح يفيد دوام الحذر والانتباه.
- source_word: μνημονεύοντες
  choice: متذكّرين
  rationale: يحافظ على صيغة اسم الفاعل وعلى ارتباط التذكّر بالسهر، بوصفه حالًا مصاحبة أو وسيلة للثبات في اليقظة.
- source_word: ὅτι
  choice: أنني
  rationale: تدخل على مضمون ما ينبغي لهم تذكّره، واتصالها بضمير المتكلم طبيعي في العربية.
- source_word: τριετίαν
  choice: طوال ثلاث سنوات
  rationale: تنقل معنى امتداد الزمن، وتُظهر الاستمرار خلال المدة بعبارة عربية طبيعية.
- source_word: νύκτα καὶ ἡμέραν
  choice: ليلًا ونهارًا
  rationale: تحافظ على ترتيب الأصل وعلى معنى المواظبة المتواصلة.
- source_word: οὐκ ἐπαυσάμην
  choice: لم أكفّ
  rationale: تنقل بوضوح عدم التوقف عن العمل المذكور، بصياغة عربية فصيحة ومألوفة.
- source_word: μετὰ δακρύων
  choice: بدموع
  rationale: تحافظ بإيجاز على معنى المصاحبة وعلى الشحنة العاطفية لخدمة بولس.
- source_word: νουθετῶν
  choice: إنذار
  rationale: ينقل جانب التحذير التصحيحي المقصود في الفعل، مع إثبات اتساع دلالته للنصح والتعليم التقويمي في الحاشية.
- source_word: ἕνα ἕκαστον
  choice: كل واحد
  rationale: يحافظ على التوزيع الفردي والتشديد على عناية بولس بكل شخص، من غير إضافة ما ليس مصرحًا به في العبارة.
theological_decisions:
- issue: القوة الرعوية للفعل νουθετῶν
  choice: إنذار
  alternative: نصح أو إرشاد تقويمي
  rationale: السياق يتحدث عن خدمة شخصية جادة ومصحوبة بالدموع، فيها تحذير وتصحيح، لا مجرد نقل معلومات. أُبقي البديل في الحاشية كيلا تُحصر دلالة اللفظ في التحذير وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حُفظ ترتيب «ليلًا ونهارًا» وصيغة الحال في «متذكّرين»، واستُعملت ألفاظ مألوفة من غير تسطيح القوة الرعوية والعاطفية للنص.
