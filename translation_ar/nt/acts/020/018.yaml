  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: ar
  text: 'فَلَمَّا جَاءُوا إِلَيْهِ، قَالَ لَهُمْ: «أَنْتُمْ أَنْفُسُكُمْ تَعْلَمُونَ كَيْفَ عِشْتُ بَيْنَكُمْ طَوَالَ الْوَقْتِ، مُنْذُ أَوَّلِ يَوْمٍ وَطِئْتُ فِيهِ أَرْضَ آسِيَا[a].»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود بـ«آسيا» هنا الولاية الرومانية الواقعة في غربي آسيا الصغرى، لا قارة آسيا المعروفة اليوم.
    reason: cultural_note
  - marker: b
    text: 'أو: «كيف كنت معكم طوال الوقت». يمكن للعبارة اليونانية أن تشدد إما على طريقة عيش بولس وإما على وجوده المستمر بينهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: جاءوا إليه
  rationale: ينقل بوضوح مجيء شيوخ أفسس إلى بولس، ويحفظ دلالة الحركة نحو شخص.
- source_word: Ὑμεῖς
  choice: أنتم أنفسكم
  rationale: يحفظ توكيد الضمير اليوناني الصريح.
- source_word: ἐπίστασθε
  choice: تعلمون
  rationale: تعبير عربي واضح عن معرفتهم الشخصية بسيرة بولس بينهم.
- source_word: ἀπὸ πρώτης ἡμέρας
  choice: منذ أول يوم
  rationale: يحدد نقطة ابتداء وجود بولس وسلوكه بينهم بصياغة عربية طبيعية.
- source_word: ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν
  choice: وطئت فيه قدمي آسيا
  rationale: يحفظ الصورة الحية في ἐπέβην، مع استعمال عربي فصيح طبيعي لعبارة الدخول إلى أرض.
- source_word: πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: كيف عشت بينكم طوال الوقت
  rationale: ينقل على نحو طبيعي معنى طريقة عيش بولس وسطهم طوال المدة، مع بيان البديل الأقرب إلى حرفية «كنت معكم» في الحاشية.
theological_decisions:
- issue: دلالة ἐγενόμην مع μεθ’ ὑμῶν
  choice: كيف عشت بينكم طوال الوقت
  alternative: كيف كنت معكم طوال الوقت
  rationale: السياق يسمح بالتركيز على سيرة بولس أو على وجوده المستمر بينهم؛ اختيرت صياغة السيرة في المتن مع حفظ الاحتمال الآخر في الحاشية، من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «وطئت فيه قدمي» للمحافظة على حيوية التعبير اليوناني، و«بينكم» للدلالة على عيش بولس في وسط الجماعة. وُضعت علامتا الحاشية في المتن كلتاهما، مع إسناد الحاشية الجغرافية إلى «آسيا» والحاشية المعجمية إلى الجملة ذات الصلة.
