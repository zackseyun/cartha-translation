  text: أنتم أنفسكم تعلمون أن هاتين اليدين لبّتا حاجاتي وحاجات الذين معي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وفّرت هاتان اليدان حاجاتي وحاجات الذين معي». قد يشدّد الفعل اليوناني على الخدمة العملية التي تفضي إلى توفير الاحتياجات المادية.'
