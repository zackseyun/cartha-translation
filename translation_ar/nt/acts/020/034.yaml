lexical_decisions:
- source_word: αὐτοὶ
  choice: أنتم أنفسكم
  rationale: يحفظ توكيد الضمير المنفصل المصاحب للفعل، ويشير إلى معرفة المخاطَبين المباشرة بسلوك بولس.
- source_word: γινώσκετε
  choice: تعلمون
  rationale: صيغة المضارع الخبري تدل هنا على المعرفة الثابتة المباشرة، و«تعلمون» تعبير عربي واضح وطبيعي.
- source_word: ταῖς χρείαις μου
  choice: حاجاتي
  rationale: تشير χρεία إلى الحاجات أو الضروريات العملية، و«حاجاتي» موجزة وطبيعية في العربية المعاصرة.
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: الذين كانوا معي
  rationale: ينقل العبارة الوصفية من غير أن يحدد طبيعة علاقتهم ببولس بما يتجاوز النص.
- source_word: ὑπηρέτησαν
  choice: خدمتا
  rationale: يحفظ المعنى الأساسي للفعل، وهو تقديم خدمة أو معونة عملية، مع إبقاء الصورة البلاغية التي تجعل اليدين فاعلًا؛ وجاء الفعل مثنى مؤنثًا لموافقته «هاتين اليدين».
- source_word: αἱ χεῖρες αὗται
  choice: هاتين اليدين
  rationale: ينقل اسم الإشارة والتوكيد الإشاري بوضوح، ويحافظ على صورة بولس الحية وهو يشير إلى يديه وعمله بهما.
