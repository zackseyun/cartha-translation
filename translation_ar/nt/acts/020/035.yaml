review_pass:
  verdict: revise
  source_fidelity: النص يحافظ بدقة على المعنى العام، وعلى عمومية «الضعفاء» وتوكيد «هو نفسه». لكن صيغة «إذ نعمل» تجعل المتكلم شريكًا في الفعل، في حين أن الفاعل المفهوم من السياق اليوناني هو المخاطبون بالجمع (شيوخ أفسس)، كما يدل عليه التركيب والسياق الخطابي.
  naturalness: العربية فصيحة وواضحة. وتصبح الصلة بين مثال بولس وواجب المخاطبين أوضح وأدق باستعمال «إذ تعملون» بدل «إذ نعمل».
  terminology: «الرب يسوع»، و«الضعفاء»، و«بركة» اختيارات سليمة وتحافظ على المصطلحات والمعنى اللاهوتي من دون تضييق أو تحميل تفسيري. حاشية القول المنسوب إلى يسوع تحتاج فقط إلى حذف «الباقية»، لأنها توحي خطأً بوجود إنجيل خامس ضمن المجموعة المقصودة.
  issues:
  - severity: medium
    issue: تحويل الفاعل المفهوم من المخاطب الجمع إلى المتكلمين في «إذ نعمل».
    rationale: κοπιῶντας جمع مذكر منصوب، ويفهم في السياق بوصفه متعلقًا بالمخاطبين الذين يوجب عليهم النص أن يساعدوا الضعفاء. «نعمل» تضم المترجم/بولس إلى المخاطبين بلا مسوغ نصي مباشر؛ «تعملون» أوضح وأدق.
  - severity: low
    issue: 'عبارة الحاشية: «الأناجيل الأربعة الباقية».'
    rationale: 'كلمة «الباقية» غير دقيقة في هذا الموضع، إذ لا تُعَدّ أعمال الرسل إنجيلًا خامسًا. الأدق: «لا ترد هذه العبارة بهذه الصيغة في الأناجيل الأربعة». '
