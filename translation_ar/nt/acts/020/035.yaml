- from: 'في كل شيء بيَّنتُ لكم أنه ينبغي، إذ نعمل بجدّ على هذا النحو، أن نعين الضعفاء[a]، وأن نتذكّر كلمات الرب يسوع، إذ قال هو نفسه: «العطاء أكثر بركة من الأخذ».[b]'
  to: 'في كل شيء بيَّنتُ لكم أنه ينبغي لكم، إذ تعملون بجدّ على هذا النحو، أن تعينوا الضعفاء[a]، وأن تتذكّروا كلمات الرب يسوع، إذ قال هو نفسه: «العطاء أكثر بركة من الأخذ».[b]'
  rationale: تُصحَّح إحالة الفعل من «نحن» إلى المخاطبين بالجمع، بما يوافق بنية الجملة اليونانية وسياق خطاب بولس للشيوخ، مع الإبقاء على قوة الوجوب وعمومية الضعفاء. كما تُنقَّح الحاشية السياقية لإزالة التعبير غير الدقيق «الباقية» من دون تغيير مدلولها.
