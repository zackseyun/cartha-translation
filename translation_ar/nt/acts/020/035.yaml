source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: ar
  text: 'في كل شيء بيَّنتُ لكم أنه ينبغي لكم، إذ تعملون بجدّ على هذا النحو، أن تعينوا الضعفاء[a]، وأن تتذكّروا كلمات الرب يسوع، إذ قال هو نفسه: «العطاء أكثر بركة من الأخذ».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تسندوا الضعفاء». قد يدل الفعل اليوناني على مساندة مستمرة، لا على مساعدة عابرة فقط.'
    reason: lexical_alternative
  - marker: b
    text: لا ترد هذه العبارة بهذه الصيغة في الأناجيل الأربعة، وينسبها بولس هنا إلى الرب يسوع.
    reason: source_context
lexical_decisions:
- source_word: πάντα
  choice: في كل شيء
  rationale: استعمال ظرفي مع «بيَّنتُ»، يفيد شمول المثال والتعليم من غير تحويل اللفظة إلى مفعول به مستقل.
- source_word: ὑπέδειξα
  choice: بيَّنتُ
  rationale: ينقل معنى الإظهار والبيان بالمثال، ويلائم كون سلوك بولس السابق نموذجًا عمليًا.
- source_word: οὕτως κοπιῶντας
  choice: إذ نعمل بجدّ على هذا النحو
  rationale: يحفظ معنى الجهد الشاق في κοπιάω وإحالة οὕτως إلى طريقة بولس في العمل، مع صياغة عربية واضحة.
- source_word: δεῖ
  choice: ينبغي
  rationale: يعبّر عن الضرورة أو الالتزام دون إدخال فاعل صريح لا يرد في اليونانية.
- source_word: ἀντιλαμβάνεσθαι
  choice: أن نعين
  rationale: يفيد الأخذ بيد المحتاج ومساعدته؛ وقد يدل في السياق على مساندة مستمرة، وهو ما توضحه الحاشية.
- source_word: τῶν ἀσθενούντων
  choice: الضعفاء
  rationale: يحفظ المجال الدلالي الواسع، فلا يقصر الضعف على المرض أو الفقر أو الضعف الروحي.
- source_word: μνημονεύειν τε
  choice: وأن نتذكّر
  rationale: يحفظ تنسيق المصدر الثاني مع واجب إعانة الضعفاء.
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: كلمات الرب يسوع
  rationale: ترجمة مباشرة تحافظ على لقب «الرب» وعلى كون المقصود أقوالًا منسوبة إلى يسوع.
- source_word: αὐτὸς εἶπεν
  choice: قال هو نفسه
  rationale: يحفظ توكيد الضمير αὐτός على أن القول صادر من يسوع نفسه.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: العطاء أكثر بركة من الأخذ
  rationale: صياغة عربية طبيعية تحافظ على المقارنة وعلى معنى μακάριον بوصفه حالة بركة لا مجرد سعادة نفسية.
theological_decisions:
- issue: نطاق معنى «الضعفاء»
  choice: الضعفاء بمعناها العام
  alternative: الفقراء، أو المرضى، أو الضعفاء روحيًا
  rationale: لفظة ἀσθενούντων واسعة دلاليًا، والسياق لا يحسم نوع الضعف؛ لذلك لا تُضيَّق إلى فئة بعينها.
- issue: مصدر قول يسوع وصيغته
  choice: إبقاء القول منسوبًا مباشرة إلى الرب يسوع
  alternative: اعتباره تلخيصًا عامًا لتعليمه
  rationale: النص يقول صراحة «قال هو نفسه»، فينبغي حفظ هذا التوكيد، مع التنبيه إلى أن الصيغة لا ترد في الأناجيل القانونية الباقية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «نعمل بجدّ» لنقل الجهد الذي يفيده الفعل اليوناني من غير تقعر، وحُفظت عمومية «الضعفاء» وتوكيد «هو نفسه». جميع علامات الحواشي مثبتة في المتن.
