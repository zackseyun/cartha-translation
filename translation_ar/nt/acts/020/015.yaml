base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: ar
  text: ومن هناك أبحرنا، فبلغنا في اليوم التالي قبالة خيوس[a]؛ وفي اليوم الذي بعده رسونا عند ساموس[b]؛ وفي اليوم الذي يليه وصلنا إلى ميليتس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مقابل خيوس» أو «قبالة ساحل خيوس». تدل اليونانية على موضع مقابل للجزيرة، ولا تعني بالضرورة أنهم نزلوا فيها.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «توقفنا عند ساموس». الفعل اليوناني مصطلح بحري يفيد إرساء السفينة أو التوقف في موضع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: ومن هناك
  rationale: تمثل الواو معنى καί في صيغة الإدغام، وتحفظ «من هناك» دلالة نقطة الانطلاق.
- source_word: ἀποπλεύσαντες
  choice: أبحرنا
  rationale: الفعل ذو دلالة بحرية، وصياغته فعلاً معطوفاً طبيعية في العربية وتحفظ وقوع الإبحار قبل الوصول.
- source_word: τῇ ἐπιούσῃ
  choice: في اليوم التالي
  rationale: تعبير زمني يدل على اليوم التالي مباشرة.
- source_word: κατηντήσαμεν ἄντικρυς Χίου
  choice: وصلنا ... إلى قبالة خِيُوس
  rationale: يفيد الفعل بلوغ موضع، وتدل ἄντικρυς على موقع مقابل للجزيرة لا على النزول فيها بالضرورة.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: وفي اليوم الذي بعده
  rationale: يحفظ التعاقب الزمني ويجنب تكرار العبارة نفسها في الجملة المتتابعة.
- source_word: παρεβάλομεν εἰς Σάμον
  choice: رسونا عند سَامُوس
  rationale: استُعمل الفعل في السياق البحري للدنو بالسفينة أو التوقف عند موضع؛ و«رسونا عند» واضحة وطبيعية من غير أن توحي بإقامة طويلة.
- source_word: τῇ δὲ ἐχομένῃ
  choice: وفي اليوم التالي
  rationale: يدل التعبير على اليوم التالي في تسلسل الرحلة.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: وصلنا إلى مِيلِيتُس
  rationale: صياغة عربية طبيعية لفعل المجيء إلى وجهة ضمن سرد رحلة.
- source_word: Χίου / Σάμον / Μίλητον
  choice: خِيُوس / سَامُوس / مِيلِيتُس
  rationale: نقل صوتي لأسماء الأماكن اليونانية بصيغة عربية واضحة.
