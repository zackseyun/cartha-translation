  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل هنا على فعل سبق الفعل الرئيس؛ و«هذا» تعبير عربي طبيعي يشير إلى الكلام السابق بمجموعه.
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: جثا على ركبتيه
  rationale: العبارة تعني حرفيًا وضع الركبتين، وهي كناية مألوفة عن اتخاذ هيئة الركوع؛ و«جثا على ركبتيه» واضحة ولا توحي بسقوط مفاجئ.
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: مع جميعهم
  rationale: تحفظ معنى المصاحبة والتوكيد على اشتراك أفراد الجماعة كلهم.
- source_word: προσηύξατο
  choice: صلّى
  rationale: الفعل اليوناني هو التعبير المعتاد عن الصلاة، وهذه المقابلة العربية مباشرة وطبيعية.
