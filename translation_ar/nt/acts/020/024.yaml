  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: ar
  text: 'لكني لا أعدّ حياتي ذات قيمةٍ عندي؛ إنما يهمّني أن أتمّ مسيرتي والخدمة التي تسلّمتها من الرب يسوع: أن أشهد لبشارة نعمة الله[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'يمكن أن يفيد الفعل أيضًا: «أن أشهد شهادة جازمة» أو «أن أشهد بجدية» لبشارة نعمة الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι ... τιμίαν ἐμαυτῷ
  choice: لا أعدّ ... ثمينةً عندي
  rationale: ينقل التعبير معنى عدم اعتبار الحياة ذات قيمة شخصية تعلو على إتمام التكليف، بصياغة عربية واضحة تحافظ على فعل التقدير الوارد في اليونانية.
- source_word: ψυχήν
  choice: حياتي
  rationale: السياق هو استعداد بولس لمواجهة القيود والموت في سبيل إتمام رسالته، ولذلك تدل الكلمة هنا على حياته لا على النفس بوصفها مقابلة للجسد.
- source_word: ὡς τελειῶσαι
  choice: ما دمتُ أُتمّ
  rationale: التركيب اليوناني موجز وذو قوة خلافية، وتوجد فيه صعوبة نصية ونحوية. هذه الصياغة تعرض إتمام المسيرة بوصفه الشاغل الحاكم دون حصر المعنى في غاية سببية صريحة.
- source_word: δρόμον
  choice: مسيرتي
  rationale: تحفظ صورة الطريق الذي يُستكمل، وهي عربية طبيعية؛ ويمكن أن تشير الصورة أيضًا إلى السباق.
- source_word: διακονίαν
  choice: الخدمة
  rationale: تدل هنا على الخدمة الموكلة إلى بولس من الرب يسوع، و«الخدمة» أوسع وأقرب إلى اللفظ من تعبير مؤسسي مثل «الوزارة».
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: من الرب يسوع
  rationale: حرف الجر مع المضاف إليه يدل على المصدر، وتحفظ الصياغة لقب «الرب».
- source_word: διαμαρτύρασθαι
  choice: أن أشهد
  rationale: ينقل معنى الإدلاء بالشهادة، مع إمكان أن يحمل الفعل في السياق نبرة التأكيد والجدية.
- source_word: εὐαγγέλιον
  choice: بشارة
  rationale: «بشارة» تعبير عربي راسخ ومفهوم للخبر السار المسيحي، ويناسب الفعل «أشهد» مع الباء.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: نعمة الله
  rationale: تحفظ سلسلة الإضافة من غير حسم ما إذا كانت البشارة تتعلق بنعمة الله أو تتصف بها.
theological_decisions:
- issue: دلالة ψυχή في وصف بولس لنفسه
  choice: حياتي
  alternative: نفسي
  rationale: الحديث عن استعداد بولس للمخاطرة بالموت، فلا ينبغي إدخال ثنائية الجسد والنفس في موضع لا يبرزها السياق.
- issue: قوة ὡς τελειῶσαι
  choice: ما دمتُ أُتمّ
  alternative: لكي أُتمّ / ليتني أُتمّ
  rationale: الصيغة تحافظ على كون إتمام التكليف هو الاعتبار الحاكم لدى بولس، مع تجنب تحويل العبارة بلا ضرورة إلى شرط تمنٍّ أو غاية نحوية صريحة.
- issue: علاقة «البشارة» بـ«نعمة الله»
  choice: بشارة نعمة الله
  alternative: البشارة عن نعمة الله
  rationale: الإضافة اليونانية تحتمل أن تكون النعمة مضمون البشارة أو سمتها، والإضافة العربية تحفظ هذا الاتساع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «مسيرتي» للمجاز و«الخدمة» للتكليف الرسولي، وحُفظت الإضافة في «بشارة نعمة الله» لتجنب تضييق الدلالة.
