  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: ar
  text: ومِن بينكم أنتم أنفسكم سيقوم رجالٌ يتكلّمون بأقوالٍ مُحرَّفة، ليجتذبوا التلاميذ وراءهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأقوالٍ ملتوية» أو «بأقوالٍ فاسدة».'
    reason: بدائل معجمية للفظ διεστραμμένα تحفظ معاني الالتواء والتحريف والفساد.
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: مِن بينكم أنتم أنفسكم
  rationale: يحفظ توكيد العبارة اليونانية أن الخطر سيخرج من داخل الجماعة نفسها، مع صياغة عربية واضحة.
- source_word: ἀναστήσονται
  choice: سيقوم
  rationale: ينقل المعنى الاصطلاحي للفعل هنا، أي سيبرز أو يظهر رجال، مع الإبقاء على قوة التنبؤ.
- source_word: ἄνδρες
  choice: رجالٌ
  rationale: الاسم اليوناني مذكّر على وجه التحديد، ولذلك تُحفظ دلالته الجنسية الصريحة.
- source_word: λαλοῦντες
  choice: يتكلّمون
  rationale: ترجمة مباشرة وطبيعية لاسم الفاعل الذي يصف نشاطهم الكلامي.
- source_word: διεστραμμένα
  choice: بأقوالٍ مُحرَّفة
  rationale: المحايد الجمع المستعمل اسميًا يدل على أمور أو أقوال جرى تحريفها عن الحق؛ وإضافة «أقوال» تلائم فعل الكلام وتنتج عربية طبيعية من غير تحديد هرطقة بعينها.
- source_word: τοῦ ἀποσπᾶν
  choice: ليجتذبوا
  rationale: تنقل لام الغرض وظيفة المصدر المسبوق بأداة التعريف، وتحفظ صورة جذب التلاميذ بعيدًا.
- source_word: τοὺς μαθητὰς
  choice: التلاميذ
  rationale: هو المصطلح العربي الكتابي الواضح لأتباع يسوع في سفر الأعمال.
- source_word: ὀπίσω ἑαυτῶν
  choice: وراءهم
  rationale: يحفظ صورة الاتباع والولاء المقصودة في التعبير اليوناني من غير إضافة تفسير زائد.
theological_decisions:
- issue: طبيعة كلام المعلّمين المضلّين
  choice: بأقوالٍ مُحرَّفة
  alternative: بأقوالٍ ملتوية / بأمورٍ فاسدة
  rationale: يحذّر النص من الانحراف عن الحق من غير أن يعيّن بدعة أو نوعًا محددًا من الفساد، فتحفظ الترجمة اتساع الدلالة.
- issue: دلالة ἄνδρες من جهة الجنس
  choice: رجالٌ
  alternative: أناس / أشخاص
  rationale: يحمل اللفظ اليوناني دلالة ذكورية محددة، فلا تُسوّى هذه الدلالة بلفظ محايد.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدم «أنتم أنفسكم» لحفظ التوكيد، و«وراءهم» للإبقاء على صورة استمالة التلاميذ إلى اتباع أصحاب التعليم المنحرف.
