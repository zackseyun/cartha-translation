  text: There were many lamps in the upper room where we were gathered[a].
translation:
  language: ar
  text: وكانت في العُلِّيَّة التي كنا مجتمعين فيها مصابيح كثيرة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مشاعل». يمكن أن تشير الكلمة اليونانية إلى أدوات إنارة محمولة بوجه عام، لكن «مصابيح» أرجح في هذا المكان الداخلي.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد وتهيئ وصف المشهد من غير دلالة على تعارض قوي أو إدخال ظرف زمان غير موجود صراحة.
- source_word: λαμπάδες
  choice: مصابيح
  rationale: يمكن أن تدل الكلمة على المصابيح أو المشاعل، ويرجح سياق الغرفة الداخلية معنى المصابيح.
- source_word: ἱκαναὶ
  choice: كثيرة
  rationale: تصف هنا عدد المصابيح، و«كثيرة» تعبير عربي طبيعي ينقل معنى الكثرة الملحوظة.
- source_word: ὑπερῴῳ
  choice: العُلِّيَّة
  rationale: تدل على غرفة في القسم العلوي من البيت، و«العُلِّيَّة» المقابل العربي الموجز والواضح.
- source_word: οὗ
  choice: التي ... فيها
  rationale: صياغة موصولية مكانية طبيعية في العربية، تربط اجتماع الجماعة بالعُلِّيَّة بوضوح.
- source_word: συνηγμένοι
  choice: مجتمعين
  rationale: تنقل حالة الجماعة التي اجتمعت وبقيت مجتمعة، بصياغة عربية طبيعية.
- source_word: ἦσαν ... ἦμεν
  choice: كانت ... كنا
  rationale: ينقل الماضي الناقص في الوصف السردي من غير تحميل الصيغة دلالة زمنية زائدة.
