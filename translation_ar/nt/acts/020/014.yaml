  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «على متن السفينة» لإظهار السياق البحري الضمني، وحُفظ بديل «انضم إلينا» في الحاشية لأن الفعل اليوناني يحتمل الالتقاء والاجتماع.
