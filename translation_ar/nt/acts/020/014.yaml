  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: ar
  text: ولمّا التقانا في أسوس[a]، أخذناه معنا على متن السفينة، وجئنا إلى ميتيليني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انضمّ إلينا في أسوس»، أو: «اجتمع بنا في أسوس». يمكن أن يدل الفعل اليوناني على الالتقاء أو الاجتماع؛ والمقصود هنا أن بولس عاد فانضم إلى رفاقه هناك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: التقانا
  rationale: يدل الفعل في سياق الرحلة على التقاء بولس برفاقه في أسوس. وهذه صياغة عربية طبيعية تحفظ معنى الاجتماع من غير أن تضيف فكرة ترتيب الموعد مسبقًا.
- source_word: ἡμῖν
  choice: نا في «التقانا»
  rationale: ضمير المتكلمين الجمع في حالة المفعول غير المباشر/المتمم، وأُدمج طبيعيًا في الفعل العربي.
- source_word: εἰς τὴν Ἆσσον
  choice: في أسوس
  rationale: مع فعل الالتقاء، تعبّر «في» عن موضع اللقاء تعبيرًا عربيًا مألوفًا، مع أن حرف الجر اليوناني ذو دلالة اتجاهية في الأصل.
- source_word: ἀναλαβόντες
  choice: أخذناه معنا على متن السفينة
  rationale: يفيد اسم الفاعل استقبال بولس واصطحابه في سياق بحري؛ وذكر السفينة يوضح ما يقتضيه السياق من غير تغيير الحدث.
- source_word: αὐτόν
  choice: ـه في «أخذناه»
  rationale: الضمير يعود إلى بولس المذكور في السياق السابق.
- source_word: ἤλθομεν
  choice: جئنا
  rationale: ينقل الفعل اليوناني الماضي البسيط بصيغة عربية طبيعية في سرد الرحلة.
- source_word: εἰς Μιτυλήνην
  choice: إلى ميتيليني
  rationale: ترجمة اتجاهية مباشرة وطبيعية لحرف الجر مع اسم المكان.
theological_decisions: []
