source:
  edition: SBLGNT
  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: ar
  text: أنا أعلم أنه بعد رحيلي[a] ستدخل بينكم ذئاب شرسة[b]، لا تشفق على القطيع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بعد مجيئي/وصولي»؛ لكن السياق يدل على أن المقصود: «بعد رحيلي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ذئاب ضارية». والصفة اليونانية قد تفيد الشدة أو القسوة أو العنف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ οἶδα
  choice: أنا أعلم
  rationale: ينقل يقين بولس بصياغة عربية مباشرة، ويحافظ على إبراز ضمير المتكلم الوارد صراحة في اليونانية.
- source_word: εἰσελεύσονται
  choice: ستدخل
  rationale: فعل مستقبل يدل على الدخول إلى وسط الجماعة، وهو ملائم أيضًا لصورة الذئاب التي تقتحم القطيع.
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: بعد رحيلي
  rationale: مع أن ἄφιξις تدل في أصلها على المجيء أو الوصول، فإن سياق خطاب بولس يشير إلى ما سيحدث بعد مغادرته؛ لذلك تعبّر «رحيلي» عن المعنى المقصود في السياق، مع بيان اللفظ الحرفي في الحاشية.
- source_word: λύκοι βαρεῖς
  choice: ذئاب شرسة
  rationale: βαρεῖς تعني حرفيًا «ثقيلة»، لكنها هنا تفيد الشدة والقسوة والخطر. و«شرسة» عربية طبيعية تحفظ قوة الصورة المجازية.
- source_word: εἰς ὑμᾶς
  choice: بينكم
  rationale: تفيد العبارة اقتحام الذئاب للجماعة ووجودها في وسط المخاطَبين، لا مجرد اتجاهها نحوهم.
- source_word: μὴ φειδόμενοι
  choice: لا تشفق على
  rationale: ينقل عدم الامتناع عن الإيذاء والقسوة تجاه القطيع، بصياغة واضحة تحافظ على شدة التعبير.
- source_word: τοῦ ποιμνίου
  choice: القطيع
  rationale: يحافظ على الصورة الرعوية في النص وعلى الترابط بين القطيع والذئاب.
theological_decisions:
- issue: هوية «الذئاب» المجازية
  choice: الإبقاء على صورة «ذئاب شرسة» من غير تفسير هويتها في المتن
  alternative: معلّمون كذبة أو مضطهِدون أو رجال مفسدون
  rationale: الآية نفسها تستعمل الصورة المجازية ولا تعيّن المقصود بها تعيينًا صريحًا؛ والإبقاء عليها يحفظ قوتها ولا يضيّق مجال المعنى بلا سند صريح.
- issue: دلالة ἄφιξις في السياق
  choice: بعد رحيلي
  alternative: بعد مجيئي أو بعد وصولي
  rationale: المعنى المعجمي المعتاد هو المجيء أو الوصول، لكن سياق الوداع والتحذير مما سيحدث عند غياب بولس يرجّح أن المقصود رحيله. وقد حُفظ التوتر اللفظي في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. حُفظت الصورة الرعوية والمجازية، واستُعمل تركيب موجز وطبيعي من غير إدخال تفسير لهوية الذئاب في صلب الآية. تظهر علامتا الحاشيتين [a] و[b] في المتن.
