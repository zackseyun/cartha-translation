  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: ar
  text: أمّا نحن فتقدّمنا إلى السفينة وأبحرنا إلى أسّوس، قاصدين أن نأخذ بولس على متن السفينة من هناك، لأنه كان قد رتّب الأمر هكذا، إذ كان هو نفسه ينوي أن يسافر برًّا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنه كان هو نفسه ينوي أن يسير على قدميه». يدل الفعل اليوناني πεζεύειν على السفر برًّا في مقابل رحلة الجماعة بالسفينة، وقد يفيد السير على الأقدام تحديدًا. ويجوز أيضًا ترجمة العبارة السابقة: «لأن الأمر كان قد رُتِّب هكذا»، إذ إن الصيغة اليونانية διατεταγμένος ἦν مبنية للمجهول من حيث صورتها.'
    reason: lexical_and_grammatical_alternatives
lexical_decisions:
- source_word: προελθόντες
  choice: تقدّمنا
  rationale: اسم الفاعل الأُورِسطي يدل على فعل سبق الإبحار، ويُظهر أن جماعة الراوي سبقت بولس.
- source_word: ἐπὶ τὸ πλοῖον
  choice: إلى السفينة
  rationale: يفيد حرف الجر مع الحركة التوجّه إلى السفينة، ويتضح الصعود إليها من فعل الإبحار اللاحق.
- source_word: ἀνήχθημεν
  choice: أبحرنا
  rationale: الفعل في السياق البحري يعني الانطلاق بالسفينة أو الإبحار.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: إلى أسّوس
  rationale: تعبير طبيعي عن وجهة الرحلة البحرية، مع نقل اسم المدينة إلى العربية.
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: قاصدين أن نُصعِد بولس معنا
  rationale: μέλλω يفيد القصد هنا، وἀναλαμβάνω في سياق الرحلة يعني أخذ الشخص على متن السفينة؛ وإضافة «معنا» توضح المعنى الملاحي طبيعيًا.
- source_word: ἐκεῖθεν
  choice: من هناك
  rationale: يحفظ الدلالة الانفصالية للظرف، أي المكان الذي سيُؤخذ بولس منه على متن السفينة.
- source_word: διατεταγμένος ἦν
  choice: كان قد رتّب الأمر هكذا
  rationale: ينقل الترتيب السابق بصياغة عربية طبيعية، مع إبقاء المبني للمجهول الصرفي احتمالًا مذكورًا في الحاشية.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: إذ كان هو نفسه ينوي أن يسافر برًّا
  rationale: يحفظ توكيد αὐτός، ويعبّر عن مقابلة السفر البرّي بإبحار الجماعة، من غير حصر العبارة قطعًا في المشي.
- source_word: δὲ
  choice: أمّا
  rationale: تُبرز المقابلة الخفيفة بين جماعة الراوي وبولس على نحو عربي سلس.
