  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «أمّا نحن» لإظهار المقابلة، و«أبحرنا» للمصطلح الملاحي، وحُفظ احتمال السفر برًّا أو مشيًا واحتمال المبني للمجهول في حاشية واحدة لأن النص العربي الرئيس يحتاج إلى صياغة جارية.
