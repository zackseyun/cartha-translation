base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: ar
  text: ورافقه سوباتر، ابن بيروس، من بيرية؛ ومن تسالونيكي أرسترخس وسكوندس؛ وغايوس من دربة، وتيموثاوس؛ ومن آسيا تيخيكس وتروفيمس[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي مقاطعة آسيا الرومانية، لا قارة آسيا بمفهومها الحديث.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο
  choice: رافقه
  rationale: الفعل في صيغة الماضي الناقص يدل على مرافقة بولس في السفر، و«رافقه» تعبير عربي طبيعي يحفظ المعنى.
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: سوباتر البِيرِيّ، ابن بيروس
  rationale: تفيد Πύρρου على الأرجح النسب، أي «ابن بيروس»، بينما يحدد Βεροιαῖος انتماء سوباتر إلى مدينة بِيرية.
- source_word: Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος
  choice: وأرسترخس وسكوندس من تسالونيكي
  rationale: الجمع في المضاف إليه يجمع الرجلين بحسب منشئهما؛ وصياغة «من تسالونيكي» عربية واضحة وطبيعية.
- source_word: Γάϊος Δερβαῖος
  choice: وغايوس من دربة
  rationale: النعت الجغرافي Δερβαῖος يعني أن غايوس من مدينة دربة.
- source_word: Τιμόθεος
  choice: وتيموثاوس
  rationale: نقل للاسم وفق صيغته اليونانية الشائعة عربيًا.
- source_word: Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος
  choice: وتيخيكس وتروفيمس من أَسِيَّا
  rationale: ينسب النص الرجلين إلى مقاطعة أَسِيَّا الرومانية؛ ووضعت العبارة بعد الاسمين لتكون طبيعية في العربية، مع إيضاح المقصود في الحاشية.
- source_word: δέ ... δέ ... δέ
  choice: و... و... و...
  rationale: تؤدي واو العطف وظيفة الإضافات المتعاقبة في هذه القائمة من غير إثقال عربي بأدوات استدراك لا يقتضيها السياق.
