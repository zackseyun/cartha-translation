- from: ورافقه سوباتر البِيرِيّ، ابن بيروس، وأرسترخس وسكوندس من تسالونيكي، وغايوس من دربة، وتيموثاوس، وتيخيكس وتروفيمس من أَسِيَّا[a].
  to: ورافقه سوباتر، ابن بيروس، من بيرية؛ ومن تسالونيكي أرسترخس وسكوندس؛ وغايوس من دربة، وتيموثاوس؛ ومن آسيا تيخيكس وتروفيمس[a].
  rationale: استُبدلت النسبة الأقل ألفة بعبارة جغرافية واضحة، ونُظمت مجموعات القائمة بعلامات فصل وبتقديم أوصاف المنشأ بما يبرز ارتباط كل وصف بالاسمين التاليين. وحُفظت جميع عناصر النص اليوناني، بما فيها نسبة سوباتر إلى بيروس، ومرافقة بولس المشار إليه بالضمير، وتقييد آسيا بالحاشية.
  reviewer_model: gpt-5.6-terra
