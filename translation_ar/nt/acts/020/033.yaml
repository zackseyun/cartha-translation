  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: ar
  text: لم أشتهِ فضةَ أحدٍ ولا ذهبَه ولا ثيابَه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم أطمع في فضة أحد ولا ذهبه ولا ثيابه».'
    reason: بديل معجمي يبرز الدلالة الأخلاقية المحتملة للفعل ἐπιθυμέω في سياق ممتلكات الغير.
lexical_decisions:
- source_word: ἀργυρίου
  choice: فضةَ
  rationale: يحافظ على المعنى الحرفي الملموس وعلى التوازي مع الذهب والثياب، بدل تعميمه إلى المال.
- source_word: χρυσίου
  choice: ذهبَه
  rationale: ترجمة مباشرة للاسم، مع إظهار تعلقه بـ«أحد» بضمير الملكية في العربية الطبيعية.
- source_word: ἱματισμοῦ
  choice: ثيابَه
  rationale: لفظ عربي فصيح وواضح يشير إلى الملابس بوصفها من المقتنيات ذات القيمة.
- source_word: οὐδενὸς
  choice: أحدٍ ... ـه ... ـه
  rationale: يفيد أن الأشياء المذكورة مملوكة لأي شخص آخر؛ وصيغت الملكية بالاسم ثم الضمائر تجنبًا للتكرار الثقيل.
- source_word: ἐπεθύμησα
  choice: أشتهِ
  rationale: الفعل «اشتهى» ينقل الرغبة القوية، وفي هذا السياق المنفي المتعلق بممتلكات الغير يحمل دلالة الطمع دون إضافة تفسير زائد.
- source_word: ἢ ... ἢ ... ἢ
  choice: ولا ... ولا
  rationale: بعد النفي، تكرار «ولا» هو الأسلوب العربي الطبيعي الذي يحفظ تعداد العناصر واستقلال كل منها.
theological_decisions:
- issue: الدلالة الأخلاقية للفعل ἐπιθυμέω تجاه ممتلكات الآخرين
  choice: لم أشتهِ
  alternative: لم أرغب في
  rationale: «أشتهِ» يحفظ قوة الرغبة التي قد تحمل هنا معنى الطمع، مع إبقاء قدر من السعة المعجمية وعدم تحويل العبارة إلى حكم تفسيري أشد من الأصل.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات نبرة كتابية رصينة. استُعملت ضمائر الملكية للمحافظة على سلاسة العبارة وإظهار قوة المضاف إليه اليوناني.
