  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: ar
  text: أَمَّا نَحْنُ فَأَبْحَرْنَا مِنْ فِيلِبِّي بَعْدَ أَيَّامِ الْفَطِيرِ، وَوَصَلْنَا إِلَيْهِمْ فِي غُضُونِ خَمْسَةِ أَيَّامٍ[a] فِي تَرُوَاسَ، وَأَقَمْنَا هُنَاكَ سَبْعَةَ أَيَّامٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في خمسة أيام». يدل التعبير اليوناني على مدة الرحلة حتى الوصول.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: أبحرنا
  rationale: يفيد الفعل اليوناني مغادرة المكان بحرًا، و«أبحرنا» تعبير عربي طبيعي يبيّن وسيلة الرحلة، مع دلالة الانطلاق التي يستكملها «من فيلبي».
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: بعد أيام الفطير
  rationale: يحافظ على الصياغة الزمنية في اليونانية وعلى الاسم العربي المألوف للموسم اليهودي، من غير إضافة لفظ «عيد» غير المذكور صراحة.
- source_word: ἀπὸ Φιλίππων
  choice: من فيلبي
  rationale: «من» هي المقابل الطبيعي لحرف الجر الدال على نقطة الانطلاق، و«فيلبي» الصيغة العربية الشائعة لاسم المدينة.
- source_word: ἤλθομεν πρὸς αὐτοὺς
  choice: وصلنا إليهم
  rationale: ينقل حركة المتكلمين نحو الأشخاص المقصودين، و«وصلنا» يلائم سياق اكتمال الرحلة ولا يضيف معنى الاجتماع أو الانضمام صراحة.
- source_word: εἰς τὴν Τρῳάδα
  choice: في ترواس
  rationale: بعد «وصلنا إليهم» تأتي «في ترواس» عربيًا لتحديد موضع وجودهم، مع حفظ ترواس بوصفها مقصد الرحلة.
- source_word: ἄχρι ἡμερῶν πέντε
  choice: في خمسة أيام
  rationale: يفيد التعبير مدة الرحلة إلى حين الوصول. وهذه الصياغة العربية الطبيعية تصون معنى الامتداد الزمني دون الإيحاء بأن الوصول وقع بعد انقضاء خمسة أيام كاملة.
- source_word: οὗ
  choice: هناك
  rationale: يعود الظرف الموصول على ترواس؛ و«هناك» يربط الإقامة بالمكان السابق بوضوح وطبيعية في العربية.
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: أقمنا هناك سبعة أيام
  rationale: «أقمنا» يؤدي معنى المكث في مكان خلال مدة محددة، وهو فصيح واضح في سياق الرحلات.
