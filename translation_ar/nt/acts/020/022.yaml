  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: ar
  text: والآن، ها أنا، مقيَّدًا في الروح[a]، ذاهب إلى أورشليم، ولا أعلم ما سيحدث لي هناك،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مقيَّدًا بروحي». قد تشير العبارة اليونانية إلى روح بولس أو إلى الروح القدس. ويمكن أيضًا فهمها بمعنى: «مقيَّدًا بالروح» أو «مُلزَمًا بالروح».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ها أنا
  rationale: ينقل أداة التنبيه والتوكيد في صياغة عربية فصيحة وطبيعية، ويرتبط هنا مباشرة بضمير المتكلم ἐγώ.
- source_word: δεδεμένος
  choice: مقيَّدًا
  rationale: يحفظ صورة الربط في اسم المفعول اليوناني التام، من غير اختزالها تفسيريًا في معنى «مُجبَرًا».
- source_word: τῷ πνεύματι
  choice: بالروح
  rationale: صياغة عربية موجزة تحتمل توجيه العبارة إلى الروح القدس، مع إثبات احتمال الإشارة إلى روح بولس في الحاشية. وقد تُفهم الباء أيضًا على معنى الإلزام أو الوساطة بحسب السياق.
- source_word: πορεύομαι
  choice: ذاهب إلى
  rationale: تعبير عربي طبيعي ينقل فعل الحركة الحاضر واتجاه بولس الوشيك إلى أورشليم.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: ما سيحدث لي هناك
  rationale: ينقل المعنى الاصطلاحي لعبارة «الأشياء التي ستلقاني فيها» بلغة عربية واضحة، مع إبقاء الحدث المستقبلي غير محدد.
- source_word: μὴ εἰδώς
  choice: ولا أعلم
  rationale: يؤدي معنى الحال المنفية بوضوح، ويتلاءم مع نسق الجملة العربية.
- source_word: Ἰερουσαλήμ
  choice: أورشليم
  rationale: الاسم العربي الكتابي الشائع للمدينة.
theological_decisions:
- issue: مرجع τῷ πνεύματι ووظيفته النحوية
  choice: «بالروح» في المتن، مع ترجيح الإشارة إلى الروح القدس دون حسمها
  alternative: «مقيَّدًا في روحي» إذا كان المقصود روح بولس؛ أو «مُلزَمًا بالروح» إذا أُبرز معنى الإلزام
  rationale: سياق أعمال الرسل، ولا سيما ذكر شهادة الروح في الآية التالية، يرجح الروح القدس، لكن التركيب اليوناني لا يحسم المرجع أو نوع العلاقة حسمًا كاملًا؛ لذلك تُحفظ البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «ها أنا» لإبراز الانتقال المؤكد، وحُفظت استعارة القيد مع توضيح الغموض الحقيقي في الحاشية.
