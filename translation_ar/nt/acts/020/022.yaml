  terminology: «أورشليم» اسم كتابي عربي راسخ، و«الروح» مصطلح مناسب. ينبغي ألا يحسم المتن أن الروح القدس هو الفاعل الملزِم؛ لذا تُسجَّل قراءة «بالروح» في الحاشية بوصفها إبرازًا محتمَلًا للمعنى.
