- from: 'وكيف أني لم أتراجع عن أن أعلن لكم شيئًا مما ينفعكم، وأن أعلّمكم علنًا ومن بيت إلى بيت.[a]


    [a] أو: «لم أُحجم عن إعلان أي شيء نافع لكم».'
  to: وكيف لم أُحجم عن أن أُعلن لكم شيئًا مما ينفعكم وأن أُعلّمكم علنًا ومن بيت إلى بيت.[a]
  rationale: حُذفت «أني» بعد «وكيف» لتصحيح التركيب وتحسين سلاسة العربية. واعتمدت «لم أُحجم عن» في المتن لأنها أوضح في التعبير عن عدم الامتناع عن الإعلان والتعليم، مع إبقاء «لم أتراجع» بديلًا معجميًا في الحاشية. ولم يُغيَّر نطاق النفع أو علاقة الفعلين أو الدلالة التوزيعية لعبارة «من بيت إلى بيت».
  reviewer_model: gpt-5.6-terra
