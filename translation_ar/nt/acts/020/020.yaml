source:
  edition: SBLGNT
  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: ar
  text: وكيف لم أُحجم عن أن أُعلن لكم شيئًا مما ينفعكم وأن أُعلّمكم علنًا ومن بيت إلى بيت.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم أتراجع عن إعلان أيّ شيء نافع لكم».'
    reason: بديل معجمي لـὑπεστειλάμην يبرز معنى التراجع أو الانكفاء، مع صياغة بديلة طبيعية لعبارة τῶν συμφερόντων.
lexical_decisions:
- source_word: ὡς
  choice: وكيف أني
  rationale: تربط العبارة بما قبلها بوصفها جزءًا من تذكير بولس لهم بسيرته بينهم، وهي صياغة عربية طبيعية تؤدي معنى «كيف» في السياق.
- source_word: ὑπεστειλάμην
  choice: لم أتراجع
  rationale: الفعل في صيغة الوسط يفيد الرجوع أو إحجام المرء عن فعل شيء. يحفظ «لم أتراجع» الصورة الاصطلاحية دون أن يوحي بمجرد التردد النفسي، مع إثبات البديل «لم أُحجم» في الحاشية.
- source_word: τῶν συμφερόντων
  choice: شيئًا مما ينفعكم
  rationale: يدل التعبير على الأمور النافعة أو المفيدة. هذه الصياغة واضحة وطبيعية، ولا تحصر النفع صراحة في معنى مالي أو في مجال لاهوتي أضيق من النص.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: عن أن أعلن لكم
  rationale: المصدر المعرّف مع النفي يبيّن الفعل الذي لم يتراجع بولس عن القيام به. نُقلت البنية إلى تعبير عربي سلس بدل محاكاة النفي اليوناني بصورة حرفية مربكة.
- source_word: ἀναγγεῖλαι
  choice: أعلن
  rationale: ينقل معنى الإخبار والإعلان والإبلاغ، ويلائم سياق خدمة بولس، مع إبقاء الإعلان والتعليم فعلين مترابطين ومتميزين.
- source_word: διδάξαι
  choice: أعلّمكم
  rationale: ترجمة مباشرة للفعل «يعلّم»، وهو معطوف على «أعلن» وتحت حكم فعل واحد هو «لم أتراجع».
- source_word: δημοσίᾳ
  choice: علنًا
  rationale: تؤدي الدلالة الظرفية على التعليم في المجال العام بصياغة عربية موجزة ومعاصرة.
- source_word: κατ’ οἴκους
  choice: من بيت إلى بيت
  rationale: تحفظ القوة التوزيعية لحرف الجر مع الجمع، وتشير إلى انتقال الخدمة بين البيوت بدل الاكتفاء بقول «في البيوت».
theological_decisions:
- issue: طبيعة النفع في τῶν συμφερόντων
  choice: 'الإبقاء على المعنى العام: «مما ينفعكم»'
  alternative: تخصيصه بما هو نافع روحيًا أو رعويًا
  rationale: السياق يجعل النفع الروحي والرعوي مرجحًا، لكن اللفظ نفسه أوسع؛ لذلك لم تُضف صفة عقائدية أو روحية غير مصرّح بها في النص.
- issue: العلاقة بين الإعلان والتعليم
  choice: اعتبارهما فعلين معطوفين يخضعان معًا لعبارة «لم أتراجع»
  alternative: تكرار «لم أتراجع عن» قبل التعليم
  rationale: العطف اليوناني ينسق المصدرين تحت الفعل الحاكم نفسه؛ والصياغة العربية المختارة تحافظ على هذه الوحدة دون طمس التمييز بين الإعلان والتعليم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «علنًا» للاختصار والوضوح، و«من بيت إلى بيت» للمحافظة على الدلالة التوزيعية. وُضعت علامة الحاشية [a] في المتن كما هو مطلوب.
