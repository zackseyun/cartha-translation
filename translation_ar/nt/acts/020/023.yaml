  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: ar
  text: غير أن الروح القدس يشهد لي في مدينة بعد مدينة[a]، قائلًا إن قيودًا[b] وضيقات تنتظرني[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من مدينة إلى مدينة»، أو «في كل مدينة». التعبير اليوناني توزيعي، ويدل على تكرّر هذه الشهادة في مدن متعاقبة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «سلاسل». والكلمة اليونانية تشير حرفيًا إلى ما يُوثق به الإنسان، وقد تدل تبعًا لذلك على الأسر أو السجن.'
    reason: lexical_alternative
  - marker: c
    text: 'تختلف بعض المخطوطات اختلافًا طفيفًا في وجود ضمير «ني» وموضعه مع «الضيقات»، لكن المعنى العام باقٍ: القيود والضيقات تنتظر بولس.'
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: غير أن
  rationale: تؤدي معنى الاستدراك والاستثناء المرتبط بكلام الآية السابقة، وهي صياغة عربية فصيحة وطبيعية.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: المقابل العربي المعاصر المستقر للعبارة اليونانية المعرفة.
- source_word: κατὰ πόλιν
  choice: في كل مدينة
  rationale: تنقل الاستعمال التوزيعي لـ κατά مع الاسم المفرد، أي تكرر الشهادة في المدن المتعاقبة، من غير الجزم بأنها تشمل كل مدينة بلا استثناء.
- source_word: διαμαρτύρεταί μοι
  choice: يشهد لي
  rationale: يحافظ على معنى الشهادة المؤكدة الموجهة إلى بولس، من غير تحويلها تفسيريًا إلى مجرد تحذير.
- source_word: λέγον
  choice: قائلًا
  rationale: ينقل اسم الفاعل الذي يقدم مضمون شهادة الروح، ويطابق «الروح» في التذكير النحوي العربي.
- source_word: δεσμὰ
  choice: قيودًا
  rationale: يحفظ الصورة الحسية في اليونانية، مع إمكان أن تدل القيود على الأسر أو السجن.
- source_word: θλίψεις
  choice: ضيقات
  rationale: لفظ عربي واضح وجاد ينقل معنى الشدائد والضغوط، دون التخفيف إلى «متاعب».
- source_word: με
  choice: ني في تنتظرني
  rationale: يجعل بولس مفعولًا لما ينتظره من قيود وضيقات، وفق النص المطبوع، مع التنبيه إلى الاختلاف النصي.
- source_word: μένουσιν
  choice: تنتظرني
  rationale: يعبر طبيعيًا عن كون القيود والضيقات مدخرة لبولس وواقعة أمامه مستقبلًا.
theological_decisions:
- issue: دلالة «الروح القدس» بوصفه فاعل الشهادة والقول
  choice: 'الإبقاء على الإسناد الشخصي المباشر: «الروح القدس يشهد... قائلًا»'
  alternative: صياغة توحي بقوة أو تأثير روحي غير شخصي
  rationale: النص نفسه يسند إلى الروح القدس الشهادة والقول؛ لذلك تحفظ الترجمة هذه الوكالة الشخصية من غير إضافة تقرير عقائدي يتجاوز الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «غير أن» لربط الاستدراك بالسياق السابق، و«في كل مدينة» للتوزيع المتكرر، مع حاشية تحفظ البدائل. وُضعت علامات الحواشي بعد العبارات التي تتعلق بها مباشرة.
