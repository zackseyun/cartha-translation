  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: ar
  text: ثم صعد، وكسر الخبز[a] وأكل[b]، وتحدّث وقتًا طويلًا إلى طلوع الفجر، ثم انصرف.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير عبارة «كسر الخبز» إلى تناول وجبة مشتركة، ويرى بعضهم أنها تتضمن هنا عشاء الرب.
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «ذاق»، ويمكن أن تعني أيضًا «تناول طعامًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: صعد
  rationale: اسم فاعل ماضٍ من ἀναβαίνω يدل على الصعود. يوضح السياق أنه عاد إلى المكان العلوي، لكن «صعد» يحافظ على إيجاز الأصل من غير إضافة «إلى العلية» صراحةً.
- source_word: κλάσας τὸν ἄρτον
  choice: كسر الخبز
  rationale: يحافظ على الفعل الملموس وعلى أداة التعريف في النص اليوناني، من غير أن يحسم هل المقصود وجبة عادية مشتركة أم ممارسة ذات دلالة إفخارستية.
- source_word: γευσάμενος
  choice: أكل
  rationale: يمكن أن يعني الفعل «ذاق»، لكنه في سياق الطعام يدل طبيعيًا على الأكل أو تناول الطعام؛ و«أكل» أوضح للقارئ ولا يوحي بأنه اكتفى بلقمة صغيرة.
- source_word: ἐφ’ ἱκανόν
  choice: وقتًا طويلًا
  rationale: تعبير اصطلاحي يفيد امتدادًا زمنيًا ملحوظًا، وهذه الصياغة عربية واضحة وطبيعية.
- source_word: ὁμιλήσας
  choice: تحدّث
  rationale: يدل هنا على حديث أو حوار ممتد، لا على فعل وعظ تقني بالضرورة، ولذلك تحافظ «تحدّث» على سعة الدلالة.
- source_word: ἄχρι αὐγῆς
  choice: إلى طلوع الفجر
  rationale: تنقل αὐγή بمعنى الفجر أو انبلاج الصباح بصياغة عربية مألوفة.
- source_word: οὕτως ἐξῆλθεν
  choice: ثم انصرف
  rationale: يفيد الفعل خروجه أو ذهابه، وتربط «ثم» النتيجة بسلسلة الأحداث السابقة بأسلوب عربي طبيعي، من غير الترجمة الحرفية الثقيلة لـοὕτως.
theological_decisions:
- issue: هل عبارة κλάσας τὸν ἄρτον إشارة صريحة إلى عشاء الرب؟
  choice: 'ترجمت ترجمة محايدة: «كسر الخبز».'
  alternative: قد تُفهم على أنها وجبة مشتركة عادية، أو على أنها تتضمن عشاء الرب.
  rationale: قد تحمل العبارة إيحاءات إفخارستية في سفر الأعمال، لكن هذه الآية لا تحسم ذلك صراحةً؛ لذا تحافظ الترجمة على التوتر الدلالي واللاهوتي بدل أن تفسره في اتجاه واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحهما الحاشيتان مباشرةً، وحوفظ على إيجاز السرد وتسلسله.
