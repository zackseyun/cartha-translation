review_pass:
  verdict: revise
  source_fidelity: ينقل النص فعل الإيداع إلى الله وإلى «كلمة نعمته»، ويحافظ بحق على احتمال عود اسم الفاعل اليوناني إلى «الكلمة» في المتن مع إثبات احتمال عوده إلى الله في الحاشية. إلا أن مفعولي «تبني» و«تهب» مفهومان من السياق في اليونانية، وحذفهما في العربية يجعل العبارة غير مكتملة دلاليًا، ولا سيما «أن تبني» بلا مفعول.
  naturalness: «القادرة أن تبني وأن تهب الميراث» ثقيلة وغير طبيعية في العربية المعاصرة؛ فـ«تبنيكم» يبيّن الاستعارة الروحية المقصودة، و«تهب لكم الميراث» يوضح المتلقي الضمني. واستعمال «على أن» بعد «القادرة» أفصح وأسلس في هذا السياق.
  terminology: «أستودعكم الله»، و«كلمة نعمته»، و«الميراث»، و«الذين قد تقدسوا» اختيارات سليمة وتحافظ على السجل الكتابي دون تحميل مذهبي. تُصاغ الحاشية من جديد لتعرض البديل «القادر» بوصفه عائدًا إلى الله من غير تركيب عربي موهم أو غير متوافق نحويًا.
