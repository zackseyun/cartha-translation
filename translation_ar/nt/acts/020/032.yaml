  to: والآن أستودعكم اللهَ وكلمةَ نعمته[a]، القادرةَ على أن تبنيكم وأن تهبَ لكم الميراثَ بين جميع الذين قد تقدَّسوا.
  rationale: أُبقي مرجع «القادرة» في المتن إلى «كلمة نعمته» كما يتيح السياق اليوناني، مع الحفاظ على البديل في الحاشية. وأُظهر المخاطبون بوصفهم المفعول الضمني لفعلَي البناء ومنح الميراث، لأن ذلك لازم لسلامة العبارة العربية وواضح من السياق دون تغيير في معنى الآية.
