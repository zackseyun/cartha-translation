  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: ar
  text: والآن أستودعكم اللهَ وكلمةَ نعمته[a]، القادرةَ على أن تبنيكم وأن تهبَ لكم الميراثَ بين جميع الذين قد تقدَّسوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «القادر»، أي الله؛ إذ يمكن أن تعود العبارة في اليونانية إلى الله أساسًا لا إلى «كلمة نعمته».'
    reason: قراءة بديلة تحفظ الاحتمال النحوي الحقيقي في مرجع اسم الفاعل اليوناني.
lexical_decisions:
- source_word: παρατίθεμαι
  choice: أستودعكم
  rationale: ينقل معنى وضع المخاطَبين في رعاية الله، وهو تعبير عربي فصيح وطبيعي يلائم دلالة صيغة الوسط.
- source_word: τῷ θεῷ
  choice: اللهَ
  rationale: مفعول ثانٍ مع فعل «أستودع»، يبيّن مَن يُوضَع المخاطَبون في رعايته.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: وكلمةَ نعمته
  rationale: يحافظ على البنية الإضافية وعلى الثقل الدلالي لـ λόγος بوصفها الكلمة أو الرسالة المعلنة، من غير تحويلها إلى تفسير مطوّل.
- source_word: τῷ δυναμένῳ
  choice: القادرةَ
  rationale: أُعيد الوصف في المتن إلى «كلمة نعمته»، وهي السابقة الأقرب نحويًا؛ وأُثبت احتمال عوده إلى الله في الحاشية حفاظًا على الغموض الحقيقي.
- source_word: οἰκοδομῆσαι
  choice: أن تبنيَ
  rationale: يحافظ على استعارة البناء الروحي في اليونانية ولا يضيف مفعولًا غير مصرّح به، مع أن السياق يدل على بناء المخاطَبين.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: أن تهبَ الميراثَ
  rationale: «تهب» عربية طبيعية في سياق العطية الإلهية، و«الميراث» يحفظ الصدى الكتابي والأخروي للمصطلح.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: بين جميع الذين قد تقدَّسوا
  rationale: 'الصياغة الفعلية تحفظ دلالة اسم المفعول التام: تقديس وقع وله أثر مستمر، و«بين» تلائم دلالة الجماعة أو الشركة هنا.'
theological_decisions:
- issue: مرجع τῷ δυναμένῳ («القادر/القادرة»).
  choice: 'ربط العبارة في المتن بـ«كلمة نعمته»: «القادرة».'
  alternative: 'ربطها بالله: «القادر».'
  rationale: يحتمل التركيب اليوناني الوجهين. «كلمة نعمته» هي السابقة الأقرب، ويمكن أن توصف كلمة الله بأنها فاعلة في البناء؛ لكن الله نفسه قد يكون المقصود بوصفه واهب الميراث. لذلك أُبقي الاحتمال البديل في حاشية بدل حسم التوتر اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أستودعكم» لصياغة طبيعية، وحُفظت استعارة البناء وبنية «كلمة نعمته». ضُبطت «القادرةَ» نعتًا تابعًا لـ«كلمةَ» المنصوبة، مع إثبات القراءة الأخرى في الحاشية.
