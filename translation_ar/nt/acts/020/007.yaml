base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: ar
  text: وفي اليوم الأول من الأسبوع، حين كنا مجتمعين لكسر الخبز[a]، كان بولس يتحدث إليهم، إذ كان مزمعًا أن يغادر في اليوم التالي، فأطال الكلام إلى منتصف الليل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لتناول الخبز معًا». قد تشير العبارة إلى وجبة مشتركة، وقد تحمل أيضًا إيحاءات بعشاء الرب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: وفي اليوم الأول من الأسبوع
  rationale: العبارة اصطلاح يوناني شائع يدل على اليوم الأول من الأسبوع، و«وفي» تنقل الرابط الخفيف δέ من غير مبالغة في معنى الاستدراك.
- source_word: συνηγμένων ἡμῶν
  choice: حين كنا مجتمعين
  rationale: تنقل تركيب المضاف المطلق بوصفه ظرفًا مصاحبًا، وتحافظ على منظور الراوي بضمير المتكلمين.
- source_word: κλάσαι ἄρτον
  choice: لكسر الخبز
  rationale: تحافظ على اصطلاح النص وعلى دلالة المصدر الغائية، من غير حصره في وجبة عادية أو في ممارسة طقسية محددة.
- source_word: διελέγετο αὐτοῖς
  choice: كان بولس يتحدث إليهم
  rationale: صيغة الماضي الناقص تدل على فعل مستمر، و«يتحدث إليهم» عربية طبيعية لا تحصر الفعل في الوعظ الأحادي، مع أن الفعل اليوناني قد يلمح إلى التباحث أو الحوار.
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: إذ كان مزمعًا أن يغادر في اليوم التالي
  rationale: «مزمعًا» تنقل معنى القصد أو الحدث الوشيك في μέλλων، و«يغادر» أنسب لسياق السفر من الترجمة الحرفية «يخرج».
- source_word: παρέτεινέν τε τὸν λόγον
  choice: فأطال الكلام
  rationale: تنقل معنى إطالة الحديث؛ و«الكلام» هنا طبيعية وواضحة ولا تفرض أن λόγος يعني عظة رسمية بعينها.
- source_word: μέχρι μεσονυκτίου
  choice: إلى منتصف الليل
  rationale: تعبير زمني مباشر يحدد نهاية استمرار كلام بولس.
theological_decisions:
- issue: دلالة «كسر الخبز» في اجتماع المسيحيين الأوائل
  choice: الإبقاء على التعبير «كسر الخبز»
  alternative: تناول وجبة معًا؛ الاحتفال بعشاء الرب
  rationale: يمكن أن يدل التعبير على وجبة مشتركة، وقد يحمل أيضًا إيحاءات بعشاء الرب. يحفظ النص الاصطلاح واتساع دلالته من غير حسم خلافي غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حوفظ على منظور المتكلمين وعلى غموض «كسر الخبز»، مع تجنب المصطلحات الطائفية. لم تُضف حاشية إلى ترتيب جملة المغادرة لأنه لا يغير المعنى تغييرًا يستلزم تنبيه القارئ.
