base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: ar
  text: 'لكنهم قالوا له: «نحن لم نتلقَّ من اليهودية أية رسائل عنك، ولم يبلّغنا أو يقل لنا أحدٌ من الإخوة[a] الذين قدموا شيئًا سيئًا عنك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يُقصد بـ«الإخوة» يهودٌ مثلهم قدموا من اليهودية؛ ولا يحدد النص صراحة أنهم مؤمنون بالمسيح.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ... εἶπαν
  choice: لكنهم قالوا
  rationale: تنقل «لكن» قوة δέ الانتقالية ذات المسحة الاستدراكية في سياق الحوار، من غير مبالغة في إبراز التضاد.
- source_word: Ἡμεῖς
  choice: نحن
  rationale: أُبقي الضمير المنفصل لأنه وارد صراحة في اليونانية ويحمل قدرًا من التوكيد.
- source_word: οὔτε γράμματα ... ἐδεξάμεθα
  choice: لم نتلقَّ ... أية رسائل
  rationale: صياغة عربية طبيعية تحفظ النفي وتدل على تلقي المراسلات، وهو معنى γράμματα وδέχομαι هنا.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: من اليهودية
  rationale: نقل مباشر وواضح للاسم الجغرافي.
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: يأتِ أحد من الإخوة
  rationale: يعبر عن وصول شخص من الجماعة المذكورة من غير إضافة «إلى هنا»، إذ لا ترد صراحة في النص.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν
  choice: فيخبرنا أو يتكلم
  rationale: يحافظ على التمييز الخفيف بين نقل خبر وبين الكلام، مع جعل المفعول المفهوم من السياق صريحًا في «يخبرنا» وفق العربية الطبيعية.
- source_word: τι περὶ σοῦ πονηρόν
  choice: عنك بسوء
  rationale: تعبير عربي موجز وطبيعي يفيد قول شيء سيئ أو ضار بشأن بولس من غير تشديد دلالي زائد.
theological_decisions:
- issue: هوية «الإخوة» (τῶν ἀδελφῶν)
  choice: الإبقاء على «الإخوة» من غير تحديد هويتهم
  alternative: إخوتنا اليهود؛ أو الإخوة المؤمنون بالمسيح
  rationale: المتكلمون من زعماء اليهود في روما، وقد تشير العبارة إلى يهود مثلهم قدموا من اليهودية، لكن النص لا يصرح بأنهم يهود فحسب ولا بأنهم مؤمنون بالمسيح؛ لذلك تُحفظ العبارة ويفسر الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. اختيرت بنية سلسة تحفظ النفي المزدوج في الأصل، مع تجنب إضافة تحديد مكاني أو طائفي لا يصرح به النص.
