review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: النفي المزدوج، والرسائل من اليهودية، وعدم ورود كلام سيئ عن بولس. لكن «ولم يأتِ أحد ... فيخبرنا أو يتكلم» تجعل المجيء متبوعًا بالفعل على نحو يوحي بتعاقب زمني («فـ»)، بينما اليونانية تصف «أحدًا من الإخوة الذين قدموا» ثم تنفي عنه الإبلاغ أو الكلام. كما أن «يتكلم عنك بسوء» أضعف قليلًا في إظهار «شيئًا» (τι) بوصفه مفعولًا للكلام.'
  naturalness: 'الصياغة مفهومة وفصيحة، لكن إعادة ترتيب الجملة تجعل علاقة اسم الفاعل بالفعل أوضح وأقرب إلى الاستعمال العربي المعاصر: «أحد من الإخوة الذين قدموا». ويأتي «يبلّغنا أو يقول لنا شيئًا سيئًا عنك» سلسًا ويحفظ الفعلين.'
  terminology: «اليهودية» و«الإخوة» مناسبَتان. والحاشية تحسن في عدم افتراض أن «الإخوة» مؤمنون بالمسيح، وتعرض احتمال اليهود الزملاء دون حسم.
  issues:
  - severity: medium
    issue: بنية «ولم يأتِ أحد من الإخوة فيخبرنا أو يتكلم»
    rationale: تربط الفاء الإخبار/الكلام بالمجيء بوصفه نتيجة أو خطوة لاحقة، في حين أن παραγενόμενος يصف الشخص الذي قدم، ثم يأتي النفي على فعلي الإبلاغ والكلام. الصياغة المنقحة تفصل الوصف عن الأفعال المنفية.
  - severity: low
    issue: عدم إظهار «τι» بوضوح مع «يتكلم عنك بسوء»
    rationale: المعنى مفهوم، لكن «يقول لنا شيئًا سيئًا عنك» يعكس مفعول «شيئًا» في الأصل بوضوح أكبر.
