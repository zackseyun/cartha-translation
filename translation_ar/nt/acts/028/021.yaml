  to: 'لكنهم قالوا له: «نحن لم نتلقَّ من اليهودية أية رسائل عنك، ولم يبلّغنا أو يقل لنا أحدٌ من الإخوة[a] الذين قدموا شيئًا سيئًا عنك».'
  rationale: تُبقي المراجعة جميع عناصر المعنى، لكنها تعيد بناء الشق الثاني بحيث يكون «الذين قدموا» وصفًا لـ«الإخوة» كما في اليونانية، لا فعلًا متسلسلًا تليه نتيجة. كما تُظهر «شيئًا سيئًا» وتبقي التمييز المعتدل بين «يبلّغ» و«يقول».
  reviewer_model: gpt-5.6-terra
