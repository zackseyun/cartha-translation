id: ACT.28.4
reference: Acts 28:4
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: ar
  text: 'فَلَمَّا رَأَى أَهْلُ الْجَزِيرَةِ[a] الْحَيَوَانَ مُتَدَلِّيًا مِنْ يَدِهِ، قَالَ بَعْضُهُمْ لِبَعْضٍ: «لَا شَكَّ أَنَّ هَذَا الرَّجُلَ قَاتِلٌ؛ فَمَعَ أَنَّهُ نَجَا مِنَ الْبَحْرِ، لَمْ تَدَعْهُ الْعَدَالَةُ يَحْيَا».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «البرابرة»، وهو تعبير يوناني كان يُطلق على السكان المحليين غير الناطقين باليونانية، لا وصفًا لهم بالوحشية.'
    reason: lexical_alternative
  - marker: b
    text: قد تكون «العدالة» هنا مشخصة بوصفها قوة القصاص، وربما تشير إلى إلهة في معتقد أهل الجزيرة الوثني.
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: أهل الجزيرة
  rationale: يدل اللفظ في هذا السياق على السكان المحليين غير الناطقين باليونانية، لا على الوحشية بالمعنى الأخلاقي الحديث. و«أهل الجزيرة» تعبير عربي طبيعي يحدّد المقصود بحسب السياق.
- source_word: κρεμάμενον
  choice: متدليًا
  rationale: ينقل صورة الحيوان المعلّق أو المتشبث بيد بولس دون الجزم بكيفية تعلقه الدقيقة.
- source_word: τὸ θηρίον
  choice: الحيوان
  rationale: الاسم اليوناني عام، أي حيوان أو مخلوق، مع أن السياق السابق يبيّن أنه أفعى. يحافظ الاختيار على عمومية اللفظ هنا.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: قال بعضهم لبعض
  rationale: صياغة عربية طبيعية تصرّح بالتبادل الذي يفيده النص، من غير إثقال العبارة بدلالة الاستمرار المحتملة في صيغة الماضي الناقص.
- source_word: Πάντως
  choice: لا شك أن
  rationale: يعبر عن استنتاج المتكلمين القوي ويوافق أسلوب الحوار العربي المعاصر الفصيح.
- source_word: φονεύς
  choice: قاتل
  rationale: اللفظ يدل على قاتل إنسان، وقد تكون «قاتل» في العربية أوضح وأطبع من «سفّاك» أو صياغات قانونية أضيق.
- source_word: διασωθέντα
  choice: نجا
  rationale: يفيد الوصول سالمًا عبر الخطر. المبني للمعلوم طبيعي في العربية ولا يحمّل العبارة إيحاءً خلاصيًا لاهوتيًا غير لازم.
- source_word: ἡ δίκη
  choice: العدالة
  rationale: يحافظ على معنى العدالة الجزائية مع إمكان تشخيصها في تصور أهل الجزيرة، من غير أن يصرّح في المتن بأنها اسم إلهة.
- source_word: ζῆν οὐκ εἴασεν
  choice: لم تدعه يحيا
  rationale: ينقل حرفيًا وطبيعيًا معنى عدم السماح له بمواصلة الحياة.
- source_word: ἐκ τῆς θαλάσσης
  choice: من البحر
  rationale: ينقل معنى ἐκ المكاني مباشرة، بينما يحمل فعل النجاة معنى اجتياز الخطر.
theological_decisions:
- issue: تشخيص ἡ δίκη
  choice: العدالة مع الإبقاء على إسناد فعل شخصي إليها وشرح الاحتمال في الحاشية
  alternative: إلهة العدالة، أو القصاص
  rationale: إسناد «لم تدعه» يحفظ التشخيص الموجود في كلام أهل الجزيرة، لكنه لا يحسم هل قصدوا قوة القصاص المجردة أم شخصية إلهية وثنية، ولا يوحي بأن الراوي يقر اعتقادهم.
translation_notes:
  register: 'عربية فصحى حديثة واضحة وكريمة، مع ضبط كامل للنص. اختيرت صياغة طبيعية تحافظ على ترتيب الحجة: نجا من البحر، لكن العدالة—بحسب استنتاج أهل الجزيرة—لم تسمح له بالبقاء حيًا. أُثبتت علامتا الحاشية [a] و[b] في المتن.'
