  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: ar
  text: وبعد أن اتفقوا معه على يوم، جاء إليه في مكان إقامته عدد أكبر منهم[a]. وكان يشرح لهم[b]، ويشهد شهادة مؤكدة عن ملكوت الله، ويسعى إلى إقناعهم بشأن يسوع[c]، معتمدًا في ذلك على شريعة موسى والأنبياء، من الصباح إلى المساء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «إلى مسكنه» أو «إلى الموضع الذي كان يقيم فيه». تشير الكلمة اليونانية إلى المسكن أو مكان الضيافة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «يعرض لهم الأمر بالتفصيل».'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «ويقنعهم بشأن يسوع». قد يبرز اسم الفاعل اليوناني فعل الإقناع نفسه أو السعي إليه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι ... αὐτῷ ἡμέραν
  choice: اتفقوا معه على يوم
  rationale: ينقل تعبير تحديد يوم للقاء بصياغة عربية طبيعية، مع إبقاء معنى المشاركة الذي يفيده السياق.
- source_word: ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν
  choice: جاء إليه في مكان إقامته
  rationale: يعبر بوضوح عن مجيئهم إلى المسكن أو محل الإقامة، من غير افتراض نوع محدد من السكن.
- source_word: πλείονες
  choice: عدد أكبر منهم
  rationale: يحافظ على الصيغة المقارنة في اليونانية بدل تسويتها إلى «كثيرون» فقط.
- source_word: ἐξετίθετο
  choice: أخذ يشرح لهم
  rationale: ينقل الفعل المستمر في الماضي ومعنى العرض التفسيري بلغة عربية واضحة ومعاصرة.
- source_word: διαμαρτυρόμενος
  choice: يشهد بجدية
  rationale: يحفظ قوة الشهادة المؤكدة والجادة من دون صياغة ثقيلة أو مبالغة تفسيرية.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: مقابل عربي راسخ وشفاف يحافظ على المصطلح الكتابي.
- source_word: πείθων τε αὐτοὺς περὶ τοῦ Ἰησοῦ
  choice: ويسعى إلى إقناعهم بشأن يسوع
  rationale: يبرز نشاط الإقناع المستمر من غير أن يحسم أن جميع السامعين اقتنعوا بالفعل.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: مستندًا في ذلك إلى شريعة موسى وكتب الأنبياء
  rationale: يجعل دلالة المصدر أو أساس الاستدلال واضحة، ويعبر عن «الأنبياء» بوصفها الكتابات النبوية المقصودة في هذا السياق.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: من الصباح إلى المساء
  rationale: ترجمة مباشرة وطبيعية للامتداد الزمني من غير تخصيص الصباح بالفجر.
theological_decisions:
- issue: العلاقة بين الشهادة لملكوت الله والإقناع بشأن يسوع
  choice: عرضهما بوصفهما جانبين مترابطين من شرح واحد مستند إلى شريعة موسى وكتب الأنبياء
  alternative: اعتبارهما موضوعين منفصلين لا رابط ضروري بينهما
  rationale: تركيب الآية يجمع الشهادة للملكوت والكلام بشأن يسوع ضمن عرض متواصل، من غير إضافة نظام لاهوتي يتجاوز النص.
- issue: مدى نجاح الإقناع
  choice: «يسعى إلى إقناعهم»
  alternative: «ويقنعهم»
  rationale: تحافظ الصياغة على فعل الإقناع بوصفه جهدًا مستمرًا، ولا تستنتج استجابة ناجحة من الجميع؛ وتثبت الحاشية البديل الأقرب حرفيًا.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدمت جمل مترابطة وإيقاع سردي طبيعي، مع تجنب الألفاظ المذهبية الخاصة، والحفاظ على المقارنة في πλείονες وعلى عدم الجزم بنتيجة محاولة الإقناع.
