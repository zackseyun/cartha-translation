  to: وبعد أن اتفقوا معه على يوم، جاء إليه في مكان إقامته عدد أكبر منهم[a]. وكان يشرح لهم[b]، ويشهد شهادة مؤكدة عن ملكوت الله، ويسعى إلى إقناعهم بشأن يسوع[c]، معتمدًا في ذلك على شريعة موسى والأنبياء، من الصباح إلى المساء.
