lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: أَمَّا هُوَ فَـ
  rationale: تؤدي «أمّا هو فـ» وظيفة الاستئناف والانتقال الخفيف، مع استعمال أداة التعريف اليونانية استعمالًا ضميريًا للإشارة إلى بولس.
- source_word: ἀποτινάξας
  choice: نَفَضَ ... عَنْهُ
  rationale: ينقل فعل النفض بقصد التخلص من الحيوان؛ وجاء الفعل العربي معطوفًا بالفاء ليُفهم أن هذا الفعل سبق عدم إصابته بالأذى ضمن تتابع السرد.
- source_word: τὸ θηρίον
  choice: الْحَيَوَانَ
  rationale: اللفظ اليوناني عام، ويشير إلى حيوان قد يكون بريًا؛ و«الحيوان» يحافظ على هذا العموم، مع أن السياق السابق يبيّن أنه حية.
- source_word: εἰς τὸ πῦρ
  choice: إِلَى النَّارِ
  rationale: ترجمة مباشرة لحركة الحيوان نحو النار وسقوطه فيها، مع اقترانها بـ«نفض عنه» في تركيب عربي طبيعي.
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: لَمْ يُصِبْهُ أَيُّ أَذًى
  rationale: صياغة عربية واضحة وطبيعية تعبّر عن عدم تعرض بولس لضرر أو أثر سيئ، من غير تضييق نوع الأذى.
