  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: ar
  text: وبعد ثلاثة أشهر أبحرنا في سفينة إسكندرانية كانت قد أمضت الشتاء في الجزيرة، وتحمل شارة الديوسكوري[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الديوسكوري هما كاستور وبولوكس، ابنا زيوس التوأمان في الأساطير اليونانية والرومانية.
    reason: شرح الاسم الأسطوري غير المألوف مع بيان هويته بدقة والحفاظ على الاسم الوارد في الأصل.
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: وبعد ثلاثة أشهر
  rationale: تفيد μετά مع النصب الزمن اللاحق لفترة، وتُنقل δέ بواو ربط خفيفة تلائم تتابع السرد العربي.
- source_word: ἀνήχθημεν
  choice: أبحرنا
  rationale: للفعل ἀνάγω هنا معنى بحري هو الانطلاق إلى البحر؛ و«أبحرنا» تعبير عربي طبيعي وموجز.
- source_word: ἐν πλοίῳ ... Ἀλεξανδρίνῳ
  choice: في سفينة إسكندرانية
  rationale: πλοῖον سفينة، والصفة Ἀλεξανδρίνῳ تدل على انتسابها إلى الإسكندرية أو منشئها فيها؛ و«إسكندرانية» صياغة عربية مباشرة.
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: كانت قد أمضت الشتاء في الجزيرة
  rationale: اسم الفاعل التام من παραχειμάζω يدل على بقاء السفينة هناك طوال الشتاء، وهذه الصياغة أوضح من استعمال فعل عربي نادر بمعنى «شتت».
- source_word: παρασήμῳ Διοσκούροις
  choice: وتحمل شارة الديوسكوري
  rationale: παράσημος يدل على العلامة أو الشارة المميزة للسفينة، ولا يحسم النص أنها تمثال في مقدمتها؛ لذلك تحافظ «شارة» على سعة الدلالة. ونُقل الاسم اليوناني الخاص صوتيًا مع شرحه في الحاشية.
theological_decisions:
- issue: وصف الشارة الوثنية للسفينة
  choice: الديوسكوري
  alternative: التوأمان الإلهان؛ كاستور وبولوكس
  rationale: النص يذكر اسمًا أسطوريًا بوصفه شارة للسفينة من غير إقرار ديني. إبقاء الاسم الخاص أقرب إلى اليونانية وأقل تفسيرًا، مع بيان هويته في الحاشية.
- issue: طبيعة παράσημος في السفينة
  choice: شارة
  alternative: تمثال المقدمة
  rationale: يمكن أن تشير اللفظة إلى علامة أو شعار أو صورة مميزة، وربما إلى تمثال المقدمة، لكن اليونانية لا تلزم بهذا التحديد؛ لذا حُفظ الاحتمال الأوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أمضت الشتاء» للطبيعية، و«شارة» لتجنب حسم هيئة العلامة البحرية بما يتجاوز دلالة الأصل.
