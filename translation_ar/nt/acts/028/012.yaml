lexical_decisions:
- source_word: καταχθέντες
  choice: لما رسونا
  rationale: الفعل κατάγω في سياق السفر البحري يدل على الوصول إلى المرفأ أو الرسو فيه. واختيار «رسونا» ينقل الدلالة البحرية بوضوح وطبيعية، دون الالتزام بالمعنى الحرفي «أُنزلنا».
- source_word: εἰς Συρακούσας
  choice: في سَراقوسة
  rationale: مع فعل الرسو، تعبّر «في» طبيعيًا عن بلوغ الميناء والرسو فيه، مع أن εἰς تحمل في أصلها معنى الاتجاه إلى المكان.
- source_word: ἐπεμείναμεν
  choice: أقمنا هناك
  rationale: الفعل يعني البقاء أو المكث. و«أقمنا هناك» عربية فصيحة واضحة، و«هناك» تُظهر الإحالة المكانية المفهومة من السياق دون تغيير المعنى.
- source_word: ἡμέρας τρεῖς
  choice: ثلاثة أيام
  rationale: صيغة النصب تدل على امتداد الزمن، وتؤدي «ثلاثة أيام» هذه المدة طبيعيًا مع فعل «أقمنا».
- source_word: Συρακούσας
  choice: سَراقوسة
  rationale: نقل عربي شائع لاسم المدينة اليونانية Συράκουσαι، مع ضبط أول الكلمة لتيسير القراءة.
