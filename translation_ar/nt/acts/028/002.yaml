    text: اللفظ اليوناني يعني حرفيًا «البرابرة»، أي الشعوب غير الناطقة باليونانية؛ والمقصود هنا أهل الجزيرة، من غير أن يلزم منه وصفهم بالتوحش.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: أهل الجزيرة
  rationale: يدل اللفظ هنا على سكان الجزيرة غير الناطقين باليونانية، لا على التوحش. و«أهل الجزيرة» تعبير عربي طبيعي ومحايد يلائم السياق.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: لطفًا غير عادي
  rationale: يحفظ هذا التعبير صيغة النفي في الأصل ومعنى اللطف الإنساني الذي يفوق المعتاد، بلغة عربية واضحة.
- source_word: παρεῖχον
  choice: أظهر لنا
  rationale: يأتي الفعل مع «اللطف» بمعنى إبدائه ومعاملة الآخرين به.
- source_word: ἅψαντες πυρὰν
  choice: أوقدوا نارًا
  rationale: ينقل المعنى المباشر لإشعال النار من غير تخصيصها بنار كبيرة أو موقد بعينه.
- source_word: προσελάβοντο πάντας ἡμᾶς
  choice: استقبلونا جميعًا
  rationale: يفيد الفعل القبول والترحيب في سياق الضيافة، وتحفظ «جميعًا» شمول العبارة الأصلية.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: بسبب المطر المنهمر
  rationale: تشير العبارة إلى المطر الذي حلّ وكان مستمرًا آنذاك؛ و«المنهمر» تنقل حضوره الجاري طبيعيًا من غير إضافة زمن غير مصرّح به.
- source_word: διὰ τὸ ψῦχος
  choice: وبسبب البرد
  rationale: ترجمة مباشرة وواضحة للبرد بوصفه سببًا لاستقبالهم حول النار.
