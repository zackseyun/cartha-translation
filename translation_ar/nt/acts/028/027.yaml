  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: ar
  text: 'لِأَنَّ قَلْبَ هَذَا الشَّعْبِ قَدْ تَبَلَّدَ[a]، وَبِآذَانِهِمْ سَمِعُوا بِثِقَلٍ، وَأَغْمَضُوا عُيُونَهُمْ، لِئَلَّا يَرَوْا بِعُيُونِهِمْ، وَيَسْمَعُوا بِآذَانِهِمْ، وَيَفْهَمُوا بِقُلُوبِهِمْ، وَيَرْجِعُوا[b]، وَأَشْفِيهِمْ.


    [a] تحمل أداة الربط اليونانية في هذا الاقتباس من إشعياء معنى قويًا قد يفيد «لئلا» أو الغاية السلبية: «لئلا يروا... ويسمعوا... ويفهموا... ويرجعوا، وأشفيهم».


    [b] يمكن أيضًا ترجمة «يرجعوا»: «يعودوا» أو «يتوبوا» بحسب السياق.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تحمل أداة الربط اليونانية في هذا الاقتباس من إشعياء معنى قويًا قد يفيد «لئلا» أو الغاية السلبية: «لئلا يروا... ويسمعوا... ويفهموا... ويرجعوا، وأشفيهم».'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا ترجمة «يرجعوا»: «يعودوا» أو «يتوبوا» بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: قد تبلّد
  rationale: ينقل المعنى المجازي لصيرورة القلب غليظًا أو عديم الحس، بصياغة عربية واضحة، من غير تحويله إلى تفسير عقائدي صريح.
- source_word: καρδία
  choice: قلب
  rationale: يحفظ المصطلح الأنثروبولوجي الكتابي ووحدة الصورة مع «يفهموا بقلوبهم».
- source_word: λαοῦ
  choice: الشعب
  rationale: المقابل الطبيعي في سياق الاقتباس من إشعياء.
- source_word: βαρέως ἤκουσαν
  choice: سمعوا بثقل
  rationale: يحفظ استعارة الثقل والصيغة الماضية غير المألوفة في الأصل، مع وضوح مقبول في العربية الفصحى.
- source_word: ἐκάμμυσαν
  choice: أغمضوا
  rationale: فعل عربي طبيعي ودقيق لإغلاق العيون عمدًا.
- source_word: μήποτε
  choice: لئلا
  rationale: يحفظ قوة الغاية السلبية أو التحذير التي تحتملها الأداة اليونانية في الاقتباس، بدل تلطيفها إلى مجرد نتيجة افتراضية.
- source_word: συνῶσιν
  choice: يفهموا
  rationale: مقابل واضح وطبيعي يتلاءم مع إسناد الفهم إلى القلب.
- source_word: ἐπιστρέψωσιν
  choice: يرجعوا
  rationale: يحفظ صورة التحول والعودة وإيحاءها الديني، من غير تضييق المعنى إلى «يتوبوا» وحدها.
- source_word: ἰάσομαι
  choice: فأشفيهم
  rationale: يحفظ صورة الشفاء وصيغة المتكلم، ويربطها نحويًا بسلسلة الأفعال التابعة لـ«لئلا».
theological_decisions:
- issue: القصد الإلهي في اقتباس إشعياء
  choice: إبقاء «لئلا» في المتن
  alternative: «وإلا فقد يرون...» أو «كيلا»
  rationale: الأداة μήποτε هنا تحتمل معنى قويًا يفيد الغاية السلبية، و«لئلا» تحفظ توتر النص بين الدينونة الإلهية ومسؤولية الشعب من غير شرحه أو حسمه مذهبيًا.
- issue: معنى ἐπιστρέψωσιν
  choice: يرجعوا
  alternative: يتوبوا أو يعودوا
  rationale: «يرجعوا» تحافظ على الاستعارة الاتجاهية وعلى دلالة التحول في السياق، من غير فرض مصطلح لاهوتي أضيق.
- issue: علاقة ἰάσομαι بما قبلها
  choice: فأشفيهم
  alternative: وأنا أشفيهم أو فكنت أشفيهم
  rationale: المضارع المنصوب بعد الفاء في العربية يلائم البنية التابعة لـ«لئلا» ويحفظ الترابط من غير تحويل المستقبل اليوناني إلى شرط مخالف للواقع صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي بين العين والأذن والقلب، كما حُفظت استعارة ثقل السمع. استُعمل ضبط جزئي في النص لتوضيح القراءة، مع تجنب الألفاظ المذهبية الخاصة.
