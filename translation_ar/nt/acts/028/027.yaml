  rationale: 'أُبقيت الاختيارات الرئيسة لأنها أمينة وطبيعية: «تبلّد»، و«سمعوا بثقل»، و«أغمضوا عيونهم»، و«لئلا»، و«يرجعوا». والتصحيح اللازم هو استبدال «فأشفيهم» بـ«وأشفيهم» لإبقاء الشفاء معطوفًا داخل سلسلة الجملة كما في اليونانية، لا نتيجة سببية مصوّرة بالـفاء. كما نُقحت الحاشية أ لتكون وصفًا حقيقيًا للبديل الدلالي لا تكرارًا غير دقيق لما في المتن.'
