  source_fidelity: 'الترجمة تنقل البنية الأساسية للنص اليوناني والاقتباس الإشعيائي بأمانة عامة: تبلّد القلب، وثقل السماع، وإغماض العيون، ثم سلسلة الرؤية والسماع والفهم والرجوع والشفاء. لكن «فأشفيهم» بعد «لئلا» غير سليمة دلاليًا في العربية؛ ففاء السببية تجعل الشفاء نتيجةً لما أريد منعُه، بينما اليونانية تعطف «وأشفيهم» داخل ما يُخشى/يُمنع وقوعه. كما أن ضبط «أَشْفِيَهُمْ» بوصفه منصوبًا يزيد هذا الإشكال.'
  naturalness: «سمعوا بثقل» مفهومة لكنها متكلفة قليلًا في العربية المعاصرة؛ «سمعوا بصعوبة» أو «كان سمعهم ثقيلًا» أوضح. وللمحافظة على قرب الصورة الأصلية وتوازيها، «سمعوا بثقل» مقبولة إذا صيغت بقية الجملة بسلاسة. «أغمضوا عيونهم» طبيعية، و«قد تبلّد» مناسبة.
  terminology: «قلب»، «الشعب»، «يفهموا بقلوبهم»، «يرجعوا»، و«أشفيهم» اختيارات سليمة. «لئلا» يحفظ الاحتمال القوي لـμήποτε من غير حسمٍ تفسيري. ينبغي وصل «وأشفيهم» بالواو لا بالفاء، وعدم جعله مضارعًا منصوبًا بسبب فاء السببية.
