  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: ar
  text: لهذا السبب، إذن، طلبت أن أراكم وأتحدث معكم، إذ إني بسبب رجاء إسرائيل مقيَّد بهذه السلسلة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الرجاء الخاص بإسرائيل». وقد تشير العبارة إلى رجاء إسرائيل المتصل بوعود العهد والقيامة، من غير أن تحصر معناها في جانب واحد.'
    reason: بديل دلالي مع بيان الإيحاء اللاهوتي الذي يظل النص الأصلي غير مصرِّح بتحديده.
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: فلهذا السبب إذًا
  rationale: يحفظ العبارة السببية وأداة الاستنتاج معًا، على الرغم مما في اجتماعهما من توكيد ظاهر، ويُبقي الصلة المنطقية الصريحة في كلام بولس.
- source_word: παρεκάλεσα
  choice: طلبت
  rationale: يناسب سياق استدعاء بولس قادة اليهود المحليين، وهو طبيعي في العربية المعاصرة من غير إضفاء صبغة قانونية على الطلب.
- source_word: ἰδεῖν
  choice: أن أراكم
  rationale: يحافظ على المعنى المباشر للفعل، ويؤدي في السياق معنى اللقاء أداءً طبيعيًا.
- source_word: προσλαλῆσαι
  choice: وأتحدث إليكم
  rationale: ينقل معنى الدخول معهم في حديث، لا مجرد توجيه خطاب أحادي إليهم.
- source_word: ἕνεκεν γὰρ
  choice: لأنني من أجل
  rationale: يحفظ أداة التعليل γάρ والدلالة السببية لـἕνεκεν، مع تركيب عربي واضح يربط قيد بولس بالرجاء المذكور.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραὴλ
  choice: رجاء إسرائيل
  rationale: صياغة موجزة تحفظ تركيب الإضافة وغموضه المقصود، من غير حصر الرجاء صراحة في القيامة أو المسيحانية أو وعود العهد.
- source_word: τὴν ἅλυσιν ταύτην
  choice: بهذه السلسلة
  rationale: يحفظ المفرد وصورة القيد المادي الذي كان بولس يحمله في أسره.
- source_word: περίκειμαι
  choice: موثَق
  rationale: يؤدي في العربية الطبيعية حالة وجود السلسلة حول بولس بوصفها قيدًا، ويتجنب إيحاء «أرتدي» بأنها حِلْية، مع إبقاء السلسلة مذكورة صراحة.
theological_decisions:
- issue: دلالة «رجاء إسرائيل»
  choice: إبقاء العبارة «رجاء إسرائيل» بلا تفسير داخل المتن
  alternative: الرجاء الموعود لإسرائيل؛ أو رجاء إسرائيل في القيامة؛ أو رجاء إسرائيل المسيحاني
  rationale: قد تشير العبارة إلى رجاء إسرائيل المرتبط بالعهد والقيامة والمسيح، لكن النص اليوناني يوردها موجزة وموحية؛ لذلك لا يحصرها المتن في تفسير لاهوتي واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. أُبقي التوكيد المنطقي في مطلع الآية، وصيغت خاتمتها بصورة طبيعية تدل على القيد الفعلي من غير تحويل العبارة اللاهوتية الموجزة إلى شرح مذهبي.
