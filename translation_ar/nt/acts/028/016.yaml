base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: ar
  text: ولمّا دخلنا روما، أُذِنَ لبولس أن يقيم بمفرده مع الجندي الذي يحرسه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يسكن بمفرده مع جندي يحرسه».'
    reason: بديل معجمي لـ«يقيم» يبيّن إمكان ترجمة μένειν بمعنى السكن، مع صياغة بديلة غير محددة للجندي، من غير تغيير معنى الحراسة أو المصاحبة.
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: ولمّا
  rationale: تؤدي «لمّا» معنى الظرف الزمني، وتستوعب الوصل الخفيف الذي تؤديه δέ من غير إثقال العبارة بأداة استدراك لا يقتضيها السياق.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: دخلنا روما
  rationale: تنقل فعل الدخول واتجاه الحركة نقلاً مباشرًا وطبيعيًا في العربية.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: أُذِنَ لبولس
  rationale: صيغة المبني للمجهول تحافظ على كون الإذن قد مُنح لبولس من غير تسمية الجهة المانحة.
- source_word: μένειν
  choice: أن يقيم
  rationale: «يقيم» ملائمة لسياق السكن المؤقت أو الإقامة المقيدة، وتحافظ على مجال معنى الفعل دون حصره في السكن الدائم.
- source_word: καθ’ ἑαυτὸν
  choice: بمفرده
  rationale: تفيد الإقامة على نحو منفصل، من غير أن توحي بعزلة مطلقة، إذ كان الجندي معه.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: مع الجندي الذي كان يحرسه
  rationale: تحافظ «مع» على معنى المصاحبة، وتراعي أداة التعريف اليونانية التي تشير إلى الجندي المعيّن لحراسته، بينما تنقل الصلة وظيفة الجندي بوضوح.
