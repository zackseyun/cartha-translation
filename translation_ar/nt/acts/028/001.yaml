lexical_decisions:
- source_word: διασωθέντες
  choice: بعد أن نجونا سالمين
  rationale: اسم فاعل ماضٍ مبني للمجهول في اليونانية يدل على النجاة التامة من الخطر. وهذه الصياغة العربية طبيعية وتحفظ معنى الخلاص الآمن من حادثة غرق السفينة، من غير حصره في مجرد الوصول إلى الشاطئ.
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمني يبيّن تعاقب الأحداث، و«حينئذ» فصيحة وطبيعية في السرد.
- source_word: ἐπέγνωμεν
  choice: عرفنا
  rationale: الفعل هنا يدل على التوصل إلى معرفة معلومة، أي معرفة اسم الجزيرة.
- source_word: Μελίτη
  choice: مالطة
  rationale: هو الاسم اليوناني للجزيرة المعروفة تقليديًا وتاريخيًا بمالطة، وهذه هي الصيغة العربية المعيارية لاسمها.
- source_word: ἡ νῆσος
  choice: الجزيرة
  rationale: مقابل عربي مباشر وواضح للعبارة اليونانية.
- source_word: καλεῖται
  choice: تُدعى
  rationale: يحفظ المضارع المبني للمجهول في الأصل اليوناني، ويؤدي معنى الاسم الذي تُعرف به الجزيرة.
