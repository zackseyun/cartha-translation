  text: ὅθεν ⸀περιελόντες κατηντήσαμεν εἰς Ῥήγιον. καὶ μετὰ μίαν ἡμέραν ἐπιγενομένου νότου δευτεραῖοι ἤλθομεν εἰς Ποτιόλους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: ar
  text: ومن هناك، بعد أن رفعنا المرساة[a]، وصلنا إلى ريغِيُون. وبعد يوم واحد، هبَّت ريح جنوبية، فوصلنا في اليوم الثاني إلى بُوطِيُولِي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعد أن أبحرنا». الفعل اليوناني περιελόντες مصطلح بحري قد يشير تحديدًا إلى رفع المرساة، أو بصورة أعم إلى الإبحار.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: ومن هناك
  rationale: تعبير مكاني طبيعي في السرد، يحفظ معنى الانتقال من الموضع السابق.
- source_word: περιελόντες
  choice: بعد أن رفعنا المرساة
  rationale: للفعل هنا دلالة بحرية على فك ما يثبت السفينة والانطلاق؛ ورفع المرساة صياغة عربية واضحة ومناسبة للسياق، مع إثبات المعنى الأعم في الحاشية.
- source_word: κατηντήσαμεν
  choice: وصلنا
  rationale: يدل الفعل على بلوغ وجهة، و«وصلنا» عربية طبيعية ودقيقة.
- source_word: Ῥήγιον
  choice: ريغِيُون
  rationale: نقل صوتي للاسم اليوناني القديم مع ضبط يساعد على قراءته.
- source_word: μετὰ μίαν ἡμέραν
  choice: وبعد يوم واحد
  rationale: يحفظ البنية الزمنية الصريحة في اليونانية.
- source_word: ἐπιγενομένου νότου
  choice: هبَّت ريح جنوبية
  rationale: ينقل تركيب الحال المستقلة بوصفه ظرفًا مصاحبًا، في صياغة عربية مألوفة للرياح.
- source_word: δευτεραῖοι
  choice: في اليوم الثاني
  rationale: يحفظ التحديد الزمني المباشر بدل تفسيره اختصارًا بأنه اليوم التالي.
- source_word: ἤλθομεν
  choice: وصلنا
  rationale: مع ذكر الوجهة، تؤدي «وصلنا» معنى الحركة وبلوغ المكان بسلاسة.
- source_word: Ποτιόλους
  choice: بُوطِيُولِي
  rationale: نقل صوتي مباشر للاسم اليوناني Ποτιόλους، بحسب صيغته المعجمية Ποτίολοι.
