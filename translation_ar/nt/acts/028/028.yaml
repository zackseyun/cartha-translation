base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: ar
  text: فليكن معلومًا لديكم إذن أن هذا الخلاص الإلهي قد أُرسل إلى غير اليهود[a]؛ وهم أيضًا سيصغون[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «إلى الأمم»، والمقصود في هذا السياق غير اليهود.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وهم أيضًا سيسمعون». يمكن أن يدل الفعل اليوناني على السماع أو على الإصغاء والاستجابة بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: فليكن معلومًا لديكم إذن
  rationale: يحافظ على صيغة الإعلان الآمرة وعلى دلالة οὖν الاستنتاجية، بلغة عربية فصيحة واضحة.
- source_word: τοῖς ἔθνεσιν
  choice: إلى غير اليهود
  rationale: السياق قائم على المقابلة بين اليهود والأمم، ولذلك يوضح التعبير المقصود دون أن يوحي بالدول أو الشعوب السياسية.
- source_word: ἀπεστάλη
  choice: قد أُرسل
  rationale: ينقل المبني للمجهول والفعل المكتمل، مع إبراز صلته بالحاضر بواسطة «قد».
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: خلاص الله هذا
  rationale: يبقي σωτήριον بمعنى «الخلاص» ولا يحصره في «رسالة الخلاص»، كما يحافظ على إيجاز الإضافة اليونانية وما فيها من سعة دلالية.
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: وهم سيصغون
  rationale: «يصغون» تعبّر طبيعيًا عن السماع المتقبّل المرجح في السياق، مع إبراز الضمير αὐτοί؛ وتُذكر دلالة «سيسمعون» الممكنة في الحاشية.
theological_decisions:
- issue: دلالة τοῦ θεοῦ في عبارة «خلاص الله»
  choice: خلاص الله
  alternative: الخلاص الآتي من الله
  rationale: الإضافة اليونانية قد تشير إلى المصدر أو الملكية والارتباط؛ فحُفظ تركيب واسع الدلالة دون حسم العلاقة على وجه واحد.
- issue: معنى σωτήριον في السياق
  choice: الخلاص
  alternative: رسالة الخلاص
  rationale: اللفظة نفسها تدل على الخلاص، أما تقييدها بالرسالة فشرح محتمل لا يفرضه النص.
- issue: قوة ἀκούσονται
  choice: سيصغون
  alternative: سيسمعون
  rationale: السياق يرجح السماع المتقبّل، لكن الترجمة لا تضيف تصريحًا بالإيمان أو الاهتداء، وتُحفظ الدلالة الأعم في الحاشية.
translation_notes:
  register: عربية فصحى حديثة ذات نبرة إعلانية رصينة. استُعمل «غير اليهود» لوضوح المقابلة السياقية، ووُضعت العلامتان [a] و[b] في المتن عند موضعي البدائل.
