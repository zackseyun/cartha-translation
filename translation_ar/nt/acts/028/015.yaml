  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: ar
  text: ومن هناك، لما سمع الإخوة[a] بأخبارنا، جاءوا للقائنا حتى سوق أبيوس والحانات الثلاث. فلما رآهم بولس شكر الله وتشجّع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الإخوة والأخوات». اللفظ اليوناني هو «الإخوة»، وهو تعبير شائع عن رفقاء الإيمان وقد يشمل النساء بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: ومن هناك
  rationale: يحفظ الواو الرابطة والانتقال المكاني في سياق الرحلة بصياغة عربية طبيعية.
- source_word: οἱ ἀδελφοὶ
  choice: الإخوة[a]
  rationale: يحافظ على صيغة الجمع المذكر في اليونانية، مع بيان احتمال شمولها المؤمنات في الحاشية.
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: لما سمعوا بأخبارنا
  rationale: يؤدي اسم الموصول المحايد الجمع مع περὶ بوصفه الأخبار أو الأنباء المتعلقة بجماعة بولس، ويجعل اسم الفاعل ذا الدلالة الزمنية جملة عربية سلسة.
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: جاءوا للقائنا
  rationale: ينقل التعبير الاصطلاحي الدال على التوجه للقاء القادمين، من غير إضافة تفصيل غير مصرح به.
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: حتى سوق أبيوس والحانات الثلاث
  rationale: تحفظ «حتى» دلالة مدى المسافة؛ ويُنقل اسما الموضعين بصيغتين عربيتين واضحتين تعكسان معنى الاسمين اليونانيين.
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: فلما رآهم بولس
  rationale: يُفكّ التركيب الموصولي مع اسم الفاعل إلى جملة زمنية طبيعية، مع إبقاء مرجع الضمير واضحًا.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: شكر الله
  rationale: صياغة عربية موجزة وأمينة لمعنى تقديم الشكر لله، وتنسجم مع تتابع الأفعال.
- source_word: ἔλαβε θάρσος
  choice: تشجّع
  rationale: ينقل المعنى الاصطلاحي، أي اكتسب الشجاعة أو قوي قلبه، بلغة عربية طبيعية من غير تحويله إلى الجرأة في القول.
theological_decisions:
- issue: دلالة ἀδελφοί على جماعة المؤمنين التي قد تكون مختلطة
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: تُحفظ الصيغة اليونانية في المتن، بينما توضّح الحاشية أن الاستعمال الجماعي قد يشمل النساء، من غير الجزم بتركيب الجماعة في هذا الموضع.
- issue: طبيعة ما بلغه الإخوة عن جماعة بولس
  choice: سمعوا بأخبارنا
  alternative: سمعوا عنا
  rationale: τὰ περὶ ἡμῶν يحتمل ما يتعلق بهم أو أخبارهم؛ اختيرت صياغة عربية طبيعية تشير إلى الأنباء من غير تحديد مضمونها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة، مع جمل سردية طبيعية. استُخدم «سوق أبيوس» و«الحانات الثلاث» بوصفهما اسمي موضعين تاريخيين، وحُفظت علامة الحاشية في المتن.
