  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: ar
  text: ولما جمع بولس حزمةً من الحطب ووضعها على النار، خرجت أفعى بسبب الحرارة[a] وتعلَّقت بيده[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «من الحرارة». يمكن ترجمة حرف الجر اليوناني حرفيًا هكذا، لكنه يُفيد هنا على الأرجح السبب: خرجت الأفعى بسبب حرارة النار.'
    reason: lexical_alternative
  - marker: b
    text: أو «أمسكت بيده»، وربما «عضَّت يده». يدل الفعل اليوناني بوجه أعم على التعلّق أو الإمساك.
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: جمع
  rationale: اسم الفاعل الأوريستي في تركيب المضاف إليه المطلق يصف فعلًا سابقًا لبولس. وفي سياق الوقود يدل على الجمع والضم، لا على الفتل الحرفي.
- source_word: φρυγάνων τι πλῆθος
  choice: حزمةً من الحطب
  rationale: تشير φρύγανα إلى عيدان يابسة أو حطب صغير للوقود، وτι πλῆθος إلى مقدار غير محدد. تنقل «حزمة من الحطب» صورة الكمية المجموعة بعبارة عربية طبيعية.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: ووضعها على النار
  rationale: ينقل العبارة بوضوح، مع فهم ضمير الجمع اليوناني الدلالي في العربية على أنه عائد إلى الحزمة ومحتواها؛ فاستُعمل ضمير المفرد المؤنث الموافق لـ«حزمة».
- source_word: ἔχιδνα
  choice: أفعى
  rationale: اللفظة اليونانية تدل على أفعى سامة لا على حية عامة، و«أفعى» تحافظ على هذا التحديد في العربية الفصحى الواضحة.
- source_word: ἀπὸ τῆς θέρμης
  choice: بسبب الحرارة
  rationale: يمكن أن تعني ἀπό حرفيًا «من»، لكنها هنا تُفهم طبيعيًا على إفادة السبب أو المنشأ؛ فالصياغة المختارة توضح أن حرارة النار أدت إلى خروج الأفعى مع إبقاء البديل الحرفي في الحاشية.
- source_word: ἐξελθοῦσα
  choice: فخرجت
  rationale: اسم الفاعل الأوريستي يعود إلى الأفعى، وحُوِّل إلى فعل تام متتابع ليناسب السرد العربي الطبيعي.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: وتعلَّقت بيده
  rationale: الفعل καθάπτω يدل عمومًا على التعلق أو الإمساك، ولا يصرح وحده بالعض؛ لذا تحافظ الصياغة على الصورة من غير تضييق المعنى.
