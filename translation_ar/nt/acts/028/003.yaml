  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ تسلسل الأفعال السردي، وتُرك مدى دلالة الفعل الأخير مفتوحًا بدل الجزم بأن الأفعى عضّت بولس. وُضعت علامتا الحاشيتين عقب العبارتين اللتين تشرحانهما.
