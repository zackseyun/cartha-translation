base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: ar
  text: لكننا نرى أنه من المناسب أن نسمع منك ما هي آراؤك، لأن المعروف لدينا عن هذه الطائفة[a] أنها يُعتَرَض عليها في كل مكان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الفئة» أو «الحركة». لا تعني الكلمة اليونانية هنا بالضرورة «البدعة» أو «الهرطقة» بمعناهما الاصطلاحي المتأخر.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: نرى أنه من المناسب
  rationale: ينقل معنى الحكم بملاءمة سماع رأي بولس، ويحافظ على نبرة المتكلمين المهذبة والرسمية، من غير أن يحوّل العبارة إلى مطالبة أو مجرد رغبة.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: أن نسمع منك
  rationale: صياغة عربية طبيعية تحافظ على دلالة تلقي الكلام من بولس نفسه بوصفه المصدر المباشر.
- source_word: ἃ φρονεῖς
  choice: ما تفكّر فيه
  rationale: يعبر عن فكر بولس ووجهة نظره من غير تخصيص زائد لمضمونها.
- source_word: αἱρέσεως
  choice: الطائفة
  rationale: يدل هنا على جماعة أو تيار ديني معروف، ولا يستورد المعنى الاصطلاحي المتأخر لكلمة «هرطقة».
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: المعروف لدينا
  rationale: يحافظ على البناء غير الشخصي وعلى النبرة الرسمية، مع سلاسة العبارة في العربية المعاصرة.
- source_word: πανταχοῦ
  choice: في كل مكان
  rationale: ينقل بوضوح المدى المكاني العام الذي تفيده الكلمة اليونانية.
- source_word: ἀντιλέγεται
  choice: تُواجَه بالاعتراض
  rationale: يحافظ على المبني للمجهول وعلى فكرة أن الناس يتكلمون ضد هذه الجماعة، بصياغة عربية أوضح من النقل الحرفي المتكلف.
theological_decisions:
- issue: دلالة αἵρεσις
  choice: الطائفة
  alternative: البدعة أو الهرطقة
  rationale: السياق يتحدث عن الحركة المسيحية كما يراها الآخرون بوصفها جماعة دينية، لا عن حكم كنسي تقني بأنها انحراف عقائدي؛ لذلك تُتجنب الدلالة الاصطلاحية المتأخرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على الطابع المهذب والرسمي لكلام وجهاء اليهود، وعلى المبني للمجهول في ختام الآية، مع تجنب ألفاظ عقائدية لاحقة لا يقتضيها السياق.
