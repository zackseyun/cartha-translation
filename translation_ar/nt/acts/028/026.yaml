  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: ar
  text: 'قائلًا: «اذهب إلى هذا الشعب وقل: ستسمعون حقًّا[a]، ولكنكم لن تفهموا أبدًا؛ وأنتم تنظرون، ستنظرون حقًّا[b]، ولكنكم لن تدركوا أبدًا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «سماعًا ستسمعون»، وهو تعبير توكيدي على الأسلوب العبري أبقاه النص اليوناني في اقتباس إشعياء.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «وأنتم تنظرون ستنظرون، ولكنكم لن تروا أبدًا». يكرر اليوناني ألفاظ النظر والرؤية، غير أن الفعل الأخير قد يدل في هذا السياق على الإدراك الباطني.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: قائلًا
  rationale: اسم فاعل حالي يقدّم الاقتباس ويربطه نحويًّا بما قبله، من غير تحويله إلى فعل ماضٍ مستقل.
- source_word: Πορεύθητι
  choice: اذهب
  rationale: أمر بالحركة، وأوضح مقابِل عربي طبيعي ومهيب له هو «اذهب».
- source_word: λαὸν τοῦτον
  choice: هذا الشعب
  rationale: يحفظ المعنى الجمعي والصيغة النبوية الموروثة من اقتباس إشعياء.
- source_word: εἰπόν
  choice: قل
  rationale: أمر مباشر يقدّم الكلام المنقول ويحافظ على بساطة الأصل.
- source_word: Ἀκοῇ ἀκούσετε
  choice: ستسمعون حقًّا
  rationale: تركيب توكيدي ذو صبغة سامية، يجمع في العربية بين وضوح العبارة وقوة التوكيد؛ أما التكرار الاشتقاقي الحرفي فمبيّن في الحاشية.
- source_word: οὐ μὴ συνῆτε
  choice: لن تفهموا أبدًا
  rationale: ينقل النفي اليوناني المشدد ويعبّر عن انعدام الفهم، لا مجرد عدم السماع.
- source_word: βλέποντες βλέψετε
  choice: ستنظرون حقًّا
  rationale: يحافظ على فعل النظر وعلى التوكيد الموازي لعبارة السماع، بصياغة عربية طبيعية.
- source_word: οὐ μὴ ἴδητε
  choice: لن تدركوا أبدًا
  rationale: ينقل في السياق معنى الإبصار المؤدي إلى الإدراك، مع إبقاء البديل الحرفي «لن تروا» في الحاشية.
theological_decisions:
- issue: التباين بين الإحساس الخارجي والفهم الباطني في اقتباس إشعياء
  choice: التفريق بين «تسمعون/تفهموا» و«تنظرون/تدركوا»
  alternative: ترجمة الفعل الأخير بـ«تروا» للمحافظة على ألفاظ الرؤية المتكررة
  rationale: السياق يقابل التعرض الحسي للكلام والمنظر بعدم استيعابهما. تحافظ «تدركوا» على هذا التوتر من غير أن تنسب سببه صراحةً إلى حكم إلهي أو عجز بشري، بينما تذكر الحاشية الترجمة الأقرب إلى اللفظ.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «حقًّا» لنقل التوكيد الاشتقاقي بصورة طبيعية، و«أبدًا» لإظهار قوة النفي، مع حفظ الصياغة الحرفية والتكرار اليوناني في الحواشي.
