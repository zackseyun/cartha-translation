  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: ar
  text: وهناك وجدنا إخوةً[a]، فطُلب منا أن نمكث عندهم سبعة أيام. وهكذا أتينا إلى روما.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إخوة وأخوات»؛ ترد في اليونانية كلمة «إخوة»، لكن اللفظ في هذا السياق يشير على الأرجح إلى المؤمنين عمومًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: وهناك
  rationale: ظرف مكان يعود إلى بوتيولي المذكورة قبلًا، و«هناك» صياغة عربية طبيعية في افتتاح الجملة.
- source_word: εὑρόντες
  choice: وجدنا
  rationale: حُوِّل اسم الفاعل اليوناني الدال على فعل سابق إلى فعل ماضٍ عربي يحفظ تعاقب الأحداث بوضوح.
- source_word: ἀδελφοὺς
  choice: إخوةً
  rationale: يحافظ على اللفظ اليوناني المذكر، بينما يوضح الهامش أن المقصود في السياق على الأرجح جماعة المؤمنين عمومًا.
- source_word: παρεκλήθημεν
  choice: فطُلب إلينا
  rationale: يحفظ البناء للمجهول ومعنى الالتماس أو الطلب، من غير أن يضيّق الدلالة إلى دعوة ضيافة صريحة.
- source_word: παρ’ αὐτοῖς
  choice: عندهم
  rationale: يفيد الإقامة في موضعهم أو بصحبتهم، وهو تعبير عربي مألوف في سياق الضيافة.
- source_word: ἐπιμεῖναι
  choice: أن نمكث
  rationale: ينقل معنى البقاء المؤقت في سياق الرحلة بلغة عربية واضحة وكريمة.
- source_word: ἡμέρας ἑπτά
  choice: سبعة أيام
  rationale: ينقل مفعول امتداد الزمن مباشرة، وتدل صيغة «نمكث» على المدة من غير حاجة إلى إضافة «لمدة».
- source_word: καὶ οὕτως
  choice: وهكذا
  rationale: يحفظ معنى الانتقال أو الكيفية المقصودة في السرد، ولا يحسمه بوصفه نتيجة سببية محضة.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: أتينا إلى روما
  rationale: ترجمة مباشرة تحفظ منظور الراوي بصيغة المتكلم ودلالة بلوغ الوجهة.
theological_decisions:
- issue: مرجع ἀδελφοὺς
  choice: الإخوة، أي على الأرجح المؤمنون المحليون
  alternative: الإخوة بالنسب، أو اليهود عمومًا
  rationale: استعمال اللفظ في سياق الرحلة والضيافة في سفر الأعمال يرجح أنه يشير إلى أعضاء الجماعة المسيحية، مع إبقاء اللفظ نفسه في المتن وعدم تجاوز ما يصرح به النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية كريمة. استُعمل «فطُلب إلينا» للمحافظة على المبني للمجهول وعلى سعة معنى παρακαλέω، و«وهكذا» لصون قدر من مرونة καὶ οὕτως.
