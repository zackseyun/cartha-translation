  text: وكان بعضهم يقتنعون بما يُقال، بينما كان آخرون لا يؤمنون.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείθοντο
  choice: يقتنعون
  rationale: ينقل معنى الاقتناع بالحجج، وصيغة المضارع مع «كان» تعكس الاستمرار الذي تدل عليه صيغة الماضي الناقص اليونانية، من غير مساواة صريحة بين الاقتناع والإيمان الخلاصي.
- source_word: τοῖς λεγομένοις
  choice: بما يُقال
  rationale: تعبير عربي طبيعي يحفظ دلالة اسم المفعول المضارع على مضمون الكلام الجاري.
- source_word: ἠπίστουν
  choice: لم يؤمنوا
  rationale: يعكس معنى عدم الإيمان مباشرة من غير إضافة دلالة إرادية أقوى مثل «رفضوا أن يؤمنوا».
- source_word: οἱ μὲν ... οἱ δὲ
  choice: بعضهم ... أما الآخرون
  rationale: يحفظ انقسام الجماعة والتقابل الواضح بين استجابتين.
- source_word: καὶ
  choice: و
  rationale: يربط الآية بسياق السرد السابق ربطًا مباشرًا من غير تحميل الأداة علاقة منطقية زائدة.
theological_decisions:
- issue: طبيعة التباين في الاستجابة
  choice: تميّز الآية بين من كانوا يقتنعون بالرسالة ومن لم يؤمنوا بها، من غير تحديد أوسع لحالتهم الروحية النهائية.
  alternative: اعتبار المقتنعين مؤمنين حقيقيين والآخرين رافضين متصلبين بالمعنى اللاهوتي الكامل.
  rationale: النص اليوناني يصف الاستجابة المباشرة لما قيل، ولا يفصّل في هذه الآية وحدها الوضع الروحي النهائي لكل فريق.
translation_notes:
  register: العربية فصحى معاصرة واضحة وكريمة. استُخدم «كان بعضهم يقتنعون» لإبراز الفعل المستمر أو المتكرر، و«لم يؤمنوا» لتجنب إدخال معنى الرفض الإرادي غير الصريح في اللفظ اليوناني.
