base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: ar
  text: وكانت في النواحي المحيطة بذلك المكان أراضٍ للرجل الأوّل في الجزيرة[a]، واسمه بوبليوس، فرحّب بنا واستضافنا بكرم لمدة ثلاثة أيام.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: أبرز رجال الجزيرة أو صاحب أعلى منزلة فيها؛ وقد تكون العبارة لقبًا معروفًا في الجزيرة.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «استقبلنا وأضافنا بلطف لمدة ثلاثة أيام».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: وكانت في النواحي المحيطة بذلك المكان
  rationale: تنقل العبارة معنى الجوار المحيط بالمكان، وتؤدي الواو وظيفة δέ الانتقالية الخفيفة في السياق السردي.
- source_word: ὑπῆρχεν χωρία
  choice: كانت ... أراضٍ
  rationale: «أراضٍ» تحافظ على الجمع وتدل على ملكية عقارية من غير الجزم بأنها حقول أو ضياع محددة النوع.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: لرجل الجزيرة الأول
  rationale: تحافظ الصياغة على لقب πρῶτος القريب من «الأول»، بما يتيح فهمه بوصفه أبرز رجال الجزيرة أو صاحب أعلى منزلة فيها من غير فرض منصب إداري تقني غير مصرّح به.
- source_word: ὀνόματι Ποπλίῳ
  choice: واسمه بوبليوس
  rationale: صياغة عربية طبيعية للتعريف بالاسم، مع نقل Πόπλιος إلى «بوبليوس».
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: فرحّب بنا
  rationale: يناسب معنى قبول الضيوف واستقبالهم في سياق الضيافة.
- source_word: τρεῖς ἡμέρας
  choice: ثلاثة أيام
  rationale: منصوب يدل على امتداد الزمن، والعربية لا تحتاج إلى حرف جر هنا.
- source_word: φιλοφρόνως
  choice: بلطف
  rationale: ينقل المعاملة الودودة الكريمة بلفظ عربي واضح وطبيعي.
- source_word: ἐξένισεν
  choice: استضافنا
  rationale: يؤدي معنى إيواء الزائرين ومعاملتهم كضيوف بإيجاز ووضوح.
theological_decisions:
- issue: هل τῷ πρώτῳ τῆς νήσου لقب رسمي أم وصف للمكانة؟
  choice: رجل الجزيرة الأول
  alternative: كبير الجزيرة / أبرز رجال الجزيرة
  rationale: النص اليوناني يثبت له صفة «الأول» لكنه لا يحدد صراحة طبيعة المنصب؛ لذلك تُحفظ سعة الدلالة بدل تحويلها إلى وظيفة إدارية محددة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُخدمت «أراضٍ» بدل «ضياع» لسهولة الفهم، وحُفظ قدر من الغموض في لقب بوبليوس. وُضعت علامتا الحاشية في المتن عند الموضعين المعنيين.
