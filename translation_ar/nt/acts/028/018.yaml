lexical_decisions:
- source_word: οἵτινες
  choice: وهؤلاء
  rationale: اسم الموصول ذو القيمة الوصفية يعود إلى السلطات الرومانية المذكورة في السياق؛ و«هؤلاء» صياغة عربية طبيعية تحافظ على الإحالة دون إثقال.
- source_word: ἀνακρίναντές με
  choice: بعدما فحصوني
  rationale: ينقل سبق فعل اسم الفاعل الأوريستي على الفعل الرئيس، ويحفظ السياق القضائي؛ و«فحص» أوسع وأقل إيحاءً بالقسر من «استجوب».
- source_word: ἐβούλοντο
  choice: أرادوا
  rationale: ينقل معنى الإرادة أو القصد في الماضي بعبارة عربية واضحة، من غير تحميل صيغة الماضي الناقص دلالة إضافية غير لازمة.
- source_word: ἀπολῦσαι
  choice: أن يطلقوا سراحي
  rationale: تعبير عربي مألوف عن الإفراج من الاحتجاز في سياق قضائي.
- source_word: διὰ τὸ ... ὑπάρχειν
  choice: لأنه لم تكن
  rationale: ينقل البناء المصدري السببي بصياغة عربية طبيعية وصريحة.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: أي تهمة تستوجب الموت
  rationale: يحفظ المجال القضائي لكلمة αἰτία، ويعبّر عن ارتباطها بالموت بوصفه عقوبة تستوجبها التهمة، من غير حصر المعنى في مصطلح قانوني حديث بعينه.
- source_word: ἐν ἐμοί
  choice: في قضيتي
  rationale: ينقل المعنى القضائي للسياق؛ فالعبارة الحرفية «فيَّ» غير طبيعية هنا وقد توحي بصفة باطنية بدل انعدام موجب الحكم في قضية بولس.
