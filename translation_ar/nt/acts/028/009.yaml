translation:
  language: ar
  text: وبعدما حدث هذا، كان سائر الذين في الجزيرة ممن لديهم أمراض يأتون ويُشفَون.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: وبعدما حدث هذا
  rationale: ينقل التركيب الإضافي المطلق دلالة التعاقب الزمني، مع إبقاء اسم الإشارة عامًا كما في اليونانية.
- source_word: οἱ λοιποί
  choice: سائر الذين
  rationale: تعبير عربي طبيعي يدل على بقية أهل الجزيرة بعد الحالة المذكورة سابقًا.
- source_word: οἱ ἐν τῇ νήσῳ
  choice: الذين في الجزيرة
  rationale: يحافظ على تحديد الجماعة بحسب موقعها من غير إضافة غير مصرّح بها.
- source_word: ἔχοντες ἀσθενείας
  choice: ممن بهم أمراض
  rationale: يحفظ المعنى الحرفي للمشاركة «الذين لديهم أمراض» وصيغة الجمع، في تعبير عربي فصيح وطبيعي.
- source_word: προσήρχοντο
  choice: أخذوا ... يأتون
  rationale: يبرز دلالة الماضي الناقص على التكرار أو الاستمرار، من دون إضافة «إليه» غير المذكورة صراحة.
- source_word: καὶ
  choice: أيضًا
  rationale: يبين اتصال مجيء بقية المرضى بحادثة الشفاء السابقة.
- source_word: ἐθεραπεύοντο
  choice: فيُشفَون
  rationale: يحافظ على المبني للمجهول، وتنسجم الصيغة مع تكرر مجيئهم وشفائهم.
