id: ACT.28.6
reference: Acts 28:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: ar
  text: أما هم فكانوا يتوقعون أن ينتفخ أو يسقط فجأة ميتًا. ولكن بعدما انتظروا وقتًا طويلًا ورأوا أنه لم يحدث له شيء غير عادي[a]، غيّروا رأيهم وأخذوا يقولون إنه إله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يصبه شيء خارج عن المألوف»، أو: «لم يحدث له مكروه».'
    reason: بدائل معجمية لعبارة μηδὲν ἄτοπον، التي قد تدل على الغريب أو غير المألوف أو ما ليس على ما يرام.
lexical_decisions:
- source_word: προσεδόκων
  choice: كانوا يتوقعون
  rationale: ينقل صيغة الماضي الناقص الدالة على استمرار توقّعهم.
- source_word: πίμπρασθαι
  choice: أن ينتفخ
  rationale: السياق هو لدغة أفعى، والمعنى المرجح انتفاخ الجسد لا الاحتراق الحرفي.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: يسقط فجأة ميتًا
  rationale: يحفظ معنى السقوط المفاجئ والموت كما في العبارة اليونانية.
- source_word: ἐπὶ πολὺ
  choice: بعدما انتظروا وقتًا طويلًا
  rationale: يصوغ التعبير الزمني مع اسم الفاعل في عبارة عربية طبيعية واضحة.
- source_word: θεωρούντων
  choice: رأوا
  rationale: يفيد المراقبة المتأنية التي أفضت إلى إدراك عدم حدوث أثر غير عادي.
- source_word: μηδὲν ἄτοπον
  choice: لم يحدث له شيء غير عادي
  rationale: يحفظ سعة معنى ἄτοπος بوصفه أمرًا غريبًا أو خارجًا عن المعتاد، من دون تخصيصه بالضرر.
- source_word: μεταβαλόμενοι
  choice: غيّروا رأيهم
  rationale: يوضح انقلاب حكمهم السابق إلى استنتاج مغاير.
- source_word: ἔλεγον
  choice: أخذوا يقولون
  rationale: ينقل بصورة عربية طبيعية الدلالة الاستمرارية أو الابتدائية للماضي الناقص.
- source_word: θεόν
  choice: إله
  rationale: النكرة العربية ملائمة للسياق الوثني المتعدد الآلهة، ولا توحي بأنهم عرّفوه بالله الواحد.
theological_decisions:
- issue: صياغة αὐτὸν εἶναι θεόν من غير إقحام اعتقاد مسيحي لاحق بشأن بولس
  choice: إنه إله
  alternative: إنه الله؛ إنه كائن إلهي
  rationale: يسرد النص استنتاج أهل الجزيرة الوثني الخاطئ. وورود θεόν بلا أداة تعريف وسياقهم المتعدد الآلهة يرجحان معنى «إله» نكرة، لا «الله» المعرّف.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «أما هم» لإبراز المقابلة، و«أخذوا يقولون» لنقل الاستمرار أو بدء القول. وُضعت علامة الحاشية [a] في المتن.
