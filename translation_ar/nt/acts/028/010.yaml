lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: أكرمونا إكرامًا عظيمًا
  rationale: يحافظ على تكرار جذر الإكرام في اليونانية بتركيب عربي فصيح وطبيعي نسبيًا، وينقل معنى مظاهر التقدير الكثيرة دون تسطيحه إلى مجرد حسن المعاملة.
- source_word: ἀναγομένοις
  choice: عندما كنا نُبحر
  rationale: الفعل مصطلح بحري يدل على بدء الرحلة بحرًا أو الإقلاع بالسفينة، والسياق يوضح أن المقصود وقت الاستعداد للإبحار.
- source_word: ἐπέθεντο
  choice: وضعوا على متن السفينة
  rationale: ينقل معنى وضع المؤن، ويُظهر بوضوح المحل المفهوم من السياق البحري من غير تغيير جوهر العبارة.
- source_word: τὰ πρὸς τὰς χρείας
  choice: ما كنا نحتاج إليه
  rationale: صياغة عربية طبيعية تؤدي معنى الأشياء اللازمة لسد الاحتياجات، وتتجنب تكرارًا عربيًا ثقيلًا من قبيل «الأشياء اللازمة لاحتياجاتنا».
