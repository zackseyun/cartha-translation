  terminology: '«جدال» مناسب لـ συζήτησις في هذا السياق ولا يفرض معنى خصومة عنيفة. وقد صُحّحت الحاشية تاريخيًا: البردية 74 لا تُؤرَّخ بالقرن الثالث، بل تُؤرَّخ عادة بالقرن السادس أو السابع. كما حُذف وصف «قادة اليهود» غير الموجود في النص.'
