  yaml_path: translation/nt/acts/028/029.yaml
  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
translation:
  language: ar
  text: ولمّا قال هذه الأمور[a]، انصرف اليهود، وهم يتجادلون فيما بينهم جدالًا شديدًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية بكاملها غير موجودة في أقدم المخطوطات اليونانية، ومنها المخطوطتان السينائية والفاتيكانية من القرن الرابع، وكذلك البردية 74 التي تُؤرَّخ عادةً بالقرن السادس أو السابع، كما تغيب عن ترجمات قبطية مبكرة. وهي موجودة في تقليد أغلبية المخطوطات البيزنطية، وكذلك في ترجمات لاتينية وسريانية مبكرة. ويُرجَّح أنها إضافة نسخية لاحقة أُدرجت لإتمام رواية انصراف اليهود.
    reason: textual_critical
lexical_decisions:
- source_word: συζήτησις
  choice: جدال
  rationale: تدل الكلمة على مناقشة أو مناظرة أو مجادلة؛ واختيار «جدال» ينقل حدة الخلاف في استجابتهم لكلام بولس، من غير أن يبالغ في تصويره خصومةً عدائية.
- source_word: ἀπέρχομαι
  choice: انصرف
  rationale: فعل حركة شائع بمعنى مضى أو غادر؛ و«انصرف» طبيعي في العربية الفصحى ويلائم ختام هذا المشهد السردي.
- source_word: πολλήν
  choice: شديدًا
  rationale: مع أن معناها الحرفي «كثيرًا/عظيمًا»، فإن تركيب «جدالًا شديدًا» هو التعبير العربي الطبيعي الذي يؤدي معنى شدة المناقشة واتساعها.
