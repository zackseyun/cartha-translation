  text: ⸀Ἐνέμεινεν ⸀δὲ διετίαν ὅλην ἐν ἰδίῳ μισθώματι, καὶ ἀπεδέχετο πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/030.yaml
  text: And he stayed for two whole years in his own rented lodging[a], and he welcomed all who came in to him[b],
translation:
  language: ar
  text: وأقام سنتين كاملتين في مسكن استأجره لنفسه[a]، وكان يرحّب بكل من يدخل إليه[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في بيت استأجره لنفسه». تشير الكلمة اليونانية إلى مكان إقامة مستأجر، ولا تحدد بالضرورة أنه بيت مستقل.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بكل من يأتي إليه». والمعنى الحرفي أقرب إلى «كل من يدخل إليه»، في إشارة على الأرجح إلى دخول الزائرين إلى مسكنه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: أقام
  rationale: يفيد الفعل هنا الاستمرار في الإقامة بمكان، و«أقام» تعبير عربي طبيعي وموجز يلائم الخلاصة السردية.
- source_word: δὲ
  choice: الواو في «وأقام»
  rationale: أداة ربط خفيفة تواصل السرد ولا تدل هنا على تضاد قوي.
- source_word: διετίαν ὅλην
  choice: سنتين كاملتين
  rationale: يحفظ هذا التعبير مدة السنتين والتوكيد الذي تؤديه ὅλην.
- source_word: ἐν ἰδίῳ μισθώματι
  choice: في مسكن استأجره لنفسه
  rationale: يدل μίσθωμα على مكان إقامة مستأجر، وتوضح الصياغة أن المسكن كان بترتيبه وعلى نفقته، من غير افتراض أنه بيت مستقل.
- source_word: ἀπεδέχετο
  choice: كان يرحّب
  rationale: صيغة الماضي الناقص تدل على فعل متكرر أو مستمر، و«يرحّب» تنقل معنى الاستقبال الإيجابي الذي يحمله الفعل.
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: بكل من يدخل إليه
  rationale: تحفظ الصياغة الدلالة المكانية للفعل، أي دخول الزائرين إلى موضع إقامته، مع بقاء العربية طبيعية.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية رصينة. استُخدم «كان يرحّب» لإظهار استمرارية الفعل، و«مسكن» لتجنب التحديد الزائد الذي قد توحي به كلمة «بيت».
