source:
  edition: SBLGNT
  text: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου πρὸς τοὺς πατέρας ⸀ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: ar
  text: 'ولمّا كانوا مختلفين بعضهم مع بعض، أخذوا ينصرفون بعدما قال بولس كلمة أخيرة[a]: «لقد أحسن الروح القدس القول على لسان إشعياء النبي لآبائكم[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «كلمة واحدة» أو «قولًا واحدًا». واليونانية تقول حرفيًا «كلمة واحدة»، والمقصود هنا قول ختامي.
    reason: lexical_alternative
  - marker: b
    text: أو «لأسلافكم». واليونانية تقول «لآبائكم»، والمقصود آباء إسرائيل الأولون.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους
  choice: ولمّا كانوا مختلفين بعضهم مع بعض
  rationale: ينقل التركيب الوصفي وحالة الاختلاف المتبادل بعبارة عربية طبيعية، من غير أن يحوّل الجملة إلى تعليل صريح لا يفرضه النص.
- source_word: ἀπελύοντο
  choice: أخذوا ينصرفون
  rationale: الماضي الناقص يصوّر بدء الانصراف أو جريانه، و«أخذوا ينصرفون» يؤدي هذه الدلالة بوضوح.
- source_word: εἰπόντος τοῦ Παύλου
  choice: بعدما قال بولس
  rationale: يُنقل المطلق المضاف اليوناني بجملة زمنية عربية واضحة، مع ترجمة εἰπόντος بالفعل «قال».
- source_word: ῥῆμα ἓν
  choice: كلمة أخيرة
  rationale: اللفظ حرفيًا «كلمة واحدة»، لكنه هنا يؤدي وظيفة القول الختامي؛ تحافظ الصياغة على صورة «الكلمة» وتوضح وظيفتها السياقية.
- source_word: Καλῶς
  choice: أحسن ... القول
  rationale: تعبير عربي فصيح وطبيعي يفيد أن ما قاله الروح القدس كان صوابًا وحسنًا، ويحافظ على القوة التقويمية للظرف.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: المقابل العربي المألوف والدقيق للعبارة المعرّفة.
- source_word: ἐλάλησεν
  choice: القول
  rationale: جاء ضمن التركيب الاصطلاحي «أحسن ... القول»، الذي ينقل فعل التكلم مع دلالة καλῶς من غير تكلّف.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: على لسان إشعياء النبي
  rationale: تعبير عربي طبيعي يدل على أن إشعياء وسيط الخطاب النبوي، وهو يؤدي معنى διά مع المضاف إليه.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: لآبائكم
  rationale: يحافظ على اللفظ الذكوري الصريح πατέρας وعلى ضمير المخاطبين بحسب قراءة SBLGNT، مع إمكان فهمه بمعنى أسلاف إسرائيل.
theological_decisions:
- issue: مرجع «آبائكم»
  choice: لآبائكم
  alternative: لأسلافكم
  rationale: النص اليوناني يستعمل πατέρας، أي «الآباء»، ولذلك أُبقي اللفظ العائلي المذكر مع توضيح معناه السياقي في الحاشية.
- issue: فاعلية الروح القدس في الكلام النبوي
  choice: لقد أحسن الروح القدس القول على لسان إشعياء النبي
  alternative: لقد تكلم الروح القدس بالصواب بواسطة إشعياء النبي
  rationale: تنسب الصياغة الكلام صراحة إلى الروح القدس، وتجعل إشعياء وسيطًا له كما في النص، من غير إضافة تفسير لطبيعة الوحي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أخذوا ينصرفون» لإظهار هيئة الماضي الناقص، و«على لسان» لتأدية الوساطة النبوية طبيعيًا. أبقيت النقطتان وعلامة فتح الاقتباس لأن الآية تنتهي قبل اكتمال كلام بولس الذي يستمر في الآية التالية.
