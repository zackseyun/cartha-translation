  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: ar
  text: كارزًا بملكوت الله، ومعلِّمًا ما يختصّ بالرب يسوع المسيح[a] بكل جرأة، بلا عائق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تعني الكلمة اليونانية Χριστός في أصلها «الممسوح»، وتُترجَم هنا «المسيح». وهي لقب، وقد تُستعمل في بعض السياقات جزءًا ملازمًا من الاسم.
    reason: يوضح معنى Χριστός ووظيفتها اللقبية أو القريبة من الاسم بصياغة عربية دقيقة وطبيعية، دون الإيحاء بتمييز غير ظاهر في الصياغة العربية المألوفة «يسوع المسيح».
lexical_decisions:
- source_word: κηρύσσων
  choice: كارزًا
  rationale: يحافظ على معنى الإعلان العلني، ويعكس صيغة اسم الفاعل التي تواصل وصف نشاط بولس في سياق الآية السابقة.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: بملكوت الله
  rationale: «ملكوت الله» تعبير عربي كتابي واضح ومألوف، ويتسع لمعنى سلطان الله وملكه دون حصره في أحد البعدين.
- source_word: διδάσκων
  choice: معلِّمًا
  rationale: يقابل اسم الفاعل اليوناني مباشرة، ويوازي «كارزًا» في وصف خدمة بولس المستمرة.
- source_word: τὰ περὶ
  choice: ما يختصّ بـ
  rationale: صياغة عربية طبيعية تحفظ معنى الأمور المتعلقة بشخص الرب يسوع المسيح من غير إطالة حرفية ثقيلة.
- source_word: κυρίου
  choice: الرب
  rationale: يحفظ الاستعمال المسيحاني المستقر للقب κύριος في العهد الجديد.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ينقل معنى Χριστός بوصفه لقبًا، وهو كذلك التعبير العربي الطبيعي المألوف؛ وتوضح الحاشية إمكان أن تعمل الكلمة اليونانية كتسمية شبيهة بالاسم.
- source_word: μετὰ πάσης παρρησίας
  choice: بكل جرأة
  rationale: ينقل معنى الكلام الجريء الصريح بلا خوف، ويحفظ قوة πάσης بوصفها أداة توكيد.
- source_word: ἀκωλύτως
  choice: دون عائق
  rationale: خاتمة موجزة وطبيعية تحفظ موضع الظرف الختامي وقوته في تأكيد أن خدمة البشارة لم تُمنع.
theological_decisions:
- issue: دلالة Χριστός في العبارة المسيحانية Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح، مع فهم «المسيح» لقبًا
  alternative: اعتبار «المسيح» تسمية ملازمة شبيهة بالاسم العلم
  rationale: يمكن أن تؤدي Χριστός وظيفة اللقب بمعنى «المسيح/الممسوح»، وقد تقترب في بعض السياقات من الاسم الملازم. الصياغة العربية «يسوع المسيح» طبيعية وتحفظ اللقب، والحاشية تبقي الاحتمال الوظيفي الآخر ظاهرًا من غير فرض حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت صيغتا اسم الفاعل لاتصالهما النحوي بالسياق السابق، وخُتمت الآية بعبارة «دون عائق» لمحاكاة الأثر البلاغي للكلمة اليونانية الأخيرة.
