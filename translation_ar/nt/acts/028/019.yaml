base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: ar
  text: لكن لأن اليهود اعترضوا، اضطررت إلى أن أستأنف إلى قيصر، لا لأن لديّ ما أتّهم به أمتي.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: لما اعترض
  rationale: ينقل معنى المعارضة أو الاعتراض في الملابسات القضائية، مع إبقاء العلاقة الظرفية/السببية في تركيب المضاف إليه المطلق محتملة بحسب السياق.
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا ذا مسحة استدراكية عما سبق.
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: ترجمة مباشرة للفظ اليوناني من غير تضييق غير منصوص عليه إلى القادة أو الخصوم؛ ويوضح السياق والحاشية أن المقصود المعترضون على بولس في هذه القضية.
- source_word: ἠναγκάσθην
  choice: اضطررت
  rationale: فعل عربي طبيعي يحفظ معنى الإلجاء والضرورة في المبني للمجهول اليوناني.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: أن أرفع دعواي إلى قيصر
  rationale: صياغة عربية قضائية واضحة تؤدي معنى اللجوء القانوني إلى قيصر بطريق الاستئناف، مع الاحتفاظ بلقب قيصر الوارد في النص.
- source_word: οὐχ ὡς
  choice: لا لأن
  rationale: توضح نفي الدافع مع الحفاظ على المعنى المقصود في السياق.
- source_word: τοῦ ἔθνους μου
  choice: أمتي
  rationale: تحفظ الدلالة القومية والجماعية للفظ ἔθνος، وهي أفصح هنا من تركيب «شعبي الإثني».
- source_word: ἔχων τι κατηγορεῖν
  choice: لديّ شيئًا أتهم به
  rationale: تعبير عربي واضح يحفظ المعنى القضائي لوجود تهمة أو أساس للاتهام.
theological_decisions:
- issue: مرجع عبارة «اليهود» في تعبير ديني/إثني حساس
  choice: إبقاء «اليهود» في المتن بوصفها المقابل المباشر للفظ اليوناني
  alternative: القادة اليهود؛ أهل اليهودية
  rationale: لا يخصص الأصل المرجع بهذه الألفاظ، لذلك لا ينبغي إدخال تخصيص في المتن. غير أن السياق القانوني يدل على معارضي بولس اليهود في القضية، لا على جميع اليهود، فتُذكر هذه القرينة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة قضائية رصينة. وُضعت علامتا الحاشيتين بعد العبارة التي تشرحانها، وحُفظ لقب «قيصر» كما في الأصل.
