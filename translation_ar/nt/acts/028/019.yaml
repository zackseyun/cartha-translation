revisions:
- from: لكن لما اعترض اليهود[a][b]، اضطررت إلى أن أرفع دعواي إلى قيصر، لا لأن لديّ شيئًا أتهم به أمتي.
  to: لكن لأن اليهود اعترضوا، اضطررت إلى أن أستأنف إلى قيصر، لا لأن لديّ ما أتّهم به أمتي.
  rationale: يُستبدل التعبير الذي يوحي بإقامة دعوى بتعبير «أستأنف إلى قيصر»، لأنه ينقل المصطلح القانوني اليوناني بدقة. كما تُهذَّب الحاشية البديلة لتكون عربية حديثة طبيعية وتحفظ احتمال الظرفية أو السببية في تركيب المضاف إليه المطلق. وتبقى «اليهود» في المتن مع الحاشية السياقية، و«أمتي» محافظة على الدلالة الجماعية لـἔθνος.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:23:26Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما في ذلك المعارضة اليهودية، والإلجاء إلى اتخاذ إجراء قانوني، ونفي أن يكون لدى بولس اتهام ضد أمته. لكن «أرفع دعواي إلى قيصر» توحي برفع دعوى جديدة إلى قيصر، بينما ἐπικαλέσασθαι Καίσαρα مصطلح قانوني يعني الاستئناف/الاحتكام إلى قيصر.
  naturalness: العبارة عربية فصيحة ومفهومة، لكن «أن أستأنف إلى قيصر» أدق في السياق القضائي وأشد سلاسة من «أن أرفع دعواي إلى قيصر». وصياغة «لم يكن ذلك لأن لديّ ما أتّهم به أمتي» أوضح في ربط النفي بالدافع المنفي.
  terminology: «اليهود» ترجمة مباشرة مناسبة لـ Ἰουδαίων، والحاشية السياقية مفيدة ولا تُقحم تخصيصًا في المتن. «قيصر» و«أمتي» مناسبان. ينبغي استعمال «استأنف» للمصطلح القانوني ἐπικαλέσασθαι.
  issues:
  - severity: medium
    issue: «أن أرفع دعواي إلى قيصر» لا يؤدي بدقة معنى الاستئناف إلى قيصر.
    rationale: الفعل اليوناني ἐπικαλέσασθαι في هذا السياق هو استعمال قانوني للاحتكام أو الاستئناف إلى قيصر، لا لرفع دعوى أو إقامة قضية جديدة. وقد تغيّر «دعواي» طبيعة الإجراء القانوني.
  - severity: low
    issue: الحاشية البديلة «لأن اليهود ناقضوني» غير طبيعية في العربية الحديثة في هذا المقام.
    rationale: «ناقضوني» قد تُفهم بمعنى إظهار التناقض في كلام بولس، ولا تنقل بوضوح معارضة الخصوم في إجراء قضائي. «كانوا يعارضونني» أو «اعترضوا» أوضح.
  revised_text: لكن لأن اليهود اعترضوا، اضطررت إلى أن أستأنف إلى قيصر، لا لأن لديّ ما أتّهم به أمتي.
