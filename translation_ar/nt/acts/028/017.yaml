source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: ar
  text: 'وبعد ثلاثة أيام، دعا بولس وجهاء اليهود[a] إلى الاجتماع. فلما اجتمعوا، قال لهم: «أما أنا، أيها الإخوة[b]، فلم أفعل شيئًا ضد الشعب ولا ضد عادات آبائنا[c]، ومع ذلك سُلِّمت سجينًا من أورشليم إلى أيدي الرومان[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قادة اليهود» أو «المتقدمين بين اليهود».
    reason: بدائل معجمية لعبارة تدل على أصحاب المكانة والصدارة.
  - marker: b
    text: النداء «أيها الإخوة» موجَّه هنا إلى وجهاء اليهود من الرجال الذين دعاهم بولس إلى الاجتماع.
    reason: إيضاح سياقي وثقافي لصيغة النداء اليونانية.
  - marker: c
    text: أو «العادات الموروثة عن الآباء».
    reason: بديل يصرّح بالدلالة الإرثية للصفة اليونانية.
  - marker: d
    text: 'أو «سُلِّمت ... إلى الرومان». واليونانية حرفيًا: «إلى أيدي الرومان».'
    reason: بيان البديل الاصطلاحي والصورة الحرفية في الأصل.
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: وبعد ثلاثة أيام
  rationale: تؤدي العبارة وظيفة انتقال سردي وتحديد زمني؛ وهذه الصياغة العربية الطبيعية تحفظ معنى الزمن والربط من غير إضافة ظرف بمعنى «الآن» غير موجود في اليونانية.
- source_word: συγκαλέσασθαι αὐτὸν
  choice: دعا بولس ... إلى الاجتماع
  rationale: يفيد الفعل دعوة جماعة كي تجتمع. أُظهر اسم بولس بدل الضمير لتكون الإحالة واضحة في الآية العربية المستقلة.
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: وجهاء اليهود
  rationale: تدل πρώτους هنا على أصحاب المكانة والصدارة بين اليهود، لا على الأوائل زمنيًا.
- source_word: συνελθόντων δὲ αὐτῶν
  choice: فلما اجتمعوا
  rationale: تحويل تركيب المضاف إليه المطلق إلى جملة زمنية عربية طبيعية مع الحفاظ على تعاقب الأحداث.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: أيها الإخوة
  rationale: صيغة نداء عربية طبيعية تحفظ خطاب التضامن الموجَّه إلى الرجال اليهود المجتمعين؛ لا يلزم إظهار ἐγώ منفصلًا لأن ضمير المتكلم ظاهر في «أني».
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: مع أني لم أفعل شيئًا ضد
  rationale: 'تُظهر «مع أن» القوة التنازلية للسياق: سُلِّم بولس رغم نفيه فعل ما يخالف الشعب أو عاداته.'
- source_word: τῷ λαῷ
  choice: الشعب
  rationale: يحافظ على غياب ضمير الملكية في الأصل، والسياق يحدد أنه شعب اليهود.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: عادات آبائنا
  rationale: تنقل معنى العادات الموروثة عن الآباء، وتحفظ تضامن بولس مع مخاطبيه بضمير الجمع.
- source_word: δέσμιος
  choice: سجينًا
  rationale: تصف حال بولس القانونية والاحتجازية عند تسليمه، دون تحويلها بالضرورة إلى صورة القيود الحرفية.
- source_word: ἐξ Ἱεροσολύμων
  choice: من أورشليم
  rationale: تعبير مباشر عن موضع الانطلاق أو المصدر.
- source_word: παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: سُلِّمت ... إلى أيدي الرومان
  rationale: يحفظ المبني للمجهول والصورة اليونانية «إلى أيدي»، مع دلالة التسليم إلى الح custody الرومانية.
theological_decisions:
- issue: دلالة ἀδελφοί في النداء
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: المخاطبون هنا هم وجهاء اليهود من الرجال الذين دعاهم بولس؛ فتحفظ الصياغة جنس المخاطَبين والتضامن القومي والديني دون توسيع غير مسند بالسياق.
- issue: قوة الحال οὐδὲν ἐναντίον ποιήσας
  choice: 'صياغة تنازلية: «مع أني لم أفعل شيئًا ضد»'
  alternative: 'صياغة حالية: «إذ لم أفعل شيئًا ضد»'
  rationale: يبرز السياق المفارقة بين إعلان بولس براءته وتسليمه إلى السلطة الرومانية، مع إبقاء ادعائه كما هو من غير تقرير لاهوتي زائد.
- issue: هوية الفاعل في المبني للمجهول παρεδόθην
  choice: 'الإبقاء على المبني للمجهول: «سُلِّمت»'
  alternative: تعيين فاعل مثل «سلّمني اليهود»
  rationale: الأصل لا يصرّح بالفاعل في هذه الجملة، لذلك لا تعيّنه الترجمة ولا تحسم المسؤولية التي يتركها النص نحويًا غير مصرّح بها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «وجهاء» للدلالة على المكانة الاجتماعية، و«سجينًا» للحالة الاحتجازية. حُفظت صورة «إلى أيدي الرومان» في المتن مع شرح البديل في الحاشية، وأُبقي المبني للمجهول دون افتراض فاعل لم يذكره النص.
