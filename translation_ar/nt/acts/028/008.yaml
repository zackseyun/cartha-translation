  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: ar
  text: وَحَدَثَ أَنَّ أَبَا بُوبْلِيُوسَ كَانَ مُضْطَجِعًا، يُعَانِي مِنْ حُمَّيَاتٍ وَزُحَارٍ. فَدَخَلَ إِلَيْهِ بُولُسُ، وَبَعْدَ أَنْ صَلَّى وَوَضَعَ يَدَيْهِ عَلَيْهِ، شَفَاهُ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: وَحَدَثَ أَنَّ
  rationale: ينقل الانتقال السردي وإدخال الحدث بصورة عربية طبيعية، من غير إضافة ظرف زمان لا يقابله لفظ صريح في اليونانية.
- source_word: τὸν πατέρα τοῦ Ποπλίου
  choice: أَبَا بُوبْلِيُوسَ
  rationale: صياغة عربية فصيحة ومباشرة تحفظ علاقة الإضافة.
- source_word: πυρετοῖς
  choice: حُمَّيَاتٌ
  rationale: يحفظ صيغة الجمع اليونانية، التي قد تدل على نوبات حمى متكررة.
- source_word: δυσεντερίῳ
  choice: زِحَارٌ
  rationale: المصطلح العربي الطبي الدقيق والمفهوم لمرض الدوسنتاريا.
- source_word: συνεχόμενον
  choice: تُلَازِمُهُ
  rationale: يعبر عن استمرار استيلاء المرض عليه من غير مبالغة أو تفسير زائد.
- source_word: κατακεῖσθαι
  choice: كَانَ طَرِيحَ الْفِرَاشِ
  rationale: ينقل كونه مضطجعًا بسبب المرض بصياغة عربية طبيعية، وإن كان أصرح قليلًا من مجرد «مضطجعًا».
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθὼν
  choice: فَدَخَلَ إِلَيْهِ بُولُسُ
  rationale: يحفظ حركة الدخول إلى الموضع الذي كان فيه المريض بترتيب عربي سلس.
- source_word: προσευξάμενος
  choice: بَعْدَ أَنْ صَلَّى
  rationale: يبين أن الصلاة سبقت فعل الشفاء، وهو ما تسمح به دلالة اسم الفاعل الماضي اليوناني.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: وَوَضَعَ يَدَيْهِ عَلَيْهِ
  rationale: يحفظ جمع «اليدين» والإيماءة كما وردت، من غير تحميلها معنى طقسيًا زائدًا.
- source_word: ἰάσατο αὐτόν
  choice: شَفَاهُ
  rationale: المقابل العربي المباشر للفعل الدال على الشفاء، بلا تحديد لطبيعته أو سرعته.
theological_decisions:
- issue: طبيعة فعل الشفاء الذي أجراه بولس
  choice: عرض تسلسل الصلاة ووضع اليدين والشفاء كما يورده النص، من غير وصف إضافي.
  alternative: التصريح بأنه شفاء معجزي أو تفسير الفعل تفسيرًا طبيًا أو أسراريًا.
  rationale: الآية تثبت وقوع الشفاء بعد صلاة بولس ووضع يديه، لكنها لا تحدد هنا آليته ولا تضيف إليه وصفًا لاهوتيًا تقنيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «زِحار» بدل اللفظ المعرّب الأطول «دوسنتاريا»، وحُفظ جمع «حُمَّيات». لا توجد علامة حاشية لأن الصياغة العربية أدرجت معنى συνεχόμενον في المتن ولم تحتج إلى بديل توضيحي.
