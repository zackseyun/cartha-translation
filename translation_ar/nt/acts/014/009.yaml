  text: οὗτος ⸀ἤκουσεν τοῦ Παύλου λαλοῦντος· ὃς ἀτενίσας αὐτῷ καὶ ἰδὼν ὅτι ⸂ἔχει πίστιν⸃ τοῦ σωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: ar
  text: استمع هذا الرجل إلى بولس وهو يتكلم، فتفرّس فيه بولس ورأى أن لديه إيمانًا ليُشفى[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليخلُص». قد يعني الفعل اليوناني «يخلّص» أو «يشفي»، والسياق هنا يرجّح الشفاء الجسدي.'
    reason: بيان البديل المعجمي والمحافظة على الاتساع الدلالي للفعل اليوناني.
lexical_decisions:
- source_word: οὗτος
  choice: هذا الرجل
  rationale: اسم الإشارة يعود إلى الرجل العاجز المذكور في السياق السابق، والتصريح بـ«الرجل» يوضح المرجع طبيعيًا في العربية.
- source_word: ἤκουσεν
  choice: كان يستمع
  rationale: يفيد هنا تلقي كلام بولس بانتباه، و«يستمع» أنسب سياقيًا من مجرد «يسمع».
- source_word: λαλοῦντος
  choice: وهو يتكلم
  rationale: ينقل اسم الفاعل اليوناني بعبارة عربية طبيعية تصف بولس في أثناء كلامه.
- source_word: ἀτενίσας
  choice: فتفرّس فيه
  rationale: ينقل معنى النظر المركز المتأمل، من غير إيحاء سلبي قد تحمله ألفاظ مثل «حدّق».
- source_word: ἰδὼν
  choice: ورأى
  rationale: يحافظ على فعل الإدراك الحسي في الأصل، مع إمكان فهمه سياقيًا بمعنى التبيّن.
- source_word: ἔχει πίστιν
  choice: لديه إيمان
  rationale: يحافظ على لفظ «الإيمان» بوصفه استجابة تصديقية، لا صفة الأمانة.
- source_word: τοῦ σωθῆναι
  choice: لينال الشفاء
  rationale: الفعل اليوناني قد يعني الخلاص أو النجاة أو الشفاء، والسياق المباشر لمعجزة إقامة الرجل العاجز يرجّح الشفاء الجسدي؛ وصيغة «لينال» عربية طبيعية وتحافظ على توجه الإيمان نحو النتيجة.
theological_decisions:
- issue: دلالة σωθῆναι في سياق معجزة شفاء
  choice: لينال الشفاء
  alternative: ليخلص
  rationale: السياق التالي يصف استعادة الرجل قدرته الجسدية، لذلك جُعل معنى الشفاء في المتن، مع إبقاء الدلالة الأوسع للخلاص في الحاشية حتى لا يُطمس الاتساع الدلالي للفعل اليوناني.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة وموقرة. كُرر اسم بولس في الجملة الثانية لإزالة التباس عائد الاسم الموصول في العربية، ووُضع مؤشر الحاشية عند العبارة التي تتناولها الحاشية مباشرة.
