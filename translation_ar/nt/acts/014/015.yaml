reference: Acts 14:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: ar
  text: 'وهما يقولان: «أيها الرجال، لماذا تفعلون هذه الأمور؟ فنحن أيضًا بشر مثلكم، نشارككم الطبيعة البشرية نفسها[a]. ونحن نُبشّركم لكي ترجعوا عن هذه الأباطيل[b] إلى الله الحي، الذي صنع السماء[c] والأرض والبحر وكل ما فيها».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فنحن أيضًا بشر من طبيعة مثل طبيعتكم»؛ والمقصود اشتراك بولس وبرنابا مع سامعيهما في الحالة البشرية نفسها.'
    reason: lexical_alternative
  - marker: b
    text: تشير «هذه الأباطيل» في السياق إلى العبادة الوثنية العقيمة، بما فيها الأصنام.
    reason: cultural_note
  - marker: c
    text: 'يمكن أيضًا: «السماوات»؛ لكن اليونانية تستعمل المفرد «السماء» ضمن صيغة مألوفة للحديث عن الخلق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: أيها الرجال
  rationale: نداء مباشر لجمع المذكر، يحافظ على صيغة المصدر وعلى قوة الخطاب.
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: بشر مثلكم، نشارككم الطبيعة البشرية نفسها
  rationale: يوضح أن بولس وبرنابا يشتركان مع سامعيهما في الحالة البشرية، في مقابل محاولة معاملتهما كإلهين، من غير حصر المعنى في المشاعر وحدها.
- source_word: εὐαγγελιζόμενοι
  choice: نُبشّركم
  rationale: فعل عربي واضح وطبيعي ينقل معنى إعلان الخبر السار ويحافظ على القوة الفعلية للصيغة اليونانية.
- source_word: ἐπιστρέφειν
  choice: لكي ترجعوا
  rationale: ينقل غاية البشارة واتجاه التحول، من غير استعمال مصطلح مذهبي محمّل.
- source_word: τούτων τῶν ματαίων
  choice: هذه الأباطيل
  rationale: يحافظ على الوصف العام لما هو باطل وعديم الجدوى، بدل تخصيصه بالأصنام وحدها.
- source_word: ἐπὶ θεὸν ζῶντα
  choice: إلى الله الحي
  rationale: ينقل الحركة والاتجاه المقصودين، ويحفظ المقابلة بين الله الحي والعبادة الوثنية الباطلة.
- source_word: ἐποίησεν
  choice: صنع
  rationale: مقابل مباشر للفعل في سياق الخلق، ويتلاءم مع صيغة الخلق الكتابية.
- source_word: τὸν οὐρανὸν
  choice: السماء
  rationale: يحافظ على المفرد اليوناني في صيغة الخلق المألوفة.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: كل ما فيها
  rationale: صياغة عربية طبيعية وشاملة تشير إلى كل ما في السماء والأرض والبحر.
theological_decisions:
- issue: مكانة بولس وبرنابا البشرية في مقابل إكرامهما كإلهين
  choice: فنحن أيضًا بشر مثلكم، نشارككم الطبيعة البشرية نفسها
  alternative: فنحن أيضًا مجرد بشر مثلكم
  rationale: الصياغة المختارة تؤكد اشتراكهما الكامل في الحالة البشرية، من غير إضافة «مجرد» غير الموجودة صراحة في اليونانية، مع بقاء الرفض الواضح لتأليههما.
- issue: نطاق عبارة τούτων τῶν ματαίων
  choice: هذه الأباطيل
  alternative: هذه الأصنام
  rationale: السياق يتضمن عبادة وثنية ومحاولة تقديم ذبيحة، لكن اللفظ اليوناني أوسع من الاسم الصريح للأصنام؛ لذلك حُفظ عمومه في المتن ووُضح سياقه في الحاشية.
- issue: دلالة الله الحي
  choice: الله الحي
  alternative: الإله الحي
  rationale: تحفظ العبارة المقابلة اللاهوتية بين الله الحي والمعبودات الباطلة، من غير إدخال شرح زائد في المتن.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «وهما يقولان» لاستئناف الحدث بوضوح وفق سياق الفاعلين، و«أيها الرجال» للمحافظة على النداء المذكر الصريح. حافظت الصياغة على عموم «الأباطيل» وعلى مفرد «السماء»، مع إيضاح البدائل في الحواشي.
