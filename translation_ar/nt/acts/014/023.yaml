  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: ar
  text: وبعد أن عيَّنوا لهم شيوخًا في كل كنيسة[a]، وصلّوا مع الصيام، عهدوا بهم إلى الرب الذي كانوا قد آمنوا به.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اختاروا لهم شيوخًا في كل كنيسة». قد يدل الفعل اليوناني في بعض السياقات على الاختيار بالتصويت أو برفع الأيدي، لكنه قد يعني هنا ببساطة التعيين.'
    reason: alternative_reading
  - marker: b
    text: قد يعود الضمير في «عهدوا بهم» إلى الشيوخ الذين عُيِّنوا حديثًا، لا إلى المؤمنين جميعًا.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: عيَّنوا
  rationale: يفيد الفعل هنا اختيار أشخاص وإقامتهم في مهمتهم، ولا يحدّد النص صراحةً آلية الاختيار؛ لذلك يتجنب «عيَّنوا» فرض نظام كنسي بعينه.
- source_word: κατ’ ἐκκλησίαν
  choice: في كل كنيسة
  rationale: استعمال κατά مع الاسم المفرد توزيعي، أي إن تعيين الشيوخ جرى في كل جماعة محلية.
- source_word: πρεσβυτέρους
  choice: شيوخًا
  rationale: السياق كنسي، فالمراد قادة معترف بهم في الجماعات، لا مجرد رجال متقدمين في السن.
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: وصلّوا مع الصيام
  rationale: يحافظ التعبير على اقتران الصلاة بالصوم وعلى كون الفعل تمهيدًا للفعل الرئيس، بصياغة عربية واضحة.
- source_word: παρέθεντο αὐτοὺς
  choice: عهدوا بهم
  rationale: ينقل معنى تسليم أشخاص إلى رعاية آخر، مع إبقاء ضمير الجمع من غير حسم صريح لمرجعه.
- source_word: τῷ κυρίῳ
  choice: إلى الرب
  rationale: المجرور باليونانية يبيّن من عُهد بالأشخاص إلى رعايته، و«الرب» المقابل المألوف والواضح لـ κύριος.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: الذي كانوا قد آمنوا به
  rationale: تفيد صيغة الماضي التام إيمانًا سابقًا مستقرًا، ويعود الموصول طبيعيًا إلى الرب.
theological_decisions:
- issue: دلالة χειροτονήσαντες وعلاقتها بنظام اختيار قادة الكنيسة
  choice: عيَّنوا شيوخًا
  alternative: انتخبوا شيوخًا، أو اختاروهم برفع الأيدي
  rationale: قد يرتبط الفعل في بعض الاستعمالات بالتصويت أو برفع الأيدي، لكنه هنا لا يصرّح بطريقة الاختيار؛ لذا تحافظ الصياغة المختارة على المعنى الأساسي من غير تبنّي نظام طائفي محدد.
- issue: مرجع الضمير αὐτοὺς في «عهدوا بهم»
  choice: الإبقاء على ضمير الجمع، مع رجحان عوده إلى المؤمنين في الجماعات
  alternative: عوده تحديدًا إلى الشيوخ المعيَّنين حديثًا
  rationale: السياق الأوسع يتناول التلاميذ والجماعات، لكن قرب ذكر الشيوخ يترك احتمال عود الضمير إليهم؛ لذلك لم يُستبدل الضمير باسم يزيل هذا التوتر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «شيوخ» بوصفه المصطلح الكنسي المباشر، وحُفظ ضمير الجمع لتجنّب حسم مرجعه المختلف فيه. لم تُنقل الحاشية الإنجليزية الموسومة c لأنها تسجل صياغة سابقة ولا تقدم قراءة نصية أو ترجمية بديلة مستقلة.
