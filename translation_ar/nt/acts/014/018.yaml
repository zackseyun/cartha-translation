  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: ar
  text: وحتى بقولهم هذا، بالكاد تمكّنا من كفّ الجموع عن تقديم الذبائح لهما.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: ومع أنهم قالوا هذا
  rationale: تفيد καί هنا، في سياق الجملة، معنى تصاعديًا قريبًا من «حتى مع قولهم هذا»، لا مجرد العطف الزمني؛ والصياغة العربية المختارة طبيعية وتحفظ المفارقة.
- source_word: μόλις κατέπαυσαν
  choice: لم يقدروا إلا بشق الأنفس أن يمنعوا
  rationale: تنقل μόλις معنى الصعوبة البالغة أو النجاح بالكاد، بينما يعبّر «يمنعوا» عن إيقاف الجموع عن الفعل المقصود.
- source_word: τοὺς ὄχλους
  choice: الجموع
  rationale: مقابل عربي واضح ودقيق للجمع اليوناني، ويحافظ على كون المشاركين جماعات كثيرة.
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: من أن يقدّموا لهم ذبائح
  rationale: تنقل البنية المصدرية الدالة على منع الفعل، وتوضح أن θύειν يعني تقديم الذبائح لهم.
theological_decisions:
- issue: وجهة الذبائح في αὐτοῖς
  choice: لهم
  alternative: إليهم
  rationale: الضمير يشير إلى الرسولين بوصفهما المتلقيين المقصودين للذبائح في تصور الجموع؛ أبقينا الإحالة صريحة من غير إضافة تفسير عقائدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت صياغة «لم يقدروا إلا بشق الأنفس» لإبراز شدة الصعوبة مع بقاء معنى أنهم نجحوا في منع الجموع.
