base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: ar
  text: وهو في الأجيال الماضية ترك جميعَ الأمم تسلك في طرقها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سمح لجميع الأمم غير اليهود أن تمضي في طرقها».'
    reason: بديل معجمي لـἔθνη وπορεύεσθαι؛ فقد يمكن أن تعني ἔθνη «الأمم غير اليهود» في هذا السياق.
lexical_decisions:
- source_word: ὃς
  choice: وهو
  rationale: ضمير موصول يعود إلى الله المذكور في الآية السابقة؛ وصياغة «وهو» تربط الجملة بسياقها ربطًا طبيعيًا مع إبقاء المرجع واضحًا.
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: في الأجيال الماضية
  rationale: ينقل معنى الأجيال التي مضت بعبارة عربية فصيحة واضحة وغير متكلفة.
- source_word: εἴασεν
  choice: ترك
  rationale: يفيد هنا السماح وعدم المنع، لا الاستحسان أو الإقرار الأخلاقي؛ كما يلائم عربيًا تركيب «ترك... يسلكون».
- source_word: πάντα τὰ ἔθνη
  choice: جميع الأمم
  rationale: يحافظ على الدلالة الجمعية الواسعة لـἔθνη، مع بقاء احتمال الإشارة إلى غير اليهود مذكورًا في الحاشية.
- source_word: πορεύεσθαι
  choice: يسلكون
  rationale: يحفظ استعارة السير بوصفها نهجًا في الحياة، وهو تعبير عربي كتابي مفهوم وطبيعي مع «الطرق».
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: في طرقهم
  rationale: ينقل صورة الطرق ومضافها من غير إضافة تفسيرية غير لازمة؛ والمقصود مجازًا مناهج حياتهم.
theological_decisions:
- issue: السماح الإلهي في مقابل الاستحسان
  choice: تُرجم εἴασεν بـ«ترك» بمعنى سمح ولم يمنع.
  alternative: أقرّ طرق الأمم أو حتمها عليهم.
  rationale: الفعل اليوناني يدل على الإذن أو الترك، ولا يصرح بالاستحسان الأخلاقي ولا بالتحديد السببي؛ فتحفظ الصياغة التوتر بين سلطان الله ومسؤولية البشر.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظت استعارة السلوك في الطرق، وتُجنب تفسير السماح على أنه موافقة أخلاقية.
