  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: ar
  text: لكن جاء يهودٌ من أنطاكية وإيقونية، واستمالوا الجموع، ثم رجموا بولس وجرّوه خارج المدينة، ظانّين أنه ميت.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ظانّين أنه قد مات». يذكر النص اليوناني ظنّهم، ولا يصرّح بأن بولس مات فعلًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπῆλθαν δὲ
  choice: لكن جاء
  rationale: تنقل «لكن» التحول المعاكس في السياق، و«جاء» تعبر طبيعيًا عن وصول المعارضين من المدينتين.
- source_word: Ἰουδαῖοι
  choice: يهودٌ
  rationale: المقصود هنا يهود قدموا من أنطاكية وإيقونية، لا سكان اليهودية على وجه التحديد.
- source_word: πείσαντες τοὺς ὄχλους
  choice: واستمالوا الجموع
  rationale: «استمالوا» تلائم سياق إقناع الجموع بالانقلاب على بولس، وتحفظ الجمع في ὄχλους.
- source_word: λιθάσαντες τὸν Παῦλον
  choice: ثم رجموا بولس
  rationale: يفيد اسم الفاعل اليوناني فعلًا سابقًا لجرّه، و«ثم» توضح التعاقب بأسلوب عربي طبيعي من غير إضافة تفسير.
- source_word: ἔσυρον ἔξω τῆς πόλεως
  choice: وجرّوه إلى خارج المدينة
  rationale: «جرّوه» تنقل عنف σύρω، و«إلى خارج المدينة» تبين غاية الحركة.
- source_word: νομίζοντες αὐτὸν τεθνηκέναι
  choice: ظانّين أنه مات
  rationale: تحفظ العبارة أن هذا كان ظن المعتدين، بينما يعبر «مات» عن الفعل الذي رأوا أنه قد تم، من غير تقرير أن موته وقع فعلًا.
theological_decisions:
- issue: هل يقرر النص أن بولس مات فعلًا أم يذكر اعتقاد مهاجميه فقط؟
  choice: ظانّين أنه مات
  alternative: ظانّين أنه كان ميتًا
  rationale: النص اليوناني ينسب الحكم إلى ظن المهاجمين بواسطة νομίζοντες، ولا يقرر مستقلًا أن بولس مات فعلًا. وتحفظ الصياغة هذا التوتر من غير إثبات موتٍ وقيامةٍ لاحقة أو نفيهما.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «استمالوا» بدل تعبير مطوّل لإبراز تأثير الخصوم في الجموع، مع الحفاظ على تسلسل الأفعال وكون موت بولس مجرد ظن من المهاجمين.
