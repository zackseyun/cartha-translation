source:
  edition: SBLGNT
  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: ar
  text: لكنَّ أهلَ المدينة انقسموا[a]، فكان بعضهم مع اليهود، وبعضهم مع الرسل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكنَّ جمهورَ المدينة انشقَّ».'
    reason: بديل لفظي يحافظ بصورة أقرب على المفرد الجماعي وعلى الدلالة الحرفية للفعل.
lexical_decisions:
- source_word: ἐσχίσθη
  choice: انقسموا
  rationale: الفعل المبني للمجهول يدل على الانشقاق أو الانقسام. وجاء الجمع ملائمًا في العربية لأن «أهل المدينة» جماعة من الأشخاص، وهو ينقل الانقسام الاجتماعي بوضوح وطبيعية.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: أهل المدينة
  rationale: تشير العبارة هنا إلى جمهور سكان المدينة، لا إلى حشد مجتمع في لحظة بعينها. و«أهل المدينة» تعبير عربي طبيعي ودقيق في السياق.
- source_word: δὲ
  choice: لكنَّ
  rationale: تفيد الأداة انتقالًا مع مقابلة خفيفة لما سبق، و«لكنَّ» تبرز انقسام أهل المدينة نتيجة الأحداث السابقة.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: بعضهم ... وبعضهم
  rationale: ينقل هذا التركيب التقابل بين الفريقين بوضوح، من غير زيادة تفيد حصرًا أبعد مما يقتضيه النص.
- source_word: σὺν
  choice: مع
  rationale: تفيد σύν المصاحبة أو الانحياز في هذا السياق، و«مع» تحافظ على بساطة الأصل، فيما يوضح السياق معنى الوقوف إلى جانب فريق.
- source_word: Ἰουδαίοις
  choice: اليهود
  rationale: لا يقيّد النص المرجع بالقادة اليهود تحديدًا، ولذلك يُحافَظ على الدلالة العامة للكلمة.
- source_word: ἀποστόλοις
  choice: الرسل
  rationale: «الرسل» هو المقابل العربي الراسخ لـἀπόστολοι، ويصف هنا بولس وبرنابا بحسب استعمال الراوي في أعمال 14:14.
theological_decisions:
- issue: مرجع «الرسل»
  choice: الإبقاء على «الرسل» بوصفه وصف الراوي لبولس وبرنابا.
  alternative: ترجمتها ترجمة أعم مثل «الموفدين» أو «المبعوثين».
  rationale: يسمي لوقا برنابا وبولس صراحةً «الرسولين» لاحقًا في هذا الأصحاح (أعمال 14:14). تنقل الترجمة لفظ النص من غير فرض تعريف عقائدي أضيق لمصطلح الرسول.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختير «أهل المدينة» بدل «جمهور المدينة» في المتن لطبيعته وسعة دلالته، مع حفظ الصياغة الأقرب إلى البنية اليونانية في الحاشية.
