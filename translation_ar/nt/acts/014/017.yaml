  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: ar
  text: ومع ذلك، لم يترك نفسه بلا شاهد[a]، وهو يحسن إليكم، فيعطيكم أمطارًا من السماء ومواسم مثمرة[b]، ويملأ قلوبكم طعامًا وفرحًا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بلا شهادة». تؤكد اليونانية أن الله لم يترك نفسه بلا شاهد يشهد له.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مواسم حاملة للثمر».'
    reason: lexical_alternative
  - marker: c
    text: 'تقرأ بعض المخطوطات: «قلوبنا»، أما النص اليوناني المعتمد هنا فيقرأ: «قلوبكم».'
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: ومع ذلك
  rationale: 'تنقل قوة الاستدراك: مع أن الله ترك الأمم في الأزمنة الماضية تسلك طرقها، فإنه لم يترك نفسه بلا شاهد.'
- source_word: ἀμάρτυρον
  choice: بلا شاهد
  rationale: تحافظ على الدلالة الشهادية للكلمة، مع إمكان فهمها بمعنى بلا شهادة.
- source_word: αὑτὸν
  choice: نفسه
  rationale: يحفظ الضمير الانعكاسي الذي يفيد أن الله قدّم شاهدًا عن نفسه.
- source_word: ἀφῆκεν
  choice: لم يترك
  rationale: ترجمة مباشرة وطبيعية للفعل في معنى الإبقاء في حال معينة.
- source_word: ἀγαθουργῶν
  choice: إذ كان يصنع الخير
  rationale: يبيّن أن أعمال الإحسان الآتية هي الكيفية التي لم يترك بها الله نفسه بلا شاهد، مع إبراز الاستمرار في صنع الخير.
- source_word: οὐρανόθεν
  choice: من السماء
  rationale: يحفظ التعبير الكتابي ومصدر المطر العلوي في سياق الحديث عن فعل الله.
- source_word: ὑετοὺς
  choice: أمطارًا
  rationale: يعكس صيغة الجمع اليونانية الدالة على الأمطار المتكررة.
- source_word: καιροὺς καρποφόρους
  choice: مواسم مثمرة
  rationale: تعبير عربي طبيعي يحفظ معنى الأزمنة التي تحمل الثمر أو تنتجه.
- source_word: ἐμπιπλῶν
  choice: ويملأ
  rationale: يحفظ صورة الملء الواردة في النص ويربطها بأفعال العطاء الإلهي.
- source_word: τροφῆς
  choice: طعامًا
  rationale: لفظ واضح ومباشر لمعنى الغذاء أو القوت في هذا السياق.
- source_word: εὐφροσύνης
  choice: فرحًا
  rationale: لفظ عربي شائع وواضح يدل على البهجة والسرور.
theological_decisions:
- issue: طبيعة شهادة الله عن نفسه في الآية
  choice: يعرض النص إحسان الله التدبيري، من المطر والخصب والطعام والفرح، بوصفه شاهدًا عن نفسه.
  alternative: اعتبار المذكور مجرد عمليات طبيعية لا تحمل دلالة لاهوتية.
  rationale: الضمير الانعكاسي «نفسه» مع عبارة «بلا شاهد»، ثم الأفعال التي تنسب العطاء إلى الله، تجعل خيراته في الخليقة والتدبير شهادة عنه، من غير توسيع العبارة إلى صياغة عقائدية تتجاوز الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. اختير «بلا شاهد» للمحافظة على الصورة الشهادية، واستُخدم «إذ كان يصنع الخير» لبيان الصلة التفسيرية بين الشهادة وأعمال الإحسان. أُبقي «قلوبكم» وفق قراءة SBLGNT، مع توثيق القراءة البديلة في الحاشية.
