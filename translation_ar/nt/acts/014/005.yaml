  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: ar
  text: ولمّا نشأت محاولةٌ من الأمم واليهود، مع رؤسائهم، لإساءة معاملتهما ورجمهما،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة بداية العبارة: «ولمّا حدث اندفاعٌ من الأمم واليهود، مع رؤسائهم، لإساءة معاملتهما ورجمهما». فاللفظة اليونانية قد تدل على اندفاعة أو هجمة أو محاولة عدائية. واختيار «محاولة» يلائم كون الإساءة والرجم مذكورين غايةً مقصودة، لا فعلين مكتملين في هذه الآية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο ὁρμὴ
  choice: ولمّا شرع
  rationale: يفيد التركيب نشوء اندفاعة عدائية أو بدء محاولة؛ وصيغة «شرع» تنقل ابتداء الفعل المقصود من غير أن توهم اكتماله.
- source_word: τῶν ἐθνῶν τε καὶ Ἰουδαίων
  choice: بعضُ الأمم واليهود
  rationale: «الأمم» هو المقابل العربي المألوف لغير اليهود في هذا السياق، وإضافة «بعض» تمنع فهم العبارة على أنها تشمل جميع أفراد الفريقين، وهو ما يقتضيه السياق لا اللفظ المفرد وحده.
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: مع رؤسائهم
  rationale: «الرؤساء» تنقل معنى أصحاب السلطة المدنية أو الجماعية، مع إبقاء احتمال عود الضمير إلى الجماعتين.
- source_word: ὑβρίσαι
  choice: في الإساءة إليهما
  rationale: الفعل يدل على معاملة مهينة أو اعتداء متغطرس، و«الإساءة» لفظ واسع لا يحصره في الشتم اللفظي.
- source_word: καὶ λιθοβολῆσαι αὐτούς
  choice: ورجمهما
  rationale: ينقل فعل الرجم من غير إضافة «حتى الموت»، لأن النتيجة القاتلة، وإن كانت محتملة القصد، غير مصرّح بها في الفعل نفسه؛ والمثنى يوضح أن المرجع بولس وبرنابا.
