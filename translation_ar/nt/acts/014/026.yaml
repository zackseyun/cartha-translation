  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: ar
  text: ومن هناك أبحرا إلى أنطاكية، حيث كانا قد أُوكِلا إلى نعمة الله لأجل العمل الذي أتمّاه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصورة أصرح: «ومن حيث كانا قد أُوكِلا إلى نعمة الله لأجل العمل الذي أتمّاه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: ومن هناك
  rationale: تحفظ الواو صلة الجملة بالسياق السابق، ويؤدي «من هناك» معنى الانطلاق من الموضع المذكور.
- source_word: ἀπέπλευσαν
  choice: أبحرا
  rationale: يدل الفعل على الرحيل بحرًا، و«أبحرا» تعبير عربي طبيعي واضح يبيّن وسيلة الانتقال دون حشو.
- source_word: εἰς Ἀντιόχειαν
  choice: إلى أنطاكية
  rationale: «إلى» هي المقابل الطبيعي لحرف الجر مع فعل الحركة، و«أنطاكية» الصيغة العربية المستقرة لاسم المكان.
- source_word: ὅθεν
  choice: حيث
  rationale: تأتي «حيث» طبيعية بعد ذكر أنطاكية، مع بقاء معنى كونها موضع الانطلاق السابق مفهومًا من السياق؛ وتوضح الحاشية المعنى الحرفي «من حيث».
- source_word: ἦσαν παραδεδομένοι
  choice: كانا قد أُودِعا
  rationale: ينقل التركيب الماضي السابق معنى فعل تم قبل العودة وظل ذا صلة، ويعبّر «أُودِعا» عن تسليمهما إلى عناية نعمة الله من غير إدخال مفهوم كنسي اصطلاحي زائد.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: نعمةَ الله
  rationale: تتعلق العبارة بالفعل المبني للمجهول، فتفيد الجهة التي أُودعا إليها؛ وحُفظ التعبير الإضافي الموجز والثقيل لاهوتيًا.
- source_word: εἰς τὸ ἔργον
  choice: لأجل العمل
  rationale: يؤدي غرض الإيداع وعلاقته بالعمل، ويحافظ «العمل» على عموم ἔργον دون تفسيره مسبقًا بأنه «مهمة» أو «إرسالية».
- source_word: ὃ ἐπλήρωσαν
  choice: الذي أتمّاه
  rationale: يفيد πληρόω هنا إكمال العمل وإنجازه؛ و«أتمّاه» أوضح وأطبع في العربية من ترجمة حرفية قد توحي بإتمام نبوة أو فريضة.
theological_decisions:
- issue: طبيعة ما فعله مؤمنو أنطاكية سابقًا ببولس وبرنابا
  choice: كانا قد أُودِعا نعمةَ الله
  alternative: كانا قد سُلِّما إلى نعمة الله / كانا قد استُودِعا نعمة الله
  rationale: يحفظ النص معنى وضعهما في رعاية نعمة الله لأجل العمل، من غير أن يحمّل العبارة نظرية طائفية محددة عن التكليف أو الرسامة.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل المثنى لأن الفاعلين في السياق هما بولس وبرنابا. وُضعت علامة الحاشية بعد الجملة لأنها تشرح الصلة المكانية للعبارة التابعة كاملة.
