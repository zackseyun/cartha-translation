  source_fidelity: تعبير «كانا قد أُودِعا نعمةَ الله» لا ينقل علاقة الداتيف في اليونانية على نحو سليم في العربية؛ إذ قد يُفهم منه أن «نعمة الله» هي الشيء المُودَع، لا الجهة التي أُوكِل إليها بولس وبرنابا. ويصحح «كانا قد أُوكِلا إلى نعمة الله» هذه العلاقة، ويحفظ المبني للمجهول ومعنى الفعل السابق. أما «أبحرا»، و«إلى أنطاكية»، و«لأجل العمل الذي أتمّاه» فهي أمينة للنص.
