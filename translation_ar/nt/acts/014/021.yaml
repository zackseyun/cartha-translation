  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: ar
  text: وبعد أن أعلنا البشارة في تلك المدينة[a] وجعلا كثيرين تلاميذ، رجعا إلى لِسترة وإيقونية وأنطاكية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعد أن بشَّرا بالإنجيل في تلك المدينة».'
    reason: بديل اصطلاحي لـ «أعلنا البشارة»، يعبّر بوضوح عن فعل εὐαγγελίζομαι مع المحافظة على دلالة المكان.
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: بعد أن أعلنا البشارة
  rationale: ينقل فعل إعلان الخبر السار بعبارة عربية واضحة، ويعبّر تركيب «بعد أن» طبيعيًا عن الفعل السابق للرجوع في السياق.
- source_word: τε
  choice: و
  rationale: يحفظ الصلة الخفيفة بين هذه الجملة وما قبلها، مع انسجام طبيعي في العربية.
- source_word: τὴν πόλιν ἐκείνην
  choice: في تلك المدينة
  rationale: يشير اسم الإشارة إلى دربة في السياق، وصيغة المكان طبيعية مع «أعلنا البشارة» في العربية.
- source_word: μαθητεύσαντες
  choice: وجعلا ... تلاميذ
  rationale: 'يحفظ المعنى السببي للفعل: جعلا أشخاصًا يصيرون تلاميذ، من غير اختزاله في مجرد التعليم.'
- source_word: ἱκανοὺς
  choice: كثيرين
  rationale: يدل هنا على عدد وافر، لا على الكفاية أو الأهلية.
- source_word: ὑπέστρεψαν
  choice: رجعا
  rationale: فعل ماضٍ يدل على العودة؛ واستُعمل المثنى لأن الفاعلين في السياق هما بولس وبرنابا.
- source_word: εἰς τὴν Λύστραν καὶ εἰς Ἰκόνιον καὶ εἰς Ἀντιόχειαν
  choice: إلى لِسترة وإيقونية وأنطاكية
  rationale: تنقل «إلى» معنى الوجهة بوضوح، والعطف المتكرر في العربية يحفظ تسلسل خط سير العودة دون إثقال بتكرار حرف الجر.
