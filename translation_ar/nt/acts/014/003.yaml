revisions:
- from: فمكثا هناك وقتًا طويلًا، يتكلمان بجرأة متكلين على الرب[a]، الذي كان يشهد لكلمة نعمته، ويمنح حدوث آيات وعجائب على أيديهما.
  to: فمكثا هناك وقتًا طويلًا، يتكلمان بجرأة في الرب[a]، الذي كان يشهد لكلمة نعمته، إذ كان يتيح إجراء آيات وعجائب على أيديهما.
  rationale: استُبدلت صياغة الاتكال الصريحة في المتن بـ«في الرب» للمحافظة على اتساع ἐπὶ τῷ κυρίῳ، مع بيان الاحتمالات الدلالية في الحاشية. واستُبدل التركيب غير الطبيعي «يمنح حدوث» بـ«إذ كان يتيح إجراء» ليؤدي معنى منح وقوع الآيات والعجائب في عربية واضحة، مع الإبقاء على «على أيديهما» للدلالة على الوساطة.
