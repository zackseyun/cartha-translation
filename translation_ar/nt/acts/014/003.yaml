source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: ar
  text: فمكثا هناك وقتًا طويلًا، يتكلمان بجرأة في الرب[a]، الذي كان يشهد لكلمة نعمته، إذ كان يتيح إجراء آيات وعجائب على أيديهما.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «متكلين على الرب»، أو «من أجل الرب». قد تفيد العبارة اليونانية أن جرأتهما كانت في ارتباط بالرب، أو قائمة عليه، أو في خدمته.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: وقتًا طويلًا
  rationale: يدل التعبير على مدة ملحوظة أو ممتدة. و«وقتًا طويلًا» تعبير عربي طبيعي لا يبالغ في تحديد المدة.
- source_word: διέτριψαν
  choice: مكثا هناك
  rationale: يفيد الفعل قضاء وقت أو البقاء في مكان. واستُعمل المثنى لأن المقصود في السياق بولس وبرنابا.
- source_word: παρρησιαζόμενοι
  choice: يتكلمان بجرأة
  rationale: ينقل معنى الكلام الصريح الجريء من غير خوف، ويحافظ على كون الفعل وصفًا لطريقة مكثهما وخدمتهما.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: متكلين على الرب
  rationale: قد تفيد ἐπί مع المجرور باليونانية الأساس أو الاعتماد؛ وهذه الصياغة العربية توضح أن جرأتهما مستندة إلى الرب، مع حفظ الاحتمالات الأخرى في الحاشية.
- source_word: τῷ κυρίῳ
  choice: الرب
  rationale: يحافظ على اللقب اليوناني من غير إضافة «يسوع» أو تعيين المرجع بما يتجاوز ألفاظ النص.
- source_word: τῷ μαρτυροῦντι
  choice: الذي كان يشهد
  rationale: يحفظ دلالة الشهادة والتأييد المستمرين في أثناء خدمتهما.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: لكلمة نعمته
  rationale: يحافظ على تركيب الإضافة وعلى إمكان فهم «الكلمة» بوصفها الرسالة المتصفة بنعمته أو المتحدثة عنها.
- source_word: χάριτος
  choice: نعمة
  rationale: «النعمة» هي المقابل العربي الواضح ذو الحمولة اللاهوتية المناسبة في سياق لوقا وأعمال الرسل.
- source_word: διδόντι
  choice: يمنح
  rationale: يبين أن الرب هو الذي يهب إمكان وقوع الآيات والعجائب ويأذن به، بدل تصوير الرسولين مصدرًا مستقلًا لها.
- source_word: σημεῖα καὶ τέρατα
  choice: آيات وعجائب
  rationale: يحفظ الاقتران الكتابي المعروف بين الدلالة البرهانية للأعمال وطابعها المدهش.
- source_word: γίνεσθαι
  choice: حدوث
  rationale: ينقل معنى وقوع الآيات والعجائب، مع إبقاء الرب مانحًا لحدوثها.
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: على أيديهما
  rationale: تعبير عربي مألوف يحفظ الصورة الملموسة ويدل على أن الرسولين واسطتان لإجراء هذه الأعمال.
theological_decisions:
- issue: مرجع «الرب» في الجمل الوصفية
  choice: الإبقاء على «الرب» من غير زيادة اسم آخر
  alternative: «الرب يسوع» أو تفسيره صراحة بأنه الله
  rationale: النص اليوناني يذكر اللقب وحده. وقد يرجح السياق الإشارة إلى الرب يسوع القائم، لكن التصريح بذلك داخل الترجمة سيضيف ما ليس مذكورًا لفظًا.
- issue: دلالة ἐπὶ τῷ κυρίῳ
  choice: «متكلين على الرب» في المتن
  alternative: «في الرب» أو «من أجل الرب»
  rationale: يحتمل التركيب معنى الأساس أو مجال الارتباط أو جهة الخدمة. اختير معنى الاتكال لسلامته في العربية وملاءمته للسياق، مع إبقاء الاحتمالات الأخرى في الحاشية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُعمل المثنى بما يلائم مرجع الضمير في السياق العربي، وحُفظت العبارة الكتابية «آيات وعجائب» و«على أيديهما» من غير تكلف.
