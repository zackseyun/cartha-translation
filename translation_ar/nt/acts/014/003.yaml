review_pass:
  verdict: revise
  source_fidelity: 'الترجمة تنقل عناصر الآية الأساسية نقلًا أمينًا: طول الإقامة، الكلام بجرأة، شهادة الرب لكلمة نعمته، ووقوع الآيات والعجائب على يدي الرسولين. لكن «متكلين على الرب» يحسم دلالة ἐπὶ τῷ κυρίῳ في معنى الاتكال، مع أن العبارة تحتمل أيضًا المجال أو الارتباط («في الرب»). كما أن «يمنح حدوث» غير طبيعي في العربية ولا يؤدي بسلاسة تركيب διδόντι ... γίνεσθαι.'
  naturalness: «فمكثا هناك وقتًا طويلًا» و«آيات وعجائب على أيديهما» سليمتان وطبيعيتان. أما «ويمنح حدوث آيات» فصياغة اسمية ثقيلة وغير مألوفة في العربية الفصحى المعاصرة؛ والأوضح «إذ كان يتيح إجراء آيات وعجائب على أيديهما».
  terminology: «الرب»، «كلمة نعمته»، و«آيات وعجائب» مقابلات مناسبة وتحافظ على ألفاظ النص ولا تضيف «يسوع». ويُستحسن جعل «في الرب» في المتن مع حاشية تبين احتمال الاتكال أو الخدمة؛ فهذا يحفظ اتساع العبارة اليونانية أفضل من تقرير الاتكال وحده.
  issues:
  - severity: medium
    issue: حسم دلالة ἐπὶ τῷ κυρίῳ في «متكلين على الرب».
    rationale: التركيب اليوناني قابل لفهمه على أنه اتكال أو مجال/ارتباط («في الرب») أو خدمة/قضية («من أجل الرب»). اختيار الاتكال في المتن يضيّق المعنى، رغم أن الحاشية تسجل بدائل.
  - severity: medium
    issue: الصياغة «يمنح حدوث آيات وعجائب» غير سليمة الأسلوب بما يكفي.
    rationale: الفعل «يمنح» لا ينسجم طبيعيًا هنا مع المصدر «حدوث» في العربية. يلزم فعل أو تركيب يعبّر بسلاسة عن منح/إتاحة وقوع الآيات، مع بقاء الرسولين أداتين لا مصدرين مستقلين للأفعال.
