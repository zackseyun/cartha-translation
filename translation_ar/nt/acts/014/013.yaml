base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: ar
  text: وكان كاهن زيوس، الذي كان معبده خارج المدينة[a]، قد أحضر ثيرانًا وأكاليل[b] إلى البوابات، وأراد أن يقدّم ذبيحةً مع الجموع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «زيوس الذي كان أمام المدينة»؛ والمقصود على الأرجح معبد زيوس أو مزارُه الواقع أمام المدينة، أي خارجها.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «أطواق احتفالية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅ τε
  choice: وكان
  rationale: تؤدي العبارة وظيفة وصل سردي، و«وكان» تستأنف الحدث بسلاسة في العربية من غير مبالغة في تحديد العلاقة المنطقية.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: كاهن زيوس
  rationale: يحافظ «زيوس» على الاسم اليوناني الوارد في النص بدل استبداله بنظيره الروماني «جوبيتر».
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: الذي كان معبده خارج المدينة
  rationale: العبارة تصف زيوس بحسب موضع مَعبده على الأرجح؛ وقد صُرّح بالمعبد المفهوم ضمنًا لتستقيم العبارة عربيًا، مع بيان اللفظ الأقرب في الحاشية.
- source_word: ταύρους
  choice: ثيرانًا
  rationale: المعنى المباشر للاسم هو الثيران، وهو ملائم لسياق تقديم الذبائح.
- source_word: στέμματα
  choice: أكاليل
  rationale: تشير الكلمة إلى الأكاليل أو القلائد النباتية المستعملة في المواكب والذبائح، و«أكاليل» تعبير عربي واضح وموجز.
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: إلى البوابات
  rationale: تفيد ἐπί مع فعل الحركة الاتجاه إلى البوابات، كما حُفظ الجمع الوارد في اليونانية.
- source_word: ἐνέγκας
  choice: قد أحضر
  rationale: صيغ اسم الفاعل الماضي في جملة فعلية عربية تمهّد للفعل الرئيس وتحافظ على تسلسل الحدث الطبيعي.
- source_word: σὺν τοῖς ὄχλοις
  choice: مع الجموع
  rationale: حُفظ جمع ὄχλοις، وتفيد العبارة أن الكاهن كان مزمعًا أن يقوم بالفعل بمشاركة الناس المحتشدين.
- source_word: ἤθελεν θύειν
  choice: أراد أن يقدّم ذبيحةً
  rationale: تعبر θέλω مع المصدر عن الإرادة أو القصد، ويُظهر «يقدّم ذبيحة» المعنى التعبدي للفعل θύω بدل اختزاله في مجرد القتل.
theological_decisions:
- issue: مرجع العبارة τοῦ ὄντος πρὸ τῆς πόλεως
  choice: فُهمت على أنها تشير إلى معبد زيوس الواقع خارج المدينة.
  alternative: 'يمكن إبقاء العبارة أقرب إلى ظاهرها: «زيوس الذي كان أمام المدينة».'
  rationale: كان من المألوف تعريف الإله بموضع مَعبده، وسياق الكاهن والذبيحة يؤيد هذا الفهم. ومع ذلك، لأن لفظ «المعبد» غير مصرح به في اليونانية، حُفظ ظاهر النص في الحاشية ولم يُعرض التفسير على أنه خالٍ من الاحتمال.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية وقورة. استُخدمت ألفاظ دينية عامة غير طائفية، مع التصريح بالمعبد المفهوم من السياق وحفظ الاحتمال النصي في الحاشية.
