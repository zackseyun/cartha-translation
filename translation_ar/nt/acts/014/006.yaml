translation:
  language: ar
  text: فَلَمَّا أَدْرَكَا ذَلِكَ[a]، هَرَبَا إِلَى مُدُنِ لِكَأُونِيَةَ—لِسْتَرَةَ وَدَرْبَةَ—وَالْمِنْطَقَةِ الْمُحِيطَةِ بِهِمَا،
