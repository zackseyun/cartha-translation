    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: فَلَمَّا أَدْرَكَا ذَلِكَ
  rationale: اسم الفاعل الماضي يفيد توصلهما إلى فهم الخطر المذكور في الآية السابقة. أُضيف اسم الإشارة اعتمادًا على السياق، وصيغ الفعل بالمثنى لأن الفاعلين هما بولس وبرنابا.
- source_word: κατέφυγον
  choice: هَرَبَا
  rationale: الفعل يدل على الفرار طلبًا للنجاة أو الملجأ؛ و«هربا» أوضح وأنسب لسياق الخطر العاجل.
- source_word: εἰς
  choice: إِلَى
  rationale: حرف الجر مع فعل الحركة يحدد الوجهة، و«إلى» هي الصياغة العربية الطبيعية هنا.
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: مُدُنِ لِكَأُونِيَةَ
  rationale: تحافظ الإضافة على العلاقة الإقليمية في اليونانية، وتتيح أن يأتي اسما المدينتين بعدها على سبيل البيان.
- source_word: Λύστραν καὶ Δέρβην
  choice: لِسْتَرَةَ وَدَرْبَةَ
  rationale: نقل صوتي عربي شائع لاسمي الموضعين، وهما بيان لمدن لكأونية المذكورة.
- source_word: τὴν περίχωρον
  choice: الْمِنْطَقَةِ الْمُحِيطَةِ بِهَا
  rationale: يدل اللفظ على النواحي المحيطة بالمدينتين. استُعمل ضمير المفرد مراعاةً لكلمة «المنطقة»، مع بقاء نطاق الإحالة مفهومًا من السياق.
- source_word: καὶ ... καὶ
  choice: —لِسْتَرَةَ وَدَرْبَةَ—وَإِلَى
  rationale: توضح الشرطتان أن اسمي المدينتين بيان لعبارة «مدن لكأونية»، ثم تُظهر الواو إضافة المنطقة المحيطة. وتكرار «إلى» يجعل العطف واضحًا وطبيعيًا بالعربية.
theological_decisions: []
