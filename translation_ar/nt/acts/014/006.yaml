  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم المثنى وفق مرجع الفاعل في السياق، وحُفظت علاقة البيان بين «مدن لكأونية» واسمي لسترة ودربة، مع إبقاء دلالة الفعل الأول على الإدراك دون تحديد وسيلة العلم.
