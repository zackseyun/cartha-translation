  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: ar
  text: 'لكن لما سمع الرسولان برنابا وبولس، مزَّقا ثيابهما[a] واندفعا إلى وسط الجمع[b] وهما يصرخان:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان تمزيق الثياب علامة مألوفة على الحزن أو الفزع أو الاحتجاج على تكريم يُعَدّ تجديفًا.
    reason: cultural_note
  - marker: b
    text: 'أو: «وثبا إلى وسط الجمع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: لما سمعا بذلك
  rationale: اسم الفاعل الماضي يؤدي معنى زمنيًّا سابقًا للفعلين التاليين؛ وصيغة «لما سمعا» طبيعية في العربية، و«بذلك» تعود إلى ما جرى في السياق السابق من غير أن تضيف مضمونًا جديدًا.
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا فيه مقابلة بين محاولة الجمع تقديم الذبيحة ورد فعل الرسولين الرافض.
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: الرسولان برنابا وبولس
  rationale: يثبت النص لقب «الرسولين» لبرنابا وبولس في هذا السياق، مع استعمال المثنى العربي الطبيعي ونقل الاسمين بحسب الصيغة العربية المألوفة.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: مزَّقا ثيابهما
  rationale: ترجمة مباشرة وطبيعية لفعل شق الثياب، مع مراعاة المثنى؛ وهي حركة كانت تعبّر عن الحزن أو الفزع أو الاحتجاج الشديد.
- source_word: ἐξεπήδησαν εἰς τὸν ὄχλον
  choice: اندفعا إلى وسط الجمع
  rationale: ينقل «اندفعا» الحركة المفاجئة القوية، وتعبّر «إلى وسط الجمع» عن اتجاه الحركة نحو كتلة الناس من غير إثقال العبارة بحرف خروج غير لازم في العربية.
- source_word: κράζοντες
  choice: وهما يصرخان
  rationale: ينقل اسم الفاعل الحاضر فعلًا مصاحبًا مستمرًّا وبصوت مرتفع، ويمهّد للكلام الوارد في العدد التالي.
theological_decisions:
- issue: إطلاق وصف «الرسولين» على برنابا وبولس
  choice: الرسولان برنابا وبولس
  alternative: برنابا وبولس، وهما الرسولان
  rationale: التركيب اليوناني يعرّف برنابا وبولس بأنهما الرسولان في هذا السياق. تُحفظ دلالة النص من غير تقييد معنى اللقب بفئة معينة أو إدخال نقاش عقائدي لاحق.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل المثنى في الأفعال والضمائر موافقةً لبرنابا وبولس، وحُفظت شدة رد الفعل وسرعة الحركة، مع نقطتين في الختام لأن الصراخ يتبعه كلام مباشر في العدد التالي.
