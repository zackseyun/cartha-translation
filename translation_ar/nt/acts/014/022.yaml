source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: ar
  text: 'وكانا يثبِّتان نفوس التلاميذ، ويشجِّعانهم على الثبات في الإيمان[a]، ويقولان: «لا بدَّ لنا أن ندخل ملكوت الله عبر ضيقات كثيرة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة بمعنى: «الثبات في إيمانهم». وأداة التعريف في اليونانية ترجّح «الإيمان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: يثبِّتان
  rationale: ينقل معنى التقوية وجعل التلاميذ راسخين، وصيغة المثنى تلائم الفاعلين في السياق، بولس وبرنابا.
- source_word: τὰς ψυχὰς τῶν μαθητῶν
  choice: نفوس التلاميذ
  rationale: يحافظ على الصورة اليونانية وعلى دلالة النفس أو الكيان الداخلي، من غير افتراض فصل فلسفي حاد بين النفس والجسد.
- source_word: παρακαλοῦντες
  choice: يشجِّعانهم
  rationale: يجمع بين المساندة والحث، وهو طبيعي وواضح في سياق دعوتهم إلى الثبات وسط الضيق.
- source_word: ἐμμένειν τῇ πίστει
  choice: على الثبات في الإيمان
  rationale: ἐμμένειν يدل على الاستمرار والرسوخ، وأداة التعريف مع πίστει ترجّح الإشارة إلى الإيمان الذي اعتنقه التلاميذ.
- source_word: διὰ πολλῶν θλίψεων
  choice: عبر ضيقات كثيرة
  rationale: «عبر» تصوّر المرور وسط الضيقات في الطريق إلى الملكوت، و«ضيقات» تنقل معنى الضغط والشدة من غير تهوين.
- source_word: δεῖ ἡμᾶς
  choice: لا بدَّ لنا
  rationale: تؤدي معنى الضرورة بقوة ووضوح، من غير إضافة تفسير لطبيعة هذه الضرورة أو مصدرها.
- source_word: εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: أن ندخل ملكوت الله
  rationale: صياغة عربية طبيعية تحفظ فعل الدخول والتعبير الكتابي المألوف «ملكوت الله».
theological_decisions:
- issue: دلالة πίστις المعرَّفة
  choice: الإيمان
  alternative: إيمانهم
  rationale: أداة التعريف اليونانية ترجّح معنى الإيمان بوصفه الطريق أو المعتقد الذي يثبت فيه التلاميذ، مع بقاء إمكان فهمه بوصفه إيمانهم وثقتهم.
- issue: قوة δεῖ وعلاقة الضيقات بدخول الملكوت
  choice: لا بدَّ لنا أن ندخل ملكوت الله عبر ضيقات كثيرة
  alternative: من الضروري لنا أن ندخل ملكوت الله من وسط شدائد كثيرة
  rationale: تحفظ الصياغة ضرورة المرور بالضيقات من غير جعل الألم استحقاقًا للخلاص أو شرح الآلية اللاهوتية التي وراء الضرورة.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية رصينة. استُعمل المثنى لأن السياق يتحدث عن بولس وبرنابا، وأُبقيت «نفوس» و«ملكوت الله» للمحافظة على الصورة والمصطلح الأصليين.
