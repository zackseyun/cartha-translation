  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: ar
  text: 'ولمّا رأت الجموع ما فعله بولس، رفعت أصواتها قائلةً باللِّيكاوُنِيَّة: «الآلهة، وقد صاروا شبيهين بالبشر[a]، نزلوا إلينا!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وقد جُعلوا شبيهين بالبشر».'
    reason: يحمل اسم المفعول اليوناني المبني للمجهول معنى الصيرورة إلى شبه البشر، ويمكن إبراز صيغته المبنية للمجهول حرفيًّا.
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: ولمّا رأت الجموع
  rationale: تؤدي أداة الربط مع اسم الفاعل الماضي معنى استمرار السرد والظرف الزمني، وتحافظ على جمع «الجموع» بصياغة عربية طبيعية.
- source_word: ὃ ἐποίησεν Παῦλος
  choice: ما فعله بولس
  rationale: ترجمة مباشرة للموصول والفعل، وتشير في السياق إلى العمل الذي أجراه بولس للتو.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: رفعوا أصواتهم
  rationale: تحافظ على الصورة الاصطلاحية اليونانية وتفيد الجهر بالصوت من غير اختزالها في «صرخوا».
- source_word: Λυκαονιστί
  choice: باللِّيكاوُنِيَّة
  rationale: الظرف يدل على الكلام بلسان ليكاونية؛ والصياغة العربية الموجزة واضحة في السياق.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: وقد صاروا شبيهين بالبشر
  rationale: تنقل معنى المشابهة وتبقي التحول السابق للنزول ظاهرًا، مع تجنب لغة تجسد عقائدية لا يقتضيها كلام الجموع الوثني.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: نزلوا إلينا
  rationale: ترجمة طبيعية ومباشرة للفعل والحرف، وتناسب صيحة الجموع الحماسية.
theological_decisions:
- issue: نقل تفسير الجموع الوثني للمعجزة من غير إقحام لغة عقائدية مسيحية
  choice: «الآلهة، وقد صاروا شبيهين بالبشر، نزلوا إلينا!»
  alternative: «الآلهة، وقد جُعلوا شبيهين بالبشر، نزلوا إلينا!»
  rationale: النص يورد اعتقاد الجموع الخاطئ ولا يقرره بوصفه حقيقة لاهوتية. وتحافظ الصياغة المختارة على معنى المشابهة والتحول، بينما تُذكر دلالة المبني للمجهول الممكنة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورفيعة من غير تكلف. استُعمل «البشر» لأن ἀνθρώποις يدل هنا على البشر عمومًا في مقابل الآلهة، واستُبقيت صيغة الجمع العاقل في الأفعال لأن المقصود آلهة متصوَّرة بوصفها أشخاصًا.
