lexical_decisions:
- source_word: κἀκεῖ
  choice: وكانا هناك
  rationale: 'اللفظة مركبة من καί وἐκεῖ، فتفيد الربط مع معنى المكان: «وكانا هناك»؛ كما أن صيغة المثنى تلائم بولس وبرنابا في السياق السابق.'
- source_word: εὐαγγελιζόμενοι
  choice: يُبشِّران بالبشارة
  rationale: الفعل يعني إعلان الخبر السار، ولا سيما بشارة المسيح. تحافظ الصياغة على المعنى اللفظي وتبقى واضحة في العربية المعاصرة.
- source_word: ἦσαν
  choice: كانا
  rationale: مع اسم الفاعل يشكل الفعل الناقص تركيبًا يدل على فعل مستمر في الماضي؛ ونُقل بالعربية باستخدام «كانا» مع الفعل المضارع.
