lexical_decisions:
- source_word: διέτριβον
  choice: أقاما
  rationale: الفعل في صيغة الماضي الناقص يدل على المكث المستمر؛ و«أقاما» تعبير عربي طبيعي يحفظ معنى البقاء مدةً في المكان، والمثنى يعود إلى بولس وبرنابا بحسب السياق.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد، وتؤديها الواو العربية بوضوح وطبيعية.
- source_word: χρόνον οὐκ ὀλίγον
  choice: وقتًا غير قليل
  rationale: 'يحفظ هذا التعبير أسلوب التقليل البلاغي في اليونانية، مع بقاء المعنى مفهومًا: مدة معتبرة.'
- source_word: σὺν τοῖς μαθηταῖς
  choice: مع التلاميذ
  rationale: تنقل «مع» الدلالة المباشرة لحرف الجر σύν، وتشير «التلاميذ» في السياق إلى جماعة المؤمنين المحلية.
