  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: ar
  text: وكان في لِسْتَرَة رجلٌ عاجزُ القدمين، جالسٌ، أعرجُ من بطن أمه، ولم يمشِ قط.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καί
  choice: وكان
  rationale: يفيد وصل المشهد بما قبله مع افتتاح وصفٍ سردي طبيعي بالعربية.
- source_word: τις ἀνὴρ
  choice: رجلٌ
  rationale: التنكير العربي يؤدي معنى شخص غير مسمّى مع كونه فردًا بعينه في السرد، ولا حاجة إلى «رجلٌ ما» الأثقل أسلوبًا.
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: عاجزَ القدمين
  rationale: يحفظ معنى انعدام القدرة في القدمين قبل التصريح بأنه أعرج، من غير دمج الوصفين.
- source_word: ἐν Λύστροις
  choice: في لِسْتَرَة
  rationale: نقل عربي واضح لاسم الموضع.
- source_word: ἐκάθητο
  choice: جالسًا
  rationale: ينقل الحالة المستمرة التي يصورها الماضي الناقص اليوناني، وتكتمل دلالته مع «كان».
- source_word: χωλός
  choice: أعرجَ
  rationale: المقابل العربي المألوف والدقيق لوصف عدم القدرة السوية على المشي.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: من بطن أمه
  rationale: يحافظ على الصورة الحرفية للتعبير اليوناني، أي إن حالته كانت خلقية منذ الولادة.
- source_word: οὐδέποτε περιεπάτησεν
  choice: ولم يمشِ قط
  rationale: تعبير عربي طبيعي يؤكد أنه لم يسبق له المشي في أي وقت.
