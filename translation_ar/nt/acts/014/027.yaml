base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: ar
  text: ولمّا وصلا وجمعا الكنيسة، كانا يُخبران بكل ما فعله الله معهما[a]، وبأنه فتح للأمم بابًا للإيمان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما فعله الله بواسطتهما». واليونانية تقول حرفيًا: «معهما».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فتح للأمم بابَ الإيمان». والمقصود بـ«الأمم» هنا غير اليهود.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: ولمّا وصلا
  rationale: ينقل اسم الفاعل الماضي بوصفه حدثًا سابقًا للفعل الرئيس، بصياغة عربية طبيعية، والمثنى يعود إلى بولس وبرنابا.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: وجمعا الكنيسة
  rationale: يحافظ على معنى جمع جماعة المؤمنين المحلية للاجتماع، من غير إضافة لفظ لا يقتضيه الأصل.
- source_word: ἀνήγγελλον
  choice: أخبرا
  rationale: يناسب سياق إطلاع الكنيسة على ما جرى، مع مراعاة أن الفعل اليوناني بصيغة الماضي غير التام الدالة على السرد أو التقرير الجاري.
- source_word: ὅσα
  choice: بكل ما
  rationale: مقابل عربي طبيعي للموصول الجمع المحايد، ويفيد شمول ما روياه.
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: ما صنعه الله معهما
  rationale: يحفظ المعنى المباشر لحرف الجر μετά، فيبقى الله هو الفاعل ويظل بولس وبرنابا مرتبطين بعمله من غير حسم العبارة بمعنى الوسيلة.
- source_word: τοῖς ἔθνεσιν
  choice: للأمم
  rationale: يحفظ الدلالة الحرفية للفظ ἔθνη، مع إيضاح احتماله السياقي في الحاشية بوصفه إشارة إلى غير اليهود.
- source_word: θύραν πίστεως
  choice: بابًا للإيمان
  rationale: يحفظ استعارة الباب، وتفيد اللام على نحو عربي طبيعي أن الباب المفتوح يتيح الدخول إلى الإيمان أو الاستجابة به، مع إثبات البديل الأقرب إلى البنية اليونانية في الحاشية.
- source_word: πίστεως
  choice: الإيمان
  rationale: هو المقابل العربي المعتاد لـ πίστις هنا، والسياق يرجح الاستجابة المؤمنة لا الأمانة.
theological_decisions:
- issue: دلالة μετ’ αὐτῶν في وصف عمل الله
  choice: صنعه الله معهما
  alternative: صنعه الله بواسطتهما / على أيديهما
  rationale: يحافظ النص على حرف الجر «مع» ولا يحسم علاقة الرسولين بعمل الله على أنها آلية محضة؛ فالله هو الفاعل وهما مصاحبان لعمله.
- issue: دلالة ἔθνεσιν
  choice: الأمم
  alternative: غير اليهود
  rationale: «الأمم» يحفظ اللفظ اليوناني وصورته الكتابية، بينما يوضح البديل في الحاشية أن المقصود في السياق هم الشعوب من غير اليهود.
- issue: علاقة الإضافة في θύραν πίστεως
  choice: بابًا للإيمان
  alternative: بابَ الإيمان
  rationale: صيغة اللام طبيعية في العربية وتبقي المجال مفتوحًا لفهم الباب بوصفه فرصة للدخول إلى الإيمان أو الاستجابة به، بدل فرض علاقة إضافة واحدة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم المثنى لأن السياق يتحدث عن بولس وبرنابا، وحُفظت استعارة الباب والتوتر الدلالي في عبارة «معهما».
