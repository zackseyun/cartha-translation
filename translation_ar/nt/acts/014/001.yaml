id: ACT.14.1
reference: Acts 14:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: ar
  text: وفي إيقونية، دخلا معًا إلى مجمع اليهود[a]، وتكلّما بحيث آمن جمع كثير من اليهود واليونانيين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المجمع اليهودي». واليونانية حرفيًا: «مجمع اليهود».'
    reason: بديل معجمي يوضح إمكان فهم الإضافة وصفًا للمجمع مع إبقاء الصياغة الأقرب إلى الأصل في المتن.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وفي
  rationale: التركيب افتتاح انتقالي في السرد، لا إخبار مستقل عن وقوع حدث. تنقل الواو استمرارية السرد من غير إضافة ظرف زمني غير مصرح به.
- source_word: ἐν Ἰκονίῳ
  choice: في إيقونية
  rationale: عبارة مكانية مباشرة، مع نقل اسم الموضع إلى العربية بصيغته الشائعة.
- source_word: κατὰ τὸ αὐτό
  choice: معًا
  rationale: يدل التعبير الاصطلاحي هنا على اشتراك بولس وبرنابا في الدخول والعمل، و«معًا» أوضح تعبير عربي موجز عن ذلك.
- source_word: εἰσελθεῖν αὐτοὺς
  choice: دخلا
  rationale: حُوِّل المصدر التابع للتركيب السردي إلى فعل ماضٍ عربي، واستُعمل المثنى لأن المرجع في السياق هو بولس وبرنابا.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: إلى مجمع اليهود
  rationale: يحافظ على الإضافة اليونانية «مجمع اليهود» بعبارة عربية واضحة، مع إثبات البديل الوصفي في الحاشية.
- source_word: λαλῆσαι
  choice: وتكلّما
  rationale: ترجمة مباشرة لفعل الكلام، مع صيغة المثنى الموافقة للفاعلين، من غير تقييده صراحة بالوعظ أو مخاطبة فئة بعينها.
- source_word: οὕτως ὥστε
  choice: بحيث
  rationale: تفيد «بحيث» اقتران كيفية الكلام بالنتيجة، فتحفظ الصلة بين الأسلوب والأثر من غير تحويلها إلى غاية مقصودة حتمًا.
- source_word: πιστεῦσαι
  choice: آمن
  rationale: ينقل فعل التصديق أو الإيمان بصيغته الأساسية، من غير إضافة مفعول غير مذكور في النص.
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: من اليهود واليونانيين
  rationale: يشمل العطف الفئتين اللتين يقرنهما التركيب τε καὶ، وصياغة العربية مع «جمع كثير» واضحة وطبيعية.
- source_word: πολὺ πλῆθος
  choice: جمع كثير
  rationale: يحفظ معنى كثرة الجماعة ولفظها الجمعي، بعبارة عربية فصيحة غير متكلفة.
theological_decisions:
- issue: دلالة πιστεῦσαι في سياق الاستجابة للكرازة
  choice: آمن
  alternative: اعتنق الإيمان؛ آمن بالرسالة
  rationale: النص يذكر استجابة اليهود واليونانيين بالفعل المطلق من غير مفعول مصرح به؛ لذلك تُحفظ صيغة «آمن» ولا تُضاف الرسالة بوصفها مفعولًا، ولا يُفسَّر الفعل بعبارة أوسع مثل «اعتنق الإيمان».
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المثنى في «دخلا» و«تكلّما» وفق السياق العربي، وحُفظ إيجاز الأصل وغموض مفعول «آمن» من غير توسع تفسيري.
