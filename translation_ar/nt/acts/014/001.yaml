  terminology: «مجمع اليهود» ترجمة أمينة لـ τὴν συναγωγὴν τῶν Ἰουδαίων، و«آمن» يحافظ على إطلاق πιστεῦσαι بلا إضافة مفعول به غير مذكور. و«اليونانيين» مقابل مناسب لـ Ἑλλήνων في هذا الموضع.
