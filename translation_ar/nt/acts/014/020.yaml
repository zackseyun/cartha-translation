base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: ar
  text: لكن بعدما اجتمع التلاميذ حوله[a]، نهض[b] ودخل المدينة. وفي اليوم التالي خرج مع برنابا إلى دِرْبَة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أحاط به التلاميذ» أو «طوَّقه التلاميذ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قام». يمكن ترجمة الكلمة اليونانية هكذا، لكن المقصود هنا على الأرجح أن بولس نهض جسديًا، لا أن العبارة تصرّح بقيامته من الموت.'
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: أحاط به
  rationale: يفيد الفعل تكوين حلقة حول شخص أو إحاطته. وهذا التعبير العربي واضح ومحايد في السياق، فلا يوحي بالعداء لأن الفاعل هو التلاميذ، ويحافظ على الصورة المكانية في اليونانية.
- source_word: δὲ
  choice: لكن
  rationale: تفيد الأداة انتقالًا مع مقابلة خفيفة لما سبق، إذ كان بولس قد رُجم وجُرّ خارج المدينة، ثم نهض على نحو مفاجئ.
- source_word: τῶν μαθητῶν
  choice: التلاميذ
  rationale: المقابل العربي المألوف والثابت لكلمة μαθητής في سفر الأعمال.
- source_word: ἀναστὰς
  choice: نهض
  rationale: يعبّر عن قيام بولس جسديًا من موضعه بعد أن تُرك كالميت، من غير أن يصرّح النص هنا بقيامة من الموت أو بإقامة معجزية.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: دخل المدينة
  rationale: صياغة عربية طبيعية ودقيقة لحركة الدخول التي يدل عليها الفعل مع حرف الاتجاه.
- source_word: τῇ ἐπαύριον
  choice: في اليوم التالي
  rationale: تؤدي دلالة العبارة الزمنية بوضوح وطبيعية في العربية المعاصرة.
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: يحافظ على المعنى الاتجاهي المباشر للفعل اليوناني، مع ورود الوجهة بعده.
- source_word: σὺν τῷ Βαρναβᾷ
  choice: مع برنابا
  rationale: ترجمة موجزة وواضحة لدلالة المصاحبة.
- source_word: Δέρβην
  choice: دِرْبَة
  rationale: نقل صوتي عربي شائع لاسم الموضع، مع ضبطه لتيسير القراءة.
theological_decisions:
- issue: هل توحي ترجمة ἀναστὰς بقيامة بولس من الموت أو بإقامته بمعجزة؟
  choice: نهض
  alternative: قام؛ أو أُقيم
  rationale: الصيغة اليونانية في ذاتها كثيرًا ما تصف النهوض الجسدي العادي. ومع أن السياق يصور تعافيًا لافتًا بعد الرجم، فإن الآية لا تصرّح بأنه قام من الموت أو أن شخصًا أقامه؛ لذلك تحافظ الترجمة على التحفظ اللاهوتي ولا تضيف ما لم يقله النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «أحاط به» للمحافظة على صورة التلاميذ المحيطين ببولس، و«نهض» لتجنب إيحاء لاهوتي زائد مع إبقاء الحدث اللافت كما يرويه السياق. أُثبتت علامتا الحاشيتين [a] و[b] في المتن.
