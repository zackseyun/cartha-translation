  text: وبعد أن تكلَّما بالكلمة في بَرْجَة[a]، نزلا إلى أَتَّالِيَة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وإذ تكلَّما بالكلمة في بَرْجَة».'
    reason: يحافظ البديل على إمكان نقل اسم الفاعل اليوناني بصياغة ظرفية أقرب إلى البنية الأصلية، مع أن معنى سبق الفعل هو الأرجح في السياق.
lexical_decisions:
- source_word: λαλήσαντες
  choice: بعد أن تكلَّما
  rationale: اسم الفاعل الماضي يدل هنا طبيعيًّا على فعل سبق الفعل الرئيس. وصيغة المثنّى تلائم بولس وبرنابا، وهما الفاعلان في السياق، من غير تقوية معنى الفعل إلى «بشَّرا» أو «ناديا».
- source_word: τὸν λόγον
  choice: بالكلمة
  rationale: تحافظ «الكلمة» على التعبير المسيحي المتكرر في سفر الأعمال عن الرسالة المعلنة، ولا تضيف «كلمة الرب» لأن «الرب» غير مذكور في النص اليوناني.
- source_word: ἐν Πέργῃ
  choice: في بَرْجَة
  rationale: حرف الجر ἐν مع اسم المدينة يُنقل طبيعيًّا بـ«في»، و«بَرْجَة» صيغة عربية واضحة لاسم Πέργη.
- source_word: κατέβησαν
  choice: نزلا
  rationale: يحفظ فعل النزول الدلالة الجغرافية المحتملة للانتقال من بَرْجَة الداخلية إلى أَتَّالِيَة الساحلية، وصيغة المثنّى يقتضيها السياق العربي.
- source_word: εἰς Ἀττάλειαν
  choice: إلى أَتَّالِيَة
  rationale: «إلى» هي المقابل العربي الطبيعي لحرف الاتجاه εἰς عند ذكر وجهة هي مدينة.
- source_word: καὶ
  choice: و
  rationale: الواو تصل هذه المرحلة بسياق الرحلة من غير إضافة ترتيب زمني أقوى مما يصرّح به النص.
