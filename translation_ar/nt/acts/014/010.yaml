  text: εἶπεν ⸀μεγάλῃ φωνῇ· Ἀνάστηθι ἐπὶ τοὺς πόδας σου ⸀ὀρθός· καὶ ⸀ἥλατο καὶ περιεπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: ar
  text: 'قال بصوت عالٍ: «قُمْ منتصبًا على قدميك!»[a] فوثب، وأخذ يمشي.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انهض مستقيمًا على قدميك!»'
    reason: بديل معجمي وتركيبي ممكن لعبارة الأمر اليونانية.
  - marker: b
    text: 'أو: «وكان يمشي». صيغة الفعل اليوناني قد تصف استمرار المشي أو ابتداءه.'
    reason: الحفاظ على الدلالة المحتملة لصيغة الماضي الناقص.
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: بصوت عالٍ
  rationale: تؤدي العبارة معنى الكيفية، وهذه صياغة عربية طبيعية تحفظ قوة النداء ووضوح سماعه.
- source_word: Ἀνάστηθι ἐπὶ τοὺς πόδας σου ὀρθός
  choice: قُمْ منتصبًا على قدميك
  rationale: تحفظ الصياغة فعل النهوض أو الوقوف، وعبارة «على قدميك»، ووصف الهيئة المستقيمة الذي يؤديه ὀρθός، مع ترتيب عربي واضح.
- source_word: ἥλατο
  choice: فوثب
  rationale: الفعل يدل على حركة قفز مفاجئة؛ و«وثب» تنقل حيوية المشهد من غير إضافة اتجاه لا يصرح به اللفظ اليوناني.
- source_word: περιεπάτει
  choice: وأخذ يمشي
  rationale: صيغة الماضي الناقص يمكن أن تُفهم على أنها تصف فعلًا مستمرًا أو بدء الفعل؛ و«أخذ يمشي» تلائم تعاقب الحدث وتُبرز ابتداء المشي مع إبقاء البديل في الحاشية.
theological_decisions:
- issue: وصف المعجزة وأمر الوقوف
  choice: نقل الأمر والاستجابة بوصفهما حدثين جسديين مباشرين من غير شرح لاهوتي زائد
  alternative: إضافة تعبيرات تفسيرية مثل «فشُفي في الحال»
  rationale: النص يورد أمرًا مباشرًا يعقبه وثوب الرجل ومشيه، لكنه لا يضيف في هذه الجملة تصريحًا تفسيريًا مستقلًا عن الشفاء؛ لذلك تُحفظ واقعية الحدث من دون توسع.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة، مع استخدام «قُمْ» للأمر المباشر و«وثب» للمشهد السردي الحي. وُضعت علامتا الحاشية بعد الموضعين اللذين تتصلان بهما مباشرة.
