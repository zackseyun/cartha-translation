base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: ar
  text: وكانوا يسمّون برنابا زيوس، وبولس هرمس، لأن بولس كان المتصدّر للكلام.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المتقدِّم في الكلام»، أو «كبير المتكلمين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: كانوا يدعون
  rationale: ينقل صيغة الماضي الناقص اليونانية، التي تفيد فعلًا مستمرًّا أو متكررًا في ذلك الموقف.
- source_word: τε
  choice: الواو في «وكانوا»
  rationale: أداة وصل خفيفة تربط العبارة بسياق السرد السابق، والواو هي المقابل العربي الطبيعي.
- source_word: Δία
  choice: زِفس
  rationale: ينقل الاسم اليوناني للإله كما ورد في النص، بدل استعمال المقابل الروماني «جوبيتر».
- source_word: Ἑρμῆν
  choice: هِرمِس
  rationale: ينقل الاسم اليوناني كما ورد في المصدر، بدل المقابل الروماني «عطارد/ميركوريوس».
- source_word: ἐπειδὴ
  choice: لأنه
  rationale: يبيّن بوضوح سبب تسمية بولس هِرمِس.
- source_word: αὐτὸς
  choice: هو المستتر في «كان»
  rationale: السياق العربي يحدد أن المرجع هو بولس، ولا تستلزم العربية إظهار ضمير منفصل قد يثقل العبارة.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: المتقدِّم في الكلام
  rationale: يحافظ على صورة التصدّر أو أخذ زمام الكلام، من غير حصر المعنى في لقب وظيفي مثل «المتحدث الرسمي».
theological_decisions:
- issue: أسماء الآلهة الوثنية
  choice: زِفس وهِرمِس في المتن
  alternative: جوبيتر وميركوريوس/عطارد
  rationale: النص اليوناني يسمّي الإلهين باسميهما اليونانيين، فإبقاؤهما يتبع أولوية لغة المصدر ولا يستبدلهما بالمقابلين الرومانيين.
- issue: دلالة ὁ ἡγούμενος τοῦ λόγου
  choice: المتقدِّم في الكلام
  alternative: كبير المتكلمين / المتحدث الرئيسي
  rationale: يحفظ التعبير احتمال كونه المتصدر للكلام أو القائم بالدور الأبرز فيه، دون زيادة معنى رتبة رسمية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت علامتا التنصيص حول الاسمين لبيان أنهما تسميتان أطلقهما الناس على برنابا وبولس، مع ضبط جزئي للأسماء المنقولة منعًا للالتباس.
