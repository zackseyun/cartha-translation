revisions:
- from: وكانوا يدعون برنابا «زِفس»، وبولس «هِرمِس»، لأنه كان المتقدِّم في الكلام.[a]
  to: وكانوا يسمّون برنابا زيوس، وبولس هرمس، لأن بولس كان المتصدّر للكلام.[a]
  rationale: التعديل يضبط فعل التسمية وفق السياق اليوناني، ويعتمد الرسم العربي الشائع للاسمين اليونانيين، ويستبدل تركيبًا أقل سلاسة بعبارة فصيحة معاصرة تحافظ على دلالة أن بولس كان صاحب الدور الأبرز في الحديث. ونُقل مرجع الضمير إلى «بولس» صراحةً للوضوح من غير تغيير في المعنى.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: صيغة الماضي الناقص في «كانوا»، والتسمية بآلهة يونانية، وسبب إسناد هرمس إلى بولس بسبب دوره الأبرز في الكلام. لكن «يدعون» أقل دقة هنا من «يسمّون»، إذ إن ἐκάλουν في السياق فعل تسمية، كما أن الصيغة العربية الشائعة والأوضح للاسم اليوناني Δία هي «زيوس».'
  naturalness: «المتقدِّم في الكلام» مفهوم لكنه غير مألوف نسبيًا في العربية المعاصرة. «المتصدّر للكلام» طبيعي وواضح، ويحافظ على دلالة أخذ الدور القيادي في الحديث دون تحويلها إلى منصب رسمي. وإظهار «بولس» في الجملة السببية يزيل أي احتمال ضعيف لالتباس مرجع الضمير، ويجسّد تمييز αὐτός له عن برنابا.
  terminology: يُستحسن اعتماد «زيوس» و«هرمس»، وهما المقابلان العربيان المألوفان للاسمين اليونانيين Zeus وHermes، لا المقابلين الرومانيين. ولا توجد هنا دلالة لاهوتية خاصة لـ λόγος؛ المراد الكلام أو الحديث.
  issues:
  - severity: medium
    issue: اختيار «يدعون» لترجمة ἐκάλουν
    rationale: الفعل العربي «يدعو» قد يفيد النداء أو الدعاء، بينما المقصود هنا أنهم كانوا يطلقون على برنابا وبولس هذين الاسمين؛ لذلك «كانوا يسمّون» أدق وأوضح.
  - severity: low
    issue: نقل Δία بـ«زِفس»
    rationale: «زيوس» هو الرسم العربي المألوف والأوضح للاسم اليوناني، ويمنع التباس النطق.
  - severity: low
    issue: «المتقدِّم في الكلام»
    rationale: التركيب مفهوم، لكن «المتصدّر للكلام» أكثر سلاسة في الفصحى المعاصرة ويعكس ὁ ἡγούμενος τοῦ λόγου بغير زيادة رتبة رسمية.
  revised_text: وكانوا يسمّون برنابا زيوس، وبولس هرمس، لأن بولس كان المتصدّر للكلام.[a]
