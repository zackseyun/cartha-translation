  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: ar
  text: لكن اليهود الذين رفضوا الإيمان[a] حرَّضوا غير اليهود، وأفسدوا مشاعر غير اليهود[b] تجاه الإخوة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عصوا» أو «كانوا غير مطيعين». يمكن أن يدل اللفظ اليوناني على رفض تصديق الرسالة وعدم الانقياد لها، وهو هنا على الأرجح يشير إلى رفض البشارة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «نفوس غير اليهود». والمراد هنا توجّههم الداخلي أو موقفهم تجاه الإخوة.'
    reason: lexical_alternative
  - marker: c
    text: يرجَّح أن «الإخوة» هنا اسم جماعي للمؤمنين، وقد يشمل النساء أيضًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: رفضوا الإيمان
  rationale: يدل الفعل في هذا السياق التبشيري على عدم الانقياد للرسالة ورفض تصديقها، لا على العصيان العام فحسب. وتحفظ الصياغة عنصر الرفض الإرادي من غير أن تضيف مفعولًا غير مذكور صراحة.
- source_word: Ἰουδαῖοι
  choice: اليهود
  rationale: ترجمة مباشرة، والسياق يقصرها على اليهود المعارضين في ذلك الموضع، لا على جميع اليهود.
- source_word: ἐπήγειραν
  choice: حرَّضوا
  rationale: ينقل المعنى السببي، أي إثارة الآخرين ودفعهم إلى موقف عدائي.
- source_word: ἐκάκωσαν
  choice: أفسدوا
  rationale: مع «النفوس» ومتمم «تجاه الإخوة»، يدل الفعل على إفساد النزعة الداخلية وجعلها معادية، لا على إيقاع أذى جسدي مباشر.
- source_word: τὰς ψυχὰς
  choice: نفوسهم
  rationale: يحافظ على صورة الأصل، مع إيضاح في الحاشية أن المراد هنا الموقف الداخلي أو التوجّه.
- source_word: τῶν ἐθνῶν
  choice: غير اليهود
  rationale: في سياق المقابلة بين اليهود والأمم، المراد الأقوام الذين ليسوا يهودًا. وهذه الصياغة أوضح للقارئ العربي المعاصر من «الأمم» المحتملة الدلالة.
- source_word: κατὰ τῶν ἀδελφῶν
  choice: تجاه الإخوة
  rationale: تحفظ لفظ القرابة الجماعي في الأصل، وتعبّر «تجاه» طبيعيًا عن توجيه العداء ضدهم؛ وتوضح الحاشية أن الاستعمال قد يشمل المؤمنات أيضًا.
theological_decisions:
- issue: دلالة ἀπειθήσαντες بين عدم الإيمان والعصيان
  choice: رفضوا الإيمان
  alternative: عصوا / كانوا غير مطيعين
  rationale: السياق هو الاستجابة للرسالة الرسولية، والفعل يجمع بين عدم التصديق وعدم الانقياد. اختيرت صياغة تُبرز رفض الإيمان مع إبقاء البديل الأشد حرفية في الحاشية.
- issue: شمول لفظ ἀδελφῶν لجماعة المؤمنين
  choice: الإخوة
  alternative: الإخوة والأخوات / المؤمنون
  rationale: يحافظ المتن على الجمع المذكر الوارد في اليونانية، بينما توضّح الحاشية أن الاستعمال الجماعي يُحتمل أن يشمل الرجال والنساء من المؤمنين.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُعمل «غير اليهود» بدل «الأمم» لتجنب الغموض، وحُفظت صورة «النفوس» في المتن مع شرح دلالتها السياقية في الحاشية.
