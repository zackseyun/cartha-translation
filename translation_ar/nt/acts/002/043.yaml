lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: كان الخوف يحلّ
  rationale: ينقل صيغة الماضي الناقص بوصفها حالة كانت تنشأ وتستمر، ويأتي بتعبير عربي طبيعي دون اختزالها إلى مجرد وجود الخوف.
- source_word: δὲ
  choice: الواو في «وكان»
  rationale: تفيد هنا مواصلة السرد لا التضاد، والواو أنسب لذلك في العربية.
- source_word: πάσῃ ψυχῇ
  choice: بكل نفس
  rationale: يحافظ على الصورة اليونانية الحرفية «كل نفس» وعلى نبرتها المهيبة، مع بقاء معنى «الجميع» واضحًا من السياق.
- source_word: φόβος
  choice: الخوف
  rationale: هو المقابل المباشر الذي يصون مجال اللفظة بين الخوف والهيبة، بدل حسمها تفسيريًا في معنى الهيبة وحدها.
- source_word: πολλά
  choice: كثيرة
  rationale: مقابل عربي طبيعي ودقيق للدلالة الكمية.
- source_word: τέρατα
  choice: عجائب
  rationale: يبرز ما في الأعمال من إدهاش، ويحافظ على تمييزها من «الآيات» ضمن العبارة المزدوجة.
- source_word: σημεῖα
  choice: آيات
  rationale: ينقل وظيفة الأعمال بوصفها دلائل ذات مغزى، وهو تعبير كتابي عربي واضح ومألوف.
- source_word: διὰ τῶν ἀποστόλων
  choice: على أيدي الرسل
  rationale: تعبير عربي طبيعي عن الوساطة والأداة، فيُبقي الرسل وسائط للعمل ولا يجعلهم بالضرورة مصدره النهائي.
- source_word: ἐγίνετο
  choice: كانت ... تُجرى
  rationale: ينقل الماضي الناقص بوصفه أفعالًا متكررة أو مستمرة الوقوع، وتناسب صيغة المبني للمجهول معنى الوساطة في العبارة التالية.
theological_decisions:
- issue: دلالة φόβος استجابةً للآيات الرسولية
  choice: الخوف
  alternative: الهيبة أو الخشية الموقرة
  rationale: يحافظ «الخوف» على القوة المعجمية وعلى التوتر بين الرهبة والخشية، بينما يوضح الهامش إمكان معنى الهيبة دون فرضه على المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية مهيبة. حوفظ على «كل نفس» في المتن لصون الصورة الأصلية، وأُثبت البديل الاصطلاحي في الهامش. واستُخدم «على أيدي الرسل» بوصفه تعبيرًا عربيًا طبيعيًا للوساطة.
