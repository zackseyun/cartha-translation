  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: ar
  text: وكان الخوف يحلّ بكل نفس[a]، وكانت عجائب وآيات كثيرة تُجرى على أيدي الرسل.
