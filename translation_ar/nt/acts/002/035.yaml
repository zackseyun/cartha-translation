translation:
  language: ar
  text: إلى أن أجعل أعداءك موطئًا لقدميك[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحرفية أكثر: «إلى أن أضع أعداءك موطئًا لقدميك».'
