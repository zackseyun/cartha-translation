  - marker: b
    text: يقتبس هذا القول من مزمور 110:1، وهو نص ملكي ذو دلالة مسيانية عن الجلوس على العرش.
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: إلى أن
  rationale: تؤدي معنى الغاية الزمنية المتجهة إلى نقطة مستقبلية بعبارة عربية طبيعية وموجزة.
- source_word: θῶ
  choice: أجعل
  rationale: الفعل من τίθημι يعني أصلًا «أضع»، لكن وجود «موطئًا» خبرًا للمفعول يجعل «أجعل» أوفق بالسياق والتركيب العربي.
- source_word: τοὺς ἐχθρούς σου
  choice: أعداءك
  rationale: ترجمة مباشرة تحفظ دلالة العداوة الشخصية والمعارضة الملكية في الاقتباس.
- source_word: ὑποπόδιον
  choice: موطئًا
  rationale: «موطئ» تعبير عربي واضح لما توضع عليه القدمان، ويحفظ صورة إخضاع الأعداء دون تحويلها إلى شرح تفسيري.
- source_word: τῶν ποδῶν σου
  choice: لقدميك
  rationale: اللام طبيعية في العربية مع «موطئ»، وتنقل علاقة الإضافة في العبارة اليونانية من غير زيادة تفسيرية.
theological_decisions:
- issue: صورة إخضاع الأعداء في اقتباس مزمور 110:1
  choice: 'الإبقاء على الصورة الحسية: «موطئًا لقدميك»'
  alternative: إلى أن أُخضع أعداءك تمامًا تحت قدميك
  rationale: النص يستحضر قولًا ملكيًا ذا دلالة مسيانية؛ والإبقاء على الاستعارة يحفظ الصلة النصية وقوتها اللاهوتية، ولا يستبدل الصورة الأصلية بتفسيرها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «موطئًا لقدميك» للمحافظة على الاستعارة الملكية الملموسة مع تجنب صياغة شديدة الحرفية أو شرح معنى الإخضاع داخل المتن.
