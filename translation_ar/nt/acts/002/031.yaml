  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: ar
  text: 'وإذ رأى ذلك مسبقًا[a]، تكلَّم عن قيامة المسيح[b]: إنه لم يُترَك في الهاوية[c]، ولم يرَ جسده فسادًا[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«ذلك» مضافة من السياق؛ ويمكن ترجمة العبارة: «وإذ سبق فرأى».'
    reason: توضيح إضافة سياقية وبديل لفظي
  - marker: b
    text: 'اليونانية: «خريستوس»، أي «المسيح» أو «الممسوح»؛ واللقب هو البارز هنا في استدلال بطرس بالكتاب.'
    reason: توضيح لقب مسياني
  - marker: c
    text: 'أو: «لم يُترَك للهاوية». و«الهاوية» هنا عالم الموتى، لا موضع الدينونة النهائية على وجه التحديد.'
    reason: بديل لغوي وتوضيح ثقافي لاهوتي
  - marker: d
    text: 'أو: «تحلُّلًا». والعبارة اليونانية حرفيًا: «يرى فسادًا».'
    reason: بديل معجمي
lexical_decisions:
- source_word: προϊδὼν
  choice: وإذ رأى ذلك مسبقًا
  rationale: ينقل معنى الرؤية السابقة زمنيًا بالنسبة إلى التكلّم. أُضيف اسم الإشارة «ذلك» اعتمادًا على السياق ليكون التعبير عربيًا طبيعيًا.
- source_word: ἐλάλησεν
  choice: تكلَّم
  rationale: يحافظ على معنى فعل الكلام، ويلائم سياق تفسير داود للنص النبوي.
- source_word: περὶ τῆς ἀναστάσεως
  choice: عن قيامة
  rationale: ترجمة طبيعية ودقيقة لحرف الجر περί مع المضاف إليه، مع إبقاء «القيامة» بوصفها الحدث المقصود.
- source_word: τοῦ χριστοῦ
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، ويحفظ دلالته على الممسوح المنتظر في حجة بطرس الكتابية.
- source_word: οὔτε ἐγκατελείφθη
  choice: لم يُترَك
  rationale: الفعل المبني للمجهول يفيد عدم الترك أو الهجر. «لم يُترَك» واضح وطبيعي، ولا يبالغ في تحديد طبيعة الترك.
- source_word: εἰς ᾅδην
  choice: في الهاوية
  rationale: «الهاوية» تنقل اسم عالم الموتى من غير مساواته بالمكان النهائي للدينونة. ومع فعل «يُترك» يمكن أن تؤدي εἰς معنى البقاء في ذلك الموضع؛ وتُذكر الصياغة الأقرب حرفيًا في الحاشية.
- source_word: ἡ σὰρξ αὐτοῦ
  choice: جسده
  rationale: السياق يتحدث عن الكيان الجسدي المعرض للتحلل. «جسده» أوضح في العربية الحديثة من «لحمه» ولا يحمل إيحاءً أخلاقيًا أو مجازيًا.
- source_word: εἶδεν διαφθοράν
  choice: يرَ جسده فسادًا
  rationale: يحافظ على الصورة اليونانية «يرى فسادًا»، مع استعمال «فساد» للدلالة على التحلل الجسدي.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: السياق يبرز اللقب المسياني في الاستدلال بالكتاب، و«المسيح» هو التعبير العربي المألوف الذي يحفظ هذه الدلالة.
- issue: دلالة ᾅδης
  choice: الهاوية
  alternative: عالم الموتى
  rationale: تحفظ «الهاوية» المصطلح المميز لعالم الموتى، وتتجنب الخلط بينه وبين موضع الدينونة النهائية؛ وتوضح الحاشية المقصود.
- issue: دلالة σάρξ في سياق القيامة
  choice: جسده
  alternative: لحمه
  rationale: المعنى هنا جسدي حرفي لا أخلاقي ولا مجازي. اختير «جسده» لأنه عربي طبيعي ويعبّر بوضوح عن الجسد المادي الذي لم يتحلل.
- issue: العلاقة التي تعبّر عنها εἰς مع فعل الترك
  choice: في الهاوية
  alternative: للهاوية
  rationale: يحتمل التركيب معنى عدم بقائه متروكًا في عالم الموتى، بينما تحافظ الصياغة البديلة على الاتجاه الذي يدل عليه حرف الجر على نحو أقرب إلى اللفظ. أُبقي هذا الاحتمال في الحاشية بدل حسمه بصمت.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حوفظ على الصورة «يرى فسادًا» وعلى التوتر الدلالي في εἰς ᾅδην، مع تجنب ألفاظ قد تساوي الهاوية بجهنم أو بالدينونة النهائية.
