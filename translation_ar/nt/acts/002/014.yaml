language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: ar
  text: 'أما بطرس فوقف مع الأحد عشر، ورفع صوته[a] وخاطبهم قائلًا: «يا رجال اليهودية، ويا جميع الساكنين في أورشليم، ليكن هذا معلومًا لديكم، وأصغوا إلى كلماتي[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أعلى صوته».
    reason: بديل لفظي للعبارة اليونانية الاصطلاحية.
  - marker: b
    text: 'حرفيًا: «أعيروا أسماعكم لكلماتي».'
    reason: يبين الصورة اللفظية في فعل الأمر اليوناني الدال على الإصغاء المتنبه.
lexical_decisions:
- source_word: Σταθεὶς
  choice: فوقف
  rationale: اسم فاعل ظرفي في صيغة الماضي يهيئ مشهد الخطاب؛ وصيغة «فوقف» طبيعية في العربية وتحافظ على الفعل من غير إطالة.
- source_word: δὲ
  choice: أما
  rationale: تفيد الانتقال المقابل لاستهزاء المذكورين في الآية السابقة، و«أما بطرس» تؤدي هذا التحول الخطابي بوضوح.
- source_word: σὺν τοῖς ἕνδεκα
  choice: مع الأحد عشر
  rationale: تنقل معنى المصاحبة مباشرة وبإيجاز.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: رفع صوته
  rationale: تعبير عربي مألوف ينقل العبارة الاصطلاحية الدالة على الكلام بصوت مرتفع أمام الجمهور.
- source_word: ἀπεφθέγξατο
  choice: خاطبهم قائلًا
  rationale: ينقل فعل النطق العلني الواضح والمقصود، من غير أن يضيف إلى الفعل وحده دلالة صريحة على الوحي أو النبوة.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: يا رجال اليهود
  rationale: يحافظ على النداء المذكر الصريح ἄνδρες، ويفهم Ἰουδαῖοι هنا بوصفه تحديدًا للهوية اليهودية؛ وهو تعبير أوضح في العربية من «رجال اليهودية» المحتمل فهمه جغرافيًا فقط.
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: يا جميع الساكنين في أورشليم
  rationale: يحافظ على شمول πάντες وعلى معنى الإقامة المستمرة في κατοικοῦντες، مع تكرار أداة النداء لتستقيم العبارة العربية.
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: ليكن هذا معلومًا لديكم
  rationale: يحافظ على الصيغة الأمرية الرسمية وعلى قوة الإعلان في التركيب اليوناني.
- source_word: ἐνωτίσασθε
  choice: أصغوا
  rationale: فعل أمر يدل على الاستماع بانتباه، وهو أقوى من مجرد «اسمعوا» وطبيعي في العربية الفصحى المعاصرة.
- source_word: τὰ ῥήματά μου
  choice: كلماتي
  rationale: مقابل مباشر للأقوال المنطوقة، من غير توسيع تفسيري إلى «رسالتي».
theological_decisions:
- issue: دلالة Ἄνδρες من جهة الجنس
  choice: يا رجال اليهود
  alternative: يا أيها اليهود؛ يا أهل اليهودية
  rationale: الاسم اليوناني ἄνδρες مذكر صريح، لذلك حُفظت دلالته بدل تحييده، من غير استنتاج لاهوتي يتجاوز المخاطبين في السياق.
- issue: هل يُصرَّح في ترجمة ἀπεφθέγξατο بأن الكلام موحى به أو نبوي
  choice: خاطبهم قائلًا
  alternative: نطق بوحي؛ أعلن لهم
  rationale: قد يستعمل الفعل للكلام الجليل أو المعلن، لكن الفعل في هذه الآية لا يصرح وحده بالوحي؛ لذلك حُفظت وظيفة الخطاب العلني من غير إضافة تفسير لاهوتي.
- issue: هوية المخاطبين في Ἰουδαῖοι
  choice: اليهود
  alternative: أهل اليهودية
  rationale: اللفظة قد تحمل بعدًا إثنيًا أو جغرافيًا بحسب السياق. اختيرت الهوية اليهودية لأنها الأنسب لخطاب جمهور أورشليم هنا، مع عدم تحويلها إلى تسمية طائفية حديثة.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة خطابية مهيبة من غير تراكيب عتيقة ثقيلة. استُعملت «أورشليم» حفاظًا على الاسم الكتابي المألوف، ووضعت علامات الحواشي عند الألفاظ التي تشرحها مباشرة.
