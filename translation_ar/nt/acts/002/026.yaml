  source_fidelity: 'النص يطابق البنية اليونانية ومعانيها الأساسية بدقة جيدة: «لهذا» سببية، والقلب واللسان محفوظان، و«جسدي» مناسب لـ σάρξ في هذا السياق الحرفي، و«سيسكن» يحفظ صورة κατασκηνώσει دون اختزالها إلى الراحة. لكن «على رجاء» أقل سلاسة في العربية الفصحى المعاصرة وقد توحي بتعلّق مكاني غير مألوف؛ «في رجاء» تؤدي مجال/حالة الرجاء في ἐπ’ ἐλπίδι بصورة طبيعية من دون إضافة تفسيرية.'
