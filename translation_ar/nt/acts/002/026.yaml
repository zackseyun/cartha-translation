  terminology: «جسدي» اختيار عربي سليم لـ σάρξ هنا، إذ المقصود الوجود الجسدي لا الدلالة الأخلاقية لـ«الجسد/الطبيعة الخاطئة»، و«لحمي» غير طبيعي في هذا الموضع. و«لساني» يحافظ على الصورة الشعرية الأصلية.
  issues:
