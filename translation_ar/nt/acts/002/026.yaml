  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: ar
  text: لِهٰذَا فَرِحَ قَلْبِي، وَابْتَهَجَ لِسَانِي، وَفَوْقَ ذٰلِكَ، سَيَسْكُنُ جَسَدِي أَيْضًا فِي رَجَاءٍ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيستريح جسدي في رجاء».'
    reason: بديل معجمي للفعل κατασκηνώσει يعبّر عن الفهم السياقي الشائع، مع أن معناه التصويري الأقرب هو السكن أو الإقامة.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لِهٰذَا
  rationale: تنقل السبب أو الأساس بإيجاز طبيعي، مع بقاء الصلة بما سبق واضحة.
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: فَرِحَ قَلْبِي
  rationale: صياغة عربية طبيعية تحفظ صورة القلب بوصفه مركز الإنسان الباطن، وتؤدي المبني للمجهول اليوناني هنا بمعناه اللازم.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: ابْتَهَجَ لِسَانِي
  rationale: تحفظ اللفظ الصريح «لساني» والتوازي الشعري، وتعبّر «ابتهج» عن الفرح الغامر.
- source_word: ἔτι δὲ καὶ
  choice: وَفَوْقَ ذٰلِكَ ... أَيْضًا
  rationale: تنقل الاستمرار والتوكيد معًا بأسلوب عربي واضح.
- source_word: ἡ σάρξ μου
  choice: جَسَدِي
  rationale: في هذا السياق الأنثروبولوجي المتعلق بالموت والرجاء، تشير σάρξ إلى الوجود الجسدي؛ و«جسدي» أوضح للقارئ العربي من «لحمي» التي قد توحي بالأنسجة وحدها.
- source_word: κατασκηνώσει
  choice: سَيَسْكُنُ
  rationale: تحفظ صورة الإقامة أو الحلول دون تضييقها إلى مجرد الراحة.
- source_word: ἐπ’ ἐλπίδι
  choice: عَلَى رَجَاءٍ
  rationale: تحفظ دلالة ἐπί على الأساس أو الاستناد، كما تحافظ على الصياغة الشعرية بدل إضافة تفسير مثل «واثق».
theological_decisions:
- issue: دلالة σάρξ في اقتباس يقع ضمن سياق القيامة
  choice: جَسَدِي
  alternative: لَحْمِي
  rationale: اللفظ هنا أنثروبولوجي حرفي لا أخلاقي، و«جسدي» يعبّر في العربية الحالية عن الإنسان في وجوده الجسدي من غير إيحاء بمفهوم «الطبيعة الخاطئة».
- issue: دلالة κατασκηνώσει ἐπ’ ἐλπίδι
  choice: سَيَسْكُنُ ... عَلَى رَجَاءٍ
  alternative: سَيَسْتَرِيحُ ... عَلَى رَجَاءٍ
  rationale: يحفظ الاختيار صورة السكن الآمن ولا يحسمها إلى «الراحة»، كما يترك دلالة القيامة للسياق بدل إدخالها صراحة في الآية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة، مع الحفاظ على التوازي الشعري وصور «القلب» و«اللسان» و«السكن». استُخدم الضبط الجزئي لتسهيل القراءة، ووُضعت علامة الحاشية في نهاية العبارة التي تتناولها.
