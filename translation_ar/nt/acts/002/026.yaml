  to: لِهٰذَا فَرِحَ قَلْبِي، وَابْتَهَجَ لِسَانِي، وَفَوْقَ ذٰلِكَ، سَيَسْكُنُ جَسَدِي أَيْضًا فِي رَجَاءٍ[a].
