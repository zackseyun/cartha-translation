  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: ar
  text: 'فَدَاوُدُ لَمْ يَصْعَدْ إِلَى السَّمَاوَاتِ، لَكِنَّهُ هُوَ نَفْسُهُ يَقُولُ: «قَالَ الرَّبُّ لِرَبِّي: اجْلِسْ عَنْ يَمِينِي».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'مزمور 110:1. في النص العبري، تمثّل كلمة «الرَّبّ» الأولى الاسم الإلهي «يهوه»؛ وقارن: «قال يهوه لربي».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: يَصْعَدْ
  rationale: ينقل فعل الصعود إلى السماوات بلفظ عربي واضح ذي صدى كتابي، مع الحفاظ على النفي والزمن الماضي بواسطة «لم».
- source_word: τοὺς οὐρανούς
  choice: السَّمَاوَاتِ
  rationale: يحافظ على صيغة الجمع في اليونانية وعلى الأسلوب الكتابي العربي المألوف.
- source_word: λέγει δὲ αὐτός
  choice: بَلْ هُوَ نَفْسُهُ يَقُولُ
  rationale: «بل» تُظهر المقابلة مع الجملة السابقة، و«هو نفسه» تحفظ توكيد αὐτός، والمضارع «يقول» يحافظ على زمن النص اليوناني عند تقديم الاقتباس.
- source_word: ὁ κύριος
  choice: الرَّبُّ
  rationale: ينقل κύριος وفق معناه المعتاد في النص اليوناني، بينما توضّح الحاشية أن الأصل العبري في المزمور يستعمل الاسم الإلهي في الموضع الأول.
- source_word: τῷ κυρίῳ μου
  choice: لِرَبِّي
  rationale: يحافظ على تكرار κύριος وعلى التمييز الذي يصنعه ضمير المتكلم، من غير استبداله بتفسير مثل «سيدي» أو «مولاي» يحسم دلالته.
- source_word: Κάθου
  choice: اجْلِسْ
  rationale: صيغة أمر عربية مباشرة وطبيعية تقابل الأمر اليوناني.
- source_word: ἐκ δεξιῶν μου
  choice: عَنْ يَمِينِي
  rationale: تعبير عربي كتابي راسخ يدل على موضع الكرامة والسلطان، وينقل المعنى الاصطلاحي للعبارة اليونانية.
theological_decisions:
- issue: ترجمة موضعي κύριος في اقتباس مزمور 110:1
  choice: «قال الرب لربي» في المتن
  alternative: «قال يهوه لربي» أو إبراز الاسم الإلهي في الموضع الأول
  rationale: النص اليوناني المعتمد يستعمل κύριος في الموضعين، لذلك يحافظ المتن على «الرب» في كليهما وعلى التوتر الدلالي في الاقتباس. وتُذكر خلفية الاسم الإلهي في النص العبري بالحاشية بدل إدخالها في المتن اليوناني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة، مع ضبطٍ كامل للنص لتسهيل القراءة. حُفظ جمع «السماوات»، وتوكيد «هو نفسه»، والتكرار المقصود لكلمة «الرب». وُضعت علامة الحاشية بعد الاقتباس لأنها تتعلق بمصدره وصياغته العبرية.
