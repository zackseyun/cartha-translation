  text: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται, καὶ οἱ κατοικοῦντες τὴν Μεσοποταμίαν, Ἰουδαίαν τε καὶ Καππαδοκίαν, Πόντον καὶ τὴν Ἀσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: ar
  text: الفَرْثِيُّون والماديون والعيلاميون، والساكنون في ما بين النهرين، وفي اليهودية وكَبَّادُوكِيَّة[a]، وفي بُنْطُس وآسِيَّا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن نقل العبارة اليونانية τε καί ببساطة إلى «و»، وقد تحمل أيضًا إيحاءً إضافيًّا خفيفًا، نحو: «وكذلك».'
    reason: lexical_alternative
  - marker: b
    text: المقصود مقاطعة آسيا الرومانية في غربي آسيا الصغرى، لا قارة آسيا بمفهومها الحديث.
    reason: cultural_note
lexical_decisions:
- source_word: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται
  choice: الفَرْثِيُّون والماديون والعيلاميون
  rationale: استُخدمت الأسماء العربية المألوفة لهذه الشعوب، مع الحفاظ على تتابع القائمة وعطف عناصرها.
- source_word: οἱ κατοικοῦντες
  choice: الساكنون في
  rationale: اسم الفاعل المعرَّف في اليونانية يدل على المقيمين في الأماكن المذكورة؛ و«الساكنون في» صياغة عربية واضحة تحافظ على بنيته.
- source_word: τὴν Μεσοποταμίαν
  choice: ما بين النهرين
  rationale: الاسم الجغرافي العربي الشائع لمنطقة مسوبوتاميا.
- source_word: Ἰουδαίαν τε καὶ Καππαδοκίαν
  choice: وفي اليهودية وكَبَّادُوكِيَّة
  rationale: حُفظ الاسمان الجغرافيان، وأُعيد حرف الجر في العربية لتوضيح أن السكن يشمل المناطق المذكورة، بينما نُقل τε καί بعطف طبيعي دون إثقال العبارة.
- source_word: Πόντον καὶ τὴν Ἀσίαν
  choice: وفي بُنْطُس وآسِيَّا
  rationale: نُقلت الأسماء الجغرافية بصيغها العربية المعروفة، مع إبقاء «آسيا» في المتن وشرح مدلولها التاريخي في الحاشية.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة، بنبرة وقورة. تكرار «في» يزيل التباس تعلّق أسماء المناطق بفعل السكن، من غير تغيير مضمون القائمة اليونانية.
