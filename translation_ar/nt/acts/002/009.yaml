  source_fidelity: ينقل النص قائمة الشعوب والمناطق كما في اليونانية، ويحافظ على كون «الساكنون» وصفًا للمقيمين في ما بين النهرين والمناطق اللاحقة. وتكرار حرف الجر «في» أسلوب عربي مشروع يوضح تعلّق السكن بكل المناطق من دون إضافة معنى.
  naturalness: الصياغة فصيحة واضحة ومناسبة لقائمة جغرافية. الأسماء المستعملة («الفرثيون»، «الماديون»، «العيلاميون»، «ما بين النهرين»، «كبادوكية»، «بنطس») مألوفة في العربية المعاصرة ذات السجل الكتابي/التاريخي.
  terminology: المصطلحات والأعلام الجغرافية والإثنية دقيقة. تُركت «آسيا» في المتن بوصفها الاسم التاريخي، وقيّدتها الحاشية تقييدًا صحيحًا بالمقاطعة الرومانية، لا بالقارة الحديثة. وحاشية τε καί موضوعة عند موضعها وتعبّر عن نطاقها الدلالي من غير تحميل النص معنى زائدًا.
