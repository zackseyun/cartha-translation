  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: ar
  text: 'لِأَنَّ دَاوُدَ يَقُولُ عَنْهُ: «كُنْتُ أَرَى الرَّبَّ[b] أَمَامِي دَائِمًا[a]، لِأَنَّهُ عَنْ يَمِينِي، لِكَيْ لَا أَتَزَعْزَعَ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كنت أرى الرب مسبقًا أمامي دائمًا». قد يحمل الفعل اليوناني في بعض السياقات معنى الرؤية المسبقة، لكن العبارات المحيطة هنا ترجّح معنى إبقاء الرب أمام النظر باستمرار.'
    reason: lexical_alternative
  - marker: b
    text: يقتبس بطرس هنا مزمور 16:‏8. وفي النص العبري للمزمور يَرِد الاسم الإلهي الذي يُنقل عادةً إلى العربية بلفظ «الرَّبّ».
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: يقول عنه
  rationale: تأتي εἰς αὐτόν هنا بمعنى الكلام في شأن شخص، لا توجيه الكلام إليه مباشرة.
- source_word: Προορώμην
  choice: كنت أرى
  rationale: يحفظ هذا التعبير دلالة الماضي الناقص على الاستمرار، بينما يوضح «دائمًا» استمرار الفعل؛ ويظل معنى الاستباق في الرؤية احتمالًا معجميًا مذكورًا في الحاشية.
- source_word: κύριον
  choice: الرَّبَّ
  rationale: نقل مباشر للفظ κύριον من دون تعيين مرجعه تعيينًا تفسيريًا.
- source_word: ἐνώπιόν μου
  choice: أمامي
  rationale: تعبير عربي طبيعي يحفظ الصورة المكانية العلاقية في النص.
- source_word: διὰ παντός
  choice: دائمًا
  rationale: ينقل معنى الاستمرار والدوام بعبارة عربية واضحة.
- source_word: ἐκ δεξιῶν μού
  choice: عن يميني
  rationale: تعبير عربي فصيح مألوف للموقع عند الجانب الأيمن، بما قد يوحي بالمساندة من غير إدخالها صراحة في المتن.
- source_word: ἵνα μὴ σαλευθῶ
  choice: فلا أتزعزع
  rationale: ينقل صورة فقدان الثبات بصياغة عربية طبيعية، مع إبقاء العلاقة الغائية أو الناتجة التي تحتملها ἵνα في السياق.
theological_decisions:
- issue: مرجع «الرَّبّ» في اقتباس المزمور كما يستخدمه بطرس
  choice: الإبقاء على «الرَّبّ» من دون مزيد من التحديد في المتن
  alternative: «يهوه» أو «المسيح»
  rationale: يطبّق بطرس المزمور تطبيقًا مسيانيًا، لكن نص الاقتباس اليوناني نفسه يقول κύριον؛ لذلك ينبغي عدم حسم التوتر التفسيري باستبدال اللفظ باسم أو هوية تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت «كنت أرى» مع «دائمًا» للجمع بين طبيعية الأسلوب ودلالة الاستمرار، وأُبقي «الرَّبّ» بلا تفسير مذهبي. وُضعت علامتا الحاشيتين في المتن، الأولى عند موضع البديل المعجمي والثانية في ختام الاقتباس للإحالة إلى مصدره.
