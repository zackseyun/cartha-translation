    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: تترك
  rationale: ينقل معنى التخلي عن شخص وتركه في موضع أو حال، وهو تعبير عربي طبيعي في هذا السياق.
- source_word: τὴν ψυχήν μου
  choice: نفسي
  rationale: تحفظ اللفظ الأنثروبولوجي في اقتباس المزمور، مع بقاء إمكان فهمه بمعنى حياتي أو ذاتي من غير فرض تصور تقني عن حالة ما بعد الموت.
- source_word: εἰς ᾅδην
  choice: في الهاوية
  rationale: «الهاوية» مصطلح عربي كتابي واضح نسبيًا لمقر الموتى، ويتجنب الخلط بـ«جهنم». ومع فعل «تترك» تبدو «في» طبيعية عربيًا، مع أن εἰς تفيد في أصلها الاتجاه أو الامتداد إلى الموضع.
- source_word: δώσεις ... ἰδεῖν
  choice: تدع ... يرى
  rationale: الفعل «تعطي» مع المصدر يفيد الإذن أو السماح؛ و«تدع ... يرى» تؤدي هذا الاصطلاح بوضوح وطبيعية.
- source_word: τὸν ὅσιόν σου
  choice: تقيَّك
  rationale: ὅσιος يدل على من يتصف بالتقوى والولاء لله. «تقيّك» يحفظ هذا المعنى ولا يحسم اللفظ في معنى «القدوس» وحده، بينما يوضح السياق تطبيقه على المسيح.
- source_word: διαφθοράν
  choice: الفساد
  rationale: يحفظ التعبير الكتابي المألوف، ويشير في السياق إلى فساد الجسد وتحلله لا إلى الفساد الأخلاقي؛ وقد وُضّح ذلك في الحاشية.
theological_decisions:
- issue: ترجمة ᾅδης في سياق القيامة
  choice: الهاوية
  alternative: مثوى الأموات؛ شيول؛ القبر
  rationale: تحفظ الإشارة إلى عالم الأموات في النص اليوناني، من غير استيراد دلالة «جهنم» أو اختزال المعنى في القبر وحده. وتذكر الحاشية «شيول» بوصفها خلفية النص العبري المقتبس.
- issue: دلالة τὸν ὅσιόν σου وتطبيقها المسياني
  choice: تقيَّك
  alternative: قدوسك؛ وليَّك الأمين
  rationale: يحفظ «تقيّك» المجال الدلالي المتصل بالتقوى والوفاء لله، فيما يحدد سياق أعمال الرسل مرجعه المسيحاني من غير أن تضيف الترجمة لقبًا يتجاوز ضرورة اللفظ اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «الهاوية» بدل «الجحيم» لتجنب إيحاءات عقابية لا يقتضيها ᾅδης هنا، ووُزعت علامات الحواشي بحسب الكلمات التي تشرحها.
