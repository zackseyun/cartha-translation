base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: ar
  text: لأنك لن تترك نفسي في الهاوية[a]، ولن تدع تقيَّك[b] يرى الفساد[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في شيول»، بحسب النص العبري الذي يقتبس منه هذا القول؛ أما اليونانية هنا ففيها «الهاوية».
