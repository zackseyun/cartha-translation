  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: ar
  text: الذي أقامه الله، إذ فكَّ أوجاع الموت[a]، لأنه لم يكن ممكنًا أن يمسكه الموت[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أوجاع ولادة الموت» أو «مخاض الموت»؛ فاللفظة اليونانية تُستعمل لأوجاع الولادة، وقد تحمل العبارة هذه الصورة أيضًا.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أن يُمسَك به من قِبَله»؛ والضمير يعود في الأرجح إلى الموت، أي: أن يمسكه الموت.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: الذي
  rationale: اسم موصول يعود إلى يسوع المذكور في الآية السابقة، ويحافظ على ارتباط الجملة بما قبلها.
- source_word: ἀνέστησεν
  choice: أقامه
  rationale: يفيد هنا أن الله أقام يسوع من بين الأموات، وصيغة «أقامه» طبيعية وراسخة من غير تحويل الفعل إلى مصطلح لاهوتي مجرد.
- source_word: λύσας
  choice: ففكَّ
  rationale: يحفظ الصورة الحسية في الفعل، أي الحلّ أو الفكّ والإطلاق، مع ربط الفعل المصاحب بالفعل الرئيس ربطًا عربيًا طبيعيًا.
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: أوجاع الموت
  rationale: يمكن أن تدل ὠδῖνας على أوجاع شديدة أو أوجاع الولادة. اختيرت «أوجاع الموت» في المتن لوضوحها، مع حفظ معنى أوجاع الولادة في الحاشية.
- source_word: καθότι
  choice: لأنه
  rationale: تقدّم سبب إقامة الله له، وهي صياغة عربية واضحة ومباشرة.
- source_word: οὐκ ἦν δυνατὸν
  choice: لم يكن ممكنًا
  rationale: تحافظ على البناء غير الشخصي والنبرة التفسيرية في اليونانية.
- source_word: κρατεῖσθαι
  choice: أن يظلَّ في قبضة
  rationale: ينقل معنى الإمساك والإبقاء تحت السيطرة، ويجعل صورة سلطان الموت مفهومة بالعربية المعاصرة.
- source_word: ὑπ’ αὐτοῦ
  choice: الموت
  rationale: يعود الضمير في الأرجح إلى الموت. صُرّح بالمرجع في المتن لأن ترجمة الضمير حرفيًا إلى العربية توهم عودته إلى شخص آخر، مع بيان الحرفية في الحاشية.
theological_decisions:
- issue: مرجع الضمير في ὑπ’ αὐτοῦ
  choice: الموت
  alternative: به/من قِبَله، مع احتمال نحوي بعيد لمرجع مذكّر آخر
  rationale: أقرب مرجع متماسك هو «الموت»، والجملة تشرح أن الموت لم يستطع إبقاء يسوع في قبضته. صُرّح بالمرجع لتحقيق الوضوح من غير إضافة دعوى تتجاوز السياق.
- issue: دلالة ὠδῖνας
  choice: أوجاع
  alternative: أوجاع الولادة / المخاض
  rationale: اللفظة قد تعني أوجاع الولادة خصوصًا، وقد تستعمل للأوجاع الشديدة. يحفظ المتن المعنى السياقي الأوسع، وتوثّق الحاشية الصورة الممكنة بدل حسمها بصمت.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ومهيبة. استُخدمت «في قبضة الموت» لتجنب غموض الضمير المذكر في العربية مع إبقاء صورة الإمساك والسلطان، ووُثّقت الصيغة الأقرب إلى الحرفية في الحاشية.
