  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: ar
  text: فكيف يسمع كلُّ واحدٍ منا بلغته الخاصة التي نشأ عليها منذ ولادته؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بلهجته الخاصة التي نشأ عليها منذ ولادته».'
    reason: «لهجة» معنى معجمي ممكن لـ διάλεκτος، في حين أن «لغة» أوسع وأوضح في المتن.
lexical_decisions:
- source_word: πῶς
  choice: فكيف
  rationale: تُدخل سؤالًا يدل على الدهشة والاستغراب، وتحافظ الفاء على اتصال السؤال بما قبله.
- source_word: ἡμεῖς ... ἕκαστος
  choice: كلُّ واحدٍ منا
  rationale: ينقل التركيبُ التوزيعيُّ تأكيدَ اختبار كل فرد من جماعة المتكلمين، بصياغة عربية طبيعية.
- source_word: ἀκούομεν
  choice: يسمع
  rationale: جاء الفعل مفردًا مراعاةً للفاعل التوزيعي «كل واحد»، مع بقاء معنى المتكلمين الجمعي حاضرًا في «منا».
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: بلغته
  rationale: «لغة» واضحة في العربية المعاصرة، والضمير ينقل معنى الاختصاص الوارد في ἰδίᾳ ἡμῶν من غير حشو.
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: التي وُلد فيها
  rationale: ترجمة صريحة للجملة الموصولة تحفظ صورة النص الأصلية وصلتها بمكان الولادة أو بيئتها اللغوية، بدل اختزالها في صفة تفسيرية مثل «الأم».
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. اختيرت «لغة» في المتن لأنها أيسر للقارئ وأقل تضييقًا من «لهجة»، مع إثبات البديل المعجمي في الحاشية. أُبقيت عبارة «التي وُلد فيها» لما في الأصل من احتمال تعبيري لا ينبغي تسويته إلى «اللغة الأم» وحدها.
