  verdict: revise
  source_fidelity: 'ينقل المتن الاستفهام المندهش، والتوزيع في «كل واحد منا»، وسماع اللغة الخاصة. لكن الحاشية لا تطابق بناء المتن: فهي تنتقل من المفرد التوزيعي إلى «وُلدنا»، وتستبدل «لغته» بـ«لهجته الخاصة» من غير اتساق نحوي كامل. كما أن «الخاصة» مفيدة لإبراز ἰδίᾳ صراحةً.'
  naturalness: «بلغته التي وُلد فيها» مفهومة في سياق ترجمي، لكنها أقل سلاسة في العربية المعاصرة لأن الولادة تكون في مكان لا في لغة. صياغة «بلغته الخاصة التي نشأ عليها منذ ولادته» طبيعية وتحافظ على المقصود، مع إبقاء التوزيع بالمفرد.
  terminology: «لغة» اختيار مناسب لـ διάλεκτος في المتن. وتُذكر «لهجة» في الحاشية بوصفها البديل المعجمي الممكن. وتعبير «الخاصة» ينقل ἰδίᾳ بوضوح، و«منذ ولادته» يعكس الجملة الموصولة دون فرض مصطلح تفسيري مثل «اللغة الأم».
  issues:
