    rationale: المتن مبني على «كل واحد ... بلغته ... وُلد فيها»، بينما الحاشية تقول «بلهجته الخاصة، التي وُلدنا فيها». يلزم أن يبقى البديل التوزيعي بالمفرد أو أن يعاد بناء العبارة كلها بصياغة جمع متسقة.
  - severity: low
    issue: غياب مقابل صريح لـ ἰδίᾳ في المتن.
    rationale: قد يفهم الاختصاص من «بلغته»، لكن «الخاصة» تُظهر التأكيد الموجود في الأصل بوضوح من غير حشو.
  - severity: low
    issue: العبارة «وُلد فيها» حرفية لكنها غير مألوفة نسبيًا مع «لغة» في العربية.
    rationale: يمكن توضيح علاقة اللغة بالولادة والنشأة بصياغة عربية طبيعية من غير تغيير المعنى المقصود.
