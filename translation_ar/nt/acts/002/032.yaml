  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: ar
  text: هذا يسوع أقامه الله[a]، ونحن جميعًا شهودٌ له.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: أقامه من بين الأموات.'
    reason: يوضح أن «أقامه» يُستعمل هنا بمعنى القيامة، موازيًا لتوضيح الحاشية الإنجليزية، من دون إضافة إلى متن الآية.
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: يسوع هذا
  rationale: يحفظ اسم الإشارة المؤكد وإحالته إلى يسوع المذكور للتو، مع صياغة عربية طبيعية ذات نبرة توكيدية.
- source_word: ἀνέστησεν
  choice: أقامه
  rationale: الفعل متعدٍّ وفاعله الله، وهو في هذا السياق يدل على الإقامة من الموت؛ و«أقامه» تعبير عربي واضح ومألوف في سياق القيامة.
- source_word: ὁ θεός
  choice: الله
  rationale: إبقاء الفاعل الصريح كما في اليونانية دون زيادة تفسيرية.
- source_word: οὗ
  choice: على ذلك
  rationale: يعود الضمير الموصول في السياق إلى إقامة يسوع، و«شهود على ذلك» تنقل المقصود بوضوح في العربية دون الإيحاء بأن الشهادة متعلقة بشخصه بمعزل عن الحدث.
- source_word: πάντες ἡμεῖς
  choice: نحن جميعًا
  rationale: يحفظ توكيد الضمير المنفصل مع معنى الشمول في صياغة عربية طبيعية.
- source_word: ἐσμεν μάρτυρες
  choice: شهودٌ
  rationale: يحافظ على البنية الاسمية الدالة على كون المتكلمين شهودًا، لا مجرد قيامهم بفعل الشهادة.
theological_decisions:
- issue: دلالة الإقامة
  choice: أقامه الله
  alternative: أنهضه الله
  rationale: السياق يحدد أن الفعل يشير إلى القيامة من الموت. «أقامه الله» ينسب الفعل إلى الله مباشرة ويحفظ المعنى من غير إضافة شرح عقائدي إلى نص الآية.
- issue: متعلَّق الشهادة
  choice: شهودٌ على ذلك
  alternative: شهودٌ له
  rationale: التركيب اليوناني يحتمل حرفيًا «شهود له/عليه»، لكن السياق يجعل الشهادة لإقامة يسوع هي المقصودة. «على ذلك» يوضح الإحالة إلى الحدث مع تجنب غموض العربية المحتمل في «له» أو «عليه».
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. قُدِّم «يسوع هذا» للمحافظة على القوة الإشارية والتوكيدية في الأصل، واستُخدمت جملة اسمية في الشطر الثاني موافقةً لبنية النص اليوناني.
