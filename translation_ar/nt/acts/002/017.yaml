source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: ar
  text: 'ويكون في الأيام الأخيرة، يقول الله: سأسكب من روحي[a] على كل بشر[b]، وسيتنبأ بنوكم وبناتكم، ويرى شبانكم رؤى، ويحلم شيوخكم أحلامًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا بحسب اليونانية: «من روحي»، لا مجرد «روحي»؛ وقد أُبقي حرف الجر في النص.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تُفهم أيضًا: «على جميع الناس». والعبارة اليونانية حرفيًا «على كل جسد»، وهي تعبير نبوي واسع عن البشر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: في الأيام الأخيرة
  rationale: تعبير زمني أخروي مباشر ومألوف، يحفظ دلالة الأصل من غير تحديدٍ زائد لنطاق هذه الأيام.
- source_word: λέγει ὁ θεός
  choice: يقول الله
  rationale: يحفظ صيغة الاقتباس بالمضارع ونبرتها النبوية.
- source_word: ἐκχεῶ
  choice: سأسكب
  rationale: يحفظ صورة السكب الحسية وصيغة المستقبل في الفعل اليوناني.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: من روحي
  rationale: ينقل حرف الجر ἀπό بمعنى «من»، ويحفظ إحالة «روحي» إلى روح الله كما يوضحها السياق.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: على كل بشر
  rationale: «بشر» تعبير عربي طبيعي يحفظ صورة «كل جسد» النبوية ودلالتها على الناس على اتساع فئاتهم، من غير اختزالها إلى جماعة بعينها.
- source_word: προφητεύσουσιν
  choice: فيتنبأ
  rationale: ترجمة مباشرة للمصطلح النبوي، والفاء تربط النتيجة بسكب الروح ربطًا طبيعيًا في العربية.
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: بنوكم وبناتكم
  rationale: يحفظ الزوج الصريح من الذكور والإناث، وهو مهم لاتساع المشاركة المذكورة في الآية.
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: شبّانكم
  rationale: ينقل الاسم المذكر الدال على فئة عمرية، ويحافظ على مقابلته بالشيوخ.
- source_word: ὁράσεις ὄψονται
  choice: يرى شبّانكم رؤى
  rationale: صياغة عربية طبيعية تحافظ على مضمون التركيب الاشتقاقي في اليونانية.
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: شيوخكم
  rationale: السياق يقابلهم بالشبان، لذلك يُفهم اللفظ هنا على أساس السن لا على أنه منصب ديني.
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: يحلم شيوخكم أحلامًا
  rationale: مقابل عربي طبيعي يحفظ التوكيد الاشتقاقي والتوازي مع رؤية الرؤى.
theological_decisions:
- issue: مدى عبارة ἐπὶ πᾶσαν σάρκα وصورتها النبوية
  choice: على كل بشر
  alternative: على جميع الناس؛ على كل جسد
  rationale: يحفظ «كل بشر» الصدى النبوي والصورة الجامعة للفئات البشرية، مع تجنب الإيحاء بأن المقصود لحم الأجساد حرفيًا.
- issue: مرجع πνεῦμα في قول الله «روحي»
  choice: روحي
  alternative: روح مني
  rationale: ضمير المتكلم في السياق يجعل المرجع روح الله. ولا تحتاج العربية إلى تمييز طباعي كي تدل على ذلك، كما أن «من روحي» تنقل حرف الجر من دون حسمٍ فلسفي لكيفية العطاء.
- issue: دلالة πρεσβύτεροι
  choice: شيوخكم بوصفهم كبار السن
  alternative: شيوخ جماعتكم؛ مسنّوكم
  rationale: التوازي الصريح مع «شبّانكم» يجعل التقابل عمريًا، فلا ينبغي تحميل اللفظ معنى الوظيفة الكنسية هنا.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة نبوية رصينة. حُفظ التوازي بين البنين والبنات، والشبان والشيوخ، والرؤى والأحلام. استُعملت الفاء في «فيتنبأ» لإظهار النتيجة بسلاسة عربية من غير إضافة مضمون تفسيري.
