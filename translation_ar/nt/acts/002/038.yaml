  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: ar
  text: 'فقال لهم بطرس: «توبوا، وليعتمد كلُّ واحد منكم باسم يسوع المسيح، لمغفرة خطاياكم[a]، وستنالون عطية الروح القدس».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تنقل عبارة «لمغفرة خطاياكم» العبارةَ اليونانية ترجمةً مباشرة. ويختلف المفسرون في كيفية ارتباط المعمودية بالمغفرة هنا؛ ولا تحسم الترجمة هذا الخلاف بما يتجاوز ألفاظ النص.
    reason: theological_ambiguity
lexical_decisions:
- source_word: Μετανοήσατε
  choice: توبوا
  rationale: فعل أمر موجَّه إلى الجمع ويدعو إلى توبة حاسمة؛ و«توبوا» هو المقابل العربي الموجز والطبيعي الذي يجمع معنى الرجوع عن الخطية والتحول إلى الله.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: وليعتمد كلُّ واحد منكم
  rationale: يحافظ هذا التركيب على صيغة الأمر المبني للمجهول وعلى الإفراد التوزيعي في «كل واحد منكم»، مع سلامة الأسلوب العربي.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: باسم
  rationale: تعبير عربي طبيعي في سياق المعمودية، ويحفظ دلالة الارتباط بالاسم وسلطانه والإقرار به من غير حصر العبارة في تفسير واحد.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ينقل معنى اللقب Χριστός نقلاً مباشرًا وطبيعيًا في العربية، ويبقي دلالته المسيانية حاضرة.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: لمغفرة خطاياكم
  rationale: ترجمة موجزة ومباشرة تحفظ اتجاه العبارة اليونانية وغرضها، من غير إضافة تفسير يحسم كيفية ارتباط المعمودية بالمغفرة.
- source_word: λήμψεσθε
  choice: فتنالوا
  rationale: ينقل الوعد المستقبلي بصياغة عربية طبيعية؛ والفاء تربط النتيجة بما سبق من غير إضافة مضمون جديد.
- source_word: τὴν δωρεὰν τοῦ ἁγίου πνεύματος
  choice: عطية الروح القدس
  rationale: «عطية» تقابل δωρεά بوضوح، و«الروح القدس» هو التعبير العربي المعاصر المألوف للمصطلح اليوناني.
theological_decisions:
- issue: علاقة المعمودية بمغفرة الخطايا في εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: لمغفرة خطاياكم
  alternative: لكي تُغفر خطاياكم؛ أو بسبب مغفرة خطاياكم
  rationale: الصياغة المختارة تنقل العبارة اليونانية بشفافية وتحفظ التوتر التفسيري بشأن علاقة المعمودية بالمغفرة، من غير تبنّي تصور طائفي عن الفاعلية أو الترتيب أو الرمزية.
- issue: نقل اللقب Χριστός
  choice: المسيح
  alternative: كريستوس (نقل صوتي)
  rationale: في العربية، «المسيح» هو المقابل الدلالي الطبيعي للقب اليوناني، ويحفظ وظيفته المسيانية في خطاب بطرس بدل تحويله إلى اسم منقول صوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «ليعتمد كل واحد منكم» للمحافظة على الأمر والإفراد التوزيعي، و«يسوع المسيح» لأن العربية تنقل معنى Χριστός نفسه بلفظ «المسيح»، فلا حاجة إلى حاشية تقابل بين Messiah وChrist كما في الإنجليزية.
