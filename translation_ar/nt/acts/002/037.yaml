base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: ar
  text: 'فلما سمعوا هذا[a]، نخسوا في قلوبهم، فقالوا لبطرس ولسائر الرسل: «ماذا ينبغي أن نفعل، أيها الإخوة[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: ما قاله بطرس. ويجوز ترجمة العبارة التالية: «جرحت قلوبهم جرحًا عميقًا»؛ فالتعبير اليوناني يصوّر تبكيتًا أو ألمًا داخليًا حادًا.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أيها الرجال الإخوة»، وهي صيغة نداء مألوفة قد تُفهم بمعنى «أيها الإخوة»، وربما تشمل الإخوة والأخوات بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: فلما سمعوا هذا
  rationale: اسم الفاعل الماضي يقدّم استجابتهم لما سبق من خطاب بطرس، و«لما» تؤدي التعاقب الزمني مع إيحاء سببي طبيعي. أُضيف اسم الإشارة من السياق، أما δέ فتؤدي هنا انتقالًا سرديًا خفيفًا لا مقابلة قوية.
- source_word: κατενύγησαν τὴν καρδίαν
  choice: نخس قلوبهم
  rationale: يحافظ هذا التعبير على صورة الإصابة الحادة في الداخل، ويفيد شدة التبكيت أو الألم النفسي من غير أن يحصر المعنى في تفسير لاهوتي واحد.
- source_word: εἶπόν τε
  choice: فقالوا
  rationale: تنقل الفاء الارتباط الوثيق والتتابع بين تأثرهم الداخلي وكلامهم، مع إبقاء فعل القول كما في اليونانية بدل تفسيره مباشرة بأنه سؤال.
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: لبطرس ولسائر الرسل
  rationale: «سائر» تؤدي معنى λοιπούς، أي بقية الرسل بعد تمييز بطرس عنهم في العبارة.
- source_word: Τί ποιήσωμεν
  choice: ماذا ينبغي أن نفعل
  rationale: صيغة الاحتمال التشاورية تسأل عن مسار العمل الواجب أو الملائم؛ و«ينبغي» تنقل هذا المعنى بوضوح في العربية المعاصرة.
- source_word: ἄνδρες ἀδελφοί
  choice: أيها الإخوة
  rationale: هذه صيغة نداء اصطلاحية حرفها «أيها الرجال الإخوة». اختصارها إلى «أيها الإخوة» طبيعي ويحفظ عنصر القرابة، مع بيان الصيغة الحرفية واحتمال نطاقها في الحاشية.
theological_decisions:
- issue: نطاق المخاطَبين في ἄνδρες ἀδελφοί
  choice: أيها الإخوة
  alternative: أيها الرجال الإخوة؛ أو أيها الإخوة والأخوات بحسب نطاق الخطاب
  rationale: الصيغة اليونانية مذكرة نحويًا، لكن كونها نداءً اصطلاحيًا قد يجعلها تشمل جماعة أوسع بحسب السياق. أبقى المتن على الصيغة المذكرة الطبيعية، وتحفظ الحاشية الاحتمال التداولي من غير الجزم به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «نخس قلوبهم» للمحافظة على الصورة المجازية الحادة مع صياغة عربية موجزة، ووُضعت علامتا الحاشية في المتن عند الموضعين اللذين تحتاج بدائلهما الدلالية إلى بيان.
