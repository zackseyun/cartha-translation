base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: ar
  text: 'أيها الرجال، أيها الإخوة[a]، يجوز لي أن أتكلم إليكم بكل صراحة بشأن داود، رئيس الآباء: إنه مات ودُفن، وقبره بيننا إلى هذا اليوم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «أيها الإخوة». واليونانية حرفيًا: «أيها الرجال، أيها الإخوة»، وهو نداء رسمي للمجتمعين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: أيها الرجال الإخوة
  rationale: حُفظ النداء المزدوج وصيغته المذكرة في اليونانية، مع تركيب عربي فصيح يبيّن أن المخاطَبين رجال وإخوة في الجماعة.
- source_word: ἐξὸν εἰπεῖν
  choice: يجوز لي أن أتكلم
  rationale: ينقل معنى الإباحة وحرية القول، لا مجرد القدرة عليه.
- source_word: μετὰ παρρησίας
  choice: بصراحة
  rationale: تدل العبارة على الكلام العلني الحر الواضح؛ و«بصراحة» طبيعية في العربية وتحفظ معنى المكاشفة، وإن كان «بجرأة» بديلًا ممكنًا.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: عن داود رئيس الآباء
  rationale: «رئيس الآباء» مقابل عربي واضح للقب πατριάρχης، من غير إضافة «أبينا» غير الموجودة في النص.
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: مات ودُفن
  rationale: ينقل الفعلين المتلازمين بإيجاز عربي طبيعي؛ وتتابع الواوين في اليونانية للتوكيد لا يستلزم تركيبًا أثقل في العربية.
- source_word: τὸ μνῆμα αὐτοῦ
  choice: قبره
  rationale: μνῆμα هنا موضع دفن معروف؛ و«قبره» هو المقابل العربي المباشر والطبيعي.
- source_word: ἔστιν ἐν ἡμῖν
  choice: بيننا
  rationale: يحفظ معنى وجود القبر في وسط الجماعة أو الموضع الذي يعيشون فيه.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: إلى هذا اليوم
  rationale: تعبير عربي مألوف يحفظ الاستمرار حتى زمن الكلام.
theological_decisions:
- issue: صياغة النداء الافتتاحي المذكر
  choice: أيها الرجال الإخوة
  alternative: أيها الإخوة؛ أو أيها الإخوة والأخوات
  rationale: النص اليوناني يورد اسمَي نداء مذكرين، ἄνδρες وἀδελφοί، لذلك حُفظ النداء المزدوج ولم تُضف «الأخوات». وتوضح الحاشية البديل العربي الأكثر سلاسة من غير طمس الصيغة الأصلية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقي النداء المزدوج لصلته المباشرة بصيغة الأصل، واستُخدمت «بصراحة» لتجنب أن تُفهم الجرأة على أنها تهور مع حفظ معنى حرية الكلام وعلانيته.
