  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: ar
  text: 'وأعطي عجائبَ في السماء من فوق، وآياتٍ على الأرض من تحت: دمًا ونارًا وبخارَ دخانٍ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سحابة من الدخان». وحرفيًا: «بخارًا من الدخان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δώσω
  choice: أجعل
  rationale: المعنى الأساسي للفعل هو «أعطي»، لكن «أجعل» أفصح في العربية مع العجائب والآيات، وتحافظ على معنى إحداثها وإظهارها دون إضافة تفسير زائد.
- source_word: τέρατα
  choice: عجائب
  rationale: تدل الكلمة على ظواهر خارقة تثير الدهشة؛ و«عجائب» تحافظ على اقترانها المألوف بـ«آيات» من غير حصرها في معجزات الشفاء أو غيرها.
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: في السماء من فوق
  rationale: تحافظ العبارة على التقابل المكاني الصريح بين السماء فوق والأرض تحت، وعلى النبرة النبوية للنص.
- source_word: σημεῖα
  choice: آيات
  rationale: «آيات» تعبر عن علامات ذات دلالة، وهي صياغة عربية كتابية واضحة تلائم اقترانها بـ«عجائب».
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: على الأرض من تحت
  rationale: تنقل معنى ἐπί والتقابل الكوني مع السماء من فوق، دون تضييق γῆ إلى أرض محلية بعينها.
- source_word: αἷμα
  choice: دمًا
  rationale: ترجمة مباشرة تحفظ الصورة الحسية الحادة في النبوءة.
- source_word: πῦρ
  choice: نارًا
  rationale: ترجمة مباشرة تحفظ الصورة العنصرية الحية في النص.
- source_word: ἀτμίδα καπνοῦ
  choice: سحابةً من الدخان
  rationale: ἀτμίς تدل على بخار أو ضباب متصاعد؛ و«سحابة من الدخان» تنقل الصورة بعبارة عربية طبيعية، مع إثبات الصياغة الأقرب حرفيًا في الحاشية.
theological_decisions:
- issue: دلالة الموضعين في اقتباس يوئيل ذي الصور الكونية
  choice: السماء من فوق ... الأرض من تحت
  alternative: الجو من فوق ... اليابسة من تحت
  rationale: يحافظ الاختيار على نطاق التقابل الكوني والنبرة النبوية، ولا يحصر المشهد في ظاهرة جوية أو موضع محلي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة نبوية رصينة. استُخدمت «أجعل» بدل «أعطي» لتجنب تركيب عربي متكلف، مع إبقاء ترتيب الصور والتقابل الرأسي في الأصل.
