source:
  edition: SBLGNT
  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: ar
  text: 'وكانوا مدهوشين ومتعجّبين، يقولون: «انظروا[a]، أليس جميع هؤلاء المتكلّمين جليليين؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ها إنهم» أو «ها أنتم ترون».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: كانوا مدهوشين
  rationale: يفيد الفعل في هذا السياق شدة الدهشة والانبهار، وصيغة «كانوا» مع اسم الفاعل تنقل دلالة الماضي المستمر في صيغة الناقص اليونانية بلغة عربية واضحة.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد، والواو أنسب مقابل طبيعي لها هنا.
- source_word: καὶ
  choice: و
  rationale: 'تربط بين ردّي الفعل المتراكمين: الدهشة والتعجّب.'
- source_word: ἐθαύμαζον
  choice: متعجّبين
  rationale: ينقل معنى التعجّب والإعجاب بالأمر الخارق، مع الحفاظ على الموازاة مع «مدهوشين».
- source_word: λέγοντες
  choice: يقولون
  rationale: اسم فاعل حالي يقدّم مضمون كلامهم، وصيغة «يقولون» طبيعية وتحافظ على تزامن القول مع دهشتهم.
- source_word: Οὐχ
  choice: أليس
  rationale: يقدّم سؤالًا منفيًا يتوقع جوابًا بالإيجاب، وهو ما تؤديه «أليس» بوضوح.
- source_word: ἰδοὺ
  choice: انظروا
  rationale: أداة تنبيه وإشارة تلفت انتباه السامعين؛ «انظروا» عربية معاصرة واضحة وتحفظ قوتها الإشارية.
- source_word: πάντες οὗτοί
  choice: جميع هؤلاء
  rationale: ينقل شمول المجموعة من غير إضافة «الرجال»، وهي غير مصرّح بها في اليونانية.
- source_word: οἱ λαλοῦντες
  choice: المتكلّمين
  rationale: ينقل اسم الفاعل المعرّف الدال على الذين يتكلمون، ويحافظ على استمرار الحدث.
- source_word: Γαλιλαῖοι
  choice: جليليين
  rationale: النسبة العربية المباشرة إلى الجليل، من غير إضافة تفسير اجتماعي أو تعليمي لا يصرّح به النص.
theological_decisions:
- issue: الدلالة الاجتماعية أو الإقليمية لوصف «جليليين»
  choice: إبقاء النسبة الإقليمية وحدها من غير شرح مضاف
  alternative: «جليليين غير متعلمين» أو إضافة تفسير يتعلق باللهجة أو المكانة
  rationale: يبدي النص التعجّب من كون المتكلمين جليليين، لكنه لا يحدد سبب هذا التعجّب؛ لذلك ينبغي عدم إدخال استنتاج سياقي في صلب الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم تركيب «كانوا مدهوشين ومتعجّبين» لإبراز الفعلين المتقاربين في الأصل، وأُبقي السؤال المنفي الذي يتوقع التصديق. تظهر علامة الحاشية [a] في موضعها من النص.
