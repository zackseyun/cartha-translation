  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: ar
  text: وكان في أورشليم يهود[a] مقيمون، رجال أتقياء من كل أمة تحت السماء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أهل اليهودية». غير أن السياق هنا يرجح معنى «اليهود» الأوسع، لأنهم موصوفون بأنهم من كل أمة تحت السماء.'
    reason: alternative_reading
  - marker: b
    text: '«تحت السماء» تعبير كتابي معناه: في أرجاء العالم كله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: وكان
  rationale: تنقل الواو مع «كان» أداة الربط السردية الخفيفة δέ من غير أن توحي بتعارض قوي أو بزمن صريح غير موجود في الأصل.
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: يقيم في أورشليم
  rationale: يفيد κατοικέω السكن أو الإقامة المستقرة نسبيًا، ولذلك فـ«يقيم» أوضح من لفظ قد يوحي بزيارة عابرة.
- source_word: Ἰουδαῖοι
  choice: يهود
  rationale: يدل السياق، ولا سيما مجيئهم من كل أمة، على المعنى الإثني الديني الأوسع، لا على سكان اليهودية وحدهم.
- source_word: ἄνδρες εὐλαβεῖς
  choice: رجال أتقياء
  rationale: تحافظ «رجال» على الدلالة المذكرة المحددة في ἄνδρες، وتنقل «أتقياء» معنى الورع والتوقير الذي تحمله εὐλαβεῖς.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: من كل أمة
  rationale: صياغة عربية طبيعية تحفظ شمول العبارة ودلالتها الجغرافية والإثنية.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: تحت السماء
  rationale: تحفظ التعبير الكتابي كما هو، مع بيان معناه الاصطلاحي في الحاشية.
theological_decisions:
- issue: دلالة Ἰουδαῖοι
  choice: يهود
  alternative: أهل اليهودية
  rationale: وصفهم بأنهم من كل أمة تحت السماء يرجح الهوية اليهودية الإثنية الدينية الجامعة، مع إبقاء الاحتمال الإقليمي في الحاشية.
- issue: الدلالة الجندرية في ἄνδρες
  choice: رجال
  alternative: أناس
  rationale: الاسم اليوناني مذكر تحديدًا، ولذلك لم تُعمَّم دلالته إلى «أناس».
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية وقورة. حُفظ ترتيب الأفكار في اليونانية قدر الإمكان، مع تركيب عربي طبيعي ومن دون إضافة تفسير إلى المتن.
