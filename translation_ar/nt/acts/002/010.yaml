- source_word: Φρυγίαν τε καὶ Παμφυλίαν
  choice: فِرِيجِيَّة وبَمْفِيلِيَّة
  rationale: اسما إقليمين، بصيغة عربية واضحة متداولة في الترجمات والكتابات الكتابية، وأُدي الربط في سياق القائمة بالواو.
- source_word: Αἴγυπτον
  choice: مِصْر
  rationale: الاسم العربي المعياري المعروف للبلد.
- source_word: τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην
  choice: نواحي لِيبِيَا القريبة من قُورِينِي
  rationale: «نواحي» تؤدي معنى μέρη بوصفها أجزاء أو مناطق، و«القريبة من» تنقل العلاقة المكانية المرنة التي تفيدها κατά هنا دون افتراض حدود إدارية دقيقة.
- source_word: οἱ ἐπιδημοῦντες Ῥωμαῖοι
  choice: الرُّومانيّون المقيمون هنا مؤقتًا
  rationale: يعبّر اسم الفاعل ἐπιδημοῦντες عن وجود مؤقت في المكان، لا عن إقامة دائمة؛ وإظهار «هنا» يجعل المعنى طبيعيًا بالعربية مع بقاء مكان الإقامة مفهومًا من السياق.
