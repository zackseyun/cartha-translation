  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: ar
  text: ستتحوّل الشمس إلى ظلمة، والقمر إلى دم، قبل أن يأتي يوم الرب العظيم والظاهر[a].
  philosophy: optimal-equivalence
