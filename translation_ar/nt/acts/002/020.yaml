lexical_decisions:
- source_word: μεταστραφήσεται
  choice: تتحوّل
  rationale: صيغة المضارع العربية هنا تفيد المستقبل بقرينة السياق، وتحافظ على صورة الانتقال إلى حالة أخرى دون تحديد آليته.
- source_word: εἰς σκότος
  choice: إلى ظلمة
  rationale: تحافظ «إلى» على دلالة الانتقال إلى الحالة الناتجة، و«ظلمة» توافق الصورة النبوية الموجزة.
- source_word: εἰς αἷμα
  choice: إلى دم
  rationale: تنقل العبارة اليونانية الحادة حرفيًا، من غير تفسيرها على أنها تعني مجرد لون أحمر كالدم.
- source_word: πρὶν ἢ ἐλθεῖν
  choice: قبل أن يأتي
  rationale: صياغة عربية طبيعية ودقيقة للعلاقة الزمنية التي تجعل مجيء اليوم لاحقًا للعلامات المذكورة.
- source_word: ἡμέραν κυρίου
  choice: يوم الرب
  rationale: تحفظ التعبير النبوي الكتابي المعروف، ولا تخلطه بتعبير قد يُفهم على أنه يوم أسبوعي مخصص للرب.
- source_word: μεγάλην
  choice: العظيم
  rationale: المقابل المباشر والطبيعي للصفة، مع الحفاظ على النبرة النبوية المهيبة.
- source_word: ἐπιφανῆ
  choice: الظاهر
  rationale: يدل اللفظ أساسًا على ما هو ظاهر أو جلي أو لافت؛ و«الظاهر» يحفظ هذا المعنى دون حصره في دلالة المجد أو البهاء.
theological_decisions:
- issue: صياغة ἡμέραν κυρίου في اقتباس نبوي من يوئيل ضمن خطاب بطرس
  choice: يوم الرب
  alternative: يومٌ للرب / يوم الرب الخاص
  rationale: «يوم الرب» هو التعبير الكتابي النبوي المألوف عن يوم التدخل الإلهي، ويحفظ صلة النص بخلفيته من غير إدخال دلالة كنسية لاحقة.
- issue: تعدد دلالات ἐπιφανῆ بين الظهور والجلال والتميّز
  choice: الظاهر
  alternative: المجيد أو الباهر أو المشهود
  rationale: اختيار «الظاهر» أقرب إلى الدلالة المعجمية المباشرة ويحفظ إمكان فهم اليوم بوصفه جليًا أو بارزًا، بينما تُذكر الدلالات السياقية الأخرى في الحاشية منعًا لحسم الغموض الأصيل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة نبوية رصينة. استُعمل الفعل المضارع «تتحوّل» للدلالة على المستقبل السياقي، وجاءت التراكيب موجزة بما يوافق إيقاع الأصل. وُضعت علامة الحاشية بعد اللفظ الذي تتناوله مباشرة.
