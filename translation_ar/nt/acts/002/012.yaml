    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: كانوا مندهشين
  rationale: ينقل حالة الدهشة المستمرة التي يدل عليها الماضي الناقص، بعبارة عربية طبيعية من غير إيحاء مضلل بفقدان الصواب.
- source_word: δὲ
  choice: الواو في «وكانوا»
  rationale: أداة ربط خفيفة تواصل السرد ولا تستلزم مقابلة قوية.
- source_word: πάντες
  choice: جميعًا
  rationale: تحفظ شمول رد الفعل لجميع المذكورين في السياق.
- source_word: διηπόρουν
  choice: متحيّرين
  rationale: يعبّر عن الحيرة وعدم القدرة على فهم ما حدث، مع المحافظة على توازي الوصفين.
- source_word: ἄλλος πρὸς ἄλλον
  choice: بعضهم لبعض
  rationale: المقابل العربي الطبيعي للتعبير التبادلي.
- source_word: λέγοντες
  choice: يقول بعضهم لبعض
  rationale: ترجمة محايدة للمشاركة التي تقدّم مضمون كلامهم.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: ما معنى هذا؟
  rationale: التركيب اليوناني اصطلاح يسأل عن معنى الحدث أو مغزاه؛ وهذه صياغة عربية واضحة وطبيعية تحافظ على المقصود.
