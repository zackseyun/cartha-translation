  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: ar
  text: 'وكانوا جميعًا مندهشين ومتحيّرين، يقول بعضهم لبعض: «ما معنى هذا؟»[a]'
