  yaml_path: translation/nt/acts/002/016.yaml
  text: But this is what was spoken through the prophet Joel:[a]
translation:
  language: ar
  text: بل هذا هو ما قيل على لسان النبي يوئيل:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بواسطة النبي يوئيل». تفيد اليونانية الوكالة أو الوساطة، وعبارة «على لسان» تحافظ بصورة طبيعية على دور يوئيل وسيطًا نبويًا للقول.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: أداة استدراك وتصحيح تردّ على سوء فهم الحاضرين في السياق السابق، و«بل» طبيعية وموجزة في العربية.
- source_word: τοῦτό
  choice: هذا
  rationale: اسم إشارة محايد يعود إلى الظاهرة الحاضرة، وتنقله العربية طبيعيًا بـ«هذا».
- source_word: ἐστιν
  choice: هو
  rationale: يحافظ على وظيفة فعل الكينونة بوصفه رابطة، من غير إدخال تفسير مثل «يعني».
- source_word: τὸ εἰρημένον
  choice: ما قيل
  rationale: ينقل اسم المفعول اليوناني المستعمل استعمال الاسم، ويحفظ صيغة المبني للمجهول بعبارة عربية سليمة.
- source_word: διὰ τοῦ προφήτου Ἰωήλ
  choice: على لسان النبي يوئيل
  rationale: تعبير عربي فصيح وطبيعي يدل على الوساطة في نقل القول، ويحفظ دور يوئيل بوصفه النبي الذي جرى القول بواسطته.
- source_word: Ἰωήλ
  choice: يوئيل
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
theological_decisions:
- issue: الوساطة النبوية في διὰ τοῦ προφήτου Ἰωήλ
  choice: على لسان النبي يوئيل
  alternative: بواسطة النبي يوئيل؛ من قِبَل النبي يوئيل
  rationale: يحفظ التعبير معنى الوساطة النبوية من غير جعل يوئيل بالضرورة المصدر النهائي للرسالة، ولا يحمّل النص نظرية خاصة في كيفية الوحي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختيرت «بل» للتصحيح السياقي، و«على لسان» لتجنّب ثقل الترجمة الحرفية «من خلال» مع إبقاء معنى الوساطة.
