  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: ar
  text: وكانوا يسبّحون الله ويحظون برضا الشعب كلّه. وكان الرب يضمّ إليهم[a] يومًا بعد يوم الذين كانوا يُخَلَّصون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة اليونانية هنا بمعنى: «معًا» أو «في المكان نفسه».'
    reason: alternative_reading
lexical_decisions:
- source_word: αἰνοῦντες τὸν θεόν
  choice: يسبّحون الله
  rationale: ينقل فعل التسبيح المستمر بصياغة عربية طبيعية، مع إبقاء الله مفعولًا مباشرًا للفعل.
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: يحظون برضا الشعب كلّه
  rationale: التركيب اليوناني يدل في هذا السياق على نيل القبول أو الرضا لدى الآخرين، لا على إظهار النعمة لهم. و«الشعب كلّه» يحافظ على شمول ὅλον وعلى دلالة λαός العامة.
- source_word: ὁ δὲ κύριος
  choice: وكان الرب
  rationale: «الرب» المقابل المعتاد لـ κύριος، والواو تمثّل انتقال δέ السردي برفق.
- source_word: προσετίθει
  choice: كان يضمّ
  rationale: صيغة الماضي الناقص تفيد فعلًا متكررًا مستمرًا. و«يضمّ» طبيعية مع إضافة أشخاص إلى جماعة، من غير إدخال لفظ «عدد» غير الصريح في اليونانية.
- source_word: τοὺς σῳζομένους
  choice: الذين كانوا يُخَلَّصون
  rationale: تحافظ الصيغة المبنية للمجهول على المبني للمجهول في اليونانية، كما تنقل الهيئة المستمرة لاسم الفاعل المضارع من غير تحويلها إلى وصف ثابت مثل «المخلَّصين».
- source_word: καθ’ ἡμέραν
  choice: يومًا بعد يوم
  rationale: تعبير عربي واضح ينقل المعنى التوزيعي والتكرار عبر الأيام المتعاقبة.
- source_word: ἐπὶ τὸ αὐτό
  choice: إليهم
  rationale: يناسب فعل الضمّ ويفيد الانضمام إلى الجماعة المذكورة في السياق، من غير التصريح بتفسير «إلى عددهم». وتُحفظ الدلالات الظرفية الممكنة في الحاشية.
theological_decisions:
- issue: الهيئة ودلالة الخلاص في τοὺς σῳζομένους
  choice: الذين كانوا يُخَلَّصون
  alternative: الذين نالوا الخلاص؛ المخلَّصون
  rationale: يحافظ الاختيار على الهيئة المستمرة وعلى المبني للمجهول في النص، من غير حسم نقاشات لاهوتية أوسع بشأن ترتيب الخلاص أو مراحله.
- issue: دلالة ἐπὶ τὸ αὐτό وعلاقتها بفعل الإضافة
  choice: إليهم
  alternative: معًا؛ في المكان نفسه؛ إلى جماعتهم
  rationale: «إليهم» ينسجم مع معنى ضمّ أشخاص إلى الجماعة ويحافظ على الإيجاز، بينما يظل للعبارة اليونانية احتمال دلالة «معًا» أو «في المكان نفسه»، ولذلك أُثبت البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت صياغة فعلية طبيعية بدل محاكاة اسمي الفاعل اليونانيين حرفيًا، مع الحفاظ على الاستمرار. وُضعت حركة المبني للمجهول في «يُخَلَّصون» لمنع التباسها بالفعل المبني للمعلوم.
