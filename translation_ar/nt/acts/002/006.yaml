lexical_decisions:
- source_word: γενομένης δὲ τῆς φωνῆς ταύτης
  choice: ولمّا حدث هذا الصوت
  rationale: التركيب المطلق بالمضاف إليه يبيّن ظرفًا زمنيًا، و«الصوت» ينقل φωνή دون أن يحدد الظاهرة المسموعة بأكثر مما يقوله النص.
- source_word: συνῆλθε τὸ πλῆθος
  choice: تجمّع الجمع
  rationale: «تجمّع» تعبير عربي طبيعي عن اجتماع الناس في موضع واحد، و«الجمع» ينقل معنى πλῆθος بوصفه عددًا كبيرًا من الناس.
- source_word: συνεχύθη
  choice: تحيروا
  rationale: يفيد الفعل اضطراب الجمع وعجزهم عن فهم ما يحدث؛ و«تحيروا» واضحة وطبيعية من غير مبالغة في المعنى.
- source_word: ἤκουον εἷς ἕκαστος
  choice: كل واحد كان يسمع
  rationale: تحافظ الصياغة على القوة التوزيعية المؤكدة لعبارة εἷς ἕκαστος، وعلى الاستمرار الذي يدل عليه الفعل الناقص ἤκουον.
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: بلهجته الخاصة
  rationale: «لهجة» هي المقابل الأقرب لـ διάλεκτος في هذا السياق، مع إمكان أن تدل الكلمة اليونانية أيضًا على اللغة بمعناها الأوسع.
- source_word: λαλούντων αὐτῶν
  choice: يسمعهم يتكلمون
  rationale: تبقي العبارة الضمير على مرجعه السياقي ولا تستورد تحديدًا أضيق لهوية المتكلمين.
theological_decisions:
- issue: هوية المتكلمين المشار إليهم بالضمير αὐτῶν
  choice: يسمعهم يتكلمون
  alternative: يسمع الرسل يتكلمون
  rationale: النص في هذه الآية يستخدم ضميرًا ولا يسمّي الرسل صراحة، لذلك أُبقي المرجع كما يقدمه السياق من غير إضافة تفسيرية.
- issue: المفرد التوزيعي في εἷς ἕκαστος ... τῇ ἰδίᾳ
  choice: كل واحد ... بلهجته الخاصة
  alternative: كل منهم ... بلغتهم الخاصة
  rationale: تحافظ الصياغة على المفرد التوزيعي في اليونانية، وهو طبيعي وواضح في العربية ولا يقصد حصر الجمع في جنس بعينه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «تجمّع الجمع» للمحافظة على بساطة السرد، و«تحيروا» لنقل الاضطراب الإدراكي، مع إثبات علامة الحاشية [a] في المتن.
