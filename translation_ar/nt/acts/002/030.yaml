  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: ar
  text: فإذ كان داود نبيًّا، وعالِمًا أن الله أقسم له بقَسَم أن يُجلِس واحدًا من نسل صُلبه[a] على عرشه،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «من ثمرة صُلبه»، أي واحدًا من ذريته.'
    reason: بيان الصورة الحرفية للتعبير اليوناني ومعناه الاصطلاحي في النسب.
lexical_decisions:
- source_word: προφήτης οὖν ὑπάρχων
  choice: فإذ كان داود نبيًّا
  rationale: تنقل «إذ» العلاقة الظرفية ذات المسحة السببية، بينما يفيد السياق أن الفاعل هو داود؛ وإظهار اسمه يزيل غموض الضمير الطبيعي في العربية من غير إضافة معنى جديد.
- source_word: καὶ εἰδὼς
  choice: وكان يعلم
  rationale: 'صياغة عربية طبيعية تحفظ توازي الحالين: كونه نبيًّا وعلمه بالقَسَم.'
- source_word: ὅρκῳ ὤμοσεν αὐτῷ ὁ θεός
  choice: أن الله أقسم له بقَسَم
  rationale: تحفظ اقتران الاسم بالفعل في اليونانية وما فيه من توكيد لجدية القَسَم، من غير استبداله بتعبير تفسيري.
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: واحدًا من نسل صُلبه
  rationale: يحفظ معنى الانحدار الجسدي والصورة النَسَبية في تعبير عربي مفهوم؛ وتشرح الحاشية الصورة الحرفية.
- source_word: καθίσαι ἐπὶ τὸν θρόνον αὐτοῦ
  choice: أن يُجلِس ... على عرشه
  rationale: 'يحفظ المعنى السببي للمصدر: الله هو الذي يُجلِس أو ينصّب ذلك المتحدر على العرش؛ وضمير «عرشه» يعود طبيعيًا إلى داود.'
theological_decisions:
- issue: الوعد الملكي لداود وتطبيقه المسياني في السياق
  choice: الإبقاء على لغة النسل والعرش من دون إدخال لفظ «المسيح» في الآية
  alternative: أن يُجلِس المسيح على عرشه
  rationale: الآية تصوغ القَسَم بوصفه وعدًا لواحد من نسل داود، أما تطبيقه على يسوع فيظهر من السياق التالي؛ لذلك لا ينبغي حسم التطبيق داخل ألفاظ هذه الآية.
- issue: مرجع ضمير العرش
  choice: عرش داود
  alternative: عرش الله أو عرش المتحدر
  rationale: أقرب مرجع سياقي ووعدي للضمير هو داود، بما يوافق وعد إقامة واحد من نسله على عرشه.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُعمل «نسل صُلبه» للحفاظ على البعد الجسدي والنَسَبي مع تجنب غرابة النقل الحرفي في المتن، ووُضعت الصورة الحرفية في الحاشية. تبدأ الجملة بـ«فإذ» لأنها متصلة بما قبلها وتستمر نحويًا إلى الآية التالية.
