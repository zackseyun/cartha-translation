  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: ar
  text: فإذ قد رُفع إلى يمين الله[a]، ونال من الآب وعد الروح القدس[b]، سكب هذا الذي أنتم أنفسكم ترونه وتسمعونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بيمين الله». تحتمل صيغة الداتيف في اليونانية معنى المكان، أي الرفع «إلى يمين الله»، أو معنى الوسيلة، أي الرفع «بيمين الله».'
    reason: alternative_reading
  - marker: b
    text: يمكن أن يُفهم التعبير بمعنى «الروح القدس الموعود به»، أو بمعنى الوعد المتعلق بالروح القدس.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: إلى يمين الله
  rationale: تُفهم صيغة المجرور اليونانية هنا على نحو مكاني، بما يوافق سياق تمجيد يسوع وجلوسه عن يمين الله، مع حفظ الاحتمال الآلي في الحاشية.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تفيد التفريع والنتيجة بصورة طبيعية في العربية، إذ تصل القول بما سبقه من برهان عن قيامة يسوع.
- source_word: ὑψωθεὶς
  choice: إذ قد رُفع
  rationale: يحفظ المبني للمجهول وسبق الفعل على فعل السكب، ويؤدي معنى الرفعة والتعظيم في السياق دون تعيين الفاعل داخل العبارة.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: وعد الروح القدس
  rationale: ترجمة قريبة من البنية اليونانية وتحفظ احتمال أن يكون المقصود الوعد المتعلق بالروح أو الروح نفسه بوصفه الموعود به.
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: ونال من الآب
  rationale: «نال» عربية طبيعية لمعنى التلقي، و«من الآب» تحفظ دلالة المصدر في παρά مع المضاف إليه.
- source_word: ἐξέχεεν
  choice: سكب
  rationale: الفعل الماضي يطابق الماضي اليوناني ويدل على الحدث المنجز الذي تظهر آثاره للحاضرين.
- source_word: τοῦτο
  choice: هذا
  rationale: يُترك اسم الإشارة على إيجازه من غير إضافة تفسيرية مثل «العطية» أو «الروح».
- source_word: ὑμεῖς
  choice: أنتم أنفسكم
  rationale: يحفظ توكيد الضمير الصريح في اليونانية.
- source_word: βλέπετε καὶ ἀκούετε
  choice: ترونه وتسمعونه
  rationale: صيغة المضارع تنقل الإدراك الجاري، وإلحاق ضمير المفعول بالفعلين طبيعي في العربية ويعود إلى «هذا».
theological_decisions:
- issue: هل τῇ δεξιᾷ τοῦ θεοῦ تعني الرفع إلى يمين الله أم الرفع بيمين الله؟
  choice: إلى يمين الله
  alternative: بيمين الله
  rationale: القرينة اللاحقة في الخطاب، ولا سيما الاستشهاد بالمزمور 110، ترجح معنى الرفعة إلى موضع الكرامة؛ لكن صيغة المجرور تحتمل معنى الوسيلة أيضًا، لذلك حُفظ في الحاشية.
- issue: هل τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου تعني الوعد المتعلق بالروح القدس أم الروح القدس الموعود به؟
  choice: وعد الروح القدس
  alternative: الروح القدس الموعود به
  rationale: الصياغة المختارة أقرب إلى التركيب اليوناني وتحفظ الإبهام الحقيقي في علاقة المضاف بالمضاف إليه، بينما يوضح السياق أن ما سُكب مرتبط بعطية الروح.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت الفاء للتفريع، وحُفظ إيجاز «هذا» وتوكيد «أنتم أنفسكم». وُضعت علامتا الحاشيتين في المتن عند موضعي الاحتمال.
