lexical_decisions:
- source_word: πάντες
  choice: جميع
  rationale: تحفظ معنى الشمول وتعدّل اسم الفاعل المعرّف الدال على جماعة المؤمنين.
- source_word: δὲ
  choice: الواو في «وكان»
  rationale: تفيد استمرار السرد من غير إقحام معنى تضاد قوي.
- source_word: οἱ πιστεύοντες
  choice: المؤمنين
  rationale: اسم طبيعي واضح للجماعة التي اتصفت بالإيمان، بدل ترجمة حرفية ثقيلة مثل «الذين كانوا يؤمنون».
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: كانوا معًا
  rationale: تؤدي المعنى الاصطلاحي للاجتماع أو الوجود معًا، مع إبقاء احتمال الدلالة المكانية في الحاشية.
- source_word: εἶχον
  choice: كانت ... بينهم
  rationale: صياغة عربية طبيعية تؤدي حالة الاقتناء المشترك المستمرة التي يدل عليها الماضي الناقص.
- source_word: ἅπαντα κοινά
  choice: كل الأشياء مشتركة بينهم
  rationale: تحفظ شمول العبارة وتوضح في العربية أن المقصود اشتراك الجماعة فيها، من غير تحديد زائد لطبيعة الأشياء.
theological_decisions:
- issue: طبيعة حياة الجماعة المشتركة
  choice: صياغة وصفية تفيد أن الأشياء كانت مشتركة بين المؤمنين.
  alternative: فهم العبارة على أنها تفرض نظامًا اقتصاديًا معياريًا على جميع الجماعات المسيحية.
  rationale: النص اليوناني يصف حال المؤمنين ولا يورد أمرًا صريحًا أو قاعدة عامة؛ لذلك لا تضيف الترجمة حكمًا عقائديًا أو سياسيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «معًا» لصياغة طبيعية، وأُبقي البديل المكاني في الحاشية حفاظًا على اتساع دلالة التعبير اليوناني.
