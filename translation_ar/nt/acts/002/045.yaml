  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: ar
  text: وكانوا يبيعون أملاكهم ومقتنياتهم، ويوزّعونها على الجميع[a]، بحسب حاجة كل واحد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أراضيهم ومقتنياتهم». يُرجَّح أن اللفظين اليونانيين يميّزان بين نوعين من الممتلكات؛ فالأول كثيرًا ما يشير إلى الأملاك، ولا سيما الأراضي والعقارات، والثاني إلى المقتنيات بوجه أعم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: أملاكهم
  rationale: يدل اللفظ على الممتلكات المكتسبة، وكثيرًا ما يشمل الأراضي والعقارات؛ و«أملاك» تعبير عربي طبيعي يميّزه نسبيًا من المقتنيات العامة.
- source_word: ὑπάρξεις
  choice: مقتنياتهم
  rationale: يشير إلى ما يملكه الإنسان من أشياء وأموال؛ و«مقتنيات» يحفظ التمييز عن «أملاك» من غير حصر الدلالة في المنقولات وحدها.
- source_word: ἐπίπρασκον
  choice: كانوا يبيعون
  rationale: صيغة الماضي الناقص اليونانية تصوّر فعلًا مستمرًا أو متكررًا، لا عملية بيع واحدة مكتملة.
- source_word: διεμέριζον
  choice: يوزّعونها
  rationale: يفيد تقسيم الأشياء أو تخصيصها للآخرين، و«يوزّعون» ملائم للسياق ويحافظ على دلالة الفعل دون تحديد آلية التوزيع.
- source_word: αὐτά
  choice: ها
  rationale: الضمير يعود نحويًا إلى الأملاك والمقتنيات، وقد يُفهم ضمنًا أنه يشمل ما ينتج من بيعها؛ إبقاء الضمير يحفظ إيجاز الأصل وغموض مرجعه النسبي.
- source_word: πᾶσιν
  choice: على الجميع
  rationale: ينقل شمول المتلقين في سياق جماعة المؤمنين بصياغة عربية مألوفة.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: بحسب حاجة كل واحد
  rationale: ينقل معنى التوزيع تبعًا لما تكون لدى أي فرد من حاجة، مع الحفاظ على القوة الشرطية غير المحددة للعبارة.
theological_decisions:
- issue: طبيعة مشاركة المؤمنين في الأموال
  choice: وصف ممارسة متكررة لبيع الممتلكات وتوزيعها بحسب الحاجة، دون التصريح بإلغاء الملكية الخاصة أو فرض نظام عام دائم.
  alternative: اعتبار الآية تعليمًا بملكية جماعية كاملة ملزمة لجميع المسيحيين.
  rationale: الأفعال بصيغة الماضي الناقص تصف ممارسة مستمرة أو متكررة، لكن النص لا يصرّح بزوال كل ملكية فردية ولا يحوّل الوصف إلى وصية عامة؛ لذلك تبقى الترجمة وصفية ولا تستورد موقفًا اقتصاديًا أو طائفيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم تركيب «كانوا يبيعون... ويوزّعون» لإبراز الاستمرار أو التكرار، وأُبقي الضمير في «يوزّعونها» بدل تفسيره صراحة بأنه أثمان البيع، محافظةً على مقدار الإبهام الموجود في اليونانية.
