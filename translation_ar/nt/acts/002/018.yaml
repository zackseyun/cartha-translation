  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: ar
  text: وحتى على عبيدي وإمائي في تلك الأيام سأسكب من روحي، فيتنبأون.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί γε
  choice: بل حتى
  rationale: تفيد الأداة المركبة توكيد امتداد الوعد إلى فئة قد تُستبعد اجتماعيًا؛ و«بل حتى» تنقل هذه القوة طبيعيًا في العربية.
- source_word: ἐπὶ τοὺς δούλους μου
  choice: على عبيدي
  rationale: «عبيد» تحفظ دلالة الرق والوضع الاجتماعي المتدني التي يبرزها اقتران المذكّر بالمؤنث، كما تُبقي ضمير المتكلم في النص.
- source_word: ἐπὶ τὰς δούλας μου
  choice: وإمائي
  rationale: «إماء» المقابل العربي الدقيق للعبيد من الإناث، ويحفظ التمييز الجنسي والدلالة الاجتماعية الصريحة في اليونانية.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: في تلك الأيام
  rationale: صياغة عربية مباشرة تحفظ الظرف الزمني واسم الإشارة.
- source_word: ἐκχεῶ
  choice: أسكب
  rationale: يحفظ استعارة السكب وصيغة المستقبل التي يدل عليها السياق؛ والمضارع العربي بعد الإطار المستقبلي السابق في الاقتباس مقبول للدلالة على المستقبل، لكن العبارة هنا قائمة بوصفها تتمة للوعد.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: من روحي
  rationale: ينقل حرف الجر ἀπό صراحة، ويحفظ احتمال الدلالة على الأخذ من الروح دون تحويله إلى تركيب إضافي أكثر تقليدية.
- source_word: προφητεύσουσιν
  choice: فيتنبأون
  rationale: ينقل الفعل بصيغته الاصطلاحية الواضحة، والفاء تلائم العربية في بيان النتيجة مع بقاء العطف اليوناني محفوظًا وظيفيًا.
theological_decisions:
- issue: دلالة δοῦλος/δούλη في سياق شمول سكب الروح لذوي المكانة الاجتماعية المتدنية
  choice: عبيدي وإمائي
  alternative: خدمي وخادماتي
  rationale: يحفظ الاختيار دلالة الاسترقاق المحتملة والبارزة هنا، وكذلك التقابل الصريح بين الذكور والإناث، من غير تلطيف للأثر الاجتماعي في النص.
- issue: صياغة ἀπὸ τοῦ πνεύματός μου
  choice: من روحي
  alternative: من روحي / من فيض روحي؛ أو «روحي» بلا حرف الجر
  rationale: «من روحي» أقرب إلى البنية اليونانية ويحافظ على غموضها، فلا يحسم هل المراد جزء أو مصدر أو مجرد تعبير سامي عن سكب الروح.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة. استُعمل «عبيدي وإمائي» بدل ألفاظ الخدمة العامة للمحافظة على حدة الدلالة الاجتماعية، ووُضعت علامة الحاشية [a] مباشرة بعد العبارة المعنية.
