  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: ar
  text: عَرَّفْتَني سُبُلَ الحياة[a]، وستملؤني فرحًا في حضورك[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «طُرُقَ الحياة».
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «مع وجهك»، أي «في حضورك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: عَرَّفْتَني
  rationale: ينقل الفعل المتعدي في صيغة الماضي مع ضمير المتكلم بوصفه مفعولًا، وهو تعبير عربي طبيعي يحفظ معنى «جعلتني أعرف».
- source_word: ὁδοὺς ζωῆς
  choice: سُبُلَ الحياة
  rationale: يحفظ جمع ὁδός وصورته المكانية، كما يحافظ على تركيب الإضافة من غير أن يحسم هل هي سبل تتصف بالحياة أم تقود إليها.
- source_word: πληρώσεις με
  choice: ستملؤني
  rationale: ينقل المستقبل الصريح والفعل الدال على الملء مع ضمير المفعول به مباشرة.
- source_word: εὐφροσύνης
  choice: فرحًا
  rationale: يؤدي معنى البهجة والسرور، ويأتي بعد «ملأ» بصياغة عربية واضحة وطبيعية.
- source_word: μετὰ τοῦ προσώπου σου
  choice: في حضورك
  rationale: ينقل المقصود الاصطلاحي من عبارة «مع وجهك» إلى عربية مفهومة، مع إثبات صورتها الحرفية في الحاشية.
theological_decisions:
- issue: تعبير الوجه الدال على الحضور الإلهي
  choice: في حضورك
  alternative: مع وجهك
  rationale: الصياغة المختارة توصل معنى القرب والحضور الشخصي بوضوح من غير إضافة تفسير عقائدي، بينما تحفظ الحاشية الصورة الأصلية للتعبير.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كريمة؛ استُعملت «سُبُل» للمحافظة على الصورة الشعرية والجمع، و«في حضورك» لتوضيح التعبير الاصطلاحي من دون تسطيح صورته، إذ أُبقيت الصيغة الحرفية في الحاشية.
