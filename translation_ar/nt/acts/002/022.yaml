source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: ar
  text: '«يا رجالَ إسرائيل، اسمعوا هذه الكلمات: يسوعُ الناصري، رجلٌ أثبتَه الله لكم بمعجزات[a] وعجائبَ وآياتٍ أجراها الله على يده في وسطكم، كما تعلمون أنتم أنفسكم—»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأعمال قدرة وعجائب وآيات». تدل الكلمة اليونانية δυνάμεσι، على نحو أقرب إلى اللفظ، على «قوى» أو «أعمال قدرة»، وتُستعمل هنا عن أعمال تُظهر قدرة الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: يا رجالَ إسرائيل
  rationale: يحفظ النداء وصيغة المذكر الصريحة في ἄνδρες، ويؤدي النسبة القومية Ἰσραηλῖται بعبارة عربية واضحة وطبيعية.
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: اسمعوا هذه الكلمات
  rationale: ينقل فعل الأمر الداعي إلى الانتباه، ويحافظ على معنى λόγους دون تحويله تفسيرياً إلى «الرسالة».
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: يسوع الناصري
  rationale: «الناصري» لقب عربي راسخ يحفظ القوة الوصفية أو اللقبية للكلمة اليونانية، مع إمكان فهمها على صلة بالناصرة.
- source_word: ἄνδρα
  choice: رجل
  rationale: ينقل الاسم الصريح الدال على الرجل، ويحفظ تأكيد النص على إنسانية يسوع من غير أن يستنتج منه حكماً على لاهوته.
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: أثبتَه الله لكم
  rationale: «أثبت» يؤدي معنى الإظهار والبرهنة العلنية، ويجعل الله مصدر الإثبات وفاعله، بينما «لكم» تحفظ اتجاه هذا الإثبات إلى المخاطَبين.
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: بقوات وعجائب وآيات
  rationale: «قوات» أقرب إلى الدلالة اللفظية لـ δυνάμεσι وتحفظ ثلاثية الأسماء، مع توضيح المقصود في الحاشية؛ و«عجائب وآيات» تعبيران عربيان كتابيان واضحان.
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: أجراها الله على يده
  rationale: يجعل الله فاعل الأعمال صراحة، ويحفظ وساطة يسوع في العبارة δι’ αὐτοῦ بتعبير عربي طبيعي هو «على يده».
- source_word: ἐν μέσῳ ὑμῶν
  choice: في وسطكم
  rationale: ترجمة مباشرة وطبيعية للصيغة المكانية التي تفيد وقوع الأعمال بينهم.
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: كما تعلمون أنتم أنفسكم
  rationale: يحفظ توكيد الضمير αὐτοὶ بعبارة «أنتم أنفسكم».
theological_decisions:
- issue: صياغة ἄνδρα ودلالتها المسيحانية
  choice: الإبقاء على «رجل» في المتن
  alternative: «شخص» أو حذف الاسم
  rationale: اليونانية تصرح بـ ἄνδρα؛ وإبقاء اللفظ يحفظ شهادة الآية لإنسانية يسوع من غير أن يحسم أو ينفي ما تقوله نصوص أخرى عن هويته.
- issue: الفاعل والواسطة في أعمال القوة
  choice: «أجراها الله على يده»
  alternative: «أجراها يسوع» أو صياغة مبنية للمجهول
  rationale: النص يجعل ὁ θεός فاعلاً وδι’ αὐτοῦ دالاً على الواسطة؛ لذا تحافظ الصياغة على هذا التوتر اللاهوتي كما هو بلا تسويته.
- issue: طبيعة إثبات الله ليسوع
  choice: «أثبتَه الله لكم»
  alternative: «زكّاه الله» أو «أيّده الله»
  rationale: «أثبت» لا يستورد معنى مؤسسياً أو مذهبياً، بل يبقي على فكرة الإظهار والبرهنة العلنية بأعمال القوة.
translation_notes:
  register: فصحى حديثة واضحة ذات نبرة خطابية مهيبة. حُفظ ترتيب الأفكار وبنية الثلاثية اليونانية، واستُعمل «على يده» بوصفه مقابلاً عربياً طبيعياً لمعنى الوساطة. وُضعت علامة الحاشية بعد الآية لأنها تتعلق بعبارة داخلها، مع إبقاء الشرطة الختامية للدلالة على اتصال الجملة بالآية التالية.
