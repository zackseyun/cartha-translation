  source_fidelity: 'المعنى العام محفوظ: النداء الموجّه إلى رجال إسرائيل، ووصف يسوع بالناصري وبأنه رجل أظهر الله أمره لجمهورهم، وثلاثية الأعمال، وكون الله فاعلها بوساطة يسوع، كلها منقولة بأمانة. غير أن «قوات» في العربية المعاصرة قد تُفهم على أنها قوات عسكرية ولا تؤدي بوضوح معنى δυνάμεσι في هذا السياق، وهو أعمال القدرة الإلهية.'
