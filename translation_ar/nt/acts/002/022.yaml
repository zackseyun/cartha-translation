  terminology: «يسوع الناصري»، و«رجل»، و«عجائب وآيات» اختيارات مناسبة. «معجزات» مقابل طبيعي ودقيق سياقيًا لـδυνάμεσι، مع إبقاء البديل الأقرب إلى اللفظ في الحاشية. «أثبته الله لكم» مقبول بوصفه دالًا على الإظهار والتصديق العلني، ولا يفرض تفسيرًا لاهوتيًا زائدًا.
