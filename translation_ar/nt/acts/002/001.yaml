  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: ar
  text: وعندما كان يوم الخمسين يكتمل[a]، كانوا جميعًا معًا في مكان واحد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وعندما تمّ حلول يوم الخمسين».'
    reason: بديل لفظي يعبّر عن بلوغ اليوم تمامه بصياغة تركز على النتيجة أكثر من مسار الاكتمال.
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: كان ... يكتمل
  rationale: المصدر المضارع المبني للمجهول مع ἐν τῷ يصوغ عبارة زمنية ويبرز بلوغ اليوم تمامه بوصفه مسارًا؛ وهذه الصياغة العربية تحافظ على هذه الدلالة مع سلاسة معقولة.
- source_word: πεντηκοστῆς
  choice: يوم الخمسين
  rationale: هذا هو الاسم اليوناني للعيد اليهودي الواقع في اليوم الخمسين، و«يوم الخمسين» المقابل العربي الواضح والمألوف في سياق العهد الجديد.
- source_word: πάντες
  choice: جميعًا
  rationale: تدل الكلمة على شمول الجماعة المشار إليها في السياق السابق، و«جميعًا» تؤدي ذلك بإيجاز.
- source_word: ὁμοῦ
  choice: معًا
  rationale: تفيد اجتماع الأشخاص وصحبتهم، ويقابلها «معًا» مباشرة.
- source_word: ἐπὶ τὸ αὐτό
  choice: في مكان واحد
  rationale: يمكن أن يفيد التعبير الاجتماع أو الوجود في الموضع نفسه؛ وبما أن ὁμοῦ أدت معنى الاجتماع، تحافظ هذه الصياغة على الدلالة المكانية وتتفادى تكرارها.
theological_decisions:
- issue: هوية فاعل ἦσαν المضمر
  choice: كانوا جميعًا معًا في مكان واحد
  alternative: كان الجميع معًا في مكان واحد
  rationale: لا يعيد اليوناني ذكر الفاعل صراحة، بل يُفهم من السياق السابق. وتحافظ صيغة الجمع المضمرة في «كانوا» على الاستمرار السردي من غير تعيين إضافي لهوية الجماعة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. أُبقي كل من «معًا» و«في مكان واحد» لأن الأصل يجمع بين ὁμοῦ وἐπὶ τὸ αὐτό، مع احتمال قدر من التوكيد في العبارة اليونانية.
