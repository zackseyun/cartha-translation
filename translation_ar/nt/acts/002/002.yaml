  text: καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: ar
  text: وفجأة جاء من السماء صوت كصوت ريح عاتية مندفعة[a]، فملأ البيت كله حيث كانوا جالسين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صوت كصوت ريح شديدة تُساق بقوة». يقارن النص اليوناني الصوت بهواء قوي متحرك، ولا يصرح بأن ريحا فعلية كانت موجودة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: جاء
  rationale: صياغة عربية طبيعية للتركيب الحدثي غير الشخصي، وتفيد ظهور الصوت وحدوثه من غير التزام بالترجمة الحرفية الثقيلة «حدث».
- source_word: ἄφνω
  choice: فجأة
  rationale: تنقل معنى المباغتة بوضوح وبلغة عربية فصيحة معاصرة.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: تحفظ دلالة المصدر السماوي، وهي أنسب في سياق لوقا وأعمال الرسل من حصر المعنى في الجو أو الفضاء المنظور.
- source_word: ἦχος
  choice: صوت
  rationale: مقابل عام ودقيق لا يضيف إيحاء سلبيا مثل «ضجيج» ولا يخصص طبيعة الصوت مثل «دوي».
- source_word: ὥσπερ
  choice: كصوت
  rationale: تُظهر أداة التشبيه بوضوح، فلا تجعل الصوت والريح شيئا واحدا ولا تقرر وجود ريح فعلية.
- source_word: φερομένης
  choice: مندفعة
  rationale: تنقل حركة الهواء وقوته في عربية طبيعية، بدلا من ترجمة حرفية مبهمة مثل «محمولة».
- source_word: πνοῆς
  choice: ريح
  rationale: السياق السمعي مع وصف القوة والحركة يرجح معنى الريح أو هبوب الهواء، لا نفَس الإنسان.
- source_word: βιαίας
  choice: عاتية
  rationale: تعبر عن شدة الريح وقوتها تعبيرا عربيا مألوفا، من غير أن توحي بالضرورة بعنف أخلاقي.
- source_word: ἐπλήρωσεν
  choice: فملأ
  rationale: يبقي الصوت فاعل الفعل كما في اليونانية، وتربط الفاء النتيجة بالحدث السابق ربطا طبيعيا.
- source_word: ὅλον τὸν οἶκον
  choice: البيت كله
  rationale: تحفظ دلالة الشمول بعبارة عربية واضحة ومألوفة.
- source_word: οὗ ἦσαν καθήμενοι
  choice: حيث كانوا جالسين
  rationale: تنقل جملة الصلة وحالة الجلوس المستمرة بوضوح ومن دون تكلف.
theological_decisions:
- issue: طبيعة الظاهرة المشبهة بالريح
  choice: 'يحافظ النص على التشبيه: صوت كصوت ريح عاتية مندفعة.'
  alternative: أن ريحا عاتية فعلية ملأت البيت.
  rationale: تستعمل اليونانية ὥσπερ للدلالة على التشبيه؛ لذلك لا تحوّل الترجمة التشبيه إلى تقرير بوجود ريح فعلية، بل تترك طبيعة الظاهرة ضمن الحدود التي يقررها النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية رصينة. استُعملت «عاتية مندفعة» لتصوير القوة والحركة بصورة مفهومة، مع إبقاء التشبيه صريحا وتجنب تقرير ما إذا كانت ريح فعلية قد هبت.
