  source_fidelity: 'المعنى الأساسي منقول بأمانة: الأمر الجماعي، واليقين، وبيت إسرائيل، وجعل يسوع ربًّا ومسيحًا، والإشارة إلى صلب المخاطَبين له. لكن موضع الإشارة «هذا» في «يسوع هذا» غير طبيعي في العربية ويضعف إبراز التركيب اليوناني المؤكد «هذا يسوع».'
  naturalness: «يسوع هذا» ممكنة في أسلوب متأثر بالترتيب الأجنبي، لكنها أقل سلاسة ووضوحًا من «هذا يسوع». كما أن ترتيب الجملة يمكن أن يحافظ على التركيز اليوناني بوضوح أكبر.
  terminology: «ربًّا» و«مسيحًا» مناسبان لـ κύριον وχριστόν. و«جعل» يحافظ على سعة ἐποίησεν دون فرض تفسير. الهامش (ب) يقدّم تفسيرًا لاهوتيًا زائدًا نسبيًا على النص، لكنه لا يغيّر المتن؛ والأحوط صياغته بوصفه توضيحًا سياقيًا غير حاسم لطبيعة الفعل.
