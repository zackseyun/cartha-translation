  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: ar
  text: فَلْيَعْلَمْ بَيْتُ إِسْرَائِيلَ كُلُّهُ يَقِينًا أَنَّ اللهَ جَعَلَ هذَا يَسُوعَ، الَّذِي صَلَبْتُمُوهُ أَنْتُمْ، رَبًّا وَمَسِيحًا[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المسيح». اللفظ اليوناني Χριστός (خريستوس) لقبٌ معناه «المسيح»، وقد تُرجم هنا «مسيحًا» لإبراز دلالة اللقب في خطاب بطرس إلى إسرائيل.'
    reason: alternative_reading
  - marker: b
    text: يمكن أن يُفهم قول النص إن الله «جعله ربًّا ومسيحًا» في سياق رفع يسوع وإعلانه علنًا في هاتين المنزلتين؛ ولا يقتضي في ذاته تغيّرًا في طبيعته الإلهية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: يَقِينًا
  rationale: ينقل معنى التوكيد واليقين بعبارة عربية فصيحة ومباشرة.
- source_word: οὖν
  choice: فَـ
  rationale: تفيد التفريع والاستنتاج من حجة بطرس السابقة، وتربط الآية بما قبلها ربطًا طبيعيًا.
- source_word: γινωσκέτω
  choice: لْيَعْلَمْ
  rationale: يحافظ على صيغة الأمر للغائب الموجَّهة إلى بيت إسرائيل بوصفه جماعة.
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: بَيْتُ إِسْرَائِيلَ كُلُّهُ
  rationale: يحفظ التعبير الكتابي وصورته الجماعية، مع ترتيب عربي واضح.
- source_word: κύριον
  choice: رَبًّا
  rationale: ينقل لقب السيادة والسلطان الرفيع في السياق، ويحفظ صداه مع الاستشهاد السابق.
- source_word: χριστόν
  choice: مَسِيحًا
  rationale: المقام خطاب إلى إسرائيل وإعلان لهوية يسوع المسيانية، ولذلك يحافظ «مسيحًا» على دلالة اللقب.
- source_word: ἐποίησεν
  choice: جَعَلَ
  rationale: هو المقابل العربي المباشر المرن للفعل، ويحفظ قوة العبارة من غير استبداله تفسيرًا بـ«عيَّن» أو «أقام».
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: يَسُوعَ هَذَا
  rationale: يحفظ قوة الإشارة إلى يسوع التاريخي المعيَّن، بصياغة عربية طبيعية.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: الَّذِي صَلَبْتُمُوهُ أَنْتُمْ
  rationale: ينقل الاتهام المباشر، ويُظهر توكيد الضمير اليوناني ὑμεῖς بإثبات «أنتم».
theological_decisions:
- issue: دلالة قول النص إن الله «جعل» يسوع ربًّا ومسيحًا
  choice: الإبقاء على «جعل» في المتن، مع بيان أن السياق يتحدث عن إعلانه ورفعه وإقامته علنًا في هاتين المنزلتين.
  alternative: ترجمة الفعل تفسيرًا بـ«عيَّن» أو «أقام»، أو فهمه على أنه تغيّر في طبيعة يسوع.
  rationale: «جعل» يحفظ الدلالة المباشرة للفعل اليوناني ولا يحسم التوتر بالتفسير داخل المتن. ويوضح الهامش المقصود السياقي من غير أن ينسب إلى الآية القول بحدوث تغير في طبيعة يسوع.
- issue: ترجمة Χριστός
  choice: مسيحًا
  alternative: المسيح أو كريستوس
  rationale: 'ورود اللقب في خطاب موجَّه إلى بيت إسرائيل يجعل معناه المسياني بارزًا. واستعمال النكرة المنصوبة بعد «جعل» طبيعي في العربية ويوازي البنية الخبرية: ربًّا ومسيحًا.'
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدمت «فليعلم يقينًا» لحفظ الأمر والتوكيد، وأُبقي التعبير «بيت إسرائيل كله» لما له من صبغة كتابية وجماعية. وُضعت الجملة الموصولة الاعتراضية قبل خبري «جعل» لتفادي التباس مرجع «هذا» وللحفاظ على تدفق عربي طبيعي.
