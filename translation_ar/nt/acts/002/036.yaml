    rationale: التركيب اليوناني τοῦτον τὸν Ἰησοῦν يبرز المشار إليه، والترتيب العربي الطبيعي الواضح هو «هذا يسوع»، لا «يسوع هذا». التعديل يحفظ الإشارة والتوكيد دون غرابة أسلوبية.
  - severity: low
    issue: صياغة الهامش ب تقريرية أكثر من اللازم
    rationale: وصف العبارة بأنها تشير إلى «إقامته علنًا» يفسر ἐποίησεν تفسيرًا محددًا. يمكن إبقاء التوضيح السياقي مع تجنب عرضه بوصفه المعنى المعجمي الحصري للفعل.
