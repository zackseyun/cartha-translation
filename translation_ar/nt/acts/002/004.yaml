  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐπλήσθησαν ⸀πάντες πνεύματος ἁγίου, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ⸂ἀποφθέγγεσθαι αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: ar
  text: وامتلأوا جميعًا من الروح القدس، وبدأوا يتكلمون بألسنة أخرى[a]، كما كان الروح يمنحهم أن ينطقوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بلغات أخرى». يمكن للكلمة اليونانية أن تعني «ألسنة» أو «لغات»، ويشير السياق التالي إلى أن السامعين فهموا الكلام بوصفه لغات بشرية حقيقية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: امتلأوا
  rationale: فعل ماضٍ مبني للمجهول في اليونانية يدل هنا على الامتلاء أو التمكين؛ وصيغة «امتلأوا» عربية طبيعية تحفظ المعنى دون زيادة تفسيرية.
- source_word: πάντες
  choice: جميعًا
  rationale: تنقل شمول المجموعة كلها بوضوح وإيجاز.
- source_word: πνεύματος ἁγίου
  choice: من الروح القدس
  rationale: يشير السياق في أعمال الرسل إلى روح الله القدوس بوصفه الفاعل الذي يمكّنهم من الكلام، و«امتلأوا من» تعبير عربي واضح.
- source_word: ἤρξαντο λαλεῖν
  choice: بدأوا يتكلمون
  rationale: يحفظ ابتداء الفعل الذي تدل عليه صيغة ἄρχομαι مع المصدر.
- source_word: ἑτέραις γλώσσαις
  choice: بألسنة أخرى
  rationale: يحافظ «ألسنة» على الصورة اللفظية وعلى إمكان دلالة γλῶσσαι على الألسنة أو اللغات، فيما يوضح السياق اللاحق طبيعة الكلام.
- source_word: καθὼς
  choice: كما
  rationale: تؤدي معنى الكيفية أو المقدار الذي جرى الكلام بحسبه بصورة عربية طبيعية.
- source_word: ἐδίδου
  choice: كان ... يمنحهم
  rationale: تركيب «كان» مع المضارع ينقل الاستمرار الذي تدل عليه صيغة الماضي الناقص اليونانية.
- source_word: ἀποφθέγγεσθαι
  choice: أن ينطقوا
  rationale: ينقل معنى التكلم المنطوق أو الجهري الذي يتيحه الروح، من غير حصره في النبوة أو إضافة وصف غير صريح.
- source_word: αὐτοῖς
  choice: هم في «يمنحهم»
  rationale: أُدمج ضمير المفعول غير المباشر في الفعل على نحو عربي سليم.
theological_decisions:
- issue: هل πνεύματος ἁγίου إشارة شخصية محددة إلى روح الله أم وصف عام لروح مقدسة؟
  choice: الروح القدس
  alternative: روح مقدسة
  rationale: سياق أعمال 2 يحدد المرجع بأنه الروح الإلهي الموعود، وهو نفسه فاعل المنح في آخر الآية؛ لذلك يحفظ التعريف خصوصية المرجع من غير إضافة عقيدة خارج النص.
- issue: هل تُترجم γλώσσαις «ألسنة» أم «لغات»؟
  choice: ألسنة أخرى
  alternative: لغات أخرى
  rationale: للكلمة اليونانية المجالان الدلاليان، واختيار «ألسنة» يحفظ قدرًا من الغموض اللفظي في هذه الآية، بينما يبيّن السياق في أعمال 2:6–11 أن السامعين أدركوا الكلام بلغاتهم.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «يمنحهم أن ينطقوا» للمحافظة على فاعلية الروح وعلى معنى الكلام المُمكَّن، مع تجنب العبارة الجامدة «يعطيهم نطقًا».
