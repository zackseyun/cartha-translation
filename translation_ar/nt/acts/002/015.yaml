lexical_decisions:
- source_word: οὐ γὰρ
  choice: فـ... ليسوا
  rationale: تنقل الفاء القوة التفسيرية والجدلية لـγάρ، ويعبّر النفي بـ«ليسوا» بوضوح عن إنكار الاتهام.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: كما تظنون
  rationale: «تظنون» مقابل عربي طبيعي لـὑπολαμβάνετε في معنى الافتراض أو الاعتقاد، وصيغة الجمع تحفظ الخطاب المباشر.
- source_word: οὗτοι
  choice: هؤلاء
  rationale: يحافظ اسم الإشارة على دلالة اليونانية من غير إضافة «الرجال» أو «الناس».
- source_word: μεθύουσιν
  choice: سكارى
  rationale: يؤدي الخبر الاسمي «سكارى» معنى حالة السُّكر المزعومة بصورة طبيعية موجزة في العربية.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: فالساعة الآن هي الثالثة من النهار
  rationale: تحفظ العبارة نظام عدّ الساعات الوارد في النص، وتوضح «الآن» الزمن الحاضر الذي تدل عليه ἔστιν في السياق، بينما تنقل الفاء تعليل γάρ.
- source_word: ὥρα τρίτη
  choice: الساعة الثالثة
  rationale: ترجمة قريبة من التعبير الزمني الأصلي، مع بيان مقابله بالتوقيت الحديث في الحاشية.
