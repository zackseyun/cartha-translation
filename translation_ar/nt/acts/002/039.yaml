  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: ar
  text: لِأَنَّ الْوَعْدَ هُوَ لَكُمْ وَلِأَوْلَادِكُمْ وَلِجَمِيعِ الَّذِينَ عَلَى بُعْدٍ[a]، كُلَّ مَنْ يَدْعُوهُ الرَّبُّ إِلَهُنَا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لجميع البعيدين». قد تشير العبارة إلى البعيدين جغرافيًا، أو البعيدين من جهة العهد، أو إلى المعنيين معًا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لجميع الذين على بُعد، كلَّ من يدعوه الرب إلهنا». يفيد التركيب اليوناني جماعة غير محددة لكنها شاملة: جميع الذين يدعوهم الرب إلهنا.'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: لِأَنَّ
  rationale: تربط الجملة بما سبق وتبيّن أساس دعوة بطرس، وهي صياغة عربية طبيعية وواضحة.
- source_word: ἐπαγγελία
  choice: الْوَعْدَ
  rationale: ينص اليوناني على الوعد نفسه، لا على «العطية الموعودة»، مع أن السياق السابق يتحدث عن عطية الروح القدس.
- source_word: τέκνοις
  choice: أَوْلَادِكُمْ
  rationale: لفظ عربي مألوف يحفظ المعنى العائلي ويمكن أن يشمل الأبناء والذرية من غير تحديد لأعمارهم.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: لِجَمِيعِ الَّذِينَ هُمْ فِي الْبَعِيدِ
  rationale: يحفظ صورة البعد في الأصل وصداها الكتابي، من غير حصرها في البعد الجغرافي أو العهدي.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: كُلِّ مَنْ يَدْعُوهُ
  rationale: ينقل المجموعة الشاملة غير المحددة التي يدل عليها التركيب، من غير إضافة «إليه» التي ليست صريحة في النص.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: الرَّبُّ إِلَهُنَا
  rationale: يحفظ اللقب الإلهي والضمير كما في الأصل، ويعرّف بوضوح فاعل الدعوة.
theological_decisions:
- issue: مدى عبارة «الذين هم في البعيد»
  choice: إبقاء العبارة عامة من غير قصرها على اليهود المقيمين بعيدًا أو على الأمم.
  alternative: تفسيرها حصريًا بالشتات اليهودي، أو حصريًا بالأمم.
  rationale: يحتمل التعبير بُعدًا جغرافيًا وبُعدًا من جهة العهد، ولا يحسم العدد وحده أحد الاحتمالين.
- issue: طبيعة الدعوة الإلهية في «كل من يدعوه الرب»
  choice: صياغة قريبة من النص لا تحدد آلية الدعوة لاهوتيًا.
  alternative: تفسيرها بالدعوة الفعالة حصرًا، أو بالدعوة العامة حصرًا.
  rationale: يثبت النص أن الوعد يخص من يدعوهم الرب، لكنه لا يشرح هنا كيفية هذه الدعوة أو نظامها الخلاصي.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية وقورة. استُعمل «في البعيد» للحفاظ على الصورة الأصلية وصداها الكتابي، مع إيضاح سعتها الدلالية في الحاشية. وُضع التشكيل الجزئي لتيسير القراءة من غير إثقال النص.
