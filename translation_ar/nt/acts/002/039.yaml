review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام محفوظ: الوعد موجَّه إلى المخاطَبين وأولادهم وإلى البعيدين ضمن نطاق من يدعوهم الرب إلهنا. لكن «كلِّ مَنْ» مجرورة بعد فاصلة على نحو لا يستقيم نحويًا بوصفها بيانًا لـ«جميع»، والأدق نصبها: «كلَّ مَنْ».'
  naturalness: «الذين هم في البعيد» مفهومة لكنها متكلفة في العربية الفصحى المعاصرة. «الذين على بُعد» صياغة أوضح وأفصح، وتحافظ على عدم تعيين نوع البعد. والتركيب الاستئنافي بعد الفاصلة مناسب للنبرة الكتابية حين يضبط بالنصب.
  terminology: «الوعد»، «أولادكم»، و«الرب إلهنا» اختيارات سليمة. لا تضيف الصياغة المنقحة «إليه»، إذ إن هذا غير مصرّح به في اليونانية. ولا تحسم هوية «البعيدين» أو طبيعة الدعوة لاهوتيًا.
  issues:
  - severity: medium
    issue: خطأ إعرابي في «كُلِّ مَنْ»
    rationale: العبارة تأتي بيانًا/بدلًا توضيحيًا بعد «لِجَمِيعِ الَّذِينَ ...»، فتكون في محل جر إن عوملت بدلًا كاملًا مع إضافة اللام، لكن النص الحالي لا يشتمل على اللام الثانية ولا يبنيها تركيبًا بدليًا سليمًا. والصياغة الكتابية المقصودة تجعل «كلَّ مَنْ» مفعولًا به/بيانًا لنطاق «جميع»، فتحتاج إلى النصب.
  - severity: low
    issue: «الذين هم في البعيد» غير طبيعية نسبيًا
    rationale: التعبير العربي المألوف هو «الذين على بُعد» أو «البعيدين». «على بُعد» يحفظ اتساع الدلالة الجغرافية أو العهدية دون تكلّف.
  - severity: medium
    issue: الحاشية b لا تمثل التركيب البديل بوضوح
