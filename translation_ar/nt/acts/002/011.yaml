  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: ar
  text: يهودًا ومعتنقين اليهودية، وكريتيين وعربًا، نسمعهم يتكلمون بلغاتنا نحن[a] عن أعمال الله العظيمة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بألسنتنا نحن». يمكن للكلمة اليونانية أن تعني «ألسنة» أو «لغات»، والسياق هنا يرجّح لغات بشرية مفهومة.'
    reason: بيان البديل المعجمي والمحافظة على مدى دلالة اللفظ اليوناني.
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: يهودًا
  rationale: يدل السياق على اليهود بوصفهم جماعة دينية وعرقية ضمن الحاضرين، لا على سكان اليهودية وحدهم. وجاء النصب لأن العبارة تتابع قائمة الآية السابقة.
- source_word: τε καὶ
  choice: و... و
  rationale: الاقتران العربي يربط اليهود بالمتهودين ربطًا طبيعيًا، من غير إثقال العبارة بصيغة حرفية غير لازمة.
- source_word: προσήλυτοι
  choice: متهوِّدين
  rationale: المقصود أناس من غير اليهود دخلوا في اليهودية؛ وهذا اللفظ أدق من «مهتدين» أو «متحولين» إذا وردا بلا تقييد.
- source_word: Κρῆτες
  choice: كريتيين
  rationale: النسبة العربية المألوفة إلى جزيرة كريت، مع النصب انسجامًا مع القائمة.
- source_word: Ἄραβες
  choice: عربًا
  rationale: المقابل العربي الطبيعي المباشر لاسم الجماعة.
- source_word: ἀκούομεν
  choice: نسمع
  rationale: يحافظ على المضارع وعلى معنى الاختبار المباشر في المشهد.
- source_word: λαλούντων αὐτῶν
  choice: نسمعهم يتكلمون
  rationale: صياغة عربية طبيعية لبنية السماع مع اسم الفاعل، وتحافظ على المعنى العام للفعل من غير تحويله إلى «يعلنون».
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: بلغاتنا نحن
  rationale: «لغات» أوضح في هذا السياق الذي يصف جماعات تسمع كلامًا مفهومًا، و«نحن» تُظهر توكيد ضمير الملكية في اليونانية.
- source_word: τὰ μεγαλεῖα
  choice: أعمال الله العظيمة
  rationale: ينقل معنى الأمور أو الأفعال العظيمة المنسوبة إلى الله بصياغة عربية واضحة، من غير تحديد أعمال بعينها.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: أُدمجت الإضافة في التركيب العربي الطبيعي «أعمال الله العظيمة»، مع بقاء نسبة الأعمال إلى الله واضحة.
theological_decisions:
- issue: دلالة γλώσσαις في سياق يوم الخمسين
  choice: لغات بشرية مفهومة
  alternative: ألسنة أو نطق وجداني غير مفهوم
  rationale: السياق المباشر يشدد على أن الحاضرين من شعوب متعددة يسمعون بوسائطهم اللغوية الخاصة. ومع ذلك تُذكر «ألسنتنا» في الحاشية بوصفها المقابل اللفظي الممكن، من غير إدخال جدل لاهوتي لاحق في نص الآية.
- issue: دلالة τὰ μεγαλεῖα
  choice: أعمال الله العظيمة
  alternative: عظائم الله أو الأمور العظيمة التي لله
  rationale: اللفظ يمكن أن يشير إجمالًا إلى عظائم الله أو أفعاله الجليلة. اختيرت صياغة مفهومة لا تعيّن أحداثًا بعينها ولا تحصر المقصود في التسبيح اللفظي.
translation_notes:
  register: لغة عربية فصحى واضحة ومعاصرة ذات نبرة وقورة. حُفظت هيئة القائمة المتصلة بما قبلها باستعمال المنصوب، ووُضعت علامة الحاشية بعد «لغاتنا نحن» لأنها تتعلق بلفظ γλώσσαις.
