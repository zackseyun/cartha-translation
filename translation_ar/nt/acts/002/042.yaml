  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: ar
  text: وكانوا يواظبون على تعليم الرسل، وعلى الشركة[a]، وكسر الخبز[b]، والصلوات[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المشاركة»، أو «التقاسم»، أو «الاتحاد في حياة مشتركة».
    reason: lexical_alternative
  - marker: b
    text: قد يشير «كسر الخبز» إلى الوجبات المشتركة عمومًا، مع أن كثيرين يفهمون أنه يشمل هنا عشاء الرب.
    reason: alternative_reading
  - marker: c
    text: أو «الصلوات المعيَّنة»؛ فقد تفيد أداة التعريف أوقاتًا أو صيغًا معروفة للصلاة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: وكانوا يواظبون
  rationale: التركيب المحيطي في صيغة الماضي الناقص يدل على عمل مستمر معتاد في الزمن الماضي، و«يواظبون» تنقل معنى الاستمرار والثبات في الالتزام.
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: على تعليم الرسل
  rationale: «تعليم» لفظ طبيعي واضح، والإضافة تفيد التعليم الذي كان الرسل يقدّمونه، من غير أن توحي بالضرورة بمنظومة عقائدية مصاغة.
- source_word: τῇ κοινωνίᾳ
  choice: على الشركة
  rationale: «الشركة» تحفظ اتساع اللفظ اليوناني، الذي قد يشمل الحياة المشتركة والمشاركة والاتحاد في جماعة، من غير حصره في تقاسم الأموال أو في معنى طقسي.
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: وكسر الخبز
  rationale: يحافظ التعبير على الصياغة اللوقاوية المألوفة من غير أن يحسم هل المقصود وجبات مشتركة عمومًا أم ما يشمل عشاء الرب.
- source_word: ταῖς προσευχαῖς
  choice: والصلوات
  rationale: صيغة الجمع المعرّفة تقابل النص اليوناني، وقد تشير إلى صلوات معروفة أو إلى أوقات وصيغ محددة للصلاة.
theological_decisions:
- issue: هل يُفسَّر κλάσει τοῦ ἄρτου صراحة بأنه عشاء الرب؟
  choice: كسر الخبز
  alternative: عشاء الرب؛ أو الإفخارستيا؛ أو الوجبات المشتركة التي تشمل عشاء الرب
  rationale: يمكن أن يدل التعبير في لوقا وأعمال الرسل على تناول الطعام معًا، وقد يشمل في السياق المسيحي الوجبة التذكارية التي أسسها يسوع، لكن العبارة نفسها لا تحسم ذلك؛ لذلك أُبقيت عامة مع بيان الاحتمال في الحاشية.
- issue: هل تُحصر κοινωνία في تقاسم الممتلكات أو في شركة طقسية؟
  choice: الشركة
  alternative: المشاركة؛ التقاسم؛ شركة التناول
  rationale: يدل اللفظ على المشاركة والحياة المشتركة في الجماعة، وربما يشمل أبعادًا مادية وروحية؛ وحصره في معنى واحد يضيّق دلالته قبل أن يسمح السياق بذلك.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «يواظبون» لإبراز الاستمرار والثبات، وحُفظت العبارات الواسعة دلاليًا من غير تحميلها تفسيرًا طائفيًا. وُضعت علامات الحواشي عند الألفاظ التي تشرحها مباشرة.
