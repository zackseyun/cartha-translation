  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: ar
  text: هذا، الذي سُلِّم بحسب تدبير الله المحدَّد وعلمه السابق، قتلتموه إذ سمَّرتموه على الصليب بأيدي أناس لا شريعة لهم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον
  choice: هذا
  rationale: اسم الإشارة في محل المفعول ويعود إلى يسوع المذكور في السياق؛ و«هذا» يحفظ قوة الإشارة بصورة طبيعية في العربية.
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: بحسب تدبير الله المحدَّد
  rationale: تفيد صيغة الداتيف هنا المعيار أو الأساس، و«التدبير المحدَّد» ينقل معنى قصد سبق تعيينه من غير لغة قديمة متكلَّفة.
- source_word: καὶ προγνώσει
  choice: وعلمه السابق
  rationale: ينقل معنى πρόγνωσις بوضوح، مع إبقاء التمييز بين التدبير الإلهي والعلم السابق.
- source_word: ἔκδοτον
  choice: أُسلِم
  rationale: ينقل معنى كونه قد سُلِّم أو أُعطي إلى أيدي آخرين، ويحافظ على الصيغة المبنية للمجهول دون تعيين فاعل لا يصرّح به اللفظ.
- source_word: διὰ χειρὸς ἀνόμων
  choice: بأيدي أناس لا شريعة لهم
  rationale: تؤدي «بأيدي» معنى الوساطة أو الأداة على نحو عربي طبيعي، و«أناس لا شريعة لهم» تحفظ الصلة الدلالية بـἄνομος، الذي قد يشير في السياق إلى من هم خارج الشريعة، دون اختزاله في مجرد الشر الأخلاقي.
- source_word: προσπήξαντες
  choice: إذ سمَّرتموه على صليب
  rationale: الفعل يدل على التثبيت بالمسامير، وسياق الإعدام يبرر التصريح بالصليب الذي يتضمنه الحدث.
- source_word: ἀνείλατε
  choice: قتلتموه
  rationale: تعبير مباشر وقوي يطابق اتهام بطرس ويحفظ مسؤولية المخاطَبين.
theological_decisions:
- issue: العلاقة بين تدبير الله ومسؤولية البشر
  choice: إثبات أن تسليم يسوع كان بحسب تدبير الله المحدَّد وعلمه السابق، مع توجيه مسؤولية قتله إلى المخاطَبين.
  alternative: تخفيف دلالة التعيين الإلهي، أو حصر المسؤولية في منفذي الحكم وحدهم.
  rationale: يجمع النص اليوناني صراحة بين القصد الإلهي السابق ومساءلة المخاطَبين؛ لذلك تُحفظ هذه المفارقة اللاهوتية دون حلّها وفق مذهب بعينه.
- issue: دلالة ἀνόμων
  choice: أناس لا شريعة لهم
  alternative: أناس أشرار أو مخالفو الشريعة
  rationale: قد يدل اللفظ هنا على منفذي الإعدام من الأمم الذين هم خارج شريعة موسى، وقد يحمل كذلك إيحاءً سلبيًا؛ فالصياغة المختارة تحفظ الصلة بالشريعة ولا تحسم المرجع في معنى أخلاقي صرف.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «بحسب» لبيان أن التسليم جرى وفق التدبير والعلم السابق، و«بأيدي» بوصفه التعبير العربي الطبيعي عن الوكالة البشرية. لم تُضف حواشٍ لأن البدائل المهمة أمكن توثيقها في القرارات المعجمية واللاهوتية دون إثقال نص الآية.
