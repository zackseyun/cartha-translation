lexical_decisions:
- source_word: ὤφθησαν
  choice: ظهرت
  rationale: ينقل الفعل المبني للمجهول ذي الدلالة الحدثية هنا بمعنى صارت مرئية لهم، وصيغة «ظهرت» عربية طبيعية ومباشرة.
- source_word: αὐτοῖς
  choice: لهم
  rationale: يحفظ دلالة المجرور الدالة على الأشخاص الذين ظهر لهم المشهد.
- source_word: διαμεριζόμεναι
  choice: متقسِّمة
  rationale: صفة حالية مؤنثة جمعًا توافق «ألسنة»، وتحفظ احتمال كون الألسنة في حال انقسام أو توزّع دون حسم آلية ذلك.
- source_word: γλῶσσαι
  choice: ألسنة
  rationale: يحفظ الصورة البصرية لشكل اللسان، مع إبقاء الصلة المعجمية بالكلام واللغات في السياق اللاحق، بخلاف «لهب» التي تختزل الدلالة.
- source_word: ὡσεὶ πυρός
  choice: كأنها من نار
  rationale: يحفظ التشبيه ولا يقرر أن الظاهرة كانت نارًا حرفية؛ وصياغة «كأنها من نار» فصيحة وواضحة.
- source_word: ἐκάθισεν
  choice: استقرَّت
  rationale: يحفظ إفراد الفعل اليوناني بضمير مؤنث مفرد يعود طبيعيًا في العربية إلى الظاهرة أو الهيئة الموزعة بوصفها وحدة جمعية، ويتجنب حرفية «جلست» غير الملائمة.
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: على كلِّ واحد منهم
  rationale: يحفظ التشديد التوزيعي على وصول العلامة إلى كل فرد.
theological_decisions:
- issue: طبيعة الظهور يوم الخمسين
  choice: ألسنة كأنها من نار
  alternative: ألسنة نارية / ألسنة بمعنى لغات / ألسنة من نار حرفية
  rationale: النص يستعمل أداة تشبيه مع لفظ «ألسنة»، ولذلك تُصان الصورة المرئية وصلتها بالكلام مع عدم تحويلها إلى نار حرفية أو تفسيرها مسبقًا بأنها لغات فقط.
- issue: إفراد الفعل ἐκάθισεν بعد جمع «ألسنة»
  choice: واستقرَّت
  alternative: واستقررن / واستقر كل لسان
  rationale: الإفراد في النص المصدر حقيقي ويحتمل النظر إلى الظاهرة الموزعة بوصفها كُلًّا واحدًا؛ لذلك لم يُسوَّ إلى الجمع ولم يُضف فاعل تفسيري غير مذكور.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. أُبقيت «ألسنة» لما تحمله من صورة بصرية وصلة بالسياق اللاحق، وحُفظ إفراد الفعل الأخير والتباس علاقة «متقسِّمة» بالألسنة وتوزعها.
