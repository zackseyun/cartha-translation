  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: ar
  text: ويكون أن كلُّ من يدعو باسم الرب يُخلَّص[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويكون أن مَن يدعو باسم الرب يُخلَّص». ترد العبارة صدى يوئيل 2:32، حيث يشير «الرب» إلى يهوه؛ وفي أعمال الرسل يورد بطرس الاقتباس ضمن كرازته عن يسوع.'
    reason: صياغة بديلة وبيان خلفية الاقتباس مع الحفاظ على التوتر في مرجع «الرب».
lexical_decisions:
- source_word: ἔσται
  choice: ويكون
  rationale: صيغة مستقبلية في افتتاح اقتباس نبوي؛ «ويكون» تحافظ على النبرة الكتابية الوقورة، ويُفهم الاستقبال من السياق.
- source_word: πᾶς ὃς ἐὰν
  choice: كلَّ من
  rationale: تؤدي معنى الشرط العام غير المحدد وتحفظ شمول العبارة بلغة عربية طبيعية.
- source_word: ἐπικαλέσηται
  choice: يدعو باسم
  rationale: الفعل مع «الاسم» يفيد الالتجاء إلى الرب واستدعاءه؛ وهذه الصياغة تحافظ على التعبير الكتابي المألوف دون تضييق دلالته.
- source_word: τὸ ὄνομα
  choice: باسم
  rationale: حُفظ ذكر «الاسم» لأنه جزء جوهري من التعبير الكتابي ويحمل دلالات العبادة والاتكال.
- source_word: κυρίου
  choice: الرب
  rationale: ترجمة مباشرة لـ κύριος، وتحافظ على صلة الاقتباس بسياقه في يوئيل وعلى التوتر الدلالي في خطاب بطرس.
- source_word: σωθήσεται
  choice: يخلُص
  rationale: ينقل صيغة المستقبل المبني للمجهول لـ σῴζω بصياغة عربية موجزة مألوفة، مع إبقاء دلالتي الإنقاذ والخلاص.
theological_decisions:
- issue: مرجع «الرب» في اقتباس يوئيل كما استُخدم في أعمال الرسل
  choice: إبقاء «الرب» في المتن دون تحديد المرجع
  alternative: تعيينه صراحةً بيهوه بحسب سياق يوئيل، أو بيسوع بحسب السياق المسيحاني في أعمال الرسل
  rationale: النص اليوناني يقول «الرب». وفي يوئيل يشير اللقب إلى يهوه، بينما يورده بطرس ضمن كرازته المتمحورة حول يسوع؛ لذلك تحافظ الترجمة على اللفظ والتوتر اللاهوتي من غير حسم تفسيري زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «ويكون» للمحافظة على طابع الاقتباس النبوي، و«كل من» لإبراز الشمول، مع إبقاء «الرب» بلا تفسير داخل المتن.
