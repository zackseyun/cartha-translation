  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: ar
  text: فالذين قبلوا كلامه عُمِّدوا، وأُضيف في ذلك اليوم نحو ثلاثة آلاف نفس[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «شخص» أو «إنسان». اللفظ اليوناني المترجم «نفس» أسلوب شائع في عدّ البشر.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: فالذين
  rationale: تربط الفاء النتيجة بما سبق من خطاب بطرس واستجابة السامعين، من غير إثقال العبارة بأداة استنتاج رسمية.
- source_word: ἀποδεξάμενοι
  choice: قبلوا
  rationale: يفيد الفعل استقبال الكلام استقبالا إيجابيا. و«قبلوا» واضحة وطبيعية وتحفظ هذا المعنى دون زيادة تفسيرية.
- source_word: λόγον
  choice: كلامه
  rationale: «كلام» مقابل مباشر وطبيعي لـλόγος هنا، والمقصود ما أعلنه بطرس، مع بقاء اللفظ قريبا من الأصل.
- source_word: ἐβαπτίσθησαν
  choice: عُمِّدوا
  rationale: صيغة المبني للمجهول تقابل المبني للمجهول في اليونانية، وتذكر الحدث دون تحديد طريقة التعميد أو تقرير أثر لاهوتي خاص له.
- source_word: προσετέθησαν
  choice: أُضيف
  rationale: يحفظ معنى الإضافة وصيغة المبني للمجهول، ولا يصرح بالجهة التي أُضيفوا إليها لأنها غير مذكورة في الآية.
- source_word: ψυχαὶ
  choice: نفس
  rationale: ترجمة شفافة للفظ اليوناني، وهو هنا أسلوب لعد البشر. أُثبت المعنى الاصطلاحي البديل في الحاشية تجنبا لفهمه تقريرا أنثروبولوجيا تقنيا.
- source_word: ὡσεὶ τρισχίλιαι
  choice: نحو ثلاثة آلاف
  rationale: «نحو» تنقل دلالة التقريب في ὡσεὶ بعبارة عربية موجزة وطبيعية.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: في ذلك اليوم
  rationale: تعبير زمني عربي فصيح وطبيعي يقابل العبارة اليونانية مباشرة.
theological_decisions:
- issue: تعيين الجهة التي أُضيف إليها المؤمنون
  choice: 'إبقاء المفعول أو الجهة غير مصرّح بها: «أُضيف»'
  alternative: أُضيفوا إليهم؛ أُضيفوا إلى الكنيسة
  rationale: السياق يدل على الانضمام إلى جماعة المؤمنين، لكن نص الآية لا يذكر الجهة صراحة، لذلك تُحفظ صياغة الأصل ولا تُزاد عبارة كنسية تفسيرية.
- issue: الدلالة الأنثروبولوجية للفظ ψυχαί
  choice: «نفس» في المتن مع بيان «شخص/إنسان» في الحاشية
  alternative: أشخاص؛ أناس
  rationale: يحفظ المتن اللفظ اليوناني بشفافية، وتمنع الحاشية أن يُفهم منه بالضرورة تقرير تقني عن الجزء غير المادي من الإنسان.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة كتابية رصينة. استُخدم المبني للمجهول في «عُمِّدوا» و«أُضيف» لمجاراة الصيغ اليونانية، مع تجنب أي تحديد لطريقة التعميد أو للجهة التي تمت الإضافة إليها.
