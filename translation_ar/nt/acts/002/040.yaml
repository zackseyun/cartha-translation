  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: ar
  text: 'وبكلماتٍ أخرى كثيرة، أدلى أمامهم بشهادةٍ مؤكدة، وكان يحثّهم قائلًا: «لِتُنقَذوا[a] من هذا الجيل الملتوي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انجوا من هذا الجيل الملتوي». الفعل اليوناني أمر مبني للمجهول («لِتُنقَذوا»)، مع أنه دعوة إلى استجابة السامعين.'
    reason: توضيح صيغة الفعل اليوناني وذكر البديل العربي الممكن من غير نسبة الخلاص الذاتي إلى السامعين.
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: بكلام آخر كثير
  rationale: صياغة عربية طبيعية تحفظ معنى «آخر» و«كثير»، وتبيّن أن بطرس واصل حديثه بعبارات عديدة غير المذكورة.
- source_word: διεμαρτύρατο
  choice: شهد لهم ... شهادةً مؤكدة
  rationale: تنقل قوة الشهادة الجادة والمؤكدة في الفعل، من غير اختزالها في مجرد التحذير.
- source_word: παρεκάλει
  choice: ظل يحثّهم
  rationale: «ظل» تنقل دلالة الاستمرار أو التكرار في صيغة الماضي الناقص، و«يحثّ» تلائم قوة الالتماس والإرشاد في السياق.
- source_word: Σώθητε
  choice: اخلصوا
  rationale: يحافظ هذا الضبط على المبني للمجهول في الأمر اليوناني، ويترك جهة الفاعل غير مصرّح بها، مع بقاء الدعوة الحقيقية إلى الاستجابة.
- source_word: ἀπὸ
  choice: من
  rationale: تنقل معنى الانفصال أو النجاة من الشيء بصورة مباشرة وطبيعية.
- source_word: γενεᾶς
  choice: الجيل
  rationale: المقابل المباشر الذي قد يدل على المعاصرين بوصفهم جيلًا، ويحفظ الصدى الكتابي للكلمة.
- source_word: σκολιᾶς
  choice: الملتوي
  rationale: يحفظ الصورة الأخلاقية المكانية في اليونانية، وهو واضح في العربية المعاصرة من غير مبالغة تفسيرية.
theological_decisions:
- issue: صيغة الفعل والفاعلية في Σώθητε
  choice: اخلصوا، بضبط الهمزة للوصل والخاء بالسكون واللام بالفتح، أي فعل أمر مبني للمجهول
  alternative: خلّصوا أنفسكم
  rationale: الفعل اليوناني أمر مبني للمجهول؛ لذا تُحفظ صيغة «اخلصوا» لتجنب نسبة الخلاص الذاتي إلى السامعين، مع الحفاظ على كون الكلام دعوة ملزمة إلى الاستجابة.
translation_notes:
  register: لغة عربية فصحى واضحة وموقرة. استُعمل «شهد ... شهادةً مؤكدة» لإظهار قوة διαμαρτύρομαι، و«ظل يحثّهم» لنقل الاستمرار. ينبغي حذف النجمة النهائية بعد علامة الاقتباس؛ أُدرجت سهوًا طباعيًا ولا تقابل أي حاشية.
