lexical_decisions:
- source_word: ἕτεροι
  choice: آخرين
  rationale: الصفة مستعملة استعمال الاسم وتشير إلى جماعة مختلفة من الحاضرين؛ وصيغة «آخرين» طبيعية بعد «لكن» مع الفعل اللاحق.
- source_word: δὲ
  choice: لكن
  rationale: تفيد المقابلة مع حيرة السامعين وتساؤلهم في السياق السابق.
- source_word: διαχλευάζοντες
  choice: كانوا يستهزئون
  rationale: تنقل معنى السخرية الازدرائية بعبارة عربية واضحة، وتندمج مع الفعل الناقص للدلالة على الحدث الجاري.
- source_word: ἔλεγον
  choice: ويقولون
  rationale: صيغة «كانوا... ويقولون» تحفظ دلالة الماضي الناقص على القول المستمر أو المتكرر.
- source_word: ὅτι
  choice: «إنهم... »
  rationale: أُدخل مضمون القول في اقتباس مباشر، وهو أسلوب عربي طبيعي يحفظ وظيفة الأداة في تقديم كلامهم.
- source_word: Γλεύκους
  choice: النبيذ الحلو
  rationale: تشير اللفظة إلى شراب عنب حلو حديث أو طازج؛ و«النبيذ الحلو» أدق دلاليًا من «الخمر الجديدة» مع إبقاء البديل في الحاشية.
- source_word: μεμεστωμένοι
  choice: ممتلئون
  rationale: تحفظ صورة الامتلاء وحالة الفاعلين الناتجة التي يدل عليها اسم المفعول التام.
- source_word: εἰσίν
  choice: إنهم ممتلئون
  rationale: استُعملت الجملة الاسمية العربية مع «إنّ» بعد فعل القول لإتمام الخبر بصورة طبيعية.
