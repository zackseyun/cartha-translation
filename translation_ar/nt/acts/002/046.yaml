  terminology: «ساحات الهيكل» مناسب لـἱερόν، مع الحاشية المبيّنة لتمييزه من المقدس الداخلي. و«كسر الخبز» يحفظ الغموض المقصود من غير فرض قراءة طقسية. و«بساطة قلب» تحافظ على اتساع ἀφελότης.
