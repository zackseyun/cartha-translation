  to: وكانوا، يومًا بعد يوم، يواظبون بقلب واحد في ساحات الهيكل[a]، ويكسرون الخبز من بيت إلى بيت[c]، ويتناولون الطعام بابتهاج وبساطة قلب[b].
  rationale: عُدِّلت «يثابرون» إلى «يواظبون» لتحسين ملاءمة الفعل للسياق مع الحفاظ على الاستمرار، وعُدِّلت «في البيوت» إلى «من بيت إلى بيت» لإظهار الدلالة التوزيعية في الأصل. كما نُقلت علامات الحواشي إلى العبارات التي تشرحها، من غير تغيير المعنى أو حسم دلالة «كسر الخبز».
