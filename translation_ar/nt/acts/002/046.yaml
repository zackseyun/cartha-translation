  source_fidelity: 'المعنى العام محفوظ: المواظبة اليومية المتّحدة في مجمع الهيكل، وكسر الخبز في البيوت، وتناول الطعام بفرح وبساطة قلب. لكن «في البيوت» لا تُظهر بوضوح الدلالة التوزيعية في κατ’ οἶκον («من بيت إلى بيت»)، كما أن «يواظبون» أنسب من «يثابرون» مع الوجود/الممارسة المستمرة في ساحات الهيكل.'
