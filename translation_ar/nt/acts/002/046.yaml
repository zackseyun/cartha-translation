  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: ar
  text: وكانوا، يومًا بعد يوم، يواظبون بقلب واحد في ساحات الهيكل[a]، ويكسرون الخبز من بيت إلى بيت[c]، ويتناولون الطعام بابتهاج وبساطة قلب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني يشير إلى مجمع الهيكل كله، لا إلى المقدس الداخلي وحده.
    reason: cultural_note
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «بإخلاص قلب» أو «بسخاء قلب».'
    reason: lexical_alternative
  - marker: c
    text: قد يُراد بـ«كسر الخبز» تناول الطعام معًا، ويرى بعضهم أنه يشمل أيضًا عشاء الرب.
    reason: alternative_reading
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: يومًا بعد يوم
  rationale: ينقل الدلالة التوزيعية المتكررة للتعبير اليوناني بعبارة عربية طبيعية.
- source_word: προσκαρτεροῦντες
  choice: يثابرون
  rationale: يفيد الاستمرار والمداومة، ويحافظ على قوة اسم الفاعل المضارع دون تحميله معنى تعبديًا أضيق.
- source_word: ὁμοθυμαδόν
  choice: بقلب واحد
  rationale: تعبير عربي واضح يجمع معنى الوحدة والاتفاق في القصد، ولا يكتفي بمجرد الوجود معًا.
- source_word: ἐν τῷ ἱερῷ
  choice: في ساحات الهيكل
  rationale: ἱερόν يدل على مجمع الهيكل، لا على المقدس الداخلي تحديدًا؛ وإضافة «ساحات» توضّح ذلك للقارئ.
- source_word: κλῶντές ... ἄρτον
  choice: يكسرون الخبز
  rationale: يحفظ الاصطلاح اللوقاوي الواسع، الذي قد يدل على الأكل المشترك وقد يحمل أيضًا صدى عشاء الرب، من غير حسم زائد.
- source_word: κατ’ οἶκον
  choice: في البيوت
  rationale: ينقل المعنى التوزيعي، أي ممارسة الفعل في بيوت متعددة، بصياغة عربية طبيعية غير متكلفة.
- source_word: μετελάμβανον τροφῆς
  choice: يتناولون الطعام
  rationale: صياغة عربية مألوفة تعكس المشاركة الفعلية المستمرة في الطعام؛ وهي أقرب إلى الأصل من تخصيصه بالوجبات المشتركة، مع بقاء السياق الجماعي ظاهرًا.
- source_word: ἐν ἀγαλλιάσει
  choice: بابتهاج
  rationale: يحفظ معنى الفرح القوي في ἀγαλλίασις بلفظ فصيح مفهوم.
- source_word: ἀφελότητι καρδίας
  choice: بساطة قلب
  rationale: يحافظ على السعة الدلالية للفظ النادر، بما يشمل البساطة والإخلاص وعدم التكلف، من غير قصره على الكرم.
theological_decisions:
- issue: هل «كسر الخبز» إشارة صريحة إلى عشاء الرب أم إلى الطعام المشترك؟
  choice: الإبقاء على العبارة الواسعة «يكسرون الخبز» في المتن.
  alternative: ترجمتها بما يصرّح بأنها وجبات عادية فقط، أو بأنها عشاء الرب تحديدًا.
  rationale: العبارة في لوقا وأعمال الرسل يمكن أن تشير إلى مائدة عادية، وقد تحمل أيضًا دلالة إفخارستية. وذكر الطعام في السياق يرجح حضور الأكل المشترك، لكنه لا يوجب إسقاط الصدى الطقسي المحتمل؛ لذلك تُحفظ المسألة في صياغة غير حاسمة مع حاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على تتابع الأفعال المستمرة في السرد، وعلى الغموض المقصود في «كسر الخبز» و«بساطة قلب». وُضعت علامات الحواشي في المتن بحسب ترتيب ظهورها.
