  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: ar
  text: 'وقال: «يا ممتلئًا بكل مكر وكل خبث، يا ابن إبليس، يا عدوّ كل برّ[a]، أما تكفّ عن تحريف سبل الرب المستقيمة؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: كل عدل.'
    reason: بديل معجمي محتمل لكلمة δικαιοσύνη؛ والسياق يرجّح في المتن «البرّ» بمعنى الاستقامة الأخلاقية.
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: ممتلئًا من كل مكر
  rationale: ينقل معنى الامتلاء والاتصاف الشامل، و«المكر» تعبير عربي طبيعي عن الخداع المصحوب بالتدبير السيئ.
- source_word: πάσης ῥᾳδιουργίας
  choice: كل خبث
  rationale: يدل اللفظ على سوء الطوية والتصرف عديم الضمير، فـ«الخبث» يحفظ حدّة الاتهام من غير أن يطابق «المكر» في المعنى.
- source_word: υἱὲ διαβόλου
  choice: يا ابن إبليس
  rationale: يحافظ على صورة «الابن» في الأصل وعلى قوة التوبيخ، حيث تفيد العبارة المشابهة والانتماء الأخلاقي.
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: يا عدو كل برّ
  rationale: «البرّ» المقابل الكتابي المألوف لـδικαιοσύνη، ويعبّر هنا عن كل ما هو مستقيم وصالح أخلاقيًا.
- source_word: οὐ παύσῃ
  choice: أما تكفّ
  rationale: صياغة استفهامية توبيخية طبيعية في العربية، تحافظ على قوة المستقبل اليوناني المستعمل بلاغيًا.
- source_word: διαστρέφων
  choice: عن تحريف
  rationale: «التحريف» يفيد جعل المستقيم منحرفًا وتغيير وجهته، ويناسب صورة السبل المستقيمة.
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: سبل الرب المستقيمة
  rationale: «سبل» تلائم الاستعمال الحرفي والمجازي، و«المستقيمة» تحفظ التضاد المقصود مع التحريف.
- source_word: Ὦ
  choice: يا
  rationale: أداة النداء العربية الطبيعية التي تنقل الخطاب المباشر المؤكد، وتتكرر لتوضيح سلسلة أوصاف المخاطَب.
theological_decisions:
- issue: دلالة δικαιοσύνη
  choice: البرّ
  alternative: العدل
  rationale: السياق يصف العداء لكل ما هو مستقيم أخلاقيًا، ولذلك يلائم «البرّ» المعنى الأوسع هنا، مع بقاء «العدل» دلالة معجمية ممكنة في سياقات أخرى.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة، مع إبقاء حدّة التوبيخ وتتابع النداءات في الأصل. لا تستلزم الآية حاشية، إذ إن «البرّ» يؤدي المعنى السياقي من غير حاجة إلى حسم جدل تفسيري.
