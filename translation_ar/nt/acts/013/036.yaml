  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: ar
  text: فَإِنَّ دَاوُدَ، بَعْدَمَا خَدَمَ قَصْدَ اللهِ فِي جِيلِهِ[a]، رَقَدَ[b]، وَانْضَمَّ إِلَى آبَائِهِ[c]، وَرَأَى الْفَسَادَ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويُحتمل أيضًا: «بعدما خدم جيلَه بمشيئة الله».'
    reason: syntactic_ambiguity
  - marker: b
    text: «رقد» كناية كتابية عن الموت.
    reason: cultural_note
  - marker: c
    text: 'حرفيًّا: «أُضيف إلى آبائه»، وهو تعبير سامي يعني أنه لحق بأسلافه في الموت.'
    reason: lexical_alternative
  - marker: d
    text: أي إن جسده أصابه التحلل؛ وقارن المقابلة في الآية التالية.
    reason: contextual_note
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: فِي جِيلِهِ
  rationale: تنقل الدلالة الزمنية أو النطاق الذي جرت فيه خدمة داود، بصياغة عربية طبيعية، من غير أن تجعل الجيل بالضرورة هو المستفيد من الخدمة.
- source_word: ὑπηρετήσας
  choice: بَعْدَمَا خَدَمَ
  rationale: صيغة اسم الفاعل اليونانية تشير إلى فعل سبق الأفعال الرئيسة؛ و«بعدما خدم» توضح هذا التتابع وتحافظ على معنى الخدمة العام من غير صبغة كنسية أضيق.
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: قَصْدَ اللهِ
  rationale: تشير βουλή هنا إلى قصد الله أو تدبيره. و«قصد الله» واضحة ومعاصرة، وتحفظ معنى النية الإلهية من غير فرض بناء لاهوتي أضيق.
- source_word: ἐκοιμήθη
  choice: رَقَدَ
  rationale: تحفظ الاستعارة الكتابية المستعملة كناية عن الموت بدل تسويتها إلى «مات».
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: انْضَمَّ إِلَى آبَائِهِ
  rationale: صياغة عربية مفهومة تحفظ الأسلوب السامي الدال على اللحاق بالآباء في الموت، مع تجنب الحرفية الخشنة في «أُضيف» داخل المتن.
- source_word: εἶδεν διαφθοράν
  choice: رَأَى الْفَسَادَ
  rationale: تحفظ الصورة اللفظية وصداها مع اقتباس المزمور والسياق القريب، بينما توضح الحاشية أن المقصود فساد الجسد وتحلله.
theological_decisions:
- issue: العلاقة النحوية بين «جيله» و«قصد الله» وفعل الخدمة
  choice: خَدَمَ قَصْدَ اللهِ فِي جِيلِهِ
  alternative: خَدَمَ جِيلَهُ بِمُقْتَضَى قَصْدِ اللهِ
  rationale: تسمح صيغتا المجرور اليونانيتان بأكثر من تعلق نحوي. اختيرت القراءة الشائعة التي تجعل قصد الله متعلقًا مباشرة بالخدمة والجيل إطارها الزمني، مع إبقاء البديل الحقيقي في الحاشية بدل حسم الغموض بصمت.
- issue: الكناية عن موت داود
  choice: رَقَدَ
  alternative: مَاتَ
  rationale: يستعمل النص فعل النوم كناية عن الموت؛ وإبقاء «رقد» يحفظ الصورة الكتابية من غير استنتاج عقائدي إضافي بشأن حالة الموتى.
- issue: معنى الفساد في المقابلة المسيانية ضمن السياق
  choice: رَأَى الْفَسَادَ
  alternative: تَحَلَّلَ جَسَدُهُ
  rationale: يحفظ اللفظ صلة العبارة بالمزمور والمقابلة مع الآية التالية، فيما تشرح الحاشية أن الحديث هنا عن تحلل الجسد، دون إدخال هذا التفسير داخل المتن.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. أُبقيت صورتا «رقد» و«رأى الفساد» لما لهما من وظيفة بلاغية وسياقية، مع شرح معناهما في الحواشي. وُضعت علامات الحواشي في المتن بترتيب ظهورها.
