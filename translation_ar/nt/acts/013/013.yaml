revisions:
- from: ثم أبحر الذين مع بولس من بافوس، فوصلوا إلى برجة في بمفيلية؛ أما يوحنا ففارقهم ورجع إلى أورشليم.
  to: وبعد أن أبحر الذين مع بولس من بافوس، وصلوا إلى برجة في بمفيلية؛ أما يوحنا فغادرهم ورجع إلى أورشليم.
  rationale: تعديل أسلوبي محدود لتحسين تمثيل التتابع الزمني في النص اليوناني وجعل فعل مغادرة يوحنا أكثر حيادًا وطبيعية في العربية المعاصرة. لا يضيف النص المنقح دافعًا أو حكمًا أخلاقيًا على مغادرته، ويحافظ على غموض النص الأصلي في هذا الشأن.
