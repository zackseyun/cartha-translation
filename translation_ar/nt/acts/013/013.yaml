  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: ar
  text: وبعد أن أبحر الذين مع بولس من بافوس، وصلوا إلى برجة في بمفيلية؛ أما يوحنا فغادرهم ورجع إلى أورشليم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: أبحر
  rationale: يفيد الفعل في سياق السفر البحري الإقلاع بالسفينة؛ و«أبحر» تعبير عربي طبيعي وموجز يحفظ الدلالة البحرية.
- source_word: οἱ περὶ Παῦλον
  choice: الذين مع بولس
  rationale: يحفظ هذا التعبير صورة الاصطلاح اليوناني الدال على الجماعة المصاحبة لبولس، من غير تحويله صراحة إلى «بولس ورفاقه».
- source_word: ἦλθον
  choice: وصلوا
  rationale: في سرد الرحلة، ينقل «وصلوا» الحركة إلى الوجهة بوضوح وطبيعية، مع بقاء المعنى الأساسي للفعل اليوناني.
- source_word: Πέργην τῆς Παμφυλίας
  choice: برجة في بمفيلية
  rationale: تفيد الإضافة اليونانية تحديد موقع برجة ضمن إقليم بمفيلية، و«في» هي الصياغة العربية الطبيعية.
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: ففارقهم
  rationale: ينقل المغادرة والانفصال عن الجماعة بإيجاز، من غير أن يضيف حكمًا على دوافع يوحنا أو سلوكه.
- source_word: ὑπέστρεψεν
  choice: رجع
  rationale: ترجمة عربية مباشرة وطبيعية للفعل الذي يعني العودة.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الاسم العربي الكتابي الشائع للمدينة.
theological_decisions:
- issue: الدلالة المحتملة لمفارقة يوحنا للجماعة
  choice: ففارقهم
  alternative: تركهم / انسحب منهم
  rationale: الآية تذكر الفعل والعودة إلى أورشليم من غير بيان الدافع أو إصدار حكم أخلاقي؛ لذلك تُحفظ حيادية النص ولا تُستبق دلالة السياق اللاحق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم ترتيب سردي طبيعي، مع إبقاء «الذين مع بولس» قريبًا من التعبير اليوناني، وتجنب أي تفسير زائد لدافع يوحنا.
