review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام محفوظ: الإبحار من بافوس، والوصول إلى برجة في بمفيلية، ثم مغادرة يوحنا وعودته إلى أورشليم. لكن «ثم» لا تُظهر بوضوح علاقة الفعل اليوناني في صيغة اسم الفاعل/الحال («بعد أن أبحروا»)، ويمكن تحسينها من غير تغيير المعنى.'
  naturalness: الصياغة مفهومة وفصيحة في مجملها. واستبدال «ثم أبحر ... فوصلوا» بـ«وبعد أن أبحر ... وصلوا» يجعل التسلسل السردي والعلاقة بين الإبحار والوصول أكثر سلاسة في العربية المعاصرة. و«غادرهم» أشيع في الاستعمال المعاصر وأقل قابلية للإيحاء بتقييم لفعل يوحنا من «فارقهم».
  terminology: «بولس»، «بافوس»، «برجة»، «بمفيلية»، و«أورشليم» مناسبة ومستقرة في الاستعمال الكتابي العربي. ولا توجد مصطلحات لاهوتية تحتاج إلى معالجة خاصة في الآية.
  issues:
  - severity: low
    issue: تمثيل العلاقة الزمنية في Ἀναχθέντες
    rationale: «ثم أبحر ... فوصلوا» صحيح المعنى، لكن تركيب «وبعد أن أبحر ... وصلوا» يعكس بصورة أدق أن الإبحار فعل سابق ممهد للوصول، كما في اسم الفاعل اليوناني.
  - severity: low
    issue: اختيار «فارقهم» لـἀποχωρήσας ἀπ’ αὐτῶν
    rationale: لا يخطئ هذا الاختيار، لكن «غادرهم» أوضح في العربية الفصحى المعاصرة وأبقى على التقرير المحايد للمغادرة بلا إيحاءات إضافية.
  revised_text: وبعد أن أبحر الذين مع بولس من بافوس، وصلوا إلى برجة في بمفيلية؛ أما يوحنا فغادرهم ورجع إلى أورشليم.
