  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: ar
  text: ثم بعد أن صاموا وصلّوا ووضعوا أيديهم عليهما، أرسلوهما[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سمحوا لهما بالانصراف» أو «صرفوهما». ويفيد السياق أن برنابا وشاول مضيا في المهمة التي أُرسلا إليها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: ثم
  rationale: تفيد التتابع الزمني وتربط الفعل بما سبقه من توجيه الروح القدس.
- source_word: νηστεύσαντες
  choice: بعد أن صاموا
  rationale: ينقل اسم الفاعل الماضي بوصف الصوم فعلًا سابقًا للفعل الرئيس.
- source_word: προσευξάμενοι
  choice: وصلّوا
  rationale: يحافظ على تنسيق الأفعال التمهيدية في عبارة عربية طبيعية وواضحة.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: ووضعوا أيديهم عليهما
  rationale: يحفظ الفعل الملموس كما في اليونانية من غير فرض تفسير طقسي أو كنسي بعينه، ويبيّن بالتثنية أن المرجع برنابا وشاول.
- source_word: ἀπέλυσαν
  choice: أطلقوهما
  rationale: يحفظ المجال الدلالي للفعل، أي تركهما يمضيان أو صرفهما، مع إبقاء دلالة الإرسال في السياق للملاحظة الهامشية.
- source_word: αὐτοῖς
  choice: عليهما
  rationale: الضمير في تركيب وضع الأيدي يعود إلى برنابا وشاول، والتثنية العربية تجعل المرجع واضحًا.
theological_decisions:
- issue: طبيعة وضع الأيدي
  choice: 'وصف الفعل كما ورد: «وضعوا أيديهم عليهما»، دون تسميته رسامة أو سرًّا كنسيًّا.'
  alternative: تفسير الفعل بأنه رسامة أو بركة أو تكليف رسمي.
  rationale: الآية تذكر الصوم والصلاة ووضع الأيدي والإطلاق، لكنها لا تحدد بنفسها الطبيعة العقائدية أو الكنسية الدقيقة لهذا الفعل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة التثنية لأن المشار إليهما هما برنابا وشاول، وحُفظ الغموض الدلالي في الفعل الأخير بمتن قريب من الأصل مع توضيح البدائل في الحاشية.
