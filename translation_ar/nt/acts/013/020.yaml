  text: ⸂ὡς ἔτεσι τετρακοσίοις καὶ πεντήκοντα. καὶ μετὰ ταῦτα⸃ ἔδωκεν κριτὰς ἕως Σαμουὴλ ⸀τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: ar
  text: نحوَ أربعِ مئةٍ وخمسين سنةً[a]. وبعد ذلك أعطاهم قضاةً إلى صموئيل النبي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحسب بعض الترجمات، تُربط الإشارة الزمنية على نحو مختلف: «وأعطاهم قضاةً نحو أربع مئة وخمسين سنة، إلى صموئيل النبي». والعبارة اليونانية وعلامات الترقيم هنا موضع خلاف.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: نحوَ
  rationale: تفيد التقريب مع العدد من غير الإيحاء بأن الرقم دقيق تمامًا.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: أربعِ مئةٍ وخمسين سنةً
  rationale: تنقل مقدار المدة بصياغة عربية واضحة وطبيعية.
- source_word: καὶ μετὰ ταῦτα
  choice: وبعد ذلك
  rationale: تدل على تعاقب الأحداث، وهي أيسر في العربية المعاصرة من الترجمة الحرفية «وبعد هذه الأشياء».
- source_word: ἔδωκεν
  choice: أعطاهم
  rationale: تحافظ على المعنى الأساسي للفعل «أعطى»، وأُثبت ضمير المفعول ليتضح في العربية أن الله أعطى بني إسرائيل قضاة.
- source_word: κριτὰς
  choice: قضاةً
  rationale: المصطلح التاريخي المعروف لقادة إسرائيل في الحقبة السابقة للملكية.
- source_word: ἕως
  choice: إلى
  rationale: تعبّر طبيعيًا عن الحد الزمني المنتهي بصموئيل؛ و«حتى» بديل ممكن.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: صموئيل النبي
  rationale: تنقل الاسم واللقب التعريفي بصياغة عربية مألوفة.
theological_decisions:
- issue: موضع عبارة «نحو أربع مئة وخمسين سنة» وصلتها بما قبلها أو بعدها في نص صعب نقديًا ونحويًا
  choice: جعل العبارة جملة مدة مستقلة، ثم ترجمة «وبعد ذلك أعطاهم قضاةً إلى صموئيل النبي»، وفق ترتيب نص SBLGNT المزوَّد.
  alternative: 'وصل المدة بفترة القضاة: «وأعطاهم قضاةً نحو أربع مئة وخمسين سنة، إلى صموئيل النبي»، أو وصلها بالسياق السابق بحسب قرارات نصية وترقيمية أخرى.'
  rationale: يحافظ هذا الاختيار على ترتيب المصدر اليوناني المزوَّد ولا يحسم موضع العبارة المختلف فيه؛ ويُذكر الوجه الآخر في الحاشية صونًا للغموض الحقيقي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «وبعد ذلك» بدل الحرفية الثقيلة «وبعد هذه الأشياء»، مع إبقاء العبارة الزمنية مستقلة وإثبات علامة الحاشية في المتن.
