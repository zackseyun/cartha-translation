  source_fidelity: المعنى العام محفوظ، بما في ذلك الجرأة، وأولوية إعلان كلمة الله للمخاطَبين، ورفضهم لها، وحكمهم على أنفسهم، والتحول إلى غير اليهود. لكن «أن تُكلَّموا ... بكلمة الله» يجعل المخاطَبين في موضع الفاعل النحوي للفعل بصورة غير طبيعية، في حين أن اليونانية تجعل «كلمة الله» هي المعلَنة/المتكلَّم بها لهم.
