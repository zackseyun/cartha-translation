source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: ar
  text: 'فتكلَّم بولس وبرنابا بجرأة وقالا: «كان لا بد أن تُعلَن لكم كلمة الله أولًا. فبما أنكم ترفضونها وتحكمون على أنفسكم بأنكم غير مستحقين للحياة الأبدية، فها نحن نتوجَّه إلى غير اليهود[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأمم». والمقصود هنا غير اليهود في مقابل جمهور المجمع اليهودي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: تكلَّم بجرأة
  rationale: ينقل معنى الكلام الجريء والصريح، ويصوغ اسم الفاعل اليوناني صياغة عربية طبيعية مرتبطة بالفعل الرئيس.
- source_word: Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι
  choice: كان لا بد أن تُكلَّموا أنتم أولًا
  rationale: يحفظ معنى الضرورة وأولوية المخاطَبين، مع إبراز «أنتم» المقابلة للتحول اللاحق إلى غير اليهود.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: كلمة الله
  rationale: تعبير كتابي عربي مألوف يحفظ دلالة λόγος بوصفه رسالة الله المعلنة.
- source_word: ἀπωθεῖσθε αὐτόν
  choice: ترفضونها
  rationale: يعبر بوضوح عن صدّ كلمة الله ورفضها؛ والضمير المؤنث يعود طبيعيًا في العربية إلى «كلمة».
- source_word: οὐκ ἀξίους κρίνετε ἑαυτοὺς
  choice: تحكمون على أنفسكم أنكم غير مستحقين
  rationale: يحفظ الدلالة القضائية للفعل κρίνω والقوة الانعكاسية الصريحة للضمير ἑαυτούς.
- source_word: τῆς αἰωνίου ζωῆς
  choice: للحياة الأبدية
  rationale: اللام بعد «مستحقين» هي الصياغة العربية الطبيعية للمضاف إليه اليوناني.
- source_word: ἰδοὺ στρεφόμεθα
  choice: فها نحن نتوجَّه
  rationale: يحفظ أداة التنبيه ἰδού والتحول الجاري الذي يدل عليه المضارع.
- source_word: τὰ ἔθνη
  choice: غير اليهود
  rationale: السياق يقابل جمهور المجمع بغير اليهود؛ وهذه العبارة واضحة للقارئ العربي، مع إثبات «الأمم» بديلًا حرفيًا في الحاشية.
theological_decisions:
- issue: دلالة τὰ ἔθνη في السياق الخلاصي والتاريخي
  choice: غير اليهود
  alternative: الأمم
  rationale: المقابلة المباشرة هي بين جمهور المجمع اليهودي ومن ليسوا يهودًا، لا بين مناطق جغرافية فحسب. وتحفظ الحاشية المقابل الحرفي المحتمل.
- issue: قوة العبارة οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς
  choice: أن السامعين يحكمون على أنفسهم بأنهم غير مستحقين للحياة الأبدية
  alternative: أن بولس وبرنابا يعلنان أنهم غير مستحقين موضوعيًا
  rationale: النص اليوناني يسند فعل الحكم صراحةً إلى السامعين أنفسهم، ولذلك لا تُنقل المسؤولية إلى المتكلمين ولا يُستخلص حكم لاهوتي أوسع من العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم المثنى في «قالا» لمطابقة بولس وبرنابا، وأُبرز الضمير «أنتم» لإظهار المقابلة البلاغية، ووُضعت علامة الحاشية [a] في المتن.
