  terminology: «كلمة الله»، «الحياة الأبدية»، و«غير اليهود» اختيارات سليمة وواضحة. والحاشية تحفظ البديل الحرفي «الأمم» وتشرح المقصود السياقي دون تحميل لاهوتي زائد.
