source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: ar
  text: 'وبعد قراءة الشريعة والأنبياء، أرسل رؤساء المجمع إليهم يقولون: «أيها الإخوة[a]، إن كانت لديكم كلمة تشجيع للشعب[b]، فتكلّموا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا في اليونانية: «أيها الرجال الإخوة»، وهي صيغة خطاب أخوية محترمة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «كلمة وعظ» أو «كلمة حث»؛ فاللفظة اليونانية تحتمل التشجيع والوعظ كليهما.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: تلاوة
  rationale: تدل في هذا السياق على قراءة الأسفار المقدسة جهرًا في اجتماع المجمع، و«تلاوة» عربية طبيعية موجزة.
- source_word: τοῦ νόμου καὶ τῶν προφητῶν
  choice: الشريعة والأنبياء
  rationale: يشير التعبير إلى قسمين معروفين من الأسفار المقدسة في السياق اليهودي؛ و«الشريعة» تحافظ على معنى νόμος من غير أن تحصره صراحة في اسم كتاب بعينه.
- source_word: ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτούς
  choice: بعث إليهم رؤساء المجمع
  rationale: يفيد التركيب أن المسؤولين أوصلوا إليهم طلبًا أو رسالة؛ وصياغة «بعث إليهم» طبيعية في العربية ولا توحي بأنهم هم الذين ذهبوا إليهم.
- source_word: ἀρχισυνάγωγοι
  choice: رؤساء المجمع
  rationale: يدل الجمع على المسؤولين عن إدارة المجمع وخدمته، لا على حكام مدنيين.
- source_word: Ἄνδρες ἀδελφοί
  choice: أيها الإخوة
  rationale: يحفظ نبرة الخطاب الأخوية المحترمة في عربية سليمة، مع بيان الصيغة اليونانية الحرفية في الحاشية.
- source_word: λόγος παρακλήσεως
  choice: كلمة تشجيع
  rationale: صياغة عربية طبيعية لدعوة الحاضرين إلى مخاطبة الشعب، مع إبقاء احتمال معنى الوعظ أو الحث في الحاشية.
- source_word: πρὸς τὸν λαόν
  choice: للشعب
  rationale: تبيّن أن الكلام المقترح موجّه إلى جماعة الحاضرين ولأجلهم.
- source_word: λέγετε
  choice: فتكلّموا
  rationale: أمر بالبدء في مخاطبة الجماعة، وهو أوضح وأطبع من الترجمة الحرفية «فقولوا» في هذا الموضع.
theological_decisions:
- issue: صيغة النداء المذكرة في اجتماع المجمع
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: النص اليوناني Ἄνδρες ἀδελφοί مذكّر صراحة، والخطاب هنا موجّه مباشرة إلى بولس ورفاقه المدعوين إلى الكلام؛ لذلك لم تُعمَّم الصيغة بإضافة «الأخوات».
- issue: مدى معنى παράκλησις
  choice: تشجيع مع توضيح احتمال الوعظ أو الحث في الحاشية
  alternative: وعظ
  rationale: يمكن للكلمة اليونانية أن تجمع معنى التشجيع والحث أو الوعظ؛ فاختيار أحد المعنيين في المتن مع ذكر الآخر يحفظ التوتر الدلالي من غير إثقال العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «المجمع» للمجمع اليهودي، وصيغت الجملة بإيقاع مناسب للقراءة العلنية، مع الحفاظ على جمع «رؤساء» وصيغة الخطاب المذكرة وغموض παράκλησις الدلالي.
