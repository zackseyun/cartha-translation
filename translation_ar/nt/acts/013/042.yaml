lexical_decisions:
- source_word: Ἐξιόντων δὲ αὐτῶν
  choice: وفيما كانوا خارجين
  rationale: نُقلت صيغة المضاف المطلق بعبارة زمنية عربية طبيعية، مع إبقاء الضمير بلا تعيين صريح لمرجعه. واستُوعبت δὲ في الربط الزمني بدل ترجمتها بحرف عطف مستقل.
- source_word: παρεκάλουν
  choice: كان يُطلَب بإلحاح
  rationale: يفيد الفعل طلبًا جادًّا مستمرًّا أو متكررًا. واستُخدمت الصيغة المبنية للمجهول للمحافظة قدر الإمكان على عدم تعيين أصحاب الطلب، من غير إضعاف معنى الإلحاح.
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: في السبت التالي
  rationale: هذا هو المقابل العربي الطبيعي للعبارة الزمنية التي تشير إلى السبت الآتي أو التالي.
- source_word: λαληθῆναι
  choice: أن تُقال
  rationale: تحافظ الصيغة المبنية للمجهول على بنية المصدر اليوناني المبني للمجهول، وتناسب الأقوال بوصفها كلامًا منطوقًا.
- source_word: αὐτοῖς
  choice: لهم
  rationale: نقل مباشر للمفعول غير المباشر، مع إبقاء مرجع الضمير غير مصرّح به.
- source_word: τὰ ῥήματα ταῦτα
  choice: هذه الأقوال
  rationale: تنقل ῥήματα بوصفها كلامًا قيل، وتحافظ على الإشارة إلى مضمون خطاب بولس السابق دون تحويلها تفسيريًّا إلى «الرسالة».
theological_decisions:
- issue: مرجع الضمائر وهوية أصحاب الطلب
  choice: أُبقي ضمير الخارجين غير معيَّن، وصيغ فعل الطلب للمجهول حتى لا يحسم النص الرئيس هوية أصحابه.
  alternative: أن يُصرَّح بأن الشعب طلب من بولس وبرنابا، أو أن يُفهم أن بولس وبرنابا طلبا من الشعب.
  rationale: في النص اليوناني المعتمد ضمائر لا تعيّن المراجع بأسماء صريحة، كما توجد صعوبة نصية وتفسيرية معروفة في تحديد الخارجين وأصحاب الطلب. لذلك لا ينبغي أن تحسم الترجمة ما لم يحسمه النص.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة ذات نبرة لائقة. اختير «فيما» للجملة الزمنية، و«بإلحاح» لإظهار قوة الطلب، مع تجنب تعيين مراجع الضمائر في المتن. أُثبتت علامتا الحاشيتين [a] و[b] عند العبارة التي تتصل بها القراءات والبدائل.
