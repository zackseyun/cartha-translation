source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: ar
  text: فَإِنَّ سُكَّانَ أُورُشَلِيمَ وَحُكَّامَهُمْ، إِذْ لَمْ يَعْرِفُوا هَذَا[a] وَلَا أَصْوَاتَ الْأَنْبِيَاءِ[b] الَّتِي تُقْرَأُ فِي كُلِّ سَبْتٍ، أَتَمُّوا بِإِدَانَتِهِمْ إِيَّاهُ مَا نَطَقَتْ بِهِ تِلْكَ الْأَصْوَاتُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إيّاه». في اليونانية اسم إشارة، «هذا»، وقد يشدّد على إشارة المتكلم إلى يسوع.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أقوال الأنبياء». وحرفيًا: «أصوات الأنبياء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: السَّاكِنِينَ فِي أُورُشَلِيمَ
  rationale: صياغة عربية واضحة تؤدي اسم الفاعل المستعمل للدلالة على جماعة، وتحافظ على معنى الإقامة.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: حُكَّامَهُمْ
  rationale: تحافظ «حكامهم» على البعد السلطوي والقضائي للكلمة في هذا السياق.
- source_word: τοῦτον
  choice: هَذَا
  rationale: تحافظ على اسم الإشارة الصريح في اليونانية وعلى قوة الإحالة إلى يسوع.
- source_word: ἀγνοήσαντες
  choice: إِذْ لَمْ يَعْرِفُوا
  rationale: تفيد عدم إدراك هوية يسوع أو التعرف إليه، لا مجرد الجهل بوجوده، مع إبقاء علاقة اسم الفاعل بالفعل الرئيس مرنة نسبيًا.
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: أَصْوَاتَ الْأَنْبِيَاءِ
  rationale: ترجمة مباشرة للصورة اليونانية الحية، أي الشهادة النبوية المسموعة عند قراءة الأسفار.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: الَّتِي تُقْرَأُ كُلَّ سَبْتٍ
  rationale: تعبير عربي طبيعي يحفظ الإسناد إلى أصوات الأنبياء ودورية القراءة.
- source_word: κρίναντες
  choice: حَكَمُوا عَلَيْهِ
  rationale: السياق يدل على حكم قضائي ضد يسوع؛ والصياغة تتجنب إضافة لفظ «الإدانة» حين يكفي السياق لتحديد الحكم.
- source_word: ἐπλήρωσαν
  choice: فَأَتَمُّوا
  rationale: «أتموا» تعبير كتابي عربي واضح يدل على تحقيق ما نطق به الأنبياء.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تحفظ الصلة التفسيرية بالقول السابق، وإن كانت الآية مقتطفة من جملة خطابية متصلة.
theological_decisions:
- issue: طبيعة عدم معرفة يسوع
  choice: إذ لم يعرفوا هذا
  alternative: إذ لم يتعرّفوا إليه / إذ كانوا يجهلونه
  rationale: تحفظ العبارة التوتر بين الجهل به وبين الإخفاق في إدراك هويته، من غير أن تقرر أن المقصود جهل مطلق بوجوده.
- issue: علاقة κρίναντες بإتمام أقوال الأنبياء
  choice: حكموا عليه، فأتموا
  alternative: وبحكمهم عليه أتموا
  rationale: تسمح الصياغة العربية بتتابع الفعلين مع بقاء المعنى السياقي أن حكمهم عليه كان سبيل إتمام الشهادة النبوية، من غير الجزم بأن اسم الفاعل اليوناني آلي صرف.
- issue: المقصود بأصوات الأنبياء
  choice: أصوات الأنبياء
  alternative: أقوال الأنبياء
  rationale: الإبقاء على الاستعارة الأصلية يربط النبوءات المقروءة بالصوت النبوي المسموع، مع شرح المقصود في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل «أورشليم» الاسم الكتابي العربي الشائع، وحُفظ تركيب «أصوات الأنبياء» لما فيه من صورة أصلية، مع إيضاحه في الحاشية.
