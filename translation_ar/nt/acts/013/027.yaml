    issue: سقوط المفعول الثاني لـἀγνοήσαντες
    rationale: النص اليوناني يقول إن سكان أورشليم وحكامهم لم يعرفوا «هذا» ولا «أصوات الأنبياء التي تُقرأ كل سبت». المسودة لا تنقل إلا عدم معرفتهم بـ«هذا»، ثم تجعل الأصوات مفعولًا لـ«أتمّوا» وحده؛ وبذلك تحذف عنصرًا صريحًا من المصدر.
  - severity: medium
    issue: علاقة الحكم بالإتمام تحتاج إظهارًا أوضح
    rationale: «حكموا عليه، فأتموا» قد تُفهم كتتابع زمني أو نتيجة مستقلة. اليونانية تجعل الحكم/الإدانة وسيلة الإتمام؛ لذا «بإدانتهم إياه» أدق.
