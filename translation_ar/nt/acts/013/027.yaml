- from: لِأَنَّ السَّاكِنِينَ فِي أُورُشَلِيمَ وَحُكَّامَهُمْ، إِذْ لَمْ يَعْرِفُوا هَذَا[a]، حَكَمُوا عَلَيْهِ، فَأَتَمُّوا أَصْوَاتَ الْأَنْبِيَاءِ[b] الَّتِي تُقْرَأُ كُلَّ سَبْتٍ.
  to: فَإِنَّ سُكَّانَ أُورُشَلِيمَ وَحُكَّامَهُمْ، إِذْ لَمْ يَعْرِفُوا هَذَا[a] وَلَا أَصْوَاتَ الْأَنْبِيَاءِ[b] الَّتِي تُقْرَأُ فِي كُلِّ سَبْتٍ، أَتَمُّوا بِإِدَانَتِهِمْ إِيَّاهُ مَا نَطَقَتْ بِهِ تِلْكَ الْأَصْوَاتُ.
  rationale: يعالج التنقيح الحذف الدلالي الرئيس بإدراج «ولا أصوات الأنبياء» تحت «لم يعرفوا». ويحافظ على أن الأصوات نفسها هي التي تُقرأ كل سبت، ثم يعبّر عربيًا على نحو طبيعي عن إتمام ما نطقت به تلك الأصوات. كما يبيّن أن الإدانة هي الفعل الذي به تمّ الإتمام، من غير إضافة تفسير عقائدي.
