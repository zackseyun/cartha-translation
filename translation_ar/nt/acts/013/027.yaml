review_pass:
  verdict: revise
  source_fidelity: 'يلزم تعديل النص لأن ἀγνοήσαντες يتعدّى في اليونانية إلى مفعولين معطوفين: «هذا» و«أصوات الأنبياء». المسودة تذكر عدم معرفتهم بيسوع فقط، فتسقط عدم معرفتهم/إدراكهم الشهادة النبوية. كما أن «بإدانتهم إياه» يعبّر بوضوح عن علاقة اسم الفاعل κρίναντες بالفعل الرئيس ἐπλήρωσαν.'
  naturalness: الصياغة المنقحة فصحى معاصرة واضحة. استُعيض عن التركيب الحرفي غير المألوف «أتمّوا أصوات الأنبياء» بعبارة «أتمّوا ... ما نطقت به تلك الأصوات»، مع الحفاظ على استعارة «الأصوات» في موضعها الرئيس.
  terminology: «أورشليم»، و«حكامهم»، و«هذا» تحافظ على الإحالة والسجل الكتابي. وتُبقي «أصوات الأنبياء» مقابل φωναὶ τῶν προφητῶν، مع بديل «أقوال الأنبياء» في الحاشية. و«إدانتهم إياه» مناسبة للسياق القضائي لـκρίναντες.
  issues:
