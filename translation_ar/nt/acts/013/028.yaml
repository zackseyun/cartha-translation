  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: ar
  text: ومع أنهم لم يجدوا أيَّ مسوِّغٍ للحكم عليه بالموت[a]، طلبوا من بيلاطس أن يُعدَم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيَّ تهمةٍ تستوجب الموت»، أو: «أيَّ أساس قانوني للحكم عليه بالموت».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أن يُقتَل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ومع
  rationale: تربط العبارة بما قبلها، ومع جملة الحال التالية تُبرز المفارقة التي يدل عليها السياق من غير إضافة معنى غريب عن النص.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: أيَّ مسوِّغٍ للحكم عليه بالموت
  rationale: تأتي αἰτία هنا في سياق قضائي، فتدل على سبب أو تهمة أو أساس يبرر عقوبة الموت. ولفظ «مسوِّغ» ينقل هذا المعنى القانوني بوضوح، بدل عبارة قد تُفهم على أنها تتعلق بسبب الوفاة.
- source_word: εὑρόντες
  choice: مع أنهم لم يجدوا
  rationale: 'اسم الفاعل اليوناني سابق للفعل الرئيس من حيث الحدث، ويحمل في السياق معنى تنازليًا: طلبوا إعدامه رغم عدم عثورهم على مسوّغ لذلك.'
- source_word: ᾐτήσαντο
  choice: طلبوا
  rationale: ينقل الفعل معنى الطلب بعبارة عربية طبيعية تلائم مخاطبة الوالي في هذا السياق.
- source_word: Πιλᾶτον
  choice: بيلاطس
  rationale: الصيغة العربية المعيارية الشائعة للاسم الشخصي.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: أن يُعدَم
  rationale: الفعل يعني هنا إزهاق حياته أو التخلص منه بالقتل. وفي السياق القضائي، «يُعدَم» أدق من «يُقتَل» في إبراز كون المطلوب تنفيذ عقوبة الموت، مع الحفاظ على صيغة المبني للمجهول.
theological_decisions:
- issue: إظهار العلاقة التنازلية في العبارة الحالية
  choice: ومع أنهم لم يجدوا ... طلبوا
  alternative: وإذ لم يجدوا ... طلبوا
  rationale: الصيغة اليونانية يمكن أن تُقرأ ظرفية من حيث التركيب، لكن السياق يبرز بوضوح التوتر بين عدم وجود مسوّغ للموت والمطالبة به. تُظهر «مع أنهم» هذه المفارقة من غير أن تحسم مسألة لاهوتية أو تضيف اتهامًا غير مصرح به.
translation_notes:
  register: العربية فصحى معاصرة واضحة وذات نبرة سردية وقضائية رصينة. وُضعت علامتا الحاشيتين عند العبارتين اللتين تتعلقان بهما مباشرة.
