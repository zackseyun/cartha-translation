base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: ar
  text: 'لأن الرب قد أمرنا هكذا: «قد جعلتك نورًا للأمم[a]، لكي تكون للخلاص إلى أقصى الأرض[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نورًا لغير اليهود». يمكن للكلمة اليونانية أن تعني «الأمم» أو، في سياقات كثيرة، «غير اليهود».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إلى أقاصي الأرض».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: هكذا
  rationale: تفيد الطريقة والأساس الذي يفسر ما سبق، و«هكذا» عربية طبيعية تحافظ على قوة الربط.
- source_word: ἐντέταλται
  choice: أوصانا
  rationale: صيغة التمام تدل على وصية صدرت وما زالت نافذة. و«أوصانا» تنقل معنى الأمر الملزم بصياغة عربية سليمة.
- source_word: ὁ κύριος
  choice: الرب
  rationale: تحافظ على اللقب الإلهي وسلطان المتكلم في الاقتباس الكتابي.
- source_word: Τέθεικά σε
  choice: قد جعلتك
  rationale: تنقل صيغة التمام الدالة على تعيين ثابت، من غير إضافة تفسير لهوية المخاطَب.
- source_word: εἰς φῶς ἐθνῶν
  choice: نورًا للأمم
  rationale: تنقل معنى التعيين أو الغاية بإيجاز طبيعي، وتحافظ على استعارة النور وعلى المعنى الجمعي الواسع لـἐθνῶν.
- source_word: τοῦ εἶναί σε
  choice: لكي تكون
  rationale: توضح دلالة الغاية في تركيب المصدر المسبوق بأداة التعريف، مع إبقاء المخاطَب مفردًا.
- source_word: εἰς σωτηρίαν
  choice: للخلاص
  rationale: تحافظ على إيجاز اليونانية ولا تحسم هل المخاطَب هو الخلاص نفسه أم وسيلته.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: إلى أقصى الأرض
  rationale: تعكس صيغة المفرد في اليونانية، أي بلوغ أبعد موضع في الأرض، مع إثبات الصياغة الجمعية المألوفة في الحاشية.
theological_decisions:
- issue: مرجع اقتباس إشعياء وكيفية تطبيقه على رسالة بولس وبرنابا
  choice: الإبقاء على خطاب المفرد في الاقتباس من غير تحديد هوية المخاطَب أو شرح كيفية انطباق نص العبد على الرسالة الرسولية.
  alternative: إعادة صياغة الاقتباس بصيغة الجمع أو التصريح بأن المخاطَب هو الرسولان.
  rationale: النص اليوناني يورد الاقتباس بضمير المفرد ويترك العلاقة اللاهوتية بين نص العبد ورسالة الرسولين ضمنية؛ لذلك ينبغي عدم حسم هذا التوتر داخل الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي الإيجاز الموازي للاقتباس اليوناني، وأُبقي ضمير المخاطَب مفردًا، ووُضعت البدائل المعجمية الحقيقية في الحواشي دون تحميل النص تفسيرًا مذهبيًا.
