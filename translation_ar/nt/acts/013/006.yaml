  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: ar
  text: ولمّا اجتازوا الجزيرة كلّها حتى بافوس، وجدوا رجلًا ساحرًا ونبيًّا كذّابًا يهوديًّا، اسمه بار-يشوع[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يعكس اسم «بار-يشوع» صيغة سامية أبوية معناها «ابن يشوع» أو «ابن يسوع».
    reason: بيان البنية والمعنى المحتملين لاسم العلم مع الحفاظ عليه منقولًا صوتيًّا في المتن.
lexical_decisions:
- source_word: διελθόντες
  choice: ولمّا اجتازوا
  rationale: ينقل اسم الفاعل اليوناني الماضي بوصفه فعلًا سابقًا للفعل الرئيس، ويحافظ «اجتازوا» على معنى عبور الجزيرة دون تحديد وسيلة السفر.
- source_word: δὲ
  choice: و
  rationale: أداة ربط سردية خفيفة تتابع مجرى الرواية من غير إقحام معنى مقابلة قوي.
- source_word: ὅλην τὴν νῆσον
  choice: الجزيرة كلّها
  rationale: تعبير عربي طبيعي يحفظ شمول العبارة اليونانية.
- source_word: ἄχρι Πάφου
  choice: حتى بافوس
  rationale: تدل «حتى» هنا على الغاية المكانية التي بلغها مسار الرحلة.
- source_word: εὗρον
  choice: وجدوا
  rationale: ترجمة مباشرة للفعل السردي، من غير إضافة معنى المصادفة أو المواجهة.
- source_word: ἄνδρα τινὰ
  choice: رجلًا
  rationale: التنكير في العربية يؤدي معنى τινά طبيعيًّا؛ أما «رجلًا ما» أو «رجلًا معيّنًا» فثقيلتان هنا وقد توحيان بدلالة زائدة.
- source_word: μάγον
  choice: ساحرًا
  rationale: في هذا السياق يدل اللفظ على ممارس للسحر، و«ساحر» واضحة وشائعة ولا تلتبس بلقب المجوس القادمين من المشرق في متى 2.
- source_word: ψευδοπροφήτην
  choice: نبيًّا كذّابًا
  rationale: يحفظ ادعاء النبوة والحكم ببطلانه في صياغة عربية مفهومة ومألوفة.
- source_word: Ἰουδαῖον
  choice: يهوديًّا
  rationale: الصفة هنا تابعة للرجل وتعرّفه بأنه يهودي، ولا يفرض السياق معنى جغرافيًّا خاصًّا بسكان اليهودية.
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: اسمه باريشوع
  rationale: صياغة عربية طبيعية للعبارة اليونانية، مع نقل الاسم صوتيًّا بوصفه اسم علم وعدم ترجمة عناصره داخل المتن.
theological_decisions:
- issue: صياغة اسم العلم Βαριησοῦ
  choice: باريشوع
  alternative: ابن يشوع / ابن يسوع
  rationale: يحمل الاسم على الأرجح بنية سامية أبوية، لكن النص يستعمله اسم علم؛ لذلك نُقل صوتيًّا ولم يُترجم في المتن، مع بيان معناه المحتمل في الحاشية من غير حسم بين «يشوع» و«يسوع».
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية كريمة. استُخدم ترتيب الصفات المتتابعة للمحافظة على وصف الرجل في اليونانية، ووُضعت علامة الحاشية بعد الاسم الذي تشرحه.
