lexical_decisions:
- source_word: οἵ τε
  choice: وكان
  rationale: تفيد τε هنا وصل الجملة بما قبلها واستمرار السرد؛ و«وكان» تؤدي هذا الربط طبيعيًا مع الفعل الماضي المستمر.
- source_word: μαθηταὶ
  choice: التلاميذ
  rationale: المقابل العربي المألوف والدقيق في سياق العهد الجديد، ويشير هنا إلى المؤمنين في المنطقة.
- source_word: ἐπληροῦντο
  choice: يمتلئون
  rationale: المضارع بعد «كان» يحفظ دلالة الماضي الناقص اليوناني على حالة مستمرة أو فعل متكرر، مع إبقاء المبني للمجهول مفهومًا في الصيغة العربية المطاوعة.
- source_word: χαρᾶς
  choice: فرحًا
  rationale: صياغة عربية طبيعية بعد «يمتلئون»، وتنقل معنى χαρά المباشر.
- source_word: πνεύματος ἁγίου
  choice: بالروح القدس
  rationale: يشير التعبير في سياق أعمال الرسل إلى روح الله القدوس؛ والتعريف هو التعبير العربي الطبيعي عن هذا المرجع المحدد.
theological_decisions:
- issue: هل يشير πνεύματος ἁγίου إلى الروح القدس بصفته مرجعًا إلهيًا محددًا أم إلى «روح مقدسة» على نحو وصفي؟
  choice: بالروح القدس
  alternative: بروح مقدسة
  rationale: استعمال العبارة في سفر أعمال الرسل وسياق عمل الروح في رسالة الكنيسة يرجحان بوضوح المرجع الإلهي المحدد، من غير إضافة تفسير يتجاوز النص.
- issue: دلالة صيغة الماضي الناقص ἐπληροῦντο
  choice: كانوا يمتلئون، ممثلة هنا بـ«وكان التلاميذ يمتلئون»
  alternative: امتلأوا
  rationale: يحفظ الاختيار احتمال الاستمرار أو التكرر في الفعل، بدل اختزاله إلى واقعة ماضية منجزة واحدة.
