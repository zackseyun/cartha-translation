  text: ⸀διότι καὶ ἐν ἑτέρῳ λέγει· Οὐ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: ar
  text: 'ولذلك يقول أيضًا في مزمورٍ آخر[a]: «لن تدع تقيَّك[b] يرى الفساد[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في موضع آخر» أو «في نص آخر»؛ فاليونانية تقول حرفيًا: «في آخر».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قدوسك» أو «وليّك الأمين».'
    reason: lexical_alternative
  - marker: c
    text: 'أي فساد الجسد وانحلاله؛ ويمكن ترجمتها أيضًا: «البِلى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: ولذلك
  rationale: تؤدي هنا وظيفة استنتاجية تربط الاقتباس بالحجة السابقة، لا مجرد التعليل.
- source_word: καὶ
  choice: أيضًا
  rationale: تنقل القوة الإضافية، إذ يورد شاهدًا كتابيًا آخر.
- source_word: ἐν ἑτέρῳ
  choice: في مزمورٍ آخر
  rationale: اليونانية تقول حرفيًا «في آخر» مع اسم محذوف مفهوم من السياق؛ وتعيين «مزمور» يوضح أن الاقتباس من المزامير.
- source_word: λέγει
  choice: يقول
  rationale: يحافظ على المضارع المستعمل في صيغة الاستشهاد بالكتاب، وعلى بقاء الفاعل ضمنيًا بحسب اليونانية.
- source_word: Οὐ δώσεις
  choice: لن تدع
  rationale: الفعل مع المصدر يفيد السماح هنا؛ و«تدع» عربية طبيعية ودقيقة في هذا التركيب.
- source_word: τὸν ὅσιόν σου
  choice: تقيَّك
  rationale: ὅσιος يدل على من يتصف بالتقوى والإخلاص لله. «تقيّك» تحافظ على هذا المعنى دون حسمه في اتجاه اصطلاحي واحد.
- source_word: ἰδεῖν
  choice: يرى
  rationale: ينقل المعنى الحرفي للفعل، كما أن «يرى الفساد» تعبير كتابي مفهوم في السياق.
- source_word: διαφθοράν
  choice: الفساد
  rationale: يشمل معنى الفساد والانحلال، ويلائم سياق موت الجسد وقيامته مع إبقاء اللفظ الكتابي الواسع.
theological_decisions:
- issue: الإشارة المسيانية في τὸν ὅσιόν σου
  choice: تقيَّك
  alternative: قدوسك أو وليّك الأمين
  rationale: السياق يطبق المزمور على يسوع، لكن اللفظ اليوناني نفسه يحتمل معنى التقي أو الوفي أو المقدس. تجنبت العربية فرض لقب اصطلاحي أو تمييز بالحروف الكبيرة غير المتاح فيها، وأثبتت البدائل في الحاشية.
- issue: تقدير الاسم المحذوف بعد ἐν ἑτέρῳ
  choice: في مزمورٍ آخر
  alternative: في موضع آخر أو في نص آخر
  rationale: الاقتباس من مزمور 16، وتقدير «مزمور» يوضح المرجع وفق السياق، مع التنبيه إلى إيجاز الأصل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم «تقيّك» بدل صياغة مذهبية محمّلة، مع حفظ البدائل الدلالية في الحاشية، واستُبقي تركيب «يرى الفساد» لقربه من صورة الأصل.
