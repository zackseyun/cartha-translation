  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: ar
  text: ومن ثمّ طلبوا ملكًا[a]، فأعطاهم الله شاول بن قيس، رجلًا من سبط بنيامين، لأربعين سنة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبعد ذلك طلبوا ملكًا». يمكن للفظ الافتتاحي أن يدل على انتقال إلى المرحلة التالية في التسلسل التاريخي.'
    reason: lexical_alternative
  - marker: b
    text: قد يلاحظ بعض القراء أن عبارة «أربعين سنة» تثير أسئلة زمنية عند مقارنتها ببيانات العهد القديم؛ وتحافظ الترجمة هنا على صياغة لوقا كما وردت.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: ومن هناك
  rationale: يحافظ على المعنى المباشر للانتقال من المرحلة السابقة في السرد، مع بيان إمكان فهمه زمنيًا في الحاشية.
- source_word: ᾐτήσαντο βασιλέα
  choice: طلبوا ملكًا
  rationale: تعبير عربي طبيعي ينقل معنى الطلب من غير تشديد النبرة إلى حد «طالبوا» أو «ألحّوا».
- source_word: ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: فأعطاهم الله
  rationale: يحافظ على الفعل العام «أعطى» وعلى فاعله الصريح، ولا يضيّق المعنى إلى «عيّن» أو «نصّب».
- source_word: τὸν Σαοὺλ υἱὸν Κίς
  choice: شاول بن قيس
  rationale: صياغة عربية مألوفة للنسب، مع استعمال الاسمين الكتابيين الشائعين.
- source_word: ἄνδρα ἐκ φυλῆς Βενιαμίν
  choice: رجلًا من سبط بنيامين
  rationale: ينقل وصف شاول وأصله القبلي بوضوح ومن دون إضافة تفسير.
- source_word: ἔτη τεσσεράκοντα
  choice: مدة أربعين سنة
  rationale: يُظهر دلالة المدة في صياغة عربية واضحة، ويربطها بحسب السياق المباشر بإعطاء شاول لهم.
theological_decisions:
- issue: تعلّق عبارة ἔτη τεσσεράκοντα ومدلولها الزمني
  choice: جُعلت «مدة أربعين سنة» متعلقة بإعطاء الله شاول للشعب، أي بمدة حكمه في السياق.
  alternative: يمكن أن تُفهم العبارة على نحو أوسع ضمن الموجز التاريخي، وقد يلاحظ بعض القراء إشكالًا زمنيًا عند مقارنتها ببيانات العهد القديم.
  rationale: هذا هو التعلّق الأقرب نحويًا وسياقيًا، مع إبقاء صياغة لوقا كما هي وعدم فرض تسوية زمنية على النص.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل «سبط» بوصفه المصطلح الكتابي العربي المألوف، وحُفظت الصياغة الموجزة والتوتر الزمني في النص من غير محاولة توفيق تفسيرية.
