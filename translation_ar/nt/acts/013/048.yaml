  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: ar
  text: ولما سمع غير اليهود هذا، أخذوا يفرحون ويمجّدون كلمة الرب، وآمن كل الذين كانوا قد عُيِّنوا[a] للحياة الأبدية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُفهم العبارة الأخيرة: «كل الذين كانوا مهيَّئين للحياة الأبدية». يحتمل اسم المفعول اليوناني تفسيرات مختلفة، لكن معنى «كانوا قد عُيِّنوا» هو النقل المبني للمجهول الأكثر مباشرة هنا.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: ولما سمع ... هذا
  rationale: اسم الفاعل المضارع يؤدي وظيفة ظرفية، فصيغ بأسلوب زمني عربي طبيعي. وأضيف اسم الإشارة «هذا» اعتمادًا على السياق لتوضيح المسموع.
- source_word: τὰ ἔθνη
  choice: غير اليهود
  rationale: يدل اللفظ في هذا السياق من سفر أعمال الرسل على الأمم في مقابل اليهود؛ و«غير اليهود» أوضح للقارئ العربي المعاصر من استعمال «الأمم» وحدها.
- source_word: ἔχαιρον
  choice: أخذوا يفرحون
  rationale: يحافظ هذا التعبير على القوة الاستمرارية أو الابتدائية المحتملة لصيغة الماضي الناقص، من غير أن يحصرها في لحظة عابرة.
- source_word: ἐδόξαζον
  choice: يمجّدون
  rationale: «يمجّدون» المقابل المألوف والدقيق للفعل δοξάζω، وعُطف على «يفرحون» بما يحفظ توازي فعلي الماضي الناقص.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: كلمة الرب
  rationale: تحفظ العبارة الاصطلاح الكتابي والرنين اللاهوتي، مع أن المقصود في السياق هو رسالة الرب المعلنة.
- source_word: ἐπίστευσαν
  choice: آمن
  rationale: ينقل الفعل الماضي اليوناني بإيجاز ومن غير إضافة تفسيرية مثل «جاؤوا إلى الإيمان».
- source_word: ὅσοι
  choice: كل الذين
  rationale: تنقل القوة الكمية للضمير الموصول إلى عربية طبيعية؛ والفعل المفرد «آمن» جائز فصيحًا بالنظر إلى «كل».
- source_word: τεταγμένοι
  choice: كانوا قد عُيِّنوا
  rationale: تحفظ صيغة اسم المفعول التام المبني للمجهول، وهي القراءة النحوية الأوضح هنا، من غير توسيعها إلى تقرير مذهبي يتجاوز النص.
- source_word: εἰς ζωὴν αἰώνιον
  choice: للحياة الأبدية
  rationale: اللام عربية طبيعية تنقل معنى التوجيه أو الغاية الذي تؤديه εἰς في العبارة.
theological_decisions:
- issue: دلالة τεταγμένοι وصلتها بالتعيين والاستجابة البشرية
  choice: كانوا قد عُيِّنوا للحياة الأبدية
  alternative: كانوا مهيَّئين للحياة الأبدية
  rationale: البناء المبني للمجهول هو القراءة المباشرة لصيغة τεταγμένοι، لذلك حُفظ في المتن. ولأن إمكان فهم اللفظ بمعنى الاستعداد أو التهيؤ موضع خلاف تفسيري، ذُكر في الحاشية من غير حسم التوتر اللاهوتي بما يتجاوز الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «غير اليهود» لتجنب غموض «الأمم» لدى القارئ العام، وحُفظ الاصطلاح الكتابي «كلمة الرب». وُضع مؤشر الحاشية [a] بعد «هذا» كما في طبقة الاستشارة الإنجليزية، مع أن الحاشية تشرح العبارة الأخيرة المتنازع عليها؛ والأدق تحريريًا نقل المؤشر إلى «عُيِّنوا» عند السماح بذلك.
