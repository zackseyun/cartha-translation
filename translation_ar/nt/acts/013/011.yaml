revisions:
- from: والآن، ها إن يد الرب عليك، فستكون أعمى لا ترى الشمس إلى حين. وفي الحال وقع عليه ضباب وظلمة، فأخذ يتجوّل ملتمسًا أناسًا يقودونه بيده.
  to: والآن، ها إن يد الرب عليك، فستكون أعمى لا ترى الشمس إلى حين. وفي الحال حلّت به غشاوة وظلمة، فأخذ يتجوّل ملتمسًا أناسًا يمسكون بيده ويقودونه.
  rationale: تُستبدل «ضباب» بـ«غشاوة» لتصوير الإظلام الذي أصابه بدقة، ويُعاد سبك خاتمة الآية لإزالة التباس الضمير مع المحافظة على الحركة المستمرة في περιάγων وطلب المرشدين في ἐζήτει χειραγωγούς. ولا يضيف التعديل تفسيرًا عقائديًا أو تفصيلًا غير وارد في النص.
