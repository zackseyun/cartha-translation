  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: ar
  text: والآن، ها إن يد الرب عليك، فستكون أعمى لا ترى الشمس إلى حين. وفي الحال حلّت به غشاوة وظلمة، فأخذ يتجوّل ملتمسًا أناسًا يمسكون بيده ويقودونه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ها إن
  rationale: أداة تنبيه عربية فصيحة وطبيعية تحفظ قوة الالتفات في اليونانية دون ثقل «هوذا» التقليدية.
- source_word: χεὶρ κυρίου
  choice: يد الرب
  rationale: حُفظت الصورة الكتابية كما هي، فهي تشير في السياق إلى فعل الرب في القضاء دون تحويل الاستعارة إلى تفسير صريح.
- source_word: ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον
  choice: ستكون أعمى لا ترى الشمس
  rationale: يحفظ وصف العمى وذكر الشمس حرفيًا، بصياغة عربية واضحة لا تزيد معنى العجز المصرح به ضمنًا.
- source_word: ἄχρι καιροῦ
  choice: إلى حين
  rationale: ينقل مدة مؤقتة غير محددة، ويحافظ على دلالة ἄχρι الأقرب إلى «إلى» بدل حسمها بصيغة زمنية أخرى.
- source_word: παραχρῆμα
  choice: في الحال
  rationale: تعبير عربي واضح ينقل فورية وقوع الحدث.
- source_word: ἀχλὺς καὶ σκότος
  choice: ضباب وظلمة
  rationale: 'يحفظ الصورتين المتعاقبتين: غشاوة شبيهة بالضباب ثم الظلمة.'
- source_word: περιάγων
  choice: أخذ يتجوّل
  rationale: ينقل حركة الشخص من مكان إلى آخر دون إضافة معنى التحسس أو التخبط غير المصرح به صراحة في اللفظ.
- source_word: ἐζήτει χειραγωγούς
  choice: ملتمسًا أناسًا يقودونه بيده
  rationale: 'يفكك الاسم اليوناني إلى عبارة عربية طبيعية تحافظ على المعنى المحدد: أشخاص يقودون الأعمى ممسكين بيده.'
theological_decisions:
- issue: دلالة «يد الرب»
  choice: الإبقاء على التعبير المجازي «يد الرب عليك»
  alternative: قضاء الرب عليك / الرب يعاقبك
  rationale: السياق يدل على فعل إلهي قضائي، لكن النص يصوغه باستعارة كتابية ينبغي حفظها بدل تفسيرها داخل المتن.
- issue: مدة العمى
  choice: إلى حين
  alternative: لمدة من الزمن / إلى وقت معين
  rationale: يحفظ التعبير عدم تحديد نهاية المدة ولا يحسم مقدارها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. حُفظت الاستعارة «يد الرب» وذِكر الشمس، وتُجنبت إضافات تفسيرية مثل «يتحسس طريقه».
