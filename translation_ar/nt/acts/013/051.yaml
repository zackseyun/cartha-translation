  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: ar
  text: أما هما فنفضا غبار أقدامهما عليهم، وذهبا إلى إيقونية.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان نفض غبار القدمين فعلًا رمزيًا للتبرؤ، وشهادةً ضد الذين رفضوا الرسالة.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: أما هما
  rationale: تفيد δέ انتقالًا مع مسحة من المقابلة، وتشير صيغة الجمع إلى بولس وبرنابا؛ والمثنى طبيعي ودقيق في العربية.
- source_word: ἐκτιναξάμενοι
  choice: فنفضا
  rationale: الفعل يدل على إزالة شيء بهزّه أو نفضه بقوة، وصيغة الفعل المعطوفة تنقل دلالة اسم الفاعل الماضي بسلاسة عربية.
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: غبار أقدامهما
  rationale: κονιορτός هو الغبار، والإضافة العربية تحفظ علاقة الغبار بالأقدام، مع عود ضمير المثنى إلى بولس وبرنابا.
- source_word: ἐπ’ αὐτοὺς
  choice: عليهم
  rationale: يحفظ حرف الجر دلالة توجيه الفعل ضد الرافضين من غير إدخال تفسير مثل الاحتجاج أو الشهادة في صلب النص.
- source_word: ἦλθον
  choice: ذهبا
  rationale: مع ذكر وجهة السفر، تؤدي «ذهبا» معنى الحركة إلى المكان المقصود بصورة طبيعية في العربية.
- source_word: εἰς Ἰκόνιον
  choice: إلى إيقونية
  rationale: تفيد εἰς الحركة نحو المدينة، و«إيقونية» هي الصيغة العربية الشائعة لاسم Iconium.
theological_decisions:
- issue: الدلالة الرمزية لنفض غبار القدمين
  choice: 'إبقاء الفعل في المتن بصورته المباشرة: «فنفضا غبار أقدامهما عليهم»'
  alternative: «فنفضا غبار أقدامهما شهادةً عليهم» أو «علامة دينونة عليهم»
  rationale: النص اليوناني يذكر الفعل وتوجيهه عليهم، لكنه لا يصرّح في هذه الآية بكونه شهادة أو علامة دينونة؛ لذلك تُحفظ الدلالة الرمزية في الحاشية دون حسمها داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل المثنى لأن الفاعلين هما بولس وبرنابا، وحُفظ الإيجاز والتوتر الدلالي في العبارة «عليهم» دون توسع تفسيري.
