    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: عندئذ
  rationale: ظرف زمني يربط هذا الحدث بما سبقه، و«عندئذ» صياغة عربية موجزة وطبيعية.
- source_word: ἰδὼν
  choice: لما رأى
  rationale: حُوِّل اسم الفاعل اليوناني إلى جملة زمنية عربية، مع إبقاء الصلة الزمنية والسببية المحتملة بالفعل الرئيس.
- source_word: ὁ ἀνθύπατος
  choice: الوالي
  rationale: يدل اللفظ على الحاكم الروماني الذي يحمل رتبة الوالي القنصلي؛ و«الوالي» واضح في العربية ويحافظ على صفته الرسمية من غير إثقال النص بمصطلح معرَّب غريب.
- source_word: τὸ γεγονός
  choice: ما حدث
  rationale: ترجمة اصطلاحية طبيعية لاسم الفاعل التام المستعمل اسميًا، وتشير إلى الواقعة التي تمت وشاهدها الوالي.
- source_word: ἐπίστευσεν
  choice: آمن
  rationale: لا يذكر النص اليوناني مفعول الإيمان صراحة، ولذلك تُرك الفعل مطلقًا كما في الأصل.
- source_word: ἐκπλησσόμενος
  choice: وهو مندهش
  rationale: تحافظ الجملة الحالية على معنى اسم الفاعل المصاحب للفعل الرئيس وعلى قوة الدهشة.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: من تعليم
  rationale: تفيد العبارة الأمر الذي أثار الدهشة أو كان أساسها، و«مندهش من» تعبير عربي طبيعي.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: جاءت مضافة إلى «تعليم» للمحافظة قدر الإمكان على صيغة الإضافة اليونانية من غير حسم ما إذا كان التعليم صادرًا عن الرب أو متعلقًا به.
theological_decisions:
- issue: معنى πιστεύω من غير مفعول صريح
  choice: آمن
  alternative: آمن بالرب؛ آمن بالبشارة
  rationale: يدل السياق على الإيمان المرتبط بالرسالة المسيحية، لكن الأصل لا يصرح بالمفعول؛ لذلك لم يُضف ما لم يذكره النص.
- issue: دلالة الإضافة في «تعليم الرب»
  choice: تعليم الرب
  alternative: التعليم الصادر عن الرب؛ التعليم عن الرب
  rationale: يمكن أن تُفهم الإضافة اليونانية على أكثر من وجه، فحُفظت الصياغة الموجزة وأُثبت الاحتمال في الحاشية بدل فرض تفسير واحد.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموقرة. استُعملت جملة زمنية وحالية لتكون العبارة طبيعية في العربية، مع إبقاء إيجاز الأصل وغموضه المقصود في مفعول الإيمان ودلالة إضافة «تعليم الرب».
