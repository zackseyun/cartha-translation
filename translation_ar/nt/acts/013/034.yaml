  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: ar
  text: 'وأمّا أنه أقامه من بين الأموات، من غير أن يعود بعدُ إلى الفساد، فقد قال هكذا: «سأعطيكم العطايا المقدسة الثابتة لداود».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «مراحم داود الأمينة». تردد العبارة صدى إشعياء 55:3، وتشير إلى العطايا أو المواعيد المقدسة الثابتة المرتبطة بداود.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: أقامه من بين الأموات
  rationale: تعبير عربي طبيعي ودقيق عن القيامة، ويحفظ كون الله هو الفاعل.
- source_word: μηκέτι μέλλοντα ὑποστρέφειν
  choice: على ألا يعود بعدُ
  rationale: ينقل معنى انتفاء العودة في المستقبل بصياغة عربية واضحة، من غير إثقال العبارة بترجمة حرفية لـ μέλλοντα.
- source_word: διαφθοράν
  choice: الفساد
  rationale: يحفظ اللفظ الكتابي الواسع الذي يدل هنا على فساد الجسد وتحلله، ولا يقصره صراحة على التحلل وحده.
- source_word: οὕτως εἴρηκεν
  choice: فقد قال هكذا
  rationale: صياغة موجزة تحافظ على تمهيد النص للاقتباس؛ ويفهم دوام سلطان القول من كونه قولًا كتابيًا.
- source_word: Δώσω ὑμῖν
  choice: سأعطيكم
  rationale: ترجمة مباشرة وطبيعية للوعد بصيغة المستقبل.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: عطايا داود المقدسة الثابتة
  rationale: لفظ «عطايا» يستوعب صيغة الجمع المحايدة المضمرة في اليونانية ويبين أنها خيرات أو مواعيد مرتبطة بداود؛ و«المقدسة الثابتة» تعكس ὅσια وπιστά من غير حسم ماهية هذه العطايا أكثر مما يسمح به النص.
theological_decisions:
- issue: دلالة τὰ ὅσια Δαυὶδ τὰ πιστά في اقتباس إشعياء 55:3
  choice: عطايا داود المقدسة الثابتة
  alternative: مراحم داود الأمينة؛ أو المواعيد المقدسة الثابتة المرتبطة بداود
  rationale: العبارة اليونانية موجزة وملتبسة نسبيًا، وتشير إلى الخيرات أو الالتزامات العهدية المقدسة الموثوقة المرتبطة بداود. أبقت الترجمة العلاقة بداود محتملة من غير أن تحدد هل هي عطايا له أم عطايا موعودة من خلال عهده، وذكرت الصياغة التقليدية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «أقامه من بين الأموات» بوصفه تعبيرًا كتابيًا مفهومًا، وحُفظ شيء من إيجاز الاقتباس وغموض علاقته بداود بدل تفسيره داخل المتن.
