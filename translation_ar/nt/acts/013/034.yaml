    rationale: التركيب العربي قد يوحي بأن عدم العودة إلى الفساد شرطٌ لإقامته، بينما μηκέτι μέλλοντα ὑποστρέφειν تصف أنه، بعد أن أُقيم، ليس عائدًا إلى الفساد.
  - severity: low
