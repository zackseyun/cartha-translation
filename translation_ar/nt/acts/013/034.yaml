    rationale: تقديم الوصف ثم إلحاق «لداود» أوضح في العربية مع بقاء الإضافة موجزة، ويقارب وظيفة العبارة اليونانية بوصفها الخيرات/الوعود المقدسة الموثوقة المتصلة بداود.
