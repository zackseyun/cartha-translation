review_pass:
  verdict: revise
  source_fidelity: 'الترجمة تنقل بدقة فعل القيامة («أقامه من بين الأموات») و«الفساد» في سياق عدم عودة الجسد إلى التحلل، كما تحافظ على الطابع الاقتباسي للجزء الأخير. لكن «على ألا يعود» قد تُفهَم في العربية على أنها شرط لعملية الإقامة، في حين أن اليونانية تصف نتيجة القيامة الدائمة أو حالتها: لن يعود إلى الفساد.'
  naturalness: الفصحى واضحة وسليمة إجمالًا. واستبدال «على ألا يعود» بـ«من غير أن يعود بعدُ» يزيل الإيحاء الشرطي ويجعل العلاقة بالسياق أكثر سلاسة. كما أن تقديم الصفتين قبل إضافة «داود» يجعل تركيب العبارة المقتبسة أيسر في العربية.
  terminology: «الفساد» تعبير كتابي مناسب لـδιαφθοράν، ولا ينبغي حصره في «التحلل». و«العطايا المقدسة الثابتة لداود» يحافظ على اتساع العبارة اليونانية المقتبسة وعلى صلتها بداود من دون فرض تفسير مذهبي. وتبقى «مراحم داود الأمينة» بديلًا تقليديًا صالحًا في الحاشية.
  issues:
