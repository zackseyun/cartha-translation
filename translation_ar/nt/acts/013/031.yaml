  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: ar
  text: وظهر على مدى أيام كثيرة للذين صعدوا معه من الجليل إلى أورشليم، وهم الآن شهوده للشعب.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ورُئي على مدى أيام كثيرة». تسمح صيغة الفعل اليوناني بهذه الترجمة الأقرب إلى المبنى، ولا سيما في سياق ظهورات القيامة.'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن «الشعب» هنا يعني، بحسب السياق، شعب إسرائيل تحديدًا.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: وظهر
  rationale: الضمير الموصول يعود إلى يسوع في الآية السابقة؛ واستئناف الجملة بالعطف والفعل مفهوم طبيعيًا في العربية ويحفظ اتصال السياق.
- source_word: ὤφθη
  choice: ظهر
  rationale: صيغة المبني للمجهول من ὁράω تُستعمل في سياقات ظهورات القيامة بمعنى «ظهر»، وهو تعبير عربي طبيعي؛ وتُذكر الصياغة الأقرب إلى المبنى «رُئي» في الحاشية.
- source_word: ἐπὶ ἡμέρας πλείους
  choice: أيامًا كثيرة
  rationale: تعبّر العبارة عن امتداد زمني، وهذه صياغة عربية واضحة وأمينة دون زيادة.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: للذين صعدوا معه
  rationale: يحفظ «صعدوا» دلالة الصعود في السفر إلى أورشليم، و«معه» تنقل معنى المصاحبة في الفعل المركب.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: من الجليل إلى أورشليم
  rationale: نقل مباشر وواضح لمسار الحركة الجغرافي.
- source_word: οἵτινες νῦν εἰσὶ
  choice: وهم الآن
  rationale: صياغة عربية طبيعية تعرّف الجماعة السابقة بأنها صاحبة هذه الصفة في الوقت الحاضر.
- source_word: μάρτυρες αὐτοῦ
  choice: شهوده
  rationale: تنقل الإضافة اليونانية بإيجاز طبيعي، وتشمل كونهم شهودًا له وشهودًا بشأنه من غير حسم زائد.
- source_word: πρὸς τὸν λαόν
  choice: لدى الشعب
  rationale: تفيد توجّه الشهادة إلى جمهور الشعب. وتحافظ «الشعب» على عموم اللفظ اليوناني، مع بيان مرجعه السياقي المحتمل في الحاشية.
theological_decisions:
- issue: طبيعة لغة ظهور القيامة
  choice: ظهر
  alternative: رُئي
  rationale: «ظهر» هو المعنى الاصطلاحي الطبيعي للفعل في سياق ظهورات القيامة، من غير أن ينفي واقعية الرؤية أو تاريخيتها؛ وتحفظ الحاشية البديل الأقرب إلى الصيغة النحوية اليونانية.
- issue: نطاق مدلول «الشعب»
  choice: الشعب
  alternative: شعب إسرائيل
  rationale: يرجّح السياق أن المقصود هو شعب إسرائيل، لكن الأصل يقول «الشعب» من غير إضافة صريحة؛ لذلك تُحفظ الصياغة الأعم في المتن ويُشرح الاحتمال السياقي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «أورشليم» اتساقًا مع الاسم الكتابي الشائع، وحُفظ إيجاز الأصل والتوتر الدلالي في «ظهر/رُئي» و«الشعب/شعب إسرائيل» بواسطة الحواشي.
