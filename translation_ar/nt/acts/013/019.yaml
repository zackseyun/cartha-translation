  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: ar
  text: وبعد أن قضى على سبع أمم في أرض كنعان، أورثهم أرض تلك الأمم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قسّم لهم أرض تلك الأمم ميراثًا». يمكن أن يشدّد الفعل اليوناني على تخصيص الأرض أو توزيعها بوصفها ميراثًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν (καθαιρέω)
  choice: قضى على
  rationale: يفيد الفعل هنا إسقاط الأمم الكنعانية وإزالتها في سياق الفتح. وعبارة «قضى على» واضحة وطبيعية، وتحافظ على قوة التعبير من غير أن توحي بالضرورة بإبادة كل فرد.
- source_word: ἔθνη ἑπτὰ
  choice: سبع أمم
  rationale: «أمم» هي المقابل العربي المألوف والواضح في هذا السياق التاريخي.
- source_word: ἐν γῇ Χανάαν
  choice: في أرض كنعان
  rationale: يحافظ هذا التعبير على ذكر γῇ، أي «أرض»، الوارد صراحة في اليونانية.
- source_word: κατεκληρονόμησεν
  choice: أورثهم
  rationale: ينقل معنى منح الأرض نصيبًا موروثًا، مع إظهار المستفيد المفهوم من السياق، أي شعب إسرائيل. وتُذكر دلالة التقسيم والتخصيص في الحاشية حفاظًا على المجال الدلالي للفعل.
- source_word: τὴν γῆν αὐτῶν
  choice: أرض تلك الأمم
  rationale: يعود الضمير اليوناني إلى الأمم السبع. واستُبدل به في العربية الاسم الظاهر منعًا لالتباسه بضمير المستفيدين في «أورثهم».
theological_decisions:
- issue: فاعل الفعل والمستفيد الضمني من الميراث
  choice: الله هو فاعل القضاء والإيراث، والمستفيدون هم بنو إسرائيل المفهومون من السياق.
  alternative: 'صياغة لا تُظهر المستفيد: «جعل أرضهم ميراثًا» أو «قسّم أرضهم».'
  rationale: سياق خطاب بولس يسرد أفعال الله في تاريخ إسرائيل. واليونانية لا تصرّح بالمفعول غير المباشر، لكن إظهاره بضمير الجمع يجعل العربية طبيعية من غير إضافة تحديد مذهبي، بينما تبقي الحاشية معنى التخصيص والتقسيم حاضرًا.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدمت «قضى على» بدل «أباد» لتجنب المبالغة في تحديد كيفية زوال الأمم، و«أرض تلك الأمم» لرفع التباس الضمائر.
