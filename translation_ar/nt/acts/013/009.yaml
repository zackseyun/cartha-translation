  text: أَمَّا شَاوُلُ، الَّذِي هُوَ أَيْضًا بُولُسُ، فَامْتَلَأَ مِنَ الرُّوحِ الْقُدُسِ وَحَدَّقَ إِلَيْهِ،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: شاول
  rationale: نقلٌ عربي راسخ للاسم الشخصي اليوناني، ومتسق مع الاستعمال الكتابي العربي الشائع.
- source_word: δέ
  choice: أمّا
  rationale: تفيد انتقال السرد إلى استجابة شاول مع مسحة خفيفة من المقابلة، وتأتي طبيعية في العربية مع الفاء في جوابها.
- source_word: ὁ καὶ Παῦλος
  choice: الذي هو أيضًا بولس
  rationale: يحافظ على تركيب التعريف بالاسم الإضافي من غير إدخال فعل «يُدعى» غير المذكور صراحة في اليونانية.
- source_word: πλησθεὶς
  choice: فامتلأ
  rationale: ينقل معنى اسم الفاعل الأوريستي المبني للمجهول بصياغة عربية طبيعية، مع إبقاء الامتلاء سابقًا للنظر أو مصاحبًا له في تسلسل الحدث.
- source_word: πνεύματος ἁγίου
  choice: من الروح القدس
  rationale: «امتلأ من» تركيب عربي طبيعي يدل على ما ملأه، والسياق في أعمال الرسل يشير إلى الروح الإلهي المعروف.
- source_word: ἀτενίσας
  choice: وحدّق
  rationale: ينقل النظر الثابت المتأمل بقوة، بإيجاز ووضوح في العربية المعاصرة.
- source_word: εἰς αὐτόν
  choice: إليه
  rationale: حرف الجر مع فعل النظر الثابت يدل على توجيه البصر نحو عليم الساحر المذكور في السياق.
theological_decisions:
- issue: دلالة πνεύματος ἁγίου
  choice: الروح القدس
  alternative: روح مقدس
  rationale: سياق التمكين في سفر الأعمال واستعمال لوقا يدلان بقوة على الروح الإلهي المعروف، لا على روح غير معيّن.
- issue: العلاقة بين اسمي شاول وبولس
  choice: الذي هو أيضًا بولس
  alternative: الذي كان يُدعى أيضًا بولس
  rationale: الصياغة المختارة تحفظ غموض التركيب اليوناني بشأن طبيعة الاسم الثاني ولا توحي بتغيير اسم أو بفعل تسمية غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أمّا... فـ» لتماسك الانتقال السردي، وحُفظت الجملة جزءًا من السياق المتصل كما في الأصل.
