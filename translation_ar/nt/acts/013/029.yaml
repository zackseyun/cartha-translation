  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: ar
  text: ولمّا أتمّوا كلَّ ما كُتب عنه، أنزلوه عن الخشبة[a] ووضعوه في قبر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الصليب». اللفظة اليونانية تعني «خشبة» أو «شجرة»، وتُستعمل أيضًا لأداة الإعدام الخشبية، وقد تلمّح إلى تثنية 21:23.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: ولمّا
  rationale: تؤدي المعنى الزمني مع استمرار السرد بصورة طبيعية وموجزة.
- source_word: ἐτέλεσαν
  choice: أتمّوا
  rationale: تنقل معنى إكمال ما كُتب وتحقيقه بأفعال الفاعلين، مع إبقاء الصلة بين الحدث والنصوص المكتوبة دون زيادة تفسيرية.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: كلَّ ما كُتب عنه
  rationale: صياغة عربية واضحة تحفظ الشمول ودلالة الكتابة السابقة المتعلقة به.
- source_word: καθελόντες
  choice: أنزلوه
  rationale: حُوِّل اسم الفاعل اليوناني السابق للفعل الرئيس إلى فعل متسلسل طبيعي في العربية، والمقصود إنزال جسده من أداة الإعدام.
- source_word: ἀπὸ τοῦ ξύλου
  choice: عن الخشبة
  rationale: «الخشبة» تحفظ الدلالة المعجمية لـ ξύλον بوصفها خشبًا أو أداة إعدام خشبية، وتبقي احتمال الصدى الكتابي، بدل استبدالها مباشرةً بلفظ «الصليب» التفسيري.
- source_word: ἔθηκαν
  choice: ووضعوه
  rationale: فعل عربي مباشر وطبيعي لنقل معنى وضع الجسد في موضع الدفن.
- source_word: εἰς μνημεῖον
  choice: في قبر
  rationale: μνημεῖον يدل هنا على موضع دفن؛ و«قبر» لفظ واضح وشائع في العربية المعاصرة.
theological_decisions:
- issue: ترجمة ξύλον في سياق آلام يسوع
  choice: الخشبة
  alternative: الصليب؛ أو الشجرة
  rationale: النص اليوناني يستعمل ξύλον لا σταυρός. تحافظ «الخشبة» على اللفظ التصويري وعلى احتمال الإشارة إلى لغة التثنية 21:23، بينما يُذكر «الصليب» في الحاشية بوصفه المعنى السياقي الممكن.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعملت أفعال متتابعة بدل المحافظة حرفيًا على تركيب اسم الفاعل اليوناني، مع إبقاء «الخشبة» في المتن لصون الصورة الأصلية واحتمال صداها الكتابي.
