  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: ar
  text: فبعدما أرسلهما الروح القدس، نزلا إلى سلوكية، ومن هناك أبحرا إلى قبرص.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτοὶ
  choice: 'هما (مضمَّنة في صيغتي المثنى: أرسلهما، نزلا، أبحرا)'
  rationale: الضمير اليوناني صريح وفيه شيء من التوكيد، ويشير إلى برنابا وشاول. وتؤدي صيغ المثنى العربية الإحالة بوضوح وطبيعية من غير إثقال العبارة بضمير منفصل.
- source_word: μὲν οὖν
  choice: فـ
  rationale: تفيد العبارة الانتقال في السرد والنتيجة المترتبة على الإرسال السابق؛ والفاء العربية تنقل هذا الترابط بإيجاز وطبيعية.
- source_word: ἐκπεμφθέντες
  choice: إذ أرسلهما
  rationale: اسم فاعل ماضٍ مبني للمجهول يدل على فعل سابق للفعلين الرئيسيين. تحافظ صيغة «إذ أرسلهما» على سبق الإرسال، ويُذكر الفاعل بعده مع ὑπό.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: الروح القدس
  rationale: ὑπό مع المضاف إليه تدل على الفاعل في المبني للمجهول. والسياق في أعمال الرسل يعرض الروح القدس فاعلًا شخصيًا يرسل ويوجّه.
- source_word: κατῆλθον
  choice: نزلا
  rationale: يحفظ الفعل معنى النزول، وهو ملائم للانتقال إلى المدينة الساحلية، كما أن صيغة المثنى تحدد أن المقصود برنابا وشاول.
- source_word: εἰς Σελεύκειαν
  choice: إلى سَلُوقِيَة
  rationale: حرف الجر يدل هنا على وجهة الحركة، و«إلى» هو المقابل العربي الطبيعي. نُقل اسم المدينة صوتيًا بصيغته العربية الشائعة.
- source_word: ἐκεῖθεν
  choice: من هناك
  rationale: مقابل عربي مباشر وطبيعي لظرف المكان الدال على نقطة الانطلاق.
- source_word: τε
  choice: و
  rationale: تربط الأداة الفعل اللاحق بالسابق، والواو تؤدي هذه الوظيفة بسلاسة في السرد العربي.
- source_word: ἀπέπλευσαν
  choice: أبحرا
  rationale: يدل الفعل على الانطلاق بحرًا. «أبحرا» تعبير عربي طبيعي يجمع معنى السفر بالسفينة ومغادرة الميناء، دون الحاجة إلى زيادة «بعيدًا».
- source_word: εἰς Κύπρον
  choice: إلى قبرص
  rationale: تدل العبارة على الوجهة، و«إلى قبرص» هي الصياغة العربية المألوفة.
theological_decisions:
- issue: ترجمة ἁγίου πνεύματος
  choice: الروح القدس
  alternative: الروح القدوس
  rationale: التعبير في سياق أعمال الرسل يشير إلى الفاعل الإلهي الشخصي الذي يرسل المرسلين. «الروح القدس» هو المقابل العربي الراسخ والطبيعي، ويحفظ دلالة الوكالة في النص دون إضافة شرح عقائدي.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. استُخدم المثنى لأن المرجع المباشر هو برنابا وشاول، واستُعيض بالفاء عن العبارة الخطابية μὲν οὖν للحفاظ على انسياب السرد. شُكّل اسم سَلُوقِيَة جزئيًا لتيسير نطقه.
