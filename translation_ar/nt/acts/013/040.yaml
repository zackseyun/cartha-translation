  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: ar
  text: 'فاحذروا إذن لئلا يحلّ بكم ما قيل في كتب الأنبياء[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «في الأنبياء». ويمكن أن تُفهم أيضًا بمعنى «بواسطة الأنبياء»، لكن الأرجح أن المقصود هو كتب الأنبياء التي ورد فيها هذا التحذير.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: احذروا
  rationale: فعل أمر للمخاطبين بصيغة الجمع يؤدي معنى التحذير العاجل، و«احذروا» تعبير عربي فصيح وطبيعي يحفظ قوة الأمر.
- source_word: οὖν
  choice: إذن
  rationale: تربط النتيجة بما سبق من إعلان وتحذير، وموضعها بعد فعل الأمر طبيعي في العربية.
- source_word: μὴ ἐπέλθῃ
  choice: أن يحلّ بكم
  rationale: تأتي μή مع صيغة الاحتمال بعد الأمر للتحذير من وقوع الأمر؛ و«يحلّ بكم» تنقل معنى مجيء الدينونة على المخاطبين بعبارة عربية مألوفة.
- source_word: τὸ εἰρημένον
  choice: ما قيل
  rationale: اسم موصول يعبّر طبيعيًا عن اسم المفعول اليوناني المستعمل استعمال الاسم. لا تُظهر العربية هنا قوة صيغة التمام صراحة، لكن السياق الكتابي يحفظ كون القول قائمًا ومسجلًا.
- source_word: ἐν τοῖς προφήταις
  choice: في كتب الأنبياء
  rationale: توضح المقصود المرجح من ἐν، أي موضع ورود التحذير ضمن مجموعة الكتابات النبوية، من غير تحويل العبارة في النص الرئيس إلى دلالة الوساطة «على ألسنة الأنبياء».
theological_decisions:
- issue: المراد بعبارة «في الأنبياء»
  choice: الإشارة إلى كتب الأنبياء بوصفها مجموعة من الأسفار النبوية
  alternative: الإشارة أساسًا إلى الأنبياء البشر الذين نطقوا بالكلام
  rationale: السياق يمهّد لاقتباس من حبقوق، ولذلك ترجّح الإشارة إلى ما هو مكتوب في الأسفار النبوية. وتبيّن الحاشية إمكان فهم العبارة على أنها تتعلق بوساطة الأنبياء من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «احذروا» لقوة التحذير، و«يحلّ بكم» لطبيعية التعبير عن وقوع ما يُخشى. أُضيفت كلمة «كتب» في المتن لتوضيح دلالة العبارة الاصطلاحية، مع حفظ اللفظ الحرفي والبديل المحتمل في الحاشية.
