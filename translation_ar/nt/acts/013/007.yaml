id: ACT.13.7
reference: Acts 13:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: ar
  text: وكان هذا مع والي المقاطعة الرومانية سرجيوس بولس، وهو رجل فهيم[a]. فاستدعى هذا الرجل برنابا وشاول، وسعى إلى سماع كلمة الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رجل ذو فطنة» أو «رجل حكيم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «رسالة الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: والي المقاطعة الرومانية
  rationale: ينقل رتبة المسؤول الإقليمي الروماني بعبارة عربية واضحة، بدل الاكتفاء بكلمة «حاكم» العامة أو استعمال لقب منقول صوتيًا قد لا يفهمه القارئ العادي.
- source_word: σὺν
  choice: مع
  rationale: تؤدي معنى المصاحبة أو الارتباط بصورة مباشرة وطبيعية.
- source_word: ἀνδρὶ συνετῷ
  choice: رجل فهيم
  rationale: «فهيم» تعبّر عن الفهم والتمييز والذكاء الذي يدل عليه συνετός، من غير أن تحصر الوصف في فضيلة أخلاقية.
- source_word: οὗτος
  choice: هذا الرجل
  rationale: يحفظ الاستئناف التوكيدي باسم الإشارة بعد الوصف الاعتراضي، مع صياغة عربية طبيعية.
- source_word: προσκαλεσάμενος
  choice: استدعى
  rationale: يدل على أنه دعا برنابا وشاول للحضور إليه بمبادرة رسمية، من غير لزوم معنى الإكراه.
- source_word: ἐπεζήτησεν
  choice: سعى إلى
  rationale: يحفظ معنى الطلب الجاد والرغبة العملية، ولا يختزله في مجرد التمني.
- source_word: ἀκοῦσαι
  choice: سماع
  rationale: مصدر عربي طبيعي بعد «سعى إلى»، ويؤدي معنى الإصغاء إلى الرسالة وتلقيها.
- source_word: λόγον τοῦ θεοῦ
  choice: كلمة الله
  rationale: يحافظ على الصياغة القريبة من الأصل والتعبير الكتابي المألوف، مع إمكان فهمه بمعنى رسالة الله.
- source_word: Σεργίῳ Παύλῳ
  choice: سرجيوس بولس
  rationale: نقل صوتي للاسم الشخصي وفق الاستعمال العربي المألوف.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: برنابا وشاول
  rationale: نقل الاسمين وفق صيغتهما العربية الكتابية المألوفة.
theological_decisions:
- issue: دلالة λόγον τοῦ θεοῦ
  choice: كلمة الله
  alternative: رسالة الله
  rationale: «كلمة الله» أكثر شفافية إزاء تركيب الأصل وتحفظ التعبير الكتابي من غير إضافة تحديد عقائدي، بينما توضّح الحاشية أن المقصود قد يُعبّر عنه أيضًا برسالة الله.
- issue: دلالة συνετῷ في وصف سرجيوس بولس
  choice: رجل فهيم
  alternative: رجل حكيم أو ذو فطنة
  rationale: الصياغة المختارة تثبت له الفهم والتمييز، لكنها لا تجعل الوصف بالضرورة حكمًا على فضيلته الأخلاقية أو حالته الروحية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعملت عبارة «والي المقاطعة الرومانية» لشرح اللقب الإداري الروماني داخل النص بلا مصطلح تقني غريب، وحُفظ اسم الإشارة في «هذا الرجل» لإبراز الاستئناف الموجود في اليونانية. وُضعت علامتا الحاشيتين عند «فهيم» و«كلمة الله» بما يطابق موضوع كل حاشية، مصححتين بذلك عدم اتساق موضع العلامتين في طبقة الاستشارة الإنجليزية.
