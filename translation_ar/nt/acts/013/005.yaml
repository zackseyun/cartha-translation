  text: καὶ γενόμενοι ἐν Σαλαμῖνι κατήγγελλον τὸν λόγον τοῦ θεοῦ ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων· εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: ar
  text: ولمّا وصلا إلى سلاميس، كانا يعلنان كلمة الله في مجامع اليهود، وكان معهما أيضًا يوحنا مساعدًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خادمًا» أو «معاونًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: ولمّا وصلا إلى سلاميس
  rationale: يفيد اسم الفاعل الماضي مع ظرف المكان الوصول إلى الموضع، وصيغة «لمّا» تنقل العلاقة الزمنية بصورة عربية طبيعية. استُعمل المثنى لأن الفاعلين في السياق هما برنابا وشاول.
- source_word: κατήγγελλον
  choice: كانا يعلنان
  rationale: الفعل يدل على الإعلان العلني، والماضي الناقص اليوناني يوحي بفعل متكرر أو ممتد؛ لذلك نُقل بـ«كانا يعلنان».
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: كلمة الله
  rationale: ترجمة مباشرة تحفظ الإضافة واحتمال دلالة «الكلمة» على رسالة الله أو إعلانه دون تضييق المعنى.
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: في مجامع اليهود
  rationale: «المجامع» هو المصطلح العربي المألوف لدور العبادة اليهودية، والإضافة تنقل البناء اليوناني بوضوح.
- source_word: εἶχον δὲ καὶ Ἰωάννην
  choice: وكان معهما أيضًا يوحنا
  rationale: صياغة عربية طبيعية تنقل الإضافة التي تفيدها καί والانتقال الخفيف الذي تفيده δέ، مع مراعاة أن الفاعل مثنى في السياق.
- source_word: ὑπηρέτην
  choice: مساعدًا
  rationale: يدل اللفظ هنا على شخص يعين أو يخدم في مهمة تابعة، و«مساعدًا» مناسبة لسياق الرحلة والخدمة ولا توحي بالعبودية.
theological_decisions: []
