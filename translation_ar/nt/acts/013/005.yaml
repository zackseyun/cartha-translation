  register: لغة عربية فصحى معاصرة واضحة ورصينة. روعي المثنى بحسب السياق المباشر، وحُفظت دلالة الاستمرار في κατήγγελλον. وُضع مؤشر الحاشية بعد «مساعدًا» لأنه يخص بدائل ترجمة ὑπηρέτην.
