  source_fidelity: 'الترجمة أمينة للنص اليوناني: «ولمّا وصلا» تنقل اسم الفاعل الزمني مع دلالة الوصول في السياق، و«كانا يعلنان» مناسبة للماضي الناقص κατήγγελλον وتوحي بالفعل المستمر أو المتكرر. كما نُقلت «كلمة الله»، وموضع الإعلان في «مجامع اليهود»، ودور يوحنا بوصفه مساعدًا دون تحميل المصطلح معنى كنسيًا أو عقائديًا زائدًا.'
  naturalness: الصياغة فصيحة معاصرة وسلسة. استعمال المثنى في «وصلا/كانا/معهما» طبيعي ومسنود بسياق الفاعلين المباشر. ترتيب الجملة واضح، و«مساعدًا» تأتي سليمة حالًا مبيّنًا لدور يوحنا.
  terminology: «سلاميس» و«مجامع اليهود» و«كلمة الله» مصطلحات دقيقة ومألوفة. «مساعدًا» ترجمة مناسبة لـὑπηρέτην في هذا السياق، والحاشية تقدم بدائل معجمية مشروعة («خادمًا»، «معاونًا»).
