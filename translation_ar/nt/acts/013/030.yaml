lexical_decisions:
- source_word: δὲ
  choice: لكنَّ
  rationale: تفيد الأداة هنا مقابلةً واضحة مع ما فعله البشر في السياق السابق، و«لكنَّ» تنقل هذا الاستدراك بصورة طبيعية.
- source_word: θεὸς
  choice: اللهَ
  rationale: الاسم هو فاعل فعل الإقامة، وقد جاء منصوبًا لفظًا لأنه اسم «لكنَّ» في الصياغة العربية.
- source_word: ἤγειρεν
  choice: أقامه
  rationale: الفعل ἐγείρω في سياق القيامة يعني أن الله أنهضه من الموت؛ و«أقامه» تعبير عربي واضح ومألوف لهذا المعنى.
- source_word: αὐτὸν
  choice: ـه
  rationale: الضمير يعود إلى يسوع المذكور في السياق المباشر، ونُقل بضمير المفعول المتصل.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: تنقل العبارة معنى الخروج من وسط الموتى، وتحافظ بوضوح على الدلالة القيامية للصيغة اليونانية.
theological_decisions:
- issue: صياغة القيامة
  choice: لكنَّ اللهَ أقامه من بين الأموات.
  alternative: لكنَّ اللهَ أقامه من الموت.
  rationale: الصياغة المختارة تنسب القيامة صراحةً إلى فعل الله وتحافظ على التعبير اليوناني ἐκ νεκρῶν بصورته الجمعية، من غير إضافة تفسير يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة، موجزة وكريمة النبرة. استُخدمت «أقامه من بين الأموات» لوضوح معنى القيامة وقربها من تركيب الأصل.
