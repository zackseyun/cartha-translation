  text: But the one whom God raised up did not see decay[a].
translation:
  language: ar
  text: أمّا الذي أقامه الله، فلم يرَ الفساد[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «التحلّل». يمكن أن تدل الكلمة اليونانية على فساد الجسد وتحلّله؛ وتحافظ كلمة «الفساد» على اللفظ الوارد في مزمور 16:10 في الأسفار اليونانية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: الذي
  rationale: اسم موصول يعود إلى الشخص المذكور في السياق، أي يسوع، ويأتي مفعولًا به للفعل «أقام»؛ وصياغة «الذي» طبيعية وواضحة في العربية.
- source_word: δὲ
  choice: أمّا
  rationale: تفيد المقابلة مع داود في الآية السابقة، وتُظهر التحول إلى الحديث عن الذي أقامه الله دون إثقال الأسلوب.
- source_word: ὁ θεὸς
  choice: الله
  rationale: النقل العربي الطبيعي للاسم الإلهي المعرّف في هذا السياق.
- source_word: ἤγειρεν
  choice: أقامه
  rationale: الفعل في السياق يشير إلى إقامة يسوع من الموت؛ و«أقامه» يحافظ على الإيجاز والصلة اللفظية بلغة القيامة، من غير إضافة عبارة تفسيرية مثل «من بين الأموات» إلى متن الآية.
- source_word: οὐκ εἶδεν
  choice: لم يرَ
  rationale: يحافظ على التعبير السامي ذي الصدى الكتابي «يرى الفساد»، بدل تفسيره بعبارات مثل «لم يختبر» أو «لم يتعرض لـ».
- source_word: διαφθοράν
  choice: الفساد
  rationale: «الفساد» يقابل اللفظ اليوناني ويحفظ صدى مزمور 16 في الترجمة اليونانية، ويمكن أن يدل هنا على فساد الجسد وتحلله؛ وتوضح الحاشية البديل الحديث.
theological_decisions:
- issue: دلالة ἤγειρεν على القيامة
  choice: أقامه، أي إقامة يسوع من الموت بحسب السياق
  alternative: أقامه بمعنى أظهره أو عيّنه
  rationale: المقابلة المباشرة بين داود الذي مات ورأى الفساد، ويسوع الذي أقامه الله ولم يرَ الفساد، تجعل دلالة القيامة هي الأنسب في هذا الموضع، مع إبقاء المتن موجزًا وفق الأصل.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت «أمّا» لإبراز المقابلة السياقية، وحُفظ التعبير الكتابي «لم يرَ الفساد» مع شرح دلالته الجسدية في الحاشية.
