id: ACT.13.33
reference: Acts 13:33
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: ar
  text: 'أن الله قد أتمّ هذا لأولادنا[a] إذ أقام يسوع[b]، كما هو مكتوب أيضًا في المزمور الثاني: «أنت ابني، أنا اليوم ولدتك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «لنا نحن أولادهم»، بدلًا من «لأولادنا».'
    reason: textual_variant
  - marker: b
    text: 'أو: «إذ أقام يسوع من بين الأموات». ويمكن أن يعني الفعل اليوناني أيضًا أن الله أقام يسوع بمعنى أظهره أو عيّنه.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: قد أتمّ
  rationale: ينقل صيغة التام اليونانية بوصفها فعلًا اكتمل وبقي أثره قائمًا، ويحافظ على معنى إتمام الوعد في السياق.
- source_word: ταύτην
  choice: هذا
  rationale: يحافظ على الضمير كما ورد في اليونانية، مع بقاء مرجعه إلى الوعد المذكور في السياق السابق من غير إضافة اسم إلى النص.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: لأولادنا
  rationale: ترجمة مباشرة لقراءة نص SBLGNT، ويمكن أن تدل كلمة τέκνα على الأولاد أو الذرية؛ وقد أُثبتت القراءة النصية الأخرى في الحاشية.
- source_word: ἀναστήσας Ἰησοῦν
  choice: إذ أقام يسوع
  rationale: تنقل اسم الفاعل بوصفه ظرفًا يبيّن كيفية الإتمام، وتحافظ كلمة «أقام» على إمكان الإشارة إلى إقامة يسوع من الموت أو إلى إقامته وإظهاره في دوره.
- source_word: γέγραπται
  choice: هو مكتوب
  rationale: صياغة عربية مألوفة لعبارة الاستشهاد بالكتاب، وتناسب دلالة التام المبني للمجهول على بقاء المكتوب نافذًا.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: المزمور الثاني
  rationale: ترجمة مباشرة وطبيعية للترتيب العددي الوارد في النص اليوناني.
- source_word: Υἱός μου εἶ σύ
  choice: أنت ابني
  rationale: صياغة عربية طبيعية تحافظ على التصريح المباشر بهوية الابن.
- source_word: σήμερον γεγέννηκά σε
  choice: أنا اليوم ولدتك
  rationale: تحافظ على صورة الولادة في مزمور 2:7 وعلى ثقلها النصي واللاهوتي من غير تحويلها إلى تفسير مثل التبنّي أو التنصيب.
theological_decisions:
- issue: دلالة ἀναστήσας Ἰησοῦν في هذا السياق
  choice: «إذ أقام يسوع» مع إبقاء العبارة محتملة الدلالة
  alternative: «إذ أقام يسوع من بين الأموات» أو «إذ أظهر يسوع/أقامه لمهمته»
  rationale: يستعمل سفر الأعمال الفعل في سياقات القيامة وفي سياقات إقامة شخص وإظهاره، وتأتي الإشارة الصريحة إلى القيامة في السياق اللاحق؛ لذلك لا يحسم المتن ما أبقاه التعبير اليوناني محتملًا، وتوضح الحاشية الوجهين.
- issue: القوة المسيحانية لعبارة «أنا اليوم ولدتك»
  choice: إبقاء اقتباس مزمور 2:7 بصيغته المباشرة
  alternative: تفسيرها في المتن بلغة التنصيب أو التبنّي أو التبرير بالقيامة
  rationale: لا ينبغي للترجمة أن تفصل في الجدل اللاهوتي بإضافة تفسير غير مصرح به؛ لذا تُحفظ العبارة كما هي في الاقتباس.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت تراكيب مألوفة في الاقتباس الكتابي، مع تجنّب الألفاظ المذهبية التفسيرية. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحهما كل حاشية.
