  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: ar
  text: لكن أليماس الساحر كان يقاومهما — فهذا هو تفسير اسمه — محاولًا أن يصرف الوالي الروماني عن الإيمان[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عن أن يؤمن». قد تشير العبارة اليونانية إلى الإيمان المسيحي تحديدًا، أو إلى الاستجابة بالإيمان على نحو أعم.'
    reason: alternative_reading
  - marker: b
    text: يقدّم النص «أليماس» بوصفه اسمًا مترجمًا أو مفسَّرًا، لكن اشتقاقه الدقيق غير مؤكد.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: قاومهما
  rationale: يفيد الفعل في صيغة الماضي الناقص معارضة مستمرة، و«قاوم» تعبير عربي طبيعي يحفظ المعنى العدائي، والضمير يعود إلى المذكورين في السياق.
- source_word: δὲ
  choice: لكن
  rationale: تفيد الأداة هنا الاستدراك والمقابلة مع ما سبق.
- source_word: Ἐλύμας ὁ μάγος
  choice: أليماس الساحر
  rationale: نُقل الاسم صوتيًا، وتؤدي «الساحر» معنى μάγος في هذا السياق بلغة عربية واضحة من غير استعمال لقب تاريخي غامض.
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: فهذا هو تفسير اسمه
  rationale: يحفظ معنى الترجمة أو التفسير المتعلق بالاسم، ويتجنب الإيحاء بأن الاشتقاق الدقيق محسوم.
- source_word: ζητῶν
  choice: محاولًا
  rationale: يعبر عن القصد الملازم لمقاومته بأسلوب عربي طبيعي.
- source_word: διαστρέψαι
  choice: أن يصرف ... عن
  rationale: مع مفعول شخصي وحرف ἀπό، يدل السياق على محاولة إبعاد الوالي عن الإيمان، لا مجرد تحريف فكرة.
- source_word: τὸν ἀνθύπατον
  choice: الوالي الروماني
  rationale: يقدّم الوظيفة الإدارية بصورة مفهومة للقارئ العربي، مع بيان إطارها الروماني بدل استعمال المصطلح التقني غير المألوف «البروقنصل».
- source_word: ἀπὸ τῆς πίστεως
  choice: عن الإيمان
  rationale: يحفظ لفظ πίστις ودلالة أداة التعريف، مع إبقاء احتمال أن المقصود هو الإيمان المسيحي تحديدًا أو الاستجابة المؤمنة عمومًا في الحاشية.
theological_decisions:
- issue: دلالة πίστις المعرّفة
  choice: الإيمان
  alternative: إيمان / أن يؤمن
  rationale: أداة التعريف والسياق يرجحان الإشارة إلى الإيمان الذي كان الرسولان يبشران به، لكن العبارة اليونانية تحتمل أيضًا معنى صرفه عن الاستجابة بالإيمان؛ لذلك لم يُحسم الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «الوالي الروماني» لتوضيح اللقب الإداري للقارئ العام، وحُفظ الاعتراض التفسيري بين شرطتين، وأُثبتت علامتا الحاشيتين في المتن.
