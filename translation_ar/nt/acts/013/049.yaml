  text: διεφέρετο δὲ ὁ λόγος τοῦ κυρίου δι’ ὅλης τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: ar
  text: وكانت كلمة الرب تنتشر في المنطقة كلها[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رسالة الرب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφέρετο
  choice: كانت تنتشر
  rationale: صيغة الماضي الناقص تدل على فعل مستمر في الزمن الماضي. وصياغة «كانت تنتشر» عربية طبيعية تحفظ هذا الجانب الاستمراري، مع أن اليونانية تحتمل صرفيًا معنى المبني للمجهول «كانت تُنشَر» أيضًا.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تتابع السرد من غير أن تقتضي مقابلة قوية، والواو أنسب لذلك في العربية.
- source_word: ὁ λόγος
  choice: كلمة
  rationale: تحفظ «كلمة» التعبير المتكرر في سفر أعمال الرسل، مع أن المقصود في السياق هو البشارة أو الرسالة المعلنة.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: «الرب» المقابل العربي المألوف لـ κύριος، ويحفظ الصدى الديني والأدبي للعبارة من دون حصرها في مجرد معنى السيادة البشرية.
- source_word: δι’ ὅλης
  choice: في ... كلها
  rationale: ينقل امتداد الانتشار في كامل النطاق الجغرافي بصياغة عربية واضحة وطبيعية.
- source_word: τῆς χώρας
  choice: المنطقة
  rationale: تشير χώρα هنا إلى الرقعة المحيطة أو الإقليم، لا إلى دولة حديثة؛ لذلك فـ«المنطقة» أوضح للقارئ المعاصر.
theological_decisions:
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: «الرب» تحافظ على الاستعمال المسيحي والكتابي المألوف في أعمال الرسل وعلى ما في اللقب من دلالة لاهوتية، من غير اختزاله إلى معنى السلطة البشرية.
- issue: دلالة λόγος
  choice: كلمة الرب
  alternative: رسالة الرب
  rationale: «كلمة الرب» تحفظ اصطلاح لوقا المتكرر وصلته الأدبية بسياق السفر، بينما توضح الحاشية أن المراد قد يُفهم بوصفه الرسالة المعلنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «كانت تنتشر» لجريانها الطبيعي ولإبراز استمرار الحدث، مع بقاء احتمال القراءة المبنية للمجهول في اليونانية. وُضع مؤشر الحاشية بعد الجملة كما في طبقة الاستشارة الإنجليزية.
