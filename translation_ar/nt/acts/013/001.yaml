source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: ar
  text: 'وكان في الكنيسة التي في أنطاكية أنبياء ومعلّمون، هم: برنابا، وسمعان الذي كان يُدعى نيجر[a]، ولوكيوس القيرواني[c]، ومَنايِن، رفيق هيرودس حاكم الربع في النشأة[b]، وشاول.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «نيجر» اسم لاتيني معناه «أسود». وقد أُبقي هنا اسمًا عَلَمًا بدلًا من ترجمته.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أخو هيرودس حاكم الربع بالرضاعة»، أو: «الذي تربّى مع هيرودس حاكم الربع».'
    reason: alternative_reading
  - marker: c
    text: أي إن لوكيوس كان من قورينا في شمال أفريقيا.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: وكان
  rationale: تنقل الفعل الوجودي مع أداة الربط الخفيفة δέ بعبارة عربية طبيعية، من غير إضافة معنى زمني غير موجود في الأصل.
- source_word: κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: في الكنيسة التي في أنطاكية
  rationale: تعبير عربي واضح يدل على الجماعة المسيحية المحلية الموجودة في أنطاكية، من غير محاكاة حرفية ثقيلة لاسم الفاعل اليوناني.
- source_word: προφῆται καὶ διδάσκαλοι
  choice: أنبياء ومعلّمون
  rationale: ترجمة مباشرة لفئتين من الخادمين المذكورين في الكنيسة، من غير تحميلهما بنية كنسية لاحقة.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: سمعان الذي كان يُدعى نيجر
  rationale: يحافظ على صيغة الاسم Συμεών وعلى كون «نيجر» اسمًا أو لقبًا يُعرف به، لا وصفًا مترجمًا في المتن.
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: لوكيوس القيرواني
  rationale: النسبة العربية الطبيعية إلى قورينا، وتفيد أن لوكيوس كان منها.
- source_word: Μαναήν
  choice: مَنايِن
  rationale: نقل صوتي للاسم الشخصي يميّزه بوضوح في العربية.
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: هيرودس حاكم الربع
  rationale: يحافظ على اللقب الوارد في اليونانية من غير إضافة الاسم التاريخي «أنتيباس» الذي لا يذكره النص.
- source_word: σύντροφος
  choice: رفيق نشأة
  rationale: يعكس احتمال النشأة المشتركة والقرب الشخصي، مع إبقاء طبيعة العلاقة الدقيقة مفتوحة.
theological_decisions:
- issue: طبيعة وصف «أنبياء ومعلّمون»
  choice: إبقاء الوصفين كما هما لفئات معروفة داخل كنيسة أنطاكية
  alternative: اعتبارهما منصبين كنسيين تقنيين وفق بنية مؤسسية لاحقة
  rationale: الآية تسمي أشخاصًا بهذه الأوصاف ولا تحدد نظامًا هرميًا أو مؤسسيًا لاحقًا.
- issue: علاقة مَنايِن بهيرودس في لفظ σύντροφος
  choice: رفيق نشأة
  alternative: أخو هيرودس بالرضاعة، أو شخص تربّى مع هيرودس
  rationale: اللفظ قد يدل على التنشئة المشتركة، وربما على الأخوّة بالرضاعة، لكنه لا يحسم طبيعة العلاقة بما يكفي لفرض أضيق الاحتمالات في المتن.
translation_notes:
  register: 'صياغة عربية فصحى معاصرة، واضحة ووقورة. وُضعت علامات الحواشي عند الألفاظ التي تشرحها فعلًا: [a] بعد «نيجر»، و[c] بعد «القيرواني»، و[b] بعد عبارة علاقة مَنايِن بهيرودس. استُخدم «هم» لتمهيد قائمة الأسماء بوضوح، و«حاكم الربع» بدل المصطلح الكنسي الأقدم «رئيس الربع» لسهولة الفهم.'
