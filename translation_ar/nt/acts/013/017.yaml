source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: ar
  text: إله هذا الشعب، إسرائيل، اختار آباءنا[a]، وعظَّم الشعب[b] في غربتهم في أرض مصر[c]، وبذراع مرفوعة[d] أخرجهم منها[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «أسلافنا». واليونانية حرفيًا: «آباءنا».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «رفع شأن الشعب» أو «نمّى الشعب».'
    reason: lexical_alternative
  - marker: c
    text: أي في مدة إقامتهم بوصفهم غرباء في أرض مصر.
    reason: clarification
  - marker: d
    text: 'حرفيًا: «بذراع عالية»؛ وهي صورة من رواية الخروج تعبّر عن خلاص الله القوي.'
    reason: cultural_note
  - marker: e
    text: أو «قادهم إلى خارجها».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: إله هذا الشعب، إسرائيل
  rationale: يحافظ على البنية التي يأتي فيها «إسرائيل» بيانًا لـ«هذا الشعب»، مع صياغة عربية واضحة ورصينة.
- source_word: ἐξελέξατο
  choice: اختار
  rationale: ينقل معنى الفعل اليوناني مباشرة، ولا تستلزم صيغة الوسط إضافة «لنفسه» في العربية.
- source_word: τοὺς πατέρας ἡμῶν
  choice: آباءنا
  rationale: ترجمة مباشرة للفظ المذكر πατέρας، مع إمكان فهمه في هذا السياق بمعنى الأسلاف.
- source_word: ὕψωσεν
  choice: عظَّم
  rationale: يحفظ اتساع الفعل بين رفع الشأن والإنماء، من غير قصره على الزيادة العددية وحدها.
- source_word: ἐν τῇ παροικίᾳ
  choice: في أثناء إقامتهم غرباء
  rationale: يُظهر أن المقصود إقامة قوم في أرض ليست موطنهم، بصياغة مفهومة في العربية المعاصرة.
- source_word: ἐν γῇ Αἰγύπτου
  choice: في أرض مصر
  rationale: يحافظ على ذكر «الأرض» الصريح في النص اليوناني وعلى النبرة التاريخية.
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: بذراع مرفوعة
  rationale: يحافظ على صورة الخروج الكتابية كما وردت، بدل استبدالها بتفسيرها «بقوة عظيمة».
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: أخرجهم منها
  rationale: صياغة عربية موجزة تنقل فعل الإخراج وعودة الضمير إلى أرض مصر.
theological_decisions:
- issue: هوية «الآباء» في خطاب بولس
  choice: آباءنا
  alternative: أسلافنا
  rationale: اللفظ اليوناني يقول حرفيًا «الآباء»، وهو مناسب لخطاب المجمع وللسياق التاريخي العهدي، مع بيان البديل في الحاشية.
- issue: دلالة ὕψωσεν في مصر
  choice: عظَّم الشعب
  alternative: رفع شأن الشعب؛ أو نمّى الشعب
  rationale: يمكن أن يدل الفعل على الرفعة أو التعظيم، وقد يفهم في سياق مصر على التكثير أيضًا؛ لذلك اختير لفظ عربي واسع نسبيًا، مع إبقاء الاحتمالات في الحاشية.
- issue: صورة الذراع المرفوعة
  choice: بذراع مرفوعة
  alternative: بذراع قوية
  rationale: إبقاء الاستعارة يحافظ على صدى تقليد الخروج وعلى إسناد الخلاص القوي إلى الله، من غير تحويل الصورة إلى تفسير مجرد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة تاريخية كريمة. حُفظت صورة «الذراع المرفوعة» والغموض النسبي في «عظَّم»، وتُجنبت الألفاظ الطائفية أو التفسيرات التي تحصر المعنى في الزيادة العددية وحدها.
