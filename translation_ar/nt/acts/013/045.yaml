  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: ar
  text: لكن لما رأى اليهود الجموع[a]، امتلأوا غيرةً[b]، وأخذوا يعارضون ما كان يقوله بولس[c]، وهم يجدّفون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الجماعة اليهودية المحلية التي عارضت بولس في هذا المشهد، لا الشعب اليهودي كله.
    reason: cultural_note
  - marker: b
    text: 'أو: «حماسةً»؛ لكن السياق هنا يرجح المعنى السلبي: «غيرةً».'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «ما كان يُقال على يد بولس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες δὲ
  choice: لكن لما رأى
  rationale: صيغ اسم الفاعل الأوريستي بعلاقة زمنية طبيعية في العربية، وجاءت «لكن» لإظهار التحول المقابل في السرد.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: يحافظ على التسمية الصريحة في اليونانية من غير تضييقها إلى القادة؛ وتوضح الحاشية أن المقصود جماعة المشهد المحلية.
- source_word: τοὺς ὄχλους
  choice: الجموع
  rationale: يحفظ صيغة الجمع ويدل بوضوح على جماعات الناس المحتشدة.
- source_word: ἐπλήσθησαν ζήλου
  choice: امتلأوا غيرةً
  rationale: يحافظ على صورة الامتلاء، والسياق العدائي يرجح معنى الغيرة أو الحسد، مع إثبات احتمال «الحماسة» في الحاشية.
- source_word: ἀντέλεγον
  choice: أخذوا يعارضون
  rationale: تعبر «أخذوا» عن بدء الفعل، ويعكس المضارع الناقص اليوناني استمرار المعارضة الكلامية.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: ما كان يقوله بولس
  rationale: صياغة عربية طبيعية تحفظ دلالة القول المستمر ومضمون كلام بولس دون تكلف المبني للمجهول.
- source_word: βλασφημοῦντες
  choice: وهم يجدّفون
  rationale: يحفظ ثقل اللفظ الديني، ويبين أن التجديف صاحب معارضتهم من غير تعيين مفعوله، إذ لم يعينه النص.
theological_decisions:
- issue: احتمال قراءة عبارة οἱ Ἰουδαῖοι بوصفها إدانة عامة لليهود
  choice: اليهود مع حاشية توضيحية
  alternative: القادة اليهود / بعض اليهود
  rationale: النص يقول «اليهود» ولا يخصص القادة، لكن السياق يدل على الجماعة المحلية المعارضة في هذا المشهد، لا على الشعب اليهودي كله.
- issue: دلالة ζῆλος بين الغيرة والحماسة
  choice: غيرة
  alternative: حماسة
  rationale: رؤية الجموع ثم المعارضة والتجديف ترجح المعنى السلبي، مع إبقاء البديل المعجمي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «أخذوا يعارضون» لنقل بدء الفعل واستمراره، و«ما كان يقوله بولس» لطلاقة العبارة مع حفظ معنى الأصل.
