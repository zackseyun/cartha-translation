  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: ar
  text: أَمَّا الْيَهُودُ فَحَرَّضُوا النِّسَاءَ الْمُتَدَيِّنَاتِ ذَوَاتِ الْمَكَانَةِ[a] وَرِجَالَ الْمَدِينَةِ الْبَارِزِينَ، وَأَثَارُوا اضْطِهَادًا ضِدَّ بُولُسَ وَبَرْنَابَا، وَطَرَدُوهُمَا مِنْ مِنْطَقَتِهِمْ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «النِّسَاءَ اللَّاتِي يَتَّقِينَ اللهَ». قد يدل اسم الفاعل اليوناني على نساء كنَّ يعبدن إله إسرائيل، وربما كنَّ من غير اليهود ومن المرتبطات بالمجمع.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مِنْ إِقْلِيمِهِمْ» أو «مِنْ تُخُومِهِمْ». قد تشير الكلمة اليونانية إلى الحدود الإقليمية أو إلى المنطقة التي تحيط بها تلك الحدود.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: أَمَّا الْيَهُودُ فَـ
  rationale: تنقل أداة الاستدراك δέ والتحول السردي في سياق عربي طبيعي.
- source_word: παρώτρυναν
  choice: حَرَّضُوا
  rationale: يفيد التحريض النشط ودفع أصحاب النفوذ إلى موقف عدائي.
- source_word: σεβομένας γυναῖκας
  choice: النِّسَاءَ الْمُتَعَبِّدَاتِ
  rationale: يحفظ معنى العبادة والتدين من غير الجزم بأن العبارة لقب اصطلاحي محدد للملتحقات الأمميات بالمجمع.
- source_word: εὐσχήμονας
  choice: ذَوَاتِ الْمَكَانَةِ
  rationale: يدل بوضوح على الوجاهة والمكانة الاجتماعية المرموقة.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: كِبَارَ رِجَالِ الْمَدِينَةِ
  rationale: صياغة عربية طبيعية تدل على المتقدمين في الرتبة المدنية وتحفظ الإشارة المذكرة الصريحة في اليونانية.
- source_word: ἐπήγειραν διωγμὸν
  choice: أَثَارُوا اضْطِهَادًا
  rationale: تنقل القوة السببية للتركيب، أي تسببهم في نشوء الاضطهاد.
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: ضِدَّ بُولُسَ وَبَرْنَابَا
  rationale: تعبر عن الوجهة العدائية التي تفيدها ἐπί مع كلمة الاضطهاد.
- source_word: ἐξέβαλον αὐτοὺς
  choice: طَرَدُوهُمَا
  rationale: فعل موجز وقوي ينقل الإخراج القسري، مع تثنية الضمير بحسب العربية.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: مِنْ مِنْطَقَتِهِمْ
  rationale: صياغة واضحة معاصرة تشير إلى الرقعة المحيطة بالمدينة، مع إبقاء احتمال معنى الحدود أو الإقليم في الحاشية.
theological_decisions:
- issue: دلالة النساء المتعبدات وعلاقتهن بالمجمع
  choice: النِّسَاءَ الْمُتَعَبِّدَاتِ
  alternative: النِّسَاءَ اللَّاتِي يَتَّقِينَ اللهَ
  rationale: لا يجزم النص صراحة بوضعهن الديني أو العرقي؛ لذلك تحافظ الصياغة على معنى التعبد، وتورد القراءة الأخص في الحاشية.
- issue: الإشارة المذكرة في عبارة τοὺς πρώτους τῆς πόλεως
  choice: كِبَارَ رِجَالِ الْمَدِينَةِ
  alternative: قَادَةَ الْمَدِينَةِ
  rationale: تحفظ الترجمة كون التعبير اليوناني مذكرًا بدل تحييده، من غير إضافة رتبة رسمية غير منصوص عليها.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم «أمّا... فـ» لإبراز التحول السردي، و«كبار رجال المدينة» للمحافظة على التذكير الصريح، ووُضعت علامتا الحاشية عند العبارتين اللتين تفسرانهما مباشرة.
