  to: أَمَّا الْيَهُودُ فَحَرَّضُوا النِّسَاءَ الْمُتَدَيِّنَاتِ ذَوَاتِ الْمَكَانَةِ[a] وَرِجَالَ الْمَدِينَةِ الْبَارِزِينَ، وَأَثَارُوا اضْطِهَادًا ضِدَّ بُولُسَ وَبَرْنَابَا، وَطَرَدُوهُمَا مِنْ مِنْطَقَتِهِمْ[b].
  rationale: 'التعديل محدود وآمن: يستبدل تعبيرين يمكن أن يلتبسا في العربية المعاصرة بتعبيرين أوضح، من دون تغيير الفاعلين أو العلاقات النحوية أو درجة المعنى أو الإيحاءات الدينية غير المحسومة في الأصل. وأُبقيت الحواشي وعلاماتها في مواضعها المباشرة.'
