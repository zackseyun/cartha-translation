  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: ar
  text: ومن نسل[a] هذا الرجل، أتى اللهُ لإسرائيل بمخلِّصٍ، هو يسوع، وفقًا للوعد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من ذرية هذا الرجل»؛ والمقصود نسل داود.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بمقتضى الوعد» أو «كما وعد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: هذا الرجل
  rationale: اسم الإشارة في صيغة المضاف إليه يعود إلى داود المذكور في الآية السابقة. والتصريح بـ«الرجل» يوضح المرجع في العربية من غير إضافة تفسير إلى النص.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: من نسل
  rationale: تدل σπέρμα هنا على الذرية والنسب الداودي. و«النسل» عربية طبيعية تحفظ الصورة النَسَبية، بخلاف «البذرة» الحرفية غير الملائمة في هذا السياق.
- source_word: κατ’ ἐπαγγελίαν
  choice: وفقًا للوعد
  rationale: تحفظ العبارة معنى المطابقة لوعد سابق، من غير أن تحدد في المتن ما لم يصرح به اليوناني.
- source_word: ἤγαγεν
  choice: أتى ... بمخلِّص
  rationale: الفعل ἄγω يعني الإتيان بشخص أو إحضاره. وهذه الصياغة عربية طبيعية وتتجنب «أقام» التي قد توحي بفعل آخر أو بلغة القيامة.
- source_word: τῷ Ἰσραήλ
  choice: لإسرائيل
  rationale: 'تنقل اللام دلالة المجرور غير المباشر، مع احتمال المعنى النفعي: أتى الله بمخلّص لإسرائيل.'
- source_word: σωτῆρα
  choice: مخلِّص
  rationale: «مخلِّص» المقابل العربي المألوف للقب σωτήρ، ويحفظ معناه الخلاصي من غير تضييقه إلى نجاة سياسية أو مؤقتة.
- source_word: Ἰησοῦν
  choice: يسوع
  rationale: نقل الاسم الشخصي وفق الصيغة العربية الكتابية الشائعة.
theological_decisions:
- issue: صلة يسوع بوعد داود
  choice: إبقاء النسب الداودي والوعد مرتبطين في العبارة من غير التصريح بأن الوعد موجّه إلى داود
  alternative: «إتمامًا لوعده لداود»
  rationale: السياق يربط يسوع بنسل داود وبالوعد، لكن النص اليوناني لا يذكر هنا متلقي الوعد ولا يستخدم لفظ «الإتمام»، لذلك تحافظ الصياغة على الدلالة من غير توسيع تفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «أتى ... بمخلِّص» لقربها من معنى الفعل اليوناني وطبيعتها في العربية، مع ضبط «مخلِّص» لتمييزها من «مخلَص».
