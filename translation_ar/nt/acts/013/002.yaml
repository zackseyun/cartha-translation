base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: ar
  text: 'وبينما كانوا يخدمون الربَّ ويصومون[a]، قال الروح القدس: «افرزوا لي برنابا وشاول للعمل الذي دعوتهما إليه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يتعبدون للرب». يمكن أن يدل الفعل اليوناني على الخدمة ذات الطابع التعبدي أو الشعائري.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: يخدمون
  rationale: يدل الفعل على أداء خدمة قد تحمل إيحاءات تعبدية أو شعائرية. «يخدمون الرب» عربية طبيعية تحفظ معنى الخدمة، وتوضح الحاشية البعد التعبدي الممكن.
- source_word: τῷ κυρίῳ
  choice: الربَّ
  rationale: المجرور اليوناني يحدد من تتجه إليه الخدمة؛ وصيغة «يخدمون الرب» تؤدي ذلك بوضوح في العربية.
- source_word: νηστευόντων
  choice: يصومون
  rationale: ترجمة مباشرة للمشاركة الحالية، وتدل مع الفعل السابق على نشاطين متزامنين.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: التعبير العربي المعياري الواضح، مع إبقائه فاعل القول كما في اليونانية.
- source_word: Ἀφορίσατε δή
  choice: افرزوا
  rationale: «افرزوا» تنقل معنى الفصل والتخصيص لغرض معين. لم يُمثَّل δή بكلمة مستقلة لأن قوة الأمر في السياق تؤدي معنى الحث، وتجنّب العبارة بذلك تكلفًا غير طبيعي.
- source_word: μοι
  choice: لي
  rationale: تحفظ جهة التخصيص وغايته بإيجاز طبيعي.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: برنابا وشاول
  rationale: استُخدمت الصيغ العربية الشائعة للاسمين.
- source_word: εἰς τὸ ἔργον
  choice: للعمل
  rationale: «العمل» يحفظ عموم اللفظ ولا يضيّقه إلى منصب كنسي أو خدمة تقنية.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: الذي دعوتهما إليه
  rationale: تنقل صيغة التام اليونانية دعوة سابقة باقية الصلة بالحاضر، وتأتي «دعوتُهما إليه» عربية واضحة وطبيعية.
theological_decisions:
- issue: دلالة λειτουργούντων في سياق العبادة الجماعية والتكليف
  choice: يخدمون الربَّ
  alternative: يتعبدون للرب؛ يقومون بخدمة الرب
  rationale: اللفظ قد يشمل خدمة ذات طابع تعبدي أو شعائري، لكنه لا يوجب قصر المعنى على ممارسة ليتورجية رسمية. المتن يحفظ معنى الخدمة، والحاشية تصون الاحتمال التعبدي.
- issue: كون الروح القدس فاعل القول
  choice: قال الروح القدس
  alternative: —
  rationale: يحافظ النص على الإسناد الشخصي المباشر الموجود في اليونانية من غير إعادة تفسير أو إضعاف.
- issue: قوة ἀφορίσατε ... εἰς τὸ ἔργον
  choice: افرزوا لي ... للعمل
  alternative: عيّنوا ... للخدمة
  rationale: تدل العبارة على تخصيص إلهي لعمل معين، من دون أن تنص بذاتها على رسامة أو منصب كنسي تقني.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «افرزوا» لما فيه من معنى التخصيص المقصود، وأُبقي «العمل» عامًا كما في المصدر. وُضع مؤشر الحاشية [a] في المتن بعد العبارة التي تتعلق بها.
