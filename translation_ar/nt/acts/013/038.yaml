source:
  edition: SBLGNT
  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: ar
  text: فليكن معلومًا لديكم إذن، أيها الإخوة[a]، أنه بهذا[b] يُعلَن لكم غفران الخطايا، وأن كلَّ من يؤمن يتبرر[c] به من كل ما لم تستطيعوا أن تتبرروا منه بشريعة موسى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أيها الإخوة والأخوات»، إذا كان النداء مفهومًا على أنه يشمل جميع الحاضرين.'
    reason: lexical_alternative
  - marker: b
    text: أي بيسوع، المذكور قبيل ذلك.
    reason: cross_reference
  - marker: c
    text: 'أو: «يُعلَن بارًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: فليكن معلومًا لديكم إذن
  rationale: يحافظ على قوة صيغة الأمر غير الشخصية وعلى دلالة οὖν الاستنتاجية، بصياغة عربية فصيحة واضحة.
- source_word: ἄνδρες ἀδελφοί
  choice: أيها الإخوة
  rationale: ينقل النداء الأخوي بصيغة عربية طبيعية، مع إبقاء الصيغة المذكرة في المتن وبيان احتمال شمول الحضور في الحاشية.
- source_word: διὰ τούτου
  choice: بهذا
  rationale: يحافظ على اسم الإشارة المذكر وإحالته إلى يسوع المذكور قبله، من غير إضافة لفظ «الرجل» غير الموجود صراحة في اليونانية.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: غفران الخطايا
  rationale: المقابل العربي الواضح والمستقر في هذا السياق للكلام على الصفح عن الخطايا.
- source_word: καταγγέλλεται
  choice: يُعلَن
  rationale: ينقل المبني للمجهول ودلالة الإعلان العلني، وهو أسلس في العربية المعاصرة من تعبيرات أشد حرفية.
- source_word: ἀπὸ πάντων ὧν
  choice: من كل ما ... منه
  rationale: يعيد بناء الصلة في ترتيب عربي طبيعي، مع الحفاظ على معنى الانفصال أو التحرر من جميع الأمور المقصودة.
- source_word: οὐκ ἠδυνήθητε
  choice: لم تستطيعوا
  rationale: ترجمة مباشرة وواضحة لمعنى عدم القدرة.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: بشريعة موسى
  rationale: تفهم ἐν هنا بمعنى الوسيلة أو المجال، وتستعمل «شريعة» بوصفها المقابل العربي الواضح لـ νόμος في هذا السياق.
- source_word: δικαιωθῆναι
  choice: تتبرروا
  rationale: يحافظ على المصطلح القضائي واللاهوتي من غير اختزاله في تغير أخلاقي داخلي؛ وتوضح الحاشية البديل التفسيري.
theological_decisions:
- issue: دلالة δικαιόω في علاقته بشريعة موسى
  choice: يتبرر / تتبرروا
  alternative: يُعلَن بارًا / تُعلَنوا أبرارًا
  rationale: لفظ «التبرير» يحفظ الثقل القضائي واللاهوتي للمصطلح ولا يحسم كل أبعاده بتفسير واحد، مع تقديم البديل التوضيحي في الحاشية.
- issue: مدى شمول النداء ἄνδρες ἀδελφοί
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: المتن يحافظ على الصيغة المذكرة في الأصل، بينما تذكر الحاشية احتمال أن يكون الخطاب شاملًا للنساء الحاضرات أيضًا.
- issue: مرجع اسم الإشارة في διὰ τούτου
  choice: بهذا
  alternative: به، أي بيسوع
  rationale: يحافظ المتن على صيغة الإشارة في اليونانية، وتوضح الحاشية أن المرجع هو يسوع المذكور في السياق السابق.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ورصينة. استُعملت «شريعة موسى» بدل «ناموس موسى» لسهولة الفهم، مع الحفاظ على مصطلح «يتبرر» لما يحمله من دلالة قضائية ولاهوتية. صيغت الجملة بصورة مكتملة وفق طبقة المراجعة الإنجليزية والسياق المتصل؛ أما مقتطف SBLGNT المقدم فينتهي عند مصدر δικαιωθῆναι ويقطع التركيب قبل تمامه في السياق التالي.
