  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: ar
  text: وبعد انفضاض اجتماع المجمع[a]، تبع بولسَ وبرنابا كثيرون من اليهود والدخلاء الأتقياء. فكانا يتحدثان إليهم ويحثّانهم على أن يستمروا في نعمة الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبعد أن انفضّ المجمع». قد تشير الكلمة اليونانية إلى انفضاض الجماعة المجتمعة، لا إلى المبنى.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ويقنعانهم بأن يظلوا في نعمة الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: وبعد انفضاض اجتماع المجمع
  rationale: التركيب الإضافي المطلق يدل على ظرف سابق، والفعل هنا يفيد انتهاء الجماعة المجتمعة وانصرافها. وإضافة «اجتماع» تمنع توهّم انفضاض المبنى نفسه، مع إبقاء «المجمع» للمؤسسة اليهودية.
- source_word: ἠκολούθησαν
  choice: تبع
  rationale: ينقل المعنى المباشر لذهابهم وراء بولس وبرنابا بعد الاجتماع، من غير حسم ما إذا كان الاتباع مكانيًا فقط أو يحمل بداية استجابة أوسع.
- source_word: πολλοὶ τῶν Ἰουδαίων
  choice: كثيرون من اليهود
  rationale: صياغة عربية طبيعية تحفظ معنى التبعيض والعدد.
- source_word: τῶν σεβομένων προσηλύτων
  choice: الدخلاء المتعبدين
  rationale: «الدخلاء» مصطلح عربي معروف لمن دخلوا في اليهودية، وهو أدق من «المهتدين» الذي قد يلتبس بالاهتداء المسيحي؛ و«المتعبدين» ينقل دلالة الورع والتعبد في σεβομένων.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: يتحدثان إليهم
  rationale: يحفظ الفعل المصاحب المستمر والكلام الموجّه إلى التابعين، بصياغة عربية واضحة.
- source_word: ἔπειθον
  choice: يحثّانهم
  rationale: الماضي الناقص اليوناني يدل على فعل مستمر، وسياق المصدر التالي يجعل الكلام حثًا وإقناعًا؛ «يحثّان» طبيعي ولا يبالغ في تقرير نجاح الإقناع.
- source_word: αὐτοὺς προσμένειν
  choice: على الثبات
  rationale: يفيد προσμένω البقاء والاستمرار والملازمة؛ «الثبات» يلائم العربية في هذا السياق ويحفظ معنى الاستمرار.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: في نعمة الله
  rationale: ترجمة قريبة تحفظ العبارة اللاهوتية مفتوحة على معنى نعمة الله الفاعلة ومجال الحياة فيها، من غير اختزالها في رسالة النعمة أو في مفهوم عقدي أضيق.
theological_decisions:
- issue: دلالة «الثبات في نعمة الله»
  choice: الإبقاء على عبارة «الثبات في نعمة الله» من غير شرح تفسيري داخل النص
  alternative: الاستمرار في رضى الله / الاستمرار في رسالة نعمة الله
  rationale: النص اليوناني يحتمل أن يشمل نعمة الله بوصفها فعله الكريم والمجال الذي يعيش فيه المؤمنون؛ لذلك تُحفظ السعة والتوتر اللاهوتي بدل حصر العبارة في قراءة واحدة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «اجتماع المجمع» لإيضاح أن المقصود انتهاء الاجتماع، و«الدخلاء» بالمعنى التاريخي لمن اعتنقوا اليهودية. فُكّت الجملة الموصولة إلى جملتين لتحسين الوضوح وتثبيت مرجع المثنى بولس وبرنابا.
