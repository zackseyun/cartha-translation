  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: ar
  text: وقبل مجيئه[a]، كان يوحنا قد أعلن لجميع شعب إسرائيل معموديةَ التوبة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قبل وصوله». والعبارة اليونانية حرفيًا: «قبل وجه دخوله»، وهي تعبير اصطلاحي يفيد سبقَ مجيء شخص أو وصوله.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «معمودية للتوبة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: كان يوحنا قد نادى
  rationale: ينقل معنى الإعلان العلني السابق زمنيًا، وتُظهر صيغة «كان قد» أن مناداة يوحنا سبقت المجيء المذكور، من غير تكرار ثقيل لمعنى السبق.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: وقبل مجيئه
  rationale: العبارة اليونانية اصطلاح يفيد التقدّم على مجيء الشخص أو وصوله؛ وهذه صياغة عربية طبيعية تحافظ على الضمير كما في الأصل.
- source_word: εἰσόδου
  choice: مجيئه
  rationale: مع أن اللفظة تدل حرفيًا على الدخول، فهي في هذا السياق تشير إلى مجيء الشخص أو وصوله.
- source_word: βάπτισμα μετανοίας
  choice: بمعمودية التوبة
  rationale: تحافظ الإضافة العربية على العلاقة الموجزة والمحتملة في التركيب اليوناني بين المعمودية والتوبة، من غير حسمها سببيًا أو غائيًا.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: جميعَ شعب إسرائيل
  rationale: يحفظ معنى الشمول في παντί ومعنى الشعب في λαῷ، ويؤدي وظيفة المفعول غير المباشر مع فعل المناداة بواسطة الباء.
- source_word: Ἰωάννου
  choice: يوحنا
  rationale: الصيغة العربية الكتابية المألوفة للاسم اليوناني Ἰωάννης.
theological_decisions:
- issue: مرجع الضمير في «مجيئه»
  choice: الإبقاء على الضمير، ويفهم من السياق أنه يعود إلى يسوع، المخلّص المذكور في خطاب بولس.
  alternative: التصريح بقول «قبل مجيء يسوع».
  rationale: الآيات المحيطة تعيّن المرجع بوضوح، لكن نص هذه الآية يستعمل ضميرًا؛ لذا يحافظ النقل على صيغة الأصل من غير إدخال اسم غير مذكور فيها.
- issue: العلاقة بين المعمودية والتوبة في βάπτισμα μετανοίας
  choice: «معمودية التوبة»
  alternative: «معمودية لأجل التوبة»
  rationale: الإضافة اليونانية تحتمل أكثر من تحديد دلالي دقيق؛ وتحافظ الإضافة العربية على هذا القدر من الانفتاح بدل حصرها في معنى الغاية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «نادى» للدلالة على الإعلان العلني، و«مجيئه» بدل النقل الحرفي المتكلف للعبارة الاصطلاحية. وُضعت علامتا الحاشيتين مباشرة بعد العبارتين اللتين تفسرانهما.
