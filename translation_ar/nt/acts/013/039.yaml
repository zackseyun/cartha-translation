  text: ἐν τούτῳ πᾶς ὁ πιστεύων δικαιοῦται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/039.yaml
  text: In him everyone who believes is justified[a].
translation:
  language: ar
  text: وفيه يُبَرَّر كلُّ مَن يؤمن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبه يُبَرَّر كلُّ مَن يؤمن». ويمكن أن تُترجم العبارة اليونانية ἐν τούτῳ ترجمة أكثر حرفية: «في هذا» أو «بهذا»، وهي تشير في السياق إلى يسوع.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: وفيه
  rationale: الضمير يعود طبيعيًّا إلى يسوع المذكور في السياق السابق، ويحافظ حرف الجر «في» على البناء اليوناني مع صياغة عربية سلسة. وأُبقيت دلالة «بهذا/به» الممكنة في الحاشية.
- source_word: πᾶς ὁ πιστεύων
  choice: كلُّ مَن يؤمن
  rationale: ينقل اسم الفاعل المعرَّف المستعمل استعمالًا اسميًّا بمعناه العام، وهو تعبير عربي واضح وطبيعي يشمل كل مؤمن.
- source_word: δικαιοῦται
  choice: يُبَرَّر
  rationale: يحافظ على الدلالة القضائية للفعل δικαιόω وعلى الصلة الاصطلاحية بالتبرير، من غير توسيع تفسيري إلى «يُعلَن بارًّا» أو تضييقه إلى «يُبرَّأ».
theological_decisions:
- issue: مرجع ἐν τούτῳ
  choice: 'الإحالة الشخصية إلى يسوع: «وفيه»'
  alternative: «وبهذا» أو «وبه»
  rationale: السياق المباشر يتحدث عن يسوع بوصفه الذي تُعلَن بواسطته مغفرة الخطايا، ولذلك ترجح الإحالة إليه، مع إبقاء الوجه الأداتي الممكن في الحاشية.
- issue: دلالة δικαιοῦται
  choice: 'الدلالة القضائية: «يُبَرَّر»'
  alternative: «يُعلَن بارًّا» أو «يُبرَّأ»
  rationale: يحفظ هذا اللفظ التباين في السياق بين ناموس موسى والتبرير، ولا يحوّل التبرير ضمنًا إلى تحول أخلاقي ولا يحصره في البراءة وحدها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم الفعل المبني للمجهول «يُبَرَّر» للمحافظة على الإيجاز والدلالة اللاهوتية-القضائية للنص، وأُدرجت الواو لاتصال الجملة بما قبلها في سياق الآية الكاملة.
