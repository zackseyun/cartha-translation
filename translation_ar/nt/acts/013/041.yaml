  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: ar
  text: «انظروا، أيها المستهينون[a]، وتعجَّبوا واهلكوا[b]، لأنني أعمل عملًا في أيامكم، عملًا لن تصدِّقوه أبدًا إن رواه لكم أحد[c]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أيها المحتقرون» أو «أيها الهازئون». تدل الكلمة اليونانية على الذين يعاملون الأمر باحتقار.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «ازولوا» أو «دُمِّروا». يرد هذا القول اقتباسًا من حبقوق 1:5 بحسب النص اليوناني، ويحمل إنذارًا شديدًا بالهلاك.'
    reason: alternative_reading
  - marker: c
    text: يدل الفعل اليوناني على أن يروي المرء الأمر روايةً وافية أو يقصَّه بالتفصيل.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: اُنْظُروا
  rationale: فعل أمر للجمع يستدعي الانتباه بقوة، وصياغته واضحة وطبيعية في العربية المعاصرة.
- source_word: οἱ καταφρονηταί
  choice: أيها المحتقرون
  rationale: يحافظ على معنى الذين يعاملون الأمر بازدراء واحتقار، من غير حصره في الاستهزاء اللفظي وحده.
- source_word: θαυμάσατε
  choice: تعجَّبوا
  rationale: ينقل الأمر بالدهشة ويحفظ النبرة النبوية الحادة التي قد تحمل مفارقة إنذارية.
- source_word: ἀφανίσθητε
  choice: اهلكوا
  rationale: ينقل في سياق الاقتباس الإنذاري معنى الزوال المؤدي إلى الهلاك، مع إبقاء البديل الأقرب إلى ظاهر اللفظ في الحاشية.
- source_word: ἔργον
  choice: عملًا
  rationale: لفظ عربي واسع وطبيعي يشير هنا إلى فعل إلهي عظيم من غير زيادة تفسيرية.
- source_word: ἐργάζομαι ἐγώ
  choice: إنني أعمل
  rationale: يحفظ زمن الفعل الحاضر وتوكيد الضمير اليوناني الصريح، مع تركيب عربي سليم.
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: في أيامكم
  rationale: مقابل مباشر وطبيعي يحفظ القرب الزمني والخطابي.
- source_word: οὐ μὴ πιστεύσητε
  choice: لن تصدِّقوه أبدًا
  rationale: ينقل النفي اليوناني المؤكد بصياغة عربية واضحة وقوية.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: حتى إن رواه لكم أحدٌ بالتفصيل
  rationale: ينقل دلالة الفعل على السرد أو العرض الوافي، ويحافظ على البنية الشرطية؛ و«حتى إن» ملائمة هنا لمعنى عدم التصديق ولو وقع الإخبار.
theological_decisions:
- issue: حدة الإنذار النبوي في اقتباس حبقوق
  choice: اهلكوا
  alternative: ازولوا
  rationale: السياق تحذيري قضائي، و«اهلكوا» توصل قوة العاقبة من غير تلطيف، بينما تُذكر دلالة الزوال الممكنة في الحاشية حفاظًا على المجال الدلالي.
- issue: توكيد عدم التصديق
  choice: لن تصدِّقوه أبدًا
  alternative: لن تصدِّقوه
  rationale: أُبقيت قوة οὐ μή، من غير تفسير سبب عدم الإيمان أو إدخال تقرير مذهبي زائد.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على تتابع الأوامر والنبرة النبوية الإنذارية. وُضعت علامات الحواشي عقب الألفاظ التي تشرحها مباشرة.
