source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: ar
  text: 'وبعدما عزله، أقام لهم داود ملكًا، وشهد بشأنه أيضًا قائلًا: «وجدت داود بن يسّى، رجلًا حسب قلبي[a]، سينفذ جميع مشيئاتي[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على وفق قلبي». واليونانية حرفيًا: «حسب قلبي».'
    reason: توضيح الدلالة الاصطلاحية مع إبقاء صورة القلب في المتن.
  - marker: b
    text: 'وردت كلمة «مشيئة» في اليونانية بصيغة الجمع، ويمكن من جهة المعنى أن تُترجم: «كل ما أريده».'
    reason: بيان صيغة الجمع في الأصل وإتاحة بديل عربي أسلس دون تغيير المتن.
lexical_decisions:
- source_word: μεταστήσας
  choice: بعدما عزله
  rationale: يفيد الفعل هنا إبعاد شاول عن المُلك؛ و«عزله» واضح في السياق من غير أن يضيف معنى موته أو مجرد نقله من مكان.
- source_word: ἤγειρεν
  choice: أقام
  rationale: يحفظ التعبير الكتابي الدال على إظهار قائد وإعداده أو تعيينه، والسياق «ملكًا» يمنع فهمه على أنه قيامة من الموت.
- source_word: αὐτοῖς εἰς βασιλέα
  choice: أقام لهم داود ملكًا
  rationale: «لهم» تنقل دلالة المنفعة في ضمير المجرور، و«ملكًا» تبين الدور أو النتيجة المقصودة.
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: وشهد له قائلًا
  rationale: صياغة عربية طبيعية تحافظ على معنى الشهادة المؤيدة لداود؛ ودلالة الكلام هنا شهادة بشأنه لا مجرد خطاب مباشر إليه.
- source_word: Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί
  choice: وجدت داود بن يَسَّى
  rationale: تنقل العبارة اليونانية التي تفيد بنوته ليسّى بصياغة عربية موجزة ومألوفة.
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  choice: رجلًا حسب قلبي
  rationale: تحافظ على صورة «القلب» وعلى معنى الموافقة أو المطابقة، من غير تحويلها إلى مجرد مودة عاطفية.
- source_word: ὃς ποιήσει πάντα τὰ θελήματά μου
  choice: سيفعل كل مشيئاتي
  rationale: تحافظ «مشيئاتي» على صيغة الجمع اليونانية θελήματα وعلى معنى مقاصد الله وإراداته المتعددة في هذا السياق.
theological_decisions:
- issue: وصف داود بأنه κατὰ τὴν καρδίαν μου
  choice: حسب قلبي
  alternative: كما يوافق قلبي / على حسب قلبي
  rationale: يحفظ الاختيار صورة النص وتوترها الدلالي، فلا يختزلها في التشابه الأخلاقي الكامل ولا في الألفة العاطفية، بل يتركها دالة على الموافقة لمقصد الله.
- issue: دلالة ἤγειρεν في سياق إقامة ملك
  choice: أقام لهم داود ملكًا
  alternative: عيّن لهم داود ملكًا
  rationale: «أقام» أوسع وأقرب إلى التعبير الكتابي من «عيّن»، بينما يوضح ذكر المُلك أن المراد إبرازه وتنصيبه لا إقامته من الموت.
- issue: جمع θελήματα
  choice: كل مشيئاتي
  alternative: كل مشيئتي / كل ما أريده
  rationale: النص اليوناني يستعمل الجمع، ولذلك أُبقي الجمع في العربية بدل تسويته إلى مفرد، مع أن المفرد أكثر شيوعًا في الأسلوب العربي اللاهوتي.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُعمل «عزله» لبيان إبعاد شاول عن المُلك، و«أقام» للمحافظة على الاصطلاح الكتابي. أُبقيت صورة القلب وجمع «مشيئاتي» مع حاشيتين تمنعان سوء الفهم.
