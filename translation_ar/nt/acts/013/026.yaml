  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: ar
  text: أيها الإخوة[a]، يا أبناء سلالة إبراهيم، ويا من يتّقون الله من بينكم[b]، إلينا أُرسلت كلمة هذا الخلاص[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أيها الرجال الإخوة». والنداء في اليونانية مذكّر، وقد يشمل جمهور الحاضرين الأوسع.'
    reason: lexical_alternative
  - marker: b
    text: قد تشير العبارة إلى جماعة تُعرف عادةً بـ«خائفي الله»، وهم غير يهود كانوا يعبدون إله إسرائيل ويرتبطون بالمجمع.
    reason: cultural_note
  - marker: c
    text: 'يمكن أيضًا: «رسالة هذا الخلاص». وتقرأ مخطوطات كثيرة: «إليكم أُرسلت كلمة هذا الخلاص».'
    reason: lexical_and_textual_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: أيها الإخوة
  rationale: صيغة نداء عربية طبيعية وموقّرة تؤدي معنى المخاطبة الأخوية، مع بيان اللفظ اليوناني الحرفي في الحاشية.
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: يا أبناء نسل إبراهيم
  rationale: تحافظ «أبناء» على الصورة البنوية المذكرة، وتؤدي «نسل» معنى γένος بوصفه الأصل والسلالة.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: يا من بينكم يتّقون الله
  rationale: ترجمة وصفية واضحة لا تحسم ما إذا كانت العبارة لقبًا شبه اصطلاحي لغير اليهود المرتبطين بالمجمع.
- source_word: ἡμῖν
  choice: إلينا
  rationale: تحفظ اتجاه فعل الإرسال ودلالة ضمير المتكلمين في النص المعتمد.
- source_word: ὁ λόγος
  choice: كلمة
  rationale: تحافظ على المقابل المباشر لـ λόγος وعلى الصياغة الكتابية، مع إمكان فهمها بمعنى الرسالة أو الخبر.
- source_word: τῆς σωτηρίας ταύτης
  choice: هذا الخلاص
  rationale: تحافظ على اسم الخلاص وعلى علاقة الإضافة المحتملة في «كلمة هذا الخلاص» دون تحويلها صراحة إلى «عن هذا الخلاص».
- source_word: ἐξαπεστάλη
  choice: أُرسلت
  rationale: المبني للمجهول والماضي يؤديان صيغة الماضي اليونانية وواقعة الإرسال المكتملة بوضوح.
theological_decisions:
- issue: هوية الذين يتّقون الله
  choice: 'صياغة وصفية: «من بينكم يتّقون الله»'
  alternative: «المتّقون لله بينكم» بوصفها تسمية شبه اصطلاحية
  rationale: الصياغة الوصفية تحفظ إمكان الإشارة إلى أمميين مرتبطين بالمجمع، من غير أن تفرض هذا التحديد التاريخي على العبارة.
- issue: لغة القرابة المذكرة في النداء
  choice: «أيها الإخوة»
  alternative: صياغة شاملة صريحة مثل «أيها الإخوة والأخوات»
  rationale: يحافظ الاختيار على المذكر الوارد في اليونانية، بينما توضّح الحاشية أن النداء قد يشمل جمهور الحاضرين الأوسع.
- issue: قراءة ضمير المتلقي ἡμῖν
  choice: «إلينا» وفق نص SBLGNT المعطى
  alternative: «إليكم» وفق قراءة نصية أخرى
  rationale: تتبع الترجمة نص المصدر المحدد ἡμῖν بأمانة، مع التنبيه إلى القراءة البديلة ذات الأثر المباشر في هوية متلقي الرسالة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة. استُعمل «يتّقون الله» بدل «يخافون الله» لأنه التعبير العربي الطبيعي عن الورع الديني، وحُفظت إضافة «كلمة هذا الخلاص» لإبقاء العلاقة الدلالية في اليونانية مفتوحة نسبيًا. أُثبتت جميع علامات الحواشي في المتن.
