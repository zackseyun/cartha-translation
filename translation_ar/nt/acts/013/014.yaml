    text: 'أو «أنطاكية البيسيدية». والنص اليوناني حرفيًا: «أنطاكية البيسيدية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: أمّا هما
  rationale: يحافظ هذا التعبير على الضمير الصريح المثنّى وعلى انتقال δέ في السرد مع شيء من المقابلة، من غير تشديد زائد.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: فتابعا سيرهما من برجة
  rationale: يفيد الفعل هنا مواصلة الرحلة انطلاقًا من برجة؛ وهذه صياغة عربية طبيعية تُظهر استمرار المسير.
- source_word: παρεγένοντο
  choice: ووَصلا إلى
  rationale: يأتي παραγίνομαι في سياق السفر بمعنى الوصول إلى مكان.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: أنطاكية في بيسيدية
  rationale: تنقل الصياغة تحديد أنطاكية بحسب الإقليم بصورة واضحة وقريبة من التركيب اليوناني.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: دخلا المجمع
  rationale: حُوِّل اسم الفاعل الظرفي إلى فعل صرفي متسلسل، وهو الأسلوب الطبيعي في العربية مع حفظ معنى الدخول.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: في يوم السبت
  rationale: هذا تعبير اصطلاحي عن يوم السبت اليهودي، والمفرد هو الصياغة العربية المألوفة رغم ورود σαββάτων بصيغة الجمع.
- source_word: ἐκάθισαν
  choice: وجلسا
  rationale: ينقل الفعل الماضي الحدث البسيط بوضوح، والتثنية تُبقي مرجع الضمير ظاهرًا.
