base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: ar
  text: 'وبينما كان يوحنا يُتمّ مسيرته، كان يقول: «ماذا تظنونني أكون؟ لستُ أنا هو[a]. لكن ها إن واحدًا يأتي بعدي، ولستُ أهلًا لأن أحلّ حذاء قدميه[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «لستُ أنا المسيح». فالنص اليوناني يضمر الهوية المنفيّة، وإن كان السياق يشير إلى المسيح.'
    reason: alternative_reading
  - marker: b
    text: 'تقرأ بعض المخطوطات والترجمات بتحديد أكبر: «أن أحلّ سير حذائه»، أما النص اليوناني المطبوع هنا فيقول ببساطة: «أن أحلّ حذاء قدميه».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: كان ... يُتمّ مسيرته
  rationale: ينقل معنى بلوغ المهمة أو الخدمة المعيّنة تمامها، مع الحفاظ على استعارة الطريق، كما أن صيغة «كان يُتمّ» تعكس جانب الماضي الناقص.
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: يعكس الماضي الناقص قولًا مستمرًا أو متكررًا في خلاصة شهادة يوحنا، من غير إثقال العربية.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: ماذا تظنونني؟
  rationale: صياغة عربية طبيعية تحافظ على سؤال السامعين عن الهوية التي ينسبونها إلى يوحنا، وعلى «ماذا» المقابلة لـ τί.
- source_word: οὐκ εἰμὶ ἐγώ
  choice: لستُ أنا هو
  rationale: يحافظ على الإيجاز والإضمار في اليونانية وعلى توكيد الضمير، من غير التصريح في المتن بهوية الشخص المنفيّة.
- source_word: ἀλλ’ ἰδοὺ
  choice: لكن ها إن
  rationale: تؤدي وظيفة ἰδού في لفت الانتباه بعبارة عربية معاصرة ذات وقار.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: واحدًا يأتي بعدي
  rationale: يحافظ على المضارع الحي أو الدال على قرب المجيء، مع إظهار الفاعل المفهوم بما يلائم العربية.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: أن أحلّ حذاء قدميه
  rationale: يتبع النص المطبوع الذي يذكر الحذاء بصيغة المفرد مع «القدمين»، ولا يضيف «سير» غير الموجود في هذا النص.
- source_word: ἄξιος
  choice: أهلًا
  rationale: «أهلًا» تعبير عربي واضح وطبيعي عن الجدارة أو الاستحقاق في صيغة التواضع هذه.
theological_decisions:
- issue: الهوية التي ينفيها يوحنا في οὐκ εἰμὶ ἐγώ
  choice: لستُ أنا هو
  alternative: لستُ أنا المسيح
  rationale: السياق يشير بقوة إلى أن يوحنا ينفي كونه المسيح المنتظر، لكن اليونانية تضمر الاسم؛ لذلك يحافظ المتن على الإضمار وتوضحه الحاشية من غير حسم زائد داخل النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على الإضمار اللاهوتي في نفي هوية يوحنا، وعلى استعارة المسيرة، وتُجنبت إضافة «سير الحذاء» إلى المتن لعدم وجودها في نص SBLGNT المقدم.
