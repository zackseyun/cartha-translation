  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: ar
  text: وفي السبت التالي[a]، اجتمع تقريبًا جميع سكان المدينة ليسمعوا كلمة الرب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «السبت الآتي» أو «السبت الذي يليه».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تُفهم «كلمة الرب» أيضًا بمعنى «رسالة الرب»، أو بحسب السياق: «الرسالة عن الرب».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: وفي السبت التالي
  rationale: التركيب في حالة المجرور/الداتيف يفيد الزمن، وἐρχομένῳ يدل على السبت الآتي أو التالي. «السبت التالي» عربية واضحة وطبيعية، مع إثبات البديل في الحاشية.
- source_word: σχεδὸν
  choice: تقريبًا
  rationale: تفيد σχεδόν معنى «تقريبًا/كاد»، وهنا تتصل طبيعيًا بعبارة «المدينة كلها».
- source_word: πᾶσα ἡ πόλις
  choice: المدينة كلها
  rationale: تعبير مجازي شائع يقصد به سكان المدينة على نحو شامل، من غير أن يلزم منه حضور كل فرد بلا استثناء.
- source_word: συνήχθη
  choice: اجتمعت
  rationale: الفعل المبني للمجهول من συνάγω يُستعمل هنا بمعنى لازم قريب من «تجمّعوا/اجتمعوا». واختيار «اجتمعت» يلائم الفاعل الجمعي «المدينة».
- source_word: ἀκοῦσαι
  choice: لتسمع
  rationale: المصدر يدل على الغرض من الاجتماع؛ واللام مع المضارع تنقل هذا المعنى بإيجاز ووضوح.
- source_word: τὸν λόγον
  choice: كلمة
  rationale: λόγος قد يعني الكلمة أو الرسالة، لكن «كلمة» تحفظ اصطلاح لوقا المتكرر في سفر الأعمال ولا تفسره تفسيرًا زائدًا.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: الإضافة «كلمة الرب» تنقل تركيب المضاف إليه مباشرة وتحفظ احتمال تعلق الكلمة بالرب من جهة المصدر أو الانتماء أو الموضوع.
theological_decisions:
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: «الرب» المقابل المعتاد لـκύριος في سياق الكرازة المسيحية في سفر الأعمال، وهو يحفظ الصياغة اللاهوتية المألوفة من غير تضييق مرجع اللفظ أكثر مما يقتضيه النص.
- issue: دلالة «كلمة الرب»
  choice: الإبقاء على العبارة الإضافية «كلمة الرب»
  alternative: رسالة الرب؛ الرسالة عن الرب
  rationale: 'يمكن للإضافة اليونانية أن تحمل دلالات متداخلة: الكلمة التي للرب أو منه، أو الكلمة المتعلقة به. الإبقاء على التركيب يحفظ هذا التعدد بدل حسمه تفسيريًا.'
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ورصينة. استُعمل «السبت التالي» بدل تعبير حرفي أثقل، وحُفظت عبارة «كلمة الرب» لما فيها من صدى لوقاوي وغموض دلالي أصيل.
