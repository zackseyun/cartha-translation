  source_fidelity: 'النص العربي أمين للأصل اليوناني: «فنهض» ينقل ἀναστὰς، والفاء مناسبة لوظيفة δέ السردية، و«أشار بيده» تنقل حركة κατασείσας τῇ χειρί من غير تحديد زائد لطبيعة الإشارة. كما يحفظ النداءُ مجموعتي المخاطَبين، ويترجم الأمر ἀκούσατε ترجمة مباشرة مناسبة.'
