  terminology: «رجال إسرائيل» يحافظ على النداء المذكّر في Ἄνδρες Ἰσραηλῖται، و«من تخافون الله» يحفظ الوصف الفعلي οἱ φοβούμενοι τὸν θεόν دون فرض لقب اصطلاحي في المتن. الحاشية تعرض «خائفي الله» كبديل وتقيّد التفسير التاريخي بعبارة «يُرجَّح»، وهو مناسب.
