  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: ar
  text: 'فنهض بولس، وأشار بيده وقال: «يا رجال إسرائيل، ويا من تخافون الله[a]، اسمعوا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يا خائفي الله». يُرجَّح أن العبارة تشير إلى أشخاص من غير اليهود كانوا يعبدون الله ويرتبطون بالمجمع اليهودي.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: نهض
  rationale: اسم فعل ماضٍ من ἀνίστημι يصف حركة بولس الجسدية قبل أن يتكلم. «نهض» تعبير عربي طبيعي وموجز يحفظ معنى قيامه.
- source_word: δὲ
  choice: فـ
  rationale: تفيد الأداة هنا تتابع السرد لا مقابلة قوية؛ والفاء تصل قيام بولس بالسياق السابق بسلاسة.
- source_word: κατασείσας τῇ χειρὶ
  choice: أشار بيده
  rationale: تصف العبارة حركة باليد لاستجلاب الانتباه أو طلب الهدوء. «أشار بيده» واضحة وطبيعية ولا توحي بتلويح مضطرب.
- source_word: εἶπεν
  choice: قال
  rationale: هو المقابل العربي المعتاد لفعل القول الذي يقدم كلامًا مباشرًا.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: يا رجال إسرائيل
  rationale: يحفظ النداء وصيغة ἄνδρες المذكرة، مع إبقاء الانتساب إلى إسرائيل بصياغة عربية مفهومة.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: يا من تخافون الله
  rationale: يحفظ القوة الفعلية لاسم الفاعل اليوناني ويخاطب المجموعة الثانية مباشرة، من غير تحويل الوصف في المتن إلى مصطلح تقني.
- source_word: ἀκούσατε
  choice: اسمعوا
  rationale: أمر يدعو إلى الإصغاء والانتباه، و«اسمعوا» مباشر وفصيح وملائم لخطاب علني.
theological_decisions:
- issue: تمييز المخاطَبين الإسرائيليين عن المجموعة التي تخاف الله في المجمع
  choice: «يا رجال إسرائيل، ويا من تخافون الله»
  alternative: «أيها الرجال الإسرائيليون، ويا خائفي الله»
  rationale: يميز النص اليوناني بين الإسرائيليين ومجموعة ثانية موصوفة بأنها تخاف الله، ويُرجح أنها من غير اليهود المرتبطين بالمجمع. تحافظ الصياغة على هذا التمييز من غير الجزم في المتن بهوية المجموعة أو استعمال لقب اصطلاحي قد لا يفهمه القارئ.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل النداء بـ«يا» ليبدو الخطاب طبيعيًا، وحُفظت صيغة «رجال» لأن الأصل يذكر الذكور صراحة. نُقلت علامة الحاشية إلى العبارة التي تشرحها الحاشية، وهي «من تخافون الله».
