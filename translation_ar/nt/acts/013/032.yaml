  yaml_path: translation/nt/acts/013/032.yaml
  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: ar
  text: ونحن نبشّركم بالوعد الذي أُعطي للآباء.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الأجداد» أو «الأسلاف». يقول النص اليوناني حرفيًا «الآباء»، في إشارة تاريخية عهدية إلى آباء إسرائيل.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف يصل القول بما سبقه من غير إضافة دلالة تفسيرية.
- source_word: ἡμεῖς
  choice: نحن
  rationale: إظهار الضمير في العربية يحفظ توكيد الضمير اليوناني الصريح، من غير حاجة إلى إضافة «أنفسنا» الثقيلة هنا.
- source_word: ὑμᾶς εὐαγγελιζόμεθα
  choice: نبشّركم
  rationale: الفعل العربي المتعدي «نبشّر» ينقل معنى إعلان الخبر السار، وضمير المخاطبين ينقل ὑμᾶς بوضوح وطبيعية.
- source_word: τὴν ... ἐπαγγελίαν
  choice: بالوعد
  rationale: السياق يتحدث عن وعد إلهي محدد؛ والباء تلائم تعدية «نبشّر» إلى مضمون البشارة.
- source_word: πρὸς τοὺς πατέρας
  choice: للآباء
  rationale: تحفظ «الآباء» اللفظ العائلي المذكر والدلالة التاريخية العهدية، واللام تؤدي معنى توجّه الوعد إليهم.
- source_word: γενομένην
  choice: الذي صار
  rationale: ترجمة قريبة من معنى γίνομαι وتحفظ قدرًا من اتساع التعبير اليوناني، فلا تستبق الآية التالية بلفظ «تحقق»؛ والمقصود أنه صدر أو جُعل لهم.
theological_decisions:
- issue: ترجمة πατέρες
  choice: الآباء
  alternative: الأجداد أو الأسلاف
  rationale: النص اليوناني يستعمل اللفظ العائلي المذكر، وهو هنا تسمية تاريخية عهدية لآباء إسرائيل؛ أبقيناه في المتن وذكرنا البديل الدلالي في الحاشية.
- issue: دلالة γενομένην
  choice: صار للآباء
  alternative: قُطع للآباء أو أُعطي للآباء
  rationale: يحافظ هذا على الصياغة العامة للمصدر ولا يفسرها على أنها إتمام الوعد، إذ يأتي بيان الإتمام في الآية التالية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «نبشّركم» لأنه طبيعي وموجز، وأُظهر «نحن» لحفظ توكيد الضمير اليوناني. وُضعت علامة الحاشية في المتن كما يلزم.
