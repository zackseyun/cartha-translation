  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: ar
  text: فوثب، فوقف وأخذ يمشي. ثم دخل معهما إلى الهيكل، وهو يمشي ويقفز ويسبّح الله.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: فَوَثَبَ واقفًا
  rationale: يفيد الفعل الوثوب أو القفز إلى أعلى، ومع ἔστη يصوّر نهوضه السريع إلى وضع الوقوف.
- source_word: περιεπάτει
  choice: أخذ يمشي
  rationale: صيغة الماضي الناقص تشير إلى بدء فعل مستمر؛ وهذه العبارة تؤدي المعنى طبيعيًا بالعربية.
- source_word: τὸ ἱερὸν
  choice: الهيكل
  rationale: يشير هنا إلى مجمّع الهيكل، و«الهيكل» هو المقابل العربي الكتابي الواضح في السياق.
- source_word: ἁλλόμενος
  choice: يقفز
  rationale: يصف قفز الرجل بعد شفائه؛ واختيار «يقفز» يميّزه أسلوبيًا عن وثبته الأولى مع الحفاظ على الصورة الحركية.
- source_word: αἰνῶν τὸν θεόν
  choice: يسبّح الله
  rationale: «يسبّح» تعبير عربي طبيعي ودقيق عن إعلان حمد الله والثناء عليه.
