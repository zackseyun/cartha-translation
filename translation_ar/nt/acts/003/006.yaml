base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: ar
  text: 'فقال بطرس: «ليس عندي فضة ولا ذهب، لكن ما عندي فهذا أعطيك إياه: باسم يسوع المسيح الناصري[a]، امشِ.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: المنسوب إلى الناصرة. واليونانية تقول حرفيًا: «الناصري».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: فضة ولا ذهب
  rationale: حُفظ ذكر المعدنين صراحةً كما في اليونانية، مع استعمال «ولا» الطبيعي بعد النفي في العربية؛ والتعبير يشير في السياق إلى المال والثروة المادية.
- source_word: οὐχ ὑπάρχει μοι
  choice: ليس عندي
  rationale: ترجمة عربية طبيعية لبنية تفيد الملك أو التوافر، من غير تكلّف في محاكاة التركيب الوجودي اليوناني.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: ولكن ما عندي، فهذا أعطيك إياه
  rationale: تحفظ المقابلة والتوكيد في τοῦτο («فهذا»)، وتوضح المفعول بضمير عربي طبيعي.
- source_word: ἐν τῷ ὀνόματι
  choice: باسم
  rationale: صياغة عربية مألوفة تحفظ دلالة الاسم وما قد تتضمنه من سلطان أو وكالة، من دون حصر العبارة في تفسير واحد.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويبقي معناه اللقبي حاضرًا ضمن الصياغة العربية الطبيعية.
- source_word: τοῦ Ναζωραίου
  choice: الناصري
  rationale: ينقل الصفة اللقبية اليونانية مباشرةً؛ ويمكن فهمها أيضًا بمعنى المنسوب إلى الناصرة، وهو مبيّن في الحاشية.
- source_word: περιπάτει
  choice: امشِ
  rationale: أمر مباشر وموجز يطابق فعل المشي في الأصل، من غير إضافة معنى «ابدأ» غير المصرّح به.
theological_decisions:
- issue: دلالة Χριστοῦ في صيغة الاسم
  choice: المسيح
  alternative: المسيح باعتباره لقبًا ممسوحًا، أو نقله صوتيًا «كريستوس»
  rationale: «المسيح» في العربية ترجمة راسخة للقب اليوناني وتحفظ دلالته اللاهوتية، ولا تحوله إلى اسم علم مبهم.
- issue: قوة عبارة ἐν τῷ ὀνόματι
  choice: باسم
  alternative: بسلطان
  rationale: أُبقيت صيغة «الاسم» لتحتمل دلالة السلطان والوكالة والارتباط بالشخص معًا، بدل حصرها في معنى تفسيري واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «ليس عندي» بدل تركيب حرفي ثقيل، مع إبقاء المقابلة البلاغية بين انعدام الفضة والذهب وبين العطية التي يملكها بطرس. وُضع موضع الحاشية النصية في نهاية الآية لأنها تتعلق بإضافة مخطوطية بعد فعل الأمر.
