lexical_decisions:
- source_word: τις ἀνὴρ
  choice: رجلٌ
  rationale: تُفيد العبارة شخصًا غير مسمّى لكنه معيّن في سياق القصة؛ وتؤدي «كان هناك رجل» هذا المعنى بأسلوب عربي طبيعي.
- source_word: χωλὸς
  choice: أعرج
  rationale: لفظ عربي واضح ومباشر يدل على العجز عن المشي على نحو طبيعي، من غير استعمال تعبير جارح أو متكلّف.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: منذ أن كان في بطن أمه
  rationale: يحفظ صورة النص اليوناني، مع الإشارة في الحاشية إلى المعنى الاصطلاحي «منذ ولادته».
- source_word: ὑπάρχων
  choice: 'مدمج في وصف حاله: «أعرج منذ أن كان...»'
  rationale: اسم الفاعل يصف حالة مستمرة، ويؤدَّى طبيعيًا في العربية ضمن الجملة الوصفية دون ترجمة مستقلة متكلّفة.
- source_word: ἐβαστάζετο
  choice: كان يُحمَل
  rationale: يحفظ المبني للمجهول ودلالة الماضي المستمر أو المتكرر في صيغة الناقص اليوناني.
- source_word: ἐτίθουν
  choice: فيضعونه
  rationale: مع «كل يوم» تفيد الصيغة عادةً متكررة في الماضي، وتحافظ على عدم تعيين الفاعلين كما في اليونانية.
- source_word: καθ’ ἡμέραν
  choice: كل يوم
  rationale: تعبير عربي معاصر واضح ينقل الدلالة التوزيعية اليومية.
- source_word: θύραν τοῦ ἱεροῦ
  choice: باب الهيكل
  rationale: «باب» ملائم للمدخل المعماري، و«الهيكل» هو المقابل العربي المألوف؛ وتوضح الحاشية أن ἱερόν يشمل مجمّع الهيكل وساحاته.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: الذي يُقال له «الجميل»
  rationale: يحافظ على صيغة التسمية وعلى المعنى الحرفي للاسم اليوناني.
- source_word: τοῦ αἰτεῖν
  choice: ليطلب
  rationale: لام التعليل تنقل بوضوح غرض وضعه عند الباب.
- source_word: ἐλεημοσύνην
  choice: صدقة
  rationale: لفظ عربي شائع ودقيق للعطية المقدمة إلى المحتاج، وهو أوضح للقارئ المعاصر من «حسنة» في هذا السياق.
- source_word: παρὰ τῶν εἰσπορευομένων
  choice: من الداخلين
  rationale: يحفظ معنى طلب الصدقة من الأشخاص الذين كانوا في أثناء دخولهم.
