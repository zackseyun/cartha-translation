  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: ar
  text: الذي ينبغي أن تستقبله السماء إلى أزمنة ردِّ كلِّ الأشياء التي تكلَّم الله عنها على لسان أنبيائه القديسين منذ القديم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ
  choice: ينبغي
  rationale: ينقل معنى الضرورة الإلهية أو ما لا بد أن يتم، من غير زيادة تفسيرية.
- source_word: οὐρανὸν ... δέξασθαι
  choice: أن تستقبله السماء
  rationale: يحافظ على كون «السماء» فاعل المصدر وعلى صورة الاستقبال الواردة في اليونانية.
- source_word: ἄχρι χρόνων
  choice: إلى أزمنة
  rationale: صياغة مباشرة تحفظ جمع «أزمنة» ولا تحوّله إلى زمن مفرد.
- source_word: ἀποκαταστάσεως πάντων
  choice: ردِّ كلِّ الأشياء
  rationale: «ردّ» يفيد الإعادة إلى الحال المقصودة، مع إبقاء نطاق «الكل» عامًا كما في الأصل دون حسم لاهوتي زائد.
- source_word: ὧν ἐλάλησεν ὁ θεὸς
  choice: التي تكلَّم الله بها
  rationale: يحفظ القراءة النحوية الأقرب للنص، حيث يعود الموصول إلى «كل الأشياء»، ولا يستبدله بتعبير تفسيري مثل «التي تكلم الله عنها».
- source_word: διὰ στόματος
  choice: على لسان
  rationale: تعبير عربي طبيعي ودقيق للأداة النبوية التي يتكلم الله بواسطتها.
- source_word: ἀπ’ αἰῶνος
  choice: منذ الدهر
  rationale: ينقل معنى القِدم البعيد بصياغة عربية كتابية مفهومة، دون الإيحاء بالأزل المطلق.
theological_decisions:
- issue: نطاق «رد كل الأشياء»
  choice: 'الإبقاء على العبارة عامة: «ردِّ كلِّ الأشياء»'
  alternative: «إصلاح كل شيء» أو تقييدها بردّ الخليقة/إسرائيل
  rationale: الأصل لا يحدد هنا نطاق الرد تحديدًا تفصيليًا، لذلك تُصان السعة والتوتر اللاهوتي ولا يُفرض تفسير مذهبي.
- issue: صلة الاسم الموصول ὧν
  choice: «التي تكلَّم الله بها»
  alternative: «التي تكلَّم الله عنها»
  rationale: الترجمة المختارة تحافظ على البنية الحرفية وعلى احتمال أن تكون الأمور الموعودة نفسها مضمون كلام الله، بدل إدخال حرف «عن» التفسيري.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. روعي إبقاء ترتيب المعاني قريبًا من اليونانية، مع صياغة عربية طبيعية نسبيًا وعدم إزالة غموض العبارة المتعلق بنطاق ردّ كل الأشياء.
