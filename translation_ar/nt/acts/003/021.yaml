  to: الذي ينبغي أن تستقبله السماء إلى أزمنة ردِّ كلِّ الأشياء التي تكلَّم الله عنها على لسان أنبيائه القديسين منذ القديم.
  rationale: يصحح التعديل علاقة الموصول بالفعل «تكلّم» وفق الدلالة اليونانية، ويستبدل تعبيرًا زمنيًا بتعبير عربي أوضح، مع الإبقاء على عمومية «ردّ كل الأشياء» وبنية استقبال السماء للمسيح.
