  source_fidelity: يلزم تصحيح صلة الموصول في العبارة الأخيرة. فـὧν مع ἐλάλησεν تفيد ما تكلّم الله عنه، لا الأشياء التي «تكلّم بها» بوصفها أداة للكلام. أمّا بناء «الذي ينبغي أن تستقبله السماء» فيحافظ على كون المسيح مفعولًا به و«السماء» فاعلًا، وهو مطابق للأصل.
  naturalness: النص سليم في الجملة، لكن «التي تكلّم الله بها» غير طبيعي في العربية بهذا المعنى وقد يوحي بأن الأشياء وسيلة الكلام. كما أن «منذ القديم» أوضح وأشيع في الفصحى المعاصرة من «منذ الدهر» هنا، مع حفظ معنى القِدم البعيد.
  terminology: «ردّ كل الأشياء» يحفظ عمومية ἀποκαταστάσεως πάντων من غير فرض تفسير لاهوتي. و«أنبيائه القديسين» مناسب لـτῶν ἁγίων ... προφητῶν، و«على لسان» تعبير عربي راسخ لـδιὰ στόματος.
