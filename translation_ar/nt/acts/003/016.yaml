reference: Acts 3:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: ar
  text: وعلى أساس الإيمان باسمه[a]، قوّى اسمه نفسه هذا الرجل الذي ترونه وتعرفونه؛ والإيمان الذي من خلاله أعطاه هذه السلامة التامة[b] أمامكم جميعًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الثقة باسمه». وقد تعني الكلمة اليونانية «الإيمان» أو «الثقة»، وفي بعض السياقات «الأمانة».
    reason: lexical_alternative
  - marker: b
    text: أو «الصحة الكاملة».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: على أساس الإيمان
  rationale: تفيد ἐπί مع المجرور هنا الأساس أو المرتكز، وهذه الصياغة تحفظ الدلالة السببية من غير اختزالها في مجرد الوسيلة.
- source_word: πίστει
  choice: الإيمان
  rationale: يدل السياق على الاتكال المرتبط باسم يسوع. اختير «الإيمان» في المتن، مع إثبات «الثقة» بديلًا معجميًا في الحاشية.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: باسمه
  rationale: الإضافة مع πίστις تدل هنا على الإيمان المتعلق باسمه. والاسم في سفر الأعمال يشير إلى شخص يسوع وسلطانه من غير أن يُستبدل هذا التعبير المشحون دلاليًا بتفسير مباشر.
- source_word: ἐστερέωσεν
  choice: قد قوّى
  rationale: الفعل يعني جعله قويًا أو ثابتًا، والصياغة تلائم استعادة قوة جسد الرجل مع إبراز النتيجة الظاهرة.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: ترونه وتعرفونه
  rationale: تحفظ العبارة عنصرَي المعاينة والمعرفة المباشرة بالرجل، بلغة عربية واضحة وموجزة.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: اسمه نفسه
  rationale: أُبقي «الاسم» فاعلًا كما في اليونانية، وأضيف «نفسه» لإبراز التكرار والتوكيد المقصودين من غير تحويله إلى «يسوع نفسه» أو «قوة اسمه».
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: الإيمان الذي بواسطته
  rationale: 'تحفظ الصياغة غموض δι’ αὐτοῦ المعقول: هل الإيمان آتٍ بواسطة يسوع أم فاعل من خلاله، من غير تعيين صاحب الإيمان.'
- source_word: ἔδωκεν αὐτῷ
  choice: أعطاه
  rationale: ينقل الماضي البسيط الفعل اليوناني التام في سياقه، بينما تُظهر بقية الجملة النتيجة الحاضرة علنًا.
- source_word: ὁλοκληρίαν
  choice: السلامة التامة
  rationale: اللفظة تدل على اكتمال السلامة والصحة. «السلامة التامة» طبيعية ودقيقة في سياق الشفاء الجسدي، ولا توسع المعنى إلى مفهوم روحي غير مصرّح به.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: أمامكم جميعًا
  rationale: تنقل الطبيعة العلنية المشهودة للشفاء بعبارة عربية مباشرة.
theological_decisions:
- issue: الإيمان بالاسم، والإيمان الذي بواسطته، والفاعل في الشفاء
  choice: نُسب تقوية الرجل إلى اسم يسوع، مع إبقاء الإيمان متعلقًا بالاسم وواقعًا «بواسطته»، من غير تحديد صاحب هذا الإيمان.
  alternative: أن يكون المقصود إيمان الرجل المشفي، أو إيمان الرسولين، أو إيمانًا يولّده يسوع.
  rationale: لا يصرّح النص اليوناني بصاحب الإيمان، كما أن δι’ αὐτοῦ تحتمل أكثر من تحديد دقيق؛ لذلك تحفظ الترجمة التوتر والغموض بدل حسمهما.
- issue: الدلالة المجازية لكلمة «الاسم»
  choice: الإبقاء على «اسمه» في المتن بوصفه تعبيرًا يشير إلى شخص يسوع وسلطانه.
  alternative: «يسوع نفسه قوّى الرجل» أو «قوة اسمه قوّت الرجل».
  rationale: تكرار «الاسم» بارز في تركيب لوقا، واستبداله بتفسير مباشر يسطّح التعبير وقد يضيف ما لم يقله النص صراحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حُفظ التكرار البلاغي لكلمة «اسمه» وبنية الإسناد اللافتة في اليونانية، مع تجنب صياغة حرفية متعثرة. وُضعت جميع علامات الحواشي في المتن.
