id: ACT.3.20
reference: Acts 3:20
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: ar
  text: لكي تأتي أوقات الانتعاش من حضرة الرب، ويرسل المسيح المعيَّن لكم[a]، يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المعيَّن إليكم»، أو: «المعيَّن لكم من قبل».'
    reason: بديل معجمي يحفظ احتمال دلالة الداتيف وإمكان إبراز معنى التعيين السابق في προκεχειρισμένον.
lexical_decisions:
- source_word: ὅπως ἂν
  choice: لكي
  rationale: تُدخل جملة غرض أو نتيجة مرتبطة بالدعوة السابقة إلى التوبة، وتحافظ «لكي» على هذا الارتباط بصياغة عربية طبيعية.
- source_word: ἔλθωσιν
  choice: تأتي
  rationale: الفعل في صيغة الاحتمال التابعة لأداة الغرض؛ وينقل نصب المضارع بعد «لكي» هذا المعنى من غير إثقال العبارة.
- source_word: καιροὶ
  choice: أوقات
  rationale: يحمل اللفظ معنى أزمنة أو مواسم ملائمة، و«أوقات» واضحة وتحافظ على سعته الدلالية دون تحديد إسخاتولوجي زائد.
- source_word: ἀναψύξεως
  choice: الانتعاش
  rationale: ينقل معنى الراحة والتجدد مع الحفاظ على الصورة المجازية في الأصل.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: من حضرة الرب
  rationale: «حضرة» تعبر طبيعيًا عن التعبير الاصطلاحي الذي يعني الحضور، بدل الترجمة الحرفية «وجه الرب» التي قد توهم معنى مختلفًا.
- source_word: ἀποστείλῃ
  choice: ويرسلَ
  rationale: يحافظ العطف مع نصب المضارع على تبعية الفعل لـ«لكي» وعلى توازيه مع الفعل السابق.
- source_word: προκεχειρισμένον
  choice: المعيَّن
  rationale: يفيد التعيين أو الاختيار السابق؛ و«المعيَّن» موجزة وطبيعية، مع بيان عنصر السبق المحتمل في الحاشية.
- source_word: ὑμῖν
  choice: لكم
  rationale: الداتيف يحتمل «لكم» أو «إليكم»؛ و«لكم» يلائم معنى التعيين لأجل المخاطَبين أو لصالحهم.
- source_word: χριστὸν
  choice: المسيح
  rationale: يعمل هنا بوصفه لقبًا مسيانيًا، فترجمته «المسيح» أوضح من معاملته كجزء من الاسم.
- source_word: Ἰησοῦν
  choice: يسوعَ
  rationale: النقل العربي المعياري للاسم، وجاء منصوبًا بدلًا أو عطف بيان من «المسيح».
theological_decisions:
- issue: هل يُنقل χριστὸν بوصفه لقبًا أم بصيغة اسمية تقليدية؟
  choice: المسيح
  alternative: كريستوس/المسيح بوصفه جزءًا اسميًا ثابتًا
  rationale: السياق يقدّم يسوع باعتباره المسيح الموعود، لذلك تحافظ «المسيح» على دلالة اللقب وعلى الخلفية اليهودية للنص.
- issue: دلالة προκεχειρισμένον ὑμῖν
  choice: المعيَّن لكم
  alternative: المعيَّن إليكم؛ المعيَّن لكم من قبل
  rationale: يحفظ النص الرئيس المعنى المركزي من غير إثقال، بينما تُذكر في الحاشية إمكانات الداتيف ودلالة السبق الكامنة في صيغة الفعل.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعملت «حضرة الرب» للتعبير الطبيعي عن معنى الحضور، و«الانتعاش» للمحافظة على صورة الراحة والتجدد. وُضع مؤشر الحاشية بعد الجملة التي تتعلق بها البدائل.
