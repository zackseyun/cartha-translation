lexical_decisions:
- source_word: ὃς ἰδὼν
  choice: فلمّا رأى
  rationale: يعود الضمير الموصول على الرجل المذكور في الآية السابقة، وتؤدي «فلمّا رأى» العلاقة الزمنية التي تفيدها صيغة اسم الفاعل الماضي بأسلوب عربي طبيعي.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: بطرس ويوحنا
  rationale: الصيغتان العربيتان المألوفتان للاسمين في النص الكتابي.
- source_word: μέλλοντας εἰσιέναι
  choice: يوشكان أن يدخلا
  rationale: تفيد μέλλω مع المصدر هنا قرب وقوع الدخول، وتعبّر صيغة المثنى عن بطرس ويوحنا بدقة.
- source_word: εἰς τὸ ἱερόν
  choice: ساحة الهيكل
  rationale: تشير ἱερόν إلى حرم الهيكل أو مجمّعه لا إلى المقدس الداخلي خصوصًا؛ و«ساحة الهيكل» واضحة في السياق، مع إيضاح مدى اللفظ في الحاشية.
- source_word: ἠρώτα
  choice: أخذ يطلب
  rationale: الفعل في صيغة الماضي الناقص، وهي تلائم طلبًا جاريًا أو متكررًا؛ وتؤدي «أخذ يطلب» هذا الجانب من غير تثقيل.
- source_word: ἐλεημοσύνην λαβεῖν
  choice: يطلب منهما صدقة
  rationale: المقصود التماس عطية للفقراء. أُدمج معنى «أن يأخذ» في التركيب العربي الطبيعي «يطلب منهما صدقة»، إذ يظل التلقي مفهومًا بوضوح من السياق.
