  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: ar
  text: 'فلما رأى بطرس ذلك، أجاب الشعب: «يا رجال إسرائيل، لماذا تتعجبون من هذا، أو لماذا تحدّقون إلينا[a]، كأننا بقوتنا الخاصة أو بتقوانا[b] جعلناه يمشي؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تثبتون أنظاركم علينا». يدل الفعل على نظرة مركزة مستمرة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بورعنا». ينفي بطرس أن يكون شفاء الرجل قد صدر عن تدين الرسولين أو صفة روحية خاصة بهما.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: فلما رأى بطرس ذلك
  rationale: تؤدي صيغة «لما» المعنى الزمني لاسم الفاعل الماضي، وتعبّر الفاء عن الانتقال السياقي، أما «ذلك» فتستعيد من السياق رد فعل الجمع على الشفاء.
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: أجاب الشعب
  rationale: يحافظ هذا التعبير على معنى الاستجابة للموقف، حتى مع عدم وجود سؤال صريح سابق، وهو عربي فصيح ومفهوم.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: يا رجال إسرائيل
  rationale: يحافظ على النداء المذكر الصريح في اليونانية وعلى طابع الخطاب العلني.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: لماذا تتعجبون من هذا
  rationale: «تتعجبون» تنقل معنى الدهشة والعجب، و«من هذا» تشير طبيعيًا إلى واقعة الشفاء.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: ولماذا تحدّقون إلينا
  rationale: «تحدّقون» تنقل دلالة النظر المثبت والمستمر في ἀτενίζω، وحرف الجر «إلى» ملائم للفعل في العربية.
- source_word: ὡς ἰδίᾳ δυνάμει
  choice: كأننا بقوتنا الخاصة
  rationale: «كأننا» تعرض الافتراض الخاطئ الذي ينفيه بطرس، و«الخاصة» تحفظ توكيد ἰδίᾳ على أن القوة منسوبة إليهما شخصيًا.
- source_word: εὐσεβείᾳ
  choice: بتقوانا
  rationale: «التقوى» لفظ عربي واضح ذو دلالة دينية يشمل الورع والتعبد، ويصلح هنا لصفة روحية شخصية ينفي بطرس كونها مصدر الشفاء.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: جعلناه يمشي
  rationale: صياغة سببية عربية طبيعية تنقل نسبة إحداث المشي إلى الرسولين ضمن الافتراض الذي يرفضه بطرس.
theological_decisions:
- issue: هل توحي ترجمة εὐσεβείᾳ بأن الشفاء نتج من استحقاق الرسولين الروحي؟
  choice: بتقوانا
  alternative: بورعنا
  rationale: يحفظ النص البعد الديني للكلمة، فيما ينفي السياق صراحة أن تكون الصفة الروحية الذاتية للرسولين سبب الشفاء، من غير إدخال نظرية لاهوتية لاحقة عن الاستحقاق.
- issue: النداء المذكر Ἄνδρες Ἰσραηλῖται
  choice: يا رجال إسرائيل
  alternative: يا بني إسرائيل
  rationale: «يا رجال إسرائيل» تعكس اللفظ المذكر ἄνδρες مباشرة، ولا تحوّله إلى نداء محايد، مع عدم الجزم بأن الحاضرين لم يشملوا نساء.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة خطابية كريمة. استُخدم «تحدّقون» لقوة الفعل اليوناني، و«التقوى» للمحافظة على البعد الديني من غير تحميل العبارة اصطلاحًا مذهبيًا.
