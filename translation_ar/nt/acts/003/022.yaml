base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: ar
  text: 'فإن موسى قال[a]: «سيُقيم لكم الرب الإله نبيًّا من بين إخوتكم مثلي[b]. فاسمعوا له في كل ما يقوله لكم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة الأداة: «أمّا موسى فقال». وهي تفيد هنا التوكيد أو تمهّد لتقدّم الحديث.'
    reason: lexical_alternative
  - marker: b
    text: 'يقتبس سفر الأعمال هنا تثنية 18:15 بصياغة مختلفة قليلًا؛ فنص الأعمال اليوناني يقول «الرب الإله»، لا «الرب إلهكم». وعبارة «من بين إخوتكم» تعني هنا: من بين بني قومكم، أي بني إسرائيل.'
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς
  choice: موسى
  rationale: الصيغة العربية المعيارية للاسم.
- source_word: μὲν
  choice: حقًّا
  rationale: تنقل توكيد الأداة ووظيفتها في تطوير الخطاب من غير إثقال العبارة.
- source_word: εἶπεν ὅτι
  choice: 'قال: «...»'
  rationale: الاقتباس المباشر طبيعي في العربية ويُظهر صيغة الاستشهاد بوضوح.
- source_word: Προφήτην
  choice: نبيًّا
  rationale: يحافظ على التنكير في اليونانية ولا يُدخل لقبًا مسيانيًّا صريحًا في النص.
- source_word: ἀναστήσει
  choice: سيُقيم
  rationale: ينقل معنى الإظهار أو التعيين في سياق تثنية 18، من دون جعل القيامة المعنى الأساسي هنا.
- source_word: κύριος ὁ θεὸς
  choice: الرب الإله
  rationale: يتبع نص أعمال الرسل الذي لا يتضمن ضمير «إلهكم»، ولا يوافقه قسرًا مع صياغة التثنية.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: من بين إخوتكم
  rationale: ينقل ἐκ بعبارة «من بين»، ويحافظ على لغة القرابة المذكرة ذات الدلالة العهدية والقومية.
- source_word: ὡς ἐμέ
  choice: مثلي
  rationale: تعبير عربي موجز وطبيعي يحفظ معنى المقارنة بموسى.
- source_word: αὐτοῦ ἀκούσεσθε
  choice: فله تسمعون
  rationale: يحفظ قوة المستقبل ذات الدلالة الإلزامية أو العهدية، ويُفهم منه الإصغاء والطاعة لا مجرد السماع الحسي.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: في كل ما يكلّمكم به
  rationale: صياغة عربية واضحة تحافظ على الشمول وعلى معنى الكلام الموجَّه إليهم.
theological_decisions:
- issue: الاقتباس من تثنية 18 وتحديد هوية النبي مسيانيًّا
  choice: الإبقاء على «نبيًّا» من غير إدخال لفظ «المسيح» أو تحويلها إلى لقب «النبي».
  alternative: التفسير الصريح بعبارة «المسيح» أو «النبي المنتظر».
  rationale: يطبّق بطرس النبوة على يسوع في السياق، لكن نص الآية نفسه يقول «نبيًّا»، فينبغي عدم إدخال التحديد التفسيري في صلب الاقتباس.
- issue: دلالة ἀδελφῶν
  choice: إخوتكم
  alternative: بني قومكم أو مواطنيكم من بني إسرائيل
  rationale: يحافظ الاختيار على صورة القرابة في الأصل وعلى صيغته المذكرة، مع توضيح دلالته القومية العهدية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «سيُقيم» لصون الصلة اللفظية بالاقتباس، و«فله تسمعون» لإبراز معنى الإصغاء الملزم. أُثبتت علامتا الحاشيتين [a] و[b] في المتن.
