  rationale: 'تُصحَّح الصياغة العربية في الشطر الأخير لتكون طبيعية ودقيقة: «فاسمعوا له» تنقل القوة الإلزامية للمستقبل اليوناني في الاقتباس، و«في كل ما يقوله لكم» تعكس الكلام الموجَّه إليهم. كما استُبدلت «حقًّا» بـ«فإن» لتفادي إسناد التوكيد إلى صدق قول موسى بدل وظيفته الخطابية. لا يتغير معنى الآية أو مستوى تحديدها اللاهوتي.'
