  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: ar
  text: لكنكم قتلتم مُنشئ الحياة[a]، الذي أقامه الله من بين الأموات، ونحن شهود له[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «رئيس الحياة»، أو «قائد الحياة»، أو «مؤسس الحياة»، أو «رائد الحياة». تحمل الكلمة اليونانية ἀρχηγός معاني المنشأ والريادة والقيادة والتقدم.
    reason: lexical_alternative
  - marker: b
    text: أو «ونحن شهود على ذلك». يعود الضمير اليوناني نحويًا إلى المسيح المقام، وقد يُفهم في السياق أيضًا على أنه يشير إلى واقعة إقامته من بين الأموات.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: لكنكم
  rationale: تؤدي δέ هنا وظيفة انتقالية ذات مسحة تقابل، في سياق اتهام بطرس المتواصل؛ و«لكنكم» طبيعية وتبرز المفارقة دون مبالغة.
- source_word: ἀρχηγὸν
  choice: مُنشئ
  rationale: يمكن أن يدل ἀρχηγός على المنشأ أو المؤسس أو القائد أو المتقدم. واختيار «مُنشئ» ينسجم مع الإضافة «الحياة» ويُظهر المفارقة بين كونه مرتبطًا بمنشأ الحياة وبين قتله، مع إثبات البدائل الدلالية في الحاشية.
- source_word: τῆς ζωῆς
  choice: الحياة
  rationale: 'نُقلت الإضافة مباشرة في عبارة موجزة ذات قوة لقبية: «مُنشئ الحياة».'
- source_word: ἀπεκτείνατε
  choice: قتلتم
  rationale: صياغة مباشرة وطبيعية تنقل دلالة الفعل الماضي دون إضافة معنى قانوني مثل «اغتلتم» أو «قتلتم ظلمًا».
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: أقامه من بين الأموات
  rationale: صياغة عربية واضحة ومألوفة للغة القيامة، وتحافظ «من بين الأموات» على قوة ἐκ νεκρῶν.
- source_word: οὗ
  choice: على ذلك
  rationale: يُفهم الضمير على أنه يعود إلى واقعة إقامة يسوع، وهي أقرب نقطة في إعلان بطرس؛ وتوضح الحاشية إمكان عوده إلى الشخص نفسه.
- source_word: μάρτυρές ἐσμεν
  choice: نحن شهود
  rationale: حُفظ التركيب الاسمي والتوكيد بالضمير، بما يبرز صفة الرسل كشهود لا مجرد فعل الشهادة.
theological_decisions:
- issue: ترجمة ἀρχηγός بوصفه لقبًا مسيانيًا
  choice: مُنشئ الحياة
  alternative: رئيس الحياة، أو قائد الحياة، أو مؤسس الحياة، أو رائد الحياة
  rationale: اللفظة اليونانية تجمع طيفًا من معاني الابتداء والريادة والقيادة والتقدم. يوضح «مُنشئ الحياة» مفارقة قتل المرتبط بمنشأ الحياة، بينما تحفظ الحاشية سعة اللفظة ولا تحصرها في مدلول واحد دون تنبيه.
- issue: مرجع الضمير οὗ في جملة الشهادة
  choice: نحن شهود على ذلك
  alternative: ونحن شهود له
  rationale: يحتمل التركيب اليوناني أن تتعلق الشهادة بواقعة القيامة أو بالمسيح المقام نفسه. اختيرت واقعة القيامة لأنها المذكور الأقرب، مع إبقاء الاحتمال الآخر صريحًا في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، بجملة مترابطة تحافظ على تدفق الأصل. استُخدمت ألفاظ مباشرة مثل «قتلتم» و«أقامه»، مع حاشيتين تحفظان الاتساع المعجمي والالتباس النحوي الحقيقيين.
