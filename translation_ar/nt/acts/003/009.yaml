  text: ورآه الشعب كله يمشي ويسبّح الله،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف بسيط يحافظ على تتابع السرد من غير إضافة دلالة زمنية غير مصرّح بها.
- source_word: εἶδεν
  choice: رآه
  rationale: الفعل هنا يصف إدراك الشعب للرجل الذي شُفي، و«رآه» هو المقابل العربي الطبيعي المباشر.
- source_word: πᾶς ὁ λαὸς
  choice: الشعب كله
  rationale: يفيد التركيب معنى جماعيًا؛ و«الشعب» أدق من «الجمع» لأن λαός يشير إلى الناس بوصفهم جماعة، لا إلى حشد عابر فحسب.
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير المفعول يعود إلى الرجل الذي شُفي في السياق السابق.
- source_word: περιπατοῦντα
  choice: يمشي
  rationale: اسم الفاعل المضارع يصف فعلًا كان ظاهرًا للشعب، والمشي هو العنصر السياقي المهم الذي يبرز الشفاء.
- source_word: καὶ αἰνοῦντα
  choice: ويسبّح
  rationale: الفعل αἰνέω يدل على مدح الله والثناء عليه في سياق تعبدي؛ و«يسبّح» تعبير عربي طبيعي ومألوف في هذا السياق.
- source_word: τὸν θεόν
  choice: الله
  rationale: هو المفعول المحدد للتسبيح، وتأتي لفظة «الله» في العربية من غير أداة تعريف منفصلة.
