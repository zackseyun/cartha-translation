  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: ar
  text: أَمَّا أَنْتُمْ فَأَنْكَرْتُمُ الْقُدُّوسَ الْبَارَّ، وَطَلَبْتُمْ أَنْ يُوهَبَ لَكُمْ رَجُلٌ قَاتِلٌ،[a]
  philosophy: optimal-equivalence
