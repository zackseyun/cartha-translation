lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: أَمَّا أَنْتُمْ فَـ
  rationale: تنقل «δέ» معنى المقابلة، ويُبرز الضمير الصريح «ὑμεῖς» المخاطَبين؛ وصيغة «أمّا أنتم فـ» طبيعية في العربية وتحفظ هذا التشديد.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: الْقُدُّوسَ الْبَارَّ
  rationale: الصفتان مع أداة التعريف مستعملتان استعمال الاسم لقبًا ليسوع. ولا تحتاج العربية إلى إضافة كلمة مثل «الواحد» كي تؤدي هذا المعنى.
- source_word: ἠρνήσασθε
  choice: أَنْكَرْتُمُ
  rationale: ينقل معنى ἀρνέομαι في رفض الإقرار بيسوع والتنكر له، مع بقاء الصياغة مباشرة ومألوفة.
- source_word: ᾐτήσασθε
  choice: طَلَبْتُمْ
  rationale: ترجمة مباشرة لـ αἰτέω، وتنسجم طبيعيًا مع المصدر المؤول التالي في العربية.
- source_word: ἄνδρα φονέα
  choice: رَجُلٌ قَاتِلٌ
  rationale: تحفظ الاسمين الواردين في اليونانية، «رجل» و«قاتل»، وتبرز المقابلة مع «القدوس البار» من غير إطالة تفسيرية.
- source_word: χαρισθῆναι ὑμῖν
  choice: أَنْ يُوهَبَ لَكُمْ
  rationale: يحفظ معنى χαρίζομαι الأساسي، أي منح شخص على سبيل التفضل. أمّا معنى إطلاق السراح الذي يوضحه السياق القضائي فمذكور في الحاشية.
theological_decisions:
- issue: القوة المسيحانية للعبارة «القدوس البار»
  choice: 'صياغة الصفتين المعرّفتين كلقب ليسوع: «القدوس البار»'
  alternative: 'اعتبارهما وصفين عاديين فقط، أو صياغتهما لقبين منفصلين: «القدوس والبار»'
  rationale: التركيب اليوناني يجمع الصفتين تحت أداة تعريف واحدة في إحالة اسمية واحدة إلى يسوع. وتحفظ العربية ذلك طبيعيًا من غير إضافة مضمون عقائدي غير مصرّح به.
- issue: الدلالة القضائية للفعل χαρισθῆναι
  choice: «يُوهَبَ لكم» في المتن
  alternative: «يُطلَقَ لكم» أو «يُفرَجَ عنه لكم»
  rationale: الفعل اليوناني أوسع من إطلاق السراح، ويدل على المنح تفضّلًا، بينما يحدد السياق أن هذا المنح تمثّل في الإفراج عن باراباس؛ لذلك حُفظ اللفظ الأقرب في المتن والتوضيح السياقي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم التشكيل لتيسير القراءة، وحُفظت المقابلة البلاغية بين «القدوس البار» و«رجل قاتل».
