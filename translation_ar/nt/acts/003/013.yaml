  source_fidelity: الترجمة دقيقة في الصيغة العهدية، وفعل التمجيد، والتسليم والإنكار أمام بيلاطس. لكن «فتاه» في العربية الفصحى المعاصرة تُفهم في المقام الأول بمعنى «شابّه/غلامه»، ولا تنقل بوضوح معنى «الخادم» المرجح لـπαῖς في هذا السياق، كما أن الحاشية الحالية تجعل «عبده» بديلًا مع أنه الأنسب للنص. كذلك «مع أن» تفسّر علاقة الجملة الظرفية اليونانية تفسيرًا تقابليًا؛ والأحوط إبقاؤها زمنية مع إمكان ظهور المفارقة من السياق.
  naturalness: «عبده يسوع» تعبير عربي كتابي فصيح وطبيعي، أوضح من «فتاه يسوع» للقارئ الحديث. وترتيب «الذي أنتم أسلمتموه» يحافظ على توكيد ὑμεῖς μὲν دون تكلّف. و«في حين كان قد قرر إطلاق سراحه» صياغة سليمة تحفظ الطابع الظرفي للجملة.
  terminology: يُعتمد «عبده» لـπαῖς، مع حاشية تصون إمكان «فتاه/ابنه» على المستوى المعجمي من غير جعل المعنى الأقل رجحانًا هو المتن. وتبقى «مجّد»، و«أسلمتموه»، و«أنكرتموه»، و«إطلاق سراحه» ملائمة ودقيقة.
