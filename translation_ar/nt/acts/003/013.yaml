source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: ar
  text: إلهُ إبراهيمَ وإسحاقَ ويعقوبَ، إلهُ آبائنا، مجَّد عبده يسوع[a]، الذي أنتم أسلمتموه وأنكرتموه أمام بيلاطس، في حين كان قد قرر إطلاق سراحه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فتاه يسوع». يمكن للكلمة اليونانية παῖς أن تعني «عبدًا/خادمًا» أو «فتى/ابنًا» بحسب السياق؛ ويُرجَّح هنا معنى «العبد» بسبب الصدى المحتمل للحديث عن عبد الرب في إشعياء.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: إلهُ إبراهيمَ وإسحاقَ ويعقوبَ
  rationale: يحافظ على الصيغة العهدية الكتابية وتكرار حرف العطف في اليونانية، بصياغة عربية واضحة ومهيبة.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: إلهُ آبائنا
  rationale: ترجمة مباشرة تحفظ النبرة الأبوية والعهدية لعبارة πατέρων، بدل تعميمها إلى «أسلافنا».
- source_word: ἐδόξασεν
  choice: مجَّد
  rationale: ينقل الوزن اللاهوتي للفعل δοξάζω، والماضي العربي يعبّر طبيعيًا عن الحدث اليوناني دون فرض دلالة زمنية زائدة.
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: فتاه يسوع
  rationale: لفظ «فتى» العربي يمكن أن يدل على الخادم أو الفتى، فيحفظ قدرًا مهمًا من سعة παῖς، ويلائم صدى لغة عبد الرب في إشعياء دون إدخال لفظ البنوة صراحة.
- source_word: παρεδώκατε
  choice: أسلمتموه
  rationale: «أسلم» تعبير عربي كتابي طبيعي يفيد تسليمه إلى سلطة أخرى، من غير إضافة معنى الخيانة الذي لا يصرّح به الفعل هنا.
- source_word: ἠρνήσασθε
  choice: أنكرتموه
  rationale: ينقل المعنى المباشر لـἀρνέομαι ويحافظ على الصلة بلغة الإنكار في العهد الجديد.
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: أمام بيلاطس
  rationale: ترجمة عربية اصطلاحية واضحة لعبارة «في وجه/حضرة بيلاطس»، وتحفظ المشهد العلني المباشر.
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: مع أن بيلاطس كان قد قرر إطلاق سراحه
  rationale: 'يُظهر الضمير بذكر بيلاطس دفعًا للالتباس، وينقل الملابسة التي تحمل هنا قوة تقابلية طبيعية: أنكرتموه رغم قرار بيلاطس بإطلاقه.'
theological_decisions:
- issue: دلالة παῖς في وصف يسوع
  choice: فتاه
  alternative: عبده؛ ابنه/طفله
  rationale: يحفظ «فتاه» ازدواج الدلالة الممكن في اللفظة اليونانية بدرجة أفضل من حصرها في «عبد» أو «ابن»، مع بقاء صدى نصوص عبد الرب مرجحًا في السياق. وتوضح الحاشية المعنى المقصود الأرجح.
- issue: العلاقة المنطقية في κρίναντος ἐκείνου ἀπολύειν
  choice: مع أن بيلاطس كان قد قرر
  alternative: حين كان قد قرر
  rationale: التركيب اليوناني من حيث الصورة ظرفي، لكن السياق يبرز المفارقة بين إنكار المخاطبين وقرار بيلاطس بالإطلاق. «مع أن» تُظهر هذه القوة السياقية من غير تغيير هوية الفاعل أو الحدث.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة. استُعمل «فتاه» للمحافظة قدر الإمكان على غموض παῖς الحقيقي، مع حاشية تبيّن البديل الأرجح سياقيًا. وأُعيد اسم بيلاطس في الجملة الأخيرة لتجنب غموض الضمير في العربية.
