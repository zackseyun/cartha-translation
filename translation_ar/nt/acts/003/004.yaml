- source_word: εἰς ἡμᾶς
  choice: إِلَيْنَا
  rationale: يحافظ حرف الجر على اتجاه النظر نحوهما، وهو تعبير عربي فصيح وطبيعي مع «انظر».
- source_word: εἰς αὐτόν
  choice: إِلَيْهِ
  rationale: يبين أن الرجل هو المقصود بالنظر المركز، ويلائم الفعل «حدّق» في العربية.
