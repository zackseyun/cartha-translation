lexical_decisions:
- source_word: ὁ δὲ
  choice: فأخذ
  rationale: تربط الفاء الآية بما سبق ربطًا سرديًّا طبيعيًّا، ويعود الفاعل المستتر إلى الرجل الأعرج. وتساعد «أخذ» مع الفعل المضارع على إبراز الاستمرار الذي تدل عليه صيغة الماضي الناقص.
- source_word: ἐπεῖχεν
  choice: ينظر إليهما باهتمام
  rationale: يفيد الفعل هنا توجيه الانتباه نحو شخصين والاستمرار في ذلك. وهذه الصياغة عربية واضحة، ولا تحصر المعنى في مجرد إلقاء نظرة عابرة.
- source_word: αὐτοῖς
  choice: إليهما
  rationale: الضمير مثنى يعود إلى بطرس ويوحنا، وحرف الجر «إلى» يلائم فعل النظر في العربية.
- source_word: προσδοκῶν
  choice: متوقِّعًا
  rationale: ينقل اسم الفاعل معنى الترقب المصاحب لنظره إليهما.
- source_word: τι
  choice: شيئًا
  rationale: يحافظ على عدم تعيين ما كان الرجل يتوقعه، من غير أن يضيف النص صراحةً أنه مال أو صدقة.
- source_word: παρ’ αὐτῶν
  choice: منهما
  rationale: تفيد παρά مع المضاف إليه المصدر، والضمير المثنى يوضح أن المقصود بطرس ويوحنا.
- source_word: λαβεῖν
  choice: أن ينال
  rationale: «ينال» تعبير طبيعي عن تلقي شيء من آخرين، ويلائم سياق انتظار العطاء من غير إيحاء بالأخذ قسرًا.
