  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: ar
  text: إليكم أولًا، أقام الله[a] عبده[b] وأرسله ليبارككم، بأن يردّ كلَّ واحدٍ منكم عن شروره.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تعني «أقام» هنا أنه أقامه من الموت، وقد تعني أنه أظهره أو أقامه لمهمته بوصفه عبده؛ واللفظ اليوناني يحتمل الوجهين.
    reason: alternative_reading
  - marker: b
    text: أو «ولده»؛ فاللفظة اليونانية يمكن أن تعني «عبدًا» أو «ولدًا»، غير أن «عبده» تلائم على الأرجح خلفية عبد الرب في إشعياء.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: إليكم أولًا
  rationale: تحافظ العبارة على دلالة المخاطَبين وعلى أولوية توجيه البركة إلى جمهور بطرس اليهودي، وتنسجم طبيعيًا مع فعل الإرسال الآتي في الجملة.
- source_word: ἀναστήσας
  choice: أقام
  rationale: يمكن للفعل اليوناني أن يدل على الإقامة من الموت، أو على إقامة شخص وإظهاره لمهمة. واختيار «أقام» يبقي هذا الاحتمال الدلالي مفتوحًا دون حسم زائد.
- source_word: τὸν παῖδα αὐτοῦ
  choice: عبده
  rationale: لفظة παῖς قد تعني العبد أو الولد، لكن «عبده» تلائم على الأرجح خلفية عبد الرب في إشعياء، ولا تستبدل اللفظة اليونانية بتعبير بنوّي أكثر صراحة.
- source_word: ἀπέστειλεν αὐτὸν
  choice: وأرسله
  rationale: ترجمة مباشرة تحافظ على معنى الإرسال، والضمير يعود بوضوح إلى العبد المذكور.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: ليبارككم
  rationale: تصوغ اسم الفاعل اليوناني في العربية بوصفه غاية الإرسال أو نتيجته المقصودة، بأسلوب طبيعي واضح.
- source_word: ἐν τῷ ἀποστρέφειν ἕκαστον
  choice: بأن يردّ كلَّ واحدٍ منكم
  rationale: تنقل العبارة وسيلة حصول البركة، وتحافظ على القوة التوزيعية للفظة ἕκαστον.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: عن شروره
  rationale: يُفهم جمع πονηρίαι على أنه مظاهر الشر العملية. وجاء الضمير مفردًا موافقًا لعبارة «كل واحد منكم»، بما ينقل المعنى التوزيعي في عربية طبيعية.
theological_decisions:
- issue: دلالة ἀναστήσας في وصف عمل الله نحو يسوع
  choice: الإبقاء على «أقام» دون تحديد أن المقصود حصرًا هو القيامة من الموت أو الإقامة للمهمة
  alternative: «أقامه من الموت» أو «أظهره وعيّنه»
  rationale: يسمح السياق بسماع صدى القيامة، كما يسمح بصدى إقامة النبي أو العبد الموعود. لذلك تحافظ الصياغة على التوتر الدلالي واللاهوتي بدل أن تحسمه ضمنًا.
- issue: الدلالة المسيانية للفظة παῖς
  choice: عبده
  alternative: ولده أو ابنه
  rationale: «عبده» تحفظ على الأرجح خلفية عبد الرب في إشعياء، بينما «ابنه» تتجاوز الدلالة الصريحة للفظة في هذه الآية، و«ولده» قد تحجب خلفية العبد.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة، مع إبقاء ترتيب الأفكار قريبًا من اليونانية من غير جمود. وُضع الهامشان بعد «عبده» لأن الأول يشرح فعل «أقام» الملاصق لها، والثاني يشرح لفظة «عبده» نفسها.
