lexical_decisions:
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد من غير دلالة قوية على الاستدراك؛ والواو طبيعية في العربية هنا.
- source_word: ἀνέβαινον
  choice: كانا يصعدان
  rationale: يحفظ هذا التركيب صيغة الماضي الناقص ودلالتها على فعل كان جاريًا، كما يبقي معنى الصعود الوارد في الفعل اليوناني.
- source_word: εἰς τὸ ἱερὸν
  choice: إلى الهيكل
  rationale: يشير ἱερόν إلى نطاق الهيكل أو ساحاته عمومًا، و«الهيكل» هو التعبير العربي المألوف والواضح، من غير أن يوهم أنه يعني القدس الداخلي وحده.
- source_word: ἐπὶ τὴν ὥραν τῆς προσευχῆς
  choice: عند ساعة الصلاة
  rationale: ينقل العبارة الزمنية بوصفها وقت الصلاة المحدد، بصياغة عربية واضحة وقريبة من بنية الأصل.
- source_word: τὴν ἐνάτην
  choice: أي الساعة التاسعة
  rationale: يبقي نظام عدّ الساعات القديم كما في الأصل، ويجعل بدل الساعة واضحًا في العربية، مع شرح المقابل الحديث في الحاشية.
