  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: ar
  text: وكان بطرس ويوحنا يصعدان إلى الهيكل عند ساعة الصلاة، الساعة التاسعة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي نحو الساعة الثالثة بعد الظهر بحسب حساب الوقت الحديث.
