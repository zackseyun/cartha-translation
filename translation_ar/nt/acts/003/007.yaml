  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: ar
  text: وأمسكه من يده اليمنى وأنهضه، وفي الحال تقوّت قدماه وكاحلاه.[أ]
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'أو: عظما كاحليه.'
    reason: بديل معجمي محتمل لـ «كاحلاه» (σφυδρά)، مع وضع علامة الحاشية عند اللفظ المعني.
lexical_decisions:
- source_word: πιάσας
  choice: أمسكه
  rationale: ينقل معنى الإمساك الجسدي المقصود في اسم الفاعل الماضي، بصياغة عربية طبيعية لا توحي بعنف لا يقتضيه السياق.
- source_word: τῆς δεξιᾶς χειρός
  choice: بيده اليمنى
  rationale: تؤدي تركيب المضاف إليه بعد فعل الإمساك على نحو عربي مألوف. ويُفهم الضمير هنا عائدًا إلى الرجل الذي أمسكه بطرس، وفق بنية الحدث والسياق.
- source_word: ἤγειρεν αὐτόν
  choice: أنهضه
  rationale: يحفظ معنى الإقامة من موضعه ويأتي موجزًا وطبيعيًا في العربية، من غير إضافة معنى المساعدة أو الشفاء إلى الفعل نفسه.
- source_word: παραχρῆμα
  choice: في الحال
  rationale: يعبّر بوضوح عن فورية النتيجة المفاجئة، بسجل سردي عربي فصيح وطبيعي.
- source_word: ἐστερεώθησαν
  choice: اشتدت
  rationale: ينقل حصول القوة والثبات لأعضاء الرجل من غير تعيين الفاعل أو شرح آلية الشفاء.
- source_word: αἱ βάσεις αὐτοῦ
  choice: قدماه
  rationale: تشير الكلمة حرفيًا إلى القواعد أو الأجزاء التي يقوم عليها الجسد، والمقصود في هذا السياق القدمان؛ وهذه الصياغة أوضح وأطبع عربيًا.
- source_word: τὰ σφυδρά
  choice: كاحلاه
  rationale: يدل اللفظ على منطقتي الكاحلين أو مفصليهما، و«كاحلاه» ترجمة دقيقة وطبيعية من غير تضييق المعنى إلى عظام بعينها.
theological_decisions:
- issue: طبيعة وصف الشفاء
  choice: صياغة العبارة بوصفها تقريرًا مباشرًا لاشتداد القدمين والكاحلين فورًا.
  alternative: التصريح بأنهما «شُفيتا» أو إضافة أن الله قوّاهما.
  rationale: النص يصف النتيجة الجسدية الملموسة ولا يصرّح في هذه الجملة بآلية الشفاء أو فاعله؛ لذا تحافظ الترجمة على الوصف من غير إضافة تفسير لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع الحفاظ على تتابع الفعل والنتيجة وعلى صيغة لا تعيّن فاعل التقوية. لا حاجة إلى حاشية لأن «كاحلاه» تستوعب المعنى المعجمي من غير إيهام بتحديد تشريحي زائد.
