  rationale: استُبدلت «أسرع» بـ«هرع» لتقريب دلالة الجري والاندفاع الجماعي في الفعل اليوناني، وأعيد ترتيب ظرف المكان ووصف الدهشة لسلامة التعلّق النحوي وسلاسة العربية. أبقيت الإحالة إلى «الرجل» لأن مرجع الضمير محدد من السياق السابق، وأبقيت الحاشيتين وموقعي علامتيهما.
