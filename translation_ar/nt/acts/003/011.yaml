  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: ar
  text: وبينما كان الرجل متمسِّكًا ببطرس ويوحنا[a]، هرع الشعب كله إليهما عند الرواق المسمّى رواق سليمان[b]، وهم في غاية الدهشة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «متشبِّثًا ببطرس ويوحنا». يمكن أن يشدّد الفعل اليوناني على القبض بإحكام أو التشبث.'
    reason: lexical_alternative
  - marker: b
    text: الرواق ممرّ مسقوف تحفّ به الأعمدة في ساحات الهيكل، وكان هذا الرواق معروفًا تقليديًا باسم «رواق سليمان».
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: وبينما كان الرجل متمسِّكًا
  rationale: التركيب الإضافي المطلق مع اسم الفاعل المضارع يدل على فعل متزامن، و«متمسِّكًا» ينقل معنى القبض أو التشبث المستمر من غير أن يحمّله دافعًا عاطفيًا محددًا. ذُكر «الرجل» بدل الضمير وحده لوضوح المرجع في العربية عند استقلال الآية.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: ببطرس ويوحنا
  rationale: نقل الاسمين بصيغتيهما العربيتين الشائعتين، والباء تلائم الفعل «تمسّك».
- source_word: συνέδραμεν
  choice: أسرع ... إليهم
  rationale: الفعل اليوناني يفيد الجري أو التوافد السريع معًا. «أسرع الشعب كله إليهم» عربية طبيعية تحفظ عنصر الحركة العاجلة والاجتماع دون صياغة حرفية متكلفة.
- source_word: πᾶς ὁ λαὸς
  choice: الشعب كله
  rationale: يحافظ على عموم العبارة وعلى لفظ «الشعب»، من غير تضييقها إلى «الجمهور» أو «الحشد».
- source_word: ἐπὶ τῇ στοᾷ
  choice: عند الرواق
  rationale: στοά رواق مسقوف ذو أعمدة في نطاق الهيكل؛ و«عند» صياغة مكانية طبيعية مع حركة الناس نحو الموجودين هناك.
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: المسمّى رواق سليمان
  rationale: إعادة لفظ «رواق» تجعل اسم الموضع واضحًا وطبيعيًا بالعربية، بينما «سليمان» هو الاسم التقليدي للمكان.
- source_word: ἔκθαμβοι
  choice: وهم في غاية الدهشة
  rationale: ينقل شدة ἔκθαμβοι، ويجعل الوصف الحالي للشعب واضحًا مع الحفاظ على موقعه الدلالي في الجملة.
