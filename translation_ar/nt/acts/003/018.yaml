base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: ar
  text: 'لكنَّ الله أتمَّ هكذا ما سبق أن أعلنه بلسان جميع الأنبياء[a]: أنَّ مسيحه سيتألَّم[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «بفم جميع الأنبياء»؛ ويجوز المعنى: «بواسطة جميع الأنبياء».'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «مسيحه»؛ و«مسيح» تعني «الممسوح»، وهو لقب لمن عيَّنه الله.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: لكنَّ
  rationale: تفيد المقابلة بين فعل المخاطَبين في الآية السابقة وفعل الله، وتحافظ على قوة الاستدراك في عربية طبيعية.
- source_word: προκατήγγειλεν
  choice: سبق أن أعلنه
  rationale: تنقل معنى الإعلان السابق الكامن في الفعل من غير استعمال تعبير قديم أو إضافة معنى الحتمية.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: بلسان جميع الأنبياء
  rationale: يحافظ «بلسان» على الصورة الكتابية الحسية لعبارة «بفم»، لكنه أجلى وأفصح في العربية المعاصرة، مع إبقاء معنى «جميع».
- source_word: παθεῖν
  choice: سيتألَّم
  rationale: يعبّر عن مضمون الإعلان السابق بصياغة عربية طبيعية، من غير إدخال معنى «كان لا بد أن» الذي لا يصرّح به المصدر اليوناني وحده.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: مسيحه
  rationale: Χριστός لقب هنا، ولذلك تنقل «مسيحه» دلالة الممسوح المنتظر وتحفظ ضمير الملكية العائد إلى الله.
- source_word: ἐπλήρωσεν
  choice: أتمَّ
  rationale: يؤدي معنى إتمام ما سبق إعلانه، وهو واضح وطبيعي في سياق تحقق النبوة.
- source_word: οὕτως
  choice: هكذا
  rationale: تحفظ دلالة الكيفية وترتبط بالفعل «أتمَّ»، أي إن الله أتم الإعلان على هذا النحو.
theological_decisions:
- issue: ترجمة Χριστός
  choice: مسيحه
  alternative: مسيحَه / المسيح الذي له / مسيحه الممسوح
  rationale: اللفظ لقب في هذا السياق، و«مسيحه» يحفظ الخلفية المسيانية اليهودية والإضافة إلى الله من دون تحويل اللقب إلى اسم مجرد.
- issue: دلالة παθεῖν ضمن مضمون النبوة
  choice: أنَّ مسيحه سيتألَّم
  alternative: أن يتألَّم مسيحه / أنَّ مسيحه كان ينبغي أن يتألَّم
  rationale: الصياغة المختارة تنقل مضمون الإعلان النبوي ولا تزيد عليه دلالة صريحة على الضرورة، فتحفظ التوتر الموجود في النص.
- issue: تعلّق οὕτως
  choice: أتمَّ هكذا
  alternative: وهكذا أتمَّ / أتمَّ ... على هذا النحو
  rationale: يبقي «هكذا» مرتبطًا بكيفية الإتمام، مع عدم حسم الإشارة بأكثر مما يسمح به السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «بلسان» لصون الصورة الكتابية من غير غرابة «بفم»، و«مسيحه» لأن Χριστός لقب هنا. وُضعت علامتا الحاشية كلتاهما في المتن.
