  source_fidelity: النص يعبّر بأمانة عن العموم في πᾶσα ψυχὴ، والإشارة إلى «ذلك النبي»، وقوة فعل ἐξολεθρευθήσεται بلفظ «يُستأصل». لكن الصياغة الحالية لا تُظهر بوضوح الاستقبال الذي في الفعل اليوناني، كما أن الحاشية لا تحفظ البديل المعجمي المقصود في سجل المراجعة الإنجليزي («يُقطع»).
  naturalness: «يسمع لذلك النبي» مفهومة، لكنها أقل سلاسة في العربية الفصحى الحديثة من «يصغي إلى ذلك النبي». وإضافة السين إلى الفعل الرئيس تجعل الوعيد المستقبلي ظاهرًا من غير تكلّف.
  terminology: «الشعب» مناسب لـ λαός، و«يُستأصل» يحافظ على شدة فعل الإهلاك/الإزالة من دون حسم نوع الدينونة. ويُفضَّل أن تورد الحاشية بديل «يُقطع» بوصفه البديل الذي يعكس خلفية العبارة الكتابية.
