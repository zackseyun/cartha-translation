  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: ar
  text: وكلُّ شخصٍ لا يُصغي إلى ذلك النبي سيُستأصَل من بين الشعب.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُقطع من بين الشعب».'
    reason: بديل معجمي يعكس معنى الإزالة من الجماعة وخلفية العبارة الكتابية.
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: كلُّ شخصٍ
  rationale: التعبير اليوناني يعني حرفيًا «كل نفس»، لكنه اصطلاح يدل هنا على كل فرد؛ و«كل شخص» عربي واضح لا يحمّل النص تصورًا ثنائيًا عن الإنسان.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: لا يسمع لذلك
  rationale: 'التركيب يفيد العموم: أيّ شخص لا يسمع. والفعل ἀκούω في هذا السياق يتضمن السماع المصحوب بالاستجابة والطاعة؛ وصيغة «يسمع لذلك النبي» تحافظ على الصلة اللفظية بالسماع مع إيحاء الاستجابة.'
- source_word: τοῦ προφήτου ἐκείνου
  choice: لذلك النبي
  rationale: الإشارة تعود إلى النبي المذكور في الاقتباس السابق، من غير تحويل الوصف في الترجمة إلى لقب اصطلاحي.
- source_word: ἐξολεθρευθήσεται
  choice: يُستأصَل
  rationale: الفعل المبني للمجهول قوي ويدل على الإزالة التامة أو الإهلاك. «يُستأصل» يحفظ هذه القوة ويجمع دلالتي الإهلاك والإزالة، مع إثبات البديل التفسيري في الحاشية.
- source_word: ἐκ τοῦ λαοῦ
  choice: من بين الشعب
  rationale: يحافظ على معنى إخراج الشخص من داخل الشعب، ولا يضيف ضمير ملكية غير موجود في اليونانية.
theological_decisions:
- issue: طبيعة الدينونة المتوعَّد بها في إحالة بطرس إلى تثنية 18:19
  choice: صياغة الوعيد بالاستئصال من بين الشعب من غير تحديد زمن الدينونة أو صورتها
  alternative: يُقطع من جماعة العهد، أو يهلك هلاكًا نهائيًا
  rationale: النص يعلن دينونة شديدة على من لا يسمع للنبي، لكنه لا يحسم وحده هل المقصود عقوبة زمنية أو إقصاءً عهديًا أو دينونة أخروية؛ لذلك تحافظ الصياغة على الشدة والغموض الحقيقيين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يُستأصل» لقوته ودقته مع تجنب صياغة طائفية أو حسم طبيعة الدينونة بما يتجاوز النص.
