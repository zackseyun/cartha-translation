  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: ar
  text: وجميع الأنبياء، من صموئيل والذين جاءوا بعده[a]، كل الذين تكلّموا منهم، أعلنوا أيضًا هذه الأيام[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين تعاقبوا بعده» أو «الذين تبعوه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «نادوا بها»، أو، بتفسير أوسع في هذا السياق: «تنبأوا بها».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «هذه الأزمنة». تشير العبارة إلى فترة الإتمام الحاضرة في خطاب بطرس.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: وجميع الأنبياء
  rationale: تؤدي الواو وظيفة δέ الربطية الخفيفة من غير افتعال مقابلة، وتحافظ «جميع الأنبياء» على شمول العبارة اليونانية.
- source_word: ἀπὸ Σαμουὴλ
  choice: من صموئيل
  rationale: تحافظ «من» على صورة ἀπό وتدل في السياق على نقطة بدء تسلسل الأنبياء.
- source_word: τῶν καθεξῆς
  choice: الذين جاءوا بعده
  rationale: تعبير عربي واضح ينقل معنى التعاقب في καθεξῆς، مع عودة الضمير إلى صموئيل.
- source_word: ὅσοι ἐλάλησαν
  choice: كل من تكلّم منهم
  rationale: ينقل القوة الشمولية لـὅσοι والفعل البسيط ἐλάλησαν، ويبيّن طبيعيًا أن المقصود أفراد الأنبياء المذكورين.
- source_word: καὶ κατήγγειλαν
  choice: أعلنوا أيضًا
  rationale: «أعلنوا» ينقل المعنى العام لـκαταγγέλλω من غير إضافة معنى التنبؤ صراحة، و«أيضًا» تؤدي καί الرابطة.
- source_word: τὰς ἡμέρας ταύτας
  choice: بهذه الأيام
  rationale: صياغة مباشرة تحفظ الاستعارة الزمنية في اليونانية والإشارة إلى الفترة الحاضرة في خطاب بطرس.
theological_decisions:
- issue: إشارة الأنبياء إلى لحظة الإتمام الحاضرة في تاريخ الخلاص
  choice: بهذه الأيام
  alternative: بهذه الأزمنة
  rationale: تحافظ الترجمة على لفظ «الأيام» في الأصل، ولا تصرّح بأبعاد أخروية أو مسيانية أكثر مما تصرّح به العبارة نفسها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. روعي إبقاء تركيب الآية قريبًا من الأصل مع تلطيفه عربيًا، وعدم تحميل فعل الإعلان معنى التنبؤ الصريح إلا في الحاشية.
