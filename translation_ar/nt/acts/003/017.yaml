  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «والآن» للانتقال Καὶ νῦν، والنداء «أيها الإخوة»، وإقرار المتكلم «أعلم»، وفعل المخاطبين «تصرّفتم عن جهل»، ثم المقارنة الجامعة لرؤسائهم. ولا يضيف مفعولًا صريحًا غير موجود في هذه الآية، كما لا يحوّل الجهل إلى تبرئة.'
  naturalness: الصياغة فصيحة حديثة، واضحة، وملائمة لأسلوب الخطاب. «تصرّفتم عن جهل» تعبير طبيعي يحافظ على عمومية الفعل، و«كما فعل رؤساؤكم أيضًا» سليمة؛ فإفراد الفعل المتقدم على فاعل جمع عاقل («فعل رؤساؤكم») جائز في العربية الفصحى.
  terminology: «رؤساؤكم» مقابل مناسب لـ οἱ ἄρχοντες ὑμῶν في السياق، إذ يدل على ذوي القيادة والسلطة من غير حصر غير مبرر لنوع سلطتهم. و«أيها الإخوة» يحفظ اللفظ اليوناني، بينما تشرح الحاشية بإيجاز إمكان اتساع المخاطَبين.
