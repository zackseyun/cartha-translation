source:
  edition: SBLGNT
  text: Καὶ νῦν, ἀδελφοί, οἶδα ὅτι κατὰ ἄγνοιαν ἐπράξατε, ὥσπερ καὶ οἱ ἄρχοντες ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: ar
  text: والآن، أيها الإخوة[a]، أعلم أنكم تصرّفتم عن جهل، كما فعل رؤساؤكم أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ اللفظ اليوناني هو «الإخوة»، وقد يُستعمل لخطاب جماعة أوسع تضم الرجال والنساء على سبيل التمثيل.
    reason: بديل معجمي يوضح المدى المحتمل لصيغة الجمع المذكرة في سياق الخطاب.
lexical_decisions:
- source_word: Καὶ νῦν
  choice: والآن
  rationale: ينقل الواو الانتقالية والظرف الزمني بصياغة عربية طبيعية، ويحافظ على الصلة بما سبق وعلى الانتقال إلى النداء الآتي.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: مقابل مباشر لصيغة النداء اليونانية، مع استعمال عربي فصيح واضح. وقد يُستعمل اللفظ اليوناني تمثيليًا لجماعة تضم الرجال والنساء، لذلك ذُكر البديل في الحاشية دون توسيع النص صراحة.
- source_word: οἶδα
  choice: أعلم
  rationale: ينقل إقرار بطرس بالمعرفة نقلًا مباشرًا وموجزًا.
- source_word: κατὰ ἄγνοιαν
  choice: عن جهل
  rationale: تعبير عربي طبيعي يفيد أن الفعل صدر في حال الجهل أو بسببه، من غير أن يحوّل ذلك إلى تبرئة كاملة.
- source_word: ἐπράξατε
  choice: تصرّفتم
  rationale: يحافظ على عمومية الفعل اليوناني من غير إضافة مفعول غير مذكور في الآية، ويربطه طبيعيًا بعبارة «عن جهل».
- source_word: ὥσπερ καὶ
  choice: كما ... أيضًا
  rationale: 'يحفظ معنى المقارنة والإضافة: ما صدق على المخاطبين صدق كذلك على رؤسائهم.'
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: رؤساؤكم
  rationale: يدل على أصحاب السلطة والقيادة في السياق الأورشليمي، وهو موجز وطبيعي ويحفظ البعد القيادي والسياسي الديني للمصطلح.
theological_decisions:
- issue: هل يُصاغ ذكر الجهل بما يوحي بإسقاط الذنب؟
  choice: الإبقاء على «تصرّفتم عن جهل» من غير تبرئة أو تشديد زائد.
  alternative: «فعلتم ذلك من غير علم» أو صياغة توحي بأنهم غير مسؤولين.
  rationale: تقر الآية بعامل الجهل، لكن السياق اللاحق يدعو إلى التوبة؛ لذا تحافظ الصياغة على التوتر بين الجهل والمسؤولية ولا تحسمه في اتجاه البراءة الكاملة أو الإدانة المشددة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «والآن» للانتقال الطبيعي، و«أيها الإخوة» لصيغة النداء، و«عن جهل» لصون الإيجاز والتوتر الأخلاقي المعرفي في الأصل.
