  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: ar
  text: فتوبوا إذن وارجعوا، لكي تُمحى[a] خطاياكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: تُطمس.'
    reason: بديل معجمي للفعل ἐξαλείφω؛ يحفظ صورة المحو أو الطمس.
lexical_decisions:
- source_word: μετανοήσατε
  choice: فتوبوا
  rationale: فعل أمر يفيد استجابة حاسمة. «توبوا» تعبير عربي طبيعي يحفظ القوة الأخلاقية والدينية للفعل، من غير اختزاله في مجرد تغيير الرأي، ومن غير تكرار معنى الرجوع الوارد في الفعل التالي.
- source_word: οὖν
  choice: إذن
  rationale: تدل على النتيجة المستخلصة من الحجة السابقة، و«إذن» واضحة وطبيعية في العربية المعاصرة.
- source_word: ἐπιστρέψατε
  choice: ارجعوا
  rationale: يحفظ صيغة الأمر المبني للمعلوم ومعنى التحول أو الرجوع، من غير إضافة مفعول غير مذكور صراحة في اليونانية، ومن غير استعمال صيغة «اهتدوا» التي قد تحمل دلالات اصطلاحية أوسع.
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: لكي تُمحى
  rationale: تنقل تركيب الغرض أو النتيجة بصياغة عربية سلسة، مع إبقاء العلاقة بين التوبة والرجوع ومحو الخطايا كما يعرضها النص من غير تحديد آلية عقائدية تتجاوز العبارة.
- source_word: ἁμαρτίας
  choice: خطاياكم
  rationale: المقابل العربي المباشر الطبيعي للاسم في صيغة الجمع، مع الضمير الذي يطابق ὑμῶν.
theological_decisions:
- issue: العلاقة بين التوبة والرجوع ومحو الخطايا
  choice: لكي تُمحى خطاياكم
  alternative: لمحو خطاياكم
  rationale: تحفظ الصياغة دلالة الغرض أو النتيجة الممكنة في التركيب اليوناني، من غير تحويلها إلى تقرير سببي تفصيلي أو إدخال تصور مذهبي لنظام الخلاص لا يصرح به النص.
- issue: الجهة المقصودة بالرجوع
  choice: ارجعوا
  alternative: ارجعوا إلى الله
  rationale: السياق قد يفهم منه الرجوع إلى الله، لكن المفعول غير مذكور في هذه العبارة اليونانية؛ لذلك تُرك التعبير مطلقًا حفاظًا على صياغة المصدر.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعملت «فتوبوا» و«ارجعوا» بوصفهما أمريْن متمايزين، ووُضع هامش البديل المعجمي عند «تُمحى» لأنه الكلمة التي يخصها البديل.
