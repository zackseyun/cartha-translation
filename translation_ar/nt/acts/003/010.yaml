  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: ar
  text: 'وتعرّفوا إليه: إنه هو الرجل الذي كان يجلس طالبًا الصدقة[a] عند باب «الجميل» في الهيكل[b]، فامتلأوا دهشةً وذهولًا مما حدث له.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الجالس للصدقة». وتُظهر عبارة «كان يجلس» أن هذا كان شأنه المعتاد في ذلك الوقت.'
    reason: lexical_alternative
  - marker: b
    text: تشير الكلمة اليونانية هنا إلى مجمّع الهيكل عمومًا، لا إلى المبنى الداخلي المقدّس وحده.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: عرفوا
  rationale: يفيد الفعل هنا تمييز الرجل والتعرّف إلى هويته بوصفه الشخص المعروف لديهم من قبل؛ وصيغة الماضي العربية تلائم السرد من غير تكلّف في نقل الاستمرار الذي تدل عليه صيغة الناقص اليونانية.
- source_word: δὲ
  choice: الواو في «وعرفوا»
  rationale: أداة ربط خفيفة تتابع السرد، ولا تقتضي معنى الاستدراك في هذا الموضع.
- source_word: οὗτος ἦν
  choice: أنه هو الرجل
  rationale: يحفظ ضمير الفصل «هو» قوة الإشارة والتوكيد في تعيين الرجل الذي شُفي بأنه الشخص نفسه الذي كان الجمهور يعرفه.
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: الرجل الذي كان يجلس طلبًا للصدقة
  rationale: تنقل العبارة الوصفية الاسمية، وتُظهر «كان يجلس» أن ذلك كان شأنه المعتاد، فيما توضّح «طلبًا للصدقة» غرض جلوسه من غير إضافة تفاصيل غير مذكورة.
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: عند الباب الجميل
  rationale: «الجميل» هو اسم الباب أو لقبه، و«عند» تعبر طبيعيًا عن موضع جلوس الرجل بقربه.
- source_word: τοῦ ἱεροῦ
  choice: في الهيكل
  rationale: «الهيكل» هو المقابل العربي المألوف، مع بيان دلالة اللفظة اليونانية الأوسع في الحاشية كيلا تُفهم على أنها قدس المبنى الداخلي وحده.
- source_word: ἐπλήσθησαν θάμβους καὶ ἐκστάσεως
  choice: فامتلأوا دهشةً وذهولًا
  rationale: تحافظ الصياغة على صورة الامتلاء وعلى وجود لفظين متقاربين؛ «الدهشة» تعبّر عن العجب الشديد و«الذهول» عن الحالة التي تخرج المرء عن طوره، من غير إيحاء بخبرة صوفية.
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: مما حدث له
  rationale: تبيّن العبارة سبب دهشتهم، وتحفظ كون الحدث قد وقع للرجل وبقي أثره ظاهرًا أمامهم.
