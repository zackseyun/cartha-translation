source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: ar
  text: 'أنتم أبناء الأنبياء وأبناء العهد الذي قطعه الله مع آبائكم، إذ قال لإبراهيم: «وبنسلك[a] تتبارك جميع عشائر الأرض».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذريتك». يمكن للفظ اليوناني أن يدل على نسل إبراهيم جماعةً، وقد يُفهَم أيضًا على أنه يشير إلى ممثّلٍ واحد.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: أبناء
  rationale: يحافظ على صورة البنوة المذكرة في اليونانية وعلى دلالتها العهدية، أي أهل الميراث والمشاركون في المواعيد، من غير أن يحصرها في النسب البيولوجي.
- source_word: τῶν προφητῶν
  choice: الأنبياء
  rationale: الإضافة المباشرة «أبناء الأنبياء» تنقل الوقوف في امتداد ميراثهم ومواعيدهم، لا البنوة الجسدية الحرفية.
- source_word: διαθήκης
  choice: العهد
  rationale: هو المصطلح العربي الكتابي الطبيعي في سياق عهد الله مع إبراهيم والآباء.
- source_word: διέθετο ὁ θεὸς
  choice: قطعه الله
  rationale: «قطع العهد» تعبير عربي راسخ وطبيعي لمعنى إنشاء العهد، ويقابل الصيغة اليونانية في هذا السياق.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: مع آبائكم
  rationale: ينقل علاقة إبرام العهد بوضوح، مع أن πρός في أصلها قد تُترجم «إلى».
- source_word: λέγων πρὸς Ἀβραάμ
  choice: إذ قال لإبراهيم
  rationale: صياغة عربية سلسة تنقل اسم الفاعل اليوناني بوصفه مقدمة لقول العهد.
- source_word: σπέρματί
  choice: نسلك
  rationale: «النسل» يحفظ قابلية اللفظ للدلالة الجماعية، مع إمكان حمله على ممثل مفرد، من غير حسم التوتر الدلالي.
- source_word: ἐνευλογηθήσονται
  choice: تتبارك
  rationale: ينقل صيغة الوعد ويوافق الأسلوب العربي المألوف لوعد إبراهيم، مع إبقاء احتمال فهمها «تنال البركة».
- source_word: πατριαὶ
  choice: عشائر
  rationale: πατριά تدل على الجماعات العائلية أو العشائر؛ و«عشائر» أدق من «عائلات» في هذا السياق الواسع.
- source_word: γῆς
  choice: الأرض
  rationale: السياق العالمي لوعد إبراهيم يرجح «الأرض» لا «البلاد».
theological_decisions:
- issue: لغة البنوة المذكرة في υἱοὶ
  choice: أبناء
  alternative: أولاد / ذرية
  rationale: أُبقيت صورة البنوة لأنها تحمل معنى الوراثة العهدية في النص، ولا يلزم منها قصر الخطاب على الذكور أو النسب الجسدي.
- issue: مدلول σπέρμα في الوعد الإبراهيمي
  choice: نسلك
  alternative: ذريتك / بذرك
  rationale: «نسل» لفظ جمعي يمكن أن يحمل أيضًا معنى ممثل مفرد بحسب السياق الكتابي، ولذلك لا يفرض قراءة جماعية محضة ولا قراءة فردية محضة.
- issue: قوة المبني للمجهول في ἐνευλογηθήσονται
  choice: تتبارك
  alternative: تُبارَك / تنال البركة
  rationale: تحفظ صيغة الاقتباس الكتابية وإمكان الدلالة على نوال البركة، دون زيادة فاعل غير مصرّح به.
translation_notes:
  register: فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «قطع العهد» لتعبير عربي طبيعي راسخ، و«عشائر الأرض» لنقل اتساع πατριαί. لا توجد حاشية عند «أبناء» لأن العربية تحتمل هنا الاستعمال العهدي التمثيلي بصورة طبيعية، بينما وُضعت الحاشية عند «نسل» لحفظ الغموض الجمعي/المفرد المهم.
