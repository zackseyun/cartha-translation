review_pass:
  verdict: revise
  source_fidelity: المعنى الأساسي محفوظ، بما في ذلك كون الأرواح النجسة هي التي تصرخ وتخرج. لكن «مِنْ كَثِيرِينَ مِمَّنْ بِهِمْ» تركيب ناقص وغير سليم؛ إذ يلزم التصريح بالفعل الرابط («كانت بهم») أو إعادة بناء العبارة. كما أن إعادة الصياغة المقترحة تُبقي «كثيرين» متعلقين بالأشخاص الذين كانت الأرواح فيهم، كما في اليونانية.
  naturalness: الأسلوب فصيح في الجملة، لكن «ممن بهم» غير طبيعي نحويًا ويعوق الفهم. والصياغة المنقحة واضحة وحديثة، وتزيل أي التباس في مرجع الصراخ والخروج.
  terminology: «أرواح نجسة»، «تصرخ بصوت عالٍ»، «المشلولين»، و«العرج» مقابلات مناسبة ومحايدة في العربية الفصحى الحديثة. ويحفظ «شُفي» المبني للمجهول دون تعيين الفاعل.
