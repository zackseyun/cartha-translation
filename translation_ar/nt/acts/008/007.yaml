    issue: التركيب «مِمَّنْ بِهِمْ» ناقص نحويًا.
    rationale: «بهم» لا تؤدي وحدها معنى «كانت الأرواح فيهم»؛ ولذلك لا تكتمل صلة الموصول ولا يتضح مرجع الضمير على وجه سليم.
  - severity: low
    issue: ترتيب العبارة الأولى يجعل كمية «كثيرين» أقل التصاقًا بالمتأثرين مما في الأصل.
    rationale: الأصل يصف كثيرين من الأشخاص الذين كانت بهم الأرواح؛ وإعادة ترتيب يسيرة تبيّن ذلك مع إبقاء الأرواح فاعل الخروج والصراخ.
