  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: ar
  text: لِأَنَّ كَثِيرِينَ مِمَّنْ كَانَتْ بِهِمْ أَرْوَاحٌ نَجِسَةٌ، كَانَتِ الأَرْوَاحُ تَخْرُجُ مِنْهُمْ وَهِيَ تَصْرُخُ بِصَوْتٍ عَالٍ؛ وَشُفِيَ كَثِيرُونَ مِنَ الْمَشْلُولِينَ وَالْعُرْجِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: لِأَنَّ أَرْوَاحًا نَجِسَةً كَانَتْ تَخْرُجُ مِنْ كَثِيرِينَ مِمَّنْ بِهِمْ
  rationale: تُحفظ صلة γάρ التفسيرية بـ«لأن»، وتُعاد صياغة التركيب اليوناني المقتضب بما يوضح في العربية أن الأرواح تخرج من كثيرين ممن كانت بهم.
- source_word: πνεύματα ἀκάθαρτα
  choice: أَرْوَاحًا نَجِسَةً
  rationale: «أرواح نجسة» تعبير عربي كتابي واضح ودقيق في سياق إخراج الأرواح.
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: وَهِيَ تَصْرُخُ بِصَوْتٍ عَالٍ
  rationale: تُسند العبارة صراحة إلى الأرواح وفق مطابقة اسم الفاعل اليوناني المحايد الجمع لـ«الأرواح»، وتحفظ معنى الصراخ وعلو الصوت.
- source_word: ἐξήρχοντο
  choice: كَانَتْ تَخْرُجُ
  rationale: ينقل التركيب دلالة الماضي الناقص على الحدث المتكرر أو الجاري، مع تأنيث الفعل المفرد الملائم لجمع غير العاقل في العربية.
- source_word: πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ
  choice: وَشُفِيَ كَثِيرُونَ مِنَ الْمَشْلُولِينَ وَالْعُرْجِ
  rationale: تؤدي الواو وظيفة δέ الانتقالية، ويعبّر «المشلولون والعرج» بوضوح عن الفئتين المذكورتين.
- source_word: ἐθεραπεύθησαν
  choice: شُفِيَ
  rationale: يحفظ المبني للمجهول ولا يصرح بفاعل لم تذكره الجملة.
theological_decisions:
- issue: مرجع الصراخ والخروج
  choice: الأرواح النجسة هي التي تصرخ وتخرج من المصابين.
  alternative: المصابون هم الذين يصرخون في أثناء خروج الأرواح.
  rationale: اسم الفاعل βοῶντα محايد جمع، ويطابق πνεύματα ἀκάθαρτα مطابقة طبيعية؛ لذلك جُعل الضمير في «وهي تصرخ» عائدًا إلى الأرواح.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم التشكيل الجزئي الكامل في النص لضبط القراءة، مع إعادة ترتيب محدودة اقتضتها سلامة العربية ووضوح مرجع الأفعال.
