  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: ar
  text: 'فقال الروح لفيلبس: «اقترب من هذه المركبة ولازمها».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تقدَّم والتصق بهذه المركبة».'
    reason: بديل معجمي أكثر حرفية؛ إذ قد يدل الفعل اليوناني على الانضمام الوثيق أو البقاء قريبًا من المركبة.
lexical_decisions:
- source_word: εἶπεν
  choice: فقال
  rationale: صيغة الماضي السردي من λέγω تُنقل طبيعيًّا بـ«قال»، واقترانها بالفاء يلائم تتابع الحدث في العربية.
- source_word: δὲ
  choice: فـ
  rationale: الأداة هنا تفيد الانتقال والتتابع السردي أكثر من التضاد، والفاء تؤدي هذا المعنى بإيجاز وطبيعية.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: يحافظ هذا على لفظ اليونانية من غير إضافة «القدس»، مع أن السياق في أعمال الرسل يشير إلى الروح القدس.
- source_word: τῷ Φιλίππῳ
  choice: لفيلبُّس
  rationale: اللام تؤدي وظيفة المفعول غير المباشر، والاسم منقول بصيغة عربية واضحة.
- source_word: Πρόσελθε
  choice: تقدَّم
  rationale: الأمر يدعو فيلبس إلى التحرك نحو المركبة؛ و«تقدَّم» طبيعي وواضح ولا يحدد منظورًا مكانيًّا غير مصرّح به.
- source_word: κολλήθητι
  choice: التصق
  rationale: يحفظ قوة الفعل الدال على الانضمام الوثيق أو الملازمة، بدل تخفيفه إلى مجرد الاقتراب.
- source_word: τῷ ἅρματι τούτῳ
  choice: بهذه المركبة
  rationale: «المركبة» أوسع وأوضح للقارئ المعاصر من «العربة الحربية»، ولا يقتضي السياق أنها مركبة قتال؛ و«هذه» تقابل اسم الإشارة القريب.
theological_decisions:
- issue: مرجع τὸ πνεῦμα
  choice: إبقاء العبارة «الروح»
  alternative: «الروح القدس» أو «روح» بمعنى إلهام روحي غير محدد
  rationale: سياق أعمال الرسل يرجّح بقوة أن المقصود هو الروح القدس بوصفه الفاعل الإلهي المتكلم، لكن النص اليوناني لا يذكر صفة «القدس»، لذلك تُحفظ عبارته وتوترها الدلالي من غير توسعة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «المركبة» تجنبًا لإيحاء «العربة» بأنها حربية بالضرورة، وحُفظ الإيجاز والأمر المباشر في الأصل.
