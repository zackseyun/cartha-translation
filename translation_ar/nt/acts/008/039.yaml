  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: ar
  text: ولمّا صعدا من الماء، اختطف روح الرب فيلبّس[a]، فلم يعد الخصي يراه، إذ مضى في طريقه فرحًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أخذ روح الرب فيلبّس فجأة». يدل الفعل اليوناني على الإزالة المفاجئة والقوية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: صعدا من الماء
  rationale: صيغة المثنى تُظهر أن فيلبّس والخصي كليهما صعدا، وتحفظ الحركة إلى أعلى من الماء من غير استنتاج كيفية المعمودية.
- source_word: πνεῦμα κυρίου
  choice: روح الرب
  rationale: هذا هو المقابل العربي الطبيعي للتعبير اليوناني، ويشير في سياق لوقا وأعمال الرسل إلى روح الله بوصفه فاعل الحدث.
- source_word: ἥρπασεν
  choice: اختطف
  rationale: ينقل دلالة الفعل على الأخذ المفاجئ والقوي، ويحفظ الطابع العجيب للتدخل الإلهي من غير شرح زائد.
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: فلم يعد الخصي يراه
  rationale: صياغة عربية واضحة تفيد أنه لم يره بعد تلك اللحظة.
- source_word: ὁ εὐνοῦχος
  choice: الخصي
  rationale: ترجمة مباشرة للاسم الصريح في اليونانية، وتحافظ على استمرارية تعريف الشخصية في السياق.
- source_word: ἐπορεύετο ... χαίρων
  choice: ومضى ... فرحًا
  rationale: «مضى» تعبّر عن استمرار الرحلة، و«فرحًا» تنقل الحال المصاحبة التي يدل عليها اسم الفاعل اليوناني.
- source_word: τὴν ὁδὸν αὐτοῦ
  choice: في طريقه
  rationale: تعبير عربي طبيعي يشمل الطريق والرحلة معًا من غير تضييق المعنى على الطريق المادي وحده.
theological_decisions:
- issue: هل πνεῦμα κυρίου يشير إلى روح الرب بفاعلية شخصية أم إلى قوة إلهية غير شخصية؟
  choice: روح الرب بوصفه فاعلًا شخصيًا
  alternative: روح أو قوة صادرة من الرب على نحو غير شخصي
  rationale: استعمال لوقا وأعمال الرسل للتعبير والسياق النحوي، حيث الروح هو فاعل «اختطف»، يؤيدان الفاعلية الشخصية من غير إضافة لفظ «القدس» غير الموجود هنا.
- issue: مدى إبراز المفاجأة والقوة في ἥρπασεν
  choice: اختطف
  alternative: حمل بعيدًا أو نقله
  rationale: «اختطف» يحفظ بوضوح عنصر الإزالة المفاجئة والقوية الكامن في الفعل، بينما لا يحدد النص آلية ما حدث أو وجهة فيلبّس.
translation_notes:
  register: فصحى حديثة واضحة وذات نبرة كتابية وقورة. استُخدم المثنى «صعدا» لدقة الإحالة، وحُفظت عبارة «روح الرب» بلا إضافة تفسيرية، ووُضع البديل الأقل حدّة للفعل في الحاشية.
