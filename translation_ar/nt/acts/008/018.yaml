  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: ar
  text: ولكن لما رأى سمعان أن الروح يُعطى بوضع أيدي الرسل[a]، قدَّم لهم مالًا،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الروح القدس». يقول النص اليوناني ببساطة «الروح»، لكن المقصود في السياق هو الروح القدس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: لما رأى
  rationale: اسم فاعل ماضٍ من ὁράω يؤدي هنا معنى زمنيًا؛ و«لما رأى» عربية طبيعية تحفظ تعاقب الحدثين.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد انتقالًا سرديًا مع شيء من المقابلة بين ما سبق ورد فعل سمعان.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν
  choice: بوضع أيدي
  rationale: διά مع المضاف إليه تدل على الوسيلة؛ والباء صياغة عربية موجزة وطبيعية، و«وضع الأيدي» ينقل العبارة اليونانية بوضوح.
- source_word: τῶν ἀποστόλων
  choice: الرسل
  rationale: الإضافة العربية في «أيدي الرسل» تحفظ العلاقة الإضافية في اليونانية.
- source_word: δίδοται
  choice: يُعطى
  rationale: يحفظ زمن المضارع وصيغة المبني للمجهول في النص اليوناني؛ ويصف ما أدركه سمعان بوصفه واقعًا جاريًا أو نمطًا مشاهدًا.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: يحفظ اللفظ اليوناني الأقصر من دون إضافة «القدس» إلى المتن، مع بيان المرجع السياقي في الحاشية.
- source_word: προσήνεγκεν
  choice: قدَّم
  rationale: ينقل معنى الإحضار أو التقديم بقصد العرض، وهو ملائم لتقديم المال في هذا السياق.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ينقل المفعول غير المباشر بصياغة عربية طبيعية.
- source_word: χρήματα
  choice: مالًا
  rationale: يدل اللفظ على المال، واختيار المفرد الجنسي «مالًا» فصيح وطبيعي في العربية.
theological_decisions:
- issue: مرجع τὸ πνεῦμα
  choice: الروح، والمقصود بحسب السياق الروح القدس
  alternative: الروح القدس
  rationale: النص اليوناني يقول حرفيًا «الروح»، بينما يبيّن السياق السابق أن المقصود هو الروح القدس؛ فحُفظ اللفظ في المتن ووُضح المرجع في الحاشية.
- issue: الوسيلة والفاعل في إعطاء الروح
  choice: الروح يُعطى بوضع أيدي الرسل
  alternative: الروح القدس يُمنح على أيدي الرسل
  rationale: تحفظ الصياغة المبني للمجهول ودلالة الوسيلة، من غير جعل الرسل المصدر النهائي للروح أو حسم دلالة لاهوتية تتجاوز الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «لما» للتتابع الزمني، وحُفظ المضارع المبني للمجهول في «يُعطى» التزامًا ببنية المصدر، مع إبقاء الغموض المقصود بشأن الفاعل النهائي.
