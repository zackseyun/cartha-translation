  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: ar
  text: أما استفانوس فدفنه رجالٌ أتقياء، وأقاموا عليه مناحةً عظيمةً[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «جهّزوا استفانوس للدفن» أو «حملوا استفانوس لدفنه»؛ فقد يركّز الفعل اليوناني على جمع الجثمان وحمله والعناية به، كما قد يشمل دفنه.
    reason: lexical_alternative
  - marker: b
    text: قد تشمل «مناحة عظيمة» مظاهر حزن مسموعة وعلنية، لا مجرد الحزن الباطني.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: حمله لدفنه
  rationale: الفعل في هذا السياق يدل على تولّي جثمان استفانوس بعد موته، وقد يشمل جمعه أو نقله أو تجهيزه وصولًا إلى دفنه. وصياغة «حمله لدفنه» تحفظ جانب النقل ولا تختزل الدلالة في النتيجة وحدها.
- source_word: δέ
  choice: أما
  rationale: تفيد انتقالًا سرديًا مع مقابلة خفيفة لما سبق، و«أما» طبيعية في العربية عند تحويل بؤرة السرد إلى استفانوس.
- source_word: ἄνδρες εὐλαβεῖς
  choice: رجال أتقياء
  rationale: تحفظ «رجال» التحديد المذكر في النص، وتؤدي «أتقياء» معنى الورع والتدين بصورة واضحة ومألوفة.
- source_word: ἐποίησαν
  choice: أقاموا
  rationale: الفعل اليوناني خفيف الدلالة ضمن تعبير اصطلاحي مع «مناحة»، و«أقاموا مناحة» تعبير عربي طبيعي يدل على إظهار الحزن علنًا.
- source_word: κοπετὸν μέγαν
  choice: مناحة عظيمة
  rationale: «مناحة» تنقل الحزن المعبَّر عنه ظاهرًا، وقد يشمل الندب والبكاء، و«عظيمة» تحفظ شدة μέγαν.
- source_word: ἐπ’ αὐτῷ
  choice: عليه
  rationale: مع لغة النوح، تؤدي «عليه» معنى الحزن والندب من أجل الشخص الميت بإيجاز طبيعي.
theological_decisions: []
