translation:
  language: ar
  text: 'فقال: «فكيف أستطيع، إن لم يُرشدني أحد؟» ثم ألحّ على فيلبس أن يصعد ويجلس معه.[a]'
  philosophy: optimal-equivalence
  footnotes:
