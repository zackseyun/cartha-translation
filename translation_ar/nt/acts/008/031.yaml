    text: 'أو: «دعا فيلبس إلى أن يصعد ويجلس معه». قد يدل الفعل اليوناني على طلب جاد أو دعوة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: وكيف أستطيع
  rationale: تنقل صيغة الاحتمال مع ἄν معنى عدم القدرة في غياب الشرط المذكور، بصياغة عربية طبيعية واضحة.
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: إن لم يُرشدني أحد
  rationale: «يُرشدني» تحفظ معنى القيادة والتوجيه، وتلائم سياق الوصول إلى فهم النص من غير أن تختزله في «يشرحه لي».
- source_word: παρεκάλεσέν
  choice: طلب إلى ... بإلحاح
  rationale: تعكس مدى الفعل الذي يفيد الطلب الجاد أو الحث، من غير مبالغة «توسّل» ولا إضعافه إلى مجرد «سأل».
- source_word: τε
  choice: ثم
  rationale: تؤدي الربط والتتابع السردي بصورة عربية طبيعية.
- source_word: ἀναβάντα
  choice: أن يصعد
  rationale: تحفظ الصورة المكانية للصعود إلى المركبة، بدل التصريح بما هو مفهوم من السياق بعبارة «يركب».
- source_word: καθίσαι σὺν αὐτῷ
  choice: ويجلس معه
  rationale: ترجمة مباشرة وطبيعية للبناء الدال على الجلوس مع شخص.
- source_word: Φίλιππον
  choice: فيلبس
  rationale: الصيغة العربية الكتابية الشائعة للاسم اليوناني Φίλιππος.
