    rationale: προσδραμών يدل على الركض/الاندفاع سريعًا نحو الشخص؛ «فركض» يحفظ حيوية الفعل على نحو أدق.
  - severity: medium
    issue: بديل الحاشية «أفهمتَ إذًا» يغيّر الزمن ويضيف دلالة غير لازمة.
    rationale: γινώσκεις مضارع، وἎρά γε تضيف توكيدًا إلى السؤال ولا تقتضي معنى «إذًا».
