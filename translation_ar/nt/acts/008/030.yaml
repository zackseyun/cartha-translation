  source_fidelity: يحتاج «فأسرع» إلى تقوية لأنه يخفف دلالة προσδραμών، التي تفيد الركض أو الإسراع الشديد. كما أن «يقرأ إشعياء النبي» قد تُفهم في العربية المعاصرة على نحو غير سلس؛ وإضافة «من سفر» توضّح المفعول المقصود من غير تغيير المعنى السياقي، إذ إن المقروء هو نص إشعياء.
  naturalness: النص بعد التعديل فصيح وطبيعي وموجز. «فركض فيلبس إليه» أنسب للمشهد، و«يقرأ من سفر إشعياء النبي» أوضح في الاستعمال العربي الحديث.
  terminology: «إشعياء النبي» و«يفهم» مناسبان. يُفضَّل رسم الاسم الشائع «فيلبس» بلا شدة. الحاشية الحالية غير دقيقة لأن «إذًا» ليست معنى لازمًا للأداتين Ἆρά γε، كما أن «أفهمتَ» يحوّل الفعل إلى ماضٍ تام، خلاف المضارع اليوناني.
