    text: 'أو: «أحقًّا تفهم ما تقرأ؟» فالأداتان اليونانيتان تضيفان توكيدًا إلى سؤال فيلبس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: فأسرع ... إليه
  rationale: اسم الفاعل الظرفي من προστρέχω يدل على حركة سريعة نحو الرجل ومركبته؛ وهذه الصياغة تحفظ حيوية المشهد من غير إضافة المركبة إلى النص صراحة.
- source_word: δὲ
  choice: فـ
  rationale: تفيد هنا تقدّم السرد واتصال الفعل بما سبقه، والفاء طبيعية وموجزة في العربية.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: وسمعه يقرأ
  rationale: تنقل تركيب السماع مع اسم الفاعل في المضاف إليه، أي سماعه للرجل في أثناء القراءة، من غير التصريح بأنه كان يقرأ بصوت عالٍ لأن ذلك غير مذكور صراحة.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: إشعياء النبي
  rationale: تحافظ على ترتيب اليونانية، والمقصود مفهوم في العربية على أنه يقرأ من كلام إشعياء أو سفره.
- source_word: εἶπεν
  choice: فقال
  rationale: المقابل المباشر للفعل، وتبيّن صيغة الاستفهام اللاحقة أن القول سؤال.
- source_word: Ἆρά γε
  choice: حقًّا
  rationale: تنقل توكيد أداتي الاستفهام وما في السؤال من نبرة فاحصة، مع الإبقاء على إمكان فهمهما بدرجات مختلفة من التوكيد.
- source_word: γινώσκεις
  choice: تفهم
  rationale: السياق يتعلق بإدراك معنى المقروء لا بمجرد معرفته.
- source_word: ἃ ἀναγινώσκεις
  choice: ما تقرأ
  rationale: صياغة عربية طبيعية تنقل مضمون القراءة واستمرارها في السياق.
