  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: ar
  text: فأمر أن تتوقف العربة، فنزل كلاهما إلى الماء[a]، فيلبس والخصي، وعمَّده.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى داخل الماء»؛ غير أن حرف الجر اليوناني يدل عادةً على الحركة إلى داخل الماء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: أمر
  rationale: ينقل معنى إصدار الأمر بوضوح وإيجاز، ويحافظ على قوة الفعل من غير تكلف.
- source_word: στῆναι τὸ ἅρμα
  choice: أن تتوقف المركبة
  rationale: صياغة عربية طبيعية لتوقيف مركبة، بدل الترجمة الحرفية «أن تقف».
- source_word: ἅρμα
  choice: المركبة
  rationale: لفظ عربي واضح يشمل وسيلة النقل المقصودة في السياق، من غير فرض صورة حربية قد يوحي بها لفظ «عربة حربية».
- source_word: κατέβησαν ἀμφότεροι
  choice: فنزل كلاهما
  rationale: يحافظ على معنى النزول وعلى التشديد الصريح في اليونانية على اشتراك الشخصين معًا.
- source_word: εἰς τὸ ὕδωρ
  choice: إلى داخل الماء
  rationale: يجسد بصورة طبيعية القوة الاتجاهية المعتادة لحرف الجر εἰς، أي الحركة إلى داخل الماء، مع إثبات البديل الأقل تحديدًا في الحاشية.
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: فيلبس والخصي
  rationale: يحدد الشخصين اللذين يشملهما «كلاهما»، ويحافظ على اللقب الصريح εὐνοῦχος وعلى استمرارية السرد.
- source_word: ἐβάπτισεν αὐτόν
  choice: عمَّده
  rationale: يستعمل المصطلح العربي المستقر للفعل βαπτίζω، ويُبقي الضمير عائدًا إلى الخصي من غير أن يضيف تحديدًا لطريقة المعمودية.
theological_decisions:
- issue: هل ينبغي أن تحسم الصياغة طريقة إجراء المعمودية؟
  choice: الإبقاء على الحركة «إلى داخل الماء» مع استعمال الفعل المحايد المستقر «عمَّده».
  alternative: ترجمة βαπτίζω بما يفيد التغطيس صراحة، أو تخفيف εἰς إلى مجرد الوصول «إلى الماء».
  rationale: النص يذكر أن كليهما نزلا إلى داخل الماء وأن فيلبس عمّد الخصي، لكنه لا يشرح في هذه الآية وحدها كيفية إجراء فعل المعمودية؛ لذلك تُحفظ دلالة الألفاظ من غير استيراد حسم طائفي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «المركبة» و«تتوقف» لصياغة طبيعية، و«الخصي» للمحافظة على اللفظ السردي الصريح، مع وضع علامة الحاشية عند العبارة التي تشرحها.
