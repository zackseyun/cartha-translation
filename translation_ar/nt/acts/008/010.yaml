base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: ar
  text: 'وكانوا جميعًا يصغون إليه، من الصغير إلى الكبير، قائلين: «هذا الرجل هو قوّة الله التي تُدعى العظيمة».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذا هو ما يُدعى «قوّة الله العظيمة»». ويمكن أن تُفهم العبارة اليونانية بصياغة أكثر اختصارًا، كأنها لقب.'
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: كانوا يصغون إليه
  rationale: يفيد الفعل توجيه الانتباه باهتمام إلى سمعان. و«يصغون إليه» تعبير عربي طبيعي لا يبالغ في الدلالة إلى حد الولاء له.
- source_word: πάντες
  choice: جميعًا
  rationale: يحفظ شمول الجماعة المذكورة، مع إظهار الفاعل بواو الجماعة في الفعل.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: من الصغير إلى الكبير
  rationale: يحفظ التعبير الجامع لطرفي النطاق كما في اليونانية، ويدل سياقيًا على الناس من مختلف المراتب.
- source_word: λέγοντες
  choice: قائلين
  rationale: ينقل اسم الفاعل المتزامن مع الفعل الرئيس بصياغة عربية موجزة وفصيحة.
- source_word: Οὗτός
  choice: هذا
  rationale: يحفظ قوة اسم الإشارة الموجَّه إلى سمعان، والسياق يوضح أن المشار إليه رجل من غير حاجة إلى إضافة تفسيرية.
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: قوّة الله
  rationale: ينقل الإضافة اليونانية بوضوح، ويحفظ صيغة الادعاء الذي أطلقه الناس على سمعان.
- source_word: ἡ καλουμένη Μεγάλη
  choice: التي تُدعى العظيمة
  rationale: يحفظ معنى التسمية في المبني للمجهول، ويجعل «العظيمة» لقبًا للقوة مع مطابقة جنس «قوّة» في العربية.
- source_word: Μεγάλη
  choice: العظيمة
  rationale: الصفة مؤنثة في اليونانية لموافقة «القوة»، وكذلك تأتي مؤنثة في العربية. والتعريف يلائم عملها كلقب وصفي مرتبط بـ«قوّة الله».
theological_decisions:
- issue: هل قول الجمع لقب إلهي رسمي أم وصف يطلقونه على سمعان؟
  choice: 'إيراد العبارة داخل اقتباس بوصفها قول الناس: «هذا هو قوّة الله التي تُدعى العظيمة».'
  alternative: «هذا هو ما يُسمّى قوّة الله العظيمة».
  rationale: النص يروي اعتقاد الناس ولا يقرّه بصوت الراوي. والصياغة المختارة تحفظ البنية التعريفية والتوتر في نسبة «قوّة الله» إلى سمعان من غير تصحيح لاهوتي ضمني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «يصغون» للتعبير عن الانتباه المركز، وحُفظت العبارة المنقولة بصيغة لا توحي بأن الراوي يصدّق ادعاء الجمع.
