  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: ar
  text: وآمن سمعان هو أيضًا، وبعد أن اعتمد، ظلَّ ملازمًا لفيلبُّس. وكان يندهش إذ يرى آياتٍ وأعمالَ قدرةٍ عظيمةً تحدث[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «معجزات عظيمة». يمكن أن تدل الكلمة اليونانية على المعجزات، كما يمكن أن تشير إلى أعمال تُظهر القدرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: نفسه أيضًا
  rationale: يحفظ هذا التعبير توكيد αὐτός ومعنى الإضافة في καί، فيبرز أن سمعان أيضًا آمن.
- source_word: ἐπίστευσεν
  choice: آمن
  rationale: ترجمة مباشرة للفعل من غير إضافة حكم على طبيعة إيمان سمعان أو صدقه.
- source_word: βαπτισθεὶς
  choice: بعد أن اعتمد
  rationale: توضح الصياغة أن المعمودية سبقت ملازمته المستمرة لفيلبُّس، وفق دلالة اسم الفاعل الماضي.
- source_word: ἦν προσκαρτερῶν
  choice: ظلَّ ملازمًا
  rationale: ينقل التركيب المحيطي في الماضي معنى الاستمرار، كما يعبّر عن بقاء سمعان قريبًا من فيلبُّس ومواظبًا على صحبته.
- source_word: θεωρῶν
  choice: حين يرى
  rationale: ينقل الإدراك المتواصل المصاحب للدهشة، ويربط دهشته بما كان يشاهده.
- source_word: σημεῖα
  choice: آيات
  rationale: مصطلح عربي كتابي واضح يحفظ دلالة العلامة ذات المغزى، لا مجرد الحدث العجيب.
- source_word: δυνάμεις μεγάλας
  choice: أعمال قدرة عظيمة
  rationale: يحفظ الصلة اللفظية بالقدرة ولا يحصر العبارة سلفًا في مصطلح «المعجزات»، مع بيان البديل الشائع في الحاشية.
- source_word: γινομένας
  choice: ما يحدث من
  rationale: صياغة عربية طبيعية تنقل كون الآيات وأعمال القدرة وقائع جارية كان سمعان يشاهدها.
- source_word: ἐξίστατο
  choice: كان يندهش
  rationale: ينقل زمن الماضي المستمر وشدة التأثر من غير مبالغة تعبيرية.
theological_decisions:
- issue: هل يدل إيمان سمعان هنا بالضرورة على اهتداء حقيقي؟
  choice: آمن
  alternative: تظاهر بالإيمان / آمن إيمانًا حقيقيًا
  rationale: النص يقرر أنه آمن واعتمد، لكن سياق الرواية اللاحق يثير توترًا تفسيريًا. لذلك تُترك طبيعة إيمانه بلا حسم يتجاوز اللفظ اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت جملتان لتفادي تراكم الروابط في العربية، مع الحفاظ على تسلسل الأفعال واستمرار الملازمة والدهشة. وُضع اسم فيلبُّس بالضبط لمنع التباسه باسم «فيليب» الحديث.
