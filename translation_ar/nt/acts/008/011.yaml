  yaml_path: translation/nt/acts/008/011.yaml
  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: ar
  text: وكانوا يصغون إليه، لأنه كان قد أدهشهم بأعماله السحرية مدةً طويلة.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مدةً معتبرة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بسحره».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: كانوا يصغون إليه
  rationale: الفعل في صيغة الماضي الناقص ويدل هنا على استمرار توجيه الانتباه إلى شخص والإصغاء إليه؛ وهذه صياغة عربية طبيعية تحفظ المعنى الاستمراري.
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: لأنه ظلّ وقتًا طويلًا
  rationale: تفيد διά مع المصدر المعرّف السببية، وتدل عبارة ἱκανῷ χρόνῳ على مدة ممتدة أو معتبرة. وإدخال «ظلّ» يربط المدة بالفعل ربطًا عربيًا طبيعيًا.
- source_word: ταῖς μαγείαις
  choice: بأعماله السحرية
  rationale: تشير μαγεία إلى ممارسات السحر. و«أعماله السحرية» واضحة ومعاصرة، مع إضافة ضمير الملكية الذي يقتضيه السياق.
- source_word: ἐξεστακέναι
  choice: يدهشهم
  rationale: المصدر التام من ἐξίστημι يدل على إحداث الدهشة؛ وتجنبت الترجمة «يسحرهم» لأنها قد تفهم على أنها تحسم كيفية تأثير ممارساته لا مجرد ما أحدثته من انبهار.
- source_word: αὐτούς
  choice: هم
  rationale: ضمير المفعول به يعود إلى الناس المذكورين في السياق.
theological_decisions:
- issue: طبيعة ممارسات سمعان في μαγείαις
  choice: أعماله السحرية
  alternative: شعوذته
  rationale: يصف النص ممارسات سحرية وأثرها في الناس، لكنه لا يحسم في هذه الآية وحدها أكانت خداعًا أم نشاطًا غيبيًا أم مزيجًا منهما؛ لذلك تحفظ الصياغة هذا القدر من الإبهام.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «كانوا يصغون» لإبراز الاستمرار في الماضي، و«أعماله السحرية» لتجنب لفظ قديم أو تفسير ميتافيزيقي زائد.
