id: ACT.8.22
reference: Acts 8:22
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: ar
  text: فتُبْ إذن عن شرّك هذا، وابتهل إلى الرب، لعلَّ قصد قلبك يُغفَر لك.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لعلَّ فكرة قلبك تُغفَر لك».'
    reason: بديل معجمي لـ ἐπίνοια، التي قد تعني القصد أو الفكرة.
lexical_decisions:
- source_word: μετανόησον
  choice: فتُبْ
  rationale: صيغة أمر تدعو إلى توبة حاسمة؛ و«تُبْ» تؤدي القوة الأخلاقية والروحية بوضوح وإيجاز.
- source_word: οὖν
  choice: إذن
  rationale: تفيد النتيجة المترتبة على توبيخ بطرس السابق، وموضعها بعد الفعل طبيعي في العربية.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: عن شرّك هذا
  rationale: «الشر» ينقل معنى κακία الأخلاقي، وحرف «عن» يلائم التوبة في العربية ويحافظ على دلالة الابتعاد، والضمير يصون التشديد على نسبة الشر إلى المخاطَب.
- source_word: δεήθητι
  choice: ابتهل
  rationale: الفعل يدل على طلب ملحّ؛ و«ابتهل» أخص من مجرد «صلِّ» في نقل معنى التضرع الجاد، مع بقائه واضحًا وفصيحًا.
- source_word: τοῦ κυρίου
  choice: إلى الرب
  rationale: «الرب» المقابل الكتابي الطبيعي لـ κύριος، من غير حسم زائد لهوية المرجع في هذا السياق.
- source_word: εἰ ἄρα
  choice: لعلَّ
  rationale: تنقل الرجاء المقترن بعدم الجزم في العبارة اليونانية، من غير ضمان المغفرة ولا الإيحاء باستحالتها.
- source_word: ἀφεθήσεταί σοι
  choice: يُغفَر لك
  rationale: يحافظ المبني للمجهول على كون المغفرة ممنوحة، بينما تعبّر «لعل» عن جهة الاحتمال التي تحملها الجملة الشرطية اليونانية.
- source_word: ἡ ἐπίνοια
  choice: قصد
  rationale: «قصد» ينقل البعد الإرادي والأخلاقي للفكر الباطن هنا، مع بقاء «فكرة» احتمالًا معجميًا صحيحًا.
- source_word: τῆς καρδίας σου
  choice: قلبك
  rationale: الإضافة في «قصد قلبك» تقابل تركيب المضاف إليه وتحافظ على التصوير الكتابي للقلب بوصفه موطن القصد الباطن.
theological_decisions:
- issue: درجة اليقين بإمكان المغفرة
  choice: الإبقاء على الصياغة الرجائية غير الجازمة باستعمال «لعلَّ».
  alternative: صياغة تعد بالمغفرة يقينًا عند التوبة، أو صياغة توحي بأن المغفرة بعيدة أو مستحيلة.
  rationale: εἰ ἄρα مع المستقبل المبني للمجهول صياغة متحفظة عمدًا؛ لذلك لا ينبغي للترجمة أن تحوّلها إلى ضمان أو يأس.
- issue: مرجع «الرب»
  choice: إبقاء «الرب» بلا تعيين تفسيري إضافي.
  alternative: التصريح بأنه الرب يسوع أو الله الآب.
  rationale: النص نفسه لا يعيّن المرجع هنا بما يوجب إدخاله في الترجمة، فحُفظ الغموض السياقي المشروع.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. اختير «ابتهل» لإظهار شدة الطلب، و«لعلَّ» لصون التوتر بين رجاء المغفرة وعدم ضمانها. وُضعت علامة الحاشية بعد الجملة التي تتناول البديل المعجمي.
