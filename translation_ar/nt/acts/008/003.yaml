source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: ar
  text: أمّا شاول فكان يعيث في الكنيسة فسادًا[a]؛ يدخل بيتًا بعد بيت[b]، ويجرّ رجالًا ونساءً ويسلّمهم إلى السجن.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان يخرّب الكنيسة». يدل الفعل اليوناني على الإضرار العنيف أو التنكيل المدمّر.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من بيت إلى بيت». يحتمل التعبير اليوناني الصيغتين، و«بيتًا بعد بيت» تبرز معنى التكرار والتوزيع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: كان يعيث في الكنيسة فسادًا
  rationale: ينقل قوة الفعل الدال على الإضرار العنيف والتخريب، ويحافظ تركيب «كان» مع المضارع على دلالة الاستمرار والتكرار في صيغة الماضي الناقص.
- source_word: τὴν ἐκκλησίαν
  choice: الكنيسة
  rationale: يشير اللفظ هنا إلى جماعة المؤمنين، و«الكنيسة» هو المقابل العربي الراسخ والمناسب للسياق.
- source_word: κατὰ τοὺς οἴκους
  choice: بيتًا بعد بيت
  rationale: يبرز المعنى التوزيعي لحرف الجر مع الجمع، أي تكرار اقتحام بيوت متعددة.
- source_word: εἰσπορευόμενος
  choice: يدخل
  rationale: يعرض الفعل المصاحب الذي كان شاول يمارس به تخريبه، بصياغة عربية موجزة وطبيعية.
- source_word: σύρων
  choice: يجرّ
  rationale: يحافظ على صورة السحب بالقوة دون تلطيفها أو إضافة تفاصيل غير مصرّح بها.
- source_word: ἄνδρας καὶ γυναῖκας
  choice: رجالًا ونساءً
  rationale: ينقل شمول أفعال شاول لكلا الفريقين بوضوح طبيعي في العربية.
- source_word: παρεδίδου
  choice: يسلّمهم
  rationale: يفيد تسليم المقبوض عليهم إلى الحبس الرسمي، وتناسق المضارع بعد «كان» المقدرة سياقيًا يحفظ الطابع المتكرر للفعل.
- source_word: εἰς φυλακήν
  choice: إلى السجن
  rationale: تعبير عربي مباشر عن إيداعهم الحبس أو الاحتجاز.
theological_decisions:
- issue: درجة شدة وصف أفعال شاول قبل إيمانه
  choice: كان يعيث في الكنيسة فسادًا
  alternative: كان يضطهد الكنيسة
  rationale: الصياغة المختارة تحفظ قوة الفعل اليوناني، الذي يتجاوز مجرد المضايقة ويصور إضرارًا عنيفًا ومنهجيًا، من غير إدخال تفسير لاهوتي لاحق على النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «يعيث... فسادًا» للحفاظ على شدة الفعل من غير غموض، وربطت الأفعال بالمضارع لتصوير العمل المستمر والمتكرر.
