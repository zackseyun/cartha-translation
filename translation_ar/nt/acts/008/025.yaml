base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: ar
  text: فبعد أن أدلوا بشهادةٍ مؤكَّدة وتكلَّموا بكلمة الرب[a]، كانوا عائدين إلى أورشليم، وكانوا يبشِّرون في قرى كثيرة للسامريين[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رسالة الرب».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «في قرى سامرية كثيرة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: شهدوا شهادةً مؤكَّدة
  rationale: ينقل ثقل الفعل بوصفه شهادة جادّة ومؤكَّدة، من غير حصر معناه في التحذير.
- source_word: λαλήσαντες
  choice: تكلَّموا
  rationale: ترجمة مباشرة للفعل، ويبيّن المفعول به «كلمة الرب» مضمون الكلام دون زيادة تفسيرية.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: كلمة الرب
  rationale: تحافظ على التعبير اليوناني المألوف ورنينه اللاهوتي، مع إثبات البديل الدلالي «رسالة الرب» في الحاشية.
- source_word: ὑπέστρεφον
  choice: كانوا عائدين
  rationale: صيغة الاستمرار تنقل الجانب غير التام للفعل اليوناني، وتعرض الرجوع بوصفه فعلًا جاريًا.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الاسم العربي الكتابي المألوف للمدينة.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: في قرى كثيرة للسامريين
  rationale: يحافظ على الإضافة العرقية الصريحة في اليونانية، مع عربية واضحة وطبيعية، من غير الجزم هل المقصود الملكية أو السكن.
- source_word: εὐηγγελίζοντο
  choice: كانوا يبشِّرون
  rationale: ينقل معنى إعلان البشارة، كما تحافظ «كانوا» على دلالة الفعل المستمر الموازي لرجوعهم.
theological_decisions:
- issue: هوية الفاعل المضمر
  choice: الإبقاء على الفاعل بصيغة الجمع من غير ذكر أسماء
  alternative: التصريح بأنهما بطرس ويوحنا
  rationale: يفهم من السياق السابق أن المقصود بطرس ويوحنا، لكن اليونانية هنا لا تذكر الاسمين بل تستعمل فاعلًا جمعيًا مضمرًا؛ لذلك لا تُضاف أسماء إلى نص الآية.
- issue: دلالة «كلمة الرب»
  choice: كلمة الرب
  alternative: رسالة الرب
  rationale: «كلمة» أقرب إلى اللفظ اليوناني وتحفظ اتساعه اللاهوتي، في حين توضّح الحاشية إمكان فهمها بمعنى الرسالة المعلنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغتا «كانوا عائدين» و«كانوا يبشِّرون» لإبراز تزامن الفعلين واستمرارهما، مع تجنّب إدخال اسمي بطرس ويوحنا في متن لا يذكرهما صراحة.
