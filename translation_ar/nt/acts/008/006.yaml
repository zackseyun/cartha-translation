base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: ar
  text: وكانت الجموع مجتمعةً[b] تُصغي باهتمام[a] إلى ما كان فيلبس يقوله، إذ كانوا يستمعون ويرون الآيات التي كان يجريها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تنتبه» أو «تعير اهتمامًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بإجماع» أو «بقلبٍ واحد» أو «متّفقين»؛ فاللفظ اليوناني يشدّد على وحدة استجابتهم واشتراكهم فيها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: تُصغي باهتمام
  rationale: يدل الفعل هنا على توجيه الانتباه والإصغاء المتواصل. وتحفظ صيغة المضارع بعد «كانت» الجانب الاستمراري للماضي الناقص اليوناني.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد من غير أن تفرض معنى استدراكيًا قويًا.
- source_word: οἱ ὄχλοι
  choice: الجموع
  rationale: تحفظ دلالة الجماعات المحتشدة وصيغة الجمع في الأصل.
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: إلى ما كان فيلبس يقوله
  rationale: ينقل مضمون الكلام وفاعله بصياغة عربية طبيعية، مع إبراز استمراره في المشهد.
- source_word: ὁμοθυμαδὸν
  choice: بإجماعٍ
  rationale: يفيد استجابة موحّدة واتفاقًا مشتركًا، لا مجرد وجودهم معًا في المكان.
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: حين كانوا يسمعون ويرون
  rationale: التركيب ذو دلالة زمنية/ظرفية. وعومل αὐτούς بوصفه فاعل المصدرين، أي الجموع، لا مفعولًا بمعنى «إياه».
- source_word: τὰ σημεῖα
  choice: الآيات
  rationale: «الآيات» المقابل العربي المألوف لـ σημεῖα، ويحفظ معنى العلامات الدالة من غير إضافة وصف تفسيري مثل «المعجزية».
- source_word: ἃ ἐποίει
  choice: التي كان يجريها
  rationale: «يجري الآيات» تعبير عربي واضح للأعمال الخارقة المقصودة في السياق، و«كان يجريها» يحفظ الجانب الاستمراري للماضي الناقص.
