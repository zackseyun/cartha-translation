base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: ar
  text: 'وكلَّم ملاكٌ للرب فيلبُّس قائلًا: «قُم واذهب نحو الجنوب[a] إلى الطريق المنحدرة من أورشليم إلى غزة». وهذه الطريق مقفرة[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وقت الظهر». يمكن للعبارة اليونانية أن تدل على الاتجاه، أي الجنوب، أو على الوقت، أي منتصف النهار.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «هذه صحراء». وربما كان المعنى أن الطريق تمر بمنطقة صحراوية، لا أن الطريق نفسها خالية من الناس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: وكلَّم ملاكٌ من الرب
  rationale: نُقلت δὲ بواو استئنافية طبيعية في السرد، وجاء «ملاك» نكرة لأن الاسم اليوناني مفرد بلا أداة تعريف. وتحافظ عبارة «من الرب» على دلالة الإرسال أو الانتساب من غير أن تحدد هوية الملاك بأكثر مما يقوله النص.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: كلَّم ... فيلبُّس قائلًا
  rationale: «كلَّم» تعبير عربي طبيعي عن مخاطبة شخص، و«قائلًا» يحافظ على الصلة الحالية التي يمهد بها النص للكلام المباشر.
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: قُم واذهب
  rationale: أمران مباشران واضحان يحفظان قوة صيغتي الأمر اليونانيتين من غير تكلّف.
- source_word: κατὰ μεσημβρίαν
  choice: نحو الجنوب[a]
  rationale: مع فعل الحركة، يُرجَّح المعنى الاتجاهي «نحو الجنوب»، مع إبقاء احتمال المعنى الزمني «وقت الظهر» في الحاشية.
- source_word: ἐπὶ τὴν ὁδὸν
  choice: إلى الطريق
  rationale: صياغة عربية مألوفة للحركة نحو طريق معين.
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: المنحدرة من أورشليم إلى غزة
  rationale: «المنحدرة» تنقل الوصف الجغرافي للنزول من أورشليم بإيجاز ووضوح.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: وهذه طريق مقفرة[b]
  rationale: يُفهم اسم الإشارة المؤنث على أنه عائد إلى «الطريق». و«مقفرة» تحتمل خلو الطريق ووحشتها، مع إثبات احتمال أن تكون العبارة وصفًا لمنطقة صحراوية في الحاشية.
theological_decisions:
- issue: المقصود بعبارة «ملاك من الرب»
  choice: الإبقاء على العبارة بوصفها دالة على رسول سماوي مرتبط بالرب أو مرسل منه، دون مزيد من التحديد
  alternative: «ملاك أرسله الله»، أو فهمه بوصفه شخصية إعلانية مخصوصة هي «ملاك الرب»
  rationale: النص يبيّن مصدر سلطة الملاك أو انتسابه إلى الرب، لكنه لا يقتضي في هذا الموضع هوية لاهوتية أكثر تحديدًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية وقورة. استُعملت «فيلبُّس» وفق الضبط العربي الشائع للاسم، و«أورشليم» و«غزة» بصيغتيهما الكتابيتين المألوفتين. وُضعت علامتا الحاشيتين عند العبارتين اللتين تتعلقان بهما مباشرة، حفاظًا على وضوح موضع البديلين.
