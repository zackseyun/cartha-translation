  register: العربية فصحى حديثة واضحة وكريمة. استُخدمت «الخصي» محافظةً على التحديد النصي، وصيغ السؤال بـ«أعن... أم عن...» لإبراز المقابلة الطبيعية من غير تفسير هوية الشخص الآخر.
