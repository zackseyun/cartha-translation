  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: ar
  text: 'فأجاب الخصيُّ فيلبسَ وقال: «أسألك[a]، عمَّن يقول النبي هذا؟ أعن نفسه أم عن شخص آخر؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أرجوك». فالعبارة اليونانية تفيد طلبًا باحترام، وقد تحمل إلحاحًا أقوى.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: فأجاب
  rationale: تؤدي الفاء وظيفة الانتقال السردي الذي تؤديه δέ هنا، و«أجاب» تنقل الوظيفة الاصطلاحية لاسم الفاعل اليوناني مع فعل القول من غير تكرار ثقيل.
- source_word: ὁ εὐνοῦχος
  choice: الخصي
  rationale: يحافظ اللفظ على الدلالة المحددة للكلمة اليونانية وعلى وصف لوقا للشخص، بدل تعميمها إلى «المسؤول».
- source_word: τῷ Φιλίππῳ
  choice: فيلبس
  rationale: جاء الاسم مفعولًا به مع «أجاب» وفق الأسلوب العربي الطبيعي، من غير حاجة إلى حرف جر.
- source_word: εἶπεν
  choice: قائلًا
  rationale: ينقل فعل القول المصاحب ويهيئ للاقتباس المباشر، مع تجنب الصياغة العربية الثقيلة «أجاب... وقال».
- source_word: Δέομαί σου
  choice: أسألك
  rationale: تعبر عن طلب محترم مباشر، مع إبقاء احتمال النبرة الأشد في الحاشية.
- source_word: περὶ τίνος
  choice: عمَّن
  rationale: تنقل περί مع المضاف إليه بوصفها سؤالًا عن الشخص المقصود، بصياغة عربية موجزة وطبيعية.
- source_word: ὁ προφήτης
  choice: النبي
  rationale: يحافظ على التعريف في اليونانية وعلى صيغة سؤال الخصي عن صاحب النبوة.
- source_word: λέγει τοῦτο
  choice: يقول النبي هذا
  rationale: تشير «هذا» إلى النص المقتبس الذي كان يقرأه، وتحافظ على ترتيب قريب من المصدر وواضح بالعربية.
- source_word: περὶ ἑαυτοῦ
  choice: عن نفسه
  rationale: يعود الضمير الانعكاسي بوضوح إلى النبي.
- source_word: περὶ ἑτέρου τινός
  choice: عن شخص آخر
  rationale: تنقل معنى شخص آخر غير النبي، وتحافظ على المقابلة مع «نفسه».
