  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: ar
  text: ففتح فيلبس فاه، وانطلق من هذا النص من الكتاب المقدس، وبشَّره بيسوع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بشَّره بيسوع»، أي أعلن له البشارة عن يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: فتح ... فاه
  rationale: يحافظ على الصورة الاصطلاحية اليونانية الدالة على الشروع في الكلام، وهي مفهومة في العربية الفصحى وتحفظ نبرة السرد الوقورة.
- source_word: δὲ
  choice: فـ
  rationale: الفاء تلائم تتابع أحداث الرواية بالعربية، من غير تحميل الأداة اليونانية معنى زمنيًا زائدًا.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: ابتدأ من هذا النص من الكتاب
  rationale: تُظهر «من» نقطة انطلاق شرح فيلبس، وتحافظ «الكتاب» على دلالة γραφή بوصفها الكتاب المقدس، بينما يوضح «النص» أن المقصود هو الموضع المقروء.
- source_word: εὐηγγελίσατο
  choice: بشَّره
  rationale: فعل عربي موجز وطبيعي ينقل معنى إعلان البشارة، ولا يوحي بالضرورة بخطبة مؤسسية كما قد يفعل «وعظ».
- source_word: αὐτῷ
  choice: ـه
  rationale: ضمير المفعول في «بشَّره» ينقل الإحالة اليونانية إلى الرجل المذكور في السياق من غير إضافة اسم غير وارد في الآية.
- source_word: τὸν Ἰησοῦν
  choice: بيسوع
  rationale: مع فعل التبشير، تدل الباء في العربية بوضوح على أن يسوع هو مضمون البشارة ومحورها، مع إبقاء الصياغة موجزة وقريبة من التركيب اليوناني.
theological_decisions:
- issue: دلالة εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν
  choice: بشَّره بيسوع
  alternative: أعلن له البشارة عن يسوع
  rationale: يجعل النص يسوع مضمون البشارة ومحورها كما في التركيب اليوناني، من غير اختزال العبارة إلى شعار أو إضافة مضمون عقائدي غير مصرَّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التعبير التصويري «فتح فاه»، واستُعمل «هذا النص من الكتاب» لتوضيح أن الحديث عن الموضع المقروء من الكتاب المقدس دون استعمال التقسيم المتأخر «آية».
