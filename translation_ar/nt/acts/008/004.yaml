  yaml_path: translation/nt/acts/008/004.yaml
  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: ar
  text: فالذين تشتّتوا جالوا مبشِّرين بالكلمة[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الرسالة عن يسوع.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «راحوا من مكان إلى مكان مبشِّرين بالرسالة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: فالذين
  rationale: الفاء تنقل أثر οὖν الاستنتاجي والانتقالي، و«الذين» تستأنف الحديث عن المؤمنين المذكورين في السياق، من غير تحميل μέν مقابلة صريحة لا تظهر بعده في هذه الجملة.
- source_word: διασπαρέντες
  choice: تشتّتوا
  rationale: ينقل الفعل المبني للمجهول من حيث المعنى حالة تفريق المؤمنين بسبب الاضطهاد، وهو تعبير عربي طبيعي ومباشر في هذا السياق.
- source_word: διῆλθον
  choice: جالوا
  rationale: يفيد التنقّل والمرور في مواضع متعددة، و«جالوا» أوجز وأدق من إضافة «في المنطقة»، وهي عبارة غير موجودة صراحة في اليونانية.
- source_word: εὐαγγελιζόμενοι
  choice: مبشِّرين
  rationale: يحفظ معنى إعلان الخبر السار في صيغة حال تصف ما كانوا يفعلونه أثناء تجوالهم، بلغة عربية مألوفة وغير مثقلة بالمصطلحات.
- source_word: τὸν λόγον
  choice: بالكلمة
  rationale: يحفظ لفظ λόγος الموجز واستعماله اللوقاوي، مع إبقاء دلالته السياقية على الرسالة المسيحية قابلة للتوضيح في الحاشية بدل استبدالها بتفسير داخل المتن.
theological_decisions:
- issue: العلاقة بين εὐαγγελιζόμενοι وτὸν λόγον
  choice: مبشِّرين بالكلمة
  alternative: معلنين الكلمة بوصفها بشارة
  rationale: في اليونانية «الكلمة» مفعول فعل التبشير؛ والصياغة المختارة عربية طبيعية وتحفظ كلاً من معنى البشارة ولفظ «الكلمة»، من غير إنشاء علاقة إضافة موهمة مثل «بشارة الكلمة» أو حصر الرسالة في اصطلاح كنسي أضيق.
translation_notes:
  register: صياغة فصيحة واضحة وموجزة. استُعمل «جالوا» للدلالة على التنقّل بين المواضع، و«مبشِّرين بالكلمة» للحفاظ على تركيب الأصل ومعناه من غير العبارة الحرفية الثقيلة «مبشِّرين ببشارة الكلمة».
