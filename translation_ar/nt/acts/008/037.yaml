  text: Εἶπεν δὲ ὁ Φίλιππος, Εἰ πιστεύεις ἐξ ὅλης τῆς καρδίας, ἔξεστιν. Ἀποκριθεὶς δὲ εἶπεν, Πιστεύω τὸν υἱὸν τοῦ θεοῦ εἶναι τὸν Ἰησοῦν Χριστόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: ar
  text: 'فقال فيلبُّس[a]: «إن كنتَ تؤمن بكل قلبك، فيجوز لك». فأجاب وقال: «أؤمن أن يسوع المسيح هو ابن الله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية غير موجودة في أقدم المخطوطات اليونانية، ومنها برديات من القرن الثالث والمخطوطتان السينائية والفاتيكانية من القرن الرابع، كما تغيب عن الترجمات القبطية المبكرة. لكنها موجودة في تقليد أغلبية المخطوطات البيزنطية وفي التقليد اللاتيني، وقد اقتبسها بعض آباء الكنيسة الأوائل، مثل إيريناوس وقبريانوس، في أواخر القرن الثاني. وكثيرًا ما يصفها الباحثون بأنها صيغة طقسية مبكرة للاعتراف عند المعمودية أُدرجت لاحقًا في نص سفر أعمال الرسل.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: فيجوز لك
  rationale: الفعل غير الشخصي يدل على الجواز أو الإذن؛ وهذه العبارة توصل طبيعيًا معنى جواز المعمودية المقصود من السياق من غير صياغة قانونية ثقيلة.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: من كل قلبك
  rationale: يحافظ هذا التعبير على الصورة الكتابية الدالة على صدق الإيمان وكمال الإخلاص.
- source_word: Πιστεύω
  choice: أؤمن
  rationale: يلائم صيغة الاعتراف هنا، إذ يدل على الإقرار الواثق بهوية يسوع.
- source_word: τὸν Ἰησοῦν Χριστόν
  choice: يسوع المسيح
  rationale: 'الاسمان في اليونانية وحدة اسمية هي فاعل المصدر εἶναι، ولذلك تُحفظ البنية: «أن يسوع المسيح هو ابن الله»، بدل جعل «المسيح» خبرًا مستقلًا.'
theological_decisions:
- issue: البنية الاعترافية في عبارة Πιστεύω τὸν υἱὸν τοῦ θεοῦ εἶναι τὸν Ἰησοῦν Χριστόν
  choice: أؤمن أن يسوع المسيح هو ابن الله
  alternative: أؤمن أن يسوع هو المسيح، ابن الله
  rationale: الإعراب اليوناني يجعل «يسوع المسيح» فاعلًا للمصدر و«ابن الله» خبره؛ فالصياغة المختارة تحافظ على هذه العلاقة ولا تضيف عطف بيان أو خبرًا ثانيًا غير صريح.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. أُبقي تكرار «فأجاب وقال» لأنه يعكس التعبير اليوناني، واستُعمل «فيجوز لك» لإتمام الدلالة السياقية المضمرة من غير إدخال كلمة «تتعمد» في المتن.
