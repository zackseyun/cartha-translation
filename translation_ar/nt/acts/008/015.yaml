  text: اللذان نزلا وصلَّيا لأجلهم لكي ينالوا الروح القدس[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اللذان، بعدما نزلا، صلَّيا».'
