    reason: previous_rendering
lexical_decisions:
- source_word: οἵτινες
  choice: اللذان
  rationale: ضمير وصل يعود على بطرس ويوحنا المذكورين في الآية السابقة؛ وصيغة المثنى العربية تُظهر المرجع بوضوح من غير إضافة تفسيرية.
- source_word: καταβάντες
  choice: نزلا
  rationale: اسم فاعل ماضٍ يدل هنا على فعل وقع قبل الصلاة؛ وعطف الفعلين في العربية سلس ويحفظ تعاقبهما في السياق.
- source_word: προσηύξαντο
  choice: صلَّيا
  rationale: ينقل الفعل اليوناني بمعناه المباشر، ولا تستلزم صيغته الوسطى إبراز دلالة خاصة في العربية.
- source_word: περὶ αὐτῶν
  choice: لأجلهم
  rationale: مع فعل الصلاة تدل العبارة على التشفّع لمصلحتهم، و«لأجلهم» عربية طبيعية تؤدي هذا المعنى.
- source_word: ὅπως
  choice: لكي
  rationale: تحفظ دلالة الغرض المقصود من الصلاة.
- source_word: λάβωσιν
  choice: ينالوا
  rationale: ينقل فعل الأخذ أو التلقي في هذا السياق بصياغة عربية طبيعية، من غير أن تضيف صيغة الاحتمال معنى غير لازم.
- source_word: πνεῦμα ἅγιον
  choice: الروح القدس
  rationale: يشير التعبير في سياق سفر الأعمال إلى روح الله القدوس؛ واستعمال التعريف هو الصياغة العربية المألوفة لهذا المرجع الشخصي.
theological_decisions:
- issue: هل يشير πνεῦμα ἅγιον إلى روح قدوس على نحو عام أم إلى الروح القدس؟
  choice: الروح القدس
  alternative: روحًا قدوسًا
  rationale: السياق القصصي في سفر الأعمال يتحدث عن الروح الموعود به للمؤمنين، ولذلك يحدد المرجع بأنه الروح القدس من غير توسع عقائدي يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم المثنى موافقةً لمرجع ضمير الوصل، وحُفظت العلاقة الزمنية المحتملة لاسم الفاعل اليوناني في الحاشيتين مع إبقاء المتن سلسًا.
