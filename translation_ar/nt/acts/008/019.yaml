  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: ar
  text: 'قائلًا: «أعطياني أنا أيضًا هذا السلطان[a]، لكي ينال الروح القدس كلُّ من أضع عليه يديَّ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «القوة» بدلًا من «السلطان». يمكن للكلمة اليونانية أن تدل على سلطة مخوَّلة، أو حق، أو قدرة على الفعل؛ واختير «السلطان» للمحافظة على تمييزها عن كلمات يونانية أخرى تدل بصورة أصرح على القوة.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على صيغة اسم الفاعل التي تصل كلام سمعان بما سبق، وهو تعبير عربي فصيح طبيعي في السرد.
- source_word: Δότε
  choice: أعطياني
  rationale: فعل أمر موجَّه إلى اثنين بحسب السياق وصيغة الجمع اليونانية؛ والتثنية العربية تُظهر المخاطبَين بوضوح من غير توسع تفسيري.
- source_word: κἀμοί
  choice: أنا أيضًا
  rationale: تنقل معنى καί + ἐμοί وتبرز طلب سمعان أن يشمله ما رآه عند الرسولين.
- source_word: ἐξουσίαν
  choice: السلطان
  rationale: ينقل معنى الصلاحية أو السلطة المخوَّلة في ἐξουσία، ويحافظ على التمييز المعجمي عن ألفاظ يونانية أخرى تدل مباشرة على القوة.
- source_word: ταύτην
  choice: هذا
  rationale: يشير إلى السلطان المحدد الذي شاهده سمعان في السياق السابق.
- source_word: ἵνα
  choice: حتى إن
  rationale: تؤدي معنى الغاية والنتيجة المقصودة بصياغة عربية واضحة.
- source_word: ᾧ ἐὰν
  choice: كلَّ من
  rationale: ينقل دلالة الموصول غير المحدد المصحوب بأداة الشرط، أي أيَّ شخص يقع عليه الفعل.
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: أضع عليه يديَّ
  rationale: يحافظ على الصورة الحسية لوضع اليدين، مع إظهار التثنية الصريحة في النص اليوناني.
- source_word: λαμβάνῃ
  choice: ينال
  rationale: فعل عربي طبيعي لمعنى التلقي في هذا السياق، ولا يفرط في تحديد دلالة صيغة المضارع التابعة لـἵνα.
- source_word: πνεῦμα ἅγιον
  choice: الروح القدس
  rationale: السياق في سفر الأعمال يدل على روح الله، والتعريف هو التعبير العربي الطبيعي الواضح عن هذا المرجع الشخصي الإلهي.
theological_decisions:
- issue: هل تُفهم عبارة πνεῦμα ἅγιον نكرة بسبب غياب أداة التعريف اليونانية؟
  choice: الروح القدس
  alternative: روحًا قدوسًا / روح قدس
  rationale: السياق القريب واستعمال سفر الأعمال يدلان على روح الله، وغياب أداة التعريف في اليونانية لا يقتضي التنكير. الترجمة بالنكرة قد توحي بروح من بين أرواح، وهو معنى لا يسنده السياق.
- issue: هل ἐξουσία تعني سلطانًا أم قوة؟
  choice: السلطان
  alternative: القوة
  rationale: اللفظة تحتمل السلطة أو الحق أو القدرة المخوَّلة. اختيار «السلطان» يحفظ مجالها الدلالي والتمييز بينها وبين ألفاظ يونانية أدلّ مباشرة على القوة، مع إبقاء البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغتا التثنية «أعطياني» و«يديَّ» لإبراز عدد المخاطَبين واليدين كما يقتضيه السياق والنص، مع تجنب إدخال تفسير طائفي لآلية منح الروح القدس.
