base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: ar
  text: 'فقال له بطرس: «لِيَكُنْ مالُكَ[a] معكَ للهلاك، لأنك ظننتَ أن تقتني[b] عطيةَ الله بالمال.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لِتَكُنْ فضتُكَ معكَ للهلاك». كانت «الفضة» تُستعمل للدلالة على المال.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تحصل على» أو «تشتري». المعنى أن سمعان عامل عطية الله كأنها شيء يمكن تحصيله بدفع المال.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: مالُكَ
  rationale: اللفظ اليوناني يعني حرفيًا «فضتك» أو النقود الفضية، لكنه يُستعمل للدلالة على المال. واختيار «مالك» طبيعي وواضح بالعربية، مع بيان الصورة الحرفية في الحاشية.
- source_word: σὺν σοὶ
  choice: معكَ
  rationale: ينقل حرف الجر والضمير مباشرة، ويحفظ اقتران الرجل بماله في عبارة التوبيخ.
- source_word: εἴη εἰς ἀπώλειαν
  choice: لِيَكُنْ ... إلى الهلاك
  rationale: صيغة التمني اليونانية تحمل قوة دعاء أو نطق بالعقوبة، وهذه الصياغة تحفظ صورتها وشدتها دون تحويلها إلى تقرير حتمي أو إدخال مفهوم عقائدي أخص من النص.
- source_word: δωρεὰν
  choice: عطيةِ
  rationale: «عطية» مقابل عربي طبيعي يدل على ما يُعطى، ويبرز التناقض مع محاولة اقتنائه بالمال.
- source_word: ἐνόμισας
  choice: ظننتَ
  rationale: ترجمة مباشرة واضحة لمعنى التفكير أو الافتراض.
- source_word: διὰ χρημάτων
  choice: بالمال
  rationale: ينقل معنى الوسيلة الذي تؤديه διά مع المضاف إليه بأسلوب عربي موجز وطبيعي.
- source_word: κτᾶσθαι
  choice: اقتناءَ
  rationale: ينقل معنى تحصيل الشيء وامتلاكه من غير أن يحصر الفعل نفسه في الشراء، إذ إن عبارة «بالمال» توضح البعد التجاري.
- source_word: δὲ
  choice: فـ
  rationale: الفاء تصل جواب بطرس بطلب سمعان السابق وتؤدي الانتقال السياقي بسلاسة؛ وشدة المقابلة ظاهرة من مضمون الرد نفسه.
theological_decisions:
- issue: قوة قول بطرس في حق سمعان وماله
  choice: 'دعاء أو نطق بالهلاك: «لِيَكُنْ مالُكَ معكَ إلى الهلاك»'
  alternative: تقرير تنبؤي بالهلاك، أو صيغة تُصرّح بالدينونة الأبدية
  rationale: صيغة εἴη تفيد التمني أو الدعاء، وἀπώλεια تعني الهلاك أو الدمار. تحفظ الترجمة شدة التوبيخ، لكنها لا تحسم أنه تقرير حتمي ولا تضيف تحديدًا لعقوبة أبدية لا يصرح به اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظت صيغة الدعاء الشديدة والتوتر اللاهوتي دون مبالغة مذهبية، وأُثبتت علامتا الحاشية [a] و[b] في المتن.
