  to: 'فقال له بطرس: «لِيَكُنْ مالُكَ[a] معكَ للهلاك، لأنك ظننتَ أن تقتني[b] عطيةَ الله بالمال.»'
  rationale: حُذفت الإضافة الدلالية غير اللازمة «بإمكانك»، واستُبدل التركيب بـ«للهلاك» لسلاسة عربية أدق، ونُقلت علامتا الحاشية لتتعلقا مباشرة باللفظين اللذين تفسرانهما. ولا يمس ذلك شدة القول أو غموض مدى الهلاك المقصود في الأصل.
