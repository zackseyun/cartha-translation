base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: ar
  text: 'وفيما كانا سائرين في الطريق، وصلا إلى ماء، فقال الخصي: «ها هو ماء! ما الذي يمنع أن أُعمَّد؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν
  choice: وفيما كانا سائرين في الطريق
  rationale: ينقل الظرف الزمني واستمرار السير بصياغة عربية طبيعية، ويُظهر المثنى المفهوم من السياق.
- source_word: ἐπί τι ὕδωρ
  choice: إلى ماء
  rationale: تفيد العبارة بلوغ موضع فيه قدر غير محدد من الماء؛ وحذف «بعض» أفصح في العربية هنا من دون فقد المعنى.
- source_word: ὁ εὐνοῦχος
  choice: الخصي
  rationale: المقابل المباشر للمصطلح اليوناني، ويحافظ على وصف الرجل الوارد في السرد.
- source_word: καί φησιν
  choice: فقال
  rationale: المضارع التاريخي اليوناني يؤدي وظيفة سردية؛ والماضي هو الأسلوب العربي الطبيعي المتسق مع سياق الحكاية.
- source_word: Ἰδοὺ ὕδωρ
  choice: ها هو ماء!
  rationale: ينقل التنبيه المفاجئ إلى وجود الماء بصياغة عربية واضحة وحية.
- source_word: τί κωλύει με βαπτισθῆναι
  choice: ما الذي يمنع أن أُعمَّد؟
  rationale: يحافظ على السؤال وعلى صيغة المبني للمجهول، مع تعبير عربي طبيعي؛ ودلالة المتكلم مفهومة من صيغة «أُعمَّد».
theological_decisions:
- issue: هل يضيف النص شرطًا للمعمودية أو جوابًا عن سؤال الخصي؟
  choice: عدم إضافة أي شرط أو جواب
  alternative: إدراج مضمون العدد 37 بحسب تقليد نصي لاحق
  rationale: النص المقدم من SBLGNT للعدد 36 ينتهي بسؤال الخصي، ولا يتضمن الإضافة النصية المعروفة في بعض الشواهد المتأخرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، بسرد طبيعي وحوار مباشر موجز. لم تُضف حواشٍ لعدم وجود غموض نصي داخل نص العدد المقدم يستلزم علامة في المتن.
