reference: Acts 8:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: ar
  text: وكان شاول موافقًا على قتله[a]. وفي ذلك اليوم وقع اضطهاد عظيم على الكنيسة التي في أورشليم، فتشتتوا جميعًا في أنحاء اليهودية والسامرة، ما عدا الرسل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «إعدامه» أو «موته»، وبصياغة تفسيرية أقوى: «قتله ظلمًا». تشير اللفظة اليونانية إلى فعل قتله.'
    reason: بيان البدائل المعجمية مع الحفاظ على الفرق بين فعل القتل نفسه والحكم على طبيعته القانونية أو الأخلاقية.
lexical_decisions:
- source_word: Σαῦλος
  choice: شاول
  rationale: الصيغة العربية المألوفة للاسم الكتابي، وهي نقل للاسم لا ترجمة لمعناه.
- source_word: ἦν συνευδοκῶν
  choice: كان موافقًا على
  rationale: تركيب «كان» مع اسم الفاعل ينقل الاستمرار أو المعاصرة في العبارة اليونانية، و«موافقًا على» تفيد الرضا والتأييد من غير أن تنسب إلى شاول مباشرة تنفيذ القتل.
- source_word: τῇ ἀναιρέσει αὐτοῦ
  choice: قتله
  rationale: تنقل فعل وضعه للموت بوضوح، من غير أن توحي بالضرورة بشرعية قضائية كما قد تفعل «إعدامه»، ولا تضيف حكمًا قانونيًا زائدًا كما قد تفعل «اغتياله».
- source_word: Ἐγένετο
  choice: وقع
  rationale: تعبير عربي طبيعي لحدوث الاضطهاد وابتدائه في ذلك اليوم.
- source_word: διωγμὸς μέγας
  choice: اضطهاد عظيم
  rationale: يحافظ على الاسم وعلى توكيد شدة الحدث أو اتساعه في الصفة اليونانية.
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: على الكنيسة التي في أورشليم
  rationale: «على» ملائمة لتوجيه الاضطهاد ضد الكنيسة، والصلة تحافظ بوضوح على تحديد الكنيسة الواقعة في أورشليم.
- source_word: πάντες δὲ διεσπάρησαν
  choice: فتشتتوا جميعًا
  rationale: يحفظ المبني للمجهول دلاليًا بوصف التشتت الواقع عليهم، وتعود واو الجماعة سياقيًا إلى جماعة الكنيسة، مع بقاء الاستثناء اللاحق محددًا لنطاق «جميعًا».
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: في أنحاء اليهودية والسامرة
  rationale: «في أنحاء» صياغة عربية واضحة تفيد الانتشار عبر أقاليم المنطقتين، مع استعمال الاسمين الجغرافيين المألوفين.
- source_word: πλὴν τῶν ἀποστόλων
  choice: ما عدا الرسل
  rationale: تنقل الاستثناء مباشرة وبأسلوب عربي معاصر وواضح.
theological_decisions:
- issue: وصف موت استفانوس في ἀναιρέσει αὐτοῦ
  choice: قتله
  alternative: إعدامه؛ موته؛ اغتياله
  rationale: «قتله» يحافظ على كون اللفظة تشير إلى فعل وضعه للموت، من غير حسم مشروعية الإجراء بكلمة «إعدامه»، أو تلطيف الفعل إلى مجرد «موته»، أو إضافة توصيف قانوني وتفسيري أقوى في «اغتياله».
- issue: نطاق πάντες «جميعًا»
  choice: فتشتتوا جميعًا ... ما عدا الرسل
  alternative: تشتت جميع المؤمنين؛ تشتت الجميع بلا استثناء
  rationale: تُبقي الصياغة قوة التعميم في النص، بينما يحدد الاستثناء الصريح نطاقه، من غير إضافة «المؤمنين» إلى المتن أو تحويله إلى تعميم مطلق.
translation_notes:
  register: العربية فصحى معاصرة، واضحة ومهيبة من غير تراكيب تراثية ثقيلة. وُضع رابط الجملة «و» في البداية لنقل δὲ بوظيفته السياقية، من غير إدخال ظرف زمني غير موجود. وُضع مؤشر الحاشية بعد «قتله» لأنه الموضع الذي تشرحه الحاشية.
