  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: ar
  text: لِأَنَّ الرُّوحَ الْقُدُسَ لَمْ يَكُنْ قَدْ حَلَّ بَعْدُ عَلَى أَحَدٍ مِنْهُمْ[a]، بَلْ كَانُوا قَدِ اعْتَمَدُوا فَقَطْ بِاسْمِ الرَّبِّ يَسُوعَ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لم يكن قد وقع بعدُ على أحدٍ منهم». والمقصود حلول الروح القدس عليهم.'
    reason: lexical_alternative
  - marker: b
