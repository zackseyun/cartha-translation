    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: لم يكن قد... بعدُ
  rationale: ينقل الدلالة الزمنية التي تفيد أن الحدث لم يقع إلى ذلك الحين، بصياغة عربية طبيعية.
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: على أحدٍ منهم
  rationale: تحفظ صورة المجيء أو الحلول على أشخاص مع نفي الشمول بواسطة «أحد» في سياق النفي.
- source_word: ἐπιπεπτωκός
  choice: حلَّ
  rationale: الفعل اليوناني يعني حرفيًا «وقع على»، لكنه يُستعمل هنا في سفر الأعمال لمجيء الروح القدس على الناس؛ و«حلَّ على» تعبير عربي واضح ومألوف، مع حفظ الصورة الحرفية في الحاشية.
- source_word: μόνον
  choice: فقط
  rationale: تبيّن القصر والمقابلة بين الاعتماد وبين حلول الروح القدس الذي لم يكن قد حدث بعد.
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: كانوا قد اعتمدوا
  rationale: ينقل التركيب المحيطي الدال على فعل سابق نتجت عنه حالة قائمة، بصياغة عربية سليمة.
- source_word: εἰς τὸ ὄνομα
  choice: إلى اسم
  rationale: يحافظ على اتجاه حرف الجر εἰς وعلى الصلة المقصودة بالاسم، من غير حسم ما قد يثار لاحقًا من مسائل لاهوتية بشأن صيغة المعمودية.
- source_word: κυρίου Ἰησοῦ
  choice: الرب يسوع
  rationale: ترجمة مباشرة للقب والاسم، وهي طبيعية في العربية الكتابية المعاصرة.
theological_decisions:
- issue: فاعل «لم يكن قد حلّ» المضمر في اليونانية
  choice: ذُكر «الروح القدس» صراحةً اعتمادًا على السياق السابق المباشر.
  alternative: إبقاء الفاعل مستترًا في العربية أو استعمال ضمير يعود إلى الآية السابقة.
  rationale: النص اليوناني يحذف الفاعل لأن الروح القدس مذكور في الآية السابقة؛ وإظهاره في العربية يزيل التباسًا أسلوبيًا من غير إضافة مرجع جديد.
- issue: دلالة εἰς في عبارة المعمودية
  choice: «إلى اسم الرب يسوع»
  alternative: «باسم الرب يسوع» أو «في اسم الرب يسوع»
  rationale: «إلى» أقرب إلى البنية اليونانية وتحفظ ما فيها من دلالة الاتجاه أو الدخول في علاقة، من غير أن تفرض تفسيرًا طقسيًا أو مذهبيًا بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «اعتمدوا» للمصطلح المسيحي المعروف، وحُفظت بنية المقابلة بين عدم حلول الروح وبين سبق المعمودية.
