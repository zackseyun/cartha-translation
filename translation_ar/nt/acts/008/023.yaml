  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: ar
  text: لأني أراك في سُمِّ المرارة[b] ورباط الظلم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قيد الظلم» أو «وثاق الشر».'
    reason: lexical_alternative
  - marker: b
    text: '«سُمّ المرارة» صورة مجازية حية، يُرجَّح أنها تردد لغة العهد القديم عن مادة سامة أو شديدة المرارة (قارن التثنية 29: 18 في الترجمة السبعينية).'
    reason: cross_reference
lexical_decisions:
- source_word: εἰς
  choice: في
  rationale: تدل هنا، مع تركيب ὁρῶ σε ὄντα، على الحالة التي يرى بطرس أن سمعان كائن فيها، لا على حركة مكانية إليها.
- source_word: γὰρ
  choice: لأني
  rationale: تفيد تعليل التوبيخ السابق، وصيغة «لأني» تؤدي هذا الربط بوضوح وطبيعية في العربية.
- source_word: χολὴν πικρίας
  choice: مرارة العلقم
  rationale: تحافظ على الصورة الحسية السامة في χολή وعلى تركيب الإضافة، من غير اختزال العبارة إلى مجرد شعور بالمرارة. و«العلقم» لفظ عربي واضح للشيء الشديد المرارة، ويصلح هنا مجازًا للسم المرّ.
- source_word: σύνδεσμον ἀδικίας
  choice: رباط الإثم
  rationale: «رباط» ينقل معنى ما يقيّد أو يوثق، و«الإثم» يلائم هنا الشر الأخلاقي الشخصي الذي يدل عليه ἀδικία، مع إبقاء احتمال الظلم أو الشر في الحاشية.
- source_word: ὁρῶ
  choice: أراك
  rationale: يحافظ على فعل الرؤية، وهو في السياق يفيد الإدراك أو التبيّن أيضًا.
- source_word: σε ὄντα
  choice: أراك في
  rationale: دُمج تركيب المفعول مع اسم الفاعل في صياغة عربية طبيعية، مع الحفاظ على كون الكلام وصفًا لحالة المخاطَب الراهنة.
theological_decisions:
- issue: وصف حالة سمعان الروحية والأخلاقية بالمجاز
  choice: الإبقاء على صورتي «مرارة العلقم» و«رباط الإثم» بوصفهما وصفًا لحالته الحاضرة.
  alternative: التفسير الصريح مثل «ممتلئ بالسم المرّ وأسير للخطيئة».
  rationale: النص اليوناني يستخدم صورتين مجازيتين مكثفتين ولا يقدّم شرحًا عقائديًا صريحًا لهما؛ لذلك يحفظ إبقاؤهما حدة النص وغموضه الحقيقي من غير استيراد تفسير زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. اختير «العلقم» بدل التعريب الحرفي التشريحي لـχολή لأن المقصود صورة السم الشديد المرارة، واختير «رباط» للحفاظ على مجاز القيد من غير تفسيره تفسيرًا مذهبيًا.
