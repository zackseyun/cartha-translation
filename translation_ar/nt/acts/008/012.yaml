source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: ar
  text: ولكن حين صدَّقوا فيلبُّس وهو يبشِّر بملكوت الله وباسم يسوع المسيح[a]، فكانوا يُعمَّدون، رجالًا ونساءً.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» لقب معناه «الممسوح».
    reason: توضيح أن Χριστός لقب ذو دلالة مسيانية، لا مجرد جزء من الاسم.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: أمّا حين
  rationale: تنقل «حين» الدلالة الزمنية، وتعبّر «أمّا» عن الانتقال السردي الخفيف الذي تؤديه δέ من غير مبالغة في معنى الاستدراك.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: صدَّقوا فيلبُّس
  rationale: الفعل مع المفعول غير المباشر هنا يدل على تصديق فيلبس بوصفه مُخبِرًا ومبشِّرًا، لا على اتخاذه موضوعًا للإيمان الخلاصي. والصياغة العربية موجزة وتحفظ هذا الفرق.
- source_word: εὐαγγελιζομένῳ
  choice: وهو يبشِّر
  rationale: تحفظ الجملة الحالية استمرار عمل فيلبس وقت تصديقهم له، ويؤدي «يبشِّر» معنى إعلان الخبر السار بلغة كتابية مألوفة وواضحة.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: بملكوت الله
  rationale: الباء بعد «يبشّر» عربية طبيعية لبيان مضمون البشارة، و«ملكوت الله» هو التعبير العربي المألوف الذي يشمل مُلك الله وسلطانه.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: وباسم يسوع المسيح
  rationale: أُبقي تعبير «الاسم» لما قد يحمله من معنى الهوية والسلطان والشخص، وتؤدي «المسيح» لقب Χριστός في العربية بوضوح ومن غير تحويله إلى اسم عائلة.
- source_word: ἐβαπτίζοντο
  choice: فكانوا يُعمَّدون
  rationale: تحفظ «كانوا» مع المضارع المنظورَ الاستمراري أو التكراري لصيغة الماضي الناقص، ويحفظ البناء للمجهول كونهم متلقّي المعمودية.
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: رجالًا ونساءً
  rationale: تنقل العبارة ذكر الفئتين صراحة، وتأتي حالًا مبيِّنة لمن كانوا يُعمَّدون بصياغة عربية طبيعية.
theological_decisions:
- issue: دلالة Χριστοῦ في Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع الممسوح
  rationale: «المسيح» في العربية لقب معروف يحفظ معنى «الممسوح» ودلالته المسيانية، وهو أفصح وأرسخ من الترجمة التفسيرية «الممسوح».
- issue: معنى الإيمان في ἐπίστευσαν τῷ Φιλίππῳ
  choice: صدَّقوا فيلبُّس
  alternative: آمنوا بفيلبُّس
  rationale: اختير «صدَّقوا» كيلا توحي العبارة بأن فيلبس نفسه كان موضوع إيمانهم؛ فصيغة اليونانية هنا تصفه بوصفه الشخص الذي صدقوا بشارته.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع استعمال «ملكوت» و«يُعمَّدون» للمحافظة على المصطلحين الكتابيين المألوفين. أُبقيت علامة الحاشية [a] في المتن، واستُخدم قدر محدود من الضبط لمنع التباس «يُعمَّدون».
