  naturalness: «وكان راجعًا، وهو جالس في مركبته» سليمة، لكن حذف «وهو» يجعل الجملة السردية أيسر. و«يقرأ في النبي إشعياء» تعبير فصيح ومألوف في السياق الكتابي؛ لا يُفهم منه أنه يقرأ الشخص نفسه.
  terminology: «إشعياء» و«النبي» صحيحان. أبقيت «مركبته» لأنها لفظ واضح لا يقيّد نوع العربة أكثر مما يقتضيه ἅρμα. لا يلزم إثبات أن القراءة كانت جهرية.
