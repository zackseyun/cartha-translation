  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: ar
  text: وكان راجعًا، جالسًا في مركبته، ويقرأ في النبي إشعياء.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: وكان راجعًا
  rationale: ينقل التركيب المحيطي ἦν مع اسم الفاعل معنى الحدث المستمر في الماضي، من غير إضافة «إلى بلاده» أو «إلى بيته»، إذ لا يصرّح بهما النص اليوناني. ونُقلت τέ بواو الربط.
- source_word: καθήμενος
  choice: وهو جالس
  rationale: يصف هيئة الرجل في أثناء عودته، والصياغة طبيعية وواضحة في العربية.
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: في مركبته
  rationale: ἅρμα مركبة بعجلات، وقد تكون عربة سفر أو مركبة رسمية. «في مركبته» عربية طبيعية وتحفظ عموم اللفظ من غير فرض صورة حربية قد يوحي بها لفظ «مركبة» في بعض السياقات.
- source_word: ἀνεγίνωσκεν
  choice: يقرأ
  rationale: صيغة الماضي الناقص تفيد فعلًا مستمرًا متزامنًا مع العودة والجلوس. لا يصرّح الفعل بذاته بأن القراءة كانت جهرية، لذلك لم تُضف «بصوت عالٍ» إلى المتن.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: سفر إشعياء النبي
  rationale: المقصود أنه كان يقرأ من مؤلَّف النبي، لا أنه يقرأ شخصه. أُضيفت «سفر» لإيضاح المعنى الطبيعي في العربية، مع إبقاء ترتيب «إشعياء النبي» الموافق لترتيب اليونانية.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية رصينة. استُخدم «مركبته» بدل لفظ قد يُفهم حصريًا على أنه عربة حربية، وأُوضح مفعول «يقرأ» بإضافة «سفر» لأن العربية لا تستعمل عادة اسم الشخص مباشرة للدلالة على كتابه إلا على سبيل الحذف.
