  verdict: revise
  source_fidelity: 'يحفظ «وُجد في أشدود» المبني للمجهول في εὑρέθη ولا يفسّر كيفية انتقال فيلبس. لكن جعل «بالمدن كلها» متعلقًا بـ«يمر» بدلًا من فعل التبشير لا يعكس على نحو دقيق أن τὰς πόλεις πάσας هي متعلّق εὐηγγελίζετο: كان يبشّر جميع المدن/فيها.'
  naturalness: الصياغة الحالية مفهومة، إلا أن «أخذ يمر بالمدن كلها مبشرًا» قد تفيد أنه مرّ بالمدن فحسب، مع كون التبشير وصفًا مرافقًا غير محدد الجهة. الصياغة المنقحة أوضح وأفصح في بيان أن التبشير وقع في جميع المدن.
  terminology: «أشدود» مقابل Ἄζωτος و«قيصرية» مقابل Καισάρεια اسمان عربيان كتابيان مناسبان. و«الخبر السار» تعبير فصيح واضح لـεὐαγγελίζω، مع أن «يبشّر» يحمل الفعل التبشيري كما في الأصل.
