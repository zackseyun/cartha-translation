  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: ar
  text: وأما فيلبس، فوُجد في أشدود، وبينما كان يجتاز كان يبشّر في جميع المدن بالخبر السار، حتى وصل إلى قيصرية.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: أَمَّا
  rationale: تفيد انتقالًا سرديًّا لطيفًا مع إبراز التحول من اختفاء فيلبس عن الخصي في الآية السابقة إلى وجوده في أشدود، من غير تشديد غير لازم على معنى الاستدراك.
- source_word: εὑρέθη
  choice: فَوُجِدَ
  rationale: ترجمة مباشرة للمبني للمجهول تحفظ صياغة المصدر وغموض كيفية انتقال فيلبس، بدل تفسيرها صراحةً بمعنى «ظهر».
- source_word: εἰς Ἄζωτον
  choice: فِي أَشْدُودَ
  rationale: مع فعل يدل على الوجود الناتج، تؤدي «في» معنى الموضع الذي وُجد فيه فيلبس طبيعيًّا. واستُخدم الاسم العربي الكتابي الشائع «أشدود» للمدينة المعروفة باسم أزوتس باليونانية.
- source_word: διερχόμενος
  choice: أَخَذَ يَمُرُّ
  rationale: تنقل حركة اسم الفاعل المصاحبة للفعل التالي، وتنسجم مع دلالة الاستمرار في الفعل الناقص εὐηγγελίζετο.
- source_word: εὐηγγελίζετο
  choice: مُبَشِّرًا بِالْخَبَرِ السَّارِّ
  rationale: تعبير عربي واضح ينقل المعنى اللفظي لنشر البشارة، وتُظهره البنية مع «أخذ يمر» عملًا مستمرًّا ومتكررًا في أثناء الرحلة.
- source_word: τὰς πόλεις πάσας
  choice: بِالْمُدُنِ كُلِّهَا
  rationale: تحفظ الشمول الجماعي للمدن الواقعة على طريقه؛ وتعلقت العبارة بفعل المرور، بينما يُفهم أن التبشير جرى فيها.
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: حَتَّى وَصَلَ
  rationale: صياغة عربية طبيعية تحدد نهاية مسار المرور والتبشير، مع الحفاظ على معنى الوصول في السياق.
- source_word: εἰς Καισάρειαν
  choice: إِلَى قَيْصَرِيَّةَ
  rationale: تنقل εἰς وجهة الحركة بوضوح، وتستخدم الصيغة العربية المألوفة لاسم المدينة.
theological_decisions:
- issue: هل يُفسَّر εὑρέθη صراحةً على أنه ظهور عجائبي أو انتقال خارق؟
  choice: 'الإبقاء على المبني للمجهول المحايد: «فَوُجِدَ»'
  alternative: «فَظَهَرَ» أو «فَوَجَدَ نَفْسَهُ»
  rationale: السياق السابق يوحي بقوة بفعل إلهي، لكن اللفظ اليوناني نفسه لا يصرح بكيفية الانتقال. لذلك تحفظ الترجمة التوتر والغموض السرديَّين ولا تضيف تفسيرًا عقائديًّا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على المبني للمجهول في εὑρέθη، وعلى استمرار حركة فيلبس وتبشيره، مع استعمال الاسمين الجغرافيين العربيين المألوفين «أشدود» و«قيصرية». لا توجد حاشية لأن المتن المباشر «فوجد» يحفظ دلالة الأصل وغموضه من غير حاجة إلى بديل تفسيري.
