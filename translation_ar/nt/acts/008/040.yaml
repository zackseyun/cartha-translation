    rationale: في اليونانية، τὰς πόλεις πάσας هي مفعول/نطاق εὐηγγελίζετο، لا نطاق διερχόμενος. ينبغي أن تبيّن العربية أن فيلبس كان يبشّر في جميع المدن أثناء اجتيازه.
  revised_text: وأما فيلبس، فوُجد في أشدود، وبينما كان يجتاز كان يبشّر في جميع المدن بالخبر السار، حتى وصل إلى قيصرية.
