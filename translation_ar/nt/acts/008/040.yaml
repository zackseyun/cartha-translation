revisions:
- from: أَمَّا فِيلُبُّسُ فَوُجِدَ فِي أَشْدُودَ، وَأَخَذَ يَمُرُّ بِالْمُدُنِ كُلِّهَا مُبَشِّرًا بِالْخَبَرِ السَّارِّ، حَتَّى وَصَلَ إِلَى قَيْصَرِيَّةَ.
  to: وأما فيلبس، فوُجد في أشدود، وبينما كان يجتاز كان يبشّر في جميع المدن بالخبر السار، حتى وصل إلى قيصرية.
  rationale: تُبقي المراجعة «وُجد» ترجمة محايدة وأمينة للمبني للمجهول، وتصحح البنية بحيث يرتبط «في جميع المدن» بالتبشير، مع إبقاء دلالة الفعل المستمر في εὐηγγελίζετο والسير المصاحب في διερχόμενος. لا يلزم وضع حاشية؛ فالنص العربي لا يصرح بتفسير عجائبي ويتحمل الغموض المقصود في الأصل.
