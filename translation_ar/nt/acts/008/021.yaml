  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: ar
  text: ليس لك نصيب ولا حصة في هذا الأمر، لأن قلبك ليس مستقيمًا أمام الله.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς οὐδὲ κλῆρος
  choice: نصيب ولا حصة
  rationale: يحافظ على ازدواج التعبير اليوناني الذي ينفي أي مشاركة أو حق، بصياغة عربية واضحة وطبيعية.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: في هذا الأمر
  rationale: «λόγος» هنا يدل بحسب السياق على الأمر أو الشأن الجاري، لا على مجرد قول منطوق.
- source_word: εὐθεῖα
  choice: مستقيمًا
  rationale: ينقل صورة الاستقامة الأخلاقية الكامنة في اللفظ اليوناني، مع موافقة «قلب» المذكر في العربية.
- source_word: ἔναντι τοῦ θεοῦ
  choice: أمام الله
  rationale: ترجمة مباشرة وطبيعية تفيد أن حال القلب مكشوفة ومحكومة في حضرة الله.
theological_decisions:
- issue: طبيعة نفي المشاركة
  choice: الإبقاء على التعبير المزدوج «نصيب ولا حصة»
  alternative: «لا نصيب لك في هذا الأمر»
  rationale: لا ينبغي اختزال الازدواج اليوناني μερίς/κλῆρος، إذ يؤكد انتفاء المشاركة أو الحق دون إضافة تحديد طائفي لطبيعة ذلك الحق.
- issue: وصف القلب أمام الله
  choice: «ليس مستقيمًا أمام الله»
  alternative: «ليس صحيحًا في نظر الله»
  rationale: يحفظ الاستعارة الأصلية للاستقامة ولا يحولها إلى حكم عقائدي أكثر تحديدًا مما يقوله النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة، مع الحفاظ على التوازي التأكيدي في الأصل وعلى صورة استقامة القلب.
