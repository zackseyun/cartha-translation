id: ACT.8.33
reference: Acts 8:33
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: ar
  text: في مذلَّته، انتُزع منه العدل[b]. ومَن يصف جيلَه[a]؟ لأن حياته تُنتزع من الأرض.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نسله» أو «معاصروه»؛ فاللفظ اليوناني «جيل» يحفظ غموض العبارة المقتبسة من إشعياء 53.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «انتُزع منه الحكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώσει
  choice: مذلَّته
  rationale: يدل الاسم على حالة الخفض والإهانة؛ و«مذلَّته» تعبير عربي موجز يحفظ معنى الاتضاع القسري في سياق الألم الظالم.
- source_word: κρίσις
  choice: العدل
  rationale: يمكن أن تعني الكلمة «الحكم»، لكن السياق يفيد حرمانه من المعاملة القضائية العادلة؛ و«العدل» ينقل هذا المعنى مع إبقاء البديل في الحاشية.
- source_word: ἤρθη
  choice: انتُزع منه
  rationale: صيغة المبني للمجهول من αἴρω تفيد الإزالة أو الحرمان، و«انتُزع منه» طبيعية وقوية في العربية.
- source_word: γενεὰν
  choice: جيله
  rationale: تحفظ «جيله» سعة اللفظ اليوناني وغموض اقتباس إشعياء، من غير حسمه إلى النسل أو المعاصرين.
- source_word: διηγήσεται
  choice: يصف
  rationale: الفعل يدل على السرد أو البيان المفصّل؛ و«يصف» مستقيمة في السؤال البلاغي ولا تضيف مفعولًا غير موجود في النص.
- source_word: αἴρεται
  choice: تُنتزع
  rationale: المضارع المبني للمجهول يصوّر الفعل بحيوية، و«تُنتزع» يحفظ معنى أخذ الحياة وإزالتها.
- source_word: γῆς
  choice: الأرض
  rationale: «الأرض» هي المقابل المباشر والأنسب في عبارة نزع الحياة من الوجود الأرضي.
- source_word: ζωὴ
  choice: حياته
  rationale: المعنى هنا هو الحياة الجسدية في سياق موت العبد في اقتباس إشعياء.
theological_decisions:
- issue: تفسير «جيله»
  choice: إبقاء اللفظ المحتمل «جيله» في المتن
  alternative: «نسله» أو «معاصروه»
  rationale: العبارة المقتبسة من إشعياء 53 شديدة الاحتمال، وقد تشير إلى الذرية أو المعاصرين؛ لذلك يحفظ المتن التوتر التفسيري وتعرض الحاشية البدائل.
- issue: دلالة κρίσις
  choice: «العدل»
  alternative: «الحكم»
  rationale: يفيد السياق أن المعاملة العادلة قد حُرم منها، لا مجرد وقوع حكم؛ وتذكر الحاشية المقابل القضائي البديل من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ إيقاع الاقتباس الشعري والسؤال البلاغي، مع تجنب الألفاظ المذهبية وحسم مواضع الغموض الأصيلة.
