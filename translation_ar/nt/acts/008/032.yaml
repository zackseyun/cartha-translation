base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: ar
  text: 'أما المقطع من الكتاب المقدس الذي كان يقرأه، فكان هذا:


    «اقتيد كخروف إلى الذبح[a]،


    وكحَمَلٍ صامت أمام من يجزّه[b]،


    كذلك لا يفتح فمه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للذبح».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أمام الجزّاز».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: المقطع من الكتاب المقدس
  rationale: تشير περιοχή هنا إلى جزء محدد من النص المقروء، و«المقطع» تعبير عربي واضح؛ أما γραφή فتدل في هذا السياق على الكتاب المقدس.
- source_word: ἀνεγίνωσκεν
  choice: يقرأه
  rationale: جاء الفعل في صيغة الماضي الناقص الدالة على فعل كان مستمرًا في سياق ماضٍ، وقد نقل هذا المعنى تركيب الجملة الافتتاحية مع «كان».
- source_word: Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη
  choice: اقتيد كخروف إلى الذبح
  rationale: يحفظ «اقتيد» المبني للمجهول ومعنى القيادة إلى المصير، وتحفظ الكاف التشبيه. اختير «خروف» بدل «شاة» لتلاؤم الإحالة المذكرة إلى الشخص المقصود، مع إبقاء الفرق النسبي بين πρόβατον وἀμνός.
- source_word: ἀμνὸς
  choice: حَمَل
  rationale: يدل اللفظ تحديدًا على صغير الضأن، ولذلك يميزه «حَمَل» عن «خروف» في الشطر السابق.
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν ἄφωνος
  choice: صامت أمام من يجزّه
  rationale: «أمام» تنقل الدلالة المكانية، و«من يجزّه» تعكس اسم الفاعل اليوناني بوصفه فعلًا جاريًا، و«صامت» تؤدي معنى ἄφωνος الطبيعي في التشبيه.
- source_word: οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: كذلك لا يفتح فمه
  rationale: تحفظ «كذلك» نتيجة المقارنة، ويُبقي المضارع العربي على المضارع الحي في نص الاقتباس اليوناني.
theological_decisions:
- issue: الاقتباس المسياني من إشعياء 53 وتطبيقه على يسوع في السياق
  choice: الإبقاء على صورة الاقتباس وتشبيهاته دون إدخال اسم يسوع في الآية
  alternative: التصريح بأن يسوع هو العبد المتألم داخل نص الآية
  rationale: السياق اللاحق يبين التطبيق المسياني، لكن هذه الآية نفسها تسوق نص الكتاب؛ لذلك يحفظ النقل صيغة الاقتباس ولا يحسم الإحالة بتفسير مضاف.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات إيقاع يليق بالاقتباس الشعري. لم تُضف أداة استهلال مثل «أما الآن» لأن الأصل لا يشتمل على ظرف زمان صريح. أُثبتت علامتا الحاشيتين [a] و[b] في موضعيهما من المتن.
