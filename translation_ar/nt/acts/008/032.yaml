    issue: زمن «الذي يقرأه»
    rationale: الفعل اليوناني ἀνεγίνωσκεν في الماضي الناقص، فيصف قراءة جارية في حدث ماضٍ. ينبغي أن يقال «الذي كان يقرأه» بدل المضارع غير المقيّد «يقرأه».
  - severity: low
    issue: صياغة الحاشية [a]
    rationale: «إلى حيث يُذبح» توسّع موضعي تفسيري، لا بديلًا مباشرًا لعبارة ἐπὶ σφαγήν. «للذبح» بديل عربي مباشر يحفظ الدلالة.
  - severity: low
