source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: ar
  text: ولما سمع الرسل الذين في أورشليم أن السامرة قد قبلت كلمة الله، أرسلوا إليهم بطرس ويوحنا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: ولما سمع
  rationale: اسم الفاعل الأوريستي يقدّم الظرف السابق للفعل الرئيس، و«لما سمع» صياغة عربية طبيعية تحفظ التعاقب الزمني. ونُقلت δέ بواو وصل خفيفة تلائم تطور السرد من غير إقحام معنى مقابلة قوية.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: الرسل الذين في أورشليم
  rationale: يحفظ التركيب تحديد الرسل بحسب وجودهم في أورشليم، بلغة عربية واضحة وقريبة من بنية الأصل.
- source_word: δέδεκται
  choice: قد قبلت
  rationale: الفعل التام يدل على قبول تحقق وبقي أثره؛ وتؤدي «قد» مع الماضي هذا المعنى بوضوح. واختير «قبلت» لأن δέχομαι هنا يفيد تلقي الكلمة وقبولها، لا مجرد سماعها.
- source_word: ἡ Σαμάρεια
  choice: السامرة
  rationale: أُبقي اسم المكان كما في اليونانية، مستعملا مجازًا عن أهله، من غير استبداله بتفسير أضيق مثل «السامريون».
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: كلمة الله
  rationale: يحفظ التعبير الكتابي المألوف والصيغة الإضافية في الأصل، مع دلالته في السياق على البشارة المعلنة.
- source_word: ἀπέστειλαν πρὸς αὐτοὺς
  choice: أرسلوا إليهم
  rationale: صياغة عربية مباشرة تنقل فعل الإرسال والاتجاه إلى الجماعة المشار إليها في السامرة.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: بطرس ويوحنا
  rationale: الصيغة العربية الكتابية المعيارية للاسمين.
theological_decisions:
- issue: الاستعمال المجازي لاسم السامرة
  choice: السامرة قد قبلت كلمة الله
  alternative: السامريون قد قبلوا كلمة الله
  rationale: يسمي الأصل المكان اسمًا جمعيًا يُراد به أهله. إبقاء «السامرة» يصون صورة النص وغموضه المحدود، والسياق يوضح أن المقصود السكان.
- issue: ترجمة λόγος
  choice: كلمة الله
  alternative: رسالة الله
  rationale: «كلمة الله» أقرب إلى اللفظ اليوناني وتحفظ الرنين الكتابي واللاهوتي، من غير أن تنفي أن المراد هنا الرسالة المعلنة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع قرب معتدل من ترتيب الأصل. استُعملت «أورشليم» و«السامرة» و«بطرس ويوحنا» وفق الصيغ العربية الكتابية الشائعة، ولم تُضف علامة حاشية لعدم الحاجة إلى حاشية تفسيرية في هذا العدد.
