  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: ar
  text: وكان من قبل في المدينة رجل اسمه سمعان، يمارس السحر[a] ويُدهش شعب السامرة، قائلًا إنه هو نفسه شخص عظيم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: يشتغل بالفنون السحرية. ويمكن أيضًا ترجمتها: «يمارس الشعوذة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إنه ذو شأن عظيم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: وكان ... رجل
  rationale: ينقل «رجلًا» بدقة، ويجعل δέ رابطًا سرديًا خفيفًا بالواو من غير إدخال ظرف زمني غير موجود. وتؤدي نكرة «رجل» معنى τις طبيعيًا في العربية.
- source_word: ὀνόματι Σίμων
  choice: اسمه سمعان
  rationale: صياغة عربية طبيعية للتعريف بالاسم، مع اعتماد الصورة العربية المألوفة للاسم العلم.
- source_word: προϋπῆρχεν
  choice: كان من قبل
  rationale: يحفظ دلالة الوجود السابق على الأحداث المذكورة في السياق، من غير أن يحصر السبق في ممارسة السحر وحدها.
- source_word: ἐν τῇ πόλει
  choice: في المدينة
  rationale: ترجمة مكانية مباشرة، وأداة التعريف تحيل طبيعيًا إلى المدينة المعروفة من السياق.
- source_word: μαγεύων
  choice: يمارس السحر
  rationale: ينقل الاشتغال المستمر بفنون السحر بعبارة عربية واضحة ومعاصرة، من غير إضافة حكم على مصدر تلك الأعمال.
- source_word: ἐξιστάνων
  choice: يُدهش
  rationale: يفيد التسبب في الدهشة، ويحافظ مع الفعل المضارع على تزامنه واستمراره مع ممارسة السحر.
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: شعب السامرة
  rationale: ينقل المعنى الجمعي لـἔθνος هنا بصورة طبيعية، من غير الإيحاء بكيان سياسي حديث.
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على الصيغة الحالية ويقدّم مضمون كلام سمعان من غير استبدالها بفعل تفسيري مثل «مدّعيًا».
- source_word: εἶναί τινα ἑαυτὸν μέγαν
  choice: إنه هو نفسه شخص عظيم
  rationale: يحفظ معنى τινα بوصفه «شخصًا» ويُظهر الإحالة المؤكدة في ἑαυτόν، مع إبقاء μέγαν عامًا بين العظمة وعلو الشأن.
theological_decisions:
- issue: وصف نشاط سمعان
  choice: يمارس السحر
  alternative: يمارس الشعوذة
  rationale: النص يصف اشتغاله بالفنون السحرية، لكنه لا يحدد في هذه الآية مصدرها الماورائي ولا يصفها صراحة بأنها خداع؛ لذلك تجنبت الترجمة إضافة هذا التفسير.
- issue: طبيعة تعظيم سمعان لنفسه
  choice: إنه هو نفسه شخص عظيم
  alternative: إنه ذو شأن عظيم
  rationale: تُبقي الصياغة مضمون قوله عامًا كما في اليونانية، فلا تحدد نوع العظمة أو المنزلة التي نسبها إلى نفسه.
translation_notes:
  register: لغة عربية فصحى واضحة ذات نبرة سردية كريمة. استُخدمت جملة «كان من قبل» لإبراز السبق الزمني، مع مضارعين يحفظان استمرار الفعلين وتزامنهما. وُضعت علامة الحاشية [a] عقب «السحر» لأنها تشرح اللفظ اليوناني μαγεύων، وعلامة [b] عقب وصف العظمة.
