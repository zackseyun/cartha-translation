  source_fidelity: 'الترجمة أمينة للنص اليوناني: «رجل» تنقل ἀνήρ τις، و«كان من قبل في المدينة» تؤدي προϋπῆρχεν ἐν τῇ πόλει من غير تقييد غير وارد، كما أن «يمارس السحر» و«يُدهش شعب السامرة» ينقلان المشاركتين المستمرتين μαγεύων وἐξιστάνων. وتحفظ العبارة الختامية ادعاء سمعان بشأن نفسه ومعنى العظمة العام في μέγαν.'
