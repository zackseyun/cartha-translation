translation:
  language: ar
  text: عندئذٍ كانا يضعان أيديهما عليهم، وكانوا ينالون الروح القدس.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا بصياغة سردية أبسط: «عندئذٍ وضعا أيديهما عليهم، فنالوا الروح القدس». كلا الفعلين في اليونانية بصيغة الماضي الناقص، وقد تدل هنا على فعل جارٍ أو متكرر.'
    reason: بيان البديل الأسلوبي والدلالة المحتملة لصيغة الفعلين اليونانيين
lexical_decisions:
- source_word: τότε
  choice: عندئذٍ
  rationale: تؤدي معنى التتابع الزمني في السرد بعبارة عربية فصيحة وطبيعية.
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: كانا يضعان أيديهما عليهم
  rationale: يحافظ فعل «يضعان ... الأيدي» على الإيماءة المقصودة، ويُظهر التثنية أن الفاعلين هما الرسولان المذكوران في السياق، كما تعكس صيغة «كانا يضعان» الماضي الناقص اليوناني وما قد يدل عليه من فعل متكرر أو جارٍ.
- source_word: ἐλάμβανον
  choice: كانوا ينالون
  rationale: تعكس صيغة «كانوا ينالون» الماضي الناقص من غير أن تفرض معنى البدء، و«ينالون» طبيعية في سياق نوال عطية إلهية.
- source_word: πνεῦμα ἅγιον
  choice: الروح القدس
  rationale: يشير التعبير في هذا السياق من سفر الأعمال إلى روح الله القدوس المعروف، ولذلك تلائم العربية صيغة التعريف «الروح القدس».
theological_decisions:
- issue: هل πνεῦμα ἅγιον نكرة أم إشارة إلى الروح الإلهي المعروف؟
  choice: الروح القدس
  alternative: روحًا قدوسًا
  rationale: السياق المباشر وسياق لوقا–أعمال الرسل يدلان على الروح الإلهي الموعود، من غير إضافة تفصيل عقائدي غير مذكور في الآية.
- issue: كيفية تمثيل صيغة الماضي الناقص في الفعلين اليونانيين
  choice: كانا يضعان ... وكانوا ينالون
  alternative: وضعا ... فنالوا
  rationale: تحفظ الصياغة المختارة الجانب المستمر أو التكراري المحتمل في الفعلين، ولا تحوّل الحدث إلى واقعة لحظية محددة على نحو لا تفرضه الصيغة اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت التثنية في «كانا» و«أيديهما» وفق السياق السابق الذي يحدد بطرس ويوحنا، والجمع في «كانوا» عائد إلى الذين وُضعت عليهم الأيدي.
