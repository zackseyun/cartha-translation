  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: ar
  text: فقام ومضى. وإذا برجل حبشي، خصيّ[a]، مسؤول رفيع لدى كنداكة[b] ملكة الحبشيين، وكان مشرفًا على جميع خزائنها، قد جاء إلى أورشليم ليتعبد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تعني الكلمة اليونانية أيضًا «موظفًا في البلاط» في بعض السياقات، لكن معناها الحرفي «خصيّ» هو الأرجح هنا.
    reason: lexical_alternative
  - marker: b
    text: يُحتمل أن تكون «كنداكة» لقبًا سلاليًا للملكة، لا اسمًا شخصيًا.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς ἐπορεύθη
  choice: فقام ومضى
  rationale: يحفظ تعاقب الفعلين في اليونانية بصياغة عربية سردية طبيعية وموجزة.
- source_word: ἰδοὺ
  choice: وإذا بـ
  rationale: أداة عربية فصيحة تلفت الانتباه إلى ظهور الشخصية الجديدة وتحافظ على حيوية السرد دون تكلف.
- source_word: ἀνὴρ Αἰθίοψ
  choice: رجل حبشي
  rationale: يحفظ دلالة ἀνήρ الصريحة على الرجل، ويستعمل «حبشي» بوصفه المقابل العربي التاريخي الطبيعي للمنتمي إلى مملكة كوش الواقعة جنوب مصر، لا للدولة الإثيوبية الحديثة بالضرورة.
- source_word: εὐνοῦχος
  choice: خصيّ
  rationale: هذا هو المعنى الحرفي الأساسي، بينما قد يدل اللفظ في بعض السياقات على موظف في البلاط؛ وقد ذُكر منصبه الرسمي مستقلًا بلفظ δυνάστης.
- source_word: δυνάστης
  choice: من كبار رجال البلاط
  rationale: ينقل مكانته وسلطته الرسمية بوضوح، ويتجنب تكرار «مسؤول» قبل العبارة التي تحدد مسؤوليته عن الخزائن.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: كنداكة ملكة الحبشيين
  rationale: ينقل الاسم كما ورد ويحفظ صيغة جمع اسم الشعب في اليونانية. وتوضح الحاشية أن «كنداكة» قد يكون لقبًا سلاليًا.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: مسؤولًا عن خزائنها كلها
  rationale: يعبر عن الإشراف الإداري الذي تفيده ἐπί، ويترجم γάζα بصيغة الجمع العربية الطبيعية الدالة على الخزانة أو الأموال الملكية.
- source_word: ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ
  choice: قد جاء إلى أورشليم ليسجد
  rationale: «قد جاء» يحفظ سبق المجيء الذي تدل عليه صيغة الماضي التام، و«ليسجد» ينقل فعل العبادة في سياق الحج مع الإبقاء على صورته الحركية الأصلية.
theological_decisions:
- issue: هل يدل εὐνοῦχος على الخصاء الجسدي أم على موظف في البلاط؟
  choice: خصيّ في المتن
  alternative: موظف في البلاط
  rationale: المعنى الحرفي هو الأرجح هنا، كما أن δυνάστης يذكر رتبته الرسمية بالفعل. إبقاء «خصيّ» يصون البعد الاجتماعي والجسدي المحتمل في الرواية، مع التنبيه إلى الاحتمال المعجمي الآخر في الحاشية.
- issue: هل προσκυνέω هنا عبادة عامة أم سجود تعبدي؟
  choice: ليسجد
  alternative: ليتعبد
  rationale: السياق يدل على قصد العبادة في أورشليم، لكن «ليسجد» يحفظ الصورة الأساسية للفعل اليوناني ولا يحدد أكثر مما يحدده النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «وإذا بـ» لإبراز التفاتة السرد، و«أورشليم» اتساقًا مع الاستعمال الكتابي العربي. وُضعت علامتا الحاشيتين بعد الجملة لأن المعلومتين التوضيحيتين تتصلان بلفظين سابقين فيها، مع ورود كلتا العلامتين صراحة في المتن.
