  rationale: صُحّحت دلالة غرض الزيارة من السجود المحدد إلى التعبد، ووُضعت علامتا الحاشية عقب اللفظين اللذين تشرحانهما. كما صيغ وصف δυνάστης بعبارة عربية سلسة تحفظ دلالة المكانة الرسمية من غير تحميل النص تحديدًا زائدًا.
