  source_fidelity: النص ينقل تسلسل الحدث، وتعريف الرجل الحبشي وخصاءه ومنصبه وإشرافه على الخزائن، ووصوله السابق إلى أورشليم. لكن «ليسجد» أضيق من προσκυνήσων في هذا السياق؛ فالمقصود قصد العبادة/التعبد في أورشليم، لا مجرد فعل السجود. كما أن موضعي علامتي الحاشيتين لا يربطان كل حاشية بلفظها المعني.
