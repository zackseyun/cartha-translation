  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: ar
  text: 'فأجاب سمعان: «صلّوا أنتم إلى الرب من أجلي، لكيلا يحلّ بي شيء مما قلتم».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν
  choice: فأجاب سمعان
  rationale: التركيب اليوناني اصطلاحي لإدخال جواب سمعان، وصيغة «فأجاب» عربية طبيعية تجمع معنى الاستجابة والانتقال في السياق من غير تكرار «أجاب وقال».
- source_word: Δεήθητε
  choice: صلّوا
  rationale: فعل أمر يدل هنا على رفع التماس إلى الرب؛ و«صلّوا» أوضح تعبير عربي طبيعي في سياق طلب الشفاعة.
- source_word: ὑμεῖς
  choice: أنتم
  rationale: ذِكر الضمير صراحة في اليونانية يفيد التوكيد، ولذلك أُبقي في العربية للدلالة على أن سمعان يطلب منهم هم أن يصلّوا.
- source_word: ὑπὲρ ἐμοῦ
  choice: من أجلي
  rationale: ينقل معنى النيابة أو التوسل لصالح المتكلم بلغة عربية واضحة.
- source_word: πρὸς τὸν κύριον
  choice: إلى الرب
  rationale: يحافظ على اتجاه الصلاة نحو المخاطَب وعلى لقب κύριος من غير تعيين مرجعه بما يتجاوز النص.
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ
  choice: لكيلا يحلّ بي شيء
  rationale: «يحلّ بي» تعبير عربي فصيح وطبيعي لما ينزل بالمرء، ويحفظ إيحاء وقوع العقوبة أو الشدة.
- source_word: ὧν εἰρήκατε
  choice: مما قلتم
  rationale: صياغة عربية موجزة وطبيعية تحافظ على علاقة الجزء بما سبق أن قاله الرسولان.
theological_decisions:
- issue: مرجع «الرب» (τὸν κύριον)
  choice: الرب
  alternative: الله؛ الرب يسوع
  rationale: النص اليوناني لا يحدد المرجع بأكثر من «الرب»، لذلك تحافظ الترجمة على هذا القدر من التحديد ولا تحسم هل المقصود الله أم الرب يسوع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على توكيد «أنتم» وعلى النبرة الجادة في «يحلّ بي»، من غير إضافة تفسير طائفي أو تحديد غير منصوص عليه لمرجع «الرب».
