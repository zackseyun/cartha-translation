  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: ar
  text: فهبط فيلبس إلى مدينة السامرة[a]، وكان يعلن لهم المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى مدينةٍ في السامرة». يمكن فهم العبارة اليونانية على أنها تشير إما إلى مدينة معيّنة في السامرة، وإما إلى واحدة من مدن إقليم السامرة.'
    reason: alternative_reading
  - marker: b
    text: 'وصياغة أخرى: «إلى المدينة التي في السامرة».'
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: أُديت بوصفها أداة ربط خفيفة تتابع السرد، من غير إقحام معنى زمني صريح مثل «الآن» ولا إبراز مقابلة غير لازمة.
- source_word: κατελθὼν
  choice: نزل
  rationale: حُوِّل اسم الفاعل الماضي إلى فعل سردي عربي طبيعي يسبق الفعل الرئيس، مع الحفاظ على معنى الاتجاه إلى أسفل.
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: مدينة السامرة
  rationale: تحافظ الصياغة على تعريف πόλιν وعلى الإضافة إلى السامرة، مع إبقاء احتمال أن المقصود مدينة بعينها أو مدينة في إقليم السامرة في الحاشية.
- source_word: ἐκήρυσσεν
  choice: أخذ ينادي
  rationale: «ينادي» تنقل معنى الإعلان العلني الذي يحمله κηρύσσω، و«أخذ» مع المضارع تعكس بوضوح نسبي صيغة الماضي الناقص الدالة على نشاط جارٍ أو متكرر.
- source_word: αὐτοῖς
  choice: بينهم
  rationale: تحدد أهل المدينة بوصفهم جمهور النداء، وهي صياغة عربية طبيعية في سياق الإعلان العلني؛ ويمكن من جهة البنية ترجمتها «لهم».
- source_word: τὸν χριστόν
  choice: بالمسيح
  rationale: استُعمل «المسيح» لقبًا لا اسمًا منقولًا صوتيًا، وحرف الباء يلائم الفعل «ينادي» ويحافظ على كون المسيح مضمون الإعلان من غير إضافة تفسير غير مصرح به.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيح بوصفه اسمًا عَلَمًا، أو لقب «الممسوح»
  rationale: السياق سياق إعلان باللقب المسياني؛ لذلك تُبقي «المسيح» الصلة بالخلفية اليهودية ولا تحوّل اللقب إلى اسم عَلَم محض.
- issue: مضمون كرازة فيلبس
  choice: ينادي بالمسيح
  alternative: يعلن لهم أن يسوع هو المسيح
  rationale: لم يُضف اسم يسوع ولا جملة تفسيرية، لأن النص اليوناني يذكر «المسيح» وحده مفعولًا للإعلان، مع أن السياق الأوسع يوضح مرجعه.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُعمل «فيلبس» وفق الصيغة العربية الكتابية الشائعة، وجاءت الجملة سردية طبيعية مع الحفاظ على الالتباس الجغرافي في الأصل وعدم توسيع مضمون الكرازة تفسيريًا.
