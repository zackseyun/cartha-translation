  text: ἄλλοι δὲ ἄλλο τι ⸀ἐπεφώνουν ἐν τῷ ὄχλῳ· μὴ ⸂δυναμένου δὲ αὐτοῦ⸃ γνῶναι τὸ ἀσφαλὲς διὰ τὸν θόρυβον ἐκέλευσεν ἄγεσθαι αὐτὸν εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: ar
  text: وكان بعضٌ من الجمع يصيحون بشيء، وآخرون بشيء آخر. ولما لم يستطع أن يتحقق من حقيقة الأمر[a] بسبب الجلبة، أمر أن يُؤتى به إلى الثكنة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ما هو ثابت» أو «الخبر اليقين».
    reason: lexical_alternative
  - marker: b
    text: تشير «الثكنة» إلى مقر الجنود الرومان، ويرجح أنه كان داخل مجمّع الحصن المتصل بمنطقة الهيكل.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν
  choice: كان بعض... يهتفون بشيء، وآخرون بشيء آخر
  rationale: ينقل التقابل التوزيعي بين ἄλλοι وἄλλο τι، وتفيد صيغة «كانوا يهتفون» استمرار الصياح الذي يدل عليه الماضي الناقص.
- source_word: ἐν τῷ ὄχλῳ
  choice: في الجمع
  rationale: «الجمع» تعبير عربي فصيح ومحايد عن جمهور الناس، من غير أن يضيف معنى العنف الذي قد توحي به ألفاظ مثل «الغوغاء».
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: ولما لم يستطع أن يتحقق
  rationale: ينقل التركيب الظرفي السببي، ويعبّر «يتحقق» عن محاولة معرفة الرواية الموثوقة لا عن مجرد العلم الذهني.
- source_word: τὸ ἀσφαλές
  choice: حقيقة الأمر
  rationale: يشير التعبير إلى ما هو ثابت أو موثوق به وسط الأقوال المتضاربة؛ و«حقيقة الأمر» عربية طبيعية تحفظ هذا المعنى.
- source_word: διὰ τὸν θόρυβον
  choice: بسبب الجلبة
  rationale: «الجلبة» تدل على الضجيج والاضطراب معًا، وهو أنسب من لفظ يقتصر على الصوت وحده.
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: أمر أن يُؤتى به
  rationale: يحفظ المبني للمجهول في المصدر اليوناني ولا يعيّن منفذي الأمر، إذ لم يعيّنهم النص.
- source_word: εἰς τὴν παρεμβολήν
  choice: إلى الثكنة
  rationale: في هذا السياق تدل الكلمة على مقر الجنود الرومان، و«الثكنة» أوضح للقارئ الحديث من «المعسكر» ولا تحصر المعنى في المبنى الدفاعي وحده.
