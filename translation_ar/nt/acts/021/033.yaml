source:
  edition: SBLGNT
  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: ar
  text: فدنا قائد الكتيبة[a]، وأمسك به، وأمر أن يُقيَّد بسلسلتين[b]، وأخذ يسأل مَن يكون وماذا فعل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «قائد ألف»، وهو لقب لضابط عسكري روماني كان يقود كتيبة.'
    reason: lexical_alternative
  - marker: b
    text: قد تذكّر عبارة «بسلسلتين» بالنبوءة في أعمال 21:11 عن تقييد بولس في أورشليم.
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: قائد الكتيبة
  rationale: لقب لضابط روماني يقود عادةً كتيبة عسكرية؛ وهذه الصياغة واضحة وتحفظ رتبته ووظيفته من غير حرفية مضللة مثل «قائد ألف».
- source_word: ἐγγίσας
  choice: دنا
  rationale: اسم الفاعل الماضي يدل على اقترابه قبل أن يمسك ببولس، و«دنا» موجزة وطبيعية في السرد.
- source_word: ἐπελάβετο αὐτοῦ
  choice: أمسك به
  rationale: يدل التعبير على القبض عليه جسديًا، و«أمسك به» يحفظ المعنى من غير زيادة في درجة العنف لا يفرضها اللفظ.
- source_word: ἐκέλευσε δεθῆναι
  choice: أمر أن يُقيَّد
  rationale: تحفظ الصياغة سلطة الأمر وصيغة المبني للمجهول في المصدر اليوناني.
- source_word: ἁλύσεσι δυσί
  choice: بسلسلتين
  rationale: ترجمة مباشرة لعبارة «بسلسلتين»، مع إبقاء الصلة المحتملة بنبوءة أعمال 21:11 في الحاشية.
- source_word: ἐπυνθάνετο
  choice: أخذ يسأل
  rationale: الفعل الناقص يصور سؤالًا جاريًا أو متكررًا وسط الاضطراب، و«أخذ يسأل» ينقل هذا الجانب بصورة عربية طبيعية.
- source_word: τίς εἴη
  choice: مَن يكون
  rationale: ينقل السؤال غير المباشر بعد فعل ماضٍ ويحفظ شيئًا من صيغة الاحتمال في الأسلوب اليوناني من غير تكلف.
- source_word: τί ἐστιν πεποιηκώς
  choice: ماذا فعل
  rationale: التركيب التام يشير إلى فعل منجز ذي صلة بالحاضر؛ والماضي العربي الطبيعي يؤدي المعنى في هذا السؤال غير المباشر.
theological_decisions: []
