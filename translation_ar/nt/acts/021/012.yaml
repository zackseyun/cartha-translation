  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: ar
  text: ولمّا سمعنا هذا، أخذنا نحن وأهل ذلك المكان نرجوه بإلحاح[a] ألّا يصعد إلى أورشليم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نحثّه». يمكن أن يدل الفعل أيضًا على الرجاء الملحّ والتوسل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: ولمّا سمعنا هذا
  rationale: تنقل «لمّا» الظرف الزمني مع التقدّم السردي الخفيف الذي تؤديه δέ، ويشير اسم الإشارة إلى مضمون النبوءة السابقة؛ وجاء المفرد «هذا» طبيعيًا في العربية للدلالة على ذلك المضمون كله.
- source_word: παρεκαλοῦμεν
  choice: أخذنا ... نرجوه بإلحاح
  rationale: يفيد الفعل في هذا السياق الرجاء والحث الجاد، كما أن صيغة الماضي الناقص اليونانية توحي بفعل مستمر أو متكرر؛ فعبارة «أخذنا نرجوه بإلحاح» تنقل الجانبين بوضوح.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: نحن وأهل ذلك المكان
  rationale: 'تحفظ العبارة تمييز الفريقين المشاركين في الرجاء: جماعة الراوي والمقيمين في الموضع، بصياغة عربية طبيعية وفصيحة.'
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: ألّا يصعد
  rationale: تنقل مضمون الرجاء بصيغة مصدرية عربية، مع إبقاء فعل «يصعد» الذي يستعمله النص للسفر إلى أورشليم. والفاعل المستتر يعود إلى بولس كما في السياق.
- source_word: εἰς Ἰερουσαλήμ
  choice: إلى أورشليم
  rationale: صياغة عربية معيارية واضحة لوجهة السفر، مع اعتماد الاسم الكتابي الشائع «أورشليم».
theological_decisions:
- issue: التعبير الاتجاهي عن السفر إلى أورشليم
  choice: يصعد إلى أورشليم
  alternative: يذهب إلى أورشليم
  rationale: يحافظ «يصعد» على ἀναβαίνειν وعلى التعبير الاتجاهي التقليدي المرتبط بالسفر إلى أورشليم، من غير إضافة دلالة لاهوتية غير منصوص عليها.
- issue: درجة الإلحاح في παρακαλέω
  choice: نرجوه بإلحاح
  alternative: نحثّه
  rationale: السياق يحتمل الحث والرجاء الملحّ معًا. اختيرت صياغة تُظهر جدية الالتماس من غير أن تحسمه في معنى التوسل العاطفي وحده، وأُثبت البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «أهل ذلك المكان» بدل تعبير عامي مثل «المحليين»، وحُفظ الاصطلاح الاتجاهي «يصعد إلى أورشليم». تطابق علامة الحاشية [a] موضعها في المتن.
