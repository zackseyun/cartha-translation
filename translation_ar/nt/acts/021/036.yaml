  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: ar
  text: 'لِأَنَّ جُمْهُورَ الشَّعْبِ كَانَ يَتْبَعُهُ وَهُمْ يَصْرُخُونَ: «أَبْعِدْهُ!»[أ]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'أو: «خُذْهُ مِنْ هُنَا!»'
    reason: بديل تعبيري لعبارة Αἶρε αὐτόν التي هي طلب إبعاد الشخص.
lexical_decisions:
- source_word: ἠκολούθει
  choice: كان يتبعهم
  rationale: الماضي الناقص يدل على فعل مستمر في الزمن الماضي، والفاعل المفرد الجمعي هو «جمع الشعب». أُثبت ضمير الجمع بحسب السياق، إذ كان الجمع يتبع الجنود الذين يحملون بولس.
- source_word: γὰρ
  choice: لأنَّ
  rationale: تحفظ الأداة التعليلية التي تفسر سبب حمل الجنود لبولس في الآية السابقة.
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: جمع الشعب
  rationale: صياغة عربية واضحة ومحايدة تحافظ على معنى الجماعة الكثيرة من الشعب، من دون إضافة الدلالة القدحية التي تحملها كلمة «رعاع» أو «غوغاء».
- source_word: κράζοντες
  choice: وهم يصرخون
  rationale: يعبّر التركيب عن الحال المصاحبة للاتباع، ويوافق جمع المعنى في «جمع الشعب».
- source_word: Αἶρε αὐτόν
  choice: تخلَّصوا منه!
  rationale: الأمر هنا طلب عدائي بإزالة بولس، ويرجح في هذا السياق معنى القضاء عليه، كما يظهر من الاستعمال الموازي في أعمال 22:22، لا مجرد نقله إلى مكان آخر.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. روعي استمرار الفعل في «كان يتبع»، وحُمل اسم الجمع على الجمع في الضمائر وفق الاستعمال العربي الطبيعي. لا توجد حاشية لأن البديل الوارد في الطبقة الإنجليزية يتعلق بعبارة Αἶρε αὐτόν لا بالفعل ἠκολούθει، ولأن الصياغة المختارة تنقل القوة السياقية مباشرة.
