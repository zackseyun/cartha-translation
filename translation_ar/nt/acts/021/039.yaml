  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: ar
  text: 'فقال بولس: «أنا رجل يهودي من طرسوس في كيليكية، وهي مدينة ليست بقليلة الشأن، وأنا مواطن فيها. وأرجوك أن تأذن لي بأن أخاطب الشعب».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنا يهودي، طرسوسي من كيليكية، مواطن مدينة ليست بقليلة الشأن».'
    reason: بديل تركيبي يحافظ على ترتيب الأوصاف المتتابعة في اليونانية، ويبرز الانتساب إلى طرسوس ووضع المواطنة.
lexical_decisions:
- source_word: ἄνθρωπος ... Ἰουδαῖος
  choice: رجل يهودي
  rationale: يحافظ على صيغة التعريف المذكرة في اليونانية، ويؤدي هوية بولس اليهودية بعبارة عربية طبيعية وواضحة.
- source_word: Ταρσεὺς τῆς Κιλικίας
  choice: من طرسوس في كيليكية
  rationale: ينقل الانتساب إلى طرسوس وموقعها في كيليكية بوضوح، مع إبقاء لفظ «مواطن» في موضعه التركيبي اللاحق قدر الإمكان.
- source_word: οὐκ ἀσήμου πόλεως
  choice: في مدينة ليست بقليلة الشأن
  rationale: يحفظ أسلوب النفي المراد به الإثبات في الأصل، بدل تسويته إلى «مدينة عظيمة» أو «مهمة».
- source_word: πολίτης
  choice: مواطن
  rationale: يدل على الانتماء أو الوضع المدني، لا على مجرد السكن.
- source_word: δέομαι δέ σου
  choice: وأرجوك
  rationale: ينقل جدية الالتماس بلغة عربية مهذبة وطبيعية دون مبالغة.
- source_word: ἐπίτρεψόν μοι
  choice: أن تأذن لي
  rationale: يلائم طلب الإذن من صاحب سلطة ويحافظ على النبرة الرسمية.
- source_word: λαλῆσαι πρὸς τὸν λαόν
  choice: بأن أخاطب الشعب
  rationale: «أخاطب» طبيعية في سياق إلقاء كلام علني، و«الشعب» تقابل λαός وتحافظ على دلالته الجماعية الأوسع من مجرد «الجمهور».
- source_word: μέν
  choice: غير ممثل بكلمة مستقلة
  rationale: تفيد توكيد التعريف بالنفس، لكن إدخال «حقًا» أو «أما أنا» هنا يثقل العربية؛ يُفهم التوكيد طبيعيًا من بنية العبارة.
theological_decisions:
- issue: دلالة Ἰουδαῖος في تعريف بولس بنفسه
  choice: يهودي
  alternative: يهوديّ الأصل / من اليهودية
  rationale: يسمي بولس هويته اليهودية ثم يذكر طرسوس في كيليكية موطنًا له؛ لذلك لا يصح أن توهم الترجمة أن أصله الجغرافي من إقليم اليهودية.
- issue: علاقة πολίτης بمدينة طرسوس
  choice: مواطن في مدينة ليست بقليلة الشأن
  alternative: طرسوسي من كيليكية، مواطن في مدينة ليست بقليلة الشأن
  rationale: يحافظ النص الرئيسي على معنى المواطنة وعلى وصف المدينة، بينما تبين الحاشية إمكان وصل «مواطن» بطرسوس بصورة أوضح؛ ولا يُحمَّل القول دلالة قانونية تتجاوز ما يثبته السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة تناسب مخاطبة قائد عسكري. حُفظ أسلوب التقليل المنفي في «ليست بقليلة الشأن»، وتُجنبت ألفاظ قديمة مثل «مدينة غير دنيئة» أو تعبيرات تفسيرية توسع معنى المواطنة.
