  to: 'فقال بولس: «أنا رجل يهودي من طرسوس في كيليكية، وهي مدينة ليست بقليلة الشأن، وأنا مواطن فيها. وأرجوك أن تأذن لي بأن أخاطب الشعب».[a]'
