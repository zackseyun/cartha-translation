    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: في الحال
  rationale: تعبير عربي فصيح وواضح ينقل معنى المبادرة الفورية.
- source_word: παραλαβὼν
  choice: أخذ
  rationale: يفيد هنا اصطحاب الجنود والقادة معه، ويظل موجزًا وطبيعيًا في السياق.
- source_word: στρατιώτας
  choice: جنودًا
  rationale: المقابل المباشر والدقيق لأفراد القوة العسكرية.
- source_word: ἑκατοντάρχας
  choice: قادةَ مئات
  rationale: ينقل اللقب العسكري الروماني بصورة مفهومة ويحافظ على دلالته العددية التاريخية.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: أسرع نازلًا إليهم
  rationale: يحفظ سرعة الحركة واتجاهها إلى أسفل من موضع القلعة، من غير أن يضيف دلالة هجومية غير لازمة.
- source_word: χιλίαρχον
  choice: قائدَ الكتيبة
  rationale: يعبّر بوضوح عن الضابط الروماني الذي كان يقود كتيبة، وهو أوضح للقارئ العربي من نقل اللقب الأجنبي صوتيًا.
- source_word: ἐπαύσαντο
  choice: كفّوا
  rationale: فعل عربي طبيعي يدل على توقفهم عن الفعل الجاري.
- source_word: τύπτοντες
  choice: عن ضرب
  rationale: ينقل الضرب المتكرر المستمر الذي يدل عليه اسم الفاعل في السياق.
