base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: ar
  text: 'وهم يصرخون: «يا رجال إسرائيل، أعينوا! هذا هو الرجل الذي يعلِّم الجميع في كل مكان بما يناوئ الشعب والشريعة وهذا الموضع. وفوق ذلك، أدخل أيضًا يونانيين إلى الهيكل[a]، ودنَّس هذا الموضع المقدس».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير الكلمة اليونانية ἱερόν إلى مجمّع الهيكل أو ساحاته، لا إلى المقام الداخلي على وجه التحديد.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζοντες
  choice: صارخين
  rationale: اسم فاعل حالي يبيّن هيئة توجيه الاتهام، و«صارخين» فصيحة وطبيعية وتحفظ شدة النداء العلني.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: يا رجال إسرائيل
  rationale: نداء موجَّه إلى رجال من إسرائيل؛ الصياغة العربية طبيعية وتحفظ التذكير الصريح في الأصل.
- source_word: βοηθεῖτε
  choice: أعينوا!
  rationale: فعل أمر مطلق لطلب النجدة، من غير إضافة مفعول مثل «أعينونا» لا يصرّح به النص اليوناني.
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: هذا هو الرجل
  rationale: يحفظ صيغة التعريف والإشارة وقوة الاتهام المباشر.
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: الذي يعلِّم ... تعاليم ضد الشعب والشريعة وهذا الموضع
  rationale: κατά مع المضاف إليه تدل على المعارضة. أُضيفت «تعاليم» بوصفها مفعولًا داخليًا مفهومًا لتستقيم العربية مع «يعلّم»، من دون تحديد مضمون غير موجود في الأصل.
- source_word: πάντας πανταχῇ διδάσκων
  choice: يعلِّم الجميع في كل مكان
  rationale: يحفظ التعميم المزدوج في πάντας وπανταχῇ بصياغة عربية واضحة.
- source_word: ἔτι τε καὶ
  choice: وفوق ذلك ... أيضًا
  rationale: تنقل القوة التراكمية للاتهام الإضافي في العبارة اليونانية.
- source_word: Ἕλληνας
  choice: يونانيين
  rationale: المعنى المعجمي المباشر هو اليونانيون، لا «الأمم» على وجه العموم.
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: أدخل ... إلى الهيكل[a]
  rationale: الفعل يدل على الإدخال، وἱερόν يشير إلى مجمّع الهيكل وساحاته؛ استُعمل اللفظ العربي المألوف في المتن مع إيضاح دلالته في الحاشية.
- source_word: κεκοίνωκεν
  choice: دنَّس
  rationale: في السياق الشعائري يدل κοινόω على جعل الشيء نجسًا أو غير مقدس، و«دنّس» أوضح مقابل عربي هنا.
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: هذا الموضع المقدس
  rationale: يحفظ الإشارة المباشرة ووصف الموضع بالقداسة.
theological_decisions:
- issue: مرجع τοῦ νόμου
  choice: الشريعة
  alternative: الناموس؛ القانون
  rationale: في سياق أورشليم والهيكل، المرجع هو شريعة موسى لا القانون بمعناه العام. «الشريعة» واضحة في العربية المعاصرة من غير إدخال تمييز مذهبي.
- issue: دلالة ἱερόν
  choice: الهيكل في المتن، مع حاشية توضّح أنه مجمّع الهيكل أو ساحاته
  alternative: ساحات الهيكل؛ حرم الهيكل
  rationale: «الهيكل» هو التعبير العربي الطبيعي الموجز، لكن ἱερόν أوسع من المقدس الداخلي، ولذلك حُفظ الفرق المعجمي في الحاشية.
- issue: طبيعة الكلام بوصفه اتهامًا
  choice: الإبقاء على صيغة التقرير المباشر بلا تصديق سردي للادعاء
  alternative: إضافة «زاعمين» أو «بحسب قولهم»
  rationale: النص ينقل صراخ المتهمين مباشرة، ولا يقتضي أن يبتّ المترجم في صحة الاتهام أو يضيف توصيفًا تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أعينوا» بدل «ساعدوا» للمحافظة على نبرة الاستغاثة العلنية، و«الشريعة» لتوضيح المرجع الموسوي في السياق. وُضع مؤشر الحاشية بعد «الهيكل»، وهو الموضع الذي تتعلق به المعلومة المعجمية.
