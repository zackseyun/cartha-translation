  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: ar
  text: ولمّا أبصرنا قبرص وتركناها عن يسارنا[a]، واصلنا الإبحار إلى سورية، ونزلنا إلى صور[b]، لأن السفينة كانت تفرغ حمولتها هناك[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي إن قبرص بقيت عن الجانب الأيسر للسفينة وهم يبحرون.
    reason: cultural_note
  - marker: b
    text: 'أو: «وصلنا إلى صور». واليونانية حرفيًا: «نزلنا إلى صور».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «كانت تُفرَّغ من حمولتها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: ولمّا أبصرنا قبرص
  rationale: يفيد اسم الفاعل الأوريستي فعلًا سابقًا للإبحار، والفعل هنا يدل في سياق الرحلة البحرية على ظهور الجزيرة للعيان أو إبصارها. «ولمّا أبصرنا» صياغة عربية طبيعية وموجزة.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: وتركناها عن يسارنا
  rationale: εὐώνυμον تعني حرفيًا «عن اليسار». تحافظ العبارة على الصورة الملاحية من غير استعمال مصطلح بحري تقني قد لا يعرفه عموم القراء.
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: واصلنا الإبحار إلى سورية
  rationale: الماضي الناقص ἐπλέομεν يصور استمرار الرحلة؛ و«واصلنا الإبحار» ينقل هذا الجانب بوضوح وطبيعية.
- source_word: κατήλθομεν εἰς Τύρον
  choice: نزلنا إلى صور
  rationale: تحافظ «نزلنا إلى» على الدلالة الاتجاهية للفعل κατέρχομαι وعلى أسلوب لوقا، مع أن المقصود في السياق هو الوصول إلى صور.
- source_word: ἐκεῖσε
  choice: هناك
  rationale: يعود الظرف إلى صور ويبين أنها موضع تفريغ الحمولة؛ و«هناك» هو المقابل العربي الطبيعي.
- source_word: ἀποφορτιζόμενον
  choice: كانت تفرغ
  rationale: الصيغة الوسطى/المبنية للمجهول تحتمل أن السفينة كانت تفرغ حمولتها أو كانت تُفرَّغ. اختير التعبير الفاعل لأنه عربي طبيعي مع السفينة، مع إثبات الاحتمال الآخر في الحاشية.
- source_word: τὸν γόμον
  choice: حمولتها
  rationale: γόμος هي حمولة السفينة أو بضاعتها المشحونة. والضمير يوضح العلاقة بالسفينة التي يدل عليها السياق اليوناني.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على التعبير الاتجاهي «نزلنا إلى صور»، وعلى صورة ترك قبرص عن اليسار، مع شرح ما قد يلتبس في الحواشي. لم تُضف حاشية مستقلة لـἀναφάναντες لأن «أبصرنا» تنقل المعنى بوضوح، بخلاف الحاشية الإنجليزية التي بدا نصها غير مطابق لموضع علامتها.
