id: ACT.21.11
reference: Acts 21:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: ar
  text: 'وجاء إلينا، وأخذ حزام بولس، وربط قدميه ويديه هو، وقال: «هكذا يقول الروح القدس[b]: هكذا سيربط اليهود في أورشليم الرجل الذي له هذا الحزام[a]، ويسلّمونه إلى أيدي الأمم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أقرب إلى اللفظ: «الرجل الذي هذا حزامه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «هذا ما يقوله الروح القدس».'
    reason: alternative_reading
lexical_decisions:
- source_word: ζώνην
  choice: حزام
  rationale: يدل اللفظ على حزام أو نطاق يُلبس حول الخصر، و«حزام» أوضح مقابل عربي معاصر في هذا السياق.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: ربط قدميه ويديه
  rationale: ضمائر الغائب العربية تعود طبيعيًا إلى الفاعل، أي أغابوس، فتحفظ دلالة الضمير الانعكاسي من غير تركيب متكلف، كما أن «ربط» تلائم الفعل الرمزي النبوي وتنسجم مع الفعل المستقبل لاحقًا.
- source_word: Τάδε λέγει
  choice: هكذا يقول
  rationale: صيغة نبوية مألوفة تحفظ نبرة الإعلان الرسمي في الأصل، مع إمكان التعبير المعاصر المذكور في الحاشية.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: هو التعبير العربي القياسي الواضح الموافق للاسم الوارد في النص.
- source_word: Τὸν ἄνδρα
  choice: الرجل
  rationale: يحافظ على التحديد في اليونانية وعلى الإشارة إلى رجل بعينه، وهو بولس، من غير إدخال اسمه داخل النبوءة.
- source_word: οὗ ἐστιν ἡ ζώνη αὕτη
  choice: الذي له هذا الحزام
  rationale: تعبير عربي طبيعي يحفظ علاقة الملكية التي يؤديها ضمير الوصل في اليونانية.
- source_word: οὕτως
  choice: هكذا
  rationale: يربط طريقة الربط المتنبأ بها بالفعل الرمزي الذي قام به أغابوس.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: ينقل اللفظ كما ورد من غير تضييقه إلى القادة اليهود أو تحويله إلى تسمية جغرافية غير لازمة.
- source_word: παραδώσουσιν
  choice: يسلّمونه
  rationale: ينقل معنى وضعه في سلطة طرف آخر، وهو مقابل عربي طبيعي في هذا السياق.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: إلى أيدي الأمم
  rationale: يحفظ صورة «الأيدي» الكتابية الدالة على الوقوع تحت السلطة، ويعبّر «الأمم» هنا عن غير اليهود بحسب السياق.
theological_decisions:
- issue: صيغة الإعلان النبوي بوصفه كلامًا صادرًا عن الروح القدس
  choice: هكذا يقول الروح القدس
  alternative: هذا ما يقوله الروح القدس
  rationale: يحفظ الاختيار الصيغة النبوية المهيبة في الأصل وإسناد القول مباشرة إلى الروح القدس، من غير إضافة تفسير عقائدي.
- issue: مرجع الضمير الانعكاسي ἑαυτοῦ
  choice: أغابوس ربط قدميه ويديه هو
  alternative: أغابوس ربط قدمي بولس ويديه
  rationale: يعود الضمير الانعكاسي في اليونانية طبيعيًا إلى فاعل اسم الفاعل، أي أغابوس، ولذلك يصف النص فعلًا رمزيًا ربط فيه أغابوس نفسه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظ ترتيب «قدميه ويديه» الوارد في اليونانية، كما حُفظت صورة التسليم «إلى أيدي الأمم». وُضع كل رمز حاشية عند العبارة التي يشرحها مباشرة.
