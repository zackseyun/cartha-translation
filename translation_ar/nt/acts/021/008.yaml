  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: ar
  text: وفي اليوم التالي انطلقنا ووصلنا إلى قيصرية، ثم دخلنا بيت فيلبس المبشِّر، وهو أحد السبعة[a]، وأقمنا عنده.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي واحد من الرجال السبعة الذين عُيِّنوا سابقًا للخدمة في أورشليم (انظر أعمال 6: 3–6).'
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: وفي اليوم التالي
  rationale: تعبير زمني طبيعي يحفظ تتابع السرد، وتؤدي الواو وظيفة δέ الانتقالية من غير مبالغة في ترجمتها.
- source_word: ἐξελθόντες
  choice: انطلقنا
  rationale: السياق سياق سفر ومغادرة للمكان السابق؛ و«انطلقنا» عربية طبيعية تؤدي معنى الخروج للشروع في الرحلة.
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: وصلنا إلى قيصرية
  rationale: يفيد التركيب بلوغ مقصد الرحلة، و«وصلنا إلى» أوضح في العربية المعاصرة من النقل الحرفي «أتينا إلى».
- source_word: Καισάρειαν
  choice: قيصرية
  rationale: الصيغة العربية المستقرة لاسم المدينة، من غير إضافة وصف جغرافي لا يرد في النص.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: ثم دخلنا بيت
  rationale: يحفظ ترتيب الأحداث، وتوضح «ثم» التعاقب الذي تحمله الصيغة الحالية في هذا السياق، مع إبقاء οἶκος بمعنى البيت.
- source_word: Φιλίππου
  choice: فيلبس
  rationale: الصيغة العربية الكتابية الشائعة للاسم اليوناني.
- source_word: τοῦ εὐαγγελιστοῦ
  choice: المبشِّر
  rationale: ترجمة موجزة ومفهومة للقب εὐαγγελιστής، وتدل على من يعلن البشارة من غير إضافة توصيف كنسي لا يصرح به النص.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: وهو أحد السبعة
  rationale: صياغة عربية طبيعية تحفظ الإشارة التاريخية إلى الجماعة المعروفة من السياق، من غير تحويلها إلى اسم منصب فني.
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: وأقمنا عنده
  rationale: في سياق السفر والضيافة، تفيد «أقمنا عنده» المكوث في ضيافته بعبارة عربية واضحة.
theological_decisions:
- issue: تحديد المقصود بكون فيلبس «أحد السبعة»
  choice: الإبقاء على العبارة التاريخية «أحد السبعة» مع إيضاح مرجعها في حاشية فقط.
  alternative: تفسير العبارة في المتن بأنه «أحد الشمامسة السبعة» أو جعل «السبعة» لقبًا وظيفيًا رسميًا.
  rationale: يلمح النص إلى الرجال السبعة المذكورين سابقًا في أعمال 6، لكنه لا يسمي هنا منصبًا كنسيًا بعينه؛ لذلك لا تُستورد دلالة مؤسسية لاحقة إلى المتن.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدمت أفعال سفر طبيعية، وحُفظ لقب فيلبس والإشارة الموجزة إلى «السبعة» من غير توسع عقائدي. وُضع مؤشر الحاشية بعد «السبعة» لأنه الموضع الذي تشرحه الحاشية.
