  text: ἐπιμενόντων ⸀δὲ ἡμέρας πλείους κατῆλθέν τις ἀπὸ τῆς Ἰουδαίας προφήτης ὀνόματι Ἅγαβος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/010.yaml
  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: ar
  text: وبينما كنا نقيم هناك أيامًا أخرى، نزل من اليهودية نبيٌّ اسمه أغابوس.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: بينما كنا نقيم هناك
  rationale: اسم فاعل مضارع في تركيب المضاف إليه المطلق ذو دلالة زمنية. والفاعل المفهوم من سياق مقاطع «نحن» هو بولس ورفاقه، فصيغ الجمع المتكلم طبيعية في العربية.
- source_word: δὲ
  choice: بينما
  rationale: أُدمج الانتقال الخطابي الخفيف الذي تدل عليه δέ في أداة الربط الزمنية، بما يلائم تركيب الجملة العربية من غير إثقالها بحرف عطف زائد.
- source_word: ἡμέρας πλείους
  choice: أيامًا أخرى
  rationale: العبارة في حالة النصب للدلالة على امتداد الزمن، وπλείους تفيد حرفيًا أيامًا إضافية أو أكثر. «أيامًا أخرى» تحفظ هذا المعنى المقارن أدق من تعميمه إلى «عدة أيام».
- source_word: κατῆλθέν
  choice: نزل
  rationale: يحفظ الفعل صورة الاتجاه إلى أسفل الواردة في κατέρχομαι، وهي ملائمة للانتقال من اليهودية إلى الساحل.
- source_word: τις
  choice: نبيٌّ
  rationale: ضمير التنكير يقدّم شخصًا جديدًا؛ ويؤدي تنوين «نبيٌّ» معنى التنكير طبيعيًا من غير الحاجة إلى «رجل ما» أو «نبي معين».
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: من اليهودية
  rationale: ترجمة مباشرة لعبارة المصدر الجغرافي، مع استعمال الاسم العربي المألوف للإقليم.
- source_word: προφήτης
  choice: نبيٌّ
  rationale: المقابل العربي المباشر والدقيق للدور الذي ينسبه السرد إلى أغابوس.
- source_word: ὀνόματι Ἅγαβος
  choice: اسمه أغابوس
  rationale: صياغة عربية طبيعية للتعبير الاصطلاحي الذي يعني «المسمّى أغابوس»، مع الحفاظ على تعريف الشخصية باسمها.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة، مع الحفاظ على التركيب الزمني وصورة النزول الجغرافية. اختيرت «أيامًا أخرى» لإبقاء الدلالة الأصلية المحتملة على مدة إضافية بدل تسويتها إلى «عدة أيام».
