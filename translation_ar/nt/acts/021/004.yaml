  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: ar
  text: وبعد أن وجدنا التلاميذ، أقمنا هناك سبعة أيام. وكانوا يقولون لبولس، بواسطة الروح[a]، ألا يصعد إلى أورشليم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تدل العبارة أيضًا على أن الروح كشف للتلاميذ ما سيلاقيه بولس من آلام، فاستنتجوا من ذلك أنه ينبغي ألا يواصل طريقه إلى أورشليم.
    reason: إيضاح احتمال تفسيري يحفظ التوتر بين صياغة هذه الآية وما يرد عن اقتياد الروح لبولس في سياقات قريبة.
lexical_decisions:
- source_word: ἀνευρόντες
  choice: بعد أن وجدنا
  rationale: اسم فعل ماضٍ يدل على حدث سبق الفعل الرئيس؛ وهذه الصياغة طبيعية وتحفظ تتابع الحدثين.
- source_word: τοὺς μαθητάς
  choice: التلاميذ
  rationale: المقابل العربي المألوف في سفر الأعمال، ويحفظ دلالة μαθητής دون توسيعها إلى «المؤمنين».
- source_word: ἐπεμείναμεν αὐτοῦ
  choice: أقمنا هناك
  rationale: ἐπιμένω هنا بمعنى البقاء أو الإقامة، وαὐτοῦ ظرف مكان بمعنى «هناك».
- source_word: ἡμέρας ἑπτά
  choice: سبعة أيام
  rationale: مفعول فيه يدل على امتداد الزمن، وتؤديه العربية بوضوح من غير حاجة إلى إضافة.
- source_word: οἵτινες ... ἔλεγον
  choice: وكانوا يقولون
  rationale: الضمير يعود إلى التلاميذ، والماضي الناقص يفيد الاستمرار أو التكرار؛ وصيغة «كانوا يقولون» تحفظ ذلك بلا مبالغة.
- source_word: διὰ τοῦ πνεύματος
  choice: بالروح
  rationale: تحفظ دلالة الوساطة أو الفاعلية في العبارة اليونانية، ولا تضيف وصف «القدس» غير المذكور صراحة، مع وضوح المرجع في السياق.
- source_word: μὴ ἐπιβαίνειν εἰς Ἱεροσόλυμα
  choice: ألا يصعد إلى أورشليم
  rationale: مع مقصد هو أورشليم، يدل الفعل على التوجه إليها، و«يصعد» يحفظ التعبير الاتجاهي الكتابي المألوف.
theological_decisions:
- issue: صلة عبارة διὰ τοῦ πνεύματος بمنع بولس من متابعة الرحلة
  choice: كانوا يقولون لبولس بالروح ألا يصعد
  alternative: كشف لهم الروح ما ينتظر بولس، فاستنتجوا هم أنه ينبغي ألا يصعد
  rationale: النص ينسب قولهم إلى الروح، لكنه لا يشرح بدقة هل كان النهي نفسه وحيًا مباشرًا أم استنتاجًا بشريًا من كشف روحي عن الآلام المقبلة. أبقينا العبارة وتوترها مع أعمال 19:21 و20:22-23 دون حسم تفسيري داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «أورشليم» اتساقًا مع الاسم الكتابي الشائع، و«بالروح» لصياغة موجزة قريبة من الأصل. وُضع مؤشر الحاشية بعد الجملة التي تتناول موضع الاحتمال التفسيري.
