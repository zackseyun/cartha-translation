  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: ar
  text: ولمّا حان أن نُتمّ تلك الأيام، خرجنا ومضينا في طريقنا، وكانوا جميعًا، مع زوجاتهم وأولادهم، يرافقوننا إلى خارج المدينة[a]. ثم جثونا على ركبنا على الشاطئ[b] وصلّينا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يشيّعوننا». يمكن أن يدل الفعل اليوناني على مرافقة شخص عند رحيله بقصد توديعه.
    reason: lexical_alternative
  - marker: b
    text: أو «على الساحل» أو «عند شاطئ البحر».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ ἐγένετο ἐξαρτίσαι ἡμᾶς τὰς ἡμέρας
  choice: ولمّا حان أن نُتمّ تلك الأيام
  rationale: تنقل العبارة مجيء الوقت المحدد لإتمام مدة الإقامة، وتحافظ على الإشارة الملموسة في «تلك الأيام» من غير تفكيك غير طبيعي للأسلوب العربي.
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: خرجنا ومضينا في طريقنا
  rationale: 'تحفظ الفعلين: الخروج أولًا، ثم مواصلة السير، وتصوغ صيغة اسم الفاعل مع الفعل الناقص اليونانيين في سرد عربي طبيعي.'
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: وكانوا جميعًا ... يرافقوننا
  rationale: يفيد الفعل مرافقة المسافر عند انطلاقه بقصد توديعه. و«يرافقوننا» تحافظ على صورة سيرهم معهم، مع إثبات «يشيّعوننا» بديلًا في الحاشية.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: مع زوجاتهم وأولادهم
  rationale: لأن «الجميع» يعود في السياق إلى جماعة من الرجال خرجت معهم أسرهم، فمعنى «زوجات» هو الأرجح هنا. وإضافة الضمائر تجعل العلاقة الأسرية واضحة وطبيعية بالعربية من غير تغيير المقصود.
- source_word: ἕως ἔξω τῆς πόλεως
  choice: إلى خارج المدينة
  rationale: تنقل بلوغ المرافقين موضعًا وراء حدود المدينة، من غير تحويل العبارة إلى «ضواحي المدينة» التي قد توحي بمكان مختلف.
- source_word: θέντες τὰ γόνατα
  choice: جثونا على ركبنا
  rationale: هذا هو المقابل العربي الاصطلاحي الطبيعي لوضع الركب، ويحفظ هيئة الصلاة والفعل السابق لها.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: على الشاطئ
  rationale: «الشاطئ» لفظ عربي واضح ومباشر للمكان الملاصق للبحر، مع ذكر «الساحل» بوصفه بديلًا ممكنًا.
- source_word: προσευξάμενοι
  choice: وصلّينا
  rationale: يحيل اسم الفاعل الجمع إلى المتكلمين في سياق رحلة «نحن»، وتحويله إلى فعل معطوف يقدّم تسلسل الحدث بوضوح في العربية.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُخدم «جثونا على ركبنا» بدل النقل الحرفي الجامد، وحُفظ تتابع الخروج والسير والمرافقة والركوع والصلاة. وُضع رمز الحاشية [a] عند اللفظ الذي تشرحه، لا بعد «تلك الأيام»، لأن الحاشية تخص προπέμπω.
