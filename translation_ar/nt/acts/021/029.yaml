  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: ar
  text: فقد كانوا قد رأوا من قبل تروفيموس الأفسسي مع بولس في المدينة، فظنوا أن بولس أدخله إلى الهيكل[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تستعمل اليونانية هنا لفظة قد تشير إلى مجمّع الهيكل أو ساحاته، لا إلى المقدس الداخلي وحده بالضرورة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ... προεωρακότες
  choice: كانوا قد رأوا من قبل
  rationale: ينقل التركيب المحيطي معنى وقوع الرؤية قبل الحدث المذكور، بصياغة عربية واضحة وطبيعية.
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: تروفيموس الأفسسي
  rationale: يحافظ على البدل الوصفي الذي يعرّف تروفيموس بانتمائه إلى أفسس.
- source_word: ἐν τῇ πόλει σὺν αὐτῷ
  choice: معه في المدينة
  rationale: صياغة عربية طبيعية، والضمير يعود بحسب السياق إلى بولس.
- source_word: ἐνόμιζον
  choice: فظنوا
  rationale: يفيد استنتاجًا غير متيقَّن قائمًا على ما رأوه، من غير الجزم بصحة الاتهام.
- source_word: εἰς τὸ ἱερὸν
  choice: إلى الهيكل
  rationale: «الهيكل» هو التعبير العربي المألوف، مع توضيح في الحاشية أن ἱερόν قد يدل على مجمّع الهيكل أو ساحاته، لا على المقدس الداخلي وحده.
- source_word: εἰσήγαγεν
  choice: أدخله
  rationale: ينقل الفعل بإيجاز ودقة، ويعبّر عن إدخال الشخص إلى النطاق المقدس المقصود.
theological_decisions:
- issue: دلالة ἱερόν في سياق الاتهام الموجَّه إلى بولس
  choice: الهيكل، مع حاشية توضّح اتساع مدلول اللفظة اليونانية
  alternative: ساحات الهيكل / حرم الهيكل
  rationale: يحافظ النص الرئيس على التعبير العربي المألوف، بينما تصون الحاشية الدقة التاريخية والمعجمية من غير حصر اللفظة في المقدس الداخلي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُعملت «فقد» لبيان التعليل في γάρ، و«فظنوا» لإبراز أن الاتهام كان استنتاجًا لا واقعة ثابتة.
