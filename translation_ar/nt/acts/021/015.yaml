lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: وبعد تلك الأيام
  rationale: تفيد «μετά» مع النصب التعاقب الزمني. وصيغة «تلك الأيام» طبيعية في العربية وتحيل إلى المدة المذكورة قبلًا، من غير إضافة معنى انقضاء الأيام صراحة.
- source_word: ἐπισκευασάμενοι
  choice: تجهّزنا
  rationale: يدل اسم الفاعل اليوناني على الاستعداد أو تجهيز النفس للرحلة، وقد يشمل حزم الأمتعة من غير أن يقتصر عليه؛ لذلك تحفظ «تجهّزنا» سعة الدلالة الأصلية.
- source_word: ἀνεβαίνομεν
  choice: صعدنا
  rationale: الماضي الناقص يروي حركة السفر في الزمن الماضي، و«صعدنا» يحفظ اتجاه الحركة والتعبير المألوف عن الذهاب إلى أورشليم.
- source_word: εἰς Ἱεροσόλυμα
  choice: إلى أورشليم
  rationale: تفيد «εἰς» الحركة باتجاه المدينة، و«إلى» هي الصياغة العربية الطبيعية في هذا السياق.
