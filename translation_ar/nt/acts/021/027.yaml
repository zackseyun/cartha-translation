  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: ar
  text: ولمّا أوشكت الأيام السبعة أن تتم، رآه اليهود القادمون من آسيا في الهيكل[a]، فأهاجوا الجمع كله[b] وأمسكوا به[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود بـ«الهيكل» هنا مجمّع الهيكل أو ساحاته، لا المبنى الداخلي المقدس وحده.
    reason: cultural_note
  - marker: b
    text: أو «أوقعوا الجمع كله في الارتباك». قد يدل الفعل اليوناني على تهييج الجمع أو إرباكه وإدخاله في الفوضى.
    reason: lexical_alternative
  - marker: c
    text: أو «قبضوا عليه». والتعبير اليوناني حرفيًا «ألقوا أيديهم عليه»، وهو اصطلاح يفيد الإمساك بشخص بالقوة.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: ولمّا أوشكت الأيام السبعة أن تتم
  rationale: تنقل «أوشكت» دلالة μέλλω على قرب وقوع الحدث، وتحفظ «أن تتم» معنى بلوغ الأيام نهايتها في συντελεῖσθαι، من غير إضافة تفسير لطبيعة هذه المدة.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: اليهود القادمون من آسيا
  rationale: تبيّن العبارة جهة قدومهم بلغة عربية طبيعية، والمقصود بآسيا هنا الولاية الرومانية المعروفة بهذا الاسم، لا القارة بمفهومها الحديث.
- source_word: θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ
  choice: رآه ... في الهيكل
  rationale: حُوّل اسم الفاعل اليوناني إلى جملة فعلية عربية واضحة، وتُرجم ἱερόν بـ«الهيكل» مع إيضاح نطاق اللفظ في الحاشية.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: فأهاجوا الجمع كله
  rationale: تعبر «أهاجوا» عن تحريك الجمع وإثارته، مع إبقاء معنى الإرباك أو إدخال الاضطراب بديلًا مشروعًا في الحاشية بسبب اتساع دلالة الفعل اليوناني.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: وأمسكوا به
  rationale: تنقل العبارة العربية المعنى السياقي للتعبير الاصطلاحي اليوناني، أي الإمساك القسري بشخص، من غير صياغة حرفية ثقيلة أو إيحاء غير مقصود بالضرب.
