  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: ar
  text: أما نحن، فبعد أن أتممنا رحلتنا البحرية من صور، وصلنا إلى بتولمايس، وبعد أن سلَّمنا على الإخوة[a] أقمنا عندهم يومًا واحدًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات»؛ فاليونانية تقول «الإخوة»، وهي صيغة جمع مذكر قد تشير على نحو أوسع إلى جماعة المؤمنين.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: وأما نحن
  rationale: يحفظ الضمير الصريح وانتقال السرد الذي تفيده δέ، بصياغة عربية واضحة غير مثقلة.
- source_word: τὸν πλοῦν διανύσαντες
  choice: فأتممنا الرحلة البحرية
  rationale: ينقل معنى إكمال مسافة الإبحار، مع تحويل التركيب الاشتقاقي اليوناني إلى فعل عربي طبيعي.
- source_word: ἀπὸ Τύρου
  choice: من صور
  rationale: تنقل ἀπό نقطة انطلاق الرحلة مباشرة، و«صور» هو الاسم العربي المعروف للمدينة.
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: ووصلنا إلى بتولمايس
  rationale: «وصلنا إلى» تعبير عربي طبيعي ودقيق عن بلوغ الوجهة.
- source_word: ἀσπασάμενοι
  choice: بعد أن سلَّمنا على
  rationale: يعبر عن التحية بوصفها فعلًا سابقًا للإقامة، ويحافظ على ترتيب الحدثين.
- source_word: τοὺς ἀδελφοὺς
  choice: الإخوة
  rationale: يحفظ صيغة الجمع المذكر في اليونانية واستعمالها الجماعي بين المؤمنين، مع بيان احتمال الشمول في الحاشية.
- source_word: ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς
  choice: أقمنا عندهم يومًا واحدًا
  rationale: «أقمنا عندهم» ينقل معنى البقاء في ضيافتهم أو صحبتهم، و«يومًا واحدًا» يوضح مدة الإقامة.
theological_decisions:
- issue: دلالة τοὺς ἀδελφοὺς في سياق الجماعة المسيحية
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: النص اليوناني يستعمل جمعًا مذكرًا قد يدل في هذا السياق على جماعة المؤمنين عمومًا، وربما شمل النساء. أُبقيت الصيغة الظاهرة في المتن، وحُفظ الاحتمال الأوسع في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أتممنا الرحلة البحرية» بدل محاكاة التركيب الاشتقاقي اليوناني، وحُفظ تسلسل الرحلة والوصول والتحية والإقامة.
