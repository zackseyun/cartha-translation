  - severity: low
    issue: «ساحة الهيكل» أضيق من دلالة ἱερόν.
    rationale: ἱερόν يدل على مجمّع الهيكل أو باحاته، لا على ساحة واحدة. «باحات الهيكل» تحافظ على اتساع الدلالة مع بقاء العبارة عربية مألوفة.
  - severity: low
