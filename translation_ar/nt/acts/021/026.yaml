revisions:
- from: حينئذ أخذ بولس الرجال معه، وفي اليوم التالي تطهَّر معهم، ودخل ساحة الهيكل[a]، معلنًا موعد اكتمال أيام التطهير، إلى أن يُقدَّم القربان عن كل واحد منهم.
  to: حينئذ أخذ بولس الرجال معه، وفي اليوم التالي تطهَّر معهم، ودخل باحات الهيكل[a]، مُعلِنًا إتمامَ أيام التطهير، إلى أن تُقدَّم التقدمة عن كل واحد منهم.
  rationale: حُذفت الإضافة التفسيرية «موعد»، وعُدِّلت ترجمة نطاق الهيكل لتشمل باحاته، واستُخدمت «التقدمة» كمقابل عام ودقيق للفظ الطقسي اليوناني. أبقيت «دخل» لأن العربية السردية تقبله هنا من غير فرض تحليل محدد لدلالة الماضي الناقص اليوناني، وأبقيت البناء للمجهول في «تُقدَّم».
