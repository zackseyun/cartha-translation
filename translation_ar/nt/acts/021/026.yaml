language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: ar
  text: حينئذ أخذ بولس الرجال معه، وفي اليوم التالي تطهَّر معهم، ودخل باحات الهيكل[a]، مُعلِنًا إتمامَ أيام التطهير، إلى أن تُقدَّم التقدمة عن كل واحد منهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الهيكل»؛ فاللفظ اليوناني يشير إلى مجمّع الهيكل وباحاته، لا إلى المقدس الداخلي وحده.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν τοὺς ἄνδρας
  choice: أخذ بولس الرجال معه
  rationale: يفيد الفعل أن بولس اصطحب الرجال؛ وإضافة «معه» تُظهر معنى المصاحبة طبيعيًا في العربية.
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: في اليوم التالي
  rationale: تعبير عربي واضح وطبيعي عن اليوم الذي أعقب ذلك مباشرة.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: تطهَّر معهم
  rationale: ينقل معنى التطهير الطقسي مع إبقاء بولس مشاركًا لهم فيه، من غير شرح زائد.
- source_word: εἰσῄει
  choice: دخل
  rationale: مع أن الفعل في صيغة الماضي الناقص اليوناني وقد يحتمل معنى الاستمرار أو التكرار، فإن «دخل» أنسب للسرد العربي، ولا يفرض تحديدًا غير لازم لطبيعة الحدث.
- source_word: τὸ ἱερόν
  choice: ساحة الهيكل
  rationale: ἱερόν يدل على مجمّع الهيكل أو رحابه، لا على المقدس الداخلي تحديدًا؛ و«ساحة الهيكل» واضحة في السياق، مع بيان اتساع الدلالة في الحاشية.
- source_word: διαγγέλλων
  choice: معلنًا
  rationale: يفيد الإبلاغ أو الإعلان الرسمي في سياق إجراءات التطهير.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: موعد اكتمال أيام التطهير
  rationale: إضافة «موعد» تُبيّن أن بولس أبلغ بوقت انتهاء المدة، وهو معنى تلائمه العبارة اليونانية والسياق الإجرائي.
- source_word: ἕως οὗ προσηνέχθη
  choice: إلى أن يُقدَّم
  rationale: يحفظ تركيب الغاية الزمنية والمبني للمجهول؛ والمضارع العربي بعد «إلى أن» يعبّر طبيعيًا عن الحدث المرتقب من منظور السرد.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: عن كل واحد منهم
  rationale: «عن» تنقل معنى النيابة أو التقديم لأجل كل فرد دون توسع تفسيري.
- source_word: ἡ προσφορά
  choice: القربان
  rationale: لفظ طقسي عام يقابل التقدمة المقدَّمة، من غير حصرها في نوع بعينه من الذبائح.
theological_decisions:
- issue: دلالة مشاركة بولس في طقس التطهير
  choice: سرد مشاركته في إجراءات التطهير كما يذكرها النص دون تعليق لاهوتي
  alternative: صياغة توحي بتأييده الدائم لشعائر الهيكل أو رفضه لها
  rationale: الآية خبر سردي ولا تحسم بذاتها الجدل حول استمرار أحكام الشريعة أو شعائر الهيكل لدى المؤمنين.
- issue: دلالة الماضي الناقص في εἰσῄει
  choice: «دخل» في المتن العربي
  alternative: «كان يدخل» أو «أخذ يدخل» لإبراز الاستمرار أو التكرار
  rationale: السياق لا يعيّن بدقة هل الجانب الناقص مستمر أم تكراري أم خلفي، و«دخل» يحافظ على طبيعية العربية من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُخدمت ألفاظ طقسية مفهومة مثل «التطهير» و«القربان»، مع تجنب الشرح العقائدي داخل المتن.
