  source_fidelity: المعنى العام منقول بأمانة، بما في ذلك مشاركة بولس في التطهير ودخوله إلى نطاق الهيكل وتقديم تقدمة عن كل واحد. لكن «موعد اكتمال» يضيف تحديدًا زمنيًا غير مصرَّح به؛ فاليونانية تتكلم عن «إتمام/اكتمال أيام التطهير» نفسه. كما أن «باحات الهيكل» أدق من المفرد «ساحة الهيكل» في نقل دلالة ἱερόν على نطاق الهيكل.
  naturalness: الصياغة المقترحة فصيحة وطبيعية. واستبدال «القربان» بـ«التقدمة» يتجنب إيحاءات استعمالية محتملة ويظل واضحًا في السياق الطقسي.
  terminology: «التطهير» مناسب لـἁγνισμός، و«باحات الهيكل» مناسبة لـἱερόν، و«التقدمة» تقابل προσφορά بعمومها من غير حصرها في ذبيحة بعينها. لا يلزم إدراج تفسير لاهوتي في المتن.
