base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: ar
  text: ولمّا انتزعنا أنفسنا منهم وأبحرنا، أبحرنا في خطّ مستقيم ووصلنا إلى كوس، وفي اليوم التالي إلى رودس، ومن هناك إلى باتارا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς
  choice: ولمّا ... أبحرنا
  rationale: ينقل التعبير الاصطلاحي الانتقال الزمني في السرد، ويؤدي «أبحرنا» المعنى الملاحي للفعل ἀνάγω بصياغة عربية طبيعية.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: انتزعنا أنفسنا منهم
  rationale: يحفظ قوة ἀποσπάω وما يوحي به السياق من صعوبة الفراق، بدل تعبير محايد مثل «فارقناهم».
- source_word: εὐθυδρομήσαντες
  choice: سرنا في خطّ مستقيم
  rationale: يحفظ معنى الإبحار في مسار مستقيم مباشر، ويظل واضحًا في سياق الرحلة البحرية.
- source_word: ἤλθομεν εἰς
  choice: وصلنا إلى
  rationale: صياغة عربية طبيعية وموجزة في سرد مسار الرحلة.
- source_word: Κῶ
  choice: كوس
  rationale: نقل عربي واضح للاسم اليوناني، وهو اسم الجزيرة المعروف حديثًا.
- source_word: τῇ δὲ ἑξῆς
  choice: وفي اليوم التالي
  rationale: ينقل التعبير الزمني بدقة وبلغة عربية مألوفة.
- source_word: Ῥόδον
  choice: رودس
  rationale: الصيغة العربية الشائعة لاسم الجزيرة.
- source_word: κἀκεῖθεν
  choice: ومن هناك
  rationale: يحفظ الربط بين مراحل الرحلة والمعنى المكاني للمركب καί + ἐκεῖθεν.
- source_word: Πάταρα
  choice: باتارا
  rationale: نقل صوتي عربي مباشر لاسم الموضع اليوناني.
