  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: ar
  text: 'ولمّا كان بولس على وشك أن يُدخَل إلى الثكنة[a]، قال لقائد الكتيبة[b]: «هل يُسمح لي أن أقول لك شيئًا؟» فقال: «أتعرف اليونانية؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي مقرّ الجنود الرومان، ويرجّح أنه كان ضمن مجمّع القلعة.
    reason: cultural_note
  - marker: b
    text: 'حرفيًّا: «قائد الألف»، وهو لقب لضابط روماني كبير؛ ويُترجم أيضًا: «القائد العسكري».'
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: ولمّا كان ... على وشك أن يُدخَل
  rationale: ينقل معنى قرب وقوع الفعل في μέλλων، ويحفظ صيغة المبني للمجهول في εἰσάγεσθαι، مع تحويل التركيب الوصفي اليوناني إلى جملة زمنية عربية طبيعية.
- source_word: παρεμβολή
  choice: الثكنة
  rationale: يدل اللفظ في هذا السياق الأورشليمي على مقر الجنود الرومان، لا على معسكر عام؛ و«الثكنة» مقابل عربي موجز وطبيعي.
- source_word: χιλίαρχος
  choice: قائد الكتيبة
  rationale: يشير المصطلح إلى ضابط روماني كبير يقود وحدة عسكرية تقارب الكتيبة؛ وهذه الصياغة أوضح للقارئ العربي من نقل اللقب التاريخي بصيغة معرّبة غير مألوفة.
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: هل يُسمح لي أن أقول لك شيئًا؟
  rationale: يحفظ معنى الإذن في ἔξεστιν ويؤدي العبارة بوصفها سؤالًا مهذبًا مباشرًا في العربية، من غير الجمود على أداة الشرط اليونانية.
- source_word: τι
  choice: شيئًا
  rationale: هو المقابل الطبيعي للضمير النكرة في هذا السياق.
- source_word: Ἑλληνιστί
  choice: اليونانية
  rationale: الظرف يعني «باليونانية» أو «اللغة اليونانية»، ومع فعل المعرفة تأتي «أتعرف اليونانية؟» عربية واضحة وموجزة.
- source_word: γινώσκεις
  choice: أتعرف
  rationale: يحفظ المعنى الأساسي للفعل «تعرف»، مع دلالة سياقية محتملة على فهم اللغة أو التكلم بها دون حسمها في المتن.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل «ولمّا كان» لربط الحدث بالسياق السردي، وحُفظ المبني للمجهول. وُضعت علامتا الحاشيتين في المتن، مع تجنب أي تفسير طائفي أو لاهوتي زائد.
