- source_word: ἐπιβάντες
  choice: صعدنا إليها
  rationale: في السياق البحري يعني الصعود على متن السفينة؛ والضمير يوضح المقصود عربيًا دون إضافة دلالية بعيدة.
- source_word: ἀνήχθημεν
  choice: أبحرنا
  rationale: للفعل في الاستعمال البحري معنى الانطلاق إلى البحر؛ و«أبحرنا» تعبير عربي موجز وطبيعي.
