  rationale: اللفظ المعتاد لمركب بحري، وهو الأنسب لسياق السفر في البحر المتوسط.
- source_word: διαπερῶν
  choice: عابرةً
  rationale: اسم فاعل حاضر يصف السفينة ومسارها؛ و«عابرة» تحافظ على معنى الاجتياز دون تحويله في المتن إلى مجرد تحديد للوجهة.
- source_word: εἰς Φοινίκην
  choice: إلى فينيقية
