- source_word: εὑρόντες
  choice: ولمّا وجدنا
  rationale: اسم فاعل ماضٍ يدل على حدث سبق الفعل الرئيس؛ وصيغة «لمّا وجدنا» تُظهر التتابع الزمني بوضوح وطبيعية.
- source_word: πλοῖον
