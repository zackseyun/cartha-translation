  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: ar
  text: وبعد أن سلَّم عليهم، أخذ يروي لهم، أمرًا بعد أمر[a]، ما صنعه الله بين الأمم[b] من خلال خدمته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أخذ يسرد لهم بالتفصيل» أو «أخذ يشرح لهم». يوحي الفعل اليوناني بتقرير مطوّل تُعرض فيه الوقائع واحدةً واحدة.'
    reason: lexical_alternative
  - marker: b
    text: 'أي غير اليهود في هذا السياق. ويمكن ترجمة العبارة أيضًا: «بين الشعوب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: بعد أن سلَّم عليهم
  rationale: صياغة عربية طبيعية تحفظ كون التحية سابقة للفعل الرئيس، وفق دلالة اسم الفاعل اليوناني في صيغة الماضي.
- source_word: ἐξηγεῖτο
  choice: أخذ يروي لهم
  rationale: الفعل يدل على رواية أو عرض مفصّل، وصيغة الماضي الناقص توحي باستمرار التقرير؛ و«أخذ يروي» تنقل هذا الجانب الاستمراري بصورة طبيعية.
- source_word: καθ’ ἓν ἕκαστον
  choice: أمرًا بعد أمر
  rationale: يحفظ التعبير القوة التوزيعية للعبارة اليونانية، أي عرض الوقائع واحدة تلو الأخرى، من غير إثقال الأسلوب.
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: ما صنعه الله
  rationale: يحافظ على إسناد الفعل صراحةً إلى الله، ويأتي طبيعيًّا بعد فعل الرواية في العربية.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: بين الأمم
  rationale: يحفظ اللفظ الكتابي المعروف ويُبقي صلته بمعنى «الشعوب»، مع توضيح المقصود السياقي في الحاشية بأنه غير اليهود.
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: من خلال خدمته
  rationale: ينقل معنى الوسيلة في διά مع المضاف إليه، ويعرض خدمة بولس باعتبارها الأداة التي تم بها عمل الله، دون إضفاء معنى منصب كنسي غير منصوص عليه.
theological_decisions:
- issue: الفاعل والوسيلة في تقرير بولس عن الرسالة
  choice: الله هو الذي صنع هذه الأعمال، وخدمة بولس هي الوسيلة التي جرت من خلالها.
  alternative: أن يكون بولس هو صاحب الإنجازات بين الأمم.
  rationale: النص اليوناني يسند الفعل صراحة إلى الله في ἐποίησεν ὁ θεὸς، ثم يبيّن بعبارة διὰ τῆς διακονίας αὐτοῦ أن خدمة بولس كانت الوسيلة؛ فتحفظ الصياغة فاعلية الله ودور بولس الخدمي معًا.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقّرة. استُخدمت «الأمم» حفاظًا على التعبير الكتابي واتساع اللفظ الأصلي، مع إزالة الالتباس المحتمل في الحاشية. وجاء «أمرًا بعد أمر» لإظهار السرد التفصيلي المتتابع من غير تركيب حرفي متكلّف.
