source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: ar
  text: وقد أُخبِروا عنك أنك تعلِّم جميع اليهود الذين بين الأمم أن يتخلّوا عن موسى[a][b]، قائلًا لهم ألّا يختنوا أولادهم وألّا يسلكوا بحسب العادات[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنك تعلِّم الارتداد عن موسى». تستعمل اليونانية الاسم ἀποστασία، ومعناه الارتداد أو التخلّي.'
    reason: lexical_alternative
  - marker: b
    text: يُقصَد بـ«موسى» هنا شريعة موسى والممارسات اليهودية الموروثة.
    reason: cultural_note
  - marker: c
    text: 'أو: «وألّا يعيشوا وفق العادات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: أُخبِروا
  rationale: المبني للمجهول هنا يدل على ما نُقل إليهم شفهيًا عن بولس، و«أُخبروا» تعبير عربي طبيعي يحفظ كون الكلام تقريرًا وصل إليهم.
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: أن يرتدّوا عن موسى
  rationale: ينقل قوة الاسم ἀποστασία، أي الانحراف أو التخلي، بصياغة فعلية عربية واضحة، مع إبقاء «موسى» كما في اليونانية وعدم توسيعه في المتن إلى «شريعة موسى».
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: جميع اليهود الذين بين الأمم
  rationale: يشير التعبير إلى اليهود المقيمين وسط الأمم، وتحافظ الصياغة على معنى الشتات وعلى لفظ «الأمم» المألوف في سياق أعمال الرسل.
- source_word: λέγων
  choice: قائلًا لهم
  rationale: يوضح اسم الفاعل مضمون التعليم المنسوب إلى بولس، ويصل القول طبيعيًا باليهود المذكورين.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: ألّا يختنوا أولادهم
  rationale: تعكس الصياغة دلالة الملكية المفهومة من التركيب، وتحافظ على اللفظ العام «الأولاد» بدل تضييقه إلى «البنين».
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: وألّا يسلكوا بحسب العادات
  rationale: يحفظ «يسلكوا» استعارة περιπατεῖν الدالة على نهج الحياة، بينما تنقل «العادات» الممارسات اليهودية الموروثة.
theological_decisions:
- issue: طبيعة الاتهام الموجَّه إلى بولس بشأن موسى
  choice: 'صياغة الكلام بوصفه اتهامًا منقولًا: «أُخبروا عنك أنك تعلِّم... أن يرتدّوا عن موسى»'
  alternative: «أنك تعلّم الارتداد عن موسى» أو «أن يتخلّوا عن شريعة موسى»
  rationale: الآية تنقل ما أُشيع عن بولس ولا تقرر صحة الاتهام. لذلك حُفظت قوته من غير تحويله إلى حكم لاهوتي من الراوي، ومن غير تفسير «موسى» داخل المتن تفسيرًا يحسم المقصود.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُبقيت استعارة «يسلكوا» لأنها مفهومة في السياق الكتابي، ووُضعت بديلتها الأوضح في الحاشية. وُزعت علامتا الحاشيتين [a] و[b] بعد «موسى» لاتصالهما بتعبير الارتداد ودلالة الاسم، وجاءت [c] بعد «العادات» لتشير إلى بديل العبارة الأخيرة.
