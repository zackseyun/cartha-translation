  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: ar
  text: 'حينئذ أجاب بولس: «ماذا تفعلون؟ إنكم تبكون وتحطّمون قلبي[a]! فأنا مستعد ليس لأن أُقيَّد فقط، بل لأن أموت أيضًا في أورشليم من أجل اسم الرب يسوع[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تسحقون قلبي». الفعل اليوناني أقوى من مجرد التسبب بالحزن، ويصوّر انكسارًا داخليًا شديدًا.'
    reason: lexical_alternative
  - marker: b
    text: 'أي: من أجل شخص الرب يسوع وسلطانه والقضية المرتبطة به. يستعمل الكتاب المقدس «الاسم» بهذه الدلالة الواسعة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε ἀπεκρίθη ὁ Παῦλος
  choice: حينئذ أجاب بولس
  rationale: ينقل أداة التتابع الزمني وفعل القول السردي بعبارة عربية واضحة وطبيعية.
- source_word: Τί ποιεῖτε
  choice: ماذا تفعلون؟
  rationale: يحافظ على صيغة السؤال المباشر واحتجاج بولس العاطفي من غير تحويله تفسيريًا إلى سؤال عن السبب.
- source_word: κλαίοντες
  choice: إنكم تبكون
  rationale: يعبّر عن الحال المصاحبة للفعل بصياغة عربية طبيعية، مع إبقاء النبرة المؤثرة.
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: تحطّمون قلبي
  rationale: يحافظ على صورة الانكسار الداخلي وقوة الفعل اليوناني، وهو أشد من مجرد إحزان القلب.
- source_word: δεθῆναι
  choice: لأن أُقيَّد
  rationale: ينقل المصدر المبني للمجهول بدقة، من غير توسيعه إلى السجن، مع أن السجن قد يكون نتيجة التقييد في السياق.
- source_word: ἀποθανεῖν
  choice: لأن أموت
  rationale: ترجمة مباشرة للمصدر، مع موازاة تركيب «أُقيَّد» في العربية.
- source_word: εἰς Ἰερουσαλὴμ
  choice: في أورشليم
  rationale: السياق يتحدث عن مكان التقييد والموت المتوقعَين؛ «في أورشليم» هي الصياغة العربية الطبيعية لهذا الاستعمال.
- source_word: ἑτοίμως ἔχω
  choice: فأنا مستعد
  rationale: ينقل معنى الاصطلاح اليوناني الدال على الجاهزية بصياغة عربية موجزة.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: من أجل اسم
  rationale: يحفظ تعبير «الاسم» الكتابي وما يحمله من إحالة إلى الشخص والسلطان والقضية، بدل اختزاله في شرح واحد.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: الرب يسوع
  rationale: ينقل κύριος بصفته لقبًا للمسيح إلى «الرب»، ويحافظ على الصياغة العربية المألوفة للاسم واللقب.
theological_decisions:
- issue: ترجمة κύριος في الإشارة إلى يسوع
  choice: الرب يسوع
  alternative: السيد يسوع
  rationale: «الرب» يحفظ الوزن christological للقب في هذا السياق ولا يضعفه إلى مجرد صيغة احترام بشرية.
- issue: الحفاظ على اصطلاح «الاسم»
  choice: من أجل اسم الرب يسوع
  alternative: من أجل الرب يسوع
  rationale: النص يذكر «الاسم» صراحة، وهو اصطلاح كتابي قد يشمل شخص يسوع وسلطانه والقضية المرتبطة به؛ لذلك تُحفظ العبارة مع إيضاحها في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ السؤال المباشر، والتوازي بين التقييد والموت، والصورة المجازية القوية في «تحطّمون قلبي»، وكذلك اصطلاح «اسم الرب يسوع» دون تفسيره داخل المتن. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحانهما فعلًا.
