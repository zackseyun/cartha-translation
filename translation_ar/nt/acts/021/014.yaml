  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: ar
  text: 'ولمّا لم يقتنع، سكتنا قائلين: «لتكن مشيئة الرب».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: ولمّا لم يقتنع
  rationale: ينقل تركيب المضاف المطلق بوصفه ظرفًا سابقًا للفعل الرئيس، ويحافظ على معنى أن بولس لم يستجب لمحاولات إقناعه من غير إضافة تفسير مثل «لم يسمع لنا».
- source_word: ἡσυχάσαμεν
  choice: سكتنا
  rationale: يفيد الفعل هنا الكف عن الإلحاح والدخول في الصمت؛ و«سكتنا» تعبير عربي طبيعي موجز يلائم صيغة الماضي.
- source_word: εἰπόντες
  choice: قائلين
  rationale: يحافظ على الصيغة الحالية المرتبطة بالفعل الرئيس، ويصل السكوت بالقول الختامي على نحو طبيعي في العربية.
- source_word: Τοῦ κυρίου
  choice: الرب
  rationale: «الرب» هو المقابل المألوف لـ κύριος، مع إبقاء مرجع اللقب كما عبّر عنه النص اليوناني من غير زيادة توضيحية.
- source_word: τὸ θέλημα
  choice: مشيئة
  rationale: «مشيئة» تعبير عربي كتابي واضح وطبيعي لما يريده الرب أو يقصده.
- source_word: γινέσθω
  choice: لتكن
  rationale: تنقل صيغة الأمر الغائب التي تعبّر عن التسليم بتحقق مشيئة الرب، بصياغة عربية مألوفة من غير تقييد الكيفية.
theological_decisions:
- issue: مرجع κύριος
  choice: الرب
  alternative: السيد
  rationale: يحافظ «الرب» على اللقب الوارد في اليونانية وعلى دلالته اللاهوتية المحتملة، من غير التصريح بأن المقصود هو يسوع أو الله حين لا يصرح النص بذلك.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صياغة موجزة تحفظ تسلسل اليونانية الطبيعي، ولم تُضف حاشية لأن «سكتنا» تنقل المعنى السياقي مباشرة ولا توجد هنا ضرورة لعرض بديل عربي مستقل.
