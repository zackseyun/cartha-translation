  text: τούτῳ δὲ ἦσαν θυγατέρες ⸂τέσσαρες παρθένοι⸃ προφητεύουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/009.yaml
  text: He had four unmarried daughters who were prophesying.
translation:
  language: ar
  text: وكان لهذا الرجل أربع بنات عذارى يتنبأن.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτῳ
  choice: لهذا الرجل
  rationale: اسم الإشارة في صيغة المجرور يعود في السياق المباشر إلى فيلبس؛ وصياغة «كان لهذا الرجل» تحافظ على البنية الوجودية اليونانية بعبارة عربية طبيعية.
- source_word: δὲ
  choice: الواو في «وكان»
  rationale: أداة ربط خفيفة استمرارية، تؤديها الواو العربية طبيعيًا من غير إيحاء بالمخالفة.
- source_word: ἦσαν
  choice: كان ... بنات
  rationale: استُعمل التركيب العربي «كان له» للتعبير الطبيعي عن التركيب الوجودي الدال على الملك أو الانتساب.
- source_word: θυγατέρες
  choice: بنات
  rationale: المقابل العائلي المباشر والدقيق.
- source_word: τέσσαρες
  choice: أربع
  rationale: عدد أصلي يصف «بنات»، وجاء بصيغة التذكير وفق قاعدة مخالفة العدد من ثلاثة إلى عشرة للمعدود المؤنث.
- source_word: παρθένοι
  choice: عذارى
  rationale: ينقل الدلالة المباشرة للكلمة اليونانية على البتولية مع بقائه وصفًا اجتماعيًا طبيعيًا للنساء غير المتزوجات، من غير اختزال المعنى في الحالة الزوجية وحدها.
- source_word: προφητεύουσαι
  choice: يتنبأن
  rationale: فعل مضارع مؤنث جمع ينقل اسم الفاعل المضارع الدال على نشاطهن النبوي بوصفه سمة قائمة أو متكررة.
theological_decisions:
- issue: وصف بنات فيلبس بـ παρθένοι مع ممارستهن للتنبؤ
  choice: عذارى
  alternative: غير متزوجات
  rationale: «عذارى» أقرب إلى الدلالة الصريحة للنص اليوناني، بينما «غير متزوجات» قد تضيق المعنى إلى الحالة الاجتماعية. لا يقرر النص علاقة لاهوتية بين عذريتهن وتنبئهن، ولذلك لم تُضف أي علاقة سببية أو تقويمية بينهما.
- issue: دلالة προφητεύουσαι على نشاط النساء النبوي
  choice: يتنبأن
  alternative: كن نبيات
  rationale: الصياغة الفعلية تحافظ على تركيز الأصل على النشاط نفسه، ولا تحوله بالضرورة إلى لقب أو منصب محدد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. حافظت الصياغة على ترتيب عناصر الجملة وعلى الدلالة المباشرة لـ«عذارى»، مع استخدام «يتنبأن» الطبيعي والدقيق لنقل النعت الفعلي المستمر.
