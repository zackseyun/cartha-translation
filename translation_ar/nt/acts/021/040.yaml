  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: ar
  text: 'فلمّا أذن له، وكان بولس واقفًا على الدرج، أشار بيده إلى الشعب. ولمّا عمَّ صمتٌ عميق، خاطبهم باللغة العبرية[a] قائلًا:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «بالآرامية». يقول النص اليوناني حرفيًا: «باللهجة/اللغة العبرية»، وقد يُراد بذلك في هذا السياق اللسان السامي المحلي المعروف عادةً بالآرامية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: فلمّا أذن له
  rationale: ترجمة طبيعية للتركيب المطلق بالمضاف إليه، مع إبقاء مرجع الضمير إلى القائد مفهومًا من السياق السابق والمحافظة على الدلالة الزمنية.
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: وقف بولس على الدرج
  rationale: ينقل موضع بولس على درجات السلم بعبارة عربية واضحة، ويؤدي اسم الفاعل التام بوصفه تمهيدًا للفعل اللاحق.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: وأشار بيده إلى الشعب
  rationale: يعبر عن الإيماءة اليدوية الموجهة إلى المجتمعين، من غير إضافة صريحة لغرضها، ويحافظ على المقابل المباشر لـλαός.
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: فلمّا ساد سكون عميق
  rationale: صياغة عربية طبيعية تحفظ الدلالة الحدثية للعبارة، أي حلول قدر كبير من الهدوء.
- source_word: προσεφώνησεν
  choice: خاطبهم
  rationale: فعل عربي مناسب لمخاطبة جماعة علنًا، مع مفعول مفهوم من السياق اليوناني.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: باللغة العبرية
  rationale: يحافظ المتن على الوصف اليوناني الصريح «العبرية»، مع بيان احتمال أن يكون المقصود الآرامية في الحاشية.
- source_word: λέγων
  choice: 'قائلًا:'
  rationale: ينقل اسم الفاعل الذي يمهد للخطاب المباشر في الآية التالية، وتوضح النقطتان هذا الانتقال.
theological_decisions:
- issue: تعيين اللغة المقصودة بعبارة τῇ Ἑβραΐδι διαλέκτῳ
  choice: اللغة العبرية في المتن، مع حاشية تذكر احتمال الآرامية
  alternative: بالآرامية
  rationale: النص اليوناني يسميها «العبرية»، لكن الاستعمال التاريخي واللغوي قد يشير إلى الآرامية المحلية؛ لذلك لا يُحسم الاحتمال في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «الشعب» للمحافظة على الدلالة المباشرة لـλαός، و«سكون عميق» بدل ترجمة حرفية ثقيلة مثل «صار صمت كثير».
