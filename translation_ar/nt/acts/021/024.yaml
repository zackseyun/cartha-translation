language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: ar
  text: خُذ هؤلاء الرجال، وتطهَّر معهم، وتحمَّل نفقاتهم لكي يحلقوا رؤوسهم. وهكذا يعرف الجميع أن ما أُخبروا به عنك[a] لا أصل له، بل إنك أنت أيضًا تسلك ملتزمًا بالشريعة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما تعلَّموه عنك». يمكن أن يعني الفعل اليوناني «يعلِّم» أو، بمعنى أعم، «يُخبر». والمقصود هنا الأقوال المتداولة عن بولس.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «تسير في صفّ، حافظًا للشريعة»، أي تعيش بطريقة تتفق مع حفظ الشريعة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: خُذ هؤلاء الرجال
  rationale: اسم الإشارة يعود إلى الرجال الأربعة المذكورين في الآية السابقة. وصيغ اسم الفاعل هنا بوظيفة تمهيدية مرتبطة بالأمر، فكان الأمر الصريح طبيعيًا وواضحًا في العربية.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: وتطهَّر معهم
  rationale: الفعل يدل في السياق على الدخول في تطهير شعائري، و«معهم» تنقل معنى المشاركة الذي تفيده σύν.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: وتحمَّل نفقاتهم
  rationale: المعنى هو الإنفاق عنهم وتغطية التكاليف المرتبطة بالنذر، و«تحمّل نفقاتهم» تعبير عربي واضح لا يزيد على دلالة السياق.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: لكي يحلقوا رؤوسهم
  rationale: تُبرز «لكي» معنى الغرض. والمفرد اليوناني «الرأس» توزيعي، لذلك جاء الجمع في العربية موافقًا للاستعمال الطبيعي عند تعدد الأشخاص.
- source_word: γνώσονται πάντες
  choice: وهكذا يعرف الجميع
  rationale: المستقبل يدل على النتيجة التي ستترتب على هذا الفعل، و«هكذا» تصل الجملة بما قبلها بوضوح.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: ما أُخبروا به عنك
  rationale: يمكن أن يدل κατηχέω على التعليم أو الإخبار. والسياق يتناول أقوالًا متداولة عن بولس، لذلك اختير «أُخبروا» مع إبقاء البديل في الحاشية.
- source_word: οὐδέν ἐστιν
  choice: لا أصل له
  rationale: التركيب يفيد أن الأقوال لا حقيقة أو أساس لها، و«لا أصل له» تعبير عربي طبيعي يحفظ هذه القوة.
- source_word: ἀλλὰ στοιχεῖς καὶ αὐτὸς φυλάσσων τὸν νόμον
  choice: بل إنك أنت أيضًا تسلك ملتزمًا بالشريعة
  rationale: «تسلك» تنقل صورة στοιχέω بوصفها طريقة عيش، و«ملتزمًا بالشريعة» تنقل معنى φυλάσσων دون تكرار ثقيل. كما تحفظ «أنت أيضًا» التأكيد والإضافة في καὶ αὐτός.
- source_word: νόμον
  choice: الشريعة
  rationale: يشير اللفظ هنا إلى الشريعة اليهودية في السياق. و«الشريعة» عربية فصيحة واضحة، من غير إضافة تفسيرية مثل «شريعة موسى» إلى صلب النص.
theological_decisions:
- issue: طبيعة علاقة بولس بالشريعة في هذا السرد
  choice: 'صيغ الكلام بوصفه وصفًا لسلوك بولس الظاهر: «إنك أنت أيضًا تسلك ملتزمًا بالشريعة».'
  alternative: «إنك أنت أيضًا تحفظ الشريعة» أو «تسلك بانتظام وأنت حافظ للشريعة».
  rationale: الآية تعرض ما سيعرفه الناس من مشاركة بولس في التطهير وتحمّله النفقات. لذلك تحافظ الصياغة على دعوى السرد المباشرة من غير أن تحسم التوترات اللاهوتية الأوسع بشأن موقف بولس من الشريعة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «تطهَّر» للدلالة الشعائرية، و«الشريعة» بدل المصطلحات الأشد تقليدية لتيسير الفهم العام، مع الحفاظ على دلالة النص وسياقه اليهودي. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحانهما مباشرة.
