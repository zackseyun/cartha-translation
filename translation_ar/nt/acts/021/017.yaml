  text: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα ἀσμένως ⸀ἀπεδέξαντο ἡμᾶς οἱ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: ar
  text: ولمّا وصلنا إلى أورشليم، رحّب بنا الإخوة بفرح.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات»؛ فاليونانية تقول «الإخوة»، وقد تُستعمل هذه الكلمة أيضًا للدلالة على جماعة المؤمنين على نحو أوسع.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα
  choice: ولمّا وصلنا إلى أورشليم
  rationale: التركيب الإضافي المطلق يحدّد زمن الوصول وظرفه. وصيغة «لمّا وصلنا» عربية طبيعية تحفظ الدلالة الزمنية، و«إلى» تلائم بلوغ الوجهة.
- source_word: ἀσμένως
  choice: بفرح
  rationale: يفيد الظرف السرور والترحاب الطوعي؛ و«بفرح» تعبير عربي واضح وقريب من دلالته دون زيادة تفسيرية.
- source_word: ἀπεδέξαντο
  choice: رحّب بنا
  rationale: الفعل هنا يدل على استقبال الأشخاص بقبول وحفاوة، و«رحّب بنا» أوضح في العربية المعاصرة من «قبلونا» أو «استقبلونا» وحدها.
- source_word: οἱ ἀδελφοί
  choice: الإخوة
  rationale: يحافظ على صيغة الاسم المذكر الجمع في اليونانية وعلى التعبير الشائع عن جماعة المؤمنين، مع بيان احتمال شموله المؤمنات في الحاشية.
theological_decisions:
- issue: الدلالة الجندرية لعبارة οἱ ἀδελφοί في جماعة أورشليم المسيحية
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: النص اليوناني يستعمل جمع المذكر «الإخوة». تُحفظ هذه الصيغة في المتن، بينما تُذكر في الحاشية إمكانية استعمالها للدلالة الأوسع على جماعة المؤمنين، من غير حسم ما يتركه اللفظ محتملاً.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «أورشليم» بوصفه الاسم الكتابي العربي المألوف، وحُفظت بساطة الجملة وسرد المتكلم الجمع.
