lexical_decisions:
- source_word: ὅτε δὲ
  choice: ولمّا
  rationale: تؤدي معنى الجملة الزمنية، وتستوعب δέ بوصفها أداة ربط خفيفة من غير إقحام معنى استدراكي قوي.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: بلغ الدَّرَج
  rationale: الفعل γίνομαι مع ἐπί وحالة النصب يدل هنا اصطلاحيًا على الوصول إلى موضع؛ و«بلغ» عربي طبيعي ودقيق.
- source_word: ἀναβαθμούς
  choice: الدَّرَج
  rationale: يدل اللفظ على درجات أو سُلَّم صاعد، و«الدَّرَج» يلائم الموقع السردي من غير زيادة تفسيرية في المتن.
- source_word: συνέβη
  choice: حدث أن
  rationale: يحافظ على صياغة لوقا التي تعرض الأمر بوصفه ظرفًا وقع نتيجة الموقف.
- source_word: βαστάζεσθαι
  choice: حمله
  rationale: ينقل معنى المبني للمجهول في اليونانية بصياغة عربية طبيعية تجعل الجنود، المذكورين بوصفهم الفاعل، فاعلًا نحويًا. أما دلالة الاضطرار المحتملة فتُحفظ في الحاشية.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: الجنود
  rationale: ترجمة مباشرة للفاعل الذي قام بالحمل في التركيب المبني للمجهول.
- source_word: διὰ τὴν βίαν
  choice: بسبب عنف
  rationale: تنقل διά مع النصب بوصفها سببية، و«عنف» أنسب من «قوة» في سياق الاضطراب والاعتداء.
- source_word: τοῦ ὄχλου
  choice: الحشد
  rationale: ترجمة واضحة معاصرة لـὄχλος، وتحافظ على كون الجماعة جمعًا محتشدًا، بينما تحمل كلمة «عنف» الدلالة العدائية.
