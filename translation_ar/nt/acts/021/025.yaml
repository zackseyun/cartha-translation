base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: ar
  text: وَأَمَّا الأُمَمُ الَّذِينَ آمَنُوا، فَقَدْ أَرْسَلْنَا[a]، وَقَدْ قَرَّرْنَا أَنْ يَحْفَظُوا أَنْفُسَهُمْ[b] مِمَّا ذُبِحَ لِلْأَصْنَامِ، وَمِنَ الدَّمِ، وَمِمَّا خُنِقَ[c]، وَمِنَ الْفُجُورِ الْجِنْسِيِّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية تقول حرفيًا: «أرسلنا»، من غير ذكر ما أُرسل؛ ويشير السياق إلى الرسالة أو القرار المُرسَل في أعمال الرسل 15.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أن يمتنعوا عن».'
    reason: lexical_alternative
  - marker: c
    text: أي لحم الحيوان الذي قُتل خنقًا ولم يُسفك دمه.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ δὲ
  choice: وَأَمَّا
  rationale: تُدخل موضوعًا جديدًا مع انتقال أو مقابلة خفيفة بما سبق، وهي صياغة عربية طبيعية موجزة.
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: الأُمَمُ الَّذِينَ آمَنُوا
  rationale: يشير «الأمم» في السياق إلى غير اليهود، وصيغة «آمنوا» تعبّر بوضوح عن الذين دخلوا في الإيمان؛ وأبقي اللفظ السياقي المألوف في سفر الأعمال.
- source_word: ἡμεῖς ἀπεστείλαμεν
  choice: فَقَدْ أَرْسَلْنَا إِلَيْهِمْ
  rationale: يحافظ على ضمير المتكلمين الصريح وعلى فعل الإرسال، من غير أن يضيف «رسالة» إلى النص، إذ إن مفعول الفعل غير مذكور صراحة وإن كان السياق يشير إلى قرار مجمع أورشليم المكتوب.
- source_word: κρίναντες
  choice: بَعْدَ أَنْ قَرَّرْنَا
  rationale: ينقل سبق القرار على الإرسال، ويعبّر عن الحكم التداولي للمجمع بلغة عربية واضحة.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: أَنْ يَحْفَظُوا أَنْفُسَهُمْ
  rationale: يحافظ على الدلالة الانعكاسية للفعل، أي أن يصونوا أنفسهم ويبتعدوا عن المذكورات.
- source_word: εἰδωλόθυτον
  choice: مِمَّا ذُبِحَ لِلْأَصْنَامِ
  rationale: ترجمة قريبة من اللفظ اليوناني تشمل الطعام أو اللحم المقدَّم في ذبائح الأصنام من غير تضييق غير لازم.
- source_word: αἷμα
  choice: الدَّمِ
  rationale: ينقل اللفظ اليوناني مباشرة من غير إدخال تفسير حكم تناوله في صلب النص.
- source_word: πνικτόν
  choice: مِمَّا خُنِقَ
  rationale: يشير إلى الحيوان المقتول خنقًا، ويحافظ على البنية المتوازية في قائمة المحظورات.
- source_word: πορνείαν
  choice: الْفُجُورِ الْجِنْسِيِّ
  rationale: تعبير عربي معاصر واسع الدلالة للسلوك الجنسي غير المشروع، ولا يحصر المصطلح في صورة واحدة كالزنى أو العلاقة قبل الزواج.
theological_decisions:
- issue: طبيعة محظورات قرار الرسل ومدى استمرارها
  choice: إيراد المحظورات الأربعة كما هي من غير تحديد مدتها أو حصر علتها اللاهوتية
  alternative: اعتبار أحكام الطعام تنازلات مؤقتة خاصة بالشركة على المائدة، أو اعتبارها شريعة أخلاقية عامة دائمة
  rationale: الآية تنقل مضمون قرار سابق، لكنها لا تشرح هنا أساس كل حظر ولا مدة سريانه؛ لذلك تحافظ الترجمة على التوتر التفسيري ولا تتبنى موقفًا طائفيًا.
- issue: مدلول πορνεία
  choice: الفجور الجنسي
  alternative: الزنى أو الدعارة أو علاقة جنسية محرمة بعينها
  rationale: المصطلح واسع في الاستعمال اليهودي والمسيحي القديم، ولا يحدد هذا السياق وحده نوعًا واحدًا من المخالفة الجنسية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة، مع ضبطٍ كامل للنص الرئيس. استُعمل «الأمم» وفق الاصطلاح السياقي في سفر الأعمال، وتجنبت الترجمة إضافة «رسالة» إلى المتن لأن مفعول «أرسلنا» محذوف في اليونانية. وُضعت جميع علامات الحواشي في مواضعها داخل النص.
