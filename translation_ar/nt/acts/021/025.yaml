  terminology: «الأمم» اصطلاح مناسب هنا لغير اليهود، و«مما ذُبح للأصنام»، و«الدم»، و«مما خُنق»، و«الفجور الجنسي» تنقل القائمة من غير تضييق تفسيري. «أن يحفظوا أنفسهم من» مقبول ويحافظ على البعد الانعكاسي للفعل.
