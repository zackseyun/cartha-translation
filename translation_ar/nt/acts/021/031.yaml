  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: ar
  text: وبينما كانوا يحاولون قتله، وصل الخبر إلى قائد الكتيبة[a] أن أورشليم كلها في اضطراب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي قائد عسكري روماني كان يتولى قيادة الكتيبة المرابطة هناك.
    reason: cultural_note
  - marker: b
    text: 'أو: «في بلبلة»، أو: «في هيجان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: وبينما كانوا يحاولون قتله
  rationale: ينقل التركيب الإضافي المطلق مع اسم الفاعل المضارع فعلًا مستمرًا متزامنًا مع وصول الخبر، و«يحاولون قتله» عربية طبيعية مباشرة.
- source_word: ἀνέβη φάσις
  choice: وصل الخبر
  rationale: المعنى الاصطلاحي أن الخبر بلغ القائد؛ وهذه الصياغة طبيعية في العربية، وإن كانت لا تستبقي حرفيًا صورة صعود الخبر إلى القلعة.
- source_word: τῷ χιλιάρχῳ
  choice: إلى قائد
  rationale: تشير الكلمة إلى ضابط عسكري روماني رفيع يقود الكتيبة؛ و«قائد» أوضح للقارئ المعاصر من تعريب اللقب التاريخي.
- source_word: τῆς σπείρης
  choice: الكتيبة
  rationale: تشير إلى وحدة عسكرية رومانية؛ و«الكتيبة» مقابل عربي واضح ومناسب للسياق.
- source_word: ὅτι ὅλη Ἰερουσαλήμ
  choice: أن أورشليم كلها
  rationale: يحافظ على الإيجاز والمجاز المكاني في الأصل، حيث يُراد بالمدينة سكانها وما يجري فيها.
- source_word: συγχύννεται
  choice: في اضطراب
  rationale: ينقل حالة البلبلة والهيجان العام التي يدل عليها المضارع المبني للمجهول، من غير حصر المعنى في صخب صوتي فقط.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع ترتيب طبيعي للجملة. وُضعت علامتا الحاشيتين بعد اللفظ الذي تشرحانه مباشرة، مع تقديم الحاشية الثقافية على البديل المعجمي بحسب موضعهما في النص.
