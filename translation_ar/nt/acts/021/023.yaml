  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: ar
  text: 'فافعل ما نقوله لك: عندنا أربعة رجال عليهم نذرٌ من تلقاء أنفسهم[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد نذروا نذرًا». واليونانية حرفيًا: «لهم نذر على أنفسهم».'
    reason: lexical_alternative
  - marker: b
    text: قد يدل السياق الأوسع على نذر من نوع نذر النذير، لكن هذه الآية لا تقول إلا «نذرًا».
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν ποίησον
  choice: فافعَلوا
  rationale: تفيد οὖν الانتقال الاستنتاجي، ويأمر فعل الأمر المفرد بولس بأن يفعل الأمر الآتي. استُعمل خطاب الجمع للتوقير في العربية، مع بقاء المرجع شخصًا واحدًا.
- source_word: ὅ σοι λέγομεν
  choice: ما نقوله لكم
  rationale: صياغة عربية طبيعية تحفظ كون الجملة الموصولة مفعول الأمر، والحاضر اليوناني يفيد القول الجاري في المقام.
- source_word: εἰσὶν ἡμῖν
  choice: عندنا
  rationale: المركب الوجودي مع ضمير المجرور يفيد الاختصاص أو الوجود لدى المتكلمين، و«عندنا» موجزة وطبيعية.
- source_word: ἄνδρες τέσσαρες
  choice: أربعة رجال
  rationale: ترجمة مباشرة ودقيقة تشير إلى رجال بالغين.
- source_word: εὐχὴν ἔχοντες
  choice: عليهم نذرٌ
  rationale: تنقل حالة التزامهم بالنذر بعبارة عربية مألوفة، من غير تحديد نوع النذر.
- source_word: ἀφ’ ἑαυτῶν
  choice: من تلقاء أنفسهم
  rationale: تحفظ دلالة أن النذر صادر منهم أو خاص بهم، مع الإقرار بأن تركيب العبارة اليونانية غير مألوف وتحتمل دلالته قدرًا من الالتباس.
theological_decisions:
- issue: طبيعة النذر
  choice: الإبقاء على اللفظ العام «نذر»
  alternative: نذر نذير
  rationale: قد يشير السياق الأوسع إلى نذر من نمط نذر النذير، لكن الآية نفسها لا تذكر إلا εὐχή، لذلك لا يُزاد التحديد في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل جمع التوقير في خطاب بولس، وهو مألوف في بعض أساليب العربية الكتابية، مع أن اليونانية تخاطب مفردًا.
