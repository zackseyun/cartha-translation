translation:
  language: ar
  text: فماذا ينبغي أن نفعل؟ من المؤكد أنهم سيسمعون أنك قد جئت.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «فما هو إذًا؟» والتعبير اليوناني يسأل عما ينبغي فعله في ضوء هذا الوضع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: فماذا ينبغي أن نفعل؟
  rationale: العبارة حرفيًا «فما هو إذًا؟»، لكنها في السياق سؤال عملي عما ينبغي فعله إزاء الوضع القائم. تنقل الصياغة العربية المقصود الخطابي بلغة طبيعية، مع توضيح الحرفية في الحاشية.
- source_word: πάντως
  choice: لا بد
  rationale: يفيد الظرف هنا توكيد وقوع الخبر اللاحق؛ و«لا بد» تعبر طبيعيًا عن هذه الحتمية أو اليقين في العربية.
- source_word: ἀκούσονται
  choice: سيسمعون
  rationale: صيغة المستقبل الوسطى مستعملة هنا بمعنى معلوم. والفاعل الجمع مفهوم من السياق، فحُفظ دون تعيين هويته داخل الآية.
- source_word: ὅτι
  choice: أنك
  rationale: تُدخل الأداة مضمون ما سيسمعونه، لا سببًا؛ ولذلك نُقلت بـ«أن» متصلة بضمير المخاطب.
- source_word: ἐλήλυθας
  choice: قد جئت
  rationale: صيغة التام اليونانية تشير إلى مجيء بولس مع بقاء نتيجة وصوله حاضرة. وتساعد «قد» مع الماضي على إبراز تحقق المجيء دون إثقال العبارة.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. اختيرت صياغة اصطلاحية طبيعية للسؤال الأول، مع حفظ البديل الحرفي في الحاشية، ولم يُصرَّح بهوية فاعل «سيسمعون» لأنها مضمرة في الأصل وتُفهم من السياق.
