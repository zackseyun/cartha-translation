  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: ar
  text: وفي اليوم التالي، دخل بولس معنا على يعقوب، وحضر جميع الشيوخ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وجاء جميع الشيوخ» أو «وصل جميع الشيوخ». يمكن للفعل اليوناني أن يبرز الوصول أو الحضور.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: وفي اليوم التالي
  rationale: تعبير زمني اصطلاحي يدل على اليوم التالي، وتحافظ الصياغة العربية على الصلة بالسياق السابق وعلى المعنى الزمني الطبيعي.
- source_word: εἰσῄει
  choice: دخل
  rationale: الفعل يدل على الحركة إلى الداخل أو الدخول، و«دخل» ترجمة عربية موجزة وطبيعية تحفظ هذا الاتجاه.
- source_word: σὺν ἡμῖν
  choice: معنا
  rationale: تنقل المصاحبة التي تفيدها σύν مع المجرور نقلًا مباشرًا وواضحًا.
- source_word: πρὸς Ἰάκωβον
  choice: إلى يعقوب
  rationale: تفيد πρός هنا التوجه نحو شخص؛ ولا تضيف الصياغة تحديدًا لمكانه أو تفسيرًا لهوية يعقوب لا يصرح به النص.
- source_word: πάντες τε
  choice: و... جميعًا
  rationale: تنقل الواو قوة الربط الخفيفة في τέ، بينما تفيد «جميعًا» شمول πάντες بأسلوب عربي طبيعي.
- source_word: παρεγένοντο
  choice: حضر
  rationale: يمكن أن يعني الفعل الوصول أو الحضور. واختيار «حضر» ملائم للاجتماع ويظل محتفظًا بإيحاء المجيء والحضور؛ وتوضح الحاشية البديل الدلالي.
- source_word: οἱ πρεσβύτεροι
  choice: الشيوخ
  rationale: اللفظ يشير إلى قادة معترف بهم في الجماعة، و«الشيوخ» المقابل العربي المألوف والمحايد طائفيًا.
theological_decisions:
- issue: هوية يعقوب ودوره
  choice: إيراد الاسم «يعقوب» وحده بلا وصف إضافي
  alternative: يعقوب أخو الرب؛ أو يعقوب قائد كنيسة أورشليم
  rationale: يسمي النص يعقوب من غير تعريف إضافي، لذلك لا تُدرج في المتن معلومات سياقية لا يصرح بها العدد.
- issue: الدلالة الكنسية للفظ οἱ πρεσβύτεροι
  choice: الشيوخ
  alternative: القسوس؛ أو قادة الكنيسة
  rationale: يحفظ هذا الاختيار معنى القيادة المعترف بها من غير فرض بنية كنسية لاحقة أو اصطلاح خاص بطائفة بعينها.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ورصينة. استُخدم «دخل ... إلى يعقوب» حفاظًا على دلالة الحركة في الأصل من غير إضافة «لزيارة» أو «بيت». وُضعت علامة الحاشية بعد الجملة التي تتناول حضور الشيوخ.
