  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: ar
  text: ورافقنا أيضًا بعضُ التلاميذ من قيصرية، وقادونا إلى مناسون لكي ننزل عنده[a]؛ وكان رجلًا قبرصيًّا من التلاميذ الأوائل[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «وكانوا يصطحبوننا إلى مناسون… الذي كنا سنقيم عنده»، أو: «وأخذونا إلى بيت مناسون». يحتمل اسم الفاعل اليوناني وفعل الضيافة صيغًا متقاربة في المعنى.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وكان تلميذًا منذ زمن طويل». قد تعني العبارة أن مناسون صار تلميذًا في الأيام المبكرة، أو ببساطة أنه ظل تلميذًا مدة طويلة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον … σὺν ἡμῖν
  choice: رافقنا
  rationale: ينقل معنى المصاحبة في السفر بصورة عربية طبيعية، مع بقاء دلالة الحركة مفهومة من السياق.
- source_word: τῶν μαθητῶν
  choice: بعضُ التلاميذ
  rationale: التركيب اليوناني ذو دلالة تبعيضية، و«التلاميذ» هو المقابل المألوف والدقيق في سياق أعمال الرسل.
- source_word: ἀπὸ Καισαρείας
  choice: من قيصرية
  rationale: ينقل منشأ التلاميذ أو موضع قدومهم مباشرة.
- source_word: ἄγοντες
  choice: وقادونا إلى
  rationale: يحفظ معنى الإرشاد أو الاصطحاب إلى موضع الضيافة، من غير حسم زائد لطبيعة الحركة.
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: لكي ننزل عنده
  rationale: تعبير عربي واضح عن قصد الإقامة ضيوفًا عند مناسون، ويحافظ على دلالة الغاية في صيغة الفعل اليوناني.
- source_word: Μνάσωνί τινι
  choice: مناسون
  rationale: اسم العلم يعرّف الشخص الذي لم يسبق ذكره؛ لا تستلزم العربية إضافة مقابل حرفي لـτινι، إذ سيكون «رجل يُدعى» أثقل في هذا الموضع.
- source_word: Κυπρίῳ
  choice: رجلًا قبرصيًّا
  rationale: يبيّن بوضوح أن مناسون من قبرص، بصياغة عربية طبيعية.
- source_word: ἀρχαίῳ μαθητῇ
  choice: من التلاميذ الأوائل
  rationale: ينقل الدلالة الزمنية المحتملة لعبارة ἀρχαίῳ μαθητῇ، مع بيان البديل «تلميذ منذ زمن طويل» في الحاشية لتجنب الجزم بما لا يحسمه النص.
theological_decisions:
- issue: دلالة ἀρχαίῳ μαθητῇ الزمنية
  choice: من التلاميذ الأوائل
  alternative: تلميذ منذ زمن طويل
  rationale: قد تصف العبارة انتماء مناسون إلى مرحلة مبكرة من حركة التلاميذ، أو طول مدة تلمذته. أُبقي هذا التوتر الدلالي ظاهرًا بواسطة الحاشية، من غير الادعاء بأنه كان بالضرورة من أول التلاميذ على الإطلاق.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، بنبرة سردية كريمة. استُخدم «ننزل عنده» بوصفه تعبيرًا مألوفًا للضيافة، وحُفظ غموض الوصف الزمني لمناسون في الحاشية.
