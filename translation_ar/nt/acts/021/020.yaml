reference: Acts 21:20
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: ar
  text: 'فلما سمعوا ذلك، مجّدوا الله وقالوا له: «أنت ترى، يا أخي، كم من عشرات الآلاف[a] بين اليهود[b] ممن آمنوا، وهم جميعًا غيورون على الشريعة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «كم من ألوف كثيرة». قد تدل الكلمة اليونانية على وحدات من عشرة آلاف، أو تُستعمل بوجه أعم للدلالة على عدد بالغ الكثرة.
    reason: lexical_alternative
  - marker: b
    text: أو «بين سكان اليهودية»، إذا فُهمت الكلمة جغرافيًا لا من جهة الهوية القومية والدينية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: فلما سمعوا ذلك
  rationale: اسم الفاعل الأُرستي يفيد التعاقب الزمني، والمفعول المفهوم من السياق السابق صُرّح به بلفظ «ذلك» لسلامة العربية.
- source_word: ἐδόξαζον
  choice: مجّدوا
  rationale: ينقل معنى إسناد المجد والكرامة إلى الله، ويحافظ على الثقل الديني للفعل دون إطناب.
- source_word: εἶπόν τε αὐτῷ
  choice: وقالوا له
  rationale: ترجمة طبيعية لأداة الربط وفعل القول، مع إبقاء المخاطَب مذكورًا.
- source_word: Θεωρεῖς
  choice: أنت ترى
  rationale: يحافظ على الحاضر الخبري المستعمل لتوجيه انتباه بولس إلى واقع ظاهر.
- source_word: ἀδελφέ
  choice: يا أخي
  rationale: نداء مفرد مذكر موجّه إلى بولس، وصيغته العربية الطبيعية «يا أخي».
- source_word: πόσαι μυριάδες
  choice: كم من آلافٍ كثيرة
  rationale: ينقل معنى العدد الضخم من غير حصر اللفظة في القيمة الحسابية الدقيقة لعشرة آلاف؛ وتُذكر الدلالة الأدق الممكنة في الحاشية.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: بين اليهود
  rationale: السياق يبرز الهوية اليهودية الدينية والقومية للمؤمنين وحرصهم على الشريعة، مع حفظ الاحتمال الجغرافي في الحاشية.
- source_word: τῶν πεπιστευκότων
  choice: ممن آمنوا
  rationale: 'يحافظ على القوة الفعلية لصيغة التام: أناس دخلوا في الإيمان وما زالوا في حاله، من غير إضافة مفعول غير مصرّح به.'
- source_word: ζηλωταὶ τοῦ νόμου
  choice: غيورون على الشريعة
  rationale: تعبير عربي طبيعي ينقل شدة التمسك، و«الشريعة» هنا أوضح من «القانون» في الإشارة إلى شريعة موسى.
- source_word: ὑπάρχουσιν
  choice: هم
  rationale: الفعل يؤدي وظيفة رابطية في السياق، ويُعبَّر عنه طبيعيًا في العربية بضمير الفصل مع الخبر.
theological_decisions:
- issue: مدلول ἐν τοῖς Ἰουδαίοις
  choice: بين اليهود
  alternative: بين أهل اليهودية/اليهوديين جغرافيًا
  rationale: حديث الآية عن إيمانهم وغيرتهم على الشريعة يرجّح الهوية القومية الدينية، لكن اللفظة يمكن في بعض السياقات أن تحمل دلالة جغرافية، لذلك لم يُطمس هذا الاحتمال.
- issue: قوة μυριάδες العددية
  choice: آلاف كثيرة
  alternative: عشرات الآلاف
  rationale: قد تدل اللفظة على وحدات من عشرة آلاف، وقد تُستعمل لعدد بالغ الكثرة؛ فاختير تعبير عربي واسع الدلالة وحُفظ المعنى العددي الأخص في الحاشية.
- issue: المقصود بـ τοῦ νόμου
  choice: الشريعة
  alternative: الناموس
  rationale: المراد شريعة موسى، و«الشريعة» أفصح وأوضح للقارئ العربي المعاصر، من غير إدخال حكم مذهبي بشأن موقف هؤلاء المؤمنين منها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «الشريعة» بدل «الناموس» لوضوحها العام، وحُفظ غموض التعبير العددي والاحتمال الدلالي لكلمة «اليهود» في حاشيتين موضوعتين عند اللفظين المعنيين.
