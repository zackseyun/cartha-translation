  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: ar
  text: وبعد أن ودَّعنا بعضنا بعضًا[a]، صعدنا إلى السفينة، أمّا هم فرجعوا إلى ديارهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «توادعنا». قد يدل التعبير اليوناني على التحية أو الوداع، لكن سياق الرحيل يرجّح معنى الوداع.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «إلى ما يخصّهم»؛ وهو تعبير اصطلاحي يمكن أن يعني «إلى منازلهم» أو «إلى موطنهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: ودَّع بعضُنا بعضًا
  rationale: قد يدل الفعل في ذاته على التحية أو الوداع، لكن سياق الرحيل يرجّح معنى توديع بعضهم بعضًا. وهذه صياغة عربية طبيعية تحفظ المعنى التبادلي.
- source_word: ἐνέβημεν
  choice: صعدنا إلى
  rationale: الفعل هنا يعني الدخول إلى السفينة أو الصعود على متنها؛ و«صعدنا إلى السفينة» تعبير عربي واضح ومألوف.
- source_word: πλοῖον
  choice: السفينة
  rationale: اللفظة قد تشير إلى قارب أو سفينة، وسياق السفر البحري في أعمال الرسل يلائم «السفينة».
- source_word: ὑπέστρεψαν
  choice: رجعوا
  rationale: ينقل المعنى السردي المباشر للفعل، أي عادوا أو رجعوا.
- source_word: εἰς τὰ ἴδια
  choice: إلى ديارهم
  rationale: التعبير اليوناني حرفيًا «إلى ما لهم/خاصتهم»، وهو اصطلاح يدل على موطنهم أو ما يخصهم؛ و«ديارهم» طبيعية وتحافظ على شيء من سعة الدلالة دون حصرها في مبانٍ سكنية منفردة.
