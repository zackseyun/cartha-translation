base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: ar
  text: فاضطربت المدينة كلها، وتجمهر الشعب؛ فأمسكوا ببولس وجرّوه خارج الهيكل[a]، وفي الحال أُغلقت الأبواب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود بـ«الهيكل» هنا مجمّع الهيكل أو ساحاته، لا المَقْدِس الداخلي وحده.
    reason: cultural_note
  - marker: b
    text: 'أو: «البوابات»، إذ يمكن أن تشير الكلمة في سياق الهيكل إلى بوابات المداخل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη
  choice: فاضطربت
  rationale: يفيد المبني للمجهول هنا وقوع المدينة في حالة هياج واضطراب جماعي، لا مجرد الحركة المكانية.
- source_word: ἡ πόλις ὅλη
  choice: المدينة كلها
  rationale: ينقل شمول العبارة اليونانية بصياغة عربية طبيعية.
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: اندفع الشعب متجمهرًا
  rationale: تعبر συνδρομή عن تلاقي الناس سريعًا واندفاعهم معًا، وتجنب الصياغة الاسمية الثقيلة.
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: فأمسكوا بولس
  rationale: ينقل الإمساك الجسدي القسري، وتؤدي الفاء تعاقب الحدث مع بقاء علاقة اسم الفاعل بالسياق.
- source_word: εἷλκον
  choice: جرّوه
  rationale: الفعل ماض ناقص يوناني يصور عملية الجر الجارية، لكن العربية الفصيحة الطبيعية تؤديها هنا بالماضي من غير حاجة إلى تركيب استمراري.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: إلى خارج الهيكل
  rationale: ἱερόν يدل على مجمع الهيكل أو ساحاته، والعبارة العربية تبين إخراجه من نطاقه مع إيضاح الدلالة في الحاشية.
- source_word: εὐθέως
  choice: في الحال
  rationale: تعبير عربي واضح عن الفورية.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: أُغلقت الأبواب
  rationale: يحافظ على المبني للمجهول وعلى المعنى المباشر، مع احتمال أن تكون أبوابًا كبيرة أو بوابات في هذا السياق.
