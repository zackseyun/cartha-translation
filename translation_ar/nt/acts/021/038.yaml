base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: ar
  text: إذًا، ألستَ أنت المصري الذي أثار تمردًا قبل أيام وأخرج إلى البرية أربعةَ آلافِ رجلٍ من رجال الخناجر[a]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «السيكاريين»، وهم جماعة عُرفت بالاغتيالات بخناجر مخفية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: إذًا، ألستَ
  rationale: ينقل الاستنتاج الذي صاغه القائد في صورة سؤال يتوقع التصديق، مع الحفاظ على النفي في اليونانية.
- source_word: ὁ Αἰγύπτιος
  choice: المصري
  rationale: أداة التعريف تشير إلى شخصية معروفة بعينها، والصياغة العربية المعرّفة تؤدي هذا المعنى بوضوح.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: قبل بضعة أيام
  rationale: تعبير عربي طبيعي يفيد زمنًا قريبًا سابقًا من غير تحديد عدد الأيام.
- source_word: ἀναστατώσας
  choice: أثار ... فتنةً
  rationale: الفعل يدل هنا على إثارة اضطراب ذي طابع سياسي أو تمرد؛ و«فتنة» تنقل الاضطراب والتحريض من دون إضافة تفصيل غير مصرح به.
- source_word: ἐξαγαγὼν
  choice: قاد إلى
  rationale: يفيد قيادة جماعة إلى خارج الموضع باتجاه البرية، وتغني العربية عن التصريح بـ«إلى الخارج».
- source_word: εἰς τὴν ἔρημον
  choice: إلى البرية
  rationale: «البرية» تشمل المنطقة المقفرة غير المأهولة، ولا تحصر المعنى في صحراء رملية.
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: الرجال الأربعة الآلاف
  rationale: يحافظ التعريف على كونهم جماعة محددة معروفة مرتبطة بتلك الحادثة، كما في النص اليوناني.
- source_word: τῶν σικαρίων
  choice: من القتلة
  rationale: السياق التاريخي واللفظ المشتق من الخنجر يشيران إلى جماعة اشتهرت بالاغتيال؛ وتوضح الحاشية الاسم الحرفي والتاريخي.
