    issue: «فتنة» مقابل ἀναστατώσας
    rationale: الفعل في المقام يدل على إحداث اضطراب أو انتفاضة؛ و«تمرد» أوضح في سياق اتهام قائد عسكري بشخصية ثائرة، ولا يضيف الإيحاءات المتعددة لكلمة «فتنة».
  - severity: medium
    issue: «قاد إلى البرية» لا يترجم عنصر الإخراج في ἐξαγαγών
    rationale: المصدر يفيد أنه أخرج الرجال أو ساقهم خارجًا إلى البرية، لا مجرد أنه قادهم إليها.
  - severity: medium
    issue: «القتلة» مقابل τῶν σικαρίων
    rationale: المصطلح يحدد جماعة «السيكاريين» المرتبطة بالخناجر والاغتيالات؛ و«القتلة» وصف عام قد يطمس هذه الإحالة التاريخية والمعجمية.
