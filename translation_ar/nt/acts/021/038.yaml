revisions:
- from: إذًا، ألستَ أنت المصري الذي أثار قبل بضعة أيام فتنةً، وقاد إلى البرية الرجال الأربعة الآلاف من القتلة[a]؟
  to: إذًا، ألستَ أنت المصري الذي أثار تمردًا قبل أيام وأخرج إلى البرية أربعةَ آلافِ رجلٍ من رجال الخناجر[a]؟
  rationale: يحافظ التعديل على السؤال الاستنتاجي المنفي، وعلى الإحالة إلى المصري المعروف، وعلى عدم الجزم بمدة زمنية محددة في πρὸ τούτων τῶν ἡμερῶν عبر «قبل أيام». ويترجم «تمردًا» الاضطراب السياسي المقصود، و«أخرج إلى البرية» الفعل المركب في الأصل، فيما يقدّم «رجال الخناجر» المعنى المعجمي لـσικάριοι وتحتفظ الحاشية بالاسم التاريخي البديل.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:21:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'تحتاج الصياغة إلى تعديل محدود لزيادة الدقة: «فتنة» أوسع وقد تحمل إيحاءات دينية أو أهلية لا يقتضيها ἀναστατώσας في هذا السياق السياسي، و«قاد إلى البرية» لا يُظهر بوضوح فعل الإخراج (ἐξαγαγών). كما أن «القتلة» تعميمٌ أقل دقة من دلالة σικάριοι التاريخية المرتبطة بالخنجر.'
  naturalness: النص مفهوم وفصيح عمومًا، لكن «أثار ... فتنة» و«قاد إلى البرية» أقل سلاسة ودقة من «أثار تمردًا وأخرج إلى البرية». وتركيب «الرجال الأربعة الآلاف» سليم، والأيسر في العربية المعاصرة «أربعة آلاف رجل».
  terminology: «المصري» و«البرية» مناسبان. يُفضَّل نقل σικάριοι في المتن بعبارة «رجال الخناجر» مع إبقاء الاسم التاريخي «السيكاريين» في الحاشية، بدل «القتلة» الذي يحجب السمة المعجمية الخاصة للمصطلح.
  issues:
