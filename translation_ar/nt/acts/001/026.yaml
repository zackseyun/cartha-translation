  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: ar
  text: فألقوا قرعتهما، فوقعت القرعة على متّياس، فعُدَّ مع الرسل الأحد عشر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فعُدَّ واحدًا من الرسل الأحد عشر»، أو: «فأُضيف إلى الرسل الأحد عشر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: ألقوا قرعةً لهما
  rationale: العبارة اليونانية تعني حرفيًا «أعطوا لهما قرعًا»، لكنها اصطلاح في هذا السياق لإجراء القرعة بين المرشحين. والصياغة العربية المختارة طبيعية وتحفظ معنى وسيلة الاختيار، كما أن «لهما» يوضح عود الضمير إلى المرشحين الاثنين.
- source_word: κλήρους / ὁ κλῆρος
  choice: قرعةً / القرعة
  rationale: يدل اللفظ هنا على القرعة المستعملة للاختيار، لا على النصيب أو الميراث.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: وقعت القرعة على متّياس
  rationale: تحفظ هذه الصياغة الصورة الاصطلاحية اليونانية وتأتي عربية واضحة وطبيعية.
- source_word: Μαθθίαν
  choice: متّياس
  rationale: نقل صوتي للاسم وفق صورته اليونانية، مع تمييزه من اسم متّى.
- source_word: συγκατεψηφίσθη
  choice: حُسِب مع
  rationale: الفعل يدل على عَدِّ شخص مع جماعة أو اعتباره واحدًا منها. وتحافظ «حُسِب مع» على هذا المعنى من غير أن تضيف دلالة تعيين أو إجراء كنسي لا يصرح بها النص.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: مع الرسل الأحد عشر
  rationale: تفيد μετά مع المضاف إليه معنى «مع»، والنص يصف متّياس بأنه حُسب مع جماعة الرسل الأحد عشر.
theological_decisions:
- issue: هل تُترجم συγκατεψηφίσθη بما يوحي بتعيين إلهي أو كنسي يتجاوز الخبر السردي؟
  choice: فحُسِب مع الرسل الأحد عشر
  alternative: فأُضيف إلى الرسل الأحد عشر / فعُدَّ واحدًا من الرسل الأحد عشر
  rationale: تقرر العبارة أن متّياس صار محسوبًا مع الأحد عشر بعد وقوع القرعة عليه، من غير أن تحدد بصياغة الفعل وحده طبيعة التعيين لاهوتيًا أو طقسيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل المبني للمجهول في «حُسِب» لموافقة صيغة الفعل اليوناني، وحُفظ تتابع أحداث الآية بإيجاز. وُضعت علامة الحاشية في المتن بعد العبارة التي تشرحها.
