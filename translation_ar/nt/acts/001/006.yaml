  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: ar
  text: 'فلما اجتمعوا، سألوه قائلين: «يا رب، أفي هذا الوقت تعيد المملكة إلى إسرائيل[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لإسرائيل». يمكن فهم صيغة الداتيف في اليونانية على أنها تفيد المنفعة («لإسرائيل»)، أو، بصورة أكثر مباشرة، على أنها إعادة المملكة «إلى إسرائيل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: فلما اجتمعوا
  rationale: تؤدي «لما» وظيفة اسم الزمان للمشاركة، فتجعل الاجتماع ظرفًا سابقًا للسؤال، بينما تنقل الفاء حركة السياق التي تفيدها μὲν οὖν من غير ترجمة حرفية ثقيلة.
- source_word: ἠρώτων αὐτὸν
  choice: سألوه
  rationale: الماضي البسيط هو الأسلوب العربي الطبيعي في هذا السرد. ولا يقتضي الناقص اليوناني هنا إبراز الاستمرار بصيغة مثل «كانوا يسألونه».
- source_word: λέγοντες
  choice: قائلين
  rationale: تحافظ على بنية اسم الفاعل التي تقدم مضمون السؤال، وهي فصيحة وطبيعية في هذا السياق.
- source_word: Κύριε
  choice: يا رب
  rationale: «رب» المقابل العربي المألوف لـ κύριος، وأداة النداء لازمة طبيعيًا في الخطاب المباشر وتحفظ ما في اللقب من توقير وثقل لاهوتي.
- source_word: εἰ
  choice: أَ
  rationale: تعمل εἰ هنا أداةً لسؤال جوابه نعم أو لا، وتقابلها همزة الاستفهام في العربية، لا أداة الشرط «إن».
- source_word: ἐν τῷ χρόνῳ τούτῳ
  choice: في هذا الوقت
  rationale: تنقل العبارة على أنها تشير إلى زمن أو مرحلة حاضرة، من غير تضييقها إلى لحظة آنية فقط.
- source_word: ἀποκαθιστάνεις
  choice: تعيد
  rationale: يفيد الفعل رد الشيء إلى حال سابقة. و«تعيد» واضحة ومباشرة، كما تلائم صيغة السؤال عن الفعل الجاري أو الوشيك في هذا الوقت.
- source_word: τὴν βασιλείαν
  choice: المملكة
  rationale: قد تدل βασιλεία على المُلك أو السلطان أو المملكة، لكن اقترانها هنا بإسرائيل يبرز توقعًا ذا صورة قومية ملموسة؛ و«المملكة» تحفظ ذلك من غير تفسير طبيعته سياسيًا أو روحيًا.
- source_word: τῷ Ἰσραήλ
  choice: إلى إسرائيل
  rationale: تحفظ «إلى» القراءة المباشرة التي تجعل إسرائيل متلقيًا للمملكة المعادة، مع بيان احتمال دلالة المنفعة «لإسرائيل» في الحاشية.
theological_decisions:
- issue: طبيعة توقع التلاميذ بشأن مملكة إسرائيل
  choice: صياغة السؤال بوصفه إعادة «المملكة إلى إسرائيل» من غير تفسير لطبيعة المملكة
  alternative: «تعيد المملكة لإسرائيل» أو «تعيد مُلك إسرائيل»
  rationale: الآية تورد سؤال التلاميذ ولا تحسم في ذاتها هل كان توقعهم سياسيًا أم روحيًا، ولا مقدار تصحيح يسوع لافتراضاتهم؛ لذلك تُحفظ هذه المسافة والتوتر اللاهوتي بدل حسمهما في الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُخدمت «فلما» لربط الاجتماع بالسؤال بسلاسة، ووضعت علامة الحاشية بعد «إسرائيل» لأنها تتعلق بدلالة العبارة اليونانية τῷ Ἰσραήλ.
