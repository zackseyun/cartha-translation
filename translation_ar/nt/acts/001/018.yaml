  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: ar
  text: فهذا إذًا اقتنى حقلًا من أجرة الظلم[a]، وإذ صار منكبًّا[b] انشقّ من وسطه، وانسكبت أحشاؤه كلّها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من جزاء الشر». ويمكن ترجمة التعبير بمعنى أكثر سلاسة: «بالمال الذي ناله من الظلم»، لكن «من أجرة الظلم» أقرب إلى صياغة اليونانية.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «إذ صار منكبًّا». وقد تُفهم العبارة أيضًا بمعنى «إذ وقع ووجهه إلى الأرض» أو «إذ سقط إلى الأمام»؛ ولا يحدد النص كيفية حدوث ذلك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: فهذا إذًا
  rationale: يحيل اسم الإشارة إلى يهوذا، وتؤدي الفاء مع «إذًا» معنى الاستمرار والاستنتاج في السياق من غير إثقال العبارة.
- source_word: ἐκτήσατο
  choice: اقتنى
  rationale: يفيد الفعل نيل الملك أو الحيازة، وهو أوسع من «اشترى»، فلا يفرض أن يهوذا أجرى الشراء بنفسه.
- source_word: χωρίον
  choice: حقلًا
  rationale: ترجمة مباشرة وطبيعية لقطعة الأرض المقصودة في السياق.
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: من أجرة الظلم
  rationale: تحافظ «من» على دلالة ἐκ، و«أجرة الظلم» على الصورة الأخلاقية المكثفة في الأصل، مع إمكان فهمها بوصفها المال الناتج من فعل آثم.
- source_word: πρηνὴς γενόμενος
  choice: سقط على وجهه
  rationale: صياغة عربية واضحة تعبّر عن صيرورته منكبًّا أو سقوطه إلى الأمام، من دون الجزم بتفصيل يتجاوز العبارة اليونانية.
- source_word: ἐλάκησεν μέσος
  choice: فانشقّ من وسطه
  rationale: ينقل معنى التصدع أو الانفلاق في الوسط بعبارة عربية طبيعية وواضحة.
- source_word: ἐξεχύθη
  choice: انسكبت
  rationale: ينقل المبني للمجهول ومعنى خروج المحتويات وانصبابها.
- source_word: πάντα τὰ σπλάγχνα αὐτοῦ
  choice: أحشاؤه كلّها
  rationale: «الأحشاء» مقابل عربي دقيق وطبيعي للأعضاء الداخلية، وأقل تضييقًا من «الأمعاء».
theological_decisions:
- issue: صلة يهوذا باقتناء الحقل
  choice: ترجمة ἐκτήσατο بـ«اقتنى»
  alternative: «اشترى» الحقل بنفسه، أو اقتُني الحقل باسمه أو بماله
  rationale: «اقتنى» تثبت نسبة الحيازة إليه من غير تحديد آلية الشراء، فتحفظ التوتر مع متى 27:5–8 بدل حلّه داخل الترجمة.
- issue: هيئة سقوط يهوذا
  choice: «سقط على وجهه»
  alternative: «سقط على رأسه» أو «صار منكبًّا»
  rationale: الأصل يدل على وضع منكب أو سقوط إلى الأمام، ولا يستلزم بالضرورة إصابة الرأس أولًا؛ لذا تُحفظ مساحة الدلالة.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم «اقتنى» بدل «اشترى» لصون اتساع الأصل، و«أحشاؤه» بدل تعبير طبي أضيق. وُضعت علامتا الحاشيتين في موضعهما داخل النص.
