  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: ar
  text: ولهؤلاء أيضًا أظهر نفسه حيًّا بعد أن تألّم، ببراهين كثيرة[a]، إذ كان يظهر لهم على مدى أربعين يومًا[b] ويتحدّث عمّا يختصّ بملكوت الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأدلة كثيرة» أو «بأدلة كثيرة قاطعة». تدل الكلمة اليونانية على دليل يثبت الأمر ويورث اليقين.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «خلال أربعين يومًا» أو «طوال أربعين يومًا». يفيد التعبير ظهورات وقعت عبر تلك المدة، لا ظهورًا متواصلًا بلا انقطاع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: لهؤلاء
  rationale: ضمير موصول في حالة الجر يعود إلى الرسل المذكورين في الآية السابقة. «لهؤلاء» يحافظ على الإحالة من غير إضافة لفظ «الرجال» غير الوارد صراحة في اليونانية.
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: أظهر نفسه حيًّا
  rationale: ينقل معنى إظهار المرء نفسه، مع إبقاء «حيًّا» خبرًا لحال يسوع بعد آلامه. وهو تعبير عربي طبيعي أوضح من «قدّم نفسه» في هذا السياق.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: بعد أن تألّم
  rationale: التركيب يفيد الترتيب الزمني، وتبقى طبيعة الآلام غير مفصّلة كما في النص اليوناني.
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: ببراهين كثيرة
  rationale: تفيد τεκμήριον دليلًا مثبتًا يورث اليقين، و«براهين» تؤدي هذه القوة الإثباتية مع إبقاء ἐν على معناها الوسيلي هنا.
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: على مدى أربعين يومًا
  rationale: تفيد διά مع المضاف إليه امتداد الظهورات خلال هذه المدة، لا ظهورًا متواصلًا بلا انقطاع.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: كان يظهر لهم
  rationale: الفعل في سياق القيامة يعني الظهور للآخرين، والصياغة العربية تبيّن تكرر الظهورات ضمن المدة المذكورة.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: ويتحدّث عمّا يختصّ بملكوت الله
  rationale: ينقل اصطلاح τὰ περὶ بمعنى الأمور المتعلقة بموضوع ما، مع صياغة عربية واضحة وطبيعية.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي راسخ يحتمل دلالة سلطان الله الملكي ومجال حكمه، فلا يحصر اللفظ في أحد الجانبين.
theological_decisions:
- issue: القيامة والقوة الإثباتية للظهورات
  choice: أظهر نفسه حيًّا بعد أن تألّم، ببراهين كثيرة
  alternative: أظهر نفسه بعد آلامه بأدلة كثيرة مقنعة
  rationale: يصرّح النص بحياة يسوع بعد آلامه وبوجود براهين متعددة، من غير إضافة وصف مثل «معصومة من الخطأ» أو تفصيل طبيعة الآلام.
- issue: دلالة ملكوت الله
  choice: ملكوت الله
  alternative: مُلك الله أو حكم الله
  rationale: «ملكوت» يحافظ على المجال الدلالي الواسع لـβασιλεία، الذي قد يشمل الحكم الملكي ومجاله، من غير حسم التوتر لصالح معنى واحد.
- issue: مرجع οἷς من جهة الجنس
  choice: لهؤلاء
  alternative: لهؤلاء الرجال
  rationale: السياق يحيل إلى الرسل، لكن اليونانية لا تذكر اسمًا مذكرًا في هذا الموضع؛ لذلك لا تُضاف كلمة «الرجال» إلى النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أظهر نفسه حيًّا» بدل النقل الحرفي غير الطبيعي «قدّم نفسه حيًّا»، و«على مدى» لتوضيح امتداد الظهورات خلال الفترة. حُفظ المصطلح الكتابي الشائع «ملكوت الله» مع سعته الدلالية.
