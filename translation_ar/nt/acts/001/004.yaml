  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: ar
  text: وبينما كان مجتمعًا معهم[a]، أمرهم ألّا يغادروا أورشليم، بل أن ينتظروا وعد الآب الذي سمعتموه مني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مقيمًا معهم»؛ ويفهم بعضهم العبارة بمعنى: «آكلًا معهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: فيما كان مجتمعًا معهم
  rationale: يفيد السياق كونه حاضرًا مع الرسل، وهذه الصياغة عربية طبيعية وتحفظ المعنى العام من غير حسم الدلالة الخلافية في الأكل معهم؛ وتُذكر البدائل في الحاشية.
- source_word: παρήγγειλεν
  choice: أمرهم
  rationale: ينقل فعلًا توجيهيًا ذا سلطان، وهو أقوى وأدق هنا من «أوصاهم» أو «طلب منهم».
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: ألّا يغادروا أورشليم
  rationale: ينقل المقصود المكاني بوضوح وطبيعية، بدل الترجمة الحرفية الثقيلة «ألّا ينفصلوا عن أورشليم».
- source_word: περιμένειν
  choice: أن ينتظروا
  rationale: صياغة عربية واضحة تحفظ معنى الترقب إلى أن يتحقق الموعود.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: وعد الآب
  rationale: يحافظ على تركيب المصدر دون إضافة «العطية» أو تعيين مضمون الوعد من داخل هذه العبارة.
- source_word: ἣν ἠκούσατέ μου
  choice: الذي سمعوه منه
  rationale: ينقل دلالة الضمير مع فعل السماع بإيجاز، مع تحويل الخطاب إلى الغائب بما يلائم صدر الجملة العربية الذي يروي أمره لهم.
theological_decisions:
- issue: دلالة συναλιζόμενος في وصف نشاط يسوع بعد القيامة
  choice: مجتمعًا معهم
  alternative: مقيمًا معهم؛ أو آكلًا معهم
  rationale: الصياغة المختارة تثبت وجوده معهم من غير أن تجعل الأكل معنى مؤكدًا للفعل المختلف في دلالته. ويُحفظ الاحتمال الأخص في الحاشية، فلا تُحلّ المسألة المعجمية ضمنًا على أساس لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أورشليم» و«الآب» وفق السجل الكتابي العربي المألوف، مع تجنب التراكيب الحرفية الثقيلة والحفاظ على الغموض المعجمي الحقيقي في الحاشية.
