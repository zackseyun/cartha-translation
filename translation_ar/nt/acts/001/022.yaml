base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: ar
  text: ابتداءً من معمودية يوحنا إلى اليوم الذي رُفع فيه عنا، لا بدّ أن يصير واحد من هؤلاء شاهدًا معنا بقيامته.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شاهدًا معنا على قيامته».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: ابتداءً من معمودية يوحنا
  rationale: يحفظ التركيب الزمني الممتد من نقطة بداية إلى نهاية، ويعبّر عن الإضافة اليونانية بصياغة عربية واضحة من غير حسم ما إذا كان المقصود فعل يوحنا في التعميد أو الحدث المرتبط به.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: إلى اليوم الذي
  rationale: صياغة عربية طبيعية تحافظ على الحد الزمني وعلى صلة الموصول في الأصل.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: رُفع فيه عنّا
  rationale: يحفظ المبني للمجهول وإيحاء الارتفاع في الفعل، من غير إضافة «إلى السماء» غير الواردة في هذه العبارة.
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: شاهدًا ... لقيامته
  rationale: اللام بعد «شاهد» عربية طبيعية للتعبير عن موضوع الشهادة، مع الحفاظ على أن القيامة هي محور الشهادة.
- source_word: σὺν ἡμῖν γενέσθαι
  choice: يصير ... شاهدًا معنا
  rationale: ينقل معنى الصيرورة والانضمام إلى جماعة الشهود، ويضع «معنا» قرب «شاهدًا» بوضوح وسلاسة.
- source_word: ἕνα τούτων
  choice: واحد من هؤلاء
  rationale: ترجمة مباشرة لا تضيف اسمًا مثل «الرجال»، إذ يُفهم المرجع من السياق السابق.
theological_decisions:
- issue: استكمال معنى الضرورة الحاكم من الآية السابقة
  choice: لا بدّ أن يصير
  alternative: أن يصير
  rationale: المصدر γενέσθαι متعلق بـ δεῖ في العدد 21؛ وإظهار معنى الوجوب ضروري لاكتمال الجملة العربية ولا يضيف معنى جديدًا.
- issue: الإشارة إلى صعود يسوع
  choice: رُفع فيه عنّا
  alternative: صعد إلى السماء
  rationale: يحافظ الاختيار على المبني للمجهول وعلى دلالة الرفع، ولا يوسّع العبارة بإضافة وجهة ليست مذكورة صراحة هنا.
- issue: علاقة الشاهد بالقيامة
  choice: شاهدًا معنا لقيامته
  alternative: شاهدًا معنا على قيامته
  rationale: «لقيامته» صياغة عربية سليمة وقريبة من الإضافة اليونانية، بينما «على قيامته» قد توحي بدرجة أكبر بصياغة شهادة قضائية؛ وتُذكر في الحاشية صياغة بديلة شائعة.
translation_notes:
  register: فصحى معاصرة واضحة ورصينة. حافظت الصياغة على اعتماد العدد نحويًا على ما قبله بإظهار «لا بدّ»، وعلى المبني للمجهول في حدث الرفع، وتجنبت إضافة تفاصيل عقائدية غير مصرّح بها في النص.
