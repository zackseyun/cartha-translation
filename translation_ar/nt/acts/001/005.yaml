id: ACT.1.5
reference: Acts 1:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: ar
  text: لأن يوحنا عمَّد بالماء، أما أنتم فستُعمَّدون في الروح القدس[a] بعد أيام قليلة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالروح القدس». يمكن أن يُفهم حرف الجر اليوناني بمعنى «في» أو «بـ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تؤدي هنا وظيفة تفسيرية تعليلية تربط القول بما سبقه، وهي صياغة عربية طبيعية في السياق.
- source_word: ἐβάπτισεν
  choice: عمَّد
  rationale: يحافظ الفعل على المصطلح الديني المستقر من غير أن يحسم كيفية المعمودية بإقحام معنى «غمس».
- source_word: ὕδατι
  choice: بالماء
  rationale: صيغة الداتيف هنا تحتمل معنى الوسيلة، وتؤديه الباء العربية طبيعيًا، مع إبراز المقابلة مع العبارة التالية.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: في الروح القدس
  rationale: تحافظ «في» على دلالة حرف الجر اليوناني بصورة شفافة، وتبقي مفتوحًا التوتر الدلالي بين المجال والوسيلة؛ وتوضح الحاشية البديل الممكن.
- source_word: βαπτισθήσεσθε
  choice: فستُعمَّدون
  rationale: تنقل صيغة المستقبل المبني للمجهول وتحافظ على الصلة اللفظية بمعمودية يوحنا، من غير التصريح بالفاعل الذي تركه النص ضمنيًا.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: بعد أيام قليلة
  rationale: تعبير عربي واضح وطبيعي ينقل أن الحدث قريب، بدل الترجمة الحرفية الثقيلة «ليس بعد أيام كثيرة هذه».
theological_decisions:
- issue: ترجمة ἐν πνεύματι ἁγίῳ في صيغة المعمودية الحساسة لاهوتيًا
  choice: في الروح القدس
  alternative: بالروح القدس
  rationale: قد يدل ἐν على المجال أو على الوسيلة. لذلك تُبقي الترجمة الأساسية «في» هذا الاحتمال مفتوحًا، بينما تُذكر «بـ» في الحاشية من غير ترجيح مذهبي.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعملت المقابلة الطبيعية «أما أنتم» لنقل μὲν...δὲ، وحُفظ المصطلح الكتابي «عمَّد» من غير تقييده بكيفية طقسية معينة.
