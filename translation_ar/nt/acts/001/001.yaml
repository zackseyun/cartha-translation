  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: ar
  text: في السرد الأول[a]، يا ثاوفيلس، كتبتُ عن كل ما بدأ يسوع يفعله ويعلّمه،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في السرد السابق»، أو «في الكتاب الأول».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: في الخبر الأول
  rationale: يدل λόγος هنا على مؤلَّف سردي مكتوب، لا على «كلمة» مفردة. و«الخبر الأول» تعبير عربي واضح يحفظ القوة الترتيبية لـ πρῶτον، بينما تُفهم μέν من افتتاح المقابلة السياقية مع الكتاب الحالي.
- source_word: ἐποιησάμην
  choice: كتبتُ
  rationale: مع λόγον يفيد الفعل اصطلاحيًا إنشاء مؤلَّف مكتوب؛ و«كتبتُ» أوضح مقابل عربي طبيعي في هذا السياق.
- source_word: περὶ πάντων ... ὧν
  choice: عن كل ما
  rationale: يجمع هذا التركيب العربي بين περί مع المضاف إليه والضمير الموصول، ويحفظ نطاق العبارة من غير ادعاء استقصاء مطلق خارج حدود السرد.
- source_word: ὦ Θεόφιλε
  choice: يا ثاوفيلس
  rationale: «يا» أداة النداء العربية الطبيعية المقابلة لـ ὦ، من غير إضافة مودة غير مصرّح بها في الأصل.
- source_word: ἤρξατο
  choice: بدأ
  rationale: يحفظ المعنى الصريح للفعل وإمكان دلالته على استمرار عمل يسوع في سفر الأعمال، من غير شرح هذا الاستلزام داخل الترجمة.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المعيارية الراسخة للاسم الشخصي.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: يفعله ويعلّمه
  rationale: يحفظ اقتران الفعل والتعليم في τε καί، مع صياغة عربية سلسة؛ وعودة الضميرين إلى «ما» تُظهر أن العبارة تشمل ما فعله يسوع وما علّمه.
theological_decisions:
- issue: دلالة ἤρξατο («بدأ») على استمرار عمل يسوع في سفر الأعمال
  choice: إبقاء «بدأ» في النص من غير تفسير الاستمرار
  alternative: حذف معنى البدء بترجمة «كل ما فعله يسوع وعلّمه»، أو التصريح بأنه واصل عمله بواسطة رسله
  rationale: الأصل اليوناني يذكر البدء صراحة. وقد يوحي باستمرار عمل يسوع، لكن ينبغي حفظ هذا التوتر اللاهوتي وعدم حسمه بإعادة صياغة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يا» بدل النقل الحرفي القديم لأداة النداء، وحُفظ «بدأ» لما له من وزن نصي ولاهوتي. «الخبر» هنا بمعنى الرواية أو السرد المكتوب، وتوضح الحاشية البدائل الممكنة.
