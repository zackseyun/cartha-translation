source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: ar
  text: 'وقالا أيضًا: «يا رجال الجليل، لماذا تقفون ناظرين إلى السماء؟ هذا يسوع[a]، الذي رُفع عنكم إلى السماء، سيأتي هكذا، كما رأيتموه ذاهبًا إلى السماء».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحسب الصياغة التقليدية: «هذا يسوع نفسه». تقول اليونانية صراحة: «هذا يسوع»؛ أما إضافة «نفسه» فهي توسعة تفسيرية تؤكد تطابق الهوية.'
    reason: بديل معجمي
lexical_decisions:
- source_word: οἳ καὶ εἶπαν
  choice: وقالا أيضًا
  rationale: الضمير الموصول بصيغة الجمع يعود في السياق إلى الرجلين المذكورين في الآية السابقة، ولذلك استُعمل المثنى العربي الطبيعي، مع نقل καί بـ«أيضًا».
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: يا رجال الجليل
  rationale: يحافظ على صيغة النداء المذكرة وعلى نسبة المخاطَبين إلى الجليل، بعبارة عربية واضحة وطبيعية.
- source_word: τί ἑστήκατε βλέποντες
  choice: لماذا تقفون ناظرين
  rationale: للفعل التام ἑστήκατε قوة الحالة الحاضرة، واسم الفاعل βλέποντες يصف الفعل المصاحب؛ والصياغة تنقل العنصرين دون تقوية معنى النظر إلى «التحديق».
- source_word: εἰς τὸν οὐρανόν
  choice: إلى السماء
  rationale: «السماء» أنسب في سياق الصعود، وحرف «إلى» ينقل اتجاه εἰς طبيعيًا في العربية من غير افتعال.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: يسوع هذا
  rationale: ينقل اسم الإشارة الصريح ويحافظ على إبراز هوية يسوع المقصود، دون إضافة لفظ «نفسه» غير الموجود صراحة في اليونانية.
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: الذي رُفع عنكم
  rationale: المبني للمجهول يحفظ صيغة ἀναλημφθείς، و«رُفع» يلائم سياق الصعود، بينما تنقل «عنكم» معنى الانفصال في ἀφ’ ὑμῶν.
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: سيأتي هكذا، كما
  rationale: تحفظ الصياغة دلالة الكيفية والمقارنة في οὕτως وὃν τρόπον بأسلوب عربي موجز وطبيعي.
- source_word: ἐθεάσασθε αὐτὸν πορευόμενον
  choice: رأيتموه ذاهبًا
  rationale: «رأيتموه» واضحة ولا تبالغ في دلالة المشاهدة، و«ذاهبًا» تنقل حركة اسم الفاعل πορευόμενον.
theological_decisions:
- issue: دلالة οὐρανός في سياق الصعود والعودة
  choice: السماء
  alternative: الجو أو فضاء السماء المنظور
  rationale: يمكن للكلمة أن تدل على السماء المنظورة أو السماء بوصفها المقام العلوي، لكن سياق صعود يسوع ووعد عودته يرجّح «السماء» بما يحفظ البعد السردي واللاهوتي دون زيادة.
- issue: ترجمة οὗτος ὁ Ἰησοῦς
  choice: يسوع هذا
  alternative: يسوع نفسه هذا / يسوع هذا نفسه
  rationale: اليونانية تصرّح باسم الإشارة ولا تتضمن لفظًا مستقلًا بمعنى «نفسه». أُبقيت الصياغة الأقرب في المتن، مع ذكر الترجمة التقليدية التفسيرية في الحاشية.
- issue: كيفية عودة يسوع في οὕτως ... ὃν τρόπον
  choice: سيأتي هكذا، كما رأيتموه ذاهبًا
  alternative: سيأتي بالطريقة نفسها التي رأيتموه يذهب بها
  rationale: تحفظ الصياغة المقارنة المتعلقة بكيفية المجيء من غير تحديد تفاصيل تتجاوز ما يقوله النص.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل المثنى في «قالا» مراعاةً لمرجع الضمير في السياق السابق، مع الحفاظ على التراكيب اليونانية الأساسية من غير جمود حرفي.
