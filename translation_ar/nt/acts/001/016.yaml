base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: ar
  text: «أيها الرجال الإخوة، كان لا بد أن يتمّ ما ورد في الكتاب، الذي سبق أن قاله الروح القدس على لسان داود عن يهوذا، الذي صار دليلًا للذين قبضوا على يسوع[a].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمسكوا بيسوع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: أيها الرجال الإخوة
  rationale: يحافظ على عنصري النداء المذكرين في اليونانية بدل اختزالهما في «أيها الإخوة»، مع صياغة عربية واضحة ذات طابع خطابي.
- source_word: ἔδει
  choice: كان لا بد
  rationale: ينقل معنى الضرورة في الفعل الناقص غير الشخصي بصياغة عربية طبيعية، من غير تحديد مصدر الضرورة بما يتجاوز النص.
- source_word: πληρωθῆναι τὴν γραφὴν
  choice: أن يتمّ ما جاء في الكتاب
  rationale: ينقل معنى بلوغ القول الكتابي تمامه، ويتجنب العبارة العربية الملتبسة «يتم الكتاب» التي قد توحي بإكمال الكتاب كله.
- source_word: προεῖπε
  choice: سبق ... فقاله
  rationale: يحافظ على دلالة القول السابق، من غير حصر الفعل في معنى التنبؤ التقني.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: المقابل العربي المعاصر المألوف والدقيق.
- source_word: διὰ στόματος Δαυὶδ
  choice: على لسان داود
  rationale: تعبير عربي طبيعي يحفظ صورة الفم بوصف داود الوسيط البشري للكلام.
- source_word: περὶ Ἰούδα
  choice: عن يهوذا
  rationale: ينقل موضوع الكلام بوضوح وإيجاز.
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: الذي صار دليلًا
  rationale: يحفظ معنى «صار» وعدم تعريف «دليل» في الأصل.
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: للذين قبضوا على يسوع
  rationale: «قبضوا على» تعبير عربي واضح في سياق الاعتقال، مع إثبات البديل «أمسكوا بيسوع» في الحاشية.
theological_decisions:
- issue: طبيعة ضرورة إتمام الكتاب
  choice: كان لا بد أن يتمّ ما جاء في الكتاب
  alternative: كان ينبغي أن يتمّ الكتاب بسبب تقدير إلهي سابق
  rationale: يثبت النص الضرورة، لكنه لا يشرح هنا آليتها أو يحسم العلاقة بين العلم السابق والفعل البشري؛ لذلك لا تضيف الترجمة تفسيرًا عقديًا.
- issue: الفاعلية في الوحي
  choice: الذي سبق الروح القدس فقاله على لسان داود
  alternative: الذي قاله داود بإلهام الروح القدس
  rationale: يحافظ على كون الروح القدس هو المتكلم نحويًا، وعلى كون داود الوسيط البشري، كما في ترتيب الوكالة في اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. حُفظ النداء الذكوري المركب في الأصل، واستُعمل «على لسان داود» بوصفه تعبيرًا عربيًا طبيعيًا. وُضعت علامة الحاشية [a] في المتن مطابقة للحاشية الوحيدة.
