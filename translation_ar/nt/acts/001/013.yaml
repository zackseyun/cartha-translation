base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: ar
  text: 'ولمّا دخلوا، صعدوا إلى الغرفة التي في الطابق العلوي حيث كانوا يقيمون: بطرس ويوحنا ويعقوب وأندراوس، وفيلبس وتوما، وبرثولماوس ومتّى، ويعقوب بن حلفى، وسمعان الغيور، ويهوذا بن يعقوب[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يهوذا أخو يعقوب». لا يذكر النص اليوناني نوع العلاقة صراحةً، بل يورد اسم «يعقوب» بعد «يهوذا» بصيغة إضافة.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: دخلوا
  rationale: الفعل الماضي في جملة زمنية يدل على دخولهم قبل صعودهم، وتسلسل الفعلين واضح طبيعيًا في العربية من دون حاجة إلى تركيب ماضٍ أسبق.
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: صعدوا إلى الغرفة التي في الطابق العلوي
  rationale: يحفظ التعبير حركة الصعود ودلالة ὑπερῷον المكانية، بلغة عربية واضحة لا تستدعي إيحاءات اصطلاحية زائدة.
- source_word: οὗ ἦσαν καταμένοντες
  choice: حيث كانوا يقيمون
  rationale: ينقل الاستمرار في المكوث الذي يفيده التركيب اليوناني، و«يقيمون» طبيعية في سياق السكن المؤقت أو المكث.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: يعقوب بن حلفى
  rationale: يفهم المضاف إليه هنا على أنه اسم الأب، وهو التعريف الطبيعي للشخص في هذه القائمة.
- source_word: Σίμων ὁ ζηλωτὴς
  choice: سمعان الغيور
  rationale: ينقل اللقب اليوناني بلفظ عربي مفهوم، من غير استيراد صيغة مختلفة من قوائم الأناجيل.
- source_word: Ἰούδας Ἰακώβου
  choice: يهوذا بن يعقوب
  rationale: الأرجح في سياق قائمة الأسماء أن الإضافة نَسَبٌ إلى الأب، مع إبقاء احتمال الأخوّة في الحاشية لأن اليونانية لا تصرّح بنوع العلاقة.
theological_decisions:
- issue: نوع العلاقة في Ἰούδας Ἰακώβου
  choice: يهوذا بن يعقوب
  alternative: يهوذا أخو يعقوب
  rationale: تحديد الشخص باسم أبيه هو الأرجح في سياق القائمة، لكن صيغة الإضافة اليونانية نفسها لا تذكر «ابن» ولا «أخ»، لذلك حُفظ البديل في الحاشية بدل حسم الغموض النصي تمامًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «الغرفة التي في الطابق العلوي» لإيضاح المعنى المعماري من غير تحميل العبارة ارتباطات كنسية لاحقة، وحُفظ إيقاع القائمة بأسماء موصولة على نحو طبيعي في العربية.
