    reason: lexical_alternative
  - marker: b
    text: قد يكون النداء «يا رب» موجَّهًا إلى الله عمومًا أو إلى يسوع بوجه خاص؛ ولا يحدد النص اليوناني المقصود صراحة.
    reason: alternative_reading
lexical_decisions:
- source_word: προσευξάμενοι
  choice: ثم صلّوا
  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل طبيعيًا على فعل سبق القول؛ وتؤدي «ثم صلّوا وقالوا» هذا التتابع بلغة عربية واضحة.
- source_word: Σὺ κύριε
  choice: أنت يا رب
  rationale: يحافظ الضمير المنفصل «أنت» على التوكيد الموجود في النص، وتؤدي «يا رب» النداء بصورة عربية طبيعية ومهيبة.
- source_word: καρδιογνῶστα πάντων
  choice: يا عارف قلوب الجميع
  rationale: يحافظ التعبير على لقب النداء المفرد وعلى معنى معرفة قلوب جميع الناس، من غير تسطيح دلالة الاسم المركب.
- source_word: ἀνάδειξον
  choice: أظهر
  rationale: يناسب السياق الذي يطلب فيه المصلّون إعلان الشخص الذي وقع عليه الاختيار، من غير أن يحدد أن الفعل نفسه يعني التنصيب الرسمي.
- source_word: ὃν ἐξελέξω
  choice: أيَّ واحدٍ ... اخترت
  rationale: تفيد العبارة أن الرب سبق أن اختار واحدًا، وأن المطلوب الآن إظهار هويته؛ وصيغة الماضي العربية طبيعية وتحفظ هذا المعنى.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: أيَّ واحدٍ من هذين الاثنين
  rationale: تنقل الاختيار من بين المرشحين الاثنين من غير إضافة كلمة «رجلين» غير الواردة صراحة في هذه الآية.
theological_decisions:
- issue: مرجع لقب «الرب» في الصلاة
  choice: الإبقاء على النداء «يا رب» من غير تعيين المقصود
  alternative: قد يُفهم النداء على أنه موجَّه إلى الله عمومًا، أو إلى يسوع القائم بوجه خاص
  rationale: لا يحدد النص اليوناني المرجع صراحة، لذلك يحفظ النقل غموض النص والتوتر التفسيري من غير فرض حسم لاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «يا عارف قلوب الجميع» للحفاظ على صيغة النداء واللقب، وأُبقي مرجع «الرب» غير محسوم كما في الأصل.
