  text: 'فقدَّموا اثنين: يوسف المدعو برسابا، الذي دُعي أيضًا يوستس، ومتياس.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أقاموا اثنين» أو «أحضروا اثنين». يمكن للفعل اليوناني أن يعني وضع أشخاص أمام جماعة، ويُرجَّح هنا أنه يشير إلى تقديمهما مرشَّحين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: قدَّموا
  rationale: يفيد الفعل هنا وضع الشخصين أمام الجماعة بوصفهما مرشَّحين في سياق الاختيار، لا مجرد إيقافهما جسديًّا ولا تعيينهما تعيينًا نهائيًّا.
- source_word: δύο
  choice: اثنين
  rationale: نقل مباشر للعدد الذي يشير إلى الرجلين المقدَّمين.
- source_word: καλούμενον
  choice: المدعو
  rationale: يعرّف يوسف باسم إضافي، وصيغة «المدعو» عربية طبيعية وموجزة.
- source_word: Βαρσαββᾶν
  choice: برسابا
  rationale: نقل صوتي للاسم وفق الصيغة العربية الكتابية الشائعة.
- source_word: ἐπεκλήθη
  choice: دُعي أيضًا
  rationale: يقدّم اسمًا آخر ليوسف؛ و«أيضًا» توضّح طبيعيًّا صلة هذا الاسم بالاسم السابق من غير إضافة معنى جديد.
- source_word: Ἰοῦστος
  choice: يوستس
  rationale: نقل صوتي للاسم اليوناني/اللاتيني مع تمييزه عن الصفة العربية «عادل».
- source_word: Μαθθίαν
  choice: متياس
  rationale: نقل صوتي للاسم وفق الصيغة العربية الكتابية الشائعة.
- source_word: καὶ ... καὶ
  choice: فـ ... و
  rationale: الفاء تصل الحدث بالسياق السردي السابق، والواو تنسّق بين المرشحين.
