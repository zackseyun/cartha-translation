    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: ثم
  rationale: أداة ربط زمنية طبيعية تتابع أحداث السرد من غير زيادة تفسيرية.
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλήμ
  choice: رجعوا إلى أورشليم
  rationale: ينقل الفعل الدال على العودة وحرف الاتجاه بصياغة عربية واضحة ومألوفة.
- source_word: ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος
  choice: من الجبل الذي يُدعى جبل الزيتون
  rationale: يحافظ على كون الموضع جبلًا ذا اسم معروف، ويقدّم الاسم التقليدي الشفاف للقارئ العربي.
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλήμ
  choice: وهو قريب من أورشليم
  rationale: ترجمة مباشرة وواضحة لجملة الصلة الدالة على قرب الموضع.
- source_word: σαββάτου ἔχον ὁδόν
  choice: على بُعد مسيرة يوم سبت منها
  rationale: ينقل التعبير اليهودي عن المسافة بصياغة عربية طبيعية، مع إبقاء إطاره الثقافي وشرحه في الحاشية.
theological_decisions:
- issue: التعبير اليهودي σαββάτου ἔχον ὁδόν
  choice: على بُعد مسيرة يوم سبت منها
  alternative: على مسافة يُسمح بقطعها يوم السبت
  rationale: الاختيار يحفظ العبارة الثقافية الواردة في النص ولا يستبدلها بتفسير داخل المتن، بينما توضح الحاشية معناها العرفي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «أورشليم» و«جبل الزيتون» لرسوخهما في الاستعمال الكتابي العربي، مع تجنب الأسلوب الحرفي المتعثر في العبارة الأخيرة.
