  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: ar
  text: ثم رجعوا إلى أورشليم من الجبل المسمّى جبل الزيتون، وهو قريب من أورشليم، على بُعد مسيرة يوم سبت منها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
