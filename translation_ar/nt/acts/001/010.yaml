lexical_decisions:
- source_word: ἀτενίζοντες
  choice: ينظرون بإمعان
  rationale: ينقل التعبير ثبات النظر وتركيزه واستمراره، من غير مبالغة توحي بمجرد التحديق المندهش.
- source_word: οὐρανόν
  choice: السماء
  rationale: «السماء» هي المقابل العربي الطبيعي الذي يلائم سياق الصعود، مع بقائها قابلة للدلالة على الفضاء العلوي المرئي بحسب السياق.
- source_word: πορευομένου αὐτοῦ
  choice: وهو ذاهب
  rationale: يحافظ على تزامن الذهاب مع نظرهم، ولا يضيف إلى الحركة وصفًا مثل الصعود أو الاختفاء غير وارد في هذه العبارة نفسها.
- source_word: ἰδοὺ
  choice: إذا
  rationale: تؤدي «إذا» الفجائية وظيفة لفت الانتباه إلى المشهد التالي بأسلوب عربي فصيح طبيعي، من غير إضافة معنى زمني صريح مثل «فجأة».
- source_word: ἄνδρες δύο
  choice: رجلان
  rationale: يحافظ على الدلالة الصريحة للاسم اليوناني وعلى العدد، ولا يستبدل به هوية ملائكية يستدل عليها من السياق ولا يصرح بها هذا العدد.
- source_word: παρειστήκεισαν
  choice: قد وقفا بجانبهم
  rationale: ينقل وجود الرجلين قائمين بمحاذاتهم، ويتجنب ترجمة الفعل بما يفيد الظهور الخارق، وهو معنى لا يصرح به الفعل.
- source_word: ἐσθήσεσι λευκαῖς
  choice: بثياب بيضاء
  rationale: «ثياب» لفظ عربي عام وطبيعي للملابس، فلا يخصص نوعها بأنها أردية مع أن اليونانية لا تفرض هذا التحديد.
theological_decisions:
- issue: دلالة οὐρανός في سياق الصعود
  choice: السماء
  alternative: الفضاء
  rationale: تلائم «السماء» الأفق اللاهوتي لسياق صعود يسوع، وهي في الوقت نفسه لا تحسم وحدها إن كان المقصود السماء بوصفها مقامًا إلهيًا أم السماء المنظورة؛ وتوضح الحاشية البديل المعجمي.
- issue: هوية الرجلين
  choice: رجلان
  alternative: ملاكان
  rationale: يقول النص اليوناني «رجلان» ولا يسميهما ملاكين في هذه الآية، لذلك تُحفظ عبارته الظاهرة وتُترك دلالة هويتهما للسياق.
translation_notes:
  register: صياغة عربية فصحى واضحة ووقورة. استُعملت «إذا» بوصفها أداة سردية تلفت النظر، و«ينظرون بإمعان» لإظهار شدة النظر من غير اللجوء إلى تعبير قد يبدو عاميًا أو مفرطًا. حُفظت إحالتا الحاشيتين [a] و[b] في موضعيهما من المتن.
