source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: ar
  text: لكنكم ستنالون قوةً حين يحلّ الروح القدس عليكم، وتكونون لي شهودًا في أورشليم، وفي اليهودية كلها والسامرة، وإلى أقصى الأرض.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى أقاصي الأرض». العبارة اليونانية مفردة حرفيًا: «إلى أقصى الأرض»، لكنها تُستعمل للدلالة على أبعد مدى في الأرض.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكنكم
  rationale: تفيد الاستدراك في مقابل ما سبق في الآية 7، وربطها بضمير المخاطبين طبيعي في العربية.
- source_word: λήμψεσθε δύναμιν
  choice: ستنالون قوةً
  rationale: «تنالون» تعبّر عن تلقّي ما يُعطى، و«قوة» تحفظ المعنى الواسع للتمكين دون قصره على القوة الجسدية.
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: حين يحلّ الروح القدس عليكم
  rationale: صيغت العبارة المطلقة بالجر في اليونانية جملةً زمنية عربية؛ و«يحلّ ... عليكم» تعبير واضح عن المجيء إلى المخاطبين مع إبقاء صورة «عليكم».
- source_word: ἔσεσθέ μου μάρτυρες
  choice: تكونون لي شهودًا
  rationale: يحفظ التركيب علاقة الشهود بيسوع، بينما يدل «شهود» هنا على الذين يؤدون الشهادة، لا على المعنى اللاحق المتعلق بالاستشهاد.
- source_word: ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: في أورشليم، وفي اليهودية كلها والسامرة
  rationale: يحفظ أسماء الأماكن وترتيبها والنطاق الشامل الذي تفيده πάσῃ، مع عطف عربي طبيعي ودلالة حرف الجر على المنطقتين.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: إلى أقصى الأرض
  rationale: يحفظ المفرد اليوناني ويؤدي اصطلاحيًا معنى أبعد مدى في الأرض، دون تحويله في المتن إلى جمع.
theological_decisions:
- issue: دلالة τοῦ ἁγίου πνεύματος
  choice: الروح القدس
  alternative: الروح المقدس
  rationale: «الروح القدس» هو التعبير العربي المعاصر الراسخ، ويحفظ الإشارة الشخصية الإلهية في السياق من غير إضافة تفسير عقائدي إلى النص.
- issue: علاقة الشهود بيسوع في μου
  choice: لي شهودًا
  alternative: شهودي
  rationale: كلاهما ممكن، لكن «لي شهودًا» يحفظ مرونة المضاف إليه اليوناني بين الانتماء والشهادة لأجله، ولا يضيّقها إلى الملكية وحدها.
- issue: مدى الإرسالية
  choice: أماكن جغرافية فعلية تمتد إلى أقصى الأرض
  alternative: جغرافيا رمزية محضة
  rationale: يحفظ النص أسماء المواقع الواقعية والأفق العالمي من غير فرض مخطط كنسي تفصيلي لا تصرّح به الآية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. اختير «ستنالون» و«يحلّ» لسلاسة الأسلوب مع المحافظة على دقة الحدث الزمني، وأُبقيت الصيغة المفردة في «أقصى الأرض» مع بيان البديل الاصطلاحي في الحاشية.
