id: ACT.1.9
reference: Acts 1:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: ar
  text: وبعد أن قال هذا، رُفع[a] وهم ينظرون، وأخذته سحابة من أمام أعينهم[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُصعد».'
    reason: lexical_alternative
  - marker: b
    text: قد تذكّر السحابة هنا بمشاهد كتابية ترمز فيها السحابة إلى حضور الله، مع أن الآية لا تصرّح بذلك.
    reason: cross_reference
  - marker: c
    text: 'أو: «تلقّته سحابة فغاب عن أنظارهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: أداة ربط بسيطة تصل الحدث بالكلام السابق وتحافظ على انسياب السرد دون إضافة دلالة زمنية زائدة.
- source_word: ταῦτα
  choice: هذا
  rationale: مع أن اللفظ اليوناني جمع، فالإشارة العربية المفردة إلى مجمل الكلام السابق أفصح وأشيع هنا من «هذه الأمور».
- source_word: εἰπὼν
  choice: بعد أن قال
  rationale: اسم الفاعل الأوريستي يسبق الفعل الرئيس زمنيًا، وهذه الصياغة توضّح التعاقب بلغة عربية طبيعية.
- source_word: βλεπόντων αὐτῶν
  choice: وهم ينظرون
  rationale: تنقل تركيب المضاف إليه المطلق بوصفه حالًا ملازمًا للحدث، وتحافظ على كونهم شهودًا بصريين له.
- source_word: ἐπήρθη
  choice: رُفع
  rationale: صيغة المبني للمجهول تقابل المبني للمجهول في اليونانية وتحافظ على معنى الحركة إلى أعلى من غير التصريح بالفاعل.
- source_word: νεφέλη
  choice: سحابة
  rationale: الاسم اليوناني مفرد غير معرّف؛ لذا جاءت العربية نكرة من غير تحميلها في المتن تحديدًا لاهوتيًا صريحًا.
- source_word: ὑπέλαβεν
  choice: أخذته
  rationale: الفعل يحتمل الأخذ أو التلقّي؛ و«أخذته» واضحة ومباشرة وتحافظ على صورة السحابة بوصفها التي أخرجته من مجال رؤيتهم.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: من أمام أعينهم
  rationale: تعبير عربي طبيعي قريب من الصورة اليونانية ويدل على اختفائه عن مجال رؤيتهم.
theological_decisions:
- issue: هل تُصرَّح هوية الفاعل الذي رفع يسوع؟
  choice: رُفع
  alternative: رفعه الله
  rationale: اليونانية تستعمل المبني للمجهول ولا تسمّي الفاعل في هذه الجملة؛ لذلك يحفظ النص العربي هذا الإبهام النحوي ولا يضيف تصريحًا لاهوتيًا غير وارد.
- issue: هل تُجعل السحابة علامة صريحة على حضور الله؟
  choice: سحابة
  alternative: سحابة الحضور الإلهي
  rationale: قد تستدعي السحابة مشاهد كتابية مرتبطة بحضور الله، لكن الآية لا تشرح رمزيتها صراحة؛ لذا يُحفظ هذا الصدى المحتمل في الحاشية لا في المتن.
- issue: دلالة ὑπέλαβεν بين الأخذ والتلقّي
  choice: أخذته
  alternative: تلقّته
  rationale: كلا المعنيين ممكن، واختيار «أخذته» أوضح في العربية السردية، مع إثبات البديل في الحاشية حفاظًا على السعة الدلالية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُخدم المبني للمجهول في «رُفع» لمطابقة اليونانية، وجاءت «سحابة» نكرة، وحُفظت بدائل المعنى والرمزية المحتملة في الحواشي دون إثقال المتن أو حسم ما تركه الأصل مفتوحًا.
