id: ACT.1.14
reference: Acts 1:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: ar
  text: كان هؤلاء جميعًا يواظبون بقلبٍ واحد[a] على الصلاة، مع النساء[b] ومريم أمّ يسوع، ومع إخوته[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «متّحدين» أو «بفكر واحد»؛ فاللفظ اليوناني يشدّد على وحدة القصد، لا على مجرد اجتماعهم في مكان واحد.
    reason: lexical_alternative
  - marker: b
    text: أو «مع نساء». لا ترد أداة التعريف في اليونانية، لكن العبارة تشير على الأرجح إلى جماعة معروفة من النساء المرتبطات بالتلاميذ.
    reason: lexical_alternative
  - marker: c
    text: «إخوته» ترجمة للكلمة اليونانية ἀδελφοί. ويفهمها بعضهم بمعنى أوسع يشمل الأقارب أو ذوي القربى؛ ولا يحدد النص هنا طبيعة صلة القرابة تحديدًا أدق.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: هؤلاء جميعًا
  rationale: يحفظ اسم الإشارة وشمول πάντες، ويأتي بصياغة عربية طبيعية واضحة.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: كان ... يواظبون
  rationale: ينقل التركيب الدال على الاستمرار في الماضي، كما تعبّر «يواظبون» عن المثابرة والالتزام المتواصلين.
- source_word: ὁμοθυμαδόν
  choice: بقلبٍ واحد
  rationale: تعبير عربي مألوف ينقل معنى الوحدة في القصد والتوجّه، لا مجرد الوجود معًا في مكان واحد.
- source_word: τῇ προσευχῇ
  choice: على الصلاة
  rationale: يتلاءم حرف الجر «على» طبيعيًا مع الفعل «يواظب»، ويعبّر عن التفرغ المستمر للصلاة دون افتعال تعريف مستقل للأداة اليونانية.
- source_word: σὺν γυναιξίν
  choice: مع النساء
  rationale: تفيد الصياغة في السياق جماعة النساء المعروفة المرتبطة بالتلاميذ، مع التنبيه في الحاشية إلى غياب أداة التعريف في اليونانية.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: مريم أمّ يسوع
  rationale: ينقل الاسم بصيغته العربية المألوفة، ويحافظ على العبارة التفسيرية المباشرة التي تعرّف بمريم.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: ومع إخوته
  rationale: «إخوته» المقابل العربي المباشر للجمع المذكر ἀδελφοί، من غير حسم طبيعة صلة القرابة بما يتجاوز النص.
theological_decisions:
- issue: المقصود بإخوة يسوع (ἀδελφοί)
  choice: إخوته
  alternative: أقاربه أو ذوو قرابته
  rationale: المعنى المعتاد للكلمة اليونانية هو «الإخوة»، لكن النص هنا لا يحدد هل المقصود إخوة أشقاء أم غير ذلك من صلات القرابة؛ لذلك يحافظ المتن على اللفظ المباشر، وتوضح الحاشية مجال الفهم الأوسع من غير تبنّي موقف طائفي.
translation_notes:
  register: العربية فصحى حديثة واضحة وموقّرة. استُعمل «بقلب واحد» لسلامته وطبيعته في العربية مع إبقاء البدائل في الحاشية، وحُفظ إيقاع تعداد الجماعة من خلال تكرار «مع».
