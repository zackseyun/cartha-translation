  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: ar
  text: إلى اليوم الذي رُفع فيه، بعد أن أعطى الرسلَ الذين اختارهم وصايا عن طريق الروح القدس.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعد أن أعطى الرسلَ الذين اختارهم وصايا بالروح القدس». يمكن أن تدل العبارة اليونانية على الوسيلة أو الواسطة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: إلى اليوم الذي
  rationale: تعبير زمني يحدد نهاية المدة التي يتناولها السياق السابق، وهذه صياغة عربية طبيعية تحافظ على بنية الأصل.
- source_word: ἐντειλάμενος
  choice: بعدما أوصى
  rationale: اسم الفاعل اليوناني يدل هنا على فعل سابق للفعل الرئيس؛ و«أوصى» تنقل معنى إعطاء الأوامر بعبارة عربية فصيحة من غير تليين المعنى إلى مجرد التعليم.
- source_word: τοῖς ἀποστόλοις
  choice: الرسلَ
  rationale: «الرسل» هو المقابل العربي الراسخ والدقيق للجماعة التي اختارها يسوع في لوقا وأعمال الرسل.
- source_word: διὰ πνεύματος ἁγίου
  choice: بالروح القدس
  rationale: تفيد διά مع المضاف إليه الوسيلة أو الواسطة؛ والباء العربية تحتمل هذين الوجهين وتحافظ على إيجاز الأصل.
- source_word: οὓς ἐξελέξατο
  choice: الذين اختارهم
  rationale: الجملة الموصولة تعرّف الرسل بأنهم الذين سبق ليسوع أن اختارهم، ولا تستلزم العربية علامة زمنية إضافية لإيضاح هذا السبق.
- source_word: ἀνελήμφθη
  choice: أُصعِد
  rationale: يحافظ المبني للمجهول على صورة الأصل، ولا يضيف «إلى السماء» لأنها غير مذكورة صراحة في هذه الآية.
theological_decisions:
- issue: صلة وصايا يسوع بالروح القدس
  choice: أوصى الرسلَ بالروح القدس
  alternative: أوصى الرسلَ من خلال الروح القدس
  rationale: يرتبط شبه الجملة في الأغلب بالفعل «أوصى» ويدل على الوسيلة أو الواسطة. وتحفظ الباء العربية هذا الاتساع الدلالي من غير حسم زائد لطبيعة العلاقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «أُصعِد» بصيغة المبني للمجهول لمطابقة الأصل، ووُضعت عبارتا «بعدما أوصى» و«بالروح القدس» بين فواصل لتوضيح تركيب الجملة. تظهر علامة الحاشية [a] في المتن.
