  register: صياغة عربية فصحى معاصرة وواضحة ذات نبرة كتابية رصينة. حُفظ تكرار صورة «المكان» والتباس العبارة الختامية، ووُضعت علامتا الحاشيتين [a] و[b] في المتن.
