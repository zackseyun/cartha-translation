lexical_decisions:
- source_word: λαβεῖν
  choice: ليأخذ
  rationale: ينقل غرض الصلاة في السياق، ويعبّر طبيعيًا عن تولّي الموضع الشاغر.
- source_word: τὸν τόπον
  choice: مكان
  rationale: يحفظ صورة «المكان» في اليونانية والتقابل مع «مكانه الخاص» في آخر الآية، مع دلالته السياقية على الدور أو المنصب.
- source_word: διακονίας
  choice: الخدمة
  rationale: «الخدمة» لفظ عربي واضح ينقل معنى العمل الموكول إلى الشخص دون حصره في استعمال كنسي اصطلاحي.
- source_word: ἀποστολῆς
  choice: الرسالة
  rationale: يدل اللفظ هنا على المأمورية الرسولية؛ و«الرسالة» تحافظ على صلته بالإرسال، مع إيضاح المقصود في الحاشية.
- source_word: ἀφ’ ἧς
  choice: اللّتين ... عنهما
  rationale: أُعيد الضمير في العربية على «الخدمة والرسالة» مع مراعاة التثنية، محافظًا على معنى الانفصال عنهما.
- source_word: παρέβη
  choice: حاد
  rationale: ينقل معنى الانحراف أو الابتعاد عن الخدمة والرسالة من غير فرض مصطلح عقائدي أضيق.
- source_word: πορευθῆναι
  choice: ليمضي
  rationale: تعبير عربي طبيعي عن الذهاب، ويحافظ على العلاقة الغائية أو الناتجة المحتملة في التركيب.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: إلى مكانه الخاص
  rationale: يحفظ إيجاز العبارة وغموضها المقصود، ولا يعيّن المكان بأنه القبر أو موضع الدينونة.
theological_decisions:
- issue: دلالة «مكانه الخاص» ومصير يهوذا
  choice: الإبقاء على العبارة الملتبسة «مكانه الخاص» في المتن
  alternative: تفسيرها صراحةً بالقبر، أو الهلاك، أو موضع الدينونة
  rationale: النص اليوناني لا يحدّد وجهة يهوذا تحديدًا صريحًا؛ لذلك ينبغي حفظ التوتر التفسيري وعدم تحميل العبارة تقريرًا عقائديًا زائدًا.
- issue: طبيعة ἀποστολή
  choice: «الرسالة» مع بيان أنها المأمورية الرسولية في الحاشية
  alternative: «الرسولية» أو «منصب الرسول» في المتن
  rationale: يحافظ الاختيار على معنى الإرسال والمأمورية دون تحويل الاسم مباشرةً إلى منصب مؤسسي أكثر تحديدًا مما يقتضيه اللفظ.
