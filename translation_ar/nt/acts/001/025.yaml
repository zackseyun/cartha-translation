  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: ar
  text: ليأخذ موضع هذه الخدمة والرسولية[a] التي حاد عنها يهوذا، ليذهب إلى مكانه الخاص[b].
  philosophy: optimal-equivalence
