  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: ar
  text: 'فإنه مكتوب في سفر المزامير: «لِتَصِرْ دارُه خَرِبةً، ولا يكن فيها ساكنٌ»[a]، و«لْيأخذْ آخرُ منصبَه»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لِيَصِرْ مسكنُه مهجورًا، ولا يسكن فيه أحد».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لْيأخذ آخرُ مسؤوليةَ الإشراف التي كانت له» أو «لْيأخذ آخرُ وظيفتَه». تشير الكلمة اليونانية إلى منصب أو مسؤولية إشرافية، ولا يلزم أن تكون لقبًا كنسيًا تقنيًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: مكتوب
  rationale: صيغة عربية مألوفة للاقتباس الكتابي، وتحفظ دلالة التام اليوناني على ثبوت المكتوب وحضوره.
- source_word: βίβλῳ ψαλμῶν
  choice: سفر المزامير
  rationale: تعبير عربي طبيعي ومألوف يحدد مصدر الاقتباس، مع إمكان ترجمة βίβλος أيضًا بكتاب.
- source_word: Γενηθήτω
  choice: لِتَصِرْ
  rationale: تنقل قوة صيغة الأمر الغائب الدالة هنا على الطلب أو التمني في الاقتباس.
- source_word: ἔπαυλις
  choice: دار
  rationale: تدل الكلمة على موضع السكن أو المسكن؛ و«دار» واضحة وموجزة وتناسب النبرة الشعرية.
- source_word: ἔρημος
  choice: خَرِبةً
  rationale: في هذا السياق تصف موضعًا مهجورًا خاليًا من السكان؛ و«خربة» تحفظ النبرة الجليلة من غير أن توحي حصراً بالبرية.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: ولا يكن فيها ساكنٌ
  rationale: ترجمة قريبة وموجزة للتركيب اليوناني، وتحفظ معنى انعدام أي ساكن فيها.
- source_word: ἐπισκοπή
  choice: مهمتَه الإشرافية
  rationale: تنقل معنى المسؤولية أو مهمة الإشراف في السياق، وتتجنب إسقاط لقب كنسي تقني متأخر على دور يهوذا.
- source_word: λαβέτω ἕτερος
  choice: لْيَتَوَلَّ آخرُ
  rationale: «يتولى» طبيعية مع المهمة والمسؤولية، وتحفظ معنى انتقال الدور إلى شخص آخر.
theological_decisions:
- issue: دلالة ἐπισκοπή عند تطبيق المزمور على دور يهوذا
  choice: مهمتَه الإشرافية
  alternative: منصبَه؛ مسؤوليتَه؛ أسقفيتَه
  rationale: اللفظ يدل على مهمة أو مسؤولية إشرافية، ولا يقتضي هنا منصب الأسقف بمعناه الكنسي التقني اللاحق. أُثبت البديلان الأقربان في الحاشية، مع تجنب «أسقفيته» في المتن لأنها قد تستورد بنية كنسية لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية جليلة. استُعمل «سفر المزامير» بوصفه التعبير العربي المألوف، وصيغتا «لِتَصِرْ» و«لْيَتَوَلَّ» للمحافظة على قوة الأمر الغائب في الاقتباسين. وُضعت علامتا الحاشية بعد العبارتين اللتين تتصلان بهما مباشرة.
