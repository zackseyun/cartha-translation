  source_fidelity: 'المعنى العام منقول بأمانة: ذيوع الخبر بين سكان أورشليم، ونتيجته تسمية الحقل في لغتهم، ثم تفسير الاسم. لكن نقل الاسم «حقل دماخ» غير سليم؛ فالاسم Ἁκελδαμάχ اسم علم واحد، لا عبارة عربية تُجزَّأ إلى «حقل» و«دماخ». كما أن ذلك يربك المقابلة مع التفسير اللاحق «حقل الدم».'
