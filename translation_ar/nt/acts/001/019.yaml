  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: ar
  text: وصار الأمر معروفًا لدى جميع الساكنين في أورشليم، حتى إن ذلك الحقل دُعي بلغتهم الخاصة[a] «أكلداماخ»[b]، أي «حقل الدم».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بلهجتهم الخاصة». يمكن للكلمة اليونانية διάλεκτος أن تدل على لهجة إقليمية أو على لغة بوجه أعم.'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: Ἁκελδαμάχ؛ ويُكتب الاسم أيضًا «أكلدما» وفق الصيغة الأشهر في تقاليد الترجمة.'
    reason: alternative_reading
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: صار هذا معروفًا
  rationale: يحافظ على البناء الدال على أن الأمر أصبح معلومًا، بصياغة عربية طبيعية من غير مبالغة في معنى الشيوع.
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: لدى جميع الساكنين في أورشليم
  rationale: ينقل معنى الإقامة بوضوح ويحافظ على شمول πᾶσι.
- source_word: ὥστε
  choice: حتى إن
  rationale: تُظهر نتيجة اشتهار الأمر، لا مجرد استنتاج منطقي.
- source_word: κληθῆναι
  choice: دُعي
  rationale: يحافظ على المبني للمجهول وعلى معنى التسمية في السياق.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: ذلك الحقل
  rationale: χωρίον هنا قطعة أرض أو حقل، واختيار «الحقل» يحافظ على الاتساق مع الشرح «حقل الدم».
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: بلغتهم الخاصة
  rationale: διάλεκτος قد تعني اللغة أو اللهجة؛ «اللغة» طبيعية هنا، مع إثبات البديل الممكن في الحاشية.
- source_word: Ἁκελδαμάχ
  choice: حقل دماخ
  rationale: نقل صوتي عربي قريب من الصيغة اليونانية، مع فصل الكلمتين بما يلائم أصل الاسم السامي ويجعله مقروءًا.
- source_word: τοῦτ’ ἔστιν
  choice: أي
  rationale: أداة عربية موجزة وطبيعية لإدخال الشرح الوارد في النص.
- source_word: Χωρίον Αἵματος
  choice: حقل الدم
  rationale: ترجمة مباشرة للشرح اليوناني للاسم، مع الحفاظ على التطابق المعجمي مع χωρίον.
