  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: ar
  text: وفي تلك الأيام قام بطرس في وسط الإخوة وقال (وكان عدد المجتمعين معًا نحو مئة وعشرين شخصًا):[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات»؛ فاليونانية تقول «الإخوة»، لكن المقصود في هذه الجماعة المجتمعة قد يشمل جميع رفقاء الإيمان، ومنهم النساء.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: قام
  rationale: اسم الفاعل الماضي من ἀνίστημι يقدّم فعل بطرس قبل كلامه؛ و«قام» تعبير عربي طبيعي يحفظ الفعل المحسوس.
- source_word: ἐν μέσῳ
  choice: في وسط
  rationale: يحفظ الدلالة المكانية لوجود بطرس داخل الجماعة المجتمعة، وهو واضح وفصيح بالعربية.
- source_word: ἀδελφῶν
  choice: الإخوة
  rationale: يحفظ صيغة الجمع المذكر في اليونانية، مع بيان احتمال شمولها للمؤمنات في الحاشية.
- source_word: ὄχλος ὀνομάτων
  choice: عدد المجتمعين
  rationale: العبارة اليونانية حرفيًا «جمهور من الأسماء»، وهي اصطلاح يشير إلى جماعة من الأشخاص معدودة؛ والترجمة المختارة تنقل معناها طبيعيًا دون العبارة العربية الملتبسة «عدد الأسماء».
- source_word: ἐπὶ τὸ αὐτό
  choice: معًا
  rationale: ينقل معنى اجتماع الجماعة دون زيادة تحديد مكاني لا تفرضه العبارة.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: نحو مئة وعشرين
  rationale: تنقل ὡς مع العدد بوصفه تقديرًا تقريبيًا بعبارة عربية موجزة وطبيعية.
- source_word: ὀνομάτων
  choice: شخصًا
  rationale: استُعمل المعنى الاصطلاحي المقصود من «الأسماء»، أي الأشخاص المعدودين، تجنبًا لتركيب غير طبيعي أو موهم في العربية.
- source_word: τε
  choice: وكان
  rationale: يعكس أداة الربط في الجملة الاعتراضية ويصل بيان عدد الجماعة بالسياق على نحو عربي طبيعي.
theological_decisions:
- issue: الدلالة الجندرية لكلمة ἀδελφῶν في الجماعة المجتمعة
  choice: «الإخوة» في المتن، مع حاشية تذكر احتمال شمول اللفظ للإخوة والأخوات في الإيمان.
  alternative: «الإخوة والأخوات» أو «المؤمنين»
  rationale: يحافظ المتن على الصيغة المذكرة في الأصل، بينما تصون الحاشية الاحتمال السياقي الشامل، ولا سيما أن الجماعة المذكورة قبل ذلك ضمت نساءً.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ ترتيب المشهد والفعل المباشر، وصيغ الاعتراض بين قوسين كما في النص المصدر. تُرجمت عبارة «جمهور الأسماء» اصطلاحيًا لتجنب غرابة «عدد الأسماء» في العربية.
