  text: ὅτι κατηριθμημένος ἦν ⸀ἐν ἡμῖν καὶ ἔλαχεν τὸν κλῆρον τῆς διακονίας ταύτης.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: ar
  text: لأنه كان معدودًا بيننا، ونال نصيبًا في هذه الخدمة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نال قرعة هذه الخدمة» أو «نال الجزء المخصَّص من هذه الخدمة». يمكن للكلمة اليونانية κλῆρος أن تعني «قرعة» أو «نصيبًا/جزءًا مخصَّصًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لأنه
  rationale: تؤدي «لأن» المعنى السببي التفسيري في السياق، إذ يبيّن بطرس سبب تعلق الأمر بيهوذا.
- source_word: κατηριθμημένος ἦν
  choice: كان معدودًا
  rationale: تحافظ الصياغة على معنى الإدراج الفعلي ضمن الجماعة وعلى الدلالة المبنية للمجهول في التركيب اليوناني.
- source_word: ἐν ἡμῖν
  choice: بيننا
  rationale: تدل على انتمائه إلى جماعة الرسل، لا على مجرد وجوده بالقرب منهم.
- source_word: ἔλαχεν
  choice: نال
  rationale: فعل عربي طبيعي يشمل معنى الحصول على ما خُصص له، من غير أن يفرض أن القرعة أُجريت في هذا الموضع تحديدًا.
- source_word: τὸν κλῆρον
  choice: نصيبًا
  rationale: ينقل المعنى السياقي للحصة أو الجزء المخصص، مع إبقاء معنى «القرعة» الممكن في الحاشية.
- source_word: τῆς διακονίας ταύτης
  choice: في هذه الخدمة
  rationale: «الخدمة» واضحة ومباشرة، وحرف الجر «في» يلائم التعبير العربي «نصيبًا في» ويبيّن المشاركة فيها.
theological_decisions:
- issue: طبيعة علاقة يهوذا بالخدمة الرسولية
  choice: يصرّح النص بأنه كان معدودًا بين الرسل وأنه نال نصيبًا حقيقيًا في خدمتهم.
  alternative: فهم العبارة على أنها مجرد مصاحبة خارجية للجماعة.
  rationale: تؤكد عبارتا «كان معدودًا بيننا» و«نال نصيبًا» إدراجه ومشاركته، من غير استنتاج حكم عقائدي زائد بشأن القبول أو الثبات.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «الخدمة» بدل مصطلح طائفي أكثر تخصصًا، وحُفظت دلالة العضوية الفعلية مع إبقاء التعدد الدلالي لكلمة κλῆρος في الحاشية.
