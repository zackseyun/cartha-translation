id: ACT.1.21
reference: Acts 1:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: ar
  text: لذلك، لا بدّ أن يكون واحدٌ من الرجال الذين صحبونا[a] طوال المدة التي كان الرب يسوع فيها يدخل ويخرج بيننا[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الذين كانوا معنا»، وحرفيًا «الذين اجتمعوا معنا».
    reason: lexical_alternative
  - marker: b
    text: تعبير «يدخل ويخرج بيننا» اصطلاح يدل على حياة يسوع العلنية ونشاطه المستمر في صحبة التلاميذ.
    reason: cultural_note
lexical_decisions:
- source_word: δεῖ
  choice: لا بدّ
  rationale: تؤدي معنى الضرورة الذي يفيده الفعل غير الشخصي، وتُبقي الجملة مفتوحة على تتمتها في الآية التالية.
- source_word: οὖν
  choice: لذلك
  rationale: تُظهر أن الكلام نتيجة مستخلصة من السياق السابق.
- source_word: τῶν συνελθόντων ἡμῖν ἀνδρῶν
  choice: من الرجال الذين صحبونا
  rationale: تحافظ «الرجال» على الدلالة المذكرة المحددة في ἀνδρῶν، وتنقل «صحبونا» معنى ملازمة الجماعة مدةً طويلة بصياغة عربية طبيعية، مع بيان الصورة الحرفية في الحاشية.
- source_word: ἐν παντὶ χρόνῳ
  choice: طوال المدة
  rationale: تدل على كامل الفترة المقصودة، لا على كل مناسبة منفردة.
- source_word: ᾧ
  choice: التي ... فيها
  rationale: تحافظ على الصلة الزمنية مع صياغة عربية سليمة.
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν
  choice: كان ... يدخل ويخرج
  rationale: تحفظ صورة الأصل الاصطلاحية، وتستعمل «كان» لإبراز النشاط المتواصل خلال المدة المذكورة بدل الإيحاء بحركتين منفردتين.
- source_word: ἐφ’ ἡμᾶς
  choice: بيننا
  rationale: تلائم التعبير الاصطلاحي وتدل على حياة يسوع ونشاطه في وسط جماعة التلاميذ.
- source_word: ὁ κύριος Ἰησοῦς
  choice: الرب يسوع
  rationale: تحافظ على لقب κύριος بما له من دلالة تكريمية ولاهوتية راسخة في العهد الجديد.
theological_decisions:
- issue: ترجمة κύριος بوصفه لقبًا للمسيح
  choice: الرب يسوع
  alternative: السيد يسوع
  rationale: «الرب» هو المقابل العربي الأثبت لهذا اللقب، ويحفظ ثقله اللاهوتي والتكريمي، في حين قد تُضعف «السيد» هذه الدلالة.
- issue: الدلالة المذكرة في ἀνδρῶν
  choice: الرجال
  alternative: الأشخاص
  rationale: الاسم اليوناني ἀνήρ يدل هنا تحديدًا على رجال، ولذلك لا تُحايد الترجمة جنسه النحوي والدلالي.
- issue: إبقاء الجملة متصلة بالآية التالية
  choice: لا بدّ أن يكون واحدٌ من الرجال...
  alternative: يلزم إذًا، من الرجال...
  rationale: الصياغة العربية المختارة مفهومة وطبيعية، لكنها لا تضيف مضمون الشهادة الوارد في الآية التالية، وتُبقي نهاية الآية معلقة بعلامة الفاصلة كما في السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «صحبونا» بدل تركيب حرفي أثقل، مع حفظ البديل الحرفي في الحاشية. وحُفظت صورة «يدخل ويخرج» لأنها ذات قيمة نصية واصطلاحية، مع توضيح معناها في الحاشية.
