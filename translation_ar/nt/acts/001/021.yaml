  source_fidelity: 'الترجمة تنقل عناصر النص اليوناني بأمانة: «لذلك» للاستنتاج، و«لا بدّ» للضرورة غير الشخصية التي يكتمل متعلقها في الآية التالية، و«الرجال» للدلالة المذكرة في ἀνδρῶν، و«طوال المدة» للامتداد الزمني كله. كما تحفظ «يدخل ويخرج بيننا» الصورة الاصطلاحية للنص دون تحميلها تفسيرًا داخل المتن.'
