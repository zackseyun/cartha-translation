  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: ar
  text: 'فقال لهم: «ليس لكم أن تعرفوا الأزمنة أو الأوقات المعيَّنة[a] التي حدّدها الآب بسلطانه الخاص[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الأزمنة أو المواسم» أو «الأزمنة أو الآجال». تميّز اليونانية بين لفظين متقاربين، قد يشير أولهما إلى مدد الزمن وثانيهما إلى الأوقات المناسبة أو المعيَّنة.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «في سلطانه الخاص». تفيد العبارة أن تحديد هذه الأزمنة والأوقات من اختصاص الآب وصلاحيته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تفيد انتقالًا خفيفًا يحمل معنى المقابلة بين سؤال التلاميذ وجواب يسوع التصحيحي، وتؤديه الفاء طبيعيًا في السياق العربي.
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: ليس لكم أن تعرفوا
  rationale: يحافظ هذا التعبير على معنى أن هذه المعرفة ليست من شأن المخاطَبين أو ضمن صلاحيتهم، من غير إضافة تفسير زائد.
- source_word: χρόνους
  choice: الأزمنة
  rationale: يدل اللفظ غالبًا على الزمن من حيث امتداده أو فتراته، و«الأزمنة» مقابل عربي موجز ومألوف.
- source_word: καιροὺς
  choice: الأوقات المعيَّنة
  rationale: قد يدل اللفظ على الأوقات المناسبة أو المحددة أو الحاسمة؛ وتُظهر «الأوقات المعيَّنة» فرقًا مع χρόνους من غير تحويله إلى تمييز اصطلاحي صارم.
- source_word: ὁ πατὴρ
  choice: الآب
  rationale: ينقل اللقب المعرّف كما ورد في اليونانية، من غير إضافة ضمير مثل «أبي».
- source_word: ἔθετο
  choice: جعلها
  rationale: يعكس معنى وضعها أو قررها، وهو ملائم لاتصال الفعل بعبارة «ضمن سلطانه الخاص» مع إبقاء مجال الدلالة مفتوحًا.
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: ضمن سلطانه الخاص
  rationale: يحافظ على صورة حرف الجر ἐν وعلى معنى السلطة والصلاحية الذاتية، من غير تحويل العبارة إلى معنى الوسيلة وحده.
theological_decisions:
- issue: ترجمة الزوج الزمني χρόνους / καιρούς
  choice: الأزمنة أو الأوقات المعيَّنة
  alternative: الأزمنة أو المواسم
  rationale: يحفظ الاختلاف بين اللفظين المرتبطين، مع تجنب بناء نظام زمني تقني لا يصرح به النص.
- issue: دلالة ἐν مع سلطان الآب
  choice: ضمن سلطانه الخاص
  alternative: بسلطانه الخاص
  rationale: يبقي الصياغة قريبة من «في سلطانه الخاص» ويعبّر عن اختصاص الآب بهذه الأمور، من غير استيراد صياغة عقائدية أوسع من الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الآب» بوصفها التسمية الكتابية المألوفة، وحُفظ الإيجاز والتوتر بين تقارب اللفظين الزمنيين واختلافهما.
