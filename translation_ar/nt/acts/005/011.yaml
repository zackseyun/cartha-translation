base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: ar
  text: فحلَّ خوفٌ عظيمٌ بالكنيسة كلِّها، وبجميع الذين سمعوا هذه الأمور[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «الكنيسة» (ἐκκλησία) بـ«الجماعة» أو «جماعة المؤمنين».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: حلَّ
  rationale: مع «الخوف» فاعلًا وἐπί للدلالة على من أصابهم، ينقل «حلَّ» القوة الحدثية بصورة عربية طبيعية، بدل الترجمة الحرفية المتخشبة «حدث خوف».
- source_word: φόβος μέγας
  choice: خوفٌ عظيمٌ
  rationale: السياق المباشر لموت حنانيا وسفيرة نتيجة القضاء الإلهي يرجّح معنى الخوف والرهبة الشديدة، و«عظيم» ينقل μέγας بوضوح.
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: بالكنيسة كلِّها
  rationale: «حلَّ بـ» تركيب عربي طبيعي يقابل أثر الخوف في الجماعة كلها، و«الكنيسة» هي المقابل الشائع لـἐκκλησία حين تشير في سفر الأعمال إلى جماعة المؤمنين، مع إبقاء شمول ὅλην في «كلها».
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: بجميع الذين سمعوا بهذه الأمور
  rationale: ينقل اسم الفاعل اليوناني بصلة موصول ماضية ملائمة للسياق، ويحفظ جمع ταῦτα في «هذه الأمور». واستعمال «سمعوا بـ» يوضح أن المقصود سماع الخبر من غير أن يضيف معنى غريبًا عن النص.
theological_decisions:
- issue: ترجمة ἐκκλησία
  choice: الكنيسة
  alternative: الجماعة أو جماعة المؤمنين
  rationale: يشير اللفظ هنا إلى جماعة المؤمنين في سفر الأعمال، و«الكنيسة» المقابل العربي المألوف من غير إضافة تحديد مؤسسي أو مذهبي لا يصرّح به النص. وتُذكر البدائل المعجمية في الحاشية لصون مجال دلالة الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ توازي العبارة اليونانية بين الكنيسة كلها وجميع السامعين، مع صياغة عربية طبيعية، وأُبقي جمع «هذه الأمور».
