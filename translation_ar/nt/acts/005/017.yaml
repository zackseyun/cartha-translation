lexical_decisions:
- source_word: Ἀναστὰς
  choice: فقام
  rationale: اسم الفاعل الأوريستي من ἀνίστημι يمهّد هنا لعمل حاسم في السرد؛ و«فقام» تعبير عربي طبيعي يحفظ الحركة والانتقال إلى الفعل.
- source_word: δὲ
  choice: فـ
  rationale: تفيد δέ انتقالًا ذا مسحة تقابل مع ما سبق؛ والفاء تلائم تتابع السرد العربي، مع بقاء التقابل ظاهرًا من السياق دون تشديده إلى استدراك صريح.
- source_word: ὁ ἀρχιερεὺς
  choice: رئيس الكهنة
  rationale: المقابل العربي الاصطلاحي الواضح للمنصب المفرد المشار إليه.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: جميع الذين معه
  rationale: يحفظ معنى المصاحبة والانتماء إلى جماعته من غير تحديد زائد لطبيعة مناصبهم أو علاقتهم به.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: وهم جماعة الصدوقيين
  rationale: العبارة بدل تفسيري يعرّف الذين معه. واختيار «جماعة» يعبّر عن تيار ديني اجتماعي داخل اليهودية من غير الإيحاء المتأخر الذي قد تحمله كلمة «هرطقة».
- source_word: ἐπλήσθησαν
  choice: وامتلأوا
  rationale: يحفظ صورة الفعل المبني للمجهول مع متممه، وهي صيغة مألوفة وواضحة في العربية.
- source_word: ζήλου
  choice: غيرةً
  rationale: «غيرة» تقابل مجال ζῆλος الدلالي، ويمكن أن تحمل معنى الغيرة العدائية أو الحماسة؛ والسياق هنا يرجّح المعنى السلبي، وتوضح الحاشية البدائل.
theological_decisions:
- issue: دلالة αἵρεσις
  choice: جماعة
  alternative: طائفة
  rationale: يدل اللفظ هنا على جماعة أو تيار معروف داخل يهودية الهيكل الثاني، لا على «هرطقة» بالمفهوم الكنسي اللاحق؛ و«جماعة» واضحة ومحايدة، مع إثبات البديل في الحاشية.
- issue: دلالة ζῆλος في السياق
  choice: غيرة
  alternative: حسد
  rationale: يسمح اللفظ اليوناني بمعنى الحماسة أو الغيرة، لكن معارضة الرسل في السياق ترجّح الغيرة العدائية. يحفظ «غيرة» قدرًا من السعة الأصلية، بينما تذكر الحاشية «حسدًا» وتبين إمكان «حماسة» من حيث أصل الدلالة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة، بجملة سردية موجزة. استُخدم «جماعة» لتجنب الإيحاء المذهبي المتأخر، و«غيرة» للمحافظة على السعة الدلالية مع توضيح المعنى السياقي في الحاشية.
