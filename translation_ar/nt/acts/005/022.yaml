lexical_decisions:
- source_word: παραγενόμενοι
  choice: لما وصلوا
  rationale: يؤدي معنى اسم الفاعل الظرفي الدال على وصول الخدم إلى السجن، بصياغة عربية طبيعية واضحة.
- source_word: ὑπηρέται
  choice: الخَدَم
  rationale: اللفظ يدل هنا على خدم رسميين تابعين للسلطات، لا على خدم منزليين؛ و«الخَدَم» يحافظ على عمومية اليونانية من غير إضافة تفسيرية مثل «حرس الهيكل».
- source_word: οὐχ εὗρον
  choice: لم يجدوهم
  rationale: ترجمة مباشرة وطبيعية للفعل في سياق سردي، مع إظهار مفعوله كما في الأصل.
- source_word: ἐν τῇ φυλακῇ
  choice: في السجن
  rationale: يحافظ على الإشارة إلى السجن المحدد المعروف من السياق.
- source_word: ἀναστρέψαντες
  choice: فرجعوا
  rationale: ينقل رجوعهم من السجن إلى الذين أرسلوهم بعبارة عربية موجزة وسلسة.
- source_word: ἀπήγγειλαν
  choice: وأبلغوا
  rationale: يلائم نقل الخبر إلى السلطة في مقام رسمي، ويحافظ على كون الجملة تمهيدًا لما سيأتي من مضمون البلاغ.
- source_word: δέ
  choice: لكن / فـ
  rationale: تفيد «لكن» المفارقة بين المتوقع وما وجدوه، وتربط الفاء رجوعهم وإبلاغهم بالنتيجة الطبيعية لذلك.
