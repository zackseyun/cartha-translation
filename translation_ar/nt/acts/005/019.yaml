  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: ar
  text: 'لكنَّ ملاك الرب فتح أبواب السجن ليلًا، وأخرجهم وقال:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: ملاكًا
  rationale: الاسم غير معرّف في اليونانية، لذا نُقل نكرة. والسياق يدل على كائن ملائكي لا على رسول بشري.
- source_word: κυρίου
  choice: من عند الرب
  rationale: يحافظ هذا التعبير الطبيعي على معنى الإضافة في «ملاك الرب» مع بيان أن الملاك مُرسَل من الرب، من غير زيادة في التعريف.
- source_word: διὰ νυκτός
  choice: ليلًا
  rationale: 'تعبير عربي موجز وطبيعي يؤدي الدلالة الزمنية: في أثناء الليل.'
- source_word: ἤνοιξε
  choice: فتح
  rationale: ينقل معنى الفعل مباشرة، ولا يضيف معنى «فكّ الأقفال» غير المذكور في النص.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: أبواب السجن
  rationale: ترجمة واضحة ومباشرة تحفظ الجمع في «الأبواب» ودلالة φυλακή على السجن.
- source_word: ἐξαγαγών
  choice: وأخرجهم
  rationale: ينقل معنى التسبب في خروجهم، من غير الإيحاء بتفصيل زائد مثل قيادتهم خطوة بخطوة.
- source_word: τε
  choice: و
  rationale: الواو تصل فعل الإخراج بفعل القول اتصالًا طبيعيًا في السرد العربي.
- source_word: εἶπεν
  choice: قال
  rationale: المقابل السردي الطبيعي للفعل، وتأتي مقولته في العدد التالي.
theological_decisions:
- issue: طبيعة ἄγγελος في السياق
  choice: ملاك سماوي
  alternative: رسول بشري
  rationale: فتح أبواب السجن وإخراج الرسل في هذا السياق يشيران بقوة إلى تدخل ملائكي، لذلك اختير «ملاك» لا «رسول».
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: «الرب» هو المقابل الكتابي المستقر هنا، ولا سيما في التعبير المعروف المتعلق بملاك الرب.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل «لكنَّ» لإبراز المقابلة مع السجن والحراسة في السياق السابق، وخُتم العدد بنقطتين لأن الكلام المنقول يأتي في العدد التالي.
