base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: ar
  text: وكانت تجري على أيدي الرسل آياتٌ وعجائبُ كثيرةٌ بين الشعب، وكانوا جميعًا بقلبٍ واحد[a] في رواق سليمان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «باتفاقٍ واحد». يدلّ اللفظ اليوناني على وحدة القصد، إلى جانب اجتماعهم معًا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بهو سليمان ذي الأعمدة». والرواق ممرّ أو بهو مسقوف تحمله أعمدة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: على أيدي الرسل
  rationale: يحفظ التعبير اليوناني المحسوس الدال على الوسيلة أو الوكالة، وهو تعبير عربي طبيعي وواضح.
- source_word: δὲ
  choice: وَ
  rationale: تفيد هنا استمرار السرد لا تضادًا قويًا؛ فحُفظ الربط بواو الاستئناف من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: ἐγίνετο
  choice: كانت تجري
  rationale: ينقل صيغة الماضي الناقص الدالة على نشاط متكرر أو مستمر، ويتلاءم عربيًا مع الآيات والعجائب.
- source_word: σημεῖα καὶ τέρατα
  choice: آيات وعجائب
  rationale: يحفظ الاقتران اللوقاوي المألوف دون إضافة وصف تفسيري مثل «معجزية».
- source_word: πολλὰ
  choice: كثيرة
  rationale: صفة تشمل الآيات والعجائب معًا، بصياغة عربية مباشرة.
- source_word: ἐν τῷ λαῷ
  choice: بين الشعب
  rationale: ينقل معنى المجال أو الوجود وسط الناس، من غير تقييد هوية الشعب بما لا يصرح به النص.
- source_word: ὁμοθυμαδὸν
  choice: بقلب واحد
  rationale: يبرز الاتفاق ووحدة القصد الكامنين في اللفظ، بينما يدل ذكر وجودهم في موضع واحد على اجتماعهم المكاني.
- source_word: ἅπαντες
  choice: جميعًا
  rationale: يحفظ الشمول من غير تعيين مرجع الضمير الذي تركه اليوناني ضمنيًا.
- source_word: Στοᾷ Σολομῶντος
  choice: رواق سليمان
  rationale: «رواق» مصطلح عربي واضح لبناء مسقوف ذي أعمدة، ويحفظ اسم الموضع المعيّن.
theological_decisions:
- issue: مرجع الضمير في «وكانوا جميعًا»
  choice: إبقاء المرجع ضمنيًا كما في اليونانية
  alternative: تعيينه بالرسل وحدهم أو بجميع المؤمنين
  rationale: لا يحدد النص اليوناني السابقَ المقصود صراحة، ولذلك لا تحسم الترجمة هل المراد الرسل وحدهم أم جماعة المؤمنين الأوسع.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُعملت «على أيدي» لصون الصورة اليونانية بصورة طبيعية، و«بقلب واحد» لإظهار معنى الوحدة، مع إبقاء هوية الجماعة المشار إليها بالضمير مفتوحة كما في الأصل.
