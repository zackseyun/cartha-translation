  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: ar
  text: فخرجوا من أمام المجلس فرحين، لأنهم حُسِبوا أهلًا لأن يُهانوا من أجل الاسم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اسم يسوع». واليونانية تقول: «الاسم»، وهو تعبير توقيري تُرك مرجعه ضمنيًا في النص.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: فخرجوا
  rationale: ينقل فعل الذهاب بعيدًا عن المجلس بصياغة عربية طبيعية في السياق السردي؛ ودلالة الاستمرار في صيغة الماضي اليونانية يفهمها السياق دون تكلف تركيب حرفي.
- source_word: χαίροντες
  choice: فرحين
  rationale: حال متزامنة مع خروجهم، وتحافظ على الصلة المباشرة بجملة السبب التالية.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: من أمام المجلس
  rationale: تعبير عربي طبيعي يحفظ صورة الخروج من حضرة المجلس دون حرفية ثقيلة.
- source_word: συνεδρίου
  choice: المجلس
  rationale: ترجمة للاسم العام الدال على الهيئة الحاكمة، وهي أوضح للقارئ المعاصر من النقل الصوتي «السنهدريم».
- source_word: κατηξιώθησαν
  choice: حُسِبوا أهلًا
  rationale: يحفظ المبني للمجهول ومعنى الحكم عليهم بأنهم جديرون، بصياغة عربية فصيحة ومفهومة.
- source_word: ὑπὲρ
  choice: من أجل
  rationale: تؤدي معنى السبب أو الارتباط الذي لأجله وقعت الإهانة، وهي أوضح هنا من «عن».
- source_word: τοῦ ὀνόματος
  choice: الاسم
  rationale: يحافظ على التعبير اليوناني المطلق ذي النبرة التوقيرية، من غير إضافة مرجع صريح غير مذكور في النص.
- source_word: ἀτιμασθῆναι
  choice: لأن يُهانوا
  rationale: يحفظ معنى التعرض للإهانة والمبني للمجهول ضمن إطار الكرامة والعار.
theological_decisions:
- issue: الاستعمال المطلق لعبارة «الاسم»
  choice: إبقاء «الاسم» دون توسيع في المتن
  alternative: اسم يسوع؛ اسمه
  rationale: اليونانية تقول حرفيًا «الاسم» على نحو توقيري. والسياق يدل على يسوع، لكن المرجع غير مصرّح به في هذه الآية، لذلك تُصان دلالة النص وتوتره دون تفسير ضمني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «حُسِبوا أهلًا» للمحافظة على المفارقة المقصودة بين الاستحقاق والإهانة، وأُبقي «الاسم» مطلقًا وفق المصدر.
