  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: ar
  text: أما سائر الناس، فلم يجرؤ أحد منهم أن ينضم إليهم، لكن الشعب كان يعظّمهم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ λοιπῶν
  choice: أما سائر الناس
  rationale: ينقل معنى الباقين أو الآخرين خارج الجماعة المذكورة في السياق، مع إبقاء هويتهم غير محددة كما في اليونانية.
- source_word: ἐτόλμα
  choice: يجرؤ
  rationale: يعبر بوضوح عن الإقدام مع وجود خوف أو تهيّب.
- source_word: κολλᾶσθαι αὐτοῖς
  choice: أن ينضم إليهم
  rationale: الفعل يدل حرفيًا على الالتصاق، ويُستعمل هنا لمعنى الالتحاق بالجماعة أو الارتباط بها؛ و«ينضم» هي الصياغة العربية الطبيعية المناسبة.
- source_word: ἀλλ’
  choice: لكن
  rationale: يحفظ المقابلة بين امتناع الآخرين عن الانضمام وبين تعظيم الشعب لهم.
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: الشعب كان يعظّمهم
  rationale: يحافظ على دلالة التكريم والإجلال في الفعل، وعلى الاستمرار الذي توحي به صيغة الماضي الناقص.
theological_decisions:
- issue: مرجع «إليهم» و«هم»
  choice: الإبقاء على الضمائر من غير تعيين تفسيري
  alternative: التصريح بأن المقصود هو الرسل أو جماعة المؤمنين
  rationale: النص اليوناني يستخدم الضمائر، وقد يحتمل السياق نقاشًا حول مرجعها؛ لذلك لا ينبغي حسمه داخل الترجمة.
- issue: هوية «سائر الناس»
  choice: صياغة عامة غير محددة
  alternative: تعيينهم بغير المؤمنين أو ببقية المؤمنين
  rationale: τῶν λοιπῶν لا يحدد وحده هوية هؤلاء، فحُفظ الغموض الحقيقي.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدم «يعظّمهم» للمحافظة على قوة اللفظ اليوناني من دون إدخال تفسير طائفي، ووُضع الفاعل «الشعب» قبل الفعل الناقص لصياغة عربية سلسة.
