source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: ar
  text: فلمّا سمعوا ذلك، دخلوا ساحات الهيكل عند الفجر، وكانوا يعلّمون. ولمّا حضر رئيس الكهنة والذين معه، دعوا المجلس الأعلى ومجلس شيوخ بني إسرائيل كلَّه[a] إلى الاجتماع، وأرسلوا إلى السجن ليُؤتَى بهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تُفهم العبارة أيضًا على أن «مجلس شيوخ بني إسرائيل كلَّه» وصفٌ للمجلس الأعلى أو توضيحٌ له، لا هيئة منفصلة عنه.
    reason: غموض نحوي ودلالي في اقتران «المجلس» بـ«مجلس الشيوخ».
lexical_decisions:
- source_word: ἀκούσαντες
  choice: فلمّا سمعوا ذلك
  rationale: اسم الفاعل الأوريستي يفيد التوقيت ويرجع إلى أمر الملاك في الآية السابقة؛ وإضافة «ذلك» توضّح المرجع الطبيعي من غير توسّع.
- source_word: ὑπὸ τὸν ὄρθρον
  choice: عند الفجر
  rationale: تعبير زمني يدل على وقت انبلاج الصباح، وهذه صياغة عربية موجزة وطبيعية.
- source_word: εἰς τὸ ἱερὸν
  choice: دخلوا ساحات الهيكل
  rationale: ἱερόν يدل هنا على مجمّع الهيكل لا على المقدس الداخلي وحده؛ و«ساحات الهيكل» توضح موضع التعليم العام.
- source_word: ἐδίδασκον
  choice: أخذوا يعلِّمون
  rationale: تحافظ الصياغة على دلالة الماضي الناقص في استمرار فعل التعليم.
- source_word: Παραγενόμενος
  choice: فلمّا حضروا
  rationale: نُقل اسم الفاعل الأوريستي بجملة زمنية عربية تُظهر تعاقب الحدثين، مع شمول رئيس الكهنة والذين معه في الفعل بحسب السياق النحوي.
- source_word: οἱ σὺν αὐτῷ
  choice: الذين معه
  rationale: ترجمة مباشرة لا تفترض هوية أكثر تحديدًا لهذه الجماعة.
- source_word: συνεκάλεσαν
  choice: دعوا ... إلى الاجتماع
  rationale: تعكس معنى استدعاء هيئة وعقد اجتماعها بلغة عربية واضحة.
- source_word: τὸ συνέδριον
  choice: المجلس الأعلى
  rationale: يشير اللفظ في هذا السياق إلى الهيئة الحاكمة اليهودية المعروفة بالسنهدريم؛ و«المجلس الأعلى» مفهوم عربيًا ويحفظ طبيعته المؤسسية.
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: مجلس شيوخ بني إسرائيل كلَّه
  rationale: γερουσία هيئة من الشيوخ، و«بني إسرائيل» تحفظ التعبير القومي العائلي الصريح، مع إبقاء العلاقة المحتملة بين هذه الهيئة والمجلس الأعلى دون حسم كامل.
- source_word: δεσμωτήριον
  choice: السجن
  rationale: المقابل العربي القياسي والواضح لمكان الحبس.
- source_word: ἀχθῆναι αὐτούς
  choice: ليُحضَر الرسل
  rationale: يحفظ المبني للمجهول وغرض الإرسال. وذِكر «الرسل» بدل الضمير يزيل التباسًا قد ينشأ في العربية بعد تعدد الجماعات المذكورة، من غير تغيير للمرجع السياقي.
theological_decisions:
- issue: صياغة τῶν υἱῶν Ἰσραήλ
  choice: بني إسرائيل
  alternative: إسرائيل / الإسرائيليين
  rationale: تحفظ الصيغة القومية العائلية التقليدية وصورتها المذكرة كما في اليونانية، من غير تسطيحها إلى اسم قومي مجرد.
- issue: العلاقة بين συνέδριον وγερουσία
  choice: المجلس الأعلى ومجلس شيوخ بني إسرائيل كلَّه
  alternative: المجلس الأعلى، أي مجلس شيوخ بني إسرائيل كلّه
  rationale: أداة العطف في الأصل تسمح بفهم الهيئتين على أنهما مذكورتان على نحو تراكمي، مع احتمال أن تكون الثانية توسعة أو وصفًا للأولى. أبقى النص الرئيسي العطف، وتوضح الحاشية الاحتمال الآخر بدل حسم الغموض.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «المجلس الأعلى» بدل اللفظ المعرَّب الأقل شيوعًا «السنهدريم»، و«ساحات الهيكل» للتمييز بين مجمّع الهيكل والمقدس الداخلي. يحافظ الأسلوب على تتابع الأحداث واستمرار التعليم، ويضع علامة الحاشية [a] في موضعها داخل النص.
