  to: فلمّا سمعوا ذلك، دخلوا ساحات الهيكل عند الفجر، وكانوا يعلّمون. ولمّا حضر رئيس الكهنة والذين معه، دعوا المجلس الأعلى ومجلس شيوخ بني إسرائيل كلَّه[a] إلى الاجتماع، وأرسلوا إلى السجن ليُؤتَى بهم.
