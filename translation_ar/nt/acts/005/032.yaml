  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: ar
  text: ونحن شهود لهذه الأمور[a]، والروح القدس أيضًا شاهد، الذي أعطاه الله للذين يطيعونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذه الأقوال» أو «هذه الوقائع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: شهود
  rationale: المقابل العربي الطبيعي في سياق الشهادة المباشرة، ويحفظ الطابع الإثباتي للكلمة في سفر أعمال الرسل.
- source_word: ῥημάτων
  choice: الأمور
  rationale: تدل ῥήματα هنا على مضمون الوقائع التي يشهد لها الرسل، و«الأمور» عربية طبيعية مع إبقاء احتمال معنى «الأقوال» في الحاشية.
- source_word: πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: الصياغة العربية المعيارية الواضحة للاسم في العهد الجديد.
- source_word: ἔδωκεν
  choice: أعطاه
  rationale: ينقل الفعل اليوناني مباشرة، مع ضمير عائد إلى الروح القدس ومن دون تحميل صيغة الماضي دلالة زمنية زائدة.
- source_word: πειθαρχοῦσιν
  choice: يطيعونه
  rationale: يفيد الفعل طاعة صاحب السلطة، ويتصل مباشرة بسياق طاعة الله لا الناس في أعمال 5:29.
- source_word: αὐτῷ
  choice: ـه في «يطيعونه»
  rationale: يحفظ الإحالة الضميرية إلى الله بوضوح وطبيعية في العربية.
theological_decisions:
- issue: هل يُقدَّم الروح القدس شاهدًا إلى جانب الرسل؟
  choice: «وكذلك الروح القدس» مع حمل معنى «شاهد» من الجملة السابقة
  alternative: «والروح القدس أيضًا [شاهد]»
  rationale: الجملة اليونانية الثانية بلا فعل، وتستمد خبرها طبيعيًا من الجملة الأولى. تنقل «وكذلك» هذا العطف من غير إضافة دعوى غير موجودة في النص.
- issue: مرجع الاسم الموصول بعد «الروح القدس»
  choice: «الذي أعطاه الله»
  alternative: «الذي وهبه الله»
  rationale: يطابق الموصول في العربية الاسم «الروح» من حيث التذكير النحوي، ويشير بوضوح إلى الروح القدس بوصفه ما أعطاه الله، من غير حاجة إلى حاشية عن الحياد النحوي اليوناني الذي لا نظير مباشر له هنا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعمل «شهود على» لأنه التعبير العربي الطبيعي، و«وكذلك» لإظهار الخبر المحذوف المفهوم من السياق من غير إثقال العبارة.
