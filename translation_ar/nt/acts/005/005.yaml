  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: ar
  text: فلما سمع حنانيا هذا الكلام، سقط ومات[a]. واستولى خوف عظيم على جميع الذين سمعوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكبر: «لفظ أنفاسه الأخيرة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων δὲ
  choice: فلما سمع
  rationale: تؤدي «لما» معنى الظرف الزمني في اسم الفاعل، وتربط الحدث بما سبقه ربطًا طبيعيًا، بينما تؤدي الفاء وظيفة الانتقال السردي الذي تفيده δέ في السياق.
- source_word: ὁ Ἁνανίας
  choice: حنانيا
  rationale: الصيغة العربية الكتابية المألوفة للاسم، مع إبقائه فاعلًا ظاهرًا كما في اليونانية.
- source_word: τοὺς λόγους τούτους
  choice: هذا الكلام
  rationale: المقصود كلام بطرس الذي سبق، و«هذا الكلام» تعبير عربي طبيعي لا يغيّر المرجع.
- source_word: πεσὼν
  choice: سقط
  rationale: يحفظ الصورة الجسدية المباشرة في الأصل من غير تفسيرها بلفظ مثل «انهار».
- source_word: ἐξέψυξεν
  choice: مات
  rationale: ينقل المعنى الواضح في السياق بلغة عربية معاصرة، مع إثبات الصورة الاشتقاقية الأقرب في الحاشية.
- source_word: ἐγένετο φόβος μέγας ἐπὶ
  choice: استولى خوف عظيم على
  rationale: صياغة عربية طبيعية تعبّر عن حدوث الخوف وشموله للجماعة، وتحافظ على قوة العبارة.
- source_word: πάντας τοὺς ἀκούοντας
  choice: جميع الذين سمعوا
  rationale: يحافظ على إطلاق المسموع دون إضافة مفعول به غير مصرّح به في النص.
theological_decisions:
- issue: طبيعة موت حنانيا
  choice: ذِكر موته فور سقوطه من غير تحديد سببه أو آليته
  alternative: التصريح بأن الله أماته مباشرة، أو أن الصدمة سببت موته طبيعيًا
  rationale: يذكر النص السقوط والموت وما أعقبهما من خوف، لكنه لا يصرّح هنا بآلية الموت؛ لذلك لا تحسم الترجمة ما أبقاه النص غير محدد.
translation_notes:
  register: لغة عربية فصحى واضحة ومهيبة، مع سرد موجز وطبيعي. وُضعت علامة الحاشية بعد «مات» لأنها تشرح الفعل اليوناني ἐξέψυξεν مباشرة.
