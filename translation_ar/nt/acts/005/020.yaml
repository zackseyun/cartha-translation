  text: «اذهبوا، وقفوا[c] في الهيكل[a]، وكلِّموا الشعب بكل كلمات هذه الحياة[b].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في ساحات الهيكل» أو «في رحاب الهيكل»؛ فاللفظة اليونانية تشير إلى مجمّع الهيكل كله، لا إلى المقدس الداخلي تحديدًا.'
