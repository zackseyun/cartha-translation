    reason: previous_rendering
lexical_decisions:
- source_word: Πορεύεσθε
  choice: اذهبوا
  rationale: صيغة أمر مباشرة وطبيعية، تنقل طلب الانطلاق إلى العمل دون زيادة تفسيرية.
- source_word: σταθέντες
  choice: وقفوا
  rationale: اسم فاعل ماضٍ يؤدي هنا معنى الفعل المصاحب للأمر؛ وصياغته فعلَ أمرٍ معطوفًا أوضح في العربية وتحفظ تسلسل الأفعال.
- source_word: λαλεῖτε
  choice: كلِّموا
  rationale: ينقل معنى مخاطبة الشعب والكلام إليهم، من غير إضافة دلالة «المناداة» أو «التبشير» غير الصريحة في الفعل اليوناني.
- source_word: ἐν τῷ ἱερῷ
  choice: في ساحة الهيكل
  rationale: لفظة ἱερόν تدل على مجمّع الهيكل لا على المقدس الداخلي تحديدًا؛ و«ساحة الهيكل» تعبير عربي واضح يلائم الموضع الذي يمكن فيه مخاطبة الشعب.
- source_word: τῷ λαῷ
  choice: الشعب
  rationale: ترجمة مباشرة تحفظ عموم اللفظة في السياق من غير تقييدها بالجمهور الحاضر أو إضافة «إسرائيل» صراحة.
- source_word: πάντα τὰ ῥήματα
  choice: بجميع كلمات
  rationale: تحفظ عنصر الشمول في πάντα وصيغة الجمع في ῥήματα، مع تركيب عربي سليم بعد فعل الكلام.
- source_word: τῆς ζωῆς ταύτης
  choice: هذه الحياة
  rationale: تحفظ تركيب الإضافة وإبهامه المقصود، فلا تحسم هل المراد الحياة المُعلنة في البشارة أم طريق الحياة أم الرسالة الواهبة للحياة.
theological_decisions:
- issue: دلالة «هذه الحياة» (τῆς ζωῆς ταύτης)
  choice: الإبقاء على «هذه الحياة» بلا توسيع تفسيري
  alternative: هذه الحياة الجديدة؛ طريق هذه الحياة؛ الرسالة الواهبة للحياة
  rationale: العبارة اليونانية موجزة وغنية دلاليًا، ويرجح ارتباطها بالحياة المعلنة في بشارة يسوع، لكنها لا تحسم وجهًا واحدًا؛ لذلك تُصان المساحة اللاهوتية للنص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «ساحة الهيكل» لتجنب إيحاء أن الخطاب جرى داخل المقدس، وحُفظت العبارة اللاهوتية الموجزة «هذه الحياة» دون تفسير داخل المتن. وُضعت جميع علامات الحواشي في النص الرئيس.
