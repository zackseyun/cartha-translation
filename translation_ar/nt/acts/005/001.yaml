lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: لكن رجلًا
  rationale: تقدّم العبارة شخصًا جديدًا في السرد، وتفيد δέ مقابلة خفيفة مع مثال برنابا السابق؛ أما τις فتؤدي العربية معناها بالتنكير الطبيعي.
- source_word: Ἁνανίας ὀνόματι
  choice: اسمه حنانيا
  rationale: صياغة عربية طبيعية للتركيب الدال على الاسم، مع نقل الاسم وفق صورته العربية الكتابية الشائعة.
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: مع زوجته سفيرة
  rationale: تفيد σύν المصاحبة، وγυνή في هذا السياق تعني الزوجة؛ وترتيب «زوجته سفيرة» واضح وطبيعي في العربية.
- source_word: ἐπώλησεν
  choice: باع
  rationale: فعل ماضٍ سردي ينقل صيغة الماضي اليونانية مباشرة.
- source_word: κτῆμα
  choice: مُلكًا
  rationale: يدل اللفظ على شيء مملوك أو عقار قابل للبيع. و«مُلكًا» يحفظ عموم اللفظ من غير حصره صراحة في أرض أو ضيعة.
theological_decisions:
- issue: المقابلة السردية مع مثال برنابا السابق
  choice: ترجمة δέ بـ«لكن»
  alternative: «وكان» أو «أما» بوصفهما انتقالًا أخف
  rationale: «لكن» تُظهر المقابلة المقصودة بين فعل برنابا وما سيُكشف عن فعل حنانيا، من غير إضافة حكم غير موجود في هذه الآية.
