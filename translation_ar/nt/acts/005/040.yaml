  footnotes:
  - marker: a
    text: 'أو: «عن اسم يسوع»، أو: «استنادًا إلى اسم يسوع». قد يشمل التعبير اليوناني الكلام عن يسوع والتكلم بسلطانه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: فاستدعوا
  rationale: اسم فاعل ماضٍ يدل على فعل سابق للأفعال الرئيسة؛ والفاء مع «استدعوا» تنقل تتابع الأحداث بوضوح وطبيعية في العربية.
- source_word: τοὺς ἀποστόλους
  choice: الرسل
  rationale: «الرسل» هو المصطلح العربي الكتابي الراسخ والدقيق في سياق سفر أعمال الرسل.
- source_word: δείραντες
  choice: وجلدوهم
  rationale: الفعل δέρω يعني الضرب أو الجلد. واختيار «جلدوهم» يلائم سياق العقوبة الرسمية، من غير تحديد أداة الجلد أو عدده مما لا يذكره النص.
- source_word: παρήγγειλαν
  choice: وأمروهم
  rationale: ينقل قوة παραγγέλλω بوصفه إصدار أمر، ويلائم المقام الرسمي.
- source_word: μὴ λαλεῖν
  choice: ألّا يتكلموا
  rationale: ينقل مضمون النهي بصياغة عربية واضحة وطبيعية، من غير إضافة معنى الاستمرار.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: باسم يسوع
  rationale: يحفظ التعبير الكتابي المألوف واتساعه الدلالي، الذي قد يشمل الكلام عن يسوع أو استنادًا إلى اسمه وسلطانه.
- source_word: ἀπέλυσαν
  choice: ثم أطلقوا سراحهم
  rationale: يدل ἀπολύω هنا على الإفراج من الاحتجاز؛ و«أطلقوا سراحهم» واضحة وملائمة للسياق القضائي، و«ثم» تُظهر أن الإفراج جاء بعد الضرب والأمر.
theological_decisions:
- issue: دلالة التعبير ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: باسم يسوع
  alternative: عن اسم يسوع؛ أو استنادًا إلى اسم يسوع
  rationale: يحمل التعبير في أعمال الرسل دلالات متداخلة، منها الإشارة إلى يسوع والتكلم بسلطانه أو على أساس اسمه. يحفظ المتن الصيغة الواسعة المألوفة، وتوضح الحاشية البدائل من غير حصر المعنى في واحد منها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُخدمت أفعال مباشرة تحافظ على سرعة السرد، مع إبقاء الغموض الدلالي الحقيقي في عبارة «باسم يسوع» وشرحه في الحاشية.
