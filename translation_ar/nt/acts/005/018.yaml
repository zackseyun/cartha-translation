  rationale: يحافظ على صورة التعبير اليوناني الاصطلاحي، ويفيد هنا القبض العدائي بحسب السياق، لا وضع الأيدي للبركة أو التكليف.
- source_word: ἀποστόλους
  choice: الرسل
  rationale: هو اللقب المستقر في سفر أعمال الرسل لمبعوثي يسوع المكلَّفين، لا مجرد رسل أو مبعوثين بالمعنى العام.
- source_word: ἔθεντο
