  rationale: ترجمة مباشرة وطبيعية للفعل في سياق الإيداع في الحبس.
- source_word: ἐν τηρήσει
  choice: في الحبس
  rationale: ينقل معنى الاحتجاز والحراسة من غير أن يحصره بالضرورة في مبنى سجن بعينه.
- source_word: δημοσίᾳ
  choice: العام
  rationale: صفة لـ«الحبس»، وتشير على الأرجح إلى موضع الاحتجاز العام أو الرسمي، مع تجنب زيادة تفسيرية مثل «الحكومي».
