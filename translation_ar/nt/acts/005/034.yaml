  terminology: «المجلس» مع تعريفه في الحاشية، و«فرّيسيّ»، و«الشريعة»، و«الشعب» اختيارات مناسبة. و«الرجال» يطابق المرجع السياقي الذكوري للرسل دون تعميم غير لازم.
