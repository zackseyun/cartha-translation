  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: ar
  text: لكن قام في المجلس[a] فرّيسيّ اسمه غمالائيل، وهو معلّم للشريعة يحظى باحترام الشعب كلّه، وأمر أن يُخرَج الرجال إلى الخارج لوقت قصير[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي المجلس اليهودي الحاكم، المعروف بالسنهدريم.
    reason: cultural_note
  - marker: b
    text: 'حرفيًا: «أن يجعل الرجال في الخارج قليلًا»، وهو تعبير يعني أن يُخرَجوا مؤقتًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: قام
  rationale: ينقل فعل النهوض للحديث علنًا في المجلس بصياغة عربية طبيعية ومباشرة.
- source_word: δέ
  choice: لكن
  rationale: يفيد انتقالًا ذا مسحة من المقابلة مع مجرى الأحداث السابق.
- source_word: συνεδρίῳ
  choice: المجلس
  rationale: ترجمة مباشرة للمجلس الحاكم اليهودي، مع بيان هويته في الحاشية دون إدخال التفسير في المتن.
- source_word: Φαρισαῖος ὀνόματι Γαμαλιήλ
  choice: فرّيسيّ اسمه غمالائيل
  rationale: صياغة عربية واضحة تحفظ تعريف الشخص بانتمائه واسمه.
- source_word: νομοδιδάσκαλος
  choice: معلّم للشريعة
  rationale: ينقل معنى من يعلّم الناموس؛ واختيار «الشريعة» واضح وشائع في العربية المعاصرة.
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: يحظى باحترام الشعب كلّه
  rationale: يعبر طبيعيًا عن التقدير الاجتماعي العام الذي تفيده العبارة اليونانية من غير إضافة «إسرائيل» غير المذكورة صراحة.
- source_word: ἐκέλευσεν
  choice: أمر
  rationale: يحفظ قوة التوجيه السلطوي في السياق القضائي.
- source_word: ἔξω βραχὺ ... ποιῆσαι
  choice: بإخراج ... قليلًا
  rationale: صياغة عربية موجزة تنقل الاصطلاح اليوناني الذي يعني إبعادهم إلى الخارج مدة وجيزة.
- source_word: τοὺς ἀνθρώπους
  choice: الرجال
  rationale: المرجع في السياق هم الرسل الذكور الواقفون أمام المجلس، لا الناس عمومًا.
theological_decisions:
- issue: الدلالة الجندرية لعبارة τοὺς ἀνθρώπους
  choice: الرجال
  alternative: الأشخاص / الناس
  rationale: السياق يحدد المرجع بالرسل الذكور، ولذلك تحافظ الترجمة على الدلالة السياقية بدل تعميمها.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «الشريعة» بدل الصيغة التقنية الأقدم «الناموس»، وحُفظت بنية السرد الموجزة وسلطة أمر غمالائيل.
