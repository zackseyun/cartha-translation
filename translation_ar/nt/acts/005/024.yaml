  language: ar
  text: ولمّا سمع قائد حرس الهيكل ورؤساء الكهنة هذا الكلام، تحيّروا بشأنه وتساءلوا إلى ماذا سيؤول هذا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: ولمّا
  rationale: تؤدي معنى الانتقال السردي مع الدلالة الزمنية بصورة عربية طبيعية.
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: قائد حرس الهيكل
  rationale: يشير στρατηγός هنا إلى المسؤول القيادي عن حرس الهيكل؛ وإضافة «حرس» توضح وظيفته للقارئ المعاصر.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: تعبير راسخ يدل على جماعة القيادة الكهنوتية، لا على تعدد شاغلي منصب رئيس الكهنة في الوقت نفسه.
- source_word: διηπόρουν περὶ αὐτῶν
  choice: تحيّروا بشأنه
  rationale: ينقل شدة الحيرة وعدم اليقين، مع إرجاع الضمير إلى الكلام أو الخبر الذي سمعوه دون تفصيل زائد.
- source_word: τί ἂν γένοιτο τοῦτο
  choice: إلى ماذا سيؤول هذا
  rationale: ينقل السؤال عن مآل الأمر ونتيجته مع إبقاء عدم اليقين الذي تفيده الصيغة اليونانية.
