    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: فـ...ـوا
  rationale: تربط الفاء ردَّ فعل أعضاء المجلس بما سبق ربطًا سرديًّا طبيعيًّا، ويُفهم الفاعل الجمع من السياق وصيغة الفعل.
- source_word: ἀκούσαντες
  choice: لما سمعوا هذا
  rationale: تؤدي «لما» المعنى الزمني لاسم الفاعل الماضي، و«هذا» يصرّح بالمفعول المفهوم من خطاب الرسل السابق.
- source_word: διεπρίοντο
  choice: استشاطوا غضبًا
  rationale: الفعل يرسم حرفيًّا صورة القطع أو النشر، لكنه في هذا السياق يدل على هياج عدائي شديد؛ والتعبير العربي المختار واضح وطبيعي ويحفظ قوة رد الفعل دون أن يوحي بندم أو تبكيت.
- source_word: ἐβούλοντο
  choice: أرادوا
  rationale: ينقل إرادتهم أو قصدهم المستمر بصياغة عربية مباشرة، من غير المبالغة إلى معنى العزم النهائي.
- source_word: ἀνελεῖν
  choice: أن يقتلوهم
  rationale: الفعل هنا يعني إزهاق الحياة، و«يقتلوا» تعبير مباشر ودقيق، والضمير يعود إلى الرسل.
theological_decisions:
- issue: هل يدل διεπρίοντο على التبكيت الداخلي أم الغضب العدائي؟
  choice: استشاطوا غضبًا
  alternative: تقطعت قلوبهم / نخسوا في قلوبهم
  rationale: السياق المباشر، ولا سيما إرادتهم قتل الرسل، يرجّح هياجًا عدائيًّا شديدًا. وتُحفظ الصورة الحرفية البديلة في الحاشية كيلا تُطمس الدلالة المجازية الأصلية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختير «استشاطوا غضبًا» لنقل شدة الانفعال العدائي طبيعيًّا، مع إثبات الصورة اليونانية الحرفية في الحاشية.
