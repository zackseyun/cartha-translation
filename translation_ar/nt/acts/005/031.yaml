  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: ar
  text: هذا رفعه الله إلى يمينه قائدًا ومخلِّصًا[a]، ليمنح إسرائيل التوبة وغفران الخطايا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رفعه الله بيمينه قائدًا ومخلِّصًا». تحتمل العبارة اليونانية أن تكون «بيمينه» بمعنى بقدرته، وإن كان السياق يرجّح الرفع إلى مقام الشرف الأسمى عند يمين الله.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: هذا
  rationale: يحفظ قوة اسم الإشارة المؤكد، ويشير بوضوح إلى يسوع المذكور في السياق السابق.
- source_word: ἀρχηγὸν
  choice: قائدًا
  rationale: ينقل معنى من يتقدم ويترأس، ويلائم سياق السلطان والتمجيد من غير اللجوء إلى لفظ قديم أو تضييق الدلالة إلى معنى واحد.
- source_word: σωτῆρα
  choice: مخلِّصًا
  rationale: المقابل العربي المألوف والدقيق في السياق المسيحاني، ويحفظ دلالة الإنقاذ والخلاص.
- source_word: ὕψωσεν
  choice: رفعه
  rationale: يفيد هنا الرفع إلى مقام الشرف والسلطان؛ والسياق وعبارة «إلى يمينه» يوضحان معنى التمجيد دون الحاجة إلى صياغة عربية أثقل.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: إلى يمينه
  rationale: يفهم العبارة على أنها دالة على المكانة عند يمين الله، وهو الأرجح في سياق الرفع والتتويج، مع إبقاء القراءة الآلية في الحاشية.
- source_word: τοῦ δοῦναι
  choice: ليمنح
  rationale: ينقل غرض الرفع الذي تعبّر عنه صيغة المصدر المعرّف، ويأتي طبيعيًا في العربية.
- source_word: μετάνοιαν
  choice: التوبة
  rationale: لفظ عربي واضح وراسخ ينقل التحول عن الخطيئة والرجوع إلى الله، لا مجرد تبدل فكري.
- source_word: τῷ Ἰσραὴλ
  choice: إسرائيل
  rationale: جاء مفعولًا ثانيًا مع «يمنح»، فحُفظ معنى المتلقي بصياغة عربية طبيعية.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: غفران الخطايا
  rationale: تعبير عربي كتابي واضح ودقيق يقابل العبارة اليونانية المألوفة.
theological_decisions:
- issue: دلالة رفع يسوع وعبارة τῇ δεξιᾷ αὐτοῦ
  choice: رفع الله يسوع إلى موضع الشرف والسلطان عند يمينه.
  alternative: رفع الله يسوع بيمينه، أي بقوته.
  rationale: يسند سياق التمجيد والاستعمال العهدي الجديد لعبارة اليمين القراءة المكانية/المقامية، لكن صيغة المجرور اليونانية تحتمل أيضًا معنى الوسيلة، لذلك ذُكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «هذا» لحفظ توكيد اسم الإشارة، و«التوبة» بدل تعبير ذهني حرفي لا يستوعب دلالة الرجوع إلى الله. وُضع مؤشر الحاشية بعد العبارة التي تتعلق بها القراءة البديلة.
