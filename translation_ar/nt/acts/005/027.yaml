  text: Ἀγαγόντες δὲ αὐτοὺς ἔστησαν ἐν τῷ συνεδρίῳ. καὶ ἐπηρώτησεν αὐτοὺς ὁ ἀρχιερεὺς
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/027.yaml
  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: ar
  text: فأحضروهم وأوقفوهم أمام المجلس[a]، وسألهم رئيس الكهنة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «السنهدريم»، وهو المجلس اليهودي الحاكم.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: فأحضروهم
  rationale: اسم الفاعل الأوريستي يدل على فعل سبق الفعل الرئيس. صيغته مع الفاء تؤدي تعاقب الحدثين بوضوح وطبيعية في العربية.
- source_word: δὲ
  choice: الفاء في «فأحضروهم»
  rationale: أداة ربط خفيفة تواصل السرد، وقد أدت الفاء وظيفتها الخطابية من غير إبراز مقابلة غير مقصودة.
- source_word: ἔστησαν
  choice: أوقفوهم أمام
  rationale: يحفظ المعنى المتعدي للفعل، أي جعلوهم يقفون أو مثلوهم، ويلائم مشهد المثول الرسمي أمام المجلس.
- source_word: ἐν τῷ συνεδρίῳ
  choice: أمام المجلس
  rationale: المقصود الهيئة الحاكمة اليهودية. واستعمال «أمام» ملائم عربيًا مع «أوقفوهم»، بينما تُبيّن الحاشية أن المجلس هو السنهدريم.
- source_word: ἐπηρώτησεν
  choice: سألهم
  rationale: ينقل معنى السؤال في السياق الرسمي من غير المبالغة التي قد يوحي بها «استجوبهم».
- source_word: ὁ ἀρχιερεὺς
  choice: رئيس الكهنة
  rationale: المقابل العربي المألوف والدقيق للقب الكاهن الأعلى في هذا السياق.
theological_decisions:
- issue: ترجمة συνέδριον
  choice: المجلس
  alternative: السنهدريم
  rationale: يترجم اللفظ اليوناني بحسب معناه العام في المتن، مع توضيح المرجع التاريخي المحدد في الحاشية، فلا يُستبدل باللفظ المنقول وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حافظت الصياغة على تسلسل الحدث وعلى المشهد القضائي من غير إضافة تفسير مذهبي.
