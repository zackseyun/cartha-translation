  text: 'فأجاب بطرس والرسل: «ينبغي أن نطيع الله أكثر من الناس.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπαν
  choice: فأجاب
  rationale: يشكّل اسم الفاعل مع الفعل صيغة جواب سردية، فنُقلت بفعل عربي واحد طبيعي تجنبًا للتكرار.
- source_word: δὲ
  choice: فـ
  rationale: تفيد انتقالًا ذا مسحة تقابل مع الكلام السابق، والفاء تلائم تسلسل الحوار بالعربية من غير مبالغة في شدة الاستدراك.
- source_word: Πέτρος
  choice: بطرس
  rationale: الصيغة العربية الكتابية الراسخة للاسم.
- source_word: καὶ οἱ ἀπόστολοι
  choice: والرسل
  rationale: «الرسل» هو المقابل العربي المألوف والدقيق للجماعة الرسولية المقصودة هنا.
- source_word: Πειθαρχεῖν
  choice: نطيع
  rationale: الفعل يدل على طاعة صاحب سلطان، و«نطيع» واضح وطبيعي في السياق.
- source_word: δεῖ
  choice: ينبغي أن
  rationale: ينقل معنى الوجوب والضرورة، مع إظهار الفاعل المفهوم بصيغة المتكلمين في «نطيع».
- source_word: θεῷ
  choice: الله
  rationale: مفعول الطاعة في اليونانية، ونقله مباشر.
- source_word: μᾶλλον ἢ
  choice: لا
  rationale: في هذا التركيب التقابلي تؤدي «لا» معنى تفضيل طاعة الله على طاعة البشر بإيجاز عربي قوي، لا نفي كل علاقة بالطاعة البشرية على الإطلاق.
- source_word: ἀνθρώποις
  choice: الناس
  rationale: اللفظة اليونانية عامة وتشير هنا إلى البشر، ولا سيما أصحاب السلطة في السياق، في مقابل الله؛ و«الناس» تحفظ العموم الطبيعي في العربية.
theological_decisions:
- issue: طبيعة المقابلة بين طاعة الله وطاعة البشر
  choice: «ينبغي أن نطيع الله لا الناس»
  alternative: «ينبغي أن نطيع الله أكثر من الناس»
  rationale: تحفظ الصياغة أولوية طاعة الله في حالة التعارض، من غير تحويل العبارة إلى تقرير شامل ينفي كل طاعة مشروعة للسلطات البشرية.
- issue: دلالة ἀνθρώποις العامة
  choice: الناس
  alternative: البشر
  rationale: «الناس» تعبير عربي طبيعي يشمل البشر عمومًا، والسياق يحدد أن المقصود المباشر هو السلطات البشرية، من غير حصر مدلول اللفظة فيها.
