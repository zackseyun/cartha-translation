  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: ar
  text: وبعد نحو ثلاث ساعات، دخلت زوجته وهي لا تعلم ما حدث.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وبعد
  rationale: العبارة تؤدي وظيفة انتقال سردي خفيف يمهّد للحدث التالي؛ فصيغت عربيًا بواو الاستئناف مع الظرف الزمني، من غير ترجمة حرفية ثقيلة مثل «وحدث أن».
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: نحو ثلاث ساعات
  rationale: تفيد ὡς التقريب، ويعبّر التركيب كله عن انقضاء مدة زمنية؛ و«بعد نحو ثلاث ساعات» صياغة عربية طبيعية تحفظ معنى المدة التقريبية.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: زوجته
  rationale: γυνή هنا تعني الزوجة بوضوح في سياق الحديث عن حنانيا وامرأته.
- source_word: μὴ εἰδυῖα
  choice: وهي لا تعلم
  rationale: تحفظ الجملة الحالية المصاحبة حالة عدم العلم وقت الدخول، وتأتي طبيعية وواضحة في العربية.
- source_word: τὸ γεγονὸς
  choice: ما حدث
  rationale: اسم الموصول مع الفعل الماضي ينقل دلالة اسم الفاعل التام المستعمل اسميًا، أي الواقعة التي سبقت دخولها.
- source_word: εἰσῆλθεν
  choice: دخلت
  rationale: ترجمة مباشرة وطبيعية للفعل الدال على الدخول إلى المكان، من غير إضافة جهة حركة غير مصرّح بها.
