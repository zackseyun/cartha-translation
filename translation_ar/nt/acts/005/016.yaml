base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: ar
  text: وكان أيضًا جمهورُ الناس من المدن المحيطة بأورشليم يتوافدون[a]، حاملين المرضى والذين تؤذيهم أرواح نجسة[b]، وكانوا جميعًا يُشفَون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يجتمعون».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تعذبهم أرواح نجسة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήρχετο
  choice: يتوافدون
  rationale: ينقل معنى المجيء والاجتماع، ويعبّر بصيغة المضارع بعد «كان» عن الفعل المستمر أو المتكرر في الماضي.
- source_word: τὸ πλῆθος
  choice: جمهور الناس
  rationale: تعبير جمعي يدل على عدد كبير من الناس، وهو واضح وطبيعي في العربية المعاصرة.
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: من المدن المحيطة بأورشليم
  rationale: يحفظ الدلالة الجغرافية للمدن الواقعة حول أورشليم من غير إيهام بأنها تابعة لها إداريًا.
- source_word: φέροντες
  choice: حاملين
  rationale: يحفظ صورة إحضار المصابين، مع احتمال أن يكون بعض المرضى محمولين فعلًا.
- source_word: ἀσθενεῖς
  choice: المرضى
  rationale: هو المعنى المعتاد للكلمة في سياق الشفاء.
- source_word: ὀχλουμένους
  choice: الذين تزعجهم
  rationale: ينقل معنى المعاناة والإقلاق من غير الجزم بدرجة الشدة التي قد توحي بها «تعذبهم».
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: أرواح نجسة
  rationale: يحفظ التعبير الكتابي الدال على الأرواح الشريرة مع دلالات النجاسة في الصفة اليونانية.
- source_word: οἵτινες
  choice: وكانوا
  rationale: يستأنف الإخبار عن الفئتين المذكورتين، أي المرضى والذين تزعجهم الأرواح النجسة، بصياغة عربية طبيعية.
- source_word: ἐθεραπεύοντο
  choice: يُشفَون
  rationale: يحفظ المبني للمجهول، كما تنقل صيغة «كانوا... يُشفَون» الاستمرار أو التكرر في الماضي.
- source_word: ἅπαντες
  choice: جميعًا
  rationale: يحفظ شمول الشفاء لكل الذين أُحضروا في هذا المشهد.
theological_decisions:
- issue: دلالة πνευμάτων ἀκαθάρτων
  choice: أرواح نجسة
  alternative: أرواح دنسة
  rationale: يحفظ الترجمة باعتبارها أرواحًا شخصية شريرة في سياق لوقا وأعمال الرسل، من غير اختزالها في وصف نفسي أو مجازي.
- issue: نطاق ἅπαντες
  choice: وكانوا جميعًا يُشفَون
  alternative: وشُفي كل واحد منهم
  rationale: تُبقي العبارة شمول النص لكل أفراد الفئتين المذكورتين، وتحفظ في الوقت نفسه الجانب المستمر أو المتكرر للفعل الناقص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «يتوافدون» لإظهار المجيء المتكرر مع الاجتماع، و«تزعجهم» بوصفها صياغة محايدة نسبيًا، مع إثبات البديل الأقوى في الحاشية.
