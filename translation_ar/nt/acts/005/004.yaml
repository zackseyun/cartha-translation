id: ACT.5.4
reference: Acts 5:4
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: ar
  text: أما كان يبقى لك ما دام غير مَبيع؟ وبعد أن بِيع، أما كان تحت تصرّفك[a]؟ فلماذا وضعت هذا الأمر في قلبك؟ لم تكذب على الناس، بل على الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في سلطانك» أو «في قدرتك»؛ والمقصود أنه كان خاضعًا لحقك في التصرّف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μένον / ἔμενεν
  choice: كان يبقى ... ما دام غير مَبيع
  rationale: يحافظ على معنى استمرار العقار في حيازة حنانيا قبل البيع، ويعكس تكرار جذر μένω بعبارة عربية واضحة غير متكلّفة.
- source_word: σοὶ
  choice: لك
  rationale: تفيد اللام هنا الاختصاص والملكية بحسب السياق، من غير إضافة تفسير يتجاوز النص.
- source_word: πραθὲν
  choice: بعد أن بِيع
  rationale: صياغة عربية طبيعية تحافظ على المبني للمجهول وعلى سبق البيع للحالة التالية.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: كان تحت تصرّفك
  rationale: تنقل معنى الحق والسلطة الفعلية على ثمن العقار، وتوضح أن القرار فيه كان لحنانيا، من غير إيحاء بالإكراه على التبرع.
- source_word: τί ὅτι
  choice: فلماذا
  rationale: تؤدي وظيفة السؤال التوبيخي في العربية بوضوح وإيجاز.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: وضعت ... في قلبك
  rationale: تحافظ على صورة القلب وعلى معنى العزم الداخلي، بدل اختزالها في التخطيط الذهني فقط.
- source_word: τὸ πρᾶγμα τοῦτο
  choice: هذا الأمر
  rationale: اختيار محايد يناسب سعة معنى πρᾶγμα، ويترك للسياق بيان طبيعته الأخلاقية.
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: لم تكذب على الناس، بل على الله
  rationale: ينقل تركيب الفعل مع المجرور بمعنى «كذب على»، ويترجم ἀνθρώποις ترجمة جامعة وطبيعية في العربية مع إبقاء المقابلة بين البشر والله.
theological_decisions:
- issue: دلالة ذكر الله في ضوء ذكر الروح القدس في العدد السابق
  choice: إبقاء العبارة «بل على الله» كما وردت، بلا تفسير مضاف
  alternative: إضافة «أي على الروح القدس» إلى المتن
  rationale: النص هنا يقول τῷ θεῷ، أما صلته بالروح القدس فتظهر من السياق القريب؛ فلا ينبغي إدخال الشرح اللاهوتي في صلب الترجمة.
- issue: حرية حنانيا في العقار وثمنه
  choice: «يبقى لك» و«تحت تصرّفك»
  alternative: صياغة توحي بأن المال لم يكن له أو أنه كان ملزمًا بتسليمه
  rationale: حجة بطرس تبيّن أن الخطيئة هي الكذب، لا مجرد الاحتفاظ بجزء من المال، ولذلك ينبغي إظهار حق حنانيا الحقيقي في التصرف من غير توسع تفسيري.
- issue: مدى ἀνθρώποις
  choice: «الناس»
  alternative: «الرجال»
  rationale: اللفظ اليوناني هنا عام للبشر، و«الناس» أدق دلاليًا وأفصح في المقابلة العربية مع «الله»، من غير قصر المعنى على الذكور.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. حوفظ على صورة «القلب» وعلى الاستفهامين التوبيخيين، مع تجنب الترجمة الحرفية المتكلّفة لعبارة μένον ... ἔμενεν. ضُبطت «مَبيع» و«بِيع» جزئيًا لتفادي اللبس عند القراءة.
