    rationale: لا يستقيم في العربية وصل «بشأن هؤلاء الرجال» ثم «ما أنتم مزمعون أن تفعلوا» بعد «احذروا» بلا رابط أو مفعول واضح للفعل الأخير. كما أن «احذروا لأنفسكم» أقل طبيعية من نقل التحذير بعبارة فعلية عربية متماسكة.
