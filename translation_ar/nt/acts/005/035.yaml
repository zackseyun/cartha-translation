  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: ar
  text: 'وقال لهم: «يا رجال إسرائيل، توخَّوا الحذر بشأن ما أنتم مزمعون أن تفعلوه بهؤلاء الرجال.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انتبهوا لأنفسكم في أمر ما أنتم مزمعون أن تفعلوه بهؤلاء الرجال.»'
    reason: بديل لفظي يبرز الدلالة الانعكاسية في ἑαυτοῖς ويحافظ على ترتيب أقرب إلى تركيب اليونانية.
lexical_decisions:
- source_word: εἶπέν τε
  choice: وقال
  rationale: تفيد τε ربطًا سرديًّا خفيفًا بما سبق، و«وقال» تحافظ على هذا الربط من غير أن تضيف دلالة قوية على التعاقب أو النتيجة.
- source_word: πρὸς αὐτούς
  choice: لهم
  rationale: مع فعل القول تدل πρός مع النصب على المخاطَبين، و«لهم» هي الصياغة العربية الطبيعية.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: يا رجال إسرائيل
  rationale: نداء رسمي موجَّه إلى رجال من إسرائيل، وهذه الصياغة تحفظ صورة النداء المذكرة في اليونانية وتأتي عربية واضحة.
- source_word: προσέχετε ἑαυτοῖς
  choice: احذروا لأنفسكم
  rationale: يحمل الأمر معنى التيقظ والحذر، ويُبقي ذكر «لأنفسكم» على الدلالة الانعكاسية الصريحة في ἑαυτοῖς.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: بشأن هؤلاء الرجال
  rationale: تشير ἐπί مع المجرور هنا إلى موضوع الحذر والنظر. و«بشأن» تحفظ هذا المعنى من غير أن تفترض أن الفعل سيكون ضدهم، مع أن السياق قد يوحي بذلك.
- source_word: τί μέλλετε πράσσειν
  choice: ما أنتم مزمعون أن تفعلوا
  rationale: تنقل «مزمعون» معنى النية أو الفعل الوشيك في μέλλω مع المصدر، بينما تمثل «تفعلوا» الفعل πράσσειν ببساطة.
