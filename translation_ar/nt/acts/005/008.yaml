  text: ἀπεκρίθη δὲ ⸂πρὸς αὐτὴν⸃ ⸀Πέτρος· Εἰπέ μοι, εἰ τοσούτου τὸ χωρίον ἀπέδοσθε; ἡ δὲ εἶπεν· Ναί, τοσούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: ar
  text: 'فأجابها بطرس: «قولي لي، هل بعتما الأرض[أ] بهذا المبلغ؟» فقالت: «نعم، بهذا المبلغ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: أو «المُلك» أو «الحقل».
    reason: بدائل معجمية للفظ اليوناني χωρίον، الذي يمكن أن يدل على قطعة أرض أو مُلك أو حقل.
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν Πέτρος
  choice: فقال لها بطرس
  rationale: الفعل ἀποκρίνομαι يُستعمل في الحوار بمعنى الرد أو بدء الكلام استجابةً للموقف، وتؤدي «فقال لها» هذا المعنى بسلاسة في السرد العربي. ولم تُترجم δέ بأداة استدراك لأن السياق العربي لا يحتاج إليها هنا.
- source_word: Εἰπέ μοι
  choice: قولي لي
  rationale: أمر مباشر مؤنث، لأن بطرس يخاطب سفيرة، ويحافظ التعبير على ضمير المتكلم في μοι.
- source_word: εἰ
  choice: أَ
  rationale: تدخل εἰ هنا على سؤال جوابه نعم أو لا؛ وصيغته الطبيعية في العربية استفهام مباشر بالهمزة.
- source_word: τοσούτου
  choice: بهذا المبلغ
  rationale: يشير اللفظ إلى مقدار الثمن المذكور أو المعروض في السياق. و«بهذا المبلغ» عربية واضحة وتحفظ الإشارة إلى المقدار.
- source_word: τὸ χωρίον
  choice: الأرض
  rationale: يدل χωρίον هنا على قطعة أرض أو مُلك عقاري. واختيار «الأرض» طبيعي في سياق البيع من غير زيادة تحديد لا يفرضها النص.
- source_word: ἀπέδοσθε
  choice: بعتما
  rationale: للفعل في السياق التجاري معنى «باع»، وصيغة المخاطب الجمع قد تشمل سفيرة وحنانيا؛ فالمثنى العربي «بعتما» يوضح اشتراكهما الذي يثبته السياق القريب.
- source_word: Ναί, τοσούτου
  choice: نعم، بهذا المبلغ
  rationale: تحافظ الصياغة على الجواب المقتضب وعلى تكرار عبارة المقدار كما في اليونانية.
theological_decisions: []
