  register: صياغة عربية فصحى معاصرة، واضحة وموقرة. استُخدم المثنى «بعتما» لأن الفعل اليوناني بصيغة الجمع موجَّه إلى سفيرة مع الإشارة السياقية إلى البيع المشترك مع زوجها؛ وهذا أكثر طبيعية ودقة من جمع المخاطبين في العربية.
