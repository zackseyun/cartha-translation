id: ACT.5.37
reference: Acts 5:37
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: ar
  text: بعد ذلك نهض يهوذا الجليلي في أيام الإحصاء[a]، واستمال أناسًا إلى اتّباعه[b]. فهلك هو أيضًا، وتشتّت كل من اقتنع به.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في زمن التسجيل». قد تدل الكلمة اليونانية على إحصاء السكان أو على تسجيل رسمي.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وجعل أناسًا ينشقّون ويتبعونه». قد يحمل الفعل معنى صرف الناس عن ولائهم السابق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: بعد ذلك
  rationale: تفيد العبارة هنا التعاقب الزمني، وتشير في سياق الخطاب إلى ظهور يهوذا بعد الشخص أو الحدث السابق.
- source_word: ἀνέστη
  choice: نهض
  rationale: يدل الفعل هنا على بروز قائد وقيامه بحركة، لا على القيامة من الموت.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: يهوذا الجليلي
  rationale: صياغة عربية مألوفة للاسم وللنسبة الجغرافية الواردة وصفًا له.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: في أيام الإحصاء
  rationale: تحافظ العبارة على الصياغة الزمنية اليونانية، و«الإحصاء» يؤدي المعنى الإداري العام للكلمة.
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: استمال أناسًا إلى اتّباعه
  rationale: ينقل الفعل السببي معنى صرف أناس إلى جانبه أو حملهم على الانحياز إليه، وتؤدي عبارة «إلى اتّباعه» معنى ὀπίσω αὐτοῦ بصورة عربية طبيعية.
- source_word: λαὸν
  choice: أناسًا
  rationale: الاسم مفرد جمعي غير معرّف؛ و«أناسًا» لا توحي بأن الأمة كلها اتبعته.
- source_word: κἀκεῖνος
  choice: فَهلك هو أيضًا
  rationale: تحفظ «أيضًا» قوة الاتصال والمقارنة في κἀκεῖνος، وتربط الفاء النتيجة بسياق السرد العربي.
- source_word: ἀπώλετο
  choice: هلك
  rationale: ينقل معنى الموت أو حلول الدمار به من غير تحديد كيفية موته، وهو ما لا يحدده النص.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: كل من اقتنع به
  rationale: يحافظ على معنى التأثر بحجته أو دعوته والاقتناع به، من غير تكرار فعل الاتباع الوارد في الجملة السابقة.
- source_word: διεσκορπίσθησαν
  choice: تشتّت
  rationale: مقابل عربي طبيعي للمبني للمجهول اليوناني في هذا السياق، يفيد تفرق الجماعة وانحلالها.
theological_decisions:
- issue: الوصف التاريخي السياسي لحركة يهوذا
  choice: وُصف بأنه نهض واستمال أناسًا إلى اتباعه من غير تسميته صراحة قائد تمرّد.
  alternative: «قاد أناسًا في ثورة» أو «أثار تمرّدًا»
  rationale: ترتبط الشخصية تاريخيًا بالثورة، لكن ألفاظ الآية نفسها لا تتضمن اسمًا صريحًا للثورة؛ لذلك لا تضيف الترجمة توصيفًا سياسيًا أخص مما يقوله النص.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. وُضعت علامتا الحاشيتين عند اللفظين اللذين تفسرهما الحاشيتان، وتُركت كيفية هلاك يهوذا غير محددة كما في اليونانية.
