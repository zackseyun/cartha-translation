  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: ar
  text: 'لكن جاء شخص وأخبرهم: «ها إن الرجال الذين وضعتموهم في السجن واقفون في الهيكل[a] ويعلّمون الشعب».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في ساحات الهيكل»؛ فاللفظة اليونانية ἱερόν تشير إلى مجمّع الهيكل، لا إلى المقدس الداخلي تحديدًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: جاء
  rationale: اسم فاعل ظرفي ماضٍ يقدّم وصول المخبر قبل فعل الإخبار؛ و«جاء» صياغة عربية طبيعية تحافظ على تتابع السرد.
- source_word: δέ
  choice: لكن
  rationale: تفيد انتقالًا مع شيء من المقابلة بما سبق، إذ تأتي الأخبار مخالفة لما كان متوقعًا.
- source_word: τις
  choice: شخص
  rationale: تحافظ على تنكير الفاعل من غير إضافة هوية أو دور لا يذكرهما النص.
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: أخبرهم
  rationale: تنقل إبلاغ الخبر إلى المسؤولين بصياغة عربية واضحة، مع إبقاء مرجع الضمير معتمدًا على السياق.
- source_word: Ἰδοὺ
  choice: ها إن
  rationale: أداة تنبيه تلفت إلى الخبر المفاجئ، وهي أفصح وأجزل من «انظروا» هنا لأن المقصود عرض المعلومة لا الأمر بالنظر الحسي.
- source_word: οἱ ἄνδρες
  choice: الرجال
  rationale: ترجمة مباشرة للعبارة المعرفة التي تشير إلى الرسل المذكورين في السياق.
- source_word: οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: الذين وضعتموهم في السجن
  rationale: تحافظ على الفعل العام «وضع» وعلى مكان الحبس المحدد في السياق من غير تفسير زائد مثل «حبستم».
- source_word: ἑστῶτες
  choice: واقفون
  rationale: 'ينقل صيغة التمام ذات الدلالة الحالية: إنهم موجودون هناك في هيئة الوقوف.'
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: «الهيكل» المقابل الكتابي المألوف لـἱερόν، مع توضيح في الحاشية أن المقصود مجمّع الهيكل لا القدس الداخلي تحديدًا.
- source_word: διδάσκοντες τὸν λαόν
  choice: يعلّمون الشعب
  rationale: صياغة مباشرة تحافظ على الفعل المستمر وعلى «الشعب» بوصفه المفعول به.
theological_decisions:
- issue: مدلول ἱερόν المكاني
  choice: الهيكل مع حاشية توضيحية
  alternative: ساحات الهيكل
  rationale: لا يحصر اللفظ اليوناني المشهد في المقدس الداخلي، لكن إدخال «الساحات» في المتن يضيّق التعبير؛ لذلك أُبقي اللفظ الأوسع مع بيان دلالته المعمارية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُعملت «ها إن» للتنبيه إلى المفاجأة، وأُبقيت التراكيب مباشرة من غير إضافة تفسيرية أو مذهبية.
