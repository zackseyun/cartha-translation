  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: ar
  text: بل كان يُضاف مؤمنون بالرب، أكثرَ من ذي قبل—أعدادٌ غفيرة من الرجال والنساء[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كانوا ينضمون» أو «كانوا يُضافون». يمكن أن يدل الفعل اليوناني على زيادة مستمرة في العدد، وصيغته المبنية للمجهول قد تلمّح إلى أن الله هو الذي كان يضيفهم.'
    reason: بديل معجمي يوضح احتمال الصيغة الوسطى أو اللازمة، مع الحفاظ على إمكان دلالة المبني للمجهول على فاعل إلهي ضمني.
lexical_decisions:
- source_word: μᾶλλον
  choice: أكثر فأكثر
  rationale: تنقل القوة التصاعدية للظرف في سياق النمو المستمر، بعبارة عربية طبيعية وواضحة.
- source_word: δὲ
  choice: بل
  rationale: تحفظ الانتقال الذي يحمل قدرًا من المقابلة مع السياق السابق، حيث لم يجرؤ آخرون على الانضمام، بينما استمر ازدياد المؤمنين.
- source_word: προσετίθεντο
  choice: كانوا يُضافون
  rationale: تحفظ صيغة الماضي المستمر والمبني للمجهول، فتعبّر عن إضافة متواصلة من غير التصريح بفاعل لا يذكره النص.
- source_word: πιστεύοντες τῷ κυρίῳ
  choice: مؤمنون بالرب
  rationale: اسم الفاعل مستعمل استعمال الاسم للدلالة على أناس يتصفون بالإيمان، وحرف الباء يعبّر طبيعيًا في العربية عن توجيه الإيمان والثقة إلى الرب.
- source_word: πλήθη
  choice: أعداد غفيرة
  rationale: تبيّن ضخامة العدد من غير أن توحي بالضرورة بحشد مجتمع في مكان واحد، وتؤدي وظيفة التوضيح لما قبلها.
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: من الرجال والنساء
  rationale: تحفظ ذكر الفئتين صراحةً، كما في اليونانية، وتربطهما بالأعداد الغفيرة.
theological_decisions:
- issue: مرجع لقب «الرب»
  choice: الإبقاء على «الرب» من غير توسيعه إلى «يسوع» في المتن
  alternative: التصريح بعبارة «الرب يسوع» أو فهم اللقب على أنه يشير إلى الله بوجه عام
  rationale: يرجح سياق سفر الأعمال أن اللقب هنا يشير إلى يسوع القائم، لكن النص اليوناني يورد اللقب وحده؛ لذلك تحفظ الترجمة عبارته ولا تحسم المرجع بإضافة تفسيرية.
- issue: دلالة صيغة προσετίθεντο
  choice: 'صيغة مستمرة مبنية للمجهول: «كانوا يُضافون»'
  alternative: 'صيغة وسطى أو لازمة: «كانوا ينضمون»'
  rationale: المبني للمجهول يحفظ احتمال كون الله هو الفاعل الضمني، من غير أن يصرح بذلك حيث لا يصرح النص، كما يحفظ معنى الزيادة المتواصلة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أعداد غفيرة» بدل «جموع» لتجنب إيحاء التجمع المكاني، وحُفظ البناء للمجهول رغم أنه أقل شيوعًا من صيغة «يتزايدون»، لأنه ينقل توتر النص الدلالي واللاهوتي على نحو أدق.
