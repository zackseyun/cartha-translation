  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: ar
  text: وكانوا كلَّ يوم، في الهيكل ومن بيت إلى بيت، لا يكفّون عن التعليم والتبشير بأن يسوع هو المسيح.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على نحو أقرب إلى اللفظ: «مبشّرين بيسوع المسيح»، أو: «معلنين يسوع بوصفه المسيح».'
    reason: لأن العبارة اليونانية τὸν χριστὸν Ἰησοῦν يمكن أن تُفهم مفعولًا مباشرًا لفعل التبشير أو مضمونًا للبشارة.
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: وكانوا كلَّ يوم
  rationale: تنقل العبارة معنى الاستمرار اليومي، وتؤدي الواو وظيفة الربط بالسياق السابق، بينما يهيئ الفعل «كانوا» لبنية الاستمرار في العربية.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: يشير ἱερόν إلى مجمّع الهيكل، و«في الهيكل» تعبير عربي موجز ومألوف من غير تقييده بالمقدس الداخلي.
- source_word: κατ’ οἶκον
  choice: من بيت إلى بيت
  rationale: تنقل القوة التوزيعية لحرف κατά مع المفرد، فتدل على نشاطهم في البيوت واحدًا بعد آخر، مع بقاء احتمال «في البيوت» قريبًا في المعنى.
- source_word: οὐκ ἐπαύοντο
  choice: لا يكفّون
  rationale: ينقل المضارع العربي في سياق «كانوا» دلالة الماضي الناقص على استمرارهم وعدم توقفهم، بلغة فصيحة طبيعية.
- source_word: διδάσκοντες
  choice: عن التعليم
  rationale: «التعليم» هو المقابل المعتاد الواضح، ويرتبط طبيعيًا بعبارة «لا يكفّون عن».
- source_word: εὐαγγελιζόμενοι
  choice: والتبشير
  rationale: «التبشير» يؤدي معنى إعلان الخبر السار في صياغة عربية موجزة ومألوفة، ويوازي «التعليم» نحويًا.
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: بأن يسوع هو المسيح
  rationale: 'تجعل الصياغة مضمون البشارة صريحًا في العربية: هوية يسوع المسيانية. وتُترجم Χριστός بوصفه لقبًا إلى «المسيح» بدل معاملته كاسم غير مترجم.'
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: كريستوس / المسيح بوصفه جزءًا اسميًا من عبارة «يسوع المسيح»
  rationale: يعمل اللفظ هنا لقبًا يعلن هوية يسوع، و«المسيح» ينقل معناه الراسخ في العربية من غير إدخال تمييز مذهبي.
- issue: القوة النحوية لعبارة τὸν χριστὸν Ἰησοῦν بعد εὐαγγελιζόμενοι
  choice: 'مضمون القول: «بأن يسوع هو المسيح»'
  alternative: 'مفعول مباشر: «مبشّرين بيسوع المسيح»'
  rationale: يحتمل التركيب اليوناني عرض العبارة مفعولًا للتبشير أو بيان مضمون البشارة. اختيرت صياغة المضمون لوضوحها وطبيعتها في العربية، مع إثبات البديل الأقرب إلى صورة الأصل في الحاشية حفاظًا على الاحتمال النحوي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «لا يكفّون» بدل «لم يتوقفوا» للمحافظة على معنى الاستمرار، و«من بيت إلى بيت» لإظهار التوزيع المكاني. وُضعت علامة الحاشية عند العبارة التي تتعلق بها مباشرة.
