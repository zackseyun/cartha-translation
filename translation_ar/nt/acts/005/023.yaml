lexical_decisions:
- source_word: δεσμωτήριον
  choice: السجن
  rationale: يدل على موضع الاحتجاز، و«السجن» هو المقابل العربي المعاصر الواضح والملائم للسياق.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: مغلقًا بإحكام
  rationale: ينقل اسم المفعول الدال على حالة الإغلاق مع توكيد تمام التأمين، بصياغة عربية طبيعية.
- source_word: φύλακας ἑστῶτας
  choice: الحراس واقفين
  rationale: يحفظ صورة الحراس وهم قائمون في مواضعهم، من غير إضافة معنى التعيين الرسمي غير المصرح به.
- source_word: ἐπὶ τῶν θυρῶν
  choice: عند الأبواب
  rationale: يعبّر بوضوح عن وجود الحراس بمحاذاة أبواب السجن.
- source_word: ἀνοίξαντες
  choice: حين فتحناه
  rationale: صيغت العبارة زمنيًا بحسب وظيفة اسم الفاعل في السياق، ويعود الضمير على السجن بوصفه المكان الذي فُتح للدخول إليه، مع بقاء الأبواب مذكورة قبل ذلك.
- source_word: ἔσω
  choice: في الداخل
  rationale: مقابل عربي طبيعي للظرف الدال على داخل السجن.
- source_word: οὐδένα
  choice: لم نجد أحدًا
  rationale: ينقل النفي الصريح لوجود أي شخص في الداخل.
- source_word: λέγοντες ὅτι
  choice: 'قائلين:'
  rationale: يحفظ الارتباط النحوي بالسياق السابق ويفتتح مضمون التقرير في كلام مباشر.
