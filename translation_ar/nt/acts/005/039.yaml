  rationale: تُصحَّح الصياغة لتحتفظ ببنية التحذير في μήποτε وبمعنى المبني للمجهول في εὑρεθῆτε، وبالوصف الاسمي القوي في θεομάχοι، من غير فرض تفسير لاهوتي زائد. كما عُدلت الحاشية المعجمية لتوافق المرجع الشخصي للضمير اليوناني، وأُبقي الاحتمال الأوسع في حاشية مستقلة.
