  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: ar
  text: أمّا إن كان من الله، فلن تقدروا أن تقضوا[a] عليهم[c]؛ لئلا تُوجَدوا محاربين لله[b]». فاقتنعوا بكلامه،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تُسقطوهم» أو «تُهلكوهم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تُوجَدوا مقاومين لله»؛ وحرفيًا: «محاربو الله».'
    reason: lexical_alternative
  - marker: c
    text: يعود ضمير «عليهم» على الأرجح إلى الرسل، غير أن بعضهم يفهمه بمعنى أوسع يشمل حركتهم أو عملهم.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: من الله
  rationale: تفيد ἐκ المصدر أو المنشأ، و«من الله» تعبير عربي طبيعي يحفظ معيار غمالائيل المتعلق بالأصل الإلهي.
- source_word: δυνήσεσθε
  choice: ستقدرون / تقدروا بعد «لن»
  rationale: الفعل في المستقبل ويدل على القدرة؛ وصيغة «لن تقدروا» تنقل الزمن والنفي بوضوح.
- source_word: καταλῦσαι
  choice: أن تقضوا
  rationale: يدل الفعل هنا على إسقاط الأمر أو إنهائه. ومع المفعول العاقل «عليهم» يأتي التعبير العربي «تقضوا عليهم» طبيعيًا، مع بيان البدائل في الحاشية منعًا لحصر المعنى في القتل.
- source_word: αὐτούς
  choice: عليهم
  rationale: الضمير مذكر جمع، والأقرب أنه يعود إلى الرسل، ولذلك حُفظ المرجع الشخصي بدل تحويله إلى مفرد مجرد مثل «عليه».
- source_word: μήποτε καὶ
  choice: لئلا
  rationale: تفتتح العبارة تحذيرًا من نتيجة خطيرة محتملة. وتنقل «لئلا» قوة التحذير في عربية واضحة، فيما يظهر معنى καί في خطورة بلوغ الأمر إلى محاربة الله.
- source_word: θεομάχοι
  choice: تحاربون الله
  rationale: اللفظة تعني حرفيًا «محاربي الله». والصياغة الفعلية أفصح في السياق وتحفظ حدة التحذير اللاهوتية.
- source_word: εὑρεθῆτε
  choice: يتبيّن أنكم
  rationale: المبني للمجهول يفيد أن يُكتشف أو يظهر أنهم في هذه الحال؛ و«يتبيّن أنكم» تعبير عربي طبيعي لا يحوّل الاحتمال إلى تقرير يقيني.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: فاقتنعوا بكلامه
  rationale: يفيد πείθω هنا قبول المجلس لمشورة غمالائيل. وتوضح «بكلامه» متعلق الاقتناع طبيعيًا، وتنقل الفاء الصلة السياقية التي يؤديها δέ هنا.
theological_decisions:
- issue: مرجع الضمير αὐτούς في ما لا يقدر المجلس أن يقضي عليه
  choice: الضمير يعود في المقام الأول إلى الرسل
  alternative: قد يُفهم على نحو أوسع بأنه يشمل حركتهم أو عملهم المذكور في الآية السابقة
  rationale: الضمير اليوناني مذكر جمع، وأقرب مرجع له هم الأشخاص المعروضون أمام المجلس. أُبقي الضمير الشخصي في المتن، مع ذكر الاحتمال الأوسع في الحاشية، حفاظًا على التوتر الدلالي دون تحويل كلام غمالائيل إلى حكم عام على كل حركة دينية.
- issue: قوة تحذير μήποτε καὶ θεομάχοι εὑρεθῆτε
  choice: لئلا يتبيّن أنكم تحاربون الله
  alternative: وإلا فقد توجدون مقاومين لله
  rationale: القراءة المختارة تحفظ معنى التحذير والاحتمال، ولا تقرر أن المجلس يحارب الله فعلًا، كما تصون الصورة القوية في لفظة «محاربي الله».
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. استُعمل «تقضوا عليهم» لسلامته السياقية، وأُضيفت حاشية حتى لا يُفهم بالضرورة بمعنى القتل. أُبقيت الفاصلة الختامية لأن الجملة تتصل سرديًا بما يليها في الآية التالية.
