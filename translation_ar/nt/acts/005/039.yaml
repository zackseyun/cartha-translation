  source_fidelity: يحفظ المتن أصل العبارة على نحو جيد، بما في ذلك الأصل الإلهي («من الله»)، وعدم القدرة المستقبلية، والمرجع الشخصي للجمع. لكن «لئلا يتبيّن أنكم تحاربون الله» يخفف صيغة المبني للمجهول في εὑρεθῆτε ووصف θεομάχοι الاسمي؛ والأدق والأوضح أن يُحافَظ على معنى «تُوجَدوا/يُتبيَّن أنكم محاربون لله».
  naturalness: الأسلوب فصيح معاصر ومترابط. و«تقضوا عليهم» طبيعي في العربية، وإن كان قد يوحي أحيانًا بالإهلاك؛ ولذلك تفيد الحاشية في بيان السعة المعجمية. وصيغة «لئلا تُوجَدوا محاربين لله» سليمة وواضحة في هذا السياق التحذيري، وإن كانت ذات نبرة كتابية مناسبة للمقام.
