  verdict: approve
  source_fidelity: 'النص ينقل عناصر اليونانية بدقة: «وأمّا الآن» تؤدي τὰ νῦν، و«ابتعدوا عن هؤلاء الرجال» تؤدي الأمر ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων، و«اتركوهم وشأنهم» تعبير عربي سليم لـἄφετε αὐτούς. كما يحافظ على علاقة التعليل في ὅτι، وعلى بديلَي «المشورة/العمل»، وعلى دلالة المنشأ في «من البشر»، وعلى المبني للمجهول ومعنى التفكيك أو الإبطال في καταλυθήσεται.'
  naturalness: الصياغة فصيحة معاصرة ومترابطة. «اتركوهم وشأنهم» طبيعي في سياق الأمر بالكف عن التدخل. و«فسيُقوَّض» فصيح ومفهوم هنا، مع أنه أكثر رسمية من بعض البدائل، وهو مناسب لسجل الخطاب.
  terminology: «المشورة» و«العمل» يميزان بأمانة بين βουλή وἔργον. واختيار «البشر» يحفظ المقابلة المصدرية العامة مع الله في الآية التالية من دون قصر المعنى على الذكور، في حين أن «هؤلاء الرجال» مناسب لمرجع الجماعة المباشر. الحاشيتان تقدمان بدائل معجمية ملائمة، وعلامتاهما في موضعهما.
