source:
  edition: SBLGNT
  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: ar
  text: 'وأمّا الآن فأقول لكم: ابتعدوا عن هؤلاء الرجال واتركوهم وشأنهم؛ لأنه إن كانت هذه المشورة أو هذا العمل من البشر[a]، فسيُقوَّض[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من الناس» أو «ذات منشأ بشري».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فسيُهدم» أو «فسيبطل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: وأمّا الآن
  rationale: تعبير عربي طبيعي ينقل التحول إلى النصيحة الراهنة ويحافظ على القوة الخطابية للتعبير اليوناني.
- source_word: ἀπόστητε
  choice: ابتعدوا عن
  rationale: ينقل أمر الانفصال وعدم التدخل بوضوح، من غير تقييده بمجرد الابتعاد المكاني.
- source_word: τῶν ἀνθρώπων τούτων
  choice: هؤلاء الرجال
  rationale: السياق يشير مباشرة إلى الرسل الذكور، ولذلك يحافظ «الرجال» على دقة المرجع هنا.
- source_word: ἄφετε αὐτούς
  choice: اتركوهم وشأنهم
  rationale: صياغة عربية معاصرة واضحة تفيد الكف عن التعرض لهم أو التدخل في أمرهم.
- source_word: ὅτι
  choice: لأنه
  rationale: تُدخل تعليل نصيحة غمالائيل بصورة طبيعية.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: إن كانت ... من البشر
  rationale: «من البشر» تدل على المصدر البشري العام وتحافظ على المقابلة مع «من الله» في العدد التالي.
- source_word: ἡ βουλὴ αὕτη
  choice: هذه المشورة
  rationale: «المشورة» تنقل معنى الخطة أو القصد، وتناسب سياق قرار مقصود من غير حسم ما إذا كان المقصود خطة ذهنية أو غاية.
- source_word: τὸ ἔργον τοῦτο
  choice: هذا العمل
  rationale: مقابل مباشر وطبيعي للمصطلح الواسع ἔργον، ويحافظ على تمييزه عن المشورة.
- source_word: καταλυθήσεται
  choice: فسيُقوَّض
  rationale: يحافظ على صيغة المبني للمجهول وعلى معنى التفكيك والإبطال أو الانهيار.
theological_decisions:
- issue: دلالة ἐξ ἀνθρώπων بوصفها مصدرًا أو منشأً
  choice: من البشر
  alternative: من الناس؛ ذات منشأ بشري
  rationale: العبارة تقابل المصدر البشري بالمصدر الإلهي في العدد التالي. واختيار «البشر» واضح وشامل ولا يقصر المعنى على الرجال المذكورين مباشرة.
- issue: مدى قوة καταλυθήσεται
  choice: فسيُقوَّض
  alternative: فسيُهدم؛ فسيبطل
  rationale: اللفظ يحتمل التفكيك والهدم والإبطال. «يُقوَّض» يحفظ الصورة وقوة المبني للمجهول من غير تقرير آلية السقوط.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «اتركوهم وشأنهم» لتأدية المعنى الاصطلاحي الطبيعي، مع الإبقاء على التوازي بين «المشورة» و«العمل» وعلى المبني للمجهول في خاتمة العدد.
