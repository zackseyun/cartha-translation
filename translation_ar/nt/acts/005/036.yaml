source:
  edition: SBLGNT
  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: ar
  text: فَقَبْلَ هذِهِ الأَيَّامِ ظَهَرَ ثَودَاسُ، مُدَّعِيًا أَنَّهُ شَخْصٌ مُهِمٌّ، فَانْضَمَّ إِلَيْهِ نَحْوُ أَرْبَعِ مِئَةِ رَجُلٍ[a]. فَقُتِلَ، وَتَشَتَّتَ جَمِيعُ الَّذِينَ اقْتَنَعُوا بِهِ[b]، وَآلَ أَمْرُهُمْ إِلَى لا شَيْءٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فمال إليه نحو أربعمئة رجل» أو «التفَّ حوله نحو أربعمئة رجل».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «جميع الذين انقادوا له»؛ وحرفيًّا: «جميع الذين كانوا يقتنعون به».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: فَقَبْلَ هذِهِ الأَيَّامِ
  rationale: تحافظ «فـ» على الصلة التفسيرية التي تؤديها γάρ، وتنقل العبارة الزمنية بصياغة عربية واضحة من غير توسع.
- source_word: ἀνέστη
  choice: ظَهَرَ
  rationale: الفعل هنا يدل على بروز قائد أو ظهوره، لا على قيام جسدي أو قيامة؛ و«ظهر» طبيعية ودقيقة في السياق.
- source_word: Θευδᾶς
  choice: ثَودَاسُ
  rationale: نقل صوتي للاسم اليوناني بصيغة عربية شائعة.
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: مُدَّعِيًا أَنَّهُ شَخْصٌ مُهِمٌّ
  rationale: التركيب اصطلاحي ويفيد ادعاء المكانة والأهمية، لا مجرد القول إنه شخص ما.
- source_word: ᾧ προσεκλίθη
  choice: فَانْضَمَّ إِلَيْهِ
  rationale: ينقل معنى الميل إلى جانبه والالتحاق به بصياغة عربية طبيعية.
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: نَحْوُ أَرْبَعِ مِئَةِ رَجُلٍ
  rationale: تحفظ «نحو» دلالة التقريب في ὡς، وتبقي «رجل» التحديد الذكري في ἀνδρῶν.
- source_word: ὃς ἀνῃρέθη
  choice: فَقُتِلَ
  rationale: يعني ἀναιρέω هنا القتل أو القضاء على الشخص؛ والمبني للمجهول يحفظ صيغة الأصل.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: جَمِيعُ الَّذِينَ اقْتَنَعُوا بِهِ
  rationale: تحفظ العبارة معنى أنهم استجابوا لإقناعه أو انقادوا له، بدل اختزالها في مجرد الاتباع.
- source_word: διελύθησαν
  choice: تَشَتَّتَ
  rationale: يعبر عن انفضاض الجماعة وتبددها بعد مقتل قائدها.
- source_word: ἐγένοντο εἰς οὐδέν
  choice: آلَ أَمْرُهُمْ إِلَى لا شَيْءٍ
  rationale: مقابل عربي طبيعي للتعبير الاصطلاحي الدال على انهيار الحركة وعدم بقائها.
theological_decisions:
- issue: الرواية التاريخية عن ثوداس في كلام غمالائيل
  choice: نقل الخبر بصورته المباشرة بوصفه جزءًا من حجة غمالائيل
  alternative: إدخال صيغة تشكك في الخبر أو تعديله ليتوافق مع إعادة بناء تاريخية خارجية
  rationale: يعرض النص المثال في سياق خطاب غمالائيل؛ ومهمة الترجمة نقل اليونانية كما هي دون فرض حكم تاريخي أو حل توفيقي.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. اختيرت صياغة طبيعية مع المحافظة على تسلسل الحجة، ودلالة التقريب، والمبني للمجهول، والتحديد الذكري في «رجل». أُثبتت علامتا الحاشيتين [a] و[b] في المتن.
