  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: ar
  text: واحتجز لنفسه سرًّا جزءًا من ثمن البيع[a]، وكانت زوجته تعلم بذلك أيضًا، فأتى بجزءٍ ما من الثمن ووضعه عند أقدام الرسل.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اختلس لنفسه جزءًا من ثمن البيع»؛ فالفعل اليوناني يفيد حجز شيء للنفس على نحو خفي وغير أمين.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «عند أقدام الرسل»، وهي صورة محسوسة لوضع المال أمامهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: اختلس لنفسه جزءًا
  rationale: يفيد الفعل الاحتفاظ الخفي بشيء للنفس على نحو غير أمين؛ و«اختلس لنفسه» يحفظ قوته الأخلاقية، مع تجنب تصوير الفعل على أنه مجرد احتفاظ محايد.
- source_word: ἀπὸ τῆς τιμῆς
  choice: من ثمن البيع
  rationale: تشير τιμή هنا إلى الثمن المقبوض مقابل العقار؛ وإضافة «البيع» توضح المعنى السياقي في العربية.
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: وكانت زوجته عالمة بذلك أيضًا
  rationale: ينقل التركيب المطلق المصاحب وعي الزوجة بالفعل واشتراكها في العلم به، مع إبراز καί بلفظة «أيضًا».
- source_word: ἐνέγκας μέρος τι
  choice: ثم أتى بجزء منه
  rationale: ينقل اسم الفاعل الأوريستي فعلًا سابقًا للوضع، ويؤدي μέρος τι بمعنى جزء غير محدد من الثمن.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: ووضعه عند أقدام الرسل
  rationale: يحفظ الصورة المكانية المحسوسة المتكررة في سفر الأعمال، بدل استبدالها بتفسير مجرد مثل «قدّمه إليهم».
theological_decisions:
- issue: القوة الأخلاقية لفعل حنانيا
  choice: صياغة الفعل بوصفه اقتطاعًا خفيًا وغير أمين لنفسه
  alternative: احتفظ بجزء من الثمن
  rationale: يدل νοσφίζομαι وسياق الرواية على حجز مخادع لا على مجرد إبقاء جزء مشروع، من غير إضافة توصيف عقائدي يتجاوز النص.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم «اختلس لنفسه» لإبراز معنى الحجز الخفي في الفعل اليوناني، وحُفظت صورة «عند أقدام الرسل». وُضع مؤشرا الحاشيتين في المتن، الأول بعد العبارة المعجمية موضع البديل والثاني بعد العبارة المكانية.
