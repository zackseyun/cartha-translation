  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: ar
  text: إلهُ آبائنا أقام[a] يسوعَ، الذي قتلتموه إذ علَّقتموه على خشبةٍ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'قد يُفهَم الفعل هنا على أنه يشير إلى القيامة، مع أن اليونانية لا تقول صراحةً في هذه الآية: «من بين الأموات».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «على صليب». تقول اليونانية حرفيًا: «على خشبة»، وفي ذلك على الأرجح صدى لتثنية 21:23.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: إلهُ آبائنا
  rationale: صياغة عربية كتابية طبيعية تحفظ تعبير الانتماء إلى آباء إسرائيل وصدى الصيغة العهدية، من غير حاجة إلى تمثيل أداة التعريف اليونانية تمثيلًا حرفيًا منفصلًا.
- source_word: ἤγειρεν
  choice: أقام
  rationale: الفعل العربي «أقام» يحتمل هنا دلالة القيامة التي يقتضيها السياق، من غير إضافة عبارة «من بين الأموات» غير الموجودة صراحة في الآية.
- source_word: Ἰησοῦν
  choice: يسوعَ
  rationale: الصيغة العربية المعيارية للاسم، وجاء منصوبًا لأنه مفعول به.
- source_word: διεχειρίσασθε
  choice: قتلتموه
  rationale: ينقل بوضوح معنى الفعل في هذا السياق، أي إهلاك يسوع وقتله، مع إبقاء العبارة التالية مبيِّنة لكيفية ذلك.
- source_word: κρεμάσαντες
  choice: معلِّقين إياه
  rationale: يحفظ صورة اسم الفاعل وعلاقته بفاعل «قتلتموه»، ويعبّر طبيعيًا عن الوسيلة أو الملابسة التي تم بها القتل.
- source_word: ἐπὶ ξύλου
  choice: على خشبةٍ
  rationale: «خشبة» تقابل ξύλον وتحفظ الصدى المحتمل لتثنية 21:23 والاستعمال المسيحي المبكر، بدل استبدال اللفظ التفسيري «صليب» بالنص.
theological_decisions:
- issue: هل يُصرَّح في ترجمة ἤγειρεν بالقيامة من بين الأموات؟
  choice: أقام
  alternative: أقام من بين الأموات
  rationale: السياق يدل بقوة على القيامة، لكن اليونانية في هذه الآية لا تتضمن صراحة عبارة «من بين الأموات»؛ لذلك تُحفظ دلالة الفعل واتساعه دون زيادة تفسيرية.
- issue: هل تُترجم ξύλον إلى «صليب»؟
  choice: على خشبة
  alternative: على صليب
  rationale: النص يستعمل ξύλον لا σταυρός؛ والإبقاء على «خشبة» يحفظ الاختيار المعجمي والتلميح المرجح إلى تثنية 21:23، مع وضوح الإشارة إلى صلب يسوع من السياق.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية كريمة. استُعمل «آبائنا» للمحافظة على الصيغة الكتابية، و«خشبة» للمحافظة على اللفظ والصدى النصي. وُضعت علامتا الحاشيتين عقب اللفظ الذي تشرحانه مباشرة.
