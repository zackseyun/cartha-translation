lexical_decisions:
- source_word: ἀναστάντες
  choice: فنهض
  rationale: اسم فاعل ماضٍ من ἀνίστημι يدل هنا على قيامهم للشروع في العمل؛ وصيغة «نهض» موجزة وطبيعية في السرد العربي.
- source_word: δὲ
  choice: فـ
  rationale: تفيد δέ انتقال السرد وتقدّمه، والفاء العربية توصل الحدث بما قبله بصورة طبيعية.
- source_word: οἱ νεώτεροι
  choice: الشبان
  rationale: اللفظ اليوناني صيغة مقارنة وقد يعني «الأصغر سنًّا»، لكنه قد يُستعمل أيضًا بمعنى عام هو «الشبان». اختير التعبير الطبيعي في العربية، مع حفظ الاحتمال المقارن في الحاشية.
- source_word: συνέστειλαν
  choice: لفّوه
  rationale: يدل الفعل في هذا السياق على جمع الجسد أو لفّه تمهيدًا لإخراجه ودفنه؛ و«لفّوه» واضح ولا يضيف طقوسًا أو تجهيزات لا يذكرها النص.
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير المفعول يعود إلى حنانيا، وأُلحق بالأفعال على النحو الطبيعي في العربية.
- source_word: ἐξενέγκαντες
  choice: حملوه إلى خارج
  rationale: اسم فاعل ماضٍ من ἐκφέρω يدل على إخراج الجسد بالحمل؛ وهذه الصياغة تحفظ معنى الحركة إلى الخارج بوضوح.
- source_word: ἔθαψαν
  choice: دفنوه
  rationale: مقابل عربي مباشر وطبيعي للفعل θάπτω.
