base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: ar
  text: حتى إنهم كانوا يُخرجون المرضى حتى إلى الشوارع[a]، ويضعونهم على أسرّة وحُصُر[b]، لكي، عند مرور بطرس، يُظلِّل ظلُّه ولو واحدًا منهم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى الساحات العامة». يمكن للكلمة اليونانية أن تدل على الشوارع العريضة أو الأماكن العامة المفتوحة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «على أسرّة وفرش». يميّز النص اليوناني بين نوعين من أدوات النوم أو سطوح الاضطجاع.'
    reason: lexical_alternative
  - marker: c
    text: 'تصف الآية قصد الناس: وضعوا المرضى لكي يُظلِّل ظلُّ بطرس، عند مروره، ولو واحدًا منهم؛ لكنها لا تقول صراحة هنا إن الظل نفسه شفى أحدًا.'
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: حتى إنهم
  rationale: تؤدي معنى النتيجة المترتبة على ما سبق، بصياغة عربية طبيعية واضحة.
- source_word: καὶ εἰς τὰς πλατείας
  choice: إلى الشوارع أيضًا
  rationale: تحافظ «أيضًا» على قوة καί، ويمكن أن تدل πλατεῖαι على الشوارع العريضة أو الساحات العامة.
- source_word: ἐκφέρειν
  choice: يُخرجون
  rationale: يفيد إخراج المرضى من البيوت إلى الأماكن العامة، ويحمل السياق معنى نقلهم جسديًا دون حاجة إلى تكرار فعل الحمل.
- source_word: τοὺς ἀσθενεῖς
  choice: المرضى
  rationale: السياق سياق شفاء، ولذلك يدل اللفظ هنا على المصابين بالمرض لا على الضعفاء عمومًا.
- source_word: τιθέναι
  choice: يضعونهم
  rationale: صياغة عربية مباشرة وطبيعية لوضع المرضى على أدوات النوم أو الحمل.
- source_word: ἐπὶ κλιναρίων καὶ κραβάττων
  choice: على أسرّة وحُصُر
  rationale: تحافظ العبارة على التمييز بين نوعين من مواضع الاضطجاع، أحدهما سرير والآخر فراش بسيط أو حصير.
- source_word: ἵνα
  choice: لكي
  rationale: تبيّن الغرض المقصود من وضع المرضى في الطريق.
- source_word: ἐρχομένου Πέτρου
  choice: حين يمرّ بطرس
  rationale: تنقل تركيب المضاف المطلق وحركة بطرس بمحاذاة المرضى بعبارة عربية موجزة وطبيعية.
- source_word: κἂν
  choice: ولو
  rationale: تفيد أن أدنى تماس مأمول، أي مجرد وقوع الظل، كان كافيًا في قصد الناس.
- source_word: ἡ σκιὰ
  choice: ظلُّ بطرس
  rationale: ترجمة حرفية للفظ مع إظهار مرجع الضمير في العربية منعًا للالتباس.
- source_word: ἐπισκιάσῃ
  choice: يُظلِّل
  rationale: يحافظ على صورة الظل في الفعل اليوناني بدل تفسيرها ضمنيًا بأنها شفاء.
- source_word: τινὶ αὐτῶν
  choice: أحدًا منهم
  rationale: ينقل المفرد غير المعيّن ضمن الجماعة بدقة أكبر من تعبير قد يوحي حصرًا بعدد معلوم.
theological_decisions:
- issue: هل تفيد الآية أن ظل بطرس نفسه كان يشفي؟
  choice: 'تذكر الصياغة غرض الناس ورجاءهم فقط: وضعوا المرضى لكي يظلّلهم ظل بطرس.'
  alternative: صياغة تصرّح بأن ظل بطرس كان يشفي المرضى أو أن قوة الشفاء كانت كامنة فيه.
  rationale: يرد ἵνα مع صيغة الاحتمال التابعة له في سياق قصد الناس، ولا تصرّح هذه الآية بذاتها بأن الظل أحدث الشفاء، وإن كان السياق الأوسع يذكر شفاءات كثيرة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «حتى إنهم» لإظهار النتيجة، و«ولو» لنقل الحد الأدنى المأمول، مع إبقاء العلاقة بين الظل والشفاء غير محسومة كما في النص اليوناني.
