source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: ar
  text: 'فقال بطرس: «يا حنانيا، لماذا ملأ الشيطان قلبك حتى تكذب على الروح القدس[a] وتستبقي لنفسك جزءًا من ثمن الأرض[b][c]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «حتى تخدع الروح القدس»؛ لكن الفعل اليوناني هنا يُفهم على نحو مباشر بمعنى الكذب على شخص.'
    reason: lexical_alternative
  - marker: b
    text: 'أي: جزءًا من عائد البيع أو من ثمن البيع.'
    reason: lexical_alternative
  - marker: c
    text: يمكن أيضًا ترجمة «الأرض» بـ«العقار» أو «الحقل».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: فقال بطرس
  rationale: تنقل الفاءُ الانتقالَ السياقي الخفيف الذي تؤديه δέ، وتصل كلام بطرس بما قبله على نحو طبيعي من غير المبالغة في معنى الاستدراك.
- source_word: διὰ τί
  choice: لماذا
  rationale: مقابل عربي مباشر وطبيعي لعبارة السؤال عن السبب.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: ملأ الشيطان قلبك
  rationale: يحفظ صورة ملء القلب كما هي، ويُبقي الشيطان فاعلًا نحويًا من غير تفسير العبارة على أنها تملّك كامل أو إكراه لا يقاوم.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: حتى تكذب على الروح القدس
  rationale: «تكذب على» تعبير عربي واضح ومباشر، و«حتى» تصل ملء القلب بما ترتب عليه أو اتجه إليه من غير حسم دقيق بين الغاية والنتيجة.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: الصيغة العربية المعاصرة الراسخة للاسم، وتحفظ الإشارة الشخصية المباشرة في النص.
- source_word: νοσφίσασθαι
  choice: تستبقي لنفسك جزءًا
  rationale: ينقل معنى احتجاز المرء لنفسه جزءًا مما كان ينبغي تقديمه، من غير استعمال «تختلس» الذي قد يضيف تحديدًا قانونيًا أقوى من اللفظ اليوناني.
- source_word: ἀπὸ τῆς τιμῆς
  choice: جزءًا من ثمن
  rationale: يفيد ἀπό مع المضاف إليه الأخذ من مجموع، ولذلك صُرّح بـ«جزءًا من»، و«ثمن» هو المقابل الأقرب لـτιμή في سياق البيع.
- source_word: τοῦ χωρίου
  choice: الأرض
  rationale: χωρίον قد يدل على قطعة أرض أو حقل أو عقار؛ و«الأرض» طبيعية في سياق ملك بيع، ولا تضيّق الدلالة أكثر مما يسمح به الأصل.
theological_decisions:
- issue: فاعلية الشيطان ومسؤولية حنانيا
  choice: إبقاء العبارة الحرفية «ملأ الشيطان قلبك»
  alternative: لماذا سمحت للشيطان أن يملأ قلبك / لماذا سيطر الشيطان عليك
  rationale: الأصل يجعل الشيطان فاعل «ملأ»، وفي الوقت نفسه يواجه حنانيا بوصفه مسؤولًا. لا يحدد النص هنا تملّكًا شيطانيًا كاملًا ولا ينفي المسؤولية البشرية، فحُفظ التوتر من غير تفسير زائد.
- issue: الكذب على الروح القدس
  choice: تكذب على الروح القدس
  alternative: تخدع الروح القدس / تكذب في حضرة الروح القدس
  rationale: يحفظ هذا الاختيار البناء الشخصي المباشر وقوة العبارة، من غير تحويلها إلى شرح عقائدي أو تخفيفها.
- issue: العلاقة بين ملء القلب والفعلين التاليين
  choice: حتى تكذب... وتستبقي
  alternative: لكي تكذب... وتستبقي / فتكذب... وتستبقي
  rationale: يمكن للمصدرين اليونانيين أن يبيّنا ما اتجه إليه ملء القلب أو ما نتج عنه؛ «حتى» تبقي قدرًا من هذا الاتساع ولا تحصر العلاقة في غاية مقصودة وحدها.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة، مع خطاب مباشر طبيعي. حُفظت استعارة «ملأ القلب»، وتُجنبت ألفاظ قد توحي قسرًا بالتملّك الشيطاني أو بتوصيف قانوني محدد لفعل حنانيا.
