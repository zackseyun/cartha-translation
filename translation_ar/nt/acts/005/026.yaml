base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: ar
  text: حينئذٍ ذهب قائدُ حرس الهيكل مع الحرس، وأحضرهم من غير عنف، لأنهم كانوا يخافون الشعب لئلا يُرجَموا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي إن قائد الحرس والحرس كانوا يخافون أن يرجمهم الشعب.
    reason: توضيح مرجع ضمير الجمع في «يُرجَموا»، إذ قد يلتبس في العربية بالرسل المذكورين قبلَه.
lexical_decisions:
- source_word: στρατηγὸς
  choice: قائد حرس الهيكل
  rationale: يدل اللفظ في هذا السياق على المسؤول عن حفظ النظام في الهيكل، لا على قائد عسكري روماني. والتصريح بحرس الهيكل يوضح الوظيفة للقارئ العربي.
- source_word: ὑπηρέταις
  choice: الحرس
  rationale: يشير السياق إلى الأعوان المكلفين بتنفيذ أمر الإحضار وحفظ النظام؛ و«الحرس» أوضح وأطبع هنا من «الخدام».
- source_word: ἤγαγεν αὐτούς
  choice: أحضرهم
  rationale: الفعل ἄγω يحتمل القيادة أو الإحضار، و«أحضرهم» ينقل فعل اقتياد الرسل إلى الجهة الطالبة من غير إضافة وجهة غير مصرّح بها.
- source_word: οὐ μετὰ βίας
  choice: من غير عنف
  rationale: ينقل العبارة الدالة على عدم استعمال القوة القسرية بصياغة عربية طبيعية ومباشرة.
- source_word: ἐφοβοῦντο
  choice: كانوا يخافون
  rationale: يحافظ على دلالة الماضي الناقص، أي الخوف القائم في ذلك الموقف.
- source_word: τὸν λαόν
  choice: الشعب
  rationale: ترجمة مباشرة لـ λαός، وتشير هنا إلى عامة الناس الحاضرين أو المحيطين بالمشهد.
- source_word: μὴ λιθασθῶσιν
  choice: لئلا يُرجَموا
  rationale: يحفظ تركيب الخوف من نتيجة محتملة، كما يحفظ المبني للمجهول وعدم التصريح بمن سيقوم بالرجم.
- source_word: τότε ἀπελθὼν
  choice: حينئذٍ ذهب
  rationale: يصوغ التتابع السردي بالعربية الطبيعية من غير التزام حرفي ثقيل بصيغة اسم الفاعل اليونانية.
