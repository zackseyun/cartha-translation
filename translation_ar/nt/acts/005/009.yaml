id: ACT.5.9
reference: Acts 5:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: ar
  text: 'فقال لها بطرس: «لماذا اتفقتما[a] على أن تختبرا روح الرب؟[b] ها إن أقدام الذين دفنوا زوجك عند الباب، وسيحملونك إلى الخارج».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تواطأتما».'
    reason: بديل سياقي أقوى يبرز طبيعة الاتفاق، مع أن الفعل اليوناني يعني أساسًا الاتفاق.
  - marker: b
    text: لم يرد لفظ «القدس» صراحة هنا؛ والسياق يرجح أن المقصود هو الروح القدس.
    reason: إيضاح يحفظ صياغة الأصل مع بيان المرجع المحتمل بقوة من السياق.
lexical_decisions:
- source_word: Τί ὅτι
  choice: لماذا
  rationale: تنقل قوة السؤال التوبيخي في العبارة اليونانية بصياغة عربية طبيعية ومباشرة.
- source_word: συνεφωνήθη ὑμῖν
  choice: اتفقتما معًا
  rationale: الفعل المبني للمجهول مستعمل هنا استعمالًا اصطلاحيًا للدلالة على اتفاق متبادل. وصيغة المثنى العربية تُظهر أن الخطاب عن اتفاق سفيرة وزوجها من غير أن تضيف إلى الفعل معنى «التآمر» صراحة.
- source_word: πειράσαι
  choice: على أن تختبرا
  rationale: المعنى هنا وضع روح الرب موضع الاختبار، لا إغراؤه بالشر؛ وصيغة المثنى توافق الطرفين المشتركين في الاتفاق.
- source_word: τὸ πνεῦμα κυρίου
  choice: روح الرب
  rationale: تحافظ على تركيب الإضافة اليوناني وعلى الإشارة المرجحة إلى الروح القدس من غير إدخال لفظ «القدس» غير المذكور صراحة في الآية.
- source_word: ἰδοὺ
  choice: ها إن
  rationale: أداة تنبيه عربية واضحة تحفظ الفورية والوقع التحذيري في السياق.
- source_word: οἱ πόδες
  choice: أقدام
  rationale: تحافظ على الصورة الحية الحرفية في اليونانية بدل تحويلها تفسيريًا إلى «خطوات» أو إلى الأشخاص أنفسهم.
- source_word: τῶν θαψάντων
  choice: الذين دفنوا
  rationale: تنقل اسم الفاعل الجمع من غير إضافة «الرجال»، وهي غير مصرّح بها في النص اليوناني.
- source_word: τὸν ἄνδρα σου
  choice: زوجك
  rationale: السياق يحدد أن ἀνήρ يشير إلى حنانيا بوصفه زوج سفيرة، لا إلى مجرد رجل.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: عند الباب
  rationale: تعبير عربي طبيعي يدل على وجودهم عند المدخل.
- source_word: ἐξοίσουσίν σε
  choice: سيحملونك إلى الخارج
  rationale: يحفظ مباشرة الفعل اليوناني وإيحاءه بالموت والدفن من غير إضافة كلمة «جثمانك» غير الواردة صراحة.
theological_decisions:
- issue: مرجع «روح الرب»
  choice: الإبقاء على «روح الرب» بوصفها الإشارة المرجحة إلى الروح القدس في سياق أعمال 5، من غير توسع تفسيري.
  alternative: فهم العبارة على نحو أعم بوصفها حضور الرب الروحي.
  rationale: السياق القريب، ولا سيما أعمال 5:3، يرجح الإشارة إلى الروح القدس، لكن الترجمة تتبع ألفاظ هذه الآية ولا تستبدل بها «الروح القدس».
- issue: قوة اتهام بطرس
  choice: اتفقتما معًا
  alternative: تواطأتما معًا
  rationale: الفعل اليوناني يدل في ذاته على الاتفاق، في حين أن معنى التواطؤ حاضر بقوة من السياق. أبقت الترجمة الدلالة المعجمية الأساسية وتركت للسياق أن يبين جسامة الفعل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية مهيبة. استُعمل المثنى في «اتفقتما» و«تختبرا» لإبراز اشتراك الزوجين الذي تدل عليه صيغة الجمع اليونانية والسياق. وحُفظت صورة «الأقدام» وعبارة «سيحملونك إلى الخارج» لما فيهما من وقع درامي مباشر.
