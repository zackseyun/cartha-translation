  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: ar
  text: 'قائلًا: «لقد أمرناكم أمرًا صارمًا ألّا تعلِّموا بهذا الاسم، وها أنتم قد ملأتم أورشليم بتعليمكم، وتريدون أن تجلبوا علينا دم هذا الرجل»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي، بصياغة أوضح: «أن تحمّلونا مسؤولية موت هذا الرجل». فتعبير «جلب دمه عليهم» في اليونانية كناية عن تحميلهم تبعة سفك دمه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: ألم نأمركم أمرًا صارمًا
  rationale: يجمع المصدر مع الفعل المشتق من الجذر نفسه للتوكيد. حافظت العربية على البناء الاشتقاقي الطبيعي «نأمركم أمرًا»، وأضافت «صارمًا» لإبراز قوة النهي في السياق. وصيغة السؤال تلائم النبرة التوبيخية، مع أن اليونانية تُفهم حرفيًا خبرًا مؤكدًا.
- source_word: μὴ διδάσκειν
  choice: ألّا تعلِّموا
  rationale: ينقل مضمون النهي مباشرة من غير إضافة معنى «تتوقفوا»، وهو معنى لا يفرضه النص.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: بهذا الاسم
  rationale: يحافظ على تعبير الاسم وما يتضمنه في سياق أعمال الرسل من الارتباط بسلطان صاحبه، دون تسطيحه إلى «عن هذا الاسم».
- source_word: ἰδοὺ
  choice: وها أنتم
  rationale: تعبير عربي معاصر واضح يحفظ قوة لفت الانتباه والمواجهة، ويرتبط طبيعيًا بضمير المخاطبين.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: قد ملأتم أورشليم
  rationale: يحفظ استعارة الملء، وتنقل «قد» الفعل المنجز ذي الأثر الحاضر الذي تدل عليه صيغة التام اليونانية.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: بتعليمكم
  rationale: الباء تلائم الفعل «ملأ» في العربية، و«تعليم» أوضح وأقل تقيدًا بالمصطلحات المذهبية من «عقيدة».
- source_word: βούλεσθε
  choice: تريدون
  rationale: ينقل معنى الإرادة المقصودة مباشرة، ويحافظ على الاتهام من غير تشديد زائد مثل «مصممون».
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: أن تجلبوا علينا
  rationale: يحفظ صورة الإتيان بشيء على أشخاص، وهي هنا تفيد تحميلهم التبعة، دون شرح ذلك داخل المتن.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: دم هذا الرجل
  rationale: يحفظ صورة الدم وتعبير التباعد العدائي «هذا الرجل»، ولا يستبدله بالتفسير الصريح لمسؤولية الموت.
theological_decisions:
- issue: دلالة جلب دم هذا الرجل عليهم
  choice: الإبقاء على الصورة الحرفية «أن تجلبوا علينا دم هذا الرجل» في المتن
  alternative: «أن تحمّلونا مسؤولية موت هذا الرجل»
  rationale: التعبير يفيد تحميل تبعة سفك الدم، لكن إبقاء صورة الدم يصون قوة العبارة وتوترها اللاهوتي، وتوضح الحاشية معناها الاصطلاحي من غير أن تستبدل النص بتفسيره.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «أورشليم» اتساقًا مع الصيغة الكتابية العربية الشائعة، وحُفظت النبرة الاتهامية والصور الأصلية من غير إدخال تفسير مذهبي. وُضع رمز الحاشية بعد الجملة التي تشرحها.
