lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: وبعد أن أُطلق سراحهما
  rationale: اسم الفاعل الماضي المبني للمجهول يدل على حدث سبق الفعل الرئيس، والسياق سياق إطلاق من الاحتجاز؛ وصيغة التثنية يقتضيها السياق السابق الذي يحدد بطرس ويوحنا.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة، نقلت بالواو مع العبارة الزمنية لتبقى العربية طبيعية.
- source_word: ἦλθον
  choice: ذهبا
  rationale: الفعل ἔρχομαι يحتمل المجيء أو الذهاب بحسب وجهة النظر، و«ذهبا إلى» هو الأنسب هنا؛ والتثنية توضح مرجع الفاعل السياقي.
- source_word: πρὸς τοὺς ἰδίους
  choice: إلى رفاقهما
  rationale: التعبير يعني حرفيًا «إلى خاصتهما/من يخصونهما»، والمقصود جماعتهما أو أصحابهما؛ «رفاقهما» واضحة من غير تحديد زائد، مع إثبات البدائل في الحاشية.
- source_word: ἀπήγγειλαν
  choice: وأخبراهما
  rationale: يدل الفعل على نقل الخبر أو الإبلاغ؛ «أخبراهما» عربية طبيعية، والضمير يعود إلى الرفاق بوصفهم جماعة، أي أخبراهم.
- source_word: ὅσα
  choice: بكل ما
  rationale: تحفظ معنى الشمول في الموصول اليوناني.
- source_word: πρὸς αὐτοὺς
  choice: لهما
  rationale: مع فعل القول، تعني πρός مع النصب توجيه الكلام إلى شخص؛ والتثنية تحدد بطرس ويوحنا من السياق دون إدخال معنى «ضدهما».
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: المقابل العربي المألوف للسلطات الكهنوتية العليا بصيغة الجمع، لا لعدة أشخاص يحملون منصب رئيس الكهنة المفرد.
- source_word: οἱ πρεσβύτεροι
  choice: الشيوخ
  rationale: يدل اللفظ في هذا السياق المؤسسي على شيوخ الشعب المعترف بهم، لا على كبار السن عمومًا.
- source_word: εἶπαν
  choice: قاله
  rationale: الفعل الماضي العربي داخل جملة الموصول، مع سياق الإخبار اللاحق، يبين سبق القول من غير حاجة إلى تركيب ماضٍ تام ثقيل.
