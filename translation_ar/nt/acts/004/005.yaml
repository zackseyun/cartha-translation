  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: ar
  text: وحدث في اليوم التالي أن اجتمع رؤساؤهم وشيوخهم وكتبتهم في أورشليم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يُجمع رؤساؤهم وشيوخهم وكتبتهم». الفعل اليوناني مبني للمجهول، بينما تستعمل العربية هنا «اجتمع» استعمالًا طبيعيًا للدلالة على انعقادهم معًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وفي
  rationale: الصيغة السردية تنقل الخبر إلى الحدث التالي؛ تؤدي «وفي» هذا الانتقال طبيعيًا في العربية من غير ترجمة حرفية ثقيلة مثل «وحدث أن».
- source_word: ἐπὶ τὴν αὔριον
  choice: اليوم التالي
  rationale: تعبير زمني يعني اليوم اللاحق، وجاء بعد «في» بصياغة عربية واضحة.
- source_word: συναχθῆναι
  choice: اجتمع
  rationale: ينقل معنى التجمّع بصياغة عربية طبيعية، مع بيان المبني للمجهول في الحاشية لأن اليونانية تحتمله بصيغتها الصرفية.
- source_word: αὐτῶν
  choice: هم
  rationale: أُبقي ضمير الإضافة كما في اليونانية دون تعيين مرجعه تعيينًا أضيق مما يصرّح به النص.
- source_word: τοὺς ἄρχοντας
  choice: حكّام
  rationale: يدل اللفظ هنا على أصحاب السلطة والقيادة، و«حكّام» تحافظ على دلالته المؤسسية.
- source_word: τοὺς πρεσβυτέρους
  choice: شيوخ
  rationale: المقصود قادة الجماعة المعترف بهم، لا مجرد المتقدمين في السن.
- source_word: τοὺς γραμματεῖς
  choice: الكتبة
  rationale: المصطلح المألوف للفئة المتخصصة في الشريعة والكتابة، من غير توسيع تفسيري إلى «معلّمي الشريعة».
- source_word: ἐν Ἰερουσαλήμ
  choice: في أورشليم
  rationale: ترجمة مكانية مباشرة مع استعمال الاسم الكتابي العربي المألوف.
theological_decisions:
- issue: مرجع الضمير αὐτῶν في وصف السلطات المجتمعة
  choice: حكّامهم
  alternative: حكّام اليهود؛ أو حذف الضمير والقول «الحكّام»
  rationale: يحافظ النص على الضمير اليوناني من غير أن يحدّد مرجعه بأكثر مما تفعل الآية نفسها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختُصرت الصيغة السردية اليونانية إلى انتقال عربي طبيعي، مع الحفاظ على الضمير وعلى أسماء فئات القيادة، وإبراز الصيغة المبنية للمجهول في الحاشية.
