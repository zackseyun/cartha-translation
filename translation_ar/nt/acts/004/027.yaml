  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: ar
  text: فقد اجتمع حقًّا في هذه المدينة هيرودس وبنطيوس بيلاطس، مع الأمم وشعوب إسرائيل، ضدّ عبدك القدوس يسوع[a] الذي مسحته.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «طفلك القدوس يسوع». يمكن أن تعني الكلمة اليونانية «عبدًا» أو «طفلًا»؛ ورُجِّحت هنا «عبدك» بسبب الصدى المحتمل للحديث عن عبد الرب في إشعياء.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «الأمم وشعوب إسرائيل»؛ جاءت كلمة «شعوب» في اليونانية بصيغة الجمع.'
    reason: textual_form
lexical_decisions:
- source_word: συνήχθησαν
  choice: اجتمع
  rationale: ينقل وقوع الاجتماع بوصفه حدثًا مكتملًا. وصيغة «اجتمع» عربية طبيعية، مع أن اليونانية مبنية للمجهول صرفيًّا.
- source_word: γὰρ
  choice: فقد
  rationale: تربط الآية بما قبلها بوصفها بيانًا لتحقيق ما ورد في المزمور ضمن الصلاة.
- source_word: ἐπ’ ἀληθείας
  choice: حقًّا
  rationale: تعبير ظرفي توكيدي معناه «في الحقيقة» أو «بالفعل»، و«حقًّا» موجزة وطبيعية.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: في هذه المدينة
  rationale: يحافظ على الإشارة السياقية إلى أورشليم من غير إدخال الاسم في المتن.
- source_word: ἐπὶ τὸν
  choice: على
  rationale: مع فعل الاجتماع تفيد التوجّه العدائي؛ و«اجتمع على فلان» تعبير عربي فصيح واضح يفيد التآمر أو المعارضة.
- source_word: ἅγιον
  choice: القدوس
  rationale: يحفظ معنى القداسة والتكريس لله، وهو وصف مناسب في هذا السياق الدعائي.
- source_word: παῖδά σου
  choice: عبدك
  rationale: يمكن أن تعني اللفظة «عبدًا» أو «فتى/ولدًا»، لكن صدى عبد الرب في إشعياء واستعمالها في أعمال 3–4 يرجّح «عبدك».
- source_word: Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية الكتابية المعيارية للاسم.
- source_word: ὃν ἔχρισας
  choice: الذي مسحته
  rationale: يحفظ المعنى الحرفي لـχρίω والرنين المسياني والتكليف الإلهي، من غير تحويل الفعل إلى لقب.
- source_word: Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος
  choice: هيرودس وبنطيوس بيلاطس
  rationale: نقل معياري للاسمين مع تمثيل الربط اليوناني بصياغة عربية طبيعية.
- source_word: ἔθνεσιν
  choice: الأمم
  rationale: يحفظ الدلالة على الأمم غير اليهود في مقابل إسرائيل، وهو تعبير كتابي عربي مفهوم.
- source_word: λαοῖς Ἰσραήλ
  choice: شعوب إسرائيل
  rationale: يحافظ على صيغة الجمع اليونانية λαοῖς بدل تسويتها إلى المفرد.
theological_decisions:
- issue: دلالة παῖς في وصف يسوع
  choice: عبدك
  alternative: فتاك أو ولدك؛ أما «ابنك» فتفسير أضيق من اللفظة هنا
  rationale: السياق يستدعي لغة عبد الرب، لكن الهامش يحفظ التعدد المعجمي الحقيقي من غير أن ينفي بنوّة يسوع المثبتة في مواضع أخرى.
- issue: دلالة ἔθνεσιν في مقابل إسرائيل
  choice: الأمم
  alternative: الوثنيون أو غير اليهود
  rationale: «الأمم» تحافظ على اللفظ الكتابي وعلى إمكانية الدلالة العامة، فيما يوضح التقابل مع إسرائيل أن المقصود هنا الأمم غير اليهود.
- issue: صيغة الجمع في λαοῖς Ἰσραήλ
  choice: شعوب إسرائيل
  alternative: شعب إسرائيل
  rationale: المتن اليوناني يقرأ الجمع، فحُفظ لتجنب تسوية سمة نصية لافتة، مع إيضاحها في الهامش.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «اجتمع على» لإبراز اتجاه الاجتماع العدائي بصورة طبيعية، وحُفظت «شعوب إسرائيل» بصيغة الجمع وفق الأصل. وُضعت علامتا الهامش بعد العبارتين اللتين تشرحهما كل منهما.
