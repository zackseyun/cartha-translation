  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: ar
  text: والآن يا رب، انظر إلى تهديداتهم، وامنح عبيدك[a] أن يتكلموا بكلمتك بكل جرأة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خدامك». تدل الكلمة اليونانية على من ينتمي إلى سيد ويخضع له.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: والآن
  rationale: تعبير انتقالي طبيعي في سياق الصلاة، ينقل الكلام من عرض ما حدث إلى الطلب الحاضر.
- source_word: κύριε
  choice: يا رب
  rationale: نداء مباشر لله في الصلاة؛ و«يا رب» هو المقابل العربي المألوف واللائق بالسياق.
- source_word: ἔπιδε ἐπὶ
  choice: انظر إلى
  rationale: يحفظ صورة النظر الواردة في اليونانية ويؤدي معنى الالتفات إلى التهديدات وأخذها في الحسبان.
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: تهديداتهم
  rationale: صياغة عربية موجزة وواضحة تؤدي الجمع والإضافة إلى أصحاب التهديدات.
- source_word: δὸς
  choice: امنح
  rationale: فعل طلب مناسب للغة الصلاة، ويعبر عن التماس التمكين الإلهي لا مجرد العطاء المادي.
- source_word: τοῖς δούλοις σου
  choice: عبيدك
  rationale: يحفظ المعنى الأقوى لـ δοῦλος، أي الانتماء والخضوع للسيد، وهو في العربية الكتابية مفهوم بوصفه عبودية لله لا وصفًا مهينًا.
- source_word: μετὰ παρρησίας πάσης
  choice: بكل جرأة
  rationale: يؤدي معنى الكلام العلني الشجاع بلا خوف، ويحفظ تقوية المعنى بكلمة πάσης.
- source_word: λαλεῖν
  choice: أن يتكلموا
  rationale: المعنى المباشر للفعل، من غير إضافة دلالة «الكرازة» التي ليست صريحة في اللفظ نفسه.
- source_word: τὸν λόγον σου
  choice: بكلمتك
  rationale: يحفظ التعبير الكتابي ودلالته على كلمة الله أو رسالته المعلنة، مع تركيب عربي طبيعي بعد «يتكلموا».
theological_decisions:
- issue: ترجمة δοῦλος في خطاب موجَّه إلى الله
  choice: عبيدك
  alternative: خدامك
  rationale: «عبيدك» تحافظ على دلالة الانتماء التام والخضوع التي يحملها اللفظ اليوناني، بينما «خدامك» ألين وقد تبرز الخدمة أكثر من التبعية. أُثبت البديل في الحاشية حتى لا يُحسم الاتساع الدلالي للفظ دون تنبيه.
translation_notes:
  register: عربية فصحى معاصرة واضحة، بنبرة صلاة مهيبة غير متكلفة. استُعملت «جرأة» للدلالة على الشجاعة والصراحة في إعلان الكلمة، ووُضعت علامة الحاشية بعد اللفظ الذي تتعلق به مباشرة.
