  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: ar
  text: وكان جمهور الذين آمنوا قلبًا واحدًا ونفسًا واحدة[a]، ولم يكن أحد منهم يقول إن شيئًا من ممتلكاته خاصّ به[b]، بل كان كل شيء مشتركًا بينهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي إنهم كانوا متحدين اتحادًا عميقًا في باطنهم وقصدهم.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «خاصّ به». وصيغة المفرد في اليونانية توزيعية، أي إنها تشير إلى كل واحد منهم على حدة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθους
  choice: جمهور
  rationale: تفيد الكلمة عددًا كبيرًا أو جماعة غفيرة؛ و«جمهور» عربية واضحة تحفظ دلالة الكثرة من غير مبالغة.
- source_word: τῶν πιστευσάντων
  choice: الذين آمنوا
  rationale: يحفظ التعبير الصيغة الفعلية للمشاركة اليونانية، وهو طبيعي في العربية ولا يلزم إظهار السبق الزمني بأداة مستقلة لأن السياق السردي يوضحه.
- source_word: καρδία καὶ ψυχὴ μία
  choice: قلبًا واحدًا ونفسًا واحدة
  rationale: يحفظ الاسمين وصورة الوحدة الداخلية العميقة في القصد والحياة، من غير اختزالها في شرح تفسيري.
- source_word: οὐδὲ εἷς
  choice: لم يكن أحد منهم
  rationale: صياغة عربية طبيعية تفيد النفي الشامل في هذا السياق، مع إبراز أفراد الجماعة بلفظ «منهم».
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: شيئًا مما يملكه
  rationale: ينقل معنى الأشياء التي تخص كل فرد أو ممتلكاته، بصياغة عربية واضحة.
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: يقول إن ... هو له وحده
  rationale: يحفظ فعل القول ومعنى ἴδιον، أي ما يخص الشخص بوصفه ملكًا خاصًا، من غير تحويل العبارة إلى حكم على أصل الملكية.
- source_word: πάντα κοινά
  choice: كان كل شيء مشتركًا بينهم
  rationale: يحافظ على الجملة الاسمية الخبرية ومعنى الاشتراك، من غير تشديدها إلى امتلاك جماعي نظامي أو إضعافها إلى مجرد الكرم.
theological_decisions:
- issue: وصف الأموال المشتركة في كنيسة أورشليم
  choice: صياغة وصفية تفيد أنهم لم يعدّوا مقتنياتهم خاصة بهم وحدهم، وأن كل شيء كان مشتركًا بينهم.
  alternative: «كانوا يملكون كل شيء معًا» أو صياغة أضعف لا تفيد سوى أنهم كانوا يتصدقون بعضهم على بعض.
  rationale: النص يجمع بين بقاء نسبة الممتلكات إلى الأفراد وبين عدم ادعاء الاختصاص بها وكون كل شيء مشتركًا؛ لذلك تُحفظ هذه الموازنة من غير إسقاط نظام اقتصادي أو كنسي لاحق على الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظت صورة «القلب والنفس» وبنية الوصف الجماعي، مع تجنب المصطلحات السياسية أو الطائفية اللاحقة.
