  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: ar
  text: لِأَنَّنَا لَا نَسْتَطِيعُ أَلَّا نَتَكَلَّمَ عَمَّا رَأَيْنَا وَسَمِعْنَا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بأسلوب أكثر سلاسة: «لأننا لا يسعنا إلا أن نتكلم عمّا رأينا وسمعنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνάμεθα
  choice: لَا نَسْتَطِيعُ
  rationale: ينقل معنى عدم القدرة مباشرة، ويحافظ مع «أَلَّا نَتَكَلَّمَ» على البنية اليونانية التي تفيد العجز عن الامتناع عن الكلام.
- source_word: γὰρ
  choice: لِأَنَّنَا
  rationale: يبيّن أن القول تعليل لما سبقه، وصيغة «لأننا» طبيعية وواضحة في العربية.
- source_word: ἡμεῖς
  choice: نا في «لأننا» و«نستطيع»
  rationale: الضمير اليوناني صريح وفيه شيء من التوكيد؛ ويظهر المرجع بوضوح في ضمير المتكلمين العربي من غير إثقال العبارة بتوكيد زائد.
- source_word: ἃ
  choice: بِمَا
  rationale: تعبير عربي طبيعي يشير إلى مضمون الشهادة، أي الأمور التي عاينوها وسمعوها.
- source_word: εἴδαμεν
  choice: رَأَيْنَا
  rationale: يحفظ قوة شهادة العيان في صيغة ماضية عربية واضحة، من غير فرض دلالة زمنية زائدة.
- source_word: ἠκούσαμεν
  choice: سَمِعْنَا
  rationale: ينقل الفعل الماضي بالتوازي مع «رأينا»، بوصف السماع جزءًا من الشهادة الرسولية.
- source_word: μὴ λαλεῖν
  choice: أَلَّا نَتَكَلَّمَ
  rationale: 'يحافظ على تركيب عدم القدرة مع نفي المصدر: «لا نستطيع ألا نتكلم»، بدل تحويله إلى مجرد قرار أو رغبة.'
- source_word: λαλεῖν
  choice: نَتَكَلَّمَ بِمَا
  rationale: «نتكلم» مقابل مباشر للفعل، والباء مع «ما رأينا وسمعنا» توضّح موضوع الكلام في عربية سليمة.
theological_decisions:
- issue: هل يعبّر النص عن عجز عن الصمت أم عن مجرد رفض التوقف عن الكلام؟
  choice: يصرّح النص بأنهم لا يستطيعون ألا يتكلموا.
  alternative: نحن لن نتوقف عن الكلام، أو لا يسعنا إلا أن نتكلم.
  rationale: البنية اليونانية οὐ δυνάμεθα ... μὴ λαλεῖν تفيد حرفيًا عدم القدرة على الامتناع عن الكلام. أبقت الصياغة هذا التوتر بدل تخفيفه إلى مجرد تصميم إرادي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ تركيب النفي المزدوج المقصود في الأصل، مع وضع البديل الاصطلاحي الأكثر سلاسة في الحاشية.
