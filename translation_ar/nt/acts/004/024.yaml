base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: ar
  text: 'فلما سمعوا، رفعوا صوتهم معًا[b] إلى الله وقالوا: «يا سيّد[a]، أنت الذي صنعت السماء والأرض والبحر وكل ما فيها».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها السيد المطلق السلطان». اللفظة اليونانية لقب يؤكد تمام السلطان، وهي غير κύριος، أي «الرب».
    reason: lexical_alternative
  - marker: b
    text: أو «باتفاق واحد».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: فلما سمعوا
  rationale: ينقل اسم الفاعل الماضي بوظيفته الزمنية في السياق، من غير إضافة مفعول غير مصرَّح به في اليونانية.
- source_word: ὁμοθυμαδόν
  choice: معًا
  rationale: تعبير عربي طبيعي يدل على اتحاد الجماعة في توجيه الصلاة، مع إثبات بديل أوضح لمعنى الاتفاق في الحاشية.
- source_word: ἦραν φωνήν
  choice: رفعوا صوتهم
  rationale: يحافظ على المفرد الجماعي «صوت» في الأصل، ويؤدي معنى الجهر الجماعي بالصلاة بأسلوب عربي سليم.
- source_word: πρὸς τὸν θεόν
  choice: إلى الله
  rationale: يفيد توجيه القول والصلاة إلى الله، وهو المقابل الطبيعي في العربية.
- source_word: Δέσποτα
  choice: يا سيدنا
  rationale: ينقل لقب المخاطبة الدال على السيادة والسلطان، ويميّزه من κύριος الذي يُترجم عادةً «الرب».
- source_word: σὺ ὁ ποιήσας
  choice: أنت الذي صنعت
  rationale: يحفظ توكيد الضمير والبنية التعريفية التي تعرّف الله بأنه صانع الخليقة.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: السماء والأرض والبحر
  rationale: يحافظ على صيغة الخلق الثلاثية وعلى المفرد في كل عنصر.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: كل ما فيها
  rationale: صياغة عربية جامعة وطبيعية تشير إلى جميع ما في السماء والأرض والبحر.
theological_decisions:
- issue: ترجمة Δέσποτα بوصفه لقبًا إلهيًا
  choice: يا سيدنا
  alternative: أيها السيد المطلق السلطان؛ أيها المتسلط؛ يا رب
  rationale: «السيد» أقرب إلى معنى المالك صاحب السلطان المطلق، وتحافظ على الفرق المعجمي بين δεσπότης وκύριος. أما «يا رب» فتطمس هذا الفرق، و«المطلق السلطان» يشرح المعنى أكثر مما يترجم اللفظ.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة موقرة. استُخدم المفرد الجماعي «صوتهم» موافقةً للأصل وإبرازًا لوحدة الصلاة، ووُضعت علامتا الحاشية عند اللفظين اللذين تشرحانهما مباشرةً.
