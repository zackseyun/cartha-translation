lexical_decisions:
- source_word: ποιῆσαι
  choice: لِيَفْعَلُوا
  rationale: مصدر ماضٍ يفيد الغرض أو النتيجة في سياق الجملة السابقة؛ وصيغة الجمع تُظهر أن الفاعلين هم المذكورون في الآية السابقة، مع بقاء يد الله وقصده فاعلَي «عيَّنتا».
- source_word: ὅσα
  choice: كُلَّ مَا
  rationale: تنقل شمول الضمير الموصول المحايد الجمع بصياغة عربية طبيعية واضحة.
- source_word: χείρ
  choice: يَدُكَ
  rationale: تحافظ على الصورة الكتابية المحسوسة؛ فاليد هنا كناية عن القدرة أو الفعل من غير استبدال الصورة بتفسيرها.
- source_word: βουλή
  choice: قَصْدُكَ
  rationale: تنقل معنى التدبير المتعمَّد والنية المقصودة بلغة عربية حديثة، من غير تضييقها إلى مدلول طائفي.
- source_word: προώρισεν
  choice: سَبَقَتْ ... فَعَيَّنَتَاهُ
  rationale: تعبر عن التعيين السابق الذي يدل عليه الفعل اليوناني، مع صياغة عربية سليمة توافق الفاعل المركب «يدك وقصدك».
- source_word: γενέσθαι
  choice: أَنْ يَحْدُثَ
  rationale: تنقل المعنى الحدثي للفعل، أي أن يقع الأمر أو يصير واقعًا، بعبارة عربية طبيعية.
theological_decisions:
- issue: دلالة προώρισεν في سياق سلطان الله ومسؤولية البشر
  choice: سَبَقَتْ يَدُكَ وَقَصْدُكَ فَعَيَّنَتَاهُ
  alternative: قَرَّرَتْهُ يَدُكَ وَقَصْدُكَ مُقَدَّمًا؛ أو سَبَقَ فَحَدَّدَتْهُ يَدُكَ وَقَصْدُكَ
  rationale: يثبت النص تعيين الله السابق لما جرى في آلام يسوع، لكنه لا يشرح هنا كيفية ارتباط ذلك بمسؤولية الفاعلين البشر. لذلك حُفظت قوة الدلالة الزمنية من غير حسم التوتر ضمن منظومة لاهوتية بعينها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. أُبقيت استعارة «اليد»، واستُعمل «القصد» لتجنب غموض «المشورة». جاءت صيغة «ليفعلوا» استنادًا إلى سياق الآية السابقة، بينما أُسند التعيين إلى «يدك وقصدك» بالمثنى المؤنث «فعيَّنتاه».
