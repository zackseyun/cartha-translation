  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: ar
  text: ولكن، لكيلا ينتشر هذا الأمر أكثر بين الشعب، فلنهددهم[a] بألا يتكلموا بعد الآن إلى أحد في هذا الاسم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلنحذرهم تحذيرًا شديدًا». لكن الفعل اليوناني يعني في الأصل «نهددهم»، ويحمل هنا نبرة ترهيب تمارسه السلطة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεμηθῇ
  choice: ينتشر
  rationale: يفيد الفعل هنا شيوع الأمر واتساع تداوله بين الناس، و«ينتشر» تعبير عربي طبيعي يحفظ الصورة دون زيادة تفسيرية.
- source_word: ἐπὶ πλεῖον
  choice: أكثر
  rationale: يحفظ معنى الامتداد إلى مدى أبعد من الوضع الراهن، وهو ملائم مع «ينتشر».
- source_word: λαός
  choice: الشعب
  rationale: يشير في السياق إلى جمهور الشعب، ولا سيما عامة اليهود، و«الشعب» المقابل الطبيعي الواسع.
- source_word: ἀπειλησώμεθα
  choice: فلنهددهم
  rationale: المعنى المعجمي المباشر هو التهديد، والسياق قضائي قسري؛ لذا ينبغي إبراز قوة اللفظ بدل تخفيفها إلى مجرد التحذير.
- source_word: μηκέτι λαλεῖν
  choice: بألا يكلموا ... بعد الآن
  rationale: يحفظ النفي والقوة الزمنية لـ μηκέτι، أي التوقف من هذه اللحظة فصاعدًا.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: بهذا الاسم
  rationale: يحفظ الصياغة المقصودة التي تربط الكلام بهذا الاسم وسلطانه، من غير أن يحسم في المتن كل أبعاد حرف الجر.
- source_word: μηδενὶ ἀνθρώπων
  choice: أحدًا
  rationale: ينقل المعنى العام غير المقيد بنوع الجنس، ويأتي طبيعيًا مفعولًا مع «يكلموا» في العربية.
theological_decisions:
- issue: قوة ἀπειλησώμεθα في رد المجلس
  choice: فلنهددهم
  alternative: فلنحذرهم تحذيرًا شديدًا
  rationale: اللفظ اليوناني يدل مباشرة على التهديد، ويوافق الطابع السلطوي القسري للمشهد. يحفظ هذا الاختيار توتر الرواية ولا يلطّف موقف المجلس.
- issue: دلالة ἐπὶ τῷ ὀνόματι τούτῳ
  choice: بهذا الاسم
  alternative: استنادًا إلى هذا الاسم / في شأن هذا الاسم
  rationale: العبارة قد تشمل الارتباط بالاسم أو الاستناد إلى سلطانه؛ والصياغة المختارة موجزة وتحافظ على سعة الدلالة بدل حصرها في تفسير واحد.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ورصينة. استُخدم «هذا الأمر» لتوفير فاعل مفهوم للفعل المبني للمجهول في اليونانية بحسب السياق، من غير تحديده بأنه الخبر أو التعليم وحده. وُضعت علامة الحاشية [a] عقب «فلنهددهم» مباشرة.
