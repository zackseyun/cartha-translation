  source_fidelity: 'الترجمة تنقل المعنى العام بدقة: «ينتشر» مناسب لـ διανεμηθῇ، و«أكثر» يحفظ ἐπὶ πλεῖον، و«نهددهم» هو المقابل الأقوى والأدق لـ ἀπειλησώμεθα. لكن «يكلموا أحدًا» أضيق من اليونانية λαλεῖν ... μηδενὶ ἀνθρώπων، التي تتعلق بالكلام إلى أي إنسان لا بالمخاطبة الشخصية فقط، كما أن «في هذا الاسم» أقرب إلى ἐπὶ τῷ ὀνόματι τούτῳ من «بهذا الاسم» في هذا التركيب.'
