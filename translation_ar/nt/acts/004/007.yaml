  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: ar
  text: 'فأوقفوهما في الوسط، وأخذوا يسألون[a]: «بأية قوة أو بأي اسم فعلتما أنتما هذا؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكانوا يسألون» أو «استفسروا». قد تدل صيغة الماضي الناقص في اليونانية على استمرار السؤال، لا على بدايته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες αὐτοὺς
  choice: فأوقفوهما
  rationale: اسم الفاعل الأوريستي يصف فعلًا سبق السؤال، والفاء توضح التعاقب في عربية طبيعية. واستُعمل ضمير التثنية لأن المقصود بطرس ويوحنا.
- source_word: ἐν τῷ μέσῳ
  choice: في الوسط
  rationale: يحافظ على المعنى المكاني المباشر من غير إضافة تفسيرية مثل «أمام المجلس».
- source_word: ἐπυνθάνοντο
  choice: أخذوا يسألون
  rationale: ينقل صيغة الماضي الناقص بوصفها فعلًا مستمرًا أو ابتدائيًا في هذا السياق السردي، مع إثبات البدائل الممكنة في الحاشية.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: بأية قوة
  rationale: الباء تؤدي المعنى الأداتي لـἐν في العربية، و«قوة» هي المقابل المباشر لـδύναμις من غير تحويلها إلى «سلطان» أو «صلاحية».
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: أو بأي اسم
  rationale: يحفظ التعبير الكتابي الدال على العمل باسم شخص، بما يتضمنه من تمثيل واستناد إليه.
- source_word: ἐποιήσατε τοῦτο ὑμεῖς
  choice: فعلتما أنتما هذا
  rationale: ينقل الأوريست بفعل ماضٍ بسيط، ويُظهر الضمير المنفصل توكيد ὑμεῖς. وجاء الفعل والضمير بصيغة التثنية وفق هوية المخاطَبَين في العربية.
theological_decisions:
- issue: هل تُترجم δύναμις بمعنى «قوة» أم تُفسَّر بمعنى «سلطان»؟
  choice: قوة
  alternative: سلطان
  rationale: اللفظ اليوناني هو δύναμις ومعناه المباشر «قوة»، في حين أن العبارة الموازية «بأي اسم» تحمل بالفعل معنى التمثيل والسلطان. إبقاء «قوة» يحفظ التمييز والتوتر في صياغة السؤال.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حوفظ على الإيجاز القضائي في السؤال وعلى التعبير «بأي اسم»، واستُعملت صيغة التثنية الطبيعية في العربية للإشارة إلى بطرس ويوحنا.
