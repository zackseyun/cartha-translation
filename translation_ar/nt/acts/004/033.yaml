  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: ar
  text: وكان الرسل يؤدّون بقوة عظيمة شهادتهم عن قيامة الرب يسوع، وكانت نعمة[a] عظيمة على الجميع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكانت حظوة عظيمة على الجميع». يمكن للكلمة اليونانية المترجمة «نعمة» أن تعني أيضًا «حظوة»، وقد تشمل هنا نعمة الله عليهم ونظرة الناس الحسنة إليهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: بقوة عظيمة
  rationale: تحافظ على معنى اسم الأداة أو الكيفية، وتلائم استعمال δύναμις في لوقا وأعمال الرسل من غير حصره في المعجزات.
- source_word: ἀπεδίδουν
  choice: كانوا يؤدّون
  rationale: صيغة الماضي الناقص تدل على فعل مستمر أو متكرر، و«يؤدّون شهادة» تعكس معنى ἀποδίδωμι مع μαρτύριον بصورة عربية فصيحة.
- source_word: τὸ μαρτύριον
  choice: شهادتهم
  rationale: الإضافة إلى ضمير الرسل تجعل العبارة طبيعية بالعربية، والضمير مفهوم من كون الرسل فاعل الشهادة.
- source_word: τῆς ἀναστάσεως
  choice: عن قيامة
  rationale: المضاف إليه يبيّن مضمون الشهادة؛ و«عن» تؤدي هذا المعنى بوضوح في العربية المعاصرة.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: الرب يسوع
  rationale: تحافظ على لقب κύριος وعلى ارتباط القيامة بيسوع مباشرة.
- source_word: χάρις μεγάλη
  choice: نعمة عظيمة
  rationale: «نعمة» هي المقابل العربي الواسع لـχάρις، ويمكن أن تشمل نعمة الله وما ينتج عنها من حظوة، مع إيضاح البديل في الحاشية.
- source_word: ἐπὶ πάντας αὐτούς
  choice: على جميعهم
  rationale: تحافظ على صورة شيء كائن على الجماعة كلها وعلى شمول العبارة.
theological_decisions:
- issue: دلالة χάρις ومصدرها
  choice: نعمة عظيمة على جميعهم
  alternative: حظوة عظيمة لدى الناس، أو عناية إلهية مخصوصة
  rationale: النص اليوناني لا يصرّح بمصدر χάρις، وقد يحتمل نعمة الله والحظوة التي حظي بها المؤمنون؛ لذلك لا تُحصر الدلالة في أحدهما.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «كانوا يؤدّون» لإظهار الاستمرار في الفعل، وحُفظ غموض χάρις في المتن والحاشية دون تعيين مصدرها.
