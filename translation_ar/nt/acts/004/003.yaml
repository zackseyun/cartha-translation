  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: ar
  text: فألقوا القبض عليهما، ووضعوهما قيد الحراسة[a] إلى اليوم التالي، لأن المساء كان قد حلّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «احتجزوهما» أو «وضعوهما في الحبس». يدل الأصل اليوناني على إبقائهما تحت الحراسة، من غير أن يحدد نوع المكان.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον αὐτοῖς τὰς χεῖρας
  choice: ألقوا القبض عليهما
  rationale: هذا تعبير يوناني حرفي معناه «وضعوا الأيدي عليهما»، لكنه في هذا السياق العدائي والقانوني يفيد الإمساك بهما واعتقالهما. والصياغة العربية المختارة طبيعية وواضحة وتحفظ دلالة التوقيف.
- source_word: αὐτοῖς
  choice: عليهما
  rationale: الضمير في صيغة الجمع باليونانية يعود في السياق إلى بطرس ويوحنا، وتقتضي العربية استعمال المثنى.
- source_word: ἔθεντο εἰς τήρησιν
  choice: وضعوهما قيد الحراسة
  rationale: تفيد τήρησις الحفظ أو الحراسة أو الاحتجاز، من غير تحديد أن المكان سجن؛ لذلك تتجنب الصياغة الإفراط في التحديد.
- source_word: εἰς τὴν αὔριον
  choice: إلى اليوم التالي
  rationale: تعبير زمني يفيد استمرار الاحتجاز حتى اليوم التالي، وهو أنسب للسرد من «إلى الغد».
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: لأن المساء كان قد حلّ
  rationale: تنقل العبارة سبب تأجيل الإجراء إلى اليوم التالي، وتحافظ على الإشارة الصريحة إلى المساء بدل تفسيرها بمعنى «كان الوقت متأخرًا».
