id: ACT.4.13
reference: Acts 4:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: ar
  text: ولمّا لاحظوا جرأة بطرس ويوحنا، وأدركوا أنهما رجلان غير متعلِّمَين ومن عامّة الناس[a]، تعجّبوا، وعرفوا أنهما كانا مع يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غير ذوي تعليم رسمي وعامِّيَّين». يصف اللفظان اليونانيان رجلين لم يتلقيا تدريبًا علميًّا رسميًّا ولم تكن لهما صفة مهنية أو رسمية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωροῦντες
  choice: لمّا لاحظوا
  rationale: يفيد الفعل ملاحظة متأنية تقود إلى رد الفعل المذكور، و«لاحظوا» أوضح من مجرد «رأوا» في هذا السياق.
- source_word: παρρησίαν
  choice: جرأة
  rationale: يدل اللفظ في سفر الأعمال على الشجاعة والصراحة في الكلام، و«جرأة» تؤدي المعنيين بعبارة عربية طبيعية.
- source_word: καταλαβόμενοι
  choice: وأدركوا
  rationale: يفيد وصولهم إلى فهم حال بطرس ويوحنا، و«أدركوا» تنقل هذا التحول الإدراكي بوضوح.
- source_word: ἀγράμματοί
  choice: غير متعلِّمَين
  rationale: المقصود عدم تلقي التعليم الرسمي الكتابي أو الرباني، لا العجز عن القراءة والكتابة بالضرورة.
- source_word: ἰδιῶται
  choice: من عامّة الناس
  rationale: يشير هنا إلى أنهما ليسا من أهل الاختصاص أو ذوي المنصب الرسمي؛ وهذه العبارة تتجنب الإيحاء بالغباء أو الازدراء.
- source_word: ἐθαύμαζον
  choice: تعجّبوا
  rationale: ينقل رد فعلهم المستمر من الدهشة، وهو تعبير عربي واضح ورصين.
- source_word: ἐπεγίνωσκόν
  choice: وعرفوا
  rationale: يمكن أن يدل الفعل على التعرّف أو التحقق؛ و«عرفوا» تبقي العبارة موجزة ولا تحسم أكثر مما يسمح به السياق.
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: أنهما كانا مع يسوع
  rationale: يحيل السياق إلى صحبتهما السابقة ليسوع، وصيغة «كانا» تنقل ذلك طبيعيًا.
theological_decisions:
- issue: الوصف الاجتماعي والتعليمي لبطرس ويوحنا
  choice: غير متعلِّمَين ومن عامّة الناس
  alternative: أُمِّيَّين وعامِّيَّين
  rationale: لا يصفهما النص بأنهما عديمَا الذكاء أو أميّان بالمعنى الحديث الحتمي، بل بأنهما يفتقران إلى التدريب العلمي الرسمي والمكانة المهنية أو الدينية؛ لذلك تحافظ الصياغة المختارة على المقابلة من غير انتقاص مضلل.
- issue: معنى تعرّف القادة إلى صلة التلميذين بيسوع
  choice: وعرفوا أنهما كانا مع يسوع
  alternative: وتعرّفوا إليهما، وعرفوا أنهما كانا مع يسوع
  rationale: يحتمل الفعل معنى التعرف إلى الشخصين أو التحقق من أمرهما. أبقت الصياغة العربية هذا القدر من الانفتاح، من غير أن تجزم بأن المقصود مجرد تذكر ملامحهما.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة ورصينة. استُعمل المثنى في وصف بطرس ويوحنا، وتُجنبت ألفاظ قد توحي بالأمية المطلقة أو الجهل العقلي. وُضع رابط «ولمّا» لنقل العلاقة الظرفية بين الملاحظة ورد الفعل، من غير إدخال ظرف زمني مستقل لا يقابله لفظ صريح في الأصل.
