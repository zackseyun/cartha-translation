source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: ar
  text: 'قائلين: «ماذا نفعل بهذين الرجلين؟ فقد حدثت على أيديهما آية معروفة[a]، وهي ظاهرة لجميع سكان أورشليم، ولا نقدر أن ننكرها».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «آية مشهورة». يمكن أن تعني الكلمة اليونانية γνωστόν «معروفة» أو «مشهورة»، وهي هنا تشير إلى آية عرفها الناس علنًا.
    reason: بديل معجمي يحفظ مدى دلالة γνωστόν في السياق.
lexical_decisions:
- source_word: λέγοντες
  choice: قائلين
  rationale: يحفظ صيغة اسم الفاعل واتصال الكلام بالسياق السابق، وهو تعبير عربي فصيح طبيعي في السرد.
- source_word: Τί ποιήσωμεν
  choice: ماذا نفعل
  rationale: ينقل سؤال المداولة الذي تفيده صيغة الاحتمال اليونانية بعبارة عربية مباشرة وطبيعية.
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: بهذين الرجلين
  rationale: الباء تؤدي معنى «نفعل بهما»، والمقصود في السياق رجلان بعينهما، بطرس ويوحنا.
- source_word: ὅτι μὲν γὰρ
  choice: فقد
  rationale: تؤدي الفاء معنى التعليل، وتفيد «قد» توكيد وقوع الحدث ونتيجته القائمة، من غير إثقال العبارة بأدوات متتابعة.
- source_word: γνωστὸν σημεῖον
  choice: آية معروفة
  rationale: يحفظ «آية» الدلالة الإشارية اللاهوتية لـσημεῖον، وتنقل «معروفة» معنى γνωστόν مع إبقاء احتمال الشهرة العامة موضحًا في الحاشية.
- source_word: γέγονεν
  choice: جرت
  rationale: تعبير عربي مألوف عن وقوع الآية، ويلائم الحدث المكتمل الذي بقي أثره حاضرًا.
- source_word: δι’ αὐτῶν
  choice: على أيديهما
  rationale: ينقل معنى الوساطة أو الأداة بصورة عربية طبيعية، من غير أن ينسب إليهما استقلالًا في إحداث الآية.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: وهذا ظاهر لجميع سكان أورشليم
  rationale: يجعل الإسناد الاسمي المفهوم في اليونانية صريحًا وواضحًا في العربية، مع الحفاظ على شمول سكان المدينة.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: ولا نقدر أن ننكرها
  rationale: صياغة عربية واضحة تحافظ على معنى عدم القدرة على الإنكار، والضمير يعود إلى الآية المذكورة.
theological_decisions:
- issue: دلالة σημεῖον في سياق الشفاء العلني
  choice: آية
  alternative: معجزة
  rationale: «آية» تحفظ معنى العلامة التي تشير إلى ما وراء الحدث نفسه، ولا تختزل اللفظ في مجرد العمل الخارق، مع بقاء الطابع المعجزي مفهومًا من السياق.
- issue: الفاعل أو الوسيط في δι’ αὐτῶν
  choice: على أيديهما
  alternative: بواسطتهما
  rationale: تحفظ العبارة معنى الوساطة من غير حسم مصدر القوة أو إسناد الفعل إليهما على نحو مستقل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «جرت على أيديهما» لسلامتها وطبيعتها في وصف وقوع الآية بواسطة شخصين، وأُعيد الضمير في «وهذا ظاهر» إلى وقوع الآية لتوضيح تركيب الجملة اليونانية من غير تغيير معناها.
