    text: 'أو: «مِن سُلالةِ رُؤَسَاءِ الكهنة»، أو: «مِن نَسَبِ رُؤَسَاءِ الكهنة».'
    reason: تحمل γένος معنى الأسرة أو السلالة أو النسب، وتدل ἀρχιερατικοῦ على الصلة برؤساء الكهنة؛ وتحفظ البدائل هذا المجال الدلالي من دون تقييده بأسرة رئيس كهنة معيّن.
lexical_decisions:
- source_word: Ἅννας
  choice: حَنَّان
  rationale: الصيغة العربية الكتابية المألوفة للاسم، وهي واضحة ومستقرة في الاستعمال.
- source_word: ὁ ἀρχιερεὺς
  choice: رَئِيسُ الْكَهَنَةِ
  rationale: ينقل اللقب المفرد كما ورد في اليونانية من غير تعديل تاريخي أو تفسيره بمعنى «السابق».
- source_word: Καϊάφας
  choice: قَيَافَا
  rationale: الصيغة العربية التقليدية المعروفة للاسم.
- source_word: Ἰωάννης
  choice: يُوحَنَّا
  rationale: الصيغة العربية الكتابية المألوفة للاسم اليوناني Ἰωάννης.
- source_word: Ἀλέξανδρος
  choice: الإِسْكَنْدَر
  rationale: الصيغة العربية الشائعة للاسم، مع أداة التعريف المستقرة في تعريبه.
- source_word: ὅσοι ἦσαν
  choice: جَمِيعُ الَّذِينَ كَانُوا
  rationale: تعبير عربي طبيعي يحفظ معنى الشمول في ὅσοι وزمن الفعل الماضي.
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: مِنْ أُسْرَةِ رَئِيسِ الْكَهَنَةِ
  rationale: ينقل γένος بمعنى الأسرة أو السلالة، ويعبّر بوضوح عن صلتها برئاسة الكهنة، مع إبقاء البدائل النسبية في الحاشية.
theological_decisions:
- issue: وصف حنان بأنه رئيس الكهنة مع أن قيافا كان يتولى المنصب آنذاك بحسب الإطار التاريخي
  choice: الإبقاء على «حَنَّانُ رَئِيسُ الْكَهَنَةِ» كما يصرّح النص
  alternative: «حنان، رئيس الكهنة السابق» أو «حنان، أحد كبار الكهنة»
  rationale: اليونانية تسند إلى حنان مباشرة اللقب ὁ ἀρχιερεύς؛ وإضافة «السابق» أو استبدال اللقب بتعبير آخر يحسم توترًا تاريخيًا لا يحسمه النص نفسه.
translation_notes:
  register: صياغة فصحى حديثة ذات نبرة كتابية رصينة. أُبقيت بنية التعداد من غير إدخال فعل غير موجود في هذه العبارة اليونانية، لأنها متصلة نحويًا بما قبلها. وُضعت علامة الحاشية عند العبارة التي تتناولها فعليًا، أي «أُسْرَةِ رَئِيسِ الْكَهَنَةِ».
