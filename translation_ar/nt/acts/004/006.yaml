  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: ar
  text: وَحَنَّانُ رَئِيسُ الْكَهَنَةِ، وَقَيَافَا وَيُوحَنَّا وَالإِسْكَنْدَرُ، وَجَمِيعُ الَّذِينَ كَانُوا مِنْ أُسْرَةِ رُؤَسَاءِ الْكَهَنَةِ[a].
  philosophy: optimal-equivalence
  footnotes:
