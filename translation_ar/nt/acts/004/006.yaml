    rationale: التعبير اليوناني غير معرّف ولا يحدد رئيس كهنة بعينه؛ وهو يدل على أسرة أو سلالة ذات صلة برؤساء الكهنة. صيغة المفرد المعرفة في العربية قد تُحيل إلى حنان أو إلى شخص محدد في السياق.
  - severity: low
