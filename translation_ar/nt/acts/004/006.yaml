  to: وَحَنَّانُ رَئِيسُ الْكَهَنَةِ، وَقَيَافَا وَيُوحَنَّا وَالإِسْكَنْدَرُ، وَجَمِيعُ الَّذِينَ كَانُوا مِنْ أُسْرَةِ رُؤَسَاءِ الْكَهَنَةِ[a].
