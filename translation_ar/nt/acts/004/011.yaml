id: ACT.4.11
reference: Acts 4:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: ar
  text: هذا هو الحجر الذي رفضتموه أنتم البنّاؤون، وقد صار حجر الزاوية.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حجر القمة»؛ وحرفيًا: «رأس الزاوية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: هذا
  rationale: اسم الإشارة يعود توكيدًا على يسوع في السياق المباشر، و«هذا» صياغة عربية طبيعية تحافظ على التعيين المباشر.
- source_word: λίθος
  choice: الحجر
  rationale: المعنى المعتاد للكلمة، وهو يحافظ على صورة الاقتباس من المزمور 118 دون توسيعها إلى معنى «الصخر».
- source_word: ἐξουθενηθεὶς
  choice: رفضتموه
  rationale: يدل الفعل على الاحتقار أو المعاملة كعديم القيمة؛ وفي استعارة البناء يعبّر «رفضتموه» بوضوح عن النتيجة العملية مع إبقاء نبرة الاتهام.
- source_word: ὑφ’ ὑμῶν
  choice: أنتم
  rationale: يحافظ الضمير المنفصل على توكيد المخاطَبين وصيغة الجمع في الاتهام المباشر، بينما يتضمن الفعل نفسه معنى «من قِبلكم».
- source_word: οἰκοδόμων
  choice: البنّاؤون
  rationale: يحافظ على استعارة البناء وعلى مخاطبة القادة بوصفهم البنّائين في الاقتباس الكتابي.
- source_word: γενόμενος
  choice: وقد صار
  rationale: ينقل التحول الذي وقع وصارت له نتيجة قائمة، وتربط الواو الجملة بما قبلها ربطًا عربيًا طبيعيًا.
- source_word: κεφαλὴν γωνίας
  choice: حجر الزاوية
  rationale: تعبير عربي واضح وشائع يحفظ الصورة المعمارية ومغزى تكريم الحجر المرفوض، دون الجزم بتحديد موضعه المعماري الدقيق.
theological_decisions:
- issue: تصوير الاقتباس من المزمور 118:22
  choice: حجر الزاوية
  alternative: رأس الزاوية، أو حجر القمة
  rationale: يعرّف النص يسوع بأنه الحجر الذي رفضه البنّاؤون ثم نال موضع التكريم الحاسم. «حجر الزاوية» يحافظ على الصورة التقليدية الواضحة من غير إضافة دعوى عقائدية، وتُذكر البدائل في الحاشية لأن المرجع المعماري الدقيق محل نقاش.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. قُدّم المفعول «الحجر» ثم استُخدمت صلة موصول طبيعية، وحُفظ توكيد «أنتم» ونبرة المواجهة وصورة البناء.
