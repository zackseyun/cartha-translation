  text: οὐδὲ γὰρ ἐνδεής τις ⸀ἦν ἐν αὐτοῖς· ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: ar
  text: فلم يكن فيهم محتاجٌ واحد، إذ إن كلَّ الذين كانوا يملكون أراضي أو بيوتًا كانوا يبيعونها ويأتون بحصيلة ما كانوا يبيعونه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بأثمان ما كان يُباع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ ἐνδεής τις ἦν ἐν αὐτοῖς
  choice: فلم يكن بينهم محتاجٌ واحد
  rationale: تنقل الفاء قوة γάρ التفسيرية في سياق الكلام السابق، ويؤدي «محتاج واحد» توكيد οὐδέ مع الحفاظ على المعنى الوجودي الطبيعي في العربية. و«محتاج» لا يحصر العوز في الفقر المالي وحده.
- source_word: ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον
  choice: لأن كلَّ الذين كانوا يملكون حقولًا أو بيوتًا
  rationale: «لأن» توضح قوة γάρ التعليلية، و«كل الذين» تحفظ شمول ὅσοι داخل الفئة المذكورة. واختير «يملكون» بدل صياغة اسمية ثقيلة، مع ترجمة χωρίων بحسب السياق إلى «حقول».
- source_word: πωλοῦντες ἔφερον
  choice: كانوا يبيعونها ويأتون
  rationale: صيغة «كانوا ... ويأتون» تعبّر عن الفعل المتكرر أو الجاري الذي يدل عليه الماضي الناقص ἔφερον، وتدمج اسم الفاعل πωλοῦντες في عربية سلسة من غير فرض تعاقب زمني صريح.
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: بحصيلة ما كان يُباع منها
  rationale: «حصيلة» تؤدي في العربية الطبيعية معنى الأموال الناتجة من البيع، بينما «ما كان يُباع» يحفظ عدم تعيين الأشياء في اسم المفعول اليوناني، و«منها» يربطه بالحقول والبيوت المذكورة.
