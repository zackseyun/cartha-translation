  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: ar
  text: لأن الرجل الذي حدثت له آية الشفاء هذه كان عمره أكثر من أربعين سنة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «علامة الشفاء هذه»؛ ويمكن أن تُترجم أيضًا: «هذه المعجزة التي تمّ بها الشفاء».'
    reason: بديل معجمي يوضح مجال معنى σημεῖον وإمكان فهم تركيب «آية الشفاء».
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: كان قد تجاوز الأربعين من عمره
  rationale: هذا تركيب يوناني اصطلاحي لبيان السن، وصياغة «تجاوز الأربعين من عمره» تنقله إلى عربية واضحة وطبيعية.
- source_word: γὰρ
  choice: لأن
  rationale: تربط الأداة الآية بما قبلها بوصفها تعليلًا يوضح سبب قوة الآية التي حدثت.
- source_word: ὁ ἄνθρωπος
  choice: الرجل
  rationale: المقصود شخص ذكر بعينه سبق ذكره في السياق، لذلك «الرجل» أدق من اللفظ العام «الإنسان».
- source_word: ἐφ’ ὃν
  choice: الذي جرت له
  rationale: يدل التركيب على الشخص الذي وقعت له الآية؛ وهذه الصياغة عربية طبيعية وتحافظ على كونه المتلقي للحدث.
- source_word: γεγόνει
  choice: جرت
  rationale: ينصب الفعل اليوناني التركيز على وقوع الحدث دون التصريح بفاعل مباشر. ويُفهم سبق الحدث زمنيًا من السياق، مع دعم ذلك بصيغة «كان قد تجاوز» في الجملة الرئيسة.
- source_word: τὸ σημεῖον τοῦτο
  choice: آية ... هذه
  rationale: تحافظ «آية» على معنى الحدث الدالّ والمؤيد، ولا تختزله في كونه أمرًا عجيبًا فحسب.
- source_word: τῆς ἰάσεως
  choice: الشفاء
  rationale: تنقل «الشفاء» معنى ἴασις بوضوح ودقة في هذا السياق.
theological_decisions:
- issue: دلالة σημεῖον في سياق المعجزة
  choice: آية
  alternative: معجزة
  rationale: لفظ «آية» يحفظ البعد الدلالي والإثباتي للكلمة اليونانية، بينما «معجزة» تبرز الحدث الخارق لكنها أقل محافظة على هذا البعد.
- issue: الفاعل أو الوساطة في γεγόνει
  choice: جرت له
  alternative: أُجريت له
  rationale: النص اليوناني يركز على حدوث الآية ولا يصرح هنا بفاعلها، لذلك تتجنب الصياغة المختارة إضافة فاعل أو وساطة لا يذكرهما هذا العدد صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «جرت له» لصياغة الحدث بصورة طبيعية من غير فرض فاعل صريح، و«تجاوز الأربعين من عمره» للتعبير الاصطلاحي السلس عن السن.
