  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: ar
  text: قام ملوكُ الأرض، واجتمع الحكّام معًا ضد الرب وضد مسيحه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «ممسوحه». واللفظة اليونانية «خريستوس» تعني «الممسوح».'
    reason: توضيح المعنى اللغوي للقب χριστός في اقتباس مزمور 2.
lexical_decisions:
- source_word: παρέστησαν
  choice: اصطفَّ
  rationale: يفيد الفعل هنا اتخاذ موقف مقصود للمعارضة، في صدى لمزمور 2:2، لا مجرد الوقوف الجسدي.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: ملوكُ الأرض
  rationale: يحفظ اللقب السياسي المحدد والنطاق العالمي لعبارة الاقتباس.
- source_word: οἱ ἄρχοντες
  choice: الحكّام
  rationale: مقابل عربي طبيعي واضح، ويحافظ على الموازاة مع «الملوك».
- source_word: συνήχθησαν ἐπὶ τὸ αὐτό
  choice: اجتمع ... معًا
  rationale: يحفظ دلالة الاجتماع المنسق، كما يحافظ الفعل المبني للمعلوم في العربية على المعنى الطبيعي للمبني للمجهول اليوناني دون إيحاء بفاعل غير مذكور.
- source_word: κατὰ
  choice: على
  rationale: «على» مع فعل الاجتماع تعبير عربي فصيح عن التآمر والعداء، ويتكرر للمحافظة على التوازي.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: الترجمة الكتابية المستقرة لـ κύριος هنا، وهو يشير في الاقتباس إلى الله.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: مسيحه
  rationale: «المسيح» في العربية يحمل معنى الممسوح واللقب المسياني، والضمير يحفظ صلته بالرب.
theological_decisions:
- issue: دلالة χριστός في اقتباس مزمور 2
  choice: مسيحه
  alternative: ممسوحه
  rationale: يحفظ «مسيحه» اللقب المسياني المألوف وصلة المضاف إليه بالرب، بينما تُذكر «ممسوحه» في الحاشية لإظهار المعنى الاشتقاقي والسياق الأصلي دون حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع الحفاظ على التوازي الشعري وصدى مزمور 2. وُضعت علامة الحاشية في المتن بعد «مسيحه».
