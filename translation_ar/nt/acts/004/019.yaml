  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: ar
  text: 'أما بطرس ويوحنا فأجابا وقالا لهم: «إن كان من الصواب أمام الله أن نصغي إليكم أكثر مما نصغي إلى الله[a]، فاحكموا أنتم.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة تفسيرية أكثر: «أن نطيعكم أكثر مما نطيع الله». فالفعل اليوناني يعني حرفيًا «نسمع» أو «نصغي»، لكنه يحمل هنا معنى الاستجابة للسلطة والامتثال لها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: أما بطرس ويوحنا
  rationale: تنقل «أما» التحول التقابلي الخفيف الذي تؤديه δέ، بصياغة عربية فصيحة وطبيعية.
- source_word: ἀποκριθέντες ... εἶπον
  choice: فأجابا وقالا
  rationale: يحفظ التعبير اليوناني المركب، المتأثر بالأسلوب السامي، من غير أن يكون ثقيلا في العربية.
- source_word: δίκαιόν
  choice: من الصواب
  rationale: تعبر عن كون الفعل صحيحا ومقبولا أخلاقيا أمام حكم الله، وهي طبيعية في سؤال مباشر.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: أمام الله
  rationale: تحفظ صورة الوقوف أمام نظر الله وحكمه، من غير توسع تفسيري.
- source_word: ἀκούειν
  choice: أن نسمع لـ
  rationale: يحفظ المعنى الحرفي الأساسي للفعل، أي السماع والإصغاء، مع إتاحة معنى الامتثال للسلطة في السياق.
- source_word: μᾶλλον ἢ
  choice: أكثر مما
  rationale: يحفظ الصيغة المقارنة في الأصل بدلا من تحويلها إلى تعبير يفصل بين الطرفين فصلا مطلقا.
- source_word: κρίνατε
  choice: احكموا أنتم
  rationale: ينقل فعل الأمر والتحدي الموجه إلى المخاطبين بأن يجروا هم التقييم.
- source_word: πρὸς αὐτούς
  choice: لهم
  rationale: ترجمة ضميرية مباشرة، ومرجع الضمير واضح من السياق.
theological_decisions:
- issue: هل يترجم ἀκούειν تفسيريا بمعنى الطاعة في المفاضلة بين أوامر السلطات البشرية وأمر الله؟
  choice: 'إبقاء صورة السماع في النص: «نسمع لكم ... نسمع لله»'
  alternative: «نطيعكم ... نطيع الله»
  rationale: السياق يتضمن معنى الامتثال، لكن الأصل يستعمل فعل السماع لا فعلا صريحا للطاعة؛ لذلك تحفظ الصياغة صورة الأصل وتوضح الحاشية الدلالة السياقية من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استعملت صيغة المثنى في «أجابا وقالا»، وأبقيت المقارنة وصورة السماع الواردتين في اليونانية. وُضعت علامة الحاشية بعد تمام الاقتباس لأنها تتناول العبارة المحورية كلها.
