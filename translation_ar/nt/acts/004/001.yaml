  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: ar
  text: وبينما كانا يكلِّمان الشعب، أقبل عليهما[a] الكهنةُ وقائدُ الهيكل[b] والصدوقيون،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اقتربوا منهما» أو «داهموهما». قد يدل الفعل اليوناني على الوصول المفاجئ أو الاقتراب، ويشير السياق إلى مقاطعة رسمية.'
    reason: lexical_alternative
  - marker: b
    text: كان «قائد الهيكل» المسؤول عن حفظ النظام والأمن في ساحات الهيكل.
    reason: cultural_note
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: وبينما كانا يكلِّمان
  rationale: صيغت العبارة المطلقة بالمضاف إليه في اليونانية جملةً زمنية طبيعية بالعربية. ويعود ضمير التثنية بحسب السياق إلى بطرس ويوحنا، أما δέ فنُقل بواو الاستئناف دون إضافة «الآن».
- source_word: πρὸς τὸν λαὸν
  choice: الشعب
  rationale: «الشعب» هو المقابل المباشر والطبيعي لـ λαός، ويحافظ على اللفظ من دون تفسيره بالحشد.
- source_word: ἐπέστησαν αὐτοῖς
  choice: أقبل عليهما
  rationale: ينقل معنى الوصول أو الاقتراب، مع إمكان الإيحاء بالمباغتة، من غير أن يضيف معنى المواجهة العدائية صراحةً.
- source_word: οἱ ἱερεῖς
  choice: الكهنة
  rationale: النص يقول «الكهنة» لا «رؤساء الكهنة»، فلا تُضاف رتبة غير مذكورة.
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: قائد الهيكل
  rationale: تعبير موجز يحافظ على صفة المسؤول القيادي المرتبط بالهيكل، وتوضح الحاشية طبيعة منصبه.
- source_word: οἱ Σαδδουκαῖοι
  choice: الصدوقيون
  rationale: هو الاسم العربي المعياري لهذه الجماعة اليهودية.
theological_decisions:
- issue: هل يحمل وصول المسؤولين معنى المواجهة العدائية صراحةً؟
  choice: أقبل عليهما
  alternative: واجهوهما
  rationale: السياق اللاحق يدل على المعارضة، لكن الفعل نفسه يمكن أن يعني الوصول أو الاقتراب؛ لذلك حُفظ التوتر السردي من غير تحميل الفعل عداءً صريحًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة التثنية لأن المرجع السياقي هو بطرس ويوحنا، وحُفظ ترتيب الأطراف المذكورين في الأصل. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحهما كل حاشية، تصحيحًا لما يبدو تبادلًا في موضعي العلامتين في طبقة الاستشارة الإنجليزية.
