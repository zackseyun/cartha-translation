  yaml_path: translation/nt/acts/004/002.yaml
  text: being greatly disturbed because they were teaching the people and proclaiming in Jesus the resurrection from the dead,[a]
translation:
  language: ar
  text: وكانوا مستائين جدًا لأنهما كانا يعلِّمان الشعب ويعلنان في يسوع القيامة من بين الأموات.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويعلنان، في ما يتعلق بيسوع، القيامة من بين الأموات». فقد تشير العبارة اليونانية «في يسوع» بوجه خاص إلى القيامة كما ظهرت في قيامته هو.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: منزعجين أشدَّ الانزعاج
  rationale: يدل اسم الفاعل على ضيق شديد واستياء قوي لدى السلطات. تنقل الصياغة شدة المعنى من غير أن تحصره في الغضب أو تستخدم تعبيرًا عاميًا.
- source_word: διὰ τὸ διδάσκειν
  choice: لأنهما كانا يعلِّمان
  rationale: تفيد διά مع المصدر المعرَّف السبب؛ وتحويلها إلى جملة سببية هو الأسلوب العربي الطبيعي. واستُعمل ضمير المثنى لأن المرجع المباشر هو بطرس ويوحنا.
- source_word: αὐτοὺς
  choice: هما
  rationale: يعود الضمير اليوناني إلى المتكلمين المذكورين سابقًا، أي بطرس ويوحنا. يوضح ضمير المثنى المرجع الذي تقتضيه العربية من غير إدخال لقب غير وارد هنا.
- source_word: τὸν λαὸν
  choice: الشعب
  rationale: تشير الكلمة إلى الشعب بوصفه جماعة، لا إلى حشد عابر فحسب؛ و«الشعب» مقابل عربي واضح ومألوف.
- source_word: καταγγέλλειν
  choice: يعلنان
  rationale: يفيد الفعل الإعلان العلني عن مضمون، و«يعلنان» واضحة وطبيعية وتحافظ على تمييزه من فعل التعليم السابق.
- source_word: ἐν τῷ Ἰησοῦ
  choice: في يسوع
  rationale: 'تنقل العبارة اليونانية مباشرة وتحفظ انفتاحها الدلالي: فقد تشير إلى القيامة المتجلية في يسوع أو المثبتة بقيامته، من غير حسمها إلى معنى السببية أو الوساطة.'
- source_word: ἀνάστασιν
  choice: القيامة
  rationale: تحافظ «القيامة» على دلالة الاسم المعرَّف وعلى ثقله في سياق الكرازة الرسولية.
- source_word: τὴν ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: تبين العبارة أن القيامة خروج من وسط الموتى. و«من بين الأموات» تنقل هذا المعنى بوضوح وبأسلوب عربي مألوف.
theological_decisions:
- issue: دلالة ἐν τῷ Ἰησοῦ وصلتها بإعلان القيامة
  choice: الإبقاء على الصياغة الشفافة «في يسوع» بحيث تكون القيامة المعلنة متجلية فيه أو متمحورة حوله.
  alternative: «في حالة يسوع» للإشارة بوجه أخص إلى قيامته هو، أو «بيسوع/بواسطة يسوع» للدلالة على الوساطة.
  rationale: يحتمل حرف الجر اليوناني ظلالًا متقاربة، ولا يقتضي السياق حصره في واحد منها. لذلك يحفظ المتن التوتر الدلالي، وتعرض الحاشية القراءة التوضيحية الأقرب إلى قيامته هو.
- issue: نطاق عبارة «القيامة من بين الأموات»
  choice: صياغة تسمح بأن تشمل الإشارة المباشرة إلى قيامة يسوع والرجاء الأوسع بقيامة الموتى المعلن والمثبت فيه.
  alternative: حصر العبارة في قيامة يسوع وحده، أو جعلها إشارة حصرية إلى القيامة العامة في المستقبل.
  rationale: تسمح صياغة لوقا بتداخل قيامة يسوع مع إعلان حقيقة القيامة الأوسع؛ لذلك لا يضيّق النص العربي الدلالة أكثر مما يفعله الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المثنى اتساقًا مع مرجع الضمير، وحُفظت العبارة «في يسوع» على غرابتها النسبية لأنها تحمل غموض الأصل المقصود، مع توضيحها في الحاشية.
