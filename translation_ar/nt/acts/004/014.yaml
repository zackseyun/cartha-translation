  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: ar
  text: ولما رأوا الرجل الذي شُفي واقفًا معهما، لم يكن لديهم ما يعترضون به.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يجدوا ما يقولونه ردًّا»، أو: «لم يكن لديهم ما يناقضون به».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: و
  rationale: تربط الأداة الجملة بما قبلها في سياق السرد، وحرف العطف «و» يؤدي هذا المعنى طبيعيًا من غير مبالغة في الترجمة.
- source_word: ἄνθρωπον
  choice: الرجل
  rationale: تشير الكلمة هنا إلى الرجل المحدد الذي شُفي، كما يتضح من السياق السابق.
- source_word: βλέποντες
  choice: لما رأوا
  rationale: اسم الفاعل المضارع يدل على فعل متزامن مع الفعل الرئيس؛ وصياغة «لما رأوا» عربية طبيعية تبين العلاقة الزمنية من غير تغيير المعنى.
- source_word: σὺν αὐτοῖς
  choice: معهما
  rationale: يدل σύν مع المجرور على المصاحبة، والضمير يعود سياقيًا إلى بطرس ويوحنا، وهما اثنان؛ لذا استُعمل المثنى العربي.
- source_word: ἑστῶτα
  choice: واقفًا
  rationale: اسم الفاعل التام يصف حالة الرجل القائمة الناتجة عن وقوفه، وتؤدي «واقفًا» هذا المعنى بوضوح وطبيعية.
- source_word: τεθεραπευμένον
  choice: الذي شُفي
  rationale: اسم الفاعل التام المبني للمجهول يعرّف الرجل بالشفاء الذي تم وبقي أثره؛ وتحافظ الصياغة على المبني للمجهول من غير إدخال فاعل غير مصرّح به.
- source_word: οὐδὲν
  choice: ما
  rationale: تأتي ضمن تركيب النفي «لم يكن لديهم ما...» لتعبر عن انعدام أي قول أو حجة مضادة.
- source_word: εἶχον ἀντειπεῖν
  choice: لم يكن لديهم ما يعترضون به
  rationale: يحمل ἀντειπεῖν معنى القول في المقابلة أو المعارضة. وهذه الصياغة العربية طبيعية وتحفظ القوة الاعتراضية للفعل، مع الإشارة في الحاشية إلى بدائل ممكنة.
