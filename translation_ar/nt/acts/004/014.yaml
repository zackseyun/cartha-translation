  terminology: «شُفي» يحافظ على المبني للمجهول وعلى دلالة θεραπεύω في سياق المعجزة دون تحميل لاهوتي زائد. واستعمال «الرجل» و«واقفًا» دقيق ومألوف. الحاشية تعرض بدائل عربية معقولة لمعنى ἀντειπεῖν.
