  source_fidelity: 'الترجمة تنقل عناصر اليونانية بأمانة: الرجل الذي تم شفاؤه حاضرٌ واقفًا مع بطرس ويوحنا، ومشهدُه هذا جعلهم بلا جوابٍ اعتراضي. «لما رأوا» صياغة عربية سليمة للمشاركة βλέποντες، و«معهما» مناسبة في السياق القريب حيث المرجع بطرس ويوحنا. كما أن «لم يكن لديهم ما يعترضون به» تؤدي معنى οὐδὲν εἶχον ἀντειπεῖν، أي عدم امتلاك ما يقولونه في المعارضة أو النقض.'
