    issue: «وأخذوا يتكلّمون» تحمل دلالة ابتدائية زائدة.
    rationale: الفعل ἐλάλουν في صيغة الماضي الناقص يصور الكلام الجاري/المستمر. وقد تفيد «أخذوا» أنهم شرعوا في الكلام، وهي دلالة ليست مصرحًا بها في الصيغة اليونانية.
  - severity: low
    issue: «امتلأوا جميعًا من الروح القدس» أقل معيارية في العربية من «امتلأوا جميعًا بالروح القدس».
    rationale: الباء هي الاستعمال العربي المألوف مع «امتلأ» للدلالة على ما يملأ، وتحافظ تمامًا على معنى الجينيتيف اليوناني في هذا التركيب.
