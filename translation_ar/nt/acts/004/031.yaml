base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: ar
  text: ولمّا صلّوا، اهتزّ المكان الذي كانوا مجتمعين فيه، وامتلأوا جميعًا بالروح القدس، وكانوا يتكلّمون بكلمة الله بجرأة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بثقة» أو «بصراحة». تدل الكلمة اليونانية على كلام علني صريح لا يخاف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: ولمّا صلّوا
  rationale: التركيب المطلق بالمضاف إليه مع اسم الفاعل الأوريستي يقدّم خلفية زمنية؛ و«لمّا صلّوا» عربية طبيعية تنقل معنى الدعاء والصلاة الجماعية في السياق.
- source_word: ἐσαλεύθη
  choice: اهتزّ
  rationale: ينقل بوضوح وقوع اهتزاز فعلي بالمكان، مع صياغة عربية طبيعية لا تحتاج إلى المبني للمجهول.
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: الذي كانوا مجتمعين فيه
  rationale: يحفظ معنى كونهم في حالة اجتماع، كما يفيده تركيب الفعل مع اسم المفعول التام، دون الجزم بأن التركيز على فعل اجتماعهم نفسه.
- source_word: ἐπλήσθησαν ἅπαντες τοῦ ἁγίου πνεύματος
  choice: وامتلأوا جميعًا من الروح القدس
  rationale: يحفظ صيغة الامتلاء الشائعة عند لوقا وشمول الجماعة كلها، وينقل المضاف إليه اليوناني بـ«من» على نحو عربي فصيح.
- source_word: ἐλάλουν
  choice: وأخذوا يتكلّمون
  rationale: الماضي الناقص يصوّر كلامًا ممتدًا؛ وتفيد «أخذوا يتكلّمون» انطلاق الفعل واستمراره في هذا السياق، من غير اختزاله إلى حدث نقطي.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: بكلمة الله
  rationale: يحفظ التعبير الكتابي المألوف عن الرسالة الإلهية المعلنة، مع استعمال الباء الملائم للفعل «يتكلّمون» في العربية.
- source_word: μετὰ παρρησίας
  choice: بجرأة
  rationale: تعبّر «بجرأة» عن الكلام العلني الصريح الذي لا يخاف، وهو المعنى السياقي للمصطلح في سفر الأعمال.
theological_decisions:
- issue: لغة الامتلاء بالروح القدس
  choice: امتلأوا جميعًا من الروح القدس
  alternative: ملأهم الروح القدس جميعًا
  rationale: الصياغة المختارة تحافظ على صورة الامتلاء وعلى البناء الذي يصف حال الجماعة، ولا تحوّله إلى تقرير تفسيري أضيق عن كيفية عمل الروح أو عن ترتيب خبرة روحية مخصوصة.
- issue: دلالة الماضي الناقص في ἐλάλουν
  choice: أخذوا يتكلّمون
  alternative: تكلّموا
  rationale: الصياغة المختارة تُظهر أن الشهادة بالكلمة كانت فعلًا جاريًا، لا مجرد واقعة لحظية، مع تجنب بناء استنتاج عقائدي يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «اهتزّ» للمشهد المادي، و«كانوا مجتمعين» لحفظ حالة الاجتماع، و«بجرأة» في المتن مع بيان المجال الدلالي الأوسع في الحاشية.
