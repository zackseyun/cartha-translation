id: ACT.4.10
reference: Acts 4:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: ar
  text: فليكن معلومًا لكم جميعًا ولجميع شعب إسرائيل أنه باسم يسوع المسيح الناصري[a]، الذي صلبتموه، والذي أقامه الله من بين الأموات، بهذا[b] يقف هذا الرجل أمامكم معافًى[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يسوع المسيح الذي من الناصرة». ولفظ «المسيح» لقب، وقد يأتي أيضًا ملازمًا للاسم.'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أن تعود كلمة «بهذا» إلى يسوع نفسه، أو أن يكون المعنى: «بهذا الاسم».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «سليمًا» أو «صحيحًا». يدل اللفظ اليوناني على السلامة أو استعادة الصحة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: فليكن معلومًا
  rationale: يحفظ قوة صيغة الأمر غير الشخصية بوصفها إعلانًا علنيًا، في عربية فصيحة واضحة.
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: لدى جميعكم ولدى شعب إسرائيل كله
  rationale: يحافظ على التمييز بين المخاطَبين الحاضرين وشعب إسرائيل الأوسع.
- source_word: ἐν τῷ ὀνόματι
  choice: باسم
  rationale: ينقل التعبير اليوناني المألوف مع دلالته هنا على الوسيلة أو السلطان الفعّال.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ترجمة عربية راسخة للقب Χριστός وتحفظ دلالته المسيانية.
- source_word: τοῦ Ναζωραίου
  choice: الناصري
  rationale: ترجمة مباشرة للنسبة إلى الناصرة، وتلائم تسلسل الاسم واللقب في اليونانية.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: الذي صلبتموه
  rationale: يحفظ الاتهام المباشر وضمير المخاطبين المؤكد في الأصل.
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: والذي أقامه الله من بين الأموات
  rationale: يحفظ فاعلية الله الصريحة ولغة القيامة من الموت.
- source_word: ἐν τούτῳ
  choice: بهذا
  rationale: يحافظ على إحالة اسم الإشارة المذكرة وعلى غموضها الممكن بين شخص يسوع واسمه المذكور.
- source_word: οὗτος παρέστηκεν ἐνώπιον ὑμῶν
  choice: يقف هذا الرجل أمامكم
  rationale: يبيّن أن اسم الإشارة يشير إلى الرجل الذي شُفي، وينقل الحالة الحاضرة الناتجة عن فعل سابق.
- source_word: ὑγιής
  choice: معافًى
  rationale: لفظ عربي طبيعي يدل على استعادة السلامة والصحة الجسدية.
theological_decisions:
- issue: 'دلالة Χριστός: لقب أم جزء اسمي'
  choice: المسيح
  alternative: كريستوس أو استعماله كجزء اسمي غير مترجم
  rationale: السياق إعلان عن هوية يسوع أمام قادة إسرائيل، و«المسيح» يحفظ قوة اللقب المسياني بلا إضافة تفسير مذهبي.
- issue: مرجع ἐν τούτῳ
  choice: بهذا
  alternative: به أو بهذا الاسم
  rationale: الصياغة المختارة لا تحسم ما إذا كان المرجع يسوع نفسه أو اسمه المذكور، بل تحفظ التوتر الدلالي في الأصل وتوضح البدائل في الحاشية.
- issue: صياغة القيامة
  choice: أقامه الله من بين الأموات
  alternative: أنهضه الله من الأموات
  rationale: تحفظ فاعلية الله الصريحة وادعاء القيامة كما يورده النص، من غير توسيع عقائدي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «فليكن معلومًا» للحفاظ على نبرة الإعلان الرسمي، و«معافًى» للتعبير الطبيعي عن الشفاء. وُضعت جميع علامات الحواشي [a] و[b] و[c] في المتن.
