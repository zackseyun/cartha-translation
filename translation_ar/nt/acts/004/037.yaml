  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: ar
  text: وكان له حقلٌ[a]، فباعه وجاء بالمال[b] ووضعه عند أقدام الرسل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وإذ كان يملك حقلًا» أو «ولأنه كان يملك حقلًا». يستعمل النص اليوناني تركيب المضاف إليه المطلق لتقديم خلفية أو ملابسة للسياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بثمنه» أو «بحصيلة البيع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: وكان له حقلٌ
  rationale: ينقل هذا التعبير بصورة عربية طبيعية الظرف الخلفي الذي تؤديه صيغة المضاف إليه المطلقة في اليونانية، ويدل على أن الحقل كان ملكًا له من غير إثقال العبارة.
- source_word: ἀγροῦ
  choice: حقلٌ
  rationale: «حقل» هو المقابل المباشر الشائع لـἀγρός هنا، ويبقي نوع العقار عامًا كما في الأصل.
- source_word: πωλήσας
  choice: فباعه
  rationale: اسم الفاعل الماضي يدل على فعل سبق الفعلين الرئيسيين؛ والفاء مع الفعل الماضي توضح التسلسل طبيعيًا، والضمير يعود إلى الحقل.
- source_word: ἤνεγκεν
  choice: جاء بـ
  rationale: يؤدي معنى الإحضار إلى موضع الرسل بعبارة عربية سلسة ومألوفة.
- source_word: τὸ χρῆμα
  choice: المال
  rationale: يدل اللفظ هنا على المال الناتج من البيع. و«المال» ترجمة مباشرة، بينما «ثمنه» أو «حصيلة البيع» أوضح سياقيًا لكنها أكثر تفسيرًا.
- source_word: ἔθηκεν
  choice: وضعه
  rationale: «وضع» مقابل مباشر وطبيعي للفعل τίθημι، ويحافظ على الفعل المادي الموصوف في المشهد.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: عند أقدام الرسل
  rationale: يحفظ الصورة المكانية الملموسة في اليونانية، وما قد تحمله في السياق من تسليم المال لتدبير الرسل، من غير استبدالها بتفسير مجرد.
theological_decisions:
- issue: هل تُحفظ الصورة المادية لتقديم المال إلى سلطة الرسل؟
  choice: الإبقاء على العبارة الملموسة «وضعه عند أقدام الرسل».
  alternative: «سلّمه إلى الرسل» أو «أعطاه للرسل».
  rationale: يصف النص فعلًا ماديًا ويشير ضمنًا إلى وضع المال تحت تصرف الرسل. حفظ الصورة ينقل البعدين معًا من غير إضافة دعوى كنسية غير مصرّح بها.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «وكان له» لطبيعته في السرد العربي، وحُفظت صورة «عند أقدام الرسل» لقربها من الأصل ووضوحها للقارئ المعاصر.
