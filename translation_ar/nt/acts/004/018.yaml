  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: ar
  text: فاستدعوهما وأمروهما ألّا ينطقا مطلقًا ولا يعلّما باسم يسوع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ألّا يقولا أيَّ شيء على الإطلاق ولا يعلّما باسم يسوع».'
    reason: بديل معجمي يبرز أن المنع قد يُصاغ بوصفه منعًا من قول أي شيء مطلقًا.
lexical_decisions:
- source_word: καλέσαντες αὐτούς
  choice: فاستدعوهما
  rationale: اسم الفاعل الأوريستي يسبق الفعل الرئيس ويفيد هنا حدثًا سابقًا متصلًا به؛ والفعل «استدعى» يلائم سياق المجلس. واستُعمل ضمير التثنية لأن المرجع هو بطرس ويوحنا.
- source_word: παρήγγειλαν
  choice: وأمروهما
  rationale: ينقل «أمر» قوة التوجيه السلطوي بوضوح في العربية المعاصرة.
- source_word: τὸ καθόλου
  choice: مطلقًا
  rationale: تفيد العبارة توكيد المنع وشموله، و«مطلقًا» صياغة عربية موجزة وطبيعية.
- source_word: μὴ φθέγγεσθαι
  choice: ألّا ينطقا
  rationale: الفعل يدل على النطق أو التكلم؛ واختيار «ينطقا» يحافظ على شدة المنع من أي تفوه، مع بقاء البديل الأوسع مذكورًا في الحاشية.
- source_word: μηδὲ διδάσκειν
  choice: ولا يعلّما
  rationale: تحفظ «ولا» عطف النشاط الثاني المحظور على الأول ضمن نهي شامل.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: باسم يسوع
  rationale: تعبير عربي طبيعي يحفظ ارتباط الكلام والتعليم باسم يسوع، بما قد يتضمن المرجعية أو السلطان، من غير فرض شرح تفسيري داخل المتن.
- source_word: Ἰησοῦ
  choice: يسوع
  rationale: الصيغة العربية المستقرة للاسم الشخصي في هذا السياق.
theological_decisions:
- issue: مدى الحظر المتعلق بالشهادة ليسوع
  choice: حظر مؤكد يشمل النطق والتعليم باسم يسوع
  alternative: حظر يقتصر على الكرازة العلنية دون سائر الكلام
  rationale: اجتماع τὸ καθόλου مع μὴ φθέγγεσθαι μηδὲ διδάσκειν يدل على منع شامل ومؤكد للنطق والتعليم، ولا يحدد النص أن المنع مقصور على الكرازة العلنية.
- issue: دلالة ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: باسم يسوع
  alternative: استنادًا إلى اسم يسوع أو عن اسم يسوع
  rationale: يحفظ التعبير الموجز سعة العلاقة الدلالية بين النشاط واسم يسوع، ولا يحصرها تعسفًا في موضوع الكلام وحده أو في مفهوم السلطان وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. روعي تطابق ضمائر التثنية مع بطرس ويوحنا في السياق، واستُعمل «مطلقًا» لإبراز شمول الحظر دون إثقال العبارة.
