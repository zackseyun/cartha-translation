source:
  edition: SBLGNT
  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: ar
  text: فبعدما زادوا في تهديدهما[a]، أطلقوهما، إذ لم يجدوا سبيلًا إلى معاقبتهما بسبب الشعب، لأن الجميع كانوا يمجّدون الله على ما حدث.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعدما هدّدوهما من جديد»، أو: «بعدما أضافوا إلى تهديدهما». يفيد الفعل اليوناني تهديدًا إضافيًا أو أشدّ مما سبق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: بعدما زادوا في تهديدهما
  rationale: ينقل معنى التهديد الإضافي أو المكثّف الذي تفيده السابقة في الفعل اليوناني، مع الحفاظ على عربية طبيعية.
- source_word: ἀπέλυσαν
  choice: أطلقوهما
  rationale: يدل الفعل هنا على الإفراج عنهما من قبضة السلطات، و«أطلقوهما» تعبير عربي واضح في هذا السياق.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: إذ لم يجدوا سبيلًا إلى معاقبتهما
  rationale: يبين التركيب أن السلطات لم تجد كيفية أو وسيلة لمعاقبتهما؛ والصياغة المختارة واضحة وتحفظ معنى الإمكان العملي.
- source_word: διὰ τὸν λαόν
  choice: بسبب الشعب
  rationale: تفيد διά مع النصب العلة هنا، و«الشعب» أنسب من «الجمع» لأن الإشارة إلى عامة الناس الذين قيّد موقفهم تصرف السلطات.
- source_word: πάντες
  choice: الجميع
  rationale: يحفظ الشمول المقصود في السياق بصياغة عربية مألوفة.
- source_word: ἐδόξαζον τὸν θεόν
  choice: كانوا يمجّدون الله
  rationale: تحفظ «يمجّدون» لغة إسناد المجد إلى الله، وتنقل صيغة «كانوا» الجانب الاستمراري للفعل الناقص اليوناني.
- source_word: ἐπὶ τῷ γεγονότι
  choice: على ما حدث
  rationale: تعبير عربي طبيعي يبين أن الحدث الواقع كان أساس تمجيدهم لله، مع مراعاة دلالة الحدث المكتمل.
