lexical_decisions:
- source_word: κελεύσαντες
  choice: فأمروهما
  rationale: اسم الفاعل الأوريستي يدل على فعل سابق للفعل الرئيس، وصيغة «أمروهما» تنقل سلطة الآمر بوضوح وتلائم السرد العربي.
- source_word: δὲ
  choice: فـ
  rationale: تفيد انتقالًا سرديًا ذا صلة بما قبله، والفاء طبيعية هنا من غير تشديد للمقابلة أكثر مما يحتمله السياق.
- source_word: αὐτοὺς
  choice: هما
  rationale: الضمير يعود إلى بطرس ويوحنا، ولذلك استُعمل المثنى العربي الدقيق.
- source_word: ἔξω τοῦ συνεδρίου
  choice: أن يخرجا من مجلس القضاء
  rationale: συνέδριον يدل هنا على الهيئة اليهودية الحاكمة أو مجلس انعقادها؛ و«مجلس القضاء» تعبير عربي واضح ينقل الطابع الرسمي للهيئة، مع حفظ البديل في الحاشية.
- source_word: ἀπελθεῖν
  choice: أن يخرجا
  rationale: ينسجم مع ἔξω وينقل معنى مغادرة مكان الاجتماع أو حضرة المجلس بصياغة عربية موجزة.
- source_word: συνέβαλλον
  choice: أخذوا يتشاورون
  rationale: صيغة الماضي الناقص تصور فعلًا جاريًا أو مبتدئًا في المشهد، و«أخذوا يتشاورون» تنقل بدء المداولة واستمرارها.
- source_word: πρὸς ἀλλήλους
  choice: بعضهم مع بعض
  rationale: تعبير تبادلي طبيعي يبين أن التشاور كان متبادلًا بين أعضاء المجلس.
