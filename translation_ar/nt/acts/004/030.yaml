- from: وَأَنْتَ تَمُدُّ يَدَكَ لِلشِّفَاءِ، وَتَجْرِي آيَاتٌ وَعَجَائِبُ بِاسْمِ فَتَاكَ الْقُدُّوسِ يَسُوعَ.[a]
  to: وَأَنْتَ تَمُدُّ يَدَكَ لِلشِّفَاءِ، وَتَجْرِي آيَاتٌ وَعَجَائِبُ بِاسْمِ خَادِمِكَ الْقُدُّوسِ يَسُوعَ.[a]
  rationale: استُبدلت «فتاك» بـ«خادمك» لأن هذه اللفظة أوضح في العربية الفصحى المعاصرة، وتمثل المعنى المرجح لـπαῖς في هذا السياق، المتصل بصورة عبد الرب، مع إبقاء القراءة البديلة «ابنك» في الحاشية. وأُبقيت بقية الصياغة لأنها أمينة وطبيعية.
  reviewer_model: gpt-5.6-terra
