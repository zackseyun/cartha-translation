  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: ar
  text: وَأَنْتَ تَمُدُّ يَدَكَ لِلشِّفَاءِ، وَتَجْرِي آيَاتٌ وَعَجَائِبُ بِاسْمِ خَادِمِكَ الْقُدُّوسِ يَسُوعَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني الكلمة اليونانية «ابنك القدوس يسوع». لكنها قد تعني أيضًا «خادمك»، وهو المعنى المُختار هنا لأن سياق سفر الأعمال يردد صدى الحديث عن عبد الرب في سفر إشعياء.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: وأنت تمدّ
  rationale: تنقل التركيب الظرفي الدال على التزامن بصياغة عربية طبيعية، مع بقاء الآية متصلة بسياق الصلاة.
- source_word: τὴν χεῖρά σου
  choice: يدك
  rationale: يحافظ على الصورة الكتابية ليد الله بوصفها تعبيرًا عن فعله وقدرته دون توسيع تفسيري.
- source_word: εἰς ἴασιν
  choice: للشفاء
  rationale: ينقل معنى الغاية في εἰς مع الاسم ἴασις بوضوح وإيجاز.
- source_word: σημεῖα καὶ τέρατα
  choice: آيات وعجائب
  rationale: تعبير عربي كتابي واضح يحافظ على الاقتران الاصطلاحي بين اللفظين في سفر الأعمال.
- source_word: γίνεσθαι
  choice: تجري
  rationale: صياغة عربية طبيعية تفيد وقوع الآيات والعجائب، من غير تعيين فاعل بشري أو تحميل الفعل معنى زائدًا.
- source_word: διὰ τοῦ ὀνόματος
  choice: باسم
  rationale: ينقل الوساطة أو الوسيلة التي تفيدها διά مع المضاف إليه، ويحافظ على المفهوم الكتابي للاسم دون شرحه داخل النص.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: فتاك القدوس يسوع
  rationale: لفظ «فتى» العربي يحتمل الخادم والولد، فيحفظ قدرًا من التعدد الدلالي في παῖς، كما يلائم صدى لغة عبد الرب في إشعياء؛ وتوضح الحاشية الاحتمالين.
theological_decisions:
- issue: دلالة παῖς في وصف يسوع
  choice: فتاك
  alternative: عبدك؛ ابنك
  rationale: تحتمل الكلمة اليونانية معنى الخادم أو الولد. ويحفظ «فتاك» هذا التوتر الدلالي، بينما يرجّح سياق أعمال الرسل وصدى إشعياء معنى خادم الرب من غير نفي بنوّة يسوع المعبَّر عنها بألفاظ أخرى.
translation_notes:
  register: عربية فصحى معاصرة ذات نبرة كتابية مهيبة وواضحة. اختير «تجري» بدل تركيب مبني للمجهول أثقل، واختير «فتاك» في المتن للمحافظة على الغموض الحقيقي في اللفظ اليوناني، مع شرحه في الحاشية.
