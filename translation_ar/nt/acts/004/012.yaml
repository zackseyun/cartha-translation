  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: ar
  text: وليس الخلاص في أحدٍ غيره، إذ ليس تحت السماء اسمٌ آخر قد أُعطي بين البشر، به ينبغي أن نخلص.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωτηρία
  choice: الخلاص
  rationale: ينقل معنى النجاة والخلاص في سياق إعلان بطرس عن دور يسوع الفريد، ويحافظ على الصلة اللفظية بالفعل σωθῆναι في ختام الآية.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: في أحدٍ غيره
  rationale: يحافظ على تركيب «في» وعلى حصرية الإسناد إلى شخص، مع تعبير عربي طبيعي واضح.
- source_word: ὄνομα
  choice: اسم
  rationale: أُبقي اللفظ كما هو دون اختزاله في «شخص» أو «سلطان»، لأنه يحتفظ بإيحاءات الهوية والسلطان المرتبطة بالاسم في الاستعمال الكتابي.
- source_word: ἕτερον
  choice: آخر
  rationale: الأنسب في سياق النفي «ليس... اسم آخر»، وينقل الحصرية دون تحميل اللفظ معنى «مختلف» على نحو زائد.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: تحت السماء
  rationale: يحافظ على الصورة الكتابية وعلى دلالتها العالمية، بدل تسطيحها إلى «في العالم».
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: قد أُعطي بين البشر
  rationale: يجعل اسم المفعول عائدًا إلى «اسم»، ويأخذ ἐν بمعنى الوجود أو الإعلان بين جماعة البشر، لا بمعنى الإعطاء إليهم فقط.
- source_word: ἐν ᾧ
  choice: به
  rationale: ضمير الوسيلة يعود إلى «الاسم»، و«به» صياغة عربية موجزة وطبيعية تحفظ البعد الوسيلي للتركيب.
- source_word: δεῖ
  choice: ينبغي
  rationale: ينقل معنى الضرورة في صياغة عربية فصيحة، من غير إضافة تفسير لمصدر تلك الضرورة.
- source_word: σωθῆναι
  choice: أن نخلص
  rationale: يحافظ على المبني للمجهول الدلالي وعلى التوازي مع «الخلاص»، مع صياغة عربية سليمة.
theological_decisions:
- issue: حصرية الخلاص في يسوع
  choice: وليس الخلاص في أحدٍ غيره
  alternative: لا توجد طريقة أخرى للخلاص
  rationale: النص اليوناني ينفي وجود الخلاص في أي شخص آخر، لا مجرد وجود «طريقة» أخرى؛ لذلك حُفظ الادعاء الشخصي الحصري بلا تخفيف أو شرح عقائدي زائد.
- issue: دلالة «الاسم»
  choice: الإبقاء على «اسم» دون تفسيره
  alternative: شخص أو سلطان
  rationale: يحمل ὄνομα في السياق إمكانات دلالية تشمل الشخص والهوية والسلطان، والإبقاء على اللفظ يصون هذا الثراء والتوتر دون حسم تفسيري.
- issue: شمول ἀνθρώποις للبشر جميعًا
  choice: بين البشر
  alternative: بين الناس أو للبشر
  rationale: اللفظ اليوناني عام يشير إلى الإنسانية، و«البشر» واضح وشامل في العربية المعاصرة، كما أن «بين» أقرب إلى ἐν من جعل العبارة مفعولًا غير مباشر.
translation_notes:
  register: صياغة عربية فصحى معاصرة ذات نبرة كتابية مهيبة وواضحة. حُفظت عبارتا «في أحد غيره» و«تحت السماء» لما فيهما من قرب من بنية الأصل، مع تجنب الذكورية غير اللازمة لأن ἀνθρώποις عام في هذا السياق.
