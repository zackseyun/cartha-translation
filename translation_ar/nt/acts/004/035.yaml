  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: ar
  text: وكانوا يضعونها عند أقدام الرسل[b][a]، وكان يُوزَّع على كل واحد بقدر احتياجه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمام الرسل». ويقول اليوناني حرفيًا: «عند أقدام الرسل»، وهي صورة تدل في السياق على وضع الحصيلة تحت إشرافهم.'
    reason: lexical_alternative
  - marker: b
    text: 'الشيء الذي كانوا يضعونه والذي كان يُوزَّع مفهوم من الآية السابقة: حصيلة ما بيع.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: كانوا يضعونها
  rationale: صيغة الماضي الناقص تدل على فعل متكرر أو مستمر في سياق السرد؛ واستُعمل ضمير المؤنث اعتمادًا على عائد مفهوم من الآية السابقة، أي أثمان المبيعات أو حصيلتها.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: عند أقدام الرسل
  rationale: يحفظ التعبير الصورة المكانية الملموسة، مع ما توحي به في السياق من وضع المال تحت إشراف الرسل، من غير استبدال الصورة بتفسيرها.
- source_word: διεδίδετο
  choice: كان يُوزَّع
  rationale: يحفظ المبني للمجهول ودلالة الماضي الناقص على التوزيع الجاري أو المعتاد، ولا يعيّن القائم بالتوزيع إذ لم يعيّنه النص.
- source_word: ἑκάστῳ
  choice: على كل واحد
  rationale: ينقل قوة التوزيع الفردي في صيغة عربية طبيعية.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: بقدر احتياجه
  rationale: ينقل معنى التناسب بين مقدار العطاء والحاجة، بصياغة عربية واضحة وموجزة.
- source_word: τις
  choice: كل واحد
  rationale: ينقل الدلالة العامة غير المحددة في السياق ولا يقصرها على شخص بعينه.
- source_word: χρείαν
  choice: احتياجه
  rationale: «الاحتياج» تعبير عربي واضح عن الحاجة الفعلية المقصودة هنا.
theological_decisions:
- issue: تعيين الشيء الذي كانوا يضعونه والذي كان يُوزَّع
  choice: إبقاء المرجع ضمنيًا بضمير في الجملة الأولى وحذف نائب الفاعل الملفوظ في الثانية، اعتمادًا على سياق الآية السابقة
  alternative: التصريح بقول «أثمان المبيعات» أو «المال» في الموضعين
  rationale: النص اليوناني لا يذكر المفعول صراحة، بل يعتمد على ما سبق؛ لذلك تحافظ الترجمة على هذا الترابط ولا تضيف تحديدًا تفسيريًا إلى المتن.
- issue: هل عبارة «عند أقدام الرسل» مكانية فقط أم تدل على الخضوع لإشرافهم
  choice: الإبقاء على الصورة الحرفية في المتن
  alternative: ترجمتها «أمام الرسل» أو «تحت تصرف الرسل»
  rationale: الصورة اليونانية حقيقية في صياغتها وقد تتضمن معنى وضع الحصيلة تحت إشراف الرسل؛ إبقاؤها يمنع حصرها في تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ تتابع الفعل المتكرر بصيغة «كانوا يضعون» و«كان يُوزَّع»، وحُفظت صورة «عند أقدام الرسل» مع شرح البديل في الحاشية.
