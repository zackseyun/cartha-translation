  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: ar
  text: لكن كثيرون من الذين سمعوا الرسالة آمنوا، وصار عدد الرجال[a] نحو خمسة آلاف.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «عدد الرجال»، ويبدو أن المقصود إحصاء الذكور، لا العدد الكامل لجماعة تضم رجالًا ونساءً.'
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ
  choice: كثيرون
  rationale: يحافظ على الدلالة الكمية غير المحددة من غير إضافة اسم غير موجود في اليونانية.
- source_word: δὲ
  choice: لكن
  rationale: ينقل المقابلة مع المقاومة والقبض المذكورين في السياق السابق، وهو طبيعي في السرد العربي.
- source_word: ἀκουσάντων τὸν λόγον
  choice: الذين سمعوا الرسالة
  rationale: تدل العبارة هنا على ما أعلنه الرسل؛ و«الرسالة» توصل المعنى بوضوح، مع بقاء «الكلمة» احتمالًا معجميًا ممكنًا.
- source_word: ἐπίστευσαν
  choice: آمنوا
  rationale: ترجمة مباشرة تحفظ بساطة الفعل اليوناني من غير توسيع يحدد متعلق الإيمان بما لا يصرح به النص.
- source_word: ἐγενήθη ὁ ἀριθμὸς
  choice: صار عدد
  rationale: يعبر تعبيرًا عربيًا طبيعيًا ومباشرًا عن الحالة العددية الناتجة، من غير إدخال معنى النمو صراحة.
- source_word: τῶν ἀνδρῶν
  choice: الرجال
  rationale: يحفظ الدلالة الذكورية المعتادة للاسم ἀνήρ بدل تحويلها إلى لفظ عام مثل «الناس».
- source_word: ὡς χιλιάδες πέντε
  choice: نحو خمسة آلاف
  rationale: تنقل «نحو» دلالة التقريب التي تفيدها ὡς قبل العدد، بصياغة عربية فصيحة ومألوفة.
theological_decisions:
- issue: طبيعة المعدود في τῶν ἀνδρῶν
  choice: الرجال
  alternative: الناس أو المؤمنون
  rationale: النص اليوناني يستعمل لفظًا يدل عادة على الرجال، ولذلك حُفظ التحديد الجنسي. ولا يحسم ذلك ما إذا كانت النساء خارج جماعة المؤمنين، بل يصف صيغة الإحصاء في هذه الآية.
- issue: متعلق الإيمان في ἐπίστευσαν
  choice: آمنوا من غير مفعول مصرح به
  alternative: آمنوا بالرسالة أو آمنوا بالمسيح
  rationale: الفعل في اليونانية مطلق هنا؛ فالإبقاء عليه كذلك يحفظ إيجاز النص ولا يحسم صراحةً متعلق الإيمان اعتمادًا على السياق وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «الرسالة» لـ λόγος بحسب معناها السياقي بوصفها إعلان الرسل، وتُركت «آمنوا» مطلقة كما في الأصل. وُضع مؤشر الحاشية بعد «الرجال» لأنه الموضع الذي تحتاج دلالته إلى الإيضاح.
