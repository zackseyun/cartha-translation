  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: ar
  text: 'حينئذٍ قال لهم بطرس، وقد امتلأ من الروح القدس: «يا رؤساء الشعب وشيوخه،»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: حينئذٍ
  rationale: أداة زمنية تربط القول بالحدث السابق وتقدّمه بوصفه الخطوة التالية في السرد.
- source_word: Πέτρος
  choice: بطرس
  rationale: الصيغة العربية المعيارية المستقرة للاسم.
- source_word: πλησθεὶς
  choice: وقد امتلأ
  rationale: تحافظ صيغة الحال على علاقة اسم الفاعل بالفعل الرئيس، وتعبّر عن الامتلاء الذي سبق القول أو صاحبه من غير إثقال العبارة.
- source_word: πνεύματος ἁγίου
  choice: من الروح القدس
  rationale: التعبير العربي الطبيعي مع فعل «امتلأ»، ويحدّد السياق أن المقصود هو الروح القدس.
- source_word: εἶπεν πρὸς αὐτούς
  choice: قال لهم
  rationale: مقابل عربي مباشر وطبيعي لصيغة القول السردية.
- source_word: Ἄρχοντες
  choice: يا رؤساء
  rationale: صيغة نداء تدل على أصحاب السلطة الحاكمة أو القضائية، وهي أنسب في هذا المجلس من اللفظ العام «قادة».
- source_word: τοῦ λαοῦ
  choice: الشعب
  rationale: ترجمة مباشرة لـ λαός في السياق المدني والديني لشعب إسرائيل.
- source_word: πρεσβύτεροι
  choice: شيوخه
  rationale: يشير اللفظ هنا إلى الشيوخ المعترف بمكانتهم في مجلس الحكم، لا إلى كبار السن عمومًا؛ والضمير يربطهم بالشعب من غير تكرار ثقيل.
theological_decisions:
- issue: مرجع πνεύματος ἁγίου
  choice: الروح القدس
  alternative: روح مقدس
  rationale: السياق في أعمال الرسل يدل على الروح القدس الذي يملأ بطرس ويُمكّنه من الكلام؛ التعريف يحفظ هذا المرجع من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت بنية السرد ثم النداء، واستُعملت «يا» لإظهار صيغة المنادى اليونانية طبيعيًا. تنتهي الآية بفاصلة داخل الاقتباس لأن الخطاب يستمر في الآية التالية.
