  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: الظرف الزمني، واسم بطرس، وامتلاؤه بالروح القدس، وفعل القول والمخاطَبين، ثم النداء الموجّه إلى الرؤساء والشيوخ. وعبارة «وقد امتلأ» تؤدي وظيفة اسم الفاعل/الحال اليوناني على نحو عربي سليم.'
  naturalness: الصياغة فصحى حديثة واضحة ومناسبة للسرد الرسمي. ترتيب «قال لهم بطرس، وقد امتلأ...» طبيعي، والنداء بـ«يا» سليم. كما أن الفاصلة الختامية داخل الاقتباس مناسبة لأن الجملة الندائية تستمر في الآية التالية.
  terminology: «الروح القدس» و«رؤساء الشعب» و«شيوخه» ألفاظ دقيقة ومألوفة في هذا السياق. و«شيوخه» يعود بوضوح إلى «الشعب» ويؤدي معنى πρεσβύτεροι بوصفهم أعضاء ذوي مكانة، لا مجرد متقدمين في السن.
