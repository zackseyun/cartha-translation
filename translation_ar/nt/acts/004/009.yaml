  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: ar
  text: إن كنا نُستجوَب اليوم بشأن إحسانٍ أُسدي إلى رجلٍ عاجز، وبأيّ وسيلة شُفي هذا الرجل[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خَلَص» أو «صار معافًى»؛ فالفعل اليوناني قد يدل على الإنقاذ أو الخلاص أو الشفاء، والسياق المباشر هنا يشير إلى الشفاء الجسدي.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: نُستجوَب
  rationale: يفيد الفعل الفحص أو المساءلة في سياق قضائي؛ و«نُستجوَب» واضحة وتحفظ طابع المساءلة الرسمية من غير أن تجزم بأن الأمر محاكمة كاملة.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: بشأن إحسانٍ
  rationale: تدل العبارة على أساس المساءلة أو موضوعها، و«إحسان» تنقل معنى العمل النافع وتحفظ المفارقة في استجوابهم بسببه.
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: إلى رجلٍ عاجز
  rationale: يصف ἀσθενής الضعف أو العجز الجسدي هنا، وسياق الرجل الذي كان أعرج يرجّح «عاجز» على «مريض» من غير زيادة في تحديد حالته.
- source_word: ἐν τίνι
  choice: بأيّ وسيلة
  rationale: يمكن للتركيب أن يدل على الوسيلة أو الأداة، وقد يحتمل أيضًا الوكالة الشخصية. يحفظ هذا الاختيار سعة السؤال قبل أن يعيّن الجواب في الآية التالية يسوع بالاسم.
- source_word: σέσωσται
  choice: شُفي
  rationale: الفعل σῴζω قد يعني الخلاص أو الإنقاذ أو الشفاء. يشير السياق المباشر إلى استعادة الرجل جسديًا، لذلك نُقل بالشفاء مع إثبات الدلالة الأوسع في الحاشية.
theological_decisions:
- issue: دلالة σέσωσται في سياق الشفاء
  choice: شُفي
  alternative: خَلَص أو صار معافًى
  rationale: السياق المباشر جسدي، لكن الفعل نفسه يحمل في سفر الأعمال تداخلًا دلاليًا مع الخلاص؛ لذا أُبقي المعنى الجسدي في المتن وحُفظ التوتر اللاهوتي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة قضائية رصينة. استُعملت الشرطة الختامية لأن الجملة الشرطية تستمر في الآية التالية، ووُضع مؤشر الحاشية مباشرة بعد لفظ الشفاء ذي الدلالة المتعددة.
