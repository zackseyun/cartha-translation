  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: ar
  text: أمّا بولس فاختار سيلا وانطلق، بعد أن عهد به الإخوة[b] إلى نعمة الرب.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعد أن أوصى به الإخوة إلى نعمة الرب» أو «بعد أن سُلِّم إلى نعمة الرب».'
    reason: lexical_alternative
  - marker: b
    text: قد يُراد بـ«الإخوة» هنا جماعة المؤمنين عمومًا، بما فيها النساء، بحسب السياق.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: أمّا ... فـ
  rationale: تفيد مقابلة لطيفة مع انطلاق برنابا في الآية السابقة، وتأتي طبيعية في السرد العربي.
- source_word: ἐπιλεξάμενος
  choice: اختار
  rationale: تنقل معنى اختيار بولس الشخصي لسيلا قبل الانطلاق، من غير تحميل صيغة الوسط دلالة زائدة.
- source_word: Σιλᾶν
  choice: سيلا
  rationale: نقل صوتي للاسم وفق الصيغة العربية الكتابية الشائعة.
- source_word: ἐξῆλθεν
  choice: انطلق
  rationale: ملائمة لسياق بدء رحلة، وأفصح هنا من النقل الحرفي «خرج».
- source_word: παραδοθεὶς
  choice: وقد استودعه
  rationale: تنقل المبني للمجهول اليوناني بصياغة عربية طبيعية، وتفيد أن الجماعة عهدت ببولس إلى عناية النعمة، مع إبقاء البديل الحرفي في الحاشية.
- source_word: τῇ χάριτι
  choice: نعمة
  rationale: تحافظ على الاسم اللاهوتي الصريح χάρις ولا تستبدله بتفسير مثل «العناية الرحيمة».
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: تحافظ على لقب κύριος وعلى عدم تعيين مرجعه بأكثر مما يتيحه النص.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: الإخوة
  rationale: تحافظ على صيغة الجمع المذكر في الأصل، مع بيان احتمال شمولها جماعة المؤمنين الأوسع في الحاشية.
theological_decisions:
- issue: مرجع «الرب»
  choice: الرب
  alternative: الرب يسوع؛ الله
  rationale: لم يصرّح النص اليوناني بالمرجع، لذلك تُحفظ درجة التحديد نفسها من دون حسم لاهوتي زائد.
- issue: نطاق «الإخوة»
  choice: الإخوة في المتن مع حاشية توضيحية
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: اللفظ اليوناني مذكر جمع، لكنه قد يُستعمل للجماعة المؤمنة الأوسع؛ يحفظ المتن الصيغة ويذكر الاحتمال السياقي في الحاشية.
- issue: دلالة παραδοθεὶς
  choice: استودعه الإخوة نعمة الرب
  alternative: أوصى به الإخوة إلى نعمة الرب؛ سُلِّم إلى نعمة الرب
  rationale: «استودع» تعبر طبيعيًا عن العهد بشخص إلى رعاية إلهية، من غير اختزال «النعمة» في مجرد العناية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «أمّا ... فـ» لإظهار المقابلة السياقية، و«انطلق» للرحلة، و«استودعه» لصياغة المبني للمجهول اليوناني على نحو عربي طبيعي. وُضعت علامتا الحاشيتين بعد الجملة التي تتصلان بها.
