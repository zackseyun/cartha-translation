  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: ar
  text: بل نؤمن أننا سنُخلَّص بنعمة الرب يسوع، كما سيُخلَّص أولئك أيضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بعبارة أقرب إلى الأصل: «بل نؤمن أن نُخلَّص بنعمة الرب يسوع، على النحو نفسه الذي يُخلَّص به أولئك أيضًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد المقابلة القوية مع عجز الآباء والجيل الحاضر عن حمل النير، و«بل» طبيعية في هذا السياق.
- source_word: διὰ τῆς χάριτος
  choice: بنعمة
  rationale: تفيد διά مع المضاف إليه الوسيلة؛ والباء العربية تؤدي هذا المعنى بوضوح وإيجاز.
- source_word: χάριτος
  choice: نعمة
  rationale: هي المقابل العربي المألوف والدقيق للفضل الإلهي الذي به يكون الخلاص.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: الرب يسوع
  rationale: يتعلق المضاف إليه بـ«نعمة»، أي النعمة التي للرب يسوع أو الصادرة عنه.
- source_word: πιστεύομεν
  choice: نؤمن
  rationale: تنقل معنى الاقتناع الواثق، وتدخل على مضمون الإيمان في صياغة عربية طبيعية.
- source_word: σωθῆναι
  choice: أننا نخلص
  rationale: المصدر الماضي المبني للمجهول بعد «نؤمن» يُصاغ عربيًا جملةً مصدرية؛ والمضارع يحتمل الخلاص المنتظر من غير فرض زمن لا يصرح به المصدر اليوناني.
- source_word: καθ’ ὃν τρόπον
  choice: كما
  rationale: تنقل المقارنة في الكيفية بعبارة عربية واضحة وطبيعية.
- source_word: κἀκεῖνοι
  choice: يخلص أولئك أيضًا
  rationale: κἀκεῖνοι اختصار καὶ ἐκεῖνοι، أي «أولئك أيضًا». أُعيد فعل الخلاص في العربية لإتمام المقارنة بوضوح، مع إبقاء اتجاهها من «نحن» إلى «أولئك».
theological_decisions:
- issue: اتجاه المقارنة في قول بطرس
  choice: نحن نخلص كما يخلص أولئك أيضًا
  alternative: أولئك يخلصون كما نخلص نحن
  rationale: ترتيب اليونانية يجعل خلاص «نحن»—أي اليهود المؤمنين في السياق—مقيسًا على خلاص «أولئك» من الأمم، وهو توكيد مهم على أنهم لا يلزمون أولًا باتباع الهوية اليهودية.
- issue: طبيعة الخلاص بالنعمة
  choice: الخلاص بنعمة الرب يسوع، بلا توسع عقائدي زائد
  alternative: إضافة صيغ مثل «بالنعمة وحدها بالإيمان وحده»
  rationale: النص يصرح بالنعمة وبالإيمان/الاعتقاد، لكنه لا يورد تلك الصيغة الموسعة؛ لذلك لا ينبغي إدخال تفصيل مذهبي غير مذكور.
- issue: القيمة الزمنية لـ σωθῆναι
  choice: نخلص
  alternative: سنخلص
  rationale: المصدر اليوناني لا يحمل زمنًا مطلقًا بذاته. المضارع العربي يحافظ على شيء من هذا الانفتاح، مع إمكان فهم الخلاص المنتظر من السياق، بدل حصره صراحة في المستقبل.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعملت «بل» للمقابلة، و«بنعمة» لوسيلة الخلاص، وأُبقي اتجاه المقارنة اليوناني من اليهود («نحن») إلى الأمم («أولئك»). وُضعت علامة الحاشية [a] في المتن.
