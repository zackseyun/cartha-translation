lexical_decisions:
- source_word: γνωστὰ
  choice: مَعْرُوفَةٌ
  rationale: صفة خبرية في جملة اسمية موجزة بلا فعل ظاهر. تحافظ «مَعْرُوفَةٌ» على الصياغة المباشرة، من غير إضافة معنى «جعلها معروفة» غير المصرَّح به في النص.
- source_word: ἀπ’
  choice: مُنْذُ
  rationale: تفيد ἀπό هنا ابتداء الغاية الزمنية، و«مُنْذُ» هي المقابل العربي الطبيعي في هذا التركيب.
- source_word: αἰῶνος
  choice: الْقِدَمِ
  rationale: تدل الكلمة في هذا التعبير الزمني على الزمن القديم أو الماضي البعيد. وتنقل «الْقِدَمِ» إيجاز العبارة من غير أن تحسمها بمعنى «الأزل» الأقوى.
theological_decisions:
- issue: المدى الزمني للمعرفة في هذه العبارة الموجزة
  choice: صياغة العبارة بوصفها تقريرًا أن هذه الأمور معروفة منذ القدم، من غير توسيعها إلى تصريح عقائدي أقوى عن المعرفة الأزلية السابقة.
  alternative: 'مَعْرُوفَةٌ مُنْذُ الأَزَلِ؛ أو: الَّذِي يُعَرِّفُ هَذِهِ الأُمُورَ مُنْذُ الْقِدَمِ.'
  rationale: 'نص SBLGNT شديد الإيجاز: γνωστὰ ἀπ’ αἰῶνος. لذلك ينبغي الحفاظ على إيجازه وألا تُضاف إليه ألفاظ القراءة الأطول أو استنتاجات لاهوتية، مع إثبات القراءات الأوسع في الحاشية.'
translation_notes:
  register: عربية فصحى واضحة وموجزة ذات نبرة كتابية رصينة. روعي تأنيث «مَعْرُوفَةٌ» على الأرجح لموافقة مرجع جمع غير العاقل في السياق، مع إبقاء العبارة الاسمية المضغوطة كما في اليونانية.
