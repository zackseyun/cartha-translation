source:
  edition: SBLGNT
  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: ar
  text: وبعد أن أقاموا مدةً، ودَّعهم الإخوة[a] بسلام إلى الذين أرسلوهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات»؛ فاليونانية تقول «الإخوة»، لكن اللفظ في هذا السياق قد يشمل جماعة المؤمنين كلها.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: بعد أن أقاموا هناك مدةً
  rationale: التعبير اليوناني اصطلاحي بمعنى قضاء مدة أو الإقامة زمنًا. أُضيفت «هناك» لسلامة العربية اعتمادًا على سياق إقامتهم في أنطاكية، مع أنها غير مذكورة صراحةً في اليونانية.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تتابع السرد، والواو أنسب مقابل عربي غير متكلف.
- source_word: ἀπελύθησαν
  choice: ودَّعهم
  rationale: الفعل المبني للمجهول يدل هنا على السماح للمندوبين بالانصراف وتشييعهم، لا على إطلاقهم من قيد. وصيغة «ودَّعهم الإخوة» طبيعية في العربية وتحفظ معنى الانصراف الودي.
- source_word: μετ’ εἰρήνης
  choice: بسلام
  rationale: تعبير مألوف يدل على الرحيل في سلام ومع حسن الإرادة، و«بسلام» صياغة عربية موجزة وطبيعية.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: الإخوة
  rationale: اللفظ اليوناني مذكر جمع، وقد يُستعمل في أعمال الرسل للدلالة على جماعة المؤمنين شاملةً. حُفظت صورته في المتن، ووُضّح احتمال الشمول في الحاشية.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: ليرجعوا إلى الذين أرسلوهم
  rationale: اسم الفاعل المعرّف يشير إلى الذين سبق أن أرسلوهم. أُبرز معنى الرجوع الذي تدل عليه جهة الحركة والسياق، من غير تحديد هوية المرسِلين بأكثر مما في النص.
theological_decisions:
- issue: الدلالة الشاملة للفظ ἀδελφοί
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: لا تتعلق المسألة بعقيدة خاصة. أبقى المتن الصيغة المذكرة الصريحة في الأصل، بينما تبيّن الحاشية أن المقصود في السياق قد يكون جماعة المؤمنين بأسرها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أقاموا» بدل الترجمة الحرفية للتعبير اليوناني، و«ودَّعهم» لتصوير الإذن الودي بالانصراف. وُضع رمز الحاشية بعد الجملة لأنه يشرح لفظ «الإخوة» الوارد فيها.
