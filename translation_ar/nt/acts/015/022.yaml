id: ACT.15.22
reference: Acts 15:22
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: ar
  text: 'حينئذٍ استصوب الرسل والشيوخ، بالاشتراك مع الكنيسة كلها، أن يختاروا رجالًا منهم ويرسلوهم إلى أنطاكية مع بولس وبرنابا: يهوذا المدعو برسابا، وسيلا، وهما رجلان يتوليان القيادة بين الإخوة.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وهما من القادة بين الإخوة».'
    reason: lexical_alternative
  - marker: b
    text: لفظ «الإخوة» هنا يُرجَّح أنه يشير إلى جماعة المؤمنين عمومًا، بمن فيهم النساء.
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: رأى ... أن
  rationale: تعبير عربي طبيعي في سياق التشاور، ينقل معنى التقدير الجماعي والاستحسان من غير أن يحوّله إلى مرسوم رسمي صريح.
- source_word: πρεσβυτέροις
  choice: الشيوخ
  rationale: المقابل العربي المألوف والواضح في سياق قيادة الجماعة المسيحية.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: مع الكنيسة كلها
  rationale: يحفظ اشتراك جماعة المؤمنين كلها مع الرسل والشيوخ في القرار، من غير فرض نموذج كنسي محدد.
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: أن يختاروا رجالًا منهم
  rationale: يصوغ علاقة اسم الفاعل بالفعل الرئيس صياغة عربية سلسة، ويحفظ التحديد المذكر في ἄνδρας وكون المختارين من داخل الجماعة.
- source_word: πέμψαι εἰς Ἀντιόχειαν
  choice: ويرسلوهم إلى أنطاكية
  rationale: نقل مباشر وطبيعي لفعل الإرسال ووجهته.
- source_word: καλούμενον
  choice: المدعو
  rationale: تعبير عربي موجز وطبيعي يحفظ معنى الاسم الذي كان يُعرف به يهوذا.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: وهما من الرجال الذين كانوا يتولّون القيادة بين الإخوة
  rationale: ينقل وظيفة القيادة المعترف بها من غير تحويلها بالضرورة إلى لقب منصبي رسمي، ويزيل في العربية احتمال تعلق الوصف بسيلا وحده.
- source_word: ἀδελφοῖς
  choice: الإخوة
  rationale: يحفظ الصيغة المذكرة في الأصل، مع بيان احتمال دلالتها الجماعية الأوسع في الحاشية.
theological_decisions:
- issue: مدى مشاركة الكنيسة كلها في القرار
  choice: إدراج الكنيسة كلها مع الرسل والشيوخ في الرأي والاختيار والإرسال
  alternative: أن يكون الرسل والشيوخ وحدهم أصحاب القرار، والكنيسة حاضرة فحسب
  rationale: العبارة σὺν ὅλῃ τῇ ἐκκλησίᾳ تُدخل الكنيسة كلها على نحو طبيعي في الفعل، مع تجنب استنتاج نظام كنسي تفصيلي لا يصرح به النص.
- issue: دلالة ἀδελφοῖς من جهة الشمول
  choice: الإخوة في المتن، مع توضيح الدلالة الجماعية المحتملة في الحاشية
  alternative: الإخوة والأخوات أو المؤمنون
  rationale: يحفظ المتن الصيغة النحوية المذكرة، بينما تمنع الحاشية فهمها على أنها تستبعد النساء بالضرورة.
- issue: طبيعة قيادة يهوذا وسيلا
  choice: كانا يتولّيان القيادة بين الإخوة
  alternative: كانا قائدين رسميين بين الإخوة
  rationale: يحفظ الوصف الوظيفي في ἡγουμένους من غير الجزم بأنه اسم منصب كنسي تقني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «رأى ... أن» بدل صيغة حرفية ثقيلة، وحُفظت مشاركة الكنيسة كلها، كما حُفظت الصيغة المذكرة في «الإخوة» مع توضيح مداها المحتمل في الحاشية.
