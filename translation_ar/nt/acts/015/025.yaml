lexical_decisions:
- source_word: ἔδοξεν ἡμῖν
  choice: رأينا
  rationale: تعبير عربي طبيعي ينقل حكم الجماعة بعد التشاور، من غير أن يحوّله إلى صيغة أمر أو أن يبالغ في دلالته الأخلاقية.
- source_word: γενομένοις ὁμοθυμαδόν
  choice: بعد أن اتفقنا جميعًا
  rationale: ينقل اسم الفاعل معنى الوصول إلى الاتفاق، وينقل الظرف معنى وحدة الرأي الجماعية بعبارة عربية واضحة.
- source_word: ἐκλεξαμένοις
  choice: أن نختار
  rationale: رُبط باصطلاح الإرسال في تركيب مصدري عربي سلس، مع الحفاظ على كون الاختيار سابقًا للإرسال من حيث المنطق.
- source_word: ἄνδρας
  choice: رجالًا
  rationale: اللفظة اليونانية تدل هنا تحديدًا على رجال بالغين، وهم يهوذا وسيلا في السياق اللاحق، فلا تُعمَّم إلى «أشخاص».
- source_word: πέμψαι πρὸς ὑμᾶς
  choice: ونرسلهم إليكم
  rationale: الضمير يعود بوضوح إلى الرجال المختارين، وإظهاره لازم لسلاسة العربية ولا يضيف معنى جديدًا.
- source_word: σὺν
  choice: مع
  rationale: تفيد المصاحبة المباشرة بأوجز تعبير عربي طبيعي.
- source_word: τοῖς ἀγαπητοῖς ἡμῶν
  choice: حبيبَينا
  rationale: تحافظ على حرارة وصف المحبة وكرامته، كما يبيّن التثنية أن الوصف يعود إلى برنابا وبولس كليهما.
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: برنابا وبولس
  rationale: نقل الاسمين وفق الصيغة العربية الكتابية الشائعة.
theological_decisions:
- issue: نبرة المداولة الجماعية في رسالة أورشليم
  choice: رأينا
  alternative: قرّرنا؛ كان قرارنا
  rationale: الصياغة المختارة تنقل الاستحسان والحكم الجماعي اللذين تفيدهما بنية δοκέω، من غير أن تُدخل في العبارة درجة من السلطة أو الإلزام لا يصرّح بها هذا الجزء من النص.
- issue: طبيعة اتفاق الجماعة
  choice: بعد أن اتفقنا جميعًا
  alternative: إذ كنا على رأي واحد؛ وقد أجمعنا الرأي
  rationale: تحافظ الصياغة على دلالة الوصول إلى الوحدة التي يحملها γενομένοις، ولا تفترض تفاصيل لاهوتية إضافية عن كيفية اتخاذ القرار.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وكريمة. حُفظت النبرة التداولية الجماعية، واستُخدمت «حبيبَينا» بالتثنية لتجنب التباس مرجع الوصف.
