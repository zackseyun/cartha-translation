  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: ar
  text: ولم يفرِّق إطلاقًا بيننا وبينهم، إذ طهَّر قلوبهم بالإيمان[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عن طريق الإيمان». يمكن لحالة الداتيف في اليونانية أن تدل على الوسيلة أو الأداة.'
