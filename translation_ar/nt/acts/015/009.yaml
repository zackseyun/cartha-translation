lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: لم يفرِّق في شيء
  rationale: ينقل التعبير اليوناني بمعنى أنه لم يجعل أي تمييز، ويحافظ «في شيء» على قوة οὐθέν بدل الاكتفاء بنفي عام.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: بيننا وبينهم
  rationale: صياغة عربية طبيعية ودقيقة لتركيب المقابلة بين الجماعتين، ولا يلزم تمثيل τε ... καὶ بأكثر من تكرار «بين».
- source_word: τῇ πίστει
  choice: بالإيمان
  rationale: تحمل الباء معنى الوسيلة على نحو طبيعي، مع إبقاء «الإيمان» المقابل المعتاد لـ πίστις دون زيادة تفسيرية.
- source_word: καθαρίσας
  choice: إذ طهَّر
  rationale: ينقل اسم الفاعل الماضي بوصفه فعلاً مصاحبًا أو مفسرًا لعدم التفريق، من غير الجزم بعلاقة زمنية أدق مما يتيحه الأصل.
- source_word: τὰς καρδίας αὐτῶν
  choice: قلوبهم
  rationale: يحافظ على صورة «القلوب» بوصفها مركز الإنسان الباطني، وعلى عود الضمير إلى الأمم في السياق.
theological_decisions:
- issue: دلالة πίστις
  choice: الإيمان
  alternative: الثقة أو الأمانة
  rationale: السياق هنا يلائم المعنى المعتاد «الإيمان»، ولا يفرض معنى «الأمانة» ولا يحدد مضافًا إليه محذوفًا.
- issue: العلاقة الدلالية لاسم الفاعل καθαρίσας بالفعل الرئيس
  choice: إذ طهَّر
  alternative: بعدما طهَّر / مطهِّرًا
  rationale: «إذ» تبقي مجالًا لأن يكون التطهير فعلًا مصاحبًا يبيّن كيفية عدم التفريق أو أساسه، بدل حصر التركيب في التعاقب الزمني وحده.
translation_notes:
  register: فصحى معاصرة واضحة وموقرة. استُعمل «يفرِّق في شيء» لتجنب إيحاء «يميّز» الإيجابي الممكن في العربية، ووُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
