  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: ar
  text: 'وبعد بضعة أيام، قال بولس لبرنابا: «لنرجع الآن ونزور الإخوة[a] في كل مدينة أعلنا فيها كلمة الرب، ونرى كيف حالهم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات»؛ فاليونانية تقول «الإخوة»، وقد تستعمل صيغة المذكر للدلالة على جماعة المؤمنين كلها.
    reason: بيان البديل المعجمي واحتمال الدلالة الشاملة للفظ المذكر اليوناني.
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: وبعد أيام
  rationale: تفيد μετά مع تعبير زمني في حالة النصب زمنًا لاحقًا، وتُبقي «أيام» المدة غير محددة من غير مبالغة في تقدير طولها.
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: قال بولس لبرنابا
  rationale: صياغة عربية طبيعية ومباشرة تحدد بولس متكلمًا وبرنابا مخاطبًا.
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: لنرجع الآن ونزور
  rationale: يرتبط اسم الفاعل اليوناني بالفعل الحثّي الذي يليه، فصيغ الاثنان في العربية بوصفهما اقتراحًا مشتركًا. وتنقل «الآن» القوة التداولية لـ δή، بينما تعبّر «نزور» عن الذهاب إليهم للاطمئنان على حالهم دون إضافة معنى غير منصوص عليه.
- source_word: τοὺς ἀδελφοὺς
  choice: الإخوة
  rationale: يحافظ على اللفظ العائلي المذكر في اليونانية، مع بيان احتمال شموله جماعة المؤمنين من الرجال والنساء في الحاشية.
- source_word: κατὰ πόλιν πᾶσαν
  choice: في كل مدينة
  rationale: ينقل المعنى التوزيعي للتركيب، أي المدن التي سبق أن خدموا فيها مدينةً فمدينة.
- source_word: ἐν αἷς κατηγγείλαμεν
  choice: نادينا فيها
  rationale: يعبر «نادينا» عن الإعلان العلني الذي يدل عليه καταγγέλλω، بلغة عربية واضحة ومألوفة.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: بكلمة الرب
  rationale: يحافظ على التعبير الكتابي المباشر وعلى إضافة الكلمة إلى الرب، من غير حصرها تفسيرًا في معنى واحد.
- source_word: πῶς ἔχουσιν
  choice: ونرى كيف حالهم
  rationale: ينقل الاصطلاح اليوناني الدال على السؤال عن حالتهم، ويحافظ على عطفه على فعل الزيارة.
theological_decisions:
- issue: دلالة ἀδελφοί على جماعة يُحتمل أن تضم رجالًا ونساءً
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: أُبقي اللفظ العائلي المذكر الموافق لصيغة المصدر، مع حفظ احتمال الدلالة الشاملة في حاشية بدل حسمه داخل المتن.
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: «الرب» هو المقابل العربي المألوف والدقيق في هذا السياق لعبارة «كلمة الرب»، ويحفظ دلالتها اللاهوتية من غير شرح زائد.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. وُضع مؤشر الحاشية بعد «الإخوة» لأن الحاشية تشرح هذا اللفظ، لا التعبير الزمني في أول الآية.
