  source_fidelity: 'الترجمة تنقل عناصر القائمة اليونانية بأمانة: الامتناع عن ما ذُبح للأوثان، والدم، والمخنوق، والفجور الجنسي. كما أن «إن حفظتم أنفسكم من هذه الأمور، فحسنًا تفعلون» تمثل على نحو طبيعي البناء الاشتراطي الناتج من اسم الفاعل διατηροῦντες ومعنى εὖ πράξετε، وتحافظ «دمتم بخير» على وظيفة ἔρρωσθε الختامية في الرسائل.'
