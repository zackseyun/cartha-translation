id: ACT.15.29
reference: Acts 15:29
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: ar
  text: أن تمتنعوا عمّا ذُبح للأوثان[a]، وعن الدم، وعن المخنوق[b]، وعن الفجور الجنسي[c]. إن حفظتم أنفسكم من هذه الأمور، فحسنًا تفعلون. دمتم بخير[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عمّا قُدِّم ذبيحةً للأوثان».'
    reason: lexical_alternative
  - marker: b
    text: 'أي: الحيوان المخنوق، أو لحم الحيوان الذي قُتل خنقًا.'
    reason: lexical_alternative
  - marker: c
    text: يمكن أن يدل اللفظ اليوناني على الفجور الجنسي بوجه عام، ويرى بعض المفسرين أنه يشير هنا على نحو أخص إلى علاقات أو زيجات محرمة في ضوء أحكام سفر اللاويين.
    reason: alternative_reading
  - marker: d
    text: 'أو: «وداعًا». والعبارة اليونانية صيغة تقليدية في ختام الرسائل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: أن تمتنعوا
  rationale: ينقل صيغة المصدر التي تبيّن مضمون الوصية بعبارة عربية واضحة ومباشرة.
- source_word: εἰδωλοθύτων
  choice: عمّا ذُبح للأوثان
  rationale: يحافظ على الدلالة الشعائرية للفظ اليوناني، ويشمل الطعام أو الذبائح المقدَّمة للأوثان من غير تقييد زائد.
- source_word: αἵματος
  choice: عن الدم
  rationale: ترجمة موجزة ومباشرة، إذ يذكر النص اليوناني الدم بلا إضافة تفسيرية.
- source_word: πνικτῶν
  choice: عن المخنوق
  rationale: ينقل الصفة المستعملة استعمال الاسم، أي الحيوان المقتول خنقًا؛ وتوضح الحاشية إمكان فهمها بمعنى لحم المخنوق.
- source_word: πορνείας
  choice: عن الفجور الجنسي
  rationale: تعبير عربي معاصر يحفظ المعنى الواسع المحتمل ولا يقصر اللفظ على خطيئة جنسية بعينها.
- source_word: ἐξ ὧν
  choice: من هذه الأمور
  rationale: يصرّح بمرجع العبارة، وهو المحظورات المذكورة في القائمة.
- source_word: διατηροῦντες ἑαυτούς
  choice: إن حفظتم أنفسكم
  rationale: يصوغ اسم الفاعل اليوناني في تركيب شرطي عربي طبيعي، مع إبقاء معنى صون النفس والابتعاد عن المذكورات.
- source_word: εὖ πράξετε
  choice: فحسنًا تفعلون
  rationale: 'يحفظ العبارة التقويمية الموجزة: يكون امتثالهم عملًا حسنًا وصائبًا، من غير تحويلها إلى وعد بالازدهار.'
- source_word: ἔρρωσθε
  choice: دمتم بخير
  rationale: ينقل وظيفة الصيغة بوصفها خاتمة رسائل تقليدية، مع الاحتفاظ بصدى معنى العافية أكثر من عبارة وداع محضة.
theological_decisions:
- issue: دلالة πορνεία في قرار الرسل
  choice: الفجور الجنسي بمعناه العام
  alternative: الزنى، أو الزيجات/العلاقات المحرمة في ضوء لاويين 18
  rationale: لا يضيّق النص نفسه مدلول المصطلح إلى مخالفة محددة، ولذلك تُحفظ سعته في المتن ويُذكر الفهم الأضيق في الحاشية.
- issue: قوة εὖ πράξετε
  choice: فحسنًا تفعلون
  alternative: تفعلون الصواب، أو تكونون بخير/تفلحون
  rationale: السياق يحتمل معنى الاستحسان الأخلاقي أو العملي، والترجمة المختارة لا تحوّل العبارة إلى وعد مادي أو صحي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة وموجزة. استُعمل «ما ذُبح للأوثان» بدل إضافة «الطعام» في المتن للمحافظة على اتساع الصيغة اليونانية، ووُضعت جميع بدائل المعنى المهمة في حواشٍ تحمل علاماتها في المتن.
