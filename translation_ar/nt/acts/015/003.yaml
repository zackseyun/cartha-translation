revisions:
- from: وهكذا، بعدما شيَّعتهم الكنيسة في طريقهم، أخذوا يجتازون فينيقية والسامرة، ويروون بالتفصيل اهتداء غير اليهود[a]، فكانوا يبعثون فرحًا عظيمًا في جميع الإخوة[b].
  to: فهؤلاء، بعدما شيَّعتهم الكنيسة في طريقهم، ساروا عبر فينيقية والسامرة، يروون بالتفصيل اهتداء غير اليهود[a]، وكانوا يبعثون فرحًا عظيمًا في نفوس جميع الإخوة[b].
  rationale: تزيل المراجعة إيحاء الشروع غير المقصود في «أخذوا يجتازون»، وتستبدل به وصفًا طبيعيًا لمسار السفر. كما تُصلح موضع الفرح في التركيب العربي ليكون في «نفوس» الإخوة، مع الإبقاء على السببية والاستمرار اللذين يفيدهما النص. وتُحسَّن الحاشية المعجمية لتكون مفهومة ومتسقة مع المتن من غير تضييق أو تفسير زائد.
