  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: ar
  text: فهؤلاء، بعدما شيَّعتهم الكنيسة في طريقهم، ساروا عبر فينيقية والسامرة، يروون بالتفصيل اهتداء غير اليهود[a]، وكانوا يبعثون فرحًا عظيمًا في نفوس جميع الإخوة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تحوُّل غير اليهود».'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن «الإخوة» هنا تشمل المؤمنين عمومًا، بمن فيهم النساء.
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: بعدما شيَّعتهم الكنيسة في طريقهم
  rationale: يفيد الفعل أن الكنيسة ودّعتهم وساعدتهم على متابعة الرحلة، لا مجرد أنها أصدرت أمرًا بإرسالهم. وتحافظ الصياغة على دلالة المصاحبة أو الإعانة من غير تحديد صورتها.
- source_word: ἐκκλησίας
  choice: الكنيسة
  rationale: يشير اللفظ هنا إلى جماعة المؤمنين المسيحية، و«الكنيسة» هي المقابل العربي الواضح والمألوف في هذا السياق.
- source_word: διήρχοντο
  choice: أخذوا يجتازون
  rationale: تنقل الصياغة دلالة الماضي الناقص على السفر المتواصل عبر المنطقتين ضمن سياق الرواية.
- source_word: τήν τε Φοινίκην καὶ Σαμάρειαν
  choice: فينيقية والسامرة
  rationale: يربط النص المنطقتين في مسار واحد. وأسماء المواضع منقولة بصيغتها العربية المعيارية، ولا تحتاج العربية إلى تركيب ثقيل يقابل τε ... καί حرفيًا.
- source_word: ἐκδιηγούμενοι
  choice: يروون بالتفصيل
  rationale: ينقل هذا التعبير قوة الفعل المركب، الذي يدل على رواية الخبر بإسهاب أو بصورة وافية.
- source_word: ἐπιστροφὴν
  choice: اهتداء
  rationale: يدل الاسم في السياق على تحوّل غير اليهود إلى الله استجابةً للبشارة. و«اهتداء» تعبير عربي طبيعي ذو دلالة دينية واضحة، مع إبقاء المعنى الحرفي «الرجوع» في الحاشية.
- source_word: τῶν ἐθνῶν
  choice: غير اليهود
  rationale: المقصود في سياق أعمال 15 الشعوب غير اليهودية في مقابل المؤمنين من اليهود. وهذه الصياغة أوضح للقارئ العربي المعاصر من «الأمم» من غير أن تغيّر هوية المرجع.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: كانوا يبعثون فرحًا عظيمًا
  rationale: صياغة عربية طبيعية تحفظ المعنى السببي للتعبير اليوناني، أي إن أخبارهم أحدثت فرحًا عظيمًا.
- source_word: ἀδελφοῖς
  choice: الإخوة
  rationale: تحافظ على صورة الجمع المذكر في الأصل، بينما توضّح الحاشية أن الاستعمال قد يشمل جماعة المؤمنين عمومًا، بمن فيهم النساء.
theological_decisions:
- issue: دلالة ἐπιστροφή في خبر دخول غير اليهود إلى جماعة المؤمنين
  choice: اهتداء غير اليهود
  alternative: رجوع الأمم
  rationale: «اهتداء» يبيّن أن الحديث عن تحوّل ديني إلى الله من غير تحميل اللفظ مذهبًا تقنيًا لاحقًا، والحاشية تحفظ الصورة الحرفية القائمة على معنى الرجوع.
- issue: مدى شمول ἀδελφοί في سياق الجماعة المسيحية
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: أُبقيت الصيغة المذكرة التي يتخذها الأصل، مع توضيح احتمال شمولها الرجال والنساء في الحاشية بدل حسم هذا الاحتمال داخل المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت أفعال السرد المتتابع «أخذوا يجتازون» و«كانوا يبعثون» لإظهار الاستمرار في صيغ الماضي اليونانية، مع تجنّب الحرفية الثقيلة والمصطلحات الطائفية.
