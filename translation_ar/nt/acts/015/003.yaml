    rationale: هي ممكنة حرفيًا، لكنها أقل اتساقًا مع المصطلح الرئيس «غير اليهود»، وقد توحي بـ«الأمم» بمعناها السياسي الحديث. «تحوّل غير اليهود» بديل عربي واضح يحفظ المجال الدلالي للحاشية الإنجليزية.
