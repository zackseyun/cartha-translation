    rationale: يفيد «أخذوا» عادةً الشروع في الفعل، في حين أن διήρχοντο تصف سيرهم/مرورهم عبر المنطقتين في سياق الرحلة، من غير تأكيد على بدايتها.
  - severity: medium
    issue: «يبعثون فرحًا عظيمًا في جميع الإخوة»
    rationale: التركيب غير طبيعي في العربية؛ يُقال «يبعثون فرحًا ... في نفوس جميع الإخوة». وهذا يحافظ على المعنى السببي لـ ἐποίουν χαρὰν μεγάλην.
  - severity: low
