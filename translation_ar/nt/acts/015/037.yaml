  text: But Barnabas wanted to take along also John[a], who was called Mark.
translation:
  language: ar
  text: أما برنابا، فكان يريد أن يصطحب معه أيضًا يوحنا المدعو مرقس.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يوحنا، الذي يُدعى أيضًا مرقس».'
    reason: بديل لغوي يبيّن أن العبارة قد تُصاغ في العربية بوصف مرقس اسمًا آخر ليوحنا.
lexical_decisions:
- source_word: Βαρναβᾶς δὲ
  choice: أما برنابا فـ
  rationale: ينقل δὲ بوصفها أداة انتقال ذات مسحة مقابلة في السياق، وتؤدي صيغة «أما... فـ» ذلك طبيعيًا في العربية من غير مبالغة في حدة التعارض.
- source_word: ἐβούλετο
  choice: كان يريد
  rationale: ينقل معنى الإرادة أو الرغبة، كما تعكس صيغة «كان يريد» دلالة الماضي الناقص في السياق السردي.
- source_word: συμπαραλαβεῖν
  choice: أن يصطحب معهما
  rationale: الفعل المركب يدل على أخذ شخص ليكون في الصحبة؛ وضمير التثنية المستفاد من السياق يوضح أن يوحنا سيصحب برنابا وبولس.
- source_word: καὶ
  choice: أيضًا
  rationale: يحفظ القوة الإضافية للكلمة اليونانية المرتبطة بالمفعول به.
- source_word: Ἰωάννην
  choice: يوحنا
  rationale: الصيغة العربية الكتابية المألوفة للاسم العلم.
- source_word: τὸν καλούμενον Μᾶρκον
  choice: المدعو مرقس
  rationale: ترجمة موجزة وطبيعية للعبارة الوصفية، وتحفظ كون مرقس اسمًا يُدعى به يوحنا من غير إدخال «أيضًا» في العبارة نفسها.
