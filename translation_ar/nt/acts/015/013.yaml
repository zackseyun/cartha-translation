  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: ar
  text: 'وبعد أن سكتوا[a]، أجاب يعقوب قائلًا: «أيها الرجال الإخوة[b]، اسمعوا لي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعد أن كفّوا عن الكلام». تشير العبارة اليونانية إلى الوقت الذي انتهى فيه المتكلمون السابقون من كلامهم.'
    reason: lexical_alternative
  - marker: b
    text: 'يتألف النداء في اليونانية من لفظين مذكّرين: «رجال» و«إخوة»، وهو نداء رسمي للمجتمعين.'
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: وبعد أن سكتوا
  rationale: تفيد صيغة μετά مع المصدر المعرّف الزمن اللاحق، أي «بعد أن». ويدل σιγάω هنا على الصمت أو التوقف عن الكلام؛ وصياغة «بعد أن سكتوا» عربية طبيعية وتحفظ تعاقب الأحداث.
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: الفعل يعني أجاب أو ردّ، و«أجاب» يلائم سياق المداولة بعد انتهاء المتكلمين السابقين.
- source_word: Ἰάκωβος
  choice: يعقوب
  rationale: نُقل الاسم اليوناني Ἰάκωβος وفق صورته العربية الكتابية المألوفة «يعقوب».
- source_word: λέγων
  choice: قائلًا
  rationale: اسم الفاعل يمهّد للكلام المباشر، و«قائلًا» يحفظ بنية الأصل في عربية فصيحة طبيعية.
- source_word: Ἄνδρες ἀδελφοί
  choice: أيها الإخوة
  rationale: العبارة نداء مذكّر حرفيًا «أيها الرجال الإخوة»، لكن هذا التركيب ثقيل وغير مألوف بالعربية. «أيها الإخوة» ينقل النداء الرسمي الطبيعي، مع بيان وجود اللفظين المذكرين في الحاشية.
- source_word: ἀκούσατέ μου
  choice: اسمعوا لي
  rationale: صيغة الأمر تطلب الإصغاء باهتمام. و«اسمعوا لي» موجزة وتحفظ تعلق الضمير بالمتكلم دون توسيع المعنى.
theological_decisions:
- issue: صيغة النداء المذكرة في خطاب الاجتماع
  choice: أيها الإخوة في المتن، مع توضيح الصيغة الحرفية في الحاشية
  alternative: أيها الرجال الإخوة
  rationale: يحتوي الأصل على مناديين مذكرين، ἄνδρες وἀδελφοί. يحفظ المتن وظيفة النداء وصيغته المذكرة في عربية طبيعية، بينما تمنع الحاشية ضياع التفصيل اللفظي ولا توسّع الخطاب إلى «الإخوة والأخوات» من غير سند صريح في العبارة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ تسلسل الجملة اليونانية من غير تكلّف، واستُعمل النداء العربي الطبيعي مع توثيق الصيغة الحرفية في الحاشية.
