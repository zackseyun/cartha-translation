base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: ar
  text: فإن موسى، منذ أجيال قديمة، له في كل مدينة من ينادون به[a]، إذ يُقرأ في المجامع كل سبت.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «موسى... من ينادون به... يُقرأ». ويأتي اسم «موسى» هنا مجازًا للدلالة على كتاباته أو الشريعة المرتبطة به.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: موسى
  rationale: الصيغة العربية المعيارية للاسم، مع إبقاء الإشارة الشخصية التي يستخدمها النص مجازًا للدلالة على ما يرتبط بموسى من كتابات أو شريعة.
- source_word: γὰρ
  choice: فلأن
  rationale: تفيد تعليل الحكم السابق، و«فلأن» توصل الارتباط التفسيري والسببي بسياقه.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: منذ أجيال قديمة
  rationale: تعبير زمني يحفظ صورة الأجيال وصيغة الجمع، ويؤدي معنى الاستمرار منذ زمن بعيد.
- source_word: κατὰ πόλιν
  choice: في كل مدينة
  rationale: ينقل المعنى التوزيعي لحرف الجر κατά مع الاسم المفرد بلغة عربية طبيعية.
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: من ينادون به
  rationale: «ينادون» تؤدي معنى الإعلان العلني في κηρύσσω، والضمير في «به» يبقي المجاز الأصلي الذي يجعل موسى نفسه موضوع النداء.
- source_word: ἔχει
  choice: له
  rationale: يحافظ على المضارع اليوناني الدال على حالة قائمة، بينما يعبّر «منذ أجيال قديمة» عن امتدادها الزمني.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: في المجامع
  rationale: التعبير العربي المألوف لموضع القراءة اليهودية المنتظمة.
- source_word: κατὰ πᾶν σάββατον
  choice: كل سبت
  rationale: ينقل التكرار التوزيعي المنتظم بإيجاز ووضوح.
- source_word: ἀναγινωσκόμενος
  choice: إذ يُقرأ
  rationale: يحفظ البناء للمجهول والإحالة المجازية إلى موسى، ويترك علاقة الحال أو التفسير مرنة دون تشديد السببية.
theological_decisions:
- issue: الإشارة المجازية إلى موسى
  choice: الإبقاء على «موسى» والضمير العائد إليه بدل إحلال «شريعة موسى» أو «كتب موسى» في المتن.
  alternative: فلأن شريعة موسى، منذ أجيال قديمة، لها في كل مدينة من ينادون بها...
  rationale: النص اليوناني يذكر موسى والضمير العائد إليه صراحة، مستعملًا اسمه مجازًا لما يُقرأ من كتاباته أو شريعته. إبقاء ذلك يصون صياغة المصدر ولا يحوّل التفسير إلى جزء من المتن.
- issue: علاقة اسم الفاعل ἀναγινωσκόμενος بما قبله
  choice: «إذ يُقرأ»
  alternative: «لأنه يُقرأ» أو «وهو يُقرأ»
  rationale: الصياغة المختارة تحفظ المرونة بين الدلالة الحالية والتفسيرية، ولا تحسمها على أنها سببية صريحة مع أن السياق قد يسمح بذلك.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ المجاز الشخصي في الأصل، واستُخدمت «ينادون به» لتجنب الإيحاء بأن المقصود هو الوعظ عن شخص موسى وحده، مع شرح المجاز في الحاشية.
