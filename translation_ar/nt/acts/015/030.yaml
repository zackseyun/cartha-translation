  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: ar
  text: فأمّا هم، فبعد أن أُذن لهم بالمغادرة[a]، نزلوا إلى أنطاكية[b]، وجمعوا الجماعة[c] وسلّموهم الرسالة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعد أن أُذن لهم بالانصراف»، أو «بعد أن أُطلقوا». قد يدل اللفظ اليوناني على السماح الرسمي لهم بالمغادرة أو إطلاقهم.'
    reason: lexical_alternative
  - marker: b
    text: يحفظ تعبير «نزلوا» الاتجاه الذي يفيده الفعل اليوناني، ويرجّح أنه يشير إلى النزول من أورشليم المرتفعة إلى أنطاكية.
    reason: cultural_note
  - marker: c
    text: 'أو: «الجمهور» أو «الحشد». تشير العبارة إلى المجموعة التي اجتمعت في أنطاكية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: بعد أن صُرفوا
  rationale: اسم المفعول يدل على أنهم أُذن لهم رسميًا بالانصراف من اجتماع أورشليم؛ و«صُرفوا» يحفظ احتمال الإرسال أو إطلاقهم للذهاب دون إضافة فاعل غير مذكور.
- source_word: κατῆλθον
  choice: نزلوا
  rationale: يحفظ المعنى الاتجاهي للفعل، وهو ملائم للنزول جغرافيًا من أورشليم إلى أنطاكية.
- source_word: συναγαγόντες
  choice: وجمعوا
  rationale: ينقل الفعل السابق زمنيًا لتسليم الرسالة بعبارة عربية طبيعية موجزة.
- source_word: τὸ πλῆθος
  choice: الجماعة
  rationale: تشير العبارة هنا إلى مجموع المؤمنين المجتمعين في أنطاكية؛ و«الجماعة» أوضح عربيًا من «الجمهور» ولا تفترض بالضرورة بنية كنسية رسمية.
- source_word: ἐπέδωκαν
  choice: سلّموهم
  rationale: يفيد تقديم الرسالة إلى الجماعة وتسليمها إليهم رسميًا، والضمير يوضح المتلقي المفهوم من السياق.
- source_word: ἐπιστολήν
  choice: الرسالة
  rationale: المقابل العربي الحديث الطبيعي للنص المكتوب المرسل، دون استعمال لفظ كنسي متكلّف.
