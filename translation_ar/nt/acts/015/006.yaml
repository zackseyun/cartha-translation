  text: Συνήχθησάν ⸀τε οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: ar
  text: فاجتمع[a] الرسل والشيوخ للنظر في هذه المسألة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «انعقد اجتماع الرسل والشيوخ» أو «جُمِع الرسل والشيوخ». الفعل اليوناني مبنيّ للمجهول من حيث الصيغة، لكنه يُستعمل هنا للدلالة على اجتماع الجماعة.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «ليروا بشأن هذا القول». والمقصود بـ«القول» هنا الأمر أو القضية موضع البحث.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: اجتمع
  rationale: الفعل اليوناني مبنيّ للمجهول من حيث الصيغة، لكنه يُستعمل هنا استعمالًا طبيعيًا للدلالة على انعقاد الجماعة؛ و«اجتمع» تعبير عربي واضح يحفظ المعنى الجماعي من غير تكلّف.
- source_word: τε
  choice: فـ
  rationale: تفيد الأداة صلة خفيفة بالسياق السابق وتتابع الحدث؛ والفاء العربية تنقل هذا الارتباط بإيجاز وطبيعية.
- source_word: ἀπόστολοι
  choice: الرسل
  rationale: المقصود قادة الجماعة المعروفون بصفتهم رسلًا، و«الرسل» هو المقابل العربي الراسخ والدقيق في هذا السياق.
- source_word: πρεσβύτεροι
  choice: الشيوخ
  rationale: تدل الكلمة هنا على قادة معترف بهم في الجماعة، لا على كبار السن فحسب؛ و«الشيوخ» تحافظ على الدلالة التاريخية من غير فرض بنية كنسية لاحقة.
- source_word: ἰδεῖν
  choice: للنظر في
  rationale: المعنى الحرفي هو «أن يروا»، لكن الاستعمال هنا تداولي يفيد فحص القضية والتداول فيها؛ و«النظر في» عربي طبيعي ويحفظ طابع البحث من غير استباق القرار.
- source_word: περὶ τοῦ λόγου τούτου
  choice: في هذه المسألة
  rationale: يمكن أن تعني λόγος «كلمة» أو «قولًا» أو «أمرًا/مسألة»؛ والسياق يشير إلى القضية المختلف عليها، لذلك تنقل «هذه المسألة» المعنى المقصود بوضوح.
theological_decisions:
- issue: الدلالة المؤسسية لكلمة πρεσβύτεροι في اجتماع أورشليم
  choice: الشيوخ
  alternative: القسوس بوصفها تسمية تقنية لمنصب كنسي متأخر
  rationale: يحدد النص قادة معترفًا بهم في جماعة أورشليم، لكنه لا يفرض تفاصيل نظام كنسي تطور في عصور لاحقة؛ لذلك تحافظ «الشيوخ» على الدلالة من غير تخصيص مذهبي.
- issue: غرض الاجتماع التداولي
  choice: للنظر في هذه المسألة
  alternative: للبتّ في هذه المسألة
  rationale: يشير المصدر ἰδεῖν إلى تناول القضية بالفحص والنظر. أما «البتّ» فيستبق نتيجة الإجراء ويجعل القرار محسومًا في هذه المرحلة من السرد.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت الفاء لربط الحدث بالسياق السابق، و«النظر في» للحفاظ على معنى التداول والفحص، مع تجنب المصطلحات الطائفية أو الإدارية اللاحقة.
