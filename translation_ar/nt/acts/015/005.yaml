base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: ar
  text: 'لكن قام بعضٌ من جماعة الفريسيين[a] الذين كانوا قد آمنوا، وقالوا: «يجب أن يُختنوا، وأن يُؤمروا بحفظ شريعة موسى».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من طائفة الفريسيين». تدل الكلمة اليونانية هنا على جماعة أو تيار معروف، لا بالضرورة على «هرطقة» بالمعنى الاصطلاحي المتأخر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: قام
  rationale: ينقل فعل النهوض في سياق الاجتماع، حيث قاموا ليتكلموا، من غير إضافة معنى المجابهة أو الاحتجاج.
- source_word: τινες
  choice: بعض
  rationale: مقابل عربي طبيعي للضمير الجمع غير المحدد، من غير إضافة لفظ «رجال» غير المصرح به.
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: الذين من جماعة الفريسيين
  rationale: يدل αἵρεσις هنا على جماعة أو تيار معروف، لا على «هرطقة» بالمعنى الاصطلاحي المتأخر.
- source_word: πεπιστευκότες
  choice: وكانوا قد آمنوا
  rationale: يحفظ دلالة اسم الفاعل التام على إيمان حدث سابقًا وبقيت حالته قائمة، كما يصون التوتر السردي واللاهوتي في النص.
- source_word: λέγοντες
  choice: وقالوا
  rationale: صياغة عربية طبيعية تربط قيامهم بمضمون كلامهم، من غير تقوية النبرة إلى «أصرّوا» أو «أعلنوا».
- source_word: δεῖ
  choice: يجب
  rationale: ينقل معنى الضرورة بوضوح، مع إبقاء مصدر هذا الإلزام ضمنيًا كما في اليونانية.
- source_word: περιτέμνειν αὐτούς
  choice: أن يُختنوا
  rationale: المبني للمجهول هو التعبير العربي الطبيعي عن إخضاعهم للختان، ويحفظ كون العائد موجّهًا إلى الأمم المذكورين في السياق.
- source_word: παραγγέλλειν
  choice: أن يُؤمروا
  rationale: يحفظ القوة السلطوية للفعل، ويبيّن طبيعيًا في العربية أن المطلوب إصدار أمر لهم.
- source_word: τε τηρεῖν
  choice: بحفظ
  rationale: «حفظ الشريعة» تعبير عربي واضح يفيد مراعاتها والعمل بها، والربط بالباء يلائم الفعل «يُؤمروا».
- source_word: τὸν νόμον Μωϋσέως
  choice: شريعة موسى
  rationale: ترجمة عربية مألوفة ومباشرة للتركيب الإضافي، وتناسب دلالة νόμος في هذا السياق الديني والتشريعي.
theological_decisions:
- issue: دلالة αἵρεσις في سياق جماعة يهودية
  choice: جماعة
  alternative: طائفة
  rationale: «جماعة» توضح الانتماء إلى تيار معروف داخل اليهودية وتتجنب الإيحاء السلبي أو معنى الهرطقة المتأخر؛ وتبقى «طائفة» بديلًا معجميًا ممكنًا.
- issue: قوة πεπιστευκότες
  choice: وكانوا قد آمنوا
  alternative: وكانوا مؤمنين
  rationale: الصياغة الفعلية تحفظ دلالة التمام وتعرض صراحة أنهم آمنوا مع استمرار مطالبتهم بختان الأمم وحفظ الشريعة، من غير تسوية هذا التوتر.
- issue: العلاقة بين الختان والأمر بحفظ الشريعة
  choice: 'مطلبان مترابطان: أن يُختنوا وأن يُؤمروا بحفظ الشريعة'
  alternative: اعتبار حفظ الشريعة شرحًا للختان وحده
  rationale: وجود τε وعطفي المصدرين يدعم عرض مطلبين مرتبطين من غير دمجهما أو جعل أحدهما مجرد تفسير للآخر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «جماعة» في المتن لتجنب الدلالة الطائفية السلبية المحتملة، مع إثبات «طائفة» في الحاشية. وُضع مؤشر الحاشية [a] في المتن بعد الجملة.
