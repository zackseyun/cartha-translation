revisions:
- from: أمّا بولس فكان يرى بإصرار ألّا يصطحبا معهما هذا الرجل[a]، الذي فارقهما في بمفيلية ولم يرافقهما إلى العمل.
  to: أمّا بولس فكان يرى بإصرار ألّا يصطحبا معهما هذا الرجل[a]، الذي انفصل عنهما من بمفيلية ولم يرافقهما إلى العمل.
  rationale: عُدّلت العبارة لتفادي التباس الفعل العربي ولإبقاء «من بمفيلية» في المتن، موافقةً لحرف الجر في النص اليوناني. وصححت الحاشية كي لا تحول العبارة إلى معنى زمني («منذ»)، مع حفظ إمكان فهم بمفيلية موضعًا للانفصال وإبقاء الدلالة الأقوى للفعل بديلًا لا في المتن.
  reviewer_model: gpt-5.6-terra
