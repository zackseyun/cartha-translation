  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: ar
  text: أمّا بولس فكان يرى بإصرار ألّا يصطحبا معهما هذا الرجل[a]، الذي انفصل عنهما من بمفيلية ولم يرافقهما إلى العمل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي انفصل عنهما في بمفيلية». والعبارة اليونانية حرفيًا: «الذي انفصل عنهم من بمفيلية»؛ وقد يُفهم حرف الجر مع «بمفيلية» على أنه يحدد موضع الانفصال. ويمكن أن يحمل الفعل دلالة أشد، مثل: «الذي تخلّى عنهما».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: كان يرى بإصرار
  rationale: يفيد الماضي الناقص هنا حكم بولس الثابت وإصراره في سياق الخلاف، لا مجرد تفضيل عابر. وهذه الصياغة تحفظ معنى الرأي القوي من غير أن تجعل الفعل قولًا صريحًا.
- source_word: ἀποστάντα
  choice: فارقهما
  rationale: اسم الفاعل من ἀφίσταμαι يدل على الابتعاد أو المفارقة. «فارقهما» عربية طبيعية تحفظ أصل الواقعة ولا تستبق الحكم الأشد، مثل «تخلّى عنهما».
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: فارقهما في بمفيلية
  rationale: تفهم العبارة الأولى على أنها انفصال عن بولس وبرنابا، والثانية على أنها الإشارة إلى موضع المفارقة أو نقطة الانطلاق منها؛ و«في بمفيلية» أوضح عربيًا في ضوء رواية أعمال 13:13، مع بيان الاحتمال الحرفي في الحاشية.
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: لم يرافقهما
  rationale: ينقل معنى عدم الذهاب معهما أو مصاحبتهما في الرحلة، بصياغة عربية موجزة وطبيعية.
- source_word: εἰς τὸ ἔργον
  choice: إلى العمل
  rationale: يحافظ على الاسم المعرّف وصورة التوجه إلى المهمة، من غير استبداله بتفسير مثل «الإرسالية».
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: ألّا يصطحبا معهما هذا الرجل
  rationale: المصدر المنفي متعلق بحكم بولس، والمثنى مفهوم من السياق بوصف بولس وبرنابا فاعلي الاصطحاب المقترح. «هذا الرجل» يحفظ قوة اسم الإشارة τοῦτον.
