  source_fidelity: يعبّر «كان يرى بإصرار» عن قوة ἠξίου في الماضي الناقص تعبيرًا مقبولًا، ويؤدي «ألا يصطحبا معهما» وظيفة المصدر المنفي μὴ συμπαραλαμβάνειν. لكن «فارقهما» قد تُفهم عربيًا على نحو ملتبس، و«في بمفيلية» لا تُظهر بوضوح صيغة ἀπὸ Παμφυλίας («من بمفيلية»)، وإن كان السياق يعضد فهمها موضعًا للمفارقة.
