  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: ar
  text: لأننا سمعنا أن بعضًا من بيننا خرجوا وأقلقوكم بكلامهم، مزعزعين نفوسكم[a]، وهم الذين لم نوصهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مزعزعين كيانكم الداخلي»؛ فالمقصود بـ«نفوسكم» ذواتكم من الداخل، لا العواطف وحدها.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الذين لم نأمرهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: لأننا
  rationale: تُظهر الأداة أن ما يلي يبيّن سبب كتابة هذا البيان، وصياغة «لأننا سمعنا» طبيعية وواضحة في العربية.
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: أن بعضًا خرجوا من عندنا
  rationale: تحفظ أصل هؤلاء الأشخاص وخروجهم من جماعة المرسلين، من غير أن توحي بأنهم كانوا مفوَّضين منها.
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: وأقلقوكم بكلامهم
  rationale: تنقل أثر الاضطراب الذي أحدثه كلامهم، مع إظهار الدلالة الآلية لصيغة الجمع λόγοις بأسلوب عربي طبيعي.
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: مزعزعين نفوسكم
  rationale: الفعل النادر ἀνασκευάζω يدل هنا على إحداث خلخلة واضطراب شديدين، و«مزعزعين» يحفظ هذه القوة، بينما «نفوسكم» تحافظ على الشفافية المعجمية لـ ψυχάς من دون حصرها في العواطف.
- source_word: οἷς οὐ διεστειλάμεθα
  choice: مع أننا لم نوصهم بذلك
  rationale: تنفي العبارة أن أولئك الأشخاص تلقّوا توجيهًا أو تكليفًا من جماعة الرسل والشيوخ؛ وإضافة «بذلك» توضح مرجع الوصية في العربية من غير تحديد مضمون غير وارد.
theological_decisions:
- issue: هل يُصرَّح بأن مثيري الاضطراب لم يكونوا مفوَّضين من جماعة أورشليم؟
  choice: مع أننا لم نوصهم بذلك
  alternative: الذين لم نأمرهم
  rationale: ينفي النص اليوناني صراحةً صدور توجيه إليهم. تحافظ الصياغة المختارة على هذا النفي، ولا تضيف حكمًا على مكانتهم يتجاوز النص.
- issue: دلالة «نفوسكم» في العبارة
  choice: نفوسكم
  alternative: كيانكم الداخلي
  rationale: تُبقي الترجمة اللفظ الجامع ψυχή، الذي يشير هنا إلى الأشخاص في باطنهم وحياتهم الداخلية، ولا تحصر المعنى في الذهن أو الانفعال وحدهما.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «خرجوا من عندنا» لحفظ معنى المنشأ والمغادرة، و«مزعزعين نفوسكم» لصون صورة النص وقوة أثر الكلام. صيغت الجملة الأخيرة بـ«مع أننا» لإزالة التباس عود ضمير الوصل في العربية، مع الحفاظ على نفي التفويض من غير تشديد طائفي أو مؤسسي زائد.
