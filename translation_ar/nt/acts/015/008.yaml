  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: ar
  text: والله، العارف بالقلوب[a]، شهد لهم بإعطائهم الروح القدس، كما أعطانا نحن أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: الذي يعرف القلوب.'
    reason: بديل لفظي يحوّل الاسم المركب اليوناني إلى جملة موصولة واضحة.
lexical_decisions:
- source_word: καρδιογνώστης
  choice: العارف بالقلوب
  rationale: اسم مركب نادر يدل على من يعرف القلوب، أي باطن الإنسان. وصيغة «العارف بالقلوب» موجزة وطبيعية في العربية وتحافظ على كونه وصفًا إلهيًا.
- source_word: θεὸς
  choice: الله
  rationale: المقابل العربي المعياري هنا، و«العارف بالقلوب» وصف تابع له.
- source_word: ἐμαρτύρησεν αὐτοῖς
  choice: شهد لهم
  rationale: يحافظ على المعنى الإثباتي للفعل، وعلى الضمير العام «لهم» من غير إدخال تحديد «الأمم» في نص الآية، إذ يُفهم مرجعه من السياق.
- source_word: δοὺς
  choice: بأن أعطاهم
  rationale: يبين أن إعطاء الروح القدس هو الكيفية التي شهد الله بها لهم، مع صياغة عربية واضحة.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: الترجمة العربية المعاصرة المعيارية لهذا اللقب.
- source_word: καθὼς καὶ ἡμῖν
  choice: كما أعطانا نحن أيضًا
  rationale: تستكمل الفعل المحذوف المفهوم في العبارة اليونانية، وتنقل καί بالتوكيد «نحن أيضًا» من غير غموض.
theological_decisions:
- issue: شهادة الله للآخرين بإعطائهم الروح القدس على نحو مماثل لعطائه للمتكلمين
  choice: الإبقاء على الضمير «لهم» وربط الشهادة بإعطاء الروح القدس، كما في اليونانية
  alternative: التصريح بلفظ «للأمم» أو إضافة تفسير عن مكانتهم العهدية
  rationale: اللفظ اليوناني αὐτοῖς ضمير لا يسمّي الأمم صراحة، وإن كان السياق يحددهم؛ لذلك لا تُضاف إلى الآية دلالة تفسيرية أو مذهبية غير منطوقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على الصورة القضائية في «شهد لهم»، وعلى الإيجاز، مع إظهار علاقة الوسيلة في «بأن أعطاهم».
