  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: ar
  text: «لكي يطلب الربَّ مَن بقي من البشر، وجميعُ الأمم[a] التي دُعي عليها اسمي[b]، يقول الرب[c] الذي يصنع هذه الأمور.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني «الأمم» هنا «غير اليهود»؛ فاللفظة اليونانية ἔθνη تحمل المعنيين، وسياق مجمع أورشليم يتناول قبول غير اليهود.
    reason: alternative_reading
  - marker: b
    text: 'أو: «التي تُدعى باسمي». والنص اليوناني يقول حرفيًا: «التي دُعي عليها اسمي»، وهي عبارة تدل على الانتساب إلى الرب.'
    reason: lexical_alternative
  - marker: c
    text: يرد هذا الكلام صدى عاموس 9:12 بحسب صيغة ترد في الأسفار اليونانية، حيث يبرز أن الأمم دُعي عليها اسم الرب.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: لكي
  rationale: تفيد الغاية أو النتيجة المقصودة مع صيغة الاحتمال في الفعل، و«لكي» تؤدي ذلك بوضوح وفصاحة في العربية.
- source_word: ἐκζητήσωσιν
  choice: يطلب
  rationale: الفعل يدل على السعي إلى الرب وطلبه. لم تُضف دلالة التشديد المحتملة في الفعل المركب كي لا يُحمَّل النص أكثر مما يقتضيه السياق.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: بقية البشر
  rationale: تحافظ «بقية» على معنى من تبقوا وعلى الصدى النبوي، بينما تعبّر «البشر» عن الدلالة الإنسانية العامة دون تخصيص الذكور.
- source_word: τὸν κύριον
  choice: الرب
  rationale: الترجمة العربية المألوفة للقب κύριος في سياق الاقتباس النبوي.
- source_word: πάντα τὰ ἔθνη
  choice: جميع الأمم
  rationale: لفظ «الأمم» يحفظ اتساع اللفظة اليونانية، ويمكن في السياق الكتابي أن يشير إلى غير اليهود، فلا تُلغى دلالة «الشعوب/الأمم» الأصلية.
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: التي دُعي اسمي عليها
  rationale: صياغة قريبة من التركيب اليوناني، وتحفظ معنى الانتساب إلى اسم الرب دون اختزاله في مجرد التسمية.
- source_word: λέγει κύριος
  choice: يقول الرب
  rationale: تحافظ على صيغة الإعلان النبوي في الزمن الحاضر.
- source_word: ποιῶν ταῦτα
  choice: الذي يصنع هذه الأمور
  rationale: تجعل اسم الموصول النعت عائدًا بوضوح إلى الرب، وتحفظ دلالة فاعليته المستمرة.
theological_decisions:
- issue: دلالة ἔθνη في سياق قبول غير اليهود
  choice: جميع الأمم
  alternative: جميع غير اليهود
  rationale: «الأمم» تحتفظ بالمعنى النبوي الواسع وبالإمكان السياقي للإشارة إلى غير اليهود، فتتجنب حسم تعدد الدلالة في المتن، مع توضيحه في الحاشية.
- issue: دلالة العبارة «دُعي اسمي عليها»
  choice: الإبقاء على الصورة الاصطلاحية القريبة من اليونانية
  alternative: التي تُدعى باسمي
  rationale: الصياغة المختارة تحافظ على صورة حلول اسم الرب على جماعة بوصفها علامة انتساب وملكية، ولا تحصرها في كونها لقبًا يُطلق عليهم.
- issue: العلاقة بين «بقية البشر» و«جميع الأمم»
  choice: العطف بالواو دون تفسير زائد
  alternative: أي جميع الأمم
  rationale: يمكن أن تحمل καὶ معنى العطف أو التوضيح بحسب قراءة السياق؛ لذلك حُفظ العطف البسيط ولم تُفرض علاقة تفسيرية صريحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُخدمت «الأمم» بدل تعبير تفسيري مباشر مثل «غير اليهود» للمحافظة على تعدد الدلالة في الأصل، ووُضعت جميع علامات الحواشي في المتن.
