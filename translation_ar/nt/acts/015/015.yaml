  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف يربط هذا الاستشهاد بما سبقه في حديث يعقوب.
- source_word: τούτῳ
  choice: مع هذا
  rationale: اسم الإشارة في حالة المجرور يشير على نحو عام إلى الأمر السابق، وتلائم «مع» الفعل «تتفق» في العربية من غير تضييق مرجعه.
- source_word: συμφωνοῦσιν
  choice: تتفق
  rationale: ينقل معنى التوافق والانسجام بصياغة عربية واضحة وطبيعية.
- source_word: οἱ λόγοι
  choice: أقوال
  rationale: المقصود ما نطق به الأنبياء وصار مدونًا؛ و«أقوال» موجزة وطبيعية في هذا السياق.
- source_word: τῶν προφητῶν
  choice: الأنبياء
  rationale: الإضافة في «أقوال الأنبياء» تنقل علاقة المصدر أو النسبة التي تفيدها صيغة المضاف إليه اليونانية.
- source_word: καθὼς
  choice: كما
  rationale: تقدم الاقتباس الكتابي وتبين مطابقته لما سبق.
- source_word: γέγραπται
  choice: هو مكتوب
  rationale: صيغة عربية مألوفة ودقيقة لعبارة الاستشهاد الكتابي في صيغة التام المبني للمجهول.
theological_decisions:
- issue: مرجع τούτῳ في كلام يعقوب
  choice: إبقاء اسم الإشارة عامًا في عبارة «مع هذا»
  alternative: تحديد المرجع بأنه دخول الأمم في الإيمان، أو كلام بطرس، أو قصد الله
  rationale: النص اليوناني يحيل إلى الأمر السابق من غير أن يسمي مرجعه تحديدًا، لذلك تحافظ الصياغة على هذا الاتساع التفسيري.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. قُدِّمت عبارة «مع هذا» محافظةً على بروزها في ترتيب النص اليوناني، مع تجنب تفسير مرجع اسم الإشارة داخل الترجمة.
