lexical_decisions:
- source_word: ἐγένετο
  choice: فحدث
  rationale: صياغة سردية عربية طبيعية تدل على نشوء الحدث، مع ربطه بالسياق السابق.
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط سردية خفيفة لا تبالغ في إبراز معنى الاستدراك.
- source_word: παροξυσμὸς
  choice: خلافٌ حادٌّ
  rationale: ينقل شدة الصدام بين الطرفين بلغة عربية معاصرة واضحة، من غير تهوين أو مبالغة.
- source_word: ὥστε
  choice: حتى
  rationale: تفيد النتيجة المترتبة على شدة الخلاف بصورة طبيعية في العربية.
- source_word: ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: افترق أحدهما عن الآخر
  rationale: يحافظ على معنى الانفصال المتبادل بصياغة عربية واضحة.
- source_word: τόν τε Βαρναβᾶν
  choice: فأخذ برنابا
  rationale: تربط الفاء بالفعل الناتج التالي، بينما تُمهّد بنية τε لذكر تصرف بولس في العدد اللاحق.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: مرقس معه
  rationale: يُظهر أن برنابا اصطحب مرقس، ولا يضيف اسم يوحنا غير الوارد في نص هذا العدد.
- source_word: ἐκπλεῦσαι
  choice: أبحر
  rationale: فعل عربي موجز يتضمن السفر بحرًا والانطلاق بالسفينة.
- source_word: εἰς Κύπρον
  choice: إلى قبرص
  rationale: ينقل جهة الرحلة ووجهتها مباشرة.
theological_decisions:
- issue: تصوير الخلاف بين العاملين الرسوليين
  choice: خلافٌ حادٌّ
  alternative: خصامٌ شديدٌ
  rationale: يحفظ النص حقيقة الصدام وشدته من غير تلطيف أو إصدار حكم أخلاقي زائد، ولا يحمّل اللفظ معنى الخصومة الشخصية أكثر مما يقتضيه السياق.
