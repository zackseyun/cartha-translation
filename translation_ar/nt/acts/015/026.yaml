  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: ar
  text: رَجُلَيْنِ عَرَّضَا حَيَاتَيْهِمَا لِخَطَرِ الْمَوْتِ مِنْ أَجْلِ اسْمِ رَبِّنَا يَسُوعَ الْمَسِيحِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بذلا حياتيهما» أو «سلَّما حياتيهما»؛ والفعل اليوناني يعني حرفيًا «سلَّما حياتيهما»، وهو تعبير يفيد تعريض النفس لخطر الموت.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώποις
  choice: رَجُلَيْنِ
  rationale: يشير اللفظ هنا إلى برنابا وبولس المذكورين مباشرة في الآية السابقة، ولذلك يعبّر «رجلين» عن المرجع المحدد، كما يلائم موقعه النحوي بوصفه تابعًا لهما.
- source_word: παραδεδωκόσι
  choice: بَذَلَا
  rationale: الفعل في صيغة اسم الفاعل التام يعني حرفيًا «سلّما» أو «دفعا»، ومع «حياتهما» يفيد تعريض النفس لخطر الموت. و«بذلا حياتهما» يحفظ قوة التعبير من غير أن يقرر أنهما ماتا فعلًا، وتوضح الحاشية دلالته السياقية.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: حَيَاتَهُمَا
  rationale: ψυχή هنا بمعنى الحياة المعرضة للخطر، لا «النفس» بمعناها الروحي المجرد. واستُعمل ضمير المثنى لأن المرجع رجلان محددان.
- source_word: ὑπὲρ
  choice: مِنْ أَجْلِ
  rationale: تنقل العبارة معنى السبب والغاية المقصودين مع المضاف إليه، وهي طبيعية وواضحة في العربية المعاصرة.
- source_word: τοῦ ὀνόματος
  choice: اسْمِ
  rationale: أُبقي تعبير «الاسم» لما يحمله في الاستعمال الكتابي من دلالة على الشخص وسلطانه وكرامته، دون تضييقه إلى معنى واحد تفسيري.
- source_word: τοῦ κυρίου ἡμῶν
  choice: رَبِّنَا
  rationale: «ربنا» هو المقابل العربي المألوف والموجز للقب κύριος مع ضمير المتكلمين، ويحفظ ثقله المسيحاني.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: يُنقل Ἰησοῦ اسمًا، ويُترجم Χριστοῦ بوصفه لقبًا إلى «المسيح»، وهو التعبير العربي الطبيعي الذي يعني الممسوح المنتظر.
theological_decisions:
- issue: دلالة παραδεδωκόσι مع «حياتهما»
  choice: بذلا حياتهما، مع حاشية تبين التعرض لخطر الموت
  alternative: عرّضا حياتهما للخطر / سلّما حياتهما
  rationale: «عرّضا حياتهما للخطر» يوضح المقصود لكنه يخفف صورة التسليم القوية في الأصل، أما «سلّما حياتهما» فقد يوحي بأنهما ماتا بالفعل. يحفظ «بذلا» قوة التعبير مع إبقاء سعته، وتمنع الحاشية إساءة فهمه.
- issue: ترجمة Χριστοῦ في تركيب «ربنا يسوع المسيح»
  choice: المسيح
  alternative: كريستوس
  rationale: Χριστός لقب معناه «المسيح/الممسوح»، وليس اسم عائلة. وترجمته إلى «المسيح» تحفظ معناه اللاهوتي وهي الصيغة العربية الراسخة والطبيعية.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة، مع الحفاظ على كون الآية امتدادًا نحويًا للآية السابقة. استُعمل المثنى اتساقًا مع برنابا وبولس، وجاءت الحاشية لتصون قوة الصورة اليونانية من غير أن توهم موتهما الفعلي.
