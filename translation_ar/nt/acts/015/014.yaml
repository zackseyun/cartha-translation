  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: ar
  text: روى سِمْعان[a] كيف افتقد اللهُ غيرَ اليهود أولًا، ليتخذ منهم[b] شعبًا لاسمه[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سيمون». يستعمل يعقوب هنا صيغة «سِمْعان».
    reason: lexical_alternative
  - marker: b
    text: أو «من بين الأمم».
    reason: lexical_alternative
  - marker: c
    text: أي شعبًا يخصه وينتسب إلى اسمه.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: سِمْعان
  rationale: نُقلت الصيغة الواردة هنا بما يميزها من الصيغة اليونانية الأشهر «سيمون»، من غير توحيد الاسمين في المتن.
- source_word: ἐξηγήσατο
  choice: روى
  rationale: يدل الفعل على سرد خبر أو عرض رواية، و«روى» موجزة وطبيعية في سياق تلخيص كلام سِمعان السابق.
- source_word: καθὼς
  choice: كيف
  rationale: تُدخل مضمون الرواية وتُبقي دلالة الكيفية، وهي صياغة عربية طبيعية بعد فعل «روى».
- source_word: πρῶτον
  choice: أولًا
  rationale: تشير إلى بداية عمل الله هذا بين غير اليهود، من غير حسم ما إذا كان التركيز زمنيًا محضًا أو مرحليًا.
- source_word: ἐπεσκέψατο
  choice: افتقد
  rationale: يحفظ التعبير الكتابي الذي يفيد زيارة مقصودة تنطوي على عناية وتدخل، بدل اختزاله في مجرد النظر أو المساعدة.
- source_word: λαβεῖν
  choice: ليتخذ
  rationale: تنقل لام التعليل غرض الافتقاد، ويعبّر «يتخذ» عن الأخذ بقصد جعل جماعة شعبًا خاصًا من غير إضافة تفسير زائد.
- source_word: ἐξ ἐθνῶν
  choice: منهم، أي من غير اليهود
  rationale: يفهم ἔθνη في سياق أعمال 15 على أنه غير اليهود؛ صيغ المتن بوضوح للعربية المعاصرة، مع إثبات البديل الحرفي «من بين الأمم» في الحاشية.
- source_word: λαὸν
  choice: شعبًا
  rationale: تحفظ «شعبًا» الرنين الجماعي والعهدي للكلمة، ولا تحصرها في جماعة عرقية.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: لاسمه
  rationale: تحفظ العبارة المصدرية المكثفة وما فيها من دلالة على الانتساب إلى الله والارتباط باسمه، بدل تسويتها إلى «لنفسه».
theological_decisions:
- issue: 'دلالة ἐξ ἐθνῶν: الأمم أم غير اليهود'
  choice: غير اليهود
  alternative: الأمم
  rationale: موضوع السياق المباشر هو دخول غير اليهود في شعب الله. يوضح المتن هذا المقصود للقارئ المعاصر، بينما تحفظ الحاشية الصياغة الأقرب حرفيًا.
- issue: هل تُفسَّر τῷ ὀνόματι αὐτοῦ بعبارة «لنفسه»
  choice: لاسمه
  alternative: لنفسه
  rationale: الإبقاء على «لاسمه» يحفظ التعبير العهدي وثقله اللاهوتي، ولا يحسم كل أبعاده بتفسير واحد.
- issue: طبيعة افتقاد الله في ἐπεσκέψατο
  choice: افتقد
  alternative: زار أو التفت إلى
  rationale: «افتقد» يبقي معنى الزيارة الإلهية المقصودة بما فيها من عناية، من غير أن يحدد طبيعة التدخل تحديدًا زائدًا.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل «افتقد» للمحافظة على صورة الزيارة الإلهية المقصودة، و«غير اليهود» لإيضاح المقابلة السياقية، مع إبقاء البديل «الأمم» في الحاشية. وُضعت جميع علامات الحواشي في مواضعها من المتن.
