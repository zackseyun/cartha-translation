id: ACT.15.1
reference: Acts 15:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: ar
  text: 'ونزل قوم من اليهودية، وكانوا يعلّمون الإخوة[a] قائلين: «إن لم تختتنوا بحسب عادة موسى، فلا يمكنكم أن تخلصوا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات»؛ فاللفظ اليوناني هو «الإخوة»، ويُرجَّح أنه يشير هنا بصورة شاملة إلى جماعة المؤمنين.
    reason: بديل معجمي وتوضيح لاحتمال الشمول
lexical_decisions:
- source_word: Καί
  choice: و
  rationale: حرف عطف يحافظ على تتابع السرد البسيط في لوقا.
- source_word: τινες
  choice: قوم
  rationale: يدل على أشخاص غير مسمّين، وصيغة «قوم» عربية طبيعية ولا تزيد تحديدًا غير موجود في النص.
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: نزل قوم من اليهودية
  rationale: يحفظ فعل الحركة وصيغة النزول من اليهودية إلى أنطاكية، مع تركيب عربي سلس.
- source_word: ἐδίδασκον
  choice: كانوا يعلّمون
  rationale: ينقل دلالة الماضي الناقص على الفعل المستمر أو المتكرر.
- source_word: τοὺς ἀδελφοὺς
  choice: الإخوة[a]
  rationale: يحفظ اللفظ اليوناني المذكر الجمع، مع بيان احتمال شموله جماعة المؤمنين كلها في الحاشية.
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: إن لم تختتنوا
  rationale: صياغة شرطية عربية طبيعية تحافظ على المبني للمجهول اليوناني من حيث تلقي فعل الختان دون تكلف لفظي.
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: بحسب عادة موسى
  rationale: «عادة» تقابل ἔθος بوصفها ممارسة مستقرة، و«بحسب» تعبّر طبيعيًا عن علاقة الموافقة.
- source_word: οὐ δύνασθε σωθῆναι
  choice: فلا يمكنكم أن تخلصوا
  rationale: يحفظ معنى عدم الاستطاعة والقوة الخلاصية للفعل في سياق النزاع.
theological_decisions:
- issue: دلالة σωθῆναι في خلاف مجمع أورشليم
  choice: أن تخلصوا
  alternative: أن تنجوا
  rationale: السياق يتناول ضرورة الختان للخلاص، لا مجرد النجاة من خطر آني؛ وهذه الصياغة تحفظ البعد الخلاصي من غير فرض إطار مذهبي.
- issue: شمول ἀδελφοὺς من جهة الجنس
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنين
  rationale: المتن يحفظ صيغة المذكر الجمع في اليونانية، بينما توضّح الحاشية أن اللفظ يُحتمل أن يشمل جماعة المؤمنين كلها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «قوم» بدل «رجال» لأن اليونانية لا تذكر ἄνδρες، مع إبقاء «الإخوة» مطابقًا للفظ المصدر وإضافة حاشية توضيحية.
