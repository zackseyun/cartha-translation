  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: ar
  text: ولمّا وصلوا إلى أورشليم، رحّبت بهم الكنيسة والرسل والشيوخ، وأخبروا بكل ما فعله الله معهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ما فعله الله بواسطتهم» أو «ما فعله الله بينهم». والنص اليوناني يقول حرفيًا: «معهم».'
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: ولمّا وصلوا إلى أورشليم
  rationale: ينقل اسم الفاعل الأوريستي بوصفه ظرفًا زمنيًا سابقًا للفعلين الرئيسيين، وتمثل الواو الصلة الخطابية الخفيفة التي تؤديها δέ. وتناسب «إلى» فعل الوصول في العربية.
- source_word: παρεδέχθησαν ἀπὸ τῆς ἐκκλησίας
  choice: رحّبت بهم الكنيسة
  rationale: صياغة عربية طبيعية تنقل معنى استقبالهم بحفاوة، مع تحويل المبني للمجهول اليوناني إلى مبني للمعلوم دون تغيير الفاعل الدلالي.
- source_word: τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: الكنيسة والرسل والشيوخ
  rationale: تحافظ على الفئات الثلاث المذكورة في النص؛ و«الشيوخ» تدل هنا على القادة المعترف بهم في الجماعة، لا على كبار السن فحسب.
- source_word: ἀνήγγειλάν τε
  choice: وأخبروا
  rationale: ينقل فعل تقديم الخبر أو سرد الوقائع، وتمثل الواو أداة الربط τε بصياغة عربية سلسة.
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: بكل ما فعله الله
  rationale: «كل ما» تقابل شمول ὅσα، و«فعله» تحافظ على عموم ποιέω وعلى كون الله الفاعل الأساسي.
- source_word: μετ’ αὐτῶν
  choice: معهم
  rationale: هذه المقابلة الأقرب دلاليًا لحرف μετά مع المضاف إليه، وتحفظ انفتاح العبارة على المصاحبة أو الوساطة أو نطاق العمل دون حصرها في معنى واحد.
theological_decisions:
- issue: دلالة دور بولس وبرنابا في عمل الله في عبارة μετ’ αὐτῶν
  choice: ما فعله الله معهم
  alternative: ما فعله الله بواسطتهم / ما فعله الله بينهم
  rationale: 'تحفظ «معهم» التوتر المقصود في العبارة: الله هو الفاعل، والرسولان مرتبطان بعمله، من غير الجزم بأن المعنى آلي حصراً أو مكاني حصراً.'
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم المبني للمعلوم في «رحّبت بهم» لطبيعته في العربية، مع الحفاظ على مضمون المبني للمجهول في الأصل. وُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
