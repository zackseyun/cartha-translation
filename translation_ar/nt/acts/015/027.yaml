lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: أرسلنا
  rationale: صيغة الماضي العربية هي التعبير الطبيعي في سياق الرسالة، أما التام اليوناني فيوحي أيضًا بأن نتيجة الإرسال ما تزال قائمة، وهو ما يوضحه السياق والحاشية.
- source_word: οὖν
  choice: لذلك
  rationale: تنقل دلالة الاستنتاج والارتباط المنطقي بما سبق من قرار الجماعة.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: يهوذا وسيلا
  rationale: نقل الاسمين بحسب الصيغ العربية الكتابية الشائعة.
- source_word: καὶ αὐτοὺς
  choice: وهما ... بأنفسهما
  rationale: تحفظ توكيد الضمير وتبرز أن الرسولين سيقدمان شخصيًّا البلاغ الشفهي الموافق للرسالة المكتوبة؛ وتُفهم καί هنا ضمن معنى الإضافة إلى الكتابة.
- source_word: διὰ λόγου
  choice: شفهيًّا
  rationale: تعبير عربي طبيعي يبين أن الإبلاغ سيكون بالكلام المنطوق، في مقابل الرسالة المكتوبة.
- source_word: ἀπαγγέλλοντας
  choice: سيخبرانكم
  rationale: اسم الفاعل اليوناني يصف ما سيفعله المرسلان عند وصولهما؛ وصيغة المستقبل أوضح وأفصح بالعربية، وضمير المخاطبين مفهوم من السياق.
- source_word: τὰ αὐτά
  choice: بالأمور نفسها
  rationale: ترجمة مباشرة تحافظ على عموم العبارة ولا تستبدلها بتفسير أضيق مثل «الرسالة نفسها».
