    text: الفعل في اليونانية بصيغة التام، وقد يفيد أن الإرسال قد تم وأن أثره ما زال قائمًا؛ ويؤدَّى ذلك طبيعيًّا في العربية بصيغة «أرسلنا».
    reason: lexical_alternative
  - marker: b
