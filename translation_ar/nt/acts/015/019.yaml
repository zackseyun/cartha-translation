    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تفيد النتيجة المبنية على حجة يعقوب السابقة، و«لذلك» تؤدي هذا الربط الاستنتاجي بوضوح.
- source_word: ἐγὼ κρίνω
  choice: أرى
  rationale: يفيد الفعل هنا إصدار رأي أو حكم مدروس. وضمير المتكلم مستفاد بوضوح من صيغة الفعل العربية، مع بقاء صوت يعقوب الشخصي.
- source_word: μὴ παρενοχλεῖν
  choice: ألّا نثقّل على
  rationale: يعني عدم إحداث مشقة أو عرقلة لهم؛ والتعبير العربي طبيعي ويحفظ القوة العملية لتوصية يعقوب.
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: الذين من بين الأمم
  rationale: يحفظ الإشارة إلى أشخاص آتين من جماعة الأمم، لا إلى الأمم بوصفها مفهومًا مجردًا.
- source_word: ἐθνῶν
  choice: الأمم
  rationale: لفظ «الأمم» هو المقابل العربي الكتابي المألوف لغير اليهود، كما يحفظ المعنى الحرفي الممكن للكلمة اليونانية.
- source_word: ἐπιστρέφουσιν
  choice: يرجعون
  rationale: يحفظ صورة التحول والاتجاه التي في الفعل اليوناني، من غير تحويلها إلى مصطلح تقني لاحق.
- source_word: ἐπὶ τὸν θεόν
  choice: إلى الله
  rationale: يعبّر طبيعيًا عن وجهة الرجوع والتحول المقصودة في السياق.
theological_decisions:
- issue: هل العبارة رأي يعقوب الشخصي فقط أم توصية موجّهة إلى الجماعة؟
  choice: «أرى ألّا نثقّل»
  alternative: «أحكم ألّا يُثقَّل» أو «رأيي ألّا نثقّل»
  rationale: يحفظ النص المتكلم المفرد في «أرى»، بينما تعبّر صيغة «نثقّل» عن القوة الجماعية العملية للقرار من غير الادعاء بأن الفعل اليوناني نفسه جاء بصيغة الجمع.
translation_notes:
  register: عربية فصحى واضحة ووقورة. استُعمل «نثقّل على» بوصفه تعبيرًا طبيعيًا عن فرض المشقة والعوائق، وحُفظت صورة الرجوع إلى الله دون استعمال مصطلح مذهبي تقني.
