  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: ar
  text: فالآن، لماذا تجرّبون الله[a] بأن تضعوا نيرًا[b] على أعناق التلاميذ، لم يستطع آباؤنا[c] ولا نحن أن نحمله؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تضعون الله موضع الاختبار».'
    reason: lexical_alternative
  - marker: b
    text: «النير» صورة لالتزام مفروض؛ وفي السياق يشير إلى متطلبات تُوضَع على التلاميذ.
    reason: cultural_note
  - marker: c
    text: 'أو: «أسلافنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: فالآن
  rationale: تنقل الفاء قوة الاستنتاج والانتقال في οὖν، وتحافظ «الآن» على الدلالة الزمنية في νῦν بصياغة عربية طبيعية.
- source_word: τί πειράζετε τὸν θεόν
  choice: لماذا تجرّبون الله
  rationale: استُعملت «لماذا» لقوة τί في السؤال الإنكاري، و«تجرّبون الله» تحفظ دلالة اختبار الله أو وضعه موضع الامتحان دون تفسير زائد.
- source_word: ἐπιθεῖναι
  choice: بأن تضعوا
  rationale: تبيّن الباء أن وضع النير هو وجه تجريب الله ومضمونه، مع الحفاظ على صورة الفعل الأصلية.
- source_word: ζυγὸν
  choice: نيرًا
  rationale: «النير» المقابل العربي المباشر للصورة المجازية، ويحفظ معنى الالتزام أو العبء المفروض دون استبدال الصورة بتفسيرها.
- source_word: ἐπὶ τὸν τράχηλον τῶν μαθητῶν
  choice: على أعناق التلاميذ
  rationale: صياغة عربية طبيعية تحفظ صورة النير الموضوع على العنق؛ وجاء الجمع «أعناق» ملائمًا لجمع «التلاميذ».
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: لا آباؤنا ولا نحن
  rationale: تحفظ البنية المتوازية والنفي المزدوج، و«آباؤنا» ترجمة مباشرة لـ πατέρες مع احتمال أن يكون المراد الأسلاف.
- source_word: ἰσχύσαμεν βαστάσαι
  choice: لم يستطع ... أن يحمله
  rationale: تنقل القدرة التي يدل عليها ἰσχύω، ويوافق «يحمل» صورة النير في βαστάζω. أُفرد الضمير لأن مرجعه «نيرًا».
theological_decisions:
- issue: مدلول النير
  choice: الإبقاء على «النير» بوصفه صورة لالتزام مفروض، من غير تحديده في نص الآية.
  alternative: تفسير النير صراحة بأنه الشريعة الموسوية كلها، أو حصره في الختان والمتطلبات المرتبطة به.
  rationale: السياق يتناول متطلبات تُفرض على التلاميذ، لكن صياغة الآية نفسها مجازية ولا تحدد هنا نطاق النير بدقة؛ لذلك تُحفظ الصورة والتوتر التفسيري.
- issue: دلالة تجريب الله
  choice: «تجرّبون الله»
  alternative: «تمتحنون الله» أو «تضعون الله موضع الاختبار»
  rationale: الاختيار يحفظ العبارة اللاهوتية القوية في الأصل من غير تخفيفها، وتوضح الحاشية البديل الدلالي الممكن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صورة النير والأسلوب الاستفهامي الإنكاري، ووُضعت جميع علامات الحواشي في مواضعها في المتن.
