lexical_decisions:
- source_word: ἔδοξεν
  choice: حَسُنَ لدى
  rationale: ينقل الصيغة اليونانية الدالة على الاستحسان واتخاذ القرار، ويحافظ على نبرة المداولة من غير اختزالها إلى مجرد رأي بشري.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: لدى الروح القدس
  rationale: المجرور باليونانية متعلق بـ«حَسُنَ»، والتعبير يحافظ على فاعلية الروح القدس الشخصية.
- source_word: καὶ ἡμῖν
  choice: ولدينا
  rationale: يحافظ على التوازي النحوي مع «لدى الروح القدس» وعلى الاشتراك في إقرار القرار.
- source_word: μηδὲν πλέον
  choice: ألّا ... عبئًا آخر
  rationale: ينقل معنى عدم إضافة شيء زائد مع «عبء» بصياغة عربية طبيعية؛ و«آخر» هنا بمعنى إضافي.
- source_word: ἐπιτίθεσθαι
  choice: نضع عليكم
  rationale: يحفظ صورة وضع العبء على المخاطَبين من غير زيادة في الطابع المؤسسي.
- source_word: ὑμῖν
  choice: عليكم
  rationale: يبين بوضوح مَن يقع عليهم العبء.
- source_word: βάρος
  choice: عبئًا
  rationale: المقابل العربي الطبيعي للمعنى المجازي، أي الالتزامات المفروضة.
- source_word: πλὴν
  choice: غير
  rationale: تستثني الأمور المذكورة بعد نفي أي عبء إضافي، وهي صياغة عربية موجزة وسليمة.
- source_word: τούτων τῶν ἐπάναγκες
  choice: هذه الأمور الضرورية
  rationale: يحافظ على الإشارة إلى الأحكام المحددة في العدد التالي، ولا يقرر مسبقًا طبيعتها بأكثر مما يقوله الأصل.
theological_decisions:
- issue: علاقة الروح القدس بقرار المجمع
  choice: «حَسُنَ لدى الروح القدس ولدينا»
  alternative: «قرر الروح القدس وقررنا» أو اعتبار العبارة مجرد توافق بشري
  rationale: تحافظ الصياغة على الإسناد المتوازي في الأصل وعلى فاعلية الروح القدس الشخصية، مع إبقاء العبارة الاصطلاحية واحتمال دلالتها على قرار رسمي.
- issue: مدى إلزام المؤمنين من الأمم بالقرار
  choice: عدم وضع عبء آخر غير أمور ضرورية محددة
  alternative: نفي جميع الالتزامات، أو فرض الشريعة الموسوية برمتها
  rationale: يحصر النص العبء في الأمور الآتية من دون إدخال منظومة لاهوتية لاحقة أو إزالة التوتر القائم بين الحرية والالتزام.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «حَسُنَ لدى» لإبقاء الصيغة اليونانية المداولية مع تجنب إيحاء «بدا» بعدم اليقين، وجاءت البدائل التفسيرية في الحواشي.
