lexical_decisions:
- source_word: διήρχετο
  choice: كان يجتاز
  rationale: صيغة الماضي الناقص تدل على حركة مستمرة عبر المنطقتين، و«كان يجتاز» تنقل هذا الجانب بعبارة عربية طبيعية.
- source_word: δὲ
  choice: الواو في «وكان»
  rationale: أداة ربط خفيفة تواصل السرد، وتؤديها الواو العربية دون إبراز زائد.
- source_word: Συρίαν
  choice: سُورِيَة
  rationale: الاسم العربي المعياري للإقليم.
- source_word: Κιλικίαν
  choice: كِيلِيكِيَة
  rationale: النقل العربي الشائع لاسم الإقليم القديم.
- source_word: ἐπιστηρίζων
  choice: مُثبِّتًا
  rationale: اسم الفاعل يصف عملًا مصاحبًا لاجتيازه، ومعناه تقوية الجماعات وترسيخها؛ و«مثبّتًا» يحافظ على الصلة اللفظية بفكرة الثبات دون حصرها في التشجيع العاطفي.
- source_word: ἐκκλησίας
  choice: الكنائس
  rationale: يشير في هذا السياق إلى الجماعات المسيحية المحلية، و«الكنائس» هي العبارة العربية الواضحة والمألوفة.
