base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: ar
  text: 'وبعد نقاش كثير، نهض بطرس وقال لهم: «أيها الإخوة[a]، أنتم تعلمون أن الله اختارني من بينكم منذ أيام بعيدة[b] لكي تسمع الأمم[c] بفمي كلمة الإنجيل وتؤمن».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أيها الرجال الإخوة». النداء اليوناني بصيغة جمع المذكر، وهو نداء اصطلاحي قد يمثل جماعة أوسع.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «منذ الأيام الأولى».'
    reason: lexical_alternative
  - marker: c
    text: 'أي الشعوب غير اليهودية؛ ويمكن ترجمتها أيضًا: «غير اليهود».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς δὲ ζητήσεως γενομένης
  choice: وبعدما دار نقاش طويل
  rationale: تنقل العبارة الظرفية السابقة للكلام، وتفهم ζήτησις هنا بوصفها نقاشًا جادًا في سياق اجتماع أورشليم من غير المبالغة في تصويره خصومة عدائية.
- source_word: ἀναστὰς
  choice: نهض
  rationale: فعل عربي موجز وطبيعي يدل على قيام بطرس قبل أن يتكلم.
- source_word: Ἄνδρες ἀδελφοί
  choice: أيها الإخوة
  rationale: يحفظ النداء الأخوي وصيغة جمع المذكر من غير إضافة «والأخوات» التي لا ترد صراحة في اليونانية، ولا التزام بالترجمة الحرفية الثقيلة «أيها الرجال الإخوة».
- source_word: ἐπίστασθε
  choice: أنتم تعلمون
  rationale: ينقل مباشرة معرفة المخاطبين السابقة، مع إبراز الضمير كما في اليونانية.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: منذ أيام قديمة
  rationale: يحافظ على صورة «الأيام» وعلى دلالة الزمن السابق، مع إثبات البديل السياقي «الأيام الأولى» في الحاشية.
- source_word: ἐν ὑμῖν
  choice: من بينكم
  rationale: ينقل وقوع الاختيار داخل الجماعة المخاطبة، من غير التصريح بمفعول محذوف في اليونانية.
- source_word: ἐξελέξατο
  choice: اختار
  rationale: المقابل العربي المباشر والطبيعي لفعل الاختيار.
- source_word: διὰ τοῦ στόματός μου
  choice: على فمي
  rationale: يحفظ الصورة المجازية التي تجعل فم بطرس أداة وصول الرسالة، بدل اختزالها إلى «بواسطتي».
- source_word: τὰ ἔθνη
  choice: الأمم
  rationale: يحفظ المعنى اللفظي الواسع، بينما توضح الحاشية أن المقصود في هذا السياق الشعوب غير اليهودية.
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: كلمة الإنجيل
  rationale: يحافظ على تركيب لوقا وصورته اللفظية، وهو تعبير مفهوم في العربية الكتابية المعاصرة.
- source_word: πιστεῦσαι
  choice: وتؤمن
  rationale: يعطف الإيمان على السماع كما يفعل المصدران اليونانيان، من غير إدخال صياغة لاهوتية أوسع مثل «تأتي إلى الإيمان».
theological_decisions:
- issue: النداء المذكر Ἄνδρες ἀδελφοί واحتمال شموله جماعة أوسع
  choice: أيها الإخوة
  alternative: أيها الرجال الإخوة؛ أيها الإخوة والأخوات
  rationale: تحفظ الترجمة صيغة المذكر والنبرة العائلية، ولا تضيف «الأخوات» إلى النص، مع بيان طبيعة النداء الاصطلاحية في الحاشية.
- issue: دلالة τὰ ἔθνη في سياق قبول غير اليهود
  choice: الأمم
  alternative: الوثنيون؛ غير اليهود
  rationale: «الأمم» يحفظ الاتساع المعجمي ولا يحمل إيحاء «الوثنية» بالضرورة، وتوضح الحاشية أن المرجع السياقي هو الشعوب غير اليهودية.
- issue: المفعول المفهوم مع ἐξελέξατο
  choice: اختار الله من بينكم أن...
  alternative: اختارني الله من بينكم لكي...
  rationale: لا تصرح اليونانية بضمير «ني» مفعولًا به، وإن كان ذكر «فمي» يجعل بطرس مفهومًا في السياق؛ لذلك تُرك التركيب دون إضافة صريحة تجنبًا لحسم ما أبقاه النص ضمنيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعملت ألفاظ مألوفة مثل «نقاش» و«نهض»، مع الإبقاء على الصور المصدرية البارزة مثل «على فمي» و«كلمة الإنجيل». وُضعت جميع علامات الحواشي في مواضعها داخل المتن.
