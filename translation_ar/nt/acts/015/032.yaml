source:
  edition: SBLGNT
  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: ar
  text: وكان يهوذا وسيلا، وهما أيضًا نبيّان، قد شجّعا الإخوة[a] بكلام كثير وثبّتاهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الإخوة والأخوات»؛ فاليونانية تقول «الإخوة»، وقد يُقصد بها جماعة المؤمنين كلها.'
    reason: بديل معجمي يوضح إمكان الدلالة الشاملة للفظ المذكر الجمع.
lexical_decisions:
- source_word: Ἰούδας
  choice: يهوذا
  rationale: الصيغة العربية الكتابية المألوفة لهذا الاسم، وهي تحافظ على صلته بالاسم اليوناني من غير خلط غير ضروري.
- source_word: τε καὶ
  choice: و... و
  rationale: رُبط الاسمان بعطف طبيعي في العربية، إذ لا تستلزم العبارة اليونانية إبراز صيغة «كلاهما».
- source_word: Σιλᾶς
  choice: سيلا
  rationale: الصيغة العربية الشائعة للاسم في سفر أعمال الرسل.
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: وهما أيضًا نبيّان
  rationale: تعكس العبارة الخلفية التفسيرية، وتحفظ دلالة καὶ αὐτοὶ على أن يهوذا وسيلا كانا هما أيضًا من الأنبياء.
- source_word: προφῆται
  choice: نبيّان
  rationale: نقل مباشر للمصطلح مع مطابقته للمثنى العربي.
- source_word: διὰ λόγου πολλοῦ
  choice: بكلام كثير
  rationale: يحافظ هذا التعبير على صورة الأصل وعلى معنى الكلام المطوّل أو الوافر، من غير حصره في رسالة واحدة.
- source_word: παρεκάλεσαν
  choice: شجّعا
  rationale: ينقل معنى التشجيع والحث في هذا السياق بلفظ عربي واضح، مع إبقاء إمكان اشتماله على التعزية والحض.
- source_word: τοὺς ἀδελφοὺς
  choice: الإخوة
  rationale: ينقل اللفظ اليوناني بصيغته المذكرة، مع بيان احتمال شموله جماعة المؤمنين كلها في الحاشية.
- source_word: ἐπεστήριξαν
  choice: ثبّتاهم
  rationale: يعبر عن جعلهم أكثر رسوخًا وثباتًا، ويحفظ تميّز هذا الفعل عن التشجيع السابق.
theological_decisions:
- issue: دلالة τοὺς ἀδελφοὺς في سياق جماعة قد تضم الرجال والنساء
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: الأصل مذكر جمع، وقد يُستعمل تمثيليًا لجماعة المؤمنين كلها. أُبقي اللفظ في المتن، ووُضّح الاحتمال الشامل في الحاشية من غير حسم ما تركه السياق عامًا.
- issue: قوة دلالة καὶ αὐτοὶ في وصف يهوذا وسيلا
  choice: وهما أيضًا نبيّان
  alternative: وهما نفسيهما نبيّان
  rationale: «أيضًا» تلائم السياق على نحو طبيعي وتحفظ احتمال أن العبارة تربط دورهما النبوي بغيرهما من الأنبياء، بينما «نفسيهما» قد تضيف توكيدًا عربيًا أثقل من المطلوب.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم المثنى الطبيعي في «نبيّان، شجّعا، ثبّتا»، وحُفظ التوازي بين التشجيع والتثبيت، مع إبقاء «بكلام كثير» قريبًا من صورة الأصل.
