  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: ar
  text: 'وكتبوا رسالةً وأرسلوها بواسطتهم[a]: «من الرسل والشيوخ، الإخوة[b]، إلى الإخوة من الأمم[c] في أنطاكية وسورية وكيليكية: تحية».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «بيدهم» أو «عن طريق يدهم». والتعبير يدل في هذا السياق على إرسال الرسالة أو تسليمها بواسطة المندوبين المذكورين في السياق السابق.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن فهم «الإخوة» بيانًا للرسل والشيوخ معًا: «الرسل والشيوخ، الإخوة»، أو وصفًا للشيوخ خاصة: «الشيوخ الإخوة». ولا يقتضي النص جعل «الإخوة» فئة ثالثة مستقلة.'
    reason: alternative_reading
  - marker: c
    text: قد يُستعمل «الإخوة» هنا استعمالًا شاملًا لجماعة المؤمنين كلها، بمن فيها النساء.
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες
  choice: وكتبوا
  rationale: صيغة اسم الفاعل اليونانية العائدة إلى فعل سابق تُنقل هنا بفعل معطوف طبيعي في العربية، مع إبقاء تعاقب الحدثين في السياق.
- source_word: διὰ χειρὸς αὐτῶν
  choice: على أيديهم
  rationale: يحافظ التعبير على الصورة الاصطلاحية اليونانية، ويفيد أن الرسالة حُمّلت إلى المندوبين أو أُرسلت بواسطتهم، لا بالضرورة أنهم ألّفوها.
- source_word: ἀπόστολοι
  choice: الرسل
  rationale: المقابل العربي المألوف للقب قادة الكنيسة المرسلين في هذا السياق.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: الإخوة الشيوخ
  rationale: يحافظ هذا الترتيب على الصلة النحوية الطبيعية بين الاسمين في اليونانية، من غير أن يحوّل «الإخوة» بصمت إلى فئة ثالثة مستقلة؛ وتُذكر القراءة الشائعة البديلة في الحاشية.
- source_word: ἀδελφοῖς
  choice: الإخوة
  rationale: يحافظ على صيغة المذكر الجمع في المصدر، مع بيان احتمال شمول اللفظ لجميع المؤمنين، رجالًا ونساءً، في الحاشية.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: الذين من الأمم
  rationale: ينقل معنى الأصل أو الانتماء الذي تفيده ἐξ، ويُبقي مصطلح «الأمم» المألوف في سياق سفر الأعمال.
- source_word: χαίρειν
  choice: سلام
  rationale: يؤدي وظيفة التحية الاصطلاحية في افتتاح الرسائل بلغة عربية طبيعية، بدل المعنى الحرفي «افرحوا» غير المقصود هنا.
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: في أنطاكية وسورية وكيليكية
  rationale: تنقل «في» الدلالة المكانية والتوزيعية لحرف الجر اليوناني بوضوح وطبيعية.
theological_decisions:
- issue: دلالة ἀδελφοί في خطاب جماعة قد تضم الرجال والنساء
  choice: الإخوة
  alternative: الإخوة والأخوات / المؤمنون
  rationale: أُبقيت الصيغة المذكرة في المتن التزامًا باللفظ اليوناني، مع توضيح دلالتها الشاملة المحتملة في الحاشية دون حسم ما يتركه التعبير عامًا.
- issue: العلاقة النحوية بين πρεσβύτεροι وἀδελφοὶ
  choice: الإخوة الشيوخ
  alternative: الشيوخ، إخوتكم / الشيوخ والإخوة
  rationale: غياب أداة تعريف ثانية قبل «الإخوة» يرجّح فهمها مرتبطة بـ«الشيوخ»، لكن التركيب يسمح بقراءة تفسيرية أخرى؛ لذلك حُفظ التوتر في المتن والحاشية بدل فرض مجموعة ثالثة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة رسائلية كريمة. استُعملت صيغة «من... إلى...» لإظهار بنية عنوان الرسالة، و«سلام» بوصفها تحية افتتاحية عربية طبيعية. وُضعت جميع علامات الحواشي في المتن عند العبارة التي تشرحها.
