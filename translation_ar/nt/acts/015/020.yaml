  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: ar
  text: بل نكتب إليهم أن يمتنعوا عن نجاسات الأصنام[a]، وعن الفجور الجنسي[b]، وعن المخنوق[c]، وعن الدم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «النجاسات المرتبطة بالأصنام». يحصر بعضهم المعنى في «ما ذُبح للأصنام»، لكن اللفظ اليوناني هنا أوسع.
    reason: lexical_alternative
  - marker: b
    text: أو «الزنى». قد يدل اللفظ اليوناني على الفجور الجنسي عمومًا، ويرى بعضهم أنه يشير هنا على نحو أخص إلى علاقات أو زيجات جنسية محرمة.
    reason: alternative_reading
  - marker: c
    text: 'حرفيًا: «ما خُنق»، أي لحم حيوان لم يُصفَّ دمه.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: نكتب إليهم
  rationale: ينقل معنى إرسال توجيه مكتوب في سياق رسالة مجمع أورشليم، بصياغة عربية طبيعية.
- source_word: ἀπέχεσθαι
  choice: يمتنعوا عن
  rationale: تؤدي معنى الكفّ والابتعاد الإرادي، وتناسب سياق التوجيه الأخلاقي والعملي.
- source_word: ἀλισγημάτων τῶν εἰδώλων
  choice: نجاسات الأصنام
  rationale: تحافظ على المعنى الواسع للتدنيس المرتبط بالأصنام، من غير حصره في ذبائح الأصنام وحدها.
- source_word: πορνείας
  choice: الفجور الجنسي
  rationale: عبارة واضحة ومعاصرة تنقل المجال الواسع للمصطلح، من غير قصره على صورة واحدة من العلاقات الجنسية المحرمة.
- source_word: τοῦ πνικτοῦ
  choice: المخنوق
  rationale: يحافظ على الصيغة الاسمية الموجزة في اليونانية، ويشير إلى الحيوان الذي مات خنقًا ولم يُصفَّ دمه.
- source_word: τοῦ αἵματος
  choice: الدم
  rationale: ترجمة مباشرة وموجزة، من غير إضافة تفسير لا يصرح به النص.
theological_decisions:
- issue: نطاق النهي المتعلق بالأصنام
  choice: نجاسات الأصنام
  alternative: ما ذُبح للأصنام
  rationale: اللفظ اليوناني أوسع من التعبير الاصطلاحي المحدد لذبائح الأصنام، ولذلك أبقت الترجمة على سعته.
- issue: دلالة πορνεία في قرار الرسل
  choice: الفجور الجنسي
  alternative: الزنى؛ العلاقات الجنسية المحرمة تحديدًا بحسب الشريعة
  rationale: تحفظ العبارة المعنى العام ولا تحسم هل المقصود كل خطيئة جنسية أم أنواع مخصوصة من الزيجات أو العلاقات المحرمة.
- issue: طبيعة المحظورات الواردة في القائمة
  choice: عرضها بوصفها أمورًا يجب الامتناع عنها دون بيان مدة إلزامها أو علته
  alternative: تدابير مؤقتة للشركة بين اليهود والأمم؛ أو أحكام دائمة لجميع المؤمنين
  rationale: الآية تذكر التوجيهات ولا تفصل مداها الزمني أو أساسها اللاهوتي، فلا ينبغي للترجمة أن تحسم ذلك.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «بل نكتب» لمواصلة المقابلة التي تبدأ بها ἀλλά، و«نجاسات الأصنام» للمحافظة على اتساع التعبير اليوناني. وُضعت علامات الحواشي بعد العبارات التي تشرحها مباشرة وبترتيب متتابع.
