id: ACT.15.2
reference: Acts 15:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: ar
  text: ولمّا نشب خلافٌ وجدالٌ غير قليل[a] بين بولس وبرنابا وبينهم، عيَّنوا بولس وبرنابا وبعضًا آخرين منهم ليصعدوا[b] إلى الرسل والشيوخ في أورشليم بشأن هذه المسألة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ليس بقليل». يستعمل الأصل اليوناني أسلوب التقليل المنفي لتوكيد شدة الخلاف والجدال.
    reason: lexical_alternative
  - marker: b
    text: «يصعدوا» هو التعبير اليوناني المألوف عن السفر إلى أورشليم.
    reason: cultural_note
  - marker: c
    text: أو «هذا الأمر» أو «هذه القضية».
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: فحدث
  rationale: ينقل التركيب المطلق في اليونانية بوصفه ظرفًا ممهدًا للفعل الرئيس، مع إبقاء أداة الربط في صياغة عربية طبيعية موجزة.
- source_word: στάσεως
  choice: خلاف
  rationale: يدل هنا على معارضة وانقسام جادّين، لا على مجرد اختلاف رأي، لكن «خلاف» يتجنب الإيحاء بثورة أو عنف لا يقتضيهما السياق.
- source_word: ζητήσεως
  choice: جدال
  rationale: يشير إلى المناقشة المتنازَع فيها، ويتميز عن «خلاف» الذي يصف حالة الانقسام بين الطرفين.
- source_word: οὐκ ὀλίγης
  choice: غير قليل
  rationale: يحافظ على أسلوب التقليل المنفي في الأصل، وهو أسلوب يفيد توكيد شدة الخلاف والجدال.
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: بين بولس وبرنابا وبينهم
  rationale: يبين طرفي النزاع بصياغة عربية طبيعية، والضمير يعود في السياق إلى القادمين من اليهودية المذكورين في الآية السابقة.
- source_word: ἔταξαν
  choice: عيَّنوا
  rationale: يفيد اختيار بولس وبرنابا والآخرين للقيام بهذه المهمة، مع عدم تحميل النص نظامًا مؤسسيًا أكثر مما يصرح به.
- source_word: ἀναβαίνειν
  choice: ليصعدوا
  rationale: يحافظ على التعبير المكاني المألوف في الأصل عن الذهاب إلى أورشليم.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: بعضًا آخرين منهم
  rationale: ينقل كون المرافقين أشخاصًا إضافيين مختارين من الجماعة نفسها من غير إضافة تحديد غير موجود في الأصل.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: الرسل والشيوخ
  rationale: يستعمل المقابلين العربيين المعروفين للقبين في سفر أعمال الرسل، ويحافظ على التمييز بين الفئتين.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: بشأن هذه المسألة
  rationale: ينقل معنى الأمر المتنازَع فيه بلغة عربية واضحة، من غير حسم لطبيعته بما يتجاوز السياق.
theological_decisions:
- issue: تحديد طرفي الخلاف
  choice: صياغة الخلاف على أنه بين بولس وبرنابا وبين «هم»، والضمير يعود إلى القادمين من اليهودية في الآية السابقة.
  alternative: كان لبولس وبرنابا معهم خلاف وجدال غير قليل.
  rationale: تعكس الصياغة العلاقات النحوية والسياق المباشر من غير استيراد استنتاج مذهبي بشأن أطراف النزاع.
- issue: الدلالة المؤسسية للفعل ἔταξαν
  choice: عيَّنوا
  alternative: قرروا أو رتَّبوا
  rationale: يفيد النص اختيار مندوبين للرحلة، لكن الترجمة لا تفترض نظامًا كنسيًا رسميًا محددًا يتجاوز ما يقوله الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على التقليل المنفي «غير قليل» وعلى تعبير الصعود إلى أورشليم، مع تجنب المصطلحات الطائفية أو التحديد المؤسسي الزائد.
