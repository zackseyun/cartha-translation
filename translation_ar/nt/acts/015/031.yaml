lexical_decisions:
- source_word: ἀναγνόντες
  choice: فلما قرأوها
  rationale: اسم الفاعل الأوريستي يدل على فعل سبق الفعل الرئيس. أُضيف ضمير المؤنث «ها» اعتمادًا على الرسالة المذكورة في السياق السابق، وصيغة «فلما» عربية طبيعية تحفظ تعاقب الحدثين.
- source_word: δὲ
  choice: فـ
  rationale: تفيد δέ انتقالًا وربطًا خفيفين؛ وتؤدي الفاء هنا الربط السياقي والتعاقب من غير إقحام معنى تضاد.
- source_word: ἐχάρησαν
  choice: فرحوا
  rationale: ينقل الفعل معنى χαίρω المباشر بصياغة عربية واضحة ومألوفة، ويحفظ قوة التعبير أكثر من صياغة وصفية مثل «كانوا مسرورين».
- source_word: ἐπὶ
  choice: بما فيها من
  rationale: تُفهم ἐπί مع المجرور هنا على أنها تبين أساس الفرح أو سببه. وتربط الصياغة التشجيع بمضمون الرسالة بوضوح، مع بقاء إمكان فهمها بمعنى الفرح بالتشجيع نفسه.
- source_word: τῇ παρακλήσει
  choice: تشجيع
  rationale: لـ παράκλησις مجال دلالي يشمل التشجيع والحث والتعزية. «تشجيع» أنسب للأثر المقوي والمطمئن للرسالة في هذا السياق، مع إثبات البدائل الحقيقية في الحاشية.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «فلما» لسلاسة التسلسل، وأُظهر تعلق التشجيع بمضمون الرسالة بعبارة «بما فيها»، مع حفظ الاتساع الدلالي لكلمة παράκλησις في الحاشية.
