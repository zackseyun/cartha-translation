  text: فلما قرأوها فرحوا بما فيها من تشجيع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فرحوا بالتشجيع». ويمكن أيضًا ترجمة «التشجيع» بـ«الحث» أو «التعزية».'
