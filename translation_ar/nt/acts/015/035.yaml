source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: ar
  text: أَمَّا بُولُسُ وَبَرْنَابَا فَمَكَثَا فِي أَنْطَاكِيَةَ[a]، يُعَلِّمَانِ وَيُبَشِّرَانِ بِكَلِمَةِ الرَّبِّ[b]، مَعَ آخَرِينَ كَثِيرِينَ أَيْضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أقاما مدةً في أنطاكية». يمكن أن يشدد الفعل اليوناني على البقاء هناك فترةً من الزمن.'
    reason: lexical_alternative
  - marker: b
    text: '«كلمة الرب» عبارة شائعة في سفر أعمال الرسل بمعنى رسالة الرب؛ ويمكن ترجمتها: «رسالة الرب». و«يبشّران» تعني إعلان البشارة أو الخبر السار.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: مكثا
  rationale: يفيد الفعل في صيغة الماضي الناقص استمرار الإقامة مدةً من الزمن؛ و«مكثا» تعبير عربي واضح يحفظ هذا المعنى الاستمراري.
- source_word: διδάσκοντες
  choice: يعلّمان
  rationale: يحفظ الفعل النشاط المستمر المصاحب لمكوثهما، مع مطابقة الفاعل المثنى.
- source_word: εὐαγγελιζόμενοι
  choice: يبشّران
  rationale: يدل الفعل على إعلان البشارة أو الخبر السار؛ و«يبشّران» طبيعي في العربية الكتابية المعاصرة من غير إطالة.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: مع آخرين كثيرين أيضًا
  rationale: يحفظ مشاركة عدد كبير من الآخرين، كما يحفظ معنى الإضافة الذي تؤديه καί.
- source_word: τὸν λόγον
  choice: بكلمة
  rationale: اختيرت «كلمة» للمحافظة على العبارة اللوقاوية المتكررة «كلمة الرب»، مع أن «رسالة» ممكنة بحسب السياق.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: نُقل اللقب κύριος إلى «الرب» من دون تعيين مرجعه بأكثر مما يتيحه النص اليوناني.
theological_decisions:
- issue: مرجع «الرب» في عبارة «كلمة الرب»
  choice: الإبقاء على «الرب» بلا توضيح تفسيري إضافي
  alternative: كلمة الرب يسوع، أو رسالة صادرة من الرب بمعنى إلهي أوسع
  rationale: قد يشير لقب κύριος في أعمال الرسل بوجه خاص إلى يسوع، لكن النص هنا لا يصرّح بالمرجع؛ لذلك تُحفظ العبارة وتوترها الدلالي من غير حسم زائد.
- issue: علاقة «كلمة الرب» بالفعلين «يعلّمان» و«يبشّران»
  choice: صياغة عربية تجعل كلمة الرب مضمون التعليم والتبشير معًا بحسب البناء العام للجملة
  alternative: ربطها نحويًا بالتبشير وحده
  rationale: المفعول به اليوناني يأتي بعد الفعلين المشاركين، ويُفهم طبيعيًا على أنه مضمون النشاطين كليهما، من غير إعادة المفعول.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدم المثنى في «مكثا، يعلّمان، يبشّران» بدقة، وحُفظ ترتيب المعنى الطبيعي من غير تقليد جامد لتركيب اليونانية.
