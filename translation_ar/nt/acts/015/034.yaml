  text: But[a] it seemed good to Silas to remain there.
translation:
  language: ar
  text: لكن بدا لسيلا أن يبقى هناك.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذا العدد غير موجود في أقدم المخطوطات اليونانية، ومنها البردية 74 من القرن الثالث، والمخطوطتان السينائية والفاتيكانية من القرن الرابع، كما يغيب عن الترجمات القبطية المبكرة. لكنه موجود في تقليد أغلبية المخطوطات البيزنطية، وفي بعض المخطوطات الإسكندرانية والغربية المتأخرة، وفي التقليدين اللاتيني والسرياني. ولعل ناسخًا متأخرًا أضافه لتفسير وجود سيلا في أنطاكية وانضمامه إلى بولس في العدد 40، مع أن العدد 33 يذكر أن يهوذا وسيلا انصرفا.
    reason: textual_critical
lexical_decisions:
- source_word: Ἔδοξε ... τῷ Σίλᾳ
  choice: بدا لسيلا
  rationale: يحافظ هذا التعبير على الصياغة غير الشخصية للفعل δοκέω مع اسم الشخص في حالة المجرور اليونانية، ويفيد أن البقاء استحسن في نظر سيلا، من غير تحويل العبارة صراحة إلى «قرّر».
- source_word: ἐπιμεῖναι
  choice: أن يبقى
  rationale: ينقل معنى الاستمرار في الموضع أو المكث فيه بلغة عربية واضحة وطبيعية.
- source_word: αὐτοῦ
  choice: هناك
  rationale: الكلمة مستعملة هنا ظرف مكان، وتشير في السياق إلى أنطاكية.
- source_word: δὲ
  choice: لكن
  rationale: تنقل الاستدراك السياقي بين انصراف المذكورين في العدد السابق واختيار سيلا البقاء.
