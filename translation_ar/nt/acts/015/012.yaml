  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: ar
  text: فسكت الجمع كله، وأصغوا إلى برنابا وبولس وهما يرويان ما أجرى الله على أيديهما من آيات وعجائب بين غير اليهود.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بين الأمم». والمقصود هنا، في سياق مجمع أورشليم، الشعوب غير اليهودية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: فسكت
  rationale: ينقل الفعل الماضي بوصفه انتقالًا إلى الصمت في سياق السرد، بصياغة عربية طبيعية موجزة.
- source_word: πᾶν τὸ πλῆθος
  choice: الجمع كله
  rationale: يشير إلى جماعة المجتمعين في مجلس أورشليم، و«الجمع» واضحة وفصيحة من غير إيحاء مؤسسي زائد.
- source_word: ἤκουον
  choice: أخذوا يستمعون
  rationale: يعكس استمرار الفعل في صيغة الماضي الناقص ويدل على الإصغاء المقصود.
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: برنابا وبولس
  rationale: نقل الاسمين وفق الصيغة العربية الكتابية الشائعة.
- source_word: ἐξηγουμένων
  choice: وهما يرويان
  rationale: يفيد سرد الوقائع وتقديم تقرير عنها، من غير تحميل اللفظ معنى التفسير النظري.
- source_word: ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα
  choice: ما أجرى الله ... من آيات وعجائب
  rationale: صياغة عربية طبيعية تجعل الله فاعل الآيات والعجائب، وتحفظ مدى ὅσα من غير إنشاء قائمة أوسع غير مصرّح بها.
- source_word: σημεῖα καὶ τέρατα
  choice: آيات وعجائب
  rationale: المقابل العربي المألوف للثنائية اللوقاوية، ويحفظ التمييز بين العلامة والعمل المثير للعجب.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: بين غير اليهود
  rationale: السياق في مجمع أورشليم يحدد المقصود بالشعوب غير اليهودية؛ وهذه العبارة أوضح للقارئ المعاصر من «الأمم» وحدها.
- source_word: δι’ αὐτῶν
  choice: على أيديهما
  rationale: تعبير عربي طبيعي عن الوساطة الأداتية، ويبقي الله الفاعل الأول وبرنابا وبولس واسطتين للعمل.
theological_decisions:
- issue: الفاعلية الإلهية في الرسالة الرسولية
  choice: الله هو الذي أجرى الآيات والعجائب على يدي برنابا وبولس.
  alternative: اعتبار برنابا وبولس الفاعلين الأساسيين للآيات والعجائب.
  rationale: النحو اليوناني يجعل «الله» فاعل ἐποίησεν، ويجعل δι’ αὐτῶν دالًا على الوساطة؛ لذلك تحافظ الصياغة على هذه النسبة من غير إنكار مشاركة الرسولين.
- issue: دلالة ἔθνεσιν في سياق مجمع أورشليم
  choice: غير اليهود
  alternative: الأمم أو الشعوب
  rationale: السياق المباشر هو قبول المؤمنين من الشعوب غير اليهودية؛ وتثبت الحاشية البديل الحرفي الأوسع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية موقرة. استُخدم «أخذوا يستمعون» لإبراز الاستمرار، و«على أيديهما» لصون الفاعلية الإلهية مع التعبير الطبيعي عن الوساطة.
