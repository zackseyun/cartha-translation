    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: بعد هذه الأمور
  rationale: صياغة واضحة تحافظ على الجمع في ταῦτα وعلى الانتقال الزمني في الاقتباس.
- source_word: ἀναστρέψω
  choice: سأعود
  rationale: يفيد الفعل هنا الرجوع، وتحافظ الصياغة على وعد المتكلم بصيغة المستقبل من غير إضافة غاية غير مصرَّح بها.
- source_word: ἀνοικοδομήσω
  choice: أعيد بناء
  rationale: ينقل معنى البناء مرة أخرى بعبارة عربية طبيعية، ويحافظ تكراره على التوازي الموجود في اليونانية.
- source_word: σκηνὴν Δαυὶδ
  choice: خيمة داود
  rationale: يحافظ على الصورة النبوية كما وردت، بدل تفسيرها مباشرة بأنها بيت داود أو سلالته أو مملكته.
- source_word: τὴν πεπτωκυῖαν
  choice: الساقطة
  rationale: ينقل حالة الخيمة الناتجة من سقوطها، وفق دلالة اسم الفاعل التام في اليونانية.
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: ما تهدَّم منها
  rationale: يعكس معنى الأشياء التي هُدمت أو نُقضت، مع تجنب حصر العبارة في الاسم المجرّد «أنقاض».
- source_word: ἀνορθώσω
  choice: أقيمها من جديد
  rationale: يحافظ على صورة نصب الشيء الساقط وإعادته إلى حاله، ولا يختزل الفعل في معنى لاهوتي تفسيري مثل «أستردّها».
- source_word: αὐτήν
  choice: ها
  rationale: الضمير يعود إلى «الخيمة»، وهي مؤنثة في العربية كما أن σκηνή مؤنثة نحويًا في اليونانية.
theological_decisions:
- issue: الدلالة المجازية لعبارة «خيمة داود»
  choice: 'الإبقاء على الصورة نفسها: «خيمة داود»'
  alternative: بيت داود، أو سلالة داود الساقطة، أو مملكة داود
  rationale: يفهم الاقتباس عادةً بوصفه وعدًا باستعادة مرتبطة بخط داود أو مُلكه، لكن النص اليوناني لا يستبدل الصورة بتفسيرها؛ لذلك تُحفظ الاستعارة ويُذكر مدلولها المحتمل في الحاشية من غير حسم زائد.
translation_notes:
  register: 'العربية فصحى معاصرة واضحة ووقورة. حُفظ تكرار «أعيد بناء» والتتابع التصويري: السقوط، والتهدّم، ثم الإقامة من جديد. وُضعت علامتا الحاشيتين عند العبارة التي تشرحها كل حاشية، مع بقاء علامات الترقيم خارج نص الاقتباس الكتابي قدر الإمكان.'
