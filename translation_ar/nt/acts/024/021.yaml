  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: ar
  text: 'أو عن هذه العبارة الواحدة التي صرختُ بها وأنا واقف بينهم: «إنما أُحاكَم أمامكم اليوم بشأن قيامة الأموات».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الصوت» أو «الصرخة» بدلًا من «العبارة»؛ فاللفظة اليونانية قد تدل على القول المنطوق نفسه أو على الصوت أو الصرخة التي قيل بها.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «القيامة من بين الأموات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: العبارة
  rationale: مع أن اللفظة قد تعني «الصوت» أو «الصرخة»، فإن اقترانها بـ περὶ وورود مضمون القول بعدها يرجّح دلالتها هنا على القول المنطوق نفسه. و«العبارة» عربية طبيعية تحدد التصريح المقصود.
- source_word: ἐκέκραξα
  choice: صرختُ بها
  rationale: الفعل يدل على النطق بصوت مرتفع في مشهد علني؛ وتحفظ «صرختُ» هذه القوة دون تخفيفها إلى مجرد القول.
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: وأنا واقف بينهم
  rationale: تحفظ العبارة معنى الحال في اسم الفاعل، والمعنى المكاني لحرف الجر، بصياغة عربية واضحة.
- source_word: ἀναστάσεως νεκρῶν
  choice: قيامة الأموات
  rationale: هذه الصياغة تنقل تركيب الإضافة مباشرة، وتحفظ عموم القضية المذكورة من غير قصرها على قيامة يسوع وحده.
- source_word: κρίνομαι
  choice: أُحاكَم
  rationale: السياق قضائي، والمضارع المبني للمجهول يدل على خضوع بولس للمحاكمة في الوقت الحاضر. و«أُحاكَم» أفصح وأطبع عربيًا هنا من الترجمة الحرفية «يُحكم عليّ».
- source_word: ἐφ’ ὑμῶν
  choice: أمامكم
  rationale: في السياق القضائي تفيد العبارة المثول أمام سلطة أو محفل، و«أمامكم» لا تجزم بأن المخاطَبين وحدهم هم القائمون بفعل الحكم.
- source_word: ἢ
  choice: أو
  rationale: تحفظ الصلة بما سبق، حيث يستثني بولس احتمال مؤاخذته على أمر واحد، من غير توسيع تفسيري إلى «إلا إذا كان».
- source_word: μιᾶς ταύτης
  choice: هذه ... الواحدة
  rationale: تنقل التشديد على التفرد والتحديد، مع ترتيب عربي طبيعي حول الاسم.
- source_word: σήμερον
  choice: اليوم
  rationale: المقابل العربي المباشر والواضح للظرف الزمني.
theological_decisions:
- issue: طبيعة القضية المختلف عليها
  choice: الإبقاء على التعبير العام «قيامة الأموات»
  alternative: تفسير العبارة على أنها تشير تحديدًا إلى قيامة يسوع
  rationale: 'النص اليوناني عام: περὶ ἀναστάσεως νεκρῶν. لذلك لا ينبغي تضييقه في المتن إلى قيامة يسوع وحده، وإن كان سفر الأعمال يربط رجاء القيامة بقيامته.'
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة قضائية رصينة. استُعملت «إنما» لإبراز أن سبب المحاكمة المحدد هو قضية القيامة، مع الحفاظ على تركيب طبيعي مفهوم للقارئ المعاصر.
