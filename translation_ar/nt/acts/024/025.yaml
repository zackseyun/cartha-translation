  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: ar
  text: 'وبينما كان يتحدث عن البر وضبط النفس والدينونة الآتية، استولى الخوف على فيلكس، فأجاب: «اذهب الآن، ومتى سنحت لي فرصة فسأستدعيك».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: كان يتحدث
  rationale: ينقل معنى العرض والمناقشة بعبارة عربية طبيعية، من غير افتراض حوار متبادل لا يصرح به السياق.
- source_word: δικαιοσύνης
  choice: البر
  rationale: المقابل الكتابي العربي المألوف الذي يحفظ المجال الأخلاقي والقضائي للفظ اليوناني.
- source_word: ἐγκρατείας
  choice: ضبط النفس
  rationale: تعبير عربي واضح يدل على السيطرة على الرغبات والسلوك.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: الدينونة الآتية
  rationale: يحفظ دلالة الحكم القضائي المستقبلية وصيغة العبارة اللاهوتية دون توسع تفسيري.
- source_word: ἔμφοβος γενόμενος
  choice: استولى الخوف على
  rationale: صياغة عربية طبيعية وقوية تفيد أن فيلكس صار خائفًا.
- source_word: Τὸ νῦν ἔχον
  choice: الآن
  rationale: تؤدي العبارة الاصطلاحية بمعنى «في الوقت الحاضر» بإيجاز طبيعي.
- source_word: καιρὸν μεταλαβών
  choice: متى سنحت لي فرصة
  rationale: ينقل معنى نيل وقت أو فرصة مناسبة من غير الجزم بأن الموعد محدد.
- source_word: μετακαλέσομαί σε
  choice: أستدعيك
  rationale: يعبر بدقة عن طلب إحضاره أو استدعائه مرة أخرى.
theological_decisions:
- issue: طبيعة κρίμα المستقبلية
  choice: الدينونة الآتية
  alternative: الحكم الآتي
  rationale: «الدينونة» تحافظ على البعد القضائي والأخروي معًا، من غير تحديد تفاصيل لم يذكرها النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة، مع الحفاظ على إيقاع السرد المباشر والتوتر بين موضوع الدينونة وخوف فيلكس.
