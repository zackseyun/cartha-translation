lexical_decisions:
- source_word: ὃς
  choice: بل
  rationale: الضمير الموصول يعود إلى بولس في سياق اتهام متصل بما قبله. ولأن الآية جزء من جملة ممتدة، تؤدي «بل» وظيفة الاستئناف التصاعدي بصورة طبيعية من غير تكرار ضمير قد يوهم ابتداء جملة مستقلة.
- source_word: καὶ
  choice: أيضًا
  rationale: تفيد هنا إضافة تهمة أشد إلى ما سبق؛ و«أيضًا» تنقل هذا التصاعد بوضوح في العربية.
- source_word: τὸ ἱερὸν
  choice: الهيكل
  rationale: يشير ἱερόν إلى مجمع الهيكل أو ساحاته، لا إلى القدس الداخلي وحده. و«الهيكل» هو المقابل العربي المألوف، مع إمكان فهمه في هذا السياق على أنه حرم الهيكل كله.
- source_word: ἐπείρασεν
  choice: حاول
  rationale: الفعل هنا بمعنى سعى إلى الفعل أو حاول القيام به، و«حاول» عربي واضح ودقيق.
- source_word: βεβηλῶσαι
  choice: أن يدنّس
  rationale: يفيد βεβηλόω انتهاك حرمة المقدس أو تدنيسه. و«يدنّس» يحفظ دلالة النجاسة وانتهاك القداسة بلغة مفهومة.
- source_word: ὃν καὶ ἐκρατήσαμεν
  choice: فأمسكنا به
  rationale: κρατέω يدل على القبض عليه أو الإمساك به. «أمسكنا به» يحفظ الطابع المباشر والفعلي دون تحويل العبارة إلى مصطلح إجرائي مثل «اعتقلناه»، والفاء تصل النتيجة بمحاولة التدنيس اتصالًا طبيعيًا.
theological_decisions:
- issue: الصيغة النصية لأعمال 24:6 إزاء القراءة البيزنطية الأطول
  choice: ترجمة نص SBLGNT الأقصر، المنتهي بعبارة «فأمسكنا به»
  alternative: تضيف بعض المخطوطات أنهم أرادوا محاكمة بولس بحسب شريعتهم، وأن الأمير ليسياس انتزعه من أيديهم، مع اختلاف في الصياغة بين الشواهد.
  rationale: المصدر اليوناني المعطى يتضمن القراءة النقدية الأقصر، فلا تُدمج الزيادة في المتن. وتُذكر القراءة الأطول في الحاشية لأنها معروفة في بعض التقاليد النصية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت طبيعة الآية بوصفها جزءًا من خطاب اتهامي متصل، كما حُفظت الفاصلة الختامية لأن الكلام يستمر في السياق. استُعمل «الهيكل» بالمفهوم الواسع لحرم الهيكل.
