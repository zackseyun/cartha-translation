lexical_decisions:
- source_word: ἢ
  choice: أو
  rationale: تقدّم تحديًا بديلًا في دفاع بولس، وتحافظ «أو» على قوة الرابط ببساطة وطبيعية.
- source_word: αὐτοὶ οὗτοι
  choice: هؤلاء أنفسهم
  rationale: تحفظ الإشارة والتوكيد معًا بصياغة عربية طبيعية.
- source_word: εἰπάτωσαν
  choice: ليقل
  rationale: تنقل صيغة الأمر للغائب في سياق المرافعة القانونية نقلًا مباشرًا.
- source_word: τί εὗρον
  choice: أيَّ ... وجدوا
  rationale: تطلب تحديد المخالفة التي زعموا أنهم وجدوها؛ و«وجدوا» أقرب إلى الفعل اليوناني.
- source_word: ἀδίκημα
  choice: مخالفة
  rationale: تعبّر عن فعل غير مشروع أو جرم في سياق قضائي، من غير تضييق المعنى إلى جريمة محددة.
- source_word: στάντος μου
  choice: حين وقفت
  rationale: تنقل القيمة الزمنية للتركيب المشارك الماضي بإيجاز ووضوح.
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: أمام المجلس
  rationale: تؤدي معنى المثول أمام الهيئة القضائية اليهودية، مع إبقاء الاسم العام في المتن وبيان المقصود في الحاشية.
