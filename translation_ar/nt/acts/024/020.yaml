  text: Or let these men themselves say what wrongdoing they found when I stood before the council,[a]
translation:
  language: ar
  text: أو ليقل هؤلاء أنفسهم أيَّ مخالفة وجدوا عليَّ حين وقفت أمام المجلس،[a]
  philosophy: optimal-equivalence
