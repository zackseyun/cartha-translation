    text: 'أو: «يقبله هؤلاء أنفسهم أيضًا». يمكن أن يعني الفعل اليوناني «ينتظر» أو «يقبل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων
  choice: ولي رجاءٌ
  rationale: يحافظ على الاسم «رجاء» وعلى الصلة بالسياق السابق، ويأتي عربيًا طبيعيًا في كلام بولس.
- source_word: εἰς τὸν θεόν
  choice: في الله
  rationale: تعبير عربي مألوف يدل على أن الله هو متعلَّق الرجاء ووجهته.
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: وهو رجاءٌ ينتظره هؤلاء أنفسهم أيضًا
  rationale: يُظهر عود الضمير إلى الرجاء، ويحفظ توكيد αὐτοὶ οὗτοι، ويترجم προσδέχονται بمعنى الترقب والانتظار الملائم للسياق الأخروي.
- source_word: ἀνάστασιν μέλλειν ἔσεσθαι
  choice: أنه ستكون قيامةٌ
  rationale: ينقل دلالة الاستقبال في التركيب اليوناني بعبارة عربية واضحة من غير إيحاء غير لازم بأن الحدث وشيك جدًا.
- source_word: δικαίων τε καὶ ἀδίκων
  choice: للأبرار والأشرار معًا
  rationale: يحفظ التقابل الأخلاقي وشمول الفئتين الذي يدل عليه τε καὶ، بصياغة عربية طبيعية.
theological_decisions:
- issue: مدى القيامة في قول بولس
  choice: قيامةٌ للأبرار والأشرار معًا
  alternative: قيامة عامة من غير إبراز التمييز الأخلاقي
  rationale: النص اليوناني يسمّي الفئتين صراحة، ولذلك تُحفظ دلالة الشمول والتقابل من غير تقرير توقيت القيامة أو ترتيب الدينونة.
- issue: دلالة προσδέχονται على موقف خصوم بولس
  choice: ينتظره
  alternative: يقبلونه
  rationale: الفعل يحتمل الانتظار أو القبول؛ اختير معنى الانتظار لأنه مباشر في سياق الرجاء الأخروي، مع إثبات البديل المعجمي في الحاشية دون حسم زائد.
