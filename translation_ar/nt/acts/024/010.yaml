translation:
  language: ar
  text: 'فأجاب بولس، بعدما أومأ إليه الوالي أن يتكلم: «إذ أعلم أنك قاضٍ لهذه الأمة منذ سنوات كثيرة، أقدّم دفاعي عما يخصني بكل ثقة.[a]»'
  philosophy: optimal-equivalence
  footnotes:
