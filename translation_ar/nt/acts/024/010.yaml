    text: 'أو: «أقدّم دفاعي بطيب خاطر». يمكن أن يدل الظرف اليوناني على الثقة والشجاعة والاستعداد، أو على طيب النفس والسرور.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε ὁ Παῦλος
  choice: فأجاب بولس
  rationale: الفاء تصل السرد بما قبله اتصالًا طبيعيًا، و«أجاب» هي المقابل المألوف للفعل في سياق الاستجابة لإذن الكلام.
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: بعدما أومأ إليه الوالي أن يتكلم
  rationale: صيغت الإضافة المطلقة جملة زمنية، وحُفظت الإشارة الجسدية في «أومأ» دون اختزالها إلى مجرد الإذن.
- source_word: ἡγεμόνος
  choice: الوالي
  rationale: يدل السياق على صاحب السلطة الرومانية في الإقليم، و«الوالي» تعبير عربي واضح وملائم لسفر الأعمال.
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: منذ سنوات كثيرة
  rationale: تنقل امتداد المدة من الماضي إلى الحاضر، وتحافظ على الصياغة الزمنية في الأصل.
- source_word: ὄντα σε κριτὴν τῷ ἔθνει τούτῳ
  choice: أنك منذ سنوات كثيرة قاضٍ لهذه الأمة
  rationale: تحافظ «قاضٍ» على الدلالة القضائية المباشرة لـκριτής، وتعبّر اللام في «لهذه الأمة» عن الجهة التي يمارس تجاهها القضاء دون إضافة معنى سلطوي زائد.
- source_word: ἐπιστάμενος
  choice: إذ أعلم
  rationale: تحفظ العلاقة السببية أو الظرفية للمشاركة، فتبيّن أن معرفة بولس بخبرة الوالي هي خلفية تقديم دفاعه.
- source_word: εὐθύμως
  choice: بكل ثقة
  rationale: يفيد الظرف الاستعداد ورباطة الجأش أو طيب النفس؛ و«بكل ثقة» طبيعية في المقام القضائي، مع إثبات البديل الدلالي في الحاشية.
- source_word: τὰ περὶ ἐμαυτοῦ
  choice: عما يخصني
  rationale: تعبير عربي طبيعي يشمل القضايا أو الاتهامات المتعلقة ببولس، من غير حصرها في الحديث عن شخصه فقط.
- source_word: ἀπολογοῦμαι
  choice: أقدّم دفاعي
  rationale: ينقل الدلالة القضائية للفعل بصياغة عربية فصيحة وواضحة.
