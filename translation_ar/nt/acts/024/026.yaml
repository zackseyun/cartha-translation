base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: ar
  text: وكان في الوقت نفسه يرجو أن يعطيه بولس مالًا[a]؛ ولذلك كان يرسل في طلبه بوتيرة أكبر ويتحدث معه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتحديد أدق بحسب السياق: «كان يرجو أن ينال رشوة من بولس». واللفظ اليوناني يعني حرفيًا «مالًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: في الوقت نفسه
  rationale: تعبير عربي طبيعي يحفظ معنى التزامن مع أحداث السياق السابق من غير تكلّف في نقل الجسيمين اليونانيين حرفيًا.
- source_word: ἐλπίζων
  choice: كان يرجو
  rationale: المشاركة الحاضرة تصف رجاءً مستمرًا ومتزامنًا مع استدعاء بولس والحديث معه، وصيغة «كان يرجو» تلائم السرد العربي.
- source_word: χρήματα
  choice: مالًا
  rationale: اللفظ اليوناني يعني المال على وجه عام. ومع أن السياق يوحي برشوة، لا يصرّح النص بذلك، لذا يحافظ المتن على عموم اللفظ.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: أن يعطيه بولس
  rationale: تحويل المبني للمجهول اليوناني إلى مبني للمعلوم طبيعي في العربية، مع إبقاء بولس مصدر المال وضمير فيلكس متلقيه بوضوح.
- source_word: διὸ καὶ
  choice: ولذلك
  rationale: يحفظ علاقة النتيجة أو التعليل بين رجائه في المال وكثرة استدعائه لبولس؛ ولا يلزم إظهار καί بلفظ مستقل إذا أدّى السياق وظيفته.
- source_word: πυκνότερον
  choice: مرارًا أكثر
  rationale: يحفظ الصيغة المقارنة في اليونانية، أي أنه صار يستدعيه بتواتر أكبر، بدل تسويتها إلى مجرد «مرارًا».
- source_word: μεταπεμπόμενος
  choice: كان يستدعيه
  rationale: الفعل في هذا السياق يعني أن يطلب إحضار شخص أو يستدعيه، وهو ملائم لوضع بولس في الحبس.
- source_word: ὡμίλει αὐτῷ
  choice: ويتحدث معه
  rationale: يدل الفعل على حديث أو محادثة متبادلة، لا على خطاب رسمي؛ و«يتحدث معه» واضحة وطبيعية.
theological_decisions:
- issue: هل يُصرَّح بأن المال المقصود رشوة؟
  choice: إبقاء «مالًا» في المتن وبيان دلالة السياق في الحاشية
  alternative: 'أن يُترجم: «كان يرجو رشوة من بولس» أو «كان يرجو أن يرشوه بولس»'
  rationale: السياق يكشف دافع فيلكس الفاسد بقوة، لكن χρήματα تعني ببساطة «مالًا». إبقاء اللفظ العام يصون دقة المصدر ولا يحجب الاحتمال السياقي، إذ توضحه الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «مالًا» للمحافظة على عدم التحديد المعجمي، و«مرارًا أكثر» لصون المقارنة في πυκνότερον. وُضع مؤشر الحاشية [a] مباشرة بعد اللفظ الذي تشرحه.
