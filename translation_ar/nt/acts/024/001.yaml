base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: ar
  text: وبعد خمسة أيام، نزل حنانيا رئيس الكهنة ومعه بعض الشيوخ وخطيب يُدعى ترتلس[a]، فقدّموا إلى الوالي اتهامات ضد بولس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «محامٍ يُدعى ترتلس»؛ فقد تدل الكلمة اليونانية على خطيب عام أو وكيل يتولى عرض الدعوى.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: وبعد خمسة أيام
  rationale: تنقل «μετά» مع النصب معنى انقضاء المدة، وتحفظ الواو بخفة وظيفة «δέ» في استمرار السرد.
- source_word: κατέβη
  choice: نزل
  rationale: تحفظ الدلالة الاتجاهية للفعل، إذ كان الانتقال من أورشليم إلى قيصرية يُعبَّر عنه بالنزول.
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: حنانيا رئيس الكهنة
  rationale: صياغة عربية طبيعية تحفظ الاسم والمنصب اليهودي المحدد في السياق.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: ومعه بعض الشيوخ
  rationale: «بعض» تنقل عدم التحديد في «τινῶν»، و«الشيوخ» هنا لقب لقادة يهود لا لشيوخ كنيسة بالضرورة.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: وخطيب اسمه ترتلس
  rationale: «خطيب» تنقل معنى المتحدث المتمرس في مقام عام أو قضائي، و«اسمه» توضح علاقة الاسم بالوصف في عربية مألوفة.
- source_word: οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου
  choice: فعرضوا على الوالي دعواهم ضد بولس
  rationale: السياق قضائي؛ فالفعل يدل على تقديم الأمر رسميًا، و«ضد» تنقل معنى «κατά» مع المضاف إليه.
