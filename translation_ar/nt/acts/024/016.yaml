  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: ar
  text: ولذلك أسعى أنا أيضًا دائمًا إلى أن يكون لي ضمير بلا عثرة[a] أمام الله والناس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ضميرًا لا يسيء إلى أحد» أو «ضميرًا بلا لوم». يدل اللفظ اليوناني على ما لا يسبّب عثرة أو إساءة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ولذلك
  rationale: تفيد العبارة هنا الاستنتاج مما سبق، ولا سيما الرجاء بالقيامة؛ و«ولذلك» عربية طبيعية تحفظ هذا الربط.
- source_word: καὶ αὐτὸς
  choice: أنا أيضًا
  rationale: يحفظ الضمير المنفصل توكيد αὐτός، وتحفظ «أيضًا» دلالة καί الإضافية، من غير إثقال الأسلوب.
- source_word: ἀσκῶ
  choice: أسعى
  rationale: يدل الفعل على بذل جهد وممارسة مستمرة، و«أسعى» أوضح في هذا السياق الأخلاقي من النقل الحرفي «أدرّب».
- source_word: ἀπρόσκοπον
  choice: بلا عثرة
  rationale: يحفظ هذا التعبير صورة اللفظ اليوناني ودلالته على ما لا يوقع في العثرة أو الإساءة، مع إبقاء احتمال تعلق الوصف بالضمير في علاقته بالله والناس.
- source_word: συνείδησιν
  choice: ضمير
  rationale: هو المقابل العربي المألوف للوعي الأخلاقي الداخلي المقصود هنا.
- source_word: ἔχειν
  choice: أن يكون لي
  rationale: صياغة عربية طبيعية لمعنى «أن أمتلك/يكون عندي» بعد فعل السعي.
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: أمام الله والناس
  rationale: تفيد πρός العلاقة والاعتبار تجاه الطرفين؛ و«أمام» تعبّر بوضوح عن المسؤولية في حضرة الله وفي التعامل مع البشر. و«الناس» هو المقابل العربي الطبيعي الشامل لـἀνθρώπους.
- source_word: διὰ παντός
  choice: دائمًا
  rationale: تنقل دلالة الاستمرار في عبارة عربية موجزة وواضحة.
theological_decisions:
- issue: طبيعة الضمير «بلا عثرة» أمام الله والناس
  choice: الإبقاء على التعبير العلاقي «ضمير بلا عثرة»
  alternative: ضمير بلا لوم / ضمير صالح
  rationale: ἀπρόσκοπον لا يعني بالضرورة ادعاء العصمة الأخلاقية، بل ضميرًا لا يتسبب في عثرة أو إساءة في العلاقة بالله والبشر؛ لذا لا ينبغي حسم التوتر إلى براءة مطلقة.
- issue: دلالة ἀνθρώπους العامة
  choice: الناس
  alternative: البشر / الرجال
  rationale: اللفظ اليوناني جمع عام يشمل البشر، و«الناس» يؤدي هذا المعنى في العربية الفصحى طبيعيًا من غير إيحاء بأنه مقصور على الذكور.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. روعي توكيد الفاعل في «أنا أيضًا»، وحُفظ الربط الاستنتاجي بالسياق السابق، مع تجنب لغة طائفية أو تقرير براءة أخلاقية مطلقة.
