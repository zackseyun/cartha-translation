  yaml_path: translation/nt/acts/024/008.yaml
  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: ar
  text: ومنه[a] ستستطيع أنت بنفسك[b]، بعد استجوابه، أن تتحقق من جميع هذه الأمور التي نتهمه بها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بترتيب أقرب إلى اليونانية: «ستستطيع أنت بنفسك، بعد استجوابه، أن تتبيّن منه جميع هذه الأمور التي نتهمه بها».'
    reason: lexical_alternative
  - marker: b
    text: تضيف بعض المخطوطات في الآية 7 عبارة تذكر أن القائد ليسياس انتزع بولس بالقوة وأمر المشتكين أن يأتوا أمام فيلكس؛ أما نص SBLGNT فلا يتضمن تلك العبارة هنا.
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: ومنه
  rationale: تفيد παρά مع المجرور المصدر، أي إن فيلكس يستطيع الحصول من بولس نفسه على المعلومات. و«ومنه» عربية طبيعية تحافظ على الإحالة إلى الشخص المذكور.
- source_word: δυνήσῃ
  choice: ستستطيع
  rationale: الفعل مستقبل ويدل على القدرة؛ وصيغة «ستستطيع» تنقل الزمن والمعنى بوضوح.
- source_word: αὐτὸς
  choice: أنت بنفسك
  rationale: الضمير توكيدي ويبرز أن المخاطَب سيجري الاستجواب شخصيًا.
- source_word: ἀνακρίνας
  choice: بعد استجوابه
  rationale: للفعل في السياق القضائي معنى الفحص أو الاستجواب. واختيار «استجوابه» واضح وطبيعي، مع إبقاء العلاقة الزمنية المحتملة لاسم الفاعل السابق، بدل حصرها في معنى الوسيلة وحده.
- source_word: περὶ πάντων τούτων
  choice: من جميع هذه الأمور
  rationale: تأتي العبارة هنا متعلقة بفعل التحقق، وتنقل شمول الاتهامات المشار إليها بصياغة عربية سليمة.
- source_word: ἐπιγνῶναι
  choice: أن تتحقق
  rationale: يفيد الفعل التوصل إلى المعرفة أو التثبت منها. وفي المقام القضائي تؤدي «تتحقق» معنى الاستيثاق من الوقائع دون المبالغة في دلالة المعرفة الكاملة.
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: التي نتهمه بها
  rationale: صياغة عربية مألوفة تحفظ تركيب الصلة والمعنى القانوني للفعل κατηγορέω مع المجرور.
