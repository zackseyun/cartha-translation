  register: لغة عربية فصحى حديثة واضحة ذات نبرة قضائية رصينة. أُبقي توكيد αὐτός بعبارة «أنت بنفسك»، واختير «بعد استجوابه» للمحافظة على الاحتمال الزمني في اسم الفاعل اليوناني، مع إمكان فهم الاستجواب أيضًا بوصفه وسيلة التحقق.
