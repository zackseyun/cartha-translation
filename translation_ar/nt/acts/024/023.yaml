  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: ar
  text: وأمر قائدَ المئة أن يبقيه تحت الحراسة، وأن يمنحه شيئًا من الحرية، وألّا يمنع أحدًا من خاصته[a] من خدمته والاعتناء بحاجاته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «من خاصته». والمقصود على الأرجح رفاق بولس أو مؤيدوه الذين سُمح لهم بمساعدته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: وأمر
  rationale: ينقل قوة الأمر في سياق سردي عربي طبيعي، مع تحويل صيغة اسم الفاعل اليونانية إلى فعل معطوف مناسب لتتابع الأحداث.
- source_word: τῷ ἑκατοντάρχῃ
  choice: قائدَ المئة
  rationale: تعبير عربي واضح ودقيق عن الضابط الروماني المعروف بالـ centurion.
- source_word: τηρεῖσθαι αὐτόν
  choice: أن يبقيه تحت الحراسة
  rationale: السياق قضائي واحتجازي؛ فالمراد إبقاء بولس محروسًا، لا مجرد مراقبته.
- source_word: ἔχειν τε ἄνεσιν
  choice: وأن يمنحه شيئًا من الحرية
  rationale: ἄνεσις تدل على التخفيف أو الراحة أو قدر من الانفراج؛ وهذه الصياغة توضح أن الحرية محدودة ضمن الحراسة وليست إطلاقًا كاملًا.
- source_word: μηδένα κωλύειν
  choice: وألّا يمنع أحدًا
  rationale: يحفظ النفي الشامل ويؤديه بأسلوب عربي مباشر.
- source_word: τῶν ἰδίων αὐτοῦ
  choice: من خاصته
  rationale: يحافظ على عموم العبارة اليونانية التي تشير إلى الأشخاص المنتمين إلى دائرته، من غير حصرهم في الأقارب أو الأصدقاء.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: من خدمته والاعتناء بحاجاته
  rationale: يعبّر عن تقديم العون العملي والرعاية في سياق الاحتجاز، من غير إيحاء اصطلاحي كنسي خاص.
