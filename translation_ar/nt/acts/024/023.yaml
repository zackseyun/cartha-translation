  register: عربية فصحى معاصرة واضحة ورصينة. حُفظ التوتر بين بقاء بولس تحت الحراسة ومنحه قدرًا من الحرية، ولم تُحدَّد هوية «خاصته» بأكثر مما يسمح به النص اليوناني.
