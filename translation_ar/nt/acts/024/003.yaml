lexical_decisions:
- source_word: πάντῃ
  choice: في كل وجه
  rationale: ينقل معنى الشمول من جهة الكيفية أو الاعتبار، لا الدوام الزمني، ويحافظ على اقترانه بـ«في كل مكان».
- source_word: τε καὶ
  choice: و... و...
  rationale: يربط الظرفين في تركيب عربي طبيعي يحفظ القوة الاقترانية في اليونانية.
- source_word: πανταχοῦ
  choice: في كل مكان
  rationale: مقابل مكاني واضح وطبيعي يحفظ شمول العبارة.
- source_word: ἀποδεχόμεθα
  choice: نقرُّ بهذا
  rationale: الفعل قد يعني القبول أو التلقي أو الترحيب؛ وفي سياق الخطاب الرسمي يدل على الإقرار العلني بالمنافع المنسوبة إلى فيلكس. أُضيف اسم الإشارة لإظهار المفعول المفهوم من السياق.
- source_word: κράτιστε
  choice: يا صاحبَ السعادة
  rationale: لقب تكريمي رسمي مناسب لمخاطبة مسؤول رفيع، ويؤدي وظيفة صيغة التفضيل اليونانية بلغة عربية معاصرة كريمة.
- source_word: Φῆλιξ
  choice: فيلكس
  rationale: نقل صوتي للاسم الشخصي وفق صورته الشائعة في العربية.
- source_word: μετὰ πάσης εὐχαριστίας
  choice: بكل شكر
  rationale: تعبير عربي طبيعي يحفظ معنى الامتنان الكامل المصاحب للإقرار.
