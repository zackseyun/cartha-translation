  rationale: استُبدلت «شيعة» بـ«فرقة» لتفادي التباس طائفي حديث مع الحفاظ على الدلالة التاريخية غير التقنية لـ αἵρεσις، واستُبدل التركيب المطوّل بـ«يسمّونها» لمطابقة النص وتحسين السلاسة. ولا تستلزم الآية حاشية عربية؛ إذ لا يبقى في النص المعتمد غموض لا يمكن للقارئ فهمه من السياق.
