source:
  edition: SBLGNT
  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: ar
  text: 'لكنني أقرّ لك بهذا: أنني بحسب الطريق التي يسمّونها فرقة أعبد إله آبائنا، مؤمنًا بكل ما هو مكتوب في الشريعة والأنبياء.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμολογῶ
  choice: أقرّ
  rationale: يفيد إعلان بولس الصريح أمام فيلكس، ويحافظ على النبرة القضائية من غير أن يوحي باعتراف بالذنب.
- source_word: κατὰ τὴν ὁδόν
  choice: بحسب الطريق
  rationale: يحفظ «الطريق» بوصفها تسمية تاريخية للحركة المسيحية الأولى، ويعبّر عن معنى الموافقة أو السير وفقها.
- source_word: αἵρεσιν
  choice: شيعة
  rationale: تدل هنا على جماعة أو فئة دينية، لا على «هرطقة» بالمعنى العقائدي التقني المتأخر.
- source_word: οὕτως λατρεύω
  choice: هكذا أعبد
  rationale: يربط أسلوب عبادة بولس بالطريق المذكورة قبلها، ويحفظ معنى λατρεύω الديني.
- source_word: τῷ πατρῴῳ θεῷ
  choice: إله آبائنا
  rationale: صياغة عربية طبيعية تنقل معنى الإله الموروث عن آباء إسرائيل، وتبرز استمرارية بولس مع إيمان قومه.
- source_word: πιστεύων
  choice: مؤمنًا
  rationale: يحفظ صيغة اسم الفاعل وعلاقتها بكيفية عبادة بولس ومضمون إيمانه.
- source_word: πᾶσι τοῖς ... γεγραμμένοις
  choice: بكل ما هو مكتوب
  rationale: ينقل الشمول الذي تفيده πᾶσι مع صيغة «المكتوب» القائمة.
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις
  choice: في الشريعة وفي الأنبياء
  rationale: يحفظ التقسيم الكتابي اليهودي إلى الشريعة والأنبياء بصياغة عربية واضحة.
theological_decisions:
- issue: علاقة بولس باليهودية وبالطريق
  choice: تُعرض عبادة بولس بحسب الطريق بوصفها عبادة لإله آباء إسرائيل وإيمانًا بالشريعة والأنبياء.
  alternative: عرض الطريق كديانة منفصلة في تعارض مع اليهودية.
  rationale: النص نفسه يؤكد الاستمرارية مع إله الآباء وكتب إسرائيل، فلا ينبغي إدخال انفصال ديني متأخر في الترجمة.
translation_notes:
  register: 'عربية فصحى معاصرة واضحة ذات نبرة قضائية ودينية رصينة. استُعملت «شيعة» بمعناها العربي الفصيح العام: جماعة أو فئة، لا اسمًا مذهبيًا خاصًا؛ ولم تُضف حاشية لأن النص العربي نفسه لا يحتاج إلى بيان بديل ما لم تقتضِ سياسة النشر ذلك.'
