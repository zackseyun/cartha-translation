  source_fidelity: 'المعنى العام أمين للنص اليوناني: الإقرار القضائي، و«الطريق»، وعبادة إله الآباء، والإيمان بكل المكتوب في الشريعة والأنبياء محفوظة. لكن «شيعة» في العربية المعاصرة يشيع استعمالها اسمًا خاصًا لطائفة بعينها، ولذلك قد تُحدث التباسًا غير مقصود في نقل αἵρεσις هنا.'
  naturalness: التركيب «الطريق التي يقولون عنها إنها شيعة» مفهوم، لكنه مطوّل وأقل مباشرة من الصياغة العربية الطبيعية «الطريق التي يسمّونها فرقة». كما أن تقديم شبه الجملة «بحسب الطريق» يبقي الصلة الأسلوبية بين الطريق وعبادة بولس.
  terminology: «فرقة» أنسب في العربية الفصحى المعاصرة لـ αἵρεσις في هذا المقام؛ فهي تدل على جماعة أو فئة دينية من غير الإيحاء باسم مذهبي عربي محدد أو بمعنى «الهرطقة» التقني. وتبقى «إله آبائنا»، و«الشريعة»، و«الأنبياء» ملائمة وأمينة.
  issues:
  - severity: medium
    issue: لفظة «شيعة» ملتبسة في الاستعمال العربي الحديث.
    rationale: مع أنها قد تعني لغويًا جماعة أو فئة، فإنها تُفهم غالبًا بوصفها اسمًا لطائفة إسلامية معروفة؛ بينما αἵρεσις هنا وصف اتهامي لجماعة/فرقة، لا اسمًا خاصًا ولا حكمًا تقنيًا بالهرطقة.
  - severity: low
    issue: التعبير «يقولون عنها إنها» غير مباشر.
    rationale: الفعل «يسمّونها» ينقل λέγουσιν بصورة أقصر وأفصح في هذا السياق.
