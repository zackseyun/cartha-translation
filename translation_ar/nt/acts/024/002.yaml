source:
  edition: SBLGNT
  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: ar
  text: 'ولمّا استُدعي بولس، بدأ ترتُلُّس يتّهمه قائلًا: «إننا ننعم على يديك بسلام وافر، وتتحقق لهذه الأمة إصلاحات بفضل حسن تدبيرك،»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: ولمّا استُدعي بولس
  rationale: تركيب إضافي مطلق يبيّن الظرف السابق للفعل الرئيس. ذُكر بولس بالاسم لتوضيح مرجع الضمير في العربية، و«استُدعي» تلائم السياق القضائي.
- source_word: ἤρξατο κατηγορεῖν
  choice: بدأ ترتُلُّس يتّهمه
  rationale: يحفظ معنى الشروع في توجيه الاتهام، من غير تحميل العبارة معنى «المقاضاة» الأضيق.
- source_word: ὁ Τέρτυλλος
  choice: ترتُلُّس
  rationale: نقل صوتي للاسم اليوناني بصيغة عربية واضحة.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ
  choice: إننا ننعم على يديك بسلام وافر
  rationale: «ننعم» تؤدي معنى نيل السلام والتمتع به، و«على يديك» تعبّر طبيعيًا عن الوساطة أو الفاعلية في سياق مديح الحاكم.
- source_word: διορθωμάτων γινομένων τῷ ἔθνει τούτῳ
  choice: وتتحقق لهذه الأمة إصلاحات
  rationale: «إصلاحات» تلائم التدابير التصحيحية أو التحسينات الإدارية، و«تتحقق» تحافظ على حياد γινομένων من دون التصريح بفاعل غير مذكور.
- source_word: διὰ τῆς σῆς προνοίας
  choice: بفضل حسن تدبيرك
  rationale: ينقل πρόνοια هنا بوصفها تبصرًا وتخطيطًا إداريًا من جانب الحاكم، بصياغة عربية طبيعية لا توحي بالعناية الإلهية.
theological_decisions:
- issue: دلالة πρόνοια في سياق إداري بشري
  choice: حسن تدبيرك
  alternative: عنايتك أو بُعد نظرك
  rationale: السياق مديح موجّه إلى حاكم بشري بسبب إدارته وتخطيطه؛ لذلك تجنبت «العناية» منفردة لما قد توحي به من دلالة لاهوتية، مع إبقاء معنى التبصر الإداري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة، مع الحفاظ على نبرة التملق القضائي في خطاب ترتُلُّس. لم تُضف حواشٍ لأن البدائل المعجمية لا تستلزم تنبيهًا نصيًا في هذه الآية، ولأن حاشيتي الطبقة الإنجليزية غير متطابقتين مع موضعي علامتيها.
