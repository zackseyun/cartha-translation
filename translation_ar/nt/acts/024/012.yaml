source:
  edition: SBLGNT
  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: ar
  text: ولم يجدوني في الهيكل أجادل أحدًا[a]، ولا أثير تجمهرًا[b]، لا في المجامع ولا في أي موضع من المدينة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أناقش أحدًا» أو «أحاور أحدًا». يمكن أن يدل الفعل اليوناني على الحوار أو المناقشة أو المجادلة؛ ويرجّح سياق الدفاع هنا معنى أقرب إلى المجادلة العلنية.
    reason: lexical_alternative
  - marker: b
    text: أو «أتسبب في تجمّع جمهور». تشير العبارة اليونانية إلى إحداث تجمهر أو اضطراب عام، ولا تستلزم بالضرورة وقوع شغب كامل.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: الهيكل
  rationale: تشير ἱερόν هنا إلى مجمّع الهيكل وساحاته، ولفظ «الهيكل» هو المقابل العربي الطبيعي في هذا السياق.
- source_word: εὗρόν με
  choice: يجدوني
  rationale: يحافظ على صورة الرصد والإثبات في سياق دفاع بولس القضائي، مع ملاءمة النفي السابق للفعل في العربية.
- source_word: πρός τινα διαλεγόμενον
  choice: أجادل أحدًا
  rationale: يمكن أن يدل διαλέγομαι على المناقشة أو المحاورة أو المجادلة؛ و«أجادل» يلائم سياق نفي تهمة إثارة الاضطراب من غير أن يحصر الفعل في خصومة حادة.
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: أثير تجمهرًا
  rationale: ينقل معنى التسبب في تجمع أو اضطراب جماهيري، من غير المبالغة إلى معنى الشغب الكامل أو التحريض على غوغاء.
- source_word: ὄχλου
  choice: تجمهرًا
  rationale: يعبر عن اجتماع جمهور في هذا التركيب، ولا يضيف إيحاء العنف الذي قد يحمله لفظ «غوغاء».
- source_word: συναγωγαῖς
  choice: المجامع
  rationale: المقابل العربي المألوف للمجامع اليهودية في سياق سفر الأعمال.
- source_word: κατὰ τὴν πόλιν
  choice: في أي موضع من المدينة
  rationale: ينقل الدلالة التوزيعية لعبارة κατά مع المفعول به، أي في أنحاء المدينة، ويأتي طبيعيًا تحت نطاق النفي.
