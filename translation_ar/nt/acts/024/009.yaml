  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεπέθεντο
  choice: انضمَّ إلى الاتهام
  rationale: يفيد الفعل المشاركة في هجوم أو تحرك ضد شخص. وفي سياق المحاكمة، يعبّر «انضمّ إلى الاتهام» طبيعيًا عن تأييد اليهود اتهامات ترتلس والمشاركة فيها، من غير الإيحاء باعتداء جسدي.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تتابع السرد، والواو هي المقابل العربي الطبيعي هنا من غير افتعال معنى الاستدراك.
- source_word: καὶ
  choice: أيضًا
  rationale: تضيف اليهود إلى من باشروا توجيه الاتهامات.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: نقل مباشر يشير في السياق إلى الجماعة اليهودية المشاركة في جلسة المحاكمة، من غير توسيعها لتشمل جميع اليهود.
- source_word: φάσκοντες
  choice: مؤكدين
  rationale: اسم الفاعل يدل على تصريحهم الجازم بصحة ما قيل، ويلائم السياق القضائي.
- source_word: ταῦτα οὕτως ἔχειν
  choice: أن الأمر كان كذلك
  rationale: هذا تعبير اصطلاحي معناه أن ما ذُكر صحيح أو واقع على النحو الموصوف. والصياغة العربية طبيعية وتحفظ الإحالة العامة إلى الاتهامات السابقة.
