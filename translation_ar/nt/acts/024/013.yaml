  text: ⸀οὐδὲ ⸀παραστῆσαι δύνανταί ⸀σοι περὶ ὧν ⸀νυνὶ κατηγοροῦσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: ar
  text: ولا يستطيعون أن يثبتوا لك صحة ما يتهمونني به الآن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يعرضوا عليك» أو «أن يقيموا أمامك الدليل على»؛ فالفعل اليوناني قد يعني التقديم أو الإثبات، والمقصود هنا إثبات الاتهام في سياق قضائي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: ولا
  rationale: تصل النفي بما سبق في دفاع بولس، وهي صياغة عربية طبيعية تحافظ على القوة الاستمرارية للأداة.
- source_word: παραστῆσαι
  choice: يثبتوا صحة
  rationale: للفعل معنى التقديم أو الإقامة والإثبات؛ وفي السياق القضائي يدل على إقامة الدليل الذي يثبت الاتهام.
- source_word: δύνανταί
  choice: يستطيعون
  rationale: ينقل معنى القدرة بصياغة عربية واضحة ومباشرة.
- source_word: σοι
  choice: لك
  rationale: ينقل ضمير المخاطب الدال على فيلكس من غير إضافة تفسيرية، مع أن السياق القضائي ظاهر.
- source_word: περὶ ὧν
  choice: ما ... به
  rationale: صياغة عربية طبيعية للتركيب الموصول، تشير إلى الأمور موضوع الاتهام من غير حصرها اصطلاحيًا في «التهم».
- source_word: νυνὶ
  choice: الآن
  rationale: يحافظ على الإشارة الزمنية إلى الاتهام القائم وقت المحاكمة.
- source_word: κατηγοροῦσίν μου
  choice: يتهمونني به
  rationale: ينقل المعنى القضائي للفعل ووقوع الاتهام على المتكلم بصياغة عربية مألوفة.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «يثبتوا صحة» لإبراز القوة القضائية للفعل من غير إغفال بدائله المعجمية، المثبتة في الحاشية.
