  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: ar
  text: ولمّا انقضت سنتان، خَلَفَ بوركيوس فستوس فيلكس في منصبه. ولأن فيلكس أراد أن يكسب حظوة لدى اليهود[a]، ترك بولس مقيَّدًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يُسدي إلى اليهود معروفًا». يمكن أن يعني التعبير اليوناني إسداء معروف إليهم أو كسب حسن إرادتهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: ولمّا انقضت سنتان
  rationale: ينقل التركيب المطلق بالجر بوصفه ظرفًا زمنيًا، ويؤدي اكتمال مدة السنتين بعبارة عربية طبيعية واضحة.
- source_word: ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον
  choice: خَلَفَ بوركيوس فستوس فيلكس في منصبه
  rationale: المعنى الحرفي أن فيلكس «تلقّى خليفة»، لكن العربية الطبيعية تعبّر عن انتقال المنصب بفعل «خَلَفَ». وأضيف «في منصبه» لإيضاح جهة الخلافة من غير إضافة مضمون جديد.
- source_word: Πόρκιον Φῆστον
  choice: بوركيوس فستوس
  rationale: نقل صوتي للاسم الروماني بصيغة عربية واضحة.
- source_word: θέλων
  choice: ولأن فيلكس أراد
  rationale: اسم الفاعل يبيّن الدافع إلى ترك بولس مقيّدًا، فصيغت العلاقة سببية بوضوح.
- source_word: χάριτα καταθέσθαι
  choice: أن يكسب حظوة
  rationale: التعبير اليوناني اصطلاحي، ويمكن أن يدل على تحصيل حسن الإرادة أو على إسداء معروف. اختير معنى كسب الحظوة في المتن لملاءمته للسياق، مع حفظ الوجه الآخر في الحاشية.
- source_word: τοῖς Ἰουδαίοις
  choice: لدى اليهود
  rationale: تلائم العبارة العربية «يكسب حظوة لدى» وتعبّر عن طلب قبول اليهود وحسن إرادتهم.
- source_word: κατέλιπε
  choice: ترك
  rationale: يدل على أن فيلكس أبقى بولس في حاله عند مغادرته المنصب.
- source_word: δεδεμένον
  choice: مقيَّدًا
  rationale: يحفظ دلالة اسم المفعول التام على استمرار حالة التقييد، من غير حصرها بالضرورة في سلاسل بعينها.
