source:
  edition: SBLGNT
  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: ar
  text: وبعد سنواتٍ عديدة، جئتُ لأقدِّم صدقاتٍ[a] لأمتي، وكذلك تقدماتٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أعمال إحسان». يشير اللفظ اليوناني إلى عطايا خيرية تُقدَّم للمحتاجين.'
    reason: بديل معجمي يوضح الدلالة العملية للفظ «الصدقات».
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: وبعد سنواتٍ عديدة
  rationale: تنقل «بعد» معنى مرور مدة زمنية، وتحمل الواو قوة δέ الرابطة الخفيفة، بينما تعبّر «سنوات عديدة» عن πλειόνων في هذا السياق من غير إضافة ظرف غير موجود في الأصل.
- source_word: ἐλεημοσύνας
  choice: صدقات
  rationale: لفظ عربي واضح وشائع يدل على العطايا المقدَّمة للمحتاجين، وهو المقابل الطبيعي لمعنى اللفظ اليوناني هنا.
- source_word: ποιήσων
  choice: لأقدِّم
  rationale: اسم الفاعل المستقبلي يفيد الغرض هنا، وتركيب ποιέω مع «الصدقات» يعني فعل الإحسان أو إعطاء الصدقات، لا مجرد «الصنع» الحرفي.
- source_word: εἰς τὸ ἔθνος μου
  choice: لأمتي
  rationale: يحفظ معنى ἔθνος بوصفه الأمة التي ينتمي إليها بولس، وتؤدي اللام جهة الانتفاع المقصودة في السياق.
- source_word: παρεγενόμην
  choice: جئتُ
  rationale: ترجمة موجزة وطبيعية لفعل المجيء والوصول في تقرير بولس عن حضوره إلى أورشليم.
- source_word: προσφοράς
  choice: تقدمات
  rationale: تحفظ عموم اللفظ الذي قد يدل على تقدمات ذات طابع تعبدي، من غير تحديد نوعها بما لا يصرّح به النص.
theological_decisions:
- issue: طبيعة العمل الخيري الذي جاء به بولس
  choice: صدقات
  alternative: عطايا للمحتاجين؛ أعمال إحسان
  rationale: الاختيار معجمي لا مذهبي؛ فهو يبيّن المعنى الخيري الملموس للفظ اليوناني بلغة عربية مألوفة من غير تضييق دلالته بعقيدة خاصة.
- issue: علاقة «لأمتي» بالصدقات والتقدمات
  choice: ربط «لأمتي» بالصدقات، مع فصل التقدمات بعبارة «وكذلك»
  alternative: جعل الصدقات والتقدمات كلتيهما مقدمتين للأمة
  rationale: ترتيب اليونانية يضع عبارة «إلى أمتي» مع غرض تقديم الصدقات قبل إضافة «والتقدمات». الصياغة المختارة تحافظ على هذا الاحتمال التركيبي من غير الجزم بطبيعة التقدمات أو وجهتها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أمتي» للمحافظة على دلالة الأمة في ἔθνος، و«تقدمات» لترك نوع προσφοράς مفتوحًا كما في الأصل.
