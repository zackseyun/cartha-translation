    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: ولكن، لئلا
  rationale: تنقل «لكن» الانتقال الاستدراكي اللطيف، وتحفظ «لئلا» معنى الغاية المنفية في العبارة اليونانية.
- source_word: ἐπὶ πλεῖόν
  choice: أكثر
  rationale: تؤدي معنى الاستمرار أو الزيادة في هذا التركيب، أي عدم أخذ مزيد من وقت الوالي.
- source_word: σε ἐγκόπτω
  choice: أشغلك
  rationale: الفعل يدل على الإعاقة أو التعطيل، لكنه في سياق المرافعة المهذبة يشير إلى إشغال المخاطَب وأخذ مزيد من وقته؛ و«أشغلك» طبيعية ولا توحي بالاحتجاز القانوني.
- source_word: παρακαλῶ
  choice: ألتمس منك
  rationale: تعكس الطلب المهذب والملحّ في خطاب قضائي رسمي من غير مبالغة في التذلل.
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: أن تستمع إلينا
  rationale: تنقل معنى السماع المقصود، أي الإصغاء إلى كلام المتحدثين، وتلائم السياق القضائي.
- source_word: συντόμως
  choice: بإيجاز
  rationale: تفيد قِصر الكلام، وهي صياغة عربية طبيعية في هذا السياق.
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: بحِلمك
  rationale: «الحِلم» يجمع الرفق وضبط النفس والتسامح في الحكم، ويحفظ شيئًا من الثقل القضائي لكلمة ἐπιείκεια. وقُدّمت العبارة في العربية لتتصل طبيعيًا بالالتماس.
