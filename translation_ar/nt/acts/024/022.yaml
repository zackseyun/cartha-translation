  - severity: medium
    issue: «أجّلهم» ملتبسة في العربية القانونية.
    rationale: الفعل اليوناني يتخذ ضمير الأشخاص مفعولًا، لكن المقابل الحرفي غير مألوف عربيًا. «أرجأ النظر في أمرهم» ينقل بوضوح معنى التأجيل القضائي من غير تغيير معنى الآية.
  - severity: low
