  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: ar
  text: 'لكن فيلكس، إذ كانت له معرفة أدقّ بشؤون الطريق[b]، أرجأ النظر في أمرهم[a]، قائلًا: «عندما ينزل ليسياس القائد، أفصل في قضيتكم[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أجّل الإجراءات»؛ يمكن أن يعني الفعل اليوناني إرجاء الإجراء القضائي أو رفع الجلسة.
    reason: lexical_alternative
  - marker: b
    text: كان «الطريق» من التسميات المبكرة للحركة المسيحية.
    reason: cultural_note
  - marker: c
    text: أو «أبتّ في الأمور المتعلقة بكم».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο
  choice: أجّلهم
  rationale: يحفظ المفعول الشخصي الصريح αὐτούς، وينقل معنى إرجاء الإجراء القضائي دون أن يستبدل الأشخاص صراحةً بالقضية.
- source_word: ἀκριβέστερον εἰδὼς
  choice: إذ كان أعرف بدقة
  rationale: يحفظ القوة المقارنة في ἀκριβέστερον ومعنى المعرفة، مع صياغة عربية واضحة تربط هذه المعرفة بقرار التأجيل.
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: بما يخص الطريق
  rationale: «الطريق» تسمية شبه اصطلاحية للحركة المسيحية في سفر الأعمال، والصياغة لا تضيف اسم إشارة غير موجود في اليونانية.
- source_word: χιλίαρχος
  choice: القائد
  rationale: لفظ واضح معاصر يدل هنا على القائد العسكري الروماني، من غير نقل صوتي غامض أو شرح زائد داخل المتن.
- source_word: Ὅταν ... καταβῇ
  choice: متى نزل
  rationale: ينقل الحدث المستقبلي المنتظر ويحفظ فعل النزول الوارد في الأصل، الملائم للتعبير الجغرافي القديم.
- source_word: διαγνώσομαι
  choice: أفصل
  rationale: «أفصل في» تعبير قضائي عربي طبيعي يفيد البتّ بعد النظر.
- source_word: τὰ καθ’ ὑμᾶς
  choice: في قضيتكم
  rationale: ينقل الاصطلاح اليوناني إلى عبارة قانونية عربية واضحة، مع إثبات البديل الأقرب إلى اللفظ في الحاشية.
theological_decisions:
- issue: دلالة «الطريق»
  choice: الإبقاء على «الطريق» بوصفها تسمية للحركة من دون توسيع تفسيري في المتن
  alternative: التصريح بـ«المسيحية» أو «أتباع يسوع»
  rationale: يحفظ لغة سفر الأعمال وتوترها التاريخي، بينما توضح الحاشية الدلالة الثقافية للقارئ.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعمل «أجّلهم» للمحافظة على الضمير الجمع في الأصل مع إيضاح المعنى القضائي في الحاشية، و«أفصل في قضيتكم» لصياغة قانونية عربية طبيعية.
