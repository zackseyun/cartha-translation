  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: ar
  text: بل كان ينبغي لبعض اليهود القادمين من ولاية آسيا[a] أن يحضروا أمامك ويتهموني[b]، إن كان لديهم شيء ضدي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود بـ«آسيا» هنا الولاية الرومانية الواقعة في آسيا الصغرى، لا قارة آسيا الحديثة.
    reason: cultural_note
  - marker: b
    text: 'أو: «يوجّهوا إليّ اتهامًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: بل ... لبعض
  rationale: تنقل «بل» قوة المقابلة في δὲ مع الكلام السابق، ويدل «بعض» على جماعة غير محددة.
- source_word: ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: بعض اليهود القادمين من ولاية آسيا
  rationale: يحافظ التعبير على هوية الجماعة ومنشئها، مع توضيح أن آسيا هنا ولاية رومانية لا القارة الحديثة.
- source_word: ἔδει
  choice: كان ينبغي
  rationale: ينقل الماضي الناقص الدال على وجوب كان قائمًا ولم يتحقق.
- source_word: ἐπὶ σοῦ παρεῖναι
  choice: أن يحضروا أمامك
  rationale: صياغة عربية طبيعية تلائم سياق المثول أمام الحاكم في مجلس القضاء.
- source_word: κατηγορεῖν
  choice: ويتهموني
  rationale: فعل قضائي مباشر يدل على توجيه الاتهام، مع إثبات البديل الأكثر اصطلاحية في الحاشية.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: إن كان لديهم شيء ضدي
  rationale: يحفظ عموم «شيء» ولا يخصصه بتهمة بعينها، كما ينقل الطابع الاحتمالي للصيغة اليونانية.
