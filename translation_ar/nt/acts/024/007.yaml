  yaml_path: translation/nt/acts/024/007.yaml
  text: But[a] Lysias the commander came and took him out of our hands with great force,
translation:
  language: ar
  text: لكنَّ لِيسِيَاسَ قائدَ الكتيبة جاء وانتزعه من أيدينا بقوة شديدة،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية، ومعها أواخر الآية 6 وأوائل الآية 8، غير موجودة في أقدم المخطوطات اليونانية، ومنها البردية 74 من القرن الثالث، والمخطوطتان السينائية والفاتيكانية من القرن الرابع، كما تغيب عن الترجمات القبطية المبكرة. لكنها محفوظة في تقليد أغلبية المخطوطات البيزنطية، والتقليد اللاتيني، ومخطوطات يونانية متأخرة. ويبدو نصها توسعًا تحريريًا مبكرًا يروي تدخل القائد الروماني ضمن خطاب الاتهام أمام فيلكس.
    reason: textual_critical
lexical_decisions:
- source_word: παρελθών
  choice: جاء
  rationale: اسم الفاعل الأوريستي من παρέρχομαι يدل هنا على مجيء ليسياس إلى موضع الحدث؛ وصيغ فعلًا تامًّا بالعربية لتسلسل سردي طبيعي.
- source_word: χιλίαρχος
  choice: قائد الكتيبة
  rationale: لقب عسكري روماني يعني حرفيًا قائد ألف، ويشير إلى ضابط رفيع برتبة تريبون؛ و«قائد الكتيبة» تعبير واضح يحفظ الدلالة العسكرية من غير استعمال لقب تاريخي غامض للقارئ العام.
- source_word: μετὰ πολλῆς βίας
  choice: بقوة شديدة
  rationale: ينقل معنى استعمال قدر كبير من القوة الجسدية، من غير أن يحمّل العبارة بالضرورة إيحاء العنف الخبيث.
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: انتزعه من أيدينا
  rationale: الفعل ἀπάγω يعني اقتاد أو أخذ بعيدًا، والعبارة العربية المختارة تنقل بقوة وإيجاز إخراجه من قبضتهم، مع بقاء أثر μετὰ πολλῆς βίας ظاهرًا في «بقوة شديدة».
