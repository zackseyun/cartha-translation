  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: ar
  text: وبعد بضعة أيام، جاء فيلكس مع دروسيلا زوجته، وكانت يهودية، فاستدعى بولس وسمع منه عن الإيمان[a] بالمسيح يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الثقة بالمسيح يسوع». يمكن أن تحمل الكلمة اليونانية معنى «الثقة»، مع أن «الإيمان» هو المقابل الأعم هنا.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: وبعد بضعة أيام
  rationale: تؤدي العبارة الزمنية بمعناها المباشر، وتحفظ δέ بواو ربط خفيفة تلائم السرد العربي من غير إضافة معنى «الآن».
- source_word: παραγενόμενος
  choice: جاء
  rationale: اسم الفاعل الظرفي يدل على حضور فيلكس أو مجيئه، و«جاء» تعبير عربي طبيعي في سياق السرد.
- source_word: σὺν Δρουσίλλῃ τῇ ἰδίᾳ γυναικὶ
  choice: مع دروسِلّا زوجته
  rationale: تحفظ المصاحبة وعلاقة الزوجية بعبارة عربية طبيعية؛ والضمير في «زوجته» يؤدي معنى الملكية الذي يشدد عليه ἰδίᾳ من غير تركيب ثقيل مثل «زوجته الخاصة».
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: وكانت يهودية
  rationale: تنقل الوصف بوضوح وتحافظ على إمكان دلالته على الانتماء اليهودي إثنيًا أو دينيًا من غير تخصيص زائد.
- source_word: μετεπέμψατο
  choice: فاستدعى
  rationale: الفعل يعني أنه أرسل في طلب بولس؛ و«استدعى» موجز وطبيعي في هذا المقام.
- source_word: ἤκουσεν αὐτοῦ
  choice: وسمع منه
  rationale: التركيب اليوناني مع المضاف إليه يفيد السماع من بولس أو الإصغاء إليه، و«سمع منه» ينسجم طبيعيًا مع ذكر موضوع الكلام بعده.
- source_word: περὶ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: عن الإيمان بالمسيح يسوع
  rationale: περί يحدد موضوع الحديث، وπίστις مع εἰς تدل هنا بأقوى احتمال على إيمان متجه إلى المسيح يسوع. الباء في العربية هي الصياغة المألوفة لـ«الإيمان بشخص».
- source_word: Χριστὸν Ἰησοῦν
  choice: المسيح يسوع
  rationale: Χριστός لقب، ولذلك تُرجم «المسيح»، مع إبقاء ترتيب اللقب والاسم كما في اليونانية.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: تحفظ الصياغة المختارة قوة «المسيح» بوصفه لقبًا، وتلتزم ترتيب النص اليوناني. أما «يسوع المسيح» فصياغة عربية مألوفة لكنها تعكس ترتيب الكلمتين.
- issue: دلالة πίστις مع εἰς
  choice: الإيمان بالمسيح يسوع
  alternative: الثقة بالمسيح يسوع
  rationale: التركيب يدل غالبًا على الإيمان الموجَّه إلى المسيح يسوع، لا على أمانته هو. ومع ذلك يمكن أن تحمل πίστις معنى الثقة، ولذلك أُثبت البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت الواو لحفظ حركة السرد، وتُجنب التعبير الحرفي الثقيل في «زوجته الخاصة». وُضع مؤشر الحاشية بعد العبارة التي يشرحها مباشرة.
