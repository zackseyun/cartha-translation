  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: ar
  text: فقد وجدنا هذا الرجل وباءً، يثير الفتن بين جميع اليهود في المسكونة، وهو أيضًا قائد طائفة الناصريين،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: وباءً
  rationale: يحافظ على الاستعارة الاتهامية الحادة في اليونانية، حيث يُصوَّر الرجل كخطر منتشر ومفسد، بدل تخفيفها إلى «مزعج» أو «آفة».
- source_word: κινοῦντα στάσεις
  choice: يثير الفتن
  rationale: στάσεις في هذا السياق تفيد الاضطرابات أو الفتن ذات الطابع العام؛ و«يثير الفتن» تعبير عربي طبيعي يلائم صيغة الاتهام من غير أن يحسم أنها أعمال شغب وقعت فعلًا.
- source_word: οἰκουμένην
  choice: المسكونة
  rationale: مقابل عربي كتابي موجز للعالم المأهول أو العالم المعروف، ويحافظ على الاتساع البلاغي للاتهام.
- source_word: πρωτοστάτην
  choice: من زعماء
  rationale: يدل اللفظ على شخص متقدم أو قائد بارز. صيغة «من زعماء» طبيعية وتحافظ على كونه قائدًا دون الإيحاء بالضرورة بأنه الزعيم الوحيد.
- source_word: αἱρέσεως
  choice: شيعة
  rationale: هنا تعني جماعة أو فرقة متميزة، لا «هرطقة» بوصفها حكمًا عقائديًا متأخرًا؛ و«شيعة» تؤدي معنى الفئة المتبعة في هذا السياق القضائي التاريخي.
- source_word: Ναζωραίων
  choice: الناصريين
  rationale: النسبة التاريخية المباشرة إلى الناصريين، وهي تسمية الجماعة في خطاب الاتهام.
theological_decisions:
- issue: دلالة αἵρεσις على جماعة دينية
  choice: شيعة
  alternative: بدعة / طائفة
  rationale: تُجنِّب «بدعة» الحكم اللاهوتي السلبي الذي لا يفرضه اللفظ هنا، بينما تعكس «شيعة» جماعة متميزة ذات أتباع في لغة عربية فصيحة مفهومة.
- issue: درجة قيادة بولس في العبارة πρωτοστάτην
  choice: من زعماء
  alternative: زعيم
  rationale: يحفظ معنى القيادة البارزة من غير الجزم بأنه القائد الأوحد للناصريين.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة قضائية اتهامية. حُفظت الاستعارة القوية «وباءً» والمبالغة «جميع اليهود في المسكونة»، مع تجنب تحويل توصيف الجماعة إلى إدانة عقائدية لاحقة.
