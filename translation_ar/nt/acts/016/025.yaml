lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: ونحو منتصف الليل
  rationale: 'تفيد κατά مع اسم الزمان في حالة النصب معنى التقريب: «نحو/حوالي». ونقلت δέ بواو ربط خفيفة تلائم جريان السرد من غير إظهار مقابلة قوية.'
- source_word: Παῦλος καὶ Σιλᾶς
  choice: بولس وسيلا
  rationale: الصيغتان العربيتان المألوفتان للاسمين في سياق العهد الجديد.
- source_word: προσευχόμενοι
  choice: كان ... يصلّيان
  rationale: اسم الفاعل المضارع يدل على فعل مستمر ومتزامن مع ὕμνουν؛ وتركيب «كان ... يصلّيان ويرنّمان» ينقل الاستمرار طبيعيًا.
- source_word: ὕμνουν
  choice: يرنّمان
  rationale: الفعل ὑμνέω يدل على إنشاد التسبيح؛ و«يرنّمان» تعبير عربي طبيعي يحفظ معنى الغناء التعبدي.
- source_word: τὸν θεόν
  choice: لله
  rationale: مع فعل الترنيم، تفيد اللام أن الله هو المقصود بالتسبيح، في عبارة عربية موجزة وطبيعية.
- source_word: ἐπηκροῶντο
  choice: يصغون
  rationale: يدل الفعل، بصيغته الناقصة، على استماع مستمر، وقد يحمل معنى الانتباه. «يصغون» يحفظ هذا الإيحاء بصورة موجزة.
- source_word: οἱ δέσμιοι
  choice: السجناء
  rationale: ترجمة واضحة وحديثة لمن كانوا في الأسر أو القيود ضمن سياق السجن.
