lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: ولمّا طلع النهار
  rationale: ترجمة طبيعية للتركيب الإضافي المطلق الدال على الانتقال الزمني، مع تمثيل δέ بالواو وحفظ معنى مجيء النهار.
- source_word: ἀπέστειλαν
  choice: أرسل
  rationale: ينقل المعنى المباشر للفعل في صيغة الماضي، وهو أوضح تعبير عربي في السياق.
- source_word: οἱ στρατηγοὶ
  choice: الحُكّام
  rationale: يدل اللفظ هنا على أصحاب السلطة المدنية في مستعمرة فيلبي الرومانية، لا على قادة عسكريين بالمعنى المعتاد.
- source_word: τοὺς ῥαβδούχους
  choice: حَمَلة العِصيّ
  rationale: يحفظ المعنى الحرفي والصورة الملموسة لموظفي الحُكّام الرسميين الذين كانوا يحملون العصي رمزًا للسلطة، مع توضيح المصطلح التاريخي في الحاشية.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ على الصلة الحالية التي يقدم بها اسم الفاعل مضمون الرسالة.
- source_word: Ἀπόλυσον
  choice: أطلِق سراح
  rationale: يناسب صيغة الأمر المفرد والسياق القانوني المتعلق بالإفراج عن السجينين.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: ذينك الرجلين
  rationale: المقصود بولس وسيلا، وهما رجلان، وصيغة المثنى العربية تنقل المرجع بدقة وطبيعية.
