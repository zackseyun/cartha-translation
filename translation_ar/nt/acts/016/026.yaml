  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: ar
  text: وفجأة حدث زلزال عظيم، حتى تزعزعت أُسُس السجن[a]، وفي الحال انفتحت الأبواب كلها، وانحلَّت قيود الجميع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الحبس». تشير الكلمة اليونانية δεσμωτήριον إلى مكان الاحتجاز.
    reason: lexical_alternative
  - marker: b
    text: أو «انفكَّ وثاق الجميع». يمكن أن تعني δεσμά «القيود» أو «الوثاق»، وأن تُترجم ἀνέθη بـ«انحلَّت» أو «انفكَّت».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: وفجأة
  rationale: تفيد وقوع الحدث على نحو مباغت، و«فجأة» هي العبارة العربية الطبيعية التي تحفظ قوة السرد.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: حدث زلزال عظيم
  rationale: تنقل تركيب γίνομαι مع الاسم بصياغة عربية واضحة، وتحفظ وصف μέγας من غير تضييقه إلى معنى الشدة وحدها.
- source_word: ὥστε σαλευθῆναι
  choice: حتى تزعزعت
  rationale: تعبّر «حتى» هنا عن النتيجة، و«تزعزعت» تنقل المبني للمجهول اليوناني دلاليًا بصياغة عربية طبيعية.
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: أُسُس السجن
  rationale: «أُسُس» تشير إلى دعائم البناء، و«السجن» هو المقابل العربي الأوضح والأعم لمكان الاحتجاز.
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: انفتحت الأبواب كلها
  rationale: الفعل العربي المطاوع «انفتحت» يعبّر طبيعيًا عن وقوع الفتح من غير ذكر الفاعل، و«كلها» تحفظ شمول πᾶσαι.
- source_word: παραχρῆμα
  choice: في الحال
  rationale: تفيد أن الأمر وقع فورًا، وهي عبارة عربية فصيحة وواضحة في السياق السردي.
- source_word: πάντων
  choice: الجميع
  rationale: المضاف إليه الجمعي يدل على أن القيود تخص جميع المسجونين، و«الجميع» موجزة وطبيعية.
- source_word: τὰ δεσμὰ
  choice: قيود
  rationale: تدل δεσμά على وسائل التقييد، وقد تكون سلاسل أو وثاقًا؛ لذلك تحافظ «قيود» على سعة الدلالة.
- source_word: ἀνέθη
  choice: انحلَّت
  rationale: ينقل معنى الإرخاء أو الفك الناتج عن الفعل من غير أن يضيف أن المسجونين خرجوا أو تحرروا بالكامل.
