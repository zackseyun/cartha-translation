  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: ar
  text: 'وكانت تتبع بولس وإيانا، وتصرخ قائلةً: «هؤلاء الرجال عبيد الله العلي، وهم يعلنون لكم طريقًا للخلاص[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «طريق الخلاص». جاءت كلمة «طريق» في اليونانية بلا أداة تعريف، ولذلك يمكن فهم العبارة منكرة أو معرفة بحسب السياق.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: تواصل السير وراء
  rationale: ينقل استمرار الفعل الذي يفيده اسم الفاعل المضارع مع الفعل الناقص، ويعبّر طبيعيًا عن تعقّبها بولس ورفاقه.
- source_word: ἔκραζεν
  choice: تصرخ
  rationale: يحفظ معنى النداء المرتفع والمتكرر أو المستمر الذي تدل عليه صيغة الماضي الناقص، من غير افتراض انفعال محدد.
- source_word: δοῦλοι
  choice: عبيد
  rationale: يحفظ دلالة الانتماء والخضوع لسيد، وهي أوضح هنا من مجرد «خدّام».
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: الله العلي
  rationale: صياغة عربية طبيعية وموقرة للقب الإلهي، وتحفظ معنى ὕψιστος بوصفه «العلي».
- source_word: καταγγέλλουσιν
  choice: يعلنون
  rationale: ينقل معنى الإعلان العلني بوضوح، مع الحفاظ على زمن المضارع.
- source_word: ὑμῖν
  choice: لكم
  rationale: يمثل المفعول غير المباشر، أي إن المخاطبين هم متلقو الإعلان.
- source_word: ὁδὸν σωτηρίας
  choice: طريقًا للخلاص
  rationale: يحفظ غياب أداة التعريف في اليونانية ويأتي عربيًا بصياغة واضحة، مع إبقاء احتمال الفهم المعرّف في الحاشية.
theological_decisions:
- issue: تعريف ὁδὸν σωτηρίας أو تنكيره
  choice: طريقًا للخلاص
  alternative: طريق الخلاص
  rationale: الاسم ὁδόν غير مسبوق بأداة تعريف، فحافظ المتن على التنكير ولم يحسم الدلالة لاهوتيًا، مع التنبيه إلى القراءة المعرّفة الممكنة في الحاشية.
translation_notes:
  register: لغة عربية فصحى واضحة وموقرة. استُعملت «إيّانا» بعد «وراء» لتجنب عطف ضمير منفصل على اسم على نحو ثقيل، وحُفظت بنية القول المباشر واستمرارية الأفعال.
