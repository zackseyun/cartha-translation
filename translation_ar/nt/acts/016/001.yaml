  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: ar
  text: ووصل أيضًا إلى دِرْبَة ولِسْتَرَة. وإذا كان هناك تلميذ اسمه تيموثاوس، ابن امرأة يهودية مؤمنة[a]، وأبوه يوناني[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «امرأة يهودية أمينة». قد تعني الصفة اليونانية «مؤمنة» أو «أمينة»، غير أن معنى «مؤمنة» هو الأرجح هنا في سفر أعمال الرسل.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا، تأتي العبارة اليونانية موجزة: «ولكن من أب يوناني».'
    reason: source_form
lexical_decisions:
- source_word: Κατήντησεν δὲ καὶ
  choice: ثم وصل أيضًا
  rationale: ينقل الفعل معنى بلوغ المكان، وتؤدي «ثم» استئناف السرد، بينما تحفظ «أيضًا» القوة الإضافية.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: إلى دِرْبَة ولِسْتَرَة
  rationale: «إلى» هي الصياغة العربية الطبيعية لمسار الرحلة، ولا يلزم تكرارها قبل اسم المكان الثاني.
- source_word: καὶ ἰδοὺ
  choice: وإذا
  rationale: «وإذا» أداة سرد عربية فصيحة تلفت الانتباه إلى ظهور شخص في المشهد وتحفظ بروز ἰδού دون تكلف.
- source_word: μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος
  choice: تلميذ هناك اسمه تيموثاوس
  rationale: تحفظ العبارة كون الشخص غير معرّف عند تقديمه، وتثبت وجوده في المكان، وتأتي بصياغة عربية واضحة وطبيعية.
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: ابن امرأة يهودية مؤمنة
  rationale: الأرجح في سياق أعمال الرسل أن πιστή تصفها بأنها من المؤمنين، مع بقاء معنى «أمينة» ممكنًا ومعروضًا في الحاشية.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: وأبوه يوناني
  rationale: تفك العبارة اليونانية الإهليلجية بصياغة عربية طبيعية، وتحفظ المقابلة بين الأم اليهودية والأب اليوناني.
theological_decisions:
- issue: دلالة πιστῆς في وصف أم تيموثاوس
  choice: مؤمنة
  alternative: أمينة
  rationale: استعمال لوقا في أعمال الرسل والسياق المسيحي يرجحان معنى الانتماء إلى جماعة المؤمنين، لكن الصفة اليونانية تحتمل أيضًا معنى الأمانة؛ لذلك لم يُطمس البديل بل ذُكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُعملت «وإذا» للاحتفاظ بالتنبيه السردي، وصيغت العبارة الأخيرة في جملة اسمية طبيعية. وُضعت علامتا الحاشية في المتن عند موضعي المسألتين.
