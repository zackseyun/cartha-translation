base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: ar
  text: 'فقالا: «آمِنْ بالرب يسوع[a]، فتخلُص أنت وأهل بيتك[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُفهم: «اتكل على الرب يسوع»؛ فحرف الجر اليوناني يبيّن أن الإيمان متجه إلى شخصه.'
    reason: lexical_alternative
  - marker: b
    text: أي الأشخاص الذين ينتمون إلى بيته، لا مبنى البيت نفسه. ولا تحدد هذه العبارة وحدها كيفية نوال كل واحد منهم الخلاص.
    reason: cultural_and_theological_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: فقالا
  rationale: تؤدي δέ هنا وظيفة الربط السردي الخفيف، وتدل صيغة الجمع في سياق الرواية على بولس وسيلا؛ لذلك استُعمل المثنى العربي الطبيعي من غير افتعال معنى للمقابلة.
- source_word: Πίστευσον ἐπὶ τὸν
  choice: آمِنْ بـ
  rationale: صيغة أمر تدعو إلى استجابة حاسمة، وἐπί مع المفعول به يحدد الشخص الذي يتجه إليه الإيمان. والتعبير العربي «آمن بـ» هو الأفصح والأوضح هنا، مع بقاء معنى الاتكال متضمَّنًا.
- source_word: κύριον Ἰησοῦν
  choice: الرب يسوع
  rationale: يحفظ «الرب» القوة التكريمية واللاهوتية للقب κύριος، ويُنقل الاسم الشخصي Ἰησοῦν بصيغته العربية المعيارية «يسوع».
- source_word: σωθήσῃ
  choice: فتخلُص
  rationale: ينقل المستقبل المبني للمجهول دلاليًا بصياغة عربية طبيعية، ويحفظ معنى الخلاص في السياق التبشيري من غير حصره في نجاة زمنية فقط.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: أنت وأهل بيتك
  rationale: المقصود بـοἶκος هنا جماعة البيت لا البناء نفسه. و«أهل بيتك» تعبير عربي واضح وطبيعي، ولا يحدد بذاته كيفية نوال كل فرد للخلاص.
theological_decisions:
- issue: نطاق الوعد المتعلق بالسجان وأهل بيته
  choice: 'إبقاء العبارة مباشرة: «فتخلُص أنت وأهل بيتك» من غير شرح عقائدي داخل النص'
  alternative: فهمها إما خلاصًا آليًا لأهل البيت بإيمان رب البيت وحده، أو وعدًا مقصورًا على السجان مع تهميش ذكر أهل بيته
  rationale: النص يشمل السجان وأهل بيته في الوعد، لكنه لا يفصل في هذه الآية وحدها كيفية انطباق الخلاص على كل فرد؛ لذا تُحفظ سعة العبارة والتوتر التفسيري من غير إدخال موقف طائفي.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة وموقرة. استُعمل المثنى «فقالا» وفق سياق المتكلمين، بولس وسيلا، وجاءت «أهل بيتك» بدل الترجمة الحرفية الملتبسة «بيتك».
