  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: ar
  text: 'لكن بولس صرخ بصوت عالٍ قائلًا: «لا تُلحِق بنفسك أيَّ أذى، فنحن جميعًا هنا».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν
  choice: صرخ
  rationale: يدل الفعل هنا، في سياق الاستعجال ومع عبارة «بصوت عالٍ»، على نداء قوي؛ و«صرخ» تعبير عربي طبيعي يحفظ شدة الصوت.
- source_word: δὲ
  choice: لكن
  rationale: تفيد الأداة انتقالًا ذا مسحة مقابلة، إذ يقطع بولس ما كان السجّان مزمعًا أن يفعله.
- source_word: φωνῇ μεγάλῃ
  choice: بصوت عالٍ
  rationale: تنقل العبارة الدالة على الكيفية بصياغة عربية واضحة وتحفظ صورتها المحسوسة.
- source_word: λέγων
  choice: قائلًا
  rationale: يحفظ اسم الفاعل الذي يقدم مضمون كلام بولس، وهو تركيب عربي فصيح وطبيعي.
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: لا تفعل بنفسك أيَّ سوء
  rationale: يحفظ سعة التعبير اليوناني وتركيبه الانعكاسي من غير حصره صراحةً في الانتحار، مع أن السياق يدل على إيذاء النفس المقصود.
- source_word: ἅπαντες
  choice: جميعًا
  rationale: تفيد شمول كل الموجودين وتؤدي توكيد الصيغة اليونانية بإيجاز.
- source_word: γάρ
  choice: فـ
  rationale: تربط سبب النهي به ربطًا تفسيريًا طبيعيًا في العربية.
- source_word: ἐνθάδε
  choice: هنا
  rationale: مقابل مكاني مباشر وطبيعي للظرف اليوناني.
- source_word: ὁ Παῦλος
  choice: بولس
  rationale: النقل العربي المعياري للاسم الشخصي.
