  yaml_path: translation/nt/acts/016/002.yaml
  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: ar
  text: وكان يشهد له الإخوة في لسترة وإيقونية شهادةً حسنة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات»، أي رفاق الإيمان في هاتين المدينتين.
    reason: بديل معجمي يوضح أن «الإخوة» قد تُستعمل هنا استعمالًا شاملًا.
lexical_decisions:
- source_word: ὃς
  choice: وكان
  rationale: الضمير الموصول يعود إلى تيموثاوس في الآية السابقة؛ وصيغت الجملة العربية استئنافيًا مع واو السياق لتكون طبيعية ومكتملة.
- source_word: ἐμαρτυρεῖτο
  choice: يشهدون له شهادة حسنة
  rationale: المبني للمجهول في اليونانية يفيد أن تيموثاوس كان موضع شهادة إيجابية؛ والتعبير العربي ينقل معنى حسن السمعة بوضوح مع إبراز الشهادة.
- source_word: ὑπὸ
  choice: الإخوة ... يشهدون
  rationale: تدل ὑπό مع المضاف إليه على فاعل الفعل المبني للمجهول؛ وحُوِّل التركيب إلى المبني للمعلوم في العربية لسلامة الأسلوب مع حفظ جهة الشهادة.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: الإخوة في لِسترة وإيقونية
  rationale: يحدد التركيب الجماعة المؤمنة الموجودة في المدينتين، ولذلك نُقل بحرف الظرف «في».
- source_word: ἀδελφῶν
  choice: الإخوة
  rationale: يحافظ اللفظ على الصورة القرابية في اليونانية، مع إيضاح دلالته المحتملة على عموم المؤمنين والمؤمنات في الحاشية.
theological_decisions:
- issue: الدلالة الجندرية للفظ ἀδελφῶν في الجماعة المسيحية
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: الصيغة اليونانية جمع مذكر، فحُفظت في المتن دون تسوية الدلالة إلى لفظ محايد، مع التنبيه إلى أن الاستعمال قد يشمل المؤمنين والمؤمنات.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل المبني للمعلوم لأن «يشهدون له شهادة حسنة» أكثر طبيعية من صياغة عربية ثقيلة بالمبني للمجهول، مع الحفاظ على دلالة السمعة الطيبة المستمرة في صيغة الماضي الناقص اليونانية.
