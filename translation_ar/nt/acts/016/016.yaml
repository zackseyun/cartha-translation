source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: ar
  text: وبينما كنا ذاهبين إلى موضع الصلاة، لقيتنا فتاة مستعبدة لها روح بايثون[a]، وكانت تجلب لأسيادها أرباحًا كثيرة بالعِرافة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «روح عِرافة». يقول اليوناني حرفيًا: «روح بايثون»، وهو تعبير ذو خلفية ثقافية ارتبط بالتنبؤ العِرافي.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «بممارسة العِرافة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وحدث
  rationale: أداة انتقال سردي طبيعية في العربية المعاصرة، تحفظ وظيفة العبارة من غير أسلوب عتيق.
- source_word: πορευομένων ἡμῶν
  choice: فيما كنا ذاهبين
  rationale: تنقل الفعل الخلفي المتزامن وصيغته الاستمرارية.
- source_word: εἰς τὴν προσευχὴν
  choice: إلى موضع الصلاة
  rationale: السياق يرجّح مكانًا معروفًا للاجتماع والصلاة، لا مجرد فعل الصلاة.
- source_word: παιδίσκην τινά
  choice: جاريةٌ مملوكة
  rationale: يبيّن الوضع الاستعبادي الذي يؤكده ذكر سادتها واستغلالهم الاقتصادي لها؛ وتغني العربية بالتنكير عن ترجمة τινά ترجمة حرفية ثقيلة.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: كان بها روح بايثون
  rationale: يحفظ التعبير اليوناني ذي الخصوصية الثقافية بدل اختزاله في تفسير عام، مع توضيحه في الحاشية.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: لقيتنا
  rationale: صياغة عربية موجزة وطبيعية لمعنى المواجهة أو اللقاء.
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: كانت تدرّ ... ربحًا كثيرًا
  rationale: تنقل المنفعة المالية المتكررة وتحفظ دلالة الماضي الاستمراري.
- source_word: τοῖς κυρίοις αὐτῆς
  choice: على سادتها
  rationale: يشير اللفظ هنا إلى أصحاب السلطة والملكية عليها، لا إلى اللقب الإلهي.
- source_word: μαντευομένη
  choice: بالتكهّن
  rationale: لفظ عربي مفهوم يدل على ممارسة ادعاء معرفة المغيبات، مع إيراد البديل الاصطلاحي في الحاشية.
theological_decisions:
- issue: ترجمة πνεῦμα πύθωνα، وهو تعبير ثقافي مرتبط بالتنبؤ العرّافي
  choice: روح بايثون
  alternative: روح عرافة
  rationale: تحفظ الترجمة خصوصية التعبير في الأصل ولا تحوّله في المتن إلى تفسير وحيد؛ وتعرض الحاشية المعنى الوظيفي البديل.
- issue: إظهار الوضع الاجتماعي الذي تدل عليه παιδίσκη
  choice: جارية مملوكة
  alternative: خادمة
  rationale: ذكر السادة والربح الناتج من نشاطها يجعل معنى الاستعباد والاستغلال بارزًا في السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «جارية مملوكة» لإظهار وضعها الاستعبادي، و«روح بايثون» للمحافظة على الخصوصية الثقافية في الأصل مع شرحها في الحاشية.
