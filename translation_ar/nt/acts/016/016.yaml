  rationale: تُحسّن المراجعة سلاسة العربية وتوضح وضع الفتاة المستعبدة، مع الحفاظ على خصوصية «روح بايثون» وعدم حسم طبيعة التعبير على نحو تفسيري. كما تنقل «تجلب لأسيادها أرباحًا كثيرة» المنفعة الاقتصادية المستمرة والجهة المستفيدة بوضوح.
