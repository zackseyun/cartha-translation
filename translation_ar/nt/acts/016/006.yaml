  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: ar
  text: واجتازوا منطقة فريجية وغلاطية[b]، بعد أن منعهم الروح القدس من أن يتكلموا بالكلمة في آسية[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الولاية الرومانية «آسية» في غربي آسيا الصغرى، لا قارة آسيا المعروفة اليوم.
    reason: cultural_note
  - marker: b
    text: 'أو: «المنطقة الفريجية الغلاطية». يمكن فهم التركيب اليوناني على أنه تسمية لمنطقة واحدة.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: اجتازوا
  rationale: ينقل فعل الحركة عبر منطقة بصياغة عربية موجزة وطبيعية، من غير افتراض تفاصيل إضافية عن الطريق.
- source_word: δὲ
  choice: و
  rationale: أداة ربط سردية خفيفة تواصل تسلسل الأحداث، والواو أنسب مقابل عربي غير متكلف.
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: منطقة فريجية وغلاطية
  rationale: تحافظ الصياغة على إمكان فهم التركيب على أنه نطاق جغرافي يجمع فريجية وغلاطية، مع إثبات احتمال كونه وصفًا لمنطقة واحدة في الحاشية.
- source_word: κωλυθέντες
  choice: إذ منعهم
  rationale: يعبّر عن المنع الواقع عليهم في أثناء مسار الرواية، ويرتبط طبيعيًا بالمصدر «أن يتكلموا» دون تشديد زمني لا يفرضه السياق.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: الروح القدس
  rationale: يحفظ الإسناد الصريح إلى الروح القدس بوصفه فاعل المنع، وفق الاستعمال الواضح في سفر الأعمال.
- source_word: λαλῆσαι
  choice: أن يتكلموا
  rationale: يقابل المعنى العام للفعل، ولا يضيّقه إلى «يبشروا» أو «يكرزوا» مع أن إعلان الرسالة هو المقصود سياقيًا.
- source_word: τὸν λόγον
  choice: بالكلمة
  rationale: يحافظ على تعبير لوقا المتكرر «الكلمة» بدل تفسيره داخل المتن بأنه «الرسالة» أو «الإنجيل».
- source_word: ἐν τῇ Ἀσίᾳ
  choice: في آسية
  rationale: يثبت الاسم الجغرافي التاريخي كما في الأصل، وتوضح الحاشية أنه اسم الولاية الرومانية لا القارة الحديثة.
theological_decisions:
- issue: فاعلية الروح وشخصيته في المنع
  choice: منعهم الروح القدس
  alternative: منعهم الروح
  rationale: وجود أداة التعريف والصفة في اليونانية، إلى جانب استعمال لوقا وأعمال الرسل، يدل بوضوح على الروح القدس بوصفه صاحب الفعل؛ وتحفظ الترجمة ذلك بلا إضافة تفسير عقائدي إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «اجتازوا» للمحافظة على دلالة المرور عبر المكان، و«آسية» للتمييز التقليدي للاسم التاريخي عن قارة آسيا. أُبقي «الكلمة» لما له من أهمية اصطلاحية في لوقا وأعمال الرسل، مع الحفاظ على الغموض الجغرافي الحقيقي في حاشية.
