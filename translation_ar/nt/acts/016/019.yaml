lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: أسيادها
  rationale: يدل اللفظ في السياق على من كانت لهم سلطة الملكية والسيطرة على الجارية. و«أسيادها» تعبير عربي واضح يحفظ دلالة العلاقة الاجتماعية والاستغلال الاقتصادي، بينما «مالكوها» يصرّح بالملكية بصورة أشد.
- source_word: ἐξῆλθεν
  choice: قد زال
  rationale: المعنى السياقي هو أن رجاءهم في الربح انتهى بخروج الروح من الجارية. اختير «قد زال» لأنه طبيعي في العربية مع «رجاء»، مع بيان الصورة الحرفية في الحاشية.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: رجاء ربحهم
  rationale: تحفظ «رجاء» الدلالة المباشرة لـἐλπίς، وتؤدي «ربحهم» معنى ἐργασία هنا بوصفه الكسب أو العائد الناتج من نشاط الجارية، لا العمل المجرد.
- source_word: ἐπιλαβόμενοι
  choice: أمسكوا
  rationale: يفيد اسم الفاعل اليوناني القبض بقوة في سياق عدائي. و«أمسكوا» عربية طبيعية، ويُظهر الفعل التالي «جرّوهما» قسر الفعل بوضوح.
- source_word: εἵλκυσαν
  choice: جرّوهما
  rationale: ينقل الفعل معنى السحب بالقوة، ويحفظ حدة المعاملة القسرية التي تعرض لها بولس وسيلا.
- source_word: ἀγοράν
  choice: السوق
  rationale: تعني الكلمة السوق أو الساحة العامة التي كانت مركزًا للحياة المدنية والقضائية. «السوق» هي المقابلة المباشرة الواضحة، ويبين السياق حضور السلطات فيها.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: ليمثلا أمام الحكام
  rationale: ἄρχοντες لفظ عام للسلطات المدنية. أضيف «ليمثلا» لإيضاح العلاقة الاصطلاحية التي تؤديها العبارة اليونانية في سياق الاقتياد للمحاكمة، مع إبقاء «الحكام» عامة وعدم استباق اللقب الأدق في العدد التالي.
