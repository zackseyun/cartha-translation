base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: ar
  text: 'وظلّت تفعل هذا أيامًا كثيرة. لكن بولس، وقد انزعج جدًا، التفت إلى الروح وقال: «آمرك باسم يسوع المسيح[a] أن تخرج منها». فخرج في تلك الساعة نفسها.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يسوع المسيّا». والكلمة اليونانية «خريستوس» لقب معناه «المسيح» أو «الممسوح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: ظلّت تفعل هذا أيامًا كثيرة
  rationale: ينقل الفعل الناقص استمرار الفعل أو تكراره في الماضي، وتؤديه «ظلّت تفعل» بعبارة عربية طبيعية.
- source_word: διαπονηθεὶς
  choice: إذ اشتدّ انزعاجه
  rationale: يدل اللفظ على انزعاج شديد أو ضيق بالغ، لا على تبرّم طفيف، وهذه الصياغة تحفظ قوته من غير أن تحصره في الغضب.
- source_word: ἐπιστρέψας
  choice: التفت
  rationale: يفيد تحوّل بولس بجسده نحو المخاطَب، و«التفت» موجزة وطبيعية في السياق.
- source_word: τῷ πνεύματι
  choice: إلى الروح
  rationale: النص اليوناني يقول «إلى الروح» بلا وصف صريح له بأنه شرير أو شيطان، ولذلك حُفظت صياغته كما هي.
- source_word: Παραγγέλλω σοι
  choice: آمرك
  rationale: صيغة أمر سلطاني مباشر، و«آمرك» تؤدي القوة والإيجاز.
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: باسم يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، وتحفظ العبارة معنى ممارسة السلطان باسم يسوع.
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: أن تخرج منها
  rationale: صياغة عربية مباشرة تحفظ خطاب الروح وصورة خروجه من المرأة.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: فخرج في تلك الساعة نفسها
  rationale: تحفظ الإشارة الزمنية المؤكدة في الأصل من غير تحويلها تفسيرًا إلى «حالًا» أو «في اللحظة نفسها».
theological_decisions:
- issue: ترجمة Χριστοῦ في عبارة الأمر
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» في العربية لقب معروف لا اسم عائلة، وهو المقابل العربي الموروث والمفهوم لمعنى Χριστός. أُضيفت حاشية تبيّن إمكان التعبير بـ«المسيّا» لإبراز دلالة اللقب.
- issue: هل يُوصَف الروح في المتن بأنه شرير أو شيطان؟
  choice: الروح
  alternative: الروح الشرير / الشيطان
  rationale: لا يرد في هذه الآية وصف صريح مع πνεῦμα؛ لذلك يحفظ المتن القدر الذي يصرّح به الأصل، فيما يوضح السياق السابق طبيعة الروح.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة، مع الحفاظ على تتابع الأفعال وقوة صيغة الأمر، وتجنّب إضافة أوصاف تفسيرية إلى «الروح» لا يذكرها نص الآية صراحة.
