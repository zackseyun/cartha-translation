  register: لغة عربية فصحى حديثة واضحة ورصينة. استُخدمت الفاء للربط السردي، وأُبقي «نزلوا» حفاظًا على الدلالة الاتجاهية، مع حاشية تصون الاحتمال المكاني في παρελθόντες.
