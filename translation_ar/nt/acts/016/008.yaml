  text: παρελθόντες δὲ τὴν Μυσίαν κατέβησαν εἰς Τρῳάδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/008.yaml
  text: So[a], passing by Mysia, they went down to Troas.
translation:
  language: ar
  text: فمرّوا بميسية[a]، ونزلوا إلى ترواس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مرّوا عبر ميسية»، أو: «تجاوزوا ميسية». يحتمل اسم الفاعل اليوناني صيغًا متقاربة؛ والمقصود أنهم واصلوا طريقهم ولم يتوقفوا هناك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελθόντες
  choice: مرّوا بميسية
  rationale: اسم الفاعل الماضي من παρέρχομαι مع اسم المنطقة في حالة النصب يدل هنا على مواصلة السير بمحاذاة ميسية أو عبرها من غير التوقف فيها. وصيغة «مرّوا بـ» عربية طبيعية وتحفظ قدرًا من المرونة المكانية في التعبير اليوناني.
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تواصل السرد؛ والفاء تلائم تتابع الأحداث بالعربية من غير أن توحي بتعارض قوي.
- source_word: Μυσίαν
  choice: ميسية
  rationale: نقل صوتي عربي شائع لاسم الإقليم Μυσία.
- source_word: κατέβησαν
  choice: نزلوا
  rationale: يحفظ المعنى الاتجاهي للفعل καταβαίνω، أي الانتقال إلى موضع أخفض أو نحو الساحل، بصياغة عربية موجزة وطبيعية.
- source_word: εἰς
  choice: إلى
  rationale: حرف الجر الطبيعي في العربية للدلالة على الوجهة المقصودة.
- source_word: Τρῳάδα
  choice: ترواس
  rationale: النقل الصوتي العربي الشائع لاسم مدينة Τρῳάς.
theological_decisions: []
