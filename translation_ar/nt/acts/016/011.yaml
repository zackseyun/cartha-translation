  text: فأقلعنا من ترواس وأبحرنا مباشرةً إلى ساموثراكي، وفي اليوم التالي إلى نيابوليس،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: أبحرنا
  rationale: الفعل ἀνάγω في السياق البحري يعني الإقلاع بالسفينة أو الإبحار. صيغت العبارة بفعل عربي طبيعي يدل بوضوح على بدء الرحلة البحرية، مع استيعاب دلالة اسم الفاعل ضمن تسلسل السرد.
- source_word: οὖν
  choice: فـ
  rationale: تدل οὖν هنا على الانتقال أو النتيجة في سياق الرحلة؛ والفاء العربية تربط هذه المرحلة بما قبلها ربطًا طبيعيًا موجزًا.
- source_word: ἀπὸ Τρῳάδος
  choice: من ترواس
  rationale: ترجمة مباشرة لحرف الجر الدال على نقطة الانطلاق، مع نقل اسم المكان بصيغته العربية الشائعة.
- source_word: εὐθυδρομήσαμεν
  choice: اتجهنا مباشرةً
  rationale: يدل الفعل على الإبحار في خط مستقيم أو سلوك مسار مباشر. والاختيار يحافظ على معنى الرحلة المباشرة دون تعبير بحري تقني ثقيل، فيما يوضح السياق السابق أن الانتقال كان بحرًا.
- source_word: εἰς Σαμοθρᾴκην
  choice: إلى ساموثراكي
  rationale: حُفظت دلالة الوجهة في εἰς، ونُقل اسم الجزيرة إلى العربية نقلًا صوتيًا واضحًا.
- source_word: τῇ δὲ ἐπιούσῃ
  choice: وفي اليوم التالي
  rationale: العبارة الزمنية تعني اليوم الآتي أو التالي، ومُثلت δέ بالواو لاستمرار تسلسل خط سير الرحلة.
- source_word: εἰς Νέαν Πόλιν
  choice: إلى نيابوليس
  rationale: العبارة اسم عَلَم لمكان، لذلك نُقلت صوتيًا بدل ترجمتها حرفيًا إلى «المدينة الجديدة»، مع إبقاء حرف الجر الدال على الوجهة.
