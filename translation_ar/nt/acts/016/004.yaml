  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: ar
  text: وفيما كانوا يجتازون المدن، كانوا يسلِّمون إليهم المقررات[a] التي قرَّرها الرسل والشيوخ الذين في أورشليم، ليلتزموا بها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «القرارات». تشير الكلمة اليونانية إلى مقررات رسمية صادرة عن اجتماع أورشليم.
    reason: بديل معجمي يوضح المعنى الإداري الرسمي للفظ δόγματα دون تحميله معنى «العقائد» الاصطلاحي المتأخر.
lexical_decisions:
- source_word: διεπορεύοντο
  choice: كانوا يجتازون
  rationale: صيغة الماضي الناقص تفيد حركة مستمرة من مدينة إلى أخرى، و«يجتازون» تؤدي معنى المرور عبر المدن من غير تحديد زائد لمسار الرحلة.
- source_word: παρεδίδοσαν
  choice: كانوا يسلِّمون
  rationale: يفيد الفعل نقل ما تقرر إلى المعنيين به بصفة رسمية، و«يسلِّمون» يحافظ على صورة إيداع الأحكام لديهم أكثر من تعبير عام مثل «يخبرون».
- source_word: αὐτοῖς
  choice: إليهم
  rationale: أُبقي الضمير كما في اليونانية دون التصريح بأن مرجعه المؤمنون أو الكنائس، مع أن السياق يدل عليهم.
- source_word: φυλάσσειν
  choice: لكي يلتزموا بها
  rationale: المقصود حفظ الأحكام بمعنى مراعاتها والعمل بها، لا مجرد صونها أو حفظ ألفاظها؛ و«يلتزموا بها» واضح وطبيعي في العربية المعاصرة.
- source_word: δόγματα
  choice: الأحكام
  rationale: يشير اللفظ هنا إلى أحكام رسمية صادرة عن اجتماع أورشليم. و«الأحكام» تنقل قوتها الملزمة دون استدعاء المعنى الاصطلاحي المتأخر لكلمة «عقائد».
- source_word: κεκριμένα
  choice: التي أقرَّها
  rationale: اسم المفعول التام يدل على أحكام بُتَّ فيها وظل قرارها نافذًا؛ و«أقرَّها» موجز وطبيعي في سياق قرار جماعي رسمي.
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: الرسل والشيوخ
  rationale: هذان هما المقابلان العربيان الراسخان والواضحان للقيادتين المذكورتين في سفر الأعمال.
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: الذين في أورشليم
  rationale: يحافظ التعبير على تعلق الوصف بكل من الرسل والشيوخ وعلى دلالته المكانية الصريحة.
- source_word: ὡς δὲ
  choice: وفيما
  rationale: ينقل الانتقال السردي والعلاقة الزمنية بين اجتياز المدن وتسليم الأحكام في عبارة عربية سلسة.
theological_decisions:
- issue: سلطة أحكام اجتماع أورشليم
  choice: الأحكام
  alternative: القرارات
  rationale: «الأحكام» تبين أن ما نُقل لم يكن مجرد آراء أو معلومات، بل مقررات جماعية ذات قوة ملزمة في سياق أعمال 15، من غير إسقاط مفهوم عقائدي كنسي متأخر على لفظ δόγματα.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. أُبقيت الضمائر حيث أبقاها النص اليوناني، واستُعمل «يلتزموا بها» لتجنب احتمال فهم «يحفظوها» بمعنى الاستظهار أو الحراسة. وُضع رمز الحاشية بعد «الأحكام» لأنه اللفظ الذي تشرحه الحاشية.
