lexical_decisions:
- source_word: προαγαγὼν
  choice: ثم أخرجهما
  rationale: اسم فاعل ماضٍ يدل على فعل سبق فعل القول؛ وصياغة «ثم أخرجهما» طبيعية في السرد العربي وتحفظ تعاقب الحدثين.
- source_word: αὐτοὺς ἔξω
  choice: إلى الخارج
  rationale: يفيد الضمير مع الظرف نقل بولس وسيلا من موضعهما إلى الخارج، و«إلى الخارج» واضحة وطبيعية.
- source_word: ἔφη
  choice: وقال
  rationale: الماضي الناقص من φημί يأتي هنا مدخلًا بسيطًا للكلام المباشر، فـ«وقال» أنسب للسرد العربي.
- source_word: Κύριοι
  choice: يا سيديَّ
  rationale: منادى مثنى في السياق لأن الخطاب موجَّه إلى بولس وسيلا، ويُستعمل هنا للتوقير الاجتماعي لا كلقب إلهي. وأُثبتت الياء مع علامة النصب في صيغة المثنى.
- source_word: τί με δεῖ ποιεῖν
  choice: ماذا يجب عليَّ أن أفعل
  rationale: تحفظ العبارة معنى الضرورة في δεῖ وتعبّر عنه بصياغة عربية واضحة ومباشرة.
- source_word: ἵνα σωθῶ
  choice: لكي أخلُص
  rationale: تحفظ «لكي» علاقة الغاية، ويعبّر الفعل «أخلُص» عن معنى المبني للمجهول اليوناني اصطلاحيًا في العربية من غير إضافة فاعل أو تحديد كيفية الخلاص.
theological_decisions:
- issue: دلالة σωθῶ في سؤال السجّان
  choice: أخلُص
  alternative: أُنجى / أُنقذ
  rationale: قد يدل الفعل اليوناني على النجاة من خطر أو على الخلاص بمعناه الأوسع. والسياق اللاحق في العدد 31 يرجّح معنى الخلاص، مع بقاء اللفظ العربي غير محمّل بتفصيل مذهبي زائد.
- issue: دلالة Κύριοι في النداء
  choice: يا سيديَّ
  alternative: يا ربَّيَّ / أيها السيدان
  rationale: المخاطبان هما بولس وسيلا، ولذلك فاللفظ نداء اجتماعي محترم لا استعمال للاسم الإلهي «الرب».
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة المثنى لأن الضمير اليوناني والجمع في النداء يشيران إلى بولس وسيلا، وحُفظت صيغة سؤال الضرورة وغاية الخلاص من دون توسع تفسيري.
