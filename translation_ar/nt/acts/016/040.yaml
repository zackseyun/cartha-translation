source:
  edition: SBLGNT
  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: ar
  text: وبعد أن خرجا من السجن، ذهبا إلى ليدية. ولما رأيا الإخوة[a]، شجَّعاهم ثم غادرا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات». اللفظ اليوناني مذكّر في صيغة الجمع، لكنه قد يشير إلى جماعة من المؤمنين تضم رجالًا ونساءً.
    reason: بديل معجمي يوضح إمكان الدلالة الشاملة للفظ اليوناني.
lexical_decisions:
- source_word: ἐξελθόντες δὲ ἀπὸ τῆς φυλακῆς
  choice: وبعد أن خرجا من السجن
  rationale: صيغ اسم الفاعل الأوريستي في عبارة زمنية طبيعية تبين أن الخروج سبق الذهاب. واستُعمل المثنى لأن المقصود في السياق بولس وسيلا.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: ذهبا إلى ليدية
  rationale: تفيد العبارة التوجه إلى ليدية وزيارتها. تجنبت الترجمة إضافة «بيتها» لأنها غير مذكورة صراحة في اليونانية، كما تجنبت الصياغة الحرفية غير الطبيعية «دخلا إلى ليدية».
- source_word: ἰδόντες
  choice: ولما رأيا
  rationale: نُقل اسم الفاعل الأوريستي بعبارة زمنية عربية سلسة تربط الرؤية بالفعل التالي.
- source_word: παρεκάλεσαν
  choice: شجَّعاهم
  rationale: يمكن أن يدل الفعل على التشجيع أو الحث أو التعزية؛ و«شجَّعاهم» يحفظ معناه الرعوي الواسع من غير حصره في التعزية أو الوعظ.
- source_word: τοὺς ἀδελφούς
  choice: الإخوة
  rationale: يحافظ اللفظ على الصورة المذكرة في الأصل، مع إيضاح احتمال شموله المؤمنات في الحاشية.
- source_word: ἐξῆλθαν
  choice: ثم غادرا
  rationale: ينقل فعل الانصراف في ختام المشهد بعبارة عربية موجزة، ويتجنب تكرار «خرجا» الواردة في أول الآية.
theological_decisions:
- issue: دلالة «الإخوة» في جماعة مسيحية قد تضم رجالًا ونساءً
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: أُبقيت الصيغة المذكرة التي يقابلها النص اليوناني في المتن، مع حفظ احتمال الدلالة الشاملة في الحاشية، فلا يُحسم تركيب الجماعة بما يتجاوز ما يصرح به الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المثنى اتساقًا مع كون الفاعلين بولس وسيلا، وقُسمت الجملة إلى عبارتين لتحسين سلاسة السرد من غير تغيير تسلسله.
