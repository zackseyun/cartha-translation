  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: ar
  text: وبعد أن أنزلوا بهما ضربات كثيرة[a]، ألقوهما في السجن[b]، وأمروا السجّان أن يحرسهما بإحكام.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «جلدات كثيرة» أو «ضربات عديدة». تشير اليونانية إلى ضربات كثيرة أُنزِلت بهما، من غير أن تحدد هنا أداة الضرب.
    reason: lexical_alternative
  - marker: b
    text: أو «الحبس»؛ فقد تدل الكلمة اليونانية على موضع الاحتجاز عمومًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: ضربات كثيرة
  rationale: تنقل العبارة عدد الضربات وكثرتها من غير أن تحدد أداة الضرب، كما أن πληγή قد تدل على الضربة أو أثرها.
- source_word: τε
  choice: و
  rationale: حرف وصل يربط هذا الحدث بما سبقه في السرد، وتمثله الواو طبيعيًا في العربية.
- source_word: ἐπιθέντες
  choice: بعدما أوقعوا
  rationale: اسم الفاعل السابق للفعل الرئيس يأتي مع πληγάς بمعنى إنزال الضربات أو إيقاعها، و«بعدما» توضح العلاقة الزمنية.
- source_word: ἔβαλον εἰς φυλακήν
  choice: ألقوهما في السجن
  rationale: يحافظ «ألقوهما» على قوة βάλλω وصورته الأشد من مجرد «وضعوهما»، بينما يعبّر «السجن» بوضوح عن موضع الاحتجاز.
- source_word: φυλακήν
  choice: السجن
  rationale: اللفظة قد تدل على السجن أو موضع الحبس عمومًا؛ و«السجن» هو التعبير العربي الواضح الملائم للسياق.
- source_word: παραγγείλαντες
  choice: وأمروا
  rationale: يعكس سلطة التوجيه في παραγγέλλω، وتفيد الواو اقتران الأمر بإيداعهما السجن.
- source_word: δεσμοφύλακι
  choice: السجّان
  rationale: تسمية موجزة وطبيعية للمسؤول عن حفظ المسجونين.
- source_word: ἀσφαλῶς
  choice: بإحكام
  rationale: المقصود تأمين الحراسة ومنع الهرب، لا المحافظة على سلامة السجينين.
- source_word: τηρεῖν
  choice: أن يحرسهما
  rationale: في سياق السجن، «يحرس» يعبّر طبيعيًا عن معنى الحفظ والمراقبة المقصود في τηρέω.
- source_word: αὐτούς
  choice: هما
  rationale: يعود الضمير المثنى إلى بولس وسيلا، وتُظهر العربية عددهما صراحة.
theological_decisions: []
