  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: ar
  text: وكانت امرأة تُدعى ليدية، بائعة أقمشة أرجوانية من مدينة ثياتيرا، تعبد الله[a]، كانت تستمع؛ ففتح الرب قلبها لكي تنتبه إلى ما كان يقوله بولس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «من عابدي الله»؛ وقد تدل العبارة على امرأة من الأمم تتعبد لإله إسرائيل.
    reason: بديل معجمي ودلالة اجتماعية دينية محتملة للعبارة اليونانية.
lexical_decisions:
- source_word: καί τις γυνὴ
  choice: وكانت امرأة
  rationale: يحفظ التنكير والقوة السردية الاستهلالية للعبارة اليونانية بصياغة عربية طبيعية، من غير استعمال «امرأة معينة» الثقيل.
- source_word: ὀνόματι Λυδία
  choice: تُدعى ليدية
  rationale: تعبير عربي مألوف ودقيق للدلالة على الاسم.
- source_word: πορφυρόπωλις
  choice: بائعة أقمشة أرجوانية
  rationale: يدل اللفظ على من تتاجر بالسلع أو الأقمشة المصبوغة بالأرجوان؛ وهذه الصياغة واضحة ولا تفترض أنها كانت تبيع ثيابًا بعينها.
- source_word: πόλεως Θυατείρων
  choice: من مدينة ثياتيرا
  rationale: ينقل دلالة المنشأ أو الموطن التي تفيدها الإضافة اليونانية.
- source_word: σεβομένη τὸν θεόν
  choice: تعبد الله
  rationale: ينقل معنى التعبد والتوقير بوضوح، مع تجنب إدخال لقب اصطلاحي في المتن.
- source_word: ἤκουεν
  choice: تستمع إلينا
  rationale: الماضي الناقص اليوناني يصور فعلًا مستمرًا؛ وجاء الضمير وفق سياق خطاب بولس والرفاق المحيط، لكنه ليس مصرّحًا به في هذه العبارة اليونانية، ولذلك يظل خيار «تستمع» وحده أقرب حرفيًا.
- source_word: ὁ κύριος
  choice: الرب
  rationale: يحافظ على اللقب كما ورد، من غير تعيين المرجع بما يتجاوز النص.
- source_word: διήνοιξεν τὴν καρδίαν
  choice: فتح قلبها
  rationale: يحفظ الصورة اليونانية الطبيعية الدالة على التهيئة الداخلية للتلقي.
- source_word: προσέχειν
  choice: لتنتبه
  rationale: ينقل معنى توجيه الانتباه، ولا يضيف معنى الاستجابة أو الإيمان الذي لا يصرح به الفعل نفسه.
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: إلى ما كان يقوله بولس
  rationale: صياغة عربية طبيعية تحفظ استمرار الكلام ودلالة بولس بوصفه المتكلم.
theological_decisions:
- issue: مرجع «الرب» في ὁ κύριος
  choice: الرب
  alternative: الرب يسوع؛ الله
  rationale: النص اليوناني لا يقول إلا «الرب». لذلك تُحفظ سعة المرجع ولا يُحسم هل المقصود تحديدًا الرب يسوع أم الله بما يتجاوز اللفظ الصريح.
- issue: دلالة σεβομένη τὸν θεόν
  choice: تعبد الله
  alternative: من عابدي الله؛ أممية متعبدة لإله إسرائيل
  rationale: قد تكون العبارة وصفًا عامًا لعبادتها، وقد تحمل في سياق أعمال الرسل دلالة شبه اصطلاحية على أممية مرتبطة بعبادة إله إسرائيل؛ أُبقي المتن واضحًا ووُضعت الدلالة المحتملة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. وُضع رمز الحاشية بعد العبارة التي تشرحها مباشرة. استُعملت «ثياتيرا» نقلًا للاسم الجغرافي، وحُفظت صورة «فتح قلبها» من الأصل.
