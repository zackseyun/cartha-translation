  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: ar
  text: ومن هناك إلى فيلبي، وهي مدينة بارزة في إقليم مكدونية[a]، ومستعمرة رومانية[b]. وأقمنا في هذه المدينة بضعة أيام.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المدينة الأولى في إقليم مكدونية». العبارة اليونانية صعبة، وقد تشير كلمة «الأولى» إلى المرتبة أو البروز أو الترتيب.'
    reason: alternative_reading
  - marker: b
    text: أي إنها مدينة مُنحت وضعًا خاصًا تحت الحكم الروماني.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: ومن هناك
  rationale: يحفظ أداة الربط وتسلسل الرحلة من غير إضافة فعل غير مذكور صراحة في اليونانية.
- source_word: εἰς Φιλίππους
  choice: إلى فيلبي
  rationale: ترجمة طبيعية لحرف الجر في سياق الانتقال إلى مدينة، مع اعتماد الصيغة العربية الشائعة لاسم المكان.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: مدينة بارزة في مقاطعة مكدونية
  rationale: تعكس «بارزة» معنى الأولية أو المكانة المحتمل في πρώτη، من غير الجزم بأنها العاصمة أو الأولى ترتيبًا، وتؤدي μερίς بمعنى قسم إقليمي.
- source_word: κολωνία
  choice: مستعمرة رومانية
  rationale: المقصود وضع فيلبي القانوني بوصفها مستعمرة تابعة لروما؛ وإظهار «رومانية» يوضح المرجع الثقافي الضمني.
- source_word: ἦμεν ... διατρίβοντες
  choice: أقمنا
  rationale: صياغة عربية موجزة وطبيعية تنقل معنى المكث المستمر الذي تفيده الصيغة اليونانية.
- source_word: ἐν ταύτῃ τῇ πόλει
  choice: في هذه المدينة
  rationale: تحفظ دلالة اسم الإشارة في النص.
- source_word: ἡμέρας τινάς
  choice: بضعة أيام
  rationale: تنقل مدة غير محددة وقصيرة نسبيًا بلغة عربية مألوفة، من غير تحديد عددي دقيق.
theological_decisions:
- issue: دلالة πρώτη في وصف فيلبي
  choice: مدينة بارزة
  alternative: المدينة الأولى في مقاطعة مكدونية
  rationale: العبارة اليونانية صعبة، وقد تدل πρώτη على المكانة أو البروز أو الترتيب. يحفظ المتن المعنى المرجح من غير إسناد منزلة إدارية محسومة، وتعرض الحاشية البديل الحرفي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «بارزة» لصون الغموض التاريخي في πρώτη، وأُثبتت علامتا الحاشيتين [a] و[b] في المتن.
