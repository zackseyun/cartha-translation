lexical_decisions:
- source_word: συνεπέστη
  choice: اندفع ... معًا عليهم
  rationale: ينقل معنى التحرك الجماعي العدائي، مع إبقاء دلالة الاجتماع والهجوم من غير المبالغة باستعمال لفظ مثل «الرعاع».
- source_word: ὄχλος
  choice: الجمع
  rationale: مقابل عربي طبيعي ومحايد لـ«الحشد»، ولا يضيف حكمًا على حال الناس يتجاوز السياق.
- source_word: κατ’ αὐτῶν
  choice: عليهم
  rationale: يؤدي معنى κατά العدائي في هذا السياق بصورة عربية موجزة وطبيعية.
- source_word: στρατηγοὶ
  choice: الحكّام
  rationale: يشير اللفظ هنا إلى السلطات المدنية الرومانية في فيلبي؛ و«الحكّام» واضح للقارئ، مع بيان الدلالة التقنية في الحاشية.
- source_word: περιρήξαντες
  choice: ومزّق ... عنهم
  rationale: يعبر عن نزع الثياب بعنف قبل الضرب، ويجعل تسلسل الفعل مفهومًا في العربية.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: ثيابهم عنهم
  rationale: الضمير يعود إلى بولس وسيلا، والعبارة توضح أن الحكّام نزعوا ثيابهما استعدادًا للعقوبة.
- source_word: ἐκέλευον
  choice: أخذوا يأمرون
  rationale: يحافظ على الجانب الاستمراري لصيغة الماضي الناقص اليونانية ضمن المشهد المتتابع.
- source_word: ῥαβδίζειν
  choice: بضربهم بالعصي
  rationale: يصرّح بأداة العقوبة التي يتضمنها الفعل اليوناني، ولا يوهم باستعمال السياط.
