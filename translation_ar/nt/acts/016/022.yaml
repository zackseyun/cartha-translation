review_pass:
  verdict: revise
  source_fidelity: المسودة تنقل المعنى العام بدقة، بما في ذلك عداء الجمع والعقوبة بالعصي. لكن «اندفع الجمع معًا عليهم» تركيب غير سليم الدلالة في العربية، إذ قد يُفهم منه اندفاعهم معهم لا ضدهم. كما أن «مزّق الحكّام ثيابهم عنهم» مضطرب مرجعيًا وتركيبيًا؛ والأصل يصف نزع ثياب الرجلين بعنف قبل إصدار الأمر بالضرب.
  naturalness: «وثار الجمع كلّه عليهما» فصيحة معاصرة وتؤدي الفعل الجماعي العدائي بوضوح. و«مزّق الحكّام ثيابهما عن جسديهما» يزيل التباس الضمائر ويبين أن الثياب نزعت بالقوة. «وأخذوا يأمرون بضربهما بالعصي» طبيعي ويحافظ، بقدر مناسب في العربية، على امتداد فعل الأمر في المشهد.
  terminology: «الحكّام» مقبول هنا للـστρατηγοί مع الحاشية التفسيرية، و«العصي» دقيق لـῥαβδίζειν ولا يخلطه بالجلد بالسياط. استعملت صيغة المثنى لأن المخاطبَين في السياق هما بولس وسيلا، ولإزالة التباس الضمائر العربي.
  issues:
  - severity: medium
    issue: التركيب «اندفع الجمع معًا عليهم» ملتبس وغير طبيعي.
    rationale: حرف الجر «على» بعد «اندفع» لا يبين بوضوح معنى العداء المقصود في κατ’ αὐτῶν، وقد يوحي بالمصاحبة أو بالاتجاه المكاني فقط.
  - severity: medium
    issue: «مزّق الحكّام ثيابهم عنهم» يلتبس فيه مرجع «هم» ويضعف بيان نزع الثياب.
    rationale: الفاعل هو الحكام، بينما الثياب تخص الرجلين؛ والصياغة المنقحة تبين أن الحكام نزعوا ثيابهما بعنف، وهو تسلسل الفعل السابق للأمر في περιρήξαντες.
