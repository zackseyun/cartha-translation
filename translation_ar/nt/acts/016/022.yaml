  rationale: 'تُصحّح المراجعة موضعين يخلان بوضوح العربية دون تغيير المعنى: صرّحت جهة العداء في فعل الجمع، ورفعت التباس الضمائر في نزع الثياب. وحافظت على ترتيب الأحداث، وعلى وصف الضرب بالعصي، وعلى الحاشيتين وموقعي علامتيهما.'
