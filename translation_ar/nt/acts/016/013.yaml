base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: ar
  text: وفي يوم السبت خرجنا خارج البوابة، إلى جانب نهر، حيث كنا نظن أن هناك موضعًا للصلاة[a]. وبعد أن جلسنا، كنا نكلّم النساء اللواتي اجتمعن هناك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حيث كنا نظن أن الصلاة تُقام». يمكن للكلمة اليونانية أن تدل على الصلاة نفسها أو على موضع مخصّص للصلاة؛ ويرجّح السياق هنا معنى «موضع للصلاة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: وفي يوم السبت
  rationale: هذا تعبير يوناني شائع يدل على يوم السبت؛ والصياغة العربية طبيعية وتحفظ الصلة بالسياق السابق التي تؤديها τε.
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: خرجنا إلى خارج البوابة
  rationale: تحفظ الصياغة توكيد الحركة إلى الخارج في ἐξήλθομεν وἔξω، من غير إضافة «المدينة» لأنها غير مذكورة صراحة.
- source_word: παρὰ ποταμόν
  choice: إلى جانب نهر
  rationale: تفيد παρά مع حالة النصب الاتجاه إلى موضع بمحاذاة النهر. وأُبقي «نهر» نكرة كما في اليونانية.
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: حيث كنا نظن أن هناك موضعًا للصلاة
  rationale: تفيد ἐνομίζομεν الظن في صيغة مستمرة، ويمكن أن تدل προσευχή على الصلاة نفسها أو على موضع مخصص لها؛ والسياق المكاني يرجح المعنى الثاني.
- source_word: καὶ καθίσαντες
  choice: فجلسنا
  rationale: 'ينقل الفعل العربي تسلسل الحدث الذي يدل عليه اسم الفاعل الماضي: وقع الجلوس قبل بدء الكلام، مع صياغة عربية سلسة.'
- source_word: ἐλαλοῦμεν
  choice: وأخذنا نكلّم
  rationale: تركيب «أخذنا نكلّم» يبرز الاستمرار الذي تدل عليه صيغة الماضي الناقص، ويحفظ كون الكلام موجّهًا إلى النساء.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: النساء اللواتي اجتمعن هناك
  rationale: ينقل اجتماع النساء السابق للكلام، و«هناك» مستفادة طبيعيًا من الموضع المذكور في السياق.
theological_decisions:
- issue: دلالة προσευχή في هذا الموضع
  choice: موضعًا للصلاة
  alternative: «صلاة» بوصفها نشاطًا، أو «مجمعًا» بوصفه تحديدًا مؤسسيًا
  rationale: السياق يصف مكانًا عند نهر اجتمع فيه الناس، وتُستعمل προσευχή في اليونانية الهلنستية اليهودية أيضًا للدلالة على موضع للصلاة. لا تُستعمل «مجمع» لأنها أضيق دلالة مما يقوله النص، مع إثبات الاحتمال المعجمي الآخر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حُفظت نكرة «نهر»، ولم تُضف «المدينة» أو «المجمع». وُضع مؤشر الحاشية مباشرة بعد العبارة محل الاحتمال.
