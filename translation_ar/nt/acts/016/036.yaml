  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: ar
  text: 'فَنَقَلَ السَّجَّانُ هذَا الْكَلَامَ إِلَى بُولُسَ: «أَرْسَلَ الْحُكَّامُ[a] أَمْرًا بِإِطْلَاقِ سَرَاحِكُمْ. فَالْآنَ اخْرُجُوا وَامْضُوا بِسَلَامٍ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الحُكّام» ترجمة للكلمة اليونانية στρατηγοί، وهي لقب أصحاب السلطة المدنية في مستعمرة فيلبي الرومانية؛ ويمكن ترجمتها تقنيًّا بـ«البريتورَيْن».
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: نَقَلَ
  rationale: يفيد إبلاغ كلام ورد من جهة أخرى، وهو طبيعي في سياق نقل السجّان رسالة رسمية.
- source_word: ὁ δεσμοφύλαξ
  choice: السَّجَّانُ
  rationale: يدل في هذا السياق على المسؤول عن السجن، و«السجّان» لفظ عربي واضح وموجز.
- source_word: τοὺς λόγους τούτους
  choice: هذَا الْكَلَامَ
  rationale: يحافظ على الإشارة إلى الأقوال المنقولة، بصياغة عربية طبيعية.
- source_word: Ἀπέσταλκαν
  choice: أَرْسَلَ ... أَمْرًا
  rationale: المفعول به محذوف في اليونانية، والسياق يدل على رسالة أو أمر أرسله الحكام؛ إظهار «أمرًا» يوضح المعنى بالعربية من غير تغيير مضمونه.
- source_word: οἱ στρατηγοὶ
  choice: الْحُكَّامُ
  rationale: يشير اللفظ إلى أصحاب السلطة المدنية في فيلبي؛ و«الحكام» واضح للقارئ العام، مع بيان المصطلح الأدق في الحاشية.
- source_word: ἵνα ἀπολυθῆτε
  choice: بِإِطْلَاقِ سَرَاحِكُمْ
  rationale: ينقل معنى التحرير من الحبس، ويحافظ على كون الخطاب موجّهًا إلى جماعة.
- source_word: νῦν οὖν
  choice: فَالْآنَ
  rationale: الفاء تؤدي قوة الاستنتاج التي في οὖν، و«الآن» تحفظ العنصر الزمني.
- source_word: ἐξελθόντες πορεύεσθε
  choice: اخْرُجُوا وَامْضُوا
  rationale: ينقل تسلسل الخروج ثم الذهاب بصيغة أمر عربية سلسة، بدل محاكاة تركيب اسم الفاعل اليوناني.
- source_word: ἐν εἰρήνῃ
  choice: بِسَلَامٍ
  rationale: تعبير عربي مألوف يحفظ معنى الانصراف في سلام وأمان.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أرسل أمرًا» لإظهار المفعول المحذوف الذي يفهم من السياق اليوناني، مع إبقاء مضمون الرسالة رسميًّا. وُضع رمز الحاشية بعد الآية لأنه يشرح لقب «الحكام» الوارد فيها.
