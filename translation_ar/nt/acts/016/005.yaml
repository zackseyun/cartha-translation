  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: ar
  text: فكانت الكنائس تتقوّى في الإيمان[a]، وتزداد عددًا يومًا بعد يوم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يُفهم «الإيمان» هنا على أنه الإيمان المسيحي بوصفه معتقدًا وحياةً مشتركة، أو على أنه الإيمان بوجه أعم.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: فكانت
  rationale: تفيد العبارة انتقالًا إلى خلاصة مترتبة على السرد السابق؛ والفاء تحفظ الصلة الاستنتاجية، بينما تنقل «كانت» الإطار الماضي والاستمرار مع الفعلين المضارعين.
- source_word: ἐκκλησίαι
  choice: الكنائس
  rationale: يشير اللفظ هنا إلى الجماعات المسيحية المحلية، و«الكنائس» هو المقابل العربي المعياري الواضح في هذا السياق.
- source_word: ἐστερεοῦντο
  choice: تتقوّى
  rationale: الماضي الناقص المبني للمجهول يدل على عملية مستمرة؛ وصيغة «كانت تتقوّى» تنقل الاستمرار ومعنى نيل القوة دون إثقال الأسلوب.
- source_word: τῇ πίστει
  choice: في الإيمان
  rationale: يحفظ هذا التعبير إمكان الإشارة إلى الإيمان المسيحي المشترك، مع بقاء احتمال أن يكون المعنى الإيمان بوجه أعم، ولذلك أُثبت البديل في الحاشية.
- source_word: ἐπερίσσευον
  choice: يزداد
  rationale: ينقل معنى النمو المتواصل، ويلائم العبارة التالية التي تحدد أن الزيادة عددية.
- source_word: τῷ ἀριθμῷ
  choice: عددها
  rationale: صياغة عربية طبيعية واضحة للدلالة على جهة الزيادة، أي الزيادة العددية للكنائس.
- source_word: καθ’ ἡμέραν
  choice: يومًا بعد يوم
  rationale: يحفظ المعنى التوزيعي التكراري والنمو المستمر بصورة عربية مألوفة.
theological_decisions:
- issue: دلالة πίστις المعرّفة بأداة التعريف
  choice: الإيمان، بوصفه الإيمان المسيحي المشترك الذي كانت الكنائس تثبت فيه
  alternative: الإيمان بمعنى الثقة أو التصديق بوجه أعم
  rationale: أداة التعريف والسياق الكنسي يرجحان المعنى المشترك أو الموضوعي، لكن التركيب اليوناني لا يلغي المعنى الأعم؛ لذلك حُفظ التوتر الدلالي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «فكانت» لربط الخلاصة بما قبلها، وحُفظت دلالة الاستمرار في الفعلين، مع تجنب صياغة مذهبية تحسم معنى «الإيمان» أكثر مما يسمح به الأصل.
