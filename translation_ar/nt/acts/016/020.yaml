lexical_decisions:
- source_word: προσαγαγόντες
  choice: وبعد أن ساقوهما إلى
  rationale: صيغة اسم الفاعل الأوريستي تدل على فعل سبق الفعل الرئيس «قالوا». و«بعد أن ساقوهما» عربية طبيعية وتحافظ على هذا الترتيب، كما تلائم سياق الإحضار القسري.
- source_word: στρατηγοῖς
  choice: الحُكّام
  rationale: يشير اللفظ هنا إلى كبار المسؤولين المدنيين في فيلبي، وهي مستعمرة رومانية. «الحُكّام» واضح للقارئ المعاصر، مع بيان اللقب التاريخي في الحاشية.
- source_word: ἐκταράσσουσιν
  choice: يثيران الاضطراب
  rationale: ينقل شدة الفعل الدال على إحداث البلبلة والقلاقل، ويحافظ على صيغة المضارع في الاتهام.
- source_word: ἡμῶν τὴν πόλιν
  choice: في مدينتنا
  rationale: يحفظ ضمير الملكية ونبرته المدنية؛ وحرف الجر «في» مطلوب طبيعيًا مع التعبير العربي «يثير الاضطراب».
- source_word: Ἰουδαῖοι
  choice: يهوديان
  rationale: المثنى العربي يطابق بولس وسيلا، واللفظ هنا على الأرجح وصف للهوية العرقية الدينية استُخدم ضمن الاتهام، لا مجرد نسبة جغرافية إلى اليهودية.
- source_word: ὑπάρχοντες
  choice: وهما
  rationale: ينقل الوصف الملازم المعبَّر عنه باسم الفاعل اليوناني في صياغة عربية موجزة، من غير أن يحسم هل هو مجرد وصف أم تعليل ضمني للاتهام.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: هذان الرجلان
  rationale: صيغة المثنى المذكر هي الأنسب في العربية لأن المشار إليهما بولس وسيلا.
theological_decisions:
- issue: نقل Ἰουδαῖοι في سياق اتهام عرقي ديني حساس
  choice: يهوديان
  alternative: رجلان من اليهودية
  rationale: السياق في فيلبي يرجّح الهوية اليهودية العرقية الدينية في مقابل الهوية المدنية الرومانية. والنص ينقل كلام المتهمين العدائي، ولا يصدر حكمًا من الراوي على اليهود عامة.
- issue: العلاقة الدلالية لاسم الفاعل ὑπάρχοντες بالاتهام
  choice: وهما يهوديان
  alternative: لأنهما يهوديان
  rationale: الصياغة المختارة تبقي العلاقة محتملة بين الوصف والتعليل، بدل إدخال سببية صريحة لا تفرضها الصيغة اليونانية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم المثنى حيث يقتضيه السياق، وحُفظت نبرة الاتهام المباشر من غير تغليظ أو تلطيف. وُضع كل مؤشّر حاشية في المتن.
