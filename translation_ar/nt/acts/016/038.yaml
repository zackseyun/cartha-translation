  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: ar
  text: فنقل حَمَلةُ العِصيّ هذه الكلمات إلى الحُكّام[a]، فخافوا حين سمعوا أنهما رومانيان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الحُكّام» ترجمة للكلمة اليونانية التي تشير هنا إلى كبار المسؤولين المدنيين في فيلبي.
    reason: cultural_note
  - marker: b
    text: 'أي إنهما مواطنان رومانيان يتمتعان بالحقوق والحماية القانونية؛ والنص اليوناني يقول حرفيًا: «رومانيان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: نقل
  rationale: يفيد إبلاغ كلامٍ إلى جهة أخرى، ويلائم نقل الرسالة في سياق رسمي.
- source_word: στρατηγοῖς
  choice: الحُكّام
  rationale: يشير في سياق مستعمرة فيلبي الرومانية إلى كبار مسؤولي المدينة؛ و«الحكام» واضحة للقارئ، مع توضيح المنصب في الحاشية.
- source_word: ῥαβδοῦχοι
  choice: حَمَلةُ العِصيّ
  rationale: ترجمة تحفظ الصورة الحسية للاسم اليوناني، أي معاوني الحكام الذين كانوا يحملون العصي علامةً للسلطة.
- source_word: τὰ ῥήματα ταῦτα
  choice: هذه الكلمات
  rationale: ترجمة مباشرة تحيل إلى الكلام الذي أُبلغ به حملة العصي في الآية السابقة.
- source_word: ἐφοβήθησαν
  choice: فخافوا
  rationale: ينقل الاستجابة المباشرة من غير زيادة في درجة الخوف أو تفسير سببه تفصيلًا.
- source_word: ἀκούσαντες
  choice: حين سمعوا
  rationale: صياغة عربية طبيعية تحفظ العلاقة الزمنية، مع بقاء الدلالة السببية مفهومة من السياق.
- source_word: Ῥωμαῖοί
  choice: رومانيان
  rationale: يحفظ اللفظ اليوناني «رومانيين»، مع مراعاة أن المقصود شخصان، بينما توضّح الحاشية دلالته القانونية على المواطنة الرومانية.
theological_decisions: []
