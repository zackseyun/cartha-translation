source:
  edition: SBLGNT
  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: ar
  text: 'ولمّا اعتمدت هي وأهل بيتها، ألحّت علينا قائلة: «إن كنتم قد حكمتم بأني وفيّة للرب[a]، فادخلوا بيتي وأقيموا فيه». وألحّت علينا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مؤمنة بالرب». يمكن أن تعني الصفة اليونانية «وفيّة» أو «جديرة بالثقة» أو «مؤمنة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: ولمّا
  rationale: تنقل المعنى الزمني مع أداة الربط الخفيفة بصياغة عربية طبيعية، من غير مبالغة في إبراز δέ.
- source_word: ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: اعتمدت هي وأهل بيتها
  rationale: مع أن الفعل اليوناني مفرد ويبدأ بالإشارة إلى ليدية، فإن العبارة المنسقة تضم أهل بيتها أيضًا؛ والجمع الدلالي يُفهم طبيعيًا في العربية من الفاعلين المذكورين.
- source_word: ὁ οἶκος αὐτῆς
  choice: أهل بيتها
  rationale: οἶκος هنا يدل على جماعة البيت لا على المبنى، و«أهل بيتها» تعبير عربي واضح لا يحدد أعمارهم أو أحوالهم الإيمانية.
- source_word: παρεκάλεσεν
  choice: ألحّت علينا
  rationale: السياق اللاحق يدل على طلب جاد ومتكرر، فـ«ألحّت» أقوى من «طلبت» وأنسب من تعبير يوحي بالإكراه.
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: إن كنتم قد حكمتم أني أمينة للرب
  rationale: «قد حكمتم» تحفظ دلالة التقييم المستقر في صيغة التام، و«أمينة للرب» تبقي مجال πιστή بين الإيمان والولاء والجدارة بالثقة.
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου
  choice: فادخلوا بيتي
  rationale: يؤدي اسم الفاعل اليوناني هنا وظيفة فعل مصاحب ذي قوة طلبية؛ والمقصود هذه المرة المسكن نفسه.
- source_word: μένετε
  choice: وأقيموا فيه
  rationale: تنقل معنى البقاء ضيوفًا في بيت ليدية بلغة عربية فصيحة وطبيعية.
- source_word: καὶ παρεβιάσατο ἡμᾶς
  choice: وظلّت تلحّ علينا حتى قبلنا
  rationale: تنقل شدة الإصرار والنتيجة المقصودة من الفعل من غير إيحاء بإكراه قسري، وتأتي طبيعية في العربية المعاصرة.
theological_decisions:
- issue: الاستنتاجات المذهبية المحتملة من اعتماد أهل بيت ليدية
  choice: نقل الخبر كما هو من غير تحديد أعمار أفراد البيت أو حالتهم الإيمانية
  alternative: صياغة توحي إما بمعمودية الأطفال وإما بأن جميع أفراد البيت كانوا مؤمنين معترفين
  rationale: الآية تذكر اعتماد ليدية وأهل بيتها، لكنها لا تصف تكوين البيت ولا تقيم حجة صريحة في جدل طقسي لاحق.
- issue: دلالة πιστή في وصف ليدية لنفسها
  choice: أمينة للرب
  alternative: مؤمنة بالرب؛ جديرة بالثقة أمام الرب
  rationale: تحتمل الصفة اليونانية معاني الإيمان والأمانة والموثوقية؛ والنص الرئيس يحفظ البعد العلاقي الأخلاقي، فيما توضح الحاشية البدائل المعجمية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «اعتمدت» للمصطلح المسيحي، و«أهل بيتها» للمعنى الاجتماعي لـοἶκος، مع التمييز بينه وبين «بيتي» الدال على المسكن. وُضع مؤشر الحاشية بعد العبارة التي تشرحها مباشرة.
