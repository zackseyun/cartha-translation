  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: ar
  text: ويُعلِنون عاداتٍ لا يحلّ لنا أن نقبلها أو نمارسها، لأننا رومانيون.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ونحن رومانيون» أو «بصفتنا رومانيين». تذكر العبارة اليونانية السبب الذي يقدّمه موجِّهو الاتهام لرفض هذه العادات.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: أداة عطف تواصل الاتهام الوارد في الآية السابقة.
- source_word: καταγγέλλουσιν
  choice: يُنَادُونَ
  rationale: ينقل معنى الإعلان العلني بعادات معينة في سياق اتهام، من غير تضييقه إلى التعليم الرسمي.
- source_word: ἔθη
  choice: عادات
  rationale: تشير الكلمة إلى الأعراف أو الممارسات المستقرة؛ و«عادات» واضحة وطبيعية في هذا السياق المدني الديني.
- source_word: οὐκ ἔξεστιν
  choice: لا يحلّ
  rationale: يحفظ النبرة القانونية أو الإذنية للعبارة، من غير أن يقرر المترجم صحة دعوى المتهمين قانونيًا.
- source_word: παραδέχεσθαι
  choice: أن نقبلها
  rationale: يعبر عن تلقي هذه العادات أو اعتمادها، مع إبقاء المعنى واسعًا كما في الأصل.
- source_word: οὐδὲ ποιεῖν
  choice: أو نمارسها
  rationale: استعمال «يمارس العادات» عربي طبيعي يؤدي معنى فعلها أو اتباعها.
- source_word: Ῥωμαίοις οὖσιν
  choice: لأننا رومانيون
  rationale: يفهم التركيب الوصفي في الداتيف هنا على أنه يذكر السبب الذي يسوقه المتهمون لرفض تلك العادات.
theological_decisions:
- issue: طبيعة المنع الوارد في الاتهام
  choice: 'صياغة الدعوى بنبرة قانونية: «لا يحلّ لنا»، من غير إقرار بصحتها.'
  alternative: «لا يجوز لنا» أو صياغة أخلاقية أوسع مثل «لا يصح لنا».
  rationale: النص ينقل كلام المتهمين وإطارهم القانوني المدني، ولا يؤكد أن القانون الروماني كان يمنع هذه العادات بالفعل.
- issue: دلالة العبارة Ῥωμαίοις οὖσιν
  choice: 'إظهار الدلالة السببية: «لأننا رومانيون».'
  alternative: «ونحن رومانيون» أو «بصفتنا رومانيين».
  rationale: السببية مناسبة للسياق، مع التنبيه في الحاشية إلى إمكان إبقاء الصياغة الوصفية الأقرب إلى بنية اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. اختيرت «يُنَادُونَ» للإعلان العلني، و«لا يحلّ» للحفاظ على الطابع القانوني للاتهام. وُضعت علامة الحاشية [a] في المتن بعد العبارة التي تشرحها.
