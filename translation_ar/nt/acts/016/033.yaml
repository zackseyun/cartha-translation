  yaml_path: translation/nt/acts/016/033.yaml
  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: ar
  text: فأخذهما في تلك الساعة من الليل، وغسل جراحهما، واعتمد في الحال هو وجميع أهل بيته.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أهل بيته: أي جميع المنتمين إلى بيته ونطاقه المنزلي، وليس التعبير مقصورًا بالضرورة على الأسرة النووية.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβὼν αὐτοὺς
  choice: فأخذهما
  rationale: اسم الفاعل الماضي يدل على فعل سبق الغسل، والضمير يعود في السياق إلى بولس وسيلا. والفاء تسلسِل الأفعال طبيعيًا في العربية من غير تحديد مكان أو هيئة لم يذكرهما النص.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: في تلك الساعة من الليل
  rationale: صياغة قريبة من التركيب اليوناني، وتبرز وقوع الفعل ليلًا وسرعة الاستجابة.
- source_word: ἔλουσεν ἀπὸ τῶν πληγῶν
  choice: غسل جراحهما
  rationale: المعنى السياقي أنه غسل مواضع الإصابات أو آثارها؛ وهذه صياغة عربية واضحة تتجنب الحرفية المربكة «غسلهما من الجراح».
- source_word: ἐβαπτίσθη
  choice: اعتمد
  rationale: الفعل المبني للمجهول يدل على تلقي المعمودية. «اعتمد» تعبير كتابي عربي مستقر، ولا يحدد في ذاته كيفية إجراء المعمودية.
- source_word: οἱ αὐτοῦ πάντες
  choice: جميع أهل بيته
  rationale: ينقل العبارة الدالة على كل من ينتمون إلى نطاق بيته، وهو أوسع دلالة من الأسرة النووية وحدها.
- source_word: παραχρῆμα
  choice: في الحال
  rationale: ينقل دلالة الفورية بعبارة عربية فصيحة وطبيعية.
theological_decisions:
- issue: نطاق οἱ αὐτοῦ πάντες وصلته بالمعمودية
  choice: جميع أهل بيته
  alternative: جميع أفراد أسرته؛ جميع خاصته
  rationale: يقرر النص معمودية الرجل وجميع المنتمين إلى بيته، لكنه لا يحدد أعمارهم ولا يفصل إقرار كل فرد ولا كيفية المعمودية؛ لذلك تُحفظ سعة العبارة من دون حسم نقاشات مذهبية لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تتابع الأفعال وفورية المعمودية، مع تجنب الحرفية غير الطبيعية والتحديدات المذهبية غير الصريحة في اليونانية.
