base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: ar
  text: وبعد أن أصعدهما إلى البيت، قدَّم لهما طعامًا، وابتهج ابتهاجًا عظيمًا مع أهل بيته جميعًا[a]، وقد آمن بالله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يُفهم الأصل أيضًا على أن الابتهاج شمل أهل بيته جميعًا، مع احتمال أن يكونوا قد شاركوه الإيمان كذلك؛ غير أن «وقد آمن» جاءت في اليونانية بصيغة المفرد، وأقرب مرجع لها هو السجّان.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: ثم أصعدهما
  rationale: اسم الفاعل الماضي يدل على فعل سبق الأفعال الرئيسة، والفعل هنا مكاني يشير إلى الصعود من السجن إلى البيت. وصيغة التثنية تلائم بولس وسيلا.
- source_word: οἶκον
  choice: البيت
  rationale: التعريف يحيل في السياق إلى بيت السجّان، من غير حاجة إلى إضافة ضمير ملكية غير مصرَّح به.
- source_word: παρέθηκεν τράπεζαν
  choice: قدَّم لهما طعامًا
  rationale: التعبير اليوناني يعني حرفيًا وضع مائدة، لكنه اصطلاح يدل هنا على تقديم الطعام والضيافة، فاختير تعبير عربي طبيعي.
- source_word: ἠγαλλιάσατο
  choice: ابتهج ابتهاجًا عظيمًا
  rationale: الفعل يدل على فرح شديد ظاهر، والتعبير يحفظ قوته مع فصاحة عربية واضحة.
- source_word: πανοικεὶ
  choice: مع أهل بيته جميعًا
  rationale: الظرف يفيد مشاركة البيت كله أو جميع من فيه، وصيغته هنا تربطه بوضوح بالابتهاج دون أن تحسم وحدها نطاق الإيمان.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: إذ كان قد آمن بالله
  rationale: اسم الفاعل التام المفرد يعود في أقرب قراءة نحوية إلى السجّان، والصياغة تحفظ سبق الإيمان ونتيجته المستمرة مع إبقاء العلاقة الظرفية غير محصورة في سببية صريحة.
theological_decisions:
- issue: نطاق الابتهاج والإيمان بالنسبة إلى أهل البيت
  choice: يُعرض السجّان بوصفه مبتهجًا مع جميع أهل بيته، ويعود «كان قد آمن» بصيغته المفردة إليه.
  alternative: قد يُفهم الكلام على أن أهل البيت جميعًا شاركوا أيضًا في الإيمان، أو أن الابتهاج شمل البيت كله بسبب إيمانهم جميعًا.
  rationale: πανοικεὶ يمكن أن يؤكد اشتراك البيت كله في الابتهاج، وربما يوحي بعض القرّاء بامتداد الإيمان إليهم؛ لكن πεπιστευκώς مفرد مذكر، فيعود نحويًا على نحو مباشر إلى السجّان. لذلك لا يصرّح المتن بإيمان جماعي لا تنص عليه هذه العبارة بوضوح، وتُذكر الإمكانية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «قدَّم لهما طعامًا» بدل النقل الحرفي «وضع مائدة»، واستُبقي الغموض المتعلق بمدى اشتراك أهل البيت في الإيمان بواسطة الحاشية.
