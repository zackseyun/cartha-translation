  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: ar
  text: ولكن لما وصلوا إلى ميسيا[a]، حاولوا أن يذهبوا إلى بيثينيا، فلم يسمح لهم روح يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالقرب من ميسيا» أو «بمحاذاة ميسيا». ويُرجَّح أن العبارة اليونانية تشير إلى بلوغ المنطقة الواقعة عند حدود ميسيا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες δὲ
  choice: ولكن لما وصلوا
  rationale: اسم الفاعل الأوريستي ذو دلالة زمنية، و«لما وصلوا» ينقل تعاقب الأحداث بأسلوب عربي طبيعي، بينما تُظهر «ولكن» التحول الخفيف في مسار الرواية.
- source_word: κατὰ τὴν Μυσίαν
  choice: إلى مشارف ميسيا
  rationale: تحتمل العبارة الجغرافية معنى بمحاذاة ميسيا أو بالقرب منها؛ و«مشارف ميسيا» تفيد بلوغ المنطقة الحدودية من غير الجزم بأنهم دخلوا الإقليم، مع إثبات البدائل في الحاشية.
- source_word: ἐπείραζον
  choice: حاولوا
  rationale: يدل الفعل على محاولة الذهاب، ويُفهم استمرار المحاولة الذي يحمله الماضي الناقص من السياق العربي من غير صياغة ثقيلة.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: أن يذهبوا إلى بيثينيا
  rationale: صياغة واضحة وطبيعية تدل على الحركة المقصودة نحو الإقليم؛ ولا يلزم في العربية استعمال «داخل» لأن «إلى» تؤدي معنى الاتجاه والدخول بحسب السياق.
- source_word: οὐκ εἴασεν αὐτοὺς
  choice: فلم يسمح لهم
  rationale: ينقل معنى عدم الإذن بدقة، من غير تقوية الفعل إلى معنى المنع الصريح أو التحريم.
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: روح يسوع
  rationale: يحافظ على التعبير الكريستولوجي غير المعتاد الوارد صراحة في اليونانية، بدل تسويته إلى «الروح القدس» أو حذف اسم يسوع.
theological_decisions:
- issue: ترجمة العبارة τὸ πνεῦμα Ἰησοῦ
  choice: روح يسوع
  alternative: الروح القدس؛ الروح
  rationale: النص اليوناني يذكر يسوع صراحة، لذا تُحفظ العبارة كما هي من غير مواءمتها مع تعبير مألوف آخر أو إضافة تفسير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. اختيرت «مشارف» لصون الاحتمال الجغرافي في الأصل مع تجنب العبارة الحرفية الملتبسة، وأُبقي «روح يسوع» بلا تفسير مذهبي.
