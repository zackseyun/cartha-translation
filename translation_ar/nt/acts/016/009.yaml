  source_fidelity: 'الترجمة تنقل عناصر النص الأساسية بأمانة: الرؤيا، وقوعها ليلًا، ظهورها لبولس، الرجل المقدوني الواقف، وطلبه العون. لكن «يتوسّل» أقوى عاطفيًا من παρακαλῶν، والحاشية تصف Διαβάς خطأً بأنه «اسم الفاعل» وتعرض «بعد أن تعبر» بوصفه حرفيًا، مع أن دلالة الترتيب ليست لازمة في التركيب اليوناني.'
