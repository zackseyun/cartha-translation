base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: ar
  text: 'وفي الليل ظهرت لبولس رؤيا: كان رجلٌ مقدونيٌّ واقفًا يلتمس منه، قائلًا: «اعبر إلى مكدونية وأعِنّا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يونانيًّا: «عابرًا إلى مكدونية، أعِنّا»؛ اسم الفاعل الماضي اليوناني مع فعل الأمر يؤدي هنا معنى الطلب الطبيعي: «اعبر إلى مكدونية وأعِنّا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅραμα
  choice: رؤيا
  rationale: اللفظ المعتاد في السرد للدلالة على مشهد أو اختبار كشفي، و«رؤيا» مقابل عربي طبيعي يحافظ على طابع الحدث دون تحديد كيفيته.
- source_word: διὰ νυκτός
  choice: في الليل
  rationale: تعبير زمني طبيعي في العربية يبيّن أن الرؤيا حدثت ليلًا.
- source_word: τῷ Παύλῳ ὤφθη
  choice: ظهرت لبولس
  rationale: المبني للمجهول من ὁράω مع المجرور دلاليًا يُفهم هنا بمعنى الظهور لشخص، وهذه الصياغة عربية واضحة وتحافظ على الحدث الكشفي.
- source_word: ἀνὴρ Μακεδών τις
  choice: رجلٌ مقدونيٌّ
  rationale: ἀνήρ يدل هنا على رجل، وΜακεδών يحدد هويته المقدونية؛ أما τις فنكرته العربية من غير حاجة إلى «رجل معيّن» التي قد توحي بأنه معروف.
- source_word: ἑστώς
  choice: كان ... واقفًا
  rationale: يحفظ تصوير هيئة الرجل المستمرة في مشهد الرؤيا.
- source_word: παρακαλῶν
  choice: يتوسّل إليه
  rationale: السياق طلب نجدة بإلحاح، و«يتوسّل» ينقل قوة الالتماس دون جعله أمرًا محضًا.
- source_word: λέγων
  choice: قائلًا
  rationale: صيغة عربية مألوفة لإدخال الكلام المباشر وتحافظ على علاقة الحال بالفعل السابق.
- source_word: Διαβάς
  choice: اعبر
  rationale: يحافظ على صورة الاجتياز في اسم الفاعل اليوناني المرتبط بالأمر التالي، ويؤدي الطلب طبيعيًا في العربية.
- source_word: εἰς Μακεδονίαν
  choice: إلى مكدونية
  rationale: ينقل اتجاه الحركة نحو الإقليم بصياغة عربية طبيعية.
- source_word: βοήθησον ἡμῖν
  choice: أعِنّا
  rationale: أمر مباشر موجز يعبّر بدقة عن طلب المساعدة.
theological_decisions:
- issue: طبيعة الاختبار الذي تصفه ὅραμα وὤφθη
  choice: صياغته كرؤيا ظهرت لبولس دون تحديد آليتها
  alternative: حلم، أو انطباع باطني، أو ظهور موضوعي
  rationale: النص يسمّيه رؤيا ويقول إنها ظهرت لبولس في الليل، لكنه لا يبيّن بدقة كيفية هذا الاختبار؛ لذلك تُحفظ مساحة الغموض الأصلية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «مكدونية» بوصفها الصيغة العربية الشائعة لاسم الإقليم، وحُفظ إلحاح الطلب من غير مبالغة، كما لم تُحدَّد طبيعة الرؤيا بما يتجاوز النص.
