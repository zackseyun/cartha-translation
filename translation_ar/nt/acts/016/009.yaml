  terminology: «رؤيا»، «بولس»، «مقدوني»، «مكدونية»، و«أعِنّا» مناسبة ودقيقة. يُستحسن استبدال «يتوسّل» بـ«يلتمس» لمعادلة παρακαλῶν بصورة أضبط.
