    rationale: Διαβάς اسم فاعل ماضٍ (aorist participle)، ولا تفرض صيغته هنا ترتيبًا زمنيًا بمعنى «بعد أن». في هذا النداء يؤدي مع فعل الأمر وظيفةً اصطلاحية قريبة من «اعبر/تعال عبر».
