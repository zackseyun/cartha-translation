revisions:
- from: 'أمّا بولس فقال لهم: «ضربونا علنًا من غير أن تصدر علينا إدانة[a]، مع أننا مواطنان رومانيان[b]، وألقوا بنا في السجن؛ والآن يريدون إخراجنا سرًّا؟ كلا! بل ليأتوا هم بأنفسهم ويُخرجونا[c]».'
  to: 'أمّا بولس فقال لهم: «ضربونا علنًا من غير حكمٍ بالإدانة[a]، ونحن مواطنان رومانيان[b]، وألقوا بنا في السجن؛ أفَيُخرجوننا الآن سرًّا؟ كلا! بل ليأتوا هم بأنفسهم ويُخرجونا[c]».'
  rationale: The revision corrects the only material semantic shift by rendering ἐκβάλλουσιν as an immediate rhetorical present rather than an expression of intention. It also renders the Roman-status participial phrase more directly as «ونحن مواطنان رومانيان». The judicial wording and all footnote anchors are retained, with no change to the passage's meaning.
