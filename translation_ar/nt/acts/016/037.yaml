id: ACT.16.37
reference: Acts 16:37
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: ar
  text: 'أمّا بولس فقال لهم: «ضربونا علنًا من غير حكمٍ بالإدانة[a]، ونحن مواطنان رومانيان[b]، وألقوا بنا في السجن؛ أفَيُخرجوننا الآن سرًّا؟ كلا! بل ليأتوا هم بأنفسهم ويُخرجونا[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من غير أن يُحكم علينا» أو «ونحن غير مُدانين».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «ونحن رجلان رومانيان»؛ والمقصود في هذا السياق أنهما يحملان المواطنة الرومانية ويتمتعان بحمايتها القانونية.'
    reason: cultural_note
  - marker: c
    text: 'أو: «ويقودونا إلى الخارج» أو «ويصطحبونا إلى الخارج».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: فقال
  rationale: فعل قول سردي بسيط، وصيغة الماضي ملائمة للسياق العربي.
- source_word: Δείραντες
  choice: ضربونا
  rationale: ينقل معنى الضرب من غير تخصيص الأداة أو طريقة العقوبة بما يتجاوز لفظ الآية.
- source_word: δημοσίᾳ
  choice: علنًا
  rationale: مقابل عربي موجز وطبيعي يفيد وقوع الفعل أمام الناس.
- source_word: ἀκατακρίτους
  choice: من غير أن تصدر علينا إدانة
  rationale: يحافظ على المعنى القضائي الدقيق، أي أنهم عوقبوا من غير صدور حكم بالإدانة، من دون حصره بالضرورة في عدم إجراء محاكمة.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: مع أننا مواطنان رومانيان
  rationale: المثنى يلائم بولس وسيلا، ولفظ «مواطنان» يبيّن القوة القانونية للصفة الرومانية في هذا السياق، بينما تنقل «مع أننا» الدلالة الاعتراضية الطبيعية للعبارة.
- source_word: ἔβαλαν εἰς φυλακήν
  choice: وألقوا بنا في السجن
  rationale: يحفظ قوة الفعل βάλλω وما في المعاملة من خشونة.
- source_word: λάθρᾳ
  choice: سرًّا
  rationale: ينقل معنى الفعل الخفي أو غير العلني مباشرة.
- source_word: ἐκβάλλουσιν
  choice: يريدون إخراجنا
  rationale: صياغة عربية طبيعية للسؤال الاستنكاري في سياق محاولة السلطات إطلاقهما خفية، مع إبقاء معنى الإخراج.
- source_word: οὐ γάρ
  choice: كلا!
  rationale: رفض قاطع وموجز يلائم قوة العبارة اليونانية.
- source_word: ἐλθόντες αὐτοὶ
  choice: ليأتوا هم بأنفسهم
  rationale: يحفظ التشديد على وجوب حضور الحكام شخصيًا.
- source_word: ἡμᾶς ἐξαγαγέτωσαν
  choice: ويُخرجونا
  rationale: ينقل فعل الأمر الدال على أن يتولى الحكام أنفسهم إخراجهما؛ ويمكن بحسب السياق فهمه بمعنى قيادتهما أو اصطحابهما إلى الخارج.
theological_decisions:
- issue: القوة القانونية لصفة الرومانية
  choice: مواطنان رومانيان
  alternative: رجلان رومانيان
  rationale: محور احتجاج بولس هو انتهاك الحماية القانونية التي يتمتع بها المواطن الروماني؛ لذلك يوضح لفظ «مواطنان» المقصود السياقي من غير إضافة مذهبية.
- issue: دلالة ἀκατακρίτους القضائية
  choice: من غير أن تصدر علينا إدانة
  alternative: من غير محاكمة؛ غير محكوم علينا
  rationale: اللفظ اليوناني يدل مباشرة على عدم صدور حكم بالإدانة. وهذه الصياغة تحافظ على الدقة وعلى مساحة الغموض بشأن الإجراءات القضائية التي سبقت العقوبة.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كريمة. استُخدم المثنى حيث يحسن إظهاره، وحُفظت حدة احتجاج بولس والسؤال الاستنكاري من غير ألفاظ قانونية معاصرة مفرطة أو تفسير طائفي.
