review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the public beating, lack of judicial condemnation, Roman citizenship, imprisonment, emphatic refusal, and demand that the officials personally bring Paul and Silas out. However, «يريدون إخراجنا» weakens the present-tense force of ἐκβάλλουσιν by changing the asserted action ('they are sending/putting us out') into mere intention ('they want to send us out').
  naturalness: The Arabic is generally clear, idiomatic Modern Standard Arabic, and appropriately forceful. «أفيُخرجوننا الآن سرًّا؟» is both natural and closer to the Greek rhetorical question. Replacing «مع أننا» with «ونحن» more directly reflects the Greek participial apposition while allowing the contrast to arise from the sentence itself.
  terminology: «مواطنان رومانيان» correctly communicates the legal sense of Ῥωμαίους in context. «من غير حكمٍ بالإدانة» preserves the specific judicial sense of ἀκατακρίτους without overtranslating it as absence of a trial. The footnote alternatives remain properly anchored and useful.
  issues:
  - severity: medium
    issue: «يريدون إخراجنا» for ἐκβάλλουσιν
    rationale: The Greek present indicative states what the authorities are now doing or proposing to do in the immediate situation; «يريدون» introduces an intention verb not present in the source and softens Paul's accusation. «أفيُخرجوننا الآن سرًّا؟» retains the rhetorical present and the expulsive/releasing sense.
  - severity: low
    issue: «مع أننا» for ἀνθρώπους Ῥωμαίους ὑπάρχοντας
    rationale: A concessive sense fits the context, but the Greek construction more directly identifies them as Roman men/citizens. «ونحن مواطنان رومانيان» is closer while retaining the contextual contrast.
