base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: ar
  text: فلمّا تلقّى أمرًا كهذا، ألقاهما في السجن الداخلي[a]، وثبّت أقدامهما في المِقْطَرة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «السجن الأشد توغّلًا في الداخل».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «في الخشب»؛ والمقصود في هذا السياق أداة خشبية كانت تُثبَّت فيها الأقدام لتقييد السجين.'
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: أمرًا كهذا
  rationale: «أمر» تعبير عربي طبيعي عن توجيه صادر من سلطة، ويحفظ معنى العبارة اليونانية من غير زيادة.
- source_word: λαβὼν
  choice: إذ تلقّى
  rationale: ينقل اسم الفاعل الماضي بوصفه فعلًا سابقًا للفعل الرئيس، مع صياغة عربية سلسة.
- source_word: ἔβαλεν
  choice: ألقاهما
  rationale: يحفظ القوة الدلالية للفعل βάλλω وما يوحي به السياق من معاملة قاسية، بدل التعبير الأخف «وضعهما».
- source_word: ἐσωτέραν φυλακήν
  choice: السجن الداخلي
  rationale: ينقل صيغة المقارنة بمعنى الموضع الأبعد إلى الداخل، مع إبقاء احتمال معنى «الأشد توغلًا في الداخل» في الحاشية.
- source_word: ἠσφαλίσατο
  choice: ثبّت
  rationale: يفيد إحكام التقييد وجعله مأمون الانفلات، ويلائم تقييد الأقدام في الأداة الخشبية.
- source_word: τοὺς πόδας αὐτῶν
  choice: أقدامهما
  rationale: المرجع شخصان، لذلك استُعمل المثنى العربي، وπούς تعني «قدم» مباشرة.
- source_word: εἰς τὸ ξύλον
  choice: في المِقْطَرة
  rationale: ξύλον تعني حرفيًا الخشب أو الشيء الخشبي، لكنها تشير هنا في سياق السجن إلى أداة خشبية لتقييد القدمين؛ و«المِقْطَرة» اسم عربي دقيق لهذه الأداة، مع شرحها في الحاشية.
