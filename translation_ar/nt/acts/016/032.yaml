  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: ar
  text: وكلَّماه بكلمة الرب، مع جميع الذين في بيته.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «برسالة الرب». وقد تعني العبارة اليونانية الرسالة التي تخص الرب، أو الصادرة عنه، أو التي تتحدث عنه.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «وإلى جميع أهل بيته». وقد تشير العبارة إلى كل من كان حاضرًا في البيت، أو إلى أهل البيت بوصفهم جماعة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: كلَّماه
  rationale: الفعل يدل هنا على مخاطبة السجّان وإبلاغه الرسالة شفهيًا. «كلَّماه» عربية طبيعية وتحافظ على كون الفاعل مثنّى وعلى الضمير المفرد في αὐτῷ، من غير أن تضيف إيحاءً بخطاب علني كما قد تفعل «ناديا» أو «بشّراه».
- source_word: τὸν λόγον
  choice: بكلمة
  rationale: λόγος يشير إلى الرسالة المنطوقة، و«كلمة» تحفظ التعبير الشائع في العهد الجديد وتُبقي إضافة «الرب» مفتوحة الدلالة.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: تحافظ «كلمة الرب» على صيغة الإضافة اليونانية من غير حسم ما إذا كانت الكلمة صادرة عن الرب أو متعلقة به.
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: هو وجميع الذين في بيته
  rationale: تنقل σύν معنى المصاحبة، وتوضح بالعربية أن السجّان كان مع جميع الموجودين في بيته ضمن متلقي الكلام، من غير تحويل العبارة صراحةً إلى مفعول غير مباشر ثانٍ.
- source_word: οἰκίᾳ
  choice: بيته
  rationale: «البيت» يحفظ المعنى المكاني المباشر لـ οἰκία، مع احتمال دلالتها سياقيًا على أهل البيت.
theological_decisions:
- issue: دلالة «كلمة الرب»
  choice: الإبقاء على «كلمة الرب» من غير تحديد نوع الإضافة
  alternative: الرسالة عن الرب / الرسالة الآتية من الرب
  rationale: قد تدل العبارة اليونانية على كلمة تخص الرب أو تصدر عنه أو تتعلق به؛ لذلك يحفظ النص الرئيس هذا الاتساع بدل تضييقه إلى تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم ترتيب «هو وجميع الذين في بيته» بعد الفاصلة لتجنب الإيهام بأن أهل البيت كانوا مجرد حاضرين، مع إبقاء معنى المصاحبة في σύν. جميع علامات الحواشي الواردة مثبتة في المتن.
