  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: ar
  text: أراد بولس أن يصطحب تيموثاوس معه في رحلته[a]، فأخذه وختنه بسبب اليهود الذين كانوا في تلك الأنحاء[b]، لأنهم كانوا جميعًا يعرفون أن أباه يوناني[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أن يخرج معه»، وهو تعبير قد يدل هنا على الانطلاق معه في رحلة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «من أجل اليهود» أو «مراعاةً لليهود».'
    reason: lexical_alternative
  - marker: c
    text: أي إن أباه كان يونانيًا؛ وفي هذا السياق يُرجَّح أن الوصف يبيّن أنه لم يكن يهوديًا.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: تيموثاوس
  rationale: اسم الإشارة يعود إلى تيموثاوس المذكور في السياق السابق. التصريح بالاسم يمنع التباس الضمائر في العربية من غير أن يضيف معنى جديدًا.
- source_word: ἠθέλησεν
  choice: أراد
  rationale: ينقل دلالة الإرادة أو الرغبة بصياغة عربية طبيعية مباشرة.
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: أن يصطحب تيموثاوس معه في رحلته
  rationale: المعنى الحرفي هو «أن يخرج معه»، لكنه في هذا السياق يدل على الانطلاق معه في السفر؛ والصياغة المختارة واضحة وطبيعية، مع إثبات البديل الحرفي في الحاشية.
- source_word: λαβὼν
  choice: فأخذه
  rationale: اسم الفاعل الماضي يدل على فعل سابق للختان؛ والفاء تنقل التتابع بسلاسة من غير مبالغة في الفصل الزمني.
- source_word: περιέτεμεν
  choice: وختنه
  rationale: ترجمة مباشرة وصريحة للفعل اليوناني من غير تلطيف.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: بسبب اليهود
  rationale: διά مع المنصوب تفيد السبب أو الدافع هنا؛ و«بسبب» تحافظ على هذا الاتساع من غير أن تفترض وحدها غاية تصالحية.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: الذين كانوا في تلك الأنحاء
  rationale: «الأنحاء» عربية طبيعية للدلالة على المواضع المحلية المتعددة، وتحفظ الإشارة المكانية من غير افتراض أنهم كانوا مقيمين فيها إقامة دائمة.
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: لأنهم كانوا جميعًا يعرفون
  rationale: «لأن» تنقل القوة التفسيرية لـγάρ، و«جميعًا» تحفظ توكيد ἅπαντες، والضمير يعود إلى اليهود المذكورين.
- source_word: Ἕλλην
  choice: يوناني
  rationale: يحفظ الوصف الصريح Ἕλλην بدل توسيعه تلقائيًا إلى «أممي»، مع توضيح دلالته السياقية المحتملة في الحاشية.
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: أن أباه يوناني
  rationale: ينقل معنى الكينونة ببساطة وطبيعية؛ ولا يستدعي السياق إبراز فروق دقيقة مثل «كان في الأصل».
theological_decisions:
- issue: سبب ختان تيموثاوس وعلاقته بموقف اليهود المحليين
  choice: عرض الختان بوصفه فعلًا قام به بولس بسبب معرفة اليهود بخلفية والد تيموثاوس
  alternative: اعتباره إقرارًا بأن الختان لازم للخلاص، أو الجزم بأنه كان مجرد تدبير تبشيري لا غير
  rationale: النص يصرح بالدافع السردي، لكنه لا يستخلص بنفسه حكمًا عقائديًا عامًا بشأن ضرورة الختان أو عدمها؛ لذلك تحافظ الترجمة على التوتر من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُخدم اسم تيموثاوس لتفادي غموض توالي الضمائر، واستُعمل «يصطحب ... معه في رحلته» لنقل المعنى السياقي لعبارة الخروج معه، مع حفظ صورتها الحرفية في الحاشية. جميع علامات الحواشي مثبتة في المتن.
