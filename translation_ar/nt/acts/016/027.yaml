  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: ar
  text: ولمّا استيقظ السجّان ورأى أبواب السجن مفتوحة[a]، استلّ سيفه[b] وكان على وشك أن يقتل نفسه، ظانًّا أن السجناء قد هربوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أقرب إلى تركيب اليونانية: «رأى أن أبواب السجن قد فُتحت». وتؤكد صيغة اسم المفعول التام المبني للمجهول في اليونانية حالة الأبواب بعد فتحها.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تدل الكلمة اليونانية μάχαιρα على سيف أو على نصل أقصر، مثل خنجر؛ لكن «سيف» هي الترجمة السياقية المألوفة هنا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: استيقظ
  rationale: ينقل بصورة طبيعية في العربية الانتقال إلى حالة اليقظة.
- source_word: δεσμοφύλαξ
  choice: السجّان
  rationale: يدل على المسؤول عن حراسة المسجونين، وهو أدق في السياق من «الحارس».
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: رأى أبواب السجن مفتوحة
  rationale: 'يحافظ على دلالة اسم المفعول التام في اليونانية، أي الحالة الناتجة: كانت الأبواب في وضع مفتوح، من غير حسم الفاعل.'
- source_word: σπασάμενος τὴν μάχαιραν
  choice: استلّ سيفه
  rationale: تعبير عربي فصيح وطبيعي لإخراج السلاح من غمده؛ و«سيف» مقابل سياقي مألوف لـ μάχαιρα مع التنبيه إلى سعة مدلولها.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: كان على وشك أن يقتل نفسه
  rationale: ينقل دلالة الفعل على قرب وقوع الفعل، ويؤدي معنى القتل في هذا السياق بوضوح.
- source_word: νομίζων
  choice: ظانًّا
  rationale: يعرض استنتاج السجّان بوصفه اعتقادًا لا يقينًا.
- source_word: ἐκπεφευγέναι
  choice: قد هربوا
  rationale: «قد» مع الماضي تنقل اكتمال الهرب السابق لرد فعل السجّان.
- source_word: τοὺς δεσμίους
  choice: السجناء
  rationale: المقابل العربي الواضح للأشخاص المحتجزين في هذا السياق.
