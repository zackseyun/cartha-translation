lexical_decisions:
- source_word: αἰτήσας
  choice: فطلب
  rationale: اسم الفاعل الأوْرِسْتي يدل على فعل سابق للفعل الرئيس؛ والصياغة العربية الموجزة تحافظ على تتابع الحدث من غير تكلّف.
- source_word: δὲ
  choice: فـ
  rationale: تفيد هنا انتقال السرد واستمراره، لا مقابلة قوية؛ والفاء تلائم تتابع الأحداث في العربية.
- source_word: φῶτα
  choice: مصابيح
  rationale: الجمع يشير في السياق إلى وسائل إنارة. و«مصابيح» تعبير طبيعي لا يحدد نوعًا بعينه كالمشاعل.
- source_word: εἰσεπήδησεν
  choice: اندفع إلى الداخل
  rationale: ينقل الحركة المفاجئة القوية إلى داخل المكان بلغة عربية واضحة وطبيعية، مع إبقاء «وثب» بديلًا ممكنًا.
- source_word: ἔντρομος γενόμενος
  choice: وهو يرتجف من الخوف
  rationale: ينقل الحالة الناتجة التي تجمع الخوف والارتجاف الجسدي، من غير ترجمة حرفية متكلّفة للفعل γενόμενος.
- source_word: προσέπεσεν
  choice: ارتمى أمام
  rationale: يحفظ صورة السقوط أمام شخصين في خوف أو تضرع، من غير أن يقرر أن الفعل عبادة أو يحدد هيئة سجود كاملة.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: أمام بولس وسيلا
  rationale: حرف «أمام» يؤدي وظيفة المجرور اليوناني مع προσπίπτω، ولا يضيف عبارة «عند قدميهما» غير المذكورة صراحة.
theological_decisions:
- issue: طبيعة حركة السجّان أمام بولس وسيلا
  choice: ارتمى أمام بولس وسيلا
  alternative: سجد لبولس وسيلا؛ أو خرّ عند قدمي بولس وسيلا
  rationale: الفعل اليوناني يمكن أن يدل على السقوط أمام شخص بدافع الخوف أو التوسل أو التوقير، ولا يقتضي بذاته العبادة. لذلك تحافظ الصياغة على الفعل ودلالته المفتوحة من غير استيراد حكم لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع جمل فعلية متتابعة تناسب سرعة المشهد. وُضعت علامات الحواشي ملاصقة للعبارات التي تشرحها.
