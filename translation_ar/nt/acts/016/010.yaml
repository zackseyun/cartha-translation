  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: ar
  text: ولمّا رأى الرؤيا، سعينا في الحال إلى السفر إلى مكدونية، مستنتجين أن الله قد دعانا إلى أن نبشّرهم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: ولمّا
  rationale: تفيد الاستمرار السردي مع الدلالة الزمنية، وتصل الحدث بما قبله بعبارة عربية طبيعية.
- source_word: τὸ ὅραμα
  choice: الرؤيا
  rationale: المقابل العربي المألوف والدقيق لمشهد إعلاني يُرى.
- source_word: εἶδεν
  choice: رأى
  rationale: الماضي العربي يبيّن وقوع رؤية الرؤيا قبل السعي اللاحق من خلال ترتيب الجملة، من غير حاجة إلى تركيب زائد.
- source_word: εὐθέως
  choice: في الحال
  rationale: تنقل معنى المبادرة الفورية بلغة عربية فصيحة واضحة.
- source_word: ἐζητήσαμεν
  choice: سعينا
  rationale: تحفظ معنى بذل الجهد والشروع المقصود، ولا تختزل الفعل في مجرد الرغبة.
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: إلى التوجّه إلى مكدونية
  rationale: صياغة عربية طبيعية تنقل حركة الانطلاق نحو الوجهة؛ أما النقل الحرفي «الخروج إلى» فقد يوحي في العربية بخروج مكدونية نفسها أو يحتاج إلى مبدأ حركة مذكور.
- source_word: συμβιβάζοντες
  choice: مستنتجين
  rationale: يعبر عن جمع دلالة الرؤيا والخروج منها بحكم أو نتيجة.
- source_word: προσκέκληται
  choice: قد دعانا
  rationale: ينقل الدعوة الإلهية السابقة ذات الأثر القائم، ويحافظ على معنى النداء أو التكليف دون إضعافه إلى مجرد الإرشاد.
- source_word: ὁ θεὸς
  choice: الله
  rationale: المقابل العربي المباشر للاسم المعرف في السياق.
- source_word: εὐαγγελίσασθαι αὐτούς
  choice: إلى أن نبشّرهم
  rationale: فعل «بشّر» في العربية الكتابية الجارية ينقل معنى إعلان الخبر السار، والضمير مفعول به طبيعي للفعل.
theological_decisions:
- issue: الانتقال إلى ضمير المتكلمين في السرد
  choice: سعينا
  alternative: صياغة غير شخصية مثل «جرى السعي»
  rationale: النص اليوناني يصرّح بضمير المتكلمين، فينبغي حفظ هذه السمة السردية من غير بناء نظرية في هوية الكاتب.
- issue: لغة المبادرة الإلهية في προσκέκληται ἡμᾶς ὁ θεὸς
  choice: أن الله قد دعانا
  alternative: أن الله كان يرشدنا
  rationale: الفعل يدل على الدعوة أو الاستدعاء، لا على توجيه عام فحسب؛ و«قد» تساعد على إبراز الفعل السابق ذي الصلة بالحاضر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تسلسل الرؤيا ثم الاستجابة الفورية، واحتُفظ بضمير المتكلمين وبقوة الدعوة الإلهية. لم تُضف حواشٍ لأن البدائل المذكورة في طبقة المشاورة الإنجليزية لا تمثل هنا غموضًا نصيًا يستلزم حاشية، كما أن مواضع علاماتها هناك لا تتطابق مع مضامين الحواشي.
