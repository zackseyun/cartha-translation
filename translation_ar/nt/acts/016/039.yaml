  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: ar
  text: فجاءوا فناشدوهما، وأخرجوهما، وكانوا يطلبون منهما أن يغادرا المدينة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: فجاءوا
  rationale: اسم فاعل ماضٍ يقدّم فعل الحكّام التالي؛ وصيغة «فجاءوا» عربية طبيعية تحفظ تعاقب الأحداث.
- source_word: παρεκάλεσαν
  choice: استرضوهما
  rationale: للفعل مجال دلالي يشمل الطلب والحث والتشجيع والتعزية. وفي هذا السياق يدل على محاولة الحكّام استرضاء بولس وسيلا بعد إساءة معاملتهما، لا على تعزيتهما.
- source_word: αὐτούς
  choice: هما
  rationale: الضمير يعود إلى بولس وسيلا، والمثنى العربي يبيّن مرجعه بوضوح.
- source_word: ἐξαγαγόντες
  choice: ثم أخرجوهما
  rationale: يحفظ معنى إخراجهما والحركة إلى خارج موضع الاحتجاز، مع صياغة عربية سلسة تبيّن التتابع.
- source_word: ἠρώτων
  choice: أخذوا يطلبون
  rationale: صيغة الماضي الناقص اليونانية قد تدل على طلب مستمر أو متكرر؛ و«أخذوا يطلبون» تنقل هذا الجانب من غير مبالغة.
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: أن يغادرا المدينة
  rationale: 'تعبير عربي معاصر وطبيعي ينقل مضمون الطلب: الرحيل عن المدينة.'
