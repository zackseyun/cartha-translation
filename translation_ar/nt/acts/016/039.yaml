  source_fidelity: المعنى العام محفوظ، بما في ذلك مجيء الحكّام وإخراجهما وطلب مغادرتهما المدينة. لكن «استرضوهما» يفسّر الفعل παρεκάλεσαν تفسيرًا أقوى وأكثر تحديدًا من اللازم؛ فالفعل هنا أقرب إلى المناشدة أو الطلب الملحّ ذي النبرة التصالحية. كذلك «أخذوا يطلبون» قد يوحي ببدء الطلب، وهي دلالة لا يقتضيها الماضي الناقص اليوناني، وإن كان يمكن أن يدل على الاستمرار أو التكرار.
