  terminology: «ناشدوهما» أدقّ وأقل تحميلًا تفسيريًا من «استرضوهما»، مع إمكان بيان النبرة التصالحية في الحاشية. «يغادرا المدينة» تعبير حديث سليم ومطابق للمعنى.
