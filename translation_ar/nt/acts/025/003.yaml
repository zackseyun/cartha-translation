lexical_decisions:
- source_word: αἰτούμενοι
  choice: طالبين
  rationale: اسم فاعل حالي مرتبط بفاعل الآية السابقة، ويحافظ على معنى الطلب وعلى الصيغة التابعة في اليونانية.
- source_word: χάριν
  choice: خدمةً
  rationale: تؤدي معنى المعروف أو التنازل المطلوب في تركيب αἰτεῖν χάριν، وهي أوضح للقارئ المعاصر من «منّة» في هذا السياق.
- source_word: κατ’ αὐτοῦ
  choice: ضدّه
  rationale: يحفظ القوة العدائية لحرف الجر في السياق، فالطلب لم يكن متعلقًا ببولس على نحو محايد.
- source_word: ὅπως
  choice: وهي أن
  rationale: يبين مضمون الخدمة المطلوبة بعبارة عربية طبيعية، من غير إلغاء ما في الأداة من دلالة غائية محتملة.
- source_word: μεταπέμψηται
  choice: يأمر بإحضاره
  rationale: يعبر عن كون الوالي سيجعل آخرين ينقلون بولس إلى أورشليم؛ وتُذكر في الحاشية دلالة «يرسل في طلبه» الممكنة للفعل.
- source_word: εἰς Ἰερουσαλήμ
  choice: إلى أورشليم
  rationale: ترجمة اتجاهية مباشرة وطبيعية.
- source_word: ἐνέδραν ποιοῦντες
  choice: فيما كانوا يدبّرون كمينًا
  rationale: ينقل الفعل المصاحب للطلب ويصوغ تعبير نصب الكمين بلغة عربية مألوفة.
- source_word: ἀνελεῖν
  choice: لقتله
  rationale: ينقل المعنى المباشر للفعل في هذا السياق بلا تهوين ولا إضافة توصيف قانوني.
- source_word: κατὰ τὴν ὁδόν
  choice: في الطريق
  rationale: تعبير عربي طبيعي يدل على وقوع الفعل أثناء الرحلة وعلى مسارها.
