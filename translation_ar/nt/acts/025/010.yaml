source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: ar
  text: 'لكن بولس قال: «أنا واقف أمام محكمة قيصر[a]، حيث ينبغي أن أُحاكَم[b]. لم أرتكب أيَّ ظلم في حق اليهود[c]، كما تعلم أنت أيضًا جيدًا»[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «كرسي قضاء قيصر». تشير الكلمة اليونانية βῆμα إلى كرسي القضاء الرسمي أو المحكمة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حيث يجب أن أُحاكَم».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لم أُسِئ إلى اليهود في شيء»، أو «لم أرتكب أيَّ جُرم في حق اليهود».'
    reason: lexical_alternative
  - marker: d
    text: 'حرفيًا: «كما تعلم أنت أيضًا معرفةً أفضل». تفيد العبارة أن فستوس يعلم ذلك جيدًا.'
    reason: source_idiom
lexical_decisions:
- source_word: βῆμα
  choice: محكمة
  rationale: تشير الكلمة هنا إلى مقام القضاء الرسمي وسلطته، لا إلى المنصة المادية وحدها. و«محكمة» واضحة وطبيعية في العربية المعاصرة.
- source_word: Καίσαρος
  choice: قيصر
  rationale: يحافظ هذا اللفظ على اللقب الإمبراطوري والسياق القانوني الروماني.
- source_word: ἑστώς εἰμι
  choice: أنا واقف
  rationale: ينقل التركيب اليوناني المحيطي حالة بولس القانونية الراهنة مع الحفاظ على صورة الوقوف أمام القضاء.
- source_word: οὗ
  choice: وهنا
  rationale: يعود الظرف على محكمة قيصر بوصفها الجهة أو الموضع المختص بالمحاكمة؛ و«هنا» طبيعية في سياق كلام بولس أمام الوالي.
- source_word: δεῖ
  choice: ينبغي
  rationale: تعبّر عن ضرورة قانونية وإجرائية من غير أن تحوّلها إلى مجرد إلزام شخصي.
- source_word: κρίνεσθαι
  choice: أن أُحاكَم
  rationale: المبني للمجهول في هذا السياق قانوني، و«أُحاكَم» أوضح عربيًا من «يُحكَم عليَّ»، التي قد توحي بصدور الحكم النهائي.
- source_word: Ἰουδαίους
  choice: اليهود
  rationale: ترجمة مباشرة تناسب الاتهامات التي رفعها خصوم بولس اليهود، من غير تضييق المصطلح جغرافيًا إلى سكان اليهودية وحدهم.
- source_word: οὐδὲν ἠδίκησα
  choice: لم أرتكب أيَّ ظلم في حق
  rationale: تحفظ العبارة القوة الأخلاقية والقانونية للفعل ἀδικέω، وتأتي بصياغة عربية واضحة.
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: كما تعلم أنت أيضًا حقَّ المعرفة
  rationale: «أنت أيضًا» تُظهر توكيد الضمير، و«حق المعرفة» تنقل قوة المعرفة الدقيقة التي تفيدها العبارة من غير استعمال مقارنة عربية ملتبسة مثل «تعلم أفضل».
theological_decisions:
- issue: طبيعة ضرورة محاكمة بولس أمام محكمة قيصر
  choice: الإبقاء على «ينبغي» من غير تحديد هل الضرورة قانونية محضة أم تدخل ضمن تدبير إلهي
  alternative: «يجب قانونًا أن أُحاكَم هنا»
  rationale: السياق يبرز الاختصاص القضائي الروماني، لكن δεῖ قد تحمل في لوقا وأعمال الرسل دلالة أوسع؛ لذلك لا تُحصر الدلالة في تفسير لاهوتي أو قانوني زائد على النص.
translation_notes:
  register: صياغة عربية فصحى معاصرة ذات نبرة قضائية رصينة. استُعملت «محكمة» بدل «كرسي القضاء» في المتن للوضوح، مع حفظ الصورة الحرفية في الحاشية، وأُبقي توكيد «أنت أيضًا» ظاهرًا.
