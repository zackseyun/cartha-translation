base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: ar
  text: 'حينئذٍ، بعد أن تشاور فِستوس مع المجلس، أجاب: «لقد رفعتَ استئنافك إلى قيصر؛ إلى قيصر ستذهب[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ستمضي للمثول أمام قيصر». فالعبارة تحمل في هذا السياق معنى قانونيًا، أي الذهاب للمثول أمام سلطة قيصر القضائية بعد الاستئناف إليه.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: فحينئذٍ
  rationale: أداة ربط زمنية وتسلسلية طبيعية في السرد، تحافظ على انتقال الحدث.
- source_word: συλλαλήσας
  choice: بعد أن تشاور
  rationale: يعبّر اسم الفاعل الماضي عن فعل سابق للجواب، والسياق الإداري يرجّح معنى التداول والتشاور لا مجرد الحديث.
- source_word: μετὰ τοῦ συμβουλίου
  choice: مع المجلس
  rationale: يحافظ على دلالة هيئة المشورة من دون إضافة ضمير ملكية غير صريح في اليونانية.
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: مقابل سردي مباشر يلائم المقام القضائي الرسمي.
- source_word: Καίσαρα
  choice: قيصر
  rationale: يحفظ اللقب الروماني وصيغته المألوفة في العربية الكتابية.
- source_word: ἐπικέκλησαι
  choice: رفعتَ دعواك إلى
  rationale: 'ينقل المعنى القانوني للفعل في صيغة التام: الاحتكام إلى سلطة قيصر بطريق الاستئناف، بعبارة عربية واضحة.'
- source_word: ἐπὶ Καίσαρα
  choice: إلى قيصر
  rationale: مع فعل الذهاب يدل على التوجه إلى صاحب السلطة القضائية؛ وتبقى دلالة المثول أمامه مضمّنة في السياق القانوني.
- source_word: πορεύσῃ
  choice: ستذهب
  rationale: يحافظ على المستقبل وفعل الحركة الصريح، من دون تحويله إلى مبني للمجهول مثل «ستُرسَل».
