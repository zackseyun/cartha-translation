  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: ar
  text: ولأنني كنتُ متحيِّرًا في بحث هذه الأمور[a]، سألتُه هل يرغب[b] في الذهاب إلى أورشليم، وفي أن يُحاكَم هناك بشأن هذه الأمور.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «متحيِّرًا في النزاع بشأن هذه الأمور».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «هل كان مستعدًّا للذهاب إلى أورشليم وللمحاكمة هناك بشأن هذه الأمور».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπορούμενος
  choice: كنتُ متحيِّرًا
  rationale: ينقل معنى الحيرة والعجز عن تبيّن وجه المسألة، مع فهم اسم الفاعل هنا على أنه يبيّن سبب سؤال فستوس.
- source_word: ζήτησιν
  choice: بحث
  rationale: لفظ عربي طبيعي يحتمل معنى النظر والتحقيق في مسألة، ويلائم السياق القضائي من غير أن يحصر الكلمة في خصومة أو إجراء تقني بعينه.
- source_word: περὶ τούτων
  choice: في بحث هذه الأمور / بشأنها
  rationale: تحافظ الصياغة على الإحالة إلى القضايا المذكورة، وتستخدم الضمير في التكرار الثاني تجنبًا للثقل.
- source_word: ἔλεγον
  choice: سألتُه
  rationale: المعنى الحرفي هو «قلت»، لكن جملة الاستفهام غير المباشر التي تليه تجعل المقصود الوظيفي «سألت».
- source_word: εἰ βούλοιτο
  choice: هل يرغب
  rationale: ينقل مضمون السؤال غير المباشر بعبارة عربية واضحة، مع إبقاء احتمال معنى الاستعداد في الحاشية.
- source_word: πορεύεσθαι
  choice: في الذهاب
  rationale: ترجمة طبيعية للفعل الدال على الذهاب أو الانتقال.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الشائعة لاسم المدينة.
- source_word: κἀκεῖ
  choice: هناك
  rationale: يحفظ دلالة «وهناك» ضمن ترتيب عربي طبيعي.
- source_word: κρίνεσθαι
  choice: أن يُحاكَم
  rationale: السياق قضائي، و«يُحاكَم» أوضح في العربية المعاصرة من «يُدان» التي قد توحي سلفًا بثبوت الذنب، ومن «يُقضى عليه» التي قد تضيق المعنى.
