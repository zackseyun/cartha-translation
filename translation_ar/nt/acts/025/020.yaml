  register: عربية فصحى معاصرة واضحة ذات نبرة قضائية رصينة. رُبطت الحاشية [a] بلفظ «بحث» والحاشية [b] بلفظ «يرغب» لكي يظهر موضع كل بديل بوضوح، مع الحفاظ على غموض ζήτησις بين البحث والنزاع.
