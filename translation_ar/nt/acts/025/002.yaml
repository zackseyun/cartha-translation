  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: ar
  text: فعرض عليه رؤساء الكهنة ووجوه اليهود قضيتهم ضد بولس[a]، وأخذوا يلحّون عليه،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أبلغوه بأمر بولس»، أو «قدّموا إليه اتهامات ضد بولس». يمكن أن يعني الفعل اليوناني إطلاع شخص على أمر، لكنه يحمل هنا على الأرجح دلالة قضائية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: عرض عليه ... قضيتهم
  rationale: الفعل يعني إظهار الأمر أو عرضه على صاحب سلطة، ويحمل هنا في السياق القضائي معنى تقديم القضية دون افتراض وجود لائحة اتهام رسمية صريحة.
- source_word: τέ
  choice: فـ
  rationale: أداة ربط تصل الحدث بما قبله، والفاء طبيعية في السرد العربي من غير تحميلها توكيدًا زائدًا.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: المقابل العربي المألوف للجماعة القيادية الكهنوتية في أورشليم.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: وجوه اليهود
  rationale: تعبير عربي واضح ودال على أصحاب المكانة والنفوذ بين اليهود، ويحافظ على معنى πρῶτοι الاجتماعي والسياسي.
- source_word: κατὰ τοῦ Παύλου
  choice: ضد بولس
  rationale: κατά مع المضاف إليه هنا تفيد الخصومة والاتهام، لا مجرد الحديث عنه.
- source_word: παρεκάλουν
  choice: أخذوا يلحّون
  rationale: ينقل صيغة الماضي الناقص الدالة على الاستمرار أو التكرار، ويوافق سياق الطلب الملحّ من الوالي.
