  verdict: approve
  source_fidelity: 'النص العربي ينقل بدقة المعنى القضائي للفعل ἐνεφάνισαν في هذا السياق: عرضُ الأمر/القضية على صاحب سلطة، مع المحافظة على جهة الخصومة في «ضد بولس». كما ينقل «رؤساء الكهنة» و«وجوه اليهود» الجماعتين المذكورتين، ويُظهر «أخذوا يلحّون عليه» دلالة الاستمرار أو التكرار في الماضي الناقص παρεκάλουν. والضميران «عليه» يعودان بوضوح في السياق إلى فستوس.'
  naturalness: 'الصياغة فصيحة حديثة وسلسة: «فعرض عليه رؤساء الكهنة ووجوه اليهود قضيتهم ضد بولس، وأخذوا يلحّون عليه». واستعمال «وجوه اليهود» طبيعي في العربية للدلالة على الأعيان وذوي المكانة.'
  terminology: «رؤساء الكهنة» مصطلح مناسب ومستقر، و«وجوه اليهود» يحفظ معنى πρῶτοι بوصفهم البارزين أو الأعيان دون توسيع غير لازم إلى منصب رسمي. الحاشية تعرض البدائل المعجمية بوضوح ولا تدّعي وجود لائحة اتهام رسمية.
