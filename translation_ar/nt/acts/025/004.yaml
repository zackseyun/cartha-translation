  language: ar
  text: فأجاب فِستُس بأن بولس كان محتجزًا في قيصرية، وأنه هو نفسه على وشك المغادرة قريبًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: لا يزال محتجزًا
  rationale: المصدر المضارع المبني للمجهول يدل على استمرار إبقاء بولس تحت الحراسة أو الاحتجاز؛ وهذه الصياغة طبيعية وواضحة بالعربية.
- source_word: εἰς Καισάρειαν
  choice: في قيصرية
  rationale: يفهم السياق أن بولس محتجز في قيصرية، مع التنبيه في الحاشية إلى اختلاف نصي مهم في حرف الجر.
- source_word: ἐν τάχει ἐκπορεύεσθαι
  choice: أن يذهب إلى هناك قريبًا
  rationale: ἐν τάχει يفيد قرب الوقت، وἐκπορεύεσθαι يدل على الخروج أو الانطلاق؛ أضيف «إلى هناك» بحسب اتجاه الرحلة المفهوم من السياق والقراءة النصية البديلة.
