  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: ar
  text: أما بولس، فلما استأنف طالبًا أن يبقى محتجزًا إلى حين صدور قرار الإمبراطور[a]، أمرتُ بإبقائه محتجزًا حتى أرسله إلى قيصر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «المبجَّل»؛ واليونانية Σεβαστός لقب إمبراطوري يقابل اللقب اللاتيني «أغسطس». ويمكن ترجمتها هنا: «الإمبراطور».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: استأنف
  rationale: الفعل في هذا السياق القضائي الروماني يدل على تقديم استئناف رسمي، و«استأنف» هو التعبير القانوني العربي الطبيعي.
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: أن يبقى محتجزًا / بإبقائه محتجزًا
  rationale: يدل الفعل هنا على الاحتجاز الرسمي لا مجرد الحفظ أو الحراسة، وحافظت الصياغة على هذا المعنى في الموضعين.
- source_word: διάγνωσιν
  choice: صدور قرار
  rationale: تشير الكلمة إلى البت أو القرار القضائي؛ و«صدور قرار» واضحة ولا تحصر المعنى في جلسة استماع أو في حكم إدانة.
- source_word: Σεβαστοῦ
  choice: جلالة الإمبراطور
  rationale: هو لقب إمبراطوري يقابل «أغسطس/المبجّل»، لا اسم شخص هنا. تنقل الصياغة وظيفة اللقب بعبارة عربية مفهومة، مع بيان اللفظ اليوناني في الحاشية.
- source_word: ἀναπέμψω
  choice: أرسله
  rationale: يفيد إرساله إلى السلطة الإمبراطورية الأعلى؛ و«أرسله» طبيعية وواضحة، ولا يلزم إظهار الدلالة الاتجاهية حرفيًا.
- source_word: πρὸς Καίσαρα
  choice: إلى قيصر
  rationale: تحافظ على اللقب التاريخي الوارد في النص، وهو مفهوم في سياق سفر الأعمال.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة قضائية ملائمة للسياق. استُخدم «محتجزًا» لإبراز الحبس الرسمي، و«جلالة الإمبراطور» لنقل اللقب الإمبراطوري بصورة طبيعية مع حفظ دلالته الحرفية في الحاشية.
