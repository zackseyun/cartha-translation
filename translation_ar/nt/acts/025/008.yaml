base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: ar
  text: 'فدافع بولس عن نفسه قائلًا: «لم أُخطئ في شيء ضد شريعة اليهود[a]، ولا ضد الهيكل، ولا ضد قيصر».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم أرتكب أي مخالفة بحق شريعة اليهود، أو الهيكل، أو قيصر».'
    reason: بديل معجمي يبرز الدلالة القضائية للفعل ἥμαρτον وللجهات التي يُدَّعى وقوع المخالفة بحقها.
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: وكان بولس يدافع عن نفسه قائلًا
  rationale: ينقل المعنى القضائي للفعل في تركيب المضاف المطلق، ويهيئ للاقتباس المباشر بصياغة عربية طبيعية.
- source_word: ὅτι
  choice: قائلًا مع نقطتي الاقتباس
  rationale: تدخل الأداة اليونانية مضمون الدفاع، ويؤدي «قائلًا» وعلامات الاقتباس هذه الوظيفة بوضوح في العربية.
- source_word: νόμον τῶν Ἰουδαίων
  choice: شريعة اليهود
  rationale: يحافظ على الإضافة اليونانية وعلى المرجع الديني والقومي من غير تضييق زائد للمعنى.
- source_word: ἱερόν
  choice: الهيكل
  rationale: هو المقابل العربي المألوف لمجمع الهيكل في هذا السياق، دون قصره على القدس الداخلي.
- source_word: Καίσαρά
  choice: قيصر
  rationale: يحفظ اللقب الوارد في اليونانية والسياق السياسي القضائي.
- source_word: τι
  choice: في شيء
  rationale: 'مع النفي يفيد الشمول والتوكيد: لم يقع منه أي خطأ في أي من الجهات الثلاث.'
- source_word: ἥμαρτον
  choice: أخطئ
  rationale: يحفظ الصلة الدلالية بالخطيئة، مع بقاء العبارة صالحة في السياق القضائي، بدل اختزالها في مصطلح قانوني محض.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: لا ... ولا ... ولا
  rationale: ينقل النفي الثلاثي بتركيب عربي واضح وموزون.
theological_decisions:
- issue: الدلالة القانونية أم الأخلاقية للفعل ἥμαρτον
  choice: لم أخطئ
  alternative: لم أرتكب أي مخالفة
  rationale: السياق قضائي، لكن الفعل اليوناني هو اللفظ المعتاد للخطأ والخطيئة؛ لذلك تحافظ «أخطئ» على التوتر بين البعدين الأخلاقي والقانوني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة قضائية رصينة. استُعمل «إلى» في المتن مع «أخطئ» للمحافظة قدر الإمكان على التكرار اليوناني εἰς، مع تقديم صياغة قانونية أكثر سلاسة في الحاشية.
