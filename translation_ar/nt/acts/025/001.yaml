  text: Φῆστος οὖν ἐπιβὰς τῇ ἐπαρχείᾳ μετὰ τρεῖς ἡμέρας ἀνέβη εἰς Ἱεροσόλυμα ἀπὸ Καισαρείας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/001.yaml
  text: So Festus[a], after arriving in the province, went up from Caesarea to Jerusalem after three days,
translation:
  language: ar
  text: فلما قَدِم فستوس إلى الإقليم[a]، صعد بعد ثلاثة أيام من قيصرية إلى أورشليم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «دخل الإقليم»، أو: «تولّى إدارة الإقليم». يمكن أن يدل التعبير اليوناني على وصول فستوس إلى إقليمه، وأن يلمّح أيضًا إلى بدء إدارته له.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φῆστος
  choice: فستوس
  rationale: نقل صوتي للاسم وفق الصيغة العربية الشائعة في الترجمات الكتابية.
- source_word: οὖν
  choice: فـ
  rationale: تفيد مواصلة السرد وربط الحدث بما قبله بأسلوب عربي طبيعي موجز.
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: لما قَدِم ... إلى الإقليم
  rationale: يحافظ على دلالة اسم الفاعل الزمنية وعلى المعنى المباشر للوصول إلى الإقليم، من غير حسم الإيحاء المحتمل ببدء تولّي الإدارة.
- source_word: ἐπαρχείᾳ
  choice: الإقليم
  rationale: يشير اللفظ إلى إقليم إداري روماني؛ و«الإقليم» واضح تاريخيًا ولا يحصر المعنى في منصب الوالي.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: بعد ثلاثة أيام
  rationale: ترجمة مباشرة للدلالة الزمنية التي تفيد وقوع الرحلة عقب انقضاء ثلاثة أيام.
- source_word: ἀνέβη
  choice: صعد
  rationale: يحفظ التعبير الجغرافي المألوف عن الصعود إلى أورشليم، بما يلائم ارتفاعها والاستعمال الكتابي.
- source_word: εἰς Ἱεροσόλυμα
  choice: إلى أورشليم
  rationale: صياغة عربية طبيعية ودقيقة لجهة المقصد.
- source_word: ἀπὸ Καισαρείας
  choice: من قيصرية
  rationale: تنقل نقطة انطلاق الرحلة بوضوح.
theological_decisions: []
translation_notes:
  register: 'العربية فصحى معاصرة واضحة ووقورة. حُفظ ترتيب مسار الرحلة طبيعيًا في العربية: من قيصرية إلى أورشليم، وأُبقي الغموض الدلالي في عبارة الوصول إلى الإقليم مع توضيحه في الحاشية.'
