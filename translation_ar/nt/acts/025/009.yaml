  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: ar
  text: 'لكن فستوس، إذ كان يريد أن يصنع لليهود معروفًا[a]، أجاب بولس قائلًا: «أتريد أن تصعد إلى أورشليم، فتُحاكَم هناك أمامي في هذه الأمور؟»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي تقديم خدمة لهم أو استرضاؤهم. والمقصود بـ«اليهود» هنا، بحسب السياق، المشتكون أو القادة اليهود الذين كانوا يتابعون الدعوى، لا جميع اليهود بلا تمييز.
    reason: lexical_alternative_and_contextual_clarification
  - marker: b
    text: 'يمكن أيضًا: «فيُنظر في قضيتك هناك أمامي» أو «فتُحاكَم هناك أمامي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: إذ كان يريد
  rationale: ينقل اسم الفاعل الدال على دافع فستوس المستمر بصياغة عربية سردية طبيعية، من غير المبالغة في تقدير نيته.
- source_word: τοῖς Ἰουδαίοις
  choice: لليهود
  rationale: يحافظ على اللفظ اليوناني العام، بينما يوضح السياق أن المقصود هنا المشتكون أو القادة اليهود القائمون على الدعوى، لا كل اليهود بلا تمييز.
- source_word: χάριν καταθέσθαι
  choice: أن يصنع ... معروفًا
  rationale: تعبير عربي مألوف ينقل معنى تقديم خدمة أو استرضاء أصحاب الدعوى، من غير إضافة إيحاء صريح بالتملق لا يفرضه الأصل.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: أجاب ... قائلًا
  rationale: صياغة عربية طبيعية تحافظ على البنية السردية التي تقدم كلام فستوس بوصفه جوابًا لبولس.
- source_word: Θέλεις
  choice: أتريد
  rationale: سؤال مباشر عن إرادة بولس، وهو أقرب إلى اللفظ اليوناني من صياغة تقتصر على مجرد الاستعداد أو القبول.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: أن تصعد إلى أورشليم
  rationale: يحفظ فعل الصعود المرتبط بأورشليم جغرافيًا وعرفيًا، وهو تعبير واضح وطبيعي في العربية الكتابية المعاصرة.
- source_word: περὶ τούτων
  choice: في هذه الأمور
  rationale: يحافظ على عموم الإشارة في الأصل من غير تخصيصها بالتهم، مع أن التهم مفهومة من السياق.
- source_word: κριθῆναι
  choice: تُحاكَم
  rationale: السياق قضائي، و«تُحاكَم» أوضح في العربية الحديثة من النقل الحرفي «يُحكَم عليك»، الذي قد يوحي بصدور الإدانة أو الحكم النهائي.
- source_word: ἐπ’ ἐμοῦ
  choice: أمامي
  rationale: ينقل حضور فستوس وسلطته في نظر القضية من غير الجزم بأنه القاضي الوحيد أو صاحب القرار المنفرد.
theological_decisions:
- issue: احتمال التعميم السلبي لعبارة «اليهود»
  choice: الإبقاء على «اليهود» في المتن مع توضيح مرجعها السياقي في الحاشية
  alternative: القادة اليهود؛ المشتكون اليهود؛ أهل اليهودية
  rationale: الأصل يستعمل اللفظ العام، فلا ينبغي تضييقه تأويليًا في المتن. لكن السياق يحدد عمليًا المشتكين أو القادة الذين كانوا يلاحقون القضية، ولذلك تمنع الحاشية تعميم الكلام على كل يهودي.
- issue: مدى سلطة فستوس في المحاكمة المقترحة
  choice: «أمامي»
  alternative: «على يدي» أو «تحت سلطتي»
  rationale: يحفظ التعبير احتمال أن فستوس سيترأس المحاكمة أو ينظر القضية من غير حسم تفاصيل اختصاصه القضائي التي لا يحددها التركيب وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقضائية كريمة. استُعملت «أورشليم» وفق التقليد العربي الكتابي، وحُفظ «الصعود» إليها. جُمعت الملاحظتان المتصلتان بتعبير المعروف ومرجع «اليهود» في حاشية واحدة لتجنب تثقيل الآية، ووُضعت علامة البديل القضائي بعد الاقتباس.
