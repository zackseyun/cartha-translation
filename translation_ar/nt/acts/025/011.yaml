  to: فإن كنتُ أرتكب ظلمًا، وقد فعلتُ شيئًا يستحق الموت، فلا أرفض أن أموت. أما إن كانت اتهامات هؤلاء لي لا أساس لها، فلا يستطيع أحد أن يسلّمني إليهم محاباةً لهم.[a] إني أرفع استئنافي إلى قيصر.
