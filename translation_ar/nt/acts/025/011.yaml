source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: ar
  text: فإن كنتُ أرتكب ظلمًا، وقد فعلتُ شيئًا يستحق الموت، فلا أرفض أن أموت. أما إن كانت اتهامات هؤلاء لي لا أساس لها، فلا يستطيع أحد أن يسلّمني إليهم محاباةً لهم.[a] إني أرفع استئنافي إلى قيصر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يسلّمني إليهم إرضاءً لهم». يتضمن الفعل اليوناني معنى منح شخص أو تسليمه إلى آخرين على سبيل المحاباة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: أرتكب ظلمًا
  rationale: يحافظ على دلالة المضارع وعلى البعد الأخلاقي والقانوني للفعل، بصياغة عربية واضحة لا تحصره في جريمة محددة.
- source_word: ἄξιον θανάτου
  choice: يستحق الموت
  rationale: ينقل معنى الاستحقاق أو الأهلية لعقوبة الموت من غير تحويل العبارة إلى مصطلح قانوني أضيق من الأصل.
- source_word: πέπραχά τι
  choice: فعلتُ شيئًا
  rationale: ينقل الفعل التام بوصفه فعلًا وقع وله صلة بالحكم الراهن، مع إبقاء τι نكرة عامة.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: فلا أرفض أن أموت
  rationale: ترجمة مباشرة وطبيعية لمعنى الامتناع أو الرفض، وتحفظ قبول بولس المشروط للموت إن ثبت استحقاقه.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: إن كانت اتهامات هؤلاء لي لا أساس لها
  rationale: يؤدي المعنى الاصطلاحي بأن التهم خالية من المضمون أو السند، من غير إضافة تقرير تفصيلي غير موجود في النص.
- source_word: χαρίσασθαι
  choice: يسلّمني إليهم محاباةً لهم
  rationale: يجمع بين معنى تسليم الشخص ومعنى منحه للآخرين على سبيل التفضل أو إرضائهم، وهو ملائم للسياق القضائي والسياسي.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: إني أرفع دعواي إلى قيصر
  rationale: يعبّر بوضوح عن الإجراء القانوني المتمثل في الاحتكام إلى الإمبراطور، مع الحفاظ على لقب قيصر.
- source_word: μὲν οὖν ... δὲ
  choice: فإن ... أما إن
  rationale: يبين فرعي الحجة الشرطية والتقابل بينهما بأسلوب عربي فصيح وطبيعي.
theological_decisions:
- issue: الدلالة القضائية لقبول الموت والاستئناف إلى قيصر
  choice: يحفظ النص قبول بولس المشروط للموت إن كان قد ارتكب ما يستحقه، مع رفض تسليمه إلى خصومه بلا أساس قضائي.
  alternative: اعتبار الكلام بلاغيًا محضًا لا يتضمن أي إقرار بشرعية العقوبة أو الإجراءات.
  rationale: التركيب الشرطي صريح، لكن غرض الآية قضائي لا تقرير مذهب عام في العقوبة؛ لذلك لا توسّع الترجمة دلالته ولا تلغي التوتر القائم.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة قضائية كريمة. استُخدم «لا أساس لها» لتجنب تركيب حرفي متعثر، وأُبقي معنى المحاباة في المتن لكونه جزءًا مهمًا من دلالة الفعل اليوناني.
