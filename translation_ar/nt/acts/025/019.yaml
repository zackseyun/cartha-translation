base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: ar
  text: بل كانت لهم معه بعضُ المسائل الخلافية بشأن ديانتهم هم[a]، وبشأن شخصٍ يُدعى يسوع كان قد مات، وكان بولس يزعم أنه حيّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خرافاتهم هم». يمكن أن تُستعمل الكلمة اليونانية بمعنى محايد هو «الديانة»، أو بمعنى انتقاصي هو «الخرافة»، ولا سيما على لسان شخص من خارجها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: مسائل خلافية
  rationale: يدل الاسم على أمور موضع نزاع لا على أسئلة محايدة؛ وهذه الصياغة تحفظ المعنى الجدلي من غير مبالغة قانونية.
- source_word: δέ
  choice: بل
  rationale: تفيد هنا الانتقال التصحيحي المقابل لما كان متوقعًا من تُهم جنائية في السياق السابق.
- source_word: τινα
  choice: بعض
  rationale: تنقل التنكير وعدم التحديد في العبارة اليونانية بصورة عربية طبيعية.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: حول ديانتهم الخاصة
  rationale: اللفظة اليونانية تحتمل معنى محايدًا هو الديانة ومعنى انتقاصيًا هو الخرافة؛ واختيار «ديانتهم» أوضح وأقل تحميلًا للنص، فيما تحفظ «الخاصة» مسافة فستوس بوصفه غريبًا عنها.
- source_word: εἶχον πρὸς αὐτόν
  choice: كانت لهم معه
  rationale: ينقل العلاقة بين الخصوم وبولس من غير إضافة دلالة اتهام قانوني رسمي ليست لازمة في التركيب.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: وحول شخص يُدعى يسوع
  rationale: ينقل الإشارة النكرة البعيدة التي تدل على عدم معرفة فستوس به، مع تجنب الركاكة المحتملة في «يسوعٍ ما».
- source_word: τεθνηκότος
  choice: كان قد مات
  rationale: ينقل اسم الفاعل التام الدال على حالة ناتجة عن الموت، ويمهد للمقابلة مع القول إنه حي.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: وكان بولس يزعم أنه حيّ
  rationale: «يزعم» تنقل تقرير فستوس لقول بولس من غير أن تجعل فستوس أو الراوي في هذه الجملة يصدّقه أو ينفيه.
theological_decisions:
- issue: ترجمة δεισιδαιμονία في كلام فستوس
  choice: ديانتهم الخاصة
  alternative: خرافاتهم الخاصة
  rationale: قد تكون اللفظة محايدة أو تحمل انتقاصًا من منظور مسؤول روماني غريب عن اليهودية. المتن يتجنب فرض الإهانة الأقوى، والحاشية تحفظ الاحتمال الآخر.
- issue: صياغة القول عن قيامة يسوع
  choice: وكان بولس يزعم أنه حيّ
  alternative: وكان بولس يقول إنه حيّ
  rationale: تحفظ الصياغة كون العبارة تقريرًا من فستوس لادعاء بولس، لا تأكيدًا مباشرًا من الراوي في هذا الموضع، من غير أن تحكم على صدق القيامة في مواضع أخرى.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «مسائل خلافية» لإبقاء الطابع الجدلي، و«شخص يُدعى يسوع» لنقل مسافة فستوس بأسلوب طبيعي، مع إثبات علامة الحاشية [a] في المتن.
