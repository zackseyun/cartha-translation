base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: ar
  text: أمّا أنا فوجدتُ أنه لم يرتكب شيئًا يستحقّ الموت؛ غير أنه، إذ كان هو نفسه قد رفع استئنافًا إلى الإمبراطور[a]، قررتُ أن أرسله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أوغسطس». واللفظ اليوناني Σεβαστός لقبٌ يشير هنا إلى الإمبراطور الروماني.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: وجدتُ
  rationale: يفيد الفعل هنا ما توصّل إليه فستوس من نتيجة بعد فحص القضية؛ و«وجدتُ» تعبير عربي طبيعي لا يبالغ في إضفاء صيغة حكم قضائي نهائي.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: لم يفعل شيئًا يستحقّ الموت
  rationale: تنقل العبارة انتفاء أي فعل يوجب الموت، مع إبقاء لفظ «الموت» كما في اليونانية بدل تفسيره صراحةً بـ«عقوبة الإعدام».
- source_word: πεπραχέναι
  choice: يفعل
  rationale: يؤدي المعنى العام للفعل πράσσω في هذا السياق، بينما توفّر عبارة «يستحق الموت» الدلالة القضائية اللازمة.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: ولكن لأنه هو نفسه رفع دعواه
  rationale: تحفظ «هو نفسه» توكيد الضمير، وتبيّن «لأنه» أن هذا الاستئناف كان الظرف المفضي إلى قرار الإرسال؛ و«رفع دعواه» صياغة عربية واضحة لفعل الالتجاء إلى السلطة الإمبراطورية العليا.
- source_word: τὸν Σεβαστόν
  choice: الإمبراطور
  rationale: Σεβαστός لقب إمبراطوري يقابل Augustus، والمقصود هنا صاحب المنصب الروماني لا أغسطس التاريخي بعينه؛ لذا فـ«الإمبراطور» أوضح للقارئ الحديث.
- source_word: ἔκρινα
  choice: قررتُ
  rationale: يدل الفعل هنا على اتخاذ فستوس قرارًا إجرائيًا، و«قررتُ» عربية طبيعية ودقيقة.
- source_word: πέμπειν
  choice: أن أرسله
  rationale: أُظهر مفعول الإرسال المفهوم من السياق ليكتمل التعبير العربي من غير إضافة معنى جديد.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أمّا أنا» لإبراز الضمير ἐγώ، وحُفظ التحول بـ«ولكن». الصياغة قريبة من البنية الأصلية مع تكييفها لتكون طبيعية في العربية.
