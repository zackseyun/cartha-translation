source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: ar
  text: 'وقال فستوس: «أيها الملك أغريباس، ويا جميع الرجال الحاضرين معنا، أنتم ترون هذا الرجل الذي تقدّم إليَّ جمهور اليهود بأسره بطلبٍ بشأنه، في أورشليم وهنا أيضًا، صارخين أنه لا ينبغي أن يبقى حيًّا بعد الآن[b]».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «جمهور اليهود بأسره». يستعمل النص اليوناني تعبيرًا جمعيًّا يعكس تلخيص فستوس للمعارضة، ولا يعني بالضرورة كل فرد يهودي بلا استثناء.
    reason: lexical_alternative
  - marker: b
    text: أو «أنه لا ينبغي أن يعيش بعد الآن».
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: وقال
  rationale: المضارع التاريخي اليوناني يضفي حيوية على السرد، لكن الماضي «وقال» هو الأسلوب الطبيعي الواضح في السرد العربي ولا يغيّر زمن الحدث.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: جميع الرجال الحاضرين معنا
  rationale: يحافظ على دلالة الحضور المشترك وعلى كون المخاطَبين رجالًا في هذا المحفل الرسمي.
- source_word: θεωρεῖτε τοῦτον
  choice: أنتم ترون هذا الرجل
  rationale: ينقل توجيه فستوس أنظار الحاضرين إلى بولس بصياغة عربية طبيعية، مع إبراز ضمير المخاطبين.
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: جمهور اليهود كله
  rationale: «جمهور» ينقل التعبير الجمعي πλῆθος، و«كله» يحفظ قوة ἅπαν، من غير تحويل العبارة إلى حكم صريح على كل فرد يهودي.
- source_word: ἐνέτυχόν μοι
  choice: رفع إليَّ ... طلبًا بشأنه
  rationale: ينقل معنى التقدم إلى صاحب سلطة بطلب أو التماس، ويحافظ على السياق القضائي بصياغة عربية مفهومة.
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: في أورشليم وهنا أيضًا
  rationale: يحفظ الترابط بين الموضعين؛ و«هنا» تشير في السياق إلى قيصرية من غير إضافتها إلى النص.
- source_word: βοῶντες
  choice: صارخين
  rationale: يحفظ دلالة رفع الصوت والإلحاح القوي في الفعل اليوناني.
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: أنه لا ينبغي أن يبقى حيًّا بعد الآن
  rationale: يحفظ معنى الضرورة أو الاستحقاق المدَّعى في δεῖ، ودلالة μηκέτι على عدم استمرار حياته، من غير صياغته كحكم إعدام تقني.
theological_decisions:
- issue: الإشارة إلى «اليهود» في سياق خصومة قضائية
  choice: الإبقاء على «اليهود» مع جعل πλῆθος «جمهورًا» جمعيًّا
  alternative: القادة اليهود؛ جميع اليهود أفرادًا
  rationale: النص اليوناني يذكر اليهود صراحة، فلا يصح تضييقه إلى القادة وحدهم. وفي الوقت نفسه، التعبير جمعي وارد في تلخيص فستوس للمعارضة، فلا يلزم منه أن كل يهودي بلا استثناء شارك في الطلب.
- issue: قوة العبارة المطالِبة بموت بولس
  choice: لا ينبغي أن يبقى حيًّا بعد الآن
  alternative: يجب قتله؛ لا ينبغي أن يعيش بعد الآن
  rationale: الصياغة المختارة تحفظ التوتر بين معنى الوجوب ومعنى توقف استمرار الحياة، ولا تستبدل العبارة بصيغة قضائية صريحة لا يذكرها الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رسمية تناسب خطاب الوالي أمام الملك والحاضرين. استُخدم «أيها الملك أغريباس» للنداء الرسمي، وحُفظت حيوية «صارخين» مع تجنب الألفاظ القديمة أو الاصطلاحات الطائفية.
