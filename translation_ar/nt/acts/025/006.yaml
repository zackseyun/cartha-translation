source:
  edition: SBLGNT
  text: Διατρίψας δὲ ἐν αὐτοῖς ἡμέρας ⸂οὐ πλείους ὀκτὼ⸃ ἢ δέκα, καταβὰς εἰς Καισάρειαν, τῇ ἐπαύριον καθίσας ἐπὶ τοῦ βήματος ἐκέλευσεν τὸν Παῦλον ἀχθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: ar
  text: وبعد أن أمضى بينهم ما لا يزيد على ثمانية أو عشرة أيام، نزل إلى قيصرية. وفي اليوم التالي جلس على كرسي القضاء[a]، وأمر بإحضار بولس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جلس على منصة القضاء». تشير الكلمة اليونانية βῆμα إلى المقعد أو المنصة الرسمية التي كان الحاكم يجلس عليها لإصدار الأحكام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας
  choice: بعد أن أمضى
  rationale: اسم فاعل ماضٍ يدل على فعل سبق الأفعال الرئيسة، وتعبير «أمضى ... أيامًا» عربي طبيعي يحفظ الدلالة الزمنية.
- source_word: ἐν αὐτοῖς
  choice: بينهم
  rationale: يحفظ معنى وجود فستوس وسط الأشخاص المذكورين في السياق السابق، بصياغة عربية موجزة وطبيعية.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: ما لا يزيد على ثمانية أو عشرة أيام
  rationale: يحفظ المقارنة المنفية والتقدير غير الجازم في «ثمانية أو عشرة»، من غير تحويل العبارة إلى عدد دقيق.
- source_word: καταβὰς
  choice: نزل
  rationale: يحفظ التعبير الجغرافي المعتاد عن الانتقال من أورشليم إلى قيصرية، مع تحويل التركيب الاشتقاقي إلى فعل عربي طبيعي.
- source_word: Καισάρειαν
  choice: قيصرية
  rationale: الصيغة العربية الشائعة لاسم المدينة Καισάρεια.
- source_word: τῇ ἐπαύριον
  choice: في اليوم التالي
  rationale: تعبير عربي واضح ودقيق يدل على اليوم الذي أعقب وصوله.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: جلس على كرسي القضاء
  rationale: يفيد βῆμα هنا المقعد أو المنصة الرسمية التي يجلس عليها الحاكم لممارسة القضاء؛ و«كرسي القضاء» أوضح للقارئ العربي من النقل الصوتي أو التعبير المبهم.
- source_word: ἐκέλευσεν
  choice: أمر
  rationale: ينقل بوضوح الأمر الرسمي الصادر في سياق قضائي.
- source_word: τὸν Παῦλον ἀχθῆναι
  choice: بإحضار بولس
  rationale: ينقل المبني للمجهول في المصدر اليوناني بصيغة عربية مألوفة، من غير تحديد فاعل الإحضار الذي لم يذكره النص.
