  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: ar
  text: فأجبتهم بأن من عادة الرومان ألا يسلِّموا أيَّ إنسانٍ[b] إرضاءً لأحد[a] قبل أن يواجه المتهمُ متهميه، وتُتاح له فرصة الدفاع عن نفسه بشأن التهمة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يمنحوا أيَّ إنسانٍ كمعروف»؛ فالفعل اليوناني قد يعني تسليم شخص استجابةً لطلب مُشتكٍ وإرضاءً له.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أيَّ إنسان»؛ والتعبير عام في هذا السياق القضائي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: عادة
  rationale: تدل الكلمة على عرف أو ممارسة مستقرة، و«عادة» واضحة وطبيعية في هذا السياق القضائي.
- source_word: Ῥωμαίοις
  choice: الرومان
  rationale: تشير صيغة الجمع إلى الرومان بوصفهم جماعة ذات أعراف قضائية، من غير حاجة إلى إضافة «السلطات» غير المذكورة صراحة.
- source_word: χαρίζεσθαί
  choice: يسلِّموا ... إرضاءً لأحد
  rationale: يجمع التعبير بين معنى تسليم الشخص ومعنى منحه استجابةً لطلب طرف آخر، فيحفظ الدلالة الخاصة للفعل في السياق.
- source_word: τινα ἄνθρωπον
  choice: أيَّ إنسان
  rationale: يحفظ ذكر ἄνθρωπον صراحةً ويؤدي المعنى العام في عربية فصيحة طبيعية.
- source_word: ὁ κατηγορούμενος
  choice: المتهم
  rationale: مقابل قانوني موجز وطبيعي لاسم الفاعل المستعمل اسميًا.
- source_word: κατὰ πρόσωπον
  choice: يواجه ... متهميه
  rationale: يؤدي معنى المواجهة المباشرة وجهًا لوجه بصياغة عربية طبيعية، ويتجنب ثقل التكرار.
- source_word: τόπον ... ἀπολογίας
  choice: تُتاح له فرصة الدفاع عن نفسه
  rationale: τόπος هنا مجازي بمعنى المجال أو الفرصة، وἀπολογία دفاع قضائي؛ والصياغة واضحة في العربية المعاصرة.
- source_word: ἐγκλήματος
  choice: التهمة
  rationale: لفظ قانوني مفهوم يقابل الاتهام أو الدعوى الموجهة إلى المتهم.
