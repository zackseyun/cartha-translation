source:
  edition: SBLGNT
  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: ar
  text: وليس عندي بشأنه شيء مؤكَّد أكتبه إلى مولاي[a]. لذلك أحضرته أمامكم جميعًا، ولا سيما أمامك أنت، أيها الملك أغريباس، حتى يكون لدي، بعد إجراء التحقيق[b]، ما أكتبه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بعبارة أوضح: «الإمبراطور». اللفظ اليوناني هو «السيد»، وقد استُعمل هنا لقبًا رسميًّا للإمبراطور الروماني.'
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا ترجمة «التحقيق» بـ«الاستجواب» أو «النظر في القضية»؛ والمقصود فحص قضية بولس فحصًا قضائيًّا.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: بشأنه
  rationale: ينقل معنى «في ما يخصّه» بإيجاز طبيعي، مع بقاء بولس هو المرجع الواضح من السياق.
- source_word: ἀσφαλές τι
  choice: شيء مؤكَّد
  rationale: تدل العبارة على معلومة ثابتة أو محددة يمكن الاعتماد عليها في تقرير رسمي؛ و«شيء مؤكَّد» عربية واضحة وتحفظ هذا المعنى.
- source_word: γράψαι
  choice: أكتبه
  rationale: ينقل فعل كتابة التقرير مباشرة، ويأتي الضمير مناسبًا للمفعول المذكور قبله.
- source_word: τῷ κυρίῳ
  choice: إلى مولاي
  rationale: يحفظ معنى لقب κύριος في سياق المخاطبة الرسمية، بينما توضّح الحاشية أن المقصود هو الإمبراطور الروماني.
- source_word: διὸ
  choice: لذلك
  rationale: تُظهر بوضوح أن إحضار بولس نتيجة لعدم وجود شيء مؤكَّد يُكتب عنه.
- source_word: προήγαγον
  choice: أحضرته
  rationale: الفعل يعني إحضاره إلى الأمام أو تقديمه أمام الحاضرين؛ وهذه الصياغة طبيعية في مشهد جلسة رسمية.
- source_word: ἐφ’ ὑμῶν
  choice: أمامكم جميعًا
  rationale: تحفظ صيغة الجمع وتبرز الفرق بينها وبين الخطاب المفرد اللاحق الموجَّه إلى أغريباس.
- source_word: μάλιστα ἐπὶ σοῦ
  choice: ولا سيما أمامك أنت
  rationale: تنقل تشديد العبارة على أغريباس من بين سائر الحاضرين، وتستعمل «أنت» لتوضيح الانتقال إلى المفرد.
- source_word: βασιλεῦ Ἀγρίππα
  choice: أيها الملك أغريباس
  rationale: صيغة نداء عربية فصيحة وطبيعية تقابل لقب الملك والاسم في حالة النداء.
- source_word: ὅπως
  choice: حتى
  rationale: تعبّر بوضوح عن غرض فستوس من عرض القضية على الحاضرين.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: بعد إجراء التحقيق
  rationale: تحوّل التركيب المطلق إلى عبارة زمنية عربية طبيعية، وتحفظ الطابع القضائي لكلمة ἀνάκρισις.
- source_word: σχῶ τί γράψω
  choice: يكون لدي ... ما أكتبه
  rationale: تحفظ صورة امتلاك مادة يمكن كتابتها في التقرير، من غير إضافة مضمون غير موجود في اليونانية.
theological_decisions:
- issue: ترجمة κύριος في سياق إمبراطوري غير لاهوتي
  choice: مولاي
  alternative: الإمبراطور
  rationale: اللفظ هنا لقب رسمي للحاكم الروماني، لا إشارة إلى الله أو المسيح. «مولاي» تحافظ على صورة اللقب في النص، وتوضح الحاشية هوية المقصود من غير استبدال اللفظ التفسيري بالنص الأصلي.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ورصينة، تناسب مقام جلسة قضائية رسمية. حُفظ الفرق بين جمع المخاطبين والمخاطب المفرد، كما أُبقي لقب الحاكم في المتن مع توضيح مرجعه في الحاشية.
