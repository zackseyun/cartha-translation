id: ACT.25.27
reference: Acts 25:27
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: ar
  text: لأنه يبدو لي غير معقول أن أرسل سجينًا ولا أبيّن أيضًا التهم الموجَّهة إليه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا أحدّد أيضًا التهم الموجَّهة إليه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογον
  choice: غير معقول
  rationale: ينقل معنى ما يفتقر إلى المنطق أو الصواب العملي، ويلائم حكم فستوس الإداري من غير مبالغة مثل «عبثًا» أو «سخفًا».
- source_word: δοκεῖ μοι
  choice: يبدو لي
  rationale: يحافظ على الصياغة اليونانية غير الجازمة وعلى الطابع الشخصي للتقييم.
- source_word: πέμποντα
  choice: أن أرسل
  rationale: اسم الفاعل في اليونانية مرتبط بالمتكلم المفهوم من μοι؛ والصياغة العربية بالمصدر المؤول طبيعية وتوضح علاقته بفعل الإرسال.
- source_word: δέσμιον
  choice: سجينًا
  rationale: تعبير عربي واضح عن شخص محتجز في سياق قضائي، من غير التقيّد بالمعنى الحرفي «مقيّدًا».
- source_word: μὴ καὶ
  choice: ولا ... أيضًا
  rationale: تحفظ نفي الفعل المصاحب والقوة الإضافية للأداة καί، أي إرسال السجين من دون إرفاق بيان التهم.
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: التهم الموجَّهة إليه
  rationale: αἰτία في هذا السياق القضائي تعني التهم أو الاتهامات؛ وهذه العبارة عربية قانونية طبيعية.
- source_word: σημᾶναι
  choice: أبيّن
  rationale: يفيد إظهار المعلومات أو التعريف بها في المراسلات الرسمية، مع إبقاء «أحدّد» بديلًا ممكنًا أكثر تخصيصًا.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة، بصياغة إدارية قضائية طبيعية. وُضع ضمير المتكلم في «أن أرسل» وفق ارتباط اسم الفاعل اليوناني بالمتكلم المفهوم من «لي»، مع الحفاظ على نبرة التقييم الشخصي غير الجازم.
