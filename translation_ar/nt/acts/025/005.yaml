  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: ar
  text: فَلْيَنْزِلِ الْقَادِرُونَ مِنْكُمْ مَعًا[a]، وَإِنْ كَانَ فِي هَذَا الرَّجُلِ شَيْءٌ غَيْرُ صَوَابٍ[b]، فَلْيَتَّهِمُوهُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ذوو النفوذ منكم»، أو «أصحاب السلطة منكم». يمكن أن تدل الكلمة اليونانية على القادرين أو الأقوياء أو ذوي المكانة.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن ترجمة العبارة الأخيرة بصياغة قانونية أصرح: «فليوجّهوا إليه اتهامًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: فَلْـ... إِذًا
  rationale: تنقل الفاء مع «إذًا» معنى الاستنتاج والاستمرار في οὖν، بينما صيغت العبارة الاسمية اليونانية طبيعيًا في جملة طلبية عربية.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: الْقَادِرُونَ مِنْكُمْ
  rationale: تحافظ على المعنى المباشر المحتمل، أي من يستطيعون الذهاب وتمثيل القضية، من غير حسم اللفظ لصالح معنى أصحاب النفوذ أو السلطة؛ ويبيّن الهامش البدائل السياقية.
- source_word: φησίν
  choice: غير ممثَّلة بلفظ مستقل
  rationale: هي جملة اعتراضية تقريرية بمعنى «يقول»، ووظيفتها مندمجة في سياق نقل كلام فستوس؛ وإظهارها هنا سيجعل العربية متكلّفة.
- source_word: συγκαταβάντες
  choice: يَنْزِلْ مَعِي
  rationale: «ينزل» يحفظ اصطلاح الانتقال الجغرافي من أورشليم إلى قيصرية، و«معي» ينقل دلالة المشاركة في σύν.
- source_word: εἴ τί ἐστιν
  choice: إِنْ كَانَ ... شَيْءٌ
  rationale: صياغة عربية طبيعية تحفظ الشرط وإبهام τί، من غير افتراض ثبوت المخالفة.
- source_word: ἐν τῷ ἀνδρὶ
  choice: فِي هَذَا الرَّجُلِ
  rationale: تحفظ حرف الجر ἐν وفكرة وجود أمر معيب فيه، بدل تحويل العبارة مقدمًا إلى «ضده» القانونية. و«هذا الرجل» إحالة عربية طبيعية إلى بولس الحاضر في الحديث.
- source_word: ἄτοπον
  choice: شَيْءٌ مِنَ السُّوءِ
  rationale: ينقل المعنى الواسع لما هو خاطئ أو غير سليم، ولا يضيّقه إلى «جريمة» مع أن السياق قضائي.
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: وَلْيَتَّهِمُوهُ
  rationale: صيغة طلب عربية موجزة تنقل معنى توجيه الاتهام؛ ويذكر الهامش الصياغة القانونية الأصرح.
