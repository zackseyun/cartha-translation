  to: فَلْيَنْزِلِ الْقَادِرُونَ مِنْكُمْ مَعًا[a]، وَإِنْ كَانَ فِي هَذَا الرَّجُلِ شَيْءٌ غَيْرُ صَوَابٍ[b]، فَلْيَتَّهِمُوهُ.
  rationale: حُذفت «معي» لأنها ليست ممثَّلة صراحةً في النص اليوناني، واستُعيض عنها بـ«معًا» لنقل دلالة σύν. وعُدّل وصف الأمر المحتمل إلى «شيء غير صواب» ليقابل اتساع ἄτοπον، وجُعل فعل النزول جمعًا لسلامة الوضوح في الفصحى المعاصرة. وبقيت دلالة δυνατοί غير محسومة في المتن ومبيَّنة في الهامش.
