  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: ar
  text: 'فقال أغريباس لفستوس: «وأنا أيضًا أود أن أسمع الرجل».[a] فقال له فستوس: «غدًا ستسمعه».[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «وأنا بنفسي أود أن أسمع الرجل»؛ فالعبارة اليونانية قد تفيد الإضافة («وأنا أيضًا») أو توكيد المتكلم («وأنا بنفسي»).'
    reason: lexical_alternative
  - marker: b
    text: 'جاء الفعل في اليونانية بصيغة المضارع التاريخي: «فيقول».'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «ستسمع منه»، أي ستسمعه يتكلم مباشرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: أغريباس
  rationale: نقل صوتي للاسم اليوناني بصيغة عربية واضحة وشائعة.
- source_word: δὲ
  choice: فـ
  rationale: تفيد انتقال السرد وربط القول بما قبله من غير مبالغة في معنى الاستدراك.
- source_word: πρὸς τὸν Φῆστον
  choice: لفستوس
  rationale: مع فعل القول المقدّر في اليونانية، تؤدي اللام اتجاه الكلام بصورة عربية طبيعية.
- source_word: Ἐβουλόμην
  choice: أودّ
  rationale: تعبير عربي طبيعي عن الرغبة المهذبة في السياق، مع تجنب ترجمة الماضي الناقص ترجمة حرفية ثقيلة.
- source_word: καὶ αὐτὸς
  choice: أنا أيضًا
  rationale: يحفظ المعنى الإضافي المحتمل لـκαί مع إبراز الضمير αὐτός؛ ويمكن فهم العبارة أيضًا على أنها توكيد أقوى للمتكلم.
- source_word: τοῦ ἀνθρώπου
  choice: هذا الرجل
  rationale: يشير إلى بولس، وإضافة اسم الإشارة طبيعية في العربية ضمن هذا السياق الإحالي.
- source_word: ἀκοῦσαι
  choice: أن أسمع
  rationale: ينقل الفعل مباشرة، والمقصود سماع الرجل يتكلم أو عرض قضيته.
- source_word: Αὔριον
  choice: غدًا
  rationale: المقابل الزمني المباشر.
- source_word: φησίν
  choice: فقال
  rationale: صيغ الماضي هي الأسلوب العربي الطبيعي في السرد؛ وتوضح الحاشية أن اليونانية تستعمل المضارع التاريخي.
- source_word: ἀκούσῃ αὐτοῦ
  choice: ستسمعه
  rationale: صياغة موجزة تحفظ تركيب السماع مع المضاف إليه، مع بقاء احتمال معنى السماع منه مباشرة.
