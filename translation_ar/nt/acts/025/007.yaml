  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: ar
  text: ولمّا حضر، وقف حوله[a] اليهود[b] الذين نزلوا من أورشليم، ووجّهوا إليه اتهامات كثيرة وخطيرة لم يقدروا أن يثبتوها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أحاطوا به». يدل الفعل اليوناني على الوقوف حول شخص، وقد يوحي هذا الوضع بالضغط عليه في المشهد القضائي.
    reason: lexical_alternative
  - marker: b
    text: أو «أهل اليهودية». قد تشير الكلمة اليونانية إلى اليهود من حيث الانتماء الديني والقومي، أو إلى أهل اليهودية؛ والمقصود هنا يهود قدموا من أورشليم ووجّهوا اتهامات إلى بولس.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: ولمّا حضر
  rationale: تركيب إضافي مطلق يبيّن الظرف الزمني. تنقل «ولمّا حضر» تتابع الحدث بوضوح، مع إبقاء مرجع الضمير كما هو في السياق اليوناني.
- source_word: περιέστησαν αὐτὸν
  choice: وقف حوله
  rationale: يحافظ التعبير على الصورة المكانية الأساسية للفعل، أي الوقوف حول شخص، من غير أن يبالغ في دلالة العداء؛ ويمكن أن يفهم السياق منه معنى الإحاطة والضغط.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: اليهود الذين نزلوا من أورشليم
  rationale: قد تدل Ἰουδαῖοι على اليهود أو اليهوداويين، لكن المقصود هنا جماعة من المتهمين اليهود القادمين من أورشليم، فيما يصرّح النص أصلًا بمنشئهم الجغرافي. أما «نزلوا» فتحفظ التصوير الجغرافي المألوف في السفر من أورشليم.
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: اتهامات كثيرة وخطيرة
  rationale: αἰτιώματα اتهامات أو دعاوى في سياق قضائي، وβαρέα تصف جسامتها وخطورتها. الصياغة العربية واضحة وطبيعية وقانونية النبرة.
- source_word: καταφέροντες
  choice: ووجّهوا إليه
  rationale: يفيد اسم الفاعل في هذا السياق تقديم الاتهامات أو توجيهها ضد شخص. رُبط بالعطف لتأتي الجملة العربية طبيعية مع الحفاظ على تزامن الفعل مع وقوفهم حوله.
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: لم يقدروا أن يثبتوها
  rationale: ينقل معنى القدرة في ἰσχύω ومعنى الإثبات في ἀποδείκνυμι، كما تلائم صيغة الماضي الناقص استمرار عجزهم عن إقامة الدليل أثناء الإجراءات.
