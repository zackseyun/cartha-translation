  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: ar
  text: وبعد أن مضت بضعة أيام، وصل الملك أغريباس وبرنيكي[a] إلى قيصرية لتحية فستوس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ويُكتب الاسم أيضًا «برنِيكة».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: وبعد أن مضت بضعة أيام
  rationale: تركيب المضاف إليه المطلق يقدّم خلفية زمنية، وδέ أداة وصل خفيفة؛ تنقل الواو استمرار السرد من غير إثقال، و«بضعة أيام» تعبر طبيعيًا عن τινῶν.
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: الملك أغريباس
  rationale: يحافظ على اللقب الملكي مع ترتيب عربي طبيعي للقب والاسم.
- source_word: Βερνίκη
  choice: برنيكي
  rationale: نقل صوتي عربي مباشر للاسم اليوناني Βερνίκη، مع إثبات الصيغة العربية البديلة الشائعة في الحاشية.
- source_word: κατήντησαν
  choice: وصل
  rationale: يفيد بلوغ وجهة السفر، وهو ملائم للسرد؛ جاء الفعل مفردًا لأن الفاعل المركب المؤخر يجوز إفراد فعله في العربية.
- source_word: εἰς Καισάρειαν
  choice: إلى قيصرية
  rationale: يحافظ على معنى الاتجاه والوجهة الذي تؤديه εἰς.
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: لتحية فستوس
  rationale: يعبر عن الغرض أو الظرف المصاحب للمجيء من غير إضافة إيحاءات بلاطية غير مصرّح بها.
- source_word: Φῆστον
  choice: فستوس
  rationale: نقل صوتي عربي واضح لاسم الوالي الروماني.
