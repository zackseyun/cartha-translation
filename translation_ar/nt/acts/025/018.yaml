  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما في ذلك السياق القضائي وعموم πονηρῶν («شرور/أفعال شريرة») وعدم حصره في جرائم محددة. لكن تركيب «أيَّ تهمةٍ بشيءٍ من الشرور» غير سليم دلاليًا في العربية؛ فالتهمة تكون بشأن أفعال أو شرور، لا «بشيء منها».
  naturalness: «المشتكون عليه» و«يوجّهوا إليه تهمة» فصيحان ومفهومان. ويحتاج الربط بين «تهمة» و«الشرور» إلى صياغة عربية أكثر سلاسة، كما أن جعل «في شأنه» ظاهرًا يحفظ افتتاحية περὶ οὗ من غير اتكالها على الوصف وحده.
  terminology: اختيار «المشتكون عليه» مناسب لسياق المحاكمة، و«تهمة» مقابل αἰτίαν مناسب. و«شرور» يحفظ اتساع πονηρῶν؛ وتبقى «جرائم» بديلًا تفسيريًا مشروعًا في الحاشية لا في المتن.
