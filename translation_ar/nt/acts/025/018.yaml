  text: Concerning him[a], when the accusers stood up, they brought no charge of the evil things that I was suspecting,
translation:
  language: ar
  text: فِي شَأْنِهِ، حِينَ وَقَفَ الْمُشْتَكُونَ عَلَيْهِ، لَمْ يُوَجِّهُوا إِلَيْهِ أَيَّ تُهْمَةٍ بِشَأْنِ شُرُورٍ كُنْتُ أَشْتَبِهُ فِيهَا،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يوجّهوا إليه أيَّ تهمة بالجرائم التي كنت أشتبه فيها». يقول اليوناني حرفيًّا «الشرور»، وقد يشير إلى أفعال خاطئة عمومًا، لا إلى جرائم محددة قانونًا فحسب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: عَلَيْهِ
  rationale: يعود ضمير الصلة إلى بولس، وتؤدي «عليه» المعنى طبيعيًّا ضمن تعبير «المشتكون عليه» من غير تكرار ثقيل.
- source_word: σταθέντες
  choice: فَلَمَّا وَقَفَ
  rationale: صيغت العبارة ظرفية زمنية، بما يلائم وظيفة اسم الفاعل الأُورِسْتي وسياق مثول أصحاب الدعوى لعرض قضيتهم.
- source_word: οἱ κατήγοροι
  choice: الْمُشْتَكُونَ عَلَيْهِ
  rationale: تعبير قانوني واضح يدل على الذين يقدّمون الشكوى أو الاتهام، وهو أفصح وأيسر للقارئ من لفظ تقني نادر.
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: لَمْ يُوَجِّهُوا إِلَيْهِ أَيَّ تُهْمَةٍ
  rationale: ينقل الاصطلاح القضائي بمعنى تقديم اتهام، بصياغة عربية طبيعية ودقيقة.
- source_word: ὧν
  choice: بِشَيْءٍ مِنَ ... الَّتِي
  rationale: تحفظ الصلة الجزئية أو الوصفية بين التهمة وفئة الشرور التي كان فستوس يتوقعها.
- source_word: ἐγὼ ὑπενόουν
  choice: كُنْتُ أَظُنُّهَا
  rationale: تنقل صيغة الماضي الناقص بوصفها ظنًّا أو توقعًا سابقًا مستمرًّا، من غير جعلها بالضرورة اشتباهًا قانونيًّا رسميًّا.
- source_word: πονηρῶν
  choice: الشُّرُورِ
  rationale: تحافظ على عموم اللفظ اليوناني الذي يمكن أن يدل على أفعال شريرة أو مخالفات، ولا تحصره في الجرائم المعرّفة قانونًا.
