    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: أيامًا كثيرة
  rationale: التعبير المقارن في هذا السياق الزمني يفيد امتداد المدة، ويمكن أن يعني أيامًا كثيرة أو عدة أيام؛ وهذه الصياغة تحافظ على دلالة النص بصورة طبيعية.
- source_word: διέτριβον
  choice: مكثوا
  rationale: الفعل يدل على قضاء وقت أو البقاء في مكان، و«مكثوا» عربية واضحة وموجزة تلائم الفاعل الجمع.
- source_word: ἀνέθετο
  choice: عرض ... على
  rationale: صيغة الفعل الوسطى تفيد تقديم أمر إلى شخص لينظر فيه، لا مجرد نقل معلومة إليه.
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: ما يتعلّق ببولس
  rationale: يحافظ التعبير على عموم العبارة اليونانية، مع أن السياق يشير إلى قضية بولس القانونية.
- source_word: Ἀνήρ τίς ἐστιν
  choice: هنا رجل
  rationale: يقدّم التعبير شخصًا معينًا غير مسمّى في هذا الموضع، و«هنا رجل» طبيعية في العربية داخل الكلام المباشر، مع بيان البديل الأقرب إلى البنية في الحاشية.
- source_word: καταλελειμμένος
  choice: تركه
  rationale: اسم المفعول التام يدل على أن فيلكس ترك الرجل وبقي الرجل في الحالة الناتجة عن ذلك.
- source_word: δέσμιος
  choice: سجينًا
  rationale: ينقل وصف الرجل بأنه أسير أو سجين، وتأتي الحال العربية «سجينًا» بوضوح وطبيعية.
- source_word: βασιλεῖ
  choice: الملك
  rationale: يحافظ على اللقب الوارد في اليونانية دون إدخال اسم أغريباس، الذي يتضح من السياق السابق.
