  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: ar
  text: في شأنه، حين وصلتُ إلى أورشليم، عرض رؤساء الكهنة وشيوخ اليهود أمره عليَّ، طالبين الحكم بإدانته.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «طالبين إدانته»، أو: «طالبين صدور حكمٍ ضده».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: هذا الرجل
  rationale: يعود الضمير الموصول إلى بولس ويقدّم موضوع كلام فستوس؛ وصياغة «هذا الرجل» طبيعية في العربية وتوضح المرجع من غير إضافة تفسير زائد.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: لما وصلتُ إلى أورشليم
  rationale: التركيب المطلق بالمضاف إليه مع γίνομαι وεἰς يدل اصطلاحيًا على الوصول إلى مكان؛ و«لما وصلت» واضحة وتحفظ الدلالة الزمنية.
- source_word: ἐνεφάνισαν
  choice: عرضوا قضيته عليَّ
  rationale: يفيد الفعل هنا إبلاغ صاحب سلطة بأمر أو رفع قضية إليه؛ وهذه الصياغة تلائم السياق القضائي والإداري من غير إفراط في الاصطلاح القانوني.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: التعبير العربي المألوف للجمع الدال على القيادات الكهنوتية، لا على رئيس كهنة واحد.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: شيوخ اليهود
  rationale: يحفظ علاقة الإضافة في اليونانية ويحدد الشيوخ المقصودين بوضوح.
- source_word: αἰτούμενοι
  choice: طالبين
  rationale: ينقل معنى الطلب الرسمي المصاحب لعرض القضية، ويلائم السياق القضائي.
- source_word: κατ’ αὐτοῦ
  choice: بإدانته
  rationale: أُدمج المعنى المضاد الموجّه ضد بولس في الضمير المتصل بالفعل الاسمي «إدانته»، بما يحفظ جهة الحكم المطلوبة.
- source_word: καταδίκην
  choice: إصدار حكم بإدانته
  rationale: ينقل القوة القضائية للكلمة بوصفها حكمًا رسميًا بالإدانة، لا مجرد استنكار عام.
