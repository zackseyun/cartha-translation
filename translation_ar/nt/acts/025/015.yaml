  terminology: «رؤساء الكهنة» و«شيوخ اليهود» مناسبان. و«الحكم بإدانته» ينقل καταδίκην بوصفه طلب إدانة قضائية، لا مجرد طلب النظر في القضية. كما أن البدائل في الحاشية تحافظ على هذا التحديد.
