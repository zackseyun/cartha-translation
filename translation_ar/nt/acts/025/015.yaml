revisions:
- from: هذا الرجل، لما وصلتُ إلى أورشليم، عرض رؤساء الكهنة وشيوخ اليهود قضيته عليَّ، طالبين إصدار حكم بإدانته.[a]
  to: في شأنه، حين وصلتُ إلى أورشليم، عرض رؤساء الكهنة وشيوخ اليهود أمره عليَّ، طالبين الحكم بإدانته.[a]
  rationale: استُبدلت الإشارة التوضيحية «هذا الرجل» بعبارة «في شأنه» الموافقة لبنية περὶ οὗ، واستُبدل «قضيته» بـ«أمره» لتفادي تضييق معنى ἐνεφάνισαν. كما اختُصر التعبير إلى «الحكم بإدانته» مع الحفاظ على القوة القضائية لكلمة καταδίκην، ونُقحت الحاشية لتكون بدائلها دالة على الإدانة القضائية نفسها.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:22:30Z'
