  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: ar
  text: وفي اليوم التالي، جاء أغريباس وبرنيكي بأبهة عظيمة[a]، ودخلا قاعة الاستماع مع قادة عسكريين ووجهاء المدينة[b]، وبأمر فستوس أُحضر بولس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في موكب عظيم» أو «في استعراض كبير».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «رجال المدينة البارزون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: وفي اليوم التالي
  rationale: تعبير زمني طبيعي يحفظ معنى «في اليوم التالي»، وتؤدي الواو وظيفة οὖν في وصل السرد العربي بسلاسة.
- source_word: ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης
  choice: جاء أغريباس وبرنيكي
  rationale: حُوِّل التركيب اليوناني المطلق إلى فعل عربي صريح، مع نقل الاسمين وفق الصيغة العربية الكتابية الشائعة.
- source_word: μετὰ πολλῆς φαντασίας
  choice: في موكب عظيم
  rationale: السياق يدل على ظهور احتفالي علني يتسم بالأبهة والاستعراض؛ و«موكب عظيم» تعبير عربي واضح وطبيعي، مع إثبات بديل في الحاشية.
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: ودخلا قاعة الاستماع
  rationale: ἀκροατήριον مكان مخصص للاستماع أو النظر في القضية، و«قاعة الاستماع» تحفظ هذا المعنى الرسمي دون افتراض أنها محكمة بالمعنى التقني.
- source_word: σύν τε χιλιάρχοις
  choice: مع قادة الألوف
  rationale: ترجمة وظيفية قريبة للرتبة العسكرية χιλίαρχος، وهي أوضح عربيًا من تعريب اسم رتبة رومانية قد يجهله القارئ.
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: ووجهاء المدينة
  rationale: ينقل «وجهاء» معنى التميز والمكانة الاجتماعية في κατ’ ἐξοχήν بإيجاز عربي طبيعي، مع ذكر بديل أكثر حرفية في الحاشية.
- source_word: κελεύσαντος τοῦ Φήστου
  choice: وبأمر فستوس
  rationale: صياغة عربية موجزة تحافظ على سلطة فستوس الرسمية في إصدار الأمر.
- source_word: ἤχθη ὁ Παῦλος
  choice: أُحضر بولس
  rationale: البناء للمجهول يحفظ صيغة الفعل اليوناني ويدل على أن بولس جيء به بأمر رسمي.
