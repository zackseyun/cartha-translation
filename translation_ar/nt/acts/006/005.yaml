revisions:
- from: فاستحسن جمهور التلاميذ كلهم هذا الاقتراح، فاختاروا استفانوس، رجلًا ممتلئًا من الإيمان والروح القدس، وفيلبس، وبروخورس، ونيكانور، وتيمون، وبرميناس، ونيقولاوس الأنطاكي، وكان دخيلًا في اليهودية.[a]
  to: فرضي الجمهور كله بهذا الاقتراح، فاختاروا استفانوس، رجلًا ممتلئًا بالإيمان[a] والروح القدس، وفيلبس، وبروخورس، ونيكانور، وتيمون، وبرميناس، ونيقولاوس، دخيلًا أنطاكيًا.[b]
  rationale: 'تتبع المراجعة النص اليوناني مباشرة: «الجمهور كله» يقابل παντὸς τοῦ πλήθους من دون إضافة «التلاميذ»، وتبقى قائمة المختارين السبعة قائمة واحدة. ويُترجم وصف استفانوس بتعبير عربي طبيعي محافظ على الإيمان والروح القدس، بينما يُجعل «دخيلًا أنطاكيًا» نعتًا مباشرًا لنيقولاوس كما في الأصل. أضيفت الحاشية الثقافية اللازمة لمعنى «دخيل»، ونُقل مؤشر البديل المعجمي إلى موضع «الإيمان».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:55Z'
review_pass:
  verdict: revise
  source_fidelity: يلزم حذف «التلاميذ» لأنه ليس في نص الآية، وإعادة ترتيب وصف نيقولاوس ليبقى نعتًا له كما في اليونانية. كما أن تعريف «الدخيل» في حاشية ثقافية يحفظ الدلالة التاريخية الدقيقة لـ προσήλυτος.
  naturalness: «رضي الجمهور كله بهذا الاقتراح» و«رجلًا ممتلئًا بالإيمان والروح القدس» فصيحتان واضحتان في العربية المعيارية المعاصرة. ووضع الحاشية بعد «الإيمان» يحدد مرجعها بدقة.
  terminology: «الروح القدس» مناسب. و«دخيل» ترجمة دقيقة لـ προσήλυτος، مع شرحها بأنها تشير إلى غير يهودي اعتنق اليهودية. ويُحافَظ على «الإيمان» في المتن وتُذكر «الأمانة» بديلًا معجميًا ممكنًا.
  issues:
  - severity: medium
    issue: إضافة «التلاميذ» إلى «الجمهور»
    rationale: النص اليوناني يقول «كل الجمهور/الحشد» (παντὸς τοῦ πλήθους) ولا يذكر «التلاميذ» في هذه الآية. قد يفهم المرجع من السياق السابق، لكن إضافته في المتن تتجاوز ألفاظ الآية بلا حاجة.
  - severity: medium
    issue: ترتيب وصف نيقولاوس وصياغته
    rationale: 'προσήλυτον Ἀντιοχέα نعتٌ لنيقولاوس مباشرة: «نيقولاوس، دخيلًا أنطاكيًا». أما «نيقولاوس الأنطاكي، وكان دخيلًا في اليهودية» فيفصل الوصف بفعل مستقل ويضيف شرحًا إلى المتن؛ الأفضل إبقاء الشرح في الحاشية.'
  - severity: low
    issue: موضع حاشية البديل المعجمي
    rationale: الحاشية الخاصة بـ«الإيمان» ينبغي أن يوضع مؤشرها عقب اللفظ المعني لا في نهاية الآية.
