source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: ar
  text: فرضي الجمهور كله بهذا الاقتراح، فاختاروا استفانوس، رجلًا ممتلئًا بالإيمان[a] والروح القدس، وفيلبس، وبروخورس، ونيكانور، وتيمون، وبرميناس، ونيقولاوس، دخيلًا أنطاكيًا.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «الإيمان» هنا بـ«الأمانة»، لأن الكلمة اليونانية قد تدل على الإيمان أو الثقة أو الأمانة.
    reason: lexical_alternative
  - marker: b
    text: «الدخيل» هو غير اليهودي الذي اعتنق اليهودية.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: هذا الاقتراح
  rationale: يشير في السياق إلى ما اقترحه الرسل في الآية السابقة، لا إلى «الكلمة» بمعناها المجرد؛ واسم الإشارة يوضح الإحالة السياقية.
- source_word: ἤρεσεν ... ἐνώπιον παντὸς τοῦ πλήθους
  choice: فاستحسن جمهور التلاميذ كلهم
  rationale: ينقل المعنى الاصطلاحي، أي إن الكلام لقي قبول الجماعة كلها. أضيف «التلاميذ» من السياق القريب لتعيين الجمهور دون إدخال مصطلح كنسي لاحق.
- source_word: ἐξελέξαντο
  choice: فاختاروا
  rationale: ترجمة مباشرة وطبيعية لفعل الاختيار، وتحافظ على كون الجماعة هي التي قامت به.
- source_word: ἄνδρα πλήρης πίστεως καὶ πνεύματος ἁγίου
  choice: رجلًا ممتلئًا من الإيمان والروح القدس
  rationale: تحافظ على وصف استفانوس بأنه رجل وعلى صورة الامتلاء، وتفهم «الروح القدس» باعتباره الروح الإلهي كما يجري الاستعمال في سفر الأعمال.
- source_word: πίστεως
  choice: الإيمان
  rationale: هو المعنى الأرجح في وصف استفانوس هنا، مع بقاء دلالة الأمانة ممكنة؛ لذلك تُذكر في الحاشية.
- source_word: προσήλυτον
  choice: دخيلًا في اليهودية
  rationale: «الدخيل» مصطلح عربي يدل على غير اليهودي الذي اعتنق اليهودية، وأضيف شبه الجملة لرفع اللبس لدى القارئ المعاصر.
- source_word: Ἀντιοχέα
  choice: الأنطاكي
  rationale: صياغة عربية موجزة وطبيعية للنسبة إلى أنطاكية.
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: استفانوس، وفيلبس، وبروخورس، ونيكانور، وتيمون، وبرميناس، ونيقولاوس
  rationale: نُقلت الأسماء بصيغ عربية كتابية واضحة، مع إبقاء تتابع العطف اليوناني على نحو مقبول عربيًا.
theological_decisions:
- issue: دلالة πίστις في وصف استفانوس
  choice: الإيمان
  alternative: الأمانة
  rationale: قد تدل الكلمة على الإيمان أو الثقة أو الأمانة. يناسب «الإيمان» سياق سفر الأعمال، لكن النص لا يمنع دلالة الأمانة تمامًا، فحُفظت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. صيغت الجملة بصورة طبيعية مع الحفاظ على أسماء الرجال السبعة وعلى تمييز استفانوس بالوصف، وتجنبت ألفاظًا كنسية لاحقة مثل «الرعية» أو «المجمع». وُضع مؤشر الحاشية بعد الجملة لأن الحاشية تتصل بلفظ «الإيمان» الوارد فيها.
