  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: ar
  text: أَمَّا نَحْنُ فَسَنُواظِبُ عَلَى الصَّلاةِ وَخِدْمَةِ الْكَلِمَةِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «خدمة الرسالة». فلفظة «الكلمة» هنا تشير إلى الرسالة المُعلنة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: نَحْنُ
  rationale: الضمير مذكور صراحةً في اليونانية للتوكيد والمقابلة، وقد حُفظ في العربية مع «أمّا» لإبراز المقابلة بالسياق السابق.
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: يفيد الانتقال المقابِل لما أُسند إلى الآخرين من خدمة الموائد، وهذه الصياغة العربية تُظهر المقابلة بوضوح وطبيعية.
- source_word: τῇ προσευχῇ
  choice: عَلَى الصَّلاةِ
  rationale: المجرور باليونانية يبيّن الأمر الذي تدوم عليه المواظبة؛ وتلائم «على» الفعل العربي «واظب».
- source_word: διακονίᾳ
  choice: خِدْمَةِ
  rationale: تعني اللفظة الخدمة أو عمل الخدمة. واختيار «خدمة» يحفظ الصلة اللفظية والمفهومية بخدمة الموائد من غير أن يفرض تمييزًا مؤسسيًا غير مصرّح به.
- source_word: τοῦ λόγου
  choice: الْكَلِمَةِ
  rationale: تشير هنا إلى كلمة الله أو الرسالة المُعلنة. وتحفظ «الكلمة» التعبير المسيحي المبكر المألوف مع إبقاء العبارة موجزة.
- source_word: προσκαρτερήσομεν
  choice: فَسَنُواظِبُ
  rationale: صيغة المستقبل تدل على الاستمرار والثبات في التفرغ للمهمتين؛ و«نواظب» تنقل هذا المعنى طبيعيًا في العربية المعاصرة.
theological_decisions:
- issue: دلالة διακονία في مقابل خدمة الموائد في السياق القريب
  choice: خِدْمَةِ الْكَلِمَةِ
  alternative: خِدْمَةِ الرِّسَالَةِ؛ أو التَّكَرُّسِ لإعلان الكلمة
  rationale: «خدمة» هي المقابل المباشر الذي يحفظ المجال الدلالي المشترك بين العمل العملي وإعلان الكلمة، ولا يستورد فصلًا جامدًا بين رجال الدين والعامة. كما أن «الكلمة» تُبقي الإحالة إلى الرسالة الإلهية من غير زيادة تفسيرية في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل تركيب «أمّا نحن فـ» لإظهار المقابلة، و«سنواظب» لنقل معنى الاستمرار والثبات. شُكّل المتن جزئيًا لتيسير القراءة من غير إثقال.
