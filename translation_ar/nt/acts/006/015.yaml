source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: ar
  text: فَحَدَّقَ إِلَيْهِ جَمِيعُ الْجَالِسِينَ فِي الْمَجْلِسِ[a]، فَرَأَوْا وَجْهَهُ كَوَجْهِ مَلَاكٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «السنهدرين»، أي مجلس الحكم اليهودي.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: حَدَّقَ إِلَيْهِ
  rationale: يفيد الفعل نظرًا مركزًا ومتواصلًا، و«حدّق إليه» ينقل هذه الشدة بإيجاز وطبيعية.
- source_word: πάντες οἱ καθεζόμενοι
  choice: جَمِيعُ الْجَالِسِينَ
  rationale: يحفظ معنى الشمول في πάντες ووصف الحاضرين بأنهم جالسون.
- source_word: συνεδρίῳ
  choice: الْمَجْلِسِ
  rationale: ترجمة مباشرة للاسم في سياقه، مع بيان أنه مجلس الحكم اليهودي في الحاشية دون تحويله في المتن إلى اسم منقول.
- source_word: πρόσωπον
  choice: وَجْهَهُ
  rationale: المقصود وجه استفانوس الظاهر، و«وجه» هي العبارة العربية الواضحة والطبيعية.
- source_word: ὡσεὶ
  choice: كَـ
  rationale: تنقل أداة التشبيه اليونانية بإيجاز، من غير تحديد وجه الشبه.
- source_word: ἀγγέλου
  choice: مَلَاكٍ
  rationale: السياق يرجح الكائن السماوي لا مجرد الرسول البشري.
theological_decisions:
- issue: طبيعة التشبيه في «كوجه ملاك»
  choice: الإبقاء على تشبيه وجه استفانوس بوجه ملاك من غير تعيين صفة الشبه
  alternative: تفسير الشبه صراحة بأنه إشراق أو هدوء بريء أو سلطان سماوي
  rationale: النص اليوناني يثبت المشابهة لكنه لا يحدد أهي في الإشراق أم السكينة أم المهابة؛ لذلك تحفظ الصياغة هذا الانفتاح الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية كريمة. استُعمل «فحدّق» لإظهار تتابع الحدث وتركيز النظر، وحُفظ التشبيه الموجز «كوجه ملاك» بلا تفسير زائد.
