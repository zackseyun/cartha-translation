base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: ar
  text: فحرَّضوا الشعبَ والشيوخَ والكتبةَ، وأقبلوا عليه فجأةً فأمسكوا به واقتادوه إلى السنهدريم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المجلس». والكلمة اليونانية συνέδριον يمكن أن تُترجم بمعنى أعم، لكنها تشير هنا على الأرجح إلى المجلس اليهودي الحاكم المعروف بالسنهدريم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: حرَّضوا
  rationale: ينقل الفعل معنى إثارة الناس ودفعهم إلى التحرك ضد استفانوس، من غير أن يضيف بالضرورة معنى العنف المباشر.
- source_word: τε
  choice: فـ
  rationale: أداة ربط خفيفة تستأنف السرد وتُظهر النتيجة الطبيعية لما سبق.
- source_word: τὸν λαὸν
  choice: الشعب
  rationale: مقابل مباشر يحافظ على عموم اللفظ، بدل تضييقه إلى «الجمهور» أو «الحشد».
- source_word: τοὺς πρεσβυτέρους
  choice: الشيوخ
  rationale: يشير السياق إلى شيوخ اليهود ذوي المكانة القيادية، لا إلى كبار السن عمومًا.
- source_word: τοὺς γραμματεῖς
  choice: الكتبة
  rationale: مصطلح تاريخي مألوف لخبراء الأسفار والشريعة في السياق اليهودي.
- source_word: ἐπιστάντες
  choice: باغتوه
  rationale: يعبر بإيجاز طبيعي عن إقبالهم عليه على نحو مفاجئ، وهو معنى مناسب للفعل في هذا السياق.
- source_word: συνήρπασαν
  choice: قبضوا عليه
  rationale: ينقل معنى الإمساك القسري به بعبارة عربية واضحة، من غير إضافة فكرة الجر التي لا يصرح بها الفعل.
- source_word: ἤγαγον
  choice: اقتادوه
  rationale: يلائم السياق العدائي ويبين أن الذهاب لم يكن طوعيًا، مع بقاء معنى سوقه أو إحضاره.
- source_word: τὸ συνέδριον
  choice: المجلس الأعلى
  rationale: يحدد المؤسسة اليهودية الحاكمة في أورشليم بعبارة عربية مفهومة، مع إثبات البديل الأعم في الحاشية.
theological_decisions:
- issue: تعيين مدلول συνέδριον
  choice: المجلس الأعلى
  alternative: المجلس، أو السنهدريم
  rationale: السياق الأورشليمي وذكر الشيوخ والكتبة يرجحان أن المقصود هو الهيئة اليهودية الحاكمة. لا تتعلق المسألة بموقف عقائدي، بل بتعيين تاريخي قضائي.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعملت مصطلحات كتابية تاريخية مألوفة مثل «الشيوخ» و«الكتبة»، وتُجنب التركيب الحرفي غير الطبيعي في وصف إحضاره أمام المجلس.
