    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: وكان
  rationale: أُديت أداة الربط الخفيفة δέ بالواو ضمن «وكان» لمواصلة السرد طبيعيًا من غير إضفاء معنى زمني صريح أو مقابلة قوية.
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: ممتلئًا نعمةً وقوةً
  rationale: يحفظ التعبير معنى الاتصاف التام بالنعمة والقوة، بصياغة عربية واضحة ومألوفة.
- source_word: χάριτος
  choice: نعمةً
  rationale: يتبع نص SBLGNT الذي يقرأ χάριτος، ويحفظ الدلالة على النعمة أو الحظوة الإلهية من غير استبدالها بالقراءة المتغايرة «إيمانًا».
- source_word: δυνάμεως
  choice: قوةً
  rationale: «قوة» هي المقابل الطبيعي لـ δύναμις، ولا سيما في سياق الأعمال العجائبية.
- source_word: ἐποίει
  choice: يصنع
  rationale: صيغة المضارع بعد «كان» تنقل دلالة الماضي المستمر أو المتكرر في الفعل الناقص اليوناني.
- source_word: τέρατα καὶ σημεῖα
  choice: عجائب وآيات
  rationale: 'يحفظ هذا الزوج تمييز اللفظين: ما يبعث العجب، وما يؤدي وظيفة العلامة الدالة.'
- source_word: μεγάλα
  choice: عظيمة
  rationale: صفة مباشرة تشمل العجائب والآيات معًا من غير زيادة تفسيرية.
- source_word: ἐν τῷ λαῷ
  choice: بين الشعب
  rationale: تعبير عربي طبيعي يدل على أن هذه الأعمال جرت في وسط الشعب.
theological_decisions:
- issue: القراءة النصية المتغايرة χάριτος/πίστεως
  choice: نعمةً
  alternative: إيمانًا
  rationale: 'يتبع المتن نص SBLGNT المعطى: χάριτος («نعمة»)، بينما تُحفظ قراءة πίστεως («إيمان») المهمة تفسيريًا في الحاشية من غير ترجيح عقائدي زائد.'
