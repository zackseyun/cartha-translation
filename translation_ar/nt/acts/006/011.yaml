  text: 'حينئذٍ حرَّضوا رجالًا سرًّا على أن يقولوا[a]: «سمعناه يتكلَّم بكلمات تجديفية على موسى وعلى الله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «دسّوا رجالًا ليقولوا»، أو: «لقّنوا رجالًا أن يقولوا». يدل الفعل اليوناني على حثّ خفي أو تحريض مستتر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذٍ
  rationale: أداة ربط زمنية طبيعية تتابع أحداث الرواية.
- source_word: ὑπέβαλον
  choice: حرَّضوا ... سرًّا
  rationale: ينقل معنى الحث أو الاستمالة الخفية الكامن في الفعل ضمن هذا السياق التآمري.
- source_word: ἄνδρας
  choice: رجالًا
  rationale: يحافظ على الإشارة الصريحة إلى الذكور في ἀνήρ.
- source_word: λέγοντας
  choice: على أن يقولوا
  rationale: صياغة عربية طبيعية للمشاركة التي تبيّن مضمون التحريض.
- source_word: Ἀκηκόαμεν
  choice: سمعناه
  rationale: الماضي العربي هو الأنسب طبيعيًا في الشهادة المنقولة، ويؤدي معنى وقوع السماع مع بقاء أثره في ادعائهم.
- source_word: αὐτοῦ λαλοῦντος
  choice: يتكلَّم
  rationale: ينقل الفعل المستمر في تركيب السماع من دون تخصيص الكلام بعبارة واحدة.
- source_word: ῥήματα βλάσφημα
  choice: بكلام تجديف
  rationale: يحفظ القوة الدينية والقانونية للاتهام، مع تعبير عربي واضح وطبيعي.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: على موسى وعلى الله
  rationale: تفيد «على» اتجاه الإساءة في هذا السياق، وتكرارها يوضح تعلّق التهمة بكلا المذكورين.
theological_decisions:
- issue: طبيعة الاتهام الموجَّه إلى استفانوس
  choice: عرض القول بوصفه اتهامًا بأنه تكلم بكلام تجديف على موسى وعلى الله، من غير تخفيف قوته أو الإقرار بصحته.
  alternative: كلام إساءة على موسى وعلى الله
  rationale: لفظة βλάσφημα تحمل هنا قوة دينية وقانونية، والسياق يبين أن الرواية تنقل ما حُرِّض الرجال على قوله لا أنها تصدّق الاتهام.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة؛ استُخدم «حرَّضوا ... سرًّا» لإظهار الطابع الخفي من غير تركيب متكلّف، ووُضعت علامة الحاشية في المتن بعد العبارة التي تشرحها.
