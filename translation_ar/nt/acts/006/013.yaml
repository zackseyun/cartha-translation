  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: ar
  text: 'وأقاموا أيضًا شهود زور قالوا: «هذا الرجل لا يكفّ عن التفوّه بأقوال ضد هذا الموضع المقدّس[a] والشريعة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
