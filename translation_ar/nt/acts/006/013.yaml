    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: أقاموا
  rationale: يفيد في السياق القضائي تقديم الشهود وإحضارهم للإدلاء بالشهادة، مع إبقاء الصياغة العربية موجزة.
- source_word: τε
  choice: أيضًا
  rationale: تنقل القوة الإضافية للأداة ضمن تتابع أفعال الخصوم.
- source_word: μάρτυρας ψευδεῖς
  choice: شهود زور
  rationale: تعبير قانوني عربي مألوف ودقيق للشهود الذين يدلون بشهادة كاذبة.
- source_word: λέγοντας
  choice: قالوا
  rationale: تحويل اسم الفاعل إلى جملة فعلية هو الأسلوب الطبيعي في العربية ويحفظ علاقته بمضمون الشهادة.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: هذا الرجل
  rationale: صياغة مباشرة تحفظ نبرة الاتهام من غير إضافة ازدراء غير صريح.
- source_word: οὐ παύεται
  choice: لا يكفّ
  rationale: ينقل الاستمرار الملازم للصيغة اليونانية بلغة عربية واضحة وطبيعية.
- source_word: λαλῶν ῥήματα
  choice: التفوّه بكلام
  rationale: يمثل الاسم الصريح ῥήματα ويحفظ النبرة الاتهامية، مع تجنب العبارة العربية الثقيلة «يتكلم كلمات».
- source_word: κατὰ
  choice: ضد
  rationale: السياق العدائي القضائي يدل على كلام موجّه في معارضة الموضع والشريعة.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: هذا الموضع المقدّس
  rationale: يحفظ معنى العبارة اليونانية، ويعبّر اسم الإشارة عن المرجع المكاني الحاضر في مقام الاتهام؛ والمقصود سياقيًا الهيكل.
- source_word: νόμου
  choice: الشريعة
  rationale: في هذا السياق اليهودي تشير الكلمة إلى شريعة موسى، و«الشريعة» هي المقابل العربي الطبيعي من غير توسع تفسيري.
theological_decisions:
- issue: مرجع «الموضع المقدّس» و«الشريعة»
  choice: الاتهام متعلق بهيكل أورشليم وشريعة موسى، مع إبقاء متن الآية على عبارتها غير الموسعة.
  alternative: فهمهما بوصفهما إشارة عامة إلى مكان مقدس وتقليد قانوني.
  rationale: السياق القريب في أعمال الرسل يربط التهمة بالهيكل وموسى، لكن إدخال الاسمين تفسيرًا في المتن يتجاوز صياغة الشهود نفسها.
- issue: نبرة الاتهام
  choice: الإبقاء على النبرة القضائية العدائية من غير تصعيدها.
  alternative: استخدام ألفاظ تفسيرية أشد مثل «يجدّف» أو «يفتري».
  rationale: النص يقول إنه يتفوّه بكلام ضد الموضع والشريعة، ولا يستخدم هنا لفظًا صريحًا للتجديف أو الافتراء.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «شهود زور» للتعبير القانوني المألوف، و«لا يكفّ عن التفوّه بكلام» لتمثيل λαλῶν ῥήματα من غير حرفية نافرة. وُضع مؤشر الحاشية مباشرة بعد العبارة التي يشرحها.
