base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: ar
  text: أما أنتم، أيها الإخوة[b]، فاختاروا من بينكم سبعة رجال مشهودًا لهم[a]، مملوئين بالروح والحكمة[c]، الذين سنعيّنهم للاضطلاع بهذه المهمة[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذوي سمعة حسنة».'
    reason: lexical_alternative
  - marker: b
    text: جاءت كلمة «الإخوة» في اليونانية بصيغة المذكر، وقد يكون الخطاب شاملًا لجماعة المؤمنين الأوسع.
    reason: cultural_note
  - marker: c
    text: 'أو: «مملوئين بالروح القدس والحكمة». والنص اليوناني يقول: «مملوئين بالروح والحكمة».'
    reason: alternative_reading
  - marker: d
    text: تشير «هذه المهمة» إلى الأمر العملي المتعلق بالتوزيع اليومي المذكور في السياق السابق.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: اختاروا
  rationale: صيغة الأمر تدعو الجماعة إلى تفقّد المؤهلين وانتقائهم؛ و«اختاروا» عربية طبيعية تنقل المقصود في السياق.
- source_word: δέ
  choice: لذلك
  rationale: تفيد الأداة هنا الانتقال إلى الإجراء الناتج من المشكلة والاقتراح المذكورين في السياق السابق، و«لذلك» تُظهر هذا الترابط من غير مبالغة في قوة الاستنتاج.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: تحافظ على صيغة النداء المذكرة في اليونانية، مع بيان احتمال شمول الخطاب لجماعة المؤمنين الأوسع في الحاشية.
- source_word: ἄνδρας ἐξ ὑμῶν
  choice: سبعة رجال ... من بينكم
  rationale: «رجال» تحفظ الدلالة الذكورية المحددة لكلمة ἄνδρας، و«من بينكم» تبين أن الاختيار يتم من داخل الجماعة.
- source_word: μαρτυρουμένους
  choice: مشهودًا لهم
  rationale: يحفظ معنى شهادة الآخرين لهم شهادة حسنة من غير حصره في وصف أخلاقي أضيق؛ وتُذكر «ذوي سمعة حسنة» بديلًا في الحاشية.
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: ممتلئين من الروح والحكمة
  rationale: يحافظ على صياغة اليونانية التي لا تذكر صفة «القدس» صراحة، مع إبقاء فهم الإشارة إلى الروح القدس في الحاشية.
- source_word: καταστήσομεν
  choice: فنعيّنهم
  rationale: ينقل معنى الإسناد الرسمي للمسؤولية، وتربط الفاء هذا التعيين باختيار الجماعة.
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: على هذه المهمة
  rationale: «المهمة» تلائم السياق العملي وتنسجم طبيعيًا مع فعل التعيين، مع توضيح مرجعها في الحاشية.
theological_decisions:
- issue: هل تشير πνεύματος إلى الروح عمومًا أم إلى الروح القدس؟
  choice: الروح
  alternative: الروح القدس
  rationale: يرجح سياق لوقا–أعمال الرسل أن المقصود روح الله، لكن الأصل لا يذكر «القدس» صراحة؛ لذلك يحافظ المتن على «الروح» وتورد الحاشية القراءة التفسيرية الممكنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت تراكيب مألوفة مثل «اختاروا من بينكم» و«فنعيّنهم على هذه المهمة»، مع إبقاء صيغة النداء المذكرة والغموض المحدود في لفظ «الروح» وفق الأصل.
