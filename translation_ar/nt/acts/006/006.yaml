  to: وهؤلاء قدّموهم أمام الرسل[a]، وبعد أن صلّى الرسل وضعوا أيديهم عليهم.[b]
  rationale: استُبدل «أوقفوهم» بـ«قدّموهم» لتأدية معنى تقديم الأشخاص للمثول أمام سلطة على نحو عربي طبيعي. وصُرّح بـ«الرسل» بوصفهم فاعلي الصلاة ووضع الأيدي، لأن الإضمار العربي في هذا الموضع يسبب التباسًا جوهريًا في مرجع الفاعل. ولا تضيف هذه الصياغة وصفًا لاهوتيًا للفعل، بل تبيّن الإحالة التي يدل عليها السياق. وحُفظت الحاشية التفسيرية المتحفظة، وعُدلت الحاشية المعجمية لتكون بديلًا متميزًا.
