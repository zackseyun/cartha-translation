lexical_decisions:
- source_word: οὓς
  choice: هؤلاء
  rationale: اسم الموصول يعود إلى السبعة المذكورين في الآية السابقة. وصيغة «هؤلاء» تربط الكلام بهم بوضوح من غير إضافة وصف غير ملفوظ به هنا.
- source_word: ἔστησαν
  choice: أوقفوهم
  rationale: الفعل هنا متعدٍّ سببي، أي جعلوهم يقفون أو أقاموهم أمام الرسل؛ و«أوقفوهم» تعبير عربي طبيعي ودقيق في هذا السياق.
- source_word: ἐνώπιον τῶν ἀποστόλων
  choice: أمام الرسل
  rationale: تنقل العبارة معنى الحضور والمثول بين أيدي الرسل بإيجاز عربي واضح، وتحافظ على اللقب المعروف «الرسل».
- source_word: προσευξάμενοι
  choice: بعد أن صلّوا
  rationale: اسم الفاعل الأوريستي يدل طبيعيًا على فعل سابق للفعل الرئيس، فتبين الصياغة ترتيب الحدثين من غير تكلف.
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: وضعوا أيديهم عليهم
  rationale: تنقل الصياغة الفعل الطقسي الموصوف حرفيًا وطبيعيًا في العربية، من غير تفسيره بأنه سيامة أو تكليف على وجه التحديد.
theological_decisions:
- issue: دلالة وضع الأيدي
  choice: وصف الفعل بعبارة «وضعوا أيديهم عليهم»
  alternative: ساموهم؛ كلّفوهم بالخدمة
  rationale: النص اليوناني يذكر الفعل نفسه ولا يحدد هنا كامل معناه الكنسي؛ لذلك تُحفظ الدلالة مفتوحة ولا يُفرض تفسير طائفي بعينه.
- issue: فاعل الصلاة ووضع الأيدي
  choice: الإبقاء على ضمير الجمع غير المصرح بمرجعه داخل الجملة
  alternative: وبعد أن صلى الرسل وضعوا أيديهم عليهم
  rationale: اليونانية لا تعيد تسمية الفاعل صراحة، مع أن أقرب مرجع نحوي هو الرسل؛ وعدم إدخال الاسم في المتن يحفظ قدر الصياغة الأصلية من الإضمار.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «أوقفوهم أمام» لنقل البناء السببي، وحُفظ وصف وضع الأيدي بلا تحميله مصطلحًا مذهبيًا محددًا.
