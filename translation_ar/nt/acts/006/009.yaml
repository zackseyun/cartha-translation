  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: ar
  text: لكنَّ بعضًا من المنتمين إلى المجمع الذي يُدعى مجمع المُعتَقين[a]، والقيروانيين، والإسكندريين، والذين من كيليكية وآسيا[b]، نهضوا وأخذوا يجادلون استفانوس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي الذين أُعتقوا من العبودية، وربما شمل الاسم أيضًا أبناءهم. ويجوز نقل الاسم صوتيًا: «الليبرتينيين».'
    reason: lexical_alternative
  - marker: b
    text: «آسيا» هنا هي الولاية الرومانية الواقعة في غربي آسيا الصغرى، لا قارة آسيا بمفهومها الحديث.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: نهضوا
  rationale: ينقل المعنى الحرفي للنهوض، مع ما يفيده السياق من بدء المعارضة، من غير إضافة تفسير زائد.
- source_word: δέ
  choice: لكنَّ
  rationale: تشير الأداة إلى انتقال سردي فيه مقابلة خفيفة بين خدمة استفانوس وظهور معارضيه.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: بعضَ الذين من المجمع
  rationale: يحافظ على دلالة التبعيض وعلى انتماء هؤلاء الأشخاص إلى المجمع أو مجيئهم منه.
- source_word: τῆς λεγομένης
  choice: المعروف بـ
  rationale: صياغة عربية طبيعية تدل على الاسم الذي كان المجمع يُعرَف به، من دون الإيحاء بالتشكيك الذي قد تحمله عبارة «المزعوم».
- source_word: Λιβερτίνων
  choice: المُعتَقين
  rationale: يدل اللفظ اليوناني على أناس أُعتقوا من العبودية، أو ربما على ذريتهم، وليس على معنى الانحلال الأخلاقي المرتبط ببعض الألفاظ الحديثة.
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: القيروانيين والإسكندريين
  rationale: نسبتان واضحتان إلى قيروان والإسكندرية، وتحافظان على الإيجاز الموجود في الأصل.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: الذين من كيليكية وآسيا
  rationale: تنقل ἀπό دلالة المنشأ الجغرافي، مع إبقاء «آسيا» كما في الأصل وشرح مدلولها التاريخي في الحاشية.
- source_word: συζητοῦντες τῷ Στεφάνῳ
  choice: وأخذوا يجادلون استفانوس
  rationale: يفيد الفعل هنا مناقشة خلافية في سياق المعارضة، وتعبير «أخذوا» يصوغ المصاحبة الحالية طبيعيًا بوصفها بداية الفعل عقب نهوضهم.
