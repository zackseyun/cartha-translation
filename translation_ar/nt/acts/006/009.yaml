translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «المجمع» بالمصطلح الكتابي العربي المألوف، وحُفظ ترتيب الجماعات وقابلية تركيب النص اليوناني لأكثر من تصور بشأن عدد المجامع، من غير حسمه بإضافة غير موجودة في الأصل.
