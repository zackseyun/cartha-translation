  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: ar
  text: 'فإننا سمعناه يقول: «إن هذا يسوع الناصري[a] سيهدم هذا المكان[b] ويغيّر العادات[c] التي سلّمها إلينا موسى».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يسوع هذا الذي من الناصرة».'
    reason: lexical_alternative
  - marker: b
    text: المقصود بـ«هذا المكان» هو الهيكل.
    reason: cultural_note
  - marker: c
    text: 'أو: «التقاليد التي سلّمها إلينا موسى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: سمعناه
  rationale: ينقل صيغة التمام في سياق شهادة اتهامية بصياغة عربية طبيعية، مع بقاء أثر السماع المباشر ذا صلة بالحاضر.
- source_word: γὰρ
  choice: فإننا
  rationale: تحفظ القوة التعليلية التي تربط هذا القول بالاتهام السابق.
- source_word: αὐτοῦ λέγοντος
  choice: سمعناه يقول
  rationale: صياغة عربية طبيعية تفيد أنهم يزعمون أنهم سمعوا استفانوس نفسه يتلفظ بهذا القول.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: يسوع الناصري هذا
  rationale: تحفظ وصف الناصري وتُبقي اسم الإشارة في موضع بارز يعكس نبرة المتهمين، من غير زيادة تفسيرية.
- source_word: καταλύσει
  choice: سيهدم
  rationale: الفعل في سياق المكان، أي الهيكل، يدل على الهدم أو التقويض؛ و«يهدم» واضح وطبيعي.
- source_word: τὸν τόπον τοῦτον
  choice: هذا المكان
  rationale: يحافظ على اللفظ اليوناني العام ولا يستبدله تفسيريا بـ«الهيكل»، مع توضيح المرجع في الحاشية.
- source_word: ἀλλάξει
  choice: يغيّر
  rationale: مقابل مباشر وطبيعي للفعل الدال على إحداث تغيير.
- source_word: τὰ ἔθη
  choice: العادات
  rationale: تدل على الممارسات والأعراف الموروثة، من غير تحميلها معنى اصطلاحيا أضيق.
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: التي سلّمها إلينا موسى
  rationale: يحفظ معنى نقل ما تم تسلمه إلى الجماعة، ويظل قريبا من البنية المصدرية؛ ويمكن التعبير عنه أيضا بـ«ورّثنا إياها موسى».
theological_decisions:
- issue: مرجع «هذا المكان»
  choice: هذا المكان
  alternative: هذا الهيكل / هذا المقدس
  rationale: النص اليوناني يقول حرفيا «هذا المكان». ومع أن السياق يشير إلى الهيكل، تُحفظ العبارة في المتن ويُوضح مرجعها في الحاشية.
- issue: نبرة الاتهام في وصف يسوع
  choice: يسوع الناصري هذا
  alternative: يسوع هذا الذي من الناصرة / يسوع الناصري
  rationale: إبقاء اسم الإشارة يحفظ التشديد الخطابي وربما النبرة الازدرائية في كلام المتهمين، من غير المبالغة في تفسيرها.
- issue: طبيعة القول المنسوب إلى استفانوس
  choice: صياغته بوصفه اتهاما منقولا على لسان الشهود
  alternative: عرضه كتصريح مباشر من الراوي
  rationale: السياق النحوي والسردي ينسب الادعاء إلى الشهود؛ فلا ينبغي أن توحي الترجمة بأن الراوي يصدّق مضمونه.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «فإننا» للصلة التعليلية، و«سيهدم» للدقة السياقية، مع إبقاء «هذا المكان» و«يسوع الناصري هذا» حفاظا على صياغة الاتهام ونبرته. وُضعت جميع علامات الحواشي في المتن.
