  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: ar
  text: وفي تلك الأيام، إذ كان عدد التلاميذ يتزايد، نشأ تذمّر من الهيلينيين على العبرانيين[a]، لأن أراملهم كنّ يُغفَل عنهنّ[b] في التوزيع اليومي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يُرجَّح أن المقصود بالهيلينيين يهود ناطقون باليونانية، في مقابل «العبرانيين»، الذين يُرجَّح أنهم كانوا ناطقين بالآرامية أو العبرية.
    reason: cultural_note
  - marker: b
    text: 'أو: «كنّ يُهمَلن» في الخدمة اليومية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: وفي تلك الأيام
  rationale: تنقل الإطار الزمني، وتؤدي الواو قوة δέ الانتقالية الخفيفة في السرد من غير أن تجعلها أداة استدراك قوية.
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: إذ كان عدد التلاميذ يتزايد
  rationale: صياغة عربية طبيعية تنقل الجملة الحالية المطلقة بوصفها خلفية ظرفية، وتحافظ على دلالة النمو العددي.
- source_word: ἐγένετο γογγυσμός
  choice: نشأ تذمّر
  rationale: يحافظ «تذمّر» على معنى الشكوى المتداولة أو التململ، و«نشأ» يعبّر عن ظهورها في الجماعة.
- source_word: τῶν Ἑλληνιστῶν
  choice: الهِلِّينيين
  rationale: يحافظ على اسم الفئة التاريخي بدل أن يحسم معناه داخل المتن؛ وتشرح الحاشية دلالته اللغوية الثقافية المرجحة.
- source_word: πρὸς τοὺς Ἑβραίους
  choice: على العبرانيين
  rationale: تفيد «على» توجّه التذمر ضد الفئة الأخرى، مع إبقاء اسم الفئة موازيًا للهِلِّينيين.
- source_word: παρεθεωροῦντο
  choice: كنّ يُغفَل عنهنّ
  rationale: ينقل المبني للمجهول وزمن الحالة المستمرة، من غير الجزم بأن الإغفال كان متعمدًا.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: في التوزيع اليومي
  rationale: مع أن διακονία أوسع من «التوزيع»، يرجّح سياق الأرامل والإعالة المادية هذا المعنى المحدد هنا، مع حفظ البديل الأوسع في الحاشية.
- source_word: αἱ χῆραι αὐτῶν
  choice: أراملهم
  rationale: يحافظ على الضمير الذي يعود بطبيعته على الهِلِّينيين، ويبيّن أن الشكوى تخص الأرامل المنتميات إلى جماعتهم.
theological_decisions:
- issue: هوية الفئتين Ἑλληνισταί وἙβραῖοι
  choice: إبقاء الاسمين «الهِلِّينيين» و«العبرانيين» في المتن مع حاشية تفسيرية.
  alternative: اليهود الناطقون باليونانية واليهود الناطقون بالآرامية أو العبرية
  rationale: تحافظ التسمية الأصلية على الطابع التاريخي وعلى قدر من عدم اليقين، بينما توضح الحاشية الفهم اللغوي الثقافي المرجح دون تحويله إلى نص صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الهِلِّينيين» بوصفه اسم فئة تاريخية، مع شرحه في الحاشية، واستُعمل التأنيث الجمعي في «كنّ يُغفَل عنهنّ» موافقةً لـ«أرامل» العاقل.
