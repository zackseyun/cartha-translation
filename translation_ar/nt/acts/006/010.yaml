id: ACT.6.10
reference: Acts 6:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: ar
  text: ولم يقدروا أن يقاوموا الحكمة والروح الذي كان يتكلم به[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «والروح التي كان يتكلم بها»، إذا كان المقصود روح استفانوس نفسه لا الروح القدس.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: يقدروا
  rationale: يفيد الفعل في صيغة الماضي الناقص عدم قدرتهم المستمرة في هذا الموقف، وصيغة «لم يقدروا» عربية طبيعية ودقيقة.
- source_word: ἀντιστῆναι
  choice: أن يقاوموا
  rationale: ينقل معنى الوقوف في وجه كلام استفانوس وعدم التمكن من مجابهته بنجاح.
- source_word: σοφίᾳ
  choice: الحكمة
  rationale: أُبقي التعريف لأن النص اليوناني يشير إلى الحكمة المحددة الظاهرة في كلام استفانوس.
- source_word: πνεύματι
  choice: الروح
  rationale: يرجح السياق الإشارة إلى الروح القدس، ولا سيما وصف استفانوس بأنه ممتلئ من الروح القدس في أعمال 6:5؛ وتتيح العربية إبقاء «الروح» من غير حسم طباعي زائد.
- source_word: ᾧ ἐλάλει
  choice: الذي كان يتكلم به
  rationale: يحافظ الموصول المذكر على المطابقة العربية مع «الروح»، وتنقل الباء دلالة الوسيلة أو التأييد، بينما يعكس «كان يتكلم» الاستمرار في الماضي.
theological_decisions:
- issue: هل يشير πνεύματι إلى الروح القدس أم إلى روح استفانوس؟
  choice: الروح، والمقصود على الأرجح الروح القدس
  alternative: روح استفانوس
  rationale: سياق أعمال الرسل ووصف استفانوس بأنه ممتلئ من الروح القدس يرجحان القراءة الأولى، لكن اللفظ اليوناني في ذاته لا يستبعد الإشارة إلى روح استفانوس، لذلك حُفظ البديل في حاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة واضحة وموقرة. استُعمل «يقاوموا» بدل تعبير أكثر اصطلاحية مثل «يصمدوا أمام» للمحافظة على صورة المجابهة في الأصل، مع إبقاء الغموض الحقيقي في مرجع «الروح» موضحًا بالحاشية.
