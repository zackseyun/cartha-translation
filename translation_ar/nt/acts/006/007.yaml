  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: ar
  text: وكانت كلمة الله تنمو، وكان عدد التلاميذ في أورشليم يتكاثر جدًا، وكان عدد كبير من الكهنة يذعنون للإيمان.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كانوا يطيعون الإيمان»، أو: «كانوا يصيرون مطيعين للإيمان». قد تشير العبارة اليونانية إلى طاعة رسالة الإيمان، لا إلى مجرد فعل ثقة باطني.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: كلمة الله
  rationale: يحفظ التعبير الكتابي الشفاف، مع إبقاء دلالة λόγος مفتوحة على الكلمة أو الرسالة المعلنة دون تضييقها بتفسير زائد.
- source_word: ηὔξανεν
  choice: كانت تنمو
  rationale: ينقل صيغة الماضي الناقص الدالة على نمو مستمر، وهو تعبير عربي طبيعي عند إسناد النمو إلى كلمة الله بمعنى انتشارها وتأثيرها.
- source_word: ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν
  choice: كان عدد التلاميذ يتكاثر
  rationale: يحافظ على ذكر العدد وعلى قوة فعل التكاثر، ويميزه عن فعل النمو السابق، مع نقل الاستمرار في الماضي الناقص.
- source_word: ἐν Ἰερουσαλὴμ σφόδρα
  choice: في أورشليم يتكاثر جدًا
  rationale: ينقل المكان والتوكيد بعبارة واضحة ومباشرة؛ و«جدًا» تعدّل التكاثر كما في اليونانية.
- source_word: πολύς τε ὄχλος τῶν ἱερέων
  choice: جمع كبير من الكهنة
  rationale: ينقل المعنى الجمعي لـὄχλος بصورة عربية فصيحة وطبيعية، ويحدد أن المقصود كهنة الهيكل اليهود.
- source_word: ὑπήκουον
  choice: كانوا يطيعون
  rationale: ينقل المعنى المباشر للفعل وصيغة الماضي الناقص المستمرة، دون إضافة دلالة «صاروا» التي قد توحي بمرحلة تحول أكثر مما يصرح به اللفظ.
- source_word: τῇ πίστει
  choice: الإيمان
  rationale: يحفظ المقابل المعتاد لـπίστις مع أداة التعريف، ويُبقي التوتر بين الإيمان بوصفه الرسالة أو المعتقد وبين معنى الثقة، بدل إدخال عبارة تفسيرية في المتن.
theological_decisions:
- issue: دلالة τῇ πίστει في عبارة ὑπήκουον τῇ πίστει
  choice: يطيعون الإيمان
  alternative: ينقادون للرسالة الإيمانية؛ أو يصيرون مطيعين للإيمان
  rationale: الترجمة المختارة تحافظ على تركيب النص اللافت وعلى المعنى الموضوعي المحتمل للإيمان بوصفه البشارة أو مضمون الاعتقاد، من غير أن تحصره في فعل ثقة باطني أو تستبدله بتفسير صريح. وتوضح الحاشية البدائل الدلالية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدم تكرار «كان» لنقل الأفعال اليونانية في الماضي الناقص وإبراز استمرار نمو الكلمة وتكاثر التلاميذ وطاعة الكهنة. وُضع مؤشر الحاشية بعد العبارة التي يشرحها مباشرة.
