  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: ar
  text: 'فدعا الاثنا عشر جماعةَ التلاميذ كلَّها[a] وقالوا: «لا يَحسُن بنا[b] أن نترك كلمة الله لنخدم الموائد[c].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «جموع التلاميذ» أو «جميع التلاميذ».
    reason: lexical_alternative
  - marker: b
    text: أو «لا يليق بنا» أو «ليس مقبولًا أن».
    reason: lexical_alternative
  - marker: c
    text: أي القيام بالتوزيع العملي المتصل بموائد الجماعة وطعامها ومواردها.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: دعا
  rationale: ينقل معنى استدعاء الجماعة للاجتماع بصياغة عربية طبيعية، وتُفهم دلالة الاجتماع من المفعول والسياق.
- source_word: δὲ
  choice: فـ
  rationale: الفاء مناسبة للانتقال السردي وبيان أن هذا الإجراء جاء استجابةً لما سبق، من غير إفادة تعارض قوي.
- source_word: οἱ δώδεκα
  choice: الاثنا عشر
  rationale: يحافظ على اللقب الجماعي الوارد في اليونانية من غير إضافة «الرسل»، وهي غير مذكورة صراحةً هنا.
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: جماعة التلاميذ كلَّها
  rationale: صياغة عربية واضحة تنقل الدلالة الجمعية واحتمال شمول جماعة التلاميذ، مع إثبات البدائل المعجمية في الحاشية.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: لا يَحسُن بنا
  rationale: تعبير عربي فصيح وطبيعي يدل على عدم الملاءمة أو الصواب في ترتيب المسؤوليات، من غير الانتقاص من شأن الخدمة العملية.
- source_word: ἡμᾶς καταλείψαντας
  choice: أن نترك
  rationale: ينقل تركيب المصدر اليوناني إلى أسلوب عربي طبيعي، ويحافظ «نترك» على المعنى من غير تشديد زائد قد توحي به «نهجر».
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: كلمة الله
  rationale: ترجمة راسخة وشفافة تحفظ الرنين اللاهوتي، مع إمكان دلالتها في سفر الأعمال على رسالة الله المعلنة.
- source_word: διακονεῖν
  choice: لنخدم
  rationale: ينقل معنى الخدمة العملية بلفظ واضح، من غير تحميله دلالة كنسية اصطلاحية لاحقة.
- source_word: τραπέζαις
  choice: الموائد
  rationale: يحافظ على الصورة اللفظية في الأصل؛ أما صلتها بتوزيع الطعام والموارد فتُشرح في الحاشية بدل إدخال التفسير في المتن.
theological_decisions:
- issue: أولوية خدمة الكلمة وعلاقتها بالخدمة العملية
  choice: 'صياغة القول بوصفه حكمًا على ما يلائم مسؤولية الاثني عشر: «لا يحسن بنا أن نترك كلمة الله لنخدم الموائد»'
  alternative: «لا يرضي» أو «ليس مقبولًا لنا» مع احتمال أن تبدو خدمة الموائد أدنى شأنًا
  rationale: السياق يميّز بين المسؤوليات ولا يحكم بأن الخدمة العملية قليلة الكرامة؛ وتحفظ الصياغة أولوية كلمة الله لدى الاثني عشر من غير حسم توتر النص أو الانتقاص من خدمة الموائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «الموائد» للمحافظة على صورة الأصل، و«لا يحسن بنا» للتعبير الطبيعي عن الملاءمة من غير إضفاء حكم على كرامة الخدمة العملية. جميع علامات الحواشي مثبتة في المتن بحسب ترتيب ظهورها.
