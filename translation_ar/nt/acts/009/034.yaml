  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: ar
  text: 'فقال له بطرس: «يا إينياس، يشفيك يسوع المسيح. قُمْ وافْرُشْ لنفسك[a]». فقام في الحال.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هيِّئ لنفسك فراشًا». لا يذكر اليوناني المفعول به صراحة، ويُفهم من السياق أنه موضع النوم أو الفراش.'
    reason: توضيح إيجاز الفعل اليوناني ودلالة «لنفسك» مع عدم فرض مفعول به في المتن.
lexical_decisions:
- source_word: ἰᾶταί
  choice: يشفيك
  rationale: صيغة المضارع في اليونانية، وتأتي هنا إعلانًا نافذًا للشفاء. يحافظ المضارع العربي على قوة العبارة من غير أن يحسمها إلى «قد شفاك» أو يجعلها عملية ممتدة.
- source_word: Χριστός
  choice: المسيح
  rationale: اللفظ العربي المألوف الذي يحفظ معنى اللقب اليوناني Χριστός، ولا يحتاج إلى التفريق الاصطناعي بين «المسيح» ولفظ منقول صوتيًا.
- source_word: ἀνάστηθι
  choice: قُم
  rationale: أمر موجز وطبيعي لرجل كان ملازمًا للفراش، ويقابله الفعل نفسه في ختام العدد.
- source_word: στρῶσον σεαυτῷ
  choice: هيِّئ فراشك بنفسك
  rationale: الفعل يدل على البسط أو التهيئة، ولا يذكر النص اليوناني المفعول به صراحة؛ لكن سياق ملازمة الفراش يجعله مفهومًا. و«بنفسك» تحفظ دلالة σεαυτῷ على قيامه بالأمر لنفسه بعد شفائه.
- source_word: εὐθέως
  choice: في الحال
  rationale: تعبير عربي واضح وطبيعي يفيد وقوع الاستجابة بلا إبطاء.
- source_word: ἀνέστη
  choice: قام
  rationale: يحافظ على الصلة اللفظية المباشرة بأمر «قُم» ويعرض النتيجة الفورية بإيجاز.
- source_word: Αἰνέα
  choice: إينياس
  rationale: نقل صوتي عربي واضح للاسم اليوناني Αἰνέας في صيغة النداء.
theological_decisions:
- issue: دلالة Χριστός في إعلان الشفاء
  choice: يسوع المسيح
  alternative: يسوع الممسوح
  rationale: «المسيح» في العربية لقب دال على الممسوح، وهو التعبير الكتابي المألوف والطبيعي، ويحفظ البعد اللقبي من غير أن يعامله كلقب عائلي.
- issue: زمن إعلان الشفاء ἰᾶταί σε
  choice: يشفيك
  alternative: قد شفاك
  rationale: اختير المضارع وفق الصيغة اليونانية، مع إبقاء التوتر بين إعلان الشفاء وفعاليته الفورية، بدل تفسيره صراحة على أنه فعل مكتمل قبل الكلام.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «هيِّئ فراشك» بدل تعبير قد يوحي بصنع الفراش، وحُفظ التوازي بين «قُم» و«فقام». وُضعت علامة الحاشية [a] في المتن كما يلزم.
