source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: ar
  text: لكن برنابا أمسك به وأحضره إلى الرسل، وروى لهم كيف رأى الرب في الطريق، وأن الرب كلّمه، وكيف تكلّم بجرأة في دمشق باسم يسوع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος
  choice: أمسك به
  rationale: يحفظ المعنى المحسوس للفعل، أي الأخذ بالشخص أو الإمساك به لمرافقته، من غير إيحاء بالقبض العدائي الذي لا يلائم السياق.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: أحضره إلى الرسل
  rationale: ينقل معنى الاقتياد أو الإحضار بصورة عربية طبيعية، ويبيّن أن برنابا قدّمه إلى الرسل.
- source_word: διηγήσατο
  choice: روى لهم
  rationale: الفعل يدل على سرد الخبر أو روايته، و«روى لهم» فصيحة وواضحة وتحافظ على معنى نقل التفاصيل.
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: كيف ... في الطريق
  rationale: المقصود الطريق في رحلة شاول إلى دمشق، لا استعمال «الطريق» اسمًا لجماعة المؤمنين.
- source_word: εἶδεν τὸν κύριον
  choice: رأى الرب
  rationale: يحافظ الماضي العربي على زمن الفعل اليوناني ضمن الخبر المنقول، و«الرب» تنقل κύριος بلقبه اللاهوتي دون تفسير زائد.
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: وأنه كلّمه
  rationale: يُبقي الرب فاعل الكلام وشاول متلقيه كما يقتضي تسلسل العبارة، مع صياغة عربية موجزة وطبيعية.
- source_word: ἐπαρρησιάσατο
  choice: جاهر بالكلام
  rationale: ينقل معنى التحدث بحرية وجرأة وعلانية، من غير تخصيص الفعل بالوعظ وحده.
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: باسم يسوع
  rationale: يحفظ التعبير الكتابي الدال على الارتباط بسلطان يسوع والاعتراف به، وهو تعبير عربي مألوف.
theological_decisions:
- issue: مرجع لقب «الرب» في خبر اللقاء على الطريق
  choice: إبقاء اللقب «الرب» مع فهمه في السياق على أنه يسوع القائم
  alternative: اعتباره إشارة إلهية عامة غير محددة
  rationale: السياق المباشر في أعمال 9 يعرّف المتكلم في اللقاء بأنه يسوع، كما أن خاتمة الآية تذكر اسم يسوع. ومع ذلك لا تُستبدل كلمة «الرب» بالاسم، حفاظًا على صياغة الأصل وثقل اللقب المسيحاني.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُعملت «جاهر بالكلام» لتأدية دلالة الجرأة والعلانية معًا، وتُركت بنية الرواية المتتابعة كما في اليونانية من غير إضافة تفسيرية.
