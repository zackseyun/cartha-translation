    issue: التباس مرجع الضمير في «وأنه كلّمه».
    rationale: المقصود في الأصل أن الرب هو الذي تكلّم إلى شاول. وإظهار «الرب» فاعلًا في العربية يزيل احتمال فهم العبارة على أن شاول هو المتكلم أو أن مرجع الضمير غير محدد، من غير إضافة تفسيرية.
  - severity: low
    issue: «جاهر بالكلام» غير سلسة في العربية المعاصرة.
    rationale: الفعل اليوناني يدل على الكلام بجرأة/صراحة. «تكلّم بجرأة» تعبير عربي طبيعي ويؤدي المعنى من غير تخصيصه بالوعظ.
  revised_text: لكن برنابا أمسك به وأحضره إلى الرسل، وروى لهم كيف رأى الرب في الطريق، وأن الرب كلّمه، وكيف تكلّم بجرأة في دمشق باسم يسوع.
