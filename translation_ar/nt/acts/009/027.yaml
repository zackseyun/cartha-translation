  to: لكن برنابا أمسك به وأحضره إلى الرسل، وروى لهم كيف رأى الرب في الطريق، وأن الرب كلّمه، وكيف تكلّم بجرأة في دمشق باسم يسوع.
  rationale: أُظهر مرجع فعل الكلام صراحةً للحفاظ على علاقة الفاعل والمفعول في الأصل، واستُبدلت العبارة الثقيلة «جاهر بالكلام» بـ«تكلّم بجرأة» لتأدية معنى ἐπαρρησιάσατο بلغة فصيحة حديثة طبيعية. ولا تحتاج الآية إلى حاشية.
