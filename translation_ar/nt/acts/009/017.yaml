source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: ar
  text: 'فذهب حنانيا ودخل البيت، ووضع يديه عليه وقال: «يا شاول أخي، أرسلني الرب—يسوع الذي ظهر لك في الطريق الذي كنت تسير فيه[a]—لكي تستعيد بصرك[b] وتمتلئ بالروح القدس».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الطريق الذي كنت مسافرًا فيه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تبصر من جديد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: فذهب
  rationale: تفيد δέ تقدّم السرد، وتؤدي الفاء هنا صلةً طبيعية بما سبق، بينما ينقل «ذهب» الفعل دون المبالغة في معنى المغادرة.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: دخل البيت
  rationale: صياغة عربية موجزة وطبيعية تطابق معنى الدخول إلى البيت.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: ووضع يديه عليه
  rationale: يحفظ الفعل الجسدي وصيغة الحدث المصاحب، مع استعمال عربي كتابي واضح.
- source_word: Σαοὺλ ἀδελφέ
  choice: يا شاول أخي
  rationale: ينقل النداء وصلة الأخوّة بترتيب عربي طبيعي، من غير حسم ما إذا كانت الأخوّة هنا إيمانية أو قومية أكثر مما يسمح به السياق.
- source_word: ὁ κύριος ἀπέσταλκέν με
  choice: أرسلني الرب
  rationale: ينقل هوية المُرسِل، ويؤدي الماضي العربي النتيجة القائمة لفعل الإرسال بصورة طبيعية في السياق.
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: يسوع الذي ظهر لك
  rationale: يحفظ مجيء «يسوع» بدلًا يعرّف «الرب»، وينقل المبني للمجهول الاصطلاحي بمعنى الظهور دون تركيب عربي متكلّف.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: في الطريق التي كنت آتيًا فيها
  rationale: يحفظ مرجع الطريق وصيغة الاستمرار في ἤρχου، مع إبقاء اتجاه المجيء كما في اليونانية.
- source_word: ὅπως
  choice: لكي
  rationale: تعبّر بوضوح عن الغاية المقصودة.
- source_word: ἀναβλέψῃς
  choice: تستعيد بصرك
  rationale: السياق هو استرداد البصر بعد العمى، وهذه العبارة أوضح من معنى «تنظر إلى أعلى» غير المقصود هنا.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: تمتلئ من الروح القدس
  rationale: يحفظ المبني للمجهول ومعنى الامتلاء، وتأتي «من» عربيةً طبيعية مع هذا التعبير.
theological_decisions:
- issue: تعيين العلاقة بين «الرب» و«يسوع» في ὁ κύριος ... Ἰησοῦς
  choice: أرسلني الرب—يسوع الذي ظهر لك...—
  alternative: أرسلني الرب يسوع الذي ظهر لك...
  rationale: يبقي ترتيب اليونانية والبنية البدلّية ظاهرة، فيوضح أن «يسوع» يعيّن «الرب» دون إعادة ترتيب الجملة أو تسوية توترها النحوي.
- issue: دلالة πνεύματος ἁγίου الخالية من أداة التعريف في اليونانية
  choice: الروح القدس
  alternative: روح قدس
  rationale: غياب الأداة في هذا التركيب اليوناني لا يقتضي التنكير، وسياق أعمال الرسل يشير إلى الروح الإلهي المعروف؛ والتعريف هو التعبير العربي الطبيعي.
- issue: دلالة ἀδελφέ في خطاب حنانيا لشاول
  choice: يا شاول أخي
  alternative: يا أخي شاول
  rationale: يحفظ ألفة الخطاب وقبوله، مع عدم إضافة وصف صريح يحصر الأخوّة في معنى لاهوتي أو قومي بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ ترتيب العبارة اليونانية الذي يجعل «يسوع» بدلًا مفسرًا لـ«الرب»، واستُعملت شرطتان لإظهار الاعتراض التفسيري. أُثبتت علامتا الحاشيتين [a] و[b] في المتن.
