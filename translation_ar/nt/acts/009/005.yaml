base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: ar
  text: 'فقال: «مَن أنتَ، يا ربّ؟»[a] فقال: «أنا يسوع الذي تضطهده أنتَ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا سيدي». يمكن أن تكون الكلمة اليونانية κύριε صيغة خطاب محترمة؛ وقد تُرجمت هنا «يا ربّ» بما يلائم سياق الإعلان.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: فقال
  rationale: فعل سردي ماضٍ من λέγω، وصيغة «فقال» طبيعية في العربية وتصل الحدث بما قبله.
- source_word: δέ
  choice: الفاء في «فقال»
  rationale: أداة ربط سردية خفيفة؛ أدّت الفاء معناها في تسلسل الحدث من غير إحداث مقابلة غير موجودة.
- source_word: Τίς εἶ
  choice: مَن أنتَ
  rationale: ترجمة مباشرة وطبيعية للاستفهام الشخصي مع فعل الكينونة المفهوم في العربية.
- source_word: κύριε
  choice: يا ربّ
  rationale: يحفظ المقابل المعتاد لـκύριος ويلائم مقام مخاطبة الصوت السماوي، مع إثبات احتمال معنى النداء الاحترامي في الحاشية.
- source_word: Ἐγώ εἰμι
  choice: أنا
  rationale: الجملة الاسمية العربية تؤدي التعريف المباشر، والضمير المنفصل يحفظ توكيد Ἐγώ.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم.
- source_word: ὃν σὺ διώκεις
  choice: الذي تضطهده أنتَ
  rationale: يحفظ الموصول وكون يسوع مفعول الاضطهاد، ويُظهر الضمير المنفصل توكيد σὺ الصريح في اليونانية.
- source_word: διώκεις
  choice: تضطهده
  rationale: المضارع العربي يصور الفعل الجاري، و«اضطهد» هو المقابل الطبيعي للسلوك العدائي المقصود هنا.
theological_decisions:
- issue: دلالة κύριε قبل أن يعرف شاول هوية المتكلم
  choice: يا ربّ
  alternative: يا سيدي
  rationale: اللفظ اليوناني يحتمل نداء الاحترام، لكن «يا ربّ» يحفظ الاستعمال الكتابي المعتاد وقوة سياق الإعلان، من غير الجزم بأن السؤال نفسه يمثل اعترافًا لاهوتيًا مكتملًا؛ لذلك ذُكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت الفاء للربط السردي، وأُبقي توكيد الضمير اليوناني في «تضطهده أنتَ». وُضع مؤشر الحاشية بعد عبارة «يا ربّ؟» لأنه يخص لفظ κύριε.
