  to: فقام بطرس وذهب معهما. ولما وصل، أصعداه إلى العُلِّيَّة، ووقفت عنده جميع الأرامل[a]، وهن يبكين ويُرِينه الأقمصة والثياب[b] التي كانت دوركاس[c] تصنعها حين كانت معهن.
