    issue: إدراج «طابيثا، أي» في المتن
    rationale: المصدر اليوناني يقرأ ἡ Δορκάς («دوركاس») فقط. إضافة «طابيثا» إلى المتن تستورد اسمًا من آية سابقة، حتى لو كانت الهوية صحيحة.
  - severity: medium
    issue: التباس الفاعل في «فوقف عنده جميع الأرامل»
    rationale: صيغة «فوقف» المفرد المذكر قد يعود ظاهرًا إلى بطرس، بينما الفعل اليوناني يسند الوقوف إلى «جميع الأرامل». ينبغي قول «ووقفت جميع الأرامل عنده».
