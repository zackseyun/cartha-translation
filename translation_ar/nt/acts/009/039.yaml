source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: ar
  text: فقام بطرس وذهب معهما. ولما وصل، أصعداه إلى العُلِّيَّة، ووقفت عنده جميع الأرامل[a]، وهن يبكين ويُرِينه الأقمصة والثياب[b] التي كانت دوركاس[c] تصنعها حين كانت معهن.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ووقفت أمامه جميع الأرامل». يحتمل التعبير اليوناني الوقوف عنده أو أمامه.'
    reason: lexical_alternative
  - marker: b
    text: 'تشير الكلمتان اليونانيتان إلى نوعين من اللباس: قميص أو ثوب أساسي، وثوب أعم أو خارجي.'
    reason: cultural_note
  - marker: c
    text: «دوركاس» هو الاسم اليوناني؛ وتُدعى المرأة نفسها أيضًا «طابيثا» في أعمال 9:36.
    reason: cross_reference
lexical_decisions:
- source_word: ἀναστὰς
  choice: فقام
  rationale: ينقل نهوض بطرس استجابةً لطلب الرجلين بصياغة عربية طبيعية وموجزة.
- source_word: συνῆλθεν αὐτοῖς
  choice: وذهب معهما
  rationale: الفعل في السياق يدل على مرافقة الرسولين، والمثنى مستفاد من سياق الآية السابقة.
- source_word: παραγενόμενον
  choice: ولما وصل
  rationale: يؤدي معنى الظرف الزمني للمشاركة اليونانية بعبارة عربية سلسة.
- source_word: ἀνήγαγον εἰς τὸ ὑπερῷον
  choice: أصعداه إلى العُلِّيَّة
  rationale: يحفظ معنى الحركة إلى أعلى، و«العُلِّيَّة» اسم عربي واضح للحجرة الواقعة في الطابق العلوي.
- source_word: παρέστησαν αὐτῷ
  choice: فوقف عنده
  rationale: يحفظ المعنى المكاني المباشر من غير أن يفرض مشهدًا رسميًا؛ ويمكن أن يفيد الوقوف أمامه، ولذلك أُثبت البديل في الحاشية.
- source_word: πᾶσαι αἱ χῆραι
  choice: جميع الأرامل
  rationale: ترجمة مباشرة تحافظ على توكيد شمول جماعة الأرامل.
- source_word: κλαίουσαι καὶ ἐπιδεικνύμεναι
  choice: وهن يبكين ويُرِينه
  rationale: تنقل المشاركتين الحاليتين بوصفهما فعلين متزامنين ومستمرين في المشهد.
- source_word: χιτῶνας καὶ ἱμάτια
  choice: الأقمصة والثياب
  rationale: «الأقمصة» تقابل الثوب الأساسي، و«الثياب» تقابل اللفظ الأوسع أو اللباس الخارجي، مع إبقاء التمييز بين المصطلحين.
- source_word: ὅσα ἐποίει
  choice: التي كانت ... تصنعها
  rationale: صيغة «كانت تصنعها» تنقل الماضي الناقص، وتبقي احتمال الاستمرار أو التكرار من غير تحويله صراحةً إلى عادة.
- source_word: μετ’ αὐτῶν οὖσα
  choice: حين كانت معهن
  rationale: ترجمة مباشرة تبقي ضمير التأنيث الجمع عائدًا إلى الأرامل.
- source_word: ἡ Δορκάς
  choice: طابيثا، أي دوركاس
  rationale: المتن اليوناني يذكر دوركاس وحده، لكن إدراج الاسم السامي المعروف من الآية 36 يوضح هوية المرأة للقارئ العربي من غير استبدال الاسم الوارد هنا.
