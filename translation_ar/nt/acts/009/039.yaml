  verdict: revise
  source_fidelity: يلزم حذف «طابيثا، أي» من المتن، لأن النص اليوناني في هذه الآية يذكر «دوركاس» وحده. كما أن «فوقف عنده جميع الأرامل» ملتبسة نحويًا وقد تُفهم على أن بطرس هو الذي وقف؛ والصواب إسناد الفعل إلى الأرامل صراحة. وتحافظ الصياغة المنقحة على دلالة الفعل الناقص في «كانت ... تصنعها» وعلى التمييز بين نوعَي اللباس.
  naturalness: النص المنقح فصيح واضح وسلس. واستعمال «ووقفت جميع الأرامل عنده» يزيل اللبس ويجعل مشهد الأرامل الباكيات طبيعيًا في العربية المعاصرة.
  terminology: «العُلِّيَّة»، «الأرامل»، «الأقمصة والثياب»، و«دوركاس» مناسبة. يُذكر اسم «طابيثا» في الحاشية بوصفه الاسم الوارد في أعمال 9:36، لا في متن هذه الآية.
  issues:
