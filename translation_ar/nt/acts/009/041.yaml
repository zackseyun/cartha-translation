  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: ar
  text: ومدَّ يده إليها[a]، فأنهضها. ثم دعا القديسين والأرامل، وقدَّمها إليهم حيَّةً.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أعطاها يده».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: مدَّ يده إليها
  rationale: تعبير عربي طبيعي يصوّر إعطاء اليد بقصد المعونة، ويحافظ على اتجاه الفعل في اليونانية دون إيحاء بأنه أمسكها ابتداءً.
- source_word: ἀνέστησεν
  choice: فأنهضها
  rationale: ينقل معنى جعلها تنهض أو تقوم، ويلائم الحركة الجسدية هنا، مع إبقاء الصلة اللفظية بسياق الإقامة من الموت دون المبالغة في حسم دلالة الفعل وحده.
- source_word: φωνήσας
  choice: ثم دعا
  rationale: يؤدي معنى استدعاء الجماعة، ويعبّر طبيعيًا عن سبق هذا الفعل لتقديمها إليهم.
- source_word: τοὺς ἁγίους
  choice: القديسين
  rationale: المقابل المباشر للتسمية العهدية لشعب الله، وهو أدق من التفسير بلفظ المؤمنين.
- source_word: τὰς χήρας
  choice: الأرامل
  rationale: ترجمة مباشرة تحفظ ذكر الأرامل بوصفهن فئة متميزة ذات أهمية في السياق السابق.
- source_word: παρέστησεν
  choice: قدَّمها إليهم
  rationale: ينقل معنى إحضارها وإقامتها أمام المدعوين؛ وأضيف «إليهم» عربيًا لإيضاح المتلقين المفهومين من السياق.
- source_word: ζῶσαν
  choice: حيَّةً
  rationale: حال تفيد أنه قدّمها وهي حية، وتحفظ القوة السردية في مشهد عودتها إلى الحياة.
theological_decisions:
- issue: دلالة ἀνέστησεν في سياق الإقامة من الموت
  choice: فأنهضها
  alternative: أقامها / ساعدها على النهوض
  rationale: «أنهضها» يحفظ المعنى السببي المباشر، أي جعلها تنهض، ويظل منسجمًا مع صدى لغة القيامة في السياق. أما «أقامها» فقد يُفهم وحده على أنه إتمام معجزة الإحياء في هذه اللحظة، مع أن عودتها إلى الحياة وقعت بحسب الآية السابقة.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة. استُخدم «القديسين» بدلالته العهدية العامة، وحُفظ التمييز بين القديسين والأرامل. وُضعت علامة الحاشية في المتن كما يلزم.
