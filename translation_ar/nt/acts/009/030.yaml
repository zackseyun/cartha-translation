id: ACT.9.30
reference: Acts 9:30
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: ar
  text: فَلَمَّا عَلِمَ الإِخْوَةُ بِذَلِكَ[a]، أَنْزَلُوهُ إِلَى قَيْصَرِيَّةَ، ثُمَّ أَرْسَلُوهُ إِلَى طَرْسُوسَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات»؛ فالنص اليوناني يقول «الإخوة»، لكن اللفظ قد يشير في هذا السياق إلى جماعة المؤمنين عمومًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: فَلَمَّا عَلِمَ ... بِذَلِكَ
  rationale: اسم الفاعل الأوريستي يبيّن الظرف الذي دفع إلى الفعلين الرئيسيين. والمفعول مفهوم من الآية السابقة، لذلك أُضيفت «بذلك» في العربية لوضوح الإحالة.
- source_word: οἱ ἀδελφοὶ
  choice: الإِخْوَةُ
  rationale: ترجمة مباشرة لصيغة الجمع المذكر. وقد يُراد بها في هذا السياق جماعة المؤمنين على نطاق أوسع، وهو ما توضحه الحاشية من غير تغيير صيغة المتن.
- source_word: κατήγαγον
  choice: أَنْزَلُوهُ إِلَى
  rationale: يحفظ الفعل معنى الحركة إلى أسفل، وهنا على الأرجح النزول من أورشليم باتجاه قيصرية الساحلية، ويأتي طبيعيًّا في العربية.
- source_word: Καισάρειαν
  choice: قَيْصَرِيَّةَ
  rationale: الصيغة العربية المألوفة لاسم المدينة، ولا يلزم في السياق إضافة «البحرية».
- source_word: ἐξαπέστειλαν
  choice: أَرْسَلُوهُ
  rationale: ينقل فعل الإرسال بوضوح وطبيعية. دلالة الإبعاد أو الإرسال إلى الخارج في الفعل المركب مفهومة من حركة السرد ومن ذكر الوجهة، ولا تحتاج إلى لفظ زائد قد يحمّل النص نبرة غير لازمة.
- source_word: Ταρσόν
  choice: طَرْسُوسَ
  rationale: الصيغة العربية المألوفة لاسم المدينة.
theological_decisions:
- issue: دلالة ἀδελφοί في جماعة يُحتمل أن تضم رجالًا ونساءً
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: حُفظت صيغة الجمع المذكر الموجودة في اليونانية، مع بيان احتمال دلالتها السياقية الأوسع في الحاشية، تجنبًا لحسم مدى الشمول داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية رصينة. استُعمل «فلما» لربط العلم بما سبق وبالإجراء اللاحق، و«ثم» لتوضيح تعاقب نقل شاول إلى قيصرية وإرساله منها إلى طرسوس.
