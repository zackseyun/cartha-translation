  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: ar
  text: وفي تلك الأيام، حدث أن مرضت ثم ماتت. وبعد أن غسلوها، وضعوها في غرفة في الطابق العلوي[أ].
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'أو: «في علّية». تشير اليونانية ببساطة إلى غرفة في طابق علوي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: وفي تلك الأيام مرضت وماتت
  rationale: أُديت الصيغة السردية مع δὲ بواو انتقال خفيفة، من غير تركيب عربي ثقيل مثل «حدث أن»، لأن توالي الحدثين واضح طبيعيًا في العربية.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: في تلك الأيام
  rationale: تعبير زمني مباشر يحافظ على دلالة الأصل ويجري طبيعيًا في العربية المعاصرة.
- source_word: ἀσθενήσασαν αὐτὴν ἀποθανεῖν
  choice: مرضت وماتت
  rationale: نُقلت البنية اليونانية المصدرية إلى فعلين تامين طبيعيين في العربية، مع حفظ ترتيب المرض ثم الموت.
- source_word: λούσαντες
  choice: فغسّلوها
  rationale: يدل اسم الفاعل الأوريستي على فعل سبق الوضع؛ والفاء ثم «ثم» توضحان التسلسل. والضمير يعود إلى المرأة بعد موتها، أي إلى جسدها، من غير إضافة تفسيرية إلى المتن.
- source_word: ἔθηκαν αὐτὴν
  choice: وضعوها
  rationale: «وضع» مقابل عربي واضح ومحايد لـ τίθημι، ملائم لوضع الجسد في الغرفة دون مبالغة تفسيرية.
- source_word: ἐν ὑπερῴῳ
  choice: في غرفة في الطابق العلوي
  rationale: ὑπερῷον غرفة تقع في طبقة علوية؛ والصياغة تمنع الإيحاء بأنها «العليّة» المعروفة أو غرفة محددة، إذ لا أداة تعريف في اليونانية.
theological_decisions:
- issue: هل تشير ὑπερῴῳ إلى «العليّة» بوصفها مكانًا معروفًا أم إلى غرفة علوية عامة؟
  choice: في غرفة في الطابق العلوي
  alternative: في العليّة
  rationale: اللفظة اليونانية نكرة وتصف موضعًا في الطابق العلوي، ولا يقتضي السياق ربطه بغرفة مخصوصة أو معروفة من مواضع أخرى.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بصياغة سردية طبيعية. لم تُضف علامة حاشية لأن النص الإنجليزي يضع [a] بعد «غسلوها» مع أن حاشيته تتناول ὑπερῴῳ، ويبدو ذلك خللًا في موضع العلامة؛ أما الترجمة العربية المختارة فتستوعب المعنى المكاني بوضوح من غير حاجة إلى بديل في الحاشية.
