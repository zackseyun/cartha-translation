  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: ar
  text: وقد رأى في رؤيا رجلًا اسمه حنانيا يدخل ويضع يديه عليه لكي يستعيد بصره[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يبصر من جديد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: رأى
  rationale: صيغة الماضي اليونانية تُنقل طبيعيًا بالماضي العربي، والسياق يبيّن أن الرؤيا حدثت قبل كلام الرب مع حنانيا مع بقاء أثرها حاضرًا.
- source_word: ἐν ὁράματι
  choice: في رؤيا
  rationale: تعبير عربي واضح ومألوف ينقل الوسيلة أو المجال الذي وقع فيه ما رآه شاول.
- source_word: ἄνδρα ... Ἁνανίαν ὀνόματι
  choice: رجلًا اسمه حنانيا
  rationale: ينقل هوية الشخص وجنسه وصيغة التعريف باسمه بلغة عربية طبيعية.
- source_word: εἰσελθόντα
  choice: يدخل
  rationale: يصوّر الفعل كما شاهده شاول داخل الرؤيا، دون التشديد على ترتيب زمني لا تفرضه صيغة اسم الفاعل.
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: ويضع يديه عليه
  rationale: يحفظ الفعل الجسدي الوارد في اليونانية بعبارة عربية كتابية مفهومة، من غير تعيين دلالة طقسية أو مذهبية.
- source_word: ὅπως
  choice: لكي
  rationale: تفيد الغاية بوضوح وإيجاز.
- source_word: ἀναβλέψῃ
  choice: يستعيد بصره
  rationale: هذا هو المعنى الأنسب في سياق شفاء شاول من العمى؛ ويمكن أيضًا التعبير عنه بأنه يبصر من جديد.
theological_decisions:
- issue: دلالة وضع اليدين
  choice: ويضع يديه عليه
  alternative: ويلقي عليه يديه
  rationale: يذكر النص الفعل نفسه دون أن يحدّد هنا طبيعته الطقسية أو آليته؛ لذلك تحافظ الصياغة على الحدث ولا تضيف تفسيرًا مذهبيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «رؤيا» للمشهد المرئي الممنوح إلهيًا، و«يستعيد بصره» بوصفها العبارة العربية الطبيعية في سياق زوال العمى.
