  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: ar
  text: فنهض شاول عن الأرض، ومع أن عينيه كانتا مفتوحتين[a]، لم يكن يرى شيئًا. فاقتادوه بيده وأدخلوه إلى دمشق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكبر: «وقد فُتحت عيناه، لم يكن يرى شيئًا». يبرز التركيب اليوناني المفارقة: كانت عيناه مفتوحتين، ومع ذلك لم يكن يرى شيئًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: نهض
  rationale: الفعل المبني للمجهول صرفيًا يُستعمل هنا استعمالًا لازمًا في سياق السرد، أي إن شاول قام من موضع سقوطه؛ و«نهض» عربية طبيعية وموجزة.
- source_word: ἀπὸ τῆς γῆς
  choice: عن الأرض
  rationale: تشير γῆ هنا إلى سطح الأرض الذي سقط عليه شاول، لا إلى العالم أو الإقليم.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: مع أن عينيه كانتا مفتوحتين
  rationale: ينقل هذا التركيب الظرفي معنى الملابسة مع إبراز المفارقة السياقية بين انفتاح العينين والعجز عن الرؤية.
- source_word: οὐδὲν ἔβλεπεν
  choice: لم يكن يرى شيئًا
  rationale: يحافظ على زمن الفعل الناقص الدال على الحالة المستمرة آنذاك، ويعبّر بوضوح عن انعدام الرؤية.
- source_word: χειραγωγοῦντες
  choice: فاقتادوه بيده
  rationale: يحفظ الصورة الحسية للفعل الذي يعني قيادة شخص بالإمساك بيده، ولا يختزله إلى مجرد الإرشاد.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: وأدخلوه إلى دمشق
  rationale: ينقل حركة الدخول إلى المدينة، ويتجنب تكرار فعل القيادة بعد ذكر اقتياده باليد.
- source_word: Σαῦλος
  choice: شاول
  rationale: الصيغة العربية الكتابية الشائعة للاسم الشخصي.
- source_word: Δαμασκόν
  choice: دمشق
  rationale: الاسم العربي المستقر للمدينة.
- source_word: δὲ
  choice: فـ / ومع أن / فـ
  rationale: 'تؤدي حروف الربط بحسب وظائفها السياقية: متابعة السرد، وإظهار المقابلة، ثم بيان الفعل اللاحق الناتج من عجزه عن الرؤية.'
