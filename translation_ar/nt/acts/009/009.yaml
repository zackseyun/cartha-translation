  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: ar
  text: وكان لمدة ثلاثة أيام لا يُبصر[a]، ولم يأكل ولم يشرب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «غير مُبصر» أو «لا يرى». تدل العبارة على أن شاول لم يكن قادرًا على الرؤية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: ومكث ثلاثة أيام
  rationale: يفيد نصب «ἡμέρας τρεῖς» امتداد الزمن. وصيغة «مكث ثلاثة أيام» عربية طبيعية تؤدي معنى استمرار حاله خلال هذه المدة، وإن كانت «كان ثلاثة أيام» أقرب حرفيًا إلى ἦν لكنها أقل سلاسة.
- source_word: μὴ βλέπων
  choice: لا يُبصر
  rationale: اسم الفاعل المنفي يعني حرفيًا «غير مُبصر» أو «لا يرى». واختيار «لا يُبصر» يحفظ صياغة المصدر من غير تحويلها في المتن إلى الصفة الأقوى «أعمى».
- source_word: οὐκ ἔφαγεν
  choice: لم يأكل
  rationale: ترجمة مباشرة للفعل ἔφαγεν، مع نفي الماضي بـ«لم» في العربية الفصحى.
- source_word: οὐδὲ ἔπιεν
  choice: ولم يشرب
  rationale: تربط οὐδὲ الفعل المنفي الثاني بالأول. وتكرار «لم» هو الأسلوب العربي الواضح والطبيعي هنا.
