  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: ar
  text: ولمّا وصل إلى أورشليم، كان يحاول أن ينضمّ إلى التلاميذ[a]، لكنهم جميعًا كانوا يخافون منه، إذ لم يصدّقوا أنه تلميذ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يلتصق بالتلاميذ».'
    reason: بديل معجمي يحفظ الصورة الأقرب في κολλᾶσθαι، أي الالتصاق أو الارتباط الوثيق.
lexical_decisions:
- source_word: Παραγενόμενος
  choice: ولمّا وصل
  rationale: اسم الفاعل الماضي يقدّم الظرف الزمني السابق للفعل الرئيس؛ و«لمّا وصل» تعبير عربي طبيعي يحفظ هذا التسلسل.
- source_word: δὲ
  choice: و
  rationale: أداة ربط سردية خفيفة تدفع الرواية إلى الأمام، ولا يلزم منها تضاد قوي.
- source_word: εἰς Ἰερουσαλήμ
  choice: إلى أورشليم
  rationale: يحفظ دلالة الاتجاه مع اسم المدينة بصياغة عربية مألوفة.
- source_word: ἐπείραζεν
  choice: كان يحاول
  rationale: صيغة الماضي الناقص تدل على محاولة مستمرة أو جارية، لا على التجربة أو الإغراء.
- source_word: κολλᾶσθαι
  choice: أن ينضمّ
  rationale: يفيد الفعل الالتصاق أو الارتباط الوثيق؛ و«ينضمّ» ينقل المعنى الاجتماعي في السياق بوضوح من غير إيحاء بعضوية مؤسسية رسمية.
- source_word: τοῖς μαθηταῖς
  choice: إلى التلاميذ
  rationale: يشير التعريف إلى جماعة التلاميذ المعروفة في أورشليم، ولا تحتاج العربية إلى إضافة تفسيرية.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: لكنهم جميعًا كانوا يخافون منه
  rationale: تؤدي «لكن» التباين السياقي بين محاولته الانضمام وخوفهم، وتحفظ «كانوا يخافون» الجانب الاستمراري للماضي الناقص.
- source_word: μὴ πιστεύοντες
  choice: إذ لم يصدّقوا
  rationale: يحمل اسم الفاعل المنفي معنى سببيًا يفسر خوفهم؛ و«إذ» توضحه طبيعيًا مع إبقاء الصلة موجزة.
- source_word: ὅτι ἐστὶν μαθητής
  choice: أنه تلميذ
  rationale: الجملة الاسمية العربية لا تفرض نقل الحاضر اليوناني إلى زمن ماضٍ صريح، فتحفظ المضمون بلا معالجة زمنية زائدة.
- source_word: μαθητής
  choice: تلميذ
  rationale: هو المقابل الكتابي والعربي المستقر الذي يجمع معنى المتعلم والتابع الملتزم.
theological_decisions:
- issue: طبيعة العلاقة التي حاول شاول إقامتها مع تلاميذ أورشليم
  choice: أن ينضمّ إلى التلاميذ
  alternative: أن يلتصق بالتلاميذ؛ أن يرتبط بهم
  rationale: يصف النص سعي شاول إلى القبول والارتباط بجماعة التلاميذ، ولا يذكر طقسًا كنسيًا أو فئة عضوية رسمية؛ لذلك تتجنب الصياغة إدخال بنى كنسية لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. وُضع الهامش بعد العبارة التي يشرحها مباشرة، واستُخدمت «أورشليم» و«تلميذ» وفق الاصطلاح الكتابي العربي الشائع.
