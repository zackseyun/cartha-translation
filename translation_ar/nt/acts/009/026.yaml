  source_fidelity: 'النص العربي ينقل بدقة تسلسل العبارة اليونانية: الوصول إلى أورشليم، والمحاولة المستمرة للانضمام إلى التلاميذ، وخوفهم الجماعي منه، وسبب ذلك وهو عدم تصديقهم أنه تلميذ. وتحافظ «إذ» على العلاقة السببية التي يؤديها اسم الفاعل المنفي μὴ πιστεύοντες، ولا تضيف تفسيرًا عقائديًا أو مؤسسيًا غير مذكور في النص.'
