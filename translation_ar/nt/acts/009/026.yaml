  terminology: «تلاميذ/تلميذ» مقابل ثابت ودقيق لـ μαθηταῖς/μαθητής في هذا السياق. و«ينضمّ إلى» ينقل المعنى الاجتماعي لـ κολλᾶσθαι من غير الإيحاء بعضوية كنسية رسمية. والحاشية تقدم البديل الحرفي الممكن «يلتصق» في موضعه المناسب.
