  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: ar
  text: وله هنا سلطانٌ من رؤساء الكهنة أن يقيّد جميع الذين يدعون باسمك[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يبتهلون باسمك». التعبير اليوناني اصطلاح كتابي شائع لدعاء شخص أو الابتهال إليه، وغالبًا ما يَرِد في سياق الصلاة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: هنا
  rationale: ظرف مكان يشير في السياق إلى دمشق، و«هنا» هي الصياغة العربية الطبيعية المباشرة.
- source_word: ἐξουσίαν
  choice: سلطان
  rationale: يدل على صلاحية أو تفويض رسمي صادر من رؤساء الكهنة، و«سلطان» يحفظ معنى السلطة المخوَّلة.
- source_word: παρὰ τῶν ἀρχιερέων
  choice: من رؤساء الكهنة
  rationale: تفيد παρά مع المضاف إليه مصدر السلطان، و«رؤساء الكهنة» هو التعبير العربي المألوف عن القيادة الكهنوتية العليا في العهد الجديد.
- source_word: δῆσαι
  choice: أن يقيّد
  rationale: يحفظ الصورة الحرفية للفعل، أي الربط أو التقييد، مع دلالته السياقية على القبض.
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: جميع الذين يدعون
  rationale: اسم الفاعل المعرّف يدل على جماعة من يفعلون ذلك؛ و«يدعون» يحفظ الاصطلاح الكتابي المتعلق بالابتهال والدعاء دون حصره في تفسير واحد.
- source_word: τὸ ὄνομά σου
  choice: باسمك
  rationale: في العربية الكتابية والطبيعية يقال «دعا باسم فلان» للدلالة على التوسل أو الابتهال باسمه؛ وتحفظ الصياغة ذكر الاسم وما يحمله من حضور وسلطان.
theological_decisions:
- issue: دلالة عبارة ἐπικαλουμένους τὸ ὄνομά σου الموجَّهة إلى يسوع
  choice: يدعون باسمك
  alternative: يدعونك؛ يبتهلون باسمك
  rationale: تحفظ العبارة الاصطلاح الكتابي وما فيه من معنى الدعاء والابتهال والولاء، من غير اختزاله إلى مجرد الانتساب إلى يسوع أو توسيعه إلى صياغة عقائدية تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «سلطان» للتفويض الرسمي، و«يقيّد» للمحافظة على صورة الأصل، مع شرح البديل الاصطلاحي في الحاشية.
