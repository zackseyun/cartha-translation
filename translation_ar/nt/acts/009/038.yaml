base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: ar
  text: 'ولأن لُدَّة كانت قريبة من يافا، سمع التلاميذ أن بطرس فيها، فأرسلوا إليه رجلين، وطلبوا منه بإلحاح: «لا تتأخر في المجيء إلينا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تتردد في المجيء إلينا». يمكن أن يدل الفعل على التردد أو التأخر؛ واختير في المتن المعنى الأنسب لهذا الطلب العاجل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: ولأن لُدَّة كانت قريبة من يافا
  rationale: ينقل التركيب المطلق في اليونانية بوصفه خلفية سببية مفهومة من السياق، مع استعمال أسماء الأماكن الشائعة في العربية الكتابية.
- source_word: οἱ μαθηταὶ ἀκούσαντες
  choice: سمع التلاميذ
  rationale: صياغة عربية طبيعية تحافظ على كون السماع سابقًا للإرسال من غير إثقال العبارة بتركيب اسمي.
- source_word: ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: أن بطرس فيها
  rationale: الضمير يعود إلى لُدّة؛ و«فيها» يحافظ على هذا المرجع بوضوح وإيجاز.
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτὸν
  choice: فأرسلوا إليه رجلين
  rationale: ترجمة مباشرة وسلسة للفعل والمفعول ووجهة الإرسال.
- source_word: παρακαλοῦντες
  choice: يلحّان عليه قائلين
  rationale: السياق يدل على طلب جاد وملحّ؛ والمثنى يطابق الرجلين المرسلين، وإضافة «قائلين» تمهّد للاقتباس طبيعيًا.
- source_word: Μὴ ὀκνήσῃς
  choice: لا تتأخر
  rationale: يمكن أن يدل الفعل على التردد أو الإبطاء، وهنا يلائم طلب الحضور العاجل معنى عدم التأخر، مع إثبات البديل في الحاشية.
- source_word: διελθεῖν ἕως ἡμῶν
  choice: في المجيء إلينا
  rationale: ينقل جهة الحركة من منظور المتكلمين بعربية طبيعية، بدل الترجمة الحرفية الثقيلة «العبور حتى إلينا».
