lexical_decisions:
- source_word: εὐθέως
  choice: في الحال
  rationale: تؤدي معنى الفورية بعبارة عربية فصيحة وطبيعية في السياق السردي.
- source_word: ἀπέπεσαν
  choice: سقط
  rationale: ينقل معنى السقوط والانفصال، وتوضح عبارة «من عينيه» جهة الانفصال.
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: من عينيه
  rationale: صياغة عربية طبيعية وأمينة للعلاقة التي تعبّر عنها ἀπό مع المضاف إليه.
- source_word: ὡς λεπίδες
  choice: شيءٌ كالقشور
  rationale: تحفظ أداة التشبيه ὡς ولا تجزم بأن ما سقط كان قشورًا حرفية، مع إبقاء الصورة الحسية في λεπίδες.
- source_word: ἀνέβλεψέν
  choice: فعاد إليه بصره
  rationale: الفعل في سياق الشفاء يدل على استرداد البصر، لا مجرد رفع النظر.
- source_word: τε καὶ
  choice: ثم
  rationale: تربط الأفعال المتعاقبة بسلاسة وتبرز تسلسل الحدث من غير نقل حرفي ثقيل للأداتين.
- source_word: ἀναστὰς
  choice: قام
  rationale: ينقل اسم الفاعل الدال على الفعل السابق للمعمودية بصياغة عربية موجزة وطبيعية.
- source_word: ἐβαπτίσθη
  choice: اعتمد
  rationale: مصطلح عربي كتابي شائع ومحايد نسبيًا للفعل المبني للمجهول، ولا يفرض كيفية بعينها لإجراء المعمودية.
theological_decisions:
- issue: نقل βαπτίζω دون فرض كيفية طائفية للمعمودية
  choice: اعتمد
  alternative: غُطِّس
  rationale: النص يذكر وقوع المعمودية ولا يحدد هنا كيفيتها؛ لذلك يحفظ «اعتمد» الدلالة المعروفة من غير إضافة تحديد طائفي لا يصرح به السياق.
translation_notes:
