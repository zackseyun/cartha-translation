  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: ar
  text: 'فسقط على الأرض، وسمع صوتًا يقول له: «شاول، شاول، لماذا تضطهدني؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: فسقط على الأرض
  rationale: اسم الفاعل اليوناني بصيغة الماضي يدل هنا على فعل ملازم في تسلسل السرد؛ وصيغة «فسقط» طبيعية في العربية وتحفظ ارتباط الحدث بما قبله. و«على الأرض» تؤدي معنى الحركة إلى سطح الأرض في هذا المشهد.
- source_word: ἤκουσεν φωνὴν
  choice: وسمع صوتًا
  rationale: φωνή تعني هنا صوتًا ناطقًا مفهومًا، كما يتضح من الكلام المباشر التالي؛ ولفظ «صوتًا» هو التعبير العربي الطبيعي دون زيادة تعيين هوية المتكلم.
- source_word: λέγουσαν αὐτῷ
  choice: يقول له
  rationale: يحفظ معنى λέγω وبنية العبارة التي تمهد للاقتباس المباشر، بصياغة عربية واضحة.
- source_word: Σαοὺλ Σαούλ
  choice: شاول، شاول
  rationale: نُقل الاسم بصورته العربية المألوفة، مع إبقاء التكرار لما فيه من توكيد ونداء شخصي.
- source_word: τί
  choice: لماذا
  rationale: تأتي τί هنا استعمالًا استفهاميًا عن السبب، ولذلك تؤديها «لماذا» بدقة وطبيعية.
- source_word: με
  choice: ني
  rationale: أُبقي ضمير المتكلم مفعولًا مباشرًا في «تضطهدني»، حفاظًا على الصياغة اللاهوتية المكثفة في النص.
- source_word: διώκεις
  choice: تضطهد
  rationale: الفعل في السياق يدل على الملاحقة العدائية للمؤمنين، و«تضطهد» هو المقابل العربي الدقيق والمألوف. وصيغة المضارع تحفظ دلالة الفعل الجاري.
theological_decisions:
- issue: تحديد المتكلم نفسه مع الذين يهاجمهم شاول
  choice: الإبقاء على العبارة المباشرة «تضطهدني» بلا شرح زائد
  alternative: توسيعها إلى «تضطهد أتباعي» أو «تضطهد شعبي»
  rationale: النص نفسه يجعل الاضطهاد موجَّهًا إلى المتكلم بضمير «ني». وتحفظ الترجمة هذه القوة اللاهوتية والتوتر المقصود من غير أن تستبدل الضمير بتفسير.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم تسلسل سردي طبيعي («فسقط... وسمع») مع الحفاظ على النداء المكرر والاقتباس المباشر، من غير إضافات تفسيرية.
