  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: فعل السقوط، والحركة إلى الأرض، وسماع صوت ناطق، وخطاب شاول المكرر، والسؤال السببي، وضمير المتكلم المباشر، ودلالة الاضطهاد الجارية. وصيغة «فسقط» تحويل عربي طبيعي لاسم الفاعل الظرفي πεσών، ولا تضيف معنى مغايرًا في السياق السردي.'
  naturalness: «فسقط على الأرض، وسمع صوتًا يقول له» فصيحة وواضحة في العربية المعيارية الحديثة، ويتبعها الاقتباس المباشر بسلاسة. النداء المكرر وعلامات التنصيص مناسبان.
