id: ACT.9.23
reference: Acts 9:23
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί, συνεβουλεύσαντο οἱ Ἰουδαῖοι ἀνελεῖν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: ar
  text: ولمّا انقضت أيام كثيرة، تآمر اليهود[a] على قتله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي جماعة من اليهود كانت تعارض شاول في هذا السياق، لا كل يهودي بلا استثناء.
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ولمّا
  rationale: تؤدي معنى الانتقال الزمني مع وصل السرد، من غير إثقال العبارة بترجمة مستقلة لـδέ.
- source_word: ἐπληροῦντο ἡμέραι ἱκαναί
  choice: انقضت أيام كثيرة
  rationale: الفعل المبني للمجهول مع «أيام» تعبير زمني يفيد اكتمال المدة أو مضيها، وἱκαναί هنا بمعنى عدد كبير أو مدة معتبرة.
- source_word: συνεβουλεύσαντο
  choice: تآمر
  rationale: ينقل التشاور المشترك المقترن هنا بقصد عدائي، وهو أدق سياقيًا من «تشاور» المحايدة.
- source_word: οἱ Ἰουδαῖοι
  choice: اليهود
  rationale: يحافظ على اللفظ اليوناني العام من غير تقييده نصيًا بالقادة أو استبداله بـ«اليهوديين»، مع إيضاح نطاقه السياقي في الحاشية.
- source_word: ἀνελεῖν αὐτόν
  choice: على قتله
  rationale: يعبر بوضوح وطبيعية عن قصد إزهاق حياة شاول، من غير إضافة توصيف قانوني أو أخلاقي غير مصرح به في الفعل.
theological_decisions:
- issue: دلالة οἱ Ἰουδαῖοι في سياق عدائي
  choice: اليهود
  alternative: قادة اليهود / اليهوديون
  rationale: أُبقي اللفظ العام كما في المصدر، ولم يُحصر في القادة بلا سند من الآية. وتوضح الحاشية أن المقصود في السياق جماعة معينة عارضت شاول، لا جميع اليهود بلا استثناء.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختير «انقضت أيام كثيرة» لصياغة زمنية طبيعية تحافظ على صورة اكتمال الأيام، و«تآمر» لإظهار التدبير المشترك ذي القصد العدائي.
