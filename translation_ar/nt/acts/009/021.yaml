id: ACT.9.21
reference: Acts 9:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: ar
  text: 'وكان جميع الذين يسمعونه يندهشون ويقولون: «أليس هذا هو الذي كان يفتك في أورشليم بالذين يدعون بهذا الاسم؟ أما جاء إلى هنا لهذا الغرض، ليقتادهم موثَقين إلى رؤساء الكهنة؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξίσταντο
  choice: يندهشون
  rationale: ينقل معنى الدهشة الشديدة المستمرة في صيغة الماضي الناقص، بعبارة عربية طبيعية واضحة.
- source_word: πάντες οἱ ἀκούοντες
  choice: جميع الذين يسمعونه
  rationale: يحافظ على شمول πάντες وعلى دلالة اسم الفاعل، ويُظهر المفعول المفهوم من السياق.
- source_word: πορθήσας
  choice: كان يفتك
  rationale: الفعل أقوى من مجرد الاضطهاد، و«يفتك» يصور الاعتداء المدمر من غير أن يفترض إبادة فعلية للجماعة.
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: الذين يدعون بهذا الاسم
  rationale: يحفظ التعبير الكتابي عن الابتهال إلى الاسم أو الاستناد إليه، مع إبقاء الاسم المشار إليه ضمنيًا كما في اليونانية.
- source_word: εἰς τοῦτο
  choice: لهذا الغرض
  rationale: صياغة عربية طبيعية تفيد القصد المقصود من المجيء.
- source_word: ἐληλύθει
  choice: جاء
  rationale: في السؤال العربي «أما جاء» يؤدي المعنى السابق لوصوله والمطروح بوصفه أمرًا معروفًا، من غير تكلف في نقل صيغة ما قبل الماضي.
- source_word: δεδεμένους
  choice: موثَقين
  rationale: ينقل حالة كونهم مربوطين أو مقيدين دون تخصيص وسيلة التقييد بالسلاسل.
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: ليقتادهم ... إلى رؤساء الكهنة
  rationale: «يقتاد» مناسب لسوق الأسرى، و«إلى» تحافظ على اتجاه الحركة في ἐπί مع النصب.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: المصطلح العربي المألوف للسلطات الكهنوتية العليا بصيغة الجمع.
theological_decisions:
- issue: هل يُصرَّح بأن الاسم هو اسم يسوع؟
  choice: الإبقاء على «بهذا الاسم»
  alternative: باسم يسوع
  rationale: النص اليوناني يترك المرجع ضمنيًا، وهو واضح من السياق؛ والإبقاء عليه يصون القوة البلاغية والتوقير الكامن في التعبير.
- issue: درجة قوة وصف أفعال شاول السابقة
  choice: كان يفتك
  alternative: كان يضطهد
  rationale: πορθέω أشد من الاضطهاد العام، لذلك ينبغي ألا تُخفف حدة اعتداءات شاول في الترجمة.
- issue: بنية الجملة الثانية
  choice: 'صياغتها سؤالًا: «أما جاء...؟»'
  alternative: 'صياغتها خبرًا: «وقد جاء...»'
  rationale: علامة الاستفهام في المصدر تشمل الكلام كله، والسياق الطبيعي يعرض الغرض من مجيئه بوصفه سؤالًا إنكاريًا متصلًا بالسؤال الأول.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدمت «موثَقين» بدل «مقيدين بالسلاسل» لتجنب زيادة غير منصوص عليها، وحُفظت الإشارة الضمنية في «هذا الاسم». لا توجد حواشٍ لازمة لهذه الآية.
