  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: الدهشة المستمرة لدى جميع السامعين، والقول المتكرر، وشدة أفعال شاول السابقة في أورشليم، والإبقاء على «هذا الاسم» دون تسمية تفسيرية، وغرض مجيئه لاقتِيادهم وهم موثَقون إلى رؤساء الكهنة. وصيغة السؤال في الشق الثاني مناسبة للاستفهام اليوناني المتصل.'
  naturalness: الصياغة فصيحة حديثة وواضحة. «وكان جميع الذين يسمعونه يندهشون ويقولون» تؤدي الاستمرار، و«أما جاء إلى هنا لهذا الغرض» سؤال إنكاري طبيعي في هذا السياق. «موثَقين» و«ليقتادهم» ملائمتان للسجل السردي.
  terminology: «رؤساء الكهنة» المقابل العربي المألوف والدقيق لـ ἀρχιερεῖς. ويحفظ «يدعون بهذا الاسم» الاصطلاح الكتابي من غير كشف مرجع الاسم الذي أبقاه اليوناني ضمنيًا. و«كان يفتك» ينقل قوة πορθήσας ولا يخففها إلى مجرد اضطهاد.
