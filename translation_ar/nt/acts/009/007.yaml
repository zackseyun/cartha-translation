id: ACT.9.7
reference: Acts 9:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: ar
  text: أمّا الرجال المسافرون معه فوقفوا عاجزين عن الكلام، يسمعون الصوت[a] لكنهم لا يرون أحدًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني الكلمة اليونانية «الصوت» عمومًا أو «صوت المتكلم». قارن أعمال 22:9.
    reason: بديل معجمي وحفظ للتوتر النصي
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: أمّا الرجال
  rationale: تنقل «الرجال» مباشرة، وتؤدي «أمّا» وظيفة δέ الانتقالية والمقابِلة الخفيفة من غير أن تجعلها ظرفًا زمنيًا.
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: المسافرون معه
  rationale: تفيد συνοδεύω المصاحبة في سفر، وهذه الصياغة عربية طبيعية وتحفظ سياق الرحلة.
- source_word: εἱστήκεισαν
  choice: فوقفوا
  rationale: ينقل الفعل صورة الرجال في وضع الوقوف بإيجاز ملائم للسرد، من غير إضافة أنهم توقفوا عن السير صراحة.
- source_word: ἐνεοί
  choice: عاجزين عن الكلام
  rationale: يدل اللفظ على عدم القدرة على النطق، لا مجرد التزام الصمت؛ وهذه العبارة واضحة وتحفظ أثر الدهشة المحتمل دون التصريح بسبب غير مذكور.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: يسمعون الصوت
  rationale: «الصوت» هو المقابل العربي الطبيعي لـ φωνή، ويمكنه هنا أن يدل على صوت مسموع مع إبقاء مدى اللفظ اليوناني وعدم الجزم بمقدار فهمهم للكلام.
- source_word: μηδένα δὲ θεωροῦντες
  choice: لكنهم لا يرون أحدًا
  rationale: تنقل المقابلة مع μὲν...δέ، وتؤدي θεωρέω وμηδένα بعبارة عربية واضحة وطبيعية.
theological_decisions:
- issue: التوتر الظاهري بين أعمال 9:7 وأعمال 22:9 بشأن ما سمعه رفاق شاول
  choice: إبقاء «الصوت» في المتن مع حاشية تبين المجال الدلالي
  alternative: صياغته بما يعني أنهم سمعوا ضجيجًا فقط، أو الجزم بأنهم سمعوا صوت المتكلم وفهموه
  rationale: φωνή قد تشير إلى صوت عمومًا أو إلى صوت ناطق. وتتيح «الصوت» إبقاء هذا الاحتمال مفتوحًا من غير فرض توفيق تفسيري أو تضخيم التعارض بين الروايتين.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت «عاجزين عن الكلام» بدل «صامتين» للحفاظ على قوة ἐνεοί، ووُضع مؤشر الحاشية بعد «الصوت» لأنه هو موضع البديل المعجمي.
