  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: ar
  text: أَمَّا شَاوُلُ فَكَانَ يَزْدَادُ قُوَّةً أَكْثَرَ فَأَكْثَرَ، وَيُرْبِكُ الْيَهُودَ السَّاكِنِينَ فِي دِمَشْقَ، مُبَرْهِنًا أَنَّ هَذَا هُوَ الْمَسِيحُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الممسوح الموعود.'
    reason: توضيح الدلالة اليهودية المسيانية للقب اليوناني Χριστός التي قد لا يظهر معناها الاشتقاقي للقارئ العربي.
lexical_decisions:
- source_word: μᾶλλον
  choice: أكثر فأكثر
  rationale: تنقل معنى التزايد والتكثيف المستمر في السياق، وترتبط طبيعيًا بأثر ازدياد شاول قوةً في محاوريه.
- source_word: ἐνεδυναμοῦτο
  choice: كان يزداد قوةً
  rationale: تحفظ الدلالة الاستمرارية لصيغة الماضي الناقص، من غير حسم ما إذا كانت القوة نابعة منه أم ممنوحة له من خارج.
- source_word: συνέχυννεν
  choice: يُفحم
  rationale: يناسب سياق المحاجّة، إذ يدل على إرباك الخصوم وإسقاط حججهم، لا على مجرد إحداث التباس ذهني.
- source_word: τοὺς Ἰουδαίους
  choice: اليهود
  rationale: ترجمة مباشرة للجماعة الإثنية الدينية المقصودة، مع تقييدها في النص بالساكنين في دمشق منعًا للتعميم.
- source_word: τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: الساكنين في دمشق
  rationale: صياغة عربية واضحة وطبيعية تحفظ وظيفة العبارة الوصفية المحدِّدة.
- source_word: συμβιβάζων
  choice: مبرهنًا
  rationale: ينقل فعل جمع الأدلة والقرائن للوصول إلى نتيجة وإثباتها في سياق المحاجّة.
- source_word: οὗτός
  choice: هذا
  rationale: يحفظ قوة اسم الإشارة المؤكد بدل اختزاله إلى ضمير، مع بقاء المرجع مفهومًا من السياق.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني، ويحفظ معنى الممسوح المنتظر في السياق اليهودي.
theological_decisions:
- issue: ترجمة ὁ χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» اللقب العربي الكتابي المألوف الذي يشير هنا إلى الممسوح الموعود، بينما «الممسوح» يوضح الاشتقاق لكنه أقل طبيعية كلقب في العربية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أما شاول فـ» لإبراز المقابلة التي تفيدها δέ، مع أفعال مضارعة مسبوقة بـ«كان» لنقل الاستمرار في الماضي. وُضع «أكثر فأكثر» مع «يُفحم» لأن ترتيب اليونانية ودلالتها يسمحان بتعلقه بازدياد قوة شاول أو بتصاعد أثره؛ والصياغة العربية تربطه بالفعل التالي بوضوح مع بقاء معنى النمو العام حاضرًا.
