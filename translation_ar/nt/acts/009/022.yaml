  to: أَمَّا شَاوُلُ فَكَانَ يَزْدَادُ قُوَّةً أَكْثَرَ فَأَكْثَرَ، وَيُرْبِكُ الْيَهُودَ السَّاكِنِينَ فِي دِمَشْقَ، مُبَرْهِنًا أَنَّ هَذَا هُوَ الْمَسِيحُ.[a]
