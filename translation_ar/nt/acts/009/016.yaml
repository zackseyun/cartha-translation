  text: ἐγὼ γὰρ ὑποδείξω αὐτῷ ὅσα δεῖ αὐτὸν ὑπὲρ τοῦ ὀνόματός μου παθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: ar
  text: فأنا سأُريه كم ينبغي له أن يتألّم من أجل اسمي[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في سبيل اسمي»، أو: «نيابةً عن اسمي».'
    reason: بدائل معجمية لحرف الجر ὑπὲρ، إذ قد يدل على السبب أو الغاية أو النيابة.
lexical_decisions:
- source_word: ἐγὼ
  choice: أنا
  rationale: أُبقي الضمير المنفصل لإبراز التأكيد الموجود في اليونانية، وصيغ في العربية ضمن «فأنا» بصورة طبيعية.
- source_word: γὰρ
  choice: فـ
  rationale: تفيد تعليل الكلام السابق، والفاء هنا تربط الجملة بسياقها بوضوح وإيجاز.
- source_word: ὑποδείξω
  choice: سأُريه
  rationale: تنقل معنى الإظهار أو التعريف مباشرة، وهي صياغة عربية طبيعية مع المفعول غير المباشر.
- source_word: ὅσα
  choice: كم
  rationale: تعبّر في هذا التركيب عن مقدار الألم، لا عن تعداد أشياء منفصلة.
- source_word: δεῖ
  choice: ينبغي له أن
  rationale: تحفظ معنى الضرورة من غير أن تحدد صراحةً هل هي قدرية أم تدبيرية أم من نوع آخر.
- source_word: ὑπὲρ
  choice: من أجل
  rationale: تدل هنا على السبب أو الغاية المرتبطة بالاسم، وتحفظ الحاشية احتمال معنى النيابة.
- source_word: τοῦ ὀνόματός μου
  choice: اسمي
  rationale: يحافظ التعبير الحرفي على غنى مفهوم «الاسم» بما يشمله من الشخص والسلطان والانتساب العلني إليه.
- source_word: παθεῖν
  choice: يتألّم
  rationale: مقابل عربي واضح وطبيعي للفعل الدال على معاناة الألم.
theological_decisions:
- issue: طبيعة الضرورة التي تعبّر عنها δεῖ
  choice: ينبغي له أن
  alternative: لا بدّ له أن / مقدَّر له أن
  rationale: الصياغة المختارة تثبت الضرورة من غير أن تستورد إلى النص تحديدًا أقوى بشأن القضاء أو التعيين مما تصرّح به اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «فأنا» لحفظ الربط والتوكيد، و«كم ينبغي له أن يتألّم» لنقل مقدار المعاناة والضرورة دون حسم زائد لطبيعتها.
