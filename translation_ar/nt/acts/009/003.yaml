  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: ar
  text: وبينما كان مسافرًا، حدث أنه اقترب من دمشق، وفجأة أبرق حوله نور من السماء[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من الجو». قد تعني اللفظة اليونانية οὐρανός «السماء» أو «الجو»، وإن كان السياق هنا يرجّح دلالة السماء بوصفها مصدرًا إلهيًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: وبينما كان في الطريق
  rationale: تفيد صيغة المصدر المعرّف مع ἐν وقوع الفعل في الوقت نفسه؛ والصياغة العربية طبيعية وتحفظ الانتقال السردي الخفيف الذي تؤديه δέ دون إضافة ظرف مثل «الآن».
- source_word: ἐγένετο αὐτὸν ἐγγίζειν
  choice: حدث أنه اقترب
  rationale: تحفظ «حدث» العلامة السردية ἐγένετο، وتؤدي جملة المصدر بعده بعربية واضحة؛ و«اقترب» تعبّر عن الدنو من المدينة دون أن توحي بدخولها.
- source_word: τῇ Δαμασκῷ
  choice: من دمشق
  rationale: المجرور باللام مع ἐγγίζω يدل على الموضع الذي يُقترب منه، والتعبير العربي المألوف هو «اقترب من دمشق».
- source_word: ἐξαίφνης τε
  choice: وفجأة
  rationale: تنقل الواو صلة τε الخفيفة بما سبق، وتنقل «فجأة» مباغتة الحدث.
- source_word: περιήστραψεν
  choice: أبرق حوله
  rationale: الفعل يدل على لمعان أو وميض يحيط بالشخص؛ و«أبرق حوله» موجزة وتحفظ عنصر المفاجأة والإحاطة.
- source_word: φῶς
  choice: نور
  rationale: «نور» مقابل عربي طبيعي ودلالي لـφῶς في سياق ظهور سماوي، من غير إضافة وصف غير موجود في النص.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: «السماء» تؤدي οὐρανός مباشرة، وتسمح في العربية بدلالة العلو السماوي والمصدر الإلهي وفق السياق، مع بيان البديل الممكن في الحاشية.
theological_decisions:
- issue: دلالة οὐρανός في سياق الظهور
  choice: من السماء
  alternative: من العلو
  rationale: «السماء» هي المقابل العربي المباشر والأشيع، وتحفظ الإيحاء بالمصدر الإلهي من غير أن تحصر اللفظة في الجو المادي أو تضيف تفسيرًا عقائديًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، ببناء سردي طبيعي. وُضع مؤشر الحاشية بعد العبارة التي يشرحها، وحُفظت مفاجأة الحدث وإحاطة النور بشاول دون توسع تفسيري.
