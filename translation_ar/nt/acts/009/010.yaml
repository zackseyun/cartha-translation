  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: ar
  text: 'وكان في دمشق تلميذ اسمه حنانيا، فقال له الرب في رؤيا: «يا حنانيا.» فقال: «ها أنا ذا، يا رب.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: وكان
  rationale: تفتتح العبارة مشهدًا وشخصية جديدين، والواو تنقل قوة δέ الانتقالية الخفيفة من غير إضافة معنى زمني صريح.
- source_word: τις μαθητὴς
  choice: تلميذ
  rationale: تفيد τις التنكير، وهو متحقق في العربية بتنكير «تلميذ»، فلا حاجة إلى «تلميذ ما» أو «تلميذ معين».
- source_word: ἐν Δαμασκῷ
  choice: في دمشق
  rationale: ترجمة مكانية مباشرة وطبيعية.
- source_word: ὀνόματι Ἁνανίας
  choice: اسمه حنانيا
  rationale: تعبير عربي موجز وطبيعي يؤدي اصطلاح التسمية في اليونانية.
- source_word: εἶπεν πρὸς αὐτόν
  choice: فقال له
  rationale: ينقل فعل القول مع جهة الخطاب بوضوح، وتلائم الفاء تتابع السرد العربي.
- source_word: ἐν ὁράματι
  choice: في رؤيا
  rationale: يبين الهيئة التي خاطب الرب بها حنانيا، ويحافظ على التعبير الاسمي الموجز في الأصل.
- source_word: ὁ κύριος
  choice: الرب
  rationale: يحافظ على أداة التعريف وعلى اللقب κύριος، الذي يشير في سياق أعمال 9 إلى الرب القائم.
- source_word: Ἁνανία
  choice: يا حنانيا
  rationale: حالة النداء اليونانية تُعبَّر عنها طبيعيًا في العربية بأداة النداء «يا».
- source_word: Ἰδοὺ ἐγώ
  choice: ها أنا ذا
  rationale: صيغة عربية مألوفة للاستجابة بالحضور والانتباه والاستعداد، وتحفظ النبرة الاصطلاحية للتعبير.
- source_word: κύριε
  choice: يا رب
  rationale: نداء موجَّه إلى المتكلم الإلهي في الرؤيا؛ لذلك «رب» أنسب من «سيدي»، مع إظهار النداء بأداة «يا».
theological_decisions:
- issue: مرجع ὁ κύριος وκύριε في الرؤيا
  choice: «الرب» و«يا رب»، بما يشير في السياق إلى يسوع القائم
  alternative: فهم اللفظ على أنه خطاب إلهي عام أو ترجمة κύριε بـ«يا سيدي»
  rationale: السياق اللاحق في أعمال 9 يحدد المتكلم بوصفه الرب الذي يوجّه حنانيا بشأن شاول. تحافظ الترجمة على القوة المسيحانية للقب من غير أن تضيف اسم «يسوع» إلى نص هذه الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدمت «رؤيا» لا «رؤية» للدلالة على الخبرة الكشفية، وحُفظ الإيقاع الحواري الموجز في النداء والجواب.
