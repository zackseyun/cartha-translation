lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς
  choice: وطلب منه رسائل
  rationale: ينقل فعل الطلب مع بيان الشخص الذي طُلبت منه الرسائل، من غير إضافة صفة «تفويض» التي يفهمها السياق ولا يصرّح بها الاسم اليوناني.
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: إلى المجامع في دمشق
  rationale: صياغة عربية طبيعية توضّح أن الرسائل موجّهة إلى مجامع تقع في دمشق.
- source_word: ὅπως ἐάν
  choice: حتى إذا
  rationale: تحفظ غرض الطلب مع بقاء العثور أمرًا احتماليًا، وتأتي سليمة في العربية ضمن هذا السياق.
- source_word: τινας
  choice: أناسًا
  rationale: تعبير عربي واضح عن جمع غير معيّن، تلائمه الجملة الشرطية.
- source_word: τῆς ὁδοῦ ὄντας
  choice: من أهل الطريق
  rationale: تحفظ «الطريق» بوصفه تسمية مبكرة للجماعة المسيحية، وتعبّر «من أهل» طبيعيًا عن الانتساب من غير تحويل العبارة إلى تفسير مطوّل.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: رجالًا ونساءً
  rationale: تحفظ الذكر الصريح لكلا الجنسين كما في اليونانية.
- source_word: δεδεμένους
  choice: موثَقين
  rationale: ينقل حالة كونهم مربوطين أو مقيّدين من غير تحديد وسيلة الوثاق، إذ لا يذكر النص سلاسل على وجه الخصوص.
- source_word: ἀγάγῃ εἰς Ἰερουσαλήμ
  choice: ساقهم ... إلى أورشليم
  rationale: «ساقهم» ملائمة لاقتِياد المقبوض عليهم قسرًا إلى وجهة، وتحفظ دلالة الحركة في ἄγω.
theological_decisions:
- issue: دلالة τῆς ὁδοῦ بوصفها تسمية للجماعة المسيحية الأولى
  choice: أهل الطريق
  alternative: أتباع الطريق؛ المنتمون إلى الطريق
  rationale: تبقي «الطريق» تسمية تاريخية قائمة بذاتها وتحفظ معنى الانتساب، من غير إدخال تفسير عقائدي أوسع في المتن.
- issue: التصريح بالرجال والنساء
  choice: رجالًا ونساءً
  alternative: أيّ شخص
  rationale: يحافظ على تأكيد النص اليوناني أن الاعتقال المقصود يشمل الرجال والنساء معًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «المجامع» للمؤسسات اليهودية، و«أورشليم» وفق الصيغة الكتابية العربية الشائعة. وُضع رمز الحاشية مباشرة بعد العبارة التي يشرحها.
