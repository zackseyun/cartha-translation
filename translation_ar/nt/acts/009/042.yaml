  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: ar
  text: وصار ذلك معروفًا في يافا كلها، وآمن كثيرون بالرب.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: انتشر خبر ذلك
  rationale: يؤدي معنى التركيب غير الشخصي، أي إن الأمر صار معروفًا، بصياغة عربية طبيعية من غير تعيين فاعل للنشر.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد، والواو أنسب مقابل عربي موجز هنا.
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: في يافا كلها
  rationale: ينقل معنى الانتشار في أنحاء المدينة كلها مع الحفاظ على شمول ὅλης.
- source_word: Ἰόππης
  choice: يافا
  rationale: الاسم العربي الشائع تاريخيًا وحديثًا للمدينة التي يسميها النص اليوناني Ἰόππη.
- source_word: ἐπίστευσαν πολλοὶ
  choice: آمن كثيرون
  rationale: ترجمة مباشرة وطبيعية للفعل والصفة الاسمية، ويشير الماضي في السياق إلى وقوع الإيمان نتيجة الخبر.
- source_word: ἐπὶ τὸν κύριον
  choice: بالرب
  rationale: الباء مع آمن هي الصياغة العربية المألوفة للدلالة على موضوع الإيمان والثقة، وتقابل معنى ἐπί مع المفعول به هنا.
- source_word: κύριον
  choice: الرب
  rationale: يحفظ اللقب بما له من دلالة تكريمية ولاهوتية في سفر الأعمال، من غير تخفيفه إلى «السيد» أو تفسيره بأكثر مما يقوله النص.
theological_decisions:
- issue: ترجمة πιστεύω + ἐπὶ τὸν κύριον
  choice: آمن كثيرون بالرب
  alternative: وضع كثيرون ثقتهم في الرب
  rationale: «آمن بالرب» تعبير عربي واضح يحفظ معنى الإيمان الموجَّه إلى الرب من غير إضافة صياغة عقائدية أضيق.
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ الثقل المسيحاني واللاهوتي للقب في سياق أعمال الرسل، بينما قد تُضعف «السيد» هذا البعد.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم «فـ» لبيان تعاقب النتيجة سرديًا من غير المبالغة في تقرير علاقة سببية صريحة، وحُفظ الإيجاز الأصلي.
