source:
  edition: SBLGNT
  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: ar
  text: وبينما كان بطرس يجتاز في جميع الأنحاء، نزل أيضًا إلى القديسين المقيمين في لُدَّة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερχόμενον διὰ πάντων
  choice: يجتاز في جميع الأنحاء
  rationale: الضمير الجمعي في «جميع» لا يصرّح بمرجعه، ويرجح في السياق أنه يشير إلى المناطق أو الجماعات التي كان بطرس يطوف بها؛ صيغت العبارة طبيعيًا بالعربية من غير حصرها في أشخاص.
- source_word: κατελθεῖν
  choice: نزل
  rationale: يحافظ على الدلالة المكانية للفعل اليوناني وعلى أسلوب السرد البسيط.
- source_word: τοὺς ἁγίους
  choice: القديسين
  rationale: المقابل العربي المألوف للفظ الذي يصف جماعة المؤمنين المكرسين لله، من غير إضافة تفسير طائفي.
- source_word: τοὺς κατοικοῦντας
  choice: المقيمين
  rationale: ينقل معنى السكن أو الإقامة بصياغة عربية موجزة وطبيعية.
- source_word: Λύδδα
  choice: لُدَّة
  rationale: نقل صوتي للاسم الجغرافي اليوناني مع ضبطه بما يوضح النطق.
theological_decisions:
- issue: مرجع «διὰ πάντων»
  choice: جميع الأنحاء
  alternative: جميعهم
  rationale: النص اليوناني موجز ويمكن أن يُفهم حرفيًا «عبر الجميع»، لكن السياق السابق عن الكنيسة في مناطق متعددة يجعل الإشارة المكانية أرجح؛ بقيت الصياغة عامة ولم تُسمِّ مدنًا أو كنائس بعينها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُعمل «وبينما» لتمثيل البناء الظرفي واستمرار السرد، من دون إدخال ظرف زمان مثل «الآن» لا يقابله لفظ صريح في المصدر.
