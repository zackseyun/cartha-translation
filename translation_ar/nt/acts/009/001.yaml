  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: ar
  text: أَمَّا شَاوُلُ فَكَانَ لَا يَزَالُ يَنْفُثُ تَهَدُّدًا وَقَتْلًا[a] عَلَى تَلَامِيذِ الرَّبِّ، فَذَهَبَ إِلَى رَئِيسِ الْكَهَنَةِ.
