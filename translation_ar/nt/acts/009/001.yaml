    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: تستأنف السرد مع تحوّل خفيف إلى شاول، وتؤدي معنى الربط والمقابلة اللطيفة بصورة عربية طبيعية.
- source_word: ἔτι
  choice: لَا يَزَالُ
  rationale: تفيد استمرار حالة شاول العدائية من السياق السابق.
- source_word: ἐμπνέων
  choice: يَنْفُثُ
  rationale: يحفظ الصورة الحية التي تجعل التهديد والقتل كأنهما النَّفَس الصادر منه، وهو تعبير عربي فصيح وطبيعي.
- source_word: ἀπειλῆς
  choice: تَهَدُّدًا
  rationale: المفرد العربي المصدرِي يلائم صيغة المفرد اليونانية ويعبّر بوضوح عن السلوك العدائي المستمر.
- source_word: φόνου
  choice: قَتْلًا
  rationale: اللفظ اليوناني يمكن أن يدل على القتل أو الاغتيال؛ و«قتلًا» يحفظ اتساع الدلالة من غير حسم زائد، مع بيان البديل في الحاشية.
- source_word: εἰς τοὺς μαθητὰς
  choice: عَلَى تَلَامِيذِ
  rationale: «على» تنقل اتجاه العداء نحو التلاميذ في تركيب عربي مألوف مع التهديد.
- source_word: μαθητὰς
  choice: تَلَامِيذِ
  rationale: هو المصطلح العربي المعياري والدقيق لأتباع الرب المتعلمين منه.
- source_word: τοῦ κυρίου
  choice: الرَّبِّ
  rationale: ينقل لقب κύριος بصيغته الكتابية العربية المعروفة، والمضاف إليه يصف التلاميذ بأنهم للرب.
- source_word: προσελθὼν
  choice: فَذَهَبَ إِلَى
  rationale: ينقل اقترابه من رئيس الكهنة بحركة واضحة وطبيعية، ويلائم انتهاء الآية عند هذه العبارة مع بقاء تعلق الغرض بما يأتي بعدها.
- source_word: τῷ ἀρχιερεῖ
  choice: إِلَى رَئِيسِ الْكَهَنَةِ
  rationale: الصياغة العربية المعيارية لهذا المنصب في صيغة المفرد.
theological_decisions:
- issue: ترجمة κύριος في τοῦ κυρίου
  choice: الرَّبِّ
  alternative: السَّيِّدِ
  rationale: «الرب» هو المقابل الكتابي العربي المألوف، ويلائم استعمال لوقا–أعمال الرسل ليسوع في هذا السياق من غير إدخال تفسير طائفي.
- issue: القيمة الأخلاقية للفظ φόνος
  choice: قَتْلًا
  alternative: اغْتِيَالًا
  rationale: اختيار «قتلًا» يبقي المجال الدلالي الأصلي مفتوحًا ولا يفرض مسبقًا توصيفًا قانونيًا أو كيفية مخصوصة للقتل؛ وتُذكر قوة البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية كريمة. استُخدم «ينفث» للمحافظة على استعارة التنفس الحية، مع تجنّب تركيب حرفي غريب. ضُبط النص كاملًا بالشكل لتيسير القراءة والنطق.
