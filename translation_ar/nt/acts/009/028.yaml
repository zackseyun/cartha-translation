  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: ar
  text: وكان معهم في أورشليم، يدخل ويخرج، ويتكلم بجرأة باسم الرب.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: كان معهم
  rationale: يحفظ دلالة الماضي الناقص على استمرار مصاحبته لهم، من غير إضافة معنى الإقامة الذي قد يفيده «مكث».
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: يدخل ويخرج
  rationale: ينقل التعبير المزدوج وصيغته التكرارية بصياغة عربية طبيعية، ويدل في السياق على حرية الحركة والمخالطة.
- source_word: εἰς Ἰερουσαλήμ
  choice: في أورشليم
  rationale: تُفهم εἰς هنا دالة على نطاق النشاط مع تعبير الدخول والخروج؛ و«في أورشليم» تتجنب الإيحاء بأنه كان يدخل المدينة نفسها مرارًا.
- source_word: παρρησιαζόμενος
  choice: يتكلم بجرأة
  rationale: يجمع بين الجهر بالكلام والشجاعة فيه، وهو معنى الفعل في سياق سفر الأعمال.
- source_word: ἐν τῷ ὀνόματι
  choice: باسم
  rationale: يحفظ التعبير الكتابي وما قد يتضمنه من سلطة وتمثيل وإقرار، من غير حصره في معنى واحد.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: ترجمة اللقب كما ورد في اليونانية من غير استبداله باسم الموصوف به في السياق.
theological_decisions:
- issue: مرجع لقب «الرب»
  choice: الإبقاء على «الرب» في المتن، مع كون يسوع هو المرجع المفهوم من السياق.
  alternative: التصريح باسم «يسوع».
  rationale: النص اليوناني يقرأ κυρίου لا Ἰησοῦ؛ لذا يحفظ النص اللقب وما له من دلالة في لوقا وأعمال الرسل، ولا يحسمه باستبداله باسم صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. اختيرت صياغة قريبة من بنية الأصل مع سلاسة عربية، ولا حاجة إلى حاشية لأن مواضع الاحتمال محفوظة في المتن من غير غموض مضلل.
