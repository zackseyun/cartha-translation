    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: للوقت
  rationale: ينقل معنى المبادرة الفورية بعبارة عربية فصيحة موجزة تلائم السرد.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: في المجامع
  rationale: ترجمة مكانية مباشرة تحفظ صيغة الجمع، وتشير إلى المجامع اليهودية التي جرى فيها الإعلان.
- source_word: ἐκήρυσσεν
  choice: أخذ ينادي
  rationale: ينقل معنى الإعلان العلني في κηρύσσω، وتفيد صيغة «أخذ» بدء الفعل في هذا السياق، مع إبقاء دلالة الاستمرار الممكنة في الماضي الناقص.
- source_word: τὸν Ἰησοῦν
  choice: بأن يسوع
  rationale: صيغت العبارة عربيًا مع جملة المحتوى التالية لتجنب التركيب غير الطبيعي «ينادي يسوع»، مع الحفاظ على أن يسوع هو موضوع الإعلان.
- source_word: ὅτι οὗτός ἐστιν
  choice: بأن يسوع هو
  rationale: تجعل هوية المشار إليه واضحة وطبيعية بالعربية؛ وضمير الفصل «هو» يحمل قدرًا من التوكيد الذي في اسم الإشارة οὗτός دون عبارة ثقيلة مثل «هذا هو».
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ابن الله
  rationale: الترجمة العربية المباشرة والمألوفة للقب المسيحاني، من غير اختزال أو توسع تفسيري.
theological_decisions:
- issue: اللقب المسيحاني في إعلان شاول
  choice: ابن الله
  alternative: ابنٌ لله
  rationale: يحفظ التعبير اليوناني المحدد ὁ υἱὸς τοῦ θεοῦ بوصفه لقبًا وتعريفًا، ولا يحوله إلى وصف غير محدد.
translation_notes:
  register: لغة عربية معيارية واضحة ومهيبة. استُعمل «المجامع» بالمعنى اليهودي المعروف في السياق، و«ينادي» لإبراز الإعلان العلني لا الوعظ الكنسي بمفهومه اللاحق.
