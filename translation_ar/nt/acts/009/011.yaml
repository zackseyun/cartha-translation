    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: الرب
  rationale: الترجمة العربية المعيارية للقب κύριος، وتحفظ صياغة الآية من غير إضافة اسم يسوع، مع أن السياق يبيّن هوية المتكلم.
- source_word: Ἀναστὰς πορεύθητι
  choice: قُمْ واذهب
  rationale: تنقل اسم الفاعل المستعمل مع فعل الأمر بصياغة عربية طبيعية ومباشرة.
- source_word: ῥύμην
  choice: الزقاق
  rationale: تدل الكلمة على طريق أو شارع داخل المدينة، و«الزقاق» قريب من دلالتها المكانية من غير أن يوحي بطريق خارجها.
- source_word: τὴν καλουμένην Εὐθεῖαν
  choice: الذي يُدعى المستقيم
  rationale: تحفظ تركيب التسمية وتتعامل مع Εὐθεῖαν بوصفه اسم الزقاق.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: في بيت يهوذا
  rationale: صياغة عربية واضحة وقريبة من حرف الجر اليوناني والبنية الأصلية.
- source_word: ζήτησον
  choice: اطلب
  rationale: تفيد البحث عن الشخص أو السؤال عنه، ولا تفترض مسبقًا العثور عليه كما قد تفعل «اعثر».
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: شاولَ الطرسوسيَّ
  rationale: «الطرسوسي» ينقل صفة الأصل Ταρσέα بإيجاز طبيعي؛ وتوضح الحاشية البديل الأكثر تفسيرًا.
- source_word: ἰδοὺ γὰρ
  choice: فهوذا
  rationale: الفاء تنقل وظيفة γάρ التعليلية، و«هوذا» تحفظ وظيفة ἰδού في لفت الانتباه.
- source_word: προσεύχεται
  choice: هو يصلّي
  rationale: ينقل المضارع نشاط شاول الجاري في تلك اللحظة، ويبرز الضمير بعد «هوذا» على نحو عربي سليم.
theological_decisions:
- issue: مرجع κύριος
  choice: الرب
  alternative: الرب يسوع
  rationale: ورد في هذه الجملة لقب κύριος وحده؛ لذلك تُحفظ صياغة النص ولا يُضاف اسم «يسوع»، مع أن السياق المباشر يحدد المتكلم.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. اختير «قُمْ واذهب» للأمر المباشر، و«فهوذا» للمحافظة على لفت الانتباه والتعليل في ἰδοὺ γὰρ. أُبقي اسم الزقاق «المستقيم» معرفًا ليتضح أنه اسم علم.
