translation:
  language: ar
  text: 'فقال له الرب: «قُمْ واذهب إلى الشارع الذي يُدعى المستقيم، واطلب في بيت يهوذا رجلًا اسمه شاول، من طرسوس[a]، فهوذا يصلّي».'
