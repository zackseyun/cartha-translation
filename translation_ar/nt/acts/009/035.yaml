    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: رآه
  rationale: الفعل هنا يدل بصورة طبيعية على الرؤية المباشرة؛ أي إن السكان رأوا أينياس بعد شفائه.
- source_word: πάντες οἱ κατοικοῦντες
  choice: جميع الساكنين
  rationale: اسم الفاعل المعرّف مستعمل استعمال الاسم، وهذه الصياغة تحفظ معنى الإقامة وتأتي عربية واضحة.
- source_word: Λύδδα
  choice: لِدَّة
  rationale: الصيغة العربية المعروفة للاسم الجغرافي القديم.
- source_word: τὸν Σαρῶνα
  choice: سهل شارون
  rationale: يشير الاسم إلى إقليم شارون الساحلي أو سهله؛ وإظهار «سهل» يوضح المرجع الجغرافي الطبيعي في العربية، مع إثبات البديل الأقرب إلى اللفظ في الحاشية.
- source_word: οἵτινες
  choice: فـ
  rationale: تربط الفاء رؤية المعجزة باستجابة الجماعة ربطًا سرديًا طبيعيًا، من غير المبالغة في دلالة الضمير الموصول.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: رجعوا إلى الرب
  rationale: «رجعوا إلى» تعبير عربي طبيعي للفعل ἐπιστρέφω مع اتجاهه نحو الرب، ويحفظ احتمال معنى الرجوع أو التحول دون استعمال مصطلح عقائدي أضيق؛ وتوضح الحاشية البديل.
- source_word: κύριον
  choice: الرب
  rationale: ينقل اللقب اليوناني مباشرة من غير إضافة «يسوع»، التي لا ترد صراحة في نص الآية.
theological_decisions:
- issue: مرجع لقب «الرب»
  choice: الرب
  alternative: الرب يسوع
  rationale: يرجح السياق أن المقصود هو يسوع القائم، لكن اليونانية تقول «الرب» فقط، لذلك لم تُضف كلمات تفسيرية إلى المتن.
- issue: دلالة ἐπέστρεψαν
  choice: رجعوا إلى الرب
  alternative: تحولوا إلى الرب؛ آمنوا بالرب
  rationale: يحفظ «رجعوا إلى» الصورة الاتجاهية واحتمال التوبة والتحول، من غير حسم ما إذا كان الكلام يفترض انتماءً سابقًا أو يستخدم اصطلاحًا عقائديًا تقنيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «لِدَّة» بوصفه الاسم العربي المعروف، و«سهل شارون» لتوضيح أن الاسم يدل على إقليم جغرافي. وُضعت علامتا الحاشيتين في المتن، وحُفظت مرونة دلالة فعل الرجوع إلى الرب.
