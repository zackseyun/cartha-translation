  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: ar
  text: ورآه جميعُ الساكنين في لِدَّة وشارون[a]، فتحوّلوا إلى الرب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سهل شارون» أو «منطقة شارون».'
    reason: lexical_alternative
  - marker: b
