lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: أداة استدراك تنقل الكلام من سؤال شاول إلى الأمر الموجَّه إليه؛ و«بل» موجزة وطبيعية في هذا السياق.
- source_word: ἀνάστηθι
  choice: قُمْ
  rationale: فعل أمر يدل هنا على النهوض بعد السقوط على الأرض، و«قُمْ» هو التعبير العربي المباشر والطبيعي.
- source_word: εἴσελθε
  choice: ادخل
  rationale: فعل أمر يفيد الدخول، وقد نُقل بصيغة عربية واضحة ومباشرة.
- source_word: εἰς τὴν πόλιν
  choice: المدينة
  rationale: يتعدى الفعل العربي «ادخل» مباشرة إلى المكان، فلا حاجة إلى إظهار حرف الجر اليوناني في العربية.
- source_word: λαληθήσεταί σοι
  choice: سيُقال لك
  rationale: يحافظ المبني للمجهول على عدم تعيين المتكلم في النص اليوناني، مع صياغة عربية طبيعية.
- source_word: ὅ τί
  choice: ما
  rationale: تؤدي «ما» بوضوح وظيفة التعبير الموصول الذي يقدّم مضمون ما سيُقال.
- source_word: σε δεῖ ποιεῖν
  choice: ما يجب عليك أن تفعله
  rationale: تنقل «يجب» قوة الضرورة أو الإلزام في δεῖ من غير أن تحدد مصدر هذه الضرورة بما يتجاوز النص.
theological_decisions:
- issue: قوة δεῖ في سياق التوجيه الإلهي
  choice: يجب
  alternative: يلزم / ينبغي
  rationale: تحفظ «يجب» قوة الضرورة التي تحملها الكلمة في سفر الأعمال، من غير حسم ما إذا كانت الضرورة تعني تكليفًا مباشرًا أو مقتضى القصد الإلهي بأكثر مما يقوله النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ المبني للمجهول في «سيُقال لك» لإبقاء الفاعل غير مصرّح به كما في الأصل، ووُضع مؤشر الحاشية بعد الجملة التي تشرحها.
