  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: ar
  text: بل قُمْ وادخل المدينة، وسيُقال لك ما يجب عليك أن تفعله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أقرب إلى اليونانية: «وسيُقال لك ما يلزمك أن تفعله».'
