  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حُفظت بنية الجملتين والتباين والإضافة ودلالة المراقبة المستمرة، مع تجنب تعيين فاعل لانكشاف المؤامرة لا يذكره النص اليوناني. وُضع مؤشر الحاشية بعد «الأبواب» لأنه اللفظ الذي تشرحه الحاشية.
