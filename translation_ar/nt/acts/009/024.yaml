  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: ar
  text: لكن مؤامرتهم انكشفت لشاول. وكانوا أيضًا يراقبون الأبواب[a] ليلًا ونهارًا لكي يقتلوه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي أبواب المدينة؛ فاليونانية تقول حرفيًا: «الأبواب»، والمدينة مفهومة من السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη
  choice: انكشفت
  rationale: ينقل المبني للمجهول ومعنى وصول خبر المؤامرة إلى شاول بصياغة عربية طبيعية، من غير تعيين من أخبره بها.
- source_word: ἐπιβουλή
  choice: مؤامرتهم
  rationale: تدل الكلمة على تدبير عدائي خفي، ويتضح من ختام الآية أن غايته قتل شاول.
- source_word: παρετηροῦντο
  choice: كانوا يراقبون
  rationale: يحافظ تركيب «كانوا يراقبون» على دلالة الاستمرار في صيغة الماضي الناقص، ويركز على المراقبة لا مجرد الحراسة.
- source_word: πύλας
  choice: الأبواب
  rationale: ترجمة مباشرة للجمع، وأبواب المدينة مفهومة من سياق دمشق؛ أُبقي التوضيح في الحاشية.
- source_word: ἡμέρας τε καὶ νυκτός
  choice: ليلًا ونهارًا
  rationale: تعبير عربي مألوف يفيد استمرار المراقبة في الفترتين، مع تقديم «ليلًا» لسلامة الإيقاع العربي من دون تغيير المعنى.
- source_word: ὅπως
  choice: لكي
  rationale: تؤدي بوضوح معنى الغاية المقصودة.
- source_word: ἀνέλωσιν
  choice: يقتلوه
  rationale: هذا هو المعنى المباشر للفعل في سياق التدبير للتخلص من شاول.
- source_word: δὲ
  choice: لكن
  rationale: تنقل التحول المقابل من تدبيرهم للمؤامرة إلى انكشافها لشاول.
- source_word: καὶ
  choice: أيضًا
  rationale: 'تحفظ القوة الإضافية: لم يكتفوا بالتآمر، بل راقبوا الأبواب كذلك.'
theological_decisions: []
