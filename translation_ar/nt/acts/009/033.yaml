  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: ar
  text: ووجد هناك رجلًا اسمه أينياس، كان راقدًا على فراش[a] منذ ثماني سنوات، وكان مشلولًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على حصير» أو «على فراش بسيط».'
    reason: لفظة κραβάττος تدل على فراش متواضع أو حصير يُضطجع عليه، ولا يلزم أن تعني سريرًا مرتفعًا.
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: ووجد هناك
  rationale: ينقل الاستمرار السردي الذي تؤديه δέ، مع معنى الفعل والمكان، بصياغة عربية موجزة وطبيعية.
- source_word: ἄνθρωπόν τινα
  choice: رجلًا
  rationale: تدل العبارة على رجل معيّن لم يسبق التعريف به؛ والتنكير في العربية يؤدي هذا المعنى طبيعيًا من غير حاجة إلى إضافة «معيّنًا».
- source_word: ὀνόματι Αἰνέαν
  choice: اسمه أينياس
  rationale: صياغة عربية مألوفة للتعريف بالاسم، مع نقل الاسم اليوناني صوتيًا.
- source_word: ἐξ ἐτῶν ὀκτώ
  choice: منذ ثماني سنوات
  rationale: تفيد العبارة مدة حالة مستمرة بلغت ثماني سنوات، و«منذ» تلائم السياق العربي مع الفعل «كان راقدًا».
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: كان راقدًا على فراش
  rationale: يحافظ على الصورة الملموسة في اليونانية بدل اختزالها كليًا في تعبير «طريح الفراش»، مع بيان نوع الفراش المحتمل في الحاشية.
- source_word: ὃς ἦν παραλελυμένος
  choice: وكان مشلولًا
  rationale: ينقل بوضوح الحالة المستمرة التي يصفها اسم المفعول اليوناني، من غير إضافة علاقة سببية غير مصرّح بها.
