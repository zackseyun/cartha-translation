  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: ar
  text: 'فأجاب حنانيا: «يا رب، سمعتُ من كثيرين عن هذا الرجل، ما فعله من شرور بقديسيك في أورشليم.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη δὲ
  choice: فأجاب
  rationale: الفاء تلائم تتابع السرد مع إيحاء خفيف بأن جواب حنانيا جاء مترددًا أو معترضًا، و«أجاب» تقابل الفعل مباشرة.
- source_word: Κύριε
  choice: يا رب
  rationale: نداء مباشر ليسوع القائم في سياق الرؤيا، ويحفظ الاحترام والثقل اللاهوتي من غير زيادة تفسيرية.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: سمعتُ من كثيرين
  rationale: صياغة عربية طبيعية وموجزة تحفظ الماضي ومصدر الخبر الجمعي غير المحدد.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: عن هذا الرجل
  rationale: مقابل واضح وطبيعي يحفظ اسم الإشارة.
- source_word: ὅσα κακὰ
  choice: وكم من الشرور
  rationale: يحفظ دلالة الكثرة والمدى في ὅσα مع القيمة الأخلاقية لـκακά، بصياغة عربية فصيحة وطبيعية.
- source_word: τοῖς ἁγίοις σου
  choice: بقديسيك
  rationale: يحفظ المصطلح العهدي «القديسين» وضمير الملكية، والباء ملائمة عربيًا مع فعل الشر بشخص.
- source_word: ἐποίησεν
  choice: فعل
  rationale: مقابل واسع ومباشر للفعل ποιέω من غير تخصيص لنوع الأذى.
- source_word: ἐν Ἰερουσαλήμ
  choice: في أورشليم
  rationale: ترجمة مكانية مباشرة مع الاسم الكتابي الشائع للمدينة.
theological_decisions:
- issue: مرجع Κύριε وقوة دلالته في خطاب حنانيا
  choice: خطاب مباشر ليسوع بلفظ «يا رب»
  alternative: «يا سيد» بمعنى الاحترام وحده
  rationale: السياق المباشر يصور حنانيا مجيبًا يسوع القائم في رؤيا؛ لذلك يحفظ «يا رب» الدلالة السياقية واللاهوتية بلا مبالغة.
- issue: ترجمة τοῖς ἁγίοις σου
  choice: «قديسيك»
  alternative: «أوليائك» أو «خاصتك المقدسين»
  rationale: «القديسون» مصطلح كتابي مفهوم يشير إلى المؤمنين بوصفهم مكرسين لله، ويحفظ ارتباطهم بالرب في ضمير الملكية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. اختيرت «وكم من الشرور فعل» للمحافظة على مقدار الأفعال الشريرة وتعددها، من دون تسويتها إلى مجرد «أذى» أو إضافة تفاصيل غير موجودة.
