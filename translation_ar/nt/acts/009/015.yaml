base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: ar
  text: 'فقال له الرب: «اذهب، لأن هذا إناءٌ مختارٌ ليحمل اسمي أمام الأمم[a] والملوك وبني إسرائيل[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الشعوب»؛ ويُراد بها هنا على الأرجح غير اليهود.'
    reason: lexical_alternative
  - marker: b
    text: «بنو إسرائيل» تعبير كتابي تقليدي يُقصد به شعب إسرائيل.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: الرب
  rationale: الترجمة العربية المألوفة لهذا اللقب، وهو في سياق الرواية يشير إلى يسوع القائم المتكلم بسلطان.
- source_word: Πορεύου
  choice: اذهب
  rationale: أمر عربي طبيعي ومباشر يحفظ قوة الصيغة اليونانية.
- source_word: σκεῦος ἐκλογῆς ἐστίν μοι
  choice: هذا لي إناءٌ مختار
  rationale: يحفظ استعارة الإناء الواردة في الأصل، ويعبّر عن الاختيار والعلاقة الشخصية التي يدل عليها μοι، من غير تحميل العبارة نظامًا لاهوتيًا لاحقًا.
- source_word: τοῦ βαστάσαι τὸ ὄνομά μου
  choice: ليحمل اسمي
  rationale: المصدر المعرّف يفيد الغرض، و«يحمل اسمي» يحفظ الصورة ودلالات التمثيل والشهادة العلنية.
- source_word: ἐνώπιον
  choice: أمام
  rationale: مقابل عربي واضح يلائم سياق المثول والشهادة العلنية.
- source_word: ἐθνῶν
  choice: الأمم
  rationale: يحفظ اللفظ الواسع في الأصل، مع بيان المعنى السياقي المحتمل، أي غير اليهود، في الحاشية.
- source_word: βασιλέων
  choice: الملوك
  rationale: ترجمة مباشرة ودقيقة لا تستدعي تعميم اللفظ إلى الحكام.
- source_word: υἱῶν Ἰσραήλ
  choice: بني إسرائيل
  rationale: تعبير عربي كتابي طبيعي يحفظ الصورة النَسَبية والهوية الجماعية في الأصل.
- source_word: τε ... καὶ ... τε
  choice: و... و...
  rationale: الربط بالواو هو الأسلوب العربي الطبيعي لتنسيق الفئات الثلاث من غير إثقال.
theological_decisions:
- issue: احتمال تحميل ἐκλογῆς مفهومًا مذهبيًا لاحقًا عن الاختيار
  choice: إناءٌ مختار
  alternative: إناء انتخاب / أداة مختارة
  rationale: النص يقرر اختيار هذا الشخص لمهمة، لكنه لا يحدد هنا جميع الأبعاد العقائدية للاختيار؛ لذلك تحافظ الصياغة على دعوى النص من غير حسم نقاشات لاهوتية لاحقة.
- issue: مدى تجريد استعارة σκεῦος
  choice: الإبقاء على «إناء»
  alternative: أداة
  rationale: «إناء» يحفظ المجاز الأصلي والتوتر الدلالي بين الشيء المملوك والوسيلة المستخدمة، بينما «أداة» تفسر المجاز وتضيّقه.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظت استعارة «الإناء» والتعبيران «يحمل اسمي» و«بني إسرائيل»، مع حواشٍ موجزة لشرح البدائل الدلالية دون إدخال تفسير مذهبي.
