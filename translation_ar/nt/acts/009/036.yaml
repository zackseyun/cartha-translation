  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: ar
  text: وكانت في يافا تلميذة اسمها طابيثا[a]، التي يُترجَم اسمها «دُوركاس». وكانت مملوءة بالأعمال الصالحة وأعمال الرحمة التي كانت تعملها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «دُوركاس» هو الاسم اليوناني المقابل لـ«طابيثا»، ومعنى الاسمين «غزالة».
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθήτρια
  choice: تلميذة
  rationale: الاسم اليوناني مؤنث صريح، والعربية تتيح نقله طبيعيًا ودقيقًا بصيغة «تلميذة».
- source_word: Ἐν Ἰόππῃ δέ
  choice: وكان في يافا
  rationale: «في يافا» تنقل العبارة المكانية، والواو مع «كان» تؤدي وظيفة δέ في مواصلة السرد دون إدخال ظرف زمني غير موجود في الأصل.
- source_word: ὀνόματι Ταβιθά
  choice: اسمها طابيثا
  rationale: صياغة عربية طبيعية للمصطلح الدال على التسمية، مع نقل الاسم السامي صوتيًا.
- source_word: ἣ διερμηνευομένη λέγεται Δορκάς
  choice: أي دُوركاس بالترجمة
  rationale: تنقل العبارة كون «دوركاس» المقابل اليوناني للاسم السامي، لا مجرد شرح لمعناه المعجمي.
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: مملوءة بالأعمال الصالحة
  rationale: تحافظ على صورة الامتلاء وعلى التعبير الأخلاقي المباشر في الأصل.
- source_word: ἐλεημοσυνῶν
  choice: أعمال الرحمة
  rationale: تعبير واضح يشمل الإحسان والعطاء للمعوزين من غير قصر اللفظ على المال وحده.
- source_word: ὧν ἐποίει
  choice: التي دأبت على القيام بها
  rationale: صيغة «دأبت» تُظهر الاستمرار والاعتياد اللذين توحي بهما صيغة الماضي الناقص اليونانية.
theological_decisions:
- issue: إظهار تأنيث μαθήτρια
  choice: تلميذة
  alternative: تلميذ من النساء
  rationale: الأصل يستخدم صيغة مؤنثة صريحة، وصيغة «تلميذة» أفصح وأطبع في العربية وتحفظ دلالة النص بلا زيادة تفسيرية.
- issue: مدى دلالة ἐλεημοσυνῶν
  choice: أعمال الرحمة
  alternative: الصدقات
  rationale: قد يدل اللفظ على تقديم الصدقات خصوصًا، لكن «أعمال الرحمة» تحفظ سعته المحتملة وقوته الأخلاقية ولا تحصره في العطاء المالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «يافا» بصيغتها العربية المألوفة، وأُبقي الاسمان طابيثا ودُوركاس في المتن، مع بيان معناهما في الحاشية.
