review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: يافا، وتلميذة، والاسمان، وكثرة الأعمال الصالحة وأعمال الرحمة. لكن «أي دُوركاس بالترجمة» صياغة مقتضبة غير سلسة ولا تُظهر بوضوح أن الاسم هو الذي يُترجَم/يُقابَل باليونانية. كما أن «دأبت» تقوّي معنى الاعتياد، في حين أن الماضي الناقص اليوناني يمكن أن يدل ببساطة على فعل مستمر أو متكرر؛ لذا فـ«كانت تعملها» أوسع وأقرب إلى المحافظة على هذا المجال.'
  naturalness: «وكان في يافا تلميذة» جائزة، لكن المطابقة المؤنثة في «كانت» أيسر في العربية المعاصرة. والصياغة «التي يُترجَم اسمها دُوركاس» طبيعية وواضحة وتحافظ على وظيفة التفسير في النص.
  terminology: '«تلميذة» اختيار دقيق للصيغة المؤنثة μαθήτρια. و«الأعمال الصالحة وأعمال الرحمة» يحافظ على التمييز بين ἔργα ἀγαθά وἐλεημοσύναι من غير حصر الأخيرة بالصدقات المالية. وتُحافَظ أسماء الأماكن والأعلام على: يافا، طابيثا، دُوركاس.'
  issues:
  - severity: medium
    issue: صياغة شرح الاسم «أي دُوركاس بالترجمة» غير طبيعية وملتبسة قليلًا.
    rationale: الأصل يقول حرفيًا إن طابيثا، عند ترجمتها/تفسيرها، تُدعى دُوركاس. ينبغي أن ترتبط الترجمة بالاسم بعبارة عربية صريحة.
  - severity: low
    issue: «دأبت على القيام بها» أضيق من دلالة الماضي الناقص اليوناني.
    rationale: قد يفيد ἐποίει الاستمرار أو التكرار دون لزوم إبراز المواظبة المقصودة في «دأبت»؛ «كانت تعملها» يحفظ المرونة.
