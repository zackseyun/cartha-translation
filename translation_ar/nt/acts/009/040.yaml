  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: ar
  text: 'أما بطرس فأخرج الجميع إلى الخارج، ثم جثا على ركبتيه وصلّى. وبعد أن التفت إلى الجسد قال: «يا طابيثا، قومي».[a] ففتحت عينيها، ولما رأت بطرس جلست.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انهضي». يحتمل فعل الأمر اليوناني كلتا الصياغتين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλὼν ... ἔξω πάντας
  choice: فأخرج الجميع
  rationale: ينقل بوضوح إخراج جميع الحاضرين من المكان، من غير أن يضيف إيحاءً بالقوة لا يقتضيه السياق.
- source_word: θεὶς τὰ γόνατα
  choice: جثا على ركبتيه
  rationale: تعبير عربي فصيح وطبيعي عن اتخاذ هيئة الركوع للصلاة.
- source_word: προσηύξατο
  choice: صلّى
  rationale: المقابل العربي المباشر والطبيعي للفعل في هذا السياق.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: بعد أن التفت إلى الجسد
  rationale: يحفظ حركة الالتفات واتجاهها نحو الجسد، ويترجم σῶμα ترجمة مباشرة دون استعمال لفظ أشد مثل «الجثة».
- source_word: Ταβιθά
  choice: طابيثا
  rationale: نقل صوتي للاسم الشخصي بصيغة عربية واضحة.
- source_word: ἀνάστηθι
  choice: قومي
  rationale: صيغة الأمر المؤنثة الطبيعية من القيام، وتلائم مخاطبة طابيثا في سياق إعادتها إلى الحياة دون تكلف أسلوبي.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: فتحت عينيها
  rationale: ترجمة مباشرة وطبيعية للعبارة اليونانية.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: لما رأت بطرس
  rationale: يصوغ اسم الفاعل اليوناني جملة زمنية عربية واضحة تحفظ تتابع الأحداث.
- source_word: ἀνεκάθισεν
  choice: جلست
  rationale: يفيد الفعل اليوناني أنها اعتدلت إلى وضع الجلوس من وضع الاستلقاء؛ ويؤدي «جلست» ذلك بوضوح في السياق.
- source_word: δὲ
  choice: أما / فـ
  rationale: 'تُرجمت بحسب وظيفتها في تطور السرد: «أما» للانتقال إلى فعل بطرس، والفاء لمواصلة تتابع الأحداث.'
theological_decisions:
- issue: صياغة أمر النهوض في سياق الإعادة إلى الحياة
  choice: قومي
  alternative: انهضي
  rationale: كلتا الصيغتين ممكنتان للفعل ἀνάστηθι. اختيرت «قومي» لأنها طبيعية ومباشرة وتحفظ دلالة النهوض في هذا السياق، من غير أن تضيف تفسيرًا عقائديًا خارج النص.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة، مع جمل سردية طبيعية. وُضع مؤشر الحاشية بعد الأمر الذي تتعلق به مباشرة.
