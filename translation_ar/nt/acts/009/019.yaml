lexical_decisions:
- source_word: λαβὼν τροφὴν
  choice: وبعدما تناول طعامًا
  rationale: ينقل تسلسل اسم الفاعل الأوريستي ومعنى تلقّي الطعام أو أكله، بصياغة عربية طبيعية واضحة.
- source_word: ἐνίσχυσεν
  choice: استعاد قوته
  rationale: يفيد السياق أن شاول تقوّى بعد الصوم والضعف؛ وهذه الصياغة تنقل النتيجة بصورة عربية مألوفة، مع إثبات البديل الأقرب إلى المبنى في الحاشية.
- source_word: Ἐγένετο δὲ
  choice: وأقام
  rationale: التركيب يؤدي وظيفة انتقال سردي ويصف بقاء شاول برفقة التلاميذ، لا وقوع حادثة مستقلة؛ و«أقام» طبيعية في هذا السياق.
- source_word: μετὰ τῶν ἐν Δαμασκῷ μαθητῶν
  choice: مع التلاميذ الذين في دمشق
  rationale: تحافظ «مع» على دلالة المصاحبة في μετά مع المضاف إليه، وتوضح الصلة الوصفية المكانية دون غموض.
- source_word: ἡμέρας τινάς
  choice: بضعة أيام
  rationale: ينقل مفعول الزمان مدة غير محددة وقصيرة نسبيًا، من غير تعيين عدد دقيق.
