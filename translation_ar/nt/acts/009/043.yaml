lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: ومكث
  rationale: التركيب اليوناني «ἐγένετο + المصدر» أسلوب سردي، ونقلُه بالفعل الرئيس «مكث» طبيعي في العربية ويحفظ المعنى دون حرفية ثقيلة مثل «وحدث أن يمكث».
- source_word: δὲ
  choice: الواو في «ومكث»
  rationale: أداة ربط سردية خفيفة تواصل مجرى الرواية، والواو العربية تؤدي هذه الوظيفة من غير أن توحي بتعارض قوي.
- source_word: ἡμέρας ἱκανὰς
  choice: أيامًا كثيرة
  rationale: يفيد الوصف مدة زمنية غير قصيرة أو عددًا معتبرًا من الأيام؛ و«أيامًا كثيرة» تعبير عربي واضح ومباشر.
- source_word: ἐν Ἰόππῃ
  choice: في يافا
  rationale: «يافا» هو الاسم العربي الشائع للموضع التاريخي Ἰόππη.
- source_word: παρά τινι Σίμωνι
  choice: عند رجلٍ اسمه سمعان
  rationale: تحفظ «عند» دلالة الإقامة لدى شخص، ويعبّر «رجل اسمه» طبيعيًا عن عدم سبق تعريف سمعان في السياق، دون إقحام معنى زائد.
- source_word: βυρσεῖ
  choice: دبّاغٍ
  rationale: يدل اللفظ تحديدًا على من يدبغ الجلود، و«دبّاغ» هو المقابل العربي الدقيق والمألوف.
