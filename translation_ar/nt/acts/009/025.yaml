  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: ar
  text: لكن تلاميذه أخذوه ليلًا وأنزلوه من خلال السور، مُدلين به في سلة كبيرة[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عبر فتحة في السور». يقول اليوناني حرفيًا: «من خلال السور»، ولعل المقصود فتحة أو نافذة في سور المدينة.'
    reason: lexical_alternative
  - marker: b
    text: يستعمل اليوناني تعبيريْن متقاربين للإنزال («أنزلوه» و«مُدلين به»)، في تركيب حيّ يبرز كيفية هروبه.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: أخذوه
  rationale: ينقل فعل الأخذ الوارد في اسم الفاعل الماضي، بصياغة عربية طبيعية من غير مبالغة في معنى الإمساك.
- source_word: δὲ
  choice: لكن
  rationale: يفيد انتقالًا فيه مقابلة خفيفة مع مؤامرة قتله في السياق السابق.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: يحفظ ضمير الملكية الصريح αὐτοῦ ويستعمل المقابل المألوف لـ μαθηταί.
- source_word: νυκτός
  choice: ليلًا
  rationale: تعبير عربي موجز وطبيعي عن مضاف إليه دال على الزمن.
- source_word: διὰ τοῦ τείχους
  choice: من خلال السور
  rationale: يحفظ معنى المرور عبر السور من غير إضافة فتحة أو نافذة لا يصرح بهما اليوناني.
- source_word: καθῆκαν αὐτόν
  choice: أنزلوه
  rationale: ينقل معنى إنزاله من موضع مرتفع بوضوح.
- source_word: χαλάσαντες
  choice: إذ دلَّوه
  rationale: يحفظ التعبير الثاني عن التدلية في اليونانية ويبين هيئة الإنزال من غير دمج الفعلين كليًا.
- source_word: ἐν σπυρίδι
  choice: في سلٍّ كبير
  rationale: σπυρίς سلة تتسع لحمل رجل، وإضافة «كبير» توضح دلالة اللفظ وتميزه من ألفاظ السلال الأصغر.
