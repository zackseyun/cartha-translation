  text: ἐλάλει τε καὶ συνεζήτει πρὸς τοὺς Ἑλληνιστάς· οἱ δὲ ἐπεχείρουν ⸂ἀνελεῖν αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: ar
  text: وكان يتكلم ويتجادل مع الهيلينيين[a]، أما هم فكانوا يحاولون قتله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: اليهود الناطقون باليونانية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλει
  choice: كان يتكلّم
  rationale: الماضي الناقص يدل على فعل مستمر أو متكرر في سياق السرد، وصيغة «كان يتكلّم» تحفظ هذا البعد.
- source_word: τε καὶ
  choice: و
  rationale: تربط العبارة بين فعلين منسقين، وتؤدي الواو هذا الربط بطبيعية في العربية من غير إثقال.
- source_word: συνεζήτει
  choice: يتجادل
  rationale: الفعل يدل هنا على مناقشة جدلية نشطة، لا على حديث محايد، وهو ما يلائم رد الفعل العدائي اللاحق.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: مع الهِلِّينيّين
  rationale: حرف الجر مع فعل المجادلة يفيد التفاعل مع أشخاص، و«مع» هي الصياغة العربية الطبيعية.
- source_word: Ἑλληνιστάς
  choice: الهِلِّينيّين
  rationale: يحفظ اللفظ اسم الفئة الاجتماعية اللغوية المميزة في سفر الأعمال، مع بيان المقصود في الحاشية تجنبًا للالتباس.
- source_word: οἱ δὲ
  choice: أمّا هم فـ
  rationale: تُظهر الصياغة التحول التقابلي من كلام شاول وجداله إلى محاولة خصومه قتله.
- source_word: ἐπεχείρουν
  choice: كانوا يحاولون
  rationale: تحفظ صيغة الماضي الناقص معنى المحاولة المستمرة أو المتكررة.
- source_word: ἀνελεῖν αὐτόν
  choice: قتله
  rationale: الفعل في هذا السياق يعني إزهاق الحياة، و«قتله» أوضح تعبير عربي مباشر.
theological_decisions:
- issue: هوية Ἑλληνιστάς
  choice: الهِلِّينيّون، أي اليهود الناطقون باليونانية
  alternative: اليونانيون أو الناطقون باليونانية عمومًا
  rationale: يستعمل سفر الأعمال المصطلح بوصفه تسمية اجتماعية لغوية معروفة، ولا سيما بالمقابلة مع العبرانيين في أعمال 6:1؛ لذلك لا ينبغي أن توحي الترجمة بأنهم أمميون يونانيون بالضرورة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «يتجادل» لإبراز طبيعة المناقشة الجدلية، وحُفظ المصطلح الجماعي «الهِلِّينيّين» في المتن مع شرحه في الحاشية.
