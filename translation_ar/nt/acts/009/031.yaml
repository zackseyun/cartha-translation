id: ACT.9.31
reference: Acts 9:31
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: ar
  text: فكانت الكنيسة في جميع اليهودية والجليل والسامرة تنعم بالسلام وتُبنى[a]، وتسلك في مخافة الرب وبتشجيع الروح القدس[b]، وتزداد عددًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «الكنائس» بدلًا من «الكنيسة».'
    reason: textual_variant
  - marker: b
    text: 'أو: «بتعزية الروح القدس» أو «بحثّ الروح القدس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: الكنيسة
  rationale: يتبع النص اليوناني المطبوع صيغة المفرد، بوصف الكنيسة جماعة واحدة ممتدة في المناطق المذكورة، مع إثبات قراءة الجمع في الحاشية.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: في جميع اليهودية والجليل والسامرة
  rationale: تنقل «في جميع» الدلالة الإقليمية التوزيعية لـκατά مع حضور معنى ὅλης، بصياغة عربية طبيعية.
- source_word: εἶχεν εἰρήνην
  choice: تنعم بالسلام
  rationale: تؤدي معنى امتلاك السلام بصياغة عربية جارية، وتشمل الهدوء من الاضطهاد والاستقرار دون اختزالها في مجرد الراحة.
- source_word: οἰκοδομουμένη
  choice: تُبنى
  rationale: تحافظ على استعارة البناء وعلى الدلالة الاستمرارية للمبني للمجهول، بدل تفسيرها حصرًا بالتقوية.
- source_word: πορευομένη
  choice: تسلك
  rationale: «تسلك» تعبير عربي كتابي واضح يدل على نهج الحياة والسلوك، ويحفظ المجاز اليوناني.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: في مخافة الرب
  rationale: تحفظ العبارة الكتابية بما فيها من مهابة وتقوى وطاعة، من غير تسطيحها إلى شرح تفسيري واحد.
- source_word: κυρίου
  choice: الرب
  rationale: المقابل العربي القياسي لـκύριος، مع إبقاء المرجع كما صاغه النص دون زيادة تحديد.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: بتشجيع الروح القدس
  rationale: «التشجيع» ملائم لسياق البناء والازدياد، مع بقاء معنيي التعزية والحث في الحاشية لأن παράκλησις واسعة الدلالة.
- source_word: ἐπληθύνετο
  choice: تزداد عددًا
  rationale: توضح الزيادة العددية المستمرة التي يفيدها الفعل الناقص، وتلائم مفرد «الكنيسة» في العربية.
theological_decisions:
- issue: عدد ἐκκλησία ومرجعها
  choice: 'المفرد الجمعي: «الكنيسة»'
  alternative: 'قراءة نصية بالجمع: «الكنائس»'
  rationale: النص المطبوع المعطى يقرأ المفرد، وكذلك التوابع والأفعال، فيصور الكنيسة الواحدة في المناطق الثلاث؛ وأُثبت اختلاف الجمع المهم في الحاشية.
- issue: معنى «مخافة الرب»
  choice: المهابة التقوية المصحوبة بالطاعة
  alternative: الرعب من الرب، أو مجرد التوقير الديني العام
  rationale: أُبقي التعبير الحرفي الغني كتابيًا كيلا يُحصر في الخوف المرعب أو في تفسير مخفف.
- issue: دلالة παράκλησις المرتبطة بالروح القدس
  choice: التشجيع
  alternative: التعزية أو الحث
  rationale: التشجيع أنسب بالسياق وأوضح للقارئ، لكن اللفظة اليونانية تحتمل التعزية والحث أيضًا، ولذلك حُفظ هذا الاتساع في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُخدم «تُبنى» لحفظ استعارة البناء، و«تسلك في مخافة الرب» لصون النبرة الكتابية الطبيعية، مع تجنب الألفاظ القديمة غير اللازمة.
