  - severity: low
    issue: «يتجه نحو» أقل دقة في وصف انفتاح الميناء.
    rationale: يستعمل «يفتح نحو» استعمالًا جغرافيًا/ملاحيًا طبيعيًا لوصف واجهة الميناء، مع عدم حسم الإشكال التفسيري في الاتجاهين.
