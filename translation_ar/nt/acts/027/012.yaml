  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: ar
  text: ولأن الميناء لم يكن ملائمًا لقضاء الشتاء، قررت الأغلبية أن تبحر من هناك، لعلهم يتمكنون من الوصول إلى فينيكس وقضاء الشتاء فيها، وهو ميناء في كريت يفتح نحو الجنوب الغربي والشمال الغربي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: العبارة اليونانية الأخيرة صعبة التحديد. والترجمة التقليدية هي «يفتح نحو الجنوب الغربي والشمال الغربي»، ويرى بعضهم أن الاتجاه الثاني هو، على وجه أدق، الغرب المائل إلى الشمال الغربي.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευθέτου
  choice: لم يكن ملائمًا
  rationale: ينقل عدم صلاحية الميناء للغرض المقصود، أي الإقامة فيه شتاءً، بصياغة عربية طبيعية.
- source_word: λιμένος
  choice: الميناء
  rationale: المقابل العربي المألوف في سياق الملاحة والرسو.
- source_word: πρὸς παραχειμασίαν
  choice: لقضاء الشتاء
  rationale: يوضح غرض الإقامة طوال فصل الشتاء ويحافظ على دلالة العبارة الغائية.
- source_word: οἱ πλείονες
  choice: الأغلبية
  rationale: يدل التركيب على العدد الأكبر من الجماعة من غير تحديد هويتهم بما يتجاوز النص.
- source_word: ἔθεντο βουλήν
  choice: قررت
  rationale: ينقل الاصطلاح الدال على اتخاذ قرار جماعي بوضوح وإيجاز.
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: أن تبحر من هناك
  rationale: الفعل مصطلح ملاحي معناه الانطلاق إلى البحر؛ وصيغة الجمع تراعي دلالة الجماعة في «الأغلبية».
- source_word: εἴ πως δύναιντο
  choice: لعلهم يتمكنون
  rationale: يحفظ معنى الرجاء الممزوج بعدم اليقين في εἴ πως مع صيغة الإمكان.
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: الوصول إلى فينيكس
  rationale: صياغة عربية طبيعية للوصول إلى الوجهة، مع نقل اسم الموضع صوتيًا.
- source_word: παραχειμάσαι
  choice: قضاء الشتاء فيها
  rationale: يحافظ على تكرار فكرة قضاء الشتاء ويعيد الضمير إلى المدينة/الوجهة بصياغة عربية واضحة.
- source_word: βλέποντα κατὰ λίβα καὶ κατὰ χῶρον
  choice: يتجه نحو الجنوب الغربي والشمال الغربي
  rationale: ينقل التفسير الجغرافي التقليدي مع إبقاء صعوبة العبارة الأصلية في حاشية.
