    issue: إظهار مدة الأربعة عشر يومًا
    rationale: العبارة اليونانية تجعل اليوم الحاضر اليوم الرابع عشر من استمرار حالتهم. «هذا هو اليوم الرابع عشر» مفهومة، لكن «اليوم هو اليوم الرابع عشر وأنتم...» أوضح في العربية ويقارب الارتباط الزمني في الأصل.
  - severity: low
    issue: التوازي في وصف عدم الطعام
    rationale: «من غير أن تأكلوا، ولم تتناولوا شيئًا» يجمع تركيبًا جارًا/مصدريًا مع جملة فعلية مستقلة. «بلا طعام، ولم تتناولوا شيئًا» أكثر اتساقًا، ويحفظ التوكيد المتعمد في اليونانية بين ἄσιτοι وμηθὲν προσλαβόμενοι.
