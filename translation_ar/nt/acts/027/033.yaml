  register: فصحى معاصرة واضحة ذات نبرة سردية كريمة. استُخدم «ظلَّ ... يحثّ» لإظهار الاستمرار، وأُبقي التكرار بين عدم الأكل وعدم تناول شيء لأنه حاضر في النص اليوناني ويؤكد شدة الحال.
