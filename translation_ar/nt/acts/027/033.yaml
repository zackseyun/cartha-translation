  rationale: عُدّلت الصياغة تعديلًا محدودًا لتوضيح أن اليوم الحاضر هو اليوم الرابع عشر من مدة استمرار حالهم، ولتحسين التوازي النحوي في وصف امتناعهم الفعلي عن الطعام. ولم يُغيَّر المعنى، ولا أُضيف إلى المتن معنى القلق المحتمل في «الترقّب».
