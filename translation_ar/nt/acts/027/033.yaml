  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: ar
  text: 'وإلى أن أوشك النهار أن يطلع، ظلَّ بولس يحثّ الجميع على تناول شيء من الطعام، قائلًا: «اليوم هو اليوم الرابع عشر وأنتم تواصلون الترقّب بلا طعام، ولم تتناولوا شيئًا».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ
  choice: وإلى أن
  rationale: تحافظ العبارة على الحدّ الزمني الذي استمر إليه حثّ بولس، وهي عربية واضحة في سياق السرد.
- source_word: ἡμέρα ἤμελλεν γίνεσθαι
  choice: أوشك النهار أن يطلع
  rationale: تنقل دلالة قرب مجيء ضوء النهار بصياغة عربية طبيعية من غير زيادة تفسيرية.
- source_word: παρεκάλει
  choice: ظلَّ ... يحثّ
  rationale: تنقل صيغة الماضي الناقص الدالة على الاستمرار أو التكرار، مع الحفاظ على قوة الحثّ.
- source_word: ἅπαντας
  choice: الجميع
  rationale: تشمل جميع الموجودين المقصودين في السفينة بصياغة موجزة وواضحة.
- source_word: μεταλαβεῖν τροφῆς
  choice: تناول شيء من الطعام
  rationale: تعكس معنى أخذ قسط من الغذاء وتحافظ على الدلالة الجزئية للمضاف إليه.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: هذا هو اليوم الرابع عشر
  rationale: تحافظ على إبراز اليوم الحاضر بوصفه اليوم الرابع عشر، مع أسلوب عربي طبيعي.
- source_word: προσδοκῶντες
  choice: تواصلون الترقّب
  rationale: يحفظ معنى الانتظار المشوب بالتوقع من غير الجزم بأن القلق جزء صريح من مدلول اللفظة، كما ينسجم مع فعل الاستمرار التالي.
- source_word: ἄσιτοι διατελεῖτε
  choice: من غير أن تأكلوا
  rationale: ينقل استمرارهم في حال عدم الأكل، ويتجنب لفظ الصيام الذي قد يوحي بممارسة دينية طوعية.
- source_word: μηθὲν προσλαβόμενοι
  choice: ولم تتناولوا شيئًا
  rationale: يحافظ على العبارة التفسيرية المؤكدة في اليونانية وعلى تكرار معنى عدم تناول الطعام.
