base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: ar
  text: ولمّا حلّت الليلة الرابعة عشرة، وبينما كنّا نُساق في بحر أدريا[a]، نحو منتصف الليل، بدأ البحّارة يظنّون أن أرضًا ما تقترب منهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان اسم «أدريا» في الاستعمال القديم قد يشمل مياهًا أوسع في وسط البحر المتوسط ضمن هذه المنطقة، لا البحر الأدرياتيكي الحديث وحده.
    reason: cultural_note
