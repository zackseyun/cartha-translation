    text: 'حرفيًا: «كان البحّارة يظنّون أن أرضًا ما تقترب منهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: حلّت الليلة الرابعة عشرة
  rationale: تعبير عربي طبيعي يحفظ دلالة بلوغ الليلة الرابعة عشرة ضمن تسلسل العاصفة.
- source_word: διαφερομένων ἡμῶν
  choice: كانت الرياح تسوقنا
  rationale: يبين الحركة المستمرة غير الخاضعة لإرادتهم في سياق العاصفة؛ وذِكر الرياح مفهوم من السياق ويجعل المبني للمجهول اليوناني طبيعيًا في العربية.
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: في بحر أدريا
  rationale: يحافظ على الاسم الجغرافي القديم، الذي كان أوسع مدلولًا من البحر الأدرياتيكي بمفهومه الحديث.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: نحو منتصف الليل
  rationale: ينقل معنى التقريب في κατὰ مع وسط الليل بعبارة عربية موجزة.
- source_word: ὑπενόουν
  choice: بدأ البحّارة يظنّون
  rationale: يحفظ الطابع التدريجي للفعل الناقص مع بقاء الاستنتاج غير يقيني.
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: أن أرضًا ما تقترب منهم
  rationale: يحافظ على صياغة اليونانية التي تجعل الأرض هي المقتربة، وعلى التنكير وعدم معرفة أي أرض هي.
