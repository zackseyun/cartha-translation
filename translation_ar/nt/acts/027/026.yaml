translation:
  language: ar
  text: لكن لا بد أن نُدفَع إلى جزيرةٍ ما[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن نجنح عند جزيرةٍ ما».'
    reason: 'بديل معجمي يبرز الدلالة الملاحية للفعل: الجنوح أو الوصول القسري إلى اليابسة.'
lexical_decisions:
- source_word: δέ
  choice: ولكن
  rationale: تفيد انتقالًا مع تباين خفيف في السياق، و«لكن» تنقل ذلك بوضوح، وأُضيفت الواو لتلائم الربط العربي.
- source_word: δεῖ
  choice: لا بد أن
  rationale: تنقل معنى الضرورة الذي تفيده الكلمة اليونانية بصياغة عربية طبيعية وقوية.
- source_word: ἡμᾶς
  choice: نـ
  rationale: الضمير هو فاعل المصدر في التركيب اليوناني، ويُعبَّر عنه طبيعيًا في العربية بضمير المتكلمين المتصل بالفعل.
- source_word: εἰς νῆσον τινα
  choice: بجزيرةٍ ما
  rationale: تحفظ «جزيرة» معنى νῆσον، وتحفظ «ما» تنكير τινα وعدم تحديد الجزيرة؛ والباء تلائم الفعل العربي «نرتطم» مع بقاء معنى الاتجاه نحو الجزيرة.
- source_word: ἐκπεσεῖν
  choice: نرتطم
  rationale: في هذا السياق الملاحي يدل الفعل على وقوع السفينة على الساحل أو ارتطامها به. «نرتطم بجزيرة» تعبير عربي موجز وطبيعي، مع إيراد البديل الذي يبرز الانجراف في الحاشية.
theological_decisions:
- issue: طبيعة الضرورة في δεῖ
  choice: إبقاء العبارة العامة «لا بد»
  alternative: التصريح بأنها ضرورة إلهية أو قَدَر محتوم
  rationale: النص نفسه يقرر الضرورة من غير أن يسمّي مصدرها في هذه الجملة، فلا ينبغي إضافة تفسير لاهوتي غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. استُخدمت «جزيرة ما» للمحافظة على عدم التحديد، ووُضع مؤشر الحاشية [a] في المتن كما يلزم.
