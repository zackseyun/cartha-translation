  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: ar
  text: وبعد أن رفعوا القارب، استخدموا حبالًا داعمةً لتطويق السفينة وتقويتها[a]. وإذ كانوا يخشون أن ينجرفوا إلى سِرتِس[b]، أرخَوا العُدّة[c]، وهكذا ظلّوا يُساقون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي أحاطوا بدن السفينة بحبال لتقويته.
    reason: cultural_note
  - marker: b
    text: سِرتِس منطقة اشتهرت بالمياه الضحلة والحواجز الرملية قبالة ساحل شمال إفريقيا.
    reason: cultural_note
  - marker: c
    text: 'أو: «أنزلوا العُدّة». واليونانية تقول «العُدّة/الجهاز»، ولا يُعرف على وجه اليقين أيُّ جزء من تجهيزات السفينة كان المقصود.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: وبعد أن رفعوها
  rationale: الضمير يعود إلى القارب المذكور في الآية السابقة، واسم المؤنث «القارب» غير مناسب صرفيًا؛ لذلك يتبع الضمير هنا المرجع السياقي المفهوم بوصفه وسيلة النجاة/الزورق بحسب السياق العربي، مع إبقاء العبارة موجزة. والفعل السابق زمنيًا نُقل بـ«بعد أن».
- source_word: βοηθείαις ἐχρῶντο
  choice: استخدموا حبالًا داعمةً
  rationale: اللفظة تعني حرفيًا وسائل المساعدة أو الدعامات، وتشير في السياق البحري إلى وسائل تقوية بدن السفينة؛ و«حبالًا داعمة» واضحة من غير إفراط في الاصطلاح الفني.
- source_word: ὑποζωννύντες τὸ πλοῖον
  choice: لربط السفينة من أسفل
  rationale: ينقل صورة إحاطة بدن السفينة بالحبال وتقويته من تحته بلغة عربية طبيعية ومفهومة.
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: أن تجنح على سِرتِس
  rationale: ἐκπίπτω في هذا السياق يدل على الاندفاع إلى منطقة الخطر والجنوح فيها؛ والصياغة العربية موجزة وتحافظ على الاسم الجغرافي.
- source_word: χαλάσαντες τὸ σκεῦος
  choice: أرخَوا العُدّة
  rationale: σκεῦος لفظ عام يعني العدة أو الجهاز، ولا يحدد الشيء البحري المقصود يقينًا؛ لذا حُفظ الغموض بدل حسمه في «مرساة بحرية».
- source_word: οὕτως ἐφέροντο
  choice: وهكذا ظلّت الريح تسوقهم
  rationale: المبني للمجهول الناقص يصور استمرار حمل السفينة بقوة خارجية. ذُكرت الريح إيضاحًا سياقيًا طبيعيًا، مع بقاء معنى الانسياق.
