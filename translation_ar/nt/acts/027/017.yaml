  to: وبعد أن رفعوا القارب، استخدموا حبالًا داعمةً لتطويق السفينة وتقويتها[a]. وإذ كانوا يخشون أن ينجرفوا إلى سِرتِس[b]، أرخَوا العُدّة[c]، وهكذا ظلّوا يُساقون.
  rationale: تزيل المراجعة التفسير غير المصرح به للفاعل «الريح»، وتستبدل تعبير الجنوح بعبارة أوسع توافق الفعل اليوناني، وتوضح مرجع الضمير الأول. كما تُبقي غموض σκεῦος في المتن والحاشية من دون ترجيح نوع محدد من معدات السفينة.
