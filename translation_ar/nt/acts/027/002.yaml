  to: فصعدنا إلى سفينة من أدراميتِّيوم كانت على وشك الإبحار إلى مواضع على ساحل إقليم آسيا[a]، وأقلعنا، وكان معنا أرسطرخس، وهو مقدوني من تسالونيكي.
  rationale: استُبدلت العبارة الجغرافية المبهمة بتعبير عربي واضح يلائم السياق الملاحي ويعكس الدلالة الساحلية المرجحة لـ«المواضع الواقعة بحسب/على امتداد آسيا»، من غير تحويل «المواضع» إلى «موانئ» في المتن. وحُذف مرساة الحاشية b من المتن لأن البديل يختلف الآن عن المتن في تخصيص المواضع بأنها موانئ؛ تبقى الحاشية ضمن مجموعة الحواشي للآية بوصفها بديلًا معجميًا، ويمكن إسنادها تحريريًا إلى «مواضع» إن كانت المنصة تتطلب مرساة ظاهرة لكل حاشية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:22:53Z'
