base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: ar
  text: فصعدنا إلى سفينة من أدراميتِّيوم كانت على وشك الإبحار إلى مواضع على ساحل إقليم آسيا[a]، وأقلعنا، وكان معنا أرسطرخس، وهو مقدوني من تسالونيكي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود مقاطعة آسيا الرومانية في غربي آسيا الصغرى، لا قارة آسيا بالمفهوم الحديث.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιβάντες δὲ
  choice: فصعدنا إلى
  rationale: ينقل اسم الفاعل الماضي في السياق البحري بوصفه صعودًا إلى السفينة، مع جعل δέ أداة انتقال سردي طبيعية في العربية.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: سفينة من أدراميتِّيوم
  rationale: يوضح أن النعت اليوناني ينسب السفينة إلى ميناء أدراميتِّيوم، بدل استعمال نسبة عربية قد تكون غامضة للقارئ.
- source_word: μέλλοντι πλεῖν
  choice: كانت على وشك الإبحار
  rationale: يعبر عن قرب الفعل أو اعتزامه كما في تركيب μέλλω مع المصدر، ويلائم سياق الرحلة.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: إلى الأماكن الواقعة على امتداد آسيا
  rationale: يحافظ على عمومية τόπους وعلى الدلالة الجغرافية لـκατά دون إدخال «الموانئ» أو «الساحل» صراحة في المتن؛ ويُذكر الاحتمال السياقي في الحاشية.
- source_word: Ἀσίαν
  choice: آسيا
  rationale: يُبقي الاسم التاريخي المألوف في المتن، مع توضيح المقصود الروماني القديم في الحاشية.
- source_word: ἀνήχθημεν
  choice: أقلعنا
  rationale: فعل عربي طبيعي للسفينة عند مغادرة الميناء، وينقل الاستعمال البحري الاصطلاحي للفعل اليوناني.
- source_word: ὄντος σὺν ἡμῖν Ἀριστάρχου
  choice: وكان معنا أرسطرخس
  rationale: يصوغ الحال المصاحبة في عبارة عربية واضحة من غير تغيير علاقتها بالفعل الرئيس.
- source_word: Μακεδόνος Θεσσαλονικέως
  choice: وهو مقدوني من تسالونيكي
  rationale: يحفظ الوصف الإقليمي ثم يحدد المدينة بصياغة عربية طبيعية.
