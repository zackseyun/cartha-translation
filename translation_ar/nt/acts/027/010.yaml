base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: ar
  text: 'قائلًا لهم: «يا رجال، أرى أن هذه الرحلة البحرية توشك أن تكون مصحوبةً بأذى وخسارة كبيرة لا يقتصران على الشحنة والسفينة، بل يمتدان إلى حياتنا أيضًا[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لنفوسنا». والمقصود هنا حياتنا في سياق خطر الغرق والموت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: قائلًا لهم
  rationale: يحافظ على صيغة اسم الفاعل وعلى انسياب السرد من غير توسع غير لازم.
- source_word: Ἄνδρες
  choice: يا رجال
  rationale: ينقل النداء المذكر الجمع نقلًا مباشرًا، وهو مناسب لمخاطبة جماعة السفينة.
- source_word: θεωρῶ
  choice: أرى
  rationale: يفيد هنا الإدراك والتقدير المبني على النظر في الظروف، لا مجرد الرؤية البصرية.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: مصحوبةً بأذى وخسارة كبيرة
  rationale: تفيد μετά المصاحبة، وتشير ὕβρις في هذا السياق البحري إلى الأذى أو الشدة العنيفة، بينما تدل ζημία على الخسارة أو الضرر. والصياغة تحفظ التمييز بين اللفظين.
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: لا للشحنة والسفينة وحدهما، بل ... أيضًا
  rationale: يوضح التركيب أن الخسارة ستلحق بالشحنة والسفينة، ويحافظ على بنية «ليس فقط... بل أيضًا» بأسلوب عربي طبيعي.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: لحياتنا
  rationale: ψυχή في سياق الغرق والموت تعني الحياة البشرية المهددة، لا النفس بوصفها كيانًا غير مادي.
- source_word: μέλλειν ἔσεσθαι
  choice: ستكون
  rationale: ينقل التوقع القريب في هذا التحذير بوضوح عربي طبيعي، من غير الجزم بأن الحدث قد وقع.
- source_word: τὸν πλοῦν
  choice: هذه الرحلة البحرية
  rationale: πλοῦς هو السفر بحرًا؛ وإضافة اسم الإشارة تجعل المرجع طبيعيًا وواضحًا في العربية.
theological_decisions:
- issue: دلالة τῶν ψυχῶν ἡμῶν
  choice: لحياتنا
  alternative: لنفوسنا
  rationale: السياق يتحدث عن خطر الغرق والموت الجسدي، لذلك المقصود حياة الأشخاص، من غير تقرير تصور لاهوتي خاص عن النفس.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «الرحلة البحرية» لتحديد معنى πλοῦς، وحُفظ النداء المباشر «يا رجال». تجنبت الصياغة ألفاظًا غامضة مثل «الإهانة» لأن ὕβρις هنا تصف الأذى أو الشدة المصاحبة للرحلة.
