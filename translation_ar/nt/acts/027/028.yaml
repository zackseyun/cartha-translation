  text: καὶ βολίσαντες εὗρον ὀργυιὰς εἴκοσι, βραχὺ δὲ διαστήσαντες καὶ πάλιν βολίσαντες εὗρον ὀργυιὰς δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: ar
  text: فقاسوا العمق[a]، فوجدوا عشرين قامة؛ ثم بعد أن ابتعدوا قليلًا، قاسوا العمق مرة أخرى، فوجدوا خمس عشرة قامة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «ألقوا ثقلَ السبر»؛ أي قاسوا عمق البحر بثقلٍ مربوط بحبل. والقامة هنا وحدة طول بحرية تقارب ستة أقدام (نحو 1.8 متر).'
    reason: lexical_alternative
lexical_decisions:
- source_word: βολίσαντες
  choice: قاسوا العمق
  rationale: يشير الفعل في هذا السياق البحري إلى قياس عمق الماء بإلقاء المثقال المربوط بحبل؛ وهذه صياغة عربية واضحة تؤدي المقصود العملي.
- source_word: εὗρον
  choice: وجدوه
  rationale: ترجمة مباشرة للفعل، والضمير يعود إلى العمق المقيس المفهوم من السياق.
- source_word: ὀργυιὰς
  choice: قامة
  rationale: وحدة طول بحرية قديمة تقارب الباع أو نحو ست أقدام؛ و«قامة» تعبير عربي موجز ومألوف في الترجمات الكتابية، مع بيان المقصود في الحاشية.
- source_word: εἴκοσι
  choice: عشرين
  rationale: نقل مباشر للعدد مع مراعاة موقعه الإعرابي بعد «وجدوه».
- source_word: βραχὺ διαστήσαντες
  choice: تقدموا مسافة قصيرة
  rationale: يفيد التركيب أنهم ابتعدوا أو مضوا قليلًا قبل القياس الثاني، وهذه الصياغة توضح الحركة المضمرة طبيعيًا من غير زيادة تفسيرية كبيرة.
- source_word: πάλιν
  choice: مرة أخرى
  rationale: ينقل بوضوح معنى تكرار قياس العمق.
- source_word: δεκαπέντε
  choice: خمس عشرة
  rationale: نقل مباشر للعدد بما يلائم المعدود المؤنث «قامة».
- source_word: καὶ ... δὲ ... καὶ
  choice: ولما ... ثم ... و... فـ
  rationale: نُقلت الروابط بوصفها تتابعًا سرديًا، إذ لا يظهر هنا تقابل قوي يقتضي «لكن».
