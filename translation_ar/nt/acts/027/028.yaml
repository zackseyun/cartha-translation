  source_fidelity: 'المعنى الأساسي منقول بأمانة: قياسان متتاليان لعمق الماء، وكانت النتيجة عشرين قامة ثم خمس عشرة قامة. لكن «ولما» تحوّل المشاركة الافتتاحية إلى جملة زمنية على نحو غير لازم، و«المثقال» في الحاشية ليس أدق تسمية عربية لأداة السبر، إذ يُفهم عادةً كوحدة وزن.'
  naturalness: النص واضح وفصيح. وتكون البنية السردية أكثر مباشرة وطبيعية بـ«فقاسوا... فوجدوا»، مع «بعد أن ابتعدوا قليلًا» لتمثيل βραχὺ διαστήσαντες دون إسناد حركة مستقلة غير لازمة إلى الأشخاص.
  terminology: «قامة» مناسبة كوحدة بحرية تقابل ὀργυιά، مع الشرح في الحاشية. والأدق في شرح βολίσαντες هو «ثقل سبر مربوط بحبل» أو «ثقل القياس»، لا «المثقال».
