  footnotes:
  - marker: a
    text: 'حرفيًا: «قاموا بعملية إلقاء». وهذا تعبير بحري عن طرح أشياء من السفينة لتخفيفها؛ أما «الحمولة» فمفهومة من السياق وليست مذكورة صراحة في اليونانية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σφοδρῶς
  choice: بعنف
  rationale: ينقل شدة فعل العاصفة وقوتها بصياغة عربية واضحة وطبيعية.
- source_word: χειμαζομένων
  choice: كانت العاصفة تعصف بنا
  rationale: يعبر عن الوقوع تحت وطأة العاصفة، ويحفظ دلالة المبني للمجهول من حيث كونهم متلقين لفعلها، بصياغة عربية مألوفة.
- source_word: τῇ ἑξῆς
  choice: في اليوم التالي
  rationale: المقابل الزمني الطبيعي للعبارة اليونانية.
- source_word: ἐκβολὴν
  choice: يلقون الحمولة في البحر
  rationale: الاسم يدل في السياق الملاحي على طرح ما في السفينة لتخفيفها. ذُكرت «الحمولة» استنادًا إلى الدلالة السياقية، مع بيان ذلك في الحاشية لأن المفعول غير مصرح به في اليونانية.
- source_word: ἐποιοῦντο
  choice: أخذوا ... يلقون
  rationale: صياغة اصطلاحية لعبارة «كانوا يقومون بإلقاء»، وتنقل بدء الفعل واستمراره في سياق السرد، من غير استعمال تركيب عربي متكلف.
