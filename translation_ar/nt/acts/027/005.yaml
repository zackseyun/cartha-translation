  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: ar
  text: وبعد أن أبحرنا عبر البحر المفتوح بمحاذاة كيليكية وبمفيلية[a]، نزلنا إلى ميرا في ليكية[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قبالة كيليكية وبمفيلية»، أي في مسار بحري يمتد بمحاذاة ساحل هذين الإقليمين.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وصلنا إلى ميرا في ليكية». والفعل اليوناني يعني حرفيًا «نزلنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: البحر المفتوح
  rationale: يدل اللفظ هنا على عرض البحر أو البحر المفتوح، لا على البحر بمعناه العام فحسب، وهذا التعبير واضح وطبيعي في العربية.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: بمحاذاة كيليكية وبمفيلية
  rationale: تفيد κατά مع النصب مسارًا بحريًا ممتدًا قبالة ساحل الإقليمين أو بمحاذاته، وتؤدي «بمحاذاة» هذا المعنى من غير أن توحي بالنزول فيهما.
- source_word: διαπλεύσαντες
  choice: بعد أن أبحرنا عبر
  rationale: اسم الفاعل الماضي يدل على حدث تم قبل الفعل الرئيس؛ وصيغة «بعد أن» تبين هذا التعاقب بعبارة عربية طبيعية، بينما ينقل «عبر» معنى الاجتياز.
- source_word: κατήλθομεν
  choice: نزلنا إلى
  rationale: يحافظ هذا الاختيار على المعنى الاتجاهي الحرفي للفعل، مع بقاء احتمال استعماله في سياق الملاحة بمعنى الوصول؛ وقد ذُكر البديل في الحاشية.
- source_word: Μύρα τῆς Λυκίας
  choice: ميرا في ليكية
  rationale: الإضافة اليونانية تحدد الإقليم الذي تقع فيه المدينة، والتعبير بـ«في» هو الأسلوب العربي الأوضح.
- source_word: τε
  choice: الواو الاستئنافية في «وبعد»
  rationale: أُدمجت قوة الربط الخفيفة للأداة في استئناف الجملة بالواو، بما يلائم سلاسة السرد العربي.
