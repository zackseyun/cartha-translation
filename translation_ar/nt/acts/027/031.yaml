  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: ar
  text: 'فقال بولس لقائد المئة وللجنود: «إن لم يبقَ هؤلاء في السفينة، فلا يمكنكم أن تخلصوا[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تنجوا». والمقصود هنا النجاة الجسدية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: قائد المئة
  rationale: تعبير عربي واضح عن الرتبة العسكرية الرومانية، ويحافظ على دلالة اللفظ اليوناني من غير إطالة.
- source_word: οὗτοι
  choice: هؤلاء
  rationale: اسم الإشارة في السياق يعود إلى البحارة الذين كانوا يحاولون مغادرة السفينة، ولا تحتاج العربية إلى إضافة «الرجال» ليتضح المرجع.
- source_word: μείνωσιν
  choice: يبقَ
  rationale: ينقل معنى البقاء وعدم مغادرة السفينة بصياغة عربية طبيعية ومباشرة.
- source_word: πλοίῳ
  choice: السفينة
  rationale: السياق يتحدث عن سفينة بحرية كبيرة، و«السفينة» هي المقابل العربي الأدق والأشيع.
- source_word: σωθῆναι
  choice: تخلصوا
  rationale: يحافظ فعل «خلص» على اتساع دلالة الفعل اليوناني، بينما يبيّن السياق والحاشية أن المقصود هنا النجاة الجسدية من الخطر.
- source_word: οὐ δύνασθε
  choice: فلا يمكنكم
  rationale: صياغة عربية واضحة وطبيعية تنقل نفي القدرة بصورة مباشرة.
theological_decisions:
- issue: هل يُترجم σωθῆναι بلفظ صريح في النجاة الجسدية أم بلفظ أوسع؟
  choice: تخلصوا
  alternative: تنجوا
  rationale: السياق يتعلق بالنجاة من الغرق، لكن الفعل اليوناني هو الفعل العام الدال على الخلاص أو الإنقاذ. يحافظ «تخلصوا» على هذا الاتساع، وتوضح الحاشية المقصود السياقي من دون إدخال معنى الخلاص الأبدي.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة، مع ترتيب سردي طبيعي. استُعمل «قائد المئة» لشرح الرتبة الرومانية بإيجاز، وحُفظ لفظ الخلاص الأوسع مع توضيح دلالته الجسدية في الحاشية.
