  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: ar
  text: لكنهم وقعوا في موضع يلتقي فيه بحران[a]، فأجنحوا السفينة؛ فانغرز مقدّمها وظلّ ثابتًا لا يتزعزع، وأما مؤخّرها فكان يتحطّم بفعل القوّة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «موضع بين بحرين». التعبير اليوناني نادر، وقد يشير إلى قناة أو لسان رملي أو موضع تلتقي فيه كتلتان مائيتان أو تياران.'
    reason: lexical_alternative
