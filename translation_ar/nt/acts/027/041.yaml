  choice: وقعوا في
  rationale: ينقل وقوع السفينة فجأة في هذا الموضع ذي الخطر، من غير إضافة فعل اصطدام غير مصرّح به.
- source_word: τόπον διθάλασσον
  choice: موضع يلتقي فيه بحران
  rationale: يحفظ صورة اللفظ اليوناني النادر المتصل ببحرين أو مسطحين أو تيارين مائيين، من غير حصره في لسان رملي أو قناة.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: فأجنحوا السفينة
  rationale: «أجنح السفينة» تعبير عربي بحري دقيق يعني أوقعها في القاع أو دفعها إليه.
- source_word: πρῷρα
  choice: مقدّمها
  rationale: تعبير عربي واضح للقارئ العام يدل على القسم الأمامي من السفينة.
- source_word: ἐρείσασα
  choice: فانغرز
  rationale: يفيد ثبات مقدّم السفينة بقوة في الموضع بعد جنوحها.
- source_word: ἔμεινεν ἀσάλευτος
  choice: وظلّ ثابتًا لا يتزعزع
  rationale: يحافظ على معنى البقاء وعدم الحركة في العبارة اليونانية.
- source_word: πρύμνα
  choice: مؤخّرها
  rationale: تعبير واضح يدل على القسم الخلفي من السفينة.
- source_word: ἐλύετο
  choice: فكان يتحطّم
  rationale: صيغة الاستمرار تنقل دلالة الماضي الناقص المبني للمجهول على التفكك التدريجي.
- source_word: ὑπὸ τῆς βίας
  choice: من شدّة القوّة
  rationale: يبقي مصدر القوة غير مصرّح به كما في اليونانية، بدل إضافة «الأمواج» تفسيرًا.
