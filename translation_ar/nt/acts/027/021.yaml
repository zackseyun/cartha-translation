  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: ar
  text: 'ولمّا طال بقاؤهم بلا طعام[a]، وقف بولس بينهم وقال: «أيها الرجال، كان ينبغي أن تسمعوا كلامي[b]، فلا تبحروا من كريت، وبذلك تتجنبوا هذا الضرر والخسارة[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صيام طويل». يمكن أن تشير الكلمة اليونانية إلى انعدام الطعام أو إلى الامتناع عن الأكل؛ وفي سياق العاصفة يُرجَّح أنهم ظلّوا مدة طويلة من غير طعام.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أن تطيعوني». قد يدل الفعل على طاعة توجيه أو سلطة؛ والمقصود هنا الأخذ بمشورة بولس.'
    reason: lexical_alternative
  - marker: c
    text: يُرجَّح أن التعبير المزدوج «الضرر والخسارة» يميّز بين الضرر الواقع والخسارة المادية.
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: وبعد أن ظلّوا وقتًا طويلًا بلا طعام
  rationale: التركيب Genitive absolute يبيّن الظرف السابق لكلام بولس. وἀσιτία تحتمل الامتناع عن الطعام أو انعدامه، لكن سياق العاصفة يرجّح طول البقاء من غير أكل؛ و«بعد» لا توحي بعلاقة سببية زائدة.
- source_word: σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: وقف بولس في وسطهم
  rationale: صياغة عربية طبيعية تحفظ فعل اتخاذ بولس موقفًا ليوجّه حديثه إلى الجماعة.
- source_word: Ἔδει μέν, ὦ ἄνδρες
  choice: أيها الرجال، كان ينبغي
  rationale: «كان ينبغي» تنقل دلالة الواجب الذي لم يُعمل به، و«أيها الرجال» تحافظ على الخطاب الموجّه إلى الذكور على متن السفينة.
- source_word: πειθαρχήσαντάς μοι
  choice: أن تسمعوا كلامي
  rationale: الفعل قد يعني الطاعة أو الإصغاء لنصيحة؛ وهنا تشير العبارة إلى وجوب الأخذ بتحذير بولس من الإبحار دون المبالغة في تصوير سلطة رسمية.
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: فلا تبحروا من كريت
  rationale: لـἀνάγω معنى بحري هو الخروج إلى البحر أو الإبحار، وهذه الصياغة واضحة ومباشرة.
- source_word: κερδῆσαί τε
  choice: وبذلك تتجنبوا
  rationale: يمكن أن يدل κερδαίνω على الكسب، ويأتي هنا بمعنى النجاة من الضرر أو عدم تكبده؛ فـ«تتجنبوا» تنقل المعنى السياقي الطبيعي.
- source_word: τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: هذه الأذية والخسارة
  rationale: تحافظ «الأذية» على بعد الضرر الواقع في ὕβρις من غير حصره في تلف مادي، بينما تنقل «الخسارة» ζημία وتبقي التمييز بين اللفظين.
