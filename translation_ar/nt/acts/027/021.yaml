revisions:
- from: 'وبعد أن ظلّوا وقتًا طويلًا بلا طعام[a]، وقف بولس في وسطهم وقال: «أيها الرجال، كان ينبغي أن تسمعوا كلامي[b] فلا تبحروا من كريت، وبذلك تتجنبوا هذه الأذية والخسارة[c]».'
  to: 'ولمّا طال بقاؤهم بلا طعام[a]، وقف بولس بينهم وقال: «أيها الرجال، كان ينبغي أن تسمعوا كلامي[b]، فلا تبحروا من كريت، وبذلك تتجنبوا هذا الضرر والخسارة[c]».'
  rationale: عُدّل افتتاح الآية ليعكس الوظيفة الظرفية للتركيب اليوناني من غير فرض تعاقب زمني، واستُبدلت «الأذية» بـ«الضرر» لمواءمة الدلالة السياقية لـὕβρις. وحُفظت بقية الخيارات، بما فيها إظهار البديل المعجمي لـἀσιτία وπειθαρχέω في الحواشي.
