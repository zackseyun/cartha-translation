translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ظلّوا وقتًا طويلًا بلا طعام» بدل «صاموا» لئلا يُفهم صيام ديني مقصود، مع حفظ البديل في الحاشية. وأُبقي التمييز بين ὕβρις وζημία بصيغة «الأذية والخسارة».
