  text: παρέστη γάρ μοι ταύτῃ τῇ ⸀νυκτὶ τοῦ θεοῦ, οὗ ⸀εἰμι, ᾧ καὶ λατρεύω, ⸀ἄγγελος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: ar
  text: لأنه في هذه الليلة نفسها وقف بجانبي ملاكُ الله الذي أنا له[a]، والذي أعبده أيضًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الذي أنا له»، أي الذي أنتمي إليه.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الذي أخدمه أيضًا»؛ فالفعل اليوناني قد يدل على الخدمة المقدسة أو العبادة المقدمة لله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: وقف بجانبي
  rationale: يحفظ المعنى المكاني للفعل، أي حضور الملاك إلى جانب بولس، من غير تحويله إلى العبارة التفسيرية «ظهر لي».
- source_word: γάρ
  choice: لأنه
  rationale: تربط الأداة القول بما قبله بوصفه تعليلًا لثقة بولس.
- source_word: ταύτῃ τῇ νυκτί
  choice: في هذه الليلة نفسها
  rationale: تنقل الإشارة المؤكدة إلى الليلة الراهنة بعبارة عربية طبيعية.
- source_word: τοῦ θεοῦ
  choice: ملاكُ الله
  rationale: الإضافة العربية الطبيعية تبين أن الملاك تابع لله، وتحفظ ارتباط العبارة بما يليها من صلتي الموصول.
- source_word: οὗ εἰμι
  choice: الذي أنا له
  rationale: صياغة موجزة تحفظ حرفية معنى الانتماء أو الاختصاص بالله أكثر من توسيعها تفسيريًا.
- source_word: ᾧ καὶ λατρεύω
  choice: والذي أعبده أيضًا
  rationale: الفعل يدل هنا على العبادة أو الخدمة الدينية المقدمة لله، و«أعبده» واضحة في العربية مع إبقاء «أيضًا» مقابل καί.
- source_word: ἄγγελος
  choice: ملاك
  rationale: السياق سياق رسالة إلهية وطمأنة خارقة للطبيعة، ولذلك فالمعنى المقصود هو الملاك لا الرسول البشري.
theological_decisions:
- issue: ترجمة οὗ εἰμι
  choice: الذي أنا له
  alternative: الذي أنتمي إليه
  rationale: تحفظ الصياغة علاقة الاختصاص والانتماء التي يصرح بها اليوناني من غير تحميلها تحديدًا عقائديًا زائدًا، بينما يوضح البديل معناها بأسلوب أكثر تفسيرًا.
- issue: ترجمة λατρεύω
  choice: أعبده
  alternative: أخدمه
  rationale: في علاقته بالله يدل الفعل عادة على خدمة دينية تعبدية؛ «أعبده» تنقل هذه القوة بوضوح، مع إثبات «أخدمه» في الحاشية لأنه بديل لغوي معتبر وقد يشمل معنى الخدمة المقدسة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حوفظ على ترتيب الفكرة اليونانية قدر الإمكان، مع استعمال الإضافة العربية الطبيعية في «ملاك الله». جاءت علامتا الحاشية في النص بحسب موضعي العبارتين اللتين تشرحانهما.
