lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: بعد قليل
  rationale: تعبير زمني اصطلاحي يفيد مرور مدة قصيرة، وهذه صياغة عربية طبيعية وموجزة.
- source_word: δὲ
  choice: ولكن
  rationale: يفيد انتقالًا سرديًا مشوبًا بالمقابلة مع الظروف المواتية في السياق السابق.
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: اندفعت من جهة الجزيرة
  rationale: الفعل مع κατά والمضاف إليه يصوّر هبوب الريح بعنف من ناحية الجزيرة أو منحدرةً منها. ذُكرت «الجزيرة» إيضاحًا لمرجع الضمير المؤنث الأرجح في السياق، مع تجنب صياغة توحي بأن الجزيرة هي التي ضربتها الريح.
- source_word: ἄνεμος τυφωνικὸς
  choice: ريحٌ إعصارية
  rationale: يحافظ على كون ἄνεμος الاسم الرئيس، وينقل وصف τυφωνικός لريح دوّامية شديدة من غير إسناد فئة أرصادية حديثة محددة إليها.
- source_word: ὁ καλούμενος
  choice: تُسمّى
  rationale: صيغة عربية طبيعية لتقديم اسم الريح، وتوافق تأنيث «ريح».
- source_word: Εὐρακύλων
  choice: أوراكيلون
  rationale: نقل صوتي للاسم العلم الوارد في نص SBLGNT بدل ترجمته تفسيرًا إلى «الشمالية الشرقية» أو اعتماد القراءة النصية الأخرى.
