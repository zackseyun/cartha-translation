  rationale: استُبدلت العبارة الحرفية الثقيلة «يمدّوا مراسي» بـ«يلقوا مراسي» لتؤدي الفعل اليوناني في معناه الملاحي السياقي. كما استُبدلت «متظاهرين بأنهم مزمعون» بـ«بحجة أنهم على وشك أن» لصياغة فصحى أوضح تحفظ دلالة الذريعة والقصد الوشيك. وأُبقيت الجملة منتهية بفاصلة لأنها متصلة نحويًا بما يلي في الآية التالية.
