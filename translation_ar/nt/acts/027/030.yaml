lexical_decisions:
- source_word: ναυτῶν
  choice: البحّارة
  rationale: تعبير عربي فصيح وواضح يدل على العاملين في الملاحة على متن السفينة.
- source_word: ζητούντων φυγεῖν
  choice: كان البحّارة يحاولون الهرب
  rationale: الفعل ζητέω مع المصدر يفيد هنا السعي أو المحاولة، و«الهرب» يلائم قصدهم ترك السفينة سرًّا.
- source_word: χαλασάντων τὴν σκάφην
  choice: أنزلوا القارب الصغير
  rationale: σκάφη هو القارب الصغير التابع للسفينة، و«أنزلوا» ينقل حركة إنزاله إلى الماء بوضوح.
- source_word: εἰς τὴν θάλασσαν
  choice: إلى البحر
  rationale: ترجمة مباشرة وطبيعية للعبارة اليونانية.
- source_word: προφάσει ὡς
  choice: متظاهرين بأنهم
  rationale: ينقل كون السبب المعلن ذريعة تخفي نيتهم الحقيقية، بصياغة عربية طبيعية.
- source_word: ἐκ πρῴρης
  choice: من المقدّمة
  rationale: يشير إلى مقدمة السفينة، وهو تعبير مفهوم لعموم القراء مع إثبات البديل البحري في الحاشية.
- source_word: ἀγκύρας μελλόντων ἐκτείνειν
  choice: مزمعون أن يمدّوا مراسي
  rationale: μέλλω يدل على القصد الوشيك، وἐκτείνω يعني حرفيًا المدّ أو البسط؛ وتحافظ الصياغة على صورة إخراج المراسي من مقدمة السفينة دون تخصيص غير لازم.
