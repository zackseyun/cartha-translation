  register: عربية فصحى حديثة واضحة وكريمة، مع إبقاء البنية جملةً تابعة تنتهي بفاصلة كما في النص المصدر، لأن الآية التالية تتمم الحدث. استُخدم «القارب الصغير» بدل مصطلح بحري نادر، و«المقدّمة» في المتن مع توضيح «الجؤجؤ» في الحاشية.
