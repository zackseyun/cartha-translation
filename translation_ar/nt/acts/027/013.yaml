lexical_decisions:
- source_word: Ὑποπνεύσαντος
  choice: هبّت ... خفيفة
  rationale: يدل الفعل على هبوب الريح برفق؛ وهذه الصياغة عربية طبيعية تحفظ معنى الخفة من غير إثقال.
- source_word: νότου
  choice: ريحٌ جنوبية
  rationale: يشير νότος هنا إلى ريح آتية من الجنوب، والنكرة تلائم وروده بلا أداة تعريف في التركيب اليوناني.
- source_word: δόξαντες
  choice: ظنّوا
  rationale: ينقل الحكم الذاتي الذي كوّنه البحارة بناءً على تغيّر الريح، من غير الإيحاء باليقين.
- source_word: τῆς προθέσεως
  choice: غرضهم
  rationale: المقصود الهدف العملي أو الخطة التي أراد البحارة تنفيذها، لا معنى لاهوتيًا اصطلاحيًا.
- source_word: κεκρατηκέναι
  choice: قد حقّقوا
  rationale: يفيد في هذا السياق أنهم حسبوا أنهم أدركوا مقصدهم أو ضمنوا نجاح خطتهم؛ و«حقّقوا غرضهم» تعبير عربي واضح.
- source_word: ἄραντες
  choice: فرفعوا المرساة
  rationale: الفعل يعني حرفيًا الرفع، والمفعول المحذوف مفهوم بحريًا على أنه المرساة؛ فصُرّح به للوضوح.
- source_word: ἆσσον
  choice: على مقربة من الساحل
  rationale: يحفظ معنى الظرف المقارن «أقرب/على نحو أقرب» ويبيّن مرجعه الملاحي المفهوم من السياق.
- source_word: παρελέγοντο
  choice: أخذوا يبحرون بمحاذاة
  rationale: للفعل استعمال بحري يعني الإبحار بمحاذاة الساحل، والصياغة واضحة وفصيحة في العربية المعاصرة.
- source_word: τὴν Κρήτην
  choice: كريت
  rationale: أُبقي اسم الجزيرة كما في اليونانية، بينما عبّرت «بمحاذاة» عن دلالة السير على امتداد ساحلها.
