  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: ar
  text: ولمّا أخذت ريحٌ جنوبية تهبّ برفق، ظنّوا أنهم قد حقّقوا غرضهم، فرفعوا المرساة[a] وأخذوا يبحرون بمحاذاة كريت، أقرب إلى الساحل[b].
  philosophy: optimal-equivalence
  footnotes:
