  to: ولمّا أخذت ريحٌ جنوبية تهبّ برفق، ظنّوا أنهم قد حقّقوا غرضهم، فرفعوا المرساة[a] وأخذوا يبحرون بمحاذاة كريت، أقرب إلى الساحل[b].
  rationale: يُظهر التعديل بدء هبوب الريح بلطف، ويستبدل الوصف غير المقارن للقرب بصياغة تحفظ دلالة ἆσσον المقارنة في سياق الإبحار الساحلي. كما تُصحَّح الحاشية ب لتكون عربية طبيعية ومتصلة بدلالة اللفظ اليوناني.
