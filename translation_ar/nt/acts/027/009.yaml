lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: بعد أن مضى وقت طويل
  rationale: ينقل تركيب الحال المطلق الدال على انقضاء مدة ملحوظة، بصياغة عربية طبيعية من غير مبالغة في تحديد طولها.
- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: وصار الإبحار خطرًا
  rationale: يفيد أن الملاحة البحرية غدت في ذلك الوقت محفوفة بالخطر؛ و«الإبحار» أدق هنا من «السفينة» لأن πλοῦς يدل على السفر أو الملاحة بحرًا.
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: لأن الصوم أيضًا كان قد مضى
  rationale: يحفظ التعليل، ودلالة καί على «أيضًا»، وكون الصوم قد أصبح في الماضي، من غير إدخال تحديده الثقافي في صلب النص.
- source_word: παρῄνει
  choice: أخذ بولس ينصحهم
  rationale: «ينصح» ينقل معنى الإرشاد والحث دون تقوية الفعل إلى تحذير صريح، و«أخذ» تلائم انتقال السرد إلى مضمون نصيحته في الآية التالية.
