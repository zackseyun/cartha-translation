    issue: «وصار الإبحار خطرًا»
    rationale: الفعل «صار» قد يجعل الخطر تحوّلًا واقعًا في تلك اللحظة. اليونانية ὄντος ... ἐπισφαλοῦς تصف وضع الإبحار بأنه كان بالفعل خطرًا؛ و«كان الإبحار قد أصبح خطرًا» أنسب للسياق ولـἤδη.
  - severity: medium
    issue: «لأن الصوم أيضًا كان قد مضى»
    rationale: καὶ مع «الصوم» هنا ذات معنى تقووي («حتى الصوم...») لا مجرد إضافة محايدة («أيضًا»).
  - severity: low
    issue: «أخذ بولس ينصحهم»
    rationale: قد تفيد «أخذ» ابتداء النصح، وهو غير مصرح به في παρῄνει. الماضي الناقص «كان بولس ينصحهم» يحفظ الوصف السردي دون هذه الزيادة.
  - severity: low
    issue: موضع علامة الحاشية
    rationale: الأفضل أن ترد العلامة بعد «الصوم» مباشرة لأن الحاشية تشرح هذا المصطلح، لا في نهاية الجملة.
