lexical_decisions:
- source_word: ἤμεθα
  choice: كان عددنا
  rationale: الفعل في صيغة المتكلم الجمع، لذا حُفظ معنى «كنا» مع صياغة عربية طبيعية تلائم ذكر العدد الإجمالي.
- source_word: δὲ
  choice: الواو في «وكان»
  rationale: أداة ربط سردية خفيفة هنا، فترجمت بالواو من غير إضفاء معنى زمني أو تقابلي قوي.
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: جميعًا ... شخصًا
  rationale: تدل ψυχαί في سياق إحصاء ركاب السفينة على الأشخاص، لا على الأرواح غير المادية؛ و«جميعًا» تعكس معنى الشمول في πᾶσαι.
- source_word: ἐν τῷ πλοίῳ
  choice: في السفينة
  rationale: ترجمة مباشرة وطبيعية للعبارة المكانية.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: مئتين وستة وسبعين
  rationale: يحفظ العدد الدقيق، وجاء منصوبًا وفق موقعه في الصياغة العربية.
theological_decisions:
- issue: دلالة ψυχαί
  choice: شخصًا
  alternative: نفسًا / روحًا
  rationale: السياق سياق تعداد الموجودين في السفينة، ولذلك تشير الكلمة إلى الأشخاص أو الأنفس بمعنى البشر، ولا تقرر هنا طبيعة النفس أو انفصالها عن الجسد.
translation_notes:
  register: عربية فصحى واضحة وموقرة. حُفظ ضمير المتكلم الجمع في «عددنا» بدل تحويل العبارة إلى تركيب وجودي، مع تقديم صياغة عربية طبيعية للتعداد.
