  text: وكان مجموعنا، نحن جميع من في السفينة، مئتين وستة وسبعين شخصًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «وكنا، جميع النفوس في السفينة، مئتين وستة وسبعين». والمقصود بـ«النفوس» هنا الأشخاص، لا الأرواح غير المادية على وجه التحديد.'
