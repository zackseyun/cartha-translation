  register: عربية فصحى حديثة واضحة ذات نبرة سردية رصينة. استُخدم وصف بحري مفهوم للقارئ العام، مع شرح التعبير الملاحي الحرفي في الحاشية. وُضع رمز الحاشية [a] عند العبارة التي تشرحها، لا بعد «ببطء»، اتساقًا مع مضمون الحاشية والنص اليوناني.
