  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: ar
  text: وأبحرنا ببطء لأيام كثيرة، ووصلنا بصعوبة إلى محاذاة كنيدوس. ولأن الريح لم تسمح لنا بالتقدّم[a]، أبحرنا تحت حماية كريت[b]، قبالة سلموني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لم تدعنا الريح نقترب». والعبارة اليونانية تركيب مطلق بصيغة الجر يبيّن سبب تغيير مسارهم.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أبحرنا تحت كريت»، أي في الجانب من الجزيرة المحمي من الريح.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: أيامًا كثيرة
  rationale: ينقل تعبير الزمن مدة الإبحار الطويلة بصياغة عربية طبيعية، لا مجرد وقوع الحدث في أيام متعددة.
- source_word: βραδυπλοοῦντες
  choice: أبحرنا ببطء
  rationale: يحافظ على الصورة البحرية وعلى معنى بطء سير السفينة، مع إبقاء معنى المشقة مستقلًا في العبارة التالية.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: وصلنا بمشقّة إلى قبالة كنيدوس
  rationale: تنقل «بمشقّة» دلالة μόλις، وتعبّر «إلى قبالة» عن الموقع البحري إزاء المدينة.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: لأن الريح لم تسمح لنا بالتقدّم
  rationale: تفيد العبارة اليونانية المطلقة سبب تغيير المسار، والفعل يحتمل منع الاقتراب أو مواصلة التقدم؛ واختيار «التقدّم» طبيعي في السياق ولا يحدّد وجهة غير مصرّح بها.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: أبحرنا بمحاذاة الجانب المحمي من كريت
  rationale: يعبّر الفعل البحري عن الإبحار في الجانب الواقع في حماية الجزيرة من الريح، بدل ترجمة مكانية حرفية قد تكون مبهمة بالعربية.
- source_word: κατὰ Σαλμώνην
  choice: قبالة سلموني
  rationale: تؤدي κατά هنا معنى الموقع البحري قبالة المعلم الساحلي.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: كنيدوس / كريت / سلموني
  rationale: نقل صوتي واضح ومتداول لأسماء المواضع اليونانية.
