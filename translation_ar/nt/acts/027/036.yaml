lexical_decisions:
- source_word: εὔθυμοι
  choice: تشجَّعوا
  rationale: يدل الوصف على صيرورتهم في حال من طيب النفس وارتفاع المعنويات؛ و«تشجَّعوا» طبيعية في سياق الخوف من الغرق، من غير أن توحي بخفة «فرحوا».
- source_word: δὲ
  choice: فـ
  rationale: تفيد هنا انتقال السرد والنتيجة المتصلة بما فعله بولس في الآية السابقة، لا تضادًّا قويًّا.
- source_word: γενόμενοι
  choice: تشجَّعوا
  rationale: دُمج معنى اسم الفاعل الأَورِسْتي مع εὔθυμοι في فعل عربي يدل على الدخول في حالة جديدة.
- source_word: πάντες
  choice: جميعًا
  rationale: تحافظ على شمول كل من كانوا على السفينة بصياغة عربية موجزة وطبيعية.
- source_word: καὶ αὐτοὶ
  choice: هم أيضًا
  rationale: تحفظ قوة الضمير التوكيدية والإضافة، وتبيّن أن الآخرين اقتدوا ببولس.
- source_word: προσελάβοντο
  choice: أخذوا
  rationale: يحفظ التعبير اليوناني «أخذوا طعامًا» من غير اختزاله إلى «أكلوا»، مع وضوح المعنى في السياق.
- source_word: τροφῆς
  choice: طعامًا
  rationale: هو المقابل العربي المباشر والطبيعي لما يؤكل طلبًا للقوت.
