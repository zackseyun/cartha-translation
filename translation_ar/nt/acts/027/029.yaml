base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: ar
  text: وإذ خافوا أن ننجرف إلى مواضع وعرة[a]، ألقوا من مؤخر السفينة أربع مراسٍ، وظلوا يصلّون أن يطلع النهار[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تدفعنا الريح إلى صخور مسننة»، أو: «أن نرتطم بمواضع صخرية وعرة».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أن يصير نهارًا». ويمكن أن يعني الفعل أيضًا: «ظلوا يتمنون أن يطلع النهار».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί
  choice: وإذ خافوا
  rationale: تنقل اسم الفاعل الظرفي بوصفه الدافع إلى إلقاء المراسي والصلاة، وتحافظ على انسياب السرد العربي.
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: أن ننجرف إلى مواضع وعرة
  rationale: يفيد التعبير الخشية من أن تدفع السفينة إلى ساحل أو صخور خطرة. و«ننجرف إلى» ملائم للسياق البحري من غير أن يحدد طبيعة الموضع بأكثر مما يقوله اليوناني.
- source_word: ἐκπέσωμεν
  choice: ننجرف
  rationale: يُستعمل الفعل هنا بحريًا في معنى اندفاع السفينة إلى اليابسة أو الصخور بفعل الظروف، لا مجرد السقوط الحرفي.
- source_word: ἐκ πρύμνης
  choice: من مؤخر السفينة
  rationale: تعبير عربي واضح ودقيق للمؤخرة البحرية، وأسهل فهمًا للقارئ العام من المصطلح التقني «الكوثل».
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: ألقوا ... أربع مراسٍ
  rationale: ينقل الفعل السابق للفعل الرئيس بصياغة عربية طبيعية، مع إبقاء صورة إلقاء المراسي الملموسة.
- source_word: ηὔχοντο
  choice: ظلوا يصلّون
  rationale: يحفظ معنى الصلاة المرجح في السياق، وتفيد «ظلوا» الاستمرار الذي يدل عليه الماضي الناقص اليوناني.
- source_word: ἡμέραν γενέσθαι
  choice: أن يطلع النهار
  rationale: صياغة عربية طبيعية لمعنى حلول النهار أو مجيء ضوئه، مع حفظ التعبير الحرفي البديل في الحاشية.
theological_decisions:
- issue: دلالة ηὔχοντο بين الصلاة والتمني
  choice: ظلوا يصلّون
  alternative: كانوا يتمنون
  rationale: الفعل يحتمل الصلاة أو التمني بحسب السياق، واختيار الصلاة وجيه لغويًا هنا، مع التنبيه إلى البديل كي لا يُحسم الاحتمال الدلالي بصمت.
