  text: τῶν δὲ στρατιωτῶν βουλὴ ἐγένετο ἵνα τοὺς δεσμώτας ἀποκτείνωσιν, μή τις ἐκκολυμβήσας διαφύγῃ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/042.yaml
  text: The soldiers’ plan was to kill the prisoners, so that no one might swim away and escape.
translation:
  language: ar
  text: وكانت خطة الجنود أن يقتلوا الأسرى، لئلّا يسبح أحدٌ منهم مبتعدًا فيفلت.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: فقرّر
  rationale: ينقل طبيعيًا نشوء خطة الجنود واتخاذهم القرار، بدل الصياغة الاسمية الثقيلة «كانت خطة الجنود».
- source_word: τοὺς δεσμώτας
  choice: الأسرى
  rationale: يدل السياق على المحتجزين المقيّدين المنقولين إلى روما؛ و«الأسرى» لفظ عربي واضح غير محصور في أسرى الحرب.
- source_word: ἐκκολυμβήσας
  choice: يسبح ... هاربًا
  rationale: الفعل يدل على الفرار بالسباحة، وقد صيغ بحيث يبقى التمييز بين السباحة والنجاة اللاحقة ظاهرًا.
- source_word: διαφύγῃ
  choice: ينجو
  rationale: يفيد الإفلات والهرب الناجح، ويكمل معنى محاولة الفرار بالسباحة.
theological_decisions:
- issue: قوة μή τις بعد جملة الغرض
  choice: لئلّا يسبح أحد منهم هاربًا وينجو
  alternative: كي لا يسبح أحد منهم هاربًا وينجو
  rationale: «لئلّا» تنقل غرض منع النتيجة المقصودة من خطة القتل، من غير إضافة تفسير عقدي أو أخلاقي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة؛ استُخدمت جملة فعلية طبيعية، وحُفظ تسلسل السباحة بقصد الهرب ثم النجاة.
