id: ACT.27.22
reference: Acts 27:22
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: ar
  text: والآن أحثّكم أن تتشجّعوا[a]، لأنه لن تُفقَد حياةُ أحدٍ منكم[b]، وإنما ستُفقَد السفينة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تطيب نفوسكم» أو «أن تحافظوا على شجاعتكم».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «لن تكون خسارةُ نفسٍ منكم»؛ والمقصود بـ«النفس» هنا حياة الإنسان.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: والآن
  rationale: تعبير زمني اصطلاحي يمهّد للحثّ الحاضر، وصياغة «والآن» طبيعية وموجزة في العربية.
- source_word: παραινῶ
  choice: أحثّكم
  rationale: ينقل قوة النصيحة المشجِّعة في السياق من غير إفراط في الرسمية.
- source_word: εὐθυμεῖν
  choice: أن تتشجّعوا
  rationale: يدل الفعل على التحلي بالشجاعة وطيب النفس؛ وهذه صياغة عربية واضحة وملائمة لخطر العاصفة.
- source_word: ἀποβολὴ ψυχῆς
  choice: تُفقَد حياةُ أحدٍ
  rationale: ἀποβολή تعني الخسارة هنا، وψυχή تشير في السياق إلى الحياة الجسدية لا إلى النفس بوصفها متميزة عن الجسد.
- source_word: οὐδεμία ἔσται ἐξ ὑμῶν
  choice: لن تُفقَد حياةُ أحدٍ منكم
  rationale: تحافظ الصياغة على النفي الشامل وعلى دلالة الجماعة التي لن يُفقد منها أحد.
- source_word: πλὴν τοῦ πλοίου
  choice: وإنما ستُفقَد السفينة
  rationale: التركيب اليوناني موجز وفيه حذف مفهوم؛ صيغت المقابلة طبيعيًا بالعربية لإيضاح أن الخسارة ستقتصر على السفينة.
theological_decisions:
- issue: دلالة ψυχή
  choice: الحياة الجسدية
  alternative: النفس
  rationale: السياق يتحدث عن النجاة من الغرق، فلا ينبغي تحميل اللفظة هنا معنى أنثروبولوجيًا خاصًا يتعلق بالنفس غير المادية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم المبني للمجهول في جملة الفقد للمحافظة على التركيز على انتفاء الخسارة، وصيغ الاستثناء مقابلةً طبيعية مع إبقاء المعنى البحري واضحًا.
