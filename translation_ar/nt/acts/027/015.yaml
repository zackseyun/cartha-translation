- from: ولمّا جرفت الريح السفينة، ولم تعد قادرة على مواجهة الريح، استسلمنا لها، فأخذت تدفعنا معها.
  to: ولما وقعت السفينة في قبضة الريح ولم تستطع السفينة مواجهة الريح، استسلمنا لها، فصرنا ننجرف معها.
  rationale: تُصحح المراجعة إحالة الفاعل في الشطر الأخير وتحافظ على الاستمرار في «فصرنا ننجرف». كما تصوغ وقوع السفينة تحت قوة خارجية بصورة عربية واضحة، وتحفظ عدم تسمية الريح بالعاصفة. لا يلزم نقل الحاشية الإنجليزية ذات البديل المعجمي لأنها لا تعالج خلافًا نصيًا أو معلومة لازمة للقارئ العربي.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:23:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'المسودة تنقل تسلسل المعنى الأساسي بدقة عامة: استيلاء الريح على السفينة، عجزها عن مواجهتها، ثم الكف عن مقاومتها والانجراف. لكن «فأخذت تدفعنا معها» تجعل الريح فاعلًا صريحًا لفعل دفع الأشخاص، في حين أن اليونانية تصفنا بالمحمولين/المنجرفين، في سياق السفينة، كما أن مرجع الضمائر أقل إحكامًا.'
  naturalness: الفصحى سليمة في الجملة، لكن تتابع الضمائر المؤنثة في «استسلمنا لها، فأخذت تدفعنا معها» يتيح التباسًا عابرًا بين الريح والسفينة. إعادة تسمية السفينة في موضع العجز، ثم صياغة الانجراف بصيغة الجمع، أوضح وأقرب إلى السرد العربي الطبيعي.
  terminology: «السفينة» و«مواجهة الريح» مناسبتان. تُحافَظ «الريح» دون تحويلها إلى «عاصفة». وتعبير «وقعت السفينة في قبضة الريح» يصوغ أثر συναρπασθέντος (أن تُؤخَذ أو تُستولى عليها) عربيًا بصورة طبيعية من غير ادعاء تفصيل غير وارد في النص.
  issues:
  - severity: medium
    issue: صياغة «فأخذت تدفعنا معها» تحول الحمل/الانجراف المبني للمجهول إلى فعل دفع صريح من الريح على الأشخاص.
    rationale: ἐφερόμεθα تعني أنهم كانوا يُحملون أو يُساقون على نحو مستمر؛ والصياغة المعدلة تحفظ هذا الأثر مع إبقاء المشهد الملاحي مرتبطًا بالسفينة.
  - severity: low
    issue: مرجع الضمائر المؤنثة في آخر الجملة غير محكم تمامًا.
    rationale: الريح والسفينة مؤنثتان، وتكرار الاسم عند وصف عجز السفينة يزيل إمكان التباس الفاعل، ولا سيما في القراءة السريعة.
