  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: ar
  text: ولما وقعت السفينة في قبضة الريح ولم تستطع السفينة مواجهة الريح، استسلمنا لها، فصرنا ننجرف معها.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναρπασθέντος
  choice: جرفت الريح
  rationale: يفيد الفعل المبني للمجهول أن قوة خارجية باغتت السفينة واستولت عليها. ذِكر الريح فاعلًا في العربية يوضح المعنى الطبيعي في السياق من غير إضافة قوة غير مذكورة.
- source_word: πλοίου
  choice: السفينة
  rationale: المقابل العربي الطبيعي والواضح في هذا السياق الملاحي.
- source_word: μὴ δυναμένου
  choice: لم تعد قادرة
  rationale: ينقل عدم القدرة بصياغة عربية سلسة، مع الإشارة إلى تعذر مواصلة محاولة مواجهة الريح بعد أن جُرفت السفينة.
- source_word: ἀντοφθαλμεῖν
  choice: مواجهة
  rationale: الفعل يحمل صورة التوجه في وجه الريح أو مقاومتها، و«مواجهة الريح» تعبير عربي واضح يحفظ الصورة من غير إفراط في التفسير الملاحي.
- source_word: ἀνέμῳ
  choice: الريح
  rationale: اللفظ اليوناني يعني الريح، ولا يقتضي بذاته ترجمتها بعاصفة أو زوبعة، وإن كان السياق عاصفًا.
- source_word: ἐπιδόντες
  choice: استسلمنا لها
  rationale: في السياق الملاحي يدل على الكف عن المقاومة وترك السفينة لقوة الريح. عود الضمير إلى الريح يجعل العبارة طبيعية وواضحة.
- source_word: ἐφερόμεθα
  choice: فأخذت تدفعنا معها
  rationale: 'ينقل المبني للمجهول والاستمرار في الفعل الناقص اليوناني: صارت السفينة ومن فيها تتحرك بقوة الريح لا بتوجيههم.'
- source_word: δέ
  choice: ولمّا
  rationale: يصل الحدث بما قبله ويصوغ الظرف المصاحب صياغة سردية عربية طبيعية.
theological_decisions: []
