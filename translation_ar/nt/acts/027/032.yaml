lexical_decisions:
- source_word: τότε
  choice: حينئذٍ
  rationale: تفيد التتابع الزمني في السرد، و«حينئذٍ» صياغة عربية واضحة وموجزة.
- source_word: ἀπέκοψαν
  choice: قطع
  rationale: ينقل فعل بتر الحبال وفصلها نقلًا مباشرًا من غير إضافة معنى غير مذكور.
- source_word: οἱ στρατιῶται
  choice: الجنود
  rationale: المقابل العربي المعتاد والدقيق للفاعل المذكور.
- source_word: τὰ σχοινία
  choice: حبال
  rationale: لفظ واضح يلائم عُدّة السفينة والسياق البحري.
- source_word: τῆς σκάφης
  choice: الزورق
  rationale: يدل هنا على المركب الصغير التابع للسفينة، ويُبقيه متميزًا من السفينة الكبيرة.
- source_word: εἴασαν
  choice: تركوه
  rationale: ينقل معنى السماح بحدوث الفعل اللاحق، مع إحالة الضمير إلى الزورق.
- source_word: αὐτὴν
  choice: ـه
  rationale: الضمير في «تركوه» يعود طبيعيًا في العربية إلى «الزورق».
- source_word: ἐκπεσεῖν
  choice: يسقط مبتعدًا
  rationale: يحافظ على صورة السقوط أو الانفصال في الفعل اليوناني، مع الإشارة إلى ابتعاد الزورق في السياق البحري دون حصر المعنى في الانجراف وحده.
