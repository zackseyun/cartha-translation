  source_fidelity: 'المعنى العام منقول بأمانة: غياب الشمس والنجوم مدة طويلة، واستمرار عاصفة شديدة، ثم اضمحلال الأمل في النجاة. لكن «أخذ ... يتلاشى» يركّز على بدء التلاشي أكثر من فعلٍ مستمرّ في الماضي، في حين يدلّ الماضي الناقص المبني للمجهول περιῃρεῖτο على أن الأمل كان يُنتزع أو يتبدد على نحو مستمر.'
