  rationale: عُدِّلت صياغة زوال الرجاء إلى «كان ... يتلاشى» لتعكس استمرارية الماضي الناقص بعبارة عربية طبيعية. كما نُقِّحت الحاشية لتبيّن بدقة صيغة الفعل اليوناني المبنية للمجهول، مع الإبقاء على «ننجو» ترجمةً واضحة ملائمة للسياق البحري.
