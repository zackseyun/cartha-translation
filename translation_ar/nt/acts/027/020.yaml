  terminology: «النجاة» مناسبة تمامًا لسياق الخطر البحري، ولا توحي بخلاص لاهوتي. غير أن الحاشية ينبغي أن تراعي أن الفعل اليوناني هنا مبني للمجهول؛ فلا يصح عرض «يَخلُص/ينجو» و«يُنقَذ» بوصفهما بديلين مجردين من بيان اختلاف الصيغة.
