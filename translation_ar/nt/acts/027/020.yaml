base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: ar
  text: ولمّا لم تظهر الشمس ولا النجوم أيامًا كثيرة، وكانت عاصفة غير هيّنة تضغط علينا، كان كل رجاء في أن ننجو[a] يتلاشى منذ ذلك الحين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن نُنقَذ». الفعل اليوناني هنا بصيغة المبني للمجهول، ويمكن ترجمته «أن ننجو» أو «أن نُنقَذ»؛ والمقصود النجاة الجسدية من العاصفة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: تظهر
  rationale: يفيد الفعل ظهور الأجرام السماوية أو صيرورتها مرئية؛ و«تظهر» عربية طبيعية تلائم سياق الاهتداء بالشمس والنجوم من غير حصر المعنى في سطوع الضوء.
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: أيامًا كثيرة
  rationale: ينقل التعبير مدة ممتدة عبر عدد كبير من الأيام بعبارة عربية واضحة ومباشرة.
- source_word: χειμῶνός
  choice: عاصفة
  rationale: يدل اللفظ في هذا السياق البحري على الطقس العاصف، لا على فصل الشتاء.
- source_word: οὐκ ὀλίγου
  choice: غير هيّنة
  rationale: تحافظ العبارة على أسلوب النفي للتوكيد، مع وضوحها في العربية الحديثة ودلالتها على شدة العاصفة.
- source_word: ἐπικειμένου
  choice: تضغط علينا
  rationale: تنقل معنى الثقل المستمر الواقع عليهم من العاصفة، لا مجرد اقترابها.
- source_word: λοιπὸν
  choice: منذ ذلك الحين
  rationale: يبين الانتقال إلى المرحلة الناتجة من الأزمة، حين بدأ الرجاء يزول.
- source_word: περιῃρεῖτο
  choice: أخذ ... يتلاشى
  rationale: يعكس صيغة الماضي الناقص المبني للمجهول مسارًا متدرجًا لفقدان الرجاء، بصياغة عربية طبيعية.
- source_word: ἐλπὶς πᾶσα
  choice: كل رجاء
  rationale: يحفظ شمول العبارة اليونانية وشدة اليأس.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: في أن ننجو
  rationale: يعبّر عن مضمون الرجاء، ويؤدي في هذا السياق معنى النجاة الجسدية من الموت في البحر من غير إيحاء لاهوتي زائد.
theological_decisions:
- issue: دلالة σῴζεσθαι في سياق الرحلة البحرية
  choice: النجاة الجسدية من الهلاك في البحر، بصيغة «أن ننجو»
  alternative: أن نُخلَّص أو أن نُنقذ
  rationale: السياق المباشر هو العاصفة وخطر الغرق، ولذلك المقصود حفظ الحياة والنجاة الجسدية، لا الخلاص الروحي؛ وتبقي الحاشية البديل المعجمي الممكن ظاهرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوكيد في «غير هيّنة»، وأُبرز التدرج في زوال الرجاء بتركيب «أخذ ... يتلاشى»، مع وضع علامة الحاشية عند اللفظ الذي تشرحه.
