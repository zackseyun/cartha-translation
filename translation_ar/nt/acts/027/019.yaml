lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: في اليوم الثالث
  rationale: تعبير زمني بصيغة المجرور مع العدد الترتيبي، واليوم مفهوم من السياق؛ والتصريح به طبيعي وواضح في العربية.
- source_word: αὐτόχειρες
  choice: بأيديهم
  rationale: يحفظ دلالة أنهم باشروا العمل شخصيًا وبأيديهم، وهي أقوى من مجرد «بأنفسهم».
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: عُدَّة السفينة
  rationale: تشير σκευή في السياق البحري إلى معدات السفينة ولوازمها؛ و«العُدّة» تعبير عربي موجز وطبيعي لا يحصر المعنى في نوع تقني بعينه.
- source_word: ἔρριψαν
  choice: ألقوا ... في البحر
  rationale: الفعل يعني الرمي أو الإلقاء، والسياق يقتضي إخراج العدة من السفينة إلى البحر؛ فجُعل الاتجاه الضمني صريحًا بعبارة عربية طبيعية.
