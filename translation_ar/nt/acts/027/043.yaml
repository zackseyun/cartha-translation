  yaml_path: translation/nt/acts/027/043.yaml
  text: But the centurion[a], wanting to save Paul, kept them from their plan, and ordered those who were able to swim to jump overboard first and get to land[b],
translation:
  language: ar
  text: لكن قائد المئة، إذ أراد أن ينقذ بولس، منعهم من تنفيذ خطتهم[a]، وأمر القادرين على السباحة أن يلقوا بأنفسهم من السفينة أولًا ويتجهوا إلى البر[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي خطتهم لقتل الأسرى، المذكورة في العدد السابق. ويمكن ترجمة العبارة: «حال بينهم وبين تنفيذ عزمهم».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أن يلقوا بأنفسهم أولًا ويخرجوا إلى البر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: قائد المئة
  rationale: لقب عسكري روماني، وهذه المقابلة العربية المألوفة توضّح رتبته من غير إطالة.
- source_word: βουλόμενος
  choice: إذ أراد
  rationale: ينقل رغبة قائد المئة وقصده في سياق سردي طبيعي، من غير المبالغة في قوة عزمه.
- source_word: διασῶσαι
  choice: أن ينقذ
  rationale: يدل هنا على إبقاء بولس حيًّا وحمايته من الخطر، و«ينقذ» واضحة وملائمة للسياق.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: منعهم من تنفيذ خطتهم
  rationale: يعبّر عن الحيلولة بينهم وبين إتمام ما عزموا عليه، أي قتل الأسرى المذكور في العدد السابق.
- source_word: ἐκέλευσέν τε
  choice: وأمر
  rationale: ينقل بوضوح سلطة الضابط وإصداره أمرًا.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: القادرين على السباحة
  rationale: تعبير عربي موجز وطبيعي يحدّد الفئة المقصودة على متن السفينة.
- source_word: ἀπορίψαντας
  choice: أن يلقوا بأنفسهم من السفينة
  rationale: يحافظ على صورة إلقاء النفس من السفينة، مع التصريح بالسفينة الذي يوضحه السياق.
- source_word: πρώτους
  choice: أولًا
  rationale: 'يحافظ على ترتيب المجموعات: يبدأ القادرون على السباحة قبل سواهم.'
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: ويتجهوا إلى البر
  rationale: ينقل الحركة المقصودة من البحر نحو اليابسة من غير افتراض أنهم بلغوها بالفعل.
