  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: ar
  text: وفي اليوم التالي رَسَوْنا في صيدا، وعامل يوليوس بولس برفق[a]، فأذن له أن يذهب إلى أصدقائه لينال العناية[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «بإنسانية» أو «بلطف»؛ فاللفظ اليوناني يصف معاملة رحيمة كريمة، ولا سيما تجاه سجين.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «ليحصل على الرعاية» أو «ليتلقى المساعدة»؛ فالتعبير اليوناني واسع، وقد يشمل تلبية أصدقائه احتياجاته العملية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: وفي اليوم التالي
  rationale: تعبير زمني سردي يدل هنا على اليوم التالي، والصياغة العربية طبيعية وتحفظ تسلسل الرحلة.
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: رَسَوْنا في صيدا
  rationale: للفعل في سياق الملاحة معنى الوصول بالسفينة إلى الميناء؛ و«رسونا» تؤدي المعنى البحري بوضوح أكثر من «وصلنا» العامة.
- source_word: φιλανθρώπως ... χρησάμενος
  choice: عامل ... برفق
  rationale: يدل التركيب على معاملة تتسم باللطف والإنسانية؛ و«برفق» عربية واضحة تحفظ نبرة إحسان قائد المئة إلى سجين.
- source_word: ἐπέτρεψεν
  choice: فأذن له
  rationale: ينص الفعل على منح الإذن، والفاء توضح الصلة الناتجة عن حسن معاملة يوليوس دون إضافة معنى غريب.
- source_word: πρὸς τοὺς φίλους
  choice: إلى أصدقائه
  rationale: أداة التعريف تشير على الأرجح إلى معارف بولس في صيدا، والإضافة بالضمير هي التعبير العربي الطبيعي.
- source_word: πορευθέντι
  choice: أن يذهب
  rationale: اسم الفاعل اليوناني مرتبط بفعل الإذن، ويؤدى طبيعيًا في العربية بمصدر مؤول.
- source_word: ἐπιμελείας τυχεῖν
  choice: لينال منهم العناية
  rationale: يفيد التركيب الحصول على عناية أو مساعدة لازمة. أُضيف «منهم» لإظهار صلة العناية بالأصدقاء المذكرين، وهي مفهومة من ترتيب الأصل.
