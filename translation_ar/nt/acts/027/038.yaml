  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «شبعوا من الطعام» بدل تعبير حرفي ثقيل، و«أخذوا يخففون» لنقل البعد الاستمراري أو البدئي للماضي الناقص. أما «حمولة السفينة» فهي صياغة عربية اصطلاحية توضح أن التخفيف كان بطرح ما تحمله السفينة، من غير تغيير الحدث المروي.
