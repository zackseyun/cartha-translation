  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: ar
  text: وبعدما شبعوا من الطعام[a]، أخذوا يخففون من حمولة السفينة[b] بإلقاء القمح[c] في البحر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «امتلأوا من الطعام» أو «اكتفوا من الطعام».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كانوا يخففون من حمولة السفينة» أو ببساطة: «خففوا من حمولة السفينة». قد يدل الماضي الناقص اليوناني على استمرار الفعل أو على الشروع فيه.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «الحبوب». اللفظ اليوناني أوسع دلالة، لكنه يشير هنا على الأرجح إلى القمح تحديدًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: شبعوا من الطعام
  rationale: ينقل معنى الامتلاء بالطعام والوصول إلى الشبع بصياغة عربية طبيعية، مع إبراز العلاقة الزمنية للمشاركة الأوريستية بواسطة «بعدما».
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تتابع السرد، والواو أنسب مقابل طبيعي لها هنا.
- source_word: ἐκούφιζον τὸ πλοῖον
  choice: أخذوا يخففون حمولة السفينة
  rationale: الماضي الناقص اليوناني قد يصور بدء الفعل أو استمراره؛ وتعبير «أخذوا يخففون» يحفظ الدلالة البدئية، بينما توضح «حمولة السفينة» المقصود بصورة عربية مألوفة.
- source_word: ἐκβαλλόμενοι
  choice: بإلقاء
  rationale: المشاركة الحالية تبين الوسيلة التي خففوا بها السفينة، ولذلك تنقلها الباء السببية/الوسيلية بوضوح.
- source_word: τὸν σῖτον
  choice: القمح
  rationale: يمكن أن يدل اللفظ على الحبوب عمومًا، لكنه يُستعمل كثيرًا للقمح، وهو المعنى الأرجح في سياق سفينة الحبوب.
- source_word: εἰς τὴν θάλασσαν
  choice: في البحر
  rationale: صياغة عربية طبيعية لحركة الإلقاء إلى داخل البحر، وتحفظ الصورة البحرية بوضوح.
