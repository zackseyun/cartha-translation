  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: ar
  text: لكن قائد المئة كان يثق بربان السفينة ومالكها أكثر مما كان يثق بما كان يقوله بولس.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكن قائد المئة كان يصغي إلى ربان السفينة ومالكها أكثر مما كان يصغي إلى كلام بولس».'
    reason: يعكس هذا البديل إمكان فهم ἐπείθετο هنا بمعنى الإصغاء وإعطاء المصداقية، لا مجرد الاقتناع الداخلي.
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: قائد المئة
  rationale: مصطلح عربي تاريخي واضح للضابط الروماني المعروف بالـcenturion، ويحافظ على دلالة الرتبة.
- source_word: κυβερνήτῃ
  choice: ربان السفينة
  rationale: يدل في السياق البحري على المسؤول عن قيادة السفينة وتوجيهها، مع تمييزه عن مالكها.
- source_word: ναυκλήρῳ
  choice: مالكها
  rationale: يفيد مالك السفينة أو القائم الرئيس على تشغيلها؛ والضمير يجعل العبارة طبيعية من غير طمس الفرق بين الدورين.
- source_word: μᾶλλον ἐπείθετο
  choice: اقتنع ... أكثر مما اقتنع
  rationale: ينقل مباشرة معنى التأثر بالحجة أو الاقتناع، ويحفظ قوة المقارنة في μᾶλλον ... ἢ.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: بما قاله بولس
  rationale: صياغة عربية طبيعية تنقل مضمون الأقوال المنسوبة إلى بولس دون إضافة تفسير إلى مشورته.
- source_word: δὲ
  choice: لكن
  rationale: تُظهر المقابلة مع تحذير بولس في السياق السابق.
- source_word: ἢ
  choice: مما
  rationale: تؤدي وظيفة أداة المقارنة مع «أكثر» في تركيب عربي طبيعي.
