translation:
  language: ar
  text: وأما الباقون، فبعضهم على ألواح، وبعضهم على أشياء من السفينة. وهكذا وصل الجميع سالمين إلى البر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «نجا الجميع إلى البر» أو «أفلت الجميع سالمين إلى الشاطئ». يدل الفعل اليوناني هنا على النجاة الجسدية من تحطم السفينة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: الباقون
  rationale: تشير العبارة إلى من تبقّى من الناس بعد الفئة المذكورة في العدد السابق، و«الباقون» تعبير عربي طبيعي ودقيق.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: فبعضهم ... وبعضهم
  rationale: تنقسم المجموعة الباقية إلى فئتين؛ وتحافظ هذه الصياغة على التقابل اليوناني بأسلوب عربي سلس.
- source_word: ἐπὶ σανίσιν
  choice: على ألواح
  rationale: تعني σανίς لوحًا خشبيًا، و«ألواح» ملائمة لسياق تحطم السفينة دون زيادة تفسيرية.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: على أشياء من السفينة
  rationale: العبارة اليونانية غير محددة وتشير إلى أشياء ما من السفينة؛ لذا تحافظ «أشياء من السفينة» على هذا الإبهام بدل افتراض أنها حطام أو قطع بعينها.
- source_word: οὕτως
  choice: وهكذا
  rationale: تلخص الطريقة التي جرى بها الوصول إلى البر، وهي صياغة سردية عربية طبيعية.
- source_word: ἐγένετο
  choice: وصل
  rationale: أُدمجت دلالة حدوث النتيجة في العبارة العربية «وهكذا وصل» تجنبًا للتركيب الثقيل «وحدث أن»، مع إبقاء النتيجة واضحة.
- source_word: πάντας διασωθῆναι
  choice: وصل الجميع سالمين
  rationale: يفيد الفعل النجاة والوصول الآمن عبر خطر الغرق. وتوضح الصياغة المعنى الجسدي في هذا السياق من غير إيحاء لاهوتي زائد، مع نقل شمول πάντας.
- source_word: ἐπὶ τὴν γῆν
  choice: إلى البر
  rationale: في السياق البحري تعني γῆ اليابسة في مقابل البحر، و«البر» هو التعبير العربي المألوف والدقيق.
theological_decisions:
- issue: احتمال حمل διασωθῆναι على معنى الخلاص الروحي
  choice: وصل الجميع سالمين إلى البر
  alternative: نجا الجميع إلى البر / أُنقذ الجميع إلى البر
  rationale: السياق المباشر هو النجاة الجسدية من تحطم السفينة. تختار الصياغة معنى السلامة المادي الواضح، من غير إدخال دلالة عقائدية لا يقتضيها السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ عدم التحديد في «أشياء من السفينة»، واستُعمل «البر» بوصفه المقابل الطبيعي للبحر. وُضعت علامة الحاشية بعد الجملة التي تتناول البدائل اللفظية.
