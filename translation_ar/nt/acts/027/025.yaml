  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: ar
  text: لذلك تشجَّعوا يا رجال، لأني أصدِّق الله[a] أن الأمر سيكون تمامًا كما قيل لي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أثق بالله». يمكن أن يؤكد التركيب اليوناني الثقة بالله أو تصديق ما قاله الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تفيد الاستنتاج مما سبق من تطمين ووعد، و«لذلك» تحفظ الصلة المنطقية بوضوح.
- source_word: εὐθυμεῖτε
  choice: تشجَّعوا
  rationale: صيغة أمر تدعو إلى الثبات وارتفاع المعنويات وسط الخطر، وهي عبارة عربية طبيعية وواضحة.
- source_word: ἄνδρες
  choice: يا رجال
  rationale: تحفظ النداء الصريح بصيغة جمع الذكور الموجَّه إلى من كانوا على السفينة.
- source_word: πιστεύω τῷ θεῷ
  choice: أصدِّق الله
  rationale: تركيب πιστεύω مع المجرور باليونانية يدل هنا مباشرة على تصديق الله والأخذ بكلامه، مع بقاء معنى الثقة قريبًا.
- source_word: ὅτι
  choice: أن
  rationale: تُدخل مضمون تصديق بولس، لا سبب ذلك التصديق.
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: أن الأمر سيكون تمامًا كما
  rationale: تعبّر العبارة عن المطابقة بين ما سيحدث وما أُبلغ به بولس؛ وإضافة «الأمر» توضح مرجع الفعل الناقص طبيعيًا من غير زيادة تفسيرية جوهرية.
- source_word: λελάληταί μοι
  choice: قيل لي
  rationale: تحفظ المبني للمجهول والإبلاغ السابق لبولس. ويؤدي الماضي العربي المعنى طبيعيًا، بينما تُفهم الصلة الحاضرة من السياق والوعد.
theological_decisions:
- issue: ترجمة πιστεύω τῷ θεῷ
  choice: أصدِّق الله
  alternative: أثق بالله
  rationale: «أصدِّق الله» تحفظ القوة الشخصية والقضوية للتركيب، أي قبول كلام الله على أنه حق، من دون حصره في مفهوم عام للإيمان. وتُذكر دلالة الثقة الممكنة في الحاشية صونًا للتداخل الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «تشجَّعوا» بدل تعبيرات أقدم مثل «طيبوا نفسًا»، وحُفظ النداء الذكوري الصريح «يا رجال» ومبني المجهول في «قيل لي».
