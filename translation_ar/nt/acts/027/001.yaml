  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: ar
  text: ولمّا تقرَّر أن نُبحر إلى إيطاليا، سلَّموا بولس وبعض السجناء الآخرين إلى قائد مئة اسمه يوليوس، من الكتيبة الأوغسطية[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الكتيبة الإمبراطورية»؛ وربما «كتيبة سباستي». تعكس الكلمة اليونانية Σεβαστῆς لقبًا مرتبطًا بأغسطس أو بالإمبراطور، لكن تحديد الوحدة العسكرية المقصودة على وجه الدقة غير مؤكد.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκρίθη
  choice: تقرَّر
  rationale: صيغة الماضي المبني للمجهول مستعملة هنا استعمالًا غير شخصي للدلالة على قرار رسمي؛ و«تقرَّر» تحافظ على هذا المعنى بصياغة عربية طبيعية.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς
  choice: أن نُبحر
  rationale: المصدر المعرّف يبيّن مضمون القرار، و«نُبحر» تنقل دلالة الانطلاق بحرًا وتحافظ على سرد المتكلم الجمع.
- source_word: παρεδίδουν
  choice: سلَّموا
  rationale: تفيد نقل السجناء رسميًا إلى عهدة قائد المئة، وهي عبارة عربية واضحة في هذا السياق.
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: بولس وبعض السجناء الآخرين
  rationale: تنقل اقتران بولس بسجناء آخرين من غير تكلف، وتؤدي τινας بمعنى «بعض» وδεσμώτας بمعنى «السجناء».
- source_word: ἑκατοντάρχῃ
  choice: إلى قائد مئة
  rationale: الداتيف يحدد من نُقلت إليه العهدة، و«قائد مئة» تسمية عربية شفافة للرتبة الرومانية.
- source_word: ὀνόματι Ἰουλίῳ
  choice: اسمه يوليوس
  rationale: صياغة عربية طبيعية لعبارة التعريف بالاسم.
- source_word: σπείρης Σεβαστῆς
  choice: من الكتيبة الأوغسطية
  rationale: «الأوغسطية» ترجمة مباشرة نسبيًا للصفة Σεβαστῆς المرتبطة بلقب أغسطس/الإمبراطور، مع إبقاء تعيين الوحدة التاريخية غير المحسوم في الحاشية.
theological_decisions:
- issue: دلالة σπείρης Σεβαστῆς، وهي تسمية عسكرية تاريخية مختلف في تحديدها
  choice: من الكتيبة الأوغسطية
  alternative: من الكتيبة الإمبراطورية؛ وربما من كتيبة سباستي
  rationale: يحافظ الاختيار على الصلة اللفظية بلقب أغسطس من غير الجزم بالهوية الدقيقة للوحدة؛ وتُذكر الاحتمالات الأخرى في الحاشية صونًا لعدم اليقين التاريخي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «ولمّا» لنقل الترابط السردي في Ὡς δὲ دون إضافة ظرف بمعنى «الآن»، ووُضعت علامة الحاشية عند العبارة التي تتناولها مباشرة.
