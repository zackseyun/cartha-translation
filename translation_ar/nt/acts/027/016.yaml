    text: 'أو: «بعد أن أبحرنا إلى الجهة المحمية من الريح لجزيرة صغيرة تُدعى كودا». يستخدم الأصل اليوناني تعبيرًا ملاحيًا يفيد الاحتماء بالجزيرة من الريح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: جزيرة صغيرة
  rationale: ينقل معنى صيغة التصغير في νησίον بلغة عربية طبيعية واضحة.
- source_word: δέ
  choice: ولما
  rationale: أُدمج الانتقال السردي في تركيب زمني عربي سلس؛ ولا يلزم هنا إظهار δέ بأداة استدراك مستقلة.
- source_word: ὑποδραμόντες
  choice: مررنا بمحاذاة ... مستترين بها من الريح
  rationale: يبيّن الدلالة البحرية للفعل، أي الإبحار في الجانب المحمي من الجزيرة، من غير استعمال مصطلح ملاحي غامض لعامة القراء.
- source_word: καλούμενον Καῦδα
  choice: تُدعى كودا
  rationale: تعبير عربي مباشر عن اسم الجزيرة، مع نقل Καῦδα صوتيًا إلى «كودا».
- source_word: ἰσχύσαμεν μόλις
  choice: لم نتمكن إلا بشق الأنفس
  rationale: يحفظ معنى القدرة المصحوبة بصعوبة شديدة، وهو تعبير عربي طبيعي.
- source_word: περικρατεῖς γενέσθαι
  choice: من السيطرة على
  rationale: 'يحفظ المعنى الحرفي نسبيًا: التمكن من القارب وإحكام التحكم فيه، دون افتراض تفصيل غير مصرح به مثل ربطه.'
- source_word: τῆς σκάφης
  choice: قارب السفينة
  rationale: يوضح أن المقصود القارب الصغير التابع للسفينة، لا السفينة نفسها.
