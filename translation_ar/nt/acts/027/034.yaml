  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: ar
  text: لذلك أحثّكم أن تتناولوا شيئًا من الطعام، فهذا لسلامتكم[a]؛ فلن تهلك شعرة من رأس أحد منكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لخلاصكم». يمكن للكلمة اليونانية أن تعني الخلاص أو النجاة أو الحفظ؛ والمقصود هنا، بحسب السياق، نجاتهم الجسدية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تفيد الاستنتاج مما سبق، وتحافظ على الصلة المنطقية بأسلوب عربي طبيعي.
- source_word: παρακαλῶ
  choice: أحثّكم
  rationale: تنقل معنى الطلب الجاد والتشجيع الملحّ الملائم للموقف.
- source_word: μεταλαβεῖν τροφῆς
  choice: أن تتناولوا شيئًا من الطعام
  rationale: تعبير عربي واضح وطبيعي عن أخذ الغذاء، مع إبراز المعنى العملي في السياق.
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: لأن هذا ضروريّ لسلامتكم
  rationale: يفيد التركيب أن تناول الطعام يخدم نجاتهم وحفظهم؛ و«سلامتكم» تلائم الخطر الجسدي المباشر من غير حصر المجال الدلالي للكلمة اليونانية دون تنبيه.
- source_word: σωτηρίας
  choice: سلامتكم
  rationale: السياق سياق نجاة جسدية من خطر البحر، و«السلامة» عربية طبيعية تشمل الحفظ والنجاة، مع إثبات البديل الأوسع في الحاشية.
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: أحد منكم
  rationale: يحافظ على القوة التوزيعية للتركيب اليوناني في صياغة عربية مألوفة.
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: شعرة من رأس
  rationale: ينقل الصورة الاصطلاحية اليونانية مباشرة وبوضوح، وهي كناية عن السلامة التامة.
- source_word: ἀπολεῖται
  choice: تهلك
  rationale: تعكس معنى ἀπόλλυμι في المستقبل وتحافظ على قوة التأكيد في الصورة، وإن كان المقصود عدم ضياع شعرة واحدة.
theological_decisions:
- issue: دلالة σωτηρία في السياق
  choice: السلامة والنجاة الجسدية
  alternative: الخلاص
  rationale: المقام المباشر هو النجاة من العاصفة وتحطم السفينة؛ لذلك يدل اللفظ هنا أساسًا على الحفظ الجسدي. وتُذكر سعة اللفظ اليوناني في الحاشية بدل إقحام معنى خلاصي عقائدي في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. اختير «تتناولوا شيئًا من الطعام» بدل تعبيرات أقدم مثل «تأخذوا غذاء»، واختيرت «سلامتكم» لتكون طبيعية في سياق الخطر مع إبقاء البديل الدلالي في الحاشية.
