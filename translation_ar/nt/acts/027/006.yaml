  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: ar
  text: وهناك وجد قائد المئة سفينةً إسكندريةً مبحرةً إلى إيطاليا، فأصعدنا إليها.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: وهناك
  rationale: يحفظ كلاً من أداة العطف والدلالة المكانية في صياغة عربية طبيعية متصلة بالسياق السردي.
- source_word: εὑρὼν
  choice: وجد
  rationale: اسم الفاعل اليوناني السابق للفعل الرئيس يدل على فعل تم أولاً؛ وصيغة الفعل العربية مع العطف تنقل تسلسل الحدث بوضوح من غير حرفية ثقيلة.
- source_word: ἑκατοντάρχης
  choice: قائد المئة
  rationale: تعبير عربي واضح ودقيق للرتبة العسكرية الرومانية، ويحافظ على مدلولها العددي التاريخي.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: سفينةً إسكندريةً
  rationale: النعت اليوناني يصف السفينة بأنها إسكندرية، من حيث المنشأ أو الانتساب على الأرجح، من غير حسم زائد لطبيعة هذا الانتساب.
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: مبحرةً إلى إيطاليا
  rationale: ينقل اسم الفاعل الحاضر واتجاه الرحلة بعبارة بحرية عربية طبيعية، مع إبقاء إيطاليا غاية الإبحار.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: فأصعدنا إليها
  rationale: الفعل سببي بمعنى جعلنا نصعد إلى السفينة؛ و«أصعدنا إليها» موجز وطبيعي ويحفظ كون قائد المئة هو الذي رتّب صعودهم.
