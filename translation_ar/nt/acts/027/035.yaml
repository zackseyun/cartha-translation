source:
  edition: SBLGNT
  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: ar
  text: وبعد أن قال هذا، أخذ خبزًا وشكر الله أمام الجميع[a]، ثم كسره وبدأ يأكل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على مرأى من الجميع».'
    reason: بديل معجمي لعبارة ἐνώπιον πάντων يبرز كون الفعل واقعًا علنًا أمام أنظارهم.
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: وبعد أن قال هذا
  rationale: تؤدي صيغة اسم الفاعل الأوريستي معنى الفعل السابق للفعل الرئيس، وتفيد δὲ انتقالًا سرديًا خفيفًا لا يحتاج في العربية إلى أداة استدراك مستقلة. ويعود اسم الإشارة إلى كلام بولس السابق.
- source_word: λαβὼν ἄρτον
  choice: أخذ خبزًا
  rationale: يحافظ التنكير على عدم تحديد النص هل المقصود رغيف كامل أم مقدار من الخبز، وتأتي العبارة طبيعية وواضحة في العربية.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: شكر الله
  rationale: ترجمة مباشرة واضحة للفعل مع متعلقه، من غير إضفاء صياغة طقسية لا يصرح بها السياق.
- source_word: ἐνώπιον πάντων
  choice: أمام الجميع
  rationale: تعبير عربي طبيعي ينقل علنية الفعل ووقوعه في حضور كل من كانوا هناك.
- source_word: κλάσας
  choice: ثم كسره
  rationale: تدل الصيغة الأوريستية على أن كسر الخبز سبق البدء بالأكل، ويعود الضمير بوضوح إلى الخبز.
- source_word: ἤρξατο ἐσθίειν
  choice: وبدأ يأكل
  rationale: ينقل بوضوح معنى الشروع الذي تؤديه صيغة ἄρχομαι مع المصدر.
theological_decisions:
- issue: احتمال وجود صدى لعشاء الرب في تسلسل أخذ الخبز والشكر والكسر والأكل
  choice: صياغة الأفعال بوصفها أحداثًا سردية عادية من غير توصيفها بأنها ممارسة طقسية
  alternative: استخدام تعبيرات كنسية تقليدية توحي صراحةً بعشاء الرب
  rationale: قد يذكّر تسلسل الأفعال القارئ بمشاهد عشاء الرب، لكن الآية نفسها تصف أكل بولس العلني على السفينة ولا تسمي الفعل عشاء الرب؛ لذلك تُحفظ الإشارة المحتملة من غير تحويلها إلى تقرير عقائدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة، مع ترتيب سردي طبيعي والمحافظة على تعاقب الأفعال في النص اليوناني.
