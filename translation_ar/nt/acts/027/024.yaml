  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: ar
  text: 'قال: «لا تخف يا بولس. لا بد أن تقف أمام قيصر. وها إن الله قد وهبك جميع الذين يبحرون معك».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ
  choice: لا بد أن
  rationale: تنقل معنى الضرورة الإلهية أو المقررة في السياق من غير زيادة تفسيرية.
- source_word: παραστῆναι
  choice: تقف أمام
  rationale: تعبير عربي طبيعي يحفظ معنى المثول أمام قيصر.
- source_word: ἰδοὺ
  choice: وها إن
  rationale: أداة تنبيه عربية فصيحة وواضحة تحافظ على قوة الالتفات في النص.
- source_word: κεχάρισταί σοι
  choice: قد وهبك
  rationale: تحفظ دلالة العطية الممنوحة تفضّلًا، مع كون بولس هو المستفيد من نجاة مرافقيه.
- source_word: τοὺς πλέοντας μετὰ σοῦ
  choice: الذين يبحرون معك
  rationale: ترجمة مباشرة وطبيعية لعبارة المشاركين لبولس في الرحلة البحرية.
theological_decisions:
- issue: طبيعة الضرورة في δεῖ
  choice: لا بد أن تقف
  alternative: ينبغي أن تقف
  rationale: يحافظ الاختيار على قوة الضرورة من دون التصريح بأنها قضاء إلهي، وهو أمر يفهم من السياق الأوسع.
- issue: دلالة منح جميع المبحرين لبولس
  choice: قد وهبك جميع الذين يبحرون معك
  alternative: قد أنعم عليك بنجاة جميع الذين يبحرون معك
  rationale: يحفظ الاختيار إيجاز الأصل وتوتره الدلالي، ولا يضيف لفظ «النجاة» رغم أنه المقصود سياقيًا.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدم «قيصر» بوصفه اللقب المألوف، وحُفظت صيغة الخطاب المباشر وإيجاز النص اليوناني.
