  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: ar
  text: ولمّا طلع النهار، لم يتعرّفوا على الأرض، لكنهم أبصروا خليجًا فيه شاطئ، فعزموا، إن استطاعوا، أن يدفعوا السفينة إلى الشاطئ فيه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يُجنِحوا بالسفينة فيه». يدل الفعل اليوناني على دفع السفينة أو سوقها بقوة إلى الشاطئ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: ولمّا طلع النهار
  rationale: صياغة عربية طبيعية تدل على حلول ضوء النهار، مع نقل δέ بواو الاستئناف الخفيفة من غير إضافة ظرف بمعنى «الآن».
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: لم يتعرّفوا إلى الأرض
  rationale: ينقل ἐπιγινώσκω بمعنى التعرّف أو التحقق من الهوية، مع إبقاء γῆ على معناها العام «الأرض» دون تخصيصها بالساحل.
- source_word: κόλπον δέ τινα κατενόουν
  choice: لكنهم أبصروا خليجًا
  rationale: «خليجًا» ملائم للسياق البحري، والتنكير ينقل τινα، و«أبصروا» يفيد الملاحظة البصرية الواعية في هذا السياق.
- source_word: ἔχοντα αἰγιαλὸν
  choice: فيه شاطئ
  rationale: صياغة عربية واضحة تحافظ على كون الخليج ذا شاطئ، من غير افتراض أن الشاطئ رملي.
- source_word: ἐβουλεύοντο
  choice: فعزموا
  rationale: ينقل اتخاذهم خطة أو قصدًا عمليًا، وهو أنسب للسياق من مجرد التفكير غير المحسوم.
- source_word: εἰ δύναιντο
  choice: إن استطاعوا
  rationale: يحفظ معنى الإمكان المشروط والنتيجة غير المضمونة.
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: أن يدفعوا السفينة إليه لتستقر على الشاطئ
  rationale: يبين الفعل البحري المقصود، أي دفع السفينة بقوة إلى الخليج حتى تستقر على الشاطئ، بلغة مفهومة لا توحي بمجرد الاقتراب أو الرسو المعتاد.
