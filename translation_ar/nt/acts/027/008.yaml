lexical_decisions:
- source_word: μόλις
  choice: بصعوبة
  rationale: ينقل معنى إتمام الإبحار بمشقة، ويحافظ على تشديد السرد على صعوبة التقدم.
- source_word: τε
  choice: و
  rationale: يربط الجملة بما قبلها ربطًا سرديًا طبيعيًا من غير مبالغة في ترجمة الأداة.
- source_word: παραλεγόμενοι
  choice: أبحرنا بمحاذاة ساحلها
  rationale: الفعل مصطلح ملاحي يدل على السير بحرًا بمحاذاة الساحل؛ وصياغة العربية بالفعل الماضي تلائم اقترانه بالفعل الرئيس وتوضح المعنى.
- source_word: αὐτὴν
  choice: ساحلها
  rationale: الضمير يعود إلى كريت في السياق السابق، وإظهار الساحل في العربية ينسجم مع الدلالة الملاحية للفعل من غير تغيير المرجع.
- source_word: ἤλθομεν
  choice: وصلنا
  rationale: ترجمة طبيعية لفعل الحركة في سياق بلوغ وجهة بعد رحلة شاقة.
- source_word: εἰς τόπον τινὰ
  choice: إلى موضع
  rationale: تنقل عدم التعيين الذي تفيده τινά بصياغة عربية طبيعية؛ ولا حاجة إلى «موضع ما» لأن الاسم النكرة يؤدي المعنى.
- source_word: καλούμενον
  choice: يُدعى
  rationale: صياغة عربية واضحة ومألوفة عند تقديم اسم مكان.
- source_word: Καλοὺς Λιμένας
  choice: الموانئ الحسنة
  rationale: يُترجم معنى اسم المكان اليوناني ترجمة شفافة، مع استعمال الجمع لأن Λιμένας جمع.
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: وكانت بالقرب منه مدينة اسمها لاسائية
  rationale: يحفظ مرجع الضمير إلى الموضع، ودلالة القرب، وتنكير πόλις، ثم يقدم اسم المدينة بعبارة عربية سلسة.
