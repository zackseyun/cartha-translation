  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: ar
  text: «وَأَمَّا الأُمَّةُ الَّتِي سَيَخْدِمُونَهَا[a]، فَسَأَدِينُهَا أَنَا»، قَالَ اللهُ، «وَبَعْدَ ذَلِكَ سَيَخْرُجُونَ وَيَعْبُدُونَنِي[b] فِي هَذَا الْمَكَانِ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأمة التي سيستعبدهم أهلها» أو «الأمة التي سيخدمونها عبيدًا». يستعمل اليوناني فعل «يخدم»، لكن السياق هو استعباد إسرائيل في مصر.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يخدمونني». يمكن أن يدل الفعل اليوناني على الخدمة الدينية أو العبادة المقدمة لله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: الأُمَّة
  rationale: يدل اللفظ هنا على الكيان القومي الذي سيستعبد نسل إبراهيم، في صدى لتكوين 15:14؛ و«الأمة» هي المقابل العربي الطبيعي المفرد.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: التي سيخدمونها
  rationale: يحافظ هذا التعبير على صيغة الفعل الدالة على الخدمة، بينما يوضح السياق أن المقصود خدمة العبودية القسرية؛ وقد أُثبت هذا المعنى في الحاشية دون استبدال الصياغة الأصلية بتفسير كامل.
- source_word: κρινῶ ἐγώ
  choice: فسأدينها أنا
  rationale: «أدين» يحفظ معنى إجراء القضاء الإلهي، والضمير المنفصل «أنا» يعكس توكيد ἐγώ في اليونانية.
- source_word: ὁ θεὸς εἶπεν
  choice: قال الله
  rationale: صياغة عربية فصيحة وطبيعية لإسناد القول إلى الله داخل الاقتباس.
- source_word: μετὰ ταῦτα
  choice: وبعد ذلك
  rationale: ينقل تعاقب الأحداث بوضوح وطبيعية، مع تجنب الصياغة الحرفية الثقيلة «بعد هذه الأشياء».
- source_word: ἐξελεύσονται
  choice: سيخرجون
  rationale: يشير الفعل في السياق إلى خروج نسل إبراهيم من أرض الاستعباد، و«سيخرجون» مقابل مباشر وسلس.
- source_word: λατρεύσουσίν μοι
  choice: ويعبدونني
  rationale: الفعل يدل هنا على خدمة دينية مقدمة لله؛ و«يعبدونني» يؤدي هذا المعنى بوضوح، مع ذكر «يخدمونني» بوصفه بديلاً معجمياً في الحاشية.
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: في هذا المكان
  rationale: ترجمة مباشرة وطبيعية تحافظ على الإشارة المكانية في كلام استفانوس وصدى الوعد القديم.
theological_decisions:
- issue: دلالة δουλεύω في سياق العبودية
  choice: سيخدمونها
  alternative: سيُستعبَدون لها / سيخدمونها عبيدًا
  rationale: يحافظ النص الرئيس على الدلالة الفعلية العامة، ولا يخفي أن السياق هو استعباد إسرائيل في مصر؛ لذلك تُذكر الدلالة الأقوى في الحاشية من غير حسم زائد داخل المتن.
- issue: دلالة λατρεύω حين يكون الله هو المتلقي
  choice: يعبدونني
  alternative: يخدمونني
  rationale: يفيد الفعل خدمة دينية أو تعبدية لله، ولذلك تنقل «يعبدونني» قوته السياقية، فيما تحفظ الحاشية احتمال ترجمته حرفياً بالخدمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت «أما... فـ» لإبراز المفعول المقدم في اليونانية، وأُبقي الضمير «أنا» لنقل توكيد المتكلم. وُضع كل رمز حاشية عند اللفظ الذي تشرحه، ولا سيما [b] بعد «يعبدونني».
