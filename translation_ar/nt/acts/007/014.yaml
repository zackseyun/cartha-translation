  source_fidelity: 'النص العربي ينقل ترتيب الفعلين في اليونانية: أرسل يوسف ثم استدعى، ويحافظ على المفعولين «أباه يعقوب وجميع أقربائه». كما ينقل العدد الصريح «خمسة وسبعين» ومعنى ἐν ψυχαῖς بوصفه عدًّا للأشخاص. وعبارة «وكانوا خمسة وسبعين شخصًا» مفهومة وتدل على أن العدد إجمالي.'
  naturalness: الصياغة فصيحة حديثة وسلسة. «ثم أرسل يوسف فاستدعى» تركيب عربي موجز ومقبول، ولا يلزم التصريح بمفعول «أرسل» لأن السياق يفيد الإرسال في طلبهم. «أقربائه» و«شخصًا» اختيارات طبيعية واضحة.
  terminology: 'الأسماء والألفاظ الرئيسة سليمة: يوسف، يعقوب، الأقرباء، والأشخاص. لا توجد مصطلحات لاهوتية محمّلة تحتاج إلى تعديل. الحاشية تميّز بأمانة بين قراءة أعمال «خمسة وسبعين» ومجموع «سبعين» في النص العبري للموضعين المذكورين، من غير مواءمة مصطنعة.'
