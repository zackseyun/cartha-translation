  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: ar
  text: ثم أرسل يوسف فاستدعى أباه يعقوب وجميع أقربائه، وكانوا خمسة وسبعين شخصًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تذكر بعض مواضع العهد القديم أن العدد الإجمالي كان «سبعين» (مثل النص العبري في التكوين 46:27 والخروج 1:5)، أما النص هنا في سفر الأعمال فيقول «خمسة وسبعين».
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: أرسل
  rationale: اسم فاعل ماضٍ يسبق الفعل الرئيس ويدل على أن يوسف أرسل أولًا؛ وصيغة «أرسل» طبيعية في العربية وتحافظ على الفعل من غير إضافة مفعول غير مذكور.
- source_word: δὲ
  choice: ثم
  rationale: أداة تربط بالسياق وتفيد انتقال السرد؛ و«ثم» تلائم تتابع أحداث رواية استفانوس.
- source_word: μετεκαλέσατο
  choice: فاستدعى
  rationale: الفعل المتوسط يعني أن يطلب حضور شخص أو يرسل في طلبه؛ و«استدعى» موجزة وواضحة، والفاء تبين ترتب الاستدعاء على الإرسال.
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: أباه يعقوب
  rationale: ينقل علاقة البدل بين يعقوب وأبيه بصياغة عربية طبيعية، من غير تغيير المرجع.
- source_word: πᾶσαν τὴν συγγένειαν
  choice: جميع أقربائه
  rationale: تدل συγγένεια على جماعة ذوي القرابة؛ و«أقربائه» أوضح للقارئ المعاصر من ألفاظ قديمة مثل «عشيرته»، ولا تحصر الدلالة في أهل البيت المباشرين.
- source_word: ἐν ψυχαῖς
  choice: وكانوا ... شخصًا
  rationale: التعبير اليوناني حرفيًا «في نفوس» اصطلاح لعدّ الأشخاص؛ فصيغته العربية الطبيعية «وكانوا ... شخصًا» تحافظ على معنى الإحصاء دون إيحاء لاهوتي زائد لكلمة «نفوس».
- source_word: ἑβδομήκοντα πέντε
  choice: خمسة وسبعين
  rationale: نقل مباشر للعدد الوارد في النص اليوناني.
theological_decisions:
- issue: عدد أسرة يعقوب بالمقارنة مع تقاليد نص سفر التكوين
  choice: خمسة وسبعين شخصًا
  alternative: سبعون شخصًا
  rationale: ينص متن أعمال الرسل اليوناني صراحة على خمسة وسبعين. وتُحفظ هذه القراءة في المتن، بينما يُذكر اختلاف بعض نصوص العهد القديم في الحاشية بدل تسوية التوتر أو مواءمة الأعداد.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختيرت «أقربائه» بدل اللفظ الأقدم «عشيرته»، وصيغ اصطلاح العدّ بصياغة عربية مألوفة. وُضعت علامة الحاشية بعد العبارة العددية لأنها موضع الاختلاف النصي المشار إليه.
