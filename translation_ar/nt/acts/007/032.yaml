  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: ar
  text: «أنا إله آبائك، إله إبراهيم وإسحاق ويعقوب». فارتعب موسى ولم يجرؤ أن ينظر عن كثب[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أن يتفحّص». يمكن أن يدل الفعل اليوناني على النظر المتأني أو الفحص والانتباه الدقيق.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ
  choice: أنا
  rationale: الضمير بارز للتوكيد في صيغة تعريف إلهية اسمية، والعربية الفصحى لا تحتاج إلى فعل رابط في الزمن الحاضر.
- source_word: ὁ θεὸς
  choice: إله
  rationale: تأتي الكلمة خبرًا في جملة التعريف، وإضافتها إلى «آبائك» تجعلها معرفة في العربية من غير حاجة إلى «الـ».
- source_word: τῶν πατέρων σου
  choice: آبائك
  rationale: يحافظ اللفظ على المعنى الحرفي والرنين العهدي لعبارة «آبائك»، بدل تعميمها إلى «أسلافك».
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: إله إبراهيم وإسحاق ويعقوب
  rationale: يحفظ البدل التفسيري وتكرار حرف العطف الذي يمنح الاقتباس إيقاعه الكتابي.
- source_word: ἔντρομος ... γενόμενος
  choice: فارتعب
  rationale: ينقل الدخول في حالة الخوف الشديد بصياغة عربية طبيعية موجزة، مع إبراز التعاقب السردي بالفاء.
- source_word: οὐκ ἐτόλμα
  choice: لم يجرؤ
  rationale: تعبير عربي مباشر ينقل إحجام موسى عن الإقدام.
- source_word: κατανοῆσαι
  choice: أن ينظر عن كثب
  rationale: يفيد الفعل النظر المتأني أو الفحص الدقيق؛ وهذا الاختيار يلائم السياق البصري مع إبقاء البديل الأوسع في الحاشية.
theological_decisions:
- issue: صياغة إعلان الله عن هويته في اقتباس الخروج
  choice: أنا إله آبائك
  alternative: أنا هو إله آبائك
  rationale: النص اليوناني جملة تعريف اسمية لا تتضمن فعلًا رابطًا، والعربية تؤديها طبيعيًا من دون إضافة «هو»، وبذلك يُحفظ التوكيد من غير تحميل العبارة دلالة زائدة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدمت «آبائك» حفاظًا على الصدى العهدي، وصيغ رد فعل موسى بجملة فعلية طبيعية. وُضعت علامة الحاشية [a] في موضع اللفظ الذي تشرحه.
