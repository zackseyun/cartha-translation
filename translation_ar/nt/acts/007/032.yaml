  source_fidelity: 'النص العربي ينقل بدقة البنية والمعنى اليونانيين: التوكيد في «أنا»، وتعريف الله بأنه إله آباء موسى وإبراهيم وإسحاق ويعقوب، ثم انتقال السرد إلى خوف موسى وإحجامه عن النظر المتأني. «فارتعب» تعبير سليم لـ ἔντρομος ... γενόμενος، و«لم يجرؤ أن ينظر عن كثب» يؤدي οὐκ ἐτόλμα κατανοῆσαι بأمانة في السياق البصري.'
