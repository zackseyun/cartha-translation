base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: ar
  text: هذا الرجل احتال على شعبنا، وأساء معاملة آبائنا[a]، فجعلهم يعرّضون أطفالهم[b] للعراء لكي لا يُبقَوا أحياء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: أسلافنا. تستعمل اليونانية اللفظ العائلي التقليدي «الآباء» للإشارة إلى أسلاف إسرائيل.'
    reason: lexical_alternative
  - marker: b
    text: 'أي: يتركون أطفالهم مكشوفين في العراء؛ وكان تعريض الطفل بهذه الصورة يُقصد به تركه ليموت.'
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: هذا
  rationale: يحفظ قوة اسم الإشارة العائد إلى الملك المذكور في السياق، وهو طبيعي في العربية من غير إضافة تفسيرية إلى المتن.
- source_word: κατασοφισάμενος
  choice: احتال على
  rationale: ينقل معنى استعمال الدهاء والمكر ضد شعب إسرائيل، لا مجرد التصرف بحكمة أو فطنة محايدة.
- source_word: τὸ γένος ἡμῶν
  choice: شعبنا
  rationale: المقصود جماعة إسرائيل القومية؛ و«شعبنا» أوضح في العربية المعاصرة من «جنسنا» التي قد توحي بمعنى عرقي حديث غير مقصود.
- source_word: ἐκάκωσεν
  choice: أساء إلى
  rationale: يؤدي معنى إلحاق الأذى وسوء المعاملة من غير تضييقه على صورة واحدة من الاضطهاد.
- source_word: τοὺς πατέρας
  choice: آبائنا
  rationale: يحفظ التعبير العائلي التاريخي التقليدي، مع إمكان فهمه بمعنى الأسلاف.
- source_word: τοῦ ποιεῖν τὰ βρέφη ἔκθετα αὐτῶν
  choice: فجعلهم يطرحون أطفالهم
  rationale: ينقل البناء السببي أو الناتج من إساءة الملك، ويعبّر عن تعريض الأطفال بالمفارقة وتركهم للموت بلغة عربية واضحة، من دون إضافة معنى الإكراه الصريح إلى اليونانية.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: لكيلا يبقوا أحياء
  rationale: يحفظ دلالة الغاية أو النتيجة، ويقارب المبني للمجهول في معنى عدم إبقائهم أحياء بصياغة طبيعية.
theological_decisions:
- issue: 'دلالة τοῦ ποιεῖν: السببية أم الإكراه'
  choice: فجعلهم يطرحون
  alternative: فأجبرهم على أن يطرحوا
  rationale: البناء يدل على التسبب أو النتيجة، أما التصريح بالإجبار فأقوى مما يقوله اللفظ نفسه؛ لذلك حُفظت السببية من غير حسم زائد.
- issue: دلالة εἰς τό بين الغاية والنتيجة
  choice: لكيلا يبقوا أحياء
  alternative: فلم يبقوا أحياء
  rationale: «لكيلا» تحفظ معنى الغاية البارز في البناء اليوناني، مع بقاء إمكان اشتماله سياقيًا على النتيجة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة. استُخدم «احتال على» لإظهار الدهاء العدائي، و«يطرحون أطفالهم» للتعبير الطبيعي عن عادة تعريض الأطفال، مع شرحها في الحاشية. وُضعت علامتا الحاشيتين في المتن عند الموضعين المعنيين.
