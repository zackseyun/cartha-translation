  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: ar
  text: ولم يشأ آباؤنا أن يطيعوه، بل رفضوه[a]، وعادوا في قلوبهم إلى مصر[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «دفعوه عنهم» أو «نبذوه». يوحي الفعل اليوناني، بصورة أقرب إلى الحرفية، بإزاحة موسى جانبًا.'
    reason: lexical_alternative
  - marker: b
    text: أي إنهم اشتاقوا في داخلهم إلى الرجوع إلى مصر، مع أنهم كانوا لا يزالون في البرية.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: الهاء في «يطيعوه»
  rationale: ضمير موصول مفرد في حالة المجرور/المفعول غير المباشر، يعود على موسى المذكور في الآية السابقة. صيغته العربية الطبيعية هنا ضمير متصل بعد فعل الطاعة.
- source_word: οὐκ ἠθέλησαν
  choice: لم يشأ
  rationale: ينقل رفض الإرادة، لا مجرد عدم وقوع الطاعة، ويحافظ على دلالة θέλω في سياق الامتناع المتعمد.
- source_word: ὑπήκοοι γενέσθαι
  choice: أن يطيعوه
  rationale: المعنى الحرفي هو «أن يصيروا طائعين له»، لكن صيغة «أن يطيعوه» أوضح وأطبع في العربية المعاصرة مع إبقاء معنى الخضوع والطاعة.
- source_word: οἱ πατέρες ἡμῶν
  choice: آباؤنا
  rationale: ترجمة مباشرة تحفظ التعبير الكتابي وإشارة استفانوس إلى آباء إسرائيل.
- source_word: ἀπώσαντο
  choice: رفضوه
  rationale: يفيد الفعل الإقصاء والنبذ؛ و«رفضوه» ينقل بوضوح قوة التنكر لموسى، بينما يُذكر المعنى الحسي الأقرب في الحاشية.
- source_word: ἐστράφησαν
  choice: رجعوا
  rationale: يدل السياق على ارتداد الوجهة نحو مصر، لا على مجرد التفات محايد.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: بقلوبهم
  rationale: يحفظ الصورة الكتابية للقلب بوصفه موضع الرغبة والقصد، ويبيّن أن الرجوع كان داخليًا.
- source_word: εἰς Αἴγυπτον
  choice: إلى مصر
  rationale: تنقل حرف الجر الدال على الاتجاه من غير إضافة تفسيرية إلى متن الآية.
theological_decisions:
- issue: طبيعة الرجوع إلى مصر
  choice: «رجعوا بقلوبهم إلى مصر» بوصفه رجوعًا داخليًا في الرغبة والولاء
  alternative: «اتجهت قلوبهم نحو مصر» أو «عادوا إلى مصر في قلوبهم»
  rationale: عبارة «بقلوبهم» تجعل التحول داخليًا مع إبقاء توتر الصورة بين وجودهم خارج مصر وتعلق رغبتهم بها، من غير اختزاله إلى مجاز محض أو رجوع جسدي فعلي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «آباؤنا» للمحافظة على التعبير الكتابي، و«رجعوا بقلوبهم» للموازنة بين قرب الصياغة من الأصل وطبيعية الأسلوب العربي.
