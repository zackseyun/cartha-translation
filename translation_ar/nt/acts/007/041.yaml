  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: ar
  text: وفي تلك الأيام صنعوا عجلًا[a]، وقدَّموا ذبيحةً للصنم، وكانوا يفرحون بأعمال أيديهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صاغوا عجلًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فرحوا بما صنعته أيديهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: صنعوا عجلًا
  rationale: ينقل معنى الفعل المركب بوضوح وإيجاز، بينما يبيّن ذكر «الصنم» بعده أن العجل كان موضوع عبادة.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: في تلك الأيام
  rationale: تعبير زمني عربي طبيعي يحافظ على بنية الأصل.
- source_word: ἀνήγαγον θυσίαν
  choice: قدَّموا ذبيحةً
  rationale: ينقل المعنى الاصطلاحي للفعل في سياق تقديم الذبائح، دون التقيّد بالمعنى الحرفي المكاني.
- source_word: τῷ εἰδώλῳ
  choice: للصنم
  rationale: أل التعريف تشير إلى العجل المذكور، و«الصنم» يحفظ دلالة العبادة الوثنية التي يحملها اللفظ اليوناني.
- source_word: εὐφραίνοντο
  choice: كانوا يفرحون
  rationale: صيغة «كانوا» تحافظ على الجانب الاستمراري للفعل الناقص في اليونانية.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: بأعمال أيديهم
  rationale: يحافظ التعبير على الصورة البلاغية والنبرة الكتابية الناقدة لعبادة ما تصنعه الأيدي، مع صياغة عربية سليمة.
theological_decisions:
- issue: لغة عبادة الأصنام وقوتها البلاغية
  choice: ترجمة εἴδωλον بـ«الصنم» والإبقاء على عبارة «أعمال أيديهم».
  alternative: «التمثال» و«ما صنعته أيديهم».
  rationale: يحفظ هذا الاختيار إدانة عبادة الأصنام وأصداء النقد الكتابي لها، من غير تحويل العبارة إلى وصف محايد للصناعة البشرية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. وُضعت علامة الحاشية [a] بعد «عجلًا» لأنها تخص فعل صنعه، وعلامة [b] بعد العبارة الأخيرة لأنها تعرض صياغة بديلة لها.
