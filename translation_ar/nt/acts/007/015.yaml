lexical_decisions:
- source_word: κατέβη
  choice: نزل
  rationale: يحفظ المعنى الاتجاهي للفعل اليوناني والتعبير الجغرافي المألوف عن الذهاب إلى مصر.
- source_word: Ἰακὼβ
  choice: يعقوب
  rationale: الصيغة العربية الكتابية المستقرة للاسم.
- source_word: εἰς Αἴγυπτον
  choice: إلى مصر
  rationale: تؤدي معنى الحركة نحو المكان بعبارة عربية طبيعية؛ ولا يلزم في العربية استعمال ما يقابل «إلى داخل».
- source_word: ἐτελεύτησεν
  choice: مات
  rationale: أوضح مقابل عربي مباشر للفعل الدال على الموت، من غير تلطيف لا يقتضيه النص.
- source_word: αὐτὸς
  choice: هو
  rationale: إبقاء الضمير الصريح يحفظ بنية العبارة اليونانية التي تذكر يعقوب ثم تضم إليه الآباء.
- source_word: οἱ πατέρες ἡμῶν
  choice: آباؤنا
  rationale: يحفظ اللفظ الأبوي المذكر في اليونانية، والمقصود هنا آباء إسرائيل الأولون.
theological_decisions:
- issue: دلالة οἱ πατέρες ἡμῶν في سياق تاريخ إسرائيل
  choice: آباؤنا
  alternative: أسلافنا
  rationale: اللفظ اليوناني يعني حرفيًا «آباءنا»، ويشير في خطاب استفانوس إلى آباء إسرائيل؛ لذلك حُفظت الصيغة العائلية التاريخية بدل تعميمها إلى «أسلافنا».
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. أُبقي فعل «نزل» لما فيه من دلالة الاتجاه، وحُفظ ترتيب الجملة وضمير «هو» بقدر ما تسمح به العربية الطبيعية.
