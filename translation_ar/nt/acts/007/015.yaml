translation:
  language: ar
  text: ونزل يعقوب إلى مصر، ومات هو وآباؤنا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: أسلافنا. يقول اليوناني حرفيًا: «آباؤنا»، والمقصود آباء إسرائيل الأولون.'
