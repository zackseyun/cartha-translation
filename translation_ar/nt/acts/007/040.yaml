  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: ar
  text: 'قائلين لهارون: «اصنع لنا آلهةً[a] تسير أمامنا؛ لأن موسى هذا[b]، الذي أخرجنا من أرض مصر، لا نعلم ماذا حدث له».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أصنامًا». اللفظ اليوناني حرفيًا «آلهة»، وهو يردد صياغة رواية الخروج ويحفظ قول الشعب نفسه بدل استبداله بوصف تفسيري.'
    reason: lexical_alternative
  - marker: b
    text: 'أو، مع إبراز التصدير الموضوعي: «فأما موسى هذا ... فلا نعلم ماذا حدث له». وقد يحمل اسم الإشارة نبرة تباعد أو استخفاف.'
    reason: discourse_nuance
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: قائلين لهارون
  rationale: يحافظ اسم الفاعل على صلة الكلام بالسياق السابق، ويقدّم مضمون قولهم بصياغة عربية واضحة.
- source_word: Ποίησον ἡμῖν
  choice: اصنع لنا
  rationale: أمر مباشر يعكس معنى ποιέω ويفيد طلب صنع شيء لهم.
- source_word: θεοὺς
  choice: آلهةً
  rationale: هذا هو المعنى المعجمي المباشر للجمع θεοὺς، كما أنه يحافظ على ألفاظ رواية الخروج وعلى ادعاء الشعب نفسه، بدل استبداله بتوصيف تفسيري مثل «أصنام».
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: تسير أمامنا
  rationale: ينقل معنى التقدّم أمامهم دون إضافة معنى القيادة غير المصرّح به صراحة في الفعل.
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: لأن موسى هذا
  rationale: تنقل «لأن» وظيفة γάρ التعليلية، وتحافظ «موسى هذا» على اسم الإشارة وما قد يحمله من نبرة تباعد أو استخفاف.
- source_word: ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου
  choice: أخرجنا من أرض مصر
  rationale: صياغة عربية طبيعية تحفظ فعل الإخراج وذكر «أرض مصر» صراحة.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: لا نعلم ماذا حدث له
  rationale: تعبير عربي معاصر وفصيح ينقل بوضوح عدم معرفتهم بما آل إليه أمر موسى.
theological_decisions:
- issue: ترجمة θεοὺς في سياق عبادة وثنية
  choice: آلهة
  alternative: أصنام
  rationale: النص ينقل طلب الشعب بلفظ «آلهة» ولا يستخدم اسمًا خاصًا بمعنى «أصنام». إبقاء اللفظ يحفظ التوتر والتهكم الضمني في الرواية دون إدخال حكم تفسيري في المتن.
- issue: دلالة اسم الإشارة في ὁ Μωϋσῆς οὗτος
  choice: موسى هذا
  alternative: أما موسى هذا
  rationale: الصياغة المختارة أقرب إلى ترتيب اليونانية وأخف في العربية، مع إبقاء النبرة المحتملة للاستخفاف. أما البديل فيبرز التصدير الموضوعي أكثر مما يلزم.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم «تسير» مع جمع غير العاقل وفق المطابقة العربية المعيارية، ووُضعت شرطة قبل الجملة الختامية لإبراز استئناف قول الشعب من غير تغيير بنيته الدلالية.
