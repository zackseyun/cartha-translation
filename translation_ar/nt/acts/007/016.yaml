base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: ar
  text: ونُقِلوا إلى شكيم، ووُضِعوا في القبر الذي اشتراه إبراهيم بثمنٍ من فضة من بني حمور في شكيم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تجمع صياغة استفانوس تفاصيل يمكن للقارئ مقارنتها بتكوين 23، حيث يشتري إبراهيم موضع دفن، هو مغارة المكفيلة، من عفرون، وبتكوين 33:19، حيث يشتري يعقوب قطعة أرض قرب شكيم من بني حمور.
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: نُقِلوا
  rationale: مبني للمجهول ويدل هنا على نقل رفات الآباء من موضع إلى آخر؛ و«نُقِلوا» عربية واضحة وتحافظ على دلالة الانتقال.
- source_word: Συχὲμ / Συχέμ
  choice: شكيم
  rationale: الصيغة العربية الكتابية الشائعة لاسم المكان.
- source_word: ἐτέθησαν
  choice: وُضِعوا
  rationale: يحافظ على المبني للمجهول وعلى المعنى المباشر للفعل في سياق الدفن، من غير إضافة فعل «دُفنوا» غير الوارد صراحة.
- source_word: μνήματι
  choice: القبر
  rationale: يدل اللفظ على موضع الدفن؛ و«القبر» تعبير عربي طبيعي ودقيق في هذا السياق.
- source_word: ᾧ
  choice: الذي
  rationale: اسم موصول يعود إلى «القبر» ويصل جملة الشراء به بوضوح.
- source_word: ὠνήσατο
  choice: اشتراه
  rationale: ينقل معنى الشراء مباشرة، مع ضمير يعود إلى القبر كما يقتضي تركيب الجملة.
- source_word: τιμῆς ἀργυρίου
  choice: بثمنٍ من الفضة
  rationale: يحافظ على ذكر الثمن والفضة مع صياغة عربية طبيعية.
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: من بني حمور
  rationale: تنقل παρά مع المضاف إليه بوصفها مصدر الشراء، و«بنو حمور» صياغة عربية مألوفة لمعنى أبنائه أو ذريته.
- source_word: ἐν Συχέμ
  choice: في شكيم
  rationale: 'إبقاء العبارة في موضعها الختامي يحافظ على غموض تعلقها النحوي: فقد تتصل ببني حمور أو بمكان المعاملة، من غير حسم زائد.'
theological_decisions:
- issue: التوتر التاريخي مع روايتي شراء موضع الدفن في سفر التكوين
  choice: 'الإبقاء على نص استفانوس كما يرد في اليونانية: إبراهيم اشترى القبر من بني حمور في شكيم.'
  alternative: مواءمة العبارة مع شراء يعقوب قرب شكيم في تكوين 33:19، أو مع شراء إبراهيم مغارة المكفيلة في تكوين 23.
  rationale: أولوية النص اليوناني تقتضي نقله كما هو، مع عدم إزالة التوتر التاريخي بإدخال مواءمة تفسيرية في المتن؛ وتوضح الحاشية مواضع المقارنة للقارئ.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المبني للمجهول موافقةً لبنية الأصل، وأُبقيت العبارة الأخيرة «في شكيم» من غير إعادة ترتيب قد تحسم مرجعها. تظهر علامة الحاشية [a] في المتن.
