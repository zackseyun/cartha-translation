  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: ar
  text: فهرب موسى بسبب هذا الكلام[a]، وصار غريبًا مقيمًا في أرض مديان[b]، حيث أنجب ابنين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «عند سماعه هذا الكلام». ويحتمل التعبير اليوناني أن يشير إلى الكلام بوصفه المناسبة المباشرة لهرب موسى أو سببه.'
    reason: lexical_alternative
  - marker: b
    text: 'أي صار أجنبيًا يقيم في أرض ليست أرضه؛ ويمكن أيضًا: «صار نزيلًا» أو «عاش فيها غريبًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: هرب
  rationale: ينقل فعل φεύγω بصيغة الماضي الدالة على مغادرة موسى خوفًا واتقاءً للخطر، وهو التعبير العربي الطبيعي الموجز.
- source_word: δὲ
  choice: فـ
  rationale: تربط الفاء الحدث بما سبقه وتوحي بالنتيجة أو التعاقب السردي من غير مبالغة في جعل العلاقة سببية صريحة.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: بسبب هذا الكلام
  rationale: السياق يجعل الكلام المذكور باعثًا مباشرًا على هرب موسى. ولفظ «الكلام» يحافظ على سعة λόγος بين القول والعبارة.
- source_word: ἐγένετο πάροικος
  choice: صار غريبًا مقيمًا
  rationale: يجمع التعبير بين كونه أجنبيًا عن الأرض وبين إقامته فيها، فينقل معنى πάροικος بدقة أوضح من «نزيل» أو «غريب» وحدهما.
- source_word: ἐν γῇ Μαδιάμ
  choice: في أرض مديان
  rationale: يحافظ على ذكر γῇ صراحة وعلى الصياغة الجغرافية للمصدر.
- source_word: οὗ
  choice: حيث
  rationale: تعيد أداة المكان إلى أرض مديان بصورة عربية طبيعية.
- source_word: ἐγέννησεν
  choice: أنجب
  rationale: مع موسى فاعلًا، يفيد γεννάω أنه صار أبًا لولدين. «أنجب» فصيحة وطبيعية، من غير عتق «ولد» في هذا الاستعمال.
- source_word: υἱοὺς δύο
  choice: ابنين
  rationale: المقابل العربي المباشر والطبيعي للعبارة، مع استعمال المثنى.
