  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: ar
  text: وحملتم خيمة مولوخ، ونجم الإله ريفان[a]، أي التماثيل[c] التي صنعتموها لتسجدوا لها، وسأنفيكم إلى ما وراء بابل.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض الترجمات، تأثرًا بالنص العبري في عاموس 5:26: «إلهكم ريفان» بدلًا من «الإله ريفان». أما نص أعمال الرسل هنا فيقرأ: «الإله ريفان».'
    reason: alternative_reading
  - marker: b
    text: 'يقرأ نص أعمال الرسل: «إلى ما وراء بابل»، أما عاموس 5:27 فعادةً ما يُترجم: «إلى ما وراء دمشق».'
    reason: cross_reference
  - marker: c
    text: 'أو: «الأشكال» أو «الصور».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνελάβετε
  choice: حملتم
  rationale: ينقل معنى الرفع والحمل في سياق حمل أدوات العبادة الوثنية، من غير زيادة تفسيرية.
- source_word: σκηνὴν
  choice: خيمة
  rationale: المعنى المباشر للكلمة هو «خيمة»، وهو يتجنب الخلط بينها وبين مسكن الله المشروع، بينما «مزار» أكثر تفسيرًا.
- source_word: Μολὸχ
  choice: مولوخ
  rationale: نقل صوتي للاسم اليوناني، بصيغة عربية واضحة وشائعة في الترجمات الكتابية.
- source_word: ἄστρον
  choice: نجم
  rationale: يحافظ على الدلالة المعجمية المباشرة، من غير افتراض أنه مجرد رمز نجمي.
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: الإله ريفان
  rationale: يعكس نص أعمال الرسل اليوناني الذي يقول حرفيًا «الإله ريفان»، لا «إلهكم ريفان».
- source_word: τύπους
  choice: التماثيل
  rationale: في سياق العبادة الوثنية تدل الكلمة على صور أو أشكال مصنوعة؛ و«التماثيل» تعبير عربي طبيعي، مع إثبات البدائل في الحاشية.
- source_word: ἐποιήσατε
  choice: صنعتموها
  rationale: ينقل صيغة الماضي والاتهام المباشر بأن المخاطبين صنعوا هذه التمثيلات.
- source_word: προσκυνεῖν αὐτοῖς
  choice: لتسجدوا لها
  rationale: يحافظ على الصورة الحركية للفعل προσκυνέω وعلى دلالته التعبدية في هذا السياق؛ ويعود الضمير إلى التماثيل.
- source_word: μετοικιῶ
  choice: فسأنفيكم
  rationale: يعبر بإيجاز ووضوح عن الإبعاد القسري إلى المنفى، مع بقاء الله هو المتكلم.
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: إلى ما وراء بابل
  rationale: يتبع نص أعمال الرسل كما هو، ويحافظ على معنى «وراء/إلى الجانب الأبعد من» دون مواءمته مع نص عاموس.
theological_decisions:
- issue: اختلاف اقتباس استفانوس عن نص عاموس في تحديد وجهة السبي
  choice: إلى ما وراء بابل
  alternative: إلى ما وراء دمشق
  rationale: نص أعمال الرسل اليوناني يذكر بابل صراحة، ولذلك يُترجم كما ورد، مع إبقاء اختلاف عاموس ظاهرًا في الحاشية بدل تسوية التوتر النصي.
- issue: وصف ريفان في نص أعمال الرسل مقارنةً بالخلفية العبرية في عاموس 5:26
  choice: الإله ريفان
  alternative: إلهكم ريفان
  rationale: القراءة المختارة تتبع تركيب النص اليوناني المعطى لأعمال الرسل، بينما تُذكر صيغة النص العبري في الحاشية حفاظًا على الاختلاف ذي الدلالة التفسيرية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «حملتم» و«خيمة» لقربهما من اللفظ اليوناني، و«لتسجدوا لها» لإبقاء الصورة الأصلية ودلالتها التعبدية. وُضعت علامات الحواشي جميعًا في المتن، مع ترتيبها بحسب مواضعها الطبيعية.
