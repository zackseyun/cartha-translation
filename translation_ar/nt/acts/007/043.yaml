review_pass:
  verdict: revise
  source_fidelity: المعنى العام أمين للنص اليوناني، بما في ذلك «الإله ريفان» و«ما وراء بابل». لكن «وهي التماثيل» لا تؤدي بوضوح وظيفة العبارة اليونانية التفسيرية τοὺς τύπους، وتُحدث إحالة نحوية غير مستقرة بعد «خيمة ... ونجم».
  naturalness: الأسلوب فصيح وواضح عمومًا. إدخال «أي» يجعل العلاقة التفسيرية بين المعبودات/الأشياء المذكورة و«التماثيل» طبيعية ودقيقة في العربية، كما أن «وسأنفيكم» أقرب إلى عطف العبارة اليونانية من الفاء ذات الإيحاء السببي.
  terminology: «خيمة»، «مولوخ»، «نجم الإله ريفان»، و«أنفيكم» اختيارات مناسبة. «لتسجدوا لها» مقبول في سياق العبادة، ويحفظ المعنى التعبدي لـ προσκυνεῖν دون تحميل النص تفسيرًا زائدًا.
  issues:
  - severity: medium
    issue: الصياغة «وهي التماثيل» غير مستقرة نحويًا ودلاليًا.
    rationale: العبارة اليونانية «الصور/التماثيل التي صنعتموها لتعبدوها» في موقع تفسيري/بدلي لما سبق. أما الضمير «هي» في العربية فلا يحيل بسلاسة إلى «خيمة» و«نجم»، ويشوّش علاقة «التماثيل» بهما. الصياغة بـ«أي» تحفظ الوظيفة التفسيرية للنص.
  - severity: low
    issue: الفاء في «فسأنفيكم» قد توحي بعلاقة سببية لا يصرح بها العطف اليوناني.
    rationale: يستحسن استعمال الواو لمقابلة καὶ والمحافظة على ربط الجمل من غير تقوية العلاقة المنطقية.
  revised_text: وحملتم خيمة مولوخ، ونجم الإله ريفان[a]، أي التماثيل[c] التي صنعتموها لتسجدوا لها، وسأنفيكم إلى ما وراء بابل.[b]
