  to: وحملتم خيمة مولوخ، ونجم الإله ريفان[a]، أي التماثيل[c] التي صنعتموها لتسجدوا لها، وسأنفيكم إلى ما وراء بابل.[b]
  rationale: التعديل يقتصر على توضيح علاقة «التماثيل» التفسيرية بما قبلها، وعلى جعل العطف في الجملة الأخيرة محايدًا كما في اليونانية. وتبقى الأسماء، والوجهة «بابل»، واختلاف عاموس في الحواشي كما يقتضي النص المصدر.
