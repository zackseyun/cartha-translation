  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: ar
  text: 'وفي اليوم التالي ظهر لهما وهما يتشاجران، وكان يحاول أن يصالح بينهما[a]، قائلاً: «يا رجلان، أنتما أخوان؛ فلماذا يظلم أحدكما الآخر؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكان يسعى إلى مصالحة أحدهما بالآخر». قد يدل الفعل اليوناني بصيغة الماضي الناقص على عمل مستمر، غير أن السياق يرجح هنا معنى المحاولة، لأن الآية التالية تبين أن مسعى موسى رُفض.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: وفي اليوم التالي
  rationale: تعبير زمني عربي طبيعي يحفظ تتابع أحداث الرواية.
- source_word: ὤφθη αὐτοῖς
  choice: ظهر لهما
  rationale: الفعل المبني للمجهول من ὁράω يُستعمل هنا بمعنى «ظهر»، والمثنى مناسب لأن السياق يتحدث عن رجلين.
- source_word: αὐτοῖς μαχομένοις
  choice: وهما يتشاجران
  rationale: ينقل اسم الفاعل الحالي بوصفه فعلاً مستمراً وقت ظهور موسى، و«يتشاجران» ملائم للنزاع المتبادل في السياق.
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: وكان يحاول أن يصالح بينهما
  rationale: يفهم الماضي الناقص على أنه محاولة مستمرة لم تنجح، كما يبين رفض موسى في الآية التالية؛ وتؤدي «يصالح بينهما» معنى التوجه بهما نحو السلام بعبارة عربية طبيعية.
- source_word: Ἄνδρες, ἀδελφοί ἐστε
  choice: يا رجلان، أنتما أخوان
  rationale: يحفظ النداء والتوكيد على أخوتهما، مع استعمال المثنى العربي الذي يطابق referent الرجلين بوضوح.
- source_word: ἱνατί ἀδικεῖτε ἀλλήλους
  choice: فلماذا يظلم أحدكما الآخر؟
  rationale: «يظلم» ينقل معنى ارتكاب الخطأ أو الجور، وصيغة «أحدكما الآخر» تؤدي التبادل المقصود في ἀλλήλους.
