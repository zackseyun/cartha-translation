reference: Acts 7:42
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: ar
  text: 'لكن الله أعرض عنهم وأسلمهم ليعبدوا جند السماء[a]، كما هو مكتوب في كتاب الأنبياء[b]: «هل قدَّمتم لي ذبائح وقرابين طوال أربعين سنة في البرية، يا بيت إسرائيل؟»[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ليخدموا جند السماء». وقد يدل الفعل اليوناني على الخدمة الدينية أو العبادة. ويشير «جند السماء» إلى الأجرام السماوية، وبالتوسع إلى القوى السماوية المرتبطة بها في العبادة الوثنية.'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'يمكن أيضًا: «في درج الأنبياء».'
    reason: lexical_alternative
  - marker: c
    text: اقتباس من عاموس 5:25.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστρεψεν
  choice: أعرض عنهم
  rationale: يفيد السياق انصراف الله عنهم في الدينونة، لا مجرد التفات مكاني؛ وإضافة «عنهم» لازمة لوضوح العربية.
- source_word: παρέδωκεν αὐτοὺς
  choice: أسلمهم
  rationale: يحفظ معنى تسليمهم قضائيًا إلى ما اختاروه من عبادة باطلة، من غير أن ينسب إلى الله إنشاء خطيتهم.
- source_word: λατρεύειν
  choice: ليعبدوا
  rationale: الفعل يدل هنا على خدمة دينية أو عبادة؛ و«يعبدوا» أوضح للقارئ العربي في سياق التعبد للأجرام السماوية، مع إثبات البديل المعجمي في الحاشية.
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: جند السماء
  rationale: تعبير كتابي معروف يبقي المرجع عامًا، فيشمل الأجرام السماوية أو القوى المنسوبة إليها في العبادة الوثنية دون حصره في النجوم وحدها.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: في سفر الأنبياء
  rationale: «سفر» طبيعي في العربية الكتابية وملائم لمدوّنة الأنبياء؛ ويمكن أن تدل βίβλος ماديًا على درج، لذا ذُكر البديل في الحاشية.
- source_word: Μὴ ... προσηνέγκατέ μοι
  choice: هل قدَّمتم لي...؟
  rationale: تنقل صيغة السؤال البلاغي الذي يتوقع جوابًا بالنفي، مع إبقاء صيغته سؤالًا وعدم تحويله إلى تقرير تفسيري.
- source_word: σφάγια καὶ θυσίας
  choice: ذبائح مذبوحة وقرابين
  rationale: 'يميّز بين اللفظين المتجاورين: الأول يشدد على ما ذُبح قربانًا، والثاني يدل على القرابين أو الذبائح على نحو أعم.'
- source_word: ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ
  choice: طوال أربعين سنة في البرية
  rationale: صياغة عربية طبيعية تحفظ المدة الكاملة وموضعها في البرية.
theological_decisions:
- issue: فعل الله في الدينونة
  choice: «أعرض عنهم وأسلمهم» بوصفه تخليًا قضائيًا
  alternative: أن يكون الله قد أجبرهم إيجابيًا على عبادة جند السماء، أو أنه لم يفعل سوى السماح المحايد
  rationale: اقتران الفعلين يصور دينونة إلهية استجابةً لتمرد سابق؛ وتحفظ الصياغة قوة التسليم من غير جعل الله منشئًا لوثنيتهم.
- issue: مرجع «جند السماء»
  choice: إبقاء التعبير الكتابي الجامع
  alternative: تخصيصه بالملائكة وحدهم أو بالنجوم وحدها
  rationale: السياق يتناول عبادة الأجرام أو القوى السماوية، لكن العبارة نفسها لا تحصر المرجع بما يبرر التخصيص في المتن.
- issue: دلالة السؤال المقتبس من عاموس
  choice: إبقاء السؤال البلاغي المتوقع جوابه بالنفي
  alternative: 'تحويله إلى نفي صريح: «لم تقدموا لي...»'
  rationale: صيغة الأصل تحمل توترًا بلاغيًا ينبغي الحفاظ عليه بدل حسمه في عبارة تقريرية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُخدم «أعرض عنهم» لإظهار الانصراف القضائي، و«أسلمهم» لقوة παρέδωκεν، مع تجنب الشرح العقائدي داخل المتن. وُضعت علامات الحواشي في مواضعها المباشرة، واستُبعد تكديسها في موضع واحد.
