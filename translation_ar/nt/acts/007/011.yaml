base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: ar
  text: ثم حلّت مجاعة على مصر كلها وكنعان، وحلّ ضيق شديد، ولم يكن آباؤنا يجدون طعامًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: أسلافنا. يقول النص اليوناني حرفيًا «آباؤنا»، والمقصود الآباء الأوائل لشعب إسرائيل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν δὲ
  choice: ثم حلّت
  rationale: تنقل δὲ تطور السرد دون مبالغة في معنى التضاد، ويؤدي «حلّت» الاستعمال الحدثي الطبيعي للفعل مع المجاعة.
- source_word: λιμὸς
  choice: مجاعة
  rationale: يدل السياق على نقص واسع في الطعام، لا على مجرد الشعور بالجوع.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: على مصر كلها وكنعان
  rationale: تحفظ امتداد المجاعة الجغرافي على المنطقتين بصياغة عربية طبيعية.
- source_word: θλῖψις μεγάλη
  choice: ضيق شديد
  rationale: يعبر عن الشدة والمحنة المصاحبتين للمجاعة، من غير تحميل العبارة دلالة أخروية خاصة.
- source_word: οὐχ ηὕρισκον
  choice: لم يكن ... يجدون
  rationale: تعكس صيغة الماضي الناقص استمرار تعذر العثور على الطعام أثناء الأزمة.
- source_word: χορτάσματα
  choice: طعامًا
  rationale: لفظ عام واضح يشمل المؤن الغذائية، ولا يضيّق المعنى إلى الحبوب أو علف الحيوان.
- source_word: οἱ πατέρες ἡμῶν
  choice: آباؤنا
  rationale: يحفظ التعبير الأسري المذكر في اليونانية، وهو يشير هنا إلى آباء إسرائيل السابقين.
theological_decisions:
- issue: لغة الأسلاف المذكرة
  choice: آباؤنا
  alternative: أسلافنا
  rationale: النص اليوناني مذكر صراحة ويشير إلى آباء إسرائيل في سياق تاريخ الخلاص، لذلك حُفظت الصيغة دون تحييدها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «ثم» لربط تطور السرد، وحُفظ التوازي بين «مجاعة» و«ضيق شديد». وُضعت علامة الحاشية بعد الجملة التي ترد فيها «آباؤنا» لتتصل مباشرة باللفظ المشروح.
