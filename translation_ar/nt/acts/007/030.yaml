base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: ar
  text: وبعد أن اكتملت أربعون سنة[a]، ظهر له ملاك[c] في برية جبل سيناء، في لهيب نار من عليقة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حين اكتملت أربعون سنة».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «في لهيب نار عليقة»؛ أي إن اللهيب كان مرتبطًا بعليقة، في صدى لما ورد في الخروج 3:2.'
    reason: cross_reference
  - marker: c
    text: 'يربط بعض المفسرين هذا بـ«ملاك الرب» في الخروج 3:2، لكن سفر الأعمال يقول هنا ببساطة: «ملاك».'
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: بعد أن اكتملت أربعون سنة
  rationale: ينقل التركيب الإضافي المطلق دلالة الزمن، ويحافظ فعل «اكتملت» على المعنى اللفظي لـ πληρόω بصياغة عربية طبيعية.
- source_word: ὤφθη
  choice: ظهر
  rationale: الصيغة المبنية للمجهول من ὁράω تُستعمل هنا بمعنى الظهور، و«ظهر» أفصح من النقل الحرفي «شوهد» في هذا السياق.
- source_word: αὐτῷ
  choice: له
  rationale: ضمير في حالة المجرور غير المباشر يعود في السياق إلى موسى.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في برية
  rationale: «برية» تلائم الأسلوب الكتابي والمشهد الجغرافي من غير أن تحصر المعنى في صحراء شديدة الجفاف.
- source_word: τοῦ ὄρους Σινᾶ
  choice: جبل سيناء
  rationale: صياغة عربية مألوفة للإضافة التي تسمّي الجبل.
- source_word: ἄγγελος
  choice: ملاك
  rationale: السياق يدل على كائن سماوي، والنص اليوناني يقول «ملاك» من غير إضافة تعريفية أخرى.
- source_word: ἐν φλογὶ πυρὸς
  choice: في لهيب نار
  rationale: تحافظ العبارة على الصورة المركبة في اليونانية وعلى تعلق الظهور باللهيب.
- source_word: βάτου
  choice: من عليقة
  rationale: «عليقة» اسم مناسب للشجيرة في مشهد الخروج 3، و«من» تعبّر طبيعيًا عن ارتباط اللهيب بها مع بقاء الحاشية موضحة للتركيب الحرفي المضغوط.
theological_decisions:
- issue: هوية الشخصية الظاهرة في سياق التجلي
  choice: ملاك
  alternative: ملاك الرب
  rationale: النص في أعمال الرسل يقول ἄγγελος بلا عبارة «الرب»، لذلك لا تُستورد هوية أشد تحديدًا إلى المتن، مع بيان الصلة بخروج 3:2 في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «برية» و«عليقة» لملاءمتهما للسياق الكتابي مع بقاء العبارة مفهومة، وحُفظت بساطة ἄγγελος من غير حسم لاهوتي زائد.
