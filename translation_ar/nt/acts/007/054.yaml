lexical_decisions:
- source_word: Ἀκούοντες δὲ ταῦτα
  choice: ولمّا سمعوا هذه الأمور
  rationale: يؤدي اسم الفاعل معنى الظرف الزمني، وتنقل الواو مع «لمّا» التطور السردي الذي تشير إليه δὲ من غير إدخال كلمة صريحة بمعنى «الآن». و«هذه الأمور» تحفظ جمع ταῦτα وإحالته إلى كلام استفانوس السابق.
- source_word: διεπρίοντο ταῖς καρδίαις αὐτῶν
  choice: استشاطت قلوبهم غضبًا
  rationale: الفعل في المبني للمجهول يحمل حرفيًا صورة القطع أو النشر إلى الداخل، ويُستعمل هنا للدلالة على اضطراب داخلي شديد يتضح من سياق العداء. هذا التعبير العربي الطبيعي ينقل شدة الغضب، مع إثبات الصورة الحرفية البديلة في الحاشية.
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: صرّوا على أسنانهم
  rationale: تعبير عربي فصيح وطبيعي ينقل الفعل الجسدي الحاد الدال على الغيظ والعداء.
- source_word: ἐπ’ αὐτόν
  choice: حنقًا عليه
  rationale: يفيد حرف الجر اتجاه العداء نحو استفانوس؛ وربط «عليه» بالحنق يوضح المقصود طبيعيًا في العربية من غير تغيير جهة الفعل.
