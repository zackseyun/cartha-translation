source:
  edition: SBLGNT
  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: ar
  text: ولم يُعْطِهِ فيها ميراثًا، ولا حتى موطئ قدم[a]، لكنه وعد أن يعطيها له مِلكًا، ولنسله من بعده[b]، مع أنه لم يكن له ولد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا حتى شبرًا من الأرض». التعبير اليوناني كناية عن أصغر قطعة ممكنة من الأرض.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا وصل معنى العبارة الأخيرة بما قبلها زمنيًا: «حين لم يكن له ولد». أما السياق فيرجّح معنى المفارقة: «مع أنه لم يكن له ولد».'
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: ميراثًا
  rationale: يحفظ المعنى القانوني والعهدي لنصيب يُمنح في الأرض، وهو أدق من لفظ عام مثل «ممتلكات».
- source_word: οὐδὲ βῆμα ποδός
  choice: ولا حتى موطئ قدم
  rationale: تعبير عربي طبيعي وقريب من الصورة اليونانية، ويدل اصطلاحيًا على أصغر مساحة ممكنة من الأرض.
- source_word: ἐπηγγείλατο
  choice: وعد
  rationale: ينقل الفعل بوضوح وإيجاز ويحفظ معنى الالتزام الإلهي.
- source_word: εἰς κατάσχεσιν
  choice: مُلكًا
  rationale: ينقل معنى الحيازة الثابتة المقصودة، بصياغة عربية طبيعية تلائم وعد الأرض.
- source_word: σπέρματι
  choice: نسله
  rationale: «النسل» مفرد في الصيغة وجمعي الدلالة، فيوافق اللفظ اليوناني ويحفظ لغة الوعد الإبراهيمي.
- source_word: μετ’ αὐτόν
  choice: من بعده
  rationale: ترجمة مباشرة وطبيعية تفيد تعاقب نسل إبراهيم بعده.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: مع أنه لم يكن له ولد
  rationale: يُظهر القوة التنازلية المرجحة في السياق، أي أن الوعد صدر رغم عدم وجود ولد لإبراهيم، من غير طمس إمكان الفهم الزمني المشار إليه في الحاشية.
- source_word: τέκνου
  choice: ولد
  rationale: لفظ عربي عام لا يخصص الجنس، وينقل أن إبراهيم لم يكن له أي ابن أو ابنة آنذاك.
theological_decisions:
- issue: دلالة عدم وجود ولد لإبراهيم وقت الوعد
  choice: مع أنه لم يكن له ولد
  alternative: حين لم يكن له ولد
  rationale: 'التركيب اليوناني يمكن أن يصف الزمن أو الظرف، لكن السياق يبرز المفارقة: وعد الله إبراهيم بالأرض والنسل رغم أنه لم يكن له ولد. أُثبت البديل الزمني في الحاشية حفاظًا على الاحتمال النحوي.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «موطئ قدم» للمحافظة على صورة الأصل مع بيان معناها في الحاشية، و«نسله» للمحافظة على الصيغة الجمعية الدلالة في لغة الوعد.
