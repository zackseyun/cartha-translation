lexical_decisions:
- source_word: Εἶπεν
  choice: فقال
  rationale: يحافظ على الفعل السردي «قال» كما في اليونانية، مع وصل طبيعي بالسياق السابق.
- source_word: δὲ
  choice: فـ
  rationale: تفيد هنا الانتقال والتتابع في السرد، والفاء صياغة عربية طبيعية موجزة.
- source_word: ὁ ἀρχιερεύς
  choice: رئيس الكهنة
  rationale: المقابل العربي المألوف والدقيق للمنصب المفرد الذي يترأس المجلس في هذا السياق القضائي.
- source_word: Εἰ
  choice: أَ
  rationale: تدخل εἰ هنا على سؤال تصديقي، فتنقلها همزة الاستفهام العربية بصورة طبيعية.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: يحفظ جمع اسم الإشارة ولا يفسره صراحةً بأنه «التهم»، مع أن السياق يشير إليها.
- source_word: οὕτως ἔχει
  choice: هكذا
  rationale: التركيب اليوناني اصطلاحي بمعنى «هل الحال كذلك؟»، و«هكذا» تحافظ على إيجازه وعلى الإحالة إلى مضمون الاتهامات.
