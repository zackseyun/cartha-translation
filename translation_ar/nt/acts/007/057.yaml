lexical_decisions:
- source_word: κράξαντες
  choice: صرخوا
  rationale: اسم الفاعل الظرفي من κράζω يدل على إطلاق صرخة أو صياح مرتفع؛ وصيغة «صرخوا» طبيعية في العربية وتحافظ على تتابع الأفعال من غير إضافة انفعال غير مصرّح به.
- source_word: δὲ
  choice: لكنهم
  rationale: تفيد δέ انتقالًا فيه مقابلة خفيفة بين رؤية استفانوس ورد فعل السامعين العدائي، ولذلك تناسبها «لكن» هنا، مع ضمير الجمع لوضوح الإسناد.
- source_word: φωνῇ μεγάλῃ
  choice: بصوت عالٍ
  rationale: مقابل عربي مباشر وطبيعي للعبارة الدالة على شدة الصوت.
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: سدّوا آذانهم
  rationale: العبارة اليونانية تصف منع السماع بإغلاق الأذنين؛ و«سدّوا آذانهم» تعبير عربي واضح يحفظ الصورة الحسية.
- source_word: ὥρμησαν
  choice: اندفعوا
  rationale: الفعل يدل على حركة مفاجئة قوية نحو شخص؛ و«اندفعوا» ينقل هذه القوة من غير زيادة مثل «بعنف» ليست مستقلة في النص.
- source_word: ὁμοθυμαδὸν
  choice: معًا
  rationale: يدل الظرف على الفعل المتحد أو المتوافق؛ و«معًا» موجزة وطبيعية، مع بيان دلالة وحدة القصد في الحاشية.
- source_word: ἐπ’ αὐτόν
  choice: عليه
  rationale: مع فعل الاندفاع تدل ἐπί مع النصب على حركة عدائية موجهة نحو الشخص؛ و«اندفعوا عليه» تركيب عربي مألوف.
