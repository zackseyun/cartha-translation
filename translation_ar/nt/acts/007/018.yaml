lexical_decisions:
- source_word: ἄχρι οὗ
  choice: إلى أن
  rationale: تدل العبارة على الحدّ الزمني لاستمرار الحالة السابقة، و«إلى أن» تعبير عربي طبيعي ودقيق.
- source_word: ἀνέστη
  choice: قام
  rationale: الفعل يعني حرفيًا «قام»، ويُستعمل هنا لظهور ملك جديد أو تولّيه السلطان. يحافظ الاختيار على الصورة اللفظية دون أن يحسمها بتفسير واحد.
- source_word: βασιλεὺς ἕτερος
  choice: ملكٌ آخر
  rationale: تنقل «ملك» المعنى المباشر لـ βασιλεύς، وتُميّز «آخر» هذا الملك ممن سبقه.
- source_word: ἐπ’ Αἴγυπτον
  choice: على مصر
  rationale: تفيد ἐπί مع اسم الملك هنا السلطان على إقليم، والتعبير العربي «ملك على مصر» واضح ومألوف.
- source_word: οὐκ ᾔδει
  choice: لم يكن يعرف
  rationale: يحافظ على المعنى المباشر للفعل οἶδα، مع إبقاء احتمال دلالة السياق على عدم الاعتراف بيوسف أو عدم الاعتداد به.
- source_word: τὸν Ἰωσήφ
  choice: يوسف
  rationale: الصيغة العربية المعيارية المعروفة للاسم الكتابي.
