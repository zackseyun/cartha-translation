source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: ar
  text: «السَّماءُ عَرْشي، والأرضُ مَوْطِئٌ لِقَدَمَيَّ. فأيَّ بيتٍ ستَبنونَ لي، يقولُ الرَّبُّ، وما موضعُ راحتي؟»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: السَّماء
  rationale: تشير هنا إلى المجال السماوي في مقابلة الأرض، لا إلى السماء المنظورة وحدها.
- source_word: θρόνος
  choice: عَرْشي
  rationale: يحفظ صورة العرش بوصفه رمزًا للمُلك والسلطان.
- source_word: γῆ
  choice: الأرض
  rationale: المعنى كوني هنا بسبب مقابلتها بالسماء، لا محلي بمعنى البلاد.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: مَوْطِئٌ لِقَدَمَيَّ
  rationale: تعبير عربي طبيعي يحفظ صورة ما توضع عليه القدمان، كما يحفظ ذكر القدمين الصريح في اليونانية.
- source_word: ποῖον οἶκον
  choice: أيَّ بيتٍ
  rationale: «أيّ» هنا استفهام عن صفة البيت أو نوعه في سؤال إنكاري، و«بيت» يحفظ اللفظ دون تفسيره مباشرة بالهيكل.
- source_word: οἰκοδομήσετέ μοι
  choice: ستَبنونَ لي
  rationale: ينقل صيغة المستقبل والخطاب للجمع مباشرة.
- source_word: κύριος
  choice: الرَّبّ
  rationale: المقابل العربي المألوف لـκύριος في صيغة إعلان القول الإلهي.
- source_word: τόπος τῆς καταπαύσεώς μου
  choice: مكانُ راحتي
  rationale: يحفظ تركيب «مكان الراحة» والصدى اللاهوتي للراحة الإلهية دون توسيع تفسيري.
theological_decisions:
- issue: ترجمة κύριος في اقتباس من إشعياء يتكلم فيه إله إسرائيل
  choice: الرَّبّ
  alternative: يهوه
  rationale: النص اليوناني للعهد الجديد يقرأ κύριος؛ لذلك تُترجم الكلمة كما وردت في المصدر المباشر، مع بقاء هوية المتكلم الإلهية واضحة من السياق.
- issue: دلالة οἶκος في سياق الحديث عن الهيكل
  choice: بيت
  alternative: هيكل
  rationale: يحفظ «بيت» عمومية اللفظ اليوناني وصياغة الاقتباس، ولا يحسم الإشارة السياقية بتفسير داخل المتن.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة، تحافظ على التوازي الشعري والسؤالين الإنكاريين. استُعمل «موطئ لقدميّ» بدل تركيب حرفي ثقيل مثل «موطئ قدميّ»، من غير حاجة إلى حاشية.
