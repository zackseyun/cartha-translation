revisions:
- from: «السَّماءُ عَرْشي، والأرضُ مَوْطِئٌ لِقَدَمَيَّ. فأيَّ بيتٍ ستَبنونَ لي، يقولُ الرَّبُّ، أو أينَ مكانُ راحتي؟»
  to: «السَّماءُ عَرْشي، والأرضُ مَوْطِئٌ لِقَدَمَيَّ. فأيَّ بيتٍ ستَبنونَ لي، يقولُ الرَّبُّ، وما موضعُ راحتي؟»
  rationale: اقتصر التعديل على استبدال «أين مكان راحتي؟» بـ«ما موضع راحتي؟» لاستعادة دلالة τίς τόπος والمحافظة على بنية السؤالين الإنكاريين في المصدر. ولم يُغيَّر «موطئ لقدميّ»، لأنه يؤدي الصورة المقصودة بوضوح في العربية الفصحى.
  reviewer_model: gpt-5.6-terra
