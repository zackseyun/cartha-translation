    rationale: 'الأصل يسأل: «ما/أيّ موضع هو موضع راحتي؟» (τίς τόπος)، لا «أين يقع موضع راحتي؟». ينبغي إبقاء الاستفهام عن الموضع أو نوعه بدل تحويله إلى استفهام مكاني.'
