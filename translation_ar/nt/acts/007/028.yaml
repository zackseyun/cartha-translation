  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ... θέλεις
  choice: أَتُرِيدُ
  rationale: ينقل السؤال الاستنكاري طبيعيًّا في العربية، مع إبقاء نبرة توقّع الجواب بالنفي مفهومة من السياق دون إضافة لفظ صريح.
- source_word: ἀνελεῖν / ἀνεῖλες
  choice: تَقْتُلَنِي / قَتَلْتَ
  rationale: الفعل ἀναιρέω هنا يعني القتل أو إزهاق النفس؛ وتكرار الجذر العربي يحفظ الصلة البلاغية بين الفعلين.
- source_word: ὃν τρόπον
  choice: كَمَا
  rationale: 'تعبير عربي موجز وطبيعي يفيد المماثلة في الكيفية: «بالطريقة التي».'
- source_word: ἐχθὲς
  choice: أَمْسِ
  rationale: المقابل الزمني المباشر للفظ اليوناني.
- source_word: τὸν Αἰγύπτιον
  choice: الْمِصْرِيَّ
  rationale: يحفظ التعريف والوصف القومي الواردين في النص.
