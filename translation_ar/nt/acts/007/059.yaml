lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: كانوا يرجمون
  rationale: صيغة الماضي الناقص تدل على فعل مستمر كان يجري، وعبارة «كانوا يرجمون» تنقل هذا المعنى بوضوح وطبيعية.
- source_word: ἐπικαλούμενον
  choice: وهو يدعو
  rationale: اسم الفاعل يصف استفانوس وهو يتوجه بندائه إلى يسوع، و«يدعو» تحفظ معنى النداء والتضرع من غير إثقال الأسلوب.
- source_word: λέγοντα
  choice: قائلًا
  rationale: تنقل اسم الفاعل المنسق مع ἐπικαλούμενον بصياغة عربية موجزة وطبيعية.
- source_word: Κύριε Ἰησοῦ
  choice: أيها الرب يسوع
  rationale: تحفظ المخاطبة المباشرة ولقب «الرب»، مع استعمال أداة النداء الملائمة في العربية الفصحى.
- source_word: δέξαι
  choice: اقبل
  rationale: صيغة أمر في سياق تضرع، و«اقبل» تؤدي معنى تلقي الروح وإيداعها لدى المخاطَب بلغة عربية واضحة ومهيبة.
- source_word: τὸ πνεῦμά μου
  choice: روحي
  rationale: الترجمة المباشرة المألوفة التي تلائم سياق الموت وتسليم استفانوس روحه.
theological_decisions:
- issue: هل ينبغي أن تُظهر الصياغة أن استفانوس يتوجه إلى يسوع بالدعاء أو الابتهال؟
  choice: «وهو يدعو... أيها الرب يسوع»
  alternative: «وهو ينادي قائلًا» أو «وهو يبتهل إليه قائلًا»
  rationale: النص اليوناني يعرض توجّه استفانوس مباشرة إلى يسوع، ويمكن للفعل ἐπικαλέομαι أن يحمل معنى الدعاء أو الابتهال. تحفظ الصياغة هذا المعنى من غير إضافة مفعول غير مصرح به أو حسم دلالته بأكثر مما يسمح به اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ استمرار فعل الرجم، والمخاطبة المباشرة ليسوع، كما أُبقي مجال الدلالة في ἐπικαλούμενον ظاهرًا في الحاشية دون فرض تفسير طائفي.
