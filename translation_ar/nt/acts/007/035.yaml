source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: ar
  text: '«موسى هذا، الذي رفضوه قائلين: مَن أقامك حاكمًا وقاضيًا؟ هو نفسه أرسله الله حاكمًا وفاديًا[a] بيد الملاك الذي ظهر له في العُلَّيقة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مخلِّصًا» أو «محرِّرًا». يدل اللفظ اليوناني على مَن يُحدث فكاكًا أو تحريرًا، واختيرت «فاديًا» للمحافظة على إيحاء الفداء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: رفضوه
  rationale: يفيد الفعل هنا رفض موسى والتنكر لسلطانه، في ضوء الإحالة إلى خروج 2:14؛ و«رفضوه» تعبير عربي واضح وطبيعي.
- source_word: κατέστησεν
  choice: أقامك
  rationale: يدل على التنصيب في موضع سلطة، و«أقامك» يحافظ على الصياغة الكتابية الواضحة وعلى صلة السؤال بخروج 2:14.
- source_word: ἄρχοντα
  choice: حاكمًا
  rationale: ينقل معنى صاحب السلطة، ويحفظ التكرار المقصود بين الدور الذي رفضه القوم والدور الذي أرسل الله موسى ليؤديه.
- source_word: δικαστήν
  choice: قاضيًا
  rationale: مقابل مباشر وواضح لمن يتولى القضاء.
- source_word: λυτρωτὴν
  choice: فاديًا
  rationale: يحفظ دلالة إطلاق الأسير أو المقيَّد بفدية، وما في اللفظ من إيحاء بالفداء، مع بيان البديل «مخلِّصًا» في الحاشية لتجنب حصر الدلالة.
- source_word: ἀπέσταλκεν
  choice: أرسله
  rationale: الماضي العربي طبيعي في هذا السرد ويلائم الفعل اليوناني التام الذي يشير إلى فعل منجز ذي أثر باقٍ.
- source_word: σὺν χειρὶ
  choice: بيد
  rationale: يحفظ التعبير السامي الكتابي الدال على الوساطة أو الأداة دون تسطيحه إلى مجرد «بواسطة».
- source_word: ἀγγέλου
  choice: الملاك
  rationale: السياق يتحدث عن الكائن السماوي الذي ظهر لموسى، لذا «الملاك» هو المقابل المألوف والملائم.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: الذي ظهر له في العُلَّيقة
  rationale: «ظهر» ينقل الاستعمال الاصطلاحي للمبني للمجهول، و«في العُلَّيقة» يتبع النص دون إضافة وصف «المشتعلة» غير المذكور هنا.
- source_word: Τοῦτον ... τοῦτον
  choice: موسى هذا ... هو نفسه
  rationale: 'يحفظ التكرار التوكيدي والمفارقة البلاغية بصورة عربية طبيعية: الذي رفضوه هو بعينه الذي أرسله الله.'
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: حاكمًا وفاديًا
  rationale: العطف يبرز الدورين المتلازمين، والسياق العربي مع «أرسله» يوضح أنه أُرسل بهذه الصفة.
theological_decisions:
- issue: ترجمة λυτρωτής حيث يؤدي موسى دورًا ذا صلة بتاريخ الخلاص
  choice: فاديًا
  alternative: مخلِّصًا أو محرِّرًا
  rationale: «فاديًا» يصون بُعد الفداء والتحرير في اللفظ، من غير أن يساوي ضمنًا بين دور موسى وأي صياغة لاهوتية مكتملة؛ والحاشية تحفظ المجال الدلالي البديل.
- issue: هوية الملاك ووساطته في الإرسال
  choice: بيد الملاك الذي ظهر له
  alternative: بواسطة الملاك الذي ظهر له
  rationale: النص يثبت وساطة الملاك ولا يشرح كيف تتصل بإرسال الله؛ لذلك حُفظ التعبير كما هو بلا حسم لاهوتي زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعملت «العُلَّيقة» للمحافظة على الاسم الكتابي المألوف للشجيرة، وحُفظت عبارة «بيد الملاك» لما فيها من دلالة على الوساطة.
