  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: ar
  text: 'فلما رأى موسى ذلك، تعجَّب من المنظر[a]. وبينما كان يقترب ليتأمَّله، جاء صوت الرب[b][c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الرؤيا». يمكن للكلمة اليونانية أن تدل على مشهد منظور أو رؤيا؛ واختيرت «المنظر» هنا لأن موسى يتفاعل مع ظاهرة يراها.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا صياغتها: «وإذا بصوت الرب يأتي».'
    reason: lexical_alternative
  - marker: c
    text: قد يتوقع بعض القراء «يهوه» لأن المشهد يحيل إلى خروج 3، لكن النص اليوناني هنا يقرأ «الرب» (κύριος).
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: فلما رأى
  rationale: اسم الفاعل الماضي يؤدي وظيفة زمنية سابقة للفعل الرئيس؛ وصيغة «فلما رأى» تنقل هذا التتابع بوضوح وطبيعية في العربية.
- source_word: ἐθαύμασεν
  choice: تعجَّب
  rationale: ينقل معنى الدهشة الممزوجة بالعجب، وهو تعبير عربي واضح وملائم للسرد.
- source_word: τὸ ὅραμα
  choice: المنظر
  rationale: يمكن أن تدل الكلمة على رؤيا أو مشهد منظور. والسياق يصف استجابة موسى للظاهرة المرئية، لذلك تلائم «المنظر» السياق مع إبقاء «الرؤيا» بديلًا في الحاشية.
- source_word: προσερχομένου
  choice: بينما كان يقترب
  rationale: ينقل تركيب المضاف المطلق الدال على الظرف الزمني المصاحب، ويحافظ على حركة موسى نحو الظاهرة.
- source_word: κατανοῆσαι
  choice: ليتأمَّله
  rationale: الفعل يدل على النظر بانتباه وفحص؛ و«يتأمله» موجز وطبيعي في هذا السياق البصري.
- source_word: ἐγένετο φωνὴ
  choice: جاء صوت
  rationale: يحافظ على الصياغة الحدثية في اليونانية من غير إضافة فعل السماع غير المذكور صراحة.
- source_word: κυρίου
  choice: الرب
  rationale: ينقل لقب κύριος مباشرة. وإضافة أداة التعريف طبيعية في تركيب «صوت الرب» بالعربية.
theological_decisions:
- issue: ترجمة κύριος في سياق ظهور إلهي يحيل إلى خروج 3
  choice: الرب
  alternative: يهوه
  rationale: النص اليوناني يقرأ κύριος، لا اسم العهد العبري بأحرفه الأربعة. لذلك تحافظ «الرب» على صيغة المصدر، مع التنبيه إلى خلفية مشهد الخروج دون إحلال قراءة تفسيرية محل اللفظ اليوناني.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُعمل «تعجَّب» و«ليتأمَّله» لتجنب التراكيب الثقيلة، وحُفظ التتابع السردي والقدر القائم من الغموض المعجمي.
