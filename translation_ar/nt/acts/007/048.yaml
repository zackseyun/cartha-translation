lexical_decisions:
- source_word: ἀλλ’
  choice: لكن
  rationale: تفيد مقابلة قوية مع ما سبق عن بناء سليمان بيتًا، وهي طبيعية وواضحة في العربية.
- source_word: οὐχ
  choice: لا
  rationale: أداة النفي العربية المناسبة مع الفعل المضارع «يسكن».
- source_word: ὁ ὕψιστος
  choice: العليّ
  rationale: لقب إلهي معروف، ويحافظ على صيغة الأصل من غير إضافة لفظ «الله» غير المذكور صراحة.
- source_word: ἐν χειροποιήτοις
  choice: في أشياء صنعتها الأيدي
  rationale: يحافظ على عموم صفة الجمع اليونانية، التي تعني ما صنعته الأيدي البشرية، من غير حصرها في الهياكل، مع أن الهيكل هو السياق المباشر.
- source_word: κατοικεῖ
  choice: يسكن
  rationale: ينقل معنى الإقامة والسكنى، وهو ملائم للحديث عن حضور الله.
- source_word: καθὼς
  choice: كما
  rationale: تقدّم الاستشهاد النبوي بوصفه مؤيدًا لما قيل، بصياغة عربية طبيعية.
- source_word: ὁ προφήτης
  choice: النبي
  rationale: يلتزم بالأصل الذي لا يذكر اسم إشعياء هنا.
- source_word: λέγει
  choice: يقول
  rationale: يحافظ على المضارع في صيغة الاستشهاد الكتابي.
theological_decisions:
- issue: هل يُحصر مدلول χειροποιήτοις في الهياكل؟
  choice: الإبقاء على التعبير الأوسع «أشياء صنعتها الأيدي»
  alternative: «هياكل صنعتها الأيدي» أو «مقادس صنعتها الأيدي»
  rationale: السياق المباشر هو الهيكل، لكن اللفظ اليوناني أوسع، وقد يحمل صدى نقد الأشياء والمباني الدينية المصنوعة بشريًا؛ لذلك لا ينبغي تضييق الدلالة في المتن.
- issue: هل يُوسَّع ὁ ὕψιστος إلى «الله العلي»؟
  choice: «العليّ» فقط
  alternative: «الله العلي»
  rationale: المراد هو الله بوضوح، لكن الأصل لا يورد لفظ θεός، فحُفظ اللقب وحده دون زيادة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «العليّ» بوصفه لقبًا إلهيًا مألوفًا، وحُفظ عموم العبارة اليونانية مع توضيح البديل السياقي في الحاشية.
