  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: ar
  text: 'وقال: «ها أنا أرى السماوات مفتوحة[a]، وابن الإنسان[b] قائمًا عن يمين الله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا يمكن أن تُفهم العبارة: «السماوات وقد فُتحت». يستعمل اليوناني اسم مفعول تامًّا مبنيًا للمجهول، فيبرز أنها قد فُتحت وصارت في حالة انفتاح في رؤيا استفانوس.'
    reason: lexical_alternative
  - marker: b
    text: «ابن الإنسان» لقب مسياني معروف، يردد صدى دانيال 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ها أنا
  rationale: تؤدي وظيفة التنبيه والتعجب في كلام مباشر حي، وتتصل طبيعيًا بالفعل «أرى» من غير استعمال صيغة مهجورة أو ثقيلة.
- source_word: θεωρῶ
  choice: أرى
  rationale: تحافظ على زمن الحاضر الدال على الإدراك الجاري، وهي أوضح مقابل عربي في سياق الرؤيا.
- source_word: τοὺς οὐρανοὺς
  choice: السماوات
  rationale: تحافظ على صيغة الجمع في اليونانية وعلى النبرة الكتابية واللاهوتية، بخلاف «السماء» المفردة أو «السماوات المرئية» التفسيرية.
- source_word: διηνοιγμένους
  choice: مفتوحة
  rationale: اسم المفعول اليوناني في صيغة التام المبني للمجهول يصور السماوات في حالة انفتاح ناتجة عن فعل سابق؛ و«مفتوحة» تنقل هذه الحالة بوضوح وطبيعية.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: ترجمة حرفية مستقرة تحفظ اللقب المسياني وصلته بدانيال 7:13 من غير استبداله بتعبير تفسيري.
- source_word: ἐκ δεξιῶν
  choice: عن يمين
  rationale: تعبير عربي كتابي طبيعي يدل على موضع الكرامة والسلطان ويحفظ الصدى النصي للعبارة اليونانية.
- source_word: ἑστῶτα
  choice: قائمًا
  rationale: ينقل هيئة الوقوف التي يصرح بها النص، ولا يوفقها مع المواضع الأخرى التي تصف المسيح جالسًا.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: تكتمل به العبارة الاصطلاحية «عن يمين الله» من غير إضافة تفسيرية.
theological_decisions:
- issue: اللقب المسياني τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان أو الكائن البشري
  rationale: يحفظ اللفظ اليوناني بوصفه لقبًا معروفًا، ويبقي صلته بصورة دانيال 7:13 وقوتها المسيانية، بينما البدائل تضعف طابع اللقب.
- issue: هيئة يسوع الممجَّد
  choice: قائمًا عن يمين الله
  alternative: جالسًا عن يمين الله أو واقفًا بجانب الله
  rationale: النص يذكر الوقوف صراحة، ولذلك تُحفظ خصوصيته والتوتر مع صيغ الجلوس الواردة في مواضع أخرى؛ كما أن «عن يمين الله» تحفظ دلالة مقام الكرامة من غير تسطيحها إلى مجرد موقع مكاني.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُعملت «ها أنا أرى» لإبقاء فورية التعجب، و«السماوات» للمحافظة على الجمع، و«قائمًا» لصون التفصيل اللاهوتي الخاص بالنص دون مواءمته مع نصوص الجلوس.
