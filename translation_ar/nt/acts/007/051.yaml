base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: ar
  text: «يا قساة الرقاب، يا غير المختونين في القلوب والآذان! أنتم دائمًا تقاومون الروح القدس؛ كما فعل آباؤكم[a]، تفعلون أنتم أيضًا.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «آباؤكم»: «أسلافكم». واللفظ اليوناني حرفيًا: «آباؤكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: غلاظ الرقاب
  rationale: يحفظ الصورة المجازية القوية المتوارثة في لغة العهد القديم، بدل اختزالها في معنى «عنيدون».
- source_word: ἀπερίτμητοι
  choice: غير المختونين
  rationale: يبقي المصطلح العهدي الحرفي وما يحمله من صدى نبوي عن العصيان الباطني.
- source_word: καρδίαις καὶ τοῖς ὠσίν
  choice: في القلوب والآذان
  rationale: ينقل دالتي المجال أو الاعتبار بصياغة عربية واضحة، ويحفظ اقتران القلب بالسمع في الاتهام.
- source_word: ἀεὶ
  choice: دائمًا
  rationale: ينقل معنى الاستمرار والنمط المتكرر مباشرة.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: الروح القدس
  rationale: المقابل العربي المعاصر المألوف للعبارة المعرّفة في سياق سفر الأعمال.
- source_word: ἀντιπίπτετε
  choice: تقاومون
  rationale: يعبر عن المعارضة الفاعلة من غير توسع تفسيري.
- source_word: οἱ πατέρες ὑμῶν
  choice: آباؤكم
  rationale: يحفظ اللفظ العائلي المذكر وصيغته الخطابية في اليونانية.
- source_word: καὶ ὑμεῖς
  choice: تفعلون أنتم أيضًا
  rationale: يُتمّ المقارنة العربية طبيعيًا بإظهار الفعل المفهوم من السياق دون إضافة مضمون جديد.
theological_decisions:
- issue: مرجع «الروح القدس»
  choice: الروح القدس بوصفه المرجع الإلهي الشخصي في سياق أعمال الرسل
  alternative: روح مقدسة بمعنى تأثير أو نزعة إلهية عامة
  rationale: التعريف والسياق في سفر الأعمال يرجحان المرجع الشخصي، من غير إضافة تفسير إلى نص الآية.
- issue: صورة عدم الختان العهدية
  choice: الحفاظ على «غير المختونين في القلوب والآذان»
  alternative: صياغة تفسيرية مثل «منغلقي القلوب وصمّ الآذان»
  rationale: الصورة تستحضر لغة الأنبياء العهدية، وحذفها يبدد الصلة المقصودة بأسفار إسرائيل.
- issue: التعبير عن الأجيال السابقة
  choice: آباؤكم
  alternative: أسلافكم
  rationale: يحافظ على اللفظ اليوناني المذكر وعلى القوة الخطابية، مع إمكان إيضاح المقصود في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة خطابية توبيخية قوية. حُفظت الصورتان الكتابيتان «غلاظ الرقاب» و«غير المختونين» لما لهما من أهمية أدبية وعهدية. وُضع ضمير «أنتم» لإبراز المقابلة والتوكيد الموجودين في اليونانية.
