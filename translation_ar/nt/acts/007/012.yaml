  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: ar
  text: فلما سمع يعقوب أن في مصر قمحًا[a]، أرسل آباءنا للمرة الأولى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مؤنٌ غذائيةٌ في مصر». يمكن أن تشير الكلمة اليونانية إلى المؤن بمعناها الأوسع، لكن المرجح في هذا السياق أنها تعني القمح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: لما سمع
  rationale: اسم الفاعل الأوريستي يؤدي معنى زمنيًا سابقًا للفعل الرئيس؛ و«لما سمع» عربية طبيعية تحفظ تتابع الحدثين.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد انتقالًا سرديًا مع مقابلة خفيفة بالسياق السابق، من غير مبالغة في قوة التضاد.
- source_word: ὄντα ⸂σιτία εἰς Αἴγυπτον⸃
  choice: أن في مصر قمحًا
  rationale: نُقلت صيغة المفعول مع اسم الفاعل بعد فعل السماع إلى خطاب غير مباشر عربي طبيعي، مع إبقاء مصر في موضع بارز.
- source_word: σιτία
  choice: قمحًا
  rationale: يمكن أن تدل الكلمة على الحبوب أو المؤن عمومًا، لكن سياق المجاعة وقصة يوسف يرجح القمح هنا.
- source_word: ἐξαπέστειλεν
  choice: أرسل
  rationale: «أرسل» تنقل معنى الفعل المركب بوضوح وطبيعية؛ ولا يلزم افتعال مقابل مستقل للبادئة ἐξ- في العربية.
- source_word: τοὺς πατέρας ἡμῶν
  choice: آباءنا
  rationale: يحفظ التعبير العائلي الذكوري في اليونانية، والمقصود رجال السلف في قصة إسرائيل، أي إخوة يوسف.
- source_word: πρῶτον
  choice: للمرة الأولى
  rationale: يوضح أنها الرحلة الأولى من رحلتين، ويمهد للزيارة الثانية المذكورة لاحقًا.
theological_decisions:
- issue: ترجمة τοὺς πατέρας ἡμῶν
  choice: آباءنا
  alternative: أسلافنا؛ الآباء الأوّلون
  rationale: «آباءنا» تحافظ على اللفظ العائلي الذكوري وعلى حديث استفانوس من داخل تاريخ إسرائيل، من غير توسيع المرجع ليشمل الأسلاف عمومًا أو إدخال لقب تفسيري.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. اختير «لما» للسرد الطبيعي، و«للمرة الأولى» لبيان تكرر الرحلة. وُضع مؤشر الحاشية مباشرة بعد اللفظ الذي يشرح بديله.
