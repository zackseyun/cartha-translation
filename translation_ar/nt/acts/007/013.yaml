  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: ar
  text: وفي المرة الثانية، كشف يوسف عن هويته لإخوته[a]، وصارت أسرة يوسف معروفة لدى فرعون[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا من حيث صيغة الفعل اليوناني: «عُرِف يوسف لدى إخوته»؛ والمقصود في سياق القصة أنه كشف لهم هويته.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أهل يوسف» أو «قرابة يوسف» أو «نسب يوسف».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: في المرة الثانية
  rationale: تعبير عربي طبيعي يحافظ على الصياغة الاصطلاحية اليونانية «في الثانية»، ويفهم من السياق أنها المرة الثانية التي جاء فيها الإخوة إلى مصر، دون إضافة «الزيارة» إلى المتن.
- source_word: ἀνεγνωρίσθη
  choice: عرَّف يوسف إخوته بنفسه
  rationale: الفعل اليوناني مبني للمجهول من حيث الصيغة، ويمكن أن يعني «عُرِف»، لكن سياق قصة يوسف يدل على كشف هويته لإخوته. وضعت الصيغة الأقرب إلى الحدث في المتن، مع حفظ الدلالة الشكلية في الحاشية.
- source_word: ἀδελφοῖς
  choice: إخوته
  rationale: المقصود إخوة يوسف الذكور في رواية التكوين، وهذه هي المقابلة العربية الدقيقة والطبيعية.
- source_word: φανερὸν ἐγένετο
  choice: صار ... معروفًا
  rationale: ينقل معنى انتقال الأمر إلى حيز المعرفة بعبارة عربية واضحة، بدل ترجمة حرفية ثقيلة مثل «صار ظاهرًا».
- source_word: γένος
  choice: أصل يوسف
  rationale: لفظة γένος هنا تحتمل الأهل أو القرابة أو النسب/الأصل. «أصل يوسف» يلائم كون فرعون علم بمنشئه وعشيرته، مع بيان البدائل في الحاشية صونًا للاتساع الدلالي.
- source_word: τῷ Φαραώ
  choice: لدى فرعون
  rationale: ينقل المجرور اليوناني الدال على الشخص الذي صار الأمر معلومًا له بصياغة عربية سليمة.
