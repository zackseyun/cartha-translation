  yaml_path: translation/nt/acts/007/053.yaml
  text: you who received the law as delivered by angels[a], and did not keep it.
translation:
  language: ar
  text: أنتم الذين تسلَّمتم الشريعة وفق ترتيبات الملائكة[a]، ولم تحفظوها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بوساطة الملائكة»، أو «بتوجيه من الملائكة». العبارة اليونانية عسيرة، لكنها تشير إلى صلة الملائكة بإعطاء الشريعة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: أنتم الذين
  rationale: يحفظ الخطاب المباشر للجمع والقوة الاتهامية في الضمير الموصول النوعي.
- source_word: ἐλάβετε
  choice: تسلَّمتم
  rationale: ينقل معنى تلقّي الشريعة بوضوح، من غير أن يوحي بالضرورة بقبولها طوعًا.
- source_word: τὸν νόμον
  choice: الشريعة
  rationale: يشير السياق إلى شريعة موسى، و«الشريعة» هي العبارة العربية الطبيعية والواضحة هنا.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: بترتيبٍ من ملائكة
  rationale: يحافظ على دلالة الترتيب أو التوجيه في διαταγάς وعلى صلة إعطاء الشريعة بوساطة الملائكة، من غير أن يحسم بدقة كيفية هذه الوساطة.
- source_word: ἀγγέλων
  choice: ملائكة
  rationale: السياق يتحدث عن كائنات سماوية مرتبطة بإعطاء الشريعة، لا عن رسل بشريين.
- source_word: οὐκ ἐφυλάξατε
  choice: ولم تحفظوها
  rationale: «حفظ الشريعة» تعبير عربي كتابي طبيعي يشمل مراعاتها والعمل بها، والضمير يوضح المفعول المفهوم من السياق.
theological_decisions:
- issue: دلالة العبارة εἰς διαταγὰς ἀγγέλων وعلاقة الملائكة بإعطاء الشريعة
  choice: تلقّي الشريعة بترتيبٍ من ملائكة
  alternative: تلقّي الشريعة بوساطة ملائكة، أو بتوجيه من ملائكة
  rationale: النص يثبت صلة الملائكة بإعطاء الشريعة، لكن تركيب العبارة اليونانية ودقة معنى διαταγαί موضع خلاف. يحفظ المتن معنى الترتيب ولا يحدد آلية الوساطة تحديدًا زائدًا، وتعرض الحاشية البدائل.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «تسلَّمتم» لتجنّب إيحاء القبول الطوعي، و«حفظتم» للمحافظة على التعبير الطبيعي المتعلق بمراعاة الشريعة. أُبقي غموض العبارة الخاصة بالملائكة مع بيان البدائل في الحاشية.
