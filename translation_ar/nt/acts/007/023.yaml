source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: ar
  text: ولمّا اكتملت له مدة أربعين سنة، خطر في قلبه[a] أن يتفقّد[b] إخوته، بني إسرائيل[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي نشأ في داخله قصد؛ ويمكن أيضًا: «صعد إلى قلبه» أو «قرّر». يحفظ الأصل تعبيرًا تصويريًا عن العزم الداخلي.'
    reason: lexical_alternative
  - marker: b
    text: أو «يزور». وقد يحمل الفعل هنا معنى الزيارة للاطمئنان على أحوالهم.
    reason: lexical_note
  - marker: c
    text: أي إخوته من أبناء قومه؛ وعبارة «بني إسرائيل» تحدد المقصود بهم.
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: ولمّا اكتملت له مدة أربعين سنة
  rationale: يحافظ على صورة اكتمال مدة الأربعين في اليونانية بصياغة عربية واضحة، بدل اختزالها إلى مجرد «بلغ الأربعين» أو تفسيرها بأنه كان يقترب منها.
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: خطر في قلبه
  rationale: ينقل التعبير التصويري الدال على نشوء قصد داخلي، من غير تسويته تمامًا بعبارة تفسيرية مثل «قرّر».
- source_word: ἐπισκέψασθαι
  choice: أن يتفقّد
  rationale: الفعل يدل هنا على الذهاب للزيارة والنظر في حال القوم؛ و«يتفقّد» يحفظ إيحاء الاهتمام بأحوالهم أكثر من «يزور» وحدها.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: إخوته
  rationale: يحفظ لفظ القرابة الذكوري الجمعي في النص، مع بيان المقصود مباشرة في العبارة التالية.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: بني إسرائيل
  rationale: تعبير عربي كتابي راسخ وطبيعي يقابل حرفيًا «أبناء إسرائيل»، ويأتي بدلًا يعرّف المقصود بإخوته.
theological_decisions:
- issue: لغة القرابة والتعيين القومي
  choice: إخوته، بني إسرائيل
  alternative: بني قومه الإسرائيليين
  rationale: يحفظ الاختيار صورة القرابة العائلية والتسمية القومية الواردتين معًا في الأصل، من غير حصر «الإخوة» في الإخوة الجسديين ولا محو العبارة العهدية التقليدية.
- issue: طبيعة الدافع الداخلي لموسى
  choice: خطر في قلبه
  alternative: قرّر
  rationale: يبقي التعبير مفتوحًا على نشوء الفكرة أو القصد في داخله، ولا يحوّله إلى وصف نفسي أكثر تحديدًا مما يقوله النص.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة. استُعمل «ولمّا» للانتقال الزمني، و«مدة أربعين سنة» لصون بنية الأصل، و«بني إسرائيل» بوصفه التعبير العربي المألوف. وُضعت علامات الحواشي عقب الألفاظ التي تشرحها مباشرة.
