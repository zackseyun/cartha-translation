  to: حينئذ، بعد أن خرج من أرض الكلدانيين، أقام في حاران. ومن هناك، بعد موت أبيه، نقله الله[a] إلى هذه الأرض التي تقيمون فيها الآن.[b]
  rationale: عُدّلت بداية الآية فقط لإبراز السبق الزمني الذي يفيده اسم الفاعل اليوناني ἐξελθὼν بالنسبة إلى «أقام». وأُبقي التصريح بـ«الله» والحاشية المرافقة له، لأنهما يقدمان إيضاحًا عربيًا مشروعًا مع الإفصاح عن أن اليونانية لا تذكر الفاعل صراحة. كما أُبقيت الحاشية الزمنية دون محاولة التوفيق بين الروايات.
