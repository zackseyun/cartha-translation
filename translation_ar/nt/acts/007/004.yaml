  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: ar
  text: حينئذ، بعد أن خرج من أرض الكلدانيين، أقام في حاران. ومن هناك، بعد موت أبيه، نقله الله[a] إلى هذه الأرض التي تقيمون فيها الآن.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نقله»؛ لا يذكر النص اليوناني الفاعل صراحة، غير أن السياق يدل على الله.'
    reason: lexical_alternative
  - marker: b
    text: 'يقول استفانوس إن هذا الانتقال حدث بعد موت أبيه. قارن التكوين 11: 32؛ 12: 4 للاطلاع على التسلسل الزمني ذي الصلة.'
    reason: cross_reference
lexical_decisions:
- source_word: τότε ἐξελθὼν
  choice: فخرج حينئذ
  rationale: ينقل τότε بوصفها علامة زمنية، ويعبّر عن اسم الفاعل اليوناني بصيغة فعلية عربية طبيعية مع بقاء تعاقب الأحداث واضحًا.
- source_word: ἐκ γῆς Χαλδαίων
  choice: من أرض الكلدانيين
  rationale: يحافظ على التعبير الكامل في اليونانية وعلى الإضافة الدالة على الشعب.
- source_word: κατῴκησεν ἐν Χαρράν
  choice: وأقام في حاران
  rationale: «أقام» تدل على اتخاذ المكان موطنًا، وهي أفصح وأدق هنا من مجرد «عاش».
- source_word: κἀκεῖθεν
  choice: ومن هناك
  rationale: يحفظ عنصري اللفظة المركبة، أي العطف والدلالة على الابتداء من المكان.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: بعد موت أبيه
  rationale: صياغة عربية موجزة وطبيعية تحافظ على الترتيب الزمني الصريح.
- source_word: μετῴκισεν αὐτὸν
  choice: نقله الله
  rationale: الفعل سببي بمعنى نقل شخصًا إلى موضع آخر. لم يُذكر الفاعل صراحة في هذه الجملة اليونانية، لكن السياق السابق يدل على الله؛ لذلك صُرّح به للوضوح، مع توثيق ذلك في الحاشية.
- source_word: εἰς τὴν γῆν ταύτην
  choice: إلى هذه الأرض
  rationale: ينقل اتجاه الحركة ويحافظ على لفظ «الأرض» في السياق الجغرافي الكتابي.
- source_word: εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: التي تقيمون فيها الآن
  rationale: صياغة عربية طبيعية تنقل الإقامة الحالية وتحافظ على خطاب الجمع.
theological_decisions:
- issue: تعيين فاعل μετῴκισεν
  choice: التصريح باسم «الله» في المتن مع حاشية تبين أن الفاعل غير مذكور لفظًا في اليونانية
  alternative: 'إبقاء الفاعل مستترًا: «نقله إلى هذه الأرض»'
  rationale: السياق القريب يجعل الله الفاعل المفهوم، والتصريح به يزيل التباس الضمائر في العربية، بينما تحفظ الحاشية طبيعة الصياغة اليونانية واحتمالها النحوي.
- issue: التوتر الزمني المتعلق بموت تارح وانتقال إبراهيم
  choice: نقل ترتيب رواية أعمال الرسل كما هو
  alternative: إعادة الصياغة للتوفيق الزمني الصريح مع سفر التكوين
  rationale: الأمانة للنص تقتضي عدم تسوية التوتر الظاهر داخل الترجمة؛ وتوجّه الحاشية القارئ إلى المواضع ذات الصلة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أقام» للإقامة المستقرة، و«نقله» لحركة الانتقال السببية، مع تجنب الألفاظ العتيقة أو الإدارية. وُضعت علامتا الحاشيتين في المتن كما يلزم.
