  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: ar
  text: 'فقال: «أيها الإخوة والآباء[a]، اسمعوا: إن إله المجد ظهر لأبينا إبراهيم حين كان في بلاد ما بين النهرين، قبل أن يقيم في حاران[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يا رجال، أيها الإخوة والآباء». صيغة النداء اليونانية مذكرة صراحةً ورسمية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قبل أن يستوطن حاران».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: فقال
  rationale: صيغة سردية عربية طبيعية تحفظ الاستمرار الخفيف الذي تفيده δέ من غير إثقال النص بحرف استدراك لا يقتضيه السياق.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: أيها الإخوة والآباء
  rationale: نداء رسمي موجَّه إلى رجال المجلس والحاضرين. تستوعب صيغة النداء العربية الطبيعية وظيفة ἄνδρες، مع إبقاء المخاطَبين بصيغة المذكر، وتُذكر الصيغة الحرفية في الحاشية.
- source_word: ἀκούσατε
  choice: اسمعوا
  rationale: أمر مباشر بطلب الانتباه، وهو فصيح وواضح في هذا المقام الخطابي.
- source_word: Ὁ θεὸς τῆς δόξης
  choice: إله المجد
  rationale: يحفظ تركيب الإضافة في اليونانية وما قد يحمله من صدى كتابي، بدل تحويله إلى الصفة التفسيرية «الإله المجيد».
- source_word: ὤφθη
  choice: ظهر
  rationale: المبني للمجهول من ὁράω يُستعمل هنا بمعنى الظهور الإلهي؛ و«ظهر» أقرب من العبارة التفسيرية «أعلن نفسه».
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: لأبينا إبراهيم
  rationale: تعبير عربي طبيعي يحفظ انتساب المتكلم وجمهوره المشترك إلى إبراهيم.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: حين كان في بلاد ما بين النهرين
  rationale: يفهم اسم الفاعل بوصفه ظرفًا زمنيًا، وتُستعمل التسمية العربية الشائعة الواضحة للمنطقة.
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: قبل أن يقيم في حاران
  rationale: «يقيم» تنقل معنى السكن في مكان من غير الجزم بدرجة الديمومة التي قد توحي بها «يستوطن»، مع إثبات البديل الممكن في الحاشية.
theological_decisions:
- issue: صيغة مخاطبة الجمهور المذكرة
  choice: أيها الإخوة والآباء
  alternative: أيها الرجال الإخوة والآباء
  rationale: يحافظ المتن على الصيغة المذكرة والعلاقات التي يفيدها النداء، لكنه يتجنب حرفية ثقيلة في العربية؛ وتوضح الحاشية وجود ἄνδρες وصبغة النداء الرسمية.
- issue: لقب الله θεὸς τῆς δόξης
  choice: إله المجد
  alternative: الإله المجيد
  rationale: يحفظ تركيب الإضافة واحتمال صداه في لغة العهد القديم، ولا يحسمه بتحويله إلى مجرد صفة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة خطابية مهيبة. استُخدمت صياغة طبيعية في المتن، مع حفظ حرفية النداء واحتمال معنى الاستيطان في الحواشي، ومن دون تسوية تركيب «إله المجد» إلى تفسير وصفي.
