  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: ar
  text: هٰذَا هُوَ الَّذِي أَخْرَجَهُمْ، صَانِعًا عَجَائِبَ وَآيَاتٍ فِي أَرْضِ مِصْرَ، وَفِي الْبَحْرِ الأَحْمَرِ[a]، وَفِي الْبَرِّيَّةِ مُدَّةَ أَرْبَعِينَ سَنَةً.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بحر القصب». أمّا النص اليوناني فيقول حرفيًا: «البحر الأحمر»، وهي التسمية المعتادة في العهد الجديد والترجمة السبعينية لموضع عبور بني إسرائيل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: هٰذَا هُوَ الَّذِي
  rationale: يحفظ إبراز اسم الإشارة في خطاب استفانوس وإحالته المؤكدة إلى موسى، بصياغة عربية طبيعية، من غير إدخال اسم غير مذكور في الآية.
- source_word: ἐξήγαγεν αὐτοὺς
  choice: أَخْرَجَهُمْ
  rationale: ينقل معنى القيادة أو الإخراج إلى خارج مصر بإيجاز عربي مألوف يلائم سياق الخروج.
- source_word: ποιήσας
  choice: صَانِعًا
  rationale: يحافظ على العلاقة الحالية للتركيب الوصفي مع الفعل الرئيس، وينسب الأفعال إلى موسى بوصفه الأداة البشرية كما يفعل النص.
- source_word: τέρατα καὶ σημεῖα
  choice: عَجَائِبَ وَآيَاتٍ
  rationale: يحفظ التمييز التقليدي والدلالي بين الأعمال المثيرة للدهشة والعلامات ذات الدلالة.
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: فِي أَرْضِ مِصْرَ
  rationale: يثبت لفظ γῇ ويحافظ على التوازي المكاني في الجملة.
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: فِي الْبَحْرِ الأَحْمَرِ
  rationale: ترجمة مباشرة للتسمية اليونانية المألوفة في العهد الجديد والسبعينية، مع إبقاء حرف الجر المتكرر ἐν.
- source_word: ἐν τῇ ἐρήμῳ
  choice: فِي الْبَرِّيَّةِ
  rationale: «البرية» أدق في السياق الكتابي لمسير إسرائيل ولا تحصر المكان في صحراء رملية.
- source_word: ἔτη τεσσεράκοντα
  choice: مُدَّةَ أَرْبَعِينَ سَنَةً
  rationale: يبين معنى الامتداد الزمني الذي يؤديه النصب في اليونانية بصياغة عربية واضحة.
theological_decisions:
- issue: مرجع اسم الإشارة والفاعلية في الخروج
  choice: إبراز موسى بوصفه الشخص الذي أخرج الشعب وصنع العجائب والآيات، من دون الإيحاء بأنه عمل مستقلًا عن الله.
  alternative: ترجمة اسم الإشارة بضمير مجرد، أو إعادة صياغة تنسب الأفعال مباشرة إلى الله بدلًا من موسى.
  rationale: النص يؤكد «هذا» في سياق حديث استفانوس عن موسى، ويسند إليه الإخراج وصنع الآيات بحسب الأسلوب الكتابي في وصف عمل الله من خلال وكيل بشري؛ لذلك حُفظ الإسناد كما ورد من غير تسوية للتوتر اللاهوتي.
translation_notes:
  register: فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «هٰذَا هُوَ الَّذِي» لحفظ التوكيد الخطابي، و«البرية» للمصطلح الكتابي المألوف. وُضع التشكيل لتيسير القراءة من غير تغيير البنية أو إضافة تفسير إلى المتن.
