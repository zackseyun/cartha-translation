  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: ar
  text: 'لكنَّ الذي كان يظلم قريبه دفعه بعيدًا[a] وقال: «مَن أقامك رئيسًا وقاضيًا علينا؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «زحزحه جانبًا». قد يشدّد الفعل اليوناني على دفع جسدي قوي أو على صدٍّ بازدراء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: كان يظلم
  rationale: ينقل دلالة الظلم في الفعل ἀδικέω، كما يحافظ تركيب «كان» مع المضارع على الاستمرار الذي يفيده اسم الفاعل اليوناني في السياق.
- source_word: πλησίον
  choice: قريبه
  rationale: «القريب» مقابل عربي مباشر يفيد الشخص القريب أو الآخر الذي تربطه به رابطة جماعة، من غير تقييد المعنى صراحةً بأنه إسرائيلي آخر.
- source_word: ἀπώσατο
  choice: دفعه بعيدًا
  rationale: يحافظ على الطابع الجسدي والرافض للفعل، بدل اختزاله في معنى الرفض المجرّد.
- source_word: κατέστησεν
  choice: أقامك
  rationale: «أقام» تعبير عربي طبيعي ينقل معنى التنصيب أو الوضع في منصب ذي سلطة.
- source_word: ἄρχοντα
  choice: رئيسًا
  rationale: ينقل معنى صاحب الرئاسة والسلطة، ويلائم اقترانه بـ«قاضيًا» في هذا السياق.
- source_word: δικαστὴν
  choice: قاضيًا
  rationale: المقابل العربي المباشر الذي يحفظ الوظيفة القضائية في العبارة.
- source_word: ἐφ’ ἡμῶν
  choice: علينا
  rationale: ينقل معنى ممارسة السلطة على الجماعة مع ἐπί والمضاف إليه في هذا السياق.
