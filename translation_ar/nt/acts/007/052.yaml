id: ACT.7.52
reference: Acts 7:52
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: ar
  text: «أيَّ نبيٍّ من الأنبياء لم يضطهده آباؤكم[c]؟ وقتلوا الذين سبق أن أعلنوا مجيء البارّ[a]، الذي صرتم أنتم الآن خَوَنَتَه وقَتَلَتَه[b].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العادل».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «خَوَنَتَه» بـ«الغادرين به».
    reason: lexical_alternative
  - marker: c
    text: 'أو: «أسلافكم»؛ واللفظ اليوناني يعني حرفيًا «آباءكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: أيَّ نبيٍّ من الأنبياء
  rationale: ينقل تركيب التبعيض وقوة السؤال الاستنكاري بعبارة عربية واضحة، ومفاده أن الاضطهاد طال الأنبياء جميعًا.
- source_word: ἐδίωξαν
  choice: يضطهده
  rationale: الاضطهاد هو المعنى السياقي للملاحقة العدائية التي تعرض لها الأنبياء.
- source_word: οἱ πατέρες ὑμῶν
  choice: آباؤكم
  rationale: ترجمة قريبة من اللفظ اليوناني وتحافظ على الربط الاتهامي بين المخاطَبين وآبائهم، مع بيان البديل «أسلافكم» في الحاشية.
- source_word: ἀπέκτειναν
  choice: قتلوا
  rationale: تعبير عربي مباشر ومعاصر يؤدي معنى الفعل من غير تلطيف أو تقادم لغوي.
- source_word: τοὺς προκαταγγείλαντας
  choice: الذين سبق أن أعلنوا
  rationale: يحافظ على معنى الإعلان وعلى الدلالة الزمنية للسابقة προ-، من غير حصر العبارة في مفهوم تقني للنبوة.
- source_word: περὶ τῆς ἐλεύσεως
  choice: مجيء
  rationale: ينسجم طبيعيًا مع فعل الإعلان السابق ويحافظ على معنى الإتيان أو القدوم.
- source_word: τοῦ δικαίου
  choice: البارّ
  rationale: ينقل الوصف المعرّف بوصفه لقبًا دالًا على شخص بعينه في السياق، وهو تعبير كتابي مفهوم في العربية.
- source_word: οὗ
  choice: الذي ... خَوَنَتَه وقَتَلَتَه
  rationale: أعيد بناء علاقة المضاف إليه بضمير المفعول في العربية، بما يربط الخيانة والقتل مباشرة بالبار.
- source_word: νῦν
  choice: الآن
  rationale: يحفظ المقابلة الزمنية بين فعل الآباء ومسؤولية المخاطَبين الحاضرة.
- source_word: προδόται
  choice: خَوَنَتَه
  rationale: يدل على من خانوه أو أسلموه، من غير الإيحاء السياسي الأضيق الذي قد تحمله بعض البدائل.
- source_word: φονεῖς
  choice: قَتَلَتَه
  rationale: صيغة «قَتَلَة» تحمل إدانة أخلاقية أقوى من مجرد وصف محايد لمن تسببوا في الموت.
- source_word: ἐγένεσθε
  choice: صرتم
  rationale: يحفظ الدلالة الصيرورية للفعل، بينما يبرز «الآن» حالتهم الراهنة الناتجة.
theological_decisions:
- issue: فهم τοῦ δικαίου بوصفه لقبًا مسيانيًا
  choice: البارّ
  alternative: العادل
  rationale: السياق يشير إلى يسوع بوصفه الشخص المحدد الذي سبق الأنبياء فأعلنوا مجيئه. التعريف في «البارّ» يحفظ قوة اللقب من غير إضافة تفسير مذهبي.
- issue: صلة الخيانة والقتل بالبار
  choice: الذي صرتم أنتم الآن خَوَنَتَه وقَتَلَتَه
  alternative: الذي صرتم الآن خونةً له وقَتَلَةً
  rationale: الصياغة المختارة تحفظ مرجع الضمير اليوناني وتُسند الجريمتين كلتيهما بوضوح إلى المخاطَبين في علاقتهم بالبار.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة خطابية وقورة. حُفظ السؤال الاستنكاري، والتوازي بين الآباء والمخاطَبين، وقوة الاتهام، مع تجنب الألفاظ القديمة غير المألوفة. وُضعت جميع علامات الحواشي في مواضعها داخل النص.
