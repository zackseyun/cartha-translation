  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: ar
  text: أَمَّا هُوَ، فَإِذْ كَانَ مُمْتَلِئًا مِنَ الرُّوحِ الْقُدُسِ، حَدَّقَ إِلَى السَّمَاءِ[a]، فَرَأَى مَجْدَ اللهِ، وَيَسُوعَ وَاقِفًا عَنْ يَمِينِ اللهِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمعن النظر إلى السماء».'
    reason: lexical_alternative
  - marker: b
    text: تعبير «عن يمين الله» اصطلاح كتابي يدل على مقام أسمى كرامة وسلطان.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων
  choice: فإذ كان
  rationale: ينقل اسم الفاعل الحالي بوصفه حالًا مستمرة لستيفانوس قبل الفعل الرئيس، بصياغة عربية طبيعية.
- source_word: πλήρης πνεύματος ἁγίου
  choice: ممتلئًا من الروح القدس
  rationale: تعبير عربي واضح يحفظ معنى الامتلاء بالروح القدس بوصفه مرجعًا شخصيًا إلهيًا في سياق لوقا وأعمال الرسل.
- source_word: ἀτενίσας
  choice: حدّق
  rationale: يفيد النظر المركز والمتواصل، ويحفظ قوة اللفظ اليوناني أكثر من «نظر» وحدها.
- source_word: εἰς τὸν οὐρανὸν
  choice: إلى السماء
  rationale: السياق رؤيوي، ولذلك تشير السماء هنا إلى المجال السماوي لا إلى الجو المرئي فحسب.
- source_word: εἶδεν
  choice: رأى
  rationale: مقابل مباشر وطبيعي للفعل الرئيس دون مسحة لغوية قديمة.
- source_word: δόξαν θεοῦ
  choice: مجد الله
  rationale: يحفظ التركيب الإضافي ودلالة ظهور جلال الله من غير شرح داخل النص.
- source_word: Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم.
- source_word: ἑστῶτα
  choice: واقفًا
  rationale: يحفظ هيئة الوقوف التي يصورها اسم الفاعل التام اليوناني بوضوح وحيوية.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: عن يمين الله
  rationale: هذا هو المقابل الاصطلاحي العربي الطبيعي للتعبير المكاني الكتابي، ويحفظ صورة موضع الكرامة والسلطان.
- source_word: δέ
  choice: أمّا هو
  rationale: يُظهر المقابلة اللطيفة مع موقف الجموع في السياق السابق، ويحدد ستيفانوس بوضوح في العربية.
theological_decisions:
- issue: دلالة πνεύματος ἁγίου
  choice: الروح القدس
  alternative: روح مقدسة
  rationale: استعمال لوقا وأعمال الرسل والسياق المباشر يرجحان الإشارة إلى الروح القدس، لا إلى صفة أو قوة غير شخصية.
- issue: رؤية يسوع عن يمين الله
  choice: يسوع واقفًا عن يمين الله
  alternative: يسوع واقفًا من يمين الله
  rationale: يحفظ النص التمييز بين الله ويسوع، كما يصون صورة رفعة يسوع وكرامته دون تفسيرها أو اختزالها داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «حدّق» لنقل شدة النظر، و«عن يمين الله» للمحافظة على الاصطلاح الكتابي المألوف. وُضعت علامتا الحاشيتين في المتن كما يلزم.
