  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: ar
  text: 'فقال له الرب: «اخلع نعلك من رجليك[a]، لأن الموضع الذي تقف عليه أرض مقدسة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكبر: «حُلَّ نعلك من رجليك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: الرب
  rationale: الترجمة العربية المألوفة للقب κύριος، وتحفظ جلال السياق من غير إدخال اسم العهد الإلهي الذي لا يرد في النص اليوناني.
- source_word: Λῦσον
  choice: اخلع
  rationale: المعنى الحرفي هو «حُلَّ»، لكن المقصود في سياق النعل هو نزعه؛ و«اخلع» تعبير عربي طبيعي ودقيق.
- source_word: τὸ ὑπόδημα
  choice: نعلك
  rationale: حُفظ الإفراد الوارد في اليونانية، خلافًا للجمع في طبقة الاستشارة الإنجليزية المنقحة. وأضيف ضمير المخاطب في العربية لإيضاح العلاقة التي يدل عليها تركيب «من رجليك» في السياق.
- source_word: τῶν ποδῶν σου
  choice: من رجليك
  rationale: يحفظ جمع «قدم» في الأصل ويؤدي معنى الانفصال المقصود مع فعل الخلع.
- source_word: ὁ γὰρ τόπος
  choice: لأن الموضع
  rationale: «الموضع» مقابل مباشر لـ τόπος، و«لأن» تنقل وظيفة γάρ التفسيرية بوضوح.
- source_word: ἐφ’ ᾧ ἕστηκας
  choice: الذي تقف عليه
  rationale: صياغة عربية طبيعية تحفظ معنى الوقوف الحالي والقوة المكانية لحرف الجر ἐπί.
- source_word: γῆ ἁγία
  choice: أرض مقدسة
  rationale: يناسب «أرض» الموقع المحلي المقصود، وتحفظ «مقدسة» وصف المكان بأنه مكرس وذو حرمة.
theological_decisions:
- issue: ترجمة κύριος في اقتباس يتحدث عن ظهور إلهي في خروج 3
  choice: الرب
  alternative: يهوه
  rationale: النص اليوناني نفسه يقرأ κύριος ولا يذكر الاسم الرباعي؛ لذلك تعكس «الرب» الدليل النصي المباشر وتحفظ الصلة بالاستعمال الكتابي من غير استبدال اللفظ اليوناني باسم غير وارد هنا.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. حُفظ إفراد «النعل» في الأصل اليوناني، مع بيان الصياغة الحرفية في الحاشية، واستُعملت جملة عربية طبيعية من غير تسوية التوتر بين النعل المفرد والرجلين بالجمع.
