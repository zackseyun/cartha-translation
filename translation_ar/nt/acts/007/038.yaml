  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: ar
  text: هذا هو الذي كان في الجماعة في البرية، مع الملاك الذي كان يكلّمه على جبل سيناء، ومع آبائنا؛ فتسلَّم أقوالًا حيّة[a] ليعطيها لنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «كلمات حيّة» أو «أقوال محيية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: الجماعة
  rationale: تدل هنا على جماعة إسرائيل المجتمعة في البرية، وتحافظ «الجماعة» على المعنى من غير أن تستورد الدلالة المؤسسية اللاحقة التي قد توحي بها «الكنيسة».
- source_word: ἐρήμῳ
  choice: البرية
  rationale: هي العبارة الكتابية العربية الطبيعية لسياق تيه إسرائيل، وأوسع دلالة من «الصحراء».
- source_word: ἀγγέλου
  choice: الملاك
  rationale: يشير سياق سيناء إلى كائن ملائكي، لا إلى رسول بشري.
- source_word: λαλοῦντος
  choice: الذي كان يكلّمه
  rationale: تحافظ الصياغة على دلالة الفعل المستمر في اسم الفاعل اليوناني، كما تُظهر أن الملاك كان يخاطب موسى.
- source_word: ὄρει Σινᾶ
  choice: جبل سيناء
  rationale: الصياغة العربية المعيارية والطبيعية لاسم الموضع.
- source_word: πατέρων ἡμῶν
  choice: آبائنا
  rationale: تنقل التعبير اليوناني المباشر وتشير في السياق إلى أسلاف إسرائيل.
- source_word: ἐδέξατο
  choice: تسلَّم
  rationale: تلائم تلقي موسى للوحي الموكَل إليه، وتبيّن معنى الاستلام بوضوح.
- source_word: λόγια
  choice: أقوالًا إلهية
  rationale: λόγια تعني أقوالًا ذات مصدر وسلطان إلهيين؛ وإضافة «إلهية» في العربية تميّزها من الأقوال العادية من دون غموض لفظ «وحي» الذي قد يدل على العملية أو النص كله.
- source_word: ζῶντα
  choice: حيّة
  rationale: تنقل الوصف المباشر «حيّة» وتحافظ على ثرائه ولا تحصره في التفسير السببي «محيية».
- source_word: δοῦναι
  choice: ليعطيها
  rationale: تنقل المصدر الدال على الغاية بصورة عربية طبيعية، مع عود الضمير إلى الأقوال.
- source_word: ἡμῖν
  choice: لنا
  rationale: تحافظ على إدراج استفانوس نفسه وسامعيه ضمن تاريخ إسرائيل.
- source_word: ὁ γενόμενος
  choice: الذي كان
  rationale: صياغة عربية طبيعية تفيد وجود موسى وحضوره في ذلك الجمع، من غير الترجمة الحرفية الثقيلة «الذي صار».
theological_decisions:
- issue: هل تُترجم ἐκκλησίᾳ بما يفيد «الكنيسة» في هذا الموضع؟
  choice: الجماعة
  alternative: الكنيسة؛ المحفل
  rationale: المقصود إسرائيل مجتمعة في البرية. وتتفادى «الجماعة» فرض هوية مؤسسية كنسية لاحقة، مع إبقاء المعنى الجمعي للكلمة.
- issue: هل يُفسَّر λόγια ζῶντα بأنه «أقوال محيية»؟
  choice: أقوالًا إلهية حيّة
  alternative: كلمات حيّة؛ أقوالًا إلهية محيية
  rationale: تحافظ «حيّة» على صورة النص واحتمال أن تكون الأقوال متصفة بالحياة أو مانحة لها، بدل حصر العبارة في أثرها المحيي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «الجماعة» و«البرية» لصياغة كتابية مفهومة، مع تجنّب اللفظ الكنسي المحمّل دلاليًا. وُضعت علامة الحاشية [a] مباشرة بعد العبارة التي تشرحها.
