  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: الآباء الأوّلون
  rationale: يشير التعبير هنا إلى أبناء يعقوب بوصفهم آباء أسباط إسرائيل. وهذه الصياغة تنقل المعنى التاريخي بوضوح، وتتجنب الإيحاء الكنسي الحديث الذي قد تحمله كلمة «البطاركة».
- source_word: ζηλώσαντες
  choice: حسد
  rationale: الفعل في هذا السياق يدل على الحسد الذي دفعهم إلى الفعل اللاحق. وصيغة «حسدوا يوسف» عربية طبيعية وتحفظ قوة الدافع في الأصل.
- source_word: ἀπέδοντο
  choice: باعوه
  rationale: المقصود في سياق قصة يوسف هو البيع، لا مجرد التسليم، ولذلك تنقل «باعوه» المعنى المحدد بوضوح.
- source_word: εἰς Αἴγυπτον
  choice: إلى مصر
  rationale: تفيد العبارة حركة يوسف إلى مصر نتيجة بيعه، و«إلى مصر» هي الصياغة العربية الطبيعية الموافقة للسياق.
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: وكان الله معه
  rationale: تنقل العبارة ببساطة حضور الله مع يوسف، مع إبقاء الضمير لأن مرجعه واضح في السياق.
theological_decisions:
- issue: حضور الله مع يوسف في معاناته
  choice: وكان الله معه
  alternative: وكان الله مع يوسف
  rationale: تحفظ الصياغة التوتر الذي يقرره النص بين خيانة إخوته له وحضور الله معه، من غير إضافة تفسير عن العناية الإلهية يتجاوز منطوق الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعملت «الآباء الأوّلون» بدل «البطاركة» لتجنب الدلالة الكنسية الشائعة، وجاء الربط بالفاء لإظهار أن البيع نتج عن الحسد من غير إثقال العبارة ببنية اسمية حرفية.
