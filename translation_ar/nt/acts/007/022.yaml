  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: ar
  text: وتلقّى موسى تعليمًا في كل حكمة المصريين، وكان مقتدرًا في أقواله وأعماله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الكلام والعمل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: تلقّى تعليمًا
  rationale: ينقل المبني للمجهول ومعنى التكوين والتعليم الذي تلقّاه موسى، بصياغة عربية طبيعية وواضحة.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: في كل حكمة المصريين
  rationale: يحفظ شمول πάσῃ، ويعبّر عن مجال التعليم ومضمونه مع إبقاء نسبة الحكمة إلى المصريين.
- source_word: δυνατὸς
  choice: مقتدرًا
  rationale: ينقل معنى القوة والتمكّن، ويلائم التركيب اللاحق «في أقواله وأعماله» بلغة عربية فصيحة غير متكلّفة.
- source_word: ἐν λόγοις καὶ ἔργοις
  choice: في أقواله وأعماله
  rationale: يحافظ على التوازي بين القول والعمل، وهو تعبير عربي واضح وقريب من بنية اليونانية.
- source_word: αὐτοῦ
  choice: ـه في «أقواله وأعماله»
  rationale: عُدَّ الضمير متعلقًا بالاسمين المنسّقين، وهو الفهم الطبيعي في السياق.
theological_decisions:
- issue: مدى اقتدار موسى في λόγοις
  choice: وكان مقتدرًا في أقواله وأعماله
  alternative: وكان مقتدرًا في الكلام والعمل
  rationale: تُرجمت عبارة استفانوس بحسب دلالتها في هذا الموضع من غير مواءمتها قسرًا مع قول موسى في خروج 4:10؛ وبذلك يبقى التوتر النصي قائمًا ولا يُحلّ بتفسير ضمني.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية رصينة. استُخدم «تلقّى تعليمًا» بدل صيغة أثقل مثل «تثقّف»، و«مقتدرًا» للحفاظ على قوة δυνατός من غير مبالغة.
