  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: ar
  text: 'وقال له: «اخرج من أرضك ومن عشيرتك[a]، وتعال إلى الأرض التي سأريك إياها».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أقربائك» أو «أهلك». تشير الكلمة اليونانية συγγένεια إلى جماعة قرابة الشخص أو عشيرته.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: وقال له
  rationale: يحافظ على الضمير الوارد في اليونانية من غير استبداله باسم إبراهيم، إذ يحدده السياق.
- source_word: Ἔξελθε ἐκ τῆς γῆς σου
  choice: اخرج من أرضك
  rationale: ينقل فعل الأمر وحركة الخروج من المكان، وتؤدي «أرضك» المعنى الإقليمي من غير إيحاءات الدولة الحديثة.
- source_word: συγγενείας
  choice: عشيرتك
  rationale: تدل الكلمة على جماعة القرابة، و«عشيرتك» تحافظ على معناها الجمعي الأوسع من الأسرة المباشرة.
- source_word: δεῦρο εἰς τὴν γῆν
  choice: وتعال إلى الأرض
  rationale: تحافظ «تعال» على الإشارة الاتجاهية في δεῦρο، بينما تنقل «إلى» حركة التوجه الطبيعية في العربية.
- source_word: ἣν ἄν σοι δείξω
  choice: التي سأريك إياها
  rationale: ينقل تركيب المستقبل العربي الدلالة المستقبلية المقصودة من ἄν مع صيغة الالتزام، ويأتي التعبير فصيحًا وطبيعيًا.
