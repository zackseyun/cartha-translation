  source_fidelity: 'المعنى الأساسي محفوظ: العهد هو عهد الختان، والختان في اليوم الثامن، وتسلسل النسب صحيح. لكن الضمير المستتر في «وهكذا أنجب إسحاق» قد يعود نحويًا إلى الله، فتوحي العبارة خطأً بأن الله هو الذي أنجب إسحاق. اليونانية تجعل إبراهيم هو الفاعل المفهوم من السياق، ويلزم إظهاره في العربية لإزالة هذا الالتباس.'
