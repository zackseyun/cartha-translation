revisions:
- from: وأعطاه عهدَ الختان. وهكذا أنجب إسحاقَ وختنه في اليوم الثامن، وإسحاقُ أنجب يعقوبَ، ويعقوبُ أنجب رؤساءَ الآباء الاثني عشر.[a]
  to: وأعطى اللهُ إبراهيمَ عهدَ الختان. وهكذا أنجب إبراهيمُ إسحاقَ وختنه في اليوم الثامن، وأنجب إسحاقُ يعقوبَ، وأنجب يعقوبُ الآباءَ المؤسسين الاثني عشر.[a]
  rationale: أُظهر «الله» و«إبراهيم» حيث يقتضي التركيب العربي تعيين الفاعل بوضوح؛ وهذا لا يضيف معلومة إلى المعنى المقصود بل يمنع انقلاب الإحالة الذي قد ينتج من النقل الحرفي للضمائر اليونانية. وحُسّنت تسمية πατριάρχας مع حاشية تفسيرية موجزة.
