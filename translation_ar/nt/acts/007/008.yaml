source:
  edition: SBLGNT
  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: ar
  text: وأعطى اللهُ إبراهيمَ عهدَ الختان. وهكذا أنجب إبراهيمُ إسحاقَ وختنه في اليوم الثامن، وأنجب إسحاقُ يعقوبَ، وأنجب يعقوبُ الآباءَ المؤسسين الاثني عشر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي أبناء يعقوب الاثنا عشر، الذين صاروا الآباء المؤسسين لأسباط إسرائيل.
    reason: توضيح المقصود التاريخي من «الآباء المؤسسين» وترسيخ الإحالة إلى πατριάρχας من غير إدخال لقب كنسي في المتن.
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: عهدَ الختان
  rationale: «عهد» هو المقابل الطبيعي في السياق الكتابي التاريخي، والإضافة إلى «الختان» تعرّف العهد بسمته العهدية كما في تكوين 17. لا تحتاج العربية هنا إلى أداة تعريف مستقلة لأن تركيب الإضافة يحقق التعريف.
- source_word: οὕτως
  choice: وهكذا
  rationale: تحفظ الصلة الاستنتاجية والتتابعية بين إعطاء العهد وما يليه، بصياغة عربية واضحة وطبيعية.
- source_word: ἐγέννησεν
  choice: أنجب
  rationale: ينقل فعل التناسل في سلسلة النسب بصياغة حديثة غير عتيقة، مع بقاء الفاعل الذكري واضحًا من أسماء الأشخاص.
- source_word: περιέτεμεν
  choice: ختنه
  rationale: الفعل العربي القياسي المباشر للختان، والضمير يحفظ إحالة المفعول إلى إسحاق.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: في اليوم الثامن
  rationale: تعبير زمني عربي مألوف يحافظ على مقدار ما يصرح به اليوناني من غير إضافة «بعد ولادته».
- source_word: πατριάρχας
  choice: رؤساءَ الآباء
  rationale: تعبير كتابي مفهوم يدل على الآباء المؤسسين لأسباط إسرائيل، ويتجنب غرابة اللفظ المعرّب «البطاركة» أو التباسه الكنسي في العربية المعاصرة.
- source_word: Ἰσαάκ / Ἰακώβ
  choice: إسحاق / يعقوب
  rationale: اتباع الصيغ العربية الكتابية الراسخة للأسماء الشخصية.
theological_decisions:
- issue: تحديد العهد المشار إليه
  choice: عهد الختان
  alternative: عهدًا للختان
  rationale: تركيب الإضافة العربي يفيد العهد المحدد المعروف من سياق معاملة الله لإبراهيم، من غير إدخال تفسير لاهوتي زائد.
- issue: صياغة γεννάω في سلسلة النسب
  choice: أنجب
  alternative: وَلَدَ / صار أبًا لـ
  rationale: «أنجب» واضح ومعاصر ويحفظ العلاقة النَّسَبية، بينما قد تبدو «وَلَدَ» ملتبسة الضبط أو أقل سلاسة، و«صار أبًا لـ» أطول.
- issue: الاختصار في شطري إسحاق ويعقوب
  choice: إعادة «أنجب» توضيحًا للمعنى
  alternative: 'إبقاء الحذف كما في اليونانية: «وإسحاقُ يعقوبَ، ويعقوبُ رؤساءَ الآباء...»'
  rationale: اليونانية تحذف الفعل في الشطرين الأخيرين مع فهمه من السياق. إعادته في العربية ضرورية تقريبًا لوضوح الجملة، ولا تغير مضمون النسب.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظ إيقاع السلسلة النَّسَبية بتكرار «أنجب»، واستُعمل «رؤساء الآباء» بدل «البطاركة» تجنبًا للالتباس الكنسي المعاصر.
