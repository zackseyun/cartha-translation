base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: ar
  text: 'ثم جثا على ركبتيه وصرخ بصوت عالٍ: «يا رب، لا تحسب عليهم هذه الخطيئة[a]». ولما قال هذا، رقد[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تؤاخذهم بهذه الخطيئة»، أو: «لا تُثبِت هذه الخطيئة في حسابهم».'
    reason: lexical_alternative
  - marker: b
    text: 'أي مات؛ فاليونانية تقول حرفيًا: «رقد»، وهو تعبير مألوف عن الموت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: ثم جثا على ركبتيه
  rationale: التعبير اليوناني يعني حرفيًا وضع الركبتين، وهو اصطلاح يفيد الجثو. وصيغته العربية الطبيعية «جثا على ركبتيه»، مع ترجمة δέ بـ«ثم» لإظهار تقدّم السرد.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: وصرخ بصوت عظيم
  rationale: يحافظ هذا على فعل الصراخ وعلى العبارة الاسمية المؤكدة «بصوت عظيم»، بدل اختزالها في حال أو ظرف.
- source_word: Κύριε
  choice: يا رب
  rationale: هذه الصيغة العربية المألوفة للنداء تحفظ لقب κύριος وما فيه من توقير، والسياق السابق يبيّن أن الخطاب موجّه إلى يسوع.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: لا تحسب عليهم هذه الخطيئة
  rationale: الفعل هنا يحمل معنى إثبات الخطيئة في حسابهم أو مؤاخذتهم بها. و«لا تحسب عليهم» عربية واضحة تحفظ الدلالة الحسابية أو القضائية، كما تُبقي اسم الإشارة «هذه» صريحًا.
- source_word: καὶ τοῦτο εἰπὼν
  choice: ولما قال هذا
  rationale: تنقل العبارة الحالية السابقة زمنيًا إلى تركيب عربي سلس يبيّن أن الرقاد وقع بعد هذا القول مباشرة.
- source_word: ἐκοιμήθη
  choice: رقد
  rationale: يحفظ الفعل استعارة النوم التي يستعملها النص للموت، من غير تسطيحها إلى «مات» أو إضافة تفسير عقائدي إلى المتن.
theological_decisions:
- issue: استعارة النوم في ἐκοιμήθη
  choice: رقد
  alternative: مات
  rationale: النص اليوناني يعبّر عن موت استفانوس بالنوم. إبقاء «رقد» يصون الصورة المقصودة ونبرتها، وتوضح الحاشية معناها في السياق.
- issue: نداء Κύριε في صلاة استفانوس
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» تحفظ الاستعمال اللقبي الموقر، ويحدّد السياق في الآية السابقة أن المخاطَب هو يسوع، من غير حاجة إلى توسيع تفسيري داخل المتن.
- issue: الدلالة القضائية أو الحسابية لعبارة μὴ στήσῃς αὐτοῖς
  choice: لا تحسب عليهم
  alternative: لا تؤاخذهم بهذه الخطيئة
  rationale: الاختيار يحفظ صورة إثبات الخطيئة في حسابهم، بينما البديل يعبّر عن نتيجتها القضائية. أُبقي البديل في الحاشية لصون مدى الدلالة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «جثا على ركبتيه» لصياغة الحركة صياغة طبيعية، وأُبقيت عبارتا «بصوت عظيم» و«رقد» لقربهما من بنية الأصل وصورته. تظهر علامتا الحاشيتين [a] و[b] في المتن.
