base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: ar
  text: 'هذا هو موسى الذي قال لبني إسرائيل[b]: «سيقيم الله لكم نبيًّا[a] من بين إخوتكم[c] مثلي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن، على سبيل التفسير، أن تُترجم: «النبي»، في ضوء التطلع المعروف المرتبط بتثنية 18:15 وتطبيقه على يسوع في سفر الأعمال.'
    reason: alternative_reading
  - marker: b
    text: 'اللفظ اليوناني هو حرفيًّا «أبناء إسرائيل»، ويمكن أيضًا أن يُترجم: «الإسرائيليين».'
    reason: lexical_alternative
  - marker: c
    text: المقصود بـ«إخوتكم» هنا إخوتهم من بني إسرائيل؛ واللفظ اليوناني بصيغة المذكر الجمع.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: هذا هو موسى
  rationale: يحافظ تركيب «هذا هو» على قوة الإشارة والتعريف المؤكدين في اليونانية، من غير إدخال أداة تعريف غير طبيعية قبل اسم موسى في العربية.
- source_word: ὁ εἴπας
  choice: الذي قال
  rationale: صياغة عربية طبيعية تنقل اسم الفاعل الماضي المستعمل وصفًا لموسى.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: لبني إسرائيل
  rationale: تعبير عربي مألوف ووقور، ويحافظ على الصورة البنوية في اللفظ اليوناني وعلى صدى الاقتباس من العهد القديم.
- source_word: Προφήτην
  choice: نبيًّا
  rationale: الاسم في اليونانية غير معرّف، ولذلك تُحفظ دلالته المباشرة من غير فرض القراءة التفسيرية «النبي» في المتن.
- source_word: ἀναστήσει
  choice: سيقيم
  rationale: ينقل فعل إقامة نبي وإظهاره بتكليف من الله، وهو تعبير عربي طبيعي في هذا السياق النبوي.
- source_word: ὁ θεὸς
  choice: الله
  rationale: فاعل الفعل في الاقتباس، وتقديمه بعد الفعل سليم وطبيعي في العربية.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: من بين إخوتكم
  rationale: «من بين» تُظهر أن النبي يخرج من داخل الجماعة، و«إخوتكم» تحفظ الاستعارة العائلية القومية وصيغة المذكر الجمع.
- source_word: ὡς ἐμέ
  choice: مثلي
  rationale: ترجمة موجزة ومباشرة لعبارة المقارنة، وتُبقي طبيعة الشبه بموسى من غير شرح زائد.
theological_decisions:
- issue: اقتباس تثنية 18:15 ودلالته المسيانية
  choice: نبيًّا
  alternative: النبي
  rationale: للاقتباس في سفر الأعمال دلالة مرتبطة بالمسيح، لكن الاسم اليوناني هنا غير معرّف. لذلك لا يحسم المتن الدلالة التفسيرية بإضافة التعريف، بل يترك للقارئ أن يدرك تطبيق النبوءة من السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «بني إسرائيل» لصِلته المألوفة بلغة الاقتباسات الكتابية، مع الحفاظ على التأكيد في «هذا هو موسى» وعلى عدم تعريف «نبيًّا» كي لا يُفرض تفسير لاهوتي في صلب النص.
