  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: ar
  text: وأنقذه من جميع ضيقاته[a]، ومنحه حظوةً[b] وحكمةً أمام فرعون ملك مصر، وعيَّنه حاكمًا على مصر وعلى بيت فرعون كله[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وخلَّصه من جميع شدائده».'
    reason: lexical_alternative
  - marker: b
    text: '«الحظوة» هنا تعني القبول والمكانة الحسنة لدى فرعون؛ ويمكن ترجمتها: «نعمةً».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «وأقامه حاكمًا على مصر وعلى بيت فرعون كله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: أنقذه
  rationale: يفيد الفعل هنا التخليص الفعلي من الخطر والضيق، و«أنقذه» تعبير عربي واضح وطبيعي.
- source_word: θλίψεων
  choice: ضيقات
  rationale: تشمل الكلمة ما عاناه يوسف من شدائد وضغوط، وتحفظ «ضيقات» ثقل المعنى من غير إيحاء أخروي خاص.
- source_word: χάριν
  choice: حظوةً
  rationale: السياق يدل على القبول والمكانة الحسنة لدى فرعون، لا على المعنى اللاهوتي الأوسع الذي قد تحمله «نعمة».
- source_word: σοφίαν
  choice: حكمةً
  rationale: تنقل المعنى المباشر، بما فيه حسن التدبير والتمييز العملي اللذان ظهرا لفرعون.
- source_word: ἐναντίον
  choice: أمام
  rationale: تفيد الحضور أو المثول في نظر شخص، و«أمام فرعون» صياغة عربية موجزة وأمينة.
- source_word: κατέστησεν
  choice: عيَّنه
  rationale: يدل الفعل في هذا التركيب على إسناد منصب أو سلطة إلى شخص.
- source_word: ἡγούμενον
  choice: حاكمًا
  rationale: يدل على من يتولى القيادة والسلطة؛ و«حاكمًا» واضحة من غير تضييق المعنى إلى منصب إداري حديث محدد.
- source_word: ἐπ’ Αἴγυπτον
  choice: على مصر
  rationale: ينقل نطاق السلطة الذي أُقيم يوسف عليه.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: بيته كله
  rationale: «البيت» هنا يشمل بيت فرعون وأهل بيته وإدارته، وتحافظ الصياغة على صورة الأصل مع بقائها مفهومة.
theological_decisions:
- issue: مرجع الفاعل المستتر في أفعال الآية
  choice: أُبقي الفاعل مستترًا، وهو مفهوم من السياق على أنه الله.
  alternative: إضافة لفظ «الله» صراحةً في أول الآية.
  rationale: الأفعال اليونانية لا تسمّي الفاعل في هذه الآية، لكنها تواصل سياق الآية السابقة حيث كان الله مع يوسف. إبقاء الفاعل مستترًا يصون أسلوب الأصل ولا يحجب المرجع السياقي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُعملت «حظوة» لتحديد معنى القبول لدى فرعون، و«بيته كله» للمحافظة على صورة οἶκος مع فهمها بوصفها دائرة البيت والإدارة، كما أُبقي فاعل الأفعال مستترًا وفق بنية النص اليوناني وسياقه.
