lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: وفي ذلك الوقت
  rationale: تعبير عربي طبيعي يحفظ الإحالة الزمنية ويربط الآية بسياق الخطاب السابق.
- source_word: ἐγεννήθη
  choice: وُلِد
  rationale: المبني للمجهول هو المقابل العربي المألوف للفعل في سياق الولادة.
- source_word: Μωϋσῆς
  choice: موسى
  rationale: الصيغة العربية الكتابية الراسخة للاسم.
- source_word: ἀστεῖος
  choice: جميلًا
  rationale: يحفظ المعنى الظاهر المتعلق بالجمال، من غير تضييقه على الوسامة الجسدية أو توسيعه إلى معنى «استثنائي».
- source_word: τῷ θεῷ
  choice: في نظر الله
  rationale: يعبّر بوضوح وطبيعية عن دلالة التقييم أو المرجع في صيغة المجرور اليونانية، مع إبقاء ذكر الله الصريح.
- source_word: ὃς ἀνετράφη
  choice: وتربّى
  rationale: صياغة عربية طبيعية تفيد التنشئة والرعاية، وتحافظ على عودة الضمير إلى موسى دون جملة موصولة ثقيلة.
- source_word: μῆνας τρεῖς
  choice: ثلاثة أشهر
  rationale: العربية لا تحتاج إلى حرف جر للتعبير عن مدة التنشئة هنا.
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: في بيت أبيه
  rationale: ترجمة مباشرة وطبيعية تحفظ دلالة البيت والعلاقة الأبوية.
theological_decisions:
- issue: دلالة ἀστεῖος τῷ θεῷ
  choice: كان جميلًا في نظر الله
  alternative: كان جميلًا لله؛ كان حسنًا جدًا؛ كان طفلًا جميلًا
  rationale: يحفظ الاختيار ذكر الله الصريح ويعرض العبارة كتقييم في نظره، من غير تحويلها إلى حكم بشري محض أو إضافة معنى لاهوتي أقوى مما يقوله النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «في نظر الله» بدل الترجمة الحرفية غير المألوفة «جميلًا لله»، مع توثيق البديل في الحاشية والحفاظ على الغموض الدلالي في صفة ἀστεῖος.
