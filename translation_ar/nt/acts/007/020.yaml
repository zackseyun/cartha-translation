  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: ar
  text: وفي ذلك الوقت وُلِد موسى، وكان جميلًا في نظر الله[a]. وتربّى ثلاثة أشهر في بيت أبيه.
  philosophy: optimal-equivalence
  footnotes:
