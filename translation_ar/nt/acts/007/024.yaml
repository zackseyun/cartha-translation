  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: ar
  text: ولما رأى شخصًا يُظلَم، دافع عنه وأنصف المقهور، إذ ضرب المصري.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وانتقم للمقهور بضرب المصري». يمكن أن يدل التعبير اليوناني على الإنصاف أو الاقتصاص أو الانتقام، كما أن فعل «ضرب» لا يصرّح في ذاته بالموت، وإن كان السياق يدل عليه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: ولما رأى
  rationale: صيغت الحال الماضية في اليونانية جملةً زمنية طبيعية بالعربية، تمهيدًا للأفعال الرئيسة التالية.
- source_word: τινα
  choice: شخصًا
  rationale: تحافظ على التنكير من غير إضافة «رجل» التي لا يصرح بها اللفظ اليوناني.
- source_word: ἀδικούμενον
  choice: يُظلَم
  rationale: ينقل معنى وقوع الظلم والمعاملة الجائرة على الشخص بصياغة عربية موجزة وطبيعية.
- source_word: ἠμύνατο
  choice: دافع عنه
  rationale: يعبر عن التدخل لنصرة المعتدى عليه والدفاع عنه في مواجهة المعتدي.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: أنصف
  rationale: ينقل في السياق معنى إجراء الإنصاف للمقهور، مع إبقاء معنى الانتقام أو الأخذ بالثأر بديلًا معجميًا ممكنًا في الحاشية.
- source_word: τῷ καταπονουμένῳ
  choice: المقهور
  rationale: يصور من يقع عليه العناء والقهر المستمر، ويؤدي دلالة المصلحة في صيغة عربية طبيعية مع «أنصف».
- source_word: πατάξας
  choice: إذ ضرب
  rationale: يحافظ على المعنى المباشر للفعل، وهو الضرب، من غير أن يصرح بالموت الذي يُفهم من السياق الأوسع.
- source_word: τὸν Αἰγύπτιον
  choice: المصري
  rationale: ترجمة عربية طبيعية للاسم الدال على الانتماء القومي المستعمل استعمال الاسم.
theological_decisions:
- issue: دلالة ἐκδίκησιν في فعل موسى
  choice: أنصف المقهور
  alternative: انتقم للمقهور / أخذ بثأر المقهور
  rationale: يمكن أن يدل التعبير على الانتقام أو الاقتصاص أو الإنصاف. واختيار «أنصف» يحفظ كون الفعل لصالح المقهور من غير أن يحسم النص بوصفه ثأرًا شخصيًا أو يضيف حكمًا عقائديًا على فعل موسى.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «المقهور» لتجنب تكرار «يُظلَم/المظلوم»، ووُضعت الحاشية بعد الجملة لأنها تتناول دلالة عبارتين فيها.
