  text: Ἡ σκηνὴ τοῦ μαρτυρίου ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ, καθὼς διετάξατο ὁ λαλῶν τῷ Μωϋσῇ ποιῆσαι αὐτὴν κατὰ τὸν τύπον ὃν ἑωράκει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: ar
  text: وكانت خيمة الشهادة مع آبائنا في البرية، كما أمرَ المتكلمُ موسى أن يصنعها بحسب النموذج الذي كان قد رآه.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مسكن الشهادة».'
    reason: lexical_alternative
  - marker: b
    text: 'هوية «المتكلم» غير مصرَّح بها لفظًا في اليونانية؛ ويمكن، بحسب السياق، فهم العبارة: «الله الذي كلّم موسى» أو «الرب الذي كلّم موسى».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἡ σκηνὴ τοῦ μαρτυρίου
  choice: خيمة الشهادة
  rationale: ترجمة مباشرة وطبيعية تحفظ صورة الخيمة المتنقلة والعبارة الإضافية «الشهادة»، من غير اللجوء إلى مصطلح كنسي أقل وضوحًا للقارئ العام.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: مع آبائنا
  rationale: يحفظ الدلالة الصريحة للفظ اليوناني على الآباء السابقين في تاريخ إسرائيل، ويؤدي صيغة المجرور هنا بعلاقة المصاحبة على نحو عربي طبيعي.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: «البرية» هي المقابل العربي الكتابي الواضح للموضع القفر في سياق ارتحال إسرائيل.
- source_word: καθὼς διετάξατο
  choice: كما أمر
  rationale: ينقل المطابقة وقوة التوجيه السلطوي بإيجاز ووضوح.
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: المتكلم مع موسى
  rationale: يحفظ صيغة اسم الفاعل في اليونانية ويترك هوية المتكلم ضمنية كما في المصدر، بدل إضافة «الله» أو «الرب».
- source_word: ποιῆσαι αὐτὴν
  choice: أن يصنعها
  rationale: صياغة عربية مباشرة تؤدي فعل الإنشاء وضميره العائد إلى الخيمة.
- source_word: κατὰ τὸν τύπον
  choice: بحسب النموذج
  rationale: «النموذج» يعبّر بوضوح عن المثال الذي أُري لموسى لكي تُصنع الخيمة على وفقه.
- source_word: ὃν ἑωράκει
  choice: الذي كان قد رآه
  rationale: يحفظ سبق الرؤية على الأمر بالصنع، ويعود الموصول نحويًا إلى «النموذج».
theological_decisions:
- issue: هوية المتكلم مع موسى
  choice: إبقاء الهوية ضمنية بعبارة «المتكلم مع موسى»
  alternative: «الله الذي كلم موسى» أو «الرب الذي كلم موسى»
  rationale: النص اليوناني لا يسمّي المتكلم في هذه الآية، بل يستخدم اسم فاعل معرفًا؛ لذلك لا تُضاف هوية صريحة، مع أن السياق يدل عليها.
- issue: دلالة «الشهادة»
  choice: خيمة الشهادة
  alternative: خيمة الاجتماع أو المسكن
  rationale: يحافظ هذا الاختيار على μαρτυρίου ولا يستبدله بتعبير كتابي قريب لكنه مختلف لفظًا ودلالة.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية رصينة. استُخدمت «خيمة» للوضوح و«البرية» لاتساقها مع السياق الكتابي، مع إبقاء هوية المتكلم ضمنية. وُضعت علامتا الحاشيتين في المتن بعد الجملة.
