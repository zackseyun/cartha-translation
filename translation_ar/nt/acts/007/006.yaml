source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: ar
  text: 'لكن الله تكلّم هكذا: «إن نسله سيكون غريبًا مقيمًا في أرض غريبة[a]، وسيستعبدونه ويسيئون معاملته أربعمئة سنة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة عربية أكثر سلاسة: «إن ذريته سيكونون غرباء مقيمين في أرض غريبة، وسيستعبدونهم ويسيئون معاملتهم أربعمئة سنة». يستعمل اليوناني اسمًا جمعيًّا بصيغة المفرد: «نسله ... معاملته».'
    reason: بيان البديل الأسلوبي وشرح صيغة المفرد الجمعية في الأصل اليوناني.
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: لكن الله تكلّم هكذا
  rationale: تُبقي «لكن» قوة δέ الانتقالية الخفيفة، وتحافظ «هكذا» على οὕτως بوصفها تمهيدًا صريحًا لمضمون الكلام.
- source_word: ὅτι ἔσται
  choice: إن ... سيكون
  rationale: تُدخل «إن» مضمون القول، ويحافظ المستقبل العربي «سيكون» على كون الحدث منظورًا إليه بوصفه آتيًا وقت كلام الله، إذ لا يلزم في العربية تحويله إلى صيغة ماضٍ كما في بعض اللغات.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: نسله
  rationale: «النسل» اسم جمعي مفرد يدل هنا على ذرية إبراهيم، ويحفظ الصيغة الجمعية المفردة في اليونانية من غير اللجوء إلى «بذره» غير الطبيعية في هذا السياق.
- source_word: πάροικον
  choice: غريبًا مقيمًا
  rationale: يجمع التعبير بين الإقامة وبين كون الشخص غير من أهل البلاد، وهو لب معنى πάροικος، بلغة عربية واضحة.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: في أرض غريبة
  rationale: تنقل «غريبة» معنى الأرض التي ليست أرض النسل وليست موطنه، من غير أن تعيّن بلدًا لم يسمّه النص هنا.
- source_word: δουλώσουσιν αὐτὸ
  choice: سيستعبدونه
  rationale: «يستعبد» يعبّر مباشرة عن الإدخال في العبودية، والضمير المفرد يحيل إلى «نسله» ويحافظ على المطابقة مع الاسم الجمعي المفرد في اليونانية.
- source_word: κακώσουσιν
  choice: يسيئون معاملته
  rationale: تؤدي المعنى الواسع لإيقاع الأذى وسوء المعاملة من غير تضييقه على نوع واحد من الاضطهاد.
- source_word: ἔτη τετρακόσια
  choice: أربعمئة سنة
  rationale: صياغة عربية طبيعية لظرف المدة، مع الحفاظ على العدد الوارد في النص.
theological_decisions:
- issue: صيغة المفرد الجمعية في الإشارة إلى نسل إبراهيم
  choice: 'الإبقاء على المفرد الجمعي: «نسله ... غريبًا مقيمًا ... سيستعبدونه ... معاملته»'
  alternative: 'استعمال الجمع الطبيعي: «ذريته سيكونون غرباء مقيمين ... سيستعبدونهم ويسيئون معاملتهم»'
  rationale: النص اليوناني يستعمل σπέρμα وπάροικον وαὐτό بصيغة المفرد مع دلالة جمعية. إبقاء هذه البنية يحفظ صلة العبارة بلغة الوعد الإبراهيمي ولا يحسم توتر المفرد والجمع، فيما تُذكر الصياغة العربية الأسلس في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ورصينة. حُفظ التمهيد الرسمي للاقتباس وصيغة المفرد الجمعية، مع تجنب الألفاظ القديمة مثل «نزيل» و«سائح» التي قد توهم معنى آخر لدى القارئ المعاصر.
