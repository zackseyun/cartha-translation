  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: ar
  text: وَأَخْرَجُوهُ عَنْوَةً إِلَى خَارِجِ الْمَدِينَةِ، وَأَخَذُوا يَرْجُمُونَهُ. وَوَضَعَ الشُّهُودُ ثِيَابَهُمُ الْخَارِجِيَّةَ[a] عِنْدَ قَدَمَيْ شَابٍّ يُدْعَى شَاوُلَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثيابهم»، أو: «عباءاتهم»؛ فاللفظ اليوناني يشير بوجه عام إلى الملابس الخارجية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: أخرجوه عنوةً
  rationale: اسم الفاعل الماضي يدل على فعل سبق الرجم، والفعل المركب يفيد الإخراج القسري؛ وتؤدي «عنوةً» هذه القوة بوضوح من غير خشونة حرفية.
- source_word: ἔξω τῆς πόλεως
  choice: إلى خارج المدينة
  rationale: يحفظ معنى الحركة من داخل المدينة إلى خارجها، ويتلاءم طبيعيًا مع «أخرجوه».
- source_word: ἐλιθοβόλουν
  choice: أخذوا يرجمونه
  rationale: صيغة الماضي الناقص تصوّر فعلًا مستمرًا؛ وبناء «أخذوا + المضارع» ينقل بدء الحدث واستمراره في العربية بوضوح.
- source_word: οἱ μάρτυρες
  choice: الشهود
  rationale: المقصود شهود القضية في سياق تنفيذ الحكم، لا «الشهداء» بالمعنى الكنسي اللاحق.
- source_word: ἀπέθεντο
  choice: وضعوا
  rationale: يفيد هنا نزع الثياب وإيداعها، و«وضعوا» موجزة وطبيعية مع «عند قدمي».
- source_word: τὰ ἱμάτια αὐτῶν
  choice: ثيابهم الخارجية
  rationale: ἱμάτια لفظ عام للملابس، وغالبًا ما يشير إلى الثياب الخارجية؛ تحافظ الصياغة على الدقة دون تضييقه إلى نوع واحد كالعباءات.
- source_word: παρὰ τοὺς πόδας
  choice: عند قدمي
  rationale: تعبير عربي طبيعي لموضع إيداع الثياب قرب قدمي الشخص أو في عهدته.
- source_word: νεανίου
  choice: شابٍّ
  rationale: ينقل دلالة رجل في سن الشباب بإيجاز ووضوح.
- source_word: καλουμένου Σαύλου
  choice: يُدعى شاول
  rationale: مقابل عربي مباشر وطبيعي للاسم المفعول، ويحفظ تسمية الشخص دون زيادة تفسيرية.
theological_decisions:
- issue: دلالة μάρτυρες في سياق تنفيذ الحكم
  choice: الشهود بالمعنى القضائي
  alternative: الشهداء
  rationale: السياق يتحدث عن شهود شاركوا في إجراء الرجم ووضعوا ثيابهم، أما «الشهداء» فتستورد معنى كنسيًا لاحقًا لا يقتضيه النص هنا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. روعي سبق الإخراج للرجم واستمرار فعل الرجم، مع تجنب المصطلح الملتبس «الشهداء» والمحافظة على الدلالة القضائية لكلمة «الشهود».
