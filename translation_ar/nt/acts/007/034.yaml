  source_fidelity: 'المعنى العام أمين للنص اليوناني: التوكيد في ἰδὼν εἶδον، وسوء المعاملة/الكاكوسيس، والأنين، والنزول للتدخل والإنقاذ، ثم إرسال موسى إلى مصر، كلها منقولة. لكن تركيب «ما يعانيه شعبي الذين في مصر من سوء المعاملة» أثقل من الأصل ويجعل العبارة الموصولية غير طبيعية؛ والأدق والأوضح أن يتعلق الظرف مباشرة بـ«شعبي».'
