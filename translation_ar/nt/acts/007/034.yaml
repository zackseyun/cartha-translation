source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: ar
  text: «إني قد رأيتُ حقًّا سوء معاملة شعبي في مصر[a]، وسمعت أنينهم، ونزلت لأنقذهم. والآن تعالَ، فسأرسلك إلى مصر».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اضطهاد» أو «مذلّة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: إني قد رأيت
  rationale: تركيب توكيدي ذو طابع سامي يقتبس صدى خروج 3:7؛ نقلت «إنّ» و«قد» قوة التوكيد بصياغة عربية طبيعية من غير محاكاة حرفية ثقيلة مثل «رؤية رأيت».
- source_word: κάκωσιν
  choice: ما يعانيه ... من سوء المعاملة
  rationale: يدل الاسم على المعاملة القاسية أو الإيذاء والاضطهاد. هذه الصياغة واضحة ومعاصرة وتحفظ معنى وقوع الأذى على الشعب دون حصره في صورة سياسية بعينها.
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: شعبي الذين في مصر
  rationale: تحفظ إضافة الشعب إلى المتكلم ودلالتها العهدية المحتملة، وتبيّن أن العبارة الموصولة تحدد موقع الشعب.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: أنينهم
  rationale: الضمير اليوناني مفرد عائد إلى «الشعب» بوصفه جمعًا؛ العربية الطبيعية تستعمل ضمير الجمع مراعاة لأفراده، و«أنين» يقابل στεναγμός ويحفظ صدى قصة الخروج.
- source_word: κατέβην
  choice: نزلت
  rationale: يحفظ التعبير التشبيهي عن نزول الله للتدخل ولا يفسره أو يلطّفه لاهوتيًا.
- source_word: ἐξελέσθαι
  choice: لأنقذهم
  rationale: الفعل المتوسط هنا يفيد التخليص أو الإنقاذ من الشدة؛ «أنقذ» واضح في العربية الحديثة ويعبّر عن التدخل الفعّال.
- source_word: δεῦρο
  choice: تعال
  rationale: أداة ذات قوة أمر تدعو موسى إلى الإقبال؛ «تعال» موجزة وطبيعية.
- source_word: ἀποστείλω
  choice: فسأرسلك
  rationale: تنقل صيغة المستقبل المباشرة ووظيفة التكليف، وتربطها بالسياق ربطًا عربيًا طبيعيًا.
- source_word: εἰς Αἴγυπτον
  choice: إلى مصر
  rationale: المقابل العربي المعتاد للدلالة على جهة الإرسال.
theological_decisions:
- issue: التعبير التشبيهي عن نزول الله
  choice: نزلت
  alternative: أتيت لأخلّصهم
  rationale: أُبقيت صورة النزول كما وردت في خطاب الله ضمن اقتباس قصة الخروج، بدل تفسيرها أو إزالة توترها اللاهوتي.
- issue: دلالة ἐξελέσθαι على الإنقاذ أو التخليص
  choice: لأنقذهم
  alternative: لأخلّصهم
  rationale: كلاهما ممكن، لكن «لأنقذهم» أوضح للقارئ المعاصر وأقل قابلية لأن يُفهم بوصفه مصطلحًا عقائديًا متخصصًا، مع حفظ معنى التحرير من الشدة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على إيقاع الخطاب الإلهي وصورته التشبيهية. وُضع مؤشر الحاشية [a] بعد العبارة التي يشرحها. لم تُدرج حاشية [b] الواردة في طبقة الاستشارة الإنجليزية لأنها لا تتوافق مع موضعها ولا مع مضمونها؛ إذ تزعم بديلًا يخص «الإنقاذ» بينما وُضعت بعد «تعال».
