source:
  edition: SBLGNT
  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: ar
  text: لكن لما تُرك في العراء[a]، أخذته[b] ابنة فرعون وربّته ليكون لها ابنًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لما وُضع خارجًا» أو «لما طُرح». يشير التعبير اليوناني هنا إلى إخراج رضيع وتركه مكشوفًا.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «التقطته». قد يدل الفعل اليوناني على أخذ طفل تُرك في العراء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: تُرك في العراء
  rationale: يفيد الفعل في هذا السياق إخراج الرضيع وتركه مكشوفًا. وهذه الصياغة تحفظ المعنى التاريخي من غير أن تفترض صراحةً قصد التخلّي النهائي عنه.
- source_word: δὲ
  choice: لكن
  rationale: تفيد أداة الربط انتقالًا قصصيًا مع مقابلة ما بين ترك موسى وتدخّل ابنة فرعون لإنقاذه.
- source_word: ἀνείλατο
  choice: أخذته
  rationale: يدل الفعل هنا على أخذ طفل متروك والعناية به. وتجنّبت صياغة «تبنّته» لأن منزلة الابن يعبّر عنها آخر الجملة على نحو مستقل.
- source_word: ἡ θυγάτηρ Φαραὼ
  choice: ابنة فرعون
  rationale: تعبير عربي طبيعي يحفظ علاقة الإضافة في الأصل.
- source_word: ἀνεθρέψατο
  choice: ربّته
  rationale: ينقل معنى تنشئة الطفل وتربيته حتى يكبر، وهو تعبير عربي واضح وموجز.
- source_word: ἑαυτῇ εἰς υἱόν
  choice: ليكون لها ابنًا
  rationale: تنقل الصياغة الغاية أو النتيجة والعلاقة بها شخصيًا، مع إبقاء معنى اتخاذه في منزلة الابن من غير إدخال تفاصيل قانونية غير مصرّح بها.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُخدمت «ليكون لها ابنًا» بدل العبارة الحرفية الأثقل «ربّته لنفسها ابنًا»، مع الحفاظ على دلالة الأصل. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما، إذ يبدو أن موضعيهما في طبقة الاستشارة الإنجليزية قد انعكسا.
