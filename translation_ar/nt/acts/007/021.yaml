  source_fidelity: 'النص يعبّر بأمانة عن تسلسل اليونانية: تعرّض الطفل للترك في الخارج، ثم أخذته ابنة فرعون وربّته في منزلة ابن لها. وعبارة «تُرك في العراء» مناسبة لـἐκτεθέντος ولا تضيف حكمًا على نية التخلّي، و«أخذته» تحفظ الفعل ἀνείλατο دون استباق معنى التبنّي القانوني.'
