  source_fidelity: 'النص العربي «لكن سليمان بنى له بيتًا» ينقل عناصر اليونانية كلها بأمانة: «سليمان» لـΣολομῶν، و«لكن» للمقابلة السياقية الخفيفة التي تؤديها δέ، و«بنى» لـοἰκοδόμησεν، و«له» للضمير العائد إلى الله، و«بيتًا» لـοἶκον. ولا يفرض لفظ «هيكل» تفسيرًا في المتن.'
