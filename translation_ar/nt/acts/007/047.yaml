  text: Σολομῶν δὲ οἰκοδόμησεν αὐτῷ οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/047.yaml
  text: But Solomon built a house for him[a].
translation:
  language: ar
  text: لكن سليمان بنى له بيتًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «هيكلًا»؛ واللفظ اليوناني يعني حرفيًا «بيتًا».
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: سليمان
  rationale: الصيغة العربية الكتابية المألوفة للاسم.
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا يتضمن مقابلة خفيفة؛ و«لكن» تحفظ الصلة بما يلي من نفي سكنى العلي في ما صنعته الأيدي.
- source_word: οἰκοδόμησεν
  choice: بنى
  rationale: الفعل هنا يدل مباشرة على تشييد مبنى، و«بنى» هي العبارة العربية الطبيعية والدقيقة.
- source_word: αὐτῷ
  choice: له
  rationale: الضمير يعود إلى الله في السياق، واللام تعبّر طبيعيًا عن أن البيت بُني له.
- source_word: οἶκον
  choice: بيتًا
  rationale: يحفظ المعنى المباشر للكلمة اليونانية وصدى التعبير الكتابي عن بيت الله، من غير استبداله بالتفسير السياقي «هيكلًا».
theological_decisions:
- issue: هل تُترجم οἶκον «بيتًا» أم تُفسَّر «هيكلًا»؟
  choice: بيتًا
  alternative: هيكلًا
  rationale: النص يستعمل اللفظ العام «بيت» لا لفظًا خاصًا بالهيكل. إبقاء «بيتًا» يحفظ صياغة استفانوس والتوتر المقصود قبل القول إن العلي لا يسكن في ما صنعته الأيدي، بينما يوضح الهامش أن المقصود سياقيًا هو الهيكل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على ترتيب الجملة وبساطتها وعلى المقابلة التي تؤديها «لكن».
