  rationale: التعديل مقتصر على ترجمة الفعل الذي يصف علاقة الله بالوعد، لتتضمن معنى الالتزام لا مجرد الإفصاح أو الإعلان. وحُفظت دلالة الماضي الناقص في «كان ... يقترب»، والتمييز بين «نما» و«تكاثر»، وعلامة الحاشية في موضعها.
