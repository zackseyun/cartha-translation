source:
  edition: SBLGNT
  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: ar
  text: ولكن إذ كان زمن الوعد الذي تعهّد به الله لإبراهيم يقترب، نما الشعب وتكاثر في مصر.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: ولكن إذ
  rationale: تؤدي «إذ» معنى الجملة الزمنية، وتنقل «لكن» الانتقال الخفيف الذي تفيده δέ من غير مبالغة في معنى التضاد.
- source_word: ἤγγιζεν
  choice: كان ... يقترب
  rationale: هذه الصياغة تنقل دلالة الماضي الناقص على اقتراب كان جاريًا ومتدرجًا.
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: زمن الوعد
  rationale: ترجمة مباشرة تحفظ التعبير اليوناني من غير إضافة معنى «الموعد المحدد» غير المصرح به.
- source_word: ὡμολόγησεν
  choice: أعلنه
  rationale: يفيد الفعل هنا التزامًا صرّح به الله في سياق الوعد؛ و«أعلنه» طبيعية مع «الوعد» ولا تضيف معنى القسم الذي لا يصرح به الفعل.
- source_word: τῷ Ἀβραάμ
  choice: لإبراهيم
  rationale: تنقل اللام دلالة المفعول غير المباشر، أي الشخص الذي وُجّه إليه الوعد.
- source_word: ηὔξησεν ὁ λαὸς
  choice: نما الشعب
  rationale: تحفظ «نما» صورة ازدياد الشعب بوصفه جماعة، مع تمييزها من الفعل التالي.
- source_word: καὶ ἐπληθύνθη
  choice: وتكاثر
  rationale: تنقل معنى ازدياد العدد وتحافظ على التوازي والتمييز المعجمي عن «نما».
- source_word: ἐν Αἰγύπτῳ
  choice: في مصر
  rationale: ترجمة مكانية مباشرة وواضحة.
theological_decisions:
- issue: دلالة ὡμολόγησεν في وصف وعد الله لإبراهيم
  choice: الوعد الذي أعلنه الله لإبراهيم
  alternative: الوعد الذي وعد الله به إبراهيم؛ أو الوعد الذي تعهّد به الله لإبراهيم؛ أو الوعد الذي قطعه الله لإبراهيم
  rationale: «أعلنه» تحفظ معنى الالتزام المصرح به في هذا السياق، من غير جعل العبارة تكرارًا عربيًا ثقيلًا، ومن غير إدخال دلالة القسم الأقوى التي لا يقتضيها الفعل بذاته.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ البناء الزمني والتدرج في الاقتراب، واستُخدم «نما... وتكاثر» لنقل الفعلين اليونانيين المترادفين من غير دمجهما.
