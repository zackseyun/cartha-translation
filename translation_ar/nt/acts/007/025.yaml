id: ACT.7.25
reference: Acts 7:25
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: ar
  text: وكان يظن أن إخوته[b] يفهمون أن الله يمنحهم النجاة على يده[a]، لكنهم لم يفهموا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الخلاص». يمكن للكلمة اليونانية أن تدل على النجاة أو الإنقاذ أو الخلاص؛ والسياق المباشر يشير إلى نجاة إسرائيل التي يمنحها الله على يد موسى.
    reason: lexical_alternative
  - marker: b
    text: المقصود بـ«إخوته» بنو إسرائيل إخوة موسى في الانتماء إلى شعبه؛ واللفظ في اليونانية اسم قرابة مذكر جمع.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: كان يظن
  rationale: ينقل زمن الماضي الناقص بوصفه ظنًّا قائمًا في خلفية الحدث، وهو تعبير عربي طبيعي.
- source_word: συνιέναι / συνῆκαν
  choice: يفهمون / لم يفهموا
  rationale: يحافظ تكرار الجذر العربي على المقابلة اللفظية الواضحة في اليونانية.
- source_word: ἀδελφοὺς
  choice: إخوته
  rationale: يحفظ لفظ القرابة المذكر الجمع، والمقصود إخوة موسى من بني إسرائيل.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: على يده
  rationale: تعبير عربي مألوف يحفظ صورة اليد ويدل على الوساطة أو الأداة.
- source_word: δίδωσιν
  choice: يمنحهم
  rationale: يفيد إعطاء الله النجاة لهم، ويأتي طبيعيًا مع الاسم في العربية ضمن الخطاب غير المباشر.
- source_word: σωτηρίαν
  choice: النجاة
  rationale: يلائم الإنقاذ التاريخي من الظلم في السياق، مع إبقاء إمكان معنى الخلاص الأوسع.
theological_decisions:
- issue: دلالة σωτηρία في سياق موسى
  choice: النجاة
  alternative: الخلاص
  rationale: السياق المباشر يتحدث عن إنقاذ إسرائيل بواسطة موسى؛ و«النجاة» يبرز هذا المعنى من غير أن ينفي البعد الخلاصي الأوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «على يده» لحفظ الصورة اليونانية بصياغة عربية مألوفة، ووُضعت علامتا الحاشيتين مباشرة بعد اللفظين المعنيين.
