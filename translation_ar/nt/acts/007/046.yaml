  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: ar
  text: وقد حظي برضا الله، وطلب أن يجد مسكنًا لإله يعقوب[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خيمةً لإله يعقوب».'
    reason: بديل معجمي محتمل للفظ σκήνωμα.
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: حظي برضا
  rationale: هذا تعبير اصطلاحي يدل على نيل القبول والحظوة، لا على العثور على «النعمة» بوصفها شيئًا مجردًا. والصياغة العربية واضحة وطبيعية.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: الله
  rationale: أُدمج معنى «أمام الله/لدى الله» طبيعيًا في عبارة «حظي برضا الله»، تجنبًا للتركيب العربي الثقيل «حظي برضا أمام الله» مع الحفاظ على كون الله مصدر الرضا والحاكم به.
- source_word: ᾐτήσατο
  choice: طلب
  rationale: ينقل معنى تقديم الطلب بوضوح ومن دون زيادة في الرسمية.
- source_word: εὑρεῖν
  choice: أن يجد
  rationale: يحافظ على الدلالة المباشرة للفعل اليوناني، مع إبقاء احتمال معنى التهيئة أو الحصول مفهومًا من السياق دون فرضه في المتن.
- source_word: σκήνωμα
  choice: مسكنًا
  rationale: لفظ عام وطبيعي يدل على موضع السكن، ولا يحسم مبكرًا هل المقصود خيمة أم بناء آخر.
- source_word: τῷ θεῷ Ἰακώβ
  choice: لإله يعقوب
  rationale: اللام تنقل وظيفة صيغة المجرور الدالة على أن المسكن مخصص لله، وتحافظ عبارة «إله يعقوب» على الصياغة الكتابية العهدية.
theological_decisions:
- issue: ماهية الموضع الذي طلبه داود لله في عرض استفانوس لتاريخ إسرائيل
  choice: مسكنًا لإله يعقوب
  alternative: خيمةً لإله يعقوب
  rationale: لفظ σκήνωμα أوسع من المصطلح التقني للهيكل، والآية التالية تنسب بناء البيت إلى سليمان. لذلك تُبقي «مسكنًا» التوتر السردي قائمًا ولا تعيّن نوع البناء قبل أوانه.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «وقد» لوصل الجملة بسياقها السابق، وصيغت العبارة الاصطلاحية اليونانية صياغة عربية طبيعية من غير التضحية بمعناها العلاقي.
