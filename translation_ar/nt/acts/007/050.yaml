  text: οὐχὶ ἡ χείρ μου ἐποίησεν ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/050.yaml
  text: Did not my hand make all these things?[a][b]
translation:
  language: ar
  text: أَلَمْ تَصْنَعْ يَدِي هٰذِهِ كُلَّهَا؟[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أكثر ديناميكية: «أَلَمْ أَصْنَعْ هٰذِهِ كُلَّهَا؟»'
    reason: lexical_alternative
  - marker: b
    text: يردّد هذا القول صدى إشعياء 66:2.
    reason: cross_reference
lexical_decisions:
- source_word: οὐχὶ
  choice: أَلَمْ
  rationale: تُدخل οὐχί سؤالًا إنكاريًّا يُنتظر جوابه بالإيجاب، ويؤدي «أَلَمْ» هذه القوة البلاغية في العربية الفصحى الواضحة.
- source_word: ἡ χείρ μου
  choice: يَدِي
  rationale: اللفظ يعني حرفيًّا «يدي». والإبقاء على الصورة الحسية يصون التعبير التشبيهي عن فاعلية الله، كما ورد في صدى إشعياء 66:2، بدل تحويله إلى عبارة تفسيرية مثل «قدرتي».
- source_word: ἐποίησεν
  choice: تَصْنَعْ
  rationale: يدل ποιέω هنا على الصنع أو الإيجاد. واختيار «تصنع» ملائم لتركيب السؤال بـ«ألم»، ويحافظ على المعنى الواسع من غير إضافة تفسيرية.
- source_word: ταῦτα πάντα
  choice: هٰذِهِ كُلَّهَا
  rationale: يحفظ هذا التركيب قوة اسم الإشارة وشمول πάντα، مع عود الضمير المؤنث المفرد في «كلها» على جمع غير العاقل بحسب الاستعمال العربي الطبيعي.
theological_decisions:
- issue: التعبير التشبيهي عن الله
  choice: الإبقاء على «يدي» بوصفها تعبيرًا عن فاعلية الله في الخلق
  alternative: 'صياغتها ديناميكيًّا: «أَلَمْ أَصْنَعْ هٰذِهِ كُلَّهَا؟»'
  rationale: يحافظ ذكر اليد على صورة النص المقتبس من إشعياء 66:2 وعلى قوته البلاغية، من غير تجريدها إلى «قدرتي» أو تحميلها تحديدًا لاهوتيًّا زائدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ السؤال الإنكاري والصورة الحسية «يدي»، واستُعمل «هذه كلها» استعمالًا عربيًّا طبيعيًّا لجمع غير العاقل.
