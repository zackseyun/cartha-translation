  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: ar
  text: التي أدخلها آباؤنا، بعد أن تسلّموها بالتعاقب، مع يشوع[a]، حين استولوا على أرض الأمم التي طردها الله من أمام آبائنا، وبقيت إلى أيام داود.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الاسم اليوناني نفسه يمكن أن يُنقل «يسوع» أو «يشوع»؛ والمقصود هنا يشوع بن نون.
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «إلى أيام داود». وفعل «بقيت» مفهوم من سياق الكلام عن الخيمة.'
    reason: supplied_words
lexical_decisions:
- source_word: ἣν
  choice: وهو الذي
  rationale: ضمير موصول مؤنث مفرد يعود إلى خيمة الشهادة في الآية السابقة؛ روعي التذكير اللفظي لأن «المسكن» مفهوم من السياق العربي الممكن، مع بقاء الصلة واضحة.
- source_word: εἰσήγαγον
  choice: أدخله
  rationale: ينقل معنى الإتيان بالشيء إلى الداخل، والمقصود خيمة الشهادة التي حملها الآباء إلى الأرض.
- source_word: διαδεξάμενοι
  choice: بدورهم
  rationale: يعبّر بإيجاز طبيعي عن التعاقب وتسلّم الآباء الخيمة ممن سبقوهم، دون إثقال الجملة.
- source_word: οἱ πατέρες ἡμῶν
  choice: آباؤنا
  rationale: يحافظ على لغة الخطاب العهدي والتاريخي المتكررة عند استفانوس.
- source_word: μετὰ Ἰησοῦ
  choice: مع يشوع
  rationale: الاسم اليوناني Ἰησοῦς قد يدل على يسوع أو يشوع؛ والسياق التاريخي لدخول الأرض يعيّن يشوع بن نون.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: حين امتلكوا أرض الأمم
  rationale: κατάσχεσις تفيد الاستيلاء أو حيازة الأرض. وإضافة «أرض» توضّح في العربية أن محل الامتلاك هو أرض الأمم، لا امتلاك الأشخاص أنفسهم.
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: التي طردها الله
  rationale: ينقل فعل الإخراج بالقوة بعبارة عربية واضحة، والضمير يعود إلى الأمم.
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: من أمام آبائنا
  rationale: يحافظ على التعبير الكتابي ذي الخلفية السامية مع وضوح معناه، أي إزالتهم من حضور الآباء وطريقهم.
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: وظل هناك إلى أيام داود
  rationale: «إلى أيام داود» ترجمة مباشرة، وأُظهر تعلق الحد الزمني ببقاء الخيمة اعتمادًا على السياق واستمرار الجملة إلى الآية التالية.
theological_decisions:
- issue: مرجع Ἰησοῦ
  choice: يشوع
  alternative: يسوع
  rationale: صيغة الاسم واحدة في اليونانية، لكن الحديث عن دخول إسرائيل الأرض بعد موسى يجعل المقصود يشوع بن نون، فلا تُفرض على النص قراءة مسيانية غير مقصودة.
- issue: دلالة διαδεξάμενοι
  choice: الآباء أدخلوا الخيمة بدورهم بوصفهم متسلّمين لها بالتعاقب
  alternative: بعد أن تسلّمها آباؤنا أدخلوها
  rationale: الصيغة الحالية تحافظ على معنى التعاقب بإيجاز، وتثبت الحاشية إمكان إبراز فعل التسلّم صراحة.
- issue: تعلّق ἕως τῶν ἡμερῶν Δαυίδ
  choice: استمرار وجود الخيمة إلى أيام داود
  alternative: ارتباط العبارة بسلسلة الأحداث السابقة دون إظهار فعل البقاء
  rationale: التركيب اليوناني موجز، والسياق الممتد إلى الآية التالية يرجّح أن الحد الزمني يصف بقاء الخيمة؛ أُظهر ذلك بالعربية لتحقيق الترابط، مع التنبيه إلى الإضمار.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «آباؤنا» للمحافظة على النبرة التاريخية العهدية، و«أرض الأمم» لمنع توهّم أن الآباء امتلكوا الأمم أنفسهم. وُضعت علامتا الحاشية في المتن عند موضعيهما.
