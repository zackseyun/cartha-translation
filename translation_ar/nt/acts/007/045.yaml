  rationale: صُحح المرجع المؤنث لخيمة الشهادة في «التي أدخلها»، وأُبرزت دلالة διαδεξάμενοι بعبارة «بعد أن تسلّموها بالتعاقب». وحُذف ظرف المكان المضاف «هناك». وأُبقي فعل «بقيت» بوصفه إظهارًا عربيًا طبيعيًا للامتداد الزمني الذي يفهمه السياق، مع بيان ذلك في الحاشية.
