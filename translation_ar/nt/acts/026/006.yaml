  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: ar
  text: والآن أقف للمحاكمة بسبب الرجاء في الوعد الذي أعطاه الله لآبائنا،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «أسلافنا». واليونانية حرفيًا: «آبائنا»، والمقصود آباء إسرائيل الأوّلون.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: والآن
  rationale: تنقل العبارة الانتقالية بوضوح وتحافظ على صلتها بسياق دفاع بولس السابق.
- source_word: ἐπ’ ἐλπίδι
  choice: بسبب رجاء
  rationale: تفيد ἐπί مع المجرور هنا الأساس أو العلة، و«بسبب» توضح أن هذا الرجاء هو سبب محاكمة بولس.
- source_word: ἐπαγγελίας
  choice: الوعد
  rationale: المضاف إليه متعلق بـ«رجاء»، فيدل على الرجاء المرتبط بوعد الله، و«الوعد» هو المقابل العربي الواضح والمألوف.
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: الوعد ... لآبائنا
  rationale: تحافظ اللام على جهة الوعد ومتلقّيه، كما تفيد العبارة اليونانية εἰς τοὺς πατέρας ἡμῶν.
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: الذي قطعه الله
  rationale: تعبير عربي طبيعي عن إنشاء الوعد، مع إبقاء الله فاعلًا صريحًا؛ ولا يعني «قطع» هنا الإبطال بل التعهّد.
- source_word: πατέρας ἡμῶν
  choice: آبائنا
  rationale: ينقل اللفظ اليوناني المذكر بصيغته المباشرة ويحفظ الإيحاء بآباء إسرائيل في تاريخ العهد.
- source_word: ἕστηκα
  choice: أقف
  rationale: للفعل التام هنا قوة حالية ثابتة، أي إن بولس قائم الآن في موقف المحاكمة.
- source_word: κρινόμενος
  choice: للمحاكمة
  rationale: ينقل المعنى القضائي للمشاركة الحالية بصياغة عربية طبيعية وموجزة.
theological_decisions:
- issue: هوية «آبائنا»
  choice: آباء إسرائيل وأسلافهم المرتبطون بتاريخ العهد
  alternative: أسلاف الشعب اليهودي بوجه عام
  rationale: في خطاب بولس أمام أغريباس تستحضر العبارة تاريخ إسرائيل والوعد الإلهي، لكن المتن يبقي لفظ «آبائنا» من غير توسيع تفسيري يحسم مدى الإشارة.
- issue: علاقة الرجاء بالوعد
  choice: «رجاء الوعد» مع إبقاء تركيب الإضافة
  alternative: «الرجاء في الوعد»
  rationale: الإضافة أقرب إلى تركيب اليونانية وتحفظ احتمال فهمه رجاءً ناشئًا من الوعد أو متعلقًا بمضمونه، بدل حصره في صيغة تفسيرية واحدة.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة قضائية رصينة. استُخدم «قطع الوعد» بوصفه تعبيرًا عربيًا طبيعيًا عن التعهّد، مع الحفاظ على تركيب «رجاء الوعد» صونًا لقرب النص وغموض العلاقة الدلالية المشروع.
