  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: ar
  text: أما أنا فكنت أظن أنه ينبغي لي أن أفعل أمورًا كثيرة ضد اسم يسوع الناصري[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: يسوع الذي من الناصرة.'
    reason: بديل لغوي يوضح أن لقب «الناصري» يدل على انتساب يسوع إلى الناصرة.
lexical_decisions:
- source_word: Ἐγὼ μὲν οὖν
  choice: أما أنا فـ
  rationale: يُبرز الضمير الصريح ذات المتكلم، وتنقل «أما... فـ» معنى الانتقال مع التوكيد الخفيف في μὲν οὖν بصياغة عربية طبيعية.
- source_word: ἔδοξα ἐμαυτῷ
  choice: كنت أظن
  rationale: ينقل الحكم الداخلي الذي كان بولس يتبناه في السابق، ويجعل زمن منظوره السابق واضحًا في العربية من غير إثقال العبارة بتكرار «في نفسي».
- source_word: δεῖν
  choice: ينبغي لي
  rationale: يعبّر عن شعور بولس السابق بالواجب أو اللزوم، من غير أن يوحي بضرورة خارجية مطلقة.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: أن أفعل أمورًا كثيرة ضد
  rationale: يحفظ تعدد الأفعال وقوتها المناوئة بصياغة واضحة وطبيعية، من غير تحديد أفعال لم يذكرها النص.
- source_word: πρὸς τὸ ὄνομα
  choice: ضد اسم
  rationale: تحمل πρός هنا معنى المواجهة بسبب اقترانها بـἐναντία، مع إبقاء التعبير الكتابي «الاسم» بدل تضييقه إلى السلطة أو القضية.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: يسوع الناصري
  rationale: ينقل اللقب المرتبط بالناصرة ويحافظ على صيغته الموجزة الشبيهة باللقب في اليونانية.
theological_decisions:
- issue: دلالة «الاسم» في علاقته بيسوع
  choice: الإبقاء على التعبير «اسم يسوع»
  alternative: سلطان يسوع أو قضية يسوع
  rationale: يشير «الاسم» كتابيًا إلى الشخص وما يمثله من سمعة وسلطان واعتراف علني، ولا يقتضي السياق حصره في جانب لاهوتي واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «أما أنا فـ» لإبراز الاعتراف الشخصي، وأُبقيت عبارة «اسم يسوع» بما فيها من اتساع كتابي مقصود.
