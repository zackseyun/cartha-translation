  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: ar
  text: يعرفونني منذ البداية[a]، إن شاؤوا أن يشهدوا، أنني عشت فريسيًا بحسب الطائفة الأشد صرامةً في ديانتنا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «منذ أول الأمر»، وربما: «منذ زمن طويل».'
    reason: lexical_alternative
  - marker: b
    text: الكلمة اليونانية αἵρεσις تعني هنا «طائفة» أو «مذهبًا»، لا «هرطقة» بالمعنى الاصطلاحي المتأخر.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές
  choice: وقد عرفوني
  rationale: يفيد السياق معرفة سابقة مستمرة ناتجة من معايشتهم لبولس، لا مجرد معرفة مسبقة بنبوية أو توقع.
- source_word: ἄνωθεν
  choice: منذ البداية
  rationale: المعنى السياقي هو منذ أول الأمر أو منذ زمن مبكر، لا «من فوق».
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: إن كانوا راغبين في أن يشهدوا
  rationale: يحفظ معنى الإرادة في θέλωσι والطابع القضائي للشهادة في μαρτυρεῖν.
- source_word: κατὰ
  choice: وفق
  rationale: تدل هنا على النهج أو المعيار الذي عاش بولس بمقتضاه.
- source_word: ἀκριβεστάτην
  choice: أشد ... صرامةً
  rationale: صيغة تفضيل عليا تصف شدة التزام هذه الطائفة ودقته، وصياغة «أشد ... صرامةً» طبيعية في العربية.
- source_word: αἵρεσιν
  choice: طوائف
  rationale: تشير هنا إلى جماعة دينية معروفة داخل اليهودية؛ واختيار «طائفة» يتجنب المعنى الاصطلاحي المتأخر لكلمة «هرطقة».
- source_word: τῆς ἡμετέρας θρησκείας
  choice: ديانتنا
  rationale: يشير التعبير إلى الديانة المشتركة التي ينتسب إليها بولس ومستمعوه اليهود.
- source_word: ἔζησα Φαρισαῖος
  choice: عشت فريسيًّا
  rationale: ينقل بإيجاز هوية بولس وطريقة عيشه السابقة بوصفه فريسيًا.
theological_decisions:
- issue: دلالة αἵρεσις في السياق اليهودي التاريخي
  choice: طائفة
  alternative: هرطقة؛ مذهب؛ حزب
  rationale: المقصود جماعة الفريسيين المعروفة داخل اليهودية، لا انحراف عقائدي بالمعنى الكنسي الاصطلاحي اللاحق. أما «حزب» فقد يوحي بتنظيم سياسي حديث، و«مذهب» ممكن لكنه أقل إبرازًا للجماعة نفسها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة قضائية لائقة بالسياق. استُعملت «فريسيًّا» بوصفها خبرًا حاليًا طبيعيًا، وحُفظ تعلق «أشد ... صرامةً» بالطائفة دون إدخال حكم لاهوتي زائد.
