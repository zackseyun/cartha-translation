  to: يعرفونني منذ البداية[a]، إن شاؤوا أن يشهدوا، أنني عشت فريسيًا بحسب الطائفة الأشد صرامةً في ديانتنا[b].
  rationale: استُبدل الماضي بـ«يعرفونني» للمحافظة على دلالة المعرفة السابقة المستمرة، واستُعمل المفرد «الطائفة» لمطابقة αἵρεσιν. كما صيغت العبارة التفضيلية بتركيب عربي واضح يحفظ أن الفريسيين هم الطائفة الأشد صرامةً داخل الديانة المشتركة. و«إن شاؤوا أن يشهدوا» تنقل إرادة θέλωσι والطابع القضائي لـ μαρτυρεῖν بإيجاز طبيعي.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:22:38Z'
