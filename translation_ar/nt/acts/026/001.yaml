base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: ar
  text: 'فقال أغريباس لبولس: «مأذون لك أن تتكلم دفاعًا عن نفسك».[a] عندئذ مدّ بولس يده وأخذ يدافع عن نفسه:[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تتكلم عن نفسك».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وقدّم دفاعه». يمكن أن يدل الفعل اليوناني على تقديم دفاع قانوني.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: أغريباس
  rationale: نقل صوتي للاسم اليوناني بصيغة عربية واضحة وشائعة.
- source_word: δὲ
  choice: فـ
  rationale: تفيد انتقال السرد وربط قول أغريباس بما سبقه بأسلوب عربي طبيعي.
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: قال ... لبولس
  rationale: تعبير عربي مألوف يؤدي معنى توجيه الكلام إلى بولس.
- source_word: Ἐπιτρέπεταί σοι
  choice: مأذون لك
  rationale: يحفظ صيغة الإذن المبنية للمجهول والنبرة الرسمية للمشهد القضائي.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: أن تتكلم دفاعًا عن نفسك
  rationale: ينقل دلالة ὑπέρ في السياق القضائي بوضوح، مع إثبات البديل الأقل تخصيصًا في الحاشية.
- source_word: τότε
  choice: عندئذ
  rationale: يحفظ التعاقب الزمني الصريح في النص اليوناني.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: مدّ ... يده
  rationale: ترجمة مباشرة وطبيعية للحركة الجسدية من غير تفسير زائد لطبيعة الإيماءة.
- source_word: ἀπελογεῖτο
  choice: أخذ يدافع عن نفسه
  rationale: يؤدي الفعل الناقص في سياقه السردي بوصفه شروعًا في خطاب دفاع مستمر، مع إبقاء الصياغة القضائية البديلة في الحاشية.
