id: ACT.26.20
reference: Acts 26:20
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: ar
  text: بل أعلنتُ أولًا للذين في دمشق، ثم أيضًا في أورشليم، وفي منطقة اليهودية كلها، وللأمم[a]، أن يتوبوا ويرجعوا إلى الله، عاملين أعمالًا تليق بالتوبة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي الشعوب غير اليهودية؛ ويمكن ترجمتها أيضًا: «للشعوب».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أعمالًا جديرة بالتوبة» أو «أفعالًا تناسب التوبة». والمقصود أعمال توافق التوبة وتصحبها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد المقابلة مع نفي العصيان في السياق السابق، وهي طبيعية في العربية هنا.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: للذين في دمشق
  rationale: يحفظ دلالة الجمع في صيغة المجرور اليونانية، أي الأشخاص الموجودين في دمشق، لا المدينة مجردة.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: أولًا ... ثم أيضًا في أورشليم
  rationale: ينقل ترتيب البشارة وإضافتها إلى أورشليم بصياغة عربية واضحة؛ ولفظة «ثم» توضح التسلسل الذي يفيده السياق دون تغيير مضمونه.
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: في منطقة اليهودية كلها
  rationale: «منطقة» تؤدي المعنى الجغرافي الواسع لكلمة χώρα من غير قصره على الريف.
- source_word: τοῖς ἔθνεσιν
  choice: للأمم
  rationale: في هذا السياق يقابل اللفظ أورشليم واليهودية، فيشير إلى الشعوب غير اليهودية؛ و«الأمم» يحفظ المصطلح الكتابي مع توضيحه في الحاشية.
- source_word: ἀπήγγελλον
  choice: أعلنتُ
  rationale: يعبر عن الإبلاغ العلني بالرسالة، وهو واضح وفصيح من غير تكلف.
- source_word: μετανοεῖν
  choice: أن يتوبوا
  rationale: يدل السياق على التوبة أمام الله، لا على مجرد تغيير رأي ذهني؛ و«يتوبوا» هو المقابل العربي الطبيعي والدقيق.
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: ويرجعوا إلى الله
  rationale: ينقل معنى التحول والتوجه إلى الله. «يرجعوا» تعبير عربي مألوف عن الرجوع الروحي، ولا يلزم منه هنا أن جميع المخاطبين كانوا سابقًا ضمن جماعة العهد.
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: أعمالًا تليق بالتوبة
  rationale: «تليق» تنقل معنى ἄξια بوصف الأعمال موافقة للتوبة ومناسبة لها، من غير تقرير أنها أساس استحقاق القبول.
- source_word: πράσσοντας
  choice: عاملين
  rationale: اسم الحال يحفظ وظيفة اسم الفاعل اليوناني، فيصف السلوك المصاحب للتوبة والرجوع إلى الله.
theological_decisions:
- issue: العلاقة بين التوبة والرجوع إلى الله والأعمال
  choice: تصف الأعمال سلوكًا يليق بالتوبة ويصاحبها، مع إبقاء صياغة النص دون إضافة حكم عقائدي بشأن الاستحقاق.
  alternative: يمكن فهم الأعمال على أنها مضمون التوبة نفسها، أو على أنها أساس استحقاق القبول.
  rationale: يورد النص التوبة والرجوع إلى الله بوصفهما مضمون الإعلان، ثم يأتي اسم الفاعل πράσσοντας ليصف القيام بأعمال تليق بالتوبة. تحافظ الترجمة على هذا الترابط من غير حسم ما لا يصرح به النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعملت «الأمم» حفاظًا على المصطلح السياقي مع شرحه، واختيرت «أعمالًا تليق بالتوبة» لتكون مفهومة للقارئ العام وتحفظ العلاقة المفتوحة في الأصل بين التوبة والسلوك.
