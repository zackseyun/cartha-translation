base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: ar
  text: وفي جميع المجامع، كنت أعاقبهم مرارًا محاولًا إجبارهم على التجديف؛ وإذ كنت أستشيط غضبًا عليهم، ظللت أضطهدهم حتى إلى المدن الواقعة في الخارج[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «حتى إلى المدن التي في الخارج»؛ ويُرجَّح أن المقصود مدن خارج اليهودية.'
    reason: بديل معجمي يحفظ حرفية العبارة اليونانية ويوضح مرجعها الجغرافي المحتمل من غير فرضه في المتن.
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: في جميع المجامع
  rationale: تؤدي κατά مع النصب هنا معنى التوزيع والمكان، فتشير إلى تكرار الفعل في المجامع المختلفة.
- source_word: πολλάκις τιμωρῶν αὐτούς
  choice: كنت أعاقبهم مرارًا
  rationale: تحفظ «مرارًا» معنى التكرار، وتعرض صيغة اسم الفاعل بوصفها فعلًا مصاحبًا ومتكررًا في الماضي.
- source_word: ἠνάγκαζον βλασφημεῖν
  choice: محاولًا إجبارهم على التجديف
  rationale: ينقل «محاولًا» الدلالة الاستمرارية أو التكرارية للماضي الناقص من غير الجزم بأن الإكراه نجح، وتبقى جهة التجديف غير مذكورة كما في اليونانية.
- source_word: περισσῶς ἐμμαινόμενος αὐτοῖς
  choice: إذ كنت أستشيط غضبًا عليهم
  rationale: تعبّر العبارة العربية الطبيعية عن شدة العداء الهائج، وتتجنب إيحاء المرض العقلي الذي قد ينشأ من ترجمة حرفية تتضمن الجنون.
- source_word: ἐδίωκον
  choice: ظللت أضطهدهم
  rationale: تحفظ الاستمرار والتكرار في صيغة الماضي الناقص، وتنقل المعنى السياقي للفعل بوصفه اضطهادًا عدائيًا.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: حتى في المدن الواقعة خارج البلاد
  rationale: صياغة عربية واضحة تنقل امتداد الاضطهاد إلى مدن خارج النطاق المحلي، مع إبقاء المرجع الجغرافي الدقيق في الحاشية بدل حسمه في المتن.
theological_decisions:
- issue: المقصود بالتجديف في سياق اضطهاد بولس
  choice: «على التجديف» من غير تعيين للمجدَّف عليه
  alternative: «على التجديف على يسوع» أو «على لعن الإيمان المسيحي»
  rationale: يوحي السياق بأن التجديف موجَّه إلى يسوع أو إلى الاعتراف المسيحي، لكن النص اليوناني لا يذكر المفعول، لذلك تُحفظ دلالته العامة وتوتره اللاهوتي.
- issue: المدى الجغرافي لعبارة τὰς ἔξω πόλεις
  choice: «المدن الواقعة خارج البلاد» مع حاشية توضيحية
  alternative: «المدن الأجنبية» أو «المدن خارج اليهودية»
  rationale: لا يصرح النص باسم الإقليم الذي تقع المدن خارجه؛ لذا لا يُحسم في المتن أنها خارج اليهودية، وإن كان ذلك مرجحًا سياقيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «المجامع» للمجامع اليهودية بحسب السياق، وصيغتا «كنت» و«ظللت» لإظهار تكرار الأفعال واستمرارها في الماضي. وُضع رمز الحاشية عند العبارة الجغرافية التي تشرحها الحاشية.
