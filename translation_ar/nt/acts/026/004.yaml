lexical_decisions:
- source_word: βίωσίν
  choice: سيرتي
  rationale: تفيد الكلمة مسار العيش وطريقته، لا مجرد الوجود أو الحياة البيولوجية؛ و«سيرتي» موجزة وطبيعية في هذا السياق الدفاعي.
- source_word: ἐκ νεότητος
  choice: منذ شبابي
  rationale: تنقل نقطة البداية الزمنية وتحافظ على الإحالة الشخصية الواضحة من السياق.
- source_word: ἀπ’ ἀρχῆς
  choice: منذ البداية
  rationale: تحافظ على التأكيد الزمني الوارد في اليونانية من غير تفسير زائد.
- source_word: γενομένην
  choice: التي عشتها
  rationale: نُقل اسم الفاعل بصياغة عربية طبيعية تصف السيرة التي جرت في مواضع محددة، من غير التزام بالتعبير الحرفي المتكلف «التي صارت».
- source_word: ἐν τῷ ἔθνει μου
  choice: بين قومي
  rationale: يدل ἔθνος هنا على جماعة بولس القومية، لا على دولة بالمعنى السياسي الحديث؛ و«بين قومي» واضحة ومألوفة.
- source_word: ἔν τε Ἱεροσολύμοις
  choice: وفي أورشليم
  rationale: تنقل τε العطف والإضافة بصورة عربية طبيعية، من غير تحميلها توكيدًا زائدًا.
- source_word: ἴσασι
  choice: يعرفون
  rationale: صيغة οἶδα التامة ذات معنى حالي ثابت، لذا يناسبها المضارع العربي.
- source_word: πάντες Ἰουδαῖοι
  choice: جميع اليهود
  rationale: ترجمة مباشرة تحفظ شمول العبارة والتسمية الإثنية في السياق.
- source_word: μὲν οὖν
  choice: فـ
  rationale: الفاء تؤدي وظيفة الانتقال والاستمرار في سياق دفاع بولس على نحو طبيعي ومقتضب في العربية.
