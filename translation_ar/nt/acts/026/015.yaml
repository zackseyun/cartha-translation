  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: ar
  text: 'فقلتُ: «مَن أنتَ، يا ربّ؟»[a] فقال الربّ: «أنا يسوع الذي تضطهده».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَن أنتَ، يا سيدي؟»؛ فقد تأتي الكلمة اليونانية κύριε صيغةَ خطاب احترام، لكن «يا ربّ» أرجح هنا لأن المتكلم يُعرَّف فورًا بأنه يسوع في ظهور سماوي.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: فقلتُ
  rationale: تفيد δέ هنا انتقالًا سرديًّا خفيفًا لا مقابلة قوية؛ والفاء طبيعية في سياق تعاقب الكلام. وتدل صيغة الفعل العربية على المتكلم من غير حاجة إلى ضمير منفصل قد يوحي بتوكيد زائد.
- source_word: Τίς εἶ, κύριε;
  choice: مَن أنتَ، يا ربّ؟
  rationale: تنقل «مَن أنت؟» معنى τίς εἶ مباشرة. واختير «يا ربّ» لـ κύριε مراعاةً لهيبة المخاطَب السماوي ولأن المتكلم يُعرَّف فورًا بأنه يسوع، مع إثبات الاحتمال الأدبي «يا سيدي» في الحاشية.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: فقال الربّ
  rationale: تؤدي الفاء وظيفة δέ بوصفها رابطًا سرديًّا، ويعبّر «الربّ» عن ὁ κύριος باعتباره لقب المتكلم المعيَّن في السياق.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: أنا يسوع
  rationale: هذه صيغة تعريف مباشر بالهوية. والضمير «أنا» يحفظ حضور ἐγώ الصريح، بينما يصح في العربية حذف فعل الكينونة في الجملة الاسمية الحاضرة.
- source_word: ὃν σὺ διώκεις
  choice: الذي تضطهده
  rationale: يفيد διώκω هنا الاضطهاد العدائي المستمر. ويصل الموصول «الذي» بيسوع على نحو عربي طبيعي، وتدل صيغة المخاطب على σὺ دون إضافة توكيد غير لازم.
theological_decisions:
- issue: ترجمة κύριος في نداء شاول وفي تعريف الراوي للمتكلم
  choice: ربّ / الربّ
  alternative: سيدي / السيد
  rationale: قد تأتي κύριε نداء احترام بمعنى «يا سيدي»، لكن الظهور السماوي والتعريف الفوري للمتكلم بأنه يسوع، ثم قول الراوي ὁ κύριος، يرجّحان «يا ربّ» في المتن. وتحفظ الحاشية الاحتمال الدلالي في النداء من غير أن تسوّي بينه وبين استعمال الراوي المعرَّف.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، بصياغة سردية موجزة. استُخدمت الفاء لربط تعاقب القول طبيعيًّا، وأُبقيت دلالة κύριε المحتملة مفتوحة في الحاشية.
