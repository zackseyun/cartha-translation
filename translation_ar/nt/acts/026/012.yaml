lexical_decisions:
- source_word: Ἐν οἷς
  choice: وفي أثناء ذلك
  rationale: تعبير عربي طبيعي يحفظ الإحالة إلى ما سبق من أعمال بولس ومقاصده، من غير أن يضيف مفهوم «المهمة» غير المصرَّح به في الأصل.
- source_word: πορευόμενος
  choice: كنتُ ذاهبًا
  rationale: ينقل اسم الفاعل المضارع بوصفه فعلًا متزامنًا مع أحداث الرواية، بصياغة عربية واضحة وطبيعية.
- source_word: εἰς τὴν Δαμασκὸν
  choice: إلى دمشق
  rationale: هذا هو المقابل العربي الطبيعي لحرف الجر الدال على الوجهة مع اسم مدينة.
- source_word: μετ’ ἐξουσίας
  choice: بسلطانٍ
  rationale: يدل اللفظ هنا على صلاحية رسمية مخوَّلة، لا على مجرد القدرة أو القوة.
- source_word: ἐπιτροπῆς
  choice: وتفويضٍ
  rationale: ينقل معنى التكليف أو الإذن الرسمي الموكل إلى بولس، ويتآلف طبيعيًا مع «سلطان».
- source_word: τῆς τῶν ἀρχιερέων
  choice: من رؤساء الكهنة
  rationale: يُفهم التركيب الإضافي هنا على أنه يدل على مصدر السلطان والتفويض، وتؤديه «من» بوضوح في العربية.
- source_word: ἀρχιερέων
  choice: رؤساء الكهنة
  rationale: التعبير الاصطلاحي يشير إلى طبقة القيادة الكهنوتية العليا، لا إلى وجود عدة أشخاص يشغلون منصب رئيس الكهنة المفرد في الوقت نفسه.
