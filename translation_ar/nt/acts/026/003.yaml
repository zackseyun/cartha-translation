  text: μάλιστα γνώστην ὄντα σε πάντων τῶν κατὰ Ἰουδαίους ⸀ἐθῶν τε καὶ ζητημάτων· διὸ ⸀δέομαι μακροθύμως ἀκοῦσαί μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/003.yaml
  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: ar
  text: ولا سيما لأنك خبير بجميع العادات والمسائل المختلف عليها عند اليهود[a]. لذلك ألتمس منك أن تسمعني بصبر[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بجميع عادات اليهود ومسائلهم المختلف عليها».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أن تصغي إليَّ بصبر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: ولا سيما لأنك
  rationale: تُبرز العبارة وجه الثقة الخاص في مخاطبة أغريباس، وتوصل التركيب الوصفي بما سبقه على نحو عربي طبيعي.
- source_word: γνώστην ὄντα σε
  choice: لأنك خبير
  rationale: تفيد معرفة أغريباس الوثيقة بهذه الأمور، و«خبير» موجزة وطبيعية من غير أن تفترض اختصاصًا رسميًا.
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν
  choice: بجميع العادات ... عند اليهود
  rationale: تحفظ دلالة مجال العادات وما يتصل باليهود، من غير حصرها في وصف إضافي قد يكون أكثر تفسيرًا.
- source_word: τε καὶ
  choice: و
  rationale: تصل الفئتين بوضوح، ولا تستلزم العربية هنا صيغة «كلا... و...».
- source_word: ζητημάτων
  choice: المسائل المختلف عليها
  rationale: تحفظ مدى اللفظة بين «المسائل» و«النزاعات»، وتلائم السياق القضائي الذي يدور حول قضايا خلافية.
- source_word: διὸ
  choice: لذلك
  rationale: تنقل الاستنتاج المبني على معرفة أغريباس.
- source_word: δέομαι
  choice: ألتمس منك
  rationale: تؤدي معنى الطلب الجاد باحترام، من غير المبالغة التي قد توحي بها «أتوسل».
- source_word: μακροθύμως
  choice: بصبر
  rationale: تنقل طلب الإصغاء المتأني الصبور بعبارة عربية واضحة.
- source_word: ἀκοῦσαί μου
  choice: أن تسمعني
  rationale: ترجمة مباشرة وطبيعية لمعنى سماع المتكلم والإصغاء إليه، من غير إضافة معنى «حتى النهاية» غير المصرح به.
