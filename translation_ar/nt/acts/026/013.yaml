  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: ar
  text: وفي منتصف النهار، رأيتُ في الطريق، أيها الملك، نورًا من السماء يفوق لمعانَ الشمس، أضاء حولي وحول الذين كانوا يسيرون معي.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: في منتصف النهار
  rationale: تعبير زمني اصطلاحي يدل على وسط النهار، وصيغته العربية واضحة وطبيعية.
- source_word: κατὰ τὴν ὁδὸν
  choice: في الطريق
  rationale: ينقل موضع الحدث أثناء السفر بإيجاز وطبيعية، من غير إضافة اتجاه غير مصرّح به.
- source_word: εἶδον
  choice: رأيتُ
  rationale: الماضي البسيط للفعل يدل مباشرة على الإدراك البصري.
- source_word: βασιλεῦ
  choice: أيها الملك
  rationale: يحفظ صيغة النداء المباشر الرسمية بصياغة عربية فصيحة جارية.
- source_word: οὐρανόθεν
  choice: من السماء
  rationale: يحفظ دلالة المصدر السماوي في سياق اللقاء الإعلاني، بدل قصر المعنى على الجو أو الفضاء المرئي.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: يفوق لمعانَ الشمس
  rationale: يعبّر عن التجاوز الذي تفيده ὑπέρ، ويُبقي الاسم λαμπρότης ظاهرًا في الترجمة بصياغة عربية طبيعية.
- source_word: περιλάμψαν
  choice: أضاء حولي وحول
  rationale: ينقل معنى الإضاءة المحيطة الذي يحمله الفعل المركب، ويربطها ببولس ورفاقه بوضوح.
- source_word: φῶς
  choice: نورًا
  rationale: اختيار عربي طبيعي ومهيب لظاهرة ضوئية آتية من السماء، من غير تحديد زائد لطبيعتها.
- source_word: τοὺς σὺν ἐμοὶ πορευομένους
  choice: الذين كانوا يسيرون معي
  rationale: ينقل معنى رفاق السفر كما يصفهم اسم الفاعل مع σύν، من غير إضافة تفاصيل تفسيرية.
theological_decisions:
- issue: دلالة οὐρανόθεν في سياق رؤيوي
  choice: من السماء
  alternative: من جهة السماء / من العلاء
  rationale: «من السماء» تحفظ المنشأ السماوي الذي يدل عليه السياق في سفر الأعمال من غير توسيع الحدث أو تفسيره عقائديًا بما يتجاوز النص.
- issue: طبيعة الضوء المتجاوز للشمس
  choice: نورًا من السماء يفوق لمعانَ الشمس
  alternative: نورًا من السماء أشد سطوعًا من الشمس
  rationale: الصياغة المختارة تحفظ لفظ «اللمعان» وصلة المقارنة كما في اليونانية، من غير تحديد ماهية النور أو مصدر قوته.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات وقار. استُخدم «أيها الملك» للنداء الرسمي، و«يفوق لمعان الشمس» للموازنة بين قرب الصياغة من الأصل وسلاستها. لا توجد حاجة إلى حاشية، لأن البديل الدلالي المبيَّن في الطبقة الإنجليزية يمكن إدماجه بدقة في المتن العربي.
