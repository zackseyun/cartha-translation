  rationale: توضح المراجعة أن التمني يشمل أغريباس وجميع السامعين، وأن التشبّه ببولس هو الحالة المقصودة للجميع، مع إبقاء الاستثناء المتعلق بالقيود. كما عُدّلت الحاشية كي تعرض بدائل العبارة الصعبة دون أن تجعل «الإقناع» جزءًا صريحًا من ألفاظ هذه الآية.
