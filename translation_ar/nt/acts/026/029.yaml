    rationale: الأصل يجعل «أنت» و«جميع السامعين» مفعولَي «يصيروا»، و«مثل ما أنا» وصفًا للحالة المنشودة للجميع. الترتيب المقترح يحفظ هذا النطاق بوضوح في العربية.
  - severity: low
    issue: نص الحاشية يضيّق البديل إلى «تقتنع» مع أن العبارة اليونانية نفسها لا تتضمن فعل الإقناع في هذه الآية.
    rationale: يمكن ذكر الفهم التقليدي في الحاشية، لكن بصياغة تعرضه بوصفه فهمًا محتملًا للعبارة، مع إبقاء احتمالات الدرجة والجهد والزمن/المدى ظاهرة.
