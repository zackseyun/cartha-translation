base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: ar
  text: 'فقال بولس: «أرجو من الله أن تصير أنت، لا وحدك بل أيضًا جميع الذين يسمعونني اليوم، على ما أنا عليه، سواء أكان ذلك في وقت قصير أم طويل[a]، ما عدا هذه القيود».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في القليل أو في الكثير». وتُفهم العبارة أحيانًا بمعنى: «سواء كدت تقتنع أم اقتنعت تمامًا». والعبارة اليونانية صعبة، وقد تشير إلى الدرجة أو الجهد أو الزمن أو المدى.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: أصلّي إلى الله
  rationale: صيغة التمنّي مع ἄν تعبّر عن رغبة دعائية، وورود τῷ θεῷ يحدد الله بوصفه المتوجَّه إليه بالدعاء؛ وهذه الصياغة طبيعية وواضحة بالعربية.
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: سواء في وقت قصير أم طويل
  rationale: العبارة اليونانية صعبة وقد تدل على الزمن أو المقدار أو الدرجة. اختير المعنى الزمني المحتمل في المتن، مع إثبات الاحتمالات الأخرى في الحاشية حفاظًا على الغموض الأصيل.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: لا أنت وحدك، بل أيضًا جميع الذين يسمعونني اليوم
  rationale: تحافظ الصياغة على المقابلة التوكيدية وعلى دلالة اسم الفاعل الحاضر في الذين يصغون إلى بولس في ذلك اليوم.
- source_word: γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: أن تصير ... مثلي أنا
  rationale: تنقل معنى الصيرورة إلى حال مماثلة لحال بولس، مع إبقاء توكيد إحالة بولس إلى نفسه بصياغة عربية طبيعية.
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: ما عدا هذه القيود
  rationale: παρεκτός تفيد الاستثناء، و«القيود» تنقل δεσμοί بوضوح في سياق سجن بولس دون حصرها بالضرورة في هيئة مادية واحدة.
theological_decisions:
- issue: تفسير ἐν ὀλίγῳ καὶ ἐν μεγάλῳ وصلتها بقول أغريباس السابق
  choice: سواء في وقت قصير أم طويل
  alternative: سواء كدت تقتنع أم اقتنعت تمامًا؛ أو بجهد قليل أم كثير
  rationale: العبارة تحتمل الزمن أو المقدار أو الدرجة، ولا يفرض السياق حسمًا يقينيًا. لذلك أُثبت معنى زمني معقول في المتن، وحُفظت القراءات الأخرى في الحاشية بدل طمس التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أصلّي إلى الله» بدل تعبير أضعف مثل «أتمنى»، وحُفظت بنية التوكيد والاستثناء دون تكلف.
