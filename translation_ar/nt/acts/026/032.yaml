base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: ar
  text: 'فقال أغريباس لفستوس: «كان يمكن إطلاق سراح هذا الرجل لو لم يكن قد رفع دعواه إلى قيصر».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان يمكن الإفراج عن هذا الرجل لو لم يكن قد استأنف لدى قيصر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تفيد الانتقال والتتابع في السرد، وتحافظ الفاء على قوة الرابط بأسلوب عربي طبيعي.
- source_word: ἔφη
  choice: قال
  rationale: الماضي الناقص من φημί يأتي هنا أداةً معتادة لإدخال الكلام، و«قال» هي الصياغة العربية الطبيعية.
- source_word: Ἀπολελύσθαι
  choice: إطلاق سراح
  rationale: يدل المصدر التام على التحرير أو الإفراج، و«إطلاق سراح» يلائم السياق القانوني من غير أن يضيّق المعنى إلى تبرئة قضائية رسمية.
- source_word: ἐδύνατο
  choice: كان يمكن
  rationale: ينقل إمكانًا ماضيًا لم يتحقق، وينسجم طبيعيًا مع الشرط المخالف للواقع.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: هذا الرجل
  rationale: يحفظ دلالة اسم الإشارة ويشير بدقة إلى بولس بوصفه رجلًا معينًا.
- source_word: εἰ μὴ
  choice: لو لم
  rationale: يعبّر بوضوح عن الشرط المخالف للواقع في العربية.
- source_word: ἐπεκέκλητο
  choice: كان قد رفع دعواه
  rationale: الفعل في السياق القانوني الروماني يعني الاحتكام إلى قيصر بطلب نظر القضية؛ و«رفع دعواه» ينقل هذا المعنى القانوني بوضوح، مع إثبات البديل الأشهر في الحاشية.
- source_word: Καίσαρα
  choice: قيصر
  rationale: يحفظ اللقب التاريخي والقانوني الوارد في صيغة الاحتكام بدل استبداله بالتفسير «الإمبراطور».
theological_decisions: []
