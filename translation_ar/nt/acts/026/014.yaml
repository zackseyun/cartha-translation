source:
  edition: SBLGNT
  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: ar
  text: 'ولمّا سقطنا جميعًا إلى الأرض، سمعتُ صوتًا يقول لي باللغة العبرية[a]: «شاول، شاول، لماذا تضطهدني؟ صعبٌ عليك أن ترفس المناخس[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «باللغة الآرامية»؛ فالتعبير اليوناني يقول حرفيًا: «باللغة/اللهجة العبرية».'
    reason: alternative_reading
  - marker: b
    text: 'تعبير مَثَلي: فمقاومة المتكلم لا تجلب للمقاوم إلا الأذى، كما يؤذي الحيوان نفسه حين يرفس المناخس التي تحثّه.'
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: ولمّا سقطنا جميعًا إلى الأرض
  rationale: صيغ التركيب المطلق بالمضاف إليه في اليونانية جملةً زمنية عربية طبيعية، مع حفظ شمول πάντων وترتيب السقوط قبل سماع الصوت.
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: سمعتُ صوتًا يقول لي
  rationale: تدل φωνή هنا على صوت ناطق لأن كلامًا مباشرًا يليها، وتفيد πρός με توجيه القول إلى المتكلم.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: باللغة العبرية
  rationale: ينقل هذا التعبير اليوناني نقلًا مباشرًا من غير استبداله بالآرامية؛ ويُذكر الاحتمال التاريخي اللغوي في الحاشية.
- source_word: Σαοὺλ Σαούλ
  choice: شاول، شاول
  rationale: حُفظ الاسم وتكراره لما في التكرار من نداء مؤكد.
- source_word: τί με διώκεις;
  choice: لماذا تضطهدني؟
  rationale: ينقل الفعل المضارع ومعناه في السياق، وهو الملاحقة العدائية والاضطهاد.
- source_word: σκληρόν σοι
  choice: صعبٌ عليك
  rationale: يحفظ الإيجاز والبناء غير الشخصي للمثل، من غير إضافة تفسير إلى المتن.
- source_word: πρὸς κέντρα λακτίζειν
  choice: أن ترفس المناخس
  rationale: المناخس أدوات مدببة تُحث بها الدواب، و«ترفس» تؤدي صورة المقاومة بالقدم في التعبير المثلي.
theological_decisions:
- issue: دلالة τῇ Ἑβραΐδι διαλέκτῳ
  choice: باللغة العبرية
  alternative: باللغة الآرامية
  rationale: أُبقي ظاهر اللفظ اليوناني في المتن، مع صون احتمال أن يكون التعبير مستعملًا للدلالة على الآرامية في حاشية، بدل حسم المسألة داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. وُضعت علامتا الحاشية عند العبارة التي تشرحها كل حاشية، وحُفظ إيجاز المثل وصورته من غير تفكيكه في المتن.
