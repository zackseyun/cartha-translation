  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: ar
  text: ثم نهض الملك والوالي وبرنيكي[a] والجالسون معهم،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'برنيكي: أو «برنيس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέστη
  choice: نهض
  rationale: يدل الفعل هنا على قيام الملك من مجلسه؛ و«نهض» فصيحة وطبيعية وتناسب المقام الرسمي.
- source_word: τε
  choice: ثم
  rationale: تربط الأداة الحدث بما سبقه وتفيد هنا انتقال السرد؛ أما الأداة الثانية فتمثلها بنية العطف العربية.
- source_word: ὁ βασιλεὺς
  choice: الملك
  rationale: يحافظ على اللقب الذي استعمله النص اليوناني بدل استبداله باسم أغريباس.
- source_word: ὁ ἡγεμὼν
  choice: الحاكم
  rationale: يشير اللفظ في هذا السياق إلى الحاكم الروماني الإقليمي، و«الحاكم» مقابله العربي الواضح والمألوف.
- source_word: Βερνίκη
  choice: برنيكي
  rationale: نقل صوتي قريب من صيغة الاسم اليونانية، مع إثبات الصيغة العربية البديلة الشائعة في الحاشية.
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: الجالسون معهم
  rationale: يحافظ على صورة أشخاص كانوا جالسين برفقتهم من غير افتراض صفة اجتماعية لا يصرح بها النص.
- source_word: καὶ
  choice: و
  rationale: تحافظ واو العطف على البنية التراكمية لقائمة الأشخاص والجماعة.
