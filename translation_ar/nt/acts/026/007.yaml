  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: ar
  text: الذي يرجو شعبُنا المكوَّن من الأسباط الاثني عشر أن يبلغه[a]، إذ يعبد الله[c] بجدٍّ ليلًا ونهارًا. وبشأن هذا الرجاء أُتَّهَم من يهود[b]، أيها الملك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: أن يصل إليه. ويعود الضمير إلى الوعد المذكور في الآية السابقة.'
    reason: referent_clarification
  - marker: b
    text: 'العبارة في سياق اتهام قضائي، ولا تعني أن جميع اليهود بلا استثناء كانوا متهمي بولس. ويمكن أيضًا فهم «وبشأن هذا الرجاء» بمعنى: «من أجل هذا الرجاء».'
    reason: contextual_and_lexical_clarification
  - marker: c
    text: 'يمكن أيضًا ترجمة الفعل: «يخدم الله عبادةً» أو «يتعبّد لله»؛ فهو يدل على العبادة أو الخدمة الدينية المقدَّمة لله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: الذي ... أن يبلغه
  rationale: يحفظ معنى الاتجاه نحو غاية، والضمير الموصول يعود إلى الوعد المذكور في الآية السابقة.
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: شعبُنا، شعبُ الأسباط الاثني عشر
  rationale: يحفظ صيغة المفرد الجمعي في اليونانية، ويبيّن بوضوح أن المقصود إسرائيل بوصفه شعب الأسباط الاثني عشر.
- source_word: ἐν ἐκτενείᾳ
  choice: بمواظبة
  rationale: تنقل معنى الجِدّ والاستمرار في العبادة، وتنسجم طبيعيًا مع عبارة «ليلًا ونهارًا».
- source_word: νύκτα καὶ ἡμέραν
  choice: ليلًا ونهارًا
  rationale: يحفظ ترتيب الأصل ويدل اصطلاحيًا على الاستمرار.
- source_word: λατρεῦον
  choice: عابدين الله
  rationale: الفعل يدل هنا على الخدمة الدينية أو العبادة المقدمة لله؛ أُظهر المفعول المفهوم من السياق لتكون العربية واضحة.
- source_word: ἐλπίζει καταντῆσαι
  choice: يرجو ... أن يبلغه
  rationale: يعبّر عن الرجاء في الوصول إلى غاية، وهي الوعد السابق ذكره، بأسلوب عربي طبيعي.
- source_word: περὶ ἧς ἐλπίδος
  choice: ومن أجل هذا الرجاء
  rationale: ينقل في هذا السياق الصلة بين الرجاء والاتهام؛ ويمكن للأصل أيضًا أن يُفهم بمعنى «بشأن هذا الرجاء».
- source_word: ἐγκαλοῦμαι
  choice: أُتَّهَم
  rationale: يحفظ المعنى القضائي المبني للمجهول في سياق دفاع بولس.
- source_word: ὑπὸ Ἰουδαίων
  choice: من يهودٍ
  rationale: ينقل الاسم اليوناني غير المعرّف دون أن يوحي بأن الاتهام صادر عن جميع اليهود بلا استثناء.
- source_word: βασιλεῦ
  choice: أيها الملك
  rationale: صيغة نداء عربية فصيحة وطبيعية تحفظ الخطاب المباشر الرسمي لأغريباس.
theological_decisions:
- issue: المفعول المفهوم مع λατρεῦον
  choice: إظهار «الله» في عبارة «عابدين الله»
  alternative: «متعبّدين» أو «عابدين» دون مفعول صريح
  rationale: لا يذكر النص اليوناني المفعول لفظًا، لكن السياق الديني واستعمال الفعل يجعلان الله هو المقصود بوضوح؛ إظهاره يزيل غموضًا أسلوبيًا في العربية دون إضافة دعوى لاهوتية جديدة.
- issue: مرجع الرجاء
  choice: إبقاء الموصول عائدًا إلى الوعد في الآية السابقة دون التصريح بالقيامة
  alternative: التصريح بأن الغاية هي القيامة
  rationale: السياق الأوسع يربط رجاء بولس بوعد الله وبموضوع القيامة، لكن هذه الآية لا تصرّح بمضمون الوعد؛ لذلك تُحفظ الإحالة والتوتر النصي دون تفسير زائد.
- issue: دلالة περὶ في صلة الرجاء بالاتهام
  choice: «من أجل هذا الرجاء»
  alternative: «بشأن هذا الرجاء»
  rationale: السياق القضائي يسمح بفهم الرجاء سببًا للاتهام أو موضوعًا له؛ اختير التعبير السببي الطبيعي مع التنبيه إلى البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة وموقرة. استُعمل «شعب الأسباط الاثني عشر» للمحافظة على المفرد الجمعي، و«عابدين الله بمواظبة» لإبراز العبادة المستمرة دون لغة طقسية تقنية. جميع علامات الحواشي مثبتة في المتن.
