  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: ar
  text: 'لذلك، إذ نلتُ المعونة التي من الله، ما زلتُ قائمًا إلى هذا اليوم، أشهد للصغير والكبير[a]، ولا أقول شيئًا إلا ما قال الأنبياء وموسى إنه سيحدث[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الصغير والكبير» تعبير يشمل الناس من جميع المراتب الاجتماعية.
    reason: cultural_note
  - marker: b
    text: 'ويجوز: «ولا أقول شيئًا يتجاوز ما قال الأنبياء وموسى إنه سيحدث».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τυχὼν τῆς ἀπὸ τοῦ θεοῦ
  choice: إذ نلتُ المعونة التي من الله
  rationale: «المعونة» تنقل معنى المساعدة أو العون، و«نلت» تؤدي معنى الحصول عليها، مع إبقاء عبارة المصدر الصريحة «التي من الله».
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: ما زلتُ قائمًا إلى هذا اليوم
  rationale: هذه الصياغة العربية الطبيعية تنقل حالة الاستمرار الحاضرة التي يفيدها الفعل التام اليوناني، دون حصر المعنى في مجرد الوقوف الجسدي.
- source_word: μαρτυρόμενος
  choice: أشهد
  rationale: ينقل فعل الشهادة المستمر، ويحافظ على دلالته العامة والقضائية الملائمة للسياق.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: للصغير والكبير
  rationale: يحافظ على صورة التعبير اليوناني وتوازنه البلاغي، مع توضيح مدلوله الاجتماعي في الحاشية.
- source_word: οὐδὲν ἐκτὸς λέγων
  choice: ولا أقول شيئًا خارج ما
  rationale: «خارج ما» تحافظ على احتمال معنى «غير/سوى» ومعنى «متجاوزًا ما» بدل حسمه في اتجاه واحد.
- source_word: ὧν τε οἱ προφῆται ἐλάλησαν ... καὶ Μωϋσῆς
  choice: ما قال الأنبياء وموسى
  rationale: يحافظ على ترتيب اليونانية، ويمثل اقتران الأنبياء وموسى بوصفهما معًا مصدر مضمون القول.
- source_word: μελλόντων γίνεσθαι
  choice: إنه مزمع أن يحدث
  rationale: ينقل التوجه المستقبلي بالنسبة إلى قول الأنبياء وموسى، من غير فرض معنى الوشيكية الزمنية.
theological_decisions:
- issue: مدى ادعاء بولس استمرارية شهادته مع كتب إسرائيل
  choice: ولا أقول شيئًا خارج ما قال الأنبياء وموسى
  alternative: ولا أقول إلا ما قال الأنبياء وموسى
  rationale: الصياغة المختارة تحفظ قوة ادعاء الاستمرارية، كما تبقي المجال الدلالي لـἐκτός بين «سوى» و«متجاوزًا/خارج» دون إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «ما زلت قائمًا» لإظهار الحالة المستمرة، و«مزمع أن يحدث» لصون النبرة النبوية والتوجه المستقبلي. تظهر جميع علامات الحواشي في المتن.
