    rationale: οὖν تربط العبارة بما سبق على سبيل النتيجة؛ «لذلك» أوضح وأشيع في العربية الفصحى المعاصرة.
  - severity: low
    issue: «ولا أقول شيئًا خارج ما» صياغة غير مألوفة نسبيًا.
    rationale: المعنى المقصود من οὐδὲν ἐκτὸς λέγων هو عدم قول شيء سوى/إلا ما قاله الأنبياء وموسى؛ «إلا ما» أدق أسلوبيًا ولا تغيّر المعنى.
  - severity: low
    issue: «مزمع أن يحدث» قد يضيق دلالة μέλλω.
    rationale: قد يوحي «مزمع» بقرب الوقوع في العربية الحديثة، بينما السياق يقتضي مستقبلًا منظورًا من زمن كلام الأنبياء وموسى. «سيحدث» يحافظ على المستقبل من غير هذا الإيحاء.
  revised_text: 'لذلك، إذ نلتُ المعونة التي من الله، ما زلتُ قائمًا إلى هذا اليوم، أشهد للصغير والكبير[a]، ولا أقول شيئًا إلا ما قال الأنبياء وموسى إنه سيحدث[b]:'
