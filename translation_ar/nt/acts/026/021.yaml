  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: ar
  text: بسبب هذه الأمور[a] قبض عليَّ اليهود في الهيكل[b]، وكانوا يحاولون قتلي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لهذا السبب» أو «من أجل هذه الأمور».'
    reason: lexical_alternative
  - marker: b
    text: الكلمة اليونانية هنا تدل على مجمّع الهيكل كله، لا على المقدس الداخلي تحديدًا.
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: لهذا السبب
  rationale: تفيد ἕνεκα مع المضاف إليه العلة أو السبب، والعبارة تشير إلى ما سبق أن رواه بولس من أقوال وأعمال.
- source_word: με
  choice: عليَّ
  rationale: ضمير المتكلم المفرد هو مفعول συλλαβόμενοι، ويأتي طبيعيًّا في العربية مع «قبض على».
- source_word: Ἰουδαῖοι
  choice: اليهود
  rationale: تسمّي العبارة الجماعة اليهودية التي قبضت على بولس في هذه الحادثة. التعريف طبيعي في العربية ولا يُفهم منه، في سياقه السردي، تعميم الحكم على جميع اليهود.
- source_word: συλλαβόμενοι
  choice: قبض
  rationale: يدل الفعل على الإمساك بالشخص أو القبض عليه؛ وهذه الصياغة تلائم السياق العدائي من غير أن تفترض إجراء اعتقال رسمي.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: ἱερόν يدل هنا على مجمّع الهيكل، لا على المقدس الداخلي وحده. أبقينا التعبير المألوف في المتن ووضحنا مداه في الحاشية.
- source_word: ἐπειρῶντο
  choice: كانوا يحاولون
  rationale: يحفظ التركيب دلالة الماضي المستمر في صيغة الناقص، أي استمرار المحاولة أو الشروع فيها.
- source_word: διαχειρίσασθαι
  choice: قتلي
  rationale: يدل الفعل في هذا السياق على إهلاك شخص أو قتله بعنف؛ و«قتلي» أوضح تعبير عربي من غير إضافة توصيف قانوني غير مصرح به.
theological_decisions:
- issue: مدلول «اليهود» في سياق جدلي حساس
  choice: استُعملت «اليهود» للدلالة السياقية على الذين قبضوا على بولس في الحادثة.
  alternative: بعض اليهود؛ أناس من اليهود
  rationale: النص اليوناني يسمّي الجماعة الفاعلة من غير لفظ يعني «بعض». لذلك لم نضف هذا القيد إلى المتن، مع تجنب تفسير العبارة على أنها إدانة للشعب اليهودي كله.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. اختيرت «قبض عليَّ» للتعبير الطبيعي عن الإمساك العدائي، و«كانوا يحاولون» لحفظ الجانب الاستمراري، مع إبقاء الإحالتين [a] و[b] في موضعيهما في المتن.
