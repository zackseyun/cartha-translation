  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: ar
  text: أنَّ المسيحَ سيتألَّم[a]، وأنه، بصفته أولَ من قام من بين الأموات، سيعلن نورًا للشعب[b] وللأمم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الممسوح». «المسيح» هنا لقبٌ في سياق نبوي.'
    reason: alternative_reading
  - marker: b
    text: يُراد بـ«الشعب» هنا على الأرجح الشعب اليهودي، في مقابل الأمم.
    reason: lexical_alternative
  - marker: c
    text: 'أي غير اليهود؛ ويمكن ترجمة اللفظ أيضًا: «الشعوب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παθητὸς
  choice: سيتألَّم
  rationale: الصيغة الصفتية اليونانية تحتمل معنى القابل للتألم أو المعيَّن له؛ وصيغة الفعل المستقبل طبيعية في العربية ضمن هذا التلخيص النبوي، من غير إضافة ضرورة لاهوتية غير مصرَّح بها.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: اللفظ لقبٌ للممسوح المنتظر في سياق حديث بولس عما قاله الأنبياء وموسى.
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: أولَ من يقوم من بين الأموات
  rationale: يحفظ معنى الأسبقية والعبارة المضغوطة المتعلقة بالقيامة، من غير تفسير طبيعة هذه الأسبقية داخل المتن.
- source_word: φῶς
  choice: بالنور
  rationale: أُبقيت استعارة النور الواسعة الدلالة، بدل تضييقها إلى المعرفة أو الخلاص وحدهما.
- source_word: μέλλει καταγγέλλειν
  choice: سيبشِّر
  rationale: ينقل معنى الإعلان المنتظر أو المعيَّن في السياق؛ و«يبشِّر» ملائمة لإعلان النور، مع بقاء مضمون الإعلان غير مفصَّل.
- source_word: τῷ τε λαῷ
  choice: للشعب
  rationale: يحافظ على لفظ المصدر، ويُفهم منه غالبًا الشعب اليهودي بالمقابلة مع الأمم؛ ويُوضح ذلك في الحاشية.
- source_word: τοῖς ἔθνεσιν
  choice: للأمم
  rationale: يحفظ المقابل العربي المباشر للفظ اليوناني، مع بيان أن المراد في السياق غير اليهود.
- source_word: τε ... καὶ
  choice: للشعب وللأمم
  rationale: العطف العربي يعبّر طبيعيًا عن اقتران الجهتين المقصودتين، ولا تستلزم العربية هنا إدخال «كلا» أو «معًا».
theological_decisions:
- issue: معنى أسبقية المسيح في القيامة
  choice: أولَ من يقوم من بين الأموات
  alternative: بكر القائمين من بين الأموات / أول من قام قيامة لا موت بعدها
  rationale: النص يثبت الأسبقية ولا يشرح وجهها؛ لذلك تُحفظ العبارة دون إدخال تفسير عقائدي يحسم علاقتها بحالات الإحياء السابقة.
- issue: مرجع «الشعب»
  choice: للشعب
  alternative: للشعب اليهودي / لإسرائيل
  rationale: استُبقي اللفظ العام كما في اليونانية، بينما تشير مقابلته بالأمم إلى المرجع اليهودي المحتمل، وهو ما توضحه الحاشية.
- issue: قيمة εἰ المكررة في السياق
  choice: أنَّ... وأنه
  alternative: هل كان المسيح سيتألم، وهل...
  rationale: في سياق الآية تُتمّ العبارتان مضمون شهادة الأنبياء وموسى، فتؤديهما «أنَّ» العربية بوصفهما تقريرًا غير مباشر، لا سؤالين مباشرين.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «إذ يكون» لربط أسبقية القيامة بإعلان النور مع الحفاظ على البنية المتوازية، واستُبقيت استعارة «النور» وغموض وجه الأسبقية اللاهوتي.
