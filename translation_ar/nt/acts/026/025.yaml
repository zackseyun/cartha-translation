  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: ar
  text: 'فقال بولس: «لستُ مجنونًا[a]، يا صاحبَ السعادة فستوس[b]، بل أنطق بكلمات الحق والتعقُّل[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لستُ فاقدَ العقل».
    reason: lexical_alternative
  - marker: b
    text: «صاحب السعادة» لقب تشريفي رسمي كان يُستعمل في مخاطبة مسؤول رفيع.
    reason: cultural_note
  - marker: c
    text: أو «الرزانة» أو «سلامة العقل».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تفيد هنا الانتقال مع مقابلة اتهام فستوس في الآية السابقة، وصيغة «فقال» طبيعية في السرد العربي.
- source_word: μαίνομαι
  choice: لستُ مجنونًا
  rationale: ينقل المعنى المباشر للفعل، أي الجنون أو فقدان العقل، بعبارة عربية واضحة ومعاصرة.
- source_word: φησίν
  choice: فقال
  rationale: هو مضارع حكائي في اليونانية، ويؤدَّى طبيعيًا في السرد العربي بالماضي.
- source_word: κράτιστε
  choice: يا صاحبَ السعادة
  rationale: لقب تشريفي رسمي لمخاطبة مسؤول رفيع، وهو أوضح في العربية المعاصرة من الترجمة الحرفية بصيغة التفضيل.
- source_word: ἀληθείας
  choice: الحق
  rationale: أُبقي التركيب الإضافي «كلمات الحق» قريبًا من صياغة الأصل، بما يصف مضمون الكلام وصفته.
- source_word: σωφροσύνης
  choice: التعقُّل
  rationale: يجمع معنى الرزانة وسلامة التفكير وضبط النفس، ويلائم المقابلة المباشرة مع اتهام بولس بالجنون.
- source_word: ῥήματα
  choice: كلمات
  rationale: يحافظ على الاسم الملموس بصيغة الجمع في الأصل دون تحويله إلى معنى عام مثل «أمور».
- source_word: ἀποφθέγγομαι
  choice: أنطق
  rationale: يعكس معنى التكلم بوضوح أو الجهر بالقول، ويحافظ مع «كلمات» على النبرة الرسمية من غير مبالغة.
