  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: ar
  text: «أيها الملك أغريباس، إني أعدّ نفسي محظوظًا إذ أنا على وشك أن أقدّم دفاعي أمامك اليوم بشأن كل ما يتهمني به اليهود[a].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود في السياق اليهود الذين كانوا يتهمون بولس، لا جميع اليهود بلا استثناء.
    reason: توضيح سياقي يمنع فهم العبارة على أنها تعميم عرقي.
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: بشأن كل ما
  rationale: تنقل περί مع المجرور بوصفها محدِّدة لموضوع الكلام، وتحافظ على شمول πάντων بصياغة عربية طبيعية.
- source_word: ἐγκαλοῦμαι
  choice: يُتَّهمني به
  rationale: الفعل في هذا السياق قضائي ويدل على توجيه الاتهام؛ والصياغة العربية المبنية للمعلوم مع ضمير المفعول أكثر سلاسة مع ذكر الجهة الفاعلة.
- source_word: ὑπὸ Ἰουδαίων
  choice: اليهود
  rationale: تعيّن الجهة التي توجه الاتهامات. والمقصود سياقيًا المتهمون اليهود لبولس، لا تعميم الحكم على جميع اليهود.
- source_word: βασιλεῦ Ἀγρίππα
  choice: أيها الملك أغريباس
  rationale: تحافظ أداة النداء على صيغة المخاطب في اليونانية، ويأتي اللقب قبل الاسم بصورة عربية فصيحة وطبيعية.
- source_word: ἥγημαι ἐμαυτὸν
  choice: إني أعدّ نفسي
  rationale: تنقل معنى الاعتبار أو التقدير مع الحفاظ على البنية الانعكاسية.
- source_word: μακάριον
  choice: محظوظًا
  rationale: في مقام الدفاع القضائي يدل اللفظ على حسن الحظ أو الامتياز المتاح لبولس بالمثول أمام أغريباس، لا بالضرورة على بركة دينية صريحة.
- source_word: ἐπὶ σοῦ
  choice: أمامك
  rationale: تلائم سياق المثول والمرافعة أمام صاحب سلطة، من غير إضافة كونه قاضيًا وهي غير مصرّح بها.
- source_word: μέλλων
  choice: لأنني سأدافع
  rationale: تنقل القوة الاستقبالية القريبة للفعل، ويربط التعليل ضمنيًا سبب عدّه نفسه محظوظًا بصياغة عربية واضحة.
- source_word: σήμερον
  choice: اليوم
  rationale: المقابل العربي المباشر والطبيعي للظرف الزمني.
- source_word: ἀπολογεῖσθαι
  choice: أدافع عن نفسي
  rationale: ينقل المعنى القضائي للتحدث دفاعًا عن النفس، وهو أوضح وأطبع في العربية المعاصرة من التعبيرات الاسمية الثقيلة.
