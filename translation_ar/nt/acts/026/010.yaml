source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: ar
  text: 'وهذا أيضًا ما فعلتُه في أورشليم: فقد حبستُ أنا كثيرين من القديسين[a] في السجون، بعد أن تلقيتُ سلطةً من رؤساء الكهنة؛ وحين كانوا يُقتلون، أدليتُ بصوتي ضدهم[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي المؤمنين بيسوع، الذين يُسمّيهم النص «القديسين» بوصفهم شعب الله المقدّس، لا فئة خاصة منهم.
    reason: lexical_clarification
  - marker: b
    text: يشير اللفظ اليوناني حرفيًا إلى إلقاء حصاة للتصويت. وقد يدل التعبير على الإدلاء بصوت رسمي أو، على نحو أوسع، على إعلان الموافقة على قتلهم.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: وهذا أيضًا ما فعلتُه
  rationale: يحيل الضمير إلى اضطهاد المؤمنين المذكور في السياق السابق، وتحافظ «أيضًا» على دلالة καί دون تكلّف.
- source_word: ἐν Ἱεροσολύμοις
  choice: في أورشليم
  rationale: الصيغة العربية الكتابية المألوفة لاسم المدينة.
- source_word: πολλούς τε τῶν ἁγίων ἐγώ
  choice: فقد حبستُ أنا نفسي كثيرين من القديسين
  rationale: «القديسين» تنقل ἁγίων بوصفها تسمية لأعضاء جماعة المؤمنين، و«أنا نفسي» تُظهر توكيد الضمير ἐγώ.
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: حبستُ ... في السجون
  rationale: تنقل معنى الإغلاق والحبس، وتحافظ على صيغة الجمع في φυλακαῖς.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: بعدما تسلّمتُ السلطة من رؤساء الكهنة
  rationale: تبيّن العبارة أساس تصرف بولس، مع نقل مباشر لمعنى ἐξουσία وἀρχιερεῖς.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: وحين كانوا يُقتلون
  rationale: تنقل صيغة المبني للمجهول والدلالة الزمنية لاسم الفاعل، من غير افتراض تفاصيل قانونية لا يذكرها النص.
- source_word: κατήνεγκα ψῆφον
  choice: أدليتُ بصوتي ضدهم
  rationale: تعبير عربي طبيعي ينقل صورة الإدلاء بالصوت؛ و«ضدهم» مستفادة من سياق الاضطهاد، مع إبقاء طبيعة التصويت الدقيقة غير محسومة في الحاشية.
theological_decisions:
- issue: مدلول ἅγιοι
  choice: القديسين، أي جماعة المؤمنين بيسوع
  alternative: المقدسين؛ شعب الله
  rationale: اللفظ هنا لا يخص فئة نخبوية جرى إعلان قداستها لاحقًا، بل أعضاء الجماعة المسيحية، مع الحفاظ على المصطلح العهدي المعروف.
- issue: دلالة κατήνεγκα ψῆφον
  choice: أدليتُ بصوتي ضدهم
  alternative: وافقتُ على قتلهم
  rationale: تحافظ الصياغة على صورة التصويت التي يتضمنها ψῆφος، من غير الجزم بنوع المجلس أو المنصب الذي كان لبولس، وتوضح الحاشية إمكان فهمها بوصفها تعبيرًا عن الموافقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «أورشليم» و«رؤساء الكهنة» و«القديسين» اتساقًا مع المصطلحات الكتابية العربية الشائعة، مع شرح ما قد يُساء فهمه. حوفظ على توكيد ἐγώ وعلى التوازي بين الحبس والمشاركة في القتل من غير إضافة إطار مؤسسي غير مذكور.
