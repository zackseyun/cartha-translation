  source_fidelity: 'النص ينقل عناصر اليونانية الأساسية بأمانة: فعل الحبس في السجون، وكثرة «القديسين»، والسلطة الصادرة من رؤساء الكهنة، والقتل بصيغة المبني للمجهول، والإدلاء بصوت ضدهم. غير أن «تسلّمتُ السلطة» قد توحي بتولّي سلطة أو منصب، لا بمجرد نيل تفويض/سلطة للعمل كما في λαβών ... ἐξουσίαν.'
