  - severity: low
    issue: «أنا نفسي» لتوكيد ἐγώ
    rationale: الضمير اليوناني مؤكد للفاعل، لا ضمير انعكاسي. «أنا» كافٍ لنقل التوكيد، أما «نفسي» فقد تزيد دلالة ليست لازمة.
