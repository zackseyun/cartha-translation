  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: ar
  text: 'وبعد أن انصرفوا، كانوا يتحدثون بعضهم إلى بعض قائلين: «هذا الرجل لا يفعل شيئًا يستحق الموت أو السجن[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الموت أو القيود». اللفظة اليونانية تعني حرفيًا «القيود» أو «السلاسل»، ويُراد بها هنا على الأرجح السجن أو الاحتجاز.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: بعد أن انصرفوا
  rationale: ينقل اسم الفاعل الماضي الدال على ابتعادهم عن المجلس قبل حديثهم، بعبارة عربية طبيعية.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: كانوا يتحدثون بعضهم إلى بعض
  rationale: صيغة «كانوا يتحدثون» تحافظ على الجانب الاستمراري للفعل الناقص، و«بعضهم إلى بعض» تنقل معنى التبادل.
- source_word: λέγοντες
  choice: قائلين
  rationale: صياغة موجزة وطبيعية تُدخل مضمون حديثهم.
- source_word: Οὐδὲν ... ἄξιον
  choice: لا يفعل شيئًا يستحق
  rationale: تنقل نفي وجود أي فعل جدير بالعقوبتين المذكورتين من غير إضافة توصيف جنائي غير صريح.
- source_word: θανάτου ἢ δεσμῶν
  choice: الموت أو السجن
  rationale: «الموت» يحافظ على لفظ الأصل، و«السجن» يوضح الدلالة القضائية المرجحة لـ δεσμῶν، مع إثبات المعنى الحرفي في الحاشية.
- source_word: τι πράσσει
  choice: يفعل شيئًا
  rationale: يحافظ على عموم الفعل المضارع ولا يخصصه بمعنى «يرتكب» الذي قد يوحي سلفًا بجرم.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: هذا الرجل
  rationale: تعبير عربي طبيعي ودقيق في الإشارة إلى بولس.
