id: ACT.26.18
reference: Acts 26:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: ar
  text: أن تفتح عيونهم، لكي يرجعوا من الظلمة إلى النور، ومن سلطان الشيطان[a] إلى الله، فينالوا غفران الخطايا وميراثًا بين الذين قُدِّسوا[b] بالإيمان بي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قوة الشيطان» أو «سيادة الشيطان». يمكن للكلمة اليونانية أن تدل على السلطة أو القدرة الحاكمة أو نطاق السيادة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بين المقدَّسين» أو «بين الذين جُعلوا مقدَّسين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: أن تفتح عيونهم
  rationale: يحفظ الصورة الحسية في الأصل، وهي تُستعمل هنا للدلالة على الإدراك الروحي، من غير استبدالها بتفسير مباشر مثل «تُنير بصائرهم».
- source_word: τοῦ ἐπιστρέψαι
  choice: لكي يرجعوا
  rationale: ينقل دلالة الغرض في المصدر المعرّف، ويحفظ معنى التحول والرجوع دون فرض صياغة لاهوتية أضيق مثل «يهتدوا».
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: من الظلمة إلى النور
  rationale: ترجمة مباشرة وطبيعية للتقابل المجازي في اليونانية.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: سلطان الشيطان
  rationale: «سلطان» يؤدي معنى ἐξουσία بوصفه سلطة أو سيادة حاكمة، مع إثبات البدائل الممكنة في الحاشية.
- source_word: ἐπὶ τὸν θεόν
  choice: إلى الله
  rationale: يناسب حركة الانتقال المقابلة للرجوع من الظلمة ومن سلطان الشيطان.
- source_word: τοῦ λαβεῖν αὐτοὺς
  choice: فينالوا
  rationale: يواصل تسلسل الغرض والنتيجة بأسلوب عربي طبيعي، ويحفظ كون الغفران والميراث عطية ينالونها.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: غفران الخطايا
  rationale: عبارة عربية واضحة ومستقرة تنقل المعنى الخلاصي للمصطلح.
- source_word: κλῆρον
  choice: ميراثًا
  rationale: ينقل معنى النصيب المخصص ضمن شعب الله، ويحفظ الإيحاء العهدي والأخروي أكثر من «حصة» وحدها.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: بين الذين قُدِّسوا
  rationale: 'يحفظ قوة اسم الفاعل التام المبني للمجهول: فعل تقديس تم وله حالة مستمرة، بدل اختزاله إلى صفة جامدة فقط.'
- source_word: πίστει τῇ εἰς ἐμέ
  choice: بالإيمان بي
  rationale: ينقل دلالة الوسيلة أو الواسطة في صيغة عربية مألوفة، ويجعل المسيح موضوع الإيمان كما في تركيب εἰς ἐμέ.
theological_decisions:
- issue: علاقة «بالإيمان بي» بالتقديس
  choice: الذين قُدِّسوا بالإيمان بي
  alternative: فينالوا بالإيمان بي غفران الخطايا وميراثًا بين المقدسين
  rationale: موضع العبارة اليونانية بعد «الذين قُدِّسوا» يرجّح اتصالها بالتقديس، مع بقاء إمكان فهمها على نطاق أوسع في الجملة؛ لذلك حُفظ ترتيب الأصل من غير إعادة تركيب تحسم النطاق خلافًا له.
- issue: دلالة πίστις
  choice: الإيمان بي
  alternative: الثقة بي
  rationale: «الإيمان» هو المقابل العربي الطبيعي في هذا السياق، والتركيب هنا يحدد موضوعه صراحةً بأنه المسيح، من غير وجود تركيب إضافي متنازع عليه.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة. استُخدمت «لكي يرجعوا» لإظهار الغرض، و«فينالوا» لربط النتيجة بسلاسة. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما، لا في موضعين بعيدين عنهما.
