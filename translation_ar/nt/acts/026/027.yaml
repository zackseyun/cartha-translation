  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: ar
  text: أيها الملك أغريباس، أتؤمن بالأنبياء؟ أنا أعلم أنك تؤمن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تقبل شهادة الأنبياء» أو «تثق بالأنبياء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: أتؤمن / تؤمن
  rationale: الفعل مضارع مبني للمعلوم للمفرد المخاطب. «تؤمن» هو المقابل العربي الطبيعي هنا، ويفيد تصديق شهادة الأنبياء وقبولها دون توسيع المعنى إلى دعوى لاهوتية أشمل.
- source_word: βασιλεῦ Ἀγρίππα
  choice: أيها الملك أغريباس
  rationale: حُفظت صيغة النداء الصريحة في اليونانية بصياغة عربية فصيحة طبيعية، ونُقل الاسم وفق صورته العربية الشائعة.
- source_word: τοῖς προφήταις
  choice: بالأنبياء
  rationale: مع πιστεύω تدل صيغة المجرور على من تُصدَّق شهادتهم؛ والترجمة المباشرة «بالأنبياء» تحفظ الإيجاز والإحالة إلى الشهود النبويين.
- source_word: οἶδα
  choice: أنا أعلم
  rationale: فعل ذو صيغة تامة ومعنى حاضر؛ وإظهار الضمير «أنا» يلائم تأكيد بولس الصريح في هذا السياق.
- source_word: ὅτι
  choice: أنك
  rationale: أُدمج حرف المحتوى مع ضمير المخاطب في الصياغة العربية الطبيعية.
theological_decisions:
- issue: طبيعة الإيمان بالأنبياء
  choice: الإبقاء على «تؤمن بالأنبياء» بوصفها تصديقًا لشهادتهم وقبولًا لها
  alternative: تقبل الأنبياء / تثق بالأنبياء
  rationale: العبارة اليونانية تحتمل التركيز على تصديق الأنبياء أو قبول رسالتهم. تحافظ الصياغة المباشرة على هذا المجال الدلالي ولا تجعل قول بولس إقرارًا بعقيدة أوسع مما يقتضيه السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُعمل النداء «أيها الملك أغريباس» لصون المخاطبة اليونانية، وحُفظ تكرار «تؤمن» لما فيه من قوة بلاغية. وُضع مؤشر الحاشية بعد الجملة التي يشرح لفظها.
