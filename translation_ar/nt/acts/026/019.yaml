  text: Ὅθεν, βασιλεῦ Ἀγρίππα, οὐκ ἐγενόμην ἀπειθὴς τῇ οὐρανίῳ ὀπτασίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: ar
  text: لذلك، أيها الملك أغريباس، لم أكن عاصيًا للرؤيا السماوية[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للرؤيا الآتية من السماء».'
    reason: بديل معجمي يبرز احتمال أن تصف οὐρανίῳ منشأ الرؤيا، لا طابعها فقط.
lexical_decisions:
- source_word: Ὅθεν
  choice: لذلك
  rationale: تفيد الاستنتاج مما سبق من خبر ظهور المسيح لبولس وتكليفه، و«لذلك» واضحة وطبيعية في العربية المعاصرة.
- source_word: βασιλεῦ Ἀγρίππα
  choice: أيها الملك أغريباس
  rationale: تنقل صيغة النداء مباشرة، وتحفظ لقب أغريباس بأسلوب عربي فصيح ومألوف.
- source_word: οὐκ ἐγενόμην
  choice: لم أكن
  rationale: الفعل مع الصفة الخبرية يفيد هنا الكينونة أو الاتصاف؛ وصيغة «لم أكن» تحافظ على هذا التركيب بصورة طبيعية.
- source_word: ἀπειθὴς
  choice: عاصيًا
  rationale: يدل السياق على عدم رفض الامتثال للتكليف الإلهي؛ و«عاصيًا» تنقل معنى العصيان من غير تغليظ زائد.
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: للرؤيا السماوية
  rationale: «الرؤيا» هي المقابل الطبيعي لظهور فائق للطبيعة، و«السماوية» تحفظ احتمال دلالة الصفة على المصدر أو الصفة دون حسمه.
theological_decisions:
- issue: طبيعة اختبار بولس في طريق دمشق
  choice: الرؤيا
  alternative: الظهور
  rationale: الاسم ὀπτασία يدل مباشرة على رؤيا أو مشهد منظور. واختيار «الرؤيا» يبقي ضمن تعبير النص نفسه ولا يفرض تفسيرًا لاهوتيًا أوسع.
- issue: دلالة οὐρανίῳ
  choice: السماوية
  alternative: الآتية من السماء
  rationale: قد تصف الصفة الرؤيا من جهة منشئها أو طابعها؛ لذلك يحفظ النص «السماوية» هذا الاتساع، وتذكر الحاشية قراءة المصدر بوضوح.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ النداء الرسمي، واستُعمل تركيب مباشر قريب من بنية الأصل من غير تكلّف.
