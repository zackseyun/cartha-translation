  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: ar
  text: لماذا تحكمون بأنه لا يُصدَّق أن الله يقيم الأموات؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: لماذا
  rationale: تؤدي وظيفة الاستفهام الإنكاري هنا بصورة طبيعية وواضحة في العربية.
- source_word: ἄπιστον
  choice: لا يُصدَّق
  rationale: ينقل معنى ما يُعد غير قابل للتصديق، من غير الخلط بينه وبين عدم الإيمان بوصفه موقفًا دينيًا.
- source_word: κρίνεται παρ’ ὑμῖν
  choice: تحكمون بأنه
  rationale: صياغة عربية مباشرة تحفظ فعل الحكم ونسبة التقييم إلى المخاطبين؛ وπαρά مع المبني للمجهول يدل هنا على الجهة التي يصدر عنها الحكم.
- source_word: εἰ
  choice: أن
  rationale: في هذا الاستفهام الإنكاري، تُدخل مضمون الأمر المستبعَد، وهو إقامة الله للأموات؛ وهذه الصياغة أفصح عربيًا من الشرط الحرفي بـ«إن كان».
- source_word: ὁ θεὸς νεκροὺς ἐγείρει
  choice: الله يقيم الأموات
  rationale: يحفظ ترتيب المعنى والفعل المضارع الذي يعبّر عن قدرة الله وعمله في إقامة الموتى.
theological_decisions:
- issue: هل الجملة تقرير لقيامة محددة أم لسؤال عام عن قدرة الله على إقامة الموتى؟
  choice: 'الإبقاء على التعبير العام: «الله يقيم الأموات»'
  alternative: «أن الله أقام الموتى» أو «سيقيم الأموات»
  rationale: المصدر يستعمل المضارع ἐγείρει بلا تقييد زمني، فلا ينبغي حصره في الماضي أو المستقبل، مع أن السياق يخدم دفاع بولس عن رجاء القيامة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت صيغة المخاطب الجمع «تحكمون» لإظهار παρ’ ὑμῖν طبيعيًا، مع الحفاظ على النبرة الاستفهامية الإنكارية.
