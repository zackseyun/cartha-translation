  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: ar
  text: 'وبينما كان بولس يدافع عن نفسه بهذا الكلام، قال فستوس بصوت عالٍ: «أنت فاقد صوابك يا بولس! إن كثرة علمك[a] تسوقك إلى الجنون».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «دراستك الواسعة». ويمكن أن تعني الكلمة اليونانية أيضًا كثرة الكتابات، لكن السياق يرجّح العلم والتحصيل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: كان بولس يدافع عن نفسه
  rationale: يحفظ المعنى القضائي والشفهي للفعل، ويعبّر عن تزامن دفاع بولس مع مقاطعة فستوس له.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: بصوت عالٍ
  rationale: تعبير عربي طبيعي يحفظ دلالة الطريقة وقوة المقاطعة.
- source_word: φησιν
  choice: قال
  rationale: نُقل المضارع التاريخي اليوناني بصيغة الماضي الملائمة للسرد العربي.
- source_word: Μαίνῃ
  choice: أنت فاقد صوابك
  rationale: ينقل اتهام فستوس لبولس بالجنون بلغة عربية معاصرة واضحة، من غير استعمال تعبير قديم أو تشخيص طبي حديث.
- source_word: τὰ πολλά ... γράμματα
  choice: كثرة علمك
  rationale: تدل γράμματα هنا على العلم أو التحصيل الواسع، لا بالضرورة على رسائل أو كتابات حرفية؛ وتُذكر دلالة الدراسة في الحاشية.
- source_word: εἰς μανίαν περιτρέπει
  choice: تسوقك إلى الجنون
  rationale: يحفظ معنى التسبب والحركة نحو حالة الجنون الذي تؤديه εἰς مع περιτρέπει.
theological_decisions:
- issue: هل يقرر الراوي أن بولس مجنون؟
  choice: صيغ الكلام كله اقتباسًا مباشرًا من فستوس
  alternative: صياغة قد توحي بأن الراوي يثبت الجنون لبولس
  rationale: النص يقدم اتهام فستوس لا حكم الراوي، ولذلك يجب إبقاءه داخل الاقتباس بوضوح.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُخدم «فاقد صوابك» بدل «مجنون» في الجملة الأولى لتجنب التكرار الثقيل، مع إبقاء «الجنون» في الجملة الثانية حفاظًا على الصلة اللفظية بين μαίνῃ وμανίαν.
