  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: ar
  text: فالملك يعرف هذه الأمور، وإليه أتكلّم بجرأة[a]؛ فأنا مقتنع بأن شيئًا منها لم يفته[b]، لأن هذا لم يحدث في زاوية[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أتكلّم إليه بصراحة» أو «بحرية». تدل الكلمة اليونانية على الكلام الصريح العلني الواثق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لم يَخْفَ عليه شيء منها» أو «لم يمرّ شيء منها من دون أن يلاحظه».'
    reason: lexical_alternative
  - marker: c
    text: «في زاوية» تعبير تصويري معناه أن الأمر لم يحدث سرًّا أو بعيدًا عن الأنظار.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: يعرف
  rationale: يفيد الفعل العلم والإلمام؛ و«يعرف» تعبير عربي طبيعي مباشر يناسب معرفة الملك بهذه الأمور.
- source_word: περὶ τούτων
  choice: هذه الأمور
  rationale: تنقل موضوع المعرفة بإيجاز ووضوح، من غير تضييق مرجع اسم الإشارة.
- source_word: παρρησιαζόμενος λαλῶ
  choice: أكلمه بجرأة
  rationale: ينقل معنى الكلام الصريح الواثق والجريء، مع صياغة عربية طبيعية توضح أن الملك هو المخاطَب.
- source_word: λανθάνειν ... αὐτὸν ... οὐθέν
  choice: لم يَفُتْه شيء منها
  rationale: تعبير عربي اصطلاحي واضح يفيد أن شيئًا من هذه الأمور لم يغب عن علمه أو ملاحظته.
- source_word: οὐ πείθομαι
  choice: لأني مقتنع
  rationale: في هذا التركيب يدل πείθομαι على الاقتناع الراسخ؛ وتُنقل بنية النفي اليونانية إلى صياغة عربية طبيعية من غير تغيير المعنى.
- source_word: πεπραγμένον
  choice: يحدث
  rationale: يؤدي معنى وقوع الأمر، بينما يُفهم تمامه من السياق. وهو أنسب عربيًا مع العبارة التصويرية اللاحقة.
- source_word: ἐν γωνίᾳ
  choice: في زاوية
  rationale: يحافظ على الصورة اليونانية التي تفيد أن الأمر لم يقع سرًّا أو بعيدًا عن الأنظار.
- source_word: τοῦτο
  choice: هذا
  rationale: يبقي مرجع اسم الإشارة واسعًا كما في الأصل، من غير حصره في حدث بعينه.
theological_decisions:
- issue: نطاق الإشارة في «هذا» والطابع العلني للأحداث
  choice: الإبقاء على «هذا» عامةً، مع الحفاظ على صورة أن الأمر لم يحدث في زاوية.
  alternative: تحديد المرجع بموت يسوع وقيامته وحدهما، أو توسيعه صراحةً ليشمل الحركة المسيحية كلها وقضية بولس.
  rationale: لا يحدد النص نطاق اسم الإشارة بدقة، لذلك تحافظ الترجمة على اتساعه وعلى التوتر التفسيري بدل أن تفرض تحديدًا عقائديًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع ترتيب سببي طبيعي. حوفظ على صورة «في زاوية» ووضعت لها حاشية تفسيرية، وعلى غموض مرجع «هذا». جميع علامات الحواشي [a] و[b] و[c] واردة في المتن.
