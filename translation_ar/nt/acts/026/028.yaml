  text: ὁ δὲ Ἀγρίππας πρὸς τὸν ⸀Παῦλον· Ἐν ὀλίγῳ με πείθεις Χριστιανὸν ⸀ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/028.yaml
  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: ar
  text: 'فقال أغريباس لبولس[a]: «في وقت قصير تقنعني أن أصير مسيحيًّا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تكاد تقنعني أن أصير مسيحيًّا»، وربما: «أفي مثل هذا الوقت القصير تظن أنك تستطيع أن تجعلني مسيحيًّا؟» فالعبارة اليونانية قد تشير إلى قِصر الوقت أو قلة المقدار، وقد تكون نبرة أغريباس صادقة أو ساخرة.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: فقال أغريباس
  rationale: تؤدي الفاء وظيفة δέ بوصفها رابطًا سرديًّا خفيفًا، ويُستفاد فعل القول من صيغة الخطاب اليونانية المحذوف فعلها.
- source_word: πρὸς τὸν Παῦλον
  choice: لبولس
  rationale: تعبير عربي طبيعي يبيّن أن الكلام موجَّه إلى بولس، مع إظهار فعل القول المفهوم من السياق.
- source_word: Ἐν ὀλίγῳ
  choice: في وقت قصير
  rationale: يحافظ على المعنى الزمني المباشر للعبارة، مع إبقاء احتمال دلالتها على قلة المقدار أو معنى «تكاد» في الحاشية.
- source_word: με πείθεις
  choice: تقنعني
  rationale: ينقل المضارع الدال على فعل جارٍ في سياق الحوار من غير إضافة معنى المحاولة غير المصرح به.
- source_word: Χριστιανὸν
  choice: مسيحيًّا
  rationale: ينقل اسم الهوية الناتجة في تركيب المفعول مع المصدر.
- source_word: ποιῆσαι
  choice: أن أصير
  rationale: صياغة عربية طبيعية تؤدي معنى بلوغ حالة أو هوية جديدة، بدل الترجمة الحرفية الأثقل «أن تجعلني».
theological_decisions:
- issue: نبرة جواب أغريباس وقوته
  choice: 'إثبات مباشر يحتمل أن أغريباس يوشك أن يقتنع: «في وقت قصير تقنعني أن أصير مسيحيًّا»'
  alternative: 'قد يكون استفهامًا ساخرًا أو مراوغًا: «أفي مثل هذا الوقت القصير تظن أنك تجعلني مسيحيًّا؟»، أو قد يعني: «تكاد تقنعني أن أصير مسيحيًّا»'
  rationale: العبارة اليونانية Ἐν ὀλίγῳ محتملة من جهة الزمن أو الدرجة، ولا تحسم بنية الجملة أكانت النبرة صادقة أم ساخرة؛ لذلك يُحفظ المعنى السطحي في المتن وتُذكر البدائل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «أصير» لصياغة النتيجة بصورة طبيعية، وأُبقي غموض العبارة والنبرة في الحاشية دون حسم مذهبي أو تفسيري.
