translation:
  language: ar
  text: مُنقِذًا إيّاك من الشعب ومن الأمم[a]، الذين أنا أُرسلك إليهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مُنقِذًا إيّاك من الشعب اليهودي ومن غير اليهود».'
    reason: بديل معجمي تفسيري يصرّح بمرجعي «الشعب» و«الأمم» في هذا السياق.
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: مُنقِذًا
  rationale: اسم فاعل حاليّ من ἐξαιρέω يفيد الإنقاذ أو التخليص من الخطر. «مُنقِذًا» عربية واضحة وتحافظ على دلالة الفعل المستمرة بالنسبة إلى إرسالية بولس، من غير أن تختزل المعنى في مجرد الإخراج المكاني.
- source_word: τοῦ λαοῦ
  choice: الشعب
  rationale: يحافظ على اللفظ اليوناني العام، مع أن المقابلة مع «الأمم» تدل سياقيًا على الشعب اليهودي أو إسرائيل. إبقاء «الشعب» في المتن يصون الإطار السردي ولا يضيف التفسير صراحةً.
- source_word: τῶν ἐθνῶν
  choice: الأمم
  rationale: في المقابلة اليهودية هنا تشير ἔθνη إلى غير اليهود، لكن «الأمم» تعبير عربي كتابي واضح يحافظ أيضًا على الصورة اللفظية الأصلية، والسياق يبيّن المراد.
- source_word: εἰς οὓς
  choice: الذين ... إليهم
  rationale: صياغة عربية طبيعية بعد فعل الإرسال، وتشير إلى جماعات من البشر. وُضع الموصول بصيغة العاقل الجمع بما يلائم المقصود السياقي.
- source_word: ἀποστέλλω
  choice: أُرسلك
  rationale: المضارع اليوناني في سياق التكليف ذو قوة آنية وأدائية؛ والمضارع العربي «أُرسلك» ينقل مباشرة الإرسالية دون حاجة إلى تركيب مطوّل.
theological_decisions:
- issue: مرجع «الشعب» في مقابل «الأمم»
  choice: الإبقاء على «الشعب» في المتن، مع فهمه سياقيًا على أنه الشعب اليهودي
  alternative: «الشعب اليهودي» أو «شعب إسرائيل»
  rationale: المقابلة توضح المرجع بدرجة كبيرة، لكن الأصل يقول حرفيًا «الشعب». لذلك يحافظ المتن على اللفظ، وتذكر الحاشية القراءة التفسيرية الصريحة.
- issue: التوتر بين الإنقاذ من الجماعتين والإرسال إليهما
  choice: الحفاظ على صياغة تفيد الإنقاذ من الشعب والأمم ثم الإرسال إليهم
  alternative: تقييد الإرسال بالأمم وحدها أو تفسير الإنقاذ على أنه فصل وظيفي لا نجاة من الخطر
  rationale: النص يحتمل توجيه الموصول إلى الجماعات المذكورة بوصفها أناسًا، ولا ينبغي للترجمة أن تزيل التوتر اللاهوتي والسردي بين الحماية منهم والإرسالية إليهم.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُخدمت «إيّاك» لسلامة التركيب مع اسم الفاعل، وحُفظ ترتيب الأصل وإيقاعه قدر الإمكان من دون جمود.
