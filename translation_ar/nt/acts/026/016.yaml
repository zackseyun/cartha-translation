  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: ar
  text: 'لكن انهض وقف على قدميك، فلِهذا الغرض ظهرت لك: لأعيّنك خادمًا وشاهدًا على الأمور التي رأيتني فيها، وعلى الأمور التي سأظهر لك فيها.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: التركيب اليوناني في ختام الآية موجز وصعب؛ فهو يذكر حرفيًا «الأمور التي رأيتني فيها» ثم «الأمور التي سأظهر لك فيها». وقد حافظت الترجمة على لغة الظهور والتوازي بين العبارتين، من غير تحويل المعنى إلى «ما سأريك» أو «ما سأعلنه لك».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστηθι
  choice: انهض
  rationale: فعل أمر يدعو إلى القيام فورًا، و«انهض» فصيحة واضحة وتحافظ على قوة الأمر.
- source_word: στῆθι ἐπὶ τοὺς πόδας σου
  choice: قف على قدميك
  rationale: ينقل التعبير الجسدي الحي في مشهد التكليف من غير زيادة لا يقتضيها النص.
- source_word: εἰς τοῦτο γὰρ
  choice: فلأجل هذا
  rationale: يبين غاية الظهور وسببه المقصود، مع الحفاظ على أداة التعليل.
- source_word: ὤφθην σοι
  choice: ظهرت لك
  rationale: الصيغة مبنية للمجهول صرفيًا، لكنها تُستعمل هنا بمعنى الظهور للشخص؛ وهذه الصياغة طبيعية وتحفظ لغة الظهور.
- source_word: προχειρίσασθαί σε
  choice: لأعيّنك
  rationale: المصدر يبين غاية الظهور، والفعل «أعيّن» ينقل معنى الاختيار الرسمي لمهمة محددة.
- source_word: ὑπηρέτην
  choice: خادمًا
  rationale: يدل اللفظ على تابع أو معاون يؤدي خدمة، و«خادم» أوضح من لفظ كنسي اصطلاحي ولا يساويه بلفظ δοῦλος.
- source_word: μάρτυρα
  choice: شاهدًا
  rationale: هو المقابل العربي المباشر لمن يشهد بما رآه أو أُعلن له.
- source_word: ὧν τε εἶδές με
  choice: على ما رأيتني فيه
  rationale: يحافظ على وجود ضمير المتكلم με وعلى تركيب الموصول الموجز دون افتراض فعل محذوف بعينه.
- source_word: ὧν τε ὀφθήσομαί σοι
  choice: وعلى ما سأظهر لك فيه
  rationale: يبقي الفعل في مجال الظهور المستقبلي، ويربطه بما سيشهد به بولس، من غير تحويله إلى «سأريك».
theological_decisions:
- issue: طبيعة لغة الإعلان في ὤφθην وὀφθήσομαί
  choice: 'ترجمة الفعلين بلغة الظهور: «ظهرت لك» و«سأظهر لك».'
  alternative: «رأيتني/ستراني» أو «أعلنت نفسي/سأعلن نفسي».
  rationale: تحفظ هذه الصياغة الظهور الشخصي الذي يتضمنه النص، من غير حسم كيفية هذا الظهور أو وصفه بأنه انطباع باطني.
- issue: التركيب الموصول الموجز في ختام الآية
  choice: 'الإبقاء على التوازي: «ما رأيتني فيه... ما سأظهر لك فيه».'
  alternative: «ما رأيت وما سأريك» أو «ما رأيته مني وما سأعلنه لك».
  rationale: البدائل أكثر سلاسة لكنها تحذف ضمير «ني» أو تغيّر فعل الظهور إلى الإراءة أو الإعلان؛ لذلك حُفظ غموض الأصل مع إيضاحه في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدم «انهض» بدل «قم» للمحافظة على التمييز بين أمري النهوض والوقوف، ووُضعت علامة الحاشية عند التركيب الذي تشرحه.
