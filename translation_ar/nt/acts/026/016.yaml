  terminology: '«أعيّنك خادمًا وشاهدًا» مناسبة: «خادم» لا تساوي مصطلح δοῦλος، و«شاهد» مقابل مباشر لـ μάρτυς. وتبقى «ظهرت» و«سأظهر» حافظتين للغة الظهور دون تقرير كيفية الظهور.'
