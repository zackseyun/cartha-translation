  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: ar
  text: فقام واحدٌ منهم، اسمه أغابوس، وأعلن بالروح القدس أن مجاعة عظيمة كانت على وشك أن تحلّ بالمسكونة كلها[a]، وقد حدثت في أيام كلوديوس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «العالم كله». وقد تشير «المسكونة» في كتابات لوقا أيضًا، على نحو أخص، إلى العالم الروماني.
    reason: بديل معجمي يوضح المدى المحتمل للفظ οἰκουμένη من غير تقييده في المتن.
lexical_decisions:
- source_word: ἀναστὰς
  choice: فقام
  rationale: ينقل فعل النهوض في سياق الاجتماع بعبارة عربية طبيعية ومباشرة.
- source_word: ἐσήμανεν
  choice: وأعلن
  rationale: يفيد أنه أوضح الأمر وجعله معلومًا، من غير أن يفرض على اللفظ صيغة نبوية اصطلاحية غير مصرّح بها.
- source_word: διὰ τοῦ πνεύματος
  choice: بالروح
  rationale: ينقل معنى الوسيلة أو الفاعلية في διά مع المضاف إليه، والسياق النبوي في سفر الأعمال يدل على الروح القدس.
- source_word: λιμὸν μεγάλην
  choice: مجاعة عظيمة
  rationale: ترجمة مباشرة تحفظ معنى الاسم والصفة اليونانيين.
- source_word: μέλλειν ἔσεσθαι
  choice: كانت على وشك أن تحلّ
  rationale: تحفظ دلالة التوقّع أو القرب في μέλλω مع صيغة المستقبل، وتستعمل مع المجاعة تعبيرًا عربيًا طبيعيًا.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: أن تحلّ بالمسكونة كلها
  rationale: تحفظ الدلالة الأساسية لـ οἰκουμένη، أي العالم المأهول، من غير قصرها في المتن على العالم الروماني.
- source_word: ἥτις ἐγένετο
  choice: وقد حدثت
  rationale: تصل الخبر اللاحق بالتنبؤ بوضوح، وتنقل وقوع المجاعة بلغة عربية معاصرة غير متكلّفة.
- source_word: ἐπὶ Κλαυδίου
  choice: في أيام كلوديوس
  rationale: ينقل التعبير الزمني في ἐπί مع المضاف إليه من غير إضافة لفظ «حكم» غير الموجود صراحة في النص.
theological_decisions:
- issue: مرجع «الروح» في διὰ τοῦ πνεύματος
  choice: الروح القدس هو المقصود بحسب السياق
  alternative: إلهام روحي بمعنى أقل تحديدًا
  rationale: استعمال «الروح» في السياقات النبوية في سفر الأعمال يشير عادةً إلى الروح القدس، مع إبقاء صياغة المتن على لفظ المصدر الموجز.
- issue: مدى οἰκουμένη
  choice: 'إبقاء اللفظ عامًا في المتن: «المسكونة كلها»'
  alternative: العالم كله؛ أو العالم الروماني كله
  rationale: قد يدل اللفظ على العالم المأهول عمومًا، وقد يُستعمل في لوقا والأعمال للعالم الواقع ضمن الأفق الروماني؛ لذلك لا يُحسم هذا التحديد في المتن، بل يُذكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «المسكونة» للمحافظة على الدلالة التاريخية للفظ اليوناني، مع شرحها في الحاشية، ووُضع مؤشر الحاشية عند اللفظ الذي تتعلق به.
