lexical_decisions:
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: يحافظ على الدلالة الاتجاهية للفعل اليوناني، وهو تعبير عربي طبيعي في سياق الانتقال من مكان إلى آخر.
- source_word: δὲ
  choice: ثم
  rationale: أداة ربط خفيفة تدفع السرد إلى الأمام؛ و«ثم» تلائم تسلسل الأحداث من غير أن توحي بتعارض غير موجود.
- source_word: εἰς Ταρσόν
  choice: إلى طرسوس
  rationale: تفيد εἰς مع فعل الحركة جهة المقصد، و«إلى طرسوس» هي الصياغة العربية الطبيعية.
- source_word: ἀναζητῆσαι
  choice: ليبحث عن
  rationale: المصدر اليوناني يدل على الغرض، و«ليبحث عن» ينقل معنى السعي إلى العثور على شاول بوضوح، مع إبقاء البدائل المعجمية في الحاشية.
- source_word: Σαῦλον
  choice: شاول
  rationale: نقل الاسم بصيغته العربية الكتابية المألوفة.
