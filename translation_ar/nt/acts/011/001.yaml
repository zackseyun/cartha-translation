id: ACT.11.1
reference: Acts 11:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: ar
  text: وسمع الرسل والإخوة الذين في أنحاء اليهودية أن الأمم أيضًا قبلوا كلمة الله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات»؛ فاليونانية تقول «الإخوة»، وقد يُراد بها المؤمنون عمومًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: سمع
  rationale: فعل ماضٍ يدل على وصول الخبر إليهم، و«سمع» هو المقابل العربي الطبيعي المباشر.
- source_word: δὲ
  choice: الواو
  rationale: أداة انتقال سردي هنا لا تفيد تضادًا قويًا؛ والوصل بالواو يلائم السياق العربي من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: οἱ ἀπόστολοι
  choice: الرسل
  rationale: المصطلح المعهود في سفر الأعمال للجماعة الرسولية المعروفة.
- source_word: οἱ ἀδελφοὶ
  choice: الإخوة
  rationale: يحافظ على الصيغة المذكرة في اليونانية، مع بيان احتمال شمولها عموم المؤمنين والمؤمنات في الحاشية.
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: الذين في أنحاء اليهودية
  rationale: تنقل الدلالة التوزيعية لحرف κατά، أي الموجودين في مواضع متعددة من اليهودية.
- source_word: ὅτι καὶ τὰ ἔθνη
  choice: أن الأمم أيضًا
  rationale: «أن» تقدم مضمون الخبر، و«أيضًا» تحفظ إبراز انضمام غير اليهود إلى من قبلوا الكلمة؛ و«الأمم» هو التعبير الكتابي العربي المألوف لغير اليهود في هذا السياق.
- source_word: ἐδέξαντο
  choice: قبلوا
  rationale: يفيد δέχομαι تلقي الشيء بقبول، و«قبلوا كلمة الله» تركيب عربي طبيعي يحفظ الاستجابة الإيجابية المقصودة.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: كلمة الله
  rationale: يحفظ التعبير الكتابي ورنينه اللاهوتي، ويشير في السياق إلى رسالة الله المعلنة.
theological_decisions:
- issue: دلالة οἱ ἀδελφοὶ في جماعة قد تضم الرجال والنساء
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: اختيرت الصيغة المطابقة للمذكر الجمع في الأصل، مع عدم حصر مدلولها في الرجال؛ وتوضح الحاشية إمكان استعمالها استعمالًا تمثيليًا لعموم المؤمنين.
- issue: دلالة τὰ ἔθνη في سياق قبول البشارة
  choice: الأمم
  alternative: غير اليهود
  rationale: «الأمم» تحفظ المصطلح الكتابي التقليدي، بينما يقتضي السياق فهمه هنا على أنه الشعوب من غير اليهود، من دون تحميل العبارة معنى جغرافيًا محضًا.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة، بوصل سردي طبيعي، مع الحفاظ على اصطلاحَي «الأمم» و«كلمة الله». أُثبتت علامة الحاشية [a] في المتن.
