  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: ar
  text: وبينما كنتُ أشرع في الكلام، حلَّ الروح القدس عليهم كما حلَّ علينا أيضًا في البدء.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يُرجَّح أن «في البدء» تشير إلى حلول الروح القدس على التلاميذ أول مرة، أي يوم الخمسين.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: وبينما كنتُ أبدأ الكلام
  rationale: ينقل تركيب ἐν مع المصدر المعرّف دلالة التزامن، ويُبقي معنى أن حلول الروح وقع عند بدء بطرس بالكلام.
- source_word: ἐπέπεσεν
  choice: حلَّ على
  rationale: الفعل في هذا السياق يصف مجيء الروح على أشخاص بقوة؛ و«حلَّ على» تعبير عربي طبيعي راسخ يحفظ الصورة السياقية دون تفسير زائد.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: المقابل العربي المعاصر المعياري والدقيق للقب اليوناني.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: كما حلَّ علينا أيضًا
  rationale: أُظهر الفعل المقدّر في المقارنة لتستقيم العربية، مع إبقاء دلالة καί في «أيضًا» والتوازي الصريح بين «عليهم» و«علينا».
- source_word: ἐν ἀρχῇ
  choice: في البدء
  rationale: ترجمة موجزة تحفظ عموم العبارة الزمنية في النص، بينما يوضح السياق أنها تشير على الأرجح إلى بدء اختبار التلاميذ لحلول الروح.
theological_decisions:
- issue: مرجع عبارة ἐν ἀρχῇ («في البدء»)
  choice: الإبقاء على العبارة الزمنية العامة في المتن، مع بيان احتمال الإشارة إلى حلول الروح الأول على التلاميذ في الحاشية
  alternative: 'ترجمتها تفسيرياً: «يوم الخمسين» أو «في أول الأمر»'
  rationale: السياق يرجّح يوم الخمسين، لكن النص اليوناني لا يسمّيه صراحة؛ لذلك لا ينبغي حسم المرجع داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «حلَّ ... على» بدل النقل الحرفي «وقع على» لأنه التعبير العربي الطبيعي في هذا السياق، مع الحفاظ على التوازي والمقارنة في الأصل.
