lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: ففعلوا ذلك
  rationale: يعود الضمير الموصول المحايد إلى ما عزم عليه التلاميذ في الآية السابقة، أي تقديم المعونة. وهذه الصياغة العربية موجزة وطبيعية وتحفظ الصلة بالسياق.
- source_word: ἀποστείλαντες
  choice: وأرسلوا
  rationale: اسم الفاعل الأوريستي يبيّن الفعل الذي به نفّذوا عزمهم؛ والعطف بالفعل الماضي أوضح في العربية السردية من محاكاة التركيب اليوناني حرفيًا.
- source_word: implicit object from context
  choice: المعونة
  rationale: المفعول محذوف في اليونانية ومفهوم من سياق الآية السابقة. والتصريح بـ«المعونة» في العربية يمنع التباس مرجع الضمير من غير زيادة معنى جديد.
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: إلى الشيوخ
  rationale: تشير الكلمة إلى قادة الجماعة المعترف بهم، و«الشيوخ» المقابل العربي الكتابي الواضح والمألوف.
- source_word: διὰ χειρὸς
  choice: مع
  rationale: التعبير اليوناني الاصطلاحي يدل على الوساطة أو حمل الرسالة على أيدي أشخاص معيّنين. «مع برنابا وشاول» صياغة عربية طبيعية تفيد أنهما حملا المعونة، مع بيان الحرفية في الحاشية.
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: برنابا وشاول
  rationale: نقل الاسمين وفق الصيغة العربية الكتابية الشائعة.
