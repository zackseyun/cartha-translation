  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: ar
  text: وهو سيكلّمك بكلمات تُخلَّص بها أنت وجميع أهل بيتك.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «فيها» أو «من خلالها»؛ والتعبير اليوناني يدل على أن الكلمات هي الوسيلة التي يأتي بها الخلاص.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: وهو
  rationale: اسم موصول يعود إلى الرجل المذكور في السياق السابق؛ وصياغة «وهو» طبيعية في العربية عند استئناف مضمون القول مع إبقاء الصلة بالسابق.
- source_word: λαλήσει
  choice: سيكلّمك
  rationale: الفعل λαλέω مع πρὸς σὲ يدل على توجيه الكلام إلى المخاطب؛ و«سيكلّمك» تجمع الفعل ومتعلقه في تعبير عربي واضح.
- source_word: ῥήματα
  choice: بكلمات
  rationale: تحافظ «كلمات» على جمع الاسم اليوناني وعلى صورته المحسوسة، من غير اختزاله في «رسالة».
- source_word: ἐν οἷς
  choice: بها
  rationale: تفيد الباء الوسيلة على نحو طبيعي، فتبيّن أن هذه الكلمات هي الوسيلة التي يأتي بها الخلاص، مع التنبيه في الحاشية إلى البدائل الممكنة.
- source_word: σωθήσῃ
  choice: تخلص
  rationale: صيغة المبني للمجهول العربية «تخلص» تنقل معنى σωθήσῃ في سياق الخلاص، وتنسجم طبيعيًا مع الباء في «بها».
- source_word: σὺ
  choice: أنت
  rationale: إثبات الضمير المنفصل يحفظ توكيد الضمير اليوناني الصريح، ولا سيما في العطف على أهل البيت.
- source_word: πᾶς ὁ οἶκός σου
  choice: جميع أهل بيتك
  rationale: المراد بالبيت هنا جماعة الأسرة ومن ينتمون إلى المنزل، لا البناء؛ و«جميع أهل بيتك» عربية واضحة وتحفظ الشمول.
theological_decisions:
- issue: معنى الخلاص في سياق بيت كرنيليوس
  choice: تُرجم σωθήσῃ بـ«تخلص»، بما يترك للنص دلالته الخلاصية المرتبطة بالكلمات المعلنة.
  alternative: تُنجّى
  rationale: السياق المباشر في أعمال الرسل يتعلق بسماع البشارة ونوال الخلاص؛ ولا تضيف الصياغة تحديدًا مذهبيًا لآلية اشتراك كل فرد فيه.
- issue: نطاق «جميع أهل بيتك»
  choice: 'أُبقي التعبير جماعيًا: «جميع أهل بيتك».'
  alternative: بيتك كله
  rationale: يقرر النص شمول أهل البيت بالوعد، لكنه لا يفصل في هذه الآية وحدها كيفية استجابة كل فرد؛ لذلك لا توحي الترجمة بخلاص آلي ولا تستبعد الشمول المصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «سيكلّمك بكلمات» لقربه من تركيب الأصل مع بقاء العبارة طبيعية، و«أهل بيتك» لتجنب فهم οἶκος على أنه المبنى.
