- source_word: Πέτρος
  choice: بطرس
  rationale: الصيغة العربية المألوفة للاسم الشخصي.
- source_word: ἐξετίθετο
  choice: يشرح لهم الأمر
  rationale: الفعل في صيغة الماضي الناقص ويدل هنا على عرض الأمر وشرحه؛ والمضارع بعد «ابتدأ» ينقل الاستمرار بصورة عربية طبيعية، وإضافة «الأمر» توضح المفعول المفهوم من السياق.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ترجمة مباشرة لضمير الجمع في حالة المجرور الدالة على المخاطَبين.
- source_word: καθεξῆς
  choice: بالترتيب
  rationale: يحفظ معنى عرض الوقائع تباعًا أو في تسلسل منظم، من غير تفسيره بأنه «منذ البداية».
- source_word: λέγων
  choice: قائلًا
  rationale: يحفظ الصلة الحالية التي تمهّد للكلام المباشر الآتي.
