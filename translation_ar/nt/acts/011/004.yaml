  rationale: اسم فاعل ماضٍ يُستعمل هنا استعمالًا ظرفيًّا مع الفعل الرئيس؛ وصياغة «ابتدأ ... يشرح» عربية طبيعية تحفظ معنى الشروع.
- source_word: δὲ
