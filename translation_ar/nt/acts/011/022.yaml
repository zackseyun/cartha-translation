id: ACT.11.22
reference: Acts 11:22
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: ar
  text: وبلغ الخبرُ عنهم مسامعَ الكنيسة التي في أورشليم[a]، فأرسلوا برنابا حتى أنطاكية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وسمعت الكنيسة التي في أورشليم الخبر عنهم»؛ وحرفيًا: «سُمِع الخبر إلى آذان الكنيسة التي في أورشليم».'
    reason: بديل معجمي وبيان للصورة الحرفية في الأصل اليوناني.
lexical_decisions:
- source_word: ἠκούσθη
  choice: بلغ
  rationale: الفعل مبني للمجهول بمعنى «سُمِع»، لكنه مع العبارة الاصطلاحية «إلى الآذان» يفيد وصول الخبر إلى علم الكنيسة؛ و«بلغ» عربي طبيعي يحفظ هذا المعنى.
- source_word: ὁ λόγος
  choice: الخبر
  rationale: يشير λόγος هنا إلى ما شاع عن الأشخاص والأحداث المذكورة سابقًا، لا إلى خطاب رسمي أو إلى «الكلمة» بوصفها مصطلحًا لاهوتيًا.
- source_word: εἰς τὰ ὦτα
  choice: مسامع
  rationale: التعبير اليوناني صورة اصطلاحية لوصول الخبر إلى علم السامعين؛ و«بلغ مسامع» يحفظ الصورة في عربية فصيحة جارية.
- source_word: ἐκκλησίας
  choice: الكنيسة
  rationale: يدل اللفظ في هذا السياق على جماعة المؤمنين المسيحيين، و«الكنيسة» هي المقابل العربي المألوف والدقيق.
- source_word: τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: التي في أورشليم
  rationale: تحفظ الصلة التي تعيّن الكنيسة المقصودة بصياغة عربية واضحة.
- source_word: περὶ αὐτῶν
  choice: عنهم
  rationale: يحفظ ضمير الجمع كما في المصدر من غير حصر مرجعه صراحةً في الأشخاص أو الأحداث، وبذلك يبقى قدر من الغموض السياقي قائمًا.
- source_word: ἐξαπέστειλαν
  choice: فأرسلوا
  rationale: يحفظ صيغة الجمع في اليونانية، وتفيد الفاء تعاقب إرسال برنابا على بلوغ الخبر، من غير تعيين قادة مخصوصين لم يذكرهم النص.
- source_word: Βαρναβᾶν
  choice: برنابا
  rationale: النقل العربي المألوف للاسم الشخصي.
- source_word: ἕως Ἀντιοχείας
  choice: حتى أنطاكية
  rationale: تحفظ «حتى» دلالة الامتداد المكاني في ἕως، بدل تسويتها تمامًا إلى مجرد مقصد بحرف «إلى».
theological_decisions:
- issue: مرجع فاعل «فأرسلوا»
  choice: تُرك الفاعل جمعًا عائدًا بحسب السياق إلى جماعة الكنيسة في أورشليم.
  alternative: أن يكون المرسِلون قادة غير مذكورين، كالرُّسل أو الشيوخ.
  rationale: أقرب مرجع مصرح به هو الكنيسة في أورشليم، لكن النص لا يحدد الرسل أو الشيوخ؛ لذلك تحافظ الترجمة على الجمع ولا تضيف هيئة قيادية بعينها.
- issue: مرجع الضمير في «عنهم»
  choice: الإبقاء على ضمير الجمع من غير تفسير صريح.
  alternative: تفسيره بأنه عن المؤمنين الجدد وحدهم، أو عن مجمل الأحداث وحدها.
  rationale: περὶ αὐτῶν يحتمل بحسب السياق الإشارة إلى الأشخاص المذكورين وإلى ما جرى معهم، ولا ينبغي للترجمة أن تحسم المرجع بأكثر مما يحسمه النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «بلغ مسامع» للموازنة بين طبيعية العربية وصورة الأصل، وحُفظت صيغة الجمع في «فأرسلوا» والغموض المرجعي في «عنهم».
