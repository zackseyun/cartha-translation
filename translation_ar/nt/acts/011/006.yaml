base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: ar
  text: فحدَّقتُ فيها، وكنتُ أتأمَّلها، فرأيتُ دوابَّ الأرض ذواتِ الأربع، والوحوش، والزواحف[a]، وطيورَ السماء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الدوابّ» أو «الكائنات التي تدبّ». فاللفظ اليوناني أوسع من «الزواحف» بالمعنى الحديث.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: فيها
  rationale: يعود الضمير إلى الوعاء أو الملاءة في الرؤيا، ومع فعل التحديق يفيد توجيه النظر إلى داخلها، و«فيها» طبيعية في العربية.
- source_word: ἀτενίσας
  choice: حدَّقتُ
  rationale: ينقل معنى تثبيت النظر باهتمام وتركيز، مع الحفاظ على سبق هذا الفعل للتأمل المستمر.
- source_word: κατενόουν
  choice: أخذتُ أتأمَّل
  rationale: ينقل دلالة الماضي الناقص على فعل متواصل، ويميّزه من «فرأيت» اللاحقة، كما يتضمن معنى الفحص الذهني المتأني.
- source_word: εἶδον
  choice: فرأيتُ
  rationale: ترجمة مباشرة للماضي البسيط، والفاء تسلسِل الرؤية بعد التحديق والتأمل من غير إضافة تفسيرية.
- source_word: τὰ τετράποδα τῆς γῆς
  choice: دوابَّ الأرض ذواتِ الأربع
  rationale: يحفظ التصنيف الحرفي للكائنات ذات الأربع وصلة «الأرض»، بصياغة عربية كتابية واضحة.
- source_word: τὰ θηρία
  choice: الوحوش
  rationale: يميّز الحيوانات البرية عن الفئة الأوسع السابقة، ويحافظ على إيقاع القائمة التصنيفية.
- source_word: τὰ ἑρπετὰ
  choice: الزواحف
  rationale: لفظ عربي موجز ومألوف، مع إثبات البديل الأوسع «الدبابات» في الحاشية لصون صدى تصنيفات الخلق والطهارة.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: طيورَ السماء
  rationale: صياغة عربية طبيعية تحفظ الإضافة في اليونانية؛ والسياق الحيواني يبيّن أن المراد بالسماء الجو.
