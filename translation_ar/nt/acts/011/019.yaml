source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: ar
  text: أمّا الذين تشتّتوا بسبب الضيق[a] الذي وقع بشأن استفانوس، فمضوا حتى فينيقية وقبرص وأنطاكية، من غير أن يكلّموا أحدًا بالكلمة[b] إلا اليهود وحدهم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «الضيق» بـ«الاضطهاد»؛ فاللفظ اليوناني قد يدل على الشدة أو الكرب أو الاضطهاد بحسب السياق.
    reason: lexical_alternative
  - marker: b
    text: المقصود بـ«الكلمة» هنا الرسالة المُعلنة عن يسوع؛ ويمكن ترجمتها أيضًا بـ«الرسالة».
    reason: lexical_alternative
  - marker: c
    text: 'العبارة اليونانية مؤكَّدة: «إلا اليهود وحدهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν διασπαρέντες
  choice: أمّا الذين تشتّتوا
  rationale: «تشتّتوا» تنقل معنى اسم الفاعل المبني للمجهول في السياق، و«أمّا... فقد» تربط الآية باستئناف الرواية السابقة ربطًا عربيًا طبيعيًا.
- source_word: ἀπὸ τῆς θλίψεως
  choice: بسبب الضيق
  rationale: «الضيق» يحفظ المجال الدلالي الواسع لـθλῖψις، مع أن السياق يدل على ضغط عدائي واضطهاد.
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: الذي حدث على أثر قضية استفانوس
  rationale: العبارة تربط الضيق بما جرى في شأن استفانوس؛ وإضافة «قضية» توضّح أن المقصود الأحداث المرتبطة به لا ضيقه الشخصي وحده.
- source_word: διῆλθον ἕως
  choice: وصلوا إلى
  rationale: تنقل بلوغهم هذه الأماكن بصياغة عربية واضحة؛ ويفيد السياق امتداد ارتحالهم إليها.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: فينيقية وقبرص وأنطاكية
  rationale: الأسماء العربية المعيارية للإقليم والجزيرة والمدينة.
- source_word: μηδενὶ λαλοῦντες
  choice: ولم يكلّموا أحدًا
  rationale: صياغة عربية طبيعية تحافظ على نفي توجيه الكلام إلى أي شخص خارج الفئة المستثناة.
- source_word: τὸν λόγον
  choice: بالكلمة
  rationale: يحفظ التعبير اللوقاوي المتكرر «الكلمة» من غير توسيعه تفسيريًا إلى «رسالة الإنجيل» في المتن.
- source_word: εἰ μὴ μόνον Ἰουδαίοις
  choice: إلا اليهود وحدهم
  rationale: يحفظ التوكيد الناتج من اجتماع εἰ μή وμόνον، وهو توكيد يمكن نقله إلى العربية طبيعيًا بـ«إلا... وحدهم».
theological_decisions:
- issue: طبيعة الضغط الذي أعقب أحداث استفانوس
  choice: الضيق
  alternative: الاضطهاد
  rationale: السياق يتضمن اضطهادًا بوضوح، لكن θλῖψις أوسع دلالة؛ لذلك يبقى اللفظ الأوسع في المتن ويُذكر البديل في الحاشية.
- issue: دلالة τὸν λόγον في سفر أعمال الرسل
  choice: الكلمة
  alternative: الرسالة، أي البشارة بيسوع
  rationale: يحافظ هذا على مصطلح لوقا الموضوعي المتكرر، مع شرح المقصود في الحاشية دون إدخال التفسير في المتن.
- issue: حصر المخاطَبين في اليهود
  choice: إلا اليهود وحدهم
  alternative: إلا اليهود
  rationale: إثبات «وحدهم» يحفظ التوكيد الصريح في μόνον ولا يخففه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «أمّا... فقد» لاستئناف السرد، وحُفظ مصطلح «الكلمة» والتوكيد في «اليهود وحدهم». وُضعت جميع علامات الحواشي في المتن عند مواضعها ذات الصلة.
