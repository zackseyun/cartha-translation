  text: ἀπεκρίθη δὲ ⸂φωνὴ ἐκ δευτέρου⸃ ἐκ τοῦ οὐρανοῦ· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: ar
  text: 'لكن صوتًا أجاب من السماء للمرة الثانية: «ما طهَّره الله، فلا تَعُدَّه أنت دنسًا[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلا تَعُدَّه نجسًا»، أو: «فلا تدنِّسه».'
    reason: بدائل معجمية للفعل κοινόω في سياق الطهارة؛ يحافظ النص على لغة الدنس دون التسوية التامة بين «مدنَّس» و«نجس».
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: فعل السرد يعني «أجاب» أو «ردّ»، و«أجاب» عربية طبيعية تلائم تعاقب الحوار.
- source_word: φωνὴ
  choice: صوتًا
  rationale: يحافظ على عدم تعيين صاحب الصوت في النص اليوناني.
- source_word: ἐκ δευτέρου
  choice: مرةً ثانية
  rationale: ينقل التعبير الاصطلاحي بمعنى «للمرة الثانية» بعبارة عربية واضحة.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: السياق يشير إلى السماء بوصفها مصدر الصوت، لا إلى مجرد الجو أو الفضاء المرئي.
- source_word: Ἃ
  choice: ما
  rationale: اسم الموصول المحايد الجمع يفيد هنا معنى عامًا، وتؤديه «ما» طبيعيًا في العربية.
- source_word: ἐκαθάρισεν
  choice: طهَّره
  rationale: ينقل معنى التطهير أو الجعل طاهرًا، مع إبراز فعل الله المكتمل.
- source_word: σὺ
  choice: أنت
  rationale: أُثبت الضمير المنفصل للمحافظة على توكيد الضمير الصريح في اليونانية.
- source_word: μὴ κοίνου
  choice: فلا تعتبره دنسًا
  rationale: الفعل في سياق أحكام الطهارة يعني عدَّ الشيء دنسًا أو معاملته كذلك. هذه الصياغة واضحة بالعربية، وتحافظ الحاشية على البدائل الممكنة في تصوير فعل التسمية أو التدنيس.
theological_decisions:
- issue: دلالة لغة الطهارة في κοινόω
  choice: فلا تعتبره أنت دنسًا
  alternative: 'لا تدعُه نجسًا؛ أو: لا تجعله مدنَّسًا'
  rationale: يتقابل تطهير الله مع حكم الإنسان على الشيء بأنه دنس. اختيرت صياغة لا تحصر الفعل في التلفظ وحده، مع إبقاء البدائل المعجمية في الحاشية وعدم تقرير تفسير مذهبي خاص.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. حُفظ توكيد «أنت»، واستُعملت لغة الطهارة المألوفة من غير تسوية كاملة بين درجات معنى «دنس» و«نجس» و«مدنَّس».
