base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: ar
  text: لكن كان بعضهم رجالًا من قبرص وقيروان، فلما أتوا إلى أنطاكية كانوا يتحدثون أيضًا إلى الهِلِّينيين[a]، مبشِّرين بالرب يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي اليهود الناطقين باليونانية. وتقرأ بعض المخطوطات: «اليونانيين». وإذا كانت هذه هي القراءة الأصلية، فالمعنى أنهم كانوا يتحدثون إلى أناس من الأمم، لا إلى اليهود الناطقين باليونانية وحدهم.'
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: بعضهم
  rationale: تفيد اللفظة جماعة غير محددة من المجموعة المذكورة سابقًا، و«بعضهم» تعبير عربي طبيعي ودقيق.
- source_word: ἄνδρες
  choice: رجالًا
  rationale: الاسم اليوناني مذكر ويدل هنا على رجال بالغين، لذلك حُفظ التحديد الجنسي.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: من قبرص وقيروان
  rationale: صفتا النسبة تدلان على موطن الأصل، وصيغة «من...» أوضح وأطبع في العربية المعاصرة.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: فلما أتوا إلى أنطاكية
  rationale: ينقل التركيب الزمني الطبيعي لاسم الفاعل الماضي، مع إبراز أن الحديث وقع عند وصولهم.
- source_word: ἐλάλουν
  choice: أخذوا يتحدثون
  rationale: تنقل هذه الصياغة جانب الاستمرار أو التكرار في الفعل الناقص اليوناني.
- source_word: καὶ
  choice: أيضًا
  rationale: تحمل هنا على المعنى الإضافي، أي اتساع دائرة المخاطَبين.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: إلى الهِلِّينيين
  rationale: يتبع النص قراءة SBLGNT «Ἑλληνιστάς»، وهي تشير عادةً إلى اليهود الناطقين باليونانية؛ وأُبقي المصطلح مع توضيحه في الحاشية كي لا تُطمس القراءة النصية البديلة المهمة.
- source_word: εὐαγγελιζόμενοι
  choice: مبشِّرين
  rationale: لفظ عربي مألوف ينقل معنى إعلان الخبر السار، ويصف مضمون حديثهم وطبيعته.
- source_word: τὸν κύριον Ἰησοῦν
  choice: بالرب يسوع
  rationale: حُفظ لقب κύριος المسيحاني بلفظ «الرب»، وصيغ التركيب بالعربية الطبيعية بعد «مبشّرين».
theological_decisions:
- issue: هوية τοὺς Ἑλληνιστάς والقراءة البديلة Ἕλληνας
  choice: اتباع قراءة SBLGNT «الهِلِّينيين» في المتن، بمعنى اليهود الناطقين باليونانية، مع إثبات «اليونانيين» في الحاشية.
  alternative: اليونانيين، أي الأمم لا اليهود الناطقين باليونانية.
  rationale: للفارق النصي أثر في تحديد مرحلة وصول البشارة إلى الأمم. يتبع المتن نص المصدر المعطى، وتُحفظ القراءة البديلة في الحاشية دون حسم التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «الهِلِّينيين» حفاظًا على التمييز النصي عن «اليونانيين»، مع شرحه فورًا في الحاشية، ووُضع مؤشر الحاشية في المتن.
