source:
  edition: SBLGNT
  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: ar
  text: لِأَنَّهُ كَانَ رَجُلًا صَالِحًا، مُمْتَلِئًا بِالرُّوحِ الْقُدُسِ وَالْإِيمَانِ.[a] وَأُضِيفَ إِلَى الرَّبِّ جَمْعٌ كَبِيرٌ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «والأمانة». يمكن أن تعني الكلمة اليونانية «الإيمان» أو «الأمانة» أو «الثقة»؛ وقد اختير «الإيمان» في المتن.'
    reason: بديل معجمي
lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّهُ
  rationale: تحفظ أداة التعليل التي تفسّر الثناء السابق على برنابا، وهي صياغة عربية طبيعية في السياق.
- source_word: ἀνὴρ ἀγαθὸς
  choice: رَجُلًا صَالِحًا
  rationale: تحافظ «رجل» على الإحالة المذكرة المحددة إلى برنابا، وتنقل «صالح» صفته الأخلاقية من غير تضييقها إلى اللطف أو الاستقامة وحدهما.
- source_word: πλήρης
  choice: مُمْتَلِئًا مِنَ
  rationale: تعبير عربي واضح ينقل معنى الامتلاء، ويتسق مع المضاف إليه اليوناني التالي.
- source_word: πνεύματος ἁγίου
  choice: الرُّوحِ الْقُدُسِ
  rationale: المقصود في سياق لوقا وأعمال الرسل هو الروح القدس، لا مجرد نزعة بشرية مقدسة.
- source_word: πίστεως
  choice: الْإِيمَانِ
  rationale: «الإيمان» هو المقابل الافتراضي المناسب، مع بقاء معنى «الأمانة» ممكنًا في وصف شخصية برنابا؛ لذلك ذُكر في الحاشية.
- source_word: προσετέθη
  choice: انْضَمَّ
  rationale: ينقل المبني للمجهول اليوناني دلاليًا بصيغة عربية طبيعية تفيد إلحاق الجمع بالرب، من غير استبدال المفعول المقصود بالكنيسة.
- source_word: ὄχλος ἱκανὸς
  choice: جَمْعٌ كَبِيرٌ
  rationale: صياغة عربية معاصرة واضحة تنقل معنى عدد ملحوظ وكثير من الناس.
- source_word: τῷ κυρίῳ
  choice: إِلَى الرَّبِّ
  rationale: 'تحافظ على المفعول الوارد صراحة في اليونانية: الانضمام إلى الرب، لا مجرد الانضمام إلى الجماعة.'
theological_decisions:
- issue: دلالة πνεύματος ἁγίου
  choice: الروح القدس بوصفه الروح الإلهي المعروف
  alternative: روح أو نزعة مقدسة
  rationale: استعمال العبارة في لوقا وأعمال الرسل وسياق تمكين التلاميذ يؤيدان الإحالة إلى الروح القدس.
- issue: دلالة πίστεως في وصف برنابا
  choice: الإيمان
  alternative: الأمانة
  rationale: كلا المعنيين محتمل معجميًا في هذا الوصف؛ اختير المعنى المعتاد في المتن وحُفظ البديل في الحاشية بدل حسم الغموض ضمنيًا.
- issue: متعلَّق προσετέθη ... τῷ κυρίῳ
  choice: انضم الناس إلى الرب
  alternative: أُضيف الناس إلى الكنيسة أو الجماعة
  rationale: النص اليوناني يذكر الرب صراحة؛ وقد يكون الاندماج في الجماعة مفهومًا ضمنًا، لكنه لا ينبغي أن يحل محل عبارة المصدر.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم «صالح» لوصف الخُلُق، و«جمع كبير» بدل تعبيرات أقدم مثل «جمهور غفير». وُضعت علامة الحاشية بعد «الإيمان» لأنها تتعلق بهذه الكلمة تحديدًا.
