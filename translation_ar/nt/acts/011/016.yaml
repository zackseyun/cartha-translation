base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: ar
  text: 'فتذكرتُ قول الرب، كما قال: «أما يوحنا فعمَّد بالماء، وأما أنتم فستُعمَّدون بالروح القدس[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الروح القدس». يمكن فهم حرف الجر اليوناني بمعنى المجال («في») أو الوسيلة («بـ»).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην δὲ
  choice: فتذكرتُ
  rationale: ينقل الفعل بصيغة المتكلم ومعناه الفعلي الطبيعي، وتفيد الفاء انتقالًا سرديًا لطيفًا يلائم وظيفة δέ في السياق.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: قول الرب
  rationale: «قول» أوضح في العربية للدلالة على كلام منطوق يُقتبس بعده مباشرة، و«الرب» يحفظ الدلالة السلطانية واللاهوتية لـ κύριος.
- source_word: ὡς ἔλεγεν
  choice: إذ قال
  rationale: صياغة عربية طبيعية تقدّم الاقتباس من غير أن تفرض معنى التكرار أو الاعتياد على صيغة الماضي الناقص اليونانية.
- source_word: Ἰωάννης μὲν ... ὑμεῖς δὲ
  choice: أما يوحنا ... وأما أنتم
  rationale: يحفظ بناء المقابلة الذي تؤديه μὲν ... δὲ، كما يُبرز الضمير ὑμεῖς ومقابلته بيوحنا.
- source_word: ἐβάπτισεν ὕδατι
  choice: عمَّد بالماء
  rationale: «عمَّد» هو المصطلح العربي المستقر والدقيق سياقيًا، والباء تعبّر طبيعيًا عن وسيلة التعميد في الداتيف اليوناني.
- source_word: βαπτισθήσεσθε
  choice: فستُعمَّدون
  rationale: يحفظ زمن المستقبل وصيغة المبني للمجهول في الأصل.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: بالروح القدس
  rationale: الباء صياغة عربية طبيعية يمكن أن تؤدي معنى المصاحبة أو الوسيلة؛ وتُذكر القراءة المكانية الممكنة لحرف ἐν في الحاشية صونًا للغموض الحقيقي.
theological_decisions:
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: «الرب» المقابل المعتاد لـ κύριος في هذا السياق، ويحفظ سلطان يسوع والوزن اللاهوتي للقب من غير شرح زائد.
- issue: دلالة ἐν في ἐν πνεύματι ἁγίῳ
  choice: بالروح القدس
  alternative: في الروح القدس
  rationale: يحتمل حرف الجر اليوناني معنى الوسيلة أو المجال. اختيرت الباء لسلاستها في العربية، مع إثبات البديل في الحاشية كيلا يُحسم الغموض الدلالي واللاهوتي حسمًا مصطنعًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم بناء «أما... وأما...» لإظهار المقابلة، ووُضعت علامة الحاشية داخل الاقتباس بعد العبارة التي تتعلق بها.
