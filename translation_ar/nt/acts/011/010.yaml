  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: ar
  text: حدث هذا ثلاث مرات، وسُحب كلُّ شيء من جديد إلى السماء.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رُفع كلُّه من جديد إلى السماء».'
    reason: بديل معجمي لـἀνεσπάσθη وἅπαντα، يحافظ على إمكان فهم العبارة على أنها تشير إلى المشهد أو الشيء كله.
lexical_decisions:
- source_word: τοῦτο
  choice: هذا
  rationale: اسم إشارة يعود إلى الحدث الرؤيوي الموصوف سابقًا، من غير إضافة كلمة «الرؤيا» غير الصريحة في اليونانية.
- source_word: δὲ
  choice: ثم
  rationale: أداة ربط سردية خفيفة؛ صيغت هنا بـ«ثم» لربط رفع الأشياء بما سبق في عربية طبيعية.
- source_word: ἐγένετο
  choice: حدث
  rationale: يفيد وقوع الحدث، و«حدث» تعبير عربي واضح ومباشر.
- source_word: ἐπὶ τρίς
  choice: ثلاث مرات
  rationale: ينقل معنى التكرار على ثلاث مرات بصياغة عربية معاصرة.
- source_word: ἀνεσπάσθη
  choice: سُحب
  rationale: يحافظ على صيغة المبني للمجهول وعلى صورة جذب الشيء إلى أعلى، من غير تعيين الفاعل.
- source_word: πάλιν
  choice: من جديد
  rationale: ينقل معنى التكرار أو العودة في هذا السياق بصورة طبيعية.
- source_word: ἅπαντα
  choice: كلُّ شيء
  rationale: يحافظ على الشمول وعلى عدم تحديد المرجع بدقة، فلا يقصره على الملاءة أو الحيوانات.
- source_word: εἰς τὸν οὐρανόν
  choice: إلى السماء
  rationale: يحفظ اتجاه الحركة الذي تفيده εἰς، ويلائم سياق الرؤيا.
theological_decisions:
- issue: مرجع ἅπαντα في تقرير بطرس عن الرؤيا
  choice: كلُّ شيء
  alternative: كلُّه / جميع الحيوانات / الملاءة بما فيها
  rationale: اللفظ اليوناني شامل لكنه لا يحدد المرجع تحديدًا ضيقًا؛ لذلك تُرك التعبير عامًا تجنبًا لإدخال تفسير لا يصرح به العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية رصينة. حوفظ على المبني للمجهول وعلى غموض مرجع «كل شيء»، مع تجنب الألفاظ القديمة أو التحديد التفسيري الزائد.
