id: ACT.11.29
reference: Acts 11:29
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: ar
  text: فقرَّر التلاميذ أن يرسل كلُّ واحدٍ منهم، على قدر ما تسمح به إمكاناته[a]، معونةً إلى الإخوة[b] المقيمين في اليهودية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي بحسب ما كان في مقدور كل واحد أن يقدّمه، أو بحسب سعته.
    reason: lexical_alternative
  - marker: b
    text: قد يُراد بـ«الإخوة» هنا جماعة المؤمنين في اليهودية، بما فيها الرجال والنساء.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: التلاميذ
  rationale: المقابل العربي المألوف والدقيق لأتباع يسوع في سفر أعمال الرسل.
- source_word: καθὼς εὐπορεῖτό τις ... ἕκαστος αὐτῶν
  choice: كلُّ واحدٍ منهم، على قدر ما تسمح به إمكاناته
  rationale: يحفظ المعنى التوزيعي ويفيد أن مقدار العطاء يتناسب مع موارد كل شخص، بصياغة عربية طبيعية.
- source_word: ὥρισαν
  choice: فقرَّر
  rationale: ينقل معنى اتخاذ قرار مقصود، دون مبالغة في دلالة الحزم.
- source_word: εἰς διακονίαν πέμψαι
  choice: أن يرسل ... معونةً
  rationale: تشير διακονία في هذا السياق إلى خدمة عملية أو مساعدة تُرسل إلى المحتاجين؛ و«معونة» تؤدي المعنى المقصود بوضوح مع بقاء الفعل «يرسل» مقابل πέμψαι.
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: إلى ... المقيمين في اليهودية
  rationale: ترجمة مباشرة وطبيعية للعبارة الوصفية.
- source_word: ἀδελφοῖς
  choice: الإخوة
  rationale: يحافظ على الصورة العائلية وصيغة الجمع المذكر في اليونانية، مع بيان احتمال شمول جماعة المؤمنين كلها في الحاشية.
theological_decisions:
- issue: دلالة ἀδελφοῖς على جماعة المؤمنين في اليهودية
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: النص اليوناني يستعمل جمع المذكر، وقد يُراد به في الاستعمال المسيحي المبكر الجماعة المختلطة كلها. أُبقيت الصيغة في المتن ولم يُحسم نطاقها، مع توضيحه في الحاشية.
- issue: طبيعة διακονία المرسلة
  choice: معونة
  alternative: خدمة؛ مساعدة
  rationale: السياق اللاحق يبيّن إرسال دعم عملي إلى شيوخ جماعة اليهودية، لكن النص لا يحدد صورة العطاء تفصيلًا؛ لذلك اختير لفظ عام لا يضيف تحديدًا غير موجود.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. قُدِّم الفاعل التوزيعي «كل واحد منهم» داخل جملة المصدر للمحافظة على بنية المعنى، واستُعملت «إمكاناته» للدلالة على الموارد المتاحة لا القدرة المجردة.
