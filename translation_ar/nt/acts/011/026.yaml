source:
  edition: SBLGNT
  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: ar
  text: ولمّا وجده، جاء به إلى أنطاكية. وكانا، طوال سنة كاملة، يجتمعان مع الكنيسة ويعلّمان جمعًا غفيرًا[a]؛ وفي أنطاكية دُعي التلاميذ «مسيحيين» أول مرة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يجتمعان في الكنيسة». قد يشير التعبير إلى اجتماعهما بجماعة المؤمنين، لا إلى مبنى.'
    reason: lexical_alternative
  - marker: b
    text: أي إن اسم «المسيحيين» أُطلق على التلاميذ في أنطاكية للمرة الأولى؛ ولا يحدد النص مَن أطلقه.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: ولمّا وجده
  rationale: اسم فاعل ماضٍ يسبق الفعل الرئيس ويفيد الترتيب الزمني؛ وصياغة «لمّا» طبيعية وتحفظ هذا التتابع.
- source_word: ἤγαγεν
  choice: جاء به
  rationale: يفيد هنا إحضار شاول إلى أنطاكية، و«جاء به» عربية طبيعية من غير إيحاء زائد بأنه قاده مشيًا.
- source_word: ἐγένετο δὲ αὐτοῖς καὶ
  choice: وحدث أنهما
  rationale: تعبير سردي يمهّد للظرف التالي، والمثنى يوضح أن المقصود برنابا وشاول، وهو مستفاد من السياق.
- source_word: ἐνιαυτὸν ὅλον
  choice: سنةً كاملةً
  rationale: ينقل ظرف المدة بوضوح وإيجاز.
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: اجتمعا مع الكنيسة
  rationale: يحفظ معنى الاجتماع في ارتباط بجماعة المؤمنين، ويتجنب أن يُفهم أن المقصود مبنى كنسي.
- source_word: ἐκκλησίᾳ
  choice: الكنيسة
  rationale: المقصود في سياق أعمال الرسل جماعة المؤمنين، و«الكنيسة» هي المقابل العربي المألوف.
- source_word: διδάξαι
  choice: علَّما
  rationale: فعل منسق مع الاجتماع، وصيغة المثنى العربية تطابق مرجعهما.
- source_word: ὄχλον ἱκανόν
  choice: جمعًا غفيرًا
  rationale: ينقل معنى جماعة كبيرة أو معتبرة بعبارة عربية فصيحة مفهومة.
- source_word: χρηματίσαι
  choice: دُعي
  rationale: يدل في هذا السياق على إطلاق تسمية على التلاميذ، ويحفظ المبني للمجهول دون تحديد مَن أطلقها.
- source_word: πρώτως
  choice: أول مرة
  rationale: يصرّح بوقوع التسمية للمرة الأولى.
- source_word: Χριστιανούς
  choice: «مسيحيين»
  rationale: اسم جماعة مستقر مشتق من المسيح، و«مسيحيين» هو المقابل العربي الطبيعي المعروف، لا صياغة اشتقاقية مصطنعة.
theological_decisions:
- issue: هل تُفهم ἐκκλησία على أنها مبنى أم جماعة؟
  choice: اجتمعا مع الكنيسة
  alternative: اجتمعا في الكنيسة
  rationale: السياق المبكر في أعمال الرسل يرجّح جماعة المؤمنين، بينما قد توحي «في الكنيسة» للقارئ الحديث بمبنى؛ وتبقي الحاشية البديل اللفظي ممكنًا.
- issue: طبيعة تسمية التلاميذ Χριστιανούς
  choice: دُعي التلاميذ «مسيحيين»
  alternative: سُمّي التلاميذ «مسيحيين»
  rationale: يحفظ المبني للمجهول والغموض بشأن مصدر الاسم، فلا ينسب التسمية إلى الله أو إلى الناس دون دليل صريح.
- issue: ترجمة اسم الجماعة المشتق من Χριστός
  choice: مسيحيين
  alternative: أتباع المسيح
  rationale: اللفظ اليوناني تسمية جماعية معجمية، والمقابل العربي التاريخي والطبيعي هو «مسيحيون»؛ أما «أتباع المسيح» فتفسير لا اسم.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُعمل المثنى لأن الفاعلين برنابا وشاول، ووُضعت «مسيحيين» بين علامتي تنصيص بوصفها تسمية أُطلقت على الجماعة. جميع علامات الحواشي مثبتة في المتن.
