  to: ولمّا وجده، جاء به إلى أنطاكية. وكانا، طوال سنة كاملة، يجتمعان مع الكنيسة ويعلّمان جمعًا غفيرًا[a]؛ وفي أنطاكية دُعي التلاميذ «مسيحيين» أول مرة[b].
  rationale: عُدّل التركيب الزمني إلى «وكانا، طوال سنة كاملة، يجتمعان... ويعلّمان...» ليؤدي بسلاسة معنى النشاط المستمر خلال سنة كاملة، مع الحفاظ على مرجع المثنى، وعلى معنى الاجتماع المرتبط بالكنيسة، وعلى غموض الفاعل في إطلاق الاسم. ونُقلت علامة الحاشية (a) إلى موضع العبارة التي تشرحها مباشرة.
