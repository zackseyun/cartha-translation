  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: ar
  text: ولما وصل ورأى نعمة الله[a]، فرح، وظل يحث الجميع على أن يبقوا مع الرب بعزم القلب.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير عبارة «نعمة الله» هنا إلى الآثار الظاهرة لعمل الله بنعمته بينهم.
    reason: lexical_alternative
  - marker: b
    text: أو «يثبتوا مع الرب»، أو «يبقوا أوفياء للرب».
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: وصل
  rationale: اسم الفاعل الأُحادي يدل على وصول برنابا إلى المكان؛ و«وصل» تعبير عربي طبيعي يحفظ معنى الحدث من غير زيادة.
- source_word: ἰδὼν
  choice: رأى
  rationale: يحافظ على الدلالة البصرية المباشرة للفعل ὁράω، مع بقاء إمكان أن تتضمن الرؤية إدراك عمل الله من السياق.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: نعمة الله
  rationale: يحفظ الثقل اللاهوتي لعبارة χάρις ويترك للقارئ أن يفهمها هنا بوصفها نعمة الله أو عمل نعمته الظاهر، من غير اختزالها إلى إعادة صياغة تفسيرية.
- source_word: ἐχάρη
  choice: فرح
  rationale: ترجمة عربية واضحة وطبيعية للصيغة التي تفيد أنه ابتهج بما رآه.
- source_word: παρεκάλει
  choice: ظل يحث
  rationale: «يحث» ينقل القوة الحَضّية للفعل، و«ظل» يعكس دلالة الاستمرار أو التكرار في صيغة الماضي الناقص.
- source_word: πάντας
  choice: الجميع
  rationale: يشمل جميع المؤمنين المقصودين في السياق من غير إضافة مرجع غير مذكور صراحة.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: بعزم القلب
  rationale: تنقل πρόθεσις بمعنى القصد الراسخ أو العزم، وκαρδία بوصف القلب مركز الإرادة والداخل الإنساني، في صياغة موجزة ومفهومة.
- source_word: προσμένειν
  choice: أن يظلوا ملازمين
  rationale: «ملازمين» تنقل معنى الاستمرار في الارتباط والثبات، و«يظلوا» يبرز الاستمرارية من غير فرض مصطلح عقائدي أضيق.
- source_word: τῷ κυρίῳ
  choice: للرب
  rationale: تحفظ لقب κύριος كما في اليونانية، بينما تعبّر اللام عن تعلق الملازمة بالرب في عربية سليمة.
theological_decisions:
- issue: دلالة «نعمة الله» في السياق
  choice: الإبقاء على عبارة «نعمة الله» مع بيان احتمال إشارتها إلى عمل نعمته الظاهر
  alternative: 'إعادة صياغتها: «ما فعله الله بنعمته»'
  rationale: السياق يرجح عمل الله الكريم الذي أمكن لبرنابا أن يرى آثاره، لكن العبارة اليونانية أوسع من هذا الشرح؛ لذلك حُفظت كما هي ولم تُختزل إلى تفسير واحد.
- issue: قوة προσμένειν τῷ κυρίῳ
  choice: الاستمرار في ملازمة الرب
  alternative: الثبات مع الرب؛ أو البقاء أوفياء للرب
  rationale: التركيب يفيد ارتباطًا مستمرًا وثابتًا بالرب. و«ملازمين للرب» يحفظ هذا المعنى من غير إدخال صياغة مذهبية عن المثابرة أو حصره في معنى الأمانة وحده.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «ظل يحث» لإظهار الاستمرار، و«ملازمين للرب» للجمع بين القرب من تركيب الأصل والطبيعية في العربية. أُثبتت علامتا الحاشيتين [a] و[b] في المتن.
