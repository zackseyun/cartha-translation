base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: ar
  text: 'كنتُ في مدينة يافا أُصلّي، ورأيتُ في غيبةٍ رؤيا: شيئًا ما[a] نازلًا كملاءة كبيرة، مُدلّى من السماء بأطرافه الأربعة[b]، حتى وصل إليّ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وعاءً ما»؛ فاللفظ اليوناني واسع الدلالة، ويشير إلى شيء أو أداة أو وعاء قبل تشبيهه بملاءة كبيرة.
    reason: lexical_alternative
  - marker: b
    text: أو «مُدلّى من السماء من زواياه الأربع»؛ ويمكن أن يدل اللفظ اليوناني على الأطراف أو النهايات.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: كنتُ في مدينة يافا أُصلّي
  rationale: يحافظ على ضمير المتكلم وذكر المدينة صراحة، ويعبّر بالمضارع «أُصلّي» عن الفعل المستمر المتزامن مع وجود بطرس في يافا.
- source_word: ἐν ἐκστάσει ὅραμα
  choice: في غيبةٍ رؤيا
  rationale: يميّز بين الحالة الرؤيوية «غيبة» وبين مضمونها «رؤيا»، من غير اختزال اللفظين أو إضفاء معنى عاطفي على التجربة.
- source_word: σκεῦός τι
  choice: شيئًا ما
  rationale: لفظ σκεῦος واسع الدلالة وقد يعني شيئًا أو أداة أو وعاءً؛ والصياغة غير المحددة تحفظ عموم اللفظ قبل تشبيهه بالملاءة.
- source_word: ὡς ὀθόνην μεγάλην
  choice: كملاءة كبيرة
  rationale: ترجمة واضحة وطبيعية للتشبيه، من غير تخصيص القماش بأنه من الكتان، وهو ما لا يصرّح به النص.
- source_word: καταβαῖνον ... καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: نازلًا ... يُدلّى من السماء
  rationale: 'يحفظ كلا الوصفين: حركة النزول، وكون الشيء يُدلّى من السماء.'
- source_word: τέσσαρσιν ἀρχαῖς
  choice: بأطرافه الأربعة
  rationale: تدل ἀρχαί هنا على النهايات أو الأطراف؛ و«أطرافه الأربعة» صورة عربية طبيعية لا تلزم بأن المقصود زوايا هندسية دقيقة.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: حتى وصل إليّ
  rationale: ينقل معنى الحركة إلى غاية موضع بطرس بصورة عربية مباشرة.
theological_decisions:
- issue: صياغة المصطلحين الرؤيويين ἐκστάσει وὅραμα من غير المبالغة في وصف الخبرة الصوفية
  choice: رأيتُ في غيبةٍ رؤيا
  alternative: رأيتُ في انخطافٍ رؤيا
  rationale: «غيبة» تعبّر عن حالة وعي رؤيوية غير عادية، مع إبقاء «الرؤيا» اسمًا لما رآه بطرس. وتجنّب الصياغة معنى النشوة العاطفية الذي قد يوحي به بعض البدائل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدمت «يافا» بصفتها الصيغة العربية الشائعة لاسم المدينة، وحُفظ تتابع الصورة الرؤيوية وحركتها من غير زيادة تفسيرية.
