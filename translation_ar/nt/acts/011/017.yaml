  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: ar
  text: فإن كان الله قد أعطاهم العطية نفسها كما أعطاها لنا نحن أيضًا، نحن الذين آمنّا بالرب يسوع المسيح[a]، فمن كنتُ أنا حتى أستطيع أن أعوق الله؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كما أعطاها لنا نحن أيضًا حين آمنّا بالرب يسوع المسيح». يجوز أن تُفهم صيغة اسم الفاعل اليونانية هنا على معنى ظرفي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: العطية نفسها
  rationale: تفيد العبارة مساواة العطية وتماثلها؛ وهذه الصياغة عربية طبيعية وتوضح أن الله منح المؤمنين من الأمم ما منحه للمؤمنين اليهود.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: إذ آمنّا بالرب يسوع المسيح
  rationale: اسم الفاعل الماضي يطابق ضمير المتكلمين، ويمكن أن يؤدي معنى وصفيًا أو ظرفيًا؛ وتحفظ «إذ آمنّا» الصلة الزمنية من غير تقرير ترتيب لاهوتي أدق مما يقوله النص.
- source_word: κύριον
  choice: الرب
  rationale: تؤدي اللقب المسيحاني/الإقراري ليسوع، لا مجرد معنى السيد البشري.
- source_word: Χριστόν
  choice: المسيح
  rationale: «المسيح» في العربية هو المقابل الطبيعي للقب اليوناني، ويحفظ دلالته بوصفه لقبًا لا اسم عائلة.
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: فمن كنتُ أنا حتى أقدر
  rationale: تنقل الاستفهام الإنكاري وتوكيد ضمير المتكلم وعجز بطرس عن مقاومة فعل الله.
- source_word: κωλῦσαι
  choice: أعوق
  rationale: تفيد المنع أو العرقلة، وتحافظ على التعبير اللافت الذي يجعل الله نفسه مفعولًا به مباشرًا.
- source_word: τὸν θεόν
  choice: الله
  rationale: أُبقي مفعولًا به مباشرًا كما في اليونانية، لأن الاعتراض على قبول الأمم يُصوَّر بوصفه محاولة لإعاقة الله نفسه.
theological_decisions:
- issue: دلالة Χριστόν في لقب κύριον Ἰησοῦν Χριστόν
  choice: المسيح
  alternative: الكريستوس / اعتبار اللفظ جزءًا اسميًا بلا إبراز معنى اللقب
  rationale: «المسيح» هو اللقب العربي الراسخ الموافق لمعنى Χριστός، ويحفظ القوة المسيانية في العبارة.
- issue: علاقة πιστεύσασιν بالضمير ἡμῖν
  choice: إذ آمنّا
  alternative: نحن الذين آمنوا / حين آمنّا / بعد أن آمنّا
  rationale: اليونانية تحتمل الوصف مع دلالة ظرفية ناشئة من اسم الفاعل الماضي. اختيرت صياغة عربية سلسة تحفظ هذه المرونة، مع بيان البديل الأقرب إلى البنية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «العطية» لاتساقها مع سياق عطية الروح، و«أعوق الله» للمحافظة على جرأة تركيب الأصل. وُضع مؤشر الحاشية [a] في المتن.
