  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: ar
  text: وفي تلك الأيام، نزل أنبياء من أورشليم إلى أنطاكية.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يُترجم الفعل، بحسب منظور السرد، «جاءوا نازلين» أو «ذهبوا نازلين». أما «نزل» في العربية فلا يعيّن وحده منظور المجيء أو الذهاب.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: وفي تلك الأيام
  rationale: تحافظ العبارة على الإطار الزمني، وتؤدي الواو قوة δέ الانتقالية الخفيفة من غير إضافة أداة زمنية غير موجودة في الأصل.
- source_word: κατῆλθον
  choice: نزل
  rationale: الفعل يدل على النزول أو الانتقال إلى أسفل، وهو تعبير طبيعي عن الرحلة من أورشليم مع الحفاظ على الدلالة الجغرافية في اليونانية؛ والعربية لا تضطر هنا إلى التفريق بين «جاءوا» و«ذهبوا».
- source_word: ἀπὸ Ἱεροσολύμων
  choice: من أورشليم
  rationale: تنقل ἀπό بمعناها المباشر، ويُستعمل اسم المدينة بصيغته العربية المألوفة.
- source_word: προφῆται
  choice: أنبياء
  rationale: هو المقابل العربي المباشر والمألوف، ولا يضيّق طبيعة خدمتهم إلى وعّاظ أو معلّمين ملهمين.
- source_word: εἰς Ἀντιόχειαν
  choice: إلى أنطاكية
  rationale: تفيد εἰς الحركة نحو المدينة، و«إلى» هي الصياغة العربية الطبيعية.
theological_decisions:
- issue: طبيعة الأنبياء في سياق كنيستي أورشليم وأنطاكية
  choice: أنبياء
  alternative: معلّمون نبويون أو رسل ملهمون
  rationale: النص اليوناني يستعمل اللفظ العام προφῆται من غير أن يحدّد هنا نطاق خدمتهم أو طبيعة منصبهم؛ لذلك تُحفظ دلالة اللفظ واتساعه من غير فرض تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «وفي» للربط السردي الخفيف، وحُفظت دلالة النزول الجغرافية دون صياغة ثقيلة أو حسم منظور الحركة بما لا يلزم في العربية.
