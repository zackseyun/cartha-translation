  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: ar
  text: ولكن لما صعد بطرس إلى أورشليم، كان أهل الختان[a] يجادلونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الذين من الختان». يعرّف التعبير اليوناني جماعة بارتباطها بالختان؛ ويمكن أيضًا: «جماعة الختان» أو «المؤمنون المختونون».'
    reason: بدائل معجمية مع بيان أن الأصل لا يحسم كون المقصود حزبًا رسميًا أو جميع المؤمنين اليهود.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ولكن لما
  rationale: تنقل δέ بوصفها أداة انتقال ذات مسحة خفيفة من المقابلة، مع صياغة عربية طبيعية متصلة بالسياق.
- source_word: ἀνέβη
  choice: صعد
  rationale: تحافظ على التعبير الجغرافي المألوف في الأصل عن الذهاب إلى أورشليم، وهي مدينة مرتفعة ومركز ديني.
- source_word: Πέτρος
  choice: بطرس
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: Ἰερουσαλήμ
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الشائعة لاسم المدينة.
- source_word: διεκρίνοντο
  choice: أخذوا يجادلونه
  rationale: تفيد الصياغة الاستمرارية التي يحملها الماضي الناقص اليوناني، وتنقل هنا معنى المنازعة الكلامية الموجهة إلى بطرس، لا مجرد الشك الباطني.
- source_word: πρὸς αὐτόν
  choice: يجادلونه
  rationale: أُدمج معنى الجار والمجرور في الفعل المتعدي العربي؛ فالمقصود توجيه الجدال إلى بطرس، من غير تشديد غير لازم لمعنى العداء.
- source_word: οἱ ἐκ περιτομῆς
  choice: أهل الختان
  rationale: تعبير عربي موجز وطبيعي يعرّف الأشخاص بارتباطهم بالختان، مع إبقاء مدى العبارة مفتوحًا بدل حسم كونهم حزبًا رسميًا أو جميع المؤمنين اليهود.
theological_decisions:
- issue: هوية οἱ ἐκ περιτομῆς
  choice: أهل الختان
  alternative: جماعة الختان؛ المؤمنون المختونون؛ الذين من الختان
  rationale: يدل السياق على أشخاص في محيط المؤمنين بأورشليم اعترضوا على بطرس وكانت هويتهم مرتبطة بالختان. لا يثبت اللفظ وحده أنهم حزب رسمي، ولا أنه يشمل كل المؤمنين اليهود، لذلك حُفظ هذا القدر من الغموض.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية موقرة. استُعمل «أخذ ... يجادل» لإظهار الفعل المستمر، ووُضع دليل الحاشية مباشرة بعد العبارة التي تشرحها.
