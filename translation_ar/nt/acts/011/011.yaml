  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: ar
  text: وإذا بثلاثة رجال قد وصلوا في الحال إلى البيت الذي كنا فيه، وكانوا قد أُرسلوا إليَّ من قيصرية.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا بـ
  rationale: صيغة عربية سردية طبيعية تلفت الانتباه إلى تطور مفاجئ ومهم، وتحفظ حيوية أداة الخطاب من غير استعمال «هوذا» الأشد تقليدية.
- source_word: ἐξαυτῆς
  choice: في الحال
  rationale: تنقل معنى الفورية والارتباط الزمني الوثيق بما سبق، بعبارة عربية واضحة وموجزة.
- source_word: τρεῖς ἄνδρες
  choice: ثلاثة رجال
  rationale: ترجمة مباشرة تحفظ العدد والتحديد الجنسي الواضح في ἀνήρ.
- source_word: ἐπέστησαν
  choice: قد وصلوا
  rationale: يفيد الفعل هنا الحضور أو الوصول المفاجئ إلى المكان؛ و«وصلوا» أوضح في العربية المعاصرة من ترجمة حرفية مثل «وقفوا».
- source_word: ἐπὶ τὴν οἰκίαν
  choice: إلى البيت
  rationale: مع فعل الوصول تدل العبارة على بلوغ البيت، وحرف الجر «إلى» طبيعي ودقيق في العربية.
- source_word: ἐν ᾗ ἦμεν
  choice: الذي كنا فيه
  rationale: يحفظ المعنى المكاني البسيط من غير إضافة معنى الإقامة غير المصرح به.
- source_word: ἀπεσταλμένοι
  choice: وكانوا قد أُرسلوا
  rationale: تحفظ الصياغة المبنية للمجهول وأسبقية الإرسال على الوصول، مع تركيب عربي سلس.
- source_word: ἀπὸ Καισαρείας
  choice: من قيصرية
  rationale: ترجمة مباشرة لحرف الجر الدال على المنشأ واسم المكان.
- source_word: πρός με
  choice: إليَّ
  rationale: تدل على أن بطرس هو المقصود بوجهة إرسالهم، من غير توسيع تفسيري.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت «وإذا بـ» بدل «وهوذا» لأنها تؤدي وظيفة لفت الانتباه والمفاجأة بصورة طبيعية، مع إبقاء «في الحال» صريحًا لنقل ἐξαυτῆς وعدم دمج اللفظين في تعبير واحد.
