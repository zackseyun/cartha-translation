  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: ar
  text: وكانت يدُ الرب معهم، فاتجه إلى الرب عددٌ كبيرٌ من الذين آمنوا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: يدُ الرب
  rationale: يحفظ هذا التعبير الحرفي الصورة الكتابية المألوفة التي تدل على قدرة الرب الفاعلة وتأييده، من غير استبدال الاستعارة بتفسيرها.
- source_word: κύριος
  choice: الرب
  rationale: هو المقابل العربي الكتابي والطبيعي للقب κύριος، ويحفظ إمكان الإشارة في السياق إلى يسوع أو إلى الله من غير حسم زائد.
- source_word: μετ’ αὐτῶν
  choice: معهم
  rationale: ينقل المعنى الطبيعي لحرف الجر μετά مع المضاف إليه، أي حضور الرب وتأييده المصاحب لهم.
- source_word: πολύς τε ἀριθμός
  choice: عددٌ كبير
  rationale: تعبير عربي طبيعي يحفظ البناء الاسمي ويدل بوضوح على كثرة الناس.
- source_word: ὁ πιστεύσας
  choice: فآمن
  rationale: صيغ الفعل المفرد في اليونانية لموافقته الاسم الجمعي «عدد»، أما العربية الطبيعية فتسمح بالفعل المفرد قبل الفاعل «عدد كبير»؛ ويُفهم الإيمان بوصفه مرتبطًا برجوع ذلك العدد إلى الرب.
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: ورجعوا إلى الرب
  rationale: «رجع إلى» تعبير عربي واضح للحركة الروحية نحو الرب، ويحفظ معنى التحول دون إضافة لفظ التوبة غير المذكور صراحة. استُعمل الجمع بعد ذكر «عدد كبير» مراعاةً للمعنى وتفاديًا لثقل «رجع عدد».
theological_decisions:
- issue: مرجع لقب «الرب» في الموضعين
  choice: الإبقاء على «الرب» في الموضعين دون تعيين المرجع
  alternative: التصريح بأن المقصود هو يسوع، أو تفسيره بأنه الله على وجه العموم
  rationale: النص اليوناني يقول κύριος فحسب. وقد يرجح سياق أعمال الرسل الإشارة إلى يسوع، لكن إبقاء اللقب كما هو يصون الانفتاح المقصود ولا يضيف تعيينًا تفسيريًا.
- issue: العلاقة بين الإيمان والرجوع إلى الرب
  choice: 'صياغة متتابعة: «فآمن عددٌ كبير ورجعوا إلى الرب»'
  alternative: «فرجع إلى الرب عددٌ كبير من الذين آمنوا» أو «فآمن عدد كبير، أي رجعوا إلى الرب»
  rationale: الفاعل النحوي في اليونانية هو «عدد كبير»، والصفة الفعلية ὁ πιστεύσας تصفه. الصياغة المختارة تبقي الإيمان والرجوع مرتبطين من دون أن تحسم هل المشاركة تفيد الترتيب الزمني الصارم أو وصف الجماعة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الاستعارة الكتابية «يد الرب»، وتُرك لقب «الرب» بلا توسع تفسيري. وُضعت علامة الحاشية [a] في المتن بعد الجملة التي تتناول بديل تركيب المشاركة اليونانية.
