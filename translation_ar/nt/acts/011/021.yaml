  naturalness: «ورجعوا» بعد «عددٌ كبير» غير منسجم نحويًا في العربية الفصحى، وإن كان المقصود مفهومًا. أما «فاتجه إلى الرب عددٌ كبيرٌ من الذين آمنوا» ففصيحة وواضحة، وتتفادى الإيحاء بأن «رجع» يقتضي عودة سابقة.
  terminology: «يد الرب» و«الرب» مصطلحان مناسبان وطبيعيان في العربية الكتابية المعاصرة. واختيار «اتجه إلى الرب» ينقل معنى التحول نحو الرب دون إدخال معنى التوبة أو العودة السابقة.
