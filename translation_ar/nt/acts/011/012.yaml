id: ACT.11.12
reference: Acts 11:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: ar
  text: فقال لي الروح أن أذهب معهم من غير تمييز[a]. وجاء معي أيضًا هؤلاء الإخوة الستة، ودخلنا بيت الرجل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من غير تردد»، أو «من غير شك». يمكن أن يدل اسم الفاعل اليوناني على عدم التمييز أو على عدم التردد والشك.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: الروح
  rationale: السياق في سفر الأعمال يدل على الروح القدس بوصفه مصدر الإرشاد، مع إبقاء الصياغة اليونانية التي لا تضيف هنا صفة «القدس».
- source_word: εἶπεν ... μοι
  choice: فقال لي
  rationale: ترجمة مباشرة وطبيعية لفعل القول مع المفعول غير المباشر، والتوجيه يتضح من المصدر المؤول التالي.
- source_word: συνελθεῖν αὐτοῖς
  choice: أن أذهب معهم
  rationale: يدل الفعل هنا على مرافقة الرجال، وهذه صياغة عربية واضحة وطبيعية في السياق السردي.
- source_word: μηδὲν διακρίναντα
  choice: من غير تمييز
  rationale: يحفظ معنى عدم التفريق، الملائم لسياق تجاوز الحد الفاصل بين اليهود والأمم، من غير إسقاط المعاني الأخرى الممكنة للفعل؛ وتُذكر في الحاشية.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: هؤلاء الإخوة الستة
  rationale: يحفظ اسم الإشارة والعدد، و«الإخوة» مناسب لأن المقصود ستة رجال من المؤمنين.
- source_word: εἰσήλθομεν
  choice: دخلنا
  rationale: مقابل عربي مباشر وطبيعي للفعل في السرد.
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: بيت الرجل
  rationale: يحفظ ذكر الرجل صراحة بدل استبداله بضمير، ويأتي بتركيب عربي موجز وطبيعي.
theological_decisions:
- issue: دلالة μηδὲν διακρίναντα في تقرير بطرس
  choice: من غير تمييز
  alternative: من غير تردد، أو من غير شك
  rationale: سياق دفاع بطرس عن دخوله بيت رجل من الأمم يرجح معنى عدم التفريق، لكن الفعل اليوناني يحتمل أيضًا التردد أو الشك؛ لذلك لم تُحسم الدلالة بصمت، بل حُفظت البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، بصياغة سردية طبيعية، مع إبقاء «الروح» كما في النص اليوناني والحفاظ على التعدد الدلالي في الحاشية.
