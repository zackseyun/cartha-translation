lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: أخبرنا
  rationale: ينقل معنى إبلاغ الآخرين بما حدث، وهو تعبير طبيعي يلائم السرد.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد من غير إقحام معنى تضاد قوي.
- source_word: πῶς
  choice: كيف
  rationale: تحافظ على دلالة الكيفية أو عرض مضمون الخبر بدل اختزالها إلى «أن».
- source_word: εἶδεν
  choice: رأى
  rationale: الماضي العربي يعبّر طبيعيًا عن الرؤية السابقة للإخبار، ولا يحتاج إلى تركيب مماثل للماضي التام الإنجليزي.
- source_word: τὸν ἄγγελον
  choice: الملاك
  rationale: أداة التعريف في اليونانية والسياق يشيران إلى الملاك المحدد في رؤيا كرنيليوس.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: في بيته
  rationale: ترجمة مباشرة وطبيعية لمكان ظهور الملاك.
- source_word: σταθέντα
  choice: واقفًا
  rationale: ينقل هيئة الملاك وحضوره في الرؤيا بصياغة عربية موجزة وطبيعية.
- source_word: εἰπόντα
  choice: قائلًا
  rationale: يحافظ على البنية الحالية المنسقة مع «واقفًا» في الأصل.
- source_word: Ἀπόστειλον
  choice: أرسل
  rationale: فعل أمر مفرد، مع إبقاء المفعول به محذوفًا كما في الأصل وعدم إضافة «رجالًا» من المواضع الموازية.
- source_word: εἰς Ἰόππην
  choice: إلى يافا
  rationale: «إلى» تؤدي معنى الوجهة، و«يافا» الاسم العربي الشائع للمدينة.
- source_word: μετάπεμψαι
  choice: استدعِ
  rationale: يؤدي معنى إرسال طلب إلى شخص ليأتي، بصياغة عربية واضحة وموجزة.
- source_word: Σίμωνα τὸν ἐπικαλούμενον Πέτρον
  choice: سمعان الملقَّب بطرس
  rationale: يعرّف سمعان بالاسم الذي يُدعى به؛ و«الملقَّب» صياغة عربية طبيعية تحافظ على قوة التعريف.
