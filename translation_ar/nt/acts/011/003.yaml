  yaml_path: translation/nt/acts/011/003.yaml
  text: saying[a], “You went in to uncircumcised men and ate with them.”
translation:
  language: ar
  text: 'قائلين: «دخلتَ على رجالٍ غير مختونين[a]، وأكلتَ معهم.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي رجالًا من غير اليهود، ممن لا يحملون علامة الختان المرتبطة بالعهد.
    reason: توضيح الخلفية العهدية والاجتماعية لتعبير «غير مختونين» من غير استبداله في المتن.
lexical_decisions:
- source_word: λέγοντες
  choice: قائلين
  rationale: اسم فاعل حالي يربط الاعتراض بالسياق السابق، و«قائلين» صياغة عربية فصيحة موجزة.
- source_word: ὅτι
  choice: علامتا الاقتباس
  rationale: تُدخل الأداة هنا قولًا مباشرًا، والأفصح عربيًا تمثيله بالاقتباس.
- source_word: Εἰσῆλθες πρὸς
  choice: دخلتَ إلى
  rationale: يحفظ معنى الدخول إلى حيث يوجد هؤلاء الرجال، ولا يختزله في مجرد المصاحبة.
- source_word: ἄνδρας
  choice: رجالٍ
  rationale: ينقل الدلالة المذكرة المحددة للاسم ἀνήρ في هذا السياق.
- source_word: ἀκροβυστίαν ἔχοντας
  choice: غير مختونين
  rationale: تعبير عربي طبيعي يحفظ وصفهم بحسب علامة الختان، بدل استبداله بالتفسير «أمم».
- source_word: καὶ συνέφαγες αὐτοῖς
  choice: وأكلتَ معهم
  rationale: ينقل مباشرة معنى الأكل المشترك الذي يفيده الفعل المركب مع الضمير.
theological_decisions:
- issue: هل يُترجم وصف ἀκροβυστίαν ἔχοντας تفسيرياً بـ«الأمم» أم يُحفظ وصف عدم الختان؟
  choice: غير مختونين
  alternative: من الأمم
  rationale: صياغة المتكلمين تركز على علامة العهد والحد الفاصل الاجتماعي والديني؛ إبقاء «غير مختونين» يحفظ حدة الاعتراض من غير تفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية رصينة. استُخدم «دخلتَ إلى» للمحافظة على صورة الدخول، و«غير مختونين» للمحافظة على التعبير العهدي في الأصل.
