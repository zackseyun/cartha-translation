  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: ar
  text: 'فقلت: «حاشا يا رب، لأن شيئًا دنسًا أو نجسًا لم يدخل فمي قط».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير كلمتا «دنسًا» و«نجسًا» هنا إلى ما كان يُعدّ غير طاهر بحسب أحكام الطعام.
    reason: توضيح المعنى الطقسي للكلمتين ومنع فهمهما على أنهما وصف للنظافة المادية فقط.
lexical_decisions:
- source_word: Μηδαμῶς
  choice: حاشا
  rationale: تعبير عربي فصيح وطبيعي عن الرفض القاطع، يلائم جواب بطرس المباشر.
- source_word: κύριε
  choice: يا رب
  rationale: يحفظ صيغة النداء ودلالة اللقب في اليونانية من غير زيادة تفسيرية.
- source_word: κοινὸν
  choice: دنسًا
  rationale: في هذا السياق الطقسي يدل على ما عُدَّ غير مقدس أو غير طاهر، و«دنس» يميزه نسبيًا من ἀκάθαρτον.
- source_word: ἀκάθαρτον
  choice: نجسًا
  rationale: المقابل العربي المباشر لما هو غير طاهر طقسيًا.
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: دخل فمي
  rationale: يحافظ على صورة النص اليوناني الطبيعية الدالة على الأكل.
- source_word: ὅτι
  choice: لأن
  rationale: ينقل العلاقة السببية الصريحة بين رفض بطرس وما اعتاده من التزام بالطهارة.
theological_decisions:
- issue: التمييز بين κοινόν وἀκάθαρτον
  choice: دنسًا أو نجسًا
  alternative: نجسًا أو غير طاهر
  rationale: يحافظ على وجود وصفين مختلفين في الأصل بدل دمجهما في مفهوم واحد، مع بيان معناهما السياقي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت «حاشا» للإيجاز والرفض القاطع، مع إبقاء التعليل وصورة دخول الطعام إلى الفم قريبين من تركيب الأصل.
