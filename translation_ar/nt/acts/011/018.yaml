  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: ar
  text: 'فَلَمَّا سَمِعُوا هذِهِ الأُمُورَ سَكَتُوا وَمَجَّدُوا اللهَ، قَائِلِينَ: «إِذًا، قَدْ مَنَحَ اللهُ الأُمَمَ أَيْضًا التَّوْبَةَ الَّتِي تُؤَدِّي إِلَى الْحَيَاةِ»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «إلى الحياة» بـ«للحياة» أو «توبة إلى الحياة». وتفيد العبارة اليونانية اتجاه التوبة إلى الحياة أو نتيجتها. والمقصود بـ«الأمم» هنا غير اليهود.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: فَلَمَّا سَمِعُوا هذِهِ الأُمُورَ
  rationale: ينقل اسم الفاعل الماضي بوصفه ظرفًا زمنيًا سابقًا للفعلين الرئيسيين، وتؤدي الفاء وظيفة الوصل الخفيف في السياق العربي.
- source_word: ἡσύχασαν
  choice: هَدَأُوا
  rationale: يدل السياق على أنهم كفّوا عن الاعتراض والجدال؛ و«هدأوا» عربية طبيعية تحفظ الانتقال من الاعتراض إلى السكون.
- source_word: ἐδόξασαν τὸν θεόν
  choice: مَجَّدُوا اللهَ
  rationale: ترجمة مباشرة تحفظ الدلالة اللاهوتية والاستعمال المتكرر للفعل δοξάζω في لوقا وأعمال الرسل.
- source_word: Ἄρα καὶ
  choice: إِذًا ... أَيْضًا
  rationale: «إذًا» تفيد الاستنتاج، و«أيضًا» تبرز امتداد عطية الله إلى غير اليهود.
- source_word: τοῖς ἔθνεσιν
  choice: الأُمَمَ
  rationale: المقصود في السياق غير اليهود. لفظ «الأمم» كتابي واضح في العربية، مع بيان المقصود في الحاشية منعًا للالتباس السياسي أو الجغرافي.
- source_word: μετάνοιαν
  choice: التَّوْبَةَ
  rationale: «التوبة» المقابل العربي الراسخ والدقيق للتحول الداخلي والرجوع الذي يدل عليه المصطلح، وهو أنسب من العبارة التفسيرية «تغيير الذهن».
- source_word: εἰς ζωὴν
  choice: الَّتِي تُؤَدِّي إِلَى الْحَيَاةِ
  rationale: يحفظ معنى الاتجاه أو النتيجة في εἰς دون حسم زائد بين الغاية والنتيجة.
- source_word: ἔδωκεν
  choice: قَدْ مَنَحَ
  rationale: «منح» يبرز كون التوبة عطية من الله، و«قد» تلائم الفعل الماضي وتُظهر أن الاستنتاج قائم على فعل تحقق.
theological_decisions:
- issue: التوبة بوصفها عطية من الله
  choice: «قَدْ مَنَحَ اللهُ ... التَّوْبَةَ»
  alternative: «أعطى الله» أو صياغة تجعل التوبة مجرد مبادرة بشرية
  rationale: النص اليوناني يجعل الله فاعل ἔδωκεν والتوبة مفعوله، فتحفظ الترجمة ذلك من غير بناء منظومة مذهبية تتجاوز الآية.
- issue: علاقة التوبة بالحياة
  choice: «التَّوْبَةَ الَّتِي تُؤَدِّي إِلَى الْحَيَاةِ»
  alternative: «التوبة للحياة» أو «التوبة إلى الحياة»
  rationale: الصياغة المختارة تنقل القوة الاتجاهية أو النتيجية لعبارة εἰς ζωήν، مع إبقاء قدر من المرونة الدلالية وعدم تحديد آلية العلاقة بما يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة، بصياغة قريبة من بنية الأصل من غير تكلف. استُعملت «الأمم» مع حاشية توضيحية، و«التوبة» بدل التفسير الحرفي الضيق «تغيير الذهن».
