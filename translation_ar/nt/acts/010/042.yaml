  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: ar
  text: وأمرنا أن نعلن للشعب، وأن نشهد شهادةً مؤكدة أن هذا هو الذي عيَّنه الله قاضيًا للأحياء والأموات.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذا هو الذي أقامه الله قاضيًا للأحياء والأموات».'
    reason: بديل معجمي لـὁ ὡρισμένος وκριτής يبرز معنى الإقامة والتعيين للقضاء.
lexical_decisions:
- source_word: παρήγγειλεν
  choice: أوصانا
  rationale: يفيد الفعل تكليفًا ذا سلطة، و«أوصانا» عربية فصيحة طبيعية تحفظ قوة الأمر من غير خشونة زائدة.
- source_word: κηρύξαι
  choice: أن نعلن
  rationale: ينقل معنى الإعلان العلني المقصود بالفعل، من غير قصره على صورة الوعظ الحديثة.
- source_word: τῷ λαῷ
  choice: للشعب
  rationale: يحافظ على أداة التعريف ولا يضيف «إسرائيل»، مع أن السياق قد يدل عليها.
- source_word: διαμαρτύρασθαι
  choice: أن نشهد لهم بكل جدية
  rationale: يجمع بين معنى الشهادة وبين النبرة المؤكدة الجادة التي يحملها الفعل.
- source_word: οὗτός
  choice: هذا
  rationale: يحفظ الإشارة التوكيدية إلى يسوع بصياغة عربية مباشرة.
- source_word: ὁ ὡρισμένος
  choice: الذي عيَّنه
  rationale: يعبّر عن التعيين الإلهي الثابت بلفظ عربي واضح ومعاصر، من غير إيحاءات اصطلاحية زائدة.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: الله
  rationale: جُعل «الله» فاعلًا في تركيب عربي مبني للمعلوم، مع الحفاظ الكامل على كونه صاحب التعيين.
- source_word: κριτὴς
  choice: ديّانًا
  rationale: «ديّان» لفظ عربي راسخ يعبّر بوضوح عن صاحب سلطة القضاء، ويلائم النبرة المهيبة للسياق.
- source_word: ζώντων καὶ νεκρῶν
  choice: للأحياء والأموات
  rationale: يحفظ التقابل الشامل والموجز في الأصل اليوناني.
theological_decisions:
- issue: قوة تعيين يسوع للدينونة من قِبل الله
  choice: هذا هو الذي عيَّنه الله ديّانًا للأحياء والأموات
  alternative: هذا هو الذي حدَّده الله ليكون قاضي الأحياء والأموات
  rationale: تحفظ الصياغة تصريح النص بأن الله عيّن يسوع صاحب سلطان القضاء على الأحياء والأموات، من غير توسيع العبارة إلى صيغ عقائدية لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة جليلة. استُخدم تركيب مبني للمعلوم («عيَّنه الله») لأنه أكثر سلاسة في العربية مع احتفاظه بعلاقة الفاعلية في الأصل، ووُضعت علامة الحاشية [a] في المتن.
