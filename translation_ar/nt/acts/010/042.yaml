  to: وأمرنا أن نعلن للشعب، وأن نشهد شهادةً مؤكدة أن هذا هو الذي عيَّنه الله قاضيًا للأحياء والأموات.[a]
  rationale: تستبدل المراجعة «أوصانا» بـ«أمرنا» لتصوير سلطة التكليف، و«ديّانًا» بـ«قاضيًا» لمطابقة κριτής بلفظ عربي معاصر مباشر، كما تصوغ الشهادة على نحو يحفظ طابع διαμαρτύρασθαι المؤكد. وتبقي «للشعب» دون إضافة هوية غير مصرّح بها في الآية، وتحافظ على الحاشية وموضع مرساها.
