  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: ar
  text: الكلمةَ التي أرسلها إلى بني إسرائيل، مبشِّرًا بالسلام بواسطة يسوع المسيح[a]—هذا هو ربُّ الجميع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: بيسوع الذي هو المسيح؛ فلفظ «المسيح» لقب لا اسم عائلة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «وهو ربُّ الجميع». في اليونانية اسم إشارة توكيدي، حرفيًّا: «هذا هو ربُّ الجميع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: الكلمة
  rationale: المقابل العربي المباشر لـ λόγος، وهو طبيعي في السياق الكتابي هنا ويشير إلى الكلمة أو الرسالة التي أرسلها الله؛ وتُذكر «الرسالة» بديلًا في الحاشية.
- source_word: ὃν ἀπέστειλεν
  choice: التي أرسلها
  rationale: صلة موصول تحافظ على ارتباط الفعل بـ«الكلمة»، وفاعل «أرسل» مفهوم من السياق الأوسع وهو الله.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: إلى بني إسرائيل
  rationale: «بنو إسرائيل» التعبير العربي المألوف والدقيق للاسم الجمعي اليوناني، ولا يقتصر معناه العرفي على الذكور.
- source_word: εὐαγγελιζόμενος
  choice: مبشِّرًا
  rationale: يحفظ معنى إعلان الخبر السار، ويتصل نحويًا بالفاعل المستتر في «أرسل» كما في تركيب اليونانية.
- source_word: εἰρήνην
  choice: بالسلام
  rationale: مقابل مباشر لـ εἰρήνη، ويشمل في السياق معنى المصالحة والخير من غير توسيع تفسيري.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: بيسوع المسيح
  rationale: الباء تعبّر طبيعيًا عن الوساطة، و«المسيح» ترجمة عربية راسخة للقب Χριστός مع احتفاظها بوظيفته اللقبية.
- source_word: οὗτός
  choice: هذا
  rationale: يحفظ قوة اسم الإشارة اليوناني وتوكيده على يسوع بدل تسويته بضمير بسيط.
- source_word: πάντων κύριος
  choice: ربُّ الجميع
  rationale: يحفظ معنى السيادة العامة في κύριος ودلالة πάντων الشاملة بصياغة عربية طبيعية.
theological_decisions:
- issue: ترجمة Χριστοῦ في Ἰησοῦ Χριστοῦ
  choice: المسيح
  alternative: كريستوس
  rationale: «المسيح» هو المقابل العربي التاريخي والدلالي للقب اليوناني، ويحفظ معناه المسياني بدل الاكتفاء بالنقل الصوتي.
- issue: ترجمة κύριος في πάντων κύριος
  choice: ربُّ الجميع
  alternative: سيّد الجميع
  rationale: «الرب» يحفظ ثقل اللقب وسلطانه في هذا القول المتعلق بيسوع، من غير إضافة تفسير يتجاوز النص.
- issue: قوة οὗτός ἐστιν πάντων κύριος
  choice: هذا هو ربُّ الجميع
  alternative: وهو ربُّ الجميع
  rationale: اسم الإشارة «هذا» يصون التوكيد الموجود في οὗτός، مع إبقاء تقرير السيادة الشاملة كما هو.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حوفظ على بنية المقطع غير المستقلة نحويًا لأنه جزء من جملة بدأت في الآية السابقة، وعلى توكيد اسم الإشارة في العبارة الختامية.
