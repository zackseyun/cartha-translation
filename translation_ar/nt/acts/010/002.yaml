lexical_decisions:
- source_word: εὐσεβὴς
  choice: تقيًّا
  rationale: تدل الكلمة على الورع والتعبد الظاهر في السلوك الديني؛ و«تقي» لفظ عربي فصيح وواضح لا يحمل نبرة مهجورة.
- source_word: φοβούμενος τὸν θεὸν
  choice: يخاف الله
  rationale: يحفظ التعبير الفعلي والصيغة الكتابية، مع دلالة الخشية الموقرة لا مجرد الرعب.
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: هو وجميع أهل بيته
  rationale: يشير οἶκος هنا إلى الأسرة أو جماعة البيت، لا إلى المبنى؛ وتوضح الصياغة العربية أن أهل بيته شاركوه مخافة الله.
- source_word: ποιῶν ἐλεημοσύνας πολλὰς
  choice: يقدِّم صدقات كثيرة
  rationale: ἐλεημοσύνη تشير في هذا السياق إلى العطاء للمحتاجين، و«صدقات» أدق وأوجز من تعبير عام مثل «أعمال خيرية».
- source_word: τῷ λαῷ
  choice: للشعب
  rationale: تفيد صيغة المجرور باليونانية جهة الانتفاع، و«للشعب» تنقل ذلك طبيعيًا مع إبقاء الإشارة المحتملة إلى شعب إسرائيل بحسب السياق.
- source_word: δεόμενος τοῦ θεοῦ
  choice: يصلّي إلى الله
  rationale: δέομαι قد تعني يتضرع أو يلتمس؛ وفي وصف حياة كرنيليوس التعبدية تؤدي «يصلّي» المعنى بوضوح من غير تضييق مضمون صلاته.
- source_word: διὰ παντός
  choice: دائمًا
  rationale: يدل التعبير على المواظبة والاستمرار، لا بالضرورة على فعل لا ينقطع لحظة واحدة.
theological_decisions:
- issue: وصف كرنيليوس بأنه ممن يخافون الله
  choice: يخاف الله
  alternative: من خائفي الله / يوقّر الله
  rationale: تحفظ الصياغة الفعلية المباشرة في اليونانية ودلالة الخشية التعبدية، من غير أن تحسم ما إذا كان التعبير لقبًا فنيًا لفئة محددة من الأمم المرتبطين بالمجمع اليهودي.
translation_notes:
  register: لغة عربية فصحى حديثة وواضحة ذات نبرة كتابية رصينة. أُضيفت «كان» لاستقامة التركيب العربي وربط هذا الوصف بكرنيليوس المذكور في الآية السابقة، من غير إضافة مضمون جديد. وُضعت علامتا الحاشيتين بعد العبارتين اللتين تشرحانهما مباشرة.
