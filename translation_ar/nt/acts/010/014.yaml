  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: ar
  text: 'فقال بطرس: «كلا، يا رب، لأنني لم آكل قط شيئًا دنسًا ونجسًا».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: حاشا
  rationale: تعبير عربي فصيح وطبيعي يفيد الرفض القاطع، ويحافظ على قوة الجواب اليوناني.
- source_word: κύριε
  choice: يا رب
  rationale: ينقل صيغة النداء اليونانية مباشرة مع إبقاء هوية المخاطَب كما يفهمها السياق.
- source_word: κοινὸν
  choice: دنسًا
  rationale: في هذا السياق الطقسي يدل على ما عُدَّ غير مقدس أو غير طاهر، و«دنس» تميّزه نسبيًا من ἀκάθαρτον.
- source_word: ἀκάθαρτον
  choice: نجسًا
  rationale: المقابل العربي المألوف لما هو غير طاهر بحسب أحكام الطعام.
- source_word: καὶ
  choice: و
  rationale: حُفظ العطف كما في النص اليوناني المعروض، من غير تحويله إلى «أو».
- source_word: ὅτι
  choice: لأنني
  rationale: يقدّم سبب رفض بطرس، موافقًا للدلالة السببية الطبيعية في السياق.
theological_decisions:
- issue: العلاقة بين «دنسًا» و«نجسًا»
  choice: 'الإبقاء على العطف بالواو: «دنسًا ونجسًا»'
  alternative: «دنسًا أو نجسًا»
  rationale: النص المعروض في SBLGNT يقرأ καὶ، لذا حُفظت صيغة العطف دون تسوية التوتر الدلالي أو استبدالها بقراءة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «حاشا» لقوة الرفض، مع الحفاظ على التمييز اللفظي بين κοινός وἀκάθαρτος.
