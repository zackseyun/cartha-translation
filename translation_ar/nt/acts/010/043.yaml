id: ACT.10.43
reference: Acts 10:43
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: ar
  text: يشهد له جميع الأنبياء[a] بأن كلَّ من يؤمن به ينال باسمه غفران الخطايا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يشهد عنه جميع الأنبياء».'
    reason: بديل لغوي لصلة اسم الإشارة بالفعل μαρτυροῦσιν؛ فالشهادة يمكن أن تُصاغ بالعربية «له» أو «عنه» بحسب إبراز التأييد أو موضوع الشهادة.
lexical_decisions:
- source_word: τούτῳ
  choice: له
  rationale: اسم الإشارة في حالة المجرور/المفعول غير المباشر مرتبط بالفعل «يشهدون». وعبارة «يشهد له» عربية طبيعية تفيد أن شهادة الأنبياء تتعلق بيسوع وتؤيده، مع إثبات البديل «عنه» في الحاشية لصون المجال الدلالي.
- source_word: πάντες οἱ προφῆται
  choice: جميع الأنبياء
  rationale: ترجمة مباشرة تحافظ على شمول العبارة وإشارتها إلى الشهادة النبوية دون حصرها صراحة في عنوان لمدونة بعينها.
- source_word: μαρτυροῦσιν
  choice: يشهد
  rationale: الفعل «يشهد» واضح وفصيح ويحفظ القوة الإثباتية للفعل اليوناني. جاء مفردًا قبل الفاعل الجمع وفق الاستعمال العربي المعياري.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: غفران الخطايا
  rationale: تعبير عربي كتابي واضح ينقل معنى الصفح عن الخطايا، وهو أنسب هنا من تعبيرات قد توحي بمجرد التحرر منها.
- source_word: λαβεῖν
  choice: ينال
  rationale: «ينال» يؤدي معنى التلقي الوارد في المصدر اليوناني، وصيغة المضارع تلائم الحكم العام المتعلق بكل مؤمن.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: باسمه
  rationale: تحفظ العبارة الإيجاز والصورة الكتابية التي تجعل اسمه وسيلة نوال الغفران، من غير إضافة تفسير صريح مثل «بسلطان اسمه».
- source_word: πάντα τὸν πιστεύοντα
  choice: كلَّ من يؤمن
  rationale: صياغة عربية طبيعية تنقل الشمول التوزيعي للتركيب اليوناني، ولا تجعل صيغة المذكر النحوية مقصورة على الرجال.
- source_word: εἰς αὐτόν
  choice: به
  rationale: مع فعل الإيمان، تنقل الباء العربية بصورة طبيعية معنى توجيه الإيمان والثقة إلى شخصه، دون الترجمة المكانية الحرفية لحرف الجر اليوناني.
theological_decisions:
- issue: نطاق الغفران وصلته بالإيمان
  choice: ينال كل من يؤمن بيسوع غفران الخطايا باسمه
  alternative: توسيع العبارة بشرح مذهبي لآلية الخلاص أو لطبيعة الإيمان
  rationale: تحافظ الصياغة على الروابط التي يصرح بها النص بين يسوع والإيمان واسمه وغفران الخطايا، من غير إدخال تفصيل عقائدي زائد.
- issue: دلالة اسم يسوع
  choice: باسمه
  alternative: بسلطان اسمه أو بفضل شخصه وسلطانه
  rationale: أُبقي التعبير الكتابي موجزًا، لأنه قد يجمع دلالات الشخص والسلطان والوساطة، ولا ينبغي حصره في تفسير واحد داخل المتن.
- issue: صيغة اسم الفاعل المذكر المفرد
  choice: كل من يؤمن
  alternative: كل رجل يؤمن
  rationale: الصيغة اليونانية عامة توزيعية وليست حصرًا جنسيًا؛ و«كل من» تنقل هذا العموم بدقة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حوفظ على الإيجاز الكتابي في «باسمه»، وعلى تركيب عربي طبيعي في «كل من يؤمن به». وُضعت علامة الحاشية مباشرة بعد العبارة التي تتناولها.
