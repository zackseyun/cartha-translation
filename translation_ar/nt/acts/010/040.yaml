lexical_decisions:
- source_word: τοῦτον
  choice: هذا
  rationale: يحافظ اسم الإشارة المتقدّم على التوكيد في اليونانية، ويربط الكلام بيسوع المذكور قبله، من غير تحويله إلى ضمير عادي.
- source_word: ὁ θεὸς
  choice: الله
  rationale: هو الفاعل الصريح في الجملة، وهذه هي الصياغة العربية الطبيعية.
- source_word: ἤγειρεν
  choice: أقامه
  rationale: «أقام» تعبير عربي واضح ومألوف عن الإقامة من الموت، ويحفظ كون الله فاعل القيامة.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: في اليوم الثالث
  rationale: ينقل دلالة ظرف الزمان من غير زيادة تحدد طريقة حساب الأيام.
- source_word: ἔδωκεν
  choice: أتاح له
  rationale: ينقل معنى الإعطاء أو الإذن المصاحب للمصدر بصياغة عربية طبيعية نسبيًا، مع تجنب المبالغة في حسمه إلى سببية صريحة.
- source_word: αὐτὸν
  choice: له
  rationale: يعود الضمير على يسوع، وقد صيغ مع «أتاح» بما يلائم التركيب العربي.
- source_word: ἐμφανῆ
  choice: ظاهرًا
  rationale: يحفظ معنى المرئية أو الظهور للعيان دون تحديد الأشخاص الذين ظهر لهم، إذ يأتي ذلك في السياق اللاحق.
- source_word: γενέσθαι
  choice: أن يصير
  rationale: يحافظ على دلالة الصيرورة في γίνομαι بدل اختزالها إلى مجرد «يكون» أو دمجها كليًا في فعل «ظهر».
theological_decisions:
- issue: صياغة القيامة
  choice: هذا أقامه الله في اليوم الثالث
  alternative: أقامه الله في اليوم الثالث
  rationale: يحفظ النص فعل الله الصريح، كما يحفظ التوكيد الذي في اسم الإشارة المتقدّم من غير إضافة تفسير عقائدي.
- issue: الظهور بعد القيامة
  choice: وأتاح له أن يصير ظاهرًا
  alternative: وجعله يظهر
  rationale: تحافظ الصياغة المختارة قدر الإمكان على عناصر الإعطاء والصيرورة والظهور في الأصل، ولا تذيب التمييز بين الإقامة من الموت وبين صيرورته ظاهرًا بعد ذلك. وتبيّن الحاشية البديل العربي الأكثر سلاسة.
translation_notes:
  register: صياغة عربية فصحى واضحة ووقورة. قُدّم «هذا» كما في اليونانية للمحافظة على التوكيد، واستُخدمت عبارة قريبة من بنية الأصل في الشطر الثاني مع حاشية تعرض البدائل الأكثر سلاسة. أُبقيت الفاصلة الختامية لأن الجملة تتصل بما يليها في السياق.
