  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الفضاء مفتوحًا». فاللفظة اليونانية قد تشير إلى السماء بوصفها الفضاء العلوي أو إلى السماء في معناها الديني، والسياق رؤيوي.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من زواياه الأربع». فاللفظة اليونانية تعني الأطراف أو النهايات، وقد تُفهم هنا على أنها زوايا الملاءة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: يرى
  rationale: فعل مضارع سردي يفيد المعاينة المباشرة، و«يرى» أوضح وأطبع في العربية المعاصرة من ألفاظ أفخم مثل «يعاين».
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: السماء مفتوحةً
  rationale: «السماء» تحتمل في العربية، كما في اليونانية، الفضاء العلوي والمقام السماوي، ويلائم السياق الرؤيوي إبقاء هذا الاتساع الدلالي. وصيغ اسم المفعول «مفتوحة» تنقل حال السماء.
- source_word: καταβαῖνον
  choice: ينزل
  rationale: ينقل اسم الفاعل المضارع حركة الشيء المستمرة إلى أسفل بلغة عربية طبيعية.
- source_word: σκεῦός τι
  choice: شيئًا
  rationale: لفظة σκεῦος واسعة الدلالة، وτι تجعلها نكرة؛ لذلك يحفظ «شيئًا» عدم التحديد من غير افتراض أنه وعاء أو أداة بعينها.
- source_word: ὡς ὀθόνην μεγάλην
  choice: كأنّه ملاءة كبيرة
  rationale: تنقل «كأنّه» معنى التشبيه، و«ملاءة كبيرة» تعبير واضح عن قطعة قماش كبيرة من غير تحديد مادتها.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: من أطرافه الأربعة
  rationale: ἀρχή هنا تعني النهايات أو الأطراف. اختير «الأطراف» لأنه يحفظ إمكان معنى «الزوايا» دون الجزم بأن الشكل مربع.
- source_word: καθιέμενον
  choice: وقد أُرخي
  rationale: الصيغة المبنية للمجهول تدل على أن الشيء يُنزَّل أو يُرسل إلى أسفل من غير تسمية الفاعل؛ و«أُرخي» تلائم قطعة قماش ممسوكة من أطرافها.
- source_word: ἐπὶ τῆς γῆς
  choice: إلى الأرض
  rationale: مع حركة النزول تدل ἐπί على الاتجاه نحو الأرض أو بلوغها، و«إلى الأرض» تحافظ على هذا الاتجاه.
theological_decisions:
- issue: دلالة οὐρανός في سياق رؤيوي
  choice: السماء
  alternative: السماء العليا / الفضاء
  rationale: «السماء» هي المقابل العربي الطبيعي الذي يمكن أن يدل على السماء المرئية أو المقام السماوي، فيحفظ الغموض الأصيل ولا يحصر المشهد في ظاهرة جوية ولا يضيف تحديدًا عقائديًا.
- issue: الفاعل الضمني في καθιέμενον
  choice: 'البناء للمجهول: «أُرخي»'
  alternative: «أنزله الله»
  rationale: النص اليوناني لا يسمّي من يُرخي الشيء، لذلك يحافظ البناء للمجهول على صياغته ولا يصرّح بما تركه النص ضمنيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ المضارع السردي في «يرى» و«ينزل»، وبقي الشيء غير محدد كما في الأصل، مع تجنب تسمية الفاعل الذي يُرخي الشيء.
