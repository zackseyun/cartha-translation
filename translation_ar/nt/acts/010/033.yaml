base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: ar
  text: فأرسلتُ في طلبك في الحال[a]، وقد أحسنتَ إذ جئتَ. والآن، ها نحن جميعًا حاضرون أمام الله لنسمع كلَّ ما أمرك به الرب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فورًا» أو «من دون إبطاء».'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «الرب». يُرجَّح في السياق أن المقصود هو يسوع، بينما يفهمه بعضهم على أنه الله بوجه أعم.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: في الحال
  rationale: تعبير عربي فصيح وطبيعي يفيد المبادرة الفورية ويحفظ معنى الظرف اليوناني.
- source_word: οὖν
  choice: فـ / والآن
  rationale: 'نُقل بحسب وظيفته في السياق: الفاء للاستنتاج والاستمرار في الجملة الأولى، و«والآن» للانتقال إلى غرض الاجتماع.'
- source_word: ἔπεμψα πρὸς σέ
  choice: أرسلتُ إليك
  rationale: يحفظ الصياغة اليونانية، ويفهم من السياق أن كرنيليوس أرسل رجالًا لاستدعاء بطرس.
- source_word: σύ τε καλῶς ἐποίησας
  choice: وقد أحسنتَ
  rationale: صياغة عربية مألوفة تنقل تعبير الاستحسان مع إبراز فعل بطرس المقابل لإرسال كرنيليوس.
- source_word: παραγενόμενος
  choice: إذ جئتَ
  rationale: ينقل اسم الفاعل الظرفي بوصفه الفعل الذي استحق الاستحسان، بلغة عربية طبيعية.
- source_word: πάντες ἡμεῖς
  choice: نحن جميعًا
  rationale: يحفظ توكيد الجماعة في النص اليوناني.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: أمام الله
  rationale: تعبير موجز يحفظ معنى الوجود الواعي في حضرة الله.
- source_word: πάρεσμεν
  choice: حاضرون
  rationale: مقابل مباشر للفعل الدال على الحضور، وهو ملائم للمقام الرسمي المهيب.
- source_word: ἀκοῦσαι
  choice: لنسمع
  rationale: اللام توضح دلالة الغرض التي يؤديها المصدر اليوناني.
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: كلَّ ما أمرك به
  rationale: تنقل الشمول والقوة السلطانية للفعل، وتؤدي المبني للمجهول اليوناني بصيغة عربية طبيعية مع بقاء الآمر مذكورًا في شبه الجملة التالية.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: يحفظ اللفظ اليوناني من غير إضافة اسم يسوع أو استبداله بالله، وبذلك يصون الاحتمال السياقي.
theological_decisions:
- issue: مرجع «الرب» (τοῦ κυρίου)
  choice: الرب
  alternative: الله، أو الرب يسوع بتوسيع تفسيري
  rationale: النص اليوناني يقول «الرب» فقط. قد يشير السياق إلى يسوع، وقد يُفهم على أنه الله بصورة أعم؛ لذلك أبقت الترجمة اللقب كما هو ولم تحسم المرجع داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع تركيب طبيعي يحفظ التتابع الخطابي والتوكيد الجماعي والغموض المقصود في لقب «الرب».
