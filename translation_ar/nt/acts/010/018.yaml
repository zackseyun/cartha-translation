  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. حُوِّل مضمون الاستفسار إلى سؤال مقتبس مباشر لأنه أكثر سلاسة في العربية، مع بقاء المعنى دون حسم زائد. وُضع رمز الحاشية بعد العبارة التي يشرحها، أي فعل الإقامة بصفة ضيف.
