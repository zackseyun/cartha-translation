  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: ar
  text: ونادوا وسألوا عمّا إذا كان سمعان، الذي يُدعى بطرس، نازلًا هنا ضيفًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يقيم هنا» أو «يُستضاف هنا». يدل الفعل اليوناني على الإقامة عند شخص بصفة ضيف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: ونادوا
  rationale: ينقل معنى رفع الصوت لمن في البيت، ويؤدي وظيفة اسم الفاعل السابق للفعل بصياغة عربية سردية طبيعية.
- source_word: ἐπυνθάνοντο
  choice: وسألوا
  rationale: صياغة واضحة وطبيعية لفعل الاستفسار؛ ولا يقتضي السياق إبراز دلالة الاستمرار في صيغة الماضي الناقص اليونانية.
- source_word: εἰ
  choice: هل
  rationale: تدخل «هل» على مضمون السؤال غير المباشر، ومع علامات الاقتباس يمكن عرضه في العربية سؤالًا مباشرًا طبيعيًا من غير تغيير معناه.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: سمعان الذي يُدعى بطرس
  rationale: يحفظ الاسمين والعلاقة التعريفية بينهما، كما يحافظ على دلالة المبني للمجهول في اسم الفاعل اليوناني.
- source_word: ἐνθάδε
  choice: هنا
  rationale: المقابل العربي المباشر والطبيعي للدلالة المكانية.
- source_word: ξενίζεται
  choice: يقيم هنا ضيفًا
  rationale: يعبّر بوضوح عن الإقامة في منزل شخص آخر بصفة ضيف، ويحفظ إيحاء الضيافة الكامن في الفعل اليوناني بدل الاكتفاء بلفظ عام مثل «يمكث».
theological_decisions: []
