  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: ar
  text: والآن أرسِل رجالًا إلى يافا، واطلب سمعانَ، رجلًا يُدعى بطرس.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأرسل في طلب سمعان، المعروف ببطرس».'
    reason: بديل لغوي لـ«اطلب» و«يُدعى»، مع الحفاظ على أن الشخص المقصود هو سمعان.
lexical_decisions:
- source_word: καὶ νῦν
  choice: والآن
  rationale: تحفظ الواو صلة الكلام بما قبله، وتؤدي νῦν بوصفها إشارة زمنية وخطابية.
- source_word: πέμψον
  choice: أرسِل
  rationale: فعل أمر مباشر للمفرد، وهذه الصياغة هي الأفصح والأوضح في العربية المعاصرة.
- source_word: ἄνδρας
  choice: رجالًا
  rationale: ينص الأصل على جمع ἀνήρ، أي رجال، لا على لفظ عام بمعنى أشخاص أو على وصف تفسيري بمعنى رسل.
- source_word: εἰς Ἰόππην
  choice: إلى يافا
  rationale: تؤدي الاستعمال الاتجاهي لحرف الجر مع اسم المكان بصياغة عربية طبيعية.
- source_word: μετάπεμψαι
  choice: استدعِ
  rationale: ينقل معنى إرسال من يطلب حضور الشخص، من غير أن يوحي بإكراهه على المجيء.
- source_word: Σίμωνά τινα
  choice: سمعانَ، وهو رجلٌ
  rationale: يؤدي τινα الذي يقدّم شخصًا محددًا لم يُعرَّف بعد، مع تجنب عبارة «سمعانًا ما» غير الطبيعية في العربية.
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: يُدعى بطرس
  rationale: صياغة عربية واضحة تدل على الاسم الذي يُسمّى به سمعان، وتحافظ على المبني للمجهول في المعنى.
