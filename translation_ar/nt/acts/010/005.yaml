  verdict: revise
  source_fidelity: 'المعنى العام منقول بدقة: الأمر بإرسال رجال إلى يافا واستدعاء سمعان الملقب بطرس. لكن «وهو رجل» لا يؤدي τινα على نحو سليم؛ إذ إن τις هنا مع «سمعان» يفيد «شخصًا/رجلًا يُدعى سمعان» بوصفه غير معروف للمخاطَب، لا جملة استئنافية تصف سمعان بأنه رجل.'
  naturalness: النص الحالي مفهوم وفصيح إجمالًا، لكن «استدعِ سمعانَ، وهو رجلٌ يُدعى بطرس» تركيب غير طبيعي وقد يوهم بأن «بطرس» وصف أو لقب لرجل آخر. الصياغة «واطلب سمعانَ، رجلًا يُدعى بطرس» سليمة وطبيعية وتحافظ على البنية.
  terminology: «يافا»، و«سمعان»، و«بطرس» صيغ كتابية عربية مستقرة ومناسبة. «اطلب» هنا أدق وألطف من «استدعِ» لـμετάπεμψαι، إذ يدل على إرسال من يستحضره دون إيحاء قوي بأمرٍ قسري.
  issues:
  - severity: medium
    issue: موضع ودلالة «وهو رجل»
    rationale: يفصل التعبير العربي بين «سمعان» و«رجل» بجملة اعتراضية، بينما يربط الأصل τις بسمعان بوصفه شخصًا مجهولًا للمخاطَب. كما أن التركيب الحالي يجعل «يُدعى بطرس» أقرب نحويًا إلى «رجل» لا إلى سمعان.
  - severity: low
    issue: اختيار «استدعِ» لـμετάπεμψαι
    rationale: «استدعِ» ممكن، لكنه قد يحمل في العربية المعاصرة إيحاءً سلطويًا أقوى من فعل «أرسل في طلبه». «اطلب» يعبّر بوضوح عن المقصود في السياق.
  - severity: low
    issue: الحاشية تتجاوز البديل المعجمي في «المعروف ببطرس»
    rationale: البديل مقبول، لكن إعادة صياغة الجملة بحيث تعكس «رجلًا يُدعى بطرس» أدق في بيان موضع τις وصلته بسمعان.
