lexical_decisions:
- source_word: συνομιλῶν
  choice: بينما كان يتحدث
  rationale: اسم فاعل مضارع يدل على فعل جارٍ متزامن مع الدخول؛ وهذه صياغة عربية طبيعية تحفظ معنى الحديث المتواصل.
- source_word: αὐτῷ
  choice: معه
  rationale: حرف الجر «مع» ينقل معنى المشاركة في الحديث الذي تفيده صيغة الداتيف مع συνομιλέω.
- source_word: εἰσῆλθεν
  choice: دخل
  rationale: فعل ماضٍ بسيط ينقل الحدث الرئيس التالي بوضوح وإيجاز.
- source_word: εὑρίσκει
  choice: فوجد
  rationale: ورد الفعل في اليونانية بالمضارع التاريخي لإضفاء الحيوية، لكن الماضي أنسب للسرد العربي المتصل.
- source_word: συνεληλυθότας
  choice: مجتمعين
  rationale: اسم الفاعل التام يصف القوم في حالة ناتجة عن اجتماع سابق؛ و«مجتمعين» تؤدي هذه الحالة طبيعيًا.
- source_word: πολλούς
  choice: كثيرين
  rationale: الصفة مستعملة استعمال الاسم وتشير إلى أشخاص كثيرين، ويُفهم الموصوف من السياق دون حاجة إلى إضافته.
