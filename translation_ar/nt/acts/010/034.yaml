lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: فتح ... فاه
  rationale: يحافظ على الصورة التعبيرية اليونانية وعلى نبرة الاستهلال الرسمي، وهو تعبير عربي فصيح واضح.
- source_word: δὲ
  choice: فـ
  rationale: تفيد الانتقال والتتابع في السياق السردي بصورة طبيعية موجزة.
- source_word: Ἐπ’ ἀληθείας
  choice: بالحق
  rationale: تنقل توكيد العبارة اليونانية بلفظ عربي فصيح ومفهوم، مع إبقاء صلتها بما أدركه بطرس.
- source_word: καταλαμβάνομαι
  choice: أُدرك
  rationale: الفعل هنا يدل على التوصل إلى فهم أو تبين الأمر؛ و«أُدرك» يحفظ معنى الاستيعاب والتحقق من غير إضافة «الآن» غير الصريحة في الأصل.
- source_word: προσωπολήμπτης
  choice: يُحابي أحدًا
  rationale: الاسم اليوناني يدل على من يعامل الناس بتحيز أو محاباة بناءً على الوجوه أو المكانة. الصياغة الفعلية طبيعية في العربية وتنقل المقصود بوضوح.
- source_word: ὁ θεός
  choice: الله
  rationale: المقابل العربي المعياري لـ θεός في هذا السياق.
theological_decisions:
- issue: صياغة عدم محاباة الله دون تضييق المعنى لاهوتيًا
  choice: الله لا يُحابي أحدًا
  alternative: الله ليس مُحابيًا للوجوه
  rationale: تنقل الصياغة أن الله لا يعامل الأشخاص بتحيز، بما يلائم سياق قبول أناس من كل أمة، من غير إدخال تحديد مذهبي لاحق أو حصر نطاق القول.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. أُبقيت صورة «فتح فاه» لما لها من ثقل بلاغي في الأصل، واستُخدمت «لا يحابي أحدًا» لتوضيح الاصطلاح اليوناني طبيعيًا. وُضع مؤشر الحاشية [a] في المتن كما يلزم.
