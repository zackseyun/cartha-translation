  source_fidelity: 'النص الرئيس أمين للأصل اليوناني: يحفظ الاستفهام الإنكاري المتوقع جوابه بالنفي، و«الماء» المعرّف، وفكرة منع معمودية هؤلاء، وسبق نوالهم الروح القدس، والمقارنة بـ«نحن أيضًا». واستعمال «وقد نالوا» ينقل بصورة مناسبة البعد الوصفي ذي القوة الحُجّية في οἵτινες من غير جعله تعليلًا صريحًا أقوى من الأصل.'
  naturalness: الصياغة الرئيسة فصيحة واضحة ومناسبة للسجل الوقور. غير أن نص الحاشية يتضمن خللًا نحويًا في «أيمكن أحدًا»، ويحتاج إلى تصحيح.
  terminology: «الروح القدس» و«يعتمد» مصطلحان عربيان كتابيان معياريان. و«لئلا يعتمد هؤلاء» استعمال عربي كتابي طبيعي للمعمودية، وإن كان الفعل اليوناني مبنيًا للمجهول.
  issues:
