  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: ar
  text: «أَيَسْتَطِيعُ أَحَدٌ أَنْ يَمْنَعَ الْمَاءَ لِئَلَّا يَعْتَمِدَ هَؤُلَاءِ، وَقَدْ نَالُوا الرُّوحَ الْقُدُسَ كَمَا نِلْنَاهُ نَحْنُ أَيْضًا؟»[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيمكن لأحد أن يمنع الماء، فيحول دون أن يعتمد هؤلاء، وهم قد نالوا الروح القدس كما نلناه نحن أيضًا؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μήτι
  choice: أَيَسْتَطِيعُ أَحَدٌ...؟
  rationale: تُصاغ أداة الاستفهام هنا سؤالًا إنكاريًا يتوقع جوابًا بالنفي، وهو أسلوب عربي طبيعي يحفظ قوة العبارة.
- source_word: τὸ ὕδωρ
  choice: الْمَاءَ
  rationale: أُبقي التعريف لأن اليونانية تشير إلى الماء المقصود للمعمودية في هذا السياق.
- source_word: δύναται κωλῦσαί τις
  choice: يَسْتَطِيعُ أَحَدٌ أَنْ يَمْنَعَ
  rationale: يحفظ معنى القدرة على المنع أو العرقلة، مع بقاء السؤال الإنكاري مفتوح الصياغة ومتوقع الجواب بالنفي.
- source_word: τοῦ μὴ βαπτισθῆναι
  choice: لِئَلَّا يَعْتَمِدَ هَؤُلَاءِ
  rationale: ينقل تركيب المنع المتعلق بعدم وقوع المعمودية، بصياغة عربية واضحة؛ وبُني الفعل للمعلوم استعمالًا عربيًا طبيعيًا من غير تغيير المرجع.
- source_word: τούτους
  choice: هَؤُلَاءِ
  rationale: اسم إشارة طبيعي للأشخاص الحاضرين، ولا يضيف تحديدًا جنسيًا لا يصرح به السياق.
- source_word: οἵτινες
  choice: وَقَدْ نَالُوا
  rationale: ينقل وصف الجماعة مع إبراز القيمة التعليلية السياقية دون تحويلها إلى تعليل صريح أقوى من النص.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الرُّوحَ الْقُدُسَ
  rationale: المقابل العربي المعياري الواضح للعبارة اليونانية.
- source_word: ἔλαβον
  choice: نَالُوا
  rationale: يفيد حدثًا تمّ قبل الحجة الحاضرة وتظل نتيجته ذات صلة بها.
- source_word: ὡς καὶ ἡμεῖς
  choice: كَمَا نِلْنَاهُ نَحْنُ أَيْضًا
  rationale: يحفظ المقارنة الصريحة والتوكيد الواردين في اليونانية، مع إظهار مفعول الفعل المحذوف المفهوم من السياق في العربية.
theological_decisions:
- issue: علاقة نوال الروح القدس بالمعمودية بالماء
  choice: تُظهر الصياغة أن هؤلاء نالوا الروح القدس بالفعل، وأن هذا هو أساس الاعتراض على منع معموديتهم بالماء.
  alternative: صياغة تطمس سبق نوال الروح القدس للمعمودية في تسلسل الرواية.
  rationale: يحفظ النص ترتيب الحجة السردية كما في اليونانية، من غير فرض إطار مذهبي بشأن العلاقة العامة بين الروح والمعمودية.
- issue: القيمة الدلالية للموصول οἵτινες
  choice: «وقد نالوا» بوصفٍ يحمل في السياق مسوّغ السؤال.
  alternative: «لأنهم نالوا» بتعليل صريح، أو «الذين نالوا» بموصول وصفي محض.
  rationale: الصياغة المختارة تحفظ التداخل بين الوصف والتعليل ولا تحسمه أكثر مما يحسمه الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ السؤال الإنكاري في جملة واحدة وفق بنية الأصل، واستُعمل «يمنع الماء» مع حاشية تبين البدائل الممكنة في فهم κωλύω وتركيب المصدر المنفي.
