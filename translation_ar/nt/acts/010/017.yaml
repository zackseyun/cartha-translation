  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: ar
  text: وبينما كان بطرس متحيّرًا في نفسه في شأن ما عسى أن تعنيه الرؤيا التي رآها[a]، إذا بالرجال الذين أرسلهم كرنيليوس، بعد أن استفسروا عن بيت سمعان، يقفون عند البوابة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما عسى أن تكون الرؤيا التي رآها». هذه صياغة أقرب إلى اللفظ اليوناني؛ وقد يُفهم السؤال في السياق عن معنى الرؤيا أو مغزاها.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عند المدخل». يمكن أن تشير الكلمة اليونانية إلى بوابة البيت أو منطقة المدخل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: وبينما
  rationale: تفيد الإطار الزمني مع استمرار السرد، وصياغة «وبينما» طبيعية وواضحة في العربية.
- source_word: ἐν ἑαυτῷ διηπόρει
  choice: كان بطرس في حيرة في نفسه
  rationale: تحفظ معنى الحيرة المستمرة والتفكير الباطني الذي يدل عليه الفعل في صيغة الماضي الناقص مع العبارة الظرفية.
- source_word: τί ἂν εἴη
  choice: ما عسى أن تكون دلالة
  rationale: ينقل السياقُ السؤالَ من مجرد ماهية الرؤيا إلى دلالتها، مع إبقاء الاحتمال الذي تفيده الصيغة اليونانية؛ وتُذكر القراءة الأقرب حرفيًا في الحاشية.
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: الرؤيا التي رآها
  rationale: ترجمة مباشرة وطبيعية للتركيب الموصول.
- source_word: ἰδοὺ
  choice: إذا بـ
  rationale: أداة سرد عربية حية تشير إلى تطور مفاجئ أو لافت، وتؤدي وظيفة ἰδοὺ دون استعمال لفظ عتيق.
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: الرجال الذين أرسلهم كرنيليوس
  rationale: تحفظ هوية الرجال وعلاقة الإرسال بكرنيليوس بصياغة عربية طبيعية؛ المبني للمعلوم هنا لا يغير جهة الفعل.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: قد سألوا عن بيت سمعان
  rationale: يفيد أنهم استعلموا عن موضع البيت قبل وقوفهم عند مدخله، وهو معنى مناسب للسياق وتسلسل اسم الفاعل السابق للفعل الرئيس.
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: ثم وقفوا عند المدخل
  rationale: «وقفوا» يحفظ صورة اتخاذهم موضعًا عند الوصول، و«المدخل» يؤدي معنى πυλών بوصفه بوابة البيت أو منطقة دخوله.
theological_decisions:
- issue: هل يصف τί ἂν εἴη ماهية الرؤيا أم معناها؟
  choice: دلالة الرؤيا
  alternative: ما عسى أن تكون الرؤيا
  rationale: السياق يرجح أن بطرس كان يحاول فهم مغزى الرؤيا، لكن الاحتمال الحرفي المتعلق بماهيتها محفوظ في الحاشية منعًا لحسم الغموض دون تنبيه.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «إذا بـ» بدل «هوذا» لتأدية حيوية الانتقال السردي بلغة طبيعية، وحُفظت بدائل النص اليوناني ذات الدلالة في الحواشي.
