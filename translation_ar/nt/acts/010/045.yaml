  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: ar
  text: واندهش جميع المؤمنين من أهل الختان[a] الذين جاؤوا مع بطرس، لأن موهبة الروح القدس قد أُفيضت[c] حتى على غير اليهود[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «المؤمنون المختونون». وحرفيًا: «المؤمنون من الختان».'
    reason: lexical_alternative
  - marker: b
    text: 'أو «أيضًا على غير اليهود»؛ يمكن للأداة اليونانية أن تفيد مجرد الإضافة، لكنها هنا على الأرجح تبرز المفاجأة: «حتى على غير اليهود».'
    reason: lexical_alternative
  - marker: c
    text: الفعل اليوناني بصيغة التام، وهي تعرض الإفاضة بوصفها فعلًا تم وبقيت نتيجته قائمة.
    reason: aspectual_clarification
lexical_decisions:
- source_word: ἐξέστησαν
  choice: دُهِش
  rationale: ينقل شدة التعجب التي يدل عليها الفعل في هذا السياق، بصياغة عربية واضحة وموجزة.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: المؤمنون من أهل الختان
  rationale: يحفظ تعبير الانتماء الجماعي في اليونانية، ويبيّن أن المقصود مؤمنون يهود يُعرَفون بالختان، من غير اختزاله إلى مجرد وصف جسدي.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: كلُّ الذين جاءوا مع بطرس
  rationale: يحفظ معنى الشمول في ὅσοι ومعنى المصاحبة في الفعل مع المجرور.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: حتى على غير اليهود
  rationale: يحدد المرجع السياقي لكلمة ἔθνη في أعمال 10، وينقل بـ«حتى» دلالة الإضافة المصحوبة بالمفاجأة.
- source_word: ἡ δωρεὰ
  choice: موهبة
  rationale: لفظ عربي طبيعي للهبة الممنوحة مجانًا، ويتلاءم مع اقترانه بالروح القدس.
- source_word: τοῦ ἁγίου πνεύματος
  choice: الروح القدس
  rationale: الصياغة العربية المعاصرة المألوفة والدقيقة للعبارة اليونانية.
- source_word: ἐκκέχυται
  choice: قد أُفيضت
  rationale: المبني للمجهول يحفظ صيغة الأصل، و«قد» مع الماضي يصور الفعل منجزًا مع بقاء نتيجته ظاهرة في سياق السرد.
theological_decisions:
- issue: مدلول ἔθνη في سياق دخول غير اليهود إلى جماعة المؤمنين
  choice: غير اليهود
  alternative: الأمم
  rationale: المقابلة في أعمال 10 هي بين المؤمنين من أهل الختان والذين ليسوا يهودًا؛ لذلك يوضح «غير اليهود» المقصود السياقي من غير تحميل اللفظ معنى مذهبيًا زائدًا.
- issue: دلالة صيغة التام في ἐκκέχυται
  choice: قد أُفيضت
  alternative: أُفيضت
  rationale: تحافظ الصياغة على كون الإفاضة فعلًا قد تم وعلى أن أثره قائم وملحوظ، من غير تحويل ذلك إلى تقرير لاهوتي يتجاوز الدلالة النحوية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أهل الختان» للمحافظة على هوية الجماعة في التعبير اليوناني، و«غير اليهود» لرفع الالتباس المحتمل في «الأمم»، مع إبقاء البدائل والدلالة الصرفية في الحواشي.
