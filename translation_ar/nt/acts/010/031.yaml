lexical_decisions:
- source_word: φησί
  choice: وقال
  rationale: الفعل في اليونانية مضارع تاريخي، لكن الماضي هو الأسلوب الطبيعي الواضح في السرد العربي هنا.
- source_word: Κορνήλιε
  choice: يا كرنيليوس
  rationale: نُقل الاسم وفق الصيغة العربية الشائعة، وأُظهرت صيغة النداء اليونانية بأداة النداء العربية.
- source_word: εἰσηκούσθη
  choice: قد سُمعت
  rationale: يحافظ البناء للمجهول على صيغة الأصل، وتفيد «قد» تحقق السماع من غير تحويله صراحةً إلى «استُجيبت» بما قد يزيد على دلالة اللفظ.
- source_word: ἡ προσευχὴ
  choice: صلاتك
  rationale: ترجمة مباشرة للاسم المفرد مع ضمير المخاطب، وهي طبيعية في العربية الفصحى المعاصرة.
- source_word: αἱ ἐλεημοσύναι
  choice: صدقاتك
  rationale: «الصدقات» لفظ عربي موجز ومألوف للعطاء الرحوم للمحتاجين، ويحافظ على صيغة الجمع في الأصل.
- source_word: ἐμνήσθησαν
  choice: ذُكرت
  rationale: يحافظ البناء للمجهول على تعبير التذكّر الكتابي من غير اختزاله إلى مجرد الملاحظة أو إقحام تصور عن الاستحقاق.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: أمام الله
  rationale: ترجمة عربية طبيعية ومباشرة تفيد الحضور والاعتبار لدى الله.
theological_decisions:
- issue: دلالة صدقات كرنيليوس
  choice: صدقاتك
  alternative: أعمال رحمتك؛ عطاياك للمحتاجين
  rationale: ينقل النص معنى العطاء الرحوم الملموس، لكنه لا يقرر في هذه الآية وحدها مذهبًا في الاستحقاق أو الخلاص.
- issue: لغة التذكّر الإلهي
  choice: ذُكرت صدقاتك أمام الله
  alternative: لاحظ الله صدقاتك؛ أخذ الله صدقاتك في الحسبان
  rationale: الإبقاء على لغة الذكر يصون ثقل التعبير الكتابي وغموضه العلائقي، من غير تفسير آليته أو نتائجه بما يتجاوز النص.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم الماضي للسرد الطبيعي، وحُفظ البناء للمجهول في فعلي السماع والذكر، ووُضع مؤشر الحاشية بعد اللفظ الذي تشرحه مباشرةً.
