  source_fidelity: المسودة تنقل معنى الإقامة ضيفًا عند سمعان ومعنى الدبّاغ وقرب البيت من البحر. لكن حذف دلالة τις («رجل/شخص يُدعى») ليس لازمًا في العربية، كما أن «بيته بجانب البحر» بعد البدل المفصول بفواصل تركيب غير مكتمل الوصل ولا يبيّن العلاقة النسبية بوضوح.
