  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: ar
  text: إنه ينزل ضيفًا عند رجلٍ يُدعى سمعان، وهو دبّاغ، وله بيت بجانب البحر.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: وهو
  rationale: يعود اسم الإشارة إلى بطرس في السياق، والضمير العربي هو الأسلوب الطبيعي مع الحفاظ على الإحالة.
- source_word: ξενίζεται
  choice: نازلٌ ضيفًا
  rationale: ينقل معنى الإقامة عند شخص بصفة ضيف، وهو أدق من مجرد «يقيم» وأفصح في العربية المعاصرة.
- source_word: παρά τινι Σίμωνι
  choice: عند سمعانَ
  rationale: تفيد παρά مع المجرور الإقامة لدى شخص. لم تُترجم τις بلفظ مستقل لأن العربية لا تستعمل نظير «شخص معيّن» طبيعيًا قبل الاسم هنا، ونكرة الوصف اللاحق تحفظ عدم التعريف المقصود.
- source_word: βυρσεῖ
  choice: رجلٍ دبّاغٍ
  rationale: يدل اللفظ تحديدًا على من يدبغ الجلود. أضيفت «رجل» لتتضح علاقة البدل بسمعان في تركيب عربي طبيعي.
- source_word: ᾧ ἐστιν οἰκία
  choice: بيته
  rationale: صياغة عربية موجزة وطبيعية تؤدي معنى «الذي له بيت» من غير زيادة دلالية.
- source_word: παρὰ θάλασσαν
  choice: بجانب البحر
  rationale: تفيد العبارة القرب المكاني من البحر؛ و«بجانب البحر» واضحة وتحافظ على قوة معنى المحاذاة.
theological_decisions: []
