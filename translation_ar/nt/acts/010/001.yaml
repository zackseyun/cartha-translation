  text: Ἀνὴρ δέ ⸀τις ἐν Καισαρείᾳ ὀνόματι Κορνήλιος, ἑκατοντάρχης ἐκ σπείρης τῆς καλουμένης Ἰταλικῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/001.yaml
  text: There was a man in Caesarea named Cornelius[a], a centurion from the cohort called the Italian Cohort[b],
translation:
  language: ar
  text: وكان في قيصرية رجل اسمه كرنيليوس، قائد مئة من الكتيبة التي تُدعى «الإيطالية»[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كانت «الكتيبة» وحدة عسكرية رومانية. ويُحتمل أن اسم «الإيطالية» يدل على صلتها بإيطاليا أو على أنها كانت مؤلفة من جنود إيطاليين.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀνὴρ ... τις
  choice: رجل
  rationale: تقدّم العبارة اليونانية شخصية جديدة بصيغة نكرة؛ وصياغة «كان في قيصرية رجل» طبيعية وتحفظ هذا التعريف غير المحدد.
- source_word: δέ
  choice: الواو في «وكان»
  rationale: أداة انتقال سردي خفيفة لا تفيد تضادًا قويًا؛ والواو تصل المشهد بما قبله طبيعيًا من غير إضافة معنى زمني.
- source_word: ἐν Καισαρείᾳ
  choice: في قيصرية
  rationale: ترجمة مكانية مباشرة مع اعتماد الصيغة العربية الشائعة لاسم المدينة.
- source_word: ὀνόματι Κορνήλιος
  choice: اسمه كرنيليوس
  rationale: صياغة عربية طبيعية للتعبير الدال على الاسم، مع نقل الاسم الشخصي صوتيًا.
- source_word: ἑκατοντάρχης
  choice: قائد مئة
  rationale: تعبير عربي واضح ودقيق نسبيًا للرتبة العسكرية الرومانية، من غير إيهام بأنه كان يقود مئة جندي فعليًا في كل وقت.
- source_word: ἐκ σπείρης
  choice: من الكتيبة
  rationale: تشير σπεῖρα هنا إلى وحدة عسكرية رومانية؛ و«الكتيبة» لفظ مفهوم ومناسب في العربية، مع إيضاح تاريخي في الحاشية.
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: التي تُدعى «الإيطالية»
  rationale: يحفظ اسم الوحدة كما يصفه النص، من غير الجزم بما إذا كانت منسوبة إلى إيطاليا أو مؤلفة من جنود إيطاليين.
