    rationale: هذه صياغة حرفية مضللة للفعل اليوناني في العربية؛ كما أن «عامًّا» لا يؤدي الدلالة الشعائرية. يلزم استبدالها ببدائل عربية دلالية دقيقة، مع بيان الفرق عن «نجس» عند الحاجة.
