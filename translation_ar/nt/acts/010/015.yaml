  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: ar
  text: 'فأتاه صوتٌ مرةً أخرى، للمرة الثانية: «ما طهَّره الله، فلا تَعُدَّه أنتَ دنسًا[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلا تَعُدَّه نجسًا» أو «لا تعاملْه على أنه غير طاهر». والفعل اليوناني يفيد في هذا السياق تدنيس الشيء أو معاملته كمدنَّس، وهو غير اللفظ اليوناني المعتاد لـ«نجس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: صوتٌ
  rationale: يحافظ التنكير على صيغة الاسم غير المعرّف في اليونانية، مع بقاء التركيز على النداء السماوي المتكرر.
- source_word: πάλιν ἐκ δευτέρου
  choice: مرةً أخرى، للمرة الثانية
  rationale: ينقل عنصري التكرار والتحديد معًا، محافظًا على شيء من التوكيد والتكرار اللفظي في الأصل.
- source_word: πρὸς αὐτόν
  choice: جاءه
  rationale: تعبير عربي طبيعي يفيد أن الصوت كان موجَّهًا إليه.
- source_word: Ἃ
  choice: ما
  rationale: اسم موصول عام يجمع الأشياء المقصودة، وهو المقابل العربي الطبيعي للموصول المحايد الجمع.
- source_word: ἐκαθάρισεν
  choice: طهَّره
  rationale: ينقل فعل الله الحاسم ويحافظ على دلالة الطهارة الشعائرية في السياق.
- source_word: σὺ
  choice: أنتَ
  rationale: إثبات الضمير المنفصل يحفظ التوكيد الصريح في اليونانية ويبرز المقابلة بين فعل الله وحكم بطرس.
- source_word: μὴ κοίνου
  choice: فلا تَعُدَّه نجسًا
  rationale: في سياق أحكام الطهارة، يدل الفعل على اعتبار الشيء دنسًا أو غير طاهر. هذه الصياغة عربية واضحة، بينما تُذكر دلالة «عامًّا/مشاعًا» الحرفية في الحاشية لأنها غير طبيعية وقد تضلل القارئ العربي.
theological_decisions:
- issue: لغة الطهارة في رؤيا بطرس
  choice: فلا تَعُدَّه أنتَ نجسًا
  alternative: فلا تَعُدَّه عامًّا أو دنسًا
  rationale: تحافظ الصياغة على المقابلة بين تطهير الله وتصنيف بطرس، من غير حصر القول في الطعام أو الناس. ولأن المقابل الحرفي لـ κοινόω بمعنى «جعله عامًّا» لا يؤدي دلالة النجاسة الشعائرية بوضوح في العربية المعاصرة، أُثبت البديل الدلالي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «طهَّره» و«نجسًا» لإبراز حقل الطهارة في السياق، مع إبقاء الاحتمال المعجمي الأوسع في الحاشية.
