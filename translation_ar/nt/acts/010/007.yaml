  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: ar
  text: ولمّا انصرف الملاك الذي كان يكلّمه، استدعى اثنين من خدم بيته[a] وجنديًّا تقيًّا من ملازميه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اثنين من عبيد بيته». تشير الكلمة اليونانية إلى أشخاص في خدمة البيت، وقد تدل على عبيد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: ولمّا انصرف
  rationale: تفيد العبارة إطارًا زمنيًّا يسبق الاستدعاء، و«لمّا» مع الماضي تنقل هذا التعاقب طبيعيًّا، بينما تعبّر «انصرف» عن مغادرة الملاك دون تكلّف.
- source_word: ὁ ἄγγελος ὁ λαλῶν αὐτῷ
  choice: الملاك الذي كان يكلّمه
  rationale: السياق يدل على كائن سماوي، واسم الموصول مع «كان يكلّمه» يحفظ وظيفة اسم الفاعل الحاضر في تحديد الملاك بوصفه المتحدث إليه.
- source_word: φωνήσας
  choice: استدعى
  rationale: يدل هنا على استدعاء أشخاص للحضور، لا مجرد رفع الصوت. وصيغة الفعل الماضي ملائمة للعربية، مع أن اسم الفاعل اليوناني يمهّد نحويًّا لما سيأتي في العدد التالي.
- source_word: δύο τῶν οἰκετῶν
  choice: اثنين من خدم بيته
  rationale: يحفظ التركيب معنى التبعيض، ويبيّن أن οἰκέται خدم مرتبطون بالبيت. وقد أضيف ضمير الملكية اعتمادًا على السياق.
- source_word: στρατιώτην εὐσεβῆ
  choice: جنديًّا تقيًّا
  rationale: «جندي» مقابل مباشر لـ στρατιώτης، و«تقي» ينقل معنى التعبد والورع في εὐσεβής من غير إضافة وصف اصطلاحي أخص مثل «خائف الله».
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: من ملازميه
  rationale: العبارة تبعيضية وتصف أفرادًا مواظبين على الحضور والخدمة لديه؛ و«من ملازميه» موجزة وطبيعية وتحفظ معنى الاستمرار في الحضور.
theological_decisions:
- issue: طبيعة ἄγγελος في السياق
  choice: الملاك
  alternative: الرسول أو المبعوث
  rationale: سياق رؤيا كرنيليوس في أعمال 10 يحدد المرجع بوصفه كائنًا سماويًّا، لذلك فـ«الملاك» هو المعنى السياقي لا مجرد اختيار تقليدي.
- issue: وصف الجندي بـ εὐσεβής
  choice: تقيًّا
  alternative: خائفًا لله
  rationale: الصفة تدل على التقوى والتعبد، لكنها لا تستلزم بذاتها التعبير الاصطلاحي «خائف الله»؛ لذا تُحفظ دلالتها العامة دون تضييق لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «خدم بيته» لصون الإطار المنزلي بلغة طبيعية، مع إثبات احتمال «عبيد بيته» في الحاشية. وينتهي العدد بتركيب يمهّد لاستكمال الحدث في العدد التالي، كما في اليونانية.
