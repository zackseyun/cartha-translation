  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: ar
  text: وكان فيها[a] جميعُ الحيوانات ذوات الأربع، والمخلوقات الزاحفة على الأرض[b]، وطيور السماء[c].
  philosophy: optimal-equivalence
  footnotes:
