    text: 'حرفيًا: «التي كان فيها».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «دبّابات الأرض» أو «زواحف الأرض».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «طيور العلاء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: فيها
  rationale: يعود الضمير الموصول إلى الملاءة المذكورة في السياق، وصيغة «فيها» طبيعية وموجزة وتحفظ المعنى المكاني.
- source_word: ὑπῆρχεν
  choice: كان
  rationale: يفيد الفعل وجود هذه المخلوقات داخل الملاءة؛ و«كان فيها» يؤدي معنى الحضور من غير إضافة معنى الاحتواء الصريح.
- source_word: πάντα
  choice: جميع
  rationale: تحفظ اللفظة شمول العبارة كما في اليونانية، من غير إضافة التفسير «من كل نوع».
- source_word: τὰ τετράποδα
  choice: الحيوانات ذوات الأربع
  rationale: تعبير عربي واضح ومفهوم للحيوانات ذات الأربع قوائم، وأقل اصطلاحية من «رباعيات القوائم».
- source_word: ἑρπετὰ τῆς γῆς
  choice: المخلوقات الزاحفة على الأرض
  rationale: لفظة ἑρπετά أوسع من التصنيف الحيواني الحديث «الزواحف»، وتشمل ما يدب أو يزحف؛ لذا يحفظ هذا التعبير سعة الدلالة.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: طيور السماء
  rationale: «طيور» ملائمة لسياق تعداد أصناف الحيوان، و«السماء» تقابل οὐρανός هنا بمعنى الفضاء العلوي الذي تطير فيه.
- source_word: καὶ ... καὶ
  choice: الواو المتكررة في التعداد
  rationale: حُفظ تنسيق الأصناف بحروف العطف العربية الطبيعية بما يقابل تكرار καί.
theological_decisions: []
