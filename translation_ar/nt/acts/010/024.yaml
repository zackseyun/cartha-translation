source:
  edition: SBLGNT
  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: ar
  text: وفي اليوم التالي دخل قيصرية[a]. وكان كرنيليوس ينتظرهم، وقد دعا أقرباءه وأصدقاءه المقرَّبين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الفعل في اليونانية مفرد، «دخل»، لكن الضمير اللاحق جمع، «هم». ويُرجَّح أن السرد يركّز على بطرس بوصفه الشخصية الرئيسة، مع شمول مرافقيه في انتظار كرنيليوس.
    reason: توضيح التحول في النص اليوناني من الفعل المفرد إلى الضمير الجمع
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: وفي اليوم التالي
  rationale: تعبير زمني يدل على اليوم التالي في تسلسل الرواية، والواو تنقل انتقال δέ السردي الخفيف من غير إقحام معنى تقابلي قوي.
- source_word: εἰσῆλθεν
  choice: دخل
  rationale: الفعل اليوناني ماضٍ مفرد، لذلك حُفظ الإفراد مع بقاء الفاعل مفهومًا من السياق، وهو بطرس.
- source_word: Καισάρειαν
  choice: قيصرية
  rationale: الصيغة العربية الشائعة لاسم المدينة القديمة Καισάρεια.
- source_word: ὁ δὲ Κορνήλιος
  choice: وكان كرنيليوس
  rationale: تنقل العبارة تحوّل بؤرة السرد إلى كرنيليوس، من غير أن تجعل δέ أداة استدراك قوية.
- source_word: ἦν προσδοκῶν
  choice: كان ... ينتظرهم
  rationale: يبين التركيب اليوناني حالة انتظار مستمرة في ذلك الوقت، و«ينتظر» عربية طبيعية تؤدي معنى الترقب في السياق.
- source_word: αὐτούς
  choice: هم
  rationale: الضمير اليوناني جمع، ويشير إلى بطرس ومرافقيه، فحُفظ الجمع رغم إفراد الفعل السابق.
- source_word: συγκαλεσάμενος
  choice: وقد دعا
  rationale: يفيد اسم الفاعل الماضي فعلًا سبق حالة الانتظار أو صاحبها بوصفه أمرًا منجزًا؛ و«قد دعا» تؤدي ذلك بسلاسة.
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: أقرباءه
  rationale: ترجمة واضحة ومعاصرة لما يدل على ذوي القرابة.
- source_word: τοὺς ἀναγκαίους φίλους
  choice: أصدقاءه المقرَّبين
  rationale: الصفة ἀναγκαίους مع «الأصدقاء» تدل اصطلاحيًا على الأصدقاء الحميمين أو الموثوق بهم، لا على معنى «الضروريين» الحرفي.
theological_decisions: []
