lexical_decisions:
- source_word: διὸ καὶ
  choice: لذلك
  rationale: تفيد النتيجة المترتبة على الكلام السابق، وقد استُوعبت دلالة καί التأكيدية الخفيفة في انسياب العبارة من غير ترجمة متكلّفة.
- source_word: ἀναντιρρήτως
  choice: من غير اعتراض
  rationale: يحفظ المعنى الأقرب، أي المجيء من غير معارضة أو مجادلة، مع بقاء العبارة طبيعية في العربية.
- source_word: ἦλθον
  choice: جئتُ
  rationale: ترجمة مباشرة للفعل، وتناسب مقام وصول بطرس إلى مخاطبيه.
- source_word: μεταπεμφθείς
  choice: حين أُرسل في طلبي
  rationale: يحفظ صيغة المبني للمجهول ومعنى استدعاء الشخص بإرسال من يطلب حضوره.
- source_word: πυνθάνομαι οὖν
  choice: والآن أسأل
  rationale: تنقل الاستفهام والتحول الخطابي الذي تفيده οὖν بصياغة عربية طبيعية.
- source_word: τίνι λόγῳ
  choice: لأيّ سبب
  rationale: يحفظ الصياغة الصريحة «لأي سبب» بدل اختزالها في «لماذا»، مع وضوحها للقارئ المعاصر.
- source_word: μετεπέμψασθέ με
  choice: أرسلتم في طلبي
  rationale: ينقل معنى «أرسلتم لتستدعوني» ويحافظ على الاتساق اللفظي مع العبارة السابقة.
