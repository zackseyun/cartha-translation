  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: ar
  text: بل قم وانزل واذهب معهم من غير تردد[a]، لأني أنا قد أرسلتهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من غير أن تميّز». يمكن أن يعني التعبير اليوناني عدم التردد أو عدم التمييز؛ وقد يلمّح المعنى الثاني إلى موضوع عدم التفريق بين اليهود وغير اليهود في هذا الأصحاح.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد الانتقال الاستدراكي من حيرة بطرس السابقة إلى الأمر بالعمل، و«بل» موجزة وطبيعية في العربية.
- source_word: ἀναστὰς
  choice: قم
  rationale: اسم فاعل ماضٍ يؤدي معنى الأمر ضمن سلسلة الأوامر؛ و«قم» تنقل الدعوة إلى النهوض الفوري بعبارة عربية طبيعية.
- source_word: κατάβηθι
  choice: انزل
  rationale: تنقل الحركة إلى أسفل من موضع بطرس على السطح من غير إضافة اتجاه غير موجود في اليونانية.
- source_word: πορεύου σὺν αὐτοῖς
  choice: اذهب معهم
  rationale: صياغة عربية واضحة تنقل فعل الذهاب ومعنى المصاحبة من غير إطالة.
- source_word: μηδὲν διακρινόμενος
  choice: من غير تردد
  rationale: يمكن أن يدل الفعل على الشك أو التردد، كما يمكن أن يدل على التمييز. والسياق المباشر يرجّح أمر بطرس بألا يتردد في مرافقة الرجال، بينما تُحفظ الدلالة الأخرى في الحاشية.
- source_word: ὅτι
  choice: لأني
  rationale: تدخل اللفظة على سبب امتثال بطرس للأمر، واللام السببية صياغة عربية موجزة وطبيعية.
- source_word: ἐγὼ
  choice: أنا
  rationale: أُثبت الضمير المنفصل ليعكس توكيد الضمير الصريح في اليونانية.
- source_word: ἀπέσταλκα αὐτούς
  choice: قد أرسلتهم
  rationale: «قد» مع الماضي تفيد تحقق الإرسال واكتماله، مع بقاء أثره حاضرًا في وجود الرجال عند بطرس.
theological_decisions:
- issue: دلالة μηδὲν διακρινόμενος وصلتها بقبول غير اليهود
  choice: من غير تردد
  alternative: من غير أن تميّز
  rationale: السياق المباشر يتناول حيرة بطرس وأمر الروح له بأن يرافق الرجال بلا تردد، لكن معنى عدم التمييز محتمل لغويًا وينسجم مع موضوع عدم التفريق بين اليهود وغير اليهود في الأصحاح. لذلك وُضع المعنى الأرجح في المتن وحُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت أوامر قصيرة متتابعة محافظةً على إيقاع الأصل، ووُضع مؤشر الحاشية عند العبارة التي تتعلق بها مباشرة.
