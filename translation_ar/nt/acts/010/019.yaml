  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: الظرف الزمني المستمر في «وبينما كان»، والتفكير المتأمل في الرؤيا، ونسبة القول إلى «الروح» من دون إضافة «القدس»، وأداة التنبيه Ἰδού في «ها إن»، والتحديد الذكوري في «رجالًا»، ومعنى ζητοῦντές σε في «يبحثون عنك». ولا يضيف معنى تفسيريًا أو عقائديًا غير وارد في النص.'
  naturalness: 'الصياغة فصيحة حديثة وسلسة: «وبينما كان بطرس يتأمل في الرؤيا، قال له الروح...» تركيب طبيعي وواضح، و«ها إن رجالًا يبحثون عنك» تؤدي التنبيه بوقار غير متكلف.'
