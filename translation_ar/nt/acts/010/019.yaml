  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: ar
  text: 'وبينما كان بطرس يتأمل في الرؤيا، قال له الروح: «ها إن رجالًا يبحثون عنك[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يطلبونك».'
    reason: بديل معجمي للفعل ζητέω.
lexical_decisions:
- source_word: διενθυμουμένου
  choice: كان يتأمل
  rationale: يدل اسم الفاعل على تفكير داخلي متواصل ومتأنٍّ؛ و«يتأمل» تعبير عربي طبيعي يحفظ هذا المعنى من غير إضافة دلالة زمنية غير مصرَّح بها.
- source_word: περὶ τοῦ ὁράματος
  choice: في الرؤيا
  rationale: ينقل موضوع تفكير بطرس بعبارة عربية فصيحة وطبيعية.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: يحافظ على صياغة اليونانية التي لا تذكر صفة «القدس» هنا، مع وضوح الإشارة في السياق إلى روح الله.
- source_word: εἶπεν αὐτῷ
  choice: قال له
  rationale: ترجمة مباشرة ومألوفة للفعل مع المفعول غير المباشر.
- source_word: Ἰδοὺ
  choice: ها إن
  rationale: أداة تنبيه عربية واضحة ومعاصرة تؤدي وظيفة Ἰδού من غير اللجوء إلى صياغة مهجورة.
- source_word: ἄνδρες
  choice: رجالًا
  rationale: يحفظ التحديد الذكوري في ἀνήρ بدل تعميمه إلى «أناس».
- source_word: ζητοῦντές σε
  choice: يبحثون عنك
  rationale: هذا معنى طبيعي لـ ζητέω في سياق أشخاص أتوا للعثور على بطرس؛ وتُذكر «يطلبونك» بديلًا معجميًا في الحاشية.
theological_decisions:
- issue: مرجع τὸ πνεῦμα
  choice: الروح، أي روح الله الذي يخاطب بطرس
  alternative: روح غير محدد أو إلهام روحي داخلي
  rationale: سياق أعمال 10 يصوّر المتكلم بوصفه الروح الإلهي الذي يوجّه بطرس، مع عدم إضافة «القدس» لأن اللفظ اليوناني هنا لا يتضمنها.
- issue: دلالة جنس ἄνδρες
  choice: رجالًا
  alternative: أناسًا أو زوارًا
  rationale: اللفظ اليوناني ἀνήρ يشير هنا إلى ذكور بالغين، ولذلك تُحفظ دلالته بدل تحييدها.
translation_notes:
  register: العربية فصحى حديثة، واضحة ووقورة. استُعملت «ها إن» للتنبيه، وحُفظت بساطة السرد المباشر. لم تُضف كلمة «القدس» إلى «الروح»، ولم تُضف «لا يزال» لأن الاستمرار مفهوم من تركيب «بينما كان» دون التصريح بزائد على النص.
