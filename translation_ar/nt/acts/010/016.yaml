  yaml_path: translation/nt/acts/010/016.yaml
  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: ar
  text: وحدث هذا ثلاث مرات، وفورًا رُفع الوعاء[a] إلى السماء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الملاءة». الكلمة اليونانية تعني «وعاءً» أو «شيئًا/أداةً»، لكن السياق الأوسع يصفه بأنه جسم يشبه ملاءة كبيرة.
    reason: lexical_alternative
  - marker: b
    text: أو «السماء المنظورة». يمكن أن يدل اللفظ اليوناني على السماء المنظورة أو على العالم السماوي؛ وسياق الرؤيا يرجّح المعنى الثاني.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: وحدث هذا
  rationale: ينقل الإشارة إلى ما سبق واستعمال γίνομαι للدلالة على وقوع الحدث، مع تمثيل δέ بواو ربط خفيفة طبيعية في السرد العربي.
- source_word: ἐπὶ τρίς
  choice: ثلاث مرات
  rationale: تعبير عربي واضح ومعاصر ينقل تكرار الحدث ثلاثًا من غير صياغة قديمة أو متكلفة.
- source_word: καὶ εὐθὺς
  choice: ثم ... في الحال
  rationale: تفيد «ثم» الانتقال إلى الحدث التالي، وتحفظ «في الحال» معنى السرعة والمباغتة في εὐθύς.
- source_word: ἀνελήμφθη
  choice: رُفع
  rationale: يحفظ صيغة المبني للمجهول واتجاه الحركة إلى أعلى من غير تعيين الفاعل الذي لم يذكره النص.
- source_word: τὸ σκεῦος
  choice: الوعاء
  rationale: σκεῦος لفظ واسع يدل على وعاء أو أداة أو شيء حاوٍ؛ و«الوعاء» يحفظ عموم اللفظ، بينما يوضح السياق السابق أن هيئته شبيهة بملاءة.
- source_word: εἰς τὸν οὐρανόν
  choice: إلى السماء
  rationale: «إلى» تنقل اتجاه الحركة، و«السماء» هي المقابل العربي الطبيعي لـ οὐρανός وتبقي مجال دلالته بين السماء المنظورة والسماء بوصفها العالم العلوي.
theological_decisions:
- issue: مدلول οὐρανός في رؤيا بطرس
  choice: السماء
  alternative: العالم العلوي؛ أو الجو
  rationale: السياق الرؤيوي يرجح جهة سماوية علوية، لكن اللفظ اليوناني يمكن أن يدل أيضًا على السماء المنظورة. لفظ «السماء» العربي طبيعي ويحفظ هذا الاتساع بدل حسمه بتفسير زائد.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة، بإيقاع سردي طبيعي. وُضعت علامتا الحاشيتين مباشرة بعد اللفظين اللذين تشرحانهما، مع الحفاظ على المبني للمجهول وعدم تعيين الفاعل.
