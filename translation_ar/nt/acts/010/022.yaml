source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: ar
  text: 'فقالوا: «كرنيليوس، قائد مئة، رجل بارّ يخاف الله، ويشهد له بالخير شعب اليهود كله، تلقّى توجيهًا إلهيًّا من ملاك مقدّس أن يستدعيك إلى بيته ويسمع منك كلامًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة الأخيرة: «أن يطلب حضورك إلى بيته ويسمع منك أقوالًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: قائد مئة
  rationale: تعبير عربي واضح ودقيق للرتبة العسكرية الرومانية، ويحافظ على مدلول اللفظ التاريخي.
- source_word: ἀνὴρ δίκαιος
  choice: رجل بارّ
  rationale: يحفظ المعنى الأخلاقي والديني لكلمة δίκαιος من غير إضافة استنتاج عقائدي.
- source_word: φοβούμενος τὸν θεόν
  choice: يخاف الله
  rationale: يحافظ على الصيغة الفعلية والتعبير الكتابي، وقد يكون وصفًا لأممي يوقّر إله إسرائيل دون الجزم بوضعه الديني.
- source_word: μαρτυρούμενος
  choice: يشهد له بالخير
  rationale: ينقل معنى الشهادة الحسنة والسمعة الطيبة بصياغة عربية طبيعية.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: شعب اليهود كله
  rationale: يفهم ἔθνος هنا بوصفه جماعة بشرية، لا دولة سياسية حديثة.
- source_word: ἐχρηματίσθη
  choice: تلقّى توجيهًا إلهيًّا
  rationale: ينقل دلالة التبليغ أو الإرشاد ذي المصدر الإلهي، ولا يضيّق المعنى إلى التحذير وحده.
- source_word: ἀγγέλου ἁγίου
  choice: من ملاك مقدّس
  rationale: يمثل صراحة الصفة ἁγίου مع صياغة عربية مفهومة.
- source_word: μεταπέμψασθαί σε
  choice: أن يستدعيك
  rationale: يؤدي معنى إرسال من يطلب حضور شخص بإيجاز ومن دون تكرار زائد.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: إلى بيته
  rationale: ينقل جهة الاستدعاء ويحافظ على المعنى الملموس لـ οἶκος.
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: ويسمع منك كلامًا
  rationale: يحفظ عمومية ῥήματα ولا يحدد الكلام بأنه عظة أو رسالة رسمية.
theological_decisions:
- issue: وصف تقوى كرنيليوس دون استيراد تصنيفات عقائدية لاحقة
  choice: رجل بارّ يخاف الله
  alternative: رجل تقيّ
  rationale: الصياغة المختارة تحفظ عنصري البر ومخافة الله الواردين في اليونانية، من غير أن تحسم وضع كرنيليوس العهدي أو الخلاصي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «قائد مئة» بدل تعريب اللقب العسكري، و«شعب اليهود كله» لتجنب إيحاء الدولة القومية الحديثة. وُضعت علامة الحاشية [a] في المتن كما يلزم.
