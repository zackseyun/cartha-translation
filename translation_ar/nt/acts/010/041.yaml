  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: ar
  text: لا للشعب كله، بل لشهود سبق أن اختارهم الله[a]، أي لنا نحن، الذين أكلنا وشربنا معه بعدما قام من بين الأموات[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سبق أن عيّنهم الله».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بعدما أُقيم من بين الأموات». والصياغة اليونانية هنا تُترجم طبيعيًا: «بعدما قام من بين الأموات»، مع أن التعبير المبني للمجهول يرد في مواضع أخرى من العهد الجديد.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: لا للشعب كله
  rationale: ينقل نطاق النفي بوضوح ويحافظ على المقابلة بين عموم الشعب والشهود المحددين.
- source_word: μάρτυσι
  choice: لشهود
  rationale: اللفظ العربي المعتاد لمن يشهدون بما رأوه، وهو ملائم لاستعمال الكلمة في سفر أعمال الرسل.
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: سبق أن اختارهم الله
  rationale: ينقل اسم الفاعل التام المبني للمجهول معنى الاختيار الإلهي السابق ذي الأثر المستمر، بصياغة عربية طبيعية.
- source_word: ἡμῖν
  choice: أي لنا نحن
  rationale: يوضح أن الضمير بدل أو بيان للشهود، من غير تغيير مرجعه أو إضافة فئة جديدة.
- source_word: οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: الذين أكلنا وشربنا معه
  rationale: يحافظ على الفعلين المحسوسين وعلى معنى المشاركة والمعية في الطعام والشراب.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: بعدما قام من بين الأموات
  rationale: يعكس الدلالة الزمنية لـμετά والاستعمال اللازم لـἀναστῆναι، بصياغة عربية واضحة ومألوفة.
theological_decisions:
- issue: صياغة قيامة يسوع في ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: بعدما قام من بين الأموات
  alternative: بعدما أُقيم من بين الأموات
  rationale: الفعل اليوناني هنا طبيعي الدلالة على «قام»، من غير أن ينفي ذلك فاعلية الله المصرح بها في مواضع أخرى. أُبقي البديل المبني للمجهول في الحاشية حفاظًا على الإمكان التعبيري من غير فرضه على المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «أي لنا نحن» لإظهار علاقة البدل في ἡμῖν، ووُضعت علامتا الحاشيتين عند العبارتين اللتين تخصهما الملاحظتان.
