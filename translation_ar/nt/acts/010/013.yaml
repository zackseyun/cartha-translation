  text: 'وجاءه صوت: «قُم يا بطرس، اذبح[a] وكُل»


    [a] أو: «قدِّم ذبيحة وكُل». يمكن للفعل اليوناني أن يدل على تقديم الذبيحة، لكنه هنا، في سياق الرؤيا، يُرجَّح أن يشير إلى ذبح حيوان للأكل.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قدِّم ذبيحة وكُل». يمكن للفعل اليوناني أن يدل على تقديم الذبيحة، لكنه هنا، في سياق الرؤيا، يُرجَّح أن يشير إلى ذبح حيوان للأكل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: جاءه
  rationale: مع «صوت» بوصفه الفاعل، يفيد الفعل حدوث الصوت أو وصوله. وصيغة «جاءه صوت» عربية طبيعية وتحافظ على الطابع الحدثي للعبارة.
- source_word: φωνὴ
  choice: صوت
  rationale: السياق سياق خطاب مفهوم في رؤيا، لا مجرد ضوضاء أو صوت غير متميز.
- source_word: πρὸς αὐτόν
  choice: ـه
  rationale: أُدمج معنى توجّه الصوت إليه في «جاءه»، وهي صياغة عربية موجزة وطبيعية.
- source_word: Ἀναστάς
  choice: قُم
  rationale: اسم الفاعل اليوناني يؤدي هنا وظيفة الأمر تمهيدًا للأمرين التاليين، و«قُم» واضح ومباشر.
- source_word: Πέτρε
  choice: يا بطرس
  rationale: نُقل النداء اليوناني بأداة النداء العربية، مع استعمال الصيغة العربية المألوفة للاسم.
- source_word: θῦσον
  choice: اذبح
  rationale: يرتبط الأمر مباشرة بالأكل، ولذلك تنقل «اذبح» المعنى العملي من غير أن تلغي إمكان الدلالة على تقديم الذبيحة؛ وقد حُفظ هذا الاحتمال في الحاشية.
- source_word: φάγε
  choice: كُل
  rationale: صيغة أمر مباشرة وطبيعية تقابل الأمر اليوناني.
- source_word: καὶ
  choice: فـ / و
  rationale: نُقل رابط السرد الأول بالفاء الملائمة لتتابع الأحداث في العربية، ونُقلت الواو بين الأمرين كما في اليونانية.
theological_decisions:
- issue: هل تُنقل θῦσον بلفظ طقسي صريح؟
  choice: «اذبح» في المتن
  alternative: «قدِّم ذبيحة»
  rationale: موضوع الرؤيا هو الحيوانات والأكل، لا إقامة شعيرة ذبائحية صريحة. ومع ذلك، يحتمل الفعل اليوناني معنى تقديم الذبيحة، لذلك أُبقي الاحتمال في الحاشية بدل حسمه نهائيًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُعملت صياغة «فجاءه صوت يقول» لتكون طبيعية في العربية مع الحفاظ على حدوث الخطاب وتوجيهه إلى بطرس، ووُضع مؤشر الحاشية مباشرة بعد اللفظ الذي تتعلق به.
