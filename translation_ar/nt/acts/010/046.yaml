lexical_decisions:
- source_word: ἤκουον
  choice: كانوا يسمعون
  rationale: يحفظ صيغة الماضي الناقص دلالة الفعل المستمر أو الممتد في السياق.
- source_word: γὰρ
  choice: لأنهم
  rationale: تفيد γάρ التعليل لما سبق، و«لأن» تؤدي هذا الربط بوضوح في العربية.
- source_word: αὐτῶν
  choice: هم
  rationale: أُبقي المرجع ضميريًا كما في اليونانية، من غير إدخال تسمية تفسيرية مثل «الأمم».
- source_word: λαλούντων
  choice: يتكلمون
  rationale: مقابل عربي طبيعي للفعل، ويحفظ علاقته بالفعل الإدراكي «يسمعونهم».
- source_word: γλώσσαις
  choice: بألسنة
  rationale: يحفظ التعبير الكتابي المألوف والاتساع الدلالي للكلمة اليونانية بين الألسنة واللغات، مع ذكر البديل في الحاشية.
- source_word: μεγαλυνόντων
  choice: يعظّمون
  rationale: ينقل معنى جعل الله عظيمًا أو إعلان عظمته، ويحافظ على لغة التسبيح الكتابية دون تحويله إلى معنى أضيق.
- source_word: τὸν θεόν
  choice: الله
  rationale: المفعول به المباشر للفعل «يعظّمون».
- source_word: τότε
  choice: حينئذ
  rationale: تدل على الانتقال إلى الحدث التالي في التسلسل.
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: المقابل المباشر للفعل اليوناني، حتى مع عدم ورود سؤال صريح قبله.
- source_word: Πέτρος
  choice: بطرس
  rationale: الصيغة العربية الكتابية المستقرة للاسم.
theological_decisions:
- issue: دلالة γλώσσαις في سياق الكلام المُمكَّن بالروح
  choice: بألسنة
  alternative: بلغات
  rationale: يمكن للكلمة اليونانية أن تدل على الألسنة أو اللغات. يحفظ المتن التعبير الكتابي من غير حسم طبيعة الكلام موضع النقاش، وتورد الحاشية البديل المعجمي.
translation_notes:
