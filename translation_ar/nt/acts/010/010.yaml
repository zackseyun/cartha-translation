source:
  edition: SBLGNT
  text: ἐγένετο δὲ πρόσπεινος καὶ ἤθελεν γεύσασθαι· παρασκευαζόντων δὲ ⸀αὐτῶν ⸀ἐγένετο ἐπ’ αὐτὸν ἔκστασις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: ar
  text: فاشتدَّ به الجوع، وأراد أن يأكل[a]. وبينما كانوا يُعِدّون الطعام، حلَّت به غَيْبة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يتذوّق شيئًا»؛ فالفعل اليوناني يعني حرفيًا «يتذوّق»، لكنه يشير هنا إلى الأكل.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حالة انخطاف»؛ يدل اللفظ اليوناني هنا على حالة وعي غير عادية مرتبطة برؤيا كاشفة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ πρόσπεινος
  choice: فاشتدَّ به الجوع
  rationale: ينقل بدء حالة الجوع وشدتها، ويؤدي معنى πρόσπεινος الأقوى من مجرد «جائع» بصياغة عربية طبيعية.
- source_word: ἤθελεν
  choice: أراد
  rationale: مقابل عربي مباشر وطبيعي لفعل الإرادة في هذا السياق السردي.
- source_word: γεύσασθαι
  choice: أن يأكل
  rationale: مع أن الفعل يعني حرفيًا «يتذوق»، فإنه يُستعمل هنا للدلالة على تناول الطعام؛ وتوضح الحاشية المعنى الحرفي البديل.
- source_word: παρασκευαζόντων δὲ αὐτῶν
  choice: وبينما كانوا يُعِدّون الطعام
  rationale: يحافظ «بينما» على تزامن الفعل الذي تدل عليه صيغة المضاف إليه المطلقة، ويُصرَّح بالطعام بوصفه المفعول المفهوم من السياق.
- source_word: ἐγένετο ἐπ’ αὐτὸν
  choice: حلَّت به
  rationale: تعبير عربي طبيعي يصور ابتداء الحالة واستيلاءها عليه من غير زيادة تفسيرية.
- source_word: ἔκστασις
  choice: غَيْبة
  rationale: تدل هنا على حالة وعي غير عادية مرتبطة بالرؤيا الآتية، لا على مجرد الدهشة؛ وهي أقل إيحاءً بالمعنى الانفعالي الذي قد تحمله «نشوة».
theological_decisions:
- issue: طبيعة حالة بطرس التي يدل عليها ἔκστασις
  choice: غَيْبة
  alternative: ذهول؛ انخطاف؛ نشوة
  rationale: السياق يعقبها برؤيا كاشفة، لذلك تشير إلى حالة وعي غير عادية لا إلى مجرد تعجب. وتُبقي «غَيْبة» وصف الحالة عامًا من غير تحميلها اصطلاحًا صوفيًا أو تفسيرًا عقائديًا زائدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُخدمت «فاشتدَّ به الجوع» لإظهار الانتقال إلى جوع شديد، و«غَيْبة» لوصف الحالة الرؤيوية بلا إيحاء مرضي أو مذهبي. وُضع كل رمز حاشية عند اللفظ الذي تشرحه.
