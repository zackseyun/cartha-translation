  verdict: approve
  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: النظرة المركزة («حدَّق إليه»)، الدخول في حالة الخوف، السؤال المختصر، وخطاب التوقير، ثم صعود الصلوات والصدقات «تذكارًا أمام الله». وتحافظ «تذكارًا» على لغة μνημόσυνον دون تحويلها إلى تفسير استحقاقي أو إلى قربان محدد.'
  naturalness: 'الصياغة فصيحة حديثة وواضحة، والحوار طبيعي: «ما الأمر، يا سيدي؟». وتركيب «صعدت صلواتك وصدقاتك تذكارًا أمام الله» وقور ومفهوم في العربية الكتابية المعاصرة.'
  terminology: «صدقاتك» مقابِل دقيق وطبيعي لـἐλεημοσύναι في هذا السياق، و«صلواتك» و«أمام الله» سليمتان. أما «يا سيدي» فتعبر عن κύριε بوصفه نداء توقير للكائن السماوي، من غير فرض دلالة مسيحانية أو إلهية على خطاب كرنيليوس. لا تستلزم «صدقات» حاشية عربية لأنها أوضح وأخص من التعبير الإنجليزي العام «acts of mercy».
