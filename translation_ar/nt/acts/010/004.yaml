source:
  edition: SBLGNT
  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: ar
  text: 'فحدَّق إليه وقد استولى عليه الخوف، وقال: «ما الأمر، يا سيدي؟» فقال له: «صعدت صلواتك وصدقاتك تذكارًا أمام الله.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: حدَّق إليه
  rationale: يفيد الفعل تثبيت النظر باهتمام؛ و«حدَّق إليه» تعبير عربي واضح يحفظ شدة النظرة.
- source_word: ἔμφοβος γενόμενος
  choice: وقد استولى عليه الخوف
  rationale: يحفظ معنى دخوله في حالة الخوف من غير المبالغة إلى حد الرعب.
- source_word: Τί ἐστιν
  choice: ما الأمر؟
  rationale: صياغة عربية طبيعية للسؤال عن شأن ظهور الرسول السماوي أو مقصده.
- source_word: κύριε
  choice: يا سيدي
  rationale: في هذا السياق هو خطاب توقير موجَّه إلى الملاك، و«يا سيدي» يحفظ الاحترام من غير أن يوحي بأن كرنيليوس يقر هنا بهوية المخاطَب الإلهية.
- source_word: προσευχαί
  choice: صلواتك
  rationale: المقابل العربي المباشر والمألوف للكلمة.
- source_word: ἐλεημοσύναι
  choice: صدقاتك
  rationale: تشير الكلمة هنا خصوصًا إلى العطاء رحمةً بالمحتاجين، و«الصدقات» هي العبارة العربية الطبيعية والدقيقة في هذا السياق.
- source_word: ἀνέβησαν
  choice: صعدت
  rationale: يحفظ صورة الصعود المرتبطة بلغة الصلاة والذبيحة.
- source_word: εἰς μνημόσυνον
  choice: تذكارًا
  rationale: يحفظ الصياغة التذكارية ذات الصدى التعبدي من غير إضافة تخصيص مثل «قربان» لا يصرح به النص.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: أمام الله
  rationale: ترجمة موجزة ومباشرة تدل على الحضور أو المثول في نظر الله.
theological_decisions:
- issue: دلالة κύριε في خطاب كرنيليوس للكائن السماوي
  choice: يا سيدي
  alternative: يا رب
  rationale: السياق يبيّن أنه خطاب احترام للملاك، لا بالضرورة اعتراف مسيحاني أو إلهي؛ لذلك تمنع «يا سيدي» إيحاءً عقديًا زائدًا مع حفظ نبرة التوقير.
- issue: دلالة صعود الصلوات والصدقات تذكارًا أمام الله
  choice: الإبقاء على الصورة كما وردت من غير شرح سببي أو خلاصي
  alternative: تفسيرها في المتن على أنها سبب قبول كرنيليوس أو استحقاقه
  rationale: النص يستخدم لغة التذكار أمام الله لكنه لا يحدد هنا علاقة ذلك بالاستحقاق أو الخلاص؛ لذا ينبغي إبقاء التوتر اللاهوتي دون حسم تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع ترتيب طبيعي للجملة وحفظ صورة الصعود والتذكار. لا توجد حاشية لازمة لأن «صدقاتك» تنقل ἐλεημοσύναι بدقة ووضوح في العربية.
