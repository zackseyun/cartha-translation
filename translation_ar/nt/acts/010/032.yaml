  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: ar
  text: فأرسل إذن إلى يافا، واستدعِ سمعان المدعو بطرس. إنه نازل ضيفًا في بيت سمعان الدبّاغ، عند البحر.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέμψον οὖν
  choice: فأرسل إذن
  rationale: يحافظ فعل الأمر على الطلب المباشر، وتنقل «إذن» دلالة الاستنتاج أو الانتقال التي تؤديها οὖν، مع فاء تصل الكلام بسياقه.
- source_word: εἰς Ἰόππην
  choice: إلى يافا
  rationale: ترجمة اتجاهية طبيعية لحرف الجر εἰς مع اسم المكان، و«يافا» هي الصيغة العربية المعروفة.
- source_word: μετακάλεσαι
  choice: استدعِ
  rationale: الفعل الأوسط يعني أن يطلب المتكلم إحضار شخص إليه؛ و«استدعِ» موجزة وتحفظ قوة الأمر دون إضافة وسيلة غير مصرّح بها.
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: سمعان المدعو بطرس
  rationale: ينقل العبارة بوصف «بطرس» الاسم الذي يُدعى به سمعان، في تركيب عربي واضح وموجز.
- source_word: ξενίζεται
  choice: نازل ضيفًا
  rationale: يُظهر معنى تلقي الضيافة الكامن في الفعل، لا مجرد الوجود المؤقت في مكان، وهو تعبير عربي طبيعي.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: في بيت سمعان الدبّاغ
  rationale: يحفظ ذكر البيت واسم صاحبه ومهنته، و«الدبّاغ» المقابل المألوف لمن يعالج الجلود.
- source_word: παρὰ θάλασσαν
  choice: عند البحر
  rationale: ينقل معنى الموقع بمحاذاة البحر بصياغة عربية موجزة وطبيعية.
theological_decisions: []
