id: ACT.10.28
reference: Acts 10:28
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: ar
  text: 'وقال لهم: «أنتم أنفسكم تعلمون أنه لا يحلّ لرجل يهودي أن يخالط أجنبيًّا[a] أو يزوره. لكن الله أراني ألّا أقول عن أيّ إنسان إنه دَنِس[b] أو نجس».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أمميًّا»؛ والكلمة اليونانية تعني حرفيًّا شخصًا من شعب آخر.
    reason: lexical_alternative
  - marker: b
    text: «دَنِس» تترجم κοινόν، وهي لفظة تختلف عن «نجس» (ἀκάθαρτον)؛ وقد حُفظ اللفظان لتمييز فئتين في لغة الطهارة اليهودية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: وقال لهم
  rationale: صياغة سردية عربية طبيعية تحفظ الوصل الخفيف في τέ من غير تحميله دلالة زمنية زائدة.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: أنتم أنفسكم تعلمون
  rationale: يُظهر الضمير الصريح في اليونانية التوكيد، فحُفظ بعبارة «أنتم أنفسكم».
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: أنه لا يحلّ
  rationale: تنقل قوة ἀθέμιτος بوصفه أمرًا غير مأذون به أو مخالفًا للقاعدة المقبولة، من غير قصره على عدم اللياقة الاجتماعية.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: لرجل يهودي
  rationale: يحفظ الإفراد والتذكير الصريحين في النص اليوناني.
- source_word: κολλᾶσθαι
  choice: أن يخالط
  rationale: يعبر طبيعيًّا عن الملازمة والمعاشرة الاجتماعية المقصودة من فعل الالتصاق أو الارتباط.
- source_word: ἢ προσέρχεσθαι
  choice: أو يزوره
  rationale: السياق يتناول المجيء إلى غير اليهودي والدخول عليه، و«يزوره» تؤدي المعنى العملي بوضوح.
- source_word: ἀλλοφύλῳ
  choice: أجنبيًّا
  rationale: اللفظة تعني حرفيًّا شخصًا من شعب آخر؛ و«أجنبي» موجزة وتحفظ هذا المعنى دون استبداله مباشرة بالمصطلح التفسيري «أممي».
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: لكن الله أراني
  rationale: «لكن» تُبرز المقابلة السياقية بين العرف المعروف والإعلان الإلهي، و«أراني» تنقل الفعل الماضي اليوناني مباشرة.
- source_word: μηδένα ... ἄνθρωπον
  choice: أيّ إنسان
  rationale: تشير ἄνθρωπος هنا إلى الإنسان عمومًا، لا إلى الذكر وحده.
- source_word: κοινὸν
  choice: دَنِس
  rationale: في سياق الطهارة يدل κοινός على ما صار مدنَّسًا أو غير مقدس للاستعمال؛ و«دنس» تميّزه في العربية عن ἀκάθαρτος مع إيضاح الفارق في الحاشية.
- source_word: ἢ ἀκάθαρτον
  choice: أو نجس
  rationale: «نجس» هو المقابل العربي الطبيعي لمصطلح عدم الطهارة، ويحفظ ازدواج اللفظتين اليونانيتين.
theological_decisions:
- issue: علاقة حدود المخالطة اليهودية بالإعلان الإلهي
  choice: عرض قول بطرس بوصفه أمرًا لا يحلّ للرجل اليهودي، ثم حفظ التصحيح الإلهي القائل بعدم وصف أي إنسان بالدنس أو النجاسة.
  alternative: تخفيف ἀθέμιτον إلى مجرد عدم اللياقة الاجتماعية، أو دمج مصطلحي الطهارة في لفظ واحد.
  rationale: يحفظ النص التوتر بين قاعدة المخالطة التي يذكرها بطرس وما كشفه الله له، كما يحفظ تطبيق الرؤيا على الإنسان نفسه من غير توسيع أو تضييق عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «يخالط» بدل ترجمة حرفية لفعل الالتصاق، و«لا يحلّ» لنقل المنع بقوة طبيعية. وُضعت علامتا الحاشيتين في موضعيهما داخل المتن.
