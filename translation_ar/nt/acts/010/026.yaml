  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: ar
  text: 'لكن بطرس أنهضه[a] قائلًا: «قُمْ[b]؛ فأنا أيضًا إنسان[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أقامه» أو «ساعده على النهوض».
    reason: lexical_alternative
  - marker: b
    text: أو «انهض».
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «فأنا نفسي أيضًا إنسان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: أنهضه
  rationale: ينقل فعل ἐγείρω في هذا السياق بوصفه جعل كرنيليوس يقوم من سجوده، من غير تحديد ما إذا كان قد رفعه أو ساعده جسديًا.
- source_word: Ἀνάστηθι
  choice: قُمْ
  rationale: أمر مباشر طبيعي في العربية بالنهوض إلى وضع الوقوف، ويلائم السياق السابق لسقوط كرنيليوس عند قدمي بطرس.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: فأنا أيضًا
  rationale: 'يؤدي معنى الاشتراك المؤكد: بطرس نفسه إنسان مثل كرنيليوس. استُخدمت الفاء لربط الأمر بسببه، وأفادت «أيضًا» معنى καί، بينما نُقل توكيد αὐτός في الحاشية لأن إظهاره حرفيًا يثقل العبارة العربية.'
- source_word: ἄνθρωπός εἰμι
  choice: إنسان
  rationale: ترجمة مباشرة لـἄνθρωπος في سياق تأكيد الطبيعة البشرية المشتركة، ولا تضيف معنى «مجرد» أو «فقط» غير الصريح في اليونانية.
- source_word: δὲ
  choice: لكن
  rationale: تُظهر المقابلة الخفيفة بين سجود كرنيليوس في الآية السابقة ورد بطرس المصحح.
theological_decisions:
- issue: رد بطرس على سجود كرنيليوس عند قدميه
  choice: صيغت العبارة بحيث تُظهر أن بطرس يرفض هذا التكريم مستندًا إلى كونه إنسانًا مثله.
  alternative: يمكن فهم الكلام فهمًا أضيق على أنه تعبير عن التواضع فحسب، من غير استنتاج عقدي أوسع.
  rationale: تحافظ الترجمة على المقابلة النصية بين فعل كرنيليوس وإنسانية بطرس، من غير إضافة حكم صريح عن العبادة أو بناء عقيدة لا تنص عليها الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير «أنهضه» للإيجاز والمحافظة على قوة الفعل، و«قُمْ» للأمر الطبيعي المباشر. وُضعت جميع علامات الحواشي في المتن، مع ترتيبها بحسب مواضعها الفعلية.
