  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: ar
  text: وفي اليوم التالي، بينما كان أولئك الرجال يسيرون ويقتربون من المدينة، صعد بطرس إلى سطح البيت ليصلّي، نحو الساعة السادسة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي نحو الظهر بحسب طريقة اليهود في حساب ساعات النهار.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: وفي اليوم التالي
  rationale: تعبير زمني بمعنى «في اليوم التالي»، مع نقل δέ بواو خفيفة تلائم تتابع السرد العربي من غير إفادة تضاد قوي.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: بينما كان أولئك الرجال سائرين
  rationale: تركيب المضاف إليه المطلق يدل على فعل متزامن؛ و«أولئك الرجال» يحافظ على الإحالة المحددة إلى رسل كرنيليوس، و«سائرين» تعبير عربي طبيعي عن كونهم في الطريق.
- source_word: καὶ τῇ πόλει ἐγγιζόντων
  choice: يقتربون من المدينة
  rationale: النعت الحالي الثاني داخل التركيب نفسه، و«يقتربون من المدينة» ينقل معنى ἐγγίζω بوضوح وطبيعية.
- source_word: ἀνέβη
  choice: صعد
  rationale: فعل سردي بسيط يدل على الحركة إلى موضع أعلى.
- source_word: ἐπὶ τὸ δῶμα
  choice: إلى سطح البيت
  rationale: δῶμα يشير هنا إلى السطح المستوي القابل للاستعمال في البيت؛ وإضافة «البيت» تمنع فهم السطح بمعنى عام.
- source_word: προσεύξασθαι
  choice: ليصلّي
  rationale: مصدر غرض بعد «صعد»، وتنقله لام التعليل العربية بإيجاز وطبيعية.
- source_word: περὶ ὥραν ἕκτην
  choice: نحو الساعة السادسة
  rationale: يحافظ على نظام عدّ الساعات في ثقافة النص وعلى دلالة التقريب في περί؛ ويُشرح المقابل الزمني الحديث في الحاشية.
