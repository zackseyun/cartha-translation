  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: ar
  text: وبينما كان بطرس لا يزال يتكلّم بهذه الكلمات، حلَّ الروح القدس على جميع الذين كانوا يسمعون الكلمة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «وقع الروح القدس على جميع الذين كانوا يسمعون الكلمة»؛ أي أتى عليهم أو حلَّ عليهم.'
    reason: إثبات الصورة الحرفية للفعل اليوناني ἐπέπεσε مع توضيح معناها في العربية.
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: وبينما كان بطرس لا يزال يتكلّم
  rationale: تؤدي العبارة الظرفية الزمنية معنى استمرار بطرس في الكلام لحظة وقوع الحدث الرئيسي، وتحافظ «لا يزال» على دلالة ἔτι.
- source_word: τὰ ῥήματα ταῦτα
  choice: بهذه الكلمات
  rationale: «الكلمات» مقابل مباشر وطبيعي لـῥήματα في سياق كلام منطوق.
- source_word: ἐπέπεσε
  choice: حلَّ ... على
  rationale: هذا هو التعبير العربي الطبيعي الواضح لمجيء الروح على أشخاص، مع إثبات الصورة الحرفية الأشد في الحاشية بدل استعمال صياغة عربية قد توحي بسقوط مادي.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: المقابل العربي المعياري الواضح للعبارة اليونانية المعرفة.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: على جميع الذين كانوا يسمعون
  rationale: يحفظ «على» علاقة ἐπί، وتنقل الصيغة المستمرة «كانوا يسمعون» دلالة اسم الفاعل المضارع على السماع الجاري في تلك اللحظة.
- source_word: τὸν λόγον
  choice: الكلمة
  rationale: يحافظ على المقابلة المعجمية المباشرة لـλόγος وعلى احتمال فهمها بوصفها الكلام أو الرسالة المعلنة، من غير حصر المعنى تفسيرياً في «الرسالة».
theological_decisions:
- issue: وصف فعل الروح القدس في ἐπέπεσε
  choice: حلَّ الروح القدس على
  alternative: وقع الروح القدس على
  rationale: اختير التعبير العربي الطبيعي الذي يقرر مجيء الروح على السامعين دون إضافة تفسير مذهبي، مع حفظ الصورة الحرفية للفعل اليوناني في الحاشية.
- issue: دلالة λόγος في سياق الكرازة
  choice: الكلمة
  alternative: الرسالة
  rationale: «الكلمة» أقرب إلى اللفظ اليوناني وتبقي اتساع دلالته، بينما «الرسالة» توضح المقصود السياقي لكنها تحسمه بدرجة أكبر.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل «حلَّ ... على» لطبيعته في العربية، واحتُفظ بـ«الكلمة» لتجنّب تضييق دلالة λόγος إلى تفسير واحد.
