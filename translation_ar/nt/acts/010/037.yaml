  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὑμεῖς οἴδατε τὸ γενόμενον ῥῆμα καθ’ ὅλης τῆς Ἰουδαίας, ⸀ἀρξάμενος ἀπὸ τῆς Γαλιλαίας μετὰ τὸ βάπτισμα ὃ ἐκήρυξεν Ἰωάννης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: ar
  text: أنتم أنفسكم تعرفون الأمر الذي جرى في اليهودية كلها[a]، مبتدئًا من الجليل بعد المعمودية التي نادى بها يوحنا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكلمة/الرسالة التي انتشرت في اليهودية كلها». يمكن أن تعني الكلمة اليونانية ῥῆμα «كلمة» أو «رسالة» أو «أمرًا».'
    reason: lexical_alternative
  - marker: b
    text: تأتي كلمة «مبتدئًا» في اليونانية بتركيب غير محكم نحويًا، لكنها تدل بوضوح على أن نقطة البداية كانت في الجليل.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: أنتم أنفسكم
  rationale: الضمير الصريح زائد نحويًا مع الفعل، ولذلك ينقل هذا التعبير قوة التوكيد في اليونانية بعبارة عربية طبيعية.
- source_word: οἴδατε
  choice: تعرفون
  rationale: مع أن الصيغة تامة من حيث المبنى، فإنها تؤدي معنى الحاضر هنا؛ و«تعرفون» ملائمة لسياق معرفة أمر عام ذائع.
- source_word: τὸ γενόμενον ῥῆμα
  choice: الأمر الذي جرى
  rationale: قد تعني ῥῆμα قولًا أو رسالة أو أمرًا، ومع γενόμενον والسياق الجغرافي تشير هنا إلى مجموع الوقائع والخبر عنها. يحفظ «الأمر الذي جرى» الاتساع الدلالي دون اختزاله في مجرد كلام.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: في اليهودية كلها
  rationale: تعبر κατά مع المضاف إليه عن الامتداد في المنطقة، وتنقل العبارة العربية شمول ὅλης بوضوح.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: مبتدئًا من الجليل
  rationale: تحافظ الصياغة على قوة الابتداء في ἀπό وعلى التركيب الوصفي الملتبس نحويًا، من غير تعيين مرجع اسم الفاعل تعيينًا قاطعًا.
- source_word: μετὰ τὸ βάπτισμα
  choice: بعد المعمودية
  rationale: μετά مع حالة النصب زمنية هنا، و«بعد» تؤدي التسلسل الزمني مباشرة.
- source_word: βάπτισμα
  choice: المعمودية
  rationale: هو المصطلح العربي الراسخ والواضح في هذا السياق، وأقل تفسيرًا من «التغطيس».
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: التي نادى بها يوحنا
  rationale: «نادى بها» ينقل قوة الإعلان العلني في κηρύσσω، وهو طبيعي مع «المعمودية» ولا يحصر المعنى في الوعظ المنبري.
theological_decisions:
- issue: دلالة ῥῆμα في خلاصة بطرس
  choice: الأمر
  alternative: الكلمة أو الرسالة
  rationale: السياق يتناول ما كان معروفًا في اليهودية ويحدد بدايته في الجليل، مما يرجح أمرًا يضم الوقائع والخبر عنها. أُبقي البديل في الحاشية لصون الاتساع الدلالي.
- issue: مرجع ἀρξάμενος
  choice: إبقاء الصلة رخوة بترجمة «مبتدئًا»
  alternative: 'صياغته جملة صريحة: «وقد بدأ ذلك من الجليل»'
  rationale: اسم الفاعل المذكر في اليونانية لا يطابق ῥῆμα المحايد، فالتركيب متراخٍ نحويًا مع وضوح معنى نقطة البداية. لا تحسم الترجمة مرجعه بما يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «الأمر الذي جرى» لصون تداخل الحدث والرسالة، وأُبقيت رخاوة تركيب «مبتدئًا» مع شرحها في الحاشية بدل تسوية الالتباس بصياغة تفسيرية.
