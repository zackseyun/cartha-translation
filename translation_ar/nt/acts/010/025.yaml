  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: ar
  text: ولمّا دخل بطرس، استقبله كرنيليوس، وخرّ عند قدميه ساجدًا له.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عابدًا له». يمكن أن يعني الفعل اليوناني العبادة، أو السجود والانحناء إجلالًا، بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον
  choice: ولمّا دخل بطرس
  rationale: ينقل التعبير اليوناني الاصطلاحي إلى افتتاح زمني سردي طبيعي، مع إبقاء وظيفة δέ الوصلية في الواو، ومن دون محاكاة حرفية ثقيلة.
- source_word: συναντήσας αὐτῷ
  choice: استقبله
  rationale: يفيد السياق أن كرنيليوس لقي بطرس عند دخوله؛ و«استقبله» عربية طبيعية تؤدي معنى اللقاء المقصود في هذا الموضع.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: خرّ عند قدميه
  rationale: يحفظ هيئة الانخفاض الجسدي والتذلل، و«خرّ» تعبير عربي فصيح واضح يدل على السقوط إلى الأرض.
- source_word: προσεκύνησεν
  choice: ساجدًا له
  rationale: يحفظ فعل الانحناء أو السجود الموجَّه إلى بطرس، من غير أن يحسم في المتن هل المقصود عبادة بالمعنى الديني المحض أم إجلال مفرط؛ وتوضح الحاشية المجال الدلالي.
theological_decisions:
- issue: دلالة προσκυνέω حين يكون بطرس مفعول الفعل
  choice: ساجدًا له
  alternative: عابدًا له؛ أو منحنيًا له إجلالًا
  rationale: الفعل اليوناني قد يدل على العبادة أو على السجود تكريمًا بحسب السياق. والترجمة المختارة تحافظ على الفعل الجسدي وخطورته، بينما يبيّن رفض بطرس في العدد التالي عدم جواز تلقيه هذا التعظيم، من غير أن تفرض الترجمة وحدها توصيفًا عقائديًا نهائيًا لنية كرنيليوس.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «كرنيليوس» نقلًا للاسم Κορνήλιος، و«خرّ عند قدميه» للمحافظة على الصورة الجسدية، مع حاشية تصون الغموض الدلالي الحقيقي في προσκυνέω.
