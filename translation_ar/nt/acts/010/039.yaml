  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: ar
  text: ونحن شهود على كل ما فعله في أرض اليهود وفي أورشليم. وقد قتلوه أيضًا إذ علّقوه على خشبة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على شجرة»، أو تفسيرًا: «على صليب». واللفظ اليوناني يعني «خشبًا» أو «شجرة»، ولعله يردد صدى تثنية 21:23.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: شهود
  rationale: المقابل العربي الطبيعي في سياق شهادة الرسل العيانية، ويحفظ دلالة الإخبار بما عاينوه.
- source_word: πάντων ὧν ἐποίησεν
  choice: على كل ما فعله
  rationale: صياغة عربية واضحة تحفظ شمول πάντων ووظيفة الجملة الموصولة.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: في أرض اليهود
  rationale: «أرض» تؤدي معنى χώρα بوصفها إقليمًا أو بلادًا، من غير حصرها اصطلاحيًا في الولاية الرومانية «اليهودية».
- source_word: καὶ Ἰερουσαλήμ
  choice: وفي أورشليم
  rationale: أعيد حرف الجر في العربية لسلامة الأسلوب ووضوح العطف، كما يقتضيه المعنى اليوناني.
- source_word: ἀνεῖλαν
  choice: قتلوه
  rationale: مقابل مباشر وطبيعي للفعل بمعنى أماتوه؛ والسياق يبين أن القتل تم بالإعدام صلبًا.
- source_word: κρεμάσαντες
  choice: إذ علّقوه
  rationale: تحفظ الصلة الظرفية/الوسيلية بين اسم الفاعل والفعل الرئيس من غير فرض ترتيب زمني مستقل.
- source_word: ἐπὶ ξύλου
  choice: على خشبة
  rationale: «خشبة» تحفظ معنى ξύλον، أي الخشب أو الشيء الخشبي، وتلائم اصطلاح التعليق الكتابي من غير استبداله تفسيرًا بكلمة «صليب».
theological_decisions:
- issue: ترجمة ξύλου في سياق الصلب
  choice: على خشبة
  alternative: على صليب؛ على شجرة
  rationale: النص اليوناني يستعمل ξύλον لا σταυρός. واختيار «خشبة» يحفظ اللفظ والصدى المحتمل لتثنية 21:23، مع إبقاء كيفية الصلب مفهومة من السياق، من غير إحلال التفسير محل كلمة المصدر.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ومهيبة. استُعملت «أورشليم» وفق التقليد العربي الكتابي الشائع، وحُفظت كثافة العبارة الأصلية من غير توسع تفسيري.
