  source_fidelity: 'الصياغة الحالية تنقل تسلسل الآية ومعاني الأمر، والعماد، والبقاء مدة غير محددة نقلًا جيدًا. لكن «أن يعتمدوا» فعل لازم/مطاوع في العربية وقد يُفهم منه قيامهم بالفعل، بينما βαπτισθῆναι مبني للمجهول صراحةً؛ فالأدق والأوضح: «بأن يُعمَّدوا».'
  naturalness: «فأمر بأن يُعمَّدوا باسم يسوع المسيح» عربية فصحى حديثة واضحة وطبيعية. و«أن يمكث بضعة أيام» سليمة وتحافظ على عدم تحديد العدد تحديدًا دقيقًا.
  terminology: '«باسم يسوع المسيح» هي الصياغة العربية الكتابية الراسخة، وتحفظ العبارة اليونانية من غير تضييق لمعناها. لا حاجة إلى حاشية «أو: يسوع المسيّا»؛ فـ«المسيح» هو المقابل العربي المألوف للقب، و«المسيّا» ليس قراءة نصية بديلة ولا يضيف توضيحًا لازمًا هنا.'
