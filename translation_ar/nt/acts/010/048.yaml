  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: ar
  text: فأمر بأن يُعمَّدوا باسم يسوع المسيح. ثم طلبوا منه أن يمكث بضعة أيام.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέταξεν
  choice: أمر
  rationale: ينقل دلالة الفعل على إصدار توجيه ذي سلطة، وهو تعبير عربي واضح وطبيعي.
- source_word: δὲ
  choice: فـ
  rationale: تؤدي هنا وظيفة الانتقال السردي والنتيجة المتصلة بما سبق، من غير دلالة قوية على الاستدراك.
- source_word: ἐν τῷ ὀνόματι
  choice: باسم
  rationale: يحافظ على الصيغة المألوفة وعلى سعة العبارة التي قد تشمل السلطان والانتماء والابتهال، من دون حصرها في تفسير واحد.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ترجمة عربية راسخة للقب Χριστός، وتحافظ على دلالته اللقبية في صياغة طبيعية.
- source_word: βαπτισθῆναι
  choice: أن يعتمدوا
  rationale: يحافظ على المبني للمجهول دلاليًا في العربية، إذ يُفهم أن آخرين يقومون بتعميدهم، من غير تقييد طريقة المعمودية.
- source_word: τότε
  choice: ثم
  rationale: يدل على تعاقب الحدث التالي في السرد بإيجاز وطبيعية.
- source_word: ἠρώτησαν
  choice: طلبوا
  rationale: السياق يدل على تقديم طلب، و«طلبوا منه» أوضح في العربية من «سألوه» مع المصدر.
- source_word: ἐπιμεῖναι
  choice: أن يمكث
  rationale: ينقل معنى البقاء مدةً إضافية بأسلوب عربي فصيح وواضح.
- source_word: ἡμέρας τινάς
  choice: بضعة أيام
  rationale: يحافظ على عدم تحديد المدة، وهو تعبير عربي طبيعي يفيد عددًا قليلًا غير معيّن.
theological_decisions:
- issue: دلالة Χριστοῦ في صيغة المعمودية
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الموروث والواضح للقب اليوناني Χριστός، ويحفظ كونه لقبًا لا اسم عائلة؛ وتُذكر الصيغة المنقولة «المسيّا» بديلًا لإبراز الخلفية العبرية الآرامية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُعملت «فأمر» لربط الآية بما قبلها، و«ثم» لتتابع الحدث، مع تجنب تفسير عبارة «باسم» تفسيرًا لاهوتيًا أضيق من الأصل.
