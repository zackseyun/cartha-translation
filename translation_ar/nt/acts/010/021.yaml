  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: ar
  text: 'فنزل بطرس إلى الرجال وقال: «ها أنا ذا، أنا الذي تبحثون عنه. ما سبب حضوركم؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: فنزل
  rationale: اسم فاعل ظرفي من فعل يفيد النزول؛ صيغ بالعربية فعلاً ماضياً متسلسلاً مع السرد، مع حفظ معنى الانتقال إلى أسفل.
- source_word: δὲ
  choice: فـ
  rationale: أداة انتقال سردي لا تفيد هنا تضاداً قوياً؛ الفاء طبيعية في تتابع الحدث العربي.
- source_word: πρὸς τοὺς ἄνδρας
  choice: إلى الرجال
  rationale: تحفظ اتجاه الحركة نحو الرجال وتمهّد لمخاطبتهم.
- source_word: Ἰδοὺ
  choice: ها أنا ذا
  rationale: أُدمجت أداة التنبيه مع عبارة التعريف بالنفس في تركيب عربي فصيح وطبيعي يحفظ قوة لفت الانتباه.
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: أنا الذي تبحثون عنه
  rationale: ينقل التعريف الصريح ببطرس بوصفه الشخص المطلوب، بصياغة عربية معاصرة واضحة.
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: ما سبب حضوركم؟
  rationale: يحفظ الاسم الصريح الدال على السبب، ويحافظ على دلالة الفعل في كونهم حاضرين، بدلاً من تحويله إلى فعل مجيء.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، مع تتابع سردي طبيعي وصياغة مباشرة للحوار. لم تُضف حاشية لأن «ما سبب حضوركم؟» تحفظ البنية الدلالية للأصل من غير حاجة إلى بديل تفسيري.
