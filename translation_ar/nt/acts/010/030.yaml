source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: ar
  text: 'فقال كورنيليوس: «قبل أربعة أيام، في مثل هذه الساعة، كنت أصلّي في بيتي عند الساعة التاسعة[a]، وإذا برجل وقف أمامي في ثوب لامع.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي نحو الساعة الثالثة بعد الظهر.
    reason: cultural_note
lexical_decisions:
- source_word: ἔφη
  choice: فقال
  rationale: صيغة الماضي هنا تُدخل كلام كورنيليوس في سياق سردي، و«فقال» هي الصياغة العربية الطبيعية.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: منذ أربعة أيام، في مثل هذه الساعة
  rationale: العبارة اصطلاح زمني يشير إلى اليوم الرابع السابق وإلى الساعة نفسها تقريبًا؛ وهذه الصياغة تنقل المعنى بوضوح من غير أن توهم أن الفعل استمر أربعة أيام.
- source_word: ἤμην ... προσευχόμενος
  choice: كنت أصلّي
  rationale: التركيب المحيطي في الماضي الناقص يدل على فعل كان جاريًا في ذلك الوقت.
- source_word: τὴν ἐνάτην
  choice: عند الساعة التاسعة
  rationale: يحافظ على طريقة حساب الوقت في بيئة النص، مع بيان المقابل الحديث في الحاشية.
- source_word: ἐν τῷ οἴκῳ μου
  choice: في بيتي
  rationale: ترجمة مباشرة وطبيعية للمكان الذي جرت فيه الصلاة.
- source_word: ἰδοὺ
  choice: وإذا
  rationale: «وإذا» تؤدي وظيفة المفاجأة واللفت الحي للانتباه في السرد العربي من غير تكلف.
- source_word: ἀνὴρ
  choice: رجل
  rationale: اللفظ اليوناني مذكر صريح ويصف الهيئة البشرية الذكورية التي ظهر بها الكائن السماوي.
- source_word: ἔστη ἐνώπιόν μου
  choice: وقف أمامي
  rationale: يحافظ على معنى اتخاذ موضع أمام المتكلم بدل تفسير العبارة بمجرد الظهور.
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: في ثوب لامع
  rationale: «ثوب» يقابل الاسم المفرد، و«لامع» ينقل معنى السطوع والإشراق بعبارة عربية واضحة.
theological_decisions:
- issue: تعبير الوقت τὴν ἐνάτην
  choice: عند الساعة التاسعة
  alternative: عند نحو الثالثة بعد الظهر
  rationale: أُبقي تعبير ثقافة المصدر في المتن، ووُضع المقابل بحسب التوقيت الحديث في الحاشية، فلا يُستبدل تعبير النص بتفسيره.
- issue: هوية الرجل ذي الثوب اللامع
  choice: رجل
  alternative: ملاك
  rationale: يصف كورنيليوس هنا ما رآه بلفظ ἀνήρ؛ لذلك لا تُستبدل به هوية تفسيرية وإن كان السياق الأوسع يبين طبيعته السماوية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «في مثل هذه الساعة» لتوضيح الاصطلاح الزمني، و«وإذا» لنقل حيوية ἰδού، مع إبقاء نظام الساعات القديم في المتن.
