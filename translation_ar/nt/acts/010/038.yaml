  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: ar
  text: 'يسوعَ الذي من الناصرة: كيف مسحه الله بالروح القدس وبالقوة؛ فجال يصنع الخير ويشفي جميع الذين كان إبليس يتسلط عليهم، لأن الله كان معه.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة بداية العبارة: «يسوعَ الناصريَّ: كيف مسحه الله...»'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: يسوعَ الذي من الناصرة
  rationale: ينقل عبارة الأصل الدالة على المنشأ، ويحافظ نصب «يسوع» على اتصال الآية بسياق كلام بطرس السابق.
- source_word: ὡς
  choice: كيف
  rationale: تُدخل تفاصيل ما فعله الله بيسوع ضمن بنية التقرير المضغوطة، من غير حملها على معنى المقارنة.
- source_word: ἔχρισεν
  choice: مسحه
  rationale: يحفظ صورة المسح ورنينها المسياني من غير أن يضيف لقبًا أو شرحًا عقائديًا غير مصرح به في النص.
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: بالروح القدس وبالقوة
  rationale: الباء تعبّر طبيعيًا عن الدلالة الوسيلية، وتكرارها يبيّن تمايز الروح القدس والقوة من غير فصل بينهما.
- source_word: διῆλθεν εὐεργετῶν
  choice: كان يجول يصنع الخير
  rationale: يعبّر «يجول» عن نشاط يسوع المتنقل، و«يصنع الخير» صياغة عربية واضحة تحفظ اتساع معنى الإحسان.
- source_word: ἰώμενος πάντας τοὺς καταδυναστευομένους
  choice: ويشفي جميع الذين كان إبليس يتسلط عليهم
  rationale: «يشفي» هو المقابل المباشر، و«يتسلط عليهم» ينقل معنى الخضوع لقهر شديد بلغة عربية طبيعية.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: إبليس
  rationale: اسم «إبليس» هو التعبير العربي الكتابي الواضح عن الكائن الشرير الشخصي المقصود هنا.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: لأن الله كان معه
  rationale: تحفظ «لأن» القوة السببية للعبارة، فلا تجعلها مجرد إضافة تفسيرية رخوة.
theological_decisions:
- issue: علاقة مسح يسوع بهويته ورسالته
  choice: الإبقاء على «مسحه» بلا توسيع عقائدي
  alternative: «عيّنه مسيحًا» أو «منحه القوة» فقط
  rationale: الفعل يصرّح بالمسح ويحمل رنينًا مسيانيًا، لكنه لا يقدّم في هذه الآية شرحًا صريحًا ينبغي إدخاله في المتن.
- issue: مرجع «الروح القدس»
  choice: اعتباره إشارة إلى الروح القدس مع إبقائه متميزًا لفظيًا عن القوة
  alternative: «روحًا مقدسة» بمعنى قوة أو صفة غير شخصية
  rationale: الاستعمال في سفر الأعمال والسياق الذي يعطف القوة على الروح يؤيدان الصياغة الشخصية المألوفة.
- issue: سبب فاعلية خدمة يسوع
  choice: الحفاظ على السببية في «لأن الله كان معه»
  alternative: «إذ كان الله معه» أو صياغة تقلل القوة السببية
  rationale: ὅτι يقدّم أساس أعمال الخير والشفاء، ولا تستلزم العبارة نفي أي تقرير مسيحي آخر عن هوية يسوع.
- issue: البنية النحوية بين ὡς وὃς
  choice: عرض وصفين متتابعين بعد النقطتين والفاصلة المنقوطة
  alternative: جعل العبارة كلها جملة موصولة متداخلة
  rationale: هذا يحفظ ترابط بنية الأصل مع تفادي تركيب عربي متعثر، ويجعل مرجع الوصف اللاحق إلى يسوع واضحًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. أُبقي نصب «يسوعَ» للإشارة إلى اتصال الآية بما قبلها، واستُخدم «كان يجول» لإفادة النشاط المتكرر. وُضع موضع الحاشية [a] في المتن كما يلزم.
