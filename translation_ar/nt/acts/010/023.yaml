  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: ar
  text: فدعاهم إلى الدخول وأضافهم[a]. وفي الغد قام وخرج معهم، ورافقه بعض الإخوة من يافا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «استضافهم» أو «أنزلهم عنده»؛ يدل الفعل اليوناني هنا على إكرام الضيوف بإيوائهم.'
    reason: lexical_alternative
  - marker: b
    text: «الإخوة» ترجمة لصيغة المذكر الجمع اليونانية ἀδελφῶν، وقد تُستعمل هذه الكلمة في المسيحية المبكرة أحيانًا بمعنى أوسع يشمل المؤمنين والمؤمنات.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: دعاهم إلى الدخول
  rationale: ينقل معنى دعوة الرجال إلى داخل موضع إقامته، بصياغة عربية واضحة وطبيعية.
- source_word: οὖν
  choice: فـ
  rationale: تفيد النتيجة والتتابع السردي بإيجاز طبيعي، من غير المبالغة في القوة المنطقية للرابط.
- source_word: ἐξένισεν
  choice: أضافهم
  rationale: الفعل العربي «أضاف» يدل على استقبال الضيف وإيوائه، فيحفظ معنى الضيافة المقصود في السياق.
- source_word: Τῇ δὲ ἐπαύριον
  choice: وفي الغد
  rationale: تعبير عربي فصيح وطبيعي يحدد اليوم التالي ويحفظ الانتقال السردي الذي تؤديه δέ.
- source_word: ἀναστὰς
  choice: قام
  rationale: يحفظ الحركة البسيطة التي يدل عليها اسم الفاعل من غير دمجها في فعل الخروج اللاحق.
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: مقابل مباشر وطبيعي للفعل اليوناني، ويحافظ على تميزه عن «قام».
- source_word: σὺν αὐτοῖς
  choice: معهم
  rationale: ينقل معنى المصاحبة بوضوح وإيجاز.
- source_word: τινες
  choice: بعض
  rationale: مقابل عربي طبيعي لضمير الجمع غير المحدد في هذا السياق السردي.
- source_word: ἀδελφῶν
  choice: الإخوة
  rationale: يحافظ على صيغة المذكر الجمع في النص اليوناني وعلى الاستعمال المسيحي المبكر للفظ القرابة.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: من يافا
  rationale: يحدد منشأ الإخوة بصياغة عربية موجزة، ويستخدم الاسم العربي الشائع للمدينة.
- source_word: συνῆλθον αὐτῷ
  choice: رافقه
  rationale: يفيد أنهم صحبوه في الرحلة، وهو أوضح عربيًا من ترجمة حرفية مثل «اجتمعوا معه» في هذا السياق.
theological_decisions:
- issue: دلالة ἀδελφῶν في سياق جماعة المؤمنين
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: صيغت الكلمة في اليونانية بصيغة المذكر الجمع، لذلك حُفظت في المتن. ومع إمكان استعمالها في المسيحية المبكرة للدلالة الأوسع على جماعة المؤمنين، ذُكر هذا الاحتمال في الحاشية من غير حسم هوية أفراد المجموعة على خلاف صيغة المصدر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أضافهم» بالمعنى الفصيح المتعلق بالضيافة، مع حاشية توضيحية لأنه قد يكون أقل شيوعًا لدى بعض القراء. حُفظ التتابع الحركي «قام وخرج»، واختير «يافا» بوصفه الاسم العربي الشائع لἸόππη.
