lexical_decisions:
- source_word: ἀλλ’
  choice: بل
  rationale: تفيد الاستدراك والمقابلة مع نفي المحاباة في الآية السابقة، و«بل» طبيعية وموجزة في العربية هنا.
- source_word: ἐν παντὶ ἔθνει
  choice: في كل أمة
  rationale: تنقل العبارة المكانية والتوزيعية مباشرة، وتحافظ «أمة» على المعنى الواسع لـἔθνος من غير حصره في المفهوم السياسي الحديث.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: مَن يخافه
  rationale: تنقل اسم الفاعل المعرّف بوصفه دالًا على كل شخص يتصف بذلك، وتحفظ معنى مخافة الله بما فيها من رهبة وتوقير.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: ويعمل البر
  rationale: يحافظ هذا التعبير على الصلة اللفظية بين ἐργάζομαι والعمل، وبين δικαιοσύνη والبر، وهو عربي كتابي واضح من غير إضافة تفسيرية.
- source_word: δικαιοσύνην
  choice: البر
  rationale: «البر» هو المقابل العربي الطبيعي الواسع الذي يشمل الاستقامة والعمل الصائب، مع إبقاء «العدل» بديلًا معجميًا ممكنًا في الحاشية.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: مقبول لديه
  rationale: تنقل «مقبول» الصفة الخبرية δεκτός، و«لديه» علاقة القبول بالله، من غير تقوية العبارة إلى معنى الاستحقاق أو كسب الخلاص.
theological_decisions:
- issue: هل تعلّم الآية نوال الخلاص بالأعمال، أم تصف الشخص الذي يقبله الله بلا محاباة قومية؟
  choice: 'أُبقي تقرير النص كما هو: في كل أمة، مَن يخاف الله ويعمل البر مقبول لديه.'
  alternative: يمكن تفسير العبارة تفسيرًا استحقاقيًا أقوى، أو اعتبار السلوك دليلًا على إيمان مخلّص.
  rationale: لا تحسم اليونانية في هذه الآية وحدها الجدل العقائدي الأوسع؛ لذلك تتجنب الصياغة إضافة ألفاظ مثل «يستحق» أو «يبرهن»، وتحفظ التوتر اللاهوتي في النص.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم «مَن» لتجنب تقييد العبارة بجنس معين، و«يعمل البر» للمحافظة على الصورة اللفظية في الأصل مع بقاء العبارة مفهومة للقارئ المعاصر.
