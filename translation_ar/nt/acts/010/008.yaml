lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: وبعدما شرح
  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل هنا على فعل تم قبل الفعل الرئيس، و«بعدما شرح» ينقل هذا التتابع ويعبّر عن عرض الأمر لهم بوضوح وتفصيل.
- source_word: ἅπαντα
  choice: كلَّ شيء
  rationale: ينقل شمول اللفظة اليونانية بعبارة عربية طبيعية واضحة.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ينقل ضمير المفعول غير المباشر بصياغة عربية مباشرة.
- source_word: ἀπέστειλεν
  choice: أرسلهم
  rationale: ترجمة واضحة ومألوفة للفعل، من دون إضافة إيحاء بالعجلة أو الرسمية.
- source_word: εἰς τὴν Ἰόππην
  choice: إلى يافا
  rationale: حرف الجر يدل على الاتجاه إلى مقصد، و«يافا» هو الاسم العربي المألوف للمدينة.
