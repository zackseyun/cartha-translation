base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: ar
  text: 'رأى بوضوح[a] في رؤيا، نحو الساعة التاسعة من النهار[b]، ملاكَ الله يدخل عليه ويقول له: «يا كرنيليوس!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عيانًا».'
    reason: lexical_alternative
  - marker: b
    text: أي نحو الساعة الثالثة بعد الظهر بحسب حساب الوقت الحديث.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδεν
  choice: رأى
  rationale: فعل ماضٍ سردي مباشر من ὁράω، و«رأى» يحافظ على الطابع العياني للاختبار دون زيادة تفسيرية.
- source_word: ἐν ὁράματι
  choice: في رؤيا
  rationale: تؤدي ὅραμα بمعنى مشهد أو رؤيا ذات طابع فائق للطبيعة، و«في رؤيا» تعبير عربي واضح ومألوف.
- source_word: φανερῶς
  choice: بوضوح
  rationale: الظرف يؤكد أن الرؤية كانت جلية لا ملتبسة. وُضع بعد فعل الرؤية ليظهر تعلقه بالفعل مع الحفاظ على إمكان البديل «عيانًا» في الحاشية.
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: نحو الساعة التاسعة من النهار
  rationale: يحافظ على طريقة حساب الساعات في النص، بينما تنقل «نحو» معنى التقريب في ὡσεὶ وπερὶ دون تكرار ثقيل.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: ملاكًا من عند الله
  rationale: السياق الرؤيوي يدل على كائن ملائكي لا رسول بشري، و«من عند الله» تنقل الصلة بالله بلغة عربية طبيعية دون توسع عقائدي.
- source_word: εἰσελθόντα πρὸς αὐτόν
  choice: يدخل عليه
  rationale: ينقل فعل الدخول إلى حضرة كرنيليوس بصياغة عربية طبيعية، ويحافظ بالمضارع الحكائي على تبعية اسم الفاعل اليوناني لفعل الرؤية.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: ويقول له
  rationale: يحافظ على توازي اسمَي الفاعل في اليونانية مع «يدخل»، ويجعل المشهد متدفقًا وواضحًا بالعربية.
- source_word: Κορνήλιε
  choice: يا كرنيليوس
  rationale: الاسم في صيغة النداء، ولذلك أُظهرت دلالته بأداة النداء العربية «يا» مع الرسم العربي الشائع للاسم.
theological_decisions:
- issue: طبيعة ἄγγελος في السياق
  choice: كائن ملائكي سماوي من عند الله
  alternative: رسول بشري من عند الله
  rationale: ذكر الرؤيا والسياق المباشر يجعلان معنى الملاك السماوي هو المعنى الظاهر، من غير إضافة وصف عقائدي لا يصرح به النص.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. حُفظ تعبير «الساعة التاسعة من النهار» لإبقاء طريقة حساب الزمن في النص الأصلي، مع بيان المقابل الحديث في الحاشية. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرانهما، بدل موضعيهما غير المتطابقين في طبقة الاستشارة الإنجليزية.
