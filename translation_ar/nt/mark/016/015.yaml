  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: ar
  text: 'وقال لهم: «اذهبوا إلى العالم كله، وأعلنوا البشارة[b] للخليقة كلها[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكل مخلوق». تحتمل العبارة اليونانية معنىً توزيعيًّا أو جمعيًّا.'
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا ترجمة «البشارة» بـ«الخبر السار» أو «الإنجيل».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: اذهبوا
  rationale: اسم فاعل ماضٍ يسبق فعل الأمر الرئيس، وله هنا قوة الفعل المصاحب؛ وصيغة الأمر العربية تنقل قوة التكليف بصورة طبيعية أوضح من «إذ تذهبون» أو «بعد أن تذهبوا».
- source_word: κόσμον ἅπαντα
  choice: العالم كله
  rationale: ينقل κόσμος بوصفه نطاق الرسالة، مع إبراز الشمول الذي تدل عليه ἅπαντα، وهو تعبير عربي طبيعي وواضح.
- source_word: κηρύξατε
  choice: نادوا
  rationale: ينقل معنى الإعلان العلني بصوت المنادي في κηρύσσω، من غير حصره في الوعظ الكنسي؛ و«أعلنوا» بديل ممكن.
- source_word: τὸ εὐαγγέλιον
  choice: البشارة
  rationale: «البشارة» تعبير عربي راسخ ومفهوم لمعنى الخبر السار، ويحافظ في الوقت نفسه على الدلالة المسيحية المعروفة للمصطلح.
- source_word: πάσῃ τῇ κτίσει
  choice: للخليقة كلها
  rationale: يحافظ على اتساع لفظ κτίσις وعلى الصياغة الجمعية/الكونية، من غير تضييقه تفسيرياً إلى البشر وحدهم؛ ويمكن فهم العبارة أيضاً على نحو توزيعي.
- source_word: εἶπεν αὐτοῖς
  choice: وقال لهم
  rationale: ترجمة مباشرة وطبيعية لصيغة التقديم السردي، من غير إضافة قوة تفسيرية إلى فعل القول.
theological_decisions:
- issue: نطاق πάσῃ τῇ κτίσει في وصية الإرسال
  choice: للخليقة كلها
  alternative: لكل مخلوق
  rationale: تحتمل العبارة اليونانية معنى جمعياً/كونياً ومعنى توزيعياً. تحافظ الصياغة المختارة على أفقها الواسع من غير قصرها ضمناً على كل إنسان، وتورد الحاشية البديل المشروع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «نادوا» لإبراز الإعلان العلني، و«البشارة» للجمع بين وضوح المعنى والاستعمال المسيحي المألوف. وُضعت علامتا الحاشية عند اللفظين المعنيين مباشرة.
