  text: καὶ ἔλεγον πρὸς ἑαυτάς· Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ⸀ἐκ τῆς θύρας τοῦ μνημείου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: ar
  text: 'وكُنَّ يَقُلْنَ بعضُهُنَّ لبعض: «مَن يُدَحرِجُ لنا الحجرَ عن مدخل القبر؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: كُنَّ يَقُلْنَ
  rationale: صيغة الماضي الناقص اليونانية تصوّر القول بوصفه جاريًا أو متكررًا، ويؤدي تركيب «كُنَّ يَقُلْنَ» هذا الجانب في العربية.
- source_word: πρὸς ἑαυτάς
  choice: بعضُهُنَّ لبعض
  rationale: العبارة حرفيًا «إلى أنفسهن»، لكنها في هذا السياق تحمل معنى تبادل الحديث بين النساء، والتعبير العربي المختار واضح وطبيعي.
- source_word: Τίς
  choice: مَن
  rationale: أداة استفهام عن الشخص الذي سيقوم بالفعل.
- source_word: ἀποκυλίσει
  choice: يُدَحرِجُ
  rationale: الفعل يدل تحديدًا على إزاحة شيء بتدحرجه، ويحافظ الاختيار على الصورة الحسية للحجر.
- source_word: ἡμῖν
  choice: لنا
  rationale: الداتيف هنا يفيد المنفعة، أي مَن يقوم بالفعل من أجلهن.
- source_word: τὸν λίθον
  choice: الحجرَ
  rationale: النص يذكر الحجر دون أن يضيف هنا وصفًا لحجمه، لذلك لا تُزاد كلمة «الكبير».
- source_word: ἐκ τῆς θύρας
  choice: عن مدخل
  rationale: يمكن أن تعني θύρα بابًا أو مدخلًا؛ و«مدخل» أوضح في سياق فتحة قبر، بينما تعبّر «عن» طبيعيًا عن إزاحة الحجر من أمامها.
- source_word: τοῦ μνημείου
  choice: القبر
  rationale: تشير الكلمة في هذا السياق إلى موضع الدفن، و«القبر» هو المقابل العربي الواضح والمألوف.
