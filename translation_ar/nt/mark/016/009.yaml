base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: ar
  text: وبعدما قام[a]، في وقت مبكر من صباح اليوم الأول من الأسبوع، ظهر أولًا لمريم المجدلية، التي كان قد أخرج منها سبعة شياطين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الآيات 9–20 غير موجودة في بعض مخطوطات إنجيل مرقس المبكرة؛ وتوردها مخطوطات أخرى، وأحيانًا مع اختلافات.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: وبعدما قام
  rationale: اسم فاعل ماضٍ ذو دلالة زمنية سابقة للفعل الرئيس؛ «بعدما قام» يوضح التعاقب طبيعيًا، مع واو خفيفة تقابل δὲ في سياق السرد.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة لا تستلزم معنى الاستدراك؛ الواو أنسب لسلاسة السرد العربي ولا تضيف ظرفًا غير موجود مثل «الآن».
- source_word: πρωῒ πρώτῃ σαββάτου
  choice: في صباح اليوم الأول من الأسبوع
  rationale: ينقل πρωῒ بوصفه وقت الصباح المبكر، ويعبّر عن الاصطلاح اليوناني πρώτῃ σαββάτου بصياغة عربية واضحة هي «اليوم الأول من الأسبوع».
- source_word: ἐφάνη
  choice: ظهر
  rationale: الصيغة تُستعمل في سياقات ظهور القائم من الموت، و«ظهر» هي المقابلة العربية الطبيعية دون تحويلها إلى المبني للمجهول.
- source_word: πρῶτον
  choice: أولًا
  rationale: يحفظ دلالة ترتيب الظهورات من غير زيادة تفسيرية.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: لمريم المجدلية
  rationale: يحفظ الاسم واللقب الجغرافي بصيغتهما العربية الكتابية المألوفة، واللام تقابل حالة المجرور الدالة على من ظهر لها.
- source_word: παρ’ ἧς ἐκβεβλήκει
  choice: وهي التي كان قد أخرج منها
  rationale: الماضي الأبعد في «كان قد أخرج» يحفظ سبق إخراج الشياطين على الظهور، والصلة العربية الطبيعية تمنع التباس عائد الموصول.
- source_word: ἑπτὰ δαιμόνια
  choice: سبعة شياطين
  rationale: ترجمة مباشرة للمصطلح في سياق طرد الشياطين، مع إبقاء العدد كما هو.
theological_decisions:
- issue: الوضع النصي لمرقس 16:9 ضمن الخاتمة الطويلة
  choice: ترجمة الآية الواردة في نص SBLGNT مع وضع علامة حاشية عند «قام» للتنبيه إلى الخلاف النصي.
  alternative: تنتهي بعض المخطوطات عند مرقس 16:8 ولا تتضمن 16:9–20، بينما تتضمنها مخطوطات أخرى مع بعض الاختلافات.
  rationale: النص اليوناني المزوَّد يورد الآية داخل أقواس نقدية؛ لذلك تُترجم الآية ولا يُحسم الخلاف النصي ضمن المتن، بل يُعرض للقارئ في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. قُدِّم الفعل الرئيس «ظهر» لتفادي تراكم الظروف في مطلع الجملة، مع الحفاظ على العلاقات الزمنية وترتيب الظهور. استُعملت «شياطين» بوصفها العبارة المباشرة المألوفة في سياق الأناجيل.
