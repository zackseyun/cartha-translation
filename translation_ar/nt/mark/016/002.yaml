- source_word: ἔρχονται
  choice: يأتين
  rationale: حُفظ المضارع التاريخي الذي يميز سرد مرقس ويضفي عليه حيوية. استُعمل جمع المؤنث لأن الفاعل في السياق السابق هو النساء.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: إلى القبر
  rationale: يدل ἐπί مع النصب هنا على الحركة نحو المكان، و«القبر» هو المقابل العربي الطبيعي لـ μνημεῖον في سياق الدفن.
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: وقد طلعت الشمس
  rationale: تنقل العبارة تركيب المضاف إليه المطلق بوصفه ظرفًا زمنيًا مصاحبًا للوصول، وتحفظ كون طلوع الشمس واقعًا عند مجيئهن من غير تحويله إلى تعبير مختصر مثل «عند الشروق».
