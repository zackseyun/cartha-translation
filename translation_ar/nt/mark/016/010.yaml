  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: ar
  text: فذهبت وأخبرت الذين كانوا معه[a]، وهم حزانى ويبكون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فذهبت وأبلغت الذين كانوا معه، وهم حزانى ويبكون».'
    reason: بديل معجمي لـ«أخبرت» يعكس معنى الإبلاغ في ἀπήγγειλεν، مع بقاء مضمون الخبر مفهومًا من السياق كما في اليونانية.
lexical_decisions:
- source_word: ἐκείνη
  choice: فـ
  rationale: الفاعل المؤنث المستتر في «ذهبت» يعود طبيعيًا إلى مريم المجدلية المذكورة في السياق السابق؛ ولا حاجة إلى ترجمة اسم الإشارة حرفيًا بما يثقل العربية.
- source_word: πορευθεῖσα
  choice: ذهبت
  rationale: اسم الفاعل الأوريستي يفيد فعلًا سابقًا للفعل الرئيس، وصيغة «ذهبت وأخبرت» تنقل تتابع الحدثين بوضوح وطبيعية.
- source_word: ἀπήγγειλεν
  choice: وأخبرت
  rationale: ينقل معنى إبلاغ الخبر، مع بقاء مفعول الخبر مفهومًا من السياق كما هو محذوف في اليونانية.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: الذين كانوا معه
  rationale: ترجمة مباشرة وواضحة لعبارة تصف الذين سبق أن كانوا بصحبته.
- source_word: πενθοῦσι
  choice: ينوحون
  rationale: الفعل يدل على الحداد والتفجع بسبب الفقد، و«ينوحون» يلائم سياق الموت والحزن.
- source_word: καὶ κλαίουσιν
  choice: ويبكون
  rationale: ترجمة طبيعية ودقيقة لفعل البكاء، وتحافظ على اقترانه بالحداد.
