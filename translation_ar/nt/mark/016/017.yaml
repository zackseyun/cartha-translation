source:
  edition: SBLGNT
  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: ar
  text: 'وهذه الآيات سترافق[a] الذين آمنوا: باسمي سيُخرجون الشياطين، وسيتكلمون بألسنة[b] جديدة.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ستتبع». يدل الفعل اليوناني هنا على أن هذه الآيات تصاحب الذين آمنوا وتلازمهم، لا على مجرد مجيئها بعدهم زمنيًا.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «بلغات». قد يدل اللفظ اليوناني على اللغات عمومًا، أما «ألسنة» فتحافظ على اتساع دلالة التعبير هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: الآيات
  rationale: تحافظ «الآيات» على معنى العلامات الدالة والخوارق المؤيدة، وهي أضبط من تعبير عام مثل «المعجزات».
- source_word: τοῖς πιστεύσασιν
  choice: الذين آمنوا
  rationale: تنقل صيغة اسم الفاعل الأوريستي بوصفها إيمانًا تحقق، مع بقاء العبارة عامة في دلالتها.
- source_word: ταῦτα
  choice: هذه
  rationale: اسم إشارة مباشر يحيل إلى الآيات المذكورة بعده.
- source_word: παρακολουθήσει
  choice: سترافق
  rationale: يفيد الفعل المصاحبة والملازمة هنا، لا مجرد التتابع الزمني؛ لذلك كانت «سترافق» أوضح من «ستتبع».
- source_word: ἐν τῷ ὀνόματί μου
  choice: باسمي
  rationale: صياغة عربية طبيعية تفيد العمل باسم يسوع وتحت سلطانه، من غير زيادة تفسيرية.
- source_word: δαιμόνια
  choice: الشياطين
  rationale: ينقل اللفظ اليوناني مباشرة، ولا يستبدله بالتعبير القريب لكن المختلف «الأرواح النجسة».
- source_word: ἐκβαλοῦσιν
  choice: سيُخرجون
  rationale: يؤدي معنى الطرد والإخراج في سياق إخراج الشياطين، بصياغة عربية مألوفة.
- source_word: γλώσσαις
  choice: بألسنة
  rationale: يحافظ على صورة اللفظ اليوناني وعلى إمكان دلالته على اللغات أو على ظاهرة الكلام بألسنة، من غير حسم زائد.
- source_word: λαλήσουσιν
  choice: سيتكلمون
  rationale: ترجمة طبيعية ومباشرة لفعل الكلام، وتناسب مستوى العربية الفصحى الواضحة.
- source_word: καιναῖς
  choice: جديدة
  rationale: تنقل معنى الجِدّة في النوع أو الصفة، وتترك طبيعة هذه الجدة مفتوحة كما في الأصل.
theological_decisions:
- issue: المقصود بـ«الألسنة» في عبارة «سيتكلمون بألسنة جديدة»
  choice: إبقاء «ألسنة» في المتن من غير تحديد طبيعتها
  alternative: لغات؛ أو كلام ذو طبيعة وجدانية/خارقة
  rationale: يمكن أن تدل γλῶσσα على اللسان أو اللغة، ولا يحدد هذا النص وحده الظاهرة تحديدًا يحسم الخلاف؛ لذا تحافظ الصياغة على الغموض الحقيقي ولا تستورد قراءة طائفية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «الآيات» للمحافظة على البعد الدلالي للعلامة المؤيدة، و«بألسنة» لصون الغموض المقصود في الأصل. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
