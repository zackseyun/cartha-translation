  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: ar
  text: مَنْ آمن واعتمد سيخلُص[a][b]، أمّا مَنْ لم يؤمن فسيُدان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصياغة تُظهر المبني للمجهول بوضوح أكبر: «مَنْ آمن ونال المعمودية سيخلُص».'
    reason: lexical_alternative
  - marker: b
    text: تجمع العبارة اليونانية بين الإيمان والمعمودية في وصف مَنْ سيخلُص، بينما يذكر الشطر الثاني عدم الإيمان وحده أساسًا للدينونة.
    reason: theological_tension
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: مَنْ آمن
  rationale: اسم الفاعل الأوريستي المسبوق بأداة التعريف مستعمل استعمالًا اسميًا عامًا. «مَنْ آمن» عربية طبيعية تحفظ الإفراد التمثيلي ودلالة الفعل، من غير حصر المرجع في الذكور.
- source_word: βαπτισθεὶς
  choice: واعتمد
  rationale: اسم فاعل أوريستي مبني للمجهول من βαπτίζω، ومعناه هنا قبول المعمودية. الفعل العربي «اعتمد» هو التعبير الكتابي الاصطلاحي الطبيعي، وصيغته لا تُظهر المبني للمجهول صرفيًا كما في اليونانية، لذلك يُذكر البديل الأصرح في الحاشية.
- source_word: σωθήσεται
  choice: سيخلُص
  rationale: مستقبل مبني للمجهول ذو معنى خلاصي في السياق. «سيخلُص» المقابل العربي الراسخ والطبيعي، من غير إضافة تفسير عقائدي.
- source_word: ὁ δὲ ἀπιστήσας
  choice: أمّا مَنْ لم يؤمن
  rationale: يحفظ المقابلة مع «آمن» بصياغة عربية واضحة. النفي العربي «لم يؤمن» أنسب من صياغة حرفية مثل «كفر» قد تحمل إيحاءات أوسع من الفعل اليوناني هنا.
- source_word: κατακριθήσεται
  choice: فسيُدان
  rationale: ينقل المستقبل المبني للمجهول والدينونة السلبية التي يدل عليها κατακρίνω بإيجاز ووضوح.
- source_word: καὶ
  choice: و
  rationale: تربط الفعلين اللذين يصفان الشخص نفسه من غير زيادة سببية أو تأكيد غير موجودين في النص.
- source_word: δὲ
  choice: أمّا ... فـ
  rationale: هذه البنية العربية تؤدي المقابلة بين شطري القول بصورة طبيعية أوضح من «لكن» في هذا التركيب.
theological_decisions:
- issue: علاقة الإيمان والمعمودية بالخلاص
  choice: إبقاء الإيمان والمعمودية معطوفين في وصف مَنْ سيخلُص، مع إبقاء سبب الدينونة في الشطر الثاني عدم الإيمان كما ورد.
  alternative: التصريح بأن المعمودية علة آلية لازمة للخلاص، أو تهميشها بوصفها أمرًا عرضيًا لا يدخل في وصف الشخص.
  rationale: النص اليوناني يجمع بين الإيمان والمعمودية في الشطر الأول، لكنه يذكر عدم الإيمان وحده في الشطر الثاني. تحافظ الترجمة على هذا التوتر من غير حسم مذهبي زائد.
- issue: المفرد المذكر التمثيلي
  choice: استعمال «مَنْ» مع فعل مفرد.
  alternative: استعمال جمع مثل «الذين يؤمنون»، أو تعبير اسمي مذكر قد يوحي باختصاص الرجال.
  rationale: «مَنْ» تنقل العموم الذي تؤديه أسماء الفاعل المذكرة المفردة في اليونانية، وتحفظ بناء المفرد في عربية طبيعية من غير قصر المرجع على الذكور.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. اختير «اعتمد» بوصفه الاصطلاح الكتابي العربي المألوف، مع حاشية توضّح صيغة المبني للمجهول في الأصل. وُضعت علامتا الحاشيتين بعد جملة الخلاص لأنهما تتصلان بالتركيب كله.
