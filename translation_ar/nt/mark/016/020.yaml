  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: ar
  text: فخرجوا وكرزوا في كل مكان، وكان الرب يعمل معهم ويؤكد الرسالة[a] بالآيات المصاحبة[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الكلمة». اللفظة اليونانية λόγος تعني «كلمة» أيضاً، لكنها تشير هنا إلى الرسالة المُعلَنة.
    reason: lexical_alternative
  - marker: b
    text: أو «بالآيات التي تبعت». يمكن أن يدل التعبير اليوناني على الآيات المصاحبة أو التابعة، ولا يصرّح هنا بما كانت تتبعه.
    reason: lexical_alternative
  - marker: c
    text: مرقس 16:9-20، المعروف بالخاتمة الطويلة، غير موجود في بعض أقدم الشواهد، مع أنه موجود في شواهد كثيرة أخرى. ويضعه نص SBLGNT بين علامتين نقديتين.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: أَمَّا هُمْ
  rationale: تفيد العبارة انتقال التركيز إلى التلاميذ بعد ذكر الرب في الآية السابقة، من غير تحميل δέ معنى تعارض قوي.
- source_word: ἐξελθόντες
  choice: فَخَرَجُوا
  rationale: صيغ اسم الفاعل اليوناني هنا فعلاً سردياً تابعاً للفعل الرئيس، وهذا طبيعي ودقيق في العربية.
- source_word: ἐκήρυξαν
  choice: وَنَادَوْا
  rationale: يدل الفعل على إعلان علني؛ و«نادوا» يحفظ صورة المناداة من غير حصرها في الوعظ الكنسي.
- source_word: πανταχοῦ
  choice: فِي كُلِّ مَكَانٍ
  rationale: تعبير عربي واضح وطبيعي يقابل معنى «في كل موضع».
- source_word: τοῦ κυρίου συνεργοῦντος
  choice: وَكَانَ الرَّبُّ يَعْمَلُ مَعَهُمْ
  rationale: ينقل تركيب المضاف المطلق بوصفه عملاً متزامناً مستمراً، ويحفظ معنى المشاركة الكامن في συνεργέω.
- source_word: τὸν λόγον
  choice: الرِّسَالَةَ
  rationale: المقصود في السياق مضمون ما أُعلن، لا لفظة مفردة؛ وأُبقي البديل الحرفي «الكلمة» في الحاشية.
- source_word: βεβαιοῦντος
  choice: وَيُثَبِّتُ
  rationale: ينقل معنى التأكيد وإقامة الدليل على صدق الرسالة.
- source_word: διὰ τῶν ἐπακολουθούντων σημείων
  choice: بِالْآيَاتِ الْمُصَاحِبَةِ
  rationale: الباء تفيد الوسيلة، و«المصاحبة» تحافظ على مرونة ἐπακολουθέω بين المصاحبة والتبعية من غير تعيين صريح لما تتبعه الآيات.
theological_decisions:
- issue: مرجع لقب «الرب»
  choice: الإبقاء على «الرب» مع فهمه سياقياً على أنه يسوع القائم المذكور في مرقس 16:19.
  alternative: أن يدل اللقب على الله بوجه أعم.
  rationale: السياق المباشر يرجح الإشارة إلى يسوع، لكن الترجمة لا تضيف اسمه إلى النص ولا تلغي سعة اللقب.
- issue: وظيفة الآيات
  choice: الآيات وسيلة يثبت بها الرب الرسالة المعلنة.
  alternative: أن تكون الآيات قد تبعت المنادين فحسب من غير إبراز وظيفة الإثبات.
  rationale: يربط التركيب النحوي الآيات بالفعل «يثبت»، ولذلك تظهر وظيفتها التصديقية، من غير استنتاج شيء عن استمرارها أو معياريتها خارج هذا السياق.
- issue: الخاتمة الطويلة لإنجيل مرقس
  choice: إبقاء الآية في المتن مع تنبيه نصي إلى وضع مرقس 16:9-20 في الشواهد المخطوطية.
  alternative: حذف الفقرة من المتن أو عرضها بلا تنبيه.
  rationale: علامة الإغلاق في نص SBLGNT تشير إلى أن المقطع موضوع بين علامتي نقد نصي؛ والتنبيه يحفظ شفافية الدليل من غير حسم يتجاوز المعطيات.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُعمل «نادوا» للدلالة على الإعلان العلني، و«الرسالة» لوضوح المقصود، مع حفظ البدائل الحرفية والالتباس الحقيقي في الحواشي.
