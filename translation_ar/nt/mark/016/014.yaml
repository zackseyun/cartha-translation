  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: ar
  text: وبعد ذلك[a] ظهر للأحد عشر وهم متكئون للطعام[b]، ووبّخهم على عدم إيمانهم وقساوة قلوبهم، لأنهم لم يصدّقوا الذين رأوه وقد أُقيم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وفيما بعد».'
    reason: lexical_alternative
  - marker: b
    text: يشير اللفظ اليوناني إلى وضع الاتكاء المعتاد عند تناول الطعام في ذلك العصر.
    reason: cultural_note
  - marker: c
    text: 'أو: «الذين رأوه مُقامًا». واليونانية تقول بصورة أقرب إلى اللفظ: «الذين رأوه وقد أُقيم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: وبعد ذلك
  rationale: تعبير زمني عربي طبيعي يدل على ظهور لاحق، ويحفظ تسلسل الأحداث دون تكلّف.
- source_word: ἀνακειμένοις
  choice: وهم متكئون للطعام
  rationale: ينقل وضع الاتكاء المعتاد عند تناول الطعام في ذلك العصر، ويُظهر سياق الأكل بوضوح للقارئ الحديث.
- source_word: τοῖς ἕνδεκα
  choice: للأحد عشر
  rationale: يشير إلى جماعة التلاميذ المعروفة بعد غياب يهوذا. لا تستلزم صيغة αὐτοῖς في هذا التركيب توكيدًا عربيًا من نوع «أنفسهم».
- source_word: ἐφανερώθη
  choice: ظهر
  rationale: المقابل العربي الطبيعي في سياق ظهورات يسوع بعد القيامة، مع الحفاظ على معنى صيرورته منظورًا لهم.
- source_word: ὠνείδισεν
  choice: وبّخهم
  rationale: يفيد اللوم القوي المباشر بلغة عربية واضحة ومعاصرة.
- source_word: ἀπιστίαν
  choice: عدم إيمانهم
  rationale: يناسب السياق الذي يتحدث عن امتناعهم عن تصديق شهادة من رأوه.
- source_word: σκληροκαρδίαν
  choice: قساوة قلوبهم
  rationale: يحفظ الصورة الكتابية الدالة على المقاومة الداخلية بدل اختزالها في «العناد».
- source_word: θεασαμένοις
  choice: الذين رأوه
  rationale: صياغة مباشرة تنقل دلالة شهود العيان دون زيادة تفسيرية.
- source_word: ἐγηγερμένον
  choice: وقد أُقيم
  rationale: يحفظ صيغة اسم المفعول التام المبني للمجهول ودلالتها على أن الإقامة حدثت قبل رؤيتهم له، من غير تعيين الفاعل الذي لم يصرح به النص.
- source_word: οὐκ ἐπίστευσαν
  choice: لم يصدّقوا
  rationale: الفعل «صدّق» ملائم هنا لأن مفعول الإيمان هو شهادة الأشخاص الذين رأوه، كما أن «لم» تضع عدم التصديق قبل هذا الظهور.
theological_decisions:
- issue: صياغة القيامة في ἐγηγερμένον
  choice: وقد أُقيم
  alternative: وقد قام
  rationale: يحفظ الاختيار صيغة المبني للمجهول في اليونانية والتوتر المقصود في العبارة، دون تحويلها بصمت إلى صيغة لازمة أو تسمية الفاعل.
- issue: دلالة σκληροκαρδία
  choice: قساوة قلوبهم
  alternative: عنادهم
  rationale: الإبقاء على استعارة القلب يحفظ رنينها الكتابي ودلالتها على مقاومة داخلية، بدل تسطيحها إلى وصف سلوكي فقط.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظت استعارة «قساوة القلب» وصيغة المبني للمجهول في خبر القيامة، مع تجنب الإضافات المذهبية أو التفسيرية غير المصرح بها في النص.
