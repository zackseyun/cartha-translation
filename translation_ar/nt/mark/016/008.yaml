  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: ar
  text: فخرجن وهربن من القبر[a]، لأن الارتعاد والذهول استوليا عليهن. ولم يقلن لأحد شيئًا، لأنهن كنَّ خائفات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تضيف بعض المخطوطات ما يُسمّى «الخاتمة القصيرة»: «وأبلغن بإيجاز الذين مع بطرس بكل ما أُمرن به. وبعد ذلك أرسل يسوع نفسه أيضًا بواسطتهن، من المشرق إلى المغرب، كرازة الخلاص الأبدي المقدسة التي لا تزول. آمين».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: فخرجن
  rationale: صيغة مؤنث جمع تشير إلى النساء، وترجمتها بالفعل الماضي مع الفاء تحفظ تتابع الخروج والهرب بأسلوب عربي طبيعي.
- source_word: ἔφυγον
  choice: وهربن
  rationale: تنقل قوة الفعل الدال على الفرار بوضوح، من غير إضافة تفصيل مثل الركض.
- source_word: μνημείου
  choice: القبر
  rationale: هو المقابل العربي المألوف والدقيق في سياق دفن يسوع وقيامته.
- source_word: εἶχεν αὐτὰς
  choice: استولى عليهن
  rationale: ينقل التعبير الاصطلاحي الذي يفيد أن الارتعاد والذهول تمكنا منهن، بدل الترجمة الحرفية غير الطبيعية.
- source_word: τρόμος
  choice: الارتعاد
  rationale: يحفظ معنى الرجفة الجسدية الناشئة عن الخوف، ويميّزه عن ذكر الخوف الصريح في ختام الآية.
- source_word: ἔκστασις
  choice: الذهول
  rationale: يدل هنا على الصدمة والحيرة التي تجعل المرء كأنه خارج عن نفسه، ويتجنب الإيحاء الحديث غير الملائم لكلمة «نشوة».
- source_word: οὐδενὶ οὐδὲν
  choice: لم يقلن لأحد شيئًا
  rationale: صياغة عربية طبيعية تحفظ النفي الشامل والمؤكد في الأصل.
- source_word: ἐφοβοῦντο
  choice: كنَّ خائفات
  rationale: تحفظ حالة الخوف المستمرة التي تفيدها صيغة الماضي الناقص، مع مطابقة المرجع المؤنث الجمع.
- source_word: γάρ
  choice: فقد / لأن
  rationale: نُقلت الأداة السببية الأولى بـ«فقد» لبيان سبب الفرار بسلاسة، والثانية بـ«لأن» لإبقاء التعليل الختامي واضحًا من غير حذف.
theological_decisions:
- issue: معاملة الخاتمة القصيرة الموضوعة بين قوسين مزدوجين بعد مرقس 16:8
  choice: عدم إدراجها في متن الآية، مع إثباتها كاملة في حاشية بوصفها قراءة مخطوطية زائدة
  alternative: إدراج الخاتمة القصيرة في المتن، أو طباعة الخواتيم المختلفة كلها ضمن المتن
  rationale: يضعها SBLGNT بين قوسين مزدوجين، بما يدل على أنها ليست من النص الرئيس المعتمد هنا. وإثباتها في الحاشية يصون الشفافية بشأن الشاهد النصي من غير مساواتها بالمتن.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم التأنيث الجمع صراحة لأن الأفعال والضمائر اليونانية تشير إلى النساء، وحُفظ توتر السرد بين الارتعاد والذهول والخوف من غير تفسير لاهوتي زائد.
