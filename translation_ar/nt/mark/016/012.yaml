source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: ar
  text: وبعد ذلك ظهر في هيئة مختلفة[a] لاثنين منهم، بينما كانا يمشيان في طريقهما إلى الريف[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في هيئة أخرى».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إلى حقل»؛ وتعكس عبارة «إلى الريف» المعنى المرجح لكلمة ἀγρός في هذا السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: وبعد ذلك
  rationale: ينقل التعاقب الزمني الذي تفيده μετά مع اسم الإشارة، ويعبّر عن δέ الاستئنافية بالواو في صياغة عربية طبيعية.
- source_word: δυσὶν ἐξ αὐτῶν
  choice: لاثنين منهم
  rationale: يبين أن الشخصين من الجماعة المذكورة، من غير تكلف حرفي مثل «لاثنين من بينهم».
- source_word: περιπατοῦσιν
  choice: بينما كانا يمشيان
  rationale: ينقل الفعل المستمر المعاصر للظهور، مع مراعاة التثنية في العربية.
- source_word: ἐφανερώθη
  choice: ظهر
  rationale: هذا هو المقابل العربي الطبيعي في سياق الظهور بعد القيامة، ولا يضيف تفسيرًا لكيفية الظهور.
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: في هيئة مختلفة
  rationale: يحفظ معنى المغايرة في ἑτέρᾳ ودلالة μορφή على الهيئة أو الصورة الظاهرة، من دون تحديد طبيعة الاختلاف.
- source_word: πορευομένοις
  choice: في طريقهما
  rationale: ينقل معنى السير المقصود نحو وجهة، ويتجنب تكرار «يمشيان... ذاهبين» الثقيل في العربية.
- source_word: εἰς ἀγρόν
  choice: إلى الريف
  rationale: يعكس المعنى المرجح لـἀγρός هنا بوصفه منطقة ريفية، مع إبقاء معنى «حقل» في الحاشية لأنه ممكن معجميًا.
theological_decisions:
- issue: طبيعة الظهور بعد القيامة في عبارة ἐν ἑτέρᾳ μορφῇ
  choice: في هيئة مختلفة
  alternative: في هيئة أخرى؛ بمظهر مختلف
  rationale: يقرر النص وجود اختلاف في الهيئة، لكنه لا يوضح هل كان ذلك تغيرًا في المظهر أم في الإدراك أو التعرف؛ لذلك تُحفظ العبارة وصفية من غير حسم تفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي انسجام التثنية في «كانا يمشيان» و«طريقهما»، ووُضعت علامتا الحاشيتين بجوار العبارتين اللتين تخصانهما.
