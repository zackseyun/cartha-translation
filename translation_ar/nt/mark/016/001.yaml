base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: ar
  text: وبعدما انقضى السبت، اشترت مريم المجدلية، ومريم المرتبطة بيعقوب[a]، وسالومة أطيابًا لكي يأتين ويمسحنه بالأطياب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «مريم التي ليعقوب»، أي مريم المعرَّفة بعلاقتها بيعقوب من غير تحديد نوع هذه العلاقة؛ ويُفهم تقليديًا أنها أمه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: بعدما انقضى السبت
  rationale: ينقل تركيب الإضافة المطلقة الدال على زمن سابق للفعل الرئيس بصياغة عربية طبيعية وواضحة.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: مريم المجدلية
  rationale: الصيغة العربية المألوفة للاسم والنسبة إلى مجدل.
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: مريم التي ليعقوب
  rationale: يحافظ على إبهام العبارة اليونانية الناقصة، التي تعرّف مريم بعلاقتها بيعقوب من غير أن تصرّح بطبيعة تلك العلاقة؛ وتوضح الحاشية أن الأمومة هي الفهم التقليدي المرجح.
- source_word: Σαλώμη
  choice: سالومة
  rationale: نقل عربي واضح للاسم اليوناني Σαλώμη.
- source_word: ἠγόρασαν
  choice: اشترت
  rationale: الفعل في اليونانية جمع، لكن العربية الفصحى تطابق الفعل المفرد المؤنث مع فاعل جمع غير عاقل لفظًا أو مع فاعل مؤخر متعدد الأسماء بحسب الأسلوب؛ وهنا «اشترت» مع الفاعل المؤخر المركب صياغة عربية سليمة وطبيعية.
- source_word: ἀρώματα
  choice: أطيابًا
  rationale: يدل اللفظ على مواد عطرية استُخدمت في تجهيز الجسد للدفن؛ و«أطياب» أدق في هذا السياق من «توابل» الحديثة.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: لكي يأتين ويدهنّه بها
  rationale: تحفظ «لكي» معنى الغرض، وتنقل «يأتين ويدهنّه» تعاقب الفعلين بصورة عربية طبيعية، بينما يبين الضمير «بها» أن الدهن بالأطياب المذكورة.
theological_decisions:
- issue: تحديد علاقة مريم بيعقوب في العبارة الناقصة Μαρία ἡ τοῦ Ἰακώβου
  choice: مريم التي ليعقوب
  alternative: مريم أم يعقوب
  rationale: الأصل اليوناني يقول حرفيًا «مريم التي ليعقوب» ولا يذكر لفظ «أم». ولأن الأمومة تفسير سياقي تقليدي لا تصريح لفظي، حُفظ الإبهام في المتن ووُضع التفسير الأرجح في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «أطياب» للسياق الجنائزي، وحُفظ الإبهام الحقيقي في صلة مريم بيعقوب مع شرحه في حاشية.
