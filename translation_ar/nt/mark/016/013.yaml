  text: κἀκεῖνοι ἀπελθόντες ἀπήγγειλαν τοῖς λοιποῖς· οὐδὲ ἐκείνοις ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: ar
  text: فذهبا وأخبرا الباقين[a]، لكنهم لم يصدقوهما أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الآخرين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: فـ...هما
  rationale: تفيد الصيغة «وأولئك أيضًا» أو «وهما»، ويعود الضمير في السياق إلى التلميذين المذكورين قبلًا. استُعمل ضمير المثنى الطبيعي في العربية من غير إضافة وصف غير مصرح به في اليونانية.
- source_word: ἀπελθόντες
  choice: ذهبا
  rationale: اسم الفاعل الأوريستي يدل على ذهابهما قبل الإخبار؛ وصيغة الفعل المتتابع طبيعية في العربية وتحفظ ترتيب الحدثين.
- source_word: ἀπήγγειλαν
  choice: أخبرا
  rationale: ينقل معنى إبلاغ الخبر أو روايته، والمفعول مفهوم من السياق كما هو محذوف في اليونانية.
- source_word: τοῖς λοιποῖς
  choice: الباقين
  rationale: يشير إلى بقية الجماعة، وهو تعبير عربي موجز وطبيعي. ويمكن أيضًا ترجمته «الآخرين».
- source_word: οὐδὲ
  choice: لكنهم لم... أيضًا
  rationale: 'تحفظ «لكن» التحول المخالف في السرد، وتنقل «أيضًا» القوة الإضافية للأداة: لم يصدق هؤلاء كذلك.'
- source_word: ἐκείνοις
  choice: هما
  rationale: ضمير مثنى يعود إلى التلميذين اللذين نقلا الخبر، وهو أدق من ضمير الجمع في العربية.
- source_word: ἐπίστευσαν
  choice: يصدقوهما
  rationale: الفعل هنا يتعلق بقبول شهادة المخبرين، ولذلك فـ«صدّق» أوضح من «آمن» أو «وثق» في هذا السياق السردي.
theological_decisions:
- issue: دلالة πιστεύω في سياق الشهادة السردية
  choice: لم يصدقوهما
  alternative: لم يؤمنوا بهما / لم يثقوا بهما
  rationale: المقصود رفض الخبر الذي نقله التلميذان، لا تقرير معنى اصطلاحي للإيمان ولا نفي الثقة الشخصية بهما؛ لذا يحفظ «يصدقوهما» المعنى السياقي المباشر.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. روعي المثنى لأن المرجع في السياق شخصان، مع الحفاظ على حذف مفعول «أخبرا» كما في النص اليوناني، إذ يُفهم الخبر من السياق.
