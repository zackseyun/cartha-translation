lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: ورفعن أنظارهن
  rationale: ينقل اسم الفاعل الماضي بمعنى توجيه النظر إلى أعلى أو نحو القبر، بصياغة عربية طبيعية واضحة.
- source_word: θεωροῦσιν
  choice: فرأين
  rationale: المضارع السردي يدل هنا على الإدراك البصري؛ وصيغة الماضي أنسب للسرد العربي، والفاء تصل الفعل بما سبقه طبيعيًا.
- source_word: ὅτι
  choice: أن
  rationale: تُدخل مضمون ما رأينه كما في اليونانية.
- source_word: ἀποκεκύλισται
  choice: قد دُحرج
  rationale: صيغة «قد» مع المبني للمجهول تعبّر عن فعل مكتمل كانت نتيجته قائمة حين رأين الحجر، من غير تعيين فاعل.
- source_word: ὁ λίθος
  choice: الحجر
  rationale: ترجمة مباشرة كافية في السياق، بلا إضافة وصف «القبر» غير الوارد صراحة هنا.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: لأنه كان كبيرًا جدًا
  rationale: تحفظ «لأن» القوة التفسيرية لـγάρ، وتنقل «كبيرًا جدًا» تشديد σφόδρα بلغة عربية مألوفة.
- source_word: καὶ
  choice: و
  rationale: تحفظ أداة الوصل واستمرار مجرى السرد.
