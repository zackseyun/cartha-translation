  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: ar
  text: فلما سمعوا أنه حيّ، وأنها رأته، لم يصدّقوا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأنه شوهد من قِبلها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: فلما ... ـوا
  rationale: تفيد الكلمة اليونانية استمرار السرد والإشارة إلى الجماعة المذكورة قبلاً. صيغ الجمع في العربية تُظهر المرجع طبيعيًا، والفاء تصل الآية بما قبلها دون إثقال العبارة بضمير منفصل.
- source_word: ἀκούσαντες
  choice: لما سمعوا
  rationale: اسم الفاعل الأوريستي هنا ذو دلالة زمنية، و«لما سمعوا» تعبّر بوضوح عن وقوع السماع قبل عدم التصديق.
- source_word: ὅτι
  choice: أن
  rationale: تُدخل مضمون الخبر المسموع بصورة عربية طبيعية.
- source_word: ζῇ
  choice: حيّ
  rationale: الفعل اليوناني مضارع ويدل على كونه حيًا. الخبر الاسمي العربي «أنه حيّ» طبيعي بعد فعل السماع ولا يحوّل المعنى إلى زمن ماضٍ.
- source_word: καὶ
  choice: و
  rationale: 'تعطف الخبر الثاني على الأول: كونه حيًا ورؤيتها إياه.'
- source_word: ἐθεάθη ὑπ’ αὐτῆς
  choice: أنها رأته
  rationale: 'الصيغة اليونانية مبنية للمجهول حرفيًا: «أنه شوهد منها/بواسطتها»، لكن العربية الطبيعية تعبّر عن المعنى نفسه بالمعلوم «أنها رأته». لا تُحوَّل إلى «ظهر لها» لأن ذلك قد يزيد معنى الظهور الذاتي الذي لا تفرضه الصيغة.'
- source_word: ἠπίστησαν
  choice: لم يصدّقوا
  rationale: ينقل عدم تصديقهم للخبر بعبارة عربية مباشرة، من غير إضافة معنى العناد أو الرفض المتعمد.
theological_decisions:
- issue: التعبير عن حياة يسوع بعد القيامة
  choice: أنه حيّ
  alternative: أنه يحيا
  rationale: يحافظ «حيّ» على دلالة المضارع اليوناني، أي استمرار الحياة، ويأتي طبيعيًا في العربية بعد «سمعوا». لا تحسم الصياغة ما يتجاوز تقرير أنه حي.
- issue: دلالة ἐθεάθη وصلة مريم برؤية يسوع
  choice: أنها رأته
  alternative: أنه شوهد منها؛ أنه ظهر لها
  rationale: اختير البناء للمعلوم لأنه الأفصح في العربية مع الحفاظ على منظور رؤيتها له. أما «ظهر لها» فممكن سياقيًا لكنه قد ينقل الفعل من معنى الرؤية إلى معنى الظهور من جانبه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. استُخدمت الفاء مع «لما» لربط الحدث بالسياق السابق، وحُفظ المضارع اليوناني في خبر اسمي يدل على استمرار الحياة. وُضعت علامة الحاشية في المتن بعد الجملة التي تتناول البديل اللفظي.
