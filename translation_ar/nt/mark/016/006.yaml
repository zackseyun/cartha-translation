  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: ar
  text: 'فقال لهنّ: «لا ترتعبن. أنتنّ تطلبن يسوع الناصريّ[a]، المصلوب. لقد أُقيم؛ ليس هو ههنا[b]. انظرن، هذا هو الموضع الذي وضعوه فيه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يسوع من الناصرة». تستعمل اليونانية صفة مشتقة من اسم الناصرة لقبًا له.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن يُترجم أيضًا: «قام» أو «قد قام». والفعل اليوناني مبني للمجهول، ومعناه الحرفي: «لقد أُقيم».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: ترتعبن
  rationale: يفيد الفعل اضطرابًا وخوفًا شديدين، و«ترتعبن» واضحة وطبيعية في السياق، ولا تختزله في مجرد الدهشة.
- source_word: Ναζαρηνὸν
  choice: الناصري
  rationale: يحافظ على الصفة اليونانية المستعملة لقبًا منسوبًا إلى الناصرة، بدل تحويلها في المتن إلى عبارة تفسيرية.
- source_word: ἐσταυρωμένον
  choice: الذي صُلب
  rationale: صياغة عربية طبيعية تحفظ المبني للمجهول وإحالة النعت إلى يسوع، وإن كانت العربية لا تنقل تمامًا دلالة اسم المفعول اليوناني التام.
- source_word: ἠγέρθη
  choice: لقد أُقيم
  rationale: يحفظ صيغة المبني للمجهول في اليونانية ودلالة الحدث المنجز، من غير التصريح بفاعل لم يذكره النص.
- source_word: ὧδε
  choice: ههنا
  rationale: مقابل مكاني مباشر، فصيح وواضح، يناسب النبرة المهيبة من غير غموض.
- source_word: ἴδε
  choice: انظرن
  rationale: الأمر اليوناني مفرد في الصيغة لكنه موجَّه إلى جماعة النساء بحسب السياق؛ الجمع المؤنث هو التعبير العربي الطبيعي الواضح.
- source_word: τόπος
  choice: الموضع
  rationale: ينقل المعنى المكاني الملموس بعبارة عربية فصيحة ملائمة لموضع الدفن.
- source_word: ἔθηκαν
  choice: وضعوه
  rationale: ينقل فعل الوضع بصيغة الجمع ويحافظ على عدم تسمية الفاعلين كما في اليونانية.
- source_word: ζητεῖτε
  choice: تطلبن
  rationale: مضارع موجَّه إلى جمع مؤنث، وينقل معنى البحث عن شخص بلغة عربية طبيعية.
- source_word: λέγει αὐταῖς
  choice: فقال لهنّ
  rationale: استُعمل الماضي لأنه الأسلوب الطبيعي في السرد العربي؛ والفاء تصل الكلام بما قبله، مع أن اليونانية تستعمل المضارع التاريخي لإضفاء الحيوية.
theological_decisions:
- issue: صياغة القيامة وصيغة الفعل
  choice: لقد أُقيم
  alternative: قام؛ قد قام؛ أُقيم من الموت
  rationale: النص اليوناني مبني للمجهول، فحُفظ ذلك لتبقى الإشارة الضمنية إلى فعل الله من غير إضافة فاعل أو عبارة «من الموت» غير المصرح بها هنا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. روعي خطاب جمع المؤنث في «ترتعبن، أنتنّ، تطلبن، انظرن»، وحُفظ المبني للمجهول في إعلان القيامة. استُعمل الماضي السردي العربي في «فقال» بدل المضارع التاريخي اليوناني لسلامة الأسلوب.
