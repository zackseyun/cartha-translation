source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: ar
  text: ولمّا دخلن القبر، رأين شابًّا جالسًا عن اليمين، لابسًا ثوبًا أبيض، فأخذهن الذهول.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ملاك». يصفه مرقس هنا بأنه «شاب»، مع أن السياق الأوسع والروايات الموازية يفهم منها أنه رسول ملائكي.
    reason: توضيح الهوية المحتملة مع إبقاء الوصف الأصلي في المتن.
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: ولمّا دخلن
  rationale: اسم فاعل ماضٍ مؤنث جمع يعود إلى النساء، وصيغته الزمنية «لمّا دخلن» طبيعية في العربية وتحفظ علاقته بالفعل الرئيس.
- source_word: μνημεῖον
  choice: القبر
  rationale: يدل في سياق الدفن والقيامة على موضع الدفن، و«القبر» هو التعبير العربي الواضح المألوف.
- source_word: νεανίσκον
  choice: شابًّا
  rationale: اللفظ اليوناني يصف ذكرًا شابًّا ولا يصرّح في هذه الآية بأنه ملاك، لذلك تُحفظ الصياغة السردية كما هي.
- source_word: καθήμενον
  choice: جالسًا
  rationale: ينقل هيئة الشاب كما يصفها اسم الفاعل المضارع بعبارة عربية مباشرة.
- source_word: ἐν τοῖς δεξιοῖς
  choice: عن اليمين
  rationale: تعبير مكاني عربي طبيعي يدل على موضعه في الجانب الأيمن داخل القبر.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: لابسًا ثوبًا أبيض
  rationale: ينقل حالة ارتداء الثوب التي تفيدها صيغة اسم الفاعل التام، بصياغة عربية واضحة غير متكلفة.
- source_word: στολή
  choice: ثوب
  rationale: يدل على لباس أو رداء ظاهر؛ و«ثوب» واضح في العربية ولا يضيف تحديدًا لشكل اللباس لا يفرضه السياق.
- source_word: ἐξεθαμβήθησαν
  choice: فارتعبن
  rationale: الفعل يدل على انفعال شديد من الذهول والفزع، و«ارتعبن» يحفظ قوة رد الفعل في هذا السياق.
theological_decisions:
- issue: هوية νεανίσκος
  choice: ترجمته وصفيًّا «شابًّا» في المتن
  alternative: ملاكًا
  rationale: مرقس 16:5 يستعمل لفظ «شاب» نفسه، مع أن السياق الأوسع واللباس الأبيض والروايات الموازية تشير إلى رسول ملائكي. يحفظ المتن لفظ الآية ولا يحسم الهوية بتفسير مستورد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم جمع المؤنث «دخلن، رأين، ارتعبن» موافقةً للنساء المذكورات في السياق، مع الحفاظ على تسلسل السرد وقوة الانفعال في خاتمة الآية.
