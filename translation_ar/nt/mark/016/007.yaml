  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: ar
  text: 'بَلِ اذْهَبْنَ وَقُلْنَ لِتَلَامِيذِهِ وَلِبُطْرُسَ[a]: «إِنَّهُ يَسْبِقُكُمْ إِلَى الْجَلِيلِ[b]. هُنَاكَ سَتَرَوْنَهُ، كَمَا قَالَ لَكُمْ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ذُكر بطرس على حدة بعد «تلاميذه». وقد يبرز هذا ردَّه إلى جماعة التلاميذ بعد إنكاره، لكن اليونانية لا تقول صراحةً: «وخصوصًا بطرس».'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أن تفيد العبارة اليونانية أيضًا: «إلى داخل الجليل»؛ فحرف الجر يدل هنا على الاتجاه، وقد يبرز كذلك الدخول إلى المنطقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بَلِ
  rationale: تفيد الانتقال المقابل إلى ما ينبغي فعله، وتحافظ بإيجاز على قوة الاستدراك في اليونانية.
- source_word: ὑπάγετε
  choice: اذْهَبْنَ
  rationale: فعل أمر موجَّه إلى جماعة النساء المذكورات في السياق؛ والعربية تقتضي إظهار جنس المخاطَبات، بخلاف الصيغة اليونانية التي لا تميّز الجنس هنا.
- source_word: εἴπατε
  choice: قُلْنَ
  rationale: أمر بإبلاغ مضمون الرسالة إلى متلقّين محددين، وهو تعبير عربي مباشر وطبيعي.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: لِتَلَامِيذِهِ
  rationale: ينقل المضاف إليه الدال على أن التلاميذ ليسوع بصياغة عربية موجزة وواضحة.
- source_word: καὶ τῷ Πέτρῳ
  choice: وَلِبُطْرُسَ
  rationale: يحافظ على عطف بطرس وذكره على حدة، من غير إضافة معنى «خصوصًا» أو «بمن فيهم» غير المصرّح به.
- source_word: ὅτι
  choice: علامتا الاقتباس المباشر
  rationale: تُعرض الرسالة بوصفها كلامًا مباشرًا، وهو أسلوب واضح في العربية ويحافظ على مضمون الجملة التابعة.
- source_word: Προάγει ὑμᾶς
  choice: إِنَّهُ يَسْبِقُكُمْ
  rationale: ينقل حركة يسوع المتقدمة أمامهم بصيغة مضارع عربية طبيعية، من غير تحويلها صراحة إلى زمن مستقبل.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: إِلَى الْجَلِيلِ
  rationale: «إلى» هي الصياغة العربية الطبيعية للاتجاه نحو الجليل، مع إمكان أن تتضمن اليونانية معنى الدخول إليه.
- source_word: ἐκεῖ
  choice: هُنَاكَ
  rationale: إحالة مكانية مباشرة إلى الجليل.
- source_word: αὐτὸν ὄψεσθε
  choice: سَتَرَوْنَهُ
  rationale: ينقل بوضوح صيغة المستقبل ومعنى الرؤية أو اللقاء من غير توسع تفسيري.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: كَمَا قَالَ لَكُمْ
  rationale: يحافظ على المطابقة مع قول يسوع السابق بصياغة عربية مباشرة وقريبة من الأصل.
theological_decisions:
- issue: ذكر بطرس منفصلًا بعد التلاميذ
  choice: 'الإبقاء على العطف البسيط: «لتلاميذه ولبطرس»'
  alternative: «لتلاميذه، ولا سيما بطرس» أو «لتلاميذه، ومنهم بطرس»
  rationale: النص اليوناني يخص بطرس بالذكر، وربما يحمل ذلك دلالة سردية ورعوية بعد إنكاره، لكنه لا يصرّح بمعنى «خصوصًا» ولا يحسم طبيعة هذه الدلالة؛ لذلك تُحفظ المسافة والتوتر اللاهوتي في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل جمع المؤنث في فعلي الأمر لأن المخاطَبات نساء بحسب السياق المباشر، بينما بقي ضمير الجمع في «يسبقكم» و«سترونه» غير موسوم كتابيًا بالجنس، كما هو طبيعي في العربية. وُضعت علامتا الحاشيتين عند اللفظين اللذين تتعلقان بهما مباشرة.
