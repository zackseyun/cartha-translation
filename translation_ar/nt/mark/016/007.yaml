review_pass:
  verdict: approve
  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: الاستدراك في «بل»، وصيغتي الأمر للجمع، وذكر «تلاميذه ولبطرس» بعطف بسيط، وحركة يسوع المتقدّمة إلى الجليل، ووعد الرؤية هناك، والإحالة إلى قوله السابق. واستعمال جمع المؤنث في «اذهبن» و«قلن» ملائم للمخاطَبات في السياق ولا يغيّر دلالة صيغة الجمع اليونانية.'
  naturalness: 'الصياغة فصيحة حديثة وواضحة وملائمة لسجل النص: «بل اذهبن وقلن...»، «إنه يسبقكم إلى الجليل»، و«هناك سترونه» تراكيب سليمة ومترابطة. «يسبقكم إلى الجليل» مفهوم طبيعي في هذا السياق بمعنى يتقدّمكم إليه.'
  terminology: «تلاميذه»، «بطرس»، و«الجليل» مصطلحات وأسماء مستقرة. لا تفرض الترجمة تفسيرًا طائفيًا لذكر بطرس المنفصل، وتحافظ الحاشية على كونه احتمالًا سرديًا لا تصريحًا نحويًا. والحاشية الثانية تبيّن بصورة مناسبة أن حرف الجر يدل على الاتجاه وقد يحمل إيحاء الدخول إلى المنطقة.
