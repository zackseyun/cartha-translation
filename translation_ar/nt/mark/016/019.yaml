  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: ar
  text: ثم إن الرب يسوع، بعدما كلّمهم، رُفع إلى السماء وجلس عن يمين الله.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὲν οὖν
  choice: ثم إن
  rationale: يفيد التركيب الانتقال والاستئناف مع مسحة استنتاجية؛ و«ثم إن» تؤدي ذلك في عربية واضحة من غير إثقال.
- source_word: κύριος Ἰησοῦς
  choice: الرب يسوع
  rationale: تحافظ «الرب» على الثقل اللقبي واللاهوتي لـκύριος، ويأتي الاسم «يسوع» طبيعيًا بعدها.
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: بعدما كلّمهم
  rationale: ينقل البناء الزمني بمعنى «بعد»، ويعبّر «كلّمهم» بإيجاز طبيعي عن توجيه الكلام إليهم.
- source_word: ἀνελήμφθη
  choice: رُفع
  rationale: يحافظ المبني للمجهول على صيغة الفعل اليوناني، من غير تعيين الفاعل الذي لم يصرّح به النص.
- source_word: εἰς τὸν οὐρανόν
  choice: إلى السماء
  rationale: هذه الصياغة العربية الطبيعية تعبّر عن وجهة الصعود، ولا يلزم أن تقابل εἰς بحرف يفيد الدخول على نحو حرفي.
- source_word: ἐκάθισεν
  choice: جلس
  rationale: ينقل الفعل الماضي الدال على اتخاذ موضع الجلوس بصياغة عربية مباشرة.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: عن يمين الله
  rationale: هذا هو المقابل العربي الاصطلاحي الطبيعي لعبارة المكان الدالة على الموضع الرفيع، بدل ترجمة ἐκ ترجمة حرفية مضللة.
theological_decisions:
- issue: نقل لغة الصعود والرفعة من غير زيادة عقائدية
  choice: رُفع إلى السماء وجلس عن يمين الله
  alternative: صعد إلى السماء وجلس عن يمين الله
  rationale: اختير المبني للمجهول «رُفع» حفاظًا على ἀνελήμφθη، إذ يثبت النص الحدث ووجهته من غير أن يبدّل الصيغة إلى فعل معلوم ذاتي.
- issue: نقل κύριος بوصفه لقبًا للمسيح
  choice: الرب يسوع
  alternative: السيد يسوع
  rationale: «الرب» هو المقابل الكتابي العربي المعتاد الذي يصون قوة اللقب، في حين قد تحصر «السيد» دلالته في معنى اجتماعي أضيق.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على ترتيب الأحداث والمبني للمجهول والتعبير الكتابي «عن يمين الله».
