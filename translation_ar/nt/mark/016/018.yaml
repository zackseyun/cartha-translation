base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: ar
  text: سيرفعون الحيّات، وإن شربوا شيئًا مميتًا فلن يضرهم أبدًا؛ وسيضعون أيديهم على المرضى، فيتعافى المرضى.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لا تتضمن بعض المخطوطات المبكرة مرقس 16:9–20؛ وهذه الآية جزء من خاتمة مرقس الطويلة.
    reason: textual_variant
lexical_decisions:
- source_word: ὄφεις
  choice: الحَيّات
  rationale: لفظ عربي واضح وشائع يدل على الأفاعي أو الثعابين، من غير إيحاء رمزي زائد.
- source_word: ἀροῦσιν
  choice: سَيَحْمِلُونَ
  rationale: الفعل αἴρω هنا يفيد الرفع أو الحمل، و«يحملون» طبيعي في هذا السياق ويحافظ على اتساع الدلالة.
- source_word: κἂν θανάσιμόν τι πίωσιν
  choice: وإن شَرِبوا شيئًا مُميتًا
  rationale: تحافظ «وإن» على الشرط ذي المسحة التنازلية، و«شيئًا مميتًا» تنقل العبارة اليونانية الواسعة من غير حصرها في السم.
- source_word: οὐ μὴ αὐτοὺς βλάψῃ
  choice: فلن يَضُرَّهُم أبدًا
  rationale: «لن... أبدًا» تنقل النفي اليوناني المؤكد οὐ μή بصورة عربية طبيعية وقوية.
- source_word: ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν
  choice: وسيَضَعون أيديَهُم على المرضى
  rationale: صياغة عربية مباشرة تنقل وضع الأيدي على المرضى من غير إضافة تفسير طقسي أو عقائدي.
- source_word: καλῶς ἕξουσιν
  choice: فيَتعافَوْنَ
  rationale: المعنى الحرفي قريب من «يكونون بخير»، لكن سياق المرض يجعل «يتعافون» تعبيرًا عربيًا طبيعيًا عن النتيجة المقصودة.
theological_decisions:
- issue: طبيعة الحماية والشفاء الموعودين
  choice: صياغة الأفعال والنتائج كما يوردها النص بلا تقييد تفسيري.
  alternative: اعتبار العلامات واجبة لكل مؤمن في كل عصر، أو مقصورة على العصر الرسولي، أو رمزية محضة.
  rationale: النص يقرر الأفعال والنتائج بصيغة مستقبلية، ولا يحسم في هذه الآية وحدها مدى عمومها الزمني أو الأشخاص الذين تشملهم؛ لذلك لا تُضاف عقيدة مذهبية إلى الترجمة.
- issue: الوضع النصي لمرقس 16:9–20
  choice: ترجمة الآية المقدمة مع بيان وضع الخاتمة الطويلة في حاشية.
  alternative: حذف الآية أو وضعها بين أقواس في المتن.
  rationale: الآية واردة في نص المصدر المقدم، لكن غياب مرقس 16:9–20 عن بعض المخطوطات المبكرة مسألة نصية مهمة تستلزم التنبيه بشفافية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُخدمت «الحيات» بدل اللفظ الأشد أدبية «الأفاعي»، و«يتعافون» لبيان نتيجة الشفاء طبيعيًا. وُضع مؤشر الحاشية في ختام الآية لأنه يتعلق بالآية ضمن الخاتمة الطويلة كلها.
