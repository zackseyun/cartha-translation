  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: ar
  text: وستكون النجوم تهوي من السماء[a]، والقوى التي في السماوات ستتزعزع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من السماء المنظورة». فاللفظة اليونانية قد تدل على السماء العليا أو على السماء المنظورة، بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: قد تشير «القوى التي في السماوات» إلى قوى سماوية، أو قوى كونية، أو بُنى السماوات؛ والعبارة اليونانية لا تحدد المقصود بأكثر من ذلك.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: النجوم
  rationale: المعنى المعجمي المعتاد، وهو ملائم للمشهد الكوني في هذا الخطاب الرؤيوي.
- source_word: ἔσονται ... πίπτοντες
  choice: ستكون ... تتساقط
  rationale: يحافظ هذا التركيب على صيغة المستقبل المركبة مع اسم الفاعل في اليونانية، وينقل الفعل المستمر أو الحيّ بدل اختزاله إلى مجرد «ستسقط».
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: «السماء» تعبير عربي طبيعي يحفظ النبرة الكونية السامية، مع إمكان فهم اللفظة اليونانية بمعنى الفضاء المنظور أو السماء العليا.
- source_word: δυνάμεις
  choice: القوات
  rationale: تحفظ «القوات» اتساع اللفظة اليونانية، فلا تحسم هل المقصود قوى كونية أم كائنات سماوية أم نظام السماوات.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: التي في السماوات
  rationale: ينقل الجمع اليوناني صراحة ويحافظ على النطاق الكوني للعبارة.
- source_word: σαλευθήσονται
  choice: ستتزعزع
  rationale: تعبير عربي طبيعي ينقل معنى الاهتزاز والاضطراب في صيغة مستقبلية، من غير إضافة فاعل غير مذكور.
theological_decisions:
- issue: مدلول «القوات التي في السماوات»
  choice: الإبقاء على العبارة العامة «القوات التي في السماوات»
  alternative: القوات السماوية بوصفها كائنات ملائكية، أو قوى السماوات وبُناها الكونية
  rationale: العبارة اليونانية واسعة الدلالة، والسياق الرؤيوي لا يحدد على وجه القطع هل المراد كائنات سماوية أم قوى كونية أم نظام السماوات؛ لذلك لا تحسم الترجمة ما تركه النص مفتوحًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة تلائم الخطاب الرؤيوي. وُضعت علامتا الحاشيتين بجوار العبارتين اللتين تفسرانهما، مع إبقاء الغموض الكوني واللاهوتي في النص.
