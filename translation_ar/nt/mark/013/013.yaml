  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: ar
  text: وستكونون مبغوضين من الجميع بسبب اسمي[a]. أمّا مَن يثبت إلى النهاية[b] فسيخلُص[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من أجل اسمي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يصبر إلى النهاية» أو «يبقى ثابتًا إلى النهاية».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «فسيُنقَذ». يمكن أن يدل الفعل اليوناني على الإنقاذ أو الخلاص، والسياق يترك المدى الكامل للمعنى مفتوحًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι
  choice: مكروهين
  rationale: 'مع «ستكونون» تؤدي اسم المفعول في تركيب طبيعي معنى المستقبل المحيطي في اليونانية: سيكرهكم الناس.'
- source_word: ὑπὸ πάντων
  choice: من الجميع
  rationale: تحافظ على شمول العبارة اليونانية من غير تقييد أو تلطيف.
- source_word: διὰ τὸ ὄνομά μου
  choice: بسبب اسمي
  rationale: تنقل معنى السببية في διά مع النصب، وتبقي «الاسم» بما يحمله من دلالة على شخص يسوع والانتساب إليه.
- source_word: ὁ δὲ ὑπομείνας
  choice: أمّا مَن يثبت
  rationale: «يثبت» عربية واضحة وطبيعية تعبّر عن البقاء صامدًا تحت الضغط، و«أمّا» تنقل المقابلة التي تفيدها δέ.
- source_word: εἰς τέλος
  choice: إلى النهاية
  rationale: 'تحافظ على غموض نقطة النهاية: نهاية المحنة أو الحياة أو النهاية الأخروية.'
- source_word: οὗτος
  choice: غير ممثّل بضمير مستقل
  rationale: الضمير اليوناني استئنافي توكيدي، لكن تمثيله حرفيًا بقول «فهذا سيخلص» أثقل في العربية؛ وبنية «أمّا مَن... فـ» تنقل التوكيد بصورة طبيعية.
- source_word: σωθήσεται
  choice: فسيخلُص
  rationale: «يخلُص» يحفظ اتساع الفعل اليوناني بين الإنقاذ والخلاص ولا يحصره في نجاة زمنية فقط.
theological_decisions:
- issue: دلالة σωθήσεται في قول يربط الخلاص بالثبات
  choice: فسيخلُص
  alternative: فسيُنقَذ
  rationale: يحفظ اللفظ البعد الخلاصي والسياق الأخروي مع إبقاء إمكان معنى الإنقاذ، من غير فرض مذهب خاص بشأن المثابرة.
- issue: مدى πάντων
  choice: من الجميع
  alternative: من كل الناس
  rationale: تُبقي الصياغة الشاملة القوية كما هي، من غير إضافة قيد يفسرها تفسيرًا حسابيًا أو يخففها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت بنية «أمّا مَن... فـ» لتكون طبيعية وتحفظ المقابلة والتوكيد، مع إبقاء ألفاظ «اسمي» و«النهاية» و«يخلُص» مفتوحة على مداها النصي واللاهوتي.
