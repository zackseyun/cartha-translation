  naturalness: الترجمة مفهومة وفصيحة إجمالًا، لكن «تلك الأيام ستكون ضيقًا» تركيب مضغوط وثقيل قليلًا في العربية المعاصرة. يمكن الإبقاء على بنية الأصل مع جعل المقارنة أوضح باستعمال «لم يحدث مثله» و«لن يحدث مثله أبدًا».
