  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: ar
  text: لِأَنَّ تِلْكَ الأَيَّامَ سَتَكُونُ ضِيقًا لَمْ يَحْدُثْ مِثْلُهُ مُنْذُ بَدْءِ الْخَلِيقَةِ الَّتِي خَلَقَهَا اللهُ حَتَّى الآنَ، وَلَنْ يَحْدُثَ مِثْلُهُ أَبَدًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλῖψις
  choice: ضيقًا
  rationale: «الضيق» لفظ عربي كتابي واضح يدل على الشدة والكرب، ويلائم سياق الخطاب الأخروي من غير أن يحصر المعنى في اصطلاح مذهبي خاص.
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: لم يكن مثله
  rationale: ينقل التركيب المقارن المؤكد، مع تجنب التكرار اليوناني غير الطبيعي في العربية.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: منذ بدء الخليقة
  rationale: صياغة عربية طبيعية تحافظ على دلالة κτίσις بوصفها الخليقة أو النظام المخلوق.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: التي خلقها الله
  rationale: حُفظت جملة الصلة الصريحة وتسمية الله فاعلًا للخلق، كما في الأصل.
- source_word: ἕως τοῦ νῦν
  choice: إلى الآن
  rationale: مقابل زمني مباشر وطبيعي في العربية الفصحى المعاصرة.
- source_word: οὐ μὴ γένηται
  choice: ولن يكون مثله أبدًا
  rationale: ينقل النفي اليوناني المؤكد واتجاهه المستقبلي؛ وإعادة «مثله» توضح في العربية أن المنفي هو وقوع ضيق مماثل، من غير إضافة معنى «مرة أخرى» غير المصرح به لفظًا.
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: تلك الأيام ستكون ضيقًا
  rationale: يحافظ على الإسناد الاسمي المضغوط في اليونانية، حيث تشكل تلك الأيام نفسها زمن الضيق، بدل تحويل العبارة إلى «ستجلب ضيقًا».
theological_decisions:
- issue: نطاق لغة الخليقة
  choice: الخليقة التي خلقها الله
  alternative: العالم؛ أو بدء التاريخ
  rationale: يحافظ هذا على اقتران κτίσις بالفعل κτίζω وعلى التصريح بالله خالقًا، من غير تضييق العبارة إلى بداية محلية أو عهدية، ومن غير فرض تصور أخروي بعينه.
- issue: تفرد الضيق في الماضي والمستقبل
  choice: لم يكن مثله... ولن يكون مثله أبدًا
  alternative: لم يحدث مثله... ولن يحدث مرة أخرى
  rationale: الصياغة المختارة تحفظ المقارنة المطلقة والتوكيد المستقبلي، ولا تضيف «مرة أخرى» التي قد توحي بأنه حدث بالفعل على نحو مماثل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «الضيق» بدل ألفاظ اصطلاحية أثقل مثل «المحنة العظيمة»، وحُفظت جملة «التي خلقها الله» رغم شيء من التكرار لأنها مقصودة في النص اليوناني.
