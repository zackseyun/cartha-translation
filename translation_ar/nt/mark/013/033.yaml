  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: ar
  text: انتبهوا واسهروا، لأنكم لا تعرفون متى يحين الوقت[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الوقت المعيّن» أو «الأوان». فكلمة καιρός اليونانية كثيرًا ما تشير إلى وقت حاسم أو معيّن.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: انتبهوا
  rationale: فعل أمر للجمع يُستعمل هنا للتحذير والحث على اليقظة، لا لمجرد النظر؛ و«انتبهوا» عربية طبيعية تميّزه عن الأمر التالي بالسهر.
- source_word: ἀγρυπνεῖτε
  choice: اسهروا
  rationale: فعل أمر للجمع يدل على البقاء مستيقظين أو متيقظين؛ و«اسهروا» يحفظ صورة اليقظة الحرفية والمجازية.
- source_word: οὐκ οἴδατε
  choice: لا تعرفون
  rationale: نقل مباشر لنفي المعرفة من غير إضافة معنى اليقين غير الوارد صراحة.
- source_word: γὰρ
  choice: لأنكم
  rationale: تبيّن أداة التعليل سبب الأمرين السابقين، و«لأن» تؤدي هذا الربط بوضوح.
- source_word: πότε
  choice: متى
  rationale: مقابل عربي طبيعي لظرف الاستفهام الزمني.
- source_word: ὁ καιρός
  choice: الوقت
  rationale: يحافظ على سعة دلالة καιρός، التي قد تشير في السياق إلى وقت حاسم أو معيّن، من غير حسم هذا التحديد في المتن.
- source_word: ἐστιν
  choice: يحين
  rationale: الصياغة العربية «متى يحين الوقت» تؤدي معنى الجملة الاسمية اليونانية بصورة طبيعية، مع بقاء التركيز على توقيت مجيء اللحظة المقصودة.
theological_decisions:
- issue: دلالة καιρός في السياق الأخروي
  choice: الوقت
  alternative: الوقت المعيّن؛ الأوان
  rationale: قد يدل اللفظ على لحظة حاسمة أو محددة، لكن «الوقت» في المتن يتجنب زيادة التحديد على النص اليوناني، وتُذكر البدائل في الحاشية لصون الاحتمال الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم فعلان مختلفان، «انتبهوا» و«اسهروا»، لصون التمايز بين التحذير العام وصورة البقاء في يقظة.
