  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: ar
  text: وسيسلّم الأخُ أخاه إلى الموت[a]، والأبُ ولدَه، وسيثور الأولاد على والديهم ويقتلونهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سيخون»؛ يمكن أن يعني الفعل اليوناني «يُسلِّم» أو «يدفع إلى»، ويحمل في هذا السياق معنى الخيانة أيضًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: سَيُسْلِمُ
  rationale: يحفظ المعنى الملموس للفعل، أي تسليم الشخص إلى السلطات أو إلى مصير الموت، من غير أن يحصره في معنى الخيانة العاطفي الأكثر تفسيرًا.
- source_word: ἀδελφὸς ἀδελφὸν
  choice: الأخُ أخاهُ
  rationale: يحافظ على اللفظ العائلي المذكر وعلى التكرار الصارخ في اليونانية، مع صياغة عربية طبيعية.
- source_word: εἰς θάνατον
  choice: إلى الموت
  rationale: ينقل الغاية أو النتيجة التي تدل عليها العبارة، ويحافظ على إيجاز الأصل وشدته.
- source_word: πατὴρ τέκνον
  choice: الأبُ ولدَهُ
  rationale: «ولد» هنا يشمل الابن والبنت في العربية، والضمير يوضح علاقة القرابة المفهومة من السياق.
- source_word: τέκνα
  choice: الأولاد
  rationale: لفظ عربي عام يشمل أبناء الأسرة من الذكور والإناث، ويلائم الجمع في هذا السياق.
- source_word: ἐπαναστήσονται ἐπὶ
  choice: سيقومُ ... على
  rationale: يحفظ الصورة الحية في الفعل اليوناني ودلالته على النهوض العدائي ضد شخص.
- source_word: γονεῖς
  choice: والديهم
  rationale: ينقل الجمع اليوناني الدال على الأب والأم، ويبيّن طبيعيًا في العربية أن المقصود والدا الأولاد المذكورين.
- source_word: θανατώσουσιν αὐτούς
  choice: ويقتلونهم
  rationale: ترجمة عربية مباشرة وطبيعية للفعل الذي يعني إيقاع الموت أو القتل، من غير إضافة إيحاء قضائي غير لازم.
theological_decisions:
- issue: الألفاظ العائلية المذكرة في الأقوال التمثيلية
  choice: الإبقاء على «الأخ» و«الأب» حيث يستعمل الأصل ألفاظًا مذكرة محددة، مع استعمال «الولد/الأولاد» و«الوالدين» حيث تكون ألفاظ الأصل أعم.
  alternative: تحييد جميع ألفاظ القرابة إلى تعبيرات عامة مثل «أحد أفراد الأسرة» أو «أحد الوالدين».
  rationale: يتبع ذلك التمييز الدلالي في النص اليوناني ولا يضيّق الألفاظ العامة ولا يعمّم الألفاظ المحددة، مع بقاء العبارة ممثلة لانقسام الأسرة.
translation_notes:
  register: العربية فصحى حديثة واضحة ومهيبة. استُعملت «سيسلم» و«سيقوم ... على» للمحافظة على الصور الملموسة في الأصل، واستُعمل «ولد» بمعناه العربي العام الشامل للابن والبنت.
