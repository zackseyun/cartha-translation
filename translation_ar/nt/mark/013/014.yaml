id: MRK.13.14
reference: Mark 13:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: ar
  text: ولكن متى رأيتم «رجس الخراب» قائمًا حيث لا ينبغي له أن يكون — ليفهم القارئ [a] — فحينئذ ليهرب الذين في اليهودية إلى الجبال [b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: جاءت كلمة «قائمًا» في اليونانية بصيغة المذكر، مع أن «الرجس» محايد نحويًا؛ وقد يوحي ذلك بأن وراء التعبير مرجعًا شخصيًا.
    reason: alternative_reading
  - marker: b
    text: 'تردد عبارة «رجس الخراب» صدى لغة سفر دانيال (انظر دانيال 9: 27؛ 11: 31؛ 12: 11).'
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: ولكن متى
  rationale: تنقل متى الدلالة الزمنية الاحتمالية، وتؤدي لكن وظيفة δέ بوصفها رابطًا خفيفًا يواصل التحذير مع مسحة انتقال أو مقابلة.
- source_word: ἴδητε
  choice: رأيتم
  rationale: صيغة الماضي بعد متى طبيعية في العربية الفصحى للدلالة على حدث مستقبل متوقع، وتحافظ على المعنى المباشر للفعل ὁράω.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: رجس الخراب
  rationale: صياغة موجزة وقريبة من الأصل، وتحافظ على الصدى الدانيالي وعلى غموض الإضافة من غير أن تحدد هل الرجس يسبب الخراب أم يرتبط به على وجه آخر.
- source_word: ἑστηκότα
  choice: قائمًا
  rationale: ينقل الحالة القائمة الناتجة من الوقوف أو الإقامة، ويحافظ على الصورة الحية بدل التفسير بعبارة مثل «منصوبًا».
- source_word: ὅπου οὐ δεῖ
  choice: حيث لا ينبغي له أن يكون
  rationale: تؤدي معنى عدم اللياقة أو الوجوب في δεῖ. والضمير المذكر «له» ينسجم مع «رجس» في العربية، من غير أن يحسم وحده ما إذا كان المرجع شخصًا.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: ليفهم القارئ
  rationale: صياغة عربية طبيعية تحفظ كون العبارة تنبيهًا اعتراضيًا موجَّهًا إلى من يقرأ.
- source_word: τότε
  choice: فحينئذ
  rationale: توضح النتيجة الزمنية المترتبة على رؤية العلامة، والفاء تلائم تسلسل الشرط والجواب في العربية.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: الذين في اليهودية
  rationale: ترجمة مباشرة ومفهومة تحفظ التحديد الجغرافي.
- source_word: φευγέτωσαν
  choice: ليهرب
  rationale: لام الأمر تنقل قوة صيغة الأمر للغائب مع الحفاظ على الإلحاح.
- source_word: εἰς τὰ ὄρη
  choice: إلى الجبال
  rationale: المقابل المباشر الطبيعي لـ ὄρη في هذا السياق الطبوغرافي.
theological_decisions:
- issue: تفسير العبارة الدانيالية βδέλυγμα τῆς ἐρημώσεως
  choice: الإبقاء على «رجس الخراب» من غير تعيين مرجعه التاريخي أو تفسير علاقة الرجس بالخراب.
  alternative: «الرجس المخرِّب» أو «الرجس الذي يسبب الخراب».
  rationale: قد تشير العبارة إلى شيء أو فعل أو شخص ذي طابع تدنيسي، ومرجعها التاريخي والنبوي محل خلاف؛ لذلك ينبغي إبقاء قوتها التلميحية وغموضها.
- issue: المفارقة النحوية بين ἑστηκότα المذكر وβδέλυγμα المحايد
  choice: استعمال «قائمًا حيث لا ينبغي له أن يكون» في المتن، مع شرح دلالة صيغة المذكر اليونانية في الحاشية.
  alternative: 'صياغة المتن بما يصرح بالشخص: «قائمًا حيث لا ينبغي له أن يكون» مع تفسيره مباشرة بأنه إنسان.'
  rationale: العربية تجعل «رجس» مذكرًا أصلًا، فلا تستطيع وحدها إظهار المفارقة اليونانية. لذلك تُحفظ القراءة الطبيعية في المتن، ويُنبَّه في الحاشية إلى احتمال المرجع الشخصي من غير حسم.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظت العبارة الدانيالية بصيغة مصدرية موجزة، ووُضعت علامتا الحاشية في المتن. استُعملت الشرطتان لإبراز التنبيه الاعتراضي من غير قطع تسلسل الجملة.
