base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: ar
  text: وعندما تسمعون عن حروب وأخبار عن حروب[a]، فلا تضطربوا؛ لا بد أن يحدث ذلك، ولكن النهاية لم تأتِ بعد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «شائعات عن حروب». يمكن للكلمة اليونانية أن تشير إلى أنباء أو أخبار أو شائعات تُسمع عن حروب.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: وعندما
  rationale: تنقل ὅταν معنى الزمن المحتمل أو المتوقع، بينما تؤدي الواو وظيفة δέ بوصفها أداة ربط خفيفة من غير المبالغة في معنى الاستدراك.
- source_word: ἀκούσητε
  choice: تسمعون بـ
  rationale: صيغة الماضي المنصوب بعد ὅταν تحمل هنا معنى مستقبليًا في جملة زمنية، وتعبير «تسمعون بـ» عربي طبيعي بمعنى وصول خبر الشيء إلى السامعين.
- source_word: πολέμους
  choice: حروب
  rationale: المقابل العربي المباشر والمألوف للاسم اليوناني في صيغة الجمع.
- source_word: ἀκοὰς πολέμων
  choice: أنباء عن حروب
  rationale: يمكن أن تدل ἀκοή على ما يُسمع من خبر أو نبأ، ولا تستلزم أن يكون غير موثوق؛ لذلك اختيرت «أنباء» في المتن، مع حفظ احتمال «شائعات» في الحاشية.
- source_word: μὴ θροεῖσθε
  choice: فلا تفزعوا
  rationale: الفعل يدل على الاضطراب والخوف الشديد أو الانزعاج، و«لا تفزعوا» تعبير عربي واضح وموجز يحفظ قوة النهي.
- source_word: δεῖ γενέσθαι
  choice: لا بد أن يحدث ذلك
  rationale: يحفظ «لا بد» معنى الضرورة في δεῖ، ويؤدي «يحدث» معنى الوقوع في γενέσθαι. والإشارة بـ«ذلك» تعود إجمالًا إلى ما سبق من غير إضافة تفسير تفصيلي.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: ولكن النهاية لم تأتِ بعد
  rationale: صياغة عربية طبيعية تحفظ الاستدراك ومعنى οὔπω، وتوضح أن النهاية لم تقع حتى الآن من غير تحديد ماهيتها بأكثر مما يقوله النص.
theological_decisions:
- issue: الضرورة الأخروية في δεῖ γενέσθαι
  choice: لا بد أن يحدث ذلك
  alternative: ينبغي أن يحدث ذلك
  rationale: تُبقي «لا بد» على قوة الضرورة النبوية أو الإلهية التي يحملها النص، من غير شرح آليتها أو إدخال منظومة محددة لأحداث النهاية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أنباء» بدل «شائعات» في المتن لأنها أوسع دلالة وأقل إيحاءً بعدم صحة الخبر، مع إبقاء البديل التقليدي في الحاشية. وُضع مؤشر الحاشية [a] مباشرة بعد العبارة المعنية.
