  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: ar
  text: ولكن الويل للحبالى والمرضعات في تلك الأيام!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: الويل
  rationale: يحفظ قوة صيحة الرثاء والتحذير النبوي، وهو المقابل العربي المألوف والموجز في هذا السياق.
- source_word: δὲ
  choice: ولكن
  rationale: ينقل الانتقال الخفيف من التحذير السابق، مع قدر من المقابلة من غير مبالغة فيها.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: للحبالى
  rationale: تعبير عربي فصيح واضح يؤدي المعنى الاصطلاحي، أي النساء الحوامل، من غير ترجمة حرفية ثقيلة لعبارة «اللواتي لهن في البطن».
- source_word: θηλαζούσαις
  choice: المرضعات
  rationale: اسم فاعل مؤنث جمع يعبّر طبيعيًا عن النساء اللواتي يرضعن أطفالًا، مع إبقاء المفعول المفهوم من السياق ضمنيًا كما في اليونانية.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: في تلك الأيام
  rationale: ترجمة مباشرة وطبيعية تحفظ الصلة الزمنية بالسياق السابق.
