  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: ar
  text: وحينئذ سيرون ابن الإنسان آتيًا في السحب بقوة عظيمة ومجد[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «آتيًا مع السحب». يقول النص اليوناني حرفيًا: «في سحب»، لكن الصياغة البديلة تُبرز الصدى المحتمل لدانيال 7:13.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: سيرون
  rationale: ينقل صيغة المستقبل الدالة هنا على الرؤية نقلًا مباشرًا وطبيعيًا، من غير إضافة معنى تفسيري.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: هو المقابل العربي الكتابي المستقر لهذا اللقب، ويحفظ صداه مع دانيال 7 ودلالته الأخروية.
- source_word: ἐρχόμενον
  choice: آتيًا
  rationale: اسم فاعل حالي يصف ابن الإنسان، و«آتيًا» صياغة عربية فصيحة تحافظ على معنى المجيء ونبرته النبوية.
- source_word: ἐν νεφέλαις
  choice: في السحاب
  rationale: ينقل المعنى المكاني المباشر لحرف الجر ἐν، و«السحاب» اسم جنس عربي طبيعي لا يقتضي أن تكون أداة التعريف مقابلة لأداة تعريف يونانية.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: بقوة عظيمة
  rationale: تعبير عربي طبيعي ينقل المصاحبة وشدة القوة من غير حشو.
- source_word: καὶ δόξης
  choice: ومجد
  rationale: «المجد» هو المقابل الكتابي الأنسب لـδόξα هنا، إذ يدل على الجلال الظاهر ويحفظ الصدى النصي.
theological_decisions:
- issue: لقب «ابن الإنسان» وصورة المجيء السحابي
  choice: الإبقاء على لقب «ابن الإنسان» وصورة المجيء في السحاب من غير شرح داخل المتن.
  alternative: صياغة اللقب بمعنى عام مثل «الإنسان»، أو التصريح في المتن بالإشارة إلى دانيال 7.
  rationale: النص يستدعي دانيال 7:13 بقوة، لكن إبقاء الإشارة ضمنية يحفظ التوتر المسياني والأخروي في اليونانية ولا يفرض تفسيرًا موسعًا.
- issue: دلالة ἐν νεφέλαις وصلتها بدانيال 7:13
  choice: في السحاب
  alternative: مع سحب السماء
  rationale: «في السحاب» هو النقل الأقرب للبنية اليونانية الحالية، أما «مع سحب السماء» فيُظهر الصدى الدانيالي المحتمل، ولذلك حُفظ في الحاشية بدل إحلاله في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع الحفاظ على المصطلح الكتابي المألوف «ابن الإنسان» وعلى الإيجاز والإيقاع النبوي في الآية.
