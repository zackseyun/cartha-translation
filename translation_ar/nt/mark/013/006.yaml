  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: ar
  text: 'سيأتي كثيرون باسمي قائلين: «أنا هو»[a]، وسيُضلّون كثيرين.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا في اليونانية: «أنا أكون»؛ لكن العبارة اليونانية لا تذكر خبرًا صريحًا، و«أنا أكون» ليست صياغة عربية معتادة في هذا السياق.'
    reason: يحفظ الإيجاز اليوناني وغياب الخبر الصريح، من غير تقديم تركيب عربي غير طبيعي بديلاً في المتن.
lexical_decisions:
- source_word: πολλοὶ
  choice: كثيرون
  rationale: صفة جمع مستعملة استعمال الاسم، وتشير إلى عدد كبير من الأشخاص بصياغة عربية موجزة وطبيعية.
- source_word: ἐλεύσονται
  choice: سيأتي
  rationale: ينقل صيغة المستقبل من ἔρχομαι مباشرة، مع بقاء معنى المجيء أو الظهور في السياق مفتوحًا.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: باسمي
  rationale: تعبير عربي مألوف ينقل الادعاء بالارتباط باسم يسوع أو التحدث بسلطانه، من غير حصر العبارة في معنى واحد.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ على وظيفة اسم الفاعل الدالة على القول المصاحب لمجيئهم، من غير إضافة معنى الادعاء صراحة.
- source_word: ὅτι Ἐγώ εἰμι
  choice: «أنا هو»
  rationale: صياغة عربية مفهومة تشير إلى ادعاء الهوية المقصودة في السياق، مع إبقاء غياب الخبر الصريح في اليونانية ظاهرًا في الحاشية.
- source_word: πολλοὺς
  choice: كثيرين
  rationale: مفعول به يشير إلى عدد كبير من الناس، ويوازي لفظ «كثيرون» في مطلع الآية.
- source_word: πλανήσουσιν
  choice: سيُضلّون
  rationale: ينقل معنى التسبب في الضلال أو الانحراف عن الحق بإيجاز ودقة، ويحافظ على البعد الأخلاقي والمعرفي للفعل.
theological_decisions:
- issue: صياغة Ἐγώ εἰμι في سياق المدّعين الكاذبين
  choice: «أنا هو»
  alternative: «أنا أكون»
  rationale: السياق يرجّح ادعاء الهوية أو المقام الذي يخص يسوع، لكن النص اليوناني لا يذكر خبرًا صريحًا. لذلك يقدّم المتن صياغة عربية طبيعية، وتُحفظ الصياغة الأقرب إلى البنية اليونانية في الحاشية دون فرض تحديد لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «باسمي» و«سيُضلّون» لسلامتهما ووضوحهما لدى القارئ العام، ووُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
