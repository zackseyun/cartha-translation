  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: ar
  text: أمّا أنتم فانتبهوا لأنفسكم. سيُسلّمونكم إلى مجالس القضاء، وستُضرَبون في المجامع، وستُوقَفون أمام الولاة والملوك بسببي، ليكون ذلك شهادةً لهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليكون ذلك شاهدًا لهم». وقد تحتمل العبارة أيضًا معنى: «شهادةً ضدهم».'
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: أمّا أنتم فاحذروا على أنفسكم
  rationale: يحفظ صيغة الأمر المستمر وقوة التحذير، وينقل توكيد الضمير الصريح مع الانعكاس على المخاطَبين أنفسهم بعبارة عربية واضحة.
- source_word: παραδώσουσιν
  choice: سيسلّمونكم
  rationale: يدل السياق على تسليم التلاميذ إلى السلطات، لا بالضرورة على الخيانة الشخصية.
- source_word: συνέδρια
  choice: مجالس القضاء
  rationale: الجمع يشير إلى مجالس محلية ذات وظيفة قضائية، لا إلى المجلس الأعلى في أورشليم وحده؛ وإضافة «القضاء» توضح المعنى المؤسسي.
- source_word: συναγωγάς
  choice: المجامع
  rationale: المقابل العربي المألوف للمؤسسة والمكان اللذين كانت تجري فيهما إجراءات تأديبية.
- source_word: δαρήσεσθε
  choice: ستُضرَبون
  rationale: ينقل المبني للمجهول ومعنى الضرب الجسدي دون تخصيص أداة أو طريقة كالجلد.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: ستقفون أمام الولاة والملوك
  rationale: يحفظ صورة المثول الرسمي أمام نوعين متميزين من أصحاب السلطة، من غير زيادة معنى الإحضار القسري صراحة.
- source_word: ἕνεκεν ἐμοῦ
  choice: بسببي
  rationale: تعبير سببي عربي موجز وواضح يبيّن أن الارتباط بيسوع هو سبب الاضطهاد.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: لتكونوا شهادةً لهم
  rationale: يصوغ الغاية أو النتيجة بصورة طبيعية، ويحفظ اتجاه الشهادة إليهم دون حسمها بأنها شهادة إدانة ضدهم.
theological_decisions:
- issue: دلالة عبارة εἰς μαρτύριον αὐτοῖς
  choice: مثول التلاميذ أمام الحكام يصير شهادةً موجّهة إليهم
  alternative: شهادة ضدهم تحمل معنى الإدانة
  rationale: لفظ μαρτύριον يحتمل الشهادة عمومًا، وقد يحمل في بعض السياقات معنى الشهادة ضد شخص. والداتيف αὐτοῖς لا يفرض وحده المعنى الخصومي، لذلك أُبقي المتن أقل حسمًا، مع بيان الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «مجالس القضاء» لتجنب قصر الجمع اليوناني على السنهدريم في أورشليم، و«المجامع» بوصفه المصطلح العربي الشائع. أُثبتت علامة الحاشية [a] في المتن.
