revisions:
- from: أمّا أنتم فاحذروا على أنفسكم. سيسلّمونكم إلى مجالس القضاء، وستُضرَبون في المجامع، وستقفون أمام الولاة والملوك بسببي، لتكونوا شهادةً لهم.[a]
  to: أمّا أنتم فانتبهوا لأنفسكم. سيُسلّمونكم إلى مجالس القضاء، وستُضرَبون في المجامع، وستُوقَفون أمام الولاة والملوك بسببي، ليكون ذلك شهادةً لهم.[a]
  rationale: عُدِّلت العبارة الافتتاحية إلى تعبير فصيح حديث يحفظ اليقظة الشخصية، وأُظهر المبني للمجهول في «ستُوقَفون». كما أُسنِدت «الشهادة» إلى واقعة المثول، لا إلى الأشخاص مباشرة، مع الإبقاء على اتجاهها «لهم» وعدم ترجيح معنى «ضدهم» في المتن. وحُدِّثت الحاشية لتوافق هذه الصياغة وتحافظ على الاحتمال الدلالي.
