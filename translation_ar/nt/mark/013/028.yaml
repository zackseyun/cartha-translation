  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: ar
  text: 'وتعلَّموا المثل من شجرة التين[a]: حين يصير غصنها غضًّا ويُخرج أوراقه، تعرفون أن الصيف قريب.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «العبرة» أو «التشبيه».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς μάθετε
  choice: وتعلَّموا من شجرة التين
  rationale: تحافظ «من» على دلالة ἀπό التي تشير إلى مصدر التعلُّم، وتنقل صيغة الأمر μάθετε مباشرة. وتؤدي الواو وظيفة δέ الربطية الخفيفة من غير أن تضيف معنى زمنيًّا غير موجود في الأصل.
- source_word: τὴν παραβολήν
  choice: هذا المثل
  rationale: «المثل» هو المقابل المألوف لـ παραβολή في سياق تعليم يسوع، واسم الإشارة يجعل العبارة عربية طبيعية ويشير إلى التشبيه الآتي من شجرة التين.
- source_word: ὅταν
  choice: حين
  rationale: تقدّم «حين» حالة زمنية عامة بأسلوب عربي واضح وطبيعي.
- source_word: ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: يكون غصنها قد صار غضًّا
  rationale: تنقل «قد صار» بلوغ الحالة الذي تشير إليه ἤδη مع γένηται، وتعبّر «غضًّا» عن طراوة النمو الجديد المقصودة بـ ἁπαλός.
- source_word: ἐκφύῃ τὰ φύλλα
  choice: أخرج أوراقه
  rationale: تصف العبارة بوضوح إنبات الغصن أوراقه، وهو معنى ἐκφύω في هذه الصورة النباتية.
- source_word: γινώσκετε
  choice: تعرفون
  rationale: الصيغة هنا خبرية في السياق، فتصف ما يعرفه المخاطبون من العلامة، وليست أمرًا جديدًا لهم بأن يعرفوا.
- source_word: ἐγγὺς τὸ θέρος ἐστίν
  choice: أن الصيف قريب
  rationale: تنقل «قريب» الدلالة الزمنية لـ ἐγγύς، و«الصيف» هو المعنى الموسمي المباشر لـ θέρος في صورة شجرة التين.
theological_decisions:
- issue: دلالة παραβολή في هذا السياق
  choice: المثل
  alternative: العبرة أو التشبيه
  rationale: يحافظ «المثل» على المصطلح الإنجيلي المعتاد وعلى الصلة بأسلوب تعليم يسوع، مع بقاء معنى العبرة التشبيهية ظاهرًا من السياق من غير فرض تفصيل رمزي إضافي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. وُضعت علامة الحاشية بعد «المثل» لأنها تتعلق بالبدائل المعجمية لكلمة παραβολή.
