base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: ar
  text: 'وفيما كان يخرج من الهيكل[a]، يقول له واحد من تلاميذه: «يا معلّم، انظر! ما أروع هذه الحجارة، وما أروع هذه الأبنية!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير الكلمة اليونانية هنا إلى مجمّع الهيكل وساحاته، لا إلى المقدس الداخلي وحده.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «ما أعظم هذه الحجارة، وما أعظم هذه الأبنية!» فالوصف اليوناني يعبّر عن الدهشة أو الإعجاب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: وفيما هو خارج
  rationale: ينقل تركيب المضاف المطلق مع اسم الفاعل الحاضر بوصفه فعلًا جاريًا ومتزامنًا مع كلام التلميذ، بصياغة عربية طبيعية.
- source_word: τοῦ ἱεροῦ
  choice: الهيكل
  rationale: اللفظ اليوناني ἱερόν يدل هنا على مجمّع الهيكل وساحاته، لا على المقدس الداخلي وحده؛ وأُبقي اللفظ العربي المألوف مع إيضاح المعنى في الحاشية.
- source_word: λέγει
  choice: يقول
  rationale: يحافظ المضارع على الحاضر التاريخي الذي يضفي حيوية على سرد مرقس.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: واحد من تلاميذه
  rationale: ترجمة مباشرة للتعبير التبعيضي من غير توسع.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: ينقل صيغة النداء ومعنى التعليم بوضوح في العربية المعاصرة.
- source_word: ἴδε
  choice: انظر
  rationale: أمر يلفت الانتباه، و«انظر» فصيحة وطبيعية.
- source_word: ποταποὶ ... καὶ ποταπαὶ
  choice: ما أعظم ... وما أعظم ...
  rationale: صيغة تعجب عربية طبيعية تنقل الدهشة والإعجاب اللذين يفيدهما الوصف اليوناني، مع إبقاء احتمال معنى الروعة في الحاشية.
- source_word: λίθοι
  choice: الحجارة
  rationale: المقصود حجارة أبنية الهيكل، والتعريف طبيعي في السياق ويشير إلى ما يراه المتكلم.
- source_word: οἰκοδομαί
  choice: الأبنية
  rationale: لفظ واضح يشمل مباني مجمّع الهيكل ومنشآته.
