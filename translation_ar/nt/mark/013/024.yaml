  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: ar
  text: «ولكن في تلك الأيام، بعد تلك الضيقة[a]، ستُظلِم الشمس، ولن يعطي القمر ضوءه.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعد تلك الشدة»، أو «بعد ذلك الكرب».'
    reason: بدائل معجمية ممكنة للكلمة اليونانية θλῖψις.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: ولكن
  rationale: تفيد انتقالًا تقابليًا قويًا مع الكلام السابق، وهي طبيعية وفصيحة في العربية المعاصرة.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: في تلك الأيام
  rationale: تحافظ على البنية الزمنية المباشرة وعلى النبرة الأخروية من غير توسع تفسيري.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: بعد تلك الضيقة
  rationale: «بعد» تنقل الدلالة الزمنية لحرف الجر، و«الضيقة» تحفظ ثقل θλῖψις في السياق الرؤيوي، مع إبقاء اسم الإشارة للتحديد.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: ستُظلَم الشمس
  rationale: تنقل زمن المستقبل وصيغة المبني للمجهول في اليونانية، وتظل عبارة عربية واضحة وطبيعية.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: لن يعطي القمر ضوءه
  rationale: تحافظ على صورة «الإعطاء» الواردة في النص، و«ضوءه» هو المقابل المباشر الطبيعي لـ φέγγος αὐτῆς.
theological_decisions:
- issue: دلالة θλῖψις في الخطاب الأخروي
  choice: الضيقة
  alternative: الشدة أو الكرب أو الاضطهاد
  rationale: «الضيقة» تحتفظ بالقوة الأخروية للمصطلح وبصلته بالسياق المباشر، من غير أن تفرض نظامًا محددًا لتفسير أحداث النهاية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة؛ الترجمة قريبة من بنية الأصل مع صياغة طبيعية. طابق ضمير القمر بصيغة المذكر وفق الاستعمال العربي.
