  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: ar
  text: فمَن كان على سطح البيت[a]، فلا ينزلْ ولا يدخلْ ليأخذ شيئًا من بيته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود سطح البيت المستوي، وكان يُستعمل أحيانًا للجلوس أو لممارسة بعض شؤون الحياة اليومية.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: مَن كان على سطح البيت
  rationale: العبارة المعرَّفة تؤدي وظيفة اسمية وتشير إلى أي شخص في ذلك الموضع؛ وصيغة «مَن كان» طبيعية في العربية وتحفظ القوة العامة للتوجيه.
- source_word: δώματος
  choice: سطح البيت
  rationale: يشير اللفظ في هذا السياق إلى السطح المستوي القابل للاستعمال فوق البيت، لا إلى غطاء مائل مجرد؛ و«سطح البيت» واضح ثقافيًا ومعماريًا.
- source_word: μὴ καταβάτω
  choice: فلا ينزل
  rationale: صيغة الأمر للغائب المنفية تُنقل طبيعيًا بلا الناهية مع المضارع المجزوم، وتحفظ معنى النزول من السطح.
- source_word: μηδὲ εἰσελθάτω
  choice: ولا يدخل
  rationale: تحفظ الواو مع «لا» النهي الثاني المنسق بواسطة μηδέ، من غير تحديد زائد لما لم يحدده النص إلا بالسياق.
- source_word: τι ἆραι
  choice: ليأخذ شيئًا
  rationale: ينقل المصدر غرض الدخول، ويعكس «شيئًا» الضمير النكرة من غير حصر نوع المتاع.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: من بيته
  rationale: «من» طبيعية مع فعل الأخذ وتفيد إخراج الشيء من داخل البيت، والضمير المفرد المذكر يحفظ صيغة المصدر ذات القوة التمثيلية العامة.
theological_decisions:
- issue: المفرد المذكر التمثيلي في وصية عامة
  choice: من بيته
  alternative: من بيتهم / من البيت
  rationale: يستعمل اليوناني مفردًا مذكرًا ذا قوة عامة؛ فحُفظ المفرد والضمير المذكر من دون تحويله إلى جمع أو حذف الضمير.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «سطح البيت» بدل لفظ قد يوحي بسقف داخلي، وأُبقي تتابع النهيين وإيقاع الاستعجال في النص.
