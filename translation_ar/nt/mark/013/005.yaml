base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: ar
  text: 'فبدأ يسوع يقول لهم: «احذروا أن يضلّكم أحد.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: حرف ربط خفيف يواصل السرد، والفاء طبيعية في العربية هنا من غير أن توحي بتعارض قوي.
- source_word: ἤρξατο λέγειν
  choice: بدأ يقول
  rationale: يحافظ على دلالة البدء في التعبير اليوناني، بصياغة عربية واضحة وطبيعية.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ينقل الضمير كما ورد، من غير استبداله بالاسم التفسيري «لتلاميذه».
- source_word: Βλέπετε
  choice: احذروا
  rationale: ينقل قوة فعل الأمر الداعي إلى اليقظة المستمرة، ويلائم في العربية جملة التحذير التالية.
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: أن يضلّكم أحد
  rationale: يحفظ المعنى الواسع للفعل، أي الخداع المؤدي إلى الانحراف عن الطريق، ولا يقصره على التضليل الفكري.
theological_decisions:
- issue: طبيعة التحذير في πλανήσῃ
  choice: تحذير من أن يخدعهم أحد فيقودهم إلى الضلال
  alternative: تحذير مقصور على الخداع الفكري
  rationale: الفعل اليوناني قد يدل على الإضلال والتضليل مع صورة الانحراف عن الطريق؛ و«يضلّكم» تحفظ هذا الاتساع من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُعمل «احذروا» بدل تراكيب أقدم مثل «انظروا» أو «تحرّزوا»، وحُفظ ضمير «لهم» كما في المصدر.
