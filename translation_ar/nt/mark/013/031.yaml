  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ar
  text: السماء والأرض ستزولان، أما كلامي فلن يزول أبدًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: السماء
  rationale: في اقترانه بالأرض، يدل اللفظ على السماء في التعبير الكوني الشامل «السماء والأرض»، لا على الجو المنظور وحده.
- source_word: ἡ γῆ
  choice: الأرض
  rationale: ضمن العبارة الثابتة «السماء والأرض»، يشير اللفظ إلى الأرض بوصفها جزءًا من النظام الكوني، لا إلى إقليم بعينه.
- source_word: παρελεύσονται
  choice: ستزولان
  rationale: الفعل هنا يفيد الزوال أو الانقضاء. وصيغة المثنى العربية تلائم الفاعلين «السماء والأرض» وتحافظ على الإيجاز.
- source_word: δὲ
  choice: أما ... فـ
  rationale: ينشئ هذا التركيب مقابلة عربية طبيعية وواضحة بين زوال السماء والأرض وعدم زوال كلام يسوع.
- source_word: οἱ λόγοι μου
  choice: كلامي
  rationale: «كلامي» تعبير عربي طبيعي يدل على مجموع أقوال المتكلم، ويؤدي معنى الجمع اليوناني دون تكلف.
- source_word: οὐ μὴ παρελεύσονται
  choice: فلن يزول أبدًا
  rationale: يجمع «لن» مع «أبدًا» لإظهار النفي اليوناني المؤكد بوضوح وقوة في العربية المعاصرة.
theological_decisions:
- issue: قوة النفي المؤكد بشأن كلام يسوع
  choice: فلن يزول أبدًا
  alternative: فلن يزول مطلقًا
  rationale: يحافظ النص على المقابلة اللاهوتية بين زوال النظام المخلوق وثبات كلام يسوع، ويجعل توكيد οὐ μή مسموعًا من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات نبرة وقورة. استُخدم المثنى في «ستزولان» مراعاةً لبنية العربية، و«كلامي» بوصفه اسم جمع طبيعيًا لأقوال المتكلم.
