base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: ar
  text: ولا يرجع من كان في الحقل إلى الوراء ليأخذ رداءه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثوبه الخارجي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: من كان في الحقل
  rationale: تركيب اسمي يشير بصورة عامة إلى الشخص الموجود في الحقل، وهذه الصياغة عربية طبيعية وتحافظ على الإفراد.
- source_word: ἀγρός
  choice: الحقل
  rationale: المعنى المباشر والأنسب للسياق هو الحقل أو الأرض الزراعية، و«الحقل» أوضح وأوجز.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: ولا يرجع ... إلى الوراء
  rationale: ينقل النهي العاجل، مع إظهار العبارة اليونانية الدالة على الرجوع إلى ما وراءه.
- source_word: ἆραι
  choice: ليأخذ
  rationale: المصدر يدل على الغرض من الرجوع، و«ليأخذ» ينقل المعنى هنا بطبيعية من غير افتراض تفصيل زائد عن النص.
- source_word: ἱμάτιον
  choice: رداءه
  rationale: يدل اللفظ غالبًا على الثوب الخارجي؛ و«رداء» لفظ عربي واضح وموجز، مع بيان البديل الأصرح في الحاشية.
- source_word: αὐτοῦ
  choice: ـه
  rationale: يحافظ ضمير المفرد المذكر على صورة المرجع العام المفرد في اليونانية.
theological_decisions:
- issue: الإشارة العامة بصيغة المفرد المذكر
  choice: من كان ... رداءه
  alternative: الذين كانوا في الحقل ... أرديتهم
  rationale: يحافظ النص على المفرد والضمير المذكر كما في اليونانية، مع بقاء العبارة عامة وغير مقصورة دلاليًا على الرجال.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة؛ استُعمل «ولا يرجع» لنقل النهي في سياق الوصايا المتتابعة، و«رداء» بوصفه المقابل الطبيعي الموجز.
