  text: ⸀ὃ δὲ ὑμῖν λέγω πᾶσιν λέγω· γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/037.yaml
  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: ar
  text: 'وما أقوله لكم أقوله للجميع: اسهروا[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ابقوا يقظين» أو «كونوا متنبّهين».'
    reason: بديل معجمي
lexical_decisions:
- source_word: ὃ
  choice: ما
  rationale: اسم موصول محايد مستعمل استعمالًا اسميًا؛ و«ما» تنقل المعنى الإجمالي الاستئنافي بوضوح وطبيعية.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة في هذا السياق، وليست للاستدراك القوي؛ لذلك تنقلها الواو من غير إضافة تعارض غير موجود في النص.
- source_word: ὑμῖν
  choice: لكم
  rationale: ضمير مخاطب في صيغة الجمع، موجَّه أولًا إلى التلاميذ الحاضرين.
- source_word: λέγω ... λέγω
  choice: أقوله ... أقوله
  rationale: حُفظ تكرار الفعل في اليونانية لما فيه من توكيد وبنية بلاغية واضحة، مع إضمار المفعول في الموضعين داخل الصلة العربية الطبيعية.
- source_word: πᾶσιν
  choice: للجميع
  rationale: تنقل بإيجاز شمول صيغة الجمع اليونانية، وتُظهر اتساع الخطاب من المخاطَبين مباشرة إلى الجميع.
- source_word: γρηγορεῖτε
  choice: اسهروا
  rationale: فعل أمر لجمع المخاطَبين بصيغة تفيد الاستمرار في اليقظة؛ و«اسهروا» تحفظ صورة عدم النوم المعبّرة عن التأهب، مع بيان البدائل الدلالية في الحاشية.
theological_decisions:
- issue: نطاق وصية يسوع
  choice: القول الموجَّه إلى التلاميذ يمتد صراحةً إلى الجميع.
  alternative: قد يُفهم القول في سياقه القصصي على أنه مقصور على السامعين المباشرين.
  rationale: يقابل النص اليوناني صراحةً بين «لكم» و«للجميع»، فحُفظ هذا التوسيع من غير تضييق الوصية على التلاميذ وحدهم.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة لائقة. حُفظ تكرار «أقوله» وشمول «للجميع»، ووُضعت علامة الحاشية في المتن بعد فعل الأمر.
