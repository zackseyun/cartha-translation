  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: ar
  text: كذلك أنتم أيضًا، متى رأيتم هذه الأمور تحدث، فاعلموا أنه قريب، عند الأبواب.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن يُفهم الضمير على أنه يشير إلى ابن الإنسان: «إنه قريب». فاليونانية لا تذكر الفاعل صراحة.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: هكذا أنتم أيضًا
  rationale: تحافظ «هكذا» على الصلة بمثل شجرة التين السابق، ويبرز «أنتم أيضًا» التلاميذ بوصفهم النظير المقابل للمراقبين في المثل.
- source_word: ὅταν ἴδητε
  choice: متى رأيتم
  rationale: تفيد العبارة اليونانية حالة مستقبلية متوقعة؛ و«متى» صياغة عربية طبيعية تلائم السياق التنبؤي.
- source_word: ταῦτα γινόμενα
  choice: هذه الأمور تحدث
  rationale: تحافظ «هذه الأمور» على جمع اسم الإشارة، وتنقل «تحدث» معنى وقوع الأحداث بلغة واضحة معاصرة.
- source_word: γινώσκετε
  choice: فاعلموا
  rationale: تنقل صيغة الأمر، وتُظهر الفاء أن المعرفة هي الاستنتاج المطلوب عند رؤية تلك الأمور.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: أنه قريب
  rationale: لا تصرّح اليونانية بفاعل الفعل، والضمير العربي في «أنه» يحتمل بحسب السياق الإشارة إلى شخص مذكر أو أمر مذكر، فلا يحسم المرجع أكثر مما يحسمه الأصل.
- source_word: ἐπὶ θύραις
  choice: على الأبواب
  rationale: تحافظ الصياغة على جمع «الأبواب» في اليونانية، وهي عبارة عربية مفهومة تدل على شدة القرب.
theological_decisions:
- issue: الفاعل الضمني في ἐγγύς ἐστιν («قريب»).
  choice: 'صياغة المتن: «أنه قريب»، مع إبقاء المرجع غير مصرّح به.'
  alternative: «إنه، أي ابن الإنسان، قريب» أو «إن ذلك قريب».
  rationale: الأصل اليوناني لا يذكر الفاعل صراحة. والصياغة المختارة لا تعيّن هل المقصود شخصًا، كابن الإنسان، أم الحدث أو التحقق المنتظر، وبذلك تحفظ الغموض والتوتر التفسيريين.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. حُفظت صلة القول بمثل شجرة التين، وجمع «الأبواب»، كما حُفظ غموض الفاعل دون إدخال تحديد لاهوتي غير مصرّح به.
