  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: ar
  text: لأن أمة ستقوم على أمة، ومملكة على مملكة. وستحدث زلازل في أماكن شتى، وستكون مجاعات. هذه بداية آلام المخاض[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أوجاع الولادة». الصورة اليونانية هي آلام المخاض والولادة، وتُستعمل هنا مجازًا للمعاناة التي تسبق ما سيأتي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: ستقوم
  rationale: الفعل المبني للمجهول يُستعمل هنا اصطلاحيًا لنهوض جماعة لمواجهة أخرى؛ و«ستقوم» عربية طبيعية تحفظ معنى اندلاع الصراع من غير تكلّف في نقل صيغة المبني للمجهول.
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: أمة ... على أمة
  rationale: «أمة» تنقل معنى الشعب أو الكيان القومي هنا، وحرف «على» يحفظ دلالة المواجهة في هذا التركيب المتوازي.
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: مملكة ... على مملكة
  rationale: المقصود كيان سياسي تحكمه سلطة ملكية، لا مفهوم المُلك المجرّد؛ والصياغة تحفظ التوازي مع «أمة على أمة».
- source_word: σεισμοὶ
  choice: زلازل
  rationale: المعنى المباشر والمألوف للكلمة في هذا السياق.
- source_word: κατὰ τόπους
  choice: في أماكن شتى
  rationale: تنقل القوة التوزيعية للعبارة، أي وقوع الزلازل في مواضع متعددة.
- source_word: λιμοί
  choice: مجاعات
  rationale: تدل الكلمة على المجاعة، لا على الجوع الفردي أو مجرد نقص محدود في الطعام.
- source_word: ἀρχὴ
  choice: بداية
  rationale: تحفظ كون الأحداث المذكورة بدءًا لما يلي، لا مجملَه أو نهايتَه.
- source_word: ὠδίνων
  choice: آلام المخاض
  rationale: تحفظ صورة آلام الولادة المجازية بعبارة عربية واضحة وشائعة، من غير اختزالها إلى متاعب عامة.
- source_word: ταῦτα
  choice: هذه
  rationale: يعود اسم الإشارة إلى الأحداث المذكورة مجتمعة، وتلائم «هذه» الخبر المفرد «بداية» في العربية.
theological_decisions:
- issue: الصورة الأخروية في ἀρχὴ ὠδίνων
  choice: هذه بداية آلام المخاض
  alternative: هذه مجرد متاعب؛ أو تفسيرها صراحةً بوصفها مرحلة محددة ضمن نظام أخروي تفصيلي
  rationale: 'تحفظ الصياغة توتر الصورة: آلام تمهيدية تسبق ما سيأتي، من غير تسطيحها إلى مشقات عامة أو تحميلها نظامًا أخرويًا لا يصرّح به النص.'
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «تقوم ... على» لصياغة الصراع بصورة طبيعية، و«أماكن شتى» لإيجاز الدلالة التوزيعية. وُضع مؤشر الحاشية بعد «آلام المخاض» لأنه يشرح هذه العبارة تحديدًا.
