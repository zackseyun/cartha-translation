  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: ar
  text: 'فاسهروا إذن[a]، لأنكم لا تعرفون متى يأتي سيد البيت: أفي المساء، أم عند منتصف الليل، أم عند صياح الديك[b]، أم في الصباح.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ابقوا متيقظين». يفيد الأمر دوام الانتباه والاستعداد.'
    reason: lexical_alternative
  - marker: b
    text: كان «صياح الديك» اسمًا لفترة من فترات حراسة الليل، ارتبطت بوقت صياح الديكة.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: فاسهروا
  rationale: فعل أمر يفيد البقاء يقظين ومتنبّهين. «اسهروا» طبيعي في سياق أوقات الليل، مع بيان معنى التيقظ في الحاشية.
- source_word: οὖν
  choice: إذن
  rationale: تحفظ علاقة الاستنتاج بما سبق، وتأتي في موضع طبيعي بعد فعل الأمر في العربية.
- source_word: οὐκ οἴδατε
  choice: لا تعرفون
  rationale: نقل مباشر لنفي المعرفة من غير إضافة معنى اليقين غير المذكور في اليونانية.
- source_word: πότε
  choice: متى
  rationale: أداة الاستفهام الزماني الطبيعية في السؤال غير المباشر.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: سيد البيت
  rationale: تنقل سلطة صاحب البيت داخل الصورة التمثيلية، وتحفظ في الوقت نفسه قدرًا من صدى κύριος من غير تحويل العبارة صراحةً إلى لقب إلهي.
- source_word: ἔρχεται
  choice: يأتي
  rationale: المضارع العربي يلائم المجيء المنتظر ذي الدلالة المستقبلية في السياق.
- source_word: ὀψὲ
  choice: في المساء
  rationale: يشير ضمن تسلسل أقسام الليل إلى وقت المساء، لا إلى معنى مبهم مثل «متأخرًا».
- source_word: μεσονύκτιον
  choice: عند منتصف الليل
  rationale: تعبير عربي واضح ودقيق عن هذا الوقت ضمن تعداد فترات الليل.
- source_word: ἀλεκτοροφωνίας
  choice: عند صياح الديك
  rationale: ينقل العلامة الزمنية القديمة بعبارة عربية مفهومة، مع توضيح خلفيتها في الحاشية.
- source_word: πρωΐ
  choice: في الصباح
  rationale: يحفظ المعنى العام للفترة الأخيرة من الليل الممتدة إلى الصباح من غير حصرها في لحظة الفجر.
theological_decisions:
- issue: ترجمة κύριος في صورة صاحب البيت التي قد تشير ضمنًا إلى يسوع
  choice: سيد البيت
  alternative: رب البيت؛ صاحب البيت
  rationale: «سيد البيت» يعبّر عن سلطة الشخصية داخل الصورة المنزلية ويحافظ على احتمال الإشارة الأوسع، من غير أن يحسم العبارة كلقب إلهي مباشر. أما «صاحب البيت» فيبرز الملكية أكثر من السلطة، و«رب البيت» قد يُفهم في العربية المعاصرة على أنه لقب إلهي صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم الاستفهام التعدادي «أفي... أم...» لإبراز البدائل الزمنية، ووُضعت علامتا الحاشيتين [a] و[b] في المتن.
