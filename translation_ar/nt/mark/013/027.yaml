  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: ar
  text: وحينئذٍ يرسل الملائكة، ويجمع المختارين من الرياح الأربع[a]، من أقصى الأرض إلى أقصى السماء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«الرياح الأربع» تعبير يعني: من جميع الجهات.'
    reason: cultural_note
  - marker: b
    text: 'يمكن أن تُفهم العبارة الأخيرة أيضًا بمعنى: «من أبعد أطراف الأرض إلى أبعد أطراف السماء»، وقد تُصاغ تفسيريًا: «من طرفٍ من السماء إلى الطرف الآخر».'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: حينئذٍ
  rationale: تفيد التتابع الزمني في سياق الخطاب الأخروي، وهي فصيحة وواضحة في العربية المعاصرة.
- source_word: ἀποστελεῖ
  choice: يرسل
  rationale: مضارع عربي يدل بحسب السياق على المستقبل، وينقل معنى الإرسال من غير زيادة تفسيرية.
- source_word: ἀγγέλους
  choice: الملائكة
  rationale: السياق الرؤيوي يدل على الكائنات السماوية، لا على رسل بشريين.
- source_word: ἐπισυνάξει
  choice: يجمع
  rationale: ينقل معنى ضم المتفرقين معًا بصورة طبيعية وموجزة.
- source_word: ἐκλεκτούς
  choice: المختارين
  rationale: ينقل الصفة المستعملة اسميًا من غير تحويلها إلى مصطلح مذهبي تقني أو إضافة ضمير ملكية غير موجود في اليونانية.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: من الرياح الأربع
  rationale: يحفظ الصورة الكتابية الأصلية الدالة اصطلاحيًا على جميع الجهات.
- source_word: ἀπ’ ἄκρου γῆς
  choice: من أقصى الأرض
  rationale: تعبر «أقصى» عن الطرف أو الحد البعيد الذي تدل عليه ἄκρον، بصياغة عربية مألوفة.
- source_word: ἕως ἄκρου οὐρανοῦ
  choice: إلى أقصى السماء
  rationale: تحافظ على الموازاة المكانية مع «أقصى الأرض» وعلى صورة الشمول الكوني، من غير حسم ما إذا كانت οὐρανός هنا السماء المرئية أو المجال السماوي.
- source_word: καὶ τότε ... καὶ
  choice: وحينئذٍ ... و
  rationale: حُفظ العطف لتجسيد تتابع الأسلوب المرقسي وترابط الفعلين.
theological_decisions:
- issue: دلالة ἐκλεκτούς في السياق الأخروي
  choice: المختارين
  alternative: المختارين له؛ الصفوة
  rationale: «المختارين» واضحة وتحفظ معنى الاختيار الإلهي في السياق، مع تجنب إضافة «له» غير الموجودة نصًا أو استعمال لفظ قد يحمل حمولة مذهبية تقنية زائدة.
- issue: مدى صورة الجمع
  choice: من الرياح الأربع، من أقصى الأرض إلى أقصى السماء
  alternative: من الجهات الأربع؛ من أقصى الأرض إلى أقصى السماء الأخرى؛ من طرف السماء إلى طرفها
  rationale: تحفظ الصياغة صورتي الرياح الأربع والامتداد بين أقصى الأرض وأقصى السماء كما وردتا، بدل تسويتهما في عبارة تفسيرية واحدة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «حينئذٍ» و«أقصى» للمحافظة على الإيجاز والصورة الأصلية، وتُرك الفاعل في «يرسل» مستترًا كما في السياق العربي، من غير إضافة «له» إلى «المختارين». جميع علامات الحواشي مثبتة في المتن.
