  alternative: لئلّا يأتي السيد بغتةً فيجدكم نائمين
  rationale: النص اليوناني في هذه الآية يستخدم فعلين بفاعل مستتر، وتُفهم هويته من السياق؛ فعدم إدخال اسم صريح يصون صياغة المصدر.
