  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: ar
  text: ولكن صلّوا ألّا يحدث ذلك في الشتاء[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتعبير أوضح في ضوء السياق: «ألّا يكون هربكم في الشتاء». فالعبارة اليونانية في مرقس أكثر إيجازًا وحذفًا من النص الموازي في متى 24:20.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: صلّوا
  rationale: فعل أمر مضارع موجّه إلى جمع. صيغته العربية الطبيعية «صلّوا» تحفظ الأمر والجمع، من غير تحميل صيغة المضارع معنى الاستمرار تحميلًا زائدًا.
- source_word: δὲ
  choice: ولكن
  rationale: أداة انتقال وربط خفيف، وفي السياق تحمل مسحة استدراك بعد التحذير السابق؛ لذا تلائمها «ولكن».
- source_word: ἵνα μὴ
  choice: ألّا
  rationale: تدخل على مضمون الصلاة المنفي، و«ألّا» تعبير عربي موجز وطبيعي بعد «صلّوا».
- source_word: γένηται
  choice: يحدث ذلك
  rationale: صيغة احتمال من γίνομαι، والفاعل أو الحدث المقصود محذوف في اليونانية ويُفهم من السياق. أضيف اسم الإشارة بوصفه إحالة عامة لا تحديدًا صريحًا للهرب، مع إبقاء العبارة موجزة.
- source_word: χειμῶνος
  choice: في الشتاء
  rationale: مضاف إليه دال على الزمن مستعمل استعمالًا ظرفيًا؛ والمقابل العربي الطبيعي هو «في الشتاء».
theological_decisions:
- issue: المقصود الضمني بفاعل γένηται
  choice: 'الإبقاء على الإحالة العامة: «ألّا يحدث ذلك»'
  alternative: «ألّا يكون هربكم في الشتاء»
  rationale: نص مرقس اليوناني لا يصرّح بلفظ «هربكم»، خلافًا للصياغة الأوضح في متى 24:20. لذلك لا تُستورد العبارة من النص الموازي، بل يُحفظ إيجاز مرقس واحتماله السياقي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدمت «صلّوا» بصيغة الجمع، وحُفظ الحذف الموجود في الأصل مع إحالة طبيعية بواسطة «ذلك».
