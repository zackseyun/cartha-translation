base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: ar
  text: '«قُلْ لنا: متى تكون هذه الأمور؟ وما العلامة حين تكون هذه الأمور كلها على وشك أن تتم؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حين تتم هذه الأمور كلها». يستعمل اليوناني فعل μέλλω مع المصدر، وقد يدل بصورة أخص على أن الأمر «على وشك» الوقوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: قُلْ لنا
  rationale: صيغة أمر مفرد موجّهة إلى يسوع، ومعها ضمير المتكلمين في موقع المفعول غير المباشر. وهذه العبارة طبيعية وواضحة في العربية.
- source_word: πότε ταῦτα ἔσται
  choice: متى تكون هذه الأمور؟
  rationale: يحافظ التعبير على أداة الاستفهام الزمنية وعلى جمع اسم الإشارة، ويترجم فعل الكينونة ترجمة مباشرة من غير إضافة معنى «تحدث» إلى النص.
- source_word: τί τὸ σημεῖον
  choice: ما العلامة
  rationale: «العلامة» هي المقابل العربي المألوف لـ σημεῖον في هذا السياق، ولا يصرّح اليوناني بفعل في هذه الجملة الاسمية، لذلك لا حاجة إلى زيادته في العربية.
- source_word: ὅταν μέλλῃ
  choice: حين تكون ... على وشك أن
  rationale: ينقل «حين» الجملة الزمنية، وتحفظ عبارة «على وشك أن» الدلالة الاستقبالية أو الوشيكة التي قد يؤديها μέλλω مع المصدر.
- source_word: ταῦτα συντελεῖσθαι πάντα
  choice: تتم هذه الأمور كلها
  rationale: «تتم» تنقل بلوغ الأمور تمامها أو نهايتها بصورة طبيعية، وترتيب «هذه الأمور كلها» عربي سليم ويحفظ شمول πάντα.
theological_decisions:
- issue: الدلالة الأخروية لتركيب μέλλῃ مع المصدر
  choice: الحفاظ على معنى الترقب أو الوشيك بعبارة «على وشك أن تتم»
  alternative: «حين تتم هذه الأمور كلها»
  rationale: وجود μέλλω يضيف معنى استشراف وقوع الفعل أو اقترابه، وحذفه يسطّح هذا الفرق. ولا تفرض الصياغة جدولًا زمنيًا عقائديًا يتجاوز ما يقوله النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «تتم» بدل صياغة مبنية للمجهول أثقل، لأن الفعل اليوناني المتوسط/المبني للمجهول هنا يدل على بلوغ الأحداث تمامها، وتؤدي العربية هذا المعنى طبيعيًا بالفعل اللازم.
