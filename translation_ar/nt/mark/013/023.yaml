  text: ὑμεῖς δὲ βλέπετε· ⸀προείρηκα ὑμῖν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/023.yaml
  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: ar
  text: أمّا أنتم فانتبهوا[a]؛ لقد أخبرتكم بكلّ شيء مسبقًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فكونوا على حذر» أو «فتيقّظوا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «سبق أن قلت لكم كلّ شيء» أو «حذّرتكم من كلّ شيء مسبقًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: أنتم
  rationale: الضمير مذكور صراحة في اليونانية للتوكيد والمقابلة، لذلك أُثبت في العربية بعد «أمّا».
- source_word: δὲ
  choice: أمّا
  rationale: تفيد الانتقال مع المقابلة بما سبق، وصيغة «أمّا أنتم» طبيعية وتحفظ بروز المخاطَبين.
- source_word: βλέπετε
  choice: فانتبهوا
  rationale: فعل أمر جمع في سياق تحذيري، والمقصود اليقظة والحذر لا مجرد النظر الحسي.
- source_word: προείρηκα
  choice: لقد أخبرتكم ... مسبقًا
  rationale: الفعل يدل على القول أو الإخبار سلفًا، وصيغة الماضي مع «لقد» تنقل وقوع الإخبار سابقًا وبقاء أهميته في الحاضر.
- source_word: ὑμῖν
  choice: كم في «أخبرتكم»
  rationale: ضمير المفعول غير المباشر أُدمج طبيعيًا في الفعل العربي.
- source_word: πάντα
  choice: بكلّ شيء
  rationale: يحفظ الشمول الذي في اللفظ اليوناني من غير أن يحسم ما إذا كان النطاق كل التفاصيل أو كل الأمور ذات الصلة بالسياق.
theological_decisions:
- issue: مدى التحذير والإخبار السابق
  choice: الإبقاء على العبارة الشاملة «بكلّ شيء» ضمن سياق التحذيرات السابقة من غير إضافة تفسير مقيِّد
  alternative: صياغتها «بكلّ هذه الأمور» أو تفسيرها بأنها كل التفاصيل المستقبلية
  rationale: النص يحمل شمولًا سياقيًا، لكنه لا يصرّح بأن يسوع كشف كل تفصيل مستقبل؛ لذا تُحفظ سعة العبارة وتوترها من غير حسم تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أمّا أنتم» لحفظ التوكيد والمقابلة، و«فانتبهوا» لنقل قوة الأمر التحذيري، مع تجنب لغة مذهبية أو تفسير زائد.
