source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: ar
  text: ومتى اقتادوكم وسلّموكم، فلا تقلقوا مسبقًا بشأن ما ستقولونه؛ بل قولوا ما يُعطى لكم في تلك الساعة، لأنكم لستم أنتم المتكلمين، بل الروح القدس.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅταν
  choice: ومتى
  rationale: تربط القول بما قبله وتعرض ظرفًا مستقبليًا متوقعًا، مع بقاء دلالة التوقيت والاحتمال.
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: ساقوكم ليسلّموكم
  rationale: «ساق» يلائم الاقتياد القسري في سياق الاضطهاد، ولام التعليل تصوغ اسم الفاعل اليوناني طبيعيًا بوصف التسليم غاية الاقتياد من غير حصره في الخيانة.
- source_word: μὴ προμεριμνᾶτε
  choice: فلا تقلقوا مسبقًا
  rationale: يحفظ معنى القلق الاستباقي الذي يدل عليه المقطع προ-، بعبارة عربية واضحة معاصرة.
- source_word: τί λαλήσητε
  choice: بشأن ما تتكلمون به
  rationale: يحافظ على حقل λαλέω وعلى الصلة بالتكرار اللاحق، مع صياغة عربية مفهومة.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: بما يُعطى لكم
  rationale: يبقي المبني للمجهول ولا يصرّح بهوية المُعطي قبل أن يبيّن ختام الآية فاعلية الروح القدس.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: في تلك الساعة
  rationale: ترجمة مباشرة تحفظ النبرة الحاسمة والتعبير الزمني في الأصل.
- source_word: τοῦτο λαλεῖτε
  choice: تكلموا بما يُعطى لكم
  rationale: تجعل مرجع اسم الإشارة واضحًا بالعربية وتحفظ فعل الكلام وتوكيد التحدث بالمُعطى تحديدًا.
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: لأن المتكلمين لستم أنتم
  rationale: يحفظ توكيد الضمير ὑμεῖς والمقابلة الصريحة، بصياغة عربية فصيحة.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: المقابل العربي المعياري الواضح للقب في العهد الجديد.
theological_decisions:
- issue: فاعلية الكلام الملهم وقت الاضطهاد
  choice: تُنسب الفاعلية النهائية في الكلام إلى الروح القدس، مع بقاء التلاميذ مأمورين بأن يتكلموا بما يُعطى لهم.
  alternative: اعتبار التلاميذ أدوات سلبية محضة، أو فهم الروح القدس بوصفه مجرد تأثير إلهي عام.
  rationale: 'يحفظ النص التوتر بين المشاركة البشرية والفاعلية الإلهية: التلاميذ يتكلمون فعلًا، لكن المتكلم في المقابلة المؤكدة هو الروح القدس.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ساقوكم» لإظهار الاقتياد القسري، و«ليسلّموكم» للدلالة على التسليم إلى السلطات دون إدخال معنى الخيانة بالضرورة. لا توجد حواشٍ لازمة، ولذلك لا توجد علامات حواشٍ في المتن.
