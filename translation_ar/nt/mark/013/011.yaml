  - severity: low
    issue: «بشأن ما تتكلمون به» أقل طبيعية في موضع السؤال عن الكلام المقبل.
    rationale: «ما ستقولونه» تعبير عربي معاصر مباشر لسياق المثول المقبل، ولا يضيف إلزامًا أو تفسيرًا إلى النص.
