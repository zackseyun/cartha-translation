  rationale: 'يصحح التعديل علاقة الاقتياد بالتسليم، ويصقل العبارة العربية مع المحافظة على بنية النص: النهي عن القلق المسبق، والكلام بما يُعطى في الساعة الحاسمة، والمقابلة المؤكدة بين التلاميذ والروح القدس. لا تستلزم الآية حاشية في العربية.'
