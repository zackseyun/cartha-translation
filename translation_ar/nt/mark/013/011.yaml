  source_fidelity: 'يحتاج صدر الآية إلى تعديل: «ساقوكم ليسلّموكم» يحوّل اسم الفاعل παραδιδόντες إلى غاية صريحة للاقتياد («لكي يسلّموكم»)، بينما يصف الأصل الحدث المصاحب: اقتيادهم وتسليمهم. والصياغة المعدلة تحفظ الفعلين بوضوح. كما تحفظ المبني للمجهول في «ما يُعطى لكم» من غير تعيين المعطي.'
  naturalness: «ومتى اقتادوكم وسلّموكم» عربية فصيحة واضحة في سياق المثول القسري. و«لا تقلقوا مسبقًا بشأن ما ستقولونه» أكثر سلاسة من «بشأن ما تتكلمون به»، مع حفظ المعنى. وإعادة ترتيب الخاتمة إلى «لأنكم لستم أنتم المتكلمين» طبيعية وتحتفظ بالتوكيد.
  terminology: «الروح القدس» هو المقابل العربي المعياري المناسب. و«اقتادوكم» يوصل الإكراه الكامن في ἄγωσιν، و«سلّموكم» يوصل المعنى القضائي لـ παραδιδόντες دون افتراض خيانة.
