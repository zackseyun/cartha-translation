  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: ar
  text: 'وقال له يسوع: «أترى هذه الأبنية العظيمة[a]؟ لن يُترك هنا حجر على حجر[b] إلا ويُنقَض[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أبنية الهيكل العظيمة». يشير السياق إلى مجمّع الهيكل، مع أن اليونانية تقول ببساطة: «الأبنية».'
    reason: lexical_alternative
  - marker: b
    text: تعبير «حجر على حجر» صورة تدل على الهدم الكامل.
    reason: cultural_note
  - marker: c
    text: 'أو: «يُدمَّر» أو «يُطرح أرضًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: أترى
  rationale: صيغة استفهام مباشرة تحافظ على الفعل في الزمن الحاضر، وتأتي طبيعية وموجزة في العربية.
- source_word: μεγάλας οἰκοδομάς
  choice: الأبنية العظيمة
  rationale: «الأبنية» تنقل اللفظ اليوناني العام من غير إضافة «الهيكل» إلى المتن، و«العظيمة» تحتمل ضخامة الحجم وروعة البناء معًا.
- source_word: οὐ μὴ ἀφεθῇ
  choice: لن يُترك
  rationale: «لن» تؤدي النفي المستقبلي القاطع بصورة طبيعية في العربية، بما يلائم توكيد οὐ μή.
- source_word: ὧδε
  choice: هنا
  rationale: تنقل دلالة المكان المباشرة بوضوح.
- source_word: λίθος ἐπὶ λίθον
  choice: حجر على حجر
  rationale: تحافظ على الصورة التعبيرية اليونانية المألوفة الدالة في السياق على الهدم الكامل.
- source_word: ὃς οὐ μὴ καταλυθῇ
  choice: إلا ويُنقَض
  rationale: هذه الصياغة العربية الطبيعية تحافظ على معنى أن كل حجر متروك على آخر سيُهدم، من غير إضعاف النفي المؤكد.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: وقال له يسوع
  rationale: نقل مباشر للربط السردي والفعل والضمير، من غير إضافة معنى «أجاب» غير الصريح.
theological_decisions:
- issue: نطاق النبوءة المتعلقة بمجمّع الهيكل
  choice: إبقاء «الأبنية» عامة في المتن
  alternative: «أبنية الهيكل العظيمة»
  rationale: السياق يحدد أنها أبنية الهيكل، لكن النص اليوناني يقول «الأبنية» فقط؛ لذلك لا تُضاف كلمة تفسيرية إلى المتن، مع بيان المرجع السياقي في الحاشية.
- issue: مدى الدمار المعلن
  choice: صياغة «لن يُترك هنا حجر على حجر إلا ويُنقَض»
  alternative: 'صياغة حرفية أثقل: «لن يُترك هنا حجر على حجر لا يُنقَض»'
  rationale: الصياغة المختارة تنقل بوضوح النفي اليوناني المؤكد وصورة الهدم الشامل، من غير تحويل القول إلى توصيف يتجاوز الصورة الواردة في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع بنية موجزة تلائم القول النبوي. وُضعت علامات الحواشي بجوار الألفاظ التي تشرحها مباشرة.
