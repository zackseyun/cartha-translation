  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: الوصل والزمن في «وعندئذ»، والشرط العام «إن قال لكم أحد»، والتنبيه المكاني المتقابل «هنا/هناك»، ولقب ὁ χριστός في «المسيح»، والنهي الجمعي في «فلا تصدّقوا». كما يحافظ حذف مفعول «تصدّقوا» على اتساع اليونانية، فلا يحصر النهي في تصديق المتكلم أو الخبر وحده.'
