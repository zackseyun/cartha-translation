  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: ar
  text: 'وعندئذ، إن قال لكم أحد: «ها هو المسيح هنا!» أو: «ها هو هناك!» فلا تصدّقوا.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ τότε
  choice: وعندئذ
  rationale: تحفظ الواو صلة الكلام بما سبقه، وتنقل τότε بوصفها إشارة زمنية إلى ما سيقع عند ذلك الحين.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: إن قال لكم أحد
  rationale: تنقل صيغة الشرط العامة والضمير غير المحدد τις بعبارة عربية فصيحة وطبيعية.
- source_word: Ἴδε
  choice: ها هو
  rationale: تؤدي وظيفة التنبيه والإشارة التي تؤديها Ἴδε، وهي هنا أنسب في العربية من الترجمة الحرفية بصيغة أمر مثل «انظر».
- source_word: ὧδε ... ἐκεῖ
  choice: هنا ... هناك
  rationale: تحفظ التقابل المكاني المباشر بين القريب والبعيد.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: اللفظ العربي المألوف والدقيق للقب الدال على الممسوح المنتظر، ويحفظ استعمال الكلمة هنا بوصفها لقبًا لا اسمًا شخصيًا محضًا.
- source_word: μὴ πιστεύετε
  choice: فلا تصدّقوا
  rationale: تحفظ النهي وصيغة الجمع، وتُبقي مفعول التصديق مفهومًا من السياق كما هو في اليونانية، من غير حصره في القائل أو في صيغة محددة للخبر.
theological_decisions:
- issue: دلالة ὁ χριστός بوصفه لقبًا أخرويًا
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب χριστός، ويحافظ في هذا السياق على معنى الشخصية المنتظرة التي يدّعي المدّعون وجودها. أما «الممسوح» فيوضح الاشتقاق لكنه غير طبيعي كلقب في العربية المعاصرة.
- issue: المفعول المحذوف مع πιστεύετε
  choice: 'الإبقاء عليه مفهومًا: «فلا تصدّقوا»'
  alternative: «فلا تصدّقوا ذلك» أو «فلا تصدّقوه»
  rationale: اليونانية لا تصرّح هل المنهي عنه تصديق الخبر أم القائل؛ والإبقاء على الحذف في العربية يصون هذا الاتساع ولا يحسمه بلا مسوغ.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة غير متكلّفة. استُعملت «ها هو» بوصفها أداة تنبيه وإشارة طبيعية، مع إبقاء الجملة الثانية موجزة على نحو الأصل، إذ يُفهم أن الضمير يعود إلى المسيح.
