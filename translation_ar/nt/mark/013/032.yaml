base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: ar
  text: «وأما ذلك اليوم أو تلك الساعة، فلا يعرفهما أحد، ولا حتى الملائكة في السماء، ولا الابن، بل الآب وحده.[a]»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يفهم بعض المفسرين عبارة «ولا الابن» بالإشارة إلى رسالة الابن في التجسد أو إلى طبيعته البشرية؛ وتحافظ الترجمة على ألفاظ النص اليوناني من غير أن تضيف هذا التفسير إلى المتن.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: وأما
  rationale: تقدّم انتقالًا خفيفًا إلى موضوع اليوم والساعة مع إبقاء مسحة المقابلة التي تحملها δέ، وهي صياغة عربية طبيعية واضحة.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: ذلك اليوم أو تلك الساعة
  rationale: تحافظ على الاسمين المعرّفين وإشارتهما إلى الزمن المعهود في السياق، وتراعي اختلاف جنس «اليوم» و«الساعة» في العربية.
- source_word: οὐδεὶς οἶδεν
  choice: فلا يعرفهما أحد
  rationale: الفعل οἶδα يؤدي معنى المعرفة في الزمن الحاضر. وأضيف ضمير التثنية لربط المعرفة طبيعيًا في العربية باليوم والساعة من غير تغيير المعنى.
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: ولا حتى الملائكة في السماء
  rationale: «ولا حتى» تنقل القوة التصاعدية لـ οὐδέ، و«في السماء» تفيد الموقع كما في الأصل.
- source_word: οὐδὲ ὁ υἱός
  choice: ولا الابن
  rationale: تحافظ على استمرار سلسلة النفي وعلى اللقب «الابن» بلا تلطيف أو إضافة تفسيرية.
- source_word: εἰ μὴ ὁ πατήρ
  choice: بل الآب وحده
  rationale: تنقل الاستثناء الحصري بعد النفي بأسلوب عربي واضح، وتحافظ «الآب» على الاستعمال اللقبي اللاهوتي المميز.
theological_decisions:
- issue: قول النص إن الابن لا يعرف اليوم أو الساعة
  choice: إبقاء العبارة الصريحة «ولا الابن» من غير تقييد تفسيري في المتن
  alternative: إضافة قيد مثل «بحسب طبيعته البشرية» أو «في رسالته المتجسدة»
  rationale: النص اليوناني يذكر οὐδὲ ὁ υἱός صراحة. وإضافة قيد تحسم توترًا لاهوتيًا لا يحسمه تركيب الآية نفسه؛ لذلك تُصان العبارة كما وردت، ويُذكر أحد أوجه الفهم في الحاشية فقط.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعمل «يعرفهما» بدل تركيب أقل سلاسة لتوضيح عود الفعل إلى اليوم والساعة، واستُعمل «الآب» باعتباره اللقب المسيحي المألوف في هذا السياق.
