  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: ar
  text: 'الحق أقول لكم: لن يزول هذا الجيل بالتأكيد حتى تحدث هذه الأمور كلها[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذا الشعب» أو «هذا العِرق». يمكن للكلمة اليونانية γενεά أن تحمل معاني أوسع، لكن «الجيل» هو المعنى الأرجح هنا.'
    reason: lexical_alternative
  - marker: b
    text: 'تفيد العبارة اليونانية نفيًا مشددًا، ولذلك تُرجمت: «لن يزول ... بالتأكيد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: الحق
  rationale: تؤدي وظيفة الاستهلال التوكيدي المهيب في أقوال يسوع، وهي صياغة عربية واضحة ومألوفة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: تحافظ على صيغة الخطاب المباشر وقربها من ترتيب اليونانية في عربية طبيعية.
- source_word: οὐ μὴ παρέλθῃ
  choice: لن يزول ... بالتأكيد
  rationale: تنقل النفي اليوناني المشدد οὐ μή مع الفعل، من غير أن تجعل المعنى «لن يزول أبدًا»، لأن العبارة مقيدة زمنيًا بما يليها.
- source_word: ἡ γενεὰ αὕτη
  choice: هذا الجيل
  rationale: «الجيل» هو المعنى الأرجح في هذا السياق الزمني والخطابي، مع إبقاء التوتر التفسيري وعدم حسمه لمصلحة تصور أخروي بعينه.
- source_word: μέχρις οὗ
  choice: حتى
  rationale: تعبّر بإيجاز ووضوح عن الحد الزمني الذي تدل عليه العبارة اليونانية.
- source_word: ταῦτα πάντα
  choice: هذه الأمور كلها
  rationale: تحافظ على اسم الإشارة للجمع وعلى شمول πάντα، وتشير طبيعيًا إلى الوقائع المذكورة في السياق السابق.
- source_word: γένηται
  choice: تحدث
  rationale: تنقل معنى وقوع الأحداث في هذا السياق بلغة عربية حديثة واضحة.
theological_decisions:
- issue: دلالة «هذا الجيل» (ἡ γενεὰ αὕτη) في الخطاب الأخروي
  choice: هذا الجيل
  alternative: «هذا الشعب» أو «هذا العِرق»، أو جيل مستقبلي يرى بدء العلامات
  rationale: المعنى المباشر والأرجح للتعبير اليوناني هنا هو «هذا الجيل». وبما أن العبارة موضع خلاف تفسيري، تُحفظ كما هي من دون توسيع يربطها بنظام أخروي محدد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت «الحق أقول لكم» لصيغة القول المهيب، وحُفظت دلالة «هذا الجيل» المباشرة مع توضيح البدائل في الحاشية دون حل التوتر التفسيري داخل المتن.
