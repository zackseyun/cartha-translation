lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: تصل الكلام بما قبله من غير إضافة معنى استدراكي غير صريح.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: لجميع الأمم
  rationale: تفيد جهة الإعلان ونطاقه العالمي، وتحفظ معنى الجماعات القومية دون حصره في غير اليهود.
- source_word: πρῶτον
  choice: أولًا
  rationale: تحفظ دلالة الأولوية الزمنية بإيجاز، من غير تحديد تفصيلي لتسلسل الأحداث.
- source_word: δεῖ
  choice: لا بد
  rationale: تؤدي معنى الضرورة بقوة وطبيعية في العربية، من غير التصريح بمصدر هذه الضرورة بما يتجاوز النص.
- source_word: κηρυχθῆναι
  choice: أن تُعلَن
  rationale: تنقل صيغة المبني للمجهول ومعنى المناداة العلنية بالرسالة، بلغة عربية واضحة ومعاصرة.
- source_word: τὸ εὐαγγέλιον
  choice: البشارة
  rationale: لفظ عربي طبيعي يدل على الخبر السار ويحافظ على الاستعمال الديني المألوف؛ ويُذكر «الخبر السار» في الحاشية بوصفه توضيحًا حرفيًا.
theological_decisions:
- issue: نطاق ἔθνη
  choice: جميع الأمم
  alternative: بين جميع الأمم؛ جميع غير اليهود
  rationale: يحفظ النطاق العالمي الواسع، ولا يحسم اللفظ في معنى «غير اليهود» وحده، مع التنبيه إلى هذا الاحتمال المعجمي في الحاشية.
- issue: دلالة δεῖ
  choice: لا بد
  alternative: يجب؛ من الضروري
  rationale: تحفظ معنى الضرورة، وربما الضرورة الإلهية في سياق مرقس، من غير أن تضيف النص صراحةً مصدرًا لم يذكره.
- issue: موضع πρῶτον
  choice: أولًا بعد «لا بد»
  alternative: يجب أن تُعلَن البشارة أولًا
  rationale: الموضع المختار طبيعي في العربية ويحافظ على أولوية الإعلان، من غير فرض تفسير أدق لتسلسل الأحداث الأخروية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «البشارة» لسلامتها وطبيعتها في السياق الكتابي، و«تُعلَن» لتجنب قصر الفعل على الوعظ الكنسي، مع إبقاء البدائل الدلالية في الحواشي.
