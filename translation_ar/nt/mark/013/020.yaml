source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: ar
  text: ولو لم يقصِّر الرب الأيام، لما خَلَصَ أيُّ جسد[a]. لكن من أجل المختارين الذين اختارهم قصَّر الأيام.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: أي إنسان أو أحد من البشر. حرفيًا: «كل جسد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: قصَّر
  rationale: ينقل معنى تقليل مدة الأيام بعبارة عربية مباشرة، مع الحفاظ على اللفظ نفسه في الموضعين.
- source_word: κύριος
  choice: الرب
  rationale: المقابل الكتابي العربي الواضح للاسم κύριος حين يدل على الله، والتعريف مفهوم من السياق.
- source_word: τὰς ἡμέρας
  choice: تلك الأيام / الأيام
  rationale: أُضيف اسم الإشارة في الذكر الأول لربطها طبيعيًا بأيام الضيق المذكورة في السياق، وحُفظ التعبير الأقرب إلى اليونانية في الذكر الثاني.
- source_word: οὐκ ἂν ἐσώθη
  choice: لما خَلَصَ
  rationale: تفيد صيغة «لما» النتيجة الممتنعة في الشرط المخالف للواقع، ويحافظ «خَلَصَ» على سعة معنى σῴζω من غير حصره صراحة في النجاة الجسدية أو الخلاص الروحي.
- source_word: πᾶσα σάρξ
  choice: أيُّ جسد
  rationale: ينقل حرفيًا الصورة الكتابية «كل جسد» داخل تركيب النفي العربي «أي جسد»، مع بيان المقصود الاصطلاحي في الحاشية.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: من أجل المختارين
  rationale: ينقل معنى السبب أو المراعاة الذي تؤديه διά مع النصب، من غير تحديد عقائدي زائد.
- source_word: ἐκλεκτούς
  choice: المختارين
  rationale: تعبير عربي كتابي مفهوم يحفظ دلالة الاختيار، ولا يفرض تصورًا مذهبيًا عن طبيعته.
- source_word: οὓς ἐξελέξατο
  choice: الذين اختارهم
  rationale: ترجمة شفافة للصلة، وتحفظ التكرار الاشتقاقي بين «المختارين» و«اختارهم» الموجود في الأصل.
theological_decisions:
- issue: دلالة «خَلَصَ» في السياق
  choice: الإبقاء على لفظ واسع الدلالة، مع كون حفظ الحياة البشرية هو المعنى المباشر في السياق.
  alternative: «نجا» أو «بقي حيًّا»، بما يحصر المعنى في النجاة الجسدية.
  rationale: يتحدث السياق عن تقصير أيام الضيق لئلا يهلك البشر، لكن فعل σῴζω أوسع من مجرد البقاء حيًّا؛ لذلك يحفظ «خَلَصَ» اللفظ من غير تحويل الآية إلى تقرير صريح عن الخلاص الأبدي.
- issue: هوية «المختارين» وطبيعة الاختيار
  choice: إبقاء تسمية «المختارين» كما هي، من غير شرح مذهبي.
  alternative: تحديد الاختيار بأنه جماعي فقط أو فردي قدري على نحو صريح.
  rationale: الآية تصف جماعة اختارها الله، لكنها لا تحسم هنا الخلافات الأوسع في طبيعة الاختيار، ولذلك ينبغي حفظ هذا التوتر.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «أي جسد» للحفاظ على الصورة الأصلية، مع حاشية تشرح معناها الاصطلاحي، وحُفظ التكرار بين «المختارين» و«اختارهم» لأنه مقصود في اليونانية.
