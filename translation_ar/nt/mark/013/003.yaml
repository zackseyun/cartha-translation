  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: ar
  text: 'وبينما كان جالسًا على جبل الزيتون قبالة الهيكل[a]، كان بطرس ويعقوب ويوحنا وأندراوس يسألونه على انفراد:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير الكلمة اليونانية ἱερόν إلى مجمّع الهيكل وساحاته، لا إلى المقدس الداخلي وحده، الذي يُعبَّر عنه بكلمة ναός.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: بينما كان جالسًا
  rationale: تركيب المضاف المطلق مع اسم الفاعل في الزمن الحاضر يرسم ظرفًا مستمرًا يواكب الفعل الرئيس، وصيغة «بينما كان جالسًا» تنقل ذلك بوضوح وطبيعية.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: على جبل الزيتون
  rationale: مع فعل الجلوس تفيد εἰς الموقع هنا، و«جبل الزيتون» هو الاسم الجغرافي العربي المألوف.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: قبالة الهيكل
  rationale: تفيد κατέναντι المقابلة المكانية أو المواجهة. و«قبالة» موجزة وطبيعية، أما ἱερόν فيشير إلى مجمّع الهيكل وساحاته، لا إلى المقدس الداخلي وحده.
- source_word: ἐπηρώτα
  choice: كان ... يسألونه
  rationale: الفعل في صيغة الماضي الناقص، وهي تصوّر السؤال بوصفه جاريًا أو متكررًا في ذلك المشهد؛ لذلك حُفظ الجانب الاستمراري بصيغة «كانوا يسألونه»، مع توزيع عناصر الجملة عربيًا.
- source_word: κατ’ ἰδίαν
  choice: على انفراد
  rationale: تنقل العبارة معنى السؤال بعيدًا عن الآخرين أو في خصوصية، وهي فصيحة ومألوفة في العربية المعاصرة.
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: بطرس ويعقوب ويوحنا وأندراوس
  rationale: استُخدمت الصيغ العربية الراسخة للأسماء، مع إبقاء تتابع العطف الذي يعكس الأسلوب اليوناني دون تكلّف.
