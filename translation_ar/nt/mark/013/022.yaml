revisions:
- from: لِأَنَّهُ سَيَقُومُ مُسَحَاءُ كَذَبَةٌ وَأَنْبِيَاءُ كَذَبَةٌ، وَيُقَدِّمُونَ آيَاتٍ وَعَجَائِبَ لِكَيْ يُضِلُّوا، إِنْ أَمْكَنَ، الْمُخْتَارِينَ.[a]
  to: لِأَنَّ مَسَحَاءَ كَذَبَةً وَأَنْبِيَاءَ كَذَبَةً سَيَظْهَرُونَ، وَيَصْنَعُونَ آيَاتٍ وَعَجَائِبَ لِيُضِلُّوا الْمُخْتَارِينَ، إِنْ أَمْكَنَ.[a]
  rationale: 'التعديل أسلوبي ودلالي محدود: استُبدل «سيقوم» بـ«سيظهرون» لتمثيل معنى الظهور الناشئ في السياق، واستُبدل «يقدّمون» بـ«يصنعون» لاستعمال عربي طبيعي مع «آيات وعجائب»، وأعيد ترتيب الشرط والمفعول به لسلامة العربية. ولا يحسم النص المعدّل إمكان إضلال المختارين أو استحالته.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:21:52Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى الأساسي منقول بأمانة، بما فيه ظهور المسحاء الكذبة والأنبياء الكذبة، وإتيانهم بالآيات والعجائب بقصد إضلال المختارين. لكن «يقدّمون آيات» أقل دقةً وطبيعيةً في هذا السياق من «يصنعون آيات»، كما أن فصل المفعول به بـ«إن أمكن» يثقل العبارة العربية من غير ضرورة.
  naturalness: «سيقوم» ممكنة، لكن «سيظهرون» أصرح وأفصح هنا للدلالة على بروز هؤلاء الأشخاص. والصياغة «ليضلّوا المختارين، إن أمكن» سليمة ومألوفة في العربية الفصحى، وتحافظ على الشرط الموجز دون تقرير نتيجته اللاهوتية.
  terminology: «مسحاء كذبة»، و«أنبياء كذبة»، و«آيات وعجائب»، و«المختارين» مصطلحات سليمة ومفهومة وتحافظ على الدلالة الكتابية. يُستحسن «يصنعون» للأفعال المتصلة بالآيات والعجائب، وهو استعمال عربي كتابي طبيعي لا يضيف حكماً على طبيعة هذه الظواهر.
