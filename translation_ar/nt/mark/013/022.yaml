reference: Mark 13:22
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: ar
  text: لِأَنَّ مَسَحَاءَ كَذَبَةً وَأَنْبِيَاءَ كَذَبَةً سَيَظْهَرُونَ، وَيَصْنَعُونَ آيَاتٍ وَعَجَائِبَ لِيُضِلُّوا الْمُخْتَارِينَ، إِنْ أَمْكَنَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليضلّوا، إن أمكن، المختارين». والعبارة اليونانية لا تحسم صراحةً هل يمكن إضلال المختارين بالفعل؛ بل تبيّن غاية المضلّين في صيغة شرطية.'
    reason: حفظ الغموض النحوي واللاهوتي في εἰ δυνατόν، مع بيان ترتيب بديل أقرب إلى ترتيب اليونانية.
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: سيقوم
  rationale: الفعل هنا يدل اصطلاحًا على ظهور أشخاص وبروزهم، و«سيقوم» طبيعي في سياق التحذير النبوي ولا يوحي صراحة بأن جهة ما أقامتهم.
- source_word: γὰρ
  choice: لأنه
  rationale: تفيد الأداة تعليل التحذير السابق وشرحه، فحُفظت صلتها بما قبلها.
- source_word: ψευδόχριστοι
  choice: مسحاء كذبة
  rationale: المركب اليوناني يدل على مدّعي الصفة المسيانية زورًا. و«مسحاء كذبة» يحفظ صلة اللفظ بلقب «المسيح» ويعبّر عن الجمع بوضوح.
- source_word: ψευδοπροφῆται
  choice: أنبياء كذبة
  rationale: ترجمة مباشرة واضحة للمركب، ومتداولة في العربية الكتابية المعاصرة.
- source_word: δώσουσιν
  choice: يقدّمون
  rationale: الأصل حرفيًا «يعطون»، لكن «يقدّمون آيات وعجائب» أوضح وأطبع في العربية من «يعطون آيات»، مع إبقاء الفاعلية دون إضافة أن هذه الظواهر معجزات حقيقية.
- source_word: σημεῖα καὶ τέρατα
  choice: آيات وعجائب
  rationale: يحفظ التعبير الثنائي المألوف في النصوص الكتابية من غير إضافة وصف تفسيري مثل «خارقة».
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: لكي يضلّوا
  rationale: البناء يفيد الغرض، والفعل يعني حمل الآخرين على الضلال أو إبعادهم عن الحق.
- source_word: εἰ δυνατόν
  choice: إن أمكن
  rationale: ترجمة موجزة مباشرة تحفظ الشرط ولا تحسم بذاتها هل إضلال المختارين ممكن في النهاية أم غير ممكن.
- source_word: τοὺς ἐκλεκτούς
  choice: المختارين
  rationale: يحفظ معنى الذين وقع عليهم الاختيار من غير استيراد تفسير مذهبي لهوية الجماعة أو طبيعة الاختيار.
theological_decisions:
- issue: دلالة ψευδόχριστοι وعلاقتها بلقب Χριστός
  choice: مسحاء كذبة
  alternative: مسيحون كذبة / مدّعو المسيحانية
  rationale: اختيرت صيغة تحافظ على البنية اللقبية والمعنى المسياني مع عربية موجزة؛ أما «مدّعو المسيحانية» فتفسيرية أكثر، و«مسيحون» أقل سلاسة في الاستعمال العربي.
- issue: هل εἰ δυνατόν ينفي إمكان إضلال المختارين؟
  choice: إن أمكن
  alternative: لو كان ذلك ممكنًا
  rationale: النص اليوناني يورد شرطًا مقتضبًا ولا يصرّح هنا باستحالة وقوع الإضلال؛ لذلك تُرك التوتر اللاهوتي قائمًا بدل حسمه.
- issue: موضع العبارة الشرطية بالنسبة إلى المفعول به
  choice: لكي يضلّوا، إن أمكن، المختارين
  alternative: لكي يضلّوا المختارين، إن أمكن
  rationale: يحاكي الموضع اليوناني، حيث تقع عبارة «إن أمكن» قبل «المختارين»، ويحفظ احتمال تعلقها بمحاولة إضلالهم من غير إعادة تفسير.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة تحذيرية كريمة. استُعملت ألفاظ كتابية مفهومة مثل «آيات وعجائب» و«المختارين»، مع تجنب الصياغة الطائفية أو الحسم التفسيري. تظهر علامة الحاشية [a] في المتن.
