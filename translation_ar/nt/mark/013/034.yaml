  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: ar
  text: إنه كرجلٍ مسافرٍ ترك بيته، وأعطى عبيده[a] السلطة، ولكل واحدٍ عمله، وأمر البوّاب أن يظل ساهرًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خدمه»؛ واللفظ اليوناني يعني عبيد البيت الخاضعين لسلطة سيدهم.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: الأمر كحال
  rationale: تُظهر العبارة أن الكلام تشبيه تمثيلي مرتبط بما قبله، بصياغة عربية طبيعية من غير زيادة في المعنى.
- source_word: ἄνθρωπος ἀπόδημος
  choice: رجل مسافر
  rationale: ἄνθρωπος يشير هنا إلى رجل بعينه في المثل، وἀπόδημος يدل على كونه بعيدًا عن موطنه أو بيته في سفر.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: ترك بيته
  rationale: يحافظ على معنى الفعل ولفظ οἰκία المباشر، مع وصل اسم الفاعل اليوناني بالفعل السابق على نحو عربي سلس.
- source_word: δοὺς
  choice: أعطى
  rationale: ينقل المعنى الأساسي للفعل δίδωμι دون توسيعه إلى «ائتمن» أو غيره.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: عبيده
  rationale: ينقل وضع الدوῦλοι الخاضعين لسلطة رب البيت، مع إثبات البديل «خدمه» في الحاشية لبيان المجال الدلالي.
- source_word: τὴν ἐξουσίαν
  choice: السلطة
  rationale: تعبّر عن السلطة أو الحق المفوّض في التصرف، وهو لب معنى ἐξουσία في السياق.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: ولكل واحد عمله
  rationale: تحافظ على إيجاز التركيب اليوناني وتوزيع العمل على الأفراد، دون إضافة فعل مثل «عيّن» غير مذكور صراحة.
- source_word: τῷ θυρωρῷ
  choice: البوّاب
  rationale: لفظ عربي واضح لمن يتولى مراقبة الباب.
- source_word: ἐνετείλατο
  choice: أمر
  rationale: يحفظ القوة السلطوية للفعل، ولا يخففها إلى مجرد نصيحة أو إرشاد.
- source_word: ἵνα γρηγορῇ
  choice: أن يظل ساهرًا
  rationale: يحفظ صورة اليقظة الحرفية المستمرة، وما تتضمنه في السياق من التأهب والمراقبة.
theological_decisions:
- issue: نقل لفظ δοῦλος في سياق بيت يملكه سيد
  choice: عبيده
  alternative: خدمه
  rationale: «عبيده» أدق في إظهار علاقة الخضوع والملكية التي تحملها صورة المثل في عالمها الاجتماعي، بينما تُذكر «خدمه» بديلًا ممكنًا دون طمس دلالة الأصل أو فرض قراءة مذهبية.
translation_notes:
  register: صياغة فصحى معاصرة، واضحة ومهيبة. أُبقي إيجاز «ولكل واحد عمله» ليعكس تركيب الأصل، واستُعمل «يظل ساهرًا» للمحافظة على صورة اليقظة المتكررة في هذا الخطاب.
