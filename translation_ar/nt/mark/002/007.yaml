  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: ar
  text: لماذا يتكلم هذا الرجل هكذا؟[a] إنه يجدّف! من يقدر أن يغفر الخطايا إلا الله وحده؟[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا، مع محاكاة ترتيب الكلمات اليوناني: «ما هذا الذي يتكلم به هكذا؟» والمعنى في هذا الأسلوب اليوناني: «لماذا يتكلم هذا الرجل هكذا؟»'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إلا الإله الواحد».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: لماذا
  rationale: تأتي أداة الاستفهام هنا في تركيب اصطلاحي يسأل عن سبب هذا الكلام أو مسوّغه، لا عن محتواه؛ لذلك «لماذا» أوضح في العربية من الترجمة الحرفية بـ«ماذا».
- source_word: οὗτος
  choice: هذا الرجل
  rationale: اسم الإشارة يدل على يسوع بنبرة تنطوي على المباعدة. وعبارة «هذا الرجل» طبيعية وواضحة في العربية، وتحفظ المباعدة من غير إضافة ازدراء أشد مما يقتضيه اليوناني.
- source_word: οὕτως λαλεῖ
  choice: يتكلم ... هكذا
  rationale: ينقل هذا التعبير بصورة طبيعية اعتراض الكتبة على كلام يسوع بهذه الكيفية، مع إبقاء فعل الكلام محايدًا.
- source_word: βλασφημεῖ
  choice: إنه يجدّف
  rationale: الفعل المضارع يعبّر عن اتهام مباشر ناشئ من كلام يسوع في اللحظة نفسها، و«يجدّف» هو المقابل العربي المألوف الذي يحفظ ثقل الاتهام الديني.
- source_word: τίς δύναται
  choice: من يقدر
  rationale: صياغة عربية موجزة وطبيعية لسؤال عن القدرة أو السلطان.
- source_word: ἀφιέναι ἁμαρτίας
  choice: أن يغفر الخطايا
  rationale: الفعل ἀφίημι مع «الخطايا» يعني في هذا السياق المغفرة، لا مجرد الإطلاق أو الترك.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: إلا الله وحده
  rationale: يعبر التركيب عن الاستثناء والحصر. وهذه الصياغة عربية طبيعية وتحفظ قصر القدرة على الله، مع التنبيه في الحاشية إلى إمكان إبراز «الواحد» وصفًا لله.
theological_decisions:
- issue: هل يُنقل οὗτος بلفظ يزيد نبرة الاحتقار؟
  choice: هذا الرجل
  alternative: هذا / هذا الشخص
  rationale: السياق عدائي، لكن اللفظ اليوناني لا يقتضي إدخال شتيمة صريحة. تحافظ الصياغة المختارة على المباعدة من غير تضخيم الازدراء.
- issue: قوة الاتهام في βλασφημεῖ
  choice: إنه يجدّف!
  alternative: هذا تجديف! / إنه مجدّف!
  rationale: ينسب النص إلى الكتبة حكمًا مباشرًا على كلام يسوع. وتحفظ الترجمة اتهامهم كما هو من غير أن تحسم في العبارة نفسها التوتر المسيحاني الذي يكشفه سياق الرواية.
- issue: دلالة εἷς ὁ θεός
  choice: الله وحده
  alternative: الإله الواحد
  rationale: القراءة المختارة تبرز الحصر الذي يقتضيه السؤال البلاغي، بينما تُذكر في الحاشية الصياغة التي تبرز وصف الله بأنه الواحد، حفاظًا على الاحتمال التركيبي من غير فرض تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع استفهام طبيعي واتهام مباشر. استُخدمت «هذا الرجل» لتوضيح المرجع مع إبقاء نبرة المباعدة، و«الله وحده» لصياغة الحصر بأسلوب عربي مألوف.
