source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: ar
  text: وحدث أنه كان متكئًا لتناول الطعام في بيته[a]، وكان كثيرون من جباة الضرائب والخطاة متكئين مع يسوع وتلاميذه، لأنهم كانوا كثيرين وكانوا يتبعونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في بيت لاوي»؛ ويفهم بعضهم أنها «في بيت يسوع». لا يقول اليوناني إلا: «في بيته».'
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεται
  choice: وحدث
  rationale: مضارع تاريخي شائع في سرد مرقس؛ صيغ بالماضي العربي الطبيعي مع إبقاء حركة الانتقال السردي.
- source_word: κατακεῖσθαι
  choice: كان متكئًا للطعام
  rationale: يدل في السياق على هيئة الاتكاء المعتادة عند تناول الطعام، لا على مجرد الاضطجاع؛ وإضافة «للطعام» توضح مشهد المائدة.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: في بيته
  rationale: ترجمة مباشرة تحفظ ضمير الملكية وغموض مرجعه في اليونانية.
- source_word: τελῶναι
  choice: جباة الضرائب
  rationale: تعبير عربي معاصر واضح لوكلاء جباية الإيرادات.
- source_word: ἁμαρτωλοὶ
  choice: الخطاة
  rationale: المقابل المباشر والمألوف، ويحفظ وصف النص من غير توسيع تفسيري.
- source_word: συνανέκειντο
  choice: متكئين مع
  rationale: يحفظ صورة هيئة الطعام ومعنى المشاركة المصاحب للفعل المركب.
- source_word: μαθηταῖς
  choice: تلاميذه
  rationale: المقابل العربي المعياري الذي يجمع معنى التعلم والعلاقة بالمعلم.
- source_word: ἦσαν γὰρ πολλοὶ
  choice: لأنهم كانوا كثيرين
  rationale: يحفظ وظيفة γάρ التعليلية، ويربط الضمير طبيعيًا بجباة الضرائب والخطاة المذكورين.
- source_word: ἠκολούθουν αὐτῷ
  choice: كانوا يتبعونه
  rationale: صيغة «كانوا + مضارع» تنقل دلالة الماضي الناقص على الاستمرار أو الاعتياد.
theological_decisions:
- issue: مرجع ضمير الملكية في «بيته» (αὐτοῦ)
  choice: إبقاء «بيته» بلا تعيين لصاحب البيت في المتن.
  alternative: بيت لاوي؛ أو بيت يسوع.
  rationale: الضمير اليوناني محتمل المرجع في السياق القريب. تعيين لاوي أو يسوع يحسم ما تركه النص غامضًا، لذلك حُفظ الغموض مع بيان الاحتمالين في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة الأسلوب. استُعمل «متكئًا للطعام» لتجنب توهم مجرد الاستلقاء، وحُفظ تكرار معنى الكثرة وبنية التعليل في النص اليوناني، كما حُفظ غموض ضمير «بيته».
