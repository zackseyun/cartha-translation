  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: ar
  text: 'فقال لهم: «أما قرأتم قط ما فعله داود حين كان في حاجة وجاع، هو والذين معه؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: أما قرأتم قط
  rationale: صياغة عربية طبيعية لسؤال إنكاري يفيد أن المخاطَبين كان ينبغي أن يكونوا قد قرأوا الرواية.
- source_word: χρείαν ἔσχεν
  choice: كان في حاجة
  rationale: يحفظ المعنى العام للمصدر اليوناني دون تقييده تعسفًا بنوع بعينه من الحاجة.
- source_word: ἐπείνασεν
  choice: جاع
  rationale: فعل عربي واضح ومباشر يقابل الفعل اليوناني ويحافظ على كونه خبرًا مستقلًا عن وقوع داود في الحاجة.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ
  choice: هو والذين معه
  rationale: يحافظ على التوكيد الصريح بأن الجوع شمل داود ومرافقيه.
