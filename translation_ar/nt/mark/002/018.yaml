id: MRK.2.18
reference: Mark 2:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: ar
  text: 'وكان تلاميذ يوحنا والفريسيون صائمين. فيأتون ويقولون له[a]: «لماذا يصوم تلاميذ يوحنا وتلاميذ الفريسيين، وأما تلاميذك فلا يصومون؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فيأتي أناس ويقولون له». لا يصرّح النص اليوناني بفاعل «يأتون» و«يقولون».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: كانوا ... صائمين
  rationale: ينقل التركيب المحيطي، المكوَّن من فعل الكينونة في الماضي واسم الفاعل الحاضر، فعلًا مستمرًا في الزمن الماضي بصياغة عربية طبيعية.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: تلاميذ يوحنا
  rationale: إضافة عربية طبيعية تحافظ على علاقة التلاميذ بيوحنا.
- source_word: οἱ Φαρισαῖοι
  choice: الفريسيون
  rationale: الصيغة العربية الاصطلاحية المعروفة لاسم هذه الجماعة اليهودية.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: فيأتون ويقولون
  rationale: يحافظ المضارعان على أسلوب مرقس السردي الحي، وتصل الفاء الجملة بما قبلها على نحو طبيعي من غير إدخال ظرف زمني غير موجود.
- source_word: Διὰ τί
  choice: لماذا
  rationale: استفهام عربي واضح وطبيعي يؤدي معنى السؤال عن السبب.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: تلاميذ الفريسيين
  rationale: إضافة واضحة تعكس علاقة التلاميذ بالفريسيين من غير زيادة تفسيرية.
- source_word: νηστεύουσιν
  choice: يصوم
  rationale: المضارع العربي يلائم الممارسة المعتادة ويصون المقابلة مع «لا يصومون».
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: وأما تلاميذك
  rationale: «أما» تُبرز المقابلة التي تفيدها δέ، وضمير الإضافة ينقل القوة الملكية في σοὶ بصورة عربية سليمة.
theological_decisions:
- issue: هوية فاعل «فيأتون ويقولون له»
  choice: الإبقاء على الفاعل مستترًا في صيغة الجمع دون تعيين مرجعه
  alternative: 'أن يُقال: «فجاء أناس وقالوا له»، أو أن تُنسب المقولة إلى جماعة محددة من السياق'
  rationale: النص اليوناني لا يصرّح بفاعل الفعلين، وتعيين جماعة بعينها يضيف تحديدًا لا يقدمه النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على المضارع التاريخي لإبراز حيوية سرد مرقس، وعلى غموض هوية المتكلمين. وُضع مؤشر الحاشية [a] في المتن كما يلزم.
