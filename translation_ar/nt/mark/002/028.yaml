  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: ar
  text: إذًا، ابن الإنسان هو ربّ السبت أيضًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إذًا، ابن الإنسان هو ربّ حتى السبت». يمكن أن تُترجم καὶ اليونانية «أيضًا» أو «حتى»؛ وقد تحمل هنا معنى تصاعديًا يبرز مدى سلطانه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: إذًا
  rationale: تُدخل نتيجة مستخلصة من حجة الآيتين السابقتين، وتؤدي المعنى الاستنتاجي بلغة عربية طبيعية واضحة.
- source_word: κύριος
  choice: ربّ
  rationale: تنقل معنى السيادة والسلطان في الخبر κύριος، وتحافظ على القوة المسيحانية للقول دون تخفيفه إلى مجرد امتلاك صلاحية محدودة.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: تحافظ على اللقب الإنجيلي الراسخ وعلى أصدائه وتوتره اللاهوتي، بدل حسمه بتعبير تفسيري عام.
- source_word: καὶ
  choice: حتى
  rationale: تؤدي هنا المعنى التصاعدي المحتمل، فتبرز امتداد سيادة ابن الإنسان إلى السبت نفسه؛ وتُذكر قراءة «أيضًا» في الحاشية حفاظًا على الاحتمال المعجمي.
- source_word: σαββάτου
  choice: السبت
  rationale: هو المقابل العربي الطبيعي للاسم المفرد في صيغة المضاف إليه، ويلائم سياق الجدل حول حفظ السبت.
theological_decisions:
- issue: القوة المسيحانية لإعلان سلطان ابن الإنسان على السبت
  choice: صياغة القول بوصفه إعلانًا مباشرًا أن ابن الإنسان ربّ على السبت.
  alternative: «لابن الإنسان سلطان في ما يخص السبت»
  rationale: يفيد κύριος السيادة لا مجرد الإذن أو الصلاحية المحدودة، ولذلك تُحفظ قوة الإعلان من غير إضافة شرح عقائدي إلى النص.
- issue: مرجع لقب «ابن الإنسان»
  choice: الإبقاء على «ابن الإنسان» بوصفه لقبًا يستعمله يسوع، دون تفسيره داخل الترجمة.
  alternative: «الإنسان» أو «البشري» بمعنى عام أو تمثيلي
  rationale: يعمل التعبير في مرقس لقبًا ذا دلالة ذاتية وأصداء محتملة من دانيال، ومنهج الترجمة يقتضي حفظ هذا التوتر بدل حسمه.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. اختير التركيب «ربّ على السبت» لإظهار علاقة السلطان التي يفيدها المضاف إليه اليوناني بصورة طبيعية، مع إبقاء الجملة موجزة وقوية.
