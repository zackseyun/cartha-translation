  text: καὶ μὴ δυνάμενοι ⸀προσενέγκαι αὐτῷ διὰ τὸν ὄχλον ἀπεστέγασαν τὴν στέγην ὅπου ἦν, καὶ ἐξορύξαντες χαλῶσι τὸν κράβαττον ⸀ὅπου ὁ παραλυτικὸς κατέκειτο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: ar
  text: ولمّا عجزوا عن إيصاله إليه بسبب الجمع، كشفوا السقف فوق الموضع الذي كان فيه، ثم نقبوه ودلّوا الفراش الذي كان المشلول مضطجعًا عليه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: ولمّا عجزوا
  rationale: ينقل التركيب الحالي بوصفه ظرفًا سببيًا مهّد للفعل التالي، بصياغة عربية طبيعية موجزة.
- source_word: προσενέγκαι αὐτῷ
  choice: عن إيصاله إليه
  rationale: 'يحفظ الضميرين في اليونانية: الأول يعود إلى المشلول، والثاني إلى يسوع، مع بقاء مرجعهما مفهومًا من السياق السابق.'
- source_word: διὰ τὸν ὄχλον
  choice: بسبب الجمع
  rationale: ينقل دلالة السببية في διά مع النصب، و«الجمع» لفظ عربي واضح ومألوف في السياق السردي الكتابي.
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: كشفوا السقف
  rationale: يفيد الفعل النادر إزالة غطاء السقف أو فتحه؛ و«كشفوا السقف» يحافظ على الصورة دون الإيحاء بالضرورة بإزالة السقف كله.
- source_word: ὅπου ἦν
  choice: فوق المكان الذي كان فيه
  rationale: أُظهر الارتباط المكاني الرأسي الذي يقتضيه سياق السقف، مع إبقاء مرجع الضمير كما في الأصل.
- source_word: ἐξορύξαντες
  choice: ثم نقبوه
  rationale: ينقل فعل الحفر أو إحداث فتحة في السقف من غير تحديد مادته.
- source_word: χαλῶσι
  choice: ودلّوا
  rationale: «دلّى» هو المقابل العربي الطبيعي لإنزال شيء من موضع أعلى، ويؤدي معنى الحاضر التاريخي ضمن سرد عربي بالماضي دون تكلّف.
- source_word: κράβαττον
  choice: الفراش
  rationale: يشير إلى فراش بسيط أو حصير يُحمل، لا إلى سرير ثابت؛ و«الفراش» طبيعي وواضح في العربية.
- source_word: ὅπου ὁ παραλυτικὸς κατέκειτο
  choice: الذي كان المشلول مضطجعًا عليه
  rationale: يربط جملة الصلة بالفراش كما يقتضي السياق، ويترجم الصفة المستعملة اسميًا بعبارة عربية طبيعية.
theological_decisions: []
