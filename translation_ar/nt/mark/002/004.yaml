  source_fidelity: 'النص يفي عمومًا بالمعنى اليوناني: العجز بسبب الجمع، وكشف السقف ثم نقبه، وإنزال الفراش الذي كان عليه المشلول. وصياغة «فوق الموضع الذي كان فيه» توضّح العلاقة التي يقتضيها سياق السقف من غير إضافة جوهرية. لكن الحاشية تقترح غموضًا نحويًا غير لازم ولا تعكس بأمانة وظيفة جملة «ὅπου ὁ παραλυτικὸς κατέκειτο» في هذا السياق، التي تصف الفراش الذي كان المشلول مضطجعًا عليه.'
