  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. حُفظ تكرار الضميرين في «إيصاله إليه» لأنه موجود في الأصل، واستُعمل «نقبوه» من غير افتراض مادة السقف أو كيفية بنائه.
