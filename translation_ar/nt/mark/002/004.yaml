  to: ولمّا عجزوا عن إيصاله إليه بسبب الجمع، كشفوا السقف فوق الموضع الذي كان فيه، ثم نقبوه ودلّوا الفراش الذي كان المشلول مضطجعًا عليه.
  rationale: حُذفَت الحاشية لأنها تقدّم غموضًا غير مبرر في جملة الصلة، مع الإبقاء على المعنى والبنية السردية للنص. وعُدّل «المكان» إلى «الموضع» تعديلًا أسلوبيًا طفيفًا فقط.
