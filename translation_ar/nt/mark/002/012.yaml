  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: ar
  text: 'فقام، وحمل الفراش في الحال، وخرج أمام الجميع، حتى ذُهلوا كلهم ومجّدوا الله قائلين: «لم نرَ مثل هذا قط».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «هكذا لم نرَ قط»، أي إنهم لم يشاهدوا من قبل شيئًا كهذا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: فقام
  rationale: يفيد السياق قيام الرجل المشلول استجابةً لأمر يسوع؛ وصيغة «قام» عربية طبيعية وتحافظ على معنى النهوض من غير إقحام إيحاء بالقيامة ليس هو المقصود المباشر هنا.
- source_word: εὐθύς
  choice: في الحال
  rationale: تنقل فورية الحدث وإيقاع مرقس السريع بلغة عربية واضحة وطبيعية.
- source_word: ἄρας
  choice: وحمل
  rationale: الفعل يدل على رفع الفراش وأخذه؛ و«حمل» تلائم السياق وتوجز تتابع الأفعال.
- source_word: κράβαττον
  choice: الفراش
  rationale: يشير إلى فراش بسيط أو حصير للنوم؛ و«الفراش» لفظ عربي مألوف لا يوحي بسرير كامل ولا يضيف معنى النقالة.
- source_word: ἔμπροσθεν πάντων
  choice: أمام الجميع
  rationale: يحفظ علنية الحدث ووقوعه على مرأى من الحاضرين بصياغة عربية مباشرة.
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: حتى ذُهلوا كلهم
  rationale: ἐξίστασθαι يدل على دهشة شديدة؛ و«ذُهلوا» أقوى من مجرد التعجب وتناسب وقع المعجزة.
- source_word: δοξάζειν τὸν θεόν
  choice: ومجّدوا الله
  rationale: يحافظ على الدلالة المباشرة للفعل δοξάζω وعلى الأسلوب الكتابي المألوف.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: لم نرَ مثل هذا قط
  rationale: صياغة عربية طبيعية تنقل العبارة اليونانية الموجزة ومعناها، وهو أن ما شاهدوه غير مسبوق عندهم.
theological_decisions:
- issue: احتمال الإيحاء بالقيامة في ἠγέρθη
  choice: فقام
  alternative: فأُقيم / فنهض
  rationale: السياق المباشر هو نهوض المشلول الذي شُفي وامتثاله للأمر؛ لذلك لا تُبرز الترجمة معنى الإقامة من الموت، مع إبقاء معنى القيام الجسدي واضحًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت أفعال موجزة متتابعة للحفاظ على سرعة السرد المرقسي، مع تجنب الألفاظ القديمة أو التفسير اللاهوتي الزائد.
