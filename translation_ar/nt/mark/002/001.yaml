  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: ar
  text: ولما دخل كفرناحوم مرة أخرى بعد أيام، سُمع أنه في البيت.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في منزل»؛ ويمكن أن يفيد التعبير أيضًا: «في منزله».'
    reason: بيان المجال الدلالي لعبارة ἐν οἴκῳ مع إبقاء هوية البيت غير محسومة.
lexical_decisions:
- source_word: εἰσελθὼν
  choice: دخل
  rationale: صيغ اسم الفاعل الأوريستي فعلًا ماضيًا مرتبطًا بالفعل الرئيس، بما يلائم السرد العربي ويحافظ على تعاقب الحدثين.
- source_word: πάλιν
  choice: مرة أخرى
  rationale: ينقل معنى التكرار أو العودة بعبارة عربية واضحة وطبيعية.
- source_word: Καφαρναούμ
  choice: كفرناحوم
  rationale: النقل العربي الشائع لاسم الموضع.
- source_word: δι’ ἡμερῶν
  choice: وبعد أيام
  rationale: تعبير زمني غير محدد يقابل حرفيًا معنى مرور أيام، من غير افتراض أنها قليلة.
- source_word: ἠκούσθη
  choice: فسُمع
  rationale: يحافظ على المبني للمجهول وصيغة شيوع الخبر في النص اليوناني.
- source_word: ἐν οἴκῳ
  choice: في البيت
  rationale: اختيار قريب من ظاهر اليونانية ويحفظ عدم التحديد بين معنى وجوده في بيت ومعنى وجوده في منزله.
- source_word: ἐστίν
  choice: أنه في البيت
  rationale: حُفظ معنى المضارع في الخبر غير المباشر بصياغة اسمية عربية لا تفرض الإحالة الزمنية إلى الماضي.
theological_decisions:
- issue: هل تعني ἐν οἴκῳ «في البيت» أم «في منزله»؟
  choice: في البيت
  alternative: في منزله
  rationale: لا يحدد الأصل أن البيت مملوك ليسوع أو أنه منزله الشخصي؛ لذلك تحافظ الصياغة المختارة على الغموض المكاني ولا تستورد افتراضًا تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. قُدّم الظرف الزمني لسلامة الإيقاع، واستُخدم المبني للمجهول حفاظًا على بنية الخبر في الأصل.
