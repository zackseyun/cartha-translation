  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: ar
  text: فاجتمع كثيرون، حتى لم يَعُد هناك موضع، ولا حتى عند الباب، وكان يخاطبهم بالكلمة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «بالرسالة». واليونانية حرفيًا: «بالكلمة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: اجتمع
  rationale: ينقل معنى اجتماع الناس بصياغة عربية طبيعية؛ والمبني للمعلوم هنا يؤدي معنى المبني للمجهول اليوناني من غير تكلّف.
- source_word: πολλοὶ
  choice: كثيرون
  rationale: الصفة مستعملة استعمال الاسم، و«كثيرون» موجزة وتحافظ على عدم تحويلها صراحة إلى «جمع».
- source_word: ὥστε
  choice: حتى
  rationale: تقدّم جملة النتيجة بصورة عربية طبيعية وواضحة.
- source_word: μηκέτι χωρεῖν
  choice: لم يَعُد هناك موضع
  rationale: يعبّر بوضوح عن نفاد المساحة، ويحفظ دلالة μηκέτι على عدم بقاء الحال السابق.
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: ولا حتى عند الباب
  rationale: ينقل التعبير الاصطلاحي عن المساحة المحيطة بالباب من غير حرفية ثقيلة.
- source_word: ἐλάλει
  choice: كان يكلّمهم
  rationale: «كان» مع المضارع يحفظ الجانب الاستمراري للفعل الناقص، و«يكلّم» أقل تفسيرًا من «يعظ».
- source_word: τὸν λόγον
  choice: بالكلمة
  rationale: يحافظ على اللفظ اليوناني وعلى العبارة المعرّفة، من غير إضافة «الله» غير المذكورة؛ وتوضح الحاشية البديل الدلالي الطبيعي.
theological_decisions:
- issue: دلالة τὸν λόγον في كلام يسوع
  choice: بالكلمة
  alternative: بالرسالة
  rationale: يحفظ الاختيار لفظ النص وتوتره الدلالي، ولا يضيف «كلمة الله» مع أنها قد تكون مفهومة من السياق. أما «الرسالة» فتوضح المقصود المحتمل لكنها أكثر تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «اجتمع» بدل صيغة مبنية للمجهول ثقيلة، وحُفظ استمرار ἐλάλει بتركيب «كان يكلّمهم».
