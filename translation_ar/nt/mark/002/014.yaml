source:
  edition: SBLGNT
  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: ar
  text: 'وفيما كان مارًّا، رأى لاوي بن حلفى جالسًا عند مكان جباية الضرائب[a]، ويقول له: «اتبعني». فقام وتبعه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عند موضع تحصيل الرسوم». يمكن أن تدل الكلمة اليونانية على مكان جباية الضرائب أو الرسوم الجمركية ورسوم المرور.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: وفيما كان مارًّا
  rationale: ينقل اسم الفاعل الحاضر ذي الدلالة الاستمرارية بوصفه خلفية زمنية معاصرة لفعل الرؤية، بصياغة عربية طبيعية.
- source_word: εἶδεν
  choice: رأى
  rationale: ترجمة مباشرة لفعل الرؤية من غير إضافة معنى الانتباه أو الملاحظة.
- source_word: Λευὶν
  choice: لاوي
  rationale: نقل للاسم الشخصي بالصيغة العربية الكتابية المألوفة.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: بن حلفى
  rationale: يبين تركيب الإضافة الدال على النسب، مع استعمال الصيغة العربية المألوفة للاسم.
- source_word: καθήμενον
  choice: جالسًا
  rationale: يصف هيئة لاوي حين رآه يسوع بعبارة عربية مباشرة.
- source_word: ἐπὶ τὸ τελώνιον
  choice: عند مكان جباية الضرائب
  rationale: τελώνιον هو موضع تحصيل الضرائب أو الرسوم؛ وهذه الصياغة واضحة ولا تحصر المعنى في نوع واحد من الرسوم.
- source_word: λέγει
  choice: ويقول له
  rationale: يحافظ على المضارع التاريخي في مرقس وعلى حيوية السرد، مع بقاء الأفعال المحيطة في الماضي.
- source_word: Ἀκολούθει μοι
  choice: اتبعني
  rationale: ينقل الأمر مباشرة ويحافظ على الصلة اللفظية بفعل استجابة لاوي، من غير إضافة لفظ غير موجود في اليونانية.
- source_word: ἀναστὰς
  choice: فقام
  rationale: ينقل الفعل السابق للفعل الرئيس بإيجاز، ويحافظ على ترتيب الاستجابة.
- source_word: ἠκολούθησεν αὐτῷ
  choice: وتبعه
  rationale: يحافظ على التكرار المقصود لجذر الاتباع بين الأمر والاستجابة، من غير تحويله إلى شرح تفسيري.
theological_decisions:
- issue: المضارع التاريخي في سرد مرقس
  choice: 'الإبقاء على λέγει في المضارع: «ويقول له»'
  alternative: 'تسوية زمن السرد إلى الماضي: «وقال له»'
  rationale: الإبقاء على المضارع يصون حيوية الأسلوب اليوناني ولا يغير المعنى، وإن كان الانتقال إلى الماضي أكثر شيوعًا في السرد العربي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «مكان جباية الضرائب» بدل تعبير قديم أو تقني، ووُضع مؤشر الحاشية بعد العبارة التي تشرحها مباشرة.
