source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: ar
  text: ولا يضع أحد خمرًا جديدة في قِرَب خمر عتيقة؛ وإلا شقَّت الخمر القِرَب، فتضيع الخمر والقِرَب أيضًا. بل الخمر الجديدة للقِرَب الجديدة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βάλλει
  choice: يضع
  rationale: فعل عام يطابق اليونانية ويؤدي المعنى طبيعيًا في سياق وضع الخمر في القِرَب، من غير تخصيص الفعل بالسكب.
- source_word: οἶνον νέον
  choice: خمرًا جديدة
  rationale: يحافظ على تركيب الاسم والصفة، وتشير «جديدة» هنا إلى خمر حديثة الصنع.
- source_word: ἀσκοὺς
  choice: قِرَب خمر
  rationale: القِرَب أوعية من جلود الحيوانات كانت تُستعمل لحفظ الخمر؛ وإضافة «خمر» في الذكر الأول توضح الصورة للقارئ المعاصر.
- source_word: παλαιούς
  choice: عتيقة
  rationale: تنقل معنى القِدم في وصف القِرَب، وتنسجم طبيعيًا مع هذا الوعاء من غير إضافة تفسير مثل «بالية».
- source_word: ῥήξει
  choice: شقَّت
  rationale: يصف الفعل تمزيق الخمر للقِرَب بفعل ضغط التخمّر، وهو أدق في العربية من إسناد الانفجار إلى الخمر نفسها.
- source_word: ἀπόλλυται
  choice: تضيع
  rationale: يناسب السياق، إذ تفيد الخسارة والهدر، مع إبقاء المجال الدلالي للفعل من غير قصره على فساد الخمر.
- source_word: καινούς
  choice: الجديدة
  rationale: ترجمة مباشرة واضحة لـ καινούς. العربية لا تتيح هنا تمييزًا طبيعيًا ثابتًا بين νέος وκαινός يوازي اليونانية، و«الجديدة» أفصح وأوضح من أوصاف قد تفسر المعنى أكثر مما تترجمه.
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: بل الخمر الجديدة للقِرَب الجديدة
  rationale: يحافظ على إيجاز العبارة اليونانية التي حُذف فعلها، ويعرضها مبدأً عامًا من غير إدخال صيغة أمر أو وجوب.
theological_decisions:
- issue: طبيعة العبارة الختامية المحذوف فعلها
  choice: بل الخمر الجديدة للقِرَب الجديدة
  alternative: بل ينبغي أن توضع الخمر الجديدة في قِرَب جديدة
  rationale: النص اليوناني لا يذكر فعلًا في العبارة الأخيرة؛ لذلك تحافظ الصياغة الاسمية على طابعها المثلي الموجز ولا تضيف معنى الوجوب.
- issue: مدى معنى ἀπόλλυται في وصف الخمر
  choice: تضيع
  alternative: تفسد
  rationale: «تضيع» تحفظ معنى الخسارة أو الهدر الذي يحتمله الفعل، بينما «تفسد» تحسم نوع الضرر على نحو أضيق مما يصرح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعملت «قِرَب خمر» أولًا لشرح الصورة الثقافية، ثم «القِرَب» اختصارًا. حوفظ على الإيجاز والتوازي، وعلى غموض العبارة الختامية بحذف الفعل كما في اليونانية.
