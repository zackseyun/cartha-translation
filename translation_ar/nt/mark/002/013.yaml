    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: الماضي البسيط ينقل صيغة الماضي اليونانية طبيعيًا، من غير إضافة موضع لم يصرّح به النص.
- source_word: πάλιν
  choice: أيضًا
  rationale: تدل على تكرار الفعل، و«أيضًا» سليمة وطبيعية هنا في العربية المعاصرة.
- source_word: παρὰ τὴν θάλασσαν
  choice: إلى جانب البحر
  rationale: تحفظ دلالة الحركة إلى موضع بمحاذاة البحر؛ و«عند البحر» بديل عربي ممكن.
- source_word: πᾶς ὁ ὄχλος
  choice: الجمع كله
  rationale: تنقل شمول الاسم الجمعي بصياغة عربية طبيعية من غير أن تجعل المقصود بالضرورة كل فرد في المنطقة.
- source_word: ἤρχετο
  choice: كان يأتي
  rationale: تركيب «كان» مع المضارع ينقل بصورة طبيعية استمرارية الماضي الناقص اليوناني من غير المبالغة في تفسيره على أنه تكرار دائم.
- source_word: πρὸς αὐτόν
  choice: إليه
  rationale: تعبير موجز وطبيعي عن الحركة نحو شخص.
- source_word: ἐδίδασκεν
  choice: كان يعلّم
  rationale: يحافظ على الجانب الاستمراري للماضي الناقص اليوناني.
- source_word: αὐτούς
  choice: هم
  rationale: الضمير يعود إلى الجمع، وهو المفعول به المتصل الطبيعي في «يعلّمهم».
