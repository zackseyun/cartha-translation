  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: ar
  text: 'وكان يقول لهم: «جُعل السبت لأجل الإنسان[a]، لا الإنسان لأجل السبت».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي البشر عمومًا. تستعمل اليونانية هنا كلمة «الإنسان» بالمفرد استعمالًا تمثيليًا يشمل الناس جميعًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: صيغة الماضي الناقص تدل في السياق السردي على قول مستمر أو متكرر، و«كان يقول» تحافظ على هذا الجانب الزمني بصورة عربية طبيعية.
- source_word: τὸ σάββατον
  choice: السبت
  rationale: اللفظ المعرّف يشير إلى يوم السبت بوصفه نظامًا معروفًا، و«السبت» هو المقابل العربي المألوف من غير حاجة إلى إضافة «يوم».
- source_word: διὰ τὸν ἄνθρωπον
  choice: من أجل الإنسان
  rationale: تفيد διά مع حالة النصب الغاية أو المنفعة. والمفرد ἄνθρωπος هنا تمثيلي يشمل البشر عمومًا، وهو ما يؤديه لفظ «الإنسان» طبيعيًا في العربية.
- source_word: ἐγένετο
  choice: وُجد
  rationale: يعبر الفعل عن الصيرورة إلى الوجود أو النشأة. وتحافظ «وُجد» على معنى نشأة السبت من غير حصر العبارة في فعل صناعة مادي.
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: لا الإنسان من أجل السبت
  rationale: يحافظ هذا التركيب الموجز على المقابلة البلاغية والحذف الموجودين في اليونانية، إذ يُفهم فعل الوجود من الجملة الأولى.
theological_decisions:
- issue: الدلالة العامة للمفرد ἄνθρωπος في تقرير مبدئي
  choice: الإنسان
  alternative: البشر / البشرية
  rationale: تستعمل اليونانية اسمًا مفردًا استعمالًا تمثيليًا للدلالة على البشر جميعًا. و«الإنسان» يحفظ المفرد والمقابلة البلاغية، مع بيان شموله في الحاشية، من غير قصر المعنى على الذكور.
- issue: هل يشير σάββατον إلى اليوم أم إلى نظام السبت
  choice: السبت
  alternative: يوم السبت
  rationale: يبقي اللفظ العربي المعنى مفتوحًا لليوم بوصفه نظامًا، كما في الأصل، ولا يضيف تحديدًا تفسيريًا غير لازم.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات نبرة تعليمية مهيبة. حُفظ التوازي بين «السبت من أجل الإنسان» و«الإنسان من أجل السبت»، كما حُفظ جانب الماضي الناقص في «كان يقول».
