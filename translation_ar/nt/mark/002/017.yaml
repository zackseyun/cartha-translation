source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: ar
  text: 'ولمّا سمع يسوع ذلك، يقول لهم: «لا يحتاج الأقوياء[a] إلى طبيب، بل المرضى. ما جئت لأدعو أبرارًا[b]، بل خطاة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأصحاء»؛ فاللفظ اليوناني يعني حرفيًا الأقوياء أو المتمتعين بالعافية.'
    reason: lexical_alternative
  - marker: b
    text: 'قد تُفهم «أبرارًا» في السياق على سبيل التهكم، أي الذين يُعَدّون أبرارًا أو يرون أنفسهم كذلك؛ أما النص اليوناني فيقول ببساطة: «أبرارًا».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: ولمّا سمع يسوع ذلك
  rationale: صيغ اسم الفاعل الأوريستي صياغة زمنية طبيعية في العربية، وأُضيف «ذلك» لإيضاح المفعول المفهوم من السياق.
- source_word: λέγει
  choice: يقول لهم
  rationale: أُبقي المضارع التاريخي لإبراز حيوية أسلوب مرقس السردي.
- source_word: οἱ ἰσχύοντες
  choice: الأقوياء
  rationale: يحافظ على المعنى الحرفي المتعلق بالقوة والعافية، مع بيان البديل السياقي في الحاشية.
- source_word: χρείαν ἔχουσιν
  choice: لا يحتاج ... إلى
  rationale: تعبير عربي طبيعي ودقيق عن اصطلاح امتلاك الحاجة.
- source_word: ἰατροῦ
  choice: طبيب
  rationale: اللفظ العربي المعياري الواضح في سياق المقابلة الطبية.
- source_word: οἱ κακῶς ἔχοντες
  choice: المرضى
  rationale: هذا التعبير اليوناني الاصطلاحي يدل هنا على من هم في حال مرض.
- source_word: οὐκ ἦλθον καλέσαι
  choice: ما جئت لأدعو
  rationale: صياغة موجزة تحفظ معنى المجيء بغرض الدعوة من غير تخصيص زائد لطبيعة الدعوة.
- source_word: δικαίους
  choice: أبرارًا
  rationale: يحفظ الوصف الأخلاقي والديني كما هو من غير إدخال دلالة التهكم في المتن.
- source_word: ἁμαρτωλούς
  choice: خطاة
  rationale: المقابل العربي المعياري للاسم الوصفي الدال على مرتكبي الخطية.
theological_decisions:
- issue: هل تُفسَّر عبارة «أبرارًا» على أنها تهكم؟
  choice: الإبقاء على «أبرارًا» في المتن
  alternative: الذين يحسبون أنفسهم أبرارًا
  rationale: قد يحمل السياق معنى تهكميًا أو يشير إلى من يرون أنفسهم أبرارًا، لكن اليونانية تقول ببساطة «أبرارًا»، ولذلك حُفظ التوتر التفسيري في حاشية.
- issue: المفعول المحذوف مع «سمع»
  choice: إضافة «ذلك»
  alternative: ولمّا سمع يسوع
  rationale: المسموع مفهوم من السياق، وإظهاره بضمير الإشارة يجعل العربية طبيعية من غير إضافة مضمون عقائدي.
- issue: المضارع التاريخي في λέγει
  choice: يقول لهم
  alternative: قال لهم
  rationale: يحفظ النسيج السردي الحي في نص مرقس، ولا يغيّر مضمون القول.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ المضارع التاريخي «يقول»، واستُخدمت ألفاظ مألوفة مع إبقاء البدائل التفسيرية في الحواشي لا في المتن.
