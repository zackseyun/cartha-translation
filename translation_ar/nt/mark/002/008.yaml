  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: ar
  text: 'وفي الحال أدرك يسوع في روحه[a] أنهم يفكرون هكذا في أنفسهم، فقال لهم: «لماذا تفكرون في هذه الأمور في قلوبكم؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «عرف في روحه» أو «تعرّف في داخله». لا تحدد اليونانية صراحة كيفية إدراك يسوع.'
    reason: بديل معجمي يحفظ غموض طريقة الإدراك في الأصل.
lexical_decisions:
- source_word: εὐθὺς
  choice: للوقت
  rationale: ينقل سرعة الحدث بوصفه علامة سردية متكررة عند مرقس، وهو تعبير عربي فصيح ومفهوم.
- source_word: ἐπιγνοὺς
  choice: أدرك
  rationale: يدل على التبيّن أو المعرفة الواضحة، من غير تحديد كيفية هذا الإدراك.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: في روحه
  rationale: يحافظ على صياغة اليونانية وعلى احتمال دلالة حالة الإدراك أو مجاله، من غير حسم آليته.
- source_word: οὕτως
  choice: هكذا
  rationale: مقابل عربي طبيعي يحفظ الدلالة على كيفية تفكيرهم.
- source_word: διαλογίζονται / διαλογίζεσθε
  choice: يفكرون / تفكرون
  rationale: السياق يتحدث عن تفكير داخلي لا عن نقاش منطوق؛ و«يفكرون» أوضح للقارئ العربي المعاصر.
- source_word: ἐν ἑαυτοῖς
  choice: في أنفسهم
  rationale: يحفظ معنى وقوع التفكير داخل ذواتهم، لا في حوار علني بينهم.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: لماذا تفكرون في هذه الأمور
  rationale: تؤدي «لماذا» وظيفة τί الاستفهامية في هذا السياق بالعربية الطبيعية، وتعبّر «في هذه الأمور» عن ταῦτα بوضوح.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: في قلوبكم
  rationale: يحافظ على الصورة الكتابية للقلب بوصفه موضع الفكر والقصد، بدل اختزالها في الذهن.
theological_decisions:
- issue: طبيعة معرفة يسوع في عبارة «في روحه»
  choice: الإبقاء على «في روحه» مع وصف يسوع بأنه أدرك تفكيرهم الداخلي من غير تحديد كيفية الإدراك.
  alternative: تفسير العبارة صراحة بأنها علم إلهي فائق، أو بأنها مجرد فطنة بشرية حادة.
  rationale: النص يثبت أن يسوع عرف تفكيرهم الباطني، لكنه لا يعرّف صراحة آلية هذه المعرفة؛ لذلك تحافظ الترجمة على قوة العبارة وتوترها اللاهوتي من غير زيادة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «للوقت» لإبراز الإيقاع السردي السريع عند مرقس، مع إبقاء «في روحه» و«في قلوبكم» قريبين من صورة النص الأصلي.
