  source_fidelity: 'النص ينقل عناصر اليونانية الأساسية بأمانة: فورية الحدث، وإدراك يسوع لتفكيرهم الباطني «في روحه»، والسؤال عن تفكيرهم في قلوبهم. غير أن «للوقت» أقل ملاءمة من «وفي الحال» للفصحى الحديثة الواضحة، وموضع علامة الحاشية ينبغي أن يرتبط بعبارة «في روحه» التي تشرحها الحاشية.'
  naturalness: «وفي الحال» تعبير فصيح حديث وطبيعي أكثر من «للوقت». وبقية الصياغة واضحة وتحافظ على الوقار والأسلوب السردي.
  terminology: «أدرك»، و«في روحه»، و«في أنفسهم»، و«في قلوبكم» اختيارات سليمة تحفظ عدم تحديد آلية الإدراك، ولا تفرض تفسيرًا لاهوتيًا زائدًا. تُصاغ بدائل الحاشية بدقة أكبر لتجنب أن يوحي «تبيّن في داخله» بأن الأمر هو الذي تبيّن بذاته لا أن يسوع هو الذي أدرك.
  issues:
