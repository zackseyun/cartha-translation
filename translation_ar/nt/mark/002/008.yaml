  - severity: low
    issue: علامة الحاشية موضوعة بعد الاقتباس كله، مع أن الحاشية تشرح «في روحه».
    rationale: ربط العلامة مباشرة بالعبارة المشروحة أوضح للقارئ وأدق من جهة مرساة الحاشية.
