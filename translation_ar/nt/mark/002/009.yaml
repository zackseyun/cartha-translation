  rationale: يحافظ على صيغة المبني للمجهول وعلى قوة الإعلان، ويعبّر طبيعيًا في العربية عن حالة الغفران دون تعيين فاعله أو توقيته تعيينًا زائدًا.
- source_word: ἁμαρτίαι
  choice: خطاياك
  rationale: المقابل العربي المباشر والمألوف في هذا السياق.
- source_word: Ἔγειρε
  choice: قُم
  rationale: أمر عربي موجز وطبيعي بالنهوض، ملائم لسياق شفاء المشلول.
- source_word: ἆρον
