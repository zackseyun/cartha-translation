  rationale: ينقل معنى رفع الفراش وأخذه، لا مجرد لمسه أو تحريكه.
- source_word: τὸν κράβαττόν σου
  choice: فراشك
  rationale: يدل في السياق على فراش بسيط قابل للحمل، وهو أوسع وأطبع عربيًا من ألفاظ قد توحي بحصير من مادة بعينها أو بسرير ثقيل.
- source_word: περιπάτει
  choice: امشِ
  rationale: ينقل الأمر بالمشي بعبارة عربية مباشرة وطبيعية.
theological_decisions:
- issue: صياغة إعلان غفران الخطايا
  choice: مغفورة لك خطاياك
  alternative: قد غُفرت لك خطاياك
  rationale: تحافظ الصياغة المختارة على الإعلان المبني للمجهول وعلى التوتر السردي المتعلق بسلطان يسوع، من غير أن تحسم زمن الغفران أو كيفية وقوعه بأكثر مما يتيحه النص اليوناني.
