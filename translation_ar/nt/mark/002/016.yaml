  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: ar
  text: 'ولمّا رأى كتبةُ الفريسيين أنه يأكل مع[a] الخطاة وجباة الضرائب، كانوا يقولون لتلاميذه: «لماذا يأكل مع جباة الضرائب والخطاة؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يأكل مع». ويدل التعبير في هذا السياق على مشاركتهم المائدة.'
    reason: بيان الدلالة الاجتماعية الملازمة للتعبير الحرفي من غير توسيع المتن.
lexical_decisions:
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: المقابل العربي المألوف في سياق الأناجيل، ويحافظ على دلالة فئة معروفة من المختصين بالنصوص والشريعة من غير توسيع تفسيري.
- source_word: τῶν Φαρισαίων
  choice: 'الفريسيين (في تركيب: كتبة الفريسيين)'
  rationale: يحافظ على تركيب الإضافة اليوناني الدال على الانتساب أو الارتباط، من غير أن يحسمه بالقول صراحة إنهم كانوا فريسيين أو مجرد مرتبطين بهم.
- source_word: ἰδόντες
  choice: ولمّا رأى
  rationale: صياغة عربية طبيعية تنقل المعنى الظرفي الزمني لاسم الفاعل الماضي وتربط رؤيتهم بما قالوه.
- source_word: ὅτι ἐσθίει
  choice: أنه يأكل
  rationale: ينقل الفعل الجاري في المشهد بوضوح، مع إبقاء الفعل الأساسي «يأكل» بدل تعبير تفسيري مثل «يشارك المائدة».
- source_word: ἁμαρτωλῶν
  choice: الخطاة
  rationale: مقابل مباشر يحفظ قوة الوصف الاجتماعي والديني في الاتهام ولا يلطّفه.
- source_word: τελωνῶν
  choice: جباة الضرائب
  rationale: تعبير عربي واضح ومعاصر للفئة التي كانت تتولى تحصيل الضرائب أو الرسوم، ويحفظ الوصمة الاجتماعية التي يفهمها السياق.
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: يحفظ دلالة صيغة الماضي الناقص على الاستمرار أو التكرار، بدل تسطيحها إلى فعل ماضٍ بسيط.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: لتلاميذه
  rationale: يحافظ على علاقة المعلّم بالتلميذ التي يدل عليها اللفظ، وهو التعبير الكتابي العربي الطبيعي.
- source_word: Ὅτι
  choice: لماذا
  rationale: يؤدي الوظيفة الاستفهامية الاعتراضية في السياق بعربية طبيعية، بدل ترجمة حرفية غير مفهومة.
- source_word: ἐσθίει
  choice: يأكل
  rationale: يحافظ في السؤال على الفعل البسيط وعلى الاعتراض المتعلق بمخالطة هذه الفئات على المائدة.
theological_decisions:
- issue: الدلالة الاجتماعية والدينية لمشاركة المائدة
  choice: إبقاء العبارة المباشرة «يأكل مع الخطاة وجباة الضرائب»
  alternative: «يشارك الخطاة وجباة الضرائب موائدهم» أو «يتناول الطعام معهم»
  rationale: النص اليوناني يستعمل الفعل العادي «يأكل» مع حرف المصاحبة؛ وإبقاؤه يتيح للسياق أن يكشف مغزى الشركة على المائدة من غير إدخال تفسير في المتن.
- issue: صلة الكتبة بالفريسيين
  choice: «كتبة الفريسيين»
  alternative: «الكتبة الذين كانوا فريسيين» أو «الكتبة التابعون للفريسيين»
  rationale: الإضافة اليونانية تحتمل وصف الانتماء أو الارتباط؛ لذا تحفظ الصياغة العربية الموجزة قدرًا من هذا الاتساع ولا تحسم العلاقة أكثر مما يحسمها النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «جباة الضرائب» بدل اللفظ التراثي الأقل وضوحًا «العشارين»، وحُفظ التوازي وترتيب الفئتين المختلف بين السرد والسؤال كما في اليونانية.
