- source_word: καὶ
  choice: وَ
  rationale: حرف عطف يصل الحدث بما قبله ويحافظ على أسلوب مرقس القائم على تتابع الجمل.
- source_word: ἔρχονται
  choice: جاءوا
  rationale: فعل مضارع تاريخي في اليونانية، وصيغة الماضي هي الأنسب للسرد العربي الطبيعي.
- source_word: φέροντες πρὸς αὐτὸν
  choice: إليه برجلٍ
  rationale: صياغة عربية موجزة وطبيعية تؤدي معنى إحضار الشخص إلى يسوع، من غير تكرار ثقيل لفعل الحمل.
- source_word: παραλυτικὸν
  choice: رجلٍ مشلولٍ
  rationale: الصفة مستعملة استعمال الاسم؛ وإضافة «رجل» واضحة وتحفظ إنسانية الشخص بدل اختزاله في حالته.
- source_word: αἰρόμενον
  choice: يحمله
  rationale: يعبّر عن اسم المفعول اليوناني الذي يفيد أن آخرين كانوا يحملونه جسديًا؛ وتحويل المبني للمجهول إلى جملة فعلية موصولة طبيعي في العربية.
- source_word: ὑπὸ τεσσάρων
  choice: أربعة
  rationale: يحافظ على الإيجاز الأصلي؛ فاليونانية لا تصرّح بكلمة «رجال».
