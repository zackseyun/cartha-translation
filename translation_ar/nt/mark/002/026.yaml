source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: ar
  text: كيف دخل بيت الله في أيام أبياثار رئيس الكهنة[a]، وأكل خبز الحضور[b]، الذي لا يحل أكله إلا للكهنة، وأعطى منه أيضًا للذين كانوا معه؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في أثناء رئاسة أبياثار للكهنة». ويمكن أيضًا فهم العبارة بمعنى أوسع، أي في الزمن أو السياق القصصي المرتبط بأبياثار رئيس الكهنة.'
    reason: alternative_reading
  - marker: b
    text: «خبز الحضور» هو الخبز المقدس الذي كان يوضع أمام الله في المقدس، ويُعرف تقليديًا أيضًا باسم «خبز الوجوه» أو «خبز التقدمة».
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: كيف
  rationale: تنقل أداة الاستفهام التي تستهل رواية ما فعله داود بصياغة عربية طبيعية.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: دخل بيت الله
  rationale: صياغة مباشرة وطبيعية تحفظ صورة البيت والمكان المقدس.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: في أيام أبياثار رئيس الكهنة
  rationale: تنقل الاستعمال الزمني لحرف الجر مع المضاف إليه من غير حصره بالضرورة في مدة تولّي المنصب رسميًا.
- source_word: ἄρτους τῆς προθέσεως
  choice: خبز الحضور
  rationale: تعبير واضح يحفظ دلالة الخبز الموضوع أمام الله، مع شرح ثقافي في الحاشية.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ τοὺς ἱερεῖς
  choice: الذي لا يحل أكله إلا للكهنة
  rationale: يعبر عن الإباحة الشرعية في السياق الديني، ويحفظ قصر الإذن على الكهنة.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: وأعطى أيضًا الذين كانوا معه
  rationale: يحافظ على المفعول المفهوم من السياق وينقل العبارة الوصفية حرفيًا على نحو عربي سليم.
theological_decisions:
- issue: العبارة الزمنية المرتبطة بأبياثار وعلاقتها برواية صموئيل الأول 21
  choice: في أيام أبياثار رئيس الكهنة
  alternative: في أثناء رئاسة أبياثار للكهنة؛ أو في الرواية المتعلقة بأبياثار رئيس الكهنة
  rationale: العبارة اليونانية تحتمل إحالة زمنية واسعة أو إطارًا سرديًا مرتبطًا بأبياثار. لذلك تُحفظ مرونتها في المتن، ويُذكر الاحتمال الآخر في الحاشية دون تسوية التوتر التاريخي ضمن الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «لا يحل» لملاءمة السياق الشرعي المقدس، و«خبز الحضور» بوصفه تعبيرًا مفهومًا مع إبقاء المصطلحات التقليدية في الحاشية.
