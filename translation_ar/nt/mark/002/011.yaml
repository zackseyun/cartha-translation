base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: ar
  text: 'أقول لك: قم، واحمل فراشك[a]، واذهب إلى بيتك[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حصيرك» أو «سريرك البسيط». تشير الكلمة اليونانية إلى فراش نوم بسيط قابل للحمل.
    reason: lexical_alternative
  - marker: b
    text: 'أو «اذهب إلى منزلك». والعبارة اليونانية حرفيًا: «إلى بيتك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: أقول لك
  rationale: صيغة عربية طبيعية ومباشرة تحفظ الخطاب الشخصي وسلطة القول. تقديم الضمير في اليونانية يفيد إبراز المخاطَب، لكن قلب العبارة إلى «لك أقول» سيكون أقل سلاسة في العربية المعاصرة.
- source_word: ἔγειρε
  choice: قم
  rationale: أمر واضح وموجز يناسب توجيه الكلام إلى الرجل المشلول، ويحفظ معنى النهوض من موضعه دون أسلوب عتيق.
- source_word: ἆρον
  choice: احمل
  rationale: يدل هنا على رفع الفراش وأخذه معه. «احمل» طبيعية في العربية وتناسب الشيء القابل للنقل، من غير حصر الفعل في لحظة رفعه فقط.
- source_word: κράβαττόν
  choice: فراشك
  rationale: يشير اللفظ إلى فراش بسيط قابل للحمل أو حصير للنوم، لا إلى سرير كبير ذي هيكل. «فراشك» واضحة وشائعة، وتبقى قابلة لفهمه على أنه ما كان الرجل مضطجعًا عليه.
- source_word: ὕπαγε
  choice: اذهب
  rationale: المقابل العربي المباشر والطبيعي لصيغة الأمر، ويحفظ تتابع الأوامر بوضوح.
- source_word: εἰς τὸν οἶκόν σου
  choice: إلى بيتك
  rationale: يحفظ الاسم الملموس οἶκος واتجاه الحركة الذي تفيده εἰς. ويمكن في العربية فهمه أيضًا بمعنى الرجوع إلى المنزل.
theological_decisions:
- issue: نبرة أمر يسوع بالشفاء وقوته
  choice: 'صياغة الأمر على نحو شخصي مباشر: «أقول لك: قم، واحمل فراشك، واذهب إلى بيتك»'
  alternative: 'صياغة أفخم وأقدم نبرة: «لك أقول: انهض، واحمل سريرك، وامضِ إلى بيتك»'
  rationale: النص يعرض أمرًا فوريًا ذا سلطة. تحافظ الصياغة المختارة على هذه القوة من غير إضافة تفسير لطبيعة السلطة أو لكيفية حدوث الشفاء.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت أفعال أمر موجزة وطبيعية، مع تجنب الألفاظ العتيقة مثل «امضِ» و«انهض» حين لا تدعو إليها ضرورة. وُضعت علامتا الحاشية عند اللفظين اللذين تتناولهما الحاشيتان، لا وفق موضعيهما غير المتطابقين في طبقة الاستشارة الإنجليزية.
