base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: ar
  text: لا أحد يخيط رقعةً من قماش لم ينكمش بعد على ثوب قديم[a]؛ وإلا[b] تنفصل الرقعة الجديدة عن الثوب القديم، فيصبح الخرق أسوأ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من قماش غير ملبَّد». تصف اليونانية قماشًا لم يُعالَج بعد معالجةً تُقلِّص انكماشه؛ ولذلك ينكمش إذا استُعمل رقعةً.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «يأخذ منه الملء، الجديد من العتيق». والمعنى أن الرقعة الجديدة تنفصل عن الثوب القديم، فيزداد الخرق سوءًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: رقعة
  rationale: تدل الكلمة على قطعة قماش توضع لسد خرق، و«رقعة» هي المقابل العربي الطبيعي في سياق إصلاح الثياب.
- source_word: ῥάκους ἀγνάφου
  choice: من قماش لم ينكمش بعد
  rationale: تشير العبارة إلى قماش لم يُعالَج بعد المعالجة التي تجعله ينكمش؛ والصياغة المختارة تنقل الأثر العملي بوضوح.
- source_word: ἐπιράπτει
  choice: يخيط ... على
  rationale: الفعل يعني تثبيت الرقعة بالخياطة، وهذه صياغة عربية واضحة تحافظ على الفعل الملموس.
- source_word: ἱμάτιον παλαιόν
  choice: ثوب عتيق
  rationale: «ثوب» لفظ عام مناسب للملبوس من غير تخصيصه برداء بعينه، و«عتيق» يبرز مقابلته بالجديد.
- source_word: εἰ δὲ μή
  choice: وإلا
  rationale: تنقل نتيجة الشرط بإيجاز وسلاسة.
- source_word: αἴρει
  choice: انتزعت منه
  rationale: يحمل الفعل أصلًا معنى الأخذ أو الرفع، وفي السياق يصور الرقعة الجديدة وهي تجذب جزءًا من الثوب العتيق وتنتزعه.
- source_word: τὸ πλήρωμα
  choice: الرقعة
  rationale: المقصود في هذا السياق قطعة القماش التي تملأ موضع الخرق؛ فترجمتها «الرقعة» أوضح للقارئ.
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: الجديدة من العتيق
  rationale: تحافظ الصياغة على التقابل المكثف والملتبس نسبيًا في اليونانية بين الجديد والعتيق، مع إمكان فهم «الجديدة» على أنها الرقعة و«العتيق» على أنه الثوب.
- source_word: χεῖρον σχίσμα γίνεται
  choice: صار الخرق أسوأ
  rationale: تنقل العبارة النتيجة بتركيب عربي طبيعي، مع إبقاء صورة الخرق الذي يزداد سوءًا.
