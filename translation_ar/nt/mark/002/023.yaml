  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: ar
  text: وحدث أنه كان في يوم السبت يمرّ وسط حقول الحبوب[a]، وبدأ تلاميذه يشقّون طريقهم[b] وهم يقطفون السنابل[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بين الزرع القائم».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «يصنعون طريقًا»؛ والمقصود هنا أنهم كانوا يتقدّمون في الحقل وهم يقطفون السنابل.'
    reason: lexical_alternative
  - marker: c
    text: أي سنابل الحبوب؛ ويجوز التعبير عنها أيضًا بـ«رؤوس الحبوب».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: وحدث أنه
  rationale: صياغة سردية عربية طبيعية تحفظ وظيفة التعبير اليوناني في تقديم الحدث من غير استعمال أسلوب عتيق مثل «وكان ما كان».
- source_word: ἐν τοῖς σάββασιν
  choice: في يوم السبت
  rationale: صيغة الجمع اليونانية تُستعمل في اليونانية الكوينِية استعمالًا اصطلاحيًا للدلالة على يوم سبت مفرد في هذا السياق.
- source_word: παραπορεύεσθαι
  choice: كان ... يمرّ وسط
  rationale: ينقل الحركة الجارية عبر المكان، ويوافق البناء الوصفي مع ἐγένετο وαὐτόν بلغة عربية سليمة.
- source_word: διὰ τῶν σπορίμων
  choice: وسط حقول الحبوب
  rationale: يدل اللفظ على الأراضي المزروعة بالحبوب؛ وهذه العبارة واضحة ومعاصرة ولا تخصّ نوعًا بعينه كالقمح.
- source_word: ἤρξαντο
  choice: أخذ
  rationale: «أخذ» مع المضارع تركيب عربي فصيح وطبيعي يدل على ابتداء الفعل.
- source_word: ὁδὸν ποιεῖν
  choice: يشقّون طريقهم
  rationale: يحفظ صورة «صنع الطريق» في تعبير عربي اصطلاحي، من غير أن يوحي بأن التلاميذ كانوا ينشئون طريقًا رسميًا.
- source_word: τίλλοντες
  choice: وهم يقطفون
  rationale: ينقل معنى نزع السنابل باليد، كما يحفظ كون الفعل مصاحبًا لتقدّمهم في الحقل.
- source_word: τοὺς στάχυας
  choice: السنابل
  rationale: «السنابل» هي المقابل العربي المألوف والدقيق لسنابل الحبوب، ولا تحتاج في السياق إلى تقييدها بالقمح.
- source_word: αὐτὸν
  choice: أنه كان ... يمرّ
  rationale: مع أن الضمير منصوب في البناء اليوناني بعد ἐγένετο، يقتضي الأسلوب العربي جعله اسم «أنّ» ثم إسناد فعل المرور إليه.
theological_decisions:
- issue: تعبير السبت
  choice: في يوم السبت
  alternative: في السبوت
  rationale: الجمع اليوناني اصطلاحي هنا، والمفرد العربي ينقل المعنى السياقي من غير تغيير الإطار المتعلق بالسبت.
- issue: دلالة ὁδὸν ποιεῖν في سياق الجدل حول السبت
  choice: يشقّون طريقهم
  alternative: يصنعون طريقًا
  rationale: الصياغة المختارة تنقل التقدّم في الحقل ولا تضخّم الفعل إلى إنشاء طريق؛ وبذلك لا تسبق النص في تحديد طبيعة المخالفة التي سيعترض عليها الفريسيون.
- issue: علاقة قطف السنابل بالتقدّم في الحقل
  choice: وهم يقطفون السنابل
  alternative: يشقّون طريقهم بقطف السنابل
  rationale: اسم الفاعل اليوناني يدل بوضوح على فعل مصاحب، لكنه قد يُفهم أيضًا على صلة بكيفية تقدّمهم. «وهم يقطفون» تحفظ المصاحبة من غير الجزم بأن القطف كان وسيلة شق الطريق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُخدم «حدث» بدل الصيغ التراثية الثقيلة، و«أخذ ... يشقّون» لنقل ابتداء الفعل بصورة طبيعية. تجنّبت الترجمة تخصيص المحصول بالقمح لأن الأصل اليوناني لا يحدده.
