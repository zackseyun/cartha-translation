source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: ar
  text: ولكن ستأتي أيام حين يُؤخذ العريس من بينهم، وعندئذ يصومون في ذلك اليوم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'العبارة اليونانية بالمفرد: «في ذلك اليوم»، لا «في تلك الأيام».'
    reason: التنبيه إلى عدد الاسم في الأصل ومنع تحويله إلى الجمع بسبب ورود «أيام» في أول الآية.
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: ولكن ستأتي أيام
  rationale: يحافظ على صيغة «ستأتي أيام» وعلى التباين الذي تفيده δέ مع الحال الحاضرة في السياق السابق، من غير إضافة أداة تعريف لا يقتضيها النص اليوناني.
- source_word: ὅταν
  choice: حين
  rationale: تفيد هنا ظرفًا زمنيًا مستقبليًا مرتبطًا بحدث واحد منتظر، ولذلك كانت «حين» أنسب من صيغة قد توحي بالتكرار.
- source_word: ἀπαρθῇ
  choice: يُؤخذ
  rationale: يحافظ المبني للمجهول على عدم ذكر الفاعل، وينقل معنى إبعاد العريس من غير أن يصرّح بطريقة ذلك أو يفسره بالموت.
- source_word: ἀπ’ αὐτῶν
  choice: من بينهم
  rationale: تعبير عربي طبيعي يبرز انفصال العريس عن جماعته من غير تكرار لفظ «بعيدًا».
- source_word: ὁ νυμφίος
  choice: العريس
  rationale: هو المقابل العربي الواضح والطبيعي لـ νυμφίος، ويحفظ استعارة العرس كما وردت في النص.
- source_word: καὶ τότε
  choice: وعندئذ
  rationale: 'يحفظ تسلسل الحدثين بوضوح: بعد أخذ العريس يأتي الصوم.'
- source_word: νηστεύσουσιν
  choice: يصومون
  rationale: ينقل الفعل الديني المألوف νηστεύω مباشرة وبصيغة المستقبل التي يدل عليها الأصل.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: في ذلك اليوم
  rationale: يحافظ على إفراد «اليوم» وعلى التحديد الموجود في العبارة اليونانية، مع صياغة عربية واضحة.
theological_decisions:
- issue: التعريف المجازي ليسوع بوصفه العريس
  choice: الإبقاء على «العريس» بوصفها استعارة من غير التصريح بأن المقصود هو يسوع
  alternative: «حين أُؤخذ أنا من بينهم»
  rationale: السياق يدل على أن يسوع يتحدث عن نفسه، لكن النص يصوغ ذلك باستعارة العريس؛ والإبقاء عليها يحفظ قوتها الأدبية واللاهوتية.
- issue: طبيعة أخذ العريس
  choice: استعمال المبني للمجهول «يُؤخذ» من غير تسمية الفاعل أو ذكر الصلب والموت صراحة
  alternative: «يُؤخذ منهم بالموت» أو «يُنتزع منهم بالقوة»
  rationale: يشير القول ضمنًا إلى إبعاد يسوع الآتي، لكن الآية لا تحدد الفاعل ولا تصرح هنا بطريقة الإبعاد، لذلك تُحفظ مساحة الدلالة والتوتر في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كريمة. حُفظ التكرار الدلالي بين «وعندئذ» و«في ذلك اليوم» لأنه موجود في الأصل، مع تجنب شرح الاستعارة داخل المتن.
