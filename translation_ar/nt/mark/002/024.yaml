  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: ar
  text: 'وكان الفريسيون يقولون له: «انظر، لماذا[a] يفعلون ما لا يجوز في يوم السبت؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انظر، ما الذي يفعلونه في يوم السبت وهو لا يجوز؟» يمكن أن تُفهم الكلمة اليونانية بمعنى «ماذا»، وإن كان السياق يرجّح معنى «لماذا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وكان
  rationale: تربط الجملة بما قبلها وتحافظ، مع الفعل الناقص، على انسياب السرد واستمرار القول.
- source_word: οἱ Φαρισαῖοι
  choice: الفريسيون
  rationale: الاسم العربي المتعارف عليه لهذه الجماعة، مع إفادة التعريف.
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: ينقل صيغة الماضي الناقص اليونانية التي قد تدل على قول مستمر أو متكرر، من غير حسم بينهما.
- source_word: αὐτῷ
  choice: له
  rationale: مقابل عربي طبيعي للمفعول غير المباشر، والضمير عائد إلى يسوع في السياق.
- source_word: Ἴδε
  choice: انظر
  rationale: أمر يُستعمل لجذب الانتباه؛ وهو واضح ومعاصر وأوقر من تعبيرات عامية بديلة.
- source_word: τί
  choice: لماذا
  rationale: 'تؤدي τί هنا معنى سببيًا في سياق الاعتراض: «لماذا يفعلون؟»، مع إثبات احتمال قراءتها بمعنى «ماذا» في الحاشية.'
- source_word: ποιοῦσιν
  choice: يفعلون
  rationale: يحافظ على زمن المضارع داخل القول المباشر بصياغة عربية طبيعية.
- source_word: τοῖς σάββασιν
  choice: في السبت
  rationale: صيغة الجمع اليونانية تعبير مألوف يُراد به يوم السبت، والمفرد هو الأسلوب العربي الطبيعي هنا.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ما لا يجوز
  rationale: ينقل معنى عدم الإباحة أو الجواز بوضوح، ويحافظ على القوة القانونية الدينية من غير تحديد مصدر الحكم.
theological_decisions:
- issue: طبيعة اعتراض الفريسيين
  choice: 'صياغة الاعتراض من جهة الجواز: «ما لا يجوز»'
  alternative: «ما يخالف الشريعة» أو «ما لا يحل»
  rationale: النص اليوناني يصرح بعدم الجواز ولا يحدد هل يستند الاعتراض إلى نص الشريعة أم إلى تقليد فريسي أم إلى تفسير فقهي؛ لذلك لا تحسم الترجمة هذه المسألة.
- issue: دلالة τί الاستفهامية
  choice: «لماذا» في المتن مع ذكر «ماذا» في الحاشية
  alternative: «ماذا يفعلون في السبت مما لا يجوز؟»
  rationale: السياق الاعتراضي يرجح السؤال عن سبب الفعل، لكن البنية اليونانية تحتمل أن تكون τί بمعنى «ماذا»، فحُفظ الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «انظر» لجذب الانتباه، و«ما لا يجوز» للمحافظة على البعد القانوني الديني دون مصطلح مذهبي أو تفسير زائد.
