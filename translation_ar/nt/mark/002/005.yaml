  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: ar
  text: 'ولما رأى يسوع إيمانهم، قال للمشلول: «يا بُنَيَّ، مغفورة لك خطاياك».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا ولدي»؛ اللفظة اليونانية τέκνον تعني حرفيًا «طفلًا» أو «ولدًا»، وتُستعمل هنا نداءً حانيًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: لما رأى
  rationale: ينقل اسم الفاعل الظرفي بصياغة عربية طبيعية تُظهر أن قول يسوع جاء عند رؤيته إيمانهم.
- source_word: πίστιν αὐτῶν
  choice: إيمانهم
  rationale: يحفظ معنى الثقة الظاهرة لدى الجماعة، كما يحفظ ضمير الجمع من غير حصره صراحة في أشخاص بعينهم.
- source_word: λέγει
  choice: قال
  rationale: المضارع اليوناني هنا مضارع تاريخي في السرد؛ والماضي هو الأسلوب الطبيعي الواضح في العربية القصصية.
- source_word: παραλυτικῷ
  choice: للمشلول
  rationale: تعبير عربي واضح ومألوف يدل على الرجل المصاب بالشلل دون استعمال مصطلح طبي ثقيل.
- source_word: Τέκνον
  choice: يا بُنَيَّ
  rationale: ينقل النداء الحاني الأبوي في اللفظة اليونانية؛ وصيغة التصغير العربية طبيعية في مخاطبة رجل بمودة، من غير أن تدل على بنوة حرفية.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: مغفورة لك خطاياك
  rationale: صياغة اسمية تقريرية تحفظ كون الخطايا في حالة الغفران، وتبقي فاعل الغفران غير مذكور كما في المبني للمجهول اليوناني.
- source_word: ἁμαρτίαι
  choice: خطاياك
  rationale: المقابل العربي القياسي الواضح، مع الحفاظ على الجمع وإضافة ضمير المخاطب.
theological_decisions:
- issue: طبيعة إعلان يسوع غفران الخطايا
  choice: «مغفورة لك خطاياك» بوصفه إعلانًا مباشرًا عن واقع الغفران
  alternative: «قد غُفرت لك خطاياك» أو «تُغفر لك خطاياك»
  rationale: يحفظ هذا التعبير القوة التقريرّية للحاضر المبني للمجهول، من غير فرض توقيت مكتمل بصيغة «قد» أو تصوير العملية على أنها مستمرة، ومن غير التصريح بفاعل الغفران الذي تركه النص ضمنيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «يا بُنَيَّ» لنقل الحنان في النداء، و«مغفورة لك خطاياك» لصون الإيجاز والقوة الإعلانّية مع إبقاء الفاعل الإلهي ضمنيًا.
