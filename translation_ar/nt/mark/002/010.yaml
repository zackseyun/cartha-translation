id: MRK.2.10
reference: Mark 2:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: ar
  text: 'ولكن لكي تعلموا أن لابن الإنسان[a] سلطانًا على الأرض أن يغفر الخطايا—يقول للرجل المشلول[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإنسان». قد يحمل اللقب اليوناني «ابن الإنسان» معنى يشير إلى البشرية، كما قد يلمّح إلى دانيال 7.
    reason: alternative_reading
  - marker: b
    text: أو «للمفلوج».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: ولكن لكي
  rationale: تحفظ «لكن» التحول الاستدراكي الخفيف الذي تفيده δέ، وتحفظ «لكي» معنى الغرض في ἵνα.
- source_word: εἰδῆτε
  choice: تعلموا
  rationale: ترجمة مباشرة للفعل، وتناسب المعرفة التي سيؤيدها شفاء الرجل.
- source_word: ἐξουσίαν ἔχει
  choice: له سلطان
  rationale: «سلطان» يدل على الصلاحية والحق المشروع، لا على مجرد القدرة، وهو تعبير عربي واضح وراسخ في هذا السياق.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب بصيغته المعروفة وما فيه من احتمال الإشارة إلى دانيال 7، من غير حسم دلالته في تفسير واحد.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: هي الدلالة الطبيعية للعبارة هنا، وتشير إلى ممارسة السلطان في المجال الأرضي.
- source_word: ἀφιέναι ἁμαρτίας
  choice: أن يغفر الخطايا
  rationale: الفعل ἀφίημι يعني في هذا السياق غفران الخطايا أو إسقاطها، وهذه الصياغة أوضح تعبير عربي مباشر.
- source_word: λέγει τῷ παραλυτικῷ
  choice: يقول للرجل المشلول
  rationale: تحفظ «يقول» المضارع السردي في اليونانية، وتوضح الصفة المستعملة اسمًا بإضافة «الرجل» في عربية طبيعية.
theological_decisions:
- issue: ترجمة لقب ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: الإبقاء على «ابن الإنسان» يحفظ الصيغة اللقبية واحتمال معناها الإنساني وإشارتها إلى دانيال 7، دون اختزال التوتر الدلالي.
- issue: دلالة ἐξουσία في غفران الخطايا
  choice: سلطان
  alternative: قدرة؛ حق
  rationale: السياق يتناول صلاحية ابن الإنسان المشروعة لغفران الخطايا، لا مجرد قدرته على ذلك؛ و«سلطان» يحفظ هذا البعد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ انقطاع الجملة بشرطة طويلة كما في بنية النص اليوناني، وحُفظ المضارع السردي «يقول». استُعمل «الرجل المشلول» للوضوح المعاصر، مع إثبات البديل التقليدي «المفلوج» في الحاشية.
