  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: ar
  text: 'وقال لهم يسوع: «هل يستطيع أهل العرس[a] أن يصوموا ما دام العريس معهم؟ ما دام العريس معهم، لا يستطيعون أن يصوموا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أبناء حجرة العرس» أو «أبناء قاعة العرس»، وهو تعبير اصطلاحي عن المشاركين في الاحتفال بالزفاف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: هل يستطيع ... أن يصوموا؟
  rationale: صيغ الاستفهام بـμή هنا سؤالًا بلاغيًا يتوقع جوابًا بالنفي. تنقل العربية هذا الأثر طبيعيًا بالسؤال، ويأتي التصريح بالنفي في الجملة التالية.
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: أهل العرس
  rationale: تعبير اصطلاحي حرفيته «أبناء حجرة العرس»، ويشير إلى المشاركين في الاحتفال بالزفاف. «أهل العرس» عربي واضح وطبيعي، ولا يضيّق المعنى على فئة محددة من المرافقين.
- source_word: ἐν ᾧ ... ἐστιν
  choice: ما دام ... معهم
  rationale: للتركيب معنى زمني هنا، و«ما دام» يعبّر بوضوح عن استمرار وجود العريس معهم.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: العريس
  rationale: يحفظ صورة العرس ودلالة الشخص الذي يُحتفل بزواجه، وهو اللفظ العربي الحديث الواضح.
- source_word: μετ’ αὐτῶν
  choice: معهم
  rationale: تنقل معنى المصاحبة المباشر في μετά مع المضاف إليه.
- source_word: ὅσον χρόνον
  choice: ما دام
  rationale: يعبّر عن امتداد المدة بعبارة عربية موجزة وطبيعية.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: ما دام العريس معهم
  rationale: تجنبت الصياغة الحرفية «لديهم العريس معهم» لثقلها في العربية؛ وتحفظ «ما دام ... معهم» معنى الحضور المستمر في السياق.
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: وقال لهم يسوع
  rationale: صياغة سردية عربية مباشرة تحافظ على العطف وترتيب تقديم القول بوضوح.
theological_decisions:
- issue: التعريف المجازي بيسوع بوصفه العريس
  choice: الإبقاء على صورة «العريس» من غير شرح هويتها اللاهوتية داخل المتن
  alternative: إضافة تفسير يصرّح بالدلالة المسيانية أو بعلاقة الله بشعبه
  rationale: يوظف النص صورة العريس بما يحمل دلالة لاهوتية، لكنه لا يشرحها في هذه الآية؛ لذلك تُحفظ الصورة ويُترك تفسيرها للقارئ والسياق.
translation_notes:
  register: العربية فصحى حديثة، واضحة وذات نبرة سردية كريمة. استُعمل «أهل العرس» بوصفه المقابل الاصطلاحي الطبيعي، مع توثيق الصورة الحرفية في الحاشية. وحُفظ السؤال البلاغي من غير تحويله إلى تقرير تفسيري.
