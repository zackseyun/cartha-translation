lexical_decisions:
- source_word: ἐξάπινα
  choice: فجأة
  rationale: ينقل الظرف اليوناني الدال على حدوث الأمر بغتة بعبارة عربية طبيعية ومباشرة.
- source_word: περιβλεψάμενοι
  choice: تطلَّعوا حولهم
  rationale: يحافظ على معنى الالتفات والنظر في المحيط، مع صياغة عربية واضحة.
- source_word: οὐκέτι
  choice: بعد ذلك
  rationale: 'يعبّر عن انقطاع الحالة السابقة زمنيًا: لم يعودوا يرون الآخرين عقب تلك اللحظة.'
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον
  choice: إلا يسوع وحده
  rationale: يحفظ بنية الاستثناء والتوكيد بكلمة «وحده» دون حذف ما في الأصل من تشديد.
- source_word: μεθ’ ἑαυτῶν
  choice: معهم
  rationale: ترجمة مباشرة وطبيعية تفيد أن يسوع بقي بصحبتهم.
