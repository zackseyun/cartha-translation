  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: ar
  text: 'لكني أقول لكم: إن إيليا أيضًا قد جاء[a]، وفعلوا به كل ما أرادوا، كما هو مكتوب عنه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي إن إيليا قد جاء بالفعل في شخص يوحنا المعمدان وخدمته؛ انظر مرقس 9: 11–12، وقارن متى 11: 14؛ 17: 12–13.'
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكنني
  rationale: 'تفيد الاستدراك والمقابلة مع توقع التلاميذ، ووصلها بضمير المتكلم يجعل العبارة العربية طبيعية: «لكني أقول لكم».'
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية لصيغة الخطاب، وتحافظ على التوكيد الشخصي.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: إن إيليا قد جاء أيضًا
  rationale: «قد جاء» تنقل دلالة الفعل التام على وقوع المجيء مع بقاء صلته بالحاضر، و«أيضًا» تقابل καὶ من غير تحميلها معنى تفسيريًا زائدًا.
- source_word: ἐποίησαν αὐτῷ
  choice: فعلوا به
  rationale: تعبير عربي فصيح يحافظ على الصياغة المفتوحة والقوية، ثم يحدد ما بعده مداها.
- source_word: ὅσα ἤθελον
  choice: كل ما أرادوا
  rationale: ينقل معنى الشمول وعدم التقييد في ὅσα، بصياغة عربية واضحة وطبيعية.
- source_word: καθὼς γέγραπται
  choice: كما هو مكتوب
  rationale: الصيغة العربية المألوفة والدقيقة للإحالة إلى ما كُتب في الأسفار.
- source_word: ἐπ’ αὐτόν
  choice: عنه
  rationale: المعنى الأرجح مع فعل الكتابة هنا هو «بشأنه/عنه»، أما «عليه» أو «ضده» فقد توحيان بمعنى غير لازم في السياق.
theological_decisions:
- issue: هوية إيليا في هذا القول
  choice: إبقاء اسم «إيليا» في المتن من غير إضافة تفسيرية
  alternative: التصريح في المتن بأن المقصود هو يوحنا المعمدان
  rationale: النص اليوناني يذكر إيليا صراحة، بينما يتضح الربط بيوحنا المعمدان من السياق والنصوص الموازية. لذلك يُحفظ التوتر التفسيري في المتن، ويُذكر الربط في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت «لكني» و«فعلوا به كل ما أرادوا» للمحافظة على مباشرة النص وقوته، من غير إدخال هوية يوحنا المعمدان في المتن.
