source:
  edition: SBLGNT
  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: ar
  text: 'وكانوا يسألونه قائلين: «لماذا يقول الكتبة إن إيليا لا بد أن يأتي أولًا؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: كانوا يسألونه
  rationale: صيغة الماضي الناقص تدل على فعل مستمر أو متكرر في سياق السرد، وتؤديه العربية طبيعيًا بتركيب «كانوا يسألون».
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ اسم الفاعل على بنية النص اليوناني ويقدّم مضمون السؤال بعبارة عربية فصيحة وطبيعية.
- source_word: Ὅτι
  choice: لماذا
  rationale: مع أن اللفظة تعني في أصلها «أن»، فإنها هنا في سياق استفهامي تؤدي معنى «لماذا» أو «كيف يكون أن»؛ و«لماذا» أوضح في العربية المعاصرة.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: المقابل التاريخي المألوف لهذه الفئة في سياق الأناجيل، من غير توسيع تفسيري إلى «معلمي الشريعة».
- source_word: Ἠλίαν
  choice: إيليا
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: δεῖ
  choice: لا بد أن
  rationale: ينقل معنى الضرورة بقوة ووضوح، مع إبقاء مصدر هذه الضرورة غير مصرّح به كما في الأصل.
- source_word: ἐλθεῖν
  choice: يأتي
  rationale: المقابل العربي الطبيعي للمصدر اليوناني في هذا السياق النبوي.
- source_word: πρῶτον
  choice: أولًا
  rationale: ينقل بوضوح معنى الأسبقية الزمنية.
theological_decisions:
- issue: دلالة Ὅτι في سؤال التلاميذ
  choice: صياغته سؤالًا مباشرًا بـ«لماذا»
  alternative: «كيف يقول الكتبة إن إيليا لا بد أن يأتي أولًا؟»
  rationale: السياق استفهامي، و«لماذا» تنقل المقصود بوضوح من دون إضافة تفسير عقائدي.
- issue: طبيعة مجيء إيليا
  choice: «إيليا لا بد أن يأتي أولًا» من دون توسع
  alternative: «لا بد أن يعود إيليا أولًا» أو «لا بد أن يأتي إيليا قبل المسيح»
  rationale: لا يذكر النص هنا «العودة» ولا يصرّح بمن يسبقه إيليا، لذلك تُترك العبارة على إيجازها وتوترها السياقي الأصلي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ استمرار السؤال في «كانوا يسألونه»، كما حُفظ اسم الفاعل «قائلين» والبنية الموجزة للقول عن مجيء إيليا، من غير زيادات تفسيرية.
