review_pass:
  verdict: revise
  source_fidelity: المسودة تحفظ البنية الأساسية للآية ومعنى «يُعثِر» و«هؤلاء الصغار المؤمنين بي» حفظًا جيدًا. لكن «دابة» أوسع من ὀνικός، الذي يحدد الحمار، فلا ينبغي إبهام هذا التحديد في المتن والاكتفاء به في الحاشية. كما أن «لكان خيرًا له لو...» أنسب لصيغة التحذير والمفاضلة في اليونانية من «فخير له أن...».
  naturalness: اللغة فصيحة ومفهومة عمومًا. الصياغة الشرطية «لكان خيرًا له لو عُلِّق... وأُلقي...» أكثر سلاسة ودقة في العربية المعاصرة، وتحافظ على الصورة القاسية دون زيادة تفسيرية.
  terminology: «يُعثِر»، «الصغار»، و«المؤمنين بي» اختيارات مناسبة وتحفظ اتساع النص. ويُستبدل التعبير العام «تديره دابة» بتحديد «يديره حمار» لمطابقة μύλος ὀνικός. و«حجر رحى» هو المقابل العربي الملائم لـ μύλος.
  issues:
  - severity: medium
    issue: «تُدِيرُهُ دابّة» لا تنقل التحديد المعجمي لـὀνικός.
    rationale: الكلمة اليونانية منسوبة إلى الحمار تحديدًا، لا إلى دابة غير معيّنة. والحاشية لا تعوّض فقدان هذا التحديد في المتن.
  - severity: low
    issue: «فخير له أن يُعلّق... وأن يُطرح...» أقل مطابقة لبنية التحذير الشرطية في الأصل.
    rationale: «لكان خيرًا له لو عُلِّق... وأُلقي...» تؤدي بصورة أوضح معنى «it would be better for him if»، مع بقاء المعنى ذاته.
