source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: ar
  text: وَمَنْ يُعْثِرْ وَاحِدًا مِنْ هَؤُلَاءِ الصِّغَارِ الْمُؤْمِنِينَ بِي، لَكَانَ خَيْرًا لَهُ لَوْ عُلِّقَ حَوْلَ عُنُقِهِ حَجَرُ رَحًى يُدِيرُهُ حِمَارٌ[a]، وَأُلْقِيَ فِي الْبَحْرِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي حجر رحى كبير يديره حمار، تمييزًا له من حجر الرحى اليدوي الأصغر.
    reason: إيضاح الدلالة الخاصة للتعبير اليوناني μύλος ὀνικός.
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: يُعْثِرْ
  rationale: يحفظ صورة العثرة المجازية واتساعها لتشمل الإيقاع في الخطية أو السقوط، من غير حصر المعنى في تفسير واحد.
- source_word: μικρῶν τούτων
  choice: هَؤُلَاءِ الصِّغَارِ
  rationale: يحفظ اتساع العبارة، فلا يقصرها على الأطفال، ويمكن أن يشمل المؤمنين الضعفاء أو قليلي الشأن.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: الْمُؤْمِنِينَ بِي
  rationale: صياغة عربية مباشرة وطبيعية للعبارة اليونانية، وتحدد الصغار بأنهم مؤمنون بيسوع.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: فَخَيْرٌ لَهُ
  rationale: تؤدي قوة المفاضلة والتحذير الشديد بإيجاز عربي طبيعي.
- source_word: μύλος ὀνικός
  choice: حَجَرُ رَحًى تُدِيرُهُ دَابَّةٌ
  rationale: يدل التعبير على حجر الرحى الكبير الذي تديره دابة، ولا سيما الحمار، في مقابل حجر الرحى اليدوي الصغير.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: يُعَلَّقَ حَوْلَ عُنُقِهِ
  rationale: ينقل بوضوح وضع حجر الرحى حول العنق، ويتلاءم مع السياق التصويري.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: يُطْرَحَ فِي الْبَحْرِ
  rationale: صياغة مبنية للمجهول واضحة وطبيعية تنقل النتيجة الحاسمة للصورة اليونانية.
theological_decisions:
- issue: مرجع «هؤلاء الصغار»
  choice: صياغة عامة تشمل المؤمنين الضعفاء أو قليلي الشأن، من غير استبعاد الأطفال
  alternative: قصر العبارة على الأطفال، أو تخصيصها بالتلاميذ المتواضعين وحدهم
  rationale: وصفهم بأنهم «المؤمنون بي» يتجاوز فئة العمر وحدها، بينما تترك الترجمة المرجع واسعًا كما في الأصل.
- issue: مدى معنى σκανδαλίσῃ
  choice: يُعْثِرْ
  alternative: يجعله يخطئ؛ يصدّه عن الإيمان
  rationale: يحفظ المجاز والتوتر الدلالي بين الإيقاع في الخطية والتسبب في السقوط أو الارتداد، بدل حسمه في معنى أضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «دابة» في المتن لصياغة طبيعية، مع تحديد الحمار في الحاشية، وحُفظت صورة «العثرة» واتساع مدلول «الصغار».
