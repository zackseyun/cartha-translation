  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: ar
  text: وَإِنْ كَانَتْ عَيْنُكَ تُعْثِرُكَ، فَاطْرَحْهَا. فَخَيْرٌ لَكَ أَنْ تَدْخُلَ مَلَكُوتَ اللهِ بِعَيْنٍ وَاحِدَةٍ مِنْ أَنْ تُطْرَحَ فِي جَهَنَّمَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «جهنم» تسمية مأخوذة من اسم وادي هنوم، وقد استُعملت للدلالة على موضع الدينونة الأخروية.
    reason: توضيح الخلفية التاريخية والدلالة الأخروية للمصطلح اليوناني γέεννα.
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: جَعَلَتْكَ ... تَعْثُرُ
  rationale: يحفظ صورة التعثر في اليونانية من غير حصر المعنى صراحةً في ارتكاب الخطيئة، مع وضوح دلالة التحذير في السياق.
- source_word: ἔκβαλε
  choice: فَاطْرَحْهَا
  rationale: ينقل قوة فعل الأمر ومعنى الإخراج أو الطرح، من غير إضافة معنى الاقتلاع غير المصرح به في الفعل نفسه.
- source_word: καλόν ... ἢ
  choice: فَخَيْرٌ لَكَ ... مِنْ
  rationale: يصوغ المقارنة الضمنية صياغة عربية طبيعية، مع أن اللفظ اليوناني الأساسي يعني «حسن» أو «خير».
- source_word: μονόφθαλμον
  choice: أَعْوَرَ
  rationale: لفظ عربي موجز وطبيعي يعني ذا عين واحدة، ويحفظ الصورة الجسدية الملموسة.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: مَلَكُوتَ اللهِ
  rationale: تعبير عربي كتابي راسخ وواضح يحفظ الوزن اللاهوتي للعبارة اليونانية.
- source_word: βληθῆναι
  choice: تُطْرَحَ
  rationale: ينقل صيغة المبني للمجهول ومعنى الإلقاء، ويحقق اتساقًا لفظيًا مناسبًا مع «فاطرحها».
- source_word: γέενναν
  choice: جَهَنَّمَ
  rationale: «جهنم» هي الصيغة العربية الطبيعية والتاريخية المقابلة لليونانية γέεννα، وهي نفسها متصلة باسم وادي هنوم؛ لذلك لا تحتاج إلى نقل صوتي غريب عن الاستعمال العربي.
theological_decisions:
- issue: دلالة σκανδαλίζῃ بين التعثر والخطيئة
  choice: جَعَلَتْكَ ... تَعْثُرُ
  alternative: دَفَعَتْكَ إِلَى الْخَطِيئَةِ
  rationale: يحفظ الاختيار الاستعارة الأصلية واتساعها الدلالي، فلا يقصرها على تفسير أخلاقي واحد، مع بقاء المعنى مفهومًا من السياق.
- issue: تسمية موضع الدينونة في γέεννα
  choice: جَهَنَّمَ
  alternative: وَادِي هِنُّومَ
  rationale: «جهنم» في العربية ليست تعميمًا لمصطلح آخر بل المقابل اللغوي المتوارث لـγέεννα، وتحفظ دلالة الدينونة الأخروية المقصودة؛ أما «وادي هنوم» فقد يوهم أن المقصود مجرد الموقع الجغرافي التاريخي.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة وقورة. استُخدم «ملكوت الله» لاتساقه مع التعبير الكتابي المألوف، وحُفظت استعارة التعثر. وُضع مؤشر الحاشية بعد «جهنم» لأنه يشرح هذا المصطلح، لا فعل التعثر.
