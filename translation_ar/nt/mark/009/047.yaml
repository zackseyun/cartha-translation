- from: وَإِنْ جَعَلَتْكَ عَيْنُكَ تَعْثُرُ، فَاطْرَحْهَا. فَخَيْرٌ لَكَ أَنْ تَدْخُلَ مَلَكُوتَ اللهِ أَعْوَرَ مِنْ أَنْ تَكُونَ لَكَ عَيْنَانِ وَتُطْرَحَ فِي جَهَنَّمَ.[a]
  to: وَإِنْ كَانَتْ عَيْنُكَ تُعْثِرُكَ، فَاطْرَحْهَا. فَخَيْرٌ لَكَ أَنْ تَدْخُلَ مَلَكُوتَ اللهِ بِعَيْنٍ وَاحِدَةٍ مِنْ أَنْ تُطْرَحَ فِي جَهَنَّمَ.[a]
  rationale: يصحح النص تركيب فعل التعثر إلى صيغة سببية عربية سليمة، ويستبدل الوصف المحتمل للالتباس بعبارة واضحة ومحايدة، مع إبقاء ترتيب المقارنة وصورة النص اليوناني ومصطلحَي «ملكوت الله» و«جهنم». كما ضُبطت الحاشية لتكون أدق في وصف أصل التسمية.
