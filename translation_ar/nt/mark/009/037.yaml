base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: ar
  text: «مَن يقبل واحدًا من أطفالٍ من هذا النوع باسمي[a]، يقبلني؛ ومَن يقبلني، فلا يقبلني أنا، بل الذي أرسلني».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «يقبل» في مواضعها كلها بـ«يرحّب بـ»؛ فالفعل اليوناني نفسه يتكرر في جمل الآية.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃς ἂν
  choice: مَن
  rationale: تفيد أداة الوصل مع ἄν تعميم الشرط، و«مَن» هي الصياغة العربية الطبيعية الموجزة لهذا المعنى.
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: واحدًا من أمثال هؤلاء الأطفال
  rationale: تحفظ الصياغة معنى التبعيض في ἓν ... παιδίων والقوة النوعية لـτοιούτων، أي طفلًا من هذا القبيل، مع عربية مفهومة.
- source_word: δέξηται / δέχεται / δέχηται
  choice: يقبل
  rationale: 'يمكن أن يعني الفعل «يقبل» أو «يرحّب بـ». اختير «يقبل» وأُبقي مكررًا في جميع الجمل للمحافظة على السلسلة البلاغية: قبول الطفل، وقبول يسوع، وقبول مرسله.'
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: باسمي
  rationale: تعبير عربي موجز يدل على القبول بسبب اسم يسوع أو بالارتباط به وبسلطانه، من غير حصر الدلالة في تفسير واحد.
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: فلا يقبلني أنا، بل
  rationale: تحفظ أداة النفي ثم الاستدراك وترتيب المقابلة في اليونانية، كما تُظهر «أنا» توكيد الضمير ἐμέ.
- source_word: τὸν ἀποστείλαντά με
  choice: الذي أرسلني
  rationale: ترجمة طبيعية لاسم الفاعل المعرّف المستعمل استعمال الاسم، وتحفظ لغة الإرسال والعلاقة بين يسوع ومرسله.
theological_decisions:
- issue: 'دلالة المقابلة الأخيرة: «لا يقبلني أنا، بل الذي أرسلني»'
  choice: الإبقاء على صيغة النفي والاستدراك كما هي، من غير إضافة «فقط» أو «أيضًا».
  alternative: «لا يقبلني وحدي، بل يقبل أيضًا الذي أرسلني»
  rationale: النص اليوناني يقدّم مقابلة حادة ظاهريًا، مع أن السياق لا ينفي حقيقة قبول يسوع، بل يؤكد أن قبوله يبلغ إلى قبول الذي أرسله. تحافظ الترجمة على هذا التوتر اللاهوتي بدل شرحه أو حسمه داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أمثال هؤلاء الأطفال» للموازنة بين طبيعية العربية والمحافظة على دلالة النوع والتبعيض، وتُرك التكرار والمقابلة اللاهوتية ظاهرين.
