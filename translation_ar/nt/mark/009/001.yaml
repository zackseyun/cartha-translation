base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: ar
  text: 'وكان يقول لهم: «الحق أقول لكم: إن بعض الواقفين هنا لن يذوقوا الموت[a] أبدًا حتى يروا ملكوت الله قد أتى بقوة[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تعبير «يذوقوا الموت» يعني أن يختبروا الموت، أي يموتوا.
    reason: lexical_alternative
  - marker: b
    text: لا يحدد النص الحدث المقصود بمجيء ملكوت الله بقوة. وقد ربطه مفسرون بالتجلي، أو القيامة، أو حلول الروح القدس، أو دينونة أورشليم، أو اكتمال الملكوت في المستقبل.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: يحفظ دلالة الماضي الناقص على الاستمرار في سياق السرد، مع بقاء العبارة طبيعية بالعربية.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صيغة عربية واضحة ومألوفة لنقل افتتاح القول المؤكد، من غير الاكتفاء بالنقل الصوتي «آمين».
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: بعض الواقفين هنا
  rationale: تعبير موجز يحفظ معنى التبعيض وحالة الحاضرين الواقفين.
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: لن يذوقوا الموت أبدًا
  rationale: يحفظ استعارة «ذوق الموت»، ويعبّر «لن... أبدًا» عن النفي اليوناني المؤكد، من غير أن يعني استحالة موتهم مطلقًا خارج القيد الزمني التالي.
- source_word: ἕως ἂν ἴδωσιν
  choice: حتى يروا
  rationale: ينقل التركيب الزمني المستقبلي مباشرة وبأسلوب عربي طبيعي.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: «ملكوت الله» تعبير عربي كتابي راسخ، ويحفظ أبعاد المُلك والسيادة والمجال الملكي في الاستعمال الإنجيلي.
- source_word: ἐληλυθυῖαν
  choice: قد أتى
  rationale: «قد» مع الماضي تنقل، بقدر طبيعي في العربية، معنى الفعل التام وحالة الوصول الناتجة عنه، مع جعل «ملكوت» فاعلًا مذكرًا.
- source_word: ἐν δυνάμει
  choice: بقوة
  rationale: صياغة عربية طبيعية تحفظ معنى ظهور الملكوت مصحوبًا بالقوة، من دون تحديد كيفية ذلك أو الحدث المقصود.
theological_decisions:
- issue: توقيت الحدث المقصود بقول «ملكوت الله قد أتى بقوة» وهويته
  choice: إبقاء العبارة عامة من غير تعيين الحدث.
  alternative: تفسيرها صراحة بالتجلي، أو القيامة والتمجيد، أو حلول الروح القدس، أو دينونة أورشليم، أو اكتمال الملكوت في المستقبل.
  rationale: النص اليوناني لا يحدد الحدث المقصود، لذلك تحافظ الترجمة على الاحتمال والتوتر التفسيري بدل حسمهما.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظت استعارة «ذوق الموت»، واستُخدم «ملكوت الله» بوصفه التعبير العربي الإنجيلي الراسخ. وُضعت علامتا الحاشيتين بعد الاقتباس لأنهما تتصلان بعبارتين داخله، مع ظهورهما صراحة في المتن.
