base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: ar
  text: وكثيرًا ما ألقاه في النار وفي المياه ليهلكه[a]. لكن إن كنت تستطيع أن تفعل شيئًا، فأعِنّا وتحنَّن علينا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الماء»؛ جاءت «المياه» في اليونانية بصيغة الجمع.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فأعِنّا إذ تتحنن علينا»، أو: «ارحمنا وأعِنّا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: كثيرًا ما
  rationale: تعبير عربي طبيعي يدل على تكرار وقوع الفعل.
- source_word: ἔβαλεν
  choice: ألقاه
  rationale: الماضي يلخّص أفعالًا تكررت، والسياق مع «كثيرًا ما» يوضح هذا التكرار.
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: في النار وفي المياه
  rationale: حُفظ تكرار حرف الجر للتوكيد، وجاءت «المياه» جمعًا موافقةً لصيغة اليونانية.
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: ليهلكه
  rationale: تنقل لام التعليل قصد الإهلاك، من غير حصر المعنى في القتل وحده.
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: لكن إن كنت تستطيع أن تفعل شيئًا
  rationale: أُثبت معنى τι بكلمة «شيئًا»، وحُفظ تردد الأب بشأن قدرة يسوع من غير تخفيف.
- source_word: βοήθησον ἡμῖν
  choice: فأعِنّا
  rationale: طلب مباشر وفصيح للمساعدة العاجلة، مع ضمير الجمع كما في المصدر.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: وتحنَّن علينا
  rationale: صياغة عربية طبيعية تنقل معنى الرحمة العميقة المتجهة نحو المتكلمين، وإن حوّلت المشاركة إلى فعل معطوف لسلامة الأسلوب.
theological_decisions:
- issue: نبرة التماس الأب وما فيها من شك في قدرة يسوع
  choice: «إن كنت تستطيع أن تفعل شيئًا»
  alternative: «إن كنت قادرًا على شيء»
  rationale: العبارة اليونانية تصرّح بتردد الأب؛ لذلك بقي التوتر قائمًا ولم تُصغ العبارة كإقرار واثق.
- issue: مرجع الفاعل في «ألقاه» و«ليهلكه»
  choice: إبقاء الفاعل مستترًا بحسب السياق السابق
  alternative: التصريح بلفظ «الروح»
  rationale: الآية اليونانية تستخدم ضميرًا يعود إلى الروح المذكور في السياق، ولا حاجة إلى إضافة الاسم داخل هذه الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «أعِنّا» للإيجاز وقوة الالتماس، و«تحنَّن علينا» لنقل معنى الشفقة العميقة دون تعبير مذهبي خاص.
