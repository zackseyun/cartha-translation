  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: ar
  text: وحيثما أمسك به يطرحه أرضًا، فيُزبد ويصرّ بأسنانه ويتيبّس[a]. وطلبتُ من تلاميذك أن يطردوه، فلم يقدروا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يذبل» أو «يجفّ»؛ وقد يُفهم هنا بمعنى «يتصلّب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: أينما
  rationale: تنقل معنى الموصول غير المعيّن الدال على تكرار وقوع الأمر في أي موضع، مع بقاء العبارة طبيعية في العربية.
- source_word: καταλάβῃ
  choice: استولى عليه
  rationale: يفيد الفعل إمساك الروح بالصبي وتمكّنه منه بقوة؛ و«استولى عليه» واضح وملائم للفعل العدائي في السياق.
- source_word: ῥήσσει
  choice: يصرعه
  rationale: يصف طرح الصبي بعنف وإسقاطه، من غير الإيحاء بتمزيق جسده تمزيقًا حرفيًا.
- source_word: ἀφρίζει
  choice: يُزبد
  rationale: مقابل عربي موجز للفعل الذي يعني خروج الزبد، من غير إضافة «من فمه» وهي غير مصرّح بها في اليونانية.
- source_word: τρίζει τοὺς ὀδόντας
  choice: يطحن أسنانه
  rationale: تعبير عربي واضح ومعاصر يصف احتكاك الأسنان بعضها ببعض بوصفه عرضًا جسديًا.
- source_word: ξηραίνεται
  choice: يتيبّس
  rationale: يحافظ «يتيبّس» على شيء من الدلالة الحرفية المرتبطة بالجفاف واليبس، ويمكن في السياق أن يدل على تصلّب الجسد؛ وتُذكر البدائل في الحاشية لصون الغموض المعجمي.
- source_word: εἶπα
  choice: طلبتُ من
  rationale: المقصود قول الأب للتلاميذ أن يقوموا بالفعل؛ و«طلبت من» صياغة عربية طبيعية تؤدي وظيفة القول في هذا التركيب.
- source_word: ἐκβάλωσιν
  choice: أن يطردوه
  rationale: «يطرد» ملائم لاستعمال الفعل في سياق إخراج روح نجس، والضمير يحافظ على إحالة النص بدل استبداله باسم تفسيري صريح.
- source_word: οὐκ ἴσχυσαν
  choice: فلم يقدروا
  rationale: ينقل معنى العجز أو عدم امتلاك القدرة من غير تحديد سبب الإخفاق.
theological_decisions:
- issue: مرجع الضمير αὐτό في عبارة إخراجه
  choice: أُبقي الضمير في «أن يطردوه»، ويُفهم في سياق الرواية أنه يعود إلى الروح النجس.
  alternative: يمكن فهمه على نحو أعم بوصفه عائدًا إلى البلاء الذي أصاب الصبي.
  rationale: السياق المباشر يتحدث عن روح معادٍ يمسك بالصبي، وفعل الطرد يدل على إخراج الروح؛ لكن إبقاء الضمير يتجنب زيادة اسم تفسيري غير وارد صراحة في الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُعملت ألفاظ حية ومفهومة مثل «يصرعه» و«يطحن أسنانه»، مع تجنب الصياغة الطبية التفسيرية الزائدة. وُضع رمز الحاشية بعد «يتيبّس» لأنه يخص معنى ξηραίνεται.
