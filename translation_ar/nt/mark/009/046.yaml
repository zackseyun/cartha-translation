translation:
  language: ar
  text: حيث دودهم لا يموت، والنار لا تُطفأ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية غير موجودة في أقدم المخطوطات اليونانية، ومنها المخطوطتان السينائية والفاتيكانية من القرن الرابع، ولا في الترجمات القبطية المبكرة؛ لكنها موجودة في غالبية المخطوطات البيزنطية وفي التقليد اللاتيني. ويُرجَّح أنها إضافة ناسخ متأخرة تكرر نص الآية 48 نفسه (وكذلك الآية 44).
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: دود
  rationale: يدل اللفظ على الدود الذي يلتهم المواد المتحللة. واختيار «دود» يحافظ على الصلة المباشرة باقتباس إشعياء 66:24 وعلى وقعه المألوف، مع ملاءمته لضمير الجمع في «دودهم».
- source_word: τελευτᾷ
  choice: يموت
  rationale: الفعل τελευτάω يعني يبلغ نهايته أو يموت؛ و«يموت» طبيعي في العربية مع الدود، ويحفظ صيغة المضارع الدالة هنا على استمرار عدم الموت.
- source_word: σβέννυται
  choice: تُطفأ
  rationale: الفعل المبني للمجهول يعني تُخمَد أو تُطفأ. و«تُطفأ» هو التعبير العربي الطبيعي مع النار، ويحفظ صورة النار التي لا يمكن إخمادها.
