lexical_decisions:
- source_word: ὃς
  choice: مَنْ
  rationale: اسم موصول عام يفيد كل شخص ينطبق عليه القول، وهو طبيعي وموجز في العربية.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تربط العبارة بما قبلها بوصفها تعليلًا أو تفسيرًا.
- source_word: οὐκ ἔστιν
  choice: لَيْسَ
  rationale: نقل مباشر وطبيعي لفعل الكينونة المنفي.
- source_word: καθ’ ἡμῶν
  choice: عَلَيْنَا
  rationale: تفيد المعارضة والوقوف ضد المتكلمين، وتحافظ على الإيجاز والتقابل العربي المألوف.
- source_word: ὑπὲρ ἡμῶν
  choice: مَعَنَا
  rationale: في سياق هذا التقابل تعني الوقوف في صف المتكلمين أو تأييدهم؛ و«معنا» تعبير عربي واضح يحافظ على الموازاة، مع إثبات البديل الأقرب إلى الصورة اللفظية في الحاشية.
- source_word: ἐστιν
  choice: فَهُوَ
  rationale: أُدِّي معنى فعل الكينونة بجملة اسمية عربية، مع الفاء الرابطة لجواب الاسم الموصول العام.
theological_decisions:
- issue: نطاق الانحياز في «علينا/معنا»
  choice: الإبقاء على ضمير المتكلمين من غير توسيعه إلى الله أو الملكوت أو الرسالة
  alternative: مَنْ لم يعارض رسالتنا فهو في صفنا؛ أو مَنْ ليس ضد الله فهو مع الله
  rationale: النص اليوناني يستعمل ضمير المتكلمين صراحة، لذا تُترك دلالة نطاقه للسياق ولا تُحسم بإضافة تفسير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على بنية القول المتوازية وعلى ضمير الجمع في الأصل.
