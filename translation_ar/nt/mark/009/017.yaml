  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: ar
  text: 'فأجابه واحد من الحشد: «يا معلّم، أحضرتُ ابني إليك، وبه روح أخرس[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ابني الذي به روح أخرس».'
    reason: بديل تركيبي يبرز أن العبارة اليونانية تصف الابن بأنه ذو روح أخرس، من غير تحويل الوصف إلى تفسير سببي في الحاشية.
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: فأجابه
  rationale: صياغة عربية طبيعية تحفظ معنى الاستجابة والمفعول «له»، مع ربط الحدث بما قبله.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: واحد من الحشد
  rationale: تحفظ صيغة المفرد غير المعيّن والتعبير التبعيضي من غير إضافة «رجل»، وهي غير مصرّح بها في اليونانية.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: تنقل صيغة النداء والمعنى التعليمي المباشر للكلمة بعبارة عربية معاصرة واضحة.
- source_word: ἤνεγκα
  choice: أحضرتُ
  rationale: تنقل الفعل الماضي الدال على الإتيان بالابن إلى يسوع، وهي أنسب هنا من صياغة أوسع مثل «جئت بابني».
- source_word: τὸν υἱόν μου
  choice: ابني
  rationale: تحفظ علاقة البنوة المصرّح بها، من غير استبدالها بـ«الصبي» أو «الطفل».
- source_word: πρὸς σέ
  choice: إليك
  rationale: المقابل العربي الطبيعي لاتجاه الإحضار نحو المخاطَب.
- source_word: ἔχοντα πνεῦμα ἄλαλον
  choice: وبه روح أخرس
  rationale: تربط العبارة بالابن كما يفعل اسم الفاعل اليوناني، وتحافظ على وصف الروح نفسه بأنه «أخرس» من غير أن تفك دلالته تفسيرياً في المتن.
theological_decisions:
- issue: دلالة πνεῦμα في سياق إخراج الأرواح
  choice: روح
  alternative: روح شرير أو شيطان
  rationale: السياق يدل على روح مؤذٍ أو شيطاني، لكن الآية نفسها تقول «روح» فقط؛ لذلك لا يُضاف وصف «شرير» ولا يُستبدل اللفظ بـ«شيطان».
- issue: دلالة ἄλαλον وصلتها بالروح والابن
  choice: روح أخرس
  alternative: روح يجعله غير قادر على الكلام
  rationale: النص اليوناني يصف الروح حرفياً بأنه غير ناطق، وقد يُفهم في السياق أنه يسبّب للابن العجز عن الكلام. يحفظ المتن الصياغة المباشرة، وتوضح الحاشية الاحتمال الوظيفي من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «الحشد» للمفرد الجمعي، و«وبه» لصياغة موجزة وطبيعية تعكس تعلق العبارة الوصفية بالابن.
