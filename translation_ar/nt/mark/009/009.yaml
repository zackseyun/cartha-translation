  terminology: «ابن الإنسان» و«من بين الأموات» مناسبان وثابتان. «يرووا» ممكن، لكن «يخبروا أحدًا بما رأوه» أوضح وأشيع في الاستعمال الحديث، مع بقاء معنى الإبلاغ/الرواية في διηγήσωνται ضمن السياق.
