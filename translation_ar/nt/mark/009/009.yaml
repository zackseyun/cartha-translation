  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: ar
  text: وبينما كانوا ينزلون من الجبل، أمرهم ألا يخبروا أحدًا بما رأوه، إلى أن يقوم ابن الإنسان من بين الأموات[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «من الأموات»؛ والترجمة «من بين الأموات» تُظهر دلالة الخروج من جماعتهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων
  choice: كانوا ينزلون
  rationale: اسم الفاعل المضارع في تركيب المضاف إليه المطلق يدل على فعل جارٍ ومتزامن مع الأمر؛ و«بينما كانوا ينزلون» تعبير عربي طبيعي يحفظ هذا المعنى.
- source_word: ὄρους
  choice: الجبل
  rationale: اللفظة تدل عادةً على جبل، وهو الأنسب لسياق حادثة التجلي.
- source_word: διεστείλατο
  choice: أمرهم
  rationale: الفعل يفيد توجيه أمر أو وصية ملزمة؛ و«أمرهم» واضح ويحفظ قوة العبارة من غير تكلف.
- source_word: ἵνα μηδενὶ
  choice: ألا يرووا لأحد
  rationale: ينقل مضمون الأمر وصيغته المنفية، مع الحفاظ على معنى «لا أحد» في تركيب عربي سليم.
- source_word: ἃ εἶδον διηγήσωνται
  choice: يرووا لأحد ما رأوه
  rationale: διηγέομαι يفيد رواية الخبر أو سرد ما حدث، لذلك «يرووا ... ما رأوه» أدق من مجرد «يقولوا» وطبيعي في العربية.
- source_word: εἰ μὴ ὅταν
  choice: إلا متى
  rationale: يحفظ الصياغة الاستثنائية والزمنية في اليونانية، بدل تحويلها في المتن مباشرةً إلى «إلى أن»، مع بيان الصياغة الاصطلاحية في الحاشية.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة المألوفة تحفظ اللقب وقوته الإيحائية، ولا تحوله إلى وصف عام للإنسان.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: يحفظ حرف الجر ἐκ ودلالة الخروج من وسط جماعة الموتى، لا مجرد الانتقال من حالة الموت.
- source_word: ἀναστῇ
  choice: قام
  rationale: الفعل الماضي العربي بعد «متى» يمكن أن يدل على حدث مستقبلي يُنظر إليه بوصفه قد تم عند حلول وقته، وهو مناسب هنا.
theological_decisions:
- issue: ترجمة لقب ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: يحفظ اللقب الذي يستعمله يسوع عن نفسه وما قد يحمله من صدى دانيالي، من غير اختزاله إلى تعبير بشري عام.
- issue: القوة الزمنية لعبارة εἰ μὴ ὅταν
  choice: إلا متى قام ابن الإنسان
  alternative: إلى أن يقوم ابن الإنسان
  rationale: الصياغة المختارة أقرب إلى البنية اليونانية «إلا متى»، بينما تبيّن الحاشية المعنى الزمني العربي الأكثر اصطلاحية من غير حسم زائد لطبيعة التركيب.
- issue: دلالة ἐκ νεκρῶν
  choice: من بين الأموات
  alternative: من الأموات
  rationale: تُبقي الترجمة على صورة قيامه من وسط الموتى، من غير إضافة استنتاج لاهوتي يتجاوز العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يرووا» للحفاظ على معنى سرد ما شوهد، و«إلا متى» لصون بنية الاستثناء الزمنية في الأصل، مع توضيح البديل الاصطلاحي في الحاشية.
