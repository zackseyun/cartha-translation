translation:
  language: ar
  text: حيث دودهم لا يموت، والنار لا تُطفأ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية غير موجودة في أقدم المخطوطات اليونانية، ومنها السينائية والفاتيكانية من القرن الرابع، ولا في الترجمات القبطية المبكرة؛ لكنها موجودة في المخطوطة الإسكندرانية من القرن الخامس، وفي التقليد اللاتيني، وفي أغلبية المخطوطات البيزنطية المتأخرة. ويُرجَّح أنها إضافة ناسخ متأخرة تكرر العبارة نفسها الواردة في الآية 48.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: دود
  rationale: يدل على الدود الذي يقتات بالمادة المتحللة، ويحافظ هذا اللفظ على صورة الاقتباس من إشعياء 66:24 وعلى الصيغة الجمعية الطبيعية في العربية.
- source_word: τελευτᾷ
  choice: يموت
  rationale: الفعل يعني يبلغ نهايته أو يموت؛ ومع كائن حي يكون «يموت» هو التعبير الطبيعي والدقيق.
- source_word: σβέννυται
  choice: تُطفأ
  rationale: مضارع مبني للمجهول بمعنى تُخمَد أو تُطفأ، و«تُطفأ» تعبير عربي واضح ومألوف مع النار ويحفظ دلالة استمرارها.
