lexical_decisions:
- source_word: ὅπου
  choice: حيث
  rationale: أداة مكان موصولة تنقل المعنى مباشرة وبأسلوب عربي طبيعي.
- source_word: ὁ σκώληξ αὐτῶν
  choice: دودهم
  rationale: يحافظ «الدود» على الصورة الحسية وعلى صلتها بإشعياء 66:24، من غير تضييق المعنى إلى نوع محدد من اليرقات؛ والضمير المتصل ينقل دلالة αὐτῶν.
- source_word: οὐ τελευτᾷ
  choice: لا يموت
  rationale: مع «الدود» فالمعنى الطبيعي هو عدم الموت، مع بقاء معنى عدم الانتهاء ممكنًا ومذكورًا في الحاشية.
- source_word: τὸ πῦρ
  choice: النار
  rationale: مقابل مباشر يحافظ على الصورة الأصلية.
- source_word: οὐ σβέννυται
  choice: لا تُطفأ
  rationale: يحافظ على صيغة المبني للمجهول وعلى دلالة النار التي لا يجري إخمادها.
theological_decisions:
- issue: طبيعة صورة الدينونة
  choice: الإبقاء على الصورة الملموسة للدود والنار من غير تفسير عقائدي داخل النص
  alternative: تفسيرها صراحة بأنها عذاب واعٍ مستمر، أو فناء نهائي، أو مجرد صورة مجازية للعار والنجاسة
  rationale: الآية تقدم صورة قوية مرددةً صدى إشعياء 66:24، لكنها لا تحسم وحدها الخلافات الأوسع بشأن طبيعة الدينونة؛ لذلك تُحفظ دلالتها وتوترها من غير إضافة مذهبية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «دودهم» بوصفه اسم جنس جمعيًا طبيعيًا، و«لا تُطفأ» تعبيرًا مباشرًا مألوفًا يحفظ المبني للمجهول.
