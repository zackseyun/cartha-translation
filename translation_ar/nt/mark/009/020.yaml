    rationale: «يتمرّغ» بديل عربي أقرب للحركة على الأرض، مع احتفاظه بالدلالة المستمرة.
  revised_text: فأحضروه إليه. ولما رأته الروح، جعلته يتشنج بعنف في الحال، فسقط على الأرض وأخذ يتدحرج[a] وهو يزبد.
