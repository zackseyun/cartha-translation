    rationale: قد يدل «صرع» في العربية على الطرح أرضًا أو الغلبة، بينما يصف النص اليوناني أن الروح أحدثت في الصبي تشنجًا شديدًا قبل سقوطه. الصياغة المقترحة تحافظ على هذا التمييز.
