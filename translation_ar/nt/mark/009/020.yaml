  to: فأحضروه إليه. ولما رأته الروح، جعلته يتشنج بعنف في الحال، فسقط على الأرض وأخذ يتدحرج[a] وهو يزبد.
  rationale: استُبدلت «صرعته» بعبارة تُظهر بوضوح أن الروح سببت للصبي تشنجًا عنيفًا، وهو المعنى المقصود من συνεσπάραξεν، من غير إضافة تفسيرية. كما عُدّلت الحاشية لتقديم بديل أقرب إلى دلالة ἐκυλίετο.
