source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: ar
  text: فأحضروه إليه. ولما رأته الروح، جعلته يتشنج بعنف في الحال، فسقط على الأرض وأخذ يتدحرج[a] وهو يزبد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ظلّ يتمرّغ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: أحضروه
  rationale: يفيد الفعل هنا نقل الصبي إلى يسوع؛ و«أحضروه» تعبير عربي طبيعي وواضح في السياق السردي.
- source_word: πρὸς αὐτόν
  choice: إليه
  rationale: تفيد πρός مع النصب الحركة نحو شخص، والضمير يعود في السياق إلى يسوع.
- source_word: ἰδὼν αὐτὸν
  choice: لما رأته الروح
  rationale: صيغت العبارة زمنيًا في العربية، مع إبقاء «الروح» فاعل الرؤية كما في اليونانية.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: النص في هذه الآية يقول «الروح» فقط؛ فلا تُضاف هنا صفة «النجسة» ولا يُستبدل بها «الشيطان» رغم وضوح الهوية من السياق الأوسع.
- source_word: εὐθὺς
  choice: في الحال
  rationale: ينقل معنى الفورية بعبارة عربية معاصرة وطبيعية، ويحفظ قوة اللفظة المتكررة في مرقس.
- source_word: συνεσπάραξεν
  choice: صرعته
  rationale: يدل الفعل على إحداث تشنجات شديدة؛ و«صرعته» موجزة وطبيعية في هذا السياق، من غير إيحاء بالتمزيق الحرفي.
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: فسقط على الأرض
  rationale: تحويل اسم الفاعل اليوناني إلى فعل مصروف يوضح بالعربية أن الصبي هو الذي سقط، ويحافظ على تتابع الحدث.
- source_word: ἐκυλίετο
  choice: أخذ يتدحرج
  rationale: ينقل صيغة الماضي الناقص الدالة على حركة مستمرة أو متكررة، ويوافق التدحرج على الأرض.
- source_word: ἀφρίζων
  choice: وهو يزبد
  rationale: يحفظ معنى الحال المصاحبة من غير إضافة «من فمه»، وهي مفهومة من السياق لكنها غير مصرّح بها في اليونانية.
theological_decisions:
- issue: تحديد هوية τὸ πνεῦμα
  choice: الروح
  alternative: الروح النجسة؛ الشيطان
  rationale: يحافظ النص الرئيس على لفظ هذه الآية نفسها، التي تقول «الروح» فحسب، بينما يبيّن السياق الأوسع أنها روح نجسة؛ فلا تُدرج الزيادة التفسيرية في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. روعي وضوح مراجع الضمائر قدر الإمكان دون استبدالها بأسماء غير موجودة في الأصل، واستُعمل «أخذ يتدحرج» لإظهار الاستمرار في صيغة ἐκυλίετο.
