  rationale: يحفظ المعنى المكاني المباشر، والضمير عائد إلى التلاميذ بحسب السياق.
- source_word: γραμματεῖς
  choice: كتبةً
  rationale: المصطلح الإنجيلي المألوف لهذه الفئة من خبراء الشريعة، من غير إدخال شرح تفسيري في المتن.
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: يتجادلون معهم
  rationale: الفعل قد يدل على المناقشة أو المجادلة، لكن سياق المواجهة يرجح المجادلة؛ و«معهم» تنقل توجيه النقاش إلى التلاميذ.
