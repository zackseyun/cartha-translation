  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: ar
  text: وبعد ستة أيام[a]، أخذ يسوع بطرس ويعقوب ويوحنا، وأصعدهم إلى جبل عالٍ على انفراد، وحدهم[b]. وتجلّى أمامهم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبعد ستة أيام من ذلك».'
    reason: lexical_alternative
  - marker: b
    text: تجمع اليونانية بين تعبيري «على انفراد» و«وحدهم»، توكيدًا أن يسوع اصطحب هؤلاء الثلاثة دون غيرهم.
    reason: lexical_alternative
  - marker: c
    text: 'أو: «وتغيّرت هيئته أمامهم».'
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: بعد ستة أيام
  rationale: يحافظ على الصياغة الزمنية اليونانية المباشرة، مع إمكان التعبير العربي البديل «وبعد ستة أيام من ذلك».
- source_word: παραλαμβάνει
  choice: أخذ
  rationale: الفعل مضارع تاريخي في السرد المرقسي، لكن الماضي هو الأسلوب الطبيعي الواضح في السرد العربي، و«أخذ» يدل هنا على اصطحاب التلاميذ المذكورين.
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: صعد بهم إلى جبل عالٍ
  rationale: ينقل حركة الصعود والوجهة بعبارة عربية طبيعية من غير تحديد كيفية المسير بما يتجاوز النص.
- source_word: κατ’ ἰδίαν μόνους
  choice: منفردين وحدهم
  rationale: يحفظ عنصري العبارة اليونانية الدالين على الانفصال والانفراد، مع إبراز أن يسوع اصطحب هؤلاء الثلاثة دون سواهم.
- source_word: μετεμορφώθη
  choice: تجلّى
  rationale: «تجلّى» هو التعبير العربي المألوف لهذا الحدث، ويدل على التغيّر الظاهر أمام التلاميذ من غير تفسير لطبيعته أو آليته؛ و«تغيّرت هيئته» بديل أقرب إلى الدلالة المعجمية المباشرة.
- source_word: ἔμπροσθεν αὐτῶν
  choice: أمامهم
  rationale: تعبير عربي واضح يفيد أن الحدث وقع في حضورهم وعلى مرأى منهم.
theological_decisions:
- issue: دلالة μετεμορφώθη في السياق المتعلق بالمسيح
  choice: تجلّى
  alternative: تغيّرت هيئته أمامهم
  rationale: يحافظ «تجلّى» على الاسم العربي المعروف للحدث وعلى كونه تغيّرًا ظاهرًا كاشفًا، من غير إضافة تفسير عقائدي لا يصرّح به هذا العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الماضي للسرد الطبيعي في العربية بدل محاكاة المضارع التاريخي اليوناني، وحُفظ توكيد الانفراد في κατ’ ἰδίαν μόνους، مع تقديم البديل المعجمي لـμετεμορφώθη في الحاشية.
