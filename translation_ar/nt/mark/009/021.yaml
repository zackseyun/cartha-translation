source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: ar
  text: 'فسأل أباه: «منذ متى يحدث له هذا؟» فقال: «منذ طفولته».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من الطفولة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: فسأل
  rationale: فعل ماضٍ يقدّم سؤالًا مباشرًا، و«سأل» هو التعبير العربي الطبيعي بلا إضافة معنى الاستجواب أو الإلحاح.
- source_word: τὸν πατέρα αὐτοῦ
  choice: أباه
  rationale: الضمير يعود في السياق عودة طبيعية إلى الصبي المصاب، و«أباه» موجزة وفصيحة وتحافظ على صيغة الأصل دون توضيح تفسيري زائد.
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: منذ متى
  rationale: هذا تركيب اصطلاحي يسأل عن المدة الممتدة من نقطة بداية إلى الحاضر، و«منذ متى» تؤدي معناه بوضوح في العربية المعاصرة.
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: يحدث له هذا
  rationale: صيغة التام من γίνομαι تشير هنا إلى حالة بدأت سابقًا وما زالت قائمة؛ والمضارع العربي بعد «منذ متى» ينقل الاستمرار طبيعيًا.
- source_word: ὁ δὲ εἶπεν
  choice: فقال
  rationale: δέ هنا للانتقال السردي البسيط، والفاء تصل السؤال بجوابه بسلاسة من غير مبالغة في معنى الاستدراك.
- source_word: Ἐκ παιδιόθεν
  choice: منذ طفولته
  rationale: يفيد التعبير الابتداء من عهد الطفولة. وهذه الصياغة طبيعية وتوضح أن المقصود طفولة الصبي، مع إمكان ترجمتها حرفيًا «من الطفولة».
