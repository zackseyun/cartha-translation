base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: ar
  text: 'فجلس، ودعا الاثني عشر، وقال لهم: «إن أراد أحد أن يكون الأول، فسيكون آخر الجميع وخادم الجميع».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: فجلس
  rationale: تنقل اسم الفاعل الظرفي اليوناني بفعل عربي طبيعي، مع إبقاء دلالة جلوس يسوع قبل التعليم.
- source_word: ἐφώνησεν
  choice: دعا
  rationale: تفيد هنا استدعاء الاثني عشر إليه، و«دعا» واضحة وطبيعية في السياق.
- source_word: λέγει
  choice: وقال
  rationale: المضارع التاريخي اليوناني يؤدي وظيفة سردية؛ والماضي هو الأسلوب العربي الطبيعي المتسق مع الفعل السابق، من غير تغيير في مضمون القول.
- source_word: πρῶτος
  choice: أولًا
  rationale: تحافظ على معنى طلب المرتبة الأولى.
- source_word: ἔσχατος
  choice: آخر
  rationale: تنقل المقابلة المباشرة مع «أولًا» بوضوح.
- source_word: διάκονος
  choice: خادم
  rationale: تعني من يخدم غيره في هذا السياق، ولا تستلزم هنا نقلها كلقب كنسي تقني.
theological_decisions:
- issue: صيغة ἔσται في جواب الشرط
  choice: فليكن آخر الجميع وخادم الجميع
  alternative: فسيكون آخر الجميع وخادم الجميع
  rationale: السياق التعليمي يجعل العبارة توجيهًا إلى طريق العظمة الحقيقية، بينما الصيغة اليونانية خبرية حرفيًا ويمكن فهمها كنتيجة أو مطلب. اختيرت صيغة الأمر العربية الطبيعية مع بقاء البديل الحرفي ممكنًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع مقابلة إيقاعية بين «أولًا» و«آخر الجميع»، وتكرار «الجميع» كما في الأصل.
