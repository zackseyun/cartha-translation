  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: ar
  text: لِأَنَّهُ لَمْ يَكُنْ يَعْرِفُ بِمَاذَا يُجِيبُ، لِأَنَّهُمْ صَارُوا مُرْتَعِبِينَ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة: «لأنهم كانوا مرتعبين»؛ أمّا النص اليوناني فيقول حرفيًا: «صاروا مرتعبين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: لم يكن يعرف
  rationale: يفيد οἶδα المعرفة أو الدراية، وصيغة «لم يكن يعرف» عربية واضحة تلائم الموقف دون أن تحوّل المعنى إلى عدم الفهم.
- source_word: τί ἀποκριθῇ
  choice: بماذا يجيب
  rationale: يحافظ الفعل «يجيب» على معنى ἀποκρίνομαι بوصفه جوابًا أو ردًّا، وتؤدي «بماذا» معنى الاستفهام التداولي في هذا التركيب.
- source_word: ἔκφοβοι
  choice: مرتعبين
  rationale: تنقل «مرتعبين» شدة الخوف التي يدل عليها ἔκφοβοι، وهي أقوى من «خائفين».
- source_word: ἐγένοντο
  choice: صاروا
  rationale: تعكس «صاروا» معنى الانتقال إلى حالة الذي يحمله γίνομαι، بدل تسوية العبارة إلى مجرد «كانوا».
- source_word: γὰρ ... γὰρ
  choice: لأنه ... لأنهم
  rationale: يحافظ تكرار «لأن» على البنية التفسيرية المكررة في اليونانية، مع ضبط الضمير بحسب فاعل كل جملة.
theological_decisions:
- issue: مرجع الفاعل الجمع في العبارة الأخيرة
  choice: لأنهم صاروا مرتعبين
  alternative: لأنه صار مرتعبًا
  rationale: الصفة ἔκφοβοι والفعل ἐγένοντο كلاهما بصيغة الجمع، ولذلك تُحفظ الإشارة إلى بطرس ورفيقيه ولا تُحوَّل إلى بطرس وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «بماذا يجيب» بدل تركيب أكثر حرفية وأثقل، وحُفظ تكرار أداة التعليل وقوة فعل الصيرورة. وُضع مؤشر الحاشية [a] بعد العبارة التي يشرحها.
