lexical_decisions:
- source_word: οἱ δὲ
  choice: أما هم
  rationale: تُظهر «أما» الانتقال مع مقابلة خفيفة بين قول يسوع السابق وعدم فهم التلاميذ، والضمير المستتر في اليونانية يُعبَّر عنه طبيعيًا بـ«هم».
- source_word: ἠγνόουν
  choice: فلم يفهموا
  rationale: الفعل هنا يدل على عدم إدراك معنى ما قيل. وصيغة الماضي العربية تنقل الحالة الماضية بوضوح من غير تكلّف في تمثيل الاستمرار الذي تفيده صيغة الناقص اليونانية.
- source_word: τὸ ῥῆμα
  choice: ذلك القول
  rationale: يشير ῥῆμα إلى الكلام الذي نطق به يسوع للتو. و«القول» عربية طبيعية وتحافظ على كونه كلامًا منطوقًا، مع إبقاء البديل «الكلام» في الحاشية.
- source_word: ἐφοβοῦντο
  choice: وكانوا يخافون
  rationale: يحافظ التركيب على دلالة الحالة المستمرة في الماضي التي تفيدها صيغة الناقص اليونانية.
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير المفعول يعود مباشرة إلى يسوع.
- source_word: ἐπερωτῆσαι
  choice: أن يسألوه
  rationale: «يسأل» هو المقابل العربي الطبيعي للفعل في هذا السياق، ويؤدي معنى الاستفهام منه عن القول.
