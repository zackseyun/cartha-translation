translation:
  language: ar
  text: أما هم فلم يفهموا ذلك القول[a]، وكانوا يخافون أن يسألوه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذلك الكلام». يمكن للكلمة اليونانية ῥῆμα أن تشير إلى كلمة منطوقة أو قول أو كلام.'
