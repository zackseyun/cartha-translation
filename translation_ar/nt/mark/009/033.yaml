  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: ar
  text: 'وجاءوا إلى كفرناحوم. ولما كان في البيت، كان يسألهم: «فيمَ كنتم تتناقشون في الطريق؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «تتجادلون في الطريق؟». قد يدل الفعل على المناقشة أو المباحثة أو الجدال؛ وتبيّن الآية التالية أن الموضوع كان مَن منهم هو الأعظم.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: جاءوا
  rationale: ينقل فعل المجيء بصيغة الجمع والسرد الماضي، مع دلالة الوصول إلى كفرناحوم من السياق.
- source_word: Καφαρναούμ
  choice: كفرناحوم
  rationale: النقل العربي الشائع والمستقر لاسم الموضع.
- source_word: ἐν τῇ οἰκίᾳ
  choice: في البيت
  rationale: يحافظ على المكان الملموس وعلى أداة التعريف، من غير افتراض أن المقصود بيته الخاص.
- source_word: γενόμενος
  choice: لما صار
  rationale: يؤدي الوظيفة الزمنية لاسم الفاعل ويحافظ على معنى الوجود في البيت من غير إضافة فعل دخول غير مصرح به.
- source_word: ἐπηρώτα
  choice: كان يسألهم
  rationale: يحافظ على دلالة الماضي الناقص التي قد تفيد الاستمرار أو التكرار، مع عربية طبيعية.
- source_word: Τί
  choice: فيمَ
  rationale: صياغة عربية موجزة وطبيعية للسؤال عن موضوع النقاش.
- source_word: ἐν τῇ ὁδῷ
  choice: في الطريق
  rationale: المقابل العربي الاصطلاحي الطبيعي في سياق السفر.
- source_word: διελογίζεσθε
  choice: كنتم تتناقشون
  rationale: يحفظ سعة الفعل بين المناقشة والمجادلة، ولا يفرض منذ هذه الآية وحدها نبرة الخصام.
theological_decisions:
- issue: تحول الفاعل من الجمع في ἦλθον إلى المفرد في γενόμενος وἐπηρώτα
  choice: إبقاء الوصول بصيغة الجمع، ثم إسناد الوجود في البيت والسؤال إلى يسوع المفهوم من السياق
  alternative: 'التصريح بالفاعل: «ولما صار يسوع في البيت، سألهم»'
  rationale: اليونانية تنتقل طبيعيًا من الجماعة إلى فاعل مفرد مفهوم سياقيًا. تحافظ الصياغة المختارة على هذا الانتقال دون إضافة الاسم إلى النص.
- issue: حدة معنى διελογίζεσθε
  choice: تتناقشون
  alternative: تتجادلون
  rationale: الفعل قد يدل على المناقشة أو المباحثة أو الجدال، والآية التالية تكشف موضوع التنازع؛ لذلك تُحفظ هنا السعة الدلالية مع بيان البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «لما صار في البيت» للمحافظة على بنية الأصل من غير تفسيرها بـ«دخل»، و«كان يسألهم» لإظهار جانب الماضي الناقص.
