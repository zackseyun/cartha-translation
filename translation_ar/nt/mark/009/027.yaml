  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς κρατήσας ⸂τῆς χειρὸς αὐτοῦ⸃ ἤγειρεν αὐτόν, καὶ ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: ar
  text: أما يسوع فأمسك بيده وأنهضه[a]، فنهض[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أقامه»؛ فالفعل اليوناني يُستعمل كذلك في سياقات الإيقاظ من النوم أو الإقامة من الموت.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «فقام» أو «فوقف».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: أما ... فـ
  rationale: تفيد انتقالًا سرديًا مع مقابلة لطيفة بين ظن الجمع أن الصبي مات وبين فعل يسوع، وهي صياغة عربية طبيعية.
- source_word: κρατήσας
  choice: أمسك
  rationale: ينقل فعل الإمساك الجسدي الملموس من غير إيحاء بالعنف.
- source_word: τῆς χειρὸς αὐτοῦ
  choice: بيده
  rationale: يحافظ على ذكر اليد تحديدًا، وتأتي العبارة طبيعية مع «أمسك» في العربية.
- source_word: ἤγειρεν
  choice: أنهضه
  rationale: يدل على أن يسوع جعله يقوم من موضعه، ويحافظ بقدر الإمكان على الصلة اللفظية بألفاظ النهوض دون الجزم بأن المقصود إقامة من الموت.
- source_word: ἀνέστη
  choice: نهض
  rationale: 'يصف النتيجة بوضوح: قام الصبي بعد أن أنهضه يسوع، وهو تعبير عربي حديث ورصين.'
theological_decisions:
- issue: احتمال صدى لغة القيامة في ἤγειρεν وἀνέστη
  choice: أنهضه، فنهض
  alternative: أقامه، فقام؛ أو ساعده على الوقوف، فوقف
  rationale: تجعل الصياغة المعنى الجسدي العادي هو الأبرز بحسب السياق، لكنها لا تحصر الفعل في مجرد المساعدة ولا تفرض أن الحدث إقامة من الموت. كما تحافظ على تقارب الفعلين في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل تركيب «أما يسوع فـ» لنقل المقابلة الخفيفة، وحُفظ تتابع الفعلين المتقاربين «أنهضه، فنهض» بما يعكس بنية الأصل ويحفظ احتمال الصدى اللاهوتي دون المبالغة فيه.
