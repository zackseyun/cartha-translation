  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: ar
  text: 'وبعد أن صرخ وأوقعه في تشنجات شديدة[a]، خرج منه. وصار كالميت، حتى إن كثيرين كانوا يقولون[b]: «لقد مات»[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبعد أن أدخله في تشنجات عنيفة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حتى إن معظمهم كانوا يقولون».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «إنه ميت».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: بعد أن صرخ
  rationale: اسم الفاعل الماضي يدل هنا على فعل سبق الفعل الرئيس، و«صرخ» يحفظ المعنى من غير تحديد نبرة الصرخة بما لا يصرح به النص.
- source_word: πολλὰ σπαράξας
  choice: وأوقعه في تشنجات شديدة
  rationale: الفعل في سياق إخراج الروح يدل على إحداث تشنجات، وπολλὰ مستعملة للتكثيف؛ وهذه الصياغة عربية طبيعية توضح أن الغلام هو المتأثر بالفعل.
- source_word: ἐξῆλθεν
  choice: خرج منه
  rationale: الفاعل المفهوم من السياق هو الروح، وإضافة «منه» توضح بالعربية خروجه من الغلام من غير تغيير المعنى.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: فصار كالميت
  rationale: تحفظ أداة التشبيه ὡσεὶ، فلا تجعل موت الغلام تقريرًا من الراوي.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: حتى إن كثيرين أخذوا يقولون
  rationale: «كثيرين» ترجمة حذرة لـτοὺς πολλούς من غير الجزم بأنهم الأكثرية، و«أخذوا يقولون» تنقل امتداد القول الذي يشير إليه المضارع.
- source_word: ὅτι ἀπέθανεν
  choice: «لقد مات»
  rationale: ينقل الماضي اليوناني بوصفه استنتاج الحاضرين أن الموت وقع، مع إبقائه قولًا منسوبًا إليهم لا تقريرًا من الراوي.
theological_decisions:
- issue: هل مات الغلام فعلًا أم بدا ميتًا؟
  choice: يقرر الراوي أنه صار كالميت، ثم ينقل استنتاج كثيرين أنه مات.
  alternative: التصريح بأنه مات فعلًا، أو الجزم بأنه لم يمت وإنما بدا كذلك فقط.
  rationale: التشبيه ὡσεὶ وقول الحاضرين يحفظان التمييز بين وصف الراوي وانطباع الجمهور، ولذلك لا تفرض الترجمة موتًا فعليًا ولا تنفيه صراحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «تشنجات شديدة» بدل ترجمة حرفية توحي بالتمزيق الجسدي، وحُفظ التشبيه في «كالميت» والقول المنسوب إلى الحاضرين دون حسم زائد.
