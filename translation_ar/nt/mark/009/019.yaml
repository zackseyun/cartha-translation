reference: Mark 9:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: ar
  text: 'فيجيبهم قائلًا: «أيها الجيل غير المؤمن[a]، إلى متى أكون معكم؟ وإلى متى أحتملكم[b]؟ أحضروه إليّ»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عديم الإيمان» أو «غير الأمين». يمكن للكلمة اليونانية أن تدل على غياب الإيمان أو على عدم الأمانة.
    reason: lexical_alternative
  - marker: b
    text: أو «أصبر عليكم» أو «أطيقكم».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: فيجيبهم قائلًا
  rationale: يحافظ على صيغة الاستجابة وعلى المضارع التاريخي الذي يضفي حيوية على سرد مرقس، بصياغة عربية طبيعية.
- source_word: γενεὰ ἄπιστος
  choice: الجيل غير المؤمن
  rationale: ينقل المعنى الأبرز في السياق، وهو انعدام الإيمان أو الثقة، مع إبقاء معنى عدم الأمانة احتمالًا في الحاشية.
- source_word: ἕως πότε
  choice: إلى متى
  rationale: هو المقابل العربي الطبيعي والدقيق للسؤال الزمني المتكرر.
- source_word: πρὸς ὑμᾶς ἔσομαι
  choice: أكون معكم
  rationale: ينقل معنى استمرار الحضور بينهم من غير زيادة تفسيرية.
- source_word: ἀνέξομαι ὑμῶν
  choice: أحتملكم
  rationale: يحفظ نبرة الضيق وقوة معنى الاحتمال، مع بديل عربي موضح في الحاشية.
- source_word: φέρετε αὐτὸν πρός με
  choice: أحضروه إليّ
  rationale: صيغة أمر عربية واضحة وطبيعية تنقل طلب إحضار الصبي إلى يسوع.
theological_decisions:
- issue: دلالة ἄπιστος في توبيخ يسوع
  choice: غير المؤمن
  alternative: غير الأمين / عديم الإيمان
  rationale: يركز السياق على غياب الإيمان والثقة، لكن اللفظة اليونانية قد تحمل أيضًا معنى عدم الأمانة؛ لذلك لم يُلغَ هذا الاحتمال بل ذُكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم المضارع التاريخي لمحاكاة حيوية أسلوب مرقس، ووُضعت علامتا الحاشيتين في موضعي اللفظتين اللتين تتعلقان بهما.
