  source_fidelity: 'الترجمة أمينة للنص اليوناني: «وجاءت» تنقل الطابع الحدثي لـἐγένετο، و«سحابة» لـνεφέλη، و«تغشاهم» تنقل بصورة عربية طبيعية معنى ἐπισκιάζουσα، و«صوت من السحابة» يحافظ على البنية من غير إضافة فعل كلام غير مذكور. كما أن «هذا هو ابني الحبيب» و«فاستمعوا إليه» ينقلان الإعلان والأمر نقلاً دقيقًا.'
  naturalness: الصياغة فصيحة حديثة واضحة ومناسبة للسرد الكتابي. الربط بالفاء في «فاستمعوا إليه» طبيعي في العربية ويُبرز انتقال الإعلان إلى الأمر دون زيادة في المعنى.
  terminology: «ابني الحبيب» تعبير عربي كتابي راسخ يلائم ὁ υἱός μου ὁ ἀγαπητός. و«استمعوا إليه» أدق من حصر الأمر في الطاعة، مع المحافظة على دلالة الإصغاء المعتدّ بالكلام. الحاشية تقدم البديل «اسمعوا له» وتشرح القوة التداولية للأمر باعتدال.
