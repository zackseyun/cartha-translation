source:
  edition: SBLGNT
  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: ar
  text: 'وجاءت سحابة تغشاهم، وجاء صوت من السحابة: «هذا هو ابني الحبيب؛ فاستمعوا إليه[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «اسمعوا له». فالأمر يفيد الإصغاء باهتمام والأخذ بما يقوله، لا مجرد سماع الصوت.'
    reason: بديل معجمي يوضح قوة الأمر ἀκούετε من غير تحويله صراحة إلى فعل بمعنى الطاعة.
lexical_decisions:
- source_word: ἐγένετο
  choice: جاءت / جاء
  rationale: يفيد الفعل هنا حدوث السحابة ثم صدور الصوت على نحو مفاجئ. وتحافظ «جاءت/جاء» على حركة العبارة من غير إضافة تفسيرية.
- source_word: νεφέλη
  choice: سحابة
  rationale: المعنى المعجمي المباشر، مع إبقاء دلالة الحضور الإلهي للسياق دون إدخالها في الترجمة نفسها.
- source_word: ἐπισκιάζουσα
  choice: تغشاهم
  rationale: تعبير عربي طبيعي يدل على أن السحابة غطتهم وأحاطت بهم، ويحفظ صورة التظليل من غير صياغة خشبية.
- source_word: φωνή
  choice: صوت
  rationale: يشير السياق إلى صوت ناطق، ولا يضيف الأصل فعلًا مستقلًا بمعنى «تكلم».
- source_word: ἐκ τῆς νεφέλης
  choice: من السحابة
  rationale: ينقل مصدر الصوت بوضوح وطبيعية في العربية؛ ولا تستلزم العربية هنا ترجمة ἐκ بعبارة أطول مثل «من داخل».
- source_word: ὁ υἱός μου
  choice: ابني
  rationale: ترجمة مباشرة تحفظ علاقة البنوة في الإعلان الإلهي دون شرح عقائدي زائد.
- source_word: ὁ ἀγαπητός
  choice: الحبيب
  rationale: يحفظ معنى المحبوب عزيز المكانة بصياغة موجزة ومألوفة في العربية الكتابية المعاصرة.
- source_word: ἀκούετε αὐτοῦ
  choice: استمعوا إليه
  rationale: ينقل الأمر بالإصغاء الواعي والأخذ بالكلام، من غير حصر المعنى في مجرد السماع أو توسيعه صراحة إلى «أطيعوه».
theological_decisions:
- issue: إعلان هوية يسوع بوصفه ابن الله
  choice: «هذا هو ابني الحبيب»
  alternative: «هذا هو ابني، المحبوب»
  rationale: يحفظ الإعلان السماوي المباشر وقوته المسيحانية، من غير إضافة تفسير عقائدي يتجاوز النص.
- issue: مدى دلالة ἀκούετε αὐτοῦ
  choice: «استمعوا إليه»
  alternative: «اسمعوا له» أو «أطيعوه»
  rationale: الأمر يتضمن الإصغاء والاعتداد بما يقوله، لكن الأصل لا يستخدم فعلًا صريحًا معناه «أطاع»، لذلك أبقت الصياغة مجال الدلالة دون تضييق أو مبالغة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «تغشاهم» لأنها طبيعية ودقيقة في وصف سحابة تغطي الحاضرين، ووضعت علامة الحاشية بعد العبارة التي تشرحها.
