  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: ar
  text: 'فصرخ أبو الطفل في الحال وقال: «أؤمن؛ فأعِنْ عدم إيماني[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أؤمن؛ فأعِنْ نقص إيماني!» قد تدل الكلمة اليونانية ἀπιστία على عدم الإيمان أو نقص الإيمان.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: في الحال
  rationale: ينقل فورية استجابة الأب وإيقاع مرقس العاجل بعبارة عربية فصيحة وطبيعية.
- source_word: κράξας
  choice: صرخ
  rationale: يحفظ قوة الصوت وشدة الانفعال في اسم الفاعل اليوناني من غير مبالغة تفسيرية.
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: أبو الصبي
  rationale: السياق السابق يحدد الطفل بوصفه ابن الرجل، و«الصبي» ترجمة طبيعية لـπαιδίον هنا، مع صوغ الإضافة بأسلوب عربي مألوف.
- source_word: ἔλεγεν
  choice: وقال
  rationale: يؤدي وظيفة الفعل الناقص في تقديم الكلام المباشر بصياغة عربية طبيعية، بينما تنقل «صرخ» حيوية المشهد.
- source_word: Πιστεύω
  choice: أؤمن
  rationale: يقابل الفعل اليوناني مباشرة ويحافظ على صلته بموضوع الإيمان في السياق.
- source_word: βοήθει
  choice: أعِنْ
  rationale: صيغة أمر موجزة وعاجلة تطابق التماس المعونة في الأصل.
- source_word: μου τῇ ἀπιστίᾳ
  choice: عدم إيماني
  rationale: يحافظ على المفارقة المباشرة بين الإيمان وغيابه أو نقصه، ولا يحول العبارة إلى وصف للخيانة أو عدم الأمانة.
theological_decisions:
- issue: التوتر بين Πιστεύω وἀπιστίᾳ
  choice: «أؤمن؛ فأعِنْ عدم إيماني!»
  alternative: «أؤمن؛ فأعِنْ ضعف إيماني!»
  rationale: تبقي الصياغة المختارة المفارقة اللاهوتية والنفسية ظاهرة كما في اليونانية، بدل أن تحسمها بتحويل عدم الإيمان إلى مجرد ضعف في الإيمان.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «في الحال» لإبراز العجلة، و«أبو الصبي» لطبيعية التعبير، وحُفظت المفارقة المقصودة في توسّل الأب من غير تسويتها تفسيريا.
