source:
  edition: SBLGNT
  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: ar
  text: وصارت ثيابه لامعة، بيضاء جدًا، إلى درجة لا يستطيع معها أيُّ قصّارٍ على الأرض أن يبيّضها كذلك.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: القصّار هو من ينظّف القماش ويبيّضه.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάτια
  choice: ثيابه
  rationale: لفظ عام للملابس، و«ثيابه» طبيعي وواضح في السياق من غير تخصيصها بأردية.
- source_word: ἐγένετο
  choice: صارت
  rationale: يدل الفعل هنا على التحول إلى حالة جديدة في مشهد التجلي.
- source_word: στίλβοντα
  choice: تتلألأ
  rationale: ينقل معنى اللمعان والبريق المرئي من غير إضافة تفسير لاهوتي.
- source_word: λευκὰ λίαν
  choice: شديدة البياض
  rationale: تعبير عربي طبيعي يحفظ قوة λίαν في وصف البياض.
- source_word: γναφεύς
  choice: قصّار
  rationale: هو صاحب حرفة تنظيف القماش وتبييضه؛ وهو المقابل العربي الدقيق تاريخيًا، مع إيضاحه في الحاشية.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: ترجمة مباشرة تحفظ نطاق المقارنة بقدرة البشر الأرضية.
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: لا يستطيع ... أن يبيّض مثل ذلك
  rationale: يحفظ معنى العجز ودرجة التبييض المشار إليها بـοὕτως، مع صياغة عربية سليمة من دون فرض مفعول صريح غير مذكور في اليونانية.
theological_decisions:
- issue: وصف الأثر المرئي للتجلي
  choice: وصف الثياب بأنها تتلألأ وشديدة البياض من غير إضافة تفسير عقائدي
  alternative: إضافة عبارة تفسيرية مثل «تشع بالمجد»
  rationale: النص يصف المظهر المرئي للثياب ولا يصرّح هنا بتفسيره اللاهوتي؛ لذلك تُترك دلالته للسياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «قصّار» لدقته التاريخية، وأُرفق بشرح موجز لأنه غير مألوف لبعض القراء.
