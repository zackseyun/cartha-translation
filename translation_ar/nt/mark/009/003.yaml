review_pass:
  verdict: revise
  source_fidelity: يُحسن النص نقل التحول واللمعان والبياض الشديد، لكن «حتى» تجعل العبارة التالية أقرب إلى نتيجةٍ للبياض، بينما اليونانية تُنشئ مقارنة في الدرجة/النوع (οἷα ... οὕτως). كما أن «مثل ذلك» لا يبيّن بوضوح أن المقصود هو تبييض الثياب على هذا النحو.
  naturalness: الصياغة فصيحة عمومًا، لكن «إلى درجة لا يستطيع معها...» أصرح وأطبع في العربية المعاصرة في نقل المقارنة المقصودة. و«لامعة» تؤدي الوصف الخبري لـστίλβοντα بسلاسة من غير الإيحاء الابتدائي الذي قد تحمله «تتلألأ» بعد «صارت».
  terminology: «ثيابه» و«قصّار» دقيقان. والحاشية مفيدة لأن «قصّار» مصطلح حرفي قديم نسبيًا؛ ويكفي شرح وظيفته من دون توسيع تاريخي.
