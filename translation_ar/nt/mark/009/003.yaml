- from: وصارت ثيابه تتلألأ، شديدة البياض، حتى لا يستطيع أيُّ قصّارٍ على الأرض أن يبيّض مثل ذلك.[a]
  to: وصارت ثيابه لامعة، بيضاء جدًا، إلى درجة لا يستطيع معها أيُّ قصّارٍ على الأرض أن يبيّضها كذلك.[a]
  rationale: يستبدل التعديل رابط النتيجة الظاهري برابط يعبّر عن المقارنة في الدرجة التي تفيدها οἷα وοὕτως، ويوضح مفعول فعل «يبيّض» المستفاد من السياق. ويحافظ على الوصف غير التفسيري لمشهد التجلي وعلى المصطلح الحرفي الدقيق مع حاشية موجزة.
