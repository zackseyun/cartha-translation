base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: ar
  text: 'ولما رأى يسوع أن جمعًا كان يتقاطر بسرعة[a]، انتهر الروح النجس وقال له: «أيها الروح الأبكم والأصم، أنا آمرك: اخرج منه، ولا تدخل فيه بعد الآن».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن جمعًا كان يركض مجتمعًا». يدل الفعل اليوناني على أناس يتوافدون أو يتجمعون بسرعة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: لكن لما رأى يسوع
  rationale: اسم الفاعل الماضي يبيّن الظرف السابق للفعل الرئيس، وδέ أداة انتقال خفيفة؛ فتنقلها «لكن لما» بسلاسة مع الحفاظ على التتابع الزمني.
- source_word: ἐπισυντρέχει ὄχλος
  choice: أن جمعًا يتقاطر مسرعًا
  rationale: الفعل يدل على تقارب الناس واجتماعهم بسرعة من جهات مختلفة، وصيغة المضارع في السياق تصوّر الحدث وهو جارٍ.
- source_word: ἐπετίμησεν
  choice: انتهر
  rationale: «انتهر» تعكس التوبيخ الآمر ذي السلطان، وتحافظ على اللفظ الإنجيلي المألوف في مخاطبة الأرواح.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: الروح النجس
  rationale: «النجس» يحفظ دلالات ἀκάθαρτος الدينية والأخلاقية، ولا يستبدل فئة النص بتفسير عام مثل «الشرير».
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: أيها الروح الأبكم والأصم
  rationale: النكرة المعرفة في حالة الرفع تؤدي وظيفة النداء؛ و«الأبكم والأصم» تحفظ الصفتين المتميزتين في اليونانية.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: أنا آمرك
  rationale: إظهار الضمير «أنا» يحفظ توكيد ἐγώ الصريح، و«آمرك» تنقل سلطان ἐπιτάσσω مباشرة.
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: اخرج منه
  rationale: صياغة عربية مباشرة وطبيعية تحفظ قوة الأمر ولغة إخراج الروح.
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: ولا تدخله بعد الآن
  rationale: تنقل μηκέτι بوصفه منعًا من تكرار الدخول مستقبلًا، من غير إضافة تفسير إلى النص.
theological_decisions:
- issue: مصطلح الروح النجس وسلطان يسوع عليه
  choice: الإبقاء على «الروح النجس» واستعمال «انتهر» و«أنا آمرك»
  alternative: «الروح الشرير» أو «الروح غير الطاهر»، مع تعبير أخف مثل «خاطبه بشدة»
  rationale: يعرض النص كائنًا روحيًا شخصيًا يخاطبه يسوع مباشرة ويأمره بسلطان. وتحفظ الصياغة فئة النص وقوة الأمر من غير اختزالها إلى وصف مرضي أو إضافة تعليم عقائدي غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «يتقاطر مسرعًا» لنقل صورة التقارب السريع بصورة طبيعية، مع توثيق البديل الأكثر حرفية في الحاشية.
