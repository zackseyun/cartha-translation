base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: ar
  text: 'فأجاب بطرس وقال ليسوع: «يا معلّم، حسنٌ أن نكون هنا. فلنصنع ثلاث مظالّ[a]: واحدةً لك، وواحدةً لموسى، وواحدةً لإيليا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خيامًا» أو «أكواخًا». تشير الكلمة اليونانية إلى ملاجئ مؤقتة، وقد تحمل إيحاءات بالخيام أو المظال، لكن العدد لا يصرّح بهذه الإيحاءات.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: فأجاب
  rationale: يحافظ على الصيغة السردية المألوفة في اليونانية، مع أن الكلام لا يسبقه سؤال صريح.
- source_word: λέγει
  choice: وقال
  rationale: جاء الفعل في الأصل بالمضارع التاريخي، لكن الماضي أنسب للسرد العربي الطبيعي، مع بقاء المعنى.
- source_word: Ῥαββί
  choice: يا معلّم
  rationale: ينقل معنى لقب المخاطبة السامي بعبارة عربية واضحة ومحترمة، من غير معاملته كاسم شخصي.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: حسنٌ أن نكون هنا
  rationale: يحافظ على التقييم البسيط والبناء غير الشخصي، ويتجنب توسيعه إلى معنى مثل «رائع» أو «صواب».
- source_word: ποιήσωμεν
  choice: فلنصنع
  rationale: ينقل صيغة الحث في المتكلم الجمع، ويلتزم بالمعنى الأساسي للفعل دون تخصيصه بالبناء.
- source_word: σκηνάς
  choice: مظالّ
  rationale: لفظ عربي واضح يدل على منشآت مؤقتة للستر، ولا يفرض وحده دلالة طقسية أو لاهوتية محددة.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: واحدةً لك، وواحدةً لموسى، وواحدةً لإيليا
  rationale: يحفظ التكرار التوزيعي والبنية المتوازية في النص اليوناني.
theological_decisions:
- issue: الإيحاءات الطقسية أو العيدية المحتملة للفظ σκηνάς
  choice: استخدام «مظالّ» في المتن
  alternative: خيام؛ أكواخ؛ مساكن مؤقتة
  rationale: لا يصرّح العدد بأن المقصود عيد المظال أو خيمة العبادة؛ لذلك اختير لفظ واضح غير تقني، مع حفظ البدائل الدلالية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «يا معلّم» بوصفه المقابل الطبيعي للقب Ῥαββί، وحُفظ إيقاع التعداد والتكرار في خاتمة الآية.
