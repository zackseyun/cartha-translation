  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: ar
  text: وظهر لهم إيليا مع موسى، وكانا يتحدثان مع يسوع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: ظهر
  rationale: فعل ماضٍ مبني للمجهول من ὁράω يُستعمل هنا بمعنى «ظهر» أو «شُوهد». واختيار «ظهر» طبيعي في العربية ويناسب سياق التجلي.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ضمير في حالة المجرور الدالة على الأشخاص الذين ظهر لهم إيليا؛ و«لهم» نقل مباشر ومألوف.
- source_word: Ἠλίας
  choice: إيليا
  rationale: الصيغة العربية الكتابية المألوفة للاسم.
- source_word: σὺν
  choice: مع
  rationale: تنقل معنى المصاحبة بوضوح ومن غير إثقال.
- source_word: Μωϋσεῖ
  choice: موسى
  rationale: الصيغة العربية المألوفة للاسم.
- source_word: συλλαλοῦντες
  choice: يتحدثان
  rationale: الفعل يدل على الكلام المتبادل أو التحادث. وصيغة المثنى تعبّر طبيعيًا عن إيليا وموسى بوصفهما المتحدثين مع يسوع.
- source_word: τῷ Ἰησοῦ
  choice: مع يسوع
  rationale: مع أن الاسم في اليونانية في حالة المجرور، فإن الفعل المركب συλλαλέω يفيد التحادث المتبادل؛ لذلك تنقل «مع يسوع» المعنى المقصود بوضوح.
theological_decisions:
- issue: هوية إيليا وموسى وحقيقة ظهورهما في مشهد التجلي
  choice: صياغة الخبر مباشرةً بوصفه ظهور إيليا مع موسى وحديثهما مع يسوع، بلا تقييد تفسيري.
  alternative: اعتبار الظهور رؤيا ذاتية فقط أو تمثيلًا رمزيًا لا ظهورًا شخصيًا.
  rationale: يعرض النص اليوناني إيليا وموسى بوصفهما ظاهرين ومتحدثين مع يسوع؛ فلا ينبغي للترجمة أن تضعف هذا العرض أو تضيف إليه تفسيرًا عقائديًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم المثنى «كانا يتحدثان» لأن الفاعلين هما إيليا وموسى، مع الحفاظ على بساطة السرد.
