source:
  edition: SBLGNT
  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: ar
  text: 'ولمّا دخل البيت، كان تلاميذه يسألونه على انفراد: «لماذا لم نقدر نحن أن نطرده[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يعود الضمير على الأرجح إلى الروح النجس. ويجوز أن يُفهم على أنه عائد إلى الصبي؛ فالضمير في اليونانية محايد، مما يرجّح الإشارة إلى الروح، لأن كلمة «روح» في اليونانية محايدة.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: ولمّا دخل
  rationale: اسم الفاعل الأوريستي في تركيب المضاف إليه المطلق يقدّم خلفية زمنية سابقة للفعل الرئيس؛ و«لمّا دخل» تنقل هذا المعنى بطبيعية ووضوح.
- source_word: εἰς οἶκον
  choice: البيت
  rationale: مع أن الاسم اليوناني غير معرّف بأداة، فالسياق القصصي يشير إلى مكان معلوم، واستعمال «البيت» هو الأفصح والأطبع هنا.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: «التلاميذ» هو المقابل العربي الراسخ والدقيق في سياق الأناجيل، ويحفظ معنى التعلّم والتبعية.
- source_word: κατ’ ἰδίαν
  choice: على انفراد
  rationale: ينقل معنى ابتعادهم عن الآخرين وحديثهم الخاص معه بصياغة عربية طبيعية.
- source_word: ἐπηρώτων
  choice: كانوا يسألونه
  rationale: يحفظ دلالة الماضي الناقص على الفعل الجاري أو المتكرر من غير مبالغة في تحديد التكرار.
- source_word: Ὅτι
  choice: لماذا
  rationale: تأتي ὅτι هنا في استفهام سببي، والمقابل العربي المباشر والطبيعي هو «لماذا».
- source_word: ἡμεῖς οὐκ ἠδυνήθημεν
  choice: لم نقدر نحن
  rationale: «نقدر» تنقل معنى الاستطاعة، وإبراز «نحن» يحفظ حضور الضمير المنفصل في اليونانية ونبرته المحتملة.
- source_word: ἐκβαλεῖν
  choice: أن نطرده
  rationale: «يطرد» تعبير عربي واضح ودقيق عن إخراج الروح النجس في هذا السياق، وهو أكثر طبيعية من الصياغة الحرفية «نلقيه خارجًا».
- source_word: αὐτό
  choice: ـه في «نطرده»
  rationale: لا يملك العربية جنسًا محايدًا يقابل صيغة الضمير اليوناني؛ لذلك استُعمل ضمير المذكر الموافق نحويًا لـ«الروح»، مع بيان احتمال المرجع الآخر في الحاشية.
theological_decisions:
- issue: مرجع الضمير الأخير αὐτό
  choice: يُفهم في المتن على أنه الروح النجس الذي حاول التلاميذ طرده.
  alternative: يمكن أن يُفهم على أنه الصبي المصاب.
  rationale: الضمير اليوناني محايد، وهذا يوافق πνεῦμα («روح»)، وهي كلمة محايدة في اليونانية، موافقةً أيسر من الصبي المذكر؛ لكن العربية لا تستطيع إظهار هذا الفرق لأن «الروح» مذكر نحويًا، لذلك حُفظ الاحتمال الآخر في الحاشية من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «على انفراد» بدل تعبير أكثر حرفية، وحُفظ توكيد الضمير ἡμεῖς بإيراد «نحن». وُضعت علامة الحاشية عند الضمير الذي تتناوله، لا عند «البيت».
