  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: ar
  text: 'فقال يسوع: «لا تمنعوه، لأنه لا أحد يصنع عملًا عظيمًا[a] باسمي ويستطيع سريعًا أن يتكلم بالسوء عليَّ[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «معجزة» أو «عمل قوة»؛ واللفظة اليونانية تعني حرفيًا «قوة»، وتُستعمل هنا لفعل ذي قدرة.
    reason: lexical_alternative
  - marker: b
    text: أو «يشتمني» أو «يذمني»؛ واليونانية تعني أن يتكلم بالسوء عليَّ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: لا تمنعوه
  rationale: صيغة نهي طبيعية واضحة، وتلائم السياق الذي حاول فيه التلاميذ منع الرجل من عمله.
- source_word: δύναμιν
  choice: عملًا مقتدرًا
  rationale: تحفظ معنى القوة الكامن في اللفظة اليونانية، وفي الوقت نفسه تدل في سياق الأناجيل على فعل خارق أو عظيم دون حصرها في مصطلح «معجزة».
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: باسمي
  rationale: تعبير عربي مألوف ينقل معنى العمل باستدعاء اسم يسوع أو سلطانه.
- source_word: ταχὺ
  choice: سريعًا
  rationale: تنقل دلالة الظرف على قرب حدوث الإساءة بعد العمل، مع إبقاء العلاقة الزمنية موجزة كما في الأصل.
- source_word: κακολογῆσαί με
  choice: أن يسيء القول فيَّ
  rationale: يحفظ المعنى العام، أي التكلم بالسوء على يسوع، من غير تضييقه إلى افتراء قانوني أو لعن صريح.
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: لأنه لا أحد
  rationale: يحافظ على التعليل وبنية النفي العامة بعبارة عربية واضحة.
- source_word: δυνήσεται
  choice: يقدر
  rationale: ينقل معنى الاستطاعة، ويُفهم الاستقبال من السياق بعد الفعل «يصنع».
theological_decisions:
- issue: طبيعة الفعل المصنوع باسم يسوع
  choice: عملًا مقتدرًا
  alternative: معجزة؛ عملًا عظيمًا؛ عمل قوة
  rationale: الصياغة المختارة تحافظ على الصلة الدلالية بالقوة في δύναμις، ولا تحصر اللفظة في مفهوم حديث أضيق، مع بيان أن المقصود فعل استثنائي.
- issue: دلالة ارتباط الفاعل بيسوع
  choice: إبقاء العبارة وصفية ومحدودة بما يقوله النص
  alternative: صياغة توحي بأنه تلميذ كامل؛ أو صياغة توحي بأنه مجرد مستغل للاسم
  rationale: الآية تتحدث عن تعذر أن يعمل شخص عملًا مقتدرًا باسم يسوع ثم يسيء إليه سريعًا، ولا تحسم وحدها مكانة ذلك الشخص الإيمانية أو العقائدية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «عملًا مقتدرًا» لصون عنصر القوة في الأصل، مع توضيح البدائل في الحاشية. أُبقي «سريعًا» قريبًا من موضعه اليوناني، واستُعملت «ثم» عربيًا لبيان التعاقب المنطقي والزمني دون جعلها حكمًا لاهوتيًا إضافيًا.
