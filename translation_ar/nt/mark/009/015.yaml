  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: ar
  text: وفي الحال، حين رأى الجمع كلّه يسوع، ذُهلوا جميعًا جدًا، وركضوا إليه يحيّونه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «دُهشوا بشدة»، أو: «ارتاعوا». قد يدل الفعل اليوناني، بحسب السياق، على الدهشة الشديدة أو الذهول أو الروع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: وللحال
  rationale: تنقل الفورية والإيقاع السريع المميزين لسرد مرقس، بصياغة عربية فصيحة مألوفة في السرد الكتابي.
- source_word: πᾶς ὁ ὄχλος
  choice: الجمع كله
  rationale: تحافظ على شمول الجماعة بوصفها وحدة جمعية، وتأتي طبيعية في العربية.
- source_word: ἰδόντες αὐτόν
  choice: لما رأى ... يسوع
  rationale: تؤدي اسم الفاعل الماضي بوصفه ظرفًا زمنيًا يبين الحدث الذي أثار رد الفعل؛ وذُكر اسم يسوع بدل الضمير لاتقاء التباس مرجع الضمير في العربية.
- source_word: ἐξεθαμβήθησαν
  choice: ذُهلوا جدًا
  rationale: تعبر عن شدة الدهشة التي يحملها الفعل اليوناني من غير أن تحصرها في الخوف أو تفترض سببًا خارقًا لا يذكره النص.
- source_word: προστρέχοντες
  choice: أسرعوا إليه
  rationale: تنقل الحركة السريعة نحوه بأسلوب عربي طبيعي، وإن كانت دلالة الجري الصريحة ممثلة هنا بصياغة ألين.
- source_word: ἠσπάζοντο αὐτόν
  choice: يحيّونه
  rationale: تنقل معنى إلقاء التحية بصورة محايدة وطبيعية، من غير إضافة معنى الترحيب الرسمي.
theological_decisions:
- issue: دلالة رد فعل الجمع في ἐξεθαμβήθησαν
  choice: دهشة شديدة من غير تحديد سببها
  alternative: ارتاعوا؛ أو دُهشوا بسبب هيئة نورانية تذكّر بموسى
  rationale: يذكر النص انفعالًا شديدًا عند رؤية يسوع ثم إقبال الجمع لتحيته، لكنه لا يصرح بالخوف ولا بهيئة نورانية؛ لذلك تُصان شدة الانفعال من دون إدخال تفسير غير منصوص عليه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُخدم «الجمع» للمفرد الجمعي، وذُكر «يسوع» صراحة منعًا لالتباس الضمائر. وُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
