  text: καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν ⸀προσευχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: ar
  text: 'فقال لهم: «لا يمكن لهذا النوع أن يخرج إلا بالصلاة[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات المتأخرة: «بالصلاة والصوم».'
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: هذا النوع
  rationale: تشير γένος هنا إلى صنف أو نوع. والسياق يبيّن أن المقصود روح نجس، لكن اليونانية لا تكرر كلمة «روح»، لذلك تحافظ «هذا النوع» على إيجاز الأصل من غير إضافة تفسيرية.
- source_word: ἐν οὐδενὶ
  choice: بشيء
  rationale: التركيب اصطلاحي ويدل على الوسيلة؛ ومع النفي في «لا يمكن» يفيد أن أية وسيلة أخرى لا تُجدي. وصياغة «لا يمكن أن يخرج بشيء إلا...» طبيعية وواضحة في العربية.
- source_word: δύναται ἐξελθεῖν
  choice: لا يمكن أن يخرج
  rationale: يعبر الفعل مع المصدر عن عدم القدرة، و«يخرج» يلائم سياق خروج الروح النجس من الإنسان.
- source_word: εἰ μὴ
  choice: إلا
  rationale: تدخل العبارة الاستثناء الوحيد بعد النفي، وتقابلها «إلا» بصورة طبيعية ودقيقة.
- source_word: ἐν προσευχῇ
  choice: بالصلاة
  rationale: تدل العبارة على الوسيلة، ولذلك تحافظ الباء في «بالصلاة» على دلالتها الأداتية.
theological_decisions:
- issue: هل تُضاف عبارة «والصوم»؟
  choice: بالصلاة
  alternative: بالصلاة والصوم
  rationale: نص SBLGNT المعطى يقرأ προσευχῇ، أي «الصلاة» فقط. وتوجد القراءة الأطول «الصلاة والصوم» في مخطوطات متأخرة، لذلك أُثبتت قراءة النص اليوناني في المتن وحُفظت القراءة الأخرى في حاشية بوصفها اختلافًا نصيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ إيجاز العبارة اليونانية في «هذا النوع» من غير التصريح بـ«الروح»، ووُضعت علامة الحاشية بعد عبارة الإسناد اتباعًا للطبقة الاستشارية الإنجليزية، مع بقاء مضمون الحاشية متعلقًا بالاختلاف النصي في آخر الآية.
