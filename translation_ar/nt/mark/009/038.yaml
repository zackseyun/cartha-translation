source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: ar
  text: 'فقال له يوحنا: «يا معلّم، رأينا شخصًا يطرد شياطين باسمك، فحاولنا أن نمنعه[a] لأنه لم يكن يتبعنا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكنا نمنعه». قد يدل الماضي الناقص اليوناني على فعل متكرر أو جارٍ، أو على محاولة؛ ومن هنا جاءت ترجمة «حاولنا أن نمنعه».'
    reason: بديل معجمي ونحوي
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: فقال له يوحنا
  rationale: صيغة الماضي «فقال» طبيعية في السرد العربي، وتحفظ المفعول غير المباشر والفاعل الصريحين.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: ينقل معنى اللقب مباشرة، مع أداة النداء التي تقتضيها العربية الطبيعية.
- source_word: εἴδομέν τινα
  choice: رأينا شخصًا
  rationale: «شخصًا» تحافظ على التنكير في τινα من غير إضافة وصف لا يصرّح به النص.
- source_word: ἐν τῷ ὀνόματί σου
  choice: باسمك
  rationale: تعبير عربي كتابي وطبيعي يفيد العمل المرتبط باسم يسوع وسلطانه، من غير تفصيل تفسيري زائد.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: يطرد شياطين
  rationale: ينقل الفعل المستمر الذي كان يوحنا ورفاقه يشاهدونه، ويحافظ على الدلالة المعهودة لفعل إخراج الشياطين.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: فحاولنا أن نمنعه
  rationale: يفيد الماضي الناقص اليوناني فعلًا جاريًا أو محاولةً في الماضي؛ و«حاولنا أن نمنعه» عربية واضحة تحفظ هذا الاحتمال.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: لأنه لم يكن يتبعنا
  rationale: يحفظ ضمير المتكلمين الصريح ἡμῖν، ولا يستبدله بـ«يتبعك» أو يختزله في الانتماء إلى جماعتهم.
theological_decisions:
- issue: مرجع الولاء في العبارة الأخيرة
  choice: لم يكن يتبعنا
  alternative: لم يكن يتبعك؛ لم يكن واحدًا منا
  rationale: النص اليوناني يقول صراحة «لنا/إيانا» (ἡμῖν). إبقاء «يتبعنا» يصون التوتر السردي وتركيز يوحنا على جماعة التلاميذ، من غير تعديل العبارة وفق تفسير مسبق.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «يا معلّم» للنداء الطبيعي، و«باسمك» للمحافظة على التعبير الكتابي المألوف، مع إبقاء «يتبعنا» كما في اليونانية.
