  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: ar
  text: وَإِنْ كَانَتْ يَدُكَ تُعَثِّرُكَ[a]، فَاقْطَعْهَا. خَيْرٌ لَكَ أَنْ تَدْخُلَ الْحَيَاةَ أَقْطَعَ الْيَدِ مِنْ أَنْ تَذْهَبَ وَلَكَ يَدَانِ إِلَى جَهَنَّمَ[b]، إِلَى النَّارِ الَّتِي لَا تُطْفَأُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تجعلك تخطئ». يمكن أن يدل الفعل اليوناني على التسبب في العثرة أو السقوط أو الوقوع في الخطية.'
    reason: lexical_alternative
  - marker: b
    text: '«جهنم» صيغة اسم موضع ارتبط بالدينونة الإلهية، ويُترجم أحيانًا: «الجحيم».'
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: جَعَلَتْكَ ... تَعْثُرُ
  rationale: يحفظ الاستعارة اليونانية التي تدل على التسبب في العثرة أو السقوط، مع بيان معنى الخطية في الحاشية دون حصر اللفظ فيه داخل المتن.
- source_word: ἀπόκοψον
  choice: فَاقْطَعْهَا
  rationale: صيغة أمر مباشرة وقوية تحافظ على حدّة الصورة الجسدية في الأصل.
- source_word: καλόν
  choice: خَيْرٌ لَكَ
  rationale: مع أن اللفظ يعني «حسن»، فإنه في تركيب المقارنة مع ἢ يؤدي معنى الأفضلية، والتعبير العربي طبيعي ودقيق.
- source_word: κυλλόν
  choice: أَقْطَعَ الْيَدِ
  rationale: يحدد السياق أن المقصود دخول الحياة بعد فقد اليد؛ وهذه الصياغة العربية واضحة وتحافظ على الصورة من غير استعمال وصف قد يكون ملتبسًا أو جارحًا.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: أَنْ تَدْخُلَ الْحَيَاةَ
  rationale: يحافظ على التعبير الأخروي وعلى فعل الدخول، بصياغة عربية فصيحة طبيعية.
- source_word: ἀπελθεῖν
  choice: أَنْ تَذْهَبَ
  rationale: ينقل الحركة المقابلة للدخول إلى الحياة؛ ولا تحتاج العربية هنا إلى إضافة «بعيدًا» كي يكون المعنى طبيعيًا.
- source_word: γέενναν
  choice: جَهَنَّمَ
  rationale: «جهنم» هي الصيغة العربية الراسخة للاسم اليوناني المنقول عن اسم موضع، وتحافظ الحاشية على خلفيته بوصفه اسمًا مرتبطًا بالدينونة الإلهية.
- source_word: ἄσβεστον
  choice: الَّتِي لَا تُطْفَأُ
  rationale: تعبير عربي واضح ودقيق يدل على نار غير قابلة للإطفاء.
- source_word: χεὶρ σου
  choice: يَدُكَ
  rationale: نقل مباشر يحفظ مركزية صورة عضو الجسد في التحذير.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: وَلَكَ يَدَانِ
  rationale: صياغة عربية طبيعية تصرّح بوجود اليدين وتحفظ المقابلة مع دخول الحياة أقطع اليد.
theological_decisions:
- issue: دلالة γέεννα في قول عن الدينونة
  choice: جهنم، مع حاشية تشرح أنها صيغة اسم موضع مرتبطة بالدينونة الإلهية
  alternative: النار الأبدية أو الجحيم
  rationale: يحافظ الاختيار على الاسم المحدد في النص بدل إذابته في مصطلح لاهوتي أعم، مع أن «جهنم» نفسها هي المقابل العربي الموروث للاسم.
- issue: قوة صورة قطع اليد
  choice: الإبقاء على اللغة الجسدية المحسوسة من غير تلطيف تفسيري
  alternative: إعادة صياغتها على أنها مجرد الابتعاد عن الخطية
  rationale: يستخدم النص صورة صادمة لتأكيد خطورة العثرة والدينونة، ولا يصرح في هذه الآية بكيفية تطبيقها؛ لذلك ينبغي ألا تحسم الترجمة هذا التوتر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم الضبط الجزئي/الكامل لتيسير القراءة، وحُفظ التوازي بين دخول الحياة والذهاب إلى جهنم، مع إبقاء الصورة البلاغية الحادة والتوتر التفسيري في النص.
