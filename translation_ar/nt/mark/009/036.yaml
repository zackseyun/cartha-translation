  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: أخذ
  rationale: اسم فاعل ماضٍ يقدّم الفعل السابق للفعل الرئيس؛ وصيغة «أخذ» طبيعية في العربية وتحفظ تتابع الأحداث.
- source_word: παιδίον
  choice: طفلًا
  rationale: تدل الكلمة على طفل، غالبًا صغير السن، من غير ضرورة لإبراز دلالة التصغير بزيادة وصف مثل «صغيرًا».
- source_word: ἔστησεν
  choice: أقامه
  rationale: الفعل هنا سببي بمعنى جعله يقف؛ و«أقامه» يحفظ هيئة الوقوف بصورة طبيعية وموجزة.
- source_word: ἐν μέσῳ αὐτῶν
  choice: في وسطهم
  rationale: يحفظ التعبير الدلالة المكانية، أي في المركز بينهم، وهو عربي واضح وفصيح.
- source_word: ἐναγκαλισάμενος
  choice: ضمَّه إلى ذراعيه
  rationale: يدل الفعل على أخذ الشخص بين الذراعين أو احتضانه؛ وهذه الصياغة تجسّد الحركة بوضوح من غير حصرها في معنى عاطفي.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: مقابل عربي مباشر ومحايد للفعل مع مفعوله غير المباشر.
