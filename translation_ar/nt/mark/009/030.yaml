  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: ar
  text: وخرجوا من هناك، وكانوا يجتازون الجليل[a]، ولم يكن يريد أن يعرف أحدٌ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «وكانوا يمرّون عبر الجليل». تدل صيغة الفعل اليوناني في الماضي الناقص على حركة كانت جارية.'
    reason: lexical_alternative
  - marker: b
    text: لا يصرّح النص اليوناني بما لم يكن يريد أن يعرفه أحد؛ ويشير السياق إلى وجوده أو إلى مسار رحلتهم عبر الجليل.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: وخرجوا من هناك
  rationale: يجمع التعبير بين أداة الربط والدلالة المكانية ومعنى مغادرة الموضع السابق، بصياغة عربية طبيعية وواضحة.
- source_word: παρεπορεύοντο
  choice: كانوا يمرّون
  rationale: صيغة الماضي الناقص تصوّر الحركة المستمرة أثناء عبور المنطقة؛ لذلك تنقل «كانوا يمرّون» هذا الجانب دون إثقال العبارة.
- source_word: διὰ τῆς Γαλιλαίας
  choice: عبر الجليل
  rationale: تفيد διά مع المضاف إليه الحركة خلال منطقة، و«عبر الجليل» تؤدي هذا المعنى بوضوح.
- source_word: οὐκ ἤθελεν
  choice: لم يكن يريد
  rationale: ينقل معنى الإرادة أو الرغبة، كما أن صيغة المفرد تحافظ على الإحالة السياقية إلى يسوع.
- source_word: ἵνα τις γνοῖ
  choice: أن يعلم أحدٌ
  rationale: تنقل الجملة غاية المنع المقصودة، وتُبقي مفعول «يعلم» غير مصرّح به كما في اليونانية.
theological_decisions:
- issue: الفاعل المستتر في ἤθελεν
  choice: الإبقاء عليه مستترًا في الفعل المفرد «يريد»، وإحالته سياقيًا إلى يسوع
  alternative: 'التصريح بالاسم: «لم يكن يسوع يريد»'
  rationale: الفعل اليوناني المفرد يعود طبيعيًا إلى يسوع في السياق، والعربية تسمح بحفظ هذه الإحالة من غير إضافة اسم غير مذكور صراحة في الآية.
- issue: المعلوم الذي لم يرد أن يعرفه أحد
  choice: ترك متعلَّق المعرفة غير مذكور
  alternative: تفسيره بأنه وجود يسوع في الجليل أو مسار رحلته
  rationale: النص اليوناني لا يصرّح بمفعول γνοῖ، ولذلك تُحفظ دلالته المفتوحة بدل حسمها تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدم «كانوا يمرّون» لإظهار استمرار الحركة، وتُرك متعلَّق «يعلم» محذوفًا حفاظًا على الإبهام الموجود في الأصل.
