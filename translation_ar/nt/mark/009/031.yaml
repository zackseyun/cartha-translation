  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: ar
  text: 'لأنه كان يعلِّم تلاميذه ويقول لهم: «إن ابن الإنسان يُسلَّم إلى أيدي الناس، فيقتلونه، وبعد أن يُقتَل، يقوم بعد ثلاثة أيام».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بعد أن يُقتَل، بعد ثلاثة أيام يقوم». وتَرِد عبارة «بعد ثلاثة أيام» في مواضع أخرى إلى جانب عبارة «في اليوم الثالث».'
    reason: يوضح الترتيب اليوناني الحرفي ويحفظ عبارة الزمن من غير مواءمتها مع صيغ نبوءات القيامة الأخرى.
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: كان يعلِّم
  rationale: صيغة الماضي الناقص تدل على فعل مستمر أو متكرر في خلفية السرد، والتركيب العربي «كان يعلِّم» ينقل هذا الجانب بوضوح.
- source_word: γὰρ
  choice: لأنه
  rationale: تفيد الأداة تعليل ما سبق في السياق، و«لأنه» رابط عربي طبيعي يحفظ قوتها التفسيرية.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: تلاميذه
  rationale: «التلاميذ» المقابل الإنجيلي المألوف، ويحفظ معنى التعلّم والعلاقة بالمعلم.
- source_word: ἔλεγεν αὐτοῖς
  choice: ويقول لهم
  rationale: يحفظ الماضي الناقص بالتوازي مع «كان يعلِّم»، مع عطف عربي طبيعي يدل على استمرار القول.
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة العربية الراسخة لهذا اللقب، وتحفظ صلته المحتملة بدانيال من غير تفسير زائد.
- source_word: παραδίδοται
  choice: يُسلَّم
  rationale: المضارع المبني للمجهول يحفظ عدم تعيين الفاعل واتساع المعنى بين التسليم والخيانة والوقوع في قبضة الآخرين، من غير حصره في «يُخان».
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: إلى أيدي الناس
  rationale: يحفظ الصورة الحسية في اليونانية، ومعنى الوقوع تحت سلطان البشر، كما يحفظ المقابلة بين «ابن الإنسان» و«الناس» بعبارة عربية طبيعية.
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: فيقتلونه
  rationale: ينقل المستقبل وصيغة الجمع ذات الفاعل البشري غير المعيّن بعبارة مباشرة وطبيعية.
- source_word: ἀποκτανθεὶς
  choice: وبعد أن يُقتَل
  rationale: ينقل اسم الفاعل الأوريستي المبني للمجهول بوصفه فعلاً سابقاً للقيام، ويحفظ المبني للمجهول من غير تعيين القاتلين في هذه العبارة.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: بعد ثلاثة أيام
  rationale: المعنى المعتاد لـ μετά مع النصب هو «بعد»، ولذلك لم تُسوَّ العبارة بصيغ أخرى مثل «في اليوم الثالث».
- source_word: ἀναστήσεται
  choice: يقوم
  rationale: الصيغة الوسطى المستقبلية هنا تلائم الفعل اللازم «يقوم»، فلا تُحوَّل إلى المبني للمجهول «يُقام».
theological_decisions:
- issue: دلالة παραδίδοται وصوت المبني للمجهول
  choice: يُسلَّم
  alternative: يُخان / يُدفَع
  rationale: النص لا يصرّح بالفاعل، وقد يشمل التسليم البشري والخيانة والسماح الإلهي من غير أن يحصرها في أحدها؛ لذا حُفظ هذا التوتر.
- issue: المقابلة بين Ὁ υἱὸς τοῦ ἀνθρώπου وἀνθρώπων
  choice: ابن الإنسان ... أيدي الناس
  alternative: ابن الإنسان ... أيدي البشر
  rationale: «الناس» لفظ طبيعي وشامل في العربية، ويحفظ المقابلة مع ابن الإنسان من غير أن يوحي بأن المقصود الذكور وحدهم.
- issue: صيغة القيامة في ἀναστήσεται
  choice: يقوم
  alternative: يُقام
  rationale: اختير الفعل اللازم وفق الصيغة اليونانية هنا، من غير استيراد المبني للمجهول من مواضع أخرى أو حسم دلالة لاهوتية لا تفرضها هذه الصيغة.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم «يُسلَّم» للمحافظة على المبني للمجهول واتساع الدلالة، و«بعد أن يُقتَل» لتقديم تسلسل الأحداث بصورة طبيعية. وُضعت علامة الحاشية بعد الاقتباس لأنها تتناول ترتيب خاتمته وعبارة «بعد ثلاثة أيام».
