lexical_decisions:
- source_word: τὸν λόγον
  choice: هذا الكلام
  rationale: يشير λόγος هنا إلى كلام يسوع السابق في العدد 9، و«هذا الكلام» عربية طبيعية تحفظ الإحالة إلى قوله من غير اختزاله في لفظة مفردة.
- source_word: ἐκράτησαν πρὸς ἑαυτοὺς
  choice: احتفظوا بهذا الكلام لأنفسهم
  rationale: ينقل التركيب معنى إبقاء الكلام في دائرتهم وعدم إذاعته، مع الحفاظ على الدلالة الأساسية للفعل κρατέω في هذا السياق.
- source_word: συζητοῦντες
  choice: وهم يتناقشون
  rationale: يفيد الفعل تبادل البحث والمداولة، و«يتناقشون» لا تفترض خصومة أو جدالًا حادًّا.
- source_word: τί ἐστιν
  choice: ما معنى
  rationale: المقصود سؤالهم عن مدلول العبارة، وهذه الصياغة واضحة وطبيعية في العربية الحديثة.
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: أن يقوم من بين الأموات
  rationale: تحفظ «من بين الأموات» قوة ἐκ νεκρῶν، أي القيام من وسط الموتى، كما تحافظ «يقوم» على لغة القيامة في السياق.
theological_decisions:
- issue: لغة القيامة في تساؤل التلاميذ
  choice: أن يقوم من بين الأموات
  alternative: أن يقوم من الأموات
  rationale: تحفظ الصياغة الدلالة الصريحة للقيامة وخصوصية ἐκ νεκρῶν، من غير أن تشرح مسبقًا ما ظل التلاميذ يتساءلون عن معناه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «هذا الكلام» للإحالة الطبيعية إلى قول يسوع السابق، و«من بين الأموات» للمحافظة على صورة النص اليوناني ودقته.
