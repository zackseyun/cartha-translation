  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: ar
  text: 'فقال لهم: «إن إيليا، بعد أن يأتي أولًا، يردّ كل شيء. وكيف كُتب عن ابن الإنسان أن يتألم كثيرًا ويُحتقر[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويُزدَرى به» أو «ويُعَدّ كأنه لا شيء». يدل الفعل اليوناني على احتقار الشخص ومعاملته كأنه بلا قيمة أو شأن.'
    reason: بديل معجمي يبيّن مدى دلالة ἐξουδενηθῇ.
lexical_decisions:
- source_word: ἔφη
  choice: فقال
  rationale: فعل القول السردي المألوف، وصيغة الفاء تلائم اتصال الجواب بالسياق السابق.
- source_word: Ἠλίας
  choice: إيليا
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: ἐλθὼν πρῶτον
  choice: إذ يأتي أولًا
  rationale: تحافظ على العلاقة الظرفية للتركيب مع صياغة عربية واضحة، من غير تحويله إلى حدث منفصل تمامًا.
- source_word: ἀποκαθιστάνει
  choice: يردّ
  rationale: يفيد إعادة الأشياء إلى حالها أو موضعها الصحيح، ويحافظ على المضارع ذي الدلالة العامة أو الحية.
- source_word: πάντα
  choice: كل شيء
  rationale: ينقل شمول صيغة الجمع المحايد بعبارة عربية طبيعية.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: وكيف كُتب عن ابن الإنسان
  rationale: يحافظ على صيغة الإحالة إلى المكتوب وعلى السؤال كما في اليونانية، ويترجم ἐπί هنا بمعنى «عن».
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: اللقب الإنجيلي المستقر دلاليًا، من غير استبداله بتفسير مسياني صريح.
- source_word: ἵνα πολλὰ πάθῃ
  choice: أن يتألم كثيرًا
  rationale: ينقل مضمون المكتوب بصياغة عربية طبيعية، ويحافظ على كثرة الألم من غير إضافة لفظ مثل «ينبغي» غير الموجود صراحة.
- source_word: ἐξουδενηθῇ
  choice: يُحتقر
  rationale: ينقل المبني للمجهول ومعنى المعاملة بازدراء أو اعتبار الشخص بلا شأن؛ وتوضح الحاشية البعد الدلالي الأوسع.
theological_decisions:
- issue: العلاقة بين مجيء إيليا الذي يردّ كل شيء وآلام ابن الإنسان
  choice: الإبقاء على الجملة الثانية سؤالًا بلاغيًا حقيقيًا من غير تفسير العلاقة أو إزالة التوتر.
  alternative: إضافة أداة استدراك مثل «ولكن» أو تحويل السؤال إلى شرح عقائدي مباشر.
  rationale: النص اليوناني يجاور بين الردّ والألم في صيغة سؤال، ولا يصرّح بحل منطقي أو لاهوتي للتوتر.
- issue: مرجع لقب «ابن الإنسان»
  choice: الإبقاء على اللقب «ابن الإنسان» بلا توسع تفسيري.
  alternative: ترجمته بـ«المسيح» أو تعيينه صراحة بأنه يسوع.
  rationale: يحافظ ذلك على صيغة النص وما تحمله من أبعاد إنجيلية ومسيانية من غير فرض تفسير داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على السؤال البلاغي وعلى لقب «ابن الإنسان»، ووُضعت علامة الحاشية عند اللفظ الذي تشرحه.
