  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: ar
  text: لكنهم ظلّوا صامتين، لأنهم كانوا قد تجادلوا فيما بينهم في الطريق حول أيِّهم أعظم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيُّهم هو الأعظم». تستعمل اليونانية هنا صيغة المقارنة «أعظم»، وإن كان يمكن فهمها في هذا السياق على نحوٍ تفضيلي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: ظلّوا صامتين
  rationale: ينقل صيغة الماضي الناقص معنى استمرارهم في الصمت جوابًا عن السؤال، وهو أوضح من مجرد «صمتوا».
- source_word: διελέχθησαν
  choice: كانوا قد تجادلوا
  rationale: الفعل قد يدل على النقاش، لكن موضوع المفاضلة في المقام والسياق التنافسي يرجّحان «تجادلوا». واستُعمل «كانوا قد» لبيان أن الجدال سبق صمتهم.
- source_word: πρὸς ἀλλήλους
  choice: فيما بينهم
  rationale: تعبير عربي طبيعي يحفظ معنى التفاعل المتبادل بين أفراد الجماعة.
- source_word: ἐν τῇ ὁδῷ
  choice: في الطريق
  rationale: ترجمة مباشرة وطبيعية تحافظ على صورة الطريق المهمة في سياق مرقس.
- source_word: τίς μείζων
  choice: مَن هو أعظم
  rationale: يحافظ على صيغة المقارنة في اليونانية من غير تحويلها صراحةً إلى صيغة التفضيل المطلقة «الأعظم»، مع إبقاء الاستعمال العربي طبيعيًا.
- source_word: οἱ δὲ
  choice: لكنهم
  rationale: تنقل δέ بوصفها أداة مقابلة خفيفة بين سؤال يسوع وصمت التلاميذ.
- source_word: γὰρ
  choice: لأنهم
  rationale: 'تُظهر العلاقة السببية بوضوح: سبب صمتهم هو ما دار بينهم في الطريق.'
theological_decisions:
- issue: صيغة المقارنة μείζων وإمكان فهمها بمعنى التفضيل المطلق
  choice: مَن هو أعظم
  alternative: مَن هو الأعظم
  rationale: النص اليوناني يستعمل صفة المقارنة لا صيغة تفضيل مستقلة. وتحافظ الصياغة المختارة على ذلك، مع التنبيه إلى البديل الاصطلاحي من غير حسم ما يتركه التعبير قابلًا للفهم بحسب السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «ظلّوا صامتين» لإبراز الاستمرار، و«تجادلوا فيما بينهم» لنقل الطابع التنافسي للنقاش من غير مبالغة في حدّته.
