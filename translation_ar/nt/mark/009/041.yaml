  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: ar
  text: 'فمَن سقاكم كأسًا من ماء لأنكم تحملون اسم المسيح، فالحق أقول لكم: لن يفقد أجره أبدًا.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: فمَن
  rationale: تنقل أداة الربط γάρ بالفاء، وتؤدي تركيب الموصول غير المعيّن بصياغة عربية طبيعية موجزة.
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: سقاكم كأس ماء
  rationale: الفعل «سقى» يؤدي معنى ποτίζω، أي أعطى للشرب، و«كأس ماء» تقابل المفعول به مباشرة من غير إطالة.
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: باسم كونكم للمسيح
  rationale: تحافظ الصياغة على وجود عبارة «باسم» وعلى العلاقة التي تفيدها الجملة التالية، من غير إدخال ضمير «اسمي» غير الموجود صراحة في النص اليوناني. وأُثبت الوجه السببي الأكثر سلاسة في الحاشية.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: فالحق أقول لكم
  rationale: صيغة عربية واضحة وموقرة تنقل توكيد ἀμήν والصيغة القولية المألوفة في الأناجيل.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: لن يفقد ... أبدًا
  rationale: يجمع النفي بـ«لن» مع «أبدًا» لنقل قوة النفي المؤكد في οὐ μή مع صيغة الاحتمال اليونانية.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: أجره
  rationale: «الأجر» مقابل طبيعي لـ μισθός، ويشمل معنى الجزاء أو المكافأة في هذا السياق.
theological_decisions:
- issue: دلالة Χριστός في تركيب الملكية χριστοῦ ἐστε
  choice: للمسيح
  alternative: للمسيح المنتظر / للمسيح بوصفه اسمًا علمًا
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، وتركيب «أنتم للمسيح» يحفظ معنى الانتماء من غير توسيع تفسيري.
- issue: العلاقة بين ἐν ὀνόματι وὅτι χριστοῦ ἐστε
  choice: باسم كونكم للمسيح
  alternative: باسم [المسيح]، لأنكم للمسيح
  rationale: النص لا يذكر صراحة «اسمي» ولا يكرر «المسيح» بعد «باسم». لذلك أبقت الترجمة الصلة الموجزة الملتبسة نسبيًا بين العبارتين، مع بيان القراءة السببية في الحاشية.
translation_notes:
  register: فصحى حديثة واضحة ذات نبرة إنجيلية موقرة. استُعمل «سقاكم» للإيجاز والطبيعية، وحُفظ التركيب غير المعتاد نسبيًا في العبارة الوسطى بسبب غموض الأصل الحقيقي، مع حاشية تفسيرية.
