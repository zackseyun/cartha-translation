base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: ar
  text: 'فقال له يسوع: «‹إن كنتَ تستطيع›؟ كلُّ شيءٍ ممكنٌ لمن يؤمن».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أقرب: «أما ‹إن كنتَ تستطيع›؟» يكرر يسوع كلام الأب في الآية السابقة ويتحداه به.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة «لمن يؤمن» هكذا: «لمن له إيمان» أو «لمن يثق».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: 'قولك: ‹إن كنتَ تستطيع›؟'
  rationale: أداة التعريف المحايدة Τὸ تجعل العبارة التالية اقتباسًا لعبارة الأب في الآية السابقة؛ وإضافة «قولك» توضح هذه الإحالة في العربية، وعلامة الاستفهام تنقل نبرة التحدي من غير أن تحسم تركيب العبارة أكثر مما يسمح به اليوناني.
- source_word: δύνῃ
  choice: تستطيع
  rationale: الفعل δύναμαι يعني القدرة أو الاستطاعة، و«تستطيع» هو المقابل العربي الطبيعي في الخطاب المباشر.
- source_word: πάντα
  choice: كلُّ شيءٍ
  rationale: ينقل الجمع المحايد اليوناني بمعناه الشامل ويحافظ على القوة البلاغية للقول.
- source_word: δυνατὰ
  choice: ممكنٌ
  rationale: الصفة هنا خبرية وتدل على الإمكان؛ وجاءت مفردة مراعاةً للتركيب العربي «كل شيء».
- source_word: τῷ πιστεύοντι
  choice: لمن يؤمن
  rationale: يحافظ هذا التعبير على دلالة اسم الفاعل الحاضر بوصفه وصفًا عامًا للشخص الذي يؤمن، من غير تحويله إلى لقب جامد.
theological_decisions:
- issue: نطاق عبارة «كل شيء ممكن»
  choice: الإبقاء على العبارة المطلقة في ظاهرها من غير إضافة قيد تفسيري
  alternative: «كل شيء ممكن بالله لمن يؤمن» أو «كل شيء ممكن لمن يؤمن بقدرة الله»
  rationale: النص اليوناني لا يذكر هنا «بالله» صراحةً؛ لذلك تُحفظ قوة العبارة وتوترها اللاهوتي، ولا يُضاف إلى المتن ما يفسرها أو يقيدها.
- issue: دلالة πιστεύοντι
  choice: «لمن يؤمن»
  alternative: «لمن يثق» أو «لمن له إيمان»
  rationale: «يؤمن» هو المقابل المباشر المعتاد، مع بقاء معنى الثقة حاضرًا بوصفه احتمالًا دلاليًا دون حصر المراد فيه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت علامات الاقتباس المتداخلة لإظهار أن يسوع يقتبس عبارة الأب، مع الحفاظ على إيجاز الجملة اليونانية وقوتها.
