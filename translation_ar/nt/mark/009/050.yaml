base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: ar
  text: الملح جيد؛ ولكن إن صار الملح بلا ملوحة، فبماذا تتبّلونه؟ ليكن فيكم ملح[a]، وكونوا في سلام بعضكم مع بعض.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تبقى صورة «الملح» هنا مفتوحة الدلالة؛ وقد تُفهم على الطهارة أو الحكمة أو أمانة العهد أو التأثير الحافظ، لكن النص لا يصرّح بمعنى واحد منها.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: جيد
  rationale: يحافظ على التقويم العام الموجز في اليونانية من غير حصر المعنى في النفع وحده.
- source_word: ἅλας / ἅλα
  choice: الملح / ملح
  rationale: يحافظ على صورة الملح وعلى تكرار اللفظ في الآية، ولا يحوّل الاستعارة في الأمر الأخير إلى تفسير بعينه.
- source_word: ἄναλον
  choice: بلا ملوحة
  rationale: ينقل معنى «من دون ملح/عديم الملوحة» بعبارة عربية واضحة، ويحفظ التلاعب اللفظي المتصل بالملح.
- source_word: γένηται
  choice: صار
  rationale: يدل طبيعيًا في العربية على التحول إلى حالة جديدة.
- source_word: ἐν τίνι
  choice: بماذا
  rationale: ينقل سؤال الوسيلة نقلاً عربيًا موجزًا وطبيعيًا.
- source_word: ἀρτύσετε
  choice: تملّحونه
  rationale: ينقل فعل التتبيل في هذا السياق مع إبقاء الصلة اللفظية بالملح؛ ويمكن من جهة المعنى ترجمته «تطيّبونه» أو «تتبّلونه».
- source_word: ἔχετε
  choice: ليكن فيكم
  rationale: صيغة أمر عربية طبيعية تؤدي معنى «اجعلوا/احتفظوا بوجود الملح فيكم» من غير تفسير الاستعارة.
- source_word: ἐν ἑαυτοῖς
  choice: فيكم
  rationale: يحفظ الاتجاه الداخلي للعبارة الانعكاسية، مع إمكان فهمها جماعيًا في سياق خطاب التلاميذ.
- source_word: εἰρηνεύετε
  choice: سالموا
  rationale: فعل أمر مباشر يدل على ممارسة السلام واستمراره في العلاقة.
- source_word: ἐν ἀλλήλοις
  choice: بعضكم بعضًا
  rationale: تعبير عربي مألوف يؤدي العلاقة التبادلية بين المخاطَبين.
theological_decisions:
- issue: دلالة الملح في الأمر الأخير
  choice: 'إبقاء الاستعارة: «ليكن فيكم ملح»'
  alternative: تفسيرها في المتن بالطهارة أو الحكمة أو أمانة العهد أو التأثير الحافظ
  rationale: لا يحدد النص نفسه مدلولًا واحدًا للاستعارة؛ لذلك يحفظ المتن اتساعها والتوتر التفسيري بدل فرض قراءة لاهوتية بعينها.
- issue: صيغة وصية السلام
  choice: «سالموا بعضكم بعضًا»
  alternative: «كونوا في سلام بعضكم مع بعض»
  rationale: الصياغة المختارة عربية مباشرة وتؤدي الأمر المستمر المتعلق بالعلاقة المتبادلة، من غير إضافة تفسير إلى مضمون الوصية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الاستعارة المركزية وتكرارات «الملح»، مع تجنب شرحها مذهبيًا داخل المتن.
