source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: ar
  text: وإن كانت قدمك تُعثِرك، فاقطعها. فخيرٌ لك أن تدخل الحياة أعرج من أن تُطرح في جِهَنَّا وأنت ذو قدمين[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جهنم». اللفظة اليونانية هي «جِهَنَّا»، وهي تستحضر وادي هنوم وما ارتبط به من صور الدينونة الإلهية.'
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: جعلتك تعثر
  rationale: يحفظ صورة التعثر في اليونانية ولا يحصرها تفسيرياً في ارتكاب خطيئة بعينها، مع بقاء دلالتها الأخلاقية واضحة من السياق.
- source_word: ἀπόκοψον
  choice: فاقطعها
  rationale: ينقل قوة فعل الأمر وصورته الحسية المباشرة من غير تلطيف.
- source_word: καλόν ἐστίν
  choice: فخير لك
  rationale: يؤدي المعنى التفضيلي الذي يقتضيه التركيب المقارن مع ἢ، بصياغة عربية طبيعية.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: أن تدخل الحياة
  rationale: يحافظ على صورة الدخول وعلى لفظ «الحياة» من غير إضافة «الأبدية»، وهي غير مذكورة صراحة في النص.
- source_word: χωλὸν
  choice: أعرج
  rationale: هو الوصف العربي الدقيق لمن به عرج، ويناسب ذكر القدم تحديداً.
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: أن تكون لك قدمان
  rationale: صياغة عربية واضحة تحافظ على المقابلة بين العرج وامتلاك القدمين كلتيهما.
- source_word: βληθῆναι
  choice: فتُطرح
  rationale: ينقل المبني للمجهول ومعنى الإلقاء القوي بأسلوب عربي فصيح وطبيعي.
- source_word: γέενναν
  choice: جِهَنَّا
  rationale: نقل صوتي للمصطلح اليوناني المحدد يحفظ صلته بوادي هنوم وصور الدينونة المرتبطة به، بدلاً من إذابته في لفظ عام.
theological_decisions:
- issue: ترجمة γέεννα في سياق الدينونة
  choice: جِهَنَّا
  alternative: جهنم
  rationale: النص يستعمل اسماً محدداً ذا خلفية يهودية وتاريخية، لا لفظاً عاماً للعالم الآخر. لذلك أُبقيت خصوصية الاسم في المتن، مع بيان المقابل العربي المألوف وخلفيته في الحاشية.
- issue: مدى تفسير σκανδαλίζῃ
  choice: جعلتك تعثر
  alternative: جعلتك تخطئ
  rationale: اختيرت العبارة التي تحفظ الاستعارة الأصلية والتوتر بين التعثر الحسي والسقوط الأخلاقي، بدلاً من حصر المعنى في تفسير واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة جادة. استُعملت صياغة مباشرة تحافظ على حدة الصورة البلاغية، مع تجنب الألفاظ القديمة غير الضرورية والإضافات التفسيرية في المتن.
