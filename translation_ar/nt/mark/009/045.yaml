  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما في ذلك الاستعارة في σκανδαλίζῃ، والأمر الحاد «فاقطعها»، و«الحياة» دون إضافة تفسيرية، والمبني للمجهول في «تُطرح»، وخصوصية «جِهَنَّا». لكن «جعلتك قدمك تعثر» صياغتها النحوية والأسلوبية مضطربة؛ والفعل «تُعثِرك» أدق وأوضح في إسناد معنى «يجعلك تتعثر» إلى القدم.
  naturalness: النص فصيح وموجز في الجملة، لكن البدء بـ«وإن كانت قدمك تُعثِرك» طبيعي وواضح في العربية المعاصرة أكثر من «وإن جعلتك قدمك تعثر». كما أن «وأنت ذو قدمين» أيسر وأبلغ في مقابلة «أعرج» مع امتلاك القدمين، مع بقاء المعنى نفسه.
  terminology: «جِهَنَّا» يحافظ على خصوصية γέεννα كما في النص اليوناني، وتوضح الحاشية المقابل العربي المألوف «جهنم» والخلفية المرتبطة بوادي هنوم. و«أعرج» مناسب لـ χωλόν في سياق القدم.
