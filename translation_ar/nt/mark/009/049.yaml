lexical_decisions:
- source_word: Πᾶς
  choice: كلَّ واحدٍ
  rationale: الصفة مفردة مذكّرة مرفوعة ومستعملة استعمال الاسم، فتدل في هذا السياق على كل شخص. وهذه الصياغة العربية أوضح من «الكل» وتحافظ على شمول العبارة للأشخاص.
- source_word: γὰρ
  choice: لأن
  rationale: تفيد الأداة تعليل الكلام السابق أو شرحه، و«لأن» تُظهر هذه الصلة المنطقية بوضوح في العربية.
- source_word: πυρὶ
  choice: بالنار
  rationale: صيغة المجرور اليونانية تحتمل معنى الوسيلة أو الارتباط. وتحافظ الباء في «بالنار» على قدر من هذا الاتساع من غير أن تحسم هل النار أداة أم وسطًا.
- source_word: ἁλισθήσεται
  choice: سيُمَلَّح
  rationale: الفعل مستقبل مبني للمجهول من ἁλίζω، ومعناه المباشر التمليح أو جعل الشيء مملحًا. تحافظ الصياغة على الصورة المجازية اللافتة بدل تفسيرها داخل المتن.
theological_decisions:
- issue: تفسير صورة «يُمَلَّح بالنار»
  choice: إبقاء العبارة المجازية كما هي من غير حسم دلالتها
  alternative: سيُدان كل واحد بالنار؛ أو سيتطهّر بالنار؛ أو سيُكرَّس كذبيحة مملّحة
  rationale: النص اليوناني موجز وموحٍ، ويمكن أن يستحضر الدينونة أو التطهير أو لغة الذبائح والتلمذة. لذلك يحافظ المتن على التوتر الدلالي ولا يفرض تفسيرًا لاهوتيًا واحدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. استُبقيت صورة «التمليح بالنار» الغريبة عمدًا لأمانتها للنص، مع شرح البديل والإيحاءات المحتملة في الحاشية.
