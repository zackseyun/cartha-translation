  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: ar
  text: 'ولما رأت بطرس يستدفئ، حدَّقت إليه وقالت: «وأنت أيضًا كنت مع يسوع الناصري»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θερμαινόμενον
  choice: يستدفئ
  rationale: ينقل معنى تدفئة النفس عند النار بصياغة عربية طبيعية موجزة.
- source_word: ἐμβλέψασα αὐτῷ
  choice: حدَّقت إليه
  rationale: يفيد النظر المباشر المتفحّص، وهو أقوى من مجرد «نظرت إليه».
- source_word: τοῦ Ναζαρηνοῦ ... τοῦ Ἰησοῦ
  choice: يسوع الناصري
  rationale: يحافظ على تعريف يسوع بالنسبة إلى الناصرة بترتيب عربي طبيعي.
theological_decisions:
- issue: زمن الفعل λέγει بوصفه حاضرًا سرديًا
  choice: وقالت
  alternative: وتقول
  rationale: الحاضر اليوناني هنا حاضر سردي يحيي المشهد، لكن الماضي هو الأسلوب الطبيعي الواضح في السرد العربي ولا يغيّر مضمون القول.
