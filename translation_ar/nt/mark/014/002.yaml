  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: ar
  text: 'لِأَنَّهُمْ كَانُوا يَقُولُونَ: «لَيْسَ أَثْنَاءَ الْعِيدِ، لِئَلَّا يَحْدُثَ اضْطِرَابٌ مِنَ الشَّعْبِ[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بين الشعب». قد يدل المضاف إليه في اليونانية على أن الاضطراب يصدر من الشعب، أو يقع في وسطه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: يحفظ دلالة الماضي الناقص على قول مستمر أو متكرر، بصياغة عربية طبيعية.
- source_word: γάρ
  choice: لأنهم
  rationale: تنقل الأداة التفسيرية التي تربط هذا القول بما قبله.
- source_word: Μὴ
  choice: لا
  rationale: 'تحافظ على الإيجاز في العبارة اليونانية الناقصة، حيث يُفهم الفعل من السياق: لا [نفعل ذلك].'
- source_word: ἐν τῇ ἑορτῇ
  choice: في أثناء العيد
  rationale: تنقل الاستعمال الزمني لحرف الجر، وتشير في السياق إلى مدة العيد لا إلى لحظة واحدة.
- source_word: μήποτε
  choice: لئلا
  rationale: تعبّر بإيجاز عن النتيجة المخوفة التي يريدون تجنبها.
- source_word: ἔσται
  choice: يحدث
  rationale: صياغة عربية طبيعية للتركيب الوجودي المستقبلي في سياق التخوف، من غير الجزم بأن الاضطراب سيقع.
- source_word: θόρυβος
  choice: اضطراب
  rationale: يدل على جلبة وفوضى عامة، من غير المبالغة إلى معنى الثورة أو الشغب الواسع.
- source_word: τοῦ λαοῦ
  choice: من الشعب
  rationale: يجعل المضاف إليه دالًا على مصدر الاضطراب، مع إبقاء احتمال دلالته على وقوع الاضطراب بين الناس في الحاشية.
