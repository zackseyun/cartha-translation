  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: ar
  text: 'وحيثما يدخل، فقولا لربّ البيت: «المعلّم يقول: أين غرفة الضيوف الخاصة بي[a] التي آكل فيها الفصح مع تلاميذي؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مكان إقامتي» أو «غرفتي». تشير الكلمة اليونانية إلى مكان للإقامة، ويُرجَّح هنا أنها غرفة ضيوف في بيت خاص، لا نُزُلًا تجاريًّا.'
    reason: بديل معجمي يوضح مجال معنى κατάλυμα ويحفظ احتمال «مكان الإقامة» مع بيان المرجّح سياقيًا.
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: حيثما يدخل
  rationale: تنقل «حيثما» دلالةَ الموصول المكاني غير المعيّن الناتجة من ὅπου مع ἐάν، ويؤدي «يدخل» معنى الفعل في هذا السياق السردي بوضوح.
- source_word: εἴπατε
  choice: فقولا
  rationale: الأمر في اليونانية موجّه إلى التلميذين المذكورين في السياق السابق؛ لذلك استُعملت صيغة المثنّى العربية، مع الفاء لربط التعليم بما قبله طبيعيًا.
- source_word: οἰκοδεσπότῃ
  choice: لربّ البيت
  rationale: تدل العبارة على المسؤول عن البيت أو صاحب السلطان فيه، و«ربّ البيت» تعبير عربي موجز وطبيعي في هذا المقام.
- source_word: Ὁ διδάσκαλος
  choice: المعلّم
  rationale: يحفظ المعنى المعجمي العادي والوظيفة اللقبية في السياق من غير إدخال لقب أقوى من اللفظ اليوناني.
- source_word: κατάλυμά μου
  choice: غرفة ضيافتي
  rationale: تدل κατάλυμα هنا على مكان نزول أو غرفة ضيوف في بيت خاص، والضمير μου حاضر في النص؛ و«غرفة ضيافتي» تحفظ صلة الغرفة بيسوع من غير تحويلها إلى نُزُل تجاري.
- source_word: τὸ πάσχα
  choice: الفصح
  rationale: يمكن أن يدل اللفظ على العيد أو ذبيحته أو وجبته، لكن اقترانه بالفعل «آكل» يجعل المقصود السياقي مفهومًا من غير إضافة تفسيرية إلى صلب النص.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: مع تلاميذي
  rationale: «التلاميذ» هو المقابل العربي المألوف الذي يحفظ علاقة الاتباع والتعلّم، والضمير ينقل μου.
- source_word: φάγω
  choice: آكل
  rationale: ورد الفعل بصيغة الاحتمال/الفعل المتوخّى ضمن جملة مكانية؛ والعربية تعبّر عن ذلك طبيعيًا بصلة الموصول «التي آكل فيها» من غير فرض دلالة مستقبلية جازمة.
theological_decisions:
- issue: 'ترجمة وصف يسوع لنفسه: διδάσκαλος'
  choice: المعلّم
  alternative: السيد
  rationale: «المعلّم» هو المعنى المباشر ويحفظ التعيين السردي، بينما قد تُدخل «السيد» دلالة سلطة أو دلالة مسيحية أوسع لا يفرضها هذا اللفظ وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة موقّرة. استُعمل المثنّى في «فقولا» وفق سياق إرسال تلميذين، ووُضعَت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
