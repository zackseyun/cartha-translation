  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: ar
  text: وكان رؤساء الكهنة والمجلس كله[a] يطلبون شهادةً ضد يسوع لكي يقتلوه، فلم يجدوا شهادةً.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، وبالتحديد أكثر: «السنهدريم كله».'
    reason: بديل تاريخي/معجمي للاسم الشائع للمجلس الحاكم، مع إبقاء الترجمة المعنوية الواضحة في المتن.
lexical_decisions:
- source_word: οἱ δὲ
  choice: وكان
  rationale: تنقل الواو مع كان الانتقال السردي الخفيف الذي تؤديه δέ من غير إدخال ظرف زمان صريح أو تشديد معنى الاستدراك.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: التعبير العربي المألوف والدقيق لجماعة القيادات الكهنوتية في أورشليم، وليس إشارة إلى رئيس كهنة واحد.
- source_word: ὅλον τὸ συνέδριον
  choice: المجلس كله[a]
  rationale: «المجلس» ينقل معنى συνέδριον بوضوح، و«كله» تحفظ ὅλον؛ وتورد الحاشية الاسم التاريخي الأشهر.
- source_word: ἐζήτουν
  choice: يطلبون
  rationale: المضارع بعد «كان» يحفظ دلالة الماضي المستمر في صيغة الناقص اليونانية.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: ضد يسوع
  rationale: تنقل القوة العدائية لحرف الجر κατά مع المضاف إليه في هذا السياق القضائي.
- source_word: μαρτυρίαν
  choice: شهادةً
  rationale: تلائم مضمون الشهادة في سياق قضائي أكثر من «دليل»، التي قد توسع المعنى، أو «شاهد»، التي قد تدل على الشخص.
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: لكي يقتلوه
  rationale: تنقل تركيب الغرض ومعنى θανατόω بعبارة عربية طبيعية واضحة؛ والسياق القضائي يبين أن المقصود إيقاع الموت به.
- source_word: καὶ οὐχ ηὕρισκον
  choice: فلم يجدوا
  rationale: الفاء تصوغ النتيجة المتباينة طبيعيًا في العربية، والنفي مع «وجدوا» يعود إلى الشهادة المذكورة من غير حاجة إلى تكرارها؛ أما الاستمرار فظاهر من فعل الطلب السابق.
theological_decisions:
- issue: تعيين مدلول συνέδριον
  choice: المجلس كله في المتن
  alternative: السنهدريم كله
  rationale: اللفظة اليونانية تدل على المجلس الحاكم، وترجمة معناها أوضح للقارئ العام، مع حفظ الاسم التاريخي المنقول في الحاشية دون فرضه على المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على الطابع القضائي وعلى استمرار سعي القيادات، وتجنبت إضافة «الآن» لعدم وجود ظرف زمان صريح في الأصل.
