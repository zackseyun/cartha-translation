  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: ar
  text: فقد كان كثيرون يشهدون عليه زورًا[a]، ولم تكن شهاداتهم متفقة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصورة أكثر حرفية: «يشهدون عليه شهادة زور، ولم تكن الشهادات متفقة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: كثيرون
  rationale: الصفة مستعملة استعمال الاسم وتشير إلى أشخاص كثيرين، من غير إضافة «شهود» لأنها غير مذكورة صراحة.
- source_word: γὰρ
  choice: فقد
  rationale: تنقل القوة التفسيرية لـγάρ وتربط الآية بسياق المحاكمة ربطًا طبيعيًا في العربية.
- source_word: ἐψευδομαρτύρουν
  choice: كان ... يشهدون ... زورًا
  rationale: يحفظ التركيب معنى الشهادة الكاذبة في السياق القضائي، وتعبير «كانوا يشهدون» يعكس دلالة الماضي الناقص على الفعل الجاري أو المتكرر.
- source_word: κατ’ αὐτοῦ
  choice: عليه
  rationale: ينقل المعنى العدائي القضائي للشهادة الموجهة ضد يسوع، وهو تعبير عربي طبيعي مع فعل «شهد».
- source_word: ἴσαι
  choice: متفقة
  rationale: المعنى الحرفي «متساوية»، لكنه عند وصف الشهادات يدل على تطابقها أو اتفاقها بعضها مع بعض.
- source_word: αἱ μαρτυρίαι
  choice: شهاداتهم
  rationale: الضمير يوضح طبيعيًا أن المقصود شهادات الأشخاص المذكورين، مع الحفاظ على السجل القضائي.
- source_word: οὐκ ἦσαν
  choice: لم تكن
  rationale: ينقل النفي البسيط لفعل الكينونة في الماضي، ويتلاءم مع جمع غير العاقل في العربية.
