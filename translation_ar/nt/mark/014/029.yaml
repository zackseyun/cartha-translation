  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: ar
  text: 'لكن بطرس قال له: «ولو تعثّر الجميع[a]، فلن أتعثر أنا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ولو سقط الجميع». يدل الفعل اليوناني على التعرّض للعَثرة أو التعثّر أو السقوط؛ وقد يدل في هذا السياق على الابتعاد عن يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: لكن
  rationale: تفيد المقابلة مع كلام يسوع السابق، وتُظهر اعتراض بطرس عليه بوضوح طبيعي.
- source_word: ἔφη αὐτῷ
  choice: قال له
  rationale: يحافظ على فعل القول العادي وعلى الضمير العائد إلى يسوع كما في اليونانية.
- source_word: Εἰ καὶ
  choice: حتى إن
  rationale: 'تنقل معنى الشرط التنازلي: ولو وقع الأمر من الجميع.'
- source_word: πάντες
  choice: الجميع
  rationale: تدل بإيجاز على جماعة التلاميذ كلها في السياق.
- source_word: σκανδαλισθήσονται
  choice: تعثّر
  rationale: يحافظ على صورة العثرة واتساع الدلالة اليونانية، مع بيان المعنى السياقي الأشد في الحاشية.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: فأنا لا
  rationale: يحافظ على إيجاز العبارة اليونانية وعلى إبراز ضمير المتكلم، مع فهم الفعل المحذوف من الجملة السابقة.
theological_decisions:
- issue: دلالة σκανδαλισθήσονται في سياق فشل التلاميذ
  choice: تعثّر
  alternative: ارتدّ أو تركه
  rationale: «تعثّر» يحفظ الاستعارة الأصلية والغموض الدلالي بين الوقوع في الفشل والابتعاد عن يسوع، فلا يحسم النص على أنه ارتداد نهائي، بينما توضّح الحاشية إمكان معنى الترك أو السقوط.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل التركيب الموجز «فأنا لا» للمحافظة على توكيد ἐγώ وعلى الحذف البلاغي في الأصل.
