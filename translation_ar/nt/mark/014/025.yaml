  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: ar
  text: '«الحق أقول لكم: لن أشرب بعد الآن قطّ[a] من ثمر الكرمة[b] حتى ذلك اليوم الذي أشربه فيه جديدًا[c] في ملكوت الله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لن أشرب أبدًا بعد الآن». يستعمل اليوناني نفيًا مؤكدًا.'
    reason: lexical_alternative
  - marker: b
    text: «ثمر الكرمة» هو التعبير اليوناني هنا، والمقصود شراب الكرمة المستعمل في الوجبة.
    reason: lexical_alternative
  - marker: c
    text: 'أو: «من جديد». يمكن أن تعني الصفة اليونانية «جديدًا»، وقد توحي بالجِدّة المرتبطة بالملكوت الآتي.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صيغة عربية واضحة ومهيبة تنقل افتتاح الإعلان المؤكد والخطاب المباشر، بدل إبقاء «آمين» على نحو قد لا يتضح معناه للقارئ المعاصر.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: لن أشرب بعد الآن قطّ
  rationale: «بعد الآن» تنقل معنى οὐκέτι، و«لن... قطّ» تنقل قوة النفي المستقبلي المؤكد في οὐ μὴ مع صيغة الفعل.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: من ثمر الكرمة
  rationale: يحافظ التعبير على صورة الأصل ولا يخصص الشراب بلفظ «الخمر» مع أن السياق يدل على شراب الكرمة المستعمل في الوجبة.
- source_word: ἕως τῆς ἡμέρας ἐκείνης ὅταν
  choice: حتى ذلك اليوم الذي
  rationale: ينقل الغاية الزمنية والإشارة إلى يوم محدد، ويصوغ جملة ὅταν المستقبلية بعربية طبيعية.
- source_word: αὐτὸ πίνω
  choice: أشربه
  rationale: يعود الضمير طبيعيًا إلى المذكور من ثمر الكرمة، والمضارع العربي بعد العبارة الزمنية ملائم للإشارة المستقبلية.
- source_word: καινὸν
  choice: جديدًا
  rationale: يحافظ على دلالة الجِدّة من غير حسم ما إذا كانت جِدّة في النوع أو بمعنى الشرب من جديد.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: في ملكوت الله
  rationale: ينقل العبارة اللاهوتية المألوفة نقلاً مباشرًا من غير شرح زائد.
theological_decisions:
- issue: دلالة καινὸν في العبارة الأخيرة
  choice: جديدًا
  alternative: من جديد؛ أو بصورة جديدة في وليمة الملكوت الآتية
  rationale: قد تدل الصفة على جِدّة في الصفة أو الحال، وقد تُفهم بمعنى «من جديد». أبقى النص الرئيس اللفظ الأوسع حتى لا يحسم توترًا لا يفسره الأصل صراحة.
- issue: المقصود بعبارة «ثمر الكرمة»
  choice: الإبقاء على «ثمر الكرمة»
  alternative: الخمر
  rationale: مع أن السياق يشير إلى محتوى الكأس، فإن الأصل لا يستخدم لفظًا صريحًا يعني «الخمر»، ولذلك حُفظت عبارته التصويرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة تناسب إعلان يسوع الرسمي. استُعمل «قطّ» لتقوية النفي من غير إلغاء الحد الزمني اللاحق، وحُفظت عبارتا «ثمر الكرمة» و«جديدًا» لصون صورة الأصل وغموضه الدلالي المشروع.
