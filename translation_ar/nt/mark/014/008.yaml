base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: ar
  text: فعلت ما استطاعت[a]؛ دهنت جسدي بالعطر سلفًا استعدادًا لدفني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، حرفيًا: «ما كان لديها فعلته».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: فعلت ما استطاعت
  rationale: ينقل قوة التعبير الاصطلاحي اليوناني بوضوح في العربية، مع إثبات الصياغة الحرفية البديلة في الحاشية.
- source_word: προέλαβεν
  choice: سبقت فـ
  rationale: يحافظ على معنى القيام بالفعل مقدمًا، ويرتبط طبيعيًا بالفعل التالي في العربية من غير إدخال معنى المجيء.
- source_word: μυρίσαι
  choice: دهنت ... بالعطر
  rationale: يدل الفعل على وضع الطيب أو العطر على الجسد؛ وهذه صياغة عربية واضحة ودقيقة في سياق إعداد الجسد للدفن.
- source_word: τὸ σῶμά μου
  choice: جسدي
  rationale: مقابل مباشر وطبيعي للعبارة اليونانية.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: استعدادًا لدفني
  rationale: يبين دلالة الغاية في العبارة، ويجعل صلة دهن الجسد بالدفن طبيعية وواضحة.
theological_decisions:
- issue: إظهار الفاعل المؤنث المفهوم من السياق
  choice: فعلت ... استطاعت ... سبقت
  alternative: فعل ما كان لديه
  rationale: الأفعال اليونانية مفردة غائبة ولا تذكر الفاعل صراحة، لكن السياق السابق يحدد المرأة؛ وصيغة التأنيث لازمة في العربية ولا تضيف مضمونًا لاهوتيًا.
- issue: علاقة الفعل السابق بالدفن
  choice: سبقت فدهنت جسدي بالعطر استعدادًا لدفني
  alternative: بادرت إلى تطييب جسدي للدفن
  rationale: تحافظ الصياغة على كون الفعل قد تم مقدمًا وعلى دلالة الغاية، من غير أن توحي بأن προέλαβεν فعل حركة أو مجيء.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة الأسلوب. استُعمل «دهنت جسدي بالعطر» بدل المصطلح الكنسي المحتمل «مسحت» لتوضيح المعنى المادي للفعل في سياق الدفن، مع الحفاظ على الإيجاز والتوتر الدلالي في الأصل.
