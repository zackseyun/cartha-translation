base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: ar
  text: '«إننا سمعناه يقول: سأهدم هذا الهيكل المصنوع بالأيدي[a]، وفي غضون ثلاثة أيام[b] أبني هيكلًا آخر غير مصنوع بالأيدي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «المصنوع باليد». يحافظ التعبير على التقابل في اليونانية بين «مصنوع باليد» و«غير مصنوع باليد».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة العبارة الزمنية: «في ثلاثة أيام». والأرجح أن التعبير اليوناني يشير هنا إلى المدة التي يقع الفعل في نطاقها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: قائلين
  rationale: تُدخل مضمون الشهادة في السياق العربي بصورة طبيعية، ولا تُفهم هنا سببية.
- source_word: Ἡμεῖς
  choice: نحن
  rationale: إثبات الضمير المنفصل يحفظ توكيد الشهود على ادعائهم.
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: سمعناه يقول
  rationale: صياغة عربية طبيعية تنقل تركيب السماع مع اسم الفاعل اليوناني من غير تكلّف.
- source_word: καταλύσω
  choice: سأهدم
  rationale: الفعل في سياق البناء يدل على النقض والهدم، و«أهدم» أدق وأطبع من التعبير العام «أدمّر».
- source_word: ναὸν
  choice: الهيكل
  rationale: يشير إلى المقدس أو مبنى الهيكل، و«الهيكل» هو المقابل العربي المألوف في هذا السياق.
- source_word: τοῦτον
  choice: هذا
  rationale: يحفظ قوة اسم الإشارة إلى الهيكل الحاضر موضع الاتهام.
- source_word: χειροποίητον
  choice: المصنوع بالأيدي
  rationale: يحفظ الصياغة الملموسة والموازاة المقصودة مع ἀχειροποίητον.
- source_word: διὰ τριῶν ἡμερῶν
  choice: في غضون ثلاثة أيام
  rationale: ينقل المدة التي يجري الفعل في نطاقها، مع إبقاء «في ثلاثة أيام» بديلًا ممكنًا.
- source_word: ἄλλον
  choice: هيكلًا آخر
  rationale: أُعيد الاسم المحذوف تقديرًا في العربية ليتضح مرجع «آخر» من غير إضافة تفسير.
- source_word: ἀχειροποίητον
  choice: غير مصنوع بالأيدي
  rationale: يحفظ التضاد اللفظي المباشر مع «المصنوع بالأيدي» ولا يحوّله إلى تفسير مثل «إلهي».
- source_word: οἰκοδομήσω
  choice: أبني
  rationale: ينقل معنى الفعل كما هو، دون إدخال معنى «أعيد بناءه» غير المصرح به.
theological_decisions:
- issue: كون القول جزءًا من شهادة خصوم لا تقريرًا يقرّه الراوي
  choice: إبقاء الكلام في صورة شهادة منقولة بلا شرح تفسيري
  alternative: إضافة عبارة تصرح بأن الشهود حرّفوا كلام يسوع
  rationale: النص يورد ما زعم الشهود أنهم سمعوه، ولا يحسم في هذه الآية وحدها مقدار دقة النقل.
- issue: الدلالة اللاهوتية للتقابل بين المصنوع بالأيدي وغير المصنوع بالأيدي
  choice: الحفاظ على التقابل اللفظي نفسه
  alternative: ترجمته بـ«بشري» و«إلهي»
  rationale: قد يحمل التقابل دلالة لاهوتية، لكن النص لا يصرح بتفسيرها؛ لذلك تُصان إمكانات المعنى دون حسمها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «الهيكل» للمعبد المقدس، وحُفظ توازي «المصنوع بالأيدي/غير المصنوع بالأيدي». وُضعت علامتا الحاشيتين في المتن، مع ربط حاشية التقابل بالطرف الأول وحاشية التعبير الزمني بموضع العبارة الزمنية المقصود دلاليًا.
