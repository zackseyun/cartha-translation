  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: ar
  text: 'فمزَّق رئيس الكهنة ثيابَه وقال[a]: «أيَّةُ حاجةٍ تبقى لنا إلى شهود؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية تستعمل المضارع التاريخي: «يقول».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: رئيس الكهنة
  rationale: المقابل العربي المعياري والدقيق لصاحب المنصب المفرد الذي يرأس المحاكمة في هذا السياق.
- source_word: διαρρήξας
  choice: مزَّق
  rationale: ينقل بوضوح فعل الشقّ أو التمزيق الوارد في اسم الفاعل اليوناني، من غير تعبير عتيق أو إضافة تفسيرية.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: ثيابَه
  rationale: لفظ χιτών قد يدل تحديدًا على القميص أو الثوب الداخلي، لكن الجمع في هذا المشهد يُنقل طبيعيًا بلفظ «ثيابه»، من غير تخصيصها بثياب شعائرية.
- source_word: λέγει
  choice: قال
  rationale: استُعمل الماضي الملائم للسرد العربي، مع التنبيه في الحاشية إلى أن اليونانية تستخدم المضارع التاريخي.
- source_word: Τί ἔτι χρείαν ἔχομεν
  choice: أيَّةُ حاجةٍ تبقى لنا
  rationale: صياغة عربية طبيعية تحفظ معنى ἔτι، أي بقاء حاجة أخرى أو إضافية، وتحافظ على قوة السؤال الاستنكاري دون توسيع تفسيري.
- source_word: μαρτύρων
  choice: إلى شهود
  rationale: يتطلب التعبير العربي الطبيعي «حاجة» حرف الجر «إلى»، ويحفظ معنى الشهود بصيغة الجمع.
theological_decisions:
- issue: دلالة تمزيق رئيس الكهنة ثيابه
  choice: ذُكر الفعل الحرفي من غير بيان سببه أو دلالته الشعورية والدينية.
  alternative: التصريح بأنه مزّق ثيابه غضبًا أو اعتراضًا على ما عدّه تجديفًا.
  rationale: الآية تروي الفعل والقول ولا تفسر الإيماءة صراحة؛ لذلك تُترك دلالتها للسياق من غير حسم تفسيري داخل النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «ثيابه» بوصفها تعبيرًا طبيعيًا جامعًا؛ ويمكن من حيث الدلالة المعجمية ترجمة اللفظ أيضًا بـ«أثوابه» أو، على نحو أكثر تحديدًا، «قمصانه». لم تُضف حاشية لهذا البديل كي لا يثقل النص، بينما أُثبتت حاشية المضارع التاريخي ووضعت علامتها في المتن.
