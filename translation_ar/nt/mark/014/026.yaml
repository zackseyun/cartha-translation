  rationale: تفيد الوجهة هنا، و«إلى» هي الصياغة العربية الطبيعية مع اسم المكان.
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: جبل الزيتون
  rationale: الاسم الجغرافي العربي المتداول والدقيق لهذا الموضع.
