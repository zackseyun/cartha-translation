  text: And not even in this way was their testimony consistent[a].
translation:
  language: ar
  text: وحتى بهذه الصورة لم تكن شهادتهم متَّفقة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «لم تكن متطابقة»، وحرفيًّا: «لم تكن متساوية».'
