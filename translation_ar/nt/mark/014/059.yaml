lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف يصل هذه النتيجة بما سبق من عرض الشهادة المتعارضة، ويحافظ على تتابع السرد.
- source_word: οὐδὲ
  choice: حتى ... لم
  rationale: ينقل النفي المؤكد بمعنى «ولا حتى»، مع صياغة عربية طبيعية في هذا التركيب.
- source_word: οὕτως
  choice: بهذه الصورة
  rationale: يحيل إلى صيغة الشهادة المذكورة قبلًا، ويحافظ على الدلالة الإشارية دون غموض «هكذا» المحتمل.
- source_word: ἴση
  choice: متَّفقة
  rationale: المعنى الحرفي «متساوية»، لكن السياق القضائي يدل على تطابق أقوال الشهود واتفاقها؛ و«متفقة» واضحة وطبيعية وتحفظ المقصود السياقي.
- source_word: ἦν
  choice: كانت
  rationale: فعل ماضٍ ناقص يوافق «شهادتهم» في العربية وينقل صيغة الماضي في السرد.
- source_word: ἡ μαρτυρία
  choice: شهادتهم
  rationale: تشير μαρτυρία في السياق القضائي إلى إفادة الشهود، وإضافة الاسم إلى ضمير الجمع صياغة عربية موجزة وطبيعية.
- source_word: αὐτῶν
  choice: هم في «شهادتهم»
  rationale: نُقل المضاف إليه الجمع بضمير متصل، وهو التعبير العربي الطبيعي.
