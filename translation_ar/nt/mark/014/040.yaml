  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: ar
  text: ثم جاء ثانيةً فوجدهم نائمين، لأن عيونهم كانت مثقلة[a]، ولم يعرفوا بماذا يجيبونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن عيونهم كانت ثقيلة». تفيد الصورة اليونانية أن عيونهم كان يثقلها النعاس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: ثانيةً
  rationale: تدل على تكرار مجيئه في سياق السرد، و«ثانيةً» تعبير عربي طبيعي موجز.
- source_word: ἐλθὼν
  choice: جاء
  rationale: اسم الفاعل اليوناني السابق للفعل الرئيس يُنقل طبيعيًا في العربية بفعل معطوف يحافظ على ترتيب الحدث.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: وجدهم نائمين
  rationale: يحافظ على معنى اكتشافهم وهم في حال النوم، بصياغة عربية واضحة.
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: لأن عيونهم كانت مثقلة
  rationale: ينقل سبب نومهم ويحفظ صورة العيون التي يثقلها النعاس دون إضافة لفظ «النعاس» إلى المتن.
- source_word: οὐκ ᾔδεισαν
  choice: لم يعرفوا
  rationale: ينقل دلالة المعرفة المباشرة في οἶδα، بدل تفسيرها على أنها فهم فقط.
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: بماذا يجيبونه
  rationale: صياغة عربية طبيعية للسؤال غير المباشر، وتحفظ توجيه الجواب إليه.
