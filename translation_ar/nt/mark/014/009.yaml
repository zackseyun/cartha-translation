id: MRK.14.9
reference: Mark 14:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: ar
  text: 'الحق أقول لكم: حيثما تُعلَن البشارة[a] في العالم كله، سيُذكَر أيضًا ما فعلته هذه المرأة، تذكارًا لها[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الإنجيل».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إحياءً لذكراها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: الحق
  rationale: تؤدي وظيفة اللفظة في استهلال قول جازم ذي سلطان، بصياغة عربية مألوفة وكريمة.
- source_word: δὲ
  choice: '[مفهومة من سياق الكلام]'
  rationale: أداة ربط خفيفة لا تستلزم عطفًا صريحًا هنا في العربية، ويحفظ تدفق العبارة وظيفتها الخطابية.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية تحفظ المخاطبة وصيغة المتكلم.
- source_word: ὅπου ἐὰν
  choice: حيثما
  rationale: تنقل بإيجاز دلالة المكان غير المحدد والعموم.
- source_word: κηρυχθῇ
  choice: تُعلَن
  rationale: تحفظ معنى الإعلان العلني ولا تحصر الفعل في الوعظ داخل اجتماع ديني.
- source_word: τὸ εὐαγγέλιον
  choice: البشارة
  rationale: تنقل معنى الخبر السار بلفظ عربي كتابي واضح، مع إثبات «الإنجيل» بديلًا اصطلاحيًا في الحاشية.
- source_word: εἰς ὅλον τὸν κόσμον
  choice: في العالم كله
  rationale: صياغة عربية طبيعية تؤدي الامتداد العالمي الشامل المقصود.
- source_word: καὶ
  choice: أيضًا
  rationale: 'تُظهر القوة الإضافية: إلى جانب إعلان البشارة، سيُذكر فعل المرأة.'
- source_word: ὃ ἐποίησεν αὕτη
  choice: ما فعلته هذه المرأة
  rationale: السياق يحدد أن اسم الإشارة المؤنث يعود إلى المرأة؛ والتصريح بها يزيل اللبس من غير إضافة تفسيرية.
- source_word: λαληθήσεται
  choice: سيُذكَر
  rationale: يلائم العربية في الحديث عن فعل يُروى ويُتحدث عنه، ويحفظ المبني للمجهول والاستقبال.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: تذكارًا لها
  rationale: يحافظ على البنية الاسمية ودلالة الذكر التذكاري، من غير حسم زائد لطبيعة هذا التذكار.
theological_decisions:
- issue: ترجمة εὐαγγέλιον في سياق إعلان رسالة يسوع في العالم كله
  choice: البشارة
  alternative: الإنجيل
  rationale: «البشارة» تُظهر المعنى اللغوي للخبر السار بوضوح، بينما تحفظ الحاشية المصطلح المسيحي التقليدي «الإنجيل» من غير فرض معنى طائفي.
- issue: تعيين مرجع αὕτη
  choice: هذه المرأة
  alternative: هذه / ما فعلته هي
  rationale: صيغة اسم الإشارة مؤنثة مفردة، وسياق الرواية يحيل بوضوح إلى المرأة؛ والتصريح بالمرجع يخدم الوضوح ولا يضيف تأويلًا.
- issue: دلالة εἰς μνημόσυνον αὐτῆς
  choice: تذكارًا لها
  alternative: إحياءً لذكراها
  rationale: الصياغة المختارة أقرب إلى الاسم اليوناني μνημόσυνον وتحفظ احتمال معنى التذكار أو الاستذكار، فيما تعرض الحاشية صياغة عربية أكثر تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدم المبني للمجهول في «تُعلَن» و«سيُذكَر» موافقةً للمصدر، ووُضعت علامتا الحاشية عند اللفظتين اللتين تخصهما البدائل مباشرة.
