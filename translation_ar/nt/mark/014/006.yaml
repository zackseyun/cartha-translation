  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: ar
  text: 'فقال يسوع: «اتركوها وشأنها. لماذا تسبِّبون لها العناء؟ لقد عملت لي[b] عملًا جميلًا[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عملًا صالحًا» أو «عملًا حسنًا».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «فيَّ»؛ وقد نُقلت هنا بحسب المعنى: «لي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε αὐτήν
  choice: اتركوها وشأنها
  rationale: ينقل فعل الأمر معنى الكفّ الفوري عن مضايقتها، وهو تعبير عربي طبيعي يحفظ النبرة الحمائية.
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: لماذا تسبِّبون لها العناء؟
  rationale: التركيب اليوناني يفيد إيقاع المشقة أو الإزعاج بها؛ و«العناء» يحفظ قوة κόπους دون تهوينها.
- source_word: καλὸν ἔργον
  choice: عملًا جميلًا
  rationale: تحفظ «جميلًا» اتساع καλός بين الحسن والجودة واللياقة، وتلائم تقويم يسوع لفعلها.
- source_word: ἠργάσατο
  choice: عملت
  rationale: الصياغة العربية المباشرة طبيعية مع «عملًا»، وتؤدي معنى الفعل من غير زيادة.
- source_word: ἐν ἐμοί
  choice: لي
  rationale: تؤدي المعنى العلاقي المقصود، أي إن العمل موجَّه إلى يسوع، مع إثبات الحرفية في الحاشية.
- source_word: δὲ
  choice: فـ
  rationale: الفاء تستأنف رد يسوع في السياق وتوحي بالانتقال المقابل بصورة طبيعية في السرد العربي.
theological_decisions:
- issue: دلالة καλὸν ἔργον في وصف فعل المرأة
  choice: عملًا جميلًا
  alternative: عملًا صالحًا / عملًا حسنًا
  rationale: تحفظ العبارة تقويم يسوع الإيجابي وجمال الفعل ولياقته، من غير إدخال تصور مذهبي عن الاستحقاق.
- issue: قوة ἐν ἐμοί
  choice: لي
  alternative: فيَّ / نحوي / بي
  rationale: تعبير «لي» عربي اصطلاحي يدل على توجّه الفعل إلى يسوع، بينما تُحفظ الصيغة الحرفية في الحاشية لعدم إخفاء الاحتمال التعبيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «اتركوها وشأنها» للأمر الوقائي المباشر، و«العناء» للمحافظة على قوة اللوم، مع إبقاء تعدد دلالة καλός وحرفية ἐν ἐμοί في الحواشي.
