base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: ar
  text: «فقد كان يمكن بيع هذا الطِّيب[a] بأكثر من ثلاثمئة دينار، وإعطاء ثمنه للفقراء». وكانوا يوبِّخونها بشدة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العِطر»، أو «الزيت العطري».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وكانوا يزجرونها». يدل الفعل اليوناني على استياء شديد أو توبيخ صارم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: الطِّيب
  rationale: يدل اللفظ على زيت أو مرهم عطري؛ و«الطِّيب» تعبير عربي طبيعي وفصيح يلائم المادة العطرية الثمينة في السياق.
- source_word: πραθῆναι
  choice: بيع
  rationale: مصدر ماضٍ مبني للمجهول بعد فعل الإمكان، ويؤدي تركيب «كان يمكن بيع» معنى الإمكانية التي لم تتحقق.
- source_word: ἐπάνω
  choice: بأكثر من
  rationale: مع مضاف إليه يدل على المقدار، يفيد تجاوز المبلغ المذكور.
- source_word: δηναρίων τριακοσίων
  choice: ثلاثمئة دينار
  rationale: يحافظ «دينار» على اسم العملة التاريخية من غير تحويلها إلى قيمة نقدية حديثة.
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: إعطاء ثمنه للفقراء
  rationale: المعنى السياقي أن حصيلة البيع هي التي تُعطى للفقراء؛ وإظهار «ثمنه» يجعل العربية طبيعية من غير تغيير المقصود.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: كانوا يوبِّخونها بشدة
  rationale: الفعل يفيد استياءً قويًا موجَّهًا إليها أو زجرًا صارمًا؛ و«يوبخونها بشدة» يحفظ القوة والفعل الكلامي المباشر.
- source_word: γὰρ
  choice: فقد
  rationale: تربط العبارة تعليليًا بالشكوى السابقة على نحو طبيعي في العربية.
- source_word: ἠδύνατο
  choice: كان يمكن
  rationale: ينقل الإمكانية الماضية غير المتحققة في هذا السياق.
