source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: ar
  text: اسهروا وصلّوا، لئلّا تدخلوا في تجربة.[a] أمّا الروح فمستعدة، وأمّا الجسد فضعيف.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اختبار» أو «محنة». ويمكن أن تدل الكلمة اليونانية على الإغراء بالشر أو على الاختبار والمحنة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: اسهروا
  rationale: فعل أمر للجمع يدل حرفيًا على البقاء مستيقظين، ويحمل في سياق جثسيماني أيضًا معنى التيقظ.
- source_word: προσεύχεσθε
  choice: صلّوا
  rationale: أمر جمع واضح وطبيعي، ويحافظ السياق على معنى الاستمرار في الصلاة.
- source_word: ἵνα μὴ ἔλθητε
  choice: لئلّا تدخلوا
  rationale: تنقل صيغة الغاية والمنع بإيجاز عربي طبيعي، مع إبقاء صورة الدخول الواردة في الأصل.
- source_word: εἰς πειρασμόν
  choice: في تجربة
  rationale: «تجربة» لفظ عربي كتابي طبيعي يمكن أن يشمل الإغراء بالشر والاختبار أو المحنة؛ وتوضح الحاشية هذا الاتساع الدلالي.
- source_word: τὸ μὲν πνεῦμα
  choice: أمّا الروح
  rationale: تحافظ على المقابلة التي تصنعها μέν...δέ، ويُفهم المرجع على الأرجح بوصفه روح الإنسان أو استعداده الداخلي دون إضافة تفسير داخل النص.
- source_word: πρόθυμον
  choice: فمستعدة
  rationale: تنقل معنى الاستعداد والرغبة الحاضرة، وتوافق «الروح» في العربية.
- source_word: ἡ δὲ σὰρξ
  choice: وأمّا الجسد
  rationale: «الجسد» المقابل العربي الطبيعي لـσάρξ هنا، ويحفظ مقابلة الداخل المستعد بالضعف البشري من غير إدخال مصطلح عقائدي مثل «الطبيعة الخاطئة».
- source_word: ἀσθενής
  choice: فضعيف
  rationale: يعبّر مباشرة عن الوهن والعجز البشري في مقابل استعداد الروح.
theological_decisions:
- issue: مرجع πνεῦμα
  choice: الروح البشرية أو الاستعداد الداخلي
  alternative: الروح القدس
  rationale: المقابلة المباشرة مع الجسد، وحديث يسوع إلى التلاميذ الذين غلبهم النوم، يرجحان الروح البشرية؛ لكن الترجمة تبقي لفظ «الروح» ولا تضيف تفسيرًا يحسم الاحتمال داخل المتن.
- issue: دلالة σάρξ
  choice: الجسد
  alternative: الطبيعة الخاطئة
  rationale: السياق يركز على الضعف البشري لا على تقرير عقائدي محدد عن طبيعة خاطئة؛ لذلك يحفظ «الجسد» اللفظ والتوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت المقابلة «أمّا... وأمّا...» لإظهار بنية μέν...δέ، مع صياغة موجزة تناسب خطاب يسوع المباشر.
