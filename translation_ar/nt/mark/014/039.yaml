lexical_decisions:
- source_word: πάλιν
  choice: مرة أخرى
  rationale: تؤدي معنى تكرار الفعل بعبارة عربية طبيعية وموجزة.
- source_word: ἀπελθὼν
  choice: ابتعد
  rationale: ينقل حركة يسوع بعيدًا قبل الصلاة، بصياغة عربية طبيعية تلائم سياق انسحابه للصلاة.
- source_word: προσηύξατο
  choice: صلّى
  rationale: المقابل العربي الواضح والمألوف للفعل، ولا يحتاج البناء المتوسط في اليونانية إلى تعبير مستقل هنا.
- source_word: τὸν αὐτὸν λόγον
  choice: الكلام نفسه
  rationale: يشير λόγος هنا إلى مضمون الصلاة التي كررها يسوع. و«الكلام نفسه» يحافظ على دلالة القول مع تجنب الإيحاء بأنه نطق كلمة مفردة فقط.
- source_word: εἰπών
  choice: قائلًا
  rationale: يحافظ على الصلة بين الصلاة وما قاله فيها، ويعكس اسم الفاعل اليوناني بصياغة عربية سليمة.
