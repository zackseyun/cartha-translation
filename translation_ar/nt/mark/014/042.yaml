  yaml_path: translation/nt/mark/014/042.yaml
  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: ar
  text: قوموا، لنذهب. ها إنَّ الذي يسلِّمني قد اقترب.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ها إنَّ الذي يخونني قد اقترب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: قوموا
  rationale: فعل أمر للجمع؛ والسياق يدعو التلاميذ إلى النهوض والتحرك، لا إلى مجرد الاستيقاظ.
- source_word: ἄγωμεν
  choice: لنذهب
  rationale: صيغة حثّ تشمل المتكلم ومخاطبيه، و«لنذهب» هي المقابل العربي الطبيعي الواضح.
- source_word: ἰδού
  choice: ها إنَّ
  rationale: أداة تنبيه تلفت النظر إلى ما يحدث حالًا، وهذه الصياغة فصيحة وواضحة دون تقادم.
- source_word: ὁ παραδιδούς με
  choice: الذي يسلِّمني
  rationale: اسم فاعل معرّف مستعمل اسميًا؛ و«يسلّمني» يحفظ المعنى الأساسي للفعل، أي التسليم إلى أيدي الآخرين، من غير أن يحسمه بلفظ «يخونني» وحده.
- source_word: ἤγγικεν
  choice: قد اقترب
  rationale: الفعل في صيغة التام يدل على اقتراب تمّ وله نتيجة حاضرة؛ و«قد اقترب» يحفظ هذا المعنى والإلحاح الآني.
theological_decisions:
- issue: دلالة παραδίδωμι في سياق الآلام
  choice: يسلِّمني
  alternative: يخونني
  rationale: يحافظ «يسلّمني» على الصورة الأصلية، أي تسليم يسوع إلى أيدي خصومه، مع بقاء معنى الخيانة مفهومًا من السياق دون جعله الدلالة الوحيدة.
translation_notes:
  register: عربية فصحى معاصرة، موجزة ومهيبة. وُضعت علامة الحاشية بعد الجملة التي تتصل بها، مع إبقاء أسلوب الأمر والتنبيه المباشر في النص اليوناني.
