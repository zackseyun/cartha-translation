base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: ar
  text: وفي الحال، وبينما كان لا يزال يتكلّم، أقبل يهوذا[a]، وهو واحد من الاثني عشر، ومعه جمع يحمل سيوفًا وهراوات[b]، آتٍ من عند رؤساء الكهنة والكتبة والشيوخ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جاء يهوذا». يستعمل اليوناني هنا المضارع التاريخي، حرفيًا: «يُقبل يهوذا»، لإضفاء الحيوية على السرد.'
    reason: lexical_alternative
  - marker: b
    text: اللفظ اليوناني يعني حرفيًا «قطعًا من الخشب»، والمقصود هنا هراوات أو عصي غليظة تُستعمل سلاحًا.
    reason: lexical_alternative
  - marker: c
    text: 'أو: «مرسَلًا من رؤساء الكهنة والكتبة والشيوخ». يقول اليوناني حرفيًا إن الجمع أتى «من عند» هؤلاء، بما يدل على المصدر أو التفويض من غير التصريح بطريقة إرساله.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: في الحال
  rationale: تؤدي معنى المباغتة والتتابع السريع المميّز لسرد مرقس، بعبارة عربية طبيعية واضحة.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: بينما كان لا يزال يتكلّم
  rationale: تنقل تركيب المضاف المطلق الدال على تزامن الحدثين، وتحفظ دلالة ἔτι بمعنى «لا يزال».
- source_word: παραγίνεται
  choice: أقبل
  rationale: يفيد مجيء يهوذا وظهوره في المشهد، ويصوغ المضارع التاريخي اليوناني بصيغة ماضية ملائمة للسرد العربي.
- source_word: Ἰούδας
  choice: يهوذا
  rationale: الصيغة العربية الكتابية المألوفة للاسم.
- source_word: εἷς τῶν δώδεκα
  choice: واحد من الاثني عشر
  rationale: يحفظ التعبير الموجز بوصفه تسمية معروفة للجماعة، من غير إضافة «التلاميذ» غير المذكورة صراحة.
- source_word: ὄχλος
  choice: جمع
  rationale: ينقل المعنى المعجمي المحايد نسبيًا، بينما يبيّن ذكر السيوف والهراوات عدائية السياق من غير تحميل الاسم وحده معنى «رعاع» أو «غوغاء».
- source_word: μετὰ μαχαιρῶν
  choice: يحملون سيوفًا
  rationale: «سيوف» مقابل عربي مألوف لـ μάχαιραι، وإدخال فعل «يحملون» يوضح طبيعيًا معنى المصاحبة في العربية.
- source_word: ξύλων
  choice: هراوات
  rationale: اللفظ يعني حرفيًا أشياء خشبية، لكنه في هذا السياق يشير إلى عصي غليظة مستعملة سلاحًا؛ و«هراوات» تؤدي المقصود بدقة.
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: آتين من عند رؤساء الكهنة والكتبة والشيوخ
  rationale: يحفظ معنى المصدر أو الجهة المخوِّلة في παρά مع المضاف إليه، من غير الجزم صراحة بأنهم «أُرسلوا».
- source_word: ἀρχιερέων
  choice: رؤساء الكهنة
  rationale: يشير الجمع إلى طبقة القيادة الكهنوتية، لا إلى وجود عدة رؤساء كهنة عاملين في الوقت نفسه.
- source_word: γραμματέων
  choice: الكتبة
  rationale: المقابل المباشر والمألوف للمصطلح المؤسسي، من غير توسيعه إلى «معلّمي الشريعة».
- source_word: πρεσβυτέρων
  choice: الشيوخ
  rationale: يحفظ اللقب الاجتماعي والمؤسسي للقادة المعروفين في السياق اليهودي.
theological_decisions:
- issue: صياغة المضارع التاريخي παραγίνεται
  choice: أقبل، بصيغة الماضي السردي
  alternative: يُقبل، مع إبقاء المضارع التاريخي
  rationale: المضارع اليوناني يضفي حيوية على المشهد، لكن الماضي هو الأنسب في السرد العربي الحديث؛ ولا يغيّر ذلك مضمون الحدث.
- issue: دلالة παρά مع السلطات الدينية
  choice: من عند رؤساء الكهنة والكتبة والشيوخ
  alternative: مرسَلين من رؤساء الكهنة والكتبة والشيوخ
  rationale: النص يثبت مصدر الجمع أو صلته بسلطة هؤلاء القادة، لكنه لا يصرّح بآلية الإرسال؛ لذلك تُحفظ الدلالة من غير إضافة تفصيل غير منصوص عليه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على سرعة السرد، وعلى تسمية «الاثني عشر» من غير شرح زائد، وعلى الغموض النسبي في جهة صدور الجمع. أضيف «يحملون» و«آتين» لتوضيح العلاقات النحوية طبيعيًا في العربية من غير توسيع المعنى.
