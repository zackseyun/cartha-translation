  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: ar
  text: 'فأنكر قائلًا: «لا أعرف ولا أفهم ما تقول». ثم خرج إلى الدهليز، وصاح ديك.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تحذف بعض المخطوطات عبارة: «وصاح ديك».'
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: أنكر
  rationale: الفعل هنا يفيد الإنكار أو التنصل من القول الموجَّه إليه. وصيغة «أنكر» طبيعية في العربية ولا تضطر إلى إضافة مفعول تفسيري غير مذكور صراحة في اليونانية.
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: لا أعرف ولا أفهم
  rationale: يحافظ هذا التعبير على ازدواج الفعلين الذي يشدد إنكار بطرس، مع تمييز طبيعي بين المعرفة والفهم في العربية الحديثة.
- source_word: σὺ τί λέγεις
  choice: ما تقول
  rationale: ترجمة مباشرة وطبيعية تحفظ الإحالة إلى كلام المخاطَبة من غير زيادة تفسيرية مثل «ما تقصدين».
- source_word: ἐξῆλθεν ἔξω
  choice: خرج
  rationale: يجمع الفعل العربي معنى الحركة إلى الخارج، فلا حاجة إلى تكرار من قبيل «خرج إلى الخارج»، ثم يبيّن السياق وجهته.
- source_word: προαύλιον
  choice: الدهليز
  rationale: يشير اللفظ إلى المساحة الواقعة أمام الفناء الداخلي أو عند مدخله، و«الدهليز» يؤدي معنى موضع العبور أو المدخل أفضل من «الفناء» وحدها.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: صاح ديك
  rationale: هذا هو التعبير العربي الطبيعي لصوت الديك، ويحافظ التنكير على كون الاسم في اليونانية غير معرّف.
theological_decisions:
- issue: إثبات العبارة καὶ ἀλέκτωρ ἐφώνησεν
  choice: 'أُثبتت في المتن: «وصاح ديك»'
  alternative: حذف العبارة وفق قراءة بعض المخطوطات
  rationale: يثبت نص SBLGNT المقدم العبارة مع الإشارة إلى وجود خلاف نصي؛ لذلك تُترجم في المتن ويُذكر الحذف في الحاشية حفاظًا على الشفافية النصية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، بنبرة سردية رصينة. وُضع مؤشر الحاشية بعد العبارة المختلف عليها مباشرة.
