  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: ar
  text: 'وقال لهم: «هذا هو دمي؛ دم العهد[a]، الذي يُسكب[b] لأجل كثيرين[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات والنصوص الموازية: «دمي، دم العهد الجديد». والأرجح في نص مرقس اليوناني هنا: «دمي، دم العهد».'
    reason: textual_variant
  - marker: b
    text: 'يمكن أيضًا فهم الفعل بصيغة الاستمرار: «الذي يجري سكبه»؛ والتعبير التقليدي: «الذي يُهراق».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «عن كثيرين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: هذا هو
  rationale: ينقل جملة الربط اليونانية مباشرة، من غير أن يفرض تفسيرًا مثل «هذا يعني» أو «هذا يرمز إلى».
- source_word: τὸ αἷμά μου
  choice: دمي
  rationale: صياغة عربية مباشرة تحفظ صورة الدم الصريحة في سياق العهد والذبيحة، بدل استبدالها بتفسير مثل «موتي».
- source_word: τῆς διαθήκης
  choice: دم العهد
  rationale: إعادة الاسم «دم» تجعل علاقة الإضافة واضحة وطبيعية بالعربية، وتحفظ معنى العهد دون إضافة وصف «الجديد» غير الموجود في النص اليوناني المعتمد.
- source_word: ἐκχυννόμενον
  choice: الذي يُسكب
  rationale: صيغة المبني للمجهول تحفظ صورة السكب وقيمة اسم المفعول اليوناني الحاضر، من غير استبدالها بتعبير تفسيري.
- source_word: ὑπὲρ πολλῶν
  choice: عن كثيرين
  rationale: «عن» تؤدي هنا معنى النيابة أو العمل لأجل آخرين بصورة عربية موجزة، مع إبقاء «كثيرين» كما في اليونانية وعدم تحويلها إلى «الجميع».
theological_decisions:
- issue: هل تُترجم διαθήκη بمعنى العهد أم الوصية؟
  choice: العهد
  alternative: الوصية
  rationale: سياق دم العهد يستدعي إنشاء العهد، ولا سيما لغة خروج 24:8، لذلك «العهد» هو المعنى السياقي الواضح.
- issue: هل تُضاف صفة «الجديد» إلى العهد؟
  choice: دم العهد
  alternative: دم العهد الجديد
  rationale: نص SBLGNT المعطى لا يتضمن καινῆς («الجديد»)، فلا ينبغي مواءمة مرقس مع نصوص موازية بإضافة كلمة غائبة، مع الإشارة إلى القراءة في الحاشية.
- issue: دلالة ὑπὲρ πολλῶν وعلاقتها بمدى الكفارة
  choice: عن كثيرين
  alternative: عن الجميع / لأجل كثيرين
  rationale: تحفظ الترجمة لفظ «كثيرين» كما ورد، وتترك التوتر اللاهوتي قائمًا دون حسمه باستبدال «الجميع»، كما أن «عن» تبقي معنى النيابة ممكنًا دون تفصيل عقائدي زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت صيغة «دمي، دم العهد» لتفادي ثقل «دمي للعهد» ولإظهار الإضافة بوضوح. وُضعت علامات الحواشي كلها في المتن، مع إسناد كل علامة إلى العبارة التي تشرحها.
