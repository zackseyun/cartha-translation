review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام دقيق: اقتياد يسوع إلى رئيس الكهنة، واجتماع فئات القيادة الثلاث، محفوظ. لكن الضمير في «اجتمع إليه» ليس له مقابل في اليونانية؛ فالنص يقول إنهم اجتمعوا/يتجمعون، ولا يصرّح بأنهم اجتمعوا إليه. كما أن الفعل مفرد مع فاعل جمع، والأفصح والأوضح أن يقال «اجتمع جميع...» أو «اجتمع رؤساء... والشيوخ والكتبة جميعًا».'
  naturalness: «اقتادوا» و«رئيس الكهنة» و«رؤساء الكهنة» و«الشيوخ» و«الكتبة» فصيحة وطبيعية في سياق الأناجيل. حذف «إليه» يجعل العبارة أسلس وأدق، ووضع «جميع» بعد تعداد الفئات أو قبله مع فعل مفرد يحافظ على وضوح التركيب.
  terminology: 'المصطلحات المؤسسية مناسبة ومتسقة: «رئيس الكهنة» للمفرد ἀρχιερεύς، و«رؤساء الكهنة» للجمع ἀρχιερεῖς، و«الشيوخ» و«الكتبة» لترجمة πρεσβύτεροι وγραμματεῖς. الحاشية مناسبة وتشرح المضارع التاريخي دون تحميل دلالي زائد.'
  issues:
  - severity: medium
    issue: إضافة الضمير في «اجتمع إليه»
    rationale: لا يتضمن النص اليوناني ضميرًا يعود على رئيس الكهنة، بل يذكر اجتماع رؤساء الكهنة والشيوخ والكتبة. قد يُفهم المقصود من السياق، لكنه إضافة غير منصوص عليها وينبغي حذفها.
  - severity: low
    issue: صياغة الفاعل الجمعي مع «اجتمع»
    rationale: الفعل المفرد جائز إذا تأخر الفاعل، لكن ترتيب «اجتمع جميع رؤساء الكهنة والشيوخ والكتبة» أوضح، مع بقاء «جميع» دالًا على πάντες.
  revised_text: وَاقْتَادُوا يَسُوعَ إِلَى رَئِيسِ الْكَهَنَةِ، وَاجْتَمَعَ جَمِيعُ رُؤَسَاءِ الْكَهَنَةِ وَالشُّيُوخِ وَالْكَتَبَةِ.[a]
