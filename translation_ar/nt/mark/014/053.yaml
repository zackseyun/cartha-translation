  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: ar
  text: وَاقْتَادُوا يَسُوعَ إِلَى رَئِيسِ الْكَهَنَةِ، وَاجْتَمَعَ جَمِيعُ رُؤَسَاءِ الْكَهَنَةِ وَالشُّيُوخِ وَالْكَتَبَةِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'في اليونانية: «يجتمعون»، بصيغة المضارع التاريخي التي تضفي حيوية على السرد الماضي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: اقتادوا
  rationale: ينقل معنى سوق يسوع وأخذه تحت الحراسة، من غير تحديد كيفية الاقتياد بما يتجاوز النص.
- source_word: ἀρχιερέα
  choice: رئيس الكهنة
  rationale: المفرد يشير هنا إلى صاحب المنصب الكهنوتي الأعلى، وهو التعبير العربي المألوف والواضح.
- source_word: συνέρχονται
  choice: اجتمع
  rationale: صيغ بالماضي لانسجام السرد العربي، مع توضيح المضارع التاريخي اليوناني في الحاشية.
- source_word: πάντες
  choice: جميع
  rationale: يحفظ دلالة الشمول الواردة في النص.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: يميّز جماعة القيادات الكهنوتية عن رئيس الكهنة المفرد المذكور قبلها.
- source_word: πρεσβύτεροι
  choice: الشيوخ
  rationale: يدل في هذا السياق على فئة معترف بها من قادة الشعب، لا على كبار السن عمومًا.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: ترجمة مباشرة ومألوفة في سياق الأناجيل، وتحافظ على اللقب من غير تضييقه إلى وظيفة تفسيرية واحدة.
theological_decisions:
- issue: المضارع التاريخي συνέρχονται داخل رواية ماضية
  choice: 'صيغ بالماضي: «اجتمع»'
  alternative: «يجتمع» للحفاظ على المضارع التاريخي حرفيًا
  rationale: الماضي أنسب للسرد العربي الطبيعي، ولا يغيّر مضمون الحدث؛ وقد حُفظت المعلومة الأسلوبية في الحاشية.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ورصينة. استُخدم «اقتادوا» لإبراز معنى الأخذ تحت السيطرة، وحُفظت الألقاب المؤسسية المألوفة: رئيس الكهنة، رؤساء الكهنة، الشيوخ، والكتبة.'
