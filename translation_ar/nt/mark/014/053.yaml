  rationale: حُذف «إليه» لأنه غير مذكور في الأصل اليوناني، مع الإبقاء على تسوية المضارع التاريخي إلى الماضي في العربية وتوثيق ذلك في الحاشية. ولم تُغيَّر المصطلحات الرئيسة أو معنى الآية.
