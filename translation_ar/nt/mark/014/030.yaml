  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: ar
  text: 'فيقول له يسوع[a]: «الحق أقول لك: إنك اليوم، في هذه الليلة بعينها، قبل أن يصيح ديك مرتين، ستنكرني ثلاث مرات».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يستعمل النص اليوناني هنا المضارع التاريخي: «فيقول»، لإضفاء حيوية على السرد؛ ويمكن في العربية السردية أن يقال أيضًا: «فقال».'
    reason: توضيح أسلوبي وزمني
lexical_decisions:
- source_word: λέγει
  choice: فيقول
  rationale: حُفظ المضارع التاريخي الذي يميز أسلوب مرقس، مع الفاء لوصل الحدث بسياقه السردي اتصالًا طبيعيًا في العربية.
- source_word: Ἀμὴν λέγω σοι
  choice: الحق أقول لك
  rationale: صيغة عربية واضحة وموقرة تنقل التوكيد الجازم الذي تؤديه Ἀμὴν في مطالع أقوال يسوع، وتحفظ المخاطبة المفردة.
- source_word: σὺ
  choice: إنك
  rationale: استُخدمت «إنك» لإبراز المخاطَب ونقل توكيد الضمير اليوناني الصريح من غير تكرار ثقيل للضمير في العربية.
- source_word: σήμερον ταύτῃ τῇ νυκτί
  choice: اليوم، في هذه الليلة بعينها
  rationale: حُفظ التعبيران الزمنيان كلاهما، ونقلت «بعينها» قوة اسم الإشارة والتشديد في العبارة.
- source_word: δὶς ἀλέκτορα φωνῆσαι
  choice: أن يصيح ديك مرتين
  rationale: نقل مباشر وطبيعي للبناء اليوناني، مع إبقاء «ديك» نكرة كما هو الاسم غير المعرّف في المصدر.
- source_word: τρίς με ἀπαρνήσῃ
  choice: ستنكرني ثلاث مرات
  rationale: «تنكرني» تؤدي معنى إنكار العلاقة أو التنصل منها في هذا السياق، مع الحفاظ على المقابلة العددية بين مرتين وثلاث مرات.
theological_decisions:
- issue: الجمع بين «اليوم» و«في هذه الليلة بعينها»
  choice: إبقاء التعبيرين كليهما
  alternative: دمجهما في «هذه الليلة» فقط
  rationale: النص اليوناني يوردهما معًا لتشديد قرب وقوع النبوءة؛ حذف أحدهما يزيل عنصرًا ظاهرًا من المصدر.
- issue: المضارع التاريخي في λέγει
  choice: فيقول
  alternative: فقال
  rationale: يحفظ الاختيار ملمحًا سرديًا أصيلًا في أسلوب مرقس من دون أن يغير زمن الحدث المفهوم من السياق.
- issue: معنى ἀπαρνήσῃ
  choice: ستنكرني
  alternative: ستتبرأ مني
  rationale: «ستنكرني» أوسع وأقرب إلى اللفظ اليوناني المألوف في هذا المشهد، ولا تحصر الفعل في صيغة قانونية أو طائفية خاصة.
