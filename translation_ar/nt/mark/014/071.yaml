  text: ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι ὅτι Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: ar
  text: 'لكنه أخذ يدعو باللعنات ويحلف[a]: «أنا لا أعرف هذا الرجل الذي تتحدثون عنه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يلعن ويحلف»؛ وربما كان المعنى: «يدعو باللعنة على نفسه ويحلف». لا يصرّح النص اليوناني بمَن تقع عليه اللعنة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: لكنه
  rationale: تنقل δέ السرد إلى تصعيد يحمل تباينًا خفيفًا، فـ«لكنه» تلائم السياق.
- source_word: ἤρξατο
  choice: أخذ
  rationale: «أخذ» مع المضارع تعبير عربي طبيعي عن الشروع في الفعل.
- source_word: ἀναθεματίζειν
  choice: يستنزل اللعنات
  rationale: ينقل معنى استدعاء اللعنة من غير تحديد مَن تقع عليه، إذ لا يصرّح النص اليوناني بمفعول اللعن.
- source_word: ὀμνύναι
  choice: يحلف
  rationale: يفيد أداء اليمين بعبارة عربية واضحة ومألوفة، ولا يُفهم هنا بمعنى التلفظ البذيء.
- source_word: ὅτι
  choice: علامتا الاقتباس والنقطتان
  rationale: تُدخل ὅτι مضمون الحلف والإنكار، والاقتباس المباشر هو الأسلوب العربي الطبيعي هنا.
- source_word: Οὐκ οἶδα
  choice: أنا لا أعرف
  rationale: يحافظ على المعنى المباشر للعبارة وعلى حدة إنكار بطرس.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: هذا الرجل
  rationale: يحفظ قوة اسم الإشارة τοῦτον من غير إضافة نبرة ازدراء لا يقتضيها الأصل.
- source_word: ὃν λέγετε
  choice: الذي تتحدثون عنه
  rationale: صياغة عربية حديثة وطبيعية تدل على الرجل الذي يذكره المخاطبون.
theological_decisions:
- issue: طبيعة اللعن في ἀναθεματίζειν
  choice: تصوير بطرس مستنزلًا اللعنات من غير تعيين مَن تقع عليه.
  alternative: «أخذ يلعن»، أو «أخذ يستنزل اللعنة على نفسه».
  rationale: قد يدل السياق القَسَمي على استجلاب اللعنة على النفس، لكن اليونانية لا تذكر المفعول صراحة. لذلك يحافظ المتن على الإبهام الحقيقي، وتورد الحاشية الاحتمالات.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أخذ» للدلالة الطبيعية على الشروع، وحُفظ إبهام الأصل بشأن الجهة التي تقع عليها اللعنة.
