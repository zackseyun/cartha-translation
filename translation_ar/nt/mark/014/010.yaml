  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: ar
  text: وذهب يهوذا الإسخريوطي، أحد الاثني عشر، إلى رؤساء الكهنة ليُسلِّمه إليهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يخونه بتسليمه إليهم». يمكن أن يعني الفعل اليوناني «يُسلِّم»، وكان تسليم يهوذا في هذه الحالة فعل خيانة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: ثم إن
  rationale: أداة ربط سردية تصل الحدث بما قبله؛ وصياغة «ثم إن» طبيعية في العربية وتبرز الانتقال إلى فعل يهوذا من غير إضافة تفسيرية.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: يهوذا الإسخريوطي
  rationale: نقل الاسم واللقب بصيغتهما العربية الكتابية الشائعة.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: أحد الاثني عشر
  rationale: تعبير عربي واضح يحافظ على دلالة الجماعة المعروفة، أي دائرة التلاميذ الاثني عشر.
- source_word: ἀπῆλθεν
  choice: ذهب
  rationale: فعل سردي طبيعي يؤدي معنى الحركة من دون المبالغة في دلالة المغادرة أو الانفصال.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: إلى رؤساء الكهنة
  rationale: المقصود جماعة القيادة الكهنوتية في أورشليم، و«رؤساء الكهنة» هو المقابل العربي المؤسسي الواضح.
- source_word: ἵνα
  choice: لكي
  rationale: تحافظ على دلالة الغرض التي تحملها أداة الغاية اليونانية.
- source_word: παραδοῖ
  choice: يسلّمه
  rationale: يحافظ فعل «يسلّم» على المعنى الأوسع للفعل اليوناني، أي التسليم إلى سلطة الآخرين، من غير أن يحصره في تفسير «يخون»، مع بقاء معنى الخيانة حاضرًا في السياق والحاشية.
- source_word: αὐτὸν ... αὐτοῖς
  choice: ـه ... إليهم
  rationale: أُبقي المفعول والمتلقي صريحين في البنية العربية بضميري المفرد والجمع، كما في النص اليوناني.
theological_decisions:
- issue: ترجمة παραδοῖ في سياق خيانة يهوذا
  choice: يسلّمه إليهم
  alternative: يخونه ويسلّمه إليهم
  rationale: الفعل اليوناني أوسع من معنى الخيانة وحده، ويتكرر في رواية الآلام بمعنى التسليم. تحافظ الصياغة المختارة على التوتر بين الفعل الخارجي ودلالته الأخلاقية، وتوضح الحاشية أن تسليم يهوذا كان خيانة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت صياغة سردية طبيعية، مع تجنب المصطلحات الطائفية والحفاظ على الاتساع الدلالي للفعل اليوناني.
