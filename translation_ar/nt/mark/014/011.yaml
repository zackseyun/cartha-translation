  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: ar
  text: فلما سمعوا فرحوا، ووعدوه أن يعطوه مالًا[a]. وأخذ يبحث عن طريقة يسلّمه بها[b] في وقت مناسب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فضة». قد تدل الكلمة اليونانية حرفيًا على الفضة، وتُستعمل أيضًا بمعنى المال.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يخونه». الفعل اليوناني يعني «يسلّم» أو «يدفع إلى أيدي آخرين»، ويحمل هنا معنى الخيانة بسبب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: فلما سمعوا
  rationale: تنقل العبارة قوة اسم الفاعل الزمنية مع δέ في سياق سردي عربي طبيعي، ولا تحتاج العربية هنا إلى مفعول مصرح به لأن متعلق السماع مفهوم من السياق.
- source_word: ἐχάρησαν
  choice: فرحوا
  rationale: ترجمة مباشرة وطبيعية للفعل، وتحفظ إبراز سرور رؤساء الكهنة بما سمعوه.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: وعدوه أن يعطوه مالًا
  rationale: تحفظ معنى التعهد في ἐπηγγείλαντο، وتستعمل «مالًا» للمعنى الشائع لـἀργύριον في سياق الدفع دون افتراض مقدار أو نوع من النقود.
- source_word: ἐζήτει
  choice: أخذ يبحث
  rationale: تعكس صيغة الماضي الناقص فعلًا ممتدًا بدأ عقب الوعد، وتلائم الانتقال السردي.
- source_word: πῶς
  choice: كيف
  rationale: تحفظ السؤال عن الوسيلة أو الكيفية دون إضافة تفاصيل غير مذكورة.
- source_word: εὐκαίρως
  choice: في فرصة مواتية
  rationale: تنقل معنى الظرف باعتباره ظرفًا مناسبًا أو مؤاتيًا لتنفيذ الفعل، من غير تحديد سبب ملاءمة الفرصة.
- source_word: παραδοῖ
  choice: يسلّمه
  rationale: تحفظ المعنى الأساسي الواسع للفعل παραδίδωμι، أي التسليم أو الدفع إلى سلطة آخرين، بينما يكشف السياق أن هذا التسليم خيانة؛ وذُكر البديل التفسيري في الحاشية.
theological_decisions:
- issue: دلالة παραδίδωμι في فعل يهوذا
  choice: يسلّمه
  alternative: يخونه
  rationale: «يسلّمه» أقرب إلى المجال الدلالي المباشر للفعل اليوناني وتحفظ الصلة اللفظية المتكررة في رواية الآلام، من غير طمس الطابع الخياني الذي يثبته السياق. وتوضح الحاشية أن «يخونه» ترجمة سياقية ممكنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُعمل «فلما» للربط الزمني الطبيعي، و«أخذ يبحث» لإظهار استمرار الفعل، مع إبقاء «يسلّمه» حفاظًا على الغموض الدلالي النسبي والروابط اللفظية في رواية الآلام.
