  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: ar
  text: 'لكنه عاد يُنكر. وبعد قليل، عاد الواقفون بقربه يقولون لبطرس: «حقًّا، أنت واحد منهم، فأنت أيضًا جليليّ، وطريقة كلامك[a] تشبه طريقتهم[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولهجتك تشبه لهجتهم»، أو: «وأسلوب كلامك مثل أسلوبهم». قد تشير الكلمة اليونانية λαλιά إلى طريقة الكلام أو اللهجة أو اللكنة.'
    reason: lexical_alternative
  - marker: b
    text: تحذف بعض المخطوطات عبارة «وطريقة كلامك تشبه طريقتهم».
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: فعاد ينكر
  rationale: ينقل الفعل الناقص الدال على الاستمرار أو التكرار، مع πάλιν، بصياغة عربية طبيعية دون إضافة مفعول غير مصرّح به.
- source_word: μετὰ μικρὸν
  choice: وبعد قليل
  rationale: تعبير عربي موجز وطبيعي يحفظ معنى انقضاء مدة قصيرة.
- source_word: οἱ παρεστῶτες
  choice: الواقفون هناك
  rationale: يحفظ الصورة المكانية في اسم الفاعل اليوناني، أي الموجودين واقفين في الموضع، بدل الاكتفاء بتعبير عام مثل «الحاضرون».
- source_word: ἔλεγον
  choice: أخذ ... يقولون
  rationale: ينقل دلالة الفعل الناقص على كلام متواصل أو متكرر بأسلوب عربي فصيح واضح.
- source_word: Ἀληθῶς
  choice: حقًّا
  rationale: يفيد توكيد المتكلمين وثقتهم بصحة قولهم.
- source_word: ἐξ αὐτῶν εἶ
  choice: أنت واحد منهم
  rationale: تعبير عربي اصطلاحي واضح يدل على انتماء بطرس إلى الجماعة المرتبطة بيسوع.
- source_word: καὶ γὰρ
  choice: فأنت أيضًا
  rationale: الفاء تنقل التعليل الذي تفيده γάρ، و«أيضًا» تنقل καί من غير إثقال العبارة.
- source_word: Γαλιλαῖος
  choice: جليلي
  rationale: نسبة عربية طبيعية إلى الجليل تدل على شخص من تلك المنطقة.
- source_word: ἡ λαλιά σου
  choice: طريقة كلامك
  rationale: يحفظ المجال الدلالي الواسع للكلمة، التي قد تشير إلى نمط الكلام أو اللهجة أو النبرة، دون حصرها في «اللكنة» وحدها.
- source_word: ὁμοιάζει
  choice: تشبه طريقتهم
  rationale: ينقل معنى المشابهة، مع إظهار طرف المقارنة المفهوم من السياق لتستقيم العربية؛ والضمير يعود إلى جماعة الجليليين أو أتباع يسوع بحسب فهم السياق.
theological_decisions:
- issue: مرجع المشابهة الضمني في ὁμοιάζει
  choice: طريقتهم
  alternative: تشبهها / مماثلة
  rationale: النص اليوناني لا يصرّح بمفعول للمشابهة. أُبقي المرجع عامًا بضمير الجمع بدل تعيين شخص أو لهجة بعينها، مع التنبيه في الحاشية إلى سعة معنى λαλιά.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «فعاد ينكر» و«أخذ ... يقولون» لإظهار جانب التكرار أو الاستمرار في صيغتي الماضي الناقص، ووُضعت علامتا الحاشيتين بعد العبارة التي تتعلقان بها مباشرة.
