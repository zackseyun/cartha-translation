id: MRK.14.3
reference: Mark 14:3
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: ar
  text: وبينما كان في بيت عنيا، متكئًا في بيت سمعان الأبرص، جاءت امرأة معها قارورة من المرمر، فيها طيب ناردين خالص[a] باهظ الثمن. فكسرت القارورة وسكبت الطيب على رأسه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ناردين أصيل»؛ معنى الصفة اليونانية πιστικῆς مختلف فيه.
    reason: بديل معجمي بسبب غموض صفة يونانية نادرة.
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: وبينما كان ... متكئًا
  rationale: ينشئ التركيب الإضافي المطلق خلفية الحدث ويصف حالة مستمرة؛ وهذه الصياغة العربية طبيعية وتحافظ على ذلك دون تكرار ثقيل.
- source_word: Βηθανίᾳ
  choice: بيت عنيا
  rationale: النقل العربي الشائع لاسم الموضع.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: بيت سمعان الأبرص
  rationale: يحافظ على اللقب الوارد في اليونانية ولا يضيف افتراضًا غير مصرح به، مثل كونه أبرص سابقًا.
- source_word: γυνὴ
  choice: امرأة
  rationale: المرأة غير معرّفة في هذا الموضع، ولا يذكر مرقس هنا ما يحدد هويتها.
- source_word: ἀλάβαστρον
  choice: قارورة من المرمر
  rationale: يدل الاسم على وعاء للعطر من هذا النوع؛ و«قارورة» لفظ واضح معاصر يلائم فعل الكسر والسكب.
- source_word: μύρου
  choice: طيب
  rationale: يدل على مادة عطرية زيتية أو دهنية، و«طيب» لفظ عربي فصيح مفهوم لا يقيّد القوام أكثر مما يسمح به الأصل.
- source_word: νάρδου
  choice: ناردين
  rationale: الاسم العربي المعروف للمادة العطرية النباتية، ويحافظ على خصوصية نوع الطيب.
- source_word: πιστικῆς
  choice: خالص
  rationale: الصفة نادرة ومختلف في معناها؛ «خالص» ينقل فهم النقاء أو عدم الغش، مع إثبات البديل الدال على الأصالة في الحاشية.
- source_word: πολυτελοῦς
  choice: باهظ الثمن
  rationale: يبين القيمة المالية العالية بعبارة عربية طبيعية تمهّد لرد الفعل اللاحق في السياق.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: فكسرت القارورة
  rationale: اسم الفاعل يدل على فعل سبق السكب؛ وتحويله إلى فعل سردي متتابع طبيعي في العربية دون المبالغة بلفظ «حطّمت».
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: وسكبت الطيب على رأسه
  rationale: ينقل فعل الصب ووجهته بوضوح، ويصرّح بالمفعول المفهوم من السياق لتفادي التباس الضمير في العربية.
theological_decisions:
- issue: هل يُخفف لقب سمعان بحيث لا يوحي بأنه كان لا يزال مصابًا بالبرص؟
  choice: سمعان الأبرص
  alternative: سمعان الذي كان أبرص
  rationale: النص يورده بهذا اللقب من غير تفسير. إضافة معنى «السابق» استنتاج محتمل، لكنها ليست مذكورة في الأصل، لذلك أُبقي التوتر كما هو.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «طيب» بدل تعبيرات تقنية أو قديمة أكثر غموضًا، وحُفظ لقب «الأبرص» بلا تفسير زائد. وُضع مؤشر الحاشية بعد «خالص» لأنه هو اللفظ الذي تتعلق به الحاشية.
