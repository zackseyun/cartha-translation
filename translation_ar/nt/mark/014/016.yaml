  rationale: فعل عربي واضح يفيد التجهيز والتهيئة.
- source_word: τὸ πάσχα
  choice: الفصح
  rationale: يحفظ اتساع اللفظ اليوناني، الذي قد يدل على الفصح عمومًا أو، بحسب السياق، على وجبته.
