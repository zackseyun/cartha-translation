    issue: سقوط دلالة «أجاب»
    rationale: التركيب ἀποκριθεὶς ... εἶπεν يقدّم كلام يسوع بوصفه جوابًا. اختزالُه إلى «فقال» عربيٌّ ممكن، لكنه يحذف عنصرًا موجودًا في المصدر بلا ضرورة.
  - severity: low
