  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: ar
  text: 'فأجابهم يسوع قائلاً: «أكأنكم خرجتم بسيوفٍ وعصيّ للقبض عليّ كما تخرجون على قاطع طريق؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تعني الكلمة اليونانية أيضًا «لصًّا عنيفًا» أو «متمرّدًا»؛ فلا تشير بالضرورة إلى سارق عادي فقط.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: فقال
  rationale: التركيب اليوناني صيغة سردية مألوفة لتقديم الكلام، و«فقال» تؤديه بعربية طبيعية من غير التكرار الثقيل في «أجاب وقال»، ولا يلزم من ἀποκριθείς وجود سؤال سابق.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: كما تخرجون على قاطع طريق
  rationale: يحفظ التشبيه وفكرة الخروج المسلح لمواجهة شخص خطير، ويؤدي λῃστής بما هو أوسع من «سارق» عادي.
- source_word: ἐξήλθατε
  choice: خرجتم
  rationale: صيغة الماضي تلائم الفعل اليوناني وتحافظ على الإشارة إلى مجيئهم في حملة للقبض عليه.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: بالسيوف والعصي
  rationale: «السيوف» هي المقابل الطبيعي لـ μάχαιραι في هذا المشهد، و«العصي» تبين وظيفة ξύλα كأسلحة خشبية.
- source_word: συλλαβεῖν με
  choice: للقبض عليَّ
  rationale: السياق سياق توقيف، لذلك «القبض عليَّ» أدق وأطبع من «الإمساك بي»، مع بقاء معنى الأخذ بالقوة.
theological_decisions:
- issue: الدلالة المحتملة لكلمة λῃστής
  choice: قاطع طريق في المتن، مع بيان احتمال «متمرد مسلح» في الحاشية
  alternative: لص، سارق، متمرد
  rationale: قد تدل الكلمة على لص عنيف أو قاطع طريق، وقد تُستعمل لمتمرد مسلح؛ لذا يتجنب المتن حصرها في السرقة البسيطة، وتحفظ الحاشية سعتها التاريخية من غير أن تفرض تحديدًا غير محسوم.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. صيغ السؤال بصياغة خطابية طبيعية، مع تجنب الترجمة الحرفية الثقيلة لعبارة «أجاب وقال». وُضعت علامة الحاشية بعد الآية كاملة لتفسير «قاطع طريق».
