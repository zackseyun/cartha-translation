    rationale: الأصل يربط «كما على قاطع طريق» مباشرةً بخروج الجماعة. تقديم «للقيض عليّ» قبل التشبيه في المسودة لا يغيّر المعنى الأساسي، لكنه أقل شفافية في إظهار هذا الارتباط.
