  source_fidelity: المسودة تنقل السؤال البلاغي، والخروج المسلح، وغرض القبض على يسوع نقلاً سليمًا في الجملة. لكن «فقال لهم» تسقط دلالة ἀποκριθεὶς («أجاب»)، كما أن إعادة ترتيب عناصر السؤال تجعل تشبيه «كما تخرجون على قاطع طريق» أقل التصاقًا بالفعل «خرجتم» مما هو في اليونانية.
  naturalness: العربية واضحة وفصيحة. والصياغة المعدلة «فأجابهم يسوع قائلاً» طبيعية في السرد الوقور، وتحفظ عنصر الجواب من غير تكرار حرفي ثقيل. ووضع علامة الحاشية عقب «قاطع طريق» يجعل مرجعها المباشر أوضح.
  terminology: «قاطع طريق» مقابل عربي مناسب لـ λῃστής في هذا السياق، إذ يوحي بمجرم عنيف لا بسارق عادي فقط. وتبقي الحاشية اتساع الدلالة المحتمل إلى اللص العنيف أو المتمرّد، من غير الجزم بأن أيًّا من هذه الدلالات هو المقصود حتمًا.
  issues:
