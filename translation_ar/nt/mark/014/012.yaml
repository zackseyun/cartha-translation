base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: ar
  text: 'وفي اليوم الأول من الفطير، حين كانوا يذبحون حمل الفصح[a]، قال له تلاميذه: «أين تريد أن نذهب فنُعِدَّ لك لتأكل الفصح؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «حين كانوا يذبحون الفصح». والمراد بـ«الفصح» هنا، على الأرجح، حمل الفصح الذي كان يُذبح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: في اليوم الأول من الفطير
  rationale: صياغة عربية طبيعية تحافظ على تركيب اليونانية من غير إضافة كلمة «عيد» غير المذكورة صراحة؛ و«الفطير» تسمية كتابية مفهومة للمناسبة.
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: حين كانوا يذبحون حمل الفصح
  rationale: ينقل الماضي الناقص ἔθυον بوصفه فعلًا جاريًا، ويُظهر أن πάσχα مع فعل الذبح يشير في السياق إلى ذبيحة الفصح، أي الحمل.
- source_word: λέγουσιν
  choice: قال
  rationale: المضارع التاريخي اليوناني يُنقل بالماضي في السرد العربي الطبيعي، والفاعل «تلاميذه» جمع غير عاقل لفظًا فيلائم معه الفعل المفرد المتقدم.
- source_word: Ποῦ θέλεις
  choice: أين تريد
  rationale: تعبير عربي حديث ومباشر عن الإرادة أو الرغبة في هذا السياق.
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: أن نذهب ونُعِدَّ لك
  rationale: دُمج اسم الفاعل الظرفي مع فعل الإعداد في تركيب عربي سلس يحفظ تسلسل الذهاب ثم الإعداد؛ وأُضيفت «لك» لإيضاح تعلق الإعداد بأكل يسوع، وهو مفهوم من السياق.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: لتأكل الفصح
  rationale: اللام تنقل غرض ἵνα بإيجاز طبيعي، و«الفصح» هنا يدل على وجبة الفصح في ضوء فعل الأكل.
theological_decisions:
- issue: مرجع πάσχα في موضعيه داخل الآية
  choice: تُرجم الموضع الأول «حمل الفصح» في سياق الذبح، والثاني «الفصح» في سياق الأكل.
  alternative: إبقاء اللفظين «الفصح» بلا تفسير، أو ترجمة كليهما «حمل الفصح».
  rationale: 'السياق الفعلي يحدد الدلالة: مع θύω يشير اللفظ إلى الذبيحة، ومع φάγῃς إلى وجبة الفصح. الحاشية تحفظ الصياغة الحرفية الممكنة للموضع الأول ولا تحسم أكثر مما يقتضيه السياق.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع الحفاظ على المصطلح الكتابي «الفطير». وُضع رمز الحاشية بعد الجملة التي تتصل بها، مع إبقاء التمييز السياقي بين ذبيحة الفصح ووجبته.
