  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: ar
  text: 'أَمَّا هُوَ فَظَلَّ صَامِتًا وَلَمْ يُجِبْ بِشَيْءٍ. فَسَأَلَهُ رَئِيسُ الْكَهَنَةِ مَرَّةً أُخْرَى، وَقَالَ لَهُ: «أَأَنْتَ الْمَسِيحُ[a]، ابْنُ الْمُبَارَكِ[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «المسيّا»، الممسوح المنتظر. واللفظ اليوناني هو Χριστός (خريستوس).
    reason: alternative_reading
  - marker: b
    text: «المبارك» تعبير توقيري يهودي يُقصد به الله.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: ظلَّ صامتًا
  rationale: ينقل صيغة الماضي الناقص الدالة على استمرار الصمت، بعبارة عربية طبيعية واضحة.
- source_word: ἀπεκρίνατο οὐδέν
  choice: لم يُجب بشيء
  rationale: يحفظ النفي التام في العبارة اليونانية من غير تكلف في العربية.
- source_word: πάλιν
  choice: مرةً أخرى
  rationale: يدل بوضوح على تكرار سؤال رئيس الكهنة.
- source_word: ἀρχιερεὺς
  choice: رئيس الكهنة
  rationale: المقابل العربي المألوف والدقيق للمنصب الكهنوتي اليهودي الأعلى في هذا السياق.
- source_word: ἐπηρώτα
  choice: سأله
  rationale: فعل عربي طبيعي يلائم الاستجواب في السياق، بينما يظهر معنى التكرار من «مرة أخرى»؛ ولا يلزم تحميل الماضي الناقص وحده معنى السؤال المتكرر.
- source_word: λέγει
  choice: وقال له
  rationale: عُدِل عن محاكاة المضارع التاريخي حرفيًا إلى الماضي العربي الطبيعي في السرد، مع بقاء حيوية المشهد ومضمونه.
- source_word: χριστός
  choice: المسيح
  rationale: ينقل اللقب المسياني اليهودي مباشرة، وهو المقابل العربي الراسخ الذي يحتفظ بوظيفته كلقب لا باسم شخصي محض.
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: ابن المبارك
  rationale: يحفظ التعبير اليهودي التوقيري غير المباشر عن الله، ولا يستبدله بتفسير صريح داخل المتن.
theological_decisions:
- issue: دلالة Χριστός كلقب مسياني مباشر
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الكتابي الطبيعي للقب اليوناني، ويؤدي في هذا السؤال معنى المنتظر الممسوح؛ وتوضح الحاشية إمكان التعبير بـ«المسيّا» عند الحاجة إلى إبراز الخلفية اليهودية.
- issue: ترجمة τοῦ εὐλογητοῦ بوصفه كناية توقيرية
  choice: المبارك
  alternative: الله
  rationale: الإبقاء على الكناية يحفظ الصياغة اليهودية الموقرة والتوتر الدلالي في الأصل، بدل إدخال المرجع التفسيري صراحة في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم السرد بالماضي لأنه الأفصح والأطبع عربيًا، دون محاكاة المضارع التاريخي المرقسي على نحو متكلف. أُثبتت علامتا الحاشيتين في موضعيهما الصحيحين في المتن؛ وقد صُحح ضمنيًا اضطراب ترقيم الحواشي في طبقة الاستشارة الإنجليزية، إذ كانت الحاشية الأولى تصف Χριστός مع أن علامتها ظهرت بعد جملة الصمت.
