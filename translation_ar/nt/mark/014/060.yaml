  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: ar
  text: 'فقام رئيس الكهنة وتقدَّم إلى الوسط[a]، وسأل يسوع قائلًا: «أما تجيب بشيء؟ ما الذي يشهد به هؤلاء عليك؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «إلى الوسط»، أي إنه اتخذ موضعًا في وسط المجتمعين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: قام
  rationale: ينقل الفعل الجسدي الدال على النهوض، ويحافظ على حركة السرد بصياغة عربية طبيعية.
- source_word: ὁ ἀρχιερεὺς
  choice: رئيس الكهنة
  rationale: هو المقابل العربي المألوف للمنصب اليهودي المقصود في هذا السياق القضائي.
- source_word: εἰς μέσον
  choice: وتقدَّم إلى الوسط
  rationale: حرف الجر εἰς يفيد الاتجاه إلى موضع في وسط المجلس. أُضيف الفعل «تقدَّم» لإظهار الحركة التي تفهم من التركيب اليوناني من غير الإيحاء بأنه كان قائمًا هناك أصلًا.
- source_word: ἐπηρώτησεν
  choice: سأل
  rationale: ينقل معنى توجيه السؤال بوضوح، ويترك للسياق القضائي أن يبيّن نبرة الاستجواب من غير مبالغة بلفظ أشد.
- source_word: ἀποκρίνῃ οὐδέν
  choice: أما تجيب بشيء؟
  rationale: صياغة عربية طبيعية تحفظ التحدي الاستنكاري والنفي الواردين في اليونانية.
- source_word: τί
  choice: ما الذي
  rationale: تستفهم العبارة عن مضمون الشهادة الموجهة إلى يسوع، وهي صياغة واضحة قريبة من بنية الأصل.
- source_word: οὗτοί
  choice: هؤلاء
  rationale: اسم الإشارة لجمع المذكر يحافظ على الإشارة المباشرة إلى الشهود الحاضرين من غير إدخال اسم غير مصرّح به في المتن.
- source_word: καταμαρτυροῦσιν
  choice: يشهد به ... عليك
  rationale: يحفظ المعنى القانوني للشهادة المضادة، كما يحافظ المضارع على كون الشهادة جارية في المشهد.
theological_decisions:
- issue: مرجع οὗτοί وصيغته المذكرة
  choice: هؤلاء
  alternative: هؤلاء الرجال
  rationale: «هؤلاء» في العربية صيغة جمع عاقل صالحة في السياق، وتحفظ الإشارة المباشرة من غير إضافة «الرجال» التي ليست اسمًا صريحًا في اليونانية، مع بقاء مرجعها إلى الشهود واضحًا من السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت حدة السؤالين وقصرهما، واستُعملت ألفاظ مألوفة في المشهد القضائي من غير تعبيرات مذهبية أو ألفاظ تراثية عسيرة.
