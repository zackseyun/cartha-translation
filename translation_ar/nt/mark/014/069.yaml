  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: ar
  text: 'ولما رأته الجارية، بدأت مرة أخرى تقول للواقفين هناك: «هذا واحد منهم».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίσκη
  choice: الجارية
  rationale: تدل الكلمة على فتاة خادمة، وقد تحمل في سياق العصر معنى الأَمَة. و«الجارية» موجزة وطبيعية في السرد العربي، من غير الجزم بوضعها القانوني.
- source_word: ἰδοῦσα
  choice: فلما رأته
  rationale: يؤدي معنى اسم الفاعل الماضي بوصف الرؤية ظرفًا سابقًا دفعها إلى الكلام، في صياغة عربية سردية طبيعية.
- source_word: ἤρξατο πάλιν λέγειν
  choice: بدأت تقول أيضًا
  rationale: يحفظ الفعل معنى الشروع، ويعبّر «أيضًا» عن تكرار قولها أو عودتها إلى الاتهام من غير تكلف.
- source_word: τοῖς παρεστῶσιν
  choice: للواقفين هناك
  rationale: يحفظ صورة الحاضرين الواقفين في الموضع، بدل الاكتفاء بتعبير عام مثل «للحاضرين».
- source_word: Οὗτος
  choice: هذا
  rationale: اسم الإشارة العربي كافٍ طبيعيًا للإشارة إلى بطرس، ولا يلزم إدخال «الرجل» لعدم وجود مقابل صريح له في اليونانية.
- source_word: ἐξ αὐτῶν
  choice: واحد منهم
  rationale: تعبير عربي واضح عن الانتماء إلى جماعتهم، وهو المقصود بالتركيب اليوناني.
theological_decisions: []
