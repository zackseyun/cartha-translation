  register: عربية فصحى حديثة، واضحة وكريمة، مع الحفاظ على إيقاع السرد وبنية الاتهام المباشر. لم تُضف حاشية لأن البدائل المعجمية لا تغيّر المعنى على نحو يستلزم تنبيه القارئ.
