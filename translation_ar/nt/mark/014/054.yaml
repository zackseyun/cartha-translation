  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: ar
  text: وتبعه بطرس من بعيد، حتى إلى داخل باحة رئيس الكهنة. وكان جالسًا مع الأعوان يستدفئ عند النار[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «عند النور»، ويُرجَّح أن المقصود ضوء النار المشتعلة في الباحة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: من بعيد
  rationale: تعبير عربي طبيعي يحفظ الدلالة المكانية وإيحاء التتبّع الحذر في سياق الرواية.
- source_word: ἠκολούθησεν αὐτῷ
  choice: تبعه
  rationale: ينقل الفعل الماضي السردي بوضوح وإيجاز، والضمير عائد إلى يسوع بحسب السياق.
- source_word: ἕως ἔσω εἰς
  choice: حتى دخل إلى داخل
  rationale: يحفظ التشديد المكاني في التركيب اليوناني، أي إن بطرس لم يصل إلى الباحة فحسب بل دخل إليها.
- source_word: αὐλήν
  choice: باحة
  rationale: تشير هنا إلى الفناء الداخلي في مقر رئيس الكهنة، و«باحة» لفظ عربي معاصر واضح لا يوحي بأنه دخل المبنى نفسه.
- source_word: ἀρχιερέως
  choice: رئيس الكهنة
  rationale: المقابل العربي المألوف والدقيق للقب في سياق رواية الآلام.
- source_word: ἦν συγκαθήμενος
  choice: كان جالسًا مع
  rationale: ينقل صيغة الاستمرار التي ترسم المشهد، ويعبّر حرف الجر «مع» عن عنصر المشاركة في الفعل المركب.
- source_word: τῶν ὑπηρετῶν
  choice: الأعوان
  rationale: يدل اللفظ في هذا السياق على رجال تابعين للسلطات ويؤدون مهام رسمية؛ و«الأعوان» أوسع وأدق من «العبيد» ولا تفترض أنهم جميعًا حرس.
- source_word: θερμαινόμενος
  choice: يستدفئ
  rationale: صياغة عربية موجزة وطبيعية تصف محاولة بطرس تدفئة نفسه.
- source_word: πρὸς τὸ φῶς
  choice: عند النار
  rationale: مع أن اللفظ اليوناني يعني حرفيًا «النور»، فإن فعل الاستدفاء والسياق يدلان على نار كانت مصدر ذلك النور؛ أُثبت المعنى الحرفي في الحاشية.
