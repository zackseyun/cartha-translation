  terminology: «ابن الإنسان» و«الويل» مصطلحان كتابيان راسخان ومناسبان. تكرار «ذلك الرجل» يحفظ التأكيد الموجود في النص اليوناني، و«كان خيرًا له» ينقل التقييم الافتراضي دون زيادة تفسيرية.
