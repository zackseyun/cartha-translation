reference: Mark 14:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: ar
  text: لأن ابن الإنسان يمضي كما هو مكتوب عنه، ولكن الويل لذلك الرجل الذي على يده يُسلَّم ابن الإنسان! كان خيرًا له لو لم يولد ذلك الرجل.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تؤدي الأداة هنا معنى التعليل أو التفسير المتصل بالكلام السابق، و«لأن» صياغة عربية طبيعية وواضحة.
- source_word: ὁ μὲν ... δὲ
  choice: يمضي ... ولكن الويل
  rationale: حُفظ التقابل بين الجملتين بواسطة «ولكن»، من غير إثقال العربية بمقابل صريح لـ μέν.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: نُقل اللقب بصيغته الكتابية المستقرة، مع إبقاء أصدائه ودلالاته المحتملة دون تفسير.
- source_word: ὑπάγει
  choice: يمضي
  rationale: «يمضي» تفيد الذهاب والتوجه نحو المصير المقصود، مع المحافظة على إيجاز المضارع اليوناني وعدم حصره في مغادرة مكانية.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: كما هو مكتوب عنه
  rationale: صياغة عربية مألوفة تحافظ على المقارنة وعلى دلالة النص المكتوب القائم.
- source_word: οὐαὶ
  choice: الويل
  rationale: المقابل النبوي العربي المألوف الذي يحفظ قوة التحذير والإدانة.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: لذلك الرجل
  rationale: يحفظ الإشارة إلى رجل بعينه في السياق، ولا يبدلها بتعبير عام.
- source_word: δι’ οὗ
  choice: الذي على يده
  rationale: تعبير عربي طبيعي ينقل معنى الوساطة أو الوكالة في διά مع المضاف إليه.
- source_word: παραδίδοται
  choice: يُسلَّم
  rationale: يحفظ المعنى المباشر للفعل «يُسلَّم/يُدفع» وروابطه اللفظية في رواية الآلام، فيما يبيّن السياق نفسه أن التسليم خيانة.
- source_word: καλὸν αὐτῷ
  choice: كان خيرًا له
  rationale: ينقل التقييم الافتراضي المضاد للواقع في عربية سليمة وموجزة.
- source_word: εἰ οὐκ ἐγεννήθη
  choice: لو لم يولد
  rationale: «لو» تلائم الشرط الممتنع أو المخالف للواقع، وتحافظ على معنى عدم الولادة بلا إضافة «قط» أو «أبدًا».
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: ذلك الرجل
  rationale: حُفظ تكرار الاسم والإشارة لما فيه من توكيد مهيب وتحديد للشخص.
theological_decisions:
- issue: دلالة παραδίδοται في سياق الآلام
  choice: يُسلَّم
  alternative: يُخان / يُسلَّم بخيانة
  rationale: المعنى المعجمي المباشر هو التسليم أو الدفع، والسياق يبرز خيانة يهوذا. اختيار «يُسلَّم» يصون النمط اللفظي الأوسع في رواية الآلام ولا يلغي البعد الأخلاقي الذي يظهر من السياق.
- issue: التوتر بين تحقق المكتوب ومسؤولية الفاعل
  choice: كما هو مكتوب عنه، ولكن الويل لذلك الرجل
  alternative: تفسير العبارة بما يرجّح الحتمية أو يعفي الخائن
  rationale: 'أُبقيت العبارتان جنبًا إلى جنب كما في المصدر: مسار ابن الإنسان موافق للمكتوب، وفي الوقت نفسه يقع الويل على من يسلّمه؛ فلا تُحلّ هذه العلاقة تفسيريًا داخل الترجمة.'
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. استُخدم «يمضي» بدل تعبير مكاني محض، و«على يده يُسلَّم» لصياغة طبيعية تحافظ على الوكالة والمعنى الحرفي للفعل. لا توجد حاشية لأن المتن العربي يستطيع استيعاب القراءة الحرفية بوضوح.
