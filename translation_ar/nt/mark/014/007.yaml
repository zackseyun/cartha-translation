  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: ar
  text: لأن الفقراء معكم دائمًا، ومتى شئتم تستطيعون أن تُحسنوا إليهم[a]؛ أما أنا فلست معكم دائمًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تصنعوا لهم خيرًا». يدل التعبير اليوناني على فعل ما ينفعهم، لا على مجرد الشعور بحسن النية تجاههم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: دائمًا
  rationale: ينقل معنى الاستمرار والتوافر المتواصل، ويحافظ على تكرار اللفظ والتقابل في الآية.
- source_word: γὰρ
  choice: لأن
  rationale: أداة تعليل تصل القول بما سبقه بوضوح طبيعي في العربية.
- source_word: πτωχούς
  choice: الفقراء
  rationale: صفة مستعملة استعمال الاسم للدلالة على الفقراء بوصفهم جماعة، من غير حصر المعنى في نوع معين من الاحتياج.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: معكم
  rationale: صياغة عربية طبيعية تفيد دوام وجودهم وحضورهم بينهم، من غير استعمال «تملكون» غير الملائم للأشخاص هنا.
- source_word: ὅταν θέλητε
  choice: متى شئتم
  rationale: يحفظ معنى الزمن غير المحدد المقترن بالإرادة، بأسلوب عربي واضح وموجز.
- source_word: δύνασθε
  choice: تستطيعون
  rationale: يعبّر مباشرة عن القدرة والإمكان.
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: أن تُحسنوا إليهم
  rationale: تعبير عربي مألوف ينقل معنى فعل الخير النافع تجاههم، ولا يقصره على الصدقة المالية.
- source_word: ἐμὲ δὲ οὐ πάντοτε ἔχετε
  choice: أما أنا فلست معكم دائمًا
  rationale: يحافظ على المقابلة وعلى الحاضر في النص اليوناني، مع صياغة عربية طبيعية تتجنب الإيحاء بامتلاك شخص.
theological_decisions:
- issue: احتمال فهم الكلام على أنه انتقاص من رعاية الفقراء
  choice: إبقاء التقابل بين حضور الفقراء الدائم وحضور يسوع غير الدائم في هذا الموقف، مع التصريح باستمرار إمكان الإحسان إليهم.
  alternative: فهم الكلام على أنه صرفٌ للنظر عن الفقراء لصالح التعبد ليسوع.
  rationale: النص نفسه يؤكد القدرة على الإحسان إلى الفقراء متى شاء المخاطبون؛ فالتقابل زمني وموقفي، ولا ينفي واجب الرحمة أو قيمتها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أما أنا» لإبراز المقابلة، وحُفظ تكرار «دائمًا». وُضعَت علامة الحاشية عقب العبارة التي تشرحها مباشرة.
