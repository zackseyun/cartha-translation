  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: ar
  text: 'فقال لهم: «هو واحد من الاثني عشر، الذي يغمس معي في الوعاء[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الطبق». يمكن أن تشير الكلمة اليونانية إلى وعاء أو طبق يُستخدم للأكل.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تواصل السرد، والفاء طبيعية هنا من غير أن تضيف معنى مقابلة قوية.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: ترجمة مباشرة تحفظ صيغة إدخال الكلام المنقول من غير إضافة دلالة تفسيرية.
- source_word: Εἷς τῶν δώδεκα
  choice: واحد من الاثني عشر
  rationale: تحدد الخائن بأنه من جماعة الاثني عشر المقربين، بصياغة عربية واضحة.
- source_word: ὁ ἐμβαπτόμενος
  choice: الذي يغمس
  rationale: تحفظ قوة اسم الفاعل المعرّف والفعل الجاري في سياق المائدة، من غير تحديد شيء مفعول به لا يذكره النص.
- source_word: μετ’ ἐμοῦ
  choice: معي
  rationale: تنقل معنى المصاحبة الذي تفيده μετά مع المضاف إليه.
- source_word: εἰς τὸ τρύβλιον
  choice: في الوعاء
  rationale: «الوعاء» لفظ عربي طبيعي يشمل إناء الطعام المقصود، وحرف «في» يلائم الاستعمال العربي مع فعل الغمس، مع بيان البديل المعجمي في الحاشية.
