lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: وبينما كان بطرس
  rationale: حُوِّل التركيب اليوناني المطلق بالمضاف إليه مع اسم الفاعل المضارع إلى جملة زمنية طبيعية، مع الحفاظ على معنى استمرار المشهد.
- source_word: κάτω
  choice: في الأسفل
  rationale: ينقل الموقع الأدنى مكانيًا، وربما يقابل موضع الإجراءات داخل المبنى أو في طابق أعلى، من غير إضافة ما لا يصرّح به النص.
- source_word: ἐν τῇ αὐλῇ
  choice: في ساحة الدار
  rationale: تشير αὐλή هنا إلى الفناء الداخلي التابع لدار رئيس الكهنة؛ و«ساحة الدار» تعبير عربي واضح وطبيعي.
- source_word: ἔρχεται
  choice: جاءت
  rationale: مع أن اليونانية تستعمل المضارع التاريخي، فالماضي أنسب للسرد العربي ويحفظ وقوع الحدث دون تكلّف.
- source_word: μία τῶν παιδισκῶν
  choice: واحدة من جواري
  rationale: لفظة παιδίσκη قد تدل على خادمة أو أَمَة شابة. واختيار «جارية» يحفظ في العربية إمكان الخدمة والرق معًا ولا يحسم الوضع القانوني أكثر مما يتيحه الأصل.
- source_word: τοῦ ἀρχιερέως
  choice: رئيس الكهنة
  rationale: الإضافة العربية تؤدي معنى الارتباط ببيت رئيس الكهنة أو التبعية له بإيجاز ووضوح.
