  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: ar
  text: 'وكان الذي يسلّمه قد أعطاهم علامةً متفقًا عليها[a]، قائلًا: «الذي أقبّله[b] هو المقصود. أمسكوه واقتادوه بإحكام[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي علامة تعريف اتفقوا عليها مسبقًا.
    reason: lexical_alternative
  - marker: b
    text: كانت القُبلة تحية مألوفة، وقد استخدمها يهوذا هنا علامةً للتعريف بيسوع.
    reason: cultural_note
  - marker: c
    text: 'أو: «اقتادوه بأمان». والأرجح هنا أن المقصود هو إبقاؤه تحت سيطرة محكمة.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: كان قد أعطاهم
  rationale: ينقل صيغة الماضي التام اليونانية، ويدل على أن ترتيب العلامة سبق لحظة القبض.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: الذي يسلّمه
  rationale: يحافظ على البناء الوصفي وعلى معنى التسليم في السياق، من غير حصر اللفظ في توصيف تفسيري مجرد مثل «الخائن».
- source_word: σύσσημον
  choice: علامةً متفقًا عليها
  rationale: اللفظ يدل على علامة تعريف جرى الاتفاق عليها مسبقًا، وهذه الصياغة أوضح من «علامة» وحدها للقارئ العربي.
- source_word: Ὃν ἂν φιλήσω
  choice: الذي أقبّله
  rationale: صياغة عربية طبيعية تحفظ دلالة الموصول غير المعيّن بوصفه وسيلة التعرف إلى الشخص.
- source_word: αὐτός ἐστιν
  choice: هو المقصود
  rationale: ينقل قوة التحديد والتوكيد في اليونانية بصورة عربية واضحة، من غير إضافة اسم غير وارد في النص.
- source_word: κρατήσατε
  choice: أمسكوه
  rationale: يحفظ معنى القبض الجسدي والسيطرة عليه، من غير الاقتصار على الدلالة الإجرائية لكلمة «اعتقلوه».
- source_word: ἀπάγετε ἀσφαλῶς
  choice: اقتادوه تحت حراسة مشددة
  rationale: في سياق القبض، يفيد الظرف ضمان إحكام السيطرة عليه أكثر من الحرص على سلامته؛ والصياغة العربية توضح ذلك طبيعيًا.
theological_decisions:
- issue: دلالة παραδίδωμι في وصف يهوذا
  choice: الذي يسلّمه
  alternative: الذي يخونه / الخائن
  rationale: اختير اللفظ الأوسع والأقرب إلى الفعل اليوناني، مع بقاء معنى الخيانة ظاهرًا من السياق، تجنبًا لتضييق الدلالة في النص الرئيسي.
- issue: دلالة ἀσφαλῶς
  choice: تحت حراسة مشددة
  alternative: بأمان / سالمًا
  rationale: يحفظ الاختيار احتمال «بأمان» في الحاشية، لكنه يرجّح في سياق القبض معنى تأمين المعتقل ومنع إفلاته، لا ضمان سلامته الشخصية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «يسلّمه» لصون اتساع اللفظ اليوناني، و«هو المقصود» لتقديم تعريف طبيعي مؤكد، و«تحت حراسة مشددة» لإيضاح معنى الإحكام في سياق القبض. جميع علامات الحواشي مثبتة في مواضعها في المتن.
