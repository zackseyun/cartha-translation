  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: ar
  text: وكان الفصح وعيد الفطير[b] بعد يومين[a]. وكان رؤساء الكهنة والكتبة يبحثون كيف يقبضون عليه بمكر[c] ويقتلونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو حرفيًا: «بعد يومين». يدل التعبير على أن الفصح وعيد الفطير كانا وشيكين.'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية حرفيًا: «الفطير»، وهي طريقة مألوفة للإشارة إلى عيد الفطير.'
    reason: cultural_note
  - marker: c
    text: 'أو: «يمسكون به بمكر» أو «يقبضون عليه خلسة».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: وكان
  rationale: تنقل الفعل والانتقال السردي الخفيف الذي تؤديه δέ، من غير إضافة ظرف زمني مثل «الآن».
- source_word: τὸ πάσχα
  choice: الفصح
  rationale: الاسم العربي المألوف للعيد اليهودي، والسياق يدل على العيد لا على حمل الفصح وحده.
- source_word: τὰ ἄζυμα
  choice: عيد الفطير
  rationale: اللفظ اليوناني حرفيًا «الفطير»، لكنه في هذا السياق تسمية معهودة لعيد الفطير؛ أُضيفت كلمة «عيد» للوضوح.
- source_word: μετὰ δύο ἡμέρας
  choice: بعد يومين
  rationale: ترجمة مباشرة وطبيعية للتعبير الزمني، مع إبقاء دلالته على قرب العيدين.
- source_word: ἐζήτουν
  choice: كانوا يبحثون
  rationale: صيغة الماضي المستمر تنقل دلالة الناقص على المسعى المتواصل.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: المقابل العربي الاصطلاحي للسلطات الكهنوتية العليا بصيغة الجمع.
- source_word: οἱ γραμματεῖς
  choice: الكتبة
  rationale: مقابل مباشر ومألوف للمصطلح اليوناني.
- source_word: πῶς
  choice: كيف
  rationale: تنقل السؤال عن الكيفية أو الوسيلة بوضوح.
- source_word: ἐν δόλῳ
  choice: بحيلة
  rationale: تحفظ معنى الخداع والمكر، ولا تحصره في مجرد السرية.
- source_word: κρατήσαντες
  choice: يقبضون عليه
  rationale: يناسب سياق إمساك السلطات بيسوع لاحتجازه، مع التنبيه في الحاشية إلى إمكان «يمسكون به».
- source_word: ἀποκτείνωσιν
  choice: يقتلونه
  rationale: ترجمة مباشرة للفعل من غير زيادة صبغة قضائية غير لازمة.
theological_decisions:
- issue: العلاقة بين الفصح والفطير
  choice: 'إبقاء الاسمين متميزين: «الفصح وعيد الفطير»'
  alternative: اعتبارهما اسمًا مركبًا لعيد واحد
  rationale: النص اليوناني يذكرهما كليهما صراحة، ولذلك تُحفظ التسمية المزدوجة من غير إنكار ارتباطهما الوثيق.
- issue: الطابع الأخلاقي لخطة القادة
  choice: ترجمة ἐν δόλῳ بـ«بحيلة»
  alternative: «خلسة» أو «سرًا»
  rationale: اللفظ يدل على الخداع والمكر، لا على السرية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ تسلسل الجملة اليونانية ومعناها، واستُخدم «وكان» للانتقال السردي والاستمرار، مع تجنب التفسير الطائفي أو إزالة التوتر بين دلالة الخداع ودلالة الخلسة.
