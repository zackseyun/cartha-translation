  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: ar
  text: ثم أخذ كأسًا[a]، وبعد أن شكر، أعطاهم إياه، فشربوا منه كلهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكأس». جاءت كلمة «كأس» في اليونانية بلا أداة تعريف، مع أن سياق الطعام قد يشير إلى كأس معيّنة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: أخذ
  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل على فعل يسبق الفعل الرئيس؛ وصيغة «أخذ» مع «ثم» تنقل تتابع الأحداث بعبارة عربية طبيعية من غير تكلّف.
- source_word: ποτήριον
  choice: كأسًا
  rationale: الاسم في اليونانية غير معرّف، لذلك نُقل نكرةً. ومع ذلك قد يدل سياق الطعام على كأس معيّنة، ولهذا ذُكر البديل في الحاشية.
- source_word: εὐχαριστήσας
  choice: بعد أن شكر
  rationale: تنقل العبارة بوضوح سبق الشكر لإعطاء الكأس، وتحافظ على المعنى الأساسي للفعل، أي تقديم الشكر، من غير إدخال مصطلح طقسي لاحق.
- source_word: ἔδωκεν αὐτοῖς
  choice: أعطاهم إياه
  rationale: الضمير «إياه» يعود بوضوح إلى الكأس، وهو مستفاد من السياق وإن لم يرد مفعول صريح مستقل في اليونانية.
- source_word: ἔπιον
  choice: شربوا
  rationale: مقابل عربي مباشر وطبيعي للفعل اليوناني في صيغة الماضي.
- source_word: ἐξ αὐτοῦ
  choice: منه
  rationale: الضمير يعود إلى «الكأس»، و«منه» تعبير عربي موجز وطبيعي.
- source_word: πάντες
  choice: كلهم
  rationale: يحفظ التأكيد على أن جميع الحاضرين شربوا، مع وضع اللفظ بعد الفعل على نحو عربي سليم.
theological_decisions:
- issue: الإيحاءات الإفخارستية المحتملة للفعل εὐχαριστήσας
  choice: بعد أن شكر
  alternative: بعد أن بارك؛ بعد أن قدّم صلاة الشكر
  rationale: الفعل اليوناني يدل مباشرةً على الشكر. لا تُدخل الصياغة مصطلحًا طقسيًا أو تفسيرًا مذهبيًا لاحقًا، مع بقاء دلالة السياق مفتوحة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدم ترتيب زمني طبيعي، مع الحفاظ على تعاقب أخذ الكأس والشكر وإعطائها، وتجنّب الألفاظ الطقسية التي تتجاوز دلالة النص اليوناني.
