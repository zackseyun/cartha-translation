  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: ar
  text: ولكن بعد أن أُقام[a]، سأتقدّمكم إلى الجليل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعدما أكون قد أُقمت». يستعمل النص اليوناني مصدرًا مبنيًا للمجهول من فعل «أقام»، وهو تعبير شائع عن القيامة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ولكن
  rationale: أداة استدراك تبرز التضاد مع التنبؤ السابق بتشتت التلاميذ، و«ولكن» صياغة عربية واضحة وموجزة.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: بعدما أُقام
  rationale: يحافظ التعبير على الدلالة الزمنية لـμετά مع المصدر، وعلى صيغة المبني للمجهول في فعل القيامة، مع إضمار نائب الفاعل المفرد الذي يدل عليه السياق.
- source_word: ἐγερθῆναί
  choice: أُقام
  rationale: صيغة مبنية للمجهول تحافظ على هيئة الأصل اليوناني وعلى الاستعمال الشائع للفعل في الحديث عن القيامة، دون تحويله إلى «أقوم» المبني للمعلوم.
- source_word: προάξω
  choice: سأتقدَّمكم
  rationale: يفيد الفعل الذهاب قبل الآخرين نحو وجهة؛ و«أتقدّمكم» عربية طبيعية موجزة تحفظ معنى السبق المكاني.
- source_word: ὑμᾶς
  choice: كم
  rationale: ضمير مخاطبين جمع، ويتضح عدده صراحة في اللاحقة العربية.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: إلى الجليل
  rationale: «إلى» تعبّر طبيعيًا عن الحركة نحو الوجهة، بينما «داخل الجليل» أثقل ولا يقتضيها السياق.
theological_decisions:
- issue: صياغة القيامة في ἐγερθῆναί με
  choice: بعدما أُقام
  alternative: بعدما أقوم
  rationale: اختير المبني للمجهول حفاظًا على الصيغة اليونانية وعلى إمكان دلالتها على فعل الله، من غير التصريح بالفاعل أو تحويلها إلى مبني للمعلوم.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «أُقام» بلا ذكر الفاعل للمحافظة على المبني للمجهول، و«سأتقدّمكم» لتجنب العبارة الأثقل «سأذهب أمامكم».
