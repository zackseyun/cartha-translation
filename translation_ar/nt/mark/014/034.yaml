  register: عربية فصحى حديثة، واضحة ووقورة. حُفظ المضارع التاريخي في «ويقول»، واستُعملت ألفاظ مألوفة من غير تراكيب قديمة ثقيلة. وُضعت علامات الحواشي بحسب مواضع الألفاظ التي تشرحها.
