lexical_decisions:
- source_word: λέγει
  choice: ويقول
  rationale: حُفظ المضارع التاريخي الذي يميز سرد مرقس ويضفي عليه حيوية، بدل تحويله إلى الماضي.
- source_word: Περίλυπός
  choice: حزينة جدًا
  rationale: تعبير عربي واضح وطبيعي يدل على شدة الحزن والكرب من غير تهوين أو مبالغة تفسيرية.
- source_word: ψυχή
  choice: نفسي
  rationale: يحفظ المقابل المباشر لكلمة ψυχή، ويعبّر هنا عن باطن يسوع وشخصه في شدة الكرب.
- source_word: ἕως θανάτου
  choice: حتى الموت
  rationale: يحافظ على إيجاز العبارة اليونانية وقوتها، وعلى احتمال دلالتها على حزن بالغ الغاية أو واصل إلى حد الموت.
- source_word: μείνατε
  choice: ابقوا
  rationale: صيغة أمر طبيعية وواضحة تدل على الاستمرار في المكان.
- source_word: ὧδε
  choice: هنا
  rationale: المقابل العربي المباشر والطبيعي للظرف المكاني.
- source_word: γρηγορεῖτε
  choice: اسهروا
  rationale: يحمل معنى عدم النوم مع اليقظة والانتباه، وبذلك يحفظ اتساع الأمر في هذا السياق.
theological_decisions:
- issue: دلالة ψυχή في قول يسوع
  choice: نفسي
  alternative: ذاتي؛ حياتي
  rationale: تحفظ «نفسي» العمق الإنساني والوجداني للعبارة من غير إدخال شرح عقائدي في النص أو اختزالها في مجرد الحياة الجسدية.
- issue: مدى دلالة γρηγορεῖτε
  choice: اسهروا
  alternative: ابقوا مستيقظين؛ كونوا يقظين
  rationale: اللفظ يمكن أن يشمل الاستيقاظ الحرفي واليقظة الحارسة معًا؛ لذلك تُرك هذا الاتساع قائمًا ولم يُحصر في أحد المعنيين.
- issue: دلالة ἕως θανάτου
  choice: حتى الموت
  alternative: إلى حد الموت
  rationale: 'الصياغة المختارة تحفظ التوتر في العبارة: فقد تصف شدة الحزن إلى أقصى حد، أو بلوغه حد الموت، من غير حسم زائد.'
