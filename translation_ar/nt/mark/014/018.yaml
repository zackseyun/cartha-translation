  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: ar
  text: 'وبينما كانوا متكئين[a] ويأكلون، قال يسوع: «الحق أقول لكم[b]: إن واحدًا منكم سيسلّمني[c]، وهو الذي يأكل معي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان الاتكاء هو الهيئة المعتادة عند تناول وليمة رسمية.
    reason: cultural_note
  - marker: b
    text: 'حرفيًا: «آمين، أقول لكم».'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا ترجمتها: «سيخونني». والفعل اليوناني يعني أن يسلّم أو يدفع إلى أيدي آخرين، وهنا يتم ذلك خيانةً من أحد رفقاء يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: كانوا متكئين
  rationale: يحفظ هيئة الاتكاء المعتادة في الولائم الرسمية في العالم القديم، بدل تحويلها إلى الجلوس على المائدة.
- source_word: ἐσθιόντων / ὁ ἐσθίων
  choice: يأكلون / الذي يأكل
  rationale: ترجمة مباشرة للفعل، مع صياغة اسم الفاعل المعرّف في آخر الآية بجملة موصولة طبيعية.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صيغة عربية راسخة وواضحة تؤدي قوة الاستهلال التوكيدي الذي يستعمله يسوع، مع إثبات البديل الحرفي في الحاشية.
- source_word: εἷς ἐξ ὑμῶν
  choice: واحدًا منكم
  rationale: تعبير عربي طبيعي يحفظ معنى أن الشخص واحد من أفراد الجماعة.
- source_word: παραδώσει
  choice: سيسلّمني
  rationale: يحفظ المعنى الأساسي للفعل، أي التسليم إلى أيدي آخرين، ولا يحصر اللفظ في التفسير الأخلاقي «يخونني»، مع بيان ذلك في الحاشية.
- source_word: μετ’ ἐμοῦ
  choice: معي
  rationale: المقابل العربي المباشر والطبيعي لمعنى المصاحبة.
theological_decisions:
- issue: دلالة παραδώσει في سياق الآلام
  choice: سيسلّمني
  alternative: سيخونني
  rationale: الفعل اليوناني يدل أساسًا على التسليم أو الدفع إلى يد آخر، لكن السياق يجعل هذا التسليم خيانة من رفيق مائدة. اختيار «سيسلّمني» يصون المجال الدلالي والتوتر السياقي، والحاشية توضح معنى الخيانة دون جعله المعنى المعجمي الوحيد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «متكئين» للمحافظة على المشهد التاريخي، و«سيسلّمني» للمحافظة على سعة اللفظ اليوناني، مع حواشٍ قصيرة تشرح الخلفية الثقافية والبدائل المعجمية.
