base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: ar
  text: كنتُ معكم يومًا بعد يوم في الهيكل[a] أعلِّم، ولم تقبضوا عليَّ[b]. لكن كان ذلك لكي تتحقق الكتب المقدسة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود بـ«الهيكل» هنا مجمّع الهيكل وساحاته، لا البناء الداخلي المقدس وحده.
    reason: cultural_note
  - marker: b
    text: 'أو: «ولم تمسكوا بي».'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «لكن لكي تتحقق الكتب المقدسة». العبارة اليونانية موجزة، وفعل الجملة الرئيس مقدَّر فيها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: يومًا بعد يوم
  rationale: ينقل التعبير التوزيعي الدال على التكرار والاستمرار، بصياغة عربية طبيعية.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: كنتُ معكم
  rationale: يعبّر عن وجود يسوع العلني بينهم من غير تحميل حرف الجر معنى مكانيًا أدق مما يقتضيه السياق.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: «ἱερόν» يدل هنا على مجمّع الهيكل وساحاته، لا على المقدس الداخلي وحده؛ وأُبقي التعبير المألوف في المتن مع توضيحه في الحاشية.
- source_word: διδάσκων
  choice: أعلِّم
  rationale: يحافظ على دلالة اسم الفاعل الحاضر في نشاط التعليم المستمر، ويأتي طبيعيًا بعد «كنتُ معكم».
- source_word: οὐκ ἐκρατήσατέ με
  choice: لم تقبضوا عليَّ
  rationale: يفيد «κρατέω» الإمساك أو القبض، وسياق توقيف يسوع يرجّح «القبض» من غير جعله مصطلحًا قانونيًا تقنيًا.
- source_word: ἀλλ’ ἵνα
  choice: لكن كان ذلك لكي
  rationale: العبارة اليونانية موجزة وحذف منها الفعل الرئيس؛ أُضيف «كان ذلك» لاستقامة العربية، مع بيان الحذف في الحاشية.
- source_word: πληρωθῶσιν
  choice: تتمّ
  rationale: ينقل المبني للمجهول في صيغة الغاية/النتيجة بمعنى بلوغ ما في الأسفار تمامه، من غير تشديد دلالة الحتمية beyond ما يقوله النص.
- source_word: αἱ γραφαί
  choice: الكتب المقدسة
  rationale: يشير الجمع هنا إلى كتابات إسرائيل المعترف بها بوصفها أسفارًا مقدسة، والتعبير العربي مستقر وواضح.
theological_decisions:
- issue: الجملة الغائية المحذوف فعلها وعلاقتها بالقصد الإلهي
  choice: لكن كان ذلك لكي تتمّ الكتب المقدسة
  alternative: لكن لكي تتمّ الكتب المقدسة
  rationale: اليونانية تترك الفعل الرئيس مقدّرًا بعد «لكن لكي». إضافة «كان ذلك» تجعل العبارة عربية سليمة من غير تعيين فاعل الحدث أو صياغة تقرير أقوى عن الحتمية، بينما تحفظ الحاشية البنية الأقرب إلى الأصل.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع إبقاء إيقاع المواجهة المباشر. استُخدم «الهيكل» و«الكتب المقدسة» لرسوخهما في الاستعمال العربي، ووُضِّحت حدود دلالتهما عند الحاجة.
