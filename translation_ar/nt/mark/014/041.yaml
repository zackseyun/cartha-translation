  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: ar
  text: 'ثم جاء للمرة الثالثة وقال لهم: «أما زلتم نائمين ومستريحين؟[a] كفى[b]؛ قد أتت الساعة. ها إن ابن الإنسان يُسلَّم إلى أيدي الخطاة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة قولًا تهكميًّا أو إذنيًّا: «ناموا الآن واستريحوا». فالعبارة اليونانية تحتمل هذا المعنى كما تحتمل الاستفهام التوبيخي.'
    reason: alternative_reading
  - marker: b
    text: '«كفى» ترجمة لعبارة يونانية صعبة. ومن المقترحات: «هذا يكفي»، أو—وهو أضعف احتمالًا هنا—معنى تجاري مثل «استُوفي الثمن».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: ثم جاء في المرة الثالثة
  rationale: استُعمل الماضي العربي الطبيعي في السرد، مع حفظ دلالة المجيء للمرة الثالثة.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: أما زلتم نائمين ومستريحين؟
  rationale: صياغة استفهامية توبيخية طبيعية بالعربية، مع إبقاء احتمال القول التهكمي أو الإذني في الحاشية لأن اليونانية تحتمل الوجهين.
- source_word: ἀπέχει
  choice: كفى
  rationale: تعبير موجز يلائم الانتقال الحاسم في السياق، مع التنبيه في الحاشية إلى صعوبة اللفظة وبدائلها.
- source_word: ἦλθεν ἡ ὥρα
  choice: قد أتت الساعة
  rationale: يحفظ صورة «الساعة» ودلالتها على الموعد الحاسم بدل تسويتها إلى «الوقت».
- source_word: ἰδοὺ
  choice: ها إن
  rationale: أداة تنبيه عربية فصيحة معاصرة تؤدي القوة الإشارية دون نبرة عتيقة ثقيلة.
- source_word: παραδίδοται
  choice: يُسلَّم
  rationale: يحفظ المعنى الأوسع للفعل، أي التسليم إلى سلطة آخرين، ولا يضيّقه إلى الخيانة وحدها.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة العربية المعيارية لهذا اللقب، وتحفظ طابعه الاصطلاحي.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: إلى أيدي الخطاة
  rationale: يحفظ الصورة الملموسة للوقوع في سلطان الخطاة.
theological_decisions:
- issue: قوة Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'استفهام توبيخي: «أما زلتم نائمين ومستريحين؟»'
  alternative: 'قول تهكمي أو إذني: «ناموا الآن واستريحوا»'
  rationale: علامات الترقيم ليست أصلية، وصيغتا الفعل تحتملان في السياق الاستفهام التوبيخي أو الإذن التهكمي؛ اختير الاستفهام لوضوحه بالعربية مع حفظ البديل في الحاشية.
- issue: معنى ἀπέχει
  choice: كفى
  alternative: «هذا يكفي» أو، باحتمال أضعف هنا، معنى تجاري مثل «استُوفي الثمن»
  rationale: اللفظة صعبة، و«كفى» أنسب للانتقال السردي من نوم التلاميذ إلى حلول الساعة دون استيراد معنى تقني تخميني.
- issue: ترجمة παραδίδοται
  choice: يُسلَّم
  alternative: يُخان / يُدفع
  rationale: «يُسلَّم» يبقي مجال الفعل السردي واللاهوتي أوسع، فلا يحصر الفاعلية في خيانة يهوذا وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بجمل موجزة توافق حدة المشهد. وُضعت علامة الحاشية [a] مباشرة بعد العبارة المختلف في قوتها، و[b] بعد تمام الاقتباس لتوضيح «كفى» دون تشويش المتن.
