  text: 'فقام بعضهم يشهدون عليه زورًا قائلين:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί
  choice: فـ
  rationale: أداة ربط سردية تواصل تتابع الأحداث في أسلوب مرقس، وصيغة «فقام» طبيعية وواضحة بالعربية.
- source_word: τινες
  choice: بعضهم
  rationale: تحافظ على عدم تعيين الأشخاص، مع إحالة طبيعية إلى الحاضرين في السياق.
- source_word: ἀναστάντες
  choice: قام
  rationale: ينقل معنى النهوض أو الوقوف في مشهد قضائي بصياغة عربية مألوفة.
- source_word: ἐψευδομαρτύρουν
  choice: أخذوا يشهدون زورًا
  rationale: ينقل المعنى القضائي ويحافظ قدر الإمكان على الجانب الاستمراري للفعل الناقص، إذ تدل «أخذوا» مع المضارع على بدء فعل ممتد.
- source_word: κατ’ αὐτοῦ
  choice: عليه
  rationale: 'يفيد الاتجاه العدائي للشهادة في السياق القضائي، وهو التعبير العربي الطبيعي: «شهد عليه».'
- source_word: λέγοντες
  choice: 'قائلين:'
  rationale: يقدّم مضمون الشهادة الوارد بعده، وتناسب النقطتان بدء القول المباشر في الآية التالية.
