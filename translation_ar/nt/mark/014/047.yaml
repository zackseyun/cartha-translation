  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: ar
  text: لكن واحدًا من الواقفين هناك استلَّ سيفه، وضرب عبدَ رئيس الكهنة[a]، فقطع أذنه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خادم». اللفظة اليونانية δοῦλος قد تدل على عبد أو خادم تابع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: لكن واحدًا
  rationale: يحافظ على عدم تعيين الشخص، وينقل δέ بوصفها انتقالًا سرديًا ذا مسحة مقابلة خفيفة، من غير إضافة هوية لا يذكرها مرقس.
- source_word: τῶν παρεστηκότων
  choice: من الواقفين هناك
  rationale: ينقل معنى الحاضرين الواقفين في الموضع بصياغة عربية طبيعية، مع إبقاء الدلالة المكانية.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: استلَّ سيفه
  rationale: الفعل في سياق السلاح يعني إخراجه من غمده، و«استلَّ» تعبير عربي واضح ودقيق؛ واستُعمل ضمير الملكية طبيعيًا بدل أداة التعريف اليونانية.
- source_word: ἔπαισεν
  choice: ضرب
  rationale: ينقل فعل الضرب العنيف بلفظ عربي مباشر غير متكلف.
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: عبدَ رئيس الكهنة
  rationale: «عبد» يحفظ دلالة التبعية الاجتماعية والقانونية في δοῦλος بدرجة أوضح من «خادم»، والإضافة العربية تنقل علاقة الشخص برئيس الكهنة من غير تقرير تفاصيل تتجاوز النص.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: فقطع أذنه
  rationale: مع أن ἀφαιρέω يعني في الأصل الإزالة أو الأخذ، فإن نتيجة الضربة في هذا السياق تُعبَّر عنها طبيعيًا بـ«قطع». ولا تُنقل صيغة التصغير في ὠτάριον لأنها تعني هنا ببساطة «الأذن»، كما لا تُضاف جهة الأذن من الروايات الموازية.
theological_decisions:
- issue: ترجمة δοῦλος في سياق المكانة الاجتماعية
  choice: عبد
  alternative: خادم
  rationale: اختير «عبد» في المتن لأنه يحفظ احتمال الاستعباد والتبعية القوية الذي تحمله اللفظة اليونانية، بينما ذُكر «خادم» في الحاشية بوصفه بديلًا عربيًا ممكنًا من غير تلطيف صامت للدلالة الاجتماعية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة سردية كريمة. استُعمل «استلَّ» لدقته وشيوعه في وصف إخراج السيف، وتُرك الفاعل مجهول الهوية كما في نص مرقس.
