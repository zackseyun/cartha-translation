lexical_decisions:
- source_word: αὐτὸς
  choice: هو بنفسه
  rationale: يحفظ توكيد الضمير اليوناني من غير إثقال العبارة.
- source_word: δείξει
  choice: سيريكم
  rationale: ينقل صيغة المستقبل ومعنى الإظهار، ويضمّن المفعول غير المباشر ὑμῖν بصورة طبيعية.
- source_word: ἀνάγαιον
  choice: عُلِّيَّة
  rationale: لفظ عربي فصيح ومفهوم يدل على غرفة في الجزء العلوي من البيت.
- source_word: μέγα
  choice: كبيرة
  rationale: ينقل الوصف المباشر لحجم الغرفة.
- source_word: ἐστρωμένον
  choice: مفروشة
  rationale: يحفظ صورة ما بُسط وهُيّئ في الغرفة، ويمكن أن يفيد تجهيزها دون تحديد محتويات بعينها.
- source_word: ἕτοιμον
  choice: جاهزة
  rationale: ينقل معنى الاستعداد، مع تجنب تكرار جذر «أعدّ» الوارد في الأمر اللاحق.
- source_word: ἐκεῖ
  choice: هناك
  rationale: المقابل الطبيعي لظرف المكان اليوناني.
- source_word: ἑτοιμάσατε
  choice: أَعِدّوا
  rationale: صيغة أمر للجمع تنقل مطالبة التلميذين بالقيام بالترتيبات اللازمة.
- source_word: ἡμῖν
  choice: لنا
  rationale: يحفظ الضمير كما هو من غير توسيع تفسيري لهوية الجماعة.
