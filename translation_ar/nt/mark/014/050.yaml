  yaml_path: translation/nt/mark/014/050.yaml
  text: And leaving him, they all fled.
translation:
  language: ar
  text: فتركوه وفرّوا جميعًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: فـ
  rationale: تفيد الفاء وصل هذا الحدث مباشرةً بمشهد القبض السابق، وتحافظ على سرعة السرد من غير إضافة تفسير سببي مستقل.
- source_word: ἀφέντες
  choice: تركوه
  rationale: اسم الفاعل اليوناني يدل هنا على ترك يسوع وراءهم. وصيغة «تركوه» طبيعية وموجزة في العربية، ولا تضيف إلى اللفظ شدة «تخلّوا عنه» أو «هجروه».
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير المفعول يعود بوضوح في السياق إلى يسوع، وإلحاقه بالفعل هو التعبير العربي الطبيعي.
- source_word: ἔφυγον
  choice: فرّوا
  rationale: ينقل فعل φεύγω معنى الهرب من الخطر بعبارة عربية فصيحة موجزة تلائم جدية المشهد.
- source_word: πάντες
  choice: جميعًا
  rationale: يحفظ شمول الهرب لكل من كان معه، مع وضع لفظ الشمول بعد الفعل على نحو طبيعي في العربية.
theological_decisions:
- issue: مدى ترك رفاق يسوع له
  choice: فرّوا جميعًا
  alternative: فرّوا كلهم
  rationale: تحافظ الصياغة على تأكيد النص أن الجميع هربوا في تلك اللحظة، من غير تلطيف للمعنى أو توسيع له إلى ما يتجاوز السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على إيقاع مرقس السريع والتتابع المباشر بين ترك يسوع والفرار.
