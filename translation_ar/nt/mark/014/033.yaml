  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: ar
  text: وأخذ معه بطرس ويعقوب ويوحنا، وبدأ يضطرب بشدة[a] ويكترب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يرتاع ويكترب». قد يدل الفعل الأول هنا على ارتياع شديد أو صدمة أو اضطراب عميق.'
    reason: بديل معجمي يحفظ اتساع دلالة ἐκθαμβεῖσθαι في هذا السياق.
lexical_decisions:
- source_word: παραλαμβάνει
  choice: أخذ معه
  rationale: ينقل معنى اصطحاب أشخاص مختارين. وصيغ الماضي أنسب للسرد العربي الطبيعي، مع أن اليونانية تستخدم المضارع التاريخي لإضفاء الحيوية.
- source_word: μετ’ αὐτοῦ
  choice: معه
  rationale: تعبير عربي موجز وواضح يفيد أن بطرس ويعقوب ويوحنا رافقوا يسوع.
- source_word: ἤρξατο
  choice: بدأ
  rationale: يحفظ الدلالة الابتدائية للفعل ويُظهر تطور الحدث كما في المصدر.
- source_word: ἐκθαμβεῖσθαι
  choice: يضطرب بشدة
  rationale: ينقل شدة الصدمة أو الاضطراب في سياق جثسيماني من غير حصر اللفظ في مجرد الدهشة ولا المبالغة إلى معنى الرعب وحده.
- source_word: ἀδημονεῖν
  choice: يشعر بالكرب
  rationale: يعبّر بلغة عربية طبيعية عن الضيق النفسي الحاد، ويحافظ على تمييزه من الفعل السابق.
- source_word: καὶ ... καὶ
  choice: و... و
  rationale: حُفظ تتابع حروف العطف بقدر ما تسمح به العربية ليبقى الإيقاع التراكمي في أسلوب مرقس.
theological_decisions:
- issue: وصف حالة يسوع النفسية في جثسيماني
  choice: بدأ يضطرب بشدة ويشعر بالكرب
  alternative: بدأ يرتاع ويشعر بالكرب
  rationale: تثبت الصياغة حقيقة الضيق الإنساني العميق الذي اختبره يسوع، من غير تخفيفه أو إضافة تفسير لاهوتي لا يصرح به النص. كما تُبقي مدى الفعل الأول مفتوحًا بين الاضطراب الشديد والارتياع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم الماضي للسرد الطبيعي، وحُفظ الفعلان المنفصلان للتعبير عن شدة الحالة وتعدد جوانبها.
