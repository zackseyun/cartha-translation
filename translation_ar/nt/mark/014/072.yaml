  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: ar
  text: 'وفي الحال صاح ديك للمرة الثانية. فتذكَّر بطرس القول الذي قاله له يسوع: «قبل أن يصيح ديك مرتين، ستنكرني ثلاث مرات». فانهار وأخذ يبكي.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولما فكّر في الأمر، أخذ يبكي». اللفظة اليونانية المترجمة «فانهار» صعبة، وقد فُهمت بطرائق متعددة، منها التفات داخلي بالفكر أو حركة جسدية ظاهرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: في الحال
  rationale: ينقل معنى الفورية ويحافظ على إيقاع مرقس السريع بعبارة عربية طبيعية.
- source_word: ἐκ δευτέρου
  choice: للمرة الثانية
  rationale: يحفظ التعداد الصريح في اليونانية بوضوح.
- source_word: ἀλέκτωρ ... ἐφώνησεν
  choice: صاح ديك
  rationale: الفعل العربي المألوف لصوت الديك هو «صاح»، مع إبقاء الاسم نكرة كما في الأصل.
- source_word: ἀνεμνήσθη
  choice: تذكَّر
  rationale: المقابل العربي المباشر والطبيعي للفعل في هذا السياق السردي.
- source_word: τὸ ῥῆμα ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: القول الذي قاله له يسوع
  rationale: «القول» أنسب عربيًا من الترجمة الحرفية «الكلمة»، والجملة الموصولة توضّح مضمون ما تذكّره بطرس دون تكلّف.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: قبل أن يصيح ديك مرتين
  rationale: ينقل تركيب πρίν مع المصدر إلى جملة زمنية عربية سليمة، ويحفظ تنكير الديك وعدد الصياح.
- source_word: τρίς με ἀπαρνήσῃ
  choice: ستنكرني ثلاث مرات
  rationale: «تنكرني» يحفظ المعنى العلاقي المباشر للفعل دون إضافة تفسير عقائدي.
- source_word: ἐπιβαλών
  choice: فانهار
  rationale: تعبير اصطلاحي موجز ينقل الانهيار العاطفي المرجح في السياق، مع توثيق غموض اللفظة في الحاشية.
- source_word: ἔκλαιεν
  choice: أخذ يبكي
  rationale: ينقل الجانب الاستمراري للفعل الناقص اليوناني إلى عربية طبيعية، أي بدء البكاء واستمراره.
theological_decisions:
- issue: دلالة اسم الفاعل الصعب ἐπιβαλών وكيفية تصوير استجابة بطرس
  choice: فانهار وأخذ يبكي
  alternative: 'وقد تُفهم العبارة بمعنى: «ولما فكّر في الأمر، أخذ يبكي»، أو على أنها تشير إلى حركة جسدية خارجية.'
  rationale: الاختيار ينقل الشدة العاطفية التي يقتضيها السياق من غير أن يفرض حركة جسدية بعينها أو يجعل التوبة تفسيرًا عقائديًا صريحًا؛ وتُحفظ الاحتمالات المعجمية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «في الحال» للمحافظة على سرعة السرد، و«أخذ يبكي» لإظهار الاستمرار. وُضعت علامة الحاشية بعد الجملة التي تتعلق بها لأنها تشرح ἐπιβαλών.
