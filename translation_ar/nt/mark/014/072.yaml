  source_fidelity: 'ينقل النص تسلسل اليونانية ومعناه بدقة: فورية صياح الديك للمرة الثانية، وتذكّر بطرس قول يسوع، وإنكاره ثلاث مرات، ثم بكاؤه. وتحافظ «للمرة الثانية» و«مرتين» على التعداد الصريح في الأصل. وتعالج «فانهار» اسم الفاعل ἐπιβαλών بوصفه تعبيرًا تفسيريًا مقبولًا مع إظهار صعوبته واحتمالاته في الحاشية.'
