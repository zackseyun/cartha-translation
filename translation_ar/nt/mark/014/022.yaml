  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: ar
  text: 'وفيما كانوا يأكلون، أخذ خبزًا وباركه، ثم كسره وأعطاهم إياه، وقال: «خذوا؛ هذا هو جسدي».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحسب التفسير: «هذا يمثّل جسدي» أو «هذا يعني جسدي». أما العبارة اليونانية فحرفيًا: «هذا هو جسدي».'
    reason: بيان احتمال تفسيري مع الحفاظ على الصياغة الحرفية في المتن وعدم حسم دلالتها اللاهوتية.
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: وفيما كانوا يأكلون
  rationale: تركيب المضاف المطلق مع اسم الفاعل المضارع يدل على فعل مستمر ومتزامن مع الأحداث التالية، وهذه الصياغة عربية طبيعية تحفظ ذلك المعنى.
- source_word: λαβὼν ἄρτον
  choice: أخذ خبزًا
  rationale: حُوِّل اسم الفاعل الماضي إلى فعل سردي تام بما يلائم العربية، وتُرجم ἄρτον غير المعرّف بـ«خبزًا» من غير تخصيصه برغيف.
- source_word: εὐλογήσας
  choice: وباركه
  rationale: يدل الفعل في سياق الطعام على النطق بالبركة على الخبز؛ وأُظهر مفعوله المفهوم من السياق طلبًا للوضوح.
- source_word: ἔκλασεν
  choice: ثم كسره
  rationale: يشير الفعل إلى كسر الخبز، وأُضيفت «ثم» لإظهار تتابع الأفعال طبيعيًا في العربية من غير تغيير جوهر المعنى.
- source_word: ἔδωκεν αὐτοῖς
  choice: وأعطاهم إياه
  rationale: المفعول به مفهوم في اليونانية من السياق، وقد صُرّح به في العربية لتستقيم العبارة بوضوح.
- source_word: Λάβετε
  choice: خذوا
  rationale: صيغة أمر مباشرة موجّهة إلى التلاميذ، ولا حاجة إلى إضافة مفعول صريح غير موجود في اليونانية.
- source_word: τοῦτό ἐστιν
  choice: هذا هو
  rationale: يحفظ فعل الكينونة اليوناني بصياغة عربية مباشرة، من غير استبداله بتفسير مثل «يمثّل» أو «يعني».
- source_word: τὸ σῶμά μου
  choice: جسدي
  rationale: ترجمة مباشرة وطبيعية لـσῶμα مع ضمير المتكلم، ولا يقتضي السياق إدخال تفسير مجازي في المتن.
theological_decisions:
- issue: صياغة قول يسوع عن الخبز في العشاء
  choice: «هذا هو جسدي»
  alternative: «هذا يمثّل جسدي» أو «هذا يعني جسدي»
  rationale: النص اليوناني يستعمل فعل الكينونة العادي ἐστιν؛ لذلك تُحفظ العبارة المباشرة وما فيها من توتر تفسيري ولا يُحسم الخلاف اللاهوتي داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، بسرد طبيعي ومفردات مألوفة. وُضعت علامة الحاشية بعد العبارة التي تتناولها مباشرة.
