  text: ⸀ἤρξαντο λυπεῖσθαι καὶ λέγειν αὐτῷ εἷς κατὰ εἷς· Μήτι ⸀ἐγώ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: ar
  text: 'فابتدأوا يحزنون ويقولون له، واحدًا فواحدًا: «لستُ أنا، أليس كذلك؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أأنا؟» والأداة اليونانية المستعملة في السؤال تفيد توقُّع جواب بالنفي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: فابتدأوا
  rationale: ينقل بدء الفعل الذي تدل عليه الصيغة مع المصدرين التاليين، وهو تعبير عربي فصيح وطبيعي.
- source_word: λυπεῖσθαι
  choice: يحزنون
  rationale: ينقل دخولهم في الحزن والأسى في هذا السياق المهيب، من غير مبالغة في تحديد نوع الانفعال.
- source_word: καὶ λέγειν
  choice: ويقولون
  rationale: يحافظ على معنى λέγω العام، أي القول، مع أن مضمون الكلام استفهامي.
- source_word: αὐτῷ
  choice: له
  rationale: يحافظ على الضمير الوارد في اليونانية من غير استبداله باسم يسوع تفسيرًا.
- source_word: εἷς κατὰ εἷς
  choice: واحدًا فواحدًا
  rationale: تعبير عربي توزيعي واضح يفيد أن كل واحد قال ذلك بدوره.
- source_word: Μήτι ἐγώ;
  choice: لستُ أنا، أليس كذلك؟
  rationale: ينقل صيغة السؤال التي تتوقع جوابًا بالنفي، مع إبقاء العبارة موجزة وقريبة من حذف الخبر في الأصل.
theological_decisions:
- issue: قوة سؤال التلاميذ
  choice: 'صياغة السؤال بما يُظهر أن المتكلم يرجو ويتوقع جوابًا بالنفي: «لستُ أنا، أليس كذلك؟»'
  alternative: «أأنا؟» أو «هل أنا هو؟»
  rationale: الأداة μήτι تدل على سؤال يُنتظر أن تكون إجابته بالنفي؛ والصياغة البديلة المحايدة تفقد نبرة الإنكار الممزوج بالقلق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ ترتيب الأفعال والضمير والتعبير التوزيعي، وصيغ السؤال بطريقة طبيعية تُظهر توقع النفي من غير إضافة هوية «الخائن» صراحةً.
