  text: أمّا هو فترك ثوب الكتّان وهرب عريانًا[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قطعة الكتّان» أو «ملاءة الكتّان» ترجمةً لكلمة σινδόνα.
    reason: lexical_alternative
  - marker: b
