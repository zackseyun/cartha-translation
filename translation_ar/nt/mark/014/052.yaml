lexical_decisions:
- source_word: δὲ
  choice: أمّا هو فـ
  rationale: تفيد δέ انتقالًا مع مقابلة خفيفة بما سبق؛ وهذه الصياغة تربط الآية بمحاولة الإمساك به ثم تبرز رد فعله.
- source_word: καταλιπὼν
  choice: ترك
  rationale: اسم الفاعل الأوريستي من καταλείπω يدل على أنه خلّف الثوب وراءه، وتؤدي «ترك» المعنى طبيعيًا في العربية مع تعاقب الحدثين.
- source_word: σινδόνα
  choice: ثوب الكتّان
  rationale: تشير σινδών إلى قطعة من نسيج الكتّان قد تُستعمل ثوبًا أو ملاءة؛ ويُرجّح السياق هنا وظيفتها بوصفها كساءً، مع إبقاء البدائل في الحاشية.
- source_word: γυμνὸς
  choice: عريانًا
  rationale: المعنى المباشر لـγυμνός هنا هو العري بعد ترك الكساء، مع التنبيه إلى أن اللفظة قد تعني في سياقات أخرى قلة اللباس.
- source_word: ἔφυγεν
  choice: هرب
  rationale: يفيد φεύγω الفرار والابتعاد سريعًا عن الخطر؛ و«هرب» موجزة وطبيعية في السرد العربي.
