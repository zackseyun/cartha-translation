    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: أحد الشبان
  rationale: تنقل «νεανίσκος» معنى الشاب، وتحفظ «τις» التنكير مع الإشارة إلى شخص بعينه من غير تسميته.
- source_word: συνηκολούθει
  choice: كان يتبعه
  rationale: صيغة الماضي الناقص تدل على فعل مستمر في ذلك الوقت، وهذا ما تنقله صيغة «كان يتبعه» بوضوح.
- source_word: αὐτῷ
  choice: ـه
  rationale: الضمير يعود في السياق إلى يسوع، وأُلحق بالفعل وفق الأسلوب العربي الطبيعي.
- source_word: περιβεβλημένος
  choice: ملتفًّا
  rationale: يدل اسم الفاعل على أنه كان قد لفّ القماش حوله؛ و«ملتفًّا» يحفظ هذه الصورة من غير افتراض أنه ثوب مفصّل.
- source_word: σινδόνα
  choice: بقطعة من الكتّان
  rationale: يمكن أن تعني الكلمة قطعة قماش كتانية أو ملاءة أو ما يشبه الثوب؛ وهذه الصياغة الواسعة لا تحدد شكلها أكثر مما يسمح به النص.
- source_word: ἐπὶ γυμνοῦ
  choice: على جسده العاري
  rationale: يبين التعبير أن القماش كان موضوعًا مباشرة على الجسد من غير لباس تحته.
- source_word: κρατοῦσιν
  choice: فأمسكوا به
  rationale: المعنى في السياق هو القبض عليه أو الإمساك به. استُعمل الماضي لأنه الأسلوب الطبيعي في السرد العربي، مع إبقاء الفعل غير مقيّد بالمعنى القانوني لكلمة «اعتقل».
- source_word: αὐτόν
  choice: به
  rationale: الضمير يعود إلى الشاب المذكور، وتعدية «أمسك» بالباء طبيعية في العربية.
