source:
  edition: SBLGNT
  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: ar
  text: «قد سمعتم التجديف. فماذا ترون؟[a]» فحكموا عليه جميعًا بأنه مستوجب الموت.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فما رأيكم؟» أو «فما حكمكم؟»'
    reason: بديل تعبيري يوضح أن السؤال يطلب رأيًا أو حكمًا، لا مجرد ما تراه العين.
  - marker: b
    text: 'أو: «بأنه مستحق الموت»، أو «بأنه مستوجب حكم الموت».'
    reason: بدائل تنقل الدلالة القضائية للعبارة اليونانية، أي كونه عرضة لعقوبة الموت أو مستحقًا لها.
lexical_decisions:
- source_word: ἠκούσατε
  choice: قد سمعتم
  rationale: ينقل الفعل الماضي في سياق الإحالة إلى ما سمعوه للتو، وتفيد «قد» تحقق السماع وصلته المباشرة بالموقف.
- source_word: τῆς βλασφημίας
  choice: التجديف
  rationale: يحافظ على الثقل الديني والقضائي للتهمة، من غير أن يجعل اتهام المجلس حكمًا يقرّه الراوي.
- source_word: τί ὑμῖν φαίνεται
  choice: فماذا ترون؟
  rationale: صياغة عربية موجزة وطبيعية تستبقي صورة الفعل اليوناني، والمقصود بها طلب الرأي أو الحكم.
- source_word: πάντες
  choice: جميعًا
  rationale: يحفظ تأكيد النص على إجماع الحاضرين في الإدانة.
- source_word: κατέκριναν
  choice: فحكموا عليه
  rationale: يؤدي المعنى القضائي للفعل، أي إصدار حكم ضده، بلغة عربية واضحة وطبيعية.
- source_word: ἔνοχον εἶναι θανάτου
  choice: بأنه مستوجب الموت
  rationale: ينقل معنى كونه عرضة لحكم الموت أو مستحقًا له، ويحافظ على الصبغة القضائية من غير حسم العبارة في معنى الذنب الأخلاقي وحده.
theological_decisions:
- issue: عرض تهمة βλασφημία في سياق المحاكمة
  choice: التجديف
  alternative: كلام التجديف
  rationale: «التجديف» هو المصطلح الديني والقضائي المباشر، مع بقاء التهمة منسوبة إلى المجلس لا إلى تقييم الراوي.
- issue: دلالة ἔνοχον θανάτου
  choice: مستوجب الموت
  alternative: مستحق الموت؛ مستوجب حكم الموت؛ مذنب بما يستوجب الموت
  rationale: تحفظ الصياغة التوتر بين الاستحقاق والتعرض للعقوبة، ولا تضيف تقريرًا لعدالة الحكم يتجاوز منظور القضاة في المشهد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة قضائية مهيبة. استُخدم القول المباشر بعلامتي تنصيص، وحُفظ تأكيد الإجماع، وأُثبتت علامتا الحاشيتين في موضعيهما في المتن.
