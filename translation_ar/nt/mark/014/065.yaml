  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: ar
  text: 'وبدأ بعضهم يبصقون عليه، ويغطّون وجهه[a]، ويلكمونه، ويقولون له: «تنبّأ!» وضربه الحرس[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يعصبون عينيه». واليونانية تقول حرفيًا: «يغطّون وجهه».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «تلقّاه الحرس بضربات». والمعنى: ضربه الحرس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό τινες
  choice: وبدأ بعضهم
  rationale: ينقل معنى الشروع مع إبقاء الفاعلين غير محددين، كما في اليونانية.
- source_word: ἐμπτύειν αὐτῷ
  choice: يبصقون عليه
  rationale: تعبير عربي طبيعي ينقل الإهانة المباشرة التي يدل عليها الفعل مع المجرور في اليونانية.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: يغطّون وجهه
  rationale: يحافظ على الصورة اللفظية في الأصل من غير أن يحسم أن الغرض كان تعصيب العينين.
- source_word: κολαφίζειν αὐτὸν
  choice: ويلكمونه
  rationale: الفعل يدل على الضرب بالقبضة، و«يلكمونه» موجز ودقيق في العربية المعاصرة.
- source_word: Προφήτευσον
  choice: تنبّأ!
  rationale: يحفظ صيغة الأمر المقتضبة والساخرة من غير إضافة تفسيرية.
- source_word: οἱ ὑπηρέται
  choice: الحرس
  rationale: في هذا السياق القضائي يدل اللفظ على الأعوان القائمين بالحراسة والخدمة الرسمية، لا على خدم المنازل.
- source_word: ῥαπίσμασιν αὐτὸν ἔλαβον
  choice: أخذه الحرس بالضرب
  rationale: يعكس تركيب الأصل الصعب نسبيًا ويحفظ صورته الحية، مع بيان بديل عربي أكثر سلاسة في الحاشية.
theological_decisions:
- issue: صياغة أمر السخرية Προφήτευσον في ضوء هوية يسوع
  choice: «تنبّأ!»
  alternative: «تنبّأ لنا!» أو «أرنا أنك نبي!»
  rationale: الأصل لا يذكر مفعولًا ولا يشرح السخرية؛ لذلك تُحفظ صيغة الأمر المجردة وما فيها من مفارقة من غير إضافة تفسير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «يلكمونه» لتحديد الضرب بالقبضات، و«الحرس» لملاءمة السياق المؤسسي. أُبقي التعبير الأخير قريبًا من بنية اليونانية، مع بديل أكثر سلاسة في الحاشية.
