lexical_decisions:
- source_word: ἔρχονται
  choice: جاؤوا
  rationale: الصيغة اليونانية مضارع تاريخي يُستعمل لإضفاء الحيوية على السرد، لكن الماضي هو الأسلوب الطبيعي في السرد العربي هنا.
- source_word: χωρίον
  choice: موضع
  rationale: لفظة عامة تدل على مكان أو قطعة أرض، و«موضع» تحافظ على هذا الاتساع من غير تخصيصه ببستان أو ضيعة.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: اسمه جثسيماني
  rationale: صياغة عربية طبيعية وقريبة من التركيب اليوناني، مع نقل اسم العلم صوتيًا.
- source_word: λέγει
  choice: فقال
  rationale: المضارع اليوناني هنا مضارع تاريخي؛ صيغ الماضي مع الفاء تلائم تتابع أحداث الرواية بالعربية، مع بيان الصيغة الأصلية في الحاشية.
- source_word: μαθηταῖς
  choice: لتلاميذه
  rationale: «التلاميذ» المقابل الاصطلاحي الدقيق الذي يحفظ علاقة التعلّم بالمعلّم في سياق الأناجيل.
- source_word: Καθίσατε
  choice: اجلسوا
  rationale: أمر مباشر موجز وطبيعي يقابل صيغة الأمر اليونانية.
- source_word: ὧδε
  choice: هنا
  rationale: المقابل العربي المباشر والطبيعي لظرف المكان الإشاري.
- source_word: ἕως προσεύξωμαι
  choice: إلى أن أصلّي
  rationale: تحفظ العبارة الحد الزمني الذي تدل عليه ἕως مع صيغة الفعل، من غير تحويل المعنى إلى مجرد التزامن كما في «بينما أصلّي».
