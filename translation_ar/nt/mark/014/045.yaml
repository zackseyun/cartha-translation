  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸀εὐθὺς προσελθὼν αὐτῷ λέγει· ⸀Ῥαββί, καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: ar
  text: 'ولمّا جاء، تقدّم إليه فورًا وقال: «يا رابّي!» وقبّله بحرارة.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قبّله مرارًا»؛ فالفعل اليوناني أوكد من مجرد «قبّله».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: ولمّا جاء
  rationale: اسم الفاعل الأوريستي يؤدي هنا معنى زمنيًا؛ وهذه الصياغة العربية الطبيعية تحفظ تتابع الحدث.
- source_word: εὐθὺς
  choice: فورًا
  rationale: تنقل سرعة الحركة السردية التي يعبّر عنها اللفظ، بعبارة عربية واضحة وموجزة.
- source_word: προσελθὼν αὐτῷ
  choice: تقدّم إليه
  rationale: تدل العبارة على الاقتراب الجسدي من يسوع، وهذه الصياغة تتجنب تكرار فعل المجيء.
- source_word: λέγει
  choice: وقال
  rationale: صيغ المضارع التاريخي في السرد اليوناني تُنقل طبيعيًا بالماضي في العربية مع بقاء الحدث كما هو.
- source_word: Ῥαββί
  choice: يا رابّي
  rationale: يحافظ النقل الصوتي للقب السامي الذي أبقاه النص اليوناني، ويصون النكهة التاريخية والمفارقة في خطاب يهوذا.
- source_word: κατεφίλησεν
  choice: قبّله بحرارة
  rationale: الفعل المركب أوكد من فعل التقبيل البسيط، وقد يدل على تقبيل حار أو متكرر؛ اختيرت صياغة تنقل شدة الفعل من غير الجزم بالتكرار.
theological_decisions:
- issue: نقل لقب Ῥαββί في خطاب يهوذا ليسوع
  choice: يا رابّي
  alternative: يا معلّم
  rationale: إبقاء اللقب منقولًا صوتيًا يتبع صورة النص اليوناني ويحفظ السياق التاريخي من غير إدخال تفسير عقائدي.
- issue: تحديد دلالة الفعل المكثف κατεφίλησεν
  choice: قبّله بحرارة
  alternative: قبّله مرارًا
  rationale: قد يشير الفعل إلى شدة التقبيل أو تكراره، ولا يحسم السياق بينهما؛ لذلك أُثبت وجه في المتن وذُكر الآخر في الحاشية حفاظًا على الاحتمال الدلالي.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدم «رابّي» نقلًا للقب التاريخي، ووُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
