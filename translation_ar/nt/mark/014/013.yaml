  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: ar
  text: 'فيرسل اثنين من تلاميذه ويقول لهما: «اذهبا إلى المدينة، وسيقابلكما رجل يحمل جَرَّة ماء[a]. اتبعاه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جَرَّة فخارية فيها ماء»؛ فقد يدل اللفظ اليوناني κεράμιον على وعاء مصنوع من الفخار.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλει
  choice: فيرسل
  rationale: استُخدم المضارع للمحافظة على المضارع التاريخي الذي يضفي حيوية على سرد مرقس.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: اثنين من تلاميذه
  rationale: تنقل العبارة تركيب التبعيض في اليونانية، و«تلاميذه» هي المقابل الدقيق والطبيعي في السياق.
- source_word: λέγει
  choice: ويقول
  rationale: حُفظ المضارع التاريخي اتساقًا مع صيغة النص اليوناني وأسلوب مرقس السردي.
- source_word: Ὑπάγετε
  choice: اذهبا
  rationale: صيغة أمر للمثنى تنقل مباشرةً الأمر الموجَّه إلى التلميذين.
- source_word: εἰς τὴν πόλιν
  choice: إلى المدينة
  rationale: تعبير عربي طبيعي يدل على الحركة نحو المدينة والدخول إليها في هذا السياق.
- source_word: ἀπαντήσει ὑμῖν
  choice: سيقابلكما
  rationale: ينقل الفعل المستقبل مع المخاطب المثنى بوضوح، من غير إضافة قصد غير مصرَّح به للمجيء إلى لقائهما.
- source_word: ἄνθρωπος
  choice: رجل
  rationale: يشير الاسم هنا إلى شخص ذكر بعينه، لذا فـ«رجل» أدق من لفظ عام مثل «شخص».
- source_word: κεράμιον ὕδατος
  choice: جَرَّة ماء
  rationale: صياغة عربية واضحة وموجزة تنقل الوعاء ومحتواه، مع بيان احتمال دلالة اللفظ على مادة الوعاء في الحاشية.
- source_word: βαστάζων
  choice: يحمل
  rationale: ينقل اسم الفاعل اليوناني بوصفه فعلًا واقعًا وقت اللقاء، في تعبير عربي طبيعي.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: اتبعاه
  rationale: أمر مباشر بصيغة المثنى، وضمير المفرد يعود بوضوح إلى الرجل.
