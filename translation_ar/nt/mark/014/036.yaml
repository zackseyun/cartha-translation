  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: دلالة الماضي الناقص في «وكان يقول»، والنداء المزدوج «أبّا، أيها الآب»، وشمول «كل شيء»، وطلب إبعاد «هذه الكأس» عنه، والمقابلة المؤكدة بين «أنا» و«أنت» في الخاتمة. كما يحافظ على صورة الكأس المجازية دون تحويلها إلى تفسير داخل المتن.'
