  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: ar
  text: 'وكان يقول[a]: «أبّا، أيها الآب[b]، كلُّ شيء ممكن لديك. أبعِد عني هذه الكأس[c]. ولكن لا ما أريده أنا، بل ما تريده أنت».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وقال». قد يدل الماضي الناقص اليوناني على كلام متواصل أو متكرر: «وكان يقول».'
    reason: lexical_alternative
  - marker: b
    text: «أبّا» صيغة نداء آرامية للأب، أبقاها النص إلى جانب اللفظة اليونانية «الآب».
    reason: cultural_note
  - marker: c
    text: «الكأس» صورة كتابية تشير هنا إلى الألم المعيَّن له؛ قارن مرقس 10:38.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: وكان يقول
  rationale: يحفظ دلالة الماضي الناقص على الكلام المستمر أو المتكرر في المشهد، مع بقاء العبارة طبيعية في العربية.
- source_word: Αββα ὁ πατήρ
  choice: أبّا، أيها الآب
  rationale: يُبقي صيغة النداء الآرامية «أبّا» ويعقبها بالمقابل اليوناني التفسيري «أيها الآب»، من غير إضافة ضمير ملكية غير مصرح به.
- source_word: πάντα δυνατά σοι
  choice: كلُّ شيء ممكن لديك
  rationale: صياغة عربية واضحة تنقل شمول πάντα ودلالة σοι على الإمكان لدى المخاطَب.
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: أبعِد عني
  rationale: ينقل طلب إزالة الكأس عنه بعبارة عربية موجزة وطبيعية، ويحفظ قوة صيغة الأمر.
- source_word: τὸ ποτήριον τοῦτο
  choice: هذه الكأس
  rationale: يحفظ صورة الكأس المجازية وما لها من صدى كتابي، بدل تفسيرها مباشرة بأنها الألم.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: ولكن لا ما أريده أنا، بل ما تريده أنت
  rationale: يُظهر المقابلة المؤكدة بين ἐγώ وσύ، ويُكمِل الفعل المفهوم في الشطر الثاني بما يلائم العربية، من غير إزالة التوتر بين الإرادتين.
theological_decisions:
- issue: الجمع بين النداء الآرامي وصيغته اليونانية
  choice: أبّا، أيها الآب
  alternative: أبّا، يا أبي
  rationale: يحفظ اللفظ الآرامي والتفسير اليوناني معًا، ولا يضيف معنى الملكية «أبي» غير الصريح في النص اليوناني هنا.
- issue: القوة المجازية لصورة الكأس
  choice: هذه الكأس
  alternative: هذا الألم
  rationale: يبقي الاستعارة كما وردت، ويحفظ دلالاتها الكتابية والتوتر اللاهوتي بدل اختزالها في تفسير واحد.
- issue: المقابلة بين إرادة يسوع وإرادة الآب
  choice: لا ما أريده أنا، بل ما تريده أنت
  alternative: لا تكن إرادتي بل إرادتك
  rationale: يلتزم بالبنية المصدرية للنص، ويبرز الضميرين المؤكدين من غير إدخال فعل أمر أو صيغة غير موجودة صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «أيها الآب» لتمييز المقابل اليوناني التفسيري بعد «أبّا»، و«أبعِد عني» لطبيعية الطلب، مع الحفاظ على الاستعارة والتوكيد الضميري في الخاتمة.
