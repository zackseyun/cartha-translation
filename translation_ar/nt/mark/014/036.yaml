  terminology: اختيار «أبّا» مع «الآب» يحفظ اللفظ الآرامي والتفسير اليوناني من دون إضافة «أبي». و«الكأس» يحفظ المصطلح والصورة الكتابية. علامات الحواشي موضوعة عند المواضع ذات الصلة، ومضامين الحواشي سليمة ومتوافقة مع المصدر ومسار التدقيق الإنجليزي.
