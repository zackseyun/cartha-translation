  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: ar
  text: وتقدَّم قليلًا[a]، فخرَّ على الأرض، وكان يصلّي لكي، إن أمكن، تمرَّ عنه الساعة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: مضى إلى الأمام قليلًا.'
    reason: بديل معجمي يبرز اتجاه الحركة في προελθὼν دون تغيير معناها الأساسي.
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: وتقدَّم قليلًا
  rationale: يفيد التركيب أنه تحرّك مسافة قصيرة إلى الأمام متجاوزًا موضع الآخرين، وهذه الصياغة عربية طبيعية وتحفظ معنى الحركة دون مبالغة في المسافة.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: فخرَّ على الأرض
  rationale: الفعل في صيغة الماضي الناقص يرسم وقوعه على الأرض في سياق السرد؛ و«خرَّ» ينقل الحركة بوضوح وإيجاز في العربية.
- source_word: προσηύχετο
  choice: وكان يصلّي
  rationale: تحفظ «كان يصلّي» الجانب الاستمراري لصيغة الماضي الناقص، فتبيّن أن الصلاة كانت جارية وليست مجرد فعل لحظي.
- source_word: ἵνα
  choice: أن
  rationale: تقدّم «أن» مضمون الصلاة بصورة طبيعية، مع إبقاء احتمال دلالة الغاية قائمًا في السياق من غير إثقال العبارة.
- source_word: εἰ δυνατόν ἐστιν
  choice: إن كان ذلك ممكنًا
  rationale: تحفظ الصياغة شرط الإمكان والتردّد الملازم له، كما تعكس زمن الفعل اليوناني دون تقرير كيفية هذا الإمكان.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: أن تعبر عنه الساعة
  rationale: تحفظ «تعبر عنه» صورة مرور الساعة بعيدًا عنه، وتُبقي «الساعة» كما وردت لما تحمله من دلالة سياقية ولاهوتية دون تحويلها إلى تفسير.
theological_decisions:
- issue: دلالة «الساعة»
  choice: الإبقاء على التعبير الحرفي «الساعة» بوصفه تعبير النص عن الزمن المعيَّن لآلام يسوع وموته الوشيك، من غير شرحه داخل المتن.
  alternative: الوقت؛ وقت الآلام
  rationale: يحمل التعبير ثقلًا سرديًا ولاهوتيًا في مرقس، وترجمته حرفيًا تحفظ غموضه المقصود والتوتر اللاهوتي بدل حسمه بتفسير مباشر.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «خرَّ» بوصفها لفظة فصيحة مفهومة تصف السقوط الإرادي أو الانهيار إلى الأرض، وحُفظ إيقاع السرد واستمرار الصلاة.
