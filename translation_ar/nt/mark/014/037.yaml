  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: ar
  text: 'ويأتي فيجدهم نائمين، فيقول لبطرس: «يا سمعان، أأنت نائم؟ أما استطعت أن تبقى مستيقظًا ساعةً واحدة؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: ويأتي
  rationale: أُبقي المضارع التاريخي لإظهار حيوية السرد عند مرقس، وهو مقبول وطبيعي في العربية السردية.
- source_word: εὑρίσκει
  choice: فيجدهم
  rationale: حُفظ المضارع التاريخي، وربطت الفاء الفعل بما قبله ربطًا عربيًا طبيعيًا.
- source_word: καθεύδοντας
  choice: نائمين
  rationale: حال تدل على أنهم كانوا في حالة نوم حين وجدهم؛ وهذه الصياغة أفصح وأطبع في العربية من ترجمة حرفية بالمضارع.
- source_word: λέγει τῷ Πέτρῳ
  choice: فيقول لبطرس
  rationale: حُفظ المضارع التاريخي، وأُديت صيغة المجرور اليونانية باللام العربية الطبيعية.
- source_word: Σίμων
  choice: يا سمعان
  rationale: حُفظ الاسم الشخصي الذي خاطب به يسوع بطرس، مع أداة النداء اللازمة طبيعيًا في العربية.
- source_word: καθεύδεις
  choice: أأنت نائم؟
  rationale: ينقل السؤال المباشر والتوبيخ الآني بعبارة عربية واضحة، مع إبراز المخاطَب.
- source_word: οὐκ ἴσχυσας
  choice: أما استطعت
  rationale: ينقل معنى القدرة في السياق دون حصره في القوة الجسدية، ويحافظ على صيغة السؤال التوبيخي المتوقِّع جوابًا بالنفي.
- source_word: μίαν ὥραν
  choice: ساعةً واحدة
  rationale: يعبر بوضوح عن مدة الزمن، مع إبراز «واحدة» كما في الأصل.
- source_word: γρηγορῆσαι
  choice: أن تبقى مستيقظًا
  rationale: السياق يقابل اليقظة بالنوم مباشرة؛ والصياغة تنقل المعنى الحسي مع بقاء إيحاء الانتباه والسهر في السياق.
theological_decisions:
- issue: المضارع التاريخي في سرد مرقس
  choice: 'الإبقاء على الأفعال الرئيسة في المضارع: «يأتي... يجد... يقول».'
  alternative: 'تحويلها إلى الماضي: «أتى... وجد... قال».'
  rationale: الإبقاء عليه يمثل أسلوب مرقس الحي من غير إخلال بطبيعية العربية، ولا ينطوي على حسم عقائدي.
- issue: دلالة γρηγορέω في هذا السياق
  choice: «تبقى مستيقظًا».
  alternative: «تسهر» أو «تظل يقظًا».
  rationale: المقابلة المباشرة مع نوم التلاميذ ترجح إظهار معنى عدم النوم، مع عدم نفي دلالة التيقظ الروحي الأوسع في السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظت حيوية المضارع التاريخي، واستُخدم «سمعان» و«بطرس» بحسب الاستعمال العربي الكتابي الشائع، مع صياغة السؤال بصورة طبيعية ومباشرة.
