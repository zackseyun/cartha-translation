  source_fidelity: النص العربي ينقل بدقة الأفعال السردية بالمضارع التاريخي في اليونانية («يأتي... فيجد... فيقول»)، وحال التلاميذ نائمين، والتحول إلى مخاطبة بطرس باسمه الشخصي «سمعان». كما ينقل السؤال التوبيخي عن عدم القدرة على البقاء مستيقظًا لمدة ساعة واحدة دون زيادة تفسيرية.
  naturalness: 'الصياغة فصيحة حديثة وسلسة: «يا سمعان، أأنت نائم؟ أما استطعت أن تبقى مستيقظًا ساعةً واحدة؟» واضحة وتحافظ على نبرة العتاب المباشر. واستخدام «نائمين» و«مستيقظًا» مناسب للمقابلة السياقية بين النوم واليقظة.'
  terminology: «بطرس» و«سمعان» مستعملان عربيًا استعمالًا كتابيًا راسخًا، والتمييز بينهما يحفظ دلالة الأصل. وترجمة γρηγορῆσαι بـ«أن تبقى مستيقظًا» دقيقة في هذا السياق، ولا تفرض معنى لاهوتيًا زائدًا.
