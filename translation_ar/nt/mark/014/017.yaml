lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: أداة ربط مألوفة تواصل تسلسل الأحداث وتحافظ على أسلوب مرقس العطفي من غير إضافة انتقال تفسيري.
- source_word: ὀψίας γενομένης
  choice: لمّا جاء المساء
  rationale: تركيب إضافي مطلق يفيد الظرف الزمني؛ وهذه الصياغة عربية طبيعية وتحفظ صورة مجيء المساء.
- source_word: ἔρχεται
  choice: يأتي
  rationale: مضارع سردي تاريخي يضفي حيوية على المشهد؛ أُبقي المضارع بدل تسويته إلى الماضي.
- source_word: μετὰ τῶν δώδεκα
  choice: مع الاثني عشر
  rationale: تفيد μετά مع المضاف إليه المصاحبة. والتعبير الموجز يحيل إلى جماعة تلاميذ يسوع الاثني عشر من غير إضافة «تلاميذ» أو «رسل» تفسيرًا.
theological_decisions:
- issue: مرجع «الاثني عشر»
  choice: الإبقاء على العبارة الموجزة بوصفها إشارة إلى جماعة يسوع المعروفة، وكان يهوذا داخل هذا العدد في هذا الموضع من السرد
  alternative: مع تلاميذه الاثني عشر / مع الرسل الاثني عشر
  rationale: النص اليوناني يقول «الاثني عشر» فقط؛ وإضافة «تلاميذه» أو «الرسل» توضيح تفسيري غير لازم.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ المضارع السردي «يأتي» رغم مجيئه بعد ظرف ماضٍ، موافقةً لحيوية الأسلوب اليوناني. وُضع مؤشر الحاشية بعد العبارة التي يشرحها.
