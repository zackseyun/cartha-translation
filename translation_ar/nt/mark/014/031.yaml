  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: ar
  text: 'لكنه ظلَّ يؤكِّد بإصرار أشدّ[a]: «إن كان لا بدَّ لي أن أموت معك[b]، فلن أنكرك قطّ[c]». وكانوا جميعًا يقولون الشيء نفسه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان يتكلم بإلحاح شديد جدًا».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أن أموت معك معًا»؛ ويؤكد الفعل اليوناني الموت مع المخاطَب.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لن أنكرك أبدًا». يستعمل اليوناني نفيًا مشدّدًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς
  choice: بإصرار أشدّ
  rationale: ينقل شدة الظرف وتصاعد إصرار بطرس، بعبارة عربية طبيعية لا تكتفي بمعنى «بشدة».
- source_word: ἐλάλει
  choice: ظلَّ يؤكِّد
  rationale: يحفظ دلالة الماضي الناقص على الاستمرار أو التكرار، ويناسب مضمون كلام بطرس الاحتجاجي المؤكد.
- source_word: Ἐὰν δέῃ με
  choice: حتى إن وجب عليَّ
  rationale: يعبّر «وجب» عن الضرورة التي يدل عليها δέῃ، و«حتى إن» تلائم سياق التصعيد في العربية.
- source_word: συναποθανεῖν σοι
  choice: أن أموت معك
  rationale: صياغة عربية طبيعية تحفظ معنى الموت بصحبة المخاطَب؛ ويُذكر في الحاشية تشديد الفعل المركب على معنى «معًا».
- source_word: οὐ μή
  choice: لن ... قطّ
  rationale: ينقل النفي اليوناني المشدد بصيغة عربية قوية وواضحة من غير زيادة تفسيرية.
- source_word: ἀπαρνήσομαι
  choice: أنكرك
  rationale: «أنكر» هو المقابل الواضح الملائم لسياق إنكار بطرس معرفته بيسوع لاحقًا.
- source_word: ὡσαύτως
  choice: الشيء نفسه
  rationale: يصرّح طبيعيًا بأن سائر التلاميذ قالوا مضمون القول ذاته.
- source_word: πάντες
  choice: جميعًا
  rationale: يحفظ شمول πάντες ويرتبط بسلاسة بواو الجماعة في «كانوا».
- source_word: ἔλεγον
  choice: كانوا ... يقولون
  rationale: يحفظ صيغة الماضي الناقص وما تفيده هنا من كلام جارٍ أو متكرر.
theological_decisions:
- issue: قوة تعهّد بطرس بعدم الإنكار
  choice: فلن أنكرك قطّ
  alternative: 'لن أنكرك أبدًا؛ أو: حاشا أن أنكرك'
  rationale: تحفظ العبارة قوة οὐ μή مع المستقبل، وتُبقي التوتر السردي بين ثقة بطرس المؤكدة وإنكاره اللاحق من غير تفسير مذهبي أو تخفيف للمفارقة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «ظلَّ يؤكِّد» لإظهار استمرار الكلام، و«بإصرار أشدّ» لإبراز تصاعده، مع تجنّب الأساليب القديمة أو الاصطلاحات المذهبية.
