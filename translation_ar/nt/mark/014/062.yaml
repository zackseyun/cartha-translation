reference: Mark 14:62
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: ar
  text: 'فقال يسوع: «أنا هو[a]، وسترون ابن الإنسان جالسًا عن يمين القدرة[b]، وآتيًا مع سحب السماء[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا في اليونانية: «أنا أكون»، من غير خبر مذكور؛ والمعنى في السياق: «أنا هو».'
    reason: alternative_reading
  - marker: b
    text: «القدرة» كناية توقيرية عن الله.
    reason: cultural_note
  - marker: c
    text: تردد العبارة صدى مزمور 110:1 ودانيال 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: أنا هو
  rationale: تؤدي العبارة جوابًا مباشرًا ومؤكدًا عن سؤال رئيس الكهنة. ولأن العربية في الزمن الحاضر لا تستعمل عادة فعل الكينونة، فإن «أنا هو» أقرب صياغة عربية موجزة تحفظ قوة الجواب وإمكان دلالته الأوسع، مع بيان حرفية اليونانية في الحاشية.
- source_word: ὄψεσθε
  choice: سترون
  rationale: ترجمة مباشرة طبيعية لصيغة المستقبل، وتحافظ على قوة الإعلان دون زيادة تفسيرية.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: تحفظ اللقب المعروف وإحالته إلى دانيال 7، بدل تحويله إلى تعبير تفسيري عام.
- source_word: ἐκ δεξιῶν
  choice: عن يمين
  rationale: تعبير عربي كتابي مفهوم يدل على موضع الكرامة والسلطان.
- source_word: τῆς δυνάμεως
  choice: القدرة
  rationale: يحفظ الكناية التوقيرية الواردة في اليونانية عن الله، ولا يستبدلها بالاسم الصريح.
- source_word: καθήμενον
  choice: جالسًا
  rationale: ينقل صورة الجلوس في موضع السلطان بعبارة عربية واضحة، ويتعلق نحويًا بـ«ابن الإنسان» بوصفه مفعول الرؤية.
- source_word: ἐρχόμενον
  choice: آتيًا
  rationale: يحافظ على التوازي مع «جالسًا» وعلى الصدى الأخروي لعبارة دانيال.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: مع سحب السماء
  rationale: صياغة قريبة من الأصل تحفظ الطابع الرؤيوي والإحالة إلى دانيال 7:13.
- source_word: καὶ ... καὶ
  choice: و... و
  rationale: 'إبقاء العطف المتكرر يحفظ تراكم الصورتين: الجلوس عن يمين القدرة والإتيان مع السحب.'
theological_decisions:
- issue: كيفية نقل Ἐγώ εἰμι من غير طمس بساطة الجواب أو تحميله تفسيرًا عقائديًا زائدًا
  choice: «أنا هو» في المتن مع حاشية توضح أن اليونانية تقول حرفيًا «أنا أكون» بلا خبر مصرح به
  alternative: «نعم، أنا هو» أو «أنا أكون»
  rationale: «أنا أكون» غير طبيعية هنا في العربية، و«نعم» زيادة غير موجودة نصًا. أما «أنا هو» فتحفظ الجواب المؤكد وتترك صداه اللاهوتي مفتوحًا، مع التنبيه إلى بنية الأصل.
- issue: تعيين مدلول τῆς δυνάμεως
  choice: الإبقاء على الكناية «القدرة»
  alternative: «الله» أو «القدير»
  rationale: الأصل يستعمل كناية توقيرية لا الاسم الصريح؛ والإبقاء عليها يحفظ نبرة المشهد وصياغته دون حسم تفسيري زائد.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُعمل «وسترون» للوصل الطبيعي، وحُفظ التوازي بين «جالسًا» و«آتيًا». ولأن العربية لا تملك تمييز الحرف الكبير، شُرحت الدلالة الإلهية لـ«القدرة» في الحاشية.
