  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: ar
  text: 'وقال لهم يسوع: «ستتعثرون جميعًا[a]، لأنه مكتوب: ‹سأضرب الراعي، وستتشتت الخراف›».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ستسقطون جميعًا»، أو بصورة أقرب إلى المبني للمجهول: «ستُدفعون جميعًا إلى التعثر». يدل الفعل هنا على فشل التلاميذ وتفرقهم تحت وطأة ما سيحدث.'
    reason: بديل معجمي يحفظ صيغة الفعل اليوناني واتساع دلالته.
lexical_decisions:
- source_word: λέγει
  choice: وقال
  rationale: صيغ الماضي هي الأسلوب الطبيعي للسرد العربي، مع أن اليونانية تستعمل المضارع التاريخي لإضفاء الحيوية على الحدث.
- source_word: σκανδαλισθήσεσθε
  choice: ستتعثرون جميعًا
  rationale: يحفظ صورة التعثر واتساع الدلالة في الفعل اليوناني، الذي يشير هنا إلى فشل التلاميذ تحت الضغط من غير أن يفرض معنى الردة النهائية.
- source_word: γέγραπται
  choice: مكتوب
  rationale: الصيغة العربية المألوفة لإدخال اقتباس كتابي ذي حجة مستمرة.
- source_word: Πατάξω
  choice: سأضرب
  rationale: مقابل مباشر وواضح يحفظ قوة الفعل وصيغة المتكلم في الاقتباس.
- source_word: τὸν ποιμένα
  choice: الراعي
  rationale: يحفظ الاسم المفرد المعرّف والصورة النبوية كما وردت.
- source_word: τὰ πρόβατα
  choice: الخراف
  rationale: مقابل عربي طبيعي لصورة القطيع، ويحفظ الجمع المعرّف.
- source_word: διασκορπισθήσονται
  choice: ستتشتت
  rationale: ينقل تفرق القطيع بوضوح؛ والفعل العربي اللازم يؤدي هنا معنى المبني للمجهول اليوناني بصورة طبيعية.
theological_decisions:
- issue: دلالة σκανδαλισθήσεσθε على استجابة التلاميذ ليسوع
  choice: ستتعثرون جميعًا
  alternative: ستتخلون جميعًا؛ ستُدفعون جميعًا إلى التعثر
  rationale: يحفظ «تتعثرون» الاستعارة الأصلية والتوتر بين الفشل والانصراف، ولا يحسم اللفظ على أنه ردة نهائية. ويوضح السياق اللاحق واقتباس تشتت الخراف أن المقصود فشل التلاميذ وتفرقهم عند القبض على يسوع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل الماضي في فعل القول وفق السرد العربي الطبيعي، مع إبقاء الاقتباس الكتابي موجزًا وإيقاعه مباشرًا.
