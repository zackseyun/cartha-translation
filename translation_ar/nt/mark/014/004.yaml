  text: 'لكن كان بعضهم ساخطين فيما بينهم، وقالوا: «لماذا جرى هذا الإهدار للطيب؟»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بعضهم لبعض»، أو «في داخل أنفسهم». قد تدل العبارة اليونانية على شكوى متبادلة داخل الجماعة أو على رد فعل داخلي.
    reason: lexical_alternative
  - marker: b
    text: أو «الزيت العطري» أو «المرهم العطري». تشير الكلمة اليونانية إلى زيت أو مرهم معطّر.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: لكن ... استاؤوا
  rationale: تفيد δέ وصل السرد مع إبراز التباين بين فعل المرأة ورد فعل بعض الحاضرين، وتؤدي «لكن» هذا المعنى بوضوح.
- source_word: τινες
  choice: بعضهم
  rationale: تحافظ على عدم تعيين الأشخاص، وتنسجم طبيعيًا مع السياق الذي يتحدث عن جماعة حاضرة.
- source_word: ἀγανακτοῦντες
  choice: استاؤوا
  rationale: تنقل معنى السخط والاستنكار الشديد، من غير قصره على مجرد الغضب.
- source_word: πρὸς ἑαυτούς
  choice: فيما بينهم
  rationale: تلائم الشكوى المتبادلة داخل الجماعة، مع إبقاء احتمال أن يكون التعبير عن رد فعل داخلي أو موجّه بعضهم إلى بعض في الحاشية.
- source_word: Εἰς τί
  choice: لماذا
  rationale: صياغة عربية طبيعية لسؤال الغرض أو الجدوى في هذا السياق.
- source_word: ἡ ἀπώλεια αὕτη
  choice: هذا التبذير
  rationale: تعبّر عن حكم المتكلمين بأن سكب الطيب إضاعة له، وهو المعنى السياقي لـ ἀπώλεια هنا.
- source_word: τοῦ μύρου
  choice: في الطيب
  rationale: «الطيب» لفظ عربي واضح ومألوف للزيت أو المرهم العطري الثمين، وحرف «في» يصوغ علاقة الإضاعة بالمادة صياغة طبيعية.
- source_word: γέγονεν
  choice: حدث
  rationale: ينقل وقوع الحدث المكتمل الذي صارت نتيجته حاضرة، من دون إثقال العبارة العربية بصيغة غير طبيعية.
