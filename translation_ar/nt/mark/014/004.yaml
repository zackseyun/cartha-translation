  terminology: «الطيب» مناسب لـ μύρον في العربية الفصحى المعاصرة، و«الإهدار» مناسب للسياق التعبيري لـ ἀπώλεια. و«ساخطين» يؤدي قوة ἀγανακτοῦντες أفضل من «استاؤوا» في هذا الموضع.
