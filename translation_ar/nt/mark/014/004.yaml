  source_fidelity: 'ينقل المسودّة المعنى العام للآية على نحو جيد: وجود بعض الأشخاص، وسخطهم، والشكوى من إهدار الطيب. لكن «حدث هذا التبذير في الطيب» غير دقيقة في علاقة الإضافة؛ فاليونانية تتكلم عن «إهدار الطيب» لا عن تبذيرٍ وقع داخل الطيب. كما أن تركيب «بعضهم استاؤوا ... قائلين» أقل سلامةً وانسيابًا في الفصحى.'
