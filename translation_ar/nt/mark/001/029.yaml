  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: ar
  text: وفي الحال، خرجوا من المجمع وجاؤوا إلى بيت سمعان وأندراوس، ومعهم يعقوب ويوحنا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: في الحال
  rationale: ينقل سرعة الحركة السردية التي يتميز بها أسلوب مرقس، بعبارة عربية فصيحة وطبيعية.
- source_word: ἐκ τῆς συναγωγῆς / ἐξελθόντες
  choice: خرجوا من المجمع
  rationale: يجمع التعبير العربي الطبيعي بين فعل الخروج وحرف الابتداء، من غير تكرار ثقيل، مع حفظ ترتيب الحدثين.
- source_word: ἦλθον
  choice: جاؤوا
  rationale: يحفظ المعنى المباشر للفعل ἔρχομαι هنا، مع بقاء إمكان التعبير عن الحركة نحو الوجهة بحسب منظور السرد.
- source_word: εἰς τὴν οἰκίαν
  choice: إلى بيت
  rationale: «إلى» مع «بيت» تعبير عربي طبيعي يدل على الحركة نحو المسكن، ولا يحتاج السياق إلى إبراز الدخول بلفظ مستقل.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: سمعان وأندراوس
  rationale: الإضافة في «بيت سمعان وأندراوس» تنقل صيغة الملكية في اليونانية بوضوح وطبيعية.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: ومعهم يعقوب ويوحنا
  rationale: ينقل معنى المصاحبة، كما يزيل في العربية احتمال تعلق العبارة بالبيت بدلًا من فعل المجيء.
theological_decisions: []
