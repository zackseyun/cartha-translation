base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: ar
  text: وفي الحال، بينما كان يصعد من الماء، رأى السماوات تنشقّ[a]، والروحَ ينزل عليه مثل حمامة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «تتمزق». الفعل اليوناني أقوى من مجرد «تنفتح».
    reason: lexical_alternative
  - marker: b
    text: أو «إليه». وقد يفيد حرف الجر اليوناني أيضًا «إلى داخله»، لكن «عليه» أنسب في سياق نزول الروح.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: وفي الحال
  rationale: ينقل الدلالة الزمنية العاجلة المميِّزة لسرد مرقس بعبارة عربية فصيحة معاصرة.
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: إذ كان يصعد من الماء
  rationale: تحافظ «إذ كان» على تزامن اسم الفاعل المضارع مع فعل الرؤية، وتنقل «من الماء» معنى ἐκ من غير إثقال العبارة.
- source_word: εἶδεν
  choice: رأى
  rationale: ترجمة مباشرة وكافية لفعل الإدراك في صيغة الماضي.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: السماوات تنشقّ
  rationale: «تنشقّ» أقوى من «تنفتح» وتحفظ الصورة الحية للفعل σχίζω، مع إبقاء «السماوات» في صيغة الجمع كما في اليونانية.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: السياق يدل على روح الله، لكن النص يقول «الروح» ولا يضيف صفة «القدس»، لذلك حُفظت صياغته من غير زيادة تفسيرية.
- source_word: ὡς περιστερὰν
  choice: مثل حمامة
  rationale: تحفظ أداة التشبيه من غير حسم ما إذا كان وجه الشبه الهيئة أو طريقة النزول أو كليهما.
- source_word: καταβαῖνον
  choice: ينزل
  rationale: تعبير عربي واضح وطبيعي ينقل الحركة المستمرة المصاحبة للرؤية.
- source_word: εἰς αὐτόν
  choice: عليه
  rationale: مع فعل نزول الروح، «عليه» هي العبارة العربية الاصطلاحية الأرجح، مع بيان احتمال المعنى الحرفي الآخر في الحاشية.
theological_decisions:
- issue: مرجع «الروح»
  choice: روح الله، مع ترجمة اللفظ «الروح»
  alternative: الروح القدس
  rationale: السياق يعيّن المرجع الإلهي، لكن الأصل لا يصرّح هنا بصفة «القدس»، فلا تُزاد في المتن.
- issue: وجه التشبيه بالحمامة
  choice: 'إبقاء التشبيه عامًا: «مثل حمامة»'
  alternative: اتخذ الروح هيئة حمامة؛ أو نزل بطريقة تشبه طيران الحمامة
  rationale: لا يحدد ὡς وجه الشبه، ولذلك لا تحسم الترجمة الهيئة أو الكيفية.
- issue: دلالة εἰς αὐτόν
  choice: عليه
  alternative: إليه أو إلى داخله
  rationale: «عليه» تلائم عربيًا سياق نزول الروح، لكن الحاشية تحفظ إمكان الدلالة الاتجاهية أو الداخلية لحرف الجر اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرهما الحاشيتان، وحُفظ جمع «السماوات» وغموض تشبيه الروح بالحمامة.
