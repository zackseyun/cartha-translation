  text: وكانت المدينة كلها مجتمعة عند الباب[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى الباب». يمكن ترجمة حرف الجر اليوناني بهذه الصورة الأكثر حرفية، لكن السياق يشير إلى اجتماع الناس عند مدخل البيت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: كانت
  rationale: فعل ناقص في صيغة الماضي الناقص، ومع اسم المفعول ἐπισυνηγμένη يرسم مشهدًا قائمًا في ذلك الوقت؛ و«كانت ... مجتمعة» تحافظ على هذا المعنى الاستمراري الوصفي.
- source_word: ὅλη ἡ πόλις
  choice: المدينة كلها
  rationale: تنقل التعبير اليوناني مباشرة وتحافظ على التعميم التصويري القوي من غير إضعافه أو تفسيره على أنه إحصاء حرفي.
- source_word: ἐπισυνηγμένη
  choice: مجتمعة
  rationale: اسم مفعول من فعل يدل على الجمع معًا. و«مجتمعة» عربية طبيعية تلائم «المدينة» المفرد المؤنث وتصف حالة اجتماع السكان.
- source_word: πρὸς τὴν θύραν
  choice: عند الباب
  rationale: مع أن πρός مع المنصوب قد تُترجم حرفيًا «إلى الباب»، فإن السياق الساكن هنا يدل على موضع الجمع عند مدخل البيت؛ لذا فـ«عند الباب» أوضح وأفصح.
- source_word: θύραν
  choice: الباب
  rationale: المعنى المباشر هو «الباب»، والمقصود سياقيًا باب البيت أو مدخله، ولا حاجة إلى استبداله بلفظ تفسيري في المتن.
