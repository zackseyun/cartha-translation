  text: καὶ ⸀ἦλθεν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ αὐτῶν εἰς ὅλην τὴν Γαλιλαίαν καὶ τὰ δαιμόνια ἐκβάλλων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: ar
  text: ومضى في أنحاء الجليل كله[a]، يكرز في مجامعهم ويطرد الشياطين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وجاء يكرز في مجامعهم في أنحاء الجليل كله ويطرد الشياطين». يمكن أن يُترجم الفعل اليوناني «جاء»، لكن السياق يرجّح أنه يصف تنقّله في أنحاء المنطقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: مضى
  rationale: الفعل ἔρχομαι قد يعني «جاء»، لكن السياق هنا، مع ذكر الجليل كله وصيغتي الحال، يصوّر تنقّل يسوع في المنطقة. و«مضى» تعبير عربي طبيعي يحفظ معنى الحركة من غير مبالغة في تفسيرها.
- source_word: κηρύσσων
  choice: يكرز
  rationale: يدل κηρύσσω على الإعلان العلني. و«يكرز» مقابل كتابي عربي واضح وموجز يلائم نشاط يسوع في المجامع.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: في مجامعهم
  rationale: مع أن εἰς تعني حرفيًا «إلى/داخل»، فهي هنا تفيد مجال وقوع الكرازة؛ لذلك تأتي «في مجامعهم» طبيعية ودقيقة، مع إبقاء الضمير αὐτῶν.
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: في الجليل كله
  rationale: العبارة تحدد امتداد الحركة إلى المنطقة بأسرها. و«في الجليل كله» تحفظ ὅλην وتؤدي المعنى الجغرافي التوزيعي في عربية طبيعية.
- source_word: τὰ δαιμόνια
  choice: الشياطين
  rationale: δαιμόνια تشير تحديدًا إلى كائنات شيطانية، و«الشياطين» مقابل عربي مباشر لا يستبدلها بالتعبير الأوسع «الأرواح النجسة».
- source_word: ἐκβάλλων
  choice: يطرد
  rationale: في سياق إخراج الشياطين، يفيد ἐκβάλλω الطرد أو الإخراج. و«يطرد» واضح وطبيعي في العربية المعاصرة.
theological_decisions:
- issue: طبيعة τὰ δαιμόνια
  choice: ترجمتها «الشياطين» بوصفها كائنات روحية شخصية بحسب العرض المباشر للنص.
  alternative: الأرواح الشريرة
  rationale: «الشياطين» هي المقابل المعجمي الأدق، وتحفظ تصوير النص لسلطان يسوع عليها من غير إضافة تحديدات عقائدية لا يصرح بها العدد.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُعمل «يكرز» للمحافظة على معنى الإعلان العلني، و«مضى» لإظهار الحركة السياقية مع إبقاء احتمال «جاء» في الحاشية.
