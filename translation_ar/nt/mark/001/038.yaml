base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: ar
  text: 'فقال لهم: «لنذهب إلى مواضع أخرى، إلى البلدات المجاورة[b]، لكي أكرز هناك أيضًا، فلهذا خرجتُ[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلهذا الغرض خرجتُ». قد تشير العبارة ببساطة إلى خروج يسوع من المكان الحاضر، أو على نحو أوسع إلى غرضه من الخروج للكرازة.'
    reason: alternative_reading
  - marker: b
    text: يمكن أن يدل اللفظ اليوناني المترجم «البلدات» على تجمعات سكانية صغيرة، تقع بين القرى والمدن.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγωμεν
  choice: لنذهب
  rationale: صيغة حثّ بضمير المتكلم الجمع؛ و«لنذهب» عربية طبيعية تحفظ معنى الدعوة المشتركة.
- source_word: ἀλλαχοῦ
  choice: إلى مواضع أخرى
  rationale: يفيد الظرف الانتقال إلى مكان آخر؛ وهذه الصياغة واضحة وطبيعية في العربية.
- source_word: ἐχομένας
  choice: المجاورة
  rationale: تُستعمل هنا مكانيًا للدلالة على البلدات القريبة أو المتاخمة.
- source_word: κωμοπόλεις
  choice: البلدات
  rationale: يدل اللفظ على تجمعات سكانية صغيرة تقع دلاليًا بين القرى والمدن؛ و«البلدات» أقرب مقابل عربي موجز.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: لكي أكرز هناك أيضًا
  rationale: تحفظ «لكي» معنى الغاية، و«أكرز» معنى الإعلان العلني، و«هناك أيضًا» دلالة καὶ ἐκεῖ.
- source_word: εἰς τοῦτο
  choice: فلأجل هذا
  rationale: تنقل العبارة معنى الغرض أو السبب مع إبقاء مرجع «هذا» مفتوحًا للسياق.
- source_word: ἐξῆλθον
  choice: خرجتُ
  rationale: ترجمة مباشرة للفعل الماضي، وتحفظ احتمال أن يكون المقصود الخروج من الموضع الحاضر أو الخروج للكرازة بمعنى أوسع.
- source_word: λέγει αὐτοῖς
  choice: فقال لهم
  rationale: حُوِّل المضارع التاريخي اليوناني إلى الماضي، وفق الأسلوب السردي العربي الطبيعي.
theological_decisions:
- issue: نطاق دلالة ἐξῆλθον
  choice: خرجتُ
  alternative: خرجتُ من هذا الموضع؛ أو خرجتُ لهذه الرسالة
  rationale: لا يحدد النص اليوناني هل يشير يسوع إلى مغادرته المكان الحاضر فحسب أم إلى غرض أوسع لخروجه إلى الكرازة؛ لذلك تُركت العبارة عامة دون حسم لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية رصينة. وُضعت علامة الحاشية [b] بعد «البلدات المجاورة» لأنها تشرح κωμοπόλεις، وعلامة [a] بعد «خرجتُ» لأنها تتناول نطاق دلالة ἐξῆλθον.
