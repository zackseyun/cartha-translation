source:
  edition: SBLGNT
  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: ar
  text: 'كما هو مكتوب في إشعياء النبي: «ها أنا أرسل رسولي أمام وجهك[a]، وهو سيُعِدّ طريقك».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمامك». وحرفيًا: «أمام وجهك».'
    reason: lexical_alternative
  - marker: b
    text: 'تجمع صياغة الاقتباس بين ملاخي 3:1 وإشعياء 40:3. وتقرأ بعض المخطوطات: «في الأنبياء» بدلًا من «في إشعياء النبي».'
    reason: cross_reference_and_textual_variant
lexical_decisions:
- source_word: Καθὼς
  choice: كما
  rationale: تفيد المطابقة والاتساق مع النص المكتوب، وهي صياغة عربية طبيعية ومباشرة.
- source_word: γέγραπται
  choice: هو مكتوب
  rationale: تحافظ على صيغة الاستشهاد الكتابي وعلى دلالة الحالة القائمة الناتجة من صيغة التام المبني للمجهول.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: في إشعياء النبي
  rationale: تنقل نسبة القول إلى إشعياء بصياغة عربية واضحة، من غير تسوية التوتر الناشئ عن كون الاقتباس مركبًا.
- source_word: Ἰδοὺ
  choice: ها أنا
  rationale: في السياق المتصل بضمير المتكلم، تؤدي «ها أنا» وظيفة التنبيه النبوي بعبارة عربية فصيحة وطبيعية.
- source_word: ἀποστέλλω
  choice: أرسل
  rationale: تنقل المضارع اليوناني مباشرة وتحافظ على حيوية الإعلان النبوي.
- source_word: ἄγγελόν
  choice: رسولي
  rationale: المقصود رسول أو مبعوث يمهّد الطريق؛ و«رسولي» تنقل اللفظ من غير الإيحاء الضروري بكائن سماوي.
- source_word: πρὸ προσώπου σου
  choice: أمام وجهك
  rationale: تحافظ على صورة العبارة اليونانية الحرفية مع بقاء المعنى مفهومًا؛ ويبيّن الهامش البديل الاصطلاحي.
- source_word: κατασκευάσει
  choice: سيُعِدّ
  rationale: ينقل معنى التهيئة والاستعداد بوضوح وإيجاز.
- source_word: τὴν ὁδόν σου
  choice: طريقك
  rationale: يحفظ صورة الطريق ودلالتها المجازية المحتملة من غير تفسير زائد.
theological_decisions:
- issue: يسمي نص الاستشهاد إشعياء وحده، مع أن صياغة الاقتباس تجمع مادة مرتبطة بملاخي وإشعياء.
  choice: الإبقاء على «في إشعياء النبي» في المتن.
  alternative: «في الأنبياء»
  rationale: هذه هي قراءة SBLGNT، فلا ينبغي تنسيقها أو إزالة التوتر في الترجمة؛ وتُذكر القراءة المخطوطية البديلة ومصدر الاقتباس المركب في الهوامش.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. أُبقيت صورة «أمام وجهك» لقربها من الأصل، مع توضيح الصياغة الاصطلاحية في الهامش. وُضع كل مؤشر هامشي في المتن.
