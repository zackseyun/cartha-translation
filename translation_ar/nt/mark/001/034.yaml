  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: ar
  text: وشفى كثيرين ممن كانوا يعانون أمراضًا متنوعة، وأخرج شياطين كثيرة، ولم يكن يسمح للشياطين أن تتكلم، لأنها كانت تعرفه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كانت تعرف من هو». واليونانية تقول ببساطة: «كانت تعرفه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: شفى
  rationale: الفعل «شفى» هو المقابل العربي الطبيعي المباشر في سياق إزالة المرض.
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: كثيرين ممن كانوا يعانون
  rationale: ينقل التعبير اليوناني الاصطلاحي الدال على سوء الحال والمرض بصياغة عربية طبيعية، مع اقترانه بذكر الأمراض بعده.
- source_word: ποικίλαις νόσοις
  choice: أمراضًا متنوعة
  rationale: يحفظ معنى تنوع الأمراض بعبارة عربية واضحة وموجزة.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: أخرج شياطين كثيرة
  rationale: «أخرج» يحفظ معنى الطرد من الأشخاص في هذا السياق، وهو تعبير عربي كتابي واضح.
- source_word: οὐκ ἤφιεν
  choice: لم يكن يسمح
  rationale: تنقل هذه الصياغة القيمة الاستمرارية للفعل اليوناني الناقص، لا مجرد واقعة منع واحدة.
- source_word: λαλεῖν
  choice: أن تتكلم
  rationale: صياغة عربية فصيحة وطبيعية للفعل العام الدال على الكلام.
- source_word: ὅτι
  choice: لأن
  rationale: 'تفيد العلاقة السببية الأرجح هنا: منعها من الكلام بسبب معرفتها به.'
- source_word: ᾔδεισαν αὐτόν
  choice: كانت تعرفه
  rationale: يحافظ على المفعول الصريح الموجز «إياه/هو» في اليونانية من غير توسيع معنى المعرفة إلى تصريح كامل بهويته.
theological_decisions:
- issue: هل تُوسَّع معرفة الشياطين إلى إقرار صريح بهوية يسوع؟
  choice: كانت تعرفه
  alternative: كانت تعرف من هو
  rationale: النص اليوناني يقول حرفيًا إنها كانت «تعرفه»، ولا يصرّح هنا بمضمون أشمل؛ لذلك تُحفظ الصياغة الموجزة والتوتر اللاهوتي من غير استيراد تفسير من السياق القريب.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «لم يكن يسمح» لإبراز الاستمرار، وحُفظت عبارة «كانت تعرفه» من غير توسع تفسيري.
