lexical_decisions:
- source_word: πενθερὰ
  choice: حماة
  rationale: اسم القرابة المعتاد لأم الزوجة، وهو واضح وطبيعي في العربية الفصحى المعاصرة.
- source_word: κατέκειτο
  choice: كانت راقدةً
  rationale: ينقل صيغة الماضي الناقص الدالة على حالة مستمرة من الرقود، من غير المبالغة بالقول إنها كانت ملازمة للفراش.
- source_word: πυρέσσουσα
  choice: وهي مصابة بالحمّى
  rationale: يعبّر طبيعيًا عن اسم الفاعل الذي يفيد المعاناة من الحمّى، مع إبقاء المرض واضحًا.
- source_word: εὐθὺς
  choice: في الحال
  rationale: يحفظ معنى المبادرة والسرعة المتكرر في أسلوب مرقس بصياغة عربية واضحة.
- source_word: λέγουσιν
  choice: أخبروه
  rationale: المعنى في السياق هو إبلاغ يسوع بحالها؛ استُعمل الماضي لانسجام السرد العربي، مع بيان المضارع التاريخي في الحاشية.
- source_word: περὶ αὐτῆς
  choice: عنها
  rationale: مقابل عربي موجز وطبيعي لمعنى «بشأنها» أو «عنها».
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد، ولا يدل السياق على تضاد قوي.
