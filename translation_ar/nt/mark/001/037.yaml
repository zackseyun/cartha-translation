  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: ar
  text: 'فوجدوه وقالوا له: «الجميع يبحثون عنك[a]».


    [a] أو: «الجميع يطلبونك». يمكن أن يدل الفعل اليوناني ζητοῦσίν على الطلب أو السعي، لكن السياق هنا يرجّح أن الناس كانوا يحاولون العثور على يسوع.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الجميع يطلبونك». يمكن أن يدل الفعل اليوناني ζητοῦσίν على الطلب أو السعي، لكن السياق هنا يرجّح أن الناس كانوا يحاولون العثور على يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: فـ / و
  rationale: نُقلت أداة الربط بما يلائم السرد العربي؛ فالفاء في «فوجدوه» تصل الحدث بما سبقه، والواو تربط فعل القول بالعثور.
- source_word: εὗρον
  choice: وجدوه
  rationale: صيغة الماضي تدل هنا على نجاح البحث والوصول إليه، و«وجدوه» هي المقابل العربي المباشر والطبيعي.
- source_word: λέγουσιν
  choice: قالوا
  rationale: الفعل مضارع تاريخي في اليونانية، ونُقل بالماضي لأن ذلك هو الأسلوب الطبيعي في السرد العربي.
- source_word: ὅτι
  choice: علامتا الاقتباس
  rationale: تُدخل الأداة كلامًا مباشرًا، وتؤدي علامتا الاقتباس هذه الوظيفة بوضوح في العربية.
- source_word: Πάντες
  choice: الجميع
  rationale: تعبير عربي طبيعي يشير إلى جماعة الناس المعنيين في السياق من غير أن يفرض شمولًا مطلقًا خارج المشهد.
- source_word: ζητοῦσίν σε
  choice: يبحثون عنك
  rationale: الفعل ζητέω يحتمل الطلب أو البحث؛ والسياق المباشر يرجّح محاولة العثور على يسوع، لذا اختير التعبير العربي المألوف «يبحثون عنك».
- source_word: αὐτὸν / αὐτῷ / σε
  choice: ـه / له / عنك
  rationale: نُقلت الضمائر بحسب وظائفها النحوية، مع استعمال حرف الجر الطبيعي في التعبير العربي «يبحثون عنك».
