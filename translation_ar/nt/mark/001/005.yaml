  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: ar
  text: وكان جميع سكان اليهودية وجميع أهل أورشليم يخرجون إليه، وكانوا يُعمَّدون على يده في نهر الأردن، وهم يعترفون بخطاياهم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: كانوا يخرجون
  rationale: ينقل الماضي الناقص اليوناني بوصفه فعلًا مستمرًا أو متكررًا في الزمن الماضي، مع صياغة عربية طبيعية.
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: بلاد اليهودية كلها
  rationale: تعكس «بلاد» الدلالة الجغرافية الواسعة لكلمة χώρα، وتحفظ «كلها» القوة البلاغية لكلمة πᾶσα من غير تحويلها إلى إحصاء حرفي للأفراد.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: أهل أورشليم جميعًا
  rationale: «أهل أورشليم» تعبير عربي واضح وطبيعي عن سكان المدينة، و«جميعًا» تحفظ شمول πάντες.
- source_word: ἐβαπτίζοντο
  choice: كانوا يُعمَّدون
  rationale: تحفظ الصيغة المبنية للمجهول والدلالة الاستمرارية أو التكرارية للماضي الناقص، من غير تفسير كيفية المعمودية أو معناها اللاهوتي.
- source_word: ὑπ’ αὐτοῦ
  choice: على يده
  rationale: تعبير عربي طبيعي يدل على أن يوحنا هو القائم بالفعل، مع إبقاء المرجع ضميرًا كما في اليونانية بدل التصريح باسمه.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: في نهر الأردن
  rationale: يذكر «نهر» صراحةً مقابل ποταμός ويحافظ على حرف الجر المكاني.
- source_word: ἐξομολογούμενοι
  choice: وهم يعترفون
  rationale: تنقل الحال المصاحبة للمعمودية بوضوح، وتحفظ معنى الإقرار بالخطايا من غير زيادة مثل «علانية».
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: بخطاياهم
  rationale: صياغة عربية مباشرة وطبيعية لمفعول الاعتراف مع ضمير الملكية.
theological_decisions:
- issue: مدى الشمول في وصف اليهودية وأورشليم
  choice: إبقاء «كلها» و«جميعًا» مع فهمهما بوصفهما تعميمًا سرديًا جمعيًا
  alternative: تخفيف العبارة إلى «كثيرون من اليهودية وأورشليم»
  rationale: النص اليوناني يستعمل πᾶσα وπάντες، ولذلك ينبغي حفظ قوتهما البلاغية، من غير فرض معنى الشمول الحسابي المطلق على هذا الأسلوب السردي.
- issue: طبيعة فعل المعمودية
  choice: استعمال «يُعمَّدون» من غير تحديد الطريقة أو الدلالة اللاهوتية
  alternative: «يُغمرون» أو «يُغسلون»
  rationale: الآية تذكر الفعل ولا تحسم هنا كيفية إجرائه ولا تشرح مضمونه اللاهوتي؛ لذا يتجنب النص إدخال تمييز طائفي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «بلاد اليهودية» لتجنب جمود النقل الحرفي، و«أهل أورشليم» بدل نسبة أقل تداولًا، مع الحفاظ على التوازي والتكرار الدالين على استمرار الحدث.
