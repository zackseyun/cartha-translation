source:
  edition: SBLGNT
  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: ar
  text: 'ويأتي إليه رجلٌ مصابٌ بالبَرَص[a]، يتوسّل إليه ويجثو على ركبتيه، ويقول له: «إن شئتَ، فأنت قادرٌ أن تطهّرني[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أبرص». وكان اللفظ يُستعمل لأمراض جلدية مختلفة، لا لما يُسمّى اليوم طبيًا مرض هانسن وحده.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أن تجعلني طاهرًا». قد يشير الفعل اليوناني إلى التطهير من النجاسة، وكذلك إلى التعافي الجسدي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: رجلٌ مصابٌ بالبَرَص
  rationale: صياغة تضع الشخص أولًا، وتنقل دلالة الصفة اليونانية المستعملة اسمًا على شخص مصاب بمرض جلدي كان يُسمّى البرص، من غير اختزاله في مرضه.
- source_word: παρακαλῶν
  choice: يتوسّل إليه
  rationale: ينقل معنى الالتماس الجاد في سياق طلب الشفاء، وهو طبيعي وواضح في العربية.
- source_word: γονυπετῶν
  choice: يجثو على ركبتيه
  rationale: يعبّر بوضوح عن اتخاذ وضع الركوع، مع إبقاء الفعل موازيًا لسلسلة الأفعال في النص.
- source_word: Ἐὰν θέλῃς
  choice: إن شئتَ
  rationale: صياغة عربية موجزة وطبيعية تحفظ شرط الإرادة أو الاستعداد، لا معنى المستقبل.
- source_word: δύνασαί
  choice: فأنت قادرٌ
  rationale: يصرّح بمعنى القدرة الكامن في الفعل اليوناني، ولا يختزله في مجرد إمكان عابر.
- source_word: καθαρίσαι
  choice: أن تطهّرني
  rationale: يحفظ دلالة التطهير التي قد تشمل زوال المرض والنجاسة الطقسية، بدل حصرها في الشفاء الجسدي.
- source_word: ἔρχεται
  choice: ويأتي
  rationale: يحافظ على المضارع التاريخي الحيّ المميّز لسرد مرقس.
theological_decisions:
- issue: طبيعة التطهير في سياق البرص
  choice: أن تطهّرني
  alternative: أن تشفيني
  rationale: استعمل النص فعل التطهير لا فعل الشفاء المعتاد؛ لذلك تُرك التداخل بين التعافي الجسدي وزوال النجاسة الطقسية قائمًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُعملت صياغة تضع الشخص أولًا، وحُفظ المضارع التاريخي وتسلسل الأفعال، مع تجنّب حصر «التطهير» في بُعد جسدي أو طقسي وحده.
