  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: ar
  text: بَدْءُ بشارةِ[a] يسوعَ المسيحِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إنجيل». فاللفظة اليونانية εὐαγγέλιον تعني الخبر السار، وتُترجم تقليديًّا أيضًا بـ«الإنجيل».
    reason: lexical_alternative
  - marker: b
    text: اللفظة اليونانية Χριστός لقب يعني «الممسوح»، ويقابله في العربية «المسيح».
    reason: title_clarification
lexical_decisions:
- source_word: Ἀρχὴ
  choice: بَدْءُ
  rationale: يحافظ على صيغة الاستهلال الاسمية في اليونانية من غير تحويلها إلى جملة فعلية أو تفسير المقصود بأنه مجرد بداية السرد.
- source_word: εὐαγγελίου
  choice: بشارةِ
  rationale: تنقل المعنى المعجمي بوصفه خبرًا سارًّا، وهي لفظة عربية واضحة ومألوفة دينيًّا؛ ويُذكر «الإنجيل» في الحاشية بوصفه المقابل التقليدي.
- source_word: Ἰησοῦ
  choice: يسوعَ
  rationale: استُخدمت الصيغة العربية المعيارية للاسم الشخصي.
- source_word: χριστοῦ
  choice: المسيحِ
  rationale: تنقل اللقب اليوناني بمعناه، ولا تعامله كلقب عائلي. وفي العربية، «المسيح» هو أيضًا المقابل التقليدي المستقر، لذلك لا يلزم الاختيار بين «Messiah» و«Christ» كما في الإنجليزية.
theological_decisions:
- issue: هل تُفهم إضافة «بشارة يسوع المسيح» على أنها البشارة عنه أم البشارة التي أعلنها؟
  choice: 'الإبقاء على الإضافة: «بشارة يسوع المسيح»'
  alternative: البشارة بيسوع المسيح
  rationale: الإضافة اليونانية تحتمل من حيث الصياغة صلة البشارة بيسوع بغير تعيين صريح لنوعها. وتحافظ الإضافة العربية على هذا القدر من الانفتاح، بينما تحسم صيغة «البشارة بيسوع» المعنى في اتجاه كونها بشارة عنه.
- issue: هل يُنقل Χριστός كلقب مترجم أم كصيغة اسمية تقليدية؟
  choice: المسيح
  alternative: المسيح، أي المَسيّا
  rationale: «المسيح» في العربية لقب ذو معنى ومستقر في الاستعمال الكتابي، فيحفظ الدلالة المسيانية من غير إيهام بأنه اسم عائلة.
translation_notes:
  register: صياغة عربية فصحى حديثة موجزة ومهيبة، تتبع البنية الاسمية للاستهلال اليوناني. استُعملت الإضافة بدل حرف جر تفسيري للمحافظة على احتمال العلاقة التي تفيدها صيغة المضاف إليه في الأصل.
