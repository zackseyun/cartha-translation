lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: بعد أن تقدَّم قليلًا
  rationale: ينقل اسم الفاعل الماضي بوظيفته الزمنية والظرفية، ويعبّر بوضوح عن مواصلة السير مسافة قصيرة.
- source_word: εἶδεν
  choice: رأى
  rationale: المعنى السردي المباشر للفعل من غير إضافة دلالة الانتباه أو التشديد.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: يعقوب بن زبدي
  rationale: تركيب المضاف إليه يعرّف يعقوب بنسبه، وصيغة «بن زبدي» طبيعية وموجزة في العربية.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: يوحنا أخاه
  rationale: الضمير يعود على الأرجح إلى يعقوب، وتحافظ الصياغة على إيجاز الأصل ووضوح صلة الأخوّة.
- source_word: καὶ αὐτοὺς
  choice: وكانا هما أيضًا
  rationale: تفيد العبارة أن يسوع رآهما هما أيضًا على الحال الموصوفة، وتعيد العربية بناء التركيب بصيغة طبيعية مع إبراز معنى «أيضًا».
- source_word: ἐν τῷ πλοίῳ
  choice: في القارب
  rationale: أداة التعريف تشير إلى القارب المحدد المرتبط بهما في المشهد.
- source_word: καταρτίζοντας
  choice: يُصلحان
  rationale: للفعل نطاق يشمل التقويم والتهيئة وإعادة الشيء إلى حال سليمة؛ وفي سياق شباك الصيد، «يُصلحان» هو التعبير العربي الطبيعي مع إبقاء البدائل في الحاشية.
- source_word: τὰ δίκτυα
  choice: الشباك
  rationale: ينقل اسم شباك الصيد مع أداة التعريف، من غير إضافة ضمير ملكية غير مصرح به في اليونانية.
