  text: καὶ ἐμβριμησάμενος αὐτῷ ⸀εὐθὺς ἐξέβαλεν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/043.yaml
  text: And after sternly warning him[a], he immediately sent him away[b],
translation:
  language: ar
  text: وبعد أن حذَّره بصرامة[a]، صرفه في الحال[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أوصاه بصرامة» أو «زجره بشدة»؛ فقد يدل الفعل اليوناني أيضًا على انفعال شديد أو استياء صارم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أخرجه في الحال» أو «دفعه إلى الخروج»؛ فالفعل اليوناني أقوى من مجرد «صرفه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβριμησάμενος
  choice: بعد أن حذَّره بصرامة
  rationale: يحمل الفعل معنى الشدة والانفعال، وقد يدل على التحذير الصارم أو الزجر. وفي هذا السياق يمهّد للأمر الوارد في العدد التالي، لذلك تنقل الصياغة قوة التكليف من غير أن تفترض أن الرجل نفسه كان موضع إدانة.
- source_word: αὐτῷ
  choice: ـه في «حذَّره»
  rationale: ضمير في حالة المجرور غير المباشر يعود إلى الرجل الذي شُفي، وأُدمج طبيعيًا في الفعل العربي.
- source_word: εὐθύς
  choice: في الحال
  rationale: تعبير عربي واضح يحفظ معنى الفورية وسرعة السرد المميزة لمرقس.
- source_word: ἐξέβαλεν
  choice: صرفه
  rationale: الفعل اليوناني أقوى من مجرد الإرسال، وقد يعني الإخراج أو الطرد. «صرفه» ملائم للسياق ولا يوحي بالضرورة بطرد عدائي، مع إثبات القوة الدلالية البديلة في الحاشية.
- source_word: αὐτόν
  choice: ـه في «صرفه»
  rationale: ضمير مفعول به يعود إلى الرجل نفسه، وأُدمج في الفعل العربي.
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يواصل السرد ويحافظ على أسلوب مرقس.
theological_decisions:
- issue: نبرة تصرف يسوع تجاه الرجل الذي شُفي
  choice: إبراز شدة التحذير وسرعة صرف الرجل، من غير وصف ذلك بأنه غضب آثم أو عداوة شخصية.
  alternative: فهم العبارة على أنها مجرد وصية حازمة قليلة الانفعال، أو على أنها زجر شخصي للرجل.
  rationale: كل من ἐμβριμησάμενος وἐξέβαλεν يحمل قوة ملحوظة. تحفظ الترجمة هذه الشدة، بينما تترك طبيعة الانفعال الدقيقة مفتوحة ولا تستورد حكمًا لاهوتيًا لا يصرح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. تحافظ الصياغة على ترتيب الحدثين وعلى شدة الفعلين اليونانيين، مع عرض البدائل الدلالية في الحاشيتين دون حسم ما يظل محتملًا في الأصل.
