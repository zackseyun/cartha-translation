lexical_decisions:
- source_word: κατεδίωξεν
  choice: لحق به
  rationale: يفيد الفعل اليوناني السعي الجاد وراء شخص أو تعقبه. وتؤدي «لحق به» هذا المعنى بقوة طبيعية في العربية من غير الإيحاء العدائي الذي قد تحمله «طارده».
- source_word: αὐτὸν
  choice: به
  rationale: الضمير يعود في السياق المباشر إلى يسوع، وجاء متصلًا بحرف الجر وفق تركيب الفعل العربي «لحق به».
- source_word: Σίμων
  choice: سمعان
  rationale: الصيغة العربية الكتابية المألوفة للاسم اليوناني Σίμων.
- source_word: οἱ μετ’ αὐτοῦ
  choice: الذين معه
  rationale: ترجمة قريبة وواضحة تحفظ عموم العبارة، من غير أن تضيف تحديدًا مثل «رفاقه» أو «تلاميذه».
- source_word: καὶ
  choice: فـ
  rationale: الفاء تربط الحدث بما قبله ربطًا سرديًا طبيعيًا، وتحافظ على تتابع رواية مرقس دون إثقال العبارة بتكرار «و».
