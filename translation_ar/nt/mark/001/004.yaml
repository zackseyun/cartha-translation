base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: ar
  text: ظهر يوحنا المعمدان في البرية[a]، ينادي بمعمودية التوبة لمغفرة الخطايا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ظهر يوحنا الذي كان يعمّد في البرية، مناديًا…». يمكن نقل اسم الفاعل اليوناني بصياغة صريحة تصف دوره بدل اللقب «المعمدان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ظهر
  rationale: يؤدي الفعل هنا وظيفة سردية تُدخل يوحنا إلى المشهد؛ و«ظهر» عربية طبيعية تحفظ هذه القوة من غير ترجمة حرفية ثقيلة مثل «صار».
- source_word: Ἰωάννης
  choice: يوحنا
  rationale: الصيغة العربية المألوفة للاسم في التراث الكتابي والاستعمال العربي العام.
- source_word: ὁ βαπτίζων
  choice: المعمدان
  rationale: اسم الفاعل المعرّف يصف يوحنا بدوره في التعميد، و«المعمدان» اللقب العربي الراسخ والطبيعي، مع بيان الصياغة الأكثر حرفية في الحاشية.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: «البرية» تؤدي المعنى الجغرافي والكتابي للكلمة من غير أن تحصره في صحراء رملية.
- source_word: κηρύσσων
  choice: ينادي
  rationale: تحفظ «ينادي» معنى الإعلان العلني الذي يحمله الفعل اليوناني، وهي واضحة وغير محصورة في الوعظ الكنسي.
- source_word: βάπτισμα
  choice: معمودية
  rationale: المصطلح العربي المعروف الذي يقابل الاسم اليوناني في هذا السياق.
- source_word: μετανοίας
  choice: التوبة
  rationale: تحفظ الدلالة الأخلاقية والروحية للتحول والرجوع، وتلائم تركيب الإضافة في «معمودية التوبة».
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: لمغفرة الخطايا
  rationale: اللام تعبّر بإيجاز طبيعي عن الغاية أو النتيجة من غير أن تحسم العلاقة الدقيقة بين المعمودية والمغفرة، و«مغفرة» هي المقابل السياقي الملائم لـἄφεσις.
theological_decisions:
- issue: العلاقة بين المعمودية والتوبة ومغفرة الخطايا
  choice: معمودية التوبة لمغفرة الخطايا
  alternative: معمودية ترمز إلى التوبة من أجل المغفرة؛ معمودية تؤدي بالتوبة إلى المغفرة
  rationale: يحافظ التركيب على علاقة العناصر كما يعرضها النص اليوناني، من غير أن يقرر ما إذا كانت المعمودية وسيلة للمغفرة أو رمزًا لها أو إعلانًا عنها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «المعمدان» للقب المألوف، و«البرية» للرنين الجغرافي والكتابي، مع تجنب ألفاظ تحسم جدلًا لاهوتيًا لا يحسمه التركيب اليوناني.
