  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: ar
  text: وكانوا يندهشون من تعليمه، لأنه كان يعلّمهم كمن له سلطان، لا كالكتبة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: كانوا يندهشون
  rationale: ينقل الفعل الناقص ردَّ فعل قويًّا ومستمرًّا أو متكررًا، وصيغة «كانوا يندهشون» طبيعية وتحفظ جانبه الاستمراري.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: من تعليمه
  rationale: «تعليمه» تشمل هنا مضمون ما كان يعلّمه وطريقته، وحرف الجر «من» يعبّر طبيعيًّا عن سبب اندهاشهم.
- source_word: ἦν γὰρ διδάσκων
  choice: لأنه كان يعلّمهم
  rationale: تحفظ الصيغة العربية معنى البناء المحيطي اليوناني الدال على استمرار التعليم.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: كمن له سلطان
  rationale: تحفظ أداة التشبيه ὡς وبنية العبارة، وتنقل ἐξουσία بمعنى السلطة أو الحق في التصرّف والتعليم.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: هو المقابل العربي المباشر للمصطلح الذي يدل على الخبراء اليهود في الشريعة، من غير إدخال تفسير في المتن.
theological_decisions:
- issue: طبيعة سلطان يسوع في مقابل الكتبة
  choice: 'صياغة وصفية: «كمن له سلطان»'
  alternative: «بسلطان إلهي»
  rationale: تُبرز الآية سلطان يسوع في التعليم ومخالفته لطريقة الكتبة، لكنها لا تحدد في هذه الجملة مصدر ذلك السلطان أو طبيعته تحديدًا لاهوتيًّا؛ لذلك لا تُضاف صفة «إلهي».
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. اختيرت «يندهشون» لقوة رد الفعل، و«الكتبة» حفاظًا على المصطلح التاريخي الموجز. لا حاجة إلى حاشية لأن «كمن له سلطان» واضحة وتحفظ بنية الأصل.
