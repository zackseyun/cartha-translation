  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: ar
  text: وحدث في تلك الأيام أن جاء يسوع من ناصرة الجليل، واعتمد في الأردن على يد يوحنا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى الأردن». يمكن ترجمة حرف الجر اليوناني بهذه الصورة الأكثر حرفية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: وحدث
  rationale: ينقل العبارة الانتقالية السردية بوضوح وطبيعية في العربية المعاصرة، من غير استعمال الصيغة الأقدم «وكان» على نحو قد يوهم ارتباطًا نحويًا مختلفًا.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: في تلك الأيام
  rationale: مقابل مباشر يحفظ التحديد الزمني والنبرة السردية.
- source_word: ἦλθεν
  choice: جاء
  rationale: ينقل فعل الحركة الأساسي من غير إضافة تشديد على بلوغ الوجهة كما قد تفعل «وصل».
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: من ناصرة الجليل
  rationale: صياغة عربية موجزة وطبيعية تحفظ نسبة ناصرة إلى إقليم الجليل، من غير توسيع النص إلى عبارة تفسيرية.
- source_word: ἐβαπτίσθη
  choice: تعمَّد
  rationale: ينقل الفعل المبني للمجهول دلاليًا بصيغة عربية مألوفة تفيد تلقي المعمودية، ولا يحصر كيفية إجرائها في «الغطس».
- source_word: εἰς τὸν Ἰορδάνην
  choice: في الأردن
  rationale: صياغة عربية طبيعية تحدد موضع المعمودية؛ وتُذكر «إلى الأردن» في الحاشية بوصفها مقابلاً أكثر حرفية لحرف الجر اليوناني.
- source_word: ὑπὸ Ἰωάννου
  choice: على يد يوحنا
  rationale: تعبير عربي طبيعي واضح للدلالة على الفاعل الشخصي مع المبني للمجهول.
theological_decisions:
- issue: ترجمة βαπτίζω في سياق ذي حساسية طائفية
  choice: تعمَّد
  alternative: غُطس
  rationale: «تعمَّد» هو المصطلح العربي الواسع والمباشر للحدث، ويحفظ تقرير النص من غير أن يفرض تحديدًا لطريقة المعمودية يتجاوز ما يلزم من اللفظ في هذه الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُعملت «ناصرة الجليل» و«على يد يوحنا» للمحافظة على الإيجاز والطبيعية، مع إبقاء البديل الحرفي لحرف الجر في الحاشية.
