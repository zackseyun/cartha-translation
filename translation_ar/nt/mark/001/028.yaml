  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: ar
  text: وانتشر الخبر عنه في الحال في جميع أنحاء المنطقة المحيطة بالجليل.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وذاع صيته في الحال في جميع أنحاء المنطقة المحيطة بالجليل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: انتشر
  rationale: مع أن الفعل يعني حرفيًا «خرج»، فإنه مع «الخبر» يصف ذيوعه وانتقاله، و«انتشر» هو التعبير العربي الطبيعي الذي يؤدي الصورة السياقية من غير زيادة في المعنى.
- source_word: ἀκοὴ
  choice: الخبر
  rationale: يدل هنا على ما يُسمع ويُتداول عن يسوع، أي الخبر أو النبأ، لا مجرد فعل السماع ولا بالضرورة الشهرة.
- source_word: αὐτοῦ
  choice: عنه
  rationale: الإضافة مع ἀκοή تبين موضوع الخبر، ولذلك تُنقل طبيعيًا إلى العربية بقولنا «الخبر عنه».
- source_word: εὐθὺς
  choice: في الحال
  rationale: تنقل سرعة وقوع الحدث، وهي صياغة عربية واضحة تلائم تكرار هذا اللفظ في سرد مرقس.
- source_word: πανταχοῦ
  choice: في كل مكان
  rationale: مقابل مباشر وواضح للظرف الذي يفيد الشمول المكاني.
- source_word: περίχωρον
  choice: نواحي
  rationale: تدل على المنطقة أو الأنحاء المحيطة؛ و«نواحي» طبيعية في العربية وتتفادى الإيحاء بأن المقصود منطقة منفصلة خارج الجليل.
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: في كل مكان من جميع نواحي الجليل
  rationale: تؤدي الامتداد الشامل للخبر إلى أنحاء الجليل المحيطة. استُعملت «في» بدل النقل الحرفي الجامد لـεἰς لأن العربية تصف انتشار الخبر داخل نطاق جغرافي بهذه الصياغة، مع بقاء معنى الحركة والاتساع في فعل «انتشر».
theological_decisions:
- issue: دلالة ἀκοὴ αὐτοῦ
  choice: الخبر عنه
  alternative: شهرته
  rationale: «الخبر عنه» يحافظ على معنى ما كان الناس يسمعونه ويتداولونه عن يسوع، بينما «شهرته» ترجح معنى السمعة أو الصيت أكثر مما يقتضيه اللفظ.
- issue: علاقة περίχωρον بالجلـيل
  choice: جميع نواحي الجليل
  alternative: المنطقة المحيطة بالجليل
  rationale: تُفهم الإضافة على أنها تحدد النواحي التابعة للجليل أو الواقعة فيه، لا أنها تفرض منطقة خارجة عن حدوده؛ والصياغة المختارة تترك الوصف الجغرافي عامًا بلا إفراط في التحديد.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. اختير «انتشر الخبر عنه» بدل «خرج الخبر عنه» لأن الأول هو الاستعمال العربي الطبيعي مع الأخبار، مع الحفاظ على سرعة الانتشار وشموله المكاني. وُضعت علامة الحاشية [a] في المتن.
