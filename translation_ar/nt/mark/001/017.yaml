  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: ar
  text: 'وقال لهم يسوع: «تعالوا ورائي، وسأجعلكم تصيرون صيّادي الناس».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «تعالوا ورائي» إلى: «اتبعوني».'
    reason: يوضح المعنى الاصطلاحي المحتمل للتعبير اليوناني مع إبقاء صورته المكانية في المتن.
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: تعالوا ورائي
  rationale: ينقل الدعوة إلى اتباع يسوع بصياغة عربية طبيعية، مع الحفاظ على صورة السير وراءه.
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: أجعلكم تصيرون
  rationale: يحافظ على وجود كل من معنى الجعل ومعنى الصيرورة في التركيب اليوناني، بدل اختزاله إلى «أجعلكم» فقط.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: صيّادي بشر
  rationale: يحفظ الاستعارة الحرفية للصيد، ويترجم ἀνθρώπων بلفظ «بشر» الشامل للناس دون إيحاء بأنه مقصور على الذكور.
theological_decisions:
- issue: طبيعة التحول في دعوة التلميذين
  choice: أجعلكم تصيرون
  alternative: أجعلكم صيّادي بشر
  rationale: الصياغة المختارة لا تحدد آلية التحول ولا توقيته، لكنها تحفظ دلالة الصيرورة الموجودة صراحة في γενέσθαι.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «صيّادي بشر» بدل «صيّادي رجال» لأن ἀνθρώπων يدل هنا على البشر عمومًا، مع الحفاظ على الاستعارة الأصلية.
