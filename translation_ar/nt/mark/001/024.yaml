  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: ar
  text: 'قائلًا: «ما لنا ولك[a]، يا يسوع الناصري[b]؟ أجئت لتهلكنا؟ أنا أعرف من أنت: قدوس الله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تعبير يفيد المفاصلة أو المواجهة، ويمكن أن يعني: «ما شأنك بنا؟» أو «ما الذي بيننا وبينك؟»'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يا يسوع الذي من الناصرة». والأصل اليوناني: «يا يسوع الناصري».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: قائلًا
  rationale: اسم فاعل حالي يواصل وصف كلام الروح النجس في السياق السابق، وتحافظ «قائلًا» على صلة الآية بما قبلها.
- source_word: Τί ἡμῖν καὶ σοί
  choice: ما لنا ولك
  rationale: صياغة عربية موجزة تحاكي التعبير اليوناني المتأثر بالأسلوب السامي وتحفظ دلالته على المفاصلة أو المواجهة من غير أن تحصره في تفسير واحد.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: يا يسوع الناصري
  rationale: أُثبتت صيغة النداء، وتُرجم الوصف Ναζαρηνέ بالصفة «الناصري» بدل تحويله في المتن إلى عبارة جغرافية تفسيرية.
- source_word: ἦλθες
  choice: أجئت
  rationale: استفهام بالفعل الماضي يلائم العربية الفصحى ويعبّر عن المجيء بوصفه حدثًا ذا غاية حاضرة.
- source_word: ἀπολέσαι
  choice: لتهلكنا
  rationale: «أهلك» يؤدي معنى الإبادة أو التدمير المقصود في السياق، ويحافظ على تركيب الغاية مع المصدر اليوناني.
- source_word: ἡμᾶς
  choice: نا
  rationale: حُفظ ضمير المتكلمين الجمع كما في الأصل، من غير تفسير هوية الجماعة التي يشير إليها المتكلم.
- source_word: οἶδά σε τίς εἶ
  choice: أنا أعرف من أنت
  rationale: صياغة عربية مباشرة لإعلان المعرفة بالهوية، مع إظهار الضمير للتوكيد الطبيعي في هذا السياق.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: قدوس الله
  rationale: يحفظ التعبير قوة اللقب وعلاقة الإضافة في اليونانية، من غير توسيعه إلى تقرير عقائدي أشمل.
theological_decisions:
- issue: اللقب المسيحاني في اعتراف الروح النجس
  choice: قدوس الله
  alternative: القدوس الذي لله
  rationale: «قدوس الله» لقب عربي واضح وموجز يقابل العبارة المعرفة في اليونانية ويحفظ قوة التعرف إلى هوية يسوع، من غير شرح طبيعة اللقب أو تحميله صياغة مذهبية إضافية.
- issue: مرجع ضمير الجمع في «لتهلكنا»
  choice: الإبقاء على الجمع بلا تفسير
  alternative: تحديده صراحة بأنه يشير إلى الأرواح الشريرة
  rationale: النص يستعمل ضمير الجمع مع أن المتكلم مفرد في السياق، ولذلك ينبغي إبقاء هذا التوتر كما هو بدل حسم مرجع الجمع داخل الترجمة.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُبقي التعبير الاصطلاحي «ما لنا ولك» لقربه من الأصل ولشيوعه المفهوم في العربية، مع توضيح معناه في الحاشية. وُضعت علامتا الحاشيتين مباشرة بعد العبارتين اللتين تشرحانهما.
