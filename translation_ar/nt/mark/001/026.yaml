  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: ar
  text: فجعل الروح النجس الرجل يتشنّج[a]، وصرخ بصوت عال[b]، ثم خرج منه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فصرعه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بصرخة عظيمة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαράξαν
  choice: جعل الرجل يتشنّج
  rationale: يدل الفعل هنا على إحداث تشنجات عنيفة في الرجل. وهذه الصياغة واضحة في العربية المعاصرة، وتحافظ على كون الروح هو الفاعل والرجل هو المتأثر بالفعل.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: الروح النجس
  rationale: هذا هو التعبير الإنجيلي المألوف عن روح شيطاني، ويحفظ وصف النجاسة من غير إضافة تفسير عقائدي إلى النص.
- source_word: φωνῆσαν
  choice: صرخ
  rationale: ينقل التلفظ القوي المصاحب لخروج الروح، من غير تحديد انفعال لا يصرح به الأصل.
- source_word: φωνῇ μεγάλῃ
  choice: بصوت عال
  rationale: ترجمة طبيعية لعبارة الحال في اليونانية، وتحافظ على لفظ «الصوت» وعلى معنى شدة ارتفاعه.
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: خرج منه
  rationale: صياغة عربية مباشرة تحفظ المعنى الشخصي والمكاني لخروج الروح من الرجل.
- source_word: καὶ ... καὶ
  choice: و... ثم
  rationale: استُعملت «ثم» قبل الفعل الرئيس لإظهار تعاقب التشنج والصراخ ثم الخروج، وهو ما تلائم دلالته صيغتا اسم الفاعل الماضويتان السابقتان للفعل الرئيس.
theological_decisions:
- issue: طبيعة الكيان الذي كان في الرجل
  choice: الإبقاء على «الروح النجس» بوصفه فاعلًا شخصيًا
  alternative: فهمه على أنه قوة شريرة غير شخصية
  rationale: يعرضه سياق مرقس فاعلًا يقوم بإحداث التشنج والصراخ والخروج. وتحفظ الترجمة هذه الفاعلية الشخصية من غير توسع عقائدي يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. فُكَّ تركيب اسمي الفاعل اليونانيين إلى أفعال متتابعة لسلامة الأسلوب العربي، مع التصريح بـ«الرجل» لإزالة احتمال التباس مرجع الضمير، والمحافظة على تسلسل الأحداث.
