source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: ar
  text: 'وقال له: «انتبه، لا تقل لأحد شيئًا، بل اذهب وأرِ نفسك للكاهن، وقدِّم من أجل تطهيرك ما أمر به موسى، شهادةً لهم».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «دليلًا لهم». قد تعني العبارة دليلًا يُقدَّم للكهنة أو لغيرهم، ويفهمها بعضهم بمعنى أشد: «شهادةً عليهم».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: انتبه
  rationale: فعل أمر يفيد التنبيه والتحذير قبل النهي، و«انتبه» عربية طبيعية تحفظ قوته دون مبالغة.
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: لا تقل لأحد شيئًا
  rationale: يحفظ النفي الشامل في اليونانية، من جهة المخاطَبين ومن جهة مضمون القول.
- source_word: ἀλλὰ ὕπαγε
  choice: بل اذهب
  rationale: «بل» تنقل التقابل التصحيحي بين ما لا ينبغي فعله وما ينبغي فعله، و«اذهب» تقابل الأمر المباشر بالحركة.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: أرِ نفسك للكاهن
  rationale: ترجمة قريبة من البنية اليونانية، وتشير بوضوح إلى عرض النفس على الكاهن للفحص.
- source_word: προσένεγκε
  choice: قدِّم
  rationale: يلائم سياق التقدمة الطقسية، مع بقاء العبارة أوسع من حصرها في لفظ «ذبيحة».
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: من أجل تطهيرك
  rationale: ينقل علاقة التقدمة بالتطهير في السياق الشرعي، و«تطهير» مناسب للمعنى الطقسي المقصود.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: ما أمر به موسى
  rationale: صياغة عربية طبيعية تحفظ الإحالة الجامعة إلى ما نصت عليه شريعة موسى.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: شهادةً لهم
  rationale: تحفظ دلالة الغاية أو النتيجة، وتبقي مرجع الضمير وطبيعة الشهادة مفتوحين كما في الأصل.
theological_decisions:
- issue: مرجع عبارة εἰς μαρτύριον αὐτοῖς وقوتها
  choice: شهادةً لهم
  alternative: شهادةً عليهم؛ أو دليلًا للكهنة
  rationale: الأصل يقول «لهم» ولا يصرّح بمعنى المواجهة أو الإدانة، كما لا يحدد صراحةً هل المقصود الكهنة وحدهم أم غيرهم؛ لذلك تُحفظ العبارة عامة دون حسم.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت صياغة قريبة من الأصل مع سلاسة عربية، وحُفظ غموض العبارة الختامية دون فرض تفسير طائفي أو جدلي.
