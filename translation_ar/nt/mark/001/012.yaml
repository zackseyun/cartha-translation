  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: ar
  text: وفي الحال دفعه الروح إلى البرية[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أخرجه إلى البرية» أو «أرسله إليها». الفعل اليوناني قوي، وهو الفعل الذي يكثر مرقس من استعماله في الحديث عن إخراج الشياطين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: أداة عطف بسيطة تحفظ تدفق السرد عند مرقس من غير أن تضيف تفسيرًا زمنيًا زائدًا.
- source_word: εὐθὺς
  choice: في الحال
  rationale: تعبير عربي طبيعي يحفظ سرعة الحركة السردية وإلحاحها المميزين عند مرقس.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: يحفظ التعريف الوارد في اليونانية، والسياق السابق يحدد أنه الروح الذي نزل على يسوع عند المعمودية، فلا حاجة إلى إضافة «القدس» هنا.
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير المفعول يعود بوضوح إلى يسوع.
- source_word: ἐκβάλλει
  choice: أخرجه ... بقوة
  rationale: يحفظ دلالة الفعل القوية، التي قد تعني الإخراج أو الدفع إلى الخارج، مع تجنب إيحاء عربي غير مقصود بأن الروح طرد يسوع عقابًا أو رفضًا.
- source_word: εἰς τὴν ἔρημον
  choice: إلى البرية
  rationale: «البرية» هي المقابل العربي المألوف لموضع مقفر غير مأهول، ولا تحصر الصورة في صحراء رملية.
theological_decisions:
- issue: قوة فعل الروح تجاه يسوع
  choice: أخرجه الروح بقوة
  alternative: قادَه الروح؛ أرسله الروح؛ دفعه الروح إلى البرية
  rationale: الفعل اليوناني ἐκβάλλει قوي، فلا ينبغي تليينه إلى «قاد». وفي الوقت نفسه، تصوغ العربية القوة بوضوح من غير أن تحسم طبيعة الإلزام أو توحي بعداء الروح ليسوع، وبذلك تبقى المبادرة الإلهية والتوتر النصي محفوظين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «في الحال» بدل صياغة قديمة مثل «للوقت»، و«البرية» للمكان المقفر غير المأهول. أضيف «بقوة» لإظهار شدة ἐκβάλλει طبيعيًا في العربية، مع شرح البدائل في الحاشية.
