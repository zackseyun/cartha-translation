base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: ar
  text: 'فغضب[a]، ومدَّ يده ولمسه، وقال له: «أريد، فاطهُرْ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «تحنَّن» بدلًا من «غضب».'
    reason: textual_variant
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: كان غاضبًا
  rationale: يعكس المعنى المباشر للنص اليوناني المطبوع، أي الغضب، من غير استبداله بالقراءة الأشهر «تحنَّن». وتفيد الصياغة العربية الحالة المصاحبة للأفعال التالية بصورة طبيعية.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: مدَّ يده
  rationale: تعبير عربي طبيعي يحفظ الفعل الجسدي الملموس وتسلسل أحداث الرواية.
- source_word: αὐτοῦ ἥψατο
  choice: لمسه
  rationale: الفعل في هذا السياق يعني اللمس، والضمير يعود إلى الرجل المذكور في السياق السابق. تحافظ الصياغة على دلالة الملامسة الجسدية.
- source_word: λέγει αὐτῷ
  choice: قال له
  rationale: صيغ المضارع التاريخي اليوناني بالماضي العربي بما يلائم السرد العربي الطبيعي من غير تغيير المعنى.
- source_word: Θέλω
  choice: أريد
  rationale: ينقل الفعل اليوناني الدال على الإرادة والاستعداد، ويرتبط مباشرة بطلب الرجل في الآية السابقة. وهو عربي واضح وموجز.
- source_word: καθαρίσθητι
  choice: فاطهُرْ
  rationale: صيغة أمر عربية تحفظ معنى التطهير، بما فيه من تداخل البعدين الجسدي والطقسي في سياق البرص. والفاء تصل الاستجابة بالفعل المأمور به على نحو طبيعي.
theological_decisions:
- issue: الاختلاف النصي في وصف انفعال يسوع
  choice: إثبات قراءة SBLGNT «كان غاضبًا» في المتن
  alternative: «تحنَّن» أو «أشفق عليه»
  rationale: الأولوية للنص اليوناني المحدد في الطلب، وهو يقرأ ὀργισθείς. ولأن القراءة البديلة تغيّر وصف انفعال يسوع تغييرًا مهمًا، تُذكر في الحاشية بدل طمس التوتر النصي أو حسمه تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فاطهُرْ» للحفاظ على الإيجاز وقوة الأمر ودلالة التطهير، مع إبقاء الاختلاف النصي ظاهرًا في الحاشية.
