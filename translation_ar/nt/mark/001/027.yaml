  source_fidelity: 'النص يحافظ بدقة على عناصر اليونانية الأساسية: دهشة الجميع، والنتيجة المتمثلة في تداولهم الأمر فيما بينهم، والسؤال المتعجب، والتعليم الجديد المقترن بالسلطان، وأمر الأرواح النجسة وطاعتها. غير أن «أخذوا يتناقشون» يضيف إيحاءً ابتدائيًا لا يلزم من صيغة المصدر اليونانية، وإن كان لا يغيّر المعنى تغييرًا جوهريًا.'
  naturalness: الصياغة فصيحة وواضحة عمومًا. «فصاروا يتناقشون فيما بينهم» أسلس في سياق النتيجة وأقرب إلى المعنى دون الإيحاء غير اللازم ببدء الفعل. كما أن صياغة الحاشية المقترحة أكثر عربية وطبيعية.
  terminology: «تعليم»، و«بسلطان»، و«الأرواح النجسة»، و«يأمر»، و«تطيعه» اختيارات سليمة ومناسبة للسجل الكتابي العربي الحديث. و«بسلطان» تحافظ على اتساع دلالة ἐξουσία دون تحميل مذهبي.
