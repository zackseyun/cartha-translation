  rationale: أزيلت دلالة الشروع غير اللازمة في «أخذوا يتناقشون» مع إبقاء علاقة النتيجة التي تفيدها ὥστε، وأعيدت صياغة الحاشية لتكون طبيعية في العربية مع حفظ إمكان الوقف والتعلّق البديلين في اليونانية. ولا يمس التعديل معنى المقطع أو غموض ارتباط «بسلطان».
