    rationale: يفيد التعبير عادة الشروع في الفعل، بينما ὥστε συζητεῖν تفيد النتيجة، أي أنهم تداولوا الأمر/تناقشوا. حذف إيحاء الشروع يجعل الصياغة أدق.
