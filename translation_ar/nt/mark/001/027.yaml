source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: ar
  text: 'فَدُهِشُوا جَمِيعًا، حَتَّى صَارُوا يَتَنَاقَشُونَ فِيمَا بَيْنَهُمْ قَائِلِينَ: «مَا هَذَا؟ تَعْلِيمٌ جَدِيدٌ بِسُلْطَانٍ![a] إِنَّهُ يَأْمُرُ حَتَّى الْأَرْوَاحَ النَّجِسَةَ، فَتُطِيعُهُ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما هذا؟ أتعليمٌ جديدٌ بسلطان؟» إذ يمكن ترقيم النص اليوناني بحيث ترتبط عبارة «تعليم جديد» بالسؤال ارتباطًا أوضح.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: دُهِشُوا
  rationale: تنقل صيغة المبني للمجهول التي تصف وقوعهم تحت أثر الدهشة، بلغة عربية طبيعية من غير مبالغة زائدة.
- source_word: ἅπαντες
  choice: جميعًا
  rationale: تحفظ توكيد شمول رد الفعل لكل الحاضرين.
- source_word: ὥστε συζητεῖν
  choice: حتى أخذوا يتناقشون
  rationale: تفيد «حتى» النتيجة، وتعبير «أخذوا يتناقشون» يصور نشوء الحديث المتبادل من غير أن يفترض خصومة.
- source_word: πρὸς ἑαυτούς
  choice: فيما بينهم
  rationale: تعبير عربي مألوف يدل على المحادثة المتبادلة داخل الجماعة.
- source_word: Τί ἐστιν τοῦτο;
  choice: ما هذا؟
  rationale: يحفظ السؤال القصير المباشر ونبرة المفاجأة من غير إضافة تفسير.
- source_word: διδαχὴ καινή
  choice: تعليم جديد
  rationale: «تعليم» أوضح وأقل اصطلاحية من «عقيدة» في هذا المشهد، ويحفظ وصفه بالجِدّة.
- source_word: κατ’ ἐξουσίαν
  choice: بسلطان
  rationale: ينقل معنى السلطة والاقتدار الملازمين لتعليم يسوع وأمره، مع إبقاء مدى تعلق العبارة مفتوحًا بحسب تركيب اليونانية.
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: الأرواح النجسة
  rationale: يحفظ الوصف التقليدي والدلالة الدينية والأخلاقية للفظ ἀκάθαρτος.
- source_word: ἐπιτάσσει
  choice: يأمر
  rationale: فعل مباشر يدل على إصدار أمر ذي سلطان.
- source_word: ὑπακούουσιν αὐτῷ
  choice: فتطيعه
  rationale: يعبر بوضوح عن استجابة الأرواح للأمر بالطاعة، ويطابق جمع غير العاقل في العربية الفصيحة.
theological_decisions:
- issue: تعلّق عبارة «بسلطان» وبنية كلام الجموع
  choice: صياغة «تعليم جديد بسلطان!» بوصفها تعجبًا بعد السؤال، مع إبقاء السلطان قريبًا من التعليم ومن الأمر الذي يليه.
  alternative: «ما هذا؟ ما هذا التعليم الجديد الذي بسلطان؟» أو تعليق «بسلطان» أساسًا بالفعل «يأمر».
  rationale: يحتمل التركيب اليوناني أكثر من وجه في الوقف والتعلق. الصياغة المختارة تحفظ دهشة الجموع ومحور السلطان من غير حسم زائد، وتورد الاحتمال الاستفهامي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع ضبط كامل للنص. استُخدم «بسلطان» بدل «بسلطة» للمحافظة على نبرة كتابية طبيعية وعلى معنى الاقتدار الآمر، من غير إدخال تفسير مذهبي.
