base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: ar
  text: وبعد أن سُلِّم يوحنا[a]، جاء يسوع إلى الجليل مُعلنًا بشارةَ الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعد أن اعتُقل يوحنا». واليونانية تقول، على نحوٍ أقرب إلى الحرفية: «بعد أن سُلِّم يوحنا»، وهي صياغة تتردد لاحقًا في مرقس عند الحديث عن آلام يسوع.'
    reason: lexical_alternative
  - marker: b
    text: قد تعني عبارة «بشارة الله» البشارة الآتية من الله، أو الخاصة بالله، أو المتمحورة حوله.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: بعد أن أُسلِم
  rationale: 'يفيد التركيب الزمان: «بعد أن». ويحافظ «أُسلِم» على المعنى الواسع للفعل، أي التسليم إلى سلطة معادية، وعلى صلته اللفظية اللاحقة بلغة آلام يسوع، من غير أن يضيف صراحةً معنى الاعتقال.'
- source_word: Ἰωάννην
  choice: يوحنا
  rationale: الصيغة العربية الكتابية الراسخة للاسم Ἰωάννης.
- source_word: ἦλθεν
  choice: جاء
  rationale: ينقل المعنى الطبيعي للفعل ἔρχομαι من غير تضييقه إلى «وصل» أو تغيير وجهة النظر إلى «ذهب».
- source_word: εἰς τὴν Γαλιλαίαν
  choice: إلى الجليل
  rationale: تحافظ «إلى» على دلالة الحركة والاتجاه في εἰς، وهي الصياغة العربية الطبيعية هنا.
- source_word: κηρύσσων
  choice: وهو ينادي
  rationale: ينقل معنى الإعلان العلني بصوت المنادي، ويتجنب حصر الفعل في الوعظ الكنسي.
- source_word: εὐαγγέλιον
  choice: بشارة
  rationale: لفظ عربي واضح وموجز يدل على الخبر السار، مع احتفاظه بوزنه الكتابي واللاهوتي.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: 'الإضافة في «بشارة الله» تبقي علاقة المضاف إليه واسعة كما في اليونانية: قد تكون البشارة الآتية من الله، أو الخاصة به، أو المتمحورة حوله.'
theological_decisions:
- issue: دلالة παραδοθῆναι وصلتها بمفردات آلام يسوع في مرقس
  choice: أُسلِم
  alternative: اعتُقل
  rationale: «أُسلِم» يحفظ الصدى السردي واللاهوتي لاستعمال الفعل نفسه في تسليم يسوع، بينما «اعتُقل» يصرح بتفصيل مفهوم من السياق لكنه أضيق من اللفظ اليوناني.
- issue: دلالة الإضافة في τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: بشارة الله
  alternative: البشارة الآتية من الله؛ البشارة عن الله
  rationale: الإضافة اليونانية تحتمل علاقات متقاربة متعددة؛ لذلك تبقي الصياغة العربية الإضافية هذا الاتساع بدل حسمه.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت جملة «وهو ينادي» لتكون طبيعية للقارئ العام وتحافظ على معنى الإعلان العلني. وُضعت علامتا الحاشيتين في المتن عند موضعيهما.
