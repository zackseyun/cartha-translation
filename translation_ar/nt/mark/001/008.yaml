  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: ar
  text: أَنَا عَمَّدْتُكُمْ بِالْمَاءِ، أَمَّا هُوَ فَسَيُعَمِّدُكُمْ بِالرُّوحِ الْقُدُسِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فِي الرُّوحِ الْقُدُسِ». يحتمل حرف الجر اليوناني المعنيين.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: أَنَا
  rationale: أُبقي الضمير الصريح لإظهار التوكيد والمقابلة مع αὐτός في الجملة التالية.
- source_word: ἐβάπτισα
  choice: عَمَّدْتُ
  rationale: يحفظ المصطلح الطقسي المألوف والصلة اللفظية بالفعل نفسه في الجملة التالية، من غير حصر المعنى في كيفية التعميد.
- source_word: ὑμᾶς
  choice: كُمْ
  rationale: صيغة ضمير المخاطبين الجمع تنقل العدد الذي يصرّح به اليوناني.
- source_word: ὕδατι
  choice: بِالْمَاءِ
  rationale: الباء عربية طبيعية للدلالة على الوسيلة، مع إمكان فهم المجال أيضًا بحسب السياق.
- source_word: αὐτὸς
  choice: هُوَ
  rationale: أُظهر الضمير منفصلًا للمحافظة على المقابلة المؤكدة بين يوحنا والآتي بعده.
- source_word: δὲ
  choice: أَمَّا
  rationale: تركيب «أمّا هو» يعبّر طبيعيًا عن الانتقال التقابلي المؤكد، وتأتي الفاء في جواب «أمّا».
- source_word: βαπτίσει
  choice: فَسَيُعَمِّدُ
  rationale: يحفظ زمن المستقبل والتكرار المعجمي المقصود مع «عَمَّدْتُ».
- source_word: ἐν
  choice: بِـ
  rationale: الباء أنسب في العربية الحديثة لبيان الوسيلة في هذا السياق، مع إثبات احتمال معنى «في» في الحاشية.
- source_word: πνεύματι ἁγίῳ
  choice: الرُّوحِ الْقُدُسِ
  rationale: الصياغة العربية المألوفة التي تفهم العبارة هنا على أنها إشارة إلى روح الله القدوس.
theological_decisions:
- issue: هل تشير πνεύματι ἁγίῳ إلى الروح القدس الإلهي أم إلى قوة مقدسة غير شخصية؟
  choice: الرُّوحِ الْقُدُسِ
  alternative: روحٍ مقدسةٍ
  rationale: في سياق مرقس، تقابل العبارة تعميد يوحنا بالماء بتعميد الآتي الأقوى، والأرجح أنها تشير إلى الروح القدس، من غير إضافة تفصيل لاهوتي لا تصرّح به الآية.
- issue: دلالة ἐν في عبارة ἐν πνεύματι ἁγίῳ
  choice: بِالرُّوحِ الْقُدُسِ
  alternative: فِي الرُّوحِ الْقُدُسِ
  rationale: الباء طبيعية في العربية وتنسجم مع «بالماء»، لكن «في» احتمال حقيقي يحفظ معنى المجال أو النطاق، ولذلك أُثبت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم تركيب «أمّا هو فـ» لإبراز المقابلة الموجودة في الضميرين اليونانيين، مع الحفاظ على التوازي بين «عمّدتكم» و«سيعمّدكم».
