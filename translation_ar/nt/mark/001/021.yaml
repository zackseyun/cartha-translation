  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: ar
  text: ودخلوا كفرناحوم[a]، وفورًا، في يوم السبت[b]، كان يعلِّم[c] في المجمع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويدخلون كفرناحوم»؛ فكثيرًا ما يستخدم مرقس المضارع التاريخي لإضفاء الحيوية على السرد.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «في السبوت»، وهو تعبير اصطلاحي يعني هنا «في يوم السبت».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «علَّم» أو «أخذ يعلِّم»؛ فقد تدل صيغة الماضي الناقص اليونانية على استمرار الفعل أو، في بعض السياقات، على الشروع فيه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: دخلوا
  rationale: المضارع هنا مضارع تاريخي شائع في سرد مرقس؛ وصيغة الماضي طبيعية في العربية، وتحفظ معنى الدخول إلى المكان.
- source_word: Καφαρναούμ
  choice: كفرناحوم
  rationale: الصيغة العربية الكتابية المستقرة لاسم الموضع.
- source_word: εὐθύς
  choice: للوقت
  rationale: تعبير عربي فصيح واضح يحفظ معنى المبادرة والسرعة المتكرر في سرد مرقس.
- source_word: τοῖς σάββασιν
  choice: في السبت
  rationale: مع أن اللفظ اليوناني جمع من حيث الصيغة، فهو تعبير زمني اصطلاحي يُفهم هنا على أنه يوم السبت.
- source_word: ἐδίδασκεν
  choice: أخذ يعلِّم
  rationale: ينقل صيغة الماضي الناقص اليونانية مع إبقاء احتمال الدلالة على ابتداء الفعل واستمراره، من غير اختزالها إلى ماض بسيط.
- source_word: συναγωγήν
  choice: المجمع
  rationale: يشير في هذا السياق اليهودي إلى المجمع المحلي، وهو المقابل العربي المألوف والدقيق.
