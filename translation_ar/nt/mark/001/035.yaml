  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: ar
  text: وفي الصباح الباكر جدًا، بينما كان الظلام لا يزال مخيّمًا، نهض وخرج ومضى إلى موضع مقفر[a]، وكان يصلّي هناك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «موضع خالٍ»، أو «موضع منعزل». يمكن للكلمة اليونانية أن تصف مكانًا غير مأهول أو مقفرًا أو شبيهًا بالبرية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: في الصباح الباكر جدًا، فيما كان الظلام لا يزال باقيًا
  rationale: 'يجمع التعبير العربي عناصر الزمن الثلاثة: الصباح الباكر، وشدة التبكير، واستمرار الظلام، بصياغة واضحة وطبيعية.'
- source_word: ἀναστὰς
  choice: نهض
  rationale: ينقل اسم الفاعل الدال على فعل سابق للأفعال الرئيسة بإيجاز، ويحافظ على تسلسل الأحداث.
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: يحافظ على الحركة إلى خارج الموضع الذي كان فيه، من غير دمجها بالفعل التالي.
- source_word: ἀπῆλθεν
  choice: مضى
  rationale: يميّزه عن «خرج» وينقل معنى الابتعاد والتوجّه إلى مكان آخر.
- source_word: εἰς ἔρημον τόπον
  choice: إلى موضع مقفر
  rationale: «مقفر» يعبّر عن مكان خالٍ أو غير مأهول، من غير أن يفرض أنه برية جغرافية محددة أو أن يجعل قصد العزلة هو المعنى الوحيد.
- source_word: κἀκεῖ
  choice: هناك
  rationale: ينقل الإحالة المكانية الطبيعية في العربية، مع بقاء ترابط السرد ظاهرًا في ترتيب الجملة.
- source_word: προσηύχετο
  choice: كان يصلّي
  rationale: صيغة «كان يفعل» تنقل الجانب الاستمراري للفعل اليوناني الناقص بصورة طبيعية.
theological_decisions:
- issue: الدلالة السردية لصلاة يسوع
  choice: عرض انسحاب يسوع وصلاته كما يرويه النص من دون إضافة تفسير عقائدي
  alternative: إبراز العزلة مثالًا للتلمذة، أو تضمين استنتاجات مسيانية عن اتكاله في الصلاة
  rationale: النص يذكر الحدث مباشرة، ولا يصرّح بهذه الاستنتاجات؛ لذلك تُترك دلالاته اللاهوتية للقارئ والسياق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. حُفظ تتابع «نهض وخرج ومضى» لتجسيد الحركة المتدرجة في اليونانية، واستُعمل «كان يصلّي» لإظهار استمرار الفعل.
