  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: ar
  text: 'صَوْتُ مُنَادٍ فِي الْبَرِّيَّةِ[a]: «أَعِدُّوا طَرِيقَ الرَّبِّ[b]، وَاجْعَلُوا سُبُلَهُ مُسْتَقِيمَةً».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، وفق ترقيم آخر لعبارة إشعياء: «صوتُ منادٍ: في البرية أعدّوا طريق الرب…»'
    reason: alternative_reading
  - marker: b
    text: لفظ «الرب» ترجمة للكلمة اليونانية «كيريو»؛ والاقتباس يردّد صدى إشعياء 40:3، حيث يتضمن النص العبري الاسم الإلهي «يهوه».
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ
  choice: صَوْتُ
  rationale: تعني «صوت»، وهي هنا في تركيب إضافي مع اسم الفاعل، فلا تحتاج العربية إلى أداة تنكير.
- source_word: βοῶντος
  choice: مُنَادٍ
  rationale: ينقل معنى النداء الجهوري المعلن، ويلائم التركيب العربي الطبيعي «صوت منادٍ».
- source_word: ἐν τῇ ἐρήμῳ
  choice: فِي الْبَرِّيَّةِ
  rationale: «البرية» تشمل الأرض المقفرة غير المأهولة، وتنسجم مع سياق مرقس وصدى إشعياء أكثر من حصرها في الصحراء الرملية.
- source_word: Ἑτοιμάσατε
  choice: أَعِدُّوا
  rationale: أمر جمع مباشر يفيد التهيئة الحاسمة، وهو فصيح وواضح في العربية المعاصرة.
- source_word: τὴν ὁδὸν
  choice: طَرِيقَ
  rationale: يحفظ الصورة الحسية للطريق ودلالتها النبوية المجازية معًا.
- source_word: κυρίου
  choice: الرَّبِّ
  rationale: المقابل العربي الطبيعي للقب اليوناني κύριος، مع إبقاء خلفيته في نص إشعياء في الحاشية.
- source_word: εὐθείας
  choice: مُسْتَقِيمَةً
  rationale: يصف السبل بأنها غير معوجة، وهو المعنى المكاني المقصود هنا.
- source_word: ποιεῖτε
  choice: اجْعَلُوا
  rationale: ينقل بصورة طبيعية تركيب «اجعلوا السبل مستقيمة»، ويحافظ على صيغة الأمر للجمع.
- source_word: τὰς τρίβους αὐτοῦ
  choice: سُبُلَهُ
  rationale: «سبل» تنقل جمع τρίβος وتحفظ الضمير العائد إلى الرب، بصياغة عربية موجزة ومألوفة.
theological_decisions:
- issue: ترجمة κύριος في اقتباس من إشعياء يشير نصه العبري إلى يهوه
  choice: الرَّبِّ
  alternative: يهوه / الرَّبّ بحروف تمييزية
  rationale: النص اليوناني يستعمل κύριος، لذلك تُحفظ ترجمته «الرب» في المتن، بينما توضّح الحاشية أن الأصل العبري في إشعياء يشير إلى اسم الله يهوه، من غير أن يُستبدل اللفظ اليوناني في المتن.
- issue: موضع تعلّق عبارة «في البرية»
  choice: متعلّقة بـ«منادٍ»
  alternative: '«صوت منادٍ: في البرية أعدّوا طريق الرب...»'
  rationale: ترتيب العبارة في مرقس وسياق ذكر يوحنا في البرية يرجّحان تعلقها بالمنادي، لكن احتمال وصلها بأمر إعداد الطريق قائم في ترقيم اقتباس إشعياء، ولذلك حُفظ في حاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة، مع صياغة نبوية موجزة. استُعملت «البرية» بدل «الصحراء» لاتساع دلالتها، وحُفظ الغموض الحقيقي في موضع العبارة بواسطة الحاشية.
