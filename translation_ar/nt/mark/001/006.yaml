  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: ar
  text: وكان يوحنا مرتديًا لباسًا من وبر الإبل، وحزامًا جلديًا حول خصره[a]، وكان يأكل الجراد والعسل البري.
