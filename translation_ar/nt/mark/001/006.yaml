  source_fidelity: 'المتن ينقل عناصر اليونانية الأساسية بدقة: لباس من شعر/وبر الإبل، وحزام جلدي عند الخصر، والجراد والعسل البري. لكن «كان يلبس» قد توحي بالفعل الاعتيادي أكثر من الحالة الوصفية التي يفيدها اسم المفعول التام ἐνδεδυμένος؛ و«مرتديًا» أوضح في هذا السياق. كما أن «حول خصره» أصرح في نقل περὶ.'
