    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος
  choice: يلبس
  rationale: اسم الفاعل التام يصف حالة يوحنا من جهة لباسه؛ وصيغة «كان يلبس» طبيعية في العربية وتحافظ على الوصف المستمر من غير تكلّف المبني للمجهول.
- source_word: τρίχας καμήλου
  choice: ثوبًا من وبر الإبل
  rationale: المقصود مادة اللباس المصنوعة من شعر الإبل، لا جلد الإبل. أُضيفت «ثوبًا» لإكمال المعنى الطبيعي الذي تدل عليه صيغة «يلبس» في العربية، واختير «وبر» لأنه التعبير العربي المألوف لشعر الإبل.
- source_word: ζώνην δερματίνην
  choice: حزام من جلد
  rationale: ينقل معنى الحزام ومادته بعبارة عربية واضحة وطبيعية.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: على خصره
  rationale: تعبير عربي معاصر واضح يفيد إحاطة الحزام بمنطقة الخصر، وهو أنسب من «حول حقويه» القديمة.
- source_word: ἔσθων
  choice: كان يأكل
  rationale: اسم الفاعل المضارع يرسم عادة أو فعلًا مستمرًا ضمن وصف يوحنا، وتنقل «كان يأكل» هذه الدلالة.
- source_word: ἀκρίδας
  choice: الجراد
  rationale: هو المعنى المعجمي المباشر للكلمة، ولا يقتضي السياق معنى مجازيًا أو نباتيًا بديلًا.
- source_word: μέλι ἄγριον
  choice: العسل البري
  rationale: ترجمة مباشرة وطبيعية للتركيب الذي يصف عسلًا موجودًا في البرية.
- source_word: καὶ ἦν
  choice: وكان
  rationale: تحافظ الواو على اتصال الكلام بما قبله، وتنقل «كان» الفعل الوصفي من غير إدخال ظرف زمني غير موجود في اليونانية.
theological_decisions:
- issue: صلة لباس يوحنا بصورة إيليا النبوية
  choice: إبقاء متن الآية وصفيًا، مع بيان الصلة المحتملة بإيليا في الحاشية.
  alternative: التصريح في المتن بأن يوحنا كان يشبه إيليا أو أنه خليفته النبوي.
  rationale: صياغة مرقس تستحضر وصف إيليا في 2 ملوك 1:8، لكنها لا تصرّح في هذه الآية بهوية يوحنا أو بدوره؛ لذلك لا ينبغي تحويل الإيحاء النصي إلى تقرير تفسيري داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «وبر الإبل» بدل «شعر الجمل» لأنه التعبير العربي الطبيعي عن مادة النسيج، و«خصره» بدل «حقويه» لسهولة الفهم. يظهر مؤشر الحاشية [a] في المتن.
