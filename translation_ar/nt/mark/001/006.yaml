  terminology: «وبر الإبل» و«الجراد» و«العسل البري» اختيارات دقيقة. في الحاشية، «رسولًا نبويًا» غير مناسب؛ إذ قد يُفهم «رسول» بمعنى اصطلاحي، بينما المقصود في الأثر الإنجليزي هو الممهِّد/السابق ذي الطابع النبوي. لذلك استُبدل بتعبير لا يحمّل الآية دعوى إضافية.
