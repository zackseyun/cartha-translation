  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: ar
  text: 'وجاء صوت من السماوات[a]: «أنت ابني الحبيب؛ بك سُررتُ[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «من السماء». في اليونانية جاءت «السماوات» بصيغة الجمع.
    reason: lexical_alternative
  - marker: b
    text: أو «فيك وجدتُ سروري»، أو «بك أنا مسرور».
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: وجاء صوت
  rationale: ترجمة عربية طبيعية للبناء الذي يفيد وقوع الحدث وظهور الصوت، من غير الحرفية غير المألوفة «حدث صوت».
- source_word: ἐκ τῶν οὐρανῶν
  choice: من السماوات
  rationale: تحافظ على صيغة الجمع في اليونانية، وهي واضحة وطبيعية في العربية، مع ذكر المفرد المألوف في الحاشية.
- source_word: Σὺ εἶ
  choice: أنت
  rationale: يُظهر الضمير المنفصل صراحة الخطاب وتوكيده كما في الأصل، وتدل الجملة الاسمية العربية طبيعيًا على معنى «أنت هو/أنت تكون».
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: ابني الحبيب
  rationale: صياغة عربية موجزة وطبيعية تحفظ البنوة والمحبة، وتمتص أداة التعريف اليونانية الثانية في تركيب النعت العربي من غير زيادة تفسيرية.
- source_word: ἐν σοὶ
  choice: بك
  rationale: الباء هي التعبير العربي الطبيعي مع «سُررت»، وتقابل هنا المجال الدلالي لحرف الجر ἐν من غير تركيب عربي متكلف.
- source_word: εὐδόκησα
  choice: سُررتُ
  rationale: يحفظ الفعل معنى السرور والرضا، كما تحافظ صيغة الماضي على الهيئة الصرفية للماضي اليوناني، مع بقاء الإعلان ذا قوة حاضرة في سياقه.
theological_decisions:
- issue: صياغة إعلان الله ليسوع مع الحفاظ على دلالته المسيحانية من غير إضافة مصطلحات عقائدية لاحقة
  choice: أنت ابني الحبيب
  alternative: أنت ابني، المحبوب
  rationale: يحفظ النص هوية الابن ومحبة الله له كما يصرح الأصل، ولا يضيف شرحًا لاهوتيًا غير وارد في الآية.
- issue: الجمع في οὐρανῶν
  choice: من السماوات
  alternative: من السماء
  rationale: اختير الجمع اتباعًا مباشرًا للنص اليوناني، مع إثبات الصيغة العربية التقليدية بالمفرد في الحاشية.
- issue: قوة الماضي في εὐδόκησα وعلاقته بالرضا الحاضر
  choice: بك سُررتُ
  alternative: بك أنا مسرور / فيك وجدت سروري
  rationale: يحافظ الماضي على صيغة الفعل اليوناني ولا يحسم ما إذا كان التركيز على سرور سابق أو رضا قائم؛ وتوضح الحاشية البدائل الدلالية الطبيعية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُخدم «وجاء صوت» للسرد الطبيعي، وحُفظ جمع «السماوات». أما «بك سُررتُ» فصياغة موجزة مألوفة تحفظ معنى السرور وصيغة الماضي في الأصل، مع بيان البدائل في الحاشية.
