  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: ar
  text: فتقدَّم إليها، وأقامها آخذًا بيدها؛ فتركتها الحُمّى، فكانت تخدمهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الفعل اليوناني بصيغة الماضي الناقص، وقد يفيد أنها كانت تخدمهم؛ ويجيز السياق أيضًا أن تكون قد شرعت في خدمتهم عقب شفائها مباشرة.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: فتقدَّم إليها
  rationale: اسم فاعل ظرفي ماضٍ يدل على اقتراب يسوع منها قبل الفعل الرئيس، وإضافة «إليها» مفهومة من السياق ولا تتجاوز دلالة الحركة نحوها.
- source_word: ἤγειρεν αὐτὴν
  choice: وأقامها
  rationale: يحفظ قوة ἐγείρω بوصفه فعل إقامة من موضع الاضطجاع، من غير اختزاله إلى مجرد المساعدة ولا تحميله هنا تصريحًا بالقيامة.
- source_word: κρατήσας τῆς χειρός
  choice: آخذًا بيدها
  rationale: صياغة عربية طبيعية تعكس معنى الإمساك باليد والهيئة المصاحبة لإقامتها.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: فتركتها الحُمّى
  rationale: يحافظ على الإسناد اليوناني الذي يجعل الحمى فاعلًا لفعل الترك، وعلى التصوير الحي للمرض وهو يفارقها.
- source_word: διηκόνει
  choice: صارت تخدمهم
  rationale: ينقل الماضي الناقص مع احتمال الدلالة الابتدائية التي يرجحها تعاقب الحدث في السياق، مع تجنب لفظ كنسي لا يلائم بالضرورة خدمة الضيافة المنزلية.
- source_word: αὐτοῖς
  choice: هم
  rationale: ضمير جمع يشير إلى الحاضرين، لا إلى يسوع وحده.
theological_decisions:
- issue: احتمال صدى لغة القيامة في ἐγείρω
  choice: أقامها
  alternative: أنهضها / ساعدها على النهوض
  rationale: «أقامها» يظل طبيعيًا في سياق النهوض من الفراش ويحفظ اختيار مرقس اللفظي، من غير الجزم بأن النص يتحدث عن قيامة.
- issue: دلالة الماضي الناقص διηκόνει
  choice: صارت تخدمهم
  alternative: كانت تخدمهم / خدمتهم
  rationale: السياق يسمح بفهم ابتدائي مباشر بعد الشفاء، لكن الصيغة نفسها قد تصف خدمة مستمرة؛ لذلك تُذكر الإمكانية الأخرى في الحاشية بدل إخفاء الغموض.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. روعي تسلسل الأفعال في الأصل، واستُعملت «تخدمهم» بالمعنى المنزلي الطبيعي دون إيحاء اصطلاحي كنسي.
