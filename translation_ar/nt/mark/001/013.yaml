  text: καὶ ⸀ἦν ἐν τῇ ἐρήμῳ ⸂τεσσεράκοντα ἡμέρας⸃ πειραζόμενος ὑπὸ τοῦ Σατανᾶ, καὶ ἦν μετὰ τῶν θηρίων, καὶ οἱ ἄγγελοι διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: ar
  text: وكان في البرية أربعين يومًا، وكان الشيطان يجرِّبه[a]، وكان مع الحيوانات البرية، وكانت الملائكة تخدمه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يختبره». يمكن للفعل اليوناني أن يعني «يجرِّب» أو «يختبر»، غير أن «يجرِّبه» أنسب هنا لأن الشيطان هو الذي يقوم بالفعل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: البرية
  rationale: تعبير عربي كتابي واضح يدل على الموضع المقفر، ويحفظ الصدى الجغرافي والكتابي من غير حصره في صحراء رملية.
- source_word: τεσσεράκοντα ἡμέρας
  choice: أربعين يومًا
  rationale: نقل مباشر لعبارة مدة الزمن، مع إبقاء دلالاتها الكتابية الضمنية بلا شرح داخل المتن.
- source_word: πειραζόμενος
  choice: يجرِّبه
  rationale: يمكن للفعل اليوناني أن يدل على التجربة أو الاختبار. ولأن الشيطان هو الفاعل المذكور صراحة، فمعنى الإغراء بالتجربة هو الأرجح، مع إثبات البديل في الحاشية.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: الشيطان
  rationale: الاسم/اللقب مستقر في العربية بهذه الصيغة، وتحويل المبني للمجهول اليوناني إلى جملة فعلية فاعلها الشيطان يجعل العبارة طبيعية وواضحة من غير تغيير المعنى.
- source_word: μετὰ τῶν θηρίων
  choice: مع الحيوانات البرية
  rationale: تعبير واضح ومعاصر ينقل معنى الحيوانات غير المستأنسة، ويتجنب ما قد تحمله كلمة «الوحوش» من إيحاء زائد بالافتراس وحده.
- source_word: ἄγγελοι
  choice: الملائكة
  rationale: السياق الخارق للطبيعة يدل على الكائنات السماوية، لا على رسل بشريين.
- source_word: διηκόνουν αὐτῷ
  choice: تخدمه
  rationale: ينقل معنى الخدمة بوضوح، ويحفظ الفعل الناقص دلالة الاستمرار عبر صيغة «كانت ... تخدمه».
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: وكان ...، وكان ...، وكانت ...
  rationale: يحفظ أسلوب مرقس العطفي المتتابع مع صياغة عربية طبيعية.
theological_decisions:
- issue: الدلالة المقصودة من πειραζόμενος حين يكون الشيطان هو الفاعل
  choice: يجرِّبه
  alternative: يختبره
  rationale: اللفظ اليوناني يحتمل التجربة والاختبار، لكن نسبة الفعل إلى الشيطان ترجّح التجربة ذات القصد العدائي. وتُحفظ إمكانية معنى الاختبار في الحاشية بدل طمس التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تتابع العطف المميز لأسلوب مرقس، واستُخدمت «الحيوانات البرية» للوضوح المعاصر، مع إبقاء الغموض الدلالي الحقيقي في πειραζόμενος بواسطة الحاشية.
