  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: ar
  text: 'وكان ينادي قائلًا[a]: «يأتي بعدي من هو أقوى مني[b]، ولست أهلًا[c] لأن أنحني وأفكَّ رباط نعليه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكان يعلن»؛ وتقليديًا: «وكان يكرز».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من هو أشد اقتدارًا مني». والكلمة لا تحدد هنا نوع القوة.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لست كفؤًا» أو «لا أستحق»؛ فالعبارة تعبّر عن عدم الأهلية أمام الآتي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: كان ينادي
  rationale: ينقل صيغة الماضي الناقص الدالة على الاستمرار أو التكرار، ويحفظ معنى الإعلان العلني الذي تؤديه الكلمة، بلغة عربية واضحة غير محصورة في الاستعمال الكنسي.
- source_word: λέγων
  choice: قائلًا
  rationale: مقابل عربي طبيعي لاسم الفاعل الذي يمهّد للكلام المباشر.
- source_word: Ἔρχεται
  choice: يأتي
  rationale: يحفظ المضارع الحيّ وإحساس اقتراب الآتي.
- source_word: ὁ ἰσχυρότερός μου
  choice: من هو أقوى مني
  rationale: صياغة عربية طبيعية للمقارنة مع إبقاء المعنى الأساسي للقوة من غير إضافة تحديد لطبيعتها.
- source_word: ὀπίσω μου
  choice: بعدي
  rationale: يناسب السياق الزمني والتتابعي، مع بقاء احتمال الصورة المكانية في الأصل.
- source_word: ἱκανὸς
  choice: أهلًا
  rationale: يفيد الجدارة والاستحقاق في سياق تواضع يوحنا، مع إمكان أن تدل الكلمة أيضًا على الكفاية أو الأهلية.
- source_word: κύψας
  choice: أن أنحني
  rationale: يعبّر بوضوح عن خفض الجسد الملازم لفك الرباط؛ وعُطف على الفعل التالي لصياغة عربية سلسة.
- source_word: λῦσαι
  choice: أفكَّ
  rationale: هو التعبير العربي الطبيعي عن حل رباط النعل.
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: رباط نعليه
  rationale: ينقل رباط الحذاء القديم بدقة وإيجاز، ويعبّر المثنى عن زوج النعلين تعبيرًا عربيًا طبيعيًا.
theological_decisions:
- issue: مدى التواضع في قول يوحنا
  choice: لست أهلًا
  alternative: لست كفؤًا / لا أستحق
  rationale: «أهلًا» تجمع معنى الجدارة والكفاية بحسب السياق، فتحفظ إعلان يوحنا عن ضآلة مقامه أمام الآتي من غير تحويل العبارة إلى مجرد عجز جسدي أو تحميلها عقيدة غير مصرّح بها.
- issue: طبيعة قوة الآتي
  choice: أقوى مني
  alternative: أشد مني / أقدر مني
  rationale: أُبقيت القوة عامة كما في اليونانية، من غير حصرها في القوة الجسدية أو السلطة الروحية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدم «ينادي» لتجنب حصر κηρύσσω في مصطلح كنسي، و«نعليه» لصياغة موجزة ملائمة للبيئة القديمة. حُفظت عمومية «أقوى» والتوتر الدلالي في ἱκανός بواسطة الحاشية.
