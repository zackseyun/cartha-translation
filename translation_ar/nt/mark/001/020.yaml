  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: ar
  text: وفي الحال دعاهما، فتركا أباهما زبدي في القارب مع الأُجراء، ومضيا وراءه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خلفه» أو «تبعاه». يمكن للعبارة اليونانية أن تدل على الحركة المكانية وعلى بدء التلمذة معًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: في الحال
  rationale: ينقل الدلالة الزمنية العاجلة ويحافظ على إيقاع مرقس السريع بصياغة عربية طبيعية.
- source_word: ἐκάλεσεν αὐτούς
  choice: دعاهما
  rationale: الفعل «دعا» هو المقابل المباشر هنا، وصيغة المثنى توضّح أن المدعوين هما ابنا زبدي المذكوران في السياق من غير زيادة تفسيرية.
- source_word: ἀφέντες
  choice: فتركا
  rationale: ينقل الفعل السابق للفعل الرئيس وعلاقته به بسلاسة، من غير إيحاء «التخلي» القاسي الذي لا يوجبه النص.
- source_word: τὸν πατέρα αὐτῶν Ζεβεδαῖον
  choice: أباهما زبدي
  rationale: صياغة عربية موجزة وطبيعية تحفظ علاقة الأبوة والاسم العلم.
- source_word: ἐν τῷ πλοίῳ
  choice: في القارب
  rationale: «القارب» أنسب من «السفينة» لسياق الصيد في الجليل.
- source_word: μετὰ τῶν μισθωτῶν
  choice: مع الأُجراء
  rationale: «الأُجراء» تدل بوضوح على العاملين بأجر، من غير إدخال مفهوم وظيفي مؤسسي حديث.
- source_word: ἀπῆλθον ὀπίσω αὐτοῦ
  choice: مضيا وراءه
  rationale: «مضيا» تنقل حركة الانصراف، و«وراءه» تحفظ إمكان الدلالة المكانية وإيحاء بدء التلمذة معًا.
theological_decisions:
- issue: دلالة التلمذة في ὀπίσω αὐτοῦ
  choice: وراءه
  alternative: تبعاه
  rationale: «وراءه» تبقي المعنى المكاني المباشر وإيحاء اتباع يسوع مفتوحين، أما «تبعاه» فتحسم دلالة التلمذة بصورة أوضح مما تقتضيه العبارة وحدها.
