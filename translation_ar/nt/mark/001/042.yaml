- source_word: ἡ λέπρα
  choice: البرص
  rationale: هو المقابل الكتابي العربي المألوف، مع العلم أن اللفظ اليوناني قد يشمل أمراضًا جلدية أوسع من داء هانسن بالمفهوم الطبي الحديث.
- source_word: ἐκαθαρίσθη
  choice: فطَهُر
  rationale: يحفظ صيغة المبني للمجهول ودلالة التطهير المرتبطة بالطهارة الشعائرية، ولا يختزل الحدث في الشفاء الجسدي وحده.
theological_decisions:
- issue: العلاقة بين الشفاء الجسدي والطهارة الشعائرية في ἐκαθαρίσθη
  choice: فطَهُر
  alternative: فشُفي؛ فصار طاهرًا
  rationale: «فطَهُر» يحافظ على التوتر الدلالي بين زوال المرض واستعادة الطهارة، من غير إضافة تفسير عقائدي إلى النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «في الحال» للفورية، و«فارقه البرص» لصياغة عربية طبيعية، و«فطَهُر» لحفظ الإيجاز والدلالة الجسدية والشعائرية معًا.
