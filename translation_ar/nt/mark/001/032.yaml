base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: ar
  text: وَلَمَّا جَاءَ الْمَسَاءُ، حِينَ غَرَبَتِ الشَّمْسُ، كَانُوا يُحْضِرُونَ إِلَيْهِ جَمِيعَ الْمَرْضَى وَالْمَمْسُوسِينَ بِالشَّيَاطِينِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الَّذِينَ تَسَلَّطَتْ عَلَيْهِمُ الشَّيَاطِينُ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: وَلَمَّا جَاءَ الْمَسَاءُ
  rationale: ينقل التركيب المطلق الدال على الانتقال الزمني بصياغة عربية طبيعية، مع إبقاء δέ ضمن تدفق السرد من غير إثقاله بحرف عطف مستقل.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: حِينَ غَرَبَتِ الشَّمْسُ
  rationale: يحافظ على الدلالة الزمنية المباشرة لـὅτε وعلى فعل الغروب في ἔδυ، من غير تحويل «حين» تفسيرياً إلى «بعد».
- source_word: ἔφερον
  choice: أَخَذَ النَّاسُ يَأْتُونَ ... بِـ
  rationale: ينقل الاستمرار الذي يصوره الماضي الناقص، ويجعل الفاعل غير المعيّن مفهوماً في العربية بكلمة «الناس»، بينما تؤدي صيغة «يأتون به» معنى الإحضار إلى يسوع بصورة طبيعية.
- source_word: πρὸς αὐτὸν
  choice: إِلَيْهِ
  rationale: يحفظ حركة التوجه نحو الشخص، ولا يكرر اسم يسوع لأنه غير مكرر في اليونانية.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: بِجَمِيعِ الْمَرْضَى
  rationale: العبارة اليونانية اصطلاح يفيد من كانت حالتهم الجسدية سيئة؛ و«جميع المرضى» واضحة وموجزة وتحفظ شمول πάντας.
- source_word: τοὺς δαιμονιζομένους
  choice: الَّذِينَ تَسَلَّطَتْ عَلَيْهِمُ الشَّيَاطِينُ
  rationale: يحفظ الإشارة الصريحة إلى فعل الشياطين وسلطانها، ويتجنب في الوقت نفسه لفظاً عربياً قد يوحي بتحديد كيفية هذا الفعل بأكثر مما يقوله النص.
theological_decisions:
- issue: صياغة δαιμονιζομένους من غير إنكار الفعل الشيطاني أو المبالغة في تحديد طبيعته
  choice: الَّذِينَ تَسَلَّطَتْ عَلَيْهِمُ الشَّيَاطِينُ
  alternative: الْمَمْسُوسِينَ بِالشَّيَاطِينِ
  rationale: الصياغة المختارة تقر بالفعل الشيطاني الحقيقي كما يقدمه النص، لكنها لا تحسم بتعبير تقني مدى هذا التسلط أو كيفيته، فتحفظ سعة اللفظ اليوناني.
- issue: القيمة الحدثية للماضي الناقص ἔφερον
  choice: أَخَذَ النَّاسُ يَأْتُونَ إِلَيْهِ بِـ
  alternative: أَحْضَرُوا إِلَيْهِ
  rationale: تعكس الصياغة المختارة مشهداً متواصلاً من الإحضار، بدلاً من عرضه كفعل واحد مكتمل فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، بصياغة سردية طبيعية. استُخدم «حين غربت الشمس» للمحافظة على التزامن الذي تفيده ὅτε، واستُخدمت صيغة الشروع مع المضارع لإظهار استمرار الإحضار.
