  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: ar
  text: وبينما كان يسير بمحاذاة بحر الجليل، رأى سمعان وأندراوس، أخا سمعان، يلقيان شبكةً في البحر، لأنهما كانا صيادين.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων παρὰ τὴν θάλασσαν
  choice: كان يسير بمحاذاة بحر الجليل
  rationale: اسم الفاعل المضارع يدل على فعل مستمر ومتزامن مع «رأى»، و«بمحاذاة» تنقل معنى الحركة إلى جانب البحر أو على امتداده بوضوح.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: بحر الجليل
  rationale: يحافظ على اللفظ الجغرافي التقليدي الموافق لاستعمال θάλασσα، مع أنه بحيرة من الناحية الجغرافية.
- source_word: εἶδεν
  choice: رأى
  rationale: ترجمة مباشرة للفعل الماضي من ὁράω من غير إضافة دلالة مثل الانتباه أو الملاحظة.
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: سمعان وأندراوس
  rationale: نقل الاسمين وفق الصيغة العربية الكتابية الشائعة.
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: أخا سمعان
  rationale: بدل يعرّف أندراوس بصلته العائلية بسمعان، ويحافظ على تركيب عربي موجز وطبيعي.
- source_word: ἀμφιβάλλοντας
  choice: يلقيان شبكةً
  rationale: الفعل يختص بإلقاء شبكة للصيد؛ لذلك صُرّح بالشبكة، وهي مضمّنة في الدلالة المعجمية.
- source_word: ἐν τῇ θαλάσσῃ
  choice: في البحر
  rationale: يحافظ على الدلالة الأساسية لحرف الجر ἐν، ويأتي طبيعيًا في العربية مع إلقاء شبكة في الماء.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: لأنهما كانا صيادين
  rationale: تنقل «لأن» القوة التفسيرية لـγάρ بوضوح، ويطابق ضمير التثنية الشخصين المذكورين.
