lexical_decisions:
- source_word: εὐθὺς
  choice: في الحال
  rationale: تنقل سرعة الحركة السردية المميزة لمرقس بعبارة عربية واضحة ومألوفة.
- source_word: ἦν
  choice: كان
  rationale: استُعمل الفعل هنا لإفادة وجود الرجل في المكان، وصياغة «كان في مجمعهم رجل» عربية سليمة وقريبة من ترتيب الأصل.
- source_word: συναγωγῇ αὐτῶν
  choice: مجمعهم
  rationale: يشير السياق إلى المجمع اليهودي، مع إبقاء الضمير αὐτῶν في صيغة «هم».
- source_word: ἄνθρωπος
  choice: رجل
  rationale: يدل الاسم هنا في سياقه على فرد ذكر بعينه.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: به روح نجس
  rationale: صياغة عربية طبيعية تُبقي على ارتباط الرجل بالروح النجس من غير إضافة التفسير الأوسع «ممسوس» أو «مستحوذ عليه».
- source_word: ἀκαθάρτῳ
  choice: نجس
  rationale: يحفظ الدلالات الدينية والأخلاقية للفظ اليوناني، وهو التعبير المألوف في هذا السياق.
- source_word: ἀνέκραξεν
  choice: صرخ
  rationale: ينقل معنى إطلاق صوت عالٍ من غير تحديد زائد لطبيعته الانفعالية.
theological_decisions:
- issue: صياغة وصف حالة الرجل في ἐν πνεύματι ἀκαθάρτῳ
  choice: به روح نجس
  alternative: في روح نجس؛ أو ممسوس بروح نجس
  rationale: التركيب اليوناني حرفيًا «في روح نجس»، لكنه اصطلاحي وغير طبيعي بهذه الصورة في العربية. «به روح نجس» يوضح الارتباط من غير أن يضيف مفهوم التملك أو المسّ الذي لا يصرح به اللفظ نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «مجمعهم» للمجمع اليهودي، و«به روح نجس» بوصفها موازنة بين قرب الصياغة من الأصل وسلامتها في العربية. أُبقيت الفاصلة الختامية لأن الآية تتصل نحويًا بالكلام المنقول في الآية التالية.
