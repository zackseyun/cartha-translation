source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: ar
  text: أما الرجل، فلما خرج، أخذ يعلن كثيرًا[a] وينشر الخبر، حتى إن يسوع لم يعد قادرًا على دخول أية بلدة علانية، بل كان يمكث خارجًا في أماكن مقفرة. وكان الناس يأتون إليه من كل مكان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «يعلن أمورًا كثيرة».'
    reason: اللفظة اليونانية πολλὰ قد تُفهم مفعولًا به بمعنى «أمورًا كثيرة»، أو استعمالًا يفيد كثرة الإعلان واتساعه.
lexical_decisions:
- source_word: ὁ δὲ ἐξελθών
  choice: أما الرجل، فلما خرج
  rationale: الفاعل في اليونانية ضمير يُفهم من السياق أنه الرجل الذي شُفي؛ صُرّح به بالعربية منعًا لالتباسه بيسوع لاحقًا.
- source_word: κηρύσσειν πολλὰ
  choice: ينادي بالأمر على نطاق واسع
  rationale: تؤدي العبارة معنى كثرة الإعلان أو اتساعه في السياق، مع إبقاء الوجه الحرفي الممكن في الحاشية.
- source_word: διαφημίζειν τὸν λόγον
  choice: يذيع الخبر
  rationale: «الخبر» هنا طبيعي في العربية لمعنى λόγος بوصفه ما شاع عن الحدث، و«يذيع» ينقل معنى النشر الواسع.
- source_word: φανερῶς
  choice: علانية
  rationale: تنقل معنى الدخول بصورة ظاهرة ومكشوفة أمام الناس.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: في أماكن مقفرة
  rationale: المقصود مواضع خالية أو قليلة السكان، لا الصحراء بالضرورة.
- source_word: πάντοθεν
  choice: من كل مكان
  rationale: صياغة عربية مباشرة وطبيعية لمعنى المجيء من جميع الجهات.
theological_decisions:
- issue: مرجع الضمير في αὐτόν ضمن عبارة عدم القدرة على دخول البلدة
  choice: يسوع
  alternative: إبقاء الضمير «هو»
  rationale: السياق والنحو يدلان على أن انتشار الخبر منع يسوع من الدخول علانية؛ التصريح بالاسم يزيل التباسًا عربيًا من غير إضافة تفسير مذهبي.
- issue: طبيعة الأماكن التي بقي فيها يسوع
  choice: أماكن مقفرة
  alternative: أماكن برية
  rationale: يحفظ هذا الاختيار معنى العزلة والخلو من دون أن يوحي حصرًا بصحراء جغرافية أو بدلالة روحية خاصة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الرجل» لتحديد الفاعل الأول، و«يسوع» لتحديد مرجع الضمير اللاحق، مع تجنب التكرار والغموض غير المقصود.
