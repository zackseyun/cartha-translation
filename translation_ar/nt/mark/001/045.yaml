review_pass:
  verdict: revise
  source_fidelity: 'النص يحدد الفاعل الأول على نحو صحيح بأنه الرجل الذي شُفي في السياق السابق، ويصيب نتيجة انتشار الخبر: لم يعد يسوع يستطيع دخول بلدة علنًا، فكان في مواضع مقفرة ويأتيه الناس من كل الجهات. لكن «ينادي بالأمر» لا يقابل κηρύσσειν πολλὰ بدقة أو بطبيعية؛ فـ«الأمر» غير موجود في اليونانية وقد يوحي بمضمون محدد مفرد. كما أن «خارجها» تقيّد «خارجًا» صراحةً بالبلدة، في حين أن الأصل يعبّر ببساطة عن كونه خارجًا في مواضع مقفرة.'
  naturalness: الصياغة العامة فصيحة ومفهومة، إلا أن «ينادي بالأمر على نطاق واسع» متكلفة وغير مألوفة في العربية الحديثة. «يعلن كثيرًا وينشر الخبر» أوضح وأقرب إلى الاستعمال الطبيعي. و«يمكث خارجًا في أماكن مقفرة» أسلس وأدق من «يبقى خارجها».
  terminology: «يسوع»، «علانية»، «أماكن مقفرة»، و«من كل مكان» اختيارات مناسبة. ويُستحسن «ينشر الخبر» لنقل διαφημίζειν τὸν λόγον؛ فالخبر هنا هو ما كان يُتداول عن الحدث، من دون تحميل لفظ λόγος معنى تقنيًا غير لازم.
  issues:
  - severity: medium
    issue: عبارة «ينادي بالأمر على نطاق واسع»
    rationale: تضيف «الأمر» بوصفه مفعولًا محددًا لا يورده النص، وتبدو غير طبيعية. تحتمل πολλὰ معنى «كثيرًا/على نحو واسع» أو «أمورًا كثيرة»، لذا تُنقل في المتن بالاستعمال السلس مع حاشية تحفظ القراءة الأخرى.
  - severity: low
    issue: عبارة «خارجها»
    rationale: الأصل يقول إنه كان «خارجًا في أماكن مقفرة» ولا يصرح بضمير يعود إلى البلدة. حذف الضمير يحافظ على الصياغة الأصلية من غير إضرار بالمعنى السياقي.
  revised_text: أما الرجل، فلما خرج، أخذ يعلن كثيرًا[a] وينشر الخبر، حتى إن يسوع لم يعد قادرًا على دخول أية بلدة علانية، بل كان يمكث خارجًا في أماكن مقفرة. وكان الناس يأتون إليه من كل مكان.
