revisions:
- from: أما الرجل، فلما خرج، أخذ ينادي بالأمر على نطاق واسع[a] ويذيع الخبر، حتى إن يسوع لم يعد قادرًا على دخول أية بلدة علانية، بل كان يبقى خارجها في أماكن مقفرة. وكان الناس يأتون إليه من كل مكان.
  to: أما الرجل، فلما خرج، أخذ يعلن كثيرًا[a] وينشر الخبر، حتى إن يسوع لم يعد قادرًا على دخول أية بلدة علانية، بل كان يمكث خارجًا في أماكن مقفرة. وكان الناس يأتون إليه من كل مكان.
  rationale: تستبدل المراجعة تعبيرًا غير طبيعي ومضيفًا لمعنى غير منصوص عليه بعبارة عربية واضحة تحافظ على سعة πολλὰ، مع إبقاء الوجه الآخر في الحاشية. كما تعدّل «خارجها» إلى «خارجًا» لمطابقة التعبير اليوناني مع بقاء دلالة المواضع المقفرة.
