source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: ar
  text: 'وكان يقول: «قد اكتمل الزمان، واقترب ملكوت الله.[a] توبوا وآمنوا بالبشارة.[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اقترب حُكم الله».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بالخبر السار».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: قد اكتمل
  rationale: ينقل صيغة التام اليونانية بوصفها حدثًا تمّ وبقيت نتيجته حاضرة، وهو تعبير عربي طبيعي في هذا السياق.
- source_word: ὁ καιρὸς
  choice: الزمان
  rationale: يدل هنا على الوقت الحاسم أو المعيّن، ويحافظ «الزمان» على الإيجاز من غير إضافة تفسيرية إلى المتن.
- source_word: ἤγγικεν
  choice: اقترب
  rationale: ينقل دلالة الاقتراب الذي صارت نتيجته حاضرة، من غير حسم ما إذا كان المقصود وصولًا تامًا أو قربًا وشيكًا.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي راسخ يحفظ اتساع اللفظ اليوناني بين سلطان الله وحيّز ملكه، مع ذكر «حُكم الله» بديلًا في الحاشية.
- source_word: μετανοεῖτε
  choice: توبوا
  rationale: صيغة أمر موجزة وطبيعية تعبّر عن التحول في الفكر والحياة، من غير توسيع تفسيري.
- source_word: πιστεύετε
  choice: آمنوا
  rationale: المقابل العربي المباشر والطبيعي لصيغة الأمر، ويحفظ المجال الدلالي للإيمان والثقة.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: بالبشارة
  rationale: «البشارة» تنقل معنى الخبر السار بلغة عربية واضحة، والباء تلائم الاستعمال العربي مع «آمن» وتحفظ علاقة الإيمان بمضمون البشارة.
- source_word: λέγων
  choice: وكان يقول
  rationale: يربط القول بالسرد السابق في عربية سليمة، وينقل وظيفة اسم الفاعل اليوناني الاستمرارية من غير تركيب متكلف.
theological_decisions:
- issue: دلالة βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  alternative: حُكم الله
  rationale: «ملكوت الله» يحفظ التعبير الواسع الموروث ولا يقصره على الحكم الفعّال وحده أو على مكان بعينه؛ وتوضح الحاشية البديل الديناميكي.
- issue: دلالة εὐαγγέλιον
  choice: البشارة
  alternative: الخبر السار
  rationale: «البشارة» مفهومة وفصيحة وتحافظ على الصلة بالمصطلح الكتابي، بينما يبيّن البديل المعنى المعجمي المباشر.
- issue: قوة الأمرين μετανοεῖτε وπιστεύετε
  choice: توبوا وآمنوا
  alternative: داوموا على التوبة والإيمان
  rationale: قد تحمل صيغتا المضارع الأمرية بعدًا استمراريًا، لكن الأمر البسيط في العربية يحفظ قوة النداء وإلحاحه من غير فرض تفسير زمني زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «ملكوت الله» لصونه بوصفه تعبيرًا كتابيًا واسع الدلالة، و«البشارة» لتكون مفهومة وطبيعية. وُضعت علامتا الحاشية مباشرة بعد العبارتين اللتين تشرحهما.
