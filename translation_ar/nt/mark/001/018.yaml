  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: ar
  text: وفي الحال تركا الشباك وتبعاه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فورًا».'
    reason: بديل معجمي للتعبير εὐθὺς.
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يحافظ على تتابع السرد عند مرقس من غير إضافة دلالة تفسيرية.
- source_word: εὐθὺς
  choice: في الحال
  rationale: تعبير عربي فصيح وواضح ينقل معنى السرعة والفورية الملازم لاستعمال مرقس للكلمة.
- source_word: ἀφέντες
  choice: تركا
  rationale: اسم الفاعل اليوناني يدل هنا على فعل سابق للفعل الرئيس، ومن الطبيعي في العربية صياغته فعلًا معطوفًا. ولا تُستعمل «هجرا» لأنها قد تبالغ في القوة الشعورية.
- source_word: τὰ δίκτυα
  choice: الشباك
  rationale: يحافظ على أداة التعريف الواردة في اليونانية، من غير إضافة ضمير الملكية غير المصرح به.
- source_word: ἠκολούθησαν
  choice: تبعاه
  rationale: ينقل المعنى الحركي المباشر، ويتيح أيضًا أن يظهر من السياق معنى التلمذة من غير توسيع تفسيري.
- source_word: αὐτῷ
  choice: ـه
  rationale: الضمير يعود إلى يسوع في السياق القريب، فحُفظ الضمير بدل إحلال الاسم الصريح محله.
theological_decisions:
- issue: دلالة التلمذة في ἠκολούθησαν
  choice: تبعاه
  alternative: صارا من تلاميذه
  rationale: الصياغة المختارة تحافظ على بساطة النص وعلى التداخل بين الاتباع الحرفي ومعنى التلمذة، دون تحويل الدلالة الضمنية إلى شرح صريح.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل المثنى لأن الفاعلين في السياق السابق اثنان، وجاء الضمير متصلًا بالفعل على نحو طبيعي في العربية.
