  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: ar
  text: 'فانتهره يسوع قائلًا: «اخرس[a]، واخرج منه!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «كُنْ مُكَمَّمًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: انتهره
  rationale: يفيد الفعل توبيخًا حازمًا صادرًا بسلطان، و«انتهره» تعبير عربي طبيعي يحفظ حدة الخطاب من غير إضافة تفسيرية.
- source_word: αὐτῷ
  choice: الهاء في «انتهره»
  rationale: الضمير مذكر مفرد، ويعود بحسب السياق إلى الروح النجس الذي يخاطبه يسوع، لا إلى الرجل الذي سيخرج الروح منه.
- source_word: λέγων
  choice: قائلًا
  rationale: يحفظ الصلة الحالية التي ينشئها اسم الفاعل اليوناني ويقدّم مضمون الانتهار بصياغة عربية فصيحة وطبيعية.
- source_word: Φιμώθητι
  choice: اخرس
  rationale: المعنى الحرفي هو وضع الكمام على الفم، لكنه يُستعمل هنا أمرًا حادًا بالسكوت. و«اخرس» يحفظ قوة الأمر وإيجازه، مع إثبات الصورة الحرفية في الحاشية.
- source_word: ἔξελθε
  choice: اخرج
  rationale: أمر مباشر بالخروج، وهو التعبير العربي الطبيعي في سياق إخراج الروح النجس.
- source_word: ἐξ αὐτοῦ
  choice: منه
  rationale: تفيد العبارة حركة الخروج من داخل الرجل، و«اخرج منه» تؤدي هذا المعنى بوضوح وإيجاز.
theological_decisions:
- issue: مرجع الضمير في انتهار يسوع
  choice: يخاطب يسوع الروح النجس مباشرة، لا الرجل نفسه.
  alternative: أن يكون الرجل هو المخاطَب المباشر بالانتهار.
  rationale: يميّز السياق بين الرجل والروح النجس، ويبيّن الأمر «اخرج منه» أن المخاطَب هو الروح، وأن الهاء في «منه» تعود إلى الرجل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على حدة الأمر وسلطان المتكلم. وُضعت علامة الحاشية بعد «اخرس» لأنها تشرح الصورة الحرفية للفعل اليوناني Φιμώθητι.
