  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: ar
  text: 'وكان يسوع يقول لهم: «ما من نبيٍّ بلا كرامة إلا في بلدته[a]، وبين أقربائه[b]، وفي أهل بيته[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «موطنه» أو «بلده». تشير الكلمة اليونانية إلى المكان الذي ينتمي إليه الشخص؛ وفي سياق الناصرة تلائمها «بلدته».
    reason: lexical_alternative
  - marker: b
    text: أي ذوو قرابته أو عشيرته.
    reason: lexical_alternative
  - marker: c
    text: أو «بيته». قد تدل الكلمة اليونانية على البناء نفسه أو على أهل البيت؛ واختير «أهل بيته» هنا لتمييزهم من الأقرباء.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: صيغة الماضي الناقص في اليونانية تفيد فعلًا جاريًا أو متكررًا في سياق السرد؛ و«كان يقول» تنقل هذا الجانب بصورة طبيعية.
- source_word: προφήτης
  choice: نبيّ
  rationale: المقابل العربي المعياري الواضح للمصطلح اليوناني، ولا يقتضي السياق عدولًا عنه.
- source_word: ἄτιμος
  choice: بلا كرامة
  rationale: يحافظ هذا التعبير على صياغة المثل القائمة على الكرامة ونقيضها، من غير تشديد المعنى إلى «محتقَر» أو «مُهان».
- source_word: εἰ μὴ
  choice: إلا
  rationale: تأتي العبارة هنا للاستثناء ضمن جملة منفية، ولذلك فـ«إلا» هي المقابل العربي الطبيعي.
- source_word: πατρίδι
  choice: بلدته
  rationale: تشير الكلمة في سياق الناصرة إلى المكان الذي ينتمي إليه الشخص وينشأ فيه؛ و«بلدته» واضحة وطبيعية مع إبقاء البدائل الأوسع في الحاشية.
- source_word: συγγενεῦσιν
  choice: أقربائه
  rationale: تدل الكلمة على ذوي القرابة أو جماعة الأقرباء، و«أقربائه» تعبير عربي معاصر يميّزهم من أهل البيت المذكورين بعد ذلك.
- source_word: οἰκίᾳ
  choice: أهل بيته
  rationale: يمكن أن تشير الكلمة إلى البيت المادي أو إلى من يضمهم البيت؛ وفي هذا التدرج من البلدة إلى الأقرباء ثم الدائرة المنزلية، ينقل «أهل بيته» معنى household بوضوح.
- source_word: καὶ ... καὶ ... καὶ
  choice: و... وبين... وفي
  rationale: حُفظ التراكم الذي تصنعه أدوات العطف اليونانية، مع تكييف حروف الجر بحسب التركيب العربي الطبيعي.
theological_decisions:
- issue: مدى قول يسوع عن كرامة النبي
  choice: صيغ الكلام مثلًا عامًا يطبقه السياق على يسوع، من غير إضافة تفسير صريح لهويته المسيانية أو لطبيعة رفضه.
  alternative: التصريح في الترجمة بأن يسوع يعرّف نفسه بأنه المسيح المرفوض، أو تحويل القول إلى تعميم تفسيري عن عدم الإيمان.
  rationale: النص نفسه يورد مثلًا عن النبي الذي لا يلقى الكرامة في الأوساط المألوفة له. والسياق يطبقه على يسوع، لكن لا ينبغي للترجمة أن تضيف تقريرًا عقائديًا غير منطوق به.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم التركيب المثلي «ما من... إلا» لنقل النفي والاستثناء طبيعيًا، مع الحفاظ على مفردة «الكرامة» وعلى التدرج من البلدة إلى الأقرباء ثم أهل البيت.
