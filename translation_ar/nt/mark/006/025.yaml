base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: ar
  text: 'فدخلت في الحال مسرعةً إلى الملك، وطلبت منه قائلةً: «أريد أن تعطيني الآن، على طبق، رأس يوحنا المُعمِّد[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحسب التعبير التقليدي: «يوحنا المعمدان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: فدخلت
  rationale: ينقل اسم الفاعل الماضي بوصفه فعلًا سرديًّا طبيعيًّا، ويُبقي حركة دخولها إلى حضرة الملك.
- source_word: εὐθὺς
  choice: في الحال
  rationale: يحفظ عنصر الفورية المميز للسرد المرقسي، مع تمييزه عن ἐξαυτῆς اللاحقة.
- source_word: μετὰ σπουδῆς
  choice: مسرعةً
  rationale: يعبّر عن العجلة والسرعة من غير أن يضيف معنى الحماسة الإيجابية.
- source_word: βασιλέα
  choice: الملك
  rationale: ترجمة مباشرة للفظ اليوناني، بصرف النظر عن اللقب التاريخي الأدق لهيرودس أنتيباس.
- source_word: ᾐτήσατο
  choice: طلبت منه
  rationale: يفيد تقديم طلب؛ أما حدة الإصرار فتظهر في القول المباشر، فلا حاجة إلى ترجمته بما يعني «طالبت» أو «أمرت».
- source_word: Θέλω
  choice: أريد
  rationale: ينقل الإرادة بصياغة عربية مباشرة وطبيعية تحفظ صراحة الطلب.
- source_word: ἵνα ... δῷς μοι
  choice: أن تعطيني
  rationale: صياغة عربية طبيعية لمضمون الإرادة في جملة ἵνα.
- source_word: ἐξαυτῆς
  choice: الآن
  rationale: يحفظ طلب التنفيذ الفوري مستقلًّا عن εὐθὺς التي تصف دخولها؛ و«الآن» طبيعية وقوية في سياق الأمر.
- source_word: ἐπὶ πίνακι
  choice: على طبق
  rationale: πίναξ هنا طبق تقديم في سياق الوليمة؛ و«طبق» هو المقابل العربي الواضح الجاري.
- source_word: τὴν κεφαλὴν
  choice: رأس
  rationale: يحفظ التحديد الصريح والمروّع في النص من غير تلطيف.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: يوحنا المُعمِّد
  rationale: «المُعمِّد» لقب وصفي مباشر لمن يقوم بالتعميد، وهو التعبير العربي المألوف والواضح.
theological_decisions:
- issue: ترجمة Ἰωάννου τοῦ βαπτιστοῦ
  choice: يوحنا المُعمِّد
  alternative: يوحنا المعمدان
  rationale: اختير «المُعمِّد» لإظهار القوة الوصفية للفظ اليوناني βαπτιστής، مع إثبات الصيغة العربية التقليدية الشائعة في الحاشية من غير جعلها أساس الترجمة.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ذات نبرة سردية موقّرة. حُفظ ظرفا الفورية منفصلين: «في الحال» لدخولها و«الآن» لموعد تنفيذ الطلب. وُضع مؤشر الحاشية بعد تمام الاقتباس لأنه يخص لقب يوحنا داخله.'
