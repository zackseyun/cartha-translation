source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: ar
  text: ولمّا نزل إلى البرّ[a]، رأى جمعًا كبيرًا، فتحنّن عليهم، لأنهم كانوا كخراف لا راعي لها[b]. وبدأ يعلّمهم أشياء كثيرة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «خرج». ويفهم من سياق العبور بالقارب أنه خرج منه إلى البرّ.'
    reason: lexical_alternative
  - marker: b
    text: تردّد صورة «خراف لا راعي لها» صدى لغة كتابية تصف شعبًا يفتقر إلى قيادة أمينة؛ قارن العدد 27:17؛ الملوك الأول 22:17؛ حزقيال 34:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: نزل إلى البرّ
  rationale: المعنى الحرفي هو «خرج»، لكن سياق العبور بالقارب في مرقس 6:32-33 يبيّن أن المقصود خروجه من القارب إلى البر. والصياغة المختارة طبيعية وواضحة من غير توسّع.
- source_word: εἶδεν
  choice: رأى
  rationale: ترجمة مباشرة للفعل ὁράω في صيغة الماضي، ولا يقتضي السياق معنى تفسيريًا أقوى.
- source_word: πολὺν ὄχλον
  choice: جمعًا كبيرًا
  rationale: تنقل ὄχλος بمعنى «جمع» وπολύς الدالة على كبر العدد، في تعبير عربي فصيح وواضح.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: فتحنّن عليهم
  rationale: يدل الفعل على رحمة عميقة تتحرك في الباطن، و«تحنّن عليهم» ينقل هذه القوة مع حرف جر عربي طبيعي.
- source_word: ὅτι
  choice: لأنهم
  rationale: تُدخل العبارة سبب تحنّن يسوع عليهم، و«لأن» أوضح أداة سببية هنا.
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: كخراف لا راعي لها
  rationale: تحافظ الصياغة على التشبيه الرعوي كما هو، من غير إضافة تفسير للقيادة المقصودة.
- source_word: ἤρξατο διδάσκειν
  choice: بدأ يعلّمهم
  rationale: تنقل تركيب البدء مع المصدر بصورة عربية طبيعية وتحافظ على دلالته الاستهلالية.
- source_word: αὐτοὺς πολλά
  choice: يعلّمهم أشياء كثيرة
  rationale: تفهم πολλά بوصفها أمورًا كثيرة علّمهم إياها، وتحافظ على اتساع مضمون التعليم بدل اختزاله في طول المدة.
theological_decisions:
- issue: صورة الخراف التي لا راعي لها
  choice: الإبقاء على الاستعارة «كخراف لا راعي لها» في المتن
  alternative: التوسّع تفسيريًا إلى «كخراف بلا قيادة روحية»
  rationale: تستدعي العبارة لغة كتابية عن شعب يفتقر إلى الرعاية والقيادة الأمينة، لكن المتن ينبغي أن يحفظ الصورة وما فيها من أبعاد محتملة بدل أن يحصر معناها في تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «تحنّن» للمحافظة على قوة الرحمة العميقة، وأُبقيت صورة الراعي والخراف من غير شرح مذهبي داخل المتن.
