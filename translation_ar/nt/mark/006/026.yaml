  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: ar
  text: فحزن الملك حزنًا عميقًا، وبسبب أقسامه والمتكئين إلى المائدة[a]، لم يُرِد أن يردّ طلبها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «المتكئين إلى المائدة»، وهي هيئة تناول الطعام الرسمية في ذلك العصر؛ والمعنى: ضيوف الوليمة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أن يرفضها» أو «أن ينقض وعده لها». والمعنى أنه لم يُرِد إبطال ما وعدها به.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος γενόμενος
  choice: حزن حزنًا عميقًا
  rationale: ينقل شدة الحزن وتحوّل الملك إلى هذه الحال بعبارة عربية طبيعية، من غير إثقال النص بترجمة حرفية لاسم الفاعل.
- source_word: ὁ βασιλεὺς
  choice: الملك
  rationale: المقابل المباشر للمصطلح اليوناني، وهو اللقب الذي يستخدمه مرقس لهيرودس في هذا السياق.
- source_word: διὰ τοὺς ὅρκους
  choice: بسبب أقسامه
  rationale: تفيد διά مع النصب السببية، و«الأقسام» أدق من «النذور» هنا؛ وأضيف ضمير الملك كما يقتضيه السياق.
- source_word: τοὺς ἀνακειμένους
  choice: الجالسين معه إلى المائدة
  rationale: صياغة عربية طبيعية تدل على ضيوف الوليمة، مع إبقاء صورة الوجود إلى المائدة؛ أما الاتكاء فهو الهيئة القديمة الحرفية لتناول الطعام.
- source_word: οὐκ ἠθέλησεν
  choice: لم يُرِد
  rationale: يحفظ معنى الإرادة وعدم الرغبة، لا معنى العجز أو عدم القدرة.
- source_word: ἀθετῆσαι αὐτήν
  choice: أن يرفض طلبها
  rationale: المقصود سياقيًا ألا يردّ طلبها أو ينقض ما وعدها به؛ وإظهار «طلبها» أوضح في العربية من التعبير الحرفي «يرفضها»، من غير تغيير للمرجع المؤنث.
theological_decisions:
- issue: العلاقة بين حزن الملك وامتناعه عن الرفض
  choice: 'التعبير عنها بالمقابلة: «لكنه»'
  alternative: 'وصل العبارات من غير أداة مقابلة: «فحزن الملك... وبسبب...»'
  rationale: اسم الفاعل اليوناني لا يصرّح بأداة استدراك، لكن السياق يُظهر توترًا واضحًا بين حزنه وبين قراره؛ «لكنه» تنقل هذه الدلالة الخطابية من غير أن تجعل الحزن سببًا للقرار.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «الجالسين معه إلى المائدة» بدل الحرفية غير الطبيعية «المتكئين»، مع توضيح الصورة التاريخية في الحاشية. وأُظهر مفعول الرفض بلفظ «طلبها» منعًا لاحتمال فهم العبارة على أنها رفض لشخصها مطلقًا.
