  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: ar
  text: وخرج من هناك وجاء إلى بلدته[a]، وتبعه تلاميذه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويأتي إلى بلدته، ويتبعه تلاميذه»؛ إذ يستخدم اليوناني المضارع التاريخي لإضفاء الحيوية على السرد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: يحفظ صورة الفعل اليوناني الدالة على الخروج من الموضع السابق، وهو تعبير عربي طبيعي في السياق السردي.
- source_word: ἐκεῖθεν
  choice: من هناك
  rationale: ينقل ظرف المكان الذي يحدد نقطة الانطلاق بوضوح وإيجاز.
- source_word: ἔρχεται
  choice: جاء
  rationale: الفعل في اليونانية مضارع تاريخي، لكن الماضي أنسب للسرد العربي الطبيعي، مع إبقاء معنى الحركة إلى الوجهة.
- source_word: πατρίδα
  choice: بلدته
  rationale: تشير الكلمة في هذا السياق إلى موطن يسوع المحلي، أي بلدته، لا إلى الوطن بمعناه القومي الواسع.
- source_word: ἀκολουθοῦσιν
  choice: تبعه
  rationale: نُقل المضارع التاريخي إلى الماضي لانسجام السرد العربي، مع الحفاظ على دلالة الاتباع المرتبطة بالتلمذة.
- source_word: μαθηταὶ
  choice: تلاميذه
  rationale: «التلاميذ» هو المقابل العربي الراسخ الذي يجمع معنى التعلم والعلاقة بالمعلم.
theological_decisions:
- issue: صياغة المضارعين التاريخيين ἔρχεται وἀκολουθοῦσιν
  choice: 'تحويلهما إلى الماضي السردي: «جاء» و«تبعه»'
  alternative: 'الإبقاء على المضارع التاريخي: «يأتي» و«يتبعه»'
  rationale: هذا قرار أسلوبي لا عقائدي؛ فالماضي أكثر طبيعية في السرد العربي الحديث، بينما تُذكر حيوية الأصل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم الماضي للسرد الطبيعي، مع توثيق المضارع التاريخي في الحاشية، واختيرت «بلدته» لأنها أدق سياقيًا من «وطنه».
