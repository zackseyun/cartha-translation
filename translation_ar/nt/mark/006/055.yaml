- source_word: περιέδραμον
  choice: فركضوا في ... كلها
  rationale: يحفظ معنى الحركة السريعة الممتدة في أنحاء المنطقة، ويُظهر ما في الفعل المركب من إلحاح وانتشار مكاني.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: تلك المنطقة كلها
  rationale: «المنطقة» تدل هنا على الناحية أو الإقليم المحيط، لا على دولة بالمعنى الحديث، مع الحفاظ على معنى الشمول والإشارة.
- source_word: ἤρξαντο ... περιφέρειν
