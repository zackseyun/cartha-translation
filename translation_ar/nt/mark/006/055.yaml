- source_word: ἐπὶ τοῖς κραβάττοις
  choice: على فُرُش
  rationale: الكلمة اليونانية تشير إلى فراش بسيط قابل للحمل؛ و«فُرُش» تعبير عربي واضح وطبيعي، مع بيان البدائل في الحاشية.
- source_word: τοὺς κακῶς ἔχοντας
  choice: المرضى
  rationale: هذا التعبير اليوناني اصطلاح مألوف للدلالة على الذين يعانون المرض، و«المرضى» أقرب صياغة عربية موجزة وواضحة.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: إلى حيثما كانوا يسمعون أنه موجود
  rationale: «إلى حيثما» تُظهر وجهة الحركة المستفادة من السياق، والصياغة تحافظ على كون وجوده معلومًا لهم عن طريق ما كانوا يسمعونه.
