    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: في الحال
  rationale: ينقل معنى المبادرة الفورية بأسلوب عربي فصيح وطبيعي، ويحافظ على سمة السرعة في سرد مرقس.
- source_word: βασιλεὺς
  choice: الملك
  rationale: يحافظ على الوصف السردي الذي استعمله النص اليوناني، من غير تصحيح اللقب تاريخيًا إلى «رئيس الربع».
- source_word: σπεκουλάτορα
  choice: واحدًا من الحرس
  rationale: اللفظة اليونانية دخيلة من اللاتينية وتدل على فرد من حرس الحاكم، وقد قام هنا بمهمة الإعدام. يحافظ هذا الاختيار على هوية الرجل بوصفه حارسًا بدل اختزالها في وظيفته في هذه الواقعة.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: أمره أن يأتي
  rationale: صياغة عربية طبيعية تحافظ على قوة الأمر وعلى كون الحارس هو المكلَّف بإحضار الرأس.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: برأسه
  rationale: ترجمة عربية موجزة وطبيعية، ويُفهم من السياق أن الضمير يعود إلى يوحنا.
- source_word: ἀπεκεφάλισεν
  choice: قطع رأسه
  rationale: تعبير عربي واضح ومألوف يؤدي معنى الفعل اليوناني مباشرة، من غير استعمال لفظ تقني ثقيل.
- source_word: ἐν τῇ φυλακῇ
  choice: في السجن
  rationale: يحافظ على المكان المحدد في السرد، وهو السجن الذي كان يوحنا محتجزًا فيه.
