  rationale: يدل الفعل في هذا السياق على جمع ما تبقّى بعد إطعام الجموع، و«جمعوا» تعبير عربي طبيعي ودقيق.
- source_word: κλάσματα
  choice: الكِسَر
  rationale: تشير الكلمة إلى قطع مكسورة، وهي هنا بقايا الخبز؛ و«الكِسَر» موجزة وواضحة.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: اثنتي عشرة قُفّةً ممتلئةً
  rationale: تنقل العبارة عدد القفف وكونها ممتلئة، مع الحفاظ على صورة التركيب اليوناني بلغة عربية طبيعية.
- source_word: κόφινος
  choice: قُفّة
  rationale: اسم لوعاء منسوج يُستعمل للحمل؛ و«قُفّة» تميّزه طبيعيًا في العربية من غير افتراض حجم غير مصرّح به.
- source_word: πληρώματα
  choice: ممتلئة
  rationale: تؤدي معنى المقادير التي ملأت القفف، وصياغة «قُفّة ممتلئة» سليمة وواضحة عربيًا.
- source_word: ἀπὸ τῶν ἰχθύων
  choice: وكذلك من السمك
  rationale: تحافظ «من السمك» على دلالة المصدر أو التبعيض في ἀπό من غير إضافة لفظ «بعض» صراحة، وتوضح «كذلك» أن بقايا السمك جُمعت أيضًا.
