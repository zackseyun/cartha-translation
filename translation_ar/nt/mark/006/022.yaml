  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: ar
  text: 'ولما دخلت ابنة هيروديا[a] ورقصت، أعجبت هيرودس والذين كانوا متكئين معه إلى المائدة[b]، فقال الملك للفتاة: «اطلبي مني ما شئت، فأعطيكِ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تفهم بعض المخطوطات أو التقاليد العبارة بمعنى «ابنته هيروديا» بدلًا من «ابنة هيروديا». أما النص اليوناني المتَّبع هنا فيقرأ «ابنة هيروديا».
    reason: textual_variant
  - marker: b
    text: أي ضيوف الوليمة الذين كانوا يتكئون معه إلى المائدة، وهي هيئة معتادة لتناول الطعام آنذاك.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: ولما دخلت
  rationale: صياغة زمنية طبيعية تنقل وظيفة اسم الفاعل الماضي في تركيب المضاف إليه المطلق، وتربط دخولها بما تلاه.
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: ابنة هيروديا نفسها
  rationale: ينقل البناء اليوناني بحسب النص المتبع بوصف الفتاة ابنة هيروديا، وتؤدي «نفسها» قوة αὐτῆς من غير حسم المتغير النصي في المتن.
- source_word: ὀρχησαμένης
  choice: ورقصت
  rationale: فعل ماضٍ واضح وطبيعي يحافظ على تسلسل الأفعال.
- source_word: ἀρεσάσης
  choice: نالت إعجاب
  rationale: تعبير عربي طبيعي يؤدي معنى الإرضاء من غير مبالغة مثل «أبهجت».
- source_word: τοῖς συνανακειμένοις
  choice: المتكئين معه إلى المائدة
  rationale: يحفظ الصورة الثقافية الملموسة للضيوف الذين كانوا يتكئون عند الطعام، بدل تعميمها إلى «ضيوفه» فقط.
- source_word: εἶπεν ὁ βασιλεὺς
  choice: فقال الملك
  rationale: يتبع وصف مرقس «الملك» ولا يستبدله باللقب التاريخي التقني «رئيس الربع».
- source_word: τῷ κορασίῳ
  choice: للفتاة
  rationale: لفظ عربي حديث ومحايد مناسب لـ κοράσιον، بلا مسحة قديمة.
- source_word: Αἴτησόν με
  choice: اطلبي مني
  rationale: ينقل الأمر المباشر بصياغة عربية مألوفة، مع مطابقة جنس المخاطبة.
- source_word: ὃ ἐὰν θέλῃς
  choice: ما شئت
  rationale: صياغة عربية فصيحة ومفهومة تؤدي الاختيار المفتوح المقصود.
- source_word: δώσω σοι
  choice: فأعطيكِ
  rationale: يحفظ الوعد بالمستقبل في جواب الطلب، والشيء المعطى مفهوم من «ما شئت» فلا يلزم ضمير مفعول زائد.
theological_decisions:
- issue: لقب βασιλεύς لهيرودس أنتيباس
  choice: الملك
  alternative: رئيس الربع أو الحاكم
  rationale: يحافظ على لفظ النص السردي ولا يُدخل تصحيحًا تاريخيًا تقنيًا من خارج العبارة.
- issue: هوية الفتاة في المتغير النصي
  choice: ابنة هيروديا نفسها
  alternative: ابنته هيروديا
  rationale: يتبع نص SBLGNT المعطى، مع بيان القراءة الأخرى في الحاشية بدل دمجها أو حسمها بصمت.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حوفظ على صورة الاتكاء إلى المائدة وعلى لقب «الملك». وُضع مؤشر المتغير النصي بعد تحديد هوية الفتاة، ومؤشر الملاحظة الثقافية بعد الآية مع بقاء العبارة التي يشرحها في المتن.
