  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: ar
  text: وبعد أن ودَّعهم[a]، مضى إلى الجبل ليصلّي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعد أن قال لهم وداعًا».'
    reason: بديل معجمي لـ ἀποταξάμενος يحفظ معنى التوديع وأخذ الوداع، دون الإيحاء بطلب الإذن بالانصراف.
lexical_decisions:
- source_word: ἀποταξάμενος
  choice: بعدما ودَّعهم
  rationale: الفعل المتوسط يدل هنا على أخذ الوداع أو توديع أشخاص، و«ودَّعهم» تعبير عربي طبيعي يحفظ معنى المفارقة ويناسب ضمير الجمع في حالة المجرور اليونانية.
- source_word: αὐτοῖς
  choice: هم، في «ودَّعهم»
  rationale: ضمير جمع يعود إلى المذكورين في السياق، وقد أُدمج طبيعيًا مفعولًا به في التعبير العربي.
- source_word: ἀπῆλθεν
  choice: مضى
  rationale: يفيد مغادرة الموضع والذهاب؛ و«مضى» فصيحة وطبيعية في السرد، من غير إثقال العبارة بتكرار معنى الانصراف.
- source_word: εἰς τὸ ὄρος
  choice: إلى الجبل
  rationale: ينقل الاسم المعرّف في اليونانية نقلًا مباشرًا، من غير تعيين رمزي أو جغرافي غير مصرّح به.
- source_word: προσεύξασθαι
  choice: ليصلّي
  rationale: مصدر غرضي يبيّن قصد ذهابه، وتؤديه لام التعليل مع الفعل بوضوح وطبيعية.
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يواصل مجرى السرد من غير إضافة دلالة زمنية تفسيرية.
theological_decisions:
- issue: دلالة «الجبل»
  choice: الإبقاء على «الجبل» مع التعريف، بلا إضفاء معنى رمزي أو لاهوتي
  alternative: «جبل» بالتنكير، أو تفسيره موضعًا لإعلان خاص
  rationale: النص اليوناني يستعمل أداة التعريف ولا يشرح دلالة رمزية؛ لذلك تُحفظ الصورة السردية الملموسة من غير استنتاج زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «ودَّعهم» للتعبير الطبيعي، و«مضى» للإيجاز السردي، مع إبقاء «الجبل» معرّفًا وفق اليونانية.
