base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: ar
  text: 'وحلف لها: «مهما طلبتِ مني، فسأعطيكِ، إلى نصف مملكتي».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذا تعبير ملوكي تقليدي للمبالغة في إظهار السخاء، وليس بالضرورة عرضًا حرفيًا لتقسيم المملكة.
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: حلف
  rationale: ينقل فعل أداء اليمين بعبارة عربية طبيعية ومباشرة، ويحفظ قوة الالتزام الرسمي.
- source_word: αὐτῇ
  choice: لها
  rationale: ينقل ضمير المؤنث المفرد في حالة المجرور الدالة على الجهة المخاطبة.
- source_word: Ὅ τι ἐάν
  choice: مهما
  rationale: تؤدي معنى الموصول الشرطي غير المحدد، وتحفظ شمول العرض بصياغة عربية موجزة.
- source_word: με αἰτήσῃς
  choice: تطلبي مني
  rationale: صياغة عربية طبيعية لطلب شيء من شخص، مع تأنيث المخاطبة بحسب السياق.
- source_word: δώσω σοι
  choice: فسأعطيك
  rationale: يحفظ دلالة المستقبل وقوة الوعد، وتربط الفاء جواب الشرط في العربية بوضوح.
- source_word: ἕως ἡμίσους
  choice: ولو بلغ نصف
  rationale: يعبّر عربيًا عن الحد الأقصى للعرض، مع إبراز أن الوعد يشمل حتى هذا المقدار الكبير.
- source_word: τῆς βασιλείας μου
  choice: مملكتي
  rationale: يناسب المشهد الملكي ويؤدي المعنى المكاني أو السياسي المرجح لـβασιλεία هنا من غير تحميله معنى لاهوتيًا تقنيًا.
theological_decisions:
- issue: دلالة βασιλεία في كلام هيرودس
  choice: مملكتي
  alternative: سلطاني الملكي أو نطاق حكمي
  rationale: يمكن أن تدل الكلمة على المُلك أو الحكم أو المملكة، لكن صيغة العرض الملوكي المبالغ فيه ترجّح «مملكتي»، مع بقاء البدائل ممكنة من حيث المعجم.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «مهما... فسـ» لبناء الشرط المفتوح طبيعيًا، و«ولو بلغ» لنقل حد العرض الكمي دون جمود حرفي.
