    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλυσον
  choice: اصرفهم
  rationale: فعل أمر يفيد إنهاء اجتماع الجمع والسماح لهم بالانصراف؛ و«اصرفهم» عربية واضحة وموجزة وتحفظ قوة التوجيه.
- source_word: ἵνα
  choice: لِـ
  rationale: تؤدي لام التعليل معنى الغاية المقصودة بصورة طبيعية في العربية.
- source_word: ἀπελθόντες
  choice: يذهبوا
  rationale: 'أُدمج اسم الفاعل اليوناني الدال على الفعل السابق في جملة الغاية، مع بقاء تسلسل المعنى مفهومًا: ينصرفون ثم يشترون.'
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: الحقول والقرى المحيطة
  rationale: تحفظ «المحيطة» معنى κύκλῳ، وتترجم ἀγροί بالحقول من غير حصرها في مزارع مملوكة، وκῶμαι بالقرى.
- source_word: ἀγοράσωσιν
  choice: يشتروا
  rationale: المقابل العربي المباشر والطبيعي لفعل الشراء.
- source_word: ἑαυτοῖς
  choice: لأنفسهم
  rationale: يحفظ صراحةً دلالة ضمير المنفعة الانعكاسي.
- source_word: τί φάγωσιν
  choice: ما يأكلونه
  rationale: صياغة عربية طبيعية تحافظ على عدم التحديد في τί وعلى معنى الطعام الذي سيأكلونه.
