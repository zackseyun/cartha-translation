  text: ὁ δὲ λέγει αὐτοῖς· Πόσους ⸂ἔχετε ἄρτους⸃; ⸀ὑπάγετε ἴδετε. καὶ γνόντες λέγουσιν· Πέντε, καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: ar
  text: 'فقال لهم: «كم رغيفًا عندكم؟ اذهبوا وانظروا». ولما عرفوا، قالوا: «خمسة، وسمكتان».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: رغيفًا
  rationale: يدل اللفظ هنا على أرغفة الخبز المعدودة؛ وجاء المفرد بعد «كم» وفق الأسلوب العربي الطبيعي.
- source_word: ὑπάγετε ἴδετε
  choice: اذهبوا وانظروا
  rationale: يحافظ على الأمرين المتتابعين في اليونانية بصياغة عربية واضحة ومباشرة.
- source_word: γνόντες
  choice: لما عرفوا
  rationale: ينقل معنى التحقق من العدد ومعرفته من غير إضافة كيفية غير مذكورة في النص.
- source_word: ἰχθύας
  choice: سمكتان
  rationale: ترجمة طبيعية للعدد مع الاسم، مع الحفاظ على المعنى المباشر.
theological_decisions: []
