source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: ar
  text: ولمّا سمع تلاميذه، جاؤوا وحملوا جثمانه ووضعوه في قبر.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ولمّا سمع
  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل هنا على الزمن والتتابع؛ و«لمّا سمع» صياغة عربية طبيعية تؤدي معنى «حين سمعوا».
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: «تلاميذ» تنقل المعنى الاصطلاحي المعتاد للكلمة، والضمير يعود في السياق المباشر إلى يوحنا المعمدان.
- source_word: ἦλθον
  choice: جاؤوا
  rationale: ينقل الفعل معنى المجيء إلى موضع الحدث بصياغة سردية عربية مباشرة.
- source_word: ἦραν τὸ πτῶμα αὐτοῦ
  choice: حملوا جثمانه
  rationale: الفعل يدل على الرفع أو الأخذ والحمل، و«جثمان» يبيّن أن المقصود جسد ميت مع الحفاظ على لغة كريمة ملائمة لسياق الدفن.
- source_word: ἔθηκαν
  choice: وضعوه
  rationale: ترجمة واضحة ومباشرة لفعل الوضع في سياق الدفن، من غير إضافة تفصيل غير موجود في النص.
- source_word: ἐν μνημείῳ
  choice: في قبر
  rationale: الكلمة تدل هنا على موضع الدفن؛ و«قبر» تعبير عربي واضح وطبيعي لهذا السياق.
theological_decisions:
- issue: مرجع الضمير في «تلاميذه»
  choice: تلاميذ يوحنا المعمدان
  alternative: تلاميذ يسوع
  rationale: السياق المباشر يروي إعدام يوحنا، ثم مجيء تلاميذه لأخذ جثمانه ودفنه؛ لذلك يعود الضمير طبيعيًا إلى يوحنا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة، مع الحفاظ على تتابع الأفعال في السرد وعلى دلالة πτῶμα الصريحة بوصفه جسدًا ميتًا.
