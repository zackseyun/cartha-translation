  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: ar
  text: 'وأوصاهم ألّا يأخذوا معهم شيئًا للطريق إلا عصًا فقط: لا خبزًا، ولا كيس زاد، ولا نحاسًا[a] في أحزمتهم—'
