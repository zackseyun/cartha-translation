lexical_decisions:
- source_word: παρήγγειλεν
  choice: أوصاهم
  rationale: ينقل فعل إعطاء توجيه ملزم بصياغة عربية طبيعية، من غير أن يضفي عليه قسوة غير لازمة.
- source_word: μηδὲν αἴρωσιν
  choice: ألّا يأخذوا معهم شيئًا
  rationale: السياق هو ما يحمله المسافر من لوازم، وإضافة «معهم» توضح المعنى المقصود طبيعيًا.
- source_word: εἰς ὁδὸν
  choice: للطريق
  rationale: تعبير عربي موجز وطبيعي يدل على الاستعداد للرحلة.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: إلا عصًا فقط
  rationale: يحفظ الاستثناء والتوكيد في μόνον، و«عصا» واضحة بوصفها عصا المسافر.
- source_word: ἄρτον
  choice: خبزًا
  rationale: يحافظ على الاسم المحسوس في اليونانية ولا يعممه إلى «طعام».
- source_word: πήραν
  choice: كيس زاد
  rationale: يبين أنه كيس يحمله المسافر للمؤن، وهو أدق من «كيس» وحدها وأوضح للقارئ المعاصر من ألفاظ قديمة مثل «مزود».
- source_word: ζώνην
  choice: أحزمتهم
  rationale: ينقل الحزام أو نطاق الخصر الذي كانت النقود تُحمل فيه.
- source_word: χαλκόν
  choice: نحاسًا
  rationale: يحافظ في المتن على اللفظ الحرفي الذي يشير بالسياق إلى النقود النحاسية، مع توضيح الدلالة النقدية في الحاشية.
