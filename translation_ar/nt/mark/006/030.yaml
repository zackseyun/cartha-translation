  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: ar
  text: واجتمع الرسل إلى يسوع، وأخبروه بكل ما فعلوا وما علَّموا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: اجتمع
  rationale: المضارع هنا مضارع تاريخي في السرد، فصيغ بالماضي العربي الطبيعي، مع الحفاظ على معنى اجتماع الجماعة.
- source_word: οἱ ἀπόστολοι
  choice: الرسل
  rationale: مصطلح عربي كتابي معروف يدل هنا على الاثني عشر في دورهم بوصفهم مرسَلين، لا على مجرد رسل بالمعنى العام.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: عند يسوع
  rationale: تدل العبارة في السياق على اجتماعهم إليه وحضورهم عنده بعد رجوعهم؛ وهذه صياغة عربية طبيعية لا توحي بأن يسوع هو مكان.
- source_word: ἀπήγγειλαν
  choice: أخبروه
  rationale: يفيد الفعل نقل الخبر أو تقديم تقرير؛ و«أخبروه» واضحة وطبيعية في سياق عودتهم وسرد ما جرى.
- source_word: πάντα ὅσα ἐποίησαν
  choice: بكل ما فعلوا
  rationale: تحفظ شمول πάντα وبنية الموصول من غير تكلف.
- source_word: ὅσα ἐδίδαξαν
  choice: وما علَّموا
  rationale: تحافظ على تكرار أداة الموصول في الأصل وعلى موازاة العمل والتعليم.
theological_decisions:
- issue: تسمية التلاميذ ἀπόστολοι في السرد
  choice: الرسل
  alternative: المرسَلون
  rationale: «الرسل» المقابل الاصطلاحي المستقر، ويحفظ دور الجماعة التي أرسلها يسوع من غير تحويل اللقب إلى شرح تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم الماضي للسرد، وحُفظ التوازي بين «ما فعلوا» و«ما علَّموا». لا حاجة إلى حاشية لأن النص اليوناني واضح، والحاشية الإنجليزية الموروثة تتعلق بصياغة إنجليزية لا باختلاف نصي أو غموض أصلي.
