  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: ar
  text: 'لأن يوحنا كان يقول لهيرودس: «لا يحلّ لك أن تكون لك امرأة أخيك».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يجوز لك أن تكون لك امرأة أخيك».'
    reason: بديل معجمي لـἔξεστιν يحافظ على معنى الجواز أو المنع.
lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: صيغة الماضي الناقص تدل على قول مستمر أو متكرر في الماضي، و«كان يقول» تنقل هذا المعنى طبيعيًا من غير حصره في مرة واحدة.
- source_word: γὰρ
  choice: لأن
  rationale: أداة تفسير تربط العبارة بالسياق السابق وتبيّن سبب ما حدث.
- source_word: Ἡρῴδῃ
  choice: لهيرودس
  rationale: نقل قياسي للاسم الشخصي مع لام التعدية التي يقتضيها الفعل «يقول» في العربية.
- source_word: Οὐκ ἔξεστίν σοι
  choice: لا يحلّ لك
  rationale: تعبير عربي واضح يحفظ قوة المنع الشرعي والأخلاقي في ἔξεστιν من غير إضافة إحالة صريحة إلى شريعة موسى.
- source_word: ἔχειν
  choice: أن تكون لك
  rationale: ينقل معنى «أن يكون له/يمسك» في سياق العلاقة الزوجية بلغة عربية طبيعية، من غير تفسير زائد لطبيعة الفعل.
- source_word: γυναῖκα
  choice: امرأة
  rationale: في تركيب «امرأة أخيك» تدل الكلمة طبيعيًا على الزوجة، مع الحفاظ على الصياغة العربية الكتابية الواضحة.
- source_word: τοῦ ἀδελφοῦ σου
  choice: أخيك
  rationale: إضافة عربية طبيعية تحفظ صلة القرابة المحورية في توبيخ يوحنا.
theological_decisions:
- issue: طبيعة توبيخ يوحنا
  choice: «لا يحلّ لك» بوصفها صيغة منع شرعي وأخلاقي
  alternative: «لا يجوز لك» أو «ليس مباحًا لك»
  rationale: يحمل الفعل اليوناني معنى ما هو جائز أو مشروع. وتحفظ الصياغة المختارة القوة القانونية والأخلاقية، مع عدم إدخال اقتباس صريح من الشريعة غير موجود في الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظت استمرارية الماضي في «كان يقول»، واستُعمل «لا يحلّ لك» لنقل القوة الشرعية الأخلاقية دون توسع تفسيري.
