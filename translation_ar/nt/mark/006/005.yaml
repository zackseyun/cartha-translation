  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: ar
  text: ولم يكن قادرًا على أن يصنع هناك أيَّ عملٍ من أعمال القوة[a]، إلا أنه وضع يديه على قليل من المرضى فشفاهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيَّ معجزة» أو «أيَّ عملٍ ذي قوة»؛ واللفظ اليوناني حرفيًا «أيَّ قوة»، وهو تعبير يستخدمه مرقس للدلالة على الأعمال المعجزية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: يكن قادرًا
  rationale: ينقل دلالة عدم القدرة الواضحة في الفعل اليوناني المنفي، من غير تلطيفها إلى مجرد عدم الإرادة.
- source_word: ποιῆσαι
  choice: يصنع
  rationale: ترجمة مباشرة للفعل العام ποιέω، وتنسجم في العربية مع عبارة «عمل عظيم».
- source_word: οὐδεμίαν δύναμιν
  choice: أيَّ عملٍ عظيم
  rationale: ينقل الاستعمال المرقسي الذي يشير إلى فعل معجزي مقتدر، مع إبقاء الصلة الدلالية بالقوة من غير حصره في لفظ «معجزة» الأكثر تفسيرًا.
- source_word: εἰ μὴ
  choice: إلا أنه
  rationale: يوضح الاستثناء من النفي السابق، ويمهد طبيعيًا للجملة الفعلية التالية.
- source_word: ὀλίγοις ἀρρώστοις
  choice: عدد قليل من المرضى
  rationale: صياغة عربية طبيعية ودقيقة للكمية وللأشخاص المصابين بالمرض.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: وضع يديه على
  rationale: يحفظ الفعل الجسدي المعبَّر عنه بصيغة اسم الفاعل اليونانية، في تركيب عربي واضح.
- source_word: ἐθεράπευσεν
  choice: شفاهم
  rationale: الترجمة الطبيعية للفعل θεραπεύω في سياق الشفاء، والضمير يوضح عودته إلى المرضى.
theological_decisions:
- issue: هل تُلطَّف عبارة οὐκ ἐδύνατο تجنبًا للإيحاء بوجود حدّ لقدرة يسوع؟
  choice: 'الإبقاء على المعنى الصريح: «لم يكن قادرًا»'
  alternative: «لم يشأ أن يصنع» أو مجرد «لم يصنع»
  rationale: النص اليوناني يصرح بعدم القدرة باستعمال δύναμαι مع النفي. تحفظ الترجمة التوتر اللاهوتي في النص ولا تحوله إلى عدم رغبة بتفسير مستورد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختير «عمل عظيم» لصياغة طبيعية تحفظ، قدر الإمكان، معنى الفعل المقتدر، وأُثبتت علامة الحاشية [a] في المتن.
