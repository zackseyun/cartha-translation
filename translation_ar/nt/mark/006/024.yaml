source:
  edition: SBLGNT
  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: ar
  text: 'وبعد أن خرجت، قالت لأمها: «ماذا أطلب؟» فقالت لها: «رأس يوحنا المعمِّد[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحسب اللقب التقليدي الشائع: «يوحنا المعمدان».'
    reason: بديل معجمي تقليدي للقب اليوناني.
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: بعد أن خرجت
  rationale: اسم الفاعل اليوناني في صيغة الماضي يسبق الفعل الرئيس زمنًا؛ فتنقل العبارة ترتيب الحدثين بوضوح وطبيعية.
- source_word: Τί αἰτήσωμαι
  choice: ماذا أطلب؟
  rationale: صيغة الاحتمال التداولية تعبّر عن سؤال المتكلمة لنفسها عمّا تطلبه، وهذه الصياغة العربية موجزة وطبيعية وتحفظ دلالة التشاور.
- source_word: μητρὶ αὐτῆς
  choice: لأمها
  rationale: نقل مباشر وطبيعي لتركيب المضاف إليه الدال على الملكية.
- source_word: κεφαλήν
  choice: رأس
  rationale: يحفظ المفعول المطلوب بصراحته من غير تلطيف أو توسع.
- source_word: τοῦ βαπτίζοντος
  choice: المعمِّد
  rationale: ينقل اسم الفاعل اليوناني بوصفه لقبًا يعرّف يوحنا من خلال عمله في التعميد، بدل الاكتفاء باللقب العربي الموروث.
theological_decisions:
- issue: ترجمة لقب يوحنا βαπτίζων
  choice: المعمِّد
  alternative: المعمدان
  rationale: «المعمِّد» ينقل معنى اسم الفاعل اليوناني مباشرة، أما «المعمدان» فهو اللقب التقليدي الشائع؛ أُثبت البديل في الحاشية من غير تحميل اللفظ دلالة طائفية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «وبعد أن خرجت» لإبراز سبق الخروج للكلام، وأُضيف «لها» بعد «فقالت» لتوضيح جهة الخطاب طبيعيًا من غير تغيير المعنى.
