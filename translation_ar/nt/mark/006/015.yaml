base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: ar
  text: 'وكان آخرون يقولون: «إنه إيليا»، وكان آخرون يقولون: «إنه نبيّ، كواحد من الأنبياء».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على احتمال أضعف: «إنه النبي، كواحد من الأنبياء»، إذا فُهمت الكلمة على أنها تشير إلى شخصية أخروية محددة؛ لكن اليونانية تُقرأ على نحو أرجح «نبيّ» هنا بسبب العبارة التالية: «كواحد من الأنبياء».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: وكان آخرون
  rationale: تفيد ἄλλοι جماعة أخرى ضمن الآراء المتداولة، وتفيد δέ انتقالًا أو مقابلة خفيفة؛ وصيغة «وكان آخرون» طبيعية في العربية وتحافظ على تتابع الأقوال.
- source_word: ἔλεγον
  choice: يقولون
  rationale: الماضي الناقص اليوناني يصور قولًا مستمرًا أو متكررًا، وتنقل صيغة «كانوا/كان ... يقولون» هذا الجانب دون مبالغة.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: «إنه إيليا»
  rationale: نُقل مضمون القول بصيغة اقتباس مباشر طبيعية، واستُعمل الاسم الكتابي العربي المألوف «إيليا».
- source_word: προφήτης
  choice: نبيّ
  rationale: الاسم الخبر غير المعرّف يُفهم هنا على الأرجح بمعنى غير محدد، أي واحد من فئة الأنبياء، ولا تحتاج العربية إلى أداة تنكير مستقلة.
- source_word: ὡς εἷς τῶν προφητῶν
  choice: كواحد من الأنبياء
  rationale: تنقل الكاف معنى المقارنة في ὡς، وتحافظ العبارة على الإشارة إلى واحد من الأنبياء المعروفين دون تحديده.
theological_decisions:
- issue: هل προφήτης وصف عام بمعنى «نبيّ» أم لقب أخروي محدد بمعنى «النبي»؟
  choice: نبيّ
  alternative: النبي
  rationale: غياب أداة التعريف في اليونانية، ولا سيما مع التوضيح اللاحق «كواحد من الأنبياء»، يرجح الوصف العام. ومع ذلك تُذكر القراءة اللقبية البديلة في الحاشية حفظًا لاحتمالها دون إدخالها في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حوفظ على تكرار «يقولون» لإبراز تعدد الجماعات واستمرار الأقوال، وعلى التنكير الدلالي في «نبيّ» من غير فرض لقب لاهوتي محدد.
