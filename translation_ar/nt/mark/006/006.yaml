  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: ar
  text: وكان يتعجّب بسبب عدم إيمانهم[a]. وكان يجول في القرى المحيطة، معلّمًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكان يندهش بسبب عدم إيمانهم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وكان يجول في القرى من حوله»، أو: «وكان يطوف بالقرى في مسار دائري».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: كان يتعجّب
  rationale: ينقل معنى الدهشة أو التعجّب، وتحافظ صيغة «كان» مع المضارع على الدلالة الاستمرارية للفعل الناقص في اليونانية.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: بسبب عدم إيمانهم
  rationale: تفيد διά مع النصب السببية هنا، و«عدم إيمانهم» تعبير عربي واضح يحافظ على قوة ἀπιστία دون اختزالها في مجرد ضعف الثقة.
- source_word: περιῆγεν
  choice: أخذ يجول
  rationale: يعبّر عن حركة متواصلة من موضع إلى آخر، كما توحي صيغة الماضي الناقص اليونانية.
- source_word: τὰς κώμας κύκλῳ
  choice: في القرى المحيطة
  rationale: «القرى» مقابل طبيعي لـ κώμας، و«المحيطة» تنقل الدلالة المكانية أو الدائرية لـ κύκλῳ بصورة عربية سلسة، مع إبقاء احتمال التجوال في مسار دائري في الحاشية.
- source_word: διδάσκων
  choice: وهو يعلّم
  rationale: يحافظ على تزامن التعليم مع التجوال، وهو ما تؤديه صيغة اسم الفاعل الحاضر في اليونانية.
theological_decisions:
- issue: وصف تعجّب يسوع من عدم الإيمان دون تخفيف العبارة أو تفسيرها عقائديًا
  choice: وكان يتعجّب بسبب عدم إيمانهم
  alternative: وكان يندهش من عدم إيمانهم
  rationale: يثبت النص فعل التعجّب بوضوح؛ لذلك تُحفظ قوته السردية والتوتر اللاهوتي فيه دون إضافة تفسير عن طبيعة معرفة يسوع أو سبب دهشته.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية رصينة. استُخدم «ثم أخذ يجول» لإظهار استمرارية الحدث والانتقال السردي، و«وهو يعلّم» لبيان تزامن التعليم مع التجوال.
