  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: ar
  text: ولمّا خرجوا من القارب، تعرّف إليه الناس في الحال[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «وبعد أن خرجوا من القارب، تعرّفوا إليه في الحال». لا يذكر النص اليوناني فاعل «تعرّفوا» صراحةً، لكن السياق يشير إلى أهل المكان.'
    reason: بيان البنية الحرفية والفاعل المفهوم من السياق
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: ولمّا خرجوا
  rationale: رُكّب المضاف إليه المطلق اليوناني في العربية جملةً زمنية طبيعية، مع إبقاء الجمع كما في المصدر.
- source_word: πλοίου
  choice: القارب
  rationale: يشير اللفظ في سياق بحيرة الجليل إلى مركب صغير، و«القارب» أوضح من «السفينة» للقارئ المعاصر.
- source_word: εὐθὺς
  choice: في الحال
  rationale: تنقل سرعة الحدث التي يبرزها مرقس، بصياغة عربية طبيعية رصينة.
- source_word: ἐπιγνόντες
  choice: عرفه الناس
  rationale: الفعل هنا يدل على التعرّف إلى يسوع عند رؤيته. أُظهر الفاعل في العربية من السياق لأن اسم الفاعل اليوناني لا يصرّح به داخل هذه العبارة.
- source_word: αὐτὸν
  choice: ـه
  rationale: الضمير يعود إلى يسوع بحسب السياق السابق.
theological_decisions:
- issue: هوية الذين عرفوا يسوع
  choice: الناس، أي أهل المكان بحسب السياق
  alternative: 'إبقاء الفاعل غير معيّن: «عرفوه في الحال»'
  rationale: هذه مسألة نحوية وسياقية لا عقائدية. اسم الفاعل اليوناني في حالة الرفع والجمع، فلا يعود طبيعيًا إلى الضمير الواقع في تركيب المضاف إليه المطلق؛ والآية التالية تبيّن أن أهل الناحية هم الذين عرفوا يسوع وتحركوا في المنطقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «ولمّا» للعلاقة الزمنية، و«في الحال» للمحافظة على سرعة السرد عند مرقس، مع إظهار «الناس» توضيحًا للفاعل الذي يفهم من السياق ووضع حاشية تحفظ الصياغة اليونانية الموجزة.
