source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: ar
  text: 'ولمّا جاء يوم السبت، أخذ يعلّم في المجمع. وكثيرون حين سمعوه دُهشوا وقالوا: «من أين لهذا هذه الأمور؟ وما هذه الحكمة التي أُعطيت له، وما هذه الأعمال الجبّارة التي تُجرى بيديه؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «الأعمال الجبّارة»: «المعجزات» أو «أعمال القوّة». فاللفظة اليونانية في صيغة الجمع (δυνάμεις) قد تدل على أفعال عجائبية أو على مظاهر للقوة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: ولمّا جاء يوم السبت
  rationale: ينقل تركيب الحال الزمني في اليونانية، مع الحفاظ على معنى حلول السبت بصياغة عربية طبيعية.
- source_word: ἤρξατο διδάσκειν
  choice: أخذ يعلّم
  rationale: تعبير عربي فصيح وطبيعي يدل على الشروع في التعليم.
- source_word: συναγωγῇ
  choice: المجمع
  rationale: المعنى هنا هو موضع الاجتماع والعبادة اليهودي، و«المجمع» هو المقابل العربي المستقر في هذا السياق.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: كثيرون حين سمعوه
  rationale: يجعل مرجع السماع واضحًا من السياق، وينقل معنى الكثرة مع الظرف المصاحب.
- source_word: ἐξεπλήσσοντο
  choice: دُهشوا
  rationale: ينقل قوة رد الفعل من الذهول الشديد بصياغة عربية واضحة وموجزة.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: من أين لهذا هذه الأمور؟
  rationale: يحافظ على الإيجاز وعلى ضمير الإشارة ذي النبرة التباعدية المحتملة، من غير إضافة فعل «حصل» غير الصريح في الأصل.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: ما هذه الحكمة التي أُعطيت له
  rationale: يحافظ على الاستفهام وعلى صيغة المبني للمجهول في «أُعطيت»، من غير تعيين الواهب.
- source_word: δυνάμεις
  choice: الأعمال المقتدرة
  rationale: ينقل معنى أعمال القدرة الخارقة مع تجنب حصر اللفظ في «المعجزات» وحدها؛ وتوضح الحاشية البدائل الدلالية.
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: التي تجري على يديه
  rationale: يحفظ صورة اليدين والوساطة الآلية في التعبير اليوناني بصياغة عربية مألوفة.
theological_decisions:
- issue: دلالة δυνάμεις
  choice: الأعمال المقتدرة
  alternative: المعجزات؛ أعمال القدرة
  rationale: الجمع في مرقس يشير غالبًا إلى أفعال خارقة تُظهر القدرة، لكن اللفظ نفسه أوسع قليلًا من المصطلح الاصطلاحي «المعجزات»، لذلك حُفظ هذا الاتساع في المتن والحاشية.
- issue: نبرة τούτῳ
  choice: لهذا / له
  alternative: لهذا الرجل
  rationale: يحافظ اسم الإشارة على احتمال نبرة التباعد أو الانتقاص، من غير إضافة الاسم «الرجل» الذي لا يرد صراحة في اليونانية.
- issue: المبني للمجهول في δοθεῖσα
  choice: أُعطيت له
  alternative: نالها
  rationale: تُرك الواهب غير مصرّح به كما في الأصل، حفظًا للغموض النصي وعدمًا لفرض تفسير لاهوتي.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُخدمت «أخذ يعلّم» للشروع، و«تجري على يديه» لحفظ الصورة اليونانية دون جمود حرفي. وُضعت علامة الحاشية بعد الجملة التي تتضمن اللفظ المشروح.
