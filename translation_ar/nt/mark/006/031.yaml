  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: ar
  text: 'فقال لهم: «تعالوا أنتم وحدكم إلى مكان منعزل[a]، واستريحوا قليلًا». فقد كان القادمون والذاهبون كثيرين، ولم تتح لهم حتى فرصة ليأكلوا[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مكان خالٍ» أو «مكان مقفر». تشير اليونانية إلى موضع منعزل أو غير مأهول، وليس بالضرورة إلى صحراء بالمعنى الحديث.
    reason: lexical_alternative
  - marker: b
    text: أو «لم يكن لديهم حتى وقت ليأكلوا».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: فقال
  rationale: استُخدم الماضي في السرد العربي الطبيعي، مع أن اليونانية تستعمل المضارع التاريخي هنا، من غير تغيير وظيفة الفعل السردية.
- source_word: Δεῦτε
  choice: تعالوا
  rationale: صيغة دعوة وأمر للجمع، وتلائم دعوة يسوع لهم إلى الانتقال معه بعيدًا عن الجموع.
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: أنتم وحدكم
  rationale: يجمع التعبير بين توكيد الضمير ومعنى الانفراد، ويحافظ على التشديد على ابتعاد المخاطَبين عن الآخرين بصياغة عربية طبيعية.
- source_word: ἔρημον τόπον
  choice: مكان منعزل
  rationale: يدل التعبير على موضع خالٍ أو غير مأهول، لا يلزم أن يكون صحراء بالمعنى الحديث؛ و«منعزل» يبرز غرض الخلوة من غير تضييق الدلالة.
- source_word: ἀναπαύσασθε
  choice: استريحوا
  rationale: أمر يفيد التوقف عن العمل واستعادة القوة، و«استريحوا» أوضح مقابل عربي مباشر.
- source_word: ὀλίγον
  choice: قليلًا
  rationale: يفيد مدة قصيرة أو قدرًا يسيرًا، وتحافظ الصياغة الموجزة على شيء من سعة الدلالة الأصلية.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: كان القادمون والذاهبون كثيرين
  rationale: يحافظ على البنية الاسمية وعلى صورة التدفق المتواصل لأناس كثيرين، بصياغة عربية واضحة.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: لم تتح لهم حتى فرصة ليأكلوا
  rationale: يعبر عن عدم توافر الفرصة أو المتسع، وتحفظ «حتى» قوة οὐδέ.
theological_decisions: []
