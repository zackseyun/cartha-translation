lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: حُفظ حرف العطف البسيط للمحافظة على تتابع السرد من غير إضافة دلالة زمنية غير مصرّح بها.
- source_word: διαπεράσαντες
  choice: بعدما عبروا
  rationale: اسم الفاعل اليوناني بصيغة الماضي يدل هنا على فعل سبق الفعل الرئيس؛ وهذه الصياغة العربية طبيعية وتحفظ الترتيب الزمني.
- source_word: ἐπὶ τὴν γῆν ... ἦλθον εἰς Γεννησαρὲτ
  choice: إلى البر، وصلوا إلى جَنِّيسارَت
  rationale: تدل γῆ في سياق الرحلة بالقارب على البر أو الشاطئ. اختير «البر» حفاظًا على اللفظ اليوناني، بينما عبّرت «وصلوا» طبيعيًا عن بلوغ الوجهة المحددة.
- source_word: Γεννησαρὲτ
  choice: جَنِّيسارَت
  rationale: نُقل اسم الموضع صوتيًا إلى العربية من غير ترجمته.
- source_word: προσωρμίσθησαν
  choice: رَسَوا هناك
  rationale: يحمل الفعل معنى بحريًا خاصًا بإرساء القارب أو بلوغه المرسى؛ والفعل العربي «رسا» موجز وطبيعي ويحفظ هذا المعنى. أُضيفت «هناك» إيضاحًا مرجعيًا طبيعيًا من السياق.
