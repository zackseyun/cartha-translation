lexical_decisions:
- source_word: ἐπέταξεν
  choice: أمر
  rationale: يفيد الفعل إصدار أمر ذي سلطان، و«أمر» ينقل هذه القوة بوضوح وطبيعية.
- source_word: αὐτοῖς
  choice: هم في «أمرهم»
  rationale: يحفظ ضمير الجمع بوصفه مفعولًا غير مباشر، ويشير سياقيًا إلى التلاميذ من غير إدخال الاسم في المتن.
- source_word: ἀνακλῖναι
  choice: أن يُجلِسوا
  rationale: مع وجود αὐτοῖς وπάντας، يفيد التركيب أن المأمورين يرتبون اتكاء الجميع للطعام؛ و«يُجلسوا» عربية طبيعية تنقل الفعل السببي في السياق، وإن كانت لا تُظهر هيئة الاتكاء حرفيًا.
- source_word: πάντας
  choice: الجميع
  rationale: يدل على كل أفراد الجموع بوصفهم من سيُجلَسون، مع تمييزهم نحويًا عن الذين وُجّه إليهم الأمر.
- source_word: συμπόσια συμπόσια
  choice: جماعاتٍ جماعاتٍ
  rationale: يحافظ تكرار اللفظ العربي على التكرار اليوناني ودلالته التوزيعية، أي ترتيب الناس في مجموعات منفصلة للطعام.
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: على العشب الأخضر
  rationale: ترجمة مباشرة وطبيعية تصون وصف العشب بأنه أخضر أو نضر.
