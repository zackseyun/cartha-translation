  register: صياغة عربية فصحى واضحة ومهيبة. فُصل بين المخاطَبين بالأمر («هم»، أي التلاميذ في السياق) وبين «الجميع» الذين أُمروا أن يُجلسوهم، تجنبًا لطمس البنية النحوية اليونانية. استُعمل «يُجلِسوا» بدل «يتكئ الجميع» لإظهار هذا الفرق، مع بقاء سياق الجلوس للطعام مفهومًا.
