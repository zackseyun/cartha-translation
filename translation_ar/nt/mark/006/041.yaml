id: MRK.6.41
reference: Mark 6:41
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: ar
  text: وأخذ الأرغفة الخمسة والسمكتين، ورفع نظره نحو السماء، وبارك[a]، ثم كسر الأرغفة، وظلّ يعطيها لتلاميذه ليضعوها أمام الناس، وقسّم السمكتين بينهم جميعًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وشكر». الفعل اليوناني يعني حرفيًا «بارك»، وقد يتداخل مع معنى تقديم الشكر في سياق الطعام.'
    reason: بديل معجمي يحفظ المجال الدلالي للفعل في سياق الوجبة.
lexical_decisions:
- source_word: λαβὼν
  choice: وأخذ
  rationale: اسم الفاعل الأوريستي يفتتح تسلسل الأفعال؛ وصيغة الفعل المعطوف طبيعية في العربية وتحفظ تتابع الحدث.
- source_word: τοὺς πέντε ἄρτους
  choice: الأرغفة الخمسة
  rationale: ἄρτος هنا أشياء معدودة، لذلك «أرغفة» أدق من «خبز» المجرّد.
- source_word: τοὺς δύο ἰχθύας
  choice: السمكتين
  rationale: ترجمة مباشرة للمثنى المنصوب، مع الحفاظ على العدد الصريح.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ورفع نظره نحو السماء
  rationale: تعبير عربي طبيعي ينقل فعل النظر إلى أعلى والاتجاه نحو السماء.
- source_word: εὐλόγησεν
  choice: وبارك
  rationale: يحافظ على الفعل اليوناني «بارك» من غير تعيين مفعول غير مذكور صراحة؛ وقد يتداخل مع معنى الشكر في سياق الطعام.
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: ثم كسر الأرغفة
  rationale: ينقل الفعل ومفعوله الصريحين، و«ثم» توضح تعاقب الفعلين في عربية سليمة.
- source_word: ἐδίδου
  choice: وظلّ يعطيها
  rationale: «ظلّ يعطي» ينقل القيمة الاستمرارية أو التكرارية لصيغة الماضي الناقص أثناء التوزيع؛ والضمير يعود إلى الأرغفة.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: لتلاميذه
  rationale: يحفظ ضمير الملكية الصريح αὐτοῦ بإيجاز عربي طبيعي.
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: ليضعوها أمام الناس
  rationale: ينقل غرض ἵνα والصورة الملموسة في παρατίθημι. صُرّح بمرجع αὐτοῖς بوصفه الناس منعًا لالتباس الضمير العربي مع التلاميذ.
- source_word: ἐμέρισεν πᾶσιν
  choice: وقسّم ... بينهم جميعًا
  rationale: يحفظ معنى التقسيم أو التجزئة في ἐμέρισεν وشمول πᾶσιν، مع بيان أن الحصص وُزعت على الجميع.
theological_decisions:
- issue: معنى εὐλόγησεν في سياق الطعام
  choice: وبارك
  alternative: وشكر
  rationale: الفعل في النص هو εὐλογέω لا εὐχαριστέω؛ لذلك تحافظ «بارك» على الصياغة الأصلية والتوتر الدلالي، بينما تُذكر إمكانية معنى الشكر في الحاشية من غير حسم زائد.
- issue: المفعول المحذوف بعد «بارك»
  choice: إبقاء المفعول غير مذكور
  alternative: بارك الطعام / باركها
  rationale: اليونانية لا تذكر مفعولًا صريحًا، وإضافته قد تحسم هل البركة موجّهة إلى الله أم منطوقة على الطعام؛ لذا حُفظ الإبهام الأصلي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدم «الأرغفة» للأشياء المعدودة، و«ظلّ يعطي» لإظهار استمرار التوزيع، مع تجنب تعيين مفعول «بارك» الذي تركه النص اليوناني ضمنيًا.
