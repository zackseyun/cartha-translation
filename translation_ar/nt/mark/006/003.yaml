  source_fidelity: 'المتن يحفظ عناصر اليونانية الأساسية: «النجّار»، و«ابن مريم»، والأسماء بما فيها «يوسي»، والإخوة والأخوات، وحضور الأخوات «هنا معنا». لكن صياغة السؤال الثاني في المسودة («أما أخواته فهنا معنا؟») ناقصة الاستفهام على نحو قد تُقرأ معه خبرية، بينما اليونانية سؤال استنكاري صريح. كما أن «يعثرون بسببه» ممكنة حرفيًا، لكنها غير طبيعية في العربية الفصحى المعاصرة في هذا السياق وقد توحي بعثرة جسدية؛ المعنى السياقي هو أخذهم عليه/استياؤهم منه.'
