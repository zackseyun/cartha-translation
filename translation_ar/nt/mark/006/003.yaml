  terminology: «النجّار» اختيار جائز وراجح سياقيًا لـ τέκτων، مع بقاء اتساع اللفظ في الأصل معروفًا. «ابن مريم»، و«أخو»، و«أخواته» تحفظ الدلالة الظاهرة من دون حسم العلاقة العائلية. «يوسي» يحافظ على صيغة Ἰωσῆτος المميزة.
