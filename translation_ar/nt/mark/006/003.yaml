source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: ar
  text: أليس هذا هو النجّار، ابن مريم، وأخو يعقوب ويوسي ويهوذا وسمعان؟ أوليست أخواته[a] هنا معنا؟ وكانوا يأخذون عليه.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يُفهم «أخوه» و«أخواته» بمعنى أقرباء أو إخوة غير أشقاء؛ غير أن اللفظين اليونانيين يعنيان عادةً الإخوة والأخوات.
    reason: alternative_reading
  - marker: b
    text: 'أو: كانوا يستاؤون منه؛ وحرفيًا: كانوا يعثرون بسببه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: النجّار
  rationale: المعنى التقليدي والأرجح في السياق هو الحِرَفي الذي يعمل بالخشب، مع أن اللفظة اليونانية قد تتسع لمعنى الصانع أو البنّاء.
- source_word: υἱὸς τῆς Μαρίας
  choice: ابن مريم
  rationale: نقل مباشر يحفظ طريقة تعريف أهل البلدة بيسوع من جهة أمه، من غير تفسير ما قد تنطوي عليه العبارة اجتماعيًا.
- source_word: ἀδελφὸς / ἀδελφαὶ
  choice: أخو / أخواته
  rationale: هذا هو المعنى المعجمي المعتاد، مع إبقاء احتمال القرابة الأوسع أو الإخوة غير الأشقاء في الحاشية دون حسم الخلاف.
- source_word: Ἰωσῆτος
  choice: يوسي
  rationale: يحفظ صيغة الاسم اليونانية المميزة هنا بدل تسويتها إلى يوسف.
- source_word: ὧδε πρὸς ἡμᾶς
  choice: فهنا معنا
  rationale: صياغة عربية طبيعية تعبّر عن الحضور المحلي والاجتماعي بالقرب من المتكلمين.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: كانوا يعثرون بسببه
  rationale: يحفظ صورة العثرة الموجودة في الفعل اليوناني واستمرار رد الفعل في صيغة الماضي الناقص؛ والمقصود سياقيًا أنهم رفضوه أو استاؤوا منه.
theological_decisions:
- issue: صلة «الأخ» و«الأخوات» العائلية بيسوع
  choice: إبقاء «أخو» و«أخواته» في المتن بحسب الدلالة المعتادة
  alternative: أقرباؤه، أو إخوته غير الأشقاء
  rationale: لا يحسم النص اليوناني الجدل التقليدي بشأن كونهم إخوة من الأم، أو غير أشقاء، أو أقرباء؛ لذلك تُحفظ ألفاظ القرابة الظاهرة ويُذكر البديل في الحاشية.
- issue: الدلالة الاجتماعية لعبارة «ابن مريم»
  choice: نقل العبارة مباشرة بلا شرح تفسيري في المتن
  alternative: إبرازها كتسمية ازدرائية أو اعتبارها تعريفًا محايدًا
  rationale: قد تحمل العبارة نبرة اجتماعية خاصة، لكن النص لا يصرّح بها، فلا ينبغي إدخالها في الترجمة.
- issue: قوة فعل ἐσκανδαλίζοντο
  choice: كانوا يعثرون بسببه
  alternative: كانوا يستاؤون منه / رفضوه
  rationale: صيغة «يعثرون» تحفظ الاستعارة والالتباس الدلالي، بينما توضّح الحاشية المعنى السياقي المحتمل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. وُضعت علامتا الحاشيتين بعد الجملة ذات الصلة، مع الحفاظ على الاستفهام المتتابع ونبرة استنكار أهل البلدة.
