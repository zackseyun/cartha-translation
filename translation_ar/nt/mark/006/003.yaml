  - severity: medium
    issue: «وكانوا يعثرون بسببه» غير واضح اصطلاحيًا في العربية الحديثة.
    rationale: يحافظ على الاستعارة لفظيًا، لكنه قد يفهم كعثرة مادية. «وكانوا يأخذون عليه» ينقل المعنى السياقي لـ ἐσκανδαλίζοντο مع حفظ البديل الحرفي في الحاشية.
