base_translation:
  language: en
  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: ar
  text: أمّا هيروديا فكانت تضمر له الحقد، وأرادت أن تقتله، لكنها لم تستطع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: أمّا ... فـ
  rationale: تُبرز الانتقال مع معنى المقابلة في السياق، بصياغة عربية طبيعية.
- source_word: Ἡρῳδιὰς
  choice: هيروديا
  rationale: نقل الاسم الشخصي إلى العربية وفق الصيغة الكتابية العربية الشائعة.
- source_word: ἐνεῖχεν αὐτῷ
  choice: كانت تضمر له الحقد
  rationale: ينقل التعبير الاصطلاحي الدال على عداوة وضغينة مستمرتين، كما يحفظ الفعل الناقص معنى الاستمرار.
- source_word: ἤθελεν
  choice: أرادت
  rationale: ترجمة مباشرة وطبيعية للرغبة أو القصد في هذا السياق، من غير إضافة دلالة غير مصرّح بها.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: أن تقتله
  rationale: صياغة مباشرة تحفظ معنى القتل من غير إضافة توصيف قانوني أو أخلاقي مثل الاغتيال أو القتل عمدًا.
- source_word: καὶ οὐκ ἠδύνατο
  choice: لكنها لم تستطع
  rationale: تؤدي الواو هنا معنى الاستدراك السياقي بعد ذكر إرادتها قتله، وتحفظ عدم القدرة بصياغة عربية واضحة.
theological_decisions: []
