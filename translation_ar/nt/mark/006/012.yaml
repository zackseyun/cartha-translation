lexical_decisions:
- source_word: Καὶ
  choice: فـ
  rationale: فاء السرد تصل الآية بما قبلها وتحافظ على انسياب الرواية من غير إثقال العبارة بحرف عطف مستقل.
- source_word: ἐξελθόντες
  choice: خرجوا
  rationale: تحويل اسم الفاعل الماضي إلى فعل ماضٍ معطوف طبيعي في العربية، مع بقاء الخروج سابقًا للنداء في تسلسل الحدث.
- source_word: ἐκήρυξαν
  choice: نادوا
  rationale: يفيد النداء العلني الموجَّه إلى الناس ويحفظ قوة κηρύσσω، من غير قصر المعنى على الوعظ الكنسي.
- source_word: ἵνα
  choice: بأن
  rationale: تقدّم مضمون النداء هنا في عربية طبيعية، مع إمكان فهم العبارة على أنها دعوة إلى الاستجابة المقصودة.
- source_word: μετανοῶσιν
  choice: يتوب
  rationale: «يتوب» هو المقابل العربي الموجز الراسخ الذي يشمل تغيّر الفكر والاتجاه والرجوع، ولا يختزل الفعل في مجرد تغيير الرأي.
theological_decisions:
- issue: تعيين الفاعل المستتر في μετανοῶσιν
  choice: بأن يتوب الناس
  alternative: بأن يتوبوا
  rationale: الفاعل المفهوم هو سامعو النداء، لا التلاميذ. وذكر «الناس» يزيل احتمال عود الضمير على التلاميذ من غير إضافة مضمون عقائدي.
- issue: دلالة ἵνα بعد فعل النداء
  choice: 'عرضها بوصفها مضمون النداء: «بأن»'
  alternative: 'غرض النداء: «لكي يتوب الناس»'
  rationale: يحتمل التركيب صلة الغرض أو المضمون؛ والصياغة المختارة طبيعية وتبقي التركيز على الدعوة التي أعلنوها من غير حسم زائد.
