    rationale: الضمير أو الرابط المقابل لـ«هو» ليس موجودًا في النص اليوناني. كما أن اقتراح «إنه أنا» يشرح الفهم السياقي المحتمل، لكنه لا يحتاج إلى حاشية في هذا الموضع ولا يظهر في مسار التدقيق الإنجليزي. حذف الحاشية يمنع إيهام القارئ بدقة حرفية غير موجودة ويحافظ على غموض العبارة.
