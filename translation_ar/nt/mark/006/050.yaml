  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: ar
  text: 'لِأَنَّهُمْ جَمِيعًا رَأَوْهُ فَاضْطَرَبُوا. وَفِي الْحَالِ كَلَّمَهُمْ وَقَالَ لَهُمْ: «تَشَجَّعُوا! أَنَا هُوَ؛ لَا تَخَافُوا».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: اضطربوا
  rationale: ينقل معنى الاضطراب والخوف الشديد من غير إضافة تفسير غير وارد في النص.
- source_word: Θαρσεῖτε
  choice: تشجّعوا
  rationale: صيغة أمر طبيعية وواضحة تعبّر عن استعادة الشجاعة والثقة.
- source_word: ἐγώ εἰμι
  choice: أنا هو
  rationale: يحافظ على الصياغة اليونانية المقتضبة وعلى احتمال فهمها بوصفها تعريفًا عاديًا بالهوية أو عبارة ذات صدى لاهوتي، من غير حسم أحد الوجهين.
- source_word: μὴ φοβεῖσθε
  choice: لا تخافوا
  rationale: مقابل عربي مباشر وطبيعي للنهي اليوناني.
theological_decisions:
- issue: دلالة ἐγώ εἰμι
  choice: أنا هو
  alternative: إنه أنا / أنا موجود
  rationale: «أنا هو» تحفظ التوتر بين المعنى السياقي «إنه أنا» والصدى المحتمل لعبارة «أنا هو»، ولا توسّعها إلى تصريح ميتافيزيقي صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم الماضي في السرد العربي بدل المضارع التاريخي اليوناني لتكون العبارة طبيعية، مع إبقاء سرعة الحدث في «في الحال».
