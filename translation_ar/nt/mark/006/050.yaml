  source_fidelity: 'النص يترجم عناصر الآية الأساسية بأمانة: الرؤية الجماعية، الاضطراب، المبادرة الفورية بالكلام، وأوامر التشجيع وعدم الخوف. وتعبير «أنا هو» يحافظ، بقدر ما تسمح به العربية، على إيجاز ἐγώ εἰμι وعلى عدم حسم دلالته فوق ما يقتضيه السياق.'
  naturalness: الصياغة فصيحة وواضحة. وتقديم «في الحال» إلى «وفي الحال كلّمهم» يجعل تعلّق الظرف بالفعل أوضح وأقرب إلى سلاسة العربية الحديثة.
