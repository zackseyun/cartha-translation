revisions:
- from: وحيثما كان يدخل قرى أو مدنًا أو أريافًا، كانوا يضعون المرضى في الساحات العامة، ويتوسلون إليه أن يسمح لهم بأن يلمسوا ولو هدب ثوبه[a]؛ وكل من لمسه كان يُشفى[b].
  to: وحيثما كان يدخل قرى أو مدنًا أو أريافًا، كانوا يضعون المرضى في الأسواق[a]، وكانوا يتوسلون إليه أن يلمسوا ولو هدب ثوبه[b]؛ وكل من لمسه كان يُشفى.
  rationale: حُذفت الإضافة التفسيرية «أن يسمح لهم» لأنها ليست في النص اليوناني، واستُبدلت «الساحات العامة» بـ«الأسواق» لمطابقة ἀγοραί مع حفظ البديل في الحاشية. كما جُعلت أفعال التكرار في السياق متوازية، وصُححت صياغة المعنى الحرفي في الحاشية لتلائم صيغة الفعل اليوناني. أُبقيت إحالة «لمسه» إلى يسوع، وهي الإحالة النحوية في αὐτοῦ، مع أن السياق السابق يحدد اللمس بأنه للهدب.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:57Z'
