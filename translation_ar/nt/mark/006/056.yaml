  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: ar
  text: وحيثما كان يدخل قرى أو مدنًا أو أريافًا، كانوا يضعون المرضى في الأسواق[a]، وكانوا يتوسلون إليه أن يلمسوا ولو هدب ثوبه[b]؛ وكل من لمسه كان يُشفى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «في الساحات العامة». فاللفظة اليونانية قد تدل على السوق أو ساحة البلدة العامة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «طرف ثوبه» أو «حاشية ثوبه» أو «شرّابة ثوبه». فاللفظة اليونانية قد تدل على طرف الثوب أو حاشيته، وقد تستحضر في السياق اليهودي شرّابات الثوب. وحرفيًا في العبارة الأخيرة: «كانوا يُخلَّصون» أو «كانوا يُنقَذون»؛ ويشير الفعل هنا، في سياق المرض، إلى الشفاء واستعادة العافية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν εἰσεπορεύετο
  choice: وحيثما كان يدخل
  rationale: تنقل «حيثما» معنى التعميم في ὅπου ἂν، ويحفظ تركيب «كان يدخل» دلالة الفعل الناقص على التكرار المعتاد.
- source_word: κώμας ἢ πόλεις ἢ ἀγρούς
  choice: قرى أو مدنًا أو أريافًا
  rationale: تفيد ἀγρούς هنا المناطق الريفية في مقابل القرى والمدن، لا حقولًا منفردة بالضرورة.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: في الساحات العامة
  rationale: قد تدل ἀγορά على السوق أو الساحة العامة؛ والسياق يركز على المكان العام الذي كان المرضى يوضعون فيه.
- source_word: ἐτίθεσαν τοὺς ἀσθενοῦντας
  choice: كانوا يضعون المرضى
  rationale: يحفظ «كانوا يضعون» دلالة الفعل الناقص على الفعل المتكرر، و«المرضى» ترجمة طبيعية للمشار إليه بالمشاركة τοὺς ἀσθενοῦντας.
- source_word: παρεκάλουν αὐτὸν
  choice: ويتوسلون إليه
  rationale: يعبر «يتوسلون» عن شدة الالتماس في هذا السياق، مع استمرار الطابع التكراري للفعل الناقص.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: أن يسمح لهم بأن يلمسوا ولو
  rationale: تؤدي «ولو» معنى الحد الأدنى أو الاكتفاء بمجرد اللمس في κἂν؛ وإضافة «أن يسمح لهم» توضح طبيعيًا في العربية مضمون التوسل من غير تغيير المقصود.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: هدب ثوبه
  rationale: «هدب» يبقي احتمال حافة الثوب أو طرفه المهدب، وقد يلمح إلى الشرّابة اليهودية من غير أن يحسمها.
- source_word: ὅσοι ἂν ἥψαντο αὐτοῦ
  choice: كل من لمسه
  rationale: الضمير اليوناني αὐτοῦ يعود نحويًا إلى يسوع، ولذلك تُرجمت العبارة «لمسه» مع بقاء كيفية اللمس واضحة من ذكر هدب ثوبه قبلها مباشرة.
- source_word: ἐσῴζοντο
  choice: كان يُشفى
  rationale: للفعل σῴζω مدى يشمل الخلاص والإنقاذ والشفاء، لكن سياق المرض واللمس يجعل الشفاء الجسدي هو المعنى المباشر، مع توثيق المعنى الحرفي الأوسع في الحاشية.
theological_decisions:
- issue: دلالة ἐσῴζοντο من الفعل σῴζω
  choice: كان يُشفى
  alternative: كان يَخلُص / كان يُنقذ
  rationale: السياق المباشر يتناول المرضى وشفاءهم، فلا ينبغي تحميل العبارة وحدها معنى خلاص عقائدي محدد؛ ومع ذلك تُحفظ السعة الدلالية للفعل في الحاشية.
- issue: مرجع αὐτοῦ في ἥψαντο αὐτοῦ
  choice: لمسه
  alternative: لمس هدب ثوبه
  rationale: يحافظ «لمسه» على المرجع النحوي الصريح إلى يسوع، بينما يبين السياق السابق أن اللمس المقصود كان عبر هدب ثوبه، فلا يلزم استبدال الضمير بمرجع أكثر تحديدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الساحات العامة» بدل اللفظ التجاري المحض لأن ἀγορά قد تعني ساحة البلدة العامة، وحُفظ التكرار السردي بصيغة «كان». جميع علامات الحواشي مثبتة في المتن.
