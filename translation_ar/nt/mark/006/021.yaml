lexical_decisions:
- source_word: Καὶ γενομένης ἡμέρας εὐκαίρου
  choice: ولمّا جاء يومٌ مؤاتٍ
  rationale: تنقل العبارة المطلقة في حالة المضاف إليه بوصفها ظرفًا للسرد، وتحفظ معنى εὔκαιρος بوصفه يومًا مناسبًا أو مواتيًا للفرصة المرتقبة، مع وصل مرقسي طبيعي.
- source_word: ὅτε
  choice: مُضمَّنة في الصياغة الظرفية «ولمّا»
  rationale: تشرح الجملة التالية ما جعل ذلك اليوم مؤاتيًا. دمج الرابطين الزمنيين في تركيب عربي واحد يتجنب التكرار الثقيل من غير حذف العلاقة الزمنية.
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: في عيد ميلاده
  rationale: γενέσια تدل على مناسبة عيد الميلاد أو الاحتفال به، وهذه صياغة عربية واضحة ومألوفة.
- source_word: δεῖπνον ἐποίησεν
  choice: أقام ... مأدبةً
  rationale: ينقل التعبير الاصطلاحي، الحرفي «صنع عشاءً»، إلى عربية طبيعية تدل على وليمة رسمية يلائمها ذكر كبار المدعوين.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: لعظمائه
  rationale: μεγιστᾶνες هم أصحاب المنزلة الرفيعة المحيطون به؛ و«عظماؤه» تحفظ دلالة المكانة والانتساب إليه دون حصرهم في لقب إداري بعينه.
- source_word: τοῖς χιλιάρχοις
  choice: وقادة جيشه
  rationale: توضح الوظيفة العسكرية لكبار الضباط من غير فرض اللقب الروماني التقني «قواد الألوف» على السياق الهيرودي.
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: ووجهاء الجليل
  rationale: تعبر «وجهاء» عن الرجال البارزين ذوي المرتبة الأولى في الإقليم، بصياغة عربية طبيعية تحفظ دلالة الوجاهة الاجتماعية.
- source_word: Ἡρῴδης
  choice: هيرودس
  rationale: النقل العربي الشائع للاسم.
