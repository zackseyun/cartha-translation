  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: ar
  text: 'فلما سمع هيرودس، قال[a]: «يوحنا الذي قطعتُ رأسه، هو نفسه قد أُقيم[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان يقول» أو «ظل يقول»؛ فالفعل اليوناني بصيغة الماضي الناقص، وقد يفيد الاستمرار أو التكرار.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قام». وصيغة الفعل اليوناني مبنية للمجهول: «أُقيم».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: فلما سمع
  rationale: نُقلت صيغة اسم الفاعل الأوريستي بعلاقة زمنية طبيعية في العربية، من غير إثقال العبارة بترجمة حرفية مثل «إذ كان قد سمع».
- source_word: δὲ
  choice: فـ
  rationale: تفيد الأداة انتقالًا سرديًا خفيفًا، وتؤديه الفاء هنا بطلاقة مع تركيب «لما»، من غير تحميلها معنى تضاد قوي لا يوجبه السياق.
- source_word: ἔλεγεν
  choice: قال
  rationale: هذه صيغة ماضٍ ناقص قد تدل على قول مستمر أو متكرر، لكن «قال» أنسب للسرد العربي؛ وأُثبت الاحتمال الآخر في الحاشية.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: يوحنا الذي قطعتُ رأسه
  rationale: أُعيد ترتيب البنية اليونانية المتقدمة المفعول لتوافق الأسلوب العربي الطبيعي، مع الحفاظ على المعنى الصريح للفعل وعلى إسناد الفعل إلى هيرودس بضمير المتكلم.
- source_word: οὗτος
  choice: هذا هو الذي
  rationale: يحفظ هذا التعبير قوة اسم الإشارة والتوكيد في اليونانية بدل تسويته إلى مجرد ضمير «هو».
- source_word: ἠγέρθη
  choice: أُقيم
  rationale: يحافظ المبني للمجهول على صيغة الفعل اليوناني، ويترك فاعل الإقامة غير مصرح به كما في النص.
theological_decisions:
- issue: صياغة ἠγέρθη في سياق القيامة من الموت
  choice: أُقيم
  alternative: قام
  rationale: المبني للمجهول هو المطابق لصيغة اليونانية، فلا يُحوَّل كلام هيرودس إلى صيغة فعلية لازمة قد تُضعف التوتر الدلالي أو توحي بتفسير أكثر تحديدًا مما يقوله النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. وُضع رمز الحاشية [a] بعد «قال» لأنه يشرح صيغة ἔλεγεν، ووُضع [b] بعد «أُقيم» لأنه يشرح صيغة ἠγέρθη. حافظت العبارة «هذا هو الذي» على توكيد οὗτος مع بقاء الكلام طبيعيًا ومفهومًا.
