revisions:
- from: وَأَيُّ مَكَانٍ لَا يَقْبَلُكُمْ وَلَا يَسْمَعُ لَكُمْ، فَعِنْدَمَا تَخْرُجُونَ مِنْ هُنَاكَ، انْفُضُوا التُّرَابَ الَّذِي تَحْتَ أَقْدَامِكُمْ شَهَادَةً عَلَيْهِمْ.[a][b]
  to: وَأَيُّ مَكَانٍ لَا يَسْتَقْبِلُكُمْ أَهْلُهُ وَلَا يُصْغُونَ إِلَيْكُمْ، فَعِنْدَمَا تَخْرُجُونَ مِنْ هُنَاكَ، انْفُضُوا التُّرَابَ مِنْ تَحْتِ أَقْدَامِكُمْ[b] شَهَادَةً لَهُمْ[a].
  rationale: يقدّم المتن الدلالة النحوية المباشرة لـαὐτοῖς («لهم») ويحفظ الفهم السلبي السياقي في الحاشية، من غير تقريره بوصفه المعنى الوحيد. كما عولجت السلاسة العربية بإظهار «أهل» المكان بوصفهم الفاعل المقصود، واستبدال «يسمع لكم» بـ«يصغون إليكم».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'تحتاج العبارة الأخيرة إلى تعديل: αὐτοῖς داتيف بمعنى «لهم/إليهم»، ولا يصرّح النص اليوناني بـ«عليهم». ويجوز فهمها في السياق فهمًا سلبيًا، لكن ينبغي إبقاء ذلك في الحاشية بدل إدخاله في المتن. كذلك فإن إسناد «يقبل» و«يسمع» مباشرة إلى «مكان» غير طبيعي في العربية، مع أن اليونانية تستعمل «مكان» استعمالًا مجازيًا ثم تنتقل إلى فعل جمع.'
  naturalness: «لا يسمع لكم» مفهومة، لكنها أقل سلاسة وأقل دقة في الدلالة المقصودة من «لا يصغون إليكم». وصياغة «لا يستقبلكم أهله ولا يصغون إليكم» عربية فصيحة واضحة وتحفظ الإحالة السياقية إلى سكان المكان. و«من تحت أقدامكم» أنسب مع فعل «انفضوا».
  terminology: «يستقبلكم» مناسب لـδέξηται في هذا السياق، و«يصغون إليكم» مناسب لـἀκούσωσιν ὑμῶν دون تحميله معنى الطاعة. وتُترجم εἰς μαρτύριον αὐτοῖς في المتن «شهادةً لهم»، مع تسجيل الفهم السياقي «عليهم» بديلًا في الحاشية.
  issues:
  - severity: medium
    issue: ترجمة αὐτοῖς بـ«عليهم» في المتن
    rationale: لا يحتوي الأصل على مقابل صريح لـ«ضد/على»، والداتيف يسمح بترجمة «لهم». الفهم المعاكس محتمل سياقيًا، لكنه تفسير ينبغي حفظه في حاشية.
  - severity: medium
    issue: إسناد الاستقبال والإصغاء إلى «مكان» في العربية
    rationale: التركيب «مكان لا يقبلكم ولا يسمع لكم» غير طبيعي، ولا سيما مع «يسمع لكم». ذكر «أهله» يوضح الفاعل الضمني الذي يظهر في الفعل اليوناني الجمع ἀκούσωσιν، من دون تغيير المعنى.
  - severity: low
    issue: موضع علامتي الحاشية
    rationale: ينبغي أن تتصل علامة القراءة البديلة بعبارة «شهادةً لهم»، وأن تتصل الملاحظة الثقافية بفعل نفض التراب.
