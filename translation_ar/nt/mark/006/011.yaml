  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: ar
  text: وَأَيُّ مَكَانٍ لَا يَسْتَقْبِلُكُمْ أَهْلُهُ وَلَا يُصْغُونَ إِلَيْكُمْ، فَعِنْدَمَا تَخْرُجُونَ مِنْ هُنَاكَ، انْفُضُوا التُّرَابَ مِنْ تَحْتِ أَقْدَامِكُمْ[b] شَهَادَةً لَهُمْ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شهادةً عليهم». والعبارة اليونانية أقرب إلى الحرفية في معنى «شهادةً لهم»، غير أن السياق قد يفهمها شهادةً سلبية على الذين يرفضون الرسالة.'
    reason: alternative_reading
  - marker: b
    text: كان نفض التراب عن القدمين فعلًا رمزيًّا يدل على المفارقة والإنذار استجابةً للرفض.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: أَيُّ مَكَانٍ
  rationale: تركيب يفيد العموم وعدم التعيين، ويحافظ على الاسم المفرد τόπος بصياغة عربية طبيعية.
- source_word: μὴ δέξηται ὑμᾶς
  choice: لَا يَقْبَلُكُمْ
  rationale: يحفظ المعنى الواسع للفعل، الذي يشمل هنا استقبال الرسل وقبولهم، من غير حصره صراحة في الضيافة.
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: وَلَا يَسْمَعُ لَكُمْ
  rationale: يفيد الإصغاء والاستجابة لكلامهم، لا مجرد وصول الصوت إلى الأذن، مع تجنب التفسير الأقوى «يطيعكم».
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: فَعِنْدَمَا تَخْرُجُونَ مِنْ هُنَاكَ
  rationale: يجعل دلالة اسم الفاعل الظرفية الزمنية واضحة، ويحافظ على ترتيب الحدث بصياغة عربية سهلة.
- source_word: ἐκτινάξατε
  choice: انْفُضُوا
  rationale: هو المقابل العربي الطبيعي لفعل إزالة الغبار بالهز أو النفض.
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: التُّرَابَ الَّذِي تَحْتَ أَقْدَامِكُمْ
  rationale: ترجمة قريبة من بنية اليونانية وواضحة للقارئ العربي المعاصر.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: شَهَادَةً عَلَيْهِمْ
  rationale: السياق يجعل الشهادة ذات قوة سلبية تجاه الرافضين، لكن اليونانية تحتمل حرفيًا «لهم»، ولذلك أُثبت البديل في الحاشية.
theological_decisions:
- issue: دلالة نفض التراب وقوة عبارة εἰς μαρτύριον αὐτοῖς
  choice: فعل رمزي يحمل شهادة إنذار على الذين يرفضون الرسل ورسالتهم
  alternative: «شهادةً لهم» بصياغة أقل تصريحًا بالحكم، أو علامة انفصال في المقام الأول
  rationale: سياق الرفض يرجّح القوة السلبية لعبارة الشهادة، لكن صيغة αὐτοῖς لا تحتوي في ذاتها على حرف جر يوناني بمعنى «ضد»، لذا تُحفظ مساحة الالتباس في الحاشية ولا تُجعل دلالة الدينونة هي الاحتمال الوحيد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «يسمع لكم» للدلالة على الإصغاء من غير تحميل الفعل معنى الطاعة الصريحة، و«انفضوا» بوصفه التعبير العربي المألوف عن إزالة التراب. وُضعت علامتا الحاشية بعد العبارة الختامية لأن الأولى تشرح معنى الشهادة والثانية تشرح الفعل الرمزي كله.
