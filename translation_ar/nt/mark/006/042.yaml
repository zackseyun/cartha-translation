  text: And they all ate and were satisfied.
translation:
  language: ar
  text: فَأَكَلُوا جَمِيعًا وَشَبِعُوا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: أكلوا
  rationale: فعل ماضٍ بسيط ينقل المعنى العادي للفعل ἐσθίω من غير إضافة مفعول غير مذكور، ولا يضمّن معنى الشبع الذي يرد في الفعل التالي.
- source_word: πάντες
  choice: جميعًا
  rationale: حال تفيد شمول كل أفراد الجمع المشار إليه في السياق، وهي صياغة عربية طبيعية تحافظ على النطاق الكلي.
- source_word: ἐχορτάσθησαν
  choice: شبعوا
  rationale: ينقل نتيجة الأكل حتى الاكتفاء بعبارة عربية مألوفة ودقيقة؛ وصيغة الفعل اليوناني المبنية للمجهول ذات دلالة حالية/نتيجية لا يلزم تمثيل بنائها حرفيًا في العربية.
- source_word: καὶ ... καὶ
  choice: فَـ... وَ...
  rationale: الفاء في بداية الآية تصل الحدث طبيعيًا بما قبله في السرد العربي، والواو تنسق بين الأكل والشبع، مع الحفاظ على أسلوب مرقس المتتابع من غير تحميل الرابط معنى زائدًا.
