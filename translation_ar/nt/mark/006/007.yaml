  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: ar
  text: ودعا الاثني عشر، وبدأ يرسلهم اثنين اثنين[a]، وكان يعطيهم سلطانًا على الأرواح النجسة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: في أزواج.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: قدرةً على الأرواح النجسة.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεῖται
  choice: دعا
  rationale: الفعل مضارع تاريخي في السرد المرقسي، لكن صيغة الماضي العربية أنسب لتتابع السرد مع «بدأ» من غير فقدان المعنى.
- source_word: τοὺς δώδεκα
  choice: الاثني عشر
  rationale: يحافظ على اللقب المعروف لجماعة تلاميذ يسوع من غير إضافة «التلاميذ»، وهي غير مذكورة صراحة في النص.
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: بدأ يرسلهم
  rationale: ينقل تركيب البدء مع المصدر نقلًا طبيعيًا واضحًا، مع إبقاء معنى الإرسال في مهمة.
- source_word: δύο δύο
  choice: اثنين اثنين
  rationale: يحافظ على التكرار التوزيعي وإيقاع الأصل، ومعناه أنهم أُرسلوا في أزواج.
- source_word: ἐδίδου
  choice: كان يعطيهم
  rationale: ينقل دلالة الماضي الناقص على فعل جارٍ أو متكرر بالتزامن مع الإرسال.
- source_word: ἐξουσίαν
  choice: سلطانًا
  rationale: «سلطان» تعبر عن صلاحية وقدرة ممنوحة، لا عن القوة المجردة وحدها، وهي ملائمة للسياق الكتابي والعربية المعاصرة الفصيحة.
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: على الأرواح النجسة
  rationale: ترجمة مباشرة تحفظ مصطلح مرقس ولا تستبدله بالتفسير الأضيق «الشياطين».
theological_decisions:
- issue: طبيعة ما منحه يسوع للاثني عشر في ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: سلطانًا على الأرواح النجسة
  alternative: قدرةً على الأرواح النجسة
  rationale: «سلطان» يحفظ معنى التفويض والصلاحية لمواجهة الأرواح النجسة، مع اشتماله في السياق على القدرة الفعلية، بدل اختزال اللفظ في القوة وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الماضي في «دعا» لتماسك السرد العربي، مع إبقاء جانب الاستمرار في «كان يعطيهم». حُفظ التعبير التوزيعي «اثنين اثنين» ومصطلح «الأرواح النجسة» كما في الأصل.
