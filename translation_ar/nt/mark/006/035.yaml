  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: ar
  text: 'ولمّا كان الوقت قد صار متأخرًا جدًا، فتقدّم إليه تلاميذه وقالوا: «المكان مقفر، وقد صار الوقت متأخرًا جدًا.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: قد
  rationale: تفيد أن الوقت بلغ بالفعل مرحلة متأخرة، وتؤدي «قد» هذا المعنى طبيعيًا مع الفعل الماضي في الموضع الثاني، بينما يُفهم التقدم الزمني من تركيب الموضع الأول.
- source_word: ὥρας πολλῆς γενομένης
  choice: لمّا صار الوقت متأخرًا جدًا
  rationale: ينقل تركيب الحال بالمضاف إليه معنى حلول وقت متأخر من النهار بصياغة عربية واضحة، وتحفظ «جدًا» قوة πολλῆς في السياق.
- source_word: προσελθόντες αὐτῷ
  choice: دنا منه
  rationale: تعبير عربي موجز وطبيعي يدل على الاقتراب منه دون إضافة معنى زائد.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: صياغة عربية فصيحة ومباشرة للملكية.
- source_word: ἔλεγον
  choice: قالوا
  rationale: الماضي الناقص اليوناني يصور الحدث في مجراه، لكن العربية السردية تؤديه طبيعيًا بالماضي البسيط هنا؛ ولا يثبت السياق تكرار القول بما يسوغ «ظلوا يقولون».
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: المكان مقفر
  rationale: «مقفر» يدل على مكان خالٍ من السكان أو العمران، وهو المقصود هنا، دون الإيحاء العاطفي المحتمل في ألفاظ مثل «موحش».
- source_word: καὶ ἤδη ὥρα πολλή
  choice: وقد تأخر الوقت جدًا
  rationale: صياغة عربية مألوفة تحفظ معنى أن ساعة متأخرة قد حلت بالفعل، وتنقل توكيد πολλή بلفظ «جدًا».
theological_decisions: []
