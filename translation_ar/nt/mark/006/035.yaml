  register: عربية فصحى حديثة، واضحة ووقورة، مع تفضيل السرد الطبيعي على المحاكاة الحرفية لتركيب الحال اليوناني. لم تُضف حاشية لأن البدائل المذكورة أسلوبية ولا تكشف غموضًا جوهريًا في النص؛ كما أن حاشيتي الطبقة الإنجليزية تبدوان متبادلتين موضعًا.
