source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: ar
  text: 'فأجاب وقال لهم: «أعطوهم أنتم ما يأكلون». فقالوا له: «أنذهب فنشتري خبزًا[a] بمئتي دينار[b]، ونعطيهم إياه ليأكلوا؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أرغفة». يمكن أن تعني الكلمة اليونانية ἄρτους «خبزًا» أو «أرغفة خبز».
    reason: lexical_alternative
  - marker: b
    text: كان الدينار أجرَ يومِ عملٍ معتادٍ لعامل أو جندي.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجاب وقال
  rationale: يحافظ على الاقتران السردي بين الفعلين في اليونانية، مع بقاء العبارة مفهومة وفصيحة بالعربية.
- source_word: Δότε ... ὑμεῖς
  choice: أعطوهم أنتم
  rationale: يحافظ على فعل الأمر المباشر، ويُظهر توكيد الضمير الصريح ὑμεῖς بوضع «أنتم» بعد المفعول به.
- source_word: φαγεῖν
  choice: ما يأكلون / ليأكلوا
  rationale: تؤدي الصياغتان وظيفة المصدر اليوناني بصورة طبيعية بحسب السياق العربي، من غير اختزاله إلى مجرد «أطعموهم».
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: أنذهب فنشتري
  rationale: تنقل صيغة السؤال التشاوري في الفعل اليوناني، وتجعل الذهاب تابعًا عمليًا للشراء كما يقتضي التركيب.
- source_word: δηναρίων διακοσίων
  choice: بمئتي دينار
  rationale: الباء العربية تعبّر بوضوح عن الثمن الذي يدل عليه تركيب الإضافة في اليونانية.
- source_word: ἄρτους
  choice: خبزًا
  rationale: «خبزًا» تعبير عربي طبيعي عن الطعام المشترى هنا، مع إثبات احتمال معنى «أرغفة» في الحاشية.
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: ونعطيهم إياه ليأكلوا
  rationale: يحافظ على تكرار فعل «أعطى» وعلى صلته بأمر يسوع، ويجعل عائد الضمير إلى الخبز واضحًا.
