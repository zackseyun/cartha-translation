base_translation:
  language: en
  yaml_path: translation/nt/mark/006/044.yaml
  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: ar
  text: وكان الذين أكلوا الأرغفة خمسة آلاف رجل.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اليونانية «رجال»، أي إن اللفظ هنا خاص بالذكور، وليس لفظًا عامًا بمعنى «أشخاص».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: كان
  rationale: يؤدي فعل الكينونة الناقص هنا وظيفة الرابط في بيان عدد الآكلين، من غير إضافة معنى «بلغ عددهم» غير المصرح به.
- source_word: οἱ φαγόντες
  choice: الذين أكلوا
  rationale: ترجمة واضحة وطبيعية لاسم الفاعل الماضي المعرّف، وتحدد الجماعة بالفعل المكتمل من غير المبالغة بترجمته إلى صيغة ماضٍ أسبق.
- source_word: τοὺς ἄρτους
  choice: الأرغفة
  rationale: يحفظ الجمع والإشارة إلى الأرغفة المحددة في رواية الإطعام، بدل التعبير الأعم «الخبز».
- source_word: πεντακισχίλιοι
  choice: خمسة آلاف
  rationale: نقل مباشر ودقيق للعدد.
- source_word: ἄνδρες
  choice: رجل
  rationale: اللفظ اليوناني خاص بالرجال لا بالناس عمومًا، وتأتي «رجل» مفردةً تمييزًا للعدد المركب «خمسة آلاف» في العربية.
theological_decisions:
- issue: دلالة لفظ العد من جهة الجنس
  choice: ترجمة ἄνδρες بـ«رجل» في المتن.
  alternative: شخص / إنسان
  rationale: يحافظ هذا على تخصيص اللفظ اليوناني للذكور، ولا يحوّل العدد المذكور إلى عدد عام لجميع الأشخاص.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموجزة. اختير «الأرغفة» لحفظ صورة الجمع في سياق المعجزة، وحُفظ تخصيص «الرجال» بتمييز العدد «رجل». أُدرجت علامة الحاشية [a] في المتن.
