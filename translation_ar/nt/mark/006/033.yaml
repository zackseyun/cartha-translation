base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: ar
  text: رآهم كثيرون وهم ذاهبون، فتعرّفوا إليهم، فركضوا على الأقدام[a] من جميع المدن[b] إلى هناك وسبقوهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «برًّا»، لإبراز المقابلة مع الرحلة في القارب.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «البلدات»؛ فاللفظة اليونانية قد تشير إلى مدن أو بلدات بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: رآهم
  rationale: ينقل الإدراك البصري المباشر في تسلسل السرد دون إضافة معنى زائد.
- source_word: ὑπάγοντας
  choice: وهم ذاهبون
  rationale: يحافظ على دلالة اسم الفاعل وعلى عمومية فعل الذهاب، بينما يبيّن السياق السابق أنهم كانوا في القارب.
- source_word: ἐπέγνωσαν
  choice: عرفوهم
  rationale: المقصود في السياق أنهم تعرفوا إليهم وأدركوا هويتهم، لا أنهم اكتسبوا معرفة عامة جديدة.
- source_word: πολλοί
  choice: كثيرون
  rationale: صفة مستعملة استعمال الاسم، وصياغتها العربية موجزة وطبيعية.
- source_word: πεζῇ
  choice: سيرًا على الأقدام
  rationale: يبرز الانتقال برًا على الأقدام في مقابل رحلة القارب، ويأتي طبيعيًا مع فعل الإسراع.
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: من جميع المدن
  rationale: πόλις قد تدل على مدينة أو بلدة؛ اختير «المدن» بوصفه المقابل العربي المعتاد، مع إثبات البديل في الحاشية.
- source_word: συνέδραμον
  choice: فأسرعوا ... وتوافدوا
  rationale: الفعل المركب يدل على الجري أو الإسراع مع التقاطر والاجتماع؛ توزّع المعنى في العربية على عبارتين طبيعيتين لتجنّب تركيب متكلّف.
- source_word: ἐκεῖ
  choice: إلى هناك
  rationale: ينقل الإشارة المكانية الموجزة بوضوح.
- source_word: προῆλθον αὐτούς
  choice: وسبقوهم
  rationale: يفيد أنهم تقدّموا عليهم ووصلوا قبلهم؛ «سبقوهم» موجزة وتحفظ المقارنة.
