  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: ar
  text: وإذ رآهم يجهدون في التجديف، لأن الريح كانت معاكسة لهم، جاء إليهم نحو الهزيع الرابع من الليل[a]، ماشيًا على البحر[b]، وكان يريد أن يمرّ بهم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الهزيع الرابع هو الجزء الأخير من الليل بحسب التقسيم الروماني، أي نحو الساعة الثالثة إلى السادسة صباحًا.
    reason: cultural_note
  - marker: b
    text: 'يمكن أيضًا: «ماشيًا على الماء». واللفظ اليوناني هو «البحر».'
    reason: lexical_alternative
  - marker: c
    text: 'قد تعني عبارة «أن يمرّ بهم» أنه أراد أن يتجاوزهم، وقد تلمّح أيضًا إلى مشاهد في العهد القديم «يمرّ» فيها الله في سياق إعلان ذاته (مثل الخروج 33: 19، 22؛ 34: 6؛ والملوك الأول 19: 11).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: وإذ رآهم
  rationale: يحافظ على الصلة الظرفية وتدفّق السرد من غير حسم زائد لترتيب الحدث.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: يجهدون في التجديف
  rationale: صياغة عربية طبيعية تنقل شدة معاناتهم في محاولة التجديف، من غير استعمال تعبير حرفي موهم مثل «يُعذَّبون».
- source_word: ἐναντίος αὐτοῖς
  choice: معاكسة لهم
  rationale: تعبير عربي مألوف عن هبوب الريح في الاتجاه المضاد.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: نحو الهزيع الرابع من الليل
  rationale: يحفظ نظام تقسيم الليل القديم، ويترجم περὶ بـ«نحو».
- source_word: ἔρχεται
  choice: جاء
  rationale: المضارع اليوناني مضارع تاريخي؛ الماضي هو الأسلوب الطبيعي في السرد العربي، من دون تغيير الدلالة الزمنية للمشهد.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: ماشيًا على البحر
  rationale: يحافظ على لفظ θάλασσα «البحر»، مع صياغة عربية واضحة.
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: وكان يريد أن يمرّ بهم
  rationale: يبقي العبارة مفتوحة بين معنى تجاوزهم مكانيًا وبين صدى محتمل لمشاهد التجلي الإلهي، ولا يفرض تفسيرًا في المتن.
theological_decisions:
- issue: دلالة «أن يمرّ بهم»
  choice: 'إبقاء العبارة الحرفية نسبيًا: «وكان يريد أن يمرّ بهم»'
  alternative: «وكان يقصد أن يتجاوزهم» أو التصريح بأنه كان مزمعًا أن يتجلى لهم
  rationale: الفعل اليوناني يحتمل المرور المكاني البسيط، وقد يستدعي أيضًا مشاهد من العهد القديم يمرّ فيها الله في سياق إعلان ذاته؛ لذا تُحفظ المساحة التفسيرية في المتن وتُذكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «الهزيع» للمحافظة على المصطلح الزمني القديم مع شرحه في الحاشية، وصيغت مشقة التجديف تعبيرًا طبيعيًا مفهومًا.
