source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: ar
  text: 'وَسَمِعَ الْمَلِكُ هِيرُودُسُ بِذَلِكَ، لِأَنَّ اسْمَ يَسُوعَ كَانَ قَدْ ذَاعَ، وَكَانَ النَّاسُ يَقُولُونَ: «إِنَّ يُوحَنَّا الْمُعَمِّدَ[a] قَدْ أُقِيمَ مِنْ بَيْنِ الْأَمْوَاتِ[b]، وَلِذَلِكَ تَعْمَلُ فِيهِ الْقُوَى[c].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحسب اللقب التقليدي: «يُوحَنَّا الْمَعْمَدَانَ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو «قام من بين الأموات». الفعل اليوناني مبني للمجهول حرفيًا: «أُقيم».'
    reason: alternative_reading
  - marker: c
    text: أو «القوى المعجزية» أو «الأعمال العظيمة».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: الْمَلِكُ هِيرُودُسُ
  rationale: ينقل اللقب والاسم مباشرة، وترتيبهما طبيعي في العربية الفصحى.
- source_word: ἤκουσεν
  choice: سَمِعَ ... بِذَلِكَ
  rationale: مفعول السماع مفهوم من السياق السابق؛ وإضافة «بذلك» توضح الإحالة طبيعيًا من غير إدخال مضمون جديد.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: لِأَنَّ اسْمَهُ كَانَ قَدْ ذَاعَ
  rationale: «ذاع اسمه» تعبير عربي واضح ينقل صيرورة الاسم أو الصيت مشهورًا، مع إبقاء لفظ «اسمه».
- source_word: ἔλεγον
  choice: كَانَ النَّاسُ يَقُولُونَ
  rationale: الفعل اليوناني جمع بلا فاعل مصرح به، و«الناس» ينقل هذا الاستعمال غير المحدد طبيعيًا.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: يُوحَنَّا الْمُعَمِّدَ
  rationale: «المعمِّد» يحافظ على القوة الفعلية لاسم الفاعل اليوناني، مع ذكر اللقب التقليدي في الحاشية.
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: قَدْ أُقِيمَ مِنْ بَيْنِ الْأَمْوَاتِ
  rationale: يحافظ على صيغة المبني للمجهول في اليونانية وعلى دلالة الفعل التام ذي النتيجة القائمة.
- source_word: διὰ τοῦτο
  choice: وَلِذَلِكَ
  rationale: ينقل العلاقة السببية بين إقامة يوحنا وعمل القوى فيه بحسب قول المتكلمين.
- source_word: ἐνεργοῦσιν
  choice: تَعْمَلُ
  rationale: فعل مضارع واضح يلائم فاعله «القوى» ويعبّر عن نشاطها الجاري.
- source_word: αἱ δυνάμεις
  choice: هَذِهِ الْقُوَى
  rationale: يحافظ على صيغة الجمع وعلى إمكان فهمها قوى فاعلة أو قدرات معجزية، من غير حسم الدلالة في المتن.
- source_word: ἐν αὐτῷ
  choice: فِيهِ
  rationale: هو المقابل المباشر للتركيب اليوناني ويحافظ على تصور القوى عاملة فيه بدل تحويله تفسيريًا إلى «من خلاله».
theological_decisions:
- issue: صيغة ἐγήγερται في سياق القيامة
  choice: قَدْ أُقِيمَ مِنْ بَيْنِ الْأَمْوَاتِ
  alternative: قام من بين الأموات
  rationale: المبني للمجهول صريح في المصدر، والمحافظة عليه تتجنب تحويل العبارة إلى صيغة أكثر فاعلية مما يقوله النص.
- issue: لقب Ἰωάννης ὁ βαπτίζων
  choice: يُوحَنَّا الْمُعَمِّدَ
  alternative: يوحنا المعمدان
  rationale: الخيار الرئيس يعكس اسم الفاعل اليوناني وفعله بوضوح، بينما تُحفظ الصيغة العربية الموروثة في الحاشية.
- issue: مدلول αἱ δυνάμεις
  choice: هَذِهِ الْقُوَى
  alternative: هذه القوى المعجزية / هذه الأعمال العظيمة
  rationale: يبقي الترجمة على سعة اللفظ اليوناني بين القوى الفاعلة والآيات أو الأعمال المقتدرة، ولا يحسم الغموض في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة مألوفة في السرد الكتابي من غير تقليد حرفي متعثر، مع الحفاظ على المبني للمجهول وعلى سعة دلالة «القوى».
