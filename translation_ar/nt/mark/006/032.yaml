base_translation:
  language: en
  yaml_path: translation/nt/mark/006/032.yaml
  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: ar
  text: فمضوا في القارب إلى موضع مقفر[a] على انفراد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «موضع خالٍ» أو «موضع بريّة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وحدهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: فـ
  rationale: تفيد استئناف السرد وربط الفعل بما قبله في عبارة عربية طبيعية، مع الحفاظ على تدفق مرقس المتتابع.
- source_word: ἀπῆλθον
  choice: مضوا
  rationale: ينقل فعل الذهاب ومغادرة الموضع السابق بإيجاز عربي فصيح، من غير زيادة تفسيرية.
- source_word: ἐν τῷ πλοίῳ
  choice: في القارب
  rationale: ترجمة قريبة من البنية اليونانية، و«القارب» أنسب من «السفينة» للسياق الإنجيلي هنا.
- source_word: εἰς ἔρημον τόπον
  choice: إلى موضع مقفر
  rationale: «مقفر» يدل على الخلو من السكان والعزلة، من غير أن يحصر المعنى في صحراء جغرافية.
- source_word: κατ’ ἰδίαν
  choice: على انفراد
  rationale: تعبير عربي طبيعي يحفظ معنى الانفصال عن الآخرين والخصوصية، مع بقاء احتمال ترجمته «وحدهم».
theological_decisions: []
