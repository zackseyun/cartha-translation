  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: ar
  text: لكنهم لما رأوه ماشيًا على البحر، ظنّوا أنه شبح[a]، فصرخوا،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «طيف» أو «خيال». تشير الكلمة اليونانية φάντασμα إلى ظهور شبحي.
    reason: بدائل معجمية
lexical_decisions:
- source_word: οἱ δὲ
  choice: لكنهم
  rationale: تنقل δέ انتقالًا سرديًا ذا مسحة استدراكية خفيفة، ويعود الضمير على التلاميذ المذكورين في السياق.
- source_word: ἰδόντες αὐτόν
  choice: لما رأوه
  rationale: صيغ اسم الفاعل الماضي بصيغة زمنية عربية طبيعية تحفظ تعاقب الحدثين، والضمير يعود على يسوع.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: ماشيًا على البحر
  rationale: تفيد ἐπί مع المضاف إليه هنا السير على سطح الماء، و«البحر» تقابل θάλασσα وتحافظ على صياغة النص.
- source_word: ἔδοξαν
  choice: ظنّوا
  rationale: تفيد δοκέω هنا اعتقادًا تبين من السياق أنه خاطئ، و«ظنّوا» تعبير عربي واضح وموجز.
- source_word: ὅτι φάντασμά ἐστιν
  choice: أنه شبح[a]
  rationale: «شبح» أقرب لفظ عربي شائع لظهور مخيف يُحسب كيانًا غير بشري؛ وتعرض الحاشية بدائل تحفظ المجال الدلالي للكلمة اليونانية.
- source_word: καὶ ἀνέκραξαν
  choice: فصرخوا
  rationale: يفيد الفعل صرخة عالية، والفاء تلائم العربية في بيان رد الفعل الفوري من غير إضافة سبب غير مصرح به في هذه الآية.
theological_decisions:
- issue: موضع سير يسوع بالنسبة إلى الماء
  choice: ماشيًا على البحر
  alternative: ماشيًا بمحاذاة البحر
  rationale: يدل تركيب ἐπὶ τῆς θαλάσσης في سياق الرواية على السير فوق سطح الماء، لا على السير بمحاذاة الشاطئ، من غير إضافة تفسير لاهوتي إلى العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ إيقاع السرد، ووُضعت علامة الحاشية بعد «شبح» لأنها الكلمة التي تشرحها الحاشية.
