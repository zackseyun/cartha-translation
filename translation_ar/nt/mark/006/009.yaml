lexical_decisions:
- source_word: ἀλλὰ
  choice: بَلْ
  rationale: تفيد الاستدراك والمقابلة مع تعليمات السفر السابقة، و«بل» موجزة وطبيعية في السياق.
- source_word: ὑποδεδεμένους
  choice: يَنْتَعِلُوا
  rationale: اسم مفعول تام من ὑποδέομαι يؤدي هنا معنى الأمر؛ و«ينتعلوا» تعبر بوضوح عن كون النعال في أقدامهم.
- source_word: σανδάλια
  choice: نِعَالًا
  rationale: مقابل عربي فصيح ومألوف للأحذية المفتوحة المقصودة في السياق القديم.
- source_word: μὴ ἐνδύσησθε
  choice: لَا يَلْبَسُوا
  rationale: نهي بصيغة μή مع فعل أوريستي متوسط؛ «لا يلبسوا» عربية طبيعية، ويمكن أن يدل الفعل اليوناني على فعل ارتداء الثوب أو حالة لبسه.
- source_word: δύο
  choice: ثَوْبَيْنِ
  rationale: حُفظ العدد صراحة بصيغة المثنى العربية.
- source_word: χιτῶνας
  choice: ثَوْبَيْنِ دَاخِلِيَّيْنِ
  rationale: χιτών هو الثوب الأساسي الذي يلبس ملاصقًا للجسد؛ وهذا التعبير أدق من «ثوبين» وحدها وأقل إيحاءً بلباس حديث من «قميصين».
