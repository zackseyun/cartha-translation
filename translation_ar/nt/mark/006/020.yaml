  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: ar
  text: لأن هيرودس كان يخاف يوحنا، إذ كان يعلم أنه رجل بارّ وقدّيس، وكان يحميه. وإذ كان يسمعه، كان يتحيّر كثيرًا[a]، ومع ذلك كان يصغي إليه بسرور.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «كان يفعل أشياء كثيرة» بدلًا من «كان يتحيّر كثيرًا».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: كان يخاف
  rationale: ينقل دلالة الخوف المستمر في صيغة الماضي الناقص، من غير تلطيفها إلى مجرد الاحترام، مع ترك السياق يبيّن ما صحبها من تقدير.
- source_word: εἰδὼς
  choice: إذ كان يعلم
  rationale: يحافظ على دلالة اسم الفاعل السببية، ويأتي طبيعيًا في العربية الفصحى المعاصرة.
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: رجل بارّ وقدّيس
  rationale: «بارّ» تعبّر عن الاستقامة الأخلاقية، و«قدّيس» هنا صفة بمعنى المتصف بالقداسة، مع إبقاء الصفتين المتميزتين في الأصل.
- source_word: συνετήρει αὐτόν
  choice: كان يحميه
  rationale: الفعل في السياق يفيد صون يوحنا وحمايته من الأذى، لا مجرد إبقائه في الحبس.
- source_word: ἀκούσας αὐτοῦ
  choice: حين كان يسمعه
  rationale: تعبير عربي طبيعي عن سماع الشخص، مع إظهار التكرار المتوافق مع الفعل اللاحق في الماضي الناقص والسياق.
- source_word: πολλὰ ἠπόρει
  choice: كان يتحيّر كثيرًا
  rationale: يتبع قراءة SBLGNT، وفيها πολλὰ مستعملة للتكثير وἠπόρει تدل على الحيرة والعجز عن الاهتداء إلى موقف.
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: ومع ذلك كان يصغي إليه بسرور
  rationale: «يصغي» توضح السماع المقصود المتكرر، و«بسرور» تنقل ἡδέως، أما «مع ذلك» فتبرز التوتر السياقي بين الحيرة والسرور من غير أن تزيله.
theological_decisions:
- issue: الاختلاف النصي في العبارة التي تصف استجابة هيرودس لسماع يوحنا
  choice: 'اتباع نص SBLGNT: «كان يتحيّر كثيرًا» (ἠπόρει)'
  alternative: «كان يفعل أشياء كثيرة» (ἐποίει)
  rationale: قراءة النص النقدي تصف حيرة هيرودس وتنسجم مع التوتر بين اضطرابه وإصغائه بسرور. ولأن القراءة البديلة تغيّر المعنى بوضوح، ذُكرت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «هيرودس» و«يوحنا» وفق الصيغة الكتابية العربية الشائعة، وحُفظ التوتر بين خوف هيرودس وحمايته ليوحنا، وبين حيرته وإصغائه إليه بسرور.
