  terminology: «الأرغفة» مناسب للجمع المحدد ἄρτοις، و«قلوبهم» طبيعي في العربية مع أن الأصل يستعمل المفرد الجمعي. «متحجّرة» تنقل مجاز القساوة/التبلد في πεπωρωμένη من دون تعيين سببها.
