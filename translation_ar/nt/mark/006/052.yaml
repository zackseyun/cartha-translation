lexical_decisions:
- source_word: συνῆκαν
  choice: يَفْهَمُوا
  rationale: ينقل المعنى الإدراكي للفعل συνίημι بلغة عربية واضحة، مع بقاء احتمال أن المقصود فهم المغزى لا مجرد تذكّر الحدث.
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: دَلَالَةَ الأَرْغِفَةِ
  rationale: التركيب في السياق يشير إلى عدم إدراك ما كشفته معجزة الأرغفة؛ وهذه الصياغة طبيعية في العربية وتوضح المقصود السياقي دون تحديد دلالة لاهوتية بعينها.
- source_word: ἄρτοις
  choice: الأَرْغِفَةِ
  rationale: الجمع يشير إلى الأرغفة المحددة في حادثة الإطعام السابقة، ولذلك هو أدق من «الخبز» العام.
- source_word: καρδία
  choice: قُلُوبُهُمْ
  rationale: «القلب» هو المقابل الكتابي الطبيعي لمركز الفهم والاستعداد الداخلي. استُعمل الجمع في العربية لموافقة تعدد أصحاب القلوب، مع بيان المفرد الجمعي اليوناني في الحاشية.
- source_word: πεπωρωμένη
  choice: مُتَحَجِّرَةً
  rationale: يحفظ استعارة الصلابة الروحية والبلادة الداخلية بصياغة عربية مفهومة، من غير أن يحدد الفاعل المسبب لهذا التحجر.
- source_word: ἀλλ’ ἦν
  choice: بَلْ كَانَتْ
  rationale: ينقل المقابلة والحالة المستمرة التي يدل عليها العطف مع الفعل الناقص في صيغة الماضي.
theological_decisions:
- issue: طبيعة حالة التلاميذ في πεπωρωμένη
  choice: كانت قلوبهم متحجرة
  alternative: كان قلبهم قاسيًا / كانت قلوبهم غليظة
  rationale: تحفظ الصياغة صورة التصلب والبلادة الروحية، ولا تضيف حكمًا بشأن سبب الحالة أو تنسبها صراحة إلى فعل إلهي قضائي.
- issue: المفرد الجمعي في αὐτῶν ἡ καρδία
  choice: قلوبهم
  alternative: قلبهم
  rationale: الجمع أفصح وأطبع في العربية عند الحديث عن عدة أشخاص، بينما تسجل الحاشية أن اليونانية تستعمل «القلب» بالمفرد على نحو جمعي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «دلالة الأرغفة» لإبراز أن الإخفاق كان في إدراك مغزى المعجزة، واختير جمع «قلوبهم» لطبيعية الأسلوب العربي مع حفظ صيغة الأصل المفردة في الحاشية.
