  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: ar
  text: 'وكان يقول لهم: «حيثما دخلتم بيتًا، فأقيموا فيه إلى أن تخرجوا من ذلك المكان[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى أن تخرجوا من هناك». والعبارة اليونانية حرفيًا أقرب إلى هذه الصياغة، لكن السياق يرجح أن المقصود مغادرة ذلك الموضع أو تلك البلدة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: يحفظ دلالة الماضي الناقص على القول الجاري أو المتكرر في سياق السرد، بصياغة عربية طبيعية.
- source_word: Ὅπου ἐὰν
  choice: حيثما
  rationale: تنقل معنى الموصول المكاني غير المحدد بإيجاز ووضوح.
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: دخلتم بيتًا
  rationale: الفعل «دخل» متعدٍّ بنفسه في العربية، فيؤدي معنى الدخول إلى البيت دون تركيب حرفي ثقيل.
- source_word: οἰκίαν
  choice: بيتًا
  rationale: يشير السياق أساسًا إلى موضع الإقامة الذي يستضيف فيه الناس التلاميذ.
- source_word: ἐκεῖ μένετε
  choice: فأقيموا فيه
  rationale: «أقيموا» واضحة في سياق المبيت والاستقرار المؤقت، والضمير يربط الأمر بالبيت المذكور.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: إلى أن تخرجوا من ذلك المكان
  rationale: صياغة عربية طبيعية تحفظ فعل الخروج ودلالة ἐκεῖθεν المكانية، مع إبقاء احتمال نطاق المرجع موضحًا في الحاشية.
theological_decisions:
- issue: نطاق الإشارة المكانية في ἐκεῖθεν
  choice: يُفهم «ذلك المكان» في السياق على أنه الموضع أو البلدة التي يعملون فيها، بحيث يبقون في البيت نفسه إلى وقت مغادرتها.
  alternative: 'يمكن حمل العبارة حرفيًا على الخروج من البيت: «إلى أن تخرجوا من هناك».'
  rationale: سياق تعليمات الإرسالية يرجح أن المقصود عدم الانتقال من بيت إلى آخر أثناء الإقامة في الموضع، لكن العبارة اليونانية نفسها موجزة؛ لذلك لم يُطمس الاحتمال الآخر بل ذُكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كريمة. استُعمل «كان يقول» لحفظ جانب الفعل، و«حيثما» للإيجاز، و«فأقيموا فيه» لتوضيح أن الأمر يتعلق بالبقاء في البيت نفسه دون إدخال تفسير مذهبي.
