lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: ولمّا حلّ المساء
  rationale: ترجمة طبيعية للتركيب الإضافي المطلق الدال على ظرف زمني، وتحافظ على معنى دخول وقت المساء.
- source_word: πλοῖον
  choice: القارب
  rationale: أنسب في سياق بحر الجليل من «السفينة»، التي قد توحي في الاستعمال الحديث بمركب أكبر.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: في وسط البحر
  rationale: تنقل الموقع بوضوح وتحافظ على لفظ «البحر» الوارد في الأصل اليوناني.
- source_word: θάλασσα
  choice: البحر
  rationale: مع أن بحر الجليل بحيرة من الناحية الجغرافية، فإن النص اليوناني يستعمل لفظ «البحر»، ولذلك حُفظ تعبير المصدر.
- source_word: αὐτὸς μόνος
  choice: كان هو وحده
  rationale: يحافظ على توكيد الضمير مع μόνος، ويبرز المقابلة بين وجود القارب في البحر وبقائه منفردًا على اليابسة.
- source_word: ἐπὶ τῆς γῆς
  choice: على اليابسة
  rationale: تعبير عربي واضح يحفظ المقابلة المكانية مع البحر؛ أما «على الشاطئ» فأكثر تفسيرًا وتحديدًا.
