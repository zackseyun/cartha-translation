lexical_decisions:
- source_word: ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον
  choice: صعد إليهم إلى القارب
  rationale: يحفظ اتجاه الحركة في ἀνέβη وεἰς، ويترجم πρὸς αὐτούς بوضوح من غير تحويله إلى معنى المصاحبة وحده.
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: فسكنت الريح
  rationale: «سكنت» تعبير عربي طبيعي عن هدوء الريح وانقطاع شدتها، ويلائم معنى κοπάζω.
- source_word: λίαν ἐκ περισσοῦ
  choice: إلى أبعد حدٍّ
  rationale: ينقل التوكيد المتراكم في العبارة اليونانية بعبارة عربية قوية ومفهومة، مع بيان حرفيتها التقريبية في الحاشية.
- source_word: ἐν ἑαυτοῖς
  choice: في داخلهم
  rationale: يحفظ كون الانفعال داخليًّا، بصياغة عربية طبيعية.
- source_word: ἐξίσταντο
  choice: اشتدَّ ذهولهم
  rationale: ينقل قوة الدهشة التي يدل عليها الفعل من غير استعمال تعبير قد يوحي بفقدان العقل حرفيًّا.
theological_decisions:
- issue: شدة استجابة التلاميذ لفعل يسوع
  choice: فاشتدَّ ذهولهم في داخلهم إلى أبعد حدٍّ
  alternative: وكانوا في أنفسهم مندهشين جدًّا فوق القياس
  rationale: تحافظ الصياغة على شدة رد فعلهم كما يصفه السرد، من غير إضافة تفسير لاهوتي غير مصرح به.
