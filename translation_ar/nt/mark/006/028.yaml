  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: ar
  text: فأحضر رأسه على طبق[a]، وأعطاه للفتاة، والفتاة أعطته لأمها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
