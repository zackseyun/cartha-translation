lexical_decisions:
- source_word: ἤνεγκεν
  choice: فأحضر
  rationale: ينقل فعل الإتيان بالرأس إلى موضع الوليمة بعبارة عربية طبيعية، من غير زيادة في وصف كيفية حمله.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: رأسه
  rationale: صياغة عربية موجزة وأمينة؛ والضمير يعود بحسب السياق السابق إلى يوحنا المعمدان.
- source_word: ἐπὶ πίνακι
  choice: على طبق
  rationale: πίναξ يدل هنا على طبق أو صحن للتقديم؛ و«طبق» واضح وطبيعي في سياق الوليمة، مع إثبات البديل المعجمي في الحاشية.
- source_word: ἔδωκεν
  choice: أعطى / أعطت
  rationale: يحافظ على تكرار فعل δίδωμι في الجملتين، مع المطابقة النحوية العربية لجنس الفاعل.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: للفتاة / والفتاة
  rationale: «الفتاة» تعبير عربي معاصر واضح يدل على الأنثى الشابة، من غير تقييد لعمرها بما يتجاوز اللفظ اليوناني.
- source_word: τῇ μητρὶ αὐτῆς
  choice: لأمها
  rationale: ينقل المجرور الدال على المتلقي وضمير الملكية بصياغة عربية طبيعية، ويحفظ تسلسل تسليم الرأس.
