  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: ar
  text: وكانوا يطردون شياطين كثيرة، ويدهنون بالزيت مرضى كثيرين ويشفونهم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαιμόνια πολλὰ
  choice: شياطين كثيرة
  rationale: ينقل الاسم الدال على الأرواح الشريرة والصفة الكمية مباشرة، من غير استبداله بعبارة «أرواح نجسة» غير الواردة هنا.
- source_word: ἐξέβαλλον
  choice: كانوا يطردون
  rationale: صيغة «كانوا» مع المضارع تعبّر عن الفعل المتكرر أو المستمر الذي يدل عليه الماضي الناقص اليوناني، و«يطردون» تعبير عربي طبيعي في هذا السياق.
- source_word: ἤλειφον ἐλαίῳ
  choice: يدهنون بالزيت
  rationale: الفعل يدل على دهن الزيت أو وضعه؛ وهذه الصياغة واضحة وطبيعية، ولا تضيف دلالة طقسية لا يصرّح بها النص.
- source_word: πολλοὺς ἀρρώστους
  choice: مرضى كثيرين
  rationale: ينقل الصفة المستعملة اسميًا بصياغة عربية موجزة ومفهومة.
- source_word: ἐθεράπευον
  choice: يشفونهم
  rationale: ينقل معنى الشفاء ويحافظ، ضمن سلسلة الأفعال بعد «كانوا»، على دلالة العمل المتكرر، والضمير يعود بوضوح إلى المرضى.
- source_word: καὶ
  choice: و
  rationale: يحافظ على الربط السردي المتتابع البسيط في اليونانية.
theological_decisions:
- issue: علاقة الدهن بالزيت بالشفاء
  choice: وصف الفعلين كما يوردهما النص من غير تحديد آلية العلاقة بينهما
  alternative: اعتبار الزيت سببًا فعّالًا للشفاء، أو اعتباره رمزًا محضًا لا دور له
  rationale: الآية تذكر أن التلاميذ دهنوا المرضى بالزيت وشفوهم، لكنها لا تشرح كيفية ارتباط الدهن بالشفاء ولا تقرر هنا عقيدة طقسية بعينها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة «كانوا» مع الأفعال المضارعة لإبراز الاستمرار أو التكرار في الأفعال اليونانية الناقصة. لا تلزم حاشية لـ«الزيت»، إذ إن تخصيصه بزيت الزيتون مرجح ثقافيًا لكنه غير مصرح به معجميًا في هذا الموضع.
