  source_fidelity: ينقل النص الأفعال الثلاثة بصيغة «كانوا» مع المضارع، وهي طريقة عربية سليمة لإظهار التكرار أو الاستمرار الذي تفيده صيغ الماضي الناقص اليونانية (ἐξέβαλλον، ἤλειφον، ἐθεράπευον). و«يطردون شياطين كثيرة» يقابل δαιμόνια πολλὰ ἐξέβαλλον مباشرة، بينما «يدهنون بالزيت مرضى كثيرين ويشفونهم» يحافظ على ترتيب الفعلين وعلاقتهما الوصفية من غير استنتاج آلية للشفاء.
  naturalness: الصياغة فصيحة حديثة واضحة ومترابطة. وموضع «بالزيت» قبل المفعول به جائز وطبيعي، ولا يسبب غموضًا في أن المرضى هم المدهنون.
  terminology: «شياطين» مقابل مناسب ومباشر لـδαιμόνια، ولا يستبدل اللفظ بتعبير «أرواح نجسة» غير الموجود في الأصل. و«مرضى» و«يشفونهم» سليمان في السجل العربي الحديث. و«الزيت» هو المقابل الطبيعي لـἐλαίῳ؛ ولا تلزم حاشية لتخصيصه بزيت الزيتون، لأن النص العربي مفهوم في سياقه ولا يقتضي هذا التخصيص في المتن.
