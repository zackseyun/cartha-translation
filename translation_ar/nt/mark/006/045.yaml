  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: ar
  text: وفي الحال ألزم تلاميذه أن يركبوا القارب ويتقدّموه إلى الضفة الأخرى، باتجاه بيت صيدا[a]، إلى أن يصرف هو الجمع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إلى بيت صيدا». يمكن أن يدل حرف الجر اليوناني على الاتجاه نحو المكان أو على الوصول إليه بوصفه مقصدًا.
    reason: lexical_alternative
  - marker: b
    text: 'الفعل في اليونانية بصيغة المضارع: «إلى أن يصرف الجمع»؛ وهذه الصياغة طبيعية أيضًا في العربية داخل العبارة الزمنية.'
    reason: source_form
lexical_decisions:
- source_word: εὐθὺς
  choice: وفي الحال
  rationale: تنقل سرعة الانتقال السردي التي يكثر مرقس من التعبير عنها بهذه اللفظة، بصياغة عربية واضحة وطبيعية.
- source_word: ἠνάγκασεν
  choice: ألزم
  rationale: تحفظ معنى الضغط القوي أو الإلزام من غير أن توحي بالضرورة بإكراه جسدي.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: تلاميذه
  rationale: اللفظ العربي المألوف والدقيق للعلاقة بين المعلّم والمتعلّمين التابعين له.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: أن يركبوا القارب
  rationale: صياغة عربية طبيعية للدخول في القارب بقصد الإبحار.
- source_word: προάγειν
  choice: ويتقدّموه
  rationale: يبين أنهم يمضون قبله، ويحفظ المعنى العلاقي للفعل من دون إطالة.
- source_word: εἰς τὸ πέραν
  choice: إلى الضفة الأخرى
  rationale: تعبير واضح عن العبور إلى الجانب المقابل من البحيرة.
- source_word: πρὸς Βηθσαϊδάν
  choice: باتجاه بيت صيدا
  rationale: يحفظ الدلالة الاتجاهية لحرف الجر πρός ولا يحسم أن المدينة هي نقطة الوصول النهائية.
- source_word: ἕως
  choice: إلى أن
  rationale: ينقل الحد الزمني الذي يربط تقدّم التلاميذ ببقاء يسوع لصرف الجمع.
- source_word: αὐτὸς
  choice: هو
  rationale: إثبات الضمير المنفصل يحفظ توكيد الأصل اليوناني على أن يسوع نفسه يتولى صرف الجمع.
- source_word: ἀπολύει
  choice: يصرف
  rationale: يناسب إرسال الجمع بعيدًا، كما أن المضارع العربي بعد «إلى أن» طبيعي في هذا السياق السردي ويحافظ على هيئة الصيغة اليونانية.
- source_word: τὸν ὄχλον
  choice: الجمع
  rationale: لفظ عربي واضح ووقور لجماعة الناس المحتشدة في سياق الأناجيل.
