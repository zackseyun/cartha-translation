  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: ar
  text: فهيرودس نفسه كان قد أرسل من يقبض على يوحنا[a]، وقيّده في السجن بسبب هيروديا، زوجة فيلبس أخيه، لأن هيرودس كان قد تزوّجها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «كان قد أرسل وألقى القبض على يوحنا». يُفهم من السياق أن هيرودس نفّذ القبض بإرسال رجاله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: فهيرودس نفسه
  rationale: تحفظ «نفسه» توكيد مسؤولية هيرودس، وتؤدي الفاء وظيفة γὰρ التفسيرية في سياق السرد العربي.
- source_word: ἀποστείλας ἐκράτησεν
  choice: كان قد أرسل من يقبض على
  rationale: تفيد الصياغة أن هيرودس بادر إلى القبض بإرسال تابعين، وهو المعنى الطبيعي للتركيب في هذا السياق، من غير أن توهم أنه أرسل رسالة ثم قبض على يوحنا بيده.
- source_word: ἔδησεν
  choice: قيّده
  rationale: ينقل الفعل معنى الربط أو التقييد من غير تحديد وسيلة كالسلاسل، إذ لا يذكرها النص.
- source_word: ἐν φυλακῇ
  choice: في السجن
  rationale: تعبير عربي واضح وطبيعي يدل هنا على موضع الحبس.
- source_word: διὰ Ἡρῳδιάδα
  choice: بسبب هيروديا
  rationale: ينقل بوضوح دلالة السبب في διά مع حالة النصب.
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: زوجة فيلبس أخيه
  rationale: γυνή تعني هنا الزوجة، والضمير في «أخيه» يعود إلى هيرودس.
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: لأن هيرودس كان قد تزوّجها
  rationale: يبيّن السبب السابق للقبض، ويصرّح باسم هيرودس في العربية منعًا لالتباس مرجع الفاعل بعد ذكر فيلبس.
theological_decisions:
- issue: التوصيف الأخلاقي لزواج هيرودس من هيروديا
  choice: عرض السبب التاريخي كما يورده النص من غير إضافة حكم أخلاقي في هذه الآية
  alternative: إدخال وصف للزواج بأنه غير شرعي في المتن
  rationale: هذه الجملة تذكر سبب سجن يوحنا، أما الحكم على الزواج فيظهر في السياق التالي؛ لذلك لا تُضاف هنا عبارة تفسيرية ليست في نص الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية رصينة. استُخدم الماضي الناقص مع «قد» لإظهار سبق الإرسال والزواج على الحبس، وصُرّح باسم هيرودس في الجملة الأخيرة لتجنب غموض الضمير في العربية.
