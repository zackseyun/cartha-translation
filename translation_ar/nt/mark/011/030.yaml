  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: ar
  text: أَمِنَ السَّمَاءِ كَانَتْ مَعْمُودِيَّةُ يُوحَنَّا، أَمْ مِنَ النَّاسِ؟ أَجِيبُونِي.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مِنَ الله». يَرِدُ في اليونانية حرفيًّا «مِنَ السماء»، وهو تعبير يهودي يدل على المصدر أو السلطان الإلهي.'
    reason: lexical_alternative
  - marker: b
    text: 'تعني عبارة «مِنَ الناس»: مِنَ البشر، أي إن مصدرها أو سلطانها بشري محض.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: مَعْمُودِيَّةُ يُوحَنَّا
  rationale: تنقل تركيب الإضافة اليوناني بصياغة عربية طبيعية، وتشير إلى المعمودية المرتبطة بيوحنا.
- source_word: ἐξ οὐρανοῦ
  choice: مِنَ السَّمَاءِ
  rationale: تحفظ العبارة الأصلية والتعبير اليهودي الدال على المصدر أو السلطان الإلهي من غير استبداله بتفسير صريح.
- source_word: ἐξ ἀνθρώπων
  choice: مِنَ النَّاسِ
  rationale: تنقل المعنى العام لكلمة ἀνθρώπων وتشمل البشر عمومًا، وتحافظ على المقابلة الموجزة مع «من السماء».
- source_word: ἀποκρίθητέ μοι
  choice: أَجِيبُونِي
  rationale: أمر مباشر طبيعي في العربية، يحفظ قوة مطالبة يسوع لهم بالجواب.
- source_word: ἦν ἢ
  choice: أَمِنَ ... كَانَتْ ... أَمْ مِنَ ...؟
  rationale: يحفظ فعل الكينونة والاستفهام البديل في اليونانية، مع ترتيب عربي واضح وفصيح.
theological_decisions:
- issue: دلالة «من السماء» في سؤال يسوع
  choice: إبقاء التعبير «من السماء» في المتن، بما يحمله من معنى المصدر أو السلطان الإلهي.
  alternative: من الله
  rationale: يحفظ التعبير اليهودي الموقر والتوتر البلاغي في السؤال، من غير أن يحوّل الدلالة الضمنية إلى تفسير صريح داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «الناس» بدل تعبير مذكّر قد يوهم حصر المعنى في الرجال، وحُفظت «من السماء» في المتن لصون اصطلاح المصدر.
