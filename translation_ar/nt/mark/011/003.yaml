source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: ar
  text: 'وَإِنْ قَالَ لَكُمْ أَحَدٌ: «لِمَاذَا تَفْعَلُونَ هَذَا؟» فَقُولُوا: «إِنَّ الرَّبَّ[a] يَحْتَاجُ إِلَيْهِ»، فَيُعِيدُهُ فَوْرًا إِلَى هُنَا[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «السيد». فاللفظة اليونانية κύριος تحتمل «الرب» و«السيد»، وقد اختير «الرب» هنا بحسب سياق الإنجيل.'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «ويرسله فورًا إلى هنا أيضًا/من جديد». الفعل اليوناني بصيغة المضارع، ويمكن أن يُفهم هنا بدلالة مستقبلية: «فسيعيده». والفاعل غير مصرَّح باسمه في العبارة اليونانية.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: وَإِنْ قَالَ لَكُمْ أَحَدٌ
  rationale: يحفظ تركيب الشرط المفتوح الدال على احتمال مستقبلي، ويأتي بصياغة عربية طبيعية واضحة.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: لِمَاذَا تَفْعَلُونَ هَذَا؟
  rationale: السؤال في هذا السياق اعتراض على الفعل وطلب لبيان سببه؛ لذلك تؤدي «لماذا» المعنى التداولي أفضل من الترجمة الحرفية بـ«ماذا».
- source_word: εἴπατε
  choice: فَقُولُوا
  rationale: فعل أمر للجمع، وقد أضيفت الفاء لربط جواب الشرط بما ينبغي أن يقولوه.
- source_word: Ὁ κύριος
  choice: الرَّبُّ
  rationale: يحفظ اللقب المعتاد لـκύριος في سياق الإنجيل، مع إبقاء احتمال المعنى العام «السيد» في الحاشية.
- source_word: αὐτοῦ χρείαν ἔχει
  choice: مُحْتَاجٌ إِلَيْهِ
  rationale: تعبير عربي واضح يحافظ على بنية «له حاجة إليه» دون تكلف، والضمير يعود إلى الجحش المذكور في السياق السابق.
- source_word: εὐθὺς
  choice: فَوْرًا
  rationale: ينقل معنى السرعة والفورية المميز لاستعمال مرقس.
- source_word: ἀποστέλλει
  choice: فَيُرْسِلُهُ
  rationale: يحافظ على صيغة المضارع اليونانية، وهي في سياق الشرط والجواب قابلة لأن تُفهم بدلالة مستقبلية طبيعية.
- source_word: πάλιν ὧδε
  choice: إِلَى هُنَا مِنْ جَدِيدٍ
  rationale: 'ينقل كِلَا العنصرين: الرجوع أو التكرار في πάλιν، والإشارة المكانية «إلى هنا» في ὧδε.'
theological_decisions:
- issue: دلالة κύριος ومرجعه
  choice: الرَّبُّ، بوصفه لقبًا يُفهم في سياق مرقس على أنه يشير إلى يسوع
  alternative: السيد، بالمعنى العام لصاحب السلطان أو المالك
  rationale: السياق يجعل الإشارة إلى يسوع هي الأرجح، لكن اللفظة اليونانية نفسها تحتمل «السيد» أيضًا؛ لذلك أُثبت «الرب» في المتن وحُفظ البديل في الحاشية دون إضافة دعوى لاهوتية لا يصرح بها النص.
- issue: فاعل ἀποστέλλει وزمنه
  choice: فَيُرْسِلُهُ، بفاعل مستتر كما في اليونانية وبصيغة مضارع يمكن أن تدل سياقيًا على المستقبل
  alternative: فَسَيُرْسِلُهُ، مع التصريح بالدلالة المستقبلية؛ أو فهم الفاعل على أنه الرب بدل الشخص المعترض، أو العكس
  rationale: النص اليوناني لا يصرح باسم الفاعل، وصيغة المضارع قد تكون حاضرة حيوية أو ذات معنى مستقبلي في السياق. الصياغة العربية بفاعل مستتر لا تحسم المرجع صراحة وتحافظ على قدر من الغموض الأصلي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية موقرة. استُعملت ألفاظ مألوفة وتراكيب مباشرة، مع الحفاظ على الشرط، والأمر للجمع، وفورية الحدث، وعدم التصريح بفاعل «يرسله» حيث لم يصرح به اليوناني.
