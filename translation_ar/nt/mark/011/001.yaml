  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: ar
  text: ولمّا كانوا يقتربون من أورشليم، عند بيت فاجي وبيت عنيا، قرب جبل الزيتون[a]، أرسل[b] اثنين من تلاميذه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارات المكانية ترجمة أقرب إلى ظاهر حروف الجر اليونانية: «إلى أورشليم، إلى بيت فاجي وبيت عنيا، نحو جبل الزيتون». ويسمح السياق بفهمها على أنها تحدد المنطقة التي بلغوها بالقرب من الجبل.'
    reason: lexical_alternative
  - marker: b
    text: 'ورد الفعلان «يقتربون» و«يرسل» بصيغة المضارع في اليونانية، وهو مضارع تاريخي شائع في سرد مرقس؛ لذلك يمكن ترجمة العبارة: «وحين يقتربون... يرسل اثنين من تلاميذه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν εἰς Ἱεροσόλυμα
  choice: اقتربوا من أورشليم
  rationale: الفعل يدل على الدنوّ المكاني، وتقتضي العربية الفصيحة «اقترب من». وصيغة الماضي تلائم السرد العربي، مع بيان المضارع اليوناني في الحاشية.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: ووصلوا إلى جوار بيت فاجي وبيت عنيا
  rationale: توضح العبارة أنهم بلغوا المنطقة الواقعة عند القريتين، من غير الإيحاء بأنهم دخلوا كلتيهما؛ وهي صياغة عربية طبيعية للتركيب المكاني الموجز.
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: عند جبل الزيتون
  rationale: تحفظ الدلالة المكانية لـπρός هنا من غير الجزم بأن الحركة كانت باتجاه الجبل، وتستعمل الاسم الجغرافي العربي الشائع.
- source_word: ἀποστέλλει
  choice: أرسل
  rationale: هو مضارع تاريخي في السرد اليوناني؛ نُقل بالماضي الطبيعي في العربية، مع إثبات البديل الأقرب إلى الصيغة في الحاشية.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: اثنين من تلاميذه
  rationale: تنقل تركيب التبعيض والملكية بوضوح وطبيعية.
- source_word: Βηθφαγὴ
  choice: بيت فاجي
  rationale: نقل صوتي للاسم الجغرافي بصيغة عربية واضحة.
- source_word: Βηθανίαν
  choice: بيت عنيا
  rationale: الصيغة العربية المألوفة للاسم الجغرافي.
