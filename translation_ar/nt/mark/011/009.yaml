base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: ar
  text: 'وكان الذين يتقدّمون والذين يتبعون يهتفون: «أوصنّا[a]! مبارك الآتي باسم الرب[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «أوصنّا» هتاف طقسي من العبرية/الآرامية، معناه الأصلي نحو «خلّص، من فضلك» أو «خلّص الآن»، لكنه يُستعمل هنا أيضًا هتافَ تمجيد.
    reason: lexical_alternative
  - marker: b
    text: تردد عبارة «مبارك الآتي باسم الرب» صدى مزمور 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: المتقدّمون
  rationale: ينقل اسم الفاعل المضارع المعرّف الدال على جماعة السائرين في مقدمة الموكب، ويحافظ على التوازي مع «التابعون».
- source_word: οἱ ἀκολουθοῦντες
  choice: التابعون
  rationale: ينقل اسم الفاعل المضارع المعرّف لجماعة السائرين خلفه، بصياغة عربية موجزة وطبيعية موازية لـ«المتقدّمون».
- source_word: ἔκραζον
  choice: كانوا يهتفون
  rationale: صيغة «كانوا» مع المضارع تنقل دلالة الماضي الناقص على الهتاف المستمر أو المتكرر، و«يهتفون» تلائم النداء الجماعي العلني في هذا السياق.
- source_word: Ὡσαννά
  choice: أوصنّا
  rationale: نقل صوتي للتعبير العبري/الآرامي الطقسي، يحفظ صداه الكتابي ووظيفته كهتاف، مع بيان معناه الأصلي في الحاشية.
- source_word: Εὐλογημένος
  choice: مبارك
  rationale: يحفظ صيغة التطويب وصدى مزمور 118:26 دون تحويلها إلى تفسير مثل «ممدوح» أو «محظيّ».
- source_word: ὁ ἐρχόμενος
  choice: الآتي
  rationale: اسم فاعل معرّف طبيعي في العربية، يحفظ إمكان فهم العبارة كتابيًا ومسيانيًا دون إضافة لقب غير موجود في اليونانية.
- source_word: ἐν ὀνόματι κυρίου
  choice: باسم الرب
  rationale: تعبير كتابي عربي واضح يحفظ معنى المجيء بسلطان الرب وتمثيله، كما يصون صلة العبارة بالمزمور.
- source_word: κυρίου
  choice: الرب
  rationale: المقابل العربي الكتابي المعتاد لـκύριος في هذه الصيغة الاقتباسية.
theological_decisions:
- issue: هل تُصرَّح هوية الآتي بوصفه المسيح أو الملك؟
  choice: الإبقاء على «مبارك الآتي باسم الرب» من غير إضافة «المسيح» أو «الملك».
  alternative: «مبارك المسيح الآتي باسم الرب» أو «مبارك الملك الآتي باسم الرب».
  rationale: للعبارة دلالة مسيانية في السياق، لكنها تردد مزمور 118:26، والنص اليوناني هنا لا يضيف لقبًا صريحًا؛ لذلك تحفظ الترجمة قوة التلميح ولا تحسمه بإضافة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. اختير «يهتفون» بدل «يصرخون» لأنه أنسب لهتاف جماعي احتفالي، مع الحفاظ على الاستمرار بواسطة «كانوا». وُضعت علامتا الحاشية بعد فعل الهتاف لأن الأولى تشرح لفظ الهتاف والثانية تربط مضمون الهتاف بالمزمور.
