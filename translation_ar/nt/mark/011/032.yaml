source:
  edition: SBLGNT
  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: ar
  text: '«لكن إن قلنا: مِنَ الناس[a]؟»—فقد كانوا يخافون الجمع، لأن الجميع كانوا يرون أن يوحنا كان حقًّا نبيًّا.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مِنَ البشر»، أو بتفسير أوضح: «مصدرها بشري».'
    reason: lexical_alternative
  - marker: b
    text: 'ويمكن أيضًا ترجمة العبارة: «لأن الجميع كانوا يعدّون يوحنا نبيًّا بالفعل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكن
  rationale: أداة استدراك تعرض الفرع البديل من مداولتهم، من غير إضافة شرح غير موجود في اليونانية.
- source_word: εἴπωμεν
  choice: إن قلنا
  rationale: صيغة الماضي الالتزامي هنا واقعة في مداولة؛ والتركيب الشرطي العربي ينقل البديل المفترض بصورة طبيعية.
- source_word: Ἐξ ἀνθρώπων
  choice: مِنَ الناس
  rationale: يحافظ على صورة المصدر في العبارة اليونانية وعلى المقابلة الضمنية بين المصدر البشري والمصدر الإلهي، من غير تحويلها في المتن إلى شرح تفسيري.
- source_word: ἐφοβοῦντο
  choice: كانوا يخافون
  rationale: ينقل دلالة الخوف والحالة المستمرة أو الظرفية التي تفيدها صيغة الناقص.
- source_word: τὸν ὄχλον
  choice: الجمع
  rationale: لفظ عربي فصيح واضح يدل على جماعة الناس المحتشدة في المشهد، من غير أن يضيف وصفًا غير وارد.
- source_word: ἅπαντες
  choice: الجميع
  rationale: ينقل المعنى الاستغراقي للفظ اليوناني من دون إضافة اسم مثل «الناس».
- source_word: γὰρ
  choice: لأن
  rationale: يبيّن أن ما بعده هو سبب خوفهم من الجمع.
- source_word: εἶχον
  choice: كانوا يرون أن
  rationale: الفعل هنا يدل على اعتقاد أو تقدير ثابت بشأن يوحنا، لا على مجرد الامتلاك؛ وهذه الصياغة طبيعية في العربية.
- source_word: ὄντως ὅτι
  choice: أن يوحنا كان حقًّا
  rationale: يحفظ أداة مضمون الاعتقاد وقوة التوكيد في ὄντως، مع إبقاء الحكم داخل منظور الجميع المذكورين في الجملة.
- source_word: προφήτης
  choice: نبيًّا
  rationale: خبر يدل على صفة يوحنا ومكانته في اعتقاد الجمع، وصيغة النكرة العربية ملائمة للتركيب.
theological_decisions:
- issue: مصدر معمودية يوحنا أو سلطانه في عبارة Ἐξ ἀνθρώπων
  choice: مِنَ الناس
  alternative: 'مِنَ البشر؛ أو، بتفسير أوضح: مصدرها بشري'
  rationale: العبارة تقابل ضمنًا المصدر البشري بالمصدر الإلهي. ويحافظ المتن على التعبير المصدري الموجز، بينما يرد التفسير الصريح في الحاشية.
- issue: قوة حكم الجمع على يوحنا في ὄντως ὅτι προφήτης ἦν
  choice: الجميع كانوا يرون أن يوحنا كان حقًّا نبيًّا
  alternative: الجميع كانوا يعدّون يوحنا نبيًّا بالفعل
  rationale: الصياغة المختارة تنقل اقتناع الجمع المؤكد بنبوة يوحنا، لكنها لا تحوّل التقرير عن اعتقادهم إلى تصريح مستقل بصوت الراوي. ويُحفظ الوجه التركيبي البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ انقطاع المداولة بعد السؤال بالشرطة الطويلة، كما حُفظت الإحالة إلى خوفهم من الجمع وتعليلها من غير استكمال صريح لما كانوا يتوقعونه لو أجابوا «مِنَ الناس».
