    issue: «وأنا أيضًا لا أقول لكم» بدلًا من المقابلة النافية الصريحة.
    rationale: Οὐδὲ ἐγώ تعني «ولا أنا» أو «ولا أنا أيضًا»، وهي جواب نافٍ موازٍ لعبارة «لا نعرف». أما «وأنا أيضًا» فمفهومة مع النفي اللاحق، لكنها قد تبرز معنى الإضافة أكثر من معنى «ولا/كذلك لا» المقصود في الرد البلاغي.
