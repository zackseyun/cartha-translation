base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: ar
  text: 'فأجابوا يسوع قائلين: «لا نعرف». فقال لهم يسوع: «ولا أنا أقول لكم بأي سلطان أفعل هذه الأمور».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: فأجابوا
  rationale: ينقل اسم الفاعل اليوناني بوصفه فعلًا سرديًّا طبيعيًّا في العربية، مع إبقاء صلته المباشرة بجوابهم.
- source_word: λέγουσιν / λέγει / λέγω
  choice: فأجابوا / فقال / أقول
  rationale: صيغ القول حاضرة سرديًّا في اليونانية، لكن الماضي هو الأسلوب العربي الطبيعي في سرد الحدث؛ أما «أقول» فتبقى في الحاضر لأنها واردة في كلام يسوع المباشر.
- source_word: Οὐκ οἴδαμεν
  choice: لا نعرف
  rationale: تعبير عربي مباشر عن النفي ذي المعنى الحاضر، ويحافظ على إيجاز جوابهم.
- source_word: Οὐδὲ ἐγὼ
  choice: وأنا أيضًا لا
  rationale: يحفظ المقابلة البلاغية بين امتناعهم عن تقديم جواب وامتناع يسوع عن إخبارهم، بصياغة عربية واضحة.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: بأي سلطان
  rationale: الباء تعبّر طبيعيًّا عن الأساس أو الصلاحية التي تُمارس بها الأفعال، و«سلطان» يشمل معنى الحق والقدرة المخوَّلة دون حصره في القوة وحدها.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: يحافظ على صيغة الجمع ويشير طبيعيًّا إلى أفعال يسوع وتعليمه موضوع السؤال.
- source_word: ποιῶ
  choice: أفعل
  rationale: ينقل المضارع اليوناني بصيغة عربية مباشرة وطبيعية.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة ذات نبرة سردية موقرة. استُخدم الماضي في إطار السرد وفق المألوف العربي، مع إبقاء المضارع داخل القول المباشر. لا حاجة إلى حاشية للاختلاف بين «بأي سلطان» و«بأي سلطة»، لأن «بأي سلطان» ينقل المعنى بوضوح ودون إزالة غموض حقيقي.
