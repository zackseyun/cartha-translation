  verdict: revise
  source_fidelity: النص ينقل جوابهم وإنكارهم للمعرفة، ثم رفض يسوع أن يبيّن أساس سلطانه في فعل «هذه الأمور»، مع الحفاظ على الجمع في ταῦτα. لكن «وأنا أيضًا» أضعف في العربية من المقابلة النافية الصريحة في Οὐδὲ ἐγώ («ولا أنا/ولا أنا أيضًا»).
  naturalness: الصياغة فصيحة ومفهومة عمومًا. إضافة «قائلين» بعد «أجابوا يسوع» تجعل صلة فعل الجواب بالكلام المباشر أوضح وأشد سلاسة في السرد العربي.
  terminology: «سلطان» اختيار مناسب لـἐξουσία في هذا السياق، و«بأي سلطان» تؤدي معنى الأساس أو التفويض الذي يُفعل به الأمر. ولا يلزم وضع حاشية للبديل «بأي سلطة».
  issues:
