  rationale: أنسب للسياق الداودي السلالي من «حُكم» أو «مُلك»، مع بقائها مفهومة وطبيعية في العربية المعاصرة.
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: أبينا داود
  rationale: يحفظ اللقب النسبي التكريمي، وتدل الإضافة في الجملة على ارتباط المملكة بداود.
- source_word: Ὡσαννὰ
