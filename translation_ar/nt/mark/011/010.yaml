  choice: 'إبقاء العبارة كما هي: «مملكة أبينا داود الآتية» من دون إضافة وصف «المسيانية».'
  alternative: «مملكة أبينا داود المسيانية الآتية»
  rationale: السياق يوحي بتوقع مسياني، لكن النص اليوناني لا يصرّح بهذا الوصف؛ لذلك تُحفظ الإشارة والتوتر اللاهوتي من غير تفسير زائد داخل المتن.
