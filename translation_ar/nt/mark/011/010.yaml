  rationale: نقل صوتي للهتاف التعبدي المستقر في الاستعمال الكتابي؛ ويُذكر أصله الدلالي بوصفه طلبًا للخلاص في الحاشية.
- source_word: ἐν τοῖς ὑψίστοις
  choice: في الأعالي
  rationale: تعبير عربي موجز ومألوف يحفظ صورة أعلى المواطن أو السماوات من دون زيادة تفسيرية.
theological_decisions:
