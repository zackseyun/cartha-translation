  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: ar
  text: وبسط كثيرون ثيابهم على الطريق، وفرش آخرون أغصانًا مورقة[a] قطعوها من الحقول.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نباتًا مقطوعًا»؛ فالكلمة اليونانية أوسع دلالة من «الأغصان»، وتشير إلى كتل من الأوراق أو النبات المقطوع، ولا تخص سعف النخيل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: كثيرون
  rationale: ينقل الصفة الكمية مباشرة من غير إضافة توكيد غير وارد في اليونانية.
- source_word: ἱμάτια
  choice: ثيابهم
  rationale: «الثياب» تعبير عربي واضح وطبيعي، ويشير السياق إلى الثياب الخارجية التي بسطها الناس على الطريق.
- source_word: ἔστρωσαν
  choice: بسط
  rationale: الفعل يدل على المدّ أو الفرش، و«بسط» ملائم للثياب في هذا السياق.
- source_word: εἰς τὴν ὁδόν
  choice: على الطريق
  rationale: مع فعل البسط، تدل العبارة اصطلاحيًا على وضع الثياب فوق سطح الطريق.
- source_word: ἄλλοι δὲ
  choice: وفرش آخرون
  rationale: تنقل الواو الإضافة مع المقابلة الخفيفة، وتكرار «فرش» يصرّح بالفعل المحذوف تقديرًا في اليونانية ويجعل العربية سلسة.
- source_word: στιβάδας
  choice: أغصانًا مورقة
  rationale: تشير الكلمة إلى كتل من النبات المقطوع أو الأغصان ذات الورق؛ وهذه الصياغة توضح الصورة من غير تخصيصها بسعف النخيل.
- source_word: κόψαντες
  choice: قطعوها
  rationale: ينقل اسم الفاعل الدال على فعل سابق بصلة فعلية عربية طبيعية.
- source_word: ἐκ τῶν ἀγρῶν
  choice: من الحقول
  rationale: ترجمة مباشرة واضحة للحقول أو الأراضي المفتوحة التي أُخذ منها النبات.
