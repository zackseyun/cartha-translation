  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: ar
  text: 'الحق أقول لكم: مَن قال لهذا الجبل: «اُرفَعْ وأُلْقَ في البحر»، ولم يشكّ في قلبه[a]، بل يؤمن بأن ما يقوله يحدث[b]، فسيكون له ذلك.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولم يتردد»، أو: «ولم ينقسم في داخله»؛ فالفعل اليوناني قد يدل على الشك أو التردد والانقسام الداخلي.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بأن ما يقوله آخذ في الحدوث»، أو: «بأن ما يقوله يتحقق». يستعمل النص اليوناني فعلًا في صيغة المضارع قبل جملة النتيجة المستقبلية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صيغة عربية فصيحة وطبيعية تنقل افتتاح القول المؤكد والمهيب، من غير إبقاء «آمين» بصفتها لفظًا غير مترجم.
- source_word: ὃς ἂν εἴπῃ
  choice: مَن قال
  rationale: تنقل أداة الشرط العامة مع صيغة الاحتمال في اليونانية على نحو عربي موجز وطبيعي.
- source_word: τῷ ὄρει τούτῳ
  choice: لهذا الجبل
  rationale: تحافظ على معنى «الجبل» وعلى اسم الإشارة الذي يمنح الصورة حضورًا مباشرًا.
- source_word: Ἄρθητι
  choice: ارتفع
  rationale: ينقل صورة رفع الجبل من موضعه بصيغة أمر موجزة؛ وصيغة المطاوعة العربية طبيعية في خطاب غير العاقل.
- source_word: βλήθητι εἰς τὴν θάλασσαν
  choice: وانطرح في البحر
  rationale: يحافظ على قوة صورة إلقاء الجبل في البحر وعلى البنية المبنية للمجهول دلاليًا، بعبارة عربية واضحة.
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: ولم يشكّ في قلبه
  rationale: «يشكّ» هو المعنى السياقي الأوضح، مع إبقاء «في قلبه» حفاظًا على تصوير القلب مركزًا للداخل الإنساني؛ ويُذكر معنى التردد والانقسام الداخلي في الحاشية.
- source_word: πιστεύῃ
  choice: آمن
  rationale: يحافظ على الصلة المعجمية المباشرة بمجال الإيمان، وهو الأنسب في مقابلة الشك هنا.
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: بأن ما يقوله يحدث
  rationale: يحافظ على المضارع اليوناني دون تحويله صراحة إلى مستقبل، كما يبقي العبارة قابلة لفهم الحدوث الجاري أو المتحقق بحسب السياق.
- source_word: ἔσται αὐτῷ
  choice: فسيكون له ذلك
  rationale: ينقل جملة النتيجة المستقبلية مع الحفاظ على انفتاح التعبير اليوناني دون تحديد آلية تحقق القول.
theological_decisions:
- issue: طبيعة الوعد المتعلق بالإيمان والقول
  choice: نقل القول بشرطه وصورته القوية كما ورد، دون إضافة قيود عقائدية أو تفسيره في المتن بأنه مجرد مجاز.
  alternative: تخفيف العبارة إلى مبالغة مجازية فقط، أو توسيعها إلى وعد مطلق غير مشروط.
  rationale: النص نفسه يربط النتيجة بالإيمان وعدم الشك ويستعمل صورة شديدة القوة، لكنه لا يعرض في هذه الآية وحدها نظامًا لاهوتيًا تفصيليًا؛ لذلك تُحفظ قوة القول وتوتره.
- issue: المذكر المفرد في αὐτοῦ وαὐτῷ
  choice: في قلبه / له
  alternative: في القلب / لهم
  rationale: يحافظ المذكر المفرد على الصيغة النحوية التمثيلية في اليونانية من غير تسوية إلى جمع محايد.
- issue: زمن γίνεται وعلاقته بالمستقبل ἔσται
  choice: يحدث
  alternative: سيحدث أو يحدث الآن
  rationale: استعمال المضارع العربي يحفظ، قدر الإمكان، المضارع في المصدر قبل جملة النتيجة المستقبلية، من غير حسم دلالته في مستقبل صريح أو سيرورة جارية حصرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعملت «الحق أقول لكم» بوصفها صيغة مألوفة للقول المؤكد، وحُفظت الصورة الحية للجبل والبحر. وُضعت علامتا الحاشية [a] و[b] في المتن في موضعيهما.
