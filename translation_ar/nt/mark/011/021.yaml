base_translation:
  language: en
  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: ar
  text: 'فتذكّر بطرس فقال له: «يا رابّي، انظر! شجرة التين التي لعنتَها قد يبست[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد جفّت». يمكن أن يدل الفعل اليوناني على الجفاف أو اليبس، وصيغة التام تشدّد على النتيجة الحاضرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: فتذكَّر
  rationale: ينقل اسم الفاعل اليوناني الدال على التذكّر بصياغة عربية طبيعية، مع إبقاء التذكّر مرتبطًا بكلام بطرس.
- source_word: λέγει
  choice: وقال
  rationale: الفعل مضارع تاريخي شائع في سرد مرقس؛ والماضي هو الأسلوب السردي الطبيعي في العربية الفصحى الحديثة، من غير تغيير في تسلسل الحدث.
- source_word: αὐτῷ
  choice: له
  rationale: يحافظ على الضمير الوارد في اليونانية من غير التصريح باسم يسوع، إذ يتضح مرجعه من السياق.
- source_word: Ῥαββί
  choice: رَبِّي
  rationale: تعريب للقب العبري المنقول في النص اليوناني، يحافظ على البيئة اليهودية وصيغة النداء، ولا يستبدله تفسيرًا مثل «يا معلّم».
- source_word: ἴδε
  choice: انظر
  rationale: أمر واضح وطبيعي ينقل لفت الانتباه المباشر في النص.
- source_word: συκῆ
  choice: شجرة التين
  rationale: المقصود في السياق هو الشجرة لا ثمر التين، وهذه العبارة أوضح في العربية.
- source_word: κατηράσω
  choice: لعنتَها
  rationale: ينقل مباشرة فعل المخاطب المفرد وإحالة الضمير إلى شجرة التين.
- source_word: ἐξήρανται
  choice: قد يبست
  rationale: «يبست» ملائمة للشجرة، و«قد» مع الماضي تعبّر عن وقوع الفعل وبقاء نتيجته، وهو ما يبرزه التام اليوناني.
