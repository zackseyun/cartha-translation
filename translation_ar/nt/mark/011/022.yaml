translation:
  language: ar
  text: 'فأجابهم يسوع: «ليكن لكم إيمان بالله».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكبر: «ليكن لكم إيمان الله». وقد تُفهم أيضًا: «لتكن لكم أمانة الله» أو «ليكن لكم إيمان من الله».'
    reason: تحفظ الحاشية غموض تركيب πίστιν θεοῦ في اليونانية، إذ قد يدل المضاف إليه على موضوع الإيمان أو مصدره أو ما يخص الله.
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: فأجابهم
  rationale: اسم الفاعل اليوناني يؤدي وظيفة تمهيدية لردٍّ كلامي؛ وصيغة الفعل الماضي في العربية أفصح في السرد، كما أن الضمير «هم» يعبّر عن αὐτοῖς من غير تثقيل.
- source_word: λέγει
  choice: فأجابهم يسوع
  rationale: الفعل مضارع تاريخي في اليونانية، وقد دُمج مع ἀποκριθεὶς في عبارة عربية طبيعية تجنّب التكرار الثقيل «أجاب وقال»، مع الحفاظ على فعل الرد والكلام.
- source_word: Ἔχετε
  choice: ليكن لكم
  rationale: صيغة أمر تدعو إلى اتصاف مستمر؛ و«ليكن لكم» تحافظ على تركيب امتلاك الإيمان وعلى الاسم التالي، بخلاف «آمنوا» التي تحوّل الاسم إلى فعل وتخفي جانبًا من غموض العبارة.
- source_word: πίστιν
  choice: إيمان
  rationale: «إيمان» المقابل العربي الطبيعي للاسم πίστις هنا، ويلائم سياق الثقة بالله من غير تحويل المعنى إلى «أمانة» في المتن.
- source_word: θεοῦ
  choice: بالله
  rationale: تفيد الباء تعلّق الإيمان بالله بوصفه موضوعه، وهو المعنى الأرجح في سياق التعليم عن الإيمان والصلاة؛ أما دلالة الإضافة المحتملة في الأصل فحُفظت في الحاشية.
theological_decisions:
- issue: غموض المضاف إليه في πίστιν θεοῦ
  choice: الإيمان بالله، أي توجيه الإيمان إلى الله
  alternative: إيمان الله؛ وقد تُفهم أيضًا بمعنى أمانة الله أو إيمان آتٍ من الله
  rationale: سياق ذبول شجرة التين وما يليه من تعليم عن الإيمان والصلاة يرجّح أن الوصية تحث التلاميذ على الإيمان بالله. لكن الصياغة اليونانية الموجزة تحتمل أكثر من علاقة إضافية، لذلك لم تُحذف البدائل بل ذُكرت في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموقّرة. استُخدمت صيغة «ليكن لكم إيمان» بدل «آمنوا» للموازنة بين السلاسة والمحافظة على البنية الاسمية والغموض الحقيقي في الأصل.
