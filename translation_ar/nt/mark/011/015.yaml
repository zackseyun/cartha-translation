source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: ar
  text: وجاءوا إلى أورشليم. ولما دخل الهيكل[a]، شرع يطرد الذين كانوا يبيعون والذين كانوا يشترون في الهيكل، وقلب موائد الصيارفة ومقاعد باعة الحمام.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ساحات الهيكل» أو «نطاق الهيكل»؛ فاللفظ اليوناني يشير إلى مجمّع الهيكل عمومًا، لا إلى المقدس الداخلي تحديدًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: جاءوا
  rationale: المضارع التاريخي اليوناني يُنقل بالماضي في السرد العربي الطبيعي، مع الحفاظ على تعاقب الأحداث.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الصيغة العربية الكتابية المألوفة لاسم المدينة.
- source_word: εἰσελθὼν
  choice: ولما دخل
  rationale: ينقل اسم الفاعل الأوريستي بوصفه فعلاً سابقًا للفعل الرئيس، في صياغة عربية طبيعية دون إفراط في تفسير الفاصل الزمني.
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: الهيكل
  rationale: لفظ ἱερόν يدل هنا على مجمّع الهيكل الأوسع، لا على المقدس الداخلي تحديدًا؛ أُبقي التعبير المألوف في المتن ووُضّح مداه في الحاشية.
- source_word: ἤρξατο ἐκβάλλειν
  choice: شرع يطرد
  rationale: يحفظ معنى ابتداء الفعل وصيغة الإخراج القوية في عربية فصيحة وطبيعية.
- source_word: τοὺς πωλοῦντας / τοὺς ἀγοράζοντας
  choice: الذين كانوا يبيعون والذين كانوا يشترون
  rationale: يحفظ التوازي بين اسمي الفاعل ودلالتهما على نشاط جارٍ.
- source_word: κολλυβιστῶν
  choice: الصيارفة
  rationale: تعبير عربي موجز ومألوف لمن كانوا يبدّلون النقود.
- source_word: καθέδρας
  choice: مقاعد
  rationale: لفظ عام دقيق لا يحدد هيئة المقاعد بما يتجاوز الأصل.
- source_word: περιστερὰς
  choice: الحمام
  rationale: اللفظ العربي الطبيعي للطير المقصود في سياق الذبائح، من غير تقييد بنوع أدق لا يفرضه السياق.
- source_word: κατέστρεψεν
  choice: قلب
  rationale: ينقل بوضوح وقوة فعل إطاحة الموائد والمقاعد في سياقه.
theological_decisions:
- issue: مدى مدلول ἱερόν في رواية تطهير الهيكل
  choice: الهيكل في المتن، بمعنى مجمّع الهيكل
  alternative: ساحات الهيكل أو نطاق الهيكل
  rationale: يشير اللفظ اليوناني إلى المنطقة الأوسع التابعة للهيكل، لا إلى المقدس الداخلي وحده. يحافظ المتن على التعبير العربي المألوف، وتمنع الحاشية الفهم المكاني الأضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «شرع يطرد» لإبراز بدء الفعل، وحُفظ تكرار «الهيكل» والتوازي بين البائعين والمشترين بما يقارب بنية الأصل من غير تكلّف.
