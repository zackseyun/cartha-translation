  source_fidelity: الترجمة تنقل البنية الشرطية والتقابل بين غفران المخاطَبين وغفران الآب بأمانة، وتحافظ على زمن المستقبل في جواب الشرط. غير أن «زلّاتكم» قد توحي في الاستعمال العربي المعاصر بهفوات صغيرة أو غير مقصودة، وهي أضعف من παράπτωματα في هذا السياق الأخلاقي.
  naturalness: 'الصياغة مفهومة وفصيحة، لكن ترتيب النفي مع «أيضًا» في «فأبوكم ... لا يغفر لكم ... أيضًا» أقل سلاسة من تقديم «لا» على الفعل في جواب الشرط: «فلا يغفر ... أيضًا».'
  terminology: «يغفر» مقابل دقيق ومتسق للفعل ἀφίημι. ويُفضَّل «تعدياتكم» لـ παράπτωματα، إذ يحفظ معنى التجاوز أو الانحراف الأخلاقي من دون التخفيف الذي قد تحمله «زلّات».
  issues:
