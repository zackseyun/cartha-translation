    issue: اختيار «زلّاتكم» لـ παράπτωματα
    rationale: «زلّات» قد تُفهم عادةً على أنها هفوات يسيرة؛ أما اللفظة اليونانية فتدل في هذا السياق على تعديات أو تجاوزات أخلاقية. «تعدياتكم» أوفى بالدلالة وأقرب إلى سجل الآية.
  - severity: low
    issue: موضع «أيضًا» وصياغة جواب الشرط
    rationale: إعادة الصياغة إلى «فلا يغفر لكم أبوكم ... تعدياتكم أيضًا» أوضح في إظهار مقابلة οὐδέ («ولا هو أيضًا») وأكثر انسيابًا بالعربية.
