  text: Εἰ δὲ ὑμεῖς οὐκ ἀφίετε, οὐδὲ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφήσει τὰ παραπτώματα ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: ar
  text: ولكن[a] إن كنتم لا تغفرون، فلا يغفر لكم أبوكم الذي في السماوات تعدياتكم أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية غير موجودة في أقدم المخطوطات اليونانية، ومنها السينائية والفاتيكانية من القرن الرابع، ولا في النسخ القبطية المبكرة؛ لكنها موجودة في غالبية المخطوطات البيزنطية، وفي التقليد اللاتيني، وفي معظم الشواهد السريانية. ويُرجَّح أن نُسّاخًا متأخرين أضافوها لموافقة كلام يسوع في متى 6:15.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: يغفر
  rationale: الفعل «غفر» هو المقابل العربي الطبيعي والدقيق في سياق إساءات البشر وغفران الله، ويحافظ على تكرار الفعل اليوناني في شطري الآية.
- source_word: παράπτωμα
  choice: زلّات
  rationale: «زلّات» تنقل صورة الانحراف أو الخطوة الخاطئة الكامنة في اللفظة اليونانية، مع تمييزها عن اللفظ الأعم «خطايا».
- source_word: οὐδέ
  choice: لا... أيضًا
  rationale: هذه الصياغة العربية الطبيعية تؤدي معنى «ولا كذلك» وتُبرز المقابلة بين عدم غفران المخاطَبين وعدم غفران الآب.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: الذي في السماوات
  rationale: ترجمة مباشرة تحفظ صيغة الجمع في النص اليوناني، وتُبقي العبارة وصفًا للآب.
theological_decisions:
- issue: العلاقة بين غفران الإنسان وغفران الآب
  choice: الإبقاء على العبارة الشرطية كما وردت من غير شرح لطبيعة العلاقة
  alternative: صياغتها بما يفيد أن غفران الإنسان سبب استحقاقي لغفران الله، أو أنه مجرد دليل عليه
  rationale: النص يقرر المقابلة بوضوح لكنه لا يشرح هنا طبيعتها اللاهوتية؛ لذلك ينبغي عدم حسم ما تركه النص دون تفسير.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «ولكن» لربط الاستدراك بالسياق السابق، و«زلّاتكم» للمحافظة على الدلالة الخاصة للفظة اليونانية بدل تعميمها إلى «خطاياكم».
