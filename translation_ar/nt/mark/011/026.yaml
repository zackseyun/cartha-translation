- from: ولكن[a] إن كنتم لا تغفرون، فأبوكم الذي في السماوات لا يغفر لكم زلّاتكم أيضًا.
  to: ولكن[a] إن كنتم لا تغفرون، فلا يغفر لكم أبوكم الذي في السماوات تعدياتكم أيضًا.
  rationale: استُبدلت «زلّاتكم» بـ«تعدياتكم» لتأدية الدلالة الأخلاقية الأقوى لـ παράπτωματα دون تسويتها بـ«خطايا». وأعيد ترتيب جواب الشرط ليبرز النفي والمقابلة التي تفيدها οὐδέ بصياغة عربية طبيعية. وحُدّثت عبارة الحاشية من «الترجمات القبطية» إلى «النسخ القبطية» لتكون أدق في وصف الشواهد النصية، مع الإبقاء على حكمها النقدي بصيغة غير جازمة.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:21:05Z'
