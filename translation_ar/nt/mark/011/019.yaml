  text: And whenever evening came, they would go out of the city.
translation:
  language: ar
  text: وكلما حلّ المساء، كانوا يخرجون من المدينة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: كلما
  rationale: مع الفعل الناقص الدال على الاستمرار أو التكرار، تفيد الأداة هنا وقوع الفعل على نحو اعتيادي متكرر، وهو ما تعبّر عنه «كلما» بوضوح.
- source_word: ὀψὲ ἐγένετο
  choice: حلّ المساء
  rationale: تعبير عربي طبيعي يحفظ معنى العبارة اليونانية، أي مجيء وقت المساء أو صيرورة الوقت متأخرًا.
- source_word: ἐξεπορεύοντο
  choice: كانوا يخرجون
  rationale: صيغة الماضي الناقص في السياق تُرجّح الفعل الاعتيادي المتكرر، ويؤدي تركيب «كانوا يخرجون» هذا المعنى في العربية.
- source_word: ἔξω τῆς πόλεως
  choice: من المدينة
  rationale: مع فعل «يخرجون»، يدل حرف الجر «من» طبيعيًا على الحركة إلى خارج المدينة من غير حشو.
- source_word: πόλεως
  choice: المدينة
  rationale: النص اليوناني يقول «المدينة» ولا يسمّي أورشليم صراحة، لذلك تُحفظ صياغة المصدر.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «كلما... كانوا يخرجون» لإبراز التكرار الاعتيادي، مع الحفاظ على عدم تسمية المدينة كما في اليونانية.
