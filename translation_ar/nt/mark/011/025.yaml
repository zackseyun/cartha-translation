base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: ar
  text: وكلما وقفتم تصلّون، فاغفروا إن كان لكم شيء على أحد، لكي يغفر لكم أيضًا أبوكم الذي في السماوات[a] تعدياتكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «أبوكم الذي في السماء». والنص اليوناني يقول حرفيًا: «في السماوات» بصيغة الجمع.'
    reason: lexical_alternative
  - marker: b
    text: 'ويجوز: «زلّاتكم» أو «إساءاتكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε
  choice: وقفتم
  rationale: يحفظ صورة الوقوف الملموسة، ومع «كلما» يدل طبيعيًا على الفعل المعتاد من غير اختزاله في مجرد «حين تصلّون».
- source_word: προσευχόμενοι
  choice: تصلّون
  rationale: جاء بصيغة فعل حالي ملازم للوقوف، وهو تعبير عربي واضح يحفظ تزامن الصلاة مع الوقوف.
- source_word: ἀφίετε
  choice: فاغفروا
  rationale: المعنى في هذا السياق العلاقي هو الصفح عن الإساءة، كما يحافظ الاختيار على الصلة بالفعل نفسه المنسوب إلى الآب لاحقًا.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: إن كان لكم شيء على أحد
  rationale: تعبير عربي طبيعي يحفظ عموم τι وτινος، ويدل على وجود شكوى أو ضغينة تجاه شخص ما دون تضييق المعنى.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: أبوكم الذي في السماوات
  rationale: يحفظ صيغة الجمع الصريحة في οὐρανοῖς، مع تركيب عربي واضح ومفهوم.
- source_word: ἀφῇ
  choice: لكي يغفر لكم أيضًا
  rationale: «لكي» تنقل غرض ἵνα وارتباطه بما قبله، و«أيضًا» تحفظ καί التي تصل غفران الآب بغفران المخاطَبين.
- source_word: παραπτώματα
  choice: زلّاتكم
  rationale: «الزلّات» تعبّر عن معنى العثرة أو التعدّي والإساءة، وتحافظ على قدر من التمييز عن اللفظ العام للخطايا.
theological_decisions:
- issue: العلاقة الشرطية بين غفران الإنسان وغفران الله
  choice: 'أُبقيت العبارة غرضية مباشرة: «فاغفروا... لكي يغفر لكم أيضًا» من غير تخفيف للرابطة النصية.'
  alternative: صياغتها على أن غفران الآخرين مجرد دليل على الغفران الإلهي، أو جعل الجملة نتيجة ضعيفة لا غرضًا مرتبطًا بالأمر.
  rationale: تقيم ἵνα مع صيغة ἀφῇ رابطة حقيقية بين غفران الآخرين وغفران الآب؛ لذلك تحافظ الترجمة على هذا التوتر اللاهوتي من غير فرض تفسير مذهبي عليه.
translation_notes:
  register: 'لغة عربية فصحى حديثة، واضحة ووقورة. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحهما الحاشيتان: «السماوات» و«زلّاتكم».'
