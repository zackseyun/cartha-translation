    rationale: فعل «صلّى» في هذا السياق يحتاج إلى متعلَّق أو إلى تركيب يبيّن أن الصلاة بشأن المطلوب؛ أما اليونانية فتسمح بتجاور «تصلّون وتطلبون» تحت نطاق «كل ما». لذلك يلزم في العربية بيان العلاقة بعبارة «تصلّون من أجله».
  - severity: low
    issue: «فيكون لكم» أضعف في إظهار مستقبل «ἔσται».
    rationale: يجوز التركيب بعد الأمر، لكن «فسيكون لكم» ينقل المستقبل الصريح بصورة أوضح وأفصح في هذا السياق.
