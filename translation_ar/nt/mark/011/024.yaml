base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: ar
  text: 'لِذَلِكَ أَقُولُ لَكُمْ: كُلُّ مَا تُصَلُّونَ مِنْ أَجْلِهِ وَتَطْلُبُونَهُ، آمِنُوا أَنَّكُمْ قَدْ نِلْتُمُوهُ[a]، فَسَيَكُونُ لَكُمْ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'في بعض المخطوطات قراءة يمكن ترجمتها: «أنكم تنالونه»، بدلًا من «أنكم قد نلتموه». أمّا النص اليوناني المعتمد هنا فيقرأ بصيغة الماضي، محافظًا على معنى الفعل المكتمل.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لذلك
  rationale: تعبير سببي استنتاجي يصل القول بما سبقه بوضوح وإيجاز.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: يحافظ على صيغة الخطاب المباشر وسلطان المتكلم، وهو طبيعي في العربية الفصحى المعاصرة.
- source_word: πάντα ὅσα
  choice: كل ما
  rationale: ينقل الشمول الذي تفيده العبارة اليونانية بصياغة عربية طبيعية.
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: تصلّون وتطلبونه
  rationale: 'يحافظ على الفعلين المتميزين: الصلاة والطلب، مع إلحاق الضمير بالفعل الثاني لتستقيم العبارة العربية.'
- source_word: πιστεύετε
  choice: آمنوا
  rationale: صيغة أمر تنقل معنى التصديق الإيماني المتعلق بمضمون الجملة التالية.
- source_word: ὅτι ἐλάβετε
  choice: أنكم قد نلتموه
  rationale: تنقل ὅτι بوصفها أداة لمضمون الإيمان، وتحافظ «قد نلتموه» على دلالة الفعل المكتمل في صيغة الماضي اليونانية.
- source_word: καὶ ἔσται ὑμῖν
  choice: فيكون لكم
  rationale: ينقل النتيجة المستقبلية وعلاقة الاختصاص أو الحصول دون تفسير زائد لطبيعتها.
theological_decisions:
- issue: القوة الزمنية لاستجابة الصلاة وعلاقتها بالإيمان
  choice: 'الإبقاء على التتابع المفارق: «آمنوا أنكم قد نلتموه، فيكون لكم».'
  alternative: «آمنوا أنكم تنالونه، فيكون لكم».
  rationale: النص المعتمد يقرأ ἐλάβετε بصيغة الماضي، ولذلك تُحفظ دلالة الفعل المكتمل إلى جانب النتيجة المستقبلية، من غير تسوية التوتر أو إدخال تصور مذهبي محدد عن الصلاة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «نلتموه» بدل «استلمتموه» لأن الأول أفصح وأنسب لعطية أو استجابة، مع الحفاظ على المفارقة الزمنية في الأصل. وُضع موضع الحاشية مباشرة بعد العبارة التي تتناولها.
