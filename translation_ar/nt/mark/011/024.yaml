review_pass:
  verdict: revise
  source_fidelity: المسودة تحفظ البنية الأساسية للنص اليوناني، ولا سيما فعل الأمر «آمنوا»، ودلالة الفعل الماضي في «قد نلتموه»، والتتابع بين النيل المكتمل والنتيجة المستقبلية. لكن «كل ما تصلّون وتطلبونه» لا يبيّن في العربية متعلَّق «تصلّون» ويجعل العطف غير سليم الأسلوب. إضافة «من أجله» تستكمل المعنى الذي يقتضيه السياق من غير زيادة تفسيرية.
  naturalness: «كل ما تصلّون من أجله وتطلبونه» عربية فصحى واضحة وتحافظ على الفعلين اليونانيين. و«فسيكون لكم» أصرح في نقل المستقبل من «فيكون لكم» مع بقاء علاقة الاختصاص غير مفسرة.
  terminology: «آمنوا»، و«قد نلتموه»، و«فسيكون لكم» مناسبة للسجل العربي الفصيح وللمصطلحات في هذا الموضع. لا يلزم فرض تفسير مذهبي للعبارة.
  issues:
