  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: ar
  text: وفي اليوم التالي، حين خرجوا من بيت عنيا، جاع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: تحافظ الواو على استمرارية السرد وأسلوب مرقس العطفي من غير إثقال.
- source_word: τῇ ἐπαύριον
  choice: في اليوم التالي
  rationale: تعبير عربي طبيعي واضح يحفظ التتابع الزمني الذي يؤديه التركيب اليوناني استعمالًا ظرفيًّا.
- source_word: ἐξελθόντων αὐτῶν
  choice: حين خرجوا
  rationale: ينقل تركيب المضاف المطلق الدال على حدث سابق أو مصاحب زمنيًّا، ويحفظ صيغة الجمع؛ ولا تحتاج العربية هنا إلى صيغة الماضي الأسبق لأن العلاقة الزمنية واضحة من السياق.
- source_word: ἀπὸ Βηθανίας
  choice: من بيت عنيا
  rationale: تنقل ἀπό حركة الابتعاد عن المكان، و«بيت عنيا» هي الصيغة العربية الشائعة لاسم الموضع.
- source_word: ἐπείνασεν
  choice: جاع
  rationale: فعل عربي فصيح وطبيعي يعبّر بإيجاز عن وقوع الجوع، ويحفظ إسناد الفعل المفرد إلى يسوع من غير إضافة اسمه صراحة.
theological_decisions:
- issue: الفاعل المضمر في ἐπείνασεν
  choice: إبقاء الفاعل مستترًا في «جاع»، عائدًا سياقيًّا إلى يسوع
  alternative: التصريح بقول «جاع يسوع» أو استعمال «شعر بالجوع»
  rationale: اليونانية لا تذكر الاسم صراحة، والسياق يعيّن يسوع بوضوح. والفعل العربي يسمح بحفظ هذا الإيجاز، مع تقرير جوعه الإنساني الحقيقي من غير توسع عقائدي أو تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على عطف السرد بلفظ «و». لا حاجة إلى حاشية في هذه الآية.
