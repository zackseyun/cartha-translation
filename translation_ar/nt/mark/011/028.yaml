  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: ar
  text: 'وكانوا يقولون له: «بأي سلطان[a] تفعل هذه الأمور؟ أم مَن أعطاك هذا السلطان لتفعل هذه الأمور[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصيغة أقرب إلى اللفظ: «في أي سلطان».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حتى تفعل هذه الأمور».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: ينقل صيغة الماضي الناقص، بما فيها من دلالة على الكلام المستمر في ذلك الموقف، من غير تحويلها إلى ماضٍ بسيط.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: بأي سلطان
  rationale: تعبير عربي طبيعي يسأل عن أساس الحق أو التفويض الذي يُمارَس به الفعل، مع إبقاء صيغة السؤال محايدة.
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: سلطان / السلطان
  rationale: «السلطان» يؤدي معنى الحق أو الصلاحية المخوَّلة، ويلائم تحدي شرعية أفعال يسوع في هذا السياق أكثر من معنى القدرة المجردة.
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: تفعل هذه الأمور / لتفعل هذه الأمور
  rationale: يحافظ على جمع ταῦτα، الذي يشير على نحو واسع إلى الأفعال الجارية والسياق السابق، وينقل الصيغتين اليونانيتين بعربية سليمة.
- source_word: ἢ
  choice: أم
  rationale: لأنها تصل بين سؤالين مترابطين، والثاني يعيد صياغة التحدي من زاوية مصدر السلطان.
- source_word: τίς σοι ἔδωκεν
  choice: مَن أعطاك
  rationale: ينقل سؤال الفاعل وصيغة الماضي في ἔδωκεν بوضوح وطبيعية.
- source_word: ἵνα ταῦτα ποιῇς
  choice: لتفعل هذه الأمور
  rationale: صيغة موجزة وطبيعية بعد «أعطاك هذا السلطان»، وتبقي صلة الغاية أو التخويل التي قد تدل عليها ἵνα مع صيغة الاحتمال.
theological_decisions:
- issue: مصدر سلطان يسوع وطبيعته
  choice: صياغة سؤال القادة بوصفه تحديًا محايدًا لسلطان يسوع، من غير التصريح بأن مصدره إلهي.
  alternative: إضافة وصف مثل «سلطان إلهي» أو صياغة توحي مسبقًا بمصدره.
  rationale: الآية تعرض سؤال المعترضين ولا تقدّم في ألفاظها جواب الراوي؛ لذلك ينبغي إبقاء التوتر اللاهوتي وعدم حسمه داخل الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «سلطان» بالمعنى القانوني والتفويضي لا بمعنى الحاكم، و«أم» لربط السؤالين البديلين. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرانهما مباشرة.
