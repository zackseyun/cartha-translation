  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: ar
  text: 'وقال لهما: «اذهبا إلى القرية التي أمامكما، وفور دخولكما إليها ستجدان جحشًا[أ] مربوطًا لم يركبه أحد من الناس بعد[ب]. فحلّاه وائتيا به».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'أو: «حيوان فتيّ». تدل الكلمة اليونانية πῶλον على حيوان صغير؛ وفي هذا السياق يُفهم أنه جحش حمار.'
    reason: lexical_alternative
  - marker: ب
    text: 'حرفيًا: «لم يجلس عليه أحد من البشر بعد». تنص العبارة صراحةً على أن إنسانًا لم يركبه إلى الآن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: اذهبا
  rationale: فعل أمر بالذهاب موجَّه إلى تلميذين، فاستُعمل المثنى العربي الواضح.
- source_word: κώμην
  choice: القرية
  rationale: تدل الكلمة عادةً على تجمع سكاني أصغر من المدينة، و«القرية» هي المقابل العربي الطبيعي.
- source_word: τὴν κατέναντι ὑμῶν
  choice: التي أمامكما
  rationale: تنقل موقع القرية المقابل لهما بعبارة عربية طبيعية، مع إظهار المثنى.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτήν
  choice: وفور دخولكما إليها
  rationale: تحافظ العبارة على الدلالة الزمنية المباشرة لـ εὐθύς وعلى علاقة الحال بالدخول.
- source_word: εὑρήσετε
  choice: ستجدان
  rationale: مستقبل خبري مباشر، مصوغ بالمثنى بحسب المخاطَبَين.
- source_word: πῶλον
  choice: جحشًا
  rationale: πῶλος يعني دابة فتية، ويشير السياق هنا إلى صغير الحمار؛ و«جحش» تعبير عربي دقيق وطبيعي.
- source_word: δεδεμένον
  choice: مربوطًا
  rationale: ينقل حالة الحيوان الناتجة عن ربطه بوضوح.
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: لم يركبه أحد من الناس بعد
  rationale: «يركبه» هو التعبير العربي الطبيعي للجلوس على دابة، مع إبقاء الإشارة الصريحة إلى البشر في ἀνθρώπων والزمن الذي يفيده οὔπω.
- source_word: λύσατε
  choice: فحُلّاه
  rationale: أمر بفك رباط الجحش، مع ضمير المثنى للفاعلين وضمير المفرد للمفعول.
- source_word: φέρετε
  choice: وأتيا به
  rationale: يحافظ على المعنى العام «اجلباه» دون تخصيص كيفية إحضار الحيوان.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة، مع استعمال صيغ المثنى التي يقتضيها السياق. اختير «جحش» لأن السياق يحدد أن الدابة الفتية صغير حمار، وصيغ «لم يركبه» طبيعيًا بدل النقل الحرفي لـ«لم يجلس عليه».
