  verdict: approve
  source_fidelity: 'النص العربي ينقل بدقة بنية الآية ومعناها: جواب يسوع، ووعده بسؤال واحد، وأمره لهم بالإجابة، ثم وعده بإخبارهم بأساس سلطانه. ويحافظ «سأسألكم» و«أجيبوني» و«فأقول لكم» على المستقبل والأمر والتتابع الموجودين في اليونانية دون إضافة تفسيرية.'
  naturalness: الصياغة فصحى معاصرة سليمة وواضحة. الفصل بين «سأسألكم سؤالًا واحدًا» و«أجيبوني» مناسب عربيًا ويجعل الأمر والوعد التاليين واضحين. وعبارة «بأي سلطان أفعل هذه الأمور» طبيعية في هذا السياق.
  terminology: «يسوع» هو الاسم العربي المعياري، و«سلطان» مقابل راسخ ومناسب لـἐξουσία هنا، إذ يدل على المشروعية والتفويض لا على القدرة المجردة وحدها. كما أن «سؤالًا واحدًا» مناسب لسياق λόγον الذي يقتضي جوابًا، وتوضح الحاشية البدائل المعجمية دون إثقال المتن.
