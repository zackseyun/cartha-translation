source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: ar
  text: 'فقال لهم يسوع: «سأسألكم سؤالًا واحدًا[a]. أجيبوني، فأقول لكم بأي سلطان أفعل هذه الأمور.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أمرًا واحدًا»، وحرفيًا «كلمة واحدة».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تفيد الانتقال مع مسحة خفيفة من المقابلة في جواب يسوع، وتنساب طبيعيًا في السرد العربي.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم في نصوص العهد الجديد.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: نقل مباشر وطبيعي للفعل مع مفعوله غير المباشر.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: سأسألكم
  rationale: يحفظ صيغة المستقبل ويؤدي معنى طرح سؤال مضاد بعبارة عربية واضحة.
- source_word: ἕνα λόγον
  choice: سؤالًا واحدًا
  rationale: λόγος يعني حرفيًا قولًا أو كلمة، لكنه في هذا السياق أمر مطروح للإجابة، ولذلك يوضح «سؤالًا» المقصود من غير إخلال بالسياق.
- source_word: ἀποκρίθητέ μοι
  choice: أجيبوني
  rationale: أمر مباشر موجز يحفظ قوة صيغة الأمر في اليونانية.
- source_word: ἐρῶ ὑμῖν
  choice: فأقول لكم
  rationale: يحفظ الصلة المنطقية بين إجابتهم وما سيقوله يسوع، مع بقاء الصياغة قريبة من لفظ المصدر.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: بأي سلطان
  rationale: الباء تؤدي معنى الأساس أو التفويض الذي به يجري الفعل، و«سلطان» يحفظ البعد المؤسسي واللاهوتي للمصطلح.
- source_word: ταῦτα ποιῶ
  choice: أفعل هذه الأمور
  rationale: يحفظ المضارع والإشارة إلى الأفعال موضع النزاع بصياغة عربية طبيعية.
theological_decisions:
- issue: دلالة ἐξουσία في السياق
  choice: سلطان
  alternative: صلاحية أو حق
  rationale: السياق يناقش مصدر مشروعية أفعال يسوع، و«سلطان» أوسع من مجرد القدرة ويحفظ معنى الحق والتفويض دون حصره في قراءة مذهبية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. فُصل التصريح الأول عن الأمر بنقطة للمقروئية، واستُعملت الفاء قبل «أقول» لإظهار تتابع الجواب والوعد من غير تحويل العبارة إلى شرط صريح غير موجود لفظًا في الأصل.
