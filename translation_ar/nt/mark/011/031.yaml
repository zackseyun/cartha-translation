source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: ar
  text: 'فأخذوا يتداولون الأمر فيما بينهم قائلين: «ماذا نقول؟ إن قلنا: مِن السماء[a]، فسيقول: فلماذا إذًا لم تصدّقوه؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «مِن السماء» تعبير يهودي توقيري يعني «من الله» أو «من مصدر إلهي».
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: أخذوا يتداولون الأمر
  rationale: ينقل صيغة الماضي الناقص الدالة على مداولة مستمرة، ويحافظ على معنى التفكير والنقاش الجماعي بصياغة عربية طبيعية.
- source_word: πρὸς ἑαυτοὺς
  choice: فيما بينهم
  rationale: يبين أن المداولة كانت متبادلة داخل الجماعة، لا مجرد حديث باطني فردي.
- source_word: λέγοντες
  choice: قائلين
  rationale: يقدم مضمون مداولتهم مباشرة ويحافظ على البنية الحالية في اليونانية.
- source_word: Τί εἴπωμεν;
  choice: ماذا نقول؟
  rationale: 'صياغة عربية واضحة تؤدي معنى صيغة الاحتمال التشاورية: أي جواب نعطي؟'
- source_word: ἐὰν εἴπωμεν
  choice: إن قلنا
  rationale: ينقل الشرط بصيغة موجزة وطبيعية.
- source_word: Ἐξ οὐρανοῦ
  choice: مِن السماء
  rationale: يحافظ على اللفظ اليوناني والتعبير اليهودي الموقر بدل استبداله في المتن بتفسير «من الله».
- source_word: ἐρεῖ
  choice: فسيقول
  rationale: ترجمة مباشرة للمستقبل، مع الفاء التي تصل جواب الشرط بما قبله طبيعيًا.
- source_word: Διὰ τί οὖν
  choice: فلماذا إذًا
  rationale: يحافظ على الاستنتاج المنطقي الذي تفيده οὖν ويصوغه بأسلوب عربي سلس.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: لم تصدّقوه
  rationale: الفعل مع المفعول غير المباشر هنا يعني قبول قول يوحنا وشهادته؛ و«تصدّقوه» أدق من «تؤمنوا به»، التي قد توحي بإيمان شخصي أوسع.
theological_decisions:
- issue: دلالة «مِن السماء» في منشأ معمودية يوحنا وسلطانه
  choice: إبقاء التعبير «مِن السماء» في المتن
  alternative: «من الله» أو «بسلطان إلهي»
  rationale: التعبير كناية يهودية موقرة عن المصدر أو التفويض الإلهي. إبقاؤه يصون صورة النص وغموضه الثقافي المشروع، وتوضح الحاشية المقصود دون إحلال التفسير محل الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدمت «يتداولون الأمر» لإظهار المداولة الجماعية المستمرة، و«تصدّقوه» لربط عدم التصديق بشهادة يوحنا دون تحميل العبارة معنى «الإيمان به» الأوسع.
