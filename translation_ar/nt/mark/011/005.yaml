  rationale: تنقل معنى جماعة غير محددة من الحاضرين بعبارة عربية طبيعية.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: الواقفين هناك
  rationale: تحافظ على الصياغة الوصفية وموقع الوقوف من غير تحويلها إلى تعبير أكثر تفسيرًا مثل «المارة».
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: تحافظ على الجانب الاستمراري المحتمل لصيغة الماضي الناقص اليونانية، من غير أن تفترض تكرار القول.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ضمير جمع في موقع المفعول غير المباشر، ويعود في السياق إلى المرسلين لأخذ الجحش.
- source_word: Τί ποιεῖτε
  choice: ماذا تفعلون
  rationale: سؤال مباشر عن الفعل الجاري، من غير إضافة معنى «لماذا» غير الصريح في اليونانية.
- source_word: λύοντες
  choice: إذ تحلّون رباط
  rationale: يعبر طبيعيًا عن فك الحيوان المربوط، ويبيّن علاقة الحال بالفعل الرئيسي من غير توسيع المعنى إلى إطلاقه عمومًا.
- source_word: τὸν πῶλον
  choice: الجَحْش
  rationale: πῶλος يدل على حيوان صغير، ويشير السياق هنا إلى صغير الحمار؛ و«الجحش» هو المقابل العربي الموجز والطبيعي.
