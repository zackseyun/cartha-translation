source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: ar
  text: وسمع رؤساء الكهنة والكتبة بذلك، وأخذوا يبحثون كيف يهلكونه[a]، لأنهم كانوا يخافونه، إذ كان الجمع كله مندهشًا من تعليمه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يقتلونه» أو «يميتونه». يمكن أن يعني الفعل اليوناني «يُهلك» بمعنى أوسع، لكن السياق يرجح أن قصدهم كان قتله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: سمعوا بذلك
  rationale: الفعل قد يعني السماع أو بلوغ الخبر. وإضافة «بذلك» العربية تُحيل طبيعيًا إلى ما سبق من أفعال يسوع وأقواله في الهيكل من غير إفراط في التحديد.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: المقابل العربي المألوف للجماعة القيادية الكهنوتية في أورشليم، ولا يوهم بوجود عدة أشخاص يشغلون منصب رئيس الكهنة المفرد في الوقت نفسه.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: مصطلح عربي كتابي راسخ يدل على طبقة العلماء المتخصصين في الشريعة، ويحافظ على اللفظ التاريخي من غير تضييق تفسيري.
- source_word: ἐζήτουν
  choice: أخذوا يبحثون
  rationale: ينقل صيغة الماضي الناقص الدالة على فعل مستمر أو محاولة متواصلة، بصياغة عربية طبيعية.
- source_word: πῶς
  choice: كيف
  rationale: يحفظ معنى البحث في الكيفية أو الوسيلة التي ينفذون بها قصدهم.
- source_word: ἀπολέσωσιν
  choice: يهلكونه
  rationale: يحافظ على المجال الدلالي الأوسع للفعل ἀπόλλυμι، مع أن السياق يرجح قصد قتله؛ لذلك أُثبت البديل الأصرح في الحاشية.
- source_word: ἐφοβοῦντο
  choice: كانوا يخافونه
  rationale: ينقل استمرار الخوف الذي تفيده صيغة الماضي الناقص، من غير أن يحدد سبب الخوف بأكثر مما يقوله النص.
- source_word: πᾶς ὁ ὄχλος
  choice: الجمع كله
  rationale: يحفظ التوكيد الجمعي في العبارة اليونانية بصياغة عربية موجزة وطبيعية.
- source_word: ἐξεπλήσσετο
  choice: كان مندهشًا
  rationale: ينقل حالة الدهشة المستمرة وقوة استجابة الجمع من غير مبالغة تفسيرية.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: من تعليمه
  rationale: تؤدي معنى الأساس أو السبب الذي أثار دهشة الجمع، وهي صياغة عربية طبيعية في هذا السياق.
theological_decisions:
- issue: مدى قصد القادة في الفعل ἀπολέσωσιν
  choice: يهلكونه
  alternative: يقتلونه أو يميتونه
  rationale: السياق يشير إلى تدبير مميت، لكن الفعل اليوناني أوسع من القتل وحده. يحافظ المتن على سعته الدلالية، وتوضح الحاشية المعنى المرجح في السياق من غير حسم يتجاوز لفظ المصدر.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «أخذوا يبحثون» لإظهار الاستمرار، و«بذلك» لاستكمال المفعول المفهوم من السياق. وُضع مؤشر الحاشية مباشرة بعد اللفظ الذي تشرحه.
