lexical_decisions:
- source_word: πῶλον
  choice: الجحش
  rationale: يدل اللفظ على دابة صغيرة، وسياق الرواية يحددها بأنها جحش؛ وهذه الصياغة طبيعية ومألوفة في العربية.
- source_word: ἐπιβάλλουσιν
  choice: ألقوا
  rationale: ينقل معنى وضع الأردية على الجحش بحركة واضحة، ويحافظ على قوة الفعل دون مبالغة.
- source_word: ἱμάτια
  choice: أرديتهم
  rationale: يشير هنا إلى الثياب الخارجية التي بسطها التلاميذ على الجحش.
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: جلس عليه
  rationale: ترجمة مباشرة وطبيعية، ومرجع الضمير واضح من السياق.
