  text: ⸂καὶ ἀπῆλθον⸃ καὶ εὗρον πῶλον δεδεμένον ⸀πρὸς θύραν ἔξω ἐπὶ τοῦ ἀμφόδου, καὶ λύουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/004.yaml
  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: ar
  text: فذهبا ووجدا جحشًا مربوطًا عند باب في الخارج على الطريق[a]، فحلّا رباطه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عند باب في الخارج، في الطريق». تحتمل العبارة اليونانية اختلافًا طفيفًا في تحديد العلاقة المكانية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: ذهبا
  rationale: فعل ماضٍ يدل على انصراف التلميذين من الموضع الذي أعطاهما فيه يسوع تعليماته؛ و«ذهبا» طبيعية وواضحة في السياق السردي.
- source_word: εὗρον
  choice: وجدا
  rationale: المقابل العربي المباشر والطبيعي للفعل في سياق العثور على الجحش.
- source_word: πῶλον
  choice: جحشًا
  rationale: يدل اللفظ على صغير من الدواب، ويبيّن السياق الأوسع أنه صغير حمار؛ و«جحش» موجزة ومألوفة ولا تثقل العبارة بالتفسير.
- source_word: δεδεμένον
  choice: مربوطًا
  rationale: اسم مفعول تام يصف الحالة القائمة للجحش؛ و«مربوطًا» أنسب من «موثوقًا» في هذا المشهد العملي.
- source_word: πρὸς θύραν
  choice: عند باب
  rationale: تفيد πρός هنا القرب المكاني، و«عند باب» تعبير عربي طبيعي يحافظ على عدم تعريف الباب في اليونانية.
- source_word: ἔξω
  choice: في الخارج
  rationale: تحدد أن موضع الجحش خارج المبنى، وهي صياغة عربية واضحة.
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: على الطريق
  rationale: يشير ἄμφοδον إلى طريق أو زقاق أو ممر مفتوح، ومع ἐπί والمضاف إليه يحدد موضع الباب أو الجحش بمحاذاة الطريق؛ و«على الطريق» طبيعية مع إبقاء احتمال اختلاف التعلّق المكاني في الحاشية.
- source_word: λύουσιν αὐτόν
  choice: فحلّا رباطه
  rationale: المضارع التاريخي يُصاغ ماضيًا في السرد العربي. وإظهار «رباطه» يوضح المقصود بالفعل من غير تغيير الحدث.
