  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: ar
  text: وعادوا إلى أورشليم. وبينما كان يمشي في باحات الهيكل[a]، جاء إليه رؤساء الكهنة والكتبة والشيوخ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في الهيكل» أو «في نطاق الهيكل»؛ تشير الكلمة اليونانية إلى مجمّع الهيكل الأوسع، لا إلى المقدس الداخلي تحديدًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: جاءوا
  rationale: المضارع اليوناني مضارع تاريخي، ويُنقل طبيعيًا في السرد العربي بالماضي.
- source_word: πάλιν
  choice: أيضًا
  rationale: تدل على تكرار المجيء إلى أورشليم، و«أيضًا» ملائمة للسياق السردي.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الراسخة لاسم الموضع.
- source_word: ἐν τῷ ἱερῷ
  choice: في ساحات الهيكل
  rationale: يشير ἱερόν إلى مجمّع الهيكل الأوسع، لا إلى المقدس الداخلي تحديدًا؛ وتوضح «ساحات الهيكل» موضع اللقاء العلني.
- source_word: περιπατοῦντος αὐτοῦ
  choice: بينما كان يمشي
  rationale: ينقل التركيب المطلق بالمضاف إليه بوصفه خلفية ظرفية مستمرة للفعل الرئيس.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: يدل الجمع هنا على كبار السلطات الكهنوتية، وهذه هي المقابلة العربية المألوفة والدقيقة.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: مقابل معجمي مباشر يحافظ على اللقب المؤسسي من غير تضييقه تفسيريًا إلى وظيفة تعليمية وحدها.
- source_word: πρεσβύτεροι
  choice: الشيوخ
  rationale: يشير في هذا السياق إلى القادة المعترف بهم، لا إلى كبار السن عمومًا.
- source_word: πρὸς αὐτόν
  choice: إليه
  rationale: تعبير عربي موجز وطبيعي عن الحركة نحو يسوع.
theological_decisions:
- issue: ترجمة ἱερόν
  choice: ساحات الهيكل
  alternative: الهيكل؛ حرم الهيكل
  rationale: تتجنب هذه الصياغة الإيحاء بأن يسوع كان داخل المقدس الداخلي، وتحافظ على الدلالة المكانية للمجمّع الأوسع؛ وهذا قرار معجمي مكاني لا حسم عقائدي.
