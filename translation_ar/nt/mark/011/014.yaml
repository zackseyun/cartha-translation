base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: ar
  text: 'فأجاب وقال لها[a]: «فلا يأكلْ أحدٌ منكِ ثمرًا بعد الآن إلى الأبد[b]». وكان تلاميذه يسمعون[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «أجاب» اصطلاح سردي شائع في اليونانية، حتى عندما لا يُذكر كلام سابق يردّ عليه المتكلم.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «إلى الدهر». ويمكن ترجمتها: «فلا يأكلْ أحدٌ منكِ ثمرًا إلى الأبد».'
    reason: alternative_reading
  - marker: c
    text: 'يمكن أيضًا ترجمة الفعل اليوناني الناقص: «وسمع تلاميذه ذلك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: فأجاب
  rationale: يحفظ اصطلاح السرد اليوناني «أجاب» مع أنه لم يُذكر كلام سابق، من غير تسوية التعبير أو حذف دلالته.
- source_word: αὐτῇ
  choice: لها
  rationale: يعود الضمير المؤنث إلى شجرة التين، وهي مؤنثة في العربية أيضًا، فيأتي الضمير طبيعيًا ويحفظ توجيه الكلام إليها.
- source_word: Μηκέτι ... εἰς τὸν αἰῶνα
  choice: بعد الآن إلى الأبد
  rationale: يجمع بين معنى انقطاع الأمر من هذه اللحظة ومعنى امتداده الدائم، مع إبقاء العبارة المصدرية «إلى الدهر» في الحاشية.
- source_word: ἐκ σοῦ
  choice: منكِ
  rationale: يحفظ الخطاب المباشر للشجرة بصيغة المؤنث المفرد.
- source_word: μηδεὶς
  choice: لا ... أحدٌ
  rationale: صياغة عربية فصيحة واضحة للنفي العام في قول يحمل معنى الدعاء أو القضاء.
- source_word: καρπὸν
  choice: ثمرًا
  rationale: اسم جنس مفرد يلائم ثمر الشجرة ويقابل اللفظ اليوناني من غير زيادة.
- source_word: φάγοι
  choice: لا يأكل
  rationale: المضارع المجزوم بلا الناهية يؤدي قوة صيغة التمني أو اللعن في اليونانية، من غير تحويلها إلى خبر مستقبلي محض.
- source_word: ἤκουον
  choice: كانوا يسمعون
  rationale: يحفظ جانب الاستمرار في الماضي الذي تفيده صيغة الناقص، مع الإشارة في الحاشية إلى إمكان ترجمتها بالفعل البسيط.
- source_word: μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: المقابل العربي الطبيعي الموجز لعبارة الملكية اليونانية.
theological_decisions:
- issue: طبيعة قول يسوع لشجرة التين
  choice: 'صياغته دعاءً أو قضاءً سلبيًا: «لا يأكل أحدٌ منكِ...»'
  alternative: 'صياغته خبرًا مستقبليًا: «لن يأكل أحدٌ منكِ...»'
  rationale: الفعل φάγοι بصيغة التمني لا بصيغة المستقبل الخبرية؛ لذلك ينبغي حفظ قوة النطق بالدينونة أو اللعنة وعدم اختزالها إلى مجرد تنبؤ.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقي فعل «أجاب» للحفاظ على النسيج السردي اليوناني، واستُخدم تأنيث الخطاب لأن المرجع شجرة التين. الصياغة تحافظ على قوة التمني القضائي في الأصل وعلى احتمال دلالة الفعل الناقص في الجملة الختامية.
