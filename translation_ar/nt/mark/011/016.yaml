  text: καὶ οὐκ ἤφιεν ἵνα τις διενέγκῃ σκεῦος διὰ τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/016.yaml
  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: ar
  text: ولم يكن يسمح لأحد أن يحمل شيئًا عبر ساحات الهيكل[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عبر حرم الهيكل». تشير اللفظة اليونانية إلى مجمّع الهيكل عمومًا، لا إلى المقدس الداخلي تحديدًا.
    reason: lexical_alternative
  - marker: b
    text: أو «وعاءً» أو «متاعًا». اللفظة اليونانية واسعة ولا تحدد نوع الشيء المحمول.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: لم يكن يسمح
  rationale: صيغة الماضي الناقص تدل هنا على منع مستمر أو متكرر، وتؤديها هذه العبارة بوضوح وطبيعية.
- source_word: ἵνα τις διενέγκῃ
  choice: لأحد أن يحمل
  rationale: تأتي ἵνα مع صيغة الاحتمال بعد فعل السماح لتبيّن الفعل الذي لم يسمح بوقوعه؛ وهذه الصياغة عربية طبيعية.
- source_word: διενέγκῃ
  choice: يحمل ... عبر
  rationale: يفيد الفعل نقل شيء من موضع إلى آخر مرورًا بمكان، وتحفظ «عبر» الدلالة الاتجاهية.
- source_word: σκεῦος
  choice: شيئًا
  rationale: اللفظة اليونانية واسعة، وقد تدل على وعاء أو أداة أو متاع؛ لذلك تتجنب «شيئًا» تعيين نوع لا يحدده النص.
- source_word: διὰ τοῦ ἱεροῦ
  choice: عبر ساحات الهيكل
  rationale: يشير ἱερόν إلى مجمّع الهيكل عمومًا لا إلى المقدس الداخلي خصوصًا، و«ساحات الهيكل» توضح موضع المرور.
theological_decisions:
- issue: دلالة ἱερόν في سياق هيكل أورشليم
  choice: مجمّع الهيكل الأوسع، بصياغة «ساحات الهيكل»
  alternative: «الهيكل» أو «حرم الهيكل»
  rationale: يحافظ هذا على التمييز بين ἱερόν، أي مجمّع الهيكل، وναός، أي المقدس الداخلي، من غير تحميل النص تفسيرًا مذهبيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «لم يكن يسمح» لإبراز الاستمرار، و«شيئًا» للمحافظة على عموم σκεῦος، مع بيان البدائل في الحاشية.
