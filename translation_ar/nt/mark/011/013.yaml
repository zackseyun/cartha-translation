  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: ar
  text: ولمّا رأى من بعيد شجرة تين عليها أوراق، ذهب ليرى لعلّه يجد فيها شيئًا. فلمّا وصل إليها، لم يجد إلا أوراقًا، إذ لم يكن موسم التين[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنه لم يكن وقت التين».'
    reason: بديل معجمي لـ καιρός يحافظ على معنى الوقت بدل الموسم.
lexical_decisions:
- source_word: ἰδὼν
  choice: ولمّا رأى
  rationale: ينقل اسم الفاعل اليوناني بوصفه ظرفًا زمنيًا مصاحبًا، بصياغة عربية طبيعية من غير مبالغة في تحديد التعاقب.
- source_word: συκῆν
  choice: شجرة تين
  rationale: المقابل العربي المألوف والدقيق للاسم اليوناني.
- source_word: ἀπὸ μακρόθεν
  choice: من بعيد
  rationale: تعبير عربي واضح يحفظ الدلالة المكانية.
- source_word: ἔχουσαν φύλλα
  choice: عليها أوراق
  rationale: صياغة عربية طبيعية تحافظ على ملاحظة وجود الأوراق من غير تفسير إضافي.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: ذهب ليرى هل يجد فيها شيئًا
  rationale: ينقل غرض الذهاب وطابع الاحتمال في εἰ ἄρα، مع تجنب الترجمة الحرفية المتكلفة.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: فلمّا وصل إليها
  rationale: يؤدي معنى الوصول إلى الشجرة بسلاسة، ويصل الحدث بما قبله زمنيًا.
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: لم يجد إلا أوراقًا
  rationale: ينقل تركيب الاستثناء اليوناني بدقة وإيجاز طبيعيين.
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: لأن موسم التين لم يكن قد حان
  rationale: يفهم καιρός على أنه الوقت أو الموسم المناسب، ويقدم الجملة التعليلية في عربية واضحة من غير شرح زراعي زائد.
theological_decisions:
- issue: دلالة التعليل بأن وقت التين لم يكن قد حان
  choice: 'الإبقاء على التعليل المباشر: «لأن موسم التين لم يكن قد حان»'
  alternative: «لأنه لم يكن وقت التين»
  rationale: يحافظ النص على التوتر السردي المتمثل في طلب الثمر مع عدم حلول موسمه، ولا يحاول حله بإضافة تفسير زراعي أو لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت جمل زمنية طبيعية وربط سببي مباشر، مع الحفاظ على غموض النص وتوتره من غير تفسير مذهبي. وُضع مؤشر الحاشية عند العبارة التي تخصها، وهي تعبير «موسم التين».
