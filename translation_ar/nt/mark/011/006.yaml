lexical_decisions:
- source_word: οἱ δὲ
  choice: فقالوا
  rationale: أُعيد الضمير إلى التلاميذ المذكورين في السياق، وأُدمجت δέ في فاء السرد الطبيعية التي تصل جوابهم بما سبقه من سؤال.
- source_word: εἶπαν αὐτοῖς
  choice: قالوا لهم
  rationale: ترجمة مباشرة للفعل العادي الدال على الكلام مع المفعول غير المباشر.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: كما قال يسوع
  rationale: تحفظ «كما» معنى المطابقة، ولا تحتاج العربية إلى صيغة ماضٍ أسبق لإظهار أن قول يسوع سبق جواب التلاميذ، إذ يوضحه السياق.
- source_word: ἀφῆκαν αὐτούς
  choice: تركوهم يذهبون
  rationale: يؤدي هذا التعبير معنى الكف عن منع التلاميذ والسماح لهم بالمضي، مع إبقاء المجال الدلالي للفعل ἀφίημι ظاهرًا.
