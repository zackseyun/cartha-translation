  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: ar
  text: ودخل أورشليم، إلى باحات الهيكل[a]؛ وبعدما نظر حوله إلى كل شيء، إذ كان الوقت قد تأخر[b]، خرج إلى بيت عنيا مع الاثني عشر[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حرم الهيكل» أو ببساطة «الهيكل». يشير اللفظ اليوناني إلى مجمّع الهيكل الأوسع، لا إلى المقدس الداخلي تحديدًا.
    reason: lexical_alternative
  - marker: b
    text: أو «لأن الوقت كان قد تأخر» أو «إذ كان النهار قد تأخر».
    reason: lexical_alternative
  - marker: c
    text: أي تلاميذ يسوع الاثنا عشر.
    reason: cross_reference
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: دخل
  rationale: فعل ماضٍ يعبّر بوضوح عن الدخول ويحافظ على حركة السرد.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الشائعة لاسم المدينة.
- source_word: τὸ ἱερόν
  choice: ساحة الهيكل
  rationale: يشير اللفظ اليوناني إلى نطاق الهيكل الأوسع لا إلى المقدس الداخلي تحديدًا؛ وهذه الصياغة واضحة للقارئ الحديث.
- source_word: περιβλεψάμενος
  choice: بعدما نظر حوله
  rationale: ينقل معنى إلقاء النظر في المحيط، ويبيّن أن النظر سبق الخروج.
- source_word: πάντα
  choice: كل شيء
  rationale: يحافظ على شمول العبارة من غير إضافة تفاصيل غير مذكورة.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: إذ كان الوقت قد تأخر
  rationale: ينقل الظرف الزمني مع احتمال دلالة سببية خفيفة، دون حصر العبارة في سبب صريح وحده.
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: يحفظ المعنى الاتجاهي للفعل، أي الخروج من الموضع.
- source_word: Βηθανίαν
  choice: بيت عنيا
  rationale: الصيغة العربية الكتابية الشائعة لاسم القرية.
- source_word: μετὰ τῶν δώδεκα
  choice: مع الاثني عشر
  rationale: يحافظ على التعبير العددي اليوناني، والمراد تلاميذ يسوع الاثنا عشر.
theological_decisions:
- issue: مدلول τὸ ἱερόν
  choice: ساحة الهيكل، أي نطاق مجمّع الهيكل الأوسع
  alternative: الهيكل
  rationale: يميّز هذا الاختيار بين ἱερόν الدال على مجمّع الهيكل وναός الدال عادةً على المقدس الداخلي، ويلائم دخول يسوع ونظره إلى ما حوله.
- issue: مدلول «الاثني عشر»
  choice: الإبقاء على التعبير العددي في المتن
  alternative: التلاميذ الاثنا عشر
  rationale: يحافظ على إيجاز الأصل، مع توضيح المرجع في الحاشية دون تحويل العبارة إلى لقب تفسيري صريح في المتن.
- issue: العلاقة في العبارة الزمنية الختامية
  choice: إذ كان الوقت قد تأخر
  alternative: لأن الوقت كان قد تأخر
  rationale: صيغة الحال اليونانية تسمح بقراءة زمنية ذات إيحاء سببي؛ و«إذ» تحفظ هذا التوتر بدل الجزم بأن العبارة سببية محضة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. رُتبت العبارة الختامية بحيث تأتي الجملة الزمنية بعد فعل الخروج، مع الحفاظ على مضمون الأصل. استُعملت «ساحة الهيكل» لتجنب توهّم دخول المقدس الداخلي، ووُضعت الحاشيتان بعلامتيهما في المتن.
