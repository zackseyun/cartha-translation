  text: Καὶ ⸂παραπορευόμενοι πρωῒ⸃ εἶδον τὴν συκῆν ἐξηραμμένην ἐκ ῥιζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: ar
  text: وفي الصباح الباكر، فيما كانوا مارّين، رأوا شجرة التين قد يبست من جذورها.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: فيما كانوا مارّين
  rationale: اسم الفاعل المضارع يفيد فعلًا خلفيًّا متزامنًا مع الفعل الرئيس؛ وهذه الصياغة تحافظ على ذلك بصورة طبيعية في العربية.
- source_word: πρωῒ
  choice: في الصباح الباكر
  rationale: ينقل الظرف الدلالة الزمنية مع معنى التبكير بوضوح.
- source_word: εἶδον
  choice: رأوا
  rationale: مقابل مباشر وغير تفسيري لفعل الإدراك البصري.
- source_word: συκῆν
  choice: شجرة التين
  rationale: التعبير العربي المألوف والدقيق في هذا السياق السردي.
- source_word: ἐξηραμμένην
  choice: قد يبست
  rationale: تنقل حالة الشجرة الناتجة عن حدث سابق، وتلائم الشجر في العربية الطبيعية؛ وتؤدي «قد» دلالة الحالة المكتملة في اسم المفعول اليوناني التام.
- source_word: ἐκ ῥιζῶν
  choice: من جذورها
  rationale: تحافظ على صورة اليونانية التي تدل على أن اليبس بلغ الجذور أو انطلق منها، مع إضافة الضمير التي يقتضيها الأسلوب العربي الطبيعي.
