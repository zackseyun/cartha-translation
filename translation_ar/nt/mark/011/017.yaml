  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: ar
  text: 'وكان يعلِّم ويقول لهم: «أليس مكتوبًا: ‹بيتي سيُدعى بيتَ صلاةٍ لجميع الأمم[a]›؟ أمّا أنتم فقد جعلتموه مغارةَ لصوص[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لجميع الشعوب». يقول اليوناني حرفيًا «لجميع الأمم»، في صدى لإشعياء 56:7، مؤكدًا أن بيت الله مقصود للأمم كلها.'
    reason: lexical_alternative
  - marker: b
    text: تُردِّد عبارة «مغارة لصوص» صدى إرميا 7:11. ويمكن للكلمة اليونانية المترجمة «لصوص» أن تعني في بعض السياقات «قطّاع طرق» أو «لصوصًا مسلحين».
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν αὐτοῖς
  choice: وكان يعلِّم ويقول لهم
  rationale: يحافظ على استمرارية الفعلين في صيغة الماضي الناقص، وعلى ضمير المخاطَبين، من غير حصر الكلام في قول منفرد لحظي.
- source_word: Οὐ γέγραπται
  choice: أليس مكتوبًا
  rationale: صياغة عربية طبيعية تحفظ السؤال الاستنكاري وصيغة الاستشهاد بسلطان النص المكتوب.
- source_word: Ὁ οἶκός μου
  choice: بيتي
  rationale: ينقل معنى «البيت» مباشرة ويحفظ صدى اقتباس إشعياء، بدل تفسيره صراحةً بلفظ «هيكلي».
- source_word: οἶκος προσευχῆς
  choice: بيتَ صلاةٍ
  rationale: تركيب عربي واضح ومألوف يحافظ على صورة البيت المخصَّص للصلاة.
- source_word: κληθήσεται
  choice: سيُدعى
  rationale: يحفظ المستقبل المبني للمجهول في صياغة عربية معاصرة.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: لجميع الأمم
  rationale: يحفظ لفظ «الأمم» واتساع نطاق العبارة في إشعياء 56:7، مع فهم الداتيف هنا بمعنى «لـ».
- source_word: ὑμεῖς δὲ
  choice: أمّا أنتم
  rationale: يُظهر التقابل القوي ويحفظ توكيد ضمير المخاطبين المستقل.
- source_word: πεποιήκατε
  choice: فقد جعلتموه
  rationale: «قد» مع الماضي تفيد تحقق الفعل ونتيجته القائمة، بما يلائم قوة صيغة التام اليونانية.
- source_word: σπήλαιον λῃστῶν
  choice: مغارةَ لصوص
  rationale: يحفظ الصورة النبوية في إرميا 7:11؛ و«اللصوص» هو المعنى الأنسب هنا من غير فرض دلالة سياسية أضيق.
theological_decisions:
- issue: النطاق الشامل للاقتباس النبوي
  choice: لجميع الأمم
  alternative: 'لجميع الشعوب؛ أو: عند جميع الأمم'
  rationale: هذه الصياغة هي الأقرب إلى ἔθνη وتحفظ مقصد البيت المتجاوز لإسرائيل من غير بناء استنتاج لاهوتي يتعدى العبارة.
- issue: دلالة λῃστῶν في الاتهام
  choice: لصوص
  alternative: 'قطّاع طرق؛ أو: متمرّدون'
  rationale: صدى إرميا 7:11 يرجّح اللفظ العام «لصوص»، مع إبقاء إمكان الدلالة على قطّاع الطرق في الحاشية وعدم تخصيصها سياسيًا بلا قرينة كافية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقي توازي الفعلين «يعلِّم ويقول» لإظهار الاستمرار في الأصل، وحُفظت عبارتا «بيتي» و«مغارة لصوص» لما لهما من صدى كتابي. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحهما الحاشيتان مباشرةً.
