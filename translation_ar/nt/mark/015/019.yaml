  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: ar
  text: وكانوا يضربون رأسه بقصبة، ويبصقون عليه، ويجثون على ركبهم ويسجدون له.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يعبدونه». يمكن للفعل اليوناني أن يعني السجود أمام شخص، أو إظهار الإجلال له، أو عبادته؛ لكنه هنا يصف محاكاة الجنود الساخرة للتكريم الملكي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: كانوا يضربون
  rationale: صيغة الماضي الناقص تدل على فعل متكرر أو مستمر في سياق السرد، وعبارة «كانوا يضربون» تنقل هذه الدلالة طبيعيًا.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: رأسه
  rationale: ترجمة عربية طبيعية لتركيب الملكية اليوناني.
- source_word: καλάμῳ
  choice: بقصبة
  rationale: «قصبة» هي الدلالة المباشرة الشائعة، وتحافظ على الصلة بأداة التهكم المذكورة في السياق.
- source_word: ἐνέπτυον αὐτῷ
  choice: ويبصقون عليه
  rationale: تحافظ صيغة المضارع المعطوف على الاستمرار والتكرار اللذين تدل عليهما صيغة الماضي الناقص بعد «كانوا».
- source_word: τιθέντες τὰ γόνατα
  choice: يجثون على ركبهم
  rationale: التعبير اليوناني حرفيًا «واضعين الركب»، وهو اصطلاح يدل على الجثو؛ والصياغة المختارة واضحة وطبيعية.
- source_word: προσεκύνουν αὐτῷ
  choice: يسجدون له
  rationale: «يسجدون له» تنقل فعل الانحناء أو الجثو أمام شخص لإظهار الإجلال، وتلائم مشهد المحاكاة الساخرة للتكريم الملكي، مع إبقاء معنى العبادة الممكن في الحاشية.
theological_decisions:
- issue: دلالة προσκυνέω في سياق تهكم الجنود
  choice: يسجدون له
  alternative: يعبدونه؛ أو ينحنون أمامه
  rationale: السياق يصف تكريمًا ملكيًا ساخرًا لا عبادة صادقة. ولفظ «يسجدون» يحافظ على الفعل الخارجي وعلى التوتر الدلالي، من غير أن ينسب إلى الجنود إيمانًا أو تعبدًا صادقًا؛ وتُذكر الدلالة البديلة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «يجثون على ركبهم» بدل تعبير حرفي متكلف، و«يسجدون له» للمحافظة على صورة الفعل وعلى تعدد دلالاته في السياق.
