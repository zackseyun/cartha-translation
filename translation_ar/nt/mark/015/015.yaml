base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: ar
  text: فأطلق لهم بيلاطس باراباس، إذ أراد أن يُرضي الجمع[a]، وبعد أن جُلد يسوع سلَّمه ليُصلب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يسترضي الجمع». وحرفيًا: «أن يفعل للجمع ما هو كافٍ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενος
  choice: إذ أراد
  rationale: ينقل إرادة بيلاطس ودافعه بعبارة عربية واضحة، من غير مبالغة في معنى التدبير أو التصميم.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: أن يُرضي الجمع
  rationale: تعبير عربي طبيعي يؤدي معنى الاصطلاح اليوناني، أي أن يفعل ما يكفي لتلبية مطلب الجمع واسترضائه، لا مجرد إسعاده.
- source_word: ἀπέλυσεν
  choice: أطلق
  rationale: الفعل المناسب في السياق القضائي لإخلاء سبيل سجين.
- source_word: αὐτοῖς
  choice: لهم
  rationale: يحفظ دلالة المجرور اليوناني على أن إطلاق باراباس تم استجابةً للجمع ولصالحهم.
- source_word: παρέδωκεν
  choice: سلَّمه
  rationale: يحفظ معنى وضع يسوع في سلطة آخرين، وهو فعل بارز في رواية الآلام.
- source_word: φραγελλώσας
  choice: بعد أن جلده
  rationale: يبين أن الجلد سبق التسليم، من دون التصريح بأن بيلاطس نفذه بيده؛ العربية تسمح بفهم صدور الفعل بأمره بوصفه الحاكم.
- source_word: ἵνα σταυρωθῇ
  choice: ليُصلب
  rationale: ينقل غاية التسليم بصيغة موجزة وطبيعية، ويحفظ المبني للمجهول.
- source_word: Βαραββᾶν
  choice: باراباس
  rationale: نقل صوتي مألوف للاسم في العربية.
- source_word: Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية المألوفة للاسم.
theological_decisions:
- issue: دافع بيلاطس في العبارة τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: أراد أن يُرضي الجمع
  alternative: أراد أن يفعل للجمع ما يكفي؛ أو أن يسترضي الجمع
  rationale: يفيد السياق تلبية مطلب الجمع واسترضاءه سياسيًا. وتحفظ الصياغة مسؤوليته الأخلاقية من غير إضافة تفسير عقائدي أو جعل الدافع إحسانًا إلى الجمع.
- issue: علاقة بيلاطس بجلد يسوع
  choice: بعد أن جلده
  alternative: بعد أن أمر بجلده
  rationale: تتبع الصياغة الفاعل النحوي في الأصل، مع إمكان كون الفعل قد جرى بأمر بيلاطس؛ أما إضافة «أمر» فتوضح السببية لكنها ليست ملفوظة صراحة في اليونانية.
translation_notes:
  register: 'عربية فصحى حديثة واضحة وموقرة. استُعمل «الجمع» مقابل ὄχλος، وحُفظ ترتيب الأحداث: إطلاق باراباس، ثم جلد يسوع وتسليمه للصلب.'
