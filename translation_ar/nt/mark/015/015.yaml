  source_fidelity: 'الترجمة تنقل العناصر الأساسية للآية: إطلاق باراباس، ودافع بيلاطس المتمثل في إرضاء الجمع، وتسليم يسوع للصلب. لكن «بعد أن جلده» تُفهم في العربية الحديثة على أن بيلاطس باشر الجلد بنفسه؛ في حين أن الفعل اليوناني، وإن كان فاعله النحوي بيلاطس، يُستعمل في هذا السياق القضائي بمعنى إخضاع يسوع للجلد أو التسبب فيه. كما أن «وأما» تضيف مقابلة لا تفيدها καὶ.'
