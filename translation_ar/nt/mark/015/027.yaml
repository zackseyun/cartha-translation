  text: καὶ σὺν αὐτῷ σταυροῦσιν δύο λῃστάς, ἕνα ἐκ δεξιῶν καὶ ἕνα ἐξ εὐωνύμων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: ar
  text: ويصلبون معه لِصَّين[a]، واحدًا عن يمينه وواحدًا عن يساره.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قاطعَي طريق»؛ وربما «متمرّدَين» إذا كان اللفظ يُفهم بإيحاء سياسي.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: معه
  rationale: تفيد σύν مع المجرور المصاحبة، و«معه» هي الصياغة العربية المباشرة والطبيعية.
- source_word: σταυροῦσιν
  choice: يصلبون
  rationale: الفعل مضارع خبري مبني للمعلوم، بصيغة الجمع الغائب. أُبقي المضارع التاريخي لما فيه من حيوية سردية توافق أسلوب مرقس.
- source_word: δύο λῃστάς
  choice: لِصَّين
  rationale: يمكن أن يدل λῃστής على لص أو قاطع طريق أو متمرّد ذي نشاط عنيف. اختير اللفظ الأوسع والأيسر «لصَّين»، مع حفظ البدائل الممكنة في الحاشية دون فرض دلالة سياسية.
- source_word: ἕνα ἐκ δεξιῶν
  choice: واحدًا عن يمينه
  rationale: العبارة اصطلاح مكاني يدل على الجانب الأيمن؛ و«عن يمينه» تعبير عربي طبيعي مناسب للمشهد.
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: واحدًا عن يساره
  rationale: يدل εὐώνυμος هنا على الجانب الأيسر، والضمير αὐτοῦ يعود إلى يسوع ويُفهم مع عبارتي اليمين واليسار المتوازيتين.
theological_decisions:
- issue: دلالة λῃσταί في خبر الصلب
  choice: لِصَّين
  alternative: قاطعَي طريق؛ وربما متمرّدَين إذا حُمِل اللفظ على دلالة سياسية
  rationale: اللفظ اليوناني يتسع للصوص العنيفين وقطاع الطرق، وقد يكتسب في بعض السياقات إيحاءً تمرديًا. لكن هذه الآية وحدها لا تحسم الدلالة السياسية، لذلك بقي المتن على المعنى الأوسع، وحُفظ الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ المضارع التاريخي في «يصلبون» لإبقاء حيوية السرد، ووُضع رقم الحاشية مباشرة بعد اللفظ الذي تشرحه.
