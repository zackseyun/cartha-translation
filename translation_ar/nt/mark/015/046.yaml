  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: ar
  text: وبعد أن اشترى قطعة كتان[a]، أنزله ولفَّه بها، ووضعه في قبر كان منحوتًا في الصخر[b]. ثم دحرج حجرًا على مدخل القبر[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ملاءة من الكتان» أو «كفنًا من الكتان»؛ فاللفظة اليونانية σινδών تدل على قطعة قماش كتانية يمكن أن تُستخدم ككفن.
    reason: lexical_alternative
  - marker: b
    text: أو «كان منحوتًا من الصخر»؛ فالعبارة تصف قبرًا قُطع من كتلة صخرية.
    reason: lexical_alternative
  - marker: c
    text: أو «على باب القبر»؛ فاللفظة اليونانية θύρα يمكن أن تعني «الباب» أو «المدخل».
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: قطعة كتان / بها
  rationale: تشير اللفظة إلى قطعة من نسيج الكتان تصلح للفّ الجسد. و«قطعة كتان» واضحة ولا تخصّص المعنى إلى «كفن» أكثر مما يقتضيه اللفظ؛ والضمير في «بها» يعيد الإحالة طبيعيًا إلى القطعة المذكورة.
- source_word: ἀγοράσας
  choice: بعد أن اشترى
  rationale: ينقل سبق شراء الكتان على الأفعال الرئيسة، بصياغة عربية طبيعية.
- source_word: καθελών
  choice: أنزله
  rationale: يفيد الفعل هنا إنزال يسوع من الصليب، ويظل الضمير مطابقًا لصياغة الأصل من غير إضافة «الجسد».
- source_word: ἐνείλησεν
  choice: لفَّه
  rationale: ينقل معنى اللفّ أو الإحاطة بالقماش بوضوح ومن دون إضافة تفاصيل لطقوس الدفن.
- source_word: ἔθηκεν
  choice: وضعه
  rationale: مقابل عربي مباشر وطبيعي للفعل، ملائم لسياق وضع الميت في القبر.
- source_word: μνημείῳ / μνημείου
  choice: قبر / القبر
  rationale: يدل اللفظ في السياق على موضع دفن صخري، و«قبر» هو المقابل العربي المألوف والدقيق.
- source_word: λελατομημένον ἐκ πέτρας
  choice: كان منحوتًا في الصخر
  rationale: يحفظ حالة القبر المكتملة التي يدل عليها اسم المفعول التام المبني للمجهول، و«في الصخر» يعبّر طبيعيًا عن قبر محفور داخل كتلة صخرية.
- source_word: προσεκύλισεν
  choice: دحرج
  rationale: ينقل حركة الحجر بالدحرجة باتجاه فتحة القبر، وتبيّن العبارة التالية وجهة الحركة.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: إلى مدخل القبر
  rationale: يمكن أن تعني θύρα الباب أو المدخل/الفتحة. «مدخل القبر» أوضح في وصف القبر الصخري، و«إلى» تنقل الحركة نحو المدخل لإغلاقه دون زيادة فعل «أغلق» غير المذكور صراحة.
