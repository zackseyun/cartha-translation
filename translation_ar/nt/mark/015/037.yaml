  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: ar
  text: أَمَّا يَسُوعُ فَأَطْلَقَ صَرْخَةً عَالِيَةً[a]، وَلَفَظَ أَنْفَاسَهُ الأَخِيرَةَ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «صَوْتًا عَالِيًا»، أو «صَرْخَةً عَظِيمَةً».
    reason: lexical_alternative
  - marker: b
    text: 'أو «مَاتَ»؛ وحرفيًّا: «أَخْرَجَ نَفَسَهُ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: أداة ربط خفيفة تُبرز الانتقال إلى يسوع في ذروة المشهد، من غير أن تفرض تضادًا قويًّا لا يقتضيه النص.
- source_word: ἀφεὶς
  choice: أَطْلَقَ
  rationale: الفعل ἀφίημι مع φωνή يفيد هنا إصدار الصوت أو إطلاقه، و«أطلق» تعبير عربي طبيعي وفصيح في هذا السياق.
- source_word: φωνὴν μεγάλην
  choice: صَرْخَةً عَالِيَةً
  rationale: يمكن أن تعني φωνή صوتًا أو صوتًا بشريًّا أو صرخة؛ ومع فعل «أطلق» وفي سياق الآلام، تنقل «صرخة» معنى الانبعاث الصوتي القوي، و«عالية» تعبّر طبيعيًّا عن شدة الصوت.
- source_word: ἐξέπνευσεν
  choice: لَفَظَ أَنْفَاسَهُ الأَخِيرَةَ
  rationale: الفعل يعني حرفيًّا إخراج النَّفَس ويُستعمل للموت. يحفظ التعبير العربي صورة التنفس ووقار العبارة من غير إدخال لفظ «الروح» غير الوارد هنا.
- source_word: ὁ δὲ Ἰησοῦς
  choice: أَمَّا يَسُوعُ فَـ
  rationale: لا يحتاج التعريف السابق للاسم العلم إلى مقابل مستقل في العربية، وصيغة «أما يسوع فـ» تنقل الربط والتركيز بسلاسة.
theological_decisions:
- issue: وصف موت يسوع من غير استيراد دلالة لاهوتية إضافية
  choice: لَفَظَ أَنْفَاسَهُ الأَخِيرَةَ
  alternative: أَسْلَمَ الرُّوحَ / مَاتَ
  rationale: يحافظ الاختيار على صورة التنفس في الفعل اليوناني ويعبّر بوضوح عن الموت. وتُجنَّب عبارة «أسلم الروح» لأنها قد توحي بصياغة من مواضع إنجيلية أخرى وتضيف لفظ «الروح» غير الموجود في هذه الآية، بينما «مات» صحيح دلاليًّا لكنه يفقد الصورة الأصلية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الضبط الجزئي الموسع لتيسير القراءة، مع تركيب موجز يحافظ على إيقاع الرواية وشدة اللحظة.
