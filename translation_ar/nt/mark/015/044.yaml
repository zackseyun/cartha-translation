lexical_decisions:
- source_word: ἐθαύμασεν
  choice: تعجّب
  rationale: ينقل دهشة بيلاطس من سرعة موت يسوع بلفظ عربي فصيح وطبيعي.
- source_word: εἰ ἤδη τέθνηκεν
  choice: من أنه قد مات بهذه السرعة
  rationale: السياق يدل على تعجّب بيلاطس من حدوث الموت بالفعل وفي وقت أبكر مما توقع؛ وهذه الصياغة الطبيعية تنقل معنى ἤδη مع دلالة صيغة التمام على الحالة الناتجة.
- source_word: προσκαλεσάμενος
  choice: استدعى
  rationale: يفيد أنه طلب حضور قائد المئة قبل أن يسأله، وهو موجز وطبيعي في السرد.
- source_word: κεντυρίωνα
  choice: قائد المئة
  rationale: المقابل العربي التاريخي المألوف للرتبة العسكرية الرومانية κεντυρίων.
- source_word: ἐπηρώτησεν
  choice: سأله
  rationale: تعبير عربي مباشر يطابق معنى السؤال والاستفسار في السياق.
- source_word: εἰ πάλαι ἀπέθανεν
  choice: هل مضى على موته بعض الوقت
  rationale: يحافظ على كون العبارة سؤالًا غير مباشر، وينقل πάλαι بوصفه مدة سبقت السؤال دون الإيحاء بزمن طويل على نحو مطلق.
