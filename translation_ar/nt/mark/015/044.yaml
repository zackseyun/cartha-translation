  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: ar
  text: فتعجّب بيلاطس من أنه كان قد مات بالفعل، واستدعى قائد المئة وسأله هل كان قد مات منذ وقت.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هل مضى على موته بعض الوقت».'
