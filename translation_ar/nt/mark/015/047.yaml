base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: ar
  text: وكانت مريم المجدلية ومريم أم يوسي تراقبان أين وُضع[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مريم يوسي». تُعرِّفها اليونانية باسم يوسي، ويُفهم من سياق مرقس أنها أمه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: وكانت
  rationale: أداة ربط خفيفة تواصل رواية الدفن؛ وصيغة «وكانت» طبيعية في السياق السردي العربي من غير إحداث مقابلة قوية.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: مريم المجدلية
  rationale: الصيغة العربية المألوفة للاسم والنسبة التي تميّز هذه المريم.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: مريم أم يوسي
  rationale: الإضافة اليونانية تعرّف مريم بعلاقتها بيوسي، ويرجح من الاستعمال في مرقس أن المقصود أمه؛ جُعلت العلاقة صريحة لسلاسة العربية مع توثيق اللفظ الحرفي في الحاشية.
- source_word: ἐθεώρουν
  choice: تراقبان
  rationale: الماضي الناقص يدل على نظر متواصل، والمثنى العربي يوافق المرأتين ويحفظ معنى الاستمرار والملاحظة المقصودة.
- source_word: ποῦ
  choice: أين
  rationale: ينقل الظرف الاستفهامي غير المباشر بإيجاز وطبيعية.
- source_word: τέθειται
  choice: وُضع
  rationale: فعل تام مبني للمجهول يشير إلى وضع يسوع مع بقاء نتيجة الفعل؛ الماضي المبني للمجهول هو التعبير العربي الطبيعي، والفاعل المنطقي المفهوم من السياق لم يُحوَّل إلى «الجسد».
theological_decisions:
- issue: المسند إليه المحذوف مع الفعل المبني للمجهول
  choice: إبقاؤه مفهومًا من السياق في «وُضع»
  alternative: 'التصريح به: «أين وُضع هو» أو «أين وُضع يسوع»'
  rationale: اليونانية تحذف المسند إليه لأن المرجع إلى يسوع واضح. العربية تجيز هذا الحذف طبيعيًا، فيُحفظ إيجاز الأصل من غير اختزال يسوع إلى مجرد «جسد».
- issue: علاقة مريم بيوسي
  choice: أم يوسي
  alternative: مريم التي ليوسي / مريم يوسي
  rationale: صيغة الإضافة في اليونانية لا تسمّي العلاقة صراحة، لكن سياق مرقس يرجح الأمومة. أُثبتت القراءة الطبيعية في المتن مع إبقاء الغموض النحوي الأصلي ظاهرًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم المثنى «تراقبان» على نحو طبيعي، وحُفظ اتصال السرد ودوام المراقبة، مع تجنب تفسير زائد للمفعول المحذوف.
