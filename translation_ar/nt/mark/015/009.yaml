  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: ar
  text: 'فأجابهم بيلاطس قائلًا: «أتريدون أن أُطلق لكم ملك اليهود[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ملك أهل اليهودية». يمكن أن تعني الكلمة اليونانية Ἰουδαίων «اليهود» أو «أهل اليهودية»، لكن «ملك اليهود» هي الصياغة التقليدية والأنسب لهذا اللقب الثابت في رواية الآلام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تفيد الانتقال مع صلة بما سبق، وتلائم هنا استمرار السرد مع تحوّل خفيف إلى جواب بيلاطس.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: أجابهم بيلاطس قائلًا
  rationale: يحافظ على معنى الجواب وعلى البنية الحالية في اليونانية بصياغة عربية فصيحة وطبيعية.
- source_word: Θέλετε
  choice: أتريدون
  rationale: تعبّر بوضوح عن الرغبة أو الإرادة المقصودة في السؤال.
- source_word: ἀπολύσω ὑμῖν
  choice: أن أُطلق لكم
  rationale: الفعل في السياق القضائي يعني الإفراج عن سجين، واللام تنقل دلالة المفعول غير المباشر من غير إثقال العبارة.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: ملك اليهود
  rationale: هذه صيغة اللقب السياسي المتكرر في رواية الآلام، وهي الصياغة العربية التقليدية والسياقية الملائمة، من غير إضافة تعريف غير لازم إلى «ملك» في تركيب الإضافة.
theological_decisions:
- issue: دلالة اللقب τὸν βασιλέα τῶν Ἰουδαίων
  choice: ملك اليهود
  alternative: ملك أهل اليهودية
  rationale: يحمل Ἰουδαῖοι إمكان الإشارة إلى اليهود أو إلى أهل اليهودية، لكن العبارة هنا لقب سياسي ثابت في رواية الآلام. تُحفظ القراءة الأشهر والأنسب للسياق في المتن، مع إثبات البديل الجغرافي في الحاشية دون حسم دلالة اللفظ خارج هذا السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أُطلق» بمعنى الإفراج القضائي، وحُفظت صيغة السؤال المباشر واللقب السياسي من غير تفسير عقائدي زائد.
