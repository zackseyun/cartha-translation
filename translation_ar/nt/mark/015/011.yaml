base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: ar
  text: لكن رؤساء الكهنة حرَّضوا الحشد لكي يُطلِق لهم باراباس بدلًا من غيره.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أثاروا الحشد». يدل الفعل اليوناني على إثارة جماعة ودفعها نحو تصرّف مقصود.
    reason: lexical_alternative
  - marker: b
    text: أو «بالأحرى». المعنى أن يُطلَق باراباس تفضيلًا له على البديل المفهوم من السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: لكن
  rationale: تفيد δέ هنا انتقالًا ذا دلالة تقابلية خفيفة مع ما سبق، و«لكن» تؤدي هذا المعنى طبيعيًا.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: تعبير عربي مألوف ودقيق يدل على القيادات الكهنوتية في أورشليم.
- source_word: ἀνέσεισαν
  choice: حرَّضوا
  rationale: الفعل ἀνασείω يدل هنا على إثارة جماعة ودفعها إلى تصرف مقصود؛ و«حرَّضوا» واضحة وطبيعية في السياق.[a]
- source_word: τὸν ὄχλον
  choice: الجمع
  rationale: ينقل معنى ὄχλος، أي جمهور الناس المحتشدين، بصياغة عربية موجزة ومألوفة.
- source_word: ἵνα
  choice: لكي
  rationale: تُدخل جملة الغرض وتحافظ على العلاقة المقصودة بين التحريض وإطلاق باراباس.
- source_word: μᾶλλον
  choice: بدلًا منه
  rationale: تعبّر عن تفضيل إطلاق باراباس على البديل المفهوم من السياق. يعود الضمير على يسوع المذكور في السياق السابق، مع التنبيه إلى أن الأصل يورد معنى «بالأحرى» دون ضمير صريح.[b]
- source_word: τὸν Βαραββᾶν
  choice: باراباس
  rationale: نقل صوتي للاسم الشخصي وفق الصيغة العربية الشائعة.
- source_word: ἀπολύσῃ
  choice: يُطلِق
  rationale: مضارع منصوب بعد «لكي» يؤدي غرض صيغة الماضي الاحتمالية اليونانية بعد ἵνα، والفاعل المفهوم من السياق هو بيلاطس.
- source_word: αὐτοῖς
  choice: لهم
  rationale: تنقل دلالة ضمير المجرور بوصفهم المستفيدين من إطلاق السجين، وهي أيسر عربيًا من «إليهم» في هذا السياق.
