lexical_decisions:
- source_word: ἦν δὲ
  choice: وكان
  rationale: تنقل الواوُ δέ بوصفها رابطًا سرديًّا خفيفًا، وينقل «كان» الفعل ἦν بلا إضافة معنى زمني غير صريح.
- source_word: ὁ λεγόμενος Βαραββᾶς
  choice: المدعو باراباس
  rationale: تعبير عربي طبيعي يدل على الشخص الذي يُسمّى بهذا الاسم، من غير الإيحاء الانتقاصي الذي قد يحمله «المزعوم».
- source_word: μετὰ τῶν στασιαστῶν
  choice: مع المتمرّدين
  rationale: تدل στασιασταί على المشاركين في تمرّد أو انتفاضة؛ و«المتمرّدين» واضحة ومعاصرة وتحافظ على الصلة اللفظية مع στάσις.
- source_word: δεδεμένος
  choice: مقيَّدًا
  rationale: يحافظ على معنى اسم المفعول التام من δέω، أي كونه موثوقًا أو مقيّدًا، مع أن السياق يفيد الاحتجاز.
- source_word: οἵτινες
  choice: الذين
  rationale: تقدّم جملة وصفية عن المتمرّدين بصورة طبيعية في العربية.
- source_word: ἐν τῇ στάσει
  choice: في أثناء التمرّد
  rationale: تدل στάσις هنا على تمرّد أو انتفاضة، لا على اضطراب مدني عابر؛ و«في أثناء» توضح الظرف من غير تجاوز للنص.
- source_word: φόνον πεποιήκεισαν
  choice: ارتكبوا جريمة قتل
  rationale: ينقل التركيب حدثًا مكتملًا سابقًا، و«جريمة قتل» تحفظ دلالة φόνος الجنائية من غير الجزم بعدد الضحايا.
