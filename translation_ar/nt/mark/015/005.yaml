  text: لكن يسوع لم يَعُدْ يجيب عن شيء، حتى إن بيلاطس تعجّب.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: أما
  rationale: تفيد انتقالًا سرديًّا مع مقابلة خفيفة بين اتهاماتهم وصمت يسوع، وتأتي طبيعية في العربية.
- source_word: οὐκέτι
  choice: بعدُ
  rationale: 'مع النفي في «لم يُجِبْ» تحفظ معنى انقطاع الإجابة: لم يعد يجيب.'
- source_word: οὐδὲν
  choice: بشيء
  rationale: مع الفعل المنفي تعبّر عن شمول الصمت تعبيرًا عربيًّا واضحًا.
- source_word: ἀπεκρίθη
  choice: يُجِبْ
  rationale: اللفظ المعياري المناسب لسياق الاستجواب القضائي.
- source_word: ὥστε
  choice: حتى إن
  rationale: تُظهر أن تعجّب بيلاطس كان نتيجة لصمت يسوع، لا غاية له.
- source_word: θαυμάζειν
  choice: تعجّب
  rationale: ينقل رد فعل بيلاطس بعبارة عربية طبيعية من غير مبالغة أو إضافة معنى زمني غير لازم.
- source_word: Πιλᾶτον
  choice: بيلاطس
  rationale: النقل العربي الشائع للاسم الشخصي.
