  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: ar
  text: 'فركض شخص، وملأ إسفنجةً بخمر حامض[a]، ووضعها على قصبة، وكان يسقيه، قائلًا: «دعوه[b]. لنرَ هل يأتي إيليا لينزله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الخمر الحامض» نوع من النبيذ الحامض الرخيص، وليس بالضرورة خَلًّا بالمعنى المنزلي الحديث.
    reason: cultural_note
  - marker: b
    text: 'أو: «انتظروا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: فركض
  rationale: اسم فاعل ماضٍ يقدّم الفعل الأول في تسلسل السرد، وصيغة الفعل المعطوف طبيعية وواضحة بالعربية.
- source_word: τις καὶ
  choice: واحدٌ منهم
  rationale: الضمير النكرة يدل على شخص غير معيّن؛ وتعبير «واحد منهم» عربي طبيعي في سياق الجماعة الحاضرة، من غير تحميل καί معنى مستقلًا غير لازم.
- source_word: γεμίσας σπόγγον ὄξους
  choice: وملأ إسفنجةً من الخمر الحامض
  rationale: ὄξος شراب نبيذ حامض رخيص، وليس بالضرورة الخل المنزلي بالمفهوم الحديث؛ و«الخمر الحامض» يحفظ الدلالة التاريخية.
- source_word: περιθεὶς καλάμῳ
  choice: ووضعها على قصبة
  rationale: تحفظ «قصبة» القيمة المعجمية لـ κάλαμος، وتعبّر بوضوح عن تثبيت الإسفنجة لرفعها إلى يسوع.
- source_word: ἐπότιζεν αὐτόν
  choice: وأخذ يسقيه
  rationale: صيغة الماضي الناقص تفيد فعلًا جاريًا أو شروعًا متواصلًا؛ و«أخذ يسقيه» تنقل هذا الجانب بصورة عربية طبيعية.
- source_word: Ἄφετε
  choice: دعوه
  rationale: الأمر قد يعني الكفّ عنه وتركه مؤقتًا؛ والترجمة الموجزة تحافظ على هذا المعنى، مع إثبات احتمال «انتظروا» في الحاشية.
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: لنرَ هل يأتي إيليا
  rationale: تنقل صيغة الحثّ الجماعي ومضمون السؤال من غير الجزم بوقوع مجيء إيليا.
- source_word: καθελεῖν αὐτόν
  choice: لينزله
  rationale: الفعل في سياق الصلب يعني إنزال شخص من موضع مرتفع، أي من الصليب.
theological_decisions:
- issue: مقصد المتكلم في قوله Ἄφετε
  choice: «دعوه» بوصفها أمرًا بترك يسوع مؤقتًا لمعرفة هل يتدخل إيليا
  alternative: «انتظروا» بوصفها تعبيرًا اصطلاحيًا يدعو إلى التريث
  rationale: العبارة تحتمل الأمر بالكفّ أو الانتظار، ولا ينبغي حسم هذا الاحتمال التفسيري بلا تنبيه؛ لذلك أُبقي المعنى الأقرب لفظًا في المتن والبديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أخذ يسقيه» للحفاظ على الجانب الاستمراري للماضي الناقص اليوناني، وأُثبتت علامتا الحاشية [a] و[b] في المتن.
