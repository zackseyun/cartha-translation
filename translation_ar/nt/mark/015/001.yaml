id: MRK.15.1
reference: Mark 15:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: ar
  text: وفي الصباح الباكر، عقد رؤساء الكهنة فورًا مشاورة مع الشيوخ والكتبة والمجلس كله[a]. ثم أوثقوا يسوع واقتادوه وسلَّموه إلى بيلاطس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «السنهدرين كله»؛ والكلمة اليونانية تشير إلى المجلس اليهودي الحاكم.
    reason: ذكر الاسم التاريخي البديل وشرح المؤسسة المقصودة.
lexical_decisions:
- source_word: εὐθὺς
  choice: فورًا
  rationale: تنقل سرعة الحدث المميِّزة لسرد مرقس، مع وضعها في موضع عربي طبيعي إلى جانب فعل التشاور.
- source_word: πρωῒ
  choice: في الصباح الباكر
  rationale: تُظهر أن الحدث وقع في أول الصباح، بصياغة عربية واضحة وطبيعية.
- source_word: συμβούλιον ποιήσαντες
  choice: عقد ... مشاورة
  rationale: تنقل التعبير الاصطلاحي الدال على تداول رسمي، من غير جمود حرفي أو افتراض أنهم أنشؤوا المجلس في تلك اللحظة.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: المقابل العربي المألوف للجمع الذي يشير إلى كبار أصحاب السلطة الكهنوتية، لا إلى عدة أشخاص يشغلون منصب رئيس الكهنة في وقت واحد.
- source_word: πρεσβυτέρων
  choice: الشيوخ
  rationale: يشير السياق إلى قادة معترف بهم، لا إلى كبار السن عمومًا.
- source_word: γραμματέων
  choice: الكتبة
  rationale: مقابل موجز ومألوف لفئة الخبراء الدينيين والقانونيين في هذا السياق.
- source_word: ὅλον τὸ συνέδριον
  choice: المجلس كله
  rationale: يترجم اسم الهيئة الحاكمة إلى معنى واضح للقارئ، مع ذكر الاسم التاريخي المنقول صوتيًا في الحاشية.
- source_word: δήσαντες
  choice: أوثقوا
  rationale: يفيد تقييد يسوع قبل اقتياده، ويحافظ على النبرة الجادة من غير توسع.
- source_word: ἀπήνεγκαν
  choice: اقتادوه
  rationale: يلائم سياق نقل شخص مقيَّد تحت الحراسة، ولا يوحي بالضرورة بأنهم حملوه جسديًا.
- source_word: παρέδωκαν
  choice: سلَّموه
  rationale: يحفظ معنى نقل يسوع إلى سلطة بيلاطس وحراسته، من غير إضافة دلالة لاهوتية لا يصرح بها هذا الموضع.
- source_word: Πιλάτῳ
  choice: بيلاطس
  rationale: الصيغة العربية المألوفة للاسم.
theological_decisions:
- issue: مدلول συνέδριον
  choice: المجلس كله
  alternative: السنهدرين كله
  rationale: الترجمة الدلالية أوضح للقارئ الحديث، بينما تحفظ الحاشية الاسم التاريخي المحدد للهيئة اليهودية الحاكمة.
- issue: قوة παρέδωκαν في رواية الآلام
  choice: سلَّموه، بمعنى نقلوه إلى سلطة بيلاطس
  alternative: دفعوا به إلى بيلاطس
  rationale: تحافظ الصياغة على معنى التسليم القضائي ونقل الحراسة، ولا تستبق ما قد يحمله الفعل من أبعاد أوسع في سياق رواية الآلام.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. رُتِّبت الظروف على نحو طبيعي بالعربية، وحُفظ تتابع الأفعال: تقييد يسوع ثم اقتياده ثم تسليمه. وُضع مؤشر الحاشية عند «المجلس كله» لأنه المصطلح الذي تشرحه الحاشية.'
