  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: ar
  text: 'وكان المارّون يشتمونه، وهم يهزّون رؤوسهم ويقولون: «ها! يا مَن تهدم الهيكل[a] وتبنيه في ثلاثة أيام[b]،»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على نحوٍ أخص: «المقدس».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تعيد بناءه في ثلاثة أيام». الفعل اليوناني هو ببساطة «تبني»، وإن كان السياق قد يفيد إعادة البناء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: المارّون
  rationale: اسم فاعل جمع طبيعي في العربية يدل على الذين كانوا يمرّون بالمشهد، مع بقاء معنى المرور في السياق.
- source_word: ἐβλασφήμουν
  choice: يشتمونه
  rationale: يدل الفعل هنا على كلام مهين موجَّه إلى يسوع؛ و«يشتمونه» واضح ومعاصر ولا يفرض المعنى الاصطلاحي الأضيق لـ«يجدّفون».
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: وهم يهزّون رؤوسهم
  rationale: ينقل التعبير الإشاري الدال على الازدراء بصياغة عربية طبيعية.
- source_word: Οὐὰ
  choice: ها!
  rationale: صيحة تهكّم واستهزاء في هذا السياق، وليست تعبيرًا عن الرثاء أو الويل.
- source_word: ὁ καταλύων
  choice: يا مَن تهدم
  rationale: أُبرزت قوة اسم الفاعل المستعمل استعمال النداء، مع نقل معنى الهدم مباشرة من غير إضافة تفسير.
- source_word: ναὸν
  choice: الهيكل
  rationale: «الهيكل» هو المقابل العربي المألوف في هذا السياق، مع التنبيه في الحاشية إلى إمكان الدلالة الأخص على المقدس الداخلي.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: وتبنيه في ثلاثة أيام
  rationale: يحافظ على المعنى الصريح للفعل «يبني» وعلى المدة المذكورة، من غير إدخال «تعيد بناءه» في المتن.
theological_decisions:
- issue: مرجع القول عن الهيكل
  choice: نقل كلام المستهزئين بوصفه اتهامًا أو تلميحًا كما يورده مرقس، دون تفسير الهيكل في المتن بأنه جسد يسوع.
  alternative: صياغة تفسيرية تُظهر أن يسوع كان يتحدث مجازًا عن جسده.
  rationale: تحافظ الصياغة على منظور السرد وعلى التوتر اللاهوتي والتناصي من غير حسم يتجاوز ما تقوله الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل المضارع بعد «كان» لنقل الاستمرار في الفعل الماضي، وحُفظت نبرة التهكم في النداء. جميع علامات الحواشي مثبتة في المتن.
