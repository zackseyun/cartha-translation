lexical_decisions:
- source_word: γνοὺς
  choice: بعدما تحقَّق
  rationale: اسم الفاعل الأوريستي يفيد هنا الظرف الزمني السابق للفعل الرئيس؛ و«تحقَّق» تلائم سياق تثبّت بيلاطس من خبر الوفاة.
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: من قائد المئة
  rationale: حرف الجر مع المضاف إليه يبيّن مصدر المعلومة، و«قائد المئة» تسمية عربية واضحة للرتبة الرومانية التاريخية.
- source_word: ἐδωρήσατο
  choice: وهب
  rationale: الفعل يدل على الإعطاء تفضّلًا أو منح المطلوب؛ و«وهب» يحفظ هذه الدلالة الرسمية دون أن يجعله مجرد تسليم محايد.
- source_word: τὸ πτῶμα
  choice: الجثمان
  rationale: اللفظة اليونانية تدل صراحة على الجسد الميت؛ و«الجثمان» عربية طبيعية موقرة تنقل المعنى من غير قسوة زائدة.
- source_word: τῷ Ἰωσήφ
  choice: ليوسف
  rationale: المجرور باللام ينقل وظيفة المفعول غير المباشر ويحدد متلقي الجثمان.
