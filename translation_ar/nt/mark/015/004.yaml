source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος πάλιν ⸀ἐπηρώτα αὐτὸν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; ἴδε πόσα σου ⸀κατηγοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: ar
  text: 'فعاد بيلاطس يسأله قائلًا: «أما تجيب بشيء؟ انظر كم من التهم يوجّهونها إليك».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «انظر كم من الأمور يتهمونك بها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تفيد انتقال السرد مع مسحة خفيفة من المقابلة، وتنساب طبيعيًا في العربية ضمن «فعاد».
- source_word: πάλιν
  choice: عاد
  rationale: ينقل معنى تكرار الفعل، وتركيب «عاد يسأله» عربي طبيعي وواضح.
- source_word: ἐπηρώτα
  choice: يسأله
  rationale: صيغة الماضي الناقص تدل على فعل مستمر أو متكرر؛ ويؤدي «عاد يسأله» هذا المعنى من غير المبالغة التي قد يوحي بها «يستجوبه».
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على تركيب اسم الفاعل الذي يقدم الكلام، وهو فصيح ومألوف.
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: أما تجيب بشيء؟
  rationale: صياغة عربية طبيعية تحفظ ضغط السؤال على صمت يسوع وتوقع الجواب المنفي.
- source_word: ἴδε
  choice: انظر
  rationale: أمر يلفت الانتباه إلى الاتهامات القائمة، بعبارة عربية معاصرة ذات وقار.
- source_word: πόσα
  choice: كم من التهم
  rationale: المعنى الحرفي «كم من الأمور»، لكن سياق القضاء وفعل الاتهام يجعلان «التهم» إظهارًا طبيعيًا للمفعول المفهوم.
- source_word: σου
  choice: إليك
  rationale: المضاف إليه اليوناني يحدد الشخص المتهم، وتقتضي العربية مع «يوجّهون» استعمال «إليك».
- source_word: κατηγοροῦσιν
  choice: يوجّهونها
  rationale: مع «التهم» المذكورة صراحة، تنقل العبارة فعل توجيه الاتهام في السياق القضائي، ويحفظ المضارع استمرار الفعل.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يسأله» بدل «يستجوبه» لتجنب تحميل الفعل اليوناني شدة زائدة، وأُبقيت دلالة الاستمرار والتكرار في «فعاد... يسأله». وُضع رمز الحاشية بعد الاقتباس لأنه يوضح صياغة الجملة الأخيرة.
