lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: تحافظ الواو على أسلوب مرقس السردي القائم على عطف الأحداث، وتأتي طبيعية في العربية.
- source_word: ἤδη ὀψίας γενομένης
  choice: ولمّا كان المساء قد حلّ بالفعل
  rationale: تنقل العبارة الظرف الزمني المستقل، وتحفظ دلالة ἤδη على أن المساء كان قد حلّ بالفعل.
- source_word: ἐπεὶ
  choice: إذ
  rationale: تفيد هنا التعليل والتفسير، وتنسجم مع سياق السرد دون إثقال العبارة.
- source_word: παρασκευή
  choice: يوم الاستعداد
  rationale: الاسم في هذا السياق مصطلح تقويمي لليوم الذي يُستعد فيه للسبت، لا للاستعداد بمعناه العام.
- source_word: ὅ ἐστιν
  choice: أي
  rationale: صيغة عربية موجزة وطبيعية تؤدي وظيفة العبارة التفسيرية.
- source_word: προσάββατον
  choice: اليوم الذي قبل السبت
  rationale: ينقل المعنى المباشر للمصطلح بوضوح، من غير استبداله بتعيين تفسيري مثل «الجمعة».
