lexical_decisions:
- source_word: σῶσον
  choice: خلِّص
  rationale: فعل أمر ماضٍ موجَّه إلى المفرد، ويأتي هنا على سبيل التهكم والتحدي. «خلِّص» هو المقابل الطبيعي ويحفظ الصلة اللفظية بلغة الخلاص من غير قصر المعنى على النجاة الجسدية.
- source_word: σεαυτόν
  choice: نفسك
  rationale: ضمير انعكاسي في محل مفعول به مباشر، و«نفسك» تنقل بوضوح قوة التهكم الموجَّه إلى الذات.
- source_word: καταβάς
  choice: نازلًا
  rationale: اسم فاعل فعلي ماضٍ يمكن فهم علاقته بفعل الأمر على أنها فعل مصاحب أو وسيلة أو أمر مضمر. يحافظ «نازلًا» على الصيغة التابعة وعلى شيء من الإيجاز والغموض التركيبي في اليونانية.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: عن الصليب
  rationale: تعبير عربي طبيعي للحركة نزولًا من موضع الصلب، وينقل معنى الابتعاد عن الصليب في هذا السياق.
theological_decisions:
- issue: علاقة اسم الفاعل καταβάς بفعل الأمر σῶσον
  choice: 'صياغته تابعًا حاليًّا: «خلِّص نفسك، نازلًا عن الصليب!»'
  alternative: «خلِّص نفسك بالنزول عن الصليب!» أو «خلِّص نفسك؛ انزل عن الصليب!»
  rationale: اليونانية موجزة وتحتمل أن يكون النزول فعلًا مصاحبًا أو وسيلةً أو أمرًا مفهومًا ضمنًا. الصياغة المختارة تحافظ على هذا التوتر بدل أن تحسم العلاقة في معنى الوسيلة وحده أو تحولها صراحة إلى أمرين مستقلين.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة تهكمية تلائم السياق. استُعمل «خلِّص» بالشدة لتمييز الفعل المقصود، وحُفظ التركيب التابع لإبقاء الاحتمال النحوي في الأصل.
