  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: ar
  text: فاقتاده الجنود إلى داخل الساحة، أي دار الولاية[a]، واستدعوا الكتيبة كلها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «البريتوريوم»، وهو مقر الحاكم الروماني أو دار الولاية.'
    reason: lexical_alternative
  - marker: b
    text: «الكتيبة» وحدة عسكرية رومانية؛ ويشير التعبير هنا إلى الجنود المجتمعين تحت السلطة الرومانية.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: فـ
  rationale: تدل δέ هنا على تتابع السرد أكثر من دلالتها على الاستدراك، فتنقل الفاء الانتقال الطبيعي إلى الحدث التالي.
- source_word: στρατιῶται
  choice: الجنود
  rationale: المعنى المباشر المعتاد للكلمة، وهو واضح وطبيعي في العربية.
- source_word: ἀπήγαγον αὐτὸν
  choice: أخذه
  rationale: يفيد الفعل اقتياد شخص أو أخذه إلى موضع آخر؛ و«أخذه» عربية طبيعية تحافظ على المعنى من غير زيادة توحي بالقسر على نحو غير مصرح به.
- source_word: ἔσω τῆς αὐλῆς
  choice: إلى داخل الساحة
  rationale: تحافظ العبارة على معنى الدخول إلى الحيز الداخلي، وتترجم αὐλή بساحة المبنى من غير تقييدها بقصر أو نوع محدد من الأبنية.
- source_word: ὅ ἐστιν πραιτώριον
  choice: أي دار الولاية
  rationale: πραιτώριον مصطلح روماني يدل في هذا السياق على مقر الحاكم أو دار الولاية. الترجمة الوظيفية أوضح للقارئ العربي، مع توثيق اللفظ التاريخي في الحاشية.
- source_word: συγκαλοῦσιν
  choice: استدعوا
  rationale: يعبر عن دعوة أفراد الجماعة إلى الاجتماع. صيغ بالماضي لتماسك السرد العربي، مع أن اليونانية تنتقل إلى المضارع التاريخي لإضفاء الحيوية.
- source_word: ὅλην τὴν σπεῖραν
  choice: الكتيبة كلها
  rationale: σπεῖρα وحدة عسكرية رومانية؛ و«الكتيبة» أقرب مقابل عربي مفهوم، مع شرح تاريخي يمنع افتراض تطابقها التام مع وحدة عسكرية حديثة.
