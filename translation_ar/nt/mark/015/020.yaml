  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: ar
  text: ولمّا سخروا منه، نزعوا عنه الأرجوان[a] وألبسوه ثيابه، ثم أخرجوه ليصلبوه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: اللباس الأرجواني. يرد في اليونانية «الأرجوان» فقط، ويُفهم نوع اللباس من السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لكي يصلبوه». تفيد العبارة اليونانية الغرض.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: سخروا منه
  rationale: ينقل معنى الاستهزاء والمعاملة الساخرة بعبارة عربية فصيحة ومباشرة تلائم نبرة السرد.
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: نزعوا عنه الأرجوان
  rationale: يحافظ على التعبير اليوناني الموجز، حيث يدل «الأرجوان» في السياق على اللباس الأرجواني الذي ألبسوه إياه للاستهزاء.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια τὰ ἴδια
  choice: ألبسوه ثيابه
  rationale: صياغة عربية طبيعية تفيد أنهم أعادوا إليه ثيابه الشخصية؛ والضمير في «ثيابه» يؤدي معنى τὰ ἴδια من غير حشو.
- source_word: ἐξάγουσιν αὐτόν
  choice: أخرجوه
  rationale: صيغ الماضي هو الأنسب للسرد العربي، مع أن اليونانية تستعمل المضارع التاريخي لإضفاء الحيوية.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: ليصلبوه
  rationale: لام التعليل مع المضارع المنصوب تنقل بوضوح جملة الغرض اليونانية وتأتي طبيعية وموجزة بالعربية.
theological_decisions:
- issue: وصف إذلال يسوع قبل الصلب
  choice: 'نقل الأفعال بوصفها أحداثًا سردية مباشرة: السخرية، ونزع اللباس الأرجواني، وإعادة ثيابه، ثم إخراجه بقصد صلبه.'
  alternative: إضافة تفسير صريح للرمزية الملكية أو لمعنى الإذلال.
  rationale: النص نفسه يروي الأفعال بلا شرح عقائدي؛ لذلك تحافظ الترجمة على دلالتها وسياقها من غير إدخال تفسير مذهبي أو توسع غير منصوص عليه.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل الماضي في السرد على نحو طبيعي، مع إبقاء العبارة موجزة وقريبة من بنية الأصل، ووُضعت علامتا الحاشيتين في المتن.
