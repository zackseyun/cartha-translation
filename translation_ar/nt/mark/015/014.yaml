  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: ar
  text: 'لكن بيلاطس كان يقول لهم: «فما الشرّ الذي فعله؟» أما هم فصرخوا أكثر: «اصلبه!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: ينقل صيغة الماضي الناقص بوصفها قولًا مستمرًّا أو متكررًا، من غير الجزم بمقدار التكرار.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: فأيَّ شرٍّ فعل؟
  rationale: تحافظ الفاء على وظيفة γάρ في تعليل الاعتراض، ويعبّر «أيَّ شرّ» عن طلب تحديد أساس الاتهام مع إبقاء القوة الأخلاقية لكلمة κακόν.
- source_word: κακόν
  choice: شرٍّ
  rationale: «شرّ» مقابل عربي مباشر يحفظ الدلالة الأخلاقية ولا يخففها إلى مجرد «خطأ».
- source_word: περισσῶς
  choice: أكثر
  rationale: يفيد تصاعد صراخ الجمع، وهو تعبير عربي طبيعي موجز في هذا السياق.
- source_word: ἔκραξαν
  choice: صرخوا
  rationale: ينقل معنى النداء العلني المرتفع بلفظ عربي واضح وقوي.
- source_word: Σταύρωσον αὐτόν
  choice: اصلبه!
  rationale: يحافظ على صيغة الأمر المباشر الموجّهة إلى بيلاطس.
- source_word: δὲ
  choice: لكن / أما
  rationale: أُبرز التقابل الأول بـ«لكن»، والثاني بـ«أما» لتوضيح الانتقال المضاد طبيعيًا من سؤال بيلاطس إلى رد الجمع.
- source_word: Πιλᾶτος
  choice: بيلاطس
  rationale: نقل الاسم وفق الصيغة العربية الكتابية الشائعة.
theological_decisions:
- issue: درجة القوة الأخلاقية في κακόν ضمن سؤال بيلاطس
  choice: شرّ
  alternative: سوء / ذنب
  rationale: يحفظ «شرّ» الوزن الأخلاقي للفظ اليوناني في سياق الاتهام القضائي، من غير إضافة حكم لاهوتي يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ استمرار قول بيلاطس بصيغة «كان يقول»، والتقابل بين اعتراضه وتصاعد صراخ الجمع، مع تجنب الحاشية لأن البديل الإنجليزي لا يمثل غموضًا مصدرِيًّا يحتاج إلى إثبات في العربية.
