  text: καὶ φέρουσιν αὐτὸν ἐπὶ ⸀τὸν ⸀Γολγοθᾶν τόπον, ὅ ἐστιν ⸀μεθερμηνευόμενον Κρανίου Τόπος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: ar
  text: 'وأخذوه إلى موضع الجلجثة، الذي يُترجَم: «موضع الجمجمة».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «موضع جمجمة». فالعبارة اليونانية لا تحتوي على أداة تعريف، ولذلك يمكن فهمها على أنها «جمجمة» أو «الجمجمة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: أخذوه
  rationale: ينقل معنى إحضاره إلى وجهة من غير أن يحدد هل كان يُقاد أم يُحمَل، ويأتي الماضي طبيعيًا في السرد العربي بدل المضارع التاريخي اليوناني.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: إلى موضع الجلجثة
  rationale: تحفظ العبارة دلالة الحركة نحو المكان، وتُبقي لفظ «موضع» مع الاسم العلم كما في اليونانية، من غير إضافة «المدعو» غير الموجودة صراحة.
- source_word: Γολγοθᾶν
  choice: الجلجثة
  rationale: نقل صوتي للاسم العلم بصيغته العربية الكتابية الشائعة.
- source_word: μεθερμηνευόμενον
  choice: يُترجَم
  rationale: يعكس فعل الترجمة والتفسير اللغوي صراحة، وهو أدق من الاكتفاء بقول «يعني».
- source_word: Κρανίου Τόπος
  choice: موضع الجمجمة
  rationale: ترجمة عربية طبيعية للإضافة اليونانية. أداة التعريف العربية في هذا التركيب لا تحسم بالضرورة بين جمجمة معينة وبين تسمية المكان، لذلك تُذكر الإمكانية في الحاشية.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «أخذوه» لتجنب الإيحاء غير المحسوم في «حملوه»، مع الحفاظ على حركة الإحضار إلى المكان. وُضعت علامة الحاشية بعد العبارة المترجمة التي تتعلق بها.
