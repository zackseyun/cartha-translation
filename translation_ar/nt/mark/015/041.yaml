base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: ar
  text: وهؤلاء النساء، حين كان في الجليل، كُنَّ يتبعنه ويخدمنه[a]، وكثيراتٌ أخريات من النساء صعدن معه إلى أورشليم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يقدّمن له العون». فالفعل اليوناني قد يدل على الخدمة العملية أو تقديم الدعم.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «صعدن معه إلى أورشليم»، وفق التعبير الكتابي المألوف عن الصعود إلى أورشليم.'
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: وهؤلاء النساء
  rationale: يعود ضمير الوصل المؤنث إلى النساء المذكورات في الآية السابقة. والتعبير «هؤلاء النساء» يجعل الإحالة واضحة وطبيعية بالعربية من غير تغيير مرجعها.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: حين كان في الجليل
  rationale: نقل مباشر للجملة الزمنية مع إبقاء اسم المكان كما في الأصل.
- source_word: ἠκολούθουν
  choice: كُنَّ يتبعنه
  rationale: صيغة الماضي الناقص في اليونانية تدل هنا على فعل معتاد أو مستمر في الماضي، وهذا المعنى يؤديه تركيب «كُنَّ يتبعنه» بوضوح.
- source_word: διηκόνουν αὐτῷ
  choice: ويخدمنه
  rationale: الفعل يدل على تقديم خدمة عملية أو عون شخصي. و«يخدمنه» تعبير عربي واسع وطبيعي لا يحصر الخدمة في نوع واحد ولا يستورد معنى منصب كنسي لاحق.
- source_word: ἄλλαι πολλαὶ
  choice: نساء كثيرات أخريات
  rationale: السياق وصيغة التأنيث في الأصل يدلان صراحة على النساء، وذِكر الاسم في العربية يزيل اللبس.
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: صعدن معه
  rationale: يحفظ التعبير اتجاه الصعود الوارد في الأصل والاصطلاح الكتابي المتعلق بالذهاب إلى أورشليم، مع صياغة عربية مألوفة.
- source_word: εἰς Ἱεροσόλυμα
  choice: إلى أورشليم
  rationale: ينقل معنى الوجهة الذي تؤديه εἰς مع اسم المدينة.
theological_decisions:
- issue: طبيعة خدمة النساء التي يعبّر عنها διηκόνουν
  choice: يخدمنه
  alternative: يقمن على خدمته / يقدّمن له العون
  rationale: يحافظ الاختيار على سعة معنى الفعل، الذي قد يشمل الخدمة العملية والرعاية والدعم، من غير حصره في أعمال منزلية أو تحميله دلالة منصب كنسي.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل «كُنَّ يتبعنه» لإظهار الاستمرار أو الاعتياد في الماضي، وحُفظ تعبير «صعدن ... إلى أورشليم» لما فيه من دلالة مكانية واصطلاح كتابي.
