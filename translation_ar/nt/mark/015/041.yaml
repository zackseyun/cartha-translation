  to: وهؤلاء النساء، حين كان في الجليل، كُنَّ يتبعنه ويخدمنه[a]، وكثيراتٌ أخريات من النساء صعدن معه إلى أورشليم[b].
  rationale: حُذف التركيب الوجودي «وكان هناك أيضًا» لأنه ليس لازمًا لتمثيل اليونانية، واستُبدل بتركيب عربي مباشر يحافظ على «كثيرات أخريات» وعلى مشاركتهن في الصعود مع يسوع إلى أورشليم. ولم يُغيَّر المعنى أو المرجع أو دلالة الخدمة.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:24Z'
