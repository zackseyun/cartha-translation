  text: And the chief priests were accusing him of many things[a].
translation:
  language: ar
  text: وكان رؤساء الكهنة يوجّهون إليه اتهامات كثيرة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصورة أقرب إلى اللفظ: «وكان رؤساء الكهنة يتهمونه بأمور كثيرة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وكان
  rationale: يجمع بين أداة الربط واستمرار السرد، ويصل الآية بما قبلها في عربية طبيعية.
- source_word: κατηγόρουν
  choice: يوجّهون إليه اتهامات
  rationale: ينقل دلالة الماضي الناقص على فعل متواصل أو متكرر، كما يلائم سياق الاتهام أمام الحاكم.
- source_word: αὐτοῦ
  choice: إليه
  rationale: المضاف إليه اليوناني مع فعل الاتهام يدل على الشخص الموجَّه إليه الاتهام؛ وصيغة «إليه» فصيحة وطبيعية مع «يوجّهون».
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: التعبير العربي المألوف للقيادات الكهنوتية، ولا يوحي بوجود عدة أشخاص يشغلون منصب رئيس الكهنة المفرد في آن واحد.
- source_word: πολλά
  choice: اتهامات كثيرة
  rationale: يعبر عن كثرة الأمور التي اتهموه بها من غير تحديد مضمونها، مع جعل المعنى الضمني صريحًا بأسلوب عربي واضح.
