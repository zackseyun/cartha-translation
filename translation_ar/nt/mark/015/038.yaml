lexical_decisions:
- source_word: καταπέτασμα
  choice: ستار
  rationale: لفظ عربي واضح ومعاصر يدل على الحاجز المعلَّق داخل الهيكل، ويحفظ الصورة المحسوسة من غير إضافة تفسير رمزي.
- source_word: ναοῦ
  choice: الهيكل
  rationale: الترجمة المألوفة والطبيعية في هذا السياق؛ وقد يدل اللفظ اليوناني تحديدًا على مَقدِس الهيكل، لكن السياق العربي لا يستلزم إثقال النص بتحديد إضافي.
- source_word: ἐσχίσθη
  choice: انشقَّ
  rationale: ينقل وقوع الشق في الستار بصياغة عربية طبيعية، ويحافظ على المبني للمجهول الدلالي من غير تعيين الفاعل.
- source_word: εἰς δύο
  choice: إلى اثنين
  rationale: يقابل التعبير اليوناني مباشرة، ويفيد انقسام الستار قسمين دون إضافة لفظ «قطعتين» غير المذكور صراحة.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: من فوق إلى أسفل
  rationale: صياغة عربية موجزة وطبيعية تحفظ اتجاه الانشقاق ومداه.
- source_word: καὶ
  choice: و
  rationale: أداة الربط السردية البسيطة المطابقة لليونانية من غير إضافة دلالة زمنية.
theological_decisions:
- issue: الدلالة التفسيرية لانشقاق ستار الهيكل
  choice: عرض الحدث وصفيًا من غير شرح رمزي في متن الآية.
  alternative: تفسير الانشقاق بأنه فتح طريق الوصول إلى الله، أو بأنه دينونة لنظام الهيكل.
  rationale: الآية تذكر الحدث ولا تصرّح بمعناه اللاهوتي؛ لذلك تُحفظ إمكانات التفسير والتوتر اللاهوتي من غير حسم داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. اختير «ستار الهيكل» لأنه طبيعي ومفهوم، مع إبقاء العبارة موجزة وقريبة من ترتيب الأصل اليوناني.
