  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: ar
  text: وكانت هناك أيضًا نساءٌ ينظرن من بعيد[a]، بينهن مريم المجدلية، ومريم أم يعقوب الصغير[b] ويوسي[c]، وسالومة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عن بُعد».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يدل «الصغير» على الأصغر سنًّا، أو الأقصر قامةً، أو الأقل مكانةً؛ والنص لا يحدد المراد.
    reason: lexical_alternative
  - marker: c
    text: الاسم اليوناني هنا هو «يوسي»، وهو صيغة متميزة عن «يوسف».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ
  choice: وكانت أيضًا
  rationale: صياغة سردية عربية طبيعية تحفظ القوة الإضافية لأداة καί من غير إثقال ترجمة δέ.
- source_word: γυναῖκες
  choice: نساءٌ
  rationale: المقابل العربي المباشر والطبيعي للجمع، ويشير هنا إلى النساء الحاضرات في مشهد الصلب.
- source_word: ἀπὸ μακρόθεν
  choice: من بعيد
  rationale: تعبير عربي مألوف يحفظ الدلالة المكانية للمشاهدة عن بُعد.
- source_word: θεωροῦσαι
  choice: يراقبن
  rationale: ينقل معنى النظر المتواصل باهتمام الذي تدل عليه صيغة اسم الفاعل الحاضر.
- source_word: ἐν αἷς
  choice: بينهن
  rationale: يبين أن المذكورات لاحقًا بعضٌ من جماعة النساء الأكبر.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: مريم المجدلية
  rationale: الصيغة العربية الشائعة للاسم والنسبة إلى مجدل.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: مريم أم يعقوب الصغير ويوسي
  rationale: تجعل علاقة الأمومة بالاسمين واضحة، وتحفظ وصف μικρός من غير حسم ما إذا كان متعلقًا بالعمر أو القامة أو المكانة.
- source_word: Ἰακώβου
  choice: يعقوب
  rationale: الصيغة العربية الكتابية المستقرة للاسم اليوناني Ἰάκωβος.
- source_word: τοῦ μικροῦ
  choice: الصغير
  rationale: يحفظ الغموض الدلالي في اليونانية بدرجة أفضل من «الأصغر سنًّا»، إذ قد يشير الوصف إلى السن أو القامة أو المكانة.
- source_word: Ἰωσῆτος
  choice: يوسي
  rationale: يحافظ على صورة الاسم اليوناني المتميزة هنا ولا يوحّدها مع «يوسف».
- source_word: Σαλώμη
  choice: سالومة
  rationale: نقل صوتي عربي واضح للاسم الشخصي اليوناني.
theological_decisions:
- issue: دلالة وصف يعقوب بـ τοῦ μικροῦ
  choice: يعقوب الصغير
  alternative: يعقوب الأصغر أو يعقوب الأقل
  rationale: النص لا يحدد هل المراد صغر السن أم القامة أم المكانة؛ لذا تحافظ «الصغير» على التوتر الدلالي بدل حسمه لصالح العمر.
- issue: تمييز اسم Ἰωσῆτος عن يوسف
  choice: يوسي
  alternative: يوسف
  rationale: يحفظ التمييز الاسمي الظاهر في النص اليوناني ولا ينسّق الاسم مع صيغة أخرى بدافع التقليد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع ترتيب طبيعي للأسماء، والمحافظة على الغموض الحقيقي في وصف يعقوب وعلى تميّز اسم يوسي.
