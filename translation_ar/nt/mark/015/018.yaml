lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: تحافظ أداة العطف البسيطة على أسلوب مرقس السردي المتتابع من غير إضافة دلالة زمنية تفسيرية مثل «ثم».
- source_word: ἤρξαντο
  choice: بدأوا
  rationale: تنقل معنى الشروع مع المصدر نقلاً مباشرًا وطبيعيًا في العربية.
- source_word: ἀσπάζεσθαι
  choice: يحيّونه
  rationale: الفعل يدل في الأصل على التحية، لكنه في هذا السياق فعل أدائي ساخر يحاكي تحية الملوك؛ و«يحيّونه» واضحة وطبيعية وتحفظ إمكان المعنى العام.
- source_word: Χαῖρε
  choice: السلام عليك
  rationale: هذه صيغة تحية مباشرة مألوفة في العربية، وتناسب استعمال الأمر اليوناني اصطلاحيًا للتحية، بينما يُفهم طابعها الملكي الساخر من السياق والنداء التالي.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: يا ملك اليهود
  rationale: نُقل المنادى بصيغة عربية طبيعية، واختير «اليهود» لأنه المعنى المعتاد للقب في سياق آلام يسوع، مع إثبات البديل الجغرافي الممكن في الحاشية.
theological_decisions:
- issue: نقل التحية الساخرة ليسوع مع إبقاء دلالتها الملكية ومفارقتها
  choice: «السلام عليك، يا ملك اليهود!» بوصفها تحية ملكية ساخرة في السياق
  alternative: «مرحبًا، يا ملك اليهود!»
  rationale: الصياغة المختارة تحفظ هيئة الخطاب الرسمي المباشر ولا تخفف الإشارة إلى الملوكية، من غير أن تضيف إلى النص وصفًا صريحًا للسخرية أو تفسيرًا عقائديًا.
