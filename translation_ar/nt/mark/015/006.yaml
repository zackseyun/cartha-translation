  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: ar
  text: وكان يطلق لهم في العيد سجينًا واحدًا يطلبونه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي كانوا يطلبونه».'
    reason: بديل يبرز بصورة أصرح صيغة الماضي الناقص في الفعل اليوناني، مع بقاء المعنى الأساسي واحدًا.
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: وكان في العيد
  rationale: تفيد العبارة الزمن الذي جرت فيه العادة. ونُقل δέ بربط خفيف مع السياق، بينما تعبّر صيغة «كان» مع الفعل المضارع عن العادة الماضية من غير إضافة ظرف مثل «الآن» لا وجود له في الأصل.
- source_word: ἀπέλυεν
  choice: كان يطلق
  rationale: الماضي الناقص هنا يدل على فعل اعتيادي متكرر، وصيغة «كان يطلق» تؤدي هذا المعنى بوضوح وطبيعية.
- source_word: αὐτοῖς
  choice: لهم
  rationale: تدل صيغة المجرور باليونانية على أن إطلاق السجين كان لمصلحتهم أو استجابة لهم، ولذلك تلائمها «لهم».
- source_word: ἕνα δέσμιον
  choice: سجينًا واحدًا
  rationale: حُفظ العدد الصريح ἕνα بلفظ «واحدًا»، وتؤدي «سجين» معنى δέσμιος طبيعيًا في هذا السياق القضائي.
- source_word: ὃν παρῃτοῦντο
  choice: يطلبونه
  rationale: يدل الفعل على طلب شخص بعينه. و«يطلبونه» موجزة وطبيعية، كما تنسجم صيغتها مع الإطار الاعتيادي الذي تفيده الجملة.
theological_decisions: []
