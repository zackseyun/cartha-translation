  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: ar
  text: 'وكانت عبارةُ التهمة الموجَّهة إليه مكتوبةً: «ملكُ اليهود».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ملكُ أهلِ اليهودية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: العبارة
  rationale: تشير إلى النص المكتوب المثبّت على الصليب. و«العبارة» طبيعية في العربية وتدل على مضمون الكتابة من غير إضافة هيئة مادية لا يصرّح بها الأصل.
- source_word: αἰτία
  choice: التهمة الموجّهة إليه
  rationale: للكلمة هنا معنى قضائي، أي التهمة المعلنة عليه؛ وهذه الصياغة واضحة وتحافظ على دلالة السياق.
- source_word: ἐπιγεγραμμένη
  choice: مكتوبة
  rationale: مع فعل الكينونة تعبّر صيغة اسم المفعول التام عن أن العبارة كانت قائمة مكتوبة؛ و«مكتوبة» تنقل ذلك بإيجاز طبيعي.
- source_word: βασιλεὺς
  choice: مَلِك
  rationale: تنقل اللقب الملكي الوارد بوصفه مضمون التهمة، من غير تفسير زائد.
- source_word: Ἰουδαίων
  choice: اليهود
  rationale: هو المقابل العربي المألوف لتسمية الجماعة في لقب الآلام «ملك اليهود»، مع إثبات البديل الجغرافي الممكن في الحاشية.
theological_decisions:
- issue: ترجمة Ἰουδαίων في عنوان الصلب
  choice: اليهود
  alternative: اليهوديّين، أي أهل اليهودية
  rationale: السياق ينقل صيغة التهمة الرومانية ولقبًا ثابتًا في روايات الآلام. «اليهود» يحفظ الصيغة العربية المعروفة ولا يضيّق المعنى جغرافيًا، بينما تظل دلالة «أهل اليهودية» ممكنة معجميًا ولذلك تُذكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «العبارة التي تبيّن التهمة» لتجنب الترجمة الحرفية الثقيلة، مع إبقاء بنية الجملة ومضمون النقش قريبين من اليونانية.
