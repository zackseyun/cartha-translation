  yaml_path: translation/nt/mark/015/025.yaml
  text: It was the third hour[a], and they crucified him.
translation:
  language: ar
  text: وكانت الساعة الثالثة[a] حين صلبوه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي نحو التاسعة صباحًا، بحسب الطريقة اليهودية الشائعة في حساب ساعات النهار.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ
  choice: وكانت
  rationale: ينقل الفعل الناقص الدال على الزمن مع أداة الربط السردية δὲ بعبارة عربية طبيعية موجزة، من غير إضافة معنى «الآن» غير الموجود صراحة.
- source_word: ὥρα τρίτη
  choice: الساعة الثالثة
  rationale: يحافظ على طريقة التعبير القديمة في الأصل، بدل تحويلها داخل المتن إلى التوقيت الحديث.
- source_word: καὶ
  choice: حين
  rationale: تُفهم الواو هنا في سياق العبارة الزمنية على اقتران الصلب بالساعة المذكورة؛ و«حين» تصوغ ذلك بعربية واضحة من غير تغيير للمعلومة.
- source_word: ἐσταύρωσαν αὐτόν
  choice: صلبوه
  rationale: صياغة عربية مباشرة تجمع الفعل وضمير المفعول العائد إلى يسوع، وتحافظ على دلالة الصلب دون شرح زائد.
theological_decisions:
- issue: صياغة التعبير الزمني وعلاقته بالتسلسل الزمني
  choice: إبقاء «الساعة الثالثة» في المتن
  alternative: «نحو التاسعة صباحًا»
  rationale: النص نفسه يستعمل نظامًا زمنيًا قديمًا ولا يحوله إلى الساعة الحديثة. إبقاء اللفظ الحرفي يحفظ التوتر الزمني المحتمل ولا يفرض معالجة توفيقية، مع توضيح المقصود المرجح في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة وذات نبرة كتابية وقورة. استُخدم «حين» لربط تحديد الوقت بالفعل ربطًا طبيعيًا، مع إبقاء نظام عدّ الساعات القديم في المتن.
