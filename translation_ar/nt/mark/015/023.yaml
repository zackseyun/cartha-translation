lexical_decisions:
- source_word: ἐδίδουν
  choice: كانوا يعطونه
  rationale: ينقل صيغة الماضي الناقص اليونانية، بما توحي به من فعل جارٍ أو محاولة متواصلة، ويحافظ على المعنى الأساسي للفعل «يعطي».
- source_word: ἐσμυρνισμένον οἶνον
  choice: خمرًا ممزوجةً بالمُرّ
  rationale: صياغة عربية واضحة تنقل كون الخمر قد أُعدّت بالمُرّ، من غير إضافة تفسير لغرضه.
- source_word: ὃς δὲ
  choice: لكنه
  rationale: ينقل رجوع العبارة إلى يسوع وقوة الاستدراك الخفيفة في δέ بصياغة عربية طبيعية.
- source_word: ἔλαβεν
  choice: لم يأخذها
  rationale: ينقل المعنى المباشر للفعل λαμβάνω، مع إظهار ضمير المفعول الذي يدل عليه السياق.
theological_decisions:
- issue: سبب امتناع يسوع عن الشراب
  choice: وصف امتناعه من غير بيان سببه
  alternative: التصريح بأنه رفض مخدّرًا لتسكين الألم، أو ربط الشراب بعادة معينة
  rationale: النص اليوناني يذكر تقديم الخمر الممزوجة بالمُرّ وأنه لم يأخذها، لكنه لا يفسر دافع الرفض؛ لذلك تُحفظ دلالة النص وحدودها من غير حسم تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «كانوا يعطونه» لإبراز الجانب الاستمراري، ووُضعت علامتا الحاشيتين في المتن عند موضعي البديلين المعجميين.
