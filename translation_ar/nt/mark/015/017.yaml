  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: ar
  text: وألبسوه أرجوانًا[a]، وضفروا إكليلًا من شوك ووضعوه عليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ثوبًا أرجوانيًّا»؛ لا يذكر النص اليوناني لفظ «ثوب» صراحة في هذه الآية، وإن كان السياق يدل على لباس.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: ألبسوه
  rationale: الفعل يدل على إلباس شخص، وهذه الصياغة العربية الطبيعية تحفظ المعنى السببي.
- source_word: πορφύραν
  choice: أرجوانًا
  rationale: قد يدل الاسم على نسيج أرجواني أو ثوب أرجواني، ولم يذكر اليوناني لفظ «رداء» صراحة، فحُفظ الإيجاز والغموض المعجمي.
- source_word: περιτιθέασιν
  choice: وضعوه عليه
  rationale: الفعل يعني وضع الشيء حول شخص أو عليه، والضمير يعود بوضوح إلى الإكليل المذكور.
- source_word: πλέξαντες
  choice: وضفروا
  rationale: الضفر تعبير عربي مناسب لصنع الإكليل بتشبيك الشوك، وترتيب الجملة يفيد أن صنعه سبق وضعه.
- source_word: ἀκάνθινον
  choice: من شوك
  rationale: الصفة تعني مصنوعًا من الشوك، والتعبير بالإضافة بواسطة «من» طبيعي وواضح.
- source_word: στέφανον
  choice: إكليلًا
  rationale: «إكليل» ينقل معنى التاج أو الطوق في سياق محاكاة الملوكية على سبيل السخرية، من غير إضافة تفسير إلى النص.
theological_decisions:
- issue: صورة الملوكية الساخرة في إذلال يسوع
  choice: إكليل
  alternative: طوق؛ تاج
  rationale: يحفظ «إكليل» دلالة στέφανος وصورة الملوكية الساخرة، مع تجنب حصر اللفظ في التاج الملكي المصمت.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم الفعل الماضي للسرد العربي الطبيعي، مع إبقاء «أرجوانًا» بلا إضافة «رداء» أو «ثوب» في المتن حفاظًا على صياغة الأصل.
