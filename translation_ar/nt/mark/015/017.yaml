  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: إلباس يسوع الأرجوان، وضفر إكليل من الشوك، ووضعه عليه. وترتيب «وضفروا... ووضعوه» يعبّر طبيعيًا عن سبق فعل الضفر الذي تدل عليه صيغة اسم الفاعل اليونانية πλέξαντες، من دون إضافة تفصيل غير مذكور.'
