  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: ar
  text: 'فأجابهم بيلاطس من جديد: «فماذا تريدون إذن أن أفعل بمن تسمّونه ملك اليهود؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: من جديد
  rationale: يدل الظرف على أن بيلاطس عاد إلى مخاطبتهم في سياق الحوار، و«من جديد» تعبير عربي طبيعي يحفظ معنى التكرار.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: فأجابهم
  rationale: هذا التركيب السردي المؤلف من اسم الفاعل والفعل الناقص يُنقل طبيعيًا إلى العربية بفعل واحد، من غير الصياغة الحرفية الثقيلة «أجاب وكان يقول».
- source_word: Τί οὖν
  choice: فماذا ... إذن
  rationale: تحفظ الفاء و«إذن» الصلة الاستنتاجية بما سبق، مع ترتيب عربي واضح وطبيعي.
- source_word: θέλετε
  choice: تريدون
  rationale: يعبر الفعل هنا عن رغبة الجموع في الإجراء الذي سيتخذه بيلاطس.
- source_word: ποιήσω
  choice: أن أفعل
  rationale: ينقل المضارع المنصوب بعد فعل الإرادة معنى صيغة الاحتمال اليونانية نقلاً عربيًا مباشرًا وطبيعيًا.
- source_word: ὃν λέγετε
  choice: بالذي تسمّونه
  rationale: تحفظ العبارة إسناد التسمية إلى المخاطَبين، ولا تضيف إقرارًا من بيلاطس بصحة اللقب.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: ملك اليهود
  rationale: هو اللقب السياسي المتكرر في رواية الآلام، وتأتي «ملك» هنا خبرًا في صلة الموصول لا اعترافًا إيمانيًا من المتكلم.
theological_decisions:
- issue: هل تنسب صياغة بيلاطس مُلك يسوع إليه بوصفه حقيقة يقرّ بها، أم تعرضه بوصفه تسمية الجموع؟
  choice: «بالذي تسمّونه ملك اليهود» لإبقاء اللقب منسوبًا إلى قول الجموع.
  alternative: «بالذي تقولون إنه ملك اليهود» أو «بمن تسمّونه ملك اليهود».
  rationale: تجعل العبارة اليونانية ὃν λέγετε التسمية مرتبطة بما يقوله المخاطَبون؛ لذلك يحفظ النص المسافة البلاغية من غير أن يحوّل كلام بيلاطس إلى إقرار أو إنكار لملوكية يسوع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «تسمّونه» لإظهار قوة λέγετε في هذا السياق، مع الحفاظ على إيجاز الأسلوب الحواري. لا توجد علامة حاشية لأن النص المقترح يثبت البديل الدلالي بوضوح في المتن، ولأن الحاشية الإنجليزية المزوّدة تبدو غير متطابقة مع متنها.
