base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: ar
  text: «لِيَنْزِلِ الآنَ الْمَسِيحُ[a]، مَلِكُ إِسْرَائِيلَ، عَنِ الصَّلِيبِ، لِنَرَى وَنُؤْمِنَ». وَكَانَ الَّذِينَ صُلِبُوا مَعَهُ أَيْضًا يُعَيِّرُونَهُ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الممسوح، وهو لقب ملكي.'
    reason: lexical_explanation
  - marker: b
    text: 'أو: يشتمونه، أو يوبخونه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ χριστός
  choice: الْمَسِيحُ
  rationale: استُعمل بوصفه لقبًا ملكيًّا مسيانيًّا في سياق التهكم، لا اسمًا عَلَمًا؛ و«المسيح» هو المقابل العربي الطبيعي الذي يحفظ معنى الممسوح.
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: مَلِكُ إِسْرَائِيلَ
  rationale: ترجمة مباشرة للقب، وتحفظ صلته بالسخرية من مُلك يسوع المزعوم في كلام المتكلمين.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: لِيَنْزِلِ الآنَ ... عَنِ الصَّلِيبِ
  rationale: صيغة الأمر للغائب تنقل الطلب التهكمي، و«الآن» تحفظ فورية التحدي، و«عن الصليب» تعبير عربي طبيعي للحركة من عليه.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: لِنَرَى وَنُؤْمِنَ
  rationale: تحفظ غرض التحدي المزعوم وتسلسل الفعلين بإيجاز عربي واضح، من غير إضافة مفعول يحسم ما تركه اليوناني مطلقًا.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: الْمَصْلُوبَانِ مَعَهُ
  rationale: السياق السابق في مرقس يحدد شخصين صُلبا معه؛ فالمثنى العربي أدق وأطبع من الموصول الجمعي.
- source_word: ὠνείδιζον αὐτόν
  choice: كَانَ ... يُعَيِّرَانِهِ
  rationale: تركيب «كان» مع المضارع ينقل دلالة الاستمرار في الماضي التي يحملها الناقص اليوناني، و«يعيّران» تلائم الإهانة والتوبيخ في السياق.
theological_decisions:
- issue: دلالة Χριστός في سياق السخرية
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» لقب عربي راسخ يحفظ الدلالة الملكية الدينية في هذا السياق، بينما «الممسوح» ترجمة تفسيرية أقل طبيعية وقد توحي بمجرد المسح الحسي.
- issue: متعلَّق الإيمان في قولهم πιστεύσωμεν
  choice: الإبقاء على «نؤمن» بلا مفعول
  alternative: نؤمن به
  rationale: النص اليوناني لا يصرح بمتعلَّق الفعل؛ وإبقاء الفعل مطلقًا يصون الإيجاز والتهكم والغموض الحقيقي بدل تفسيره داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع ضبط أواخر الكلمات لتيسير قراءة البنية النحوية. حُفظت نبرة التحدي الساخرة، واستُعمل المثنى لأن مرقس 15:27 يذكر اثنين صُلبا معه. وُضع كل مؤشّر حاشية في المتن.
