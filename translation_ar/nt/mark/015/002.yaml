  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: ar
  text: 'وسأله بيلاطس: «أأنت ملك اليهود[a]؟» فأجابه: «أنت تقول».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اليهوديين». وتعكس عبارة «ملك اليهود» هنا التهمة السياسية المألوفة المعروضة أمام بيلاطس.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «هذا ما تقوله أنت». الجواب مقتضب ويحتفظ بقدر من الالتباس، فلا يصرّح بإثبات مطلق ولا بإنكار.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: سأله
  rationale: الفعل يدل على السؤال أو الاستفسار، و«سأله» عربية طبيعية لا تبالغ في تصوير الموقف بوصفه استجوابًا رسميًا.
- source_word: Σὺ εἶ
  choice: أأنت
  rationale: صيغة استفهام طبيعية تحفظ بروز الضمير الصريح في اليونانية.
- source_word: βασιλεὺς
  choice: ملك
  rationale: ينقل المعنى الملكي المباشر ويحفظ الطابع السياسي للتهمة.
- source_word: Ἰουδαίων
  choice: اليهود
  rationale: «ملك اليهود» هو التعبير السياسي المعروف في سياق المحاكمة أمام بيلاطس؛ ويمكن من حيث الدلالة اللغوية أن يُفهم اللفظ أيضًا على أنه «اليهوديين/أهل اليهودية».
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: فأجابه
  rationale: صياغة عربية موجزة وطبيعية تنقل تركيب فعل الإجابة مع القول من غير تكلّف، وإن لم تحاكِ المضارع التاريخي اليوناني حرفيًا.
- source_word: Σὺ λέγεις
  choice: أنت تقول
  rationale: ترجمة قريبة من اللفظ تحفظ إيجاز الجواب وما فيه من التباس، ولا تحوله إلى إقرار صريح أو إنكار.
theological_decisions:
- issue: دلالة جواب يسوع Σὺ λέγεις
  choice: «أنت تقول» بوصفها إجابة مقتضبة تحتفظ بقدر من الالتباس
  alternative: «نعم، كما تقول» أو «هذا ما تقوله أنت»
  rationale: النص اليوناني لا يورد «نعم» صراحة، ولذلك لا ينبغي حسم الجواب بوصفه إثباتًا مطلقًا أو نفيًا؛ والصياغة المختارة تُبقي العبارة على لسان بيلاطس كما في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «أأنت» للمحافظة على توكيد الضمير، و«أنت تقول» لصون إيجاز الأصل وتوتره الدلالي. لم توضع حاشية بعد «اليهود» لأن النص الرئيس لا يحمل علامة لها في هذه المسودة؛ أما البديل «أهل اليهودية/اليهوديون» فمذكور في القرار المعجمي.
