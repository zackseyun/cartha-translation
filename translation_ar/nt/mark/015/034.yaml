  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: ar
  text: 'وعند الساعة التاسعة، صرخ يسوع بصوت عالٍ: «إلوي، إلوي، لِما شبقتني؟»[a]، التي تُترجم: «إلهي، إلهي، لماذا تركتني؟»[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تقرأ بعض المخطوطات، وتورد تقاليد ترجمية كثيرة، صيغة تقابل «لَما شبقتني» بدلًا من «لِما شبقتني».
    reason: textual_variant
  - marker: b
    text: تردد كلمات يسوع صدى المزمور 22:1.
    reason: cross_reference
  - marker: c
    text: 'أو: «لأي سبب تركتني؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: عند الساعة التاسعة
  rationale: يحافظ على طريقة مرقس القديمة في التعبير عن الوقت، من غير استبدالها بالتوقيت الحديث التفسيري «الساعة الثالثة بعد الظهر».
- source_word: ἐβόησεν ... φωνῇ μεγάλῃ
  choice: صرخ ... بصوت عظيم
  rationale: ينقل قوة الصرخة وعلو الصوت مع الحفاظ على النبرة المهيبة للنص اليوناني.
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: إلوي، إلوي، لِما شبقتني؟
  rationale: يحافظ على اللفظ السامي الذي أورده مرقس قبل أن يقدم معناه، ولا يوحّده مع صيغة متى «إيلي، إيلي».
- source_word: μεθερμηνευόμενον
  choice: ومعناه
  rationale: صياغة عربية طبيعية واضحة تدل على أن مرقس يقدّم ترجمة العبارة السامية وشرح معناها.
- source_word: εἰς τί
  choice: لماذا
  rationale: المقابل العربي الطبيعي المباشر للسؤال عن السبب، مع إبقاء البديل الأكثر تفصيلًا في الحاشية.
- source_word: ἐγκατέλιπές με
  choice: تركتني
  rationale: ينقل معنى التخلي في هذا السياق، ويوافق الصدى الكتابي للمزمور 22:1 بلغة عربية مألوفة ومهيبة.
theological_decisions:
- issue: صلة صرخة يسوع بالمزمور 22:1
  choice: إبقاء الصرخة مباشرة بصيغتها الحادة، مع التنبيه إلى صداها الكتابي في الحاشية فقط.
  alternative: تلطيف معنى الترك أو إضافة تفسير عقائدي لطبيعة التخلي.
  rationale: يعرض النص الصرخة من غير أن يشرح كيفية فهمها لاهوتيًا؛ لذلك تحافظ الترجمة على التوتر المقصود ولا تحسمه بإضافة تفسير مذهبي.
- issue: نقل كلمات يسوع السامية
  choice: إبقاء العبارة منقولة صوتيًا ثم تقديم معناها، كما فعل مرقس.
  alternative: حذف العبارة السامية والاكتفاء بترجمتها، أو توحيدها مع صيغة متى.
  rationale: يحترم هذا البناء الأدبي للنص المصدر ويحفظ خصوصية رواية مرقس.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ تعبير «الساعة التاسعة» وصيغة النداء السامية، بينما استُعمل «ومعناه» لتكون الجملة طبيعية للقارئ المعاصر. جميع علامات الحواشي مثبتة في المتن.
