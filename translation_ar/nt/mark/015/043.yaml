    issue: دلالة εὐσχήμων في «عضوًا محترمًا»
    rationale: اللفظ يشير إلى شخص ذي وجاهة أو مكانة معتبرة، لا إلى كونه محترمًا فحسب. «عضو وجيه في المجلس» أنسب للسياق الاجتماعي وللدلالة المعجمية.
  - severity: low
    issue: فصل «فتجرأ» عن «دخل» بنقطة
    rationale: التعبير لا يخل بالمعنى، لكن المشاركة اليونانية τολμήσας تتصل بالفعل الرئيس εἰσῆλθεν اتصالًا وثيقًا؛ فربطهما يحسن إبراز أن دخوله إلى بيلاطس هو الفعل الجريء.
  - severity: low
    issue: الحاشية تشرح لفظًا لم يعد الأمثل في المتن
    rationale: بعد اعتماد «وجيه»، ينبغي أن تعرض الحاشية البدائل المعجمية ذات الصلة، وأن تبيّن أن الجرأة متصلة بالدخول إلى بيلاطس.
