revisions:
- from: فجاء يوسف الذي من الرامة، وكان عضوًا محترمًا في المجلس، وكان هو أيضًا ينتظر ملكوت الله. فتجرأ ودخل على بيلاطس وطلب جسد يسوع.[a]
  to: فجاء يوسف من الرامة، وهو عضو وجيه في المجلس، وكان هو أيضًا ينتظر ملكوت الله؛ فتجرأ فدخل على بيلاطس وطلب جسد يسوع.[a]
  rationale: استُبدلت «محترمًا» بـ«وجيه» لتدل على المكانة والاعتبار اللذين يفيدهما εὐσχήμων، ووُصلت الجرأة بالدخول لإبراز وظيفة τολμήσας بالنسبة إلى εἰσῆλθεν. وحُفظت دلالة ἐλθὼν في «فجاء»، وعمومية «المجلس»، والتعبير الاصطلاحي «ملكوت الله».
  reviewer_model: gpt-5.6-terra
