source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: ar
  text: فجاء يوسف من الرامة، وهو عضو وجيه في المجلس، وكان هو أيضًا ينتظر ملكوت الله؛ فتجرأ فدخل على بيلاطس وطلب جسد يسوع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «وجيه» بـ«ذو مكانة» أو «معتبر». و«فتجرأ فدخل» يمكن ترجمتها: «دخل بجرأة» أو «تشجّع فدخل»؛ إذ يبرز اليوناني شجاعة يوسف في دخوله إلى بيلاطس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: فجاء
  rationale: يحفظ فعل المجيء السابق للفعل الرئيس، وتؤدي الفاء تتابع الحدث بسلاسة في العربية.
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: الذي من الرامة
  rationale: صياغة عربية واضحة تعكس ἀπό الدالة على المنشأ، مع استعمال الاسم العربي المألوف للمكان.
- source_word: εὐσχήμων
  choice: محترمًا
  rationale: ينقل معنى الوجاهة وحسن المكانة الاجتماعية بلغة عربية معاصرة، من غير حصر اللفظ في البروز السياسي أو الشرف الأخلاقي.
- source_word: βουλευτής
  choice: عضوًا في المجلس
  rationale: يحافظ على عموم اللفظ اليوناني ولا يصرح بأن المجلس هو السنهدريم، وإن كان ذلك مرجحًا سياقيًا.
- source_word: ὃς καὶ αὐτὸς
  choice: وكان هو أيضًا
  rationale: يحفظ توكيد اشتراك يوسف شخصيًا في انتظار الملكوت.
- source_word: ἦν προσδεχόμενος
  choice: كان ينتظر
  rationale: ينقل البناء الدال على حالة مستمرة من الترقب والانتظار.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: التعبير العربي الكتابي الواضح والمستقر للمصطلح الإنجيلي، مع الحفاظ على دلالته اللاهوتية دون تفسير زائد.
- source_word: τολμήσας
  choice: فتجرأ
  rationale: يعكس مباشرة معنى الإقدام والجرأة في صيغة فعل متتابع طبيعية، ويحفظ بروز شجاعة يوسف.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: دخل على بيلاطس
  rationale: تعبير عربي طبيعي يدل على الدخول إلى حضرته، ويحفظ دلالة الحركة نحو بيلاطس.
- source_word: ᾐτήσατο
  choice: طلب
  rationale: مقابل عربي مباشر وطبيعي لطلب الحصول على شيء.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: جسد يسوع
  rationale: ترجمة مباشرة تحافظ على النبرة الوقورة وعلى الإضافة اليونانية.
theological_decisions:
- issue: هوية المجلس في βουλευτής
  choice: عضو في المجلس
  alternative: عضو في السنهدريم
  rationale: اللفظ اليوناني يعني عضو مجلس، ولا يسمي السنهدريم صراحة؛ لذلك تُرك التحديد التاريخي غير المصرح به خارج المتن.
- issue: قوة τολμήσας
  choice: فتجرأ
  alternative: دخل بجرأة / تشجع ودخل
  rationale: «فتجرأ» تحفظ معنى الإقدام على فعل ينطوي على مخاطرة، من غير تحويله إلى وصف نفسي أطول مما يقوله النص.
- issue: العلاقة النحوية بين ἐλθὼν وτολμήσας وεἰσῆλθεν
  choice: فجاء... فتجرأ ودخل
  alternative: جاء... ودخل بجرأة
  rationale: الصياغة المختارة تُظهر فعلي المجيء والإقدام قبل الدخول وتحافظ على تتابع الأفعال، مع بقاء العربية طبيعية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «الرامة» بوصفه الاسم العربي الشائع لأريماثيا، و«ملكوت الله» للمصطلح الإنجيلي المألوف. تجنبت الصياغة تسمية المجلس بالسنهدريم لأن الأصل لا يذكر الاسم صراحة.
