  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: ar
  text: ويصلبونه ويقتسمون ثيابه، مُقترعين عليها ليعرفوا مَن يأخذ ماذا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مُلقين القرعة عليها، ليروا مَن يأخذ ماذا».'
    reason: 'بديل يقرّب الصورة الحرفية في اليونانية: إلقاء القرعة على الثياب لتعيين ما يأخذه كل شخص.'
lexical_decisions:
- source_word: σταυροῦσιν
  choice: يصلبونه
  rationale: حُفظ المضارع التاريخي الذي يستعمله مرقس لإضفاء الحيوية على السرد، وهو طبيعي ومفهوم في العربية ضمن تتابع الأحداث.
- source_word: διαμερίζονται
  choice: يقتسمون
  rationale: ينقل معنى تقسيم الثياب بينهم وتخصيص نصيب لكل واحد، وهو أفصح في هذا السياق من تعبير حرفي مثل «يقسّمون».
- source_word: ἱμάτια
  choice: ثيابه
  rationale: لفظ عربي طبيعي جامع لقطع اللباس، ويحافظ على الأسلوب الوقور من غير تكلّف.
- source_word: βάλλοντες κλῆρον
  choice: ملقين قرعةً
  rationale: تعبير مباشر يحافظ على صورة إلقاء القرعة في اليونانية وعلى الصلة النحوية بالفعل السابق.
- source_word: ἐπ’ αὐτὰ
  choice: عليها
  rationale: يعود الضمير بوضوح إلى الثياب، ويحافظ على معنى إجراء القرعة بشأنها.
- source_word: τίς τί ἄρῃ
  choice: ليعرفوا مَن يأخذ ماذا
  rationale: 'يحفظ التركيب التوزيعي الموجز: تعيين الشخص والقطعة التي يأخذها، من دون الجزم بتفصيل غير مذكور.'
theological_decisions:
- issue: المضارع التاريخي في رواية الآلام
  choice: 'الإبقاء على المضارع: «يصلبونه... ويقتسمون»'
  alternative: 'تحويله إلى الماضي: «صلبوه... واقتسموا»'
  rationale: المضارع التاريخي سمة بارزة في سرد مرقس ويمنح المشهد حيوية؛ إبقاؤه ينقل نسيج النص اليوناني من غير إضافة مضمون عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يقتسمون» لتجنب ثقل «يقسّمون ثيابه فيما بينهم»، وحُفظ المضارع التاريخي وتتابع الأفعال كما في السرد اليوناني.
