    rationale: لأن «سخّروا» قد تكون مفهومة، لكن الحاشية الثقافية تثبّت أن الفعل يدل على خدمة مفروضة لا على طلب عادي، بما يوافق قرار الترجمة الموثق.
  - severity: low
