    issue: «القيرواني» لا يطابق Κυρηναῖον.
    rationale: «القيرواني» نسبة إلى مدينة القيروان، بينما Κυρηναῖος/Κυρηναῖον نسبة إلى قورينة في شمال أفريقيا؛ فاللفظ يبدّل المرجع الجغرافي التاريخي للاسم.
  - severity: medium
