  source_fidelity: 'يلزم تصحيح النسبة الجغرافية: Κυρηναῖον تعني «القوريني» نسبةً إلى قورينة (Cyrene)، لا «القيرواني» نسبةً إلى القيروان. وتحفظ الصياغة المنقحة معنى التسخير القسري، ومرور سمعان عرضًا، ومجيئه من الريف/الحقل، وغرض حمل الصليب.'
  naturalness: «فسخّروا رجلًا مارًّا» و«القوريني» فصيحتان واضحتان في العربية المعيارية الحديثة. وحُذف «اسمه» لأنه إضافة تفسيرية غير لازمة، وأُبقيت الجملة الاعتراضية عن أبوّته لألكسندر وروفُس بصورة سلسة.
  terminology: «سخّروا» مناسب لـ ἀγγαρεύουσιν ويستلزم الإكراه. و«الصليب» يحافظ على عموم σταυρός. وتُستعمل «قورينة/القوريني» للموضع والنسبة الصحيحين، لا «القيرواني».
  issues:
