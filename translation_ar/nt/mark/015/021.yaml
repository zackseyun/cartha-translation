  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: ar
  text: وسخّروا رجلًا كان مارًّا، اسمه سمعان القيرواني، آتيًا من الريف[a]، وهو أبو ألكسندر وروفُس، ليحمل صليبه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «آتيًا من الحقل»؛ فاللفظ اليوناني يمكن أن يعني الحقل أو الريف.'
    reason: lexical_alternative
  - marker: b
    text: يرى بعضهم أن المقصود تحديدًا عارضة الصليب، لكن النص اليوناني يقول «الصليب» فحسب.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: سخّروا
  rationale: يفيد الفعل فرض خدمة قسرية أو تسخير شخص، لا مجرد الطلب منه؛ و«سخّروا» عربية واضحة تحفظ معنى الإكراه.
- source_word: παράγοντά τινα
  choice: رجلًا كان مارًّا
  rationale: ينقل معنى شخص غير معيّن كان يمر بالمكان، بصياغة عربية طبيعية دون المبالغة في دلالة τινα.
- source_word: Σίμωνα Κυρηναῖον
  choice: اسمه سمعان القيرواني
  rationale: نقل الاسم بصيغته العربية المألوفة، واستعمال النسبة «القيرواني» للدلالة على انتمائه إلى قورينة.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: آتيًا من الريف
  rationale: لفظة ἀγρός قد تعني الحقل أو الريف؛ و«الريف» تلائم السياق وتحفظ سعة الدلالة أكثر من تخصيصها بحقل بعينه.
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: وهو أبو ألكسندر وروفُس
  rationale: يحفظ التعريف الاعتراضي بسمعان من خلال ابنيه، من غير استنتاج سبب ذكرهما.
- source_word: ἵνα ἄρῃ
  choice: ليحمل
  rationale: تنقل لام التعليل غرض التسخير، و«يحمل» تلائم سياق حمل الصليب.
- source_word: σταυρὸν αὐτοῦ
  choice: صليبه
  rationale: يحفظ اللفظ العام «الصليب» والضمير العائد في السياق إلى يسوع، من غير تضييقه إلى العارضة الأفقية.
theological_decisions:
- issue: طبيعة ما فُرض على سمعان
  choice: التسخير القسري لحمل الصليب
  alternative: مجرد الطلب منه أو الاستعانة به طوعًا
  rationale: الفعل ἀγγαρεύω يدل على خدمة مفروضة، ولذلك ينبغي ألا تُلطَّف دلالة الإكراه.
- issue: تحديد الشيء الذي حمله سمعان
  choice: الصليب
  alternative: عارضة الصليب
  rationale: النص اليوناني يستعمل σταυρός من غير تخصيص، فتبقى الترجمة على عموم اللفظ ولا تُدخل إعادة بناء تاريخية أضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. اختير «سخّروا» لإظهار الإكراه بإيجاز، و«الريف» مع حاشية تحفظ احتمال «الحقل». وُضعت علامتا الحاشية في موضعيهما في المتن.
