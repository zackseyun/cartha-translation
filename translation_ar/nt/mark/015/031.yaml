  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: ar
  text: 'وكذلك كان رؤساء الكهنة، مع الكتبة، يستهزئون به ويقولون بعضهم لبعض[a]: «خلَّص آخرين، ولا يقدر أن يخلِّص نفسه!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يستهزئون به فيما بينهم مع الكتبة». قد تتعلّق العبارة اليونانية «بعضهم لبعض» بالاستهزاء لا بالقول، وقد تفيد كلامًا متبادلًا بين رؤساء الكهنة بمشاركة الكتبة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως καί
  choice: وكذلك
  rationale: تنقل معنى المماثلة والاستمرار مع مشهد الاستهزاء السابق بصياغة عربية طبيعية، من غير تكرار ثقيل لـ«أيضًا».
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: التعبير العربي المألوف عن القيادات الكهنوتية، ولا يوحي بوجود عدة أشخاص يشغلون منصب رئيس الكهنة المفرد في الوقت نفسه.
- source_word: ἐμπαίζοντες
  choice: يستهزئون به
  rationale: ينقل معنى السخرية المهينة. أُظهر الضمير «به» لأن مفعول الاستهزاء مفهوم من السياق، ولأن العربية تحتاج إليه لتجنب فهم العبارة على أنهم كانوا يستهزئون بعضهم ببعض.
- source_word: πρὸς ἀλλήλους
  choice: بعضهم لبعض
  rationale: يحفظ معنى التبادل في العبارة اليونانية، ويربطه بصورة طبيعية بقولهم المتبادل، مع التنبيه في الحاشية إلى احتمال تعلقه بفعل الاستهزاء.
- source_word: μετὰ τῶν γραμματέων
  choice: مع الكتبة
  rationale: يبين اشتراك الكتبة مع رؤساء الكهنة في الاستهزاء والقول، ويحافظ على تسمية هذه الفئة المعروفة.
- source_word: ἔλεγον
  choice: كان ... يقول
  rationale: صيغة «كان يقول» مع الفاعل الجمعي تنقل دلالة الماضي المستمر أو المتكرر في الفعل الناقص اليوناني.
- source_word: Ἄλλους ἔσωσεν
  choice: خلَّص آخرين
  rationale: يحفظ الإيجاز وتكرار جذر الخلاص، كما يبقي ما في التهكم من إيحاء بالإنقاذ والخلاص دون تضييق المعنى.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: ولا يقدر أن يخلِّص نفسه
  rationale: ينقل دلالة القدرة المنفية ويحافظ على تكرار فعل «خلَّص» في الشطرين وعلى مفارقة التهكم.
theological_decisions:
- issue: توحيد ترجمة σῴζω في شطري القول
  choice: خلَّص ... يخلِّص
  alternative: أنقذ ... ينقذ
  rationale: يحفظ التكرار اليوناني والمفارقة اللاهوتية في كلام المستهزئين، مع بقاء اللفظ العربي قادرًا على الدلالة على الإنقاذ والخلاص الأوسع.
- issue: المفعول الضمني لفعل الاستهزاء
  choice: يستهزئون به
  alternative: يستهزئون
  rationale: السياق يجعل يسوع هدف الاستهزاء، وإظهار الضمير في العربية يزيل إيحاءً غير مقصود بأن القادة كانوا يسخرون بعضهم من بعض، من غير إضافة تفسير عقائدي.
