  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «الكتبة» و«رؤساء الكهنة» بوصفهما المصطلحين الكتابيين المألوفين، وحُفظ الإيقاع المقتضب والساخر للقول المباشر.
