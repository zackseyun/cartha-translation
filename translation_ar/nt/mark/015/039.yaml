source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: ar
  text: 'ولمّا رأى قائد المئة[a]، الواقف قبالته، أنه أسلم الروح هكذا، قال: «حقًّا، كان هذا الإنسان ابنَ الله».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'قائد المئة: ضابط في الجيش الروماني كان يتولى عادة قيادة نحو مئة جندي.'
    reason: توضيح تاريخي للرتبة الرومانية.
  - marker: b
    text: 'ويمكن أن تُفهم العبارة اليونانية: «كان هذا الإنسان ابنًا لله». فهي تحتمل معنى وصفيًا أو نكِرًا، لكن سياق إنجيل مرقس يرجّح أنها تحمل قوة لقب «ابن الله».'
    reason: الحفاظ على الغموض النحوي واللاهوتي الحقيقي في العبارة اليونانية.
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: ولمّا رأى
  rationale: تؤدي «لمّا» معنى اسم الفاعل الماضي بوصفه ظرفًا زمنيًا، وتؤدي الواو وظيفة δέ الرابطة الخفيفة دون المبالغة في معنى الاستدراك.
- source_word: κεντυρίων
  choice: قائد المئة
  rationale: تعبير عربي واضح ودقيق للرتبة العسكرية الرومانية، وأشيع في الترجمات الكتابية العربية من اللفظ المعرّب.
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: الواقف قبالته
  rationale: يحفظ معنى الوقوف في الجهة المقابلة له بإيجاز طبيعي، من غير إضافة تفسير للمشهد.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: أنه أسلم الروح هكذا
  rationale: «أسلم الروح» تعبير عربي طبيعي عن الموت يحتفظ بصورة خروج النفس في ἐξέπνευσεν، و«هكذا» تنقل οὕτως وتحافظ على ارتباط قول القائد بكيفية موته.
- source_word: Ἀληθῶς
  choice: حقًّا
  rationale: تنقل قوة التأكيد الجازم والمهيب في الظرف اليوناني.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: هذا الإنسان
  rationale: ترجمة مباشرة تحافظ على لفظ ἄνθρωπος، وهي طبيعية في سياق التصريح الرسمي المهيب.
- source_word: υἱὸς θεοῦ
  choice: ابنَ الله
  rationale: يحفظ التركيب العربي الإضافي عدم وجود أداة تعريف مستقلة قبل «ابن»، مع إمكان فهم العبارة لقبًا معروفًا في سياق مرقس؛ ويُذكر الاحتمال النكِر في الحاشية.
- source_word: ἦν
  choice: كان
  rationale: ينقل صيغة الماضي في النص اليوناني كما هي، بدل تحويلها إلى الحاضر.
theological_decisions:
- issue: دلالة υἱὸς θεοῦ في قول قائد المئة
  choice: ابنَ الله
  alternative: ابنًا لله / أحد أبناء الآلهة
  rationale: السياق السردي في مرقس يرجّح أن العبارة تحمل قوة لقب «ابن الله»، لكن غياب أداة التعريف في اليونانية يسمح من الناحية النحوية بقراءة وصفية أو نكِرة. يحافظ المتن على القراءة الأرجح وتعرض الحاشية البديل دون حسم زائد.
- issue: زمن ἦν في الاعتراف
  choice: كان
  alternative: هو / يكون
  rationale: النص يستعمل الماضي صراحة، ولذلك لا يُستبدل به حاضر بدافع لاهوتي؛ ولا يلزم من الماضي أن المتكلم ينفي استمرار الصفة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «قائد المئة» بدل التعريب الاصطلاحي، وصيغت الجملة بإيجاز قريب من بنية الأصل. جميع علامتي الحاشية [a] و[b] واردتان في المتن.
