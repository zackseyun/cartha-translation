  text: ἐγίνωσκεν γὰρ ὅτι διὰ φθόνον παραδεδώκεισαν αὐτὸν οἱ ἀρχιερεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/010.yaml
  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: ar
  text: لأنه كان يعلم أن رؤساء الكهنة قد أسلموه حسدًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بدافع الحسد»، أو: «بسبب الغيرة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: كان يعلم
  rationale: الماضي الناقص يدل هنا على معرفة بيلاطس المستمرة أو الراسخة، وصيغة «كان يعلم» تنقل ذلك بوضوح وطبيعية.
- source_word: γὰρ
  choice: لأن
  rationale: تفيد الأداة تعليل ما سبق وبيان سببه، و«لأن» تؤدي هذه الصلة الخطابية بوضوح في العربية.
- source_word: ὅτι
  choice: أن
  rationale: تدخل على مضمون ما كان بيلاطس يعلمه، و«أن» هي المقابل العربي الطبيعي هنا.
- source_word: διὰ φθόνον
  choice: حسدًا
  rationale: تفيد διά مع النصب السبب أو الدافع، وφθόνος يدل على الحسد، ويعبّر المصدر المنصوب «حسدًا» عن الدافع بإيجاز وفصاحة.
- source_word: παραδεδώκεισαν
  choice: قد أسلموه
  rationale: صيغة الماضي التام تشير إلى فعل سبق علم بيلاطس؛ و«قد أسلموه» تلائم سياق تسليم يسوع إلى السلطة من غير إضافة معنى الخيانة على نحو غير لازم.
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير المفعول يعود إلى يسوع، واتصاله بالفعل هو الأسلوب العربي الطبيعي.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: تعبير عربي راسخ يشير إلى كبار السلطات الكهنوتية في سياق روايات الآلام، لا إلى رئيس كهنة واحد.
theological_decisions:
- issue: الدافع المنسوب إلى رؤساء الكهنة
  choice: يقرر النص أن الحسد كان دافعهم إلى تسليم يسوع.
  alternative: الغيرة
  rationale: ينقل النص تقدير بيلاطس لدافع رؤساء الكهنة دون توسع لاهوتي، وتحافظ الترجمة على هذا الإسناد من غير تشديد أو تفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «أسلموه» لملاءمته سياق التسليم القضائي، مع الحفاظ على سبق الفعل بواسطة «قد» بعد «كان يعلم».
