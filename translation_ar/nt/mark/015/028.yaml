  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: أداة الوصل، وإتمام قول الكتاب، وصيغة القول، ومعنى «حُسب/عُدّ مع» للفعل ἐλογίσθη، ودلالة ἀνόμων بوصفهم مخالفي الشريعة. وحذف الفاعل في «أُحصيَ» يوازي الإحالة السياقية الضمنية في الاقتباس اليوناني ولا يضيف تفسيرًا.'
  naturalness: الصياغة فصيحة واضحة ومناسبة للسجل الكتابي الحديث. «تمَّ ما يقوله الكتاب» و«أُحصيَ مع مخالفي الشريعة» سليمتان ومفهومتان، وإن كانت الصياغة ذات نبرة كتابية مقصودة تلائم الاقتباس.
  terminology: «مخالفي الشريعة» اختيار دقيق ومحايد لـἀνόμων، إذ يحفظ البعد القانوني/الكتابي من غير اختزال اللفظ إلى الجريمة المدنية. و«أُحصيَ» يؤدي معنى التصنيف أو العدّ مع جماعة، و«الكتاب» مناسب لـγραφή في هذا الموضع.
