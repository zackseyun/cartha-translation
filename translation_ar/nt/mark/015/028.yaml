  text: Καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα, Καὶ μετὰ ἀνόμων ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/028.yaml
  text: And[a] the scripture was fulfilled that says, "And he was numbered with the transgressors."
translation:
  language: ar
  text: 'وتمَّ ما يقوله الكتاب: «وأُحصيَ مع مخالفي الشريعة».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية غير موجودة في أقدم المخطوطات اليونانية، ومنها السينائية والفاتيكانية من القرن الرابع، ولا في الترجمات القبطية المبكرة؛ لكنها محفوظة في غالبية المخطوطات البيزنطية وفي التقليد اللاتيني. ويرجَّح أن نُسّاخًا متأخرين أضافوها لموافقة لوقا 22:37، حيث يَرِد اقتباس من إشعياء 53:12.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπληρώθη
  choice: تمَّ
  rationale: ينقل اكتمال قول الكتاب وتحققه بصياغة عربية طبيعية، مع بقاء الصلة بفكرة إتمام النبوءة.
- source_word: ἀνόμων
  choice: مخالفي الشريعة
  rationale: يحفظ المعنى الحرفي لمن لا يلتزمون بالشريعة، ويتجنب حصر اللفظ في الجرائم المدنية فقط.
- source_word: ἐλογίσθη
  choice: أُحصيَ
  rationale: يؤدي معنى عُدَّ وصُنِّف ضمن جماعة، ويلائم صياغة الاقتباس النبوي.
- source_word: γραφή
  choice: الكتاب
  rationale: تعبير عربي واضح ومألوف للدلالة على النص المقدس في هذا السياق.
theological_decisions:
- issue: هوية الفاعل الضمني في الاقتباس
  choice: الإبقاء على الفعل المبني للمجهول بلا إضافة ضمير ظاهر
  alternative: «وأُحصيَ هو مع مخالفي الشريعة»
  rationale: اليونانية لا تورد ضميرًا صريحًا؛ والسياق يبيّن المرجع، فالإبقاء على البنية يحفظ صيغة الاقتباس وغموضها النحوي المحدود.
- issue: العلاقة بين الحدث وقول الكتاب
  choice: «تمَّ ما يقوله الكتاب»
  alternative: «تحققت الآية التي تقول»
  rationale: يتجنب حصر γραφή في آية بالمعنى الاصطلاحي الحديث، ويحافظ على عرض الحدث بوصفه إتمامًا لقول مكتوب.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. وُضع رمز الحاشية بعد الآية كاملة كي لا يقطع الاقتباس، واستُعمل «مخالفي الشريعة» بدل «الأثمة» أو «المجرمين» للمحافظة على الدلالة القانونية-الكتابية للفظ اليوناني.
