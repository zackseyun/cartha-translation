source:
  edition: SBLGNT
  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: ar
  text: ولمّا جاءت الساعة السادسة[a]، حلَّ الظلام على الأرض كلِّها[b] حتى الساعة التاسعة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي نحو الظهر؛ واستمر الظلام حتى نحو الساعة الثالثة بعد الظهر.
    reason: cultural_note
  - marker: b
    text: يمكن أن تعني الكلمة اليونانية أيضًا «البلاد كلِّها» أو «العالم كلَّه».
    reason: alternative_reading
lexical_decisions:
- source_word: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης
  choice: ولمّا جاءت الساعة السادسة
  rationale: تنقل العبارة المطلقة في حالة المضاف إليه بوصفها جملة زمنية طبيعية، وتحافظ على طريقة عدّ الساعات في النص بدل تحويلها داخل المتن إلى التوقيت الحديث.
- source_word: σκότος
  choice: الظلام
  rationale: المقابل العربي المباشر والواضح للاسم اليوناني، وهو أنسب من ألفاظ قد تضيف إيحاءً عاطفيًا مثل «الكآبة».
- source_word: ἐγένετο
  choice: حلَّ
  rationale: تعبير عربي طبيعي عن وقوع الظلام، ويحفظ القوة الحدثية للفعل من غير ترجمة حرفية متكلّفة.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: على الأرض كلِّها
  rationale: لفظة γῆ تحتمل «الأرض» بمعنى الإقليم أو اليابسة، كما تحتمل «الأرض» بمعنى العالم؛ والصياغة العربية تبقي هذا الاتساع الدلالي، مع توضيحه في الحاشية.
- source_word: ἕως ὥρας ἐνάτης
  choice: حتى الساعة التاسعة
  rationale: تحافظ على تعبير النص وطريقة عدّ الساعات فيه، بالتوازي مع «الساعة السادسة»، بينما توضّح الحاشية المقابل التقريبي بالتوقيت الحديث.
theological_decisions:
- issue: نطاق γῆ في ظلام الصلب
  choice: الأرض كلِّها
  alternative: البلاد كلِّها / العالم كلِّه
  rationale: اللفظة اليونانية واسعة الدلالة، وقد تشير إلى البلاد أو إلى الأرض كلها. لا يحسم السياق وحده النطاق الجغرافي، لذلك اختيرت صياغة عربية تحتفظ بهذا الاحتمال وأضيفت حاشية تبيّن الغموض بدل فرض تفسير كوني أو محلي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على نظام الساعات القديم في المتن وشرح المقابل الحديث في الحاشية. وُضعت علامتا الحاشيتين في موضعيهما من النص.
