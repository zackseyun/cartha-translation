  text: 'أما هم فصرخوا من جديد: «اصلبه!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: هم
  rationale: أداة التعريف في صيغة الجمع مستعملة استعمالًا اسميًا، وتحيل إلى الجماعة المذكورة في السياق؛ والضمير «هم» يؤدي هذه الإحالة طبيعيًا من غير إضافة تفسيرية مثل «الجموع».
- source_word: δὲ
  choice: أما ... فـ
  rationale: تفيد δέ انتقالًا ذا مسحة مقابلة مع كلام بيلاطس السابق؛ وصيغة «أما هم فـ» تنقل هذا التقابل الخفيف بأسلوب عربي فصيح طبيعي.
- source_word: πάλιν
  choice: من جديد
  rationale: تنقل معنى التكرار بوضوح، وهي هنا طبيعية مع فعل الصراخ. ويصح أيضًا «مرة أخرى».
- source_word: ἔκραξαν
  choice: صرخوا
  rationale: الفعل يدل على رفع الصوت والصياح؛ و«صرخوا» يحفظ شدة النداء وإيجازه.
- source_word: Σταύρωσον
  choice: اصلبه
  rationale: فعل أمر مباشر للمفرد موجَّه إلى بيلاطس. تحافظ الصيغة العربية المباشرة على قوة الأصل، من غير تحويلها إلى العبارة التفسيرية «اجعله يُصلب».
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير مفعول به يعود إلى يسوع، واتصاله بفعل الأمر هو التعبير العربي الأبسط والأدق.
