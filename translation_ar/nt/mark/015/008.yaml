  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: ar
  text: وصعد الحشد، وبدأ يطلب منه أن يفعل لهم كما اعتاد أن يفعل.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويمكن: «وصعد الحشد، وبدأ يطلب منه ما اعتاد أن يفعله لهم».'
    reason: بديل أسلوبي يعبّر عن καθώς بصياغة عربية أكثر سلاسة، بينما يبقي المتن على معنى «كما» الأقرب إلى بنية اليونانية.
lexical_decisions:
- source_word: ἀναβὰς
  choice: صعد
  rationale: يحافظ على المعنى الحركي الصريح للفعل ἀναβαίνω من غير استبداله بتفسير سياقي مثل «تقدَّم» أو «أقبل».
- source_word: ὁ ὄχλος
  choice: الحشد
  rationale: تعبير عربي معاصر وطبيعي يدل على جماعة الناس المحتشدة في هذا المشهد.
- source_word: ἤρξατο αἰτεῖσθαι
  choice: بدأ يطلب منه
  rationale: ينقل معنى البدء في الطلب. أُظهر متعلَّق الطلب «منه» اعتمادًا على السياق، من غير تحديد المطلوب نفسه قبل أن توضحه الجملة التالية.
- source_word: καθὼς
  choice: كما
  rationale: يحافظ على دلالة المطابقة أو العادة في καθώς، ولا يحوّله إلى اسم موصول مثل «ما» إلا في الحاشية بوصفه صياغة عربية بديلة.
- source_word: ἐποίει
  choice: اعتاد أن يفعل
  rationale: ينقل قوة الماضي الناقص الدالة هنا على الفعل المعتاد المتكرر، لا على واقعة ماضية منفردة.
- source_word: αὐτοῖς
  choice: لهم
  rationale: 'اللام تعبّر طبيعيًا عن معنى النفع في ضمير المجرور بالداتيف: ما كان يفعله لصالحهم.'
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. أُبقي «صعد» رغم إمكان فهمه سياقيًا بمعنى التقدّم أو الاقتراب، حفاظًا على صورة الأصل. عومل «الحشد» نحويًا بوصفه اسم جمع مفردًا.
