id: MRK.15.35
reference: Mark 15:35
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: ar
  text: 'وكان بعض الواقفين هناك، لما سمعوا ذلك، يقولون: «ها هو ينادي إيليا[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يطلب إيليا».'
    reason: بديل معجمي يبرز احتمال أن المقصود هو النداء طلبًا لمجيء إيليا، مع أن اليونانية لا تستلزم هذا التفسير الصريح.
lexical_decisions:
- source_word: καί
  choice: وكان
  rationale: تربط الجملة بما قبلها وتحافظ على انسياب السرد، من غير إضافة دلالة زمنية مستقلة.
- source_word: τινες τῶν παρεστηκότων
  choice: بعض الواقفين هناك
  rationale: تنقل معنى جماعة غير محددة من الحاضرين، وتحافظ على الصورة المكانية الملموسة في اسم الفاعل اليوناني.
- source_word: ἀκούσαντες
  choice: لما سمعوا ذلك
  rationale: تعبّر طبيعيًا عن سبق السماع للقول؛ و«ذلك» مضافة إيضاحًا وإحالتها إلى صرخة يسوع السابقة ظاهرة من السياق.
- source_word: ἔλεγον
  choice: يقولون
  rationale: ورودها مع «كان» يحافظ على الجانب الاستمراري أو التكراري المحتمل لصيغة الماضي الناقص، من غير الجزم بالتكرار.
- source_word: Ἴδε
  choice: ها هو
  rationale: أسلوب تنبيه عربي طبيعي ومعاصر يؤدي وظيفة أداة لفت الانتباه، من غير استعمال صيغة قد تبدو متكلفة مثل «انظر».
- source_word: Ἠλίαν
  choice: إيليا
  rationale: الصيغة العربية المألوفة لاسم النبي.
- source_word: φωνεῖ
  choice: ينادي
  rationale: فعل عربي طبيعي يحتمل مناداة الشخص أو طلب حضوره، ويحافظ قدر الإمكان على إيجاز اليونانية وعدم تفسير مقصد المتكلمين تفسيرًا زائدًا.
theological_decisions:
- issue: هل يُصرَّح بأن الواقفين أساؤوا فهم صرخة يسوع وظنوها استغاثة بإيليا؟
  choice: 'الإبقاء على قولهم المباشر: «ينادي إيليا» من غير شرح لسوء الفهم في المتن'
  alternative: «ظنوا أنه يستدعي إيليا» أو «إنه يطلب إيليا»
  rationale: النص اليوناني يورد كلام الواقفين ولا يقدم في هذه الآية تفسيرًا صريحًا من الراوي؛ لذلك يُترك سوء الفهم ظاهرًا من السياق ولا يُشرح داخل المتن.
translation_notes:
  register: عربية فصحى واضحة ومعاصرة، بنبرة سردية كريمة. استُعمل «ها هو» للتنبيه الطبيعي، وحُفظت دلالة الماضي الناقص في «كانوا ... يقولون» من غير مبالغة في معنى التكرار.
