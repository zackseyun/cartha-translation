source:
  edition: SBLGNT
  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: ar
  text: ومتى زُرعت، تنبت وتصير أكبر من جميع نباتات البستان، وتُخرج أغصانًا كبيرة، حتى تستطيع طيور السماء[a] أن تُعشِّش[b] تحت ظلها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «طيور الجو»، وتقليديًّا «طيور الهواء».
    reason: lexical_alternative
  - marker: b
    text: أو «تسكن» أو «تستقر». وقد يتردد في العبارة صدى صور العهد القديم عن طيور تجد مأوى في شجرة عظيمة، مثل حزقيال 17:23 ودانيال 4:12.
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: زُرعت
  rationale: 'فعل ماضٍ مبني للمجهول في صيغة الاحتمال بعد ὅταν، ويفيد زمنًا غير محدد: «متى زُرعت». ويحافظ «زُرعت» على صورة البذر في المثل.'
- source_word: ἀναβαίνει
  choice: تنبت
  rationale: يدل الفعل في السياق الزراعي على ظهور النبتة وارتفاعها من الأرض؛ و«تنبت» تعبير عربي طبيعي وواضح.
- source_word: γίνεται
  choice: تصير
  rationale: يحمل معنى الانتقال إلى حالة ناتجة، لا مجرد وصف ثابت، ولذلك تنقل «تصير» معنى التطور في نمو النبتة.
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: أكبر من جميع نباتات البستان
  rationale: تحافظ العبارة على صيغة المقارنة، وتفهم λάχανα بوصفها نباتات مزروعة في البستان، لا «خضروات» بالمعنى الحديث الأضيق.
- source_word: ποιεῖ κλάδους μεγάλους
  choice: تُخرج أغصانًا كبيرة
  rationale: هذا تعبير عربي مألوف لنمو الأغصان، وينقل معنى ποιεῖ في هذا السياق من غير حرفية متكلفة.
- source_word: ὥστε δύνασθαι
  choice: حتى تستطيع
  rationale: تنقل نتيجة نمو الأغصان مع الاحتفاظ بدلالة القدرة الواردة في δύνασθαι.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: تحت ظلها
  rationale: «الظل» هو المقابل الطبيعي لـ σκιά في سياق الاحتماء، والضمير المؤنث يعود إلى النبتة المفهومة في العربية.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: طيور السماء
  rationale: ترجمة قريبة وواضحة تحفظ الصورة الكتابية، مع إمكان فهم οὐρανός هنا بمعنى الجو أو الفضاء العلوي.
- source_word: κατασκηνοῦν
  choice: أن تُعشِّش
  rationale: يمكن أن يعني الفعل السكن أو الاستقرار؛ ومع الطيور والظل، توصل «تُعشِّش» الصورة بوضوح، مع إبقاء البدائل الأعم في الحاشية.
theological_decisions:
- issue: صورة الطيور التي تجد مأوى في أغصان نبات عظيم
  choice: الإبقاء على الصورة كما هي في المتن، من غير تفسير رمزي صريح
  alternative: استعمال «تسكن» بدل «تُعشِّش» لإبراز الصدى المحتمل لصور الشجرة والملكوت في العهد القديم
  rationale: قد تردد العبارة صدى صور كتابية مثل حزقيال 17:23 ودانيال 4:12، لكن النص اليوناني لا يفسر الرمز صراحة. لذلك تُحفظ الصورة ويُذكر الصدى المحتمل في الحاشية دون فرض تأويل لاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية كريمة. استُعمل التأنيث لأن المرجع المفهوم هو الحبة أو النبتة، ووُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرهما الحواشي، لا عند مواضع غير مرتبطة بهما.
