  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: ar
  text: وليس لهم جذر في أنفسهم، بل لا يدومون إلا إلى حين. ثم متى حدث ضيق أو اضطهاد بسبب الكلمة، يتعثرون في الحال[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يسقطون» أو «يرتدّون». وقد يفيد الفعل اليوناني أيضًا أن يُعْثَروا أو أن يجدوا في الأمر ما يصدّهم.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτοῖς
  choice: أصل في أنفسهم
  rationale: يحفظ صورة الجذر الزراعية والضمير الانعكاسي من غير إضافة معنى «عميق» أو «راسخ» غير المصرح به في اليونانية.
- source_word: πρόσκαιροί
  choice: يدومون إلى حين فقط
  rationale: صياغة عربية طبيعية تفيد أنهم باقون مدة محدودة، وتتجنب الوصف غير المألوف «هم مؤقتون».
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: متى حدث ضيق أو اضطهاد
  rationale: ينقل التركيب الزمني، ويحفظ الفرق بين الضيق العام والاضطهاد الموجَّه.
- source_word: διὰ τὸν λόγον
  choice: بسبب الكلمة
  rationale: يحفظ تكرار لفظ «الكلمة» في سياق المثل، من غير استبداله بتفسير مثل «الرسالة».
- source_word: εὐθὺς
  choice: في الحال
  rationale: ينقل معنى الفورية ويحافظ على الإيقاع العاجل المميز لإنجيل مرقس.
- source_word: σκανδαλίζονται
  choice: يتعثرون
  rationale: يحفظ الصورة المجازية واتساع الفعل اليوناني، الذي قد يدل في هذا السياق على السقوط أو الارتداد تحت الضغط، من غير حسم دلالته لاهوتيًا.
theological_decisions:
- issue: دلالة σκανδαλίζονται في سياق الثبات أو الارتداد
  choice: يتعثرون
  alternative: يرتدون أو يسقطون
  rationale: «يتعثرون» أقرب إلى صورة الفعل اليوناني ويحفظ الغموض بين التعثر والسقوط عن القبول السابق للكلمة. وتوضح الحاشية إمكان المعنى الأقوى من غير تقرير حكم يتجاوز النص بشأن الخلاص النهائي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة الأسلوب. استُخدمت «متى حدث» لصياغة الشرط الزمني، و«يدومون إلى حين فقط» بدل العبارة الحرفية الثقيلة، مع إبقاء صورة الأصل والتعثر واتساعهما الدلالي.
