source:
  edition: SBLGNT
  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: ar
  text: 'وأولئك هم الذين زُرعوا في التربة الجيدة: يسمعون الكلمة ويتقبّلونها ويثمرون، بعضهم ثلاثين ضعفًا، وبعضهم ستين ضعفًا، وبعضهم مئة ضعفًا.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «يتقبّلونها»: «يقبلونها» أو «يرحّبون بها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: هؤلاء
  rationale: اسم الإشارة يعود إلى الفئة الأخيرة المذكورة في شرح المثل، و«هؤلاء» طبيعي في العربية مع الإشارة إلى أشخاص حاضر وصفهم في السياق.
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: الذين زُرعوا في التربة الجيدة
  rationale: يحفظ المبني للمجهول والصورة الزراعية. استُعملت «في» وفق التعبير العربي الطبيعي عن زرع البذار في التربة، من غير تغيير مقصود للصورة.
- source_word: γῆν τὴν καλὴν
  choice: التربة الجيدة
  rationale: «التربة» أوضح في سياق الزراعة من «الأرض»، و«الجيدة» تحفظ التقابل التقييمي بين أنواع التربة.
- source_word: οἵτινες
  choice: يسمعون
  rationale: وُصل الوصف مباشرة بالاسم الموصول العربي، وهو أسلس من استئناف جملة بضمير منفصل ويحفظ القوة الوصفية للضمير اليوناني.
- source_word: ἀκούουσιν τὸν λόγον
  choice: يسمعون الكلمة
  rationale: تحفظ «الكلمة» المصطلح المتكرر في شرح المثل ودلالته على الكلام أو الرسالة المعلنة دون تضييقها تفسيرياً.
- source_word: παραδέχονται
  choice: يتقبّلونها
  rationale: يفيد الفعل استقبال الكلمة بقبول وترحاب، و«يتقبّلونها» تعبير عربي طبيعي يجمع معنى التلقي الإيجابي والقبول.
- source_word: καρποφοροῦσιν
  choice: يثمرون
  rationale: يحفظ الاستعارة الزراعية بصياغة عربية موجزة ومألوفة من غير تفسير زائد لطبيعة الثمر.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: بعضهم ثلاثين ضعفًا، وبعضهم ستين، وبعضهم مئة
  rationale: تبيّن الصياغة تفاوت مقدار المحصول بين أفراد الفئة، وهو المقصود من الأعداد في السياق. ذُكر «ضعفًا» مع العدد الأول وحُذف مع التاليين لدلالة السياق وتجنب الثقل، مع الحفاظ على التدرج الثلاثي.
theological_decisions:
- issue: طبيعة الاستجابة للكلمة في التربة الجيدة
  choice: يصف النص سماعًا إيجابيًا للكلمة وتقبّلًا لها ينتج عنه الإثمار، من غير إضافة حكم عقائدي عن المثابرة النهائية أو الارتداد.
  alternative: اعتبار التربة الجيدة دليلاً صريحًا إما على المثابرة النهائية حتمًا أو على استجابة أولية فقط.
  rationale: الأفعال اليونانية تصرّح بالسماع والتقبّل والإثمار، لكنها لا تفصّل في هذه الآية وحدها نظامًا عقائديًا يتجاوز ذلك.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. روعي تسلسل الصورة: الزرع في التربة، ثم سماع الكلمة وتقبّلها، ثم الإثمار. استُعمل «هؤلاء» بدل «أولئك» لسلامة الإحالة العربية في سياق الشرح، مع بقاء المقابلة السياقية واضحة.'
