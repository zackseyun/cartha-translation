  text: Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: ar
  text: وكان يكلّمهم بالكلمة[a] بأمثال كثيرة كهذه، على قدر ما كانوا يستطيعون أن يسمعوا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الرسالة» أو «التعليم» بدلًا من «الكلمة».
    reason: lexical_alternative
  - marker: b
    text: أو «بقدر ما كانوا يستطيعون أن يسمعوا» أو «إلى الحد الذي كانوا يستطيعون فيه أن يسمعوا».
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις
  choice: من هذا النوع
  rationale: تعبير عربي طبيعي يحفظ الإشارة إلى أمثال مماثلة لما سبق، من غير حصرها في الأمثال المذكورة وحدها.
- source_word: παραβολαῖς
  choice: أمثال
  rationale: المقابل العربي الراسخ والدقيق لأسلوب يسوع التعليمي القائم على التشبيه والقصة.
- source_word: πολλαῖς
  choice: كثيرة
  rationale: ينقل الدلالة الكمية مباشرة، ويتبع الموصوف في الصياغة العربية الطبيعية.
- source_word: ἐλάλει
  choice: كان يكلّمهم
  rationale: تركيب «كان» مع المضارع يحفظ الجانب الاستمراري أو الاعتيادي لصيغة الماضي الناقص اليونانية، ووجود الضمير المتصل ينقل αὐτοῖς طبيعيًا.
- source_word: αὐτοῖς
  choice: هم في «يكلّمهم»
  rationale: الضمير المتصل هو الأسلوب العربي الطبيعي للتعبير عن المتلقين مع فعل الكلام.
- source_word: τὸν λόγον
  choice: بالكلمة
  rationale: يحفظ العبارة اليونانية وصداها في مرقس، مع بقاء احتمال أن يكون المراد الرسالة أو التعليم موضحًا في الحاشية.
- source_word: καθὼς
  choice: على قدر ما
  rationale: ينقل هنا معنى القياس أو التناسب بوضوح أكبر من «كما»، من غير تحديد طبيعة القدرة.
- source_word: ἠδύναντο
  choice: كانوا يستطيعون
  rationale: يحفظ معنى القدرة والجانب الماضي المستمر في الفعل اليوناني.
- source_word: ἀκούειν
  choice: أن يسمعوا
  rationale: يبقي المعنى المعجمي المباشر للفعل ولا يستبدله تفسيريًا بـ«يفهموا»، محافظًا بذلك على احتمال اشتمال السماع على التلقي أو الفهم دون الجزم به.
theological_decisions:
- issue: دلالة τὸν λόγον في خدمة يسوع التعليمية
  choice: الكلمة
  alternative: الرسالة؛ التعليم
  rationale: يحفظ اللفظ اليوناني والتعبير الكتابي من غير أن يضيّق معناه إلى دعوى عقائدية محددة، مع بيان البدائل السياقية في الحاشية.
- issue: ما يفيده ἀκούειν
  choice: أن يسمعوا
  alternative: أن يفهموا؛ أن يتقبلوا
  rationale: النص يصرح بالقدرة على السماع، وقد يتضمن السياق الفهم أو التلقي؛ لذلك لا تحسم الترجمة هذا التوتر باستبدال المعنى المباشر بتفسير أقوى.
- issue: العلاقة التي تفيدها καθὼς
  choice: على قدر ما كانوا يستطيعون
  alternative: كما كانوا يستطيعون؛ بقدر استطاعتهم
  rationale: تفيد العبارة مقدار الكلام الملائم لقدرتهم، لكنها لا تحدد هل المقصود القدرة على الفهم أم الاستماع أم التلقي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «كان يكلّمهم» لإظهار الاستمرار، و«على قدر ما» لإبراز معنى التناسب. وُضعت علامتا الحاشيتين مباشرة بعد العبارتين اللتين تشرحانهما.
