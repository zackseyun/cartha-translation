source:
  edition: SBLGNT
  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: ar
  text: وينام ويقوم ليلًا ونهارًا، والبذر ينبت ويطول[a]، وهو نفسه لا يدري كيف[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ينبت وينمو» أو «ينبت ويزداد ارتفاعًا». يدل الفعل الثاني بوجه خاص على الامتداد أو الازدياد في الطول.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «كما لا يدري هو نفسه»؛ والمعنى في السياق: «وهو نفسه لا يدري كيف».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ
  choice: ينام
  rationale: المضارع التابع في سياق المثل يصوّر فعلًا متكررًا أو مستمرًا، والمضارع العربي ينقل ذلك بوضوح.
- source_word: ἐγείρηται
  choice: يقوم
  rationale: الصيغة هنا لازمة بمعنى يستيقظ أو ينهض؛ و«يقوم» طبيعية وتحافظ على إيقاع العبارة من غير إيحاء خاص بالقيامة.
- source_word: νύκτα καὶ ἡμέραν
  choice: ليلًا ونهارًا
  rationale: تعبير زمني يدل على تعاقب الزمن واستمراره، وهذه الصياغة عربية مألوفة وتحفظ الشمول في الأصل.
- source_word: ὁ σπόρος
  choice: البذر
  rationale: يشير بأداة التعريف إلى ما زُرع في سياق المثل؛ و«البذر» يعبّر عن البذور المزروعة بوصفها مجموعًا ويناسب الفعلين المفردين.
- source_word: βλαστᾷ
  choice: ينبت
  rationale: ينقل بدء ظهور النبات ونموه بلفظ عربي واضح وشائع.
- source_word: μηκύνηται
  choice: يطول
  rationale: يحفظ الدلالة الخاصة على الامتداد أو الازدياد طولًا، بدل تسطيحها إلى معنى النمو العام وحده.
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: وهو نفسه لا يدري كيف
  rationale: تجعل «كيف» المقصود السياقي واضحًا، وتحفظ «نفسه» توكيد αὐτός، بينما تنقل الواو المصاحبة التوتر القائم بين حدوث النمو وجهل الزارع بكيفيته.
theological_decisions:
- issue: الفاعل في نمو البذر داخل المثل
  choice: تُركت كيفية النمو مجهولة من منظور الزارع، من غير تسمية فاعل إلهي في هذه الآية.
  alternative: التصريح بأن الله هو الذي ينمّي البذر، أو عرض النمو بوصفه عملية طبيعية محضة.
  rationale: النص يبرز أن البذر ينمو بينما لا يعرف الزارع كيف؛ لذلك تحافظ الترجمة على هذا التوتر ولا تضيف تفسيرًا لاهوتيًا أو طبيعيًا غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على تتابع الأفعال وإيقاع المثل، وعلى الدقة المعجمية في «يطول»، مع إبقاء كيفية النمو غير مفسرة.
