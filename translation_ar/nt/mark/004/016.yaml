lexical_decisions:
- source_word: ὁμοίως
  choice: أيضًا
  rationale: تربط هذه الفئة بما سبق في شرح المثل ربطًا طبيعيًا موجزًا في العربية، وتحمل معنى المماثلة في السياق.
- source_word: ἐπὶ τὰ πετρώδη
  choice: في الأرض الصخرية
  rationale: تعبير عربي واضح يحافظ على الصورة الزراعية ويشير إلى الأرض التي يغلب عليها الصخر.
- source_word: σπειρόμενοι
  choice: الذين زُرعوا
  rationale: يحافظ المبني للمجهول على استعارة البذر وعلى التداخل المقصود بين البذار والأشخاص الذين تمثلهم.
- source_word: τὸν λόγον
  choice: الكلمة
  rationale: يحافظ على المصطلح المتكرر في سياق المثل وعلى صداه الكتابي، من غير أن يضيّق معناه إلى تفسير محدد.
- source_word: εὐθύς
  choice: فما إن... حتى
  rationale: تركيب عربي طبيعي يفيد الفورية بوضوح ويحافظ على سرعة الاستجابة التي يؤكدها مرقس.
- source_word: μετὰ χαρᾶς
  choice: بفرح
  rationale: ينقل كيفية قبول الكلمة مباشرة ومن دون إضافة تفسير.
- source_word: λαμβάνουσιν αὐτόν
  choice: يقبلوها
  rationale: «يقبل» طبيعي مع الكلمة المسموعة، ويحافظ على حياد العبارة فلا يفترض ثبات الاستجابة أو دوام الإيمان.
theological_decisions:
- issue: مرجع عبارة «الذين زُرعوا» في شرح المثل
  choice: الإبقاء على الصياغة التصويرية «الذين زُرعوا في الأرض الصخرية».
  alternative: الذين قلوبهم كالأرض الصخرية
  rationale: النص اليوناني يبقي استعارة البذر قائمة وهو يحدد الأشخاص الذين ترمز إليهم البذار؛ أما البديل فيضيف شرحًا غير مصرح به في الآية.
