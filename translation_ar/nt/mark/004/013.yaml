  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: ar
  text: 'وقال لهم: «أما تفهمون هذا المثل؟ فكيف ستفهمون الأمثال كلها؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «أما تعرفون هذا المثل؟ وكيف ستعرفون الأمثال كلها؟» يمكن أن يدل الفعلان اليونانيان على المعرفة، لكنهما يفيدان هنا فهم المعنى.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: وقال
  rationale: استُخدم الماضي العربي الطبيعي في السرد؛ فالمضارع التاريخي اليوناني من سمات أسلوب مرقس، لكن نقله حرفيًا هنا إلى «يقول» أقل سلاسة في العربية ولا يغيّر زمن الحدث المقصود.
- source_word: οἴδατε
  choice: تفهمون
  rationale: مع أن الفعل قد يعني «تعرفون»، فالسياق يتناول إدراك معنى المثل، ولذلك يعبّر «تفهمون» بوضوح عن المقصود.
- source_word: παραβολὴν
  choice: المثل
  rationale: «المثل» هو المقابل العربي المألوف والدقيق لهذا النوع من تعليم يسوع.
- source_word: ταύτην
  choice: هذا
  rationale: اسم الإشارة يعود مباشرة إلى المثل السابق.
- source_word: καὶ πῶς
  choice: فكيف
  rationale: الفاء تُظهر في العربية النتيجة المنطقية التي تربط السؤال الثاني بالأول، مع الحفاظ على قوة الاستفهام.
- source_word: πάσας τὰς παραβολὰς
  choice: الأمثال كلها
  rationale: صياغة عربية طبيعية تحفظ شمول العبارة اليونانية.
- source_word: γνώσεσθε
  choice: ستفهمون
  rationale: المقصود هو التوصل إلى إدراك معاني الأمثال، لا مجرد معرفتها؛ كما تحافظ الصياغة على التوازي البلاغي مع الفعل الأول.
theological_decisions:
- issue: العلاقة الدلالية بين οἴδατε وγνώσεσθε
  choice: تُرجم الفعلان بـ«تفهمون» و«ستفهمون».
  alternative: يمكن ترجمتهما بـ«تعرفون» و«ستعرفون»، أو ترجمة الأول بـ«تعرفون» والثاني بـ«ستفهمون».
  rationale: موضوع القول هو استيعاب معنى الأمثال. توحيدهما ضمن مجال «الفهم» يحفظ قوة التوبيخ والتوازي، مع بيان البديل الحرفي في الحاشية دون حسم الفارق المعجمي حسمًا زائدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «أما تفهمون» لاستفهام إنكاري طبيعي، و«فكيف» لإبراز العلاقة الاستنتاجية. وُضع مؤشر الحاشية بعد الاقتباس لأنه يخص العبارة كلها.
