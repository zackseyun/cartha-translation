  text: If anyone has ears to hear[a], let him hear.
translation:
  language: ar
  text: إن كان لأحد أذنان للسمع، فليسمع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: جاء فعل الأمر في اليونانية بصيغة المفرد، والخطاب عام لكل من له أذنان للسمع.
    reason: توضيح الصيغة النحوية العامة في الأصل
lexical_decisions:
- source_word: εἴ τις
  choice: إن كان لأحد
  rationale: يحافظ على صيغة الشرط وعلى دلالة الضمير النكرة العامة، بدل تحويل العبارة إلى جملة موصولة مثل «مَن له».
- source_word: ἔχει
  choice: كان لأحد
  rationale: تُعبَّر الملكية في العربية الفصيحة طبيعيًا باللام؛ وجاء فعل «كان» مع أداة الشرط لتكوين عبارة عربية سليمة وواضحة.
- source_word: ὦτα
  choice: أذنان
  rationale: مع أن اليونانية تستعمل صيغة الجمع، فالعربية تستعمل المثنى طبيعيًا لعضوين مزدوجين من أعضاء الجسد.
- source_word: ἀκούειν
  choice: للسمع
  rationale: ينقل معنى الغاية أو القدرة في المصدر اليوناني، ويحافظ على الصلة اللفظية بالفعل التالي.
- source_word: ἀκουέτω
  choice: فليسمع
  rationale: ينقل بدقة أمر الغائب المفرد، ويحافظ على تكرار جذر السمع وعلى معنى الإصغاء المتقبّل دون تفسير زائد.
theological_decisions:
- issue: الصيغة العامة للمفرد في فعل الأمر
  choice: فليسمع
  alternative: فليسمعوا
  rationale: النص اليوناني ينتقل من ضمير نكرة مفرد إلى أمر مفرد. تحفظ العربية صيغة المفرد المذكر بوصفها صيغة عامة، من غير تحويلها إلى الجمع أو حصرها في الذكور.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة موجزة ومهيبة. استُعمل المثنى «أذنان» وفق الأسلوب العربي الطبيعي، مع الإبقاء على بنية الشرط وتكرار معنى السمع.
