base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: ar
  text: 'الأرض تُثمر من تلقاء نفسها: أولًا النبت، ثم السنبلة، ثم الحبّ الممتلئ في السنبلة.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: من تلقاء نفسها
  rationale: تعبير عربي طبيعي يفيد أن الأرض تُنتج بلا فاعلية بشرية ظاهرة، من غير إيحاء آلي حديث.
- source_word: ἡ γῆ
  choice: الأرض
  rationale: في السياق الزراعي تُفهم على أنها التربة المزروعة، و«الأرض» لفظ عربي واضح ومألوف في هذا التصوير.
- source_word: καρποφορεῖ
  choice: تُثمر
  rationale: ينقل بإيجاز معنى إنتاج الثمر أو المحصول ويحفظ الصورة الزراعية.
- source_word: πρῶτον χόρτον
  choice: أولًا النبت
  rationale: χόρτος هنا هو النمو الأخضر الأول لنبات الحبوب؛ و«النبت» أوضح من «العشب» ولا يوحي بساق مكتملة.
- source_word: εἶτα στάχυν
  choice: ثم السنبلة
  rationale: «السنبلة» المقابل العربي الطبيعي لرأس الحبوب، وتناسب مراحل نمو الزرع.
- source_word: πλήρης σῖτον
  choice: الحبّ الممتلئ
  rationale: يحفظ وصف πλήρης بمعنى الممتلئ أو المكتمل دون إضافة معنى النضج صراحة، ويترجم σῖτος ترجمة عامة لا تقصره على القمح.
- source_word: ἐν τῷ στάχυϊ
  choice: في السنبلة
  rationale: يحافظ على تحديد موضع الحب وعلى اتساق ترجمة στάχυς.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات إيقاع متدرج يوافق تسلسل مراحل نمو الزرع. لم تُضف حاشية لأن «النبت» و«السنبلة» واضحتان، ولأن البدائل المعجمية لا تغيّر المعنى اللاهوتي أو الدلالي تغييرًا مهمًا.
