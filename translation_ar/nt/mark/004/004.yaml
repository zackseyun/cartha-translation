  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: ar
  text: وفيما هو يزرع، سقط بعض البذار بمحاذاة الطريق[a]، فجاءت الطيور والتهمته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى جانب الطريق». تفيد العبارة اليونانية موضعًا بمحاذاة الطريق أو على امتداده.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: وفيما هو يزرع
  rationale: ينقل المعنى الزمني للتركيب السردي اليوناني بصياغة عربية طبيعية، من غير إثقال العبارة بترجمة حرفية مثل «وحدث في أثناء زرعه».
- source_word: ὃ μὲν
  choice: بعض البذار
  rationale: الضمير الموصول المحايد مع μέν يدل توزيعيًا على جزء مما يُبذر؛ وإظهار «البذار» يجعل المرجع واضحًا وطبيعيًا في العربية.
- source_word: ἔπεσεν
  choice: سقط
  rationale: مقابل مباشر وطبيعي للفعل πίπτω في هذا السياق.
- source_word: παρὰ τὴν ὁδόν
  choice: بمحاذاة الطريق
  rationale: يحفظ الدلالة المكانية لعبارة παρά مع المفعول به، أي على امتداد الطريق أو إلى جانبه، ويلائم مشهد الحقل.
- source_word: τὰ πετεινὰ
  choice: الطيور
  rationale: ينقل الاسم اليوناني من غير إضافة «السماء» أو «الجو»، إذ لا يرد قيد مماثل في نص هذه الآية.
- source_word: κατέφαγεν
  choice: التهمته
  rationale: يحفظ قوة الفعل المركب κατεσθίω، الذي يفيد الأكل التام أو الشديد، بصورة عربية واضحة.
- source_word: αὐτό
  choice: ـه في «التهمته»
  rationale: الضمير المفرد يعود إلى الجزء الجمعي من البذار، وهو استعمال طبيعي في العربية.
