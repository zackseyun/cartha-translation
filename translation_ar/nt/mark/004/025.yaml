  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: ar
  text: لِأَنَّ مَنْ لَهُ سَيُعْطَى، وَمَنْ لَيْسَ لَهُ، فَحَتَّى مَا لَهُ سَيُؤْخَذُ مِنْهُ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: مَنْ
  rationale: اسم موصول عام ينقل القوة المَثَلية الشاملة في اليونانية بعبارة عربية طبيعية موجزة.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: يحفظ وظيفة الأداة في تعليل القول السابق وربطه به.
- source_word: ἔχει
  choice: لَهُ
  rationale: التعبير العربي «له» هو الأنسب طبيعيًا للدلالة العامة على الامتلاك هنا، مع إبقاء الشيء المملوك غير محدد.
- source_word: δοθήσεται αὐτῷ
  choice: سَيُعْطَى
  rationale: يحافظ على المبني للمجهول وعلى غياب المفعول الصريح في الأصل؛ ويُفهم المتلقي من تركيب «مَنْ لَهُ سيُعطى» دون إضافة «المزيد».
- source_word: καὶ
  choice: وَ
  rationale: تصل بين شطري القول المتقابلين كما في الأصل.
- source_word: οὐκ ἔχει
  choice: لَيْسَ لَهُ
  rationale: صياغة عربية واضحة وطبيعية لنفي الامتلاك.
- source_word: ὃ ἔχει
  choice: مَا لَهُ
  rationale: يحفظ الإشارة العامة غير المحددة إلى ما يملكه الشخص.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: سَيُؤْخَذُ مِنْهُ
  rationale: ينقل المبني للمجهول ومعنى الإزالة أو السلب الذي يفيده الفعل مع حرف الجر.
theological_decisions:
- issue: المفعول المحذوف مع δοθήσεται
  choice: 'إبقاء المفعول غير مصرّح به: «سيُعطى»'
  alternative: «سيُعطى المزيد» أو «سيُزاد»
  rationale: الأصل اليوناني لا يذكر مفعولًا، والعربية تسمح ببقاء العبارة على هذا الإيجاز. وهذا يصون غموض الأصل ولا يحوّل الزيادة المفهومة من المقابلة إلى لفظ صريح.
- issue: الإحالة العامة بصيغة المفرد
  choice: «مَنْ لَهُ ... مَنْ لَيْسَ لَهُ ... مِنْهُ»
  alternative: صياغة جمع مثل «الذين لهم ... منهم»
  rationale: تحافظ صيغة «مَن» مع ضمير المفرد على البنية المفردة العامة في الأصل، وهي فصيحة وشاملة في العربية من غير إدخال تمييز جنسي غير لازم.
translation_notes:
  register: عربية فصحى حديثة واضحة، ذات إيقاع مَثَلي موجز. حُفظ التوازي والتقابل والمبني للمجهول، ولم تُضف كلمة «المزيد» لأن العربية تستوعب حذف المفعول كما في اليونانية.
