  terminology: لا ترد في الآية مصطلحات لاهوتية تقنية تحتاج إلى ضبط خاص. اختيارات «له»، و«ليس له»، و«سيؤخذ منه» دقيقة وطبيعية، وتحفظ عدم تحديد الشيء المشار إليه في النص اليوناني.
