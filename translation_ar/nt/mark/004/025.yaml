  source_fidelity: 'النص العربي يحافظ بدقة على بنية القول اليوناني: «لِأَنَّ» تؤدي وظيفة γάρ التعليلية، و«مَنْ» تحفظ العموم، و«له/ليس له» تنقلان الامتلاك غير المحدد، كما يحافظ «سيُعطى» و«سيؤخذ منه» على المبني للمجهول. ولم يُضف مفعولًا إلى «سيُعطى»، فيبقى الحذف المقصود في الأصل محفوظًا. و«حتى ما له» تقابل καὶ ὃ ἔχει على نحو سليم.'
