  rationale: 'التعديل محدود: يصرّح بزمن المستقبل في الفعلين المبنيين للمجهول، ويحسّن وضوح تركيب الأمر، مع إبقاء استعارة الكيل، وتكرارها، وإبهام مرجع الزيادة كما في اليونانية. الحاشية تبقى تفسيرًا سياقيًا ممكنًا لا تقريرًا لمعنى حصري.'
