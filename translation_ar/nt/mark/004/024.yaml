  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: ar
  text: 'وكان يقول لهم: «انتبهوا إلى ما تسمعون. فبالمكيال الذي تكيلون به سيُكال لكم، وسيُزاد لكم[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تُفهم عبارة «وسيُزاد لكم» على أنها تشير إلى ازدياد الفهم لدى الذين يتقبلون تعليم يسوع.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: يحفظ دلالة الماضي الناقص على الاستمرار أو التكرار في سياق السرد، بصياغة عربية طبيعية.
- source_word: Βλέπετε
  choice: انتبهوا
  rationale: الفعل هنا أمر اصطلاحي بالتيقظ والعناية، لا دعوة حرفية إلى النظر.
- source_word: τί ἀκούετε
  choice: لما تسمعون
  rationale: يحفظ معنى τί بوصفه «ما»، ولا يوافقه قسرًا مع صيغة «كيف تسمعون» الواردة في لوقا 8:18.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: بالكيل الذي تكيلون به
  rationale: يحفظ صورة أداة الكيل والفعل المشتق من الجذر نفسه، ويأتي طبيعيًا في العربية.
- source_word: μετρηθήσεται ὑμῖν
  choice: يُكال لكم
  rationale: يحفظ المبني للمجهول والاستقبال المفهوم من السياق، من غير إضافة معنى «ردًّا إليكم» غير المصرح به.
- source_word: προστεθήσεται ὑμῖν
  choice: يُزاد لكم
  rationale: ينقل معنى الإضافة بأمانة من غير إدخال «المزيد» بوصفه مفعولًا مقدرًا في النص الأصلي.
theological_decisions:
- issue: دلالة مبدأ المعاملة بالمثل في القول
  choice: الإبقاء على استعارة الكيل عامة في سياق الإصغاء إلى تعليم يسوع
  alternative: تحديدها بالحكم، أو السخاء، أو ازدياد الفهم الروحي وحده
  rationale: السياق المباشر يتعلق بالسماع والتلقي، لكن العبارة لا تصرح بتطبيق عقائدي واحد؛ لذلك تُحفظ سعتها وتوترها الدلالي.
- issue: مرجع الزيادة في «ويُزاد لكم»
  choice: عدم تحديد ما الذي سيُزاد في متن الترجمة
  alternative: التصريح بأن المقصود مزيد من الفهم
  rationale: الفعل اليوناني لا يذكر مفعولًا، وتحديد الزيادة بالفهم تفسير سياقي معقول لكنه ليس صريحًا في العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «الكيل» للمحافظة على الاستعارة وتكرار الجذر في «تكيلون/يُكال»، مع تجنب التفسير العقائدي الزائد.
