  to: وسقطت بذور أخرى في التربة الجيدة[a]، وكانت تُثمر وتنمو وتزداد، وتُنتج ثلاثين ضعفًا وستين ضعفًا ومئة ضعف.
  rationale: استُبدلت العبارة الافتتاحية بـ«بذور أخرى» لتوافق الجمع المحايد المستعمل اسميًا في اليونانية ولتكون سليمة وطبيعية بالعربية. وحُذف فعل الشروع «أخذ» لتفادي إضافة معنى غير لازم، مع الإبقاء على دلالة الاستمرار بواسطة «كانت» والأفعال المضارعة. ولم يُغيَّر معنى التربة أو تدرج الغلة.
