  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: ar
  text: وسقطت بذور أخرى في التربة الجيدة[a]، وكانت تُثمر وتنمو وتزداد، وتُنتج ثلاثين ضعفًا وستين ضعفًا ومئة ضعف.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وسقطت أخرى في التربة الجيدة»، مع فهم «البذور» من السياق.'
    reason: بديل معجمي يحافظ على الاستعمال الاسمي للصفة اليونانية من غير إظهار الاسم المقدّر في المتن.
lexical_decisions:
- source_word: ἄλλα
  choice: بعض البذار الآخر
  rationale: صفة محايدة بصيغة الجمع مستعملة استعمال الاسم، وتعود في سياق المثل إلى البذار المذكور؛ أُضيفت «البذار» للإيضاح، وحافظت «بعض» على المعنى التوزيعي.
- source_word: γῆν τὴν καλήν
  choice: التربة الجيدة
  rationale: السياق زراعي، والمقصود الأرض من حيث صلاح تربتها للزرع، لا الأرض بوصفها إقليمًا أو بلدًا.
- source_word: ἐδίδου καρπὸν
  choice: فأخذ يُنتج ثمرًا
  rationale: صيغة الماضي الناقص تدل على فعل مستمر؛ و«أخذ يُنتج» تنقل هذا الامتداد بعبارة عربية طبيعية.
- source_word: ἀναβαίνοντα
  choice: وينمو
  rationale: يدل في السياق الزراعي على صعود النبات ونموه؛ و«ينمو» أوضح وأطبع في العربية من النقل الحرفي «يصعد».
- source_word: αὐξανόμενα
  choice: ويزداد
  rationale: يحفظ معنى الزيادة المستمرة ويميّزه نسبيًا عن بدء النمو الذي تفيده الكلمة السابقة.
- source_word: ἔφερεν
  choice: ويعطي
  rationale: يدل على حمل الغلة أو إيتائها باستمرار؛ واختيار «يعطي» يلائم ذكر مقادير المحصول اللاحقة.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: ثلاثين ضعفًا وستين ضعفًا ومئة ضعف
  rationale: العبارة تصف نسب الغلة، وإضافة «ضعفًا» تُظهر معنى التكاثر الزراعي بوضوح مع إبقاء التدرج الثلاثي.
