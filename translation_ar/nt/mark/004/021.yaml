  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: ar
  text: 'وكان يقول لهم: «أَيأتي السراج[a] لكي يوضع تحت المكيال[b] أو تحت السرير؟ أليس لكي يوضع على حامل السراج؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقول اليونانية حرفيًا: «أَيأتي السراج...؟»، وفيها تشخيص حي إذ يُسند المجيء إلى السراج.'
    reason: lexical_alternative
  - marker: b
    text: «المكيال» مقدارٌ للحبوب، ويُطلق أيضًا على الوعاء المستعمل في كيلها؛ والمعنى هنا وعاءُ الكيل.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: صيغة الماضي الناقص اليونانية تُبرز الكلام المستمر أو المتكرر في سياق السرد، ويؤديها هذا التركيب العربي بوضوح.
- source_word: Μήτι
  choice: أَيأتي ...؟
  rationale: تفتتح الأداة سؤالًا بلاغيًا يُنتظر أن تكون إجابته بالنفي؛ وصيغة الاستفهام العربية هنا تحافظ على قوة السؤال، ولا سيما مع السؤال المقابل «أليس...؟».
- source_word: ἔρχεται ὁ λύχνος
  choice: يأتي السراج
  rationale: يحافظ هذا الاختيار على التشخيص الحي في اليونانية، حيث يُصوَّر السراج كأنه يأتي، بدل تحويل العبارة إلى المبني للمجهول.
- source_word: λύχνος
  choice: السراج
  rationale: تشير الكلمة إلى سراج زيتي محمول، لا إلى النور بمعناه المجرد.
- source_word: μόδιον
  choice: المكيال
  rationale: المقصود وعاء قياس للحبوب استُخدم أيضًا اسمًا لوحدة كيل؛ و«المكيال» واضح ويحفظ وظيفته الثقافية أفضل من اسم وحدة قديمة منقول صوتيًا.
- source_word: κλίνην
  choice: السرير
  rationale: يمكن أن تدل الكلمة على سرير أو مضجع، و«السرير» هو التعبير المنزلي الأوضح في هذا السياق.
- source_word: λυχνίαν
  choice: حامل السراج
  rationale: تدل الكلمة تحديدًا على الحامل الذي يوضع عليه السراج؛ وهذه العبارة أوضح للقارئ المعاصر من «المنارة» التي قد تُفهم بمعانٍ أخرى.
- source_word: ἵνα ... τεθῇ
  choice: لكي يوضع
  rationale: ينقل الغاية التي تفيدها ἵνα مع صيغة المبني للمجهول، بلغة عربية طبيعية ومباشرة.
theological_decisions:
- issue: هل يُحفظ التشخيص الحرفي في عبارة «يأتي السراج» أم تُفسَّر العبارة ديناميكيًا بصيغة «يُؤتى بالسراج»؟
  choice: 'الحفاظ على الصورة الفاعلة: «يأتي السراج»'
  alternative: «يُؤتى بالسراج»
  rationale: القول ذو صياغة مثلية حية، والإبقاء على الفعل المسند إلى السراج يحفظ غرابة الصورة المقصودة وقوتها البلاغية من غير أن يفرض تفسيرًا لاهوتيًا عليها.
- issue: دلالة أداة التعريف في ὁ λύχνος ضمن قول عام
  choice: «السراج»
  alternative: «سراج»
  rationale: التعريف في العربية ملائم للتعبير عن الجنس في الأقوال العامة، كما أنه يوافق البنية اليونانية من غير أن يحصر الإشارة في سراج بعينه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. حُفظ التوازي البلاغي بين السؤالين، واستُخدم «حامل السراج» لتجنب غموض «المنارة» في الاستعمال الحديث.
