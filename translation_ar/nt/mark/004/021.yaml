  source_fidelity: 'النص يطابق البنية اليونانية الأساسية بدقة: «وكان يقول» ينقل دلالة الماضي الناقص، و«أيأتي السراج» يحفظ التشخيص المقصود في ἔρχεται ὁ λύχνος، والأسئلة والغرض المبني للمجهول محفوظة. غير أن شرح الحاشية (أ) يضيف معنى «من تلقاء نفسه» لا يقتضيه النص اليوناني؛ فالتشخيص هو إسناد المجيء إلى السراج، لا تقرير كيفية مجيئه.'
