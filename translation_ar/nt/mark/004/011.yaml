  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: ar
  text: 'وكان يقول لهم: «قد أُعطيتم سرّ ملكوت الله، أما أولئك الذين في الخارج، فكل شيء يأتيهم في أمثال.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήριον
  choice: سرّ
  rationale: يدل هنا على حقيقة إلهية كانت خفية ثم أُعلن عنها، و«سرّ» هو المقابل العربي الطبيعي دون الإيحاء بمجرد لغز.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير كتابي عربي راسخ ينقل معنى مُلك الله وسلطانه، لا مجرد نطاق جغرافي.
- source_word: τοῖς ἔξω
  choice: أولئك الذين في الخارج
  rationale: يحافظ على الصورة المكانية والاجتماعية في الأصل من غير تعيين مسبق لهوية هذه الفئة.
- source_word: ἐν παραβολαῖς
  choice: بأمثال
  rationale: «أمثال» هي الصياغة العربية المألوفة لتعليم يسوع القصصي التمثيلي.
- source_word: γίνεται
  choice: يأتيهم
  rationale: يحافظ على الدلالة الحدثية للفعل، بدل تسويته إلى عبارة ساكنة مثل «يكون»، مع إظهار المتلقي المفهوم من السياق.
theological_decisions:
- issue: طبيعة السر وعلاقته بالعطاء الإلهي
  choice: قد أُعطي لكم سرّ ملكوت الله
  alternative: أُتيح لكم أن تعرفوا سرّ ملكوت الله
  rationale: الصياغة المختارة تحافظ على المبني للمجهول وعلى كون السر نفسه هو المعطى، من غير إدخال فعل «تعرفوا» غير المذكور في النص.
- issue: دلالة وصف الآخرين بأنهم في الخارج
  choice: أولئك الذين في الخارج
  alternative: الذين هم خارج جماعتكم
  rationale: تُبقي العبارة مفتوحة كما في اليونانية، ولا تحسم هل المقصود خارج دائرة التلاميذ أم خارج جماعة أوسع.
- issue: علاقة كل شيء بالأمثال
  choice: فكل شيء يأتيهم بأمثال
  alternative: فكل شيء يكون لهم في أمثال
  rationale: تحافظ على حركة γίνεται التي راعاها نص POB الإنجليزي بلفظ comes، مع عدم تفسير الغاية أو النتيجة قبل الآية التالية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ الاستمرار في ἔλεγεν بعبارة «وكان يقول»، والمقابلة بين «لكم» و«أولئك الذين في الخارج»، كما حُفظ المبني للمجهول في «قد أُعطي» دون تعيين الفاعل صراحة.
