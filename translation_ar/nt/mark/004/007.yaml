  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: ar
  text: وَوَقَعَ بِذَارٌ آخَرُ بَيْنَ الأَشْوَاكِ[أ]، فَنَمَتِ الأَشْوَاكُ وَخَنَقَتْهُ، فَلَمْ يُثْمِرْ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'أو: «داخل الأشواك». وحرف الجر اليوناني معناه الحرفي «إلى/داخل»، أما «بين الأشواك» فهو التعبير العربي الطبيعي في هذا السياق الزراعي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: بَعْضُ الْبِذَارِ الْآخَرِ
  rationale: الصفة اليونانية المحايدة المفردة تحيل حذفًا إلى البذار المذكور في سياق المثل؛ وإظهار «البذار» في العربية يوضح المرجع من غير إضافة معنى جديد.
- source_word: ἔπεσεν
  choice: وَقَعَ
  rationale: ينقل فعل السقوط مباشرة، ولا يستبدله بتفسير مثل «زُرع».
- source_word: εἰς τὰς ἀκάνθας
  choice: بَيْنَ الشَّوْكِ
  rationale: مع أن حرف الجر يفيد حرفيًا الحركة «إلى/داخل»، فإن «بين الشوك» تعبير عربي طبيعي للمشهد الزراعي ويحفظ معنى وقوع البذار في موضع مليء بالشوك.
- source_word: ἀνέβησαν
  choice: نَمَا
  rationale: يفيد صعود النبات ونموه؛ و«نما» هو التعبير العربي الطبيعي هنا من غير مبالغة في وصف العملية.
- source_word: συνέπνιξαν
  choice: خَنَقَهُ
  rationale: يحفظ الصورة الحية لفعل الشوك الذي يحول دون نمو البذار وإثماره.
- source_word: αὐτό
  choice: ـهُ
  rationale: الضمير المفرد يعود إلى البذار بوصفه اسم جمع يُعامل هنا معاملة المفرد.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: لَمْ يُثْمِرْ
  rationale: صياغة عربية موجزة وطبيعية تنقل حرفيًا في المعنى أنه لم يعطِ ثمرًا.
