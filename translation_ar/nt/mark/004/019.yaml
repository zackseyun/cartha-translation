base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: ar
  text: وهموم هذا الدهر[a]، وخداع الغنى[b]، والرغبات في الأمور الأخرى، تدخل وتخنق الكلمة، فتصير بلا ثمر[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «هموم العالم». يمكن للكلمة اليونانية أن تعني «الدهر»، وأن تدل بالامتداد على العالم الحاضر أو نظامه.
    reason: lexical_alternative
  - marker: b
    text: أو «خداع الثروة».
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «وتصير غير مثمرة». يُفهم من صياغة الجملة اليونانية أن «الكلمة» هي المرجع الأقرب، وقد يُفهم في صورة المثل أن المقصود هو البذار أو النبتة، أو أن السامع يصير غير مثمر.'
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: هموم
  rationale: تنقل معنى المشاغل المثقلة والقلق من غير حصر اللفظ في حالة نفسية مرضية.
- source_word: αἰῶνος
  choice: الدهر
  rationale: يحفظ البعد الزمني في αἰών، مع إمكان دلالته بالامتداد على نظام العالم الحاضر.
- source_word: ἀπάτη τοῦ πλούτου
  choice: خداع الغنى
  rationale: يعبر عن الصفة المضللة للغنى ويحافظ على الإضافة الموجزة في الأصل.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: الشهوات إلى سائر الأشياء
  rationale: صياغة عربية واضحة تحفظ اتجاه الرغبات نحو أمور أخرى، ولا تقصرها على نوع محدد.
- source_word: εἰσπορευόμεναι
  choice: تدخل
  rationale: حُوِّل اسم الفاعل اليوناني إلى فعل مضارع طبيعي في العربية، مع إبقاء صورة دخول المؤثرات المنافسة.
- source_word: συμπνίγουσιν
  choice: فتخنق
  rationale: يحفظ صورة الاختناق في المثل، والفاء توضح تعاقب الدخول والنتيجة.
- source_word: τὸν λόγον
  choice: الكلمة
  rationale: يحفظ المصطلح المتكرر في سياق المثل ورنينه الكتابي، مع بقائه مفهومًا في العربية.
- source_word: ἄκαρπος γίνεται
  choice: فتصير بلا ثمر
  rationale: يحفظ معنى التحول إلى حالة عدم الإثمار، ويستبقي صورة الزرع والثمر بصياغة عربية طبيعية.
theological_decisions:
- issue: مرجع الفعل والصفة في ἄκαρπος γίνεται
  choice: 'جُعل المرجع الأقرب «الكلمة»: «فتصير بلا ثمر».'
  alternative: قد يُفهم المعنى على أن السامع، أو النبتة/البذرة، هو الذي يصير غير مثمر.
  rationale: «الكلمة» هي أقرب سابق مفرد صريح في اليونانية، كما أن سياق البذر يسمح بفهم الكلمة بوصفها البذار المخنوق؛ وأُثبت الاحتمال السياقي الآخر في الحاشية دون إدخاله في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «الدهر» بدل «العالم» للمحافظة على الدلالة الزمنية، و«بلا ثمر» للمحافظة على صورة المثل. تُرك تعداد المؤثرات متوازيًا، وحُوِّل اسم الفاعل اليوناني إلى فعل مضارع لتجنب تركيب عربي ثقيل.
