lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: يحفظ دلالة الماضي الناقص على القول الجاري أو المتكرر في السياق السردي.
- source_word: Οὕτως
  choice: هكذا
  rationale: تقدّم هيئة التشبيه بإيجاز طبيعي، مع بقاء الجملة ممتدة إلى العدد التالي.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي راسخ، ويمكن أن يدل على مُلك الله وسلطانه ونطاق حكمه من غير حصر المعنى في أحدها.
- source_word: ὡς
  choice: كأن
  rationale: تنقل المقارنة المضغوطة التي يكتمل معناها في العدد التالي، من غير إضافة تفسير غير موجود في اليونانية.
- source_word: ἄνθρωπος
  choice: رجلًا
  rationale: يحفظ صورة الشخص الممثل بصيغة المذكر المفرد في المصدر.
- source_word: βάλῃ
  choice: يلقي
  rationale: يحفظ الصورة الحرفية للفعل βάλλω، وهي مفهومة زراعيًا بوصفها نثر البذار.
- source_word: τὸν σπόρον
  choice: البذار
  rationale: لفظ جمعي طبيعي في العربية لسياق الزرع، وينقل معنى البذر المراد نثره مع تعريفه.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: يناسب السياق الزراعي ويحفظ دلالة حرف الجر، والمقصود هنا أرض الزراعة لا العالم الكوني.
theological_decisions:
- issue: صياغة التشبيه المفتوح الذي يمتد إلى العدد التالي
  choice: '«ملكوت الله هكذا: كأن رجلًا يلقي البذار على الأرض»'
  alternative: «ملكوت الله مثل رجل يزرع البذار في الأرض»
  rationale: الصياغة المختارة تحفظ التركيب اليوناني المضغوط والانفتاح النحوي نحو العدد 27، ولا تستبدل فعل «يلقي» بتفسيره الزراعي «يزرع».
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «ملكوت الله» للمصطلح الإنجيلي المألوف، و«يلقي البذار» للمحافظة على الصورة الأصلية مع وضوح السياق الزراعي.
