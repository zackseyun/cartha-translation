  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: ar
  text: فهَبَّت عاصفة شديدة من الريح[a]، وكانت الأمواج تندفع إلى داخل القارب[b]، حتى إن القارب كان قد أخذ يمتلئ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أقرب إلى اللفظ: «عاصفة شديدة من الريح».'
    reason: lexical_alternative
  - marker: b
    text: أو «كانت الأمواج تضرب داخل القارب». والفعل اليوناني بصيغة الماضي الناقص يصوّر فعلًا مستمرًا أو متكررًا.
    reason: lexical_alternative
  - marker: c
    text: أو «حتى إن القارب كان يُملأ بالفعل».
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: هبّت
  rationale: المضارع التاريخي يقدّم بدء العاصفة بحيوية؛ و«هبّت» تعبير عربي طبيعي يلائم عاصفة الريح.
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: عاصفة ريح شديدة
  rationale: ينقل «عاصفة» معنى الزوبعة أو العاصفة العنيفة، وتحفظ «ريح» المضاف إليه، وتؤدي «شديدة» معنى μεγάλη بصياغة عربية واضحة.
- source_word: τὰ κύματα ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: كانت الأمواج تندفع إلى داخل القارب
  rationale: تفيد «كانت... تندفع» الفعل المستمر أو المتكرر الذي يصوره الماضي الناقص اليوناني، وتوضح εἰς أن الأمواج كانت تدخل القارب، من غير إضعاف حركتها القوية.
- source_word: τὸ πλοῖον
  choice: القارب
  rationale: «القارب» أنسب لحجم المركب وسياق بحيرة الجليل من «السفينة» في الاستعمال العربي الحديث.
- source_word: ὥστε
  choice: حتى إن
  rationale: تصل النتيجة بسببها بصياغة عربية طبيعية وواضحة.
- source_word: ἤδη γεμίζεσθαι τὸ πλοῖον
  choice: القارب كان قد أخذ يمتلئ
  rationale: تحفظ العبارة كون الامتلاء عملية جارية بلغت بدايتها بالفعل، وتؤدي المبني للمجهول/الوسط بصياغة عربية طبيعية من غير إضافة «بالماء» إلى النص.
theological_decisions: []
