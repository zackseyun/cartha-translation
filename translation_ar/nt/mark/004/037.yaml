  register: عربية فصحى حديثة واضحة وذات نبرة سردية حية. استُخدم «هبّت» على نحو اصطلاحي طبيعي مع عاصفة الريح، وحُفظت استمرارية الأمواج وعملية امتلاء القارب، مع تجنب إضافة «بالماء» لأنها مفهومة من السياق وليست مذكورة صراحة في اليونانية.
