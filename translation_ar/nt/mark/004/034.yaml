base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: ar
  text: ولم يكن يكلّمهم من دون مَثَل، لكنه كان، على انفراد، يشرح كل شيء لتلاميذه الخاصّين به.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان يفسّر كل شيء». ويمكن أن يدلّ الفعل اليوناني على الشرح أو التفسير أو الإيضاح.'
    reason: lexical_alternative
  - marker: b
    text: تُبرز العبارة اليونانية أن هؤلاء هم تلاميذه هو.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ παραβολῆς
  choice: ولم يكن يكلّمهم من دون مَثَل
  rationale: «من دون» تنقل معنى χωρὶς بوضوح، و«مَثَل» يحافظ على المفرد اليوناني. وصيغة «لم يكن يكلّم» تعبّر عن الفعل الناقص الدال على العادة في هذا الملخص السردي.
- source_word: κατ’ ἰδίαν
  choice: على انفراد
  rationale: تعبير عربي طبيعي ينقل معنى الحديث الخاص في مقابل الكلام العلني بالأمثال.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: لتلاميذه المقرّبين إليه
  rationale: يحاول هذا التعبير إبراز دلالة ἰδίοις، أي التلاميذ الذين يخصّونه، من غير الصياغة العربية الملتبسة «تلاميذه الخاصين».
- source_word: ἐπέλυεν
  choice: كان ... يشرح
  rationale: «يشرح» لفظ واضح ومعاصر ضمن المجال الدلالي للفعل الذي قد يعني الشرح أو التفسير، وصيغة «كان يشرح» تحافظ على جانب الفعل الناقص.
- source_word: πάντα
  choice: كل شيء
  rationale: يحافظ على الشمول الذي في اللفظ اليوناني من غير تقييده صراحة بالأمثال أو بما قاله يسوع.
theological_decisions:
- issue: نطاق ما كان يسوع يشرحه على انفراد
  choice: كل شيء
  alternative: كل الأمثال؛ كل ما قاله
  rationale: النص اليوناني يقول πάντα بلا مفعول مقيِّد. قد يدل السياق على تعاليمه أو أمثاله، لكن الترجمة لا تحسم ما تركه النص عامًا.
