lexical_decisions:
- source_word: λέγει
  choice: وقال
  rationale: استُعمل الماضي لأنه الأسلوب الطبيعي للسرد العربي؛ أما المضارع التاريخي اليوناني فترجمته حرفيًا هنا إلى «يقول» قد تبدو متكلفة وتقطع انسجام الحكاية.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: في ذلك اليوم
  rationale: تعبير عربي واضح يحفظ الإشارة الزمنية كما في اليونانية.
- source_word: ὀψίας γενομένης
  choice: لما حلّ المساء
  rationale: ينقل الظرف الزمني المطلق بصياغة عربية طبيعية، من غير زيادة في المعنى.
- source_word: Διέλθωμεν
  choice: لنعبر
  rationale: صيغة حثّ للمتكلم مع الجماعة، وتؤدي معنى العبور بوضوح وإيجاز.
- source_word: εἰς τὸ πέραν
  choice: إلى الضفة الأخرى
  rationale: يفهم من السياق أن المقصود الجانب المقابل من البحيرة؛ ولفظ «الضفة» يوضح المرجع الطبيعي من غير تسمية غير واردة في الآية.
