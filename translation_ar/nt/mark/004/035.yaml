  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: ar
  text: 'وقال لهم في ذلك اليوم، لما حلّ المساء: «لنعبر إلى الضفة الأخرى».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
