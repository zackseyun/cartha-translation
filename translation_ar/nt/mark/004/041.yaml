  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: ar
  text: 'فامتلأوا خوفًا عظيمًا، وقال بعضهم لبعض: «فمن يكون هذا إذًا، حتى إن الريح والبحر يطيعانه؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: امتلأوا خوفًا عظيمًا
  rationale: يفيد الفعل مع المفعول المطلق من مادته توكيد الخوف وتعظيمه. يحفظ هذا التعبير قوة الأسلوب اليوناني بلغة عربية طبيعية، من غير الصياغة الحرفية الثقيلة «خافوا خوفًا عظيمًا».
- source_word: ἔλεγον
  choice: قال
  rationale: الماضي الناقص اليوناني قد يدل على الاستمرار أو التكرار، لكن السياق السردي لا يستلزم إبراز ذلك، والماضي العربي الطبيعي يؤدي المعنى.
- source_word: πρὸς ἀλλήλους
  choice: بعضهم لبعض
  rationale: تعبير عربي واضح ينقل دلالة التبادل في الحديث.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: فمن يكون هذا إذًا
  rationale: تنقل «إذًا» دلالة ἄρα الاستنتاجية المشوبة بالدهشة، وتربط الفاء السؤال بما شاهدوه للتو.
- source_word: ὅτι
  choice: حتى إن
  rationale: تصل العبارة بسبب الدهشة ومضمون السؤال بصورة عربية طبيعية، مع إبقاء العلاقة الدلالية غير محصورة في تعليل صريح.
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: حتى إن الريح والبحر
  rationale: تؤدي «حتى إن» معنى الكلمة الأولى καὶ بوصفها للتوكيد بمعنى «حتى»، بينما تربط الواو الريح بالبحر.
- source_word: ὑπακούει αὐτῷ
  choice: يطيعانه
  rationale: الفعل يعني الإصغاء المفضي إلى الطاعة؛ والتثنية العربية توافق الفاعلين «الريح والبحر» وتحفظ تصويرهما كأنهما يستجيبان لأمره.
theological_decisions:
- issue: سلطان يسوع على الخليقة
  choice: الإبقاء على سؤال التلاميذ وذكر طاعة الريح والبحر له من دون إضافة تفسير عقائدي صريح
  alternative: توسيع العبارة بما يصرح بهوية إلهية أو باستنتاج لاهوتي
  rationale: النص نفسه يعرض دهشة التلاميذ وسلطان يسوع الاستثنائي، لكنه يصوغه في سؤال؛ لذلك ينبغي حفظ ثقله اللاهوتي وتوتره السردي من غير حسم يتجاوز عبارته.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة طبيعية تحفظ شدة الخوف ونبرة الاستنتاج المندهش، من غير حاشية لأن المعنى المؤكد أمكن نقله بوضوح في المتن.
