lexical_decisions:
- source_word: ἔλεγεν
  choice: وكان يقول
  rationale: ينقل صيغة الماضي الناقص اليونانية بما يوحي باستمرار القول أو تكراره في سياق السرد، من غير تكلّف.
- source_word: Πῶς
  choice: كيف
  rationale: أداة استفهام عن الكيفية، و«كيف» هي المقابل العربي المباشر والطبيعي.
- source_word: ὁμοιώσωμεν
  choice: نشبّه
  rationale: يحافظ على صيغة المتكلم الجمع في السؤال التداولي وعلى معنى المقارنة وإبراز الشبه.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي راسخ يحفظ صورة الملك والسيادة واتساع الدلالة في السياق الإنجيلي.
- source_word: ἐν τίνι ... παραβολῇ
  choice: بأيّ مَثَل
  rationale: يفهم ἐν هنا على دلالتها الأداتية، أي المثل الذي يُستعمل لعرض ملكوت الله، وهو تعبير عربي واضح وطبيعي.
- source_word: παραβολῇ
  choice: مَثَل
  rationale: المصطلح العربي المألوف لهذا النوع من التعليم القصصي والتشبيهي في الأناجيل.
- source_word: αὐτὴν ... θῶμεν
  choice: نعرضه
  rationale: ينقل المعنى الاصطلاحي للفعل τίθημι، أي تقديم الأمر أو عرضه بواسطة مَثَل، بدل ترجمة حرفية ثقيلة مثل «نضعه».
