  text: The sower sows the word[a].
translation:
  language: ar
  text: الزارع يزرع الكلمة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الرسالة». يمكن أن تعني الكلمة اليونانية λόγος «الكلمة» أو «الرسالة» بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: الزارع
  rationale: اسم الفاعل المضارع المعرّف يُستعمل هنا استعمال الاسم للدلالة على من يتصف بفعل الزرع. «الزارع» موجزة وطبيعية وتحفظ صورة المثل، بخلاف «الفلاح» التي توسّع المعنى إلى المهنة عمومًا.
- source_word: τὸν λόγον
  choice: الكلمة
  rationale: يمكن أن تعني λόγος «الكلمة» أو «الرسالة» بحسب السياق. تحافظ «الكلمة» على عموم التعبير اليوناني ولا تضيف تحديدًا غير مصرّح به في الآية، مع إثبات البديل السياقي في الحاشية.
- source_word: σπείρει
  choice: يزرع
  rationale: المضارع الخبري يعبّر عن الفعل العام في شرح المثل. وتحفظ صياغة «الزارع يزرع» التكرار البلاغي القائم في اليونانية بين اسم الفاعل والفعل من الجذر نفسه.
theological_decisions:
- issue: مرجع «الكلمة» في شرح المثل
  choice: الكلمة
  alternative: الرسالة؛ كلمة الله؛ البشارة
  rationale: النص اليوناني يذكر τὸν λόγον فقط. ومع أن السياق يشير إلى رسالة إلهية مُعلنة، فإن إضافة «الله» أو تعيينها بأنها «البشارة» يحسم ما تركته هذه الآية عامًا؛ لذلك أُبقي التعبير دون توسعة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، مع الحفاظ على الصورة الزراعية والتكرار المقصود في الأصل.
