  - marker: b
    text: تستعمل اليونانية صيغة المقارنة «أصغر»، لا صيغة التفضيل «الأصغر».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: هي كَـ
  rationale: أُضيف الضمير «هي» لاستكمال العبارة المحذوفة التي تعتمد على سؤال الآية السابقة عن ملكوت الله، مع إبقاء معنى التشبيه.
- source_word: κόκκῳ σινάπεως
  choice: حبّة خردل
  rationale: «حبّة خردل» تعبير عربي طبيعي، وينقل κόκκος بمعنى الحبّة أو البذرة في هذا السياق.
- source_word: ὅταν σπαρῇ
  choice: متى زُرعت
  rationale: ينقل الصياغة الزمنية العامة مع المبني للمجهول، من غير حصرها في واقعة واحدة.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: يحافظ على دلالة ἐπί الحرفية، ويشير في السياق الزراعي إلى سطح التربة أو الأرض المزروعة.
- source_word: μικρότερον ὂν
  choice: تكون أصغر
  rationale: يحافظ على صيغة المقارنة «أصغر» بدل تحويلها إلى صيغة التفضيل المطلقة «أصغر البذور»، ويصوغ التركيب الاشتقاقي بجملة عربية واضحة.
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: من جميع البذور التي على الأرض
  rationale: ينقل المقارنة مع جميع البذور ويحفظ القيد المتكرر «التي على الأرض» الوارد في اليونانية.
theological_decisions:
- issue: صيغة المقارنة في وصف حبّة الخردل
  choice: «أصغر من جميع البذور»
  alternative: «أصغر جميع البذور» أو «أصغر البذور كلّها»
  rationale: النص اليوناني يستعمل صيغة المقارنة μικρότερον، لذلك حُفظت المقارنة صراحةً من غير تسويتها إلى صيغة تفضيل مطلقة تقليدية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «حبّة خردل» لكونها طبيعية وشائعة، وحُفظ تكرار «على الأرض» وبنية الجملة المفتوحة في آخر الآية بعلامة الشرطة.
