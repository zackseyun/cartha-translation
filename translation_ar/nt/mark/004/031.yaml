base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: ar
  text: هي مثل حبّة خردل[a]، التي حين تُزرَع في الأرض تكون أصغر[b] من جميع البذور التي في الأرض—
  philosophy: optimal-equivalence
