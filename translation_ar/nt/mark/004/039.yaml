  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: ar
  text: 'وإذ أُوقِظ[a]، انتهر الريح وقال للبحر[b]: «اصمت! اخرس![c]» فسكنت الريح، وحدث هدوء عظيم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولما استيقظ». الفعل اليوناني مبني للمجهول، ولا يصرّح بمن أيقظه.'
    reason: lexical_alternative
  - marker: b
    text: 'المقصود بحر الجليل، وهو بحيرة داخلية؛ أما اليونانية فتقول حرفيًا: «البحر».'
    reason: cultural_note
  - marker: c
    text: حرفيًا، يحمل الأمر اليوناني صورة «تكمَّم» أو «يُوضَع كمام على فمك».
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγερθεὶς
  choice: فقام
  rationale: اسم مفعول ظرفي من διεγείρω؛ يدل في السياق على نهوض يسوع من نومه. «فقام» عربية طبيعية موجزة، ولا تحسم وحدها هل استيقظ بنفسه أم أُوقظ.
- source_word: ἐπετίμησεν
  choice: انتهر
  rationale: ينقل قوة ἐπιτιμάω بوصفه زجرًا آمرًا، ويحافظ على الاستعمال المرقسي للسلطان على القوى المعادية أو الفوضوية.
- source_word: ἀνέμῳ
  choice: الريح
  rationale: اللفظ اليوناني يعني الريح تحديدًا، وإن كان السياق عاصفة.
- source_word: θαλάσσῃ
  choice: البحر
  rationale: ترجمة مباشرة لـ θάλασσα، مع إبقاء تسمية السرد الأصلية بدل تحويلها في المتن إلى «البحيرة».
- source_word: Σιώπα
  choice: اصمت!
  rationale: أمر مباشر بالكف عن الصوت، ويحفظ حدة الخطاب.
- source_word: πεφίμωσο
  choice: اخرس!
  rationale: الأصل أمر مبني للمجهول من فعل يفيد وضع الكمامة أو تكميم الفم. «اخرس» ينقل الصورة الآمرة الحادة بصورة طبيعية في العربية، مع بيان الحرفية في الحاشية.
- source_word: ἐκόπασεν
  choice: سكنت
  rationale: فعل عربي مألوف مع الريح، ينقل معنى انقطاعها أو خمودها.
- source_word: ἐγένετο
  choice: حدث
  rationale: ينقل نشوء الحالة الناتجة بعد سكون الريح دون تكلف حرفي.
- source_word: γαλήνη μεγάλη
  choice: هدوء عظيم
  rationale: يحفظ الصفة «عظيم» المميزة لأسلوب مرقس، وينقل γαλήνη بوصفها حالة هدوء شاملة.
theological_decisions:
- issue: هل يُلطَّف أمر يسوع للبحر إلى صياغة تقليدية أم تُحفظ حدته وصورته اللفظية؟
  choice: «اصمت! اخرس!» مع حاشية تشرح صورة التكميم
  alternative: «سلام! اهدأ!» أو «اهدأ! اسكن!»
  rationale: لا توجد في اليونانية كلمة اسمية بمعنى «سلام»، بل فعلان بصيغة الأمر، وثانيهما يستحضر تكميم الفم. الصياغة المختارة تحفظ سلطان الأمر وحدته من غير إدخال عبارة تقليدية غير موجودة في النص.
- issue: هل تُترجم θάλασσα «البحر» أم تُحدَّد جغرافيًا بأنها بحيرة؟
  choice: البحر في المتن، مع إيضاح جغرافي في الحاشية
  alternative: البحيرة
  rationale: يحفظ «البحر» لفظ المصدر ودلالته السردية، بينما تمنع الحاشية الالتباس الجغرافي من غير اختزال النص إلى تفسير جغرافي.
- issue: هل يُحسم المبني للمجهول في διεγερθεὶς بأن التلاميذ أيقظوه؟
  choice: «فقام» دون تعيين الفاعل
  alternative: «فلما أيقظوه» أو «وبعد أن استيقظ»
  rationale: السياق السابق يذكر إيقاظ التلاميذ له، لكن صيغة العبارة نفسها يمكن أن تُفهم على النهوض بعد الاستيقاظ. الصياغة العربية تحفظ التسلسل ولا تفرط في تحديد الوكالة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «انتهر» للحفاظ على قوة الفعل، و«اخرس» لحدة الأمر وصورة إسكات الفم، مع حاشية تمنع ضياع الدلالة الحرفية. وُضعت علامتا الحاشيتين في المتن بحسب موضوع كل حاشية.
