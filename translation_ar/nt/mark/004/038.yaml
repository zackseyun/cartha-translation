id: MRK.4.38
reference: Mark 4:38
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: ar
  text: 'أما هو فكان في مؤخر القارب، نائمًا على الوسادة[a]. فأيقظوه وقالوا له: «يا معلّم، أما يهمّك أننا نهلك؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المخدة». يمكن أن يدل اللفظ اليوناني على وسادة أو مخدة للرأس.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: أما هو فكان
  rationale: يحفظ بروز الضمير وقوته التقابلية في السياق، بصياغة عربية طبيعية.
- source_word: ἐν τῇ πρύμνῃ
  choice: في مؤخر القارب
  rationale: ينقل موضع مؤخرة المركب بدقة وبلغة واضحة للقارئ العام.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: على الوسادة
  rationale: اللفظ اليوناني يدل على وسادة، ولا يصرّح بأن رأسه كان عليها، لذلك لم تُضف هذه التفاصيل.
- source_word: καθεύδων
  choice: نائمًا
  rationale: ينقل الحال المستمرة التي كان عليها يسوع آنذاك بصياغة عربية موجزة.
- source_word: ἐγείρουσιν
  choice: فأيقظوه
  rationale: المضارع التاريخي اليوناني يُنقل هنا بالماضي بما يلائم السرد العربي.
- source_word: λέγουσιν
  choice: وقالوا له
  rationale: نُقل المضارع التاريخي بالماضي وفق الأسلوب السردي العربي الطبيعي.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: ترجمة مباشرة للنداء، من غير إدخال معنى «السيد» غير المصرح به في اللفظ.
- source_word: οὐ μέλει σοι
  choice: أما يهمّك
  rationale: يحفظ السؤال الاستنكاري الحاد ونبرة العتاب، مع تعبير عربي طبيعي.
- source_word: ἀπολλύμεθα
  choice: أننا نهلك
  rationale: يحفظ معنى الهلاك الوشيك وشدة الخطر، من غير حصره في صياغة تفسيرية مثل «سنموت».
theological_decisions:
- issue: حدة سؤال التلاميذ ليسوع
  choice: «أما يهمّك أننا نهلك؟»
  alternative: «ألا تبالي بأننا نهلك؟» أو صياغة ألطف مثل «ألا يعني لك شيئًا أننا نوشك أن نموت؟»
  rationale: الصياغة المختارة تحفظ العتاب والهلع في الأصل من غير أن تحكم على دوافع يسوع أو تفسّر إيمان التلاميذ.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «مؤخر القارب» بدل المصطلح البحري الأقل تداولًا «المؤخرة»، وحُفظت حدة السؤال مع تجنب التفسير العقائدي.
