  source_fidelity: 'النص العربي أمين للنص اليوناني: حافظ على إبراز «هو» في αὐτὸς، وعلى تحديد الموضع في مؤخر القارب، وعلى معنى النوم فوق الوسادة، وعلى نبرة السؤال العاتبة الملحّة في «أما يهمّك أننا نهلك؟». كما أن «نهلك» تنقل ἀπολλύμεθα من غير تضييقها إلى الموت وحده.'
  naturalness: الصياغة فصيحة حديثة وواضحة. «أما هو فكان» تؤدي وظيفة المقابلة والتوكيد، و«في مؤخر القارب» عبارة مفهومة ودقيقة، وتسلسل السرد بالماضي طبيعي في العربية.
