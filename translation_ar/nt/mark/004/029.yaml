base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: ar
  text: لكن عندما يصبح المحصول جاهزًا[a]، يرسل المنجل فورًا، لأن الحصاد قد حان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نضج». وحرفيًا: «سلَّم [نفسه]» أو «أعطى». يستعمل النص اليوناني تعبيرًا نشطًا غير مألوف، يكون فيه «المحصول» هو الفاعل؛ والمعنى في السياق أنه صار صالحًا للحصاد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ولكن متى
  rationale: تؤدي ὅταν معنى الزمن غير المحدد، بينما تحمل δέ انتقالًا خفيفًا مع شيء من المقابلة؛ وهذه الصياغة واضحة وتناسب سياق المثل.
- source_word: παραδοῖ
  choice: صار ... جاهزًا
  rationale: الفعل يعني في الأصل «يسلّم» أو «يدفع»، لكنه هنا تعبير نشط غير مألوف والمحصول فاعله، ويدل سياقيًا على أنه بلغ حالًا تتيح حصاده. تُحفظ غرابة الأصل في الحاشية دون إثقال المتن.
- source_word: ὁ καρπός
  choice: المحصول
  rationale: مع أن καρπός قد يعني «الثمر»، فإن ذكر المنجل والحصاد يجعل «المحصول» أنسب للصورة الزراعية، من غير تخصيصه بالحبوب وحدها.
- source_word: εὐθὺς
  choice: فورًا
  rationale: تنقل سرعة الفعل التي تميز استعمال مرقس، بعبارة عربية طبيعية موجزة.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: يُعمل فيه المنجل
  rationale: اليونانية تقول حرفيًا «يرسل المنجل»، وهو تعبير عن الشروع في الحصاد. الصياغة العربية المختارة طبيعية وتحفظ صورة إدخال المنجل إلى المحصول، مع تجنب الإيحاء بإرسال المنجل مستقلًا.
- source_word: ὅτι
  choice: لأن
  rationale: تبيّن سبب البدء الفوري في الحصاد بوضوح.
- source_word: παρέστηκεν
  choice: قد حان
  rationale: صيغة التام تفيد أن الحصاد أتى وصار حاضرًا؛ و«قد حان» تؤدي هذا المعنى طبيعيًا في العربية.
- source_word: ὁ θερισμός
  choice: الحصاد
  rationale: مقابل عربي مباشر وواسع الدلالة، يلائم فعل المنجل والسياق الزراعي.
theological_decisions:
- issue: دلالة جاهزية المحصول في مثل عن ملكوت الله
  choice: الإبقاء على الصورة الزراعية من غير تعيين مرجع الحصاد اللاهوتي
  alternative: تفسير الحصاد صراحة بأنه الدينونة أو اكتمال الملكوت أو عمل الرسالة
  rationale: النص نفسه لا يحدد في هذه الآية المقصود اللاهوتي التفصيلي من الحصاد؛ لذلك تحافظ الترجمة على التوتر المجازي ولا تفرض تفسيرًا مذهبيًا.
- issue: غرابة التعبير النشط παραδοῖ والمحصول فاعله
  choice: صياغة المعنى الطبيعي في المتن مع توثيق الحرفية في الحاشية
  alternative: 'ترجمته حرفيًا: «سلّم المحصول نفسه»'
  rationale: الحرفية الصارمة مبهمة في العربية، أما «صار المحصول جاهزًا» فتنقل المعنى السياقي، والحاشية تحفظ سمة التعبير اليوناني غير المعتادة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. اختير المبني للمجهول في «يُعمل فيه المنجل» لأن الفاعل البشري مفهوم من سياق المثل، ولتأدية العبارة الزراعية بصورة طبيعية من غير تجسيد المنجل تجسيدًا مربكًا.
