reference: Mark 4:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: ar
  text: وَهَؤُلَاءِ هُمُ الَّذِينَ عَلَى جَانِبِ الطَّرِيقِ، حَيْثُ تُزْرَعُ الْكَلِمَةُ؛ وَعِنْدَمَا يَسْمَعُونَ، يَأْتِي الشَّيْطَانُ فَوْرًا وَيَأْخُذُ الْكَلِمَةَ الَّتِي زُرِعَتْ فِيهِمْ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الَّتِي زُرِعَتْ دَاخِلَهُمْ».'
    reason: بديل تعبيري يبيّن دلالة التوجّه إلى الداخل الممكنة في εἰς αὐτούς، مع بقاء «فيهم» الترجمة العربية الطبيعية في المتن.
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν
  choice: وَهَؤُلَاءِ هُمُ
  rationale: تحافظ الواو على الصلة الخفيفة بالسياق، ويؤدي ضمير الفصل وظيفة التعريف والتعيين في شرح المثل.
- source_word: οἱ παρὰ τὴν ὁδόν
  choice: الَّذِينَ عَلَى جَانِبِ الطَّرِيقِ
  rationale: تنقل العبارة موقع البذار بمحاذاة الطريق، وفي الوقت نفسه تُظهر أن شرح المثل يشير إلى أشخاص.
- source_word: σπείρεται ὁ λόγος
  choice: تُزْرَعُ الْكَلِمَةُ
  rationale: يحافظ المبني للمجهول على صيغة اليونانية، وتُبقي «الكلمة» تكرار اللفظ المحوري في المثل مع دلالته على الكلمة المعلنة.
- source_word: ὅταν ἀκούσωσιν
  choice: فَمَتَى سَمِعُوا
  rationale: تنقل «متى» الدلالة الزمنية العامة للتركيب، والصياغة عربية واضحة وطبيعية.
- source_word: εὐθύς
  choice: فَوْرًا
  rationale: تنقل الإلحاح والفورية المميزين لاستعمال مرقس لهذا الظرف.
- source_word: ὁ Σατανᾶς
  choice: الشَّيْطَانُ
  rationale: هذا هو المقابل العربي المألوف للاسم/اللقب الشخصي في العهد الجديد، ولا يحوّله إلى مفهوم مجرد.
- source_word: αἴρει
  choice: يَأْخُذُ
  rationale: يعبر عن الإزالة والأخذ من غير إضافة معنى الخطف العنيف الذي لا يقتضيه الفعل بالضرورة.
- source_word: τὸν λόγον τὸν ἐσπαρμένον εἰς αὐτούς
  choice: الْكَلِمَةَ الَّتِي زُرِعَتْ فِيهِمْ
  rationale: يحافظ على تكرار «الكلمة» وعلى صورة الزرع، ويؤدي «فيهم» المعنى الداخلي المرجح لحرف الجر εἰς هنا، مع إثبات البديل الممكن في الحاشية.
theological_decisions:
- issue: الفاعلية الشخصية للشيطان في شرح المثل
  choice: إبقاء الشيطان فاعلًا شخصيًا يأتي ويأخذ الكلمة
  alternative: صياغته بوصفه «الخصم» أو قوة شر مجردة
  rationale: تستعمل اليونانية الاسم/اللقب معرفًا وتعرضه فاعلًا شخصيًا؛ لذلك لا ينبغي للتـرجمة أن تجرّد العبارة من هذا البعد.
- issue: موضع زرع الكلمة بالنسبة إلى السامعين
  choice: التي زُرعت فيهم
  alternative: التي زُرعت داخلهم
  rationale: يحفظ «فيهم» صورة التلقي الداخلي من غير أن يضيف تحديدًا مثل «في قلوبهم»، بينما يوضح البديل في الحاشية قوة الاتجاه أو الدخول الممكنة في εἰς.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع ضبط كامل للنص. استُعملت «على جانب الطريق» بدل تعبير حرفي أثقل، وحُفظ تكرار «الكلمة» وصورة الزرع والبناء التفسيري للمثل.
