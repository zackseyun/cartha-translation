  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: ar
  text: 'وكان يعلّمهم أشياء كثيرة بالأمثال[a]، وكان يقول لهم في تعليمه:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكان يعلّمهم كثيرًا بالأمثال». يمكن أن تعني الكلمة اليونانية πολλά «أشياء كثيرة» أو، باختصار، «كثيرًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: كان يعلّم
  rationale: صيغة الماضي الناقص تصوّر التعليم فعلًا مستمرًا في المشهد، وتركيب «كان يعلّم» ينقل هذا الجانب بوضوح.
- source_word: ἐν παραβολαῖς
  choice: بالأمثال
  rationale: الباء العربية تعبّر طبيعيًا عن الوسيلة أو الأسلوب، فتحافظ على معنى ἐν مع المجرور هنا دون تكلّف.
- source_word: πολλά
  choice: أشياء كثيرة
  rationale: الصفة المحايدة في صيغة الجمع تؤدي هنا معنى ما كان يعلّمه؛ و«أشياء كثيرة» واضحة وطبيعية، مع بقاء احتمال المعنى الأوجز «كثيرًا» في الحاشية.
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: يحافظ هذا التركيب على دلالة الماضي الناقص وعلى امتداد القول إلى الكلام المباشر الآتي.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: في تعليمه
  rationale: ترجمة قريبة وواضحة تحفظ تركيب الأصل، وتربط القول بمضمون تعليمه وسياقه.
- source_word: καὶ
  choice: و
  rationale: حُفظ حرف العطف لإبقاء الاستمرار السردي والأسلوب العطفي المميز لمرقس.
- source_word: αὐτοὺς / αὐτοῖς
  choice: هم / لهم
  rationale: «هم» مفعول به مع فعل التعليم، و«لهم» تنقل صيغة المجرور غير المباشر مع فعل القول.
