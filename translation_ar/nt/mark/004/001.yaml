  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: ar
  text: وبدأ أيضًا يعلِّم بجانب البحر. فتجمَّع إليه جمع غفير جدًا[a]، حتى إنه صعد إلى قارب وجلس فيه على الماء[b]، وكان الجمع كله على البر بمحاذاة البحر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فيتجمَّع إليه جمع غفير جدًا»؛ فكثيرًا ما يستخدم مرقس المضارع التاريخي لإضفاء الحيوية على السرد.'
    reason: lexical_alternative
  - marker: b
    text: أي إنه جلس في القارب على الماء، بينما بقي الجمع على البر.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: أيضًا
  rationale: تفيد تكرار نشاط يسوع التعليمي، و«أيضًا» طبيعية في هذا السياق السردي.
- source_word: ἤρξατο διδάσκειν
  choice: بدأ يعلِّم
  rationale: تحافظ على دلالة البدء في التركيب اليوناني من غير إطناب.
- source_word: παρὰ τὴν θάλασσαν
  choice: بجانب البحر
  rationale: تنقل معنى الموقع بمحاذاة البحر، وتُبقي لفظ «البحر» كما في المصدر بدل تفسيره ببحيرة الجليل.
- source_word: συνάγεται
  choice: فتجمَّع
  rationale: المضارع هنا مضارع تاريخي شائع عند مرقس؛ صيغ الماضي العربية أنسب لاتساق السرد، مع بيان البديل في الحاشية.
- source_word: ὄχλος πλεῖστος
  choice: جمع غفير جدًا
  rationale: تحفظ قوة صيغة التفضيل وتأتي بعبارة عربية واضحة وطبيعية.
- source_word: πρὸς αὐτόν
  choice: إليه
  rationale: تدل على حركة الجمع نحو يسوع بصورة موجزة ومباشرة.
- source_word: ὥστε
  choice: حتى إن
  rationale: تعبّر طبيعيًا عن النتيجة المترتبة على ضخامة الجمع.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: صعد إلى قارب
  rationale: تنقل فعل دخول القارب بصياغة عربية مألوفة في سياق ركوب القوارب.
- source_word: πλοῖον
  choice: قارب
  rationale: لفظ حديث واضح يناسب المركب المقصود من غير إضافة حجم لا يصرح به النص.
- source_word: καθῆσθαι
  choice: جلس فيه
  rationale: تحفظ الفعل، وإضافة الضمير توضّح أن الجلوس كان في القارب ولا تغيّر المعنى.
- source_word: ἐν τῇ θαλάσσῃ
  choice: على الماء
  rationale: تؤدي المعنى المكاني الطبيعي للقارب، وتتجنب الإيحاء بأن يسوع كان جالسًا مباشرة على سطح البحر.
- source_word: πᾶς ὁ ὄχλος ... ἐπὶ τῆς γῆς
  choice: كان الجمع كله على البر
  rationale: تحفظ شمول الجمع وتقابل موقعه على اليابسة بموقع يسوع في القارب.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي انسياب السرد العربي، مع الحفاظ في الحاشية على احتمال تمثيل المضارع التاريخي، وتوضيح عبارة الموقع في البحر بما يمنع اللبس من غير تحميل النص تفسيرًا لاهوتيًا.
