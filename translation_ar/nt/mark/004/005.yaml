  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «البذار» للدلالة الجماعية على ما ألقاه الزارع، و«أرض صخرية» مع حاشية لتوضيح أن الصورة هي طبقة تراب ضحلة فوق الصخر.
