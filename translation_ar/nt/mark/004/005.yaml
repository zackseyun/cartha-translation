base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: ar
  text: ووقع بذارٌ آخر على أرضٍ صخرية[a]، حيث لم تكن فيها تربةٌ كثيرة، فنبت في الحال لعدم عمق التربة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أرض حجرية». يصف اللفظ اليوناني أرضًا صخرية لا تغطي الصخرَ فيها إلا طبقة رقيقة من التربة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: بعضُ البذار
  rationale: الصفة المحايدة المفردة مستعملة اسميًا، والمقصود ضمنًا شيء آخر من البذار المذكور في سياق المثل؛ أُظهر المحذوف لتتضح العربية.
- source_word: πετρῶδες
  choice: أرضٍ صخرية
  rationale: يدل اللفظ على موضع صخري تغطيه طبقة رقيقة من التراب، لا على أرض فيها حجارة متناثرة فحسب.
- source_word: γῆν πολλήν
  choice: تراب كثير
  rationale: γῆ هنا هو التراب الصالح للنمو، لا الأرض بمعناها الواسع.
- source_word: εὐθὺς
  choice: في الحال
  rationale: ينقل معنى سرعة الإنبات مباشرةً بلغة عربية واضحة وطبيعية.
- source_word: ἐξανέτειλεν
  choice: نبت
  rationale: الفعل في السياق الزراعي يعني خرج النبات أو برعم؛ و«نبت» موجز وطبيعي.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: لأن التراب لم يكن عميقًا
  rationale: تركيب διά مع المصدر المعرّف يفيد السببية، وتحويله إلى جملة فعلية يصوغ المعنى بوضوح مع حفظ صورة ضحالة التراب.
- source_word: ὅπου
  choice: حيث
  rationale: ينقل الظرف الموصول المكاني مباشرةً ويربط وصف الموضع بما قبله بسلاسة.
