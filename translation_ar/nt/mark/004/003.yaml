  text: اِسمعوا! ها إنّ الزارع خرج ليزرع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούετε
  choice: اِسمعوا!
  rationale: فعل أمر مضارع موجَّه إلى الجمع، ويؤدي هنا وظيفة التنبيه والحث على الإصغاء؛ و«اِسمعوا» صياغة عربية مباشرة تحفظ قوة الأمر.
- source_word: ἰδού
  choice: ها إنّ
  rationale: أداة تنبيه تلفت الانتباه إلى ما يلي. و«ها إنّ» تعبير عربي فصيح وطبيعي يحفظ القوة السردية للأداة من غير تكلف.
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: فعل ماضٍ يدل على الحركة إلى الخارج؛ و«خرج» هو المقابل العربي المباشر والطبيعي في السياق.
- source_word: ὁ σπείρων
  choice: الزارع
  rationale: اسم فاعل مع أداة التعريف مستعمل استعمال الاسم للدلالة على صاحب الدور؛ و«الزارع» واضح وموجز وطبيعي.
- source_word: σπεῖραι
  choice: ليزرع
  rationale: 'مصدر يوناني يعبّر عن الغرض بعد «خرج»، وتقابله في العربية لام التعليل مع المضارع: «ليزرع».'
