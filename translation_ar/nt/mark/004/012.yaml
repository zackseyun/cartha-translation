  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: ar
  text: لكي وهم ينظرون ينظروا ولا يدركوا[a]، وهم يسمعون يسمعوا ولا يفهموا[c]، لئلا يرجعوا[b] ويُغفر لهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يميّزوا» أو «يبصروا حقًا».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة «يرجعوا»: «يعودوا»، وهي في هذا السياق قد تحمل معنى «يتوبوا».'
    reason: lexical_alternative
  - marker: c
    text: يردّد يسوع هنا صدى إشعياء 6:‏9–10، مبقيًا التوتر بين الدينونة الإلهية وإخفاق الشعب في الاستجابة.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تحافظ على دلالة الغاية أو النتيجة في اليونانية من غير تلطيف الصياغة الصعبة.
- source_word: βλέποντες βλέπωσι
  choice: ينظروا نظرًا
  rationale: يحافظ المفعول المطلق على تكرار فعل النظر وقوته البلاغية في صياغة عربية موجزة ومفهومة.
- source_word: ἴδωσιν
  choice: يدركوا
  rationale: يميّز بين مجرد النظر وبين الرؤية التي تنفذ إلى المعنى، مع إبقاء احتمال معنى الإبصار الحقيقي في الحاشية.
- source_word: ἀκούοντες ἀκούωσι
  choice: يسمعوا سمعًا
  rationale: يحافظ على التكرار المؤكد ذي النبرة السامية الذي يردّد صدى إشعياء.
- source_word: συνιῶσιν
  choice: يفهموا
  rationale: لفظ عربي واضح وطبيعي يدل على الفهم العقلي والروحي من غير زيادة تفسيرية.
- source_word: μήποτε
  choice: لئلا
  rationale: تنقل القوة الاستشرافية السلبية للفظ اليوناني في أسلوب فصيح ومألوف.
- source_word: ἐπιστρέψωσιν
  choice: يرجعوا
  rationale: يحافظ على صورة الرجوع اللفظية، ولا يحصرها في المصطلح التفسيري «يتوبوا».
- source_word: ἀφεθῇ αὐτοῖς
  choice: يُغفر لهم
  rationale: تحافظ الصيغة المبنية للمجهول على المبني للمجهول الإلهي، من غير التصريح بفاعل لم يذكره النص.
theological_decisions:
- issue: دلالة الغاية أو النتيجة في اقتباس يسوع من إشعياء وما ينشأ عنها من توتر بين الدينونة الإلهية وعدم استجابة الناس
  choice: لكي ... لئلا
  alternative: حتى تكون النتيجة أنهم ... وإلا فقد يرجعون
  rationale: تُبقي الصياغة على قوة العبارة اليونانية وعلى توترها اللاهوتي، ولا تحولها إلى وصف مخفف أو تحسم كيفية اجتماع الدينونة الإلهية مع مسؤولية السامعين.
- issue: دلالة ἐπιστρέψωσιν وصلتها بالتوبة
  choice: يرجعوا
  alternative: يتوبوا
  rationale: «يرجعوا» أقرب إلى الصورة اللفظية الواسعة في الأصل، في حين تُذكر دلالة التوبة السياقية في الحاشية.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدم المفعول المطلق في «ينظروا نظرًا» و«يسمعوا سمعًا» لنقل التكرار البلاغي في الأصل من غير تركيب عربي متكلف، وأُبقي المبني للمجهول في «يُغفر لهم».
