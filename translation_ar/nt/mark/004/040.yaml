  source_fidelity: 'ينقل النص معنى السؤالين في اليونانية نقلًا جيدًا، ويحافظ على «الإيمان» مقابل πίστις وعلى البديل السياقي «الثقة». لكن تركيب «أما عندكم إيمان بعد؟» قد يُفهم في العربية المعاصرة أيضًا بمعنى «هل بقي عندكم إيمان/هل لديكم إيمان بعد الآن؟»، وهو ما قد يضعف دلالة οὔπω الزمنية المحددة: «ليس بعد».'
