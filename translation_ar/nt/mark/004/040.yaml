lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: أداة عطف تربط قول يسوع بما سبقه في السرد، ويؤديها العطف البسيط أداءً طبيعيًا.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: صياغة عربية مألوفة وشفافة لإدخال الكلام المباشر، مع نقل ضمير المخاطَبين بصيغة الجمع.
- source_word: Τί
  choice: لماذا
  rationale: تأتي هنا استعمالًا استفهاميًا مع الصفة والفعل «تكونون»، فتفيد السؤال عن سبب حالهم لا السؤال عن ماهيتها.
- source_word: δειλοί
  choice: خائفون
  rationale: يناسب خوف التلاميذ في العاصفة ويحفظ قوة التوبيخ دون أن يحوّله بالضرورة إلى حكم ثابت على شخصياتهم. أما المعنى الأقوى «جبناء» فمحفوظ في الحاشية.
- source_word: ἐστε
  choice: أنتم
  rationale: تُفهم دلالة فعل الكينونة في الجملة الاسمية العربية، وأُثبت الضمير لإبراز المخاطَبين طبيعيًا.
- source_word: οὔπω
  choice: أما ... بعد
  rationale: تركيب استفهامي عربي طبيعي ينقل معنى «ليس بعد» مع نبرة التوبيخ والتوقع الكامنة في السؤال.
- source_word: ἔχετε
  choice: عندكم
  rationale: تعبير عربي فصيح وطبيعي عن امتلاك الإيمان أو وجوده لديهم.
- source_word: πίστιν
  choice: إيمان
  rationale: المقابل المباشر والمألوف للاسم اليوناني، مع إبقاء «ثقة» بديلًا سياقيًا في الحاشية.
theological_decisions:
- issue: دلالة πίστις في سياق الخوف من العاصفة
  choice: إيمان
  alternative: ثقة
  rationale: يحافظ «إيمان» على المصطلح اليوناني دون تحديد مفعوله الضمني أو تضييق دلالته، بينما يوضح «ثقة» بُعد الاتكال الملائم للسياق، ولذلك ذُكر في الحاشية.
- issue: قوة التوبيخ في δειλοί
  choice: خائفون
  alternative: جبناء
  rationale: السياق يتناول خوف التلاميذ في الخطر، و«خائفون» ينقل ذلك بوضوح. لكن اللفظة اليونانية قد تحمل توبيخًا أقوى بمعنى الجبن، فحُفظ هذا الاحتمال بدل إسقاطه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية موقرة. استُخدمت الجملة الاسمية «أنتم خائفون» والتركيب «أما عندكم ... بعد؟» ليأتي التوبيخ طبيعيًا ومفهومًا، مع حفظ البدائل الدلالية في الحواشي.
