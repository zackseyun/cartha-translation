  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: ar
  text: ولمّا كان على انفراد[a]، كان الذين حوله مع الاثني عشر يسألونه عن الأمثال.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وحده». تدل العبارة على أن الأمر كان في موضع خاص، ولا تستلزم أنه لم يكن معه أحد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: ولمّا
  rationale: تنقل أداة الربط καί مع الظرف الزمني ὅτε في صياغة عربية طبيعية تحافظ على تتابع السرد عند مرقس.
- source_word: ἐγένετο κατὰ μόνας
  choice: كان على انفراد
  rationale: تعبير عربي طبيعي يدل على وجوده في مكان خاص بعيدًا عن الجموع، ولا يقتضي بالضرورة غياب جميع أتباعه عنه.
- source_word: ἠρώτων
  choice: أخذوا يسألونه
  rationale: تنقل الصيغة الناقصة في اليونانية بوصفها فعلًا مستمرًا أو متكررًا، من غير المبالغة التي قد يوحي بها «ظلّوا يلحّون عليه».
- source_word: οἱ περὶ αὐτὸν
  choice: الذين حوله
  rationale: تحافظ على التعبير اليوناني الذي يشير إلى دائرة أوسع من أتباع يسوع، من غير حصرهم في الاثني عشر أو جعل العبارة مجرد وصف للموقع المكاني.
- source_word: σὺν τοῖς δώδεκα
  choice: مع الاثني عشر
  rationale: تنقل معنى المصاحبة وتحافظ على التمييز النحوي بين المجموعة المحيطة بيسوع والاثني عشر.
- source_word: τὰς παραβολάς
  choice: الأمثال
  rationale: تحافظ على صيغة الجمع الواردة في النص اليوناني، وتشير إلى تعليمه بالأمثال في هذا السياق.
theological_decisions:
- issue: هوية الذين سألوا يسوع
  choice: دائرة أوسع من أتباع يسوع، ومعهم الاثنا عشر، هي التي سألته.
  alternative: أن يكون الاثنا عشر وحدهم هم الذين سألوه، أو أن تكون جماعة خاصة منفصلة عنهم.
  rationale: التركيب οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα يميز طبيعيًا بين الذين حوله والاثني عشر ثم يجمعهم في فعل السؤال؛ لذلك لم تُختزل الجماعة في الاثني عشر وحدهم.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة، مع الحفاظ على إيقاع مرقس السردي. استُعمل «على انفراد» لتجنب التناقض الظاهري بين «وحده» ووجود أتباعه معه، وأُبقي التمييز بين الدائرة الأوسع من الأتباع والاثني عشر.
