  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: ar
  text: فَلَيْسَ شَيْءٌ خَفِيًّا إِلَّا لِيُكْشَفَ، وَلَا صَارَ شَيْءٌ مَكْتُومًا إِلَّا لِيَظْهَرَ لِلْعِيَانِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارتين بما يفيد النتيجة: «فليس شيء خفيًّا إلا أنه سيُكشف، ولا صار شيء مكتومًا إلا أنه سيظهر للعيان». فالعبارتان اليونانيتان اللتان تتضمنان ἵνα تحتملان دلالة الغاية أو النتيجة.'
    reason: alternative_reading
lexical_decisions:
- source_word: κρυπτόν
  choice: خَفِيًّا
  rationale: ينقل معنى الشيء المستور أو غير الظاهر، من غير أن يضيف إيحاءً لازمًا بالتعمّد في إخفائه.
- source_word: ἐὰν μὴ ἵνα
  choice: إِلَّا لِـ
  rationale: يحفظ تركيب الاستثناء مع دلالة الغاية بإيجاز عربي طبيعي، مع بقاء احتمال اقتراب ἵνα من معنى النتيجة.
- source_word: φανερωθῇ
  choice: لِيُكْشَفَ
  rationale: يحفظ صيغة المبني للمجهول ومعنى جعل المستور ظاهرًا أو معلومًا.
- source_word: ἐγένετο ἀπόκρυφον
  choice: صَارَ ... مَكْتُومًا
  rationale: «صار» تعكس الانتقال إلى حالة، و«مكتومًا» تميّز اللفظ عن κρυπτόν مع إبقاء التوازي الدلالي.
- source_word: ἔλθῃ εἰς φανερόν
  choice: لِيَظْهَرَ لِلْعِيَانِ
  rationale: عبارة عربية واضحة تحفظ معنى الوصول إلى حالة الظهور العلني، وإن لم تنقل صورة الحركة حرفيًا.
- source_word: γάρ
  choice: فَـ
  rationale: تصل القول بما قبله بوصفه تعليلًا أو تفسيرًا، وهي أنسب أداة موجزة في السياق العربي.
theological_decisions:
- issue: دلالة الغاية أو النتيجة في عبارتي ἵνα
  choice: 'صياغتهما بلام الغاية: «ليُكشف» و«ليظهر»'
  alternative: «إلا أنه سيُكشف ... إلا أنه سيظهر» بصياغة أقرب إلى النتيجة
  rationale: تدل ἵνα عادةً على الغاية، لكنها قد تقترب في اليونانية الكوينه من النتيجة. يحفظ المتن دلالة الغاية، وتوضح الحاشية الاحتمال الآخر من غير تقرير سبب لاهوتي غير مصرح به.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التوازي بين شطري القول مع تنويع «خفيًّا/مكتومًا» و«يُكشف/يظهر للعيان»، وحُفظت أداة الربط γάρ بالفاء.
