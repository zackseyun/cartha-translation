  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: ar
  text: ولمّا طلعت الشمس، لفحته الشمس، ولأنه لم يكن له جذر، ذبل[a].
  philosophy: optimal-equivalence
  footnotes:
