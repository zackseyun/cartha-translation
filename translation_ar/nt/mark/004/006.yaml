lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: ولمّا أشرقت الشمس
  rationale: صياغة عربية طبيعية تحفظ أداة الربط والجملة الزمنية، وتؤدي معنى طلوع الشمس بوضوح.
- source_word: ἐκαυματίσθη
  choice: لفحته حرارتها
  rationale: ينقل أثر حرارة الشمس المؤذي من غير المبالغة التي قد يوحي بها «احترق»، مع تحويل المبني للمجهول إلى تركيب عربي طبيعي.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: ولأنه لم يكن له جذر
  rationale: يحفظ العلاقة السببية وصيغة المفرد في «جذر»، بلغة واضحة ومباشرة.
- source_word: ἐξηράνθη
  choice: ذبل
  rationale: يؤدي معنى جفاف النبات وذبوله في هذا السياق الزراعي، مع إبقاء البديل المعجمي «يبس» في الحاشية.
