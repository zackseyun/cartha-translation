  source_fidelity: 'النص العربي أمين للأصل اليوناني: «وكان يقول» ينقل الماضي الناقص ἔλεγεν، و«مَن له أذنان للسمع، فليسمع» يحفظ البنية العامة والأمر للمفرد والتكرار اللفظي المرتبط بالسمع. لا يضيف الترجمة معنى زمنيًا أو تفسيريًا غير موجود في الأصل.'
  naturalness: الصياغة فصيحة حديثة وواضحة، مع نبرة حكمية مناسبة للسياق. تعبير «أذنان للسمع» مألوف وطبيعي في العربية الكتابية والفصحى، و«فليسمع» مناسب لأمر الغائب.
  terminology: اختيار «مَن» عام وغير مقيّد بجنس، مع المحافظة على مفرد الأصل في «فليسمع». واستعمال المثنى «أذنان» عربي سليم للتعبير عن زوج الأذنين الذي تعبّر عنه اليونانية بالجمع. الحاشية تقدّم بديلًا شكليًا مقبولًا دون تغيير المعنى.
