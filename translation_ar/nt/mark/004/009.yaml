  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: ar
  text: 'وكان يقول: «مَن له أذنان للسمع، فليسمع».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصياغة أكثر حرفية: «الذي له أذنان ليسمع، فليسمع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: أداة ربط بسيطة تحفظ اتصال القول بالسياق من غير إضافة دلالة زمنية غير مصرّح بها.
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: تحفظ صيغة الماضي الناقص واستمرارية الحدث أو خلفيته، من غير المبالغة في معنى التكرار.
- source_word: Ὃς ἔχει
  choice: مَن له
  rationale: تنقل التركيب الموصول ذا الدلالة العامة بصياغة عربية طبيعية موجزة، من غير حصره في ذكر بعينه.
- source_word: ὦτα
  choice: أذنان
  rationale: يحفظ المثنى العربي العدد المقصود طبيعيًا، إذ تشير صيغة الجمع اليونانية في هذا التعبير إلى أذني الإنسان.
- source_word: ἀκούειν
  choice: للسمع
  rationale: تعبير عربي طبيعي يحفظ الصلة بالغرض ويحافظ على تكرار جذر السمع مع فعل الأمر التالي.
- source_word: ἀκουέτω
  choice: فليسمع
  rationale: ينقل أمر الغائب المفرد ويحفظ الصدى اللفظي مع «للسمع».
theological_decisions:
- issue: الصيغة المذكرة المفردة ذات الدلالة العامة في القول الحكمي
  choice: مَن له أذنان للسمع، فليسمع
  alternative: الذي له أذنان للسمع، فليسمع
  rationale: «مَن» عامة بطبيعتها في العربية وتشمل كل مخاطَب، بينما يبقى فعل الأمر مفردًا وفق بنية الأصل من غير إدخال تخصيص جنسي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظ الماضي الناقص في «كان يقول»، وبنية القول الحكمية، والتكرار الاشتقاقي لجذر «سمع».
