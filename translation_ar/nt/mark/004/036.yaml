  text: καὶ ἀφέντες τὸν ὄχλον παραλαμβάνουσιν αὐτὸν ὡς ἦν ἐν τῷ πλοίῳ, καὶ ἄλλα ⸀πλοῖα ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: ar
  text: ولما تركوا الجمع، أخذوه معهم كما كان في القارب، وكانت قوارب أخرى معه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: ولما تركوا
  rationale: اسم الفاعل الماضي يدل على فعل سبق الفعل الرئيس؛ وهذه الصياغة العربية الطبيعية تبين التعاقب من غير أن تفترض أنهم صرفوا الجمع رسميًا.
- source_word: τὸν ὄχλον
  choice: الجمع
  rationale: يدل اللفظ على جماعة الناس المحتشدة، و«الجمع» تعبير عربي واضح ومألوف في السياق السردي.
- source_word: παραλαμβάνουσιν αὐτὸν
  choice: أخذوه معهم
  rationale: الفعل يعني أخذ شخص بصحبة الفاعلين أو اصطحابه، وإضافة «معهم» تنقل هذا المعنى.
- source_word: ὡς ἦν
  choice: كما كان
  rationale: تحافظ العبارة على إيجاز اليونانية واحتمال دلالتها على أخذه من غير إعداد إضافي.
- source_word: ἐν τῷ πλοίῳ
  choice: في القارب
  rationale: «القارب» أنسب من «السفينة» لحجم المركب في سياق بحيرة الجليل، والعبارة تبين أن يسوع كان فيه بالفعل.
- source_word: ἄλλα πλοῖα
  choice: قوارب أخرى
  rationale: ينقل الجمع والصفة كما وردا، من غير إضافة معنى «صغيرة» غير الموجود في النص.
- source_word: ἦν μετ’ αὐτοῦ
  choice: كانت ... معه
  rationale: استعمال المفرد مع جمع غير العاقل فصيح في العربية، و«معه» يحفظ التقرير السردي المقتضب بأن قوارب أخرى رافقته.
theological_decisions:
- issue: تعلّق العبارة ὡς ἦν ἐν τῷ πλοίῳ
  choice: كما كان في القارب
  alternative: أخذوه معهم في القارب، كما كان
  rationale: أُبقي ترتيب العبارة قريبًا من اليونانية، مع الحفاظ على إمكان فهمها بأنه كان في القارب بالفعل أو أنهم أخذوه من غير استعداد إضافي، من دون حسم ما لا يحسمه النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة، بصياغة سردية طبيعية. لم تُضف حواشٍ لأن الغموض التركيبي محفوظ في المتن نفسه، ولا توجد علامة حاشية لازمة.
