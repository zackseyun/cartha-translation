  - marker: b
    text: 'أو: «الرسالة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: آخرون
  rationale: تؤدي الصفة هنا وظيفة الاسم، وتشير إلى فئة أخرى في مقابل الفئات السابقة؛ و«آخرون» تعبير عربي طبيعي يحفظ هذا التقابل.
- source_word: εἰς τὰς ἀκάνθας
  choice: بين الأشواك
  rationale: مع أن εἰς تدل أصلًا على الاتجاه إلى الداخل، فإن «بين الأشواك» أوضح في السياق الزراعي، مع إبقاء البديل الحرفي في الحاشية.
- source_word: ἀκάνθας
  choice: الأشواك
  rationale: ترجمة مألوفة ومباشرة تحافظ على الصورة الواردة في المثل.
- source_word: σπειρόμενοι
  choice: زُرِعوا
  rationale: يحافظ المبني للمجهول على استعارة البذار التي يطابق فيها الشرح بين الناس والبذور، ويأتي الماضي العربي طبيعيًا في هذا السياق التعريفي.
- source_word: οὗτοί εἰσιν
  choice: هؤلاء هم
  rationale: ينقل صيغة الاستئناف والتعيين التي يبدأ بها تفسير هذه الفئة.
- source_word: οἱ ... ἀκούσαντες
  choice: الذين سمعوا
  rationale: ينقل اسم الفاعل الأوريستي بوصف السماع حدثًا سابقًا لما يرد لاحقًا، من غير تحميل الصيغة دلالة زمنية زائدة.
- source_word: τὸν λόγον
  choice: الكلمة
  rationale: تحفظ «الكلمة» الاصطلاح الكتابي والصلة اللفظية بسياق المثل، مع إثبات «الرسالة» بديلًا دلاليًا في الحاشية.
theological_decisions:
- issue: التعريف المجازي للناس بوصفهم بذارًا في شرح المثل
  choice: 'الإبقاء على الاستعارة الحرفية: «الذين زُرِعوا بين الأشواك»'
  alternative: الذين زُرعوا في أرض كثيرة الأشواك
  rationale: النص اليوناني يواصل صورة البذار نفسها ولا يفككها إلى شرح غير مجازي؛ لذلك يحفظ هذا الاختيار البنية الأدبية والتوتر المجازي من غير إضافة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تركيب المثل وصيغة المبني للمجهول، واستُخدمت «زُرِعوا» لأنها طبيعية مع البذار في العربية، مع إبقاء علامات الحواشي [a] و[b] في موضعيهما.
