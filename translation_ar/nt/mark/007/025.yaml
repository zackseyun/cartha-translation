  source_fidelity: 'ينقل النص عناصر اليونانية كلها: الاستدراك، والفورية المرتبطة بسماع الخبر، والابنة بصيغة التصغير، و«الروح النجس»، والمجيء، والسقوط عند قدميه. وصيغة «ما إن سمعت عنه حتى جاءت» عربية سليمة تنقل الاستجابة الفورية للسماع، وإن كانت تعيد توزيع إبراز الظرف مقارنة بترتيب اليونانية.'
  naturalness: 'الأسلوب واضح وفصيح ومناسب للسرد. لكن «امرأةً» بعد «لكن» ينبغي أن تكون مرفوعة: «امرأةٌ»، إذ هي مبتدأ الجملة الاسمية وليست منصوبة بعامل. و«عنه» أنسب في هذا السياق من «به» لمعنى «سمعت أخبارًا عنه».'
  terminology: «ابنتها الصغيرة» خيار جيد لـ θυγάτριον دون المبالغة في دلالة التصغير. و«روح نجس» يحافظ على مصطلح مرقس؛ و«ارتمت عند قدميه» ينقل فعل السقوط/الانطراح في سياق التضرع من غير فرض دلالة عبادية.
