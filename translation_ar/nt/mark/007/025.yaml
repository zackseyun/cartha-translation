base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: ar
  text: لكن امرأةٌ كانت لابنتها الصغيرة[a] روحٌ نجس[b]، ما إن سمعت عنه[c] حتى جاءت وارتمت عند قدميه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ابنتها». فكلمة θυγάτριον اليونانية صيغة تصغير لكلمة «ابنة»، وقد تدل على صغر السن أو تحمل نبرة تحبب.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «روح دنس»؛ وقد فُهم هذا التعبير تقليديًا على أنه يشير إلى شيطان.'
    reason: alternative_reading
  - marker: c
    text: 'أو، بترتيب أقرب إلى اليونانية: «لكن سرعان ما سمعت عنه امرأة كانت لابنتها الصغيرة روح نجس، فجاءت وارتمت عند قدميه».'
    reason: previous_rendering
lexical_decisions:
- source_word: ἀλλ’
  choice: لكن
  rationale: تنقل قوة الاستدراك أو الانتقال الخفيف في سياق السرد.
- source_word: εὐθὺς ἀκούσασα ... περὶ αὐτοῦ
  choice: ما إن سمعت به حتى
  rationale: صياغة عربية طبيعية تحفظ معنى السرعة والارتباط المباشر بين سماعها ومجيئها، مع إبقاء احتمال اختلاف التعلّق النحوي في الحاشية.
- source_word: γυνὴ
  choice: امرأةً
  rationale: الاسم غير معرّف في اليونانية ويقدّم شخصية جديدة في المشهد.
- source_word: θυγάτριον
  choice: ابنتها الصغيرة
  rationale: تحفظ صلة البنوة ودلالة صيغة التصغير، من غير الجزم بأن التصغير يدل حتمًا على العمر وحده.
- source_word: πνεῦμα ἀκάθαρτον
  choice: روحٌ نجس
  rationale: يحافظ على مصطلح مرقس وصورته الأصلية، بدل استبداله بالتفسير «شيطان».
- source_word: ἐλθοῦσα
  choice: جاءت
  rationale: تنقل اسم الفاعل اليوناني بفعل متتابع طبيعي في السرد العربي.
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: وارتمت عند قدميه
  rationale: تعبر عن الحركة الجسدية الملحّة والتذلل من غير زيادة تفسيرية مثل «سجدت».
theological_decisions:
- issue: ترجمة πνεῦμα ἀκάθαρτον
  choice: روح نجس
  alternative: روح دنس؛ شيطان
  rationale: الترجمة المختارة تبقي مصطلح مرقس مباشرًا وتحفظ إيحاءاته بالطهارة والنجاسة؛ أما «شيطان» فيحدد المرجع تفسيرًا بدل نقل العبارة نفسها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة «ما إن... حتى» لتجنب الترتيب المتثاقل مع الحفاظ على سرعة السرد المرقسي، وأُبقيت العبارة «روح نجس» محافظةً على المصطلح اليوناني.
