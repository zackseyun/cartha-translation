source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: ar
  text: 'لأن موسى قال: «أكرم أباك وأمك»، وقال أيضًا: «من يشتم أباه أو أمه[a] فلا بد أن يموت[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من يلعن أباه أو أمه». يمكن أن يدل الفعل اليوناني على الشتم أو التعيير أو اللعن.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فلا بد أن يُقتل». يستعمل اليوناني صيغة قانونية تعني حرفيًا: «فليمت موتًا».'
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς
  choice: موسى
  rationale: الصيغة العربية المعيارية الراسخة للاسم.
- source_word: γὰρ
  choice: لأن
  rationale: تحفظ وظيفة الأداة في تقديم تعليل لكلام يسوع السابق، وتأتي طبيعية في العربية.
- source_word: εἶπεν
  choice: قال
  rationale: فعل الإخبار البسيط والطبيعي في صيغة الاقتباس.
- source_word: Τίμα
  choice: أكرم
  rationale: ينقل صيغة الأمر ويدل على إظهار التوقير والتقدير الواجبين للوالدين.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: أباك وأمك
  rationale: يحفظ ذكر الوالدين كليهما بصياغة عربية موجزة وطبيعية.
- source_word: Ὁ κακολογῶν
  choice: من يشتم
  rationale: ينقل صيغة العموم في اسم الفاعل المعرّف، ويعبّر بوضوح عن الإساءة بالقول؛ وتُذكر سعة الدلالة في الحاشية.
- source_word: πατέρα ἢ μητέρα
  choice: أباه أو أمه
  rationale: أُثبت ضمير الغائب الذي يقتضيه السياق في العربية، مع الحفاظ على معنى البدلية في ἢ.
- source_word: θανάτῳ τελευτάτω
  choice: فلا بد أن يموت
  rationale: صياغة عربية طبيعية تحفظ الإلزام والتوكيد في العبارة القانونية من غير أن تحدد صراحةً أن الفاعل الخارجي ينفذ العقوبة.
theological_decisions:
- issue: صياغة العقوبة القانونية θανάτῳ τελευτάτω
  choice: فلا بد أن يموت
  alternative: فلا بد أن يُقتل
  rationale: الترجمة المختارة تحافظ على الصيغة اليونانية التي تسند الموت إلى المحكوم عليه، وعلى قوة الإلزام، من غير حسم ما إذا كان المقصود التعبير الصريح عن تنفيذ حكم الإعدام؛ وقد أُثبت البديل التفسيري في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «قال أيضًا» لإدخال الاقتباس الثاني بصورة طبيعية، إذ تؤدي καί هنا وظيفة وصل اقتباس آخر. وُضعت علامتا الحاشيتين عند العبارتين اللتين تتعلقان بهما مباشرة.
