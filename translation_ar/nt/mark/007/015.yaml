base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: ar
  text: ما من شيءٍ خارجَ الإنسان يستطيع، بدخوله فيه، أن ينجِّسه[a]؛ بل الأشياء التي تخرج من الإنسان هي التي تنجِّس الإنسان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يجعله غير طاهر». يمكن أن يدل الفعل اليوناني على جعل الإنسان نجسًا من جهة الطهارة، وقد تُفهم منه أيضًا دلالة أخلاقية أوسع في السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: ليس شيء
  rationale: ينقل النفي المطلق في المفرد المحايد بصياغة عربية واضحة، من غير إضافة قيد غير موجود في النص.
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: خارج الإنسان
  rationale: يحفظ صورة الخارج ومقابلتها المقصودة بما يخرج من الإنسان في الشطر الثاني.
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: الإنسان
  rationale: «الإنسان» في العربية فصيح وطبيعي للدلالة على الجنس البشري، ويحفظ المفرد التمثيلي وتكراره البلاغي.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: يدخل فيه
  rationale: صياغة عربية مباشرة تحافظ على معنى الدخول إلى الإنسان وعلى صلة اسم الفاعل بما هو خارج.
- source_word: δύναται
  choice: قادرًا أن
  rationale: يُظهر معنى الاستطاعة صراحة، مع إبقاء العبارة مترابطة وطبيعية.
- source_word: κοινῶσαι / κοινοῦντα
  choice: ينجِّسه / تنجِّس
  rationale: «ينجِّس» يلائم سياق الطهارة، ويمكن أن يشمل كذلك التلوث الأدبي؛ أما «يجعله دنسًا» فأثقل أسلوبيًا.
- source_word: ἀλλὰ
  choice: بل
  rationale: تنقل التصحيح والمقابلة القوية بين ما يدخل من الخارج وما يخرج من الإنسان.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: الأشياء التي تخرج من الإنسان
  rationale: يحفظ جمع العبارة اليونانية، وفعل الخروج، وحرف المصدر «من»، بما يقابل «خارج الإنسان» في أول الآية.
theological_decisions:
- issue: دلالة κοινόω في سياق النزاع حول الطهارة
  choice: ينجِّس
  alternative: يجعله غير طاهر
  rationale: «ينجِّس» يحفظ صلة اللفظ بالطهارة من غير حصره في النجاسة الطقسية وحدها، ويتيح بقاء امتداده الأخلاقي في السياق.
- issue: الدلالة العامة للفظ ἄνθρωπος
  choice: الإنسان
  alternative: الشخص
  rationale: «الإنسان» هو المقابل العربي الطبيعي للمفرد ذي الدلالة الجنسية العامة، ويحفظ التكرار والبنية البلاغية من غير قصر المعنى على الذكر.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظت المقابلة بين «خارج الإنسان» و«تخرج من الإنسان»، كما حُفظ تكرار «الإنسان» المقصود في الأصل. وُضع مؤشر الحاشية [a] في المتن عند موضع البديل المعجمي.
