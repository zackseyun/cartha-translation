  text: If anyone has ears to hear, let him hear.
translation:
  language: ar
  text: «مَنْ لَهُ أُذُنانِ لِلسَّماعِ، فَلْيَسْمَعْ».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية غير موجودة في أقدم المخطوطات اليونانية، ومنها السينائية والفاتيكانية من القرن الرابع، ولا في الترجمات القبطية المبكرة؛ لكنها موجودة في غالبية المخطوطات البيزنطية، وفي التقليد اللاتيني، وفي معظم الشواهد السريانية. ويرجَّح أنها إضافة نسخية لاحقة تكرر العبارة نفسها الواردة في مرقس 4:9 و4:23.
    reason: textual_critical
lexical_decisions:
- source_word: ὦτα
  choice: أُذُنان
  rationale: نقلٌ مباشر لاسم العضو الجسدي بصيغة المثنى، مع إبقاء دلالته المجازية على الاستعداد للإصغاء والفهم.
- source_word: ἀκουέτω
  choice: فَلْيَسْمَعْ
  rationale: يحافظ على صيغة الأمر للغائب المفرد وعلى التكرار البلاغي للجذر الدال على السماع في اليونانية.
- source_word: Εἴ τις
  choice: مَنْ
  rationale: صياغة شرطية عربية طبيعية تؤدي معنى «إن كان أحد» من غير تقييد بالجنس.
theological_decisions:
- issue: الدلالة المجازية للسماع
  choice: الإبقاء على صورة الأذنين والسماع من غير تفسير داخل المتن
  alternative: فليُصغِ ويفهم
  rationale: يحفظ ذلك الصورة البلاغية والتوتر بين السماع الجسدي والاستجابة الواعية، ولا يفرض تفسيرًا لاهوتيًا بعينه.
translation_notes:
  register: عربية فصحى واضحة وموجزة ذات نبرة كتابية كريمة. استُعمل المثنى «أذنان» بحسب الأصل، وصيغة «فليسمع» للمحافظة على الأمر للغائب.
