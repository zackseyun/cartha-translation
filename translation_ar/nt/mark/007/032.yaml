  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: ar
  text: وأحضروا إليه رجلًا أصمّ يعاني صعوبة في الكلام[a]، وتوسّلوا إليه أن يضع يده عليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بعبارة أقرب إلى اللفظ: «رجلًا أصمّ ومن يعسر عليه الكلام».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: جاءوا إليه بـ
  rationale: المضارع التاريخي شائع في سرد مرقس؛ وصيغة الماضي أنسب للسرد العربي، كما أن «جاءوا إليه برجل» تؤدي معنى الإحضار بعبارة طبيعية.
- source_word: κωφόν
  choice: برجل أصمّ
  rationale: تدل الكلمة هنا على الصمم، لأن الوصف التالي يذكر عسر الكلام على نحو مستقل؛ فلا يصح دمج الوصفين في معنى «أصمّ أبكم».
- source_word: μογιλάλον
  choice: يتعسّر عليه الكلام
  rationale: تفيد الكلمة النادرة صعوبة النطق أو الكلام، لا العجز التام عنه. وهذه العبارة واضحة ولا تبالغ فتجعله أبكم.
- source_word: παρακαλοῦσιν
  choice: توسّلوا إليه
  rationale: يفيد الفعل في سياق طلب الشفاء رجاءً ملحًّا أقوى من مجرد السؤال.
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: أن يضع يده عليه
  rationale: تعبّر «أن» عن مضمون طلبهم، وتحافظ «يده» على الإفراد الوارد في اليونانية وعلى صورة اللمس للشفاء.
theological_decisions:
- issue: طبيعة إعاقة الرجل
  choice: كان الرجل أصمّ ويتعسّر عليه الكلام، لا عاجزًا عن الكلام تمامًا.
  alternative: كان أصمّ أبكم.
  rationale: يفصل النص بين κωφός وμογιλάλος، والكلمة الثانية تدل على الكلام بصعوبة لا على البكم الكامل؛ لذلك يحافظ النص العربي على هذا التمييز.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «يتعسّر عليه الكلام» لبيان الإعاقة من غير وصم أو مبالغة، وحُفظت صيغة اليد المفردة.
