source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: ar
  text: 'فقال لهم: «أحسن إشعياء إذ تنبأ عنكم، أيها المراؤون، كما هو مكتوب: «هذا الشعب يكرمني بشفتيه، أما قلبه فبعيد عني»».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تفيد الانتقال مع شيء من المقابلة بسلاسة في سياق الرد، وهو ما تؤديه الفاء العربية هنا طبيعيًا.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: نقل مباشر ومألوف للفعل مع المفعول غير المباشر.
- source_word: Καλῶς ἐπροφήτευσεν
  choice: أحسن ... إذ تنبأ
  rationale: يحفظ التقييم الإيجابي الذي يفيده Καλῶς، ويصوغه بالعربية الفصيحة الطبيعية من غير حصره في معنى الدقة وحدها.
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: عنكم، أيها المراؤون
  rationale: ينقل دلالة περί على المرجع، ويُظهر أن وصف «المراؤون» موجَّه إلى المخاطبين على سبيل البيان والنداء.
- source_word: ὡς γέγραπται ὅτι
  choice: 'كما هو مكتوب:'
  rationale: صيغة اقتباس كتابية عربية واضحة، وتقوم النقطتان مقام أداة إدخال القول.
- source_word: Οὗτος ὁ λαὸς
  choice: هذا الشعب
  rationale: يحفظ المفرد وصيغة الإشارة والنبرة النبوية للاقتباس.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: يكرمني بشفتيه
  rationale: يحافظ على الصورة الحرفية وعلى عود الضمير المفرد إلى «الشعب»، وهو طبيعي في العربية.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: أما قلبه
  rationale: يحفظ «القلب» مفردًا بوصفه مركز الباطن، ويعيد الضمير إلى «الشعب» المفرد؛ واستُعملت «أما» لإبراز المقابلة.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: فبعيد عني
  rationale: ينقل البعد العلاقي والروحي بعبارة عربية موجزة من غير تحويله إلى مسافة مكانية محضة.
theological_decisions:
- issue: تطبيق اقتباس إشعياء 29:13 على مخاطبي يسوع
  choice: 'الإبقاء على الاتهام المباشر: «عنكم، أيها المراؤون» وعلى عبارة «هذا الشعب»'
  alternative: تلطيف العبارة أو تعميمها بحيث لا تعود إدانة مباشرة للمخاطبين
  rationale: النص يطبق النبوة صراحة على المخاطبين، ولذلك ينبغي حفظ قوة المواجهة من غير إضافة تفسير مذهبي.
- issue: المقابلة بين التكريم الظاهر وبُعد القلب
  choice: الإبقاء على صورتي الشفتين والقلب وعلى المفرد الجمعي العائد إلى الشعب
  alternative: شرح الصورة بعبارات مثل «يكرمني بالكلام فقط، لكنهم لا يخلصون لي في داخلهم»
  rationale: الصور الأصلية تحمل توترًا لاهوتيًا وبلاغيًا مقصودًا بين الظاهر والباطن، فلا تُستبدل بتفسير يحسم مدلولها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الصياغة الجمعية المفردة في «هذا الشعب... بشفتيه... قلبه»، وهي سليمة وطبيعية في العربية، لذلك لا حاجة إلى حاشية بديلة.
