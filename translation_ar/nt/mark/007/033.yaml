  - marker: b
    text: 'يقول النص اليوناني: «وبعد أن تفل، لمس لسانه»؛ ولا يصرّح بأن يسوع وضع من لعابه على لسان الرجل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: فأخذه جانبًا بعيدًا عن الجمع
  rationale: ينقل معنى فصل الرجل عن الجمع بعبارة عربية طبيعية، من غير الإيحاء بالقوة أو الإكراه.
- source_word: κατ’ ἰδίαν
  choice: على انفراد
  rationale: يحفظ معنى الابتعاد عن الآخرين والخصوصية، مع إبقاء البديل الطبيعي «على حدة» في الحاشية.
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: ووضع إصبعيه في أذنيه
  rationale: «وضع» هو المقابل السياقي الطبيعي للفعل، والتثنية العربية توضح أن المقصود إصبعان وأذنان من غير إثقال العبارة بالضمائر.
- source_word: πτύσας
  choice: ثم تفل
  rationale: ينقل الفعل السابق للمس بوضوح، من غير أن يضيف أن اللعاب وُضع على لسان الرجل، وهو ما لا يصرح به اليوناني.
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: ولمس لسانه
  rationale: «لمس» هو المعنى السياقي المباشر، والضمير يعود طبيعيًا إلى الرجل.
theological_decisions:
- issue: وصف حركة يسوع في الشفاء
  choice: ذِكر التفل ولمس اللسان كما يوردهما النص، بلا تحديد لموضع اللعاب أو تفسير رمزي أو علاجي
  alternative: القول إنه وضع من لعابه على لسان الرجل، أو شرح دلالة الفعل
  rationale: النص اليوناني يقول إن يسوع تفل ثم لمس لسان الرجل، لكنه لا يصرح بأن اللعاب وُضع على اللسان ولا يشرح معنى هذه الأفعال؛ لذلك تُحفظ دقة السرد وغموضه المقصود.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الجمع» بوصفه تعبيرًا كتابيًا مفهومًا، وصيغت الأفعال بترتيب طبيعي يحفظ تسلسل الأصل من غير إضافة تفسيرية.
