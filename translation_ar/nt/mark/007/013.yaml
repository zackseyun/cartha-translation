  text: ἀκυροῦντες τὸν λόγον τοῦ θεοῦ τῇ παραδόσει ὑμῶν ᾗ παρεδώκατε· καὶ παρόμοια τοιαῦτα πολλὰ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: ar
  text: مُبطِلين[a] كلمة الله بتقليدكم الذي سلَّمتموه[b]. وتفعلون أمورًا أخرى كثيرة من هذا القبيل[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ناقضين» أو «جاعلين كلمة الله بلا مفعول».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الذي نقلتموه».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «وتفعلون أشياء كثيرة مماثلة لهذه».'
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: مُبطِلين
  rationale: اسم الفاعل يحافظ على صيغة المشاركة اليونانية واتصال الاتهام بما قبله، ويفيد جعل كلمة الله بلا نفاذ أو فاعلية.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: كلمة الله
  rationale: ترجمة مباشرة ومألوفة تحفظ الإضافة والتقابل بين كلمة الله وتقليد المخاطَبين.
- source_word: τῇ παραδόσει ὑμῶν
  choice: بتقليدكم
  rationale: الباء تعبّر طبيعيًا عن دلالة الوسيلة في صيغة المجرور اليونانية، و«تقليدكم» لا تضيف وصفًا غير موجود مثل «البشري».
- source_word: ᾗ παρεδώκατε
  choice: الذي سلَّمتموه
  rationale: يحفظ الصلة الاشتقاقية والمعنوية بين التقليد وما يُسلَّم من جيل إلى آخر، مع بقاء معنى «نقلتموه» ممكنًا.
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: أمورًا أخرى كثيرة من هذا القبيل
  rationale: صياغة عربية طبيعية تنقل الكثرة والتشابه المقصودين من العبارة اليونانية المتراكبة من غير تكرار ثقيل.
- source_word: ποιεῖτε
  choice: تفعلون
  rationale: المضارع العربي يلائم الفعل اليوناني الحاضر ويفيد الممارسة المتكررة في السياق.
theological_decisions:
- issue: طبيعة التقليد في اتهام يسوع
  choice: تقليدكم
  alternative: تقليدكم البشري
  rationale: النص يقول حرفيًا «تقليدكم» ولا يورد صفة «البشري» في هذه الآية؛ ويكفي السياق لإظهار تعارض هذا التقليد بعينه مع كلمة الله.
- issue: قوة فعل ἀκυρόω تجاه كلمة الله
  choice: مُبطِلين
  alternative: ناقضين / جاعلين بلا مفعول
  rationale: «مُبطِلين» يحفظ معنى إلغاء النفاذ أو الفاعلية من غير أن يوحي بأن كلمة الله نفسها تزول في ذاتها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقيت صيغة اسم الفاعل في أول الآية لأنها تواصل تركيب الجملة السابقة في الأصل اليوناني، وأُبقي «تقليدكم» بلا إضافة تفسيرية مذهبية.
