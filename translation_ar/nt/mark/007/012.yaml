lexical_decisions:
- source_word: οὐκέτι
  choice: لا تعودون
  rationale: تنقل معنى انقطاع السماح بعد أن كان ممكنًا، وهي صياغة عربية طبيعية تفيد «لم يعد» مع فاعل جمع مخاطب.
- source_word: ἀφίετε
  choice: تسمحون
  rationale: الفعل هنا بمعنى الإذن أو السماح، لا بمعنى الغفران أو الترك.
- source_word: αὐτόν
  choice: له
  rationale: يحفظ الإحالة إلى الرجل المذكور في السياق، ويأتي الضمير ملائمًا لتركيب «تسمحون له أن» في العربية.
- source_word: οὐδέν
  choice: شيئًا
  rationale: مع النفي في «لا تعودون» يفيد منع أي فعل على الإطلاق، من غير إثقال العبارة بنفي مزدوج.
- source_word: ποιῆσαι
  choice: أن يفعل
  rationale: ترجمة مباشرة وطبيعية للمصدر اليوناني الدال على القيام بفعل.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: لأبيه أو أمه
  rationale: اللام تنقل دلالة المنفعة المحتملة في صيغة موجزة، وإضافة الأب والأم إلى ضمير الرجل مفهومة من السياق.
theological_decisions:
- issue: هل تُصرَّح دلالة الإعانة المادية المستفادة من سياق القربان؟
  choice: الإبقاء على العبارة العامة «أن يفعل شيئًا لأبيه أو أمه»
  alternative: «أن يقدم أي عون لأبيه أو أمه» أو «أن ينفق شيئًا على أبيه أو أمه»
  rationale: النص اليوناني في الآية واسع الدلالة، وإن كان السياق يرجّح الإعانة العملية أو المالية. لذلك تُحفظ سعة العبارة في المتن ويُوضح الاحتمال السياقي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فلا تعودون» لربط النتيجة بما قبلها ونقل قوة οὐκέτι، مع إبقاء عبارة الفعل عامة كما في اليونانية.
