  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: ar
  text: 'لأنّه من الداخل، من قلب البشر، تخرج الأفكار الشريرة: أعمال الفجور الجنسي، والسرقات، وجرائم القتل،'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσωθεν
  choice: من الداخل
  rationale: يحفظ دلالة المصدر الباطني والتقابل السياقي بين ما يخرج من الإنسان وما يأتيه من الخارج.
- source_word: γὰρ
  choice: لأنّه
  rationale: أداة تعليل تربط هذه العبارة بما سبقها وتبيّن أساسه.
- source_word: καρδίας
  choice: قلب
  rationale: يحافظ على الصورة الأنثروبولوجية الكتابية للقلب بوصفه مركز الفكر والإرادة والحياة الأخلاقية، من غير استبدالها بتفسير مثل «الذات الباطنة».
- source_word: ἀνθρώπων
  choice: البشر
  rationale: اللفظ اليوناني جمع مذكّر عام يشمل الناس جميعًا؛ و«البشر» ينقل العموم بوضوح وطبيعية في العربية.
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: الأفكار الشريرة
  rationale: تعبير واضح ومعاصر عن الأفكار والتدبّرات الداخلية ذات الصفة الأخلاقية الشريرة.
- source_word: ἐκπορεύονται
  choice: تخرج
  rationale: يحفظ صورة صدور هذه الشرور من داخل القلب، ويتوافق طبيعيًا مع الفاعل الجمع في العربية.
- source_word: πορνεῖαι
  choice: أعمال الفجور الجنسي
  rationale: ينقل المعنى الواسع للأفعال الجنسية غير المشروعة، ويحافظ على صيغة الجمع من غير حصر المصطلح في نوع واحد.
- source_word: κλοπαί
  choice: السرقات
  rationale: مقابل عربي طبيعي يحفظ صيغة الجمع في قائمة الرذائل.
- source_word: φόνοι
  choice: جرائم القتل
  rationale: يبيّن أن المقصود قتل البشر المحرّم لا مطلق إزهاق الحياة، ويحفظ صيغة الجمع.
theological_decisions:
- issue: الدلالة العامة للفظ ἀνθρώπων
  choice: البشر
  alternative: الناس؛ بنو الإنسان
  rationale: السياق يقرر حقيقة عامة عن البشر، ولا يخص الذكور؛ لذلك نُقل العموم من غير تضييق الدلالة.
- issue: مدى دلالة πορνεῖαι
  choice: أعمال الفجور الجنسي
  alternative: الفجور الجنسي؛ الزنى
  rationale: اللفظ جمع واسع الدلالة على أفعال جنسية غير مشروعة؛ فلا يُحصر في الزنى وحده ولا تُمحى صيغة الجمع بتحويله إلى اسم معنى مفرد.
- issue: صورة القلب بوصفه مصدر الشر
  choice: الإبقاء على «قلب»
  alternative: باطن الإنسان؛ الذات الداخلية
  rationale: يحافظ النص على الاستعارة الأنثروبولوجية الأصلية وعلى التوتر بين الداخل والخارج، بدل تفسير القلب تفسيرًا تجريديًا داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تكرار معنى المصدر في «من الداخل، من قلب البشر» لأنه مقصود في اليونانية، كما حُفظ نسق قائمة الرذائل بصيغ الجمع.
