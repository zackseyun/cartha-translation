  source_fidelity: 'النص العربي ينقل ترتيب الحجة ودلالتها الأساسية بأمانة: «من الداخل» ثم «من قلب البشر»، مع بقاء «القلب» الصورة الأنثروبولوجية الأصلية. و«الأفكار الشريرة» تقابل οἱ διαλογισμοὶ οἱ κακοί، و«تخرج» تقابل ἐκπορεύονται. كما تحافظ عناصر القائمة على صيغة الجمع ودلالتها: أعمال الفجور الجنسي، السرقات، وجرائم القتل.'
  naturalness: الصياغة فصيحة حديثة وواضحة. تكرار حرف الجر في «من الداخل، من قلب البشر» طبيعي ومقصود لإبراز المصدر الباطني، وتناسبه الفاصلة والقائمة اللاحقة. عبارة «أعمال الفجور الجنسي» مفهومة وتحفظ اتساع المصطلح دون حصره في نوع محدد.
  terminology: استعمال «البشر» مناسب للعموم في ἀνθρώπων، و«قلب» يحافظ على المصطلح الكتابي. «الفجور الجنسي» ينقل πορνεῖαι على نحو واسع غير طائفي، و«جرائم القتل» ينقل φόνοι بوصفه قتلًا آثمًا/غير مشروع لا مجرد إزهاق حياة.
