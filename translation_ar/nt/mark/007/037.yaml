    rationale: لا تفيد καὶ الثانية في النص اليوناني إلا العطف، ولا توجد أداة ظاهرة تستلزم معنى «حتى/حتى إن». كما أن موضع «حتى» الحالي يبرز الصم وحدهم، بينما يعطف النص الصم والبكم في توازٍ.
