  source_fidelity: ينقل النص معنى التعجب الشديد، واستمرار اندهاشهم، وفعل يسوع المُنجَز، وسببيته في إسماع الصم وإنطاق البكم على نحو أمين عمومًا. لكن «حتى» لا يقابلها ما يقتضيها في اليونانية هنا؛ فالعطف بكلمة καὶ يربط الشقين، وإقحامها قبل «الصم» يجعل التركيز واقعًا على الصم دون البكم.
  naturalness: الترجمة فصيحة وواضحة. وعبارة «أحسن في كل ما فعله» طبيعية وتنقل التقييم الشامل، وإن كانت أقل مباشرة قليلًا من ترتيب اليونانية. حذف «حتى» يجعل التوازي العربي بين الشقين أسلس وأدق.
  terminology: «الصم» و«البكم» مناسبان للسياق، وكذلك «يجعل ... يسمعون/يتكلمون» لبنية الفعل السببية. وتحافظ الحواشي على الإشارة المحتملة إلى إشعياء دون تحويلها إلى دعوى صريحة في المتن.
