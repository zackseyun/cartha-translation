  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: ar
  text: 'وَكَانُوا يَنْدَهِشُونَ غَايَةَ الِانْدِهَاشِ، وَيَقُولُونَ: «لَقَدْ أَحْسَنَ فِي كُلِّ مَا فَعَلَهُ.[a] فَهُوَ يَجْعَلُ الصُّمَّ يَسْمَعُونَ، وَالْبُكْمَ يَتَكَلَّمُونَ».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «لقد صنع كل شيء حسنًا»، وهي صياغة قد تذكّر بلغة الكتاب عن أعمال الله.'
    reason: lexical_alternative
  - marker: b
    text: 'تذكّر هذه الكلمات بإشعياء 35: 5–6، حيث يسمع الصم ويتكلم البكم في زمن خلاص الله وتجديده.'
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: غَايَةَ الِانْدِهَاشِ
  rationale: ينقل شدة الظرف اليوناني، الذي يفيد درجة استثنائية فائقة، بتعبير عربي طبيعي ومؤكد.
- source_word: ἐξεπλήσσοντο
  choice: كَانُوا يَنْدَهِشُونَ
  rationale: صيغة الماضي المستمر تعكس دلالة الفعل الناقص على استمرار حال اندهاشهم.
- source_word: λέγοντες
  choice: وَيَقُولُونَ
  rationale: ينقل اسم الفاعل الدال على الحال المصاحبة بأسلوب عربي سلس.
- source_word: Καλῶς
  choice: أَحْسَنَ
  rationale: يعبر عن تقويم جودة أفعال يسوع، ويؤدي معنى «فعل حسنًا» بعبارة عربية طبيعية.
- source_word: πάντα
  choice: فِي كُلِّ مَا
  rationale: يحفظ الشمول المقصود في العبارة بصياغة عربية مألوفة.
- source_word: πεποίηκεν
  choice: فَعَلَهُ
  rationale: يحفظ معنى الفعل التام، أي العمل المنجز الذي ما زالت نتيجته ظاهرة، مع استعمال فعل عربي عام ملائم للسياق.
- source_word: κωφοὺς
  choice: الصُّمَّ
  rationale: مقابل عربي مباشر لمن لا يسمعون في سياق الشفاء.
- source_word: ποιεῖ ἀκούειν
  choice: يَجْعَلُ ... يَسْمَعُونَ
  rationale: يحفظ البنية السببية في اليونانية وصورتها الحية.
- source_word: ἀλάλους
  choice: الْبُكْمَ
  rationale: مقابل موجز ودقيق لمن لا يستطيعون الكلام، ويحافظ على التوازي مع «الصم».
- source_word: λαλεῖν
  choice: يَتَكَلَّمُونَ
  rationale: ترجمة عربية مباشرة وطبيعية للفعل الدال على الكلام.
- source_word: καὶ
  choice: حَتَّى
  rationale: تبرز القوة التصاعدية في التعجب، مع إبقاء الصم والبكم معطوفين في جملة واحدة.
theological_decisions:
- issue: 'احتمال التلميح إلى إشعياء 35: 5–6 ورنين لغة الخلق في عبارة Καλῶς πάντα πεποίηκεν'
  choice: إبقاء قول الجمع واضحًا ومباشرًا في المتن، مع ذكر التلميحين المحتملين في الحاشيتين.
  alternative: 'ترجمة العبارة حرفيًا: «لقد صنع كل شيء حسنًا»، بما يقوي رنين لغة الخلق.'
  rationale: النص قد يستحضر وعد إشعياء بأن يسمع الصم ويتكلم البكم، وربما يستحضر أيضًا تقويم أعمال الله في رواية الخلق. لا يصرح المتن بأن هذا اقتباس، لذلك لم تُحسم الإشارة ضمن الترجمة نفسها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع ضبط كامل للنص. استُعملت صياغة طبيعية لعبارة التعجب الشديدة، وحُفظ التوازي بين الصم والبكم والبنية السببية في فعلي السماع والكلام.
