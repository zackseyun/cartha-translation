  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: ar
  text: 'لكنها أجابت وقالت له: «يا رب[a]، فحتى الكلاب الصغيرة[b] تحت المائدة تأكل من فتات الأطفال».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا سيدي». فاللفظ اليوناني يمكن أن يكون لقب «الرب»، ويمكن أيضًا أن يُستعمل خطابَ احترام.'
    reason: alternative_reading
  - marker: b
    text: اللفظ اليوناني صيغة تصغير، ويشير إلى كلاب صغيرة أو منزلية؛ لذلك تُرجم «الكلاب الصغيرة».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: أجابت وقالت له
  rationale: يحافظ على فعلي الإجابة والقول، مع صوغ المضارع التاريخي بصيغة الماضي الملائمة للسرد العربي.
- source_word: Κύριε
  choice: يا رب
  rationale: ينقل اللقب اليوناني بصيغته العربية المألوفة في النداء، مع التنبيه إلى إمكان فهمه بوصفه خطاب احترام.
- source_word: καὶ
  choice: حتى
  rationale: 'تؤدي هنا المعنى الإضافي الحِجاجي: فالكلاب الصغيرة أيضًا تنال نصيبًا من الفتات.'
- source_word: κυνάρια
  choice: الكلاب الصغيرة
  rationale: يحفظ دلالة التصغير في اللفظ اليوناني من غير تقييده حتمًا بالجراء.
- source_word: ὑποκάτω τῆς τραπέζης
  choice: التي تحت المائدة
  rationale: تعبير مكاني واضح وطبيعي، وأُضيف اسم الموصول لاستقامة الجملة العربية.
- source_word: ἐσθίουσιν
  choice: تأكل
  rationale: المضارع يعبر عن فعل معتاد أو حقيقة عامة داخل الصورة التمثيلية.
- source_word: ἀπὸ τῶν ψιχίων
  choice: من فتات
  rationale: ينقل معنى الأجزاء أو اللقيمات الصغيرة ويحافظ على حرف الجر الدال على الأخذ منها.
- source_word: τῶν παιδίων
  choice: الأولاد
  rationale: ترجمة طبيعية للجمع، وهو مضاف إليه يبين أن الفتات مما يخص الأولاد أو يسقط من طعامهم.
theological_decisions:
- issue: دلالة κύριε في خطاب المرأة ليسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: «يا رب» تحافظ على اللقب المعتاد ليسوع، بينما يظل السياق محتملًا لكونه خطاب احترام؛ لذلك ذُكر البديل في الحاشية من غير حسم زائد.
