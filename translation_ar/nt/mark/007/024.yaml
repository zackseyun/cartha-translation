  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: ar
  text: ومن هناك قام وذهب إلى نواحي صور[a]. ودخل بيتًا، ولم يُرِد أن يعلم به أحد[b]، لكنه لم يستطع أن يظل مختفيًا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إلى منطقة صور» أو «إلى تخوم صور»؛ فاللفظ اليوناني قد يدل على المنطقة أو الأراضي المرتبطة بصور، لا على خط الحدود وحده.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «لم يُرِد أن يعرف أحد»؛ والمفعول مضمر في اليونانية، وقد يشير إلى حضوره أو مكانه.'
    reason: lexical_alternative
  - marker: c
    text: أو «لكنه لم يستطع أن يفلت من ملاحظة الناس».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: ومن هناك
  rationale: تفيد Ἐκεῖθεν الانتقال من الموضع السابق، أما δέ فأداة ربط خفيفة يناسبها الواو في السرد العربي.
- source_word: ἀναστὰς
  choice: قام
  rationale: اسم الفاعل الأوريستي يمهّد للفعل التالي في تسلسل السرد، و«قام» يحفظ معنى النهوض بصياغة طبيعية.
- source_word: ἀπῆλθεν
  choice: ذهب
  rationale: يفيد الفعل مغادرة المكان والانطلاق إلى موضع آخر؛ و«ذهب» واضحة وطبيعية هنا، مع دلالة المغادرة المستفادة من السياق.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: إلى نواحي صور
  rationale: يمكن أن تدل ὅρια على الحدود أو المنطقة التابعة لمدينة؛ و«نواحي صور» تنقل الدلالة المكانية من غير حصرها في خط الحدود.
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: ودخل بيتًا
  rationale: ينقل تسلسل الحدث بإيجاز، ونُكِّرت «بيتًا» لأن οἰκίαν غير معرّفة في اليونانية.
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: ولم يُرِد أن يعرف أحدٌ بوجوده
  rationale: مفعول «يعرف» مضمر في الأصل، والمقصود أن لا يعلم أحد بحضوره أو مكانه؛ وإضافة «بوجوده» توضح الضمير من غير تحديد زائد.
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: لكنه لم يستطع أن يظل مختفيًا
  rationale: يفيد λανθάνω الإفلات من الملاحظة أو البقاء غير ملحوظ، و«لكنه» تُظهر المقابلة بين إرادته والنتيجة.
