  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: ar
  text: وبعد أن خرج مرة أخرى من نواحي صور، جاء عبر صيدا إلى بحر الجليل، مارًّا في وسط نواحي المدن العشر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة: «بين نواحي المدن العشر». فالتعبير اليوناني ἀνὰ μέσον قد يعني «في الوسط» أو «بين»، ووصف الطريق هنا عسير من الناحية الجغرافية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: أيضًا
  rationale: تفيد تجدد الحركة في سياق السرد، و«أيضًا» صياغة عربية طبيعية موجزة.
- source_word: ἐξελθὼν ἐκ τῶν ὁρίων Τύρου
  choice: خرج من نواحي صور
  rationale: اسم ὅρια يدل هنا على الإقليم أو النواحي، لا على خط الحدود وحده؛ وصيغة الفعل تحافظ على سبق الخروج للحركة التالية.
- source_word: ἦλθεν διὰ Σιδῶνος εἰς
  choice: مرَّ عبر صيدا حتى وصل إلى
  rationale: تعبّر διά مع المضاف إليه عن المرور عبر المكان أو اتخاذه طريقًا، و«حتى وصل» توضح وجهة الحركة من غير تغيير مضمونها.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: بحر الجليل
  rationale: يحافظ على الاسم الجغرافي المألوف وعلى المعنى الحرفي لـ θάλασσα.
- source_word: ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως
  choice: سالكًا في وسط نواحي المدن العشر
  rationale: يحفظ القوة المكانية للتعبير غير المألوف ἀνὰ μέσον، ويترجم Δεκάπολις بالاسم العربي الواضح «المدن العشر».
