  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «نواحي» لكلا ورودَي ὅρια اتساقًا مع الدلالة الإقليمية، وأُبقي وصف المسار غير المعتاد من غير تسوية صعوبته الجغرافية.
