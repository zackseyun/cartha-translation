  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: ar
  text: وكانت المرأة يونانية[a]، سُورِيَّة فِينيقيَّة الأصل[b]، وظلَّت تطلب منه أن يطرد الشيطان من ابنتها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أممية»؛ يقول النص اليوناني حرفيًّا «يونانية»، ويُرجَّح أن اللفظ هنا يدل أيضًا على أنها غير يهودية.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «سُورِيَّة فِينيقيَّة من جهة الأصل أو النسب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: يونانية
  rationale: ينقل اللفظ اليوناني مباشرة، مع إبقاء دلالته المحتملة في السياق على كونها غير يهودية في الحاشية بدل إحلال التفسير محل النص.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: سُورِيَّة فِينيقيَّة الأصل
  rationale: يحفظ الوصف الإثني والجغرافي، ويؤدي τῷ γένει بعبارة عربية طبيعية تدل على المنشأ أو النسب.
- source_word: ἠρώτα
  choice: ظلَّت تطلب
  rationale: صيغة الماضي الناقص تفيد الاستمرار أو التكرار؛ وهذه العبارة تنقل ذلك من غير إضافة انفعال لا يصرح به الفعل.
- source_word: ἵνα ... ἐκβάλῃ
  choice: أن يطرد
  rationale: تؤدي مضمون الطلب، وتنقل معنى الإخراج القسري في سياق طرد الشياطين بعبارة عربية واضحة.
- source_word: τὸ δαιμόνιον
  choice: الشيطان
  rationale: ترجمة مباشرة للمفرد δαιμόνιον، من غير استبداله بتعبير «الروح النجس» الوارد في سياقات قريبة لكنه ليس لفظ هذه الآية.
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: من ابنتها
  rationale: ينقل حرف الجر الدال على الخروج من داخلها بصياغة عربية طبيعية في هذا السياق.
- source_word: δὲ ... καὶ
  choice: و...، و...
  rationale: الواو العربية تكفي للانتقال السردي والربط من غير إدخال ظرف زمني غير موجود أو تشديد معنى المقابلة.
theological_decisions:
- issue: هوية المرأة الإثنية والثقافية
  choice: 'الإبقاء على الوصفين: «يونانية، سُورِيَّة فِينيقيَّة الأصل»'
  alternative: «أممية، من أصل سوري فينيقي»
  rationale: النص يورد وصفين متميزين، فلا تُدمج دلالتهما في وصف واحد ولا يُستبدل اللفظ المباشر «يونانية» بتفسيره المحتمل «أممية».
- issue: طبيعة ما أصاب الابنة
  choice: الشيطان
  alternative: روح شرير
  rationale: يتبع النص لفظ δαιμόνιον ويحفظ عرضه الصريح للحدث من غير تلطيف الادعاء أو إعادة تفسيره.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية رصينة. استُعملت «ظلَّت تطلب» لإظهار الاستمرار، وحُفظ الوصفان المتتاليان لهوية المرأة مع توضيح البدائل في الحواشي.
