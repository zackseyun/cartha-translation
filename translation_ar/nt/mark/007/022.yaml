  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: ar
  text: أعمال الزنى، والجشع، والشرور، والخداع، والفجور، والعين الشريرة[a]، والافتراء[b]، والكبرياء، والحماقة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «الحسد» أو «النظرة الحاقدة»؛ وحرفيًا: «العين الشريرة»، وهو تعبير اصطلاحي يدل على نظرة حسودة أو خبيثة.'
    reason: lexical_alternative
  - marker: b
    text: أو «التجديف». يمكن أن تشير الكلمة اليونانية إلى كلام افترائي أو مسيء في حق الناس، أو إلى التجديف على الله.
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: أعمال الزنى
  rationale: يحفظ دلالة الجمع على أفعال الزنى المتكررة، ويأتي عربيًا بصورة طبيعية أوضح من جمعٍ مصطنع لكلمة «زنى».
- source_word: πλεονεξίαι
  choice: الجشع
  rationale: يدل على التطلع النهم إلى المزيد، ولا سيما على نحو مادي أو استغلالي؛ و«الجشع» واضح ومألوف في قائمة الرذائل.
- source_word: πονηρίαι
  choice: الشرور
  rationale: يحفظ صيغة الجمع اليونانية ويدل على صور متعددة من الفساد الأخلاقي، مع سلامة التعبير في العربية.
- source_word: δόλος
  choice: الخداع
  rationale: ينقل معنى التضليل المتعمد بلفظ عربي معاصر وواضح.
- source_word: ἀσέλγεια
  choice: الفجور
  rationale: ينقل معنى السلوك الوقح المنفلت من الضوابط، وكثيرًا ما يحمل إيحاءً جنسيًا، من غير حصره في معنى جنسي وحده.
- source_word: ὀφθαλμὸς πονηρός
  choice: العين الشريرة
  rationale: يحفظ الصورة الاصطلاحية حرفيًا للشفافية، مع شرح معناها المحتمل من الحسد أو النظرة الخبيثة في الحاشية.
- source_word: βλασφημία
  choice: التشهير
  rationale: ينقل في سياق قائمة الرذائل معنى الكلام الذي يطعن في الآخرين ويؤذي سمعتهم، مع إبقاء «التجديف» بديلًا ممكنًا في الحاشية.
- source_word: ὑπερηφανία
  choice: الكبرياء
  rationale: يدل على تعالي الإنسان ورفعه نفسه، وهو لفظ موجز ومألوف في العربية.
- source_word: ἀφροσύνη
  choice: الحماقة
  rationale: تدل هنا على انعدام الرشد الأخلاقي والعملي، لا على مجرد ضعف الذكاء.
theological_decisions:
- issue: دلالة βλασφημία في قائمة الرذائل
  choice: التشهير
  alternative: التجديف
  rationale: قد تشير الكلمة اليونانية إلى الكلام المسيء في حق الناس أو إلى التجديف على الله. يلائم «التشهير» سياق الرذائل الاجتماعية، لكن الحاشية تحفظ احتمال «التجديف» ولا تحسم التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. صيغت القائمة بأسماء معرّفة متوازية، وحُفظ جمع πονηρίαι بلفظ «الشرور»، بينما نُقل جمع μοιχεῖαι طبيعيًا بعبارة «أعمال الزنى». وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحهما الحاشيتان فعلًا.
