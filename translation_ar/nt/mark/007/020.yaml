  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: ar
  text: 'وكان يقول: «ما يخرج من الإنسان هو الذي يُنجِّس الإنسان[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يجعل الإنسان نجسًا». الفعل اليوناني من لغة الطهارة، ويدل على جعل شخصٍ ما مُدنَّسًا أو نجسًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: وكان يقول
  rationale: يحفظ دلالة الماضي الناقص على استمرار القول في السياق السردي، بصياغة عربية طبيعية.
- source_word: δὲ
  choice: الواو في «وكان»
  rationale: أداة ربط سردية خفيفة، تؤديها الواو من غير إقحام معنى تقابلي زائد.
- source_word: ὅτι
  choice: النقطتان وعلامتا الاقتباس
  rationale: تقدّم الأداة اليونانية مضمون القول، والأفصح عربيًا هنا عرضه كلامًا مباشرًا.
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: ما يخرج من الإنسان
  rationale: ينقل التركيب الوصفي الاسمي بعبارة عربية واضحة، ويحفظ حركة الخروج من الإنسان.
- source_word: ἀνθρώπου / ἄνθρωπον
  choice: الإنسان
  rationale: الاسم اليوناني ذو دلالة بشرية عامة هنا؛ و«الإنسان» يحفظ المفرد والتوازي اللفظي من غير قصر المعنى على الذكر.
- source_word: ἐκεῖνο
  choice: هو الذي
  rationale: يحفظ توكيد اسم الإشارة اليوناني ويبرز أن الخارج نفسه هو العامل في التنجيس.
- source_word: κοινοῖ
  choice: يُنجِّس
  rationale: الفعل هنا من لغة الطهارة ويدل على جعل الإنسان نجسًا؛ و«يُنجِّس» موجز وطبيعي في السياق.
theological_decisions:
- issue: دلالة κοινόω في سياق الطهارة
  choice: يُنجِّس
  alternative: يجعل الإنسان نجسًا
  rationale: يحافظ الاختيار على لغة النجاسة والطهارة وعلى إمكان تداخل البعد الطقسي والأخلاقي في السياق، من غير حصره في تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ تكرار «الإنسان» والتوكيد في «هو الذي» لما لهما من أثر بلاغي في الأصل.
