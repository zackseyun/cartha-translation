  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: ar
  text: وإذا عادوا من السوق، لا يأكلون ما لم يغتسلوا[a]. وهناك أمور كثيرة أخرى تسلَّموها ليحافظوا عليها، كغسل الكؤوس والأباريق والآنية النحاسية وأرائك الطعام[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُغمِّسوا أنفسهم». يستعمل النص اليوناني صيغة من فعل كثيرًا ما يُترجم بـ«يعمِّد»، لكنه يشير هنا إلى غسل طقسي في سياق عادات الطهارة.'
    reason: lexical_alternative
  - marker: b
    text: تحذف بعض المخطوطات عبارة «وأرائك الطعام».
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: السوق
  rationale: تشير الكلمة إلى موضع البيع العام؛ و«السوق» هي المقابل العربي الطبيعي الواضح.
- source_word: βαπτίσωνται
  choice: يغتسلوا
  rationale: السياق هو التطهر الطقسي قبل الأكل بعد العودة من السوق. و«يغتسلوا» تنقل الفعل الواقع على ذواتهم من غير إيحاء مباشر بالمعمودية المسيحية، مع إثبات احتمال التغميس في الحاشية.
- source_word: παρέλαβον κρατεῖν
  choice: تسلَّموها ليحافظوا عليها
  rationale: يحفظ التعبير فكرتي تلقّي الممارسات والتمسك بها، من غير تحويل التركيز إلى تسليمها للآخرين.
- source_word: βαπτισμοὺς
  choice: غسل
  rationale: يدل هنا على أعمال غسل طقسية للأوعية؛ وجاء المصدر العربي المفرد استعمالًا جنسيًا طبيعيًا يشمل هذه الغسلات المتعددة.
- source_word: ξεστῶν
  choice: الأباريق
  rationale: الكلمة تدل على أوعية كالجِرار أو الأباريق، و«الأباريق» مقابل عربي ملموس ومألوف من غير إفراط في التحديد.
- source_word: χαλκίων
  choice: الآنية النحاسية
  rationale: تدل على أوعية مصنوعة من النحاس أو من سبيكة نحاسية؛ و«الآنية النحاسية» تعبير واضح يحافظ على دلالة المادة.
- source_word: κλινῶν
  choice: أرائك الطعام
  rationale: يمكن أن تعني الكلمة أسرّة أو أرائك، وفي سياق الأكل يُرجَّح أنها الأرائك التي كان الناس يتكئون عليها عند تناول الطعام.
- source_word: ἄλλα πολλά
  choice: أمور كثيرة أخرى
  rationale: يحافظ هذا التعبير على عموم اليونانية، من غير تقييدها صراحةً بـ«تقاليد» أو «ممارسات».
theological_decisions:
- issue: دلالة βαπτίσωνται وβαπτισμοὺς في سياق الطهارة الطقسية
  choice: ترجمتهما بـ«يغتسلوا» و«غسل»
  alternative: «يُغمِّسوا أنفسهم» و«تغميسات»، أو استعمال ألفاظ المعمودية
  rationale: يتناول العدد عادات الطهارة اليهودية لا المعمودية المسيحية؛ لذلك تتجنب الصياغة إسقاط دلالة أسرارية لاحقة، مع إبقاء احتمال التغميس في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يغتسلوا» من غير «أنفسهم» لأن صيغة الافتعال في العربية تؤدي المعنى الانعكاسي طبيعيًا. وصيغت قائمة الممارسات بـ«كغسل...» لتجنب تركيب اسمي ثقيل، مع الحفاظ على كونها أمثلة للأمور التي تسلّموها.
