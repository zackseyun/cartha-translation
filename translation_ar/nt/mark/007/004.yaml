  verdict: approve
  source_fidelity: 'النص العربي ينقل بنية العدد ومعناه بأمانة: الامتناع عن الأكل بعد الرجوع من السوق إلى أن يغتسلوا، ثم التمسك بأمور أخرى متلقاة، ومنها غسل الأوعية وأرائك الطعام. و«يغتسلوا» مناسبة لـβαπτίσωνται في سياق الطهارة ولا تستدعي دلالة المعمودية المسيحية. كما أن «غسل» في القائمة يؤدي دلالة βαπτισμούς العامة/الجنسية على نحو عربي سليم.'
  naturalness: الصياغة فصيحة واضحة وطبيعية في العربية المعاصرة. «وإذا عادوا من السوق» و«ما لم يغتسلوا» و«تسلَّموها ليحافظوا عليها» تراكيب سليمة، وقائمة الأوعية مفهومة. والشرطة الختامية تحافظ على تعليق الجملة في النص اليوناني.
  terminology: 'اختيارات «السوق»، «الأباريق»، «الآنية النحاسية»، و«أرائك الطعام» مناسبة. وتحافظ الحاشية على البديل المعجمي المتصل بالتغميس من غير فرض قراءة طقسية مسيحية. موضع علامتي الحاشيتين صحيح: (a) عقب فعل الاغتسال و(b) عقب العبارة المختلف عليها نصيًا.'
