  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: ar
  text: ورأوا بعض تلاميذه يأكلون الخبز بأيدٍ نجسة، أي غير مغسولة[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «بأيدٍ عادية»، أي بأيدٍ تُعَدّ نجسة أو غير طاهرة من جهة الطقوس، لا مجرد أيدٍ متسخة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ورأوا
  rationale: اسم فاعل ماضٍ يؤدي وظيفة ظرفية، وصياغته فعلًا معطوفًا طبيعية في العربية وتحفظ قوة المعاينة، والفاعل مفهوم من سياق العدد السابق.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: بعض تلاميذه
  rationale: تنقل τινάς مع المضاف إليه الدال على التبعيض بعبارة عربية واضحة وطبيعية.
- source_word: ὅτι
  choice: —
  rationale: 'تدخل ὅτι على مضمون ما رأوه؛ ولا تحتاج العربية هنا إلى أداة مقابلة، إذ يتصل فعل الرؤية مباشرة بالجملة الحالية: «رأوا بعض تلاميذه يأكلون».'
- source_word: κοιναῖς χερσίν
  choice: بأيدٍ نجسة
  rationale: κοινός تعني حرفيًا «عام/مشترك»، لكنها في سياق أحكام الطهارة تدل على ما عُدَّ مدنسًا أو غير طاهر طقسيًا. «نجسة» واضحة وطبيعية، مع حاشية تحفظ التعبير الحرفي ودلالته الطقسية.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: أي غير مغسولة
  rationale: يحفظ الشرح الذي يورده مرقس نفسه، ويبين أن المقصود أيدٍ لم تُغسل بحسب الممارسة المعنية في السياق.
- source_word: ἐσθίουσιν
  choice: يأكلون
  rationale: المضارع العربي بعد «رأوا» يصور الفعل الجاري وقت المشاهدة بصورة طبيعية.
- source_word: τοὺς ἄρτους
  choice: الخبز
  rationale: على الرغم من صيغة الجمع اليونانية، فإن اسم الجنس «الخبز» هو التعبير العربي المألوف للطعام المقصود هنا، مع حفظ التعريف.
theological_decisions:
- issue: دلالة الطهارة في κοινός
  choice: استُعملت «نجسة» في المتن، مع بيان «غير مغسولة» الذي يقدمه النص نفسه وحاشية توضح أن المقصود نجاسة طقسية لا مجرد اتساخ مادي.
  alternative: «بأيدٍ عادية» أو «بأيدٍ مدنسة» أو «بأيدٍ غير طاهرة»
  rationale: الترجمة الحرفية «عادية» غامضة ومضللة للقارئ العربي، لأن κοινός هنا مصطلح متعلق بالطهارة. «نجسة» تنقل المعنى السياقي بوضوح من غير أن تختزل القضية في النظافة الجسدية، بينما تحفظ الحاشية الصورة الحرفية والتوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظت الشرطة الختامية لأن العدد جزء من جملة تمتد إلى ما بعده، ووُضع مؤشر الحاشية بعد العبارة التي تشرح المصطلح.
