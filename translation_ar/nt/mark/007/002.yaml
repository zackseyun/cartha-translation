  source_fidelity: 'الترجمة تنقل بدقة البنية الأساسية للنص: فعل الرؤية، وبعض التلاميذ، وفعل الأكل الجاري، والخبز، وتعبير الطهارة الطقسية في κοιναῖς χερσίν، ثم تفسير مرقس «أي غير مغسولة». اختيار «بأيدٍ نجسة» مناسب في هذا السياق الطقسي، والحاشية تمنع فهمه على أنه اتساخ مادي فحسب.'
  naturalness: 'الصياغة عربية فصحى حديثة وسلسة: «ورأوا بعض تلاميذه يأكلون الخبز...» واضحة وطبيعية. و«أي غير مغسولة» متصلة نحويًا بـ«أيدٍ» وتؤدي وظيفة التفسير في الأصل. الشرطة الختامية مناسبة لأن الجملة غير مكتملة في سياقها.'
  terminology: «نجسة» مع التقييد في الحاشية بـ«من جهة الطقوس» تنقل الدلالة السياقية لـκοινός من غير ادعاء أن المراد مجرد قذارة جسدية. الحاشية تحفظ المعنى الحرفي «عادية» وتعرض البدائل التفسيرية اللازمة. لا توجد مسألة لاهوتية أو اصطلاحية تستدعي تعديلًا.
