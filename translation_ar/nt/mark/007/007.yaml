  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: ar
  text: لكنهم يعبدونني باطلًا، إذ يعلِّمون تعاليمَ[a] هي وصايا بشرية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إذ يعلِّمون وصايا بشرية على أنها تعاليم».'
    reason: بديل نحوي يبرز أن الوصايا البشرية تُقدَّم بوصفها تعاليم.
lexical_decisions:
- source_word: μάτην
  choice: باطلًا
  rationale: ينقل معنى العبادة التي لا تحقق غايتها ولا قيمة لها في هذا السياق، وهو تعبير عربي فصيح ومألوف في الاقتباس النبوي.
- source_word: δὲ
  choice: لكنهم
  rationale: تفيد الأداة هنا المقابلة مع إكرام الله بالشفاه مع ابتعاد القلب، ولذلك نُقلت بأداة الاستدراك «لكن».
- source_word: σέβονταί με
  choice: يعبدونني
  rationale: الفعل يدل على التعبد أو التوقير الموجَّه إلى الله، و«يعبدونني» أوضح مقابل في هذا السياق.
- source_word: διδάσκοντες
  choice: إذ يعلِّمون
  rationale: يحفظ صيغة الحال/الوسيلة في اسم الفاعل اليوناني، ويبيّن أن التعليم يصف كيفية عبادتهم الباطلة.
- source_word: διδασκαλίας
  choice: تعاليمَ
  rationale: المعنى هو تعاليم ذات صفة دينية أو عقائدية، واختيار «تعاليم» طبيعي ولا يضيّق اللفظ على مصطلح مذهبي لاحق.
- source_word: ἐντάλματα ἀνθρώπων
  choice: ليست إلا وصايا بشر
  rationale: «وصايا» تحفظ قوة الأمر الملزم، و«بشر» تعبّر عن الأصل الإنساني العام في مقابلة السلطة الإلهية، بينما «ليست إلا» توضّح العلاقة المضغوطة بين التعاليم والوصايا البشرية.
theological_decisions:
- issue: العلاقة النحوية والدلالية بين «تعاليم» و«وصايا بشر»
  choice: تعاليمَ ليست إلا وصايا بشر
  alternative: يعلِّمون وصايا البشر كأنها تعاليم
  rationale: اليونانية موجزة وتحتمل التعبير عن وصايا بشرية تُقدَّم بوصفها تعاليم. الصياغة المختارة تحفظ النقد الموجَّه إلى المصدر البشري وتتفادى الإيحاء بأن كل تعليم بشري باطل من حيث هو بشري، مع إثبات البديل في الحاشية.
- issue: قوة العبارة μάτην في وصف العبادة
  choice: يعبدونني باطلًا
  alternative: يعبدونني عبثًا
  rationale: «باطلًا» تجمع معنى انعدام الجدوى وعدم القبول في سياق الاقتباس من دون أن تحسم تفصيلًا لاهوتيًا زائدًا بشأن ماهية العبادة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة دينية رصينة. استُخدم «بشر» للدلالة العامة على البشر دون تخصيص الذكور، وحُفظ الإيجاز والتوازي في الاقتباس.
