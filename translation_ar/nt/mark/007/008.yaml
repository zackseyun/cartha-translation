  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: ar
  text: تتركون وصية الله، وتتمسكون بتقليد البشر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الناس» أو «البشر»؛ والمقصود مقابلة ما هو بشري بما هو من الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: تتركون
  rationale: ينقل اسم الفاعل الأوريستي معنى طرح وصية الله جانبًا في ارتباطه بالفعل الرئيس، بصياغة عربية طبيعية لا تشدد المعنى إلى حد «تهجرون».
- source_word: ἐντολὴν
  choice: وصية
  rationale: «وصية» تعبير عربي ديني مألوف يحفظ دلالة الأمر الإلهي الملزم في هذا السياق.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: إضافة مباشرة تدل على أن الوصية صادرة من الله ومنسوبة إليه.
- source_word: κρατεῖτε
  choice: تتمسكون بـ
  rationale: ينقل معنى الالتزام القوي والثبات على الشيء، وهو أقوى من مجرد «تتبعون» دون مبالغة.
- source_word: παράδοσιν
  choice: تقليد
  rationale: المقابل الطبيعي لـ παράδοσις، ويشير هنا إلى ما تناقله البشر من ممارسات.
- source_word: ἀνθρώπων
  choice: البشر
  rationale: يدل اللفظ اليوناني هنا على الناس عمومًا لا على الذكور وحدهم، ويحفظ «البشر» المقابلة الحادة بين ما هو إلهي وما هو بشري.
theological_decisions:
- issue: المقابلة بين وصية الله وتقليد البشر
  choice: 'الحفاظ على التقابل الصريح: «وصية الله» مقابل «تقليد البشر»'
  alternative: «تقليد الناس» أو صياغة قد توحي بإدانة كل تقليد في ذاته
  rationale: قوة التوبيخ نابعة من ترك الوصية الإلهية والتمسك بتقليد مصدره بشري؛ ولا يقتضي النص تعميم الحكم على كل تقليد بلا تمييز.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل المضارع في الفعلين ليجري التوبيخ بسلاسة في العربية، مع بقاء العلاقة بين ترك الوصية والتمسك بالتقليد ظاهرة.
