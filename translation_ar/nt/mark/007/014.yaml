- source_word: πάλιν
  choice: ثانيةً
  rationale: يحفظ معنى التكرار في السياق.
- source_word: ἔλεγεν
  choice: أخذ يقول
  rationale: ينقل صيغة الماضي الناقص اليونانية بوصفها قولًا مستمرًا أو جاريًا، من غير اختزالها إلى فعل ماضٍ بسيط.
- source_word: Ἀκούσατέ μου
  choice: اسمعوا لي
  rationale: يحافظ على الطلب المباشر بالإنصات إلى المتكلم، بصياغة عربية واضحة.
- source_word: σύνετε
  choice: افهموا
  rationale: المقابل المباشر والطبيعي للأمر الداعي إلى الفهم والإدراك.
