lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: صيغة الماضي الناقص تدل على قول جارٍ أو متكرر، و«كان يقول» تنقل هذا الجانب بصورة طبيعية.
- source_word: Καλῶς
  choice: ببراعةٍ
  rationale: اللفظة تعني في أصلها «حسنًا»، لكنها تهكمية في هذا السياق. و«ببراعة» تُظهر المفارقة اللاذعة من غير أن توحي باستحسان حقيقي.
- source_word: ἀθετεῖτε
  choice: تُنحّون ... جانبًا
  rationale: ينقل التعبير معنى الرفض أو الإلغاء المتعمد بلغة عربية واضحة، ويحافظ على الصورة التي تقابل التمسك بالتقليد.
- source_word: ἐντολὴν τοῦ θεοῦ
  choice: وصية الله
  rationale: «وصية» تحافظ على القوة الدينية والرسمية للفظة ἐντολή، والإضافة المباشرة طبيعية وفصيحة.
- source_word: ἵνα
  choice: لكي
  rationale: تحافظ «لكي» على دلالة الغرض أو النتيجة المقصودة.
- source_word: παράδοσιν ὑμῶν
  choice: تقليدكم
  rationale: «التقليد» هو المقابل المألوف لـπαράδοσις هنا، ويعبّر عن الموروث البشري في سياق النزاع.
- source_word: τηρήσητε
  choice: تتمسكوا بـ
  rationale: يفيد الفعل الحفظ أو المراعاة؛ و«تتمسكوا بـ» عربي طبيعي يبرز إيثارهم تقليدهم على وصية الله.
theological_decisions:
- issue: نبرة كلام يسوع
  choice: توبيخ تهكمي لا مديح صريح
  alternative: «حسنًا تفعلون إذ تُنحّون وصية الله...» على ظاهره الحرفي
  rationale: السياق يدين تقديم التقليد البشري على وصية الله. لذلك تنقل «ببراعة» التهكم مع إبقاء المعنى الحرفي البديل في الحاشية، من غير إدخال تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على جانب الاستمرار في «كان يقول»، وعلى المفارقة بين تنحية وصية الله والتمسك بالتقليد، مع توضيح النبرة التهكمية في الحاشية.
