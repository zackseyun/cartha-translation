  text: 'وكان يقول لهم: «ببراعةٍ[a] تُنحّون وصية الله جانبًا لكي تتمسكوا بتقليدكم!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حسنًا تفعلون إذ تُنحّون وصية الله جانبًا لكي تتمسكوا بتقليدكم». اللفظة اليونانية تعني حرفيًا «حسنًا»، لكنها مستعملة هنا على سبيل التهكم، لا الاستحسان.'
