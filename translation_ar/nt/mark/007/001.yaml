  text: Καὶ συνάγονται πρὸς αὐτὸν οἱ Φαρισαῖοι καί τινες τῶν γραμματέων ἐλθόντες ἀπὸ Ἱεροσολύμων
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: ar
  text: واجتمع إليه الفريسيون وبعض الكتبة الذين جاؤوا من أورشليم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: وَ
  rationale: تحفظ أداة الربط السردي الشائعة عند مرقس بصورة طبيعية موجزة في العربية.
- source_word: συνάγονται πρὸς αὐτὸν
  choice: اجتمع إليه
  rationale: تعبير عربي طبيعي يحفظ معنى اجتماعهم متجهين إلى يسوع، من غير إضافة دلالة «أحاطوا به» التي لا يصرّح بها اليوناني.
- source_word: οἱ Φαρισαῖοι
  choice: الفريسيون
  rationale: المقابل العربي المعياري لاسم هذه الجماعة اليهودية.
- source_word: τινες τῶν γραμματέων
  choice: بعض الكتبة
  rationale: يحفظ معنى التبعيض في التركيب اليوناني، أي بعض أفراد فئة الكتبة.
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: الذين جاؤوا من أورشليم
  rationale: تصوغ اسم الفاعل الماضي في عبارة موصولة عربية واضحة، وتحفظ كون المجيء سابقًا للاجتماع من غير إثقال الأسلوب.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل الماضي «اجتمع» وفق الأسلوب السردي العربي الطبيعي، مع أن اليونانية تستخدم الحاضر السردي. يعود الموصول «الذين جاؤوا» نحويًا إلى الفريسيين وبعض الكتبة معًا، كما يسمح تركيب الأصل.
