source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: ar
  text: وانفتحت أذناه[a]، وانحلَّ قيد لسانه[b]، وتكلَّم بوضوح[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انفتح سمعه». يمكن أن تشير الكلمة اليونانية إلى حاسة السمع كما تشير إلى الأذنين.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «انحلَّ قيد لسانه»؛ أي زال ما كان يعيق نطقه.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «على نحو سليم» أو «على نحو صحيح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: انفتحت
  rationale: يحافظ الفعل على صورة الانفتاح وعلى دلالة المبني للمجهول في اليونانية بصورة عربية طبيعية؛ فصيغة «انفتحت» تفيد وقوع الفعل على الأذنين من غير تسمية الفاعل.
- source_word: αἱ ἀκοαί
  choice: أذناه
  rationale: يمكن أن تدل اللفظة اليونانية على الأذنين أو على حاسة السمع. اختير التعبير المحسوس الطبيعي في العربية، مع إثبات البديل في الحاشية.
- source_word: ἐλύθη
  choice: انحلَّ
  rationale: ينقل معنى فكّ ما كان رابطًا أو مقيّدًا، ويلائم استعارة القيد في العربية من غير تحويل العبارة إلى وصف طبي تفسيري.
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: قيد لسانه
  rationale: يحفظ الصورة الملموسة في الأصل، حيث يصوَّر العائق الذي يمنع الكلام كقيد، بدل استبدالها مباشرة بعبارة «عائق النطق».
- source_word: ἐλάλει
  choice: تكلَّم
  rationale: صياغة سردية عربية طبيعية تدل على ظهور القدرة المستعادة على الكلام، من غير إضافة معنى البدء الذي لا يصرّح به الفعل.
- source_word: ὀρθῶς
  choice: بوضوح
  rationale: يفيد السياق أن كلامه صار مفهومًا وسليمًا بعد الشفاء. «بوضوح» طبيعية للقارئ العربي، مع ذكر دلالتي الصواب والسلامة في الحاشية.
theological_decisions:
- issue: هل تُحفظ استعارة قيد اللسان أم تُستبدل بتفسير طبي؟
  choice: 'الإبقاء على الاستعارة: «انحلَّ قيد لسانه»'
  alternative: زال عائق نطقه
  rationale: النص يصف الشفاء بلغة تصويرية لا بمصطلح سريري. حفظ الصورة يصون طريقة التعبير الأصلية ولا يضيف تحديدًا طبيًا غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على التوازي السردي والصورة المجازية في الأصل. وُضعت علامات الحواشي بعد الألفاظ التي تشرحها مباشرة.
