source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: ar
  text: 'وكان يقول لها: «دعي الأبناء يشبعون أولًا، فإنه لا يحسن أن تأخذي خبز الأبناء وتطرحيه للكلاب الصغيرة[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «كلاب البيت»، أو ببساطة «الكلاب». تستعمل اليونانية صيغة تصغير قد توحي بكلاب صغيرة أو منزلية، بدل التشديد على صورة الكلاب الضالة التي تقتات من القمامة.
    reason: بديل معجمي يوضح دلالة صيغة التصغير من غير حسم موضع الخلاف في المتن.
lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: يحفظ دلالة الماضي الناقص على القول المستمر في هذا المشهد، مع بقاء العبارة طبيعية بالعربية.
- source_word: Ἄφες
  choice: دعي
  rationale: أمر للمخاطبة بمعنى السماح أو الإتاحة، و«دعي» موجزة وطبيعية في السياق.
- source_word: πρῶτον
  choice: أولًا
  rationale: يحفظ الترتيب والأولوية من غير أن يحسم ما إذا كان الآخرون سينالون لاحقًا.
- source_word: χορτασθῆναι
  choice: يشبعون
  rationale: الفعل يدل على الأكل إلى حد الشبع؛ و«يشبعون» يحفظ صلة الكلام بصورة الخبز والمائدة.
- source_word: τὰ τέκνα
  choice: البنين
  rationale: «البنون» هنا تشمل الأولاد والبنات في الاستعمال العربي الفصيح، وتحفظ الاستعارة الأسرية من غير تفسير مرجعها داخل النص.
- source_word: καλόν ἐστιν
  choice: ليس حسنًا
  rationale: ينقل معنى ما هو حسن أو لائق، ويحافظ على الصياغة القريبة من اليونانية من غير تضييقها إلى حكم قانوني أو أخلاقي صريح.
- source_word: λαβεῖν
  choice: أن يؤخذ
  rationale: المصدر اليوناني يعني الأخذ؛ وصيغة المبني للمجهول العربية تجعل العبارة طبيعية مع بقاء الفاعل غير مذكور كما لا يبرزه السياق.
- source_word: ἄρτον
  choice: خبز
  rationale: المقابل المباشر الذي يحفظ صورة المائدة المنزلية، بخلاف تعميمه إلى «طعام».
- source_word: κυναρίοις
  choice: الكلاب الصغيرة
  rationale: يحفظ صيغة التصغير اليونانية وما قد توحي به من كلاب صغيرة أو منزلية، من غير تحويلها إلى «جراء» على نحو أكثر تخصيصًا.
- source_word: βαλεῖν
  choice: يُطرح للكلاب الصغيرة
  rationale: «يُطرح» يحفظ حيوية فعل الإلقاء، واللام تؤدي معنى توجيه الخبز إليها بصورة عربية سليمة.
theological_decisions:
- issue: الدلالة المجازية للبنين والكلاب الصغيرة
  choice: الإبقاء على الاستعارة المنزلية من غير التصريح بهوية كل فريق في المتن.
  alternative: تفسير «البنين» بإسرائيل أو اليهود و«الكلاب الصغيرة» بالأمم في نص الترجمة.
  rationale: النص اليوناني يورد صورة مجازية ولا يصرح بتفسيرها؛ إبقاؤها يحفظ قوتها السردية واللاهوتية ولا يُدخل شرحًا مذهبيًا في المتن.
- issue: دلالة πρῶτον (أولًا)
  choice: إثبات «أولًا» في المتن.
  alternative: حذفها لتنعيم العبارة أو صياغة الأولوية كاستبعاد نهائي للآخرين.
  rationale: تحفظ اللفظة أولوية البنين مع إبقاء احتمال الامتداد اللاحق إلى غيرهم، وبذلك لا تُحلّ الموازنة اللاهوتية الكامنة في القول قسرًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «البنين» بوصفها جمعًا شاملًا في هذا السياق الأسري، و«ليس حسنًا» للمحافظة على اتساع καλόν، مع إبقاء التوازي بين خبز البنين والكلاب الصغيرة.
