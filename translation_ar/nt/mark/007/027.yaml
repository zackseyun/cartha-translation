  to: 'وكان يقول لها: «دعي الأبناء يشبعون أولًا، فإنه لا يحسن أن تأخذي خبز الأبناء وتطرحيه للكلاب الصغيرة[a]».'
  rationale: التعديل الضروري هو إعادة الفعلين إلى صيغة نشطة في العربية، بما يطابق المصدر اليوناني ويحافظ على كون العبارة خطابًا مباشرًا للمرأة. واستُبدلت «البنين» بـ«الأبناء» لتحسين الوضوح المعاصر مع إبقاء الاستعارة الأسرية غير مفسَّرة. ولا تغيير في دلالة «أولًا» أو في صورة الكلاب الصغيرة.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:03Z'
