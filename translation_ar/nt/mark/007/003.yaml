base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: ar
  text: لأن الفريسيين واليهود جميعًا لا يأكلون ما لم يغسلوا أيديهم بالقبضة[a]، متمسكين بتقليد الشيوخ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بالقبضة»؛ وربما كان المعنى «إلى الرسغ» أو «غسلًا جيدًا». اللفظة اليونانية عسيرة التفسير، ويُرجَّح أنها تشير إلى طريقة معتادة في غسل اليدين طقسيًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: لأن
  rationale: تحفظ القوة التفسيرية للأداة اليونانية وتصل الجملة بما قبلها اتصالًا طبيعيًا.
- source_word: Φαρισαῖοι
  choice: الفريسيين
  rationale: النقل العربي المعياري لاسم هذه الجماعة اليهودية.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: اليهود جميعًا
  rationale: يحفظ التعميم الصريح في اليونانية من غير تضييقه إلى سكان اليهودية أو تخفيفه إلى «كثيرين».
- source_word: ἐὰν μὴ
  choice: ما لم
  rationale: تعبير عربي طبيعي عن الشرط المنفي بمعنى «إلا إذا».
- source_word: πυγμῇ
  choice: بقبضة اليد[a]
  rationale: صياغة قريبة من اللفظ اليوناني المختلف في تفسيره، مع إبقاء الاحتمالات الدلالية في الحاشية بدل حسمها داخل المتن.
- source_word: νίψωνται τὰς χεῖρας
  choice: يغسلوا أيديهم
  rationale: ينقل بوضوح غسل عضو من الجسد، وهو اليدان هنا.
- source_word: οὐκ ἐσθίουσιν
  choice: لا يأكلون
  rationale: يحفظ دلالة العادة في المضارع من غير إضافة مفعول غير مذكور.
- source_word: κρατοῦντες
  choice: متمسكين
  rationale: يعبر عن الالتزام الراسخ بالتقليد، ويحفظ علاقة اسم الفاعل بالفعل الرئيس.
- source_word: τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: بتقليد الشيوخ
  rationale: ترجمة موجزة وطبيعية للتقليد المتوارث المنسوب إلى الشيوخ.
theological_decisions:
- issue: مدى تعبير «اليهود جميعًا»
  choice: الإبقاء على التعميم كما ورد في النص
  alternative: أهل اليهودية جميعًا؛ كثير من اليهود
  rationale: النص اليوناني يقول صراحة «جميع اليهود». وهو تعميم تفسيري بلاغي في السياق، لا يلزم أن يكون إحصاءً حرفيًا لكل فرد.
- issue: معنى πυγμῇ
  choice: بقبضة اليد مع حاشية توضح الخلاف
  alternative: إلى الرسغ؛ بعناية؛ جيدًا
  rationale: اللفظة عسيرة ومختلف في المقصود بها، وقد تشير إلى طريقة أو مدى مخصوصين في غسل اليدين طقسيًا؛ لذلك لا ينبغي حسم الغموض في المتن بلا تنبيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «متمسكين» بدل تركيب أثقل، وأُبقي التعبير المختلف فيه قريبًا من صورة الأصل مع حاشية تمنع الإيهام بأنه معنى محسوم.
