  verdict: revise
  source_fidelity: 'المسودة تنقل عناصر النص الأساسية بأمانة: الدخول إلى بيتٍ غير معرّف، والانفصال عن الجمع، وسؤال التلاميذ عن «المثل». لكن «دخل بيتًا مبتعدًا عن الجمع» تجعل الحال «مبتعدًا» ثقيلة وملتبسة في العربية؛ فقد تُفهَم على أنها تصف حركة يسوع أثناء الدخول أكثر من تحديد انفصاله عن الجمع. كما أن الفعل اليوناني الناقص ἐπηρώτων يسمح بتمثيل طابع السؤال المستمر/المتكرر تمثيلًا طبيعيًا.'
  naturalness: 'الصياغة المعدلة أكثر سلاسة في الفصحى الحديثة: «حين دخل بيتًا بعيدًا عن الجمع، أخذ تلاميذه يسألونه عن المثل». وهي تحافظ على السرد الوقور الواضح، وتزيل التباس الحال في النص الحالي.'
  terminology: «المثل» هو المقابل العربي المألوف والدقيق لـ παραβολή في سياق الأناجيل. وتبقى الحاشية ملائمة لإتاحة البدائل الدلالية من غير استبدال المصطلح الرئيس. حُذفت الكتابة الصوتية اليونانية غير اللازمة، مع الإبقاء على اللفظ اليوناني نفسه في الحاشية.
