revisions:
- from: ولمّا دخل بيتًا مبتعدًا عن الجمع، سأله تلاميذه عن المثل.[a]
  to: وحين دخل بيتًا بعيدًا عن الجمع، أخذ تلاميذه يسألونه عن المثل.[a]
  rationale: تُستبدل الحال الملتبسة بتعبير عربي واضح يبيّن الانفصال عن الجمع، ويُستعمل تركيب «أخذ ... يسألونه» لتمثيل الفعل الناقص تمثيلًا طبيعيًا. ولا يتغير معنى الآية أو المصطلح الرئيس، وتبقى الحاشية مرتبطة بلفظ «المثل».
