  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: ar
  text: وحين دخل بيتًا بعيدًا عن الجمع، أخذ تلاميذه يسألونه عن المثل.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «القول» أو «المثل التوضيحي». والكلمة اليونانية هي παραβολή.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: أداة ربط تحافظ على تتابع السرد المميّز في مرقس من غير إثقال العبارة.
- source_word: ὅτε
  choice: لمّا
  rationale: أداة زمنية طبيعية في السرد العربي، تعبّر عن الظرف الذي وقع فيه سؤال التلاميذ.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: دخل بيتًا
  rationale: يحافظ على معنى فعل الدخول، ويعكس غياب أداة التعريف عن οἶκον، لذلك لم تُترجم «البيت».
- source_word: ἀπὸ τοῦ ὄχλου
  choice: مبتعدًا عن الجمع
  rationale: يبيّن أن دخوله البيت فصله عن الجمع، بصياغة عربية طبيعية من غير إضافة معنى جديد.
- source_word: ἐπηρώτων
  choice: سأله
  rationale: الماضي البسيط هو الأنسب للسرد العربي؛ ودلالة الجمع ظاهرة في الفاعل «تلاميذه»، مع أن صيغة اليونانية الناقصة قد توحي باستمرار السؤال.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: صياغة عربية موجزة وطبيعية تحفظ علاقة التلاميذ به.
- source_word: τὴν παραβολήν
  choice: المثل
  rationale: المقابل العربي المألوف لـ παραβολή، ويحفظ تصنيف مرقس للكلام بوصفه تعليمًا تصويريًا بدل تضييقه إلى مجرد قول.
theological_decisions:
- issue: دلالة παραβολή في سياق يمكن أن يشير فيه اللفظ إلى قول تصويري موجز
  choice: المثل
  alternative: القول أو الكلام التصويري
  rationale: يحافظ «المثل» على المصطلح اليوناني وعلى طريقة مرقس في عرض تعليم يسوع، مع إبقاء البدائل الدلالية في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الجمع» للدلالة على جمهور الناس، و«دخل بيتًا» للمحافظة على التنكير في الأصل. وُضعت علامة الحاشية بعد «المثل» لأنها تخص هذا اللفظ.
