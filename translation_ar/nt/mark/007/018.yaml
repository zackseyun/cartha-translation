source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: ar
  text: 'وقال لهم: «أفأنتم أيضًا إلى هذا الحد بلا فهم؟ ألا تدركون أن كل ما يدخل الإنسان من الخارج لا يقدر أن ينجّسه[a]،»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يجعله نجسًا». يحمل الفعل اليوناني في هذا السياق دلالة تتصل بأحكام الطهارة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: وقال
  rationale: المضارع التاريخي اليوناني صيغ بالماضي، وهو الأسلوب الطبيعي في السرد العربي مع بقاء وظيفة الانتقال إلى كلام يسوع.
- source_word: Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε
  choice: أفأنتم أيضًا بلا فهم؟
  rationale: تنقل الصياغة نبرة التوبيخ الاستفهامي وقوة «أيضًا»، وتربط طبيعيًا بما سبق من السياق.
- source_word: νοεῖτε
  choice: تدركون
  rationale: لفظ عربي واضح يدل على الفهم الواعي، ويتجنب تكرار «فهم» تكرارًا ثقيلًا مع الحفاظ على التقارب الدلالي.
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον
  choice: كل ما يدخل الإنسان من الخارج
  rationale: صياغة عربية طبيعية تحفظ شمول πᾶν، وحركة الدخول، ومصدر الشيء من الخارج؛ و«الإنسان» هنا اسم جنس مفرد.
- source_word: οὐ δύναται αὐτὸν κοινῶσαι
  choice: لا يقدر أن ينجّسه
  rationale: «ينجّسه» موجزة وتلائم سياق الطهارة، و«لا يقدر» تحافظ على دلالة القدرة الصريحة في οὐ δύναται.
theological_decisions:
- issue: دلالة κοινόω في سياق الطهارة
  choice: ينجّسه
  alternative: يجعله نجسًا / غير طاهر
  rationale: يحمل الفعل هنا إيحاءات النجاسة بحسب أحكام الطهارة، لا الفساد الأخلاقي وحده؛ لذلك أُبقي المصطلح موجزًا مع توضيح الدلالة في الحاشية، من غير حسم نتائج لاهوتية تتجاوز الآية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدم «الإنسان» استعمالًا جنسيًا عامًا، وصيغ الاستفهام الأول بالفاء ليعكس اتصال التوبيخ بما قبله.
