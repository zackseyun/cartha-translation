  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: ar
  text: وأمرهم ألّا يخبروا أحدًا. ولكن بقدر ما كان يشدّد عليهم في الأمر[a]، كانوا هم يذيعونه أكثر فأكثر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكلما شدّد عليهم في الأمر، كانوا يذيعونه أكثر فأكثر».'
    reason: بديل لغوي يحفظ العلاقة بين مقدار أو تكرار التشديد في الأمر وازدياد إذاعتهم للخبر.
lexical_decisions:
- source_word: διεστείλατο
  choice: أمرهم
  rationale: يفيد الفعل هنا توجيهًا حازمًا، و«أمرهم» عربية واضحة تحفظ قوة النهي دون زيادة تفسيرية.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: ألّا يخبروا أحدًا
  rationale: ينقل مضمون الأمر بصياغة عربية طبيعية، و«يخبروا» يلائم سياق نقل خبر ما حدث.
- source_word: ὅσον ... διεστέλλετο
  choice: كلما أمرهم
  rationale: تنقل «كلما» العلاقة التدرجية مع صيغة الماضي الناقص التي توحي بتكرار الأمر واستمراره.
- source_word: αὐτοὶ
  choice: هم
  rationale: 'أُثبت ضمير الفصل لإبراز المقابلة: مع أن يسوع أمرهم، فإنهم هم واصلوا المناداة.'
- source_word: μᾶλλον περισσότερον
  choice: أكثر فأكثر
  rationale: تحفظ هذه العبارة توكيد الزيادة في الظرفين اليونانيين مع بقاء الأسلوب طبيعيًا وواضحًا.
- source_word: ἐκήρυσσον
  choice: ينادون به
  rationale: يفيد κηρύσσω الإعلان العلني الواسع؛ و«ينادون به» يحفظ هذا المعنى دون الإيحاء بالوعظ الاصطلاحي. والضمير «به» يصرح بالمضمون المفهوم من السياق.
theological_decisions:
- issue: سرّ المسيح وقوة أمر يسوع
  choice: صيغ النهي بوصفه أمرًا حقيقيًا، مع إبقاء مخالفة الحاضرين له ظاهرة في النص دون تعليل.
  alternative: استعمال «حذّرهم بشدة» أو إضافة تفسير لسبب طلب الكتمان.
  rationale: النص يثبت أمرًا حازمًا بالصمت ثم يبرز ازدياد إعلانهم، لكنه لا يذكر سبب الأمر؛ لذلك ينبغي صون هذا التوتر دون إدخال تفسير لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «ألّا» و«أكثر فأكثر» لسلاسة القراءة، مع تجنب العبارات الوعظية الاصطلاحية أو التفسيرية.
