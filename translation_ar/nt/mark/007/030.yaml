  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: ar
  text: وَلَمَّا ذَهَبَتْ إِلَى بَيْتِهَا، وَجَدَتِ الطِّفْلَةَ مُلْقَاةً عَلَى السَّرِيرِ، وَالشَّيْطَانُ قَدْ خَرَجَ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς
  choice: وَلَمَّا ذَهَبَتْ إِلَى بَيْتِهَا
  rationale: ينقل اسم الفاعل الماضي بوصفه حدثًا سابقًا للفعل الرئيس، بصياغة عربية طبيعية تحافظ على تعاقب الأحداث، كما يحافظ «إلى بيتها» على دلالة الحركة نحو مسكنها.
- source_word: εὗρεν
  choice: وَجَدَتْ
  rationale: المقابل العربي المباشر والطبيعي في السياق القصصي.
- source_word: παιδίον
  choice: الطِّفْلَةَ
  rationale: اللفظ اليوناني يعني «الطفل»، وسياق المقطع يبيّن أن المقصود ابنتها؛ لذلك يقتضي العربية تحديد التأنيث لتوافق المرجع من غير إضافة معنى جديد.
- source_word: βεβλημένον ἐπὶ τὴν κλίνην
  choice: مُلْقَاةً عَلَى السَّرِيرِ
  rationale: يحافظ «ملقاة» على صورة اسم المفعول في اليونانية وعلى حالة الطفلة الناتجة، بينما ينقل «على السرير» حرف الجر بوضوح ومن غير أن يوحي النص بالضرورة بالعنف.
- source_word: δαιμόνιον
  choice: الشَّيْطَانُ
  rationale: مقابل عربي مألوف لـδαιμόνιον، مع عدم استبداله بعبارة «الروح النجس» لأن هذه الآية تستعمل لفظًا مختلفًا.
- source_word: ἐξεληλυθός
  choice: قَدْ خَرَجَ مِنْهَا
  rationale: 'تنقل «قد خرج» دلالة الفعل التام: حدث الخروج واكتملت نتيجته. أُضيف «منها» لتكون العبارة طبيعية واضحة بالعربية، مع بيان الصياغة الأقرب إلى ظاهر اليونانية في الحاشية.'
theological_decisions:
- issue: وصف نتيجة إخراج الشيطان
  choice: وَقَدْ خَرَجَ مِنْهَا الشَّيْطَانُ
  alternative: وَالشَّيْطَانُ قَدْ خَرَجَ
  rationale: تحافظ الصياغة على حقيقة الخروج المكتمل وعلى غياب الشيطان الناتج عنه، من غير شرح سبب حالة الطفلة أو إضافة تفاصيل لاهوتية لا يذكرها النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل الضبط الجزئي الموسع لتيسير القراءة، وحُفظ ترتيب المشهد وتسلسل أفعاله من غير توسع تفسيري.
