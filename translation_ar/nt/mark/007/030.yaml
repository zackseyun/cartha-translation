review_pass:
  verdict: revise
  source_fidelity: الصياغة سليمة في نقل تسلسل الأحداث، و«الطفلة» مناسبة في ضوء سياق الآية السابقة، و«ملقاة على السرير» تعكس الحالة الناتجة التي يفيدها اسم المفعول اليوناني. لكن إضافة «منها» تجعل موضع خروج الشيطان صريحًا في المتن، مع أنه غير مذكور صراحة في هذه الآية اليونانية، وإن كان مفهومًا من السياق.
  naturalness: العربية فصيحة وواضحة. والأفصح والأشد التصاقًا بالبنية الأصلية أن يقال «والشيطان قد خرج» بدل تقديم شبه الجملة المضافة «منها».
  terminology: «الشيطان» استعمال عربي كتابي مألوف لترجمة δαιμόνιον في هذا السياق، ولا يلزم استبداله. وتحافظ عبارة «قد خرج» على دلالة الفعل التام والنتيجة القائمة.
  issues:
  - severity: medium
    issue: إضافة «منها» إلى المتن
    rationale: لا تتضمن اليونانية في هذه الآية ضميرًا أو عبارة تحدد أن الشيطان خرج منها؛ والسياق يتيح فهم ذلك، لكن الترجمة المتكافئة لا تحتاج إلى جعله تصريحًا في المتن. الحاشية الحالية تقر بأن الإضافة ليست في الأصل، ولذلك الأفضل حذفها بدل الإبقاء على إضافة مفسرة مع حاشية.
