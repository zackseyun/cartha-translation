  to: وَلَمَّا ذَهَبَتْ إِلَى بَيْتِهَا، وَجَدَتِ الطِّفْلَةَ مُلْقَاةً عَلَى السَّرِيرِ، وَالشَّيْطَانُ قَدْ خَرَجَ.
  rationale: حُذفت «منها» لأنها توضيح سياقي غير مصرَّح به في نص الآية اليوناني، وحُذفت الحاشية التابعة لها. وبقيت دلالة الخروج المكتمل في «قد خرج»، مع المحافظة على ترتيب المشهد ووضوح العربية.
  reviewer_model: gpt-5.6-terra
