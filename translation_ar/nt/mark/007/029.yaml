  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: ar
  text: 'فقال لها: «بسبب هذا القول[a]، اذهبي؛ فقد خرج الشيطان من ابنتك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأجل هذه الكلمة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: فقال لها
  rationale: تنقل الفاءُ اتصالَ السرد الذي تؤديه καί بصورة طبيعية في العربية، من غير إضافة دلالة زمنية زائدة، وتحافظ «قال لها» على المخاطبة المؤنثة.
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: لأجل هذا الكلام
  rationale: تؤدي «لأجل» معنى السبب في διά مع حالة النصب، وتشير «هذا الكلام» إلى جواب المرأة السابق مع الحفاظ على إفراد λόγος. ويظل «بسبب هذا القول» بديلًا صحيحًا.
- source_word: ὕπαγε
  choice: اذهبي
  rationale: صيغة أمر مؤنث واضحة وطبيعية، وتؤدي هنا معنى الإذن بالانصراف من غير إضافة عبارة غير موجودة في اليونانية.
- source_word: ἐξελήλυθεν
  choice: لقد خرج
  rationale: يفيد الفعل اليوناني حدثًا تمّ وما زالت نتيجته قائمة؛ وتساعد «لقد» مع الماضي على إبراز تمام الخروج، مع إبقاء صورة الخروج المكانية.
- source_word: ἐκ τῆς θυγατρός σου
  choice: من ابنتك
  rationale: تنقل «من» معنى ἐκ، أي خروج الشيطان من الشخص الذي كان فيه، بعبارة عربية مباشرة وطبيعية.
- source_word: τὸ δαιμόνιον
  choice: الشيطان
  rationale: «شيطان» هو المقابل العربي المباشر هنا لكائن شيطاني، ولا يستبدل اللفظ اليوناني بعبارة «الروح النجس» الواردة في مواضع أخرى.
theological_decisions:
- issue: صياغة لغة إخراج الشياطين من غير تلطيف الادعاء فوق الطبيعي
  choice: لقد خرج الشيطان من ابنتك
  alternative: لقد فارق الروح الشرير ابنتك
  rationale: يذكر النص اليوناني δαιμόνιον صراحة ويقرر خروجه من الابنة؛ لذلك تحافظ الصياغة على المرجع الشخصي الشيطاني وعلى صورة الخروج، ولا تحوله إلى مرض مبهم أو تأثير مجازي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «اذهبي» لمطابقة جنس المخاطبة، ووُضع البديل في الحاشية لحفظ إمكان ترجمة λόγος بـ«القول» وδιά بـ«بسبب».
