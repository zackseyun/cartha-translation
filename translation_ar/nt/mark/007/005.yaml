  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: الفاعلان («الفريسيون والكتبة»)، فعل السؤال، الاستفهام، السلوك بحسب تقليد الشيوخ، وأكل الخبز بأيدٍ ذات وصف طقسي. صيغة «لا يسلك تلاميذك» سليمة؛ فالفعل المفرد جاء قبل فاعل جمع ظاهر. وإظهار اسم «يسوع» بدل الضمير لا يغير المعنى ويزيل الالتباس عند استقلال الآية.'
  naturalness: الصياغة فصيحة واضحة ومناسبة لسجل عربي كتابي حديث. «يسلك بحسب» و«تقليد الشيوخ» تعبيران طبيعيان في هذا السياق، و«بأيدٍ دنسة» مفهوم مع تفسيره في الحاشية.
  terminology: «الكتبة» مقابل راسخ لـ γραμματεῖς، و«الشيوخ» يحافظ على الإحالة إلى السلطات السابقة دون إسقاط دلالة كنسية لاحقة. «دنسة» مناسبة لـ κοιναῖς في سياق الدنس الطقسي، وتمتاز عن «نجسة» التي قد توحي بلفظ ἀκάθαρτος. والحاشية تحافظ على المعنى الحرفي لـ «عادية/مشتركة» وتشرح المقصود الطقسي.
