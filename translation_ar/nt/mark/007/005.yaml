source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: ar
  text: 'فسأل الفريسيون والكتبة يسوع: «لماذا لا يسلك تلاميذك بحسب تقليد الشيوخ، بل يأكلون الخبز بأيدٍ دنسة[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بأيدٍ عادية»، أي بأيدٍ تُعَدّ مدنسة من الناحية الطقسية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: فسأل
  rationale: المضارع هنا مضارع تاريخي في السرد، وصيغة الماضي هي الطبيعية في العربية، من غير تحميل الفعل معنى التكرار.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: المقابل العربي المألوف لهذه الفئة من علماء الشريعة في سياق الأناجيل، وهو أقل تفسيرًا من «معلمي الشريعة».
- source_word: Διὰ τί
  choice: لماذا
  rationale: أفصح مقابل استفهامي طبيعي ومباشر.
- source_word: περιπατοῦσιν
  choice: يسلك
  rationale: يحفظ استعارة المشي الدالة على نهج الحياة والتصرف، وهي مفهومة في العربية الكتابية المعاصرة.
- source_word: κατὰ τὴν παράδοσιν
  choice: بحسب تقليد
  rationale: ينقل معنى موافقة معيار موروث، مع صياغة عربية موجزة وطبيعية.
- source_word: τῶν πρεσβυτέρων
  choice: الشيوخ
  rationale: ترجمة مباشرة تشير هنا إلى أصحاب السلطة الدينية السابقين المرتبطين بالتقليد، من غير تحويلها إلى وصف كنسي لاحق.
- source_word: κοιναῖς χερσὶν
  choice: بأيدٍ دنسة
  rationale: يدل κοινός في هذا السياق على الدنس الطقسي لا على القذارة الجسدية؛ و«دنسة» توصل هذا المعنى مع إبقاء «عادية» الحرفية في الحاشية.
- source_word: ἄρτον
  choice: الخبز
  rationale: يحفظ الاسم اليوناني المفرد بدل توسيعه تفسيريًا إلى «الطعام»، مع إمكان دلالته السياقية على الأكل عمومًا.
theological_decisions:
- issue: الدلالة الطقسية للفظ κοινός
  choice: دنسة
  alternative: نجسة؛ عادية
  rationale: النزاع متعلق بحالة اليدين بحسب تقليد الطهارة، لا بالشر الأخلاقي أو النظافة الصحية. «دنسة» تحافظ على القوة الدينية والطقسية، والحاشية تصون المعنى الحرفي غير المألوف.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقيت عبارتا «يسلك» و«الخبز» لقربهما من الصورة والنص اليونانيين، مع توضيح البعد الطقسي في الحاشية. ذُكر «يسوع» بدل الضمير منعًا لالتباس المرجع عند عرض الآية منفردة.
