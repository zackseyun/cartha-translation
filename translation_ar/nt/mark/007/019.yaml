    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: قلبه
  rationale: يحفظ الصورة الأنثروبولوجية الكتابية والتقابل بين باطن الإنسان والجهاز الهضمي دون تفسير زائد.
- source_word: κοιλίαν
  choice: جوفه
  rationale: لفظ عربي طبيعي ومحتشم يدل هنا على موضع الهضم، وهو أوسع قليلًا من «المعدة» ويناسب κοιλία.
- source_word: ἀφεδρῶνα
  choice: المِرحاض
  rationale: يدل بوضوح وبأسلوب لائق على موضع قضاء الحاجة، من غير افتراض شبكة صرف بعينها.
- source_word: καθαρίζων
  choice: وبذلك يطهِّر
  rationale: ترجمة مباشرة نسبيًا لاسم الفاعل المفرد المذكر، مع إبقاء علاقته النحوية وتفسير فاعله موضع نقاش.
- source_word: βρώματα
  choice: جميع الأطعمة
  rationale: يحفظ صيغة الجمع اليونانية وسياق أصناف المأكولات.
- source_word: αὐτοῦ
  choice: ـه
  rationale: يحيل إلى الإنسان المذكور في السياق، وفق الاستعمال التمثيلي للمفرد.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: يدخل / يخرج
  rationale: يحفظ تقابل حركة الدخول والخروج بصياغة عربية مباشرة.
theological_decisions:
- issue: تفسير καθαρίζων πάντα τὰ βρώματα
  choice: 'إبقاء العبارة في المتن: «وبذلك يطهِّر جميع الأطعمة»، بما يسمح بفهمها تعليقًا سرديًا يفيد تطهير الأطعمة كلها'
  alternative: 'ربط العبارة بعملية الهضم والإخراج: «فيُنقّي جميع الأطعمة» أو «فيطرح جميع الأطعمة»'
  rationale: اسم الفاعل المذكر المفرد يُفهم على نطاق واسع بوصفه تعليقًا من مرقس على نتيجة كلام يسوع، لكن الربط بالعملية الجسدية ممكن نحويًا ودلاليًا. لذلك حُفظت الصياغة المباشرة، وأُثبت البديل الحقيقي في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومحتشمة. اختير «الجوف» و«المِرحاض» للموازنة بين الدقة والطبيعية، وحُفظت الاستعارة الكتابية في «القلب». وُضعت علامة الحاشية بعد الجملة التي تتعلق بها.
