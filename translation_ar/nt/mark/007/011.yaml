  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: ar
  text: 'أَمَّا أَنْتُمْ فَتَقُولُونَ: «إِنْ قَالَ إِنْسَانٌ لِأَبِيهِ أَوْ أُمِّهِ: ‹قُرْبَانٌ›[a]، أَيْ هَدِيَّةٌ[b]، هُوَ كُلُّ مَا قَدْ تَنْتَفِعُ بِهِ مِنِّي—»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «قُرْبان» لفظ يُطلق على ما يُكرَّس هديةً لله، ولذلك يُحجب عن الاستعمال العادي للأسرة.
    reason: cultural_note
  - marker: b
    text: 'أو: «تقدمة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: أَمَّا أَنْتُمْ فَتَقُولُونَ
  rationale: ينقل التقابل الذي تفيده δὲ مع إبراز الضمير ὑμεῖς، ويحافظ على دلالة المضارع في قول عام متكرر.
- source_word: Ἐὰν εἴπῃ
  choice: إِنْ قَالَ
  rationale: صياغة عربية طبيعية لشرط احتمالي يعبّر عنه اليوناني بـἐὰν مع صيغة الالتزام.
- source_word: ἄνθρωπος
  choice: إِنْسَانٌ
  rationale: يدل اللفظ هنا على فرد على وجه التمثيل؛ و«إنسان» عربية واضحة تحفظ عموم اللفظ من غير إضافة معنى غير موجود.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: لِأَبِيهِ أَوْ أُمِّهِ
  rationale: اللام تحدد المخاطَب، وذكر الأب والأم صراحة يحفظ التوازن العائلي في الأصل.
- source_word: Κορβᾶν
  choice: قُرْبَانٌ
  rationale: يحفظ اللفظ السامي الذي أبقاه النص اليوناني نفسه، مع بيان معناه في العبارة التالية والحاشية.
- source_word: ὅ ἐστιν Δῶρον
  choice: أَيْ هَدِيَّةٌ
  rationale: «أي» تؤدي وظيفة الشرح، و«هدية» هي المقابل المباشر لـδῶρον، مع إثبات البديل السياقي «تقدمة» في الحاشية.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: هُوَ كُلُّ مَا كَانَ يُمْكِنُ أَنْ تَنْتَفِعَ بِهِ مِنِّي
  rationale: «كل ما» تحفظ عدم التحديد في العبارة الموصولة، و«تنتفع به مني» تنقل معنى ὠφεληθῇς من غير حصره في المال، أما الشرطة فتبيّن أن التركيب يكتمل في العدد التالي.
theological_decisions:
- issue: صيغة النذر «Κορβᾶν» في سياق تكريس المال ومنعه عن الانتفاع العائلي
  choice: إبقاء اللفظ «قُرْبَانٌ» في المتن، ثم شرحه بعبارة «أي هدية».
  alternative: ترجمته مباشرةً إلى «تقدمة» أو «هدية مكرسة لله».
  rationale: النص اليوناني نفسه يحتفظ باللفظ السامي ثم يشرحه؛ لذلك يحفظ نقله خصوصية المثال التاريخية والدينية من غير تحميل العبارة تفاصيل لاحقة عن أحكام النذور.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. أُبقيت بنية القول المباشر والشرطة الختامية لأن الجملة تتواصل نحويًّا في مرقس 7:12، ووُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرةً.
