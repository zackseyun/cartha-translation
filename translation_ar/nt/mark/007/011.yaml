  source_fidelity: 'النص يحفظ التقابل في «أمّا أنتم»، والشرط، والمخاطَبين، ولفظ «قربان» مع شرح مرقس له، كما يحافظ على عدم اكتمال الجملة في هذا العدد بالشرطة الختامية. لكن «كان يمكن أن تنتفع به» تميل إلى منفعة ماضية أو افتراضية منتهية، بينما تفيد ὃ ἐὰν ... ὠφεληθῇς حالة غير محددة ومتوقعة: «ما قد تنتفع به مني».'
