  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: ar
  text: 'ورفع عينيه نحو السماء، وتنهد[a]، وقال له: «إفَّثَا»[b]، أي: «انفتح».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أَنَّ»؛ فقد يدل الفعل اليوناني على تنهد عميق أو أنين.'
    reason: lexical_alternative
  - marker: b
    text: '«إفَّثَا» لفظة آرامية معناها: «انفتح».'
    reason: cultural_note
lexical_decisions:
- source_word: ἀναβλέψας
  choice: ورفع عينيه
  rationale: ينقل فعل النظر إلى أعلى بعبارة عربية طبيعية، مع إبراز الحركة السابقة للفعل الرئيس التي تفيدها صيغة اسم الفاعل اليونانية.
- source_word: εἰς τὸν οὐρανόν
  choice: نحو السماء
  rationale: تعبير عربي واضح يحفظ اتجاه النظر إلى السماء، من غير أن يحسم ما إذا كان التركيز على السماء المنظورة أو مقام الله.
- source_word: ἐστέναξεν
  choice: تنهد
  rationale: الفعل اليوناني قد يدل على التنهد أو الأنين؛ و«تنهد» أنسب في السياق وأقل مبالغة، مع إثبات البديل في الحاشية.
- source_word: λέγει αὐτῷ
  choice: وقال له
  rationale: يُنقل المضارع التاريخي بصيغة الماضي الملائمة للسرد العربي، مع إبقاء المخاطَب مذكورًا.
- source_word: Εφφαθα
  choice: إفَّثَح
  rationale: نقل صوتي للفظة الآرامية التي أبقاها مرقس، مع الحفاظ على نسيج النص الأصلي ثم إيراد تفسيرها.
- source_word: Διανοίχθητι
  choice: انفتح
  rationale: أمر مفرد بصيغة المبني للمجهول في اليونانية؛ و«انفتح» يؤدي المعنى طبيعيًا في العربية ويحافظ على كون المخاطَب متلقيًا لفعل الفتح.
theological_decisions:
- issue: مرجع الضمير في αὐτῷ
  choice: له، أي للرجل
  alternative: أن يكون الخطاب، من جهة المعنى، موجَّهًا إلى أذنيه أو قدرته على النطق
  rationale: الضمير اليوناني يعود في الظاهر إلى الرجل، ولذلك تُحفظ المخاطبة الشخصية ولا يُستبدل بها تفسير ضمني لأعضاء السمع أو النطق.
- issue: دلالة οὐρανός
  choice: السماء
  alternative: السماء بوصفها مقام الله على نحو تفسيري صريح
  rationale: يحفظ اللفظ العربي المدى الدلالي للأصل ولا يضيف تفسيرًا لاهوتيًا غير مصرَّح به في الآية.
translation_notes:
  register: 'عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ اللفظ الآرامي منقولًا صوتيًا، ووُضع تفسير مرقس بعده مباشرة. وُزعت علامتا الحاشية بحسب مضمونهما الفعلي: البديل المعجمي عند «تنهد»، والشرح الآرامي عند ترجمة اللفظة.'
