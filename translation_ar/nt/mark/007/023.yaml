  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: ar
  text: كل هذه الشرور تخرج من الداخل وتنجِّس الإنسان.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: كل هذه الشرور
  rationale: يحافظ هذا التعبير على الشمول والتوكيد في اليونانية، ويشير طبيعيًّا إلى قائمة الشرور السابقة، مع إبقاء صيغة الجمع.
- source_word: ἔσωθεν
  choice: من الداخل
  rationale: ينقل بوضوح منشأ الشرور الباطني، ويحفظ المقابلة السياقية بين ما يأتي من خارج الإنسان وما يصدر من داخله.
- source_word: ἐκπορεύεται
  choice: تخرج
  rationale: صيغة عربية طبيعية تعبّر عن الحركة من مصدر داخلي. وجاء الفعل مؤنثًا مفردًا لأن فاعله جمع غير عاقل في العربية، مع أن الفعل اليوناني مفرد مع فاعل محايد جمع وفق الاستعمال اليوناني المعتاد.
- source_word: κοινοῖ
  choice: تنجِّس
  rationale: يفيد الفعل في سياق مرقس معنى جعل الإنسان نجسًا، لا مجرد جعله «عامًّا» أو «مشتركًا»، و«تنجِّس» موجزة وتحفظ دلالة النجاسة الطقسية والأخلاقية في السياق.
- source_word: τὸν ἄνθρωπον
  choice: الإنسان
  rationale: «الإنسان» في العربية اسم جنس مفرد طبيعي وشامل، يطابق الاستعمال التمثيلي العام للكلمة اليونانية دون الحاجة إلى حاشية لبيان شمولها.
theological_decisions:
- issue: دلالة τὸν ἄνθρωπον في القول العام عن النجاسة البشرية
  choice: الإنسان
  alternative: الشخص / المرء
  rationale: السياق يقرر حقيقة عامة عن الإنسان. وتحفظ «الإنسان» المفرد والتعريف والصيغة العامة في الأصل، من غير حصر الدلالة في ذكر بالغ ولا تحويلها إلى مفهوم «البشرية» المجرد.
- issue: صلة النجاسة بالباطن
  choice: 'إبقاء العبارة كما هي: الشرور تخرج من الداخل وتنجِّس الإنسان'
  alternative: تفسير «الداخل» صراحة بأنه القلب
  rationale: مع أن السياق السابق يذكر القلب، فإن هذه الآية تقول ἔσωθεν، أي «من الداخل». لذلك يُحفظ التعبير الأوسع ولا يُستبدل به تفسير أكثر تحديدًا داخل النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كتابية كريمة. لا حاجة إلى علامة حاشية؛ لأن «الإنسان» تؤدي طبيعيًّا في العربية معنى اسم الجنس الشامل.
