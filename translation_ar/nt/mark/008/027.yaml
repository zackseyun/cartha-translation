source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: ar
  text: 'وخرج يسوع وتلاميذه إلى قرى قيصرية فيلبُّس. وفي الطريق كان يسأل تلاميذه قائلًا لهم: «مَن يقول الناس إني أنا؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: ينقل معنى الحركة في الفعل اليوناني بصياغة عربية طبيعية، من غير إضافة معنى الرحيل النهائي.
- source_word: κώμας
  choice: قرى
  rationale: يدل اللفظ عادةً على القرى أو التجمعات السكنية الصغيرة، لا على المدن الكبرى.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: قيصرية فيلبُّس
  rationale: نقلٌ عربي مألوف لاسم المكان، مع تمييزه عن المواضع الأخرى المسماة قيصرية.
- source_word: ἐν τῇ ὁδῷ
  choice: في الطريق
  rationale: تعبير عربي طبيعي يحافظ على ظرف الحركة وعلى صياغة مرقس السردية.
- source_word: ἐπηρώτα
  choice: كان يسأل
  rationale: يحافظ تركيب «كان» مع المضارع على الدلالة الاستمرارية للفعل اليوناني الناقص.
- source_word: λέγων αὐτοῖς
  choice: قائلًا لهم
  rationale: يحافظ على البنية الحالية في اليونانية ضمن صياغة عربية فصيحة وموجزة.
- source_word: οἱ ἄνθρωποι
  choice: الناس
  rationale: اللفظ اليوناني عام هنا ويشير إلى الناس عمومًا، لا إلى الذكور وحدهم.
- source_word: Τίνα με λέγουσιν ... εἶναι;
  choice: مَن يقول الناس إني أنا؟
  rationale: يحافظ على سؤال الهوية وعلى فعل القول، مع صياغة عربية مفهومة لا تستبدل السؤال بتعبير تفسيري مثل «في رأي الناس».
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: تلاميذه
  rationale: ينقل لفظ التلمذة وضمير الملكية الصريح في الموضعين.
theological_decisions:
- issue: الدلالة العامة للفظ ἄνθρωποι في سؤال يسوع
  choice: الناس
  alternative: الرجال
  rationale: السياق يتحدث عن عامة الناس، ولذلك لا يصح حصر المقصود في الذكور.
- issue: صياغة سؤال الهوية Τίνα ... εἶναι
  choice: مَن يقول الناس إني أنا؟
  alternative: مَن أنا في رأي الناس؟
  rationale: الصياغة المختارة تبقي فعل «يقول» والتوتر المباشر في سؤال الهوية، ولا تحوله إلى سؤال عن الرأي فحسب.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. روعي الحفاظ على تكرار «تلاميذه» وعلى استمرارية «كان يسأل»، من غير تكلف حرفي أو إدخال تفسير مذهبي.
