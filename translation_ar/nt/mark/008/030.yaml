  text: And he warned them to tell no one about him[a].
translation:
  language: ar
  text: وحذّرهم بشدة ألّا يخبروا أحدًا عنه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فانتهرهم»، أو: «أمرهم بصرامة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: حذّرهم بشدة
  rationale: يفيد الفعل هنا توجيهًا زاجرًا وحازمًا. وهذه الصياغة تنقل قوة النهي في عربية طبيعية، من غير أن تفترض أن التلاميذ كانوا موضع توبيخ بسبب خطأ سابق.
- source_word: αὐτοῖς
  choice: هم
  rationale: ضمير جمع يعود إلى التلاميذ في السياق المباشر، وقد اتصل بالفعل في العربية.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: من أن يخبروا أحدًا
  rationale: جاءت ἵνα مع صيغة الالتزام بعد فعل زجر أو تحذير لتبيّن مضمون التوجيه. وصيغة «من أن يخبروا أحدًا» سليمة وطبيعية مع «حذّرهم»، وتنقل النهي عن إبلاغ أي شخص.
- source_word: περὶ αὐτοῦ
  choice: عنه
  rationale: تنقل περί مع المضاف إليه بمعنى «عن» أو «بشأن»، والضمير يعود إلى يسوع؛ و«عنه» هي الصياغة العربية الأوجز والأوضح.
theological_decisions:
- issue: قوة أمر يسوع في سياق كتمان هويته
  choice: صياغة الكلام بوصفه تحذيرًا شديدًا من إخبار أي شخص عنه، من غير بيان سبب هذا الكتمان.
  alternative: «فانتهرهم» أو «أوصاهم بصرامة»
  rationale: النص يثبت نهيًا قويًا، لكنه لا يشرح في هذه الآية سبب النهي. لذلك تحافظ الترجمة على حدة الأمر وعلى التوتر السردي واللاهوتي من غير إدخال نظرية تفسيرية في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «يخبروا أحدًا عنه» بدل الصياغة الحرفية الأثقل «يقولوا لأحد عنه»، مع إبقاء قوة الفعل اليوناني وبدائله في الحاشية.
