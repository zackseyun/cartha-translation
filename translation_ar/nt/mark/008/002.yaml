  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: ar
  text: «أشفق على الجمع، لأنهم يمكثون معي منذ ثلاثة أيام، وليس لديهم ما يأكلونه».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: أشفق
  rationale: ينقل الفعل معنى التعاطف العميق والشفقة، وصيغة المضارع العربية تلائم القوة الزمنية في اليونانية دون إضافة تفسير عاطفي زائد.
- source_word: ἐπὶ τὸν ὄχλον
  choice: على هذا الجمع
  rationale: حرف الجر مع الفعل يحدد من تقع عليه الشفقة. و«الجمع» تعبير عربي واضح ومألوف لـὄχλος، وأضيف اسم الإشارة بصورة طبيعية لأنه جمع حاضر أمام المتكلم.
- source_word: ὅτι
  choice: لأنهم
  rationale: تقدم ὅτι سبب الشفقة، ولذلك تنقلها «لأن» بوضوح، مع ضمير الجمع الذي تقتضيه العربية.
- source_word: ἤδη ἡμέραι τρεῖς
  choice: منذ ثلاثة أيام
  rationale: يفيد التركيب أن بقاءهم امتد حتى الآن مدة ثلاثة أيام؛ و«منذ ثلاثة أيام» صياغة عربية طبيعية تؤدي معنى المدة التي بلغت بالفعل ثلاثة أيام.
- source_word: προσμένουσίν μοι
  choice: باقون معي
  rationale: يحمل προσμένω معنى الاستمرار أو البقاء مع شخص. «باقون معي» يحفظ جانب الاستمرار في صيغة موجزة وطبيعية.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: ليس لديهم ما يأكلونه
  rationale: ينقل التعبير انعدام الطعام المتاح لهم، ويؤدي «ما يأكلونه» تركيب τί مع صيغة الاحتمال/الغرض بصورة عربية سليمة دون حرفية ثقيلة.
