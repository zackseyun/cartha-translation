  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: ar
  text: فأيُّ نفعٍ للإنسان إن ربح العالم كلَّه وخسر حياته؟[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نفسه». يمكن للكلمة اليونانية ψυχή أن تعني «الحياة» أو «النفس» أو «الذات»، بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: «الإنسان» هنا يشير إلى أيّ إنسان على وجه العموم.
    reason: cultural_note
lexical_decisions:
- source_word: τί γὰρ
  choice: فأيُّ
  rationale: الفاء تنقل القوة التفسيرية والربطية لـγάρ بما سبق، و«أيّ» تصوغ السؤال البلاغي بالعربية الطبيعية.
- source_word: ὠφελεῖ
  choice: نفعٍ
  rationale: 'يحفظ معنى الفائدة أو الجدوى، ويأتي في تركيب عربي واضح: «أي نفع للإنسان».'
- source_word: ἄνθρωπον
  choice: للإنسان
  rationale: ἄνθρωπος هنا مفرد عام يشمل كل إنسان؛ و«الإنسان» يحفظ الصيغة المفردة والعموم من غير حصرها في الذكر.
- source_word: κερδῆσαι
  choice: ربح
  rationale: ينقل الاستعارة التجارية في κερδαίνω، ويقيم مقابلة طبيعية مع «خسر».
- source_word: τὸν κόσμον ὅλον
  choice: العالم كلَّه
  rationale: يحفظ شمول العبارة اليونانية وترتيب توكيد الكل بصورة عربية فصيحة.
- source_word: ζημιωθῆναι
  choice: خسر
  rationale: الفعل المبني للمجهول في اليونانية يدل هنا على تكبّد الخسارة أو فقدان الشيء؛ و«خسر» يؤدي المعنى بوضوح ويحفظ مقابلة الربح والخسارة.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: حياته
  rationale: في سياق مرقس 8:35–37 تدل ψυχή بوجه قوي على حياة الإنسان التي قد يحاول إنقاذها أو يفقدها، مع بقاء معنى «النفس» احتمالًا حقيقيًا يُذكر في الحاشية.
theological_decisions:
- issue: دلالة ψυχή في قول عن التلمذة تحتمل «الحياة» و«النفس»
  choice: حياته
  alternative: نفسه
  rationale: «حياته» تلائم السياق المباشر الذي يتحدث عن إنقاذ ψυχή وفقدانها، ولا تفرض تصورًا أنثروبولوجيًا أضيق. ولأن «نفسه» ترجمة راسخة وممكنة للمفردة، حُفظت في الحاشية.
- issue: عموم ἄνθρωπον المفرد
  choice: الإنسان
  alternative: الرجل
  rationale: المقصود إنسان على وجه العموم، لا ذكر بالغ على وجه التخصيص؛ لذلك تنقل «الإنسان» الدلالة العامة مع الحفاظ على المفرد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. حُفظ السؤال البلاغي والربط بما قبله، كما حُفظت استعارة الربح والخسارة. استُعمل «الإنسان» للدلالة العامة، وأُثبت احتمال «النفس» في الحاشية صونًا للغموض المعجمي الأصيل.
