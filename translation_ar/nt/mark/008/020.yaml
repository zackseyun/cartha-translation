base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: ar
  text: 'وعندما قُدِّمت الأرغفة السبعة للأربعة الآلاف، كم سلّةً كبيرةً[a] مملوءةً بالكِسَر جمعتم؟ فقالوا له: «سبعًا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الكلمة اليونانية σπυρίς تعني سلّة كبيرة، وهي غير الكلمة التي تعني السلّة الأصغر في مرقس 8:19.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε καὶ
  choice: وعندما
  rationale: تحافظ على الربط بالحادثة السابقة وعلى المعنى الزمني بصياغة عربية طبيعية، من غير إثقال العبارة بترجمة مستقلة لـ καί.
- source_word: τοὺς ἑπτὰ
  choice: الأرغفة السبعة
  rationale: العدد في اليونانية محذوف الموصوف ويعود سياقيًا إلى الأرغفة المذكورة في 8:5–6؛ إظهار الموصوف ضروري للوضوح الطبيعي في العربية.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: للأربعة الآلاف
  rationale: تنقل علاقة الأرغفة بالجماعة التي أُطعمت، مع إبقاء العدد على نحو موجز كما في الأصل.
- source_word: πόσων σπυρίδων
  choice: كم سلّة كبيرة
  rationale: σπυρίς تدل على سلّة كبيرة وتختلف عن κόφινος الواردة في 8:19، فحُفظ التمييز المعجمي.
- source_word: πληρώματα κλασμάτων
  choice: مملوءة بالكِسَر
  rationale: صياغة عربية واضحة تنقل كون السلال ممتلئة بقطع الخبز المكسورة.
- source_word: ἤρατε
  choice: رفعتم
  rationale: يحافظ على المعنى الأساسي للفعل αἴρω، ويُفهم في السياق بمعنى جمع ما تبقى ورفعه.
- source_word: καὶ λέγουσιν αὐτῷ
  choice: فقالوا له
  rationale: حُوّل المضارع السردي اليوناني إلى الماضي العربي الطبيعي، مع الحفاظ على تعاقب الحوار.
- source_word: Ἑπτά
  choice: سبعًا
  rationale: جواب عددي مباشر؛ استُعمل التأنيث لأن المعدود المفهوم هو «سلال».
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. أُظهر الموصوف المحذوف «الأرغفة» لسلامة الفهم بالعربية، وحُفظ الفرق بين نوعي السلال. وُضع مؤشر الحاشية بعد الآية لأنه يشرح لفظ «سلّة كبيرة» الوارد فيها.
