  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: ar
  text: فماذا يمكن للإنسان أن يعطي مقابلًا لحياته؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نفسه»؛ فاللفظة اليونانية قد تعني «الحياة» أو «النفس» أو «الذات» بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: فماذا
  rationale: الفاء تنقل القوة التفسيرية والارتباط بما سبق في γάρ، و«ماذا» تحفظ صيغة السؤال البلاغي.
- source_word: δοῖ ἄνθρωπος
  choice: يمكن للإنسان أن يعطي
  rationale: تنقل الإمكان العملي الذي يفيده فعل العطاء في هذا السؤال البلاغي، و«الإنسان» تعبير عربي طبيعي ذو دلالة عامة يوافق ἄνθρωπος.
- source_word: ἀντάλλαγμα
  choice: فداءً
  rationale: يدل اللفظ على ما يُعطى بدلًا أو مقابلًا لاسترداد شيء؛ و«فداءً عن» صياغة عربية موجزة وطبيعية تلائم سياق خسارة الحياة ومحاولة استردادها.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: عن حياته
  rationale: في سياق مرقس 8:35-37 تشير ψυχή إلى الحياة وإلى ذات الإنسان في آن واحد. «حياته» أوضح في المتن، مع حفظ البدائل الدلالية في الحاشية.
theological_decisions:
- issue: دلالة ψυχή في قول يتصل بالخلاص وخسارة الذات
  choice: حياته
  alternative: نفسه أو روحه
  rationale: السياق المباشر يتناول إنقاذ ψυχή وخسارتها، ولذلك تلائم «الحياة» تسلسل الكلام، لكن اللفظة اليونانية أوسع وقد تشير إلى نفس الإنسان أو ذاته؛ فتُحفظ هذه السعة في الحاشية دون حصرها في الحياة البيولوجية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «الإنسان» للدلالة العامة، و«فداءً عن» لإبراز معنى ما يُقدَّم مقابل استرداد الحياة من غير إدخال تفسير مذهبي خاص.
