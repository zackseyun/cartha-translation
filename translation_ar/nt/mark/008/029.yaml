  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: ar
  text: 'وكان يسألهم: «وأما أنتم، فمن تقولون إني أنا؟» فأجابه بطرس: «أنت المسيح[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «الممسوح».
    reason: توضيح المعنى الحرفي للقب اليوناني Χριστός.
lexical_decisions:
- source_word: ἐπηρώτα
  choice: كان يسأل
  rationale: ينقل صيغة الماضي الناقص اليونانية بما توحي به من فعل جارٍ في سياق السرد، مع بقاء العبارة طبيعية بالعربية.
- source_word: Ὑμεῖς δὲ
  choice: وأما أنتم
  rationale: يحفظ إبراز الضمير والمقابلة بين رأي الناس وإجابة التلاميذ.
- source_word: τίνα με λέγετε εἶναι
  choice: فمن تقولون إني أنا؟
  rationale: صياغة عربية واضحة تنقل تركيب المفعول مع المصدر في اليونانية، وتحافظ على السؤال عن هوية يسوع وعلى شيء من توكيد الضمير.
- source_word: ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ
  choice: فأجابه بطرس
  rationale: يجمع بصورة موجزة وطبيعية وظيفة اسم الفاعل «مجيبًا» والفعل المضارع التاريخي «يقول له» في السرد.
- source_word: Σὺ εἶ ὁ χριστός
  choice: أنت المسيح
  rationale: يحفظ توكيد الضمير الصريح ويترجم اللقب اليوناني بصيغته العربية الراسخة ذات الخلفية اليهودية المسيانية.
theological_decisions:
- issue: ترجمة لقب Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: Χριστός هنا لقب لا اسم علم، و«المسيح» هو المقابل العربي الراسخ الذي يحفظ دلالته المسيانية. أُثبت المعنى الحرفي «الممسوح» في الحاشية من غير استبدال اللقب المألوف.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «وأما أنتم» لإظهار المقابلة والتوكيد، وحُفظت استمرارية الماضي الناقص في «كان يسأل».
