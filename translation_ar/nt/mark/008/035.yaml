  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: ar
  text: لأن من أراد أن يخلّص حياته[a] سيفقدها، أما من يفقد حياته من أجلي ومن أجل الإنجيل فسيخلّصها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نفسه» في الموضعين؛ فاللفظ اليوناني قد يعني الحياة أو النفس بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: حياته
  rationale: يدل اللفظ هنا على حياة الإنسان أو ذاته في سياق المفارقة بين التشبث بالحياة وبذلها. واختيار «حياته» أوضح في العربية ولا يحصر المعنى في النفس بوصفها جانبًا غير مادي.
- source_word: σῶσαι / σώσει
  choice: يخلّص / فسيخلّص
  rationale: يحافظ فعل «خلّص» على التقابل المقصود مع «يفقد»، وعلى الصدى الخلاصي للفعل في إنجيل مرقس.
- source_word: ἀπολέσει
  choice: سيفقد / يفقد
  rationale: «يفقد» هو التعبير العربي الطبيعي عند الحديث عن الحياة، ويصون المفارقة من غير المبالغة التي قد يوحي بها «يهلك» أو «يدمّر».
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: من أجلي ومن أجل الإنجيل
  rationale: ينقل سبب الفقد أو دافعه بوضوح، ويبيّن تعلق العبارة بكل من يسوع والإنجيل.
- source_word: εὐαγγέλιον
  choice: الإنجيل
  rationale: مصطلح عربي راسخ وواضح، ويحافظ على هذا الموضوع المحوري في مرقس.
- source_word: ὃς ... ὃς
  choice: من ... من
  rationale: أداة «من» تؤدي المعنى العام غير المحدد بصورة موجزة وطبيعية.
- source_word: θέλῃ
  choice: أراد
  rationale: تعبير عربي واضح عن الإرادة، ويلائم تركيب الشرط العام.
theological_decisions:
- issue: الدلالة الأنثروبولوجية للفظ ψυχή في هذه المفارقة
  choice: ترجمته «حياته» في المتن
  alternative: «نفسه»
  rationale: السياق يتناول إنكار الذات وبذل الحياة في اتباع يسوع، ولذلك تعبّر «حياته» بوضوح عن المعنى المباشر، مع إبقاء «نفسه» في الحاشية حفاظًا على السعة الدلالية التقليدية.
- issue: القوة العامة لصيغة المفرد المذكر
  choice: الإبقاء على المفرد المذكر في «حياته»
  alternative: إعادة الصياغة بصيغة جمع أو بصياغة محايدة
  rationale: صيغة «من» مع ضمير المفرد المذكر طبيعية في العربية وتؤدي معنى العموم من غير تغيير العدد النحوي في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم بناء شرطي طبيعي يحافظ على التوازي والمفارقة بين تخليص الحياة وفقدها، مع تكرار «من أجل» دفعًا لأي التباس في تعلق العبارة بالإنجيل.
