  source_fidelity: 'الترجمة تنقل بدقة البنية العامة المزدوجة في اليونانية: من يريد إنقاذ حياته سيفقدها، ومن يفقد حياته من أجل يسوع والإنجيل سينقذها/يخلّصها. اختيار «حياته» لـ ψυχή مناسب للسياق، وتكرارها في الموضعين يحافظ على المقابلة اللفظية المقصودة. و«من أجلي ومن أجل الإنجيل» أمين لعبارة ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου، من غير إضافة تفسيرية.'
