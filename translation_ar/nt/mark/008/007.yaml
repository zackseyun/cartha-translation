  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: ar
  text: 'وكان لديهم بضع سمكات صغيرة، وبعد أن باركها قال: ليقدّموها أيضًا.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰχθύδια
  choice: سمكات صغيرة
  rationale: يحفظ معنى صيغة التصغير الدالة هنا على صغر السمك، بعبارة عربية طبيعية وواضحة.
- source_word: ὀλίγα
  choice: بضع
  rationale: تعبير عربي موجز وطبيعي يدل على العدد القليل من المعدود.
- source_word: εὐλογήσας
  choice: بعد أن باركها
  rationale: ينقل سبق فعل البركة على القول، ويحافظ على معنى εὐλογέω من غير تحويله إلى «شكر».
- source_word: αὐτά
  choice: ها
  rationale: الضمير يعود إلى السمكات، وقد أُفرد مؤنثًا وفق الاستعمال العربي لغير العاقل في الجمع.
- source_word: καὶ ταῦτα
  choice: هي أيضًا
  rationale: يحفظ القوة الإضافية لـ καί والإشارة إلى السمكات باعتبارها ما سيُقدَّم كذلك.
- source_word: παρατιθέναι
  choice: أن يقدّموها
  rationale: يعبر طبيعيًا عن وضع الطعام أمام الناس أو تقديمه لهم، مع إبقاء الفاعل المفهوم من السياق، أي التلاميذ، غير مصرّح به في النص.
- source_word: εἶπεν
  choice: قال
  rationale: المقابل المباشر والطبيعي للفعل، من غير زيادة معنى «أمر» أو «أوصى» صراحة.
