  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: ar
  text: 'وكان يقول لهم[a]: «أفلا تفهمون بعد؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وقال لهم».'
    reason: صيغة الماضي الناقص في اليونانية قد تُنقل عربيًا بصيغة استمرارية «كان يقول»، أو تُختصر في السرد إلى «قال».
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: تحافظ واو العطف على الصلة السردية البسيطة من غير إضافة دلالة زمنية غير مصرَّح بها.
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: تنقل صيغة الماضي الناقص اليونانية بمنظور استمراري، مع بقاء «قال» احتمالًا عربيًا موجزًا بحسب السياق السردي.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ترجمة مباشرة للضمير في صيغة الجمع، من غير إدخال مرجع الضمير، أي التلاميذ، في صلب الآية.
- source_word: Οὔπω
  choice: بعد، ضمن تركيب «أفلا ... بعد؟»
  rationale: يؤدي معنى «ليس بعد/لا يزال لا»، ويعبّر طبيعيًا عن استمرار غياب الفهم إلى تلك اللحظة.
- source_word: συνίετε
  choice: تفهمون
  rationale: ينقل بوضوح معنى الإدراك العقلي في صيغة المخاطب الجمع، من غير تضييقه إلى مجرد الملاحظة الحسية.
theological_decisions:
- issue: هل يُضاف مفعول يحدد ما ينبغي أن يفهموه؟
  choice: 'إبقاء المفعول غير مذكور: «أفلا تفهمون بعد؟»'
  alternative: «أفلا تفهمون هذا بعد؟»
  rationale: النص اليوناني لا يصرّح بمفعول؛ وإبقاؤه ضمنيًا يحفظ اتساع السؤال وقوة التوبيخ من غير فرض تحديد تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «أفلا تفهمون بعد؟» لأنه طبيعي ومباشر، ويحفظ معنى οὔπω من غير إضافة مفعول غير موجود في الأصل.
