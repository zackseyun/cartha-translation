lexical_decisions:
- source_word: ἀφεὶς
  choice: فتركهم
  rationale: اسم الفاعل الماضي من ἀφίημι يدل هنا على ترك الأشخاص والانصراف عنهم؛ وصيغة «فتركهم» عربية طبيعية وتحفظ تعاقب الأفعال.
- source_word: αὐτοὺς
  choice: هم
  rationale: الضمير يعود إلى الفريسيين المذكورين في السياق السابق، ولا حاجة إلى التصريح بالاسم.
- source_word: πάλιν
  choice: عاد
  rationale: يمكن أن تعني πάλιν «من جديد» أو «عائدًا». وفي سياق ركوب القارب، تنقل «عاد» معنى الرجوع بصورة عربية سلسة، مع إثبات البديل في الحاشية.
- source_word: ἐμβὰς
  choice: إلى القارب
  rationale: الفعل يعني الدخول أو الصعود، والقارب مفهوم من سياق مرقس. جُمعت دلالته مع πάλιν في عبارة «عاد إلى القارب» لتجنب تركيب عربي ثقيل.
- source_word: ἀπῆλθεν
  choice: مضى
  rationale: يدل ἀπέρχομαι على الانصراف أو الذهاب؛ و«مضى» موجزة وفصيحة، وتأتي الوجهة بعدها.
- source_word: εἰς τὸ πέραν
  choice: إلى الضفة الأخرى
  rationale: العبارة المرقسية تشير إلى الجانب الآخر من البحيرة؛ و«الضفة الأخرى» توضح الدلالة الجغرافية الطبيعية في العربية.
