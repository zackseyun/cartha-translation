base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: ar
  text: '«حين كسرتُ الأرغفة الخمسة للخمسة آلاف[a]، كم قُفّةً ممتلئةً بالكِسَر جمعتم؟» قالوا له: «اثنتا عشرة».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «للخمسة آلاف رجل». يَرِد العدد في اليونانية بصيغة المذكر، لكنه قد يُستعمل تسميةً موجزة للجمع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε
  choice: حين
  rationale: تُدخل جملة زمنية تُحيل إلى معجزة إطعام الجموع، وهي صياغة عربية طبيعية ومباشرة.
- source_word: ἔκλασα
  choice: كسرتُ
  rationale: تنقل فعل كسر الأرغفة بوضوح وتحافظ على الصلة اللفظية بالكِسَر الباقية.
- source_word: ἄρτους
  choice: الأرغفة
  rationale: الاسم معدود هنا وعدده خمسة، لذلك «الأرغفة» أدق من الخبز بمعناه العام.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: للخمسة الآلاف
  rationale: تنقل اتجاه الفعل ونفعه للجماعة، من غير إضافة «رجل» التي لا يصرّح بها النص في هذا الموضع.
- source_word: κοφίνους
  choice: قُفَّةً
  rationale: κόφινος سلة أو قفة لحمل الأشياء؛ واختيار «قفة» يميز هذا الوعاء بقدر مناسب مع بقاء العبارة مفهومة.
- source_word: κλασμάτων
  choice: الكِسَر
  rationale: تدل على القطع الناتجة من كسر الأرغفة، وتحافظ على الصلة الاشتقاقية بالفعل «كسرتُ».
- source_word: πλήρεις
  choice: مملوءةً من
  rationale: تنقل معنى الامتلاء وتربط الوعاء بمحتواه في تركيب عربي واضح.
- source_word: ἤρατε
  choice: جمعتم
  rationale: في سياق البقايا، يفيد الفعل أخذ القطع ورفعها من المكان؛ و«جمعتم» يعبّر طبيعيًا عن الفعل المقصود دون إقحام معنى زائد.
- source_word: λέγουσιν αὐτῷ
  choice: قالوا له
  rationale: استُعمل الماضي العربي الملائم للسرد، مع أن اليونانية تستخدم المضارع التاريخي.
- source_word: Δώδεκα
  choice: اثنتي عشرة
  rationale: أُنِّث العدد لأن مرجعه «قفة»، وهو واضح من السؤال السابق.
theological_decisions:
- issue: دلالة صيغة πεντακισχιλίους على الجماعة
  choice: الخمسة الآلاف
  alternative: الخمسة آلاف رجل
  rationale: تحافظ الصياغة على التسمية العددية للجمع كما وردت، ولا تضيف تخصيص «رجل» الذي لا يلزم التصريح به في هذه الآية، مع إبقاء احتمال الدلالة السياقية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على بنية السؤال والجواب، وعلى الترابط بين «كسرتُ» و«الكِسَر». استُعملت «قُفّة» مقابل κόφινος، مع ضبطها لتيسير القراءة.
