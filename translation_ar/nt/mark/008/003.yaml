- source_word: ἀπολύσω
  choice: صرفتُهم
  rationale: يفيد الفعل هنا صرف الجموع وتركهم ينصرفون، لا إطلاقهم من أسر أو قيد.
- source_word: νήστεις
  choice: وهم جياع
  rationale: يصف حالتهم بسبب بقائهم بلا طعام، من غير أن يوحي بالضرورة بصوم ديني مقصود.
- source_word: εἰς οἶκον αὐτῶν
  choice: إلى بيوتهم
  rationale: 'صيغة الجمع تنقل المعنى التوزيعي الطبيعي: أن يعود كل واحد إلى بيته.'
- source_word: ἐκλυθήσονται
  choice: فسينهارون
  rationale: ينقل شدة الضعف والإعياء الذي قد يبلغ حد الانهيار، مع إثبات البديل الأقل حدة في الحاشية.
- source_word: ἐν τῇ ὁδῷ
  choice: في الطريق
  rationale: تعبير عربي طبيعي يحفظ سياق الرحلة.
- source_word: καί τινες αὐτῶν
  choice: وبعضهم
  rationale: يحفظ العطف ويحدد قسمًا من الجموع بإيجاز طبيعي.
- source_word: ἀπὸ μακρόθεν
  choice: من بعيد
  rationale: يدل في السياق على بُعد المكان الذي قدموا منه.
- source_word: ἥκασιν
  choice: قد جاءوا
  rationale: تنقل «قد» مع الماضي كونهم قد أتوا وصاروا حاضرين، بما يقارب دلالة صيغة التام اليونانية.
