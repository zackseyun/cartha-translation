lexical_decisions:
- source_word: ἔφαγον
  choice: أكلوا
  rationale: فعل ماضٍ سردي مباشر يؤدي المعنى من غير إضافة توكيد غير موجود في السياق.
- source_word: ἐχορτάσθησαν
  choice: شبعوا
  rationale: ينقل بلوغ الكفاية من الطعام بعبارة عربية طبيعية موجزة، مع الحفاظ على صيغة المعنى دون تكلف المبني للمجهول.
- source_word: ἦραν
  choice: رفعوا
  rationale: يحافظ على المعنى الأساسي للفعل αἴρω، ويلائم سياق رفع ما تبقى وجمعه في السلال.
- source_word: περισσεύματα
  choice: الفائضة
  rationale: تؤدي معنى ما زاد وبقي بعد الأكل، وتأتي عربيًا نعتًا طبيعيًا للكِسَر.
- source_word: κλασμάτων
  choice: كِسَر الطعام
  rationale: كِسَر تنقل معنى القطع المكسورة، وإضافة الطعام توضح المرجع دون حصره صراحة في الخبز، إذ لا يذكر المصدر هنا اسم الخبز.
- source_word: ἑπτὰ σπυρίδας
  choice: سبع سلال
  rationale: ترجمة واضحة للاسم، مع بيان احتمال كونها سلالًا كبيرة وتمييز اللفظ اليوناني في الحاشية بدل إثقال المتن.
