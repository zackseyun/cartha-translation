  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: ar
  text: ثم وضع يديه مرة أخرى على عينيه[a]، فأبصر بوضوح، فعاد إلى حالته السليمة، وكان يرى كل شيء بجلاء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تورد بعض المخطوطات صياغة تنعكس في ترجمات من قبيل: «فاستعاد بصره، وعاد إلى حالته السليمة، وكان يرى كل شيء بوضوح».'
    reason: textual_variant
  - marker: b
    text: 'أو: «وكان يستطيع أن يرى كل شيء بوضوح». يجمع القول الأخير بين فعل بصيغة الماضي الناقص وظرف يدل على وضوح الرؤية وتميّزها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: ثم ... مرة أخرى
  rationale: تنقل «ثم» تعاقب الأحداث، وتعبّر «مرة أخرى» عن تكرار الفعل، بصياغة عربية طبيعية.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: وضع يديه على عينيه
  rationale: تحافظ على الفعل الحسي الملموس وعلى تثنية اليدين والعينين كما في اليونانية.
- source_word: διέβλεψεν
  choice: أبصر بوضوح
  rationale: يفيد الفعل بلوغ الرؤية الواضحة في سياق الانتقال من الإبصار الجزئي إلى الإبصار التام، من غير استيراد معنى «حدّق» من قراءة نصية أخرى.
- source_word: ἀπεκατέστη
  choice: عاد إلى حالته السليمة
  rationale: يحفظ معنى الرجوع إلى الحالة الصحيحة أو الطبيعية، من غير حصر اللفظ في صياغة تفسيرية مثل «شُفي».
- source_word: ἐνέβλεπεν
  choice: كان يرى
  rationale: تعكس صيغة الماضي الناقص اليونانية حالة الرؤية المستمرة أو الناتجة بعد الأفعال السابقة.
- source_word: τηλαυγῶς
  choice: بجلاء
  rationale: ينقل وضوح الرؤية، مع تجنب تكرار «بوضوح» المستعملة قبلها؛ وقد يحتمل اللفظ أيضًا إيحاء الرؤية الواضحة من بعيد.
- source_word: ἅπαντα
  choice: كل شيء
  rationale: صياغة عربية مألوفة تنقل الشمول الذي تفيده صيغة الجمع المحايد.
theological_decisions:
- issue: تصوير الشفاء على مرحلتين
  choice: 'الإبقاء على تعاقب الأفعال: أبصر بوضوح، وعاد إلى حالته السليمة، وكان يرى.'
  alternative: تسوية الأفعال كلها إلى أحداث ماضية منجزة بلا إبراز للتدرج أو للحالة المستمرة.
  rationale: يحافظ هذا على تطور الحدث في اليونانية، ولا يحوّل الشفاء إلى فعل واحد آني ولا يضيف تفسيرًا لسبب حدوثه على مرحلتين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «كان يرى» للمحافظة على دلالة الماضي الناقص، وقُسّم معنى الوضوح بين «بوضوح» و«بجلاء» لتجنب التكرار مع صون التمييز بين الفعل والظرف.
