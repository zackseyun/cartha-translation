  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: ar
  text: 'فتنهّد بعمق في روحه وقال: «لماذا يطلب هذا الجيل آية؟ الحق أقول لكم: لن تُعطى لهذا الجيل آية[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «إن كانت ستُعطى لهذا الجيل آية». وهذه صيغة قسم يونانية متأثرة بالأسلوب السامي، حُذف فيها جواب الشرط، وتفيد نفيًا مؤكدًا: لن تُعطى له آية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστενάξας
  choice: فتنهّد بعمق
  rationale: الفعل المركب يدل على تنهّد شديد أو عميق؛ وهذه الصياغة تنقل قوته العاطفية بلغة عربية طبيعية من غير مبالغة.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: في روحه
  rationale: تحافظ العبارة على لفظ «الروح» وعلى دلالة المجال أو الناحية في اليونانية، بدل اختزالها إلى مجرد شعور نفسي باطني.
- source_word: λέγει
  choice: وقال
  rationale: المضارع هنا مضارع تاريخي يستحضر المشهد. استُخدم الماضي في العربية لأن سرد الحدث به أفصح وأوضح، من غير تغيير في زمن الواقعة.
- source_word: Τί
  choice: لماذا
  rationale: تأتي Τί هنا مع الفعل للسؤال عن السبب، فالمعنى الاصطلاحي الطبيعي هو «لماذا».
- source_word: γενεὰ
  choice: الجيل
  rationale: ينقل الدلالة الجماعية والزمنية للكلمة، وهو المقابل العربي المباشر الملائم للسياق.
- source_word: ζητεῖ
  choice: يطلب
  rationale: «يطلب» طبيعي في سياق التماس آية، ولا يضيف معنى الإلحاح أو التحدي الذي قد تحمله ألفاظ مثل «يطالب».
- source_word: σημεῖον
  choice: آية
  rationale: «آية» هي المقابل الكتابي العربي المألوف لعلامة ذات دلالة تصديقية، من غير إضافة وصف «معجزة» غير المذكور صراحة.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صيغة عربية واضحة ومهيبة تحفظ توكيد ἀμήν والطابع الرسمي لقول يسوع.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: لن تُعطى لهذا الجيل آية
  rationale: الجملة الشرطية الناقصة صيغة قسم سامية تفيد نفيًا مؤكدًا؛ والتصريح بالنفي ينقل معناها المقصود بوضوح، مع توثيق صورتها الحرفية في الحاشية.
theological_decisions:
- issue: فهم جملة εἰ ذات الطابع القَسَمي بعد «الحق أقول لكم»
  choice: 'صياغتها نفيًا مؤكدًا: «لن تُعطى لهذا الجيل آية»'
  alternative: 'الصياغة الحرفية المبهمة: «إن كانت ستُعطى لهذا الجيل آية»'
  rationale: الشرط هنا ناقص الجواب على طريقة القسم السامي، وقوته الدلالية هي الرفض القاطع. إظهار النفي في المتن يحفظ المعنى، بينما تحفظ الحاشية شكل العبارة الأصلي وما فيه من توتر بلاغي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ لفظ «روحه» بدل تسويته إلى «في داخله»، واستُخدم «آية» لما له من دقة ووضوح في السياق الكتابي. نُقلت صيغة النفي القَسَمية بمعناها الطبيعي، ووُضعت علامتها [a] في موضعها المتعلق بالجملة المنفية.
