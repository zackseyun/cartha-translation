source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: ar
  text: 'ثم دعا الجمع مع تلاميذه، وقال لهم: «إن أراد أحد أن يأتي ورائي، فلينكر نفسه، وليحمل صليبه[a]، وليتبعني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يحفظ تعبير «يحمل صليبه» صورة الصليب الحرفية، ولا يختزلها في مجرد تحمّل عبء أو مشقة.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: دعا
  rationale: ينقل معنى استدعاء الناس إليه وجمعهم، ويؤدي تركيب «ثم دعا» تسلسل الفعل السابق للقول بصياغة عربية طبيعية.
- source_word: τὸν ὄχλον
  choice: الجمع
  rationale: لفظ عربي فصيح وواضح يدل على جماعة الناس المحتشدين، ويلائم السياق السردي.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: مع تلاميذه
  rationale: يحفظ معنى المصاحبة، ويوضح أن الدعوة شملت الجمع في حضور التلاميذ وأن الخطاب وُجّه إليهم جميعًا.
- source_word: Εἴ τις θέλει
  choice: إن أراد أحد
  rationale: يحفظ الشرط العام والإرادة الشخصية من غير أن يحوله إلى تقرير حتمي أو يقصره على فئة بعينها.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: أن يأتي ورائي
  rationale: يحافظ على صورة المجيء وراء يسوع، ويترك فعل ἀκολουθείτω اللاحق ليُترجم ترجمة مستقلة بـ«ليتبعني».
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: فلينكر نفسه
  rationale: ينقل صيغة الأمر ومعنى رفض مطالبة الذات بالسيادة، من غير توسيع تفسيري إلى زهد أو حرمان ذاتي بعينه.
- source_word: ἀράτω
  choice: وليحمل
  rationale: «يحمل» طبيعية في العربية مع الصليب، وتشمل رفعه وحمله في الصورة التي يستدعيها السياق.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: صليبه
  rationale: يحفظ الصورة الحرفية للصليب وضمير الملكية الذي يبرز الكلفة الشخصية لكل تابع.
- source_word: ἀκολουθείτω μοι
  choice: وليتبعني
  rationale: ينقل الأمر المضارع بوضوح؛ واستمرار الاتباع مفهوم طبيعيًا من دلالة التلمذة والسياق.
theological_decisions:
- issue: قوة أوامر التلمذة
  choice: 'صياغة الدعوة العامة بشرط «إن أراد أحد»، ثم إيراد ثلاثة أوامر: «فلينكر... وليحمل... وليتبعني».'
  alternative: ترجمتها بصيغة تقريرية مثل «فعليه أن...» أو تكرار «يجب أن».
  rationale: اليونانية تجمع بين شرط مفتوح وصيغ أمر للغائب؛ فالصياغة المختارة تحفظ انفتاح الدعوة وإلزام مطالبها دون إضافة إطار مذهبي.
- issue: معنى σταυρός في السياق
  choice: الإبقاء على اللفظ الحرفي «الصليب».
  alternative: تفسيره بـ«العبء» أو «المعاناة» أو «الموت» وحدها.
  rationale: الصورة متجذرة في أداة الإعدام الرومانية، والنص نفسه لا يحصرها في نوع واحد من الألم أو التضحية؛ لذلك تُحفظ كثافتها التاريخية واللاهوتية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُخدمت لام الأمر لإبراز قوة الصيغ اليونانية، مع الحفاظ على التوازي الإيقاعي بين الأفعال الثلاثة. لم تُدرج الحاشية الإنجليزية الموسومة [a] لأنها لا تطابق موضع علامتها في النص الإنجليزي المقدم وتكرر معنى المتن؛ وأُبقيت الحاشية الثقافية الخاصة بالصليب بعلامة [a] متطابقة بين المتن والحواشي.
