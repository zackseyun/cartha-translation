base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: ar
  text: 'فقالوا له: «يوحنا المعمدان، وآخرون: إيليا، وآخرون: واحد من الأنبياء».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: إن بعضهم يقول: «أنت يوحنا المعمدان»، وآخرين يقولون: «أنت إيليا»، وآخرين: «أنت واحد من الأنبياء». يحذف النص اليوناني الفعل و«أنت» المفهومة في العبارات اللاحقة من هذه القائمة الموجزة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: فقالوا
  rationale: تستأنف العبارة كلام التلاميذ من السياق السابق، وتؤدي الفاء في العربية وظيفة الربط الطبيعي مع جوابهم.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: فقالوا له
  rationale: الجمع بين الفعل واسم الفاعل من الجذر نفسه صيغة إبلاغ يونانية يمكن اختزالها عربيًا إلى «قالوا له» من غير فقد دلالي، إذ إن «قالوا له قائلين» ثقيلة في العربية المعاصرة.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: يوحنا المعمدان
  rationale: هذا هو اللقب العربي الراسخ والواضح للشخصية التاريخية، وهو يعكس وظيفة التعميد في الأصل.
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: وآخرون ... وآخرون
  rationale: يحفظ هذا التوزيع تعدد الجماعات والآراء، بينما لا تستلزم δέ هنا تضادًا قويًا يقتضي «لكن».
- source_word: Ἠλίαν
  choice: إيليا
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: واحد من الأنبياء
  rationale: يحافظ الاختيار على إيجاز الأصل وحذف المسند المفهوم من السياق، بدل إضافة «إنك» أو «أنت» إلى النص الرئيسي.
- source_word: προφητῶν
  choice: الأنبياء
  rationale: المقابل العربي المباشر والمألوف، ويشير هنا إلى أنبياء إسرائيل.
theological_decisions:
- issue: عرض هويات يسوع المتداولة بين الناس
  choice: 'الإبقاء على الأقوال في صورة قائمة موجزة: «يوحنا المعمدان... إيليا... واحد من الأنبياء».'
  alternative: توسيع كل قول إلى «أنت يوحنا المعمدان... أنت إيليا... أنت واحد من الأنبياء».
  rationale: الأصل اليوناني موجز ويحذف المسند المفهوم، ولا ينبغي حسم هذا الإيجاز بإضافات تفسيرية متكررة. تبين الحاشية المعنى الضمني من غير إدخاله في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. صيغت العبارة بأسلوب طبيعي، مع إبقاء القائمة المقتضبة في الأصل وتوضيح الحذف في الحاشية.
