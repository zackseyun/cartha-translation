source:
  edition: SBLGNT
  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: ar
  text: وكانوا قد نسوا أن يأخذوا خبزًا[a]، ولم يكن معهم في القارب إلا رغيف واحد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أرغفة». قد يشير جمع الكلمة اليونانية ἄρτους إلى أرغفة منفردة، لكنه يُستعمل هنا على الأرجح بمعنى الخبز أو المؤونة عمومًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: كانوا قد نسوا
  rationale: صيغة الماضي التام العربية تُظهر أن النسيان سبق حالة النقص المذكورة في القارب، وتحافظ على السياق السردي.
- source_word: λαβεῖν
  choice: أن يأخذوا
  rationale: مصدر متمم لفعل النسيان، ومعناه هنا أخذ الخبز معهم للرحلة.
- source_word: ἄρτους
  choice: خبزًا
  rationale: مع أن الجمع اليوناني قد يدل على أرغفة منفردة، فهو هنا يُفهم طبيعيًا بمعنى الخبز أو المؤونة عمومًا.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: إلا رغيف واحد
  rationale: التركيب استثنائي لا شرطي، والمفرد المعدود ἄρτον يُنقل بوضوح بكلمة «رغيف».
- source_word: οὐκ εἶχον μεθ’ ἑαυτῶν
  choice: لم يكن معهم
  rationale: صياغة عربية طبيعية تنقل معنى عدم امتلاكهم شيئًا سوى المستثنى المذكور، من غير تكرار ثقيل لكلمة الخبز.
- source_word: ἐν τῷ πλοίῳ
  choice: في القارب
  rationale: ينقل حرف الجر والمكان بصياغة عربية مباشرة وطبيعية.
theological_decisions: []
