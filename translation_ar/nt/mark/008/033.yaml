source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: ar
  text: 'أمّا هو فالتفت، ونظر إلى تلاميذه، فانتهر بطرس وقال: «اذهب إلى ورائي يا شيطان، لأنك لا تهتمّ بأمور الله، بل بأمور البشر[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمور الناس»؛ واللفظ اليوناني يشير إلى البشر عامة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: فالتفت
  rationale: ينقل الالتفات الجسدي الذي سبق توجيه الكلام إلى بطرس، بصياغة عربية طبيعية.
- source_word: ἰδὼν
  choice: ونظر إلى
  rationale: يعبّر عن توجيه يسوع نظره إلى تلاميذه، ويحافظ على تتابع الفعلين في السياق.
- source_word: μαθητὰς
  choice: تلاميذه
  rationale: المقابل العربي المألوف للمصطلح الإنجيلي الذي يدل على المتعلمين الملازمين ليسوع.
- source_word: ἐπετίμησεν
  choice: فانتهر
  rationale: ينقل قوة التوبيخ الحاد في الفعل اليوناني ويحافظ على اتساق الاستعمال الإنجيلي.
- source_word: καὶ λέγει
  choice: وقال
  rationale: المضارع اليوناني مضارع تاريخي؛ وصيغة الماضي أنسب للسرد العربي من غير تغيير للمعنى.
- source_word: Ὕπαγε ὀπίσω μου
  choice: اذهب إلى ورائي
  rationale: يحافظ على عنصر «ورائي» المهم في العبارة، من غير اختزاله إلى مجرد «ابتعد عني».
- source_word: Σατανᾶ
  choice: يا شيطان
  rationale: ينقل صيغة النداء والاسم المعروف في سياق الإنجيل، بدل تخفيفه إلى المعنى العام «خصم».
- source_word: φρονεῖς
  choice: تهتمّ
  rationale: يدل الفعل هنا على توجّه الفكر والاهتمام، لا على نشاط ذهني عابر فحسب.
- source_word: τὰ τοῦ θεοῦ
  choice: أمور الله
  rationale: صياغة واسعة تحافظ على انفتاح التعبير اليوناني، من غير حصره في مشيئة الله أو مصالحه.
- source_word: τὰ τῶν ἀνθρώπων
  choice: أمور البشر
  rationale: يحافظ على المقابلة مع «أمور الله»، ويبيّن أن اللفظ اليوناني يشير إلى البشر عامة.
theological_decisions:
- issue: مرجع النداء «يا شيطان»
  choice: يظل التوبيخ موجّهًا مباشرة إلى بطرس بلفظ «يا شيطان».
  alternative: أن يكون يسوع قد خاطب شيطانًا قائمًا وراء بطرس، أو أن تعني الكلمة مجرد «خصم» غير شخصي.
  rationale: النص يصرّح بأن يسوع انتهر بطرس ثم يورد النداء مباشرة؛ لذلك تُحفظ حدة العبارة من غير تقرير تفسير ميتافيزيقي لا يصرّح به العدد.
- issue: دلالة ἀνθρώπων
  choice: البشر
  alternative: الناس أو بني آدم
  rationale: اللفظ اليوناني عام يشمل البشر، و«البشر» ينقل هذا العموم بوضوح ويحافظ على المقابلة اللاهوتية مع الله.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت المقابلة المتوازية بين «أمور الله» و«أمور البشر»، كما حُفظت العبارة الصعبة «إلى ورائي» بدل تفسيرها أو حذفها.
