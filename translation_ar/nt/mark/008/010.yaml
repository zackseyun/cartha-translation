  text: καὶ ⸀εὐθὺς ἐμβὰς εἰς τὸ πλοῖον μετὰ τῶν μαθητῶν αὐτοῦ ἦλθεν εἰς τὰ μέρη Δαλμανουθά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: ar
  text: وفورًا ركب القارب مع تلاميذه، وذهب إلى نواحي دَلْمانُوثة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «منطقة دَلْمانُوثة». تستعمل العبارة اليونانية صيغة الجمع حرفيًا: «أجزاء دَلْمانُوثة» أو «نواحيها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: فورًا
  rationale: ينقل الدلالة الزمنية العاجلة بعبارة عربية معاصرة وطبيعية، ويحافظ على سرعة السرد المميزة في مرقس.
- source_word: ἐμβὰς
  choice: ركب
  rationale: فعل ἐμβαίνω هنا يدل على الصعود إلى القارب قبل الانتقال إلى الوجهة؛ وصيغة «ركب» موجزة وطبيعية في العربية.
- source_word: πλοῖον
  choice: القارب
  rationale: «القارب» أنسب لحجم وسيلة النقل في سياق بحيرة الجليل من «السفينة»، التي قد توحي بمركب أكبر.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: مع تلاميذه
  rationale: ينقل معنى المصاحبة بوضوح وإيجاز.
- source_word: ἦλθεν
  choice: ذهب
  rationale: ينقل حركة يسوع نحو وجهة جديدة من منظور السرد الخارجي بصورة طبيعية، مع أن الفعل اليوناني قد يُترجم في سياقات أخرى «جاء».
- source_word: τὰ μέρη
  choice: نواحي
  rationale: يحافظ على صيغة الجمع اليونانية ويؤدي المعنى الجغرافي الاصطلاحي بلغة عربية طبيعية.
- source_word: Δαλμανουθά
  choice: دَلْمانُوثة
  rationale: نقل صوتي لاسم المكان مع استعمال الصيغة العربية المتداولة للاسم.
