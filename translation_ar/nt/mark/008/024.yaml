  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: ar
  text: 'فرفع بصره وقال: «أرى الناس، فإنني أراهم يمشون كأنهم أشجار».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يُفهم «رفع بصره» أيضًا بمعنى «استعاد بصره»، لكن وصفه التالي يدل على أن رؤيته لم تكن قد اتضحت تمامًا.
    reason: الفعل ἀναβλέπω قد يدل على النظر إلى أعلى أو على استعادة البصر، والسياق يسمح بملاحظة هذا الاحتمال المعجمي.
lexical_decisions:
- source_word: ἀναβλέψας
  choice: فرفع بصره
  rationale: ينقل المعنى الحرفي الأرجح للفعل في السياق، مع إبقاء احتمال دلالته على استعادة النظر مذكورًا في الحاشية.
- source_word: τοὺς ἀνθρώπους
  choice: الناس
  rationale: مقابل عربي طبيعي وشامل لـ ἀνθρώπους.
- source_word: ὅτι
  choice: فإنني
  rationale: يحفظ العلاقة التفسيرية أو السببية بين قوله إنه يرى الناس ووصف كيفية رؤيته لهم، من غير إثقال العبارة بـ«لأنني».
- source_word: ὡς δένδρα
  choice: كأنهم أشجار
  rationale: ينقل التشبيه بوضوح، ويجعل مرجع الضمير إلى الناس طبيعيًا في العربية.
- source_word: περιπατοῦντας
  choice: يمشون
  rationale: اسم الفاعل اليوناني يصف الناس بأنهم يتحركون مشيًا، وهذا هو التعبير العربي المباشر.
theological_decisions:
- issue: درجة وضوح شفاء البصر في هذه المرحلة
  choice: 'صياغة تُبقي الرؤية جزئية ومشوشة: «أراهم يمشون كأنهم أشجار»'
  alternative: صياغة تفصل «كالأشجار» عن «يمشون» أو تفسر طبيعة الرؤية تفسيرًا طبيًا
  rationale: النص يصف إدراك الرجل كما عبّر عنه، ولا يشرح آلية التشوش؛ لذلك تُحفظ الصورة والتوتر السردي بلا إضافة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت جملة قصيرة طبيعية، مع الحفاظ على التشبيه الغريب المقصود في الأصل وعلى العلاقة التفسيرية التي تؤديها ὅτι.
