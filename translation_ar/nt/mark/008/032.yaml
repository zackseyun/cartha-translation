  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: ar
  text: وكان يتكلم بهذا الكلام بصراحة[a]. فأخذه بطرس جانبًا وبدأ يوبخه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بوضوح» أو «بجرأة». تدل الكلمة اليونانية على الكلام الصريح المكشوف الذي لا مواربة فيه.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: بصراحة
  rationale: تؤدي معنى الكلام الصريح الواضح الذي لا مواربة فيه، وتلائم الاستعمال الظرفي الطبيعي في العربية. وقد يحتمل اللفظ أيضًا معنى العلانية أو الجرأة، لذلك أُثبت البديل في الحاشية.
- source_word: τὸν λόγον
  choice: بهذا القول
  rationale: يشير إلى مضمون ما قاله يسوع في الآية السابقة. واسم الإشارة يوضح الصلة السياقية التي تؤديها أداة التعريف اليونانية، و«القول» أقرب إلى العبارة اليونانية من تفسيرها بـ«الأمر» أو «الرسالة».
- source_word: ἐλάλει
  choice: كان يتكلم
  rationale: يحفظ دلالة الماضي الناقص على الفعل الجاري أو المستمر، من غير المبالغة في معنى التكرار.
- source_word: προσλαβόμενος
  choice: أخذه ... جانبًا
  rationale: صياغة عربية طبيعية تنقل ما يفهمه السياق من أن بطرس انفرد بيسوع قبل أن يخاطبه، بدل ترجمة حرفية ناقصة مثل «أخذه» فقط.
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: بدأ يوبخه
  rationale: ينقل تركيب البدء مع المصدر، ويحفظ قوة الفعل الدال على الزجر أو اللوم الشديد. والضمير عائد إلى يسوع بحسب السياق المباشر.
theological_decisions:
- issue: دلالة παρρησίᾳ في وصف إعلان يسوع عن آلامه
  choice: بصراحة
  alternative: بوضوح؛ علانية؛ بجرأة
  rationale: يركز السياق على أن يسوع عرض مضمون كلامه بلا مواربة، وهو ما يفسر رد بطرس المباشر. وتحافظ الصياغة على إمكان معنى الانفتاح في الكلام من غير أن تحصر اللفظ في الشجاعة أو في العلانية أمام الجمهور.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «بطرس» وفق الصيغة الكتابية العربية الشائعة، وحُفظ تتابع السرد مع إبراز استمرارية كلام يسوع وبداية توبيخ بطرس.
