  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: ar
  text: لأنَّ مَن يخجل مني ومن كلماتي في هذا الجيل الزاني والخاطئ[a]، فإنَّ ابن الإنسان أيضًا سيخجل منه متى جاء في مجد أبيه مع الملائكة القديسين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الجيل الخائن والخاطئ». أُبقيت كلمة «الزاني» في المتن لأن اليونانية تستخدم صورة الزنى النبوية المحسوسة للدلالة على الخيانة، ولا سيما الخيانة للعهد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: يخجل بي / يخجل به
  rationale: يحافظ هذا التعبير على معنى الخجل من الانتساب إلى شخص أو قبول كلامه، وعلى المقابلة المتعمدة بين موقف الإنسان الآن وموقف ابن الإنسان عند مجيئه. واستُعمل حرف الباء لأنه أفصح في العربية مع «خجل» بهذا المعنى، بينما «ينكره» أقوى من الدلالة المعجمية.
- source_word: τοὺς ἐμοὺς λόγους
  choice: كلامي
  rationale: «كلامي» جمعٌ دلالي طبيعي في العربية يقابل جمع λόγους من غير تحويله إلى «رسالتي»، وهي صياغة أكثر تفسيرًا.
- source_word: γενεᾷ
  choice: الجيل
  rationale: ينقل المعنى المألوف للكلمة في السياق، جامعًا الإشارة إلى المعاصرين وإلى بيئتهم الأخلاقية، من غير تحويلها إلى التجريد الزمني «العصر».
- source_word: μοιχαλίδι
  choice: الزاني
  rationale: يحفظ الصورة النبوية المحسوسة التي تصف الخيانة الروحية والأخلاقية بلغة الزنى، بدل تفسيرها مباشرةً بلفظ «الخائن».
- source_word: ἁμαρτωλῷ
  choice: الخاطئ
  rationale: مقابل وصفي مباشر يحافظ على اقترانه بـ«الزاني» من غير إضافة شدة ليست في الأصل.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب المسياني وصيغته الكتابية وإيحاءاته الأخروية، بدل استبداله بضمير المتكلم أو بلقب تفسيري.
- source_word: δόξῃ
  choice: مجد
  rationale: المقابل الكتابي العربي الطبيعي الذي يحفظ دلالات الكرامة والبهاء الإلهيين.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: مع الملائكة القديسين
  rationale: ينقل التركيب الوصفي كما هو، ولا يضيف ضمير الملكية «ملائكته» غير الموجود في اليونانية.
- source_word: ὃς γὰρ ἐὰν
  choice: لأنَّ مَن
  rationale: يؤدي معنى الشرط العام، ويحفظ صلة γάρ التفسيرية بما سبق.
- source_word: ὅταν ἔλθῃ
  choice: متى جاء
  rationale: ينقل الحدث المستقبلي المنتظر بصياغة عربية فصيحة، من غير أن يضعف معنى الزمن غير المحدد.
theological_decisions:
- issue: القوة المجازية لوصف «الزاني»
  choice: إبقاء «الزاني» في المتن بوصفه استعارة نبوية للخيانة الروحية والأخلاقية.
  alternative: «الخائن» أو «غير الأمين»
  rationale: الأصل يستعمل μοιχαλίδι، وهو لفظ الزنى المحسوس ذو الصدى النبوي المتعلق بخيانة العهد؛ وإبقاؤه يصون عمق الصورة من غير إفراط في الشرح.
- issue: مرجع لقب «ابن الإنسان»
  choice: الإبقاء على اللقب «ابن الإنسان».
  alternative: «أنا» أو «المسيح»
  rationale: يعرض اليوناني لقبًا مميزًا ذا دلالة مسيانية وأخروية؛ واستبداله يحسم العلاقة تفسيرًا ويزيل قوة التلميح الكتابي.
- issue: المقابلة في فعل الخجل
  choice: 'الحفاظ على التوازي: «يخجل بي ... يخجل به ابن الإنسان أيضًا».'
  alternative: «ينكرني ... ينكره»
  rationale: التوازي اللفظي عنصر بارز في الأصل، أما «ينكر» فيضيف معنى أقوى قد يكون من لوازم السياق لكنه ليس المقابل المباشر للفعل.
- issue: المضاف إليه في «مجد أبيه»
  choice: 'ترجمة τοῦ πατρὸς αὐτοῦ صراحةً: «مجد أبيه».'
  alternative: «مجد الآب»
  rationale: يحفظ الضمير الموجود في الأصل والعلاقة البنوية كما صيغت، من غير تحويل العبارة إلى لقب مجرد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظت البنية التفسيرية والشرط العام، والتوازي بين فعلي الخجل، واللقب «ابن الإنسان». اختير «كلامي» لطبيعته العربية مع بقائه قريبًا من جمع «أقوالي/كلماتي»، وتُركت الصورة النبوية «الجيل الزاني» في المتن مع توضيح بديلها في الحاشية.
