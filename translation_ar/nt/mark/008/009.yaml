  text: وكان عددهم نحو أربعة آلاف، وصرفهم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν
  choice: كانوا
  rationale: الفعل هنا يقرر عدد الحاضرين، وصيغة الجمع العربية الطبيعية تربطه بالجماعة المفهومة من السياق.
- source_word: δὲ
  choice: ثم
  rationale: أُدي بوصفه رابطًا سرديًا خفيفًا يفصل بين ذكر العدد والفعل التالي، من غير جعله ظرفًا زمانيًا صريحًا مثل «الآن».
- source_word: ὡς
  choice: نحو
  rationale: تدل مع العدد على التقريب، و«نحو» فصيحة واضحة في العربية المعاصرة.
- source_word: τετρακισχίλιοι
  choice: أربعة آلاف
  rationale: نقل مباشر للعدد مع الصياغة العربية المألوفة.
- source_word: ἀπέλυσεν
  choice: صرفهم
  rationale: يفيد في هذا السياق إنهاء اجتماع الجموع والإذن لهم بالانصراف؛ و«صرفهم» موجزة وطبيعية، ولا توحي بالإفراج من احتجاز.
- source_word: αὐτούς
  choice: هم
  rationale: ضمير المفعول يعود إلى أفراد الجمع المذكورين في السياق.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة سردية كريمة. لم تُضف حاشية لأن البديل الإنجليزي المذكور («dismissed them») يشرح معنى الفعل نفسه ولا يمثل غموضًا مصدره النص اليوناني، كما أن علامة الحاشية الإنجليزية موضوعة بعد العدد على نحو لا يطابق موضوعها المعجمي.
