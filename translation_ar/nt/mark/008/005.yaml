  text: 'وسألهم: «كم رغيفًا عندكم؟» فقالوا: «سبعة».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف يحافظ على انسياب السرد البسيط من غير إضافة دلالة زمنية غير صريحة.
- source_word: ἠρώτα
  choice: سأل
  rationale: الماضي الناقص قد يصوّر الفعل الجاري، لكن العربية السردية الطبيعية تؤديه هنا بالماضي البسيط من غير خسارة ذات شأن.
- source_word: αὐτούς
  choice: هم (في «سألهم»)
  rationale: ضمير مفعول به جمع يعود على التلاميذ، وقد أُلحق بالفعل على نحو عربي طبيعي.
- source_word: Πόσους
  choice: كم
  rationale: أداة الاستفهام العربية الطبيعية للسؤال عن عدد أشياء معدودة.
- source_word: ἔχετε
  choice: عندكم
  rationale: تعبير عربي فصيح وطبيعي عن الملكية في هذا السؤال، ويؤدي معنى المضارع المخاطب للجمع.
- source_word: ἄρτους
  choice: رغيفًا
  rationale: لأن السياق سياق عدّ، فـ«رغيف» يعبّر عن وحدات الخبز المنفصلة بوضوح أكبر من «خبز».
- source_word: οἱ δὲ εἶπαν
  choice: فقالوا
  rationale: الفاء تنقل جواب الجماعة بصورة طبيعية، و«قالوا» يحافظ على الفعل اليوناني البسيط دون تحويله إلى «أجابوا».
- source_word: Ἑπτά
  choice: سبعة
  rationale: نقل مباشر للعدد، وصيغة المذكر توافق المعدود «أرغفة» المفهوم من السؤال.
