    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: في تلك الأيام
  rationale: تعبير زمني عربي طبيعي يحفظ الإطار السردي من غير تحديد زائد للمدة.
- source_word: πάλιν πολλοῦ ὄχλου ὄντος
  choice: إذ اجتمع أيضًا جمعٌ كبير
  rationale: ينقل الظرفية التي تؤديها صيغة المضاف المطلق، ويحفظ معنى تكرار الموقف وحجم الجمع بلغة عربية واضحة.
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: ولم يكن لديهم ما يأكلونه
  rationale: صياغة عربية مألوفة تبيّن أن الجمع لم يكن لديه طعام.
- source_word: προσκαλεσάμενος τοὺς μαθητάς
  choice: دعا تلاميذه
  rationale: ينقل معنى استدعاء التلاميذ إليه من غير إضافة عبارة تفسيرية ثقيلة؛ وإضافة ضمير الملكية طبيعية والسياق يحدد المرجع.
- source_word: λέγει αὐτοῖς
  choice: وقال لهم
  rationale: استُخدم الماضي لأن الحاضر التاريخي اليوناني يؤدي وظيفة سردية يمكن أن ينقلها الماضي العربي على نحو طبيعي، من غير تغيير في زمن الحدث.
theological_decisions:
- issue: الحاضر التاريخي في λέγει
  choice: وقال لهم
  alternative: ويقول لهم
  rationale: لا تتعلق المسألة بعقيدة، بل بالأسلوب السردي. الماضي هو الصياغة العربية الطبيعية في هذا السياق، مع إثبات الحاضر اليوناني في الحاشية حفاظًا على سمة النص الأصلية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. روعي تسلسل السرد الطبيعي، مع الحفاظ في الحاشية على الحاضر التاريخي اليوناني الذي لا يستقيم بالقدر نفسه في العربية هنا.
