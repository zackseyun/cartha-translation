base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: ar
  text: ألكم أعينٌ أفلا تبصرون؟ ولكم آذانٌ أفلا تسمعون؟ أفلا تتذكرون؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: ألكم أعين
  rationale: ينقل تركيب اسم الفاعل اليوناني في صياغة استفهامية عربية طبيعية، مع إبراز المفارقة البلاغية من غير أن يضيف صراحة معنى «مع أن».
- source_word: βλέπετε
  choice: تبصرون
  rationale: «تبصرون» يقابل فعل الرؤية العادي، ويمكن للسياق أن يحمل اللفظ على الإدراك الروحي من غير التصريح به في المتن.
- source_word: ὦτα ἔχοντες
  choice: ولكم آذان
  rationale: يحافظ على التوازي البلاغي مع «ألكم أعين» بصياغة عربية واضحة.
- source_word: ἀκούετε
  choice: تسمعون
  rationale: ينقل المعنى الحسي الأساسي للفعل، مع إبقاء احتمال الإصغاء والفهم ضمن دلالة السياق.
- source_word: μνημονεύετε
  choice: تذكرون
  rationale: هو المقابل العربي المباشر والطبيعي لفعل التذكر في هذا التوبيخ الاستفهامي.
- source_word: καὶ
  choice: و / أما
  rationale: نُقلت الواو الأولى حرفيًا للموازاة، وصيغت الثانية «أما» لتدفق السؤال التراكمي طبيعيًا في العربية من غير تغيير مضمونه.
- source_word: οὐ / οὐκ
  choice: لا
  rationale: أداة النفي العربية المباشرة داخل الأسئلة الإنكارية.
theological_decisions:
- issue: هل الرؤية والسمع حسيان أم يدلان على الإدراك الروحي؟
  choice: الإبقاء على الفعلين الحسيين «تبصرون» و«تسمعون» في المتن، وترك السياق يدل على البلادة الروحية.
  alternative: ترجمتهما «تدركون» و«تفهمون» لإظهار المعنى المجازي صراحة.
  rationale: يستعمل اليوناني فِعلي الرؤية والسمع العاديين، مع صدى لغوي نبوي يحتمل معنى الإدراك الروحي. إبقاء اللفظ الحسي يصون هذا التوتر وقوة الصورة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختيرت صياغة «ألكم...؟» لتؤدي التركيب اليوناني بلاغيًا وبطبيعية عربية، مع الحفاظ على التوازي والأسئلة الإنكارية.
