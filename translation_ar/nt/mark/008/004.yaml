  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: ar
  text: 'فأجابه تلاميذه: «من أين يستطيع أحد أن يُشبع هؤلاء بالخبز هنا في مكان مقفر؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: فأجابه
  rationale: صياغة سردية عربية طبيعية تنقل فعل الإجابة، مع إفراد الضمير العائد إلى يسوع وجمع الفاعل «تلاميذه».
- source_word: ὅτι
  choice: علامتا الاقتباس
  rationale: تأتي هنا لإدخال الكلام المباشر، وعلامتا الاقتباس أفصح في العربية من ترجمتها بحرف مستقل.
- source_word: Πόθεν
  choice: من أين
  rationale: يحفظ المعنى الحرفي المتعلق بمصدر الخبز، بدل تحويل السؤال تفسيريًا إلى «كيف».
- source_word: τούτους
  choice: هؤلاء
  rationale: الضمير العربي واضح في السياق ويشير طبيعيًا إلى أفراد الجمع من غير تقييده بالذكور.
- source_word: δυνήσεταί τις
  choice: يستطيع أحد
  rationale: ينقل القدرة والشخص غير المحدد؛ والمضارع العربي في سياق السؤال يؤدي المعنى الاستقبالي طبيعيًا من غير حاجة إلى «سيستطيع».
- source_word: ὧδε
  choice: هنا
  rationale: المقابل المكاني المباشر والطبيعي.
- source_word: χορτάσαι
  choice: أن يُشبع
  rationale: ينقل معنى الإطعام إلى حد الشبع، لا مجرد تقديم الطعام.
- source_word: ἄρτων
  choice: خبزًا
  rationale: يحفظ الدلالة الصريحة على الخبز، ويأتي منصوبًا بما يلائم الاستعمال العربي مع «أشبع».
- source_word: ἐπ’ ἐρημίας
  choice: في مكان مقفر
  rationale: ينقل كون الموضع خاليًا من السكان أو الموارد بعبارة عربية واضحة، من غير إضافة إيحاءات غير لازمة.
