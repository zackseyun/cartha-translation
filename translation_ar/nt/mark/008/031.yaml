source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: ar
  text: وبدأ يعلّمهم أن ابن الإنسان لا بد أن يتألم كثيرًا، وأن يرفضه الشيوخ ورؤساء الكهنة والكتبة، وأن يُقتل، وأن يقوم بعد ثلاثة أيام[أ].
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'أو: «في ثلاثة أيام». تقرأ اليونانية عند مرقس: «بعد ثلاثة أيام»؛ وتترجم بعض التقاليد الإنجليزية هذا التعبير بصياغة أكثر اصطلاحية أو تجعله متوافقًا مع المواضع الموازية التي تقول: «في اليوم الثالث».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: بدأ يعلّم
  rationale: ينقل معنى الشروع الذي تفيده ἤρξατο مع المصدر، بصياغة عربية طبيعية واضحة.
- source_word: δεῖ
  choice: لا بد أن
  rationale: يعبّر عن ضرورة قوية من غير أن يضيف إلى النص تفسيرًا لسبب هذه الضرورة أو آليتها.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة العربية الراسخة للقب، وتحفظ صلاته النصية والدلالية من غير شرح داخل المتن.
- source_word: πολλὰ παθεῖν
  choice: يتألم كثيرًا
  rationale: صياغة عربية طبيعية تؤدي اتساع المعاناة الذي يدل عليه πολλά مع πάσχω، من غير تقييده بأنواع محددة.
- source_word: ἀποδοκιμασθῆναι ὑπὸ τῶν πρεσβυτέρων
  choice: يرفضه الشيوخ
  rationale: المبني للمعلوم أنسب هنا في العربية، مع بقاء القيادات المذكورة هي جهة الرفض؛ والشيوخ جماعة قيادية معترفًا بها لا مجرد كبار السن.
- source_word: τῶν ἀρχιερέων
  choice: رؤساء الكهنة
  rationale: يدل الجمع على كبار الكهنة أو الطبقة الكهنوتية القيادية، لا على تعدد شاغلي منصب رئيس كهنة واحد.
- source_word: τῶν γραμματέων
  choice: الكتبة
  rationale: يحفظ المصطلح التاريخي المألوف لهذه الفئة من خبراء الشريعة.
- source_word: ἀποκτανθῆναι
  choice: يُقتل
  rationale: نقل مباشر وطبيعي لصيغة المصدر المبني للمجهول.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: بعد ثلاثة أيام
  rationale: ينقل الدلالة الظاهرة لـ μετά مع النصب، ويحفظ صياغة مرقس بدل مواءمتها مع عبارة «في اليوم الثالث» في مواضع موازية.
- source_word: ἀναστῆναι
  choice: يقوم
  rationale: يحفظ الصيغة اليونانية اللازمة الفعل، ولا يحولها إلى المبني للمجهول «يُقام».
theological_decisions:
- issue: الضرورة التي تفيدها δεῖ في التنبؤ بالآلام
  choice: لا بد أن
  alternative: ينبغي أن / من الضروري أن
  rationale: تحفظ ثقل الضرورة اللاهوتي من غير تحديد منشئها أو شرح تدبيري زائد لا تصرّح به الآية.
- issue: التعبير الزمني μετὰ τρεῖς ἡμέρας
  choice: بعد ثلاثة أيام
  alternative: في اليوم الثالث / خلال ثلاثة أيام
  rationale: تُحفظ عبارة مرقس بحسب اليونانية ذاتها، من غير مواءمتها صامتًا مع صيغ الأناجيل الأخرى.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. رُبطت سلسلة المصادر المؤولة بتكرار «أن» لتوضيح أن التعليم يشمل التألم والرفض والقتل والقيام جميعًا. استُعمل المبني للمعلوم في «يرفضه الشيوخ...» لأنه أجزل وأوضح عربيًا مع حفظ جهة الفعل، بينما حُفظ المبني للمجهول في «يُقتل».
