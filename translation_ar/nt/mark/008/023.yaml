  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: ar
  text: 'فأخذ بيد الأعمى وقاده خارج القرية. وبعد أن بصق على عينيه[a] ووضع يديه عليه، سأله: «هل ترى شيئًا؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكبر: «بصق في عينيه».'
    reason: بديل يبيّن بصورة أوضح القوة الاتجاهية لحرف الجر اليوناني εἰς، بينما «على عينيه» هي الصياغة العربية الأكثر طبيعية في المتن.
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ
  choice: أمسك بيد الأعمى
  rationale: ينقل التعبير اليوناني الدال على الإمساك باليد بصياغة عربية طبيعية، مع إبقاء الفعل الملموس وكون الصفة τυφλός مستعملة اسمًا.
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: قاده إلى خارج القرية
  rationale: السياق، وفيه إمساك الرجل بيده، يرجح معنى القيادة إلى الخارج؛ و«القرية» تقابل κώμη بدقة.
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: تفل في عينيه
  rationale: تحافظ «في» على الاتجاه الحسي الذي تفيده εἰς، من غير تلطيف للتفصيل الجسدي الوارد في النص.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: وضع يديه عليه
  rationale: وصف مباشر للمس باليدين، ولا يضيف إلى العبارة دلالة طقسية غير منصوص عليها.
- source_word: ἐπηρώτα αὐτόν
  choice: سأله
  rationale: صياغة سردية عربية واضحة للماضي الناقص اليوناني، من غير إثقال النص بإبراز الاستمرار حيث لا يقتضيه السياق.
- source_word: Εἴ τι βλέπεις;
  choice: هل ترى شيئًا؟
  rationale: سؤال عربي طبيعي يحفظ عدم التحديد في τι ولا يحوله إلى سؤال عن القدرة.
theological_decisions:
- issue: الحفاظ على الطابع الجسدي لأفعال الشفاء
  choice: إبقاء ذكر التفل في عيني الرجل ووضع اليدين عليه صريحًا
  alternative: صياغة مخففة تقلل من حدة التفاصيل الجسدية
  rationale: النص يروي أفعالًا حسية ملموسة، ولا يسوغ تنعيمها أو حذف ما قد يبدو مستغربًا للقارئ الحديث.
- issue: احتمال فهم وضع اليدين بوصفه طقسًا رسميًا
  choice: 'ترجمته وصفًا مباشرًا: «وضع يديه عليه»'
  alternative: استعمال تعبير يحمّله معنى شعائريًا أو كنسيًا لاحقًا
  rationale: السياق يتحدث عن لمس في أثناء الشفاء، ولا يفرض دلالة أسرارية أو دلالة سيامة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. رُبطت الأفعال في تسلسل سردي طبيعي، مع الحفاظ على الأفعال الحسية المباشرة وعلى صيغة السؤال المفتوحة.
