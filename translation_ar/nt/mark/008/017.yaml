  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: ar
  text: 'وإذ علم بذلك، قال لهم: «لماذا تتناقشون في أنه ليس عندكم خبز؟ أما زلتم لا تدركون ولا تفهمون؟ ألكم قلوبٌ متقسّية؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: وإذ علم بذلك
  rationale: اسم الفاعل الماضي يدل على أن يسوع أدرك حديثهم؛ وأُضيف «بذلك» لإظهار المفعول المفهوم من السياق من غير توسع.
- source_word: διαλογίζεσθε
  choice: تتناقشون
  rationale: يناسب التداول الجاري بينهم بشأن عدم وجود الخبز، ويحفظ معنى المداولة المتبادلة.
- source_word: ἄρτους
  choice: خبز
  rationale: مع أن اليونانية تستعمل الجمع، يُستعمل «خبز» في العربية طبيعيًا اسمَ جنس في هذا السياق.
- source_word: νοεῖτε
  choice: تدركون
  rationale: يحفظ معنى الإدراك الذهني ويميّزه عن فعل الفهم التالي.
- source_word: συνίετε
  choice: تفهمون
  rationale: ينقل معنى الفهم والاستيعاب، مع إبقاء اقترانه البلاغي بـ«تدركون».
- source_word: πεπωρωμένην
  choice: متقسٍّ
  rationale: ينقل حالة التصلب المستمرة التي يدل عليها اسم المفعول التام، ويحفظ الاستعارة الروحية.
- source_word: καρδίαν
  choice: قلب
  rationale: يحفظ صيغة المفرد في الأصل واستعارة القلب بوصفه باطن الإنسان وموضع الإدراك والاستجابة.
theological_decisions:
- issue: صياغة السؤال الأخير عن حالة التلاميذ
  choice: ألكم قلبٌ متقسٍّ؟
  alternative: أقلبكم متقسٍّ؟
  rationale: تحفظ الصياغة المختارة فعل الملكية ἔχετε وصيغة «القلب» المفردة، وتبقي حدّة التوبيخ من غير تركيب عربي متكلف أو تقرير سبب التقسي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «أما زلتم» لنقل οὔπω في سؤال توبيخي طبيعي، وحُفظ الفرق بين الإدراك والفهم وكذلك مفرد «قلب» الجمعي.
