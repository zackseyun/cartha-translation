  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: ar
  text: وجاءوا إلى بيت صيدا. وأحضروا إليه رجلًا أعمى، وتوسّلوا إليه أن يلمسه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: جاءوا
  rationale: المضارع اليوناني مضارع تاريخي، ويُترجم بالماضي في السرد العربي الطبيعي مع الحفاظ على تتابع الأحداث.
- source_word: εἰς Βηθσαϊδάν
  choice: إلى بيت صيدا
  rationale: حرف الجر εἰς مع اسم المكان يدل هنا طبيعيًا على الاتجاه، واسم البلدة يُنقل بصيغته العربية الشائعة.
- source_word: φέρουσιν
  choice: أحضروا
  rationale: المضارع تاريخي؛ و«أحضروا» تنقل معنى الإتيان بالرجل إلى يسوع من غير افتراض أنهم حملوه جسديًا.
- source_word: τυφλὸν
  choice: رجلًا أعمى
  rationale: الصفة مستعملة استعمال الاسم، وهي مذكر مفرد؛ وهذه الصياغة واضحة وطبيعية في العربية.
- source_word: παρακαλοῦσιν
  choice: توسّلوا
  rationale: الفعل يدل في هذا السياق على طلب ملحّ وجاد، لا على مجرد السؤال، و«توسّلوا» يحفظ هذه القوة دون مبالغة.
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: أن يلمسه
  rationale: تركيب ἵνα مع صيغة الالتماس يبيّن مضمون طلبهم، والمصدر المؤول بـ«أن» هو التعبير العربي الطبيعي؛ والفعل ἅπτομαι يعني اللمس.
- source_word: καὶ
  choice: و
  rationale: الإبقاء على الواو في مطلع الجملتين يحفظ أسلوب مرقس العطفي المتتابع من غير تكلّف.
theological_decisions: []
