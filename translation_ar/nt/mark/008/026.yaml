  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: ar
  text: 'وأرسله إلى بيته[a] قائلًا: «لا تدخل حتى إلى القرية».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تضيف بعض المخطوطات: «ولا تخبر أحدًا في القرية».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: أرسله
  rationale: ينقل فعل الإرسال في السياق السردي بوضوح، من غير أن يضيف معنى التكليف بمهمة أو يبالغ في معنى الصرف.
- source_word: εἰς οἶκον αὐτοῦ
  choice: إلى بيته
  rationale: تعبير عربي طبيعي يدل على توجيهه إلى مسكنه، ويحافظ على دلالة الملكية في αὐτοῦ.
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على الصلة الحالية بين فعل الإرسال والكلام الذي صاحبه، وفق صيغة اسم الفاعل اليونانية.
- source_word: Μηδὲ
  choice: لا... حتى
  rationale: ينقل قوة النفي الإضافي في μηδέ، أي ألّا يدخل القرية أصلًا، بصياغة عربية مفهومة وطبيعية في هذا السياق.
- source_word: κώμην
  choice: القرية
  rationale: المقابل المباشر الشائع لـ κώμη، وهو أنسب من «المدينة» لمستوطنة صغيرة.
- source_word: εἰσέλθῃς
  choice: تدخل
  rationale: ينقل فعل الدخول في صيغة نهي عربية مباشرة وموجزة.
theological_decisions:
- issue: نطاق نهي يسوع المتعلق بالقرية
  choice: إبقاء النهي أمرًا مباشرًا بعدم دخول القرية، من غير إضافة سبب أو توسيع لمضمونه.
  alternative: تضيف بعض المخطوطات نهيًا عن إخبار أي شخص في القرية.
  rationale: نص SBLGNT المعطى لا يتضمن إلا النهي عن دخول القرية؛ لذلك لا تُدرج القراءة الأطول في المتن، بل تُذكر في الحاشية بوصفها اختلافًا نصيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «إلى بيته» بدل الصياغة الحرفية الأثقل «إلى داخل بيته»، وحُفظت قوة μηδέ بصياغة «لا تدخل حتى إلى القرية» من غير إدخال القراءة النصية الأطول في المتن.
