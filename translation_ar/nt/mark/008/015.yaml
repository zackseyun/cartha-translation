  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: ar
  text: 'وكان يحذّرهم قائلًا: «تنبّهوا! احذروا من خميرة[a] الفريسيين وخميرة هيرودس[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمتها «الخمير». أُبقيت صورة الخميرة لأنها تعبّر عن تأثير يتغلغل وينتشر.
    reason: lexical_alternative
  - marker: b
    text: أي التأثير المرتبط بالفريسيين وبهيرودس؛ وللاستعمالات القريبة لصورة الخميرة، انظر متى 16:6، 12 ولوقا 12:1. غير أن هذه الآية نفسها لا تحدّد طبيعة ذلك التأثير.
    reason: cross_reference
lexical_decisions:
- source_word: διεστέλλετο
  choice: كان يحذّرهم
  rationale: صيغة الماضي الناقص تدل على فعل مستمر أو متكرر، والسياق سياق تحذير جاد؛ و«كان يحذّرهم» تعبير عربي طبيعي يحفظ هذه الدلالة دون تحويل الكلام إلى أمر رسمي وقع مرة واحدة.
- source_word: λέγων
  choice: قائلًا
  rationale: اسم الفاعل اليوناني يقدّم مضمون التحذير، و«قائلًا» يحفظ بنية العبارة بوضوح وطبيعية.
- source_word: Ὁρᾶτε
  choice: تنبّهوا
  rationale: الفعل هنا أمر باليقظة لا بمجرد الرؤية، و«تنبّهوا» ينقل معنى الانتباه إلى الخطر.
- source_word: βλέπετε
  choice: احذروا
  rationale: تكرار فعلين متقاربين يفيد التشديد. واستعمال «تنبّهوا! احذروا» يحفظ الازدواج البلاغي مع التمييز الطبيعي بين الفعلين.
- source_word: ἀπὸ
  choice: من
  rationale: حرف الجر اليوناني يفيد الابتعاد، وتأتي «من» طبيعيًا بعد «احذروا» وتحفظ معنى الاحتراز والابتعاد.
- source_word: ζύμης
  choice: خميرة
  rationale: «خميرة» لفظ حديث واضح يحفظ الصورة المجازية لشيء يسري أثره في العجين، من غير تفسير ذلك الأثر داخل المتن.
- source_word: Φαρισαίων
  choice: الفريسيين
  rationale: الصيغة العربية المألوفة لاسم الجماعة، وهي في علاقة إضافة إلى «خميرة».
- source_word: Ἡρῴδου
  choice: هيرودس
  rationale: يذكر النص هيرودس نفسه في تركيب موازٍ للفريسيين؛ لذلك لم يُوسَّع المرجع في المتن إلى أتباعه أو بيته أو نفوذه.
theological_decisions:
- issue: معنى استعارة «الخميرة»
  choice: الإبقاء على الاستعارة من غير تحديد معناها في المتن
  alternative: تعليم الفريسيين وهيرودس، أو رياؤهم، أو تأثيرهم المفسد
  rationale: تشير القرائن والنصوص الموازية إلى تأثير سلبي متغلغل، لكن مرقس 8:15 لا يحدّد وجه الاستعارة تحديدًا صريحًا؛ لذلك يحفظ المتن انفتاحها الدلالي، ويقتصر الإيضاح على الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة وقورة. حُفظ تكرار فعلي التحذير في الأصل بصيغتين متقاربتين، وحُفظت استعارة الخميرة بدل استبدالها بتفسير مذهبي أو تعليمي محدد.
