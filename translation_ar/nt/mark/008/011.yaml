  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: ar
  text: وخرج الفريسيون، وبدأوا يجادلونه، طالبين منه آيةً من السماء[a]، وهم يمتحنونه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «آية من السماء/الجو»؛ والأرجح أن المقصود آية ذات أصل سماوي، أي إلهي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: خرج
  rationale: فعل ماضٍ يحافظ على حركة الدخول إلى المشهد من غير تحديد مكان الخروج، وهو طبيعي في العربية.
- source_word: ἤρξαντο συζητεῖν
  choice: بدأوا يجادلونه
  rationale: ينقل معنى الشروع، ويعبّر «يجادلونه» عن الطابع الخصامي الذي يؤكده قصد الامتحان.
- source_word: αὐτῷ
  choice: ـه في «يجادلونه»
  rationale: ينقل ضمير الغائب المتصل بالفعل بصورة عربية طبيعية، من غير إدخال اسم يسوع غير المذكور في اليونانية.
- source_word: ζητοῦντες
  choice: طالبين
  rationale: اسم فاعل يعبّر عن فعل متزامن مع الجدال؛ و«طالبين» أوضح عربيًا من «ملتمسين» في سياق التحدي، من غير بلوغ شدة «مطالبين».
- source_word: παρ’ αὐτοῦ
  choice: منه
  rationale: تنقل παρά مع المضاف إليه بوصفها دالة على المصدر.
- source_word: σημεῖον
  choice: آيةً
  rationale: «آية» هي المقابل الكتابي العربي الطبيعي لعلامة ذات دلالة إثباتية، ولا تحصر المعنى في مجرد معجزة خارقة.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: يحافظ على الصورة الأصلية وعلى احتمال الإشارة إلى أصل سماوي، أي إلهي، من غير تفسير زائد داخل المتن.
- source_word: πειράζοντες
  choice: ليمتحنوه
  rationale: يبيّن الغرض العدائي من الطلب، ويحافظ على معنى الاختبار من غير الإيحاء بإغرائه على ارتكاب خطيئة.
theological_decisions:
- issue: معنى «من السماء» في طلب الآية
  choice: الإبقاء على «آية من السماء» بما يرجّح أصلًا أو تفويضًا سماويًا، أي إلهيًا
  alternative: آية من جهة السماء المرئية
  rationale: السياق الإنجيلي وتحدي الفريسيين يرجّحان طلب آية موثقة من الله، لكن الصياغة الحرفية في المتن تحفظ مدى العبارة ولا تحسمه بتفسير صريح.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «يجادلونه» لإظهار الخصومة، و«طالبين» للمحافظة على صيغة الحال، مع تجنب الألفاظ المذهبية أو التفسير الزائد.
