base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: ar
  text: وأمر الحشد بالاتكاء على الأرض[a]. ثم أخذ الأرغفة السبعة، وشكر، وكسرها، وظلّ يعطيها لتلاميذه لكي يضعوها أمام الحشد[b]، فوضعوها أمامهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يجلسوا». يدل الفعل اليوناني، على نحو أخص، على الاتكاء لتناول الطعام.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يقدّموها لهم». والمعنى الحرفي للفعل اليوناني هو «يضعها أمامهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: أمر
  rationale: يدل الفعل على إصدار توجيه ذي سلطة. وصيغة الماضي أنسب للسرد العربي، مع أن اليونانية تستعمل المضارع التاريخي.
- source_word: ἀναπεσεῖν
  choice: أن يتكئوا
  rationale: يشير الفعل في سياق الطعام إلى الاتكاء لتناول الوجبة، لا إلى مجرد الجلوس؛ وأُبقي البديل الأعم في الحاشية.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: المقصود سطح الأرض الذي يتكئ عليه الجمع، وهذه صياغة عربية طبيعية ومباشرة.
- source_word: λαβὼν τοὺς ἑπτὰ ἄρτους
  choice: أخذ الأرغفة السبعة
  rationale: ἄρτοι في هذا السياق أرغفة خبز، وصيغت العبارة فعلاً متسلسلاً طبيعيًا في العربية.
- source_word: εὐχαριστήσας
  choice: وشكر
  rationale: يحافظ على معنى تقديم الشكر من غير إضافة مفعول غير مصرّح به في النص، مثل «الله».
- source_word: ἔκλασεν
  choice: وكسرها
  rationale: الضمير يعود بوضوح إلى الأرغفة، وإظهاره يلائم العربية.
- source_word: ἐδίδου
  choice: وظلّ يعطيها
  rationale: ينقل وجه الفعل الناقص الدال على الاستمرار أو التكرار في إعطاء الخبز للتلاميذ.
- source_word: ἵνα παρατιθῶσιν
  choice: لكي يضعوها أمام الجمع
  rationale: يحفظ المعنى الحسي للفعل، أي وضع الطعام أمام الآكلين، بدل اختزاله في «يخدموا».
- source_word: παρέθηκαν
  choice: فوضعوها أمامهم
  rationale: يحافظ على الاتساق مع الفعل السابق، مع استعمال الضمير لتجنب تكرار «الجمع» ثقيلًا في العربية.
- source_word: ὄχλος
  choice: الجمع
  rationale: لفظ عربي فصيح واضح يدل على جماعة الناس المحتشدة، ويحافظ على النبرة السردية الكريمة.
theological_decisions:
- issue: التتابع السردي والإيحاء الإفخارستي
  choice: 'تُرجم εὐχαριστήσας ترجمة مباشرة: «وشكر»'
  alternative: «وشكر الله» أو صياغة طقسية صريحة
  rationale: قد تستدعي العبارة ممارسات مسيحية لاحقة، لكن الآية نفسها لا تصوغ تعليمًا أسراريًا ولا تذكر مفعول الشكر صراحة؛ لذلك لم تُضف دلالة عقائدية إلى النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. حُفظ تكرار فعل الوضع في الأصل من حيث المعنى، وخُفف تكرار اسم «الجمع» في الجملة الأخيرة بضمير واضح. جميع علامات الحواشي مثبتة في المتن.
