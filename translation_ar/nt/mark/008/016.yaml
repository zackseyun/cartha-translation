- source_word: οὐκ ἔχουσιν
  choice: ليس عندنا
  rationale: يحفظ زمن القول كما يَرِد في مضمون كلامهم، ويأتي طبيعيًا مع تحويل الضمير إلى صيغة المتكلمين في الاقتباس المباشر.
