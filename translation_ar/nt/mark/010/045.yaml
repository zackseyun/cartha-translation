source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: ar
  text: فإن ابن الإنسان أيضًا لم يأتِ ليُخدَم، بل ليَخدِم، وليبذل حياته فديةً بدلًا من كثيرين.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فديةً عن كثيرين». تفيد الكلمة اليونانية المترجمة «بدلًا من» معنى البدل أو المقابلة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: فإن ... أيضًا
  rationale: تنقل «فـ/إن» وظيفة γάρ التفسيرية التي تربط القول بما قبله، وتحفظ «أيضًا» نبرة καί التأكيدية في صياغة عربية طبيعية.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: اللقب العربي المستقر الذي يحفظ صدى دانيال ودلالته بوصفه تعبيرًا يستعمله يسوع عن نفسه.
- source_word: οὐκ ἦλθεν
  choice: لم يأتِ
  rationale: ترجمة مباشرة للفعل، وترتبط بلام الغرض في المصدرين التاليين.
- source_word: διακονηθῆναι
  choice: ليُخدَم
  rationale: صياغة واضحة تحفظ المبني للمجهول، وتتيح إبراز المقابلة اللفظية مع «ليَخدِم».
- source_word: ἀλλὰ διακονῆσαι
  choice: بل ليَخدِم
  rationale: تحفظ المقابلة البلاغية مع «ليُخدَم» باستعمال الجذر العربي نفسه.
- source_word: δοῦναι
  choice: ليبذل
  rationale: «يبذل حياته» تعبير عربي طبيعي يدل على إعطائها طوعًا حتى الموت، من غير حصر الفعل في معنى التسليم إلى جهة معينة.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: حياته
  rationale: تشير ψυχή هنا إلى الحياة التي تُعطى حتى الموت، لا إلى النفس بوصفها جزءًا غير مادي فقط.
- source_word: λύτρον
  choice: فديةً
  rationale: «فدية» المقابل العربي الموجز والطبيعي للثمن المدفوع من أجل الإطلاق أو التحرير.
- source_word: ἀντὶ πολλῶν
  choice: بدلًا من كثيرين
  rationale: تحفظ هذه العبارة بوضوح دلالة ἀντί على البدل أو المقابلة، كما تبقي πολλῶν بصيغة «كثيرين» من غير توسيع أو تضييق تفسيري.
theological_decisions:
- issue: دلالة ἀντί في قول الفدية
  choice: بدلًا من كثيرين
  alternative: عن كثيرين
  rationale: تميل ἀντί في هذا التركيب إلى معنى البدل أو المقابلة؛ لذلك أُثبت هذا المعنى في المتن، مع ذكر الصياغة العربية التقليدية الأوسع في الحاشية من غير تقرير نظرية لاهوتية تفصيلية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على التوازي بين «ليُخدَم» و«ليَخدِم» وعلى لقب «ابن الإنسان». وُضعت علامة الحاشية بعد العبارة التي تشرحها.
