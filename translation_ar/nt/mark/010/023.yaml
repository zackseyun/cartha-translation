source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: ar
  text: 'وبعد أن نظر يسوع حوله، قال لتلاميذه: «ما أصعب أن يدخل الذين يملكون الأموال[a] إلى ملكوت الله!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المال»؛ ويمكن أن يدل اللفظ أيضًا على الممتلكات أو الثروات.'
    reason: بديل معجمي يبيّن سعة دلالة χρήματα من غير حصرها في النقود وحدها.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: بعد أن نظر ... حوله
  rationale: ينقل اسم الفاعل اليوناني في صيغة الماضي مع دلالته الطبيعية على فعل سبق القول، ويحفظ معنى التفات يسوع بالنظر إلى من حوله.
- source_word: λέγει
  choice: قال
  rationale: هو مضارع تاريخي شائع في سرد مرقس؛ والماضي هو الأسلوب الطبيعي الواضح في السرد العربي، من غير تغيير للحدث.
- source_word: Πῶς δυσκόλως
  choice: ما أصعب أن
  rationale: صيغة تعجب عربية طبيعية تنقل التشديد الذي تفيده العبارة اليونانية على شدة الصعوبة، من غير أن تحولها إلى استحالة.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: الذين يملكون الأموال
  rationale: يحفظ تركيب العبارة الوصفي، بدل اختزاله في تصنيف اجتماعي ثابت مثل «الأغنياء».
- source_word: χρήματα
  choice: الأموال
  rationale: لفظ عربي واضح يشمل المال والموارد المادية، مع إثبات بدائل المعنى الممكنة في الحاشية.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير كتابي عربي مألوف وشفاف يحفظ صورة المُلك والاستمرارية الاصطلاحية في إنجيل مرقس.
- source_word: εἰσελεύσονται
  choice: أن يدخل
  rationale: ينقل فعل الدخول في تركيب عربي طبيعي بعد صيغة «ما أصعب أن»، بينما يفيد السياق القول العام المتجه إلى الدخول الآتي.
theological_decisions:
- issue: هل يفيد القول استحالة دخول أصحاب الأموال إلى ملكوت الله أم شدة صعوبته؟
  choice: 'شدة الصعوبة: «ما أصعب أن يدخل...»'
  alternative: صياغة مشددة تؤول الكلام على أنه استحالة عملية
  rationale: تستعمل اليونانية δυσκόλως، أي «بصعوبة»، ولا تستعمل لفظًا يدل بذاته على الاستحالة؛ لذلك تُحفظ حدة القول وتوتره اللاهوتي من غير إضافة حكم أقوى من نص الآية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل تركيب وصفي قريب من الأصل، وصيغة تعجب عربية طبيعية. وُضعت علامة الحاشية عند «الأموال» لأنها تتعلق بالبديل المعجمي لهذا اللفظ.
