  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: الفعل التمهيدي «وبعد أن نظر ... حوله»، وخطاب يسوع لتلاميذه، والتعجب الدال على شدة الصعوبة، ووصف «الذين يملكون الأموال»، و«ملكوت الله». وصيغة «ما أصعب أن يدخل» عربية طبيعية، وتحافظ على معنى الصعوبة لا الاستحالة؛ كما أن المضارع المنصوب في «يدخل» صالح في هذا التركيب للدلالة على الدخول المرتقب الذي يفيده المستقبل اليوناني.'
  naturalness: الصياغة فصيحة حديثة وواضحة وذات نبرة مناسبة للسرد الإنجيلي. اختيار الماضي في «قال» مقبول وطبيعي في العربية السردية رغم المضارع التاريخي في اليونانية.
  terminology: «الأموال» مقابل χρήματα اختيار واسع ودقيق في السياق، والحاشية المرتبطة به تبيّن بوضوح إمكان دلالة اللفظ على المال أو الممتلكات أو الثروات. و«ملكوت الله» اصطلاح عربي كتابي مستقر ومناسب.
