  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: ar
  text: 'فقال لهم يسوع: «أنتم لا تعرفون ما تطلبون. أفي استطاعتكم أن تشربوا الكأس التي أشربها[a]، أو أن تُعَمَّدوا بالمعمودية التي أُعَمَّد بها[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الكأس» صورة كتابية للنصيب المعيَّن لشخص، وتشير هنا بوجه خاص إلى آلام يسوع المقبلة.
    reason: cross_reference
  - marker: b
    text: 'يمكن ترجمتها ترجمة تفسيرية: «أو أن تجتازوا ما أجتازه». يكرر اليوناني الكلمات المشتقة من جذر المعمودية للتوكيد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: فقال لهم يسوع
  rationale: تنقل الفاء الانتقال إلى جواب يسوع التصحيحي بسلاسة، من غير تضخيم قوة δέ إلى استدراك حاد.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: أنتم لا تعرفون ما تطلبون
  rationale: تحافظ «تعرفون» على المعنى الأساسي للفعل οἶδα، مع بقاء دلالة عدم الإدراك ممكنة من السياق، و«تطلبون» تعبير عربي مباشر عن αἰτεῖσθε.
- source_word: δύνασθε
  choice: أفي استطاعتكم
  rationale: تعبّر بوضوح عن القدرة والاستطاعة، وتحافظ على صيغة السؤال.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: أن تشربوا الكأس التي أشربها
  rationale: تُبقي صورة الكأس كما وردت، ولا تفسرها داخل المتن تفسيرًا حصريًا بالألم أو الموت.
- source_word: ἢ
  choice: أو
  rationale: تنقل أداة الفصل في نص SBLGNT من غير مواءمة النص مع صيغ مخطوطية أو موازية أخرى.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: أن تُعَمَّدوا بالمعمودية التي أُعَمَّد بها
  rationale: تحافظ على تكرار الجذر بين «المعمودية» و«تُعَمَّدوا/أُعَمَّد»، وعلى الصيغة المبنية للمجهول والصورة المجازية، مع أسلوب عربي مفهوم.
theological_decisions:
- issue: 'الصورتان المجازيتان: الكأس والمعمودية'
  choice: الإبقاء على الصورتين حرفيًا في المتن
  alternative: تفسيرهما في المتن بالمعاناة أو الموت أو الغضب الإلهي
  rationale: تشيران في السياق إلى ما سيلاقيه يسوع، ولا سيما آلامه المقبلة، لكن الآية لا تحصر دلالتهما في شرح عقائدي واحد؛ لذلك يحفظ المتن توتر الصورة واتساعها.
- issue: البناء للمجهول في βαπτίζομαι وβαπτισθῆναι
  choice: «أُعَمَّد» و«تُعَمَّدوا»
  alternative: «أخضع» و«تخضعوا» أو «أجتاز» و«تجتازوا»
  rationale: يبقي البناء للمجهول والعلاقة اللفظية بالمعمودية، ولا يعيّن الفاعل الضمني أو يحوّل الصورة إلى تفسير مجرد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت استعارتا الكأس والمعمودية، كما حُفظ التكرار الاشتقاقي في العبارة الثانية من غير إدخال تفسير مذهبي في المتن.
