  text: ὁ δὲ στυγνάσας ἐπὶ τῷ λόγῳ ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: ar
  text: أما هو، فاغتمّ من هذا الكلام ومضى حزينًا، لأنه كان يملك ممتلكات كثيرة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στυγνάσας
  choice: عَبَسَ
  rationale: ينقل الفعل تغيرًا ظاهرًا إلى هيئة قاتمة أو عابسة، من غير اختزاله في مجرد شعور داخلي أو إضافة حكم أخلاقي.
- source_word: ἐπὶ τῷ λόγῳ
  choice: عند هذا الكلام
  rationale: تعبير عربي طبيعي يحفظ كون الكلام مناسبة رد فعله وسببه، مع بقاء الإشارة إلى القول المفرد في السياق.
- source_word: ἀπῆλθεν
  choice: مضى
  rationale: لفظ سردي عربي واضح وموجز يدل على الانصراف.
- source_word: λυπούμενος
  choice: حزينًا
  rationale: يعبر عن الحزن الملازم له عند انصرافه؛ والصياغة الحالية طبيعية في العربية، وإن كان اسم الفاعل اليوناني يوحي باستمرار الحالة.
- source_word: κτήματα πολλά
  choice: ممتلكات كثيرة
  rationale: كلمة κτήματα تدل على ما يملكه المرء من أملاك أو مقتنيات، و«كثيرة» تقابل πολλά بلا إيحاء زائد بالعظمة أو المكانة.
- source_word: ἦν γὰρ ἔχων
  choice: لأنه كان يملك
  rationale: يحفظ معنى الحالة المستمرة في التركيب اليوناني بصياغة عربية سليمة.
theological_decisions:
- issue: طبيعة استجابة الرجل العاطفية لطلب يسوع
  choice: إظهار العبوس المرئي والحزن من غير إضافة إدانة أخلاقية
  alternative: تفسير استجابته بأنها غضب أو تمرد صريح، أو بأنها مجرد خيبة أمل
  rationale: النص يصف هيئة قاتمة وحزنًا مستمرًا، لكنه لا يصرح بالغضب ولا يقدم هنا حكمًا مباشرًا على دوافع الرجل؛ لذا تُحفظ حدة الموقف ولا تُحسم بما يتجاوز الألفاظ اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أما هو» لإبراز المقابلة التي تفيدها ὁ δέ، و«عَبَسَ» للمحافظة على المظهر المرئي في στυγνάσας، مع تجنب الصياغة الحرفية الثقيلة.
