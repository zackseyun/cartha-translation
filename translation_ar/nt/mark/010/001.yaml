  terminology: «اليهودية»، «نواحي»، «ما وراء نهر الأردن»، و«الجموع» اختيارات واضحة وملائمة للسجل المطلوب. ولا توجد حمولة تفسيرية أو مذهبية زائدة. الحاشيتان مثبتتان في الموضع الجغرافي الذي تشرحانه وتحافظان على الاحتمال البديل.
