id: MRK.10.1
reference: Mark 10:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: ar
  text: ثُمَّ قامَ مِن هناكَ وجاءَ إلى نواحي اليهوديّة وإلى ما وراءَ نهرِ الأردنّ[a][b]. فتجمَّعتْ إليه الجموعُ من جديد، وكما كانت عادتُه، عادَ يُعلِّمُهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وإلى عبر الأردن». يمكن أن تدل العبارة اليونانية على المنطقة الواقعة في الجانب الآخر من نهر الأردن.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا فهم العبارة: «إلى نواحي اليهودية التي وراء نهر الأردن».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: مِن هناكَ
  rationale: تعبير مكاني طبيعي يدل على الانطلاق من الموضع السابق.
- source_word: ἀναστὰς
  choice: قامَ
  rationale: ينقل النهوض الممهِّد للرحيل دون أن يوحي هنا بالقيامة من الموت.
- source_word: ἔρχεται
  choice: وجاءَ
  rationale: صيغ الماضي أنسب للسرد العربي المتماسك، مع أن اليونانية تستعمل المضارع التاريخي لإضفاء الحيوية.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: نواحي اليهوديّة
  rationale: تفيد ὅρια المناطق أو التخوم؛ و«نواحي» واضحة ولا تحصر المعنى في خط حدودي دقيق.
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: وإلى ما وراءَ نهرِ الأردنّ
  rationale: تحافظ على الدلالة الجغرافية للمنطقة الواقعة في الجانب الآخر من الأردن، مع التصريح بأنه نهر لزيادة الوضوح للقارئ الحديث.
- source_word: συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν
  choice: فتجمَّعتْ إليه الجموعُ من جديد
  rationale: ينقل المعنى السياقي لاجتماع الجموع واتجاهها إليه بصياغة عربية طبيعية.
- source_word: ὡς εἰώθει
  choice: وكما كانت عادتُه
  rationale: يعبّر بوضوح عن الفعل المعتاد المتكرر.
- source_word: πάλιν ἐδίδασκεν αὐτούς
  choice: عادَ يُعلِّمُهم
  rationale: «عاد» تحفظ معنى πάλιν، والمضارع بعده يصوّر استمرار التعليم الذي يفيده الماضي الناقص اليوناني.
theological_decisions:
- issue: المضارع التاريخي في ἔρχεται
  choice: نُقل بصيغة الماضي «جاء»
  alternative: «يأتي» حفاظًا على المضارع التاريخي حرفيًا
  rationale: الماضي هو الأسلوب الطبيعي في السرد العربي هنا، ولا يغيّر مضمون الحدث، في حين قد يبدو الانتقال المفاجئ إلى المضارع متكلفًا.
- issue: تركيب καὶ πέραν τοῦ Ἰορδάνου الجغرافي
  choice: «إلى نواحي اليهودية وإلى ما وراء نهر الأردن» بوصفه وصفًا أو وجهة جغرافية مضافة
  alternative: «إلى نواحي اليهودية التي وراء نهر الأردن» بوصف العبارة مقيِّدة لنواحي اليهودية
  rationale: التركيب اليوناني موجز ويحتمل الربط بطريقتين؛ أبقى المتن ترتيب العطف ولا يحسم الاحتمال الآخر بلا تنبيه.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «نواحي» بدل «حدود» لأن السياق يتحدث عن منطقة الوصول، وحُفظ تكرار πάλιν بتعبيري «من جديد» و«عاد». وُضعت علامتا الحاشيتين عند العبارة الجغرافية التي تفسّرانها.
