  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: ar
  text: لكن كثيرون من الأوّلين سيكونون آخِرين، والآخِرون أوّلين.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: كثيرين
  rationale: الصفة مستعملة استعمال الاسم وتشير إلى جماعة واسعة لا إلى كل فرد. ويُفهم الموصوف، أي الناس، من السياق من غير حاجة إلى إضافته.
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا ذا مسحة استدراكية بعد الوعد الوارد في الآية السابقة، و«لكن» تنقل هذا التقابل بوضوح.
- source_word: ἔσονται
  choice: سيكونون
  rationale: تنقل صيغة المستقبل البسيطة، مع ضمير الجمع العائد إلى «كثيرين».
- source_word: πρῶτοι
  choice: الأوّلين / أوّلين
  rationale: تدل هنا على المنزلة أو المرتبة ضمن قول تقابلي، وتحافظ «الأوّلين» على التضاد المباشر مع «الآخِرين».
- source_word: ἔσχατοι
  choice: آخِرين / الآخِرون
  rationale: تحافظ على المقابلة المباشرة مع «الأوّلين» من دون تفسيرها بأنها دنو اجتماعي أو أخلاقي بعينه.
- source_word: οἱ ἔσχατοι
  choice: الآخِرون
  rationale: أداة التعريف تجعل العبارة اسمية؛ وهذه الصياغة العربية موجزة وطبيعية وتحفظ توازن شطري القول.
- source_word: καὶ
  choice: و
  rationale: تربط نصفي القول ببساطة وتحافظ على بنيته المتوازية من غير إضافة دلالة تفسيرية.
theological_decisions:
- issue: طبيعة قول الانقلاب بين الأوّلين والآخِرين
  choice: صياغته مبدأً عامًا عن انقلاب المراتب من غير تحديد الفئات الاجتماعية أو الأخلاقية أو الخلاصية.
  alternative: قصر «الأوّلين» و«الآخِرين» على الأغنياء والفقراء، أو التلاميذ والغرباء، أو جعله قاعدة مطلقة تشمل كل فرد بلا استثناء.
  rationale: النص يقدم قولًا موجزًا ومفارِقًا، ولا يحدد في هذه الآية وحدها الفئات المقصودة تحديدًا جامعًا؛ لذلك تُحفظ سعته وتوتره اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات إيقاع حكمي متوازن. استُعملت «آخِر» بكسر الخاء بمعنى المقابل للأول، مع ضبط جزئي يرفع احتمال التباسها بـ«آخَر».
