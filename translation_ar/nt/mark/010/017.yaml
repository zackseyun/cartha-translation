  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: ar
  text: 'وبينما كان يخرج إلى الطريق[a]، أقبل إليه رجل راكضًا، وجثا على ركبتيه أمامه، وسأله: «أيها المعلّم الصالح، ماذا أفعل لكي أرث الحياة الأبدية؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبينما كان منطلقًا في طريقه». قد تشير العبارة اليونانية إلى الخروج إلى الطريق أو إلى بدء رحلة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: وفيما كان خارجًا إلى الطريق
  rationale: ينقل تركيب المضاف المطلق بوصفه فعلًا خلفيًّا متزامنًا، ويحافظ على صورة الخروج إلى الطريق من غير حسم احتمال أن العبارة تعني بدء الرحلة؛ وقد ذُكر هذا الاحتمال في الحاشية.
- source_word: προσδραμὼν
  choice: أسرع إليه
  rationale: يفيد الاقتراب جريًا وبإلحاح، وصياغة «أسرع إليه» طبيعية وواضحة في العربية المعاصرة.
- source_word: εἷς
  choice: رجل
  rationale: اللفظة مفرد مذكر مستعملة استعمال الاسم، والسياق السردي يسند ترجمتها إلى «رجل» من غير حاجة إلى إثبات معنى العدد بلفظ «واحد».
- source_word: γονυπετήσας αὐτόν
  choice: ركع أمامه
  rationale: يحافظ على هيئة الركوع الدالة على الاحترام أو التوسل، بعبارة عربية موجزة وطبيعية.
- source_word: ἐπηρώτα αὐτόν
  choice: وسأله
  rationale: ينقل فعل السؤال بوضوح؛ ولا يلزم إظهار صيغة الماضي الناقص بتعبير استمراري ثقيل في هذا السياق السردي.
- source_word: Διδάσκαλε ἀγαθέ
  choice: أيها المعلّم الصالح
  rationale: يحافظ على لقب «المعلّم» لا «السيد»، وعلى وصف «الصالح» المهم للسياق اللاحق.
- source_word: τί ποιήσω
  choice: ماذا أفعل
  rationale: صيغة عربية طبيعية للسؤال التداولي عن الفعل المطلوب، من غير إضافة لفظ وجوب غير مصرح به مستقلًا في اليونانية.
- source_word: ἵνα
  choice: لكي
  rationale: تُظهر علاقة الغاية بوضوح وإيجاز.
- source_word: ζωὴν αἰώνιον
  choice: الحياة الأبدية
  rationale: المقابل العربي الواضح والمستقر الذي يحفظ الدلالة الزمنية والرنين اللاهوتي.
- source_word: κληρονομήσω
  choice: أرث
  rationale: يحفظ صورة الميراث في الفعل اليوناني بدل تسطيحها إلى «أنال» أو «أحصل على».
theological_decisions:
- issue: لقب مخاطبة يسوع
  choice: أيها المعلّم الصالح
  alternative: أيها السيد الصالح
  rationale: النص يستعمل διδάσκαλος لا κύριος؛ لذلك تحفظ «المعلّم» اللقب الوارد من غير استيراد لقب أقوى، كما تبقي «الصالح» لصلته بجواب يسوع في العدد التالي.
- issue: تعيين جنس εἷς
  choice: رجل
  alternative: شخص
  rationale: الصيغة اليونانية مذكّرة مفردة والسياق السردي يؤيد «رجل»، فلا تُسوّى الدلالة إلى تعبير محايد.
- issue: العلاقة بين الفعل وميراث الحياة الأبدية
  choice: ماذا أفعل لكي أرث الحياة الأبدية؟
  alternative: ماذا يجب أن أفعل لأنال الحياة الأبدية؟
  rationale: تحفظ الصياغة سؤال الرجل كما هو، بما فيه التوتر بين «أفعل» و«أرث»، من غير تفسير العلاقة لاهوتيًا أو استبدال صورة الميراث بصورة الاكتساب.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقّرة، بجمل سردية طبيعية. أُبقيت صورة الطريق والميراث، وحُفظ الاحتمال الدلالي في عبارة بدء الحركة بواسطة حاشية.
