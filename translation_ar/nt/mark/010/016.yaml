  yaml_path: translation/nt/mark/010/016.yaml
  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: ar
  text: وأخذهم بين ذراعيه، وظلَّ يباركهم[a]، واضعًا يديه عليهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الفعل في اليونانية بصيغة الماضي الناقص، وقد يفيد أنه كان يباركهم باستمرار أو مرارًا. وقد تحمل صيغة الفعل المركبة دلالة تشديد في البركة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: احتضنهم
  rationale: الفعل اليوناني يدل تحديدًا على أخذ الشخص بين الذراعين؛ و«احتضنهم» تعبير عربي طبيعي موجز يحفظ معنى القرب والحنان الجسدي.
- source_word: κατευλόγει
  choice: ظلَّ يباركهم
  rationale: صيغة الماضي الناقص تفيد فعلًا مستمرًا أو متكررًا، كما أن الفعل المركب ذو دلالة تقوية؛ لذلك ينقل «ظلَّ يباركهم» جانب الاستمرار من غير مبالغة تفسيرية، وتوضح الحاشية احتمال البركة المتكررة أو بحرارة.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: واضعًا يديه عليهم
  rationale: تنقل العبارة الحالية الكيفية المصاحبة للبركة، وتحفظ الإيماءة الملموسة بعبارة عربية واضحة ومألوفة.
- source_word: αὐτὰ ... αὐτά
  choice: هم / عليهم
  rationale: الضمائر تعود على الأطفال المذكورين في السياق المباشر، ولا حاجة إلى تكرار الاسم في هذه الآية.
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف بسيط يحفظ أسلوب مرقس السردي من غير إضافة دلالة زمنية أو استنتاجية.
theological_decisions:
- issue: طبيعة فعل يسوع تجاه الأطفال
  choice: 'إبقاء الأفعال الملموسة: احتضانهم، ومباركتهم، ووضع يديه عليهم، من غير مصطلحات طقسية أو أسرارية مضافة.'
  alternative: «باركهم بوضع اليد» أو «نطق عليهم ببركة»
  rationale: النص يصور استقبال يسوع الحنون للأطفال وبركته لهم، لكنه لا يحدد إطارًا عقائديًا أو طقسيًا لاحقًا؛ لذا تُحفظ الأفعال كما وردت بلا حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. اختير «احتضنهم» لطبيعته ودقته، و«ظلَّ يباركهم» لإظهار دلالة الماضي الناقص في الأصل، مع إبقاء الاحتمالات الدقيقة في الحاشية. وُضع مؤشر الحاشية [a] في المتن.
