base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: ar
  text: 'فكانوا في غاية الدهشة، وقال بعضهم لبعض[a]: «فمَن يستطيع أن يخلُص؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فيما بينهم»، وحرفيًا: «إلى أنفسهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: فـ
  rationale: تربط الفاء ردّ فعلهم بما سبقه ربطًا طبيعيًا، والفاعل مفهوم من السياق ومن صيغة الجمع، من غير حاجة إلى ضمير منفصل.
- source_word: περισσῶς
  choice: ازدادوا
  rationale: في هذا السياق يمكن أن يدل الظرف على اشتداد الدهشة بعد الكلام السابق؛ وصيغة «ازدادوا ذهولًا» عربية طبيعية وتحفظ معنى التفاقم، مع بقاء معنى الشدة.
- source_word: ἐξεπλήσσοντο
  choice: ذهولًا
  rationale: ينقل «الذهول» قوة الدهشة التي يفيدها الفعل، وتعبير «ازدادوا ذهولًا» يصوغ الحالة المستمرة أو المتصاعدة بصورة عربية سليمة.
- source_word: λέγοντες
  choice: وقال
  rationale: عُطف القول بالفعل في صياغة عربية طبيعية، مع الحفاظ على اقترانه بدهشتهم.
- source_word: πρὸς ἑαυτούς
  choice: بعضهم لبعض
  rationale: يفيد التعبير في سياق جماعة تتحاور المعنى التبادلي، مع إثبات الحاشية للاحتمال الأقرب إلى اللفظ الحرفي.
- source_word: Καὶ
  choice: فـ
  rationale: الفاء في السؤال تنقل النبرة الاستنتاجية أو الناتجة عما سبق، بدل نقل καί بحرف عطف جامد.
- source_word: τίς
  choice: مَن
  rationale: أداة الاستفهام العربية الطبيعية للسؤال عن الشخص الممكن خلاصه.
- source_word: δύναται
  choice: يقدر
  rationale: ينقل معنى القدرة أو الإمكان بوضوح في العربية المعاصرة.
- source_word: σωθῆναι
  choice: أن يخلُص
  rationale: يحفظ لغة الخلاص الملائمة لسياق دخول ملكوت الله، ولا يختزل المعنى في نجاة زمنية عابرة.
theological_decisions:
- issue: دلالة لغة الخلاص في السياق
  choice: أن يخلُص
  alternative: أن ينجو أو يُنقَذ
  rationale: يتناول السياق دخول ملكوت الله، ولذلك يحفظ «يخلُص» الثقل الخلاصي والأخروي للفعل، من غير إضافة تحديد عقائدي لا يصرّح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. اختيرت صياغة طبيعية تحفظ شدة الدهشة، والنبرة الاستنتاجية للسؤال، والاحتمال الدلالي في πρὸς ἑαυτούς بواسطة الحاشية.
