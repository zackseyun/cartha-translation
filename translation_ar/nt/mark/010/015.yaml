  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: ar
  text: 'الحق أقول لكم: مَن لا يقبل ملكوت الله كطفل[a]، فلن يدخله قطعًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا فهم العبارة بمعنى «بصفة طفل». وقد يشير التشبيه إلى التواضع أو الثقة أو الاتكال، لكن اليونانية لا تحدد وجه الشبه.
    reason: بديل معجمي مع الحفاظ على الغموض المقصود
lexical_decisions:
- source_word: ἀμὴν
  choice: الحق
  rationale: تؤدي وظيفة الاستهلال التوكيدي المهيب في قول يسوع، وهي صياغة عربية واضحة ومألوفة دون تكرار لا وجود له في اليونانية.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: نقل مباشر وطبيعي للفعل وضمير المخاطبين.
- source_word: ὃς ἂν
  choice: مَن
  rationale: اسم الشرط الموصول «مَن» يؤدي المعنى العام غير المحدد للتركيب اليوناني.
- source_word: μὴ δέξηται
  choice: لا يقبل
  rationale: يحفظ معنى التلقي والقبول في δέχομαι، ولا يحوّل ملكوت الله إلى إنجاز يحققه الإنسان.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي راسخ يحفظ دلالتي مُلك الله ونطاق حكمه دون قصر العبارة على إحداهما.
- source_word: ὡς παιδίον
  choice: كطفل
  rationale: صياغة موجزة وطبيعية تحفظ التشبيه ولا تعيّن صفة بعينها في الطفل.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: فلن يدخله قطعًا
  rationale: «لن» مع «قطعًا» تنقل النفي اليوناني المشدد بصياغة عربية حديثة، والضمير يعيد الإحالة إلى الملكوت.
theological_decisions:
- issue: المقصود بقبول ملكوت الله «كطفل»
  choice: الإبقاء على التشبيه مفتوحًا دون تحديد الصفة المقصودة
  alternative: تفسيره صراحةً بالتواضع أو الثقة أو الاتكال
  rationale: النص اليوناني يذكر الطفل موضعًا للمقارنة، لكنه لا يحدد وجه الشبه؛ لذلك لا ينبغي للترجمة أن تحسم ما تركه النص مفتوحًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «ملكوت الله» اتساقًا مع الاصطلاح الإنجيلي العربي، ووُضع التوكيد في «قطعًا» لنقل قوة οὐ μή.
