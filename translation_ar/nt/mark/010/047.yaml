  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: ar
  text: 'ولما سمع أنه يسوع الناصري[a]، أخذ يصرخ ويقول: «يا يسوع، يا ابن داود، ارحمني!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يسوع الذي من الناصرة». والنص اليوناني يقول حرفيًا «يسوع الناصري»، فيحفظ لقبًا وصفيًا بدل العبارة الجغرافية الأكثر صراحة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: لما سمع
  rationale: تؤدي اسم الفاعل اليوناني السابق للفعل الرئيسي بمعنى زمني طبيعي، وتحفظ تعاقب الحدثين.
- source_word: Ναζαρηνός
  choice: الناصري
  rationale: يحفظ اللقب الوصفي في اليونانية، بدل تحويله في المتن إلى عبارة جغرافية صريحة.
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: أخذ يصرخ ويقول
  rationale: ينقل معنى الشروع ويحفظ الفعلين كما في أسلوب مرقس، من غير دمجهما في فعل واحد.
- source_word: κράζειν
  choice: يصرخ
  rationale: يعبر عن نداء مرتفع وملحّ، من غير أن يقتضي معنى الغضب.
- source_word: Υἱὲ Δαυὶδ
  choice: يا ابن داود
  rationale: يحفظ الصيغة الحرفية والوقع المسياني للقب، ولا يختزله إلى مجرد وصف نسبي مثل «يا سليل داود».
- source_word: ἐλέησόν με
  choice: ارحمني
  rationale: ترجمة عربية مباشرة وطبيعية لصيغة الأمر التي تحمل معنى الالتماس الملحّ.
- source_word: Ἰησοῦ
  choice: يسوع
  rationale: الصيغة العربية المألوفة للاسم؛ وتكرار أداة النداء قبل اللقب يجعل تركيب النداء واضحًا وطبيعيًا بالعربية.
theological_decisions:
- issue: الدلالة المسيانية لعبارة «ابن داود»
  choice: إبقاء «يا ابن داود» لقبًا يُخاطَب به يسوع في المتن.
  alternative: «يا سليل داود» أو «يا من نسل داود».
  rationale: يحمل اللقب في سياق مرقس دلالة ملكية مسيانية، والصيغة الحرفية تحفظ هذا الصدى ولا تحصر العبارة في النسب البيولوجي وحده.
- issue: ترجمة Ναζαρηνός
  choice: «الناصري» بوصفها لقبًا وصفيًا.
  alternative: «يسوع الذي من الناصرة».
  rationale: النص اليوناني يستعمل الصفة/اللقب Ναζαρηνός، لذلك حُفظت في المتن، مع بيان التعبير الجغرافي الأكثر صراحة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية رصينة. استُعمل «أخذ يصرخ ويقول» لحفظ معنى الشروع وتكرار الفعلين في أسلوب مرقس، ووُضعت أداة النداء مع الاسم واللقب لسلامة التعبير ووضوح المخاطَب.
