  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: ar
  text: 'فقال له يسوع: «اذهب. إيمانك[a] قد خلّصك[b]». وفي الحال عاد إليه بصره، ومضى يتبع يسوع في الطريق[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ثقتك». فالإيمان هنا يتضمن اعتماد الرجل الواثق بيسوع.'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا: «قد شفاك» أو «قد عافاك». فالفعل اليوناني قد يدل على الشفاء كما يدل على الخلاص.'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «على الطريق». وقد تشير العبارة إلى الطريق الملموس، مع احتمال صدى مسيرة التلمذة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: اذهب
  rationale: أمر مباشر بالانصراف، و«اذهب» أوضح مقابل عربي من غير إضافة معنى غير مصرّح به مثل «اذهب في سبيلك».
- source_word: πίστις
  choice: إيمانك
  rationale: يحافظ على المصطلح المحوري وعلى معنى اعتماد الرجل الواثق بيسوع؛ و«ثقتك» ممكنة سياقيًا لكنها أضيق.
- source_word: σέσωκέν
  choice: قد خلّصك
  rationale: الفعل σῴζω قد يدل على الخلاص أو الإنقاذ أو الشفاء. وتحفظ «خلّصك» سعته والتوتر المقصود بين استعادة البصر والخلاص الأوسع، بينما تساعد «قد» على إظهار نتيجة صيغة التام اليونانية الحاضرة.
- source_word: εὐθύς
  choice: في الحال
  rationale: تعبير عربي طبيعي يحفظ سرعة السرد المرقسي.
- source_word: ἀνέβλεψεν
  choice: عاد إليه بصره
  rationale: السياق سياق شفاء أعمى واستعادة البصر، وهذه صياغة عربية واضحة تتجنب الفهم الحرفي المضلل، أي «نظر إلى أعلى».
- source_word: ἠκολούθει
  choice: مضى يتبع
  rationale: يحفظ دلالة الاستمرار في صيغة الماضي الناقص اليونانية، ويأتي طبيعيًا بعد الحدث الفوري.
- source_word: ἐν τῇ ὁδῷ
  choice: في الطريق
  rationale: يحفظ الصورة المكانية الملموسة، مع إبقاء احتمال صدى «الطريق» بوصفه مسيرة التلمذة من غير فرضه.
- source_word: καὶ ὁ Ἰησοῦς
  choice: فقال له يسوع
  rationale: الفاء طبيعية في وصل الجواب بما سبقه في السرد العربي، من غير تحميل أداة العطف معنى زائدًا.
theological_decisions:
- issue: مدلول σῴζω في قول يسوع
  choice: قد خلّصك
  alternative: قد شفاك / قد عافاك
  rationale: يروي السياق استعادة البصر بوضوح، لكن لفظ الفعل اليوناني أوسع من الشفاء الجسدي وحده؛ لذلك يحفظ النص معنى الخلاص الأوسع، وتوضح الحاشية البدائل السياقية.
- issue: مدلول πίστις في السياق
  choice: إيمانك
  alternative: ثقتك
  rationale: «إيمانك» يحافظ على المصطلح اللاهوتي العام، فيما يظل معنى الثقة والاعتماد على يسوع حاضرًا وتذكره الحاشية دون استبدال المصطلح في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «مضى يتبع» لإبراز استمرار الفعل من غير ثقل «كان يتبعه»، وذُكر اسم يسوع ثانيةً منعًا لأي التباس في مرجع الضمير.
