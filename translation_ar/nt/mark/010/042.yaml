  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: ar
  text: 'فدعاهم يسوع إليه وقال لهم: «أنتم تعلمون أن الذين يُعَدّون حكّامًا على الأمم[a] يتسلّطون عليهم، وأن عظماءهم يفرضون سلطانهم عليهم.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين يبدون كأنهم يحكمون الأمم».'
    reason: يحفظ الاحتمال الآخر لدلالة δοκοῦντες وتركيب ἄρχειν τῶν ἐθνῶν، إذ يمكن فهمه بمعنى «يبدون أنهم يحكمون» بدل «يُعَدّون حكامًا».
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: دعاهم ... إليه
  rationale: يعكس صيغة الفعل المتوسطة التي تفيد دعوة أشخاص إلى المتكلم، ويحافظ على ترتيب الحدث السابق للكلام بصياغة عربية طبيعية.
- source_word: λέγει
  choice: قال
  rationale: المضارع التاريخي في اليونانية يؤدي وظيفة سردية، والماضي هو الأسلوب الطبيعي في السرد العربي هنا.
- source_word: Οἴδατε
  choice: أنتم تعلمون
  rationale: ينقل المعنى الحاضر المستقر للفعل οἶδα بوضوح، مع إبراز ضمير المخاطبين الملحوظ في صيغة الفعل.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: الذين يُعَدّون حكّامًا
  rationale: يحفظ معنى كونهم معترفًا بهم أو محسوبين حكامًا، من غير أن يفترض أن سلطانهم ظاهري غير حقيقي.
- source_word: τῶν ἐθνῶν
  choice: على الأمم
  rationale: لفظ «الأمم» هو المقابل العربي المباشر، ويلائم الإضافة إلى الحكام بمعنى حكم الشعوب؛ ويمكن أن يدل في السياق اليهودي على غير اليهود من غير حصر المعنى في تسمية تفسيرية.
- source_word: κατακυριεύουσιν
  choice: يتسلّطون عليهم
  rationale: ينقل دلالة السيطرة المتعالية أو القهرية التي يحملها الفعل المركب، بصياغة عربية واضحة ومألوفة.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: عظماؤهم
  rationale: يحافظ على التعبير العام عن ذوي المكانة والنفوذ، من غير تخصيصهم بمناصب رسمية لا يذكرها النص.
- source_word: κατεξουσιάζουσιν
  choice: يفرضون سلطانهم عليهم
  rationale: يعبّر عن ممارسة السلطة على نحو قوي ومتسلط، ويحافظ في الوقت نفسه على تمييز لفظي عن «يتسلّطون» في العبارة الموازية.
theological_decisions:
- issue: مرجع τῶν ἐθνῶν
  choice: الأمم
  alternative: غير اليهود
  rationale: «الأمم» يحفظ اللفظ اليوناني واتساعه، مع بقاء دلالته السياقية المحتملة على الشعوب غير اليهودية؛ وهذا يتجنب حسم الدلالة الأضيق داخل المتن.
- issue: دلالة δοκοῦντες
  choice: الذين يُعَدّون حكّامًا
  alternative: الذين يبدون كأنهم يحكمون
  rationale: الصياغة المختارة تحفظ معنى الاعتبار أو الاعتراف العام، ولا توحي بأن حكمهم وهمي، مع إثبات البديل الحرفي المحتمل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «عظماؤهم» للمحافظة على عمومية التعبير، و«يفرضون سلطانهم» لإظهار النبرة السلبية من غير إضافة توصيف سياسي أو طائفي.
