  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: دعوة يسوع لهم إليه، ثم المعرفة المشتركة، ووصف الذين يُعَدّون حكامًا للأمم، وفعل التسلط، ثم عظماء الأمم وممارستهم السلطان عليهم. واستعمال «الأمم» يحفظ سعة τῶν ἐθνῶν ولا يحسمها في «غير اليهود».'
  naturalness: الصياغة عربية فصحى حديثة واضحة ومترابطة. «فدعاهم يسوع إليه وقال لهم» و«يتسلطون عليهم» و«عظماؤهم» تعبيرات طبيعية في هذا السجل الوقور.
