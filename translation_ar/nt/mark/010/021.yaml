source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: ar
  text: 'فنظر إليه يسوع وأحبه، وقال له: «ينقصك شيء واحد: اذهب، وبع كل ما لك، وأعطِ الفقراء، فيكون لك كنز في السماء؛ وتعال، اتبعني».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτῷ
  choice: فنظر إليه
  rationale: يدل الفعل على نظرة موجَّهة ومتأنية؛ وصياغة «نظر إليه» طبيعية وتحفظ قوة السرد من غير مبالغة بإضافة «حدَّق».
- source_word: ἠγάπησεν αὐτόν
  choice: بمحبة
  rationale: تُدمج دلالة الفعل مع فعل النظر في عبارة عربية طبيعية تفيد أن يسوع نظر إليه وهو يحبه، من غير إضعاف حقيقة المحبة أو تحميلها معنى لاهوتيًا تقنيًا.
- source_word: Ἕν σε ὑστερεῖ
  choice: ينقصك شيء واحد
  rationale: «شيء» مقدَّرة من المحايد المفرد المستعمل اسميًا، و«ينقصك» مقابل عربي مباشر وطبيعي لحالة النقص الحاضرة.
- source_word: ὕπαγε
  choice: اذهب
  rationale: أمر مباشر بالانصراف، تقابله «اذهب» بوضوح ومن دون زيادة.
- source_word: ὅσα ἔχεις
  choice: كل ما لك
  rationale: التركيب النسبي يحتمل «ما لك» أو «كل ما لك»، والسياق يدل على شمول ممتلكاته؛ وهذه الصياغة واضحة وطبيعية في العربية.
- source_word: πώλησον
  choice: بع
  rationale: مقابل مباشر لفعل البيع في صيغة الأمر.
- source_word: δὸς τοῖς πτωχοῖς
  choice: أعطِ الفقراء
  rationale: يحافظ على كون πτωχοῖς وصفًا مستعملًا استعمال الاسم للدلالة على الفقراء بوصفهم فئة اجتماعية.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: كنز في السماء
  rationale: صياغة عربية مألوفة ودقيقة، وتحافظ على صورة الكنز السماوي من غير تفسير زائد.
- source_word: δεῦρο
  choice: تعال
  rationale: أداة ذات قوة أمر تدعو إلى المجيء نحو المتكلم؛ «تعال» هي المقابل العربي الطبيعي.
- source_word: ἀκολούθει μοι
  choice: اتبعني
  rationale: يحفظ نداء التلمذة؛ ويمكن لصيغة الأمر العربية والسياق أن يحملا معنى الاستمرار من غير عبارة ثقيلة.
theological_decisions:
- issue: معنى محبة يسوع للرجل
  choice: إثبات محبة حقيقية في عبارة «نظر إليه يسوع بمحبة»
  alternative: «أحبه» بوصفها جملة مستقلة، أو فهم المحبة على أنها مجرد لطف ظاهري أو محبة اصطفائية بمصطلح تقني
  rationale: النص يصرّح بأن يسوع أحبه. تحفظ الصياغة حقيقة المحبة والتوتر السردي، من غير إضعافها أو ربطها بمنظومة عقائدية لاحقة.
- issue: نطاق الأمر المتعلق بالممتلكات
  choice: «بع كل ما لك»
  alternative: «بع ما لك» أو تلطيف الأمر إلى دعوة عامة للسخاء
  rationale: يحتمل ὅσα ἔχεις لفظيًا «ما لك» و«كل ما لك»، لكن السياق يؤيد الشمول؛ لذلك تُحفظ قوة الأمر من غير إضافة تفسيرية تتجاوز الممتلكات المذكورة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت أفعال أمر موجزة تحافظ على إيقاع القول اليوناني وتسلسله، مع وصل الجملة الأخيرة بـ«ثم» لإظهار الانتقال الطبيعي إلى المجيء والاتباع.
