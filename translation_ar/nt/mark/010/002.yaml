  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: ar
  text: 'وكانوا يسألونه: «هل يحلّ للرجل أن يطلّق امرأةً؟» [a] وهم يمتحنونه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هل يحلّ للزوج أن يطلّق زوجته؟»'
    reason: بديل معجمي وسياقي؛ فقد تعني ἀνήρ «رجلًا» أو «زوجًا»، وتعني γυνή «امرأة» أو «زوجة».
lexical_decisions:
- source_word: ἐπηρώτων
  choice: كانوا يسألونه
  rationale: ينقل صيغة الماضي الناقص الدالة هنا على فعل مستمر أو متكرر، بعبارة عربية طبيعية.
- source_word: ἔξεστιν
  choice: هل يحلّ
  rationale: يحفظ معنى الجواز القانوني أو الشرعي في سياق السؤال عن الطلاق، لا مجرد الإمكان.
- source_word: ἀνδρὶ
  choice: للرجل
  rationale: يحفظ الصيغة العامة للمفرد المذكر، مع بقاء معنى الزوج محتملاً في السياق.
- source_word: γυναῖκα
  choice: امرأةً
  rationale: يحافظ على غياب أداة التعريف والضمير في اليونانية وعلى إمكان دلالة اللفظة على المرأة أو الزوجة، بينما يوضح فعل الطلاق المقصود السياقي.
- source_word: ἀπολῦσαι
  choice: أن يطلّق
  rationale: هذا هو المعنى الاصطلاحي الطبيعي للفعل في السياق الزوجي القانوني، بدل الترجمة الحرفية «يصرف» أو «يطلق سراح».
- source_word: πειράζοντες
  choice: وكانوا بذلك يمتحنونه
  rationale: ينقل معنى الاختبار ذي القصد العدائي من غير أن يبالغ في تفسيره بعبارة مثل «يحاولون الإيقاع به».
- source_word: Καὶ
  choice: و
  rationale: يحفظ أداة الربط السردية البسيطة من غير إضافة تحديد زمني غير مصرح به.
theological_decisions:
- issue: دلالة ἀνδρὶ وγυναῖκα في السؤال الزوجي
  choice: للرجل أن يطلّق امرأةً
  alternative: للزوج أن يطلّق زوجته
  rationale: الصياغة المختارة تحافظ على البنية العامة وعلى عدم وجود ضمير ملكية صريح في النص اليوناني، مع أن السياق يجعل المعنى الزوجي واضحًا. ويُذكر البديل الطبيعي في الحاشية من غير حسم الصيغة المصدرية لصالح تفسير أضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «يحلّ» للمشروعية، و«يمتحنونه» للاختبار العدائي، مع إظهار الحاشية [a] في المتن.
