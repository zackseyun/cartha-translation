  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: ar
  text: 'إِلَّا وَيَنَالُ الآنَ، فِي هَذَا الزَّمَانِ، مِئَةَ ضِعْفٍ: بُيُوتًا وَإِخْوَةً وَأَخَوَاتٍ وَأُمَّهَاتٍ وَأَوْلَادًا وَحُقُولًا، مَعَ اضْطِهَادَاتٍ؛ وَفِي الدَّهْرِ الآتِي، حَيَاةً أَبَدِيَّةً.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβῃ
  choice: يَنَالُ
  rationale: يفيد تلقّي ما يُعطى في سياق الوعد بالمكافأة، وهو عربي طبيعي وأقرب هنا من «يأخذ».
- source_word: ἑκατονταπλασίονα
  choice: مِئَةَ ضِعْفٍ
  rationale: يحافظ على القوة الكمية لتعبير «مئة ضعف» بصياغة عربية واضحة ومألوفة.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: الآنَ، فِي هَذَا الزَّمَانِ
  rationale: يبقي توكيد الحاضر والمقابلة الصريحة مع الدهر الآتي.
- source_word: οἰκίας
  choice: بُيُوتًا
  rationale: مقابل مباشر يحافظ على الصورة المادية الملموسة والجمع.
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: إِخْوَةً وَأَخَوَاتٍ
  rationale: يحافظ على التفريق الصريح في اليونانية بين الإخوة الذكور والأخوات.
- source_word: μητέρας
  choice: أُمَّهَاتٍ
  rationale: مقابل مباشر بصيغة الجمع كما في المصدر.
- source_word: τέκνα
  choice: أَوْلَادًا
  rationale: لفظ عربي جامع للذرية من غير تخصيص بالبنين وحدهم.
- source_word: ἀγρούς
  choice: حُقُولًا
  rationale: ينقل المعنى الملموس للأراضي المزروعة بدقة.
- source_word: μετὰ διωγμῶν
  choice: مَعَ اضْطِهَادَاتٍ
  rationale: يبقي العبارة صريحة ويحفظ اقتران البركات الحاضرة بالمعاناة.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: فِي الدَّهْرِ الآتِي
  rationale: «الدهر» ينقل معنى العصر أو الحقبة الأخروية، لا العالم المادي فحسب.
- source_word: ζωὴν αἰώνιον
  choice: حَيَاةً أَبَدِيَّةً
  rationale: التعبير العربي الراسخ والدقيق للمعنى الأخروي في السياق.
theological_decisions:
- issue: طبيعة الجزاء الموعود في الزمن الحاضر
  choice: نقل البيوت والعلاقات العائلية والحقول كما وردت، مع إبقاء «مع اضطهادات».
  alternative: تفسير الجزاء على أنه روحي محض، أو تصويره رخاءً ماديًا خاليًا من الألم.
  rationale: النص يجمع عمدًا بين الجزاء الوافر في الحاضر واستمرار الاضطهاد، فلا ينبغي للترجمة أن تزيل هذا التوتر.
- issue: الربط النحوي مع الآية السابقة
  choice: افتتاح النص بـ«إلّا وينال» لأن ἐὰν μὴ يتمم جملة «لا أحد... إلا وينال» في الآية السابقة.
  alternative: صياغته جملة مستقلة مثل «الذي لن ينال».
  rationale: يحافظ هذا على البنية الشرطية المتصلة بالسياق، مع أن المقطع المعطى وحده ليس جملة مستقلة كاملة.
- issue: تعداد ألفاظ القرابة
  choice: ترجمة الإخوة والأخوات كلًّا على حدة.
  alternative: دمجهما في لفظ جمعي واحد.
  rationale: المصدر يذكر ἀδελφοὺς وἀδελφὰς صراحة وبصيغتين متميزتين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الدهر الآتي» للمقابلة الأخروية مع «هذا الزمان»، وحُفظ التعداد والتوتر بين الوفرة والاضطهاد. لا توجد حواشٍ لازمة في هذه الآية.
