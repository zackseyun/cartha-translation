  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: ar
  text: 'فتوقّف يسوع وقال: «نادوه». فنادوا الرجل الأعمى وقالوا له: «تشجّع! قم، فهو يناديك».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: فتوقّف
  rationale: اسم الفاعل من ἵστημι يفيد هنا، في سياق حركة يسوع على الطريق، أنه أوقف سيره؛ و«توقّف» تعبير عربي طبيعي ودقيق.
- source_word: Φωνήσατε αὐτόν
  choice: نادوه
  rationale: الفعل φωνέω يعني هنا دعوة شخص للحضور، و«نادوه» مباشر ويحافظ على تكرار الفعل في بقية الآية.
- source_word: φωνοῦσι
  choice: فنادوا
  rationale: يحافظ هذا الاختيار على الصلة اللفظية بأمر يسوع «نادوه»، مع نقل حرف العطف اليوناني بصياغة عربية سلسة.
- source_word: τὸν τυφλὸν
  choice: الرجل الأعمى
  rationale: الصفة τυφλός مستعملة استعمال الاسم وتشير في السياق إلى رجل؛ وهذه الصياغة طبيعية وواضحة بالعربية.
- source_word: Θάρσει
  choice: تشجّع
  rationale: صيغة الأمر تفيد بثّ الشجاعة والطمأنينة، و«تشجّع» موجزة وطبيعية وتحافظ على قوة الخطاب المباشر.
- source_word: ἔγειρε
  choice: قم
  rationale: الأمر يدعو الرجل إلى النهوض؛ و«قم» واضح ومباشر ومناسب للسياق.
- source_word: φωνεῖ σε
  choice: فهو يناديك
  rationale: ينقل المضارع اليوناني دعوة يسوع الجارية في تلك اللحظة، ويحافظ «يناديك» على تكرار الجذر نفسه في الآية.
theological_decisions: []
