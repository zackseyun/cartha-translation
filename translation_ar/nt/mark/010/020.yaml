  text: ὁ δὲ ⸀ἔφη αὐτῷ· Διδάσκαλε, ταῦτα πάντα ἐφυλαξάμην ἐκ νεότητός μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: ar
  text: 'فقال له: «يا معلّم، حفظتُ هذه كلَّها منذ صباي».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «راعيتُ هذه كلَّها منذ شبابي».'
    reason: يبيّن بديلين معتبرين لـἐφυλαξάμην وνεότης مع بقاء المعنى الأساسي دون حسم زائد.
lexical_decisions:
- source_word: ἔφη
  choice: فقال
  rationale: فعل قول سردي عام، و«فقال» طبيعي في السياق وينقل اتصال الكلام بما قبله.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: صيغة نداء من διδάσκαλος، ومعناها المباشر من يعلّم؛ و«معلّم» أوضح من ألفاظ قد توحي بسيادة تتجاوز المعنى المعجمي هنا.
- source_word: ταῦτα πάντα
  choice: هذه كلَّها
  rationale: تركيب عربي طبيعي يحفظ اسم الإشارة ومعنى الشمول، ويعود على الوصايا المذكورة قبلًا.
- source_word: ἐφυλαξάμην
  choice: حفظتُ
  rationale: يمكن أن يعني الفعل الحفظ أو المراعاة، ومع الوصايا يفيد الالتزام بها. «حفظت» قريب من صورة اليونانية ولا يضيف تفسيرًا إلى دعوى المتكلم.
- source_word: ἐκ νεότητός μου
  choice: منذ صباي
  rationale: ينقل نقطة البداية الزمنية واستمرار الدعوى إلى وقت الكلام، و«الصبا» عربي واضح يدل على حداثة السن دون حصرها بالطفولة المبكرة.
- source_word: ὁ δὲ
  choice: فـ
  rationale: δέ رابط سردي خفيف هنا، والفاء تستأنف جوابه بسلاسة من غير تشديد معنى الاستدراك.
theological_decisions:
- issue: هل يثبت النص أن الرجل أطاع الوصايا فعلًا بلا نقص؟
  choice: 'الإبقاء على العبارة بوصفها دعوى مباشرة للرجل: «حفظتُ هذه كلَّها».'
  alternative: إضافة ما يقيّد الدعوى، مثل «بحسب زعمه» أو «حاولت أن أحفظ».
  rationale: اليونانية تنقل قول الرجل دون تعليق في هذه الآية؛ فلا ينبغي للترجمة أن تصدّق دعواه أو تنفيها بإضافة تفسير لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُعمل «يا معلّم» للنداء المباشر، و«منذ صباي» لصياغة زمنية طبيعية. وُضعت علامة الحاشية [a] في المتن كما يلزم.
