  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: ar
  text: 'فقال لهم يسوع: «بسبب قساوة قلوبكم كتب لكم هذه الوصية.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الفاعل هو موسى، المذكور في الآية السابقة.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تفيد انتقالًا ذا مسحة استدراكية في الحوار، وتأتي الفاء طبيعية في العربية عند عرض جواب يسوع.
- source_word: Πρὸς
  choice: بسبب
  rationale: 'تنقل العلاقة السببية هنا: كُتبت الوصية استجابةً لحالة قساوة قلوبهم.'
- source_word: σκληροκαρδίαν
  choice: قساوة قلوبكم
  rationale: تحفظ صورة القلب في المركب اليوناني ودلالته على التصلب والعناد الأخلاقي، بصياغة عربية واضحة ومألوفة كتابيًا.
- source_word: ἔγραψεν
  choice: كتب
  rationale: يحافظ الفعل على الفاعل المستتر كما في اليونانية، ومرجعه موسى المذكور في الآية السابقة.
- source_word: ἐντολὴν
  choice: الوصية
  rationale: تنقل معنى الأمر الملزم وتحافظ على النبرة التشريعية في سياق شريعة موسى.
- source_word: ταύτην
  choice: هذه
  rationale: تشير بوضوح إلى الوصية المحددة موضوع الحوار.
theological_decisions:
- issue: هل يُصرَّح باسم موسى بوصفه فاعل «كتب»؟
  choice: إبقاء الفاعل مستترًا في «كتب»، مع إيضاح مرجعه في الحاشية
  alternative: كتب موسى لكم هذه الوصية
  rationale: النص اليوناني لا يكرر اسم موسى، بل يستند إلى ذكره في الآية السابقة؛ لذا يحفظ الفاعل المستتر تتابع الخطاب من غير إضافة توكيد غير موجود في الأصل.
- issue: كيفية نقل σκληροκαρδία من غير إضعاف صورتها الكتابية واللاهوتية
  choice: قساوة قلوبكم
  alternative: عنادكم؛ تصلب قلوبكم
  rationale: يحفظ هذا التعبير استعارة القلب ودلالتها الأخلاقية، ولا يختزلها في مجرد العناد السلوكي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «قساوة قلوبكم» حفاظًا على الصورة الأصلية، و«الوصية» للنبرة التشريعية. وُضعت الحاشية بعد الجملة التي تحتاج إلى بيان مرجع فاعل «كتب».
