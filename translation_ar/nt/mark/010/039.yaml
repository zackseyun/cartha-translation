  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: ar
  text: 'فقالا له[a]: «نستطيع». فقال لهما يسوع: «الكأس التي أشربها ستشربانها، والمعمودية التي أُعمَّد بها[b] ستعتمدان،»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: قال يعقوب ويوحنا له.'
    reason: يوضح الضمير وصيغة المثنى في العربية؛ فالمتكلمان هما المذكوران في السياق السابق.
  - marker: b
    text: «الكأس» و«المعمودية» صورتان مجازيتان لما سيختبره يسوع من ألم ومصير، وسيشاركه تلميذاه فيه.
    reason: يحافظ المتن على المجاز الكتابي دون تفسيره داخله، ويبيّن السياق المقصود باقتضاب ومن غير تقرير مذهبي.
lexical_decisions:
- source_word: Δυνάμεθα
  choice: نستطيع
  rationale: ترجمة عربية طبيعية ومباشرة لصيغة المتكلم الجمع، وتحافظ على جواب التلميذين الواثق والمقتضب.
- source_word: ποτήριον
  choice: الكأس
  rationale: تُبقي الصورة المجازية الكتابية لخبرة مقدَّرة، ولا تستبدل بها تفسيرًا صريحًا في المتن.
- source_word: πίνω / πίεσθε
  choice: أشربها / ستشربانها
  rationale: تحافظ على التوازي بين المضارع والمستقبل، وتُظهر صيغة المثنى التي يقتضيها كون المخاطبَين اثنين.
- source_word: βάπτισμα
  choice: المعمودية
  rationale: المقابل العربي الكتابي المألوف، وهو يحفظ المجاز وصداه النصي بدل تسطيحه إلى «معاناة» أو «محنة».
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: أعتمد بها / ستعتمدان
  rationale: يحافظ الفعل على الصلة اللفظية بالاسم «المعمودية»، ويعكس المبني للمجهول اليوناني بصياغة عربية طبيعية.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: فقال لهما يسوع
  rationale: تصل الفاء الجواب بما قبله طبيعيًا، و«لهما» أدق في العربية لأن المخاطبَين اثنان؛ ولا يلزم تحميل δέ معنى استدراك قوي.
theological_decisions:
- issue: مجازا الكأس والمعمودية
  choice: إبقاء الصورتين المجازيتين في المتن، مع بيان دلالتهما في الحاشية.
  alternative: استبدالهما في المتن بعبارات مثل «الآلام» أو «الموت» أو «المحنة».
  rationale: النص اليوناني يتعمد استعمال صورتين كتابيتين غنيتين بالدلالة؛ وإبقاؤهما يصون التوتر اللاهوتي ولا يحصر المعنى في تفسير واحد.
- issue: صلة المعمودية هنا بالمعمودية الشعائرية
  choice: استعمال «المعمودية» مع ترك السياق والحاشية يبيّنان أن الاستعمال هنا مجازي.
  alternative: ترجمة βάπτισμα بـ«الغمر» أو «المحنة» تفاديًا لأي فهم شعائري.
  rationale: «المعمودية» هي المقابل المعجمي والكتابي المألوف، أما السياق فيشير إلى اختبار يسوع الآتي ومشاركة التلميذين فيه من غير أن يزيل النص نفسه صورة المعمودية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ومهيبة. استُعمل المثنى («فقالا»، «لهما»، «ستشربانها»، «ستعتمدان») لأنه أدق من جمع الإنجليزية. أُبقيت صورتا الكأس والمعمودية، مع تكرار الاسم والفعل في العبارة الثانية قدر الإمكان. يجب أن يظهر مؤشر الحاشية [b] بعد عبارة «أعتمد بها» في نص النشر.
