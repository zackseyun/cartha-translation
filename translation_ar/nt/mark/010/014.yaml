  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: ar
  text: 'فلما رأى يسوع ذلك، اغتاظ وقال لهم: «دعوا الأطفال يأتون إليّ، ولا تمنعوهم، لأن ملكوت الله هو لأمثال هؤلاء».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، حرفيًا بصورة أقرب: «لأن ملكوت الله لأمثال هؤلاء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: فلما رأى يسوع ذلك
  rationale: تؤدي صيغة الظرف الزمني للمشاركة الماضية، ويُستمد اسم الإشارة من سياق توبيخ التلاميذ في الآية السابقة. وتفيد الفاء الانتقال مع إبراز رد الفعل المقابل.
- source_word: ἠγανάκτησεν
  choice: استاء
  rationale: ينقل السخط الشديد والامتعاض الأخلاقي من غير أن يوحي بغضب منفلت؛ وهو تعبير عربي واضح وطبيعي.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: دعوا الأطفال يأتون إليّ
  rationale: «دعوا» أمر بمعنى اسمحوا، و«الأطفال» ترجمة مباشرة لـ παιδία من غير إضافة وصف تصغير غير لازم.
- source_word: μὴ κωλύετε αὐτά
  choice: ولا تمنعوهم
  rationale: يعبّر عن الكف عن إعاقة الأطفال ومنع وصولهم، مع استعمال ضمير العقلاء الطبيعي في العربية.
- source_word: τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: لأن ملكوت الله هو لأمثال هؤلاء
  rationale: يحافظ على معنى الفئة الممثلة في τοιούτων وعلى تركيب قريب من الأصل، من غير تحويل العبارة إلى تقرير يقتصر على الأطفال الحاضرين.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: صياغة كتابية عربية راسخة وواضحة، وتحفظ مفهوم الملك والسيادة مع العبارة الاصطلاحية المألوفة.
theological_decisions:
- issue: دلالة «τῶν ... τοιούτων» في صلة ملكوت الله بالأطفال
  choice: «لأمثال هؤلاء»، أي لأناس من هذا القبيل على نحو تمثيلي
  alternative: قصر القول على الأطفال الحاضرين، أو تفسيره صراحة بصفة بعينها كالبراءة أو التواضع
  rationale: اللفظ اليوناني يدل على «أمثال هؤلاء» ولا يحدد في هذه الآية وحدها الصفة المقصودة تفصيلًا؛ لذلك تحفظ الترجمة سعة الدلالة ولا تستورد حكمًا عقائديًا عن براءة الأطفال أو خلاصهم التلقائي.
- issue: قوة انفعال يسوع في ἠγανάκτησεν
  choice: استاء
  alternative: غضب أو اغتاظ
  rationale: يحفظ السخط الحقيقي في النص من غير أن يحمّله إيحاء الغضب غير المنضبط.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «ملكوت الله» للمحافظة على المصطلح الكتابي المألوف، وجاء التركيب طبيعيًا مع إبقاء الصلة التمثيلية في «أمثال هؤلاء». وُضع مؤشر الحاشية في المتن كما يلزم.
