lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: لكن منذ بدء الخليقة
  rationale: تنقل «لكن» القوة الاستدراكية لـ δέ في السياق، وتعبّر «منذ بدء الخليقة» طبيعيًا عن نقطة البداية الزمنية التي تدل عليها ἀπό مع ἀρχῆς κτίσεως.
- source_word: ἄρσεν καὶ θῆλυ
  choice: ذكرًا وأنثى
  rationale: يحفظ هذا التعبير ثنائية الجنسين في اقتباس سفر التكوين، من غير تحويل اللفظين إلى مصطلحين اجتماعيين مثل «رجل وامرأة».
- source_word: ἐποίησεν
  choice: صنع
  rationale: الفعل اليوناني ποιέω يعني هنا «صنع»، وهو أقرب إلى اللفظ من «خلق»، مع أن سياق سفر التكوين يجيز فهم المعنى الخَلقي.
- source_word: αὐτούς
  choice: هم
  rationale: ضمير المفعول يدل على البشر المشار إليهم في الاقتباس، ولا يضيف توكيدًا مثل «كليهما» غير موجود صراحة في النص.
theological_decisions:
- issue: صياغة لفظي الجنسين في اقتباس التكوين
  choice: ذكرًا وأنثى
  alternative: رجلًا وامرأة
  rationale: الاختيار يحافظ على الصياغة الخَلقية والبيولوجية في الأصل اليوناني، ولا يستبدل بها توصيفًا علائقيًا أو اجتماعيًا.
- issue: فاعل الفعل الإلهي غير المصرح به اسمًا
  choice: صنعهم
  alternative: صنعهم الله
  rationale: الفاعل مستتر في صيغة الفعل اليوناني ومفهوم من السياق؛ وعدم إضافة اسم «الله» يحافظ على إيجاز النص من غير إدخال تفسير صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختير «منذ بدء الخليقة» لسلاسته ودقته الزمنية، وحُفظ ترتيب الجملة الطبيعي في العربية مع إبقاء ألفاظ الاقتباس الأساسية.
