base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: ar
  text: 'أنت تعرف الوصايا: لا تقتل[a]، لا تزنِ، لا تسرق، لا تشهد بالزور، لا تسلب أحدًا حقه[b]، وأكرم أباك وأمك.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: لا ترتكب قتلًا محرَّمًا. يدل الفعل اليوناني هنا على القتل غير المشروع، لا على كل قتل دون تمييز.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «لا تحرم أحدًا مما له» أو «لا تسلبه ما له». والمقصود حجب ما يحق للآخر أو أخذه منه، ولا سيما بالاستغلال.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολάς
  choice: الوصايا
  rationale: تلائم الإشارة الواضحة إلى وصايا الشريعة، وهي الصياغة العربية المألوفة في هذا السياق.
- source_word: οἶδας
  choice: تعرف
  rationale: صيغة οἶδα التامة ذات معنى حاضر في اليونانية الكوينِية، و«تعرف» تعبير عربي طبيعي مباشر.
- source_word: Μὴ φονεύσῃς
  choice: لا تقتل
  rationale: الفعل φονεύω يدل في هذا السياق على القتل المحرَّم، وصيغة «لا تقتل» هي العبارة العربية المعروفة للوصية وتحمل هذا المعنى في السياق؛ وتوضح الحاشية التحديد الدلالي.
- source_word: Μὴ μοιχεύσῃς
  choice: لا تزنِ
  rationale: «تزنِ» المقابل العربي الموجز والمألوف للفعل μοιχεύω في سياق الوصايا الأخلاقية.
- source_word: Μὴ κλέψῃς
  choice: لا تسرق
  rationale: مقابل عربي دقيق ومباشر للفعل κλέπτω.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: لا تشهد بالزور
  rationale: يحفظ المعنى القضائي المتصل بالشهادة الكاذبة، كما يردد الصياغة العربية المألوفة للوصية.
- source_word: Μὴ ἀποστερήσῃς
  choice: لا تسلب أحدًا حقه
  rationale: 'يعبر طبيعيًا عن معنى ἀποστερέω: حرمان شخص مما يحق له أو حجب حقه عنه، من غير قصر المعنى على صورة احتيال محددة.'
- source_word: Τίμα
  choice: أكرم
  rationale: «أكرم» تحمل معنى التوقير وإعطاء المكانة الواجبة، وهي الصياغة العربية الراسخة لهذه الوصية.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: أباك وأمك
  rationale: صياغة عربية طبيعية موجزة تحفظ الإشارة المباشرة إلى الوالدين.
theological_decisions:
- issue: صياغة الإشارات إلى الوصايا العشر
  choice: استخدام عبارات عربية مألوفة للوصايا مع مراعاة دقة النص اليوناني
  alternative: صياغة تفسيرية حرة، أو استعمال «لا ترتكب جريمة قتل» و«لا تحتل» في المتن
  rationale: العبارات المألوفة تجعل الإشارة إلى الوصايا واضحة، بينما تمنع الحواشي إساءة فهم الفروق الدلالية في φονεύω وἀποστερέω من غير فرض تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع إيقاع موجز يناسب تعداد الوصايا. استُعملت الصيغ التراثية المفهومة «لا تقتل»، «لا تزنِ»، و«أكرم أباك وأمك»، مع توضيح الفروق المعجمية في الحواشي.
