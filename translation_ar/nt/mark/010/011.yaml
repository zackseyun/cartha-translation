id: MRK.10.11
reference: Mark 10:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: ar
  text: 'ويقول لهم: «مَن يطلِّق زوجته ويتزوج بأخرى[a] يرتكب الزنى في حقها».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «بامرأة أخرى»، بتعبير أكثر صراحة.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: يقول
  rationale: استُخدم المضارع للمحافظة على المضارع التاريخي اليوناني، وهو سمة سردية شائعة في مرقس، والتعبير طبيعي في العربية.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ينقل ضمير الجمع في حالة المجرور بوصفه مفعولًا غير مباشر.
- source_word: Ὃς ἂν
  choice: مَن
  rationale: تنقل أداة الشرط العامة غير المحددة بإيجاز وطبيعية.
- source_word: ἀπολύσῃ
  choice: يطلِّق
  rationale: السياق الزوجي يحدد معنى الفعل بأنه الطلاق، لا مجرد الإرسال أو الصرف.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: زوجته
  rationale: مع أن γυνή قد تعني امرأة أو زوجة، فإن الإضافة وسياق الطلاق يقتضيان معنى الزوجة.
- source_word: γαμήσῃ ἄλλην
  choice: يتزوج بأخرى
  rationale: الصيغة المؤنثة ἄλλην تعني امرأة أخرى، وحذف كلمة «امرأة» هنا عربي طبيعي مع بقاء المعنى واضحًا.
- source_word: μοιχᾶται
  choice: يرتكب الزنى
  rationale: تعبير عربي واضح ومألوف ينقل دلالة الفعل على اقتراف الزنى.
- source_word: ἐπ’ αὐτήν
  choice: في حقها
  rationale: يحافظ على كون الفعل إساءة موجهة إلى الزوجة، مع تجنب صياغة عربية قد توهم أن الزنى وقع معها.
theological_decisions:
- issue: الحفاظ على قوة ἐπ’ αὐτήν بوصفها دالة على الإساءة الواقعة على الزوجة
  choice: يرتكب الزنى في حقها
  alternative: يرتكب الزنى؛ يزني مع أخرى
  rationale: العبارة موجودة في اليونانية، وصياغة «في حقها» تحفظ تركيز النص على أن فعل الزوج اعتداء على حق زوجته، من غير تسطيح العبارة أو تحويلها إلى تحديد لشريكة الزنى.
- issue: الصياغة العامة للمذكر
  choice: مَن
  alternative: أي رجل
  rationale: «مَن» تنقل الشرط العام غير المحدد من دون تضييق زائد، بينما يوضح ذكر «زوجته» أن المقصود المباشر في السياق زوج.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على المضارع التاريخي، واستُخدمت «في حقها» لإبراز جهة الإساءة مع تجنب الالتباس الذي قد ينشأ من «عليها» في العربية.
