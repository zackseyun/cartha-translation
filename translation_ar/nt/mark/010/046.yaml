  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: ar
  text: وجاؤوا إلى أريحا[a]. وبينما كان يخرج من أريحا مع تلاميذه وجمع غفير[b]، كان بارتيماوس ابن تيماوس، وهو متسوّل أعمى، جالسًا بجانب الطريق[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'جاء الفعل في اليونانية بصيغة المضارع التاريخي: «ويجيئون».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «جمع كبير».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «على جانب الطريق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: وجاؤوا
  rationale: الفعل في اليونانية مضارع تاريخي، لكن الماضي هو الأسلوب الطبيعي الواضح في السرد العربي، مع حفظ المعلومة في الحاشية.
- source_word: ἐκπορευομένου αὐτοῦ
  choice: وبينما كان خارجًا
  rationale: يحفظ تزامن الحدث الذي تفيده العبارة اليونانية المطلقة، ويعبّر بوضوح عن حركة الخروج من المدينة.
- source_word: ὄχλου ἱκανοῦ
  choice: وجمع غفير
  rationale: ينقل معنى كثرة الجمع وحجمه الملحوظ بعبارة عربية فصيحة ومألوفة، من غير مبالغة.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: بارتيماوس ابن تيماوس
  rationale: يحفظ الاسم الشخصي والعبارة التفسيرية الواردين معًا في النص، بترتيب طبيعي في العربية.
- source_word: τυφλὸς προσαίτης
  choice: متسوّل أعمى
  rationale: ترجمة مباشرة وواضحة للوصفين، مع ترتيب عربي طبيعي لا يغيّر مضمونهما.
- source_word: παρὰ τὴν ὁδόν
  choice: بجانب الطريق
  rationale: تؤدي معنى الموضع بمحاذاة الطريق بعبارة عربية مباشرة وطبيعية.
- source_word: Ἰεριχώ
  choice: أريحا
  rationale: الصيغة العربية المعيارية المألوفة لاسم المدينة.
theological_decisions:
- issue: التعريف السردي ببارتيماوس
  choice: إبقاء الاسم «بارتيماوس» وبيانه «ابن تيماوس» معًا في المتن.
  alternative: الاكتفاء بالاسم أو بترجمة معناه وحذف أحد العنصرين.
  rationale: النص اليوناني يورد العنصرين، وحفظهما يصون التفصيل السردي ولا يفرض تفسيرًا زائدًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم الماضي للسرد الطبيعي، مع الإشارة إلى المضارع التاريخي في الحاشية، وحُفظت بنية الجملة وتفاصيل التعريف بالشخص من غير تكلّف.
