  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: ar
  text: وكانوا يأتون إليه بأطفال[a] لكي يلمسهم، لكن التلاميذ وبَّخوا الذين كانوا يأتون بهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أطفال صغار». يمكن أن تشير الكلمة اليونانية إلى الأطفال عمومًا، بمن فيهم صغار الأطفال.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: كان الناس يأتون إليه بـ
  rationale: صيغة الماضي الناقص تدل على فعل مستمر أو متكرر، وعبارة «كان الناس يأتون» تنقل هذا الجانب بوضوح، مع إظهار الفاعل الضمني الذي يعود إليه الضمير في آخر الآية.
- source_word: παιδία
  choice: أطفال
  rationale: لفظة παιδία تدل على الأطفال بوجه عام، وقد تشمل صغار الأطفال، من غير أن تحصر المعنى في الرضّع.
- source_word: ἵνα αὐτῶν ἅψηται
  choice: لكي يلمسهم
  rationale: تنقل «لكي» معنى الغرض، و«يلمسهم» هي الدلالة المباشرة للفعل من غير استيراد صورة وضع اليدين من الروايات الموازية.
- source_word: ἐπετίμησαν
  choice: وبَّخوا
  rationale: ينقل الفعل معنى الزجر أو التوبيخ الشديد بصياغة عربية واضحة وطبيعية.
- source_word: αὐτοῖς
  choice: الذين أتوا بهم
  rationale: الضمير يعود على الأشخاص الذين كانوا يأتون بالأطفال. جرى توضيح المرجع في العربية دفعًا لاحتمال عوده على الأطفال، من غير تغيير المعنى السياقي.
- source_word: δὲ
  choice: لكن
  rationale: تُظهر «لكن» المقابلة بين إتيان الناس بالأطفال ورد فعل التلاميذ.
theological_decisions:
- issue: مرجع الذين وبخهم التلاميذ
  choice: الأشخاص الذين أتوا بالأطفال
  alternative: الأطفال أنفسهم
  rationale: المرجع الأرجح نحويًا وسياقيًا هو الفاعل الضمني للفعل «كانوا يأتون»، كما ينسجم ذلك مع سياق منع التلاميذ لهم في الآية التالية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «كان الناس يأتون» لحفظ دلالة الاستمرار أو التكرار، ووُضّح مرجع ضمير الموبَّخين منعًا للالتباس. وُضعت علامة الحاشية بعد الجملة التي تتضمن لفظ «أطفال».
