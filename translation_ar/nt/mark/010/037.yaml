  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: ar
  text: 'فقالا له: «امنحنا أن نجلس، أحدنا عن يمينك والآخر عن يسارك، في مجدك».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν
  choice: امنحنا
  rationale: ينقل معنى الطلب بأن يعطيهما يسوع هذا الامتياز، بصياغة عربية طبيعية وموجزة.
- source_word: εἷς ... καὶ εἷς
  choice: أحدنا ... والآخر
  rationale: يوضح أن المتكلمين اثنان وأن كل واحد منهما يطلب موضعًا، وهو ما يدل عليه السياق وصيغة الجمع في الفعل.
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: عن يمينك ... عن يسارك
  rationale: تعبير عربي مألوف يحافظ على صورة موضعي الشرف إلى اليمين واليسار.
- source_word: ἐν τῇ δόξῃ σου
  choice: في مجدك
  rationale: ترجمة مباشرة تحفظ سعة مدلول المجد ولا تحصره تفسيريًا في المملكة أو العرش.
theological_decisions:
- issue: مدلول «في مجدك»
  choice: الإبقاء على «في مجدك» دون تفسير إضافي
  alternative: حين تأتي في ملكك
  rationale: النص اليوناني يذكر المجد صراحة، وقد يحمل أبعادًا ملكية وأخروية؛ لذلك لا ينبغي استبداله بتفسير أضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة، مع الحفاظ على الإيجاز وبنية الطلب المباشر.
