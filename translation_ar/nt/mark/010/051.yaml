source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: ar
  text: 'فأجابه يسوع قائلًا: «ماذا تريد أن أفعل لك؟» فقال له الأعمى: «رَبُّونِي[a]، أن أُبصر من جديد».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «رَبُّونِي» صيغة نداء آرامية تعني «يا معلّمي» أو «يا سيدي».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: فأجابه ... قائلًا
  rationale: يحافظ على الصيغة الحالية في اليونانية من خلال «قائلًا»، مع صياغة عربية طبيعية تُظهر أن كلام يسوع جاء جوابًا له.
- source_word: Τί σοι θέλεις ποιήσω
  choice: ماذا تريد أن أفعل لك؟
  rationale: تنقل معنى الإرادة في θέλεις، وتحفظ دلالة σοι بعبارة «لك»، في تركيب عربي واضح وطبيعي.
- source_word: τυφλὸς
  choice: الأعمى
  rationale: الصفة في اليونانية مستعملة استعمال الاسم، و«الأعمى» تؤدي هذا المعنى طبيعيًا في العربية مع بقاء الإشارة إلى الرجل المعيّن في السياق.
- source_word: Ραββουνι
  choice: رَبُّونِي
  rationale: نُقلت اللفظة السامية صوتيًا كما أبقاها النص اليوناني، حفاظًا على نكهتها التاريخية وقوة النداء، مع شرح معناها في الحاشية.
- source_word: ἵνα ἀναβλέψω
  choice: أن أُبصر من جديد
  rationale: في سياق الشفاء يدل ἀναβλέπω على استعادة البصر؛ وهذه الصياغة موجزة وتحفظ مضمون الطلب الناتج عن ἵνα.
theological_decisions:
- issue: نقل Ραββουνι بوصفها لقب نداء
  choice: الإبقاء على «رَبُّونِي» في المتن مع حاشية تفسيرية
  alternative: «يا معلّمي» أو «يا سيدي»
  rationale: النص اليوناني نفسه يحتفظ بصيغة النداء السامية بدل استبدالها بلقب يوناني مألوف؛ لذلك يحترم نقلها صوتيًا ملمس النص، بينما توضّح الحاشية معناها من غير فرض دلالة عربية واحدة على لفظ يحتمل «معلّمي» و«سيدي».
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «فأجابه يسوع قائلًا» للموازنة بين بنية الأصل وسلاسة العربية، وأُبقي اللقب الآرامي مع ضبطه وحاشية موجزة.
