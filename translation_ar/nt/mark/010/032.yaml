id: MRK.10.32
reference: Mark 10:32
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: ar
  text: وكانوا في الطريق[a] صاعدين إلى أورشليم، وكان يسوع يتقدَّمهم[b]. فكانوا مندهشين، وأما الذين كانوا يتبعون فكانوا خائفين. ثم أخذ الاثني عشر معه مرة أخرى، وبدأ يخبرهم بما كان مزمعًا أن يحدث له.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في السبيل».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يسير أمامهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: في الطريق
  rationale: تعبير عربي طبيعي يحافظ على مشهد السفر الملموس، ويمكن أيضًا فهمه بمعنى «في الطريق إلى هناك».
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: صاعدين إلى أورشليم
  rationale: يحافظ على فعل الصعود الوارد في اليونانية، الملائم لارتفاع أورشليم وللاستعمال المتعلق بالسفر إليها.
- source_word: προάγων αὐτούς
  choice: يتقدَّمهم
  rationale: ينقل بوضوح كون يسوع أمام الجماعة من غير إضافة معنى القيادة صراحةً.
- source_word: ἐθαμβοῦντο
  choice: كانوا مندهشين
  rationale: ينقل الدهشة الشديدة أو الحيرة من غير المبالغة إلى معنى الفزع، كما تعكس صيغة «كانوا» الحالة المستمرة.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: أما الذين كانوا يتبعون
  rationale: يحافظ على تركيب اسم الفاعل ولا يحدد هوية هذه الجماعة بما يتجاوز النص.
- source_word: ἐφοβοῦντο
  choice: كانوا خائفين
  rationale: ترجمة مباشرة تحفظ تمييز هذا الانفعال عن دهشة الجماعة المذكورة قبله.
- source_word: παραλαβὼν ... τοὺς δώδεκα
  choice: أخذ الاثني عشر معه
  rationale: يعكس المعنى الأساسي للفعل، وهو اصطحاب الاثني عشر، من غير جعل معنى التنحية على انفراد صريحًا مع أنه محتمل من السياق.
- source_word: πάλιν
  choice: مرة أخرى
  rationale: يبين تكرار اصطحاب الاثني عشر وتعليمهم.
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: بدأ يخبرهم
  rationale: صياغة عربية طبيعية تحفظ دلالة البدء ووجود مخاطَبين ومضمون يُخبرون به.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: بما كان مزمعًا أن يحدث له
  rationale: يحفظ معنى الأحداث الوشيكة المتعلقة بيسوع من غير أن يضيف مفهومًا أقوى للحتمية أو القدر.
theological_decisions:
- issue: التمييز بين ردَّي الفعل العاطفيين في السرد
  choice: ترجمة ἐθαμβοῦντο بـ«كانوا مندهشين» وἐφοβοῦντο بـ«كانوا خائفين».
  alternative: تعميم اللفظين بحيث يدل كلاهما على مزيج من الدهشة والخوف.
  rationale: استعمل النص اليوناني فعلين مختلفين ويبدو أنه يميز بين رد فعل الجماعة الأولى ورد فعل الذين كانوا يتبعون؛ لذلك يحافظ التفريق على التوتر السردي من غير تسويته.
- issue: هل يفيد παραλαβών تنحية الاثني عشر جانبًا صراحةً؟
  choice: «أخذ الاثني عشر معه»
  alternative: «أخذ الاثني عشر جانبًا» أو «على انفراد»
  rationale: الانفراد مفهوم محتمل من السياق، لكن المعنى المعجمي المباشر هو الأخذ أو الاصطحاب؛ فاختيرت صياغة لا تجعل الاستنتاج السياقي جزءًا صريحًا من النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أورشليم» وفق التقليد الكتابي العربي الشائع، وحُفظ تعبير الصعود إليها. وُضعت علامة الحاشية [b] عند العبارة التي تفسرها، أي «يتقدَّمهم»، بدل وضعها بعد «مرة أخرى».
