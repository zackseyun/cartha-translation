  text: But he answered them, “What did Moses command you?”
translation:
  language: ar
  text: 'فأجابهم: «ماذا أمركم موسى؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: حرف ربط خفيف يصل الجواب بالسؤال السابق، وتؤدي الفاء هذا الانتقال الحواري طبيعيًا من غير تشديد معنى الاستدراك.
- source_word: ἀποκριθεὶς εἶπεν
  choice: أجاب
  rationale: 'هذا التركيب اليوناني الشائع يُنقل إلى العربية بفعل واحد طبيعي يحفظ معنى الاستجابة ويتجنب التكرار الثقيل: «أجاب وقال».'
- source_word: αὐτοῖς
  choice: هم
  rationale: أُدمج الضمير في الفعل «أجابهم»، وهو الأسلوب العربي الطبيعي لأداء المفعول غير المباشر هنا.
- source_word: Τί
  choice: بماذا
  rationale: مع فعل «أوصى» المتعدي بالباء في هذا المعنى، تؤدي «بماذا» السؤال عن مضمون الوصية بوضوح.
- source_word: ὑμῖν
  choice: كم
  rationale: أُدمج ضمير المخاطبين في «أوصاكم»، محافظًا على كونهم متلقي الوصية.
- source_word: ἐνετείλατο
  choice: أوصى
  rationale: يحمل الفعل معنى إصدار وصية أو أمر ملزم؛ و«أوصى» تعبير عربي فصيح وطبيعي في سياق شريعة موسى، مع بقاء القوة السلطانية للسياق.
- source_word: Μωϋσῆς
  choice: موسى
  rationale: الصيغة العربية المعيارية المستقرة للاسم العلم.
theological_decisions:
- issue: الإشارة إلى سلطة موسى في جواب يسوع
  choice: الإبقاء على «موسى» بوصفه الوسيط البشري المذكور صراحة
  alternative: «بماذا أوصتكم شريعة موسى؟» أو «بماذا أوصاكم الله على لسان موسى؟»
  rationale: النص اليوناني يسمّي موسى مباشرة ولا يضيف «الشريعة» أو «الله على لسان موسى»؛ لذا يحفظ النقل صياغة السؤال من غير إدخال شرح لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختير تركيب موجز وطبيعي، من دون حواشٍ لعدم وجود غموض نصي أو دلالي يستلزمها.
