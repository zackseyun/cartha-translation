  text: ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα ⸂καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: ar
  text: لِهٰذَا سَيَتْرُكُ الرَّجُلُ أَبَاهُ وَأُمَّهُ، وَيَلْتَصِقُ بِزَوْجَتِهِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويقترن بزوجته». يدل الفعل اليوناني على التعلّق الوثيق.'
    reason: بديل معجمي يوضح مدى معنى الفعل προσκολληθήσεται.
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: لِهٰذَا
  rationale: تعبير سببي عربي طبيعي يحفظ معنى التعليل في الأصل.
- source_word: καταλείψει
  choice: سَيَتْرُكُ
  rationale: يحفظ صيغة المستقبل ومعنى مغادرة بيت الوالدين من غير الإيحاء بالهجر القاسي.
- source_word: ἄνθρωπος
  choice: الرَّجُلُ
  rationale: مع أن اللفظة قد تكون عامة، فإن سياق الزواج وذكر زوجته يحددان هنا الطرف الذكر.
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: أَبَاهُ وَأُمَّهُ
  rationale: صياغة عربية موجزة وطبيعية تنقل المفعولين مع عود الضمير إلى الرجل.
- source_word: προσκολληθήσεται
  choice: يَلْتَصِقُ
  rationale: ينقل صورة التعلّق الوثيق في الفعل اليوناني، وهو تعبير عربي مفهوم في سياق الارتباط الزوجي.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: بِزَوْجَتِهِ
  rationale: γυνή تعني هنا الزوجة بوضوح بسبب سياق الزواج، والباء تلائم الفعل «يلتصق» في العربية.
theological_decisions:
- issue: اللغة المحددة للجنس في الاقتباس المتعلق بالزواج
  choice: الرجل ... زوجته
  alternative: الإنسان ... شريك حياته
  rationale: السياق يقدّم طرفي الزواج بوصفهما رجلًا وزوجته، ولذلك حُفظ التحديد الموجود في النص بدل تعميمه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم المستقبل الصريح موافقةً لصيغة الفعل اليوناني، مع إبقاء صورة الالتصاق لأنها طبيعية نسبيًا وتحفظ قوة التعلّق في الأصل.
