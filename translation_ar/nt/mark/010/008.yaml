source:
  edition: SBLGNT
  text: καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: ar
  text: «ويصير الاثنان جسدًا واحدًا»[a]. لذلك لا يعودان اثنين، بل جسدًا واحدًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «ويكون الاثنان إلى جسد واحد».'
    reason: بديل لفظي يبيّن تركيب الأصل اليوناني مع εἰς، بينما ينقل المتن معناه الناتج بصياغة عربية طبيعية.
lexical_decisions:
- source_word: ἔσονται
  choice: يصير
  rationale: مع أن الفعل أصله «يكون»، فإن تركيبه هنا مع εἰς يفيد الدخول في حالة ناتجة؛ و«يصير» تعبر عن ذلك طبيعيًا في العربية.
- source_word: οἱ δύο
  choice: الاثنان
  rationale: يحافظ على ذكر العدد صراحةً وعلى المقابلة اللاحقة مع «لا يعودان اثنين».
- source_word: εἰς σάρκα μίαν
  choice: جسدًا واحدًا
  rationale: هذه العبارة الكتابية المأخوذة من سياق الزواج تُصاغ طبيعيًا في العربية من دون ترجمة حرف الجر حرفيًا، مع بقاء معنى الاتحاد الناتج في الفعل «يصير».
- source_word: σάρκα / σάρξ
  choice: جسدًا
  rationale: «جسد» هو التعبير العربي الكتابي الواضح هنا، ويحفظ الصلة بتكوين 2 ومعنى الاتحاد الزوجي من غير اختزاله في معنى تفسيري أضيق.
- source_word: ὥστε
  choice: لذلك
  rationale: تدل هنا على النتيجة أو الاستنتاج المترتب على العبارة السابقة.
- source_word: οὐκέτι
  choice: لا يعودان
  rationale: صياغة عربية طبيعية تدل على أن الحالة السابقة لم تعد قائمة، وتوافق المثنى في السياق.
- source_word: ἀλλὰ μία σάρξ
  choice: بل جسدًا واحدًا
  rationale: تحفظ المقابلة الصريحة بين الاثنين والجسد الواحد، من غير توسيع تفسيري.
theological_decisions:
- issue: دلالة عبارة «جسدًا واحدًا» في استشهاد يسوع من سفر التكوين
  choice: الإبقاء على التعبير الكتابي «جسدًا واحدًا» بلا شرح تفسيري داخل النص
  alternative: شخصًا واحدًا؛ كيانًا واحدًا؛ متحدين جنسيًا
  rationale: للعبارة دلالة زوجية وإنسانية واسعة لا يحصرها هذا العدد في جانب واحد؛ لذلك يحفظ النص توترها وغناها من دون فرض تفسير مذهبي أو اختزالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم المثنى في «الاثنان/يعودان» لإبراز المقابلة التي يؤكدها الأصل، مع الحفاظ على العبارة الكتابية «جسدًا واحدًا».
