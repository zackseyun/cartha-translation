  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: ar
  text: وسيسخرون منه، ويبصقون عليه، ويجلدونه، ويقتلونه، وبعد ثلاثة أيام[a] سيقوم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في ثلاثة أيام». يرد النص اليوناني في مرقس بعبارة «بعد ثلاثة أيام»، بينما تصوغ مواضع أخرى التوقيت بعبارة «في اليوم الثالث».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμπαίξουσιν αὐτῷ
  choice: يسخرون منه
  rationale: ينقل معنى الاستهزاء به ومعاملته باحتقار بعبارة عربية واضحة وطبيعية.
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: يبصقون عليه
  rationale: تعبير مباشر يحفظ دلالة الإهانة الموجَّهة إليه، وهو الأنسب في العربية المعاصرة.
- source_word: μαστιγώσουσιν αὐτόν
  choice: يجلدونه
  rationale: يدل على الضرب بالسياط، ويحافظ على طابع العقوبة من غير استعمال لفظ قديم أو غامض.
- source_word: ἀποκτενοῦσιν
  choice: يقتلونه
  rationale: ينقل المعنى الصريح للفعل من غير إضافة دلالة قضائية خاصة أو توصيف أخلاقي غير مصرَّح به.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: بعد ثلاثة أيام
  rationale: ينقل الدلالة المعتادة لحرف الجر μετά مع حالة النصب نقلاً مباشرًا، من غير مواءمة صامتة مع صيغة «في اليوم الثالث» الواردة في مواضع أخرى.
- source_word: ἀναστήσεται
  choice: يقوم
  rationale: الصيغة اليونانية مستقبل متوسط وتُفهم هنا فعلاً لازمًا؛ لذلك تحافظ «يقوم» على الصياغة من غير تحويلها إلى المبني للمجهول أو إضافة «أيضًا/من جديد» غير المذكورة صراحة.
theological_decisions:
- issue: صياغة القيامة
  choice: يقوم
  alternative: يُقام؛ يقوم من جديد
  rationale: يحفظ الاختيار دلالة ἀναστήσεται بوصفه فعلاً لازمًا، من غير أن ينفي شهادة مواضع أخرى عن أن الآب أقامه، ومن غير إضافة معنى «من جديد» غير الصريح هنا.
- issue: توقيت القيامة
  choice: بعد ثلاثة أيام
  alternative: في ثلاثة أيام؛ في اليوم الثالث
  rationale: تُبقي الصياغة الرئيسية على عبارة مرقس اليونانية كما هي، ولا توحّدها ضمنيًا مع الصياغة الزمنية الواردة في نصوص موازية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات إيقاع سردي كريم. وُضع رمز الحاشية بعد العبارة الزمنية التي تشرحها الحاشية، لا بعد فعل السخرية.
