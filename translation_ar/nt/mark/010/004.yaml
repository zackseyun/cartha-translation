  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: ar
  text: 'فقالوا: «سمح موسى بأن يكتب الرجل وثيقة طلاق[a] ويطلّق زوجته[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كتاب طلاق». والعبارة اليونانية تشير إلى وثيقة قانونية مكتوبة للطلاق.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «وأن يسرّح [زوجته]». ويُستعمل الفعل هنا في سياق الطلاق بمعنى يطلّق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: فقالوا
  rationale: الفاء تصل الجواب بالسؤال السابق اتصالًا طبيعيًا، وضمير الجمع يعود إلى المحاورين المذكورين في السياق، من غير إثقال العبارة بإظهار الاسم.
- source_word: Ἐπέτρεψεν
  choice: سمح
  rationale: ينقل معنى الإذن لا الأمر، ويحافظ على التمييز السياقي بين ما سمح به موسى وما قصده الله منذ بدء الخليقة.
- source_word: Μωϋσῆς
  choice: موسى
  rationale: الصيغة العربية المألوفة للاسم.
- source_word: βιβλίον ἀποστασίου
  choice: كتاب طلاق
  rationale: تعبير عربي واضح ذو طابع قانوني يشير إلى الوثيقة المكتوبة التي تثبت الطلاق.
- source_word: γράψαι
  choice: بأن يُكتب
  rationale: يحافظ على معنى الكتابة، وتلائم صيغة المبني للمجهول العربيةَ الطبيعية مع عدم ذكر فاعل الكتابة صراحة في اليونانية.
- source_word: καὶ ἀπολῦσαι
  choice: وأن تُطلَّق الزوجة
  rationale: في هذا السياق الزوجي يدل الفعل على إنهاء رابطة الزواج. أُظهر المفعول بلفظ «الزوجة» للتوضيح، مع التنبيه في الحاشية إلى الصورة الحرفية «تُسرَّح».
theological_decisions:
- issue: طبيعة تشريع موسى في شأن الطلاق
  choice: سمح موسى بالطلاق، ولم يأمر به أمرًا إيجابيًا
  alternative: أمر موسى الرجل بأن يكتب كتاب طلاق
  rationale: الفعل اليوناني Ἐπέτρεψεν يفيد الإذن صراحة، وهو تمييز مهم في السياق اللاحق بين السماح بسبب قساوة القلب وقصد الله في الخلق.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «كتاب طلاق» لصلته بالتعبير الكتابي والقانوني المألوف، و«تُطلَّق الزوجة» لبيان المقصود السياقي دون إبقاء عبارة قد تُفهم على أنها مجرد إبعاد مكاني.
