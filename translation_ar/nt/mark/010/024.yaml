  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: ar
  text: 'أما التلاميذ فكانوا مندهشين من كلامه. فأجابهم يسوع من جديد وقال: «يا أبنائي، ما أصعب[a] دخول ملكوت الله!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «يا أبنائي، ما أصعب على المتكلين على الأموال أن يدخلوا ملكوت الله!»'
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: كانوا مذهولين
  rationale: ينقل قوة الفعل الدال على الدهشة الشديدة، وتحافظ صيغة «كانوا» على الجانب الاستمراري في الماضي الناقص اليوناني، من غير مبالغة إلى معنى الصدمة.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: من كلامه
  rationale: تعبير عربي طبيعي يبيّن أن كلامه هو منشأ ذهولهم، مع بقاء الصلة المباشرة بالنص اليوناني.
- source_word: πάλιν ἀποκριθεὶς λέγει αὐτοῖς
  choice: فأجابهم يسوع من جديد وقال
  rationale: يحفظ معنى التكرار في πάλιν والفعلين «أجاب» و«قال»، مع ترتيب عربي واضح وطبيعي.
- source_word: Τέκνα
  choice: يا أولادي
  rationale: نداء حميم ينقل معنى τέκνα في هذا السياق. أضيفت أداة النداء والضمير في العربية لإظهار المخاطبة الأبوية طبيعيًا، لا لإثبات بنوة حرفية أو إضافة مضمون عقائدي.
- source_word: πῶς δύσκολόν ἐστιν
  choice: ما أصعب
  rationale: صيغة تعجب عربية موجزة وطبيعية تحفظ قوة πῶς التعجبية ومعنى δύσκολον.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: دخول ملكوت الله
  rationale: مصدر عربي واضح يؤدي معنى العبارة المصدرية اليونانية ويحافظ على المصطلح الكتابي المألوف «ملكوت الله».
theological_decisions:
- issue: هل تُدرج العبارة الأطول «على المتكلين على الأموال» في متن الآية؟
  choice: 'اتباع قراءة SBLGNT الأقصر في المتن: «ما أصعب دخول ملكوت الله!»'
  alternative: «يا أولادي، ما أصعب على المتكلين على الأموال أن يدخلوا ملكوت الله!»
  rationale: النص اليوناني المعطى يشهد للقراءة الأقصر، وهي تُبقي عموم العبارة وحدّتها اللاهوتية من غير تضييقها بإضافة تفسيرية. ولأن القراءة الأطول معروفة ومؤثرة في المعنى، تُذكر في الحاشية بوصفها اختلافًا نصيًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت «يا أولادي» بوصفها مخاطبة حانية طبيعية، و«ما أصعب» للمحافظة على النبرة التعجبية. وُضع رمز الحاشية بعد فعل القول لئلا يقطع الجملة المقتبسة، مع بقائه مرتبطًا مباشرة باختلاف صيغة الكلام الآتي.
