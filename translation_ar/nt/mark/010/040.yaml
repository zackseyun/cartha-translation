  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: ar
  text: أمّا الجلوس عن يميني أو عن يساري، فليس لي أن أمنحه[a]، بل هو للذين أُعِدَّ لهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فليس من شأني أن أمنحه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: الجلوس
  rationale: المصدر المعرّف يعمل اسميًّا في اليونانية، و«الجلوس» ينقل ذلك طبيعيًّا وبوضوح في العربية.
- source_word: ἐκ δεξιῶν μου
  choice: عن يميني
  rationale: تعبير عربي فصيح طبيعي يدل على الموضع إلى الجانب الأيمن، من غير إضافة لفظ «يد» غير الوارد صراحةً.
- source_word: ἢ ἐξ εὐωνύμων
  choice: أو عن يساري
  rationale: يحافظ على التوازي المكاني واللفظي مع «عن يميني» وينقل معنى الجانب الأيسر.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: فليس لي أن أمنحه
  rationale: ينقل البناء الدال على أن منح هذا المقام ليس ليسوع أن يعطيه في هذا السياق، من غير تفسير سبب ذلك أو إزالة التوتر اللاهوتي.
- source_word: ἀλλ’ οἷς
  choice: بل هو للذين
  rationale: يفك الإضمار اليوناني بقدر يلزم للعربية؛ فالضمير «هو» يعود إلى الجلوس أو المقام المذكور، مع إبقاء المقابلة التي تفيدها ἀλλά.
- source_word: ἡτοίμασται
  choice: أُعِدَّ لهم
  rationale: الماضي المبني للمجهول يعبّر طبيعيًّا عن إعداد تمّ وبقي أثره، ويترك فاعل الإعداد غير مصرّح به كما في الأصل.
theological_decisions:
- issue: هل تُصاغ العبارة بما ينفي سلطة يسوع نفيًا مطلقًا أم تُقيَّد بتفسير لاهوتي؟
  choice: فليس لي أن أمنحه
  alternative: فليس لي أن أمنحه بمعزل عن إرادة الآب
  rationale: النص اليوناني يذكر القيد بلا تفسير صريح. لذلك لا تُضاف إحالة إلى إرادة الآب ولا أي توفيق عقائدي غير وارد، بل يُحفظ التوتر الموجود في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «أمّا» لتمثيل δέ الانتقالية، وحُفظ التوازي بين اليمين واليسار، كما بقي فاعل «أُعِدَّ» غير مذكور وفق الأصل.
