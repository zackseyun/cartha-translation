  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: ar
  text: 'قال يسوع: «الحق أقول لكم: ما من أحد ترك بيتًا أو إخوةً أو أخواتٍ أو أمًّا أو أبًا أو أولادًا أو حقولًا من أجلي ومن أجل البشارة،»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: فقال
  rationale: ينقل فعل القول ببساطة، وتلائم الفاء سياق استمرار حديث يسوع وجوابه من الآية السابقة من غير إضافة معنى غير صريح.
- source_word: Ἀμὴν
  choice: الحق
  rationale: صيغة عربية طبيعية موقرة لاستهلال قول مؤكد، وتحفظ قوة ἀμήν من غير تكرار غير موجود في اليونانية.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: يحفظ مباشرة الصيغة اليونانية وطابعها التوكيدي المهيب.
- source_word: οὐδείς ἐστιν ὃς
  choice: ما من أحد
  rationale: تعبير عربي فصيح وطبيعي يحفظ النفي العام في التركيب الوجودي اليوناني.
- source_word: ἀφῆκεν
  choice: ترك
  rationale: ينقل الفعل بوضوح من غير المبالغة التي قد توحي بها ألفاظ مثل «هجر» أو «نبذ».
- source_word: οἰκίαν
  choice: بيتًا
  rationale: المقابل المباشر والطبيعي للمسكن أو الملك المذكور في القائمة.
- source_word: ἀδελφοὺς
  choice: إخوةً
  rationale: يحفظ الإشارة إلى الإخوة الذكور، إذ ترد الأخوات منفصلات في النص.
- source_word: ἀδελφὰς
  choice: أخواتٍ
  rationale: المقابل المباشر مع الحفاظ على ذكر الإناث مستقلًا في القائمة.
- source_word: μητέρα
  choice: أمًّا
  rationale: المقابل العربي المباشر.
- source_word: πατέρα
  choice: أبًا
  rationale: المقابل العربي المباشر، مع الحفاظ على وروده في النص المعتمد.
- source_word: τέκνα
  choice: أولادًا
  rationale: لفظ عربي جامع للذرية هنا، طبيعي في تعداد صلات الأسرة ولا يحدد الجنس.
- source_word: ἀγρούς
  choice: حقولًا
  rationale: ينقل المعنى المحسوس للأراضي المزروعة، وهو أدق من «أملاك» وأقل تفسيرًا من «مزارع».
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: من أجلي ومن أجل البشارة
  rationale: يحفظ تكرار أداة التعليل والتمييز بين يسوع والبشارة، ويستعمل «البشارة» بالمعنى الخبري للكلمة اليونانية.
theological_decisions:
- issue: عدم المبالغة في معنى ترك الأسرة والممتلكات
  choice: ترك بيتًا أو إخوةً أو أخواتٍ أو أمًّا أو أبًا أو أولادًا أو حقولًا
  alternative: هجر بيتًا... / نبذ بيتًا...
  rationale: «ترك» يحفظ كلفة التلمذة التي يقررها النص من غير أن يضيف بالضرورة معنى التنصل الأخلاقي أو القطيعة المطلقة.
- issue: العلاقة بين الدافع الشخصي والدافع الرسالي
  choice: من أجلي ومن أجل البشارة
  alternative: من أجلي، أي من أجل البشارة
  rationale: يحفظ العطف اليوناني ولا يدمج الدافعين في تفسير لاهوتي واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظت بنية التعداد وإيقاع القول الرسمي، كما أُبقيت الفاصلة الختامية لأن الجملة النحوية تستمر في الآية التالية.
