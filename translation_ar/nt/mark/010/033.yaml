  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: ar
  text: «ها نحن صاعدون إلى أورشليم، وسيُسلَّم ابن الإنسان إلى رؤساء الكهنة والكتبة، وسيحكمون عليه بالموت، وسيسلّمونه إلى غير اليهود[a].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى الأمم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: قائلًا
  rationale: تُدخل الأداة هنا مضمون كلام يسوع المتصل بالآية السابقة؛ وصيغة «قائلًا» طبيعية في العربية مع إبقاء الوظيفة الخطابية دون إضفاء معنى سببي.
- source_word: Ἰδοὺ
  choice: ها
  rationale: أداة تنبيه موجزة وطبيعية في العربية المعاصرة، وتحفظ قوة لفت الانتباه دون استعمال تعبير عتيق.
- source_word: ἀναβαίνομεν
  choice: نحن صاعدون
  rationale: تحفظ معنى الصعود الحاضر نحو أورشليم، وهو تعبير ملائم جغرافيًا وسياقيًا.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: المقابل العربي المستقر الذي يحفظ الصياغة الحرفية وأصداء اللقب اللاهوتية دون تفسيره.
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: سيُسلَّم / يُسلِّمونه
  rationale: استعمال الجذر العربي نفسه في الموضعين يحفظ تكرار الفعل اليوناني وتسلسل انتقاله إلى سلطة الآخرين، من غير تضييق المعنى إلى الخيانة وحدها.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: إلى رؤساء الكهنة
  rationale: التعبير العربي المألوف والدقيق عن جماعة القيادات الكهنوتية، لا عن رئيس كهنة واحد.
- source_word: τοῖς γραμματεῦσιν
  choice: الكتبة
  rationale: مقابل مباشر ومفهوم يحفظ اللفظ التاريخي دون التوسع التفسيري إلى «معلمي الشريعة».
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: فيحكمون عليه بالموت
  rationale: صياغة قضائية عربية طبيعية تنقل صدور الحكم المؤدي إلى الموت.
- source_word: τοῖς ἔθνεσιν
  choice: إلى غير اليهود
  rationale: السياق يشير إلى السلطات غير اليهودية التي يُنقل إليها يسوع؛ وهذه الصياغة أوضح للقارئ العربي المعاصر من اللفظ المعرَّب «الأمم» مع إثبات البديل في الحاشية.
theological_decisions:
- issue: ترجمة ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: يحفظ اللقب بصيغته التقليدية وأصداءه في سفر دانيال واستعماله المسيحاني، من غير تسطيح دلالته أو حسمها تفسيريًا.
- issue: ترجمة τοῖς ἔθνεσιν
  choice: غير اليهود
  alternative: الأمم
  rationale: يوضح التمييز التاريخي في سياق الآلام بين القيادات اليهودية والسلطات غير اليهودية، من غير تحميل العبارة ادعاءً لاهوتيًا أوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «ها نحن» للتنبيه الطبيعي، وحُفظ تكرار جذر «سلّم» في الفعلين، كما حُفظ لقب «ابن الإنسان» دون إعادة صياغة تفسيرية.
