  register: عربية فصحى حديثة واضحة وكريمة، مع استعمال المثنى حيث يقتضيه النص. اختير «تقدَّم إليه» لأنه أدق في إظهار الحركة نحو يسوع من «جاء إليه»، ولذلك لا تلزم حاشية البديل الإنجليزية.
