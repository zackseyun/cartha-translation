source:
  edition: SBLGNT
  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: ar
  text: 'وتقدَّم إليه يعقوب ويوحنا ابنا زبدي وقالا له: «يا معلِّم، نريد منك أن تفعل لنا كلَّ ما نطلبه منك».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσπορεύονται
  choice: تقدَّم إليه
  rationale: ينقل معنى الحركة نحو يسوع بصياغة عربية طبيعية، مع التعبير عن الحاضر التاريخي بصيغة الماضي الملائمة للسرد العربي.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: ابنا زبدي
  rationale: يحفظ التحديد البدلي الوارد في اليونانية، وتأتي صيغة المثنى طبيعية ودقيقة في العربية.
- source_word: λέγοντες αὐτῷ
  choice: وقالا له
  rationale: تحويل اسم الفاعل اليوناني إلى فعل معطوف هو الأسلوب العربي الطبيعي، وصيغة المثنى توافق يعقوب ويوحنا.
- source_word: Διδάσκαλε
  choice: يا معلِّم
  rationale: المعنى المباشر للقب هو المعلّم، والنداء بـ«يا» فصيح وطبيعي ولا يضيف دلالة سلطوية زائدة.
- source_word: θέλομεν
  choice: نريد
  rationale: يؤدي المعنى المباشر والواضح للفعل في العربية المعاصرة ويحفظ جرأة الطلب.
- source_word: ἵνα
  choice: أن
  rationale: تأتي بعد «نريد منك» لتكوين جملة مصدرية عربية طبيعية تؤدي مضمون المطلوب.
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: كلَّ ما نطلبه منك
  rationale: ينقل عدم التحديد في تركيب الاسم الموصول مع ἐάν؛ و«منك» توضّح أن الطلب موجَّه إليه.
- source_word: ποιήσῃς ἡμῖν
  choice: تفعل لنا
  rationale: يحافظ على عمومية ποιέω وعلى معنى المنفعة في ضمير المجرور، من غير تفسيره تفسيرًا أضيق مثل «تمنحنا».
theological_decisions: []
