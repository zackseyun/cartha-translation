  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: ar
  text: ومَن أراد أن يكون الأول بينكم، فسيكون عبدًا للجميع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خادمًا للجميع». الكلمة اليونانية هي «دولوس»، وهي أقوى من الكلمة المترجمة «خادمًا» في العدد السابق؛ لذلك استُعملت هنا كلمة «عبدًا» للمحافظة على هذا التباين.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: مَن أراد
  rationale: تركيب الموصول مع ἄν وفعل الشرط يدل على حالة عامة غير محددة؛ و«مَن أراد» تعبير عربي طبيعي يحفظ معنى الإرادة.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: يدل السياق على المرتبة داخل جماعة التلاميذ، لا على مجرد الموقع المكاني.
- source_word: πρῶτος
  choice: الأول
  rationale: يحفظ الدلالة المباشرة على التقدم في المرتبة أو المكانة، ويوافق سياق المفاضلة والعظمة.
- source_word: ἔσται
  choice: فسيكون
  rationale: ترجمة مباشرة لصيغة المستقبل، مع بقاء القوة الإلزامية المستفادة من سياق تعليم يسوع من غير تحويلها صراحة إلى «يجب».
- source_word: πάντων
  choice: للجميع
  rationale: اللام تؤدي علاقة الخضوع التي يدل عليها المضاف إليه مع δοῦλος، وتحفظ شمول العبارة.
- source_word: δοῦλος
  choice: عبدًا
  rationale: «عبد» أقوى من «خادم» التي تناسب διάκονος في العدد السابق، ولذلك يحفظ التصعيد المقصود وما في اللفظة من خضوع وفقدان للمكانة.
theological_decisions:
- issue: ترجمة δοῦλος في قول عن التلمذة
  choice: عبدًا
  alternative: خادمًا
  rationale: يستعمل العدد السابق διάκονος، ثم يستعمل هذا العدد اللفظ الأقوى δοῦλος. واختيار «عبد» يحفظ التمييز والتصعيد في الدعوة إلى خفض الذات، من غير تلطيف اللفظة إلى «خادم».
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «فسيكون» لربط النتيجة بالشرط طبيعيًا، و«عبدًا» لإبراز قوة اللفظ اليوناني مقارنة بالعدد السابق.
