  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: ar
  text: 'فنظر إليهم يسوع وقال: «هذا مستحيل عند البشر، لكنه ليس مستحيلًا عند الله، لأن كل شيء ممكن عند الله».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: فنظر إليهم
  rationale: ينقل فعل النظر المباشر إليهم بعبارة عربية طبيعية، من غير إضافة وصف لشدّة النظرة لا يصرّح به السياق تصريحًا لازمًا.
- source_word: Παρὰ ἀνθρώποις
  choice: عند البشر
  rationale: يحافظ على معنى الاستحالة في نطاق القدرة البشرية، ويستعمل «البشر» في مقابل «الله» بوضوح.
- source_word: ἀδύνατον
  choice: هذا مستحيل
  rationale: الأصل اليوناني يحذف المسند إليه اعتمادًا على السياق؛ أُضيف اسم الإشارة في العربية لإكمال الجملة مع إبقاء مرجعه السياقي عامًا.
- source_word: πάντα
  choice: كل شيء
  rationale: ترجمة مباشرة للصيغة الشاملة من غير تقييد لم يرد في النص.
- source_word: δυνατὰ παρὰ τῷ θεῷ
  choice: ممكن عند الله
  rationale: يحافظ على التوازي اللفظي مع «عند البشر» وعلى إسناد الإمكان إلى الله.
- source_word: γὰρ
  choice: لأن
  rationale: يبين أن العبارة الأخيرة تعليل لنفي الاستحالة عند الله.
theological_decisions:
- issue: مدى عبارة «كل شيء ممكن عند الله»
  choice: 'إبقاء العبارة مطلقة كما وردت: «كل شيء ممكن عند الله»'
  alternative: تقييدها صراحة بالخلاص أو بما يريده الله
  rationale: السياق يتناول الخلاص، لكن النص نفسه يصوغ القول بعبارة شاملة؛ لذلك لا يُدرج التقييد التفسيري في المتن.
- issue: المحذوف في عبارة «عند البشر مستحيل»
  choice: استخدام «هذا» مع إبقاء المرجع مستفادًا من السياق
  alternative: تعيين المرجع بقول «الخلاص مستحيل»
  rationale: تعيين «الخلاص» يفسر المحذوف تفسيرًا محتملًا لكنه أصرح من الأصل؛ أما «هذا» فيحفظ الإحالة السياقية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم الماضي «قال» بدل المضارع السردي اليوناني لأنه الأسلوب الطبيعي في السرد العربي، مع الحفاظ على المقابلة والتعليل في بنية الآية.
