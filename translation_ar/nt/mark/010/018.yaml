  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: ar
  text: 'فقال له يسوع: «لماذا[a] تدعوني صالحًا؟ لا أحد صالح إلا واحد، وهو الله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «لأي شيء تدعوني صالحًا؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: فاء الاستئناف والجواب طبيعية في العربية، وتربط رد يسوع بكلام الرجل من غير تحميل الأداة اليونانية تباينًا أقوى مما تقتضيه.
- source_word: εἶπεν αὐτῷ
  choice: قال له
  rationale: مقابل عربي مباشر وطبيعي يحفظ فعل القول والمفعول غير المباشر.
- source_word: Τί
  choice: لماذا
  rationale: تؤدي τί هنا وظيفة السؤال عن سبب إطلاق الوصف، و«لماذا» هي الصياغة العربية الواضحة والطبيعية؛ أما المقابل الحرفي فمذكور في الحاشية.
- source_word: με λέγεις ἀγαθόν
  choice: تدعوني صالحًا
  rationale: يحفظ تركيب المفعول والوصف الخبري بعبارة عربية مألوفة ودقيقة.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: صالحًا / صالح
  rationale: يحافظ على تكرار اللفظة اليونانية وعلى دلالتها العامة من غير إضافة قيد أخلاقي تفسيري.
- source_word: οὐδεὶς
  choice: لا أحد
  rationale: تعبير عربي واضح وطبيعي يحفظ النفي الشامل.
- source_word: εἰ μὴ εἷς
  choice: إلا واحد
  rationale: ينقل تركيب الاستثناء ويحفظ إبراز الوحدانية قبل تعيين الواحد.
- source_word: ὁ θεός
  choice: الله
  rationale: هو المقابل العربي الطبيعي للاسم الإلهي في هذا السياق، ولا تستلزم أداة التعريف اليونانية صياغة إضافية.
theological_decisions:
- issue: الدلالة المسيحانية المحتملة لقول يسوع عن الصلاح
  choice: نقل القول كما هو، من غير إضافة تفسير يوحي بأن يسوع ينفي ألوهيته أو يصرح بها في هذه الجملة.
  alternative: صياغة تحسم العبارة إما بوصفها نفيًا لألوهية يسوع وإما بوصفها إعلانًا صريحًا لها.
  rationale: النص يتحدى استعمال الرجل لوصف «صالح»، لكنه يترك وجه الاستدلال اللاهوتي مفتوحًا؛ لذلك تُحفظ حدة السؤال والتوتر اللاهوتي من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «صالح» للمحافظة على التكرار، و«تدعوني» بوصفها الصياغة الطبيعية لمعنى إطلاق الوصف. وُضع مؤشر الحاشية بعد الاقتباس كله.
