  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: ar
  text: فما جمعه الله، لا يَفصِلْه إنسانٌ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ
  choice: ما
  rationale: اسم موصول لغير العاقل يعود بصورة جامعة إلى اتحاد الزواج المذكور قبله، و«ما» تحافظ على هذا المعنى من غير تحويله إلى مرجع شخصي.
- source_word: οὖν
  choice: فـ
  rationale: الفاء الاستنتاجية تنقل بصورة طبيعية نتيجة الحجة السابقة بشأن قصد الله للزواج، وتؤدي هنا معنى «إذًا/لذلك» من غير إثقال الأسلوب.
- source_word: ὁ θεὸς
  choice: الله
  rationale: ترجمة مباشرة للفاعل المعرّف، وهي الصياغة العربية الطبيعية في هذا السياق.
- source_word: συνέζευξεν
  choice: جمع
  rationale: يفيد الفعل اليوناني ضمَّ اثنين معًا أو قرنهما. و«جمع» طبيعي في سياق الزواج ويحفظ فعل الله في إنشاء هذا الاتحاد، من غير إبراز صورة النير أكثر مما يقتضيه السياق.
- source_word: ἄνθρωπος
  choice: إنسانٌ
  rationale: المفرد اليوناني نكرة ومستعمل استعمالًا عامًا؛ و«إنسان» يحفظ صيغة المفرد ويبيّن أن النهي يشمل أي بشر، لا الرجال وحدهم.
- source_word: μὴ χωριζέτω
  choice: لا يَفصِلْه
  rationale: مضارع أمر منفي يفيد النهي. صيغته العربية مع «لا» الناهية تنقل قوة الأمر، والضمير يعيد بوضوح إلى ما جمعه الله.
theological_decisions:
- issue: الدلالة العامة لكلمة ἄνθρωπος في قول عن الزواج
  choice: إنسانٌ
  alternative: رجلٌ
  rationale: الكلمة اليونانية مفردة وتدل هنا على أي فرد من البشر. «إنسان» يحفظ الإفراد والدلالة البشرية العامة، ويتجنب أن يُفهم النهي خطأً على أنه موجّه إلى الذكور وحدهم.
- issue: طبيعة الفعل الإلهي في συνέζευξεν
  choice: جمع
  alternative: قرن معًا / جمع بنير واحد
  rationale: يحافظ «جمع» على أن الله هو الذي أنشأ الاتحاد الزوجي، من غير أن يفرض على النص تفاصيل لاهوتية إضافية أو يبالغ في إبراز استعارة النير.
translation_notes:
  register: 'عربية فصحى معاصرة واضحة وموجزة ذات نبرة كريمة. استُعملت الفاء لنقل الاستنتاج، وقدّم المفعول الموصول موافقةً لبنية النص اليوناني وتركيزه: ما جمعه الله هو الذي لا يجوز لأي إنسان أن يفصله.'
