  source_fidelity: 'الترجمة تنقل عناصر اليونانية كلها بأمانة: «فـ» للاستنتاج في οὖν، و«ما» للموصول المحايد ὃ، و«جمعه الله» للفعل συνέζευξεν، و«إنسان» للاستعمال البشري العام في ἄνθρωπος، و«لا يَفصِلْه» للنهي μὴ χωριζέτω. كما تحافظ على ترتيب يبرز «ما جمعه الله».'
  naturalness: 'الصياغة فصيحة معاصرة وموجزة وطبيعية: «فما جمعه الله، لا يَفصِلْه إنسانٌ». وهي مناسبة لسياق قول تعليمي ذي نبرة تقريرية.'
