  text: And he said to them, “What do you want me to do for you?”
translation:
  language: ar
  text: 'فقال لهما: «ماذا تريدان أن أفعل لكما؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: فقال
  rationale: التركيب اصطلاحي لمواصلة السرد مع فاعل مفهوم من السياق؛ وتؤدي الفاء الانتقال الطبيعي إلى كلام يسوع من غير تشديد غير لازم على المقابلة.
- source_word: εἶπεν
  choice: قال
  rationale: نُقل فعل القول بمقابله المباشر، فيما تدل صيغة الجملة نفسها على أن الكلام سؤال.
- source_word: αὐτοῖς
  choice: لهما
  rationale: الضمير اليوناني بصيغة الجمع، لكن العربية تميز المثنى، والسياق المباشر يحدد المخاطبين بأنهما يعقوب ويوحنا.
- source_word: Τί
  choice: ماذا
  rationale: أداة استفهام طبيعية واضحة للسؤال عن الفعل المطلوب.
- source_word: θέλετε
  choice: تريدان
  rationale: تعبر عن الرغبة بصياغة عربية معاصرة، وجاءت بصيغة المثنى وفق المخاطبين في السياق.
- source_word: ποιήσω
  choice: أن أفعل
  rationale: صيغة المضارع المنصوب بعد «أن» تنقل على نحو طبيعي الفعل المرغوب من المتكلم، و«أفعل» أنسب من «أصنع» هنا.
- source_word: ὑμῖν
  choice: لكما
  rationale: 'اللام تنقل دلالة المنفعة: الفعل المطلوب أن يُجرى من أجلهما، وصيغة المثنى يقتضيها السياق العربي.'
