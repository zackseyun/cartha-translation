base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: ar
  text: 'فبدأ بطرس يقول له: «ها نحن قد تركنا كلَّ شيء وتبعناك».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انظر، نحن قد تركنا كلَّ شيء وتبعناك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: فبدأ ... يقول
  rationale: 'ينقل تركيب الفعل مع المصدر بمعناه الاصطلاحي: الشروع في القول، بصياغة عربية طبيعية تحافظ على بداية كلام بطرس.'
- source_word: ὁ Πέτρος
  choice: بطرس
  rationale: النقل العربي المعياري للاسم الشخصي.
- source_word: αὐτῷ
  choice: له
  rationale: يحافظ على الضمير الوارد في اليونانية، ومرجعه يسوع واضح من السياق.
- source_word: Ἰδοὺ ἡμεῖς
  choice: ها نحن
  rationale: «ها» أداة تنبيه طبيعية في العربية، واقترانها بالضمير المنفصل يحفظ إبراز «نحن» في الأصل.
- source_word: ἀφήκαμεν πάντα
  choice: قد تركنا كلَّ شيء
  rationale: «تركنا» لا يبالغ في معنى الفعل، و«قد» تبرز وقوع الفعل وصلته بالحال الراهن، و«كل شيء» تنقل الشمول.
- source_word: ἠκολουθήκαμέν σοι
  choice: وتبعناك
  rationale: صيغة عربية موجزة وطبيعية تنقل اتباع المخاطَب، مع بقاء دلالة الفعل التام على فعل ذي أثر مستمر مفهومة من السياق.
theological_decisions:
- issue: ادعاء بطرس بشأن التضحية في التلمذة
  choice: نقل كلامه مباشرة كما قاله، من غير تصديق سردي له أو تخفيفه
  alternative: إضافة تفسير مثل «تخلّينا عن كل ما لنا»، أو إعادة الصياغة بما يستبق جواب يسوع
  rationale: الآية تسجل قول بطرس المؤكد، ولا تقدم في ذاتها حكم الراوي عليه؛ لذلك تُحفظ المسافة والتوتر اللاهوتي من غير تعليق تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. اختيرت «ها نحن» لأنها تؤدي وظيفة Ἰδοὺ التنبيهية وتحفظ توكيد الضمير، مع تجنب «هوذا» الأشد تقليدية. وُضع مؤشر الحاشية بعد الاقتباس لأنها تعرض بديلاً لعبارة الاستهلال.
