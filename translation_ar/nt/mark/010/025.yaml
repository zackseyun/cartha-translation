  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: ar
  text: مرور جمل من ثقب إبرة أيسر من دخول غنيّ إلى ملكوت الله.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اقترح بعضهم قراءة «حبل» بدل «جمل»، لكن النص اليوناني هنا يقرأ «جمل».
    reason: alternative_reading
  - marker: b
    text: جاءت كلمة «غنيّ» في اليونانية بصيغة المفرد المذكر، وللمقولة دلالة تمثيلية عامة.
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: أيسر
  rationale: صيغة تفضيل تفيد أن الأمر أسهل؛ و«أيسر» عربية طبيعية موجزة تحفظ المقارنة الحادة.
- source_word: κάμηλον
  choice: جمل
  rationale: النص اليوناني يقرأ κάμηλος، أي «جمل»، فتحافظ الترجمة على الصورة المبالغية الصادمة دون استبدالها بـ«حبل».
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: من ثقب إبرة
  rationale: العبارة تشير إلى فتحة إبرة الخياطة؛ و«ثقب إبرة» تعبير عربي واضح ودقيق.
- source_word: διελθεῖν
  choice: مرور
  rationale: مصدر عربي طبيعي يؤدي معنى «أن يمر عبر» ويلائم صورة الجمل والثقب.
- source_word: πλούσιον
  choice: غنيّ
  rationale: الصفة اليونانية مفرد مذكر مستعملة استعمال الاسم؛ و«غنيّ» تحفظ الصيغة ويمكن أن تكون ذات دلالة تمثيلية.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: إلى ملكوت الله
  rationale: «ملكوت الله» مقابل راسخ ودقيق للعبارة الإنجيلية المركزية، وحرف الجر «إلى» يتصل طبيعيًا بـ«دخول».
- source_word: εἰσελθεῖν
  choice: دخول
  rationale: المصدر «دخول» موجز وطبيعي ويؤدي معنى الفعل اليوناني «يدخل».
theological_decisions:
- issue: تفسير صورة الجمل وثقب الإبرة
  choice: 'الإبقاء على الصورة الحرفية المبالغية: جمل وثقب إبرة'
  alternative: اعتبار «ثقب الإبرة» اسمًا لباب صغير مزعوم، أو قراءة «حبل» بدل «جمل»
  rationale: النص اليوناني نفسه يقدم صورة صارخة لما يتعذر وقوعه؛ فلا ينبغي للترجمة أن تلطفها أو تُدخل تقاليد تفسيرية لاحقة لا يسندها اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كتابية وقورة. حُفظ ترتيب المقارنة وقوة الصورة، واستُعمل «ملكوت الله» اتساقًا مع المصطلح الإنجيلي الشائع.
