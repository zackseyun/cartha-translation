lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف يربط هذه الحالة بالحالة الموازية في الآية السابقة.
- source_word: ἐὰν
  choice: إن
  rationale: تُدخل جملة شرطية، وهي صياغة عربية فصيحة وطبيعية في هذا القول.
- source_word: αὐτὴ
  choice: هي
  rationale: إثبات الضمير المنفصل يحفظ شيئًا من توكيد الضمير المؤنث الصريح في اليونانية، مع بقاء العبارة طبيعية.
- source_word: ἀπολύσασα
  choice: طلَّقت
  rationale: الفعل يعني حرفيًا الإطلاق أو الصرف، لكنه في السياق الزوجي يدل على الطلاق.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: زوجها
  rationale: لفظة ἀνήρ قد تعني رجلًا أو زوجًا، والسياق الزوجي يعيّن معنى «زوج».
- source_word: γαμήσῃ ἄλλον
  choice: تزوَّجت رجلًا آخر
  rationale: لفظة ἄλλον مذكرة، وإظهار «رجلًا» يحفظ التحديد الجنسي الوارد في النص.
- source_word: μοιχᾶται
  choice: فإنها تزني
  rationale: صياغة عربية مباشرة وطبيعية للمضارع اليوناني، وتحافظ على قوة الحكم الأخلاقي دون تحويله إلى اسم وصفي.
theological_decisions:
- issue: الحفاظ على الصياغة المحددة بحسب الجنس
  choice: «إن طلَّقت هي زوجها وتزوَّجت رجلًا آخر»
  alternative: «إن طلَّقت الزوجة زوجها وتزوَّجت آخر»
  rationale: النص اليوناني يذكر فاعلًا مؤنثًا ومفعولًا مذكرًا بوضوح، وهذه الصياغة تحفظ ذلك وتحافظ على الموازاة المقصودة مع الآية السابقة.
- issue: ترجمة ἀπολύω بوصفه مصطلحًا زوجيًا
  choice: «طلَّقت»
  alternative: «صرفت» أو «أطلقت»
  rationale: السياق يتناول إنهاء رابطة الزواج، ولذلك ينقل «طلَّقت» المعنى المقصود بوضوح من غير توسع تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «طلَّقت» للدلالة القانونية الزوجية، وأُثبت الضمير «هي» للمحافظة على توكيد الأصل اليوناني، مع وضع علامة الحاشية [a] في المتن.
