lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: أداة ربط تحفظ تتابع السرد من غير إضافة دلالة زمنية ليست صريحة في اليونانية.
- source_word: ἀκούσαντες
  choice: لما سمع ... ذلك
  rationale: اسم الفاعل الماضي يدل على فعل سابق للفعل الرئيس؛ وصيغته جملة زمنية طبيعية في العربية، مع إضمار المشار إليه الذي يوضحه السياق.
- source_word: οἱ δέκα
  choice: العشرة
  rationale: يحافظ على التعبير اليوناني الحرفي؛ والسياق وحده يبين أنهم التلاميذ العشرة الآخرون.
- source_word: ἤρξαντο
  choice: بدأوا
  rationale: ينقل بوضوح معنى الشروع في رد الفعل.
- source_word: ἀγανακτεῖν
  choice: يستاؤون
  rationale: يفيد الاستياء الشديد والاعتراض، من غير حصر المعنى في مجرد الغضب.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: من يعقوب ويوحنا
  rationale: تعبير عربي طبيعي يجعل يعقوب ويوحنا متعلَّق الاستياء، مع إبقاء احتمال أن تكون العبارة دالة على سببه في الحاشية.
- source_word: Ἰακώβου
  choice: يعقوب
  rationale: الصيغة العربية المألوفة للاسم Ἰάκωβος.
- source_word: Ἰωάννου
  choice: يوحنا
  rationale: الصيغة العربية المألوفة للاسم Ἰωάννης.
