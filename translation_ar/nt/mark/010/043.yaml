  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: ar
  text: لَكِنَّ الأَمْرَ لَيْسَ هَكَذَا بَيْنَكُمْ[a]، بَلْ مَنْ يُرِيدُ أَنْ يَصِيرَ عَظِيمًا بَيْنَكُمْ فَسَيَكُونُ خَادِمًا لَكُمْ[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكن الأمر ليس على هذا النحو بينكم».'
    reason: lexical_alternative
  - marker: b
    text: 'قد تحمل صيغة المستقبل «فَسَيَكُونُ» في هذا السياق معنى الإلزام أيضًا: «فَيَجِبُ أَنْ يَكُونَ خَادِمًا لَكُمْ».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: أَمَّا بَيْنَكُمْ فَلَا يَكُونُ الأَمْرُ هَكَذَا
  rationale: صياغة عربية طبيعية تبرز المقابلة مع نمط تسلّط حكام الأمم في السياق، وتحفظ معنى نفي الكيفية في οὐχ οὕτως دون زيادة تفسيرية.
- source_word: ἀλλ’
  choice: بَلْ
  rationale: تنقل أداة الاستدراك القوية التي تستبدل بالنمط السابق نمطًا مغايرًا.
- source_word: ὃς ἂν θέλῃ
  choice: مَنْ أَرَادَ
  rationale: تنقل الشرط العام غير المحدد وإرادة الشخص بلغة عربية واضحة وموجزة.
- source_word: μέγας γενέσθαι
  choice: أَنْ يَصِيرَ عَظِيمًا
  rationale: يحفظ «يصير» الدلالة التحولية للفعل γενέσθαι، وتحفظ «عظيمًا» لغة المكانة في μέγας.
- source_word: ἐν ὑμῖν
  choice: بَيْنَكُمْ
  rationale: تؤدي المعنى الجماعي والاجتماعي للعبارة، مع الحفاظ على تكرارها في الآية.
- source_word: ἔσται ὑμῶν διάκονος
  choice: فَسَيَكُونُ خَادِمًا لَكُمْ
  rationale: تحفظ صيغة المستقبل في ἔσται، وتترجم διάκονος بوصفه من يخدم لا بوصفه صاحب منصب كنسي؛ كما أن «لكم» تنقل علاقة الخدمة التي تعبّر عنها صيغة المضاف إليه اليونانية.
theological_decisions:
- issue: قوة صيغة المستقبل ἔσται في تعليم يسوع
  choice: فَسَيَكُونُ خَادِمًا لَكُمْ
  alternative: فَلْيَكُنْ خَادِمًا لَكُمْ / فَيَجِبُ أَنْ يَكُونَ خَادِمًا لَكُمْ
  rationale: للمستقبل هنا قوة معيارية أو تعليمية محتملة، لكن إبقاء صيغة المستقبل يصون شكل اليونانية ولا يحوّلها صراحةً إلى أمر مباشر؛ وتوضح الحاشية الاحتمال السياقي.
- issue: دلالة διάκονος
  choice: خَادِمًا
  alternative: شَمَّاسًا
  rationale: السياق يتحدث عن الخدمة المتواضعة داخل الجماعة، لا عن رتبة كنسية محددة؛ لذلك تتجنب «خادم» إسقاط تطور اصطلاحي لاحق على النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أَمَّا... فـ» لإظهار المقابلة طبيعيًا، و«خادم» بدل المصطلح الكنسي «شمّاس». أُبقيت الفاصلة الختامية لأن الآية تتصل نحويًا بما يليها.
