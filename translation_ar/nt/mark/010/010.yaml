  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: ar
  text: وحين دخلوا البيت، عاد التلاميذ يسألونه عن هذا الأمر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولما عادوا إلى البيت، كان التلاميذ يسألونه عن هذا الأمر». يمكن أن تتعلّق «مرة أخرى» في الأصل اليوناني بالعودة إلى البيت، لا بالسؤال.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: أداة ربط تواصل السرد من غير إضافة دلالة زمنية أقوى من اليونانية.
- source_word: εἰς τὴν οἰκίαν
  choice: حين دخلوا البيت
  rationale: تفيد العبارة حرفيًا الاتجاه إلى داخل البيت، ويعبّر هذا التركيب العربي الطبيعي عن الانتقال إلى المكان الخاص؛ وفُهم فاعل الدخول من سياق التلاميذ.
- source_word: πάλιν
  choice: عاد ... يسألونه
  rationale: ينقل معنى «مرة أخرى» بصورة عربية طبيعية، مع إبقاء احتمال تعلّق الظرف بالدخول في الحاشية.
- source_word: οἱ μαθηταὶ
  choice: التلاميذ
  rationale: يشير التعريف إلى جماعة التلاميذ المعروفة في السياق، من غير حاجة إلى إضافة «تلاميذه».
- source_word: περὶ τούτου
  choice: عن هذا الأمر
  rationale: صياغة عربية واضحة تشير إلى الموضوع المذكور في السياق السابق.
- source_word: ἐπηρώτων
  choice: يسألونه
  rationale: صيغة المضارع بعد «عاد» تعبّر طبيعيًا عن الفعل المتكرر أو الممتد الذي تدل عليه صيغة الماضي الناقص اليونانية، من غير فرض معنى البدء.
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير المفعول يعود إلى يسوع كما يقتضي السياق.
