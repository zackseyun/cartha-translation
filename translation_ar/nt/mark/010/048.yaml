  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: ar
  text: 'وكان كثيرون ينتهرونه ليسكت، لكنه كان يصرخ أكثر فأكثر: «يا ابن داود[a]، ارحمني!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ابن داود» لقب ملكي مسياني؛ ويمكن التعبير عن معناه تفسيريًا بلفظ «المسيح»، لكن الصياغة اليونانية حُفظت هنا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: كان كثيرون ينتهرونه
  rationale: الفعل في صيغة الماضي الناقص يدل على فعل متواصل أو متكرر، و«ينتهرونه» يحفظ قوة التوبيخ الموجَّه إليه بقصد إسكاته.
- source_word: πολλοὶ
  choice: كثيرون
  rationale: الصفة مستعملة استعمال الاسم، وهذه ترجمة مباشرة لا تضيف إلى اليونانية لفظ «الجموع» أو غيره.
- source_word: ἵνα σιωπήσῃ
  choice: ليسكت
  rationale: تحفظ لام التعليل معنى الغرض المقصود من انتهارهم له، بصياغة عربية موجزة وطبيعية.
- source_word: πολλῷ μᾶλλον
  choice: أكثر فأكثر
  rationale: تنقل العبارة المقارنة وتفيد ازدياد إصراره، من غير إضافة أن صوته صار أعلى، وهو ما لا تصرح به اليونانية.
- source_word: ἔκραζεν
  choice: أخذ يصرخ
  rationale: ينقل شدة κράζω، كما توحي الصياغة باستمرار الفعل الذي تدل عليه صيغة الماضي الناقص.
- source_word: Υἱὲ Δαυίδ
  choice: يا ابن داود
  rationale: تُحفظ صيغة اللقب نفسها ونداؤه المباشر، بما فيها من دلالة ملكية مسيانية، بدل استبدال تفسير بها.
- source_word: ἐλέησόν με
  choice: ارحمني
  rationale: صيغة دعاء عربية طبيعية ومباشرة تنقل فعل الأمر الالتماسي ومعنى طلب الرحمة.
theological_decisions:
- issue: الدلالة المسيانية للقب «ابن داود»
  choice: إبقاء اللقب «ابن داود» كما ورد
  alternative: يا مسيح، ارحمني
  rationale: النص اليوناني يستعمل اللقب Υἱὲ Δαυίδ صراحة. وترجمة ألفاظه تحفظ صورته ودلالته الملكية المسيانية من غير أن تستبدل به تفسيرًا يحسم المعنى.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «انتهر» لقوة الفعل، و«أخذ يصرخ» لإظهار الاستمرار، مع تجنب إضافة معنى ارتفاع الصوت غير المصرح به في الأصل.
