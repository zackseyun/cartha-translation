  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: ar
  text: 'فدعاهم إليه، وكان يكلّمهم بأمثال: «كيف يقدر الشيطان أن يطرد الشيطان؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: فدعاهم إليه
  rationale: ينقل اسم الفاعل الأوريستي المتوسط بمعنى استدعائهم إلى حضرته قبل مخاطبتهم، مع صياغة عربية طبيعية وربط سياقي بالفاء.
- source_word: ἐν παραβολαῖς
  choice: بأمثال
  rationale: يحفظ الجمع ويدل على الكلام القائم على التشبيه والتمثيل، من غير تقييد الشكل الأدبي بأكثر مما يفيده الأصل.
- source_word: ἔλεγεν
  choice: وأخذ يكلمهم
  rationale: يعبر طبيعيًا عن الجانب الاستمراري للفعل الناقص، ويبين أن ما يلي افتتاح لكلام ممتد.
- source_word: Πῶς δύναται
  choice: كيف يقدر
  rationale: يحفظ سؤال الإمكان البلاغي بصياغة عربية واضحة ومباشرة.
- source_word: Σατανᾶς
  choice: الشيطان
  rationale: يستعمل الاسم العربي الكتابي الراسخ مع أداة التعريف، في موضعي الفاعل والمفعول به.
- source_word: ἐκβάλλειν
  choice: أن يطرد
  rationale: ينقل فعل الإخراج القسري الملائم لسياق طرد الشياطين بلغة عربية حديثة واضحة.
theological_decisions:
- issue: قوة سؤال يسوع عن عمل الشيطان ضد نفسه
  choice: كيف يقدر الشيطان أن يطرد الشيطان؟
  alternative: كيف يستطيع الشيطان أن يطرد الشيطان؟
  rationale: أُبقي السؤال البلاغي المتعلق بالإمكان كما هو، ليكشف التناقض في الاتهام من غير إضافة تفسير عقائدي إلى النص.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدم «أخذ يكلمهم» لنقل الاستمرار في ἔλεγεν، و«بأمثال» بوصفها الصياغة العربية الطبيعية للجمع ἐν παραβολαῖς.
