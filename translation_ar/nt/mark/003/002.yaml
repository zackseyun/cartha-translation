base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: ar
  text: وكانوا يراقبون يسوع عن كثب ليروا هل سيشفي الرجل يوم السبت[a]، لكي يتهموه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «في السبوت». ترد الكلمة اليونانية بصيغة الجمع، ويمكن أن تُستعمل اصطلاحيًا للدلالة على يوم السبت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: كانوا يراقبونه عن كثب
  rationale: صيغة الماضي الناقص تدل على مراقبة مستمرة، والفعل في السياق يوحي بترصّد دقيق ذي غرض عدائي.
- source_word: εἰ
  choice: ليروا هل
  rationale: بعد فعل المراقبة، تؤدي هذه الصياغة العربية معنى السؤال غير المباشر بصورة طبيعية.
- source_word: τοῖς σάββασιν
  choice: في السبت
  rationale: اللفظ اليوناني بصيغة الجمع، لكن جمع «السبوت» يُستعمل اصطلاحيًا للدلالة على يوم السبت؛ والمفرد هو التعبير العربي الطبيعي هنا، مع بيان الصيغة في الحاشية.
- source_word: θεραπεύσει
  choice: يشفيه
  rationale: المضارع العربي بعد «هل» ينقل بصورة طبيعية دلالة المستقبل اليوناني ضمن السؤال غير المباشر، و«شفى» هو المعنى الملائم في السياق.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ أداة الغاية بوضوح، وتبين أن قصد المراقبة كان العثور على أساس للاتهام.
- source_word: κατηγορήσωσιν αὐτοῦ
  choice: يتهموه
  rationale: تنقل المعنى المباشر من غير أن تضيف إجراءً قضائيًا رسميًا لا يصرح به النص.
theological_decisions:
- issue: قصد المراقبين
  choice: يصور النص مراقبة عدائية غايتها اتهام يسوع
  alternative: «لكي يقيموا عليه دعوى» أو «لكي يحاكموه»
  rationale: قد يحمل الفعل مسحة قضائية، لكن الآية لا تحدد محاكمة أو ملاحقة رسمية؛ لذلك يحفظ «يتهموه» حدود النص وتوتره.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «عن كثب» لإظهار شدة الترصّد، و«في السبت» بوصفه التعبير العربي الطبيعي مع حفظ صيغة الأصل في الحاشية.
