lexical_decisions:
- source_word: ἐποίησεν
  choice: أقام
  rationale: الفعل يعني حرفيًا «صنع»، لكنه هنا يدل على إنشاء جماعة من الاثني عشر وتعيينهم؛ و«أقام» تعبير عربي موجز وطبيعي يحمل معنى التعيين من غير إيحاء بالخلق.
- source_word: δώδεκα
  choice: اثني عشر
  rationale: يحافظ على حذف الاسم في اليونانية، وهو حذف مفهوم وطبيعي بالعربية في هذا السياق، من غير إضافة أداة تعريف لا يقتضيها النص.
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: ليكونوا معه
  rationale: تنقل لام التعليل غرض إقامتهم بوضوح وإيجاز، وتحفظ كون المصاحبة مقصدًا أساسيًا.
- source_word: ἀποστέλλῃ
  choice: ليرسلهم
  rationale: تنقل المعنى المباشر للفعل، بما فيه دلالة الإرسال لمهمة، من غير إدخال لقب «رسل» غير الوارد في نص SBLGNT هنا.
- source_word: κηρύσσειν
  choice: ليكرزوا
  rationale: «يكرزوا» تعبير عربي كتابي معروف للدلالة على المناداة العلنية بالرسالة، مع إثبات البديل الأوضح لغويًا «ينادوا» في الحاشية.
theological_decisions:
- issue: إدخال لقب «الرسل» الضمني في المتن
  choice: عدم إضافة لقب «الرسل» إلى المتن
  alternative: «الذين سمّاهم أيضًا رسلًا»
  rationale: النص المعتمد في SBLGNT يقول فقط إنه أقام اثني عشر، أما العبارة الأطول فقراءة مخطوطية جديرة بالإثبات في الحاشية لا في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «أقام» للتعيين و«يكرزوا» للإعلان العلني، مع شرح البديل الأقل اصطلاحية في الحاشية. وُضعت علامتا الحاشيتين [a] و[b] في المتن.
