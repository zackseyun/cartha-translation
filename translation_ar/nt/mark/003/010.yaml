base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: ar
  text: لِأَنَّهُ شَفَى كَثِيرِينَ، حَتَّى إِنَّ كُلَّ مَنْ كَانَ بِهِ بَلَاءٌ كَانَ يَنْدَفِعُ إِلَيْهِ[a] لِيَلْمَسَهُ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان يقع عليه» أو «كان يهجم عليه»؛ فاللفظ اليوناني قويّ، ويصوّر اندفاع الناس عليه في الزحام.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «علّة» أو «آفة» أو «مرض»؛ واللفظ اليوناني يعني حرفيًا «سياطًا»، ويُستعمل هنا مجازًا للآلام أو العلل الشديدة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: كَثِيرِينَ
  rationale: مفعول به جمع يدل ضمنًا على كثير من الناس، ولا حاجة إلى إضافة «أناس» في العربية.
- source_word: γὰρ
  choice: لِأَنَّهُ
  rationale: تؤدي وظيفة التعليل التي تربط سلوك الجمع بما سبق من أعمال الشفاء.
- source_word: ἐθεράπευσεν
  choice: شَفَى
  rationale: الفعل الماضي العربي يعبّر طبيعيًا عن عمل الشفاء السابق الذي يفسر اندفاع الناس، من غير حاجة إلى تركيب ماضٍ بعيد ثقيل.
- source_word: ὥστε
  choice: حَتَّى إِنَّ
  rationale: تدخل نتيجة شفاء الكثيرين بصياغة عربية واضحة وطبيعية.
- source_word: ἐπιπίπτειν αὐτῷ
  choice: كَانَ يَتَدَافَعُ نَحْوَهُ
  rationale: يحفظ قوة الحركة الجسدية في ἐπιπίπτω ضمن مشهد ازدحام، من غير الحرفية المضللة «يقع عليه».
- source_word: ἵνα
  choice: لِـ
  rationale: لام التعليل تؤدي معنى الغرض بإيجاز طبيعي.
- source_word: αὐτοῦ ἅψωνται
  choice: يَلْمِسَهُ
  rationale: ἅπτομαι مع المضاف إليه هنا يعني اللمس الجسدي في سياق طلب الشفاء.
- source_word: ὅσοι
  choice: كُلَّ مَنْ
  rationale: تنقل القوة الشاملة للموصول اليوناني بصورة عربية مألوفة.
- source_word: εἶχον μάστιγας
  choice: كَانَ بِهِ بَلَاءٌ
  rationale: «بلاء» يحفظ شدة μάστιξ واتساعها بوصفها آفة أو معاناة مؤلمة، من غير حصرها في تشخيص طبي ولا ترجمتها حرفيًا إلى «سياط».
theological_decisions:
- issue: طبيعة μάστιγας في سياق الشفاء
  choice: بَلَاءٌ
  alternative: أمراض؛ آفات؛ أوجاع؛ سياط
  rationale: اللفظة اليونانية تعني حرفيًا السياط وتستعمل مجازًا للآفات والمعاناة الشديدة. «بلاء» يحفظ سعة المعنى وحدته دون تضييقه على المرض وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدم «يتدافع نحوه» لإبراز ضغط الجمع، و«بلاء» للمحافظة على الصورة القوية الواسعة في الأصل.
