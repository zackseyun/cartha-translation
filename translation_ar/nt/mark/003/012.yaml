- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: يُظهروه
  rationale: ترجمة طبيعية للتركيب بمعنى جعله ظاهرًا أو معروفًا علنًا، وتحافظ على إيجازه من دون إضافة تحديد لهويته.
theological_decisions:
- issue: طبيعة أمر يسوع للأرواح النجسة
  choice: صياغة النهي على أنه منع من إظهاره، من غير تحديد ما الذي كانت ستعلنه عنه.
  alternative: التصريح بأنه منعها من كشف هويته بوصفه ابن الله، أو فهمه إسكاتًا عامًا فقط.
  rationale: السياق السابق يوحي بكشف هويته، لكن نص هذه الآية لا يزيد على القول بألا يجعلوه ظاهرًا؛ لذلك لا تُضاف عبارة مسيحية لاهوتية غير مذكورة هنا.
