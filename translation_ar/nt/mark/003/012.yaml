  rationale: تؤدي القوة الظرفية لصيغة الجمع المحايد، فتدل هنا على تكرار الانتهار، بعبارة عربية طبيعية موجزة.
- source_word: ἐπετίμα
  choice: ينتهرهم بشدة
  rationale: يحفظ الفعل معنى الزجر الآمر القوي الملائم لمخاطبة الأرواح النجسة، من غير حصره في مجرد التحذير.
- source_word: αὐτοῖς
  choice: هم
