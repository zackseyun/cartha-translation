  terminology: «الشيطان» هو المقابل العربي الكتابي المألوف للاسم Σατανᾶς. و«ثار على نفسه»، و«انقسم»، و«لا يقدر أن يثبت» ملائمة للسياق وللألفاظ اليونانية. لا يلزم تغيير في المصطلحات الأخرى.
