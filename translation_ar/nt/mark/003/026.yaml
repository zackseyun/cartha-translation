  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: ar
  text: وَإِنْ كَانَ الشَّيْطَانُ قَدْ ثَارَ عَلَى نَفْسِهِ وَانْقَسَمَ، فَلَا يَقْدِرُ أَنْ يَثْبُتَ، بَلْ قَدْ بَلَغَ نِهَايَتَهُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، حرفيًّا: «بل له نهاية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σατανᾶς
  choice: الشَّيْطَان
  rationale: المقابل العربي الكتابي المعياري للاسم الشخصي Σατανᾶς، وهو أوضح للقارئ العربي من النقحرة الصوتية.
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: ثَارَ عَلَى نَفْسِهِ
  rationale: ينقل معنى النهوض في معارضة عدائية، مع صياغة عربية طبيعية تحافظ على توجيه الفعل ضد الذات.
- source_word: ἐμερίσθη
  choice: انْقَسَمَ
  rationale: يفيد وقوع الانقسام الداخلي، والمبني للمطاوع في العربية يؤدي معنى المبني للمجهول اليوناني بصورة طبيعية من غير تعيين فاعل.
- source_word: οὐ δύναται στῆναι
  choice: فَلَا يَقْدِرُ أَنْ يَثْبُتَ
  rationale: يحفظ صورة الوقوف بمعنى البقاء والصمود، بصياغة عربية واضحة تناسب الحجة السياقية.
- source_word: ἀλλὰ τέλος ἔχει
  choice: بَلْ لَهُ نِهَايَةٌ
  rationale: ترجمة قريبة من البنية الحرفية «له نهاية»، وتحفظ الإيجاز والالتباس المتعلق بتوقيت النهاية بدل أن تحسمه بعبارة زمنية مثل «قد انتهى».
theological_decisions:
- issue: طبيعة القول عن نهاية الشيطان
  choice: بَلْ لَهُ نِهَايَةٌ
  alternative: بل قد انتهى؛ بل هو آخذ في الانتهاء
  rationale: تُبقي العبارة نتيجة منطقية ضمن حجة يسوع عن استحالة بقاء سلطان منقسم، ولا توسعها إلى تقرير مفصل عن الهزيمة الأخروية النهائية أو تحسم توقيتها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «ثار على نفسه» لإظهار معنى المعارضة، و«يثبت» للمحافظة على صورة الصمود، مع إبقاء الخاتمة قريبة من اليونانية وغير حاسمة زمنيًّا.
