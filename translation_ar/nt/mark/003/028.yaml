  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: ar
  text: 'الحق أقول لكم: ستُغفَر لبني البشر الخطايا كلُّها، وكلُّ ما يصدر عنهم من تجديف؛'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν
  choice: الحق
  rationale: في صيغة يسوع التأكيدية «Ἀμὴν λέγω ὑμῖν»، تؤدي «الحق أقول لكم» معنى التوكيد المهيب بلغة عربية كتابية واضحة، من غير الاكتفاء بالنقل الصوتي «آمين».
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية تحفظ صيغة المتكلم والخطاب للجمع.
- source_word: πάντα
  choice: كلُّها
  rationale: جاءت توكيدًا شاملًا لـ«الخطايا»، وهي أول الاسمين اللذين يفسران الشمول، من غير توسيع المعنى إلى «كل الأشياء».
- source_word: ἀφεθήσεται
  choice: ستُغفَر
  rationale: المبني للمجهول في سياق الخطايا يدل على الغفران، وتحافظ الصيغة العربية على الزمن المستقبل والمبني للمجهول.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: لبني البشر
  rationale: تحفظ «بني» صورة البنوة في التعبير السامي، بينما توضح «البشر» أن المراد جنس الإنسان عمومًا، لا الذكور وحدهم.
- source_word: τὰ ἁμαρτήματα
  choice: الخطايا
  rationale: يدل الاسم الجمع هنا على أفعال الخطية، و«الخطايا» هو المقابل العربي المألوف والدقيق.
- source_word: αἱ βλασφημίαι
  choice: تجديف
  rationale: «التجديف» يحفظ القوة الدينية واللاهوتية للكلمة في سياق الكلام على الروح القدس، وتسمح الصياغة العربية المفردة المصدرية بالتعبير الطبيعي عن مجموع ضروب التجديف.
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: كلُّ ما يجدّفون به من تجديف
  rationale: تحفظ الصياغة عدم التحديد والشمول في ὅσα ἐάν، وتربط الفعل بما يصدر عنهم من تجديف بلغة عربية واضحة.
theological_decisions:
- issue: مدى إعلان الغفران بالنسبة إلى التحذير اللاحق من التجديف على الروح القدس
  choice: إبقاء هذه الآية إعلانًا واسعًا بأن الخطايا والتجاديف تُغفر، من غير إدخال استثناء الآية التالية في نصها.
  alternative: تضمين قيد أو استثناء ضمني في هذه الجملة نفسها.
  rationale: النص الحالي يقرر سعة الغفران، ثم تأتي الآية التالية بالتحذير؛ لذلك ينبغي الحفاظ على التوتر المقصود في السياق وعدم حسمه مبكرًا داخل هذه الآية.
- issue: الدلالة العامة للتعبير τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: «بني البشر» في المتن، مع حاشية توضح أن التعبير يشمل الناس جميعًا.
  alternative: «البشر» أو «الناس» فقط.
  rationale: تحفظ الصياغة صورة التعبير اليوناني ذي الخلفية السامية، وفي الوقت نفسه تمنع «البشر» فهمه على أنه خاص بالذكور.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. استُعملت صيغة «الحق أقول لكم» للمقدمة التأكيدية، وحُفظ التعبير السامي «بني البشر» مع إيضاح دلالته العامة في الحاشية.
