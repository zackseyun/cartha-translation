translation:
  language: ar
  text: أمّا مَن يُجَدِّف على الروح القدس، فلا غفران له إلى الأبد[a]، بل يكون مسؤولًا عن خطيئة أبدية[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «ليس له غفران إلى الدهر»، أي: لا غفران له أبدًا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بل يكون مذنبًا بخطيئة أبدية».'
    reason: lexical_alternative
  - marker: c
    text: 'تقرأ بعض المخطوطات: «دينونة أبدية» أو «حكم أبدي» بدلًا من «خطيئة أبدية».'
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: أمّا مَن
  rationale: تنقل «مَن» معنى جملة الصلة غير المحددة، وتفيد «أمّا» الانتقال التقابلي الذي تؤديه δέ في السياق.
- source_word: βλασφημήσῃ
  choice: يُجَدِّف
  rationale: يحفظ «يُجَدِّف» الثقل الديني للفعل، وتناسب صيغة المضارع العربية المعنى العام للشرط.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: على الروح القدس
  rationale: حرف الجر εἰς يحدد هنا الجهة التي يقع عليها التجديف؛ و«جدّف على» تعبير عربي واضح وشائع.
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: فلا غفران له إلى الأبد
  rationale: صياغة عربية طبيعية تحافظ على بنية نفي الغفران وعلى الدلالة الزمنية لعبارة «إلى الدهر»، دون حصرها في كلمة «أبدًا» وحدها.
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد «بل» الاستدراك القوي والانتقال من نفي الغفران إلى تقرير التبعة.
- source_word: ἔνοχός ἐστιν
  choice: هو مذنب
  rationale: ينقل معنى الذنب والمسؤولية في ἔνοχος بصورة مباشرة، مع التنبيه في الحاشية إلى إمكان معنى الاستحقاق أو التعرض للمساءلة.
- source_word: αἰωνίου ἁμαρτήματος
  choice: بخطيئة أبدية
  rationale: يتبع قراءة النص اليوناني المعطى ἁμαρτήματος، أي «خطيئة»، ويحفظ وصفها بأنها أبدية.
theological_decisions:
- issue: ماهية الإساءة التي لا غفران لها
  choice: الإبقاء على العبارة المباشرة «يُجَدِّف على الروح القدس» بلا تفسير مضاف
  alternative: تفسيرها في صلب النص بأنها رفض متعمد ومستمر لشهادة الروح، أو نسبة عمل الروح إلى الشيطان
  rationale: السياق يضيء المقصود، لكن الآية نفسها تسمي الفعل مباشرة؛ لذلك لا تُحسم دلالته العقائدية بإضافة تفسير إلى المتن.
- issue: الاختلاف النصي في خاتمة الآية
  choice: 'ترجمة قراءة SBLGNT: «خطيئة أبدية»'
  alternative: «دينونة أبدية» أو «حكم أبدي»
  rationale: المصدر المعطى يقرأ αἰωνίου ἁμαρτήματος، ولذلك يتبع المتن هذه القراءة، ويُذكر الاختلاف المخطوطي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أمّا مَن» لصياغة الشرط العام بسلاسة، و«فلا غفران له إلى الأبد» للمحافظة على قوة النفي والدلالة الزمنية. جميع علامات الحواشي [a] و[b] و[c] واردة في المتن.
