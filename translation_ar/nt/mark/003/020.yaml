  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: ar
  text: ويدخل بيتًا[a]، فيجتمع الحشد من جديد، حتى إنهم لا يستطيعون حتى أن يأكلوا خبزًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إلى البيت». تقول اليونانية حرفيًا «إلى بيت»، لكن العبارة قد تُستعمل اصطلاحيًا بمعنى الرجوع إلى البيت.
    reason: lexical_alternative
  - marker: b
    text: أي أن يتناولوا طعامًا؛ والتعبير اليوناني حرفيًا «يأكلوا خبزًا».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: يدخل
  rationale: المضارع السردي في مرقس حُفظ بصيغة المضارع، واختيار «يدخل» طبيعي مع εἰς ويؤدي معنى المجيء إلى داخل البيت من غير تثقيل العبارة.
- source_word: εἰς οἶκον
  choice: بيتًا
  rationale: الاسم في اليونانية نكرة ولا يتضمن ضمير ملكية، لذلك لا يُحدَّد البيت ولا يُنسب صراحةً إلى يسوع؛ وتُذكر الدلالة الاصطلاحية المحتملة في الحاشية.
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: فيجتمع الجمع من جديد
  rationale: «يجتمع» يؤدي المعنى اللازم للفعل مع الجمع فاعلًا، و«من جديد» تنقل معنى πάλιν بوضوح.
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: حتى إنهم لا يستطيعون
  rationale: تنقل العبارة نتيجة اجتماع الجمع، ويحافظ المضارع على نسق الأفعال السردية الحاضرة. الضمير الجمعي يبقى كما في المصدر من غير إضافة تفسيرية إلى المتن.
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: أن يأكلوا خبزًا
  rationale: يحفظ ذكر الخبز الصريح في اليونانية، مع بيان المعنى الاصطلاحي، أي تناول الطعام، في الحاشية.
