reference: Mark 3:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: ar
  text: وأندراوس، وفيلبس، وبرثولماوس، ومتى، وتوما، ويعقوب بن حلفى، وتداوس، وسمعان القانوي[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «القانوي» لقب يُرجَّح أن معناه «الغيور»، كما في لوقا 6:15، وليس المقصود على الأرجح أنه كنعاني الأصل.
    reason: توضيح بديل معجمي وتجنب فهم اللقب على أنه نسبة عرقية.
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حُفظ عطف الأسماء المتتابع في اليونانية، مع استعمال الفواصل وفق أسلوب العربية الحديثة لتيسير القراءة.
- source_word: Ἀνδρέαν
  choice: أندراوس
  rationale: الصيغة العربية الشائعة لهذا الاسم الكتابي.
- source_word: Φίλιππον
  choice: فيلبس
  rationale: الصيغة العربية الشائعة للاسم، وهي قريبة من لفظه اليوناني.
- source_word: Βαρθολομαῖον
  choice: برثولماوس
  rationale: نقلٌ للاسم وفق الصيغة العربية الكتابية المألوفة.
- source_word: Μαθθαῖον
  choice: متى
  rationale: استُعملت الصيغة العربية الراسخة للاسم بدل نقلٍ حرفي ثقيل.
- source_word: Θωμᾶν
  choice: توما
  rationale: الصيغة العربية الشائعة للاسم في نصوص العهد الجديد.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: يعقوب بن حلفى
  rationale: يفيد تركيب أداة التعريف مع المضاف إليه نسبة يعقوب إلى أبيه؛ و«بن» أوجز وأفصح في قائمة الأسماء.
- source_word: Θαδδαῖον
  choice: تداوس
  rationale: نقلٌ صوتي واضح للاسم اليوناني وفق الاستعمال العربي الشائع.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: سمعان القانوي
  rationale: تحافظ «القانوي» على اللقب الوارد في مرقس ولا تحوّله خطأً إلى نسبة عرقية كنعانية، بينما توضّح الحاشية معناه المرجح.
theological_decisions:
- issue: دلالة لقب Καναναῖος لسمعان
  choice: سمعان القانوي، مع شرح المعنى المرجح في الحاشية
  alternative: سمعان الغيور؛ أو سمعان الكنعاني
  rationale: اللفظ اليوناني في مرقس يعكس على الأرجح لقبًا ذا أصل آرامي بمعنى «الغيور»، كما يؤيد نظيره ζηλωτής في لوقا 6:15. أبقينا صيغة مرقس في المتن مع التوضيح، وتجنبنا «الكنعاني» لأنها قد توهم نسبة جغرافية أو عرقية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ إيقاع القائمة بالعطف، واستُعملت الصيغ العربية المألوفة للأسماء. نُقل موضع علامة الحاشية إلى لقب سمعان، لأن الحاشية تتعلق بكلمة Καναναῖος لا باسم أندراوس.
