  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: ar
  text: وصعد إلى الجبل، ودعا إلى جانبه الذين أرادهم هو نفسه، فذهبوا إليه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فأتوا إليه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβαίνει
  choice: صعد
  rationale: نُقل المضارع التاريخي اليوناني بصيغة الماضي الملائمة للسرد العربي، مع الحفاظ على معنى الصعود.
- source_word: εἰς τὸ ὄρος
  choice: إلى الجبل
  rationale: تؤدي العبارة مع فعل الصعود معنى الاتجاه إلى الجبل وصعوده، وهي صياغة عربية طبيعية لا تبالغ في تحديد الموضع.
- source_word: προσκαλεῖται
  choice: دعا إليه
  rationale: تحافظ الصيغة على معنى الاستدعاء إلى شخصه وعلى دلالة الصيغة الوسطى من غير تكلف.
- source_word: οὓς ἤθελεν αὐτός
  choice: الذين أرادهم هو نفسه
  rationale: تحفظ «هو نفسه» توكيد الضمير الصريح αὐτός، بينما تنقل «أرادهم» معنى θέλω بصورة طبيعية.
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: فذهبوا إليه
  rationale: تعكس «ذهبوا» فعل الحركة ἀπέρχομαι، وتؤدي «إليه» الاتجاه نحو يسوع؛ ويظل «فأتوا إليه» بديلًا ممكنًا بحسب منظور السرد.
theological_decisions:
- issue: توكيد مبادرة يسوع الشخصية في اختيار المدعوين
  choice: الذين أرادهم هو نفسه
  alternative: الذين أرادهم
  rationale: حُفظ توكيد αὐτός من غير تحويل العبارة إلى تقرير مذهبي أوسع عن الاختيار لا ينص عليه العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «دعا إليه» بدل تركيب أثقل مثل «استدعى لنفسه»، وحُفظ التوكيد اليوناني في «هو نفسه». وُضعت الحاشية بعد العبارة التي تخصها.
