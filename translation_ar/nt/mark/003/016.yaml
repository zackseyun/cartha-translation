  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: ar
  text: وعيَّن الاثني عشر، وأطلق على سمعان اسمَ بطرس[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يعني اسم «بطرس»: «صخرة».'
    reason: بيان المعنى المعجمي للاسم اليوناني مع إبقاء الاسم الشخصي منقولًا في المتن.
lexical_decisions:
- source_word: ἐποίησεν
  choice: عيَّن
  rationale: الفعل يعني حرفيًا «صنع/جعل»، لكنه هنا يدل على اختيار الاثني عشر وتكوينهم جماعةً محددة؛ لذلك ينقل «عيَّن» المعنى السياقي بوضوح من غير إدخال مصطلحات كنسية لاحقة.
- source_word: τοὺς δώδεκα
  choice: الاثني عشر
  rationale: ترجمة مباشرة للعبارة التي تشير إلى جماعة تلاميذ يسوع الاثني عشر المعروفة.
- source_word: ἐπέθηκεν ὄνομα
  choice: أعطى ... اسمَ
  rationale: ينقل هذا التعبير العربي صورة منح الاسم الكامنة في التعبير اليوناني، مع بقائه طبيعيًا وواضحًا.
- source_word: Σίμωνι
  choice: سمعان
  rationale: نقل للاسم الشخصي وفق الصيغة العربية الكتابية الشائعة.
- source_word: Πέτρον
  choice: بطرس
  rationale: وردت الكلمة هنا اسمًا شخصيًا مُعطًى لسمعان، لذلك نُقل الاسم صوتيًا، وأُبقي معناه المعجمي في الحاشية.
theological_decisions:
- issue: طبيعة فعل يسوع تجاه الاثني عشر
  choice: عيَّن الاثني عشر
  alternative: جعل الاثني عشر
  rationale: يفيد السياق أنه اختارهم وكوَّنهم جماعةً محددة، لا أنه «صنعهم» بالمعنى العام؛ و«عيَّن» يحفظ هذه الدلالة من غير تحميل العبارة نظامًا كنسيًا لاحقًا.
- issue: معاملة الاسم Πέτρος
  choice: بطرس
  alternative: صخرة
  rationale: تعمل الكلمة في الآية اسمًا شخصيًا، لذا تُنقل باسم «بطرس»، مع بيان معناها في الحاشية بدل إحلال المعنى محل الاسم في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ عطف الجملتين بالواو، واستُعملت صياغة طبيعية تُبرز فعل التعيين ومنح الاسم. وُضع رمز الحاشية بعد «بطرس» لأنه يشرح معنى هذا الاسم.
