source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: ar
  text: 'وكان علماء الشريعة الذين نزلوا من أورشليم كانوا يقولون[a]: «إن به بعل زبول[b]»، و«إنه برئيس الشياطين[c] يطرد الشياطين».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كانوا يكررون القول».'
    reason: يوضح الدلالة الاستمرارية أو التكرارية لصيغة الماضي الناقص اليونانية ἔλεγον.
  - marker: b
    text: 'اليونانية: «بعل زبول»؛ ويُورَد الاسم تقليديًا أيضًا بصيغة «بعل زبوب». وقد يُفهم الاتهام، على نحو أوضح: «إنه متلبس ببعل زبول».'
    reason: يثبت الصورة التقليدية البديلة للاسم، ويوضح المعنى السياقي المحتمل للتعبير الاصطلاحي «به بعل زبول» دون إحلال التفسير محل صياغة المتن الموجزة.
  - marker: c
    text: 'أو: «بأمير الشياطين».'
    reason: يثبت ترجمة بديلة ممكنة للفظ ἄρχων.
lexical_decisions:
- source_word: γραμματεῖς
  choice: علماء الشريعة
  rationale: 'ينقل المقصود في سياق الأناجيل بوضوح إلى القارئ المعاصر: رجال مختصون بالشريعة اليهودية، لا مجرد ناسخين للنصوص.'
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: الذين نزلوا من أورشليم
  rationale: تحافظ الصياغة على الاتجاه المكاني الذي يدل عليه الفعل اليوناني، وتأتي طبيعية في العربية.
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: ينقل صيغة الماضي الناقص اليونانية التي تفيد القول المستمر أو المتكرر، بدل حصره في قول وقع مرة واحدة.
- source_word: Βεελζεβοὺλ
  choice: بعل زبول
  rationale: نقل صوتي مباشر للاسم اليوناني Βεελζεβούλ، مع إثبات الصورة التقليدية البديلة في الحاشية.
- source_word: ἔχει
  choice: به
  rationale: تحافظ العبارة العربية الموجزة «إن به بعل زبول» على غرابة التعبير اليوناني «له بعل زبول» مع إيصال دلالته السياقية على حلول قوة شريرة به، من غير أن يستبدل النص الرئيس ذلك بتفسير صريح كامل.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: برئيس الشياطين
  rationale: تؤدي الباء المعنى الوسيلي لحرف الجر ἐν هنا، أي إن الاتهام هو أنه يطرد الشياطين بواسطة رئيسها أو سلطانه.
- source_word: δαιμονίων / δαιμόνια
  choice: الشياطين
  rationale: يقابل الاسم اليوناني δαιμόνιον مباشرة، من غير استبداله بالتعبير المختلف «الأرواح النجسة».
- source_word: ἐκβάλλει
  choice: يطرد
  rationale: تعبير عربي واضح وطبيعي يفيد إخراج الشياطين بالقوة في سياق طرد الأرواح الشريرة.
theological_decisions:
- issue: صياغة الاتهام Βεελζεβοὺλ ἔχει
  choice: إن به بعل زبول
  alternative: إن بعل زبول قد تملكه
  rationale: يبقي النص الرئيس على إيجاز العبارة الأصلية وما فيها من توتر دلالي، بينما توضح الحاشية معنى التلبس أو الاستحواذ المحتمل من السياق.
- issue: ترجمة ἄρχων في وصف رئيس الشياطين
  choice: رئيس الشياطين
  alternative: أمير الشياطين
  rationale: «رئيس» لفظ حديث واضح يدل على صاحب السلطة، أما «أمير» فبديل صحيح لكنه قد يوحي بلقب سياسي أخص من دلالة الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «علماء الشريعة» بدل «الكتبة» لتجنب أن يفهم القارئ الحديث أنهم مجرد ناسخين، وحوفظ على الإيجاز والاتهام المتوازي في الجملتين.
