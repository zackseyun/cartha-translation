  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: ar
  text: وَإِنِ انْقَسَمَ بَيْتٌ عَلَى نَفْسِهِ[a]، فَلَنْ يَسْتَطِيعَ ذَلِكَ الْبَيْتُ أَنْ يَثْبُتَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أهل البيت»، إذ يمكن أن تدل οἰκία على أهل البيت، لكن اقترانها هنا بفكرة الثبات يرجّح إبقاء صورة «البيت».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: بَيْتٌ
  rationale: المعنى الأساسي هو «بيت»، وهو يحافظ على الصورة المكانية التي يعززها فعل «يثبت»؛ مع بقاء معنى «أهل البيت» ممكنًا بحسب السياق.
- source_word: ἐφ’ ἑαυτὴν
  choice: عَلَى ذَاتِهِ
  rationale: ينقل تعبير المعارضة الداخلية نقلًا موجزًا وطبيعيًا في العربية، أي أن البيت صار منقسمًا في مواجهة نفسه.
- source_word: μερισθῇ
  choice: انْقَسَمَ
  rationale: صيغة الشرط العربية تؤدي معنى الشرط العام الذي تحمله صيغة الماضي المبني للمجهول مع ἐὰν، و«انقسم» أوضح من صياغة ثقيلة مثل «جُعِل منقسمًا».
- source_word: δυνήσεται
  choice: فَلَنْ يَقْدِرَ
  rationale: يحفظ معنى القدرة المستقبلية، وتناسب «لن» جواب الشرط والنتيجة المتوقعة.
- source_word: σταθῆναι
  choice: أَنْ يَثْبُتَ
  rationale: «يثبت» يحفظ صورة الوقوف مع الدلالة الاصطلاحية على البقاء متماسكًا وعدم الانهيار.
- source_word: ἡ οἰκία ἐκείνη
  choice: ذَلِكَ الْبَيْتُ
  rationale: اسم الإشارة ينقل توكيد ἐκείνη ويعيد الإحالة بوضوح إلى البيت المذكور.
- source_word: καὶ ἐὰν
  choice: وَإِنِ
  rationale: يحفظ الواو الرابطة وأداة الشرط في عبارة عربية سليمة وموجزة.
