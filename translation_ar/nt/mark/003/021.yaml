base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: ar
  text: 'ولمّا سمع المقرّبون إليه[a]، خرجوا ليمسكوه، لأنهم كانوا يقولون: «إنه فقد صوابه»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عائلته» أو «خاصته». التعبير اليوناني اصطلاحي، وقد يشير تحديدًا إلى أهل بيته أو إلى دائرته القريبة.
    reason: alternative_reading
  - marker: b
    text: أو «إنه خارج عن طوره».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: المقرّبون إليه
  rationale: تعبير يوناني اصطلاحي ملتبس نسبيًا، يدل على المنتمين إلى دائرته أو بيته، وربما عائلته. يحافظ «المقرّبون إليه» على هذا الاتساع دون الجزم بأنهم أفراد عائلته.
- source_word: ἀκούσαντες
  choice: ولمّا سمع
  rationale: صياغة زمنية طبيعية لاسم الفاعل الماضي، تُظهر تعاقب الحدثين دون تكلّف.
- source_word: ἐξῆλθον
  choice: خرجوا
  rationale: ينقل المعنى المباشر للفعل ويحافظ على حركة السرد، من غير إضافة جهة أو غاية غير مصرّح بها.
- source_word: κρατῆσαι
  choice: ليمسكوه
  rationale: 'يفيد أخذ الشخص والإمساك به بقوة، لكنه لا يحدّد أن الفعل اعتقال قانوني. «ليمسكوه» طبيعي ويحفظ قدرًا من الغموض بشأن قصدهم: السيطرة عليه أو تقييده.'
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: يحافظ على دلالة الماضي الناقص، التي قد تفيد الكلام المستمر أو المتكرر.
- source_word: ἐξέστη
  choice: فقد صوابه
  rationale: ينقل بوضوح الاتهام بأنه لم يعد متزنًا عقليًا، بلغة عربية معاصرة مفهومة، من غير استعمال وصف طبي أشد مما يقتضيه النص.
theological_decisions:
- issue: هوية οἱ παρ’ αὐτοῦ
  choice: المقرّبون إليه
  alternative: عائلته / خاصته / الذين من عنده
  rationale: يرجّح السياق أن المقصود عائلة يسوع، ولا سيما في ضوء الآيات اللاحقة، لكن العبارة نفسها ليست لفظ قرابة صريحًا. لذلك يحفظ المتن الإبهام الأصيل، وتذكر الحاشية الاحتمال الأكثر تحديدًا.
- issue: طبيعة حكمهم في ἐξέστη
  choice: إنه فقد صوابه
  alternative: إنه خارج عن طوره / إنه مختل العقل
  rationale: العبارة تنقل حكم المتكلمين على حالته، لا تقرير الراوي لحقيقة طبية. الصياغة المختارة واضحة وتحافظ على كونها مقولة منسوبة إليهم.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «المقرّبون إليه» لصون الإبهام في هوية الجماعة، و«فقد صوابه» لنقل الاتهام بعبارة مفهومة غير طبية. وُضعت علامة الحاشية [b] بعد الاقتباس لأنها تتعلق بعبارته كاملة.
