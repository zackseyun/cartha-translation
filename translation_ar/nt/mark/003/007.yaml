  text: وانصرف يسوع مع تلاميذه نحو البحر[a][b]، وتبعه جمع كبير من الجليل، ومن اليهودية،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إلى البحر». يمكن لحرف الجر اليوناني أن يدل على الحركة باتجاه البحر أو الوصول إليه.
    reason: lexical_alternative
  - marker: b
    text: المقصود بحر الجليل. ويقول النص اليوناني هنا «البحر» فقط. ويستمر تعداد المناطق في الآية التالية.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: انصرف
  rationale: ينقل معنى الابتعاد أو الانسحاب من الموضع، ويحافظ هنا على دلالة التراجع عن المواجهة من غير أن يبالغ في تصويره فرارًا.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: مع تلاميذه
  rationale: «التلاميذ» هو المقابل العربي الراسخ والدقيق في سياق الأناجيل، ويشمل معنى التعلّم واتباع المعلّم.
- source_word: πρὸς τὴν θάλασσαν
  choice: نحو البحر
  rationale: تحافظ «نحو» على الدلالة الاتجاهية المحتملة لحرف الجر πρὸς، بينما تُبقي «البحر» اللفظ الوارد في اليونانية دون استبداله بالتفسير الجغرافي «البحيرة».
- source_word: πολὺ πλῆθος
  choice: جمع كبير
  rationale: صياغة عربية طبيعية واضحة تنقل معنى كثرة المجتمعين دون نبرة قديمة.
- source_word: ἠκολούθησεν
  choice: تبعه
  rationale: المعنى السياقي هو أن الجمع سار وراء يسوع مكانيًا؛ والضمير يوضح المرجع الطبيعي في العربية.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: من الجليل
  rationale: ترجمة مباشرة لدلالة المنشأ.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: ومن اليهودية
  rationale: تحافظ على استمرار تعداد المناطق، وهو تعداد يمتد إلى الآية التالية.
