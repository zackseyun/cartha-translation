review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام محفوظ: الشرط، وصورة المملكة المنقسمة، وعدم قدرتها على الثبات، وتكرار «تلك المملكة» تقابل اليونانية بدقة جيدة. لكن «على ذاتها» ليست الصياغة العربية الطبيعية لتعبير العداء/الانقسام الداخلي هنا؛ والأدق «على نفسها».'
  naturalness: التركيب واضح وفصيح عمومًا، إلا أن «انقسمت مملكة على ذاتها» ثقيل وغير مألوف في الاستعمال العربي المعاصر. «انقسمت مملكة على نفسها» طبيعي ومباشر ويحفظ العبارة المأثورة دون افتعال.
  terminology: «مملكة» مقابِل مناسب لـ βασιλεία في الصورة السياسية-الجماعية، و«تثبت» ينقل σταθῆναι مع المحافظة على الاستعارة. لا تستلزم الآية حاشية.
  issues:
  - severity: medium
    issue: استعمال «على ذاتها»
    rationale: «الذات» اسمٌ مجرد يُستعمل غالبًا في تراكيب فلسفية أو تأملية، وليس الإحالة الانعكاسية المألوفة بعد «على» في هذا المعنى. الضمير «نفسها» هو المقابل الطبيعي لـ ἐφ’ ἑαυτὴν («على نفسها/ضد نفسها») ويحافظ على معنى الانقسام الداخلي.
  revised_text: وَإِنِ انْقَسَمَتْ مَمْلَكَةٌ عَلَى نَفْسِهَا، فَلَا تَقْدِرُ تِلْكَ الْمَمْلَكَةُ أَنْ تَثْبُتَ.
