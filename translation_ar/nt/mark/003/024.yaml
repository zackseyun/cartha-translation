  rationale: استُبدلت «ذاتها» بـ«نفسها» وحدها لتحسين سلامة الاصطلاح العربي وتمثيل العلاقة الانعكاسية العدائية في الأصل، من دون تغيير المعنى أو توسيع نطاق المثل.
