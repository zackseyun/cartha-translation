  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: ar
  text: وَإِنِ انْقَسَمَتْ مَمْلَكَةٌ عَلَى نَفْسِهَا، فَلَا تَقْدِرُ تِلْكَ الْمَمْلَكَةُ أَنْ تَثْبُتَ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: أداة ربط تحفظ اتصال هذا القول بالحجة السابقة من غير إضافة تفسير.
- source_word: ἐὰν
  choice: إِنْ
  rationale: تفيد الشرط مع صيغة الاحتمال في الأصل، وهي الأنسب لصياغة المبدأ العام هنا.
- source_word: βασιλεία
  choice: مَمْلَكَةٌ
  rationale: يشير السياق إلى المملكة بوصفها كيانًا جماعيًا، لا إلى فعل المُلك أو السلطان المجرّد.
- source_word: ἐφ’ ἑαυτὴν
  choice: عَلَى ذَاتِهَا
  rationale: تعبير عربي واضح يحفظ معنى الانقسام الداخلي الموجَّه ضد الكيان نفسه.
- source_word: μερισθῇ
  choice: انْقَسَمَتْ
  rationale: ينقل معنى التفرّق إلى أقسام في صياغة عربية طبيعية؛ وصيغة «انقسمت» لا تعيّن فاعل الانقسام، بما يلائم المبني للمجهول في اليونانية.
- source_word: οὐ δύναται
  choice: فَلَا تَقْدِرُ
  rationale: ينقل عدم القدرة بوضوح، وتوضح الفاء جواب الشرط على نحو طبيعي في العربية.
- source_word: σταθῆναι
  choice: أَنْ تَثْبُتَ
  rationale: يحفظ صورة البقاء قائمًا مع أداء المعنى المقصود، أي الاستمرار وعدم الانهيار.
- source_word: ἡ βασιλεία ἐκείνη
  choice: تِلْكَ الْمَمْلَكَةُ
  rationale: يحفظ تكرار الاسم مع اسم الإشارة، وما فيه من إحالة وتوكيد بلاغي.
theological_decisions:
- issue: طبيعة القول
  choice: صياغته مبدأً عامًا داخل حجة يسوع، من غير توسيع مدلوله العقائدي أو السياسي.
  alternative: صياغته حكمة سياسية اجتماعية عامة تتجاوز سياق الحجة.
  rationale: النص يستخدم صورة المملكة قياسًا في الرد، ولا يصرّح في هذه الآية وحدها بتطبيقات أوسع.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة، مع الحفاظ على التوازي والتكرار البلاغي في الأصل. لا حاجة إلى حاشية لأن البنية والمعنى ينتقلان مباشرة.
