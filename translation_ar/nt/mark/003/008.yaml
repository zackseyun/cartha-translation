lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: من أورشليم
  rationale: تنقل ἀπό مع المضاف إليه معنى المصدر أو المنشأ، وتستعمل الاسم العربي الكتابي المألوف للمدينة.
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: من أدوم
  rationale: تشير Ἰδουμαία إلى إقليم أدوم؛ و«أدوم» هو الاسم العربي الواضح والمألوف، مع بقاء الدلالة الإقليمية مفهومة من السياق.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: من عبر الأردن[a]
  rationale: تفيد العبارة المنطقة الواقعة في الجانب الآخر من نهر الأردن. أُضيفت «من» عربيًا لتنسجم مع قائمة مواطن القادمين، دون حسم الجانب المقصود جغرافيًا.
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: من نواحي صور وصيدا[b]
  rationale: تفيد περί هنا المنطقة المحيطة بالمدينتين، لا المدينتين وحدهما بالضرورة؛ و«نواحي» صياغة عربية طبيعية لهذه الدلالة.
- source_word: πλῆθος πολύ
  choice: جمع غفير
  rationale: تعبير عربي فصيح وواضح يدل على كثرة العدد، ويقابل قوة الوصف اليوناني دون مبالغة إضافية.
- source_word: ἀκούοντες
  choice: بعدما سمعوا
  rationale: يفك الصيغة الحالية إلى جملة زمنية عربية طبيعية. وقد تحتمل الصيغة اليونانية أيضًا ظلًا سببيًا، لذلك لم تُترجم «لأنهم سمعوا».
- source_word: ὅσα ἐποίει
  choice: بما كان يفعله[c]
  rationale: يحفظ الماضي الناقص في ἐποίει معنى الفعل الجاري أو المتكرر، بينما تنقل «ما» مضمون ὅσα دون إلزام بإظهار معنى الشمول في المتن.
- source_word: ἦλθον πρὸς αὐτόν
  choice: جاء إليه
  rationale: صياغة عربية مباشرة لحركة الجمع نحو يسوع، وفق πρός مع المنصوب.
- source_word: καὶ ... καὶ ... καὶ
  choice: ومن ... ومن ... ومن
  rationale: يحافظ تكرار الواو على إيقاع القائمة التراكمي المميز لأسلوب مرقس، مع صياغة عربية طبيعية.
