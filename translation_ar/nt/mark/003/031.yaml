  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: ar
  text: ثم جاءت أمّه وإخوته، وهم واقفون في الخارج، فأرسلوا إليه يدعونه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: ثم
  rationale: تؤدي وظيفة الربط السردي وتتابع الأحداث بصورة طبيعية في العربية.
- source_word: ἔρχονται
  choice: جاءت... وإخوته
  rationale: المضارع اليوناني مضارع تاريخي، والماضي هو الأنسب للسرد العربي؛ وجاء الفعل مفردًا مؤنثًا لأن الفاعل المتعاطف يبدأ بـ«أمه».
- source_word: ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: أمه وإخوته
  rationale: ترجمة مباشرة موجزة، مع إبقاء «إخوته» بلا تحديد لطبيعة القرابة يتجاوز لفظ النص.
- source_word: ἔξω στήκοντες
  choice: ووقفوا خارجًا
  rationale: ينقل هيئة وجودهم خارج المكان في صياغة عربية طبيعية.
- source_word: ἀπέστειλαν πρὸς αὐτὸν
  choice: أرسلوا إليه
  rationale: يحافظ على عموم العبارة اليونانية التي لا تصرّح بالمُرسَل، ويفهم من السياق أنهم أرسلوا من يبلغه.
- source_word: καλοῦντες αὐτόν
  choice: يطلبونه
  rationale: ينقل غرض الإرسال، أي دعوته إلى الخروج أو الحضور إليهم، من غير إيحاء بأنهم كانوا ينادونه بأصواتهم مباشرة.
theological_decisions:
- issue: المقصود بـ«إخوته»
  choice: إخوته
  alternative: أقاربه، أو إخوته بحسب الجسد
  rationale: لفظ ἀδελφοί يعني في ظاهره «إخوة»، ولا تحسم الآية وحدها طبيعة صلة القرابة؛ لذلك لا تُضاف عبارة تفسيرية ذات طابع مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «خارجًا» وفق السياق المكاني السابق، وحُفظ إيجاز الأصل وغموضه في هوية من أُرسل.
