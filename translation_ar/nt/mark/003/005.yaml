source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: ar
  text: 'وبعد أن نظر حوله إليهم بغضب، حزينًا بسبب قساوة قلوبهم[a]، يقول للرجل: «مُدَّ يدك». فمدَّها، فعادت يده سليمة.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «قلبهم». جاء لفظ «القلب» في اليونانية مفردًا، ويُحتمل أنه مستعمل بمعنى جمعي.'
    reason: بيان صيغة الأصل مع الحفاظ على العربية الطبيعية في المتن.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: بعد أن نظر إليهم من حوله
  rationale: ينقل نظرةً شاملة موجَّهة إلى الحاضرين، ويحفظ تقدُّم الفعل على الفعل الرئيس الذي يليه.
- source_word: μετ’ ὀργῆς
  choice: بغضب
  rationale: تعبير مباشر وطبيعي عن الهيئة المصاحبة للنظر، من غير تلطيف للانفعال أو مبالغة فيه.
- source_word: συλλυπούμενος
  choice: وهو حزين
  rationale: ينقل الحزن والألم بعبارة عربية واضحة، مع إبقائه مقترنًا بالغضب كما في النص.
- source_word: ἐπὶ τῇ πωρώσει
  choice: لقساوة
  rationale: تفيد اللام سبب الحزن، وتحفظ «القساوة» الصورة المجازية الدالة على التبلد وعدم الاستجابة.
- source_word: τῆς καρδίας αὐτῶν
  choice: قلوبهم
  rationale: صيغة الجمع طبيعية في العربية مع الضمير الجمعي، أما مفرد الأصل اليوناني المحتمل استعماله جمعيًا فمبيَّن في الحاشية.
- source_word: λέγει
  choice: يقول
  rationale: يحفظ المضارع التاريخي الذي يمنح سرد مرقس حيوية، بدل تسويته إلى الماضي.
- source_word: τῷ ἀνθρώπῳ
  choice: للرجل
  rationale: يشير السياق إلى الرجل المحدد المذكور في المشهد.
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: مُدَّ يدك
  rationale: أمر عربي موجز وطبيعي يعبّر عن بسط اليد، ويحافظ على الصلة بالفعل التالي.
- source_word: ἐξέτεινεν
  choice: فمدَّها
  rationale: يكرر جذر الأمر كما يفعل اليوناني، ويستعيض بالضمير عن إعادة المفعول المفهوم.
- source_word: ἀπεκατεστάθη
  choice: فعادت يده سليمة
  rationale: يعبّر طبيعيًا عن رجوع اليد إلى حالتها الصحيحة، وهو أدق في السياق من مجرد القول إنها شُفيت.
theological_decisions:
- issue: اجتماع غضب يسوع وحزنه
  choice: 'إثبات الانفعالين صراحةً: «بغضب» و«وهو حزين».'
  alternative: تخفيف الغضب إلى «استياء»، أو توسيع الحزن إلى «حزنًا شديدًا».
  rationale: النص يعرض الغضب والحزن معًا، فلا ينبغي تلطيف أحدهما أو إزالة التوتر الأخلاقي واللاهوتي بينهما.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ المضارع التاريخي في «يقول» لإبقاء حيوية السرد، واستُعملت صيغة الجمع الطبيعية «قلوبهم» مع توثيق المفرد اليوناني في الحاشية.
