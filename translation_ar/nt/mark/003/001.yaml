lexical_decisions:
- source_word: εἰσῆλθεν
  choice: دخل
  rationale: ينقل فعل الحركة الماضي في السرد بوضوح وطبيعية.
- source_word: πάλιν
  choice: أيضًا
  rationale: يدل هنا على تكرار دخول يسوع المجمع؛ و«أيضًا» طبيعية في السياق، مع إمكان فهمها بمعنى «مرة أخرى».
- source_word: εἰς συναγωγήν
  choice: إلى مجمع
  rationale: يحفظ معنى الحركة في εἰς، ويعكس غياب أداة التعريف في النص اليوناني من غير افتراض مجمع محدد.
- source_word: ἦν ἐκεῖ
  choice: كان هناك
  rationale: صياغة عربية طبيعية تنقل وجود الرجل في ذلك المكان.
- source_word: ἄνθρωπος
  choice: رجل
  rationale: المراد في هذا المشهد فرد ذكر، و«رجل» أوضح وأطبع عربيًا.
- source_word: ἐξηραμμένην
  choice: يابسة
  rationale: تنقل حالة اليد التي جفّت أو ضمرت، وتحافظ على الصورة الحسية للفعل اليوناني بصياغة عربية موجزة.
- source_word: ἔχων τὴν χεῖρα
  choice: يده يابسة
  rationale: تحويل تركيب اسم الفاعل إلى جملة اسمية وصفية هو الأسلوب العربي الطبيعي، والضمير يبيّن علاقة اليد بالرجل من غير إخلال بالمعنى.
