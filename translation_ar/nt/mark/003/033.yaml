  text: 'فأجابهم قائلًا: «مَن هي أمي، ومَن هم إخوتي؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا بحسب ترتيب اليونانية: «مَن هي أمي أو إخوتي؟»؛ جاء الفعل مفردًا موافقًا لـ«أمي»، ثم عُطف عليه الجمع «إخوتي» بحرف «أو».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: فأجابهم قائلًا
  rationale: ينقل معنى اسم الفاعل مع فعل القول بصورة عربية طبيعية، ويحافظ على ملمح الصياغة اليونانية من غير تكلف زمني غير مألوف في السرد العربي.
- source_word: Τίς
  choice: مَن
  rationale: أداة الاستفهام العربية المباشرة عن هوية الأشخاص.
- source_word: μήτηρ
  choice: أمي
  rationale: المقابل العربي المعياري الواضح للمفردة الدالة على الأم، مع ضمير المتكلم الوارد في النص.
- source_word: ἢ
  choice: ومَن
  rationale: الأصل اليوناني يستعمل «أو»، لكن تكرار أداة الاستفهام مع الواو يصوغ السؤال طبيعيًا بالعربية من دون تغيير المقصود؛ وتُحفظ الصياغة الحرفية في الحاشية.
- source_word: ἀδελφοί
  choice: إخوتي
  rationale: يحافظ على الجمع المذكر في اليونانية وعلى الإشارة إلى الإخوة الذكور في السياق، من غير توسيع تفسيري إلى الإخوة والأخوات.
theological_decisions:
- issue: دلالة ἀδελφοί العائلية
  choice: إخوتي
  alternative: أشقائي؛ إخوتي وأخواتي
  rationale: «إخوتي» هو المقابل العربي الأوسع والأقرب إلى اللفظ اليوناني المذكر، ولا يحسم طبيعة القرابة بتخصيص «أشقائي»، ولا يضيف الإناث إلى هذا الموضع.
- issue: العلاقة بين «الأم» و«الإخوة» في السؤال
  choice: مَن هي أمي، ومَن هم إخوتي؟
  alternative: مَن هي أمي أو إخوتي؟
  rationale: الصياغة المختارة عربية واضحة وتحفظ سؤال الهوية في شقيه، بينما توثق الحاشية البنية اليونانية المفردة وحرف العطف «أو» كي لا يُطمس توترها النحوي.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. اختيرت صياغة سؤال طبيعية مع إبقاء البنية اليونانية غير المألوفة في حاشية، وحُفظت «إخوتي» من غير توسيع مذهبي أو تضييق لطبيعة القرابة.
