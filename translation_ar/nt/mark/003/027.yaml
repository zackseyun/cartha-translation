source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: ar
  text: لكن لا يستطيع أحد أن يدخل بيت الرجل القوي[b] وينهب أمتعته[a]، ما لم يربطه أولًا؛ وحينئذ ينهب بيته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مقتنياته»؛ وحرفيًا: «أوانيه» أو «أشياءه».'
    reason: lexical_alternative
  - marker: b
    text: «الرجل القوي» جزء من الصورة التي يضربها يسوع عن قهر الشيطان؛ وقد أُبقيت الصورة في المتن بدل إدخال تفسيرها في الترجمة.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: بل
  rationale: تفيد الانتقال إلى ردٍّ مناقض للاتهام السابق، و«بل» طبيعية في هذا السياق الحجاجي.
- source_word: οὐδεὶς δύναται
  choice: لا يستطيع أحد
  rationale: تنقل النفي العام ومعنى القدرة بوضوح وطبيعية.
- source_word: εἰς τὴν οἰκίαν ... εἰσελθὼν
  choice: أن يدخل بيت
  rationale: صياغة عربية طبيعية تحفظ معنى الدخول إلى البيت من غير محاكاة ثقيلة لتركيب اسم الفاعل اليوناني.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: الرجل القوي
  rationale: الصفة مستعملة استعمال الاسم، وهذه الصياغة تحفظ صورة المثل وتكرار العبارة.
- source_word: τὰ σκεύη αὐτοῦ
  choice: أمتعته
  rationale: تشير σκεύη هنا إلى الأشياء والمنقولات الموجودة في البيت؛ و«أمتعته» واضحة وتحفظ المعنى المادي، مع ذكر البدائل في الحاشية.
- source_word: διαρπάσαι / διαρπάσει
  choice: ينهب / ينهب
  rationale: الفعل يدل على السلب والاستيلاء، و«ينهب» يحفظ قوته ويصلح للمفعول «الأمتعة» ثم «البيت».
- source_word: ἐὰν μὴ
  choice: ما لم
  rationale: تعبير عربي فصيح طبيعي عن الشرط الضروري السابق.
- source_word: πρῶτον
  choice: أولًا
  rationale: يحفظ أولوية ربط الرجل القوي قبل نهب بيته.
- source_word: δήσῃ
  choice: يربط
  rationale: ينقل المعنى الحسي المباشر للفعل δέω ويحفظ صورة اقتحام البيت.
- source_word: καὶ τότε
  choice: وحينئذ
  rationale: يبين النتيجة الزمنية المترتبة على تحقق الشرط دون إضافة توكيد غير صريح.
- source_word: τὴν οἰκίαν αὐτοῦ διαρπάσει
  choice: ينهب بيته
  rationale: يحفظ زمن النتيجة وصورة البيت المكررة، من غير تحويلها إلى تفسير تجريدي.
theological_decisions:
- issue: الدلالة المجازية لعبارة «الرجل القوي» في حجة يسوع بشأن الشيطان
  choice: الإبقاء على صورة «الرجل القوي» في المتن، مع بيان مرجعها السياقي في الحاشية.
  alternative: التصريح في المتن بأن الرجل القوي هو الشيطان، أو ترجمته بعبارة تجريدية مثل «القوي».
  rationale: النص اليوناني يعرض مثلًا تصويريًا، وإن كان السياق يدل على قهر الشيطان؛ لذلك تُحفظ الصورة ولا يُدمج تفسيرها في الترجمة.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ومهيبة، مع تركيب سلس يحفظ تسلسل الصورة: دخول البيت، وربط الرجل القوي أولًا، ثم نهب البيت. وُضعت علامتا الحاشية مباشرة بعد اللفظ الذي تشرحه كل منهما.'
