  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: ar
  text: 'وكانت الأرواح النجسة، كلما رأته، تنطرح أمامه[a] وتصرخ قائلة: «أنت ابن الله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تسقط أمامه». يمكن أن يدل الفعل اليوناني على السقوط أمام شخص خضوعًا أو تضرعًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: الأرواح النجسة
  rationale: ترجمة مباشرة تحفظ المصطلح الإنجيلي المألوف، ولا تستبدل «النجسة» بوصف تفسيري أضيق مثل «الشريرة».
- source_word: ὅταν
  choice: كلما
  rationale: 'تفيد التكرار مع الفعلين الناقصين في اليونانية: في كل مرة كانت تراه كان يتكرر رد الفعل نفسه.'
- source_word: ἐθεώρουν
  choice: رأته
  rationale: صياغة عربية طبيعية تؤدي معنى الرؤية في هذا السياق، بينما تنقل «كلما» دلالة التكرار.
- source_word: προσέπιπτον αὐτῷ
  choice: تسقط أمامه
  rationale: تحفظ الفعل الجسدي ودلالة الخضوع أو التضرع المحتملة، من غير أن تحسمه بوصفه عبادة.
- source_word: ἔκραζον
  choice: تصرخ
  rationale: تنقل شدة κράζω بلغة عربية واضحة من غير مبالغة مثل «تزعق» أو «تولول».
- source_word: λέγοντα
  choice: قائلة
  rationale: تؤدي اسم الفاعل المصاحب لفعل الصراخ بصياغة عربية فصيحة وطبيعية، مع إفراد الصفة والفعل لمعاملة جمع غير العاقل.
- source_word: Σὺ εἶ
  choice: أنت
  rationale: يحفظ الضمير المنفصل توكيد المخاطب الموجود صراحة في اليونانية.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ابن الله
  rationale: يحفظ اللقب ووزنه المسيحاني بصيغته العربية المباشرة والمألوفة.
theological_decisions:
- issue: هل يُترجم سقوط الأرواح أمام يسوع على أنه عبادة أم مجرد انطراح وخضوع؟
  choice: تسقط أمامه
  alternative: تسجد له
  rationale: يمكن أن يدل προσπίπτω على السقوط أمام شخص خضوعًا أو تضرعًا، لكن النص لا يصرح بأن الأرواح النجسة قدمت عبادة؛ لذلك تُحفظ دلالة الفعل الجسدي والتوتر اللاهوتي من غير حسم تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية وقورة. استُخدم إفراد الفعل والصفة وتأنيثهما مع «الأرواح» وفق الاستعمال العربي الطبيعي لجمع غير العاقل، مع إبقاء «كلما» لإظهار تكرر الحدث.
