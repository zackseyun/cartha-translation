base_translation:
  language: en
  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: ar
  text: 'ونظر حوله إلى الجالسين في دائرة حوله، وقال: «ها هي أمي وإخوتي[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إخوتي وأخواتي». اللفظ اليوناني يعني حرفيًا «إخوتي»، لكنه قد يُستعمل لجماعة تضم رجالًا ونساءً، وربما كان بين المحيطين بيسوع نساء أيضًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: نظر إلى ... حوله
  rationale: ينقل الالتفات بالنظر إلى المحيطين به بعبارة عربية طبيعية، مع إبقاء الفعل سابقًا للقول بحسب صيغة اسم الفاعل اليونانية.
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: الجالسين حوله في دائرة
  rationale: 'يحفظ عناصر العبارة الثلاثة: الجلوس، والإحاطة به، والهيئة الدائرية.'
- source_word: λέγει
  choice: وقال
  rationale: المضارع التاريخي مألوف في سرد مرقس، لكن الماضي هنا هو الأسلوب العربي القصصي الطبيعي ولا يغيّر تسلسل الحدث.
- source_word: Ἴδε
  choice: ها
  rationale: أداة إشارة وتنبيه موجزة وفصيحة، توجه الانتباه إلى الحاضرين من غير نبرة قديمة متكلفة.
- source_word: μήτηρ
  choice: أمي
  rationale: المعنى المعجمي المباشر مع ضمير المتكلم كما في الأصل.
- source_word: ἀδελφοί
  choice: إخوتي
  rationale: يحفظ الجمع المذكر في اليونانية، مع بيان احتمال شموله الأوسع في الحاشية.
theological_decisions:
- issue: صيغة ἀδελφοί المذكرة في سياق ربما كان يضم نساءً أيضًا
  choice: إخوتي
  alternative: إخوتي وأخواتي / أشقائي
  rationale: أُبقيت الصيغة المذكرة المطابقة لبنية الأصل في المتن، من غير حصر مدلولها بالذكور؛ وتوضح الحاشية احتمال الاستعمال الجامع.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل الماضي للسرد الطبيعي، و«ها» للتنبيه المباشر، مع الحفاظ على الصورة المكانية «حوله في دائرة».
