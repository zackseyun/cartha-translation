lexical_decisions:
- source_word: ὅτι
  choice: لأنهم
  rationale: تؤدي «لأن» المعنى السببي في السياق، إذ تبيّن سبب القول السابق عن ذنبهم.
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: تحفظ صيغة الماضي الناقص دلالة الاستمرار أو التكرار، بدل تصوير الكلام كقول وقع مرة واحدة فقط.
- source_word: Πνεῦμα ἀκάθαρτον
  choice: روحًا نجسًا
  rationale: تحفظ العبارة الاصطلاح الإنجيلي المألوف وروابطه اللفظية بمفهوم النجاسة، من غير إعادة تفسيره.
- source_word: ἔχει
  choice: به
  rationale: التعبير العربي «به روح» ينقل معنى أن لديه روحًا أو أن روحًا حلت به بصورة طبيعية وموجزة، من غير أن يصرّح في المتن بالتفسير الأوسع «ممسوس».
theological_decisions:
- issue: طبيعة الاتهام الموجَّه إلى يسوع
  choice: 'الإبقاء على الاتهام المباشر: «إن به روحًا نجسًا»'
  alternative: «إن روحًا نجسًا قد مسَّه»
  rationale: يحفظ المتن صياغة الاتهام الصادمة من غير توسيع معنى الفعل اليوناني إلى تصريح كامل بالتلبس أو المسّ؛ وتورد الحاشية البديل الاصطلاحي لتوضيح المعنى المحتمل.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم التركيب الطبيعي «إن به روحًا نجسًا» بدل الحرفية الثقيلة «إنه يملك روحًا نجسًا»، مع الحفاظ على استمرار فعل القول وعلى قدر من الغموض في طبيعة علاقة الروح به.
