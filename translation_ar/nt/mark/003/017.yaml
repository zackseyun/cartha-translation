  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: ar
  text: ويعقوبَ بنَ زبدي، ويوحنا أخا يعقوب (وأطلق عليهما لقبًا[a] «بُوانَرْجِس»، أي «أبناء الرعد»)،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «أسماء» بصيغة الجمع؛ ويُرجَّح أن الجمع يُستعمل للدلالة على لقب واحد مشترك أُطلق على الأخوين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: يعقوب
  rationale: الصيغة العربية الكتابية المألوفة للاسم اليوناني Ἰάκωβος، وهي تحافظ على صلته باسمه السامي دون الحاجة إلى تمييز اصطلاحي على غرار الإنجليزية بين Jacob وJames.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: بن زبدي
  rationale: تركيب أداة التعريف مع المضاف إليه يدل هنا اصطلاحيًا على النسب الأبوي، وصيغة «بن زبدي» عربية طبيعية موجزة.
- source_word: Ἰωάννην
  choice: يوحنا
  rationale: الصيغة العربية الكتابية الشائعة للاسم Ἰωάννης.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: أخا يعقوب
  rationale: يدل ἀδελφός في السياق على الأخوّة العائلية الحرفية، والنصب يلائم عطف الاسم على سياق القائمة.
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: أطلق عليهما اسمَ
  rationale: الفعل ἐπιτίθημι مع «اسم/أسماء» يفيد منح الاسم أو إطلاقه. والتثنية «عليهما» تصرّح بأن اللقب أُطلق على الأخوين، في حين يأتي «اسم» مفردًا طبيعيًا لأنه لقب مشترك واحد، مع بيان صيغة الجمع اليونانية في الحاشية.
- source_word: Βοανηργές
  choice: بُوانَرْجِس
  rationale: نقل صوتي للاسم/اللقب السامي الذي أبقاه النص ثم شرح معناه، مع ضبط تقريبي يساعد القارئ العربي على النطق.
- source_word: ὅ ἐστιν
  choice: أي
  rationale: أداة تفسير عربية واضحة وطبيعية تنقل وظيفة العبارة اليونانية في شرح معنى اللقب.
- source_word: Υἱοὶ Βροντῆς
  choice: ابنا الرعد
  rationale: ترجمة مباشرة للصورة اللقبية، مع استعمال المثنى العربي لأن المقصود يعقوب ويوحنا تحديدًا.
theological_decisions:
- issue: عرض اللقب السامي وتفسيره
  choice: الإبقاء على «بُوانَرْجِس» ثم تفسيره بـ«ابنا الرعد»
  alternative: الاكتفاء بترجمة معنى اللقب، أو حذف النقل الصوتي
  rationale: النص نفسه يحفظ اللفظ الأجنبي ويورد تفسيره؛ فالإبقاء على الاثنين يصون بنيته وتفصيله السردي من غير تحميله معنى مذهبيًا زائدًا.
- issue: إفراد «اسم» مع أن اليونانية تستعمل الجمع ὀνόματα
  choice: «اسم» في المتن مع حاشية تبين الجمع اليوناني
  alternative: «أسماء» في المتن
  rationale: اللقب المذكور واحد ومشترك بين الأخوين، ولذلك فالمفرد أوضح وأطبع بالعربية، بينما تحفظ الحاشية المعلومة الصرفية واحتمال كون الجمع جمعًا توزيعيًا أو جماعيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت الأسماء الكتابية العربية المألوفة، وصيغ المثنى الطبيعية «عليهما» و«ابنا» لتوضيح الإحالة إلى الأخوين. وُضعت علامة الحاشية بعد الجملة التفسيرية التي تتصل بها.
