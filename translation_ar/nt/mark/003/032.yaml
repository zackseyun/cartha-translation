  text: καὶ ἐκάθητο ⸂περὶ αὐτὸν ὄχλος⸃, ⸂καὶ λέγουσιν⸃ αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί ⸀σου ἔξω ζητοῦσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: ar
  text: 'وكان جمعٌ جالسًا حوله، فقالوا له: «ها إن أمك وإخوتك في الخارج يبحثون عنك[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يطلبونك». يمكن أن يعني الفعل اليوناني «يطلب» أو «يبحث عن»، ويبدو هنا أنه يشير إلى محاولتهم العثور عليه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: كان ... جالسًا
  rationale: صيغة الماضي الناقص ترسم مشهدًا مستمرًا في خلفية السرد، وهذا التركيب العربي يحفظ معنى الاستمرار بصورة طبيعية.
- source_word: περὶ αὐτὸν ὄχλος
  choice: جمعٌ جالسًا حوله
  rationale: تفيد περί مع النصب الإحاطة المكانية، و«حوله» تنقل هذه الصورة بوضوح.
- source_word: λέγουσιν
  choice: فقالوا
  rationale: المضارع هنا مضارع تاريخي في سياق سرد ماضٍ؛ وصيغة الماضي هي الأسلوب العربي الطبيعي، مع الفاء لربط الحدث بالمشهد السابق.
- source_word: Ἰδοὺ
  choice: ها إن
  rationale: أداة تنبيه تلفت انتباه المخاطب، و«ها إن» واضحة وفصيحة من غير نبرة قديمة متكلفة.
- source_word: μήτηρ
  choice: أمك
  rationale: المقابل المباشر الطبيعي للفظ القرابة.
- source_word: ἀδελφοί
  choice: إخوتك
  rationale: يحفظ اللفظ المذكر الوارد في اليونانية من غير توسيع تفسيري لطبيعة صلة القرابة.
- source_word: ἔξω
  choice: في الخارج
  rationale: ينقل المعنى المكاني المباشر بصياغة عربية طبيعية.
- source_word: ζητοῦσίν σε
  choice: يبحثون عنك
  rationale: يفيد ζητέω الطلب أو البحث؛ وفي هذا السياق المكاني تعبّر «يبحثون عنك» بوضوح عن محاولة العثور عليه، مع إبقاء البديل الأوسع في الحاشية.
theological_decisions:
- issue: المقصود بلفظ ἀδελφοί
  choice: إخوتك
  alternative: أقرباؤك / إخوتك وأخواتك
  rationale: يستعمل النص لفظ القرابة العادي بصيغة المذكر الجمع ولا يشرح طبيعة هذه الصلة. لذلك تُحفظ الدلالة المباشرة من غير إدخال حسم مذهبي في هوية الإخوة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ تصوير الجمع جالسًا حول يسوع، واستُعمل سرد ماضٍ طبيعي مع إبقاء مرونة معنى ζητέω في الحاشية.
