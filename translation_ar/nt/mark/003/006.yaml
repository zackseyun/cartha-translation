  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: ar
  text: فخرج الفريسيون، وأخذوا فورًا يتشاورون مع الهيرودسيين ضدّه كيف يهلكونه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بعبارة أصرح بحسب السياق: «يقتلونه» أو «يُعدمونه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: فخرج
  rationale: اسم فاعل ماضٍ يدل على فعل سابق أو مصاحب للفعل الرئيس؛ وصيغة «فخرج» طبيعية في السرد العربي، وتحفظ الانتقال من موضع الحدث السابق.
- source_word: εὐθὺς
  choice: فورًا
  rationale: تنقل الإلحاح والسرعة المميزين لاستعمال مرقس، بعبارة عربية فصيحة واضحة.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: مع الهيرودسيين
  rationale: تحفظ دلالة المصاحبة في μετά مع المضاف إليه، وتستعمل الاسم الشائع للجماعة المرتبطة بمصالح هيرودس.
- source_word: συμβούλιον ἐδίδουν
  choice: تشاوروا
  rationale: العبارة اليونانية اصطلاح يفيد عقد مشورة أو التباحث؛ والسياق اللاحق يبين أن المشورة عدائية. صيغة الفعل العربية تؤدي الحدث طبيعيًا من غير توسيع زائد إلى «تآمروا».
- source_word: κατ’ αὐτοῦ
  choice: ضده
  rationale: تنقل القوة العدائية لحرف الجر κατά هنا، لا مجرد معنى «بشأنه».
- source_word: ὅπως
  choice: في كيفية
  rationale: تربط المشورة بالطريقة المقصودة لتحقيق الغاية، وتحفظ مسحة التداول في الكيفية بدل اختزالها في مجرد أداة غاية.
- source_word: ἀπολέσωσιν
  choice: إهلاكه
  rationale: يحفظ المجال الدلالي الأوسع للفعل ἀπόλλυμι، الذي قد يعني الإهلاك أو التدمير أو القتل، مع بقاء القصد القاتل واضحًا من السياق ومبينًا في الحاشية.
theological_decisions:
- issue: هل يُصرَّح في المتن بأن قصد القادة كان قتل يسوع؟
  choice: الإبقاء على اللفظ الأوسع «إهلاكه» في المتن.
  alternative: قتله أو القضاء عليه
  rationale: الفعل اليوناني ἀπόλλυμι أوسع من فعل القتل وحده، وإن كان السياق هنا يرجح بوضوح قصد إماتته. يحفظ «إهلاكه» الاتساع المعجمي، وتوضح الحاشية المعنى الصريح المحتمل في السياق.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع ترتيب سردي طبيعي. اختير «تشاوروا» بدل الصياغة الحرفية الثقيلة «أعطوا مشورة»، وتُركت دلالة المؤامرة لتظهر من «ضده» ومن غاية إهلاكه.
