  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: ar
  text: لِأَنَّ كُلَّ مَنْ يَعْمَلُ مَشِيئَةَ اللهِ، فَهٰذَا[a] هُوَ أَخِي وَأُخْتِي وَأُمِّي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فذلك الشخص هو أخي وأختي وأمي». في اليونانية اسم إشارة مؤكد، ومعناه الحرفي «هذا» أو «هذا الشخص».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: كُلَّ مَنْ يَعْمَلُ
  rationale: تركيب الاسم الموصول مع ἄν والفعل بصيغة الاحتمال يفيد شرطًا عامًا غير محدد؛ و«كل من يعمل» تعبير عربي طبيعي يحفظ معنى «أيّ شخص يعمل».
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تأتي γάρ هنا لتعليل القول السابق أو شرحه، و«لأن» تؤدي هذه الصلة بوضوح في العربية.
- source_word: ποιήσῃ
  choice: يَعْمَلُ
  rationale: الفعل ποιέω يعني هنا أن يفعل المرء مشيئة الله أو ينفذها. و«يعمل مشيئة الله» صياغة مباشرة ومألوفة من غير زيادة تفسيرية.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: مَشِيئَةَ اللهِ
  rationale: ترجمة مباشرة تحفظ الإضافة اليونانية في تركيب عربي طبيعي ومألوف.
- source_word: οὗτος
  choice: فَهٰذَا هُوَ
  rationale: اسم الإشارة اليوناني بارز للتوكيد؛ فحُفظت الإشارة بـ«هذا»، وأضيف ضمير الفصل «هو» لتقوية التوكيد وجعل التركيب العربي مستقيمًا.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: أَخِي وَأُخْتِي وَأُمِّي
  rationale: حُفظت ألفاظ القرابة الثلاثة صراحة، وكذلك تكرار العطف، لما في ذلك من قوة بلاغية ولاهوتية في إعادة تعريف عائلة يسوع.
- source_word: ἐστίν
  choice: هُوَ
  rationale: أُدِّي معنى الربط الاسمي في العربية بضمير الفصل «هو»، مع بقاء المسند مفردًا بحسب «كل من» واسم الإشارة.
theological_decisions:
- issue: التعبير عن جنس الفاعل المفرد مع ورود ألقاب قرابة مذكرة ومؤنثة
  choice: كُلَّ مَنْ ... فَهٰذَا هُوَ
  alternative: مَنْ ... فَهُوَ
  rationale: «مَن» في العربية تشمل الذكر والأنثى، و«كل من» يحفظ العموم. أما «هذا» فيؤدي اسم الإشارة المفرد في الأصل دون تحويل القول إلى جمع، فيما تكشف ألفاظ «أخي وأختي وأمي» بوضوح أن الانتماء المقصود لا يقتصر على جنس واحد.
- issue: طبيعة لغة العائلة في قول يسوع
  choice: الإبقاء على «أخي وأختي وأمي»
  alternative: واحد من عائلتي
  rationale: الأصل يستعمل ألفاظ قرابة محددة ليعيد تصوير الانتماء العائلي حول عمل مشيئة الله؛ وتعميمها إلى «واحد من عائلتي» يضعف التعداد وقوته البلاغية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعملت «كل من» للعموم، وحُفظ التعداد المفرد المتعمد «أخي وأختي وأمي» من غير تسويته إلى تعبير جمعي عام.
