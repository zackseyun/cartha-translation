  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: ar
  text: وقال لتلاميذه أن يكون قارب صغير جاهزًا له بسبب الحشد، لئلا يزحموه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يضغطوا عليه» أو «يسحقوه». يدل الفعل اليوناني على الضغط أو المزاحمة، وقد يفيد السحق تحت وطأة الضغط.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: قال
  rationale: الصياغة «قال لتلاميذه أن...» طبيعية في العربية المعاصرة، وتنقل فعل القول في سياق توجيه غير مباشر.
- source_word: μαθηταῖς
  choice: لتلاميذه
  rationale: «التلاميذ» هو المقابل الإنجيلي المألوف، ويحفظ علاقة التعلّم والاتباع.
- source_word: πλοιάριον
  choice: قاربًا صغيرًا
  rationale: يحفظ التصغير في اللفظة اليونانية بصياغة عربية واضحة وطبيعية.
- source_word: προσκαρτερῇ
  choice: يُبقوا ... على أهبة الاستعداد
  rationale: ينقل معنى دوام تهيئة القارب وإتاحته لخدمة يسوع، مع تحويل الفاعل المفرد الضمني، القارب، إلى تعبير سببي عربي طبيعي يكون فيه التلاميذ هم المكلَّفين بإبقائه جاهزًا.
- source_word: αὐτῷ
  choice: له
  rationale: يبين أن القارب مهيأ لاستخدام يسوع من غير إطالة تفسيرية.
- source_word: διὰ τὸν ὄχλον
  choice: بسبب الجموع
  rationale: تنقل διά مع النصب بوصفها دالة على السبب. واختيار الجمع «الجموع» طبيعي في مشهد احتشاد أناس كثيرين حوله.
- source_word: θλίβωσιν
  choice: يزحموه بشدة
  rationale: يجمع بين معنى التدافع والضغط الجسدي الذي تحمله اللفظة في هذا السياق، من غير أن يحصرها في إصابة ساحقة فعلية.
