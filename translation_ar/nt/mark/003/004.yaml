source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: ar
  text: 'وقال لهم: «أيحلّ في السبت أن نفعل الخير أم نفعل الشر، أن نخلّص نفسًا أم نقتل؟» أما هم فظلّوا صامتين.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔξεστιν
  choice: أيحلّ
  rationale: ينقل معنى الجواز في سياق جدال شرعي بشأن ما يجوز فعله في السبت، بصياغة عربية موجزة وطبيعية.
- source_word: τοῖς σάββασιν
  choice: في السبت
  rationale: صيغة الجمع اليونانية تعبير اصطلاحي شائع للدلالة على السبت؛ والمفرد العربي أوضح وأنسب للسياق الذي يتحدث عن يوم سبت بعينه.
- source_word: ἀγαθοποιῆσαι
  choice: أن نفعل الخير
  rationale: يحافظ على الدلالة الفعلية المباشرة وعلى المقابلة مع فعل الشر.
- source_word: κακοποιῆσαι
  choice: أن نفعل الشر
  rationale: اللفظ اليوناني يحتمل فعل الشر أو الإضرار. اختير «فعل الشر» للمحافظة على المقابلة الأخلاقية الصريحة مع «فعل الخير»، من غير حصر المعنى في الضرر الجسدي.
- source_word: ψυχὴν
  choice: نفسًا
  rationale: في سياق المقابلة مع القتل تدل على حياة إنسان، و«نفسًا» عربية طبيعية تحافظ أيضًا على اتساع اللفظ الأصلي.
- source_word: σῶσαι
  choice: نخلّص
  rationale: يحفظ الصلة المعجمية بالفعل الدال على الخلاص والإنقاذ، ويؤدي هنا معنى إبقاء النفس حية.
- source_word: ἀποκτεῖναι
  choice: نقتل
  rationale: ينقل المعنى الأساسي مباشرة، من دون إضافة دلالة القتل غير المشروع التي تحملها كلمة «نغتال» أو نحوها.
- source_word: ἐσιώπων
  choice: فظلّوا صامتين
  rationale: يعبّر عن الاستمرار الذي تفيده صيغة الماضي الناقص اليونانية، ويبيّن أن الصمت كان ردهم المتواصل على السؤال.
theological_decisions:
- issue: صيغة السبت في الجدال الشرعي
  choice: في السبت
  alternative: في السبوت
  rationale: الجمع اليوناني اصطلاحي، والسياق يشير إلى يوم السبت الحاضر في القصة؛ لذلك ينقل المفرد المعنى المقصود بوضوح ولا يحوّل السؤال إلى حكم عن أيام متعددة.
- issue: المقابلة بين فعل الخير وفعل الشر
  choice: أن نفعل الخير أم نفعل الشر
  alternative: أن نصنع خيرًا أم نلحق ضررًا
  rationale: الصياغة المختارة تحافظ على التوازي اللفظي والأخلاقي في اليونانية، فيما يوضح الشطر التالي—تخليص نفس أو قتلها—البعد العملي للمقابلة من غير أن يحصر الفعل الثاني في مجرد الإضرار.
- issue: دلالة ψυχή في عبارة الخلاص والقتل
  choice: نفسًا
  alternative: حياةً
  rationale: «نفسًا» تحافظ على لفظ له مدى دلالي أوسع، مع أن السياق يحدد المقصود هنا بأنه حياة إنسان؛ فلا تُفرض قراءة أنثروبولوجية خاصة ولا يُطمس امتداد الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «أيحلّ» للسؤال الشرعي، وحُفظ التوازي البلاغي في السؤال، كما نُقل استمرار صمت المخاطَبين بعبارة «ظلّوا صامتين».
