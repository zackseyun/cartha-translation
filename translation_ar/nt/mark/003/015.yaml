  text: and to have authority to cast out demons[a].
translation:
  language: ar
  text: وأن تكون لهم سلطةٌ لإخراج الشياطين[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لطرد الشياطين».
    reason: بديل معجمي للفعل ἐκβάλλειν يحافظ على معنى الإبعاد بالقوة.
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف يربط هذا الغرض بما سبقه ضمن سلسلة المصدر المؤول.
- source_word: ἔχειν
  choice: أن يكون لهم
  rationale: صياغة عربية طبيعية تؤدي معنى امتلاك السلطان في هذا التركيب، بدلًا من العبارة الأثقل «أن يمتلكوا».
- source_word: ἐξουσίαν
  choice: سلطانٌ
  rationale: يفيد التفويض والحق في الفعل، لا مجرد القوة الخام، ويلائم سياق تكليف يسوع للاثني عشر.
- source_word: ἐκβάλλειν
  choice: على إخراج
  rationale: ينقل معنى الطرد إلى الخارج، ويتصل في العربية اتصالًا طبيعيًا بلفظ «سلطان».
- source_word: τὰ δαιμόνια
  choice: الشياطين
  rationale: هو المقابل المباشر لـ δαιμόνια؛ ولا يستبدله بتعبير «الأرواح النجسة» الوارد في مواضع أخرى.
theological_decisions:
- issue: دلالة ἐξουσία في تكليف التلاميذ
  choice: سلطان
  alternative: قوة
  rationale: يركز السياق على أهلية مفوضة من يسوع وحق مأذون به في الفعل، مع عدم نفي القدرة الخارقة التي يتطلبها إخراج الشياطين.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «يكون لهم سلطان» لأنه طبيعي ومفهوم، مع إبقاء بنية العطف والغرض متصلة بالسياق السابق.
