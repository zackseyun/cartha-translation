  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: ar
  text: ويهوذا الإسخريوطي[a]، الذي أسلمه أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن ترجمة الفعل أيضًا: «سلّمه» أو «دفع به». وفي هذا السياق يمكن أن يُفهم بمعنى: «خانه»، لأن تسليم يهوذا ليسوع كان فعل خيانة.'
    reason: بيان البدائل الدلالية للفعل اليوناني παρέδωκεν مع المحافظة على نقل اللقب في المتن دون بديل غير لازم.
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف يربط الاسم الأخير بما سبقه في قائمة الرسل.
- source_word: Ἰούδαν
  choice: يهوذا
  rationale: الصيغة العربية المألوفة للاسم الشخصي في نصوص الكتاب المقدس.
- source_word: Ἰσκαριώθ
  choice: الإسخريوطي
  rationale: نقلٌ اصطلاحي مألوف للقب، مع تجنب ترجمته اشتقاقيًا لأن أصله ودلالته موضع خلاف.
- source_word: ὃς
  choice: الذي
  rationale: اسم موصول يُدخل جملة تصف يهوذا وتعرّفه بالفعل اللاحق.
- source_word: καὶ
  choice: أيضًا
  rationale: تحفظ القوة الإضافية للأداة في الجملة الموصولة، إذ تضيف وصفًا آخر ليهوذا.
- source_word: παρέδωκεν
  choice: أسلمه
  rationale: ينقل المعنى الأساسي للفعل، أي تسليم شخص إلى سلطة غيره، ويحفظ في المتن قدرًا من الاتساع الدلالي دون حجب دلالة الخيانة التي يثبتها السياق.
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير مفعول به يعود إلى يسوع، واتصاله بالفعل طبيعي في العربية.
theological_decisions:
- issue: دلالة παραδίδωμι في وصف فعل يهوذا تجاه يسوع
  choice: أسلمه
  alternative: خانه
  rationale: الفعل اليوناني يدل في أساسه على التسليم، بينما يحمل فعل يهوذا في السياق معنى الخيانة. اختيار «أسلمه» يحفظ صورة الفعل الأصلية والتوتر الدلالي، وتوضح الحاشية أن «خانه» ترجمة سياقية ممكنة.
