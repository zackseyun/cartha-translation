  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: ar
  text: وأخبرهم الذين رأوا كيف جرى الأمر للرجل الذي كانت تسكنه الشياطين، وعن الخنازير.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διηγήσαντο
  choice: روى
  rationale: يفيد الفعل سرد الخبر أو روايته بشيء من التفصيل، و«روى» فصيحة وطبيعية في سياق نقل الشهود لما حدث.
- source_word: οἱ ἰδόντες
  choice: الذين رأوا ما حدث
  rationale: يحافظ التعبير على صيغة اسم الفاعل المعرّف ويدل بوضوح على شهود الواقعة، من غير إدخال اللقب التفسيري «شهود العيان».
- source_word: πῶς ἐγένετο
  choice: كيف جرى الأمر
  rationale: ينقل معنى الكيفية أو مجرى الواقعة، ولا يختزله إلى مجرد «ما حدث».
- source_word: τῷ δαιμονιζομένῳ
  choice: الرجل الذي كان تسكنه الشياطين
  rationale: تعبير واضح في العربية المعاصرة يدل على خضوع الرجل لوجود شيطاني، مع استفادة الجمع من سياق مرقس 5 الذي يتحدث عن أرواح نجسة كثيرة.
- source_word: περὶ τῶν χοίρων
  choice: ما حدث للخنازير
  rationale: «περί» تعني «عن/بشأن»، لكن صياغة «ما حدث للخنازير» طبيعية هنا وتوضح مضمون الرواية الذي يفهمه السياق.
theological_decisions:
- issue: دلالة δαιμονιζομένῳ في رواية النشاط الشيطاني
  choice: الرجل الذي كان تسكنه الشياطين
  alternative: الرجل الذي به شيطان؛ الممسوس بالشياطين
  rationale: يحافظ الاختيار على تقديم مرقس للبلاء بوصفه شيطانيًا حقيقيًا، ولا يحوّله إلى وصف نفسي محض. وأُبقيت الإشارة إلى الرجل بدل اختزاله في لقب وصمي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدمت «فروى» لربط الآية بالسياق السردي، وتُجنبت ألفاظ مثل «المجنون» أو «الممسوس» لما قد تحمله من التباس أو وصم في الاستعمال المعاصر.
