source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: ar
  text: فجاؤوا إلى يسوع، ورأوا الرجل الذي كانت به شياطين جالسًا، مرتديًا ثيابه، وفي كامل وعيه، وهو الذي كان فيه الفيلق[a]، فخافوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لَجِيون» بوصفه اسمًا. والكلمة في أصلها تعني «فيلقًا» رومانيًا، وقد استُعملت قبل ذلك تسميةً لجماعة الشياطين لكثرتها.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχονται
  choice: فجاؤوا
  rationale: المضارع التاريخي اليوناني يُنقل بالماضي في السرد العربي الطبيعي، والواو مع الفاء تحفظ تتابع الحدث.
- source_word: θεωροῦσιν
  choice: ورأوا
  rationale: مضارع تاريخي آخر؛ «رأوا» واضحة وطبيعية، ولا تضيف معنى التدقيق غير اللازم.
- source_word: τὸν δαιμονιζόμενον
  choice: الرجل الذي كانت تسكنه الشياطين
  rationale: الاسم الموصول يعبّر بوضوح عن النعت الاسمي، وصيغة الجمع تلائم السياق الذي يبيّن أن الأرواح كثيرة، من غير اختزال الأمر في مرض نفسي.
- source_word: καθήμενον
  choice: جالسًا
  rationale: ينقل حال الرجل المرئية بإيجاز ومن غير إضافة ظرف مكان غير موجود صراحة في اليونانية.
- source_word: ἱματισμένον
  choice: ولابسًا
  rationale: تعبير عربي طبيعي يدل على أنه صار مرتديًا ثيابًا، في مقابل حاله السابقة.
- source_word: σωφρονοῦντα
  choice: وعاقلًا
  rationale: ينقل معنى سلامة الفكر وضبط النفس بلفظ عربي مألوف غير سريري.
- source_word: ἐσχηκότα
  choice: الذي كان فيه
  rationale: الماضي مع «كان» يبيّن أن هذه حال سابقة تُعرّف الرجل، ويتجنب ثقل الصياغة الحرفية للمشاركة التامة.
- source_word: τὸν λεγιῶνα
  choice: اللَّجْئون
  rationale: تعريب للمصطلح الروماني الذي استُعمل سابقًا تسميةً للجمع الكثير من الشياطين، مع إبقاء إمكان فهمه اسمًا أو لقبًا.
- source_word: ἐφοβήθησαν
  choice: فخافوا
  rationale: ينقل رد الفعل الماضي بإيجاز ووضوح، من غير المبالغة في درجته.
theological_decisions:
- issue: وصف التسلط الشيطاني
  choice: الرجل الذي كانت تسكنه الشياطين
  alternative: الرجل الذي كان به روح نجس؛ الرجل الممسوس بالشياطين
  rationale: السياق يثبت حقيقة التسلط الشيطاني وتعدد الأرواح، والصياغة المختارة واضحة ولا تحوّل الوصف إلى تشخيص طبي ولا تستعمل لفظًا قد يحمل إيحاءات شعبية ملتبسة.
- issue: هل λεγιών اسم علم أم تسمية وصفية؟
  choice: اللَّجْئون مع حاشية
  alternative: لَجْئون بوصفه اسم علم؛ الفيلق
  rationale: اللفظة تحيل إلى التسمية السابقة للأرواح، ويمكن فهمها اسمًا أو لقبًا مستمدًا من الوحدة العسكرية الرومانية؛ لذلك لا يُحسم الاحتمال في المتن بلا تنبيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. روعي إيقاع السرد الطبيعي، ونُقلت الأفعال المضارعة التاريخية إلى الماضي. ضُبط «اللَّجْئون» بالشكل الجزئي لتسهيل قراءة اللفظ المعرَّب، وأُبقي الغموض بين الاسم والتسمية الوصفية في الحاشية.
