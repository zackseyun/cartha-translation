  terminology: يُستحسن استعمال «الفيلق» في المتن بوصفه المقابل العربي الواضح للفظ العسكري اليوناني، مع حاشية تبيّن إمكان فهمه تسميةً/اسمًا («لَجِيون») في السياق السابق. ويحافظ «الرجل الذي كانت به شياطين» على الوصف السردي من دون اختزال أو تفسير طبي.
