  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: ar
  text: وكانوا يضحكون عليه[a]. أمّا هو، فبعد أن أخرج الجميع، أخذ معه أبا الطفلة وأمها والذين كانوا معه[b]، ودخل إلى حيث كانت الطفلة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كانوا يسخرون منه». يمكن أن يدل الفعل اليوناني على ضحك ازدرائي.'
    reason: lexical_alternative
  - marker: b
    text: أي التلاميذ الذين كانوا يرافقونه.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: كانوا يضحكون منه
  rationale: تنقل صيغة الماضي الناقص اليونانية فعلًا مستمرًّا أو متكررًا، وتحافظ على معنى الضحك الازدرائي من غير أن تجعل معنى السخرية الصريح هو الاحتمال الوحيد.
- source_word: ἐκβαλὼν πάντας
  choice: فأخرج الجميع
  rationale: يفيد اسم الفاعل اليوناني حدثًا سابقًا للأفعال الرئيسة. و«أخرج» تعبير عربي طبيعي يحفظ قوة الفعل من غير أن يوحي هنا بطرد الأرواح الشريرة.
- source_word: παραλαμβάνει
  choice: أخذ معه
  rationale: المعنى هو اصطحاب أشخاص مختارين. استُعمل الماضي بما يلائم السرد العربي الطبيعي، بدل نقل المضارع التاريخي اليوناني بصورة متكلفة.
- source_word: παιδίου / παιδίον
  choice: الطفلة
  rationale: اللفظ اليوناني يعني الطفل، وهو محايد نحويًا، لكن السياق المباشر يحدد أنها ابنة يايرس؛ و«الطفلة» هو التعبير العربي الطبيعي الذي لا يسبب التباسًا في جنسها.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: الذين كانوا معه
  rationale: يحافظ على عموم العبارة اليونانية في المتن من غير تسمية المرافقين، مع توضيح هويتهم في الحاشية.
- source_word: εἰσπορεύεται
  choice: دخل
  rationale: ينقل الحركة إلى داخل المكان بعبارة عربية موجزة وطبيعية. حُوّل المضارع التاريخي إلى الماضي اتساقًا مع أسلوب السرد العربي.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: إلى حيث كانت الطفلة
  rationale: يحافظ على بيان المكان البسيط في اليونانية، من غير إضافة أنها كانت راقدة، وهو أمر مفهوم من السياق لكنه غير مصرح به في هذه العبارة.
theological_decisions:
- issue: زمن السرد وحيويته
  choice: 'صياغة الفعلين اليونانيين في المضارع التاريخي بالماضي العربي: «أخذ... ودخل»'
  alternative: 'الإبقاء على المضارع التاريخي: «يأخذ... ويدخل»'
  rationale: يكثر مرقس من المضارع التاريخي لإضفاء الحيوية، لكن الانتقال المفاجئ إلى المضارع هنا أقل طبيعية في العربية المعاصرة. يحفظ الماضي تسلسل الحدث بوضوح من غير تغيير مضمونه.
- issue: تحديد جنس παιδίον
  choice: «الطفلة» بحسب هوية ابنة يايرس المعلنة في السياق
  alternative: «الطفل» للمحافظة الصرفية على حياد اللفظ اليوناني
  rationale: العربية لا تملك في هذا الموضع اسمًا مفردًا محايدًا طبيعيًا يؤدي الوظيفة نفسها؛ وقد يُفهم «الطفل» على أنه ذكر. لذلك يحقق «الطفلة» التكافؤ الدلالي اعتمادًا على السياق الصريح، من غير إضافة هوية غير معروفة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «أمّا هو» لإبراز المقابلة التي تحملها αὐτὸς δὲ، وحُفظت عبارتا الحاشيتين بعلامتي [a] و[b] في موضعيهما من المتن.
