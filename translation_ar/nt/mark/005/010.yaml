  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: ar
  text: وظلّ يتوسّل إليه مرارًا ألّا يرسلهم خارج المنطقة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكان يلحّ عليه كثيرًا ألّا يرسلهم خارج الإقليم».'
    reason: بديل معجمي لـ παρεκάλει πολλὰ يبرز معنى الإلحاح والكثرة، ولـ χώρα بمعنى الناحية أو الإقليم المحلي.
lexical_decisions:
- source_word: παρεκάλει
  choice: أخذ يتوسّل
  rationale: الفعل في سياق إخراج الأرواح يدل على التضرع والطلب الملحّ، و«يتوسّل» ينقل ذلك بوضوح، بينما «أخذ» يلائم صيغة الماضي الناقص الدالة على الاستمرار.
- source_word: πολλὰ
  choice: بإلحاح
  rationale: وردت مفعولًا مطلقًا ذا وظيفة حالية لتقوية فعل التوسل؛ و«بإلحاح» عربية طبيعية تحفظ شدة الطلب من غير حصر المعنى في عدد محدد من المرات.
- source_word: ἵνα μὴ
  choice: ألّا
  rationale: تنقل مضمون الطلب المنفي في تركيب عربي موجز وطبيعي.
- source_word: αὐτὰ
  choice: هم
  rationale: الضمير اليوناني جمع محايد يعود إلى الأرواح النجسة/الشياطين؛ ويستعمل العربية ضمير جمع العقلاء لأنها كائنات شخصية في السياق.
- source_word: ἀποστείλῃ
  choice: يرسل
  rationale: «يرسل» هو المقابل المباشر الطبيعي، ولا يضيف معنى الطرد بالقوة غير المصرح به في الفعل نفسه.
- source_word: ἔξω τῆς χώρας
  choice: إلى خارج المنطقة
  rationale: χώρα هنا هي الناحية أو الإقليم المحلي لا الدولة بمفهومها الحديث؛ و«المنطقة» واضحة للقارئ المعاصر.
theological_decisions:
- issue: انتقال النص بين المتكلم المفرد والضمير الدال على جماعة الشياطين
  choice: إبقاء الفاعل المفرد مستترًا في «يتوسّل» والمفعول جمعًا في «يرسلهم»
  alternative: توحيد العدد وصياغة الكلام كله بصيغة الجمع أو بصيغة الجماعة
  rationale: 'يحفظ هذا التوتر الموجود في اليونانية: متكلم مفرد يتكلم نيابة عن الشياطين الكثيرين، من غير تسوية الانتقال بين المفرد والجمع.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «يتوسّل إليه بإلحاح» لنقل شدة الطلب واستمراره، مع الحفاظ على الانتقال المقصود بين المفرد والجمع.
