source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: ar
  text: 'وفي الحال أدرك يسوع في نفسه أن قوةً قد خرجت منه، فالتفت وسط الجمع وقال: «مَن لمس ثيابي؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: في الحال
  rationale: ينقل الظرف الزمني وحركة السرد السريعة عند مرقس بعبارة عربية طبيعية وفصيحة.
- source_word: ἐπιγνοὺς
  choice: أدرك
  rationale: يفيد وعيًا واضحًا، وتوضّح عبارة «في نفسه» أن الإدراك داخلي.
- source_word: ἐν ἑαυτῷ
  choice: في نفسه
  rationale: ترجمة قريبة تحفظ دلالة الوعي الداخلي من غير إضافة تفسير.
- source_word: δύναμιν
  choice: قوةً
  rationale: يحفظ المعنى الواسع المباشر للكلمة، ولا يقيّده بإضافة «شفائية» أو «معجزية» غير مصرّح بها في النص.
- source_word: ἐξελθοῦσαν
  choice: قد خرجت منه
  rationale: «قد» مع الماضي تبيّن أن خروج القوة سبق إدراك يسوع له، مع الحفاظ على الصياغة الطبيعية.
- source_word: ἐπιστραφεὶς
  choice: فالتفت
  rationale: يدل على استدارته استجابةً لما حدث، وهو تعبير عربي موجز وطبيعي.
- source_word: ἐν τῷ ὄχλῳ
  choice: وسط الجمع
  rationale: يحدّد موقع يسوع بين الناس المحتشدين بوضوح من غير إطالة.
- source_word: ἔλεγεν
  choice: وقال
  rationale: مع أن الصيغة اليونانية ماضية ناقصة، فإن «قال» هي الصيغة العربية الطبيعية لتقديم هذا القول المفرد، ولا يقتضي السياق إبراز الاستمرار أو التكرار.
- source_word: ἥψατο
  choice: لمس
  rationale: المعنى السياقي المباشر للفعل هنا هو اللمس.
- source_word: τῶν ἱματίων
  choice: ثيابي
  rationale: يحفظ الجمع ويقدّم لفظًا عربيًا فصيحًا، واضحًا، وأقرب إلى السجل الموقر من «ملابسي».
theological_decisions:
- issue: إدراك يسوع أن قوة خرجت منه
  choice: 'الإبقاء على التقرير السردي المباشر: «أدرك يسوع في نفسه أن قوةً قد خرجت منه»'
  alternative: تفسير العبارة بأنها «قوة شفاء»، أو عرضها بوصفها مجرد إحساس ذاتي
  rationale: النص يقرر خروج قوة وإدراك يسوع لذلك، من غير شرح لطبيعة هذه القوة أو آلية الشفاء؛ لذا تُحفظ دلالته ولا يُضاف إليه تحديد عقائدي أو تفسير آلي.
translation_notes:
  register: 'عربية فصحى حديثة واضحة وموقرة. اختيرت تراكيب مألوفة للقارئ المعاصر مع الحفاظ على توالي الحدث، وعلى العبارة اللاهوتية كما وردت بلا توسع تفسيري. لم تُدرج حاشية لأن بيانات الحاشية الإنجليزية غير متسقة: علامتها موضوعة بعد «Jesus» بينما نصها «Or my garments»، ولا توجد في الأصل هنا قراءة بديلة تستلزم حاشية.'
