  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: «وفي الحال» لـ εὐθὺς، و«أدرك ... في نفسه» للوعي الداخلي في ἐπιγνοὺς ἐν ἑαυτῷ، و«قوةً قد خرجت منه» للدلالة على δύναμιν ἐξελθοῦσαν، ثم الالتفات وسط الجمع والسؤال عن لمس الثياب. لا يضيف تفسيرًا لطبيعة القوة.'
  naturalness: الصياغة فصيحة حديثة وسلسة، وتسلسلها السردي واضح. «فالتفت وسط الجمع» و«مَن لمس ثيابي؟» طبيعيان ومناسبان للسجل النصي.
  terminology: «قوة» تحفظ اتساع δύναμις بلا تخصيص تفسيري، و«ثيابي» تمثل جمع ἱματίων بلفظ عربي فصيح. اسم «يسوع» والاستفهام المباشر مناسبان. لا يلزم نقل الحاشية الإنجليزية؛ فهي غير متسقة في موضع علامتها ومضمونها ولا تقابل تباينًا نصيًا أو ضرورة تفسيرية في العربية.
