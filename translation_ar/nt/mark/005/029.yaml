  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: ar
  text: وفي الحال جفَّ منبع دمها[a]، وأدركت في جسدها أنها قد شُفيت من ذلك البلاء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «ينبوع دمها»؛ يستخدم اليوناني صورة حية للينبوع أو المصدر، والمقصود مصدر نزفها.
    reason: lexical_alternative
  - marker: b
    text: حرفيًا «السوط»؛ وقد استُعملت الكلمة هنا بمعنى البلاء أو العلة المؤلمة.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: في الحال
  rationale: تعبير عربي واضح يحفظ دلالة الفورية والإيقاع السريع في سرد مرقس.
- source_word: ἐξηράνθη
  choice: جفَّ
  rationale: يحفظ الصورة الحسية في الفعل اليوناني، بدل الاكتفاء بالتفسير «توقّف».
- source_word: πηγὴ τοῦ αἵματος αὐτῆς
  choice: منبع دمها
  rationale: يحافظ على صورة الينبوع أو المنبع الواردة في اليونانية، مع صياغة عربية موجزة ومفهومة؛ والمقصود في السياق مصدر النزف.
- source_word: ἔγνω τῷ σώματι
  choice: أدركت في جسدها
  rationale: «أدركت» تنقل المعرفة والوعي، و«في جسدها» تحفظ الطابع الجسدي للإدراك من غير اختزاله إلى مجرد شعور.
- source_word: ἴαται
  choice: قد شُفيت
  rationale: «قد» مع الماضي تعبّر عن اكتمال الشفاء وثبوت نتيجته، بما يلائم صيغة التمام اليونانية.
- source_word: ἀπὸ τῆς μάστιγος
  choice: من ذلك البلاء
  rationale: μάστιξ تعني حرفيًا السوط، وتُستعمل مجازًا للبلاء الشديد؛ و«البلاء» يحفظ شدة التعبير من غير أن يوهم بجلد حرفي.
theological_decisions:
- issue: طبيعة الشفاء المذكور
  choice: عرض توقف النزف وإدراك المرأة الجسدي للشفاء بوصفهما أمرين حقيقيين وفوريين.
  alternative: صياغة تجعل الكلام مجرد إحساس ذاتي بالتحسن.
  rationale: النص اليوناني يجمع بين التغير الجسدي الموضوعي ومعرفة المرأة به، من غير أن يشرح آلية الشفاء أو يضيف حكمًا عقائديًا.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. حُفظت صورة «المنبع» وقوة «البلاء»، مع تجنب التعبير الطبي المتخصص أو التفسير العقائدي الزائد.
