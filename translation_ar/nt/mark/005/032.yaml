lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف يحفظ تتابع السرد من غير إضافة معنى استنتاجي.
- source_word: περιεβλέπετο
  choice: ظلَّ يتلفَّت حوله
  rationale: صيغة الماضي الناقص تدل على فعل مستمر، والفعل المركب يفيد النظر في الجهات المحيطة.
- source_word: ἰδεῖν
  choice: ليرى
  rationale: مصدر غرضي بعد فعل النظر، وترجمته المباشرة والطبيعية هي «ليرى».
- source_word: τὴν ... ποιήσασαν
  choice: التي فعلت
  rationale: أداة التعريف واسم الفاعل كلاهما مؤنثان، وتؤدي «التي» هذا التحديد من غير إدخال اسم «المرأة» غير المذكور صراحة.
- source_word: τοῦτο
  choice: هذا
  rationale: اسم إشارة يعود إلى الفعل المذكور في السياق السابق، و«هذا» موجزة وواضحة.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «ظلَّ» لإظهار استمرار الفعل، و«يتلفَّت حوله» لنقل معنى النظر في الجهات المحيطة. أُبقي المرجع مؤنثًا من غير إضافة اسم غير مصرَّح به في اليونانية.
