lexical_decisions:
- source_word: ἔρχονται
  choice: يأتون
  rationale: حُفظ المضارع التاريخي لإبراز حيوية السرد، وهو يصف وصولهم إلى البيت في المشهد.
- source_word: οἶκον
  choice: بيت
  rationale: المقابل العربي المباشر والطبيعي هنا، من غير إضافة إيحاءات لا يقتضيها الأصل.
- source_word: ἀρχισυναγώγου
  choice: رئيس المجمع
  rationale: لقب يدل على المسؤول القيادي في المجمع اليهودي، وهذه صياغة عربية واضحة ومألوفة.
- source_word: θεωρεῖ
  choice: يرى
  rationale: فعل مفرد يعود طبيعيًا في السياق إلى يسوع؛ واختيار «يرى» مباشر ويحفظ المضارع التاريخي.
- source_word: θόρυβον
  choice: جلبة
  rationale: تدل الكلمة في هذا السياق على ضوضاء واضطراب مصاحبين للندب، لا على مجرد صوت.
- source_word: κλαίοντας
  choice: أناسًا يبكون
  rationale: اسم الفاعل مستعمل استعمالًا اسميًا؛ وإظهار «أناسًا» يجعل العبارة طبيعية في العربية.
- source_word: ἀλαλάζοντας
  choice: ينوحون
  rationale: يفيد الفعل الصراخ المرتفع في سياق الرثاء، و«ينوحون» ملائم لمشهد الحداد.
- source_word: πολλά
  choice: بصوت عالٍ
  rationale: تؤدي الكلمة وظيفة حالية تقوّي فعل النواح؛ وهذه الصياغة تنقل شدته طبيعيًا في العربية.
