lexical_decisions:
- source_word: ἦν δὲ
  choice: وكان
  rationale: تنقل الفعل الوجودي مع أداة الربط السردية الخفيفة δέ من غير إقحام معنى زمني صريح.
- source_word: ἐκεῖ
  choice: هناك
  rationale: مقابل مكاني مباشر وطبيعي في العربية المعاصرة.
- source_word: πρὸς τῷ ὄρει
  choice: عند الجبل
  rationale: تفيد العبارة مع حالة المجرور المكاني القرب أو المحاذاة؛ و«عند الجبل» تحافظ على ذلك من غير تحديد مفرط.
- source_word: ἀγέλη
  choice: قطيع
  rationale: اللفظ العربي المعتاد لجماعة من الحيوانات.
- source_word: χοίρων
  choice: من الخنازير
  rationale: ترجمة واضحة وحديثة للاسم، مع بيان نوع القطيع.
- source_word: μεγάλη
  choice: كبير
  rationale: يصف حجم القطيع أو كثرة عدده بصورة طبيعية.
- source_word: βοσκομένη
  choice: يرعى
  rationale: ينقل اسم الفاعل الحاضر الدال على كون القطيع في حال الرعي؛ وإسناد المفرد إلى «قطيع» فصيح وطبيعي.
