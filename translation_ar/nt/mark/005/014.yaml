    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες αὐτούς
  choice: رعاة الخنازير
  rationale: يدل اسم الفاعل مع الضمير العائد إلى خنازير الآية السابقة على القائمين برعايتها. والتصريح بالخنازير طبيعي في العربية ويزيل غموض الضمير من غير تغيير المعنى.
- source_word: ἔφυγον
  choice: هرب
  rationale: ينقل الفعل حركة الفرار المفاجئة بقوة سردية واضحة.
- source_word: ἀπήγγειλαν
  choice: أخبروا بما حدث
  rationale: يفيد الفعل نقل الخبر، وعبارة «بما حدث» توضح مضمون الإخبار المفهوم من السياق.
- source_word: εἰς τὴν πόλιν
  choice: في المدينة
  rationale: مع فعل الإخبار، تفيد العبارة موضع نشر الخبر، وهذا هو التعبير العربي الطبيعي.
- source_word: εἰς τοὺς ἀγρούς
  choice: في الأرياف
  rationale: لفظة ἀγροί تعني حرفيًا الحقول، لكنها في مقابل المدينة تشير هنا على الأرجح إلى المناطق الريفية المحيطة بها.
- source_word: ἦλθον
  choice: جاء الناس
  rationale: الفاعل الجمع مستتر في اليونانية، والسياق يشير إلى الذين بلغهم الخبر في المدينة والأرياف؛ وذكر «الناس» يجعل العربية واضحة من غير تخصيص زائد.
- source_word: ἰδεῖν
  choice: ليروا
  rationale: مصدر غرض بعد فعل المجيء، وصيغته العربية الطبيعية هي لام التعليل مع المضارع.
- source_word: τί ἐστιν τὸ γεγονός
  choice: ما جرى
  rationale: تؤدي العبارة معنى التحقق من الأمر الذي وقع، في صياغة عربية موجزة وطبيعية.
