base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: ar
  text: وشدّد عليهم كثيرًا ألا يعلم أحدٌ بهذا، وقال أن تُعطى شيئًا لتأكله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أن تُعطى لتأكل»؛ والمفعول به («شيئًا») مفهوم من السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο ... πολλὰ
  choice: أوصاهم بشدة
  rationale: الفعل في هذا السياق يفيد توجيه وصية أو أمر مؤكد، وتأتي πολλὰ لتقوية شدته؛ وهذه الصياغة عربية طبيعية تحفظ قوة التعبير اليوناني.
- source_word: αὐτοῖς
  choice: هم في «أوصاهم»
  rationale: ضمير الداتيف يشير إلى الحاضرين، وأُدمج في الفعل على نحو طبيعي في العربية.
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: ألا يعرف أحد بهذا
  rationale: تحفظ الصياغة غاية الوصية ومضمونها من غير إضافة تفسير لسبب الكتمان، ويؤدي «بهذا» معنى الإشارة إلى ما حدث.
- source_word: εἶπεν
  choice: قال
  rationale: ترجمة مباشرة للفعل، من غير تقويته إلى «أمر» رغم أن السياق يحمل معنى التوجيه.
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: أن يُعطى لها شيءٌ لتأكله
  rationale: تحفظ الصيغة المبنية للمجهول، وتُظهر المفعول المفهوم «شيء» كي يستقيم التعبير العربي؛ أما «لتأكله» فتنقل غرض العطاء بوضوح.
theological_decisions:
- issue: نطاق وصية الكتمان وعلاقتها بموضوع السر المسياني
  choice: إبقاء الوصية القوية بألا يعرف أحد بالحدث من دون تفسير لسببها أو مداها
  alternative: تقييد الوصية صراحة بالأسرة أو شرحها بوصفها جزءًا من موضوع السر في إنجيل مرقس
  rationale: النص نفسه يذكر الوصية ولا يشرح دوافعها أو يوسع دلالتها اللاهوتية؛ لذلك تُحفظ حالة التوتر كما هي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «أوصاهم بشدة» لنقل قوة العبارة من غير تعبير قديم، وحُفظ البناء للمجهول في الجملة الأخيرة.
