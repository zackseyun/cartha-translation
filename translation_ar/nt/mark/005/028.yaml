  text: ἔλεγεν γὰρ ὅτι ⸂Ἐὰν ἅψωμαι κἂν τῶν ἱματίων αὐτοῦ⸃ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: ar
  text: 'لأنها كانت تقول: «إن لمستُ ولو ثيابه، فسأُشفى[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «فسأخلُص». يمكن أن يعني الفعل اليوناني «يخلُص» أو «يُشفى» أو «يصير معافى»؛ والسياق هنا يشير إلى الشفاء الجسدي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: كانت تقول
  rationale: يحفظ صيغة الماضي الناقص الدالة على قول مستمر أو متكرر، من غير حسم هل كان منطوقًا أم حديثًا في النفس.
- source_word: γὰρ
  choice: لأنها
  rationale: تربط العبارة بما قبلها بوصفها تفسيرًا لفعل المرأة، وهي صياغة عربية طبيعية.
- source_word: ὅτι
  choice: علامتا الاقتباس المباشر
  rationale: تُدخل الأداة اليونانية مضمون قولها، والاقتباس المباشر أوضح في العربية.
- source_word: ἐὰν ἅψωμαι
  choice: إن لمستُ
  rationale: ينقل الشرط مع الفعل الاحتمالي بصورة عربية فصيحة وطبيعية.
- source_word: κἂν
  choice: ولو
  rationale: تفيد التقليل والتوكيد بمعنى «حتى لو لم ألمس إلا»، وتحفظ معنى الاكتفاء بأدنى تماس.
- source_word: τῶν ἱματίων αὐτοῦ
  choice: ثيابه
  rationale: الاسم جمع ويشير عمومًا إلى الملابس؛ و«ثيابه» دقيقة وفصيحة من غير تخصيصه برداء واحد.
- source_word: σωθήσομαι
  choice: فسأُشفى
  rationale: السياق المباشر هو الشفاء الجسدي من النزف، لكن يُحفظ الاتساع الدلالي للفعل اليوناني في الحاشية.
theological_decisions:
- issue: دلالة σωθήσομαι في سياق الشفاء
  choice: فسأُشفى
  alternative: فسأخلُص / فسأصير معافاة
  rationale: الشفاء الجسدي هو المعنى الأوضح في السياق، مع عدم طمس إمكان دلالة الفعل على الخلاص؛ لذلك ذُكر البديل في الحاشية بدل فرض معنى لاهوتي واحد على المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «ثيابه» لجمع ἱμάτια، و«ولو» لنقل معنى الحد الأدنى في κἂν. وُضعت علامة الحاشية بعد «فسأُشفى» لأنها تتعلق بهذا اللفظ تحديدًا.
