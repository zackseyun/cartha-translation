  source_fidelity: 'ينقل النص بدقة البنية الأساسية لليونانية: «كانت تقول» يحفظ دلالة الماضي الناقص في ἔλεγεν، و«لأنها» تؤدي γάρ التفسيري، و«إن لمستُ» ينقل الشرط المتوقع، و«ولو ثيابه» يحفظ تقليل κἄν مع جمع ἱματίων، و«فسأُشفى» مناسب للسياق العلاجي المباشر لفعل σωθήσομαι.'
  naturalness: الصياغة فصيحة وواضحة في العربية المعيارية الحديثة. تركيب «إن لمستُ ولو ثيابه» طبيعي ويعبّر بإيجاز عن الاكتفاء بأدنى تماس، وعلامات الاقتباس والترقيم سليمة.
  terminology: «ثيابه» مقابِل دقيق وغير متكلّف لـἱματίων من غير تخصيص نوع لباس. و«فسأُشفى» يقدّم المعنى السياقي، بينما تحفظ الحاشية المجال الدلالي الأوسع لـσωθήσομαι بصورة متوازنة وغير تقريرية لاهوتيًا.
