lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: كانت قد عانت كثيرًا
  rationale: ينقل اسم الفاعل الماضي بوصفه حالًا سابقًا ضمن سلسلة الأحداث، ويحفظ معنى المعاناة بصياغة عربية طبيعية.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: على أيدي أطباء كثيرين
  rationale: يعبّر عن الوكالة أو المصدر مع إبقاء الصلة بعلاجات الأطباء واضحة، من غير الجزم بأن المقصود إدانة الأطباء أخلاقيًا.
- source_word: δαπανήσασα
  choice: وأنفقت
  rationale: يحفظ معنى الإنفاق وعلاقة الفعل المتتابعة بما قبله، بلا إضافة معنى أقوى مثل استنفاد قسري.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: كل ما لديها
  rationale: تعبير عربي مألوف ودقيق عمّا كان في حوزتها أو تحت تصرفها كله.
- source_word: μηδὲν ὠφεληθεῖσα
  choice: ولم تنتفع شيئًا
  rationale: يحفظ دلالة المبني للمجهول من حيث تلقي المنفعة، ويؤكد انعدام الفائدة تمامًا.
- source_word: ἀλλὰ μᾶλλον
  choice: بل
  rationale: أداة استدراك وتصعيد طبيعية في العربية، تنقل الانتقال من عدم النفع إلى النتيجة الأسوأ.
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: ازدادت حالها سوءًا
  rationale: صياغة عربية واضحة للتعبير الاصطلاحي الدال على الانتقال إلى حالة أسوأ.
