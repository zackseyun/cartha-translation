base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: ar
  text: 'وأمسك بيد الطفلة وقال لها: «طَليثا قُوم»، أي: «يا صبيّة، أقول لكِ: قومي».[a]'
  philosophy: optimal-equivalence
  footnotes:
