    text: تَرِد كتابة العبارة الآرامية بصور مختلفة في الترجمات، ومنها «طليثا قومي». أمّا النص اليوناني هنا فيقرأ κουμ، ولذلك نُقلت «قُوم».
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: وأمسك بيد الطفلة
  rationale: ينقل التركيب فعل الإمساك باليد بصورة طبيعية وواضحة في العربية، مع إبقاء الفعل المصاحب سابقًا للقول.
- source_word: λέγει αὐτῇ
  choice: وقال لها
  rationale: استُخدم الماضي الطبيعي في السرد العربي بدل محاكاة الحاضر التاريخي اليوناني محاكاة قد تبدو متكلفة.
- source_word: Ταλιθα κουμ
  choice: طَليثا قُوم
  rationale: حُفظت العبارة الآرامية منقولة صوتيًا كما حفظها النص اليوناني، ثم أُتبعت بتفسير مرقس نفسه. وكتابة «قُوم» تقارب قراءة κουμ.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: أي
  rationale: أداة تفسير عربية موجزة وطبيعية تؤدي وظيفة بيان معنى العبارة الآرامية.
- source_word: Τὸ κοράσιον
  choice: يا صبيّة
  rationale: تنقل كون المخاطَبة فتاة صغيرة، وتلائم النداء المباشر دون مبالغة في التصغير.
- source_word: σοὶ λέγω
  choice: أقول لكِ
  rationale: أُبقي الضمير الصريح والتوكيد الموجود في اليونانية، مع إظهار التأنيث في الضبط.
- source_word: ἔγειρε
  choice: قومي
  rationale: أمر عربي مباشر وطبيعي يعبّر هنا عن النهوض، ويحافظ على خطاب المؤنث.
theological_decisions:
- issue: إبقاء كلام يسوع الآرامي في المتن
  choice: إثبات «طَليثا قُوم» ثم إيراد تفسير مرقس
  alternative: 'الاكتفاء بالترجمة العربية: «يا صبيّة، أقول لكِ: قومي»'
  rationale: النص المصدر نفسه يحفظ اللفظ الآرامي ثم يفسره؛ وإبقاء العنصرين يصون النسيج السردي ولا يحجب المعنى.
- issue: دلالة ἔγειρε في سياق إقامة الفتاة
  choice: قومي
  alternative: انهضي أو استيقظي
  rationale: «قومي» تحافظ على المعنى المباشر للأمر بالنهوض من غير أن تحسم وحدها ما إذا كان التركيز اللفظي على الاستيقاظ أو القيام الجسدي؛ والسياق الأوسع يبيّن الحدث.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. اختير الماضي للسرد الطبيعي، وحُفظت العبارة الآرامية مع شرحها. وُضع مؤشر الحاشية بعد الجملة التي تتضمن اللفظ محل التعليق.
