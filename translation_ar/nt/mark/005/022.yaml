  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: ar
  text: فجاء[a] أحدُ رؤساء المجمع اليهودي، واسمه يايرس، ولما رآه خرَّ عند قدميه.
  philosophy: optimal-equivalence
