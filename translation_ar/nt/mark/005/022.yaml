    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: فجاء
  rationale: الفعل مضارع تاريخي في اليونانية يُستعمل لإضفاء الحيوية على السرد؛ وصيغة الماضي أنسب للسرد العربي الطبيعي، مع نقل καί بالفاء لارتباط الحدث بما قبله.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: أحدُ رؤساء المجمع اليهودي
  rationale: تحفظ «أحد» معنى التركيب التبعي «واحد من»، ويشير ἀρχισυνάγωγος إلى مسؤول أو رئيس في إدارة المجمع. وأضيفت صفة «اليهودي» لتوضيح المقصود بكلمة «المجمع» للقارئ المعاصر.
- source_word: ὀνόματι Ἰάϊρος
  choice: واسمه يايرس
  rationale: صياغة عربية طبيعية وموجزة لعبارة التسمية اليونانية، مع نقل الاسم نقلًا صوتيًا مألوفًا.
- source_word: ἰδὼν αὐτὸν
  choice: ولما رآه
  rationale: تؤدي الجملة الزمنية معنى اسم الفاعل اليوناني الماضي وتوضح تعاقب الفعلين من غير زيادة تفسيرية.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: خرَّ عند قدميه
  rationale: «خرَّ» ينقل السقوط المقصود أمام شخص، و«عند قدميه» تعبير عربي طبيعي يحفظ الصورة من غير تحويلها إلى وصف صريح للعبادة.
theological_decisions:
- issue: دلالة سقوط يايرس أمام يسوع
  choice: خرَّ عند قدميه
  alternative: سجد له
  rationale: النص يصف حركة جسدية قد تدل على التوقير أو التوسل أو شدة الضيق، لكنه لا يستعمل هنا لفظًا صريحًا للعبادة؛ لذلك تُحفظ الدلالة مفتوحة من غير حسم لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل الماضي للسرد الطبيعي، مع إبقاء صورة السقوط عند القدمين والضمير في «رآه» كما في المصدر، من غير شرح زائد داخل المتن.
