  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: ar
  text: ولم يسمح لأحد أن يرافقه إلا بطرس ويعقوب ويوحنا أخا يعقوب.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: سمح
  rationale: مع المصدر هنا يفيد الفعل الإذن؛ و«سمح» تعبير عربي طبيعي يحفظ معنى أن يسوع لم يأذن للآخرين بمرافقته.
- source_word: οὐδένα
  choice: لأحد
  rationale: جاءت في سياق النفي «لم يسمح لأحد»، فتنقل شمول المنع بوضوح وطبيعية في العربية.
- source_word: μετ’ αὐτοῦ συνακολουθῆσαι
  choice: أن يرافقه
  rationale: يجمع هذا التعبير معنى المصاحبة الوارد في الفعل المركب والعبارة «معه»، من غير تكرار ثقيل.
- source_word: εἰ μὴ
  choice: إلا
  rationale: تدل العبارة هنا على الاستثناء لا الشرط، و«إلا» هي المقابل العربي المباشر والطبيعي.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: بطرس ويعقوب ويوحنا
  rationale: استُخدمت الصيغ العربية المألوفة للأسماء، مع الحفاظ على عطف الأسماء المتكرر في اليونانية.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: أخا يعقوب
  rationale: عبارة بدل أو وصف توضيحي تعيّن يوحنا المقصود، وتحافظ بإيجاز على البنية والمعنى في الأصل.
theological_decisions: []
