  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: ar
  text: 'وكان يتوسّل إليه بإلحاح قائلًا: «ابنتي الصغيرة على وشك الموت. تعال وضع يديك عليها لكي تُشفى[a] وتحيا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تخلُص» أو «تنجو». يمكن أن يعني الفعل اليوناني الخلاص أو الإنقاذ أو الشفاء؛ والسياق المباشر هنا هو الشفاء الجسدي.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ αὐτὸν πολλὰ
  choice: يتوسّل إليه بإلحاح
  rationale: يفيد الفعل هنا طلبًا ملحًّا نابعًا من الضيق، وتعمل πολλὰ على تقوية الالتماس؛ وهذه الصياغة طبيعية وتحفظ شدة الرجاء.
- source_word: θυγάτριόν μου
  choice: ابنتي الصغيرة
  rationale: يحفظ التصغير في θυγάτριον دلالة صغر السن ونبرة الحنان من غير مبالغة.
- source_word: ἐσχάτως ἔχει
  choice: على وشك الموت
  rationale: تعبير اصطلاحي يدل هنا على بلوغ الحالة حدّها الأخير واقتراب الموت.
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: تعال وضع يديك عليها
  rationale: يؤدي اسم الفاعل اليوناني في سياق الطلب بصيغة أمر عربية طبيعية، ويحفظ جمع «اليدين» في الأصل.
- source_word: σωθῇ
  choice: تخلُص
  rationale: يحفظ المجال الدلالي الواسع للفعل σῴζω، الذي قد يعني الإنقاذ أو الخلاص أو الشفاء، مع بيان المعنى السياقي المحتمل في الحاشية.
- source_word: ζήσῃ
  choice: تحيا
  rationale: ينقل المعنى المباشر للفعل، ويبيّن النتيجة المرجوة من إنقاذها أو شفائها.
theological_decisions:
- issue: دلالة σωθῇ في سياق طلب الشفاء
  choice: تخلُص
  alternative: تُشفى / تتعافى
  rationale: السياق الجسدي يرجّح معنى الشفاء، لكن لفظ الأصل أوسع من ذلك. أبقى النص الرئيسي هذا الاتساع والارتباط المعجمي بالخلاص، وتوضح الحاشية البديل السياقي من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «يتوسّل بإلحاح» لإظهار شدة الطلب، و«تخلُص» لحفظ اتساع اللفظ اليوناني مع حاشية تمنع التباس المقصود السياقي.
