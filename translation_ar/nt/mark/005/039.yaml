source:
  edition: SBLGNT
  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: ar
  text: 'وبعد أن دخل، قال لهم: «لماذا تضجّون وتبكون؟ لم تمت الطفلة، بل هي نائمة».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم تمت الطفلة، بل تنام». وقد يكون يسوع قد استعمل النوم هنا مجازًا عن الموت، بالنظر إلى إقامتها الوشيكة.'
    reason: بديل معجمي مع بيان بقاء المجاز محتملًا
lexical_decisions:
- source_word: εἰσελθὼν
  choice: بعد أن دخل
  rationale: اسم الفاعل اليوناني في صيغة الماضي يسبق الفعل الرئيس، وتؤدي العبارة العربية العلاقة الزمنية بوضوح وطبيعية.
- source_word: λέγει
  choice: قال
  rationale: المضارع التاريخي شائع في سرد مرقس، لكن الماضي هو الأسلوب الطبيعي الواضح في السرد العربي، من غير تغيير في الحدث.
- source_word: Τί
  choice: لماذا
  rationale: تؤدي قوة الاستفهام في هذا السياق، إذ يسأل عن سبب الضجيج والبكاء.
- source_word: θορυβεῖσθε
  choice: تضجّون
  rationale: ينقل الفعل معنى إحداث ضوضاء واضطراب مسموع، بلفظ عربي موجز وطبيعي يلائم مشهد النواح.
- source_word: κλαίετε
  choice: تبكون
  rationale: لفظ عربي واضح وكريم لا يبالغ في تخصيص البكاء بأنه نواح طقسي.
- source_word: παιδίον
  choice: الطفلة
  rationale: اللفظ اليوناني يعني الطفل، لكن المرجع في السياق فتاة معلومة؛ والتأنيث طبيعي في العربية ولا يضيف هوية غير موجودة في السياق.
- source_word: οὐκ ἀπέθανεν
  choice: لم تمت
  rationale: ينقل الفعل اليوناني الدال على وقوع الموت مباشرة، من دون تحويله إلى مجرد وصف للحالة مثل «ليست ميتة».
- source_word: καθεύδει
  choice: هي نائمة
  rationale: يحافظ على لغة النوم كما وردت، من غير تفسيرها أو إزالة احتمال استعمالها المجازي.
theological_decisions:
- issue: هل كلام يسوع إنكار حرفي للموت أم استعمال مجازي للنوم في ضوء الإقامة الوشيكة؟
  choice: 'الإبقاء على المقابلة المباشرة: «لم تمت الطفلة، بل هي نائمة».'
  alternative: لم تمت الطفلة موتًا نهائيًا، بل هي كالنائمة.
  rationale: النص اليوناني يترك العبارة حادة ومفتوحة دلاليًا؛ لذلك لا تحسم الترجمة هل الكلام حرفي أو مجازي أو استباقي، ولا تضيف قيدًا تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل الماضي في السرد لسلامة الأسلوب العربي، وحُفظت المقابلة اللاهوتية بين الموت والنوم من غير تفسير داخل المتن.
