source:
  edition: SBLGNT
  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: ar
  text: 'وتوسّلوا إليه قائلين: «أرسلنا إلى الخنازير لندخل فيها».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: توسّلوا
  rationale: يفيد الفعل هنا طلبًا ملحًّا، و«توسّلوا» تعبير عربي واضح يحفظ قوة الالتماس في السياق.
- source_word: αὐτὸν
  choice: إليه
  rationale: الضمير يعود إلى يسوع، ومع الفعل «توسّل» تأتي الصياغة العربية الطبيعية بحرف الجر «إلى».
- source_word: λέγοντες
  choice: قائلين
  rationale: يحفظ صيغة الحال في اليونانية ويقدّم مضمون التوسّل بسلاسة.
- source_word: Πέμψον
  choice: أرسلنا
  rationale: ينقل المعنى الصريح للفعل πέμπω، أي الإرسال، من غير استبداله بتفسير ضمني مثل «اسمح لنا».
- source_word: ἡμᾶς
  choice: نا
  rationale: ضمير المتكلمين الجمع في محل المفعول به، ملحق بالفعل «أرسل» وفق العربية الطبيعية.
- source_word: εἰς τοὺς χοίρους
  choice: إلى الخنازير
  rationale: يحتمل εἰς مع فعل الإرسال معنى الاتجاه إلى الخنازير، بينما يصرّح الشطر التالي بالدخول فيها؛ وهذه الصياغة تتجنب تكرار «في» وتحفظ تدرج العبارة اليونانية.
- source_word: ἵνα
  choice: لـ
  rationale: لام التعليل تعبّر بإيجاز ووضوح عن الغاية التي تقدّمها ἵνα.
- source_word: εἰς αὐτοὺς εἰσέλθωμεν
  choice: لندخل فيها
  rationale: ينقل معنى الدخول إلى الخنازير، واستُعمل «فيها» لأن «الخنازير» لغير العاقل ويعود عليها ضمير جمع غير العاقل في العربية الفصيحة.
theological_decisions:
- issue: طبيعة طلب الأرواح من يسوع
  choice: صُوّر المتكلمون وهم يتوسّلون إلى يسوع أن يرسلهم إلى الخنازير، بما يُظهر خضوعهم لسلطانه في سياق الرواية.
  alternative: صياغة أخف مثل «طلبوا منه» قد تعرض الأمر على أنه مجرد طلب انتقال من غير إبراز شدة الالتماس.
  rationale: «توسّلوا» و«أرسلنا» يعكسان قوة الفعل وصيغة الأمر في النص، من غير إضافة تقرير عقائدي يتجاوز الرواية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. حُفظ التركيب القريب من اليونانية في «قائلين»، مع اعتماد «إلى الخنازير» ثم «لندخل فيها» للتمييز بين جهة الإرسال وغاية الدخول. لا يحتاج النص إلى حاشية؛ فالحاشية الإنجليزية المقترحة «into the swine» لا تتصل بموضع αὐτόν كما يوحي مؤشرها، كما أن البديل المعجمي الإنجليزي لا يقتضي تنبيهًا عربيًا.
