  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «توسّلوا» تؤدي قوة παρεκάλεσαν، و«إليه» صياغة عربية سليمة لمفعول الفعل، و«قائلين» تحفظ وظيفة λέγοντες، و«أرسلنا» تنقل Πέμψον دون تحويله إلى مجرد إذن. كما أن «إلى الخنازير لندخل فيها» يحافظ على جهة الإرسال ثم غاية الدخول، مع عود الضمير المفرد المؤنث لغير العاقل الجمع على وجه فصيح.'
  naturalness: الصياغة فصيحة واضحة ومناسبة للسرد الكتابي الحديث. «وتوسّلوا إليه قائلين» و«لندخل فيها» طبيعيان، ولا توجد ركاكة أو التباس مؤثر.
  terminology: «الخنازير» مقابل دقيق وطبيعي لـ χοίρους، و«توسّلوا» مناسب لشدة الالتماس في السياق من غير إضافة تفسير عقدي. لا تستلزم حاشية الإنجليزية الخاصة ببديل swine مقابلاً عربيًا؛ إذ لا يوجد بديل عربي لازم للبيان هنا.
