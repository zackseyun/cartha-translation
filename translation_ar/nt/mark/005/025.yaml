  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: ar
  text: وكانت هناك امرأة تعاني نزيفًا منذ اثنتي عشرة سنة،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «سيلان دم»؛ ويمكن أن تترجم: «نزفًا» أو «نزف دم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وكانت
  rationale: تربط الآية بما قبلها وتحافظ على أسلوب مرقس المتتابع، مع صياغة عربية طبيعية.
- source_word: γυνὴ
  choice: امرأة
  rationale: اسم نكرة يُدخل شخصية جديدة في السرد، وتؤدي «هناك» هذا المعنى بوضوح في العربية.
- source_word: οὖσα
  choice: تعاني
  rationale: تنقل حالة مستمرة لا مجرد وجود، ويلائمها ذكر مدة الاثنتي عشرة سنة.
- source_word: ἐν ῥύσει αἵματος
  choice: نزيفًا
  rationale: تعبير عربي واضح وطبيعي عن حالة سيلان الدم، من غير تحديد طبي لا يصرح به الأصل.
- source_word: δώδεκα ἔτη
  choice: منذ اثنتي عشرة سنة
  rationale: ينقل امتداد الحالة عبر اثنتي عشرة سنة بصياغة عربية مألوفة.
