lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: تحافظ الواو على الوصل السردي البسيط في اليونانية من غير إضافة دلالة زمنية صريحة.
- source_word: ἤρξαντο
  choice: بدأوا
  rationale: تنقل المعنى الابتدائي للفعل مع المصدر نقلاً مباشرًا وطبيعيًا.
- source_word: παρακαλεῖν
  choice: يتوسّلون إليه
  rationale: يعكس التوسلُ الإلحاحَ وقوة الطلب في السياق، مع إبقاء «يطلبون منه بإلحاح» بديلاً ممكنًا.
- source_word: αὐτὸν
  choice: إليه
  rationale: الضمير يعود إلى يسوع، وصيغة «يتوسّلون إليه» هي الصياغة العربية الطبيعية.
- source_word: ἀπελθεῖν
  choice: أن يرحل
  rationale: يفيد مغادرة المكان، وهو تعبير عربي واضح وملائم للسياق السردي.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: عن منطقتهم
  rationale: ὅρια جمع يدل حرفيًا على الحدود، لكنه في هذا التركيب يشير إلى الأرض أو النطاق الواقع داخلها؛ و«منطقتهم» تنقل المعنى الطبيعي.
