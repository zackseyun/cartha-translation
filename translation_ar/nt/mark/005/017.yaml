  text: And they began to beg him to leave their region[a].
translation:
  language: ar
  text: وبدأوا يتوسّلون إليه أن يرحل عن منطقتهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يطلبون منه بإلحاح أن يغادر أرضهم».'
