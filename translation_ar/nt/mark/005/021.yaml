  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: ar
  text: وبعدما عبر يسوع في القارب مرة أخرى إلى الضفة الأخرى، اجتمع حوله جمع كبير، وكان عند البحر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي بحر الجليل، وهو بحيرة جرت العادة في الأناجيل على تسميتها «بحرًا».
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: وبعدما عبر
  rationale: اسم الفاعل الأوريستي في تركيب المضاف إليه المطلق يدل هنا على حدث سابق؛ و«بعدما عبر» تنقل التعاقب الزمني بوضوح وطبيعية.
- source_word: ἐν τῷ πλοίῳ
  choice: في القارب
  rationale: يحافظ على حرفية شبه الجملة، و«القارب» أنسب لسياق الرواية وأوضح للقارئ المعاصر من «السفينة».
- source_word: πάλιν
  choice: مرة أخرى
  rationale: ينقل معنى تكرار الفعل بعبارة عربية طبيعية.
- source_word: εἰς τὸ πέραν
  choice: إلى الضفة الأخرى
  rationale: المقصود في سياق عبور البحيرة هو الشاطئ المقابل، وذكر «الضفة» يوضح الدلالة المكانية الطبيعية في العربية.
- source_word: συνήχθη
  choice: اجتمع
  rationale: مع أن الصيغة اليونانية مبنية للمجهول، فالعربية تعبّر عن تجمع الناس طبيعيًا بالفعل اللازم «اجتمع» دون افتراض فاعل خارجي.
- source_word: ὄχλος πολὺς
  choice: جمع كبير
  rationale: صياغة عربية واضحة ومألوفة تنقل كِبَر عدد المجتمعين.
- source_word: ἐπ’ αὐτόν
  choice: حوله
  rationale: مع فعل الاجتماع تفيد العبارة اتجاه الجمع إلى يسوع وتجمعه في محيطه؛ و«حوله» تؤدي هذا المعنى بإيجاز.
- source_word: παρὰ τὴν θάλασσαν
  choice: عند البحر
  rationale: تنقل الموقع بمحاذاة الشاطئ في تعبير عربي طبيعي، من غير أن توحي بأنه داخل الماء.
- source_word: θάλασσαν
  choice: البحر
  rationale: يحافظ على لفظ المصدر اليوناني، مع توضيح أن المقصود بحر الجليل في الحاشية.
