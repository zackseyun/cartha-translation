    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: في الحال
  rationale: يحافظ على سرعة السرد المميزة عند مرقس، وهو تعبير عربي واضح وطبيعي.
- source_word: ἀνέστη
  choice: قامت
  rationale: ينقل معنى نهوض الفتاة فعليًا بعد أمر يسوع، من غير أن يفرض على الفعل وحده مصطلحًا خاصًا بالقيامة.
- source_word: τὸ κοράσιον
  choice: الفتاة
  rationale: تعبير عربي طبيعي يدل على فتاة صغيرة السن، ويأتي تحديد عمرها صراحة بعد ذلك.
- source_word: περιεπάτει
  choice: صارت تمشي
  rationale: يعكس صيغة الماضي الناقص التي تصور بدء المشي واستمراره بعد قيامها.
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: لأنها كانت ابنة اثنتي عشرة سنة
  rationale: صياغة عربية فصيحة واضحة لبيان العمر، وتحفظ الوظيفة التفسيرية للأداة γάρ.
- source_word: ἐξέστησαν ... ἐκστάσει μεγάλῃ
  choice: استولى عليهم ... ذهول عظيم
  rationale: ينقل شدة الدهشة التي تؤكدها العبارة اليونانية المشتقة من جذر واحد، مع تجنب التكرار الثقيل في العربية.
theological_decisions:
- issue: الإيحاء المحتمل بالقيامة في ἀνέστη
  choice: قامت
  alternative: نهضت؛ قامت من الموت
  rationale: السياق يبين أنها عادت إلى الحياة، لكن الفعل نفسه يمكن أن يدل على النهوض أو القيام؛ لذلك تُحفظ دلالته المباشرة دون زيادة تفسير عقائدي داخل النص.
translation_notes:
  register: العربية الفصحى الحديثة، بصياغة واضحة وموقرة. استُخدمت «صارت تمشي» لإظهار بدء الفعل واستمراره، وحُفظ تكرار «في الحال» الوارد في النص اليوناني وفق قراءة SBLGNT المعطاة.
