  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: ar
  text: 'لِأَنَّهُ كَانَ يَقُولُ لَهُ: «اخْرُجْ مِنَ الرَّجُلِ، يَا أَيُّهَا الرُّوحُ النَّجِسُ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة الأمر: «غادر الرجل، يا أيها الروح النجس». وتَرِد عبارة «الروح النجس» في اليونانية بصيغة التعريف، لكنها تؤدي هنا وظيفة النداء المباشر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: صيغة الماضي الناقص تدل هنا على قول جارٍ أو متكرر في خلفية السرد، و«كان يقول» تحفظ هذه الدلالة طبيعيًا.
- source_word: γὰρ
  choice: لأنه
  rationale: تفيد الأداة تعليلًا أو تفسيرًا لما سبق، و«لأنه» تؤدي هذه الصلة بوضوح.
- source_word: αὐτῷ
  choice: له
  rationale: يحفظ الضمير المذكر في اليونانية والإطار السردي؛ فالقول موجَّه إليه في الظاهر، بينما يستهدف الأمر الروح النجس الذي فيه.
- source_word: Ἔξελθε
  choice: اخرج
  rationale: فعل أمر مباشر يدل على الخروج من داخل الرجل، و«اخرج» هو التعبير العربي الطبيعي.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: يا أيها الروح النجس
  rationale: مع أن العبارة معرفة ومرفوعة من جهة الصياغة، فإنها تؤدي وظيفة النداء المباشر بعد فعل الأمر؛ فجاءت بصيغة نداء عربية واضحة وفصيحة.
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: من الرجل
  rationale: تفيد ἐκ الحركة من الداخل إلى الخارج، والسياق يشير إلى رجل بعينه، لذلك تلائمها «من الرجل».
theological_decisions:
- issue: ترجمة πνεῦμα ἀκάθαρτον في سياق إخراج الأرواح
  choice: الروح النجس
  alternative: الروح الشرير
  rationale: النص اليوناني يقول حرفيًا «الروح النجس»، وهي عبارة إنجيلية تحمل معنى النجاسة ولا ينبغي استبدالها بتفسير أوسع هو «الشرير».
- issue: مرجع الضمير αὐτῷ وعلاقته بالمأمور
  choice: له، مع توجيه الأمر صراحة إلى الروح النجس
  alternative: إليه بمعنى الروح نفسه
  rationale: 'يُبقي النص العربي التوتر السردي الموجود في اليونانية: كان يسوع يقول «له»، ثم يبيّن النداء أن الأمر موجَّه إلى الروح النجس.'
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة. استُخدمت «يا أيها» لأن المنادى معرّف بـ«أل»، مع إبقاء صيغة الماضي المستمر «كان يقول» والصلة التفسيرية «لأنه».
