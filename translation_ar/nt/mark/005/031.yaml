    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: صيغة الماضي الناقص تدل على قول مستمر أو متكرر في سياق السرد، وينقلها هذا التركيب بوضوح وطبيعية.
- source_word: μαθηταὶ
  choice: تلاميذه
  rationale: «التلاميذ» هو المقابل العربي المألوف الذي يحفظ معنى التعلّم واتباع المعلّم في هذا السياق.
- source_word: Βλέπεις
  choice: أنت ترى
  rationale: ينقل المضارع الخبري المباشر، مع إبراز ما يعدّه التلاميذ أمرًا ظاهرًا أمام يسوع.
- source_word: ὄχλον
  choice: الجمع
  rationale: لفظ عربي واضح ومألوف لجماعة الناس المحتشدة، من غير نبرة قديمة أو مبالغة.
- source_word: συνθλίβοντά
  choice: يضغط عليك من كل جانب
  rationale: ينقل معنى التزاحم والضغط الجسدي المحيط بيسوع، من غير مبالغة توحي بالسحق الحرفي.
- source_word: λέγεις
  choice: تقول
  rationale: مضارع طبيعي في العربية يحفظ نبرة استغراب التلاميذ من السؤال.
- source_word: Τίς μου ἥψατο
  choice: مَن لمسني؟
  rationale: ترجمة مباشرة وطبيعية للسؤال عن فعل لمس محدد وقع لتوّه، من غير إضافة قصد غير مصرّح به في اللفظ.
- source_word: μου
  choice: ني في «لمسني»
  rationale: مع أن اليونانية تستعمل المضاف إليه مع الفعل، فالعربية تعبّر عنه طبيعيًا بضمير المفعول به المتصل.
