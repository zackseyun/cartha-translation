    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα
  choice: وكانت قد سمعت
  rationale: اسم فاعل ماضٍ مؤنث يدل هنا على أن السماع سبق مجيئها ولمسها؛ وصيغة «كانت قد سمعت» تنقل هذا التعاقب بوضوح طبيعي.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: عن يسوع
  rationale: تفيد περί مع المضاف إليه معنى «عن» أو «بشأن»، و«عن يسوع» هي الصياغة العربية الطبيعية المباشرة.
- source_word: ἐλθοῦσα
  choice: فجاءت
  rationale: اسم فاعل ماضٍ يقود إلى الفعل الرئيس؛ والفاء توضح تتابع الحدث من غير إثقال العبارة بتراكيب حرفية.
- source_word: ἐν τῷ ὄχλῳ
  choice: وسط الجموع
  rationale: يدل التركيب على وجودها داخل الحشد المحيط بيسوع؛ و«وسط الجموع» تعبير عربي واضح وملائم للسياق السردي.
- source_word: ὄπισθεν
  choice: من خلفه
  rationale: يدل الظرف على الاقتراب من جهة الخلف، والضمير المستفاد من السياق يعود إلى يسوع.
- source_word: ἥψατο
  choice: لمست
  rationale: الفعل في هذا السياق يعني اللمس، ولا يلزم منه الإمساك المطوّل أو التشبث.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ثوبه
  rationale: ἱμάτιον اسم عام لقطعة من اللباس، وغالبًا ما يشير إلى الرداء الخارجي؛ و«ثوبه» يحافظ على المفرد وعلى عموم اللفظ.
