source:
  edition: SBLGNT
  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: ar
  text: أمّا المرأة، فجاءت خائفةً مرتعدةً، وهي تعلم ما حدث لها، وخرّت أمامه[a] وأخبرته بالحقيقة كلّها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سقطت أمامه»، أو: «ألقت بنفسها أمامه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: أمّا
  rationale: تفيد انتقالًا سرديًّا مع مقابلة خفيفة بين سؤال يسوع في السياق السابق واستجابة المرأة، من غير تشديد على التعارض.
- source_word: ἡ γυνὴ
  choice: المرأة
  rationale: أداة التعريف تحيل إلى المرأة التي سبق ذكرها في السرد.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: خائفةً مرتعدةً
  rationale: يحافظ التعبيران على اجتماع الخوف والارتعاد بوصفهما حالتها عند مجيئها، بصياغة عربية طبيعية واضحة.
- source_word: εἰδυῖα
  choice: وهي تعلم
  rationale: تنقل اسم الفاعل اليوناني بوصفه حالًا مصاحبة، من غير حسم العلاقة على أنها سببية صريحة.
- source_word: ὃ γέγονεν αὐτῇ
  choice: ما حدث لها
  rationale: تعبير عربي مألوف ينقل الحدث الذي اختبرته المرأة من غير إضافة تفسير إلى طبيعة الشفاء.
- source_word: ἦλθεν
  choice: جاءت
  rationale: ينقل الفعل السردي البسيط الدال على اقترابها ومجيئها.
- source_word: προσέπεσεν αὐτῷ
  choice: خرّت أمامه
  rationale: ينقل السقوط أمام يسوع في هيئة اتضاع أو تضرع، من غير أن يضيف إلى النص تصريحًا بأن الفعل كان عبادة.
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: أخبرته بالحقيقة كلّها
  rationale: صياغة عربية طبيعية تعبّر عن إطلاعه على الأمر كاملًا بلا إخفاء، وتحفظ توكيد πᾶσαν.
theological_decisions:
- issue: دلالة الهيئة في προσέπεσεν αὐτῷ
  choice: خرّت أمامه
  alternative: سقطت عند قدميه؛ سجدت له
  rationale: الفعل يدل على السقوط أمام شخص في اتضاع أو خوف أو تضرع، لكنه لا يحسم وحده أن المقصود عبادة؛ لذلك تُركت الدلالة اللاهوتية مفتوحة ولم تُستعمل «سجدت» في المتن.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة سردية موقّرة. استُخدمت الجملة الحالية «وهي تعلم» لصون العلاقة الظرفية غير المحسومة في الأصل، وحُفظ ترتيب الأفعال الأساسي مع تلطيفه بما يلائم العربية.
