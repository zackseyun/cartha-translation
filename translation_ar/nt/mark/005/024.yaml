  text: And he went with him[a]. And a large crowd was following him and pressing around him.
translation:
  language: ar
  text: فذهب معه. وكان حشدٌ كبيرٌ يتبعه ويزحمه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يضغط عليه» أو «يحتشد حوله». يدل الفعل اليوناني على أن الحشد كان يضغط على يسوع من شدة الزحام.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ذهب
  rationale: الفعل الماضي اليوناني يروي انتقال يسوع استجابةً لطلب يايرس؛ و«ذهب» تعبير عربي طبيعي لا يوحي بأنه انصرف عنه.
- source_word: μετ’ αὐτοῦ
  choice: معه
  rationale: حرف الجر μετά مع المضاف إليه يدل هنا على المصاحبة، و«معه» يؤدي المعنى بوضوح وإيجاز.
- source_word: ἠκολούθει
  choice: كان يتبعه
  rationale: صيغة الماضي الناقص تدل على فعل مستمر في خلفية السرد؛ وتركيب «كان يتبعه» يحفظ هذا الاستمرار.
- source_word: ὄχλος πολύς
  choice: جمعٌ كبير
  rationale: ينقل «جمع» معنى ὄχλος، وتعبّر «كبير» عن كثرة العدد بلغة عربية واضحة ومعاصرة.
- source_word: συνέθλιβον
  choice: يزحمه
  rationale: يدل الفعل على ضغط الناس بعضهم مع بعض على يسوع؛ و«يزحمه» يحفظ معنى الاحتشاد والضغط الجسدي من غير مبالغة توحي بإصابته.
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير المفعول المتصل في «يزحمه» يعود بوضوح إلى يسوع.
