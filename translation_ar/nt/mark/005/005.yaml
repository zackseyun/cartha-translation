  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: ar
  text: وكان دائمًا، ليلًا ونهارًا، بين القبور وفي الجبال، يصرخ ويجرح نفسه بالحجارة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: دائمًا، ليلًا ونهارًا
  rationale: ينقل استمرار الفعل على امتداد الليل والنهار بصياغة عربية طبيعية وواضحة.
- source_word: μνήμασιν
  choice: القبور
  rationale: يدل اللفظ على مواضع الدفن، و«القبور» هو المقابل العربي المألوف والملائم للسياق.
- source_word: ὄρεσιν
  choice: الجبال
  rationale: ترجمة مباشرة للفظ الذي يعني عادةً الجبال، من غير تضييقه إلى التلال.
- source_word: ἦν κράζων
  choice: كان ... يصرخ
  rationale: يحفظ البناء العربي معنى الفعل المستمر في الزمن الماضي الذي يؤديه التركيب اليوناني المحيطي.
- source_word: κατακόπτων ἑαυτὸν
  choice: يجرح نفسه
  rationale: ينقل إيذاء النفس بالقطع أو الضرب بوضوح، مع تجنب لفظ أشد قد يفسر درجة الإصابة أكثر مما يحسمه السياق.
- source_word: λίθοις
  choice: بالحجارة
  rationale: تعبر الباء عن الدلالة الأداتية لحالة المجرور في اليونانية تعبيرًا عربيًا طبيعيًا.
theological_decisions: []
