base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: ar
  text: ولمّا رأى يسوعَ من بعيد، ركض وسجد له[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُترجم: «تعبّد له» أو «قدّم له الإجلال». فالفعل اليوناني قد يدل على العبادة، أو على السجود وإظهار الخضوع والإجلال، بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: لمّا رأى
  rationale: اسم فاعل ماضٍ من ὁράω يفيد هنا علاقة زمنية طبيعية بالفعل الرئيس؛ وصيغة «لمّا رأى» واضحة في العربية وتحافظ على تسلسل الحدث من غير إضافة سببية.
- source_word: ἀπὸ μακρόθεν
  choice: من بعيد
  rationale: تعبير عربي طبيعي ودقيق للدلالة على المسافة المكانية.
- source_word: ἔδραμεν
  choice: ركض
  rationale: ينقل المعنى المباشر للفعل τρέχω من غير إضافة دلالة السرعة أو الاندفاع التي لا يصرّح بها اللفظ.
- source_word: προσεκύνησεν αὐτόν
  choice: سجد له
  rationale: يحافظ «سجد له» على صورة الانحناء أو السجود أمام شخص، ويمكنه في العربية أيضًا أن يحمل دلالة التعبّد بحسب السياق؛ وبذلك لا يُحسم هنا ما إذا كان المقصود عبادة صريحة أم إظهار خضوع وإجلال.
- source_word: καὶ
  choice: و
  rationale: تحافظ واو الاستئناف على أسلوب مرقس القائم على عطف أحداث السرد عطفًا متتابعًا.
- source_word: τὸν Ἰησοῦν
  choice: يسوعَ
  rationale: نقل مباشر للاسم العلم بوصفه مفعولًا به للفعل «رأى».
theological_decisions:
- issue: هل يدل προσεκύνησεν هنا صراحةً على عبادة يسوع أم على السجود له وإظهار الخضوع؟
  choice: سجد له
  alternative: تعبّد له؛ أو قدّم له الإجلال
  rationale: يحتمل الفعل اليوناني العبادة كما يحتمل السجود أو إظهار الإجلال والخضوع بحسب السياق. واختيار «سجد له» يبقي الفعل الظاهر ودلالته اللاهوتية المحتملة معًا من غير حسم ما يتركه الأصل مفتوحًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على إيقاع السرد المتتابع عند مرقس. استُعمل «سجد له» لما فيه من طبيعية ووقار، ولقدرته على إبقاء الاحتمال المعجمي واللاهوتي قائمًا.
