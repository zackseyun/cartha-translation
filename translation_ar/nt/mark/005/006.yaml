  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: الرؤية من بعيد، ثم الركض، ثم فعل προσκυνέω تجاه يسوع. وصيغة «ولمّا رأى» تمثّل اسم الفاعل الماضي تمثيلًا زمنيًا طبيعيًا من غير إضافة معنى سببي. و«سجد له» تحفظ الفعل المرئي ولا تحسم وحدها بين العبادة وإظهار الخضوع.'
