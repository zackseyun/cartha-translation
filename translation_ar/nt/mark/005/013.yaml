  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: ar
  text: فأذن لهم. فخرجت الأرواح النجسة ودخلت في الخنازير، فاندفع القطيع، وكان عدده نحو ألفين، إلى أسفل المنحدر الشديد[a] إلى البحر[b]، فغرق فيه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الجرف» أو «الهاوية»؛ فاللفظ اليوناني قد يدل على منحدر شديد أو جرف.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «البحر»، والمقصود بحر الجليل.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: فأذن لهم
  rationale: ينقل معنى السماح ومنح الإذن بإيجاز طبيعي، والضمير يعود في السياق إلى الأرواح النجسة.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: الأرواح النجسة
  rationale: يحافظ على التعبير الشخصي والروحي في اليونانية وعلى دلالة النجاسة، من غير تحويله إلى قوى شر مجردة.
- source_word: ἐξελθόντα
  choice: فخرجت
  rationale: يعبّر عن مغادرة الأرواح للرجل، ويؤدي اسم الفاعل اليوناني بصيغة فعلية طبيعية في تسلسل السرد العربي.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: ودخلت في الخنازير
  rationale: ترجمة واضحة ومباشرة لحركة الدخول إلى الخنازير.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: فاندفع القطيع
  rationale: يحافظ على الفعل المفرد مع الاسم الجمعي، وينقل الحركة المفاجئة العنيفة من غير إضافة معنى التدافع غير المصرح به.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: هابطًا المنحدر الشديد
  rationale: ينقل اتجاه الحركة إلى أسفل ودلالة الموضع الحاد، من غير الجزم بأنه جرف عمودي.
- source_word: ὡς δισχίλιοι
  choice: وكان عدده نحو ألفين
  rationale: يحفظ معنى التقريب الذي تفيده ὡς، ويوضح أن العدد يخص القطيع.
- source_word: εἰς τὴν θάλασσαν
  choice: إلى البحر
  rationale: يبقي لفظ «البحر» كما في الأصل اليوناني، مع كون المقصود جغرافيًا بحر الجليل.
- source_word: ἐπνίγοντο
  choice: وغرقت الخنازير
  rationale: ينقل الفعل الناقص بصياغة سردية عربية طبيعية، ويصرح بالفاعل لتجنب غموض الضمير بعد ذكر القطيع والعدد.
theological_decisions:
- issue: مرجع الضمير في «لهم»
  choice: الأرواح النجسة التي طلبت الإذن
  alternative: ترك المرجع دون أي توضيح سياقي
  rationale: السياق السابق يحدد المرجع، لكن الترجمة تحافظ على الضمير ولا تضيف الاسم إلى متن الآية.
- issue: طبيعة «الأرواح النجسة»
  choice: الإبقاء على لغة الكائنات الروحية الشخصية
  alternative: قوى شريرة غير شخصية
  rationale: النص اليوناني يعرضها أرواحًا تتكلم وتطلب الإذن وتدخل في الخنازير؛ لذا لا تُختزل إلى قوى مجردة، ولا تضاف تفاصيل عقائدية تتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، بجمل سردية طبيعية. وُضعت علامة الحاشية [a] عند «المنحدر الشديد» لأن حاشيتها تخص κρημνός، وعلامة [b] عند «البحر»؛ وبذلك صُحح عدم تطابق موضع العلامة [a] في طبقة الاستشارة الإنجليزية مع مضمون حاشيتها.
