  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: ar
  text: 'أمّا يسوع، فإذ سمع الكلام الذي كان يُقال[a]، قال لرئيس المجمع: «لا تخف؛ آمن فقط[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فإذ لم يبالِ بالكلام الذي كان يُقال» أو «تجاهل ما قيل»؛ إذ يمكن أن يدل الفعل اليوناني على عدم الإصغاء إلى الخبر بدلًا من سماعه.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «ثق فقط». وقد توحي صيغة الفعل اليوناني أيضًا بمعنى: «استمر مؤمنًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: إذ سمع
  rationale: 'للفعل هنا معنيان ممكنان: السماع، أو عدم الاكتراث بما قيل. والسياق المباشر، إذ يجيب يسوع عن الخبر الذي نُقل إلى رئيس المجمع، يرجّح معنى السماع، مع حفظ البديل في الحاشية.'
- source_word: τὸν λόγον λαλούμενον
  choice: الكلام الذي كان يُقال
  rationale: صياغة عربية واضحة تحفظ معنى العبارة اليونانية وبنيتها الوصفية من غير تكلّف حرفي، وتشير في السياق إلى الخبر الجاري قوله.
- source_word: λέγει
  choice: قال
  rationale: المضارع اليوناني هنا مضارع تاريخي شائع في سرد مرقس. الماضي هو الأسلوب الطبيعي في السرد العربي، من غير تغيير للحدث أو دلالته.
- source_word: ἀρχισυναγώγῳ
  choice: لرئيس المجمع
  rationale: يدل اللقب على المسؤول أو المتصدر في المجمع اليهودي، و«رئيس المجمع» تعبير عربي موجز وواضح ومستقر.
- source_word: Μὴ φοβοῦ
  choice: لا تخف
  rationale: ينقل النهي اليوناني مباشرة بصياغة عربية طبيعية تحفظ قوة التشجيع.
- source_word: μόνον
  choice: فقط
  rationale: تفيد حصر الاستجابة المطلوبة، وهي المقابل العربي الطبيعي المباشر في هذا الموضع.
- source_word: πίστευε
  choice: آمن
  rationale: «آمن» هو المقابل المباشر للفعل πιστεύω. وقد يحتمل المضارع معنى الاستمرار، لكن السياق لا يوجب التصريح به في المتن؛ وتُحفظ دلالة الثقة في الحاشية.
theological_decisions:
- issue: الدلالة السياقية لـ παρακούσας
  choice: سمع يسوع الخبر ثم خاطب رئيس المجمع.
  alternative: لم يبالِ يسوع بما قيل، أو تجاهله، ثم خاطب رئيس المجمع.
  rationale: كلا المعنيين ممكن معجميًا، غير أن استجابة يسوع الفورية للكلام الجاري قوله ترجّح معنى السماع. حُفظ المعنى الآخر في الحاشية لأن الاختلاف يؤثر في النبرة السردية.
- issue: دلالة πιστεύω في أمر يسوع
  choice: آمن
  alternative: ثق، أو استمر مؤمنًا
  rationale: تحافظ «آمن» على الصلة المعجمية المباشرة بالفعل اليوناني ولا تحصره في جانب نفسي واحد. وتوضح الحاشية أن الثقة معنى ممكن، وأن صيغة المضارع قد توحي بالاستمرار.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أمّا يسوع» لإبراز التحول المقابل الذي تؤديه δέ، و«رئيس المجمع» بوصفه لقبًا مفهومًا. وُضعت علامتا الحاشية في المتن، وحُفظ الغموض الحقيقي في παρακούσας ودلالة πιστεύω من غير فرض تفسير مذهبي.
