lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: تحافظ أداة العطف على تتابع مرقس السردي البسيط من غير تنعيمها إلى «ثم».
- source_word: ἦλθον
  choice: جاءوا
  rationale: الفعل ماضٍ بصيغة الجمع، ويشير في السياق إلى يسوع ومن معه.
- source_word: εἰς τὸ πέραν
  choice: إلى الضفة الأخرى
  rationale: تعبير عربي طبيعي يوضح المقصود، وهو بلوغ الجانب المقابل من المسطح المائي، من غير إفراط في الشرح.
- source_word: τῆς θαλάσσης
  choice: من البحر
  rationale: يحافظ على لفظ «البحر» الوارد في اليونانية والمألوف في روايات الأناجيل، مع أن المقصود بحر الجليل وهو بحيرة جغرافيًا.
- source_word: εἰς τὴν χώραν
  choice: إلى كورة
  rationale: «كورة» تدل هنا على الناحية أو الإقليم المحيط بمدينة، وتحافظ على التمييز بين المنطقة وسكانها.
- source_word: Γερασηνῶν
  choice: الجراسيين
  rationale: نقل عربي لاسم النسبة اليوناني في قراءة SBLGNT، أي سكان جراسا أو المنسوبين إليها.
theological_decisions:
- issue: اختلاف اسم الموضع في مخطوطات رواية الرجل الذي تسكنه الأرواح النجسة
  choice: الجراسيين
  alternative: الجدريين؛ الجرجسيين
  rationale: 'يتبع المتن قراءة SBLGNT: Γερασηνῶν، بينما تُذكر القراءتان الرئيسيتان الأخريان في الحاشية حفاظًا على الشهادة النصية وعدم حسم الإشكال الجغرافي ضمن الترجمة.'
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية رصينة. استُعملت «الضفة الأخرى» للوضوح المعاصر، و«كورة» للدلالة الدقيقة على الناحية التابعة لموضع، مع إبقاء «البحر» وفق لفظ المصدر.
