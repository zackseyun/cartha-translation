  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: ar
  text: 'وظلَّ يسأله: «ما اسمك؟» فيقول له: «اسمي لَجِئُون[a]، لأننا كثيرون».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «لَجِئُون» لفظ عسكري لاتيني دخل اليونانية، وكان يدل على وحدة كبيرة في الجيش الروماني؛ وهو هنا الاسم الذي ذكره الروح النجس لنفسه، ويوحي بوجود عدد كبير.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: ظلَّ يسأله
  rationale: صيغة الماضي الناقص تدل على الاستمرار أو التكرار؛ و«ظلَّ يسأله» تنقل هذا الجانب بوضوح في العربية.
- source_word: Τί ὄνομά σοι
  choice: ما اسمك؟
  rationale: تعبير عربي طبيعي ومباشر يقابل التركيب اليوناني الاصطلاحي الذي يضم «اسم» وضمير المجرور.
- source_word: λέγει αὐτῷ
  choice: فيقول له
  rationale: ينقل المضارع التاريخي ويحافظ على حيوية السرد عند مرقس، مع ربط طبيعي بالسياق العربي.
- source_word: Λεγιὼν
  choice: لَجِئُون
  rationale: نُقل اللفظ بوصفه اسمًا أو لقبًا معلنًا في النص، لا بوصفه اسم جنس مترجمًا؛ وتشرح الحاشية خلفيته العسكرية.
- source_word: ὄνομά μοι
  choice: اسمي
  rationale: المقابل العربي الطبيعي لصيغة التعريف بالاسم في اليونانية.
- source_word: ὅτι πολλοί ἐσμεν
  choice: لأننا كثيرون
  rationale: تفيد ὅτι هنا التعليل، وتحفظ صيغة المتكلم الجمع ذات الدلالة في النص.
theological_decisions:
- issue: الانتقال من المفرد إلى الجمع في كلام المتحدث
  choice: الإبقاء على «اسمي» بالمفرد ثم «لأننا كثيرون» بالجمع
  alternative: 'تسوية الانتقال بالقول: «اسمنا لَجِئُون»'
  rationale: يحفظ النص اليوناني التوتر المقصود بين تعريف المتحدث نفسه بالمفرد وشرحه بالجمع، فلا ينبغي للترجمة أن تزيل هذا التوتر.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «ظلَّ يسأله» لإظهار الاستمرار في الماضي، و«فيقول» للمحافظة على المضارع التاريخي وحيوية السرد. ثُبّتت علامة الحاشية [a] في المتن.
