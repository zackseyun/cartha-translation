base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: ar
  text: لأنه كان قد رُبط مرارًا بقيودٍ وسلاسل، وكان قد قطَّع السلاسل وحطَّم القيود، ولم يقوَ أحدٌ على إخضاعه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ترويضه». يمكن أن يعني الفعل اليوناني «يُروِّض»، أو، بمعنى أعم، «يُخضعه أو يسيطر عليه».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: لأنه كان قد
  rationale: تنقل «لأن» دلالة السبب في διά مع المصدر المعرَّف، ويعبّر «كان قد» طبيعيًا عن الفعل السابق في خلفية السرد.
- source_word: πολλάκις
  choice: مرارًا
  rationale: تؤدي معنى تكرار وقوع الفعل بعبارة عربية موجزة وطبيعية.
- source_word: πέδαις / τὰς πέδας
  choice: بقيود / القيود
  rationale: تشير πέδη إلى ما يُقيَّد به، ولا سيما قيد القدمين؛ و«قيود» واضحة وتحافظ على تمييزها من السلاسل.
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: بسلاسل / السلاسل
  rationale: المعنى المباشر هو السلاسل، وبذلك يبقى الفرق بين لفظي أداة التقييد في اليونانية.
- source_word: δεδέσθαι
  choice: كان قد رُبط
  rationale: يحفظ المبني للمجهول ومعنى الحالة الناتجة عن أفعال ربط متكررة.
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: فقطَّع السلاسل
  rationale: الصياغة العربية الفعلية الطبيعية تنقل بوضوح أنه الفاعل، و«قطَّع» تفيد التفريق العنيف والتام.
- source_word: συντετρῖφθαι
  choice: حطَّم القيود
  rationale: «حطَّم» تنقل قوة معنى الكسر والسحق في الفعل اليوناني دون إطالة غير لازمة.
- source_word: οὐδεὶς ἴσχυεν
  choice: لم يقوَ أحدٌ
  rationale: تحفظ دلالة القوة والاقتدار في ἰσχύω، لا مجرد الإمكان العام.
- source_word: δαμάσαι
  choice: على إخضاعه
  rationale: «إخضاعه» يلائم سياق السيطرة عليه وتقييده، مع إبقاء معنى الترويض البديل في الحاشية.
theological_decisions:
- issue: طبيعة قوة الرجل وسبب تعذر السيطرة عليه
  choice: وصف محاولات تقييده الفاشلة وقوته غير العادية من غير تعيين سببها داخل هذه الآية
  alternative: إبراز القوة الشيطانية صراحةً أو ترجمة الفعل بما يزيد صورة الترويض
  rationale: النص اليوناني في هذه الآية يقرر عجز الناس عن السيطرة عليه، أما تفسير سبب ذلك فيُترك للسياق المحيط ولا يُضاف إلى العبارة نفسها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية مهيبة. استُخدم الفعل المبني للمعلوم في «قطَّع» و«حطَّم» بدل التركيب اليوناني المبني للمجهول لتكون العبارة طبيعية، مع الحفاظ على الفاعل والمعنى. وُضعت علامة الحاشية بعد «إخضاعه» لأنها تخص δαμάσαι.
