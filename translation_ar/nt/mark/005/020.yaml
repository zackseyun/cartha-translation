  text: καὶ ἀπῆλθεν καὶ ἤρξατο κηρύσσειν ἐν τῇ Δεκαπόλει ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς, καὶ πάντες ἐθαύμαζον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: ar
  text: فمضى وبدأ يعلن في منطقة المدن العشر كم صنع يسوع لأجله، وكان الجميع يتعجبون.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: مضى
  rationale: ينقل مغادرته للمكان بإيجاز طبيعي، من غير تكلف لفظ رسمي.
- source_word: ἤρξατο κηρύσσειν
  choice: بدأ ينادي
  rationale: يحفظ الدلالة الابتدائية للفعل ἤρξατο، ويعبّر «ينادي» عن الإعلان العلني من غير أن يوحي بالضرورة بعظة رسمية.
- source_word: ἐν τῇ Δεκαπόλει
  choice: في منطقة المدن العشر
  rationale: ينقل معنى ἐν المباشر، ويعرّف القارئ بالاسم الجغرافي اليوناني «ديكابوليس» بصيغته العربية المفهومة.
- source_word: ὅσα
  choice: بكم
  rationale: يحفظ دلالة مقدار ما فعله يسوع وصداها التعجبي، مع إثبات البديل الممكن «بكل ما» في الحاشية.
- source_word: ἐποίησεν αὐτῷ
  choice: صنع يسوع له
  rationale: تفيد اللام أن الفعل كان لصالح الرجل، وتحافظ على بساطة العبارة الأصلية من غير إضافة تفسير.
- source_word: πάντες
  choice: الجميع
  rationale: مقابل عربي جامع وطبيعي للفظ πάντες من غير إضافة اسم غير موجود في الأصل.
- source_word: ἐθαύμαζον
  choice: كانوا يتعجبون
  rationale: صيغة «كانوا يتعجبون» تعكس الجانب الاستمراري أو المتكرر للماضي الناقص اليوناني.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم الشخصي.
theological_decisions:
- issue: مدى دلالة إعلان الرجل على هوية يسوع
  choice: 'نقل الخبر كما هو: أعلن الرجل ما صنعه يسوع له، من غير شرح عقائدي مضاف.'
  alternative: إضافة صياغة تفسيرية تصرّح بسلطان يسوع الإلهي.
  rationale: تُظهر الرواية قدرة يسوع الاستثنائية، لكنها في هذه الآية لا تصوغ استنتاجًا عقائديًا صريحًا؛ لذلك تُحفظ دلالة النص وتوتره اللاهوتي من غير توسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «منطقة المدن العشر» بدل النقل الصوتي «الديكابوليس» ليكون الاسم الجغرافي مفهومًا للقارئ العام، واستُعمل «ينادي» للإعلان العلني من غير إيحاء ببيئة وعظية رسمية.
