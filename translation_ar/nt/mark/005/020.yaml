  to: فمضى وبدأ يعلن في منطقة المدن العشر كم صنع يسوع لأجله، وكان الجميع يتعجبون.
  rationale: تستبدل المراجعة «ينادي» بـ«يعلن» لتقابل فعل الكرازة أو الإعلان العلني من دون افتراض إطار وعظي رسمي، وتعيد صياغة عبارة المقدار والمنفعة إلى عربية فصحى طبيعية. وتحافظ على زمن البدء في «بدأ»، وعلى الاستمرارية أو التكرر في «كان الجميع يتعجبون»، وعلى بديل ὅσα في الحاشية.
