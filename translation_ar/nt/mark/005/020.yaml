review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام محفوظ: مغادرة الرجل، وبدء إعلانه العلني في الديكابوليس، ومضمون ما فعله يسوع لأجله، وتعجب الجميع. لكن «ينادي» أضيق وأقل دقة من κηρύσσειν في هذا السياق، وتركيب «بكم صنع يسوع له» غير سلس في العربية الفصحى المعاصرة.'
  naturalness: «فمضى وبدأ يعلن» أسلس وأوضح من «فمضى وبدأ ينادي». كما أن «كم صنع يسوع لأجله» تركيب عربي طبيعي يحفظ معنى العمل لصالحه، بخلاف «بكم صنع يسوع له» الذي يبدو متكلفًا.
  terminology: «منطقة المدن العشر» تؤدي اسم Δεκάπολις ومعناه الجغرافي بوضوح. واستعمال «يعلن» مناسب للإعلان العلني من غير حصره في عظة رسمية أو في مجرد النداء.
  issues:
  - severity: medium
    issue: «ينادي» مقابل κηρύσσειν
    rationale: الفعل العربي قد يفيد النداء أو الصياح، ولا يعبّر بوضوح عن التبليغ أو الإعلان العلني المستمر الذي يفيده κηρύσσειν. «يعلن» أدق وأوضح في العربية الحديثة.
  - severity: medium
    issue: «بكم صنع يسوع له»
    rationale: ترتيب العبارة واستعمال «له» هنا غير طبيعيين نسبيًا، وقد يضعفان وضوح العلاقة الدالة على المنفعة. «كم صنع يسوع لأجله» يحفظ المعنى ولا يضيف تفسيرًا.
  - severity: low
    issue: صياغة الحاشية البديلة
    rationale: 'ينبغي أن ترد الصياغة البديلة كاملة وبالضمير نفسه: «بكل ما صنعه يسوع لأجله»، لتكون سليمة وواضحة.'
  revised_text: فمضى وبدأ يعلن في منطقة المدن العشر كم صنع يسوع لأجله، وكان الجميع يتعجبون.
