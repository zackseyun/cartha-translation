    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ ἐκ τοῦ πλοίου
  choice: ولما خرج من القارب
  rationale: حُوِّل التركيب اليوناني المطلق بالمضاف إليه واسم الفاعل الماضي إلى جملة زمنية عربية طبيعية، مع إبقاء الفعل سابقًا للقاء من غير تشديد غير لازم على مقدار الفاصل الزمني. و«القارب» أنسب للسياق من «السفينة».
- source_word: εὐθὺς
  choice: في الحال
  rationale: يحفظ سرعة السرد المرقسي ووضوحه بعبارة عربية فصيحة وطبيعية.
- source_word: ὑπήντησεν αὐτῷ
  choice: لقيه
  rationale: ينقل معنى اللقاء المباشر بوضوح، بينما يبيّن الوصف التالي أن الرجل كان خارجًا من جهة القبور.
- source_word: ἐκ τῶν μνημείων
  choice: خارجٌ من بين القبور
  rationale: يفيد حرف الجر اليوناني الخروج من نطاق القبور؛ و«من بين القبور» طبيعية في العربية ولا توحي بالضرورة بأنه خرج من داخل قبر بعينه.
- source_word: ἄνθρωπος
  choice: رجلٌ
  rationale: الاسم مفرد مذكر، والسياق اللاحق يبيّن أن المقصود شخص ذكر.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: به روح نجس
  rationale: تعبير عربي موجز يحافظ على دلالة كون الروح النجس ملازمًا للرجل أو مؤثرًا فيه، من غير إدخال لفظ «ممسوس» أو «ممسوك» بما قد يزيد تفسيرًا على العبارة اليونانية.
theological_decisions:
- issue: صياغة حالة الرجل المرتبطة بالروح النجس
  choice: به روح نجس
  alternative: ممسوس بروح نجس
  rationale: الأصل يقول حرفيًا «في روح نجس»، وهي عبارة تصف حالته وصلته بالروح من دون استخدام مصطلح تقني يحدد كيفية السيطرة عليه. لذلك تُحفظ سعة الدلالة ويُذكر البديل التفسيري في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية كريمة. وُضع «في الحال» قريبًا من فعل اللقاء، وحُفظت العبارة المتعلقة بالروح النجس من غير حسم تفسيري زائد.
