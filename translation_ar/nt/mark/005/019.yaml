  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: ar
  text: 'ولم يسمح له، بل قال له: «اذهب إلى بيتك، إلى أهلك[a]، وأخبرهم بكل ما صنع الرب لأجلك، وكيف رحمك[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «إلى خاصتك». وقد يشمل التعبير أهله وأقاربه والمقرَّبين إليه.'
    reason: lexical_alternative
  - marker: b
    text: قد يُفهم «الرب» هنا على أنه الله تحديدًا، وقد يكون في صياغة مرقس أيضًا ربط مقصود بين رحمة الله وسلطان يسوع وعمله.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: ولم يسمح له
  rationale: الفعل ἀφίημι في هذا السياق يفيد الإذن، لا المغفرة أو الترك؛ وهذه الصياغة عربية واضحة وتحافظ على النفي.
- source_word: λέγει αὐτῷ
  choice: قال له
  rationale: المضارع التاريخي اليوناني صيغ بالماضي وفق الأسلوب السردي العربي الطبيعي، من غير تغيير في المعنى.
- source_word: Ὕπαγε εἰς τὸν οἶκόν σου
  choice: اذهب إلى بيتك
  rationale: οἶκος هنا هو البيت بوصفه موطن الشخص ودائرته المنزلية، و«اذهب إلى بيتك» تعبير طبيعي مباشر.
- source_word: πρὸς τοὺς σούς
  choice: إلى خاصَّتك
  rationale: تحافظ «خاصتك» على اتساع التعبير اليوناني، الذي يعني حرفيًا المنتمين إليه، من غير حصره في الأقارب وحدهم.
- source_word: ἀπάγγειλον αὐτοῖς
  choice: وأخبرهم
  rationale: يفيد ἀπαγγέλλω نقل الخبر أو تقديم رواية عما وقع؛ و«أخبرهم» واضحة وطبيعية في العربية.
- source_word: ὅσα ὁ κύριός σοι πεποίηκεν
  choice: بكل ما صنع الرب لك
  rationale: ὅσα تشمل مجموع ما فعله الرب، والداتيف σοι متعلق بالفعل بمعنى «لك»، لا بوصفه «ربك».
- source_word: ἠλέησέν σε
  choice: وكيف رحمك
  rationale: تحافظ العبارة على فعل الرحمة نفسه، وتربطه بما ينبغي للرجل أن يرويه عن عمل الرب معه.
theological_decisions:
- issue: مرجع ὁ κύριος في قول يسوع عما فعله «الرب»
  choice: الرب
  alternative: الله
  rationale: يبقي النص اليوناني لقب «الرب» من غير أن يصرّح هنا بالمرجع. لذلك تحافظ الترجمة على التوتر بين نسبة الرحمة إلى الله وارتباطها بما فعله يسوع في السياق، بدل حسمه بإبدال اللقب باسم «الله».
