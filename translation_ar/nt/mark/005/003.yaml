  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: ar
  text: وكان مسكنه بين القبور[a]، ولم يعد أحد يستطيع أن يقيّده، حتى بسلسلة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أقرب إلى اللفظ: «في القبور».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν
  choice: مسكنه
  rationale: يدل الاسم على موضع السكن أو الإقامة، و«مسكنه» تعبير عربي واضح يحافظ على الصورة الملموسة من غير أن يوحي بألفة «البيت».
- source_word: εἶχεν
  choice: كان مسكنه
  rationale: نُقلت صيغة «كان له مسكن» إلى التعبير العربي الطبيعي «كان مسكنه»، مع إبقاء دلالة الماضي المستمر في السياق.
- source_word: ἐν τοῖς μνήμασιν
  choice: بين القبور
  rationale: المقصود مواضع الدفن أو القبور؛ و«بين القبور» طبيعي في العربية ولا يحسم أنه كان دائمًا داخل قبر بعينه. أُثبت البديل الأقرب إلى ظاهر حرف الجر في الحاشية.
- source_word: οὐδὲ ἁλύσει
  choice: حتى بسلسلة
  rationale: تفيد العبارة تصعيد النفي إلى وسيلة قوية للتقييد، مع الحفاظ على إفراد «سلسلة» في الأصل.
- source_word: οὐκέτι
  choice: لم يعد
  rationale: ينقل توقف قدرة كانت قائمة أو محاولات كانت ممكنة من قبل، وهو المقابل العربي الطبيعي لـ οὐκέτι.
- source_word: ἐδύνατο
  choice: يستطيع
  rationale: ينقل معنى القدرة في سياق النفي بصياغة عربية مباشرة.
- source_word: δῆσαι
  choice: يقيّده
  rationale: يحافظ على معنى الربط الجسدي والتوثيق الذي يقتضيه سياق السلسلة، دون توسيعه إلى مجرد المنع أو السيطرة.
