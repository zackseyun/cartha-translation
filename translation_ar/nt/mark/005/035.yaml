  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: ar
  text: 'وبينما كان لا يزال يتكلّم، جاء أناس من بيت رئيس المجمع[a] وقالوا: «ابنتك ماتت. فلماذا تزعج المعلّم[b] بعد الآن؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «من رئيس المجمع»؛ والمقصود في السياق بيته أو أهل بيته.'
    reason: إيضاح إضافة سياقية يقتضيها التعبير اليوناني والسياق السردي.
  - marker: b
    text: 'يمكن أيضًا ترجمة الفعل: «تُثقل على» أو «تُتعب».'
    reason: بيان البدائل المعجمية للفعل σκύλλεις.
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: وبينما كان لا يزال يتكلّم
  rationale: تنقل العبارة المطلقة في حالة المضاف إليه دلالة التزامن، وتحفظ قوة ἔτι بمعنى «لا يزال» بصياغة عربية طبيعية.
- source_word: ἔρχονται
  choice: جاء أناس
  rationale: الفعل مضارع تاريخي في السرد، فنُقل بالماضي الملائم للعربية. وأُظهر فاعله الجمع غير المسمّى بلفظ «أناس» لسلامة الأسلوب.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: من بيت رئيس المجمع
  rationale: التركيب اليوناني حرفيًا «من رئيس المجمع»، لكنه يدل في السياق على القادمين من بيته أو أهله، إذ كان رئيس المجمع نفسه حاضرًا مع يسوع. أُثبتت الإضافة السياقية في حاشية.
- source_word: λέγοντες ὅτι
  choice: وقالوا
  rationale: اسم الفاعل يمهّد للكلام المباشر، و«وقالوا» أنسب للسرد العربي من النقل الحرفي «قائلين».
- source_word: Ἡ θυγάτηρ σου
  choice: ابنتك
  rationale: نقل مباشر وواضح لعبارة الملكية.
- source_word: ἀπέθανεν
  choice: ماتت
  rationale: ينقل الفعل الماضي اليوناني حدث الموت المكتمل بوضوح وطبيعية، من غير إضافة تفسيرية.
- source_word: τί ἔτι
  choice: فلماذا ... بعد الآن؟
  rationale: يحفظ معنى الاستفهام عن جدوى استمرار الفعل بعد وقوع الموت.
- source_word: σκύλλεις
  choice: تزعج
  rationale: يدل الفعل هنا على إتعاب شخص أو إزعاجه بطلب، و«تزعج» واضحة وطبيعية من غير القوة الزائدة التي قد يوحي بها «تضايق» أو «ترهق».
- source_word: τὸν διδάσκαλον
  choice: المعلّم
  rationale: ينقل اللقب اليوناني كما هو، من غير استبداله باسم يسوع أو إدخال معنى سلطوي غير مصرّح به.
theological_decisions:
- issue: الإشارة إلى يسوع بلقب τὸν διδάσκαλον
  choice: المعلّم
  alternative: يسوع؛ السيّد
  rationale: النص يورد لقب «المعلّم» من منظور المتكلمين، فحُفظ اللقب ولم يُستبدل بالاسم أو بلقب يحمل دلالة لاهوتية أوسع.
- issue: تحديد مصدر القادمين في ἀπὸ τοῦ ἀρχισυναγώγου
  choice: من بيت رئيس المجمع
  alternative: من عند رئيس المجمع؛ من رئيس المجمع
  rationale: السياق يدل على البيت أو أهل البيت لأن رئيس المجمع نفسه مع يسوع. وإظهار «بيت» يزيل التباسًا منطقيًا، مع توثيق الصيغة الحرفية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة، مع تفضيل السرد الطبيعي على محاكاة التراكيب اليونانية. استُعمل «رئيس المجمع» بوصفه تعبيرًا مفهومًا عن مسؤول المجمع اليهودي، وحُفظ «المعلّم» لقبًا لا اسمًا.
