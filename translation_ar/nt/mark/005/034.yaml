  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: ar
  text: 'فقال لها: «يا ابنة، إيمانكِ قد خلَّصكِ[a]. اذهبي بسلام، وكوني معافاةً من عِلَّتكِ[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إيمانكِ قد شفاكِ» أو «قد عافاكِ». يمكن أن يدل الفعل اليوناني على الإنقاذ أو الخلاص أو الشفاء.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «وكوني صحيحةً» أو «سليمةً من عِلَّتكِ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θυγάτηρ
  choice: يا ابنتي
  rationale: نُقلت صيغة النداء الحانية بصياغة عربية طبيعية، من غير أن تُفقد دلالتها العائلية.
- source_word: πίστις
  choice: إيمانك
  rationale: يحفظ المصطلح الرئيس، ويدل في السياق على ثقة المرأة بيسوع.
- source_word: σέσωκέν
  choice: قد خلَّصكِ
  rationale: يحفظ المعنى الأوسع للفعل σῴζω وصيغة التمام، ولا يحصره في الشفاء الجسدي، ولا سيما أن الجملة التالية تتناول العافية صراحة.
- source_word: ὕπαγε εἰς εἰρήνην
  choice: اذهبي بسلام
  rationale: تعبير عربي طبيعي ينقل أمر الانصراف في حال من السلام.
- source_word: ἴσθι ὑγιὴς
  choice: كوني معافاةً
  rationale: 'ينقل دلالة الفعل الحالّية: الاستمرار في حالة الصحة والعافية، بدل تصويره فعل شفاء جديدًا.'
- source_word: μάστιγός
  choice: علَّتكِ
  rationale: ينقل الاستعمال المجازي للكلمة، أي الحالة المؤلمة التي ابتُليت بها المرأة، بلغة عربية واضحة غير حرفية على نحو مضلل.
theological_decisions:
- issue: دلالة σῴζω بين الخلاص والشفاء
  choice: قد خلَّصكِ
  alternative: قد شفاكِ؛ قد عافاكِ
  rationale: أُبقيت سعة الفعل اليوناني والتوتر بين الخلاص والعافية الجسدية، لأن العبارة اللاحقة تذكر العافية من العلة على حدة.
- issue: دلالة πίστις
  choice: إيمانك
  alternative: ثقتك
  rationale: «إيمانك» هو المقابل المألوف ويحافظ على اتساق المصطلح، مع بقاء معنى الثقة حاضرًا في السياق.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُعمل التأنيث في الأفعال والضمائر بحسب المخاطَبة، ووُضع هامش كل بديل عند العبارة التي يشرحها.
