base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: ar
  text: 'فصرخ بصوت عظيم وقال: «ما لي ولك يا يسوع، ابن الله العلي؟ أستحلفك بالله ألا تعذبني».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«ما لي ولك» تعبير يفيد التباعد أو الاعتراض أو رفض التدخل، ويمكن توضيح معناه هنا: «ما شأنك بي؟». و«أستحلفك بالله» يمكن أن تُفهم أيضًا: «أناشدك بالله» أو «أضعك تحت قسم أمام الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: فصرخ بصوت عظيم
  rationale: ينقل اسم الفاعل السابق للفعل الرئيس وقوة الصرخة، مع صياغة عربية طبيعية ومهيبة.
- source_word: λέγει
  choice: وقال
  rationale: صيغ الماضي أنسب للسرد العربي المتصل، مع بقاء حيوية المشهد التي يؤديها الحاضر التاريخي في اليونانية.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: ما لي ولك
  rationale: تعبير عربي كتابي موجز يقابل الاصطلاح السامي الدال على التباعد أو الاعتراض، من غير حصر دلالته في تفسير واحد.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: ابن الله العلي
  rationale: يحفظ لقب البنوة والصفة الإلهية صريحين وبترتيب عربي طبيعي.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: أستحلفك بالله
  rationale: يحفظ معنى الاستحلاف والطلب الملزم بالقسم، وهو أدق من تحويل العبارة إلى مجرد رجاء.
- source_word: μή με βασανίσῃς
  choice: ألا تعذبني
  rationale: ينقل شدة βασανίζω بلفظ عربي واضح ملائم للسياق، من غير تخصيص وسيلة العذاب.
theological_decisions:
- issue: إقرار الروح النجس بهوية يسوع
  choice: ابن الله العلي
  alternative: ابن الله، العلي
  rationale: تُبقي الصياغة اعتراف المتكلم ببنوة يسوع وباللقب الإلهي كما في النص، بلا توسيع عقائدي لاحق.
- issue: قوة الاستحلاف في خطاب الروح النجس ليسوع
  choice: أستحلفك بالله
  alternative: أناشدك بالله
  rationale: تحفظ الصياغة التوتر اللافت في استدعاء الروح النجس اسم الله لاستحلاف يسوع، ولا تختزله إلى مجرد التماس.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة مهيبة. استُخدم «ما لي ولك» لحفظ إيجاز الاصطلاح وحدته، و«أستحلفك» لصون القوة القانونية/القَسَمية للفعل اليوناني. وُضعت علامة الحاشية في المتن بعد الاقتباس.
