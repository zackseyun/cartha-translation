  to: وبينما كان يركب القارب، ظلَّ الرجل الذي كان ممسوسًا بالشياطين[a] يتوسَّل إليه أن يكون معه.
  rationale: استُبدل «يصعد إلى القارب» بـ«يركب القارب» لتحسين الدقة والطبيعية، واستُبدلت الحاشية لأنها كانت تضيف مفهوم «سكنى» الشياطين غير المحدد في اليونانية. وأُبقيت دلالة الاستمرار في التوسل، والتعريف بالرجل من خلال حالته السابقة، وعمومية طلبه أن يكون مع يسوع.
