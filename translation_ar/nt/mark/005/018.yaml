  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: ar
  text: وبينما كان يركب القارب، ظلَّ الرجل الذي كان ممسوسًا بالشياطين[a] يتوسَّل إليه أن يكون معه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الرجل الممسوس بالشياطين».'
    reason: بديل صياغي للاسم الموصول في ترجمة δαιμονισθείς، من غير إضافة تحديد لآلية التسلط الشيطاني.
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: بينما كان يصعد
  rationale: تنقل صيغة اسم الفاعل المضارع في تركيب المضاف المطلق حدثًا جاريًا ومتزامنًا مع فعل التوسل، وتأتي العبارة طبيعية في العربية.
- source_word: πλοῖον
  choice: القارب
  rationale: «القارب» هو اللفظ الطبيعي الملائم لسياق بحر الجليل، ولا يوحي بحجم سفينة كبيرة.
- source_word: παρεκάλει
  choice: ظلَّ ... يتوسَّل
  rationale: يحفظ هذا التعبير دلالة الماضي الناقص على الاستمرار أو التكرار، كما ينقل شدة الطلب في هذا السياق.
- source_word: ὁ δαιμονισθείς
  choice: الرجل الذي كان ممسوسًا بالشياطين
  rationale: يوضح أن المقصود هو الرجل المذكور سابقًا، وأن حالته سبقت شفاءه، مع إبقاء الإشارة الصريحة إلى أذى الشياطين من غير اختزالها في تصنيف سريري أو مجازي.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: أن يكون معه
  rationale: يحافظ على بنية مضمون الطلب وعلى المعنى الشخصي المباشر لعبارة «معه»، من غير حصرها في مجرد السفر أو المرافقة المكانية.
theological_decisions:
- issue: صياغة δαιμονισθείς بما يدل على خضوع الشخص لفعل الشياطين من غير إدخال تصورات طائفية أو سريرية لاحقة
  choice: كان ممسوسًا بالشياطين
  alternative: كانت تسكنه الشياطين؛ كان تحت سلطان الشياطين
  rationale: الصياغة المختارة واضحة وشائعة الفهم، وتثبت حقيقة الأذى الشيطاني في سياق الرواية، مع تجنب تحديد آليته بأكثر مما يقوله اللفظ اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُعمل «ظلَّ ... يتوسَّل» لإظهار الاستمرار، وأُبقيت عبارة «أن يكون معه» على بساطتها لحفظ البعد العلاقي في النص.
