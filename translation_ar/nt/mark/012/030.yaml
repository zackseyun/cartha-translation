source:
  edition: SBLGNT
  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: ar
  text: وأحبب الربَّ إلهك بكل قلبك، وبكل نفسك[a]، وبكل فكرك[b]، وبكل قوتك[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بكل حياتك» بدلًا من «بكل نفسك» (ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: أو «بكل فهمك» بدلًا من «بكل فكرك» (διανοίας).
    reason: lexical_alternative
  - marker: c
    text: أو «بكل مقدرتك» بدلًا من «بكل قوتك» (ἰσχύος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: أحبب
  rationale: صيغة المستقبل اليونانية هنا، في سياق اقتباس الوصية، تحمل قوة الأمر. وصيغة الأمر العربية تنقل هذه القوة بوضوح وطبيعية من غير إضعاف إلزام الوصية.
- source_word: κύριον τὸν θεόν σου
  choice: الربَّ إلهك
  rationale: ترجمة مباشرة للصيغة العهدية في النص اليوناني، مع إبقاء التمييز بين «الرب» و«إلهك».
- source_word: ἐξ ὅλης
  choice: بكل
  rationale: مع أن ἐξ تعني حرفيًا «من»، فإن «بكل» هي العبارة العربية الطبيعية مع القلب والنفس والفكر والقوة، وتفيد تكريس الكيان كله.
- source_word: καρδίας
  choice: قلبك
  rationale: «القلب» المقابل المألوف والدقيق، ويترك مدلوله الواسع بوصفه مركز الحياة الباطنة من غير شرح تفسيري داخل النص.
- source_word: ψυχῆς
  choice: نفسك
  rationale: تحافظ «النفس» على التمييز اللفظي بين عناصر السلسلة، مع التنبيه في الحاشية إلى احتمال معنى «الحياة».
- source_word: διανοίας
  choice: فكرك
  rationale: «الفكر» تعبير عربي واضح عن ملكة التفكير والإدراك، ويحافظ على تمييزها من القلب.
- source_word: ἰσχύος
  choice: قوتك
  rationale: «القوة» مقابل عربي طبيعي لـἰσχύς في سياق بذل القدرة كلها.
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: و... و... و... و...
  rationale: حُفظ تكرار حرف العطف والبنية المتوازية لإبراز التراكم والتوكيد في تعداد جوانب التكريس الكامل.
theological_decisions:
- issue: ترجمة κύριος في اقتباس الوصية
  choice: الرب
  alternative: السيد
  rationale: «الرب» توافق اللفظ اليوناني وسياق الصيغة العهدية، من غير إدخال اصطلاح طباعي أو تفسير غير مصرَّح به في النص.
- issue: الألفاظ الأربعة التي تصف الإنسان
  choice: القلب / النفس / الفكر / القوة
  alternative: القلب / الحياة / الفهم / المقدرة
  rationale: أُبقيت الألفاظ متميزة بدل اختزالها في تعبير عام، حفاظًا على بنية النص وتعدّد جوانب التكريس الكامل من غير فرض تقسيم عقائدي صارم لطبيعة الإنسان.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة الأمر الصريحة لنقل القوة الإلزامية للمستقبل اليوناني في سياق الوصية، وحُفظ التوازي والتكرار في العبارات الأربع.
