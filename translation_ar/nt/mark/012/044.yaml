base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: ar
  text: لِأَنَّهُمْ جَمِيعًا أَلْقَوْا مِمَّا زَادَ عَلَى حَاجَتِهِمْ، أَمَّا هِيَ فَأَلْقَتْ مِنْ عَوَزِهَا كُلَّ مَا كَانَ لَهَا، كُلَّ مَا تَعِيشُ بِهِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «معيشتها كلَّها»، أي كلَّ ما كان لها لتعيش به.'
    reason: توضيح الدلالة المعيشية لكلمة βίος مع بيان الصياغة الأقرب إلى اللفظ اليوناني.
lexical_decisions:
- source_word: πάντες γὰρ
  choice: لِأَنَّهُمْ جَمِيعًا
  rationale: تنقل «لأن» وظيفة γὰρ التفسيرية التي تربط القول بما سبقه، وتحفظ «جميعًا» شمول πάντες وتوكيده.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: مِمَّا زَادَ عَلَى حَاجَتِهِمْ
  rationale: تعبير عربي واضح ينقل معنى العطاء من الفائض الذي يتجاوز الحاجة، بدل صياغة حرفية ثقيلة.
- source_word: ἔβαλον / ἔβαλεν
  choice: أَلْقَوْا / فَأَلْقَتْ
  rationale: يحفظ الفعل صورة وضع النقود في صندوق التقدمة، كما يحافظ تكراره على التوازي المقصود في اليونانية.
- source_word: αὕτη δὲ
  choice: أَمَّا هِيَ
  rationale: تُظهر المقابلة القوية بين المرأة وسائر مقدّمي العطايا بصورة طبيعية في العربية.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: مِنْ عَوَزِهَا
  rationale: «العوز» يدل على النقص والحاجة المادية الشديدة، ويحفظ التباين مع الفائض.
- source_word: πάντα ὅσα εἶχεν
  choice: كُلَّ مَا كَانَ لَهَا
  rationale: يحفظ الشمول والتوكيد في العبارة اليونانية من غير تقييد ما كانت تملكه بالنقود وحدها.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: كُلَّ مَا تَعِيشُ بِهِ
  rationale: ينقل βίος هنا بمعنى وسائل المعيشة والقوت، وهو المعنى الذي يقتضيه سياق التقدمة، مع إبقاء قوة الشمول.
theological_decisions:
- issue: دلالة βίος في وصف تقدمة الأرملة
  choice: 'وسائل عيشها كلها: «كل ما تعيش به»'
  alternative: «حياتها كلها» أو «معيشتها كلها»
  rationale: السياق مالي، وβίος قد يدل على أسباب العيش والرزق. لا تُترجم العبارة بما يوحي بأنها قدّمت حياتها البيولوجية حرفيًا، مع الحفاظ على دلالة بذل كل مورد تعتمد عليه.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة. استُخدم «العوز» للمقابلة الدقيقة مع ما زاد على الحاجة، وحُفظ تكرار فعل الإلقاء والتوكيد بكلمة «كل» بما يقارب بنية الأصل من غير تكلّف.
