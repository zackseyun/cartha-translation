  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: ar
  text: 'فدنا واحد من الكتبة وسمعهم يتحاورون، ولما رأى أن يسوع أجابهم جوابًا حسنًا، سأله: «أي وصية هي الأولى بين الوصايا كلها؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المتصدرة بين الوصايا كلها»، أو: «الأهم من الوصايا كلها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: فدنا
  rationale: ينقل معنى الاقتراب من يسوع بعبارة عربية موجزة وطبيعية.
- source_word: γραμματέων
  choice: الكتبة
  rationale: مصطلح كتابي مستقر يشير في هذا السياق إلى المختصين اليهود بالشريعة وشرحها، من غير زيادة تفسيرية في المتن.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: وسمعهم يتحاورون
  rationale: «يتحاورون» يحفظ معنى المناقشة المتبادلة من غير أن يفترض خصومة حادة كما قد توحي «يتجادلون».
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: ولما رأى أن يسوع أجابهم إجابة حسنة
  rationale: يحفظ فعل الإدراك ومعنى καλῶς المباشر. أُظهر اسم يسوع لتفادي غموض الضمير في العربية.
- source_word: ἐπηρώτησεν
  choice: سأله
  rationale: المقابل العربي الأبسط والأوضح لفعل السؤال.
- source_word: Ποία ἐστὶν ἐντολὴ
  choice: أي وصية هي
  rationale: «أي» تلائم طلب تعيين وصية من بين وصايا متعددة، و«وصية» تحافظ على السجل الكتابي.
- source_word: πρώτη πάντων
  choice: الأولى بين الوصايا كلها
  rationale: يحافظ على لفظ «الأولى» وعلى احتمال الأولوية في الرتبة، مع توضيح مرجع «الكل» طبيعيًا في العربية.
theological_decisions:
- issue: دلالة πρώτη في ترتيب الوصايا
  choice: الأولى بين الوصايا كلها
  alternative: أهم الوصايا كلها؛ أعظم الوصايا
  rationale: قد تدل πρώτη على الأولية أو الصدارة في الرتبة. يحافظ المتن على «الأولى» بدل حسمها تفسيريًا إلى «الأهم» أو «الأعظم»، وتوضح الحاشية المجال الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «الكتبة» بوصفه المصطلح الكتابي المألوف، و«يتحاورون» لنقل طبيعة النقاش بلا مبالغة في حدته، مع إبقاء «الأولى» حفاظًا على غموض الأولى/الأهم في الأصل.
