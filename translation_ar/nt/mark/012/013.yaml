source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: ar
  text: وأرسلوا إليه بعضًا من الفريسيين وبعضًا من الهيرودسيين، لكي يصطادوه بكلمة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليوقعوه في الفخ بما يقوله». يحمل الفعل اليوناني صورةً مأخوذة من الصيد، وتدل العبارة الأخيرة على محاولة الإيقاع به عن طريق كلامه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: أرسلوا
  rationale: صيغ الفعل في اليونانية بالمضارع التاريخي، لكن الماضي أنسب للسرد العربي الطبيعي من غير تغيير لوقوع الحدث.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: بعضًا من الفريسيين وبعضًا من الهيرودسيين
  rationale: يحافظ هذا التعبير على معنى التبعيض، ويوضح أن المرسلين كانوا أفرادًا من كلتا الجماعتين.
- source_word: Φαρισαίων
  choice: الفريسيين
  rationale: الاسم العربي المتداول لهذه الجماعة اليهودية.
- source_word: Ἡρῳδιανῶν
  choice: الهيرودسيين
  rationale: نقل صوتي واضح للاسم الدال على الجماعة المرتبطة بهيرودس.
- source_word: ἵνα
  choice: لكي
  rationale: تؤدي معنى الغاية بوضوح في العربية المعاصرة.
- source_word: ἀγρεύσωσιν
  choice: يصطادوه
  rationale: يحفظ صورة الصيد الموجودة في الفعل اليوناني ويؤدي معناها المجازي، أي الإيقاع بيسوع عن طريق كلامه.
- source_word: λόγῳ
  choice: بكلمة
  rationale: يحافظ على المفرد وعلى دلالة الوسيلة، مع إبقاء العبارة موجزة وقريبة من بنية الأصل.
theological_decisions:
- issue: فاعل الجمع غير المصرح به في الفعل اليوناني
  choice: واو الجماعة في «أرسلوا» من غير تسمية الفاعل
  alternative: أن تُذكر القيادات السابقة في السياق أو أن يقال «السلطات»
  rationale: لا تعيد الآية تحديد الفاعل، لذلك لا تُدخل الترجمة هوية أكثر تحديدًا مما يصرح به النص.
- issue: كيفية الإيقاع بيسوع من خلال λόγῳ
  choice: «يصطادوه بكلمة» مع إيضاح في الحاشية
  alternative: «يوقعوه في الفخ بما يقوله»
  rationale: يبقي النص الرئيس صورة الصيد وصيغة المفرد، بينما تبين الحاشية أن المقصود الإيقاع به من خلال كلامه من غير حسم زائد لبنية العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل الماضي للسرد الطبيعي، وحُفظت صورة الصيد المجازية، كما بقي الفاعل غير مسمى موافقةً للأصل.
