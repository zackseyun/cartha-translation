  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: ar
  text: 'فقال له الكاتب: «أحسنتَ يا معلّم، قلتَ بالحق: إنه واحد[a]، وليس آخر سواه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتصريح أوضح يقتضيه السياق: «إن الله واحد». فاليونانية تقول: «واحد هو»، والفاعل يُفهم من السياق السابق.'
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: الكاتب
  rationale: المقابل العربي المألوف والموجز في سياق الأناجيل لفئة علماء التوراة المعروفة بالكتبة، من غير توسيع تفسيري إلى «معلّم الشريعة».
- source_word: Καλῶς
  choice: أحسنتَ
  rationale: تعبير عربي طبيعي عن الاستحسان، ويؤدي معنى «قلتَ حسنًا» في سياق جواب الكاتب.
- source_word: διδάσκαλε
  choice: يا معلّم
  rationale: ينقل النداء وصيغة الخطاب المباشر، وهو المقابل الحديث الواضح للكلمة اليونانية.
- source_word: ἐπ’ ἀληθείας
  choice: بالحق
  rationale: تعبير عربي فصيح وواضح يؤدي الوظيفة الظرفية للعبارة، أي إن القول مطابق للحق.
- source_word: εἶπες
  choice: قلتَ
  rationale: الماضي البسيط يطابق صيغة الفعل اليوناني ويلائم الإشارة إلى كلام يسوع السابق مباشرة.
- source_word: ὅτι
  choice: إنه
  rationale: تُدخل مضمون ما قاله يسوع، لا سبب استحسان الكاتب؛ واتصال الضمير يحفظ الفاعل المفهوم من السياق.
- source_word: εἷς ἐστιν
  choice: إنه واحد
  rationale: يحفظ إيجاز اليونانية وفاعلها الضمني بدل إدخال لفظ «الله» صراحة في المتن، مع بقاء المرجع واضحًا من السياق السابق.
- source_word: ἄλλος
  choice: آخر
  rationale: المقابل المباشر الذي يؤدي معنى نفي وجود أي آخر.
- source_word: πλὴν αὐτοῦ
  choice: سواه
  rationale: 'صياغة عربية موجزة وطبيعية تعبّر عن الاستثناء والحصر: لا آخر غيره.'
theological_decisions:
- issue: الفاعل الضمني في εἷς ἐστιν
  choice: إنه واحد
  alternative: الله واحد؛ أو لا يوجد إلا إله واحد
  rationale: النص اليوناني لا يكرر لفظ «الله» في هذه الآية، وإن كان السياق السابق يعيّن المرجع بوضوح. تحفظ الصياغة المختارة هذا الإيجاز والغموض النحوي المحدود، وتوضح الحاشية المرجع السياقي من غير إدخاله في المتن.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «الكاتب» بوصفه المصطلح الإنجيلي المألوف، و«أحسنتَ» لاستحسان طبيعي غير متكلف، مع إبقاء العبارة العقائدية موجزة كما في اليونانية.
