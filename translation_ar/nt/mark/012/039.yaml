  text: and the best seats in the synagogues and the places of honor at banquets[b][a],
translation:
  language: ar
  text: وَالْمَقَاعِدَ الأُولَى فِي الْمَجَامِعِ، وَأَمَاكِنَ الصَّدَارَةِ فِي الْوَلَائِمِ،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: الْمَقَاعِدَ الأُولَى
  rationale: ينقل اللفظ معنى المقاعد ذات المرتبة الأعلى في الاجتماع، بصياغة عربية واضحة تحافظ على صورة الجلوس وعلى دلالة المكانة الاجتماعية.
- source_word: συναγωγαῖς
  choice: الْمَجَامِعِ
  rationale: «المجامع» هو المقابل العربي المألوف لدور الاجتماع اليهودية في سياق الأناجيل.
- source_word: πρωτοκλισίας
  choice: أَمَاكِنَ الصَّدَارَةِ
  rationale: يعبّر عن المواضع الأرفع منزلة عند الطعام، من غير إلزام القارئ الحديث بتصوّر الأرائك التي كان المدعوون يتكئون عليها قديمًا.
- source_word: δείπνοις
  choice: الْوَلَائِمِ
  rationale: السياق يتناول وجبات اجتماعية يظهر فيها ترتيب الشرف والمكانة، ولذلك تؤدي «الولائم» المعنى بصورة طبيعية.
- source_word: καὶ ... καὶ
  choice: وَ... وَ...
  rationale: حُفظ تكرار العطف بما يوافق بناء العبارة اليونانية وتعداد مظاهر طلب الوجاهة.
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: فِي الْمَجَامِعِ ... فِي الْوَلَائِمِ
  rationale: استعمال «في» طبيعي في العربية مع المكان ومع سياق الولائم، ويحافظ على التوازي في الأصل.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حافظت الصياغة على كون الآية جزءًا معطوفًا مما قبلها، وعلى التوازي بين المجامع والولائم. لا حاجة إلى حاشية لأن «المقاعد الأولى» و«أماكن الصدارة» تنقلان الفارق بين اللفظين بوضوح.
