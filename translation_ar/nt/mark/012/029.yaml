  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: ar
  text: 'أجاب يسوع: «الأولى هي: اسمع يا إسرائيل، الرب[b] إلهنا، الرب واحد[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز أيضًا: «الرب إلهنا رب واحد»، أو: «الرب هو إلهنا، الرب وحده». تردد العبارة اليونانية صدى تثنية 6:4، وقد تؤكد وحدانية الله و/أو أنه وحده الرب.'
    reason: alternative_reading
  - marker: b
    text: لأن هذه العبارة تقتبس الشِّماع (تثنية 6:4)، فإن «الرب» هنا تقابل اليونانية κύριος، التي استعملتها الترجمة السبعينية بدل الاسم الإلهي يهوه.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: صياغة سردية عربية طبيعية تحفظ معنى الاستجابة في الحوار.
- source_word: Πρώτη
  choice: الأولى
  rationale: الصفة مؤنثة ومستعملة استعمال الاسم، وتعود في السياق إلى «الوصية» من غير حاجة إلى إضافتها صراحة.
- source_word: Ἄκουε
  choice: اسمع
  rationale: تحفظ صيغة الأمر ووقع افتتاح الشِّماع في تثنية 6:4، وهي واضحة وفصيحة في العربية المعاصرة.
- source_word: Ἰσραήλ
  choice: يا إسرائيل
  rationale: إدخال أداة النداء يجعل الخطاب المباشر طبيعيًّا وواضحًا في العربية.
- source_word: κύριος
  choice: الرب
  rationale: المقابل المألوف للفظ اليوناني، وهو هنا يعكس استعمال السبعينية للفظ «الرب» بدل الاسم الإلهي في نص الشِّماع.
- source_word: θεὸς ἡμῶν
  choice: إلهنا
  rationale: ترجمة مباشرة وموجزة للتركيب الإضافي.
- source_word: εἷς
  choice: واحد
  rationale: تحفظ بساطة العبارة اليونانية وكثافتها اللاهوتية من غير حسم ما إذا كان التشديد على الوحدانية أو الانفراد أو كليهما.
theological_decisions:
- issue: صياغة خاتمة الشِّماع والحفاظ على ما فيها من احتمال دلالي
  choice: الرب إلهنا، الرب واحد
  alternative: 'الرب إلهنا رب واحد؛ أو: الرب هو إلهنا، الرب وحده'
  rationale: تلتزم الصياغة المختارة ترتيب اليونانية إلى حد قريب، وتحفظ إعلان وحدانية الله من غير أن تحسم ضمنًا بين معنى الوحدانية ومعنى انفراد الرب بالعبادة؛ وتورد الحاشية الصيغ الأخرى الممكنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «يا إسرائيل» للنداء الطبيعي، وحُفظت بنية الاقتباس الموجزة من الشِّماع مع توضيح احتمالاتها في الحاشية.
