base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: ar
  text: داود نفسه يدعوه ربًّا، فكيف يكون ابنه[a][b]؟ وكان الجمع الغفير يصغي إليه بسرور.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، حرفيًّا: «فمن أين يكون ابنه؟»'
    reason: lexical_alternative
  - marker: b
    text: 'ترد كلمة «ابنه» هنا صدى للقب المسيحاني «ابن داود»، ويمكن أن تحمل أيضًا المعنى الأوسع: «واحد من نسله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: داود نفسه
  rationale: يحفظ الاستعمال التوكيدي للضمير αὐτός، وهو مهم في حجة يسوع.
- source_word: λέγει αὐτὸν κύριον
  choice: يدعوه ربًّا
  rationale: هذا تعبير عربي طبيعي عن الإسناد في العبارة اليونانية، ويحفظ قوة لقب κύριος.
- source_word: πόθεν
  choice: فكيف
  rationale: المعنى الحرفي «فمن أين»، لكن الكلمة هنا تسأل عن وجه إمكان الأمر أو أساسه المنطقي؛ و«فكيف» أوضح في العربية.
- source_word: αὐτοῦ ἐστιν υἱός
  choice: يكون ابنه
  rationale: الإبقاء على «ابنه» يصون صلة العبارة بلقب «ابن داود» والتوتر البلاغي، بدل تفسيرها داخل المتن بمعنى «نسله».
- source_word: ὁ πολὺς ὄχλος
  choice: الجمع الكبير
  rationale: يدل التعبير على جمهور كثير العدد من غير أن يضيف دلالة طبقية مثل «عامة الشعب».
- source_word: ἤκουεν αὐτοῦ
  choice: كان ... يصغي إليه
  rationale: صيغة الماضي الناقص تدل على فعل مستمر، و«كان يصغي» تنقل الاستماع المقصود لا مجرد السماع.
- source_word: ἡδέως
  choice: بسرور
  rationale: ينقل معنى الاستمتاع والرضا في صياغة عربية معاصرة رصينة.
theological_decisions:
- issue: دلالة دعوة داود للمسيح «ربًّا»
  choice: الإبقاء على لقب «ربًّا» والسؤال البلاغي من دون شرح عقائدي داخل المتن.
  alternative: «داود نفسه يدعو المسيح ربًّا» أو «فبأي معنى يكون ابنه؟»
  rationale: يحفظ النص قوة الحجة المسيحانية وغموض مرجع الضمير كما ورد، من غير أن يستبق تفسير التوتر أو يوسعه.
- issue: معنى υἱός في السياق المسيحاني
  choice: ابنه
  alternative: نسله أو من ذريته
  rationale: قد يعني «ابن داود» أحد ذريته، لكن «ابنه» يحفظ اللفظ وصدى اللقب المسيحاني والتقابل الذي يقوم عليه السؤال.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. وُضع مؤشرا الحاشيتين بعد «ابنه» لأنهما يشرحان صياغة السؤال ودلالة البنوة، مع الحفاظ على ترتيب العلامتين [a][b].
