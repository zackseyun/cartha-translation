  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: ar
  text: 'والثانية هي هذه: «أحبب قريبك كنفسك». وليست وصية أخرى أعظم من هاتين.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بترتيب أقرب إلى اليونانية: «لا توجد وصية أخرى أعظم من هاتين»، و«هاتين» تشير في السياق إلى الوصيتين معًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: والثانية هي هذه
  rationale: يُستكمل الاسم المحذوف من السياق، أي «الوصية الثانية»، مع إبقاء التقديم الذي يربطها بالوصية الأولى المذكورة قبلها.
- source_word: Ἀγαπήσεις
  choice: أحبب
  rationale: صيغة المستقبل اليونانية في الاقتباس الكتابي تؤدي معنى الأمر. وصيغة الأمر العربية طبيعية وواضحة وتحفظ القوة الإلزامية.
- source_word: τὸν πλησίον σου
  choice: قريبك
  rationale: «القريب» هو المقابل الكتابي المألوف والدقيق في هذا السياق الأخلاقي، ويحفظ الصلة باللاويين 19:18.
- source_word: ὡς σεαυτόν
  choice: كنفسك
  rationale: ترجمة موجزة تحافظ على المقارنة كما وردت، من غير إضافة فعل تفسيري مثل «كما تحب نفسك».
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: وليست وصية أخرى أعظم من هاتين
  rationale: تحفظ صيغة المقارنة والجمع في τούτων، ويعود اسم الإشارة المثنى في العربية إلى الوصيتين معًا بحسب السياق.
- source_word: ἐντολή
  choice: وصية
  rationale: «وصية» تلائم السجل الكتابي والعهدي في سياق الحديث عن وصايا الشريعة أكثر من «أمر».
theological_decisions:
- issue: مرجع τούτων («هاتين») في العبارة الأخيرة
  choice: الإشارة إلى الوصيتين معًا
  alternative: الإشارة إلى الوصية الثانية وحدها على نحو عام
  rationale: صيغة الجمع اليونانية تشير طبيعيًا إلى الوصيتين المذكورتين في السياق. واختيار «هاتين» يحفظ هذا المرجع من غير تحويله إلى المفرد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «أحبب» بدل الصيغة المستقبلية الحرفية لأن المستقبل اليوناني هنا ذو قوة أمرية، واستُعمل المثنى «هاتين» لإظهار جمع الإشارة اليوناني بصورة طبيعية في العربية.
