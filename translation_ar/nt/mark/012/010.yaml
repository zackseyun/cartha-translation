source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: ar
  text: 'أفلم تقرأوا حتى هذا النص من الكتاب المقدس: «الحجر الذي رفضه البنّاؤون صار هو رأس الزاوية[a]»؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حجر الزاوية».
    reason: بديل اصطلاحي لعبارة «رأس الزاوية»؛ يُترك التفصيل المعماري غير المحسوم خارج المتن والحاشية.
lexical_decisions:
- source_word: οὐδὲ
  choice: حتى
  rationale: 'تنقل هنا قوة النفي المشدَّد في السؤال الاستنكاري، بمعنى: أما قرأتم حتى هذا النص؟'
- source_word: τὴν γραφὴν ταύτην
  choice: هذا النص من الكتاب
  rationale: تدل γραφή في هذا السياق على نص مقدس بعينه. وهذه الصياغة عربية واضحة تشير إلى الاقتباس الكتابي من غير أن توحي بأنه مجرد كتابة عادية.
- source_word: ἀνέγνωτε
  choice: قرأتم
  rationale: الماضي مناسب للسؤال الاستنكاري العربي، ويحافظ على معنى الفعل اليوناني من غير تكلف.
- source_word: Λίθον
  choice: الحجر
  rationale: مع أن اللفظة غير معرّفة في اليونانية، فالمقصود في اقتباس المزمور حجر محدد داخل الصورة المجازية، والتعريف طبيعي في العربية.
- source_word: ἀπεδοκίμασαν
  choice: رفضه
  rationale: ينقل المعنى الأساسي، وهو أن البنّائين لم يقبلوا الحجر بعد تقويمه، بلفظ عربي مباشر ومفهوم.
- source_word: οἱ οἰκοδομοῦντες
  choice: البنّاؤون
  rationale: اسم الفاعل اليوناني مستعمل استعمال الاسم، و«البنّاؤون» موجزة وتحفظ صورة البناء.
- source_word: οὗτος
  choice: هو نفسه
  rationale: يبرز الإشارة المؤكدة إلى أن الحجر المرفوض بعينه هو الذي نال المكانة الجديدة.
- source_word: ἐγενήθη
  choice: صار
  rationale: يعبر بوضوح عن انتقال الحجر إلى منزلة أو وظيفة جديدة، مع بقاء احتمال كون الحدث بتدبير إلهي مفهومًا من السياق لا مضافًا إلى النص.
- source_word: εἰς κεφαλὴν γωνίας
  choice: رأس الزاوية
  rationale: ترجمة قريبة من التركيب اليوناني وتحافظ على صورته واحتماله الدلالي، بدل حصره بلا تنبيه في مصطلح معماري واحد.
theological_decisions:
- issue: الدلالة المسيانية لصورة الحجر في مزمور 118:22
  choice: الإبقاء على صورة الحجر والبنّائين ورأس الزاوية من غير تسمية الحجر صراحةً بالمسيح في الترجمة
  alternative: إضافة تفسير صريح يعرّف الحجر بأنه المسيح
  rationale: سياق المثل يوجّه الصورة إلى يسوع، لكن نص الاقتباس نفسه يقدّم المجاز الكتابي؛ والإبقاء عليه يحفظ قوة الاستدلال والتوتر اللاهوتي من غير توسع تفسيري.
- issue: تحديد نوع حجر «رأس الزاوية»
  choice: استعمال التعبير الحرفي «رأس الزاوية» مع حاشية توضح المقابل الاصطلاحي
  alternative: ترجمته في المتن مباشرةً «حجر الزاوية» أو «الحجر الرئيسي في الزاوية»
  rationale: العبارة اليونانية قد تُفهم بوصفها الحجر الأهم عند الزاوية، بينما نوقش أيضًا موضعه المعماري بدقة؛ لذلك لا ينبغي حسم ما لا يحسمه اللفظ نفسه.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُعمل السؤال الاستنكاري «أفما قرأتم» بتركيب طبيعي، وحُفظ إيقاع الاقتباس وصورته من غير ألفاظ مذهبية أو شرح تفسيري داخل المتن.
