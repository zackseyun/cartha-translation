id: MRK.12.1
reference: Mark 12:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: ar
  text: 'وبدأ يكلّمهم بأمثال: «غرس رجلٌ كرمًا، وأحاطه بسياج، وحفر حوضًا لمعصرة العنب[a]، وبنى برجًا، ثم أجّره لكرّامين[b][c] وسافر».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي حفر الحوض السفلي الذي يتجمع فيه عصير العنب بعد عصره.
    reason: lexical_clarification
  - marker: b
    text: 'يمكن أيضًا: «لمزارعين مستأجرين».'
    reason: lexical_alternative
  - marker: c
    text: تستعيد هذه الصورة ما في إشعياء 5:1–2 من غرس الكرم وإحاطته وتجهيزه.
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο αὐτοῖς ἐν παραβολαῖς λαλεῖν
  choice: بدأ يكلّمهم بأمثال
  rationale: صياغة عربية طبيعية تحفظ معنى البدء، والمخاطَبين، واتخاذ الأمثال أسلوبًا للكلام.
- source_word: Ἀμπελῶνα ἄνθρωπος ἐφύτευσεν
  choice: غرس رجلٌ كرمًا
  rationale: «الكرم» هو البستان المزروع بالعنب، و«رجل» يطابق صاحب الأرض الذكر في سياق المثل.
- source_word: περιέθηκεν φραγμόν
  choice: أحاطه بسياج
  rationale: ينقل معنى إقامة حاجز يحيط بالكرم من غير حصره في سياج نباتي.
- source_word: ὤρυξεν ὑπολήνιον
  choice: حفر حوضًا لمعصرة العنب
  rationale: ὑπολήνιον هو الحوض السفلي الذي يتلقى العصير من المعصرة، لا المعصرة كلها.
- source_word: ᾠκοδόμησεν πύργον
  choice: بنى برجًا
  rationale: ترجمة مباشرة تحافظ على تسلسل تجهيزات الكرم.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: أجّره لكرّامين
  rationale: الفعل يدل على تأجير الملك، و«كرّامين» يلائم عمال الكرم مع بقاء علاقة الإيجار واضحة في الفعل.
- source_word: ἀπεδήμησεν
  choice: سافر
  rationale: يدل الفعل على مغادرة المرء موطنه أو مكانه مدةً؛ و«سافر» موجز وطبيعي في السياق.
theological_decisions:
- issue: مدى التحديد في γεωργοῖς
  choice: كرّامين
  alternative: مزارعين مستأجرين
  rationale: «كرّامين» أدق من جهة عملهم في الكرم، بينما يبيّن الفعل «أجّره» أنهم مستأجرون لا مالكون، من غير إثقال العبارة.
- issue: صدى إشعياء 5:1–2
  choice: الحفاظ على صور غرس الكرم وإحاطته وحفر المعصرة وبناء البرج
  alternative: شرح الصدى داخل المتن
  rationale: الإبقاء على عناصر الصورة يتيح للقارئ إدراك الصلة النصية، أما التصريح بها في المتن فيضيف تفسيرًا غير وارد في اليونانية؛ لذلك تُذكر في حاشية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة سردية كريمة. استُعمل «كرم» و«كرّامين» لدقتهما وشيوعهما في السياق الزراعي والكتابي، مع تجنب الألفاظ القديمة الثقيلة. جميع علامات الحواشي الواردة مثبتة في المتن.
