base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: ar
  text: وأرسل خادمًا آخر، فقتلوه أيضًا؛ ثم أرسل كثيرين آخرين، فضربوا بعضهم وقتلوا بعضهم الآخر.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: خادمًا آخر
  rationale: تعني «آخر» في سياق سلسلة الخدم الذين أرسلهم صاحب الكرم. أُضيفت «خادمًا» لاستكمال المحذوف المفهوم من السياق في العربية بوضوح طبيعي.
- source_word: ἀπέστειλεν
  choice: أرسل
  rationale: ينقل الفعل الماضي البسيط وسير السرد مباشرة من غير زيادة دلالية.
- source_word: κἀκεῖνον
  choice: ذاك أيضًا
  rationale: يحفظ الإشارة في ἐκεῖνον والقوة الإضافية في καί المدمجة معها.
- source_word: ἀπέκτειναν
  choice: قتلوا
  rationale: ترجمة مباشرة وطبيعية للفعل ἀποκτείνω وتحفظ شدة العنف في المثل.
- source_word: πολλοὺς ἄλλους
  choice: كثيرين غيره
  rationale: يشير التعبير إلى خدم إضافيين بعد المذكور، وهذه صياغة عربية واضحة تحافظ على الجمع والتتابع.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: بعضهم ... بعضهم الآخر
  rationale: تنقل البنية التوزيعية والمقابلة بين معاملتين وقعتا على أفراد من المجموعة.
- source_word: δέροντες
  choice: ضربوا
  rationale: يحفظ المعنى العام للضرب الشديد من غير تخصيصه بالجلد القضائي.
- source_word: ἀποκτέννοντες
  choice: قتلوا
  rationale: حُوّل اسم الفاعل اليوناني إلى فعل ماضٍ عربي لتقديم الخلاصة التوزيعية بأسلوب طبيعي مع بقاء المعنى.
theological_decisions:
- issue: صياغة العبارة التلخيصية ذات اسمي الفاعل
  choice: ضربوا بعضهم وقتلوا بعضهم الآخر
  alternative: وهم يضربون بعضهم ويقتلون بعضهم الآخر
  rationale: البنية اليونانية تلخّص ما فعلوه بجماعات من الخدم على نحو توزيعي. والأفعال الماضية أوضح وأفصح في السرد العربي، من غير حسم لمسألة لاهوتية أو تغيير لتدرج العنف.
- issue: المفعول المحذوف بعد «أرسل» في اليونانية
  choice: إظهار «خادمًا» في الموضع الأول، وإعادة «أرسل» قبل «كثيرين غيره»
  alternative: ثم أرسل آخر، فقتلوا ذاك أيضًا، وكثيرين آخرين، بعضهم يضربون وبعضهم يقتلون
  rationale: مرجع «آخر» مفهوم من سياق المثل أنه خادم. إظهاره واستئناف فعل الإرسال يمنعان الالتباس في العربية، من غير إضافة شخصية جديدة أو معنى عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت جمل سردية قصيرة، وحُفظ التدرج من الضرب إلى القتل، كما حُفظت القوة الإضافية في κἀκεῖνον بلفظ «أيضًا».
