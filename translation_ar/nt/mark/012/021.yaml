  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: ar
  text: فتزوّجها الثاني، ومات من غير أن يترك نسلًا، وكذلك الثالث.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: الثاني
  rationale: صفة ترتيبية مع أداة التعريف مستعملة استعمال الاسم. والسياق يبيّن أنه الأخ الثاني، لكن لفظ «الأخ» غير مذكور صراحة في هذه الجملة، لذلك لم يُضف.
- source_word: ἔλαβεν αὐτήν
  choice: أخذها
  rationale: يحافظ على التعبير اليوناني المباشر، وفي سياق زواج الإخوة المتعاقب من الأرملة يُفهم بمعنى أخذها زوجة. أما «تزوجها» فأوضح سياقيًا لكنه أكثر تفسيرًا.
- source_word: ἀπέθανεν
  choice: مات
  rationale: ترجمة مباشرة للفعل في الأسلوب القصصي البسيط، من غير تلطيف تعبيري.
- source_word: μὴ καταλιπὼν
  choice: من غير أن يترك
  rationale: ينقل تركيب اسم الفاعل المنفي بوصفه حالًا مصاحبة للموت أو نتيجة له، بصياغة عربية طبيعية.
- source_word: σπέρμα
  choice: نسلًا
  rationale: يدل هنا على الذرية في سياق زواج أخي الزوج المتوفى، لا على البذر الحرفي. و«نسل» يحفظ الاتساع الدلالي من غير حصره في ولد واحد.
- source_word: ὁ τρίτος ὡσαύτως
  choice: وكذلك الثالث
  rationale: يحافظ على إيجاز العبارة اليونانية وحذف الأفعال المكررة التي يفهمها القارئ من السياق.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على الإيقاع القصصي والحذف البلاغي في خاتمة الآية. لم تُضف حاشية لأن «أخذها» مفهوم في السياق العربي بوصفه أخذها زوجة، ولأن صياغة «تزوجها» ستفسر المعنى بدل أن تحافظ على اللفظ.
