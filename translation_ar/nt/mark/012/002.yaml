  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: ar
  text: وفي الوقت المناسب أرسل إلى الكرّامين[b] عبدًا[a]، ليأخذ من الكرّامين بعض ثمر الكرم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خادمًا». اللفظ اليوناني (δοῦλος) يدل أصلًا على عبد، وقد يُترجم بحسب السياق «خادمًا».
    reason: alternative_reading
  - marker: b
    text: أو «فلاحي الكرم» أو «المستأجرين». يدل اللفظ اليوناني على العاملين في الأرض، ويخصصه سياق الكرم هنا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: أرسل
  rationale: فعل سردي ماضٍ يدل ببساطة على الإرسال، و«أرسل» هو المقابل العربي الطبيعي المباشر.
- source_word: γεωργούς / γεωργῶν
  choice: الكرّامين
  rationale: اللفظ اليوناني يدل على العاملين في الأرض، وسياق الكرم يخصصه بمن يزرعون الكرم ويعتنون به. «الكرّامين» موجز وطبيعي، من غير أن يضيف صراحةً معنى الاستئجار غير المذكور في اللفظ نفسه.
- source_word: τῷ καιρῷ
  choice: في الوقت المناسب
  rationale: يدل καιρός هنا على الوقت الملائم أو المحدد، ويرجح في سياق المثل أنه وقت الثمر، لكن الصياغة لا تزيد هذا التحديد على النص.
- source_word: δοῦλον
  choice: عبدًا
  rationale: يحفظ «عبدًا» دلالة الوضع الاجتماعي في δοῦλος، ولا يخففها إلى مجرد أداء خدمة، مع إثبات «خادمًا» بديلًا مفهومًا في الحاشية.
- source_word: ἵνα ... λάβῃ
  choice: ليأخذ
  rationale: اللام تنقل غرض الإرسال بوضوح وطبيعية، و«يأخذ» يقابل λάβῃ دون إضافة معنى التحصيل أو المطالبة.
- source_word: παρὰ τῶν γεωργῶν
  choice: من الكرّامين
  rationale: تنقل «من» معنى المصدر الذي تؤديه παρά مع المضاف إليه.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: بعض ثمر الكرم
  rationale: تُظهر «بعض» الدلالة التبعيضية الطبيعية للتركيب ἀπό مع الجمع، من غير إضافة «حصته» التي لا يصرح بها اليوناني.
- source_word: ἀμπελῶνος
  choice: الكرم
  rationale: «الكرم» هو المقابل العربي المألوف والدقيق لأرض مزروعة بالعنب.
theological_decisions: []
