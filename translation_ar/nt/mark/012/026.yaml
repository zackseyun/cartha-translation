source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: ar
  text: 'وأما بشأن الأموات، وأنهم يُبعثون، أفما قرأتم في كتاب موسى، في مقطع العُلَّيقة[a]، كيف قال له الله: «أنا إله إبراهيم، وإله إسحاق، وإله يعقوب»؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عند العُلَّيقة»؛ فالعبارة اليونانية يمكن أن تعيّن مقطعًا من الكتاب بقصة العُلَّيقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: وأما من جهة الأموات
  rationale: تُدخل περὶ مع المضاف إليه موضوع الكلام، وتنقل δέ بربط عربي خفيف ملائم لاستئناف الموضوع دون المبالغة في معنى الاستدراك.
- source_word: ὅτι ἐγείρονται
  choice: وأنهم يُقامون
  rationale: يحافظ المبني للمجهول على صيغة الفعل اليوناني وعلى دلالة إقامة الأموات، من غير التصريح بفاعل لم يذكره النص هنا.
- source_word: οὐκ ἀνέγνωτε
  choice: أفما قرأتم
  rationale: صيغة استفهام إنكاري طبيعية فصيحة تنقل احتجاج يسوع بما سبق أن قرأه المخاطبون في الكتاب.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: في كتاب موسى
  rationale: ترجمة واضحة وطبيعية؛ ويمكن أن تدل βίβλος ماديًا على الدرج، لكن المقصود هنا كتاب موسى أو كتاباته.
- source_word: ἐπὶ τοῦ βάτου
  choice: في موضع العُلَّيقة
  rationale: يفيد التعبير تعيين مقطع من الكتاب بقصة العليقة، لا مجرد الموقع المكاني؛ وتوضح كلمة «موضع» وظيفة العبارة الإحالية مع إبقاء البديل الحرفي في الحاشية.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: كيف قال له الله
  rationale: هذه صياغة عربية طبيعية تُدخل مضمون القول المباشر؛ ولا يلزم تكرار «قائلًا» لأن العربية تستغني عنه قبل الاقتباس.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: أنا إله إبراهيم، وإله إسحاق، وإله يعقوب
  rationale: تُحفظ «أنا» والبنية المتكررة ذات القوة البلاغية، ولا تُضاف كلمة «هو» أو فعل زمني غير موجود في اليونانية؛ والجملة الاسمية العربية تفيد الحاضر في هذا السياق.
theological_decisions:
- issue: دلالة القيامة في ὅτι ἐγείρονται
  choice: وأنهم يُقامون
  alternative: وأنهم يقومون
  rationale: المبني للمجهول أقرب إلى الصيغة اليونانية ويحفظ إمكان الإشارة إلى فعل الله من غير أن يصرح النص بالفاعل في هذه العبارة.
- issue: صيغة التعريف الإلهي في الاقتباس
  choice: أنا إله إبراهيم، وإله إسحاق، وإله يعقوب
  alternative: أنا هو إله إبراهيم وإله إسحاق وإله يعقوب
  rationale: الجملة الاسمية العربية تنقل قوة Ἐγώ مع التعريف الإلهي بوصف حاضر، وتحفظ التكرار الذي يقوم عليه سياق الحجة، من غير إدخال ضمير فصل غير لازم.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «العُلَّيقة» بوصفها التسمية الكتابية المألوفة للشجيرة في قصة موسى، مع «موضع» لتوضيح أن المقصود مقطع الكتاب. وُضع مؤشر الحاشية [a] في المتن مطابقًا للحاشية.
