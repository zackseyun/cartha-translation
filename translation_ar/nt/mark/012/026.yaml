  to: 'وأما بشأن الأموات، وأنهم يُبعثون، أفما قرأتم في كتاب موسى، في مقطع العُلَّيقة[a]، كيف قال له الله: «أنا إله إبراهيم، وإله إسحاق، وإله يعقوب»؟'
  rationale: تُحسَّن سلاسة العبارة الافتتاحية، ويُستبدل «يُقامون» بـ«يُبعثون» لتحديد دلالة القيامة في العربية الحديثة مع إبقاء المبني للمجهول. كما يُجعل «مقطع العليقة» أوضح في بيان الإحالة الكتابية، وتبقى القراءة المكانية البديلة في الحاشية. لا يضيف التعديل تفسيرًا مذهبيًا ولا يغير بنية الاقتباس أو تأكيده الحاضر في العربية.
