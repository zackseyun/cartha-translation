  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: ar
  text: الذين يلتهمون بيوت الأرامل، ويصلّون طويلًا للتظاهر[a]؛ هؤلاء سينالون دينونة أشد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذريعةً» أو «مراءاةً».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حكمًا أشد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: يلتهمون
  rationale: يحافظ على الصورة المجازية القوية في اليونانية، إذ يصوّر استنزاف ممتلكات الأرامل بجشع، من غير اختزالها في تفسير مباشر مثل «يستغلّون».
- source_word: οἰκίας
  choice: بيوت
  rationale: ترجمة مباشرة للتعبير اليوناني الملموس، مع إبقاء احتمال دلالته السياقية على أملاك الأرامل أو معايشهن من غير حسم زائد.
- source_word: χηρῶν
  choice: الأرامل
  rationale: ينقل بوضوح المضاف إليه في صيغة الجمع، ويحدد الفئة الضعيفة التي يقع عليها الاعتداء.
- source_word: προφάσει
  choice: للتظاهر
  rationale: ينقل معنى الذريعة أو المظهر الزائف بصياغة عربية طبيعية، ويبيّن أن الصلاة الطويلة تُمارس طلبًا للمظهر لا بوصفها تقوى صادقة.
- source_word: μακρὰ
  choice: طويلًا
  rationale: استُعملت حالًا مع فعل الصلاة لنقل الدلالة الظرفية على امتداد المدة.
- source_word: προσευχόμενοι
  choice: يصلّون
  rationale: صيغة فعلية عربية طبيعية منسقة مع «يلتهمون»، مع الحفاظ على وظيفة الوصف المستمر في السياق.
- source_word: λήμψονται
  choice: سينالون
  rationale: تعبير عربي فصيح وطبيعي يناسب سياق الجزاء والدينونة ويحافظ على دلالة المستقبل.
- source_word: περισσότερον
  choice: أشد
  rationale: في اقترانه بالدينونة، تعبّر «أشد» طبيعيًا عن زيادة درجة العقوبة المقصودة بالمقارنة.
- source_word: κρίμα
  choice: دينونة
  rationale: ينقل القوة العقابية المرجحة في سياق التحذير من النفاق الديني، مع إبقاء البديل الأوسع «حكم» في الحاشية.
theological_decisions:
- issue: دلالة κρίμα في التحذير من النفاق الديني
  choice: دينونة
  alternative: حكم
  rationale: السياق يتحدث عن محاسبة عقابية، و«دينونة» تنقل هذه القوة من غير إضافة تفصيل عقائدي لا يصرح به النص. وتبقى «حكم» قراءة معجمية أوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الصورة المجازية في «يلتهمون بيوت الأرامل»، وحُوِّل التركيب الوصفي اليوناني إلى تنسيق فعلي طبيعي في العربية. استُخدمت الفاصلة المنقوطة قبل جملة الجزاء لإبراز الانتقال من وصف الفعل إلى الحكم عليه.
