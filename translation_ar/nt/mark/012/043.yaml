base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: ar
  text: 'فدعا تلاميذه إليه وقال لهم: «الحق أقول لكم: إن هذه الأرملة الفقيرة ألقت في الخزانة[a] أكثر من جميع الذين يلقون فيها».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «صندوق التقدمات» أو «صندوق الخزانة». تشير الكلمة اليونانية إلى صندوق التقدمات في الهيكل أو إلى موضع الخزانة فيه.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: فدعا ... إليه
  rationale: ينقل معنى استدعاء يسوع تلاميذه إلى جانبه، مع صياغة عربية طبيعية تربط الفعل بما بعده.
- source_word: μαθητὰς
  choice: تلاميذه
  rationale: المقابل العربي المألوف في سياق أتباع يسوع والمتعلمين منه.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صيغة عربية واضحة ومهيبة تنقل قوة العبارة التوكيدية التي يستهل بها يسوع كلامه.
- source_word: χήρα
  choice: الأرملة
  rationale: المقابل المباشر والدقيق للكلمة اليونانية.
- source_word: πτωχὴ
  choice: الفقيرة
  rationale: ينقل المعنى المباشر من غير مبالغة كاختيار لفظ يدل حتمًا على العوز المدقع.
- source_word: πλεῖον πάντων
  choice: أكثر من جميع
  rationale: يحافظ على المقارنة الواردة في اليونانية من غير إدخال تفسير يحدد هل المقصود القيمة النقدية أم قيمة العطاء بالنظر إلى حال صاحبه.
- source_word: ἔβαλεν
  choice: ألقت
  rationale: فعل طبيعي في سياق إلقاء النقود في وعاء التقدمات، ويحافظ على الصلة اللفظية بالفعل نفسه في العبارة التالية.
- source_word: τῶν βαλλόντων
  choice: الذين يلقون
  rationale: يحافظ على صيغة اسم الفاعل الحاضر التي تصور فعل بقية المتبرعين الجاري في ذلك الوقت.
- source_word: γαζοφυλάκιον
  choice: الخزانة
  rationale: ترجمة موجزة ومألوفة تشير إلى خزانة الهيكل أو موضع جمع التقدمات، مع توضيح البدائل في الحاشية.
theological_decisions:
- issue: تقويم عطية الأرملة
  choice: الإبقاء على العبارة الحرفية «أكثر من جميع» من غير تفسير نوع هذه الزيادة داخل النص
  alternative: التصريح بأنها أعطت قيمةً أعظم نسبيًا، أو فهم العبارة على أنها مبلغ نقدي أكبر حرفيًا
  rationale: يفسر العدد التالي المقارنة في ضوء فقر الأرملة ووفرة الآخرين، لكن هذا العدد نفسه يترك العبارة المقارنة من دون ذلك الشرح؛ لذلك يحافظ النص هنا على التوتر والدلالة المفتوحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «فدعا» لتسلسل السرد الطبيعي، وحوفظ على تكرار جذر «ألقى» في الفعلين وعلى إيجاز صيغة يسوع التوكيدية.
