  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: ar
  text: فأخذوه[a] وقتلوه وألقوه خارج الكرم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يتوقع بعض القراء، استنادًا إلى الروايات الموازية للمثل، ترتيبًا يفيد أنهم ألقوه خارج الكرم ثم قتلوه؛ لكن نص مرقس اليوناني هنا يقول إنهم قتلوه ثم ألقوه خارج الكرم.
    reason: cross_reference
lexical_decisions:
- source_word: λαβόντες
  choice: فأمسكوه
  rationale: اسم فاعل ماضٍ من λαμβάνω يسبق الفعلين الرئيسيين. «أمسكوه» عربية طبيعية في سياق الاعتداء، وتحفظ معنى الأخذ من غير أن تفرض قوة «قبضوا عليه» أو «اختطفوه».
- source_word: ἀπέκτειναν
  choice: وقتلوه
  rationale: ينقل المعنى المباشر للفعل ἀποκτείνω بلغة عربية واضحة ومعاصرة.
- source_word: ἐξέβαλον
  choice: ثم ألقوه خارج
  rationale: يحفظ قوة الإخراج في ἐκβάλλω، و«ألقوه خارج الكرم» تعبير عربي طبيعي يلائم كون المذكور قد قُتل. أُضيفت «ثم» لإظهار ترتيب الأفعال الذي يقدمه النص اليوناني.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: خارج الكرم
  rationale: ينقل الحركة إلى خارج حدود الكرم بعد فعل الإلقاء، بصياغة عربية موجزة وطبيعية.
- source_word: ἀμπελῶνος
  choice: الكرم
  rationale: «الكرم» هو المقابل العربي المألوف لـ ἀμπελών في هذا السياق المثلي، أي بستان العنب.
theological_decisions:
- issue: ترتيب القتل والإخراج في المثل
  choice: 'حُفظ ترتيب النص اليوناني: أمسكوه، ثم قتلوه، ثم ألقوه خارج الكرم.'
  alternative: إلقاؤه خارج الكرم أولًا ثم قتله، وفق ما قد يتوقعه بعض القراء من الروايات الموازية للمثل.
  rationale: نص مرقس في SBLGNT يضع القتل قبل الإلقاء خارج الكرم؛ لذلك لا تُوائَم الصياغة مع الروايات الموازية أو التوقعات التفسيرية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع تسلسل سردي سريع. استُعملت «فـ» لربط الفعل بما قبله، و«ثم» لإبراز الترتيب الصريح في النص اليوناني.
