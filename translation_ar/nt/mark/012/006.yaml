  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: ar
  text: 'وكان لا يزال لديه واحدٌ، وهو ابنٌ حبيبٌ. فأرسله إليهم أخيرًا، قائلًا: «سيحترمون ابني».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «سيستحيون من ابني» أو «يُجِلّون ابني»؛ فالفعل قد يدل على الخجل أمام شخص أو إظهار التوقير له، والسياق هنا يرجّح معنى الاحترام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: وكان لا يزال لديه واحد
  rationale: ينقل معنى بقاء شخص واحد لديه بعد إرسال العبيد السابقين، مع الحفاظ على ترتيب العبارة وإيجازها قدر الإمكان في العربية الطبيعية.
- source_word: υἱὸν ἀγαπητόν
  choice: ابن حبيب
  rationale: «حبيب» مقابل عربي واضح وموقر لـἀγαπητός، ويحفظ صدى وصف الابن في إنجيل مرقس من غير توسيع تفسيري.
- source_word: ἀπέστειλεν αὐτὸν ἔσχατον πρὸς αὐτούς
  choice: فأرسله إليهم أخيرًا
  rationale: «أخيرًا» تؤدي الاستعمال الظرفي لـἔσχατον وتبرز أن إرسال الابن هو ذروة سلسلة الإرساليات.
- source_word: λέγων ὅτι
  choice: قائلًا
  rationale: يمهّد للاقتباس المباشر بأسلوب عربي طبيعي.
- source_word: Ἐντραπήσονται
  choice: سيحترمون
  rationale: يدل الفعل في هذا السياق على إبداء الاحترام أو المهابة، مع بقاء معنى الخجل أو الاستحياء ممكنًا معجميًا.
- source_word: τὸν υἱόν μου
  choice: ابني
  rationale: ترجمة مباشرة تحفظ قوة العبارة وصلتها بهوية الابن في المثل.
theological_decisions:
- issue: الصدى المسيحاني لعبارة «ابن حبيب»
  choice: إبقاء «ابن حبيب» في المتن من غير شرح لاهوتي مضاف
  alternative: ابن عزيز عليه
  rationale: تحفظ العبارة صداها داخل إنجيل مرقس بوصف يسوع الابن الحبيب، من غير أن تجعل الدلالة التفسيرية تصريحًا زائدًا على نص المثل.
- issue: توقع صاحب الكرم في قوله Ἐντραπήσονται
  choice: سيحترمون ابني
  alternative: سيستحيون من ابني
  rationale: «سيحترمون» هو الأنسب لسياق توقع إظهار المهابة للابن، بينما تثبت الحاشية مجال الفعل الدلالي المتصل بالخجل والاستحياء ولا تحسم التوتر المعجمي بصمت.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. روعي الإيجاز السردي والمحافظة على التدرج نحو إرسال الابن، مع تجنب العبارات الكنسية الاصطلاحية أو التفسير المذهبي.
