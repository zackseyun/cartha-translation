  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: ar
  text: كان هناك سبعة إخوة، فتزوّج الأول منهم امرأةً، وعند موته لم يترك نسلًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بذرًا»؛ وتُستعمل الكلمة اليونانية هنا بمعنى النسل أو الذرية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: كان هناك سبعة إخوة
  rationale: صياغة عربية طبيعية للجملة الوجودية، مع إبقاء «إخوة» لأن السياق يتحدث تحديدًا عن رجال إخوة.
- source_word: ὁ πρῶτος
  choice: الأول
  rationale: يدل اللفظ على الترتيب بين الإخوة؛ أما «الأكبر» فتضيف دلالة عمرية لا يقتضيها النص.
- source_word: ἔλαβεν γυναῖκα
  choice: فتزوّج
  rationale: العبارة اليونانية اصطلاح للزواج، و«تزوّج» أوضح وأطبع في العربية المعاصرة من النقل الحرفي «أخذ امرأة».
- source_word: ἀποθνῄσκων
  choice: ثم مات
  rationale: ينقل الحدث بصياغة عربية سلسة ضمن تسلسل الرواية؛ والمقصود أنه عند موته لم يخلّف نسلًا.
- source_word: οὐκ ἀφῆκεν σπέρμα
  choice: ولم يترك نسلًا
  rationale: الفعل يعني الترك بعد الموت في هذا السياق، و«نسلًا» ينقل الاستعمال الاصطلاحي لـ«بذر/زرع» للدلالة على الذرية دون حصره في طفل واحد.
theological_decisions: []
