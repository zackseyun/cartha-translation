base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: ar
  text: 'فقال لهم يسوع[a]: «أليس لهذا السبب تضلّون، لأنكم لا تعرفون الكتب المقدسة ولا قدرة الله؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أما تضلّون لهذا السبب، لأنكم لا تعرفون الكتب المقدسة ولا قدرة الله؟»'
    reason: بديل يحافظ على إمكان صوغ Οὐ διὰ τοῦτο πλανᾶσθε كسؤال إنكاري متصل، وعلى النبرة الممكنة للفعل πλανᾶσθε.
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: فقال لهم يسوع
  rationale: ينقل الفعل φημί بمعناه السردي البسيط، «قال»، من غير إضافة معنى «أجاب» غير المصرّح به في العبارة.
- source_word: Οὐ διὰ τοῦτο
  choice: أليس لهذا
  rationale: يحفظ صيغة السؤال الإنكاري المتوقِّع للإقرار، كما يحفظ دلالة السبب في διὰ τοῦτο.
- source_word: πλανᾶσθε
  choice: تضلّون
  rationale: الفعل اليوناني يحتمل الوقوع في الخطأ أو الضلال. و«تضلّون» عربية واضحة تحفظ قوة التوبيخ ولا تحصر المعنى في خطأ ذهني محض.
- source_word: μὴ εἰδότες
  choice: لأنكم لا تعرفون
  rationale: يُفهم اسم الفاعل هنا على أنه يبيّن سبب ضلالهم؛ وتحويله إلى جملة سببية صريحة طبيعي في العربية.
- source_word: τὰς γραφὰς
  choice: الكتب
  rationale: الجمع المعرّف يشير في هذا السياق اليهودي إلى الأسفار المقدسة؛ و«الكتب» تعبير عربي كتابي موجز ومعروف.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ولا قدرة الله
  rationale: ينقل μηδέ بالعطف المنفي، وδύναμις بـ«قدرة»، والإضافة العربية تؤدي معنى τοῦ θεοῦ بوضوح وطبيعية.
theological_decisions:
- issue: طبيعة الضلال في πλανᾶσθε
  choice: تضلّون
  alternative: تخطئون؛ تُضلَّلون
  rationale: الصيغة اليونانية قد تدل على الخطأ أو الضلال، وربما تحتمل معنى الانقياد إلى الضلال. اختيرت «تضلّون» لإبقاء مدى المعنى وقوة التوبيخ من غير تحديد أن السبب خداع خارجي أو مجرد سوء فهم عقلي.
- issue: العلاقة بين عدم المعرفة والضلال
  choice: لأنكم لا تعرفون
  alternative: إذ لا تعرفون
  rationale: اسم الفاعل المنفي يقدّم أساس الضلال أو سببه. الصياغة السببية توضّح هذا الارتباط من غير إضافة حكم لاهوتي يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ السؤال الإنكاري، واستُعملت «الكتب» بالمعنى السياقي للأسفار المقدسة، مع تجنّب تفسير الضلال تفسيرًا عقليًا أو روحيًا حصريًا.
