  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: ar
  text: وجلس قبالةَ خزانة الهيكل[a]، وكان يراقب كيف يضع الجمع نقودًا في الخزانة. وكان كثيرون من الأغنياء يضعون مبالغ كبيرة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «صندوق التقدمات» أو «خزانة الأموال»؛ فاللفظ اليوناني قد يشير إلى خزانة الهيكل أو إلى الصناديق المرتبطة بها.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: وجلس
  rationale: اسم الفاعل الماضي يهيئ للمشهد قبل الفعل الرئيس؛ وصيغة «وجلس» طبيعية في السرد العربي وتحفظ تعاقب الحدثين.
- source_word: κατέναντι
  choice: قبالةَ
  rationale: تدل على موضع في الجهة المقابلة مباشرة، و«قبالة» فصيحة وواضحة.
- source_word: γαζοφυλάκιον
  choice: خزانة الهيكل
  rationale: يمكن أن يدل اللفظ على خزانة الهيكل أو على صناديق التقدمات المرتبطة بها؛ وإضافة «الهيكل» توضح السياق من غير حسم طبيعة الموضع أو الوعاء، مع بيان البديل في الحاشية.
- source_word: ἐθεώρει
  choice: أخذ يراقب
  rationale: الماضي الناقص يصور مراقبة مستمرة؛ والتركيب العربي يحفظ هذا الجانب الاستمراري.
- source_word: πῶς
  choice: كيف
  rationale: يحفظ التركيز المحتمل على كيفية الإيداع، بدل اختزاله في مجرد وقوعه.
- source_word: ὁ ὄχλος
  choice: الجمع
  rationale: مقابل عربي واضح ومألوف للجماعة المحتشدة في السياق السردي.
- source_word: βάλλει / ἔβαλλον
  choice: يضع / يضعون
  rationale: المعنى السياقي هو إيداع النقود، و«يضع» طبيعي بالعربية ولا يوحي برميها بعنف؛ وحُفظ الاستمرار في الفعلين بالسياق والتركيب.
- source_word: χαλκόν
  choice: نقودًا
  rationale: المعنى الحرفي نحاس أو نقود نحاسية، لكنه في هذا السياق يدل على المال المعدني المودَع؛ و«نقودًا» طبيعي ولا يفرض فئة نقدية محددة.
- source_word: πολλοὶ πλούσιοι
  choice: كثيرون من الأغنياء
  rationale: يحفظ الكثرة والوصف بالثراء بصياغة عربية طبيعية، من غير زيادة تحديد للجنس لا يقتضيه السياق.
- source_word: πολλά
  choice: مبالغ كبيرة
  rationale: اللفظ يعني حرفيًا «أشياء كثيرة»، لكنه مع النقود يفيد مقدارًا كبيرًا؛ وهذه الصياغة واضحة وطبيعية.
