source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: ar
  text: 'داود نفسه قال في الروح القدس[a]: «قال الرب لربي[b]: اجلس عن يميني حتى أضع أعداءك تحت قدميك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالروح القدس».'
    reason: alternative_reading
  - marker: b
    text: الاقتباس من مزمور 110:1. في النص العبري، تمثل كلمة «الرب» الأولى الاسم الإلهي (يهوه، الذي جرت العادة أن يُنقل «الرَّب»)، أما الثانية فتشير إلى رب داود.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: داود نفسه
  rationale: يحفظ الاستعمال التوكيدي للضمير αὐτός، ويبرز أن داود هو القائل.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: في الروح القدس
  rationale: ينقل حرف الجر ἐν نقلا مباشرا ويحافظ على إمكان فهم العبارة بوصفها وصفا لحالة الكلام أو لوساطته، من غير تضييق المعنى.
- source_word: κύριος
  choice: الرب
  rationale: هو المقابل العربي الطبيعي والراسخ لـ κύριος. وأُبقي اللفظ نفسه في الموضعين وفقا للنص اليوناني، مع توضيح خلفية الاقتباس العبرية في الحاشية.
- source_word: τῷ κυρίῳ μου
  choice: لربي
  rationale: يحفظ تكرار لفظ κύριος وصيغة الإضافة، وهو مهم لحجة يسوع في السياق.
- source_word: Κάθου
  choice: اجلس
  rationale: صيغة أمر عربية موجزة وطبيعية تلائم سياق الجلوس في مقام السلطان.
- source_word: ἐκ δεξιῶν μου
  choice: عن يميني
  rationale: تعبير عربي فصيح راسخ يؤدي المعنى الاصطلاحي اليوناني، أي الجلوس في الجانب الأيمن ذي مقام التكريم والسلطان.
- source_word: ἕως ἂν θῶ
  choice: حتى أضع
  rationale: ينقل الغاية الزمنية والفعل المستقبلي المتوقع بإيجاز ووضوح.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: تحت قدميك
  rationale: يلتزم بصورة نص مرقس، الذي يقول «تحت قدميك» ولا يورد لفظ «موطئ» الوارد في صياغة المزمور الأوسع.
theological_decisions:
- issue: صيغة نسبة كلام داود إلى الروح القدس
  choice: قال في الروح القدس
  alternative: قال بالروح القدس
  rationale: يحافظ الاختيار على الصياغة اليونانية وعلى سعة دلالة ἐν، فلا يحسم ما إذا كان التركيز على حال داود في الروح أم على وساطة الروح في كلامه.
- issue: القوة المسيحانية لاقتباس مزمور 110:1
  choice: قال الرب لربي
  alternative: قال الرب الإله لسيدي
  rationale: يُبقي المتن تكرار κύριος كما في اليونانية ولا يستورد إليه تمييزا لفظيا من العبرية، بينما توضح الحاشية أن اللفظ الأول في أصل المزمور يمثل الاسم الإلهي وأن الثاني يشير إلى رب داود.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع الإبقاء على الصياغة الكتابية المألوفة «عن يميني». وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرهما الحاشيتان، تصحيحا للتعارض الظاهر بين موضعي العلامتين ومحتوى الحواشي في طبقة الاستشارة الإنجليزية.
