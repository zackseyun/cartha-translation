lexical_decisions:
- source_word: λαβόντες (λαμβάνω)
  choice: فأمسكوا به
  rationale: اسم فاعل ماضٍ يفيد فعلًا سابقًا للأفعال الرئيسة. و«أمسكوا به» عربية طبيعية تحافظ على المعنى العام من غير أن تضيف إلى اللفظ اليوناني دلالة أشد مثل «قبضوا عليه».
- source_word: ἔδειραν (δέρω)
  choice: وضربوه
  rationale: يدل الفعل على الضرب أو الإيذاء بالضرب، و«ضربوه» واضح ودقيق من غير تخصيصه بالجلد الرسمي، وهو ما لا يصرّح به النص.
- source_word: ἀπέστειλαν (ἀποστέλλω)
  choice: وأرسلوه
  rationale: ينقل المعنى المباشر للفعل، أي صرفوا الخادم من عندهم وأعادوه من غير أن يعطوه ما جاء ليأخذه.
- source_word: κενόν (κενός)
  choice: فارغَ اليدين
  rationale: الصفة في صيغة النصب تصف حال الخادم عند إرساله؛ والتعبير العربي الاصطلاحي «فارغ اليدين» يوضح أنه عاد من دون شيء، مع إثبات المعنى الحرفي البديل في الحاشية.
- source_word: καὶ ... καὶ
  choice: فـ ... و... و...
  rationale: حُفظ تتابع الأفعال البسيط؛ واستُعملت الفاء في البداية لربط الجملة بما قبلها طبيعيًا، ثم الواو بين الأفعال المتعاقبة.
