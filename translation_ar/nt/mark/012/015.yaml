source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: ar
  text: 'لكنّه، إذ عرف رياءهم، قال لهم: «لماذا تختبرونني؟[b] أحضروا لي دينارًا[a] كي أراه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان الدينار قطعة نقدية فضية رومانية، وكان يُستعمل عادةً كأجرة يوم عمل.
    reason: cultural_note
  - marker: b
    text: 'أو: «لماذا تجربونني؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: كان يعرف
  rationale: ينقل معنى العلم القائم في صيغة اسم الفاعل من οἶδα بلغة عربية طبيعية، من غير أن يوحي بأنه اكتشف رياءهم في تلك اللحظة فقط.
- source_word: ὑπόκρισιν
  choice: رياءهم
  rationale: «الرياء» هو المقابل العربي المباشر الذي يحفظ معنى التظاهر المخادع وعدم الإخلاص في السياق.
- source_word: Τί
  choice: لماذا
  rationale: تؤدي Τί هنا وظيفة السؤال عن السبب، و«لماذا» هي الصياغة العربية الطبيعية.
- source_word: πειράζετε
  choice: تختبرونني
  rationale: يحفظ هذا اللفظ معنى وضع يسوع موضع الاختبار بقصد عدائي، من غير حصر المعنى في الإغراء بالخطيئة.
- source_word: φέρετέ
  choice: ائتوني بـ
  rationale: صيغة أمر عربية طبيعية تدل على إحضار الشيء إلى المتكلم.
- source_word: δηνάριον
  choice: دينار
  rationale: يحافظ على الاسم التاريخي للعملة، مع إيضاح دلالته الثقافية في الحاشية.
- source_word: ἵνα ἴδω
  choice: لأنظر إليه
  rationale: ينقل غرض الطلب بوضوح، ويُظهر مرجع الضمير المفهوم، أي الدينار.
theological_decisions:
- issue: دلالة πειράζετε في اتهام يسوع لهم
  choice: تختبرونني
  alternative: تجربونني
  rationale: السياق يدل على محاولة عدائية للإيقاع به، و«تختبرونني» تنقل هذا المعنى من غير إضافة إيحاء أضيق بالإغراء إلى الخطيئة؛ وتُذكر الصيغة البديلة في الحاشية حفاظًا على المجال الدلالي.
translation_notes:
  register: 'عربية فصحى حديثة واضحة وموقرة. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما: [b] بعد سؤال الاختبار، و[a] بعد اسم العملة.'
