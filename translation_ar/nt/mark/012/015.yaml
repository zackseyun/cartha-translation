  verdict: revise
  source_fidelity: 'المعنى العام أمين للنص اليوناني: الرياء، والاختبار العدائي، وإحضار الدينار، وغرض رؤيته كلها منقولة بدقة. لكن «لكنه كان يعرف» أقل سلاسة في ربط اسم الفاعل εἰδὼς بالفعل الرئيس، و«ائتوني بدينار» أوسع قليلًا من أمر الإحضار المباشر φέρετέ μοι.'
  naturalness: اللغة فصحى واضحة عمومًا. الصياغة «لكنّه، إذ عرف رياءهم، قال لهم» أكثر انسيابًا في العربية السردية، و«أحضروا لي دينارًا كي أراه» أوضح وأقرب إلى المقصود من الأمر اليوناني.
  terminology: «رياءهم» و«تختبرونني» و«دينار» اختيارات مناسبة. وتبقى «تجربونني» بديلًا معجميًا مشروعًا في الحاشية. تُحسَّن عبارة الحاشية الثقافية إلى «كأجرة يوم عمل» لتكون طبيعية ودقيقة.
