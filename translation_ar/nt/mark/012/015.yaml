    rationale: εἰδὼς اسم فاعل يدل على علمه بريائهم عند قوله هذا؛ وصياغة «إذ عرف» تمثل الرابط السردي العربي بوضوح أكبر دون إضافة معنى لاهوتي أو تفسيري.
  - severity: low
    issue: صياغة أمر الإحضار
    rationale: «أحضروا لي» تنقل φέρετέ μοι مباشرةً وبوضوح أكبر من «ائتوني بـ»، التي قد تركز على مجيئهم هم.
  - severity: low
