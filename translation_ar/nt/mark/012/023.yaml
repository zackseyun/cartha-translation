  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: ar
  text: في القيامة، حين يقومون، لمن منهم ستكون زوجةً؟ فقد كانت زوجةً للسبعة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ ἀναστάσει
  choice: في القيامة
  rationale: يشير الاسم المعرّف هنا إلى القيامة الأخروية موضوع الجدال مع الصدوقيين، و«القيامة» هو المقابل العربي الطبيعي الموجز.
- source_word: ὅταν ἀναστῶσιν
  choice: حين يقومون
  rationale: تفيد العبارة الزمنية حدثًا مستقبليًا؛ وتبقي «يقومون» الصلة اللفظية بالقيامة من غير إضافة معنى «مرة أخرى» غير المصرح به.
- source_word: τίνος αὐτῶν
  choice: لمن منهم
  rationale: ينقل الاستفهام مع معنى التبعيض بعبارة عربية طبيعية، من غير افتراض جواب.
- source_word: ἔσται γυνή
  choice: تكون زوجة
  rationale: السياق الزوجي يحدد معنى γυνή، والتركيب العربي يحافظ على السؤال عن العلاقة القائمة في القيامة.
- source_word: οἱ γὰρ ἑπτὰ
  choice: فقد ... للسبعة
  rationale: تنقل الفاء التعليلية γάρ، ويكفي «السبعة» لأن السياق السابق يحدد أنهم الإخوة السبعة.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: كانت زوجةً للسبعة
  rationale: يعبّر عن كونهم جميعًا قد اتخذوها زوجة، ويحافظ على حالة العلاقة الزوجية بدل تحويل العبارة إلى مجرد حدث الزواج.
theological_decisions:
- issue: لغة القيامة في الجدال مع الصدوقيين
  choice: في القيامة، حين يقومون
  alternative: في القيامة من الأموات، حين يقومون ثانيةً
  rationale: يحفظ النص الإقرار بقيامة مستقبلية، مع تجنب إضافة «من الأموات» و«ثانيةً» لأنهما مفهومان من السياق وليسا مصرحًا بهما في ألفاظ هذه الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «لمن منهم تكون زوجة؟» بوصفه تركيبًا عربيًا طبيعيًا قريبًا من بنية الأصل، مع إبقاء التكرار الدلالي بين «القيامة» و«يقومون».
