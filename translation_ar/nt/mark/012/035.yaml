source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: ar
  text: 'وأجاب يسوع وهو يعلِّم في الهيكل قائلًا: «كيف يقول الكتبة إن المسيح[a] ابن داود؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «المسيّا». واللفظ اليوناني هو خريستوس، وهو مستعمل هنا لقبًا مسيانيًا.'
    reason: توضيح دلالة اللقب وذكر المقابل البديل
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: وأجاب
  rationale: يحافظ على معنى الاستجابة في الفعل اليوناني، مع أن السياق لا يذكر سؤالًا مباشرًا سابقًا؛ وصيغة «أجاب» عربية فصيحة طبيعية في افتتاح قول ناشئ عن الموقف.
- source_word: ἔλεγεν
  choice: قائلًا
  rationale: ينقل فعل القول ويمهّد للاقتباس المباشر، بينما يحمل «وهو يعلِّم» الإطار الاستمراري الذي تدل عليه الصيغة والسياق.
- source_word: διδάσκων
  choice: وهو يعلِّم
  rationale: يعبّر بوضوح عن تزامن التعليم مع قول يسوع.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: اللفظ اليوناني يشير إلى مجمّع الهيكل، و«الهيكل» هو المقابل العربي المألوف من غير إضافة تفسيرية إلى المتن.
- source_word: Πῶς
  choice: كيف
  rationale: يحافظ على صيغة السؤال اليونانية وعلى قوته الجدلية من غير تحويلها صراحة إلى «كيف يمكن»، بما قد يزيد دلالة الاستحالة.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: مصطلح تاريخي عربي راسخ لهذه الفئة، وهو أدق من التفسير الأوسع «معلّمو الشريعة».
- source_word: ὁ χριστός
  choice: المسيح
  rationale: يؤدي اللقب في سياقه المسياني اليهودي أداءً طبيعيًا وراسخًا في العربية.
- source_word: υἱὸς Δαυίδ
  choice: ابن داود
  rationale: ينقل التعبير النسبي واللقب المسياني المألوف بإيجاز، ولا يلزم إدخال أداة تعريف قبل «ابن» في هذا التركيب الخبري العربي.
theological_decisions:
- issue: دلالة لقب Χριστός
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الطبيعي والموروث للقب اليوناني، ويحتفظ هنا بدلالته المسيانية؛ وتوضح الحاشية أن المقصود لقب «المسيّا» لا استعمالًا اسميًا مجردًا.
- issue: قوة السؤال Πῶς
  choice: كيف يقول الكتبة
  alternative: كيف يمكن للكتبة أن يقولوا
  rationale: اختيرت الصياغة الأقرب إلى اللفظ اليوناني للمحافظة على انفتاح السؤال الجدلي، دون أن تُحسم مسبقًا طبيعته بوصفه نفيًا لإمكان القول.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على تركيب الاستجابة والتعليم والقول من غير الثقل الحرفي «أجاب وقال»، وأبقت السؤال موجزًا وجدليًا كما في الأصل.
