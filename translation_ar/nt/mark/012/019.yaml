reference: Mark 12:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: ar
  text: «يا معلّم، كتب لنا موسى أنه إن مات أخو رجل وترك زوجة ولم يترك ولدًا[a]، فليأخذ أخوه الزوجة، وليُقِم نسلًا لأخيه[b]».[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: لم يترك أيَّ ولد؛ واللفظ اليوناني مفرد يُستعمل هنا بمعنى عام، ويمكن ترجمته أيضًا: «لم يترك أولادًا».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «يُقيم زرعًا لأخيه»، وهو تعبير اصطلاحي يعني إنجاب نسل للميت وفاءً بواجب زواج أخي الميت.'
    reason: lexical_alternative
  - marker: c
    text: 'انظر تثنية 25: 5، حيث ترد الشريعة الموسوية المشار إليها.'
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: نداء مباشر ليسوع؛ و«معلّم» هو المقابل العربي الواضح المعتاد، من غير إيحاءات زائدة يحملها لفظ «سيّد».
- source_word: Μωϋσῆς
  choice: موسى
  rationale: الصيغة العربية المعيارية للاسم.
- source_word: ἔγραψεν ἡμῖν
  choice: كتب لنا
  rationale: ينقل دلالة المنفعة أو المرجع في ضمير المجرور، ويعبّر طبيعيًا عن احتجاج المتكلمين بشريعة كُتبت لإسرائيل.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: إن مات أخو رجل
  rationale: تفيد τινος شخصًا غير معيّن. واختيار «رجل» يلائم السياق القانوني الذي يذكر أخًا وزوجة، من دون إضافة اسم أو تحديد غير وارد.
- source_word: καταλίπῃ γυναῖκα
  choice: وترك زوجة
  rationale: يفيد الفعل تركها بعد موته؛ والسياق يوضح معنى «ترك وراءه» من غير حاجة إلى إثقال العبارة.
- source_word: μὴ ἀφῇ τέκνον
  choice: ولم يترك ولدًا
  rationale: يحافظ على إفراد τέκνον، و«ولد» هنا اسم جنس يشمل الابن أو البنت ولا يخص الذكر.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: فليأخذ أخوه الزوجة
  rationale: يحافظ على صورة التعبير اليوناني، مع وضوح دلالته الزواجية في سياق شريعة زواج أخي الميت؛ أما «يتزوج الأرملة» فأصرح لكنه تفسيري.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: وليُقِم نسلًا
  rationale: «يُقيم نسلًا» ينقل الاصطلاح القانوني الكتابي بصورة مفهومة، بدل الترجمة الحرفية الملتبسة «يقيم زرعًا».
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: لأخيه
  rationale: ينقل دلالة المنفعة أو النسبة بإيجاز، ولا حاجة إلى إضافة «الميت» لأن الشرط السابق يوضحه.
theological_decisions:
- issue: نقل اصطلاح زواج أخي الميت من غير إدخال تفسير زائد
  choice: «فليأخذ أخوه الزوجة، وليُقِم نسلًا لأخيه»
  alternative: «فليتزوج أخوه الأرملة وينجب ذرية تُنسب إلى أخيه»
  rationale: المختار يحافظ على صورتي «أخذ الزوجة» و«إقامة النسل» في النص، مع إبقاء كيفية النسبة القانونية ضمنية كما في اليونانية.
- issue: دقة الألفاظ المتعلقة بالجنس والقرابة
  choice: الإبقاء على «أخو»، و«زوجة» مع استعمال «ولد» اسمَ جنس
  alternative: استعمال ألفاظ محايدة مثل «قريب» و«شريك حياة»، أو ترجمة τέκνον بـ«ابن»
  rationale: النص يصرّح بالأخ والزوجة في إطار زواج ذكوري-أنثوي، لكن τέκνον لا يعني ابنًا ذكرًا تحديدًا؛ لذلك جاءت «ولد» بمعناها الجنسي العام.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة قانونية موقّرة. استُعمل «فليأخذ» و«وليُقِم» لنقل قوة الغاية ذات الدلالة الإلزامية في الاقتباس التشريعي، مع تجنّب ألفاظ مذهبية أو شروح داخل المتن.
