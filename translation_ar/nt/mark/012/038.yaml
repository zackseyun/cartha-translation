base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: ar
  text: 'وكان يقول في تعليمه: «احذروا من الكتبة[a] الذين يرغبون في التجوال بثياب طويلة[b] وتلقّي التحيات في الأسواق».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انتبهوا من الكتبة» أو «كونوا على حذر من الكتبة».'
    reason: lexical_alternative
  - marker: b
    text: تشير «الثياب الطويلة» إلى ثياب خارجية لافتة ارتبطت بالمكانة الاجتماعية والتكريم العلني.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: في تعليمه
  rationale: يحافظ على تركيب العبارة اليونانية، ويعبّر بوضوح عن سياق كلام يسوع ومجاله.
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: ينقل دلالة الماضي الناقص على الكلام المستمر أو المتكرر، بدل اختزاله في فعل ماضٍ بسيط.
- source_word: Βλέπετε ἀπὸ
  choice: احذروا من
  rationale: ينقل قوة الأمر بوصفه تحذيرًا وطلبًا للتيقظ إزاء الأشخاص المذكورين.
- source_word: γραμματέων
  choice: الكتبة
  rationale: هو المقابل العربي المألوف والمباشر للمصطلح في سياق الأناجيل، من غير إضافة تفسير مهني أضيق.
- source_word: τῶν θελόντων
  choice: الذين يرغبون في
  rationale: يحفظ معنى الإرادة أو الميل المميّز لهم، ولا يخففه إلى مجرد استحسان عابر.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: التجوال بثياب طويلة
  rationale: تعكس στολαί الثياب الخارجية الطويلة ذات المظهر البارز، وتنقل περιπατεῖν بصياغة عربية طبيعية.
- source_word: ἀσπασμοὺς
  choice: أن يتلقّوا التحيات
  rationale: إضافة «يتلقّوا» توضح في العربية العلاقة التي يفهمها السياق اليوناني بين رغبتهم والتحيات العامة، من دون تحديد ألقاب بعينها.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: في الأسواق
  rationale: ترجمة مباشرة للمواقع العامة التي كانت تجمع بين البيع والالتقاء الاجتماعي.
theological_decisions:
- issue: مدى التحذير من الكتبة
  choice: الإبقاء على «الكتبة الذين يرغبون...» بوصفها عبارة تصف الكتبة المتسمين بطلب الوجاهة العلنية.
  alternative: فهم الكلام إدانة شاملة لكل كاتب بلا استثناء.
  rationale: يحافظ النص على الفئة التي سمّاها الأصل، مع إبراز الوصف اللاحق من غير فاصلة تفصلها عنه، فلا يحسم التوتر بتحويل التحذير إلى تعميم صريح ولا يضيّق مدلوله أكثر مما يسمح به التركيب.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «كان يقول» لحفظ دلالة الاستمرار، ووُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
