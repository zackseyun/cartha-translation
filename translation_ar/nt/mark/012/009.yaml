  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: ar
  text: مَاذَا سَيَفْعَلُ صَاحِبُ الْكَرْمِ؟ سَيَأْتِي وَيُهْلِكُ الْكَرَّامِينَ[a]، وَيُعْطِي الْكَرْمَ لِآخَرِينَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: المزارعين المستأجرين للكرم. ويمكن أيضًا ترجمة العبارة السابقة: «ربّ الكرم» أو «سيد الكرم»؛ واليونانية حرفيًا: «كيريوس الكرم»، والمقصود هنا مالك الكرم في المثل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ποιήσει
  choice: ماذا سيفعل
  rationale: ينقل أداة الاستفهام مع الفعل المستقبل مباشرة، من غير إضافة رابط غير موجود في النص اليوناني.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: صاحب الكرم
  rationale: يشير κύριος هنا داخل المثل إلى مالك الكرم؛ و«صاحب الكرم» تعبير عربي طبيعي يحفظ معنى الملكية من غير إقحام دلالة لاهوتية صريحة.
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: الكرم
  rationale: «الكرم» هو المقابل العربي المألوف لبستان العنب في السياق الزراعي والأمثال الكتابية.
- source_word: ἐλεύσεται
  choice: سيأتي
  rationale: ترجمة مباشرة للمستقبل، وتحفظ حيوية تدخل صاحب الكرم.
- source_word: ἀπολέσει
  choice: يُهلك
  rationale: ينقل شدة ἀπόλλυμι ومداه الأوسع من مجرد «يقتل»، من غير تضييق المعنى.
- source_word: τοὺς γεωργούς
  choice: الكرّامين
  rationale: يدل السياق على مزارعي الكرم المستأجرين له؛ و«الكرّامين» موجز وطبيعي في العربية، مع إيضاح بُعد الاستئجار في الحاشية.
- source_word: δώσει
  choice: يعطي
  rationale: المقابل المباشر للفعل δίδωμι، بلا تخصيص زائد مثل «يؤجّر» أو «يعهد».
- source_word: ἄλλοις
  choice: لآخرين
  rationale: يحفظ الإحالة المفتوحة في اليونانية ولا يضيف تحديدًا مثل «كرّامين آخرين».
theological_decisions:
- issue: ترجمة κύριος حين يشير داخل المثل إلى شخص غير إلهي
  choice: صاحب الكرم
  alternative: ربّ الكرم أو سيد الكرم
  rationale: المرجع المباشر هو مالك الكرم في عالم المثل. وهذه الصياغة تتجنب تحميل اللفظ لقبًا إلهيًا صريحًا، مع إبقاء الدلالة اللاهوتية الأوسع للمثل مستفادة من السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع ألفاظ كتابية مألوفة من غير تقعّر. استُعملت «الكرّامين» في المتن للإيجاز والطبيعية، وأُوضح معنى الاستئجار في الحاشية. أُثبتت علامة الحاشية [a] في المتن.
