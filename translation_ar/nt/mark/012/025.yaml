reference: Mark 12:25
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: ar
  text: لأنهم حين يقومون من بين الأموات، لا يتزوجون ولا يُزوَّجون، بل يكونون مثل الملائكة في السماوات.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: لأنهم حين
  rationale: تحفظ «لأن» القوة التفسيرية لـγάρ، وتنقل «حين» الدلالة الزمنية لـὅταν بصياغة عربية طبيعية في السياق.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: تنقل العبارة بدقة معنى القيام من وسط الموتى، وهي صياغة عربية واضحة ومألوفة في سياق القيامة.
- source_word: ἀναστῶσιν
  choice: يقومون
  rationale: تحافظ على الصيغة الفعلية المبنية للمعلوم ولا تُدخل مبنيًّا للمجهول غير موجود في العبارة اليونانية.
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: لا يتزوجون ولا يُزوَّجون
  rationale: تحفظ التوازي السلبي والتمييز بين الدخول في الزواج وبين أن يُعطى الشخص للزواج.
- source_word: ἀλλ’ εἰσὶν
  choice: بل يكونون
  rationale: «بل» تؤدي المقابلة، واختيار «يكونون» ينسجم طبيعيًّا مع الإطار الزمني المتعلق بالقيامة.
- source_word: ὡς ἄγγελοι
  choice: مثل الملائكة
  rationale: تبيّن أداة التشبيه أن المقصود المماثلة لا التحول إلى ملائكة.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: في السماوات
  rationale: يحافظ الجمع العربي على صيغة الجمع الصريحة في النص اليوناني، وهو تعبير فصيح وطبيعي.
theological_decisions:
- issue: طبيعة التشبيه بالملائكة
  choice: القائمون من الموت يكونون مثل الملائكة من جهة السياق المذكور، ولا يقول النص إنهم يصيرون ملائكة.
  alternative: أن القائمين من الموت يتحولون إلى ملائكة.
  rationale: أداة التشبيه ὡς تدل على المماثلة لا على التطابق في الهوية؛ لذلك تحافظ عبارة «مثل الملائكة» على الحد الذي يرسمه النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على القوة التفسيرية، وصيغة الفعل المعلوم، والتوازي بين فعلي الزواج، وجمع «السماوات» الوارد في الأصل.
