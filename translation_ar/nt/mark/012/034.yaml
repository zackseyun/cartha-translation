base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: ar
  text: 'ولمّا رأى يسوعُ الرجلَ قد أجاب بتعقّل، قال له: «لست بعيدًا عن ملكوت الله».[a] ولم يَعُد أحد يجرؤ على أن يسأله.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أنت قريب من ملكوت الله». يفيد التعبير اليوناني القرب، ولا يصرّح بالدخول إلى الملكوت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ولمّا رأى
  rationale: ينقل اسم الفاعل الظرفي بصياغة عربية طبيعية، ويحفظ ملاحظة يسوع للجواب بوصفها تمهيدًا لقوله.
- source_word: νουνεχῶς
  choice: بتعقّل
  rationale: يدل اللفظ على الفهم السليم وحسن التمييز؛ و«بتعقّل» واضحة ومعاصرة وتحمل معنى الاستحسان من غير مبالغة.
- source_word: ἀπεκρίθη
  choice: أجاب
  rationale: هو المقابل العربي الطبيعي في سياق سؤال وجواب، ويبيّن تركيب «أنه أجاب» أن الجواب سبق قول يسوع.
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: لست بعيدًا عن
  rationale: يحفظ صورة المسافة الواردة في اليونانية ولا يحوّل القرب إلى تصريح بالدخول أو الانتماء.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي راسخ يحفظ دلالتي مُلك الله ومجال حكمه.
- source_word: οὐκέτι
  choice: بعد ذلك
  rationale: يؤدي المعنى الزمني، أي إن أحدًا لم يعد يجرؤ منذ تلك اللحظة على مواصلة سؤاله.
- source_word: ἐτόλμα
  choice: يجرؤ
  rationale: ينقل معنى الإقدام والجرأة مباشرة، وتلائم صيغة المضارع بعد «لم» الأسلوب العربي الطبيعي.
- source_word: ἐπερωτῆσαι
  choice: أن يسأله
  rationale: ينقل وضع سؤال عليه بوضوح، ويترك للسياق السابق إيحاء الاختبار أو المحاجّة من غير تحميل الفعل معنى الاستجواب القسري.
theological_decisions:
- issue: موقف الكاتب بالنسبة إلى ملكوت الله
  choice: «لست بعيدًا عن ملكوت الله» من غير التصريح بأنه دخل الملكوت
  alternative: «أنت قريب من ملكوت الله»
  rationale: النص اليوناني يثبت القرب ولا يثبت الدخول أو الامتلاك؛ فتحفظ الصياغة التوتر بين ثناء يسوع على تعقّل الرجل وعدم إعلانه أنه صار داخل الملكوت.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعمل «ملكوت الله» لاتساقه مع المصطلح الإنجيلي المألوف، وحُفظت صورة القرب المكانية من غير تفسير مذهبي زائد.
