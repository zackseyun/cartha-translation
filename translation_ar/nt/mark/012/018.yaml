  text: Καὶ ἔρχονται Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι, καὶ ⸀ἐπηρώτων αὐτὸν λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: ar
  text: 'وجاء إليه بعضُ الصدوقيين، وهم يقولون إنه لا قيامة، وأخذوا يسألونه قائلين:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: الصدوقيين
  rationale: الاسم العربي الشائع لهذه الجماعة اليهودية في الترجمات والكتابات العربية.
- source_word: ἀνάστασιν
  choice: قيامة
  rationale: ينقل المصطلح الدال على قيام الموتى بإيجاز، مع إبقاء العبارة عامة كما في اليونانية.
- source_word: ἐπηρώτων
  choice: أخذوا يسألونه
  rationale: فعل الماضي الناقص في اليونانية يصوّر السؤال بوصفه فعلًا جاريًا أو متكررًا؛ وهذه الصياغة العربية تعبّر طبيعيًا عن بدء الاستجواب واستمراره.
- source_word: οἵτινες λέγουσιν
  choice: وهم يقولون
  rationale: يحافظ على وصف موقفهم المعلن بصيغة الحاضر من غير إضافة تفسير.
theological_decisions:
- issue: طبيعة القيامة التي ينكرها الصدوقيون
  choice: لا قيامة
  alternative: لا قيامة للأموات
  rationale: أُبقي إيجاز الأصل وغموضه النسبي؛ فعبارة «للأموات» مفهومة من السياق لكنها غير مذكورة صراحة في هذه الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «بعضُ الصدوقيين» لتكون الجملة طبيعية من غير إيحاء بأن الجماعة كلها جاءت، واستُعمل «أخذوا يسألونه» لنقل الجانب الاستمراري للفعل اليوناني.
