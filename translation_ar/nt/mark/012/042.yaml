  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: ar
  text: وجاءت أرملة فقيرة فألقت قطعتين من عملة اللِّبْتون[a][b]، أي كودرانتًا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللِّبْتون قطعة نقدية يونانية صغيرة جدًا؛ وكانت قطعتان منها تعادلان كودرانتًا رومانيًا واحدًا.
    reason: cultural_note
  - marker: b
    text: 'أو: «قطعتين نقديتين صغيرتين من النحاس».'
    reason: lexical_alternative
  - marker: c
    text: الكودرانت هو اسم العملة الرومانية التي يسميها النص اليوناني «κοδράντης» (quadrans)، وتساوي ربع آس روماني.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: وجاءت
  rationale: 'اسم فاعل ماضٍ من ἔρχομαι، والأفصح في السرد العربي تحويله إلى فعل معطوف على الفعل الرئيس: «وجاءت... وألقت».'
- source_word: μία
  choice: أرملة
  rationale: μία هنا تُدخل شخصية مفردة في المشهد ولا تؤكد العدد؛ والتنكير في العربية تؤديه صيغة «أرملة» بلا حاجة إلى ترجمة مستقلة بـ«واحدة».
- source_word: χήρα
  choice: أرملة
  rationale: المعنى المعجمي المباشر للكلمة.
- source_word: πτωχὴ
  choice: فقيرة
  rationale: ترجمة واضحة وطبيعية لـπτωχός، من غير المبالغة بتحديد درجة الفقر بما يتجاوز هذه العبارة.
- source_word: ἔβαλεν
  choice: ألقت
  rationale: يحافظ على المعنى الأساسي للفعل βάλλω وعلى التعبير العربي المألوف في سياق وضع النقود في صندوق التقدمة، من غير أن يلزم منه الإلقاء بعنف.
- source_word: λεπτὰ δύο
  choice: فلسين
  rationale: المثنى العربي طبيعي، و«الفلس» اسم عربي قديم لقطعة نقدية ضئيلة القيمة، فيوصل نوع النقد وصغره بصورة أوضح للقارئ؛ وتوضح الحاشية الاسم اليوناني والعلاقة النقدية الدقيقة.
- source_word: ὅ ἐστιν
  choice: أي
  rationale: أداة تفسير عربية موجزة وطبيعية تبين أن مجموع القطعتين يعادل العملة التالية.
- source_word: κοδράντης
  choice: رُبع آس
  rationale: اللفظ اليوناني منقول عن اسم العملة اللاتينية quadrans، ومعناه ربع الآس الروماني؛ وهذه الصياغة تحفظ الهوية التاريخية والقيمة النسبية للعملة.
