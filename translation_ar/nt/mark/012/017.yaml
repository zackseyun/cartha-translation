base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: ar
  text: 'فقال لهم يسوع: «رُدّوا[a] إلى قيصر ما لقيصر، وإلى الله ما لله». فكانوا في غاية الدهشة منه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أدّوا لقيصر ما لقيصر، ولله ما لله». يمكن أن يعني الفعل «رُدّوا» أو «أدّوا ما هو مستحق» أو «أعطوا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: أعطوا
  rationale: يفيد الفعل إعطاء ما هو مستحق أو ردَّه إلى صاحبه. و«أعطوا» عربية طبيعية رصينة، فيما توضّح الحاشية معنى الرد أو الإيفاء الكامن في الأصل من غير حصره في دفع الضريبة.
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: قيصر ما لقيصر
  rationale: يحفظ التركيب معنى ما يخص قيصر والتوازي البلاغي الموجز في القول.
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: ولله ما لله
  rationale: يعكس الشطر الأول ويحافظ على التوازي المقصود، من غير توسيع يفرض تفسيرًا لطبيعة ما يخص الله.
- source_word: ἐξεθαύμαζον
  choice: كانوا في غاية الدهشة
  rationale: ينقل قوة الفعل المركب الدال على شدة التعجب، كما يعكس الماضي الناقص وصف رد الفعل المستمر في المشهد.
- source_word: ἐπ’ αὐτῷ
  choice: منه
  rationale: تعبير عربي طبيعي يجعل يسوع موضع دهشتهم، مع إبقاء سبب الدهشة التفصيلي ضمنيًا كما في اليونانية.
- source_word: δὲ
  choice: فـ
  rationale: الفاء تلائم العربية السردية وتربط جواب يسوع مباشرة بالسياق، مع نقل الانتقال الذي تؤديه δέ دون افتعال مقابلة شديدة.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: ترجمة مباشرة وطبيعية لمقدمة الكلام.
theological_decisions:
- issue: العلاقة بين الالتزام المدني والالتزام لله في قول يسوع
  choice: إبقاء الشطرين متوازيين من غير تحديد نظري لنطاق حق قيصر أو حق الله
  alternative: صياغة القول بما يجعله إما تأييدًا أقوى للسلطة المدنية وإما تقليلًا مقصودًا من مطالب قيصر
  rationale: النص يقر بأن لقيصر ما يخصه ولله ما يخصه، لكنه لا يعرض نظرية مكتملة في علاقة السلطة المدنية بسلطان الله؛ لذلك تحفظ الصياغة التوتر اللاهوتي ولا تحسمه وفق مذهب لاحق.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على التوازي البلاغي في قول يسوع. وُضعت علامة الحاشية بعد الاقتباس كله لأنها تشرح الفعل الحاكم لكلا الشطرين.
