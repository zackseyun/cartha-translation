  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: ar
  text: 'فجاءوا وقالوا له: «يا معلّم، نعلم أنك صادق ولا تبالي بأحد، لأنك لا تنظر إلى وجوه الناس[a]، بل تعلّم طريق الله بالحق. أيحلّ أن ندفع ضريبة الرأس لقيصر أم لا؟ أندفعها[b] أم لا ندفعها؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: لا تحابي الناس، أو لا تتأثر بمظاهرهم أو مكانتهم.'
    reason: lexical_alternative
  - marker: b
    text: تشير الكلمة اليونانية إلى ضريبة الإحصاء الرومانية، وهي ضريبة رأس مفروضة على الأفراد.
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: صيغة نداء عربية طبيعية تحفظ دور المخاطَب في التعليم من غير نبرة قديمة أو لقب طائفي.
- source_word: ἀληθὴς
  choice: صادق
  rationale: تصف الشخص بأنه يقول الحق ويتصف بالصدق، وهي الصياغة العربية الطبيعية في هذا السياق.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: لا تبالي بأحد
  rationale: تحافظ على قوة التعبير اليوناني، مع توضيح الجملة التالية أن المقصود عدم التأثر بمكانة الناس لا انعدام الاكتراث بهم مطلقًا.
- source_word: οὐ ... βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: لا تنظر إلى وجوه الناس
  rationale: يحفظ الصورة الحسية في الأصل، بينما تبيّن الحاشية معناها الاصطلاحي المتعلق بالمحاباة والتأثر بالمظاهر أو المكانة.
- source_word: ἐπ’ ἀληθείας
  choice: بالحق
  rationale: تعبير عربي موجز وطبيعي يفيد أن تعليمه صادق وموافق للحق.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: طريق الله
  rationale: يحفظ الاستعارة الكتابية للطريق بدل تسطيحها إلى مجرد تعاليم أو إرادة.
- source_word: ἔξεστιν
  choice: أيحلّ
  rationale: ينقل السؤال عن الجواز الشرعي أو المبدئي بصياغة عربية واضحة ومألوفة.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: أن ندفع ضريبة الرأس لقيصر
  rationale: الفعل «ندفع» هو المقابل العربي الطبيعي في سياق الضرائب، و«ضريبة الرأس» تحدد الضريبة الرومانية المفروضة على الأفراد.
- source_word: Καίσαρι
  choice: لقيصر
  rationale: يحفظ اللقب/الاسم التاريخي المألوف بدل استبداله بتفسير «الإمبراطور».
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: أندفعها أم لا ندفعها؟
  rationale: يحفظ تكرار الفعل الذي يزيد السؤال إلحاحًا، ويضيف ضمير المفعول اللازم للوضوح في العربية.
theological_decisions:
- issue: تعبير عدم النظر إلى وجوه الناس
  choice: الإبقاء على الصورة الأصلية «لا تنظر إلى وجوه الناس» في المتن مع شرح دلالتها الاصطلاحية في الحاشية.
  alternative: «لا تحابي أحدًا» أو «لا تتأثر بمظاهر الناس».
  rationale: يحافظ هذا على صورة النص اليوناني من غير حسمها في تفسير واحد، وفي الوقت نفسه تمنع الحاشية إساءة فهمها على أنها تتعلق بالنظر الحسي وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أيحلّ» للمحافظة على النبرة القانونية، و«ضريبة الرأس» للدقة التاريخية، مع تجنب «الجزية» لما قد تستدعيه من دلالات إسلامية لاحقة. وُضعت علامتا الحاشيتين [a] و[b] في موضعيهما داخل المتن.
