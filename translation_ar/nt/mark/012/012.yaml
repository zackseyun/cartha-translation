source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: ar
  text: وكانوا يسعون إلى الإمساك به، لكنهم خافوا من الجمع، لأنهم عرفوا أنه قال المثل عليهم.[a] فتركوه ومضوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قال المثل في شأنهم» أو «وجّهه إليهم».'
    reason: بديل معجمي لعبارة πρὸς αὐτούς، التي قد تفيد الاتجاه إليهم أو التعلّق بهم، مع أن السياق يسند معنى «عليهم».
lexical_decisions:
- source_word: ἐζήτουν
  choice: كانوا يسعون
  rationale: ينقل صيغة الماضي الناقص الدالة على محاولة مستمرة أو جارية، من غير الجزم بأنهم شرعوا فعليًا في القبض عليه.
- source_word: κρατῆσαι
  choice: الإمساك به
  rationale: 'يحافظ على المعنى الأساسي للفعل: القبض عليه أو إحكام الإمساك به، من غير افتراض إجراء قانوني رسمي كما قد يوحي لفظ «اعتقاله».'
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: خافوا الجموع
  rationale: تعبير عربي مباشر وطبيعي؛ وجاءت «الجموع» للدلالة على جمهور الناس الحاضر في المشهد.
- source_word: ἔγνωσαν
  choice: عرفوا
  rationale: ترجمة مباشرة تفيد إدراكهم المستقر لمغزى المثل، من غير زيادة تفسيرية.
- source_word: πρὸς αὐτοὺς
  choice: عليهم
  rationale: ينقل في هذا السياق العدائي كون المثل موجّهًا ضدهم، مع إبقاء الاحتمال الأعم «في شأنهم» في الحاشية.
- source_word: τὴν παραβολὴν
  choice: هذا المثل
  rationale: اسم الإشارة طبيعي في العربية ويحدد المثل الوارد مباشرة قبل هذه الآية، مع أن اليونانية تستعمل أداة التعريف.
- source_word: εἶπεν
  choice: قال
  rationale: الماضي البسيط طبيعي بعد «عرفوا أنه» ويعبّر بوضوح عن قول المثل السابق لإدراكهم.
- source_word: ἀφέντες αὐτὸν
  choice: تركوه
  rationale: ينقل معنى الكف عنه وتركه وشأنه في السياق، بصياغة عربية موجزة.
- source_word: ἀπῆλθον
  choice: مضوا
  rationale: تعبير سردي عربي طبيعي يدل على انصرافهم من المكان.
theological_decisions:
- issue: دلالة πρὸς αὐτοὺς
  choice: عليهم
  alternative: في شأنهم أو موجّهًا إليهم
  rationale: السياق يدل على أنهم فهموا المثل إدانة لهم، لكن حرف الجر نفسه يسمح بدلالة أوسع؛ لذلك حُفظ البديل في الحاشية بدل إلغاء الغموض.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، بصياغة سردية طبيعية. استُعمل «الجموع» اتساقًا مع مشهد جمهور الناس، و«الإمساك به» لتجنب تحميل النص معنى الاعتقال الرسمي غير المصرح به.
