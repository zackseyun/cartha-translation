base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: ar
  text: 'أما أولئك المزارعون المستأجرون فقالوا بعضهم لبعض[a]: «هذا هو الوارث. تعالوا نقتله، ويكون الميراث لنا[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قالوا فيما بينهم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فيصير الميراث لنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: أما أولئك الكرّامون
  rationale: تحمل «أما» انتقالًا ذا مسحة مقابلة، وتحفظ «أولئك» الإشارة الصريحة. وفي سياق مثل الكرم، تدل «الكرّامون» طبيعيًا على القائمين على زراعة الكرم، مع أن اليونانية قد تشمل المزارعين المستأجرين.
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: فقالوا بعضهم لبعض
  rationale: ينقل التعبير تداول الكلام داخل الجماعة، ويحفظ معنى التشاور المتبادل بدل أن يوحي بحديث داخلي فردي.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: هذا هو الوارث
  rationale: «الوارث» هو المقابل العربي الطبيعي والدقيق لـ κληρονόμος، مع إبقاء اسم الإشارة للتوكيد والمباشرة.
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: تعالوا نقتله
  rationale: «تعالوا» أداة حث جماعي طبيعية، ويتبعها «نقتله» بما يحفظ الاقتراح بصيغة المتكلمين من غير إضافة دلالة قانونية غير مصرّح بها.
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: فيصير الميراث لنا
  rationale: ينقل توقّع انتقال الميراث إلى حوزتهم، ويحافظ على إبراز «لنا» من غير إضافة «ميراثه» التي لا ترد صراحة في اليونانية.
theological_decisions:
- issue: الدلالة الخاصة بسياق المثل لكلمة γεωργοί
  choice: الكرّامون
  alternative: المزارعون المستأجرون
  rationale: يشير السياق إلى أشخاص عُهد إليهم بالكرم وكانوا مسؤولين أمام مالكه. «الكرّامون» واضحة وموجزة في العربية الكتابية المعاصرة وتحفظ سياق الكرم، بينما يصرّح البديل بالعلاقة الإيجارية التي يفهمها السياق أكثر مما يصرّح بها اللفظ منفردًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بصياغة قصصية طبيعية. استُعملت «الكرّامون» لسلاستها في سياق مثل الكرم، وأُبقيت علامتا الحاشيتين في المتن.
