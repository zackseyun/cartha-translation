lexical_decisions:
- source_word: παρὰ κυρίου
  choice: مِن عند الربِّ
  rationale: تفيد παρά مع المضاف إليه المصدر أو المنشأ غالبًا. وتعبير «مِن عند الرب» عربي طبيعي يحفظ معنى المصدر، مع بقاء احتمال دلالة الفاعلية مذكورًا في الحاشية.
- source_word: κυρίου
  choice: الربِّ
  rationale: النص اليوناني للعهد الجديد يستعمل κύριος، وفي هذا الاقتباس يشير إلى الله. تُحفظ الصياغة اليونانية بترجمة «الرب» من غير إدخال تمثيل خاص للاسم الإلهي من النص العبري خلف الاقتباس.
- source_word: ἐγένετο
  choice: كان
  rationale: في التركيب «مِن عند الرب كان هذا» يدل الفعل على أن الأمر حدث أو جاء من مصدره. هذه الصياغة تحفظ إيجاز الاقتباس ونبرته المزمورية من دون الإيحاء بأن الحدث عَرَضي.
- source_word: αὕτη
  choice: هذا
  rationale: يشير اسم الإشارة إلى الأمر السابق، ولا سيما صيرورة الحجر المرفوض حجر الزاوية. لا تُضاف كلمة «الحجر» هنا لأن هذا الشطر لا يذكرها صراحة.
- source_word: θαυμαστὴ
  choice: عجيبٌ
  rationale: تنقل «عجيب» معنى ما يبعث على العجب وما هو فائق أو مدهش، وتلائم الأسلوب الكتابي الموقر من غير تكلف.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: في أعيننا
  rationale: ترجمة مباشرة للصورة السامية-اليونانية، وهي مفهومة في العربية وتفيد «في نظرنا» مع الحفاظ على الصورة الأصلية.
theological_decisions:
- issue: ترجمة κύριος في اقتباس من المزمور يشير إلى الله
  choice: الرب
  alternative: الرَّبّ بحروف أو تنسيق يرمز إلى الاسم الإلهي في العبرية
  rationale: المصدر المباشر هنا يوناني ويقرأ κυρίου؛ لذلك تُترجم اللفظة «الرب»، مع بيان خلفية الاقتباس من المزمور في الحاشية بدل إدخال تمييز طباعي غير موجود في النص اليوناني.
- issue: 'دلالة παρὰ κυρίου: المصدر أم الفاعلية'
  choice: مِن عند الرب
  alternative: بفعل الرب
  rationale: يحفظ المتن دلالة المصدر الأوضح للجار مع المضاف إليه، بينما توضح الحاشية أن التركيب قد يُفهم أيضًا من جهة الفاعلية، فلا يُحسم التوتر الدلالي بلا تنبيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة موقرة. حُفظت صورة «في أعيننا» وإيجاز الاقتباس، واستُعمل «مِن عند الرب» بدل تركيب أكثر تفسيرًا. وُضعت علامتا الحاشيتين بعد العبارة التي تتعلقان بها، مع ترتيب [a] للبديل المعجمي و[b] للإحالة.
