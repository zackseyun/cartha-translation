  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: ar
  text: مِن عند الرب جاء هذا[a][b]، وهو عجيبٌ في أعيننا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بفعل الرب». يمكن للعبارة اليونانية أن تدل على المصدر أو على الفاعل؛ وقد اختيرت «مِن عند الرب» لإبراز المنشأ بصورة أوضح.'
