  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ πάλιν ἀπέστειλεν πρὸς αὐτοὺς ἄλλον δοῦλον· ⸀κἀκεῖνον ⸀ἐκεφαλίωσαν καὶ ⸀ἠτίμασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: ar
  text: ثم أرسل إليهم أيضًا عبدًا آخر[a]، فضربوه على رأسه[b] وأهانوه[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خادمًا آخر». يمكن أن تعني الكلمة اليونانية عبدًا أو خادمًا بحسب السياق.
    reason: alternative_reading
  - marker: b
    text: الفعل اليوناني هنا نادر ويشير إلى عنف موجَّه إلى الرأس؛ وقد يعني «جرحوه في رأسه»، ولا يعني هنا «قطعوا رأسه».
    reason: lexical_alternative
  - marker: c
    text: أو «عاملوه معاملة مُخزية».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: أيضًا
  rationale: تُظهر تكرار الإرسال في تسلسل المثل، وتأتي طبيعية مع «ثم أرسل».
- source_word: ἀπέστειλεν
  choice: أرسل
  rationale: فعل ماضٍ يروي الحدث ببساطة ووضوح.
- source_word: πρὸς αὐτοὺς
  choice: إليهم
  rationale: مع فعل الإرسال، المقابل العربي الاصطلاحي الطبيعي هو «إليهم».
- source_word: ἄλλον δοῦλον
  choice: عبدًا آخر
  rationale: لفظة δοῦλος تدل هنا على شخص خاضع لسلطة السيد؛ و«عبد» تحفظ الوضع الاجتماعي وعلاقة التبعية بوضوح، مع بيان البديل السياقي في الحاشية.
- source_word: κἀκεῖνον
  choice: فضربوه
  rationale: أُدمج معنى العطف والإشارة إلى ذلك العبد في الفاء وضمير المفعول، بما يلائم السرد العربي من غير فقدان استمرارية الحدث.
- source_word: ἐκεφαλίωσαν
  choice: ضربوه على رأسه
  rationale: الفعل النادر يدل على عنف موجَّه إلى الرأس، ولا يلزم منه قطع الرأس؛ وهذه الصياغة واضحة وتحفظ المرجع الجسدي.
- source_word: ἠτίμασαν
  choice: أهانوه
  rationale: تنقل معنى معاملته بلا كرامة وإلحاق العار به بعبارة عربية طبيعية وموجزة.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُخدمت «ثم» لبيان تعاقب الأحداث، و«عبد» لحفظ دلالة التبعية الاجتماعية في المثل، مع إيراد «خادم» بديلًا في الحاشية. جميع علامات الحواشي مثبتة في المتن.
