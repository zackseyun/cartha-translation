  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: تكرار الإرسال («أيضًا»)، والإرسال إليهم، و«عبدًا آخر» لـ δοῦλον، والعنف الموجَّه إلى الرأس، ثم الإهانة. ولا يفرض معنى قطع الرأس على الفعل النادر ἐκεφαλίωσαν.'
