lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: السبعة
  rationale: العدد المعرّف مستعمل استعمال الاسم، ويعود إلى الإخوة السبعة المذكورين في السياق السابق. ولفظ «السبعة» موجز وواضح.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: لم يتركوا نسلًا
  rationale: المعنى الحرفي هو «لم يتركوا زرعًا/بذرًا»، لكن σπέρμα هنا يدل على الذرية. و«نسلًا» تعبير عربي طبيعي يحفظ الدلالة المقصودة.
- source_word: ἔσχατον πάντων
  choice: في آخر الأمر
  rationale: العبارة الظرفية تدل على الترتيب، أي إن موت المرأة وقع أخيرًا بعد الجميع. وهذه الصياغة طبيعية وواضحة في العربية.
- source_word: καὶ ἡ γυνὴ
  choice: المرأة أيضًا
  rationale: تفيد καί إضافة المرأة إلى سلسلة الذين ماتوا، ولذلك تنقل «أيضًا» قوتها الإضافية بوضوح.
- source_word: ἀπέθανεν
  choice: ماتت
  rationale: نقل مباشر للفعل اليوناني دون تلطيف معناه.
