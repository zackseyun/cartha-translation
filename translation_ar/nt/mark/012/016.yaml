  text: οἱ δὲ ἤνεγκαν. καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή; οἱ δὲ εἶπαν αὐτῷ· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: ar
  text: 'فأحضروه. فقال لهم: «لِمَن هذه الصورة، ولِمَن هذا النقش؟» فقالوا له: «لقيصر».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνεγκαν
  choice: فأحضروه
  rationale: الفعل يعني «أحضروا»، والضمير يعود طبيعيًا إلى الدينار المذكور في السياق السابق، من غير تكرار غير لازم.
- source_word: λέγει
  choice: فقال
  rationale: المضارع التاريخي شائع في سرد مرقس، لكن الماضي هو الأسلوب الطبيعي الواضح في السرد العربي، ولا يغيّر زمن الحدث.
- source_word: Τίνος
  choice: لِمَن
  rationale: ينقل استفهام الإضافة أو الانتساب بأسلوب عربي طبيعي، وقد تكرر قبل «الكتابة» لإظهار تعلق السؤال بكليهما.
- source_word: εἰκών
  choice: الصورة
  rationale: لفظ واضح ودقيق للصورة المضروبة على العملة، ويحافظ كذلك على المقابل الكتابي المعتاد للكلمة.
- source_word: ἐπιγραφή
  choice: الكتابة
  rationale: تعني النص المكتوب أو المنقوش على العملة؛ و«الكتابة» أوضح لعامة القراء من المصطلحات الفنية، من غير فقد المعنى.
- source_word: Καίσαρος
  choice: لقيصر
  rationale: جواب موجز يطابق صيغة السؤال «لِمَن»، وينقل دلالة المضاف إليه على الانتساب.
