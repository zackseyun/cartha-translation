  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: ar
  text: ليس هو إلهَ الأموات[a]، بل إلهَ الأحياء. أنتم مخطئون جدًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصياغة أكثر حرفية: «الله ليس إلهَ الأموات، بل إلهَ الأحياء».'
