    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸς
  choice: إلهَ
  rationale: جاء الاسم بلا أداة تعريف في تركيب خبري، لكنه يدل في السياق على الله، إله إبراهيم وإسحاق ويعقوب، لا على «إلهٍ» غير معيّن. وإضمار «هو» في العربية يصوغ العبارة بوضوح وطبيعية.
- source_word: νεκρῶν
  choice: الأموات
  rationale: صيغة الجمع المضاف إليه مستعملة اسميًا، ويقابلها «الأحياء» مقابلة مباشرة.
- source_word: ἀλλὰ ζώντων
  choice: بل إلهَ الأحياء
  rationale: اسم الفاعل الجمع مستعمل اسميًا للدلالة على الأحياء. أُعيدت كلمة «إله» في العربية لسلامة العبارة ووضوح المقابلة.
- source_word: πολὺ
  choice: جدًا
  rationale: تؤدي وظيفة الظرف المقوّي للفعل، وتنقل شدة التوبيخ بلغة عربية معاصرة واضحة.
- source_word: πλανᾶσθε
  choice: أنتم ضالّون
  rationale: تحتمل الصيغة معنى الوقوع في الضلال أو الخطأ. واختيار «ضالّون» يحافظ على قوة الفعل وعلى شيء من سعته، من غير أن يحسم هل سبب الضلال ذاتي أم خارجي.
- source_word: οὐκ ἔστιν
  choice: ليس هو
  rationale: الضمير مستفاد من السياق السابق، وإظهاره يجعل الجملة العربية طبيعية مع الحفاظ على بنية النفي.
theological_decisions:
- issue: دلالة الحجة على حياة الموتى أمام الله والقيامة
  choice: الإبقاء على المقابلة الموجزة بين «الأموات» و«الأحياء» دون شرح عقائدي زائد.
  alternative: الله ليس إله أناس أموات، بل أناس أحياء.
  rationale: السياق يوظف القول في حجة القيامة، لكن الترجمة لا ينبغي أن تفصّل حالة الموتى أو كيفية حياتهم بما يتجاوز ألفاظ النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدمت «بل» لإبراز الاستدراك والمقابلة، وحُفظت قوة التوبيخ من غير إدخال تفسير طائفي.
