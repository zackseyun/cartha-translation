  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: ar
  text: وأن يحبَّه من كل القلب، ومن كل الفهم، ومن كل القوة، وأن يحبَّ القريبَ كنفسه، أعظمُ من جميع المحرقات والذبائح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: أن يحبَّ
  rationale: ينقل المصدر اليوناني المعرَّف بصياغة عربية طبيعية، ويحافظ على بنيته الفعلية وعلى التوازي بين الوصيتين.
- source_word: αὐτόν
  choice: ـه
  rationale: يحافظ على الضمير في اليونانية، ومرجعه إلى الله واضح من السياق السابق، من غير إحلال الاسم محل الضمير.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: من كل القلب
  rationale: يحافظ على صورة حرف الجر الدالة على صدور المحبة من كيان القلب كله، وعلى الصيغة العامة من غير إدخال ضمير مخاطب غير مذكور هنا.
- source_word: συνέσεως
  choice: الفهم
  rationale: يميّز معنى الإدراك والفهم في σύνεσις، ولا يختزله في «العقل» وحده.
- source_word: ἰσχύος
  choice: القوة
  rationale: لفظ عربي واضح يؤدي معنى القدرة والطاقة الكاملة في هذا السياق.
- source_word: πλησίον
  choice: القريب
  rationale: يحافظ على الاسم المفرد المعرّف ذي الدلالة العامة؛ وهو التعبير الكتابي العربي الواضح لمن يكون قريبًا من الإنسان في دائرة التعامل والمسؤولية.
- source_word: ὡς ἑαυτόν
  choice: كنفسه
  rationale: يحافظ على الضمير الانعكاسي الغائب وعلى عموم العبارة، من غير تحويل الكلام إلى خطاب مباشر.
- source_word: περισσότερόν ἐστιν
  choice: أعظمُ من
  rationale: يعبّر بوضوح عن المفاضلة والقيمة المتفوقة، من غير إضافة تفسير مثل «أهم» أو «أجدى».
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: من جميع المحرقات والذبائح
  rationale: «المحرقات» مصطلح عربي معروف للذبائح التي تُحرق بكاملها، فيحفظ خصوصية ὁλοκαυτώματα، وتأتي «من» طبيعية بعد اسم التفضيل.
theological_decisions:
- issue: علاقة وصيتي المحبة بالعبادة القائمة على الذبائح
  choice: يقرر النص أن محبة الله بكل الكيان ومحبة القريب أعظم من جميع المحرقات والذبائح.
  alternative: اعتبار العبارة إلغاءً صريحًا لنظام الذبائح، أو اعتبارها مجرد مساواة بين المحبة والذبائح.
  rationale: صيغة المقارنة περισσότερόν ἐστιν تثبت التفوق بوضوح، لكنها لا تصرّح في ذاتها بإبطال الذبائح؛ لذلك تُترك حدة المفاضلة والتوتر اللاهوتي كما هما.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ التوازي بين «أن يحبَّه» و«أن يحبَّ القريب»، واستُعملت ألفاظ مألوفة بلا توسع تفسيري أو تخصيص مذهبي.
