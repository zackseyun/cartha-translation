id: HEB.4.12
reference: Hebrews 4:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: ar
  text: لِأَنَّ كَلِمَةَ اللهِ حَيَّةٌ وَفَعَّالَةٌ، وَأَمْضَى مِنْ كُلِّ سَيْفٍ ذِي حَدَّيْنِ، تَنْفُذُ حَتَّى إِلَى فَصْلِ النَّفْسِ وَالرُّوحِ، وَالْمَفَاصِلِ وَالنُّخَاعِ[a]، وَهِيَ قَادِرَةٌ عَلَى تَمْيِيزِ أَفْكَارِ الْقَلْبِ وَنِيَّاتِهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لا تقتضي عبارة «فصل النفس والروح، والمفاصل والنخاع» مذهبًا محددًا في تركيب الإنسان؛ فالصورة تؤكد مدى نفاذ كلمة الله إلى أعماق الباطن.
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῶν
  choice: حَيَّةٌ
  rationale: صفة خبرية تصف «كلمة الله» بالحياة المستمرة، وهي الصياغة العربية الطبيعية المباشرة.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تحفظ الوظيفة التعليلية التي تربط الآية بما سبقها.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: كَلِمَةَ اللهِ
  rationale: ترجمة شفافة لا تحصر المرجع في الكتاب المقدس وحده، ولا في الكرازة، ولا في الأقنوم الإلهي.
- source_word: ἐνεργὴς
  choice: فَعَّالَةٌ
  rationale: تدل على كون الكلمة عاملة ومؤثرة، مع الحفاظ على اقترانها الطبيعي بصفة «حية».
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: أَمْضَى مِنْ كُلِّ سَيْفٍ ذِي حَدَّيْنِ
  rationale: «أمضى» تعبير عربي فصيح عن شدة الحد والقطع، و«ذي حدين» يحفظ صورة السيف اليونانية.
- source_word: διϊκνούμενος
  choice: تَنْفُذُ
  rationale: تحفظ معنى المرور إلى الداخل والوصول العميق، وتلائم صورة السيف من غير إضافة تفسير غير منصوص عليه.
- source_word: ἄχρι μερισμοῦ
  choice: حَتَّى إِلَى فَصْلِ
  rationale: تعكس دلالة الغاية أو مدى النفاذ، وتبقي «الفصل» اسماً كما في المصدر اليوناني.
- source_word: ψυχῆς καὶ πνεύματος
  choice: النَّفْسِ وَالرُّوحِ
  rationale: تحفظ اللفظين بلا فرض نظرية محددة في مكونات الإنسان.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: الْمَفَاصِلِ وَالنُّخَاعِ
  rationale: ترجمة عربية مفهومة للصورة الجسدية الموازية؛ استُعمل «النخاع» اسماً جمعياً طبيعياً في العربية.
- source_word: κριτικὸς
  choice: قَادِرَةٌ عَلَى تَمْيِيزِ
  rationale: يبين أن الصفة تدل على القدرة على الفحص والحكم، بينما «تمييز» يلائم الأفكار والنيات في العربية.
- source_word: ἐνθυμήσεων
  choice: أَفْكَارِ
  rationale: ينقل المعنى الواسع للأفكار والتأملات الباطنة بصياغة واضحة.
- source_word: ἐννοιῶν
  choice: نِيَّاتِهِ
  rationale: يميّزها عن «الأفكار» ويبرز المقاصد الداخلية؛ والضمير يعود بوضوح إلى القلب.
theological_decisions:
- issue: مرجع «كلمة الله»
  choice: الإبقاء على العبارة العامة «كلمة الله»
  alternative: تحديدها بأنها الكتاب المقدس، أو القول الإلهي المسموع، أو الابن/الكلمة
  rationale: السياق يؤكد فاعلية كلام الله، لكن العبارة اليونانية لا تقتضي هنا حصر المرجع في أحد هذه الاحتمالات.
- issue: الدلالة الأنثروبولوجية لعبارة «النفس والروح»
  choice: الإبقاء على «النفس والروح» دون شرح عقائدي داخل النص
  alternative: اعتبارهما عنصرين منفصلين تقنياً في تركيب الإنسان، أو اعتبار العبارة مجرد مرادفين للحياة الباطنة
  rationale: الصورة تؤكد بلوغ كلمة الله إلى أعمق الباطن، ولا تحسم وحدها مذهباً ثنائياً أو ثلاثياً في تكوين الإنسان.
- issue: وظيفة صورة الفصل
  choice: الحفاظ على غموض علاقة «الفصل» بالنفس والروح والمفاصل والنخاع
  alternative: تفسيرها صراحةً بأنها تفصل النفس عن الروح والمفاصل عن النخاع، أو بأنها تنفذ إلى موضع الانقسام داخل كل زوج
  rationale: التركيب اليوناني المكثف يحتمل أكثر من تصور دقيق للصورة؛ لذلك لا ينبغي توسيعه تفسيرياً في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل الضبط الجزئي الكامل في نص الآية لضمان سلامة القراءة، مع تراكيب مألوفة مثل «أمضى» و«ذي حدين». وُضع مؤشر الحاشية [a] في المتن مباشرة بعد العبارة التي تشرحها.
