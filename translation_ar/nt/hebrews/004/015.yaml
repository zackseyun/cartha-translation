  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: ar
  text: لأن ليس لنا رئيس كهنة عاجز عن أن يتعاطف مع ضعفاتنا، بل واحد قد امتُحن في كل شيء على مثالنا[a]، ولكن بلا خطية.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بحسب المشابهة».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة «امتُحن» إلى «جُرِّب». ويجوز وصل «بلا خطية» بما قبلها مباشرة: «قد امتُحن في كل شيء على مثالنا، بلا خطية».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρχιερέα
  choice: رئيس كهنة
  rationale: المقابل العربي المعياري والدقيق للمنصب الكهنوتي، وهو لقب محوري في حجة الرسالة إلى العبرانيين عن وساطة يسوع الكهنوتية.
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: عاجز عن أن يتعاطف
  rationale: يحفظ الأسلوب القائم على نفي العجز ضمن العبارة «ليس لنا... عاجز»، بدل تسويته إلى صياغة إيجابية، وينقل معنى المشاركة الوجدانية في الضعف لا مجرد الشفقة من بعيد.
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: مع ضعفاتنا
  rationale: تشير العبارة إلى الضعف البشري والهشاشة على نطاق أوسع من المرض الجسدي، و«ضعفاتنا» واضحة ومألوفة في العربية الكتابية المعاصرة.
- source_word: πεπειρασμένον
  choice: قد امتُحن
  rationale: يمكن للفعل أن يدل على الامتحان أو التجربة. اختير «امتُحن» لإبراز واقع الاختبار دون أن توحي الصياغة بميل خاطئ باطني، مع إثبات البديل المعجمي المهم في الحاشية.
- source_word: κατὰ πάντα
  choice: في كل شيء
  rationale: تنقل شمول الامتحان بعبارة عربية طبيعية وقريبة من تركيب الأصل.
- source_word: καθ’ ὁμοιότητα
  choice: على مثالنا
  rationale: تنقل معنى المشابهة بصياغة عربية مفهومة، وتجعل طرف المقارنة المفهوم من السياق ظاهرًا دون أن تدّعي التطابق؛ أما اللفظ الحرفي فمبيّن في الحاشية.
- source_word: χωρὶς ἁμαρτίας
  choice: ولكن بلا خطية
  rationale: تجعل العبارة استدراكًا حاسمًا على المشابهة في الامتحان، وتحفظ بوضوح نفي الخطية.
theological_decisions:
- issue: دلالة πεπειρασμένον وصلتها بخلو المسيح من الخطية
  choice: قد امتُحن
  alternative: قد جُرِّب
  rationale: «امتُحن» يثبت حقيقة تعرضه الكامل للاختبار ولا يوحي بذاته بوجود شهوة خاطئة أو سقوط أخلاقي. ولأن «جُرِّب» معنى معجمي أصيل وشائع، حُفظ في الحاشية بدل استبعاده.
- issue: مقدار التصريح بالمقارنة في καθ’ ὁμοιότητα
  choice: على مثالنا
  alternative: بحسب المشابهة
  rationale: العبارة اليونانية تثبت المشابهة من غير ذكر ضمير «نحن» صراحة، لكن سياق «ضعفاتنا» يوضح طرف المقارنة. الصياغة المختارة طبيعية وتحفظ المشابهة دون تحويلها إلى تطابق، والحرفية مذكورة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ نفي العجز في بنية الآية، واستُعمل «على مثالنا» لتجنب العبارة الحرفية الثقيلة «بحسب المشابهة». وُضعت علامتا الحاشيتين في المتن، مع الحفاظ على التوتر الدلالي بين الامتحان والتجربة وعلى الاستدراك المتعلق بالخطية.
