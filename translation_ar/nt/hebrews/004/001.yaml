  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: ar
  text: فلنخف إذن[a]، ما دام الوعد بالدخول إلى راحته قائمًا[b]، لئلا يبدو أن أحدًا منكم قد فاته بلوغها[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلنخشَ». الفعل اليوناني أقوى من مجرد «فلنحذر»، ويحفظ جدية الإنذار.'
    reason: lexical_alternative
  - marker: b
    text: 'وبصياغة أقرب إلى تركيب اليونانية الموجز: «مع بقاء وعدٍ بالدخول إلى راحته».'
    reason: alternative_reading
  - marker: c
    text: 'أو: «يُظن أن أحدًا منكم قد أخفق في الوصول إليها». يحتمل الفعل اليوناني معنى الظهور أو الاعتقاد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: فلنخف
  rationale: يحافظ على قوة فعل الخوف في صيغة الحث، ولا يخفف التحذير إلى مجرد الاحتياط أو الانتباه.
- source_word: οὖν
  choice: إذًا
  rationale: تربط الاستنتاج بما سبق من التحذير المستند إلى عدم دخول بعض بني إسرائيل الراحة.
- source_word: μήποτε
  choice: لئلا
  rationale: تنقل قوة التحذير والغاية السلبية بإيجاز عربي طبيعي.
- source_word: καταλειπομένης ἐπαγγελίας
  choice: ما دام وعدُ ... لا يزال قائمًا
  rationale: تنقل الظرف المتزامن الذي تعبّر عنه صيغة المضاف إليه المطلقة، وتوضح استمرار الوعد من غير تقرير تفسير زائد.
- source_word: εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: الدخول إلى راحته
  rationale: يحافظ على صورة الدخول وعلى الضمير الوارد في الأصل، من غير استبداله بتفسير صريح لهوية صاحب الراحة.
- source_word: δοκῇ
  choice: يبدو
  rationale: يصون دلالة الظهور أو الانطباع، ولا يحسم هل الكلام عن مجرد مظهر أم عن حكم ثابت.
- source_word: τις ἐξ ὑμῶν
  choice: أحدًا منكم
  rationale: ينقل النكرة المفردة مع العبارة التبعيضية ويحافظ على توجيه التحذير إلى كل فرد.
- source_word: ὑστερηκέναι
  choice: قد فاته بلوغها
  rationale: يعبّر طبيعيًا عن الإخفاق في إدراك الغاية الموعودة، مع مراعاة دلالة صيغة المصدر التام على حالة ناتجة من عدم البلوغ.
theological_decisions:
- issue: هل يُخفَّف فعل الخوف إلى مجرد الحذر؟
  choice: 'الإبقاء على الحث القوي: «فلنخف»'
  alternative: «فلنحذر» أو «فلننتبه»
  rationale: الأصل اليوناني يصرح بالخوف؛ لذلك ينبغي حفظ جدية الإنذار من غير فرض حل عقائدي لمسألة الثبات أو الارتداد.
- issue: هل تُفسَّر «راحته» في المتن بأنها راحة الله الأخروية؟
  choice: 'الإبقاء على الضمير: «راحته»'
  alternative: «راحة الله» أو «راحته الأبدية»
  rationale: السياق يبين المرجع، لكن النص نفسه يستعمل ضميرًا؛ والإبقاء عليه يتجنب إضافة تحديد تفسيري لا تصرح به الآية.
- issue: هل يدل δοκῇ على مجرد مظهر أم على حكم معتبر؟
  choice: «يبدو» مع إبقاء الاحتمال مفتوحًا
  alternative: «يُظن» أو حذف معنى الظهور وصياغة الإخفاق كحقيقة مباشرة
  rationale: اللفظ يحتمل الظهور أو الاعتقاد، فلا ينبغي حذف هذا القيد أو جعله حكمًا نهائيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «فلنخف» لصون شدة التحذير، و«ما دام ... لا يزال قائمًا» لتوضيح استمرار الوعد في تركيب عربي مألوف، مع إبقاء «راحته» و«يبدو» دون توسيع تفسيري.
