  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: ar
  text: فبما أن لنا رئيس كهنة عظيمًا قد اجتاز السماوات[a]، يسوع ابن الله، فلنتمسّك باعترافنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تستعمل اليونانية «السماوات» بصيغة الجمع. ويمكن أيضًا ترجمة الفعل: «مرَّ عبر السماوات».'
    reason: بيان صيغة الجمع في الأصل وتقديم البديل المعجمي لـ«اجتاز» من غير طمس صورة العبور.
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: فإذ لنا
  rationale: تنقل «فـ» الاستنتاج الذي تفيده οὖν، وتعرض «إذ» امتلاك رئيس الكهنة أساسًا للحث، بصياغة عربية موجزة وطبيعية نسبيًا.
- source_word: ἀρχιερέα μέγαν
  choice: رئيس كهنة عظيم
  rationale: تحافظ على اللقب الكهنوتي وعلى وصف العظمة من غير إضافة أداة تعريف لا يقتضيها التركيب اليوناني.
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: قد اجتاز السماوات
  rationale: «قد اجتاز» تعبّر عن فعل تمّ وبقيت دلالته، و«السماوات» تحفظ صيغة الجمع وصورة العبور التي في الأصل.
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: وهو يسوع ابن الله
  rationale: «وهو» توضح البدل في العربية، مع إبقاء الاسم واللقب المسيحاني صريحين من غير إعادة تفسير.
- source_word: κρατῶμεν
  choice: فلنتمسّك
  rationale: صيغة حث جماعية تفيد الاستمرار والثبات، وتناسب قوة الفعل في السياق.
- source_word: τῆς ὁμολογίας
  choice: بإقرارنا
  rationale: «الإقرار» يدل على الاعتراف المعلن، والضمير يبيّن طبيعيًا أن المقصود إقرار الجماعة المخاطَبة، وإن كان اليوناني يستعمل أداة التعريف لا ضمير الملكية.
theological_decisions:
- issue: صياغة اللقب υἱὸς τοῦ θεοῦ
  choice: ابن الله
  alternative: ابنٌ لله
  rationale: أُبقي اللقب المسيحاني بصيغته المباشرة المألوفة، من غير تخفيف لمعناه أو تحميله شرحًا عقائديًا زائدًا.
- issue: صورة عبور السماوات في τοὺς οὐρανούς
  choice: اجتاز السماوات
  alternative: دخل السماء
  rationale: تحفظ الصياغة المختارة فعل العبور وصيغة الجمع، ولا تختزل الصورة الكونية إلى دخول موضع مفرد.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة وقورة. استُعملت «فإذ» لربط الآية بما قبلها ولجعل امتلاك رئيس الكهنة أساس الحث، مع تجنب الحشو التفسيري.
