    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: في هذا الموضع
  rationale: يشير التركيب إلى موضع كتابي آخر يُستشهد به؛ وهذه الصياغة عربية طبيعية في سياق الاقتباس من الكتاب.
- source_word: πάλιν
  choice: أيضًا
  rationale: تفيد الانتقال إلى شاهد كتابي آخر يؤكد المعنى من جديد، و«أيضًا» أنسب مع عبارة «في هذا الموضع».
- source_word: Εἰ εἰσελεύσονται
  choice: لن يدخلوا ... قطعًا
  rationale: التركيب الشرطي اليوناني يعكس صيغة قسم سامية تؤدي معنى النفي المؤكد، لا شرطًا غير مكتمل.
- source_word: κατάπαυσίν
  choice: راحتي
  rationale: «الراحة» هي اللفظة المحورية في سياق عبرانيين 3–4، وتحافظ على الترابط الاصطلاحي.
- source_word: μου
  choice: ـي في «راحتي»
  rationale: أُبقي ضمير المتكلم متصلًا بالاسم، محافظةً على كون الكلام منسوبًا إلى الله في الاقتباس.
theological_decisions:
- issue: دلالة صيغة القسم Εἰ εἰσελεύσονται
  choice: لن يدخلوا راحتي قطعًا
  alternative: إن كانوا سيدخلون راحتي
  rationale: مع أن البنية حرفيًا شرطية، فهي في الاقتباس الموروث من أسلوب القسم العبري نفي مؤكد. تنقل الصياغة المختارة قوة العبارة من غير إضافة تفسير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. أُضيف «يقول» لإتمام العبارة العربية بعد الإحالة إلى موضع كتابي، وهو مفهوم ضمنًا من أسلوب الاستشهاد اليوناني. وُضعت علامة الحاشية [a] في المتن كما هو مطلوب.
