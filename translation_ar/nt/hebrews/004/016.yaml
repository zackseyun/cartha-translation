source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: ar
  text: فلنتقدَّم إذًا بجرأةٍ[a] إلى عرش النعمة، لكي ننال رحمةً ونجد نعمةً لعونٍ يأتي في حينه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بثقة». يمكن أن يدل اللفظ اليوناني على الثقة والجرأة وحرية الكلام أو التقدّم.
    reason: lexical_alternative
  - marker: b
    text: أو «لعونٍ في وقت الحاجة». تشير العبارة اليونانية، على نحو أقرب إلى الحرفية، إلى عون يأتي في الوقت المناسب.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: فلنتقدَّم
  rationale: فعل مضارع بصيغة الحثّ؛ تنقل «فلنتقدّم» الدعوة الجماعية إلى الاقتراب، بلغة عربية واضحة ومعاصرة.
- source_word: οὖν
  choice: إذًا
  rationale: تُظهر النتيجة المستخلصة من الكلام السابق عن يسوع رئيس الكهنة، من غير إثقال الأسلوب.
- source_word: μετὰ παρρησίας
  choice: بجرأة
  rationale: تحفظ القوة الدلالية التي تجمع حرية التقدّم والثقة وعدم التحفّظ، من غير أن توحي بالتهوّر أو الاستحقاق.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: إلى عرش النعمة
  rationale: تحافظ على صورة العرش وعلى تركيب الإضافة من دون حسمه تفسيريًا إلى «العرش الرحيم» أو «عرش الله الكريم».
- source_word: ἵνα
  choice: لكي
  rationale: تنقل دلالة الغاية بوضوح وطبيعية في العربية.
- source_word: λάβωμεν ἔλεος
  choice: ننال رحمةً
  rationale: «ننال» تعبير عربي طبيعي عن تلقّي الرحمة ويحفظ تمييز الفعل عن «نجد» في العبارة التالية.
- source_word: χάριν εὕρωμεν
  choice: نجد نعمةً
  rationale: يحفظ الفعل «نجد» والصلة المعجمية بين χάρις هنا و«النعمة» في «عرش النعمة».
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: لعونٍ يأتي في حينه
  rationale: يعبّر بوضوح عن عون حسن التوقيت، وهو أقرب إلى دلالة εὔκαιρος من قصر العبارة على حالة المحتاج.
theological_decisions:
- issue: دلالة παρρησία عند التقدّم إلى الله
  choice: بجرأة
  alternative: بثقة
  rationale: «بجرأة» تحفظ قوة حرية الدخول والتقدّم التي يفيدها اللفظ، مع بقاء «بثقة» احتمالًا معجميًا مشروعًا؛ ولا تضيف العبارة معنى الاستحقاق أو التجرؤ الوقح.
- issue: ترجمة χάρις في الجملة الثانية
  choice: نعمة
  alternative: حظوة
  rationale: «نعمة» دقيقة في السياق وتحفظ الصلة اللفظية المقصودة مع «عرش النعمة»، من غير فرض معنى مذهبي زائد على النص.
- issue: دلالة εὔκαιρος في وصف العون
  choice: عون يأتي في حينه
  alternative: عون في وقت الحاجة
  rationale: الصياغة المختارة تُبقي التركيز على كون العون حسن التوقيت، بينما البديل التقليدي يبرز ظرف المحتاج، وهو معنى سياقي ممكن لكنه أكثر تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ توازي «ننال رحمةً» و«نجد نعمةً»، كما حُفظت استعارة «عرش النعمة». وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحانهما، لا بعد أداة الاستنتاج.
