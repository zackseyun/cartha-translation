source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: ar
  text: 'فنحن الذين آمنّا ندخل الراحة، كما قال: «كما أقسمتُ في غضبي: لن يدخلوا راحتي»[a]، مع أن أعماله قد أُنجزت منذ تأسيس العالم.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «إن يدخلوا راحتي»، وهي صيغة قسم تفيد: «لن يدخلوا راحتي قطعًا» أو «لن يدخلوا راحتي أبدًا».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «مع أن أعماله كانت قد اكتملت منذ تأسيس العالم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: ندخل
  rationale: مضارع خبري بصيغة المتكلم الجمع؛ يحفظ الدلالة الحاضرة من غير حصرها في الاستمرار أو المستقبل.
- source_word: κατάπαυσιν
  choice: الراحة
  rationale: تشير إلى راحة الله المحددة الجاري الحديث عنها، و«الراحة» تعبير عربي واضح وطبيعي.
- source_word: οἱ πιστεύσαντες
  choice: نحن الذين آمنّا
  rationale: يحفظ اسم الفاعل اليوناني في صيغة الماضي مع اشتمال الكاتب على نفسه الذي تدل عليه صيغة الجمع.
- source_word: καθὼς εἴρηκεν
  choice: كما قال
  rationale: صياغة عربية طبيعية تنقل قولًا إلهيًا ثابت الحجية في السياق، وإن لم تُظهر تمامًا فرق صيغة التمام اليونانية.
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: كما أقسمتُ في غضبي
  rationale: «غضبي» يحفظ قوة ὀργή القضائية والاقتباس المهيب.
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: لن يدخلوا راحتي
  rationale: الشرط المسبوق بقسم صيغة سامية تفيد النفي القاطع؛ تُنقل دلالتها بالعربية الواضحة، مع إثبات الصيغة الحرفية في الحاشية.
- source_word: καίτοι
  choice: مع أن
  rationale: تفيد الاستدراك أو التنازل بوضوح في العربية المعاصرة.
- source_word: τῶν ἔργων ... γενηθέντων
  choice: أعماله قد أُنجزت
  rationale: التركيب المطلق يفيد أن الأعمال صارت منجزة؛ وإضافة الضمير يوضح أن المقصود أعمال الله من السياق.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: منذ تأسيس العالم
  rationale: ينقل اصطلاح بدء العالم أو إنشائه بلغة عربية مفهومة من غير تفسير زائد.
theological_decisions:
- issue: دلالة صيغة القسم في اقتباس المزمور 95
  choice: 'نقل معناها بالنفي القاطع: «لن يدخلوا راحتي»'
  alternative: 'النقل الحرفي: «إن كانوا سيدخلون راحتي» أو «إن دخلوا راحتي»'
  rationale: εἰ مع المستقبل داخل صيغة القسم السامية لا يطرح شرطًا مفتوحًا، بل يفيد الامتناع المؤكد. تبيّن الحاشية البنية الحرفية حفاظًا على صلة النص بمصدره.
- issue: الزمن في دخول المؤمنين الراحة
  choice: المضارع «ندخل»
  alternative: «نحن داخلون» أو «سندخل»
  rationale: يحفظ المضارع اليوناني توتر الحاضر والمستقبل في حجة الرسالة، فلا يقصر الدخول على المستقبل ولا يبالغ في تصويره كحدث مستمر.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «فنحن» لربط التعليل بما قبله، وحُفظ مصطلح «الراحة» المحوري. وُضع كل مؤشر حاشية في المتن عند العبارة التي يشرحها.
