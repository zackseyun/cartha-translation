  verdict: approve
  source_fidelity: النص العربي ينقل البنية الاستدلالية في ἐπεὶ οὖν بـ«فبما أنه»، ويحافظ على دلالة الاستمرار في ἀπολείπεται («لا يزال متاحًا»). كما ينقل عدم التحديد في τινὰς، والمبني للمجهول في οἱ πρότερον εὐαγγελισθέντες، وسبب عدم الدخول في δι’ ἀπείθειαν. الضمير المؤنث في «يدخلوها» عائد، كما في اليونانية، إلى الراحة المذكورة في السياق السابق. وإظهار الضمير في «لم يدخلوها» توضيح عربي مشروع للسياق ولا يغيّر المعنى.
  naturalness: الصياغة فصيحة معاصرة ومفهومة، وتحافظ على كون العبارة جزءًا من الجملة الممتدة إلى الآية التالية بوضع الفاصلة الختامية. «بُشِّروا من قبل» عبارة طبيعية موجزة تؤدي معنى تلقي إعلان البشارة.
  terminology: «العصيان» مقابِل مناسب لـἀπείθεια ويحفظ الفرق الدلالي عن عدم الإيمان، بينما تقدّم الحاشية البديل الممكن من غير فرض تفسير مذهبي. و«بُشِّروا» يحافظ على المبني للمجهول ومعنى إعلان الخبر السار.
