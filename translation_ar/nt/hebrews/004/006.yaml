  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: ar
  text: فبما أنه لا يزال متاحًا لبعض الناس أن يدخلوها، وأن الذين بُشِّروا من قبل لم يدخلوها بسبب العصيان[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسبب عدم الإيمان». يمكن للكلمة اليونانية أن تدل على رفض الإيمان كما يظهر في العصيان.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: فبما أنه
  rationale: يجمع بين الاستنتاج والتمهيد السببي، ويربط الآية طبيعيًا بالحجة السابقة.
- source_word: ἀπολείπεται
  choice: لا يزال متاحًا
  rationale: ينقل دلالة الاستمرار في بقاء إمكان الدخول قائمًا، بصياغة عربية واضحة.
- source_word: τινὰς
  choice: لبعض الناس
  rationale: يحافظ على الإشارة غير المحددة إلى أشخاص، ويستقيم مع تركيب المصدر في العربية.
- source_word: εἰσελθεῖν εἰς αὐτήν
  choice: أن يدخلوها
  rationale: يحافظ على الضمير العائد إلى الراحة المذكورة في السياق السابق، من غير إضافتها صراحة إلى النص.
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: الذين بُشِّروا من قبل
  rationale: يحافظ على المبني للمجهول وعلى معنى إعلان البشارة لهم، بعبارة عربية موجزة وطبيعية.
- source_word: οὐκ εἰσῆλθον
  choice: لم يدخلوها
  rationale: نقل مباشر لنفي الفعل الماضي، مع إظهار الضمير في العربية للوضوح.
- source_word: δι’ ἀπείθειαν
  choice: بسبب العصيان
  rationale: «العصيان» ينقل المعنى الأساسي للفظ، مع إبقاء صلته بعدم الإيمان في الحاشية.
theological_decisions:
- issue: دلالة ἀπείθεια في سياق التحذير والدخول إلى الراحة
  choice: بسبب العصيان
  alternative: بسبب عدم الإيمان
  rationale: قد يدل اللفظ على رفض التصديق المتجلي في عدم الطاعة، لكن معناه المباشر يميل إلى العصيان. يحافظ المتن على هذا المعنى، وتورد الحاشية البديل لتجنب حسم التداخل الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ الضمير العائد إلى «الراحة» من السياق، واستُخدمت «بُشِّروا» للحفاظ على المبني للمجهول من دون تعبير كنسي تقني زائد.
