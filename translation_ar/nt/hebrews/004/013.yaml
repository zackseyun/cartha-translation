  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: ar
  text: وليس مخلوقٌ خافيًا أمامه، بل كلُّ شيءٍ عارٍ ومكشوفٌ لعينيه[b]، الذي علينا أن نقدِّم له حسابًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن ترجمة العبارة الأخيرة ترجمة أقرب إلى اللفظ: «الذي لنا معه أمر»، وقد تُفهم أيضًا: «الذي إليه كلامنا أو أمرنا».'
    reason: alternative_reading
  - marker: b
    text: الكلمة المترجمة «مكشوف» مشتقة من فعل نادر قد يستحضر صورة العنق مكشوفًا أو مُرجَعًا إلى الوراء، بما يؤكد الانكشاف التام أمام الله.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: مخلوق
  rationale: الاسم المفرد مستعمل استعمالًا عامًا لكل كائن أو شيء مخلوق؛ و«مخلوق» موجزة وتحفظ معنى الخلق من غير أن تجعل الإشارة إلى الخليقة في مجموعها.
- source_word: ἀφανὴς
  choice: خافيًا
  rationale: السياق يتناول استحالة الاحتجاب عن فحص الله، لا صفة عدم المرئية في ذاتها.
- source_word: ἐνώπιον αὐτοῦ
  choice: أمامه
  rationale: ترجمة مباشرة وطبيعية للعبارة، وتفيد الحضور المكشوف أمام الله من غير توسع تفسيري.
- source_word: πάντα
  choice: كلُّ شيءٍ
  rationale: تنقل شمول الجمع المحايد بصياغة عربية طبيعية واضحة.
- source_word: γυμνὰ
  choice: عارٍ
  rationale: تحفظ الصورة القوية للتجرد والانكشاف الكامل.
- source_word: τετραχηλισμένα
  choice: مكشوفٌ
  rationale: الفعل نادر وقد يوحي بكشف العنق أو إرجاعه إلى الوراء؛ «مكشوف» ينقل حالة الانكشاف التام من غير حسم الصورة المختلف فيها، مع بيانها في الحاشية.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: لعينيه
  rationale: صياغة عربية موجزة تحافظ على صورة النظر الإلهي وعلى علاقة الأشياء المنكشفة بعينيه.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: وهو الذي علينا أن نقدِّم له حسابًا
  rationale: ينقل في العربية الواضحة معنى المساءلة المرجح في السياق، مع إبقاء الاحتمالات الأكثر حرفية في الحاشية بسبب إيجاز العبارة اليونانية واحتمالها.
theological_decisions:
- issue: دلالة πρὸς ὃν ἡμῖν ὁ λόγος
  choice: وهو الذي علينا أن نقدِّم له حسابًا
  alternative: الذي لنا معه شأن؛ أو الذي إليه كلامنا/أمرنا
  rationale: سياق فحص الله النافذ ودينونته يرجح معنى المساءلة، لكن العبارة اليونانية مكثفة وتحتمل فهمًا أعم؛ لذلك لم تُطمس البدائل بل حُفظت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صورة العري والانكشاف، وصيغت خاتمة الآية بلغة مفهومة مع توثيق غموض الأصل في الحاشية. وُضع مؤشرا الحاشيتين في ختام الآية لأنهما يتعلقان بالعبارتين الختاميتين.
