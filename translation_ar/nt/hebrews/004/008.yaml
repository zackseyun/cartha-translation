  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: ar
  text: فَلَوْ كَانَ يَشُوعُ[a] قَدْ أَرَاحَهُمْ، لَمَا تَكَلَّمَ بَعْدَ ذَلِكَ عَنْ يَوْمٍ آخَرَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «يسوع». فصيغة الاسم Ἰησοῦς يمكن أن تشير إلى يسوع أو إلى يشوع؛ والسياق هنا يدل على يشوع بن نون.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: يَشُوعُ
  rationale: الصيغة اليونانية نفسها تُستعمل ليسوع ويشوع، لكن سياق دخول إسرائيل إلى الأرض والحديث عن الراحة يدل هنا على يشوع بن نون؛ وتوضح الحاشية صورة الاسم في اليونانية.
- source_word: κατέπαυσεν
  choice: قَدْ أَرَاحَهُمْ
  rationale: يحفظ هذا التعبير المعنى السببي للفعل، أي جعلهم يستريحون أو منحهم الراحة، ويظل طبيعيًا في العربية.
- source_word: οὐκ ἂν ... ἐλάλει
  choice: لَمَا تَكَلَّمَ
  rationale: تنقل «لما» النتيجة المخالفة للواقع في الشرط الماضي، مع إبقاء فاعل «تكلم» مستترًا كما هو غير مصرّح به في اليونانية.
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: عَنْ يَوْمٍ آخَرَ
  rationale: صياغة عربية مباشرة تحفظ الإشارة إلى يوم لاحق لم يستنفد يشوع وعد الراحة قبله.
- source_word: μετὰ ταῦτα
  choice: بَعْدَ ذَلِكَ
  rationale: ينقل الترتيب الزمني بوضوح ومن غير اختزال دلالة العبارة.
- source_word: γὰρ
  choice: فَـ
  rationale: الفاء في «فلو» تربط التعليل والاستدلال بما سبق ربطًا عربيًا طبيعيًا.
theological_decisions:
- issue: مرجع الاسم Ἰησοῦς في عبرانيين 4:8
  choice: يشوع بن نون
  alternative: يسوع
  rationale: سياق الحجة هو دخول بني إسرائيل إلى الأرض بقيادة يشوع، ثم بقاء الوعد براحة أخرى في كلام لاحق. ومع ذلك تُذكر مطابقة الصيغة اليونانية لاسم يسوع في الحاشية صونًا للشفافية النصية.
- issue: فاعل ἐλάλει غير المصرّح به
  choice: إبقاء الفاعل مستترًا في «تكلّم»
  alternative: التصريح بلفظ «الله» أو «داود»
  rationale: النص اليوناني لا يذكر فاعلًا صريحًا في هذه الجملة؛ لذلك لا تضيف الترجمة اسمًا يحسم المرجع، بل تحفظ ما في الصياغة من إجمال.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُعمل الشرط «فلو... لما» لنقل البنية المخالفة للواقع، وأُبقي فاعل «تكلّم» مستترًا تجنبًا لإضافة ما لا يصرّح به الأصل.
