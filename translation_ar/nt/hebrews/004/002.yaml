  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: ar
  text: فإننا نحن أيضًا قد بُشِّرنا كما بُشِّر أولئك، لكن الرسالة التي سمعوها لم تنفعهم، لأنهم لم يكونوا متحدين بالإيمان مع الذين سمعوا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'بحسب قراءة نصية أخرى، يمكن ترجمة العبارة: «لأن الرسالة لم تمتزج بالإيمان في الذين سمعوا».'
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: قد بُشِّرنا
  rationale: ينقل تركيب التام المحيطي الدال على إعلان بشارة تمّ وله أثر مستمر، ويحافظ على الفكرة الفعلية بصياغة عربية طبيعية.
- source_word: καθάπερ κἀκεῖνοι
  choice: كما بُشِّر أولئك
  rationale: يُظهر بوضوح المماثلة بين المخاطَبين وجيل البرية في تلقّي البشارة، مع استكمال الفعل المحذوف طبيعيًا في العربية.
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: الرسالة التي سمعوها
  rationale: يعبّر عن λόγος بوصفه مضمونًا مُعلَنًا وعن ἀκοή بوصفها السماع، من غير تقيد بتركيب حرفي غامض.
- source_word: ὠφέλησεν
  choice: لم تنفعهم
  rationale: صياغة عربية واضحة تحفظ معنى عدم تحقيق الفائدة المقصودة.
- source_word: συγκεκερασμένους
  choice: يتحدوا
  rationale: يحفظ المعنى المجازي للضم أو المزج، ويتفق نحويًا مع قراءة SBLGNT التي تجعل اسم المفعول منصوبًا عائدًا إلى «أولئك».
- source_word: πίστει
  choice: بالإيمان
  rationale: ينقل πίστις بمعناه الأرجح هنا، مع احتمال دلالة الباء على الوسيلة أو المجال.
- source_word: τοῖς ἀκούσασιν
  choice: مع الذين سمعوا
  rationale: ترجمة قريبة من الفعل ἀκούω وتحافظ على الغموض القائم بشأن طبيعة استجابتهم بدل إضافة معنى «أصغوا» أو «أطاعوا».
theological_decisions:
- issue: دلالة πίστις
  choice: الإيمان
  alternative: الثقة
  rationale: السياق يقابل سماع الرسالة بالاستجابة المؤمنة، و«الإيمان» هو المقابل العربي المباشر من غير فرض تصور مذهبي خاص.
- issue: مرجع العبارة الختامية
  choice: لأنهم لم يتحدوا بالإيمان مع الذين سمعوا
  alternative: لأن الرسالة لم تمتزج بالإيمان في الذين سمعوا
  rationale: يتبع المتن قراءة SBLGNT ذات συγκεκερασμένους بالنصب والجمع، التي توافق ἐκείνους؛ وتُذكر القراءة النصية الأخرى، التي تسند عدم الامتزاج إلى الرسالة، في الحاشية حفاظًا على الشفافية والتوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «بُشِّرنا» بإيجاز وطبيعية، وحُفظت القراءة النحوية الصعبة للنص اليوناني في المتن مع بيان البديل النصي التقليدي في الحاشية.
