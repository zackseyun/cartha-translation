  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: ar
  text: فلنجتهد إذن أن ندخل تلك الراحة، لئلّا يسقط أحد في النمط نفسه من العصيان.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في المثال نفسه لعدم الإيمان». يمكن فهم الاسم في ضوء رفض جيل البرية أن يثق بالله، مع أن اللفظ اليوناني يعني بصورة أصرح «العصيان» أو «عدم الطاعة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: فلنجتهد
  rationale: صيغة الحثّ في اليونانية تدعو الجماعة إلى بذل الجهد بجدّ؛ و«فلنجتهد» عربية واضحة تحفظ معنى المثابرة والحرص.
- source_word: οὖν
  choice: إذن
  rationale: تُظهر النتيجة المستخلصة من الكلام السابق عن راحة الله وفشل جيل البرية.
- source_word: εἰσελθεῖν
  choice: أن ندخل
  rationale: ترجمة مباشرة للمصدر الذي يكمّل فعل الاجتهاد.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: ذلك الرَّاحَة
  rationale: يحفظ اسم الإشارة والإحالة إلى الراحة الإلهية التي سبق شرحها، من غير زيادة تفسيرية.
- source_word: ἵνα μὴ
  choice: لئلّا
  rationale: تنقل غرض التحذير أو نتيجته السلبية بإيجاز وفصاحة.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: متّبعًا مثال ... نفسه
  rationale: ينقل ὑπόδειγμα بوصفه مثالًا أو سابقة تحذيرية، ويعبّر طبيعيًا عن دلالة ἐν التي قد تفيد السير وفق المثال أو الوقوع ضمن نمطه.
- source_word: πέσῃ
  choice: يسقط
  rationale: يحفظ صورة السقوط وقوة التحذير في صيغة الاحتمال بعد «لئلّا».
- source_word: τῆς ἀπειθείας
  choice: العصيان
  rationale: المعنى المعجمي المباشر هو عدم الطاعة أو العصيان، مع بقاء صلته السياقية بعدم الإيمان موضحة في الحاشية.
theological_decisions:
- issue: صلة ἀπείθεια بخطيئة جيل البرية
  choice: العصيان في المتن
  alternative: عدم الإيمان
  rationale: يربط سياق الرسالة بين عدم الإيمان والعصيان، لكن اللفظ هنا يدل مباشرة على العصيان؛ لذلك يحافظ المتن على الدلالة المعجمية وتذكر الحاشية البديل السياقي من غير دمج المفهومين.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة حثّ وتحذير مهيبة. استُعمل «فلنجتهد» بدل تركيب مطوّل، وحُفظت الإحالة إلى «الراحة» كما في السياق. وُضعت علامة الحاشية في نهاية الجملة لأنها تتناول العبارة الختامية وتفسير علاقة العصيان بعدم الإيمان.
