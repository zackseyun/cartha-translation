reference: Hebrews 4:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: ar
  text: 'ويُعيّن مرة أخرى يومًا معيّنًا، هو «اليوم»، إذ يقول على لسان داود[a] بعد زمن طويل، كما سبق القول:


    «اليوم، إن سمعتم صوته،


    فلا تقسّوا قلوبكم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «في داود»، أي في المزمور المرتبط بداود.'
    reason: حفظ الاحتمال الاصطلاحي في العبارة اليونانية ἐν Δαυὶδ، وعدم حصرها في معنى الوساطة وحده.
lexical_decisions:
- source_word: πάλιν
  choice: ويعود
  rationale: تفيد استئناف الحجة وتكرار تعيين يوم، وهذه الصياغة طبيعية في العربية ضمن سياق الاستدلال.
- source_word: τινὰ ἡμέραν
  choice: يومًا محددًا
  rationale: تنقل معنى يوم بعينه دون أن يكون قد سُمّي بعد؛ ثم يوضحه النص بأنه «اليوم».
- source_word: ὁρίζει
  choice: يعيّن
  rationale: تعبّر عن تحديد اليوم بسلطان وقصد، من غير تحميل اللفظ معنى اصطلاحيًا زائدًا.
- source_word: Σήμερον
  choice: «اليوم»
  rationale: أُبقيت بوصفها تسمية اليوم ومحور الاقتباس والحجة، لا مجرد إشارة إلى تاريخ تقويمي.
- source_word: ἐν Δαυὶδ λέγων
  choice: إذ يقول على لسان داود
  rationale: صياغة عربية واضحة تفيد أن القول جاء بواسطة داود، مع إثبات البديل الحرفي المحتمل في الحاشية تجنبًا لحسم دلالة العبارة الاصطلاحية.
- source_word: μετὰ τοσοῦτον χρόνον
  choice: بعد زمن طويل
  rationale: تنقل طول الفاصل الزمني المقصود بعبارة عربية موجزة وطبيعية.
- source_word: καθὼς προείρηται
  choice: كما سبق القول
  rationale: تحفظ الإحالة إلى قول سابق ما زالت له صلة بالحجة الحاضرة.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: إن سمعتم صوته
  rationale: تحفظ صورة السماع في الأصل وما تنطوي عليه سياقيًا من استجابة، من غير تحويلها صراحة إلى «أطعتم».
- source_word: μὴ σκληρύνητε
  choice: فلا تقسّوا
  rationale: المقابل العربي المألوف والدقيق للتحذير من جعل القلب قاسيًا أو الإصرار في العناد.
- source_word: τὰς καρδίας ὑμῶν
  choice: قلوبكم
  rationale: تحفظ التعبير الكتابي عن باطن الإنسان وإرادته واتجاهه دون شرح تفسيري داخل المتن.
theological_decisions:
- issue: دلالة «اليوم» في الحجة المتعلقة براحة الله
  choice: إبقاؤها يومًا يعيّنه الله وفرصة حاضرة للاستجابة، دون حصرها في تاريخ تقويمي.
  alternative: قصرها على يوم نطق صاحب المزمور، أو جعلها يومًا أخرويًا حصريًا.
  rationale: يرتكز الاستدلال على بقاء يوم للاستجابة بعد زمن طويل من جيل البرية؛ والصياغة تحفظ هذا التوتر الزمني دون بناء تصور لاهوتي أوسع مما يقوله النص.
- issue: معنى ἐν Δαυὶδ
  choice: «على لسان داود» في المتن، مع ذكر «في داود» في الحاشية.
  alternative: «في داود»، أي في المزمور الداودي أو المرتبط بداود.
  rationale: العبارة اليونانية تحتمل الإشارة إلى وساطة داود في القول أو إلى موضع القول ضمن نص مرتبط به؛ لذا اختير التعبير العربي الواضح مع حفظ الاحتمال الآخر في الحاشية، من غير الجزم بتفاصيل نسبة تأليف المزمور.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يومًا محددًا» بدل «يومًا معينًا» لتجنب التباس «مُعيَّن» مع الفعل السابق، ووُضع الاقتباس الشعري في سطرين لإبراز استشهاد المزمور.
