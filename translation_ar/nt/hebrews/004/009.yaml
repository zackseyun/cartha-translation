  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: ar
  text: إذًا، تبقى راحة سبت[a] لشعب الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حفظ السبت». اللفظة اليونانية σαββατισμός نادرة، وتستحضر لغة السبت صراحةً؛ ويُرجَّح أنها تشير هنا إلى راحة على مثال السبت تبقى لشعب الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: إذًا
  rationale: أداة استنتاج تربط هذه الخلاصة بالحجة السابقة، و«إذًا» تؤدي هذا المعنى بوضوح وطبيعية.
- source_word: ἀπολείπεται
  choice: لا تزال ... باقية
  rationale: ينقل التعبير معنى أن الراحة بقيت وما زالت متاحة؛ وإضافة «لا تزال» تُظهر الاستمرار الملازم للسياق.
- source_word: σαββατισμός
  choice: راحة سبتية
  rationale: اللفظة اليونانية نادرة وترتبط صراحةً بالسبت، وقد تعني راحة على مثال السبت أو حفظ السبت. «راحة سبتية» تحفظ الصلة اللفظية بالسبت والتركيز السياقي على الراحة من دون حصر المعنى في ممارسة أسبوعية.
- source_word: τῷ λαῷ
  choice: لشعب
  rationale: 'اللام تعبّر طبيعيًا عن جهة الاختصاص أو المنفعة: هذه الراحة باقية لشعب الله.'
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: تركيب «شعب الله» هو المقابل العربي الطبيعي والموجز لعلاقة الإضافة في النص اليوناني.
theological_decisions:
- issue: دلالة σαββατισμός في عبرانيين 4:9
  choice: راحة ذات صلة واضحة بالسبت، لا تزال باقية لشعب الله
  alternative: حفظ السبت حرفيًا، أو راحة روحية مجازية مجردة من أي صلة بالسبت
  rationale: تستحضر اللفظة نفسها السبت، كما يربط السياق بين راحة الله واليوم السابع والراحة الموعودة. لذلك تحفظ «راحة سبتية» التوتر الدلالي واللاهوتي من غير اختزاله في فريضة أسبوعية فقط أو في استعارة لا صلة لها بالسبت.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات نبرة كتابية معاصرة. استُعملت «راحة سبتية» بدل التعريب الاصطلاحي الغريب أو العبارة الطقسية الأضيق، مع إثبات البديل في الحاشية.
