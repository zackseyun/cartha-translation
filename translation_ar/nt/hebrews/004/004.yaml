source:
  edition: SBLGNT
  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: ar
  text: 'فقد قال في موضع ما عن اليوم السابع هكذا: «واستراح الله في اليوم السابع من جميع أعماله».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في مكان معيّن». يقول اليوناني حرفيًا «في موضع ما»، وهي طريقة غير محددة لتقديم الاقتباس الكتابي، ولا تدل على الشك في سلطانه.
    reason: lexical_alternative
  - marker: b
    text: أو «كفَّ». قد يشدد الفعل على التوقف عن العمل؛ واستُعملت «استراح» هنا للمحافظة على الصلة بتكوين 2:2 وبموضوع راحة الله في العبرانيين 3–4.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: قال
  rationale: الفعل اليوناني في صيغة التام يشير إلى قول سابق ما زال قائم الصلة؛ والعربية الفصحى تعبّر عن ذلك طبيعيًا بالماضي «قال»، مع دلالة السياق على بقاء سلطان القول.
- source_word: γάρ
  choice: فقد
  rationale: تربط «فقد» الآية بما قبلها بوصفها تعليلًا أو سندًا، وتأتي طبيعية في هذا الموضع.
- source_word: που
  choice: في موضع ما
  rationale: يحفظ التعبير الإحالة غير المحددة إلى موضع كتابي، من غير أن يوحي بالشك في سلطان النص.
- source_word: περὶ τῆς ἑβδόμης
  choice: عن اليوم السابع
  rationale: الصفة المؤنثة المعرّفة تحذف معها كلمة «اليوم» المفهومة من السياق اليوناني، فأُظهرت بالعربية للوضوح.
- source_word: οὕτως
  choice: هكذا
  rationale: تقديم عربي موجز وطبيعي لصيغة الاقتباس، ويحفظ القوة الإشارية للكلمة.
- source_word: Καὶ
  choice: و
  rationale: حُفظ حرف العطف لأنه جزء من اقتباس تكوين 2:2.
- source_word: κατέπαυσεν
  choice: استراح
  rationale: يحفظ الصلة اللفظية والموضوعية بحديث العبرانيين عن راحة الله وباقتباس تكوين 2:2، مع إمكان معنى الكف عن العمل.
- source_word: ὁ θεὸς
  choice: الله
  rationale: نقل مباشر للفاعل المعرّف في اليونانية.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: في اليوم السابع
  rationale: صياغة عربية فصيحة طبيعية للدلالة الزمنية، وتحفظ تعيين اليوم وترتيبه.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: من جميع أعماله
  rationale: يحفظ حرف الجر معنى الكف والانتهاء من الأعمال، كما يحفظ جمع ἔργων.
theological_decisions:
- issue: صياغة توقف الله عن العمل وعلاقتها بموضوع الراحة في العبرانيين
  choice: استراح
  alternative: كفَّ
  rationale: «استراح» تحافظ على الرابط المقصود بين تكوين 2:2 وجدال العبرانيين 3–4 حول راحة الله، من غير أن يلزم منها أن الله أصابه تعب؛ أما «كفَّ» فتبرز جانب التوقف عن العمل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «فقد قال» لربط التعليل بما قبله، و«في موضع ما» لحفظ عدم تحديد موضع الاقتباس، مع إبقاء صيغة الاقتباس مألوفة ومتسقة مع موضوع الراحة.
