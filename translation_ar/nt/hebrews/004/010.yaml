source:
  edition: SBLGNT
  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: ar
  text: لِأَنَّ مَنْ دَخَلَ رَاحَتَهُ اسْتَرَاحَ هُوَ أَيْضًا مِنْ أَعْمَالِهِ[b][a]، كَمَا اسْتَرَاحَ اللهُ مِنْ أَعْمَالِهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَنْ دَخَلَ رَاحَةَ اللهِ». والأرجح في سياق عبرانيين 3–4 أن الضمير في «راحته» يعود إلى الله.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «كَفَّ عَنْ أَعْمَالِهِ». والفعل اليوناني من جذر كلمة «الراحة» في هذا السياق، لذلك أبقت الترجمة تكرار لفظ الراحة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: مَنْ دَخَلَ
  rationale: ينقل التركيب الاسمي مع اسم الفاعل الماضي بوصفه إشارة عامة إلى الشخص الذي تحقق منه الدخول، وهو تعبير عربي طبيعي وموجز.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تقدّم الأداة تعليلًا يشرح القول السابق، و«لأنّ» تؤدي هذه الوظيفة بوضوح.
- source_word: κατάπαυσιν
  choice: رَاحَتَهُ
  rationale: «الراحة» هي اللفظة المحورية في عبرانيين 3–4، وتحفظ الصلة براحة الله وبسياق التكوين.
- source_word: αὐτοῦ (after κατάπαυσιν)
  choice: ـهُ في «راحته»
  rationale: يحافظ الضمير على صياغة اليونانية وعلى قدر من الإبهام النحوي، مع أن السياق يرجّح رجوعه إلى الله.
- source_word: καὶ αὐτὸς
  choice: هُوَ أَيْضًا
  rationale: يحفظ كلًّا من التوكيد في αὐτός ومعنى الإضافة في καί بصياغة عربية طبيعية.
- source_word: κατέπαυσεν
  choice: اسْتَرَاحَ
  rationale: يحفظ التجانس اللفظي مع «الراحة»، مع بقاء معنى الكفّ عن العمل مفهومًا من حرف الجر والسياق.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: مِنْ أَعْمَالِهِ
  rationale: ترجمة مباشرة لا تحصر «الأعمال» في الأعمال الاستحقاقية أو في نوع مخصوص من الجهد.
- source_word: ὥσπερ
  choice: كَمَا
  rationale: تؤدي المقارنة الصريحة بإيجاز وطبيعية.
- source_word: τῶν ἰδίων
  choice: مِنْ أَعْمَالِهِ
  rationale: الموصوف محذوف في اليونانية ومفهوم من «الأعمال» السابقة؛ إظهاره في العربية لازم للوضوح، والضمير يعبّر طبيعيًا عن معنى «أعماله الخاصة».
- source_word: ὁ θεός
  choice: اللهُ
  rationale: المقابل العربي المعياري، مع إبقاء الله فاعلًا صريحًا في المقارنة.
theological_decisions:
- issue: مرجع الضمير في «راحته» (αὐτοῦ)
  choice: إبقاء «راحته» في المتن، مع ترجيح أن الضمير يعود إلى الله في الحاشية.
  alternative: تفسيرها بأنها راحة الشخص الذي دخل.
  rationale: السياق المتكرر في عبرانيين 3–4 يتحدث عن راحة الله التي يدخلها المؤمن، لكن إبقاء الضمير يتجنب حسم ما تركه النص اليوناني ضميريًا.
- issue: هوية «مَنْ دَخَلَ»
  choice: إبقاء التعبير عامًا من غير تعيينه بالمؤمن أو بالمسيح.
  alternative: فهم المفرد على أنه إشارة مخصوصة إلى المسيح.
  rationale: التركيب اليوناني في ذاته لا يسمّي الشخص، والسياق يحتمل نقاشًا تفسيريًا؛ لذلك لا ينبغي إدخال هوية غير مصرّح بها في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم التشكيل الكامل لتثبيت قراءة الضمائر والإعراب. حوفظ على تكرار جذر «راح/استراح» وعلى إبهام الضمير في المتن، ووُضعت علامتا الحاشيتين بعد «أعماله» وفق ترتيب طبقة المراجعة الإنجليزية.
