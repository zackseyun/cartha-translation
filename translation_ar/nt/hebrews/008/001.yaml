source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: ar
  text: 'أما النقطة الرئيسية[a] فيما يُقال فهي هذه: لنا رئيس كهنة كهذا، قد جلس عن يمين عرش الجلال في السماوات[b]،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الخلاصة»، أو «أهم نقطة فيما يُقال».
    reason: lexical_alternative
  - marker: b
    text: 'أو «في السماء»؛ واليونانية حرفيًا: «في السماوات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: النقطة الرئيسية
  rationale: تؤدي المعنى الاصطلاحي للكلمة في سياق الانتقال إلى خلاصة الحجة أو محورها، من غير حملها على معناها الحرفي «رأس» أو «فصل».
- source_word: δὲ
  choice: أما
  rationale: أداة انتقال خفيف تمهّد لعرض النقطة المحورية، ولا تستلزم مقابلة شديدة أو معنى زمنيًا.
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: فيما يُقال
  rationale: تحفظ دلالة المضارع المبني للمجهول وتأتي طبيعية واضحة في العربية.
- source_word: τοιοῦτον ἔχομεν ἀρχιερέα
  choice: لنا رئيس كهنة كهذا
  rationale: تحفظ الإشارة إلى الصفة أو النوع السابق وصفه، مع صياغة عربية طبيعية لفعل الامتلاك.
- source_word: ἐκάθισεν
  choice: قد جلس
  rationale: تعبر «قد» مع الماضي عن وقوع الفعل واكتماله، من غير إضافة تفسير لمدلوله اللاهوتي.
- source_word: ἐν δεξιᾷ
  choice: عن يمين
  rationale: التعبير العربي الكتابي والطبيعي للمكان ذي الكرامة والسلطان، مع إبقاء الصورة الأصلية.
- source_word: τοῦ θρόνου
  choice: عرش
  rationale: ترجمة مباشرة تحفظ الصورة الملكية، وهو مضاف إلى «الجلال» في تركيب عربي سليم.
- source_word: τῆς μεγαλωσύνης
  choice: الجلال
  rationale: يحفظ الكناية التوقيرية عن الله من غير استبدالها بلفظ «الله» الصريح الذي لا يرد في اليونانية.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: في السماوات
  rationale: تحفظ صيغة الجمع في الأصل اليوناني، وهي مفهومة وفصيحة في العربية المعاصرة.
theological_decisions:
- issue: هل يُصرَّح بأن «الجلال» هو الله؟
  choice: الإبقاء على الكناية التوقيرية «الجلال».
  alternative: عرش الله
  rationale: النص اليوناني يستعمل μεγαλωσύνη بوصفها تسمية توقيرية غير مباشرة، فالتصريح بالمرجع يحسم ما أبقاه النص ضمنيًا.
- issue: هل يُوسَّع معنى ἐκάθισεν لإبراز اكتمال العمل الكهنوتي؟
  choice: «قد جلس» بلا توسع تفسيري.
  alternative: جلس بعدما أتم عمله الكهنوتي
  rationale: صيغة الفعل تدل على وقوع الجلوس، أما ربطه الصريح باكتمال العمل الكهنوتي فينبغي أن يُستفاد من السياق لا أن يُضاف إلى نص الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعملت «أما» لتأدية الانتقال الخطابي الذي تشير إليه δέ، وحُفظ جمع «السماوات» والكناية «الجلال». وُضع الهامش [a] بعد العبارة التي يشرحها، أي «النقطة الرئيسية»، بدل إلحاقه بـ«رئيس كهنة».
