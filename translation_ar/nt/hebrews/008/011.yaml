source:
  edition: SBLGNT
  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: ar
  text: 'ولن يعلِّم كلُّ واحدٍ مواطنَه[a]، ولا كلُّ واحدٍ أخاه، قائلًا: «اعرف الرب»، لأنهم جميعًا سيعرفونني، من صغيرهم إلى كبيرهم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قريبَه». يرد في النص اليوناني للعبرانيين «مواطنه»، في حين تُترجم العبارة في مقطع إرميا الذي يقتبسه عادةً «قريبه».
    reason: إثبات الصياغة البديلة المألوفة مع الحفاظ في المتن على لفظ النص اليوناني للعبرانيين.
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: ولن يعلِّم
  rationale: تفيد οὐ μή مع صيغة الالتزام نفيًا قويًّا موجَّهًا إلى المستقبل. وتؤدي «لن» هذا المعنى في العربية الفصحى بوضوح وطبيعية، من غير إضافة قيد زمني غير مصرح به.
- source_word: ἕκαστος
  choice: كلُّ واحدٍ
  rationale: يحفظ هذا التعبير القوة التوزيعية، إذ يتناول أفراد جماعة العهد واحدًا واحدًا.
- source_word: πολίτην
  choice: مواطنَه
  rationale: اللفظة اليونانية تعني المواطن أو شريك المواطنة، ولذلك يحافظ «مواطنه» على خصوصية نص العبرانيين بدل استبداله بصياغة إرميا الأشهر.
- source_word: ἀδελφὸν
  choice: أخاه
  rationale: يحفظ اللفظ المذكر المفرد في اليونانية والصورة العائلية التي يستعملها النص.
- source_word: Γνῶθι
  choice: اعرف
  rationale: أمر مباشر وطبيعي في العربية، ويقابل معنى الفعل اليوناني في سياق الدعوة إلى معرفة الرب.
- source_word: κύριον
  choice: الرب
  rationale: «الرب» هو المقابل الملائم لـ κύριος هنا، ولا سيما في سياق اقتباس وعد العهد من إرميا.
- source_word: πάντες εἰδήσουσίν με
  choice: لأنهم جميعًا سيعرفونني
  rationale: يحفظ شمول πάντες، وصيغة المستقبل، والمفعول الصريح «ني».
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: من صغيرهم إلى كبيرهم
  rationale: تعبير عربي موجز يحفظ مدى الشمول من أدنى أفراد الجماعة إلى أعلاهم، من غير حصر المعنى في السن أو الحجم.
theological_decisions:
- issue: ترجمة πολίτην في اقتباس أو إحالة إلى إرميا 31:34
  choice: مواطنَه
  alternative: قريبَه
  rationale: النص اليوناني القائم في العبرانيين يستعمل πολίτην، أي «مواطنه»، ولذلك أُثبتت هذه القراءة في المتن وفق أولوية الأصل اليوناني، مع ذكر الصياغة المألوفة لمقطع إرميا في الحاشية.
- issue: اللغة العائلية المذكرة في ἀδελφόν
  choice: أخاه
  alternative: أخاه أو أخته
  rationale: الأصل مذكر مفرد في تركيب توزيعي، فحُفظت صيغته وصورته العائلية من غير توسيع تفسيري داخل المتن.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة ومهيبة. حُفظ التوازي بين «مواطنه» و«أخاه»، واستُعملت «لن» لنقل النفي المستقبلي القوي من غير تكلف، مع إبقاء عبارة «من صغيرهم إلى كبيرهم» مفتوحة لدلالة الشمول الاجتماعي والإنساني.
