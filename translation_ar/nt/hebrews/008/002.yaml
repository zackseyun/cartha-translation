base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: ar
  text: خادِمًا للأقداس[a] وللمَسكَن الحقيقي، الذي نصبه الرب[b]، لا إنسان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المقدس»؛ وقد تشير العبارة اليونانية إلى المواضع المقدسة في المسكن، لا إلى أشخاص مقدسين.
    reason: lexical_alternative
  - marker: b
    text: أو «أقامه الرب».
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: الأقداس
  rationale: الصفة المجموعة المعرَّفة مستعملة استعمال الاسم، وفي سياق الرسالة الكهنوتي تدل على المواضع المقدسة أو المقدس السماوي، لا على القديسين. ولفظ «الأقداس» يحفظ صيغة الجمع والإيحاء التعبدي من غير إفراط في التحديد.
- source_word: λειτουργὸς
  choice: خادِمًا
  rationale: يدل اللفظ على من يؤدي خدمة عامة أو دينية، وهنا خدمة كهنوتية في المقدس. «خادمًا» عربية واضحة وطبيعية، ويحمل السياق الدلالة التعبدية.
- source_word: σκηνῆς
  choice: المَسكَن
  rationale: يشير اللفظ في العبرانيين إلى خيمة الاجتماع ونظيرها السماوي. «المسكن» هو التعبير الكتابي العربي المألوف الذي يحفظ هذا الصدى، مع إمكان ترجمته حرفيًا «الخيمة».
- source_word: ἀληθινῆς
  choice: الحقيقي
  rationale: يحفظ معنى ما هو حق وأصيل وموافق للحقيقة، في مقابل النسخة الأرضية، من غير توسيع تفسيري.
- source_word: ἔπηξεν
  choice: نصبه
  rationale: الفعل يعني ثبّت أو أقام، ويستعمل خصوصًا في نصب الخيمة. «نصبه» طبيعي ودقيق ويحافظ على صورة المسكن.
- source_word: ὁ κύριος
  choice: الرب
  rationale: المقابل العربي المألوف والدقيق للقب κύριος في هذا السياق، مع أداة التعريف.
- source_word: οὐκ ἄνθρωπος
  choice: لا إنسان
  rationale: يحفظ النفي المقتضب والاسم المفرد غير المعرّف، ويعبّر بوضوح عن المقابلة بين فعل الرب وفعل البشر من غير حصرها في الذكر.
theological_decisions:
- issue: مرجع «τῶν ἁγίων» وصلته بالمقدس السماوي
  choice: لغة مكانية تعبدية تشير إلى الأقداس أو المقدس السماوي
  alternative: القديسون
  rationale: سياق العبرانيين 8:1-5 هو خدمة المسيح الكهنوتية في المقدس السماوي. «الأقداس» تحفظ إطار المسكن والعبادة ولا تحوّل المعنى إلى خدمة مقدمة للأشخاص.
- issue: القوة العامة لكلمة ἄνθρωπος
  choice: «لا إنسان» في مقابلة مع الرب
  alternative: «لا بشر» أو «ليس إنسانًا»
  rationale: المقصود أن الرب هو الذي نصب المسكن، لا أي إنسان. الصياغة المختارة تحفظ الإيجاز والمقابلة ولا توحي بأن العبارة خبر عن هوية الرب.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «المَسكَن» بالفتح لتفادي التباسه مع «المِسكَن»، وحُفظ تركيب الآية بوصفه تابعًا نحويًا لما قبلها، كما في النص اليوناني.
