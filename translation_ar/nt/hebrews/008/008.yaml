  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: ar
  text: 'فإنه إذ يلومهم يقول: «ها هي أيام آتية، يقول الرب، فسأُبرم مع بيت إسرائيل ومع بيت يهوذا عهدًا جديدًا،»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος ... αὐτοὺς
  choice: إذ يلومهم
  rationale: ينقل معنى توجيه اللوم إليهم مع إبقاء الضمير بحسب نص SBLGNT، من غير تفسير إضافي لهوية المشار إليهم.
- source_word: Ἰδοὺ
  choice: ها
  rationale: أداة تنبيه عربية طبيعية وموجزة تلائم افتتاح الاقتباس النبوي.
- source_word: συντελέσω ... διαθήκην καινήν
  choice: أُبرم ... عهدًا جديدًا
  rationale: الفعل في هذا السياق يعني إتمام العهد أو إنجازه؛ و«أُبرم عهدًا» تعبير عربي واضح يحفظ قوة الفعل ولا يحوّله إلى مجرد وعد.
- source_word: οἶκον Ἰσραὴλ ... οἶκον Ἰούδα
  choice: بيت إسرائيل ... بيت يهوذا
  rationale: يحافظ على الصورة الجماعية والتاريخية في الأصل وعلى الصياغة الكتابية المألوفة.
theological_decisions:
- issue: مرجع الضمير في αὐτοὺς
  choice: الإبقاء على «هم» بلا تعيين تفسيري
  alternative: ترجمة المعنى على أنه يلوم العهد الأول أو الشعب صراحةً
  rationale: قراءة SBLGNT تتضمن ضمير الجمع، وتعيين مرجعه على نحو أكثر تحديدًا يحسم توترًا تفسيريًا لا يحسمه هذا الشطر وحده.
- issue: دلالة διαθήκη
  choice: عهد
  alternative: وصية
  rationale: السياق النبوي لعلاقة الله ببيتي إسرائيل ويهوذا يقتضي «عهد»، وهي المقابلة العربية الأدق هنا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة، مع الحفاظ على إيقاع الاقتباس النبوي. لم تُضف حواشٍ، ولذلك لا توجد علامات حواشٍ في المتن.
