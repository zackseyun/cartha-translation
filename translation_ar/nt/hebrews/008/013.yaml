source:
  edition: SBLGNT
  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: ar
  text: 'بقوله[a]: «جديدًا»[b]، فقد جعل الأول متقادمًا. وما يتقادم ويشيخ قريب من الزوال[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حين يقول»، أو: «في قوله».'
    reason: lexical_alternative
  - marker: b
    text: يورد اليوناني لفظ «جديدًا» وحده، إحالةً إلى عبارة «عهدًا جديدًا» في الاقتباس السابق من إرميا 31:31.
    reason: cross_reference
  - marker: c
    text: 'أو: «قريب من الاختفاء» أو «يوشك أن يتلاشى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: بقوله
  rationale: ينقل معنى الظرف أو الوسيلة في تركيب المصدر المعرَّف مع ἐν، ويربط الحكم مباشرة بلفظ «جديدًا» ربطًا طبيعيًا موجزًا.
- source_word: Καινὴν
  choice: «جديدًا»
  rationale: يحافظ على الصفة المقتبسة وحدها في اليونانية، مع تذكيرها في العربية لأن المحذوف المفهوم من السياق هو «عهد».
- source_word: πεπαλαίωκεν
  choice: فقد جعل ... متقادمًا
  rationale: صيغة التام اليونانية تدل على فعل تمّ وبقي أثره؛ و«فقد جعل» تنقل ذلك، بينما يعبّر «متقادمًا» عن فقدان الصلاحية أو تجاوز الزمن له دون إضافة حكم عقائدي خارج السياق.
- source_word: τὴν πρώτην
  choice: الأول
  rationale: الصفة في اليونانية قائمة مقام الاسم، والمقصود من السياق العهد الأول؛ وإبقاء «الأول» دون إضافة الاسم يصون إيجاز الأصل.
- source_word: τὸ ... παλαιούμενον
  choice: ما يتقادم
  rationale: المضارع التشاركي يصوّر عملية مستمرة، و«ما يتقادم» تعبير عربي طبيعي يحافظ أيضًا على الصلة اللفظية بـ«متقادمًا».
- source_word: γηράσκον
  choice: ويشيخ
  rationale: يحفظ صورة التقدّم في السن التي تقوّي معنى التقادم.
- source_word: ἐγγὺς ἀφανισμοῦ
  choice: قريب من الزوال
  rationale: ينقل معنى القرب ومعنى الاختفاء أو التلاشي بعبارة عربية واضحة وموجزة، من غير تشديد المعنى إلى «الهلاك» أو «التدمير».
theological_decisions:
- issue: فاعل «بقوله» المضمر
  choice: أُبقي الفاعل مضمرًا في التركيب «بقوله»
  alternative: حين يقول الله / حين يقول الكتاب
  rationale: الأصل اليوناني لا يسمّي الفاعل هنا، بل يحيل إلى المتكلم في اقتباس إرميا السابق؛ لذلك لا يحدّد النص العربي ما لم يحدده الأصل.
- issue: وضع العهد الأول
  choice: جعل الأول متقادمًا
  alternative: جعل الأول عتيقًا
  rationale: السياق يقرر أن تسمية العهد «جديدًا» تجعل الأول متقادمًا. تحافظ الصياغة على حجة الكاتب من غير توسيعها إلى أحكام أخرى بشأن الشريعة لم يذكرها العدد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «متقادمًا/يتقادم» للمحافظة على الترابط اللفظي في الأصل، و«قريب من الزوال» لصياغة طبيعية غير مثقلة بالمصطلحات. جميع علامات الحواشي واردة في المتن.
