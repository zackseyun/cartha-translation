source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: ar
  text: أما الآن، فقد نال خدمةً أسمى، بقدر ما هو أيضًا وسيطُ عهدٍ أفضل[a]، الذي قد سُنَّ على أساس وعودٍ أفضل[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني الكلمة اليونانية «عهدًا» أو، في بعض السياقات، «وصية»؛ و«عهد» أنسب هنا لأن الآيات التالية تقتبس وعد العهد الجديد في إرميا.
    reason: alternative_reading
  - marker: b
    text: 'أو: «قد أُقيم على وعودٍ أفضل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: أما الآن
  rationale: تنقل المقابلة الزمنية مع خدمة الكهنة الأرضيين المذكورة في السياق، بصياغة عربية طبيعية وموجزة.
- source_word: διαφορωτέρας
  choice: أسمى
  rationale: تفيد المقارنة في الجودة والتفوق، وتلائم أسلوب الرسالة الرفيع من غير إثقال العبارة.
- source_word: τέτυχεν
  choice: فقد نال
  rationale: 'ينقل معنى الفعل التام: حصول تم في الماضي ونتيجته قائمة في الحاضر.'
- source_word: λειτουργίας
  choice: خدمة
  rationale: يدل السياق على الخدمة المقدسة الكهنوتية، لكن لفظ «خدمة» يحافظ على إيجاز الأصل ولا يضيف وصفًا صريحًا مستفادًا من السياق.
- source_word: ὅσῳ καὶ
  choice: بقدر ما هو أيضًا
  rationale: يحفظ البناء التناسبي الذي يربط سمو الخدمة بأفضلية العهد الذي يتوسط فيه.
- source_word: κρείττονός ... διαθήκης
  choice: عهدٍ أفضل
  rationale: «أفضل» تنقل لفظ التفوق المحوري في الرسالة، و«عهد» هو الأنسب لسياق اقتباس وعد العهد الجديد في إرميا.
- source_word: μεσίτης
  choice: وسيط
  rationale: لفظ دقيق وطبيعي لمن يقوم بين طرفين في إطار علاقة العهد.
- source_word: ἥτις
  choice: قد
  rationale: أُعيد مرجع الموصول ضمنيًا في العربية، وجاءت الجملة الوصفية بعد «عهد أفضل» من غير تكرار ثقيل؛ والتذكير في «شُرِّع» عائد إلى العهد.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: على وعودٍ أفضل
  rationale: يحافظ على صورة الأساس التي تفيدها ἐπί مع المجرور، مع وضوح العبارة العربية.
- source_word: νενομοθέτηται
  choice: قد شُرِّع
  rationale: ينقل البعد القانوني للفعل وصيغته المبنية للمجهول، مع الإشارة بـ«قد» إلى تشريع تم وما زال نافذًا.
theological_decisions:
- issue: دلالة διαθήκη في عبرانيين 8:6
  choice: عهد
  alternative: وصية
  rationale: السياق يتجه مباشرة إلى وعد العهد الجديد في إرميا وإلى وساطة المسيح، ولذلك «عهد» هو المعنى الأوضح هنا، مع التنبيه إلى إمكان معنى «وصية» للكلمة في سياقات أخرى.
- issue: القوة القانونية للفعل νενομοθέτηται
  choice: قد شُرِّع
  alternative: قد أُقيم
  rationale: تحفظ الصياغة المختارة الصبغة القانونية التي يحملها الفعل، فيما يبقى «أُقيم» بديلًا صحيحًا أقل تخصيصًا.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ذات نبرة كريمة. حُفظت المقارنات المتتابعة في الأصل: خدمة أسمى، وعهد أفضل، ووعود أفضل. استُخدم «شُرِّع» لصون النبرة القانونية، مع تقديم البديل الأقل تخصيصًا في الحاشية.'
