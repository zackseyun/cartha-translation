source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: ar
  text: 'لأن هذا هو العهد الذي سأقطعه مع بيت إسرائيل بعد تلك الأيام، يقول الرب: واضعًا شرائعي في أذهانهم[a]، وسأكتبها على قلوبهم؛ وسأكون لهم إلهًا، وهم سيكونون لي شعبًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أكثر سلاسة: «سأضع شرائعي في أذهانهم، وسأكتبها على قلوبهم». يستعمل النص اليوناني اسم فاعل بمعنى «واضعًا/معطيًا»، ثم يتبعه فعل مستقبل: «سأكتب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: العهد
  rationale: ينقل المعنى العهدي المستمد من إرميا، لا معنى الوصية التي تُنفَّذ بعد الموت.
- source_word: διαθήσομαι
  choice: سأقطعه
  rationale: تعبير «قطع العهد» عربي فصيح معروف يحافظ على قوة الصيغة العهدية، ويؤدي معنى إنشاء العهد وإبرامه.
- source_word: οἴκῳ Ἰσραήλ
  choice: بيت إسرائيل
  rationale: يحفظ العبارة الجماعية وصداها النبوي في نص إرميا بدل اختزالها إلى «إسرائيل».
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: بعد تلك الأيام
  rationale: ترجمة مباشرة تحفظ الأسلوب الزمني النبوي والإحالة إلى إرميا.
- source_word: κύριος
  choice: الرب
  rationale: يطابق اللفظ اليوناني ويحفظ الصيغة المألوفة في العهد الجديد.
- source_word: διδοὺς
  choice: واضعًا
  rationale: يحافظ على صيغة اسم الفاعل في اليونانية وعلى صورة وضع الشرائع في الأذهان، من غير تسوية التركيب إلى فعل مستقبل.
- source_word: νόμους
  choice: شرائعي
  rationale: يحفظ صيغة الجمع الصريحة ويؤدي معنى القوانين أو الأحكام الإلهية بلفظ عربي طبيعي في السياق الكتابي.
- source_word: διάνοιαν
  choice: أذهانهم
  rationale: ينقل البعد العقلي والإدراكي، مع استعمال الجمع الملائم لضمير الجماعة في العربية.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: على قلوبهم
  rationale: يحفظ حرفية صورة الكتابة على القلوب والتوازي مع نقش الكلام.
- source_word: ἐπιγράψω
  choice: سأكتبها
  rationale: واضح وطبيعي، ويحفظ استعارة الكتابة من غير زيادة تفسيرية.
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: سأكون لهم إلهًا
  rationale: يحفظ تركيب صيغة العهد في اليونانية والعلاقة المتبادلة التي تعبّر عنها.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: هم سيكونون لي شعبًا
  rationale: يحفظ ضمير التوكيد وصيغة العهد، بما فيها التعبير «لي شعبًا» بدل تسوية العلاقة إلى صيغة ملكية فقط.
theological_decisions:
- issue: الحفاظ على الاستمرارية مع اقتباس إرميا وصيغته العهدية
  choice: الإبقاء على «بيت إسرائيل» و«شرائعي» و«على قلوبهم» و«سأكون لهم إلهًا» و«سيكونون لي شعبًا».
  alternative: صياغة تفسيرية حديثة تختصر العبارات العهدية أو تستبدلها بتعبيرات عامة.
  rationale: تنبع القوة اللاهوتية للآية من اقتباس وعد العهد في إرميا؛ لذلك ينبغي إبقاء معالمه اللفظية من غير فرض تفسير مذهبي عليها.
- issue: التركيب المختلط بين اسم الفاعل والفعل المستقبل
  choice: «واضعًا شرائعي في أذهانهم، وسأكتبها...»
  alternative: «سأضع شرائعي في أذهانهم، وسأكتبها...»
  rationale: الأصل اليوناني يستعمل اسم فاعل ثم فعلًا مستقبلًا. يحفظ المتن هذا التفاوت، فيما تورد الحاشية الصياغة العربية الأكثر سلاسة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظت الصيغة العهدية النبوية، كما حُفظ التفاوت النحوي في الأصل بين اسم الفاعل والفعل المستقبل، مع بيان البديل الأسلس في الحاشية.
