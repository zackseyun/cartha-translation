  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: ar
  text: لَا كَالْعَهْدِ الَّذِي قَطَعْتُهُ مَعَ آبَائِهِمْ، يَوْمَ أَمْسَكْتُ بِيَدِهِمْ لِأُخْرِجَهُمْ مِنْ أَرْضِ مِصْرَ[a]؛ لِأَنَّهُمْ لَمْ يَثْبُتُوا فِي عَهْدِي، وَأَنَا أَهْمَلْتُهُمْ[b]، يَقُولُ الرَّبُّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتعبير عربي أكثر اصطلاحية: «أخذتُهم بأيديهم».'
    reason: lexical_alternative
  - marker: b
    text: 'يتبع الاقتباس هنا الصياغة اليونانية الواردة في رسالة العبرانيين: «أهملتُهم». أمّا إرميا 31:32 في النص العبري فله معنى مختلف، ويُترجم غالبًا: «مع أني كنت بعلًا لهم» أو «مع أني كنت سيدهم».'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: الْعَهْدِ
  rationale: «العهد» هو المقابل العربي الطبيعي والدقيق في سياق معاملات الله العهدية، ولا يوحي بمعنى الوصية القانونية.
- source_word: ἐποίησα
  choice: قَطَعْتُهُ
  rationale: «قطع عهدًا» تعبير عربي راسخ وطبيعي يقابل اصطلاح صنع العهد في اليونانية، من غير تغيير لمعناه.
- source_word: πατράσιν
  choice: آبَائِهِمْ
  rationale: يحفظ الدلالة المذكرة الصريحة، ويشير في السياق إلى آباء إسرائيل السابقين.
- source_word: ἐν ἡμέρᾳ
  choice: يَوْمَ
  rationale: ينقل الظرف الزمني الملموس بإيجاز عربي طبيعي.
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: أَمْسَكْتُ بِيَدِهِمْ
  rationale: يحافظ على صورة اليد المفردة وعلى معنى الإمساك، بصياغة عربية واضحة؛ ويمكن فهمها اصطلاحيًا كما توضّح الحاشية.
- source_word: ἐξαγαγεῖν
  choice: لِأُخْرِجَهُمْ
  rationale: ينقل معنى إخراجهم من موضع إلى خارجه، ويلائم صورة الخروج من مصر.
- source_word: γῆς Αἰγύπτου
  choice: أَرْضِ مِصْرَ
  rationale: يحفظ ذكر «الأرض» الصريح في النص اليوناني.
- source_word: ἐνέμειναν
  choice: لَمْ يَثْبُتُوا فِي
  rationale: «ثبتوا في» تعبير عربي طبيعي يفيد الاستمرار والوفاء بالالتزام العهدي، من غير إضافة تفسير عقدي.
- source_word: κἀγὼ
  choice: وَأَنَا
  rationale: يحفظ العطف البسيط في اليونانية ولا يحوّله إلى رابط سببي أقوى مثل «لذلك».
- source_word: ἠμέλησα αὐτῶν
  choice: أَهْمَلْتُهُمْ
  rationale: 'ينقل المعنى المباشر للفعل اليوناني في رسالة العبرانيين: عدم الاكتراث أو الإهمال، مع إبقاء اختلاف النص العبري لإرميا في الحاشية.'
- source_word: λέγει κύριος
  choice: يَقُولُ الرَّبُّ
  rationale: صيغة اقتباس حاضرة وطبيعية، وتحفظ اللقب الإلهي في السياق العهدي.
theological_decisions:
- issue: معنى ἠμέλησα αὐτῶν في اقتباس إرميا 31:32، مع اختلاف اليونانية عن النص العبري
  choice: وَأَنَا أَهْمَلْتُهُمْ
  alternative: «مع أني كنت بعلًا لهم» أو «مع أني كنت سيدهم» بحسب قراءة النص العبري
  rationale: النص اليوناني لرسالة العبرانيين واضح في معنى «أهملتهم»، ولذلك تتبعه الترجمة بوصفه المصدر المباشر، فيما تُحفظ قراءة إرميا العبرية المختلفة في الحاشية لبيان التوتر النصي واللاهوتي من غير تسويته.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «قطع عهدًا» بوصفه اصطلاحًا عربيًا طبيعيًا، وحُفظت صورة الإمساك باليد، كما أُبقي العطف في «وأنا» بلا تقوية سببية. جميع علامتي الحاشيتين [a] و[b] واردتان في المتن.
