  source_fidelity: 'النص العربي ينقل بنية اليونانية ومعناها بأمانة: «لا كالعهد»، و«قطعتُه»، و«آبائهم»، والظرف التاريخي «يوم أمسكت بيدهم»، وغاية الإخراج من «أرض مصر». كما يحفظ «لم يثبتوا في عهدي» معنى ἐνέμειναν، ولا يقوّي العطف في κἀγώ إلى نتيجة سببية. وترجمة «أهملتُهم» مناسبة لـἠμέλησα αὐτῶν في نص العبرانيين نفسه.'
