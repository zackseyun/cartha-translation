base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: ar
  text: فلو كان على الأرض، لما كان كاهنًا أصلًا، إذ إن هناك من يقدّمون التقدمات[a] بحسب الشريعة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العطايا». اللفظ اليوناني يعني حرفيًا «العطايا»، ويُستعمل هنا لما يُقدَّم في العبادة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: فلو
  rationale: تجمع «فـ» الانتقال المنطقي إلى نتيجة السياق، وتدل «لو» بوضوح على الشرط المخالف للواقع من غير إثقال العبارة بأدوات متعددة.
- source_word: ἦν ... οὐδ’ ἂν ἦν
  choice: كان ... لما كان ... أصلًا
  rationale: صيغة «لو... لما...» هي المقابل العربي الطبيعي للشرط المخالف للواقع، و«أصلًا» تنقل توكيد النفي في οὐδέ.
- source_word: ἐπὶ γῆς
  choice: على الأرض
  rationale: تعبير عربي واضح يحفظ التقابل السياقي بين المجال الأرضي والمجال السماوي.
- source_word: ἱερεύς
  choice: كاهنًا
  rationale: المقابل المألوف للوظيفة الكهنوتية في السياق التعبدي.
- source_word: ὄντων τῶν προσφερόντων
  choice: إذ إن هناك من يقدّمون
  rationale: تنقل العبارة الظرفية المطلقة بوصفها تعليلًا، من غير إضافة أن مقدّمي التقدمات «كهنة» صراحةً، لأن اليونانية لا تذكر هذا الاسم هنا.
- source_word: κατὰ νόμον
  choice: بحسب الشريعة
  rationale: تدل على النظام التشريعي الذي ينظم التقدمات الكهنوتية؛ و«الشريعة» واضحة في العربية المعاصرة وتحفظ الإحالة إلى شريعة موسى في السياق.
- source_word: τὰ δῶρα
  choice: التقدمات
  rationale: في السياق الذبائحي تدل الكلمة على ما يُقدَّم لله. «التقدمات» طبيعية ودقيقة، مع إبقاء المعنى الحرفي «العطايا» في الحاشية.
theological_decisions:
- issue: فاعل جملة الشرط المستتر
  choice: إظهاره في صيغة المفرد المذكر المستترة في الفعل «كان»، وإحالته سياقيًا إلى يسوع/المسيح
  alternative: 'إضافة الاسم صراحةً: «فلو كان المسيح على الأرض»'
  rationale: العربية تسمح ببقاء الضمير مستترًا كما في اليونانية، والسياق يعيّن مرجعه؛ لذلك لا حاجة إلى إدخال اسم غير مذكور في الآية.
- issue: قوة جملة الشرط
  choice: 'صياغتها شرطًا مخالفًا للواقع: «فلو كان... لما كان...»'
  alternative: 'صياغة شرط محتمل: «إن كان... فلن يكون...»'
  rationale: تركيب εἰ مع الماضي الناقص، ثم ἄν مع الماضي الناقص في جواب الشرط، يدل هنا على خلاف الواقع. وتحفظ الصياغة العربية قوة الحجة من غير توسيعها لاهوتيًا.
- issue: مدى نفي الكهنوت
  choice: «لما كان كاهنًا أصلًا»
  alternative: «لما كان حتى كاهنًا»
  rationale: 'تنقل «أصلًا» النفي المؤكد المقصود من οὐδέ في عربية سليمة، ولا تفيد إنكار كهنوته مطلقًا، بل ضمن الحالة المفترضة: وجوده على الأرض.'
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «الشريعة» بدل اللفظ التراثي «الناموس»، و«التقدمات» للمصطلح التعبدي، مع تجنب إضافة «الكهنة» إلى جملة لا تصرّح بهم في الأصل.
