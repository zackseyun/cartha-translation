source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: ar
  text: لِأَنَّ كُلَّ رَئِيسِ كَهَنَةٍ يُعَيَّنُ لِيُقَدِّمَ قَرَابِينَ وَذَبَائِحَ، فَلِذَلِكَ يَلْزَمُ أَنْ يَكُونَ لِهَذَا أَيْضًا شَيْءٌ يُقَدِّمُهُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «أن يكون لهذا أيضًا ما يقدِّمه». يترك التعبير اليوناني مرجع «هذا» مفهومًا من السياق؛ والمقصود في السياق هو يسوع بصفته رئيس الكهنة.'
    reason: بديل تعبيري وبيان مرجع ضمني
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: لِأَنَّ كُلَّ رَئِيسِ كَهَنَةٍ
  rationale: تفيد πᾶς مع الاسم المفرد معنى الاستغراق التوزيعي، أي «كل رئيس كهنة»، وتُظهر «لأن» الصلة التفسيرية التي تؤديها γάρ.
- source_word: εἰς τὸ προσφέρειν
  choice: لِيُقَدِّمَ
  rationale: تفيد صيغة εἰς مع المصدر المحلّى غرض التعيين؛ واللام مع المضارع تعبير عربي طبيعي يحفظ معنى الغاية.
- source_word: δῶρά τε καὶ θυσίας
  choice: قَرَابِينَ وَذَبَائِحَ
  rationale: حُفظ التمييز بين فئتي δῶρα وθυσίαι في السياق الكهنوتي. و«قرابين» أوسع من «ذبائح»، ولذلك لا تدمج الفئتين في تعبير واحد.
- source_word: καθίσταται
  choice: يُعَيَّنُ
  rationale: يدل المبني للمجهول هنا على التنصيب أو التعيين في وظيفة كهنوتية، و«يُعيَّن» واضح ودقيق.
- source_word: ὅθεν
  choice: فَلِذَلِكَ
  rationale: تستخلص ὅθεν نتيجة من المبدأ السابق، و«فلذلك» تنقل العلاقة الاستنتاجية بوضوح.
- source_word: ἀναγκαῖον ἔχειν
  choice: يَلْزَمُ أَنْ يَكُونَ لِـ
  rationale: تنقل العبارة معنى الضرورة بصياغة عربية سليمة، مع التعبير عن معنى الامتلاك بواسطة «يكون له».
- source_word: τι
  choice: شَيْءٌ
  rationale: تحفظ «شيء» عدم التحديد في الضمير τι من غير تعيين ماهية التقدمة.
- source_word: καὶ τοῦτον
  choice: لِهَذَا أَيْضًا
  rationale: تحفظ «هذا» قوة اسم الإشارة τοῦτον، وتحفظ «أيضًا» معنى καί، من غير التصريح في المتن بالمرجع الذي يوضحه السياق.
- source_word: ὃ προσενέγκῃ
  choice: شَيْءٌ يُقَدِّمُهُ
  rationale: تحفظ الجملة الموصولة معنى وجود شيء يكون موضوعًا للتقديم، وتؤدي صيغة المضارع العربية المقصود أو الإمكان في هذا السياق بصورة طبيعية.
theological_decisions:
- issue: مرجع اسم الإشارة τοῦτον
  choice: الإبقاء على «هذا» في المتن، مع بيان أن السياق يشير إلى يسوع بوصفه رئيس الكهنة.
  alternative: التصريح بـ«يسوع» أو «المسيح» في المتن.
  rationale: النص اليوناني يستعمل اسم إشارة ولا يسمّي المرجع في هذه الجملة. إبقاء اسم الإشارة يصون صياغة الأصل، بينما يتيح السياق والملحوظة إزالة الالتباس دون إضافة اسم إلى المتن.
- issue: المصطلحان الطقسيان δῶρα وθυσίαι
  choice: قرابين وذبائح
  alternative: تقدمات وذبائح؛ أو قرابين ذبيحية
  rationale: يحافظ الاختيار على فئتين متميزتين ولا يوسع الآية بتفسير عقائدي لطبيعة ما يقدمه المسيح.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة ذات نبرة كتابية رصينة. استُخدم «رئيس كهنة» بوصفه المصطلح المألوف في سياق الرسالة إلى العبرانيين، مع تجنب التفسير العقائدي الزائد والمحافظة على الإشارة الضمنية في الأصل.
