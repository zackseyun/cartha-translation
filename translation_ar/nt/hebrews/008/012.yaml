base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: ar
  text: لِأَنِّي سَأَصْفَحُ عَنْ تَعَدِّيَاتِهِمْ[a]، وَلَنْ أَذْكُرَ خَطَايَاهُمْ بَعْدَ الآنِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «سأكون رحيمًا إزاء آثامهم». تدل الكلمة اليونانية على التعديات أو أعمال الظلم، أما عبارة «سأصفح عن» فتنقل معنى الرحمة والعفو في هذا السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «لن أذكر خطاياهم أبدًا بعد ذلك». النفي في اليونانية مؤكد، وهذا تعبير عهدي عن الغفران التام وعدم المؤاخذة بالخطايا، لا عن زوالها من علم الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لِأَنِّي
  rationale: تؤدي أداة التعليل أو التفسير التي تربط هذه العبارة بوعد العهد السابق، وهي صياغة عربية طبيعية في سياق الاقتباس.
- source_word: ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν
  choice: سَأَصْفَحُ عَنْ تَعَدِّيَاتِهِمْ
  rationale: التركيب اليوناني يدل على إبداء الرحمة والقبول إزاء أخطائهم. و«سأصفح عن» ينقل معنى الرأفة المفضية إلى العفو بعبارة عربية طبيعية، من غير استعمال التركيب الملتبس «سأكون رحيمًا بتعدياتهم». واختير جمع «تعديات» لمراعاة جمع ἀδικίαις ودلالته على أفعال الإثم أو الظلم.
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف بسيط يصل شطري الوعد.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: خَطَايَاهُمْ
  rationale: المقابل العربي الطبيعي لجمع ἁμαρτία، مع الحفاظ على ضمير الملكية.
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: لَنْ أَذْكُرَ ... بَعْدَ الآنِ
  rationale: «لن» مع «بعد الآن» تنقل النفي المستقبلي المؤكد في οὐ μή، وتبقي صورة عدم التذكر كما وردت في النص بدل استبدالها بتفسيرها.
theological_decisions:
- issue: دلالة عدم تذكّر الخطايا
  choice: 'الإبقاء على التعبير الكتابي: «لن أذكر خطاياهم بعد الآن»'
  alternative: التصريح بأنه لن يحاسبهم عليها أو أنه سيغفرها تمامًا
  rationale: السياق عهدي ويفيد العفو الحاسم وعدم مؤاخذتهم بخطاياهم، لكن المتن يحافظ على صورة «التذكّر» ولا يحسمها إلى شرح عقائدي، أما الإيضاح ففي الحاشية.
- issue: دلالة ἵλεως على الرحمة والعفو
  choice: سأصفح عن تعدياتهم
  alternative: سأكون رحيمًا تجاه تعدياتهم
  rationale: البديل الحرفي ثقيل وملتبس في العربية؛ أما «الصفح عن» فيعبّر طبيعيًا عن الرحمة المتجهة إلى العفو، مع بقاء احتمال الترجمة الأقرب إلى المبنى مذكورًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الضبط الجزئي الكامل في نص الآية لتيسير القراءة، مع تجنب التراكيب الحرفية الثقيلة. حافظت الصياغة على التوازي بين «تعدياتهم» و«خطاياهم» وعلى صورة عدم التذكّر.
