  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: ar
  text: فلو كان ذلك العهد الأول بلا عيب، لما طُلِب مجالٌ لعهدٍ ثانٍ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«العهد» غير مذكور صراحةً في اليونانية؛ فحرفيًا: «ذلك الأول»، وقد أُضيف من السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو، حرفيًا: «لما طُلِب موضعٌ لثانٍ»؛ وقد يُفهم «الموضع» بمعنى المجال أو المناسبة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: فلَو
  rationale: الفاء تصل الآية بما قبلها تعليلًا، و«لو» تنقل الشرط المخالف للواقع بصورة طبيعية في العربية.
- source_word: ἡ πρώτη ἐκείνη
  choice: ذلك العهد الأول
  rationale: لفظ «العهد» مقدَّر من السياق، إذ يعود التعبير المؤنث في اليونانية إلى العهد المذكور في الآيات السابقة؛ وإظهاره يوضح المرجع دون إضافة معنى جديد.
- source_word: ἦν ἄμεμπτος
  choice: كان ... بلا عيب
  rationale: ينقل معنى الخلو من موضع للوم أو العيب، مع إبقاء طبيعة العيب غير محددة كما في الأصل.
- source_word: οὐκ ἂν ... ἐζητεῖτο
  choice: لما طُلِب
  rationale: ينقل جواب الشرط المخالف للواقع وصيغة المبني للمجهول بإيجاز عربي واضح.
- source_word: τόπος
  choice: موضعٌ
  rationale: 'يحافظ على الصورة اللفظية في الأصل، مع الإشارة في الحاشية إلى المعنى الاصطلاحي المحتمل: مجال أو مناسبة.'
- source_word: δευτέρας
  choice: لثانٍ
  rationale: يحافظ على إيجاز الأصل، ويُفهم «عهد» من صدر الجملة والسياق.
theological_decisions:
- issue: التصريح بلفظ «العهد» مع أنه مقدَّر في اليونانية
  choice: ذلك العهد الأول
  alternative: ذلك الأول؛ الأول
  rationale: السياق المباشر يقابل بين العهد الأول وعهد ثانٍ، والتصريح بالمرجع يمنع الغموض في العربية من غير إدخال تقرير لاهوتي زائد.
- issue: موضع العيب في العهد الأول
  choice: بلا عيب
  alternative: بلا لوم؛ كاملًا
  rationale: تُبقي الصياغة التوتر القائم في النص ولا تحدد هل العيب في العهد نفسه أم في التعامل معه أو في الشعب؛ فالآية التالية توسع الحجة.
- issue: دلالة «موضع لثانٍ»
  choice: المحافظة على التعبير القريب من الأصل
  alternative: مجال لعهد ثانٍ؛ مناسبة لعهد ثانٍ
  rationale: التعبير قد يدل على موضع أو مجال أو مناسبة. إبقاء «موضع» في المتن والحاشية التي تذكر البدائل يصونان الاتساع الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «فلَو ... لما» لنقل التعليل والشرط المخالف للواقع، مع إبقاء الإيجاز والإضمار في «لثانٍ» قدر الإمكان.
