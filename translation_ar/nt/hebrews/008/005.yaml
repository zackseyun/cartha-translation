source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: ar
  text: 'الذين يؤدّون خدمتهم في ما هو صورةٌ وظلٌّ للأمور السماوية، كما تلقّى موسى إرشادًا إلهيًّا[a] حين كان مزمعًا أن يُتمّ المسكن[b]؛ إذ يقول: «احرص أن تصنع كلَّ شيء بحسب النموذج الذي أُظهر لك على الجبل».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «تلقّى موسى إرشادًا إلهيًّا» إلى «أُنذر موسى» أو «نُبّه موسى بوحي»؛ فالفعل اليوناني قد يشدّد على التحذير أو التنبيه الإلهي.
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «يُتمّ المسكن» إلى «ينشئ المسكن».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: الذين
  rationale: تربط الجملة بالكهنة المذكورين في السياق السابق بعبارة عربية طبيعية، من غير المبالغة في إبراز الدلالة الوصفية المحتملة للاسم الموصول اليوناني.
- source_word: ὑποδείγματι
  choice: صورة
  rationale: تدل هنا على النظير الأرضي المقابل للأمور السماوية. و«صورة» واضحة ولا توحي بأنها نسخة مطابقة تمامًا.
- source_word: σκιᾷ
  choice: ظلّ
  rationale: تحافظ على الاستعارة المميزة في الرسالة، وعلى التباين بين العبادة الأرضية والحقيقة السماوية من غير تحويلها إلى تفسير زمني مثل «تمهيد».
- source_word: λατρεύουσιν
  choice: يؤدّون عبادتهم
  rationale: يبيّن المعنى التعبدي والكهنوتي للفعل بوضوح أكبر من «يخدمون» وحدها في العربية المعاصرة.
- source_word: τῶν ἐπουρανίων
  choice: للأمور السماوية
  rationale: تحفظ سعة المرجع وتعلّقه بكل من «صورة» و«ظلّ»، من غير حصره في موضع سماوي أو تفسيره اصطلاحيًا بأنه «الحقائق».
- source_word: κεχρημάτισται
  choice: تلقّى موسى إرشادًا إلهيًّا
  rationale: ينقل كون مصدر البلاغ إلهيًا مع إبقاء طابعه التوجيهي؛ أما معنى التحذير أو التنبيه فممكن ويُذكر في الحاشية.
- source_word: μέλλων
  choice: كان مزمعًا أن
  rationale: ينقل الدلالة الاستقبالية القريبة للفعل بصورة عربية فصيحة وطبيعية.
- source_word: ἐπιτελεῖν
  choice: يُتمّ
  rationale: يحافظ على معنى الإتمام أو الإنجاز في الفعل، مع إمكان فهمه سياقيًا على إنشاء المسكن وتجهيزه.
- source_word: σκηνήν
  choice: المسكن
  rationale: مصطلح عربي كتابي واضح للمقدس المتنقل في سياق موسى، وأدق سياقيًا من «الخيمة» وحدها.
- source_word: Ὅρα
  choice: احرص
  rationale: ينقل قوة الأمر والتنبيه في الاقتباس بصورة عربية طبيعية، بدل «انظر» التي قد تُفهم حرفيًا على الرؤية.
- source_word: ποιήσεις πάντα
  choice: أن تصنع كل شيء
  rationale: يصوغ المستقبل اليوناني المستعمل للأمر بصيغة عربية أمرية طبيعية بعد «احرص».
- source_word: κατὰ τὸν τύπον
  choice: بحسب النموذج
  rationale: ينقل معنى المثال أو النمط الذي ينبغي أن تُصنع الأشياء على وفقه.
theological_decisions:
- issue: علاقة المقدس الأرضي بالأمور السماوية
  choice: «صورة وظلّ للأمور السماوية»
  alternative: «مثال وظلّ للحقائق السماوية»
  rationale: تحافظ الصياغة على وجود مقابلة حقيقية مع تفوّق السماوي، من غير اختزال الأرضي إلى رمز محض أو تحديد ماهية الأمور السماوية بأكثر مما يقوله النص.
- issue: دلالة κεχρημάτισται
  choice: «تلقّى موسى إرشادًا إلهيًّا»
  alternative: «أُنذر موسى» أو «نُبّه موسى بوحي»
  rationale: الفعل يدل على بلاغ إلهي، وفي السياق توجيه ملزم يحمل نبرة تنبيه. اختيرت عبارة تجمع المصدر الإلهي والتوجيه، مع إثبات احتمال التحذير في الحاشية.
- issue: قوة صيغة ποιήσεις في الاقتباس
  choice: «احرص أن تصنع»
  alternative: «ستصنع كل شيء»
  rationale: المستقبل اليوناني يؤدي هنا وظيفة الأمر في الاقتباس، والصياغة العربية المختارة تنقل القوة الإلزامية بوضوح من غير تغيير مضمون الوصية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعمل «المسكن» بوصفه المصطلح السياقي للمقدس المتنقل، وجاء الاقتباس بصيغة أمر طبيعية. وُضعت علامة الحاشية [a] في المتن، وتجمع البديلين المعجميين المتصلين بالفعلين κεχρημάτισται وἐπιτελεῖν.
