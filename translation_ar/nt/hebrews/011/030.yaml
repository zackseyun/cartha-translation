  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: ar
  text: بِالإِيمَانِ سَقَطَتْ أَسْوَارُ أَرِيحَا بَعْدَ أَنْ طِيفَ حَوْلَهَا سَبْعَةَ أَيَّامٍ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عن طريق الإيمان». فقد تدل صيغة πίστει اليونانية على الوسيلة أو على الكيفية، ويحافظ المتن على العبارة المتكررة المألوفة في عبرانيين 11.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: بِالإِيمَانِ
  rationale: صيغة المجرور اليونانية قد تدل على الوسيلة أو الكيفية. وتحافظ «بالإيمان» على اللازمة المتكررة في عبرانيين 11 من غير إفراط في تحديد العلاقة.
- source_word: τὰ τείχη
  choice: أَسْوَارُ
  rationale: تشير الكلمة إلى أسوار المدينة، و«أسوار» هي المقابل العربي الطبيعي والدقيق في هذا السياق.
- source_word: Ἰεριχὼ
  choice: أَرِيحَا
  rationale: 'الاسم العربي الكتابي الشائع للمدينة، وقد جاء في تركيب الإضافة: «أسوار أريحا».'
- source_word: ἔπεσαν
  choice: سَقَطَتْ
  rationale: مقابل مباشر للفعل اليوناني، ويحافظ على بساطة التعبير من غير تخصيصه بمعنى «انهارت».
- source_word: κυκλωθέντα
  choice: بَعْدَ أَنْ طِيفَ حَوْلَهَا
  rationale: اسم المفعول اليوناني يدل على إحاطة سابقة لسقوط الأسوار. والصياغة المبنية للمجهول تحافظ على تركيز النص في الأسوار من غير تسمية من قاموا بالطواف.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: سَبْعَةَ أَيَّامٍ
  rationale: التركيب الزمني يدل على مدة الطواف، وصياغة «طيف حولها سبعة أيام» طبيعية في العربية وتؤدي امتداد الفعل عبر هذه المدة.
theological_decisions:
- issue: دلالة πίστις في عبرانيين 11:30
  choice: الإيمان
  alternative: الثقة؛ الأمانة
  rationale: سياق الأمثلة في عبرانيين 11 والعبارة المتكررة يرجحان «الإيمان». ولا يقتضي هذا الموضع استبداله بـ«الأمانة»، بينما «الثقة» ممكنة دلاليًا لكنها لا تحفظ اتساق اللازمة بالمقدار نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم المبني للمجهول «طيف حولها» للمحافظة على منظور النص اليوناني، مع إثبات علامة الحاشية [a] في المتن.
