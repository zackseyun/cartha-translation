review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام أمين للنص اليوناني: سارة هي الفاعل، ونيل القدرة مرتبط بالإنجاب رغم تجاوز العمر المعتاد، وسبب ذلك اعتبار الواعد أمينًا. لكن «سارة نفسها أيضًا» لا تؤدي توكيد καὶ αὐτῇ بسلاسة عربية، والحاشية تحتاج إلى لفظ أقرب لمعنى καταβολή.'
  naturalness: التركيب مفهوم وفصيح عمومًا، إلا أن «سارة نفسها أيضًا» متكلف نسبيًا في هذا الموضع. وصيغة «حتى سارة نفسها» أوضح وأقرب إلى توكيد الأصل. كما أن «اعتبرت» أسلس من «عدّت» في العربية المعاصرة، مع بقاء المعنى ذاته.
  terminology: «بالإيمان» و«قدرة» و«نسل» مناسبة. «أمينًا» مقبول في وصف الواعد ويحفظ معنى πιστός، من غير فرض تفسير مذهبي. تُعدَّل الحاشية من «إلقاء زرع» إلى «وضع زرع» لأنها أقرب إلى الصورة المعجمية لـ καταβολή.
  issues:
  - severity: low
    issue: ترتيب العبارة التوكيدية «سارة نفسها أيضًا» غير طبيعي نسبيًا.
    rationale: καὶ αὐτῇ Σάρρᾳ تؤكد إدراج سارة على نحو لافت؛ «حتى سارة نفسها» تؤدي ذلك بوضوح عربي أفضل.
  - severity: low
    issue: صياغة الحاشية «لإلقاء زرع» ليست أقرب مقابِل عربي لـ καταβολὴν σπέρματος.
    rationale: «وضع زرع» يحافظ على غرابة العبارة وصورتها الحرفية دون أن يوحي بفعل مختلف على نحو غير لازم.
