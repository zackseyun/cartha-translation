  to: بِالإِيمَانِ نَالَتْ حَتَّى سَارَةُ نَفْسُهَا قُدْرَةً عَلَى إِنْجَابِ نَسْلٍ[a]، مَعَ أَنَّهَا كَانَتْ قَدْ تَجَاوَزَتْ سِنَّ الإِنْجَابِ، لأَنَّهَا اعْتَبَرَتِ الَّذِي وَعَدَ أَمِينًا.
