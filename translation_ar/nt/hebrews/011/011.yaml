  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: ar
  text: بِالإِيمَانِ نَالَتْ حَتَّى سَارَةُ نَفْسُهَا قُدْرَةً عَلَى إِنْجَابِ نَسْلٍ[a]، مَعَ أَنَّهَا كَانَتْ قَدْ تَجَاوَزَتْ سِنَّ الإِنْجَابِ، لأَنَّهَا اعْتَبَرَتِ الَّذِي وَعَدَ أَمِينًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحرفية أكبر: «لوضع زرع». والعبارة اليونانية غير مألوفة، والمقصود بها في السياق القدرة على إنجاب نسل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: بِالإِيمَانِ
  rationale: صيغة المجرور تفيد الوسيلة، وهي العبارة المتكررة في عبرانيين 11؛ ولفظ «الإيمان» واضح ويحافظ على المصطلح المحوري في السياق.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: سَارَةُ نَفْسُهَا أَيْضًا
  rationale: يحفظ هذا الترتيب توكيد الضمير αὐτῇ وإضافة سارة إلى أمثلة الإيمان السابقة، من غير المبالغة في دلالة المفاجأة.
- source_word: δύναμιν ... ἔλαβεν
  choice: نَالَتْ ... قُدْرَةً
  rationale: ترجمة مباشرة وطبيعية تحفظ معنى تلقّي القدرة، بدل الاكتفاء بصيغة مبنية للمجهول مثل «أُقدرت».
- source_word: εἰς καταβολὴν σπέρματος
  choice: عَلَى إِنْجَابِ نَسْلٍ
  rationale: العبارة اليونانية غير مألوفة وحرفيتها ملتبسة؛ وهذه الصياغة تؤدي معناها الإنجابي في السياق، مع إثبات اللفظ الأقرب إلى الحرفية في الحاشية.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: مَعَ أَنَّهَا كَانَتْ قَدْ تَجَاوَزَتْ سِنَّ الإِنْجَابِ
  rationale: يعبّر النص عن تجاوز الوقت الطبيعي المرتبط بمرحلة العمر. الصياغة العربية واضحة، ويحدد السياق أن المقصود سن الإنجاب.
- source_word: ἐπεὶ
  choice: لأَنَّهَا
  rationale: تدخل سبب نيل سارة القدرة، وتربط الجملة السببية بسلاسة.
- source_word: πιστὸν
  choice: أَمِينًا
  rationale: يحفظ معنى الثبات في الوفاء بالوعد والرنين اللاهوتي للفظ، من غير إضافة تفسير عقائدي.
- source_word: ἡγήσατο
  choice: عَدَّتْ
  rationale: فعل عربي موجز وطبيعي يفيد الحكم والتقدير، وهو ملائم للبناء «عدّت فلانًا أمينًا».
- source_word: τὸν ἐπαγγειλάμενον
  choice: الَّذِي وَعَدَ
  rationale: ينقل اسم الفاعل المعرّف بوضوح، ويبقي المرجع إلى الله ضمنيًا كما في اليونانية.
theological_decisions:
- issue: فاعل الجملة ودلالة العبارة الصعبة المتعلقة بالنسل
  choice: 'سارة هي الفاعل: نالت قدرة على إنجاب نسل.'
  alternative: قد تُفهم العبارة حرفيًا على أنها «إلقاء زرع»، أو قد يُرى فيها دور إبراهيم ضمنًا، أو تأسيس نسل.
  rationale: في نص SBLGNT المعطى، تفيد αὐτῇ Σάρρᾳ على نحو طبيعي أن سارة هي فاعل ἔλαβεν. والسياق يتناول قدرتها المعجزية على الإنجاب رغم العمر، بينما تُحفظ غرابة العبارة الأصلية في الحاشية.
- issue: دلالة πιστός في وصف الله
  choice: أمينًا
  alternative: جديرًا بالثقة / موثوقًا به
  rationale: «أمين» يحفظ معنى الاعتماد على وفائه بالوعد، ويؤدي الثقل اللاهوتي للكلمة دون توسيع المعنى.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل الضبط الجزئي الموسع لضمان القراءة السليمة، مع تجنب التراكيب الكنسية الاصطلاحية الخاصة. حافظت الصياغة على سارة بوصفها الفاعل وعلى غرابة التعبير اليوناني من خلال الحاشية.
