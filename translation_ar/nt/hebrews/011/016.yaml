  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: ar
  text: أمّا الآن فهم يشتاقون إلى وطن أفضل[a]، أي وطن سماوي. لذلك لا يستحي الله أن يُدعى إلههم، لأنه أعدّ لهم مدينة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى موطن أفضل». الصفتان في اليونانية مؤنثتان، ويُرجَّح أنهما تعودان على معنى «الوطن» المفهوم من السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: أمّا الآن
  rationale: أداة انتقال ومقابلة تربط الواقع المذكور بالافتراض السابق في الآية 15؛ وتحافظ «أمّا الآن» على إمكان الدلالة الزمنية والخطابية معًا.
- source_word: κρείττονος
  choice: أفضل
  rationale: تنقل معنى المقارنة، وهو من ألفاظ المقابلة المتكررة في الرسالة إلى العبرانيين.
- source_word: ὀρέγονται
  choice: يشتاقون إلى
  rationale: الفعل يدل على رغبة متطلعة وجادة، و«يشتاقون إلى» يؤدي قوته الوجدانية بصورة طبيعية.
- source_word: κρείττονος ... ἐπουρανίου
  choice: وطن أفضل، أي وطن سماوي
  rationale: الصفتان المؤنثتان في اليونانية تحيلان على الأرجح إلى πατρίδα المفهومة من سياق الآية 14؛ وإظهار «وطن» يوضح الحذف دون تجاوز النص.
- source_word: διὸ
  choice: لذلك
  rationale: تفيد النتيجة المترتبة على اشتياقهم إلى الوطن السماوي.
- source_word: οὐκ ἐπαισχύνεται
  choice: لا يستحي
  rationale: ترجمة مباشرة وطبيعية تحفظ دلالة الخزي أو العار في سياق العلاقة بالله.
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: أن يُدعى إلههم
  rationale: تحفظ صيغة التسمية العلاقية كما وردت، من غير توسيعها إلى شرح عهدي غير مصرح به.
- source_word: ἡτοίμασεν
  choice: أعدّ
  rationale: ينقل الفعل الماضي الدال على أن الله هيأ المدينة لهم، والعربية لا تحتاج هنا إلى تركيب مماثل للمضارع التام الإنجليزي.
- source_word: πόλιν
  choice: مدينة
  rationale: تحافظ على الصورة الأخروية الملموسة، مع إبقاء الاسم نكرة كما في اليونانية.
theological_decisions:
- issue: الاسم المحذوف مع κρείττονος وἐπουρανίου المؤنثتين
  choice: إظهار «وطن» من سياق πατρίδα في الآية 14
  alternative: 'ترك الاسم عامًا: «إلى ما هو أفضل، أي إلى ما هو سماوي»'
  rationale: المطابقة في الجنس النحوي والسياق السابق يرجحان إضمار «وطن». وإظهاره ضروري لوضوح العربية، مع التنبيه إلى إمكان الصياغة العامة.
- issue: الصيغة العلاقية «إلههم»
  choice: الإبقاء على «أن يُدعى إلههم» دون شرح إضافي
  alternative: التفسير بـ«أن يعترف بهم شعبًا له»
  rationale: النص يثبت تسمية الله إلههم تحديدًا؛ أما توسيعها إلى صيغة عهدية كاملة فيتجاوز منطوق العبارة.
- issue: دلالة νῦν δὲ
  choice: «أمّا الآن» بوصفها مقابلة خطابية قد تحمل دلالة زمنية
  alternative: «لكن في الواقع» لنفي الدلالة الزمنية
  rationale: تحفظ الصياغة العربية التوتر بين المعنى الزمني الطبيعي لـνῦν ووظيفته في تقديم الواقع المقابل للافتراض السابق، بدل حسمه بلا ضرورة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «وطن» لملاءمته πατρίς في السياق، مع «موطن» بديلًا في الحاشية. وحُفظت بنية الاستنتاج والصورة الملموسة للمدينة دون إضافة تفسير مذهبي.
