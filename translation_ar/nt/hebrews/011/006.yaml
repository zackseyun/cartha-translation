  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: ar
  text: ومن دون إيمان يستحيل إرضاؤه[a]، لأن من يتقدّم إلى الله لا بد أن يؤمن بأنه موجود[b]، وأنه يجازي الذين يطلبونه باجتهاد[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ثقة». وقد تحمل πίστις في بعض السياقات معنى «الأمانة»، لكن الشرح المباشر هنا يركّز على الإيمان بالله.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا أيضًا: «بأنه كائن». فالعبارة اليونانية موجزة.'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «وأنه مكافئ» أو «وأنه يتبيّن مكافئًا». يقول اليوناني حرفيًا «يصير»، وهو هنا يعبّر عما يتبيّن أن الله عليه تجاه الذين يطلبونه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: ومن دون إيمان
  rationale: χωρίς تفيد الانفصال أو انعدام الشيء، وδέ أداة وصل خفيفة؛ و«ومن دون» تلائم سياق العربية من غير تضخيم معنى المقابلة. و«إيمان» هو المعنى الأنسب هنا لأن الجملة التالية تشرحه بفعل الإيمان.
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: يستحيل إرضاؤه
  rationale: ينقل التركيب غير الشخصي مع المصدر بصياغة عربية طبيعية، والضمير يعود إلى الله المذكور في السياق المباشر.
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: لأن ... لا بد أن يؤمن
  rationale: «لأن» تنقل تعليل γάρ، و«لا بد» تحفظ قوة الضرورة في δεῖ.
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: من يتقدّم إلى الله
  rationale: الفعل προσερχόμενον يدل على الاقتراب أو التقدّم إلى شخص؛ و«يتقدّم إلى الله» واضحة وتحافظ على صورة الاقتراب دون حصرها في معنى طقسي.
- source_word: ὅτι ἔστιν
  choice: بأنه موجود
  rationale: توضح العبارة العربية أن المقصود الإقرار بوجود الله، مع الإشارة في الحاشية إلى الصياغة اليونانية الموجزة «أنه كائن».
- source_word: τοῖς ἐκζητοῦσιν αὐτὸν
  choice: للذين يطلبونه باجتهاد
  rationale: ἐκζητέω أقوى من مجرد ζητέω، ولذلك يعبّر «باجتهاد» عن الطلب الجاد والمواظب من غير مبالغة.
- source_word: μισθαποδότης γίνεται
  choice: يصير مكافئًا
  rationale: يحافظ «يصير» على الفعل γίνεται بدل تسويته تمامًا بفعل الكينونة، و«مكافئًا» ينقل معنى من يمنح الجزاء أو المكافأة. وتوضح الحاشية أن السياق قد يفيد أيضًا أنه يُوجَد أو يَظهر مكافئًا لطالبيه.
theological_decisions:
- issue: دلالة πίστις في سياق عقائدي
  choice: إيمان
  alternative: ثقة؛ أمانة
  rationale: يفسّر السياق الإيمان هنا بفعل πιστεῦσαι، أي التصديق بالله والثقة به؛ لذلك «إيمان» هو الأنسب، مع حفظ البديل المعجمي ذي الصلة في الحاشية دون فرض قراءة مذهبية.
- issue: قوة γίνεται في وصف الله
  choice: يصير مكافئًا
  alternative: هو مكافئ؛ يتبيّن أنه مكافئ
  rationale: اختيار «يصير» يحفظ التوتر اللفظي في اليونانية التي تستعمل γίνεται لا مجرد فعل الكينونة. لا يلزم من ذلك تغير في طبيعة الله؛ فقد يدل السياق على ما يصير الله عليه في خبرة الذين يطلبونه أو ما يتبيّن لهم عنه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي إبقاء صورة التقدّم إلى الله، وقوة الطلب في ἐκζητέω، والتوتر الدلالي في γίνεται. وُزّعت علامات الحواشي عند الألفاظ التي تشرحها مباشرة.
