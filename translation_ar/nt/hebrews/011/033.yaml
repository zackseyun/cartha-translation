lexical_decisions:
- source_word: διὰ πίστεως
  choice: بِالإِيمَانِ
  rationale: تفيد διά مع المضاف إليه الوسيلة التي بها تمت هذه الأفعال. و«بالإيمان» صياغة عربية طبيعية موجزة تحفظ موضوع الأصحاح واستجابة الاتكال على الله.
- source_word: κατηγωνίσαντο
  choice: قَهَرُوا
  rationale: الفعل يدل على الغلبة والإخضاع في صراع؛ و«قهروا» يحفظ القوة العسكرية والسياسية من غير إطالة.
- source_word: βασιλείας
  choice: مَمَالِكَ
  rationale: المقصود كيانات سياسية واقعية بصيغة الجمع، و«ممالك» هو المقابل العربي المباشر والطبيعي.
- source_word: εἰργάσαντο δικαιοσύνην
  choice: عَمِلُوا الْبِرَّ
  rationale: يحفظ التعبير الفعلي في اليونانية، ويؤدي معنى ممارسة ما هو مستقيم أو إنجازه، من غير حصره في المجال القضائي.
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: نَالُوا مَوَاعِيدَ
  rationale: «نالوا» يؤدي معنى الظفر أو الحصول، مع إبقاء «مواعيد» جمعًا كما في المصدر، من غير الجزم بكيفية تحققها أو مداه.
- source_word: ἔφραξαν στόματα λεόντων
  choice: سَدُّوا أَفْوَاهَ أُسُودٍ
  rationale: ترجمة قريبة تحفظ الصورة الحسية القوية، وتوحي بالخلفية الكتابية من غير التصريح بها في المتن.
theological_decisions:
- issue: دلالة πίστις في سلسلة أمثلة عبرانيين 11
  choice: الإيمان
  alternative: الثقة أو الأمانة
  rationale: سياق الأصحاح يصف أفعالًا تمت اعتمادًا على الله؛ لذلك «الإيمان» هو الأنسب، مع عدم إدخال معنى الأمانة وحده في المتن.
- issue: دلالة δικαιοσύνη خارج السياق البولسي
  choice: البر
  alternative: العدل
  rationale: «البر» يحفظ المجال الأخلاقي والعهدي الواسع، بينما «العدل» احتمال سياقي معتبر لكنه قد يضيّق المعنى إلى الجانب القضائي أو الاجتماعي.
- issue: العلاقة بين نيل المواعيد والتوتر اللاحق في الأصحاح
  choice: نالوا مواعيد
  alternative: نالوا ما وُعِدوا به
  rationale: إبقاء الاسم جمعًا يلتزم بنص المصدر ولا يحسم إن كان المقصود تحقق جميع الوعود بصورة نهائية؛ وبذلك يبقى التوتر مع 11:39 محفوظًا.
translation_notes:
  register: عربية فصحى واضحة ذات إيقاع كتابي رصين. استُخدمت أفعال موجزة متوازية للمحافظة على نسق القائمة في اليونانية. لم تُدرج حاشية للمقطع الأخير لأن «بالإيمان» في المصدر يتصدر السلسلة ويشمل الأفعال كلها، وليس هناك غموض نصي مستقل عند «سدوا أفواه أسود» يقتضي تكراره.
