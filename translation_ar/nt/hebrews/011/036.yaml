  text: ἕτεροι δὲ ἐμπαιγμῶν καὶ μαστίγων πεῖραν ἔλαβον, ἔτι δὲ δεσμῶν καὶ φυλακῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: ar
  text: وآخرون ذاقوا محنة السخرية والجلد، بل القيود والسجن أيضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وآخرون خضعوا لاختبار السخرية والجلد، بل القيود والسجن أيضًا». يقول اليوناني حرفيًا على نحو أقرب: «نالوا اختبارًا من...»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: وآخرون
  rationale: تدل على فئة أخرى ضمن سلسلة المؤمنين المتألمين، وتحافظ الواو على اتصالها بما قبلها.
- source_word: ἐμπαιγμῶν
  choice: السخرية
  rationale: تنقل معنى الاستهزاء والإهانة بلفظ عربي حديث وواضح.
- source_word: μαστίγων
  choice: الجلد
  rationale: يشير إلى الضرب بالسياط، و«الجلد» هو المقابل العربي الموجز والمألوف.
- source_word: πεῖραν ἔλαβον
  choice: ذاقوا محنة
  rationale: يحافظ هذا التعبير على صورة الاختبار أو المحنة في الأصل، مع صياغة عربية طبيعية؛ وهو أدق من الاكتفاء بـ«اختبروا» التي قد توهم أنهم هم القائمون بالاختبار.
- source_word: ἔτι δὲ
  choice: بل ... أيضًا
  rationale: تنقل الانتقال التصاعدي إلى صور أخرى من المعاناة.
- source_word: δεσμῶν
  choice: القيود
  rationale: مقابل واضح للوثاق أو السلاسل التي يُقيَّد بها السجين.
- source_word: φυλακῆς
  choice: السجن
  rationale: يفيد هنا حالة الحبس، وهو اللفظ العربي الطبيعي المباشر.
