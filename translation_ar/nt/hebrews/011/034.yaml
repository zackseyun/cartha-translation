  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: ar
  text: أطفأوا قوة النار، ونجوا من حدِّ السيف[a]، وقُوُّوا بعد ضعف، وصاروا أشداء في الحرب، وأجبروا جيوش الغرباء[b] على التراجع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أفواه السيف»، وهو تعبير يعني حدَّ السيف القاطع.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني الكلمة أيضًا «معسكرات»؛ والمقصود هنا القوات العسكرية المعسكرة، أي الجيوش.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν δύναμιν πυρός
  choice: أطفأوا قوة النار
  rationale: يحافظ على صورة الإطفاء وعلى ذكر «قوة» النار صراحة، بدل اختزال العبارة إلى «أطفأوا النار».
- source_word: ἔφυγον στόματα μαχαίρης
  choice: نجوا من حدِّ السيف
  rationale: الفعل يدل في السياق على الإفلات والنجاة، و«أفواه السيف» تعبير تصويري معناه حدّه القاطع؛ فصيغت العبارة بعربية واضحة وطبيعية.
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: قُوُّوا بعدما كانوا ضعفاء
  rationale: صيغة «قُوُّوا» تحفظ دلالة المبني للمجهول، وتعبّر الجملة التابعة بوضوح عن انتقالهم من الضعف إلى القوة من غير تعيين فاعل لم يذكره النص.
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: صاروا أشداء في الحرب
  rationale: «صاروا» تنقل الدخول في حالة جديدة، و«أشداء» تميّز العبارة أسلوبيًا عن «قُوُّوا» مع بقاء معنى القوة والبأس العسكري.
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: أجبروا جيوش الغرباء على التراجع
  rationale: في السياق العسكري تشير παρεμβολαί إلى القوات أو الجيوش، وἔκλιναν يفيد جعلها تنحرف أو ترتد؛ والصياغة العربية توصل معنى إرغامها على الانسحاب من غير المبالغة إلى الإبادة.
theological_decisions:
- issue: طبيعة صور النجاة والانتصار في سلسلة أمثلة الإيمان
  choice: الإبقاء على الصور التاريخية والعسكرية المحسوسة
  alternative: تعميمها بوصفها انتصارًا روحيًا على الأخطار والأعداء
  rationale: يسرد السياق أفعالًا ونجاةً ملموسة مرتبطة بتاريخ المؤمنين؛ لذلك تُركت صور النار والسيف والضعف والحرب والجيوش على معناها المباشر من غير روحنتها.
- issue: مصدر القوة في عبارة المبني للمجهول ἐδυναμώθησαν
  choice: الحفاظ على المبني للمجهول من غير تسمية الفاعل
  alternative: التصريح بأن الله هو الذي قوّاهم
  rationale: قد يفهم القارئ من السياق أن القوة مُنحت لهم، لكن النص اليوناني لا يسمّي الفاعل في هذه العبارة؛ لذا لا تضيف الترجمة اسمًا غير مذكور.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة رصينة وإيقاع متوازٍ يلائم تتابع الأفعال. استُعمل «الغرباء» لإبقاء معنى ἀλλοτρίων، أي المنتمين إلى قوم آخرين أو الأجانب، من غير تحميله توصيفًا قوميًّا أو دينيًّا زائدًا.
