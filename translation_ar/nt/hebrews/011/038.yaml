  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: ar
  text: —هؤلاء الذين لم يكن العالم جديرًا بهم— هائمين في البراري[a] والجبال والمغاور وشقوق الأرض[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأماكن المقفرة».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «فتحات الأرض».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: هؤلاء الذين
  rationale: الضمير الموصول في صيغة الجمع يعود إلى المؤمنين المتألمين المذكورين قبلًا. وصياغة «هؤلاء الذين» توضّح المرجع في العربية مع إبقاء الصلة بالسياق السابق.
- source_word: οὐκ ἦν ἄξιος ὁ κόσμος
  choice: لم يكن العالم جديرًا بهم
  rationale: تنقل العبارة العربية التقويم الأخلاقي القوي في الأصل، وتجعل العالم هو غير الجدير بهؤلاء، من غير توسيع المعنى إلى تقرير عقائدي زائد.
- source_word: ἐπὶ ἐρημίαις
  choice: في البراري
  rationale: حرف الجر مع صيغة المجرور هنا ذو معنى مكاني، و«البراري» تعبير عربي طبيعي عن المواضع الخالية المقفرة، مع إثبات البديل الأوسع في الحاشية.
- source_word: πλανώμενοι
  choice: هائمين
  rationale: تفيد الكلمة التجوال من غير استقرار في سياق المطاردة والحرمان؛ و«هائمين» موجزة وفصيحة وتحافظ على صورة التنقل غير المستقر.
- source_word: ὄρεσι
  choice: الجبال
  rationale: هو المقابل المباشر الطبيعي للكلمة اليونانية، ويلائم تعداد المواضع الوعرة.
- source_word: σπηλαίοις
  choice: المغاور
  rationale: «المغاور» لفظ عربي واضح ودقيق للكهوف التي يُلجأ إليها للاختباء، ويلائم السجل الأدبي الرصين للنص.
- source_word: ὀπαῖς τῆς γῆς
  choice: شقوق الأرض
  rationale: تدل ὀπαῖς على الفتحات أو الثقوب أو الشقوق، وتحدد الإضافة أنها في الأرض. و«شقوق الأرض» طبيعية وتحافظ على الصورة المكانية المحسوسة.
theological_decisions:
- issue: مرجع وقوة عبارة «لم يكن العالم جديرًا بهم»
  choice: الإبقاء عليها حكمًا أخلاقيًا على العالم في مقابل قيمة أولئك المؤمنين
  alternative: فهمها مجرد تعبير محايد عن عدم التوافق بين المؤمنين والعالم
  rationale: الصياغة اليونانية تقويمية صريحة، لا مجرد ملاحظة اجتماعية؛ لذلك حافظت الترجمة على المفارقة والتوتر من غير شرح عقائدي مضاف.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم الاعتراض بين شرطتين للمحافظة على البنية البلاغية، وجاء «هائمين» تابعًا لسياق الآية السابقة كما في الأصل اليوناني. وُضعت علامتا الحاشيتين [a] و[b] في موضعيهما داخل النص.
