source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: ar
  text: بِالإِيمَانِ قَدَّمَ هَابِيلُ لِلَّهِ ذَبِيحَةً أَفْضَلَ مِنْ ذَبِيحَةِ قَايِين[a]، وَبِهَا شُهِدَ لَهُ أَنَّهُ بَارٌّ[b]، إِذْ شَهِدَ اللهُ بِشَأْنِ تَقْدِمَاتِهِ؛ وَبِذَلِكَ[c]، مَعَ أَنَّهُ مَاتَ، لا يَزَالُ يَتَكَلَّمُ.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ذبيحة أعظم من ذبيحة قايين». قد تدل صيغة المقارنة على الأفضلية في النوع أو على العِظَم والمقدار.
    reason: lexical_alternative
  - marker: b
    text: أو «حاز شهادة بأنه بار»؛ أي نال شهادة تؤكد برَّه.
    reason: lexical_alternative
  - marker: c
    text: قد تشير عبارة «وبذلك» إلى إيمان هابيل أو إلى ذبيحته؛ واليونانية لا تحسم المرجع تمامًا.
    reason: alternative_reading
  - marker: d
    text: أو «وهو ميت لا يزال يتكلم». تفيد العبارة اليونانية أن موته سبق استمرار كلامه، ويمكن فهم العلاقة على أنها زمنية أو تنازلية.
    reason: translation_alternative
lexical_decisions:
- source_word: Πίστει
  choice: بِالإِيمَانِ
  rationale: اسم مجرور يفيد الوسيلة؛ ولفظ «الإيمان» هو المقابل الطبيعي في سياق أمثلة الإيمان في عبرانيين 11.
- source_word: πλείονα θυσίαν
  choice: ذَبِيحَةً أَفْضَلَ
  rationale: يحمل اسم التفضيل معنى الزيادة أو التفوق؛ و«أفضل» يلائم المقارنة السياقية من غير إضافة تفسير مثل «أكثر قبولًا».
- source_word: παρὰ Κάϊν
  choice: مِنْ ذَبِيحَةِ قَايِين
  rationale: تدل παρά بعد صيغة المقارنة على معيار المقارنة. أُضيفت «ذبيحة» بالعربية لتجنب الإيحاء بأن المقارنة بين هابيل وقايين نفسيهما.
- source_word: προσήνεγκεν τῷ θεῷ
  choice: قَدَّمَ ... لِلَّهِ
  rationale: «قدّم لله» تعبير عربي طبيعي ودقيق للفعل ذي الاستعمال التعبدي والذبائحي.
- source_word: δι’ ἧς
  choice: وَبِهَا
  rationale: الضمير المؤنث يعود نحويًا على «ذبيحة»، كما يعود الضمير اليوناني على θυσίαν.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: شُهِدَ لَهُ أَنَّهُ بَارٌّ
  rationale: يحفظ لغة الشهادة المحورية في الإصحاح، ويأتي بصياغة عربية مفهومة دون تحويل المعنى إلى مجرد مدح أو استحسان.
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: إِذْ شَهِدَ اللهُ لِتَقْدِمَاتِهِ
  rationale: صيغ التركيب المطلق جملةً حالية، وتُرجمت δῶρα بحسب سياق القرابين إلى «تقدمات» بدل «عطايا» العامة.
- source_word: δι’ αὐτῆς
  choice: وَبِذَلِكَ
  rationale: الصياغة الإشارية غير المحددة تحافظ قدر الإمكان على احتمال رجوع العبارة إلى الإيمان أو الذبيحة، إذ لا تستطيع المطابقة التذكيرية والتأنيثية في العربية إبقاء الاحتمالين بضمير مباشر.
- source_word: ἀποθανὼν ἔτι λαλεῖ
  choice: مَعَ أَنَّهُ مَاتَ، لا يَزَالُ يَتَكَلَّمُ
  rationale: تبرز العبارة قوة المفارقة بين موته واستمرار كلامه، وتحفظ دلالة الاستمرار في ἔτι مع المضارع.
theological_decisions:
- issue: مرجع δι’ αὐτῆς في العبارة الأخيرة
  choice: الإبقاء على المرجع غير محسوم بعبارة «وبذلك»
  alternative: «وبإيمانه» أو «وبذبيحته»
  rationale: يمكن أن يعود الضمير اليوناني إلى إيمان هابيل بوصفه إطار المقطع، أو إلى ذبيحته بوصفها الاسم المؤنث الأقرب؛ فلا ينبغي حسم التوتر النصي.
- issue: دلالة ἐμαρτυρήθη
  choice: «شُهِدَ له أنه بار» مع الحفاظ على حقل الشهادة
  alternative: «زُكِّيَ بأنه بار» أو «حاز شهادة بأنه بار»
  rationale: يتكرر جذر الشهادة في عبرانيين 11، ولذلك حُفظ بدل استبداله بتعبير تفسيري يقتصر على الاستحسان.
- issue: كيفية كلام هابيل بعد موته
  choice: عدم تحديد الآلية في المتن
  alternative: أن يكون المتكلم إيمانه أو ذبيحته أو دمه المذكور في قصة التكوين
  rationale: النص يقول إنه لا يزال يتكلم ولا يشرح هنا كيفية ذلك، فامتنعت الترجمة عن إدخال تفسير لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت «بارّ» للمصطلح الأخلاقي واللاهوتي δίκαιος، و«تقدمات» للجمع δῶρα في السياق التعبدي. حُفظ تكرار لغة الشهادة، كما حُفظ غموض مرجع العبارة الأخيرة بصياغة عربية غير محددة.
