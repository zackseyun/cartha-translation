base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: ar
  text: لِأَنَّهُ كَانَ يَنْتَظِرُ الْمَدِينَةَ الَّتِي لَهَا أُسُسٌ[a]، وَاللهُ هُوَ مُصَمِّمُهَا وَبَانِيهَا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المدينة ذات الأسس». وقد يوحي الجمع بالدوام والثبات.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «صانعها ومنشئها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: كان ينتظر
  rationale: ينقل صيغة الماضي الناقص الدالة على انتظار مستمر في الزمن الماضي، بعبارة عربية طبيعية.
- source_word: γὰρ
  choice: لأنه
  rationale: يحفظ العلاقة التفسيرية مع ما سبق، إذ يبين سبب إقامة إبراهيم في الخيام.
- source_word: τοὺς θεμελίους ἔχουσαν πόλιν
  choice: المدينة التي لها أسس
  rationale: يحافظ على تركيب العبارة وعلى جمع «أسس»، من غير إضافة وصف «السماوية» غير المذكور صراحة في الآية.
- source_word: θεμελίους
  choice: أسس
  rationale: المقابل العربي المألوف الذي يصون صيغة الجمع وما توحي به من الثبات والدوام في مقابل الخيام.
- source_word: πόλιν
  choice: المدينة
  rationale: المقابل الطبيعي في السياق، مع التعريف الذي يناسب المدينة المعروفة المنتظرة أخرويًا.
- source_word: ἧς
  choice: ـها
  rationale: أُديت علاقة الإضافة بضمير يعود إلى المدينة في «مصممها وبانيها»، وهو الأسلوب العربي الطبيعي.
- source_word: τεχνίτης
  choice: مصمم
  rationale: يفيد صاحب المهارة والتخطيط، ويميّزه في هذا الاقتران عن القائم بالبناء.
- source_word: δημιουργός
  choice: باني
  rationale: يناسب صورة المدينة والإنشاء، ويكمل معنى «مصمم» من غير توسيع اللفظ إلى «الخالق».
- source_word: ὁ θεός
  choice: الله
  rationale: الترجمة العربية القياسية لاسم الإله هنا، وهو مبتدأ مؤخر معنويًا جرى إبرازه بضمير الفصل.
theological_decisions:
- issue: ماهية المدينة المنتظرة
  choice: المدينة التي لها أسس
  alternative: المدينة السماوية؛ المدينة ذات الأسس الدائمة
  rationale: لا تسمي الآية المدينة «سماوية» ولا تعرّفها صراحة بأورشليم الجديدة، لذلك تُحفظ صورتها كما وردت دون حسم زائد.
- issue: العلاقة بين τεχνίτης وδημιουργός
  choice: مصممها وبانيها
  alternative: صانعها ومنشئها؛ مهندسها وصانعها
  rationale: يحفظ التعبير دورَي التخطيط والتنفيذ المحتملين في اللفظين، مع الإبقاء على صورة بناء المدينة وعدم تحميل «مهندس» دلالة مهنية حديثة ضيقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «كان ينتظر» لإظهار الاستمرار، وحُفظ جمع «أسس». وُضعت علامتا الحاشيتين بعد العبارتين اللتين تتعلقان بهما مباشرة.
