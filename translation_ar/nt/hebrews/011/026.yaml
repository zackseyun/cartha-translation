  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: ar
  text: عَدَّ عارَ المسيح[a][b] غِنًى أعظمَ من كنوز مصر، لأنه كان يتطلع إلى المكافأة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «المسيح» بوصفه لقبًا؛ فاللفظ اليوناني Χριστοῦ يعني «المسيح».
    reason: alternative_reading
  - marker: b
    text: قد تعني عبارة «عار المسيح» العار الذي احتمله المرء من أجل المسيح، أو العار المشترك مع مسيح الله، أو العار الذي يرى سفر العبرانيين اكتماله في المسيح؛ وقد أُبقي التركيب دون حصره في معنى واحد.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: غِنًى أعظمَ
  rationale: يحافظ على المقارنة الصريحة في اليونانية بين ما عده موسى غنى وبين كنوز مصر، بصياغة عربية موجزة وطبيعية.
- source_word: ἡγησάμενος
  choice: عَدَّ
  rationale: يدل الفعل على التقدير والحكم القيمي؛ وصيغة «عَدَّ» تنقل هذا المعنى بوضوح، مع تحويل اسم الفاعل اليوناني إلى فعل عربي تام يناسب السياق.
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: كنوز مصر
  rationale: ترجمة مباشرة وطبيعية للإضافة اليونانية، وتحفظ المقابلة بين الغنى الحقيقي والكنوز المصرية.
- source_word: τὸν ὀνειδισμὸν
  choice: عارَ
  rationale: يشمل ὀνειδισμός معنى التعيير وما يترتب عليه من خزي اجتماعي؛ و«العار» هنا واضح ومناسب للمقارنة مع الغنى، من غير إضافة تفسيرية.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: Χριστός هنا لقب، ولذلك تُرجم «المسيح». وتُركت علاقة المضاف بالمضاف إليه مفتوحة كما في الأصل.
- source_word: ἀπέβλεπεν
  choice: كان يتطلع إلى
  rationale: تنقل الصيغة الناقصة اليونانية توجّهًا مستمرًا نحو الغاية المنتظرة، وتأتي العبارة طبيعية في العربية المعاصرة.
- source_word: μισθαποδοσίαν
  choice: المكافأة
  rationale: تؤدي المعنى الأساسي، أي الجزاء أو الأجر المقابل، بلغة حديثة واضحة تلائم سياق الإيمان والثبات.
theological_decisions:
- issue: دلالة عبارة «عار المسيح» بالنسبة إلى موسى
  choice: الإبقاء على تركيب «عار المسيح» بلا توسيع تفسيري
  alternative: العار من أجل المسيح؛ أو العار المشترك مع مسيح الله؛ أو العار الذي يرى سفر العبرانيين اكتماله في المسيح
  rationale: الإضافة اليونانية تحتمل أكثر من علاقة دلالية، والنص لا يحددها صراحة. لذلك تحفظ الترجمة العبارة وتوترها اللاهوتي بدل حصرها في تفسير واحد.
- issue: ترجمة Χριστοῦ بوصفه لقبًا
  choice: المسيح
  alternative: المسيح (كاسم عَلَم اصطلاحي دون إبراز معنى اللقب)
  rationale: اللفظ اليوناني يعمل هنا لقبًا ذا دلالة مسيانية، و«المسيح» هو المقابل العربي المباشر والمتداول.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم الفعل الموجز «عَدَّ» وحُفظ تركيب «عار المسيح» من غير شرح داخل المتن، مع نقل الاستمرار في ἀπέβλεπεν بصيغة «كان يتطلع».
