lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: بِهذِهِ
  rationale: تحافظ على اسم الإشارة المؤنث العائد طبيعيًا إلى «الإيمان» في الآية السابقة، وتنقل معنى الوسيلة من غير أن تستبدل المرجع صراحةً في المتن.
- source_word: γὰρ
  choice: فَـ
  rationale: تفيد التعليل والربط التفسيري بما سبق على نحو موجز وطبيعي في العربية.
- source_word: ἐμαρτυρήθησαν
  choice: نَالَ ... شَهَادَةً حَسَنَةً
  rationale: ينقل معنى الفعل المبني للمجهول، أي تلقي شهادة مؤيدة أو حسنة، ويحافظ على الصلة اللفظية بجذر الشهادة من غير حصر المعنى في مفهوم «الاستحسان» وحده.
- source_word: οἱ πρεσβύτεροι
  choice: الْقُدَمَاءُ
  rationale: السياق لا يتحدث عن أصحاب منصب «الشيوخ»، بل عن رجال ونساء الأجيال السالفة الذين سيوردهم الأصحاح أمثلةً؛ و«القدماء» عربية موجزة وطبيعية لهذا المعنى.
theological_decisions:
- issue: مرجع اسم الإشارة ταύτῃ
  choice: أُبقي اسم الإشارة «بهذه» ليرجع طبيعيًا إلى «الإيمان» في الآية السابقة.
  alternative: التصريح بقول «فبالإيمان» أو فهمه على أنه يشير إلى مجمل الحقيقة الموصوفة في 11:1.
  rationale: المؤنث المفرد يطابق πίστις، لكن إبقاء اسم الإشارة يصون صياغة اليونانية ولا يغلق احتمال الإشارة الأوسع إلى ما سبق وصفه.
- issue: طبيعة الشهادة التي نالها القدماء
  choice: «شهادة حسنة» من غير التصريح في المتن بمصدرها.
  alternative: «نالوا رضا الله» أو «شهد الله لهم».
  rationale: سياق الأصحاح يدل على شهادة مؤيدة مرتبطة بالله، لكن الفعل في هذه الآية لا يذكر الفاعل صراحةً؛ لذلك لا يُضاف في المتن ما هو ضمني.
translation_notes:
  register: عربية فصحى واضحة وموجزة ذات نبرة كتابية وقورة. استُخدمت «القدماء» بدل «الشيوخ» لتجنب إيحاء المنصب، وحُفظت صيغة الإشارة في «بهذه» لصون الترابط والغموض المحدود في الأصل.
