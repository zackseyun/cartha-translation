  rationale: ينقل الفعل المبني للمجهول بإيجاز ووضوح، من غير إضافة أنهم ماتوا رجمًا، لأن اللفظ نفسه لا يصرّح بذلك.
- source_word: ἐπρίσθησαν
  choice: نُشِروا بالمناشير
  rationale: يعكس معنى الفعل πρίζω، أي القطع بالمنشار، بصياغة عربية واضحة من غير إضافة «إلى نصفين» غير المذكورة صراحة في اليونانية.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: ماتوا بحدِّ السيف
  rationale: صياغة عربية طبيعية لموتهم قتلًا بالسيف؛ وتُذكر في الحاشية الدلالة الأشد للفظ φόνος كيلا يُطمس معنى القتل العنيف.
- source_word: περιῆλθον
  choice: طافوا
  rationale: يفيد انتقالهم من موضع إلى آخر، ويحافظ على الإيجاز من غير أن يفرض معنى التيه الكامل.
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: لابسين جلود الغنم وجلود الماعز
  rationale: يبيّن الاستعمال اللباسي المقصود من عبارتي الجر بصياغة عربية طبيعية، مع الحفاظ على التوازي.
- source_word: ὑστερούμενοι
  choice: محتاجين
  rationale: ينقل حال الافتقار إلى الضروريات بلغة مفهومة، من غير تضييق المعنى على الفقر المالي وحده.
- source_word: θλιβόμενοι
  choice: مضايَقين
  rationale: يعكس معنى وقوع الضغط والشدة عليهم بصيغة اسم المفعول الموافقة للمبني للمجهول.
- source_word: κακουχούμενοι
  choice: مُساءً إليهم
  rationale: ينقل معنى سوء المعاملة بلغة عربية معاصرة وموقرة، من غير مبالغة تخصّص الإساءة في نوع بعينه.
theological_decisions:
- issue: درجة إظهار شدة عبارة ἐν φόνῳ μαχαίρης
  choice: إيراد «ماتوا بحدِّ السيف» في المتن، مع بيان دلالة القتل العنيف في الحاشية.
  alternative: ماتوا قتلًا بالسيف
  rationale: العبارة اليونانية تتضمن φόνος، فلا ينبغي تسطيح عنفها، لكن «ماتوا بحد السيف» أفصح وأطبع عربيًا؛ لذلك تُحفظ زيادة القوة الدلالية في الحاشية من غير تحميل المتن تركيبًا متكلفًا.
