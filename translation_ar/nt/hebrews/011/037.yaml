  text: رُجِموا، ونُشِروا بالمناشير، وماتوا قتلًا بالسيف[a]؛ وتنقّلوا مرتدين جلود الغنم وجلود الماعز، وهم محتاجون، مضايَقون، يُساء إليهم—
