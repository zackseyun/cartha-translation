  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: ar
  text: اسْتَعَادَتْ نِسَاءٌ مَوْتَاهُنَّ بِالْقِيَامَةِ؛ وَأَمَّا آخَرُونَ فَعُذِّبُوا[a]، إِذْ رَفَضُوا قَبُولَ الإِفْرَاجِ عَنْهُمْ[b]، لِكَيْ يَنَالُوا قِيَامَةً أَفْضَلَ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الفعل اليوناني يدل على تعذيب جسدي قاسٍ، وربما ارتبط بالضرب على آلة أو إطار شبيه بالطبل؛ لكن طريقة التعذيب الدقيقة غير مؤكدة.
    reason: cultural_note
  - marker: b
    text: يمكن أيضًا ترجمة «الإفراج عنهم» بـ«تحريرهم» أو «إنقاذهم». والمقصود هنا على الأرجح إعفاؤهم من التعذيب أو الموت، لا الفداء بالضرورة بمعناه الخلاصي الاصطلاحي.
    reason: lexical_alternative
  - marker: c
    text: تقابل «القيامة الأفضل» عودة الموتى المذكورة أولًا إلى حياة بشرية قابلة للموت؛ وتشير هنا إلى رجاء قيامة أسمى بعد الموت.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλαβον
  choice: نَالَتْ
  rationale: يفيد الفعل هنا أن النساء استعدن موتاهن أحياء، غير أن اقترانه بعبارة «موتاهن بالقيامة» يجعل معنى الاستعادة واضحًا من دون إثقال الأسلوب.
- source_word: γυναῖκες
  choice: نِسَاءٌ
  rationale: اللفظ عام ولا يقتضي تخصيص المعنى بالزوجات.
- source_word: ἐξ ἀναστάσεως
  choice: بِالْقِيَامَةِ
  rationale: الباء تعبّر عربيًا تعبيرًا طبيعيًا عن الوسيلة أو السبب، وتحفظ صلة نوال الموتى بحدوث القيامة.
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: مَوْتَاهُنَّ
  rationale: صياغة عربية موجزة وطبيعية للمفعول الاسمي مع ضمير الملكية، وتشير إلى من ماتوا من ذويهن.
- source_word: ἄλλοι δὲ
  choice: وَأَمَّا آخَرُونَ
  rationale: تبرز «أما» الانتقال التقابلي من أمثلة النجاة واستعادة الحياة إلى مثال الذين ثبتوا تحت العذاب.
- source_word: ἐτυμπανίσθησαν
  choice: فَعُذِّبُوا عَذَابًا شَدِيدًا
  rationale: ينقل جوهر الفعل، وهو التعذيب الجسدي القاسي، من غير الجزم بأداة أو طريقة بعينها لا يحسمها اللفظ.
- source_word: οὐ προσδεξάμενοι
  choice: رَافِضِينَ أَنْ يَقْبَلُوا
  rationale: اسم الفاعل «رافضين» يحفظ تبعية العبارة للفعل السابق، ويبيّن أن إطلاق السراح كان معروضًا عليهم فلم يقبلوه.
- source_word: τὴν ἀπολύτρωσιν
  choice: إِطْلَاقَ سَرَاحِهِمْ
  rationale: السياق يدل على التحرر من التعذيب أو الموت، لا بالضرورة على الفداء بمعناه الخلاصي الاصطلاحي.
- source_word: ἵνα
  choice: لِكَيْ
  rationale: تؤدي معنى الغاية أو القصد بوضوح.
- source_word: κρείττονος ἀναστάσεως
  choice: قِيَامَةً أَفْضَلَ
  rationale: يحافظ «أفضل» على المقارنة التي يكررها سفر العبرانيين، مع إبقاء وجه الأفضلية موجزًا في المتن.
- source_word: τύχωσιν
  choice: يَنَالُوا
  rationale: فعل عربي طبيعي في معنى الحصول أو الظفر، ويلائم المفعول «قيامة».
theological_decisions:
- issue: دلالة ἀπολύτρωσιν في السياق
  choice: إطلاق السراح من التعذيب أو الموت
  alternative: الفداء أو الخلاص بمعناه اللاهوتي الأوسع
  rationale: السياق المباشر يتحدث عن أناس رفضوا مخرجًا معروضًا عليهم من التعذيب كي يظلوا أمناء؛ لذا تتجنب الصياغة تحميل اللفظ معنى خلاصيًا اصطلاحيًا لا يفرضه السياق.
- issue: دلالة «قيامة أفضل»
  choice: قيامة تتفوق على العودة المؤقتة إلى الحياة الفانية
  alternative: قيامة أوفر حظًا من غير إبراز صلتها التقابلية بصدر الآية
  rationale: يبني النص مقابلة بين موتى عادوا إلى الحياة في صدر الآية وبين متألمين رجوا قيامة أفضل، مع عدم تفصيل طبيعة تلك القيامة في المتن بما يتجاوز العبارة اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت صياغة طبيعية مع الحفاظ على التقابل البلاغي بين نوال النساء موتاهن ورفض الآخرين إطلاق سراحهم، وعلى ما في النص من توتر بين النجاة الزمنية ورجاء القيامة الأفضل.
