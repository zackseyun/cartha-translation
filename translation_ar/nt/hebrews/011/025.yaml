  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: ar
  text: إذ اختار أن يعاني سوء المعاملة مع شعب الله، بدلًا من أن تكون له متعة الخطية المؤقتة،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اللذة العابرة المرتبطة بالخطية».'
    reason: بديل معجمي ينقل πρόσκαιρον بمعنى «عابرة» وἀπόλαυσιν بمعنى «لذة»، مع بيان أن الوصف يتعلق باللذة.
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: إذ اختار ... بدلًا من
  rationale: ينقل الاختيار المتعمد والمفاضلة بين البديلين بعبارة عربية طبيعية، مع إبقاء الصلة النحوية بما يسبق الآية.
- source_word: συγκακουχεῖσθαι
  choice: أن يعاني سوء المعاملة مع
  rationale: يحفظ معنى التعرض للأذى ومعنى المشاركة والتضامن اللذين يفيدهما الفعل المركب.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: شعب الله
  rationale: تعبير عربي واضح ومألوف يحافظ على الدلالة الجماعية والإضافية في اليونانية.
- source_word: πρόσκαιρον
  choice: مؤقتة
  rationale: يفيد أن المتعة لا تدوم إلا مدة قصيرة، من غير إضافة تفسير إلى طبيعتها.
- source_word: ἔχειν
  choice: أن تكون له
  rationale: يحافظ على المعنى البسيط للفعل «يكون له/يمتلك» بدل دمجه بالفعل الدال على التمتع.
- source_word: ἁμαρτίας ἀπόλαυσιν
  choice: متعة ... من الخطية
  rationale: يجعل المتعة مرتبطة بالخطية من غير تحديد نوع الخطية أو حصرها في أفعال بعينها.
theological_decisions:
- issue: ماهية الخطية التي تقابل تضامن موسى مع شعب الله
  choice: 'الإبقاء على التعبير عامًا: «متعة مؤقتة من الخطية»'
  alternative: تفسيرها تحديدًا بامتيازات بلاط فرعون أو بالمساومات المرتبطة بمصر
  rationale: النص اليوناني لا يحدد مضمون الخطية، ولذلك لا تحصرها الترجمة في مرجع تاريخي أو أخلاقي أضيق.
translation_notes:
  register: العربية فصحى حديثة، واضحة ورصينة. استُخدمت صيغة «إذ اختار» للمحافظة على كون العبارة تابعة لما قبلها، و«يعاني سوء المعاملة» لتجنب الصياغة المبنية للمجهول الثقيلة مع إبقاء معنى التعرض للأذى.
