  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: ar
  text: بِالإِيمَانِ تَرَكَ مِصْرَ[a]، غَيْرَ خَائِفٍ مِنْ غَضَبِ الْمَلِكِ، لِأَنَّهُ ثَابَرَ كَمَنْ يَرَى مَنْ لَا يُرَى[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير العبارة إلى هروب موسى من فرعون (خروج 2)، أو إلى خروجه من مصر مع بني إسرائيل (خروج 12–14)؛ والعبارة اليونانية لا تحدد أيَّ الحدثين مقصود.
    reason: cross_reference
  - marker: b
    text: 'أو: «غير المنظور». ويمكن أيضًا ترجمتها: «مَن لا يُشاهَد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: بِالإِيمَانِ
  rationale: يحافظ على الصيغة المتكررة في عبرانيين 11، ويؤدي دلالة الحال أو الوسيلة في صيغة المجرور اليونانية.
- source_word: κατέλιπεν
  choice: تَرَكَ
  rationale: ترجمة مباشرة وطبيعية للفعل في هذا السياق، من غير إضافة معنى «هجر» أو «تخلّى عن».
- source_word: Αἴγυπτον
  choice: مِصْرَ
  rationale: الاسم العربي المعياري للموضع.
- source_word: μὴ φοβηθεὶς
  choice: غَيْرَ خَائِفٍ
  rationale: يحفظ ارتباط اسم الفاعل بالفعل الرئيس، ويعبّر بوضوح عن هيئة موسى عند ترك مصر.
- source_word: τὸν θυμὸν τοῦ βασιλέως
  choice: غَضَبِ الْمَلِكِ
  rationale: «غضب» لفظ عربي طبيعي للقوة الانفعالية في θυμός من غير المبالغة التي قد توحي بها «حنق» أو «سخط شديد».
- source_word: τὸν ἀόρατον
  choice: مَنْ لَا يُرَى
  rationale: الصفة اليونانية معرفة ومستعملة استعمال الاسم، وتشير إلى شخص؛ وهذه الصياغة العربية واضحة وتحفظ مفارقة رؤية من لا يُرى.
- source_word: ὡς ὁρῶν
  choice: كَمَنْ يَرَى
  rationale: يحفظ قوة التشبيه في ὡς مع اسم الفاعل، من غير أن يقرر رؤية حسية فعلية أو يحوّل العبارة إلى مجرد افتراض غير واقعي.
- source_word: ἐκαρτέρησεν
  choice: ثَبَتَ
  rationale: ينقل معنى الصمود والاستمرار بثبات، وهو موجز وفصيح وملائم لمواجهة غضب الملك.
theological_decisions:
- issue: الحدث التاريخي المقصود بترك مصر
  choice: تُبقي الترجمة عبارة «ترك مصر» من غير تعيين الحادثة.
  alternative: قد يكون المقصود هروب موسى من فرعون في خروج 2، أو خروجه مع إسرائيل في خروج 12–14.
  rationale: النص اليوناني لا يحدد أي الحدثين مقصود، ولذلك لا تحسم الترجمة الخلاف التفسيري.
- issue: كيفية التعبير عن رؤية غير المرئي
  choice: «كمن يرى من لا يُرى»
  alternative: «كأنه يرى غير المنظور»
  rationale: الصياغة المختارة تحافظ على المفارقة وعلى الإشارة الشخصية في الصفة اليونانية المستعملة اسميًا، من غير تفسير طبيعة الرؤية تفسيرًا عقائديًا زائدًا.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. استُخدمت «ثبت» للدلالة على الصمود والمثابرة، و«مَن لا يُرى» لإبراز المرجع الشخصي مع إبقاء مفارقة رؤية غير المرئي. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحهما كل حاشية.
