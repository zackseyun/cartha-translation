base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: ar
  text: بِالإِيمَانِ أَقَامَ الْفِصْحَ وَرَشَّ الدَّمَ[a]، لِئَلَّا يَمَسَّهُمْ مُهْلِكُ الأَبْكَارِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وَوَضَعَ الدَّمَ». تشير الكلمة اليونانية إلى وضع الدم طقسيًّا؛ و«الرش» تعبير طقسي مألوف، أما «الوضع» فقد يصف بصورة أدق ما جرى عند الفصح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: بِالإِيمَانِ
  rationale: تحافظ على صيغة الوسيلة المتكررة في عبرانيين 11، وتنقل πίστις بمعناها المحوري هنا دون تحويلها إلى «الأمانة».
- source_word: πεποίηκεν τὸ πάσχα
  choice: أَقَامَ الْفِصْحَ
  rationale: الفعل ποιέω مع الفصح يدل هنا على القيام بشعيرته وإجرائها؛ و«أقام الفصح» تعبير عربي طبيعي وأوسع من حصره في الوجبة أو في التأسيس.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: وَرَشَّ الدَّمَ
  rationale: صيغ الفعل لتجنب الثقل في «إقامة رش الدم»، مع إبقاء المعنى الطقسي التقليدي. واللفظة اليونانية قد تدل بصورة أعم على وضع الدم أو صبّه، لذلك حُفظ البديل في الحاشية.
- source_word: ἵνα μὴ
  choice: لِئَلَّا
  rationale: تنقل غرض الفعل مع النفي بإيجاز وفصاحة.
- source_word: ὁ ὀλοθρεύων τὰ πρωτότοκα
  choice: مُهْلِكُ الأَبْكَارِ
  rationale: تحافظ على اسم الفاعل المعرّف وعلى تعلق «الأبكار» به، ولا تضيف تعريفه بأنه ملاك لأن النص اليوناني لا يصرح بذلك.
- source_word: θίγῃ αὐτῶν
  choice: يَمَسَّ ... أَحَدًا مِنْهُمْ
  rationale: «يمس» يقابل المعنى المعجمي المباشر للفعل، وإضافة «أحدًا» لازمة عربيًا لتوضيح أن αὐτῶν مفعول جزئي بعد فعل المس، من غير تسمية الجماعة بما لم يذكره النص صراحة.
theological_decisions:
- issue: هوية فاعل «أقام» المستتر
  choice: الإبقاء عليه ضميرًا مستترًا يعود إلى موسى من السياق
  alternative: التصريح باسم موسى
  rationale: السياق السابق يحدد موسى، لكن اليونانية تواصل الحديث عنه بالفعل وحده؛ لذا لا حاجة إلى إضافة الاسم في الآية.
- issue: معنى πίστις
  choice: الإيمان
  alternative: الثقة أو الأمانة
  rationale: موضوع عبرانيين 11 وصيغته المتكررة يؤيدان «الإيمان»، مع عدم تحميل اللفظة هنا معنى «الأمانة».
- issue: هوية ὁ ὀλοθρεύων
  choice: مُهْلِكُ الأَبْكَارِ
  alternative: ملاك الهلاك
  rationale: النص يصفه بوظيفته ولا يسميه ملاكًا؛ فالإبقاء على الوصف يحفظ مقدار التصريح والأبعاد اللاهوتية كما هي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «أقام الفصح» تعبيرًا طبيعيًا عن إجراء الشعيرة، وحُفظ «يمس» بدل تفسيره بـ«يضرب» أو «يؤذي». تظهر علامة الحاشية [a] في المتن.
