  source_fidelity: 'يحافظ المسودّ على البنية الأساسية للنص: «بالإيمان»، والمبني للمجهول في إخفاء موسى، وسببَي الفعل المذكورين. لكن «بعد ولادته» أوسع زمنيًا من اسم المفعول اليوناني ذي الدلالة الظرفية («حين/عندما وُلد»)، و«أمر الملك» أضعف من دلالة διάταγμα بوصفه مرسومًا أو قرارًا رسميًا.'
  naturalness: الفصحى مفهومة ووقورة، غير أن «أُخفي ... على يد والديه» أقل سلاسة في هذا السياق؛ فـ«أخفاه والداه» طبيعي وواضح. واستعمال المثنى للوالدين عربي سليم.
  terminology: «الإيمان» و«موسى» و«الطفل» و«جميل» مناسبة. والأدق في المقابل الإداري لـδιάταγμα هو «مرسوم الملك» بدل «أمر الملك».
  issues:
