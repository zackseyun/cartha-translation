    issue: «بعد ولادته» بدل الدلالة الزمنية الأقرب لـγεννηθεὶς
    rationale: العبارة العربية قد تفيد أي وقت تالٍ للولادة، بينما المشاركة اليونانية تعني أن الإخفاء وقع حين وُلد/عند ولادته.
  - severity: low
    issue: «على يد والديه» في وصف الفاعل
    rationale: هذه العبارة ممكنة، لكنها أقل طبيعية من إسناد الفعل مباشرة إلى الوالدين في العربية.
  - severity: low
    issue: «أمر الملك» لا يبرز الطابع الرسمي لـδιάταγμα
    rationale: «مرسوم الملك» ينقل بصورة أدق معنى القرار أو الأمر الملكي الرسمي.
