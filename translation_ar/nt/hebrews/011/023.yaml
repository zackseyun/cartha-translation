base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: ar
  text: بِالإِيمَانِ أَخْفَى وَالِدَا مُوسَى مُوسَى، عِنْدَ وِلَادَتِهِ، ثَلَاثَةَ أَشْهُرٍ، لِأَنَّهُمَا رَأَيَا أَنَّ الطِّفْلَ جَمِيلٌ[a]، وَلَمْ يَخَافَا مَرْسُومَ الْمَلِكِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حَسَنٌ» أو «مُمَيَّزٌ». والكلمة اليونانية ἀστεῖον تَرِدُ أيضًا في خروج 2: 2 وأعمال 7: 20.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: بِالإِيمَانِ
  rationale: صيغة الداتيف تفيد الوسيلة، وتفتتح الفكرة المتكررة في عبرانيين 11.
- source_word: Μωϋσῆς
  choice: مُوسَى
  rationale: الصيغة العربية المألوفة للاسم الكتابي.
- source_word: γεννηθεὶς
  choice: بَعْدَ وِلَادَتِهِ
  rationale: اسم الفاعل الأوريستي المبني للمجهول ذو دلالة زمنية؛ وهذه الصياغة العربية الطبيعية تبين أن الإخفاء وقع عقب ولادته.
- source_word: ἐκρύβη
  choice: أُخْفِيَ
  rationale: يحافظ المبني للمجهول على كون موسى هو الذي أخفاه آخرون.
- source_word: τρίμηνον
  choice: ثَلَاثَةَ أَشْهُرٍ
  rationale: منصوب يدل على مدة الإخفاء.
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: عَلَى يَدِ وَالِدَيْهِ
  rationale: مع أن اللفظ اليوناني حرفيًا «آبائه»، فهو يدل هنا على الأب والأم معًا؛ والمثنى العربي ينسجم أيضًا مع الأفعال اليونانية بصيغة الجمع ومع خلفية الخروج.
- source_word: διότι
  choice: لِأَنَّهُمَا
  rationale: تدخل سبب إخفائه، مع استعمال المثنى الطبيعي في العربية للوالدين.
- source_word: εἶδον
  choice: رَأَيَا
  rationale: ينقل فعل الإدراك البصري المباشر، بصيغة المثنى العربية.
- source_word: ἀστεῖον
  choice: جَمِيلٌ
  rationale: ينقل المعنى الظاهر للصفة، مع إمكان دلالتها أيضًا على الحسن أو التميز؛ لذلك أُثبت البديل في الحاشية.
- source_word: τὸ παιδίον
  choice: الطِّفْلَ
  rationale: مقابل مباشر يحافظ على النبرة الوقورة، من غير تضييق المعنى إلى «الرضيع».
- source_word: οὐκ ἐφοβήθησαν
  choice: لَمْ يَخَافَا
  rationale: صياغة عربية طبيعية تحفظ المقابلة بين الإيمان والخوف.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: أَمْرَ الْمَلِكِ
  rationale: يدل διάταγμα على أمر رسمي نافذ؛ و«أمر الملك» واضح وطبيعي، مع إمكان «مرسوم الملك» بوصفه صياغة أشد رسمية.
theological_decisions:
- issue: طبيعة الدافع إلى إخفاء موسى
  choice: يعرض النص فعل الوالدين تحت عنوان الإيمان، ويذكر رؤيتهما أن الطفل جميلًا وعدم خوفهما من أمر الملك.
  alternative: أن جمال الطفل وحده كان الدافع، أو أن هيئته كانت علامة إلهية خاصة.
  rationale: تحفظ الصياغة عناصر الجملة كما هي، من غير أن تجعل مظهر الطفل معجزة أو علامة خاصة لا يصرح بها النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل المثنى للوالدين لأن العربية تقتضيه طبيعيًا، مع أن اليونانية تستعمل الجمع. وُضع موضع الوقف بعد «موسى» لتجنب الإيهام بأن عبارة «بعد ولادته» تعدّل الاسم وحده بدل بيان زمن الإخفاء.
