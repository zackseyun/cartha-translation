lexical_decisions:
- source_word: Πίστει
  choice: بِالإِيمَانِ
  rationale: تحفظ دلالة وسيلة الفعل في صيغة موجزة وطبيعية، وتوافق اللازمة المتكررة في هذا الأصحاح.
- source_word: προσενήνοχεν
  choice: قَدَّمَ
  rationale: المعنى هنا تقديم ذبيحة؛ والفعل العربي «قدَّم» يلائم السياق الذبائحي من غير حاجة إلى تقييد غير وارد مثل «على المذبح».
- source_word: πειραζόμενος
  choice: حِينَ كَانَ يُمْتَحَنُ
  rationale: تُظهر الصيغة الظرفية الزمنية والمبني للمجهول، و«يُمتحن» أنسب من «يُجرَّب» لتجنب إيحاء الإغراء بالشر.
- source_word: μονογενῆ
  choice: ابْنَهُ الْوَحِيدَ الْفَرِيدَ
  rationale: تعبّر عن تفرد إسحاق ومكانته التي لا نظير لها بوصفه ابن الموعد، من غير حصر المعنى في الولادة البيولوجية أو تجاهل وجود إسماعيل.
- source_word: προσέφερεν
  choice: كَانَ ... يُقَدِّمُ
  rationale: تحفظ الجانب غير المكتمل للفعل اليوناني الناقص وتبرز المشهد الجاري، مع تمييزه عن الفعل السابق.
- source_word: ἀναδεξάμενος
  choice: تَلَقَّى
  rationale: صياغة عربية طبيعية تدل على قبول إبراهيم المواعيد التي أُعطيت له.
- source_word: ἐπαγγελίας
  choice: الْمَوَاعِيدَ
  rationale: تحفظ صيغة الجمع وتشير إلى جملة المواعيد الإلهية المعطاة لإبراهيم.
theological_decisions:
- issue: وصف إسحاق بـ μονογενής مع أن لإبراهيم ابنًا آخر
  choice: ابنه الوحيد الفريد
  alternative: ابنه الوحيد؛ ابنه الفريد؛ ابنه الوحيد المولود
  rationale: يجمع التعبير بين شدة التفرد في اللفظة اليونانية ومكانة إسحاق الفريدة بوصفه ابن الموعد، ولا يفرض أن إبراهيم لم يكن له ابن بيولوجي آخر. كما يتجنب استيراد دلالات عقائدية لاحقة لعبارة «الوحيد المولود».
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «يُمتحن» لبيان الاختبار لا الإغراء بالشر، وحُفظ التدرج الأسلوبي بين «قدَّم» و«كان ... يقدّم» بحسب صيغتي الفعل اليونانيتين.
