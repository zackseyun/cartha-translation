    issue: تعبير «ابنه الوحيد الفريد» زائد دلاليًا.
    rationale: μονογενῆ لفظ واحد، ومعناه يدور في هذا السياق حول الوحيد أو الفريد. والجمع بين الوصفين يحوّل الإيضاح التفسيري إلى تأكيد مضاعف في المتن.
  - severity: low
    issue: صياغة الحاشية تجعل «ابنه الوحيد المولود» ترجمة تقليدية على نحو غير دقيق أسلوبيًا بالعربية.
    rationale: يمكن ذكر «الوحيد المولود» بوصفه مقابلاً تقليديًا لعبارة «only begotten»، لكن لا ينبغي تقديمه وكأنه الصياغة العربية التقليدية الوحيدة أو اللازمة؛ والأفضل وصفه بأنه «ترجمة تقليدية محتملة».
