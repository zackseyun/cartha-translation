  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: ar
  text: إذ اعتبر أن الله قادر حتى على أن يقيم من بين الأموات؛ فمن ثمّ استعاد ابنه أيضًا على نحو رمزي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة الأخيرة: «فمن ثمّ استعاده أيضًا في مَثَل». والمعنى أن إبراهيم استعاد إسحاق كما لو كان قد عاد من الموت، لا أنه أُقيم فعلًا من بين الأموات.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενος
  choice: إذ رأى
  rationale: ينقل فعل التفكير والتقدير الداخلي الذي قام به إبراهيم، بصياغة عربية طبيعية لا توحي بمجرد الرؤية الحسية.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: تعبير عربي واضح يحفظ دلالة الجمع في اليونانية وصيغة القيامة.
- source_word: ἐγείρειν
  choice: أن يقيم
  rationale: الفعل المألوف في العربية لسياق الإقامة من الموت.
- source_word: δυνατὸς ὁ θεός
  choice: الله قادر
  rationale: يحفظ الإسناد الاسمي ودلالة قدرة الله القائمة.
- source_word: ὅθεν
  choice: ولذلك
  rationale: 'يفهم هنا على دلالته الاستنتاجية: بناء على هذا الاعتبار استعاد إبراهيم إسحاق؛ وهو أنسب عربيًا من ترجمة مكانية قد توهم أنه قام فعلًا من الأموات.'
- source_word: ἐν παραβολῇ
  choice: على نحو رمزي
  rationale: يحفظ كون استعادة إسحاق مماثلة للقيامة وليست قيامة فعلية، دون فرض تفصيل نمطي بعينه.
- source_word: ἐκομίσατο
  choice: استعاد ابنه
  rationale: ينقل معنى تلقيه إياه من جديد بعد أن كان قد قدمه للموت في قصده؛ وأضيف «ابنه» لتوضيح مرجع الضمير في العربية.
- source_word: καὶ ἐκ νεκρῶν
  choice: حتى على أن يقيم من بين الأموات
  rationale: ترجمة καὶ هنا بـ«حتى» تبرز بلوغ قدرة الله إلى ما يبدو مستبعدًا.
- source_word: καὶ ἐν παραβολῇ
  choice: أيضًا على نحو رمزي
  rationale: تحفظ القيمة الإضافية للأداة الثانية في موضع عربي طبيعي.
theological_decisions:
- issue: طبيعة استعادة إسحاق
  choice: استعاده إبراهيم على نحو رمزي، أي بما يشبه الرجوع من الموت لا بقيامة فعلية.
  alternative: استعاده «في مثل»، مع إبراز البعد التمثيلي أو النمطي.
  rationale: عبارة ἐν παραβολῇ تقرر وجود مماثلة أو دلالة تصويرية، لكنها لا تحدد وحدها كل أبعاد النمط؛ لذا تجنبت الصياغة تقرير تأويل لاهوتي أضيق.
- issue: دلالة ὅθεν
  choice: 'دلالة استنتاجية: «ولذلك».'
  alternative: 'دلالة مصدرية أو مكانية: «ومن هناك» أو «ومن حيث».'
  rationale: كلتا الدلالتين معروفتان للكلمة، لكن الاستنتاج يلائم تسلسل حجة الكاتب ويمنع الإيحاء بأن إسحاق خرج فعلًا من عالم الأموات. ذُكر البديل في الحاشية حفظًا للغموض اللغوي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «على نحو رمزي» بدل «في مَثَل» لأنها أوضح للقارئ المعاصر، مع حفظ الصياغة الأقرب إلى اليونانية في الحاشية. وُضع مؤشر الحاشية بعد الجملة التي يشرحها.
