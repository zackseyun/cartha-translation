    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تحافظ على الصلة التفسيرية بما سبق، وتأتي طبيعية في العربية الفصحى المعاصرة.
- source_word: τοιαῦτα
  choice: مِثْلَ هَذَا
  rationale: تحيل إلى الأقوال السابقة من حيث نوعها، بصياغة عربية واضحة وموجزة.
- source_word: λέγοντες
  choice: الَّذِينَ يَقُولُونَ
  rationale: صيغ اسم الفاعل اليوناني في جملة موصولة عربية تحافظ على دلالته العامة المستمرة.
- source_word: ἐμφανίζουσιν
  choice: يُظْهِرُونَ
  rationale: تنقل معنى جعل الأمر ظاهرًا أو بيّنًا، من غير إضافة تفسير زائد.
- source_word: ὅτι
  choice: أَنَّهُمْ
  rationale: تدخل جملة المحتوى التي يبيّنها كلامهم.
- source_word: πατρίδα
  choice: وَطَنٍ
  rationale: «وطن» لفظ عربي طبيعي يدل على البلاد التي ينتمي إليها الإنسان؛ وجاء نكرة كما في اليونانية، من غير تحديد أرضي أو سماوي في متن هذه الآية.
- source_word: ἐπιζητοῦσιν
  choice: يَسْعَوْنَ إِلَى
  rationale: تفيد طلبًا متواصلًا ومقصودًا، وتحافظ على عنصر السعي الفعلي بدل قصر المعنى على التمنّي.
theological_decisions:
- issue: المقصود بالوطن الذي يطلبه الآباء
  choice: 'إبقاء التعبير عامًا: «وطن»'
  alternative: تحديده بأنه وطن أرضي أو سماوي
  rationale: الآية نفسها لا تحدد نوع الوطن، بينما توضّح الآية التالية أن الرجاء النهائي يتجه إلى وطن أفضل سماوي؛ لذلك لا يُستبق هذا التوضيح في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة الأسلوب. استُعمل «وطن» لسلامته وطبيعته في الاستعمال الحديث، مع إبقاء النكرة والغموض المقصود في هذه الآية، ووُضع مؤشر الحاشية [a] في المتن.
