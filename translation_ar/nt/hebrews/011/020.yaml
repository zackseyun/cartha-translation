  text: بِالإِيمَانِ بَارَكَ إِسْحَاقُ يَعْقُوبَ وَعِيسُو فِيمَا يَتَعَلَّقُ أَيْضًا بِأُمُورٍ آتِيَةٍ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: بِالإِيمَانِ
  rationale: يحافظ على العبارة المحورية المتكررة في هذا الأصحاح وعلى دلالة الوسيلة أو الأساس.
- source_word: καὶ περὶ μελλόντων
  choice: حَتَّى فِيمَا يَتَعَلَّقُ بِالأُمُورِ الْعَتِيدَةِ
  rationale: تُنقل καὶ هنا بوصفها للتوكيد («حتى»)، وتُصاغ περὶ صياغة عربية طبيعية، بينما تدل μελλόντων على أمور لم تقع بعد.
- source_word: εὐλόγησεν
  choice: بَارَكَ
  rationale: المقابل العربي المباشر الذي يصون دلالة التلفظ بالبركة في سياق الآباء.
- source_word: τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ
  choice: يَعْقُوبَ وَعِيسُو
  rationale: يحافظ على ترتيب الاسمين في النص اليوناني من غير إضافة تفسيرية.
theological_decisions:
- issue: صلة الإيمان بالأمور العتيدة
  choice: الإبقاء على أن بركة إسحاق تعلقت بالأمور العتيدة، مع إبرازها بأداة «حتى»
  alternative: «بارك إسحاق يعقوب وعيسو بخصوص أمور عتيدة» من دون أداة توكيد
  rationale: وجود καὶ قبل περὶ μελλόντων يمكن أن يؤدي وظيفة توكيدية، وهو ما يوافق طبقة المراجعة الإنجليزية، من غير تحديد ماهية تلك الأمور أو كيفية تحققها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع تشكيل جزئي كامل للكلمات في نص الآية لتيسير القراءة. لا توجد حاجة إلى حاشية لأن الاختلاف تعبيري لا يغيّر المعنى الجوهري.
