source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: ar
  text: مات هؤلاء جميعًا في الإيمان، من غير أن ينالوا المواعيد، لكنهم رأوها من بعيد وحيَّوها[a]، وأقرّوا بأنهم غرباء ونزلاء[b] على الأرض.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «رحَّبوا بها» أو «عانقوها». يدل الفعل اليوناني على التحية أو الترحيب، ويُستعمل هنا مجازًا في شأن المواعيد التي رأوها من بعيد.
    reason: lexical_alternative
  - marker: b
    text: أو «مقيمون مؤقتون» أو «غرباء مقيمون». يدل اللفظ اليوناني على أناس يقيمون في مكان من غير انتماء كامل أو استقرار دائم فيه.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: على الإيمان
  rationale: يحافظ على معنى الثبات في دائرة الإيمان أو وفقه عند الموت، من غير أن يحصر العبارة في معنى الوسيلة الذي قد توحي به «بالإيمان».
- source_word: ἀπέθανον οὗτοι πάντες
  choice: مات هؤلاء جميعًا
  rationale: ترجمة مباشرة وطبيعية، مع إبقاء الإشارة إلى الأشخاص المذكورين سابقًا.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: من غير أن ينالوا المواعيد
  rationale: «ينالوا» تلائم تحقق المواعيد في العربية، ويُحفظ جمع «المواعيد» الصريح في اليونانية.
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: رأوها من بعيد
  rationale: ينقل الصورة المكانية والاستعارية بوضوح وإيجاز.
- source_word: ἀσπασάμενοι
  choice: حيَّوها
  rationale: يحفظ صورة استقبال المواعيد كما يُحيَّى شخص منظور من بعيد، مع بيان البدائل الدلالية في الحاشية.
- source_word: ὁμολογήσαντες
  choice: أقرّوا
  rationale: ينقل معنى الاعتراف أو التصريح العلني من غير إيحاء لازم باعتراف بالذنب.
- source_word: ξένοι
  choice: غرباء
  rationale: لفظ عربي واضح يدل على عدم الانتماء الكامل إلى المكان.
- source_word: παρεπίδημοί
  choice: نزلاء
  rationale: يدل على الإقامة في موضع من غير استقرار أو انتماء دائم، ويحافظ على التمييز عن «غرباء».
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: يحفظ المعنى الواسع للأرض بوصفها مجال حياة البشر، بدل تخصيصه بأرض أو إقليم بعينه.
theological_decisions:
- issue: دلالة πίστις في وصف حالهم عند الموت
  choice: الإيمان
  alternative: الثقة أو الأمانة
  rationale: السياق يتحدث عن موقفهم الثابت تجاه وعود الله؛ «الإيمان» يحفظ المصطلح المركزي ولا يحسمه في معنى الأمانة وحدها.
- issue: الصورة المجازية في ἀσπασάμενοι والمواعيد مفعول به
  choice: حيَّوها
  alternative: رحّبوا بها أو عانقوها
  rationale: الاختيار يبقي التشخيص المجازي للمواعيد وصلته برؤيتها من بعيد، ولا يحوّل الصورة إلى مجرد قبول ذهني.
- issue: هوية ξένοι وπαρεπίδημοι على الأرض
  choice: غرباء ونزلاء
  alternative: غرباء ومقيمون مؤقتون أو منفيون
  rationale: «نزلاء» تعبّر عن غياب الانتماء المستقر من غير إضافة معنى النفي القسري الذي لا يوجبه اللفظ اليوناني.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. حُفظ تتابع الجمل اليونانية مع تخفيف ثقل التراكيب الحالية، وأُبقيت صورة تحية المواعيد من بعيد وغربة المؤمنين على الأرض من غير تفسير عقائدي زائد.
