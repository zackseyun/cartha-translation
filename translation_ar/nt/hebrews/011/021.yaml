base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: ar
  text: بِالإِيمَانِ بَارَكَ يَعْقُوبُ، وَهُوَ يَحْتَضِرُ، كُلَّ وَاحِدٍ مِنِ ابْنَي يُوسُفَ، وَسَجَدَ مُتَّكِئًا عَلَى رَأْسِ عَصَاهِ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وسجد نحو رأس عصاه». والأرجح أن العبارة تصف هيئة يعقوب أو اتجاه سجوده، لا أن العصا كانت موضوع عبادته.'
    reason: lexical_alternative
  - marker: b
    text: 'يقرأ النص اليوناني هنا «عصاه»، وهو يوافق النص اليوناني القديم لتكوين 47:31؛ أما النص العبري لتكوين 47:31 فيُترجم: «وسجد عند رأس سريره».'
    reason: textual_variant
lexical_decisions:
- source_word: πίστει
  choice: بِالإِيمَانِ
  rationale: 'ترجمة اسم πίστις ترجمة مباشرة، مع فهم صيغة المجرور اليونانية هنا على أنها تفيد الوسيلة أو الكيفية: فعل يعقوب ذلك بالإيمان.'
- source_word: ἀποθνῄσκων
  choice: وَهُوَ يَحْتَضِرُ
  rationale: اسم الفاعل المضارع متزامن مع الفعل الرئيس، و«يحتضر» تعبير عربي طبيعي يدل على دنو الموت واستمرار الحال.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: كُلَّ وَاحِدٍ مِنِ ابْنَي يُوسُفَ
  rationale: تحفظ العبارة قوة التوزيع في ἕκαστον مع المضاف إليه التبعيضي، وتوضح أن البركة شملت كلًّا من الابنين على حدة.
- source_word: εὐλόγησεν
  choice: بَارَكَ
  rationale: المقابل العربي المألوف والمباشر للفعل في سياق بركة يعقوب لابني يوسف.
- source_word: προσεκύνησεν
  choice: سَجَدَ
  rationale: ينقل الفعل الجسدي الدال على التعبد والتوقير من غير إضافة مفعول غير مذكور في اليونانية؛ ويفهم السياق أنه سجود عبادة.
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: مُتَّكِئًا عَلَى رَأْسِ عَصَاهُ
  rationale: صياغة عربية طبيعية للمعنى الأرجح المتعلق بهيئة يعقوب، وتحول دون الإيحاء بأن العصا كانت معبودًا، مع إبقاء البديل الأقرب إلى ظاهر حرف الجر في الحاشية.
theological_decisions:
- issue: علاقة سجود يعقوب بالعصا في العبارة الأخيرة
  choice: سجد يعقوب متكئًا على رأس عصاه.
  alternative: سجد نحو رأس عصاه؛ أو، بحسب النص العبري في تكوين 47:31، سجد عند رأس سريره.
  rationale: نص العبرانيين اليوناني يذكر «العصا»، على الأرجح موافقًا صيغة السبعينية، ولا يصرح بأن العصا هي موضوع السجود. لذلك صيغت العبارة بوصفها هيئة السجود، مع حفظ الاحتمال النحوي وقضية اختلاف صيغة نص التكوين في الحواشي.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية وقورة. استُعمل «يحتضر» بدل تركيب حرفي ثقيل، و«ابني يوسف» لإبراز أن المقصود ابناه كلاهما. وُضعت علامتا الحاشية بعد العبارة التي تتعلقان بها، مع ترتيب الحاشية المعجمية ثم حاشية اختلاف صيغة نص التكوين.
