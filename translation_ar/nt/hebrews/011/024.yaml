  text: By faith Moses[a], when he had grown up, refused to be called the son of Pharaoh’s daughter,
translation:
  language: ar
  text: بِالإِيمَانِ[a] رَفَضَ مُوسَى، لَمَّا كَبُرَ، أَنْ يُدْعَى ابْنَ ابْنَةِ فِرْعَوْنَ،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «بِالأَمَانَةِ» أو «بِالثِّقَةِ»؛ واللفظة اليونانية هي πίστει. يتبع المتن هنا الصيغة المتكررة في هذا الأصحاح: «بِالإِيمَانِ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: بِالإِيمَانِ
  rationale: اسم في حالة المجرور اليونانية يفيد الوسيلة أو الأساس، وهو كذلك الصيغة المتكررة في عبرانيين 11؛ و«بالإيمان» ترجمة عربية واضحة تحفظ هذا التكرار.
- source_word: Μωϋσῆς
  choice: مُوسَى
  rationale: الصيغة العربية المعيارية للاسم.
- source_word: μέγας γενόμενος
  choice: لَمَّا بَلَغَ
  rationale: العبارة الاصطلاحية تدل هنا على بلوغ سن الرشد، لا على اكتساب العظمة أو المكانة؛ و«لما بلغ» موجزة وطبيعية وتحفظ الدلالة الزمنية.
- source_word: ἠρνήσατο
  choice: رَفَضَ
  rationale: الفعل في هذا السياق يدل على رفض متعمد للقب أو الهوية المذكورة بعده.
- source_word: λέγεσθαι
  choice: أَنْ يُدْعَى
  rationale: مصدر مبني للمجهول بعد «رفض»، وترجمته المباشرة الطبيعية هي «أن يُدعى».
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: ابْنَ ابْنَةِ فِرْعَوْنَ
  rationale: يحفظ تتابع الإضافة في اليونانية، ويعبّر عن الهوية الملكية المحددة المنسوبة إلى موسى.
- source_word: Φαραώ
  choice: فِرْعَوْنَ
  rationale: الصيغة العربية المعيارية للقب، وهي مجرورة بالفتحة لأنها ممنوعة من الصرف.
theological_decisions:
- issue: دلالة πίστις في الصيغة المتكررة في عبرانيين 11
  choice: الإيمان
  alternative: الأمانة أو الثقة
  rationale: سياق الأصحاح وصيغته المتكررة يرجحان «بالإيمان»، مع إبقاء إمكان «الأمانة» أو «الثقة» في الحاشية دون حسم ما يحتمله اللفظ اليوناني في ذاته.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «لما بلغ» للدلالة الطبيعية على بلوغ الرشد، وحُفظت الصيغة الإيقاعية المتكررة «بالإيمان». أُثبتت علامة الحاشية [a] في المتن.
