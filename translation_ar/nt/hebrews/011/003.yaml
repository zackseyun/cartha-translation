  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: ar
  text: بِالإِيمَانِ نَفْهَمُ أَنَّ الدُّهُورَ[a] قَدْ نُظِّمَتْ بِكَلِمَةِ اللهِ، بِحَيْثُ إِنَّ مَا يُرَى لَمْ يَأْتِ إِلَى الْوُجُودِ مِنْ أَشْيَاءٍ ظَاهِرَةٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «العوالم» أو «الكون». واللفظ اليوناني هو «الدهور»، ويمكن أن يدل على نظام العالم في امتداده عبر الزمن.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: بِالإِيمَانِ
  rationale: تنقل دلالة وسيلة الإدراك في صيغة موجزة، وتحافظ على العبارة المتكررة في هذا الأصحاح.
- source_word: νοοῦμεν
  choice: نَفْهَمُ
  rationale: يدل الفعل هنا على الإدراك الذهني والفهم، لا على مجرد الإدراك بالحواس.
- source_word: κατηρτίσθαι
  choice: قَدْ نُظِّمَتْ
  rationale: تنقل معنى الإعداد والإحكام ووضع الشيء في نظام ملائم، من غير حصر الفعل في إنشاء المادة وحده؛ وتفيد «قد» الحالة الناتجة عن الفعل التام.
- source_word: τοὺς αἰῶνας
  choice: الدُّهُورَ
  rationale: هي المقابلة الأقرب لـ αἰῶνες، وتحفظ امتداد اللفظ الزمني والكوني، مع بيان البدائل السياقية في الحاشية.
- source_word: ῥήματι θεοῦ
  choice: بِكَلِمَةِ اللهِ
  rationale: صياغة عربية طبيعية تدل على قول الله بوصفه الوسيلة التي تم بها التنظيم.
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: حَتَّى إِنَّ ... لَمْ يَأْتِ إِلَى الْوُجُودِ
  rationale: تعبر عن النتيجة المقصودة في التركيب، وتحافظ على معنى الصيرورة إلى الوجود من غير إضافة مصطلح ميتافيزيقي غير مصرح به.
- source_word: ἐκ φαινομένων
  choice: مِنْ أَشْيَاءَ ظَاهِرَةٍ
  rationale: تحافظ على الإشارة إلى الأشياء التي تظهر أو تكون مرئية، وعلى مقابلتها بما يُرى.
- source_word: τὸ βλεπόμενον
  choice: مَا يُرَى
  rationale: تنقل اسم المفعول اليوناني المستعمل استعمالًا اسميًا بمعنى جمعي واسع يشمل النظام المنظور.
theological_decisions:
- issue: مدى دلالة αἰῶνες في سياق الخلق
  choice: الدُّهُورَ
  alternative: العوالم؛ الكون
  rationale: يحمل اللفظ اليوناني بُعدًا زمنيًا وقد يدل سياقيًا على نظام العالم عبر الزمن. يحفظ اختيار «الدهور» هذا الاتساع بدل قصر الكلام على الكون المادي، وتوضح الحاشية البدائل.
- issue: علاقة الموجودات المنظورة بما هو غير منظور
  choice: عدم التصريح بأن الخلق كان «من العدم»
  alternative: صياغة تنص مباشرة على الخلق من العدم
  rationale: يقرر النص صراحة أن ما يُرى لم ينشأ من أشياء ظاهرة. وهذا ينسجم مع الخلق من العدم، لكن الترجمة لا توسع العبارة اليونانية إلى تقرير عقائدي أشمل مما تقوله صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «نُظِّمَت» بدل «خُلِقَت» للمحافظة على معنى الإعداد والإحكام في κατηρτίζω، مع تجنب ألفاظ قديمة غامضة مثل «أُتقنت» في هذا السياق. وُضع مؤشر الحاشية [a] عقب «الدهور» مباشرة.
