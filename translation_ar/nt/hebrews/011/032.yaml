  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: ar
  text: وماذا أقول أيضًا؟ فلن يكفيني الوقت إن مضيت أروي عن جدعون، وباراق، وشمشون، ويفتاح، وداود، وكذلك صموئيل والأنبياء،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: وماذا أقول أيضًا؟
  rationale: سؤال بلاغي طبيعي في العربية يحافظ على قوة الانتقال إلى أمثلة أخرى.
- source_word: ἐπιλείψει με γὰρ ὁ χρόνος
  choice: فالوقت سيعوزني
  rationale: يحافظ على صيغة المستقبل وعلى معنى أن الوقت لن يكفي المتكلم، بصياغة عربية فصيحة موجزة.
- source_word: διηγούμενον
  choice: إن أخذتُ أروي
  rationale: ينقل معنى الحال المستمرة أو المفترضة في اسم الفاعل اليوناني، دون تحويلها إلى مجرد ذكر عابر.
- source_word: περὶ
  choice: عن
  rationale: حرف عربي طبيعي لتقديم موضوع الرواية.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: جدعون، وباراق، وشمشون، ويفتاح، وداود، وصموئيل
  rationale: استُخدمت الصيغ العربية الكتابية الشائعة للأسماء مع الحفاظ على ترتيب النص اليوناني.
- source_word: τε καὶ
  choice: وكذلك
  rationale: تنقل الإضافة الخفيفة التي تربط داود بصموئيل، من غير إفراط في تفسير العلاقة بين الاسمين.
- source_word: τῶν προφητῶν
  choice: الأنبياء
  rationale: مقابل عربي مباشر يحافظ على دلالة الجماعة وعلى التعريف.
theological_decisions:
- issue: القوة البلاغية لعبارة نفاد الوقت
  choice: فالوقت سيعوزني إن أخذتُ أروي
  alternative: فالوقت يعجز عني وأنا أروي؛ أو لن يكفيني الوقت لأروي
  rationale: تحافظ الصياغة على المستقبل اليوناني وعلى المقصود البلاغي، وهو الاختصار بسبب ضيق الوقت، من غير جعل العبارة ادعاءً حرفيًا بانعدام الوقت.
- issue: ترتيب الأسماء الأخيرة وتجميعها
  choice: وداود، وكذلك صموئيل والأنبياء
  alternative: وداود وصموئيل والأنبياء
  rationale: تحفظ «وكذلك» القوة الإضافية في τε καὶ، مع إبقاء صموئيل مذكورًا على حدة قبل جماعة الأنبياء من غير حسم زائد لطبيعة تصنيفه.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. اختير «سيعوزني» لما فيه من إيجاز ودقة، مع أن «لن يكفيني الوقت» أبسط تداولًا؛ ولم تُضف حاشية لأن الصياغة المختارة تنقل المعنى والمستقبل معًا من غير حاجة إلى بديل تفسيري.
