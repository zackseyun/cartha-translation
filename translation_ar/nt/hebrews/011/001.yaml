lexical_decisions:
- source_word: πίστις
  choice: الإيمان
  rationale: اللفظ هنا يدل على موقف الثقة بالله وبمواعيده، و«الإيمان» هو المقابل العربي المألوف والأدق في هذا السياق.
- source_word: δὲ
  choice: أمّا ... فهو
  rationale: أداة انتقال خفيفة لا تدل بذاتها على الزمن؛ وصيغة «أمّا ... فهو» تنقل الانتقال والتعريف بصورة عربية طبيعية من غير إضافة «الآن».
- source_word: ἐλπιζομένων
  choice: بما يُرجى
  rationale: اسم المفعول اليوناني المستعمل استعمال الاسم يشير إلى مضمون الرجاء؛ وهذه الصياغة موجزة وتحافظ على عموم التعبير.
- source_word: ὑπόστασις
  choice: الثقة
  rationale: للكلمة مجال دلالي يشمل الثبات والضمان والواقع؛ و«الثقة» تلائم السياق التحريضي وتبقي البدائل الممكنة في الحاشية من غير فرض معنى ميتافيزيقي تقني.
- source_word: πραγμάτων
  choice: ما
  rationale: اللفظ عام ويشمل الأشياء والأمور والحقائق؛ واسم الموصول «ما» أفصح وأخف في هذا التركيب العربي.
- source_word: ἔλεγχος
  choice: البرهان
  rationale: ينقل القوة الإثباتية للكلمة، مع بقاء احتمال دلالتها على الدليل أو اليقين الداخلي موثقًا في الحاشية.
- source_word: οὐ βλεπομένων
  choice: ما لا يُرى
  rationale: يحافظ على النفي وعلى صيغة المبني للمجهول، ويعبّر طبيعيًا عن الحقائق غير الواقعة تحت البصر.
theological_decisions:
- issue: معنى ὑπόστασις في عبرانيين 11:1
  choice: الثقة
  alternative: الضمان، أو الأساس، أو الحقيقة
  rationale: السياق يصف فاعلية الإيمان العملية تجاه الموعود به، ولا يقتضي حصر الكلمة في تعريف وجودي تقني؛ لذلك اختير لفظ مفهوم مع إثبات الاتساع الدلالي في الحاشية.
- issue: معنى ἔλεγχος
  choice: البرهان
  alternative: الدليل، أو اليقين
  rationale: اختيار «البرهان» يحفظ الجانب الإثباتي، بينما تبقى إمكانية الإشارة إلى القناعة أو اليقين الناتج من الدليل حاضرة في الحاشية.
- issue: معنى πίστις
  choice: الإيمان
  alternative: الثقة، أو الأمانة
  rationale: لا يوجد هنا تركيب إضافي يثير نزاعًا من نوع «إيمان المسيح»، وسياق الفصل يتناول اعتماد المؤمنين على وعود الله؛ لذا فـ«الإيمان» هو الأنسب.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعملت «أمّا ... فهو» لنقل δέ بوصفها أداة انتقال، وحُفظ التوازي بين «ما يُرجى» و«ما لا يُرى». وُضعت علامتا الحاشية بعد العبارتين اللتين تشرحانهما.
