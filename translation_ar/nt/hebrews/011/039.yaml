  source_fidelity: 'النص العربي أمين لليونانية: «وهؤلاء جميعًا» يحيل إلى المذكورين سابقًا، و«مع أنهم» ينقل العلاقة التنازلية الملحوظة في السياق، و«نالوا شهادة حسنة بالإيمان» يؤدي معنى μαρτυρηθέντες διὰ τῆς πίστεως من غير تعيين غير منصوص عليه لصاحب الشهادة. و«لم ينالوا الوعد» يحافظ على فعل التلقي وعلى «الوعد» المعرّف المفرد دون توسعة تفسيرية.'
  naturalness: الصياغة فصيحة واضحة ومناسبة لسجل الرسالة. ترتيب الجملة وعلامات الوقف طبيعيان، وعبارة «نالوا شهادة حسنة» سليمة ومفهومة في العربية المعاصرة.
