base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: ar
  text: وَهَؤُلَاءِ جَمِيعًا، مَعَ أَنَّهُمْ نَالُوا شَهَادَةً حَسَنَةً بِالإِيمَانِ[a]، لَمْ يَنَالُوا الْوَعْدَ[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شُهِدَ لهم بالإيمان» أو «نالوا القبول بالإيمان». تفيد العبارة اليونانية أنهم تلقّوا شهادة مؤيدة بسبب الإيمان.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لم يحصلوا على الوعد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: أداة ربط بسيطة تصل هذه الخلاصة بسرد أهل الإيمان السابق، من غير إضافة معنى استدراكي غير مصرَّح به.
- source_word: πάντες
  choice: هَؤُلَاءِ جَمِيعًا
  rationale: تُظهر الإحالة إلى جميع الأشخاص المذكورين في السياق السابق بعبارة عربية طبيعية.
- source_word: μαρτυρηθέντες
  choice: مَعَ أَنَّهُمْ نَالُوا شَهَادَةً حَسَنَةً
  rationale: ينقل المبني للمجهول معنى الشهادة المؤيدة لهم، ويُبرز المعنى التنازلي الذي ينشأ سياقيًا مع عبارة «لم ينالوا»، من غير تعيين صاحب الشهادة صراحةً حيث لم يذكره النص.
- source_word: διὰ τῆς πίστεως
  choice: بِالإِيمَانِ
  rationale: الباء تعبّر طبيعيًا عن الوسيلة، وتحافظ على المصطلح المحوري المتكرر في الأصحاح.
- source_word: οὐκ ἐκομίσαντο
  choice: لَمْ يَنَالُوا
  rationale: الفعل في صيغة الوسط يفيد تلقي الشيء أو الحصول عليه؛ و«ينالوا» عربية واضحة تلائم المفعول «الوعد».
- source_word: τὴν ἐπαγγελίαν
  choice: الْوَعْدَ
  rationale: يحافظ على المفرد المعرّف وعلى الإيجاز اللاهوتي في اليونانية، من دون تفسيره في المتن بأنه إتمام الوعد أو الميراث الموعود.
theological_decisions:
- issue: دلالة «الوعد» في السياق
  choice: الوعد
  alternative: الموعود، أو إتمام الوعد، أو الميراث الموعود
  rationale: النص اليوناني يورد العبارة موجزة، وتأتي الآية التالية لتزيد المقصود وضوحًا. لذلك تُحفظ العبارة كما هي بدل حسم ماهية الوعد داخل الترجمة.
- issue: مصدر الشهادة الحسنة
  choice: عدم إضافة «من الله» في المتن
  alternative: نالوا شهادة حسنة من الله
  rationale: السياق قد يدل على أن الله هو الشاهد المؤيد، لكن العبارة اليونانية هنا مبنية للمجهول ولا تسمّيه صراحةً؛ لذا لا يُضاف ما يحسمه النص ضمنًا فقط.
translation_notes:
  register: عربية فصحى واضحة ووقورة. استُخدمت «نالوا شهادة حسنة» لتجنب ركاكة الترجمة الحرفية للمبني للمجهول، مع إبقاء كلتا علامتي الحاشية في المتن.
