id: HEB.11.12
reference: Hebrews 11:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: ar
  text: لِذَلِكَ أَيْضًا، مِنْ رَجُلٍ وَاحِدٍ، وَهُوَ فِي حُكْمِ الْمَيْتِ، وُلِدَ نَسْلٌ كَنُجُومِ السَّمَاءِ فِي الْكَثْرَةِ، وَكَالرَّمْلِ الَّذِي عَلَى شَاطِئِ الْبَحْرِ، لَا يُحْصَى.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تحفظ دلالة الاستنتاج والارتباط بما سبق بصياغة عربية طبيعية.
- source_word: ἀφ’ ἑνὸς
  choice: من رجل واحد
  rationale: صيغة اليونانية مذكرة، والسياق يعيّن إبراهيم؛ والتصريح بـ«رجل» يوضح المرجع دون إضافة مضمون غريب عن النص.
- source_word: ἐγεννήθησαν
  choice: وُلِدَ نسلٌ
  rationale: الفعل مبني للمجهول وجمع في اليونانية، ويشير إلى ظهور الذرية؛ وصياغة «وُلِدَ نسلٌ» عربية واضحة وتحافظ على المعنى الجماعي.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: وهو في حكم الميت
  rationale: تؤدي المعنى المجازي لحالة إبراهيم من جهة القدرة على الإنجاب بسبب تقدمه في السن، من غير أن توهم موته حرفيًا.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: كنجوم السماء في الكثرة
  rationale: تحفظ صورة المقارنة والتعبير الصريح عن الكثرة.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: كالرمل الذي على شاطئ البحر
  rationale: تنقل التعبير الاصطلاحي الطبيعي؛ فـχείλος تعني حرفيًا الحافة أو الشفة، والمقصود هنا شاطئ البحر.
- source_word: ἀναρίθμητος
  choice: لا يُحصى
  rationale: صياغة عربية فصيحة وطبيعية تفيد استحالة العد وتحافظ على نبرة لغة الوعد.
theological_decisions:
- issue: مرجع «من واحد»
  choice: التصريح بأنه «رجل واحد» والمقصود إبراهيم
  alternative: «من واحد» أو «من شخص واحد»
  rationale: الصيغة اليونانية المذكرة والسياق المباشر يحددان إبراهيم، والتوضيح يزيل التباسًا لغويًا من غير إدخال مضمون عقائدي زائد.
- issue: دلالة νενεκρωμένου
  choice: 'مجاز عن حال إبراهيم الذي تجاوز سن الإنجاب: «في حكم الميت»'
  alternative: ميت حرفيًا أو قد أُميت جسديًا
  rationale: السياق يتناول ولادة النسل على نحو معجز رغم شيخوخة إبراهيم وسارة، فلا ينبغي أن توهم الترجمة أن إبراهيم كان ميتًا بالفعل.
translation_notes:
  register: العربية فصحى حديثة، واضحة ومهيبة. حافظت الصياغة على صور نجوم السماء ورمل شاطئ البحر، وعلى التوتر البلاغي في وصف إبراهيم بأنه «في حكم الميت»، مع تجنب الألفاظ القديمة مثل «أُنجبوا» بصيغة قد توهم معنى مختلفًا أو «مولودون» غير الطبيعية في السياق.
