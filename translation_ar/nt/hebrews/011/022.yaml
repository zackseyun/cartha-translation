  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: ar
  text: بِالإِيمَانِ ذَكَرَ يُوسُفُ، وَهُوَ يَقْتَرِبُ مِنْ نِهَايَةِ حَيَاتِهِ[a]، خُرُوجَ بَنِي إِسْرَائِيلَ[b]، وَأَوْصَى بِشَأْنِ عِظَامِهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وهو يموت».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني الكلمة أيضًا «رحيل بني إسرائيل».
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: بِالإِيمَانِ
  rationale: 'يحافظ على اللازمة المتكررة في عبرانيين 11، ويعبّر عن الدلالة الوسيلية لصيغة المجرور: بالإيمان فعل يوسف ذلك.'
- source_word: τελευτῶν
  choice: وَهُوَ يَقْتَرِبُ مِنْ نِهَايَةِ حَيَاتِهِ
  rationale: ينقل معنى اسم الفاعل المصاحب للفعل، أي حين كان يوسف في أواخر حياته، بلغة عربية واضحة؛ وتُذكر الصياغة الأقرب حرفيًا في الحاشية.
- source_word: περὶ τῆς ἐξόδου
  choice: خُرُوجَ
  rationale: «الخروج» هو المقابل العربي الطبيعي والدقيق، ويشير في السياق إلى خروج بني إسرائيل المرتقب من مصر.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: بَنِي إِسْرَائِيلَ
  rationale: تعبير عربي فصيح مألوف يحفظ الصورة العائلية الصريحة في اليونانية، من غير تسويتها إلى مجرد «الإسرائيليين».
- source_word: ἐμνημόνευσεν
  choice: ذَكَرَ
  rationale: مع حرف الجر περὶ يدل الفعل على ذكر الأمر أو التحدث عنه، لا على تذكّره في الباطن فقط.
- source_word: ἐνετείλατο
  choice: أَوْصَى
  rationale: تلائم وصية يوسف المتعلقة بما ينبغي فعله بعظامه، وتنقل معنى إصدار توجيه ملزم بصورة طبيعية في العربية.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: بِشَأْنِ عِظَامِهِ
  rationale: يحفظ اللفظ الحسي الصريح «عظامه» بدل تعميمه إلى «رفاته»، ويعبّر طبيعيًا عن περὶ.
theological_decisions:
- issue: دلالة πίστις في عبرانيين 11
  choice: الإيمان
  alternative: الأمانة أو الثقة
  rationale: صيغة الفصل المتكررة «بالإيمان» تجعل «الإيمان» القراءة الأنسب هنا، مع عدم تحويلها إلى «الأمانة» بما قد يغيّر محور العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «بني إسرائيل» للمحافظة على التعبير النسبي في الأصل، و«أوصى» لملاءمته سياق وصية يوسف بشأن عظامه. وُضعت علامتا الحاشيتين في المتن عند موضعي البديلين المعجميين.
