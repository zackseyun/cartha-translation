  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: ar
  text: بالإيمان، أطاع إبراهيم حين دُعي إلى الخروج إلى مكان كان سيحصل عليه ميراثًا، فخرج وهو لا يعلم إلى أين كان ذاهبًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: بالإيمان
  rationale: اسم في حالة المجرور الدال على الوسيلة؛ و«بالإيمان» تعبير عربي طبيعي يحفظ كون الإيمان أساس استجابة إبراهيم.
- source_word: καλούμενος
  choice: حين دُعي
  rationale: اسم فاعل مضارع مبني للمجهول ذو دلالة ظرفية، وترجمته بهذه الصيغة تحفظ معنى الدعوة من غير تحديد زائد لتسلسل الأحداث.
- source_word: ὑπήκουσεν ἐξελθεῖν
  choice: أطاع ... أن يخرج
  rationale: يحفظ معنى الطاعة وعلاقة المصدر بالفعل، وهو تركيب عربي فصيح وطبيعي يبين أن مضمون الطاعة هو الخروج.
- source_word: τόπον
  choice: مكان
  rationale: المقصود وجهة لم تكن محددة لإبراهيم آنذاك؛ والتنكير مناسب للسياق ولا يضيف تعريفًا غير لازم.
- source_word: ἤμελλεν λαμβάνειν
  choice: كان سيحصل عليه
  rationale: ينقل دلالة المستقبل في μέλλω مع المصدر من غير أن يضيف معنى حتميًا أو قدريًا أقوى من النص.
- source_word: εἰς κληρονομίαν
  choice: ميراثًا
  rationale: يؤدي معنى حصول المكان بصفة ميراث، بصياغة عربية موجزة وطبيعية.
- source_word: ἐξῆλθεν
  choice: فخرج
  rationale: يحافظ على تكرار جذر الخروج الوارد أولًا في ἐξελθεῖν، وتفيد الفاء توالي الاستجابة في السياق.
- source_word: μὴ ἐπιστάμενος ποῦ ἔρχεται
  choice: وهو لا يعلم إلى أين يذهب
  rationale: ينقل الحال المصاحبة والنفي، ويترجم فعل الحركة بحسب وجهة النظر التي يقتضيها السياق العربي.
theological_decisions:
- issue: دلالة πίστις في استجابة إبراهيم
  choice: الإيمان
  alternative: الثقة أو الأمانة
  rationale: السياق يبرز اعتماد إبراهيم على دعوة الله واستجابته لها؛ و«الإيمان» يحفظ المصطلح المركزي في الإصحاح من غير اختزاله في الأمانة السلوكية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ تكرار «يخرج/فخرج» بوصفه ملمحًا أسلوبيًا في اليونانية، واستُعملت صياغة مباشرة من غير إدخال اسم الله، إذ إن فاعل الدعوة غير مصرّح به في الآية نفسها.
