base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: ar
  text: بِالإِيمَانِ لَمْ تَهْلِكْ رَاحَابُ الْعَاهِرَةُ مَعَ الَّذِينَ عَصَوْا، إِذِ اسْتَقْبَلَتِ الْجَاسُوسَيْنِ بِسَلَامٍ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنها استقبلت الجاسوسين بسلام».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: بِالإِيمَانِ
  rationale: تنقل دلالة اسم πίστις وصيغة الداتيف الدالة على الوسيلة أو الأساس، وتحافظ على العبارة المتكررة في عبرانيين 11.
- source_word: Ῥαὰβ
  choice: رَاحَابُ
  rationale: الصيغة العربية الكتابية المستقرة للاسم الشخصي.
- source_word: ἡ πόρνη
  choice: الْعَاهِرَةُ
  rationale: لفظ عربي واضح ومباشر ينقل معنى πόρνη من غير تلطيف، وهو أنسب للسجل الكتابي الفصيح من ألفاظ عامية أو تعبيرات مطولة.
- source_word: οὐ συναπώλετο
  choice: لَمْ تَهْلِكْ ... مَعَ
  rationale: يفكك معنى الفعل المركب συναπόλλυμι طبيعيًا في العربية إلى الهلاك مع آخرين، مع إبقاء فكرة المصير المشترك المنفي.
- source_word: τοῖς ἀπειθήσασιν
  choice: الَّذِينَ عَصَوْا
  rationale: ينقل المعنى الأخلاقي الإرادي للفعل ἀπειθέω بوصفه عصيانًا، من غير اختزاله في عدم التصديق وحده.
- source_word: δεξαμένη
  choice: لِأَنَّهَا اسْتَقْبَلَتْ
  rationale: يفهم اسم الفاعل الأوريستي هنا على أنه يبين سبب نجاتها أو الظرف المرتبط بها؛ وصيغة السبب طبيعية في العربية، مع التنبيه في الحاشية إلى إمكان إبقاء العلاقة الظرفية.
- source_word: τοὺς κατασκόπους
  choice: الْجَاسُوسَيْنِ
  rationale: السياق في يشوع يبين أن المرسلين اثنان، والعربية تستلزم إظهار التثنية؛ ولفظ الجاسوسين هو المقابل المألوف الواضح.
- source_word: μετ’ εἰρήνης
  choice: بِسَلَامٍ
  rationale: يحافظ على الصورة الاصطلاحية لعبارة «مع سلام» في صياغة عربية طبيعية، ويدل على حسن الاستقبال وعدم العداء.
theological_decisions:
- issue: دلالة πίστις في صيغة أمثلة عبرانيين 11
  choice: الإيمان
  alternative: الثقة أو الأمانة
  rationale: السياق يقدّم راحاب مثالًا ضمن السلسلة التي تبدأ بـπίστει؛ و«الإيمان» هو المقابل العربي الأوضح والأكثر اتساقًا، بينما قد توحي «الأمانة» بصفة السلوك وحدها.
- issue: العلاقة المنطقية لاسم الفاعل δεξαμένη
  choice: 'سببية: «لأنها استقبلت»'
  alternative: 'ظرفية: «إذ استقبلت» أو «بعدما استقبلت»'
  rationale: السياق يسمح بفهم استقبال الجاسوسين دليلًا عمليًا على إيمانها وسببًا مرتبطًا بعدم هلاكها، لكن صيغة اليونانية نفسها موجزة ولا تصرح بأداة سببية؛ لذلك حُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «العاهرة» بلا تلطيف لمعنى الأصل، و«الجاسوسين» بالتثنية وفق المرجع القصصي. وُضعت علامة الحاشية [a] في المتن بعد الجملة التي تتعلق بها.
