source:
  edition: SBLGNT
  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: ar
  text: بِالإِيمَانِ عَبَرُوا الْبَحْرَ الأَحْمَرَ كَمَا لَوْ كَانُوا يَعْبُرُونَ فِي أَرْضٍ يَابِسَةٍ[a]، وَإِذْ حَاوَلَ الْمِصْرِيُّونَ ذَلِكَ، ابْتُلِعُوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بحر القصب». يرد في النص اليوناني هنا «البحر الأحمر» (Ἐρυθρὰ Θάλασσα)، بينما يُفهم اسم الموضع العبري في رواية الخروج أحيانًا بمعنى «بحر القصب».'
    reason: بيان البديل المعجمي والخلفية المتعلقة باسم الموضع، مع إبقاء الترجمة الصريحة للعبارة اليونانية في المتن.
lexical_decisions:
- source_word: Πίστει
  choice: بِالإِيمَانِ
  rationale: اسم في حالة المجرور الأداتي، يبيّن الوسيلة أو الأساس. واختيار «الإيمان» يحافظ على العبارة المتكررة التي تنظّم أمثلة عبرانيين 11.
- source_word: διέβησαν
  choice: عَبَرُوا
  rationale: فعل يدل على الاجتياز من جانب إلى آخر، و«عبروا» تعبير عربي طبيعي ودقيق.
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: الْبَحْرَ الأَحْمَرَ
  rationale: هذا هو المدلول الصريح للعبارة اليونانية في الآية. يُذكر البديل المرتبط باسم الموضع في سفر الخروج في الحاشية دون إحلاله محل نص المصدر اليوناني.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: كَأَنَّهُمْ يَعْبُرُونَ فِي أَرْضٍ يَابِسَةٍ
  rationale: يحفظ معنى المقارنة في ὡς ومعنى المرور عبر أرض يابسة، بصياغة عربية واضحة.
- source_word: ἧς πεῖραν λαβόντες
  choice: وَلَمَّا حَاوَلَ الْمِصْرِيُّونَ أَنْ يَعْبُرُوهُ
  rationale: العبارة الاصطلاحية πεῖραν λαμβάνειν تعني الإقدام على المحاولة. والضمير يعيد المحاولة إلى عبور البحر نفسه بصياغة عربية غير متكلّفة.
- source_word: οἱ Αἰγύπτιοι
  choice: الْمِصْرِيُّونَ
  rationale: تسمية مباشرة للجماعة المصرية التي حاولت العبور في سياق الخروج.
- source_word: κατεπόθησαν
  choice: ابْتَلَعَهُمُ الْبَحْرُ
  rationale: يحفظ الصورة الحية للفعل اليوناني «ابتلع»، مع تحويل المبني للمجهول إلى تركيب عربي فصيح واضح يصرّح بالفاعل المفهوم من السياق.
theological_decisions:
- issue: دلالة πίστις في عبرانيين 11
  choice: الإيمان
  alternative: الثقة؛ الأمانة
  rationale: صيغة «بالإيمان» متكررة ومحورية في الإصحاح، و«الإيمان» يحفظ هذا الرابط. أما «الثقة» فممكنة من جهة المعنى، و«الأمانة» ممكنة معجميًا في سياقات أخرى، لكنهما أقل ملاءمة هنا.
- issue: مرجع ἧς وطبيعة محاولة المصريين
  choice: محاولة عبور البحر نفسه
  alternative: 'تركيب حرفي: «الذي لما جرّبه المصريون»'
  rationale: التركيب اليوناني موجز وقد يتصل بالبحر أو بتجربة العبور؛ صيغت العربية بحيث تحافظ على الصلة بالحدث نفسه من غير إدخال تفسير عقدي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة طبيعية تتجنب التركيب الموصول المتكلّف، مع الحفاظ على صورة «الابتلاع» في اليونانية. أُثبتت علامة الحاشية [a] في المتن.
