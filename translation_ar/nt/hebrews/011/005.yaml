    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: بِالإيمان
  rationale: يحافظ على الصياغة المحورية المتكررة في عبرانيين 11، ويعبّر عن الوسيلة أو الأساس الذي به جرى ما يذكره النص.
- source_word: μετετέθη / μετέθηκεν / μεταθέσεως
  choice: نُقِلَ / نقله / نقله
  rationale: يحافظ على وحدة الجذر في المواضع الثلاثة، وينقل معنى تحويل أخنوخ من موضعه أو حاله بفعل الله من غير إضافة تحديد للمكان أو لكيفية الحدث.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: لكي لا يرى الموت
  rationale: يحفظ التعبير اليوناني «يرى الموت» مع دلالة الغاية أو النتيجة في تركيب واضح بالعربية.
- source_word: οὐχ ηὑρίσκετο
  choice: لم يُوجَد
  rationale: صياغة مباشرة تحفظ المبني للمجهول ولا تعيّن من بحث عنه، كما لا يعيّن النص اليوناني ذلك.
- source_word: μεμαρτύρηται
  choice: شُهِد له
  rationale: ينقل صيغة المبني للمجهول ومعنى حصول أخنوخ على شهادة إيجابية، من غير حصر الشاهد صراحة في جهة لم يسمّها هذا الفعل وحده.
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: بأنه أرضى الله
  rationale: تعبير عربي طبيعي ينقل مضمون الشهادة وأن إرضاءه لله سبق نقله.
theological_decisions:
- issue: مدلول نقل أخنوخ
  choice: استعمال «نُقِلَ» من غير التصريح بأنه صعد إلى السماء
  alternative: «أُصعد إلى السماء» أو «أُخذ إلى السماء»
  rationale: يؤكد النص أن الله نقل أخنوخ لكي لا يرى الموت، لكنه لا يشرح في هذه الآية وجهته أو كيفية نقله؛ لذلك لا تضيف الترجمة تفصيلًا عقائديًا غير مصرح به.
- issue: معنى «يرى الموت»
  choice: الإبقاء على الصورة «يرى الموت» في المتن
  alternative: «يذوق الموت» أو «يختبر الموت»
  rationale: الصورة اليونانية مفهومة في العربية وتحفظ النسيج الكتابي، مع بيان معناها الاصطلاحي في الحاشية.
- issue: طبيعة الشهادة لأخنوخ
  choice: «شُهِد له ... بأنه أرضى الله»
  alternative: «مدحه الله»
  rationale: البديل يصرّح بهوية الشاهد ويحوّل معنى الفعل إلى مديح مباشر، بينما العبارة المختارة تحافظ على المبني للمجهول وعلى صلة الشهادة بإرضاء الله.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «نُقِلَ» للمحافظة على تكرار الجذر اليوناني في الأفعال والاسم، واستُعمل «قبل نقله» بوصفه تركيبًا اسميًا طبيعيًا يقابل πρὸ τῆς μεταθέσεως.
