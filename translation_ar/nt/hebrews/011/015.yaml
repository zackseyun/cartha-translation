  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: ar
  text: ولو كانوا يذكرون ذلك الوطن الذي خرجوا منه[a]، لكانت لهم فرصة للرجوع إليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذلك البلد» أو «تلك الأرض». يشير اليوناني إلى المكان الأرضي الذي كانوا قد خرجوا منه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: كانوا يذكرون
  rationale: يحافظ المضارع اليوناني داخل الشرط غير المتحقق على معنى استمرار التذكّر أو بقاء الذهن متجهًا إلى الوطن السابق، وصيغة «كانوا يذكرون» تؤدي ذلك طبيعيًا بالعربية من غير أن تضيف معنى الحنين.
- source_word: ἐκείνης
  choice: ذلك الوطن
  rationale: اسم الإشارة المؤنث يعود إلى «وطن» الآية السابقة المفهوم من السياق. و«الوطن» هنا مكان الأصل والإقامة، لا كيان سياسي بالضرورة، كما يلائم مقابلة الوطن الأرضي بالوطن الأفضل في السياق.
- source_word: ἀφ’ ἧς
  choice: الذي ... منه
  rationale: تؤدي الصلة العربية مع «منه» علاقة المصدر التي تفيدها العبارة اليونانية، بتركيب عربي واضح وطبيعي.
- source_word: ἐξέβησαν
  choice: خرجوا
  rationale: يحفظ المعنى المكاني المباشر للفعل، أي الخروج من مكان، من غير تسطيحه إلى مجرد «تركوا» أو تحميله بالضرورة دلالة اصطلاحية على الخروج من مصر.
- source_word: εἶχον ἂν
  choice: لكانت لهم
  rationale: الماضي مع ἄν في جواب الشرط يدل على نتيجة غير متحققة؛ وصيغة «لكانت لهم» تؤدي هذا المعنى بوضوح في العربية.
- source_word: καιρὸν
  choice: فرصة
  rationale: المقصود وقت أو مناسبة متاحة للعودة، ولذلك تنقل «فرصة» المعنى العملي أدق من «وقت» الزمني المحض.
- source_word: ἀνακάμψαι
  choice: للرجوع إليه
  rationale: الفعل يدل على الرجوع أو العودة إلى المكان السابق. أُضيف الضمير «إليه» لبيان المرجع طبيعيًا في العربية من غير تغيير المعنى.
- source_word: καὶ εἰ μὲν
  choice: ولو
  rationale: تؤدي «لو» الشرط المخالف للواقع الذي يظهر من اقتران الشرط بجواب يفيد نتيجة غير متحققة، والواو تحفظ الصلة بما سبق.
theological_decisions:
- issue: ماهية الوطن المذكور
  choice: وطن أرضي سابق خرج منه الآباء، في مقابلة ضمنية مع الوطن الأفضل السماوي في السياق.
  alternative: أن يكون تعبيرًا عامًا عن أسلوب حياتهم السابق لا مكانًا حقيقيًا.
  rationale: سياق عبرانيين 11:13–16 يتحدث بلغة مكانية عن طلب وطن والرغبة في وطن أفضل، لذلك تُحفظ الإشارة المكانية الملموسة ولا تُحوَّل إلى استعارة في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «الوطن» اتساقًا مع السياق القريب، مع بيان البدائل المكانية في الحاشية. ويحافظ تركيب «ولو... لكانت» على الطبيعة غير المتحققة للشرط.
