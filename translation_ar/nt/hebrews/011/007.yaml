  verdict: revise
  source_fidelity: 'النص دقيق في مجمله: يحافظ على البنية «بالإيمان»، وعلى تلقي نوح إنذارًا/بلاغًا ذا طابع إلهي من غير تسمية الفاعل صراحة، وعلى الأمور غير المرئية بعد، وبناء الفلك، وإدانة العالم، وميراث البر المرتبط بالإيمان. لكن الضمير العربي في «وبه» قد يُفهم عائدًا إلى «أهل بيته» لقربه، خلافًا للمرجع الأرجح في اليونانية، وهو «الفلك».'
