  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: ar
  text: بِالإِيمَانِ، لَمَّا تَلَقَّى نُوحٌ إِنْذَارًا إِلَهِيًّا[a] عَنْ أُمُورٍ لَمْ تُرَ بَعْدُ، بِنَا بِخَشْيَةٍ وَتَقْوَى[b] فُلْكًا لِنَجَاةِ أَهْلِ بَيْتِهِ. وَبِالْفُلْكِ[c] دَانَ الْعَالَمَ، وَصَارَ وَارِثًا لِلْبِرِّ الَّذِي بِحَسَبِ الإِيمَانِ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لمّا تلقّى إرشادًا إلهيًا»، أو «لمّا تلقّى تحذيرًا من الله».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «اتخذ حذره بتقوى»، أو «تحرّك بخوف من الله».'
    reason: lexical_alternative
  - marker: c
    text: يشير «بالفلك» إلى المرجع الأرجح للضمير في اليونانية؛ ويرى بعضهم أنه يشير على نطاق أوسع إلى إيمان نوح أو استجابته المطيعة.
    reason: alternative_reading
  - marker: d
    text: يمكن أن يحمل اللفظ أيضًا معنى «العدل»، لكن السياق هنا يرجّح «البر».
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: بِالإِيمَانِ
  rationale: تفيد صيغة المجرور هنا الوسيلة، وتوافق اللازمة المتكررة في عبرانيين 11، كما تحافظ «الإيمان» على المصطلح المحوري في السياق.
- source_word: χρηματισθεὶς
  choice: لَمَّا تَلَقَّى ... إِنْذَارًا إِلَهِيًّا
  rationale: المبني للمجهول يدل في هذا السياق على تلقي بلاغ أو تحذير ذي مصدر إلهي؛ والصياغة العربية واضحة من غير إدخال اسم الله صراحة في متن اليونانية.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: عَنْ أُمُورٍ لَمْ تُرَ بَعْدُ
  rationale: يحفظ معنى μηδέπω الزمني، كما يبقي المشار إليه عامًا على نحو الأصل بدل حصره صراحة في الطوفان.
- source_word: εὐλαβηθεὶς
  choice: تَحَرَّكَ بِخَشْيَةٍ وَرَعَةٍ
  rationale: يجمع بين أثر التحذير وبين البعد الديني المتسم بالتوقير، فلا يختزل اللفظ إلى خوف مجرد.
- source_word: κατεσκεύασεν
  choice: بَنَى
  rationale: فعل عربي طبيعي ودقيق في سياق صنع الفلك، وأوضح للقارئ العام من «هيّأ».
- source_word: κιβωτὸν
  choice: فُلْكًا
  rationale: هو المقابل العربي الراسخ لسفينة نوح، ويمنع التباس «تابوت» في الاستعمال الحديث.
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: لِنَجَاةِ أَهْلِ بَيْتِهِ
  rationale: «نجاة» تلائم الإنقاذ الفعلي في سياق الطوفان، و«أهل بيته» تؤدي معنى οἶκος الجماعي بصورة عربية طبيعية.
- source_word: δι’ ἧς
  choice: وَبِهِ
  rationale: الضمير يعود في الأرجح إلى «الفلك»، وهو أقرب سابق نحوي؛ واستعمال المذكر يلائم جنس «الفلك» في العربية.
- source_word: κατέκρινεν τὸν κόσμον
  choice: دَانَ الْعَالَمَ
  rationale: نقل مباشر موجز يحفظ قوة فعل الإدانة من غير شرح كيفية وقوعها داخل المتن.
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: لِلْبِرِّ الَّذِي بِحَسَبِ الإِيمَانِ
  rationale: يحافظ «البر» على المصطلح الكتابي، وتحفظ «بحسب الإيمان» بنية κατά وغموض علاقتها الدقيقة بالإيمان.
- source_word: ἐγένετο κληρονόμος
  choice: صَارَ وَارِثًا
  rationale: صياغة عربية طبيعية تنقل بوضوح حدوث الحالة الناتجة.
theological_decisions:
- issue: دلالة χρηματισθεὶς ومصدر الإنذار
  choice: تلقى إنذارًا إلهيًا
  alternative: تلقى إنذارًا؛ أو تلقى إرشادًا إلهيًا
  rationale: الفعل يدل عادة على بلاغ ذي مصدر إلهي، لكن الأصل لا يذكر اسم الله صراحة؛ لذلك استُعمل الوصف «إلهيًا» مع إثبات البدائل في الحاشية.
- issue: دلالة εὐλαβηθεὶς
  choice: تحرك بخشية ورعة
  alternative: اتخذ حذره؛ أو بدافع التقوى
  rationale: الصياغة تحفظ التوتر بين الخوف والاستجابة الموقرة، ولا تجعل انفعال نوح رعبًا مجردًا.
- issue: مرجع δι’ ἧς
  choice: به، أي بالفلك
  alternative: بإيمانه أو باستجابته المطيعة
  rationale: المؤنث اليوناني يعود بصورة طبيعية إلى κιβωτός، أقرب سابق نحوي، مع بقاء احتمال الإحالة الأوسع جديرًا بالذكر.
- issue: دلالة δικαιοσύνη
  choice: البر
  alternative: العدل
  rationale: سياق الميراث والعبارة «بحسب الإيمان» يرجح معنى البر العلائقي أو المقبولية، مع عدم إلغاء المجال القضائي للفظ.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعملت «الفلك» بدل «السفينة» للمحافظة على التعبير العربي الكتابي المألوف، و«أهل بيته» بدل «عائلته» لاتساع معنى οἶκος. وُضعت علامات الحواشي عند العبارات التي تفسرها مباشرة، وحُفظت الاحتمالات المعجمية والنحوية المهمة من غير إثقال المتن.
