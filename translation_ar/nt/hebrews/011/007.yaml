  terminology: «الإيمان»، «الفلك»، «أهل بيته»، «دان العالم»، و«البر» اختيارات مناسبة وثابتة في سجل عربي كتابي واضح. عبارة «البر الذي بحسب الإيمان» تحافظ عمدًا على اتساع κατά πίστιν، وإن كانت ذات نبرة كتابية أكثر من النثر المعاصر.
