  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: ar
  text: بِالإِيمَانِ أَقَامَ غَرِيبًا فِي أَرْضِ الْوَعْدِ، كَأَنَّهَا أَرْضٌ غَرِيبَةٌ، سَاكِنًا فِي خِيَامٍ مَعَ إِسْحَاقَ وَيَعْقُوبَ، شَرِيكَيْهِ فِي وَرَاثَةِ الْوَعْدِ نَفْسِهِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστει
  choice: بِالإِيمَانِ
  rationale: اسم مجرور يفيد الوسيلة؛ وهذه الصياغة هي الأنسب لسياق عبرانيين 11 الذي يكرر الإيمان بوصفه أساس الفعل.
- source_word: παρῴκησεν
  choice: أَقَامَ غَرِيبًا
  rationale: يفيد الفعل الإقامة في موضع بوصف المرء غيرَ منتمٍ إليه أو غيرَ مستوطن فيه؛ وتحفظ العبارة العربية المعنى الاجتماعي مع وضوحها.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: فِي أَرْضِ الْوَعْدِ
  rationale: تأتي εἰς هنا مع فعل الإقامة للدلالة الموضعية؛ و«أرض الوعد» صياغة موجزة تحفظ علاقة الأرض بالوعد.
- source_word: ὡς ἀλλοτρίαν
  choice: كَأَنَّهَا أَرْضٌ غَرِيبَةٌ
  rationale: تحفظ أداة التشبيه ὡς ومعنى ἀλλοτρίαν، أي أرضًا تخص غيره وليست ملكه، بصياغة عربية طبيعية.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: سَاكِنًا فِي خِيَامٍ
  rationale: اسم الفاعل الحالي يؤدي وظيفة الحال ويبين كيفية إقامته، ويحفظ صورة السكن المؤقت الملموسة.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: مَعَ إِسْحَاقَ وَيَعْقُوبَ
  rationale: نقل مباشر وواضح لمعنى μετά مع المجرور.
- source_word: τῶν συγκληρονόμων
  choice: شَرِيكَيْهِ فِي مِيرَاثِ
  rationale: ينقل معنى الاشتراك معه في الإرث، مع إظهار علاقة البدل بإسحاق ويعقوب في عربية سليمة.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: الْوَعْدِ نَفْسِهِ
  rationale: 'يحفظ توكيد الهوية في αὐτῆς: إنهم ورثة الوعد عينه، لا وعود متباينة.'
theological_decisions:
- issue: مرجع الفاعل المستتر
  choice: إبراهيم، مفهوم من سياق الآية السابقة، من غير إدخال اسمه في النص
  alternative: 'التصريح بالاسم: «بالإيمان أقام إبراهيم...»'
  rationale: اليونانية تستعمل فعلًا بفاعل مستتر يعود إلى إبراهيم المذكور في عبرانيين 11:8. إبقاء الفاعل مستترًا يحافظ على بنية المصدر، والسياق يزيل الالتباس.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، بصياغة قريبة من بنية اليونانية دون تكلّف. استُعمل «أقام غريبًا» بدل اللفظ التراثي الأقل تداولًا «تغرّب»، و«شريكيه في ميراث» لتوضيح معنى المشاركة في الإرث.
