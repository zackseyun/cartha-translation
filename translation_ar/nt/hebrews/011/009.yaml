  to: بِالإِيمَانِ أَقَامَ غَرِيبًا فِي أَرْضِ الْوَعْدِ، كَأَنَّهَا أَرْضٌ غَرِيبَةٌ، سَاكِنًا فِي خِيَامٍ مَعَ إِسْحَاقَ وَيَعْقُوبَ، شَرِيكَيْهِ فِي وَرَاثَةِ الْوَعْدِ نَفْسِهِ.
