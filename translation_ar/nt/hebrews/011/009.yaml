review_pass:
  verdict: revise
  source_fidelity: 'الترجمة تنقل عناصر النص اليوناني الأساسية بأمانة: الإيمان، وإقامة إبراهيم غريبًا في أرض الوعد كما لو كانت أرضًا أجنبية، وسكناه في خيام مع إسحاق ويعقوب. لكن «شريكيه في ميراث الوعد» أقل مطابقة من حيث البنية والدلالة لـ συγκληρονόμων τῆς ἐπαγγελίας، إذ قد توحي بأن «الوعد» هو الشيء الموروث بتركيب إضافي غير مباشر، بينما يصف النص إسحاق ويعقوب بأنهما شريكان في وراثة/وارثان للوعد نفسه.'
  naturalness: العبارة فصيحة ومفهومة. «أقام غريبًا» و«ساكنًا في خيام» سليمتان في العربية المعاصرة. واستبدال «ميراث الوعد» بـ«وراثة الوعد» يجعل التركيب أوضح وأشد سلاسة من غير إطالة.
  terminology: «بالإيمان» و«أرض الوعد» و«إسحاق ويعقوب» مناسبة. «الوعد نفسه» يحفظ تأكيد τῆς αὐτῆς. يُفضَّل «شريكيه في وراثة الوعد نفسه» لأنه يبيّن معنى الاشتراك في الإرث/الوراثة الذي في συγκληρονόμοι من دون افتراض تفسير لاهوتي زائد.
  issues:
  - severity: low
    issue: «شريكيه في ميراث الوعد نفسه»
    rationale: التركيب العربي مفهوم، لكن «ميراث الوعد» لا يعبّر بأوضح صورة عن كون إسحاق ويعقوب شركاء إبراهيم في وراثة الوعد. «شريكيه في وراثة الوعد نفسه» أدق وأطبع.
  revised_text: بِالإِيمَانِ أَقَامَ غَرِيبًا فِي أَرْضِ الْوَعْدِ، كَأَنَّهَا أَرْضٌ غَرِيبَةٌ، سَاكِنًا فِي خِيَامٍ مَعَ إِسْحَاقَ وَيَعْقُوبَ، شَرِيكَيْهِ فِي وَرَاثَةِ الْوَعْدِ نَفْسِهِ.
