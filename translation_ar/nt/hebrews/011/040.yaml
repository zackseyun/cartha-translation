  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: ar
  text: لأن الله أعدّ لنا مسبقًا شيئًا أفضل[a]، لكيلا يُكمَّلوا بمعزل عنا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سبق أن رأى لنا شيئًا أفضل». يمكن أن يدل الفعل اليوناني هنا على الرؤية المسبقة أو على الإعداد والتدبير السابقين؛ والسياق يرجّح معنى تدبير الله وإعداده.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لكيلا يُكمَّلوا من دوننا»، أو «لكيلا يبلغوا التمام بمعزل عنا».'
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: أعدّ ... مسبقًا
  rationale: يحفظ معنى التدبير أو الإعداد السابق الذي يلائم السياق، مع إبقاء دلالة السبق التي تحملها الكلمة اليونانية، بدل حصرها في مجرد المعرفة الذهنية المسبقة.
- source_word: κρεῖττόν τι
  choice: شيئًا أفضل
  rationale: ترجمة طبيعية تحافظ على لفظ «أفضل» المتكرر بوصفه موضوعًا بارزًا في الرسالة إلى العبرانيين، وعلى تنكير τι.
- source_word: περὶ ἡμῶν
  choice: لنا
  rationale: 'تؤدي المعنى العلاقي أو النفعي هنا بوضوح: كان تدبير الله واضعًا المؤمنين اللاحقين في الحسبان.'
- source_word: ἵνα μὴ
  choice: لكيلا
  rationale: تحافظ على دلالة الغاية أو النتيجة المقصودة بصياغة عربية واضحة وموجزة.
- source_word: χωρὶς ἡμῶν
  choice: بمعزل عنا
  rationale: تحافظ على فكرة عدم انفصال اكتمال أولئك عن اكتمال الجماعة اللاحقة، ولا توحي بمجرد غياب عارض.
- source_word: τελειωθῶσιν
  choice: يُبلَغ بهم إلى الكمال
  rationale: تحافظ على صيغة المبني للمجهول وعلى التوتر الدلالي بين الإكمال والكمال، بصياغة عربية مفهومة لا تقصر المعنى على الكمال الأخلاقي وحده.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: فُكَّ التركيب اليوناني المطلق إلى جملة سببية تبدأ بـ«لأن»، وهي صياغة عربية طبيعية تصل الآية بما قبلها.
theological_decisions:
- issue: دلالة τελειωθῶσιν في السياق الخلاصي التاريخي للرسالة إلى العبرانيين
  choice: يُبلَغ بهم إلى الكمال
  alternative: يُكمَّلوا؛ أو يبلغوا التمام
  rationale: تحفظ الصياغة ثراء اللفظ بين الكمال والاكتمال والبلوغ إلى الغاية، من غير أن تحسمه في الكمال الأخلاقي وحده أو في مجرد نهاية زمنية.
- issue: العلاقة بين المؤمنين السابقين و«نحن» في تمام الوعد
  choice: بمعزل عنا
  alternative: من دوننا؛ أو منفصلين عنا
  rationale: تحافظ الترجمة على البعد الجماعي في العبارة، من غير تحديد كيفية هذا الاشتراك أو فرض بناء عقائدي تفصيلي عليه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «أعدّ ... مسبقًا» لتأدية معنى التدبير السابق طبيعيًا، و«يُبلَغ بهم إلى الكمال» للحفاظ على المبني للمجهول وعلى ثراء معنى الإكمال والكمال.
