  text: to whom it was said[a], “In Isaac your offspring will be called,”
translation:
  language: ar
  text: 'الذي قيل له: «بإسحاق يُدعى لك نسل».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بمعنى أوضح: «من إسحاق يُنسب إليك نسل».'
