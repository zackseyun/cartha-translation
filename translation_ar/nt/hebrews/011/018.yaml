lexical_decisions:
- source_word: πρὸς ὃν
  choice: الذي قيل له
  rationale: يفيد التركيب الشخص الذي وُجِّه إليه القول، وهذه صياغة عربية طبيعية تحافظ على المبني للمجهول.
- source_word: ἐλαλήθη
  choice: قيل
  rationale: ماضٍ مبني للمجهول يطابق صيغة اليونانية من غير تعيين المتكلم.
- source_word: ὅτι
  choice: ':'
  rationale: تُؤدَّى أداة إدخال مضمون القول في العربية بعلامة النقطتين قبل الاقتباس، من غير حاجة إلى «إنّ».
- source_word: Ἐν Ἰσαὰκ
  choice: بإسحاق
  rationale: الباء تعبّر بإيجاز عن ارتباط النسل الموعود بإسحاق وخطّه، مع بقاء الصياغة قريبة من بنية الاقتباس.
- source_word: κληθήσεταί
  choice: يُدعى
  rationale: تحافظ على المبني للمجهول وعلى مجال معنى الدعوة والتسمية، ولا تحسمه تفسيرياً بمعنى «يُنسب» أو «يُحسب».
- source_word: σοι
  choice: لك
  rationale: تحافظ على الداتيف اليوناني وعلى قدر من الغموض بين معنى الاختصاص والمنفعة، بدل تحويله مباشرة إلى ضمير ملكية.
- source_word: σπέρμα
  choice: نسل
  rationale: «نسل» لفظ عربي واضح ذو دلالة جمعية، ويحفظ صورة الذرية أفضل من جمع «ذرية/أحفاد» التفسيري.
theological_decisions:
- issue: معنى تعيين نسل إبراهيم في اقتباس تكوين 21:12
  choice: بإسحاق يُدعى لك نسل
  alternative: من إسحاق يُنسب إليك نسل
  rationale: الصياغة المختارة تحفظ ألفاظ الاقتباس وتوترها الدلالي بين الدعوة والتسمية والانتساب، ولا توسّع النص إلى تفسير عقدي محدد.
translation_notes:
