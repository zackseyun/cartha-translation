  terminology: «رئيس كهنة»، و«رحيمًا وأمينًا»، و«يكفّر عن خطايا الشعب» مقابلات مناسبة ومحافظة على المجال الكهنوتي. تُبقي الحاشية توتر ἱλάσκεσθαι دون ترجيح مذهبي، لكن ينبغي أن يذكر بديل «الاسترضاء» متعلقه المفهوم («الله») بدل العبارة غير المألوفة «يسترضي عن خطايا».
