  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: الاستنتاج، والضرورة، وشمول المشابهة، وغاية الكهنوت، والتكفير عن خطايا الشعب كلها محفوظة. لكن ربط الغاية الأخيرة بـ«فـ» أضعف قليلًا البناء الغائي الصريح في εἰς τὸ ἱλάσκεσθαι؛ والأدق عربيًا أن تُصاغ بلام الغاية.'
