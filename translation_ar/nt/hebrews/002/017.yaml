- from: لِذَلِكَ كَانَ لَازِمًا أَنْ يَصِيرَ مُشَابِهًا لِإِخْوَتِهِ فِي كُلِّ شَيْءٍ، لِكَيْ يَصِيرَ رَئِيسَ كَهَنَةٍ رَحِيمًا وَأَمِينًا فِي مَا يَخُصُّ اللهَ، فَيُكَفِّرَ عَنْ خَطَايَا الشَّعْبِ.[a]
  to: لِذَلِكَ كَانَ لَا بُدَّ لَهُ أَنْ يَصِيرَ مِثْلَ إِخْوَتِهِ فِي كُلِّ شَيْءٍ، لِكَيْ يَصِيرَ رَئِيسَ كَهَنَةٍ رَحِيمًا وَأَمِينًا فِيمَا يَتَعَلَّقُ بِاللهِ، لِيُكَفِّرَ عَنْ خَطَايَا الشَّعْبِ.[a]
  rationale: تُحسّن المراجعة سلاسة العربية الفصحى وتُظهر بوضوح الغاية التي تفيدها εἰς τὸ ἱλάσκεσθαι، من غير تغيير معنى الآية. كما تُنقّح الحاشية لتكون البدائل العربية سليمة وواضحة، ولتحافظ على تعدد الدلالة في مصطلح الكفارة.
