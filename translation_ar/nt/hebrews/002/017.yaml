source:
  edition: SBLGNT
  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: ar
  text: لِذَلِكَ كَانَ لَا بُدَّ لَهُ أَنْ يَصِيرَ مِثْلَ إِخْوَتِهِ فِي كُلِّ شَيْءٍ، لِكَيْ يَصِيرَ رَئِيسَ كَهَنَةٍ رَحِيمًا وَأَمِينًا فِيمَا يَتَعَلَّقُ بِاللهِ، لِيُكَفِّرَ عَنْ خَطَايَا الشَّعْبِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة: «ليسترضي الله» أو «ليزيل ذنب خطايا الشعب». يحمل الفعل اليوناني معنى معالجة الخطايا بعمل كفّاري، وقد يشمل بُعد الاسترضاء وبُعد إزالة الذنب.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: لذلك
  rationale: تفيد الاستنتاج مما سبق وتحافظ على الصلة المنطقية بعبارة عربية طبيعية.
- source_word: ὤφειλεν
  choice: كان لازمًا
  rationale: تنقل معنى الضرورة أو الالتزام الناشئ من غرض الخلاص، من غير أن توحي بإكراه خارجي.
- source_word: κατὰ πάντα
  choice: في كل شيء
  rationale: تحافظ على شمول المشابهة بصياغة عربية واضحة ومألوفة.
- source_word: τοῖς ἀδελφοῖς
  choice: لإخوته
  rationale: تحافظ على لفظ القرابة المذكر الجمع في اليونانية وعلى صلته بسياق الأسرة المحيط.
- source_word: ὁμοιωθῆναι
  choice: أن يصير مشابهًا
  rationale: تعكس صيغة المبني للمجهول الدالة على صيرورته شبيهًا، مع عربية طبيعية دون تحميل العبارة تفسيرًا زائدًا.
- source_word: ἵνα
  choice: لكي
  rationale: تعبّر بوضوح عن الغاية.
- source_word: ἐλεήμων
  choice: رحيمًا
  rationale: مقابل مباشر يحفظ معنى الرحمة في السياق الكهنوتي.
- source_word: πιστὸς
  choice: أمينًا
  rationale: يلائم وصف رئيس الكهنة في أمانته وموثوقيته أمام الله.
- source_word: ἀρχιερεὺς
  choice: رئيس كهنة
  rationale: المقابل العربي الكتابي الواضح والمستقر للقب الكهنوتي.
- source_word: τὰ πρὸς τὸν θεόν
  choice: في ما يخص الله
  rationale: تحفظ المجال المتعلق بالله في الخدمة الكهنوتية بصياغة مفهومة، من غير اختزاله في تفسير واحد.
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: فيكفّر عن
  rationale: صياغة عربية مألوفة في السياق الذبائحي والكهنوتي، وتعبّر عن معالجة الخطايا تكفيريًا دون حسم كل جوانب المصطلح اليوناني.
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: خطايا الشعب
  rationale: تنقل مفعول العمل الكهنوتي وإضافة الخطايا إلى الشعب بوضوح.
theological_decisions:
- issue: دلالة ἱλάσκεσθαι في سياق الكفارة
  choice: فيكفّر عن خطايا الشعب
  alternative: فيسترضي عن خطايا الشعب؛ فيرفع خطايا الشعب بالكفارة
  rationale: «يكفّر عن» تعبير عربي مفهوم وملائم للسياق الكهنوتي، ولا يحصر اللفظ في الاسترضاء وحده أو في إزالة الخطايا وحدها. وتوضح الحاشية المجال الدلالي المتنازع عليه.
- issue: دلالة المصطلح العائلي ἀδελφοῖς
  choice: إخوته
  alternative: إخوته وأخواته
  rationale: يحافظ النص على الصيغة المذكرة في الأصل وعلى الصدى العائلي في السياق. لا تستلزم العربية هنا حاشية لأن جمع «إخوة» قد يُستعمل أيضًا استعمالًا تغليبيًا بحسب السياق.
- issue: طبيعة الضرورة في ὤφειλεν
  choice: كان لازمًا
  alternative: كان واجبًا عليه
  rationale: تنقل العبارة ضرورة حقيقية مرتبطة بالغرض الخلاصي، من غير أن تقرر أن المقصود إلزام خارجي أو قهري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «رئيس كهنة» للمصطلح الكهنوتي، و«يكفّر عن» بوصفها عبارة مفهومة ذات جذور كتابية. وُضع مؤشر الحاشية بعد الجملة التي تتناول المصطلح محل الإيضاح.
