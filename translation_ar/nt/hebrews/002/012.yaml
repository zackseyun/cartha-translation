  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγων· Ἀπαγγελῶ τὸ ὄνομά σου τοῖς ἀδελφοῖς μου, ἐν μέσῳ ἐκκλησίας ὑμνήσω σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: ar
  text: 'قائلًا: «سأُعلن اسمك لإخوتي[a]، وفي وسط الجماعة[b] سأُسبِّح لك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إخوتي وأخواتي»؛ يقول النص اليوناني «إخوتي»، لكن الإشارة العائلية في السياق قد تشمل جميع المؤمنين.
    reason: lexical_alternative
  - marker: b
    text: أو «المحفل».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: قائلًا
  rationale: اسم فاعل حاليّ يقدّم الاقتباس؛ و«قائلًا» مقابل عربي مباشر وطبيعي يحافظ على صلته بالسياق السابق.
- source_word: Ἀπαγγελῶ
  choice: سأُعلن
  rationale: الفعل يدل على الإخبار أو الإعلان الصريح؛ و«سأُعلن» يحفظ قوة التصريح العلني دون زيادة تفسيرية.
- source_word: τὸ ὄνομά σου
  choice: اسمك
  rationale: ترجمة حرفية تحفظ التعبير الكتابي بما قد يحمله «الاسم» من دلالة على الهوية المعلنة والصفات، من غير توسيع داخل المتن.
- source_word: τοῖς ἀδελφοῖς μου
  choice: لإخوتي
  rationale: يحفظ صيغة الجمع المذكر في اليونانية، مع بيان احتمال شمولها لجميع المؤمنين في الحاشية.
- source_word: ἐν μέσῳ
  choice: في وسط
  rationale: تعبير واضح يحافظ على الصورة المكانية والنبرة الشعرية للاقتباس.
- source_word: ἐκκλησίας
  choice: الجماعة
  rationale: يدل السياق، وهو اقتباس كتابي، على جماعة مجتمعة؛ و«الجماعة» تتجنب حصر اللفظ في معنى مؤسسي لاحق.
- source_word: ὑμνήσω
  choice: سأُسبِّح
  rationale: الفعل يعني تقديم الحمد بالغناء؛ و«أسبّح» في العربية الكتابية الطبيعية ينقل معنى الثناء المنغّم بإيجاز.
- source_word: σε
  choice: لك
  rationale: تتطلب العبارة العربية الطبيعية مع «أسبّح» حرف اللام للدلالة على الموجَّه إليه التسبيح.
theological_decisions:
- issue: دلالة ἀδελφοῖς العائلية التمثيلية
  choice: إخوتي
  alternative: إخوتي وأخواتي
  rationale: يحفظ المتن صيغة المذكر الموجودة في الأصل، بينما توضّح الحاشية أن الإشارة العائلية في السياق قد تشمل المؤمنين والمؤمنات.
- issue: دلالة ἐκκλησία في الاقتباس
  choice: الجماعة
  alternative: الكنيسة أو المحفل
  rationale: يشير اللفظ هنا إلى شعب الله المجتمع، ولا يقتضي بذاته المعنى المؤسسي الذي قد يوحي به لفظ «الكنيسة»؛ و«الجماعة» واضحة وطبيعية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة موقّرة وشعرية خفيفة تلائم الاقتباس؛ حُفظ التوازي بين الإعلان في دائرة الإخوة والتسبيح في وسط الجماعة.
