  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: ar
  text: لِأَنَّ الَّذِي يُقَدِّسُ وَالَّذِينَ يُقَدَّسُونَ كُلُّهُمْ مِنْ وَاحِدٍ[a]؛ وَلِهَذَا السَّبَبِ لَا يَسْتَحْيِي أَنْ يَدْعُوَهُمْ إِخْوَةً[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من أبٍ واحد»، أو «من أصلٍ واحد»، أو «من سلفٍ واحد». لا يحدّد النص اليوناني المقصود بكلمة «واحد».'
    reason: alternative_reading
  - marker: b
    text: «إخوة» ترجمة لجمع المذكر ἀδελφοὺς؛ وقد يشير في هذا السياق إلى عائلة المؤمنين الأوسع، بمن فيهم النساء.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: الَّذِي يُقَدِّسُ
  rationale: اسم فاعل مضارع معلوم مستعمل استعمالًا اسميًّا؛ والصياغة تحافظ على الفعل وعلى دلالته اللاهوتية المألوفة.
- source_word: οἱ ἁγιαζόμενοι
  choice: الَّذِينَ يَتَقَدَّسُونَ
  rationale: اسم فاعل مضارع مبني للمجهول دال على عملية جارية أو حالة مستمرة. يعبّر الفعل العربي المزيد «يتقدّسون» عن تلقي فعل التقديس مع بقاء الصلة اللفظية بـ«يقدّس».
- source_word: ἐξ ἑνὸς
  choice: مِنْ وَاحِدٍ
  rationale: لا يصرّح اليوناني بمرجع «واحد»، فحُفظ الإبهام ولم تُضف كلمة «أب» أو «أصل» أو «سلف» إلى المتن.
- source_word: πάντες
  choice: جَمِيعَهُمْ
  rationale: يشمل اللفظ معًا الذي يقدّس والذين يتقدّسون، ويؤدي في العربية وظيفة التوكيد الجامع من غير حاجة إلى إقحام فعل كينونة.
- source_word: δι’ ἣν αἰτίαν
  choice: وَلِهَذَا السَّبَبِ
  rationale: ترجمة واضحة وطبيعية للعبارة التي تعرض النتيجة المترتبة على الكلام السابق.
- source_word: οὐκ ἐπαισχύνεται
  choice: لَا يَسْتَحْيِي
  rationale: ينقل المعنى المباشر ويحفظ بُعد الخزي والكرامة في العبارة.
- source_word: ἀδελφοὺς
  choice: إِخْوَةً
  rationale: يحافظ على صيغة الجمع المذكر العائلية في الأصل؛ ويمكن أن يشمل اللفظ في السياق جماعة المؤمنين الأوسع، ومنهم النساء، كما توضّح الحاشية.
- source_word: καλεῖν
  choice: أَنْ يَدْعُوَهُمْ
  rationale: صياغة عربية طبيعية للمصدر بعد «لا يستحي»، والضمير يوضح مفعول الدعوة المذكور في اليوناني.
theological_decisions:
- issue: مرجع «من واحد» وهوية الفاعل المستتر في «لا يستحي»
  choice: أُبقي «من واحد» بلا تعيين، ويعود الفاعل المستتر سياقيًّا إلى الابن الذي يقدّس.
  alternative: «من أب واحد» أو «من أصل واحد» أو «من سلف واحد»؛ ويمكن التصريح في الشطر الثاني بـ«هو».
  rationale: السياق القريب يعيّن الابن/يسوع بوصفه الذي يقدّس، أما ἐξ ἑνὸς فلا يذكر صراحةً هل الواحد هو الله أم سلف واحد أم أصل مشترك. لذلك حُفظ الانفتاح اللاهوتي في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي بين «يقدّس» و«يتقدّسون»، كما حُفظ إبهام «من واحد». أُثبتت علامتا الحاشيتين [a] و[b] في المتن.
