  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: ar
  text: 'وأيضًا: «أنا سأكون متوكِّلًا عليه»[a]. وأيضًا: «ها أنا والأولاد الذين أعطانيهم الله»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سأظل متوكِّلًا عليه»، أو: «سأكون واثقًا به».'
    reason: lexical_alternative
  - marker: b
    text: لا يسمّي النص اليوناني المتكلم في هذه الآية؛ لكن الرسالة، في سياقها، تطبّق هذين الاقتباسين على الابن.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: وأيضًا
  rationale: صيغة إدخال لاقتباس آخر؛ حُفظ إيجاز اليونانية من غير إضافة فعل مثل «يقول».
- source_word: Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ
  choice: سأكون متوكِّلًا عليه
  rationale: ينقل التركيب المحيطي، المؤلف من مستقبل «أكون» واسم الفاعل التام، بوصفه حالة ثابتة من الاتكال، ويحافظ على بروز ضمير المتكلم المفهوم في صيغة الفعل العربية.
- source_word: Ἰδοὺ
  choice: ها أنا
  rationale: «ها» أداة تنبيه عربية فصيحة وطبيعية، ومع الضمير التالي تؤدي قوة العبارة الاقتباسية «ها أنا».
- source_word: τὰ παιδία
  choice: الأولاد
  rationale: تعبير طبيعي واسع الدلالة عن الأطفال في العلاقة التي يصورها الاقتباس، من غير تصغير غير لازم.
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: الذين أعطانيهم الله
  rationale: استُعمل اسم الموصول الخاص بالعقلاء وفق العربية الطبيعية، مع إبقاء الفعل ماضيًا كما في اليونانية، وترتيب الكلمات عربيًا بوضوح.
theological_decisions:
- issue: صوت الاقتباس وتطبيقه المسيحاني
  choice: إيراد الاقتباسين بصيغة المتكلم من غير تسمية المتكلم في المتن
  alternative: إضافة «يقول» أو «يقول المسيح/الابن»
  rationale: النص اليوناني لا يسمّي المتكلم هنا، وإن كان سياق الرسالة يطبّق الأقوال على الابن؛ لذلك يُترك التعريف للسياق ولا يُدرج التفسير في المتن.
- issue: دلالة صيغة ἔσομαι πεποιθὼς
  choice: سأكون متوكِّلًا عليه
  alternative: سأتوكل عليه / سأثق به
  rationale: الصياغة المختارة تحفظ بصورة أوضح معنى الحالة المستمرة أو المستقرة في التركيب اليوناني، من غير حصرها في فعل ابتدائي واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة اقتباسية رصينة. استُعملت «متوكِّلًا عليه» لمواءمة الاستعمال العربي الطبيعي، و«ها أنا» للحفاظ على قوة التنبيه. وُضع كل مؤشر حاشية في المتن.
