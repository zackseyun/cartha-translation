  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: ar
  text: فكيف نفلت نحن إن أهملنا خلاصًا عظيمًا كهذا؟ فهذا الخلاص[a]، الذي بدأ الرب بإعلانه، ثبَّته لنا الذين سمعوه،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي بدأ يُتكلَّم به على لسان الرب، وثبَّته لنا الذين سمعوه».'
    reason: يحفظ البديل صلة الموصول والبناء للمجهول في اليونانية بصورة أقرب إلى اللفظ، بينما المتن أوضح وأطبع عربيًا.
lexical_decisions:
- source_word: πῶς
  choice: فكيف
  rationale: تستهل سؤالًا تحذيريًا بلاغيًا، وتُبقي صيغة السؤال من غير تحويلها إلى نفي صريح.
- source_word: ἐκφευξόμεθα
  choice: نفلت نحن
  rationale: ينقل المستقبل اليوناني في سياق السؤال البلاغي، مع إظهار ضمير الجمع للتوكيد المقابل في ἡμεῖς.
- source_word: τηλικαύτης ... σωτηρίας
  choice: خلاصًا عظيمًا كهذا
  rationale: صياغة عربية طبيعية تحفظ شدة وصف الخلاص وعِظَم شأنه.
- source_word: ἀμελήσαντες
  choice: إن أهملنا
  rationale: ينقل اسم الفاعل الماضي بوظيفته الشرطية المصاحبة للفعل الرئيس في هذا التحذير.
- source_word: ἥτις
  choice: فهذا الخلاص
  rationale: يعيد ذكر المرجع بوضوح ويعكس القوة التفسيرية للضمير الموصول؛ ويُذكر البديل الأقرب إلى البنية اليونانية في الحاشية.
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: إذ ابتدأ الرب بالتكلم به
  rationale: ينقل التعبير الاصطلاحي الدال على بداية إعلان الخلاص بصياغة عربية واضحة، مع إبقاء الرب فاعلًا للإعلان بواسطة البناء المعلوم.
- source_word: διὰ τοῦ κυρίου
  choice: الرب
  rationale: حوِّل البناء اليوناني «ابتدأ أن يُتكلَّم به بواسطة الرب» إلى معلوم طبيعي في العربية، من غير تغيير جهة صدور الإعلان.
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: الذين سمعوه
  rationale: يشير الضمير إلى الرب بوصفه المسموع في السياق، مع الحفاظ على كون هؤلاء شهود السماع المباشر.
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: ثبَّته لنا
  rationale: صياغة عربية معلومة طبيعية تنقل أن السامعين أكّدوا الخبر وأثبتوه للمتلقين.
theological_decisions:
- issue: مرجع «الرب» (τοῦ κυρίου)
  choice: الإشارة إلى يسوع بوصفه الرب الذي بدأ إعلان الخلاص
  alternative: إشارة عامة إلى الله بوصفه الرب
  rationale: قول النص إن الذين سمعوه ثبّتوا الخبر لاحقًا يرجّح الإشارة إلى إعلان يسوع الأرضي، من غير إضافة تفسير مذهبي إلى المتن.
- issue: قوة السؤال التحذيري
  choice: 'الإبقاء على السؤال البلاغي: «فكيف نفلت...؟»'
  alternative: 'تحويله إلى تقرير صريح: «لن نفلت...»'
  rationale: يحفظ الاستفهام اليوناني وقوته التحذيرية والتوتر الذي يتضمنه، من غير حسمه في عبارة تقريرية.
- issue: علاقة الخلاص بالإعلان
  choice: اعتبار «الخلاص» هنا مضمونًا أُعلن بالكلام
  alternative: الفصل بين الخلاص نفسه ورسالة الخلاص بإضافة كلمة «رسالة» إلى المتن
  rationale: يحافظ النص على الإسناد المجازي الموجود في اليونانية، حيث يقال عن الخلاص إنه تُكُلِّم به، ولا يضيف اسمًا غير مذكور.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «نفلت» لقوة معنى النجاة من العاقبة، و«أهملنا» للمحافظة على التحذير من عدم الاكتراث. وُضع مؤشر الحاشية [a] في المتن كما يلزم.
