  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «لأنه» تؤدي الوظيفة التفسيرية لـγάρ، و«لم يُخضع» تنقل النفي مع فعل الإخضاع في الماضي، و«للملائكة» يحفظ جهة الإخضاع، و«العالم الآتي» يحافظ على دلالة οἰκουμένη المستقبلية دون تفسير زائد. والجملة الختامية «الذي نتكلم عنه» تحافظ على الإحالة والمضارع المستمر في λαλοῦμεν.'
