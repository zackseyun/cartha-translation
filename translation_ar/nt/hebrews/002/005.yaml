base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: ar
  text: لأنه لم يُخضع للملائكة العالم الآتي[a]، الذي نتكلم عنه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العالم المسكون الآتي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: لأنه لم
  rationale: تنقل «لأن» وظيفة γάρ التفسيرية وصلتها بالسياق السابق، بينما تنقل «لم» نفي الفعل بوضوح.
- source_word: ἀγγέλοις
  choice: للملائكة
  rationale: السياق المباشر في الرسالة يتحدث عن الملائكة السماويين، لا عن رسل بشريين.
- source_word: ὑπέταξεν
  choice: يُخضع
  rationale: يفيد الفعل وضع شيء تحت سلطان أو حكم، و«يُخضع» يحفظ معنى التسلط دون شرح زائد.
- source_word: τὴν οἰκουμένην
  choice: العالم
  rationale: يمكن أن تعني اللفظة العالم المسكون أو العالم بوصفه نطاقًا بشريًا؛ واختيار «العالم» طبيعي وموجز، مع إثبات البديل الأدق حرفيًا في الحاشية.
- source_word: τὴν μέλλουσαν
  choice: الآتي
  rationale: تنقل معنى الاستقبال في اسم الفاعل اليوناني وتحفظ الإشارة الأخروية دون تحديد طبيعة ذلك العالم أكثر مما يتيحه النص.
- source_word: περὶ ἧς λαλοῦμεν
  choice: الذي نتكلم عنه
  rationale: صياغة عربية طبيعية تحافظ على المضارع الدال على الكلام الجاري في سياق الحجة.
theological_decisions:
- issue: المقصود بـ«العالم الآتي»
  choice: عالم أو نظام عالمي آتٍ ذو دلالة أخروية
  alternative: العالم المسكون عمومًا، أو عصر الإنجيل تحديدًا
  rationale: تركيب τὴν οἰκουμένην τὴν μέλλουσαν يشير طبيعيًا إلى العالم المزمع أن يأتي، لكن الترجمة لا تعيّن بالتفصيل هويته أو توقيته، وبذلك تحفظ مجال التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «العالم الآتي» لصياغة موجزة مألوفة، مع إبراز الدلالة الأساسية لـοἰκουμένη في الحاشية.
