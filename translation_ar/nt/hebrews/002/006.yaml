base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: ar
  text: 'لكن شهد شخصٌ ما في موضعٍ ما قائلًا: «ما الإنسان حتى تذكره، أو ابن الإنسان[a] حتى تعتني به[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ترد العبارة في مزمور 8 بوصفها تعبيرًا شعريًا عن الإنسان والبشرية؛ غير أن سياق الرسالة الأوسع يضفي عليها أيضًا دلالة تتصل بيسوع.
    reason: cross_reference
  - marker: b
    text: أو «تفتقده» أو «تتعهده». يدل الفعل اليوناني على التفقد المصحوب بالاهتمام والعناية.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: شهد
  rationale: ينقل معنى الشهادة المؤكدة في سياق الاستشهاد بالكتاب، وهو تعبير عربي واضح ورصين. وجاء بصيغة الماضي موافقةً لصيغة الفعل اليوناني.
- source_word: δέ
  choice: لكن
  rationale: تفيد انتقالًا فيه مقابلة خفيفة مع الكلام السابق عن الملائكة، من غير أن تجعل التضاد أشد مما يحتمله النص.
- source_word: πού τις
  choice: أحدهم في موضعٍ ما
  rationale: 'يحافظ على العنصرين غير المحددين في اليونانية: شخص غير مسمّى وموضع غير مسمّى. ولا يلزم من الأسلوب أن الكاتب يجهل موضع الاقتباس.'
- source_word: λέγων
  choice: قائلًا
  rationale: مقابل مباشر وطبيعي لاسم الفاعل الذي يقدم نص الشهادة.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: ما الإنسان
  rationale: يحافظ على المفرد التمثيلي وعلى الصياغة الشعرية المقتبسة من المزمور، مع بقاء المعنى عامًا في البشر.
- source_word: μιμνῄσκῃ αὐτοῦ
  choice: تذكره
  rationale: ينقل معنى إبقاء الإنسان في الذهن والاهتمام به، وهو واضح في العربية ويحافظ على فعل التذكّر الوارد في الأصل.
- source_word: υἱὸς ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحافظ على تركيب النص اليوناني وعلى صداه الأدبي واللاهوتي، من غير أن يحسم في المتن هل المراد البشرية عمومًا أم دلالة تتضح لاحقًا في تطبيق المقطع على يسوع.
- source_word: ἐπισκέπτῃ αὐτόν
  choice: تعتني به
  rationale: يعبّر بوضوح عن العناية المتنبّهة المقصودة في السياق، بينما قد يُفهم المقابل الحرفي «تزوره» في العربية على أنه مجرد زيارة عابرة.
theological_decisions:
- issue: هل تُصاغ عبارة υἱὸς ἀνθρώπου بوصفها لقبًا مسيانيًا صريحًا؟
  choice: إبقاء «ابن الإنسان» كما في صياغة الاقتباس، من غير إضافة ما يجعلها لقبًا صريحًا في المتن.
  alternative: ترجمتها بمعنى عام مثل «البشر»، أو إبرازها طباعيًا كلقب خاص يشير مباشرةً إلى المسيح.
  rationale: العبارة في سياق المزمور موازية شعريًا لـ«الإنسان» وتشير إلى البشرية، لكن سياق الرسالة الأوسع يطبق المقطع على يسوع. لذلك تحفظ الصياغة المختارة هذا التوتر ولا تحسمه قبل أن يوضحه السياق.
- issue: دلالة ἐπισκέπτῃ بين الزيارة والعناية
  choice: تعتني به
  alternative: تفتقده أو تزوره أو تتعهده
  rationale: الفعل قد يدل على زيارة تنطوي على التفقد والعناية، وليس مجرد الحضور. اختيرت العبارة الأوضح للقارئ المعاصر، مع إثبات البدائل في الحاشية حفاظًا على مدى الدلالة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظ إيقاع السؤال الشعري والمفرد التمثيلي، وتُجنبت صياغة مذهبية تحسم مبكرًا العلاقة بين البشرية عمومًا وتطبيق النص على يسوع.
