  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: ar
  text: فلأنه هو نفسه تألَّم حين جُرِّب[a]، يقدر أن يعين الذين يُجرَّبون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «اختُبر» في الموضعين: «فلأنه هو نفسه تألَّم حين اختُبر، يقدر أن يعين الذين يُختبرون». يمكن أن يدل الفعل اليوناني هنا على أن المرء «يُجرَّب» أو «يُختبَر»، بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ γὰρ
  choice: فلأنه
  rationale: يجمع بين القوة التفسيرية لـγὰρ والمعنى السببي للتعبير ἐν ᾧ، بصياغة عربية طبيعية تصل الآية بما قبلها.
- source_word: πέπονθεν
  choice: تألَّم
  rationale: ينقل معنى πάσχω بوضوح، ويعرض الألم بوصفه خبرة واقعة تظل ذات صلة بقدرته على الإعانة.
- source_word: αὐτὸς
  choice: هو نفسه
  rationale: يحفظ توكيد الضمير اليوناني على أن الابن اختبر ذلك شخصيًا.
- source_word: πειρασθείς
  choice: حين جُرِّب
  rationale: صياغة زمنية طبيعية للمشاركة الظرفية، مع إبقاء معنى التجربة في المتن والتنبيه إلى معنى الاختبار الممكن في الحاشية.
- source_word: δύναται
  choice: يقدر
  rationale: ينقل معنى القدرة بصياغة عربية واضحة وكريمة.
- source_word: τοῖς πειραζομένοις
  choice: الذين يُجرَّبون
  rationale: يحفظ دلالة اسم الفاعل المضارع على أناس يمرون بالتجربة، دون إثقال العبارة العربية.
- source_word: βοηθῆσαι
  choice: أن يعين
  rationale: يعبر عن تقديم العون بلفظ عربي فصيح وطبيعي، مع ملاءمة النبرة الكتابية.
theological_decisions:
- issue: معنى لغة πειράζω عند تطبيقها على يسوع والمؤمنين
  choice: جُرِّب / يُجرَّبون
  alternative: اختُبر / يُختبرون
  rationale: يحفظ اختيار «جُرِّب» الصلة الوثيقة بعبرانيين 4:15 ومعنى مواجهة التجربة، من غير أن يوحي بالاستسلام للخطية. ولأن الفعل اليوناني قد يعني أيضًا «اختبر»، أُبقي هذا الاحتمال في الحاشية بدل حسم التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «فلأنه» للمحافظة على العلاقة التفسيرية والسببية، و«يعين» بدل تعبير أطول، مع إبقاء الغموض الحقيقي بين التجربة والاختبار في الحاشية.
