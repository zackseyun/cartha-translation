base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: ar
  text: جَعَلْتَهُ أَدْنَى مِنَ الْمَلَائِكَةِ مُدَّةً قَصِيرَةً[a]، وَكَلَّلْتَهُ بِالْمَجْدِ وَالْكَرَامَةِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جَعَلْتَهُ أَدْنَى مِنَ الْمَلَائِكَةِ قَلِيلًا». يمكن أن تدل العبارة اليونانية على الدرجة بدلًا من المدة.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: جَعَلْتَهُ أَدْنَى
  rationale: فعل ماضٍ سببي ذو معنى مقارن؛ و«جعلته أدنى» ينقل معنى الإنزال إلى مرتبة أقل من غير إضافة اسم غير موجود في النص.
- source_word: αὐτὸν
  choice: ـهُ
  rationale: ضمير مفعول به مفرد مذكر، يحافظ على صيغة الأصل وإحالته إلى الشخصية البشرية المذكورة في الاقتباس.
- source_word: βραχύ τι
  choice: لِقَلِيلٍ مِنَ الْوَقْتِ
  rationale: يمكن للعبارة اليونانية أن تدل على مدة قصيرة أو على درجة قليلة. اختير المعنى الزمني لانسجامه القوي مع سياق الرسالة، مع إثبات معنى الدرجة في الحاشية.
- source_word: παρ’ ἀγγέλους
  choice: مِنَ الْمَلَائِكَةِ
  rationale: حرف الجر مع السياق المقارن يفيد «من» العربية بعد «أدنى»، أي أدنى مرتبة من الملائكة.
- source_word: δόξῃ
  choice: بِالْمَجْدِ
  rationale: صيغة الداتيف تدل على ما كُلِّل به، والباء هي الصياغة العربية الطبيعية.
- source_word: τιμῇ
  choice: وَالْكَرَامَةِ
  rationale: تفيد τιμή الشرف والمكانة الممنوحة؛ و«الكرامة» تلائم اقترانها بالمجد وتحافظ على الأسلوب الكتابي المألوف.
- source_word: ἐστεφάνωσας
  choice: كَلَّلْتَهُ
  rationale: فعل ماضٍ يحافظ على صورة وضع الإكليل وعلى زمن الصيغة اليونانية دون زيادة تفسيرية.
- source_word: αὐτόν
  choice: ـهُ
  rationale: حُفظ ضمير المفعول به المتكرر في بنية الفعل العربي «كلّلته».
theological_decisions:
- issue: دلالة βραχύ τι في اقتباس المزمور الثامن وتطبيقه في العبرانيين
  choice: 'المعنى الزمني: «لقليل من الوقت»'
  alternative: 'المعنى الدال على الدرجة: «جعلته أدنى قليلًا من الملائكة»'
  rationale: تحتمل اليونانية المعنيين. يتوافق المعنى الزمني بوضوح مع سياق اتضاع الابن المؤقت ثم تمجيده في عبرانيين 2، لكن المعنى الدال على الدرجة احتمال أصيل، لذلك حُفظ في الحاشية بدل حسم التوتر التفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم «أدنى» للمقارنة الطبيعية، و«كلّلته بالمجد والكرامة» للمحافظة على الصورة البلاغية والتوازي. وُضع مؤشر الحاشية مباشرة بعد العبارة التي تحتمل الوجهين.
