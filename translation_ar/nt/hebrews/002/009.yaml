  source_fidelity: يعكس المتن قراءة المصدر المحدد χωρὶς θεοῦ («بمعزل عن الله») على نحو صحيح، ويصون الحاشية القراءة النصية البديلة χάριτι θεοῦ («بنعمة الله»). والترجمة تحفظ المقارنة الزمنية، وسبب التكليل، وغاية ذوق الموت. لكن موضع «بمعزل عن الله» في آخر الجملة العربية قد يجعل نطاقها أقل وضوحًا؛ والأفضل وصلها مباشرة بعبارة «يذوق الموت».
