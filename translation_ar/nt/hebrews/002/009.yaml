  to: لكننا نرى يسوع، الذي جُعل أدنى من الملائكة مدةً قصيرة، مكلَّلًا بالمجد والكرامة بسبب معاناة الموت، لكي يذوق الموت بمعزل عن الله، من أجل كل إنسان.[a]
