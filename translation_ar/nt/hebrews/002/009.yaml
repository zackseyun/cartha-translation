source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: ar
  text: لكننا نرى يسوع، الذي جُعل أدنى من الملائكة مدةً قصيرة، مكلَّلًا بالمجد والكرامة بسبب معاناة الموت، لكي يذوق الموت بمعزل عن الله، من أجل كل إنسان.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ مخطوطات أخرى: «بنعمة الله» بدلًا من «بمعزل عن الله».'
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: مدةً قصيرة
  rationale: 'تُفهم العبارة هنا على الأرجح فهمًا زمنيًا: صار يسوع أدنى من الملائكة لفترة محدودة. وهذه الصياغة العربية واضحة وتحافظ على هذا المعنى السياقي.'
- source_word: παρ’ ἀγγέλους
  choice: أدنى من الملائكة
  rationale: 'تأتي παρά مع المنصوب هنا للمقارنة بعد فعل التقليل، ولذلك فالمعنى: أدنى من الملائكة.'
- source_word: ἠλαττωμένον
  choice: جُعل أدنى
  rationale: يحافظ المبني للمجهول على صورة الفعل اليوناني وعلى معنى خفض المكانة أو المرتبة، من غير قصره على الإذلال النفسي.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: بسبب معاناة الموت
  rationale: διά مع المنصوب تفيد السبب على الأرجح؛ أي إن تكليله بالمجد والكرامة مرتبط بمعاناته الموت. وتحافظ العبارة على الصلة الوثيقة بين المعاناة والموت.
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: مكلَّلًا بالمجد والكرامة
  rationale: ينقل فعل στεφανόω بصورة طبيعية ويحافظ على صورة التكليل الدالة على الإكرام والرفعة.
- source_word: ὅπως
  choice: لكي
  rationale: تنقل دلالة الغاية، مع بقاء احتمال تداخل الغاية والنتيجة قائمًا في السياق.
- source_word: χωρὶς θεοῦ
  choice: بمعزل عن الله
  rationale: هذه هي قراءة النص اليوناني المزوَّد، ومعناها الحرفي «بمعزل عن الله» أو «دون الله». اختيرت للمتن التزامًا بالشاهد الأصلي المحدد، مع إثبات القراءة البديلة المهمة في الحاشية.
- source_word: ὑπὲρ παντός
  choice: من أجل كل واحد
  rationale: تنقل ὑπέρ معنى النيابة أو المنفعة، وتحافظ على الصيغة التوزيعية المفردة في اليونانية. ويفهم السياق المرجع فهمًا شخصيًا على الأرجح.
- source_word: γεύσηται θανάτου
  choice: يذوق الموت
  rationale: يحافظ التعبير على الاستعارة اليونانية، وهو تعبير عربي مفهوم ومألوف بمعنى اختبار الموت فعليًا.
theological_decisions:
- issue: الاختلاف النصي في عبارة الغاية
  choice: بمعزل عن الله (χωρὶς θεοῦ)
  alternative: بنعمة الله (χάριτι θεοῦ)
  rationale: النص اليوناني المحدد في الطلب يقرأ χωρὶς θεοῦ، لذلك أُثبتت هذه القراءة في المتن بدل استبدالها بقراءة أكثر شيوعًا في الترجمات. أما قراءة χάριτι θεοῦ فهي قراءة قديمة ومهمة وواسعة الشهادة، فأُثبتت في الحاشية حفاظًا على شفافية الاختلاف والتوتر التفسيري من غير حسم صامت.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. حوفظ على صورة «التكليل» و«ذوق الموت»، وعلى ترتيب الأفكار بقدر تسمح به العربية، مع جعل قراءة النص اليوناني المزوَّد هي قراءة المتن.
