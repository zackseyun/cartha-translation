  terminology: «الملائكة»، «مكلَّلًا بالمجد والكرامة»، و«يذوق الموت» اختيارات سليمة ومألوفة. و«بمعزل عن الله» ترجمة محافظة ومناسبة للقراءة المطبوعة، من دون فرض تفسير للاختلاف النصي.
