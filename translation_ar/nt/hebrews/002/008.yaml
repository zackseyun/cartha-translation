id: HEB.2.8
reference: Hebrews 2:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: ar
  text: «أخضعتَ كلَّ شيء تحت قدميه». فإذ أخضع كلَّ شيء له[a][b]، لم يترك شيئًا غير خاضع له. لكننا الآن لا نرى بعدُ كلَّ شيء خاضعًا له.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تردد الضمائر صدى المزمور 8. وفي السياق يمكن أن تشير إلى الإنسان أو البشرية بحسب المعنى الأصلي للمزمور، وإلى يسوع بحسب تطبيق الرسالة إلى العبرانيين.
    reason: cross_reference
  - marker: b
    text: 'يمكن أيضًا ترجمة العبارة: «ففي إخضاعه كلَّ شيء له». تحتمل الصياغة اليونانية معنى زمنيًا أو معنى يركّز على فعل الإخضاع نفسه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: كلَّ شيء
  rationale: ينقل شمول صيغة الجمع المحايد في اليونانية بعبارة عربية طبيعية وواضحة.
- source_word: ὑπέταξας
  choice: أخضعتَ
  rationale: يحافظ على صيغة المخاطب وعلى معنى الإخضاع والسيادة في اقتباس المزمور.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: تحت قدميه
  rationale: تعبير عربي مألوف يحفظ صورة السلطان الواردة في المزمور.
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: فإذ أخضع
  rationale: صياغة سلسة تفيد الظرف الزمني، مع إبقاء الاحتمال الدلالي الآخر في الحاشية.
- source_word: οὐδὲν ἀφῆκεν ... ἀνυπότακτον
  choice: لم يترك شيئًا غير خاضع له
  rationale: يحفظ النفي الشامل ويكرر حقل الإخضاع اللفظي بوضوح.
- source_word: νῦν δὲ οὔπω ὁρῶμεν
  choice: لكننا الآن لا نرى بعدُ
  rationale: ينقل بوضوح التباين بين إعلان الاقتباس والواقع الذي لم يظهر اكتماله بعد.
- source_word: ὑποτεταγμένα
  choice: خاضعًا له
  rationale: يعبر طبيعيًا عن الحالة الناتجة من الإخضاع التي يدل عليها اسم المفعول التام.
theological_decisions:
- issue: مرجع الضمائر αὐτοῦ / αὐτῷ
  choice: الإبقاء على الضمائر بصيغة «قدميه» و«له» من غير تسمية المرجع
  alternative: تفسيرها صراحةً بأنها تشير إلى الإنسان/البشرية، أو إلى يسوع
  rationale: يشير سياق المزمور أولًا إلى الإنسان، بينما يطبّق كاتب العبرانيين الكلام على يسوع؛ والإبقاء على الضمائر يصون هذا التوتر المقصود ولا يحسمه تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أخضع/خاضع» للمحافظة على تكرار الجذر الدلالي في اليونانية، وأُبقيت الضمائر بلا توسع تفسيري.
