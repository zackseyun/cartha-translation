reference: Hebrews 2:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: ar
  text: فبما أن الأبناء قد اشتركوا في اللحم والدم[a]، شارك هو نفسه أيضًا فيهما على نحو مماثل، لكي يُبطل بالموت ذاك الذي له سلطان الموت، أي إبليس[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا بحسب ترتيب الكلمات في اليونانية: «الدم واللحم».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا أن تُترجم: «يقضي على» أو «يجرّد من القوة»؛ فالفعل اليوناني قد يعني إبطال الفاعلية أو التجريد من القوة، ولا يلزم أن يعني الإفناء.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: فبما أن
  rationale: تجمع الفاء بين الاستنتاج والارتباط بما سبق، وتؤدي «بما أن» المعنى السببي الذي تحمله ἐπεί، بصياغة عربية طبيعية.
- source_word: τὰ παιδία
  choice: الأبناء
  rationale: تحيل إلى الأبناء المذكورين في السياق السابق، وهي أوسع وأفصح هنا من «الأولاد» التي قد تُفهم أحيانًا على الذكور وحدهم.
- source_word: κεκοινώνηκεν
  choice: يشتركون
  rationale: ينقل المضارع العربي حالة المشاركة القائمة الناتجة عن المشاركة، من غير تكلّف في محاكاة صيغة التام اليونانية.
- source_word: αἵματος καὶ σαρκός
  choice: اللحم والدم
  rationale: قُدّم «اللحم» وفق التعبير العربي الطبيعي الشائع، مع إثبات ترتيب الأصل اليوناني «الدم واللحم» في الحاشية. والمقصود باللحم هنا الكيان الجسدي البشري لا «الطبيعة الخاطئة».
- source_word: παραπλησίως
  choice: على نحو مماثل
  rationale: يدل على مشابهة حقيقية ووثيقة من غير أن يضيف تطابقًا مطلقًا لا تصرح به اللفظة.
- source_word: μετέσχεν τῶν αὐτῶν
  choice: اشترك ... فيهما
  rationale: يحافظ على معنى المشاركة وعلى الإحالة الواضحة إلى اللحم والدم، مع تجنب العبارة الحرفية الثقيلة «الأشياء نفسها».
- source_word: ἵνα
  choice: لكي
  rationale: يعبّر بوضوح عن الغاية.
- source_word: διὰ τοῦ θανάτου
  choice: بالموت
  rationale: ينقل معنى الوسيلة في διά مع المضاف إليه بإيجاز عربي طبيعي.
- source_word: καταργήσῃ
  choice: يُبطل
  rationale: يفيد إبطال الفاعلية أو التجريد من القوة، ولا يستلزم إفناء الوجود. أُثبت البديل التقليدي في الحاشية.
- source_word: τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: ذاك الذي له سلطان الموت
  rationale: يحافظ على تركيب الشخص الموصوف وعلى معنى κράτος بوصفه سلطانًا أو قوة حاكمة.
- source_word: τοῦτ’ ἔστι
  choice: أي
  rationale: أداة عربية موجزة وطبيعية لإدخال التعيين التفسيري.
- source_word: τὸν διάβολον
  choice: إبليس
  rationale: هو الاسم الشخصي العربي المستقر للمقصود في هذا السياق، وهو أوضح من نقل المعنى الاشتقاقي «المفتري».
theological_decisions:
- issue: اشتراك المسيح في الطبيعة البشرية
  choice: «اشترك هو نفسه أيضًا، على نحو مماثل، فيهما»
  alternative: «شاركهم هو أيضًا في بشريتهم»
  rationale: يحافظ النص على المشاركة الحقيقية في اللحم والدم، وعلى التمييز الدقيق الذي يصنعه الأصل باستعمال ظرف المشابهة وفعل مختلف عن فعل مشاركة الأبناء، من غير إدخال صياغة عقائدية لاحقة في متن الآية.
- issue: دلالة καταργήσῃ في ما يخص إبليس
  choice: «يُبطل»
  alternative: «يقضي على» أو «يجرّد من القوة»
  rationale: «يُبطل» تحفظ المجال الدلالي الذي يشمل تعطيل الفاعلية وإزالة السلطان، ولا توحي بالضرورة بإفناء إبليس. أما «يقضي على» فقراءة ممكنة تقليديًا، ولذلك ذُكرت في الحاشية مع بيان حدود معناها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. روعي الأسلوب العربي الطبيعي في «اللحم والدم»، مع حفظ ترتيب اليونانية في الحاشية، واستُعملت «الأبناء» اتساقًا مع الإحالة السياقية ومنعًا لاحتمال قصر اللفظ على الذكور.
