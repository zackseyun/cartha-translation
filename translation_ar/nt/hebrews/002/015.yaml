  naturalness: 'الصياغة فصيحة ومفهومة عمومًا. والترتيب المنقح أكثر سلاسة ووضوحًا في العربية المعاصرة: «كانوا، خوفًا من الموت، خاضعين للعبودية طوال حياتهم».'
