lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: يحرِّر
  rationale: يفيد الفعل إطلاق شخص أو تحريره من حالة تقيّده؛ و«يحرِّر» واضح وطبيعي، ويلائم صورة العبودية في بقية الجملة.
- source_word: τούτους, ὅσοι
  choice: أولئك جميعًا الذين
  rationale: يجمع هذا التعبير بين إشارة τούτους والدلالة الشاملة في ὅσοι، من غير التزام بتركيب يوناني جامد.
- source_word: φόβῳ θανάτου
  choice: خوفًا من الموت
  rationale: ينقل الدلالة السببية أو الظرفية لصيغة المجرور اليونانية تعبيرًا عربيًا موجزًا وطبيعيًا.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: طوال حياتهم
  rationale: هذا التعبير اليوناني يدل على امتداد الحالة على زمن الحياة كله، و«طوال حياتهم» يؤدي المعنى بوضوح.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: ظلّوا ... خاضعين للعبودية
  rationale: «خاضعين للعبودية» يحفظ معنى الوقوع تحت سلطان العبودية، و«ظلّوا» مع عبارة المدة يبيّن استمرار هذه الحالة طوال الحياة.
- source_word: δουλείας
  choice: العبودية
  rationale: اللفظ يدل على العبودية أو الاسترقاق؛ و«العبودية» يحفظ قوة الصورة ولا يحولها إلى مفهوم روحي أضيق لم يصرّح به النص.
- source_word: καὶ
  choice: و
  rationale: تصل الواو هذه الغاية بما قبلها في الآية السابقة على نحو مباشر.
theological_decisions:
- issue: طبيعة العبودية المرتبطة بالخوف من الموت
  choice: 'الإبقاء على الوصف العام: الخضوع للعبودية خوفًا من الموت'
  alternative: تحديدها بأنها عبودية لإبليس، أو للخطيئة، أو مجرد قلق وجودي بسبب الفناء
  rationale: مع أن السياق السابق يذكر إبليس وسلطان الموت، فإن هذه العبارة نفسها لا تحدد آلية العبودية أو موضوعها تحديدًا أضيق؛ لذلك تُحفظ سعة التعبير وتوتره اللاهوتي.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، بنبرة كتابية رصينة. استُخدم «أولئك جميعًا الذين» لإظهار الإشارة والشمول، ووُضع البديل المعجمي عند عبارة العبودية التي يفسرها.
