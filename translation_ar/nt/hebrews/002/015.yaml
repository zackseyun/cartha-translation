translation:
  language: ar
  text: ويحرِّر أولئك جميعًا الذين كانوا، خوفًا من الموت، خاضعين للعبودية[a] طوال حياتهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «واقعين تحت العبودية» أو «مستعبَدين».'
