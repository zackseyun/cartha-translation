lexical_decisions:
- source_word: συνεπιμαρτυροῦντος
  choice: وكان الله أيضًا يشهد معهم
  rationale: يحافظ على كون الفعل اسمَ فاعلٍ في تركيب إضافي يدل على ظرف مصاحب لما سبق، وينقل معنى المشاركة في الشهادة الكامن في السابقة συν- من غير صياغة عربية متكلّفة.
- source_word: σημείοις τε καὶ τέρασιν
  choice: بآيات وعجائب
  rationale: الباء تنقل دلالة الوسيلة في صيغة المجرور اليونانية، و«آيات وعجائب» تعبير عربي واضح يحفظ الوظيفة الدلالية للآيات وما تثيره العجائب من دهشة.
- source_word: ποικίλαις δυνάμεσιν
  choice: وأعمال قدرة متنوعة[a]
  rationale: تنقل العبارة مظاهر القدرة الفائقة في السياق، وتتجنب أن توحي «قوات» بجيوش أو قوى مجردة، مع إبقاء البدائل المعجمية في الحاشية.
- source_word: πνεύματος ἁγίου
  choice: من الروح القدس
  rationale: يحفظ اللقب الإلهي المألوف في العربية، مع إبقاء علاقة المضاف إليه بـ«توزيعات» من غير إضافة كلمة «مواهب» غير الموجودة صراحة في اليونانية.
- source_word: μερισμοῖς
  choice: بتوزيعات[b]
  rationale: ينقل معنى القسمة أو التوزيع بأقرب لفظ عربي مباشر، ولا يضيف «مواهب» إلى النص.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: بحسب مشيئته
  rationale: صياغة عربية طبيعية تنقل معنى المطابقة أو الموافقة، ويعود الضمير في السياق على الله، فاعل الشهادة.
theological_decisions:
- issue: مرجع الضمير في «مشيئته»
  choice: الله، فاعل «يشهد»
  alternative: الروح القدس
  rationale: الله هو الفاعل المتحكم في هذا التركيب، ولذلك يعود الضمير إليه على الأرجح، مع عدم إضافة شرح عقائدي يتجاوز البنية النحوية.
- issue: طبيعة «توزيعات الروح القدس»
  choice: الإبقاء على لفظ التوزيعات من غير إضافة «مواهب»
  alternative: مواهب الروح القدس
  rationale: النص اليوناني لا يصرح بكلمة «مواهب»، وإضافتها تحسم دلالة تركها الأصل أوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أعمال قدرة» لتجنب التباس «قوات»، وأُبقيت علامة الاستفهام لأن الآية تتمم السؤال الذي بدأ في السياق السابق.
