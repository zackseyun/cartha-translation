lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: الرسالة التي نُطِق بها بواسطة ملائكة
  rationale: يناسب «الرسالة» هنا معنى λόγος بوصفه بلاغًا إلهيًّا، وتحفظ «بواسطة ملائكة» دلالة الوساطة في διά، بينما تنقل صيغة «نُطِق بها» معنى اللازم للمبني للمجهول λαληθείς دون تعيين المتكلم.
- source_word: ἀγγέλων
  choice: ملائكة
  rationale: يشير السياق على الأرجح إلى الملائكة السماويين في التقليد المتعلق بوساطة الشريعة، لا إلى رسل بشريين.
- source_word: ἐγένετο βέβαιος
  choice: قد ثبتت
  rationale: تفيد العبارة أن الرسالة صارت راسخة نافذة لا يمكن تجاوزها، وتحفظ «ثبتت» الدلالة الناتجية دون حصرها في مجرد التصديق المعرفي.
- source_word: πᾶσα παράβασις
  choice: كل مخالفة
  rationale: تدل παράβασις على تجاوز حد أو انتهاك أمر؛ و«مخالفة» واضحة وطبيعية في العربية الحديثة وتحافظ على الطابع القانوني.
- source_word: παρακοὴ
  choice: عصيان
  rationale: تحمل παρακοή معنى عدم الإصغاء المؤدي إلى عدم الطاعة؛ و«عصيان» يبرز معناها الأخلاقي والقانوني في الموازاة مع «مخالفة».
- source_word: ἔλαβεν
  choice: نالت
  rationale: تحافظ على كون كل مخالفة وعصيان هو موضوع الفعل في اليونانية، وتأتي طبيعية مع «جزاء».
- source_word: ἔνδικον μισθαποδοσίαν
  choice: جزاءً عادلًا
  rationale: تنقل «جزاء» معنى المقابلة أو المكافأة في μισθαποδοσία، وتعبّر «عادلًا» عن ἔνδικον من غير قصر اللفظ على العقوبة وحدها، مع أن السياق سلبي قضائي.
theological_decisions:
- issue: ماهية «الرسالة التي نُطِق بها بواسطة ملائكة»
  choice: الإبقاء عليها رسالةً بواسطة ملائكة، مع بيان الإشارة المرجحة إلى الشريعة في الحاشية
  alternative: التصريح في المتن بأنها الشريعة التي أعطيت بواسطة ملائكة
  rationale: يرجح السياق وتقليد وساطة الملائكة أن المقصود شريعة سيناء، لكن النص اليوناني يقول «الرسالة» ولا يصرح بـ«الشريعة»، لذلك تحفظ الترجمة هذا القدر من الإبهام.
- issue: الدلالة القضائية لعبارة ἔνδικον μισθαποδοσίαν
  choice: جزاءً عادلًا
  alternative: عقوبةً عادلةً
  rationale: «جزاء» أقرب إلى سعة معنى المقابلة في اللفظ اليوناني، فيما يوضح السياق أن الجزاء هنا سلبي وعقابي، من غير إدخال هذا التحديد في الكلمة نفسها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الرسالة» بدل «الكلمة» لأن السياق يتحدث عن بلاغ منطوق، و«بواسطة ملائكة» لإبراز الوساطة دون نسبة القول مباشرة إليهم. حافظت الصياغة على اتصال الآية بما بعدها بوضع فاصلة ختامية.
