  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: ar
  text: فإن كانت الرسالة التي نُطِق بها بواسطة ملائكة قد ثبتت[a]، ونالت كل مخالفة وعصيان جزاءً عادلًا[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الشريعة على الأرجح، بحسب التقليد اليهودي الذي يرى أنها نُقلت بواسطة ملائكة؛ قارن أعمال 7:53 وغلاطية 3:19.'
    reason: cross_reference
  - marker: b
