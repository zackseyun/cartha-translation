base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: ar
  text: فقد كان يليق بمن لأجله كلُّ شيء وبه كلُّ شيء، إذ يقود أبناءً كثيرين[a] إلى المجد[d]، أن يُكمِّل[c] رائدَ[b] خلاصهم من خلال الآلام.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يحفظ تعبير «أبناء كثيرين» لفظ اليونانية وتركيزه على البنوة والميراث؛ وهو يشمل جميع المنتمين إلى بنوة الله، لا الذكور وحدهم.
    reason: lexical_alternative
  - marker: b
    text: أو «منشئ خلاصهم»، أو «قائد خلاصهم»، أو «مؤسس خلاصهم».
    reason: lexical_alternative
  - marker: c
    text: المقصود بـ«يُكمِّل» هنا أن يبلّغه الغاية المقصودة أو تمام مهمته من خلال الآلام، لا أن يصلح فيه عيبًا أخلاقيًا.
    reason: lexical_alternative
  - marker: d
    text: 'ويمكن ترتيب الجملة هكذا: «فقد كان يليق بمن لأجله كل شيء وبه كل شيء أن يُكمِّل رائد خلاصهم من خلال الآلام، إذ يقود أبناءً كثيرين إلى المجد».'
    reason: previous_rendering
lexical_decisions:
- source_word: Ἔπρεπεν γὰρ αὐτῷ
  choice: فقد لاق بالذي
  rationale: ينقل التعبير غير الشخصي الدال على الملاءمة، ويجعل مرجع الضمير واضحًا في العربية من خلال صلته بالعبارتين التاليتين، من غير إضافة اسم «الله» إلى النص.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: الذي من أجله كلُّ شيء وبه كلُّ شيء
  rationale: يحافظ على التمييز بين الغاية في العبارة الأولى والوساطة أو الفاعلية في الثانية، مع إيجاز عربي موازٍ لإيجاز اليونانية.
- source_word: πολλοὺς υἱοὺς
  choice: أبناء كثيرين
  rationale: يحفظ لفظ البنوة الصريح وما يحمله من إيحاء بالميراث والمكانة العائلية، مع توضيح شموله في الحاشية.
- source_word: εἰς δόξαν
  choice: إلى المجد
  rationale: ينقل معنى الحركة نحو المجد أو بلوغه بصياغة عربية طبيعية.
- source_word: ἀγαγόντα
  choice: وهو يأتي
  rationale: يعبّر عن الصلة الحالية بين إتيان الأبناء إلى المجد وتكميل رائد خلاصهم، من غير تحويل اسم الفاعل إلى جملة غرضية غير مصرّح بها.
- source_word: ἀρχηγὸν
  choice: رائد
  rationale: «رائد» يجمع معنى السبق وافتتاح الطريق والقيادة، وهو أنسب هنا من «مؤلف» أو «مصدر».
- source_word: τῆς σωτηρίας αὐτῶν
  choice: خلاصهم
  rationale: صياغة عربية مباشرة تحفظ علاقة الإضافة ومرجع الضمير.
- source_word: διὰ παθημάτων
  choice: بالآلام
  rationale: يحفظ صيغة الجمع، ويعبّر عن كون الآلام الوسيلة أو الطريق الذي تم به التكميل.
- source_word: τελειῶσαι
  choice: أن يُكمِّل
  rationale: ينقل معنى بلوغ الغاية أو الإتمام المقصود، ويحافظ على الصلة المعجمية المهمة لهذا الفعل في الرسالة إلى العبرانيين.
theological_decisions:
- issue: معنى τελειῶσαι في وصف رائد الخلاص
  choice: أن يُكمِّل
  alternative: أن يبلغ به الغاية / أن يتمّمه
  rationale: يحفظ اللفظ فكرة الإيصال إلى الغاية والاكتمال في المهمة؛ ولا يقتضي النص إصلاح نقص أخلاقي، وهو ما توضحه الحاشية من غير إلغاء توتر العبارة.
- issue: دلالة πολλοὺς υἱοὺς
  choice: أبناء كثيرين
  alternative: أولادًا كثيرين / كثيرين من الأبناء
  rationale: يبقي صورة البنوة والميراث الظاهرة في اليونانية، مع بيان أن المقصود لا يقتصر على الذكور.
- issue: العلاقة النحوية لعبارة ἀγαγόντα εἰς δόξαν
  choice: وهو يأتي بأبناء كثيرين إلى المجد
  alternative: إذ أتى بأبناء كثيرين إلى المجد
  rationale: تحافظ الصياغة على ارتباط اسم الفاعل بمن لاق به أن يكمّل رائد الخلاص، ولا تحسمه بوصفه غرضًا صريحًا؛ وتُذكر الصياغة الأقرب إلى الترتيب اليوناني في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم «كل شيء» بدل «كل الأشياء» لطبيعته في العربية، و«رائد» للحفاظ على معنى السبق والقيادة. بقي تركيب الآية طويلًا نسبيًا كي لا تُفكك الروابط المقصودة في الأصل أو تتحول العبارة الحالية إلى غرض صريح.
