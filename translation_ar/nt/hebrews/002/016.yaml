  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: ar
  text: فَمِنَ الْوَاضِحِ أَنَّهُ لَا يُعِينُ الْمَلَائِكَةَ، بَلْ يُعِينُ نَسْلَ إِبْرَاهِيمَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُمْسِكُ بِـ». يمكن أن يعني الفعل اليوناني «يمسك بـ» حرفيًّا، لكن يُفهم هنا، على الأرجح، بمعنى «يعين» أو «يهبّ للمعونة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: مِنَ الْمُؤَكَّدِ
  rationale: تنقل النبرة الاستدلالية التوكيدية التي تعرض القول بوصفه أمرًا واضحًا، من غير حذف دلالة اللفظة.
- source_word: ἀγγέλων
  choice: الْمَلَائِكَةَ
  rationale: المقابل العربي المباشر، وهو الفئة المقابلة لنسل إبراهيم في العبارة.
- source_word: ἐπιλαμβάνεται
  choice: يُغِيثُ
  rationale: يؤدي المعنى السياقي للأخذ بيد أحد بقصد معونته وإنقاذه، وهو أفصح هنا من «يساعد» وأوضح من الاقتصار على المعنى الحرفي «يمسك».
- source_word: σπέρματος Ἀβραὰμ
  choice: نَسْلَ إِبْرَاهِيمَ
  rationale: يحفظ الدلالة الجمعية للمفرد σπέρμα، ويأتي طبيعيًا ومفهومًا في العربية المعاصرة من غير تحويله صراحة إلى جمع «ذرية/أحفاد».
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: فَـ... لَا ... بَلْ
  rationale: تحفظ الفاء التعليلية والتقابل القوي بين الملائكة ونسل إبراهيم.
theological_decisions:
- issue: دلالة ἐπιλαμβάνεται وصلتها بعمل المسيح الخلاصي
  choice: يُغِيثُ
  alternative: يَأْخُذُ بِيَدِ / يَتَمَسَّكُ بِـ
  rationale: يرجح السياق معنى المبادرة إلى المعونة والإنقاذ، لكن الفعل اليوناني يحتمل أصلًا معنى الإمساك أو الأخذ؛ لذلك أُبقي هذا الاحتمال في الحاشية صونًا للتوتر التفسيري وعدم حصر النص في قراءة لاهوتية واحدة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «يُغيث» بدل «يساعد» لإبراز معنى النجدة الخلاصية من غير توسع تفسيري، ووُضعت علامة الحاشية بعد الجملة التي تتعلق بها.
