    rationale: δήπου تشير إلى ما يُفترض أنه واضح أو مسلَّم به للمخاطبين، لا إلى تقرير قطعي مجرد؛ لذلك «فمن الواضح» أنسب.
  - severity: medium
    issue: تضييق معنى ἐπιλαμβάνεται في «يُغيث»
    rationale: «الإغاثة» توحي عادةً بالإنقاذ من كربة، بينما المعنى السياقي المرجح هو الإعانة أو المجيء للمعونة على نحو أعم. «يعين» يحفظ المعنى من دون توسع.
  - severity: low
