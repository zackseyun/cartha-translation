  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: ar
  text: لذلك يجب علينا أن نولي ما سمعناه اهتمامًا أشد، لئلا ننجرف بعيدًا عنه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لئلا ننجرف متجاوزين ما سمعناه»، أو: «لئلا ندع ما سمعناه يفلت منا». يوحي الفعل اليوناني بصورة الانجراف أو الانزلاق مرورًا بجانب شيء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: لذلك
  rationale: أداة استنتاج عربية طبيعية تحفظ الصلة المنطقية بما سبق.
- source_word: δεῖ
  choice: يجب علينا
  rationale: تنقل معنى الضرورة بوضوح، وتُظهر أن ἡμᾶς هو فاعل المصدر من جهة المعنى.
- source_word: περισσοτέρως
  choice: باهتمام أشد
  rationale: يحفظ قوة المقارنة والتشديد في العبارة اليونانية، بصياغة عربية واضحة.
- source_word: προσέχειν ἡμᾶς
  choice: أن ننتبه
  rationale: ينقل معنى توجيه الذهن وإيلاء العناية، من غير أن يضيف معنى التمسك غير الصريح هنا.
- source_word: τοῖς ἀκουσθεῖσιν
  choice: إلى ما سمعناه
  rationale: صياغة عربية طبيعية للمشاركة المبنية للمجهول، وتحفظ الإشارة إلى مضمون ما سُمع دون تخصيصه بكلمة «الرسالة».
- source_word: μήποτε
  choice: لئلا
  rationale: تؤدي معنى التحذير من نتيجة سلبية محتملة بإيجاز وفصاحة.
- source_word: παραρυῶμεν
  choice: ننجرف بعيدًا عنه
  rationale: يحفظ صورة الانجراف التدريجي، مع ضمير يعود إلى ما سُمع؛ وتُذكر الاحتمالات المعجمية الأخرى في الحاشية.
theological_decisions:
- issue: اتجاه صورة التحذير في παραρυῶμεν
  choice: أن السامعين ينجرفون بعيدًا عما سمعوه
  alternative: أن ينجرفوا متجاوزين إياه، أو أن يدعوا ما سمعوه يفلت منهم
  rationale: صيغة الفعل مع ضمير المتكلمين تسند الخطر إلى السامعين، لكن المجال الدلالي يسمح بصورتي الانجراف متجاوزين الشيء أو إفلاته؛ لذلك يحفظ المتن القراءة الأرجح وتعرض الحاشية البدائل من غير حسم توتر النص لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «باهتمام أشد» للمحافظة على التشديد المقارن مع سلاسة الأسلوب، ووُضعت علامة الحاشية بعد جملة التحذير لأنها تشرح الفعل الأخير.
