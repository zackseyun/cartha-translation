id: HEB.5.5
reference: Hebrews 5:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: ar
  text: 'كذلك أيضًا لم يمجِّد المسيحُ نفسه ليصير رئيسَ كهنة، بل مجَّده الذي قال له: «أنت ابني، أنا اليوم ولدتك».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اقتباس من مزمور 2:7.
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: كذلك أيضًا
  rationale: تحفظ أداة المقارنة والربط بما سبق، حيث يتحدث السياق عن تعيين رئيس الكهنة.
- source_word: ὁ Χριστὸς
  choice: المسيح
  rationale: «المسيح» في العربية لقب معروف يحفظ دلالة الممسوح دون الحاجة إلى التفريق الاصطلاحي غير الطبيعي بين Messiah وChrist في الإنجليزية.
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: لم يمجِّد نفسه
  rationale: يحفظ المعنى الأساسي للفعل δοξάζω والبناء الانعكاسي، مع بقاء معنى التكريم حاضرًا في السياق.
- source_word: γενηθῆναι ἀρχιερέα
  choice: ليصير رئيسَ كهنة
  rationale: ينقل الدخول في المنصب أو الحالة بصياغة عربية طبيعية، ويعامل «رئيس كهنة» بوصفه لقب وظيفة.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: بل مجَّده الذي قال له
  rationale: الفعل المقابل محذوف في اليونانية ومفهوم من صدر الجملة؛ أُثبت في العربية لإتمام التركيب وإيضاح أن الذي خاطبه هو الذي منحه المجد، من غير تسمية المتكلم صراحة.
- source_word: Υἱός μου εἶ σύ
  choice: أنت ابني
  rationale: ترتيب عربي طبيعي يحفظ التصريح البنوي المباشر.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: أنا اليوم ولدتك
  rationale: ترجمة مباشرة للفعل γεννάω، وتحفظ صيغة الاقتباس وتوترها اللاهوتي من غير تفسيرها على أنها تتحدث تحديدًا عن التنصيب أو القيامة أو الولادة الأزلية.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: المسيح الموعود
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني، أما إضافة «الموعود» فتزيد وصفًا غير موجود صراحة في النص.
- issue: مرجع الفاعل في «بل الذي قال له»
  choice: إبقاء هويته ضمنية كما في اليونانية
  alternative: بل الله الذي قال له
  rationale: السياق والاقتباس يدلان على الله، لكن النص اليوناني لا يسميه هنا؛ لذلك لا تُضاف التسمية إلى المتن.
- issue: معنى «أنا اليوم ولدتك» في السياق المسياني
  choice: إبقاء الاقتباس بصيغته المباشرة
  alternative: تفسيره في المتن بأنه تنصيب أو قيامة أو ولادة أزلية
  rationale: النص يقتبس مزمور 2:7 ولا يحسم في هذه العبارة وحدها كيفية ربط «اليوم» و«ولدتك» بالمسيح؛ فحُفظ التوتر اللاهوتي دون توسع تفسيري.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. استُعمل «مجَّد» حفاظًا على اللفظ اليوناني، و«ولدتك» بدل تعبيرات تفسيرية قد تحسم دلالة الاقتباس. وُضعت علامة الحاشية بعد الاقتباس كاملًا.
