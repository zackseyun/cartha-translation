    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: كما يقول أيضًا
  rationale: يحفظ أداة المقارنة ومعنى «أيضًا»، ويصل الاقتباس الثاني بما سبقه بصياغة عربية طبيعية.
- source_word: ἐν ἑτέρῳ
  choice: في موضعٍ آخر
  rationale: العبارة اليونانية موجزة، والاسم المقدر هو موضع أو نص آخر؛ والتصريح به واضح من غير توسع.
- source_word: λέγει
  choice: يقول
  rationale: يحافظ على المضارع وعلى الفاعل الشخصي المضمر، بما يوافق عرض الرسالة للكتاب بوصفه كلام الله الحاضر، من غير إضافة اسم الفاعل صراحة.
- source_word: Σὺ ἱερεὺς εἰς τὸν αἰῶνα
  choice: أنت كاهنٌ إلى الأبد
  rationale: نقل مباشر للخطاب المفرد وللوظيفة الكهنوتية، مع التعبير العربي المألوف عن الدوام.
- source_word: κατὰ τὴν τάξιν
  choice: على رتبة
  rationale: «رتبة» تلائم السياق الكهنوتي وتحفظ معنى النظام أو الفئة التي يمثلها ملكي صادق، من غير اختزالها في مجرد التشابه.
- source_word: Μελχισέδεκ
  choice: ملكي صادق
  rationale: الصيغة العربية الكتابية الشائعة للاسم، وهي تعريب للاسم العلم لا ترجمة تفسيرية له.
theological_decisions:
- issue: مرجع الفاعل في صيغة الاقتباس
  choice: «يقول» بفاعل مستتر، يفهم من السياق أنه الله
  alternative: «يقول الكتاب» أو «ورد»
  rationale: اليونانية لا تصرح بالفاعل، لكن الاستعمال في العبرانيين يعرض النص الكتابي بوصفه قولًا إلهيًا حاضرًا؛ فالإبقاء على الفاعل مستترًا يحفظ هذا الإيحاء ولا يضيف ما ليس في النص.
- issue: دلالة τάξις في اقتباس ملكي صادق
  choice: «رتبة»
  alternative: «نظام» أو «نمط» أو «مثال»
  rationale: «رتبة» تحافظ على الصلة بكهنوت ملكي صادق وبحجة الرسالة عن نوع كهنوت متميز، مع بقاء المجال الدلالي أوسع من معنى السلسلة المؤسسية وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «إلى الأبد» حفاظًا على الصياغة الكتابية الطبيعية، و«على رتبة» لما لها من وضوح في السياق الكهنوتي. وُضعت علامة الحاشية [a] بعد العبارة المعنية، و[b] بعد الاقتباس المتصل ببديل صياغة τάξις.
