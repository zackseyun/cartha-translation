  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: ar
  text: 'كما يقول أيضًا في موضعٍ آخر[a]: «أنت كاهنٌ إلى الأبد على رتبة ملكي صادق[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في نصٍّ آخر». واليونانية حرفيًا: «في آخر»، والاسم مقدَّر من السياق.'
    reason: lexical_alternative
  - marker: b
