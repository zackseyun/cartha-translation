source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: ar
  text: لِأَنَّ كُلَّ رَئِيسِ كَهَنَةٍ يُؤْخَذُ مِنْ بَيْنِ النَّاسِ، يُعَيَّنُ لِأَجْلِ النَّاسِ فِي مَا يَخُصُّ اللهَ، لِكَيْ يُقَدِّمَ قَرَابِينَ وَذَبَائِحَ عَنِ الْخَطَايَا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς γὰρ ἀρχιερεὺς
  choice: لِأَنَّ كُلَّ رَئِيسِ كَهَنَةٍ
  rationale: «كل» تنقل المفرد التوزيعي، و«لأن» تصل الآية بما قبلها بوصفها تعليلًا، و«رئيس كهنة» هو المقابل العربي الاصطلاحي الواضح للمنصب.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: يُؤْخَذُ مِنْ بَيْنِ النَّاسِ
  rationale: يحافظ المبني للمجهول على صورة النص اليوناني، و«الناس» تعبّر طبيعيًا عن البشر الذين يُؤخذ رئيس الكهنة من بينهم، من غير أن توحي بأن اللفظة اليونانية تعني الذكور حصرًا.
- source_word: ὑπὲρ ἀνθρώπων καθίσταται
  choice: يُعَيَّنُ لِأَجْلِ النَّاسِ
  rationale: «يُعيَّن» يلائم الإقامة في منصب كهنوتي، و«لأجل الناس» تنقل معنى النيابة والمنفعة الذي تؤديه ὑπέρ في السياق.
- source_word: τὰ πρὸς τὸν θεόν
  choice: فِي مَا يَخُصُّ اللهَ
  rationale: صياغة عربية واضحة وطبيعية للمصطلح اليوناني الذي يدل على الأمور المتصلة بالله وعبادته.
- source_word: ἵνα προσφέρῃ δῶρά τε καὶ θυσίας
  choice: لِكَيْ يُقَدِّمَ قَرَابِينَ وَذَبَائِحَ
  rationale: «لكي» تحفظ دلالة الغرض، و«قرابين وذبائح» تميّز بين الاسمين وتحافظ على شمولهما لأنواع التقدمات الكهنوتية.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: عَنِ الْخَطَايَا
  rationale: «عن الخطايا» تعبير عربي كتابي مفهوم في سياق الذبائح المقدمة بسبب الخطايا ومن أجل التكفير عنها، من دون إضافة لفظ «التكفير» غير المذكور صراحة هنا.
theological_decisions:
- issue: دلالة ἀνθρώπων وصياغتها من حيث الجنس
  choice: الناس في الموضعين
  alternative: الرجال في الموضعين
  rationale: ἀνθρώπων جمع ἄνθρωπος، ويمكن أن يدل على البشر عمومًا. والمقابلة المقصودة هنا هي أن رئيس الكهنة إنسان مأخوذ من جماعة البشر ومقام لأجلهم؛ أما ذكورة شاغلي المنصب تاريخيًا فلا تستلزم تضييق معنى اللفظة إلى «الرجال» في العربية.
- issue: دلالة الذبائح المرتبطة بالخطايا
  choice: عن الخطايا
  alternative: من أجل الخطايا
  rationale: تحافظ الصياغة المختارة على الصلة القربانية بالخطايا، ولا تحسم في هذه العبارة وحدها تفصيل كيفية عمل الذبيحة بما يتجاوز ما يقوله النص.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُخدم المبني للمجهول لمجاراة البنية اليونانية، مع صياغة اصطلاحية طبيعية في «رئيس كهنة» و«ما يخص الله». لا توجد حاشية لازمة لأن «الناس» تنقل المعنى البشري العام للفظة اليونانية بوضوح.
