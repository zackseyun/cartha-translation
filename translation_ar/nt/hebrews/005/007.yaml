  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: ar
  text: الذي، في أيام جسده، قدَّم صلواتٍ وتضرعاتٍ، بصراخ شديد ودموع، إلى القادر أن يخلِّصه من الموت[a]، واستُجيب له بسبب تقواه[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا فهم «يخلِّصه من الموت» بمعنى أن يخرجه من الموت، أي ينقذه بالقيامة.
    reason: alternative_reading
  - marker: b
    text: 'أو: «بسبب خشيته لله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: في أيام جسده
  rationale: يحافظ على لفظ «الجسد» الملموس وعلى دلالة العبارة إلى حياته البشرية المتجسدة، من غير استبدالها بتفسير أوسع مثل «أيام حياته على الأرض».
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: صلواتٍ وتضرعاتٍ
  rationale: يميّز بين الطلبات المرفوعة إلى الله والابتهالات الملحّة، بصياغة عربية مألوفة ورصينة.
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: إلى القادر أن يخلِّصه من الموت
  rationale: يعكس اسم الفاعل اليوناني ويحفظ احتمال أن يكون الخلاص تجنيبًا للموت أو إخراجًا منه بالقيامة.
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: بصراخ شديد ودموع
  rationale: ينقل قوة التعبير اليوناني المفرد بصياغة عربية طبيعية، من غير تخفيف لشدة المشهد.
- source_word: προσενέγκας
  choice: قدَّم
  rationale: لفظ طبيعي يحفظ معنى التقديم، مع بقاء صداه القرباني ملائمًا للسياق الكهنوتي في الرسالة دون المبالغة في إبرازه.
- source_word: εἰσακουσθεὶς
  choice: استُجيب له
  rationale: الفعل يدل على سماع الطلب سماع قبول؛ وهذه الصياغة العربية أوضح من «سُمِع له» ولا تحدد صورة الاستجابة.
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: بسبب تقواه
  rationale: تنقل معنى الورع والخشية الموقرة بإيجاز عربي طبيعي، مع إثبات البديل «خشيته لله» في الحاشية للمحافظة على المجال الدلالي.
theological_decisions:
- issue: دلالة ἀπὸ τῆς εὐλαβείας في وصف يسوع
  choice: بسبب تقواه
  alternative: 'بسبب خشيته لله؛ أو: بسبب توقيره الخاضع'
  rationale: «تقواه» تحافظ على معنى الورع والتوقير دون أن توحي بخوف مذموم، بينما تعرض الحاشية صياغة أقرب إلى عنصر الخشية في اللفظ اليوناني.
- issue: نطاق الخلاص «من الموت»
  choice: أن يخلِّصه من الموت
  alternative: أن يخلِّصه من داخل الموت، أي أن ينقذه بالقيامة
  rationale: حرف الجر ἐκ يسمح بفهم العبارة على أنها نجاة من الوقوع في الموت أو إخراج من الموت؛ لذلك لا يحسم المتن الاحتمال، وتوضحه الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حافظت الصياغة على البنية المتصلة للآية لأنها جزء من جملة ممتدة في السياق، وعلى لفظ «الجسد» والتوتر الدلالي في الخلاص من الموت. وُضعت علامتا الحاشيتين بعد العبارتين اللتين تشرحانهما مباشرة.
