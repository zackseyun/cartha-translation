  yaml_path: translation/nt/hebrews/005/010.yaml
  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: ar
  text: إذ سمّاه الله رئيسَ كهنةٍ على رتبة ملكي صادق.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إذ دعاه الله رئيسَ كهنةٍ»، أو: «إذ عيّنه الله رئيسًا للكهنة».'
    reason: lexical_alternative
  - marker: b
    text: في هذا صدى لمزمور 110:4، حيث قيل عن الكهنوت إنه «على رتبة ملكي صادق».
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: إذ سمّاه
  rationale: اسم مفعول ظرفي ماضٍ مبني للمجهول من προσαγορεύω، ويفيد أن الله سمّاه أو أعلنه بهذه الصفة. تحافظ الصياغة العربية على معنى التسمية من غير أن تضيف بالضرورة معنى التنصيب المؤسسي الأقوى.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: الله
  rationale: 'شبه الجملة اليونانية يعيّن الله فاعل التسمية في المبني للمجهول. حُوِّلت العبارة في العربية إلى تركيب معلوم طبيعي: «سمّاه الله»، من دون إضافة «الآب» غير الواردة في النص.'
- source_word: ἀρχιερεὺς
  choice: رئيسَ كهنةٍ
  rationale: المقابل العربي الواضح والمألوف للقب الكهنوتي ἀρχιερεύς، وجاء منصوبًا لأنه المفعول الثاني للفعل «سمّى».
- source_word: κατὰ τὴν τάξιν
  choice: على رتبة
  rationale: تفيد κατά هنا الموافقة أو الانتماء إلى نمط كهنوتي، و«على رتبة» تعبير عربي موجز يحفظ الصلة بصياغة مزمور 110:4 وبحجة الرسالة.
- source_word: Μελχισέδεκ
  choice: ملكي صادق
  rationale: الصيغة العربية الكتابية المألوفة للاسم، وهي تمثيل للاسم العَلَم لا تفسير لمعناه.
theological_decisions:
- issue: هل تفيد προσαγορευθεὶς مجرد التسمية والإعلان أم التعيين والتنصيب؟
  choice: إذ سمّاه الله رئيسَ كهنةٍ
  alternative: إذ عيّنه الله رئيسًا للكهنة
  rationale: اختيرت «سمّاه» لأنها أقرب إلى المجال الدلالي للفعل وتحفظ احتمال الإعلان الرسمي عن الصفة، من غير حسم النص في اتجاه تنصيب مؤسسي أو تغيير وجودي.
translation_notes:
  register: صياغة عربية فصحى واضحة وكريمة، مرتبطة بما قبلها بواسطة «إذ». استُخدم التركيب المعلوم لسلامة الأسلوب العربي مع الحفاظ على كون الله مصدر التسمية. أُبقيت العبارة الكهنوتية الموروثة «على رتبة ملكي صادق» لوضوح إحالتها النصية.
