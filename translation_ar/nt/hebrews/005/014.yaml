  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: ar
  text: أمّا الطعام الصلب فللناضجين، الذين صارت حواسهم[a] مدرَّبة بالممارسة[b] على التمييز بين الخير والشر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «الحواس»؛ والمقصود هنا مجازًا ملكات الإدراك والتمييز.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بفعل العادة»، أو «بسبب الاستعمال المعتاد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: الناضجين
  rationale: تفيد النضج والبلوغ في مقابل الأطفال في السياق السابق، من غير أن توحي بالكمال الأخلاقي المطلق.
- source_word: στερεὰ τροφή
  choice: الطعام الصلب
  rationale: يحفظ صورة المقابلة بين اللبن والطعام الذي يتناوله الناضجون، وهو تعبير عربي واضح وطبيعي.
- source_word: διὰ τὴν ἕξιν
  choice: بالممارسة
  rationale: تنقل معنى العادة أو المران المكتسب من كثرة الاستعمال، وتناسب سببية التدريب في السياق.
- source_word: τὰ αἰσθητήρια
  choice: حواسهم
  rationale: ترجمة قريبة من اللفظ اليوناني، مع إبقاء الاستعمال المجازي لملكات الإدراك وشرحه في الحاشية.
- source_word: γεγυμνασμένα ἐχόντων
  choice: صارت ... مدرَّبة
  rationale: تعبر عن الحالة الناتجة المستقرة التي يفيدها اسم المفعول التام مع فعل الامتلاك، بصياغة عربية طبيعية.
- source_word: πρὸς διάκρισιν
  choice: على التمييز
  rationale: يبين الغاية أو النتيجة المقصودة من تدريب الحواس، ويرتبط مباشرة بالخير والشر.
- source_word: καλοῦ τε καὶ κακοῦ
  choice: بين الخير والشر
  rationale: صياغة عربية مألوفة تحفظ طرفي المقابلة الأخلاقية من غير إضافة تفسيرية.
- source_word: δέ
  choice: أمّا
  rationale: تُظهر الانتقال التقابلي من اللبن الخاص بالأطفال في الآية السابقة إلى الطعام الصلب الخاص بالناضجين.
theological_decisions:
- issue: دلالة τελείων في سياق النمو الروحي
  choice: الناضجين
  alternative: الكاملين أو البالغين
  rationale: السياق يقابل الأطفال بمن بلغوا درجة من النضج والتمييز، ولا يقتضي وصفهم بالعصمة أو الكمال الأخلاقي المطلق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظت استعارة الطعام والحواس، مع توضيح الدلالة المجازية في الحاشية، واستُعمل «الناضجين» لتجنب إيحاء الكمال المطلق.
