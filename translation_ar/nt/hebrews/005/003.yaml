  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: ar
  text: وبسبب هذا[a]، يجب عليه أن يقدِّم عن الخطايا، كما يقدِّم عن الشعب، كذلك عن نفسه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بسببها»؛ والمرجّح أن الضمير يعود إلى ضعف رئيس الكهنة المذكور في الآية السابقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: وبسبب هذا
  rationale: يحفظ الدلالة السببية لحرف الجر مع ضمير لا يُصرَّح بمرجعه في متن الآية، مع إمكان رجوعه إلى الضعف المذكور في الآية السابقة.
- source_word: ὀφείλει
  choice: يجب عليه
  rationale: يعبّر بوضوح عن الواجب الملزم في سياق خدمة رئيس الكهنة، لا عن مجرد الاستحسان.
- source_word: καθὼς ... οὕτως καὶ
  choice: كما ... عن ... أيضًا
  rationale: ينقل المقابلة المتوازية بين الشعب ورئيس الكهنة بصياغة عربية طبيعية؛ وقد أُعيد الفعل في الشق الأول لوضوح التركيب.
- source_word: τοῦ λαοῦ
  choice: الشعب
  rationale: يحافظ على اللفظ العام في اليونانية، وهو مفهوم سياقيًا على أنه شعب العهد، دون إضافة تفسيرية إلى المتن.
- source_word: περὶ αὑτοῦ
  choice: عن خطاياه
  rationale: ينقل المعنى الانعكاسي «عن نفسه» في علاقته بعبارة «عن الخطايا» إلى عربية واضحة، من غير أن يعني أن ذاته هي الذبيحة.
- source_word: προσφέρειν
  choice: أن يقدِّم
  rationale: أُبقي الفعل بلا مفعول صريح كما في اليونانية، لأن السياق الكهنوتي يبيّن أن المقصود تقديم القرابين أو الذبائح.
- source_word: περὶ ἁμαρτιῶν
  choice: عن خطايا
  rationale: صياغة عربية موجزة تحفظ صلة التقديم بالخطايا، ولا تحصر العبارة في المصطلح الأضيق «ذبيحة خطية».
theological_decisions:
- issue: مرجع عبارة «بسبب هذا»
  choice: الإبقاء على الإشارة عامة في المتن، مع بيان أن الأرجح رجوعها إلى ضعف رئيس الكهنة المذكور سابقًا
  alternative: 'التصريح في المتن: «وبسبب ضعفه هذا» أو فهمها على نحو أعم بوصفها إشارة إلى حاله أو منصبه'
  rationale: الضمير المؤنث يرجع طبيعيًا إلى ἀσθένεια «الضعف» في 5:2، لكن النص نفسه يقول «بسبب هذا/بسببه»؛ لذلك تحفظ الترجمة الإحالة ويشرح الهامش المرجع المرجح.
- issue: المقدَّم في الفعل προσφέρειν
  choice: عدم إضافة «ذبائح» إلى المتن
  alternative: «أن يقدِّم ذبائح عن الخطايا»
  rationale: السياق ذبائحي بوضوح، لكن اليونانية لا تذكر مفعولًا صريحًا في هذه الآية. إبقاء «يقدِّم» يحفظ اقتصاد المصدر ولا يفرض تحديدًا زائدًا.
- issue: تقديم رئيس الكهنة عن نفسه
  choice: «عن خطاياه»
  alternative: «عن نفسه ... عن الخطايا»
  rationale: السياق، ولا سيما 7:27، يبيّن أن التقديم يتعلق بخطاياه هو. الصياغة المختارة تمنع التباس العربية الذي قد يوحي بأنه يقدّم نفسه، مع بقاء المقابلة بينه وبين الشعب.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. رُتّبت الجملة بما يلائم العربية، مع الحفاظ على المقابلة بين خطايا رئيس الكهنة وخطايا الشعب، وعلى الغموض المحدود في مرجع اسم الإشارة من خلال الهامش.
