lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: أن يترفق
  rationale: يفيد الفعل معاملةً معتدلة متزنة، بعيدة عن القسوة وعن اللامبالاة؛ و«يترفق» تعبير عربي واضح يحفظ هذا المعنى العملي والانفعالي.
- source_word: δυνάμενος
  choice: قادرًا
  rationale: اسم الفاعل يصف قدرة رئيس الكهنة المستمرة في سياق الجملة، وتحفظ «قادرًا» الصلة النحوية بما قبل الآية.
- source_word: τοῖς ἀγνοοῦσι
  choice: بالذين يجهلون
  rationale: يحفظ التعبير صيغة اسم الفاعل اليونانية دون تحويل الجهل إلى تصنيف ثابت، وتلائم الباء الفعل «يترفق» في العربية.
- source_word: πλανωμένοις
  choice: يضلّون
  rationale: ينقل معنى الانحراف أو التيه بعبارة عربية طبيعية، مع إبقاء احتمال الدلالة المبنية للمجهول في الحاشية.
- source_word: ἐπεὶ
  choice: لأنه
  rationale: تفيد الأداة تعليل قدرة رئيس الكهنة على الترفق، و«لأنه» واضحة وطبيعية في هذا الموضع.
- source_word: καὶ αὐτὸς
  choice: هو أيضًا
  rationale: يحفظ الضمير المنفصل توكيد الشخص، وتحفظ «أيضًا» القوة الإضافية التي تربطه بمن يخدمهم.
- source_word: περίκειται ἀσθένειαν
  choice: محاط بالضعف
  rationale: يحفظ الصورة الأصلية التي تصوّر الضعف محيطًا به، مع إبقاء المعنى واسعًا ليشمل الهشاشة البشرية دون قصره على الضعف الجسدي أو الأخلاقي.
theological_decisions:
- issue: طبيعة تقصير الذين يجهلون ويضلّون
  choice: لغة عامة عن الجهل والضلال
  alternative: إشارة اصطلاحية محصورة في الخطايا غير المتعمدة ضمن نظام الذبائح اللاوي
  rationale: للكلام صدى كهنوتي من العهد القديم، لكن العبارة اليونانية أوسع من مصطلح تقني محصور؛ لذلك لا يضيّق النص إلى فئة عقائدية لم يصرّح بها.
- issue: معنى ἀσθένεια في وصف رئيس الكهنة
  choice: الضعف البشري بمعناه الواسع
  alternative: الضعف الجسدي وحده أو الضعف الأخلاقي وحده
  rationale: لفظة «الضعف» تبقي مدى الدلالة مفتوحًا على الهشاشة البشرية، ولا تحسم ما لم يحسمه النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختير «يترفق» لتجنب الصياغة الخشبية، مع الحفاظ على الاعتدال المقصود، وحُفظت صورة الإحاطة في العبارة الأخيرة لقوتها وسلامتها بالعربية.
