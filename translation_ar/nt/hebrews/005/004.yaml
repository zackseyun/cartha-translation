source:
  edition: SBLGNT
  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: ar
  text: ولا يأخذ أحدٌ هذه الكرامة لنفسه، بل يُدعى من الله، كما دُعي هارون أيضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكرامة». يقول اليوناني حرفيًا «الكرامة»، والمقصود في السياق كرامة الكهنوت أو رتبته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ... τις
  choice: ولا ... أحدٌ
  rationale: 'مع النفي، تؤدي «أحد» المعنى العربي الطبيعي للنفي الشامل: لا أحد يأخذ الكرامة لنفسه.'
- source_word: ἑαυτῷ
  choice: لنفسه
  rationale: تفيد الاستئثار الشخصي بالكرامة، وهي صياغة عربية طبيعية تحافظ على دلالة ضمير الانعكاس.
- source_word: λαμβάνει
  choice: يأخذ
  rationale: تحافظ على المقابلة بين أخذ الإنسان الكرامة لنفسه وبين دعوة الله له، ولا تُضعفها إلى مجرد التلقي.
- source_word: τὴν τιμήν
  choice: هذه الكرامة
  rationale: «الكرامة» مقابل مباشر لـ τιμή، واسم الإشارة يوضح إحالتها السياقية إلى كرامة رئاسة الكهنوت من غير استبدال اللفظ بـ«المنصب».
- source_word: καλούμενος ὑπὸ τοῦ θεοῦ
  choice: يُدعى من الله
  rationale: يحفظ المبني للمجهول ويُظهر الله مصدر الدعوة، مع إبقاء التركيب المقتضب في اليونانية دون إضافة شرط صريح.
- source_word: καθώσπερ καὶ Ἀαρών
  choice: كما دُعي هارون أيضًا
  rationale: 'يُستكمل الفعل المحذوف المفهوم من السياق، فتتضح المقارنة: هارون أيضًا دعاه الله.'
theological_decisions:
- issue: طبيعة الكرامة والدعوة الكهنوتية
  choice: الكرامة لا يستأثر بها الإنسان، بل ينالها بوصفه مدعوًا من الله، وهارون هو المثال المذكور.
  alternative: قد تُفهم «الكرامة» قولًا عامًا في التكريم، أو تُترجم تفسيرًا بـ«منصب رئاسة الكهنوت».
  rationale: السياق المباشر يتناول رئيس الكهنة، لكن إبقاء «الكرامة» يصون لفظ النص واتساعه، بينما يبيّن اسم الإشارة مرجعها السياقي دون حسمها في لفظ «المنصب».
- issue: العلاقة النحوية بين النفي واسم الفاعل καλούμενος
  choice: 'صياغة المقابلة: «بل يُدعى من الله».'
  alternative: «بل حين يدعوه الله» أو «بل لا ينالها إلا من دعاه الله».
  rationale: النص اليوناني موجز ويعرض المدعو من الله في مقابلة مع من يأخذ الكرامة لنفسه. تجنبت الصياغة إضافة «فقط/إلا» أو تحويل العبارة صراحة إلى شرط، مع الحفاظ على المعنى السياقي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «دُعي» في جملة هارون لاستكمال الفعل المفهوم في اليونانية، وأُبقي «من الله» بدل صياغة أطول مثل «على يد الله». وُضعت علامة الحاشية بعد الجملة لأنها تشرح لفظ «هذه الكرامة» الوارد فيها.
