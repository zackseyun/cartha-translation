  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: ar
  text: وعن هذا[c] لنا كلام كثير، يصعب شرحه[a]، لأنكم قد صرتم متثاقلين في السماع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يصعب تفسيره» أو «يصعب بيانه».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «قد صرتم متثاقلين في السماع»؛ أي صرتم بطيئي التلقي أو فاتري الاستجابة عند تلقي التعليم.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «وعنه»؛ إذ يمكن أن يعود الضمير إلى ملكي صادق، وإن كان قد يشير أيضًا إلى الموضوع الجاري شرحه على نحو أوسع.'
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ οὗ
  choice: وعن هذا
  rationale: يحفظ احتمال الإشارة إلى الموضوع الجاري مع صياغة عربية طبيعية؛ ويمكن للضمير اليوناني أيضًا أن يعود إلى ملكي صادق شخصيًا، ولذلك لا يُفصل هذا الاحتمال عن السياق.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: لنا كلام كثير
  rationale: تعبير عربي موجز وطبيعي ينقل معنى وجود مادة كثيرة لدى الكاتب ليقولها، دون ترجمة λόγος ترجمة حرفية جامدة.
- source_word: δυσερμήνευτος λέγειν
  choice: يصعب شرحه
  rationale: ينقل التركيب بوصفه صعوبة في عرض الموضوع وبيانه بالكلام، مع إثبات البدائل المعجمية في الحاشية.
- source_word: ἐπεὶ
  choice: لأنكم
  rationale: 'ينقل بوضوح العلاقة السببية: صعوبة الشرح ناشئة عن حال المخاطَبين في التلقي.'
- source_word: νωθροὶ γεγόνατε
  choice: قد صرتم بطيئي الفهم
  rationale: «قد صرتم» تحفظ دلالة الحالة التي آلوا إليها، و«بطيئي الفهم» تعبّر في العربية الحالية عن الخمول وعدم التجاوب المقصودين في السياق التعليمي.
- source_word: ταῖς ἀκοαῖς
  choice: عند السماع
  rationale: يحفظ صورة السماع، مع بيان أن المقصود ليس عيبًا جسديًا في الأذن بل ضعف التلقي والاستجابة للتعليم.
theological_decisions:
- issue: مرجع Περὶ οὗ
  choice: 'الإشارة أساسًا إلى الموضوع الجاري: «عن هذا»'
  alternative: 'الإشارة شخصيًا إلى ملكي صادق: «عنه»'
  rationale: السياق السابق يذكر ملكي صادق، فيصح المرجع الشخصي نحويًا، لكن الجملة تمهّد أيضًا لعرض موضوع أوسع عن الكهنوت. اختيرت صياغة تشير إلى الموضوع مع حاشية تحفظ الاحتمال الآخر.
translation_notes:
  register: عربية فصحى واضحة ووقورة. استُعمل «بطيئي الفهم عند السماع» لتوضيح المجاز مع إبقاء صورة السماع، وتجنُّب إيحاء وجود ضعف سمع جسدي. وُضعت علامتا الحاشية كلتاهما في المتن.
