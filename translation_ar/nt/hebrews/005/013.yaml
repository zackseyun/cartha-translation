source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: ar
  text: لِأَنَّ كُلَّ مَنْ يَتَنَاوَلُ اللَّبَنَ لَا خِبْرَةَ لَهُ بِكَلِمَةِ الْبِرِّ[a][b]، لِأَنَّهُ رَضِيعٌ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رسالة البر»، أو «الكلمة عن البر».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «العدل» بدلًا من «البر».'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς
  choice: كل من
  rationale: ينقل المعنى التوزيعي للتعبير اليوناني، أي كل فرد ينطبق عليه الوصف.
- source_word: ὁ μετέχων
  choice: يتناول
  rationale: يحافظ على صورة تناول اللبن من غير أن يضيف معنى الاعتماد الحصري عليه، كما قد يوحي تعبير «يقتات».
- source_word: γάλακτος
  choice: اللبن
  rationale: أُبقيت الاستعارة الحسية كما هي، وهي واضحة في سياق الحديث عن النضج والتعليم.
- source_word: ἄπειρος
  choice: لا خبرة له
  rationale: يدل اللفظ على انعدام الخبرة أو التمرس، لا بالضرورة على الجهل التام.
- source_word: λόγου δικαιοσύνης
  choice: كلمة البر
  rationale: صياغة موجزة تحافظ على تركيب الإضافة اليوناني وعلى سعته الدلالية، من غير حسم ما إذا كان المقصود كلمة تتصف بالبر أو رسالة تتناول البر.
- source_word: δικαιοσύνης
  choice: البر
  rationale: «البر» هو المقابل العربي المألوف في السياق الكتابي، مع إثبات «العدل» بوصفه احتمالًا دلاليًا في الحاشية.
- source_word: νήπιος
  choice: رضيع
  rationale: يناسب صورة اللبن ويعبّر بوضوح عن عدم النضج المقصود في الاستعارة.
- source_word: γάρ
  choice: لأن
  rationale: نُقلت المرتان بأداة تعليل واضحة وطبيعية في العربية، محافظةً على الترابط الحجاجي في النص.
theological_decisions:
- issue: دلالة δικαιοσύνη
  choice: البر
  alternative: العدل
  rationale: يحفظ «البر» الدلالة الأخلاقية والروحية الأوسع الملائمة للسياق، بينما تُذكر دلالة «العدل» الممكنة في الحاشية من غير فرضها على المتن.
- issue: علاقة الإضافة في λόγου δικαιοσύνης
  choice: كلمة البر
  alternative: الرسالة عن البر / كلمة تتصف بالبر
  rationale: التركيب اليوناني موجز ويحتمل أكثر من تحديد للعلاقة بين الاسمين؛ لذلك حُفظ إيجازه في المتن وأُوضحت الاحتمالات في الحاشية.
- issue: النوع النحوي في νήπιος ... ἐστιν
  choice: لأنه رضيع
  alternative: لأن مثل هذا الشخص رضيع
  rationale: يحافظ الضمير المذكر المفرد على صورة التركيب اليوناني العام، وهو استعمال عربي طبيعي يشمل كل فرد داخل الفئة المذكورة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل «اللبن» و«رضيع» للمحافظة على ترابط الاستعارة، وحُفظ تكرار أداة التعليل بما يلائم منطق العبارة اليونانية.
