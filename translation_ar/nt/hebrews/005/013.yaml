  terminology: «البر» مقابل مناسب لـδικαιοσύνης في المتن، وتحفظ الحاشية البديل الدلالي «العدل». كما أن «كلمة البر» تحافظ على اتساع λόγου δικαιοσύνης، وتعرض الحاشية بدائل عربية مفيدة من غير تضييق للمعنى.
