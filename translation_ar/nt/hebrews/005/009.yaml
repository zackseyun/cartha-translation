  source_fidelity: 'ينقل المتن عناصر اليونانية بدقة: «وإذ» تؤدي καὶ مع صلة سياقية مناسبة، و«بلغ الكمال» تعبر طبيعيًا عن τελειωθεὶς في سياق العبرانيين بوصفه بلوغًا للغاية، و«صار» تقابل ἐγένετο، و«لجميع الذين يطيعونه» تحفظ شمول πᾶσιν واستمرار/صفة اسم الفاعل ὑπακούουσιν، و«سبب خلاص أبدي» يؤدي αἴτιος σωτηρίας αἰωνίου. الصياغة الأساسية لا تدّعي حسمًا زائدًا لدلالة التكميل، وتُظهر الحاشية البديل المبني للمجهول.'
