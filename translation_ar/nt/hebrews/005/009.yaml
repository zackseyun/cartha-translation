  text: καὶ τελειωθεὶς ἐγένετο ⸂πᾶσιν τοῖς ὑπακούουσιν αὐτῷ⸃ αἴτιος σωτηρίας αἰωνίου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/009.yaml
  text: and[a], having been made perfect, he became the source of eternal salvation to all who obey him[b],
translation:
  language: ar
  text: وإذ بَلَغَ الكمالَ[a]، صار لجميع الذين يطيعونه سببَ خلاصٍ أبديٍّ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إذ جُعِل كاملًا» أو «إذ أُكمِل». يُرجَّح أن المقصود بلوغه تمام غايته في دوره الكهنوتي وعمله الخلاصي، لا تحسّنًا أخلاقيًا بعد نقص.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مصدرَ خلاصٍ أبديٍّ» أو «مُنشئَ خلاصٍ أبديٍّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τελειωθεὶς
  choice: إذ بَلَغَ الكمالَ
  rationale: ينقل بلوغ الغاية والاكتمال المقصودين في السياق، ولا يوحي بانتقال المسيح من نقص أخلاقي إلى صلاح. وصيغة المبني للمجهول في اليونانية يمكن أن تُفهم حرفيًا «إذ جُعِل كاملًا»، وقد ذُكرت في الحاشية.
- source_word: ἐγένετο
  choice: صار
  rationale: يدل على الدخول في الحالة أو الدور الناتج بعد بلوغ الكمال، وهو تعبير عربي موجز وطبيعي.
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: لجميع الذين يطيعونه
  rationale: يحفظ معنى الطاعة الصريح، ويجعل اللام المستفيدين من الخلاص من غير اختزال الطاعة في مفهوم تفسيري آخر.
- source_word: αἴτιος
  choice: سبب
  rationale: اللفظة تدل على المسؤول أو المتسبب في تحقق الأمر. «سبب» أقرب إلى الدلالة السببية المباشرة، مع ذكر «مصدر» في الحاشية بوصفه بديلًا عربيًا سائغًا.
- source_word: σωτηρίας
  choice: خلاص
  rationale: يحفظ المصطلح اللاهوتي المستقر في سياق الرسالة إلى العبرانيين.
- source_word: αἰωνίου
  choice: أبديّ
  rationale: المقابل العربي الطبيعي للصفة الدالة هنا على دوام الخلاص.
- source_word: καὶ
  choice: و
  rationale: يحفظ الربط البسيط بالسياق السابق دون تحميله علاقة منطقية أضيق.
theological_decisions:
- issue: دلالة τελειωθεὶς في وصف المسيح
  choice: إذ بَلَغَ الكمالَ
  alternative: إذ جُعِل كاملًا؛ إذ أُكمِل
  rationale: تحفظ الصياغة فكرة بلوغ الغاية واكتمال الدور الكهنوتي والفدائي، ولا تفترض نقصًا أخلاقيًا سابقًا. وتعرض الحاشية الصيغة الأقرب بنيويًا إلى المبني للمجهول حتى لا يُحجب احتمالها الدلالي.
- issue: نطاق الخلاص وعلاقته بطاعة المسيح
  choice: لجميع الذين يطيعونه
  alternative: لجميع الذين يسمعون له
  rationale: يبقي النص لغة الطاعة كما هي، من غير تليينها إلى الإيمان وحده أو توسيعها ضمن منظومة مذهبية.
- issue: القوة السببية في αἴτιος
  choice: سبب خلاص أبدي
  alternative: مصدر خلاص أبدي؛ مُنشئ خلاص أبدي
  rationale: يحفظ إسناد تحقق الخلاص إليه بوضوح، من غير فرض معنى أدبي محتمل في لفظ «مؤلف» أو معنى مذهبي زائد.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُعمل «بلغ الكمال» لتجنب الإيحاء العربي الشائع بأن المسيح كان ناقصًا أخلاقيًا، مع إبقاء المبني للمجهول اليوناني ظاهرًا في الحاشية. وُضع كل مؤشّر حاشية في المتن.
