source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: ar
  text: فمع أنه كان ينبغي لكم، بالنظر إلى طول المدة، أن تكونوا معلّمين، فإنكم تحتاجون من جديد إلى مَن يعلّمكم بعض المبادئ الأولية لأقوال الله[a]، وقد صرتم محتاجين إلى اللبن، لا إلى الطعام الصلب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العناصر الأولية في بداية أقوال الله». والمقصود بـ«أقوال الله» أقواله أو إعلاناته الإلهية، لا أقوال العرّافين الوثنية.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι
  choice: كان ينبغي لكم أن تكونوا
  rationale: ينقل معنى الالتزام المتوقع أو ما كان يليق أن يصيروا إليه، من غير صياغة قانونية مفرطة.
- source_word: διδάσκαλοι
  choice: معلّمين
  rationale: المقابل العربي المعياري والطبيعي لمن صار مؤهلًا لتعليم الآخرين.
- source_word: διὰ τὸν χρόνον
  choice: بالنظر إلى طول المدة
  rationale: يوضح أن الزمن المنقضي كان كافيًا لبلوغ النضج المتوقع، مع الحفاظ على الدلالة السببية الزمنية للعبارة اليونانية.
- source_word: πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: تحتاجون من جديد إلى مَن يعلّمكم
  rationale: صياغة عربية طبيعية تحفظ معنى تكرار الحاجة إلى التعلّم، وتجعل الفاعل المفهوم ضمنًا صريحًا للوضوح.
- source_word: τινὰ τὰ στοιχεῖα
  choice: العناصر الأولية
  rationale: تعبر عن المكوّنات التمهيدية أو الأساسيات بلغة واضحة، من غير تحويلها إلى منهج عقائدي محدد.
- source_word: τῆς ἀρχῆς
  choice: لبداية
  rationale: تحفظ بنية الإضافة والتوكيد على ما يخص المرحلة الأولى، رغم ما في التركيب من تكرار مقصود مع «العناصر الأولية».
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: أقوال الله
  rationale: «أقوال» تنقل معنى λόγια بوصفها أقوالًا أو إعلانات إلهية، وتتفادى الإيحاء العربي الشائع للعرافة في لفظ «وحي/نبوءات العرّافين».
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: قد صرتم محتاجين
  rationale: يحفظ دلالة الصيرورة والنتيجة الحاضرة التي يفيدها الفعل في صيغة التام.
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: إلى اللبن، لا إلى الطعام الصلب
  rationale: يحافظ على الاستعارة الأصلية والتقابل البلاغي من غير تفسير مذهبي زائد.
theological_decisions:
- issue: التقابل المجازي بين اللبن والطعام الصلب
  choice: الإبقاء على الاستعارة كما هي للدلالة السياقية على عدم النضج في التعلّم في مقابل النضج
  alternative: التصريح بـ«التعليم الابتدائي» و«التعليم المتقدم»
  rationale: النص نفسه لا يحدد منهجًا تقنيًا أو نظامًا طائفيًا، والإبقاء على الصورة يحفظ قوة خطاب الكاتب واتساع دلالتها.
- issue: دلالة λόγια τοῦ θεοῦ
  choice: أقوال الله
  alternative: إعلانات الله أو وحي الله
  rationale: يحفظ معنى الأقوال الإلهية من غير حصرها في نوع واحد من الوحي أو إضفاء دلالة وثنية مرتبطة بالعرافة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التكرار الدلالي في «العناصر الأولية لبداية» لأنه يعكس تركيب الأصل وتشديده على الرجوع إلى أوليات التعليم، ووُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحهما الحاشيتان فعلًا.
