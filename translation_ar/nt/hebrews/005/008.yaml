  text: مع أنه كان ابنًا[a]، تعلَّم الطاعة مما عاناه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «مع أنه كان الابن». جاءت كلمة «ابن» في اليونانية بلا أداة تعريف، ويمكن فهمها بوصفها وصفًا لبنوّته أو إشارة إلى الابن المعروف من السياق.'
