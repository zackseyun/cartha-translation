    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: مع أنه
  rationale: 'تفيد الأداة معنى الاستدراك والتنازل: فعلى الرغم من كونه ابنًا، تعلَّم الطاعة من خلال المعاناة.'
- source_word: ὢν
  choice: كان
  rationale: اسم الفاعل من فعل الكينونة، وصياغته جملة فعلية هي الأسلس في العربية ضمن تركيب «مع أنه كان».
- source_word: υἱός
  choice: ابنًا
  rationale: الاسم في اليونانية بلا أداة تعريف وجاء خبرًا، فحُفظ عدم التعريف في المتن، مع بقاء الإشارة في السياق إلى بنوّة يسوع.
- source_word: ἔμαθεν
  choice: تعلَّم
  rationale: ينقل الفعل دلالته المباشرة على التعلّم، من غير تلطيف العبارة أو إزالة ما فيها من توتر لاهوتي.
- source_word: ἀφ’ ὧν
  choice: مما
  rationale: تفيد ἀπό هنا المصدر أو الوسيلة التي جاء منها التعلّم، و«مما» موجزة وطبيعية في العربية.
- source_word: ἔπαθεν
  choice: عاناه
  rationale: يعبر عن الآلام التي اختبرها واحتملها فعلًا، ويلائم صلة الموصول في العبارة العربية «مما عاناه».
- source_word: τὴν ὑπακοήν
  choice: الطاعة
  rationale: حُفظ التعريف الموجود في اليونانية، و«الطاعة» تعبّر عن الاستجابة الخاضعة لإرادة الله.
theological_decisions:
- issue: صياغة بنوّة المسيح مع كونه قد تعلَّم
  choice: مع أنه كان ابنًا
  alternative: مع أنه كان الابن
  rationale: تحفظ الصياغة التباين الذي يقرره النص بين بنوّته الحقيقية وتعلّمه الطاعة في المعاناة، كما تعكس غياب أداة التعريف في اليونانية من غير أن تنفي هوية الابن المعروفة من السياق.
- issue: هل يعني «تعلَّم الطاعة» وجود عصيان سابق أو نقص أخلاقي؟
  choice: الإبقاء على العبارة المباشرة «تعلَّم الطاعة»
  alternative: اختبر الطاعة عمليًا؛ تعلَّم كلفة الطاعة
  rationale: النص اليوناني يصرّح بأنه تعلَّم الطاعة، لذلك لا ينبغي استبدال العبارة بتفسير يزيل توترها. وتوضح الحاشية أن المقصود تعلّم اختباري في المعاناة، لا انتقال من العصيان إلى الطاعة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة. استُخدم «مما عاناه» لصياغة طبيعية تحفظ كون المعاناة مصدر التعلّم، وأُبقيت العبارة اللاهوتية المباشرة بلا توسع تفسيري داخل المتن.
