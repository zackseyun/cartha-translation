    reason: قراءة بديلة تُظهر اسمي المكان العبريين اللذين تقابلهما الألفاظ الوصفية في النص اليوناني.
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: فلا تقسّوا
  rationale: صيغة نهي مباشرة، والفعل المتعدي يحافظ على مسؤولية المخاطَبين عن تقسية قلوبهم.
- source_word: τὰς καρδίας ὑμῶν
  choice: قلوبكم
  rationale: يحفظ الخطاب الموجّه إلى الجماعة، ويستعمل «القلوب» بالمعنى الكتابي للباطن، بما يشمل الإرادة والفكر والتوجّه.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: كما في التمرّد
  rationale: يعبّر «التمرّد» بوضوح عن العصيان الذي استفزّ الله، مع ترجمة الاسم اليوناني وصفيًا بدل إحلال اسم المكان العبري محلّه.
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: كما في يوم الاختبار
  rationale: تُفهم κατά هنا على معنى المقارنة المتوازية مع ὡς، و«الاختبار» أنسب للسياق التاريخي من «التجربة» التي قد توحي بالإغراء إلى الخطيئة.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: «البرية» هي المقابل العربي الكتابي الطبيعي لسياق تيه إسرائيل، وتحفظ صداه التاريخي.
theological_decisions:
- issue: صياغة الإشارة التاريخية إلى مزمور 95
  choice: 'ترجمة الاسمين اليونانيين وصفيًا: «التمرّد» و«يوم الاختبار»'
  alternative: «كما عند مريبة، كما في يوم مسّة في البرية»
  rationale: رسالة العبرانيين تورد النص اليوناني الذي يمثل اسمي المكان العبريين بألفاظ تفسيرية. تلتزم الصياغة الأساسية بالنص اليوناني، مع حفظ الخلفية العبرية المهمة في الحاشية.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية رصينة. استُعملت «تقسّوا» و«البرية» لصياغتهما الطبيعية المألوفة، مع إبقاء التوازي «كما... كما...» ظاهرًا.
