  text: فَلَا تُقَسُّوا قُلُوبَكُمْ كَمَا فِي التَّمَرُّدِ، كَمَا فِي يَوْمِ الِاخْتِبَارِ فِي الْبَرِّيَّةِ.[a]
  philosophy: optimal-equivalence
  footnotes:
