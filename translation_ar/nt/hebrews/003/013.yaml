reference: Hebrews 3:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: ar
  text: 'بل شجِّعوا بعضكم بعضًا كلَّ يوم[b]، ما دام يُقال: «اليوم»[a]، لئلّا يتقسّى أحدٌ منكم بخداع الخطيئة.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «اليوم» صدى للمزمور 95، ويشير إلى الوقت الحاضر الذي ينبغي فيه الاستجابة لنداء الله.
    reason: cross_reference
  - marker: b
    text: 'أو: «حُثّوا بعضكم بعضًا». يمكن أن يعني الفعل اليوناني التشجيع أو الحثّ أو المناشدة أو التعزية بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد مقابلة قوية مع التحذير السابق، و«بل» طبيعية وموجزة في هذا السياق.
- source_word: παρακαλεῖτε
  choice: شجِّعوا
  rationale: للفعل مجال دلالي يشمل التشجيع والحثّ والتعزية؛ و«شجِّعوا» تؤدي هنا معنى التقوية المتبادلة على الثبات، مع إثبات البديل في الحاشية.
- source_word: ἑαυτοὺς
  choice: بعضكم بعضًا
  rationale: الضمير الانعكاسي مع أمر الجمع يفيد التبادل هنا، وهذه الصياغة العربية توضح المسؤولية الجماعية.
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: كلَّ يوم
  rationale: تنقل بوضوح معنى التكرار اليومي.
- source_word: ἄχρις οὗ
  choice: ما دام
  rationale: تبرز استمرار الفترة التي يبقى فيها النداء المسمّى «اليوم» قائمًا، بدل التركيز فقط على نهايتها.
- source_word: τὸ Σήμερον καλεῖται
  choice: 'يُقال: «اليوم»'
  rationale: تحافظ على المبني للمجهول وعلى الصدى النصي للمزمور 95، وتضع «اليوم» بوصفه تعبيرًا مقتبسًا ذا دلالة خاصة.
- source_word: ἵνα μὴ
  choice: لئلّا
  rationale: صياغة عربية فصيحة ومباشرة للغاية السلبية المراد تجنبها.
- source_word: σκληρυνθῇ
  choice: يتقسّى
  rationale: فعل مبني للمجهول صرفيًا في العربية، يحفظ وقوع التقسية على الشخص من غير تعيين فاعل مباشر.
- source_word: τις ἐξ ὑμῶν
  choice: أحدٌ منكم
  rationale: مع النفي في «لئلّا» تؤدي العبارة معنى ألا يقع ذلك لأي فرد من الجماعة.
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: بخداع الخطيئة
  rationale: تُفهم الباء على أنها للسبب أو الوسيلة، وتُبقي الإضافة احتمال كون الخطيئة خادعة أو مصدرًا للخداع من غير توسع تفسيري.
theological_decisions:
- issue: دلالة الأمر المتبادل
  choice: بعضكم بعضًا
  alternative: أنفسكم
  rationale: مع أن اللفظ اليوناني انعكاسي في صورته، فإن أمر الجمع يمنحه هنا قوة تبادلية؛ والصياغة المختارة تمنع فهمه بوصفه واجبًا فرديًا منعزلًا.
- issue: دلالة «اليوم»
  choice: «اليوم» بوصفه صدى للمزمور 95 وزمن الاستجابة الحاضر
  alternative: اليوم بمعناه الزمني العادي وحده
  rationale: السياق القريب في عبرانيين 3 يقتبس المزمور 95؛ وعلامتا الاقتباس والحاشية تحفظان هذه الدلالة من غير تحميل المتن تفسيرًا زائدًا.
- issue: مصدر التقسية ودور الخطيئة
  choice: الإبقاء على المبني للمجهول وربط التقسية بخداع الخطيئة
  alternative: التصريح بأن الإنسان يقسّي نفسه أو أن الله يقسّيه
  rationale: النص لا يسمّي الفاعل في σκληρυνθῇ، لذلك لا ينبغي حسم التوتر اللاهوتي بإضافة فاعل غير مذكور.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «الخطيئة» للمفهوم الأخلاقي اللاهوتي، وحُفظ الإيجاز والإلحاح في الأمر اليومي، مع وضع علامتي الحاشية في المتن عند موضعيهما.
