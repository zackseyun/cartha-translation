    rationale: الأصل يحذف صفة/فعل الأمانة اتكالًا على الآية السابقة، والترجمة الإنجليزية تُظهره بصيغة الماضي. «كان أمينًا بصفته ابنًا» يبيّن هذا الإضمار في عربية سليمة من غير إضافة معنى جديد.
  - severity: low
