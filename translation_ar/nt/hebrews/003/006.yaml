  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: ar
  text: أَمَّا الْمَسِيحُ[a] فَكَانَ أَمِينًا بِصِفَتِهِ ابْنًا عَلَى بَيْتِهِ[b]. وَنَحْنُ بَيْتُهُ، إِنْ تَمَسَّكْنَا بِالْجُرْأَةِ[c] وَبِفَخْرِ رَجَائِنَا[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا نقل اللفظة اليونانية بـ«كريستوس» بوصفها تسمية شبيهة بالاسم؛ فهي قد تُستعمل لقبًا بمعنى «المسيح» أو تسميةً متداولة.
    reason: alternative_reading
  - marker: b
    text: الضمير في «بيته» يعود في السياق على الأرجح إلى الله، لكن الصياغة يمكن أن تُفهَم أيضًا على أنها تشير إلى بيت المسيح.
    reason: referential_ambiguity
  - marker: c
    text: أو «الثقة». تدل الكلمة اليونانية على الصراحة والانفتاح والجرأة الواثقة.
    reason: lexical_alternative
  - marker: d
    text: أو «اعتزازنا برجائنا»، أو «ما نفتخر به من رجائنا». قد تدل الكلمة اليونانية على الفخر نفسه أو على ما يدعو إليه.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: الْمَسِيحُ
  rationale: يحافظ على القوة اللقبية للكلمة في المقابلة بين موسى والمسيح، مع التنبيه إلى إمكان استعمالها كتسمية «المسيح/كريستوس» بحسب السياق.
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: ينقل المقابلة مع موسى في الآية السابقة بصياغة عربية طبيعية واضحة.
- source_word: ὡς υἱὸς
  choice: بِصِفَتِهِ ابْنًا
  rationale: يحفظ معنى المقارنة والصفة في ὡς، من غير إضافة أداة تعريف غير موجودة في اليونانية.
- source_word: πιστός (مفهومة من السياق السابق)
  choice: أَمِينٌ
  rationale: الصفة محذوفة في صياغة الآية اختصارًا، لكنها محمولة من المقابلة السابقة مع أمانة موسى؛ وإظهارها ضروري لاكتمال الجملة العربية.
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: عَلَى بَيْتِهِ
  rationale: تفيد ἐπί هنا الإشراف والسلطان، وتحافظ «بيته» على استعارة البيت وعلى ضمير الأصل من غير حسم مرجعه داخل المتن.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: وَنَحْنُ ذَلِكَ الْبَيْتُ
  rationale: صياغة عربية طبيعية تحافظ على الاستعارة وعلى رجوع اسم الموصول اليوناني إلى البيت المذكور.
- source_word: ἐὰν
  choice: إِنْ
  rationale: تنقل الشرط الحقيقي من غير تشديد تفسيري مثل «بشرط أن» أو إضافة «حقًا».
- source_word: παρρησίαν
  choice: الْجُرْأَةِ
  rationale: تحفظ معنى الصراحة والشجاعة الواثقة، مع ذكر «الثقة» بديلًا معجميًا في الحاشية.
- source_word: καύχημα τῆς ἐλπίδος
  choice: الافْتِخَارِ بِرَجَائِنَا
  rationale: يعكس معنى الاعتزاز أو التباهي القائم على الرجاء، ويجعل العلاقة بين المصدر والرجاء طبيعية في العربية؛ وأضيف ضمير المتكلمين الذي يدل عليه سياق «نحن» والفعل الجمع.
- source_word: κατάσχωμεν
  choice: تَمَسَّكْنَا
  rationale: ينقل معنى الاحتفاظ الثابت والمثابرة بصياغة عربية مألوفة وقوية.
theological_decisions:
- issue: هل Χριστός لقب أم تسمية شبيهة بالاسم؟
  choice: الْمَسِيحُ
  alternative: كريستوس / المسيح بوصفه اسمًا متداولًا
  rationale: المقابلة مع موسى تُبرز القوة اللقبية، لكن الحاشية تصون إمكان الاستعمال الاسمي للكلمة اليونانية.
- issue: مرجع الضمير في αὐτοῦ ضمن «بيته»
  choice: إبقاء الضمير من غير استبداله باسم صريح
  alternative: بيت الله، أو بيت المسيح
  rationale: السياق يرجّح بيت الله، إلا أن صوغ اليونانية يسمح بارتباط الضمير بالمسيح؛ لذلك لا يحسم المتن ما لم يحسمه الأصل.
- issue: قوة الشرط في ἐὰν ... κατάσχωμεν
  choice: إِنْ تَمَسَّكْنَا
  alternative: بِشَرْطِ أَنْ نَتَمَسَّكَ، أو إِنْ كُنَّا نَتَمَسَّكُ حَقًّا
  rationale: يحفظ الشرط المتعلق بالثبات والمثابرة من غير فرض تصور مذهبي معين عن الارتداد أو حفظ المؤمنين.
- issue: إظهار صفة الأمانة المحذوفة بلاغيًا
  choice: فَأَمِينٌ
  alternative: تركها محذوفة كما في الصياغة اليونانية المختصرة
  rationale: المقابلة النحوية تحمل «أمين» من السياق السابق، وإظهارها يجعل العربية تامة ومفهومة من غير تغيير المعنى.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل تركيب «أمّا ... فـ» لإبراز المقابلة، وحُفظت استعارة البيت والشرط اللاهوتي من غير تفسير مذهبي زائد. جميع علامات الحواشي مثبتة في المتن.
