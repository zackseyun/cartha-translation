  source_fidelity: يحافظ النص على مقابلة موسى بالمسيح، وعلى معنى الابن القائم على البيت، واستعارة البيت، والشرط المتصل بالتمسك. لكن الصياغة المنقحة تجعل الفعل المضمر المستفاد من السياق السابق («كان أمينًا») أوضح وأقرب إلى البنية اليونانية والسجل العربي.
  naturalness: «كان أمينًا بصفته ابنًا على بيته» أفصح وأسلس من «فأمينٌ بصفته ابنًا»، و«نحن بيته» أوضح وأقرب إلى علاقة الضمير في الأصل من «نحن ذلك البيت».
  terminology: «المسيح»، «ابنًا»، «بيته»، «الجرأة»، و«فخر رجائنا» تحفظ المصطلحات والاستعارة دون حسم مرجع الضمير أو تحميل الشرط تفسيرًا مذهبيًا.
  issues:
