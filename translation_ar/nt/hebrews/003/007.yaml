source:
  edition: SBLGNT
  text: Διό, καθὼς λέγει τὸ πνεῦμα τὸ ἅγιον· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: ar
  text: 'لذلك، كما يقول الروح القدس: «اليوم، إن سمعتم صوته،»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: لذلك
  rationale: أداة استنتاج تربط الاقتباس بالحجة السابقة، و«لذلك» واضحة وطبيعية وتحفظ العلاقة المنطقية.
- source_word: καθὼς
  choice: كما
  rationale: تقدّم صيغة الاقتباس والمقارنة دون زيادة تفسيرية، وهي الأنسب في العربية الفصحى المعاصرة.
- source_word: λέγει
  choice: يقول
  rationale: يحفظ زمن المضارع في صيغة الاستشهاد، فيعرض قول الكتاب بوصفه خطابًا حاضرًا.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: المقابل العربي المعياري والدقيق للعبارة اليونانية المعرّفة، من غير إضافة توكيد غير موجود في النص.
- source_word: Σήμερον
  choice: اليوم
  rationale: ينقل الظرف الزمني المباشر الذي يبدأ به اقتباس المزمور.
- source_word: ἐὰν
  choice: إن
  rationale: أداة شرط فصيحة وطبيعية تلائم جواب الشرط الوارد في الآية التالية وتحفظ بنية الاقتباس المعلّقة هنا.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: صوته
  rationale: الفعل ἀκούω مع المضاف إليه يُنقل طبيعيًا إلى العربية بمفعول مباشر، و«صوته» يحفظ الطابع الشخصي للعبارة.
- source_word: ἀκούσητε
  choice: سمعتم
  rationale: صيغة الماضي بعد «إن» أسلوب عربي فصيح للتعبير عن الشرط المستقبل أو العام، وتحفظ المعنى الأساسي للسماع دون تفسيره بالطاعة.
theological_decisions:
- issue: نسبة القول في اقتباس المزمور
  choice: نسبة القول مباشرة إلى الروح القدس
  alternative: الروح القدس يتكلم بواسطة الكتاب أو صاحب المزمور
  rationale: النص اليوناني يصرّح بأن «الروح القدس يقول». تحافظ الصياغة على هذه النسبة المباشرة دون توسيعها إلى شرح لعقيدة الوحي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت صيغة المضارع في «يقول»، وبقي الشرط مفتوحًا لأن جوابه يرد في الآية التالية. لا توجد حواشٍ، ولذلك لا توجد علامات حواشٍ في المتن.
