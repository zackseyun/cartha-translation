  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: ar
  text: وأمّا موسى فكان أمينًا في كلّ بيته بصفته خادمًا[a]، شهادةً على ما كان سيُقال[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي خادمًا مكرَّمًا أو ملازمًا للخدمة؛ واللفظة اليونانية هنا غير اللفظة التي تعني «عبدًا» مملوكًا.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «شهادةً للأمور التي كان سيُقال عنها». تشير العبارة إلى قول أو إعلان يأتي لاحقًا، من غير أن يسمّي النص هنا المتكلم.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ... μὲν
  choice: وأمّا
  rationale: تربط الآية بما قبلها وتُبقي التمهيد للمقابلة التي تتمّ بأداة δέ في الآية التالية، في صياغة عربية طبيعية.
- source_word: Μωϋσῆς
  choice: موسى
  rationale: الصيغة العربية المعيارية للاسم الكتابي.
- source_word: πιστὸς
  choice: أمينًا
  rationale: تعبّر عن الأمانة والجدارة بالثقة في أداء الخدمة، وتلائم صدى عدد 12:7 والسياق المباشر.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: في كلّ بيته
  rationale: تحافظ على صورة «البيت» الممتدة في العبرانيين 3 وعلى صلتها بعدد 12:7، من غير حصرها في منزل حرفي.
- source_word: ὡς θεράπων
  choice: بصفته خادمًا
  rationale: تدل على دور موسى في خدمة مكرّمة، وتحافظ على تمييز θεράπων عن لفظ العبد المملوك δοῦλος.
- source_word: εἰς μαρτύριον
  choice: شهادةً
  rationale: 'تنقل معنى الغاية أو الوظيفة بإيجاز عربي طبيعي: كانت خدمته الأمينة شهادةً.'
- source_word: τῶν λαληθησομένων
  choice: لما كان سيُقال
  rationale: تحافظ على صيغة المستقبل المبني للمجهول وعلى احتمال دلالة العبارة على ما سيُعلَن لاحقًا، من غير تعيين المتكلم أو مضمون القول في النص.
theological_decisions:
- issue: مرجع «بيته» وطبيعة صورة البيت
  choice: الإبقاء على «بيته» بوصفها الصورة الكتابية لمجال بيت الله الذي خدم فيه موسى.
  alternative: «أهل بيته» أو «جميع أهل بيته» بوصفها صياغة تصرّح بالمعنى الجماعي.
  rationale: السياق اللاحق يطوّر صورة البيت، والنص يردّد عدد 12:7؛ لذلك يحفظ اللفظ المجاز والترابط من غير أن يحسمه في معنى المنزل الحرفي أو الجماعة وحدها.
- issue: دلالة θεράπων
  choice: «خادم» ذو منزلة خدمة مكرّمة، لا «عبد».
  alternative: «ملازم» أو «مكلَّف بالخدمة».
  rationale: اللفظة تختلف عن δοῦλος وتدعم المقابلة بين موسى الخادم والابن في الآية التالية، من غير الانتقاص من منزلة موسى.
- issue: مرجع الأمور التي سيُقال عنها أو القول الآتي
  choice: 'صياغة موجزة مبنية للمجهول: «لما كان سيُقال».'
  alternative: «شهادةً للأمور التي كان سيُتكلَّم عنها» أو «لما كان سيُعلَن لاحقًا».
  rationale: يحمل التركيب اليوناني غموضًا مشروعًا بشأن مضمون القول وصاحبه، فلا ينبغي قصره صراحةً على إعلان بعينه، وإن كان السياق يوجّه إلى إعلان إلهي لاحق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «وأمّا» لإظهار المقابلة الممتدة إلى الآية التالية، وحُفظت صورة «البيت» والغموض في العبارة المستقبلية المبنية للمجهول.
