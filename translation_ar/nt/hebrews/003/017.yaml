  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: ar
  text: وعلى مَن غضب أربعين سنة؟ أليس على الذين أخطأوا وسقطت جثثهم في البرية؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσώχθισεν
  choice: غضب
  rationale: ينقل معنى السخط والغضب على أشخاص بعبارة عربية واضحة وطبيعية، مع بقاء الله فاعلًا مفهومًا من السياق.
- source_word: τεσσεράκοντα ἔτη
  choice: أربعين سنة
  rationale: منصوب الزمان في اليونانية يدل على مدة الاستمرار، والتعبير العربي يؤدي معنى «لمدة أربعين سنة» بإيجاز طبيعي.
- source_word: ἁμαρτήσασιν
  choice: الذين أخطأوا
  rationale: ترجمة مباشرة لاسم الفاعل الذي يحدد جماعة العصاة في جيل البرية، من غير إضافة تحديد غير وارد في النص.
- source_word: κῶλα
  choice: جثثهم
  rationale: اللفظة تعني حرفيًا أعضاء الأجساد، وتدل في هذا السياق على الأجساد الساقطة بالموت. «جثثهم» تحفظ قوة صورة الدينونة ودلالتها السياقية.
- source_word: ἔπεσεν
  choice: سقطت
  rationale: يحافظ على صورة السقوط الواردة في الفعل اليوناني، بينما يدل ذكر الجثث على الموت دون الحاجة إلى إضافة «ميتة».
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: «البرية» هي العبارة الكتابية العربية الطبيعية التي تستحضر تيه إسرائيل، وهي أدق سياقيًا من حصر المعنى في الصحراء.
theological_decisions:
- issue: فاعل προσώχθισεν المضمر
  choice: إبقاء الفاعل مستترًا في «غضب» ومفهومًا على أنه الله من السياق
  alternative: 'أن يُقال صراحة: «غضب الله» أو «غضب هو»'
  rationale: العربية تسمح باستتار الفاعل، والسياق السابق يبين أن المرجع هو الله؛ لذلك لا حاجة إلى إضافة اسم غير مصرح به في هذه الجملة.
- issue: حدة κῶλα في وصف الموتى
  choice: جثثهم
  alternative: أجسادهم
  rationale: «جثثهم» تعكس بوضوح أن المقصود أجساد الذين ماتوا في البرية وتحفظ شدة العبارة اليونانية، دون إدخال تفسير طائفي.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة، تحافظ على بنية السؤال البلاغي وعلى صورة سقوط الجثث في البرية. لا توجد علامة حاشية لأن البديل الإنجليزي «carcasses» هو الأقرب إلى اختيار المتن العربي «جثثهم»، لا قراءة نصية أو غموضًا يحتاج إلى حاشية.
