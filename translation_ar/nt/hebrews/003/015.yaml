  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: ar
  text: 'إذ يُقال: «اليوم، إن سمعتم صوته، فلا تقسّوا قلوبكم كما في التمرّد[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «كما في الاستفزاز»، وهي صياغة أقرب إلى الترجمة التقليدية لاقتباس المزمور 95.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: إذ يُقال
  rationale: تركيب ἐν مع المصدر المحلّى بأداة التعريف يفيد الملابسة الزمنية، والمضارع المبني للمجهول يدل على قولٍ قائم ومتجدد الصلة. وصيغة «إذ يُقال» طبيعية وموجزة في العربية وتحفظ هذا المعنى.
- source_word: Σήμερον
  choice: اليوم
  rationale: المقابل العربي المباشر والطبيعي، ويحفظ الإلحاح الزمني في الاقتباس.
- source_word: ἐὰν ... ἀκούσητε
  choice: إن سمعتم
  rationale: «إن» تلائم الشرط المفتوح ذي الطابع التحذيري، والفعل الماضي بعدها أسلوب عربي فصيح لا يدل هنا على زمن ماضٍ بل على تحقق الشرط المحتمل.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: صوته
  rationale: ترجمة مباشرة وطبيعية للإضافة، وتحفظ الطابع الشخصي لخطاب الله.
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: فلا تقسّوا قلوبكم
  rationale: «قسّى القلب» تعبير عربي كتابي واضح يحفظ صورة النص عن تعمّد الرفض الداخلي، والفاء تربط جواب التحذير بالشرط على نحو طبيعي.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: كما في التمرّد
  rationale: يدل παραπικρασμός على عصيان إسرائيل الذي استفز الله في البرية. «التمرّد» أوضح للقارئ المعاصر من «الاستفزاز»، مع إبقاء البديل في الحاشية.
theological_decisions:
- issue: دلالة παραπικρασμός في اقتباس المزمور 95
  choice: التمرّد
  alternative: الاستفزاز
  rationale: «التمرّد» يبرز عصيان الشعب لله في البرية ويحفظ القوة الأخلاقية والعهدية للإشارة، أما «الاستفزاز» فيعبّر بصورة أقرب إلى الأثر الواقع على الله وإلى الصياغة التقليدية، لذلك ذُكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على تركيب الاقتباس وعلى صورة «تقسية القلوب»، مع تجنّب الأسلوب العتيق أو التفسير الطائفي. وُضع مؤشر الحاشية بعد الاقتباس كله لأنه يشرح العبارة الختامية.
