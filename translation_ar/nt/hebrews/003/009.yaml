  text: where your fathers tested me by trial and saw my works[b][a],
translation:
  language: ar
  text: حَيْثُ امْتَحَنَنِي آبَاؤُكُمْ بِالِاخْتِبَارِ[a]، وَرَأَوْا أَعْمَالِي[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «امتحنني في امتحان»، أو: «وضعوني موضع الاختبار». العبارة اليونانية صعبة، وقد تدل على الكيفية أو الوسيلة.'
    reason: lexical_alternative
  - marker: b
    text: 'تجعل بعض الترجمات العبارة التالية تنازلية: «ومع ذلك رأوا أعمالي» أو «مع أنهم رأوا أعمالي». أما اليونانية فتقول ببساطة: «ورأوا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: حَيْثُ
  rationale: تحافظ على الدلالة المكانية للظرف الموصول، إذ يعود إلى موضع البرية المذكور في السياق السابق.
- source_word: ἐπείρασαν
  choice: امْتَحَنَنِي
  rationale: ينقل معنى وضع الله موضع الامتحان على نحو استفزازي في سياق الاقتباس؛ وأُثبت ضمير المفعول المفهوم من السياق.
- source_word: οἱ πατέρες ὑμῶν
  choice: آبَاؤُكُمْ
  rationale: ترجمة مباشرة تحفظ الصياغة التاريخية والعهدية للنص، مع أن «أسلافكم» ممكنة دلاليًا.
- source_word: ἐν δοκιμασίᾳ
  choice: بِالِاخْتِبَارِ
  rationale: تنقل احتمال دلالة ἐν على الوسيلة أو الكيفية وتحافظ على التكرار الدلالي المقصود في العبارة اليونانية الصعبة.
- source_word: καὶ εἶδον
  choice: وَرَأَوْا
  rationale: تحافظ على العطف البسيط في اليونانية من غير تحويله في المتن إلى علاقة استدراكية أو تنازلية.
- source_word: τὰ ἔργα μου
  choice: أَعْمَالِي
  rationale: مقابل طبيعي ودقيق يشير إلى أفعال الله في البرية ويحفظ الرنين الكتابي لكلمة «الأعمال».
theological_decisions:
- issue: مفعول فعل الامتحان
  choice: امْتَحَنَنِي
  alternative: امْتَحَنُوا
  rationale: مع أن ضمير المفعول غير مصرّح به في هذه الجملة بحسب نص SBLGNT، فإن الله هو المفعول المفهوم من سياق الاقتباس، وإثبات الضمير لازم لوضوح العربية.
- issue: العلاقة بين الامتحان ورؤية الأعمال
  choice: وَرَأَوْا
  alternative: مَعَ أَنَّهُمْ رَأَوْا
  rationale: النص اليوناني يستعمل καί، أي العطف البسيط؛ لذلك لم تُفرض في المتن دلالة تنازلية مستنبطة من السياق.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية رصينة. استُعمل «آباؤكم» بدل «أسلافكم» للمحافظة على الصياغة التاريخية المباشرة، وأُبقي التوتر الدلالي في عبارة الامتحان والعطف موضحًا في الحواشي.
