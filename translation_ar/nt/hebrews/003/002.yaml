  text: πιστὸν ὄντα τῷ ποιήσαντι αὐτὸν ὡς καὶ Μωϋσῆς ⸀ἐν τῷ οἴκῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: ar
  text: الذي كان أمينًا لمن عيَّنه[a]، كما كان موسى أيضًا في بيته[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لمن صنعه». يمكن أن يعني الفعل اليوناني «صنع»، لكنه هنا يُفهم على الأرجح بمعنى «عيَّن» أو «كلَّف».'
    reason: lexical_alternative
  - marker: b
    text: 'تضيف بعض المخطوطات كلمة «كل»، فتكون العبارة: «في كل بيته»، في صدى أوضح للعدد 12: 7. ويُرجَّح أن المقصود هو بيت الله.'
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: الذي كان أمينًا
  rationale: صيغت العبارة الوصفية في صورة جملة موصولة طبيعية متصلة بيسوع المذكور في الآية السابقة. و«أمينًا» تنقل معنى الثبات والجدارة بالثقة، لا معنى الإيمان التصديقي.
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: لمن عيَّنه
  rationale: يأتي الفعل ποιέω هنا في سياق إسناد مهمة ومقارنة أمانة يسوع بأمانة موسى؛ لذلك ينقل «عيَّنه» المعنى السياقي بوضوح، مع إثبات المعنى الحرفي المحتمل في الحاشية.
- source_word: ὡς καὶ
  choice: كما كان ... أيضًا
  rationale: تنقل هذه الصياغة المقارنة بين أمانة يسوع وأمانة موسى بلغة عربية واضحة وطبيعية.
- source_word: Μωϋσῆς
  choice: موسى
  rationale: الصيغة العربية الكتابية المألوفة للاسم.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: في بيته
  rationale: تتبع القراءة المثبتة في نص SBLGNT، وتحافظ على صورة البيت وعلى ضمير الغائب من غير تعيين مرجعه صراحة. وتُذكر القراءة الأطول في الحاشية.
theological_decisions:
- issue: معنى ποιήσαντι عند الإشارة إلى الابن
  choice: عيَّنه
  alternative: صنعه
  rationale: مع أن «صنع» معنى معجمي ممكن، فإن سياق التكليف والأمانة في المهمة يرجح «عيَّن». وتُحفظ الإمكانية المعجمية الأخرى في الحاشية من غير تحميل النص إيحاءً غير لازم بأنه يتحدث عن خلق الابن.
- issue: مرجع الضمير في «بيته»
  choice: الإبقاء على الضمير من غير تفسير داخل المتن
  alternative: بيت الله
  rationale: يرجح السياق والإحالة إلى سفر العدد أن المقصود بيت الله، لكن إبقاء «بيته» يصون صيغة اليونانية ولا يحسم المرجع تفسيرًا داخل المتن.
- issue: القراءة النصية لعبارة البيت
  choice: في بيته
  alternative: في كل بيته
  rationale: النص اليوناني المعطى في SBLGNT لا يتضمن لفظ «كل»، ولذلك اتُّبعت قراءته في المتن، مع توثيق القراءة الأطول وصداها لسفر العدد في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت صلة الآية بما قبلها بصيغة الموصول، وأُبقيت استعارة «البيت» والضمير الغامض كما في اليونانية، مع وضع علامتي الحاشيتين [a] و[b] في المتن.
