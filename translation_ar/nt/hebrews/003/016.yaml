  - severity: medium
    issue: صياغة الحاشية البديلة
    rationale: «أثاروا المرارة» غير طبيعية في العربية المعاصرة، وعبارة «سمعوا فأغاظوا» تترك المفعول غير مبيّن. ينبغي أن تذكر الحاشية أن الفعل يمكن أن يفيد إغاظة الله أو إثارة المرارة، مع بيان أن السياق يحدده بتمرّد إسرائيل.
