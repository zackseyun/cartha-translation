  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: ar
  text: فمَن الذين سمعوا فتمرّدوا[a]؟ أليسوا هم جميع الذين خرجوا من مصر على يد موسى؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سمعوا فأغاظوا [الله]». والفعل اليوناني يمكن أن يفيد إثارة المرارة أو الإغاظة؛ والمقصود هنا تمرّد إسرائيل في البرية الذي أغاظ الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: مَن الذين
  rationale: يفتتح سؤالًا بلاغيًا عن هوية المتمرّدين، وتُظهر الصياغة مرجع الجمع المحدد بوضوح في العربية.
- source_word: γὰρ
  choice: فـ
  rationale: تربط السؤال بما سبقه بوصفه تعليلًا أو إيضاحًا للحجة.
- source_word: ἀκούσαντες
  choice: سمعوا ثم
  rationale: ينقل اسم الفاعل الماضي بصياغة فعلية عربية طبيعية، وتوضح «ثم» أن السماع سبق التمرّد دون إثقال العبارة.
- source_word: παρεπίκραναν
  choice: تمرّدوا
  rationale: في سياق جيل البرية يدل الفعل على العصيان الذي استفز الله؛ و«تمرّدوا» تنقل القوة السياقية بوضوح، مع إثبات المعنى الحرفي الأقرب في الحاشية.
- source_word: ἀλλ’ οὐ πάντες
  choice: أليسوا جميع
  rationale: تنقل الجواب المتوقع في السؤال البلاغي، أما ἀλλά فتؤدي هنا وظيفة انتقالية اصطلاحية لا تستلزم إظهار «بل» منفصلة.
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: الذين خرجوا من مصر
  rationale: صياغة عربية طبيعية ودقيقة لاسم الفاعل المستعمل اسميًا مع دلالة الخروج من مكان.
- source_word: διὰ Μωϋσέως
  choice: على يد موسى
  rationale: تنقل دلالة الوساطة أو الوكالة في διά مع المضاف إليه، من غير توسيعها إلى تفسير مثل «بقيادة موسى».
theological_decisions:
- issue: دلالة παραπικραίνω في سياق جيل البرية
  choice: تمرّدوا
  alternative: أغاظوا / أثاروا المرارة
  rationale: السياق يشير إلى عصيان إسرائيل الذي استفز الله بعد السماع. «تمرّدوا» يبيّن القوة السردية واللاهوتية للفعل، بينما تحفظ الحاشية دلالته الحرفية الأقرب وتمنع إخفاء التوتر المعجمي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ البناء الاستفهامي البلاغي للسؤالين، واستُعملت «على يد موسى» للدلالة الطبيعية على الوساطة دون إضافة تفسيرية.
