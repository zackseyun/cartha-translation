base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: ar
  text: 'أربعين سنة؛ لذلك سخطتُ على هذا الجيل[a] وقلتُ: «إنهم يضلّون دائمًا في قلوبهم[b]، ولم يعرفوا طرقي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غضبتُ على هذا الجيل»؛ فالفعل اليوناني يدل على استياء شديد، وقد يتضمن النفور.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا في اليونانية: «في القلب» بالمفرد، وربما عومل الجيل كله بوصفه جماعة واحدة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: أربعين سنة
  rationale: منصوب الزمان هنا يدل على امتداد المدة، والعربية تؤدي ذلك طبيعيًا من غير حاجة إلى حرف جر.
- source_word: διὸ
  choice: لذلك
  rationale: يحفظ معنى النتيجة والاستنتاج رابطًا الكلام بما سبقه.
- source_word: προσώχθισα
  choice: سئمتُ من
  rationale: يفيد الفعل ضيقًا شديدًا ونفورًا، و«سئمتُ من» تعبير عربي واضح يحفظ قوة الاستياء من غير حصره في الغضب وحده أو المبالغة إلى حد البغض.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: من هذا الجيل
  rationale: يتلاءم حرف الجر «من» مع الفعل العربي المختار، ويحفظ الإشارة المباشرة إلى جيل البرية.
- source_word: Ἀεὶ πλανῶνται
  choice: إنهم يضلّون دائمًا
  rationale: «يضلّون» ينقل الانحراف المستمر عن الطريق، و«دائمًا» يحفظ دلالة Ἀεί؛ وأُدخلت «إنهم» لتكون الجملة العربية طبيعية في القول المباشر.
- source_word: τῇ καρδίᾳ
  choice: في قلوبهم
  rationale: الترجمة بالجمع طبيعية مع ضمير الجماعة في العربية، مع بيان المفرد اليوناني في الحاشية حفاظًا على دلالته الجمعية المحتملة.
- source_word: αὐτοὶ δὲ οὐκ ἔγνωσαν
  choice: ولم يعرفوا
  rationale: الواو ملائمة لسياق الاقتباس ويمكن أن تحمل الانتقال، و«يعرفوا» تحفظ إمكان المعرفة الإدراكية والعلائقية من غير تضييقها إلى الفهم الذهني.
- source_word: τὰς ὁδούς μου
  choice: طرقي
  rationale: يحفظ الاستعارة الكتابية التي تشير إلى مسالك الله وأفعاله وما يريده من شعبه.
theological_decisions:
- issue: شدة الاستياء الإلهي في προσώχθισα
  choice: سئمتُ من هذا الجيل
  alternative: غضبتُ على هذا الجيل؛ مقتُّ هذا الجيل
  rationale: «سئمتُ» تبقي معنى الضيق والنفور الشديدين من تمرد الجيل المتكرر، من غير تسطيح العبارة إلى مجرد غضب ولا تشديدها إلى معنى المقت وحده.
- issue: المفرد الجمعي في τῇ καρδίᾳ
  choice: في قلوبهم مع حاشية تبين المفرد اليوناني
  alternative: في قلبهم
  rationale: «في قلوبهم» أوضح وأفصح مع جمع العقلاء في العربية، بينما تحفظ الحاشية احتمال نظر النص إلى الجيل بوصفه جماعة واحدة.
- issue: نوع المعرفة في οὐκ ἔγνωσαν
  choice: لم يعرفوا طرقي
  alternative: لم يفهموا طرقي؛ لم يتعرّفوا إلى طرقي
  rationale: «يعرفوا» لا تحصر إخفاقهم في نقص الفهم الذهني، بل تبقي المجال للمعنى العملي والعلائقي في سياق العهد.
