  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ إيقاع الاقتباس، واستُعملت صيغة الجمع في «قلوبهم» لفصاحتها الطبيعية، مع توثيق المفرد اليوناني في الحاشية.
