  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: ar
  text: لأن كلَّ بيتٍ يبنيه شخصٌ ما، أمّا الذي بنى كلَّ شيءٍ[a] فهو الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جميع الأشياء».'
    reason: بديل معجمي لـ πάντα يحافظ على المعنى الشامل نفسه.
lexical_decisions:
- source_word: πᾶς ... οἶκος
  choice: كلَّ بيتٍ
  rationale: 'تفيد πᾶς مع الاسم المفرد غير المعرّف معنى توزيعيًا: «كل بيت». وتحافظ كلمة «بيت» على الصورة المعمارية وعلى إمكان امتدادها المجازي في سياق الرسالة.'
- source_word: γὰρ
  choice: لأن
  rationale: تقدّم γάρ تعليلًا يشرح الحجة السابقة، و«لأن» توضح هذه الصلة في العربية المعاصرة.
- source_word: κατασκευάζεται
  choice: يبنيه
  rationale: المبني للمجهول اليوناني يقرر أن لكل بيت بانيًا. وصياغة «يبنيه شخص ما» عربية طبيعية، وتحفظ معنى البناء والصلة بالفعل اللاحق.
- source_word: ὑπό τινος
  choice: شخصٌ ما
  rationale: تدل ὑπό مع المضاف إليه على الفاعل، وτινος نكرة؛ لذلك تعبّر «شخص ما» بوضوح عن فاعل غير معيّن.
- source_word: ὁ δὲ
  choice: أمّا الذي ... فهو
  rationale: 'تنقل هذه البنية التحول المقابِل الذي تؤديه δέ، وتحفظ القوة الاسمية لأداة التعريف مع اسم الفاعل: «الذي بنى».'
- source_word: πάντα
  choice: كلَّ شيءٍ
  rationale: تشمل πάντα الموجودات جميعًا دون تضييقها على الكون المادي وحده؛ و«كل شيء» تعبير عربي واضح جامع.
- source_word: κατασκευάσας
  choice: بنى
  rationale: يحافظ «بنى» على التكرار الدلالي مع κατασκευάζεται وعلى القياس المعماري الذي تقوم عليه الحجة.
- source_word: θεός
  choice: الله
  rationale: يعرّف النص اليوناني باني كل شيء بأنه الله، وهذه هي الصياغة العربية المباشرة المناسبة.
theological_decisions:
- issue: تحديد هوية باني كل شيء في الجملة الأخيرة
  choice: أمّا الذي بنى كل شيء فهو الله
  alternative: أمّا الله فهو الذي بنى كل شيء
  rationale: تحافظ الصياغة المختارة على ترتيب الجملة اليونانية وبنيتها الخبرية، فتجعل «الله» خبرًا يحدد صراحة هوية «الذي بنى كل شيء»، من غير إضافة تفسير ميتافيزيقي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت بنية «أمّا ... فهو» لصياغة المقابلة بسلاسة، مع إبقاء صورة البيت والبناء والتحديد الصريح لله بوصفه باني كل شيء.
