  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: ar
  text: لأننا قد صرنا شركاء في المسيح[a]، إن كنا حقًّا نتمسك ببداية ثقتنا ثابتة إلى النهاية[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مشاركون في المسيح» أو «لنا نصيب في المسيح».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بداية يقيننا» أو «بداية ضماننا». ويمكن للكلمة اليونانية، في سياقات أخرى، أن تعني «الجوهر» أو «الحقيقة/الواقع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέτοχοι
  choice: شركاء
  rationale: تدل الكلمة على من لهم نصيب أو مشاركة في شيء؛ و«شركاء في المسيح» عربية واضحة وتحفظ معنى المشاركة دون إيحاء بعلاقة تجارية.
- source_word: γὰρ
  choice: لأننا
  rationale: تفيد الأداة التعليل أو التفسير لما سبق، و«لأن» تؤدي هذا الربط بوضوح.
- source_word: τοῦ Χριστοῦ
  choice: في المسيح
  rationale: جاء المضاف إليه بعد μέτοχοι، وتؤدي «شركاء في المسيح» معنى الاشتراك المتعلق بالمسيح بصورة طبيعية. و«المسيح» هو اللقب العربي الراسخ لـΧριστός.
- source_word: γεγόναμεν
  choice: قد صرنا
  rationale: يحفظ التعبير دلالة صيغة التمام على حدوث الصيرورة وبقاء نتيجتها في الحاضر.
- source_word: ἐάνπερ
  choice: إن كنا حقًّا
  rationale: تحفظ «حقًّا» توكيد الشرط الذي تضيفه περ، من غير تحويله إلى تقرير مذهبي.
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: الثقة التي كانت لنا منذ البداية
  rationale: يفهم التركيب سياقيًا على أنه الثقة أو الموقف الواثق الذي اتصف به المخاطبون في البداية. الصياغة العربية الطبيعية توضح العلاقة مع إبقاء البدائل الدلالية في الحاشية.
- source_word: μέχρι τέλους
  choice: إلى النهاية
  rationale: ينقل امتداد التمسك عبر المسيرة حتى غايتها.
- source_word: βεβαίαν κατάσχωμεν
  choice: نتمسك ... بالثقة
  rationale: «نتمسك» تؤدي معنى الاحتفاظ وعدم التفريط، بينما يُفهم ثبات الثقة من فعل التمسك؛ وتذكر الحاشية الصياغة الأقرب إلى البنية اليونانية.
theological_decisions:
- issue: الشرط وعلاقته بالمثابرة
  choice: 'الإبقاء على شرط حقيقي: «إن كنا حقًّا نتمسك إلى النهاية...»'
  alternative: اعتبار المثابرة مجرد برهان حتمي على مشاركة سابقة، أو اعتبار المشاركة حالة لا تبقى إلا باستمرار المثابرة
  rationale: النص اليوناني يصرح بالشرط، لكنه لا يحسم وحده الجدل اللاهوتي اللاحق بشأن كيفية ارتباط المشاركة بالمثابرة؛ لذلك تُحفظ حدة الشرط دون تفسير مذهبي زائد.
- issue: دلالة ὑπόστασις
  choice: الثقة
  alternative: اليقين، أو الأساس، أو الحقيقة القائمة
  rationale: في هذا السياق الوعظي تبدو دلالة الموقف الواثق أرجح، لكن اتساع المجال الدلالي للكلمة محفوظ في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختيرت صياغة عربية طبيعية لعبارة «بداية الثقة»، مع حاشية تحفظ البنية اليونانية الأشد حرفية والغموض المعجمي في ὑπόστασις.
