  text: καὶ βλέπομεν ὅτι οὐκ ἠδυνήθησαν εἰσελθεῖν δι’ ἀπιστίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/019.yaml
  text: And we see that they were not able to enter because of unbelief[a].
translation:
  language: ar
  text: ونرى أنهم لم يقدروا أن يدخلوا بسبب عدم إيمانهم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عدم أمانتهم». قد تدل الكلمة اليونانية على غياب الإيمان، كما قد تدل على رفض الثقة وعدم الأمانة.
    reason: بديل معجمي يحفظ اتساع دلالة ἀπιστία.
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: أداة ربط طبيعية تحفظ استمرار الحجة من السياق السابق من غير إضافة قوة استنتاجية غير مصرّح بها.
- source_word: βλέπομεν
  choice: نرى
  rationale: تحفظ صيغة المضارع والمتكلم الجمع، وتبقي الخلاصة مباشرة وحية.
- source_word: ὅτι
  choice: أن
  rationale: تدخل مضمون ما يراه الكاتب وتحفظ بنية الجملة بوضوح في العربية.
- source_word: οὐκ ἠδυνήθησαν
  choice: لم يقدروا
  rationale: تنقل معنى عدم القدرة في الفعل δύναμαι بصياغة عربية طبيعية ومباشرة.
- source_word: εἰσελθεῖν
  choice: أن يدخلوا
  rationale: تنقل المصدر اليوناني، وتشير في السياق إلى دخول الأرض أو الراحة الموعودة دون زيادة تفسيرية في المتن.
- source_word: δι’
  choice: بسبب
  rationale: مع حالة النصب تفيد διά السببية هنا، و«بسبب» أوضح مقابل عربي معاصر.
- source_word: ἀπιστίαν
  choice: عدم إيمانهم
  rationale: يعبر بوضوح عن امتناعهم عن تصديق وعد الله والثقة به، مع إبقاء معنى عدم الأمانة بوصفه احتمالًا معجميًا في الحاشية.
theological_decisions:
- issue: دلالة ἀπιστία وصلتها بالإيمان والأمانة
  choice: عدم إيمانهم
  alternative: عدم أمانتهم
  rationale: يركز السياق المباشر في عبرانيين 3 على عدم تصديقهم لوعد الله وعدم ثقتهم به، لذلك تلائم عبارة «عدم إيمانهم» المتن. لكن اللفظة قد تحمل أيضًا معنى عدم الأمانة أو رفض الثقة، فحُفظ هذا التوتر الدلالي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «لم يقدروا» بدل صياغة أثقل، وأُضيف الضمير في «عدم إيمانهم» لتحديد أصحاب عدم الإيمان طبيعيًا في العربية.
