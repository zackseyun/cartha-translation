lexical_decisions:
- source_word: ὡς
  choice: كما
  rationale: تؤدي معنى أداة التشبيه والربط في سياق الاقتباس، وتحافظ على صلته بما قبله.
- source_word: ὤμοσα
  choice: أقسمتُ
  rationale: ترجمة مباشرة وطبيعية لفعل الحلف بصيغة الماضي.
- source_word: ἐν τῇ ὀργῇ μου
  choice: في غضبي
  rationale: تحافظ على قوة الغضب الإلهي الجادّة في سياق الإنذار، بعبارة عربية واضحة ومألوفة.
- source_word: Εἰ εἰσελεύσονται
  choice: لن يدخلوا ... أبدًا
  rationale: تُظهر قوة صيغة القسم السامية التي تستعمل الشرط استعمالًا يفيد النفي القاطع، بدل نقلها شرطًا حرفيًا قد يضلل القارئ العربي.
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: يدخلوا راحتي
  rationale: تحافظ «راحتي» على محور الراحة في المزمور ورسالة العبرانيين من غير حصر المقصود في أرض أو سماء أو شعور داخلي.
theological_decisions:
- issue: صيغة القسم Εἰ εἰσελεύσονται
  choice: لن يدخلوا راحتي أبدًا
  alternative: إن كانوا سيدخلون راحتي
  rationale: الصيغة اليونانية تعكس أسلوب قسم ساميًا محذوف الجواب، ومعناه نفي مؤكد. إظهار النفي ينقل الوظيفة المقصودة، بينما قد يوحي النقل الحرفي بشرط غير مكتمل فحسب.
- issue: معنى κατάπαυσις في السياق
  choice: راحة
  alternative: موضع الراحة
  rationale: لفظ «راحة» يصون الترابط الموضوعي مع المزمور وحجة الرسالة، ولا يحسم مبكرًا طبيعة هذه الراحة أو نطاقها.
