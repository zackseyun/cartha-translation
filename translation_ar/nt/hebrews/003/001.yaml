review_pass:
  verdict: revise
  source_fidelity: 'المسودة تنقل البنية الاستنتاجية والنداء ووصف المؤمنين بالمشاركة في دعوة سماوية، وتحافظ بحق على لقبي يسوع «رسول» و«رئيس كهنة». لكن «رئيس كهنته» لا يترجم ἀρχιερέα τῆς ὁμολογίας ἡμῶν: فالضمير في «كهنته» يُفهم عائدًا إلى يسوع، ويحوّل المعنى إلى «رئيس كهنوت يسوع». كما أن «رئيس الكهنة» هو المقابل الاصطلاحي الأدق لـ ἀρχιερεύς.'
  naturalness: النداء المتكرر بـ«يا» في المسودة ممكن، لكنه أثقل من اللازم. الصياغة المنقحة تستعمل نداءً عربيًا فصيحًا طبيعيًا. ولأن الإضافة اليونانية يمكن أن تتصل باللقبين، صيغت العبارة الرئيسة بتركيب يبيّن هذا التعلّق من دون ادعاء أن أحد التحليلين النحويين وحده لازم.
  terminology: «الدعوة السماوية»، و«رسول»، و«اعترافنا» ألفاظ مناسبة. استُبدل «رئيس كهنته» بـ«رئيس الكهنة»، مع بيان علاقة اللقبين باعتراف الجماعة. وحُفظ اسم «يسوع».
  issues:
  - severity: high
    issue: «رئيس كهنته» لا يساوي «رئيس الكهنة»
    rationale: التعبير العربي يجعل «كهنته» كهنوتًا مضافًا إلى يسوع، في حين أن ἀρχιερεύς يعني «رئيس الكهنة/رئيس كهنة»، وτῆς ὁμολογίας ἡμῶν متعلق بعبارة اللقبين لا بكهنوت يسوع.
  - severity: low
    issue: تكرار أداة النداء
    rationale: «يا إخوة... يا شركاء...» جائز، لكن وضع «شركاء» بدلًا بعد النداء الأول أكثر سلاسة في العربية الفصحى الحديثة.
