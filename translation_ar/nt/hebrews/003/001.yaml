  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: ar
  text: لذلك، أيها الإخوة القديسون، شركاءُ الدعوة السماوية، تأمّلوا يسوع، الرسولَ ورئيسَ الكهنةِ المرتبطَين باعترافنا[c].
  philosophy: optimal-equivalence
  footnotes:
