  to: لذلك، أيها الإخوة القديسون، شركاءُ الدعوة السماوية، تأمّلوا يسوع، الرسولَ ورئيسَ الكهنةِ المرتبطَين باعترافنا[c].
  rationale: يصحح النص المصطلح الخاص بـἀρχιερεύς ويمنع نسبة الكهنوت إلى يسوع على خلاف تركيب الأصل. وعبارة «المرتبطين باعترافنا» تعيد إظهار أن «اعترافنا» يتصل باللقبين معًا، مع إبقاء القراءة الأخرى، التي تجعل يسوع مضمون الاعتراف، في الحاشية. كما أُبقيت الحواشي a وb لتوثيق الشمول التداولي لـ«إخوة» والبديل المعجمي لـ«شركاء».
