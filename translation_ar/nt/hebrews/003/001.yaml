lexical_decisions:
- source_word: Ὅθεν
  choice: لذلك
  rationale: أداة استنتاج تصل الوصية بما سبق، ولا سيما الحديث عن أمانة يسوع ورحمته بصفته رئيس كهنة.
- source_word: ἀδελφοὶ ἅγιοι
  choice: يا إخوةً قديسين
  rationale: يحافظ على صيغة النداء المذكرة في اليونانية وعلى معنى الجماعة المكرسة لله، مع بيان شمول الخطاب للمؤمنات في الحاشية.
- source_word: κλήσεως ἐπουρανίου μέτοχοι
  choice: يا شركاءَ في دعوة سماوية
  rationale: ينقل μέτοχοι بمعنى المشاركين أو ذوي النصيب، ويحفظ احتمال أن تصف ἐπουρανίου منشأ الدعوة أو طابعها.
- source_word: κατανοήσατε
  choice: تأمّلوا
  rationale: يفيد توجيه الذهن إلى فحص يسوع والتفكير فيه باهتمام، وهو أقوى هنا من مجرد النظر.
- source_word: ἀπόστολον
  choice: رسول
  rationale: ينقل معنى المرسَل ويحافظ على اللقب الذي يطلقه النص على يسوع دون حصره في استعمال كنسي لاحق.
- source_word: ἀρχιερέα
  choice: رئيسَ كهنته
  rationale: التعبير العربي المألوف للوظيفة الكهنوتية العليا، وهو محور رئيس في الرسالة.
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: اعترافنا
  rationale: يحافظ على العبارة الاسمية الجامعة، التي قد تتصل باللقبين معًا، بدل اختزالها في الإيمان الباطني وحده.
- source_word: Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم.
theological_decisions:
- issue: شمول لفظ ἀδελφοὶ
  choice: إبقاء «إخوة» في المتن مع توضيح شموله للنساء في الحاشية.
  alternative: «أيها الإخوة والأخوات»
  rationale: الصيغة اليونانية مذكرة جمع، لكنها تخاطب جماعة المؤمنين كلها؛ تحفظ الترجمة الصيغة المصدرية وتوضح مداها التداولي.
- issue: إطلاق ἀπόστολος على يسوع
  choice: ترجمته «رسول» بوصفه لقبًا ليسوع.
  alternative: «المُرسَل»
  rationale: يحفظ النص وصف يسوع بأنه المرسَل من الله من غير إدخال تمييزات مذهبية لاحقة في المتن.
- issue: تعلّق τῆς ὁμολογίας ἡμῶν
  choice: «رسول اعترافنا ورئيس كهنته» بما يجعل المضاف إليه متعلقًا باللقبين.
  alternative: «تأمّلوا من نعترف به، يسوع، الرسول ورئيس الكهنة»
  rationale: التركيب اليوناني يسمح بفهم العبارة مضافة إلى اللقبين، مع بقاء احتمال أن يكون يسوع نفسه مضمون الاعتراف؛ لذلك ذُكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل النداء المتكرر لتوضيح البدل في التركيب اليوناني، وحُفظت ألفاظ «الدعوة» و«الاعتراف» و«رئيس الكهنة» لما لها من أهمية موضوعية في الرسالة.
