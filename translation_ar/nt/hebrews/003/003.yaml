reference: Hebrews 3:3
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: ar
  text: لأن هذا قد حُسِبَ أهلًا لمجدٍ أعظم من موسى، بقدر ما للباني من كرامة أعظم من البيت الذي بناه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: هذا
  rationale: يحافظ على الإشارة الموجودة في اليونانية إلى يسوع المذكور في السياق السابق، من غير إضافة الاسم داخل الآية.
- source_word: ἠξίωται
  choice: قد حُسِبَ أهلًا
  rationale: 'ينقل معنى الفعل في صيغة المبني للمجهول التام: اعتُبر مستحقًا أو جديرًا، مع دلالة النتيجة القائمة.'
- source_word: δόξης
  choice: لمجد
  rationale: المقابل الطبيعي المباشر لـδόξα في هذا السياق، مع إبقاء صلته بلفظ الكرامة في الشطر التالي من غير دمجهما.
- source_word: καθ’ ὅσον
  choice: بقدر ما
  rationale: يحفظ علاقة القياس والمقارنة التي تفيدها العبارة، بدل تحويلها إلى مجرد تشبيه فضفاض.
- source_word: ὁ κατασκευάσας
  choice: الباني
  rationale: تعبير عربي موجز وطبيعي ينقل فاعل κατασκευάζω هنا، أي من أنشأ البيت أو أعدّه.
- source_word: τοῦ οἴκου ... αὐτόν
  choice: من البيت الذي بناه
  rationale: يُظهر مرجع الضمير بوضوح طبيعي في العربية، ويحافظ على المقابلة بين الباني والبيت.
theological_decisions:
- issue: هوية المشار إليه باسم الإشارة οὗτος
  choice: الإبقاء على «هذا»
  alternative: «يسوع» أو «المسيح»
  rationale: السياق يحدد المشار إليه، لكن النص اليوناني نفسه يستعمل اسم الإشارة؛ لذا لا يُستبدل بتفسير صريح داخل المتن.
- issue: دلالة المقارنة بين الباني والبيت
  choice: الحفاظ على صورة الباني والبيت بلا شرح عقائدي مضاف
  alternative: تفسير الباني صراحة بأنه الله أو المسيح داخل الآية
  rationale: الآية تقيم القياس تمهيدًا للسياق اللاحق، ولا ينبغي حسم تفاصيله التفسيرية بإضافة غير موجودة في هذا العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل البناء للمجهول في «حُسِبَ أهلًا» لموافقة صيغة المصدر، وحُفظ التوازي بين «مجد» و«كرامة» وبين موسى والباني والبيت.
