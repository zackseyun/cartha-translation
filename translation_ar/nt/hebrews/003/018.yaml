base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: ar
  text: ولِمَن أقسم أنهم لن يدخلوا راحته، إلا للذين عصوا[a]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للذين رفضوا أن يطيعوا». يمكن للصيغة اليونانية أن تبرز فعل رفض الطاعة؛ وفي السياق يرتبط هذا العصيان ارتباطًا وثيقًا بعدم الإيمان (انظر عبرانيين 3:19).'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: لِمَن
  rationale: اسم استفهام في حالة المجرور الدالة على المتلقّي، ويعود على أشخاص؛ و«لِمَن» صياغة عربية طبيعية تحفظ السؤال البلاغي.
- source_word: δὲ
  choice: الواو في «ولِمَن»
  rationale: تصل السؤال بما قبله وتواصل سلسلة الأسئلة البلاغية دون المبالغة في معنى الاستدراك.
- source_word: ὤμοσεν
  choice: أقسم
  rationale: ينقل معنى الحلف أو أداء القسم ويحفظ قوة العبارة وجلالها.
- source_word: μὴ εἰσελεύσεσθαι
  choice: أنهم لن يدخلوا
  rationale: المصدر بعد فعل القسم يبيّن مضمون القسم؛ و«لن يدخلوا» عربية واضحة تعبّر عن النفي المستقبلي من منظور القسم.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: يدخلوا راحته
  rationale: «الراحة» تحفظ المصطلح المحوري في الرسالة، وفعل «يدخلوا» يؤدي معنى الحركة الذي تحمله εἰς من غير حاجة إلى حرف جر زائد في العربية.
- source_word: εἰ μὴ
  choice: إن لم يكن
  rationale: تحفظ بنية السؤال البلاغي وتقدّم الجواب المتوقع بصورة عربية طبيعية.
- source_word: τοῖς ἀπειθήσασιν
  choice: للذين عصوا
  rationale: ينقل اسم الفاعل الأوريستي من ἀπειθέω بوصفه عصيانًا وقع، ويحفظ تمييزه عن عدم الإيمان المذكور صراحة في العدد التالي.
theological_decisions:
- issue: دلالة ἀπειθήσασιν في سياق التحذير
  choice: للذين عصوا
  alternative: للذين لم يؤمنوا / للذين كانوا عاصين
  rationale: اللفظ هنا يدل مباشرة على رفض الطاعة، مع أن السياق يربط العصيان بعدم الإيمان في عبرانيين 3:19. لذلك لا تُختزل الكلمة في عدم الإيمان، ولا يُفصل العصيان عنه.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ تسلسل السؤال البلاغي، واستُعمل «راحته» بوصفه مصطلحًا محوريًا في سياق الرسالة، مع تجنّب تسوية التوتر الدلالي بين العصيان وعدم الإيمان.
