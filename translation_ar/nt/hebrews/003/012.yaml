  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: ar
  text: احذروا، أيها الإخوة[a]، لئلا يكون في أحد منكم قلب شرير غير مؤمن[b] في الابتعاد[c] عن الله الحي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الإخوة» ترجمة لصيغة الجمع المذكر ἀδελφοί، ويمكن أن تُخاطَب بها جماعة من المؤمنين تضم الرجال والنساء.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قلب شرير غير أمين».'
    reason: alternative_reading
  - marker: c
    text: 'أو: «في الانصراف عن الله الحي» أو «عند الابتعاد عنه»؛ وقد يُفهَم الفعل في السياق بمعنى الارتداد.'
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: احذروا
  rationale: فعل أمر مضارع موجَّه إلى الجمع، يفيد التنبه والتحذير المستمر؛ و«احذروا» عربية واضحة وطبيعية تحفظ قوة الإنذار.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: نداء بصيغة جمع مذكر، وقد يُستعمل في مخاطبة جماعة المؤمنين التي تضم الرجال والنساء؛ حُفظت الصيغة في المتن ووُضّح مداها في الحاشية.
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: لئلا يكون في أحد منكم
  rationale: تحافظ العبارة على صيغة التحذير من احتمال نشوء هذه الحال لدى أي فرد من المخاطَبين.
- source_word: καρδία πονηρὰ ἀπιστίας
  choice: قلب شرير عديم الإيمان
  rationale: «القلب» يحفظ الدلالة الكتابية لمركز الفكر والإرادة والعاطفة، و«عديم الإيمان» يعبّر طبيعيًا عن إضافة ἀπιστίας التي تصف القلب بعدم الإيمان، مع إبقاء احتمال معنى عدم الأمانة في الحاشية.
- source_word: ἐν τῷ ἀποστῆναι
  choice: فيرتدّ
  rationale: يفيد المصدر الانفصال أو الابتعاد عن الله؛ و«يرتدّ عن» تعبير عربي واضح وجاد، من غير استعمال المصطلح الفني «الارتداد عن الإيمان» في المتن. والفاء تبيّن الصلة الوثيقة بين حال القلب والابتعاد، مع بقاء نوع العلاقة قابلًا للفهم بوصفه نتيجة أو مظهرًا.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: عن الله الحي
  rationale: تعبير كتابي معروف، والسياق يجعل الاسم معرفًا في العربية رغم غياب أداة التعريف في اليونانية.
theological_decisions:
- issue: هل تدل ἀπιστίας على عدم الإيمان أم عدم الأمانة؟
  choice: عديم الإيمان
  alternative: غير أمين
  rationale: يركّز السياق القريب في عبرانيين 3 على عدم تصديق كلمة الله؛ لكن اللفظة قد تحمل أيضًا معنى عدم الأمانة، لذلك ذُكر البديل في الحاشية.
- issue: قوة ἀποστῆναι وما إذا كان ينبغي استعمال مصطلح تقني للاجحاف
  choice: يرتدّ عن الله الحي
  alternative: يبتعد عن الله الحي / يسقط بالارتداد عن الله الحي
  rationale: «يرتدّ عن» يحفظ جدية الانفصال المقصود من غير أن يضيف في المتن عبارة تقنية مثل «يصبح مرتدًا»، وبذلك لا تُحسم مسبقًا المناقشات اللاهوتية اللاحقة.
- issue: العلاقة النحوية التي تفيدها ἐν مع المصدر
  choice: فيرتدّ
  alternative: عندما يبتعد / بابتعاده
  rationale: قد تصف العبارة الظرف أو المظهر أو النتيجة المتصلة بالقلب الشرير؛ صياغة الفاء عربية طبيعية ولا تقصر العلاقة على السببية وحدها.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل «احذروا» لقوة الأمر، و«قلب» لصداها الكتابي، وتُجنبت المصطلحات المذهبية التقنية مع حفظ شدة التحذير وغموض الصلة النحوية في العبارة الأخيرة.
