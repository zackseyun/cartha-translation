id: HEB.7.11
reference: Hebrews 7:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: ar
  text: فلو كان الكمال يتحقّق بواسطة الكهنوت اللاوي—إذ إن الشعب قد تلقّى الشريعة على أساسه[a]—فأيّة حاجة بعد ذلك إلى أن يقوم كاهن آخر على رتبة ملكي صادق، وأن لا يُقال إنه على رتبة هارون؟[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إذ إن الشعب قد أُعطي الشريعة في ظلّه». والضمير في الأصل اليوناني يعود على الأرجح إلى الكهنوت اللاوي.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وأن لا يُدعى على رتبة هارون».'
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: الكمال
  rationale: يحفظ الثقل الطقسي والخلاصي للمصطلح في الرسالة إلى العبرانيين، من غير حصره في التحسن الأخلاقي أو تفسيره تفسيرًا مطولًا.
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: بواسطة الكهنوت اللاوي
  rationale: تنقل دلالة الوسيلة في διά مع المضاف إليه، بصياغة عربية واضحة.
- source_word: ἐπ’ αὐτῆς
  choice: على أساسه
  rationale: الضمير يعود على الأرجح إلى الكهنوت اللاوي، والعبارة تبين أن ترتيب إعطاء الشريعة للشعب قام على أساس ذلك الكهنوت.
- source_word: νενομοθέτηται
  choice: قد تلقّى الشريعة
  rationale: صياغة عربية طبيعية تعبّر عن كون الشعب قد أُعطي الشريعة وصار في وضع تشريعي قائم، مع مراعاة دلالة صيغة التام.
- source_word: τίς ἔτι χρεία
  choice: فأيّة حاجة بعد ذلك
  rationale: تحفظ قوة السؤال البلاغي ومعنى استمرار أو بقاء الحاجة.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: على رتبة ملكي صادق
  rationale: «الرتبة» تنقل معنى τάξις هنا بوصفه نظامًا أو تصنيفًا كهنوتيًا، و«على» تعبير عربي مألوف في هذا التركيب.
- source_word: ἕτερον ... ἱερέα
  choice: كاهن آخر
  rationale: يحفظ معنى وجود كاهن آخر، بينما يوضح التقابل اللاحق اختلاف رتبته.
- source_word: ἀνίστασθαι
  choice: أن يقوم
  rationale: تنقل ظهور الكاهن أو إقامته من غير أن تفرض هنا معنى القيامة من الموت.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: لا أن يُقال إنه على رتبة هارون
  rationale: يحفظ معنى وصف الكاهن أو تصنيفه بحسب رتبة هارون، بصياغة عربية مفهومة.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: ملكي صادق / هارون
  rationale: استُخدمت الصيغ العربية الكتابية الشائعة للاسمين.
theological_decisions:
- issue: معنى τελείωσις في حجة الرسالة الكهنوتية
  choice: الكمال
  alternative: الإتمام؛ الوصول الكامل إلى الله
  rationale: يبقي المصطلح مفتوحًا على ثقله الطقسي والخلاصي في السياق، ولا يختزله إلى كمال أخلاقي أو يضع تفسيرًا داخل المتن.
- issue: مرجع الضمير في ἐπ’ αὐτῆς νενομοθέτηται
  choice: الكهنوت اللاوي
  alternative: الشريعة؛ الترتيب العهدي عمومًا
  rationale: الكهنوت هو أقرب مرجع مؤنث صالح في اليونانية، والجملة الاعتراضية تشرح ارتباط التشريع المعطى للشعب بالنظام الكهنوتي اللاوي.
- issue: دلالة τάξις في المقارنة بين ملكي صادق وهارون
  choice: رتبة
  alternative: نظام؛ مثال
  rationale: «رتبة» تحفظ معنى الفئة أو النظام الكهنوتي من غير تحديد زائد لطبيعة العلاقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ السؤال البلاغي والجملة الاعتراضية، ووُضعت علامتا الحاشيتين [a] و[b] في المتن.
