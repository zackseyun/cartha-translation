  choice: الإبقاء على التعبير الحسي «في صُلب أبيه» في المتن
  alternative: كان لا يزال في جسد سلفه
  rationale: يحفظ هذا الاختيار منطق الكاتب القائم على حضور لاوي في إبراهيم من جهة النسب، من غير إدخال شرح لاهوتي تقني في النص.
- issue: تعيين المقصود بـ«أبيه»
  choice: ترجمة العبارة «أبيه» من غير ذكر إبراهيم صراحة
  alternative: سلفه إبراهيم
  rationale: النص اليوناني يقول «أبيه»، والسياق يحدد أن المقصود هو إبراهيم؛ لذلك لا تُضاف صراحة غير موجودة في الأصل.
