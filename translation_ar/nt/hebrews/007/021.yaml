  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: ar
  text: 'أمّا هذا فصار كاهنًا بقسم، بواسطة الذي قال له: «أقسم الرب ولن يغيّر رأيه: أنت كاهن إلى الأبد».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «قد أقسم الرب ولن يغيّر رأيه». فالفعل اليوناني Ὤμοσεν يمكن نقله «أقسم» أو «قد أقسم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: أَمَّا هٰذَا
  rationale: تحفظ العبارة المقابلة مع الكهنة السابقين المذكورين في العدد السابق، وتؤدي إيجاز اليونانية بصورة عربية واضحة.
- source_word: μετὰ ὁρκωμοσίας
  choice: بِقَسَمٍ
  rationale: تفيد المصاحبة والوسيلة، وتحفظ المقابلة مع تعيين الكهنة السابقين من دون قسم.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: عَلَى لِسَانِ الَّذِي قَالَ لَهُ
  rationale: تعبير عربي طبيعي ينقل معنى الوساطة في διά مع المضاف إليه، ويُبقي هوية القائل كما يعرضها النص من خلال الاقتباس.
- source_word: Ὤμοσεν κύριος
  choice: أَقْسَمَ الرَّبُّ
  rationale: ينقل الفعل اليوناني الماضي نقلاً مباشرًا، مع ترجمة κύριος بالرب بحسب النص اليوناني.
- source_word: οὐ μεταμεληθήσεται
  choice: وَلَنْ يَتَرَاجَعَ
  rationale: المقصود عدم الرجوع عن القرار المعلن بالقسم، لا الندم الأخلاقي؛ وهذه صياغة عربية موجزة وطبيعية.
- source_word: Σὺ ἱερεὺς
  choice: أَنْتَ كَاهِنٌ
  rationale: تُستكمل الرابطة المحذوفة في اليونانية كما تقتضي العربية، مع إبراز الضمير الموجود في الأصل.
- source_word: εἰς τὸν αἰῶνα
  choice: إِلَى الأَبَدِ
  rationale: هذا هو المعنى الاصطلاحي الزمني للعبارة في السياق، ويدل على دوام الكهنوت.
theological_decisions:
- issue: صياغة اقتباس المزمور 110:4 عن كهنوت المخاطَب
  choice: إبراز أن هذا الكهنوت صار بقسم إلهي وأنه دائم
  alternative: يمكن ترجمة Ὤμοσεν بصيغة تفيد استمرار الأثر، مثل «قد أقسم الرب»، وترجمة οὐ μεταμεληθήσεται «لن يغيّر رأيه».
  rationale: سياق الرسالة يقابل بين الكهنة السابقين الذين صاروا كهنة بلا قسم وبين هذا الكاهن الذي ثبت كهنوته بقسم. الصياغة تحفظ هذه المقابلة من غير إضافة تقرير عقائدي يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «أما هذا» لإظهار المقابلة، و«على لسان» لتجنب تركيب حرفي ثقيل، مع إبقاء الاقتباس موجزًا وقريبًا من بنية الأصل.
