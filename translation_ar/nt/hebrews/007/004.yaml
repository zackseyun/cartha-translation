base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: ar
  text: فتأمّلوا ما أعظم هذا الرجل الذي أعطاه إبراهيم، رئيس الآباء، عُشرًا[a] من الغنائم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العُشر». واليونانية تقول حرفيًا: «عُشرًا».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يدل اللفظ اليوناني على غنائم الحرب، وربما على أفضل الغنائم أو مختارها.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: فتأمّلوا
  rationale: فعل أمر للجمع يدعو المخاطَبين إلى النظر المتأني والتفكير؛ و«تأمّلوا» ينقل هذه القوة بوضوح في العربية المعاصرة.
- source_word: δὲ
  choice: الفاء في «فتأمّلوا»
  rationale: أداة انتقال خفيفة تربط الدعوة إلى التأمل بالسياق السابق، من غير أن تفيد تعارضًا قويًا أو معنى زمنيًا.
- source_word: πηλίκος
  choice: ما أعظم
  rationale: تعبّر عن مقدار العظمة، وصيغة التعجب العربية تحافظ على القوة البلاغية من غير تحديد نوع هذه العظمة بما يتجاوز النص.
- source_word: οὗτος
  choice: هذا
  rationale: يشير إلى ملكي صادق المذكور في السياق السابق، مع إبقاء الإشارة موجزة كما في اليونانية.
- source_word: ᾧ
  choice: الذي ... أعطاه
  rationale: صيغت صلة الموصول طبيعيًا في العربية، وأُثبت ضمير المفعول غير المباشر في «أعطاه» ليؤدي معنى «له/إليه».
- source_word: δεκάτην
  choice: عُشرًا
  rationale: ينقل المعنى الحرفي «جزءًا واحدًا من عشرة» من غير افتراض دلالة مؤسسية لاحقة قد توحي بها بعض المصطلحات.
- source_word: Ἀβραὰμ
  choice: إبراهيم
  rationale: الصيغة العربية القياسية للاسم الكتابي.
- source_word: ἔδωκεν
  choice: أعطاه
  rationale: ترجمة مباشرة للفعل الماضي، مع ضمير يعود إلى ملكي صادق.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: من الغنائم
  rationale: يدل اللفظ على ما أُخذ في الحرب، وربما على أفضله أو مختاره؛ اختيرت «الغنائم» في المتن وحُفظ الاحتمال الأخص في الحاشية.
- source_word: ὁ πατριάρχης
  choice: رئيس الآباء
  rationale: لقب يبرز منزلة إبراهيم بوصفه أبًا عظيمًا للأسلاف، وهو تعبير عربي كتابي واضح ومفهوم.
theological_decisions:
- issue: مرجع اسم الإشارة ودلالة العظمة
  choice: تُعرض عظمة ملكي صادق من خلال إعطاء إبراهيم، رئيس الآباء، العُشر له.
  alternative: يمكن إبراز ما يستلزمه تلقي العُشر من تفوق في المنزلة بصورة أصرح.
  rationale: النص يستدل بفعل إبراهيم على عظمة ملكي صادق، لكنه لا يصرّح هنا بكل النتائج اللاهوتية لهذا الفعل؛ لذلك تُرك استيفاء الاستدلال للسياق اللاحق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدمت صيغة «ما أعظم» للمحافظة على القوة البلاغية، ووُضعت علامتا الحاشية مباشرة بعد اللفظين اللذين تشرحانهما.
