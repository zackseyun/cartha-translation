  text: And inasmuch as this was not without an oath (for they indeed have become priests without an oath,[a]
translation:
  language: ar
  text: وبقدر ما لم يكن ذلك من دون قَسَم (فإن أولئك صاروا كهنة من دون قَسَم،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
