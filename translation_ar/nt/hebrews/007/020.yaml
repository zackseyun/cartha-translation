    reason: 'بديل معجمي لـ«من دون»، يعكس دلالة χωρίς: «بلا/بمعزل عن».'
lexical_decisions:
- source_word: Καὶ καθ’ ὅσον
  choice: وبقدر ما
  rationale: تحافظ العبارة على أداة الربط وعلى الصيغة القياسية التي تمهّد للمقابلة مع «فبقدر ذلك» في الآية 22، بدل اختزالها إلى مجرد تعليل بمعنى «ولأن».
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: لم يحدث ذلك من دون قَسَم
  rationale: أُضيف الفعل والضمير لاستكمال التركيب المحذوف في اليونانية بعبارة عربية مفهومة، مع إبقاء النفي المؤكد والمعنى المتعلق بإقامة الكاهن بقَسَم.
- source_word: ὁρκωμοσίας
  choice: قَسَم
  rationale: لفظ عربي واضح وموجز يدل هنا على القسم الذي يؤكد التعيين، من غير إضافة معنى عقدي غير مصرح به.
- source_word: οἱ μὲν γὰρ
  choice: فأولئك
  rationale: الفاء تؤدي الوظيفة التفسيرية لـγάρ، و«أولئك» تشير طبيعيًا إلى الكهنة السابقين، بينما تظل μέν ممهدة للمقابلة التي تكتمل في الآية التالية.
- source_word: χωρὶς ὁρκωμοσίας
  choice: من دون قَسَم
  rationale: تكرار الصياغة نفسها يحفظ التوازي اللفظي المقصود داخل الجملة.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: قد صاروا كهنة
  rationale: تنقل الصيغة المحيطية معنى دخولهم في الكهنوت مع بقاء الحالة الناتجة، من دون تحويلها صراحة إلى مبني للمجهول.
theological_decisions:
- issue: هوية الكهنة في طرف المقابلة الأول
  choice: الإشارة إليهم بلفظ «أولئك» بوصفهم الكهنة السابقين في سياق الحجة
  alternative: التصريح بأنهم «الكهنة اللاويون»
  rationale: السياق يدل على الكهنة اللاويين، لكن النص في هذه الآية لا يسميهم صراحة؛ لذلك تُحفظ الإشارة السياقية من غير إدخال توصيف تفسيري داخل المتن.
- issue: دلالة القَسَم في المقابلة
  choice: إبقاء القول على أن التعيين المقابل لم يحدث من دون قَسَم
  alternative: التصريح بأن كهنوت يسوع أُقيم بقَسَم إلهي
  rationale: هذا هو اتجاه السياق والمقابلة التي تكتمل في الآية التالية، لكن الآية الحالية جزء من جملة ممتدة؛ فلا ينبغي استباق تتمتها أو تحميل هذا الشطر وحده خلاصة عقائدية موسعة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة حجاجية رصينة. أُبقي القوس مفتوحًا لأن الجملة الاعتراضية والمقابلة النحوية تستمران في الآية التالية، ووُضع موضع الحاشية [a] في المتن.
