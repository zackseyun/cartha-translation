lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: إن جاز التعبير
  rationale: تعبير عربي فصيح ومعاصر يؤدي وظيفة العبارة اليونانية في تلطيف القول والإشارة إلى أنه صياغة اعتبارية أو مجازية.
- source_word: δι’ Ἀβραὰμ
  choice: عن طريق إبراهيم
  rationale: ينقل معنى الوساطة في διά مع المضاف إليه، ويحفظ فكرة مشاركة لاوي في فعل سلفه من غير تحديد آلية لاهوتية تتجاوز النص.
- source_word: καὶ Λευὶ
  choice: لاوي نفسه
  rationale: ينقل القوة الإضافية والتوكيدية لـ καί، مبرزًا المفاجأة الحجاجية بأن الأمر يصدق حتى على لاوي.
- source_word: ὁ δεκάτας λαμβάνων
  choice: الذي يتلقّى الأعشار
  rationale: يحافظ على دلالة اسم الفاعل الحاضر بوصف تلقي الأعشار وظيفة مميزة للاوي في النظام الكهنوتي.
- source_word: δεκάτας
  choice: الأعشار
  rationale: المقابل العربي الاصطلاحي للعطايا التي مقدارها العُشر، وهو ملائم للسياق الديني والاقتصادي.
- source_word: δεδεκάτωται
  choice: قد أدّى العُشر
  rationale: 'صياغة عربية طبيعية توضح جهة الفعل المقصودة في الحجة: لاوي محسوب كمن أعطى العُشر بواسطة إبراهيم. وتشرح الحاشية أن الصيغة اليونانية مبنية للمجهول وحرفية التعبير مضغوطة.'
theological_decisions:
- issue: مشاركة لاوي التمثيلية في فعل إبراهيم
  choice: الإبقاء على أن لاوي أدّى العُشر عن طريق إبراهيم، مع تقييد القول بعبارة «إن جاز التعبير».
  alternative: اعتبار لاوي حاضرًا بصورة جماعية في سلفه إبراهيم، أو فهم القول على أنه بلاغي محض.
  rationale: يحفظ هذا الاختيار منطق الكاتب في نسبة فعل إبراهيم إلى لاوي من دون فرض تفسير عقائدي مفصل لطبيعة هذه المشاركة، كما يصون التوتر بين اللغة التمثيلية والتقييد البلاغي.
translation_notes:
  register: عربية فصحى واضحة ومهيبة من غير تقعر. استُخدمت «إن جاز التعبير» لصون التحفظ البلاغي، و«عن طريق إبراهيم» لإظهار الوساطة، مع شرح المبني للمجهول اليوناني في الحاشية بدل استعمال صياغة عربية ملتبسة في المتن.
