  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: ar
  text: لأَنَّ الشَّرِيعَةَ تُعَيِّنُ رِجَالًا رُؤَسَاءَ كَهَنَةٍ، وَهُمْ عُرْضَةٌ لِلضَّعْفِ؛ أَمَّا كَلِمَةُ الْقَسَمِ الَّذِي جَاءَ بَعْدَ الشَّرِيعَةِ، فَتُعَيِّنُ ابْنًا[a] قَدْ كُمِّلَ إِلَى الأَبَدِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «الابن». جاءت كلمة «ابن» في اليونانية بلا أداة تعريف، مما يبرز المقابلة مع «رجال»، مع أن المقصود في السياق هو يسوع.'
    reason: alternative_reading
  - marker: b
    text: 'ويجوز: «قد أُبلغ الكمال إلى الأبد». وقد يحمل الفعل أيضًا معنى «أُتمَّ» أو، في السياق الكهنوتي، «كُرِّس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νόμος
  choice: الشريعة
  rationale: تشير في السياق إلى شريعة موسى، ولا سيما أحكام الكهنوت؛ و«الشريعة» هي الصياغة العربية الطبيعية الواضحة.
- source_word: καθίστησιν
  choice: تُعيِّن
  rationale: تنقل معنى الإقامة الرسمية في منصب رئيس الكهنة، وهي أوضح هنا من «تجعل».
- source_word: ἀνθρώπους
  choice: رجالًا
  rationale: المراد رؤساء الكهنة اللاويون الذين كانوا رجالًا، كما يحافظ اللفظ على المقابلة الملموسة بينهم وبين الابن.
- source_word: ἀρχιερεῖς
  choice: رؤساء كهنة
  rationale: ينقل جمع النص الذي يشير إلى تعاقب شاغلي منصب رئيس الكهنة.
- source_word: ἔχοντας ἀσθένειαν
  choice: وهم عرضة للضعف
  rationale: يحافظ على مفهوم الضعف بوصفه وهنًا بشريًا وقابلية للقصور، لا مجرد مرض جسدي، مع تعبير عربي طبيعي.
- source_word: ὁ λόγος τῆς ὁρκωμοσίας
  choice: كلمة القسم
  rationale: تحافظ «كلمة» على النبرة الكتابية، وتشير العبارة إلى القول الإلهي المتضمن قسمًا.
- source_word: τῆς μετὰ τὸν νόμον
  choice: التي جاءت بعد الشريعة
  rationale: توضح أن القسم صدر زمنيًا بعد الشريعة، وفق حجة الرسالة من المزمور 110.
- source_word: υἱόν
  choice: ابنًا
  rationale: يحافظ التنكير على غياب أداة التعريف في اليونانية وعلى المقابلة بين «رجال» و«ابن»، مع بقاء الإشارة إلى يسوع واضحة من السياق.
- source_word: εἰς τὸν αἰῶνα
  choice: إلى الأبد
  rationale: المقابل العربي المألوف للعبارة في سياق الكهنوت الدائم.
- source_word: τετελειωμένον
  choice: قد كُمِّل
  rationale: يحافظ على صيغة اسم المفعول التام وعلى مجال معنى الإكمال والبلوغ إلى الغاية، من غير حصره في معنى التكريس الكهنوتي وحده.
theological_decisions:
- issue: تنكير υἱόν في مقابل ἀνθρώπους
  choice: ابنًا
  alternative: الابن
  rationale: يحافظ «ابنًا» على تنكير النص اليوناني وعلى قوة المقابلة النوعية، من غير نفي أن المقصود في السياق هو الابن الفريد.
- issue: دلالة τετελειωμένον في لاهوت الكهنوت في الرسالة إلى العبرانيين
  choice: قد كُمِّل إلى الأبد
  alternative: قد أُبلغ الكمال إلى الأبد؛ قد كُرِّس إلى الأبد
  rationale: تبقي الصياغة على التوتر الدلالي بين الإكمال والبلوغ إلى الغاية والأهلية الكهنوتية، ولا تختزل الفعل في التكريس وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «تُعيِّن» لبيان الإقامة في المنصب، و«عرضة للضعف» لتجنب إيحاء حصر الضعف في المرض. وُضعت علامتا الحاشيتين عند اللفظين اللذين تتعلق بهما البدائل فعلًا.
