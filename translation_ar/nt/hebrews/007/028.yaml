  source_fidelity: 'النص ينقل البنية الأساسية بدقة: الشريعة تعيّن رجالًا رؤساء كهنة ذوي ضعف، في مقابل كلمة القسم التي تعيّن ابنًا قد كُمِّل إلى الأبد. لكن الصلة «التي جاءت بعد الشريعة» في المسودة تؤنث الضمير، فتجعل المرجع النحوي الأقرب «كلمة»؛ بينما الوصف في اليونانية يعود إلى «القسم» (ὁρκωμοσία)، وهو مذكر بالعربية.'
