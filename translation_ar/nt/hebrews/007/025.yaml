  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: ar
  text: لذلك يقدر أيضًا أن يخلّص تمامًا[a] الذين يتقرّبون إلى الله بواسطته، لأنه حيّ دائمًا ليشفع لأجلهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى الأبد»؛ والترجمة التقليدية: «إلى أقصى الغاية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: لذلك
  rationale: تفيد الاستنتاج من الكلام السابق عن كهنوت يسوع الدائم، وتحافظ على الصلة المنطقية بعبارة عربية طبيعية.
- source_word: καὶ
  choice: أيضًا
  rationale: تحافظ على القوة الإضافية التي تربط هذه النتيجة بما سبق.
- source_word: σῴζειν
  choice: أن يخلّص
  rationale: لفظ عربي مألوف في سياق الخلاص، ويحفظ الثقل اللاهوتي والاستمرارية المعجمية.
- source_word: εἰς τὸ παντελές
  choice: خلاصًا كاملًا
  rationale: ينقل معنى الشمول والتمام بصورة طبيعية، من غير حصر العبارة في البعد الزمني وحده.
- source_word: δύναται
  choice: يقدر
  rationale: يعبّر بوضوح عن القدرة القائمة على دوام كهنوته.
- source_word: τοὺς προσερχομένους
  choice: الذين يتقرّبون
  rationale: يحفظ إيحاء الاقتراب من الله للعبادة ونيل القبول، وهو استعمال متكرر في الرسالة إلى العبرانيين.
- source_word: δι’ αὐτοῦ
  choice: به
  rationale: 'ينقل وساطته بإيجاز طبيعي: الاقتراب إلى الله يتم بواسطته.'
- source_word: τῷ θεῷ
  choice: إلى الله
  rationale: يتلاءم طبيعيًا مع فعل «يتقرّبون» ويحفظ اتجاه الاقتراب في الأصل.
- source_word: πάντοτε ζῶν
  choice: لأنه حيّ دائمًا
  rationale: يبيّن أن حياته الدائمة هي أساس قدرته على الخلاص، مع الحفاظ على القوة الاستمرارية للعبارة.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: ليشفع
  rationale: ينقل غرض حياته الدائمة بلفظ موجز ودقيق ومفهوم في العربية المعاصرة.
- source_word: ὑπὲρ αὐτῶν
  choice: فيهم
  rationale: «شفع فيه» تركيب عربي فصيح يدل على التوسط لمصلحته، ويؤدي معنى النيابة والمنفعة في ὑπέρ.
theological_decisions:
- issue: الدلالة الواسعة لعبارة εἰς τὸ παντελές
  choice: خلاصًا كاملًا في المتن
  alternative: إلى الأبد؛ إلى أقصى حد
  rationale: قد تدل العبارة على التمام والشمول أو على الدوام. يرجّح السياق تمام الخلاص، بينما تسند حياته الدائمة البعد الزمني أيضًا؛ لذلك يحفظ المتن معنى الكمال وتورد الحاشية البدائل دون حسم التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يتقرّبون» للمحافظة على لغة الاقتراب إلى الله في الرسالة، وصيغت عبارة الخلاص صياغة طبيعية مع إبقاء البديلين الزمني والتقليدي في الحاشية.
