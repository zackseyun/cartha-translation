- from: لذلك يقدر أيضًا أن يخلّص خلاصًا كاملًا الذين يتقرّبون به إلى الله،[a] لأنه حيّ دائمًا ليشفع فيهم.
  to: لذلك يقدر أيضًا أن يخلّص تمامًا[a] الذين يتقرّبون إلى الله بواسطته، لأنه حيّ دائمًا ليشفع لأجلهم.
  rationale: نُقلت علامة الحاشية إلى «تمامًا» لتطابق موضع البديل المعجمي في الأصل، وصُقلت الصياغة لتكون طبيعية وواضحة في العربية الفصحى الحديثة. يظل المتن محتفظًا بمعنى الخلاص الكامل، فيما تحفظ الحاشية الإمكان الزمني («إلى الأبد») والصياغة التقليدية، من غير حسم الدلالة المتنازع عليها.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:12Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى الأساسي منقول بأمانة، بما في ذلك الاستنتاج («لذلك»)، والقدرة على الخلاص، والاقتراب إلى الله بواسطة المسيح، وحياته الدائمة وشفاعته. لكن موضع علامة الحاشية في المسودة يربطها خطأً بعبارة «إلى الله» بدل العبارة اليونانية εἰς τὸ παντελές، كما أن «بواسطته» و«لأجلهم» أوضح في العربية الفصحى المعاصرة لمعنى الوساطة والشفاعـة.
  naturalness: «أن يخلّص تمامًا الذين يتقرّبون إلى الله بواسطته» أسلس من «أن يخلّص خلاصًا كاملًا الذين يتقرّبون به إلى الله». وتعبير «حيّ دائمًا ليشفع لأجلهم» واضح وطبيعي ومحافظ على العلاقة السببية والغائية في الأصل.
  terminology: يُحافَظ على «يخلّص» في السياق الخلاصي، و«يتقرّبون إلى الله» في لغة العبرانيين، و«يشفع» لمعنى ἐντυγχάνειν. لا يلزم تفسير عقائدي إضافي.
  issues:
  - severity: medium
    issue: علامة الحاشية [a] موضوعة بعد «إلى الله».
    rationale: الحاشية تشرح εἰς τὸ παντελές («تمامًا/إلى الأبد»)، لا عبارة «إلى الله». ينبغي أن تتبع اللفظ الذي ينقل هذا المعنى.
  - severity: low
    issue: «خلاصًا كاملًا الذين» تركيب أقل سلاسة، و«به» قد يكون أقل وضوحًا في بيان الوساطة.
    rationale: استخدام «تمامًا» بوصفه قيدًا، و«بواسطته» لوساطة δι’ αὐτοῦ، يقدّم عربية فصحى حديثة أوضح من دون تغيير المعنى.
  - severity: low
    issue: «ليشفع فيهم» فصيحة، لكن «ليشفع لأجلهم» أصرح للقارئ المعاصر.
    rationale: ينقل «لصالحهم/عنهم» معنى ὑπὲρ αὐτῶν بوضوح مع الحفاظ على المعنى التمثيلي للشفاعـة.
