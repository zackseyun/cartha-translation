    rationale: '«لا قيامته من الموت» مختصرة على نحو قد يبدو وكأنها نفي للقيامة نفسها. الأنسب: «لا إلى قيامته من الموت بوصفها المعنى الرئيس هنا»، إذ يوضح المقصود التأويلي دون التباس.'
