base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: ar
  text: فمن الواضح أن ربنا قد طلع من يهوذا[a]، وهو سبط لم يقل موسى عنه شيئًا في ما يتعلق بالكهنة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد نبت من يهوذا». يستحضر الفعل اليوناني صورة الطلوع أو النبات؛ والمقصود هنا أساسًا أن أصله من سبط يهوذا، لا الإشارة إلى قيامته من الموت بوصفها المعنى الرئيس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: من الواضح
  rationale: تؤدي معنى الصفة الخبرية الدالة على حقيقة ظاهرة، بصياغة عربية فصيحة وطبيعية.
- source_word: γὰρ
  choice: فـ
  rationale: تحفظ الصلة التفسيرية بالحجة السابقة بإيجاز طبيعي في العربية.
- source_word: ἐξ Ἰούδα
  choice: من يهوذا
  rationale: تدل على الأصل أو النسب، مع تجنب تكرار كلمة «سبط» التي ترد في الجملة التالية.
- source_word: ἀνατέταλκεν
  choice: قد طلع
  rationale: تحفظ صورة الفعل اليوناني، أي الطلوع أو النشوء، كما أن صيغة «قد» تلائم دلالة التام؛ والسياق يبين أن المقصود المنشأ القبلي لا القيامة في المقام الأول.
- source_word: ὁ κύριος ἡμῶν
  choice: ربنا
  rationale: ترجمة عربية طبيعية وموجزة للقب مع ضمير الملكية، من غير إضافة اسم يسوع إلى نص الآية.
- source_word: εἰς ἣν φυλήν
  choice: وهو سبط
  rationale: تربط العبارة بيهوذا ربطًا عربيًا واضحًا، وتقدم الجملة الموصولة التي تتناول ما قاله موسى عن ذلك السبط.
- source_word: περὶ ἱερέων οὐδὲν
  choice: لم يقل ... شيئًا بشأن كهنة منه
  rationale: تحافظ على الإشارة إلى الكهنة بصيغة الأشخاص لا إلى الكهنوت بوصفه مؤسسة مجردة، وتوضح عود العبارة إلى السبط دون تغيير الحجة.
- source_word: Μωϋσῆς ἐλάλησεν
  choice: قال موسى
  rationale: «قال» هي المقابل العربي الطبيعي للفعل في هذا السياق، مع ترتيب عربي سلس.
theological_decisions:
- issue: مرجع «ربنا»
  choice: الإبقاء على «ربنا» كما في النص، مع فهمه سياقيًا على أنه يسوع المنحدر من يهوذا.
  alternative: إضافة «يسوع» صراحةً.
  rationale: السياق يحدد المرجع، لكن الآية نفسها تستعمل اللقب دون الاسم؛ لذلك لا تُضاف مادة تفسيرية إلى المتن.
- issue: دلالة ἀνατέταλκεν
  choice: «قد طلع» بوصفها صورة للنشوء أو الظهور من يهوذا، أي للأصل والنسب.
  alternative: «قد قام»، التي قد تُفهم أساسًا على القيامة؛ أو «انحدر»، التي تزيل الصورة المجازية.
  rationale: موضوع السياق هو الانتماء القبلي وأساس الكهنوت، لكن إبقاء صورة الطلوع يصون الدلالة المجازية الحقيقية للفعل دون حسمها بتعبير نسبي مجرد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «سبط» لأنه المصطلح الطبيعي لأسباط إسرائيل، وحُفظت استعارة الطلوع مع شرحها في الحاشية منعًا لالتباسها بالقيامة.
