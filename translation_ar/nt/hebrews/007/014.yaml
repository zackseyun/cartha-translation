    issue: عبارة «كهنة منه»
    rationale: الضمير في «منه» يصرّح بأن الكهنة من السبط، بينما لا يرد في περὶ ἱερέων ضمير أو تعبير مقابِل لـ«منه». العلاقة بالسِّبط مفهومة من εἰς ἣν φυλήν، لكن ينبغي نقلها بعبارة «عنه/في ما يتعلق به» لتجنب إضافة غير لازمة إلى النص.
