  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: ar
  text: أمّا الذي لا يُسجَّل نسبه ضمن أنسابهم، فقد أخذ عُشرًا من إبراهيم، وبارك صاحبَ المواعيد.[a]
  philosophy: optimal-equivalence
  footnotes:
