    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: أمّا الذي لا يُنسَب في سلسلة أنسابهم
  rationale: يؤدي اسم الفاعل المبني للمجهول المستعمل اسميًا، ويُبقي التركيز على عدم انتساب ملكي صادق إلى السلسلة اللاوية دون استنتاجات عن طبيعته أو أصله.
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: فقد أخذ العُشر من إبراهيم
  rationale: ينقل معنى الفعل، أي أخذ أو تلقّي العُشر، ويحافظ بقدر طبيعي في العربية على دلالة التمام ذات الصلة بحجة الكاتب.
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: الذي له المواعيد
  rationale: يحافظ على زمن اسم الفاعل الحاضر وعلى جمع «المواعيد»، مع صياغة عربية طبيعية لا تحسم الدلالة الزمنية أكثر مما يفعل اليوناني.
- source_word: εὐλόγηκεν
  choice: وبارك
  rationale: الفعل العربي الماضي هو الصياغة السردية الطبيعية، ويعرض الفعل المكتمل الذي يستند إليه الكاتب في حجته.
theological_decisions:
- issue: المقابلة النَّسَبية مع الكهنوت اللاوي
  choice: فهم العبارة على أن ملكي صادق غير منتسب إلى سلسلة أنساب اللاويين
  alternative: 'فهمها بمعنى أوسع: ليس من نسلهم'
  rationale: السياق يناقش استحقاق أخذ العشور على أساس النسب الكهنوتي؛ لذلك تُحفظ الدلالة النسبية القانونية من غير تحويلها إلى تقرير ميتافيزيقي عن ملكي صادق.
- issue: زمن حيازة إبراهيم للمواعيد
  choice: الذي له المواعيد
  alternative: الذي كانت له المواعيد
  rationale: اسم الفاعل اليوناني حاضر، والصياغة المختارة تحفظ هذا الشكل والتوتر الدلالي بدل تقييده بزمن ماضٍ صريح.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «سلسلة أنسابهم» لتوضيح الإحالة إلى نسل اللاويين في السياق من دون إقحام تفسير زائد، و«العُشر» لمباشرة المعنى، مع ذكر «العشور» في الحاشية بوصفه البديل الاصطلاحي.
