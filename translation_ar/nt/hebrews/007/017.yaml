lexical_decisions:
- source_word: μαρτυρεῖται
  choice: يُشهَد له
  rationale: صيغة مضارع مبني للمجهول تُدخل شهادة الكتاب. تحافظ الصياغة على المبني للمجهول، ويعود الضمير بحسب السياق إلى الشخص المخاطَب في الاقتباس، من غير تعيين فاعل الشهادة صراحة.
- source_word: γὰρ
  choice: فإنه
  rationale: أداة تعليل تربط الاقتباس بما سبقه وتقدّمه بوصفه سندًا له.
- source_word: ὅτι
  choice: ':'
  rationale: تُدخل مضمون الشهادة في صورة اقتباس مباشر، وتؤدي النقطتان هذه الوظيفة طبيعيًا في العربية.
- source_word: Σὺ
  choice: أنت
  rationale: ضمير مخاطب مفرد صريح يحمل نبرة التوكيد الموجودة في اليونانية.
- source_word: ἱερεὺς
  choice: كاهن
  rationale: ينقل اللقب الكهنوتي كما هو من غير توسيعه إلى «رئيس كهنة»، وهو ما لا يرد في هذا الموضع.
- source_word: εἰς τὸν αἰῶνα
  choice: إلى الأبد
  rationale: تعبير عربي واضح ومألوف يدل على الدوام، ويوافق المعنى الزمني للعبارة اليونانية.
- source_word: κατὰ τὴν τάξιν
  choice: على رتبة
  rationale: صياغة عربية موجزة تدل على الانتساب أو المطابقة لرتبة كهنوتية؛ وتُذكر «بحسب رتبة» في الحاشية بوصفها بديلًا أقرب إلى البنية اللفظية.
- source_word: Μελχισέδεκ
  choice: ملكي صادق
  rationale: نقل للاسم بصيغته العربية الكتابية المألوفة.
theological_decisions:
- issue: نقل وصف المخاطَب في اقتباس المزمور من غير إدخال تفسير عقائدي لاحق
  choice: أنت كاهن إلى الأبد على رتبة ملكي صادق
  alternative: أنت رئيس كهنة إلى الأبد على رتبة ملكي صادق
  rationale: النص اليوناني يقول «كاهن» لا «رئيس كهنة». ومع أن الرسالة تعرض يسوع بوصفه رئيس كهنة في مواضع أخرى، فإن إضافة «رئيس» هنا تتجاوز نص الاقتباس وتحسم دلالته بالتوسيع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على صيغة الشهادة المبنية للمجهول، وعلى الإيجاز الشعري للاقتباس، مع تجنب إضافة «رئيس» إلى «كاهن».
