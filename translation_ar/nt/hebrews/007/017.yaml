  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: ar
  text: 'فإنه يُشهَد: «أنت كاهن إلى الأبد بحسب رتبة ملكي صادق».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بالصياغة التقليدية: «على رتبة ملكي صادق».'
