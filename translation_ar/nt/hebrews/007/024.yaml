  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعملت «أمّا هو» لإظهار المقابلة، وحُفظ الاحتمال المعجمي في الحاشية دون تحميل النص صياغة مذهبية لاحقة.
