  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: ar
  text: أمّا هو، فلأنه يبقى إلى الأبد، له كهنوت لا ينتقل إلى غيره.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «له كهنوت لا يتغير» أو «له الكهنوت على الدوام». تحتمل الصفة اليونانية هذه المعاني؛ والمقصود في السياق أنه، لأنه يبقى إلى الأبد، لا ينتقل كهنوته إلى شخص آخر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: أمّا هو
  rationale: أداة التعريف مستعملة استعمال الاسم وتشير إلى يسوع في مقابلة الكهنة الكثيرين المذكورين في السياق السابق، و«أمّا هو» تؤدي معنى المقابلة بصورة عربية طبيعية.
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: فلأنه يبقى
  rationale: διά مع المصدر المسبوق بأداة التعريف تفيد السببية، وμένειν يدل هنا على الاستمرار في الوجود في مقابل الكهنة الذين يمنعهم الموت من البقاء.
- source_word: εἰς τὸν αἰῶνα
  choice: إلى الأبد
  rationale: تعبير زمني اصطلاحي يدل على الدوام بلا نهاية، وهذه الصياغة واضحة ومألوفة في العربية الفصحى المعاصرة.
- source_word: ἀπαράβατον
  choice: لا ينتقل إلى غيره
  rationale: تحتمل الصفة معنى غير القابل للانتقال أو غير المتغير. وفي سياق مقابلة يسوع بالكهنة الذين يموتون ويخلف بعضهم بعضًا، تبرز دلالة أن كهنوته لا ينتقل إلى سواه، مع حفظ البديل الدلالي في الحاشية.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: له كهنوت
  rationale: الفعل ἔχει يدل على امتلاك المنصب أو الاحتفاظ به. و«له كهنوت» تعبير عربي موجز وطبيعي يؤدي معنى حيازته للكهنوت.
- source_word: ἱερωσύνην
  choice: كهنوت
  rationale: الاسم يدل على مقام الكاهن أو منصبه، و«كهنوت» هو المقابل العربي الواضح والمستقر في هذا السياق.
theological_decisions:
- issue: دلالة ἀπαράβατον في وصف كهنوت المسيح
  choice: لا ينتقل إلى غيره
  alternative: كهنوت لا يتغير؛ كهنوت دائم
  rationale: السياق المباشر يقابل بين الكهنة الكثيرين الذين حال الموت دون بقائهم وبين يسوع الذي يبقى إلى الأبد، مما يرجح معنى عدم انتقال كهنوته إلى خلف. ولأن اللفظة قد تحمل أيضًا معنى عدم التغير أو الدوام، ذُكر ذلك في الحاشية بدل إلغاء الاحتمال الدلالي.
