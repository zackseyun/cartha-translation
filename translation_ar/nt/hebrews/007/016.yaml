  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: ar
  text: الذي صار كذلك، لا بحسب شريعة تقوم على وصية جسدية[a]، بل بحسب قوة حياة لا تفنى[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شريعة مطلب جسدي»، أو «شريعة وصية بدنية». والمقصود بـ«جسدية» هنا ما يتعلق بالجسد أو النسب، لا ما هو خاطئ أخلاقيًا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حياة لا تنتهي». وتقليديًا: «حياة لا نهاية لها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: الذي
  rationale: اسم موصول يعود إلى المذكور في السياق السابق، ويحافظ على الصلة النحوية بالآية السابقة.
- source_word: κατὰ νόμον
  choice: بحسب شريعة
  rationale: تفيد κατά مع النصب المعيار أو الأساس. واختيار «شريعة» هنا طبيعي في العربية ولا يعيّن بالضرورة الشريعة الموسوية بوصفها اسمًا علمًا.
- source_word: ἐντολῆς σαρκίνης
  choice: وصية جسدية
  rationale: يحافظ هذا التعبير على صورة الجسد في الأصل، من غير أن يحمّل الصفة معنى أخلاقيًا كأنها «خاطئة». والمقصود في السياق أمر يتعلق بالمؤهل الجسدي أو النسبي الخارجي.
- source_word: γέγονεν
  choice: صار كذلك
  rationale: ينقل الفعل التام حالة حاضرة نتجت من حدث سابق، و«كذلك» تستعيد من السياق صيرورته كاهنًا من غير تكرار تفسيري مطوّل.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: بل بحسب قوة
  rationale: يحافظ على الموازاة التضادية بين عبارتي κατά وعلى الصياغة المكثفة في الأصل.
- source_word: ζωῆς ἀκαταλύτου
  choice: حياة لا تزول
  rationale: ينقل معنى ما لا يُحلّ أو يُقضى عليه بصياغة عربية واضحة وكريمة، مع إبقاء الفكرة أوسع من مجرد طول المدة.
theological_decisions:
- issue: دلالة σαρκίνης في مقابل ἀκαταλύτου
  choice: «جسدية» بمعنى متعلقة بالجسد أو النسب والمقومات الخارجية
  alternative: «بدنية» أو «مادية»؛ أما «شهوانية» فتوحي بمعنى أخلاقي غير مقصود هنا
  rationale: السياق يقابل تنظيمًا كهنوتيًا قائمًا على مؤهل جسدي أو نسبي بقوة حياة لا تزول، ولا يصف الوصية بأنها خاطئة.
- issue: دلالة ἀκαταλύτου
  choice: «لا تزول»
  alternative: «لا تنتهي» أو «غير قابلة للفناء»
  rationale: «لا تزول» عربية طبيعية تحفظ معنى عدم الانحلال أو الإبطال، بينما «لا تنتهي» قد تحصر الدلالة في الاستمرار الزمني وحده.
- issue: علاقة νόμον بـἐντολῆς σαρκίνης
  choice: 'إبقاء تركيب الإضافة: «شريعة وصية جسدية»'
  alternative: «شريعة قائمة على وصية جسدية»
  rationale: الإضافة في اليونانية تحتمل الوصف أو البيان. أبقت الترجمة التركيب مكثفًا ولم تحسم العلاقة بإضافة تفسير غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حوفظ على إيجاز الأصل وعلى التباين بين «وصية جسدية» و«قوة حياة لا تزول»، مع تجنب تفسير «جسدية» بمعنى أخلاقي سلبي.
