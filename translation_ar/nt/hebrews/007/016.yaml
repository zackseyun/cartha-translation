review_pass:
  verdict: revise
  source_fidelity: ينقل النص المقابلة الأساسية بين أساسٍ قانوني ذي طابع جسدي وقوة حياة غير قابلة للزوال. لكن تركيب «شريعة وصية جسدية» غير طبيعي في العربية الحديثة إلى حدّ قد يحجب علاقة الإضافة في اليونانية.
  naturalness: «شريعة وصية جسدية» تركيب ثقيل وملتبس عربيًا؛ والصياغة «شريعة تقوم على وصية جسدية» أوضح مع محافظة معقولة على الإيجاز والمعنى. كما أن «حياة لا تفنى» أدق وأرسخ عربيًا لـἀκαταλύτου من «حياة لا تزول».
  terminology: «جسدية» مناسبة هنا إذا رافقتها الحاشية المانعة للفهم الأخلاقي. ولا ينبغي جعل الحاشية التقليدية «حياة أبدية»، لأن ذلك يتجاوز البديل التقليدي «حياة لا تنتهي/لا نهاية لها» وقد يوحي بدلالة أوسع من لفظ الأصل.
  issues:
  - severity: medium
    issue: تركيب «شريعة وصية جسدية» غير سلس وملتبس.
    rationale: الإضافة المتتابعة ممكنة من حيث البنية، لكنها لا تؤدي علاقة νόμον ἐντολῆς σαρκίνης بوضوح في العربية المعاصرة. «شريعة تقوم على وصية جسدية» يبين العلاقة دون تغيير المقابلة أو جعل الشريعة الموسوية اسمًا معينًا.
  - severity: low
    issue: «لا تزول» أضعف قليلًا من دلالة ἀκαταλύτου.
    rationale: اللفظ اليوناني يشير إلى ما لا يمكن حلّه أو إبطاله أو إفناؤه، و«لا تفنى» أقرب إلى هذه الدلالة في هذا السياق.
  - severity: medium
    issue: الحاشية ب تورد «حياة أبدية» بوصفها تقليدية.
    rationale: سجل المراجعة الإنجليزي يذكر البديل التقليدي «endless life»، لا «eternal life». والأخيرة قد توسع المعنى وتتجاوز المقصود المعجمي المقصود بالحاشية.
