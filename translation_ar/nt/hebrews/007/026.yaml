source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: ar
  text: 'لِأَنَّ رَئِيسَ كَهَنَةٍ كَهَذَا كَانَ يَلِيقُ بِنَا حَقًّا: تَقِيٌّ[a]، بَرِيءٌ مِنَ الشَّرِّ، غَيْرُ مُدَنَّسٍ، مُنْفَصِلٌ عَنِ الْخَاطِئِينَ[b]، وَقَدْ صَارَ أَعْلَى مِنَ السَّمَاوَاتِ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وَرِع». تصف الكلمة صلاحه وتقواه الملائمين لمقامه الكهنوتي.'
    reason: lexical_alternative
  - marker: b
    text: لا تستلزم العبارة أنه لم يخالط الخطاة في حياته على الأرض؛ وقد تشير إلى تميّزه عنهم في الطهارة وإلى مقامه الممجَّد.
    reason: theological_clarification
lexical_decisions:
- source_word: Τοιοῦτος
  choice: مِثْلَ هَذَا
  rationale: تحفظ الإشارة الرجعية إلى صفات رئيس الكهنة الموصوف في السياق السابق، وهي صياغة عربية طبيعية.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تحفظ الصلة التفسيرية بالحجة السابقة.
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: كَانَ يَلِيقُ بِنَا حَقًّا
  rationale: «بنا» تعبّر عن الملاءمة لنا، و«حقًّا» تنقل القوة التوكيدية المرجحة لـ καί، مع إبقاء دلالة الماضي الناقص.
- source_word: ἀρχιερεύς
  choice: رَئِيسَ كَهَنَةٍ
  rationale: المقابل العربي المألوف والدقيق للمنصب الكهنوتي في الرسالة إلى العبرانيين.
- source_word: ὅσιος
  choice: تَقِيٌّ
  rationale: يميز معنى ὅσιος، أي الصلاح والتقوى الموافقان لله، عن ἅγιος؛ و«تقي» واضح في العربية الحديثة ويحفظ البعد الأخلاقي والديني.
- source_word: ἄκακος
  choice: بَرِيءٌ مِنَ الشَّرِّ
  rationale: يعبّر بوضوح عن انعدام الشر وسوء القصد، ويتجنب احتمال فهم «بريء» وحدها بمعنى غير مذنب قضائيًا فقط.
- source_word: ἀμίαντος
  choice: طَاهِرٌ مِنَ الدَّنَسِ
  rationale: يحفظ صورة الطهارة وعدم التدنس وما لها من صدى كهنوتي وطقسي، بلغة عربية مفهومة.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: مُنْفَصِلٌ عَنِ الْخَاطِئِينَ
  rationale: ترجمة مباشرة لاسم الفاعل التام الدال على حالة قائمة من الانفصال، من غير حصرها في معنى مكاني أو زمني.
- source_word: ὑψηλότερος τῶν οὐρανῶν γενόμενος
  choice: وَقَدْ صَارَ أَعْلَى مِنَ السَّمَاوَاتِ
  rationale: تحفظ المقارنة الصريحة ودلالة γενόμενος على الصيرورة إلى مقام الرفعة، من غير إضافة فاعل غير مصرّح به.
theological_decisions:
- issue: علاقة يسوع بالخاطئين في عبارة «منفصل عن الخاطئين»
  choice: 'إبقاء العبارة مباشرة: «منفصل عن الخاطئين»'
  alternative: «متميّز عن الخاطئين» أو تفسيرها بأنها انفصال مكاني بعد الصعود فقط
  rationale: سلسلة الصفات تشدد على طهارته وأهليته الكهنوتية ورفعته، لكن النص نفسه لا يحدد هنا نوع الانفصال؛ لذلك تُحفظ دلالته وتوتره من غير أن يُفهم أنه لم يخالط الخاطئين في خدمته الأرضية.
- issue: دلالة γενόμενος مع «أعلى من السماوات»
  choice: «وقد صار أعلى من السماوات»
  alternative: «وهو أعلى من السماوات» أو «وقد رُفع فوق السماوات»
  rationale: الصياغة المختارة تحافظ على الحركة التاريخية/النتيجية إلى مقام الرفعة من غير محو دلالة الفعل، ومن غير تحديد المبني للمجهول أو الإيحاء بتغيّر في الطبيعة الإلهية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع ضبط جزئي شامل للنص القصير تسهيلًا للقراءة. استُعملت عبارات تفسيرية موجزة داخل الصفات حيث يمنع المقابل المفرد التباسًا دلاليًا، مع الحفاظ على إيقاع تعداد الصفات الكهنوتية.
