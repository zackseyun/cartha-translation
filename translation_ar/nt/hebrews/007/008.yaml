  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: ar
  text: وهنا أناسٌ يموتون يأخذون الأعشار، أما هناك فيُشهَد له بأنه حيّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أما هناك فيُشهَد عنه أنه يحيا». تُبقي اليونانية القول في صيغة شهادة الكتاب، بدلًا من أن تقرر مباشرةً أن ملكي صادق خالد حرفيًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὧδε
  choice: هنا
  rationale: تحفظ المقابلة الإشارية الموجزة مع ἐκεῖ، وتشير في السياق إلى حالة الكهنة اللاويين.
- source_word: δεκάτας
  choice: الأعشار
  rationale: المصطلح العربي الكتابي والقانوني الطبيعي لما يُعطى بوصفه عُشرًا.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: أناسٌ يموتون
  rationale: ينقل تركيب اسم الفاعل الحاضر بوضوح، ويبرز فناء الكهنة من غير تحويل العبارة إلى وصف عقائدي زائد.
- source_word: λαμβάνουσιν
  choice: يأخذون
  rationale: ترجمة مباشرة وطبيعية في سياق أخذ الأعشار، من غير إضافة معنى الجباية صراحةً.
- source_word: ἐκεῖ
  choice: هناك
  rationale: تحفظ التقابل البلاغي «هنا... هناك»، حيث تحيل إلى مشهد ملكي صادق في شهادة الكتاب.
- source_word: μαρτυρούμενος
  choice: فيُشهَد له
  rationale: تحفظ صيغة المبني للمجهول وقوة الشهادة النصية، ولا تجعل حياة ملكي صادق تقريرًا مباشرًا مستقلًا عن شهادة الكتاب.
- source_word: ὅτι ζῇ
  choice: بأنه حيّ
  rationale: صياغة عربية موجزة وطبيعية تحفظ دلالة المضارع، ويمكن فهمها في إطار الشهادة الواردة عنه.
theological_decisions:
- issue: طبيعة المقابلة بين الكهنة اللاويين وملكي صادق
  choice: المقابلة بين أناس يموتون وبين من يشهد له النص بأنه حيّ، مع إبقاء الكلام في صيغة الشهادة.
  alternative: أن يقرر النص صراحةً أن ملكي صادق خالد شخصيًا ولا يموت حرفيًا.
  rationale: اليونانية تقول μαρτυρούμενος، فتجعل الحياة مضمون شهادة عنه. إبقاء المبني للمجهول يصون التوتر بين صورة ملكي صادق في رواية الكتاب وبين أي تقرير أنطولوجي عن خلوده.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُعمل «أناس يموتون» بدل «أناس مائتون» للاقتراب من البنية اليونانية وإبراز واقع الموت، وحُفظ التقابل «هنا... هناك» وصيغة الشهادة المبنية للمجهول.
