  text: χωρὶς δὲ πάσης ἀντιλογίας τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: ar
  text: ولا جدال في أن الأصغر شأنًا ينال البركة من الأعظم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ومن غير أي نزاع» أو «ومن غير أي اعتراض».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: ولا جدال في أن
  rationale: تؤدي العبارة معنى انتفاء كل اعتراض أو نزاع، بصياغة عربية طبيعية تفيد أن المبدأ الآتي مسلَّم به. ولم يُفرد δέ بأداة استدراك قوية لأن انتقاله الخطابي هنا خفيف.
- source_word: τὸ ἔλαττον
  choice: الأصغر شأنًا
  rationale: المقارن المحايد مستعمل استعمالًا اسميًا عامًا للدلالة على الأدنى رتبة، لا الأصغر حجمًا ولا الأقل قيمة أخلاقية.
- source_word: ὑπὸ τοῦ κρείττονος
  choice: من الأعظم
  rationale: تدل ὑπό مع المضاف إليه على فاعل الفعل المبني للمجهول، و«الأعظم» تحفظ المقارنة في الرتبة أو المقام.
- source_word: εὐλογεῖται
  choice: ينال البركة
  rationale: صياغة عربية واضحة للمضارع المبني للمجهول، وتحفظ معنى تلقي البركة في سياق مباركة ملكي صادق لإبراهيم.
theological_decisions:
- issue: طبيعة المقارنة بين الأصغر والأعظم
  choice: 'مبدأ عام في الرتبة: الأدنى شأنًا ينال البركة من الأعلى شأنًا.'
  alternative: اعتبار العبارة مجرد عرف اجتماعي بلا دلالة لاهوتية.
  rationale: يستخدم سياق عبرانيين 7 هذا المبدأ لإثبات عظمة ملكي صادق بالنسبة إلى إبراهيم. وتحفظ الترجمة لغة المقارنة من غير إضافة تفسير مذهبي أو جعل التفاضل أخلاقيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت عبارة «الأصغر شأنًا» لتجنب إيحاء المقارنة بالحجم، و«ينال البركة» لسلاسة المبني للمجهول في العربية. وُضع مؤشر الحاشية [a] في المتن.
