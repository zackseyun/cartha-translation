  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: ar
  text: الذي خصّص له إبراهيم أيضًا عُشرًا من كل شيء[a]. ويُترجَم اسمه أولًا «ملك البرّ»[b]، ثم هو أيضًا «ملك شاليم»، أي «ملك السلام».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العُشر». واليونانية تقول حرفيًا: «عُشرًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ملك العدل». يمكن للكلمة اليونانية أن تدل على البرّ أو العدل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: الذي أعطاه
  rationale: اسم موصول في حالة المجرور غير المباشر يعود إلى ملكي صادق؛ صيغ في العربية مع الفعل والضمير المتصل لتوضيح أن العُشر أُعطي له.
- source_word: δεκάτην
  choice: عُشر
  rationale: ينقل المعنى الحرفي، أي الجزء العاشر، وهو أيضًا التعبير العربي الطبيعي عن العُشر الديني.
- source_word: ἀπὸ πάντων
  choice: كل شيء
  rationale: تعبير عربي موجز وطبيعي يفيد أن الجزء العاشر كان مأخوذًا من مجموع ما كان لدى إبراهيم في السياق.
- source_word: ἐμέρισεν
  choice: أعطاه
  rationale: المعنى السياقي هو تخصيص العُشر لملكي صادق وإعطاؤه إياه؛ «أعطاه» أوضح للقارئ العربي، بينما تُبيّن الحاشية الصياغة الأقرب إلى الحرفية.
- source_word: πρῶτον μὲν
  choice: فأولًا
  rationale: يحفظ ترتيب الشرح في جزأين ويربطه طبيعيًا بما قبله.
- source_word: ἑρμηνευόμενος
  choice: يُترجَم اسمه
  rationale: أُظهر مرجع اسم الفاعل الضمني لأن الكلام يشرح دلالة اسم ملكي صادق، وهذه صياغة عربية طبيعية.
- source_word: βασιλεὺς δικαιοσύνης
  choice: ملك البرّ
  rationale: «البرّ» المقابل العربي المألوف لـ δικαιοσύνη في هذا السياق الكتابي واللقبي، مع حفظ احتمال «العدل» في الحاشية.
- source_word: ἔπειτα δὲ καὶ
  choice: ثم أيضًا
  rationale: يحفظ التعاقب وأداة الإضافة في النص اليوناني.
- source_word: βασιλεὺς Σαλήμ
  choice: ملك شاليم
  rationale: نُقل اسم المكان صوتيًا، وحُفظ تركيب اللقب كما في الأصل.
- source_word: ὅ ἐστιν
  choice: أي
  rationale: أداة تفسير عربية طبيعية وموجزة تؤدي وظيفة العبارة اليونانية.
- source_word: βασιλεὺς εἰρήνης
  choice: ملك السلام
  rationale: ترجمة مباشرة للقب التفسيري الذي يربط شاليم بالسلام.
theological_decisions:
- issue: دلالة δικαιοσύνη في شرح لقب ملكي صادق
  choice: البرّ
  alternative: العدل
  rationale: «البرّ» يحفظ الصدى الكتابي والأخلاقي الواسع للكلمة من غير حصرها في العدالة القضائية، مع التنبيه إلى «العدل» بوصفه احتمالًا معجميًا حقيقيًا.
translation_notes:
  register: 'العربية فصحى معاصرة واضحة ووقورة. استُخدمت «شاليم» نقلًا لاسم المكان، وحُفظت البنية التفسيرية المتتابعة: معنى الاسم أولًا، ثم معنى اسم المدينة.'
