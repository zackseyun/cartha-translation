base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: ar
  text: بلا أبٍ، بلا أمٍّ، بلا نسبٍ[a]، لا بدايةَ أيامٍ له ولا نهايةَ حياةٍ، بل قد جُعل شبيهًا بابن الله، ويبقى كاهنًا على الدوام.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بلا نسبٍ مسجَّل». لا يورد سفر التكوين أبًا أو أمًّا أو سلسلة نسب لملكي صادق، ويستخدم كاتب الرسالة هذا الصمت في بيان هذا الشبه.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إلى الأبد» أو «باستمرار». تؤكد العبارة دوام كهنوته في العرض الكتابي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ
  choice: بلا أبٍ
  rationale: يحافظ على المعنى المباشر وعلى التوازي البلاغي مع «بلا أمٍّ» و«بلا نسبٍ»، من غير أن يحسم هل المقصود غياب الأب حقيقةً أم غياب ذكره في السجل الكتابي.
- source_word: ἀμήτωρ
  choice: بلا أمٍّ
  rationale: ترجمة موجزة وموازية لـ«بلا أبٍ»، وتحفظ إيقاع الصفات اليونانية الثلاث.
- source_word: ἀγενεαλόγητος
  choice: بلا نسبٍ
  rationale: تعبير عربي طبيعي وموجز يدل على عدم وجود نسب مذكور أو سلسلة أنساب، مع بيان احتمال «بلا نسبٍ مسجَّل» في الحاشية.
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: لا بدايةَ أيامٍ له ولا نهايةَ حياةٍ
  rationale: يحفظ التقابل والصياغة المهيبة في الأصل، ويعبّر بوضوح عن نفي بداية الأيام ونهاية الحياة.
- source_word: ἀφωμοιωμένος
  choice: قد جُعل شبيهًا
  rationale: يحفظ المبني للمجهول ودلالة الحالة الناتجة في اسم المفعول التام، كما يثبت التشبيه ولا يوحي بالتطابق.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: بابن الله
  rationale: الصياغة العربية المألوفة للقب المسيحاني، وتلائم تركيب التشبيه.
- source_word: μένει
  choice: يبقى
  rationale: ينقل دلالة الاستمرار في الفعل المضارع اليوناني بصورة طبيعية.
- source_word: ἱερεὺς
  choice: كاهنًا
  rationale: المقابل العربي المباشر، وجاء منصوبًا خبرًا حاليًا مع «يبقى».
- source_word: εἰς τὸ διηνεκές
  choice: على الدوام
  rationale: ينقل معنى الاستمرار والثبات من غير أن يفرض وحده تفسيرًا ميتافيزيقيًا يتجاوز الحجة النمطية في السياق.
theological_decisions:
- issue: هل تصف الآية ملكي صادق بأنه بلا والدين وأزلي حرفيًا، أم كما تعرضه الرواية الكتابية لأجل الدلالة النمطية؟
  choice: أُبقيت الأوصاف في متن الآية كما وردت، مع صياغة «قد جُعل شبيهًا بابن الله» التي تؤكد علاقة الشبه ولا تساوي بين ملكي صادق والابن.
  alternative: اعتبار ملكي صادق ظهورًا سابقًا لتجسد الابن، أو كائنًا بلا والدين وأزليًا في ذاته.
  rationale: الفعل المبني للمجهول ἀφωμοιωμένος يدل على أنه جُعل شبيهًا بالابن، لا أنه هو الابن. وتسمح الحاشية بفهم الأوصاف في ضوء غياب سجل النسب في التكوين من غير أن تُدخل هذا التفسير في المتن أو تلغي توتره.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة مهيبة وموجزة. حُفظ التوازي الثلاثي في «بلا أبٍ، بلا أمٍّ، بلا نسبٍ»، كما حُفظت علاقة التشبيه والمبني للمجهول من غير حسم الهوية اللاهوتية لملكي صادق.
