id: HEB.7.19
reference: Hebrews 7:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: ar
  text: فالناموس لم يُكمِّل شيئًا[a]، بل أُدخِل رجاءٌ أفضل[b]، به نقترب إلى الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يجعل شيئًا كاملًا». ويمكن أن يعني الفعل اليوناني أيضًا: «لم يبلغ بشيء إلى التمام».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «بل إدخالُ رجاءٍ أفضل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: شيئًا
  rationale: مفعول به لـ«يُكمِّل» في سياق نفي، فتؤدي «لم يُكمِّل شيئًا» معنى النفي المطلق بصورة عربية طبيعية.
- source_word: γὰρ
  choice: فـ
  rationale: تفيد تعليل الكلام السابق وشرحه، وتحافظ الفاء على الصلة السياقية بإيجاز.
- source_word: ἐτελείωσεν
  choice: يُكمِّل
  rationale: يحفظ جذر الكمال وما يحمله في الرسالة إلى العبرانيين من معنى البلوغ إلى الغاية أو التمام، من غير اختزاله في معنى «لم يفعل شيئًا».
- source_word: ὁ νόμος
  choice: الناموس
  rationale: مصطلح عربي كتابي معروف يشير هنا في السياق إلى ناموس موسى والنظام الكهنوتي المرتبط به، مع بقائه مفهومًا في العربية الفصحى.
- source_word: ἐπεισαγωγὴ
  choice: أُدخِل
  rationale: صيغت العبارة الفعلية عربيًا لتجنب الثقل في «إدخال رجاء»، مع حفظ معنى إدخال شيء إضافي أو أفضل؛ ويُذكر البديل الاسمي في الحاشية.
- source_word: δὲ
  choice: بل
  rationale: تُبرز المقابلة التصحيحية القوية بين عجز الناموس وإدخال الرجاء الأفضل.
- source_word: κρείττονος ἐλπίδος
  choice: رجاءٌ أفضل
  rationale: يحفظ لفظ «أفضل» المفردة المقارنة المحورية المتكررة في العبرانيين، وتناسب صيغة التنكير الأصل اليوناني.
- source_word: δι’ ἧς
  choice: به
  rationale: يعود الضمير إلى «الرجاء» ويعبّر بوضوح عن الوسيلة التي بها نقترب.
- source_word: ἐγγίζομεν
  choice: نقترب
  rationale: تعبير عربي واضح يحفظ معنى الدنو من الله وما في السياق من دلالة إتاحة الوصول إليه.
- source_word: τῷ θεῷ
  choice: إلى الله
  rationale: حرف الجر «إلى» هو المقابل العربي الطبيعي مع فعل «نقترب» للدلالة على جهة الاقتراب.
theological_decisions:
- issue: معنى τελειόω بالنسبة إلى الناموس
  choice: الناموس لم يُكمِّل شيئًا، أي لم يبلّغه إلى الكمال أو الغاية المقصودة.
  alternative: الناموس لم ينجز شيئًا على الإطلاق.
  rationale: يحفظ لفظ «يُكمِّل» الثقل اللاهوتي للمصطلح في العبرانيين ولا يحوّل العبارة إلى حكم بأن الناموس عديم الفائدة من كل وجه.
- issue: التركيب الناقص في المقابلة بعد نفي تكميل الناموس
  choice: 'صياغة المقابلة: «بل أُدخِل رجاءٌ أفضل».'
  alternative: «بل إدخالُ رجاءٍ أفضل» أو «بل هناك إدخالٌ لرجاء أفضل».
  rationale: الأصل اليوناني اسمي وموجز، لكن الصياغة الفعلية المبنية للمجهول طبيعية في العربية وتحفظ الحدث من غير تعيين فاعل أو إضافة تفسير زمني.
- issue: مرجع الضمير في δι’ ἧς
  choice: الضمير في «به» يعود إلى الرجاء الأفضل.
  alternative: أن يعود إلى عملية الإدخال.
  rationale: مطابقة الضمير المؤنث في اليونانية تجعل «الرجاء» مرجعه الطبيعي، والمقصود أن الاقتراب إلى الله يتم بهذا الرجاء.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُعمل «الناموس» للمحافظة على المصطلح الكتابي في هذا السياق، وصيغ الشطر الثاني فعليًا لسلامة العربية مع توثيق بنيته الاسمية في الحاشية.
