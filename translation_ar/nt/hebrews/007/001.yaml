    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ ὁ Μελχισέδεκ
  choice: فإنَّ ملكي صادق هذا
  rationale: تحافظ «فإنَّ» على الصلة التفسيرية التي تؤديها γάρ بما قبلها، وتحفظ «هذا» الإشارة في Οὗτος، مع استعمال الصيغة العربية المألوفة للاسم الكتابي.
- source_word: βασιλεὺς Σαλήμ
  choice: ملكَ ساليم
  rationale: ترجمة مباشرة للقب مع نقل اسم المكان بصيغته العربية الكتابية الشائعة.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: وكاهنَ الله العلي
  rationale: تعبير عربي طبيعي يحفظ «العلي» لقبًا إلهيًا نعتًا لله، من غير إضافة دلالة مذهبية.
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: هو الذي لاقى إبراهيم
  rationale: تُظهر هذه الصياغة وظيفة اسم الفاعل اليوناني الموصولية، و«لاقى» مناسبة للقاء المقصود في السياق.
- source_word: ὑποστρέφοντι
  choice: حين كان راجعًا
  rationale: تحفظ تزامن الرجوع مع اللقاء، وهو ما يدل عليه اسم الفاعل المضارع.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: من القضاء على الملوك[a]
  rationale: «القضاء على» صياغة عربية واضحة تلائم السياق الحربي، بينما يبيّن الهامش المعنى الحرفي الأقوى لـ κοπή ولا يحسم هل قُتل جميع الملوك أنفسهم.
- source_word: καὶ εὐλογήσας αὐτόν
  choice: وباركه
  rationale: ترجمة موجزة ودقيقة للفعل، مع تنسيق الحدث الثاني مع لقائه بإبراهيم.
theological_decisions:
- issue: دلالة τοῦ θεοῦ τοῦ ὑψίστου
  choice: كاهن الله العلي
  alternative: كاهن الله الأعلى
  rationale: «الله العلي» هو التعبير العربي الطبيعي والراسخ للقب الإلهي، ويحفظ تركيب اليونانية من غير توسيع لاهوتي.
- issue: قوة التعبير ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: من القضاء على الملوك
  alternative: من ذبح الملوك
  rationale: المتن يقدّم المعنى العسكري بوضوح من غير أن يقرر على نحو زائد أن الملوك جميعًا ذُبحوا، والهامش يحفظ الصورة الحرفية القوية في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الصلة النحوية بما قبل الآية لأنها جزء من جملة ممتدة، ولذلك انتهى النص بفاصلة.
