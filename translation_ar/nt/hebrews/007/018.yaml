lexical_decisions:
- source_word: ἀθέτησις
  choice: إبطال
  rationale: يفيد الاسم إلغاء الشيء أو إسقاط مفعوله؛ و«إبطال» واضح ويحفظ الدلالة القانونية القوية.
- source_word: μὲν γὰρ
  choice: فإنه ... بالفعل
  rationale: «فإن» تنقل التعليل، و«بالفعل» تعكس توكيد μέν مع إبقاء المقابلة المنتظرة في الآية التالية طبيعية بالعربية.
- source_word: γίνεται
  choice: يجري
  rationale: ينقل معنى وقوع الأمر أو حدوثه في هذا التركيب، ويلائم «إبطال» في العربية المعاصرة.
- source_word: προαγούσης ἐντολῆς
  choice: الوصية السابقة
  rationale: اسم الفاعل يعني ما سبق أو تقدم؛ و«السابقة» تحافظ على الأولوية الزمنية من دون توسيع المرجع إلى الشريعة كلها صراحة.
- source_word: διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές
  choice: بسبب ضعفها وعدم نفعها
  rationale: يحفظ سببية διά والصفة الاسمية المزدوجة، وينقل حدة تقويم النص بعبارة عربية واضحة.
- source_word: ἀσθενές
  choice: ضعفها
  rationale: يدل على انعدام القوة أو الفاعلية، والصيغة الاسمية توافق البناء اليوناني.
- source_word: ἀνωφελές
  choice: عدم نفعها
  rationale: يفيد ما لا يحقق نفعًا أو فائدة؛ وهذه العبارة طبيعية وأقل إيحاءً بحكم مطلق من «عديمة القيمة»، مع عدم تلطيف النص.
theological_decisions:
- issue: نطاق الحكم السلبي على «الوصية السابقة»
  choice: الإبقاء على عبارتي «ضعفها وعدم نفعها»، مع بيان سياقهما المتعلق ببلوغ الكمال في الحجة المحيطة.
  alternative: فهم الكلام حكمًا مطلقًا بأن الشريعة الموسوية كلها عديمة القيمة، أو تلطيف العبارة بحيث تزول دلالتها السلبية الحقيقية.
  rationale: السياق القريب، ولا سيما عبرانيين 7:11 و7:19، يتناول قصور التدبير الكهنوتي السابق عن إيصال الكمال. لذلك يحافظ المتن على قوة اليونانية، وتوضح الحاشية نطاق السياق دون إلغاء التوتر اللاهوتي.
translation_notes:
  register: 'عربية فصحى حديثة، واضحة ووقورة. اختير «يجري إبطال» لصوغ قانوني طبيعي، وحُفظت حدة «ضعفها وعدم نفعها» مع توضيح نطاقها السياقي في الحاشية. وُضعت علامتا الحاشيتين بحسب ارتباطهما: البديل اللفظي بعد «السابقة»، والتوضيح السياقي بعد الحكم السلبي.'
