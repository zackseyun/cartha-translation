lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: بدرجة أكبر
  rationale: 'تنقل العبارة قوة التصعيد في السياق، مع اقترانها بـ«أوضح» لتفيد: أوضح بدرجة أكبر.'
- source_word: κατάδηλόν
  choice: أوضحُ
  rationale: تفيد الصفة أن الأمر جليّ أو بيّن، وصيغة «أوضح» تلائم وجود التعبير المقارن المزيد «περισσότερον ἔτι» من غير مضاعفة ثقيلة.
- source_word: εἰ
  choice: إذا
  rationale: تحافظ على البنية الشرطية في اليونانية، مع إمكان أن تُفهم في سياق الحجة على معنى قريب من «ما دام» أو «إذ» دون حسم ذلك في المتن.
- source_word: κατὰ τὴν ὁμοιότητα
  choice: على مثال
  rationale: تعبير عربي واضح يحفظ معنى المشابهة والنمط، ولا يخلطه بلفظ «الرتبة» الوارد في مزمور 110:4 والمعبَّر عنه بيونانية مختلفة.
- source_word: Μελχισέδεκ
  choice: ملكي صادق
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: ἀνίσταται
  choice: قام
  rationale: ينقل معنى ظهور الكاهن أو قيامه في دوره، ويحفظ صورة الفعل اليوناني من غير إضافة فكرة التعيين صراحة.
- source_word: ἱερεὺς ἕτερος
  choice: كاهنٌ آخر
  rationale: صياغة عربية طبيعية تحفظ إمكان دلالة ἕτερος على كاهن آخر أو مغاير، مع توضيح احتمال التشديد على المغايرة في الحاشية.
theological_decisions:
- issue: دلالة ἕτερος وصلتها بنوع الكهنوت
  choice: كاهنٌ آخر
  alternative: كاهنٌ مغاير
  rationale: «آخر» هي الصياغة الطبيعية ولا تحسم مقدار المغايرة المقصودة، بينما يبيّن السياق أن الكاهن ليس من النظام اللاوي وأنه على مثال ملكي صادق؛ وقد حُفظ احتمال التشديد على الاختلاف في الحاشية.
- issue: العلاقة بين «على مثال ملكي صادق» ومزمور 110:4
  choice: على مثال ملكي صادق
  alternative: على شبه ملكي صادق
  rationale: يحفظ الاختيار معنى ὁμοιότης من غير استبداله بلفظ «الرتبة» في المزمور، وفي الوقت نفسه يترك الإحالة والحجة بين النصين ظاهرة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعملت النقطتان لإظهار أن الجملة الشرطية تقدّم أساس ازدياد وضوح الحجة، مع إبقاء «إذا» وعدم تحويلها إلى «لأن» أو «إذ» حتى لا يُحسم وجهها الاستدلالي.
