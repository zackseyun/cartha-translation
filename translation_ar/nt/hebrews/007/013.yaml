  verdict: revise
  source_fidelity: 'الترجمة أمينة في البنية الأساسية: «الذي تُقال عنه هذه الأمور» تنقل ἐφ’ ὃν ... λέγεται ταῦτα، و«ينتمي إلى سبط آخر» مناسبة لسياق μετέσχηκεν والانتماء القبلي، و«المذبح» دقيقة لـ θυσιαστήριον. لكن «لم يخدم أحد» يجعل العبارة نفيًا ماضيًا بسيطًا، بينما صيغة προσέσχηκεν التامة تفيد أن أحدًا من هذا السبط لم يسبق له أن باشر/لازم خدمة المذبح. '
