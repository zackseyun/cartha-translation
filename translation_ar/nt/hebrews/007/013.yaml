base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: ar
  text: لِأَنَّ الَّذِي تُقَالُ عَنْهُ هَذِهِ الْأُمُورُ يَنْتَمِي إِلَى سِبْطٍ آخَرَ[a]، لَمْ يَسْبِقْ لِأَحَدٍ مِنْهُ أَنْ خَدَمَ عِنْدَ الْمَذْبَحِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اشترك في سبط آخر» أو «جاء من سبط آخر». يمكن أن يدل الفعل اليوناني على المشاركة أو الارتباط، والمقصود هنا الانتساب إلى سبط.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لازم المذبح». يشير التعبير إلى القيام بالخدمة الكهنوتية المرتبطة بالمذبح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: الذي تُقال عنه
  rationale: تفيد ἐπί مع النصب هنا الإحالة إلى الشخص الذي تتعلق به الأقوال، وهذه صياغة عربية طبيعية تحفظ المعنى.
- source_word: γὰρ
  choice: لأنَّ
  rationale: تقدّم تعليلًا أو أساسًا تفسيريًا لما سبق، فتحفظ تسلسل الحجة.
- source_word: λέγεται ταῦτα
  choice: تُقال هذه الأمور
  rationale: تحفظ صيغة المبني للمجهول في المضارع وجمع ταῦτα.
- source_word: φυλῆς ἑτέρας
  choice: سبط آخر
  rationale: تشير φυλή في السياق إلى أحد أسباط إسرائيل، و«آخر» يبرز اختلافه عن السبط الكهنوتي الجاري الحديث عنه.
- source_word: μετέσχηκεν
  choice: ينتمي إلى
  rationale: للفعل معنى المشاركة أو الارتباط، لكنه يدل هنا على الانتساب القبلي؛ وصيغة المضارع العربية تعبّر طبيعيًا عن الانتماء الثابت ذي الصلة بالحجة الحاضرة.
- source_word: ἀφ’ ἧς
  choice: منه
  rationale: يعود الضمير إلى «سبط»، ويبيّن أن أحدًا من ذلك السبط لم يخدم عند المذبح.
- source_word: οὐδεὶς
  choice: لم يخدم أحد
  rationale: ينقل النفي العام بوضوح وطبيعية.
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: خدم عند المذبح
  rationale: يدل التعبير في السياق الشعائري على ملازمة المذبح والقيام بالخدمة المرتبطة به، من غير تحديد طقس بعينه.
- source_word: θυσιαστηρίῳ
  choice: المذبح
  rationale: المقابل العربي المألوف والدقيق في سياق الذبائح والعبادة.
theological_decisions:
- issue: علاقة يسوع بسبط غير لاوي ضمن حجة الكهنوت
  choice: إبراز الانتساب إلى سبط آخر من غير إضافة تفسير صريح عن النسب أو السلالة
  alternative: «ينحدر من سبط آخر»
  rationale: النص اليوناني يعبّر عن المشاركة أو الانتماء إلى سبط آخر، ولا يصرّح هنا بفعل الانحدار النسبي؛ لذا تُحفظ حدود العبارة وتوتر الحجة من غير توسيع عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «سبط» مراعاةً للسياق الإسرائيلي، و«خدم عند المذبح» لبيان المعنى الشعائري من غير إفراط في التفسير. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسّران البدائل المعجمية.
