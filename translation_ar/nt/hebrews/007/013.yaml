  terminology: «سبط» و«المذبح» مصطلحان مناسبان للسياق الكتابي. و«خدم عند المذبح» يحافظ على الطابع الشعائري من غير أن يحدد عملًا كهنوتيًا مخصوصًا. الحاشية البديلة «لازم المذبح» مفيدة، مع أن العبارة الرئيسة أوضح للقارئ المعاصر.
  issues:
