  rationale: عُدّلت الصياغة لتكون أفصح وأقرب إلى الاستعمال المعاصر، مع الحفاظ على الضرورة المنطقية في ἐξ ἀνάγκης والتوازي بين «يتغيّر» و«تغيير». وحُذفت الحاشية لأنها لا تقدم بديلًا نصيًا لازمًا وتضيف تفسيرًا غير مطلوب في هذا الموضع.
