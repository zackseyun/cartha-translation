  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: ar
  text: فحين يتغيّر الكهنوت، لا بدّ أن يحدث أيضًا تغييرٌ في الشريعة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετατιθεμένης
  choice: تغيَّر
  rationale: اسم فاعل في تركيب المضاف إليه المطلق، ويدل هنا على انتقال الكهنوت من ترتيب إلى آخر؛ و«تغيَّر» واضحة وتحفظ المعنى من غير حصره في نقل إداري.
- source_word: ἱερωσύνης
  choice: الكهنوت
  rationale: يشير إلى مؤسسة الكهنوت أو منصبه، لا إلى عمل كاهن منفرد، وهو اللفظ العربي الطبيعي في سياق المقارنة بين الكهنوت اللاوي وكهنوت ملكي صادق.
- source_word: ἐξ ἀνάγκης
  choice: لزم
  rationale: 'يعبّر عن الضرورة المنطقية: فتغيّر الكهنوت يستلزم تغييرًا مقابلًا في الشريعة، و«لزم» موجزة وفصيحة.'
- source_word: νόμου
  choice: في الشريعة
  rationale: يحفظ الإحالة إلى النظام التشريعي المنظِّم للكهنوت، ولا سيما شريعة موسى في السياق، مع تجنّب التضييق غير الضروري في المتن.
- source_word: μετάθεσις
  choice: تغيير
  rationale: يحافظ على الصلة الاشتقاقية والمعنوية بالفعل السابق، ويفيد تبدّل الترتيب دون المبالغة التي قد يوحي بها «الإلغاء».
- source_word: γίνεται
  choice: أن يحدث
  rationale: ينقل وقوع التغيير كنتيجة لازمة، ويلائم التركيب العربي بعد «لزم».
- source_word: καὶ
  choice: أيضًا
  rationale: يبيّن أن تغيير الشريعة نتيجة مقابلة ومضافة إلى تغيير الكهنوت.
- source_word: γὰρ
  choice: لأنه
  rationale: يربط الآية بما قبلها بوصفها تعليلًا للحجة.
theological_decisions:
- issue: نطاق νόμος وعلاقته بالكهنوت
  choice: «الشريعة» في المتن، بمعنى النظام التشريعي الذي ينظّم الكهنوت، مع شمول شريعة موسى بحسب السياق
  alternative: «الشريعة» بإحالة صريحة وحصرية إلى شريعة موسى
  rationale: الاسم اليوناني غير المعرّف لا يفرض وحده تضييق المرجع، لكن سياق الرسالة يربطه بوضوح بالنظام الموسوي الذي أقام الكهنوت اللاوي؛ لذلك تُحفظ سعة العبارة في المتن ويُوضح المرجع السياقي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «متى» مع الفعل الماضي للدلالة العامة، وصيغت الضرورة بالفعل «لزم» للمحافظة على قوة الاستدلال وسلاسة العبارة.
