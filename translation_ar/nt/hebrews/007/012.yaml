  naturalness: «لزم أن يحدث» مفهومة، لكنها أقل سلاسة من «لا بدّ أن يحدث» في العربية الفصحى المعاصرة. و«فحين يتغيّر» يقدّم تركيبًا طبيعيًا يحفظ قوة العلاقة الزمنية/الاستدلالية.
  terminology: «الكهنوت» و«الشريعة» مصطلحان مناسبان. لا يلزم تخصيص الشريعة في المتن بـ«شريعة موسى»، وإن كان ذلك ظاهرًا من السياق الأوسع.
