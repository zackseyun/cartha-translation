    rationale: νόμος تعني «الشريعة/القانون» هنا؛ والسياق يربطها بالتشريع الموسوي، لكن عبارة «شريعة الكهنوت» تضييق وتوسيع تفسيري لا ينبغي عرضه بوصفه قراءة بديلة.
  revised_text: فحين يتغيّر الكهنوت، لا بدّ أن يحدث أيضًا تغييرٌ في الشريعة.
