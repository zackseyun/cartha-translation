  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: ar
  text: وأمّا الذين من بني لاوي وينالون الكهنوت، فلهم وصية بحسب الشريعة أن يأخذوا العُشر من الشعب، أي من إخوتهم[a]، مع أنهم هم أيضًا خرجوا من صُلب إبراهيم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: بني قومهم من الإسرائيليين. واليونانية تقول حرفيًا «إخوتهم»، مستعملةً لفظ قرابة مذكرًا لأفراد الشعب الواحد.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ينحدرون من إبراهيم». وحرفيًا: «خرجوا من صُلب إبراهيم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: الذين من بني لاوي
  rationale: يحفظ معنى التبعيض في ἐκ واللغة النَّسَبية في υἱῶν، من غير اختزال العبارة إلى «اللاويين» جميعًا.
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: وينالون الكهنوت
  rationale: «ينالون» تفيد تلقي المنصب، و«الكهنوت» مقابل عربي واضح ورسمي لـ ἱερατεία.
- source_word: ἐντολὴν ἔχουσιν
  choice: فلهم وصية
  rationale: يحافظ على التركيب الاسمي وعلى القوة التشريعية العهدية لكلمة ἐντολή.
- source_word: ἀποδεκατοῦν τὸν λαὸν
  choice: أن يأخذوا العُشر من الشعب
  rationale: يوضح أن الفعل يعني تحصيل العُشر من الآخرين، لا تقديم العُشر.
- source_word: κατὰ τὸν νόμον
  choice: بحسب الشريعة
  rationale: ينقل المعنى المعياري لعبارة κατά، وتدل «الشريعة» طبيعيًا في السياق على شريعة موسى.
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: إخوتهم
  rationale: يحفظ لفظ القرابة المذكر في اليونانية، مع إيضاح المقصود الأوسع في الحاشية.
- source_word: καίπερ
  choice: مع أنهم
  rationale: ينقل بوضوح قوة الاستدراك والتنازل في السياق.
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: هم أيضًا خرجوا من صُلب إبراهيم
  rationale: يحفظ الصورة الجسدية للنسب، وهي ذات أهمية حجاجية في الأصحاح، مع استعمال تعبير عربي فصيح مفهوم.
theological_decisions:
- issue: لغة القرابة في سياق شعب إسرائيل
  choice: إخوتهم
  alternative: بني قومهم من الإسرائيليين
  rationale: النص اليوناني يستعمل ἀδελφούς بصيغة المذكر وفي معنى القرابة القومية والعهدية؛ فحُفظ اللفظ في المتن ووُضح مداه في الحاشية.
- issue: الاحتفاظ بصورة النسب الجسدي
  choice: خرجوا من صُلب إبراهيم
  alternative: ينحدرون من إبراهيم
  rationale: الصورة الحسية في ὀσφύος تدعم حجة الكاتب عن وحدة النسب الجسدي، فلا تُسوّى إلى تعبير تجريدي في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «وصية» للمحافظة على القوة التشريعية، و«صُلب» لحفظ صورة النسب الملموسة من غير غرابة شديدة.
