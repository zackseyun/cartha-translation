    text: 'أو: «وكان هناك كهنة كثيرون».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «من البقاء»؛ والمقصود في السياق البقاء في الخدمة الكهنوتية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: وقد
  rationale: تربط «الواو» بما سبق، وتفيد «قد» تحقق الحال الناتجة التي يدل عليها تركيب الفعل مع اسم الفاعل التام.
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: صار أولئك الكهنة كثيرين
  rationale: يحافظ التعبير على دلالة الصيرورة في γεγονότες وعلى كثرة الكهنة، ويستعمل «أولئك» لتمييزهم تمهيدًا للمقابلة مع يسوع في العدد التالي. أما μέν فتمهّد للمقابلة اللاحقة، وهو ما يؤديه السياق العربي دون مقابل مستقل متكلف.
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: لأن الموت كان يمنعهم
  rationale: ينقل سبب المنع بعبارة عربية طبيعية، ويجعل الموت أداة المنع وسببه كما تدل صيغة المفعول مع θανάτῳ.
- source_word: παραμένειν
  choice: من الاستمرار في خدمتهم
  rationale: المعنى في السياق هو استمرار الكهنة في أداء خدمتهم الكهنوتية. أضيفت «في خدمتهم» لتوضيح المتعلَّق السياقي، مع إثبات الحرفي في الحاشية.
theological_decisions:
- issue: المقابلة بين كثرة الكهنة وكهنوت يسوع الدائم
  choice: إبراز كثرة الكهنة بسبب خضوعهم للموت، من غير تسمية نظامهم «لاويًّا» في المتن
  alternative: التصريح في المتن بأنهم الكهنة اللاويون أو السابقون
  rationale: السياق يحدد هويتهم، لكن هذا العدد لا يذكر وصف «اللاويين» صراحة؛ لذلك تُحفظ حجة النص من غير إضافة تفسير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت صياغة طبيعية تحافظ على بنية المقابلة مع العدد التالي، وتظهر جميع علامتي الحاشية في المتن.
