  text: κατὰ ⸀τοσοῦτο ⸀κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: ar
  text: وبهذا القدر صار يسوع ضامنًا لعهدٍ[a] أفضل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وصية». يمكن أن تعني الكلمة اليونانية «عهدًا» أو، في بعض السياقات، «وصية»؛ لكن «عهد» أنسب هنا لحجة الكاتب عن الكهنوت والقسم.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: وبهذا القدر
  rationale: يحفظ معنى القياس أو المدى في تركيب κατά مع اسم في حالة النصب، ويربط تفوّق العهد بمقدار ما سبق بيانه في الحجة.
- source_word: κρείττονος
  choice: أفضل
  rationale: لفظ مقارن واضح وطبيعي، ويحافظ على التكرار المحوري لفكرة «الأفضل» في الرسالة إلى العبرانيين.
- source_word: διαθήκης
  choice: عهد
  rationale: السياق المتعلق بالكهنوت والقسم يدل هنا على ترتيب عهدي، لا على وصية يتركها المرء بعد موته.
- source_word: γέγονεν
  choice: صار
  rationale: يعبّر عن دخول يسوع في هذه الصفة مع بقاء نتيجتها؛ وصيغة الماضي العربية طبيعية هنا ويُفهم استمرار الحال من السياق.
- source_word: ἔγγυος
  choice: ضامنًا
  rationale: يدل على شخص يكفل أمرًا ويضمنه، وهو أدق وأوضح في العربية المعاصرة من ألفاظ قانونية أقدم مثل «كفيلًا» في هذا السياق.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المألوفة للاسم الشخصي اليوناني.
theological_decisions:
- issue: معنى διαθήκη في عبرانيين 7:22
  choice: عهد
  alternative: وصية
  rationale: مع أن اللفظة اليونانية قد تعني «عهدًا» أو «وصية» بحسب السياق، فإن حجة هذا الموضع عن الكهنوت والقسم وترتيب أفضل ترجّح معنى «العهد»، من غير استباق التداخل الدلالي الذي تستثمره الرسالة لاحقًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كتابية رصينة. وُضع هامش البديل عند كلمة «عهد» نفسها ليتضح موضعه، مع الحفاظ على ترتيب الجملة اليونانية بقدر ما تسمح به العربية الطبيعية.
