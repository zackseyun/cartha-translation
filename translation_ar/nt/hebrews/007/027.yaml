review_pass:
  verdict: revise
  source_fidelity: المعنى العام أمين للنص اليوناني، بما في ذلك ترتيب «أولًا... ثم»، والتضاد بينه وبين رؤساء الكهنة، والتقديم الذبيحي للنفس. لكن تركيب «لا حاجة به ... مثل رؤساء الكهنة» قد يربك جهة المقارنة في العربية؛ إذ إن اليونانية تقارن حاجتهم هم بحاجته المنفية. كما أن «مرة واحدة نهائية» غير مألوفة عربيًا ولا تنقل ἐφάπαξ بسلاسة.
  naturalness: 'تحتاج الصياغة إلى تعديل محدود لتصبح فصيحة واضحة: «لا يحتاج، كما يحتاج رؤساء الكهنة، يومًا بعد يوم...» يبيّن المقارنة على نحو طبيعي، و«مرة واحدة وإلى الأبد» أوضح وأشيع من «مرة واحدة نهائية».'
  terminology: «رؤساء الكهنة»، و«ذبائح»، و«قدَّم نفسه» مصطلحات دقيقة ومناسبة للسجل الكهنوتي. و«عن خطاياه هو» تحفظ التأكيد في ἰδίων. أبقيتُ إظهار «خطايا» في الشق الثاني لأن الحذف اليوناني غير طبيعي إذا نُقل حرفيًا إلى العربية، مع توثيقه في الحاشية.
