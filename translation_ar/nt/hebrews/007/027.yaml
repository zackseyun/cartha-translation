source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: ar
  text: الذي لا يحتاج، كما يحتاج رؤساء الكهنة، يومًا بعد يوم[a]، إلى أن يقدِّم ذبائح أولًا عن خطاياه هو، ثم عن خطايا الشعب[b]؛ لأنه فعل هذا مرة واحدة وإلى الأبد[c] حين قدَّم نفسه[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل يوم». والتعبير اليوناني يفيد التكرار يومًا بعد يوم.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «ثم عن التي للشعب»، وكلمة «الخطايا» مفهومة من العبارة السابقة.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «مرة واحدة لا تتكرر».'
    reason: lexical_alternative
  - marker: d
    text: 'أو: «بتقديمه نفسه» أو «إذ قدَّم نفسه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: يومًا بعد يوم
  rationale: ينقل قوة التعبير التكرارية بوضوح وطبيعية، لا مجرد الإشارة إلى الزمن اليومي.
- source_word: ἀνάγκην
  choice: حاجة
  rationale: تركيب «لا حاجة به إلى» عربي فصيح وطبيعي، ويؤدي معنى ἔχει ἀνάγκην دون تشديد زائد على الإلزام.
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: مثل رؤساء الكهنة
  rationale: يحفظ المقارنة وصيغة الجمع في اليونانية بعبارة واضحة.
- source_word: πρότερον ... ἔπειτα
  choice: أولًا ... ثم
  rationale: ينقل ترتيب الفعلين الذبائحيين بإيجاز ووضوح.
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: عن خطاياه هو
  rationale: «عن» مألوفة في سياق تقديم الذبيحة، وإضافة «هو» تبرز معنى ἰδίων التقابلي.
- source_word: θυσίας ἀναφέρειν
  choice: أن يقدِّم ذبائح
  rationale: تعبير عربي طبيعي ودقيق في السياق الطقسي والذبائحي.
- source_word: τῶν τοῦ λαοῦ
  choice: عن خطايا الشعب
  rationale: تُظهر الاسم المحذوف المفهوم من السياق في اليونانية منعًا للغموض غير الطبيعي في العربية، مع توثيق الحذف في الحاشية.
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: لأنه فعل هذا
  rationale: يحفظ الإحالة المباشرة في τοῦτο ويفيد γάρ التعليل.
- source_word: ἐφάπαξ
  choice: مرة واحدة نهائية
  rationale: تنقل تفرد الفعل وحسمه، لا مجرد وقوعه مرة من غير دلالة على عدم التكرار.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: حين قدَّم نفسه
  rationale: يحافظ على المعنى الذبائحي للفعل، ويعرض اسم الفاعل الماضي في علاقة زمنية طبيعية من غير استبعاد دلالة الوسيلة.
theological_decisions:
- issue: نطاق اسم الإشارة «هذا» في الجملة التعليلية
  choice: أُبقيت الإحالة عامة إلى الفعل الذبائحي الحاسم الموصوف في السياق، من غير القول إن المسيح قدَّم عن خطايا تخصه.
  alternative: قصر «هذا» صراحة على تقديم الذبيحة عن خطايا الشعب وحدها.
  rationale: صياغة الأصل موجزة وقد تحتمل إحالة نحوية أوسع، لكن المقابلة في الرسالة تميّز المسيح عن رؤساء الكهنة ذوي الخطايا. الترجمة تحفظ الإحالة والتوتر السياقي دون إدخال شرح عقائدي في المتن.
- issue: طبيعة تقديم المسيح نفسه
  choice: «قدَّم نفسه» مع إبقاء السجل الذبائحي الذي يصنعه السياق.
  alternative: «بذل نفسه».
  rationale: «قدَّم» أوثق بالفعل الكهنوتي والذبائحي في الأصل، أما «بذل» فقد يخفف هذا الجانب.
- issue: العلاقة الدلالية لاسم الفاعل ἀνενέγκας بالفعل الرئيسي
  choice: «حين قدَّم نفسه» في المتن، مع ذكر احتمال الوسيلة في الحاشية.
  alternative: «بتقديمه نفسه» أو «إذ قدَّم نفسه».
  rationale: اسم الفاعل اليوناني يسمح بعلاقة زمنية أو وسيلية متقاربة؛ فحُفظ الاحتمال البديل بدل حسمه بلا تنبيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدم «رؤساء الكهنة» للمصطلح الكهنوتي، و«ذبائح» للسجل الطقسي، مع تجنب التراكيب العتيقة. وُضعت علامات الحواشي [a]–[d] كلها في المتن وربطت بمواضعها الدلالية.
