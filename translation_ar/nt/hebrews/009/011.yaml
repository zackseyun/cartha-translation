  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: ar
  text: أَمَّا الْمَسِيحُ، إِذْ جَاءَ رَئِيسَ كَهَنَةٍ لِلْخَيْرَاتِ الَّتِي تَحَقَّقَتْ[a]، فَعَبْرَ الْمَسْكَنِ الأَعْظَمِ وَالأَكْمَلِ، غَيْرِ الْمَصْنُوعِ بِأَيْدٍ، أَيْ لَيْسَ مِنْ هَذِهِ الْخَلِيقَةِ—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «للخيرات العتيدة».'
    reason: textual_variant
  - marker: b
    text: تستمر الجملة في العدد التالي؛ وترتبط عبارة «فعبر المسكن الأعظم والأكمل...» بفعل «دخل» هناك.
    reason: syntax_clarification
lexical_decisions:
- source_word: Χριστὸς
  choice: الْمَسِيحُ
  rationale: ينقل اللقب المسياني صراحة ويحافظ على وظيفته في السياق.
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: يبين الانتقال التقابلي من نظام العبادة الأرضي السابق إلى خدمة المسيح، بصياغة عربية طبيعية.
- source_word: παραγενόμενος
  choice: قَدْ جَاءَ
  rationale: يعكس معنى الحضور أو المجيء في هذه الصفة الكهنوتية من غير إضافة تفسير زمني غير مصرح به.
- source_word: ἀρχιερεὺς
  choice: رَئِيسَ كَهَنَةٍ
  rationale: المقابل العربي المألوف والدقيق للوظيفة الكهنوتية العليا.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: لِلْخَيْرَاتِ الَّتِي قَدْ حَضَرَتْ
  rationale: يتبع قراءة SBLGNT «γενομένων» ويدل على خيرات صارت حاضرة، مع إثبات القراءة البديلة في الحاشية.
- source_word: διὰ τῆς ... σκηνῆς
  choice: وَعَبْرَ الْمَسْكَنِ ...
  rationale: «عبر» تلائم الحركة التي يكتمل معناها بالفعل في العدد التالي، و«المسكن» يحفظ الإحالة إلى خيمة الاجتماع المقدسة دون أن يوحي بخيمة عادية.
- source_word: μείζονος
  choice: الأَعْظَمِ
  rationale: ينقل التفوق النوعي لا مجرد كبر الحجم.
- source_word: τελειοτέρας
  choice: الأَكْمَلِ
  rationale: يحفظ صلة اللفظ بموضوع الكمال والاكتمال في الرسالة، ويأتي طبيعيًا في العربية.
- source_word: οὐ χειροποιήτου
  choice: غَيْرِ الْمَصْنُوعِ بِأَيْدٍ
  rationale: يحافظ على التعبير الكتابي الذي يقابل بين ما يصنعه البشر وما ليس من صنعهم.
- source_word: τοῦτ’ ἔστιν
  choice: أَيْ
  rationale: أداة عربية موجزة وطبيعية لإدخال التوضيح.
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: غَيْرِ الْمُنْتَمِي إِلَى هَذِهِ الْخَلِيقَةِ
  rationale: يوضح معنى الإضافة اليونانية بوصفها انتماءً إلى النظام المخلوق، من غير حسم ماهية المسكن بأكثر مما يقوله النص.
theological_decisions:
- issue: القراءة النصية والتفسيرية لعبارة τῶν γενομένων ἀγαθῶν
  choice: لِلْخَيْرَاتِ الَّتِي قَدْ حَضَرَتْ
  alternative: لِلْخَيْرَاتِ الْعَتِيدَةِ
  rationale: يتبع المتن قراءة SBLGNT «γενομένων» بدل «μελλόντων»، وتُحفظ القراءة المعروفة الأخرى في الحاشية صونًا للشفافية النصية.
- issue: التعلق النحوي لعبارة διὰ τῆς ... σκηνῆς
  choice: بدء عبارة «وعبر المسكن...» بما يبقيها ممتدة نحو فعل العدد التالي
  alternative: ربطها مباشرة بمجيء المسيح في صدر العدد
  rationale: تركيب الآيتين 11–12 يرجح أن العبارة تمهد لفعل الدخول في العدد التالي؛ لذلك لا تُصاغ بما يوحي بأن المسكن كان وسيلة مجيء المسيح أو ظهوره.
- issue: دلالة «غير المنتمي إلى هذه الخليقة»
  choice: الإبقاء على التحديد العام للنص
  alternative: التصريح بأنه «سماوي»
  rationale: النص ينفي الانتماء إلى هذه الخليقة ولا يصرح هنا بتعيين إضافي؛ لذا تُصان مساحته الدلالية ولا يُزاد عليه توصيف مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «المسكن» للمقدس ذي الصلة بخيمة الاجتماع، مع إبقاء الشرطة الختامية للدلالة على استمرار الجملة في العدد التالي. جميع علامات الحواشي مثبتة في المتن.
