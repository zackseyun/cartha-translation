- from: أَمَّا الْمَسِيحُ فَقَدْ جَاءَ رَئِيسَ كَهَنَةٍ لِلْخَيْرَاتِ الَّتِي قَدْ حَضَرَتْ[a]، وَعَبْرَ الْمَسْكَنِ الأَعْظَمِ وَالأَكْمَلِ، غَيْرِ الْمَصْنُوعِ بِأَيْدٍ، أَيْ غَيْرِ الْمُنْتَمِي إِلَى هَذِهِ الْخَلِيقَةِ—[b]
  to: أَمَّا الْمَسِيحُ، إِذْ جَاءَ رَئِيسَ كَهَنَةٍ لِلْخَيْرَاتِ الَّتِي تَحَقَّقَتْ[a]، فَعَبْرَ الْمَسْكَنِ الأَعْظَمِ وَالأَكْمَلِ، غَيْرِ الْمَصْنُوعِ بِأَيْدٍ، أَيْ لَيْسَ مِنْ هَذِهِ الْخَلِيقَةِ—[b]
  rationale: استُبدلت «حضرت» بـ«تحققت» لتقديم عربية سليمة وطبيعية تعكس قراءة γενομένων، مع الإبقاء على القراءة البديلة في الحاشية. واستُبدلت العبارة التفسيرية «غير المنتمي إلى» بالصياغة الأقرب والأوجز «ليس من هذه الخليقة». كما استُعملت «إذ ... فـ» لإبقاء العبارة التالية مفتوحة نحويًا على فعل «دخل» في العدد 12، مع توضيح ذلك في الحاشية، من دون نسبة العبور إلى فعل المجيء نفسه.
