base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: ar
  text: فقد أُعِدَّ المسكنُ الأول، وكانت فيه المنارة والمائدة وخبز التقدمة، وهو ما يُسمّى «القدس».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «الأقداس»، والمقصود هنا القسم الأول من المسكن، أي القدس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ ... ἡ πρώτη
  choice: المسكن الأول
  rationale: يشير السياق إلى القسم الأول من خيمة الاجتماع، مع إبقاء لفظ «المسكن» الذي يحفظ الصلة بالمقدس الموسوي. ولا تُضاف كلمة «قسم» إلى المتن لأنها غير مصرّح بها في اليونانية.
- source_word: κατεσκευάσθη
  choice: أُعِدَّ
  rationale: ينقل المبني للمجهول ودلالة الإعداد والتجهيز، من غير حصر المعنى في البناء المعماري.
- source_word: λυχνία
  choice: المنارة
  rationale: اللفظ العربي المألوف للأداة الطقسية الحاملة للمصابيح الزيتية، وهو أدق من تعبير يوحي بالشموع.
- source_word: τράπεζα
  choice: المائدة
  rationale: مقابل عربي مباشر وطبيعي للمائدة المقدسة في المسكن.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: خبز التقدمة
  rationale: تعبير عربي موجز يحفظ فكرة وضع الخبز وتقديمه أمام الله، ويتجنب عبارة حرفية ثقيلة مثل «عرض الأرغفة».
- source_word: Ἅγια
  choice: القدس
  rationale: مع أن الصيغة اليونانية جمع محايد، يدل السياق هنا على الحجرة الأولى المعروفة بالقدس، في مقابل قدس الأقداس في العدد التالي.
theological_decisions:
- issue: دلالة «Ἅγια» وعلاقتها بقسمي المسكن
  choice: القدس
  alternative: الأقداس؛ المكان المقدس
  rationale: يُبرز «القدس» التمييز المكاني المقصود بين الحجرة الأولى والحجرة الداخلية، من غير إضافة تقرير عقائدي يتجاوز السياق، مع التنبيه في الحاشية إلى صيغة الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت مصطلحات مألوفة في سياق خيمة الاجتماع، مع تجنب التفسير الزائد. وُضع فعل مفرد في «وهو ما يُسمّى» لأن المرجع هو المسكن الأول بوصفه الحجرة المذكورة، لا آخر عنصر في قائمة الأثاث.
