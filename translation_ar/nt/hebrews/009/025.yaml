  text: ولا لكي يقدِّم نفسه مراتٍ كثيرة، كما يدخل رئيس الكهنة إلى المواضع المقدسة[a] سنة بعد سنة بدمٍ ليس دمه،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المقدس». يقول اليوناني حرفيًا: «المواضع المقدسة»، ويفهم بعضهم العبارة هنا على نحو أخص بمعنى «قدس الأقداس» في هذا السياق الشعائري.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: ولا لكي
  rationale: تحافظ على اتصال العبارة بالنفي والغرض في الآية السابقة، من غير تحويلها إلى جملة مستقلة أو حسم العلاقة النحوية بأكثر مما يقتضيه اليوناني.
- source_word: πολλάκις
  choice: مرارًا كثيرة
  rationale: تنقل معنى التكرار مرات عديدة، وتُبرز المقابلة مع دخول رئيس الكهنة السنوي.
- source_word: προσφέρῃ ἑαυτόν
  choice: يقدِّم نفسه
  rationale: تحافظ على الدلالة الذبائحية للفعل وعلى القوة الانعكاسية للضمير، مع صيغة عربية طبيعية بعد «لكي».
- source_word: ὥσπερ
  choice: كما
  rationale: أداة مقارنة عربية واضحة وموجزة تصل عمل المسيح بدخول رئيس الكهنة على سبيل المقابلة.
- source_word: ὁ ἀρχιερεὺς
  choice: رئيس الكهنة
  rationale: المصطلح العربي المألوف والدقيق لهذه الوظيفة الكهنوتية.
- source_word: εἰσέρχεται
  choice: يدخل
  rationale: تُبقي المضارع الدال على الفعل المعتاد المتكرر.
- source_word: εἰς τὰ ἅγια
  choice: إلى المواضع المقدسة
  rationale: تحافظ على صيغة الجمع في اليونانية وعلى الدلالة المكانية الشعائرية، مع إحالة الحصر المحتمل في المقدس أو قدس الأقداس إلى الحاشية.
- source_word: κατ’ ἐνιαυτὸν
  choice: سنة بعد سنة
  rationale: تعبير عربي طبيعي يوضح النمط السنوي المتكرر.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: بدمٍ ليس دمه
  rationale: ينقل معنى الوسيلة وأن الدم يخص غير رئيس الكهنة، ويُبقي المقابلة الضمنية مع تقديم المسيح نفسه.
theological_decisions:
- issue: مرجع المقارنة بين المسيح ورئيس الكهنة اللاوي
  choice: تُظهر الصياغة أن المسيح لم يدخل ليكرر تقديم نفسه، بخلاف دخول رئيس الكهنة السنوي بدم ليس دمه.
  alternative: قد تُفهم «المواضع المقدسة» على نحو أضيق، أي المقدس الداخلي أو قدس الأقداس.
  rationale: السياق المباشر يقابل عدم تكرار تقديم المسيح بالتكرار السنوي للخدمة الكهنوتية القديمة، من غير إضافة تفصيل عقائدي لا تصرح به الآية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. أُبقيت بداية الآية مرتبطة نحويًا بما قبلها بواسطة «ولا لكي»، وحُفظت صيغة الجمع في «المواضع المقدسة» مع بيان البدائل في الحاشية.
