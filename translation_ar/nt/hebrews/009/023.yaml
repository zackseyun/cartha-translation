revisions:
- from: لِذلِكَ كانَ لا بُدَّ أَنْ تُطَهَّرَ بِهذِهِ نُسَخُ[a] ما فِي السَّماواتِ، أَمَّا الأَشْياءُ السَّماوِيَّةُ نَفْسُها فَبِذَبائِحَ أَفْضَلَ مِنْ هذِهِ[c].[b]
  to: لِذلِكَ كانَ لا بُدَّ أَنْ تُطَهَّرَ[b] بِهذِهِ النُّسَخُ[a] لِما فِي السَّماواتِ، أَمَّا الأَشْياءُ السَّماوِيَّةُ نَفْسُها فَتُطَهَّرُ بِذَبائِحَ أَفْضَلَ[c] مِنْ هذِهِ.
  rationale: أُضيفت اللام في «النُّسخ لما في السماوات» لإبانة علاقة المطابقة التي في الأصل، ونُقلت علامة الحاشية الخاصة بالتطهير إلى موضعها. وأُظهر فعل «فتُطهَّر» في الشطر الثاني لأن العربية تحتاجه لسلامة العبارة؛ وهو مستفاد من الفعل المحذوف في اليونانية ولا يفسر مرجع «الأشياء السماوية» أو طبيعة تطهيرها.
