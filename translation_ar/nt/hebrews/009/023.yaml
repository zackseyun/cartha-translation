  source_fidelity: المعنى العام محفوظ، بما في ذلك المقابلة بين النُّسخ والأشياء السماوية، ولغة التطهير، وجمع «ذبائح». لكن «نُسَخُ ما في السماوات» لا تُظهر بوضوح علاقة «نُسخ/تمثيلات لِـ» التي يدل عليها المضاف إليه اليوناني؛ فإدخال اللام يزيل هذا الالتباس من غير زيادة تفسيرية.
  naturalness: الصياغة فصيحة في الجملة، لكن موضع علامة الحاشية b في نهاية الآية لا يربطها بالفعل «تُطهَّر» الذي تشرحه. كما أن إظهار الفعل في الشطر الثاني يجعل العربية أوضح، مع بقاء المعنى المقصود في الحذف اليوناني.
