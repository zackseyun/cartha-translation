source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: ar
  text: لِذلِكَ كانَ لا بُدَّ أَنْ تُطَهَّرَ[b] بِهذِهِ النُّسَخُ[a] لِما فِي السَّماواتِ، أَمَّا الأَشْياءُ السَّماوِيَّةُ نَفْسُها فَتُطَهَّرُ بِذَبائِحَ أَفْضَلَ[c] مِنْ هذِهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نماذج» أو «تمثيلات».
    reason: lexical_alternative
  - marker: b
    text: أو «تُنقَّى»؛ والفعل من ألفاظ التطهير الطقسي.
    reason: lexical_alternative
  - marker: c
    text: يقول النص اليوناني «ذبائح أفضل» بصيغة الجمع، مع أن سياق الرسالة يركّز على تقدمة المسيح التي قُدِّمت مرة واحدة نهائيًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη οὖν
  choice: لِذلِكَ كانَ لا بُدَّ
  rationale: ينقل الاستنتاج الذي تدل عليه οὖν، ويصوغ Ἀνάγκη بصيغة عربية طبيعية تفيد الضرورة في سياق الشرح السابق.
- source_word: ὑποδείγματα
  choice: نُسَخ
  rationale: تحافظ على المقابلة بين الموجودات الأرضية وما في السماوات، مع إثبات البدائل الممكنة في الحاشية.
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: ما فِي السَّماواتِ
  rationale: يحفظ صيغة الجمع في οὐρανοῖς ويترجم العبارة الموصولة دون دمجها في الصفة اللاحقة ἐπουράνια.
- source_word: τούτοις
  choice: بِهذِهِ
  rationale: يحافظ على اسم الإشارة كما في اليونانية من غير إضافة اسم تفسيري؛ ومرجعه مفهوم من سياق الذبائح والتطهير السابق.
- source_word: καθαρίζεσθαι
  choice: أَنْ تُطَهَّرَ
  rationale: لفظ «تُطهَّر» طبيعي في العربية ويحافظ على الدلالة الطقسية للتنقية.
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: أَمَّا الأَشْياءُ السَّماوِيَّةُ نَفْسُها
  rationale: تنقل المقابلة والتوكيد في αὐτά، وتبقي «الأشياء السماوية» عامة بدل تفسيرها بالمسكن السماوي أو بجماعة بعينها.
- source_word: κρείττοσι θυσίαις
  choice: بِذَبائِحَ أَفْضَلَ
  rationale: تحافظ على صيغة الجمع في θυσίαις وعلى لفظ «أفضل» المحوري في الرسالة إلى العبرانيين.
- source_word: παρὰ ταύτας
  choice: مِنْ هذِهِ
  rationale: تنقل المقارنة التي يدل عليها παρά مع صيغة التفضيل، وتبقي اسم الإشارة مطابقًا للنص.
theological_decisions:
- issue: تطهير الأشياء السماوية
  choice: إبقاء القول إن الأشياء السماوية نفسها تُطهَّر، من غير تفسير يزيل حدة العبارة
  alternative: تفسيرها بأنها المسكن السماوي، أو المؤمنون، أو إعادة الصياغة لتجنب نسبة التطهير إلى ما هو سماوي
  rationale: النص يقابل بين نسخ ما في السماوات والأشياء السماوية نفسها، ويستعمل لغة التطهير في الطرفين؛ لذلك ينبغي حفظ هذا التوتر التفسيري.
- issue: جمع «ذبائح» وعلاقته بذبيحة المسيح الواحدة
  choice: إبقاء «ذبائح» بصيغة الجمع
  alternative: تحويلها إلى المفرد «ذبيحة» انسجامًا مع موضوع التقدمة الواحدة في الرسالة
  rationale: النص اليوناني يستعمل θυσίαις بصيغة الجمع، فلا تُسوّى صيغته لاهوتيًا مع مواضع أخرى تؤكد التقدمة الواحدة.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. حُفظ إيجاز الشطر الثاني كما في اليونانية، حيث يُفهم فعل التطهير من الشطر الأول. وأُبقيت «بهذه» بلا اسم مضاف صريحًا للمحافظة على قدر الإضمار الموجود في الأصل.
