  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: ar
  text: وهي أحكام جسدية لا تتعلق إلا بأطعمة وأشربة واغتسالات متنوعة، مفروضة إلى وقت الإصلاح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισμοῖς
  choice: اغتسالات
  rationale: السياق يتحدث عن طقوس تطهير متنوعة، لا عن المعمودية المسيحية تحديدًا؛ و«اغتسالات» عربية واضحة وتحفظ صيغة الجمع.
- source_word: δικαιώματα σαρκὸς
  choice: فرائض تخص الجسد
  rationale: «فرائض» تنقل معنى الأحكام أو المتطلبات المقررة، و«تخص الجسد» أوضح من وصفها بأنها «جسدية» الذي قد يوحي بحكم أخلاقي سلبي غير لازم.
- source_word: καιροῦ διορθώσεως
  choice: وقت الإصلاح
  rationale: يحفظ دلالة زمن الترتيب أو التقويم إلى الحالة الصحيحة، مع إبقاء طبيعة ذلك الإصلاح غير مفصلة كما في اليونانية.
- source_word: ἐπικείμενα
  choice: مفروضة
  rationale: ينقل معنى كون هذه الفرائض موضوعة على المخاطَبين وملزمة لهم حتى الوقت المحدد.
theological_decisions:
- issue: دلالة «الجسد» في العبارة
  choice: فرائض تخص الجسد
  alternative: فرائض جسدية
  rationale: الصياغة المختارة لا تجعل الفرائض شريرة أو شهوانية، بل تبين أن نطاقها خارجي وجسدي، بما يلائم مقابلة السياق مع تطهير الضمير.
- issue: هوية «وقت الإصلاح»
  choice: إبقاء التعبير عامًا دون إضافة تفسير
  alternative: وقت العهد الجديد أو مجيء المسيح
  rationale: النص نفسه لا يسمّي الحدث في هذه العبارة، لذلك تُحفظ إحالة التعبير كما هي بدل إدخال تحديد تفسيري في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ اتصال الآية نحويًا بما قبلها باستعمال «وهي»، لأن النص اليوناني جزء من جملة ممتدة، مع تجنب الغموض غير الطبيعي في العربية.
