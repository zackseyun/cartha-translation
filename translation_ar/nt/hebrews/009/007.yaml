  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: ar
  text: أَمَّا إِلَى الْقِسْمِ الثَّانِي فَلَا يَدْخُلُ إِلَّا رَئِيسُ الْكَهَنَةِ، مَرَّةً وَاحِدَةً فِي السَّنَةِ[a]، وَلَيْسَ بِدُونِ دَمٍ، يُقَدِّمُهُ عَنْ نَفْسِهِ وَعَنْ خَطَايَا الشَّعْبِ الَّتِي ارْتَكَبُوهَا عَنْ جَهْلٍ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي القسم الداخلي الثاني من خيمة الاجتماع؛ ويمكن ترجمة العبارة: «الخيمة الثانية» أو «الحجرة الثانية».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «خطايا الشعب غير المقصودة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: أَمَّا إِلَى الْقِسْمِ الثَّانِي
  rationale: الصفة اليونانية مؤنثة ومحذوف موصوفها، وتحيل في السياق إلى الجزء الداخلي الثاني من المسكن. «القسم الثاني» طبيعي في العربية ويحافظ على الإبهام النسبي بين الخيمة والحجرة.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: مَرَّةً وَاحِدَةً فِي السَّنَةِ
  rationale: تعبير عربي واضح ينقل التواتر السنوي الذي تدل عليه العبارة اليونانية.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: فَلَا يَدْخُلُ إِلَّا رَئِيسُ الْكَهَنَةِ
  rationale: أسلوب القصر بـ«لا... إلا» ينقل بوضوح أن الدخول مقصور على رئيس الكهنة وحده.
- source_word: οὐ χωρὶς αἵματος
  choice: وَلَيْسَ بِدُونِ دَمٍ
  rationale: يحافظ على صيغة النفي في الأصل وعلى ذكر الدم صراحةً دون تفسيره بإضافة غير موجودة.
- source_word: ὃ προσφέρει
  choice: يُقَدِّمُهُ
  rationale: الفعل «يقدّم» ملائم للسياق الذبائحي، والضمير يعود إلى الدم كما في اليونانية.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: عَنْ نَفْسِهِ
  rationale: «عن» تعبير عربي مألوف في سياق التقديم النيابي، من غير توسيع دلالي.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: خَطَايَا الشَّعْبِ الَّتِي ارْتَكَبُوهَا عَنْ جَهْلٍ
  rationale: يبيّن أن المقصود ذنوب اقترنت بعدم المعرفة، لا مجرد نقص في المعلومات، مع إبقاء «غير المقصودة» بديلًا ممكنًا في الحاشية.
theological_decisions:
- issue: طبيعة ἀγνοήματα في السياق الذبائحي
  choice: خَطَايَا الشَّعْبِ الَّتِي ارْتَكَبُوهَا عَنْ جَهْلٍ
  alternative: خطايا الشعب غير المقصودة
  rationale: اللفظة تدل على تجاوزات ناشئة عن الجهل أو عدم الإدراك، مع بقائها خطايا. الصياغة لا تحصر المعنى في غياب القصد وحده ولا تحوّله إلى مجرد جهل معرفي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «القسم الثاني» لإكمال الحذف في اليونانية من غير حسم زائد لطبيعة الموضع، وحُفظ الأسلوب الذبائحي بلفظي «الدم» و«يقدّمه».
