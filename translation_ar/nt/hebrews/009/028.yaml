  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: ar
  text: هكذا أيضًا المسيح، بعدما قُدِّم مرةً واحدةً ليحمل خطايا كثيرين، سيظهر مرةً ثانيةً، بمعزل عن الخطيئة[a]، للذين ينتظرونه بشوق، للخلاص.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من دون علاقة بالخطيئة»، أي لا ليحمل الخطايا كما في تقدمته الأولى.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: هكذا أيضًا
  rationale: تحفظ أداة المقارنة التي تربط بما سبق في الآية 27، بصياغة عربية واضحة وموجزة.
- source_word: ὁ Χριστός
  choice: المسيح
  rationale: تنقل اللقب اليوناني بصيغته العربية الراسخة، الملائمة للسياق الخلاصي.
- source_word: ἅπαξ
  choice: مرةً واحدةً
  rationale: تنقل معنى وقوع الحدث مرة واحدة من غير إضافة معنى «إلى الأبد» غير المصرح به في اللفظة نفسها.
- source_word: προσενεχθεὶς
  choice: بعدما قُدِّم
  rationale: تحفظ صيغة المبني للمجهول وسبق التقدمة على الظهور المستقبلي، ولا تضيف ضميرًا انعكاسيًا غير موجود في العبارة.
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: ليحمل خطايا كثيرين
  rationale: تعبر عن الغاية وتحفظ الصدى الذبائحي وصورة حمل الخطايا، مع احتمال الإحالة إلى إشعياء 53.
- source_word: πολλῶν
  choice: كثيرين
  rationale: نقل مباشر يحافظ على الإيجاز وعلى الصدى الكتابي المحتمل.
- source_word: ἐκ δευτέρου
  choice: مرةً ثانيةً
  rationale: تعبير عربي طبيعي يبرز المقابلة بين التقدمة الأولى والظهور الآتي.
- source_word: χωρὶς ἁμαρτίας
  choice: بمعزل عن الخطية
  rationale: يحافظ على إيجاز الأصل وغموضه النسبي، بدل أن يحسم في المتن أنه يعني «لا لحمل الخطية».
- source_word: ὀφθήσεται
  choice: سيظهر
  rationale: صياغة عربية طبيعية للغة الظهور الأخروي، وهي أنسب سياقيًا من النقل الحرفي «سيُرى».
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: للذين ينتظرونه بشوق
  rationale: تنقل معنى الانتظار المتطلع والمترقب الذي تحمله ἀπεκδέχομαι.
- source_word: εἰς σωτηρίαν
  choice: للخلاص
  rationale: تحفظ معنى الغاية في عبارة موجزة، من غير إضافة فعل تفسيري مثل «جالبًا الخلاص».
theological_decisions:
- issue: معنى χωρὶς ἁμαρτίας عند الظهور الثاني
  choice: بمعزل عن الخطية
  alternative: من دون تعلق بحمل الخطية، أي إنه لا يظهر ثانيةً ليحملها كما في تقدمته الأولى
  rationale: تُبقي الصياغة الأساسية قريبة من اليونانية وتحفظ توتر العبارة، بينما تعرض الحاشية التفسير السياقي الأوضح من غير فرضه على المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «المسيح» للقب Χριστός، و«قُدِّم» للحفاظ على المبني للمجهول، مع إبقاء العبارة اللاهوتية الموجزة «بمعزل عن الخطية» في المتن وشرحها في الحاشية.
