- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: موسى على الشعب كله
  rationale: حُوِّل المبني للمجهول اليوناني إلى تركيب عربي معلوم طبيعي، مع الحفاظ على موسى بوصفه المتكلم وعلى شمول المخاطَبين.
- source_word: λαβὼν
  choice: أخذ
  rationale: صيغ اسم الفاعل الماضي فعلاً سردياً للحفاظ على تعاقب الحدث بوضوح في العربية.
- source_word: τὸ αἷμα τῶν μόσχων
  choice: دم العجول
  rationale: μόσχος يدل على العجل، وقد يدل في سياق الذبائح على الثور الفتي؛ أُثبت البديل في الحاشية.
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
