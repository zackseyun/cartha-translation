  rationale: المقابل العربي المباشر والمفهوم لفعل الرش الطقسي.
theological_decisions:
- issue: صلة الصياغة برواية الخروج 24
  choice: ترجمة نص العبرانيين كما هو، من غير مواءمة تفسيرية مع تفاصيل رواية الخروج
  alternative: توسيع العبارة لشرح الخلفية الطقسية أو اختيار «الثيران الفتية» في المتن لمواءمة المصطلح الذبائحي
  rationale: يعرض الكاتب الرواية عرضاً مكثفاً، وينبغي إبقاء صياغته وتوترها مع رواية العهد القديم دون تسويتها داخل المتن.
- issue: ما الذي رُشَّ بحسب تركيب الجملة
  choice: الدرج نفسه والشعب كله
  alternative: اعتبار ذكر رش الدرج تفسيراً للخلفية أو حذفه بغرض المواءمة
  rationale: النص اليوناني يصرح بكلا المفعولين، ولذلك تُحفظ دلالته من غير تنقيح أو تناغم قسري.
translation_notes:
