- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: الدرج نفسه والشعب كله
  rationale: «الدرج» يعكس هيئة الوثيقة المكتوبة القديمة، و«نفسه» يحفظ توكيد αὐτό، والعطف يحفظ شمول كلا المرشوشين.
- source_word: ἐράντισεν
