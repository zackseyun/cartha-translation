id: HEB.9.27
reference: Hebrews 9:27
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: ar
  text: وكما أنه مُعيَّن للبشر أن يموتوا مرةً واحدة، وبعد ذلك الدينونة،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: وكما
  rationale: يفتتح التعبير مقارنةً تكتمل في العدد التالي، ولذلك تنقل «وكما» وظيفته السياقية بوضوح وطبيعية.
- source_word: ἀπόκειται
  choice: مُعيَّن
  rationale: يفيد الفعل هنا أمرًا ثابتًا أو مقررًا للبشر، و«مُعيَّن» تؤدي هذا المعنى مع مصدر «أن يموتوا» من غير تشديد زائد على فكرة الحتمية.
- source_word: τοῖς ἀνθρώποις
  choice: للبشر
  rationale: اللفظ اليوناني يشير هنا إلى الإنسانية عمومًا لا إلى الذكور وحدهم، و«البشر» تعبير عربي جامع ودقيق.
- source_word: ἅπαξ
  choice: مرةً واحدة
  rationale: يدل الظرف على وقوع الموت مرة واحدة، ولا يحمل هنا بالضرورة القوة الاصطلاحية الأوسع لعبارة «مرة واحدة وإلى الأبد».
- source_word: ἀποθανεῖν
  choice: أن يموتوا
  rationale: ترجمة مباشرة وطبيعية للمصدر اليوناني ضمن التركيب الدال على ما عُيّن للبشر.
- source_word: μετὰ δὲ τοῦτο
  choice: وبعد ذلك
  rationale: يحفظ تعاقب الموت ثم الدينونة، وينقل δέ بواو استئنافية تلائم السياق العربي.
- source_word: κρίσις
  choice: الدينونة
  rationale: ينقل معنى الحكم أو المحاكمة القضائية دون حصر النتيجة في الإدانة، وهو اللفظ اللاهوتي العربي المألوف في هذا السياق.
theological_decisions:
- issue: عموم الإشارة في τοῖς ἀνθρώποις
  choice: البشر، للدلالة على الإنسانية كلها
  alternative: الناس؛ أو الرجال
  rationale: السياق عام، وصيغة الجمع المذكرة في اليونانية لا تقصر المعنى على الذكور. «البشر» تحافظ على الدقة من غير إبهام جنسي.
- issue: مدلول κρίσις بعد الموت
  choice: الدينونة من غير تحديد نتيجتها أو تفاصيلها الأخروية
  alternative: الإدانة؛ أو الدينونة الأخيرة
  rationale: النص يثبت مجيء الدينونة بعد الموت، لكنه لا يحدد في هذا العدد وحده نتيجتها أو جميع تفاصيلها؛ لذا لا ينبغي إدخال نظام لاهوتي أوسع في الترجمة.
- issue: قوة ἅπαξ
  choice: مرة واحدة
  alternative: مرة واحدة وإلى الأبد
  rationale: يؤكد اللفظ وحدانية وقوع الموت هنا، أما إضافة «وإلى الأبد» فقد توحي بدلالة اصطلاحية أقوى مما يصرح به هذا الموضع.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. حُفظ التركيب المقارن المفتوح لأن الجملة تكتمل في عبرانيين 9:28، كما حُفظت الفاصلة الختامية للدلالة على استمرار السياق.
