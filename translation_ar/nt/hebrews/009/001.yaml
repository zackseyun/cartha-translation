translation:
  language: ar
  text: فإن العهد الأول[a] كان له فرائض للعبادة ومَقدِس أرضي[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الأول»؛ أي العهد الأول. وقد يفهم بعضهم العبارة بمعنى أعم: «الترتيب الأول».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «مَقدِس دنيوي». والمقصود هنا على الأرجح «أرضي»، في مقابل الحقائق السماوية التي يرد ذكرها لاحقًا في هذا الأصحاح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: كانت له
  rationale: ينقل معنى فعل الملكية في صيغة الماضي المستمر نقلًا عربيًا طبيعيًا ضمن وصف الترتيب السابق.
- source_word: μὲν οὖν
  choice: فحتى
  rationale: تفيد الفاء الانتقال والاستمرار من السياق السابق، وتبرز «حتى» القوة التوكيدية أو التنازلية الخفيفة من غير إضافة ظرف زمني غير موجود.
- source_word: ἡ πρώτη
  choice: العهد الأول
  rationale: الموصوف المؤنث محذوف في اليونانية، وأقرب مرجع سياقي هو العهد الأول المذكور في 8:13؛ أُظهر في العربية لإتمام المعنى.
- source_word: δικαιώματα
  choice: فرائض
  rationale: تدل في السياق التعبدي على أحكام مقررة تنظّم العبادة، و«فرائض» لفظ عربي واضح ورصين من غير حصرها في الوصايا الأخلاقية.
- source_word: λατρείας
  choice: للعبادة
  rationale: اللام تعبّر طبيعيًا عن مجال الفرائض أو غايتها، وتحفظ المعنى الشعائري للكلمة.
- source_word: τό τε ἅγιον
  choice: مَقدِس
  rationale: يدل التعبير على الموضع المقدس عمومًا قبل تفصيل أقسام المسكن في الآيات التالية؛ و«مَقدِس» لا يحصره في أحد القسمين.
- source_word: κοσμικόν
  choice: أرضي
  rationale: يعكس المقابلة اللاحقة مع المقدس السماوي، ويتجنب الإيحاء الأخلاقي السلبي الذي قد تحمله ترجمة مثل «دنيوي».
theological_decisions:
- issue: مرجع ἡ πρώτη المحذوف
  choice: العهد الأول
  alternative: الأول؛ أو الترتيب الأول
  rationale: السياق المباشر في نهاية الأصحاح الثامن يقابل بين العهد الأول والجديد. ومع ذلك، يحفظ الهامش حقيقة أن كلمة «العهد» غير مذكورة صراحة في هذه الجملة اليونانية.
- issue: دلالة κοσμικόν
  choice: أرضي
  alternative: دنيوي؛ أو تابع لهذا العالم
  rationale: المقصود على الأرجح مقابلة المقدس القائم في العالم الأرضي بالحقائق السماوية اللاحقة، لا وصفه بالفساد الأخلاقي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «مَقدِس» للمكان المقدس، وضُبط بالشكل الجزئي لتمييزه من «مُقدَّس». وُضعت علامتا الهامش بعد العبارتين اللتين تشرحانهما مباشرة.
