id: HEB.9.15
reference: Hebrews 9:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: ar
  text: ولذلك فهو وسيط عهد جديد[a]، لكي ينال المدعوون وعد الميراث الأبدي، إذ حدث موت لأجل الفداء من التعديات التي ارتُكبت في ظل العهد الأول.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وصية جديدة» بدلًا من «عهد جديد»؛ فاللفظة اليونانية διαθήκη تحتمل المعنيين، وتُبرز الآيتان 16–17 من عبرانيين 9 هذا التداخل، مع أن «عهد» أنسب هنا بسبب المقابلة مع العهد الأول.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ولذلك
  rationale: تعبير سببي طبيعي يربط الآية بما سبق ويحفظ معنى «لهذا السبب» بإيجاز.
- source_word: διαθήκης καινῆς
  choice: عهد جديد
  rationale: معنى العهد هو الأنسب للمقابلة الصريحة مع العهد الأول، مع إثبات احتمال معنى الوصية في الحاشية.
- source_word: μεσίτης
  choice: وسيط
  rationale: لفظ عربي دقيق ومألوف لمن يقوم بين طرفين لإقامة العلاقة العهدية.
- source_word: ὅπως
  choice: لكي
  rationale: يحفظ دلالة الغاية أو النتيجة المقصودة في العبارة اليونانية.
- source_word: θανάτου γενομένου
  choice: إذ حدث موت
  rationale: ينقل تركيب المضاف المطلق بوصف الموت حدثًا وقع ويؤسس لما يليه، من غير أن يصرّح في هذا الموضع بهوية الميت بما يتجاوز صياغة الأصل.
- source_word: εἰς ἀπολύτρωσιν
  choice: لفداء
  rationale: «الفداء» يلائم سياق الذبيحة والتحرير بكلفة، واللام تنقل اتجاه الموت وغايته.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: التعديات التي وقعت في ظل العهد الأول
  rationale: «في ظل» تعبّر بوضوح عن وقوع التعديات ضمن زمن العهد الأول أو نطاقه، و«وقعت» إضافة لازمة لسلاسة العربية.
- source_word: τὴν ἐπαγγελίαν
  choice: وعد
  rationale: يحافظ على الاسم المفرد ويربطه طبيعيًا بالميراث الأبدي الموعود.
- source_word: λάβωσιν
  choice: ينال
  rationale: فعل عربي فصيح وطبيعي لنوال الوعد، ويحفظ دلالة النتيجة المقصودة بعد «لكي».
- source_word: οἱ κεκλημένοι
  choice: المدعوون
  rationale: ينقل اسم المفعول الدال على من تلقوا الدعوة دون إدخال تحديد مذهبي لطبيعتها.
- source_word: τῆς αἰωνίου κληρονομίας
  choice: الميراث الأبدي
  rationale: صياغة مباشرة تحفظ ثقل الوصف واستمرار الميراث.
theological_decisions:
- issue: مرجع الفاعل المستتر في ἐστίν
  choice: إظهاره بضمير «هو» العائد إلى المسيح في السياق السابق
  alternative: 'إعادة الاسم صراحة: «المسيح هو»'
  rationale: العربية تحتاج إلى رابط واضح، و«هو» يحفظ إحالة السياق دون تكرار اسم غير وارد في الآية نفسها.
- issue: معنى διαθήκη في الآية
  choice: العهد في المتن
  alternative: الوصية
  rationale: المقابلة بين العهد الجديد والعهد الأول تجعل «العهد» المعنى الأرجح هنا، مع إبقاء التداخل الدلالي الذي ستطوره الآيتان 16–17 في الحاشية.
- issue: العلاقة بين وعد الميراث وصيغة المضاف إليه
  choice: «وعد الميراث الأبدي»
  alternative: «الوعد بالميراث الأبدي»
  rationale: الصياغة المختارة تحافظ على قرب البناء اليوناني وعلى إمكان فهمه بوصفه الوعد المتعلق بالميراث، من غير فصل مصطنع بين الوعد والميراث.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. رُتبت جملة الغاية بحيث يأتي نوال الوعد أولًا ثم الظرف المؤسس له، تجنبًا لتراكم الاعتراضات مع الحفاظ على العلاقات النحوية والمعنى. أُبقيت عبارة «حدث موت» غير مصرّحة بهوية الميت احترامًا لصياغة الأصل، مع وضوح المرجع من السياق.
