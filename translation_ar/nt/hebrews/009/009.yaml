id: HEB.9.9
reference: Hebrews 9:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: ar
  text: وهي مَثَلٌ للوقت الحاضر[a]، وبحسبها تُقدَّم قرابين وذبائح لا تقدر أن تُكمِّل العابد من جهة الضمير.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «رمز» أو «صورة» للوقت الحاضر.
    reason: بدائل معجمية معتبرة لكلمة παραβολή في هذا السياق.
lexical_decisions:
- source_word: ἥτις
  choice: وهي
  rationale: ضمير موصول تفسيري يعود إلى الخيمة المذكورة سابقًا، وصيغة «وهي» تحافظ على الصلة من غير زيادة في التحديد.
- source_word: παραβολὴ
  choice: مَثَل
  rationale: يحفظ المعنى التصويري الواسع للكلمة وعلاقة المقابلة، مع إثبات البدائل السياقية في الحاشية.
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: للوقت الحاضر
  rationale: تعبير عربي واضح وقريب من دلالة الزمن القائم أو الحاضر في سياق الحجة.
- source_word: καθ’ ἣν
  choice: وبحسبها
  rationale: يحفظ علاقة الموافقة أو الانتظام التي تربط ترتيب الخيمة بتقديم القرابين والذبائح، ويوافق مرجعًا مؤنثًا هو الخيمة.
- source_word: δῶρά τε καὶ θυσίαι
  choice: قرابين وذبائح
  rationale: يميز بين نوعي التقدمات التعبدية بصياغة عربية مألوفة، والعطف يؤدي معنى الاقتران في τε καὶ طبيعيًا.
- source_word: προσφέρονται
  choice: تُقدَّم
  rationale: يحفظ المبني للمجهول ودلالة الممارسة الجارية.
- source_word: μὴ δυνάμεναι
  choice: لا تقدر
  rationale: ينقل بوضوح عدم قدرة القرابين والذبائح مع إبقاء صيغة القدرة الظاهرة في الأصل.
- source_word: κατὰ συνείδησιν
  choice: من جهة الضمير
  rationale: يحدد المجال الذي لا يتحقق فيه التكميل، من غير اختزاله في الإخلاص الذاتي.
- source_word: τελειῶσαι
  choice: أن تُكمِّل
  rationale: يحفظ الثقل اللاهوتي المتكرر للفعل في الرسالة، أي بلوغ الحالة المقصودة من الكمال أو الأهلية.
- source_word: τὸν λατρεύοντα
  choice: العابد
  rationale: اسم فاعل مفرد موجز وطبيعي يدل على القائم بالعبادة في السياق الطقسي.
theological_decisions:
- issue: دلالة παραβολή في السياق الطقسي والنمطي
  choice: مَثَل
  alternative: رمز أو صورة
  rationale: «مَثَل» يحفظ البنية التصويرية والمقابلة التي تفيدها الكلمة، ولا يحصرها في مفهوم رمزي مجرد؛ ولأن «رمز» و«صورة» احتمالان سياقيان معتبران، ذُكرا في الحاشية.
- issue: نطاق التكميل في κατὰ συνείδησιν
  choice: أن تُكمِّل العابد من جهة الضمير
  alternative: أن تجعل ضمير العابد كاملًا
  rationale: الصياغة المختارة تُبقي العابد مفعولًا للتكميل وتجعل الضمير مجالًا أو اعتبارًا له، كما في التركيب اليوناني، بدل تحويل الضمير نفسه إلى المفعول.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت ألفاظ كتابية مألوفة من غير تعقيد قديم، مع الحفاظ على تركيب الجملة وعلاقة الخيمة بما يُقدَّم فيها، وعلى التوتر الدلالي في «مَثَل» و«تُكمِّل».
