  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: ar
  text: وبهٰذا يبيّن الروح القدس أن الطريق إلى الأقداس[a] لم يُكشف بعد، ما دامت الخيمة الأولى لا تزال قائمة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى المَقدِس». وقد تُفهم العبارة اليونانية على وجه أخص بمعنى «إلى قدس الأقداس».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «ما دامت الخيمة الأولى باقية أو لا يزال لها اعتبار».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: يبيّن
  rationale: ينقل معنى الإظهار والدلالة في اسم الفاعل الحاضر بصياغة عربية طبيعية، مع بقاء الفاعل «الروح القدس» واضحًا.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: الروح القدس
  rationale: المقابل العربي المعياري والواضح للعبارة اليونانية.
- source_word: μήπω πεφανερῶσθαι
  choice: لم يُكشف بعد
  rationale: يحفظ معنى عدم الانكشاف إلى تلك المرحلة؛ والبناء للمجهول يقابل صيغة اليونانية المبنية للمجهول دون تعيين الكاشف.
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: الطريق إلى الأقداس
  rationale: السياق سياق خيمة وعبادة ودخول، ولذلك تُفهم العبارة مكانيًا. ويحفظ «الأقداس» صيغة الجمع ولا يضيّق المرجع إلى قدس الأقداس وحده.
- source_word: πρώτης σκηνῆς
  choice: الخيمة الأولى
  rationale: ترجمة مباشرة تحافظ على تمييز الكاتب بين القسم الأول وما وراء الحجاب في السياق القريب.
- source_word: ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν
  choice: ما دامت الخيمة الأولى لا تزال قائمة
  rationale: صياغة عربية سليمة تنقل الاستمرار الزمني ومعنى بقاء الخيمة قائمة أو سارية.
theological_decisions:
- issue: مرجع τῶν ἁγίων
  choice: الأقداس، أي الحيّز المقدس في سياق الخيمة
  alternative: القدس أو قدس الأقداس على وجه التحديد؛ أو القديسون
  rationale: السياق المباشر مكاني وطقسي، لا يتحدث عن طريق القديسين. أما صيغة الجمع فلا توجب حصر الدلالة في الحجرة الداخلية، لذا تُرك اتساعها في المتن.
- issue: دلالة بقاء الخيمة الأولى
  choice: لا تزال قائمة
  alternative: لا يزال لها مقام أو اعتبار
  rationale: العبارة اليونانية تحتمل البقاء القائم فعليًا أو استمرار الوضع والنظام الذي تمثله؛ اختير التعبير العربي الطبيعي، مع إثبات البديل في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «الأقداس» للمحافظة على الجمع اليوناني وعلى الغموض الحقيقي في مدى الإشارة، واستُعملت «ما دامت... لا تزال قائمة» لتجنب تركيب حرفي ثقيل.
