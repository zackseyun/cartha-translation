source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: ar
  text: فكم بالأحرى سيطهِّر دمُ المسيح—الذي بروحٍ أزلي قدَّم نفسه لله بلا عيب—ضميرَنا من أعمالٍ ميتة، لنعبد الله الحي؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: فكم بالأحرى
  rationale: صياغة عربية طبيعية تحفظ قوة الاستدلال من باب الأولى واتصاله بالآية السابقة.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: دم المسيح
  rationale: يحفظ لفظ الدم ودلالته الذبائحية، ويترجم Χριστός باللقب العربي الراسخ «المسيح».
- source_word: διὰ πνεύματος αἰωνίου
  choice: بروح أزلي
  rationale: تحفظ العبارة غياب أداة التعريف في اليونانية واحتمالها الدلالي، مع بيان القراءة الشخصية البديلة في الحاشية.
- source_word: ἑαυτὸν προσήνεγκεν
  choice: قدَّم نفسه
  rationale: الفعل «قدَّم» ملائم للسياق القرباني ويحفظ دلالة الضمير الانعكاسي.
- source_word: ἄμωμον
  choice: بلا عيب
  rationale: تعبير ذبائحي واضح يشير إلى خلو القربان من العيب، من غير تحويله إلى وصف أخلاقي محض.
- source_word: καθαριεῖ
  choice: يطهِّر
  rationale: يحفظ زمن المستقبل الذي تحدده صيغة الاستفهام «فكم بالأحرى يطهّر»، ويلائم سياق التطهير الشعائري والباطني.
- source_word: τὴν συνείδησιν ἡμῶν
  choice: ضميرنا
  rationale: ترجمة عربية معيارية للمفرد اليوناني مع ضمير الجمع.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: من أعمال ميتة
  rationale: ترجمة قريبة تحفظ كثافة العبارة وصلتها بعبرانيين 6:1 دون تفسيرها بأنها أعمال تؤدي إلى الموت.
- source_word: εἰς τὸ λατρεύειν
  choice: لنعبد
  rationale: تحفظ معنى الغاية، ويعبّر «نعبد» بوضوح عن الخدمة الدينية التي يدل عليها λατρεύω في هذا السياق.
- source_word: θεῷ ζῶντι
  choice: الله الحي
  rationale: الصيغة العربية الطبيعية للتعبير اليوناني، وتحفظ المقابلة الضمنية بين الأعمال الميتة والله الحي.
theological_decisions:
- issue: مرجع πνεύματος αἰωνίου
  choice: إبقاء العبارة «بروح أزلي» في المتن دون حسم صريح
  alternative: «بالروح الأزلي»، على أنها إشارة إلى الروح القدس؛ أو روح المسيح الأزلي
  rationale: التركيب اليوناني بلا أداة تعريف ويحتمل أكثر من قراءة. يحفظ المتن هذا الانفتاح، وتذكر الحاشية القراءة الشائعة التي ترى فيه الروح القدس.
- issue: دلالة Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني ويحفظ وظيفته اللقبية بصورة طبيعية ومفهومة.
- issue: دلالة λατρεύειν
  choice: نعبد
  alternative: نخدم
  rationale: الفعل ذو دلالة تعبدية وشعائرية في السياق؛ «نعبد» أوضح عربيًا، مع أن معنى الخدمة المقدسة يظل حاضرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على بنية الاستدلال، والمفردات الذبائحية، والغموض الحقيقي في عبارة πνεύματος αἰωνίου.
