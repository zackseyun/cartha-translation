  source_fidelity: 'المعنى الأساسي محفوظ بدقة: الاستدلال من باب الأولى، دم المسيح، تقديمه لنفسه بلا عيب لله، تطهير الضمير من الأعمال الميتة، وغاية عبادة الله الحي. لكن الفعل اليوناني καθαριεῖ مستقبل صريح، والاستفهام البلاغي في πόσῳ μᾶλλον ينبغي أن يظهر بوضوح في العربية. كما أن تقديم «بروح أزلي» قرب «قدَّم» يوضح تعلّقه بالفعل كما في اليونانية.'
