  to: فكم بالأحرى سيطهِّر دمُ المسيح—الذي بروحٍ أزلي قدَّم نفسه لله بلا عيب—ضميرَنا من أعمالٍ ميتة، لنعبد الله الحي؟
  rationale: أُظهر المستقبل والاستفهام البلاغي الصريحان في الأصل، وأعيد ترتيب العبارة الظرفية لتتعلق بوضوح بفعل تقديم المسيح لنفسه. ولم يُحسم مرجع «روح أزلي» في المتن، إذ إن التركيب اليوناني يسمح بالقراءة الأعم، بينما تحفظ الحاشية القراءة الشائعة المتعلقة بالروح القدس.
