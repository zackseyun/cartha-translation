base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: ar
  text: لأن العهد لا يكون نافذًا إلا بوجود موتى[b][a]، إذ لا تكون له قوة قط ما دام مُنشِئه حيًّا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن الوصية لا تصح إلا بعد الموت، إذ لا تكون نافذة ما دام واضعها حيًّا». يمكن للكلمة اليونانية أن تعني «عهدًا» أو «وصية».'
    reason: alternative_reading
  - marker: b
    text: العبارة المترجمة «بوجود موتى» موجزة في اليونانية، وقد تشير إلى أشخاص ماتوا، على معنى الوصية، أو إلى موت داخل في تثبيت العهد.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: العهد
  rationale: السياق الأوسع في عبرانيين 8–10 سياق عهدي مرتبط بالعهد الأول والجديد وبالدم، مع إبقاء معنى «الوصية» الممكن في الحاشية.
- source_word: ἐπὶ νεκροῖς
  choice: مع وجود موتى
  rationale: العبارة اليونانية موجزة وملتبسة؛ وهذه الصياغة العربية تحافظ على الجمع وعلى إمكان الإشارة إلى أشخاص ماتوا أو إلى موت داخل في تثبيت العهد، من غير تعيين أحد الوجهين.
- source_word: βεβαία
  choice: نافذًا
  rationale: يدل الوصف هنا على ثبوت القوة العملية أو القانونية، و«نافذ» تعبير عربي واضح في هذا المعنى.
- source_word: ἐπεὶ
  choice: إذ
  rationale: تُدخل العلة المفسرة للجملة السابقة بصورة طبيعية وموجزة.
- source_word: μήποτε
  choice: لا ... ما دام
  rationale: يفيد التركيب في هذا السياق انتفاء النفاذ طوال مدة حياة المُنشئ، لا معنى التحذير أو الاحتمال.
- source_word: ἰσχύει
  choice: تكون له قوة
  rationale: ينقل معنى السريان والفاعلية، مع تجنب تكرار «نافذ» في الجملة نفسها.
- source_word: ὅτε ζῇ
  choice: ما دام ... حيًّا
  rationale: يعبّر بوضوح عن استمرار الحالة الزمنية المقابلة للموت.
- source_word: ὁ διαθέμενος
  choice: مُنشئه
  rationale: لفظ عام يمكن أن يدل على من أنشأ عهدًا أو وصية، فيحفظ الالتباس المقصود في الأصل.
theological_decisions:
- issue: هل تُفهم διαθήκη هنا بمعنى «العهد» أم «الوصية»؟
  choice: إثبات «العهد» في المتن، مع ذكر قراءة «الوصية» في الحاشية.
  alternative: الوصية
  rationale: يغلب الإطار العهدي على سياق عبرانيين 8–10، لكن لغة الآيتين 16–17 تحتمل الفهم الوصائي القانوني؛ لذلك لم تُحذف القراءة البديلة.
- issue: مدى حسم دلالة ἐπὶ νεκροῖς
  choice: 'صياغة مفتوحة: «مع وجود موتى».'
  alternative: بعد الموت؛ في حالة أشخاص ماتوا؛ بسبب ذبائح ميتة
  rationale: التركيب اليوناني مضغوط ومختلف في تفسيره، وقد يشير إلى موت صاحب وصية أو إلى موت مرتبط بتثبيت العهد؛ فحُفظ التوتر بدل حسمه في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «مُنشئه» بدل مصطلح قانوني خاص مثل «الموصي» كي لا يُحسم مسبقًا هل الكلام عن عهد أم وصية، ووُضعت علامتا الحاشيتين في المتن.
