source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: ar
  text: لأن المسيح لم يدخل أقداسًا مصنوعةً بالأيدي، وهي صورٌ للأشياء الحقيقية، بل إلى السماء عينها، ليظهر الآن أمام وجه الله من أجلنا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في حضرة الله». وحرفيًا: «أمام وجه الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: المسيح
  rationale: اللفظ العربي «المسيح» يحفظ معنى اللقب الماسياني، وهو كذلك الصيغة العربية الطبيعية الراسخة، من غير حاجة إلى مقابلة اسمية منفصلة.
- source_word: χειροποίητα
  choice: مصنوعة بالأيدي
  rationale: يحفظ التعبير المقابلة الكتابية بين ما تصنعه الأيدي البشرية والواقع السماوي، بصياغة عربية واضحة.
- source_word: ἅγια
  choice: أقداسًا
  rationale: يحفظ صيغة الجمع والمجال التعبدي في الرسالة إلى العبرانيين، ولا يحصر المرجع في حجرة واحدة من المسكن.
- source_word: ἀντίτυπα
  choice: صورٌ مقابلة
  rationale: يدل اللفظ على أشياء أرضية تقابل الحقائق السماوية وتمثلها؛ وهذه الصياغة تحفظ معنى المطابقة والتمثيل دون الإيحاء بأنها نسخ متطابقة.
- source_word: τῶν ἀληθινῶν
  choice: للحقائق
  rationale: المقصود هنا الحقائق السماوية الأصيلة في مقابل صورها الأرضية، لا مجرد أشياء صادقة القول.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: السماء عينها
  rationale: «عينها» تنقل قوة التركيب التوكيدي، وتبرز دخول الواقع السماوي ذاته.
- source_word: νῦν
  choice: الآن
  rationale: يحفظ الظرف الزمني ودلالة الحضور الراهن لظهور المسيح أمام الله.
- source_word: ἐμφανισθῆναι
  choice: ليظهر
  rationale: ينقل المصدر الدال على الغاية بصياغة عربية طبيعية، من غير إضافة معنى انعكاسي غير مصرّح به.
- source_word: τῷ προσώπῳ τοῦ θεοῦ
  choice: أمام وجه الله
  rationale: يحفظ صورة النص اليوناني وقرب الحضور الشخصي، وهو تعبير عربي كتابي مفهوم؛ وتوضح الحاشية البديل الاصطلاحي.
- source_word: ὑπὲρ ἡμῶν
  choice: من أجلنا
  rationale: ينقل معنى النيابة والعمل لصالحنا في السياق الكهنوتي دون فرض نظرية كفارية أضيق من العبارة.
theological_decisions:
- issue: الدلالة التعبدية لصيغة ἅγια الجمع
  choice: أقداسًا
  alternative: المقدس؛ القدس
  rationale: يحفظ الجمع اليوناني وصور المسكن، ويتجنب تعيين حجرة بعينها أو تحويل الجمع إلى مفرد تفسيري.
- issue: اللقب المسياني Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب، ويحفظ مدلوله المسياني من غير أن يتحول إلى شرح داخل المتن.
- issue: طبيعة العلاقة في ἀντίτυπα
  choice: صورٌ مقابلةٌ للحقائق
  alternative: نسخٌ من الحقائق؛ رموزٌ للحقائق
  rationale: تحفظ العبارة كون المقدسات الأرضية ممثلات مناظرة للواقع السماوي، دون حصر اللفظ في معنى النسخ أو الرمز وحده.
- issue: قوة النيابة في ὑπὲρ ἡμῶν
  choice: من أجلنا
  alternative: نيابةً عنا؛ لأجلنا
  rationale: صياغة طبيعية تشمل العمل لصالح المؤمنين وتمثيلهم في هذا السياق الكهنوتي، من غير إضافة تحديد عقائدي لا يصرح به العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. حُفظت صورة «مصنوعة بالأيدي» وصيغة جمع «أقداس»، مع استعمال «السماء عينها» لنقل التوكيد. وُضعت علامة الحاشية بعد العبارة التي تشرحها في ختام العدد.
