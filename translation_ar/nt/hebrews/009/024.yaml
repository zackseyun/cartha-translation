  rationale: 'التعديل أسلوبي ودلالي محدود في عبارة ἀντίτυπα τῶν ἀληθινῶν: استُبدلت الصياغة المركبة غير المألوفة بعبارة عربية واضحة تحافظ على أن الأقداس المصنوعة بالأيدي صور للأشياء الحقيقية. وحُذف تكرار «دخل» بعد «بل» لأن العطف بالجار والمجرور طبيعي في العربية ولا يغير المعنى.'
