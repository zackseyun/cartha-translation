  terminology: «المسيح»، و«أقداسًا»، و«مصنوعة بالأيدي»، و«السماء عينها»، و«من أجلنا» اختيارات مناسبة. وتبقى «أمام وجه الله» ترجمة حرفية سليمة، مع حاشيتها الاصطلاحية.
