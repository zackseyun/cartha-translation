lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: وراء الحجاب الثاني
  rationale: تدل μετά مع حالة النصب هنا على علاقة مكانية في وصف المسكن، لذا فـ«وراء» أوضح من المعنى الزمني «بعد». واختيار «الحجاب» يلائم الستار الداخلي الفاصل بين قسمي المسكن ويحافظ على المصطلح الكتابي المألوف.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل الوصف من غير إفادة تضاد قوي.
- source_word: σκηνὴ
  choice: جزءٌ من المسكن
  rationale: تشير σκηνή في السياق إلى القسم الداخلي من المسكن، لا إلى مبنى مستقل. أُضيفت «جزء» لتجنب الإيحاء بوجود مسكن ثانٍ منفصل، مع إبقاء المصطلح العبادي «المسكن».
- source_word: ἡ λεγομένη
  choice: يُسمّى
  rationale: صياغة عربية طبيعية للمشاركة الوصفية بمعنى «الذي يُدعى».
- source_word: Ἅγια Ἁγίων
  choice: قدس الأقداس
  rationale: تعبير إضافي يفيد غاية القداسة، وهو المقابل العربي الراسخ والواضح لاسم أقدس أقسام المسكن.
theological_decisions:
- issue: تحديد مدلول σκηνή بالنسبة إلى القسم الواقع وراء الحجاب الثاني
  choice: جزءٌ من المسكن
  alternative: مسكنٌ ثانٍ
  rationale: التركيب اليوناني يتحدث حرفيًا عن «مسكن» وراء الحجاب، لكن السياق يصف القسم الثاني من المسكن الواحد. الصياغة المختارة توضّح المرجع المكاني من غير أن تجعله مبنى مستقلًا.
- issue: ترجمة Ἅγια Ἁγίων
  choice: قدس الأقداس
  alternative: المكان الأقدس
  rationale: يحافظ «قدس الأقداس» على البنية السامية للتعبير اليوناني وعلى الاسم العربي التقليدي للمقدس الداخلي، بينما يشرح البديل دلالته بصورة مباشرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الحجاب» و«المسكن» و«قدس الأقداس» لاتساقها مع السياق التعبدي، مع توضيح أن المقصود قسم من المسكن لا مسكن آخر مستقل.
