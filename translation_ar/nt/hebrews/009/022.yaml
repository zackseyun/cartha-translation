  terminology: «الشريعة»، و«الدم»، و«سفك دم»، و«مغفرة» ألفاظ مناسبة للسياق الطقسي واللاهوتي من غير تحميل مذهبي. الحاشية تحتاج إلى ألا تعرض «غفران» بوصفه ترجمة بديلة ذات فرق واضح عن «مغفرة»؛ والأدق بيان البديل المعجمي الأوسع، «الإعفاء» أو «الإطلاق»، مع تحديد المعنى السياقي.
