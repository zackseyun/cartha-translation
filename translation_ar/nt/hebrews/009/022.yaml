    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: تقريبًا
  rationale: ظرف يقيّد عموم العبارة، فيحفظ أن التطهير بالدم لا يشمل كل حالة بلا استثناء.
- source_word: ἐν αἵματι
  choice: بالدم
  rationale: الباء العربية تنقل المعنى الأداتي الطبيعي لحرف الجر هنا، أي إن الدم هو وسيلة التطهير الطقسي.
- source_word: πάντα
  choice: كلُّ شيء
  rationale: صيغة الجمع المحايد تفيد عموم الأشياء أو الأمور الطقسية، ويقيّدها الظرف «تقريبًا».
- source_word: καθαρίζεται
  choice: يتطهَّر
  rationale: يحفظ المضارع المبني للمجهول معنى الممارسة المعتادة في سياق الشريعة، و«يتطهّر» ملائم لسياق الطهارة الطقسية.
- source_word: κατὰ τὸν νόμον
  choice: حسب الشريعة
  rationale: ينقل معنى المطابقة لما تقرره الشريعة؛ واختيار «الشريعة» يوضح أن المقصود النظام التشريعي الموسوي في السياق.
- source_word: χωρὶς
  choice: من دون
  rationale: تعبير عربي مباشر وطبيعي عن معنى الانتفاء.
- source_word: αἱματεκχυσίας
  choice: سفك دم
  rationale: ينقل معنى إراقة الدم ويحفظ الصدى الذبائحي من غير تقييده بالعنف وحده.
- source_word: οὐ γίνεται
  choice: لا تحصل
  rationale: يعبر طبيعيًا عن عدم وقوع المغفرة أو تحققها، مع إبقاء الصياغة تقريرية.
- source_word: ἄφεσις
  choice: مغفرة
  rationale: في هذا السياق الذبائحي تشير الكلمة إلى الصفح عن الخطايا، و«مغفرة» أوضح لفظ عربي حديث مع الحفاظ على البديل الدلالي في الحاشية.
theological_decisions:
- issue: دلالة ἄφεσις في السياق الذبائحي
  choice: مغفرة
  alternative: غفران؛ إعفاء أو إطلاق
  rationale: «مغفرة» تنقل بوضوح معنى الصفح عن الخطايا في حجة الرسالة، من غير إدخال تصور مذهبي أضيق؛ وتذكر الحاشية مدى اللفظ الدلالي.
- issue: مدى قاعدة التطهير بالدم
  choice: كلُّ شيء تقريبًا
  alternative: كل الأشياء
  rationale: إبقاء «تقريبًا» ضروري لأنه قيد صريح في اليونانية، ويمنع تحويل العبارة إلى قاعدة مطلقة لا استثناء لها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «الشريعة» للدلالة السياقية على شريعة موسى، و«يتطهّر» للمحافظة على البعد الطقسي، مع صياغة طبيعية غير متكلفة.
