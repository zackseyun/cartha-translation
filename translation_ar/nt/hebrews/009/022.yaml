  to: وبحسب الشريعة، يُطهَّر بالدم كلُّ شيء تقريبًا، ومن دون سفك دم لا تكون مغفرة.[a]
  rationale: أُصلحت صيغة الفعل لتطابق المبني للمجهول في اليونانية وتحافظ على أن الدم وسيلة تطهير الأشياء، لا فعل تقوم به هي. ونُقحت الحاشية لتعرض البدائل الدلالية الحقيقية للفظ اليوناني مع إبقاء «مغفرة» المعنى المقصود سياقيًا.
