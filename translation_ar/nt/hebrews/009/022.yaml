review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: قيد «تقريبًا»، ووسيلة التطهير بالدم، واشتراط سفك الدم للمغفرة، كلها محفوظة. لكن «يتطهَّر» فعل لازم/مطاوع في الاستعمال العربي المعتاد، فيوحي بأن «كل شيء» يطهّر نفسه، ولا ينقل المبني للمجهول καθαρίζεται كما ينبغي؛ والصواب هنا «يُطهَّر».'
