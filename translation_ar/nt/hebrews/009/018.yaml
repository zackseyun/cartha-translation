  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: ar
  text: لذلك، حتى العهد الأول لم يُدشَّن من دون دم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأول»؛ أي العهد الأول. وتفهم بعض الترجمات الاسم المحذوف من السياق على أنه «الوصية الأولى».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: لذلك
  rationale: أداة استنتاج تربط هذه النتيجة بالحجة السابقة بشأن العهد وضرورة الموت؛ و«لذلك» واضحة وطبيعية في العربية المعاصرة.
- source_word: οὐδὲ
  choice: حتى ... لم
  rationale: ينقل هذا التركيب قوة النفي التوكيدي بمعنى «ولا حتى»، ويبرز أن الحكم ينطبق على العهد الأول أيضًا.
- source_word: ἡ πρώτη
  choice: العهد الأول
  rationale: الصفة المؤنثة المستعملة اسميًا تحيل في السياق إلى «العهد» المذكور ضمنًا. أُظهر الاسم في العربية رفعًا للإبهام، من غير إضافة معنى جديد.
- source_word: χωρὶς αἵματος
  choice: من دون دم
  rationale: تعبير عربي مباشر يحافظ على معنى غياب الدم وعلى دلالته الذبائحية والعهدية في السياق.
- source_word: ἐγκεκαίνισται
  choice: لم يُدشَّن
  rationale: الفعل اليوناني بصيغة التام المبني للمجهول يدل على التدشين أو التكريس أو بدء النفاذ. و«يُدشَّن» يحفظ معنى البدء الرسمي الطقسي من غير حصره في التصديق القانوني وحده؛ وجاء الماضي أنسب للسياق العربي.
theological_decisions:
- issue: مرجع «الأول»
  choice: العهد الأول
  alternative: «الأول» فقط، أو «الوصية الأولى»
  rationale: يركز السياق القريب والأوسع في عبرانيين 9 على العهد الأول وترتيباته، كما أن الإشارة إلى خروج 24 وتدشين العهد بالدم ترجّح «العهد». ومع ذلك، تُذكر في الحاشية الصياغة الأكثر حرفية واحتمال «الوصية» حفاظًا على التوتر الدلالي في السياق السابق.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختير «دُشِّن» لدقته في الدلالة على بدء العهد رسميًا وطقسيًا، مع إبقاء الحاشية على الاحتمال الدلالي بين العهد والوصية.
