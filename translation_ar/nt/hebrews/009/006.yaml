  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: ar
  text: وبعد أن أُعِدَّت هذه الأشياء على هذا النحو، يدخل الكهنة باستمرار إلى القسم الأول من المسكن[a]، مؤدّين شعائر العبادة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الخيمة الأولى» أو «الحجرة الأولى». يمكن أن تدل الكلمة اليونانية على المسكن نفسه أو، في هذا السياق، على قسمه الأول.
    reason: lexical_alternative
  - marker: b
    text: أو «مؤدّين أعمال العبادة» أو «قائمين بالواجبات الطقسية».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: وبعد أن أُعِدَّت هذه الأشياء على هذا النحو
  rationale: ينقل تركيب المضاف إليه المطلق بوصفه ظرفًا ممهّدًا لما يليه. «أُعِدَّت» ملائمة لسياق تجهيز المسكن وترتيب محتوياته، و«وبعد» تؤدي الانتقال والعلاقة الظرفية طبيعيًا دون إضافة «الآن» غير الصريحة.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: إلى القسم الأول من المسكن
  rationale: يدل السياق على الحجرة الأولى من خيمة الاجتماع لا على مسكن مستقل؛ لذلك يوضح «القسم الأول» المرجع المكاني، بينما يحفظ «المسكن» الخصوصية التعبدية للمصطلح.
- source_word: διὰ παντὸς
  choice: باستمرار
  rationale: يعبر عن الدخول المتكرر المعتاد في الخدمة الكهنوتية، لا عن وجود متواصل بلا انقطاع.
- source_word: εἰσίασιν
  choice: يدخل
  rationale: المضارع اليوناني هنا يفيد الممارسة الاعتيادية المتكررة، ويؤديها المضارع العربي بوضوح.
- source_word: οἱ ἱερεῖς
  choice: الكهنة
  rationale: يشير إلى الكهنة عمومًا في مقابل رئيس الكهنة المذكور في الآية التالية.
- source_word: τὰς λατρείας
  choice: شعائر العبادة
  rationale: ينقل جمع الكلمة اليونانية بوصفه أعمال الخدمة التعبدية الطقسية في المقدس، من غير إحالته إلى مفهوم «القداس» أو الخدمة الكنسية اللاحقة.
- source_word: ἐπιτελοῦντες
  choice: مؤدّين
  rationale: اسم حال يصف ما يفعله الكهنة عند الدخول، و«مؤدّين» يقترن طبيعيًا بـ«شعائر العبادة» ويحفظ معنى تنفيذ الواجبات المقررة.
theological_decisions:
- issue: دلالة σκηνή في سياق المقدس
  choice: القسم الأول من المسكن
  alternative: الخيمة الأولى؛ الحجرة الأولى
  rationale: السياق يشرح قسمي المسكن الموسوي. الصياغة المختارة تحفظ هوية المسكن التعبدية وتبيّن أن المقصود قسمه الأول، من غير إخفاء البدائل المعجمية، وهي مذكورة في الحاشية.
- issue: قوة διὰ παντὸς في الخدمة الكهنوتية
  choice: باستمرار
  alternative: دائمًا؛ بانتظام
  rationale: تحفظ العبارة المقابلة بين دخول الكهنة المتكرر إلى القسم الأول ودخول رئيس الكهنة المحدود إلى القسم الثاني، دون أن توحي بوجود جسدي متواصل في كل لحظة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «المسكن» للمصطلح التعبدي، مع توضيح القسم المقصود، وتجنُّب ألفاظ قد تستدعي ممارسات كنسية لاحقة.
