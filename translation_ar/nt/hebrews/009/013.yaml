  - severity: low
    issue: الفعل «يقدّسهم» مفرد مع فاعلين معطوفين في العربية.
    rationale: 'مع أن الفعل اليوناني مفرد، فالأفصح والأوضح في العربية أن يطابق الاسمين المعطوفين بالمثنى: «يقدّسانهم». لا يغيّر ذلك الأثر الطقسي المشترك المقصود.'
  - severity: low
