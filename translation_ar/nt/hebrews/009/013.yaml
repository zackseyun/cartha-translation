  source_fidelity: 'المعنى العام محفوظ: الدم والرماد، والرش على المتنجسين، والتقديس المتصل بطهارة الجسد. لكن «إذ يُرَشّ» أقل سلاسة هنا، كما أن إسناد فعل التقديس إلى «دم ... ورماد» يقتضي في العربية الفصحى فعلًا مثنى.'
  naturalness: الصياغة المنقحة تستعمل المبني للمجهول الطبيعي في العربية لوصف الرش («يُرَشّ على»)، وتتجنب الربط الزمني غير الملائم نسبيًا بـ«إذ». واستعمال المثنى «يقدّسانهم» أوضح وأفصح مع الاسمين المعطوفين.
  terminology: «التيوس والثيران»، و«رماد عجلة»، و«تنجسوا»، و«يقدسانهم»، و«طهارة الجسد» ألفاظ دقيقة في السياق الطقسي. و«الجسد» يحافظ على المقابلة المقصودة مع التطهير الداخلي في العدد التالي من غير تحميل σάρξ معنى الطبيعة الخاطئة.
