  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: ar
  text: لأنه إن كان دمُ التيوس والثيران، ورمادُ عجلةٍ يُرَشُّ على الذين تنجَّسوا[a]، يقدِّسانهم لطهارة الجسد[b][c]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الذين صاروا نجسين طقسيًّا.
    reason: lexical_alternative
  - marker: b
    text: أي طهارة خارجية جسدية بحسب طقوس العهد القديم، لا تطهير الضمير المذكور في العدد التالي.
    reason: cultural_note
  - marker: c
    text: إشارة إلى طقس التطهير برماد العجلة في سفر العدد 19.
    reason: cross_reference
lexical_decisions:
- source_word: αἷμα
  choice: دم
  rationale: المعنى الحرفي الدقيق في سياق الذبائح، دون تحويله إلى معنى سفك الدم.
- source_word: τράγων καὶ ταύρων
  choice: التيوس والثيران
  rationale: يحفظ نوعي الحيوان المذكورين وصيغة الإضافة إلى الدم بعبارة عربية طبيعية.
- source_word: σποδὸς δαμάλεως
  choice: رماد عجلة
  rationale: «العجلة» أنثى البقر الفتية، وهي العبارة الملائمة للإحالة إلى فريضة العدد 19.
- source_word: ῥαντίζουσα
  choice: إذ يُرَشُّ على
  rationale: صيغت العبارة بالمبني للمجهول لتكون طبيعية في العربية ولتجنب إيهام أن الرماد نفسه هو الفاعل المقصود، مع إبقاء فعل الرش حاضرًا بوضوح. ويتوافق إفراد الفعل مع «رماد» المفرد في اليونانية.
- source_word: τοὺς κεκοινωμένους
  choice: الذين تنجَّسوا
  rationale: ينقل حالة النجاسة الطقسية التي يدل عليها اسم المفعول التام في هذا السياق.
- source_word: ἁγιάζει
  choice: يقدِّسهم
  rationale: يحفظ اللفظ التعبدي واللاهوتي، مع ضمير مفعول به يوضح في العربية أن الواقع عليهم التقديس هم المتنجسون.
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: لنقاوة الجسد
  rationale: ينقل غاية الطقس ويحفظ البعد الجسدي الخارجي المقابل لتطهير الضمير في العدد التالي، بصياغة عربية أوضح من «نقاوة اللحم».
- source_word: εἰ γὰρ
  choice: لأنه إن كان
  rationale: يحفظ الصلة التعليلية والشرط الذي يكتمل جوابه في العدد التالي.
theological_decisions:
- issue: مدلول التقديس في طقوس العهد القديم
  choice: تقديس طقسي يؤدي إلى نقاوة جسدية خارجية
  alternative: تقديس روحي داخلي شامل
  rationale: عبارة «لنقاوة الجسد» وسياق العدد التالي يفرّقان بين أثر الطقس الخارجي وتطهير الضمير، فلا تُحمَّل الكلمة هنا معنى التحول الأخلاقي الداخلي.
- issue: معنى σάρξ في هذا الموضع
  choice: الجسد، أي المجال البدني الخارجي للنجاسة الطقسية
  alternative: الطبيعة الخاطئة
  rationale: السياق سياق رش وتطهير طقسي، لا استعمال مجازي لـ«الجسد» بمعنى الطبيعة الخاطئة.
- issue: العلاقة النحوية لعبارة الرش
  choice: الرماد هو المتعلَّق النحوي بفعل الرش، وصيغ المعنى عربيًا «رماد عجلة إذ يُرشّ»
  alternative: اعتبار العجلة نفسها فاعلة الرش، أو حذف علاقة الرش بالرماد
  rationale: اسم الفاعل اليوناني مؤنث مفرد يطابق σποδός، لا δάμαλις في صيغة المضاف إليه؛ والصياغة العربية تمنع الالتباس وتحفظ المعنى الطقسي.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعملت «العجلة» بالمصطلح الحيواني الدقيق، و«الجسد» بدل «اللحم» لأن المقصود المجال البدني الخارجي لا المادة اللحمية ولا الطبيعة الخاطئة. تُركت الجملة منتهية بفاصلة لأن الشرط يكتمل في عبرانيين 9:14.
