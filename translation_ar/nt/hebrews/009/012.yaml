  source_fidelity: النص العربي ينقل بدقة المقابلة التي يقيمها اليوناني بين «دم تيوس وعجول» و«دمه هو»، ويحافظ على دلالة الوسيلة في تكرار الباء. و«دخل»، و«مرة واحدة وإلى الأبد»، و«نال فداءً أبديًا» تقابل عناصر النص اليوناني الرئيسة من غير إضافة تفسيرية. كما أن «الأقداس» يحفظ صيغة الجمع الشعائرية في τὰ ἅγια ولا يختزلها في «قدس الأقداس».
