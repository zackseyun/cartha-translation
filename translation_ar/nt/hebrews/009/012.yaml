  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: ar
  text: وليس بدم تيوس وعجول، بل بدمه هو، دخل إلى الأقداس[a] مرة واحدة وإلى الأبد، وقد نال فداءً أبديًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «إلى المقدس». يقول اليوناني حرفيًا «إلى الأقداس». وتترجم بعض الترجمات العبارة ترجمة أكثر تحديدًا: «إلى قدس الأقداس»، لكن هذا أضيق تفسيرًا مما يقتضيه اللفظ نفسه.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: وليس
  rationale: تحافظ على صلة العبارة بما قبلها وعلى النفي المقابل لعبارة «بل بدمه هو»، مع صياغة عربية واضحة.
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: بدم تيوس وعجول
  rationale: الباء تعبّر طبيعيًا عن الوسيلة في العربية، و«عجول» تنقل μόσχων بدقة من غير توسيع إلى «ثيران فتية».
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: بل بدمه هو
  rationale: تكرار الباء يحفظ التوازي مع العبارة السابقة، و«هو» يبرز معنى الملكية والتوكيد في ἰδίου.
- source_word: εἰσῆλθεν
  choice: دخل
  rationale: تنقل الفعل الماضي الدال على حدث مكتمل بصياغة عربية مباشرة.
- source_word: ἐφάπαξ
  choice: مرة واحدة وإلى الأبد
  rationale: تبيّن أن الدخول حدث واحد حاسم غير متكرر، وهو معنى اللفظة في سياق الرسالة إلى العبرانيين.
- source_word: εἰς τὰ ἅγια
  choice: إلى الأقداس
  rationale: تحفظ الصيغة الجمعية والتعبير الشعائري اليوناني من غير حسمه تفسيرًا إلى «قدس الأقداس».
- source_word: αἰωνίαν λύτρωσιν
  choice: فداءً أبديًا
  rationale: صياغة عربية مألوفة ودقيقة تدل على فداء دائم المفعول.
- source_word: εὑράμενος
  choice: وقد نال
  rationale: تنقل المعنى الاصطلاحي للمشاركة، أي الحصول على الفداء، وتحفظ صلتها بالفعل الرئيس من غير أن توحي بمجرد العثور العرضي.
theological_decisions:
- issue: دلالة دخول المسيح بدمه
  choice: صيغت العبارة «بدمه هو» بوصف الدم وسيلة الدخول، في مقابل دم الذبائح الحيوانية، من غير وصف آلية تقديم الدم في المقدس السماوي.
  alternative: أن يكون قد دخل حاملًا دمه أو مقدّمًا إياه مكانيًا على نحو حرفي، أو أن يكون قد دخل فقط بعد سفك دمه.
  rationale: تكرار διά مع المضاف إليه يرجّح معنى الوسيلة، لكن النص لا يفصّل كيفية ارتباط الدم بالدخول؛ لذلك تُحفظ المقابلة من دون إضافة تصور غير مصرّح به.
- issue: مدلول τὰ ἅγια
  choice: الأقداس
  alternative: المقدس؛ قدس الأقداس
  rationale: العبارة اليونانية جمع ويمكن أن تكون تسمية شعائرية للمقدس، أما «قدس الأقداس» فتحدد المرجع أكثر مما يقتضيه اللفظ نفسه.
- issue: صلة εὑράμενος بالفعل الرئيس
  choice: وقد نال فداءً أبديًا
  alternative: إذ نال فداءً أبديًا؛ محققًا فداءً أبديًا
  rationale: هذه الصياغة تحفظ ارتباط نيل الفداء بالدخول من غير الجزم بدلالة زمنية أو سببية أدق مما تفرضه صيغة المشاركة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الأقداس» للمحافظة على الجمع وعلى النبرة الشعائرية، ووُضع التوكيد في «بدمه هو» لإبراز ἰδίου. كما حوفظ على التوتر التفسيري في علاقة الدم بالدخول وفي تحديد موضع الأقداس.
