  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: ar
  text: وكان فيها مذبحُ البخور الذهبي[a]، وتابوتُ العهد المغشّى بالذهب من كل جانب، وفيه إناءٌ ذهبي فيه المنّ، وعصا هارون التي أفرخت، ولوحا العهد،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مجمرة ذهبية». يمكن أن تدل الكلمة اليونانية على مذبح البخور أو على أداة يُحرَق فيها البخور، ودلالتها هنا موضع خلاف.'
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσοῦν ἔχουσα θυμιατήριον
  choice: وكان فيه مذبح البخور الذهبي
  rationale: 'يفيد θυμιατήριον أداةً أو موضعًا لإحراق البخور، وقد يدل على المذبح أو المجمرة. اختير «مذبح البخور» في المتن لملاءمته وصف أثاث المسكن، مع إثبات «مجمرة ذهبية» في الحاشية حفظًا للخلاف المعجمي الحقيقي. وصيغ ἔχουσα طبيعيًا بحسب سياق الجملة السابقة: «وكان فيه».'
- source_word: τὴν κιβωτὸν τῆς διαθήκης
  choice: تابوت العهد
  rationale: «تابوت العهد» هو التعبير العربي الراسخ والدقيق للصندوق المقدس المرتبط بالعهد.
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: المغشّى بالذهب من كل جانب
  rationale: ينقل معنى التغطية المحيطة الكاملة الذي تؤكده πάντοθεν، بلغة عربية واضحة.
- source_word: ἐν ᾗ
  choice: وفيه
  rationale: ضمير المؤنث اليوناني يعود إلى κιβωτός، أما «تابوت» فمذكر في العربية، ولذلك جاء الضمير مذكرًا.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: إناء ذهبي يحتوي على المنّ
  rationale: στάμνος إناء أو جرّة؛ واختيار «إناء» واضح ولا يحدد شكل الوعاء أكثر مما يتيحه الأصل. و«يحتوي على» ينقل ἔχουσα طبيعيًا.
- source_word: ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: عصا هارون التي أفرخت
  rationale: «عصا» المقابل العربي الطبيعي لـῥάβδος، و«أفرخت» تعبر عن إخراج البراعم في الحدث المشار إليه.
- source_word: αἱ πλάκες τῆς διαθήκης
  choice: لوحا العهد
  rationale: الصيغة اليونانية جمع، لكن المرجع التاريخي لوحان؛ والمثنى العربي أفصح وأدق في هذا السياق، من غير إضافة «الحجريان» لأنها غير مذكورة هنا.
- source_word: διαθήκης
  choice: العهد
  rationale: في هذا السياق التعبدي والكتابي، «العهد» هو المقابل الأدق والأرسخ لـδιαθήκη.
theological_decisions:
- issue: دلالة θυμιατήριον في وصف موضع العبادة
  choice: مذبح البخور
  alternative: مجمرة
  rationale: تحتمل الكلمة اليونانية مذبح البخور أو أداة إحراقه، كما أن علاقتها بقدس الأقداس أثارت نقاشًا قديمًا. أُثبت «مذبح البخور» في المتن بوصفه المرجع الأرجح في وصف أثاث المسكن، وحُفظ البديل في حاشية كيلا يُحسم الغموض المعجمي الحقيقي صمتًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت مصطلحات كتابية مألوفة مثل «تابوت العهد» و«المنّ»، مع تجنب الأسلوب العتيق والإضافات التفسيرية غير الموجودة في الأصل.
