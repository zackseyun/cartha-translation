  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: ar
  text: فحيث يوجد عهدٌ[a]، لا بدّ من إثبات موتِ مَن أبرمه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فحيث توجد وصية، لا بدّ من إثبات موت الموصي». يمكن للكلمة اليونانية أن تعني «عهدًا» أو «وصية»، ويفهم كثيرون الآيتين 16–17 هنا بالمعنى القانوني.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: عهد
  rationale: يحافظ «عهد» على المعنى الغالب في سياق عبرانيين 8–10، مع إبقاء المعنى القانوني البديل «وصية» في الحاشية.
- source_word: θάνατον
  choice: موت
  rationale: المقابل العربي المباشر، ويشير هنا إلى الموت الفعلي موضوع الحجة.
- source_word: ἀνάγκη
  choice: لا بدّ من
  rationale: صياغة عربية طبيعية واضحة تعبّر عن الضرورة.
- source_word: φέρεσθαι
  choice: إثبات
  rationale: ينقل في هذا السياق قوة المبني للمجهول بمعنى إحضار الموت إلى دائرة الاعتبار أو إقامة الدليل عليه، من غير صياغة عربية حرفية غامضة مثل «أن يُحمَل».
- source_word: τοῦ διαθεμένου
  choice: الذي أبرمه
  rationale: يشير إلى الشخص الذي أنشأ العهد أو رتّبه، ويحافظ على صلته بـ«عهد» من غير فرض المصطلح القانوني الأضيق «الموصي».
- source_word: ὅπου γὰρ
  choice: فحيث
  rationale: يحفظ القوة التفسيرية لـγάρ والدلالة الظرفية لـὅπου في تركيب عربي موجز.
theological_decisions:
- issue: هل تعني διαθήκη هنا «عهدًا» أم «وصية»؟
  choice: «عهد» في المتن
  alternative: «وصية» في الحاشية
  rationale: السياق الأوسع في عبرانيين 8–10 عهديّ وذبائحي، لكن الآيتين 16–17 تسمحان بفهم قانوني متصل بالوصية؛ لذلك يُحفظ التوتر الدلالي ولا يُحسم ضمنًا.
- issue: دلالة φέρεσθαι في صلة الموت بمن أبرم العهد
  choice: «إثبات موت»
  alternative: «تقديم موت» أو «إحضار الموت إلى الاعتبار»
  rationale: «إثبات» عربية مفهومة في السياق القانوني أو الاستدلالي، بينما تبقى دلالة الفعل اليوناني غير مألوفة وصعبة، ولذلك تتجنب الصياغة إضافة تفسير طقسي أو عقائدي غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أبرمه» لملاءمته للعهد، مع عرض الصياغة القانونية البديلة كاملة في الحاشية.
