  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: ar
  text: وفوقه كروبا المجد يظلِّلان غطاءَ الكفّارة[a]. وأما هذه الأمور، فلا يتيسر الآن الكلام عنها بالتفصيل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «موضع الرحمة»، أي غطاء تابوت العهد؛ ويمكن أيضًا ترجمتها: «ما يُكفَّر به».'
    reason: يحمل اللفظ اليوناني ἱλαστήριον هنا إحالة ملموسة إلى غطاء التابوت ودلالة مرتبطة بالتكفير، فتُذكر البدائل لحفظ هذا الاتساع الدلالي.
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: وفوقه
  rationale: يفيد موضعًا أعلى تابوت العهد المذكور في السياق السابق؛ أُحيل إلى التابوت بضمير عربي طبيعي.
- source_word: Χερουβὶν
  choice: كروبا
  rationale: صيغة مثنى مناسبة لأن الوصف يحيل إلى الكروبين فوق غطاء التابوت، وتحافظ على المصطلح الكتابي المألوف.
- source_word: δόξης
  choice: المجد
  rationale: تحافظ الإضافة «كروبا المجد» على إيجاز اليونانية وعلى احتمال صلتهما بالمجد الإلهي من غير تحويلها إلى مجرد صفة «مجيدان».
- source_word: κατασκιάζοντα
  choice: يظلِّلان
  rationale: فعل واضح يدل على بسط الظل أو التغطية من فوق، ويوافق المثنى في العربية.
- source_word: τὸ ἱλαστήριον
  choice: غطاءَ الكفّارة
  rationale: السياق يتحدث عن غطاء تابوت العهد تحديدًا، بينما يحمل اللفظ دلالة التكفير أيضًا؛ تجمع العبارة بين المرجع المحسوس والدلالة الشعائرية من غير جعله ذبيحة في هذا الموضع.
- source_word: περὶ ὧν
  choice: وأما هذه الأمور
  rationale: إحالة عربية طبيعية إلى محتويات المسكن المذكورة، مع انتقال خطابي ملائم.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: فلا يتيسر الآن الكلام عنها بالتفصيل
  rationale: ينقل معنى عدم إمكان أو ملاءمة تناول كل عنصر تفصيلًا في المقام الحاضر، بصياغة عربية واضحة.
theological_decisions:
- issue: دلالة ἱλαστήριον في سياق أثاث المقدس
  choice: غطاء الكفّارة
  alternative: 'موضع الرحمة؛ أو: ما يُكفَّر به'
  rationale: المرجع المباشر هو غطاء تابوت العهد الذي كان يُرش عليه الدم في يوم الكفارة. لذلك يبيّن المتن الشيء المقصود ويحفظ في الوقت نفسه دلالة التكفير، بينما تعرض الحاشية الترجمات البديلة ولا تحصر اللفظ في تفسير لاهوتي واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل المثنى في «كروبا... يظلِّلان» وفق صورة الكروبين المعروفة من وصف تابوت العهد، وحُفظ التركيب المكثف «كروبا المجد» دون تفسير زائد.
