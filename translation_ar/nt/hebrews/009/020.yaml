lexical_decisions:
- source_word: λέγων
  choice: قائلًا
  rationale: اسم فاعل حاليّ يقدّم الاقتباس ويحافظ على ارتباطه النحوي بما قبله.
- source_word: Τοῦτο
  choice: هذا هو
  rationale: لا ترد أداة ربط صريحة في اليونانية، لكن العربية الطبيعية تستلزم هنا ضمير الفصل «هو» لإظهار الإسناد بوضوح.
- source_word: αἷμα
  choice: دم
  rationale: المقابل المباشر، مع إبقاء صورة الدم الذبائحية الملموسة دون شرح تفسيري داخل النص.
- source_word: διαθήκης
  choice: العهد
  rationale: السياق يحيل إلى تثبيت العهد الموسوي في خروج 24، لا إلى الوصية بمعنى التركة.
- source_word: ἧς
  choice: به
  rationale: الضمير الموصول المضاف يعود إلى «العهد»؛ وصياغة «أمركم الله به» عربية طبيعية وتحافظ على هذه الصلة.
- source_word: ἐνετείλατο
  choice: أمركم
  rationale: الفعل يعني أصدر أمرًا أو أوصى به؛ و«أمركم» واضح ومباشر، مع إدماج المخاطَبين بحسب التركيب العربي.
- source_word: πρὸς ὑμᾶς
  choice: ـكم
  rationale: يفيد توجيه الأمر إلى المخاطَبين. أُدمج في «أمركم» لتجنب الصياغة الثقيلة «أمر به إليكم»، مع إثبات البديل الأقرب حرفيًا في الحاشية.
- source_word: ὁ θεός
  choice: الله
  rationale: المقابل العربي المعياري لاسم الإله في هذا السياق.
theological_decisions:
- issue: معنى διαθήκη في سياق تثبيت العهد بالدم
  choice: العهد
  alternative: الوصية
  rationale: الاقتباس يردد خروج 24:8 ويتناول العهد الموسوي؛ أما «الوصية» بمعنى التركة فلا تلائم الخلفية المباشرة.
- issue: إظهار الإسناد المضمَر بعد Τοῦτο
  choice: هذا هو دم العهد
  alternative: هذا دم العهد
  rationale: «هو» يجعل العبارة واضحة وطبيعية في العربية ولا يضيف مضمونًا لاهوتيًا إلى الإسناد المفهوم من اليونانية.
- issue: علاقة الأمر بالمخاطَبين في ἧς ἐνετείλατο πρὸς ὑμᾶς
  choice: الذي أمركم الله به
  alternative: الذي أمر الله به إليكم
  rationale: المختار عربي سليم ويحفظ عودة الضمير إلى العهد وكون الأمر موجّهًا إلى الشعب، دون حسم زائد لمعنى πρός السياقي.
