source:
  edition: SBLGNT
  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: ar
  text: وكذلك رشَّ بالدم المسكنَ[a] وجميعَ آنية الخدمة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الخيمة»؛ والمراد هنا خيمة العبادة المقدسة، أي المسكن.
    reason: lexical_alternative
  - marker: b
    text: أو «جميع أدوات الخدمة».
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: المسكن
  rationale: يشير اللفظ هنا، في سياق عبرانيين 9، إلى خيمة العبادة المقدسة، و«المسكن» هو التعبير العربي الكتابي الواضح الذي يحفظ هذا المعنى، مع إثبات البديل الحرفي في الحاشية.
- source_word: σκεύη
  choice: آنية
  rationale: يدل اللفظ على الأدوات والأوعية المستعملة في العبادة؛ و«آنية» ملائمة للسياق الطقسي، مع ذكر «أدوات» بوصفها بديلاً أوسع.
- source_word: λειτουργία
  choice: الخدمة
  rationale: المقصود الخدمة الكهنوتية أو التعبدية في المسكن، و«الخدمة» واضحة ولا تضيف تخصيصًا مذهبيًا غير منصوص عليه.
- source_word: αἷμα
  choice: الدم
  rationale: إشارة حرفية إلى دم الذبائح في السياق الطقسي.
- source_word: ὁμοίως
  choice: وكذلك
  rationale: يربط الفعل بما سبق من رشٍّ في العدد السابق ويحفظ دلالة المماثلة.
- source_word: ῥαντίζω
  choice: رشَّ
  rationale: هو المقابل العربي المباشر والواضح لفعل نضح الدم طقسيًا.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة هنا، لا تفيد استدراكًا قويًا.
- source_word: πάντα τὰ σκεύη
  choice: جميع آنية
  rationale: يحفظ شمول العبارة اليونانية بصياغة عربية طبيعية.
theological_decisions:
- issue: علاقة العبارة بخلفيتها الطقسية في أسفار موسى
  choice: نقل العبارة بوصفها تقريرًا موجزًا عن رش المسكن وآنية خدمته بالدم، من غير توسيع أو مواءمة تفسيرية.
  alternative: إضافة شرح في المتن لتفاصيل الخلفية التاريخية أو لمعالجة الفروق الظاهرة مع روايات الخروج واللاويين.
  rationale: النص نفسه يوجز الحدث، والترجمة ينبغي أن تحفظ عرضه والتوترات النصية المحتملة من غير حلّها بإضافات تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «المسكن» للمصطلح المقدسي و«آنية الخدمة» للحفاظ على النبرة الطقسية، مع بدائل معجمية موجزة في الحواشي.
