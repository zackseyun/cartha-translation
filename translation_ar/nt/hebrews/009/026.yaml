id: HEB.9.26
reference: Hebrews 9:26
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: ar
  text: وإلّا، لكان ينبغي أن يتألّم مرّات كثيرة منذ تأسيس العالم. أمّا الآن، فقد ظهر مرّة واحدة لا غير، عند اكتمال الدهور[a]، لإبطال الخطيئة[b] بذبيحة نفسه[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عند نهاية الدهور» أو «عند تمام الدهور».
    reason: lexical_alternative
  - marker: b
    text: أو «لإزالة الخطيئة» أو «لإلغاء الخطيئة».
    reason: lexical_alternative
  - marker: c
    text: أو «بذبيحته». واليونانية أقرب حرفيًا إلى «بذبيحة نفسه».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: وإلّا
  rationale: تدلّ هنا على النتيجة الافتراضية التي كانت ستلزم لو كان المسيح يقدّم نفسه مرارًا، و«وإلّا» تنقل هذا الاستدلال بوضوح.
- source_word: ἔδει
  choice: لكان ينبغي
  rationale: ينقل صيغة الضرورة في سياق افتراضي ماضٍ، لا تقرير ضرورة حدثت بالفعل.
- source_word: πολλάκις
  choice: مرّات كثيرة
  rationale: يحافظ على المقابلة العددية المباشرة مع ἅπαξ، أي «مرّة واحدة».
- source_word: παθεῖν
  choice: أن يتألّم
  rationale: ترجمة مباشرة وطبيعية تشير في السياق إلى آلام المسيح المرتبطة بموته الذبيحي.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: منذ تأسيس العالم
  rationale: «منذ» تعبّر طبيعيًا عن امتداد الزمن ابتداءً من إنشاء العالم.
- source_word: νυνὶ δὲ
  choice: أمّا الآن
  rationale: تُظهر المقابلة القوية بين الفرض السابق والواقع الذي يقرّره الكاتب.
- source_word: ἅπαξ
  choice: مرّة واحدة لا غير
  rationale: تحافظ على معنى الحدث الواحد وتبرز، في مقابل «مرّات كثيرة»، عدم تكراره دون إدخال صياغة عقائدية زائدة.
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: عند اكتمال الدهور
  rationale: تحافظ على معنى بلوغ الدهور غايتها أو تمامها، وعلى صيغة الجمع في αἰώνων.
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: لإبطال الخطيئة
  rationale: ينقل ἀθέτησις بمعنى الإلغاء أو وضع الشيء جانبًا وإبطال أثره، مع الحفاظ على مفرد ἁμαρτίας.
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: بذبيحة نفسه
  rationale: توضح أن الذبيحة هي المسيح نفسه، وهي أقرب إلى تركيب اليونانية من العبارة المحتملة «بذبيحته».
- source_word: πεφανέρωται
  choice: فقد ظهر
  rationale: صياغة عربية طبيعية تنقل الظهور الذي تمّ وله دلالة باقية، وهو ما تشير إليه صيغة التام في اليونانية.
theological_decisions:
- issue: دلالة ἅπαξ في عمل المسيح الذبيحي
  choice: مرّة واحدة لا غير
  alternative: مرّة واحدة
  rationale: المقابلة المباشرة مع «مرّات كثيرة» وسياق الحجة يبرزان حسم الذبيحة وعدم تكرارها؛ و«لا غير» يوضح ذلك من غير تجاوز للنص.
- issue: دلالة ἁμαρτίας بالمفرد
  choice: الخطيئة
  alternative: الخطايا
  rationale: يحافظ المفرد على عرض الخطيئة بوصفها حقيقة جامعة أو قوة يجري إبطالها، من غير أن ينفي التعامل مع الخطايا الفردية.
- issue: هوية الذبيحة في διὰ τῆς θυσίας αὐτοῦ
  choice: بذبيحة نفسه
  alternative: بذبيحته
  rationale: يحافظ الاختيار على احتمال أن αὐτοῦ يبيّن أن الذبيحة هي ذاته، ويتوافق مع سياق تقديم المسيح نفسه.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ومهيبة. استُعملت «الخطيئة» بالمفرد موافقةً للأصل، و«الدهور» حفاظًا على الجمع والدلالة الزمنية الواسعة. وُضعت جميع علامات الحواشي في مواضعها داخل النص.
