source:
  edition: SBLGNT
  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: ar
  text: أحببتَ البرَّ وأبغضتَ التمرّد على الشريعة؛ لذلك مسحك الله، إلهك، بزيت الابتهاج أكثر من رفقائك.[أ]
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: أو «العدل». قد تدل الكلمة اليونانية على البرّ أو العدل؛ ويتبع المتن هنا المقابل المعتمد «البرّ».
    reason: بديل معجمي لـ δικαιοσύνην
lexical_decisions:
- source_word: ἠγάπησας
  choice: أحببتَ
  rationale: صيغة الماضي العربي تنقل الماضي اليوناني الموجز بصورة طبيعية، وتحافظ على الموازاة مع «أبغضتَ».
- source_word: δικαιοσύνην
  choice: البرَّ
  rationale: «البر» هو المقابل الكتابي العربي الطبيعي، ويشمل الاستقامة الأخلاقية؛ ويمكن أن يحمل اللفظ اليوناني معنى العدل بحسب السياق.
- source_word: ἐμίσησας
  choice: أبغضتَ
  rationale: يحفظ قوة التضاد الأخلاقي مع «أحببتَ»، وهو فصيح وواضح في العربية المعاصرة.
- source_word: ἀνομίαν
  choice: التعدّي على الشريعة
  rationale: يُظهر معنى مخالفة القانون الكامن في ἀνομία بوضوح أكبر للقارئ المعاصر من «الإثم»، من غير حصره في جريمة بعينها.
- source_word: διὰ τοῦτο
  choice: لذلك
  rationale: أداة عربية موجزة وطبيعية تحفظ العلاقة السببية أو الاستنتاجية.
- source_word: ἔχρισέν σε
  choice: مسحك
  rationale: يحفظ فعل المسح وصورته الملكية والمسيانية دون تفسير زائد.
- source_word: ὁ θεός, ὁ θεός σου
  choice: الله، إلهك
  rationale: يحافظ على التكرار وعلاقة البدل في اليونانية، ولا يضيف شرحًا عقائديًا.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: بزيت الابتهاج
  rationale: يحفظ الصورة الكتابية ونبرة الفرح الاحتفالي؛ و«الابتهاج» لفظ واضح مهيب.
- source_word: παρὰ τοὺς μετόχους σου
  choice: أكثر من رفقائك
  rationale: ينقل معنى المقارنة والتفوق، بينما تعبّر «رفقائك» طبيعيًا عن المشاركين أو المصاحبين في هذا السياق.
theological_decisions:
- issue: دلالة δικαιοσύνην
  choice: البرَّ
  alternative: العدل
  rationale: «البر» يلائم وصف الاستقامة الأخلاقية في الاقتباس الملكي، مع بقاء «العدل» دلالة معجمية ممكنة دون ضرورة فرضها على المتن.
- issue: القوة المسيحانية لعبارة «الله، إلهك»
  choice: إبقاء العبارة كما هي بلا توسع تفسيري
  alternative: إضافة شرح يحدد العلاقات الأقنومية
  rationale: 'يحفظ النص توتره اللاهوتي: المخاطَب مرفوع المقام، ومع ذلك يُقال له «إلهك». لا ينبغي للترجمة أن تلطف العبارة أو توسعها مذهبيًا.'
- issue: صورة المسح
  choice: مسحك... بزيت الابتهاج
  alternative: عيّنك أو كرّمك
  rationale: الإبقاء على الاستعارة الأصلية يصون الإيحاء الملكي والمسياني ولا يستبدل الصورة بتفسير لها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية مهيبة. استُعمل الماضي المتوازي «أحببتَ... وأبغضتَ»، وحُفظ تكرار «الله، إلهك» وصورة المسح دون توسيع عقائدي. لا توجد علامة حاشية في المتن لأن البديل «العدل» لا يحتاج هنا إلى حاشية لازمة، ولأن الحاشية الإنجليزية المعطاة تبدو موضوعة بعد «God» مع أن مضمونها يخص δικαιοσύνη.
