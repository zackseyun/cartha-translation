source:
  edition: SBLGNT
  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: ar
  text: في آخِرِ هذه الأيام كلَّمنا في ابنٍ[a]، عيَّنه وارثًا لكلِّ شيء، وبه أيضًا صنع الدهور[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بابنٍ». يقول اليوناني حرفيًا «في ابنٍ»، من غير أداة تعريف قبل «ابن»، وفي ذلك إبراز لطريقة كلام الله وطابعه الختامي.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الكون» أو «العوالم». واللفظ اليوناني يعني «الدهور»، وقد يدل أيضًا، بالتوسع، على نظام الخليقة كله.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: في آخِرِ هذه الأيام
  rationale: يحافظ على صورة التعبير اليوناني ومعناه الزمني الأخروي، بصياغة عربية واضحة وطبيعية.
- source_word: ἐλάλησεν ἡμῖν
  choice: كلَّمنا
  rationale: فعل عربي موجز وطبيعي ينقل وقوع كلام الله الموجَّه إلينا، ويوافق المقابلة مع كلامه السابق في الآية الأولى.
- source_word: ἐν υἱῷ
  choice: في ابنٍ
  rationale: يحفظ حرف الجر ἐν وغياب أداة التعريف أمام υἱῷ، من غير أن يضيف «ابنه» أو «الابن» إلى النص.
- source_word: ὃν ἔθηκεν
  choice: عيَّنه
  rationale: يفيد τίθημι هنا إقامة شخص في منزلة أو دور، ولذلك «عيَّنه» أنسب عربيًا مع «وارثًا».
- source_word: κληρονόμον πάντων
  choice: وارثًا لكلِّ شيء
  rationale: ينقل شمول πάντων بعبارة عربية مألوفة، ويحافظ على صورة الوارث.
- source_word: δι’ οὗ
  choice: وبه
  rationale: ينقل معنى الواسطة أو الوسيلة في διά مع المضاف إليه، ويصل الجملة بالعربية بسلاسة.
- source_word: ἐποίησεν
  choice: صنع
  rationale: يحافظ على سعة معنى ποιέω ولا يخصصه بفعل «خلق» الأضيق دلالةً.
- source_word: τοὺς αἰῶνας
  choice: الدهور
  rationale: يحفظ البعد الزمني المباشر للفظ αἰῶνας، مع إمكان دلالته في السياق على نظام الخليقة أو الكون؛ وتوضح الحاشية هذا الاتساع.
theological_decisions:
- issue: الدلالة المسيحانية لعبارة ἐν υἱῷ
  choice: في ابنٍ
  alternative: بابنٍ؛ في الابن؛ بابنه
  rationale: الصياغة المختارة تحفظ التعبير اليوناني غير المعرَّف وما فيه من إبراز لطبيعة كلام الله الختامي، من غير أن تحسم حرف الجر على أنه أداة فحسب أو تضيف ضمير ملكية غير موجود.
- issue: مدى دلالة τοὺς αἰῶνας في عمل الابن
  choice: الدهور في المتن، مع بيان الدلالة الكونية في الحاشية
  alternative: الكون؛ العوالم؛ العالم
  rationale: اللفظ يحتمل العصور نفسها ويمتد بحسب السياق إلى نظام الوجود المخلوق. إبقاء «الدهور» يصون هذا التوتر الزمني الكوني، والحاشية تمنع تضييق المعنى.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الدهور» لإبقاء الاتساع الزمني الكوني في الأصل، و«في ابنٍ» للمحافظة على غرابة التركيب المقصودة دون الإخلال بقابلية الفهم.
