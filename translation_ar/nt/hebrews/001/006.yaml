  source_fidelity: 'يحافظ المتن على البنية والمعاني الأساسية في اليونانية: الظرف الزمني، واحتمال تعلّق «مرة أخرى» بالفعل، ولقب «البكر»، وοἰκουμένη، وصيغة الأمر، وعموم ملائكة الله. لكن الحاشية [b] لا تقابل بدقة أثرها في مسار المراجعة الإنجليزي، إذ إن البديل المقصود هو ترتيب «جميع ملائكة الله»، لا مجرد بيان حرفي غير ذي أثر في المعنى.'
