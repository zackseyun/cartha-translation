base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: ar
  text: 'وعندما يُدخِل البِكرَ مرةً أخرى إلى المسكونة[a]، يقول: «فليسجد له جميعُ ملائكةِ الله»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ومرةً أخرى، عندما يُدخِل البِكرَ إلى المسكونة، يقول: ‹فليسجد له جميع ملائكة الله›». يمكن أن تتعلق عبارة «مرةً أخرى» إما بـ«يُدخِل» وإما بـ«يقول».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «ملائكة الله جميعًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: عندما
  rationale: تُدخل جملة زمنية تشير هنا إلى حدث محدد؛ و«عندما» أوضح من صيغة قد توحي بالتكرار.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تتابع الحجة من غير إبراز تعارض غير مقصود.
- source_word: πάλιν
  choice: مرةً أخرى
  rationale: جُعلت متعلقة بالفعل «يُدخل» وفق ترتيب اليونانية، مع إثبات الاحتمال النحوي الآخر في الحاشية لأن الغموض حقيقي.
- source_word: εἰσαγάγῃ
  choice: يُدخِل
  rationale: ينقل معنى الإدخال إلى مجال أو مكان، ويحافظ على صورة النص من غير توسع تفسيري.
- source_word: τὸν πρωτότοκον
  choice: البِكر
  rationale: لفظ عربي طبيعي يحفظ دلالة اللقب المتعلقة بالأسبقية والمكانة والبنوة في السياق.
- source_word: εἰς τὴν οἰκουμένην
  choice: إلى المسكونة
  rationale: «المسكونة» مقابل دقيق ومألوف كتابيًا لـ οἰκουμένη، ويحفظ إمكان الإشارة إلى العالم المأهول أو العالم المنظور دون تسويته ببساطة مع لفظ κόσμος.
- source_word: λέγει
  choice: يقول
  rationale: يحافظ على إيجاز اليونانية؛ وفاعل القول مفهوم من سياق سلسلة الاقتباسات من غير إضافة «الله» أو «في الكتاب» إلى المتن.
- source_word: προσκυνησάτωσαν
  choice: ولتسجد
  rationale: صيغة الأمر بلام الأمر تنقل القوة الطلبية، و«تسجد له» تحمل في هذا السياق معنى العبادة والتوقير الموجَّه إلى الابن مع إبقاء الصورة المعجمية للفعل.
- source_word: αὐτῷ
  choice: له
  rationale: 'ينقل المفعول غير المباشر للفعل طبيعيًا في العربية: «تسجد له».'
- source_word: πάντες ἄγγελοι θεοῦ
  choice: ملائكةُ الله جميعًا
  rationale: يحفظ تركيب الإضافة وشمول πάντες، مع صياغة عربية فصيحة واضحة.
theological_decisions:
- issue: نطاق تعلّق πάλιν نحويًا
  choice: 'تتعلق بـ«يُدخل»: «يُدخِل البكر مرةً أخرى»'
  alternative: 'تتعلق بفعل القول: «ومرةً أخرى، عندما يُدخل البكر إلى المسكونة، يقول»'
  rationale: يجيز التركيب اليوناني الوجهين. اختير في المتن ما يوافق موضع الظرف قرب فعل الإدخال، وأُبقي الوجه الآخر في الحاشية كي لا يُحسم الغموض النصي خفيةً.
- issue: قوة προσκυνέω الموجَّه إلى الابن
  choice: «تسجد له» بوصفه سجود عبادة في هذا السياق
  alternative: «تنحنِ أمامه» أو «تؤدِّ له الإجلال»
  rationale: في سياق عبرانيين 1، حيث يُؤمر جميع ملائكة الله بهذا الفعل تجاه الابن، لا يليق إضعافه إلى مجرد تحية؛ و«تسجد له» تحفظ الصورة اللفظية والقوة الدينية من غير إضافة تقرير عقائدي إلى النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعملت «المسكونة» للمحافظة على تمييز οἰκουμένη، و«البِكر» كلقب سياقي من غير علامات تفسيرية زائدة. وُضع كل من علامتي الحاشية [a] و[b] في المتن.
