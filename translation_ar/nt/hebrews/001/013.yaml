  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: ar
  text: 'ولكن لأيِّ واحدٍ من الملائكة قال قطّ: «اجلس عن يميني حتى أجعل[a] أعداءك موطئًا لقدميك»؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حتى أضع أعداءك تحت قدميك».'
    reason: بديل معجمي/تعبيري لعبارة «حتى أجعل أعداءك موطئًا لقدميك».
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: ولكن لأيِّ واحدٍ من الملائكة
  rationale: تؤدي «لأي واحد» معنى πρός مع اسم الاستفهام بعد فعل القول، وتحفظ «ولكن» قوة δέ الانتقالية المقابِلة لما سبق.
- source_word: εἴρηκέν ποτε
  choice: قال قط
  rationale: «قط» في سياق الاستفهام تنقل معنى ποτέ، وصيغة «قال» طبيعية في العربية وتحفظ السؤال البلاغي عن قول إلهي لم يُوجَّه إلى أي ملاك.
- source_word: Κάθου
  choice: اجلس
  rationale: أمر مباشر طبيعي يطابق صيغة الأمر اليونانية من κάθημαι.
- source_word: ἐκ δεξιῶν μου
  choice: عن يميني
  rationale: تعبير عربي فصيح مألوف للمكان ذي الكرامة والسلطان، وينقل الصيغة الملكية دون شرح زائد.
- source_word: ἕως ἂν θῶ
  choice: حتى أجعل
  rationale: «حتى أجعل» تنقل الغاية المستقبلية في ἕως ἂν مع صيغة الاحتمال، وتنسجم مع كون الأعداء «موطئًا».
- source_word: τοὺς ἐχθρούς σου
  choice: أعداءك
  rationale: مقابل عربي مباشر وواضح للجمع المعرّف المضاف إلى المخاطَب.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: موطئًا لقدميك
  rationale: يحفظ صورة الإخضاع الملكية ويأتي طبيعيًا في العربية؛ ويمكن فهم الأصل أيضًا بمعنى وضع الأعداء تحت القدمين، وهو مبيّن في الحاشية.
theological_decisions:
- issue: الحفاظ على قوة اقتباس المزمور المسيحانية من غير تفسير زائد
  choice: الإبقاء على خطاب التنصيب الملكي وصورة جعل الأعداء موطئًا للقدمين
  alternative: شرح الصورة بعبارة مثل «حتى أهزم أعداءك هزيمة تامة»
  rationale: حجة الرسالة قائمة على ألفاظ القول الموجَّه إلى الابن دون الملائكة؛ لذلك تُحفظ صورتا الجلوس عن اليمين وإخضاع الأعداء بدل اختزالهما في تفسير.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع الحفاظ على بنية السؤال البلاغي والصورة الكتابية المقتبسة.
