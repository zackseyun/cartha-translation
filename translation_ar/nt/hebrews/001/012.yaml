  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: ar
  text: وكالرِّداء ستطويهم[a]، وكالثوب سيُغَيَّرون. أمّا أنت فأنت كما أنت، وسنوك لا تنقضي[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ستلفّهم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لا تنتهي سنواتك» أو «لا تزول».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: كالرِّداء
  rationale: تحافظ العبارة على صورة لباس خارجي يلتفّ به الإنسان، وتؤدي أداة التشبيه اليونانية بوضوح وإيجاز.
- source_word: ἑλίξεις
  choice: ستطوي
  rationale: الفعل يدل على الطي أو اللف؛ و«ستطوي» طبيعية في العربية وتلائم تشبيه السماوات برداء يُطوى.
- source_word: αὐτούς
  choice: هم
  rationale: ضمير جمع يعود إلى المخلوقات المذكورة في السياق السابق، وأُلحق بالفعل على النحو الطبيعي في العربية.
- source_word: ὡς ἱμάτιον
  choice: كالثوب
  rationale: تحافظ على التشبيه الثاني وعلى إفراد الاسم، مع تنويع عربي طبيعي يوازي الفرق بين περιβόλαιον وἱμάτιον.
- source_word: ἀλλαγήσονται
  choice: سيتغيّرون
  rationale: ينقل معنى وقوع التغيّر عليهم من غير تحديد كيفيته، ويحافظ على التوتر بين تغيّر الخليقة وثبات المخاطَب.
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: أمّا أنت فأنت كما أنت
  rationale: صياغة عربية واضحة تحافظ على المقابلة وعلى معنى بقاء الهوية على حالها، من غير إدخال مصطلح لاهوتي تقني.
- source_word: τὰ ἔτη σου οὐκ ἐκλείψουσιν
  choice: وسنوك لا تنقضي
  rationale: تحافظ على استعارة السنين وتؤدي معنى عدم انتهائها بصياغة عربية موجزة ذات نبرة شعرية.
theological_decisions:
- issue: لغة الثبات الإلهي في اقتباس ذي دلالة مسيانية
  choice: أمّا أنت فأنت كما أنت
  alternative: أمّا أنت فلا تتغيّر
  rationale: المختار أقرب إلى التعبير اليوناني ὁ αὐτός، ويحفظ تقرير الهوية والثبات من غير أن يحوّله صراحةً إلى مصطلح عقائدي تفسيري.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وكريمة النبرة، مع الحفاظ على التوازي الشعري بين «الرِّداء» و«الثوب»، وعلى المقابلة بين تغيّر الخليقة وثبات المخاطَب.
