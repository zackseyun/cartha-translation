  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: ar
  text: منذ زمن بعيد، كلَّم الله الآباءَ في أجزاء كثيرة[a] وبطرائق كثيرة، بواسطة الأنبياء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في أقسام كثيرة»؛ فاللفظ اليوناني يختلف عن «بطرائق كثيرة»، ويشير إلى تعدد أجزاء الإعلان السابق، إلى جانب تنوع أساليبه.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من خلال الأنبياء»؛ وحرفيًا: «في الأنبياء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: بأجزاء كثيرة
  rationale: يحفظ معنى تعدد الأجزاء أو المقاطع في الإعلان السابق، ويميّزه عن تعدد طرائق الكلام الذي تعبّر عنه الكلمة التالية.
- source_word: πολυτρόπως
  choice: بطرائق كثيرة
  rationale: تدل على تنوع الأساليب والوسائل، وهذه صياغة عربية واضحة تحافظ على موازاتها مع «بأجزاء كثيرة» من غير دمج المعنيين.
- source_word: πάλαι
  choice: منذ زمن بعيد
  rationale: تؤدي معنى الزمن الماضي البعيد بلغة عربية معاصرة كريمة.
- source_word: ὁ θεὸς
  choice: الله
  rationale: نقل مباشر للفاعل في النص اليوناني.
- source_word: λαλήσας
  choice: كلَّم
  rationale: صيغ اسم الفاعل اليوناني هنا بفعل ماضٍ عربي واضح، مع بقاء علاقته الزمنية والمقابلة التي تكتمل في العدد التالي.
- source_word: τοῖς πατράσιν
  choice: الآباء
  rationale: يحفظ اللفظ المذكر والتعبير التاريخي العهدي في الأصل، من غير إضافة ضمير «نا» غير الموجود في اليونانية.
- source_word: ἐν τοῖς προφήταις
  choice: بالأنبياء
  rationale: تنقل الباء الدلالة الوسيلية المحتملة لحرف الجر ἐν بإيجاز، مع إبقاء الله هو المتكلم والأنبياء وسائط كلامه.
theological_decisions:
- issue: صياغة اسم الفاعل λαλήσας وصلته بعبرانيين 1:2
  choice: استعمال الفعل الماضي «كلَّم» في العدد الأول مع إبقاء التباين الزمني مفتوحًا للعدد التالي.
  alternative: 'صياغة أكثر حرفية: «إذ كلَّم الله الآباء...» أو «الله، بعدما كلَّم الآباء...»'
  rationale: اسم الفاعل اليوناني يتصل نحويًا بالفعل الرئيس في العدد الثاني، لكن ترجمة العدد منفردًا بصيغة اسمية قد تبدو معلقة. الفعل الماضي يوضح العربية من غير إضافة تفسير عقائدي أو إلغاء المقابلة مع الكلام في الابن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. حُفظ التوازي البلاغي بين تعدد الأجزاء وتعدد الطرائق، كما حُفظ لفظ «الآباء» لقربه من الأصل. لم توضع حاشية لـ«الآباء» لأن البديل التفسيري «الأسلاف» غير لازم لفهم النص العربي، بينما أُثبتت علامتا الحاشيتين [a] و[b] في المتن.
