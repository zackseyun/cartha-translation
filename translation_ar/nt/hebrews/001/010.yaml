  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: ar
  text: 'وأيضًا: «أنت يا رب، في البدء[a] أسَّستَ الأرض، والسماوات هي أعمال يديك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عند البدء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: وأيضًا
  rationale: تُدخل اقتباسًا إضافيًا في سلسلة الاقتباسات؛ و«وأيضًا» تُظهر الصلة والإضافة بوضوح في العربية.
- source_word: Σὺ
  choice: أنت
  rationale: الضمير مصرَّح به للتوكيد في اليونانية، فحُفظ في مطلع الخطاب المباشر.
- source_word: κατ’ ἀρχάς
  choice: في البدء
  rationale: تعبير زمني يدل على البداية أو الأصل، و«في البدء» طبيعي ورصين في سياق الخلق، مع بقاء «عند البدء» بديلًا ممكنًا.
- source_word: κύριε
  choice: يا رب
  rationale: صيغة نداء من κύριος، وتؤديها العربية طبيعيًا بإدخال أداة النداء.
- source_word: τὴν γῆν
  choice: الأرض
  rationale: اقترانها بالسماوات في سياق الخلق يدل على الأرض، لا على إقليم بعينه.
- source_word: ἐθεμελίωσας
  choice: أسَّستَ
  rationale: يحفظ معنى وضع الأساس بصياغة عربية موجزة وطبيعية، من غير إضعاف للصورة المعمارية.
- source_word: ἔργα τῶν χειρῶν σού
  choice: أعمال يديك
  rationale: يحفظ الصورة الحسية في النص، حيث تُنسب السماوات إلى عمل يدي المخاطَب.
- source_word: οἱ οὐρανοί
  choice: السماوات
  rationale: يحفظ صيغة الجمع ولغة الخلق الكتابية في موازاة الأرض.
theological_decisions:
- issue: تطبيق خطاب المزمور الموجَّه إلى الرب على الابن في سياق عبرانيين 1
  choice: الإبقاء على الخطاب المباشر «أنت يا رب» بلا تخفيف
  alternative: صياغة أكثر حيادًا تقلل القوة المسيحانية للاقتباس
  rationale: النص اليوناني يشتمل صراحة على κύριε في خطاب مباشر، وسياق الرسالة يورد هذا القول عن الابن؛ لذا ينبغي حفظ ذلك من غير إضافة تفسير عقائدي إلى النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «وأيضًا» لربط الاقتباس بما قبله، وحُفظت صورة «أعمال يديك» وصيغة الجمع «السماوات». وُضع مؤشر الحاشية بعد الاقتباس كله، والحاشية تبيّن البديل الدلالي لعبارة κατ’ ἀρχάς.
