  text: They will perish[a], but you remain; and they all will wear out like a garment[b],
translation:
  language: ar
  text: أمّا هي فستزول، وأنت تبقى؛ وستبلى كلّها كالثوب[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تستعيد هذه الصورة مزمور 102:‏25–27، فتقابل بين زوال الخليقة وثبات المخاطَب الدائم.
