  source_fidelity: 'الترجمة أمينة للنص اليوناني: «فستزول» تنقل ἀπολοῦνται دون افتراض آلية للزوال، و«وأنت تبقى» تحفظ المقابلة والخطاب المباشر في σὺ δὲ διαμένεις، و«ستبلى كلّها كالثوب» تؤدي صورة πάντες ὡς ἱμάτιον παλαιωθήσονται بوضوح. استعمال المفرد المؤنث مع غير العاقل في «هي» و«كلّها» عربي سليم مع عودة المرجع إلى السماوات والأرض المذكورتين سابقًا.'
