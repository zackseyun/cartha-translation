lexical_decisions:
- source_word: αὐτοὶ
  choice: أمّا هي
  rationale: يعود الضمير إلى السماوات والأرض في الآية السابقة. وتُبرز صيغة «أمّا... وأنت» المقابلة التي يفيدها ورود الضمير صراحةً وترتيبه في اليونانية.
- source_word: ἀπολοῦνται
  choice: فستزول
  rationale: ينقل معنى الانتهاء والفناء من غير أن يوحي بالضرورة بفاعل خارجي مذكور، وهو ملائم للحديث عن السماوات والأرض.
- source_word: σὺ δὲ
  choice: وأنت
  rationale: يحافظ على الخطاب المباشر وعلى المقابلة القوية بين زوال الخليقة وبقاء المخاطَب، مع سلاسة العبارة العربية بعد «أمّا هي».
- source_word: διαμένεις
  choice: تبقى
  rationale: يفيد الاستمرار والثبات، ويقابل زوال المخلوقات بوضوح.
- source_word: πάντες
  choice: كلّها
  rationale: يعود إلى مجموع الأشياء المخلوقة المذكورة سابقًا، واستُعمل ضمير غير العاقل المفرد في العربية موافقةً للاستعمال الطبيعي.
- source_word: ὡς ἱμάτιον
  choice: كالثوب
  rationale: «الثوب» لفظ عربي واضح وعام يحفظ صورة التشبيه من غير تخصيص نوع بعينه من اللباس.
- source_word: παλαιωθήσονται
  choice: ستبلى
  rationale: يعني الفعل أن تصير قديمة أو بالية؛ و«تبلى» تنقل أثر التقادم بوضوح وتحافظ على صورة الثوب.
theological_decisions:
- issue: هوية المخاطَب والدلالة المسيحانية
  choice: 'الإبقاء على الخطاب المباشر: «وأنت تبقى»'
  alternative: تحويل العبارة إلى خبر بضمير الغائب أو إضافة تفسير صريح لهوية المخاطَب
  rationale: سياق عبرانيين 1 يوجّه الاقتباس إلى الابن. ويحفظ الخطاب بضمير المخاطب تطبيق النص عليه من غير إدخال شرح عقائدي غير ملفوظ به.
- issue: المقابلة بين فناء الخليقة ودوام المخاطَب
  choice: «فستزول، وأنت تبقى»
  alternative: «ستهلك، لكنك تدوم»
  rationale: تحفظ الصياغة التوتر المقصود بين زوال النظام المخلوق وثبات المخاطَب، من غير تحديد كيفية الزوال أو إضافة فاعل له.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعملت «تزول» لتجنب الإيحاء بآلية هلاك محددة، و«تبلى» لصون استعارة الثوب بصورة طبيعية. وُضع مؤشر الحاشية بعد التشبيه الذي تشرحه.
