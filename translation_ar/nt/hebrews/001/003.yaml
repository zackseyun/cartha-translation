  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: ar
  text: وهو إشعاع مجده، والأثر المطبوع المطابق تمامًا لكيانه[a]، ويسند جميع الأشياء بكلمة قدرته، وبعد أن أجرى تطهيرًا من الخطايا بواسطته هو[b]، جلس عن يمين العظمة في الأعالي[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة: «الطابع الدقيق لجوهره/حقيقته». وتشير العبارة إلى أثر الختم المطابق للأصل.'
    reason: lexical_alternative
  - marker: b
    text: تتضمن قراءة SBLGNT عبارة «بواسطته هو». وتغيب هذه العبارة عن بعض المخطوطات، ولذلك تحذفها بعض الترجمات.
    reason: textual_variant
  - marker: c
    text: 'أو: «في العلى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: إشعاع
  rationale: ينقل صورة النور المنبعث والبهاء الصادر، من غير أن يوحي بأنه مجرد انعكاس خارجي.
- source_word: δόξα
  choice: مجد
  rationale: هو المقابل العربي المألوف الذي يحفظ دلالة الجلال الإلهي.
- source_word: χαρακτήρ
  choice: الصورة المطابقة تمامًا
  rationale: يعبّر بوضوح عن التطابق الدقيق الذي تدل عليه صورة الختم أو الأثر المطبوع، مع تجنب لفظ عربي غامض أو غير طبيعي.
- source_word: ὑπόστασις
  choice: كيانه
  rationale: يحفظ معنى الحقيقة القائمة أو الوجود الفعلي، من غير فرض المصطلحات الميتافيزيقية اللاحقة مثل «الجوهر» على المتن.
- source_word: φέρων
  choice: يسند
  rationale: يدل على الفعل المستمر الذي به تبقى الأشياء قائمة، ويحفظ في الوقت نفسه صورة الحمل والإمساك الموجودة في اليونانية.
- source_word: τὰ πάντα
  choice: الأشياء كلها
  rationale: يحفظ شمول العبارة اليونانية من غير قصرها على الكون المادي وحده.
- source_word: ῥῆμα
  choice: كلمة
  rationale: يحفظ دلالة القول الفعّال، ولا يضيّقها إلى معنى «الأمر» وحده.
- source_word: δύναμις
  choice: قدرة
  rationale: تعبير عربي واضح ومباشر عن القوة الفاعلة في هذا السياق.
- source_word: δι’ αὑτοῦ
  choice: بذاته
  rationale: صياغة عربية موجزة وطبيعية تدل على أن التطهير تحقق بواسطته هو؛ وتوضح الحاشية اختلاف الشواهد النصية.
- source_word: καθαρισμὸν
  choice: تطهيرًا
  rationale: يحفظ الخلفية الطقسية والذبائحية بصورة أوضح من لفظ عام مثل «تنظيف».
- source_word: τῶν ἁμαρτιῶν
  choice: من الخطايا
  rationale: تعبير عربي طبيعي يفيد التطهير المتعلق بالخطايا وإزالتها، من غير زيادة تفسير عقائدي.
- source_word: ποιησάμενος
  choice: بعد أن أتمّ
  rationale: يبيّن أن فعل التطهير سبق الجلوس، كما يقتضيه التركيب بالسياق.
- source_word: ἐν δεξιᾷ
  choice: عن يمين
  rationale: هو التعبير العربي الاصطلاحي الطبيعي للمكانة والموضع المذكورين في النص.
- source_word: ἐν ὑψηλοῖς
  choice: في الأعالي
  rationale: يحافظ على صيغة الجمع المكانية في اليونانية وعلى الأسلوب الكتابي المهيب.
theological_decisions:
- issue: دلالة ὑπόστασις في نص أساسي في صياغة العقيدة المسيحية اللاحقة
  choice: كيانه
  alternative: جوهره، طبيعته، حقيقته
  rationale: يحفظ قوة العبارة الوجودية من غير أن يحوّل الترجمة إلى مصطلح مجمعي تقني نشأ لاحقًا.
- issue: القوة المسيحانية لعبارتي ἀπαύγασμα وχαρακτήρ
  choice: إشعاع مجده، والصورة المطابقة تمامًا لكيانه
  alternative: انعكاس مجده، وتمثيل كيانه
  rationale: تتجنب الصياغة إضعاف النص إلى مجرد انعكاس أو تمثيل خارجي، لكنها لا تضيف تقريرًا لاهوتيًا يتجاوز الألفاظ اليونانية.
- issue: الاختلاف النصي في δι’ αὑτοῦ
  choice: إثبات «بذاته» في المتن
  alternative: حذف العبارة
  rationale: أُثبتت العبارة لأن نص SBLGNT المعطى يتضمنها، مع بيان اختلاف المخطوطات في الحاشية.
- issue: هوية مرجع الضمائر في «مجده» و«كيانه» و«قدرته»
  choice: الإبقاء على الضمائر كما في اليونانية
  alternative: استبدالها صراحةً بلفظ «الله» أو «الابن»
  rationale: يحافظ ذلك على ترابط الجملة مع سياقها وعلى مقدار التصريح الموجود في الأصل، من غير إزالة ما يعتمد فهمه على الآيات السابقة.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. روعي إيقاع الجملة الطويلة مع تقسيمها بعلامة توقف لتسهيل القراءة، من غير قطع الصلات النحوية والمنطقية في الأصل. استُخدمت ألفاظ مفهومة للعامة مع شرح الصورة الطباعية والمصطلح الوجودي في الحاشية.
