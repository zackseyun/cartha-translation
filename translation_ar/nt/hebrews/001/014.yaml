  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: ar
  text: أليسوا جميعًا أرواحًا خادمة، تُرسَل للخدمة من أجل الذين سيَرِثون الخلاص؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين هم مزمعون أن يرثوا الخلاص». تحمل العبارة اليونانية معنى متجهًا إلى المستقبل، وقد توحي أيضًا بالتوقع أو المقاربة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: أليسوا
  rationale: ينقل الاستفهام الإنكاري الذي يتوقع جوابًا بالإيجاب، بصياغة عربية طبيعية.
- source_word: πάντες
  choice: جميعًا
  rationale: يحفظ الشمول الصريح في النص اليوناني، وإحالة الضمير مفهومة من سياق الملائكة.
- source_word: λειτουργικὰ πνεύματα
  choice: أرواحًا خادمة
  rationale: يجمع بين معنى الكائنات الروحية ومعنى الخدمة، من غير أن يوحي بمنصب كنسي محدد أو يحصر اللفظ في الطقس الديني.
- source_word: εἰς διακονίαν
  choice: للخدمة
  rationale: ينقل دلالة الغاية ويحافظ على الصيغة الاسمية الموازية للأصل بعبارة عربية واضحة.
- source_word: ἀποστελλόμενα
  choice: تُرسَل
  rationale: يحفظ المبني للمجهول ووظيفة اسم المفعول الوصفية، وتفيد صيغة المضارع الإرسال بوصفه دورًا قائمًا أو متكررًا.
- source_word: διὰ
  choice: من أجل
  rationale: ينقل المعنى الغائي أو النفعي هنا من غير الإفراط في تحديد العلاقة.
- source_word: τοὺς μέλλοντας
  choice: الذين سيَرِثون
  rationale: يعبّر عن التوجه المستقبلي الطبيعي للتركيب؛ أما إيحاء المقاربة الزمنية المحتمل فيُذكر في الحاشية لأن «على وشك» قد يوهم قربًا زمنيًا أشد مما يقتضيه السياق الأخروي.
- source_word: κληρονομεῖν
  choice: يَرِثون
  rationale: يحفظ صورة الميراث المهمة في الرسالة بلفظ عربي مباشر ومألوف.
- source_word: σωτηρίαν
  choice: الخلاص
  rationale: المقابل العربي المستقر الذي يلائم البعد الأخروي في السياق من غير حصر معنى الخلاص في جانب واحد.
theological_decisions:
- issue: دلالة μέλλοντας κληρονομεῖν σωτηρίαν
  choice: الذين سيَرِثون الخلاص
  alternative: الذين هم مزمعون أن يرثوا الخلاص / الذين هم على وشك أن يرثوا الخلاص
  rationale: تحفظ الصياغة الاتجاه المستقبلي وصورة الميراث، من غير أن تضيف معنى التعيين المسبق أو تحسم مسألة لاهوتية تتجاوز النص. وتوضح الحاشية إمكان إبراز معنى التوقع أو القرب في μέλλω.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة. حُفظ الاستفهام الإنكاري، والمبني للمجهول، وصورة الميراث، مع تجنب الألفاظ الكنسية الاصطلاحية غير اللازمة.
