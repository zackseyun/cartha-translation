language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: ar
  text: 'فَلِأَيٍّ مِنَ الْمَلَائِكَةِ قَالَ يَوْمًا[a]: «أَنْتَ ابْنِي، أَنَا الْيَوْمَ وَلَدْتُكَ[b]»؟ وَقَالَ أَيْضًا: «أَنَا أَكُونُ لَهُ أَبًا[c]، وَهُوَ يَكُونُ لِي ابْنًا»؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على نحو أكثر حرفية: «قال في أي وقت».'
    reason: lexical_alternative
  - marker: b
    text: تقتبس العبارة مزمور 2:7. وقد فُهمت في صلة بالتنصيب الملكي، أو القيامة، أو علاقة الابن الأزلية بالآب؛ وتُبقي الترجمة ألفاظ النص من غير أن تحسم بين هذه التفسيرات.
    reason: cross_reference
  - marker: c
    text: 'اقتباس من 2 صموئيل 7:14. ويمكن التعبير عنه بأسلوب أكثر تداولًا: «أكون أباه، ويكون ابني».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι ... τῶν ἀγγέλων
  choice: لِأَيِّ وَاحِدٍ مِنَ الْمَلَائِكَةِ
  rationale: يحافظ على الاستفهام مع معنى التبعيض في «من الملائكة»، ويأتي عربيًّا واضحًا وطبيعيًّا.
- source_word: γὰρ
  choice: فَـ
  rationale: تُبقي الصلة التفسيرية بالحجة السابقة من غير إثقال العبارة.
- source_word: εἶπέν ποτε
  choice: قَالَ قَطُّ
  rationale: ينقل قوة السؤال الإنكاري ومعنى وقوع القول في أي وقت، مع صياغة عربية موجزة.
- source_word: ἀγγέλων
  choice: الْمَلَائِكَةِ
  rationale: السياق في عبرانيين 1 يتحدث عن الكائنات السماوية، لا عن رسل بشريين.
- source_word: Υἱός μου εἶ σύ
  choice: أَنْتَ ابْنِي
  rationale: صياغة عربية مباشرة تحفظ المخاطبة وعلاقة البنوة من غير إضافة تفسيرية.
- source_word: σήμερον
  choice: الْيَوْمَ
  rationale: ينقل الظرف الزمني كما هو من غير إعادة تفسير.
- source_word: γεγέννηκά σε
  choice: وَلَدْتُكَ
  rationale: يحفظ صورة الولادة في اقتباس مزمور 2:7 ولا يحسم دلالتها باعتبارها ولادة جسدية أو تنصيبًا ملكيًّا أو قيامة أو علاقة أزلية.
- source_word: καὶ πάλιν
  choice: وَقَالَ أَيْضًا
  rationale: يوضح طبيعيًّا بالعربية أن الكاتب يقدم اقتباسًا كتابيًّا آخر، مع إبقاء فعل القول المفهوم من السياق اليوناني.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: أَنَا أَكُونُ لَهُ أَبًا
  rationale: يحافظ على البناء الرسمي «أكون له أبًا» وعلى نبرة صيغة العهد في الاقتباس.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: وَهُوَ يَكُونُ لِي ابْنًا
  rationale: يحفظ التوازي مع الشطر السابق والبناء الدال على العلاقة المتبادلة.
theological_decisions:
- issue: دلالة «وَلَدْتُكَ» في الاقتباس من مزمور 2:7
  choice: الإبقاء على لفظ الولادة من غير تحديد المقصود اللاهوتي في نص الآية
  alternative: تفسير العبارة صراحةً بالتنصيب الملكي، أو القيامة، أو العلاقة الأزلية بين الابن والآب
  rationale: النص نفسه يورد صيغة المزمور ضمن حجة مسيانية، لكنه لا يفصل في هذه الآية وحدها بين الأوجه التفسيرية؛ لذلك تحفظ الترجمة التوتر والدلالة المفتوحة.
- issue: صيغة البنوة في الاقتباسين
  choice: ترجمة υἱός في الموضعين بـ«ابن» من غير فروق طباعية تفسيرية
  alternative: إبراز أحد الموضعين طباعيًّا أو إضافة لقب تفسيري يصرح بالهوية المسيانية
  rationale: العربية لا تستخدم الحرف الكبير للتمييز بين اللقب والاسم العام؛ والسياق يبين أن الاقتباسين مطبقان على الابن، فلا حاجة إلى إدخال تمييز لا يتيحه رسم اللغة المصدر.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة وموقرة. استُخدم «قال قط» لقوة الاستفهام الإنكاري، وحُفظ التوازي الرسمي «أكون له أبًا... يكون لي ابنًا» لأنه يعكس صيغة الاقتباس العهدية. وُضعت جميع علامات الحواشي في المتن عند العبارات المعنية.
