translation:
  language: ar
  text: إذ صار أسمى من الملائكة بقدر ما ورث اسمًا أرفع من أسمائهم.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أفضل من الملائكة ... اسمًا أمجد من أسمائهم».'
    reason: lexical_alternative
  - marker: b
    text: يتضح من السياق التالي أن «الاسم» مرتبط بكونه الابن وبالمقام الذي يدل عليه هذا الاسم.
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: بقدر ما
  rationale: تنقل صيغة المقارنة التناسبية بين سموّ مكانته ورفعة الاسم الذي ورثه، بعبارة عربية طبيعية موجزة.
- source_word: κρείττων
  choice: أسمى
  rationale: تدل هنا على التفوق في المقام والرتبة قياسًا إلى الملائكة، ولا توحي بمجرد الأفضلية الأخلاقية.
- source_word: γενόμενος
  choice: صائرًا
  rationale: تحافظ على معنى الصيرورة في اسم الفاعل اليوناني من غير أن توحي بأن الابن مخلوق، وتبقي صلته بسياق التمجيد مفتوحة.
- source_word: τῶν ἀγγέλων
  choice: من الملائكة
  rationale: صياغة عربية سليمة للمقارنة التي يعبر عنها اليوناني بالمضاف إليه بعد اسم التفضيل.
- source_word: διαφορώτερον
  choice: أرفع
  rationale: تنقل معنى التفوق والتميّز في هذا السياق، وتلائم الحديث عن الاسم والمقام.
- source_word: παρ’ αὐτοὺς
  choice: من أسمائهم
  rationale: يقتضي الأسلوب العربي إظهار طرف المقارنة المقصود، أي الاسم المنسوب إلى الملائكة؛ وجاء الجمع طبيعيًا من غير حسم ماهية الاسم.
- source_word: κεκληρονόμηκεν
  choice: ورث
  rationale: ينقل معنى نيل الشيء ميراثًا. وتدل نتيجة الفعل الباقية من السياق والتركيب، وإن لم يمكن تمثيل تمام دلالة الزمن التام اليوناني بصيغة عربية مستقلة طبيعية هنا.
- source_word: ὄνομα
  choice: اسمًا
  rationale: أُبقي التنكير الموافق لغياب أداة التعريف في اليونانية، مع ترك السياق التالي يوضح الاسم المقصود بدل استباقه في الترجمة.
theological_decisions:
- issue: الدلالة المسيحانية لصيغة γενόμενος
  choice: ترجمتها «صائرًا» كما هي، في إطار تفوق الابن الظاهر في السياق، من غير تفسير ماهوي مضاف.
  alternative: «إذ جُعل» أو صياغة تتجنب معنى الصيرورة تمامًا.
  rationale: النص يصرّح بالصيرورة، فينبغي حفظها؛ أما حملها على الخلق أو على تحوّل الابن إلى الألوهية فليس واردًا في العبارة نفسها، كما أن ترجمتها بالمبني للمجهول تضيف فاعلية غير مصرّح بها.
- issue: المقصود بـ«الاسم»
  choice: الإبقاء على لفظ «اسمًا»، مع بيان أن السياق اللاحق يربطه ببنوّة الابن ومرتبته.
  alternative: التصريح في المتن بـ«لقب الابن» أو تعميمه إلى «المقام والكرامة».
  rationale: الآية نفسها لا تسمّي الاسم، والاقتباسات التالية هي التي توضحه؛ لذلك يحفظ اللفظ الحرفي التدرج الأدبي والغموض المقصود.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. استُخدمت «أسمى/أرفع» لإبراز مقارنة الرتبة، وحُفظ تركيب المقارنة التناسبية من غير إثقال. وُضعت علامتا الحاشيتين في المتن كما هو مطلوب.
