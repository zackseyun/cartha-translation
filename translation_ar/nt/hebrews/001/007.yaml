id: HEB.1.7
reference: Hebrews 1:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: ar
  text: 'وأمّا عن الملائكة فيقول: «يجعل ملائكته رياحًا[a]، وخُدّامه لهيبَ نارٍ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أرواحًا»؛ فالكلمة اليونانية قد تعني «رياحًا» أو «أرواحًا».
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: وأمّا عن الملائكة
  rationale: تفيد العبارة هنا موضوع الكلام مع إبراز المقابلة التي يمهّد لها μέν؛ والاقتباس يتحدث عن الملائكة لا إليهم.
- source_word: λέγει
  choice: فيقول
  rationale: حُفظ المضارع في صيغة الاستشهاد الكتابي، وأضيفت الفاء العربية لربط القول بما قبله ربطًا طبيعيًا.
- source_word: Ὁ ποιῶν
  choice: يجعل
  rationale: ينقل الفعل معنى التصيير بصورة موجزة وطبيعية، وهو أنسب من تركيب اسمي ثقيل مثل «الذي يجعل».
- source_word: ἀγγέλους
  choice: ملائكته
  rationale: السياق في عبرانيين 1 يتناول الكائنات السماوية، كما أن الضمير αὐτοῦ يقتضي صيغة الملكية.
- source_word: πνεύματα
  choice: رياحًا
  rationale: يمكن أن تعني الكلمة «رياحًا» أو «أرواحًا». واختيار «رياحًا» يلائم خلفية المزمور والصورة الشعرية الموازية «لهيب نار»، مع حفظ البديل في الحاشية.
- source_word: λειτουργοὺς αὐτοῦ
  choice: خُدّامه
  rationale: تدل λειτουργοί على القائمين بالخدمة، وقد اختيرت «خُدّام» لأنها فصيحة مفهومة وتحفظ معنى الخدمة دون الإيحاء بمنصب كنسي لاحق.
- source_word: πυρὸς φλόγα
  choice: لهيبَ نارٍ
  rationale: يحفظ هذا التعبير المفرد والصورة الشعرية في الأصل بصياغة عربية طبيعية.
theological_decisions:
- issue: دلالة πνεύματα في الاقتباس من المزمور 104:4
  choice: رياحًا
  alternative: أرواحًا
  rationale: اللفظة اليونانية تحتمل المعنيين حقًا. «رياحًا» أنسب للسياق الشعري ولخلفية النص العبري، لكن وضع «أرواحًا» في الحاشية يصون الغموض الدلالي ولا يحسم المسألة لاهوتيًا دون مسوغ.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «وأمّا» لإظهار المقابلة في μέν، و«خُدّامه» للحفاظ على النبرة الرفيعة من غير استيراد دلالة اصطلاحية كنسية.
