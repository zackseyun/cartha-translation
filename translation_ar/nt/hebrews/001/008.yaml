base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: ar
  text: 'أَمَّا عَنِ الابْنِ فَيَقُولُ: «عَرْشُكَ، يَا اللهُ[a]، إِلَى أَبَدِ الآبِدِينَ، وَصَوْلَجَانُ الاسْتِقَامَةِ[b] هُوَ صَوْلَجَانُ مَلَكُوتِكَ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على وجه أقل ترجيحًا: «اللهُ هو عَرْشُكَ إِلَى أَبَدِ الآبِدِينَ». يحتمل التركيب اليوناني هذا الفهم، لكن النداء «عَرْشُكَ، يَا اللهُ» أنسب للسياق ولقوة الاقتباس.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «صَوْلَجَانُ البِرِّ». يمكن أن تدل الكلمة اليونانية على الاستقامة أو النزاهة الخُلُقية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: أَمَّا عَنِ الابْنِ فَيَقُولُ
  rationale: تُبرز «أمّا» المقابلة مع الكلام السابق عن الملائكة، وتنقل «عن الابن» القوة المرجعية لحرف الجر πρός مع إظهار فعل القول المفهوم من السياق.
- source_word: υἱόν
  choice: الابْنِ
  rationale: التعريف في اليونانية يدل على الاستعمال اللقبي المحدد، ويحفظ المقابلة المسيحانية في السياق.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: عَرْشُكَ، يَا اللهُ
  rationale: تُفهم «ὁ θεός» هنا على أنها نداء، وهو الأرجح في سياق الاقتباس وحجة الرسالة، مع إبقاء الوجه النحوي الآخر في حاشية.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: إِلَى أَبَدِ الآبِدِينَ
  rationale: تعبير عربي كتابي واضح ينقل دلالة الدوام والتوكيد في الاصطلاح اليوناني.
- source_word: ῥάβδος
  choice: صَوْلَجَانُ
  rationale: السياق ملوكي، فالمقصود شارة السلطان والحكم لا مجرد عصا أو قضيب.
- source_word: τῆς εὐθύτητος
  choice: الاسْتِقَامَةِ
  rationale: تنقل المعنى المباشر للكلمة، أي الاستقامة والاعتدال، من غير اختزالها في مصطلح لاهوتي أضيق.
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: صَوْلَجَانُ مَلَكُوتِكَ
  rationale: تحفظ الصورة الملكية والبنية الإضافية في الأصل، وتؤدي βασιλεία بمعنى الملكوت أو السلطان الملكي.
theological_decisions:
- issue: هل «ὁ θεός» نداء للابن بوصفه الله، أم خبر بمعنى «الله عرشك»؟
  choice: 'النداء المباشر: «عَرْشُكَ، يَا اللهُ»'
  alternative: «اللهُ عَرْشُكَ إِلَى أَبَدِ الآبِدِينَ»
  rationale: النداء أنسب لتتابع الحجة في عبرانيين 1 ولقوة الاقتباس الموجَّه إلى الابن، لكنه لا يلغي الإمكان النحوي الآخر، ولذلك ذُكر في الحاشية بدل طمسه.
translation_notes:
  register: عربية فصحى معاصرة ذات نبرة كتابية مهيبة وواضحة. استُعمل «صولجان» حفاظًا على الصورة الملكية، و«إلى أبد الآبدين» لنقل الصيغة الاصطلاحية المؤكِّدة للدوام. وُضعت علامتا الحاشية في المتن عند القضيتين اللتين تشرحهما كل حاشية.
