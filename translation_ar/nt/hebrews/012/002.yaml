reference: Hebrews 12:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: ar
  text: مُثَبِّتينَ أنظارَنا على يسوعَ[a]، رائدِ الإيمانِ ومُكمِّلِه، الذي من أجل الفرح الموضوع أمامه تحمَّل الصليب، مستهينًا بالخزي[b]، وقد جلس عن يمين عرش الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «رائد الأمانة ومُكمِّلها»، أو «رائد إيماننا ومُكمِّله». فالعبارة اليونانية موجزة، ويمكن أن تدل πίστις على «الأمانة»، أو أن تشير تحديدًا إلى إيمان المؤمنين.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «غير عابئ بالخزي». والمعنى أنه لم يجعل عار الصلب أمرًا يحكم موقفه أو يثنيه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες
  choice: مُثَبِّتينَ أنظارَنا على
  rationale: ينقل توجيه الانتباه المركّز بعيدًا عن المشتتات نحو يسوع، ويلائم صورة السباق في السياق.
- source_word: ἀρχηγὸν
  choice: رائد
  rationale: يجمع معنى الابتداء والسبق في شق الطريق، وهو أنسب من «مؤلف» في سياق السباق والاقتداء.
- source_word: τελειωτὴν
  choice: مُكمِّل
  rationale: يدل على من يبلغ بالشيء غايته وتمامه، ويحافظ على التوازي مع «رائد».
- source_word: τῆς πίστεως
  choice: الإيمان
  rationale: يحافظ على العبارة اليونانية الموجزة من دون إضافة ضمير غير ملفوظ، مع إبقاء احتمال «الأمانة» أو «إيماننا» في الحاشية.
- source_word: ἀντὶ
  choice: من أجل
  rationale: يفيد أن الفرح الموضوع أمامه كان الغاية المحفزة على الاحتمال؛ أما معنى «بدلًا من» فممكن معجميًا لكنه أقل ملاءمة للسياق.
- source_word: προκειμένης αὐτῷ χαρᾶς
  choice: الفرح الموضوع أمامه
  rationale: يحفظ صورة غاية موضوعة أمام الشخص، بما ينسجم مع سياق السباق.
- source_word: ὑπέμεινεν
  choice: تحمَّل
  rationale: يعبر بوضوح عن الثبات تحت الألم والمعاناة.
- source_word: σταυρὸν
  choice: الصليب
  rationale: المرجع محدد سياقيًا، أي صلب يسوع، ولذلك تلائم العربية أداة التعريف.
- source_word: αἰσχύνης καταφρονήσας
  choice: مستهينًا بالخزي
  rationale: يفيد أنه عدّ عار الصلب غير جدير بأن يثنيه، من دون الإيحاء بأن الخزي في ذاته أمر حسن.
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ
  choice: عن يمين عرش الله
  rationale: تعبير عربي طبيعي يحفظ صورة مقام الكرامة والسلطان.
- source_word: κεκάθικεν
  choice: قد جلس
  rationale: ينقل الفعل التام بوصفه حدثًا اكتمل وله نتيجة باقية، مع صياغة عربية سليمة.
theological_decisions:
- issue: دلالة τῆς πίστεως مع ἀρχηγὸν καὶ τελειωτὴν
  choice: يسوع هو «رائد الإيمان ومُكمِّله»، من دون إضافة «إيماننا».
  alternative: «رائد الأمانة ومُكمِّلها» أو «رائد إيماننا ومُكمِّله».
  rationale: التركيب اليوناني موجز ويحتمل الإيمان بوصفه إيمان المؤمنين، أو الأمانة والثبات اللذين جسدهما يسوع. أبقى المتن اللفظ الأوسع، وتعرض الحاشية الاحتمالات من غير حسم مذهبي.
- issue: قوة ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: تحمّل يسوع الصليب من أجل الفرح الموضوع أمامه، أي ناظرًا إلى الفرح المرتقب.
  alternative: تحمّل الصليب بدلًا من الفرح الموضوع أمامه.
  rationale: مع أن ἀντί قد تعني «بدلًا من»، فإن سياق الاحتمال والسعي إلى الغاية يرجح معنى الدافع المرتقب، مع بقاء الاحتمال الآخر ممكنًا معجميًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «مُثَبِّتين أنظارنا» لصون قوة التركيز، و«رائد» لتجنب الإيحاء الأدبي في «مؤلف»، و«مُكمِّل» للدلالة على بلوغ الغاية. أُبقيت مواضع الالتباس الحقيقي في الحواشي.
