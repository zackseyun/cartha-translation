source:
  edition: SBLGNT
  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: ar
  text: اثبتوا لأجل التأديب[a]؛ فإن الله يعاملكم كالبنين[b]. فأيُّ ابنٍ لا يؤدِّبه أب؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «احتملوا ما تعانونه بوصفه تأديبًا». يمكن فهم العبارة اليونانية إما حثًّا على الثبات لأجل التأديب، وإما دعوة إلى اعتبار ما يُحتمل تأديبًا.'
    reason: alternative_reading
  - marker: b
    text: 'اليونانية: «بنين». تعكس الكلمة تشبيه الأب بالبنين في سياق الحجة، لكن التطبيق لا يقتصر على الذكور.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: لأجل التأديب
  rationale: يحافظ هذا التعبير على الدلالة الغائية أو النتيجية المحتملة لحرف الجر εἰς، ويربط الثبات بتأديب الله التربوي من غير أن يضيف مفعولًا غير مذكور.
- source_word: ὑπομένετε
  choice: اثبتوا
  rationale: الصيغة يمكن من حيث الشكل أن تكون خبرية أو أمرية، لكن السياق يرجّح الحث. و«اثبتوا» عربية طبيعية تعبّر عن احتمال المشقة والمداومة من غير إضافة «هذا» إلى النص.
- source_word: παιδείαν / παιδεύει
  choice: التأديب / يؤدِّبه
  rationale: «التأديب» يجمع هنا معنى التربية والتقويم، ويحافظ تكراره على الصلة اللفظية بين الاسم والفعل في اليونانية.
- source_word: ὡς υἱοῖς
  choice: كالبنين
  rationale: يحفظ التشبيه العائلي المقصود، حيث يعامل الله المخاطَبين معاملة الأب لبنيه، مع الإبقاء على صورة الأب والابن في الحجة.
- source_word: προσφέρεται
  choice: يعاملكم
  rationale: هذا هو المعنى السياقي الطبيعي للفعل في هذا التركيب؛ أما النقل الحرفي بمعنى «يُقدَّم» فسيكون مضللًا بالعربية.
- source_word: τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ
  choice: فأيُّ ابنٍ لا يؤدِّبه أبوه؟
  rationale: صياغة استفهامية إنكارية طبيعية تحافظ على قوة الحجة. أُضيف الضمير في «أبوه» لأن العربية تستلزمه طبيعيًا لتوضيح العلاقة التي يدل عليها السياق، من غير تغيير المقصود.
theological_decisions:
- issue: اللغة العائلية المذكرة في تشبيه الأب والابن
  choice: الإبقاء على «البنين» و«ابن» في المتن
  alternative: الأولاد / الأبناء بمعنى شامل مصرح به
  rationale: الحجة مبنية صراحة على صورة الأب والابن، ولذلك حُفظت الصورة المذكرة في النص. ويوضح الهامش أن التطبيق موجّه إلى جماعة المؤمنين كلها، لا إلى الذكور وحدهم.
- issue: كيفية فهم εἰς παιδείαν مع ὑπομένετε
  choice: اثبتوا لأجل التأديب
  alternative: احتملوا ما تعانونه بوصفه تأديبًا
  rationale: اليونانية تحتمل حثّ القراء على الثبات لأجل التأديب، كما تحتمل اعتبار ما يحتملونه تأديبًا. اختيرت الصياغة الأولى في المتن مع حفظ الاحتمال الآخر في الهامش، تجنبًا لحسم الغموض الحقيقي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «اثبتوا» بدل تعبير أثقل مثل «داوموا على الاحتمال»، و«يعاملكم» لنقل المعنى الاصطلاحي للفعل. وُضعت علامتا الهامش [a] و[b] في المتن كما يلزم.
