id: HEB.12.28
reference: Hebrews 12:28
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: ar
  text: لذلك، ما دمنا نتلقّى ملكوتًا لا يتزعزع، فلتكن لنا نعمة[a]، بها نعبد الله عبادةً مرضية، بخشوع ومهابة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلنكن شاكرين». يمكن أن تعني العبارة اليونانية «فلتكن لنا نعمة» أو، على نحو اصطلاحي، «فلنكن شاكرين».'
    reason: قراءة بديلة معتبرة للعبارة اليونانية ἔχωμεν χάριν.
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تفيد النتيجة المستخلصة من الكلام السابق عن زعزعة المخلوقات وزوال ما يمكن أن يتزعزع.
- source_word: βασιλείαν ἀσάλευτον
  choice: ملكوتًا لا يتزعزع
  rationale: تحافظ هذه الصياغة على لفظ «الملكوت» وعلى التضاد السياقي بين ما يتزعزع وما لا يتزعزع.
- source_word: παραλαμβάνοντες
  choice: ما دمنا نتلقّى
  rationale: تنقل اسم الفاعل المضارع بوصفه ظرفًا سببيًا مصاحبًا للحث، وتحافظ على دلالة التلقي الجاري دون تحويله إلى حدث ماضٍ مكتمل.
- source_word: ἔχωμεν χάριν
  choice: فلتكن لنا نعمة
  rationale: تحافظ على المعنى المباشر المحتمل لـ χάρις، وعلى صيغة الحث، وتتيح للعبارة التالية «بها» أن تشير إلى النعمة بوصفها الوسيلة. أما معنى الشكر المحتمل فمذكور في الحاشية.
- source_word: δι’ ἧς
  choice: بها
  rationale: تنقل دلالة الوسيلة في διά مع المضاف إليه، ويعود الضمير المؤنث طبيعيًا إلى «نعمة».
- source_word: λατρεύωμεν
  choice: نعبد
  rationale: الفعل في هذا السياق يدل على الخدمة الدينية المقدمة لله؛ و«نعبد» عربية طبيعية تشمل هذا المعنى التعبدي، من غير قصره على شعور باطني.
- source_word: εὐαρέστως τῷ θεῷ
  choice: نعبد الله عبادةً مرضية
  rationale: تنقل كون العبادة مقبولة ومرضية لدى الله، مع تركيب عربي واضح وسلس.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: بخشوع ومهابة
  rationale: «الخشوع» يعبر عن التوقير المتحفّظ، و«المهابة» تحفظ عنصر الرهبة أمام جلال الله من غير أن تحصره في الذعر.
theological_decisions:
- issue: معنى χάριν في العبارة ἔχωμεν χάριν
  choice: نعمة
  alternative: 'شكر؛ أي: فلنكن شاكرين'
  rationale: يمكن أن تدل العبارة على امتلاك النعمة، ويمكن أن تكون تعبيرًا اصطلاحيًا عن الشكر. رُجّح معنى «النعمة» لأن جملة «بها» اللاحقة تصلح طبيعيًا للإشارة إليها باعتبارها وسيلة العبادة المرضية، مع إبقاء القراءة الأخرى في الحاشية حفاظًا على الغموض الحقيقي في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعمل «ملكوت» للمصطلح الكتابي، وصيغت الجملة بإيقاع حثّي طبيعي. أُبقيت عبارة «فلتكن لنا نعمة» رغم أنها أفصح وأقل تداولًا من «فلنكن شاكرين»، لأنها تحفظ الصلة النحوية والدلالية بعبارة «بها» ولا تحسم موضعًا تفسيريًا مختلفًا عليه.
