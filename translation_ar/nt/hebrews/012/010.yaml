  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: ar
  text: فهم كانوا يؤدِّبوننا لأيام قليلة[a]، بحسب ما بدا لهم صوابًا[b]؛ أما هو، فيؤدِّبنا لما فيه منفعتنا، لكي نشترك في قداسته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وقتًا قصيرًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وفق ما رأوه مناسبًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: مدةَ أيام قليلة
  rationale: ينقل التعبير الزمني بصياغة عربية طبيعية، مع إبراز قِصَر مدة تأديب الآباء الأرضيين.
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: بحسب ما بدا لهم صوابًا
  rationale: يحفظ عنصر التقدير الشخصي في δοκοῦν من غير الجزم بأن حكمهم كان صائبًا بالفعل.
- source_word: ἐπαίδευον
  choice: كانوا يؤدِّبوننا
  rationale: «يؤدِّبون» يلائم سياق تربية الأبناء ويشمل التقويم والتدريب، فلا يحصر المعنى في العقوبة.
- source_word: ὁ δὲ
  choice: أما هو فيؤدِّبنا
  rationale: يحافظ على الإحالة الضميرية إلى الله وعلى المقابلة مع الآباء الأرضيين، مع إظهار الفعل المحذوف المفهوم من السياق.
- source_word: ἐπὶ τὸ συμφέρον
  choice: لما فيه منفعتنا
  rationale: يعبّر بوضوح عن الغاية النافعة المقصودة من التأديب الإلهي.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: لكي نشترك في
  rationale: ينقل دلالة الغاية في التركيب ودلالة المشاركة في μεταλαμβάνω.
- source_word: ἁγιότητος αὐτοῦ
  choice: قداسته
  rationale: «القداسة» المقابل العربي الواضح والمألوف لصفة الله المذكورة هنا، والضمير يحفظ صياغة الأصل.
theological_decisions:
- issue: مرجع المفرد المقابل ὁ δὲ
  choice: 'إبقاء المرجع ضميرًا: «أما هو»'
  alternative: 'التصريح بالاسم: «أما الله»'
  rationale: السياق يبيّن أن المرجع هو الله في مقابل الآباء الأرضيين، وإبقاء الضمير يحافظ على ضمنية النص اليوناني من غير إبهام شديد.
- issue: المشاركة في قداسة الله
  choice: «لكي نشترك في قداسته» من غير تحديد آلية هذه المشاركة
  alternative: تفسير العبارة حصرًا بوصفها قداسة وضعية أو تقديسًا تدريجيًا
  rationale: النص يقرر أن غاية التأديب الإلهي هي المشاركة في قداسة الله، لكنه لا يفصل هنا طبيعة هذه المشاركة أو مراحلها؛ لذلك تُحفظ دلالته ولا يُفرض عليه تفسير مذهبي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «التأديب» بالمعنى التربوي الواسع في سياق الأبوة، مع الحفاظ على المقابلة بين محدودية تأديب الآباء وغاية التأديب الإلهي.
