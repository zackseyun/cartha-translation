  terminology: «يُرجَم» مقابل λιθοβοληθήσεται دقيق ومألوف في العربية الكتابية. و«حيوان» مناسب لـθηρίον من غير تقييده بحيوان وحشي. لا حاجة إلى تسمية الجبل بسيناء في المتن.
