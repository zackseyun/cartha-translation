  text: οὐκ ἔφερον γὰρ τὸ διαστελλόμενον· Κἂν θηρίον θίγῃ τοῦ ὄρους, λιθοβοληθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: ar
  text: 'لأنهم لم يطيقوا ما كان يُؤمَر به: «ولو مسَّ حيوانٌ الجبلَ[a]، يُرجَم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تضيف بعض المخطوطات: «أو يُرمى بسهم»، صدىً لما ورد في خروج 19: 12–13.'
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: لم يطيقوا
  rationale: يؤدي معنى عدم القدرة على الاحتمال في هذا السياق بصياغة عربية طبيعية واضحة.
- source_word: γὰρ
  choice: لأنهم
  rationale: تحفظ أداة التعليل التي تصل الآية بما قبلها، مع دمج الضمير في صياغة عربية سلسة.
- source_word: τὸ διαστελλόμενον
  choice: ما أُمِروا به
  rationale: ينقل معنى الأمر أو التوجيه الملزم ويحفظ الصيغة اللفظية المبنية للمجهول دون زيادة في التحديد.
- source_word: Κἂν
  choice: حتى لو
  rationale: 'تنقل القوة الشرطية التوكيدية: الحكم يسري حتى في حالة مسّ حيوان للجبل.'
- source_word: θηρίον
  choice: حيوانٌ
  rationale: لفظ عام واضح؛ لا يقيّد المعنى بالحيوان الوحشي وحده.
- source_word: θίγῃ
  choice: مسَّ
  rationale: فعل عربي مباشر يؤدي معنى اللمس في جملة الشرط.
- source_word: τοῦ ὄρους
  choice: الجبلَ
  rationale: يحافظ على التعبير اليوناني العام؛ ويُفهم من السياق أن المقصود جبل سيناء.
- source_word: λιθοβοληθήσεται
  choice: يُرجَم
  rationale: يحفظ المبني للمجهول ومعنى القتل أو العقوبة بالرجم، بصياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: علاقة الاقتباس بأمر جبل سيناء
  choice: إيراد نص الأمر بحسب النص اليوناني المقدم دون توسيع
  alternative: 'إضافة «أو يُرمى بسهم» موافقةً لبعض المخطوطات ولصدى خروج 19: 12–13'
  rationale: ينتهي نص SBLGNT المقدم عند «يُرجَم»، ولذلك لا تُدرج القراءة الأطول في المتن، بل تُذكر في الحاشية بوصفها اختلافًا نصيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «لم يطيقوا» للتعبير الطبيعي عن عدم الاحتمال، و«حتى لو» لإبراز شمول الشرط، مع إبقاء «الجبل» دون التصريح باسم سيناء لأن الاسم غير وارد في هذه العبارة اليونانية.
