  source_fidelity: 'ينقل المسودة المعنى الأساسي للنص اليوناني بدقة: عدم القدرة على احتمال الأمر، وشرط مسّ الحيوان للجبل، وعقوبة الرجم. غير أن «ما أُمِروا به» تجعل الأمر موجَّهًا صراحةً إليهم، بينما العبارة اليونانية اسم مفعول محايد مُسَبْسَط، أي «ما كان يُؤمَر به/الأمر المُعلَن»، من دون التصريح بمتلقي الأمر.'
