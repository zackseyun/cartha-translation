  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: ar
  text: لِأَنَّكُمْ لَمْ تَأْتُوا إِلَى مَا يُمْكِنُ لَمْسُهُ[a]، وَإِلَى نَارٍ مُتَّقِدَةٍ، وَإِلَى ظُلْمَةٍ وَعَتَمَةٍ وَعَاصِفَةٍ[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى جبل يمكن لمسه». يُفهَم من السياق المحيط أن المقصود هو جبل سيناء، لكن كلمة «جبل» غير مذكورة صراحةً في النص اليوناني لهذه الآية.'
    reason: alternative_reading
  - marker: b
    text: 'ويجوز وصل عناصر العبارة هكذا: «إلى ما يمكن لمسه، إلى نار متقدة، وإلى ظلمة وعتمة وعاصفة».'
    reason: previous_rendering
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: لِأَنَّكُمْ لَمْ
  rationale: نُقلت γάρ بأداة التعليل «لأن» لربط الآية بما قبلها، ونُقل النفي Οὐ بـ«لم» مع الفعل الماضي الدال هنا على عدم الاقتراب.
- source_word: προσεληλύθατε
  choice: تأتوا إلى
  rationale: الفعل في صيغة التام يدل على اقتراب وقع وتترتب عليه حالة حاضرة. وتعبير «تأتوا إلى» عربي طبيعي يحفظ معنى الوصول والاقتراب دون إثقال.
- source_word: ψηλαφωμένῳ
  choice: ما يمكن لمسه
  rationale: اللفظ يعني ما هو ملموس أو قابل للمس، ولا يَرِد في نص الآية اسم صريح مثل «جبل»، لذلك تُرك المرجع غير مصرَّح به في المتن.
- source_word: κεκαυμένῳ πυρί
  choice: نار متقدة
  rationale: اسم المفعول التام يصف النار وهي في حالة اشتعال؛ و«متقدة» واضحة وفصيحة وتحفظ الصورة الحسية.
- source_word: γνόφῳ
  choice: ظلمة
  rationale: يدل اللفظ على الظلمة الكثيفة. واختيار «ظلمة» يحفظ المعنى الأساسي ويتيح تمييزه عن اللفظ التالي.
- source_word: ζόφῳ
  choice: عتمة
  rationale: يدل على الظلام القاتم أو الكآبة المظلمة؛ و«عتمة» تميّزه عن γνόφος مع إبقاء التراكم البلاغي.
- source_word: θυέλλῃ
  choice: عاصفة
  rationale: يدل على عاصفة شديدة أو زوبعة، و«عاصفة» هي العبارة الحديثة الواضحة من غير تكلف أدبي.
theological_decisions:
- issue: هل يُصرَّح بكلمة «جبل» بوصفها متعلق الاقتراب؟
  choice: 'عدم إضافة «جبل» في المتن، بل ترجمة العبارة بمرجع غير مصرَّح به: «ما يمكن لمسه».'
  alternative: «جبل يمكن لمسه»
  rationale: يفهم من السياق أن المقصود جبل سيناء، لكن النص اليوناني في هذه الآية لا يذكر ὄρος («جبل»). لذلك يحفظ المتن عدم التحديد الموجود في الأصل، ويبيّن الحاشية المرجع السياقي المحتمل.
- issue: كيفية حمل النفي على سلسلة العناصر المعطوفة
  choice: إبقاء النفي في صدر الجملة وربط العناصر المتعاقبة بالواو مع تكرار «إلى» بحسب بنية النص.
  alternative: تكرار «ولا إلى» مع كل عنصر
  rationale: النفي في اليونانية يسبق الفعل ثم تتوالى العناصر بحرف καί. والصياغة المختارة تحفظ هذا الترتيب، مع وضوح امتداد النفي إلى السلسلة كلها.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. حُفظ التعداد المتراكم في اليونانية بتكرار «وإلى» في الوحدات الرئيسة، واستُخدم الزوج «ظلمة وعتمة» لنقل تقارب اللفظين اليونانيين من غير دمجهما أو حذف أحدهما.
