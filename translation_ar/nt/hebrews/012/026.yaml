  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: ar
  text: 'الذي زعزع صوتُه الأرضَ آنذاك، أما الآن فقد وعد قائلًا[a]: «مرةً أخرى سأزعزع لا الأرضَ وحدها، بل السماءَ أيضًا[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اقتباس من حجي 2: 6.'
    reason: cross_reference
  - marker: b
    text: 'اليونانية هنا بالمفرد المعرّف، وحرفيًا: «السماء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: الذي زعزع صوتُه
  rationale: تُبقي الصلة النحوية بالله المذكور في السياق السابق، وتجعل «صوته» فاعل الزعزعة كما في اليونانية.
- source_word: ἐσάλευσεν
  choice: زعزع
  rationale: فعل عربي واضح وقوي يلائم الاضطراب الكوني، ويحافظ على الصلة بالفعل الآتي في الاقتباس.
- source_word: τὴν γῆν
  choice: الأرض
  rationale: المقابلة مع «السماء» تدل على المجال الكوني، لا على أرض محلية بعينها.
- source_word: τότε ... νῦν δὲ
  choice: آنذاك، أما الآن
  rationale: صياغة عربية طبيعية تُظهر بوضوح المقابلة الزمنية بين الحدث الماضي والوعد القائم.
- source_word: ἐπήγγελται
  choice: فقد وعد
  rationale: ينقل معنى الفعل في صيغة التام، أي إن الوعد صدر وما زال قائمًا.
- source_word: Ἔτι ἅπαξ
  choice: مرةً واحدةً أخرى
  rationale: تحافظ العبارة على معنى التكرار وعلى دلالة ἅπαξ إلى وقوع الأمر مرة أخرى واحدة، وهي دلالة مهمة في تفسير الآية التالية.
- source_word: σείσω
  choice: سأزعزع
  rationale: يحافظ على صورة الاضطراب وعلى التوازي مع «زعزع» في صدر الآية.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: لا ... وحدها، بل ... أيضًا
  rationale: مقابل عربي واضح وطبيعي للبنية اليونانية الترابطية.
- source_word: τὸν οὐρανόν
  choice: السماء
  rationale: المفرد المعرّف في العربية يطابق صيغة اليونانية ويكوّن مع «الأرض» زوجًا كونيًا شاملًا.
theological_decisions:
- issue: مرجع اسم الموصول والفاعل المفهوم في «وعد»
  choice: 'يعود الكلام إلى الله: صوته زعزع الأرض وهو الذي وعد بالزعزعة الآتية.'
  alternative: صياغة غير شخصية تُبهم مرجع الموصول أو صاحب الوعد.
  rationale: السياق السابق واقتباس حجي يحددان الله بوصفه المتكلم، من غير حاجة إلى إضافة اسم «الله» داخل نص الآية.
- issue: نطاق «الأرض» و«السماء»
  choice: الإبقاء على اللفظين بمعناهما الكوني الواسع.
  alternative: «اليابسة» و«الجو» أو «الأرض المحلية» و«السماء المرئية».
  rationale: المقابلة الثنائية في الاقتباس تشمل نظام الخليقة، والترجمة الواسعة لا تفرض تصورًا تفصيليًا لكيفية الزعزعة.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُعمل «زعزع» في شطري الآية لإبراز التكرار اللفظي والصلة بين الحدث الماضي والوعد الآتي. ونُقلت علامة الحاشية الخاصة بالسماء إلى موضعها الموافق، مع ترتيب الحاشيتين بحسب ظهورهما في النص العربي.
