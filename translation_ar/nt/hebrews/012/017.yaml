id: HEB.12.17
reference: Hebrews 12:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: ar
  text: فأنتم تعرفون أنه بعد ذلك، لما أراد أن يرث البركة، رُفض، لأنه لم يجد مجالًا للتوبة، مع أنه طلبها بدموع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يعود الضمير في «طلبها» إلى «البركة» أو إلى «التوبة». وقد تعني عبارة «لم يجد مجالًا للتوبة» أنه لم يجد سبيلًا إلى عكس النتيجة، أو أنه لم يستطع حمل إسحاق على تغيير رأيه.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴστε
  choice: فأنتم تعرفون
  rationale: الفعل ذو معنى حاضر ويستدعي معرفة المخاطَبين السابقة؛ و«تعرفون» عربية طبيعية واضحة.
- source_word: μετέπειτα
  choice: بعد ذلك
  rationale: ينقل الدلالة الزمنية المباشرة من غير زيادة تفسيرية.
- source_word: θέλων κληρονομῆσαι τὴν εὐλογίαν
  choice: لما أراد أن يرث البركة
  rationale: صياغة زمنية عربية سلسة تحفظ معنى الإرادة ودلالة الميراث والبركة المحددة.
- source_word: ἀπεδοκιμάσθη
  choice: رُفض
  rationale: يحفظ المبني للمجهول ومعنى الرفض من غير تحميله دلالة خلاصية اصطلاحية.
- source_word: μετανοίας ... τόπον
  choice: مجالًا للتوبة
  rationale: ينقل اصطلاح «موضع/مجال للتوبة» إلى عربية مفهومة، مع إبقاء «التوبة» وعدم حسم هل المقصود فرصة لتغيير النتيجة أم تغيير رأي إسحاق.
- source_word: καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν
  choice: مع أنه طلبها بدموع
  rationale: يحفظ معنى الاستدراك والطلب المصحوب بالدموع، وتبقى إحالة الضمير المؤنث محتملة بين البركة والتوبة.
theological_decisions:
- issue: مرجع الضمير αὐτήν ومعنى عدم إيجاد مجال للتوبة
  choice: أُبقي الضمير في «طلبها» بلا تعيين، وأُبقيت عبارة «مجالًا للتوبة» في المتن.
  alternative: قد تعود «ها» إلى البركة، وقد تعود إلى التوبة؛ وقد تشير التوبة إلى إمكان عكس النتيجة أو إلى تغيير إسحاق لرأيه.
  rationale: النص اليوناني يتيح هذه الاحتمالات، لذلك لا ينبغي للترجمة أن تحسم توترًا تفسيريًا لا يحسمه الأصل.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. اختيرت «مجالًا» بدل الحرفية الجامدة «موضعًا»، مع الحفاظ على الغموض الحقيقي في مرجع الضمير وتفسير التوبة.
