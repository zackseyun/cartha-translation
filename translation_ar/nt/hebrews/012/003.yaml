  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: ar
  text: فتأمّلوا في الذي احتمل من الخطاة معارضةً كهذه ضد أنفسهم[a]، لئلّا تكلّوا وأنتم تخورون في نفوسكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يقرأ نص SBLGNT: «ضد أنفسهم» (بضمير الجمع). وتقرأ مخطوطات أخرى: «ضد نفسه»؛ والسياق يشير إلى المعارضة التي احتملها يسوع.'
    reason: textual_variant
  - marker: b
    text: 'أو: «لئلّا تكلّوا وتفقدوا العزم في نفوسكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: فتأمّلوا
  rationale: فعل أمر يدعو إلى التفكير المتأني والموازنة الجادة؛ و«تأمّلوا» عربية طبيعية تحفظ قوة الحث.
- source_word: τὸν ... ὑπομεμενηκότα
  choice: ذاك الذي احتمل
  rationale: يحفظ التعبير الإشاري في اليونانية من غير تكرار اسم يسوع، بينما يوضحه السياق السابق، و«احتمل» ينقل الثبات تحت المعاناة.
- source_word: τοιαύτην ... ἀντιλογίαν
  choice: مثل هذه المقاومة
  rationale: «مثل هذه» تبقي مدى الإشارة مفتوحًا، و«المقاومة» تنقل هنا معنى المعارضة والعداء على نحو أوسع وأنسب من «المجادلة» وحدها.
- source_word: ὑπὸ τῶν ἁμαρτωλῶν
  choice: من الخطاة
  rationale: ترجمة مباشرة تحفظ الوصف الأخلاقي للمقاومين.
- source_word: εἰς ἑαυτοὺς
  choice: الموجَّهة إليهم
  rationale: يتبع المتن قراءة SBLGNT بالجمع «إليهم/على أنفسهم»، مع إبراز غرابتها وحفظ القراءة البديلة ودلالة السياق في الحاشية.
- source_word: κάμητε
  choice: تكلّوا
  rationale: «كلَّ» فعل عربي فصيح واضح يدل على التعب والإعياء، ويلائم صورة المثابرة في السياق.
- source_word: ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι
  choice: وتخور نفوسكم
  rationale: صياغة عربية طبيعية تحفظ ذكر النفوس وتنقل معنى الضعف والانحلال وفقدان العزم، مع ذكر بديل أقرب إلى البنية اليونانية في الحاشية.
theological_decisions:
- issue: مرجع «ذاك الذي»
  choice: الإبقاء على الإشارة من غير إضافة اسم يسوع
  alternative: «يسوع الذي احتمل»
  rationale: السياق المباشر في عبرانيين 12:2 يعيّن يسوع مرجعًا، لكن الآية نفسها تستعمل تركيبًا وصفيًا؛ لذلك لا يُضاف الاسم إلى المتن.
- issue: اتجاه المقاومة والاختلاف النصي في الضمير
  choice: 'اتباع نص SBLGNT: «الموجَّهة إليهم»'
  alternative: «الموجَّهة إليه»
  rationale: نص المصدر المحدد يقرأ ضمير الجمع ἑαυτούς («إليهم/على أنفسهم»)، وهي قراءة صعبة تُحفظ في المتن بدل تسويتها سياقيًا. وتُذكر قراءة المفرد، التي تجعل المقاومة موجهة إلى يسوع بوضوح، في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة ذات نبرة كتابية رصينة. اختير «تكلّوا» و«تخور نفوسكم» للإيجاز والإيقاع الطبيعي، مع تجنب التفسير الطائفي وحفظ صعوبة قراءة SBLGNT في المتن.
