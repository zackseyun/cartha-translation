lexical_decisions:
- source_word: Διὸ
  choice: لِذلِكَ
  rationale: أداة استنتاج تربط الحثّ بما سبق من حديث عن احتمال التأديب والثبات، وهي صياغة عربية موجزة وطبيعية.
- source_word: τὰς παρειμένας χεῖρας
  choice: أَيْدِيَكُمُ الْمُسْتَرْخِيَةَ
  rationale: تفيد صيغة παρίημι الأيدي المتراخية أو المتدلية. أُضيف ضمير المخاطبين لأن الأمر موجّه إليهم ولأن العربية تستعمله طبيعيًا مع أعضاء الجسد.
- source_word: τὰ παραλελυμένα γόνατα
  choice: رُكَبَكُمُ الْوَاهِنَةَ
  rationale: تدل صيغة παραλύω هنا على الركب التي أصابها الضعف والعجز. «الواهِنة» تحفظ صورة الإنهاك من غير أن توحي خطأً بتشخيص الشلل السريري.
- source_word: ἀνορθώσατε
  choice: قَوُّوا
  rationale: الأمر يدعو إلى فعل حاسم يعيد القدرة على الثبات والمضي. «قوّوا» تنقل المقصود الحثّي في السياق، مع إبقاء صورة الأيدي والركب ظاهرة.
theological_decisions:
- issue: الحثّ المجازي المصوَّر بضعف أعضاء الجسد
  choice: فهم الأمر بوصفه دعوة إلى استعادة القوة والثبات، مع الحفاظ على صورة الأيدي والركب.
  alternative: ارفعوا الأيدي المسترخية والركب الواهنة.
  rationale: السياق المباشر يتناول الصبر على التأديب والثبات في المسير، والعبارة تردد صدى إشعياء 35:3 في التقليد اليوناني. لذلك تُحفظ الصورة ولا يُحصر الكلام في وضعية جسدية حرفية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «المسترخية» و«الواهِنة» للحفاظ على الصورة الجسدية، و«قوّوا» لإبراز قوة الأمر الحثّية في السياق.
