  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: ar
  text: وإلى جماعة الأبكار المسجَّلين في السماوات[a]، وإلى الله، قاضي الجميع، وإلى أرواح الأبرار الذين أُكمِلوا،
  philosophy: optimal-equivalence
