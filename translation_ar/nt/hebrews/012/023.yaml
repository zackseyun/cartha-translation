    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: جماعة
  rationale: تنقل معنى جماعة المجتمعين في سياق صهيون السماوية، من غير أن توحي بالضرورة بمؤسسة كنسية لاحقة.
- source_word: πρωτοτόκων
  choice: الأبكار
  rationale: صيغة جمع اسمية تحفظ الدلالة على جماعة ذات منزلة البكر وامتيازه، من غير إضافة «أبناء» غير المذكورة صراحة.
- source_word: ἀπογεγραμμένων
  choice: المسجَّلين
  rationale: تحفظ صورة القيد في سجل، وتعكس اسم المفعول التام الدال على تسجيل تمّ وما زالت نتيجته قائمة.
- source_word: ἐν οὐρανοῖς
  choice: في السماوات
  rationale: تحفظ صيغة الجمع اليونانية وتلائم الأسلوب العربي الكتابي الواضح، مع إثبات البديل المفرد في الحاشية.
- source_word: κριτῇ θεῷ πάντων
  choice: الله ديّان الجميع
  rationale: تجعل «ديّان الجميع» بيانًا لوظيفة الله، وتحافظ على تتابع المعطوفات المرتبطة بفعل المجيء في السياق السابق.
- source_word: πνεύμασι
  choice: أرواح
  rationale: هو المقابل المباشر للفظ اليوناني، من غير توسيع تفسيري إلى كائنات روحية أو تقرير تفصيل غير مصرح به.
- source_word: δικαίων
  choice: أناس أبرار
  rationale: يوضح أن الحديث عن بشر بصياغة عربية طبيعية شاملة، من غير قصرها على الذكور.
- source_word: τετελειωμένων
  choice: قد بُلِّغوا الكمال
  rationale: يعكس المبني للمجهول وصيغة التمام، ويحفظ موضوع البلوغ إلى الكمال في الرسالة إلى العبرانيين بصياغة عربية طبيعية.
theological_decisions:
- issue: هوية «الأبكار»
  choice: تسمية جماعية لشعب الله المشترك في منزلة البكر وميراثه
  alternative: أن يكون المقصود المسيح بصفته البكر، وأن تكون الجماعة تابعة له
  rationale: صيغة الجمع πρωτοτόκων ترجّح بوضوح المرجع الجماعي؛ لذلك أبقت الترجمة اللفظ جمعًا ولم تضف تفسيرًا عقائديًا.
- issue: مرجع «أرواح أناس أبرار قد بُلِّغوا الكمال»
  choice: أرواح بشر أبرار بلغوا حالة الكمال بحضور الله
  alternative: إشارة أوسع إلى جميع الأبرار، سواء أكانوا في الجسد أم خارجه
  rationale: لفظ «الأرواح» مع «أناس أبرار» يرجح بشرًا في حالتهم الروحية، لكن الترجمة لا تضيف تفاصيل عن الحالة الوسطى لا ينص عليها النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «جماعة» بدل «كنيسة» لتجنب الإيحاء المؤسسي، وحُفظ جمع «السماوات» كما في اليونانية، مع بديل اصطلاحي في الحاشية.
