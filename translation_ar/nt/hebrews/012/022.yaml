  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: ar
  text: بل قد أتيتم إلى جبل صهيون، وإلى مدينة الله الحي، أورشليم السماوية، وإلى ربوات من الملائكة في محفل احتفالي[a][b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وإلى ربوات من الملائكة، وإلى محفل احتفالي». يتيح التركيب اليوناني أن يُربط «المحفل الاحتفالي» بالملائكة أو أن يُفهم عنصرًا مستقلًا في السلسلة.'
    reason: alternative_reading
  - marker: b
    text: يمكن أن تعني «ربوات» عشرات الألوف حرفيًا، أو جموعًا لا تُحصى على وجه العموم.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد مقابلة قوية بما سبق عن جبل سيناء، و«بل» أوجز وأفصح في هذا الانتقال الاستدراكي.
- source_word: προσεληλύθατε
  choice: قد أتيتم إلى
  rationale: المضارع التام اليوناني يدل على إتيان تمّ وما زالت نتيجته قائمة؛ وتؤدي «قد أتيتم» هذا المعنى بصورة طبيعية.
- source_word: Σιὼν ὄρει
  choice: جبل صهيون
  rationale: صياغة عربية مألوفة تحفظ اسم العلم وصورة الجبل، ويُفهم حرف الجر من الفعل السابق.
- source_word: πόλει θεοῦ ζῶντος
  choice: مدينة الله الحي
  rationale: تحفظ علاقة الإضافة والوصف اللاهوتي المباشر «الحي» بلغة عربية واضحة وموقرة.
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: أورشليم السماوية
  rationale: بدل يوضح «مدينة الله الحي»، وينقل الصفة ἐπουρανίῳ مباشرة من غير زيادة تفسيرية.
- source_word: μυριάσιν ἀγγέλων
  choice: ربوات من الملائكة
  rationale: «ربوات» تنقل معنى μυριάδες، أي عشرات الألوف أو الجموع الهائلة غير المحصاة، وتحافظ على النبرة الرفيعة.
- source_word: πανηγύρει
  choice: في محفل احتفالي
  rationale: تدل الكلمة على اجتماع عام بهيج ذي طابع احتفالي؛ وهذه العبارة واضحة وتحفظ احتمال اتصالها بجموع الملائكة.
theological_decisions:
- issue: العلاقة النحوية لكلمة πανηγύρει
  choice: 'رُبطت بربوات الملائكة: «ربوات من الملائكة في محفل احتفالي»'
  alternative: 'يمكن أن تبدأ عنصرًا مستقلًا في السلسلة: «وإلى ربوات من الملائكة، وإلى محفل احتفالي»؛ وقد تُربط أيضًا بما يلي في العدد 23.'
  rationale: يسمح توالي صيغ المجرور في اليونانية بأكثر من تركيب. وربطها بالملائكة السابقين مباشرة يعطي معنى متماسكًا، لكن الاحتمال الآخر حقيقي ولذلك حُفظ في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة موقرة. استُعملت «ربوات» للمحافظة على الصورة العددية والأسلوب الرفيع، مع شرحها في الحاشية. وُضعت علامتا الحاشيتين عند العبارة التي تتصل بها الملاحظتان، مع إبقاء غموض التركيب اليوناني ظاهرًا.
