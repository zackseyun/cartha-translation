  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: ar
  text: وألّا يكون أحدٌ مرتكبًا للفجور الجنسي أو مستهينًا بالمقدسات مثل عيسو، الذي باع حقَّه في البكورية لقاء وجبة واحدة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: منغمسًا في الفجور الجنسي
  rationale: ينقل الدلالة الجنسية الصريحة للاسم اليوناني بصياغة عربية واضحة، من غير حصرها في صورة واحدة من صور السلوك الجنسي المحرَّم.
- source_word: βέβηλος
  choice: مستهينًا بالمقدسات
  rationale: يدل اللفظ على من يعامل الأمور المقدسة كأمور عادية لا حرمة لها؛ وهذه الصياغة أوضح للقارئ المعاصر من «دنيوي» وأدق من تعبير قد يفيد الإلحاد المحض.
- source_word: τὰ πρωτοτόκια
  choice: حقَّه في البكورية
  rationale: يشير إلى الامتيازات والحقوق الملازمة لمكانة الابن البكر، لا إلى مجرد كونه مولودًا أولًا.
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: لقاء وجبة واحدة
  rationale: يحافظ على المقابلة المؤكدة بين قيمة حق البكورية وضآلة الطعام الواحد الذي أُخذ عوضًا عنه.
theological_decisions:
- issue: مدى انطباق الوصفين على عيسو
  choice: مثل عيسو
  alternative: أو مستهينًا بالمقدسات، كما كان عيسو
  rationale: تركيب النص اليوناني يربط عيسو بالمثال من غير أن يحسم صراحةً هل يُراد إسناد كل وصف إليه على حدة؛ لذلك حُفظ التركيب الموجز وما فيه من توتر.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، تحافظ على نبرة التحذير وعلى اتصال الآية بسياقها السابق. استُخدم «المقدسات» لتوضيح معنى βέβηλος من غير استيراد مصطلح طائفي، و«حقه في البكورية» بدل اللفظ الكنسي المختصر لتيسير الفهم.
