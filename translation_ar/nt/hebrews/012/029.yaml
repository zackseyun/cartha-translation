id: HEB.12.29
reference: Hebrews 12:29
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: ar
  text: لأن إلهنا نارٌ آكلةٌ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: في هذا صدى لتثنية 4:24، حيث يوصف الله بأنه «نار آكلة».
    reason: cross_reference
  - marker: b
    text: 'أو: «نار تأكل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: لأن
  rationale: تفيد γὰρ التعليل وشرح التحذير السابق، وتُستوعَب καὶ في الصياغة العربية كي لا يثقل الأسلوب؛ و«لأن» تنقل الصلة التفسيرية بوضوح.
- source_word: ὁ θεὸς ἡμῶν
  choice: إلهنا
  rationale: ترجمة عربية طبيعية للتركيب الإضافي، وتحفظ دلالته الجماعية والعهديّة.
- source_word: πῦρ
  choice: نار
  rationale: ترجمة حرفية للاسم الخبري، تُبقي الصورة المجازية وصداها الكتابي من غير تفسير زائد.
- source_word: καταναλίσκον
  choice: آكلة
  rationale: اسم الفاعل المؤنث يطابق «نار» وينقل معنى النار التي تستهلك أو تفني، مع الحفاظ على إيجاز التعبير وقوته.
theological_decisions:
- issue: وصف الله مجازيًا بأنه نار
  choice: 'الإبقاء على الاستعارة المباشرة: «إلهنا نار آكلة»'
  alternative: إلهنا مثل نار آكلة؛ إلهنا نار تأكل
  rationale: الجملة اليونانية اسمية مساواتية ولا تتضمن أداة تشبيه. لذلك تُحفَظ الاستعارة وقوة التحذير من غير تلطيفها إلى تشبيه، مع إبقاء الصلة بتثنية 4:24.
translation_notes:
  register: العربية فصحى حديثة واضحة وموجزة ذات نبرة مهيبة. أُبقي التعبير المجازي المباشر، واستُعملت «آكلة» لصون الصدى الكتابي وقوة العبارة، مع بيان البديل الأكثر تفسيرًا في الحاشية.
