  source_fidelity: 'تحتاج العبارة الأولى إلى تعديل يسير: παιδευτάς اسم خبرُه «كان لنا»، ومعناه «مؤدِّبين/مُقوِّمين»، لا مجرد أنهم كانوا يمارسون التأديب. كما أن ἐνετρεπόμεθα تفيد الاحترام أو التوقير في هذا السياق، ولا تستلزم معنى الهيبة الذي قد يوحي بالخوف.'
