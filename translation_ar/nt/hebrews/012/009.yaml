  rationale: 'يحفظ النص المنقح بنية الأصل: مقارنة بين الآباء البشريين بوصفهم مؤدِّبين وبين أبي الأرواح، ثم سؤال بلاغي بقياس الأَوْلى. ويستبدل تعبيرًا عربيًا غير مألوف بترجمة طبيعية لا تزيد معنى الخوف، مع إبقاء سعة «أبي الأرواح» وحاشيتها التفسيرية دون حسم للمعنى المختلف فيه.'
