  terminology: «آباؤنا بحسب الجسد» يحفظ مقابلة النص من دون تحميل «الجسد» معنى أخلاقيًا. و«أبي الأرواح» يحافظ على عمومية الإضافة اليونانية، و«نخضع» ينقل ὑποταγησόμεθα بوضوح. ينبغي وضع علامة الحاشية عند «أبي الأرواح» لأنها تخص هذا التعبير.
