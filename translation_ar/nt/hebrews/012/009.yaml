  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: ar
  text: ثم إن آباءنا بحسب الجسد كان لنا منهم مؤدِّبون، وكنا نحترمهم. أفلا نخضع بالأحرى لأبي الأرواح[a] فنحيا؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يُفهم «أبو الأرواح» هنا على وجه أخص بمعنى «أبو أرواحنا»، في مقابل آبائنا بحسب الجسد، لكن العبارة اليونانية أعم.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: ثم إن
  rationale: تقدّم حجة إضافية ضمن قياس الأَوْلى، من غير حصرها في التعاقب الزمني.
- source_word: τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας
  choice: آباءنا بحسب الجسد
  rationale: يحافظ على صورة الأصل وعلى المقابلة مع «أبي الأرواح»، من دون أن يوحي بأن σάρξ تعني الطبيعة الخاطئة هنا.
- source_word: παιδευτὰς
  choice: كانوا يؤدِّبوننا
  rationale: صياغة فعلية عربية طبيعية تحفظ صلة اللفظة بموضوع التأديب في السياق القريب.
- source_word: ἐνετρεπόμεθα
  choice: فكنا نهابهم باحترام
  rationale: يجمع بين معنى الهيبة ومراعاة الاحترام؛ وهو أوسع قليلًا من مجرد «نحترمهم» وأوضح للقارئ المعاصر.
- source_word: οὐ πολὺ μᾶλλον
  choice: أفلا ... بالأحرى
  rationale: ينقل قوة السؤال البلاغي وقياس الأَوْلى بعبارة عربية فصيحة طبيعية.
- source_word: ὑποταγησόμεθα
  choice: نخضع
  rationale: يعبر بإيجاز عن الدخول تحت السلطة، ويحافظ على صيغة السؤال الاستقبالية بحسب الاستعمال العربي.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: لأبي الأرواح
  rationale: ترجمة قريبة تبقي إضافة «الأرواح» عامة كما في اليونانية، ولا تضيقها إلى «أرواحنا».
- source_word: ζήσομεν
  choice: ونحيا
  rationale: تحافظ على النتيجة أو الغاية الموجزة في ختام السؤال البلاغي.
theological_decisions:
- issue: دلالة «أبي الأرواح»
  choice: الإبقاء على العبارة العامة «أبي الأرواح»
  alternative: «أبي أرواحنا» أو «أبي الكائنات الروحية»
  rationale: الإضافة اليونانية لا تذكر ضمير المتكلمين ولا تحدد فئة الأرواح؛ لذا تُحفظ سعة التعبير والتوتر اللاهوتي بدل حسمه.
translation_notes:
  register: عربية فصحى معاصرة ذات نبرة كتابية كريمة. استُعمل «بحسب الجسد» للمحافظة على المقابلة الأصلية، و«نهابهم باحترام» لنقل معنى ἐντρέπομαι دون اختزاله في الخوف المحض.
