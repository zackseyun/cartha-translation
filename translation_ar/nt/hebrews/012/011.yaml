base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: ar
  text: فكلُّ تأديبٍ لا يبدو في الوقت الحاضر باعثًا على الفرح، بل على الحزن؛ لكنه بعد ذلك يؤتي الذين تدرّبوا من خلاله ثمرَ البرّ المتسمَ بالسلام[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العدل». يمكن أن تدل الكلمة اليونانية على البرّ أو العدل؛ والأرجح هنا أنها تشير إلى الاستقامة التي يُنتجها تأديب الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεία
  choice: تأديب
  rationale: يدل السياق على تأديب أبوي تكويني يشمل التقويم والتدريب، لا على العقاب المحض ولا التعليم النظري وحده.
- source_word: πρὸς μὲν τὸ παρόν
  choice: في الحاضر
  rationale: يحفظ منظور الوقت الراهن في مقابلة النتيجة اللاحقة التي يعبّر عنها ὕστερον.
- source_word: οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης
  choice: لا يبدو ... مدعاةً للفرح، بل للحزن
  rationale: يحفظ معنى الظهور بحسب الخبرة الإنسانية، مع صياغة عربية طبيعية تبقي اسمي الفرح والحزن.
- source_word: ὕστερον
  choice: بعد ذلك
  rationale: يعبّر بوضوح عن النتيجة اللاحقة في مقابل الحاضر.
- source_word: ἀποδίδωσιν
  choice: يؤتي
  rationale: يلائم صورة الثمر في العربية ويؤدي معنى إنتاج التأديب لنتيجته.
- source_word: καρπὸν εἰρηνικόν
  choice: الثمر المفعم بالسلام
  rationale: يحافظ على كون السلام صفة للثمر، لا مجرد أثر منفصل ينتجه.
- source_word: τοῖς δι’ αὐτῆς γεγυμνασμένοις
  choice: الذين تدرّبوا به
  rationale: ينقل صيغة اسم المفعول التام ومعنى التدريب المتكرر الكامن في الصورة الرياضية للفعل.
- source_word: δικαιοσύνης
  choice: البرّ
  rationale: البرّ هو الأنسب هنا للدلالة على الاستقامة الأخلاقية والروحية التي يثمرها التأديب، مع إثبات «العدل» بديلاً معجميًا في الحاشية.
theological_decisions:
- issue: دلالة παιδεία في سياق عمل الله تجاه المؤمنين
  choice: تأديب تكويني يشمل التقويم والتدريب
  alternative: العقاب، أو التعليم وحده
  rationale: يعرض السياق القريب تأديب الله بوصفه تأديب أب لأبنائه وهادفًا إلى القداسة والنضج؛ لذلك تحفظ «تأديب» التوتر بين المحبة والتقويم من غير اختزاله في الجزاء.
- issue: دلالة δικαιοσύνης
  choice: البرّ
  alternative: العدل
  rationale: يرجح السياق معنى الاستقامة الناتجة من التأديب، لكن اللفظة اليونانية قد تدل أيضًا على العدل، لذلك حُفظ هذا الاحتمال في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة ذات نبرة وقورة. استُخدم تركيب «أمّا ... فـ» لنقل المقابلة في μὲν ... δὲ، ووُضعت علامة الحاشية بعد «البرّ» لأنها تتعلق بترجمة δικαιοσύνης.
