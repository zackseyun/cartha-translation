  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: ar
  text: احذروا أن ترفضوا مَن يتكلم[a]. فإن كان أولئك لم يفلتوا حين رفضوا مَن أنذرهم وهو على الأرض[b]، فبالأحرى لن نفلت نحن إن أعرضنا عمَّن في السماوات[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اسم الفاعل اليوناني في زمن الحاضر: «مَن يتكلم». ولا تذكر الآية اسمه صراحة.'
    reason: preserve_ambiguity
  - marker: b
    text: 'يمكن أن يعني الفعل اليوناني أيضًا: «مَن بلّغهم أمرًا إلهيًا» أو «مَن حذّرهم بوحي».'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «الذي من السماوات». ويحذف اليوناني هنا وصف الكلام أو الإنذار، كما يحذف فعل «نفلت» اعتمادًا على الجملة السابقة.'
    reason: source_ellipsis
lexical_decisions:
- source_word: Βλέπετε μὴ
  choice: احذروا أن
  rationale: صيغة أمر تحذيرية لجماعة المخاطَبين؛ وهذا التعبير عربي طبيعي ينقل قوة التنبيه من غير الاكتفاء بالترجمة الحرفية «انظروا».
- source_word: παραιτήσησθε / παραιτησάμενοι
  choice: ترفضوا / رفضوا
  rationale: يحافظ تكرار الجذر العربي على الصلة اللفظية المقصودة بين التحذير الموجَّه إلى القراء وما فعله السابقون.
- source_word: τὸν λαλοῦντα
  choice: مَن يتكلم
  rationale: ينقل اسم الفاعل في الزمن الحاضر، بما يوحي بأن الكلام قائم وموجَّه إلى السامعين الآن.
- source_word: ἐξέφυγον
  choice: لم يفلتوا
  rationale: يفيد عدم النجاة من العاقبة أو الدينونة، وهو المعنى الأنسب في سياق التحذير.
- source_word: ἐπὶ γῆς
  choice: على الأرض
  rationale: يحفظ المقابلة المكانية مع «من السماوات» من غير أن يحدد جبل سيناء صراحة في المتن.
- source_word: χρηματίζοντα
  choice: مَن أنذرهم
  rationale: يمكن للفعل أن يدل على تبليغ إلهي أو إنذار موحى به؛ واختيار «أنذرهم» يلائم السياق التحذيري، مع إضافة ضمير المفعول المفهوم من السياق لسلامة العربية.
- source_word: πολὺ μᾶλλον
  choice: فبالأحرى
  rationale: 'ينقل حجة الانتقال من الأدنى إلى الأعلى في سياق منفي، مع إظهار النتيجة المقدرة: لن نفلت.'
- source_word: ἀποστρεφόμενοι
  choice: إن أعرضنا
  rationale: يصوغ اسم الفاعل اليوناني في عبارة شرطية عربية واضحة، ويحفظ معنى الانصراف والرفض من غير تخصيصه بمصطلح عقدي أضيق.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: عمَّن يتكلم من السماوات
  rationale: الأصل يذكر حرفيًا «الذي من السماوات» ويحذف وصف الكلام أو الإنذار اعتمادًا على السياق؛ أُعيد فعل «يتكلم» في العربية لإيضاح المرجع مع إبقاء هوية المتكلم غير مصرَّح بها.
theological_decisions:
- issue: هوية المتكلم والمنذر
  choice: 'الإبقاء على الوصف العام: «مَن يتكلم» و«مَن أنذرهم» من غير إدخال اسم الله أو المسيح في المتن'
  alternative: التصريح بأن المتكلم هو الله أو المسيح
  rationale: السياق يدل على خطاب إلهي، لكن الآية نفسها تستخدم أوصافًا اسمية ولا تسمي المتكلم؛ لذلك يحفظ النص مجال الدلالة والتوتر اللاهوتي الموجودين في الأصل.
- issue: إكمال جواب المقارنة المحذوف
  choice: 'إظهار العبارة المقدرة: «لن نفلت نحن»'
  alternative: 'ترك التركيب أقرب إلى الحذف اليوناني: «فبالأحرى نحن المعرضون...»'
  rationale: الفعل «نفلت» مفهوم من الجملة السابقة، وإظهاره ضروري لوضوح العربية ولا يضيف مضمونًا عقديًا.
- issue: المفرد أم الجمع في οὐρανῶν
  choice: «السماوات» بالجمع
  alternative: «السماء» بالمفرد
  rationale: يحافظ الجمع على الصيغة اليونانية من غير بناء استنتاج كوني أو لاهوتي عليها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة تحذيرية وقورة. استُخدم «احذروا» لقوة الأمر، وحُفظ تكرار «رفض» والتقابل بين «على الأرض» و«من السماوات»، مع تجنب الألفاظ الطائفية أو تحديد هوية المتكلم بما يتجاوز نص الآية.
