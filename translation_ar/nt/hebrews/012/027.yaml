  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: ar
  text: وأما عبارة «مرةً أخرى»، فتدل على إزالة الأشياء التي تتزعزع، بوصفها أشياء مصنوعة[a]، لكي تبقى الأشياء التي لا تتزعزع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «بوصفها أشياء مخلوقة». واليونانية حرفيًا: «بوصفها أشياء قد صُنعت».'
    reason: lexical_alternative
  - marker: b
    text: أو «الأشياء التي لا يمكن أن تتزعزع»، أو «ما لا يتزعزع».
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: وأما عبارة «مرةً أخرى»
  rationale: أداة التعريف المحايدة تجعل القول المقتبس نفسه موضوع الكلام، وδέ تنقل إلى شرحه انتقالًا خفيفًا؛ و«عبارة» توضح ذلك طبيعيًا بالعربية.
- source_word: δηλοῖ
  choice: فتدل على
  rationale: تنقل الوظيفة التفسيرية للفعل بعبارة عربية واضحة غير تقنية.
- source_word: τῶν σαλευομένων
  choice: الأشياء التي تتزعزع
  rationale: تحافظ على دلالة اسم المفعول المضارع وعلى المقابلة اللفظية مع الأشياء التي لا تتزعزع.
- source_word: μετάθεσιν
  choice: إزالة
  rationale: تفيد التنحية أو الإبعاد في هذا السياق، لا مجرد التغيير، من غير توسع تفسيري زائد.
- source_word: ὡς πεποιημένων
  choice: بوصفها أشياء مصنوعة
  rationale: تحافظ «بوصفها» على ὡς، وتنقل «مصنوعة» كونها مما صُنع؛ وتذكر الحاشية البديل الطبيعي «مخلوقة».
- source_word: ἵνα μείνῃ
  choice: لكي تبقى
  rationale: تنقل غرض الإزالة أو نتيجتها المقصودة بصياغة عربية طبيعية.
- source_word: τὰ μὴ σαλευόμενα
  choice: الأشياء التي لا تتزعزع
  rationale: تحافظ على التوازي الصريح بين اسمي المفعول في اليونانية، ولا تستبدل النفي بمعنى عدم الإمكان.
theological_decisions:
- issue: هل تُفهم τὰ μὴ σαλευόμενα على أنها الأشياء التي لا تتزعزع أم التي لا يمكن زعزعتها؟
  choice: الأشياء التي لا تتزعزع
  alternative: الأشياء التي لا يمكن أن تتزعزع / ما لا يتزعزع
  rationale: النص يقابل بين «التي تتزعزع» و«التي لا تتزعزع»، ولا يصرح هنا بعدم الإمكان؛ لذلك تحفظ الصياغة التوازي والتوتر مع لغة الملكوت الذي لا يتزعزع في العدد التالي.
- issue: دلالة ὡς πεποιημένων
  choice: بوصفها أشياء مصنوعة
  alternative: باعتبارها أشياء مخلوقة
  rationale: تحفظ الصياغة علاقة ὡς الوصفية وصيغة الفعل المبني للمجهول، من غير أن تحصر العبارة في صياغة لاهوتية تفسيرية واحدة.
translation_notes:
  register: فصحى حديثة واضحة وكريمة. استُعمل «تتزعزع» بدل «تُزلزل» للحفاظ على سعة σαλεύω وعلى التكرار المقصود بين طرفي المقابلة، مع إبقاء العبارة المقتبسة موجزة.
