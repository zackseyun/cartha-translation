  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: ar
  text: لِأَنَّ الرَّبَّ يُؤَدِّبُ مَنْ يُحِبُّهُ، وَيَجْلِدُ[a] كُلَّ ابْنٍ[b] يَقْبَلُهُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يضرب بالسوط». الفعل اليوناني شديد الدلالة، ويصوّر تأديبًا قاسيًا.'
    reason: lexical_alternative
  - marker: b
    text: يعكس تعبير «كل ابن» الصياغة اليونانية، وله هنا معنى تمثيلي يشمل الذين يعترف الله بهم أولادًا له.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: مَنْ... ـهُ
  rationale: اسم الموصول «مَنْ» طبيعي في العربية ويفيد هنا تعميم القول على الأشخاص، مع إبقاء الإشارة الشخصية المفردة في الضمير.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تربط الأداة الآية بما قبلها بوصفها تعليلًا أو أساسًا للحث السابق.
- source_word: ἀγαπᾷ
  choice: يُحِبُّهُ
  rationale: ترجمة مباشرة وطبيعية للفعل، وتحفظ الصلة بين محبة الرب وتأديبه.
- source_word: κύριος
  choice: الرَّبّ
  rationale: اللقب العربي المألوف المقابل لـ κύριος، وهو ملائم أيضًا لسياق الاقتباس الكتابي.
- source_word: παιδεύει
  choice: يُؤَدِّبُ
  rationale: يفيد التأديب التربوي والإصلاحي، لا مجرد العقوبة، وهو واضح وفصيح في العربية المعاصرة.
- source_word: μαστιγοῖ
  choice: يَجْلِدُ
  rationale: فعل قوي يصور الضرب بالسوط ويحفظ شدة الاستعارة بدل تلطيفها إلى مجرد الألم أو المشقة.
- source_word: δὲ
  choice: وَ
  rationale: تصل الجملة الثانية بالأولى على نحو استمراري طبيعي، من غير دلالة لازمة على التضاد.
- source_word: πάντα υἱὸν
  choice: كُلَّ ابْنٍ
  rationale: يحفظ اللفظ المذكر المفرد وصورة البنوة المركزية في السياق، مع بيان قوته التمثيلية في الحاشية.
- source_word: παραδέχεται
  choice: يَقْبَلُهُ
  rationale: يعبر بوضوح عن القبول والاعتراف بالشخص في علاقة الرضا، وهو طبيعي أكثر من الصياغات الحرفية الجامدة.
theological_decisions:
- issue: دلالة لفظ υἱός في سياق تأديب الله والبنوة
  choice: كُلَّ ابْنٍ
  alternative: كل ولد / كل واحد من أولاده
  rationale: يحفظ النص صورة «الابن» التي يقوم عليها سياق عبرانيين 12، ولا يحوّلها في المتن إلى تعبير محايد؛ وتوضح الحاشية أن العبارة تشمل تمثيليًا جميع الذين يعترف الله بهم أولادًا له.
- issue: شدة الفعل μαστιγοῖ وعلاقته بالتأديب الإلهي
  choice: يَجْلِدُ
  alternative: يضرب بالسوط / يؤدب بشدة
  rationale: يحفظ قوة الصورة الأصلية والتوتر بين محبة الرب وقسوة التأديب، ولا يخفف العبارة لمعالجة الإشكال اللاهوتي ضمن الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «يؤدب» لإبقاء البعد التربوي، و«يجلد» للحفاظ على شدة الصورة، مع إبقاء «كل ابن» لصون استعارة البنوة في السياق.
