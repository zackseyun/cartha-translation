  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: ar
  text: 'وكان المنظر[a] مروِّعًا إلى حدّ أن موسى قال[b]: «أنا خائف ومرتعد».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما ظهر» أو «المشهد». يشير التعبير اليوناني إلى ما كان يُرى عند سيناء.'
    reason: lexical_alternative
  - marker: b
    text: ليست هذه الصياغة اقتباسًا حرفيًا من العهد القديم، لكنها تعبّر عن خوف موسى المرتبط بحادثة سيناء؛ قارن تثنية 9:19.
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: وكان
  rationale: واو الاستئناف تصل الآية بما سبق، واقترانها بـ«كان» يصوغ الجملة العربية طبيعيًا.
- source_word: οὕτω φοβερὸν ἦν
  choice: كان ... مروِّعًا إلى حدّ أن
  rationale: ينقل شدة الوصف والنتيجة المترتبة عليه بصياغة عربية واضحة، من غير إضعاف لقوة φοβερόν.
- source_word: τὸ φανταζόμενον
  choice: المنظر
  rationale: يدل التعبير على ما ظهر للعيان، أي المشهد أو التجلي المرئي عند سيناء؛ و«المنظر» موجز وطبيعي مع إبقاء البدائل في الحاشية.
- source_word: Μωϋσῆς εἶπεν
  choice: موسى قال
  rationale: نقل مباشر وبسيط للاسم وفعل القول.
- source_word: Ἔκφοβός εἰμι
  choice: أنا خائف
  rationale: يحفظ عنصر الخوف بوصف مستقل، ولا يدمجه في الارتعاد بما يطمس ازدواج التعبير اليوناني.
- source_word: καὶ ἔντρομος
  choice: ومرتعد
  rationale: ينقل معنى الارتجاف أو الارتعاد الناشئ عن شدة الخوف، ويحافظ على العطف الموجود في الأصل.
theological_decisions:
- issue: صلة قول موسى برواية سيناء في العهد القديم
  choice: إسناد القول إلى موسى في المتن كما يفعل النص اليوناني، مع بيان طبيعته النصية في الحاشية.
  alternative: اعتباره تلخيصًا حرًا لخوف موسى وإدخال هذا التفسير في المتن.
  rationale: ينبغي ألا تحسم الترجمة مسألة المصدر أو المطابقة اللفظية؛ فهي تحفظ إسناد الرسالة للقول إلى موسى وتترك التوضيح التناصي للحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير «مروِّعًا» لقوة المشهد، و«خائف ومرتعد» للمحافظة على عنصري الخوف والارتعاد منفصلين. موضع علامتي الحاشية بعد «قال» يربط [b] بنسبة القول و[a] بالمنظر، مع تجنب تكرار أي علامة.
