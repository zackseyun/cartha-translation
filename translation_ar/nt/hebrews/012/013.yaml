  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: ar
  text: واجعلوا لأقدامكم مسالك مستقيمة[a]، لئلا ينحرف الأعرج[b]، بل بالأحرى يُشفى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تتردد هنا أصداء أمثال 4:26، وتستمر صورة السير المنضبط الواردة في السياق.
    reason: cross_reference
  - marker: b
    text: 'أو: «يُخلع مفصلُه» أو «يُصاب بالخلع»؛ فقد يحمل الفعل اليوناني دلالة طبية أوضح ضمن الصورة الجسدية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: مسالك
  rationale: تدل الكلمة على آثار السير أو الدروب، و«مسالك» تعبير عربي طبيعي يحفظ صورة الطريق ونهج الحياة.
- source_word: ὀρθὰς
  choice: مستقيمة
  rationale: تنقل معنى الطريق القويم المباشر، وتلائم صدى أمثال 4:26 في الترجمة السبعينية.
- source_word: ποιεῖτε
  choice: اجعلوا
  rationale: فعل أمر يفيد العمل المستمر؛ و«اجعلوا» مباشر وطبيعي مع «مسالك».
- source_word: τοῖς ποσὶν ὑμῶν
  choice: لأقدامكم
  rationale: تحفظ دلالة المنفعة أو المرجع في صيغة المجرور اليونانية، أي إعداد المسالك للأقدام.
- source_word: τὸ χωλὸν
  choice: الأعرج
  rationale: الصفة المحايدة مستعملة استعمال الاسم، وقد تحمل معنى عامًا أو جمعيًا. «الأعرج» يحفظ صورة العرج من غير أن يحدد هل المقصود ضعف جسدي حرفي أم ضعف مجازي.
- source_word: ἐκτραπῇ
  choice: ينحرف
  rationale: يحفظ المعنى الشائع، أي الميل عن الطريق، مع إبقاء الدلالة الطبية الممكنة في الحاشية.
- source_word: ἰαθῇ
  choice: يُشفى
  rationale: المعنى المعتاد للفعل هو الشفاء، وهو يحفظ الاستعارة الجسدية والغاية الإصلاحية.
- source_word: μᾶλλον
  choice: بالأحرى
  rationale: 'تُظهر المقابلة بين النتيجة المنفية والنتيجة المنشودة: لا أن ينحرف، بل أن يُشفى.'
theological_decisions:
- issue: هل الصورة الجسدية حرفية أم مجازية؟
  choice: الإبقاء على لغة الأقدام والعرج والشفاء من غير حصرها في ضعف جسدي أو روحي بعينه.
  alternative: تفسير «الأعرج» صراحة بأنه المؤمن الضعيف روحيًا، أو بأنه كل شخص معرّض للتعثر.
  rationale: النص الإرشادي يستخدم صورة جسدية يُحتمل أن تكون ذات دلالة مجازية، لكنه لا يحدد مرجعها بدقة؛ لذلك ينبغي حفظ هذا التوتر بدل فرض تفسير لاهوتي أضيق.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة ذات نبرة إرشادية كريمة. استُعمل «الأعرج» بدل تعبير حرفي ثقيل مثل «ما هو أعرج»، مع عدم حسم مرجعه الحرفي أو المجازي.
