  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: ar
  text: وإلى يسوع، وسيطِ عهدٍ جديد، وإلى دمِ الرشِّ[b] الذي ينطق بما هو أفضل من هابيل[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من دم هابيل». يقول النص اليوناني حرفيًا: «من هابيل»، في تلميح محتمل إلى دم هابيل الذي صرخ من الأرض (التكوين 4: 10).'
    reason: alternative_reading
  - marker: b
    text: يشير «دم الرش» إلى دم الذبيحة الذي كان يُطبَّق بالرش، مستحضرًا صور تثبيت العهد والتطهير.
    reason: cultural_note
lexical_decisions:
- source_word: διαθήκης νέας
  choice: عهدٍ جديد
  rationale: تحمل διαθήκη في الرسالة إلى العبرانيين معنى العهد الكتابي، لا معنى الوصية؛ كما أن التنكير في اليونانية يوافق هنا «عهدٍ جديد».
- source_word: μεσίτῃ
  choice: وسيط
  rationale: لفظ عربي واضح يحفظ المعنى العهدي والقانوني لمن يتوسط بين طرفين.
- source_word: Ἰησοῦ
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم.
- source_word: αἵματι ῥαντισμοῦ
  choice: دمِ الرشِّ
  rationale: يحفظ تركيب المصدر وصورة الدم الذي يُطبَّق بالرش في سياق العهد والتطهير، من غير حصر العبارة في صياغة تفسيرية واحدة.
- source_word: κρεῖττον λαλοῦντι
  choice: الذي يتكلّم بما هو أفضل
  rationale: صياغة عربية طبيعية تحافظ على فعل الكلام وعلى دلالة المقارنة في κρεῖττον.
- source_word: παρὰ τὸν Ἅβελ
  choice: من هابيل
  rationale: يحافظ على إيجاز النص اليوناني، الذي يذكر هابيل نفسه ولا يصرّح بعبارة «دم هابيل».
theological_decisions:
- issue: مرجع المقارنة بهابيل
  choice: الإبقاء في المتن على «أفضل من هابيل»
  alternative: «أفضل من دم هابيل»
  rationale: يرجّح السياق التلميح إلى دم هابيل الصارخ من الأرض، لكن اليونانية تذكر هابيل وحده. لذلك يحفظ المتن الإيجاز والتوتر التفسيري، وتوضح الحاشية الاحتمال.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. وُضعت علامة الحاشية [a] عند «هابيل» وعلامة [b] عند «دم الرش» لتطابق كل حاشية موضعها الدلالي، مع إبقاء اتصال الآية بما قبلها بواسطة «وإلى».
