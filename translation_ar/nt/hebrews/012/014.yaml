  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: ar
  text: اسعوا إلى السلام مع الجميع، وإلى القداسة[a] التي من دونها لن يرى أحد الرب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «التقديس». يمكن أن تشير الكلمة اليونانية إما إلى القداسة بوصفها صفة للحياة، وإما إلى التقديس بوصفه حالة أو عملية جعل الإنسان مقدسًا.
    reason: بديل معجمي
lexical_decisions:
- source_word: Εἰρήνην
  choice: السلام
  rationale: تدل الكلمة هنا، مع عبارة «مع الجميع»، على العيش في سلام مع الآخرين، لا على مجرد شعور داخلي.
- source_word: διώκετε
  choice: اسعوا إلى
  rationale: تنقل صيغة الأمر معنى الطلب الجاد والمثابر، وهي عربية طبيعية واضحة.
- source_word: μετὰ πάντων
  choice: مع الجميع
  rationale: تحفظ شمول العبارة لجميع الناس بصياغة عربية موجزة وطبيعية.
- source_word: τὸν ἁγιασμόν
  choice: القداسة
  rationale: يمكن أن تدل الكلمة على القداسة بوصفها صفة للحياة أو على التقديس بوصفه حالة أو مسارًا. «القداسة» أوضح في هذا السياق الوعظي، مع إثبات البديل في الحاشية.
- source_word: οὗ χωρὶς
  choice: التي بدونها
  rationale: يعود الضمير الموصول بحسب أقرب مرجع نحوي إلى «القداسة»، وتحفظ العبارة العلاقة الصريحة في الأصل.
- source_word: οὐδεὶς ὄψεται
  choice: لن يرى أحد
  rationale: تنقل النفي المطلق وصيغة المستقبل بوضوح ومن دون زيادة تفسيرية.
- source_word: τὸν κύριον
  choice: الرب
  rationale: تحفظ اللقب الوارد في اليونانية من غير تعيين مرجعه بما يتجاوز النص.
theological_decisions:
- issue: دلالة ἁγιασμός في سياق الوصية
  choice: القداسة
  alternative: التقديس
  rationale: يركز السياق على واقع مقدس ينبغي السعي إليه، و«القداسة» مفهومة للقارئ العام ولا تحصر اللفظ في مصطلح لاهوتي تقني؛ أما احتمال معنى الحالة أو المسار فمحفوظ في الحاشية.
- issue: مرجع لقب «الرب»
  choice: الإبقاء على «الرب» من غير تحديد
  alternative: الله؛ الرب يسوع
  rationale: لا يحدد النص اليوناني المرجع بأكثر من اللقب، لذلك لا تحسم الترجمة ما تركه الأصل غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «اسعوا إلى» لإبراز الجهد المستمر، ووُضعت علامة الحاشية بعد «القداسة» لأنها تتعلق بالمصطلح اليوناني ἁγιασμός.
