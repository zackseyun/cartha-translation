  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: ar
  text: وانتبهوا جيدًا لئلا يقصِّر أحدٌ عن نعمة الله[a]، ولئلا ينمو جذرُ مرارةٍ صاعدًا فيُسبِّب متاعب، فيتنجَّس بسببه كثيرون[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يفشل أحدٌ في نيل نعمة الله». يمكن أن تدل العبارة اليونانية على عدم بلوغ ما هو معروض، كما تدل على القصور عنه.'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن عبارة «جذر مرارة» تلمّح إلى تثنية 29:18، حيث يرمز الجذر السام إلى خيانة العهد التي تنتشر داخل الجماعة.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: ساهرين بعناية
  rationale: يحافظ على معنى المراقبة اليقظة والإشراف الذي يفيده اسم الفاعل الحاضر، بصياغة عربية واضحة غير مؤسسية.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: لئلا يقصِّر أحدٌ عن نيل نعمة الله
  rationale: ينقل معنى عدم بلوغ ما هو معروض أو القصور عنه، ويحافظ على التحذير من غير حسم الجدل اللاهوتي المتعلق بفقدان الخلاص أو عدم قبول النعمة.
- source_word: χάριτος
  choice: نعمة
  rationale: هو المقابل الكتابي العربي الواضح الذي يحفظ الدلالة اللاهوتية والسياق العهدي للفظ اليوناني.
- source_word: ῥίζα πικρίας
  choice: جذر مرارة
  rationale: ترجمة قريبة من التركيب اليوناني، وتحفظ الصورة النباتية والصدى المرجح لتثنية 29:18.
- source_word: ἄνω φύουσα
  choice: ينبت
  rationale: يعبّر طبيعيًا عن بروز الجذر ونموه إلى أعلى من غير إثقال العبارة العربية بتفصيل مكاني غير مألوف.
- source_word: ἐνοχλῇ
  choice: فيسبِّب اضطرابًا
  rationale: ينقل معنى الإزعاج وإحداث المتاعب، مع إبراز الأثر الذي يصيب الجماعة.
- source_word: δι’ αὐτῆς
  choice: بسببه
  rationale: يعود الضمير إلى «جذر» بحسب جنس الاسم في العربية، وينقل دلالة الوساطة أو السببية في διά.
- source_word: μιανθῶσιν πολλοί
  choice: ويتنجَّس بسببه كثيرون
  rationale: يحفظ القوة الأخلاقية أو الطقسية لفعل μιαίνω، ولا يخففه إلى مجرد ضرر اجتماعي.
theological_decisions:
- issue: هل يدل التحذير على فقدان الخلاص، أم عدم نيل النعمة، أم الابتعاد عن مجالها؟
  choice: يقصِّر أحدٌ عن نيل نعمة الله
  alternative: يفشل أحدٌ في نيل نعمة الله؛ أو يفتقر أحدٌ إلى نعمة الله
  rationale: العبارة اليونانية تحتمل عدم بلوغ ما هو معروض كما تحتمل القصور عنه؛ لذلك أبقت الصياغة التحذير والتوتر اللاهوتي من غير فرض نتيجة مذهبية.
- issue: هل تُخفَّف دلالة μιαίνω إلى مجرد الإفساد أو الإزعاج الاجتماعي؟
  choice: يتنجَّس
  alternative: يتلوَّث؛ أو يفسد
  rationale: «يتنجس» يحفظ الدلالة الأخلاقية والطقسية القوية للفعل، إلى جانب أثره الجماعي.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم «ساهرين بعناية» للمحافظة على صورة اليقظة في اسم الفاعل، و«جذر مرارة» لصون الاستعارة والصدى الكتابي، مع إبقاء التحذير بشأن نعمة الله غير محسوم مذهبيًا.
