lexical_decisions:
- source_word: οὔπω
  choice: لم ... بعدُ
  rationale: ينقل الدلالة الزمنية بوضوح، أي إن الحد المذكور لم يُبلَغ إلى الآن.
- source_word: μέχρις αἵματος
  choice: حتى سفك الدم
  rationale: تعبير عربي طبيعي يبيّن بلوغ المقاومة حد إراقة الدم، مع إبقاء الصياغة الموجزة وقربها من الأصل.
- source_word: ἀντικατέστητε
  choice: تقاوموا
  rationale: فعل مناسب للمواجهة والمعارضة، ويحافظ على صورة الصراع في السياق.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: ضدّ الخطيئة
  rationale: ينقل معنى المعارضة الذي تؤديه πρός مع النصب، من غير تضييق مرجع الخطيئة.
- source_word: ἀνταγωνιζόμενοι
  choice: في مجاهدتكم
  rationale: يعكس صورة المنافسة أو الصراع المستمر التي يحملها اسم الفاعل اليوناني، ويأتي عربيًا بسلاسة مع الفعل الرئيس.
theological_decisions:
- issue: مرجع «الخطيئة» في السياق
  choice: 'إبقاء اللفظ عامًا: «الخطيئة»'
  alternative: مقاومة اضطهاد الخطاة، أو الخطيئة عمومًا، أو تجربة الارتداد عن الإيمان
  rationale: الآية لا تحدد المرجع تحديدًا ضيقًا؛ لذلك تحافظ الترجمة على الاتساع والتوتر الدلالي في النص بدل حسمه تفسيريًا.
- issue: مدى عبارة «حتى الدم»
  choice: «حتى سفك الدم» من غير التصريح بالاستشهاد أو القتل
  alternative: حتى الموت أو حتى الاستشهاد
  rationale: قد تشير العبارة إلى جرح دموي أو موت، لكن الأصل لا يصرح بأحدهما، فلا تُقيَّد بدلالة لاهوتية أضيق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «مجاهدتكم» بمعنى بذل الجهد في الصراع، لا بوصفها مصطلحًا طائفيًا أو سياسيًا، وحُفظ إيقاع الآية الموجز.
