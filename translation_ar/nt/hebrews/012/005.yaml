source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: ar
  text: 'وقد نسيتم الموعظة التي تخاطبكم بوصفكم بنين: «يا بُنَيَّ[a]، لا تستخفّ بتأديب الرب[b][c]، ولا تفتر حين يوبّخك الرب».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: صيغة «يا بُنَيَّ» تقتبس لغة الأمثال عن الابن، والخطاب موجَّه إلى جماعة المؤمنين بوصفهم أبناء.
    reason: lexical_alternative
  - marker: b
    text: يمكن أن يشمل «التأديب» التدريب والتربية والتعليم والتقويم، لا العقوبة وحدها.
    reason: lexical_alternative
  - marker: c
    text: اقتباس من أمثال 3:11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: نسيتم
  rationale: ينقل صيغة التام اليونانية بوصف النسيان واقعًا ما زال أثره قائمًا، ويحافظ على نبرة العتاب بصياغة عربية طبيعية.
- source_word: παρακλήσεως
  choice: الوصية
  rationale: اللفظة تحتمل الحث والتشجيع والتعزية؛ وفي هذا السياق تقدّم قولًا إرشاديًا تحذيريًا من الأمثال، و«الوصية» تجمع هنا معنى الحث والإرشاد دون قصرها على التعزية.
- source_word: ἥτις ... διαλέγεται
  choice: التي تخاطبكم
  rationale: تؤدي معنى كلام النص الموجَّه مباشرة إلى السامعين، وهي أفصح وأطبع في العربية من الترجمة الحرفية «تتحاور معكم».
- source_word: ὡς υἱοῖς
  choice: كبنين
  rationale: يحافظ على لغة البنوة المذكرة الصريحة في اليونانية وعلى صلتها باقتباس الأمثال وسياق الرسالة.
- source_word: Υἱέ μου
  choice: يا بُنَيَّ
  rationale: ينقل المفرد المنادى «ابني» بصيغة عربية طبيعية ذات نبرة أبوية، ويحفظ رابط الاقتباس مع أمثال 3:11.
- source_word: ὀλιγώρει
  choice: لا تستخفّ
  rationale: يعبر بوضوح عن عدم عدّ تأديب الرب أمرًا هينًا أو قليل الشأن، من غير تقوية المعنى إلى «تحتقر».
- source_word: παιδείας
  choice: تأديب
  rationale: «التأديب» في العربية يشمل التهذيب والتربية والتصحيح، ويلائم سياق علاقة الأب بابنه دون حصر المعنى في العقوبة.
- source_word: κυρίου
  choice: الرب
  rationale: يحفظ اللقب الإلهي والعلاقة الإضافية في التعبير «تأديب الرب».
- source_word: ἐκλύου
  choice: لا تفتر
  rationale: ينقل معنى الانهيار الداخلي والوهن تحت التصحيح، وهو تعبير عربي موجز ومألوف في هذا السياق.
- source_word: ἐλεγχόμενος
  choice: حين يوبّخك
  rationale: ينقل معنى الكشف عن الخطأ والزجر التصحيحي، مع الحفاظ على قوة الفعل في سياق التأديب الأبوي.
theological_decisions:
- issue: لغة البنوة المذكرة في الخطاب
  choice: كبنين / يا بُنَيَّ
  alternative: كأولاد / يا ولدي
  rationale: النص اليوناني يستعمل «بنين» ثم «ابني» عمدًا، اقتباسًا من الأمثال وضمن حجة الرسالة عن البنوة؛ لذلك تُحفظ الصيغة في المتن، مع بيان شمول الخطاب للمؤمنين في الحاشية.
- issue: مدى معنى παιδεία في علاقة الله بالمؤمن
  choice: تأديب
  alternative: تدريب أو تعليم أو تقويم
  rationale: المصطلح يجمع التربية التكوينية والتصحيح المؤلم؛ و«تأديب» يحفظ هذا التوتر ولا يقصره على العقوبة وحدها أو التعليم وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظت لغة البنوة وصيغة الاقتباس، واستُعملت ألفاظ مألوفة غير طائفية. رُتبت علامتا الحاشية [b][c] بعد «تأديب الرب» لتطابقا موضوعيهما.
