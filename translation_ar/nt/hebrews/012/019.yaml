  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: ar
  text: وإلى صوتِ بوقٍ، وإلى صوتِ كلماتٍ[a][b]، الذي توسَّل سامعوه ألّا تُقال لهم كلمةٌ أخرى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «والذين سمعوا ذلك توسّلوا ألّا تُقال لهم كلمةٌ أخرى»، إذا عُدَّ الضمير عائدًا على نحو أوسع إلى تجلّي سيناء كله، لا إلى «صوت كلمات» وحده.'
    reason: alternative_reading
  - marker: b
    text: 'انظر الخروج 20: 18–19 والتثنية 5: 23–27، حيث طلب بنو إسرائيل ألّا يعودوا يسمعون صوت الله مباشرة.'
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: صوتِ بوقٍ
  rationale: ينقل الظاهرة السمعية في مشهد سيناء بعبارة عربية واضحة، ويحافظ على اللفظ المحسوس من غير أن يضيف تحديدًا لشدّة الصوت.
- source_word: φωνῇ ῥημάτων
  choice: صوتِ كلماتٍ
  rationale: يحافظ على التركيب اليوناني اللافت وعلى معنى الكلام المفهوم، بدل تسويته إلى مجرد ضجيج أو إضافة فعل غير مصرّح به.
- source_word: ἧς
  choice: سامعوه
  rationale: يعود ضمير الجمع في «سامعوه» مباشرة إلى «صوت كلمات»، وهو أقرب مرجع نحوي للضمير الموصول المؤنث المفرد في اليونانية؛ وتُذكر في الحاشية إمكانية شموله للمشهد كله.
- source_word: οἱ ἀκούσαντες
  choice: سامعوه
  rationale: صياغة عربية موجزة وطبيعية تمثل اسم الفاعل اليوناني وتشير إلى الذين سمعوا الصوت.
- source_word: παρῃτήσαντο
  choice: توسَّل
  rationale: يعكس الطلب الملحّ بأن يُعفَوا من سماع الخطاب الإلهي مباشرة، وهو أنسب للسياق من «رفض» أو «امتنع».
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: ألّا تُقال لهم كلمةٌ أخرى
  rationale: ينقل مضمون الالتماس ويحفظ المبني للمجهول وإفراد «كلمة»، بينما تؤدي «أخرى» معنى عدم إضافة كلام لاحق بعبارة عربية مفهومة.
theological_decisions:
- issue: مرجع الضمير الموصول ἧς
  choice: جُعلت الجملة عائدة مباشرة إلى «صوت كلمات».
  alternative: يمكن فهم الضمير على أنه يشير على نحو أوسع إلى تجلّي سيناء السابق كله، بما فيه صوت البوق والصوت الناطق.
  rationale: المطابقة في التأنيث والإفراد وأقرب مرجع نحوي يرجحان «الصوت»، لكن سياق سيناء يسمح بأن يكون النفور من مجمل الظاهرة؛ لذلك حُفظ الاحتمال الأوسع في الحاشية من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. حُفظ تكرار «وإلى» لارتباط الآية بقائمة الآية السابقة، كما حُفظ التعبير غير المألوف نسبيًا «صوت كلمات» لما فيه من صورة مقصودة في الأصل.
