id: HEB.12.8
reference: Hebrews 12:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: ar
  text: ولكن إن كنتم بلا تأديب، وقد صار الجميع شركاء فيه، فأنتم إذًا أولاد غير شرعيين لا أبناء.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: تأديب
  rationale: يدل في السياق على التربية التقويمية التي يمارسها الأب، و«تأديب» يحفظ بُعدي التربية والتصحيح.
- source_word: μέτοχοι γεγόνασι
  choice: صار الجميع شركاء فيه
  rationale: ينقل معنى الاشتراك الفعلي في التأديب مع الحفاظ على دلالة الفعل التام على حالة صارت قائمة.
- source_word: νόθοι
  choice: أولاد غير شرعيين
  rationale: تعبير عربي واضح ينقل معنى الأولاد الذين لا يتمتعون بوضع الأبناء المعترف بهم، من غير استعمال لفظ جارح أو غامض.
- source_word: υἱοί
  choice: أبناء
  rationale: يحافظ على المقابلة المقصودة بين الأولاد غير الشرعيين والأبناء الحقيقيين في صورة العلاقة الأبوية.
theological_decisions:
- issue: مدى شمول πάντες («الجميع»)
  choice: إبقاء «الجميع» بلا تقييد
  alternative: «جميع الأبناء» أو «جميع المؤمنين»
  rationale: النص اليوناني لا يصرّح بمرجع «الجميع»، والسياق يوضحه دون الحاجة إلى إضافة تفسيرية تحسمه.
- issue: طبيعة التأديب
  choice: عدم إضافة وصف مثل «الإلهي» أو «الأبوي» داخل الآية
  alternative: «تأديب الله» أو «تأديب الأب»
  rationale: السياق يبيّن مصدر التأديب، لكن الآية نفسها تذكره بإطلاق؛ لذا تُحفظ صياغتها دون توسعة عقائدية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وكريمة، تحافظ على بنية الشرط والنتيجة وعلى حدة المقابلة في الأصل من غير زيادة تفسيرية.
