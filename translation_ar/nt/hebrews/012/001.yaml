source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: ar
  text: لذلك، إذ يحيط بنا نحن أيضًا هذا السحاب العظيم من الشهود، فلنطرح عنا كل ثقل والخطيئة التي توقعنا بسهولة في شَرَكها[a]، ولنركض بمثابرة في السباق الموضوع أمامنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الخطيئة التي تلتصق بنا التصاقًا وثيقًا» أو «الخطيئة التي تلتف حولنا بسهولة». الصفة اليونانية نادرة، ويُختلف في دلالتها بين الالتصاق الوثيق، أو الالتفاف والتعويق، أو الإيقاع في الشرك بسهولة.'
    reason: بديل معجمي بسبب الغموض الحقيقي في معنى εὐπερίστατον.
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: لذلك
  rationale: أداة استنتاج تربط الحث بما سبق، ولا سيما عرض شهود الإيمان في الأصحاح الحادي عشر.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: هذا السحاب العظيم من الشهود
  rationale: يحفظ صورة السحاب الدالة على الكثرة، وقوة الوصف، ولفظ «الشهود» من غير حصره في معنى المتفرجين.
- source_word: περικείμενον ἡμῖν
  choice: يحيط بنا
  rationale: تعبير عربي طبيعي يحفظ الصورة المكانية لوجود الشهود من كل جانب.
- source_word: ὄγκον ... πάντα
  choice: كل ثقل
  rationale: يحفظ الاستعارة الرياضية لما يثقل العداء ويعوق تقدمه، من غير قصره على نوع محدد من العوائق.
- source_word: ἀποθέμενοι
  choice: فلنطرح عنا
  rationale: ينقل معنى الإزالة الحاسمة، ويصوغ اسم الفاعل اليوناني في حث عربي واضح متصل بالفعل الرئيس.
- source_word: τὴν εὐπερίστατον ἁμαρτίαν
  choice: الخطيئة التي توقعنا بسهولة في شَرَكها
  rationale: ينقل أحد المعاني السياقية المرجحة للصفة اليونانية النادرة، وهو سهولة الإيقاع في الشرك أو العرقلة، مع إثبات البدائل الحقيقية في الحاشية.
- source_word: δι’ ὑπομονῆς
  choice: بثبات
  rationale: يعبر بإيجاز عن المثابرة والصمود تحت المشقة، ويلائم صورة السباق.
- source_word: τρέχωμεν
  choice: لنركض
  rationale: ينقل صيغة الحث بصيغة المتكلم الجمع بوضوح وطبيعية.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: في السباق الموضوع أمامنا
  rationale: يفهم ἀγών في ضوء فعل الركض بوصفه سباقًا، مع حفظ معنى المسار أو التحدي الموضوع أمام المؤمنين.
theological_decisions:
- issue: دلالة «الشهود» وصلتها بالعبرانيين 11
  choice: الإبقاء على «الشهود» بما يسمح بأن تكون حياتهم شهادة للإيمان، مع بقاء صورة إحاطتهم بالمؤمنين
  alternative: اعتبارهم أساسًا مشاهدين سماويين يراقبون السباق
  rationale: السياق السابق يعرض أناسًا شهدت حياتهم للإيمان والثبات، لكن اللفظ والصورة لا يقتضيان الجزم بأنهم متفرجون يراقبون؛ لذلك تُحفظ مساحة الدلالة والتوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظت استعارتا السحاب والسباق، واستُخدمت صيغة الحث الجمعي «فلنطرح... ولنركض». وُضع رمز الحاشية عقب العبارة التي تفسر الصفة اليونانية المختلف في معناها.
