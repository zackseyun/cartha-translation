  text: فَإِنَّ اللهَ، لَمَّا وَعَدَ إِبْرَاهِيمَ[a]، إِذْ لَمْ يَكُنْ أَحَدٌ أَعْظَمَ مِنْهُ لِيَحْلِفَ بِهِ[b]، حَلَفَ بِنَفْسِهِ،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لَمَّا أَعْطَى اللهُ إِبْرَاهِيمَ وَعْدًا».'
    reason: lexical_alternative
  - marker: b
