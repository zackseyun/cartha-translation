    reason: previous_rendering
lexical_decisions:
- source_word: ἐπαγγειλάμενος
  choice: لَمَّا وَعَدَ
  rationale: ينقل اسم الفاعل الماضي معنى الوعد السابق ويربطه بالفعل الرئيس ربطًا طبيعيًا في العربية؛ والمفعول به مفهوم من السياق.
- source_word: ἐπεὶ
  choice: إِذْ
  rationale: تؤدي هنا المعنى السببي، فتبيّن سبب حلف الله بنفسه، مع الحفاظ على أسلوب عربي فصيح.
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: مَنْ هُوَ أَعْظَمُ مِنْهُ ... بِهِ
  rationale: سياق الحلف يرجّح مرجعًا شخصيًا، والمقارنة تتضمن أن المقصود أعظم من الله، وهو ما صُرّح به في العربية منعًا للالتباس.
- source_word: ὀμόσαι
  choice: لِيَحْلِفَ
  rationale: يحفظ معنى المصدر وصِلته الغائية أو الإمكانية بالبنية السابقة، كما يحافظ على التكرار المعجمي مع الفعل التالي.
- source_word: ὤμοσεν
  choice: حَلَفَ
  rationale: ترجمة مباشرة موجزة للماضي، وتحفظ التكرار المقصود لجذر الحلف.
- source_word: καθ’ ἑαυτοῦ
  choice: بِنَفْسِهِ
  rationale: هذا هو التعبير العربي الاصطلاحي للحلف بالنفس، ويحفظ دلالة عدم الاحتكام إلى مَنْ هو أعلى.
- source_word: γὰρ
  choice: فَإِنَّ
  rationale: يبين الصلة التفسيرية بما سبق، ويأتي طبيعيًا في مطلع الجملة العربية.
- source_word: Τῷ ... Ἀβραὰμ
  choice: إِبْرَاهِيمَ
  rationale: جُعل إبراهيم مفعولًا غير مباشر دلاليًا للفعل «وعد»، وهي صياغة عربية طبيعية تؤدي معنى متلقي الوعد.
theological_decisions:
- issue: طبيعة قسم الله
  choice: حلف الله بنفسه لأنه لم يكن هناك من هو أعظم منه ليحلف به.
  alternative: حلف الله على نفسه أو لم يكن عنده أعظم ليحلف به.
  rationale: يحفظ النص علة القسم وسيادة الله الفريدة من غير توسيعها إلى صياغة عقائدية لاحقة، ويتجنب فهم العبارة على معنى «على نفسه» بدل «بنفسه».
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «وعد إبراهيم» لطبيعتها في العربية، و«فإن» لإظهار الصلة التفسيرية، مع إبقاء علامات الحواشي [a] و[b] في موضعها من المتن.
