base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: ar
  text: حيث دخل يسوع، كسابقٍ من أجلنا[a]، بعد أن صار رئيسَ كهنةٍ إلى الأبد بحسب رتبة ملكي صادق[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نيابةً عنا». يمكن للعبارة اليونانية أن تدل على العمل لمنفعة الآخرين وبالنيابة عنهم؛ وهنا تبرز أن يسوع دخل ممثلًا لنا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «على رتبة ملكي صادق»، في صدى لمزمور 110:4.'
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: حيث
  rationale: تعود على الموضع الذي وراء الحجاب في العدد السابق، وتحافظ على الدلالة المكانية من غير زيادة تفسيرية.
- source_word: πρόδρομος
  choice: سابقًا لنا
  rationale: ينقل صورة من يتقدم غيره ويفتح أمامه الطريق، وهو أوضح للقارئ المعاصر من استعمال اسم اصطلاحي غير مألوف.
- source_word: ὑπὲρ ἡμῶν
  choice: من أجلنا
  rationale: تدل العبارة هنا على العمل لمنفعتنا وبالنيابة عنا، من غير حصرها في معنى إحلالي أضيق لا يصرح به السياق.
- source_word: εἰσῆλθεν
  choice: دخل
  rationale: ينقل الماضي اليوناني بوضوح، بينما يُفهم الأثر المستمر للدخول من السياق.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية الكتابية المعيارية للاسم.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: على رتبة ملكي صادق
  rationale: صياغة عربية مألوفة تحافظ على صدى مزمور 110:4 وعلى معنى النمط أو الرتبة.
- source_word: ἀρχιερεὺς
  choice: رئيس كهنة
  rationale: المقابل العربي الدقيق والمستقر للمنصب الكهنوتي المحوري في الرسالة إلى العبرانيين.
- source_word: γενόμενος
  choice: وصار
  rationale: يحافظ على المعنى الفعلي للمشاركة اليونانية ويصف تولّي المقام الكهنوتي، من غير أن يدل على بدء وجود يسوع أو تغير طبيعته.
- source_word: εἰς τὸν αἰῶνα
  choice: إلى الأبد
  rationale: تعبير عربي طبيعي عن الدوام المستمر المقصود في السياق.
theological_decisions:
- issue: دلالة γενόμενος في الحديث عن المسيح
  choice: وصار رئيس كهنة
  alternative: وقد أُقيم رئيس كهنة
  rationale: تحافظ الصياغة على الفعل اليوناني بوصفه متعلقًا بالمقام والوظيفة الكهنوتيين، ولا توحي بأن يسوع بدأ في الوجود أو تبدلت طبيعته.
- issue: قوة ὑπὲρ ἡμῶν
  choice: من أجلنا
  alternative: نيابة عنا
  rationale: تبقي العبارة واسعة لتشمل المنفعة والتمثيل، ولا تحسمها في صيغة إحلالية أضيق من دلالة هذا الموضع.
- issue: صورة πρόδρομος وصلتها بالمؤمنين
  choice: سابقًا لنا
  alternative: كسابق من أجلنا
  rationale: تُظهر أن يسوع تقدم المؤمنين إلى الموضع المقصود، من غير أن تضيف شرحًا عقائديًا غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «سابقًا لنا» لإبراز صورة من يدخل أولًا فاتحًا الطريق، مع إبقاء «من أجلنا» مستقلة للمحافظة على دلالة ὑπὲρ ἡμῶν. وُضعت علامتا الحاشيتين في المتن.
