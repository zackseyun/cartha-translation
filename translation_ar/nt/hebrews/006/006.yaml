source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: ar
  text: وَقَدْ سَقَطُوا[a]، أَنْ يُجَدَّدُوا مَرَّةً أُخْرَى لِلتَّوْبَةِ[b]، إِذْ يَصْلِبُونَ لأَنْفُسِهِمُ ابْنَ اللهِ مِنْ جَدِيدٍ وَيُعَرِّضُونَهُ لِلْعَارِ عَلَنًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وارتدّوا». يدل الفعل اليوناني على سقوط خطير أو ارتداد.
    reason: lexical_alternative
  - marker: b
    text: أو «ما داموا يصلبون لأنفسهم ابن الله من جديد ويعرّضونه للعار علنًا». يمكن فهم صيغتي الفعل اليونانيتين على أنهما متزامنتان مع محاولة التجديد، كما يمكن فهمهما على أنهما تفسّران تعذّرها.
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: سقطوا بعد ذلك
  rationale: ينقل معنى السقوط الخطير أو الارتداد في السياق من غير إدخال مصطلح عقائدي تقني في المتن، ويحافظ على الصيغة التابعة نحويًا لما قبلها.
- source_word: πάλιν
  choice: مرة أخرى
  rationale: يتعلق طبيعيًا بفعل التجديد ويفيد تكراره.
- source_word: ἀνακαινίζειν
  choice: أن يتجددوا
  rationale: يعبر عن إعادتهم إلى حالة سابقة، وصيغة المبني للمعلوم العربي بمعنى المطاوعة طبيعية هنا مع بقاء الفاعل الضمني من السياق السابق.
- source_word: εἰς μετάνοιαν
  choice: للتوبة
  rationale: تحفظ معنى الغاية أو النتيجة في εἰς، وتستعمل المقابل العربي الواضح والمألوف لـ μετάνοια.
- source_word: ἀνασταυροῦντας
  choice: يصلبون ... من جديد
  rationale: ينقل معنى إعادة الصلب ويحافظ على الجانب المستمر لاسم الفاعل المضارع اليوناني.
- source_word: ἑαυτοῖς
  choice: لأنفسهم
  rationale: يحفظ دلالة ضمير الانعكاس في حالة المجرور، أي أن موقفهم وفعلهم محسوبان عليهم وفيما يخصهم.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: ابن الله
  rationale: المقابل العربي المباشر للقب المسيحاني، مع التعريف بالإضافة.
- source_word: παραδειγματίζοντας
  choice: يشهّرون به
  rationale: يفيد تعريضه علنًا للخزي والعار، وهو تعبير عربي طبيعي وواضح.
- source_word: καὶ ... καὶ
  choice: و... و
  rationale: يحافظ على عطف الفعلين اللذين يصفان الظرف أو العلة.
theological_decisions:
- issue: هل يُصرَّح في هذه الآية وحدها بالاستحالة المذكورة في الآية السابقة؟
  choice: أُبقيت العبارة تابعة نحويًا لما قبلها، من غير إضافة «يستحيل».
  alternative: 'أن يقال: «يستحيل أن يتجددوا مرة أخرى للتوبة».'
  rationale: النص اليوناني في هذه الآية لا يحتوي فعلًا جديدًا يدل على الاستحالة، بل يتمم تركيب عبرانيين 6:4–6.
- issue: طبيعة السقوط
  choice: «سقطوا بعد ذلك» مع حاشية تبين احتمال الارتداد.
  alternative: «ارتدوا» أو «جحدوا الإيمان».
  rationale: يحفظ شدة التحذير من غير حسم الخلافات اللاحقة حول فقدان الخلاص أو حقيقة الإيمان السابق.
- issue: دلالة اسمي الفاعل ἀνασταυροῦντας وπαραδειγματίζοντας
  choice: رُبطا بما قبلهما بأداة «إذ» التي تحتمل البيان والظرفية.
  alternative: «لأنهم يصلبون...» أو «ما داموا يصلبون...».
  rationale: «إذ» تحفظ قدرًا أكبر من غموض العلاقة اليونانية، التي يمكن فهمها تعليلية أو متزامنة، بدل حصرها في التعليل وحده.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. حُفظ اعتماد الآية نحويًا على السياق السابق، واستُعملت «إذ» لصون الاحتمال بين الدلالة التفسيرية والدلالة الزمنية. أُثبتت علامتا الحاشيتين [a] و[b] في المتن.
