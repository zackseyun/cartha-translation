revisions:
- from: وَسَقَطُوا بَعْدَ ذَلِكَ[a]، أَنْ يَتَجَدَّدُوا مَرَّةً أُخْرَى لِلتَّوْبَةِ[b]، إِذْ يَصْلِبُونَ لِأَنْفُسِهِمُ ابْنَ اللهِ مِنْ جَدِيدٍ، وَيُشَهِّرُونَ بِهِ.
  to: وَقَدْ سَقَطُوا[a]، أَنْ يُجَدَّدُوا مَرَّةً أُخْرَى لِلتَّوْبَةِ[b]، إِذْ يَصْلِبُونَ لأَنْفُسِهِمُ ابْنَ اللهِ مِنْ جَدِيدٍ وَيُعَرِّضُونَهُ لِلْعَارِ عَلَنًا.
  rationale: حُذفت الإضافة الزمنية غير المسندة إلى اليونانية، واستُبدلت صيغة المطاوعة بصيغة المبني للمجهول لتؤدي معنى «تجديدهم» مع استمرار اعتماد الآية على الفاعل/المفعول المذكور في السياق السابق. كما صيغ فعل العار العلني بعبارة عربية صريحة. وتحفظ «إذ» إمكان الفهم التفسيري أو الزمني لاسمي الفاعل اليونانيين.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:27:57Z'
review_pass:
  verdict: revise
  source_fidelity: يلزم حذف «بعد ذلك»، إذ لا يقابلها عنصر في παραπεσόντας ولا يقتضيها السياق النحوي. كما أن «يتجددوا» فعل لازم/مطاوع في العربية، في حين أن ἀνακαινίζειν فعل متعدٍّ مع مفعوله الذين تصفه التراكيب السابقة؛ فصيغة المبني للمجهول «يُجدَّدوا» أنسب هنا مع الحفاظ على تبعية العبارة للآيات السابقة.
  naturalness: النص المنقح فصيح واضح، ويحافظ عمدًا على عدم اكتمال الجملة استقلالًا لأنه امتداد للتركيب في عبرانيين 6:4–6. و«يُشهِّرون به» طبيعي، لكن «يعرّضونه للعار علنًا» أصرح في نقل معنى παραδειγματίζοντας.
  terminology: «التوبة» و«ابن الله» مناسبان. وتبقى «سقطوا» في المتن غير محمّلة بمصطلح مذهبي؛ وتعرض الحاشية «ارتدّوا» بوصفه بديلًا معجميًا ممكنًا.
  issues:
  - severity: medium
    issue: إضافة «بعد ذلك»
    rationale: لا توجد في النص اليوناني كلمة تقابل «بعد ذلك». وقد توحي بترتيب زمني محدد زائد على دلالة اسم الفاعل الماضي παραπεσόντας.
  - severity: medium
    issue: «أن يتجددوا» لا ينقل تعدية ἀνακαινίζειν بوضوح
    rationale: الفعل اليوناني يعني تجديدهم/إعادتهم إلى التوبة، لا مجرد أن يتجددوا من تلقاء أنفسهم. «أن يُجدَّدوا» يحافظ على المفعول المتلقي للفعل وعلى اتصال العبارة بالسياق السابق.
  - severity: low
    issue: «يشهّرون به» أقل صراحة في معنى التعريض العلني للعار
    rationale: هو جائز، لكن «يعرّضونه للعار علنًا» يبيّن بدقة عنصر الإذلال العلني في παραδειγματίζοντας.
