  rationale: استُبدلت العبارة الختامية بصياغة عربية طبيعية تؤدي وظيفة الفعل اليوناني في السياق، وهي تأكيد الأمر بالقسم. كما أُعيدت صياغة البديل في الحاشية لتكون أقرب إلى اللفظ وأبعد عن الإيحاء بوسيط. ولم يتغير المعنى أو مرجع الحواشي.
