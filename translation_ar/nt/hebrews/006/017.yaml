  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: ar
  text: لذلك، إذ أراد الله أن يبيّن لورثة الوعد، بمزيد من الوضوح، ثبات قصده الذي لا يتغيّر[a]، أكّد ذلك بقسم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثبات مشورته وعدم تغيّرها».'
    reason: lexical_alternative
  - marker: b
    text: 'أو، على نحو أقرب إلى اللفظ: «تدخّل بقسم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: لذلك، إذ
  rationale: تؤدي العبارة وظيفة الربط بما سبق، مع بيان الظرف الذي فيه أضاف الله القسم إلى الوعد؛ وهذه الصياغة أوضح في العربية من النقل الحرفي «في الذي».
- source_word: περισσότερον
  choice: بمزيد من الوضوح
  rationale: يفيد الظرف المقارن زيادة الإظهار أو توكيده، ويتصل طبيعيًا بالفعل «يبيّن».
- source_word: βουλόμενος
  choice: أراد
  rationale: يدل اسم الفاعل على قصد الله المتعمد، لا على مجرد تمنٍّ.
- source_word: ἐπιδεῖξαι
  choice: أن يبيّن
  rationale: ينقل معنى الإظهار والبرهنة بلغة عربية واضحة ومباشرة.
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: لورثة الوعد
  rationale: يحافظ على صورة الميراث وعلى إضافة الورثة إلى الوعد كما في اليونانية.
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: أن قصده ثابت لا يتغيّر
  rationale: يعبّر بوضوح عن عدم إمكان تبديل قصد الله، من غير إدخال مصطلح فلسفي أو لاهوتي تقني.
- source_word: ἐμεσίτευσεν ὅρκῳ
  choice: قدّم قسمًا ضمانًا لذلك
  rationale: ينقل الوظيفة السياقية للفعل النادر، وهي منح الورثة ضمانًا مؤكدًا بواسطة القسم، مع بيان البديل الأقرب إلى اللفظ في الحاشية.
theological_decisions:
- issue: ثبات قصد الله
  choice: أن قصده ثابت لا يتغيّر
  alternative: ثبات مشورته وعدم تغيّرها
  rationale: يثبت النص عدم تغيّر قصد الله في أمر الوعد، لكن الصياغة تتجنب تحميل العبارة مقولات ميتافيزيقية أوسع مما يقوله السياق.
- issue: دلالة ἐμεσίτευσεν وعلاقة القسم بالوعد
  choice: قدّم قسمًا ضمانًا لذلك
  alternative: توسّط بقسم
  rationale: المعنى السياقي هو أن الله زاد القسم توكيدًا وضمانًا. أما «توسّط بقسم» فأقرب إلى البنية المعجمية، لكنه قد يوهم وجود وسيط آخر أو علاقة تحكيم لا يقصدها السياق.
translation_notes:
  register: العربية فصحى معاصرة، واضحة ورصينة. استُعمل «قصد» بدل «مشورة» في المتن لأنه أوضح للقارئ العام، وحُفظت الصياغة الأقرب إلى اللفظ في الحاشية. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسّرهما كل حاشية.
