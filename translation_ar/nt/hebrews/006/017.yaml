review_pass:
  verdict: revise
  source_fidelity: 'ينقل المتن بدقة عناصر الآية الأساسية: قصد الله، وإظهار ثبات قصده لورثة الوعد، وإضافة القسم توكيدًا. إلا أن «قدّم قسمًا ضمانًا لذلك» أقل التصاقًا بوظيفة ἐμεσίτευσεν ὅρκῳ؛ فالفعل يفيد التدخل/التأكيد بالقسم، لا مجرد تقديم قسم بوصفه شيئًا مستقلًا.'
