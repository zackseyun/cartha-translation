  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: ar
  text: فالناس يقسمون بمن هو أعظم منهم، والقَسَم عندهم نهاية كل نزاع للتأكيد.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωποι
  choice: الناس
  rationale: جمع عام يشير إلى البشر عمومًا، لا إلى الذكور خاصة، ويلائم صياغة الحكمة العامة في العربية المعاصرة.
- source_word: κατὰ τοῦ μείζονος
  choice: بمن هو أعظم منهم
  rationale: تفيد κατά مع المضاف إليه في سياق القسم الاستحلاف بسلطة أعلى، ويُظهر التعبير قوة المقارنة من غير تعيين مرجع لم يذكره النص.
- source_word: ὀμνύουσιν
  choice: يقسمون
  rationale: فعل عربي مباشر وطبيعي للتعبير عن أداء القسم، من غير تكرار لفظ القَسَم الوارد لاحقًا.
- source_word: πάσης ... ἀντιλογίας
  choice: لكل نزاع
  rationale: تشير ἀντιλογία هنا إلى المنازعة أو الاعتراض بين أطراف، و«نزاع» واضح وملائم لسياق حسم الأمور بالقسم.
- source_word: πέρας
  choice: حدٌّ
  rationale: يحفظ معنى النهاية أو الحد الذي لا تتجاوزه المنازعة، ويوافق التركيب العربي «حدّ للنزاع».
- source_word: εἰς βεβαίωσιν
  choice: توكيدًا له
  rationale: ينقل معنى التثبيت والتصديق، مع فهم الضمير على أنه عائد إلى الأمر المتنازع عليه؛ وهذه إضافة تفسيرية طفيفة يقتضيها وضوح العربية.
- source_word: ὁ ὅρκος
  choice: القَسَم
  rationale: اسم الجنس المعرّف طبيعي في العربية ضمن تقرير قاعدة عامة، ويقابل أداة التعريف اليونانية.
theological_decisions:
- issue: الإشارة العامة إلى البشر في حكمة تقريرية
  choice: الناس
  alternative: الرجال
  rationale: لفظ ἄνθρωποι عام للبشر ولا يختص بالذكور، و«الناس» يحفظ هذا العموم ويبرز المقابلة السياقية بين البشر والله.
- issue: مرجع التوكيد في εἰς βεβαίωσιν
  choice: توكيدًا له، أي للأمر المتنازع عليه
  alternative: للتوكيد، من غير ضمير
  rationale: السياق يصف وظيفة القسم في تثبيت الأمر وحسم النزاع؛ لا يُقحم النص مضمونًا عقديًا إضافيًا، لكن الصياغة العربية توضّح الصلة المقصودة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُعمل «القَسَم» بفتح القاف لتجنب التباسه بالقِسْم، وصيغت الجملة بوصفها حكمة عامة مع الحفاظ على ترتيبها المنطقي.
