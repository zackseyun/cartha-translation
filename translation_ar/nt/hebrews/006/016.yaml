- from: فالناس يقسمون بمن هو أعظم منهم، والقَسَم عندهم حدٌّ لكل نزاع، توكيدًا له.
  to: فالناس يقسمون بمن هو أعظم منهم، والقَسَم عندهم نهاية كل نزاع للتأكيد.
  rationale: استُبدلت «حدٌّ» بـ«نهاية» لمطابقة πέρας بوضوح، وحُذف الضمير في «توكيدًا له» لتفادي تعيين مرجع غير مصرّح به في اليونانية. وتحافظ «للتأكيد» على معنى εἰς βεβαίωσιν من غير إقحام تفسير.
