  to: لَنَا هَذَا الرَّجَاءُ كَمِرْسَاةٍ لِلنَّفْسِ، مَأْمُونَةٍ وَرَاسِخَةٍ، تَدْخُلُ إِلَى الْمَوْضِعِ الدَّاخِلِيِّ خَلْفَ السِّتَارِ[a]،
  rationale: التعديل محصور في استبدال «آمنة» بـ«مأمونة» لتمثيل ἀσφαλής بوصفها موثوقية المرساة وأمانها، لا مجرد سلامتها. وأُبقيت بقية البنية والصورة المكانية والحاشية كما هي، لأنها تنقل النص اليوناني بوضوح وتحفظ بدائله الممكنة.
