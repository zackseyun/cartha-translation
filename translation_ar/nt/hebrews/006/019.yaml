  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: ar
  text: لَنَا هَذَا الرَّجَاءُ كَمِرْسَاةٍ لِلنَّفْسِ، مَأْمُونَةٍ وَرَاسِخَةٍ، تَدْخُلُ إِلَى الْمَوْضِعِ الدَّاخِلِيِّ خَلْفَ السِّتَارِ[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى الموضع الداخلي داخل الحجاب»، أو: «إلى ما وراء الحجاب».'
    reason: بديل معجمي ومكاني لعبارة εἰς τὸ ἐσώτερον τοῦ καταπετάσματος.
lexical_decisions:
- source_word: ἣν
  choice: هذا الرجاء
  rationale: الضمير الموصول المؤنث يعود إلى «الرجاء» في الآية السابقة. والتصريح بالمرجع في العربية يوضح الإحالة ويحافظ على ترابط الكلام.
- source_word: ὡς ἄγκυραν
  choice: كمرساة
  rationale: تنقل الكاف معنى المقارنة في ὡς بإيجاز طبيعي وتحفظ الصورة البحرية.
- source_word: ἔχομεν
  choice: لنا
  rationale: صياغة عربية طبيعية تؤدي معنى «لدينا/نملك» من غير ثقل، مع إبراز أن هذا الرجاء ثابت للمؤمنين.
- source_word: τῆς ψυχῆς
  choice: للنفس
  rationale: اللام تلائم علاقة المرساة بما تثبته في العربية، وتحفظ الدلالة الواسعة لـ ψυχή من غير حصرها في معنى نفسي ضيق.
- source_word: ἀσφαλῆ
  choice: آمنة
  rationale: تدل على السلامة والموثوقية في سياق المرساة، وتبقى متميزة عن معنى الثبات في βεβαίαν.
- source_word: τε καὶ
  choice: وَ...
  rationale: العطف بين الصفتين واضح في العربية، ولا تحتاج الثنائية إلى تركيب «كلا... و» الذي لا يلائم الصفتين هنا بسلاسة.
- source_word: βεβαίαν
  choice: راسخة
  rationale: تنقل معنى الثبات والاعتماد، وتنسجم طبيعيًا مع صورة المرساة من غير دمجها مع معنى ἀσφαλῆ.
- source_word: εἰσερχομένην
  choice: تدخل
  rationale: يحافظ الفعل المضارع على امتداد وصف المرساة وعلى الحركة المجازية نحو داخل المقدس.
- source_word: εἰς τὸ ἐσώτερον
  choice: إلى الموضع الداخلي
  rationale: ينقل الصفة المستعملة استعمال الاسم من غير أن يحدد «قدس الأقداس» صراحة، وهو تحديد يزيد على العبارة نفسها.
- source_word: τοῦ καταπετάσματος
  choice: خلف الستار
  rationale: يفصح عن العلاقة المكانية المفهومة من سياق المقدس، ويستعمل «الستار» بوصفه لفظًا عربيًا واضحًا يحفظ صورة الحاجز في الخيمة أو الهيكل.
theological_decisions:
- issue: صورة المقدس السماوي والستار
  choice: «إلى الموضع الداخلي خلف الستار»
  alternative: «إلى داخل الستار» أو «إلى ما وراء الحجاب»
  rationale: تحفظ الصياغة صورة المقدس وتوضح العلاقة المكانية من غير تعيين الموضع صراحة بأنه «قدس الأقداس». وتورد الحاشية البدائل الممكنة لأن تركيب اليونانية يحتمل في العربية أكثر من تعبير مكاني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «الستار» في المتن لسهولة الفهم، مع حفظ «الحجاب» في الحاشية بوصفه المقابل التقليدي المألوف. ضُبطت أواخر الصفات بما يلائم «مرساة»، وأُبقيت الفاصلة الختامية لأن الآية تستمر نحويًا في الآية التالية.
