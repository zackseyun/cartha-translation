review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام محفوظ: «هذا الرجاء» يحيل بوضوح إلى رجاء الآية السابقة، وصورة المرساة ووصفها ودخولها إلى ما وراء حاجز المقدس منقولة بأمانة. لكن «آمنة» تصف المرساة عادةً بأنها غير معرّضة للخطر، في حين أن ἀσφαλής هنا تصفها بأنها مأمونة/موثوق بها؛ لذا يلزم تعديل محدود يوضح موثوقيتها مع إبقاء التمييز عن رسوخها.'
  naturalness: الصياغة فصيحة ومفهومة، والفاصلة الختامية مناسبة لاستمرار الجملة في الآية التالية. «مرساة للنفس» و«خلف الستار» سليمتان وطبيعيتان في العربية المعاصرة. «مأمونة وراسخة» أوضح في هذا السياق من «آمنة وراسخة».
  terminology: «الرجاء»، و«مرساة»، و«النفس»، و«الستار» اختيارات مناسبة. لا يقتضي النص تعيين «الموضع الداخلي» بأنه قدس الأقداس. وتحافظ الحاشية على «الحجاب» بوصفه البديل التقليدي، من غير فرض تفسير مذهبي.
  issues:
  - severity: low
    issue: «آمنة» في وصف المرساة
    rationale: الأدق لسياق ἀσφαλῆ أن توصف المرساة بأنها «مأمونة» أو «موثوق بها»، أي جديرة بالاعتماد؛ أما «آمنة» فقد تُفهم أساسًا بمعنى أنها هي في مأمن. «مأمونة» تحافظ على الفرق عن βεβαία («راسخة»).
