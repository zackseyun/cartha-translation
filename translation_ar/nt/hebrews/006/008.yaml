  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: ar
  text: أَمَّا إِذَا كَانَتْ تُنْبِتُ شَوْكًا وَحَسَكًا، فَهِيَ عَدِيمَةُ النَّفْعِ[a] وَقَرِيبَةٌ مِنَ اللَّعْنَةِ، وَنِهَايَتُهَا لِلْحَرْقِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَرْفُوضَةٌ».'
    reason: بديل معجمي أصيل للفظ ἀδόκιμος، تُحفظ به دلالة الاجتياز للاختبار أو الرفض.
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: أَنْبَتَتْ
  rationale: يواصل الفعل صورة الأرض الزراعية من الآية السابقة؛ و«أنبتت» تعبير عربي طبيعي عن إخراج الأرض للنبات، مع بقاء الفاعل مفهومًا من السياق.
- source_word: δὲ
  choice: أَمَّا
  rationale: تُبرز أداة المقابلة التباين مع الأرض المثمرة في الآية السابقة، وتلائم تركيب الشرط العربي.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: شَوْكًا وَحَسَكًا
  rationale: يحافظ اللفظان على صورة نباتين مؤذيين شائكين، وهما واضحان في العربية الفصحى المعاصرة.
- source_word: ἀδόκιμος
  choice: عَدِيمَةُ النَّفْعِ
  rationale: 'ينقل المعنى التقويمي في السياق الزراعي: أرض أخفقت في أن تكون نافعة. ويُحفظ احتمال «مرفوضة» في الحاشية لما له من دلالة أقوى.'
- source_word: κατάρας ἐγγύς
  choice: قَرِيبَةٌ مِنَ اللَّعْنَةِ
  rationale: ترجمة قريبة من تركيب اليونانية، وتحفظ الاسم «اللعنة» بدل تحويله إلى فعل صريح مثل «أن تُلعن».
- source_word: ἧς τὸ τέλος
  choice: وَنِهَايَتُهَا
  rationale: الضمير يعود إلى الأرض المفهومة من السياق، و«نهايتها» تحفظ إمكان معنى العاقبة والمآل دون زيادة تفسيرية.
- source_word: εἰς καῦσιν
  choice: لِلْحَرِيقِ
  rationale: يحافظ على صورة الإحراق الزراعية وعلى دلالة الغاية أو المآل، من غير التصريح بمرجع عقائدي لا تحدده الآية نفسها.
theological_decisions:
- issue: هل يُصرَّح بلفظ «الأرض» مع أنه غير مكرر في هذه الآية؟
  choice: استعمال ضمير مؤنث مفهوم من سياق الآية السابقة دون إضافة «الأرض» إلى النص.
  alternative: أَمَّا الأَرْضُ الَّتِي تُنْبِتُ شَوْكًا وَحَسَكًا...
  rationale: اسم الفاعل اليوناني مؤنث ويعود بوضوح إلى الأرض في الآية السابقة، لكن عدم تكرار الاسم يحافظ على بنية النص ويظل مفهومًا عند قراءة السياق.
- issue: قوة الدلالة في ἀδόκιμος
  choice: عَدِيمَةُ النَّفْعِ في المتن، مع «مرفوضة» في الحاشية.
  alternative: مَرْفُوضَةٌ
  rationale: السياق المباشر يقيّم منفعة الأرض الزراعية، ولذلك يلائم «عديمة النفع» الصورة؛ أما «مرفوضة» فاحتمال معجمي أصيل ذو إيحاء لاهوتي أقوى، فيُحفظ في الحاشية.
- issue: هل يُفسَّر الإحراق بأنه الدينونة النهائية؟
  choice: الإبقاء على صورة «للحريق» دون شرح عقائدي إضافي.
  alternative: نهايتها دينونة النار
  rationale: اليونانية تذكر الإحراق ضمن استعارة زراعية ولا تعيّن في هذه العبارة وحدها كامل المرجع العقائدي؛ لذا تُصان الصورة والتوتر الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «حسك» بوصفه اسمًا معروفًا للنبات الشائك، وحُفظ الإيجاز والصورة الزراعية في الأصل.
