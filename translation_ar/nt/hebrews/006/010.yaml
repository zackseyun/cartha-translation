reference: Hebrews 6:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: ar
  text: فالله ليس بظالم حتى ينسى عملكم والمحبة التي أظهرتموها لاسمه[a]، إذ خدمتم القديسين[b] وما زلتم تخدمونهم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من أجل اسمه».'
    reason: lexical_alternative
  - marker: b
    text: أي إخوتكم المؤمنين؛ فالقديسون هنا هم شعب الله المقدس، لا فئة أُعلنت قداستها في زمن لاحق.
    reason: cultural_note
  - marker: c
    text: 'أو: «بخدمتكم القديسين واستمراركم في خدمتهم».'
    reason: previous_rendering
lexical_decisions:
- source_word: ἄδικος
  choice: بظالم
  rationale: ينقل معنى انتفاء الظلم عن الله في هذا السياق بصياغة عربية طبيعية، من غير توسيع العبارة إلى حكم عقائدي غير مصرح به.
- source_word: ἐπιλαθέσθαι
  choice: ينسى
  rationale: يحفظ المعنى المعجمي المباشر، مع دلالة السياق على أن الله لا يغفل عن العمل ولا يهمله في معاملته.
- source_word: τοῦ ἔργου ὑμῶν
  choice: عملكم
  rationale: يحافظ على المفرد الجمعي في اليونانية، ويشمل ما قاموا به من أعمال تجسدت فيها محبتهم.
- source_word: τῆς ἀγάπης
  choice: المحبة
  rationale: المقابل العربي المألوف والدقيق لـἀγάπη، والسياق يبين أنها محبة ظهرت في خدمة المؤمنين.
- source_word: ἐνεδείξασθε
  choice: أظهرتموها
  rationale: يعبر بوضوح عن إظهار المحبة وإقامة الدليل العملي عليها.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: لاسمه
  rationale: يحفظ لفظ «الاسم» واتجاه المحبة أو تعلقها باسم الله، من غير حصر العبارة في تفسير واحد؛ وتوضح الحاشية احتمال معنى «من أجل اسمه».
- source_word: διακονήσαντες
  choice: إذ خدمتم
  rationale: يشير إلى الخدمة التي تمت في الماضي، مع إبقاء علاقتها بإظهار المحبة مرنة كما في تركيب الحال اليوناني.
- source_word: τοῖς ἁγίοις
  choice: القديسين
  rationale: يحفظ المصطلح العهدي الدال على شعب الله المقدس، وتمنع الحاشية فهمه بوصفه طبقة جرى إعلان قداستها لاحقًا.
- source_word: διακονοῦντες
  choice: ما زلتم تخدمونهم
  rationale: يبرز الاستمرار الذي يفيده اسم الفاعل المضارع، في مقابل الخدمة الماضية التي يدل عليها اسم الفاعل السابق.
theological_decisions:
- issue: هل تفيد الآية استحقاقًا أمام الله أم اعتراف الله الأمين بأعمال المؤمنين؟
  choice: تقرر الصياغة أن عدل الله يقتضي ألا ينسى عملهم ومحبتهم، من غير القول إن هذه الأعمال تكسب الخلاص.
  alternative: قراءة استحقاقية أقوى تجعل الله مدينًا بمكافأة بسبب الأعمال البشرية.
  rationale: النص اليوناني ينفي عن الله الظلم المتمثل في نسيان عملهم ومحبتهم، لكنه لا يصرح بأن الأعمال تستحق الخلاص؛ لذلك تُحفظ دعوى العدل والتذكر من دون إضافة لاهوتية.
- issue: دلالة εἰς τὸ ὄνομα αὐτοῦ
  choice: «لاسمه» مع حاشية «من أجل اسمه».
  alternative: «نحو اسمه» أو إدخال تفسير صريح مثل «إكرامًا له».
  rationale: حرف الجر εἰς يسمح بدلالة الاتجاه أو الغاية؛ والصياغة المختارة تحافظ على صورة «الاسم» وعلى قدر من الغموض الحقيقي، بينما تعرض الحاشية قراءة الغاية.
- issue: العلاقة المنطقية للعبارتين الحاليتين بالخدمة
  choice: «إذ خدمتم... وما زلتم تخدمونهم».
  alternative: «بخدمتكم... واستمراركم في خدمتهم».
  rationale: التركيب اليوناني يمكن أن يبين الكيفية التي أُظهرت بها المحبة أو يقدم دليلها وظرفها؛ «إذ» تحفظ هذه الصلة دون جعلها سببية أو أداتية على نحو قاطع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «ليس بظالم حتى ينسى» للحفاظ على بنية النتيجة في οὐ...ἄδικος...ἐπιλαθέσθαι، مع صياغة مفهومة. وأُبرز الفرق الجانبي بين الماضي في διακονήσαντες والاستمرار في διακονοῦντες بواسطة «خدمتم» و«ما زلتم تخدمونهم».
