  text: βαπτισμῶν ⸀διδαχὴν ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς ⸀τε νεκρῶν καὶ κρίματος αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: ar
  text: والتعليم عن الاغتسالات[a]، ووضع الأيدي، وقيامة الأموات، والدينونة الأبدية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المعموديات». قد تشير صيغة الجمع اليونانية إلى الاغتسالات الطقسية بوجه أعم، لا إلى المعمودية المسيحية على وجه التحديد.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισμῶν
  choice: الاغتسالات
  rationale: صيغة الجمع قد تدل على اغتسالات طقسية بوجه عام، ولا يلزم أن تشير حصراً إلى المعمودية المسيحية. وتحافظ «الاغتسالات» على دلالة الجمع من غير تضييق المعنى.
- source_word: διδαχὴν
  choice: التعليم عن
  rationale: الاسم في حالة النصب يواصل قائمة الأمور الأساسية من الآية السابقة، ويتصل طبيعياً بالمضافات التالية بمعنى التعليم المتعلق بها.
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: وضع الأيدي
  rationale: تعبير عربي واضح ومألوف ينقل العبارة اليونانية من غير إضافة تفسير لوظيفة هذه الممارسة.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: قيامة الأموات
  rationale: ينقل التركيب الإضافي ومعناه الجمعي بصياغة عربية طبيعية راسخة.
- source_word: κρίματος αἰωνίου
  choice: الدينونة الأبدية
  rationale: يحافظ على معنى «الدينونة» من غير قصرها على الإدانة، وينقل الصفة αἰωνίου بالصياغة العربية الطبيعية «الأبدية».
- source_word: τε ... τε καὶ
  choice: ، و...، و...، و...
  rationale: تُنقل بنية التعداد بعطف عربي طبيعي، من غير تكلف في تمثيل كل أداة يونانية تمثيلاً مستقلاً.
theological_decisions:
- issue: دلالة βαπτισμῶν في قائمة التعاليم الأولية
  choice: الاغتسالات
  alternative: المعموديات
  rationale: صيغة الجمع والاستعمال المعجمي يسمحان بالإشارة إلى التطهيرات أو الاغتسالات الطقسية الأوسع، ولذلك يتجنب هذا الاختيار افتراض أن المقصود حصراً طقس المعمودية المسيحية، مع إثبات البديل الممكن في الحاشية.
- issue: نطاق κρίματος αἰωνίου
  choice: الدينونة الأبدية
  alternative: الإدانة الأبدية
  rationale: النص يقول «دينونة» ولا يحدد هنا الإدانة وحدها؛ لذا تُصان سعة اللفظ والتوتر اللاهوتي من غير تضييق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت ألفاظ كتابية مألوفة من غير نزعة مذهبية، وحُفظت بنية القائمة وارتباطها النحوي بما قبلها.
