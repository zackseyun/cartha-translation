  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: ar
  text: لأنه يستحيل على الذين استُنيروا مرةً[a]، وذاقوا العطية السماوية[b]، وصاروا شركاء في الروح القدس[c]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير «استُنيروا» بوجه عام إلى نوال النور أو التعليم الروحي؛ ويفسرها بعضهم على نحو أخص بالاهتداء أو باستنارة المعمودية.
    reason: alternative_reading
  - marker: b
    text: يمكن أن تُفهم «ذاقوا» بمعنى «اختبروا»؛ فالفعل يعني حرفيًا التذوق، وقد يدل على اختبار حقيقي لا على مجرد أخذ عينة.
    reason: lexical_alternative
  - marker: c
    text: 'أو: «أصبحوا مشاركين في الروح القدس» أو «شاركوا في الروح القدس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδύνατον γὰρ
  choice: لأنه يستحيل
  rationale: يحفظ «يستحيل» قوة الصفة اليونانية الواقعة في صدر العبارة، ويؤدي «لأن» وظيفة γὰρ التفسيرية وصلتها بالسياق السابق. وتظل الجملة مترقبةً لما سيكملها في الآيتين التاليتين.
- source_word: τοὺς ἅπαξ φωτισθέντας
  choice: الذين استُنيروا مرةً
  rationale: صيغة المبني للمجهول تحافظ على صورة الاستنارة كما في اليونانية، و«مرةً» تنقل ἅπαξ من غير المبالغة إلى معنى «مرة واحدة نهائيًا».
- source_word: γευσαμένους
  choice: ذاقوا
  rationale: يحفظ الفعل الصورة الحسية الأصلية، مع إمكان دلالته في السياق على اختبار حقيقي لا مجرد تذوق سطحي.
- source_word: τῆς δωρεᾶς τῆς ἐπουρανίου
  choice: العطية السماوية
  rationale: تعبير عربي موجز وطبيعي يحافظ على وصف العطية بأنها سماوية من غير تعيين ماهيتها.
- source_word: μετόχους γενηθέντας πνεύματος ἁγίου
  choice: صاروا شركاء في الروح القدس
  rationale: «صاروا» تنقل الدخول في حالة، و«شركاء في» تؤدي معنى المشاركة في شيء بوضوح معاصر من غير حسم طبيعة هذه المشاركة لاهوتيًا.
theological_decisions:
- issue: هل تشير φωτισθέντας تحديدًا إلى الاهتداء أو المعمودية؟
  choice: استُنيروا
  alternative: اهتدوا؛ أو نالوا استنارة المعمودية
  rationale: النص اليوناني يستعمل صورة الاستنارة ولا يصرح بتفسيرها المحدد، لذلك أبقيت الصورة وذُكرت احتمالات الفهم في الحاشية من غير تبني قراءة طائفية.
- issue: هل يدل γευσαμένους على اختبار حقيقي أم مجرد تذوق سطحي؟
  choice: ذاقوا
  alternative: اختبروا؛ أو تذوقوا تذوقًا محدودًا
  rationale: الترجمة الحرفية الطبيعية تحفظ الاستعارة وتترك مدى الاختبار مفتوحًا كما في الأصل، فلا تحسم جدل الارتداد والثبات على أساس اللفظة وحدها.
- issue: ما طبيعة المشاركة في الروح القدس؟
  choice: صاروا شركاء في الروح القدس
  alternative: شاركوا في الروح القدس؛ أو أصبحوا من المشاركين في الروح القدس
  rationale: الصياغة قوية ومباشرة بقدر الأصل، لكنها لا تضيف تحديدًا عقائديًا بشأن السكنى الخلاصية أو طبيعة الارتداد.
translation_notes:
  register: لغة عربية فصحى واضحة ووقورة. استُعملت «استُنيروا» للمحافظة على الاستعارة الكتابية من غير تقييدها بتفسير مذهبي، و«شركاء» بدل اللفظ الأقدم «مشتركين» لسهولة الفهم. انتهى النص بفاصلة لأن التركيب اليوناني لا يكتمل في هذه الآية وحدها بل يستمر في الآيتين التاليتين.
