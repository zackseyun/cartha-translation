  to: لِأَنَّ الأَرْضَ الَّتِي تَشْرَبُ الْمَطَرَ الَّذِي يَهْطِلُ عَلَيْهَا مِرَارًا، وَتُنْبِتُ نَبَاتًا نَافِعًا لِلَّذِينَ مِنْ أَجْلِهِمْ تُزْرَعُ أَيْضًا، تَنَالُ بَرَكَةً مِنَ اللهِ.[a][b]
  rationale: التعديل الوحيد هو استبدال «تُفلح» بـ«تُزرع» في المتن والحاشية لإزالة التباس صرفي ودلالي في العربية، من غير تغيير معنى المبني للمجهول أو دلالة «من أجلهم» التي تعكس διά مع النصب. وحُفظت الحاشيتان وموضع علامتيهما.
