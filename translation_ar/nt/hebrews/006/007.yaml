source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: ar
  text: لِأَنَّ الأَرْضَ الَّتِي تَشْرَبُ الْمَطَرَ الَّذِي يَهْطِلُ عَلَيْهَا مِرَارًا، وَتُنْبِتُ نَبَاتًا نَافِعًا لِلَّذِينَ مِنْ أَجْلِهِمْ تُزْرَعُ أَيْضًا، تَنَالُ بَرَكَةً مِنَ اللهِ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عشبًا» أو «محصولًا» بدل «نباتًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «للذين يزرعونها»، مع أن «من أجلهم تُزرع» أقرب إلى دلالة διά مع النصب هنا.'
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: الأرض
  rationale: تلائم الصورة الزراعية وتدل على قطعة الأرض التي تُفلح، من غير تضييق المعنى إلى التربة وحدها ولا توسيعه إلى العالم كله.
- source_word: πιοῦσα
  choice: تشرب
  rationale: تحافظ على الاستعارة الحية وتشخيص الأرض في تلقي المطر، بدل التعبير التفسيري الأضعف مثل «تمتص».
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: المطر الذي يهطل عليها مرارًا
  rationale: صياغة عربية طبيعية تحفظ معنى تكرر المطر ووقوعه على الأرض.
- source_word: τίκτουσα
  choice: تنبت
  rationale: الفعل العربي الطبيعي لما تخرجه الأرض من نبات، ويحفظ معنى الإنتاج الزراعي.
- source_word: βοτάνην
  choice: نباتًا
  rationale: لفظ واسع واضح يشمل النبات والعشب والمحصول من غير حصره في نوع بعينه.
- source_word: εὔθετον
  choice: نافعًا
  rationale: ينقل معنى الملاءمة والمنفعة في السياق الزراعي بلغة عربية واضحة.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: للذين من أجلهم تُفلح أيضًا
  rationale: يحفظ دلالة διά مع النصب على الغاية أو المصلحة، ويحافظ «أيضًا» على καί من غير تحويل العبارة إلى دلالة الوكالة صراحة.
- source_word: γεωργεῖται
  choice: تُفلح
  rationale: فعل زراعي عربي موجز وطبيعي يدل على خدمة الأرض وزراعتها، ويحفظ صيغة المبني للمجهول.
- source_word: μεταλαμβάνει
  choice: تنال
  rationale: ينقل بوضوح حصول الأرض على البركة، مع بقاء الأسلوب طبيعيًا ومهيبًا.
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: بركةً من الله
  rationale: يحفظ التنكير ومصدر البركة كما في اليونانية، من غير إضافة تفسير لاهوتي.
theological_decisions:
- issue: المجاز الزراعي في سياق التحذير
  choice: إبقاء الصورة الزراعية كما هي من غير تعيين عقائدي لهوية الأرض أو أصحابها.
  alternative: صياغة تفسيرية تجعل الثمر دليلًا صريحًا على المؤمن الحقيقي أو على ضمان المثابرة.
  rationale: الآية تعرض الجانب الإيجابي من التشبيه الزراعي، ولا تحسم وحدها الخلافات المتعلقة بالارتداد أو المثابرة؛ لذلك ينبغي حفظ التوتر اللاهوتي في السياق.
- issue: دلالة δι’ οὓς في علاقة المنتفعين بفلاحة الأرض
  choice: «من أجلهم» للدلالة على الغاية أو المصلحة.
  alternative: «بأيدي الذين» أو «بواسطة الذين» للدلالة على القائمين بالفلاحة.
  rationale: διά مع ضمير النصب هنا تدعم معنى السبب أو الغاية على نحو أرجح، مع الاعتراف بأن بعض القراءات تفهم الأشخاص على أنهم الفلاحون أنفسهم.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظت صورة الأرض التي «تشرب» المطر، واستُخدمت ألفاظ زراعية مألوفة مثل «تنبت» و«تُفلح». أُثبتت علامتا الحاشيتين [a] و[b] في المتن.
