  terminology: «الأرض»، «تشرب»، «نباتًا»، «بركة من الله» اختيارات مناسبة. و«تُزرع» تؤدي γεωργεῖται بوضوح بوصفها فعلًا زراعيًا مبنيًا للمجهول.
