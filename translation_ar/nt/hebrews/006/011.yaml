  text: ἐπιθυμοῦμεν δὲ ἕκαστον ὑμῶν τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν πρὸς τὴν πληροφορίαν τῆς ἐλπίδος ἄχρι τέλους,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: ar
  text: لكننا نرغب أن يُظهر كلُّ واحدٍ منكم الاجتهادَ نفسه لأجل اليقين الكامل بالرجاء إلى النهاية.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ملء اليقين بالرجاء». يمكن للكلمة اليونانية أن تدل على تمام اليقين أو كمال الثقة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حتى النهاية». تؤكد العبارة الاستمرار والمثابرة إلى أن يكتمل الأمر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: نرغب
  rationale: ينقل رغبة رعوية جادة من غير إيحاء بالشهوة أو انفعال مفرط.
- source_word: δὲ
  choice: لكننا
  rationale: تفيد الأداة انتقالًا فيه مقابلة لطيفة بين الثقة المذكورة سابقًا والحث المتجدد هنا.
- source_word: ἕκαστον ὑμῶν
  choice: كل واحد منكم
  rationale: يحفظ القوة التوزيعية للعبارة، إذ يوجَّه الحث إلى كل فرد في الجماعة.
- source_word: τὴν αὐτὴν ... σπουδὴν
  choice: الاجتهاد نفسه
  rationale: يشير إلى الاجتهاد الذي سبق أن أظهروه في المحبة والخدمة، ويعبّر عن جدية عملية مستمرة.
- source_word: ἐνδείκνυσθαι
  choice: يُظهر
  rationale: ترجمة طبيعية لفعل إظهار الصفة وإبرازها عمليًا.
- source_word: πρὸς τὴν πληροφορίαν τῆς ἐλπίδος
  choice: حتى يبلغ الرجاء ملء اليقين
  rationale: تصوغ علاقة الغاية بالعربية بوضوح، وتحفظ إمكان فهم πληροφορία بوصفها تمام اليقين أو الثقة، دون حصر العبارة في شعور ذاتي فقط.
- source_word: ἄχρι τέλους
  choice: إلى النهاية
  rationale: يحفظ المعنى الزمني المتمثل في الاستمرار والمثابرة حتى الاكتمال.
theological_decisions:
- issue: علاقة «ملء اليقين» بالرجاء والمثابرة
  choice: حتى يبلغ الرجاء ملء اليقين إلى النهاية
  alternative: لأجل اليقين الكامل للرجاء حتى النهاية
  rationale: الصياغة المختارة تبقي التوتر بين اكتمال اليقين المتصل بالرجاء وبين الثبات العملي إلى النهاية، من غير إدخال تصور مذهبي لاحق أو قصر العبارة على يقين باطني بالخلاص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «الاجتهاد» للدلالة على الجدية العملية المستمرة، و«ملء اليقين» للحفاظ على سعة الدلالة اللاهوتية في العبارة اليونانية.
