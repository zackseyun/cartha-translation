lexical_decisions:
- source_word: λέγων
  choice: قائلًا
  rationale: اسم فاعل حالي يقدّم نصّ قسم الله المقتبس، وصيغة «قائلًا» مباشرة وطبيعية في هذا السياق.
- source_word: Εἰ μὴν
  choice: حقًّا
  rationale: تركيب توكيدي مستعمل في سياق القسم، وليس شرطًا حرفيًّا؛ وتنقل «حقًّا» قوة التأكيد بوضوح.
- source_word: εὐλογῶν εὐλογήσω
  choice: لأباركنَّك
  rationale: التكرار ذو الصبغة السامية يفيد التوكيد؛ وتنقل لام القسم مع نون التوكيد هذا المعنى في عربية فصيحة طبيعية، مع توثيق البنية اليونانية في الحاشية.
- source_word: σε
  choice: ـك
  rationale: ضمير مخاطب مفرد يعود على إبراهيم.
- source_word: καὶ
  choice: و
  rationale: حرف عطف يصل بين فعلي الوعد.
- source_word: πληθύνων πληθυνῶ
  choice: لأكثِّرنَّك
  rationale: ينقل وعد الزيادة والتكثير بصيغة فعلية مباشرة، وتؤدي لام القسم ونون التوكيد قوة التركيب المكرر.
theological_decisions:
- issue: صياغة قسم الله المؤكد في الاقتباس من الوعد لإبراهيم
  choice: 'استعمال «حقًّا» مع لام القسم ونون التوكيد في الفعلين: «لأباركنَّك، ولأكثِّرنَّك»'
  alternative: «حقًّا، مباركًا أباركك، ومكثِّرًا أكثّرك»
  rationale: الصياغة المختارة تحافظ على قوة القسم وعلى التوازي بين الوعدين، مع تجنب تركيب حرفي ثقيل في العربية؛ أما التكرار الشكلي فيُبيَّن في الحاشية حفاظًا على الصلة بتكوين 22:17.
translation_notes:
