  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: ar
  text: لكننا واثقون، أيها الأحباء، من جهتكم بأمور أفضل مرتبطة بالخلاص، وإن كنا نتكلم هكذا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: مقتنعون
  rationale: صيغة التام تدل على قناعة راسخة ومستقرة، و«مقتنعون» تعبير عربي طبيعي يحفظ هذه الدلالة.
- source_word: δὲ
  choice: لكننا
  rationale: تفيد الأداة انتقالًا تقابليًا من التحذير الشديد السابق إلى التعبير عن الثقة بالمخاطَبين.
- source_word: περὶ ὑμῶν
  choice: من جهتكم
  rationale: تنقل معنى περί مع المضاف إليه، أي الحكم المتعلق بحال المخاطَبين، بصياغة عربية فصيحة واضحة.
- source_word: ἀγαπητοί
  choice: أيها الأحباء
  rationale: تحفظ صيغة النداء وما فيها من مودة ووقار جماعي.
- source_word: τὰ κρείσσονα
  choice: بأمور أفضل
  rationale: تحفظ الصفة المقارنة المستعملة استعمال الاسم من غير أن تحدد ماهية هذه الأمور أكثر مما يحدده النص.
- source_word: ἐχόμενα σωτηρίας
  choice: أمور مرتبطة بالخلاص
  rationale: الفعل ἔχομαι مع المضاف إليه يدل هنا على الصلة أو الارتباط. هذه الصياغة واضحة وتحافظ على سعة العلاقة من غير جعلها سببية بالضرورة.
- source_word: εἰ καὶ
  choice: وإن كنا
  rationale: 'تنقل المعنى التنازلي: تبقى القناعة قائمة على الرغم من طريقة الكلام التحذيرية.'
- source_word: οὕτως λαλοῦμεν
  choice: نتكلم هكذا
  rationale: إحالة مباشرة وطبيعية إلى مضمون التحذير السابق وأسلوبه.
theological_decisions:
- issue: علاقة ἐχόμενα بالخلاص في سياق مقطع التحذير
  choice: «أمور مرتبطة بالخلاص» من غير تحديد هل هي دلائله أو ملازماته أو نتائجه
  alternative: «أمور ملازمة للخلاص»
  rationale: يثق الكاتب بوجود أمور ذات صلة وثيقة بالخلاص لدى المخاطَبين، لكن اليونانية لا تحسم طبيعة هذه الصلة على نحو يقرر مسألة عقدية لاحقة؛ لذلك تُحفظ سعة العبارة وتوتر السياق.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعمل «من جهتكم» للمحافظة على النبرة الرسمية، و«مرتبطة بالخلاص» لتجنب حسم العلاقة الدلالية واللاهوتية التي تظل مفتوحة في الأصل.
