  text: καὶ οὕτως μακροθυμήσας ἐπέτυχεν τῆς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: ar
  text: وهكذا، بعدما صبر طويلًا، نال الوعد.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نال ما وُعِد به». واليونانية حرفيًا أقرب إلى: «نال الوعد».'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ οὕτως
  choice: وهكذا
  rationale: تربط العبارة بما سبق وتفيد الكيفية أو النتيجة، بصياغة عربية طبيعية وموجزة.
- source_word: μακροθυμήσας
  choice: بعدما صبر طويلًا
  rationale: تنقل معنى الصبر الممتد في صيغة زمنية تلائم علاقة اسم الفاعل بالفعل الرئيس، من غير إضافة فكرة غير مصرّح بها مثل انتظار شيء بعينه.
- source_word: ἐπέτυχεν
  choice: نال
  rationale: تفيد بلوغ الشيء أو الحصول عليه، وهي عربية واضحة تحفظ دلالة الفعل من غير أن تحدد طبيعة تحقق الوعد.
- source_word: τῆς ἐπαγγελίας
  choice: الوعد
  rationale: تحافظ على الاسم الصريح وعلى الصلة اللفظية بسياق وعود الله لإبراهيم، بدل تفسيره مباشرةً بأنه الشيء الموعود.
theological_decisions:
- issue: هل تعني عبارة ἐπέτυχεν τῆς ἐπαγγελίας أن إبراهيم تسلّم تمام تحقيق الوعد أم نال الوعد بمعنى بلغ إليه أو حصل عليه؟
  choice: نال الوعد
  alternative: نال ما وُعِد به
  rationale: النص اليوناني يذكر «الوعد» نفسه ولا يصرّح بـ«تمام تحقيقه». لذلك تُحفظ العبارة والتوتر القائم في سياق الرسالة من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. اختير «صبر طويلًا» لإظهار الامتداد الكامن في μακροθυμέω، و«نال» لصياغة سلسة غير تفسيرية.
