  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: ar
  text: لكي لا تصيروا متباطئين، بل كونوا مقتدين بالذين يرثون الوعود بالإيمان[a] والصبر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بالثقة»؛ ويمكن للكلمة اليونانية المترجمة «الإيمان» أن تحمل في بعض السياقات معنى «الثقة» أو «الأمانة».
    reason: lexical_alternative
lexical_decisions:
- source_word: νωθροὶ
  choice: متباطئين
  rationale: تدل الكلمة على البطء والتراخي في الاستجابة أو السعي. و«متباطئين» تلائم مقابلة الاجتهاد في السياق، من غير أن تحصر المعنى في الكسل الأخلاقي وحده.
- source_word: γένησθε
  choice: تصيروا
  rationale: تحفظ معنى الدخول في حالة أو التحول إليها، لا مجرد الوجود فيها.
- source_word: μιμηταὶ
  choice: مقتدين
  rationale: تنقل الدعوة إلى اتخاذ الآخرين مثالًا واتباع نهجهم، وهي صياغة عربية طبيعية لمعنى «متمثلين» أو «محاكين».
- source_word: διὰ πίστεως
  choice: بالإيمان
  rationale: تحفظ الدلالة الواسعة لـ πίστις وعلاقتها بالثقة بالله، مع إبقاء احتمال الأمانة أو الثقة في الحاشية.
- source_word: μακροθυμίας
  choice: طول الأناة
  rationale: يعبّر عن الصبر الممتد وعدم الاستعجال، ويميّزه نسبيًا عن ألفاظ الاحتمال والثبات الأخرى.
- source_word: κληρονομούντων
  choice: يرثون
  rationale: يحفظ صورة نيل الشيء ميراثًا، ويصوغ اسم الفاعل اليوناني في جملة موصولة عربية طبيعية ذات معنى وصفي مستمر.
- source_word: τὰς ἐπαγγελίας
  choice: المواعيد
  rationale: يحفظ صيغة الجمع الصريحة في اليونانية وأصداء مواعيد الله المتكررة في الرسالة.
- source_word: ἵνα μὴ
  choice: لكي لا
  rationale: يحفظ دلالة الغاية أو النتيجة المقصودة ويربط الآية بالحث السابق ربطًا واضحًا.
theological_decisions:
- issue: دلالة πίστις في سياق يجمع بين الاتكال والسلوك المثابر
  choice: الإيمان
  alternative: الأمانة أو الثقة
  rationale: «الإيمان» هو المقابل الأوسع والأكثر اتساقًا، ولا يحسم ما إذا كان السياق يبرز الثقة بالله أو الأمانة العملية؛ لذلك ذُكر الاحتمال الآخر في الحاشية.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. حُفظ تركيب الغاية وصورة الميراث، واستُعمل «مقتدين» بدل ترجمة حرفية أثقل مثل «متمثلين»، مع إبقاء الغموض الدلالي في πίστις بالحاشية.
