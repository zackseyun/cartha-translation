  rationale: أداة ربط تصل العبارة بما قبلها بصورة طبيعية ومباشرة.
- source_word: τοῦτο
  choice: هذا
  rationale: اسم إشارة مفرد محايد يعود إلى المسار المذكور قبله، ويحافظ «هذا» على صيغة المفرد في اليونانية.
- source_word: ποιήσομεν
  choice: ما سنفعله
  rationale: ينقل صيغة المستقبل من ποιέω نقلًا مباشرًا، مع ترتيب عربي طبيعي عند اقترانه باسم الإشارة.
- source_word: ἐάνπερ
  choice: إن كان ... حقًّا
  rationale: يحفظ معنى الشرط ويعبّر بـ«حقًّا» عن التوكيد الذي تضيفه περ، من غير المبالغة في تصوير عدم اليقين.
- source_word: ἐπιτρέπῃ
  choice: يسمح
  rationale: فعل مضارع في سياق شرطي، ومعناه أن الله يجيز أو يسمح بحدوث الأمر.
- source_word: ὁ θεός
  choice: الله
  rationale: الفاعل المعرّف في اليونانية، ويُصاغ في العربية بالاسم الإلهي المألوف.
theological_decisions:
- issue: تعليق قصد الكاتب على سماح الله
  choice: إن كان الله يسمح حقًّا
  alternative: إن شاء الله؛ إذا أذن الله
  rationale: الصياغة المختارة تبقي قصد المتكلم المستقبلي واضحًا، وتجعله خاضعًا لشرط سماح الله كما في النص، من غير تحويل العبارة إلى اصطلاح عام أو توسيعها إلى تقرير عقائدي عن السببية الإلهية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختيرت «يسمح» لمقابلة ἐπιτρέπῃ مباشرة، ووُضع «حقًّا» بعد الفعل لتفادي التباس «إن حقًّا» ولإبقاء توكيد الشرط ظاهرًا.
