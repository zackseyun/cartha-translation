  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: ar
  text: لذلك، إذ نترك التعليم الأوّلي عن المسيح[a]، فلنُحمَل إلى النضج[b][c]، غير واضعين من جديد أساسًا للتوبة من الأعمال الميتة، وللإيمان بالله[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «التعليم عن مبادئ المسيح»، أو «الرسالة الأساسية عن المسيح».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إلى الكمال»، أو «إلى التمام».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «فلنتقدّم». واليونانية مبنية للمجهول حرفيًا: «فلنُحمَل» أو «فلنُدفَع قُدُمًا».'
    reason: lexical_alternative
  - marker: d
    text: 'أو، بحسب الاتجاه الحرفي لحرف الجر: «الإيمان المتجه نحو الله».'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: لذلك
  rationale: أداة استنتاج تربط الحثّ بما سبقه، و«لذلك» فصيحة وواضحة في العربية المعاصرة.
- source_word: ἀφέντες
  choice: إذ نترك
  rationale: تحفظ الصيغة الحالية معنى الانتقال عن التركيز على المبادئ الأولى، من غير أن توحي برفضها أو نبذها.
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: التعليم الأوّلي عن المسيح
  rationale: تفيد λόγος هنا التعليم أو الرسالة، وتشير τῆς ἀρχῆς في السياق إلى التعليم الابتدائي؛ وهذه الصياغة عربية طبيعية وتحفظ صلة التعليم بالمسيح.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: اللفظ اليوناني لقب، وتقابله «المسيح» مباشرة في العربية الكتابية المعاصرة.
- source_word: ἐπὶ τὴν τελειότητα
  choice: إلى النضج
  rationale: السياق يقابل المبادئ التأسيسية بالتقدم إلى اكتمال روحي أعمق؛ و«النضج» لا يحصر العبارة في معنى العصمة من الخطأ أو الخطيئة.
- source_word: φερώμεθα
  choice: فلنُحمَل
  rationale: تحفظ المبني للمجهول في اليونانية بدل تحويله بلا ضرورة إلى فعل انعكاسي محض مثل «فلنتقدم».
- source_word: θεμέλιον καταβαλλόμενοι
  choice: واضعين ... أساسًا
  rationale: تحفظ استعارة البناء بصياغة عربية مألوفة.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: التوبة من الأعمال الميتة
  rationale: «التوبة» المقابل الطبيعي لـμετάνοια في هذا السياق، و«الأعمال الميتة» تحافظ على الاستعارة من غير حصرها في تفسير واحد.
- source_word: πίστεως ἐπὶ θεόν
  choice: الإيمان المتجه نحو الله
  rationale: تحفظ «الإيمان» معنى πίστις، وتبرز الصياغة الاتجاهية لحرف الجر ἐπί مع بقاء «الإيمان بالله» بديلًا عربيًا طبيعيًا.
theological_decisions:
- issue: هل ترك التعليم الأوّلي عن المسيح يعني رفضه أم الانتقال إلى ما بعده؟
  choice: الانتقال عن جعله موضع التركيز الحالي للتقدم إلى النضج، لا رفضه.
  alternative: التخلي عن التعليم المتعلق بالمسيح نفسه.
  rationale: عبارة «غير واضعين من جديد أساسًا» تدل على البناء فوق الأساس القائم، لا هدمه أو repudiatingه.
- issue: دلالة τελειότης بين النضج والكمال
  choice: النضج
  alternative: الكمال أو التمام
  rationale: المقابلة مع التعليم الأوّلي ترجّح اكتمال النمو، مع إبقاء البدائل في الحاشية وعدم إلغاء مدى اللفظ الدلالي.
- issue: صيغة φερώμεθα المبنية للمجهول
  choice: فلنُحمَل
  alternative: فلنتقدم
  rationale: إبقاء المبني للمجهول يحفظ توتر النص ولا يجعل التقدم فعلًا ذاتيًا صرفًا، من غير تعيين صريح للفاعل الذي لم يسمّه النص.
- issue: دلالة ἐπὶ θεόν الاتجاهية
  choice: الإيمان المتجه نحو الله
  alternative: الإيمان بالله
  rationale: الصياغة المختارة تحفظ الاتجاه الذي تفيده ἐπί، مع الإقرار بأن البديل أكثر شيوعًا في العربية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. حُفظت استعارة الأساس، وبقي المبني للمجهول في الفعل الرئيس، ووُضعت البدائل الدلالية المهمة في الحواشي. تظهر جميع علامات الحواشي [a] و[b] و[c] و[d] في المتن.
