lexical_decisions:
- source_word: καλὸν
  choice: الصالحة
  rationale: تصف «كلمة» وتؤدي معنى الجودة والنفع بعبارة عربية طبيعية، من غير توسيع المعنى إلى «الرائعة» أو «الجميلة».
- source_word: γευσαμένους
  choice: ذاقوا
  rationale: يحفظ الاستعارة اليونانية واتصال صيغة الجمع بالسياق السابق، ولا يحسم مقدار اختبار المذكورين أو عمقه.
- source_word: θεοῦ ῥῆμα
  choice: كلمة الله
  rationale: تعبير عربي واضح ومألوف يدل على الكلمة الصادرة من الله، مع أن ῥῆμα قد تشير خصوصًا إلى قول منطوق.
- source_word: δυνάμεις
  choice: قوات
  rationale: يحفظ سعة اللفظ اليوناني، الذي قد يدل على تجليات القوة أو الأعمال المقتدرة أو المعجزات، من غير قصره على المعجزات وحدها.
- source_word: τε
  choice: و
  rationale: أداة العطف العربية الطبيعية لربط «قوات» بالمفعول السابق.
- source_word: μέλλοντος αἰῶνος
  choice: الدهر الآتي
  rationale: ينقل الدلالة الأخروية للعبارة ويحافظ على إمكان التعبير البديل «الدهر المزمع أن يأتي».
theological_decisions:
- issue: دلالة «ذاقوا» في سياق مقطع التحذير
  choice: الإبقاء على «ذاقوا» من غير شرح يثبت اختبارًا كاملًا أو مجرد تذوق سطحي.
  alternative: اختبروا؛ أو نالوا مجرد لمحة
  rationale: اللفظ اليوناني يحفظ استعارة التذوق، ولا ينبغي للترجمة أن تحسم الجدل اللاهوتي بشأن عمق مشاركة المذكورين.
- issue: مدلول δυνάμεις في السياق الأخروي
  choice: قوات
  alternative: معجزات؛ أعمال مقتدرة
  rationale: قد يشير الجمع إلى مظاهر عجائبية لقوة الدهر الآتي، لكنه يحتمل معنى أوسع؛ لذلك تحافظ «قوات» على هذا التوتر الدلالي.
