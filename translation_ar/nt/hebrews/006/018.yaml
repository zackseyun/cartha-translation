source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: ar
  text: لكي يكون لنا، نحن الذين هربنا طلبًا للملجأ[b]، تشجيع قوي على التمسك بالرجاء الموضوع أمامنا[a]، من خلال أمرين لا يتغيران، يستحيل أن يكذب الله فيهما.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الإمساك بالرجاء الموضوع أمامنا». يمكن للفعل اليوناني أن يعني الإمساك بالشيء، أو القبض عليه، أو التمسك به بقوة.'
    reason: lexical_alternative
  - marker: b
    text: تعبير «هربنا طلبًا للملجأ» يستحضر على الأرجح صورة الفرار طلبًا للملاذ والأمان، وربما يلمّح إلى مدن الملجأ في العهد القديم.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية أو النتيجة المتصلة بالسياق السابق، بصياغة عربية طبيعية.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: بأمرين لا يتغيران
  rationale: «أمران» تنقل سعة معنى πράγματα، و«لا يتغيران» تعبّر بوضوح عن ثباتهما وعدم إمكان تبديلهما.
- source_word: ἐν οἷς
  choice: فيهما
  rationale: تحافظ على عود الضمير إلى الأمرين السابقين من غير تفسير زائد.
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: يستحيل أن يكذب الله
  rationale: تنقل البنية الدالة على الاستحالة بعبارة عربية فصيحة ومباشرة، من غير إضافة تقرير لاهوتي يتجاوز النص.
- source_word: ἰσχυρὰν παράκλησιν
  choice: تشجيع قوي
  rationale: παράκλησις هنا تفيد التشجيع والتقوية الناشئين عن وعد الله وقسمه؛ و«قوي» تنقل شدة ἰσχυράν.
- source_word: ἔχωμεν
  choice: يكون لنا
  rationale: توافق تركيب الغاية بعد ἵνα، وتبدو طبيعية في العربية.
- source_word: οἱ καταφυγόντες
  choice: نحن الذين التجأنا
  rationale: «التجأنا» تحافظ على صورة طلب الملاذ والأمان، مع إيجاز عربي طبيعي؛ وتوضح الحاشية الإيحاء المحتمل.
- source_word: κρατῆσαι
  choice: التمسك بـ
  rationale: تنقل معنى القبض بإحكام أو الثبات على الشيء في هذا السياق، وتحافظ الحاشية على البديل التصويري «الإمساك».
- source_word: τῆς προκειμένης ἐλπίδος
  choice: بالرجاء الموضوع أمامنا
  rationale: تحفظ صورة الرجاء المعروض أو الموضوع أمام المؤمنين، دون تحويلها إلى معنى تجريدي.
theological_decisions:
- issue: صورة الالتجاء والتمسك بالرجاء
  choice: أُبقيت صورة الالتجاء، مع «التمسك بالرجاء الموضوع أمامنا».
  alternative: نحن الذين هربنا طلبًا للملجأ لنمسك بالرجاء الموضوع أمامنا
  rationale: يحفظ النص حركة الاحتماء والاستجابة الفاعلة للرجاء، مع تجنب صياغة عربية متكلفة أو تفسير عقائدي زائد.
- issue: استحالة كذب الله
  choice: يستحيل أن يكذب الله
  alternative: الله لا يمكن أن يكذب
  rationale: الصياغة المختارة أقرب إلى البناء اليوناني الرسمي، وتثبت صدق الله كما يقرره النص من غير توسع فلسفي.
- issue: مرجع الأمرين اللذين لا يتغيران
  choice: تُركا بصيغة «أمرين» دون تسميتهما داخل الآية.
  alternative: وعد الله وقسمه
  rationale: السياق السابق يدل على الوعد والقسم، لكن الآية نفسها تقول «أمرين»؛ لذلك تُحفظ الإحالة دون إدخال التفسير في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. قُدِّمت جملة الغاية والنتيجة على شبه الجملة الأداتية لتحسين انسياب العربية، مع بقاء العلاقات النحوية والمعنوية في الأصل ظاهرة. وُضعت علامتا الحاشية في المتن وربطتا بالعبارتين اللتين تشرحانهما.
