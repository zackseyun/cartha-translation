reference: Hebrews 10:29
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: ar
  text: فكم يكون العقاب أشدّ، في رأيكم، لمن داس على ابن الله، واعتبر دم العهد الذي به تقدَّس دمًا عاديًا[a][b]، وأهان روح النعمة[c]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اعتبر دم العهد دنسًا» أو «غير مقدَّس».'
    reason: lexical_alternative
  - marker: b
    text: ترتبط عبارة «الذي به تقدَّس» في التركيب اليوناني بالشخص المخالف؛ وقد فهم بعض المفسرين مرجعها على نحو آخر. تُبقي الترجمة صياغة النص دون حسم الخلاف اللاهوتي.
    reason: alternative_reading
  - marker: c
    text: 'أو: «أساء إلى روح النعمة باحتقار» أو «عامل روح النعمة باحتقار متغطرس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ ... χείρονος
  choice: فكم عقابًا أشدَّ
  rationale: ينقل تركيب المقارنة في السؤال البلاغي بصياغة عربية طبيعية، مع إبقاء معنى شدة العقاب.
- source_word: ἀξιωθήσεται τιμωρίας
  choice: يستحقه ... عقابًا
  rationale: يؤدي المعنى القضائي للمبني للمجهول، «سيُحسَب أهلًا لعقاب»، بعبارة عربية واضحة غير متكلفة.
- source_word: καταπατήσας
  choice: داس
  rationale: يحافظ على الصورة الحية الدالة على الازدراء، ولا يستبدلها بتفسير تجريدي.
- source_word: υἱὸν τοῦ θεοῦ
  choice: ابن الله
  rationale: المقابل العربي المباشر والدقيق للقب الوارد في النص.
- source_word: κοινὸν
  choice: شيئًا عاديًّا
  rationale: يحفظ التقابل الأساسي بين ما هو عادي وما هو مقدس، مع إمكان دلالة «دنس» أو «غير مقدس» بحسب السياق.
- source_word: ἡγησάμενος
  choice: حسب
  rationale: فعل عربي فصيح ومألوف يؤدي معنى التقدير والحكم على الشيء.
- source_word: τὸ αἷμα τῆς διαθήκης
  choice: دم العهد
  rationale: يحافظ على العبارة العهدية وعلى إيحاءاتها الذبائحية.
- source_word: ἐν ᾧ
  choice: الذي به
  rationale: 'ينقل الدلالة الوسيلية الطبيعية هنا: التقديس بواسطة دم العهد، مع المحافظة على صلة الموصول.'
- source_word: ἡγιάσθη
  choice: تقدَّس
  rationale: يحفظ المصطلح اللاهوتي وصيغة المبني للمجهول دون شرح زائد.
- source_word: ἐνυβρίσας
  choice: أهان
  rationale: ينقل فعل الإساءة المتعمدة والاحتقار بصياغة عربية واضحة؛ و«أهان إهانة بالغة» احتمال أقوى دلالة.
- source_word: τὸ πνεῦμα τῆς χάριτος
  choice: روح النعمة
  rationale: ترجمة مباشرة تحفظ تركيب الإضافة وغناه الدلالي.
theological_decisions:
- issue: مرجع الفاعل المستتر في «الذي به تقدَّس» (ἐν ᾧ ἡγιάσθη)
  choice: أُبقيت العبارة «الذي به تقدَّس» مرتبطة نحويًّا بالشخص الموصوف في الآية من غير تفسير عقائدي إضافي.
  alternative: حمل التقديس على المسيح، أو على جماعة العهد، أو إعادة صياغة العبارة بما يجعل الدم نفسه هو المقدَّس.
  rationale: البنية اليونانية تربط الفعل المفرد بالشخص الذي تصفه أسماء الفاعل، لكن دلالة العبارة اللاهوتية محل نقاش. لذلك تحافظ الترجمة على صياغة النص وتوتره بدل حسم المسألة لصالح مذهب بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «في رأيكم» لإظهار δοκεῖτε في السؤال، وحُفظت الصور القوية والمصطلحات المركزية مثل «دم العهد» و«روح النعمة» دون توسع تفسيري.
