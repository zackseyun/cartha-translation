translation:
  language: ar
  text: فتارةً كنتم تُعرَّضون على الملأ للإهانات والضيقات[a]، وتارةً صرتم شركاء للذين كانوا يُعامَلون هكذا.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أشد حيوية: «كنتم تُجعَلون فرجةً للناس بالإهانات والضيقات».'
    reason: lexical_alternative
  - marker: b
    text: 'أو ربما: «صرتم شركاء للذين كانوا يسلكون هكذا»؛ فقد يدل الفعل اليوناني في بعض السياقات على السلوك أو طريقة العيش، لكن سياق الاضطهاد هنا يرجّح معنى «كانوا يُعامَلون هكذا».'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: فتارةً ... وتارةً
  rationale: تنقل البنية التقابلية اليونانية بسلاسة، وتعرض وجهي اختبار المخاطَبين السابق.
- source_word: ὀνειδισμοῖς
  choice: بالإهانات
  rationale: تعبّر بوضوح معاصر عن التعيير والإساءة اللفظية اللذين يحمل معناهما الاسم اليوناني.
- source_word: θλίψεσιν
  choice: والضيقات
  rationale: تحفظ معنى الضغوط والشدائد في سياق الاضطهاد من غير تضييق الدلالة إلى نوع واحد من الألم.
- source_word: θεατριζόμενοι
  choice: كنتم تُشهَّرون علنًا
  rationale: تنقل صورة عرض الأشخاص أمام الجمهور ليكونوا موضعًا للتعيير، بصياغة عربية طبيعية؛ وحُفظت الصورة الأشد حرفية في الحاشية.
- source_word: κοινωνοὶ
  choice: شركاء
  rationale: تفيد المشاركة والتضامن الفعلي مع المتألمين، لا مجرد الصحبة.
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: للذين كانوا يُعامَلون هكذا
  rationale: يلائم سياق الاضطهاد والموازاة مع الإهانات والضيقات، مع إبقاء احتمال دلالة السلوك أو طريقة العيش في الحاشية.
- source_word: γενηθέντες
  choice: صرتم
  rationale: تنقل الدخول الفعلي في حالة المشاركة، وتنسجم مع صياغة الجملة العربية في الزمن الماضي.
theological_decisions:
- issue: دلالة ἀναστρεφομένων في السياق
  choice: إشارة إلى الذين كانوا يُعامَلون بالطريقة الاضطهادية نفسها
  alternative: الذين كانوا يسلكون أو يعيشون هكذا
  rationale: السياق المباشر يتناول التعيير والضيقات والتضامن مع المضطهَدين، ولذلك ترجح الدلالة المبنية للمفعول سياقيًا؛ لكن الاشتقاق والاستعمال يسمحان بفهم يتعلق بالسلوك، فذُكر البديل حفظًا للغموض الحقيقي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «تُشهَّرون علنًا» لإبراز الإذلال العلني من غير غرابة، و«الضيقات» للمحافظة على ثقل المعاناة وسعة مدلولها. وُضعت علامتا الحاشيتين في المتن كلتاهما.
