  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: ar
  text: أمّا نحن فلسنا من أهل التراجع إلى الهلاك، بل من أهل الإيمان إلى حفظ النفس.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الانسحاب إلى الوراء». وقد يفهم بعضهم اللفظ هنا بمعنى أقوى، أي الارتداد.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تحمل كلمة «الإيمان» هنا أيضًا معنى الأمانة أو الثبات في الإيمان.
    reason: alternative_reading
  - marker: c
    text: 'أو: «اقتناء النفس» أو «ربح الحياة». وقد تدل «النفس» هنا على حياة الإنسان أو ذاته، لا على النفس بمعناها الضيق فقط.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: أمّا نحن
  rationale: يحفظ إبراز الضمير وقوة المقابلة مع التحذير السابق بصياغة عربية طبيعية.
- source_word: οὐκ ἐσμὲν ὑποστολῆς
  choice: فلسنا من أهل التراجع
  rationale: الإضافة في اليونانية تفيد الانتماء إلى فئة أو الاتصاف بها؛ و«التراجع» ينقل معنى الانسحاب إلى الوراء من غير حسمه بأنه ارتداد كامل.
- source_word: εἰς ἀπώλειαν
  choice: إلى الهلاك
  rationale: تحفظ «إلى» دلالة الغاية أو النتيجة، و«الهلاك» لفظ واضح ذو وزن مناسب للسياق.
- source_word: ἀλλὰ πίστεως
  choice: بل من أهل الإيمان
  rationale: تحافظ الصياغة على التوازي مع الشطر الأول، وتترجم πίστις بالإيمان مع إبقاء احتمال معنى الأمانة في الحاشية.
- source_word: εἰς περιποίησιν ψυχῆς
  choice: إلى حفظ النفس
  rationale: تقابل «الهلاك» بـ«الحفظ» مع إبقاء ψυχή بصيغة «النفس»، وهي هنا قد تشمل حياة الإنسان أو ذاته كلها.
theological_decisions:
- issue: دلالة πίστις في مقابل ὑποστολή
  choice: الإيمان
  alternative: الأمانة أو الثبات في الإيمان
  rationale: «الإيمان» هو المقابل المباشر غير المتكلف، لكن السياق الوعظي قد يضمّن معنى الأمانة المثابرة؛ لذلك ذُكر الاحتمال في الحاشية دون حسم.
- issue: دلالة περιποίησις ψυχῆς
  choice: حفظ النفس
  alternative: اقتناء النفس أو ربح الحياة
  rationale: المقابلة المباشرة مع الهلاك ترجّح معنى الحفظ، غير أن الاسم اليوناني قد يدل أيضًا على الاقتناء أو الحصول، ولذلك حُفظ هذا الاتساع في الحاشية.
- issue: مدى قوة ὑποστολή
  choice: التراجع
  alternative: الانسحاب أو الارتداد
  rationale: لا يفرض اللفظ وحده معنى الارتداد النهائي، لذلك اختير تعبير أوسع لا يزيل خطورة التحذير ولا يحمّله تحديدًا لاهوتيًا زائدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت عبارة «من أهل» لإظهار دلالة الانتماء التي تحملها الإضافة اليونانية، مع الحفاظ على التوازي البلاغي بين التراجع والإيمان، وبين الهلاك والحفظ.
