  yaml_path: translation/nt/hebrews/010/015.yaml
  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: ar
  text: 'ويشهد لنا الروح القدس أيضًا[a]، لأنه بعدما قال:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويؤدي لنا الروح القدس شهادة أيضًا».'
    reason: بديل معجمي يحافظ على دلالة الشهادة في μαρτυρεῖ بصياغة أكثر صراحة.
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: يشهد
  rationale: فعل مضارع يحافظ على معنى الشهادة والإدلاء بها، وهو طبيعي وفصيح في العربية المعاصرة.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تتابع الحجة من غير أن تفيد تضادًا قويًا.
- source_word: ἡμῖν
  choice: لنا
  rationale: تنقل المجرور الدال على متلقي الشهادة؛ و«يشهد لنا» تعبير عربي طبيعي في هذا السياق.
- source_word: καὶ
  choice: أيضًا
  rationale: تحافظ على القوة الإضافية، إذ يُذكر الروح القدس شاهدًا كذلك.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: الترجمة العربية المعيارية الواضحة لهذا اللقب المحدد بأداة التعريف.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: لأنه بعدما قال
  rationale: تنقل التعاقب الزمني في تركيب المصدر المعرّف مع μετά. أُظهر الفاعل بضمير مستتر يعود طبيعيًا إلى الروح القدس، مع إبقاء العبارة مفتوحة على الاقتباس التالي.
theological_decisions:
- issue: الفاعلية الشخصية للروح القدس في الشهادة
  choice: يشهد لنا الروح القدس أيضًا
  alternative: يشهد الروح القدس أيضًا لأجلنا
  rationale: يجعل التركيب اليوناني الروح القدس فاعل فعل الشهادة، ويحافظ النص العربي على هذه الفاعلية من غير إضافة تفسير عقدي يتجاوز العبارة.
- issue: فاعل «قال»
  choice: ضمير مستتر يعود إلى الروح القدس
  alternative: 'صياغة غير شخصية: «بعد القول»'
  rationale: يفهم الفاعل في اليونانية من الجملة السابقة، وأقرب مرجع نحوي هو الروح القدس. تحافظ العربية على هذا الترابط من غير تكرار الاسم.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُخدمت «يشهد لنا» لأنها موجزة وطبيعية، وحُفظت النقطتان في النهاية تمهيدًا للاقتباس الذي يلي في الآية التالية.
