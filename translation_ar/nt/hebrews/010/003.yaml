  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: ar
  text: لكن في هذه الذبائح تذكيرٌ بالخطايا سنةً بعد سنة،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل سنة».'
    reason: بديل معجمي للتعبير الدال على التكرر السنوي.
lexical_decisions:
- source_word: ἀλλ’
  choice: لكن
  rationale: أداة استدراك تربط الآية بما قبلها، إذ تقابل عجز الذبائح عن تطهير العابدين بما تفعله فعليًا من تذكير بالخطايا.
- source_word: ἐν αὐταῖς
  choice: في هذه الذبائح
  rationale: الضمير المؤنث الجمع يعود إلى الذبائح المذكورة في السياق السابق؛ والتصريح بالمرجع يحقق الوضوح من غير إضافة معنى جديد.
- source_word: ἀνάμνησις
  choice: تذكيرٌ
  rationale: ينقل معنى استحضار الشيء إلى الذهن، ويلائم الحجة القائلة إن الذبائح المتكررة تذكّر بالخطايا بدلًا من أن تزيلها.
- source_word: ἁμαρτιῶν
  choice: بالخطايا
  rationale: الباء صياغة عربية طبيعية مع «تذكير»، وتحافظ على كون الخطايا هي موضوع التذكير.
- source_word: κατ’ ἐνιαυτόν
  choice: سنةً بعد سنة
  rationale: تعبير عربي طبيعي يبرز التكرر السنوي المستمر، وهو عنصر مهم في سياق الرسالة.
theological_decisions:
- issue: مرجع αὐταῖς
  choice: 'التصريح بالمرجع: «في هذه الذبائح»'
  alternative: «فيها»
  rationale: السياق المباشر يتناول الذبائح نفسها التي تُقدَّم باستمرار؛ والتصريح بالمرجع يوضح الكلام من غير حسم مسألة لاهوتية إضافية.
- issue: دلالة κατ’ ἐνιαυτόν
  choice: «سنةً بعد سنة» لإبراز التكرر السنوي
  alternative: «كل سنة»
  rationale: كلتا الصياغتين صحيحتان، لكن المختارة تُظهر بوضوح الاستمرار والتكرار اللذين تقوم عليهما حجة السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «الذبائح» لتوضيح مرجع الضمير، و«تذكير بالخطايا» لصياغة طبيعية تحافظ على علاقة الإضافة في الأصل، مع إبقاء الفاصلة لأن الآية تستمر نحويًا في السياق.
