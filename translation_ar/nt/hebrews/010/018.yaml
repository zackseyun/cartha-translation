  text: ὅπου δὲ ἄφεσις τούτων, οὐκέτι προσφορὰ περὶ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/018.yaml
  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: ar
  text: وحيث توجد مغفرة لهذه[a]، فلا تبقى بعدُ تقدمةٌ من أجل الخطية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي للخطايا والتعديات المذكورة في الآية السابقة. ويمكن أيضًا ترجمة «مغفرة» بـ«غفران».
    reason: توضيح مرجع اسم الإشارة وذكر بديل معجمي.
lexical_decisions:
- source_word: ὅπου
  choice: حيث
  rationale: تفيد المجال أو الحالة التي يصح فيها الاستنتاج التالي، و«حيث» موجزة وطبيعية في العربية.
- source_word: δὲ
  choice: و
  rationale: أداة انتقال واستنتاج خفيف في السياق، فنُقلت بالواو من غير إقحام معنى زمني أو تضاد قوي.
- source_word: ἄφεσις
  choice: مغفرة
  rationale: تدل هنا على غفران الخطايا ورفع تبعتها، و«مغفرة» واضحة وشائعة وتحفظ الثقل اللاهوتي للفظ.
- source_word: τούτων
  choice: لهذه
  rationale: يحيل اسم الإشارة إلى الخطايا والتعديات المذكورة في الآية السابقة، وأُبقيت الإحالة موجزة من غير إدخال اسم صريح غير موجود في اليونانية.
- source_word: οὐκέτι
  choice: فلا تبقى بعدُ
  rationale: تعبّر عن انتفاء وجود تقدمة أخرى بعد تحقق المغفرة، بصياغة عربية طبيعية ودقيقة.
- source_word: προσφορὰ
  choice: تقدمة
  rationale: لفظ ذبائحي عام، و«تقدمة» تحافظ على عمومه ولا تضيّقه إلى نوع مخصوص من الذبائح.
- source_word: περὶ ἁμαρτίας
  choice: من أجل الخطية
  rationale: تحفظ الدلالة الذبائحية للعبارة من غير الجزم بأنها اسم اصطلاحي يعني «ذبيحة خطية»، كما تُبقي صيغة المفرد في الأصل.
theological_decisions:
- issue: دلالة الآية على نهائية ذبيحة المسيح
  choice: تقرر الصياغة أنه عند وجود المغفرة لا تبقى تقدمة أخرى من أجل الخطية.
  alternative: أن الآية تلغي كل أنواع التقدمات مطلقًا، أو أنها لا تتناول إلا التقدمات اللاوية المتكررة بمعنى شعائري محدود.
  rationale: يقابل السياق بين الذبائح المتكررة وفعالية تقدمة المسيح الواحدة، لكن الترجمة تلتزم بحدود العبارة نفسها ولا توسع مدلولها إلى كل تقدمة على الإطلاق.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظت الإحالة المبهمة في «لهذه»، ووُضعت الفاء في جواب التركيب لتوضيح النتيجة المنطقية، مع نقل δὲ بواو انتقال خفيفة.
