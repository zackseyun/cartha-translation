  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: ar
  text: لِنَتَقَدَّمْ بقلبٍ صادقٍ[a]، بيقينٍ تامٍّ في الإيمان، وقد رُشَّت قلوبُنا فتطهَّرت من ضميرٍ شريرٍ[b][d]، وغُسِلَت أجسادُنا بماءٍ طاهرٍ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بقلبٍ مخلصٍ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من ضميرٍ مذنبٍ».'
    reason: lexical_alternative
  - marker: c
    text: قد تستحضر هذه الصورة لغة التطهير الشعائري، وقد يسمع فيها بعض القراء صدى المعمودية، لكن الآية لا تحدد هذا الغسل صراحةً.
    reason: cultural_note
  - marker: d
    text: 'أو، بعبارة أقرب إلى الحرفية: «وقد رُشَّت قلوبُنا من ضميرٍ شريرٍ».'
    reason: previous_rendering
lexical_decisions:
- source_word: προσερχώμεθα
  choice: لِنَتَقَدَّمْ
  rationale: يحفظ صيغة الحث في المضارع الدال على الاقتراب، ويلائم سياق الدخول إلى حضرة الله في الرسالة إلى العبرانيين.
- source_word: ἀληθινῆς καρδίας
  choice: بقلبٍ صادقٍ
  rationale: «صادق» عربية طبيعية تنقل معنى الحقيقي والأصيل، ولا تحصر العبارة في مجرد شعور ذاتي بالإخلاص.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: في ملء يقين الإيمان
  rationale: ينقل قوة πληροφορία بوصفها يقينًا تامًّا، مع إبقاء πίστις بمعنى الإيمان الواثق.
- source_word: ῥεραντισμένοι τὰς καρδίας
  choice: وقد رُشَّت قلوبُنا فتطهَّرت
  rationale: يحفظ صورة الرش وحالة التطهير الناتجة عنها، ويعبّر عن اسم العضو بضمير المتكلمين الذي يقتضيه السياق.
- source_word: ἀπὸ συνειδήσεως πονηρᾶς
  choice: من ضميرٍ شريرٍ
  rationale: يحافظ على المعنى الواسع لكلمة πονηρός ولا يضيّقه إلى الإحساس بالذنب وحده.
- source_word: λελουσμένοι τὸ σῶμα
  choice: وغُسِلَت أجسادُنا
  rationale: ينقل حالة الغسل المكتملة، ويجعل المفرد اليوناني التوزيعي جمعًا طبيعيًّا في العربية تبعًا للفاعل الجمع.
- source_word: ὕδατι καθαρῷ
  choice: بماءٍ طاهرٍ
  rationale: «طاهر» يحفظ معنى النظافة والنقاء مع الإيحاء بطهارة شعائرية في هذا السياق.
theological_decisions:
- issue: هل يُصرَّح بأن غسل الأجساد هو المعمودية؟
  choice: الإبقاء على صورة الغسل والتطهير دون تسميتها معمودية في المتن
  alternative: التصريح بالمعمودية، أو حصر العبارة في تطهير باطني مجازي
  rationale: قد تستحضر العبارة طقوس التطهير، وقد يسمع فيها بعض القراء صدى المعمودية، لكن الآية نفسها لا تعيّن الغسل صراحةً؛ لذلك تُحفظ دلالتها المفتوحة دون حسم مذهبي.
- issue: دلالة συνειδήσεως πονηρᾶς
  choice: ضمير شرير
  alternative: ضمير مذنب
  rationale: النص يقول حرفيًّا «شرير»، وهي عبارة أوسع من الشعور النفسي بالذنب وتحفظ البعد الأخلاقي والتطهيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «لنتقدم» لصيغة الحث، و«فتطهرت» لتوضيح نتيجة الرش التي يقتضيها السياق من غير إزالة الصورة الأصلية. وُضعت جميع علامات الحواشي في المتن.
