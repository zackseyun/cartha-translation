source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: ar
  text: 'ثم قال: «ها أنا قد جئت لأفعل مشيئتك». فهو يزيل الأول لكي يثبّت الثاني.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يُرجَّح أن «الأول» و«الثاني» يشيران إلى الترتيب الأول للذبائح، ثم إلى تحقيق مشيئة الله في تقدمة المسيح؛ وقد يُفهمان أيضًا على أنهما العبارتان المتقابلتان في الاقتباس، أو بصورة أوسع العهدان.
    reason: بيان مرجع تعبيري «الأول» و«الثاني» مع الحفاظ على الإيجاز والغموض الموجودين في النص.
lexical_decisions:
- source_word: τότε
  choice: ثم
  rationale: تفيد التعاقب وتربط القول بما سبقه في الاقتباس والحجة.
- source_word: εἴρηκεν
  choice: قال
  rationale: مع أن الصيغة تامة وتوحي بأثر مستمر، فإن «قال» هي الصياغة العربية الطبيعية هنا، وسياق الاستشهاد يحفظ بقاء فاعلية القول.
- source_word: Ἰδοὺ
  choice: ها أنا
  rationale: مع ضمير المتكلم في ἥκω، تنقل «ها أنا» التنبيه والحضور بأسلوب عربي كتابي طبيعي.
- source_word: ἥκω
  choice: قد جئت
  rationale: تفيد الوصول مع استمرار الحضور؛ و«قد جئت» تنقل هذا المعنى بوضوح.
- source_word: τοῦ ποιῆσαι
  choice: لأفعل
  rationale: المصدر المعرّف يفيد الغرض، ولام التعليل مع الفعل أنسب مقابل عربي موجز.
- source_word: τὸ θέλημά σου
  choice: مشيئتك
  rationale: مصطلح دقيق وشائع لإرادة الله وغرضه في هذا السياق.
- source_word: ἀναιρεῖ
  choice: يزيل
  rationale: يحافظ على معنى التنحية أو الإزالة دون أن يحمّله صراحة معنى الإلغاء التشريعي.
- source_word: τὸ πρῶτον
  choice: الأول
  rationale: يحفظ إيجاز الصفة المستعملة استعمال الاسم، من غير تعيين مرجعها داخل المتن.
- source_word: ἵνα
  choice: لكي
  rationale: تنقل علاقة الغرض بوضوح.
- source_word: τὸ δεύτερον
  choice: الثاني
  rationale: يحافظ على التوازي الموجز مع «الأول» وعلى قدر الغموض الموجود في اليونانية.
- source_word: στήσῃ
  choice: يثبّت
  rationale: يفيد الإقامة والإقرار وجعل الشيء قائمًا، ويقابل الإزالة بعبارة عربية طبيعية.
theological_decisions:
- issue: مرجع «الأول» و«الثاني»
  choice: إبقاء اللفظين موجزين كما في اليونانية، مع بيان الاحتمال الأرجح في الحاشية.
  alternative: تفسيرهما في المتن صراحةً بالترتيب الأول للذبائح وتحقيق مشيئة الله في تقدمة المسيح، أو بالعهدين، أو بعبارتي الاقتباس.
  rationale: السياق القريب يقابل الذبائح والقرابين بفعل مشيئة الله، لكن النص نفسه لا يسمّي المرجعين؛ لذلك يحافظ المتن على التوتر التفسيري ولا يحسمه بإضافة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «ها أنا قد جئت» بدل «هوذا أجيء» لتكون مفهومة وطبيعية مع بقاء نبرة التنبيه، وأُبقي «الأول» و«الثاني» بلا توسعة تفسيرية في المتن.
