  naturalness: الصياغة عربية فصحى حديثة واضحة وذات نبرة كتابية ملائمة. «ها أنا قد جئت» و«فهو يزيل الأول لكي يثبّت الثاني» سليمتان وطبيعيتان في هذا السياق.
