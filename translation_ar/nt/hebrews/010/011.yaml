revisions:
- from: وَكُلُّ كَاهِنٍ يَقِفُ يَوْمًا بَعْدَ يَوْمٍ يُؤَدِّي خِدْمَتَهُ، وَيُقَدِّمُ الذَّبَائِحَ نَفْسَهَا مِرَارًا وَتَكْرَارًا، وَهِيَ لَا تَسْتَطِيعُ أَبَدًا أَنْ تُزِيلَ الْخَطَايَا.[a]
  to: وَكُلُّ كَاهِنٍ يَقِفُ يَوْمًا بَعْدَ يَوْمٍ يُؤَدِّي الْخِدْمَةَ، وَيُقَدِّمُ الذَّبَائِحَ ذَاتَهَا مِرَارًا وَتَكْرَارًا، وَهِيَ لَا تَسْتَطِيعُ أَبَدًا أَنْ تُزِيلَ الْخَطَايَا[a].
  rationale: تقتصر المراجعة على إزالة التباس عربي محتمل في وصف الذبائح، وحذف ضمير ملكية غير منصوص عليه، وتصحيح موضع مرساة الحاشية. ولا تغيّر هذه التعديلات المعنى أو درجة التأكيد في النص اليوناني.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: «كل كاهن»، والوقوف اليومي، والخدمة، وتقديم الذبائح المتكرر، وعجزها المطلق عن إزالة الخطايا. لكن «الذبائح نفسها» قد تُفهم في العربية على أنها توكيد للذبائح («الذبائح عينها/بذاتها») أكثر من كونها وصفًا بأنها الذبائح ذاتها المتكررة؛ و«ذاتها» أوضح في نقل τὰς αὐτὰς.'
  naturalness: الصياغة فصيحة ومفهومة. ويكون «يؤدي الخدمة» أوجز وأقرب إلى العربية الحديثة من «يؤدي خدمته»، من غير إضافة ضمير ملكية غير موجود في الأصل. كما ينبغي أن تلي علامة الحاشية العبارة التي تخصها مباشرة، قبل علامة الوقف.
  terminology: «كاهن»، و«الذبائح»، و«الخطايا» مصطلحات مناسبة. و«يزيل الخطايا» ترجمة دقيقة لـ περιελεῖν ἁμαρτίας، والبديل «ينزع الخطايا» مقبول.
  issues:
  - severity: low
    issue: احتمال التباس في «الذبائح نفسها».
    rationale: المطلوب في اليونانية هو «الذبائح ذاتها/نفس الذبائح» بوصفه تأكيدًا لتطابق الذبائح المتكررة؛ أما «الذبائح نفسها» فقد تؤدي وظيفة التوكيد الذاتي في العربية. «الذبائح ذاتها» أوضح.
  - severity: low
    issue: إضافة ضمير الملكية في «يؤدي خدمته».
    rationale: λειτουργῶν تعني تأدية الخدمة الكهنوتية ولا تتضمن ضمير ملكية. حذف الضمير يحافظ على الإيجاز والمطابقة دون تغيير المعنى.
  - severity: low
    issue: موضع مرساة الحاشية متأخر عن العبارة المشروحة.
    rationale: الحاشية بديل معجمي لـ«تزيل الخطايا»، لذا توضع العلامة بعدها مباشرة وقبل النقطة.
  revised_text: وَكُلُّ كَاهِنٍ يَقِفُ يَوْمًا بَعْدَ يَوْمٍ يُؤَدِّي الْخِدْمَةَ، وَيُقَدِّمُ الذَّبَائِحَ ذَاتَهَا مِرَارًا وَتَكْرَارًا، وَهِيَ لَا تَسْتَطِيعُ أَبَدًا أَنْ تُزِيلَ الْخَطَايَا[a].
  revised_footnotes:
