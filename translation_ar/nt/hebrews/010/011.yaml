  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: ar
  text: وَكُلُّ كَاهِنٍ يَقِفُ يَوْمًا بَعْدَ يَوْمٍ يُؤَدِّي الْخِدْمَةَ، وَيُقَدِّمُ الذَّبَائِحَ ذَاتَهَا مِرَارًا وَتَكْرَارًا، وَهِيَ لَا تَسْتَطِيعُ أَبَدًا أَنْ تُزِيلَ الْخَطَايَا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تَنْزِعَ الْخَطَايَا».'
    reason: بديل معجمي للفعل περιαιρέω، يحفظ صورة الأخذ أو النزع إلى جانب معنى الإزالة.
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: كُلُّ كَاهِنٍ
  rationale: يحفظ القوة التوزيعية للتركيب اليوناني، ويشير إلى كل كاهن في النظام الكهنوتي، من غير تحويل ἱερεύς إلى «رئيس كهنة».
- source_word: ἕστηκεν
  choice: يَقِفُ
  rationale: ينقل حالة الوقوف بصياغة عربية طبيعية، ويحفظ المقابلة الأدبية مع جلوس المسيح في الآية التالية من غير شرح زائد.
- source_word: καθ’ ἡμέραν
  choice: يَوْمًا بَعْدَ يَوْمٍ
  rationale: يبرز الاستمرار والتكرار اليومي بصورة أوضح من «يوميًّا»، بما يلائم حجة السياق.
- source_word: λειτουργῶν
  choice: يُؤَدِّي خِدْمَتَهُ
  rationale: ينقل معنى أداء الخدمة الكهنوتية المقدسة بلغة عربية واضحة، دون الاكتفاء بفعل عام مثل «يخدم».
- source_word: τὰς αὐτὰς ... θυσίας
  choice: الذَّبَائِحَ نَفْسَهَا
  rationale: يحفظ التشديد على تكرار الذبائح عينها.
- source_word: πολλάκις
  choice: مِرَارًا وَتَكْرَارًا
  rationale: تعبير عربي طبيعي وقوي ينقل معنى التكرار المتواصل.
- source_word: προσφέρων
  choice: يُقَدِّمُ
  rationale: «يقدّم الذبائح» هو التعبير العربي المألوف والدقيق في السياق الطقسي.
- source_word: αἵτινες
  choice: وَهِيَ
  rationale: يربط الجملة التفسيرية بالذبائح بوضوح ويحفظ عود الضمير عليها.
- source_word: οὐδέποτε δύνανται
  choice: لَا تَسْتَطِيعُ أَبَدًا
  rationale: يحفظ دلالة العجز المطلق من غير تلطيف.
- source_word: περιελεῖν ἁμαρτίας
  choice: أَنْ تُزِيلَ الْخَطَايَا
  rationale: صياغة عربية واضحة تنقل معنى نزع الخطايا أو إزالتها، مع إبقاء البديل المعجمي في الحاشية.
theological_decisions:
- issue: علاقة وقوف الكاهن بحجة عبرانيين 10
  choice: استُعمل «يَقِفُ» للمحافظة على المقابلة بين خدمة الكهنة المستمرة وهم واقفون وجلوس المسيح بعد ذبيحته في الآية التالية.
  alternative: «يكون واقفًا» أو «ظل واقفًا» بصياغة لا تُظهر المقابلة الأدبية بالوضوح نفسه.
  rationale: المقابلة حاضرة في السياق المباشر، وصيغة «يقف» تحفظها دون إضافة تفسير إلى النص.
- issue: مدى عجز الذبائح عن معالجة الخطايا
  choice: «لَا تَسْتَطِيعُ أَبَدًا أَنْ تُزِيلَ الْخَطَايَا» يحفظ تقرير النص المطلق عن عجز الذبائح المتكررة.
  alternative: «لا تستطيع أن تعالج الخطايا معالجة كاملة»، وهي صياغة أضعف وتفسيرية.
  rationale: التركيب اليوناني οὐδέποτε δύνανται يفيد العجز المطلق في إطار حجة الرسالة، فلا ينبغي تخفيفه.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «يؤدي خدمته» لإظهار الطابع الكهنوتي، و«مرارًا وتكرارًا» لإبراز الاستمرار البلاغي. وُضعت علامة الحاشية بعد العبارة التي تشرح بديلها المعجمي.
