  text: Ἔχοντες οὖν, ἀδελφοί, παρρησίαν εἰς τὴν εἴσοδον τῶν ἁγίων ἐν τῷ αἵματι Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: ar
  text: فإذ لنا، أيها الإخوة[a]، جرأةٌ على الدخول إلى الأقداس[b] بدم يسوع،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيها الإخوة والأخوات»؛ فاليونانية تقول حرفيًا «الإخوة»، وقد يكون النداء موجَّهًا تمثيليًا إلى الجماعة كلها.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «المقدس»؛ ويشير التعبير في سياق صور المسكن في الرسالة إلى المواضع المقدسة المرتبطة بحضور الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: فإذ لنا
  rationale: تنقل «οὖν» الصلة الاستنتاجية بما سبق، وتجعل اسم الفاعل «ἔχοντες» أساسًا لما سيأتي من حث، مع الحفاظ على تركيب عربي طبيعي وموجز.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: تحافظ على صيغة النداء المذكرة الجمع في اليونانية، مع بيان احتمال شمول الجماعة كلها في الحاشية.
- source_word: παρρησίαν
  choice: جرأة
  rationale: تفيد الثقة الجريئة وحرية الاقتراب، وتحافظ على قوة اللفظ في سياق المثول أمام الله.
- source_word: εἰς τὴν εἴσοδον
  choice: على الدخول إلى
  rationale: صياغة عربية طبيعية تعبّر عن امتلاك الجرأة للدخول، من غير إثقال النص بترجمة اسمية حرفية.
- source_word: τῶν ἁγίων
  choice: الأقداس
  rationale: مصطلح عربي موجز ملائم لصورة المقدس في الرسالة، ويدل على المواضع المقدسة أو المقدس الإلهي من غير حصره صراحة في قدس الأقداس.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: بدم يسوع
  rationale: تفيد الباء الوسيلة أو الأساس الذي به يتم الدخول، وتحافظ على الدلالة الذبائحية من غير شرح زائد.
theological_decisions:
- issue: مدلول τῶν ἁγίων
  choice: الأقداس، أي المجال أو المواضع المقدسة المرتبطة بحضور الله
  alternative: المقدس؛ قدس الأقداس؛ القديسون
  rationale: سياق الرسالة القريب قائم على صورة المسكن والذبائح، ولذلك فالمرجع مكاني تعبدي لا جماعة القديسين. ولفظ «الأقداس» لا يضيّق المعنى إلى قدس الأقداس وحده.
- issue: القوة التمثيلية للفظ ἀδελφοί
  choice: الإخوة في المتن مع توضيح الشمول المحتمل في الحاشية
  alternative: الإخوة والأخوات
  rationale: يحفظ المتن الصيغة المذكرة الصريحة للمصدر، بينما توضح الحاشية أن النداء قد يشمل جماعة المؤمنين كلها.
- issue: دلالة ἐν في عبارة دم يسوع
  choice: الباء الدالة على الوسيلة أو الأساس
  alternative: في دم يسوع؛ من خلال دم يسوع
  rationale: السياق يربط إمكان الدخول بدم يسوع، والباء عربية طبيعية وتبقي العلاقة بين الوسيلة والأساس دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «الأقداس» للمحافظة على الصورة التعبدية وعلى سعة التعبير اليوناني، ووُضعت علامتا الحاشيتين في المتن عند اللفظين المعنيين.
