  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: ar
  text: مَنْ رفض شريعة موسى يموت بلا رحمة، بناءً على شهادة شاهدين أو ثلاثة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُقتَل». يقول اليوناني حرفيًا: «يموت»، لكن السياق يتحدث عن تنفيذ حكم الموت بموجب شريعة موسى.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: رفض
  rationale: يفيد الفعل رفضَ أمر ذي سلطان أو نبذه وإلغاء اعتباره. و«رفض» عربي واضح يحفظ معنى التمرد على سلطان الشريعة من غير حصره في مجرد مخالفة عابرة.
- source_word: τις
  choice: مَنْ
  rationale: اسم شرط عام طبيعي في العربية، يؤدي المعنى التمثيلي للضمير النكرة.
- source_word: νόμον Μωϋσέως
  choice: شريعة موسى
  rationale: تعبير عربي مألوف ودقيق للإضافة اليونانية، وأوضح في هذا السياق القانوني من «ناموس موسى» للقارئ المعاصر.
- source_word: χωρὶς οἰκτιρμῶν
  choice: بلا رحمة
  rationale: ينقل التعبير اليوناني اصطلاحيًا وبإيجاز، ويلائم سياق القضاء وتنفيذ الحكم.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: بناءً على شهادة شاهدين أو ثلاثة
  rationale: تدل ἐπί مع المجرور هنا على الأساس الذي يقوم عليه الحكم. وإضافة «شهادة» توضح المعنى القضائي المضمَر في اليونانية من غير تغيير مضمونه.
- source_word: ἀποθνῄσκει
  choice: يموت
  rationale: يحافظ على صيغة الفعل اليوناني المباشرة وعلى دلالته العامة في المضارع، مع ترك السياق القضائي يدل على أن المقصود تنفيذ حكم الموت.
theological_decisions:
- issue: هل يُصرَّح في المتن بالقوة القضائية التنفيذية للفعل ἀποθνῄσκει؟
  choice: الإبقاء على «يموت» في المتن
  alternative: يُقتَل / يُحكَم عليه بالموت
  rationale: السياق يحيل إلى إجراء قضائي وعقوبة الموت في شريعة موسى، لكن اليونانية تقول حرفيًا «يموت» ولا تستخدم تعبيرًا سببيًا صريحًا. لذلك يحفظ المتن ضبط المصدر، وتبيّن الحاشية البديل السياقي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «شريعة» بدل «ناموس» لسهولة الفهم، وصيغت الجملة بـ«مَنْ» للمحافظة على العموم والطابع القانوني.
