  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: ar
  text: 'لذلك، عند دخوله إلى العالم، يقول: «ذبيحةً وتقدمةً لم تُرِد، بل هيأت لي جسدًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يتبع نص العبرانيين هنا الصياغة اليونانية للمزمور 40:6: «هيأت لي جسدًا». أما النص العبري للمزمور 40:6 فيقول: «أذنين فتحت لي».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تنقل الاستنتاج المنطقي المتصل بالحجة السابقة بعبارة عربية واضحة ومباشرة.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: عند دخوله إلى العالم
  rationale: تحافظ على دلالة اسم الفاعل الزمنية من غير حسم زمن الحدث أكثر مما يقتضيه سياق الاستشهاد.
- source_word: λέγει
  choice: يقول
  rationale: تحافظ على المضارع اليوناني المستعمل في تقديم القول الكتابي.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: ذبيحةً وتقدمةً
  rationale: تبقي المصطلحين التعبديين متمايزين، وتحافظ على ترتيبهما وصيغة العطف في المصدر.
- source_word: οὐκ ἠθέλησας
  choice: لم تُرِد
  rationale: تعبير عربي طبيعي ينقل معنى الإرادة أو الرغبة في هذا السياق من غير توسع تفسيري.
- source_word: δὲ
  choice: بل
  rationale: تؤدي المقابلة بين الذبيحة والتقدمة اللتين لم يردهما الله وبين الجسد الذي هيأه، وتلائم مجيئها بعد النفي في العربية.
- source_word: σῶμα
  choice: جسدًا
  rationale: تنقل الاسم المفرد المحسوس بوضوح، من غير إضافة تفسير لاهوتي إلى اللفظ نفسه.
- source_word: κατηρτίσω μοι
  choice: هيأت لي
  rationale: «هيأت» تنقل معنى الإعداد والتجهيز، و«لي» تؤدي دلالة المجرور غير المباشر μοι بصورة طبيعية.
theological_decisions:
- issue: اختلاف صياغة الاقتباس في العبرانيين عن النص العبري للمزمور 40:6
  choice: 'ترجمة نص العبرانيين اليوناني كما هو: «هيأت لي جسدًا»'
  alternative: «أذنين فتحت لي»، وفق نص المزمور العبري
  rationale: الأولوية للنص اليوناني للآية المترجمة؛ فهو يذكر صراحةً «جسدًا». ويُحفظ اختلاف نص المزمور العبري في حاشية بدل مواءمة النصين أو إزالة التوتر بينهما.
- issue: هوية المتكلم في λέγει
  choice: الإبقاء على الضمير المستتر في «يقول» كما في السياق اليوناني
  alternative: التصريح باسم «المسيح» داخل الآية
  rationale: النص اليوناني لا يذكر الاسم صراحةً في هذه الجملة، لذلك لا تُضاف هوية تفسيرية إلى المتن، وإن كان السياق يحددها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ ترتيب صدر الاقتباس قدر الإمكان، واستُعملت «بل» بعد النفي لتكون المقابلة طبيعية في العربية. وُضعت علامة الحاشية عند العبارة التي تتناولها مباشرةً.
