  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: ar
  text: '«هذا هو العهد الذي سأقيمه معهم بعد تلك الأيام، يقول الرب: جاعلًا[a] شرائعي على قلوبهم، وسأكتبها على أذهانهم».


    [a] وبصياغة عربية أكثر سلاسة: «سأجعل شرائعي على قلوبهم، وسأكتبها على أذهانهم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة عربية أكثر سلاسة: «سأجعل شرائعي على قلوبهم، وسأكتبها على أذهانهم».'
    reason: بديل أسلوبي يوضح إمكان تحويل اسم الفاعل اليوناني إلى فعل مستقبل في العربية.
lexical_decisions:
- source_word: διαθήκη
  choice: العهد
  rationale: يحفظ المعنى العهدي المستمد من إرميا، ولا يحمله على معنى الوصية القانونية.
- source_word: διαθήσομαι
  choice: سأقيمه
  rationale: تعبير عربي واضح وطبيعي عن إنشاء العهد، ويؤدي معنى الفعل في السياق العهدي.
- source_word: πρὸς αὐτούς
  choice: معهم
  rationale: حرف الجر مع الأشخاص في سياق إقامة العهد يفيد المشاركة، ولذلك يلائمه «مع».
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: بعد تلك الأيام
  rationale: ترجمة مباشرة تحافظ على الإشارة الزمنية من غير توسع.
- source_word: κύριος
  choice: الرب
  rationale: المقابل العربي المألوف والدقيق للقب κύριος في هذا السياق.
- source_word: διδοὺς
  choice: جاعلًا
  rationale: يحافظ على صيغة اسم الفاعل في اليونانية وعلى معنى وضع الشرائع على القلوب، مع إثبات البديل الأسلس في الحاشية.
- source_word: νόμους μου
  choice: شرائعي
  rationale: يحفظ صيغة الجمع الصريحة والصلة الدلالية بـ«الشريعة».
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: على قلوبهم
  rationale: يحافظ على صورة الكتابة أو الوضع على القلوب وعلى جمع «قلوب» في الأصل.
- source_word: τὴν διάνοιαν αὐτῶν
  choice: ذهنهم
  rationale: «الذهن» مقابل واضح لـδιάνοια، واستعمال المفرد مع ضمير الجمع يحفظ مفرد الاسم في النص اليوناني.
- source_word: ἐπιγράψω αὐτούς
  choice: سأكتبها
  rationale: يؤدي معنى الكتابة على شيء، ويعود الضمير المؤنث المفرد في العربية طبيعيًا على جمع غير العاقل «شرائع».
theological_decisions:
- issue: البنية الداخلية لاقتباس إرميا
  choice: الإبقاء على اسم الفاعل «جاعلًا» ثم الفعل المستقبل «سأكتبها»
  alternative: 'تسوية العبارة إلى فعلين مستقبلين: «سأجعل... وسأكتب...»'
  rationale: يعكس هذا الاختيار اختلاف الصيغة في نص العبرانيين، ولا ينسّقه ضمنيًا مع صيغ أخرى للاقتباس؛ وتورد الحاشية الصياغة العربية الأسلس.
- issue: عدد الاسم διάνοια
  choice: ذهنهم
  alternative: أذهانهم
  rationale: الاسم في اليونانية مفرد وإن كان المضاف إليه جمعًا؛ فحُفظ المفرد من غير حسم ما إذا كان المقصود ذهنًا جمعيًا أم أذهان الأفراد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «أقيم العهد» بدل التعبير الأقدم «أقطع العهد»، وحُفظت البنية اليونانية غير المسوّاة في المتن مع بيان البديل الأسلس في الحاشية.
