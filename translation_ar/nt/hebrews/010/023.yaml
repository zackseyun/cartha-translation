base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: ar
  text: لِنَتَمَسَّكْ بإقرار رجائنا من غير تزعزع[a]، لأن الذي وعد أمين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بإقرار الرجاء من غير تزعزع». فاليونانية لا تذكر صراحةً ضمير «نا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέχωμεν
  choice: لِنَتَمَسَّكْ
  rationale: فعل مضارع بصيغة الحث للجمع؛ تنقل «لنتمسك» قوة الدعوة الجماعية إلى الثبات والمحافظة بإحكام.
- source_word: ὁμολογίαν
  choice: بإقرار
  rationale: «الإقرار» لفظ عربي واضح يدل على إعلان الإيمان والالتزام به، ويلائم سياق الرسالة في الحث على الثبات في الإقرار العلني.
- source_word: τῆς ἐλπίδος
  choice: رجائنا
  rationale: الإضافة في اليونانية حرفيًا «الرجاء» من غير ضمير ملكية؛ أُضيف ضمير الجماعة في العربية لتوضيح أن المقصود هو الرجاء الذي يقر به المخاطبون، مع إثبات البديل الحرفي في الحاشية.
- source_word: ἀκλινῆ
  choice: من غير تزعزع
  rationale: صفة بمعنى غير مائل أو غير متزعزع، وهي مرتبطة نحويًا بـ«الإقرار»؛ والتعبير الظرفي العربي طبيعي ويحافظ على معنى الثبات.
- source_word: πιστὸς
  choice: أمين
  rationale: ينقل معنى الوفاء والجدارة بالثقة، ويحفظ الرنين اللاهوتي المألوف للفظ في وصف الله.
- source_word: ὁ ἐπαγγειλάμενος
  choice: الذي وعد
  rationale: اسم فاعل يوناني معرّف قائم مقام الاسم؛ والصياغة العربية موجزة وطبيعية، وتبقي هوية الواعد ضمنية كما في الأصل.
theological_decisions:
- issue: هوية «الذي وعد»
  choice: تُركت ضمنية كما في اليونانية، مع أن السياق يشير إلى الله.
  alternative: «لأن الله الذي وعد أمين»
  rationale: إبقاء المرجع ضمنيًا يحترم صياغة المصدر ولا يضيف تفسيرًا غير مصرح به.
- issue: إضافة ضمير الجماعة إلى «الرجاء»
  choice: «رجائنا» لسلامة العربية ووضوح تعلق الرجاء بالجماعة المخاطبة.
  alternative: «إقرار الرجاء»
  rationale: اليونانية لا تذكر ضميرًا صريحًا، لذلك حُفظ البديل في الحاشية بدل حجب هذا القدر من الغموض.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «لِنَتَمَسَّكْ» للحث الجماعي، و«من غير تزعزع» لتجنب تركيب ثقيل مع إبقاء وصف الإقرار بالثبات.
