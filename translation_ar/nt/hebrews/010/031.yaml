  text: إن الوقوع في يدي الله الحيّ لأمرٌ مخيف.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن الوقوع في يدي الله الحيّ لأمرٌ مُرعِب».'
    reason: بديل معجمي لـ«مخيف» ينقل جانب الرهبة الشديدة في φοβερόν.
lexical_decisions:
- source_word: φοβερὸν
  choice: مُرعِبٌ
  rationale: تدل الكلمة على ما يبعث الخوف والرهبة؛ و«مُرعِب» تنقل قوة التحذير بوضوح في العربية المعاصرة، مع إبقاء البديل الأقل حدة في الحاشية.
- source_word: τὸ ἐμπεσεῖν
  choice: أن يقع الإنسان
  rationale: المصدر المعرّف يُصاغ طبيعيًا في العربية بـ«أن يقع». وأُضيف «الإنسان» بوصفه فاعلًا عامًا مفهومًا من التركيب، من غير حصر التحذير في جماعة بعينها.
- source_word: εἰς χεῖρας
  choice: في يدي
  rationale: يحافظ هذا التعبير على صورة اليدين الكتابية ودلالتها السياقية على الوقوع تحت السلطان أو الدينونة، من غير إدخال لفظ «الدينونة» صراحة.
- source_word: θεοῦ
  choice: الله
  rationale: 'نقل مباشر للاسم في تركيب الإضافة: «يدي الله».'
- source_word: ζῶντος
  choice: الحيّ
  rationale: صفة لله تقابل اسم الفاعل اليوناني، وتحافظ على التعبير الكتابي المألوف «الله الحيّ» ودلالته على حضوره الفعّال الحقيقي.
theological_decisions:
- issue: قوة عبارة التحذير
  choice: تصريح عام مهيب برهبة الوقوع تحت سلطان الله الحي ودينونته
  alternative: قصر العبارة على التأديب الزمني، أو فهمها بوصفها قولًا وجوديًا بلا دلالة قضائية
  rationale: يختم العدد مقطعًا تحذيريًا، ويحمل تعبير الوقوع في اليدين دلالة السلطان والدينونة في سياقه. أبقت الصياغة هذه القوة من غير إضافة تفسيرية مثل «دينونة» إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت صورة «يدي الله» بدل شرحها بلفظ السلطان أو الدينونة، وصيغ المصدر اليوناني تركيبًا عربيًا طبيعيًا عامًا.
