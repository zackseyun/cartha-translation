  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: ar
  text: غير مهملين اجتماعنا[a]، كما اعتاد بعضهم، بل مشجِّعين بعضنا بعضًا، وبالأكثر بقدر ما ترون اليوم[b] يقترب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تاركين اجتماعنا» أو «متخلِّين عن اجتماعنا».'
    reason: lexical_alternative
  - marker: b
    text: يرجح أن «اليوم» يشير إلى يوم الرب الآتي أو يوم الدينونة الأخيرة.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: تاركين
  rationale: يفيد الفعل ترك الشيء أو هجره وعدم المواظبة عليه. و«تاركين» واضحة وطبيعية، وتحفظ قوة اللفظ من غير أن تحصره بالضرورة في ارتداد كامل.
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: اجتماعنا معًا
  rationale: يشير الاسم إلى اجتماع المؤمنين بعضهم مع بعض، والضمير الانعكاسي يربطه بالجماعة المخاطَبة. وتحفظ العبارة معنى التلاقي الجماعي من غير إدخال مدلول مؤسسي غير مذكور في النص.
- source_word: καθὼς ἔθος τισίν
  choice: كما هي عادة بعضهم
  rationale: تنقل العبارة معنى العادة أو الممارسة المألوفة، وتحافظ على نبرة العتاب الهادئ المباشر.
- source_word: παρακαλοῦντες
  choice: مشجِّعين بعضنا بعضًا
  rationale: يمكن أن يدل الفعل على الحث أو التشجيع أو التعزية. وفي سياق الاجتماع والثبات، يعبر «مشجِّعين» عن التقوية المتبادلة، مع إظهار المفعول المتبادل المفهوم من السياق.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: وبالأكثر كلما
  rationale: 'تحفظ الصياغة علاقة التناسب: يزداد التشجيع بقدر اقتراب اليوم، وهي عبارة عربية واضحة وموجزة.'
- source_word: βλέπετε
  choice: رأيتم
  rationale: ترجمة مباشرة للفعل، وتترك كيفية إدراك اقتراب اليوم من غير تحديد زائد.
- source_word: ἐγγίζουσαν τὴν ἡμέραν
  choice: اليوم يقترب
  rationale: تحفظ الصورة الزمنية الحية لليوم الآتي وهو يدنو، من غير توسيع «اليوم» إلى تسمية تفسيرية غير واردة صراحة في اليونانية.
theological_decisions:
- issue: المرجع الأخروي لعبارة «اليوم»
  choice: إبقاء اللفظ «اليوم» كما في المصدر، مع بيان مرجعه المرجح في الحاشية
  alternative: يوم الرب؛ يوم الدينونة
  rationale: السياق يرجح اليوم الأخروي المعروف لدى القراء، لكن النص اليوناني يقول «اليوم» فقط؛ لذلك لا تُدرج تسمية أخص في المتن.
- issue: المفعول المتبادل للفعل παρακαλοῦντες
  choice: مشجِّعين بعضنا بعضًا
  alternative: مشجِّعين، مع إبقاء المفعول محذوفًا
  rationale: المفعول غير مصرح به في العبارة اليونانية، لكن المعنى المتبادل ظاهر من سياق اجتماع الجماعة. وإظهاره لازم تقريبًا لوضوح العربية ولا يضيف تعليمًا عقائديًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. أُبقي تركيب اسم الفاعل تابعًا لسياق الوصية في الآية السابقة، كما في اليونانية، وحُفظت الإشارة الأخروية من غير توسيع تفسيري داخل المتن.
