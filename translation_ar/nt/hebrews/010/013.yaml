lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: ومنذ ذلك الحين
  rationale: العبارة المحايدة المعرَّفة تُستعمل ظرفيًا، وتشير إلى الزمن التالي لجلوسه المذكور في السياق السابق.
- source_word: ἐκδεχόμενος
  choice: ينتظر
  rationale: تنقل معنى الانتظار المستمر، مع إمكان دلالة السياق على الترقب الواثق دون إضافة تفسير زائد إلى المتن.
- source_word: ἕως τεθῶσιν
  choice: أن يُجعَل
  rationale: صياغة عربية طبيعية بعد «ينتظر»، وتحفظ المبني للمجهول في الفعل اليوناني وصورة التحويل إلى موطئ.
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: أعداؤه
  rationale: نقل مباشر وطبيعي للتركيب الإضافي اليوناني.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: موطئًا لقدميه
  rationale: يحفظ الصورة الحسية والإحالة إلى مزمور 110:1، وهو أفصح في العربية المعاصرة من النقل الحرفي «مسندًا لقدميه».
theological_decisions:
- issue: صورة التنصيب المسياني المقتبسة من مزمور 110:1
  choice: الإبقاء على صورة الأعداء الذين يُجعَلون موطئًا لقدميه
  alternative: إلى أن يُهزَم أعداؤه / إلى أن يُخضَع أعداؤه
  rationale: الصورة المقصودة تحمل صدى نص المزمور ووظيفته في حجة الرسالة؛ واختزالها إلى الهزيمة أو الإخضاع يزيل هذا الترابط النصي.
- issue: فاعل إخضاع الأعداء غير المصرح به في المبني للمجهول
  choice: 'حفظ المبني للمجهول: «أن يُجعَل أعداؤه»'
  alternative: إلى أن يجعل الله أعداءه
  rationale: النص اليوناني لا يذكر الفاعل صراحة في هذه الآية، لذلك لا ينبغي إدخاله في المتن، وإن كان صدى المزمور والسياق يوضحانه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «موطئًا لقدميه» للمحافظة على الصورة الكتابية بصياغة طبيعية، ووُضعت علامتا الحاشيتين عقب العبارة التي تتصلان بها.
