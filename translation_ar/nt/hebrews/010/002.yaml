base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: ar
  text: وإلّا، أفما كانت قد توقفت عن أن تُقدَّم، لأن العابدين، بعد أن طُهِّروا مرة واحدة[b]، لم يعد لديهم أي وعي بالخطايا[a]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إحساس الضمير بالخطايا». قد تدل العبارة اليونانية على الضمير أو الوعي أو الإدراك المتعلق بالخطايا؛ والمقصود هنا استمرار الشعور بالذنب أمام الله.
    reason: lexical_alternative
  - marker: b
    text: أو «طُهِّروا مرة واحدة تطهيرًا نهائيًا». قد تحمل عبارة «مرة واحدة» في هذا السياق معنى الحسم وعدم التكرار.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: وإلّا
  rationale: تُبرز الاستنتاج المخالف للواقع المرتبط بحجة الآية السابقة، وتلائم سياق السؤال البلاغي.
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: أفما كانت قد توقفت عن أن تُقدَّم
  rationale: تنقل صيغة السؤال البلاغي المخالف للواقع، وتحافظ على كون الذبائح هي التي يُكفّ عن تقديمها دون إضافة تفسير زائد.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: لأن ... لم يعد لديهم أي
  rationale: تنقل علاقة التعليل التي تفيدها διά مع المصدر المعرّف، وتعبّر بوضوح عن زوال الحالة المستمرة.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: وعي بالخطايا
  rationale: يحفظ المجال الدلالي الذي يشمل الوعي وإحساس الضمير، ولا يوحي بزوال القدرة الأخلاقية على تمييز الخطية.
- source_word: τοὺς λατρεύοντας
  choice: العابدين
  rationale: صياغة عربية موجزة وطبيعية للمشاركين في العبادة، مع إبقاء الدلالة التعبدية للفعل.
- source_word: ἅπαξ
  choice: مرة واحدة
  rationale: تحافظ على المعنى المباشر للظرف من غير حسم ما إذا كان السياق يقتضي التصريح بمعنى «مرة واحدة نهائية».
- source_word: κεκαθαρισμένους
  choice: بعد أن تطهّروا
  rationale: تنقل التطهير المكتمل السابق للحالة المفترضة، وتأتي بصياغة عربية طبيعية؛ والمبني للمجهول في اليونانية يُفهم هنا دون تعيين الفاعل.
theological_decisions:
- issue: دلالة συνείδησιν ἁμαρτιῶν بعد التطهير
  choice: وعي بالخطايا
  alternative: إحساس الضمير بالخطايا
  rationale: المقصود في سياق الحجة استمرار الوعي المثقل بالخطايا أمام الله، لا فقدان الضمير الأخلاقي أو انعدام إدراك الخطية كليًا.
- issue: قوة ἅπαξ الزمنية والنهائية
  choice: مرة واحدة في المتن مع بيان الاحتمال الأقوى في الحاشية
  alternative: مرة واحدة نهائية
  rationale: اللفظة تحتمل معنى الحدث الواحد ومعنى الحسم غير المتكرر في هذا السياق؛ لذلك لا يُحسم هذا التوتر في المتن.
