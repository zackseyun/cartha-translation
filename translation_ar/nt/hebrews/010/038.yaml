source:
  edition: SBLGNT
  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: ar
  text: أَمَّا بَارِّي[b] فَبِالإِيمَانِ[a] يَحْيَا، وَإِنْ تَرَاجَعَ[c]، فَلَا تُسَرُّ بِهِ نَفْسِي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بالأمانة» أو «بالثقة». يمكن للكلمة اليونانية πίστις أن تحمل هذه المعاني، لكن المتن اختار المقابل المعتاد «الإيمان».
    reason: lexical_alternative
  - marker: b
    text: تقرأ بعض المخطوطات «البارّ» فقط بدل «بارّي».
    reason: textual_variant
  - marker: c
    text: صيغة المفرد المذكر في «تراجع» والضمير في «به» يعكسان الصياغة اليونانية، ويُستعملان هنا استعمالًا تمثيليًا لا يقتصر بالضرورة على الذكور.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ δίκαιός μου
  choice: أَمَّا بَارِّي
  rationale: «البارّ» صفة استُعملت اسمًا لشخص يتصف بالبر، والضمير المتصل في «بارّي» يحفظ قراءة SBLGNT التي تتضمن μου («لي/ـي»). وصيغة «أمّا» تنقل قوة δέ الانتقالية والتقابلية بصورة عربية طبيعية.
- source_word: ἐκ πίστεως
  choice: بِالإِيمَانِ
  rationale: تنقل الباء معنى الأساس أو الوسيلة الذي تؤديه ἐκ في هذا السياق. و«الإيمان» هو المقابل الرئيس لـ πίστις، مع إبقاء احتمالي «الأمانة» و«الثقة» في الحاشية.
- source_word: ζήσεται
  choice: يَحْيَا
  rationale: المضارع العربي هنا صالح للتقرير ذي الدلالة المستقبلية أو العامة، وينقل معنى الفعل اليوناني المستقبل من غير تكلف.
- source_word: ὑποστείληται
  choice: تَرَاجَعَ
  rationale: يفيد الفعل الانسحاب أو النكوص تحت الضغط. و«تراجع» واضح في العربية المعاصرة ويحافظ على معنى التحذير.
- source_word: οὐκ εὐδοκεῖ
  choice: فَلَا تُسَرُّ
  rationale: يعبر عن عدم الرضا أو عدم الابتهاج بشخص، ويحفظ الصياغة الشخصية القوية في النص.
- source_word: ἡ ψυχή μου
  choice: نَفْسِي
  rationale: يحفظ التعبير الصريح «نفسي» بدل تسطيحه إلى «أنا»، مراعاة لصدى الاقتباس الكتابي.
- source_word: ἐν αὐτῷ
  choice: بِهِ
  rationale: الباء هي الصياغة العربية الطبيعية مع «تُسرّ»، وتنقل علاقة ἐν αὐτῷ في هذا التركيب.
theological_decisions:
- issue: دلالة πίστις في ἐκ πίστεως
  choice: الإيمان
  alternative: الأمانة أو الثقة
  rationale: يمكن أن تحمل πίστις هذه الدلالات في السياق، ولا سيما في صدى حبقوق؛ لذلك اعتمد المتن المقابل الأشيع «الإيمان» مع توثيق البدائل دون حسم النقاش اللاهوتي.
- issue: مرجع الفاعل في «وإن تراجع»
  choice: الشخص المفرد نفسه المذكور بلفظ «بارّي»
  alternative: شخص غير معيّن مغاير لـ«بارّي»
  rationale: تستمر الصياغة اليونانية بالمفرد المذكر من غير إعلان تبدّل في الفاعل. وتحافظ الترجمة على هذا الترابط وعلى حدة التحذير بدل حل التوتر اللاهوتي ضمنيًا.
- issue: التمثيل بالمفرد المذكر
  choice: الإبقاء على صيغة المفرد المذكر في «تراجع» والضمير في «به»
  alternative: صياغة جمع أو صياغة محايدة جنسيًا
  rationale: تعكس الصيغة العربية نحو الأصل اليوناني، مع توضيح أن المذكر هنا تمثيلي ولا يقصر المعنى على الرجال.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة. اختير «بارّي» لإيجاز تركيب «البارّ الذي لي»، و«تراجع» لوضوحها للقارئ العام، مع إبقاء التعبير الكتابي «نفسي» والمحافظة على الغموض الدلالي والتوتر اللاهوتي في موضعي الإيمان والتراجع.
