  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: ar
  text: لِأَنَّهُ يَسْتَحِيلُ أَنْ يُزِيلَ دَمُ الثِّيرَانِ وَالتُّيُوسِ الْخَطَايَا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ينزع الخطايا». يمكن أن يدل الفعل اليوناني على النزع أو الإزالة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: يستحيل
  rationale: ينقل قوة الصفة الخبرية المستعملة استعمالًا غير شخصي مع المصدر، ويعبّر بوضوح عن الاستحالة المطلقة.
- source_word: γὰρ
  choice: لأنه
  rationale: أداة تعليل تربط الآية بالحجة السابقة وتبيّن سببها.
- source_word: αἷμα
  choice: دم
  rationale: يحافظ على الصورة الذبائحية الصريحة والمحورية في سياق الرسالة، من غير استبدالها بتفسير مثل «الذبائح».
- source_word: ταύρων
  choice: الثيران
  rationale: ترجمة مباشرة لجمع ταῦρος في تركيب الإضافة إلى الدم.
- source_word: τράγων
  choice: التيوس
  rationale: τράγος يدل تحديدًا على ذكر الماعز، و«التيوس» لفظ عربي واضح ودقيق يلائم السياق الذبائحي.
- source_word: ἀφαιρεῖν
  choice: ينزع
  rationale: يحفظ المعنى الحسي للفعل، أي الأخذ والإزالة، ويلائم تعلقه بالخطايا من غير شرح لاهوتي زائد.
- source_word: ἁμαρτίας
  choice: الخطايا
  rationale: يحافظ على صيغة الجمع الصريحة في اليونانية.
theological_decisions:
- issue: مدى فاعلية دم الذبائح الحيوانية
  choice: النص يقرر أن دم الثيران والتيوس لا يستطيع نزع الخطايا.
  alternative: قد تُفهم الذبائح على أنها تحقق تطهيرًا طقسيًا أو أثرًا مؤقتًا من غير الإزالة النهائية للخطايا.
  rationale: تلتزم الصياغة بعبارة النص ولا تُدخل في المتن تفسيرًا مذهبيًا لطبيعة الأثر المؤقت أو الطقسي، فتحفظ التوتر الذي يوضحه سياق الرسالة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «التيوس» للدقة في نقل ذكور الماعز، و«ينزع» للحفاظ على قوة الصورة الأصلية، مع ذكر «يزيل» بديلًا معجميًا في الحاشية.
