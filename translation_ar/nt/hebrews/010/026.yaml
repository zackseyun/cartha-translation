source:
  edition: SBLGNT
  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: ar
  text: لأننا إن واصلنا ارتكاب الخطايا عمدًا بعد أن نلنا معرفة الحق[a]، فلا تبقى بعد ذلك ذبيحة عن الخطايا،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المعرفة التامة بالحق». قد تدل الكلمة اليونانية على معرفة أتم أو حاسمة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: عمدًا
  rationale: تعبير عربي واضح ومعاصر ينقل قصد الفعل وإراديته من غير نبرة قانونية أو قديمة زائدة.
- source_word: γὰρ
  choice: لأننا إن
  rationale: تنقل «لأن» الصلة التفسيرية بما سبق، ويجعل إدخال «إن» تركيب الحال المطلقة اليوناني طبيعيًا في العربية.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: إن واصلنا ارتكاب الخطايا
  rationale: ينقل اسم الفاعل المضارع معنى الاستمرار، لا مجرد خطيئة منفردة، ويصرّح بضمير المتكلمين الجمع.
- source_word: μετὰ τὸ λαβεῖν
  choice: بعد أن نلنا
  rationale: يحفظ التعاقب الزمني وكون نيل المعرفة سابقًا للاستمرار في الخطايا.
- source_word: ἐπίγνωσιν
  choice: معرفة
  rationale: الترجمة الطبيعية المباشرة؛ وقد تحمل اللفظة معنى المعرفة الأتم أو الحاسمة، فذُكر ذلك في الحاشية بدل فرضه في المتن.
- source_word: τῆς ἀληθείας
  choice: الحق
  rationale: تعبير عربي كتابي طبيعي يحفظ التعريف والإضافة الدلالية في اليونانية.
- source_word: οὐκέτι
  choice: فلا تبقى بعد ذلك
  rationale: يبين انتفاء البقاء من تلك النقطة فصاعدًا، مع صياغة عربية سلسة.
- source_word: περὶ ἁμαρτιῶν
  choice: عن الخطايا
  rationale: في السياق الذبائحي تؤدي «عن» معنى الذبيحة المقدمة في شأن الخطايا، وتحافظ على العبارة المألوفة من غير توسع تفسيري.
- source_word: ἀπολείπεται
  choice: تبقى
  rationale: تنقل معنى البقاء أو كون الشيء متروكًا، وتلائم الفاعل المؤخر «ذبيحة».
- source_word: θυσία
  choice: ذبيحة
  rationale: المقابل العربي الدقيق في السياق الشعائري وفي حجة الرسالة عن الذبيحة، مع إبقاء التنكير كما في اليونانية.
theological_decisions:
- issue: دلالة الاستمرار في ἁμαρτανόντων والقوة الرعوية للتحذير
  choice: إن واصلنا ارتكاب الخطايا عمدًا
  alternative: إن أخطأنا عمدًا
  rationale: صيغة اسم الفاعل المضارع ترجّح الفعل المستمر أو المتواصل. تحافظ الصياغة على شدة التحذير من دون جعله حكمًا صريحًا على فعل منفرد، ولا تحسم جدلًا مذهبيًا بشأن الارتداد أو الثبات.
- issue: مدى دلالة ἐπίγνωσις في سياق التحذير
  choice: معرفة الحق
  alternative: المعرفة التامة بالحق
  rationale: النص يقرر نيل معرفة الحق، لكنه لا يحدد صراحةً طبيعتها الخلاصية أو التجديدية. لذلك بقي المتن معجميًا، وأُثبت احتمال معنى المعرفة الأتم في الحاشية من غير حسم هوية المخاطَبين لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «واصلنا ارتكاب الخطايا» لإظهار الاستمرار، و«ذبيحة عن الخطايا» للمحافظة على الحقل الذبائحي في الرسالة. وُضع رمز الحاشية [a] في المتن.
