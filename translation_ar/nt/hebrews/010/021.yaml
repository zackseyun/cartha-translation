  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἱερέα μέγαν ἐπὶ τὸν οἶκον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/021.yaml
  text: and a great priest over the house of God[b][a],
translation:
  language: ar
  text: ولنا كاهنٌ عظيمٌ على بيت الله[a][b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رئيس كهنة». تعرض الرسالة إلى العبرانيين يسوع مرارًا بصفته رئيس الكهنة، لكن العبارة هنا تقول حرفيًا: «كاهن عظيم».'
    reason: alternative_reading
  - marker: b
    text: قد يعني «بيت الله» أيضًا أهل بيت الله، أي شعبه.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ولنا
  rationale: الواو تربط هذه العبارة بما قبلها، وأُعيد فعل الملكية المفهوم من السياق العربي لتستقيم العبارة بوصفها جزءًا من الجملة الممتدة في الآيات 19–21.
- source_word: ἱερέα
  choice: كاهنٌ
  rationale: تعني ἱερεύς «كاهنًا»، لا اللقب الاصطلاحي ἀρχιερεύς «رئيس كهنة»؛ لذلك حُفظ الفرق اللفظي.
- source_word: μέγαν
  choice: عظيمٌ
  rationale: تنعت الكاهن بالعظمة والرفعة من غير تحويل التركيب إلى لقب «رئيس كهنة».
- source_word: ἐπὶ
  choice: على
  rationale: تفيد هنا الإشراف والسلطان على بيت الله، و«على» صياغة عربية موجزة تحفظ صورة الأصل.
- source_word: τὸν οἶκον
  choice: بيت
  rationale: يحفظ «بيت» الاستعارة الكتابية، مع احتمال أن يدل اللفظ أيضًا على أهل البيت، أي جماعة الله.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: إضافة مباشرة تبيّن أن البيت لله.
theological_decisions:
- issue: هل يُترجم ἱερέα μέγαν باللقب الاصطلاحي «رئيس كهنة»؟
  choice: كاهنٌ عظيمٌ
  alternative: رئيس كهنة
  rationale: مع أن الرسالة تعرض يسوع مرارًا بصفته رئيس الكهنة، فإن النص هنا يستعمل ἱερεύς مع μέγας، لا ἀρχιερεύς. لذا تحافظ الترجمة على الصياغة اليونانية ولا تُدخل اللقب الاصطلاحي ضمنًا.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة. أُثبتت «ولنا» لبيان تعلق العبارة بالبنية النحوية السابقة، مع الحفاظ على الاستعارة «بيت الله» وعلى الفرق بين «كاهن عظيم» و«رئيس كهنة».
