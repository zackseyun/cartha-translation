  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: ar
  text: فقد شاركتم السجناء في آلامهم[a]، وتقبَّلتم بفرح نهب ممتلكاتكم، عالمين أن لكم أنتم أنفسكم مِلكًا أفضل ودائمًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تعاطفتم مع السجناء». يمكن أن يدل الفعل اليوناني على التعاطف، غير أن السياق يرجّح هنا مشاركتهم في المعاناة.'
    reason: lexical_alternative
  - marker: b
    text: 'تقرأ بعض المخطوطات: «عالمين أن لكم في السماوات مِلكًا أفضل ودائمًا».'
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: السجناء
  rationale: تدل الكلمة على المقيَّدين أو المسجونين؛ و«السجناء» تعبير عربي واضح ومباشر يلائم السياق.
- source_word: συνεπαθήσατε
  choice: شاركتم ... في آلامهم
  rationale: يحفظ هذا التعبير معنى التضامن الفعلي والمشاركة في المعاناة، ولا يقصر الفعل على مجرد شعور داخلي بالشفقة، مع إثبات البديل المعجمي في الحاشية.
- source_word: ἁρπαγήν
  choice: نهب
  rationale: «نهب» ينقل معنى الأخذ القسري الجائر، وهو أقوى وأدق من لفظ إداري مثل «مصادرة».
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: ممتلكاتكم
  rationale: التركيب يدل على ما يملكه المخاطبون من أموال وأمتعة، و«ممتلكاتكم» واضح في العربية المعاصرة.
- source_word: μετὰ χαρᾶς
  choice: بفرح
  rationale: صياغة موجزة وطبيعية تحافظ على بنية شبه الجملة وعلى إبراز الفرح.
- source_word: προσεδέξασθε
  choice: تقبَّلتم
  rationale: يفيد قبول وقوع الخسارة واحتمالها طوعًا، من غير أن يوحي باستحسان فعل النهب نفسه.
- source_word: γινώσκοντες
  choice: عالمين
  rationale: يحافظ اسم الفاعل على صيغة المشاركة في اليونانية وعلى دلالتها السببية المحتملة من غير تحويلها صراحة إلى جملة سببية.
- source_word: ἑαυτοὺς ἔχειν
  choice: أن لكم أنتم أنفسكم
  rationale: يثبت الضمير الانعكاسي المؤكد في النص المختار، ويعبّر عنه بتوكيد عربي طبيعي.
- source_word: κρείττονα
  choice: أفضل
  rationale: يحفظ لفظ المقارنة المتكرر في الرسالة إلى العبرانيين من غير تضخيمه إلى معنى لا يصرّح به النص.
- source_word: ὕπαρξιν
  choice: مقتنًى
  rationale: يدل هنا على شيء مملوك أو حيازة، ويصلح مفردًا في مقابل الممتلكات الأرضية من غير تحديده بأنه ميراث أو مكافأة.
- source_word: μένουσαν
  choice: باقيًا
  rationale: ينقل معنى الدوام والثبات، ويوافق «مقتنًى» في التذكير والإعراب بصياغة عربية طبيعية.
theological_decisions:
- issue: دلالة التضامن مع المؤمنين المسجونين
  choice: المشاركة في آلام السجناء
  alternative: التعاطف مع السجناء
  rationale: الفعل اليوناني يحتمل التعاطف، لكن عنصر المشاركة الذي يفيده السياق وبادئة الفعل يجعل التضامن المكلف أرجح؛ ومع ذلك أُثبت البديل في الحاشية حفظًا للمدى الدلالي.
- issue: ماهية «المقتنى الأفضل والباقي»
  choice: الإبقاء على الوصف العام من غير تعيين موضعه أو طبيعته
  alternative: مقتنى أفضل في السماوات، أو ميراث أخروي
  rationale: النص المختار لا يذكر «في السماوات» ولا يسمّي هذا المقتنى ميراثًا أو مكافأة، لذلك لا تحدده الترجمة لاهوتيًا، مع توثيق القراءة النصية الأطول في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «شاركتم السجناء في آلامهم» لتجنب تعبير حرفي متكلف، و«مقتنًى» للمحافظة على المفرد وعلى عمومية المرجع، من غير إدخال تفسير مذهبي أو تحديد أخروي لا يصرّح به النص المختار.
