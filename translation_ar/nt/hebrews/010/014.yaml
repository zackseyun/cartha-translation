base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: ar
  text: فَإِنَّهُ بِتَقْدِمَةٍ وَاحِدَةٍ قَدْ أَكْمَلَ إِلَى الأَبَدِ الَّذِينَ يُقَدَّسُونَ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين يُجعَلون مقدَّسين».'
    reason: بديل معجمي يوضح الدلالة الحرفية للمبني للمجهول في ἁγιαζομένους.
lexical_decisions:
- source_word: μιᾷ
  choice: واحدة
  rationale: نعتٌ مفرد مؤنث يطابق «تقدمة»، ويحافظ على التشديد على وحدانية التقدمة.
- source_word: γὰρ
  choice: لأنه
  rationale: تفيد تعليل ما سبق وتربط الآية بسياق الحجة ربطًا طبيعيًا في العربية.
- source_word: προσφορᾷ
  choice: بتقدمة
  rationale: «تقدمة» تقابل معنى ما يُقدَّم لله، وتحافظ على عموم اللفظ اليوناني دون حصره تفسيريًا في «ذبيحة».
- source_word: τετελείωκεν
  choice: أكمل
  rationale: ينقل الفعل معنى الإيصال إلى الكمال أو الغاية؛ والسياق مع «إلى الأبد» يُظهر بقاء نتيجة الفعل التام.
- source_word: εἰς τὸ διηνεκές
  choice: إلى الأبد
  rationale: تعبير عربي طبيعي يدل هنا على دوام أثر التقدمة واستمراره.
- source_word: τοὺς ἁγιαζομένους
  choice: الذين يُقدَّسون
  rationale: يحافظ المبني للمجهول على كونهم متلقّي فعل التقديس، وتفيد الصيغة الجارية استمرار الفعل دون تسوية التوتر مع «أكمل».
theological_decisions:
- issue: العلاقة بين الإكمال المنجَز والتقديس الجاري
  choice: الإبقاء على «أكمل» إلى جانب «يُقدَّسون»
  alternative: صياغة الطرفين كحالة منجزة فقط، أو إضعاف الإكمال بجعله عملية مستمرة
  rationale: يجمع النص اليوناني عمدًا بين فعل تام ذي نتيجة باقية وبين اسم فاعل مضارع مبني للمجهول؛ لذلك تحفظ الترجمة البعدين من غير حسمهما وفق منظومة لاهوتية بعينها.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُعملت «تقدمة» للدقة المعجمية، و«يُقدَّسون» للحفاظ على المصطلح اللاهوتي وعلى دلالة الفعل الجاري.
