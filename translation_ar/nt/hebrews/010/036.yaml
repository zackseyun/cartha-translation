  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: ar
  text: فَإِنَّكُمْ تَحْتَاجُونَ إِلَى الصَّبْرِ، لِكَيْ، بَعْدَ أَنْ تَعْمَلُوا مَشِيئَةَ اللهِ، تَنَالُوا الْوَعْدَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تنالوا ما وُعِدتم به».'
    reason: تحفظ الحاشية احتمال أن تدل «الوعد» في هذا السياق على الشيء الموعود به أو تحقيق الوعد.
lexical_decisions:
- source_word: ὑπομονῆς
  choice: الثبات
  rationale: تدل الكلمة على الصمود المستمر تحت الضغط والمحن؛ و«الثبات» تعبير عربي طبيعي وموجز يحفظ معنى المثابرة دون إضافة تفسير زائد.
- source_word: χρείαν ἔχετε
  choice: تحتاجون إلى
  rationale: هذا هو المقابل العربي الطبيعي للعبارة الاصطلاحية اليونانية التي تعني الاحتياج.
- source_word: ἵνα
  choice: حتى
  rationale: تفيد الغاية أو النتيجة المقصودة، و«حتى» تؤدي هذا المعنى بسلاسة في العربية.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: مشيئة الله
  rationale: صياغة عربية واضحة ومألوفة تحفظ معنى التركيب الإضافي اليوناني.
- source_word: ποιήσαντες
  choice: بعد أن تعملوا
  rationale: اسم الفاعل الأُورِسْتي يدل هنا على فعل سابق للفعل الرئيس؛ فالصياغة تُظهر أن عمل مشيئة الله يسبق نوال الوعد.
- source_word: κομίσησθε
  choice: تنالوا
  rationale: يفيد الفعل في السياق الحصول على ما وُعد به؛ و«تنالوا» طبيعية ودقيقة في اقترانها بالوعد.
- source_word: τὴν ἐπαγγελίαν
  choice: الوعد
  rationale: يحفظ اللفظ الاسمي الصريح في اليونانية، مع إبقاء احتمال أن يكون المقصود مضمون الوعد أو تحقيقه في الحاشية.
theological_decisions:
- issue: هل تشير ἐπαγγελίαν إلى الوعد نفسه أم إلى ما وُعد به؟
  choice: الوعد
  alternative: ما وُعِدتم به
  rationale: النص اليوناني يقول حرفيًا «الوعد»، لكن اقترانه بفعل «تنالوا» قد يدل اصطلاحيًا على نوال مضمون الوعد. أبقى المتن اللفظ الأقرب إلى الأصل، وتذكر الحاشية الاحتمال الآخر دون حسم التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت «الثبات» بدل تعبير أطول مثل «الصبر المثابر»، واستُعمل ترتيب عربي طبيعي مع الحفاظ على العلاقة الزمنية بين عمل مشيئة الله ونوال الوعد.
