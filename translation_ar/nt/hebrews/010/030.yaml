  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: ar
  text: 'فنحن نعرف مَن قال: «ليَ الانتقام، وأنا سأجازي»، وأيضًا: «الرب سيدين شعبه».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: يرتبط الاقتباسان بتثنية 32:35–36. ويمكن أن تشمل عبارة «سيدين شعبه» في سياقها الأصلي العقاب والإنصاف معًا، أما سياق التحذير هنا فيبرز الدينونة الإلهية.
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν γὰρ
  choice: فنحن نعرف
  rationale: تنقل «نعرف» دلالة οἶδα الحاضرة في اليونانية الكوينية، وتُظهر الفاء صلة التعليل بما قبلها.
- source_word: τὸν εἰπόντα
  choice: القائل
  rationale: صياغة عربية طبيعية وموجزة تحفظ الإشارة الشخصية إلى الله بوصفه المتكلم في الاقتباس.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: ليَ الانتقام
  rationale: تحفظ إيجاز العبارة اليونانية وقوة الاختصاص فيها من غير إضافة فعل تفسيري.
- source_word: ἐγὼ ἀνταποδώσω
  choice: وأنا سأجازي
  rationale: «أجازي» تؤدي معنى المقابلة بالفعل والجزاء، بينما يُبرز الضمير المنفصل ἐγώ توكيد الفاعل.
- source_word: καὶ πάλιν
  choice: وأيضًا
  rationale: صيغة عربية مألوفة لإدخال الاقتباس الثاني من غير إضافة فعل غير موجود في النص.
- source_word: Κρινεῖ κύριος
  choice: الرب سيدين
  rationale: تحفظ الدلالة القضائية الأساسية للفعل κρίνω، الملائمة لسياق التحذير، وتترجم κύριος باللقب المألوف «الرب».
- source_word: τὸν λαὸν αὐτοῦ
  choice: شعبه
  rationale: ترجمة عربية طبيعية تحفظ علاقة الانتماء والعهد من دون توسع.
theological_decisions:
- issue: مدى دلالة κρίνω في الاقتباس من التثنية
  choice: سيدين
  alternative: سينصف
  rationale: قد يشمل الفعل في سياقه الأصلي العقاب والإنصاف معًا، لكن سياق التحذير في عبرانيين 10 يبرز الدينونة الإلهية؛ لذلك تُحفظ العبارة العامة «سيدين» من غير حصرها في الإنصاف وحده.
- issue: تخصيص الانتقام والجزاء لله
  choice: ليَ الانتقام، وأنا سأجازي
  alternative: الانتقام لي، وأنا سأكافئ
  rationale: تحفظ الصياغة اختصاص الانتقام بالله وتوكيد أنه صاحب الجزاء، من غير تلطيف للقوة الجزائية في الاقتباس أو إدخال تحديد مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعملت «ليَ الانتقام» للحفاظ على إيجاز الأصل وقوته، و«سيدين» للإبقاء على المدى القضائي من غير تضييق تفسيري.
