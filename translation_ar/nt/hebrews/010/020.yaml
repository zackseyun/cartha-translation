  terminology: «الحجاب» مناسب لـκαταπέτασμα، و«جسده» مقابل عربي طبيعي لـσάρξ في هذا السياق. لا ينبغي إضافة «عبر» قبل «جسده»، لأن اليونانية تقدم العبارة على أنها تفسير للحجاب، لا تكرار صريح لحرف الجر.
