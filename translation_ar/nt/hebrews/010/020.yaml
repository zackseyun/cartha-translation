lexical_decisions:
- source_word: ἣν
  choice: الذي
  rationale: اسم موصول يعود إلى «طريقًا» في هذه الجملة؛ وجاء مذكرًا موافقةً لجنس «طريق» في العربية.
- source_word: ἐνεκαίνισεν
  choice: افتتحه
  rationale: ينقل معنى إنشاء الطريق وبدء إتاحته للاستعمال، بصياغة عربية طبيعية، مع بقاء معنى التدشين حاضرًا في السياق.
- source_word: ἡμῖν
  choice: لنا
  rationale: يعبّر عن دال المنفعة، أي إن الطريق افتُتح لأجلنا.
- source_word: ὁδὸν
  choice: طريقًا
  rationale: يحافظ على صورة الطريق بوصفه سبيل الدخول والاقتراب.
- source_word: πρόσφατον
  choice: جديدًا
  rationale: ينقل معنى الطريق المستحدث حديثًا دون استعمال تعبير عربي متكلف مثل «طازج».
- source_word: ζῶσαν
  choice: حيًّا
  rationale: يحافظ على الوصف المباشر للطريق بأنه حي، من غير تفسيره تفسيرًا زائدًا مثل «واهبًا للحياة».
- source_word: διὰ τοῦ καταπετάσματος
  choice: عبر الحجاب
  rationale: «الحجاب» مصطلح عربي معروف للستار الفاصل في خيمة الاجتماع والهيكل، و«عبر» تنقل معنى المرور من خلاله.
- source_word: τοῦτ’ ἔστιν
  choice: أي
  rationale: صيغة تفسيرية عربية موجزة وطبيعية تقابل «أي/بمعنى» في اليونانية.
- source_word: τῆς σαρκὸς αὐτοῦ
  choice: جسده
  rationale: «الجسد» هو المقابل العربي الطبيعي هنا لـσάρξ حين تشير إلى وجود المسيح الجسدي، ويجنب الإيحاء المادي الضيق لكلمة «لحم».
theological_decisions:
- issue: علاقة الحجاب بجسد المسيح
  choice: «أي جسده» بوصفها عبارة تفسيرية تحدد مدلول صورة الحجاب
  alternative: «أي عبر جسده»
  rationale: النص اليوناني يضع «جسده» بدلًا تفسيريًا بعد «الحجاب». عدم تكرار «عبر» يحافظ على بنية النص وعلى التوتر المجازي، من غير أن ينفي أن المرور يتم عبر جسده.
- issue: ترجمة σάρξ
  choice: جسده
  alternative: لحمه
  rationale: السياق يشير إلى بشرية يسوع الجسدية وموته، و«جسده» أفصح وأوضح للقارئ العربي، من غير تحويل اللفظ إلى مفهوم مذهبي مثل «الطبيعة البشرية».
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. حافظت الصياغة على كون الآية جزءًا من جملة ممتدة من العدد السابق، وعلى الاستعارة من دون شرحها داخل المتن.
