  verdict: revise
  source_fidelity: 'الترجمة تنقل البنية الأساسية بأمانة: طريق جديد حيّ، عبر الحجاب، ثم التفسير «أي جسده». غير أن تبرير الاسم الموصول في قرار المعجم غير دقيق؛ فالاسم الموصول في اليونانية يعود إلى «المدخل/الدخول» في العدد السابق، لا إلى «طريق» الذي يرد خبرًا/وصفًا يبيّن هذا المدخل. والصياغة العربية يمكن أن تُظهر هذا التعلّق بوضوح أكبر مع إبقاء الآية جزءًا من الجملة السابقة.'
