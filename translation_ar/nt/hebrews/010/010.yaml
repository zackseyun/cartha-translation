lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: وبهذه المشيئة
  rationale: يحيل اسم الإشارة إلى مشيئة الله المذكورة في السياق السابق، وتؤدي الباء المعنى الوسيلي الذي تحمله ἐν هنا، مع صياغة عربية طبيعية.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: قد تقدَّسنا
  rationale: 'تنقل «قد» مع الماضي معنى الفعل التام: حدثٌ تمّ وتبقى نتيجته، من غير تحويله إلى عملية مستمرة.'
- source_word: διὰ τῆς προσφορᾶς
  choice: بتقديم
  rationale: الباء تبيّن الوسيلة، و«تقديم» تقابل προσφορά وتحافظ على صورة القربان من غير استبدالها بالتفسير الأوسع «ذبيحة».
- source_word: τοῦ σώματος
  choice: جسد
  rationale: تحافظ العبارة على الإشارة الملموسة إلى الجسد، ويحدّد المضاف إليه «يسوع المسيح» صاحبه بوضوح.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، ويبقي دلالته المسيانية ضمن الصياغة العربية المألوفة.
- source_word: ἐφάπαξ
  choice: مرةً واحدةً وإلى الأبد
  rationale: تعبّر عن كون التقديم حدث مرة واحدة ذا صلاحية نهائية غير متكررة، وهو المقصود من الظرف في سياق الرسالة.
theological_decisions:
- issue: قوة صيغة التقديس الزمنية واللاهوتية
  choice: قد تقدَّسنا
  alternative: نحن مقدَّسون؛ نتقدَّس
  rationale: الصيغة اليونانية تامة محيطية، فتدل على فعل مكتمل ذي نتيجة باقية، لا على حاضر مستمر. تحافظ الصياغة على ذلك من غير حسمٍ مذهبي لطبيعة التقديس أبعد مما يقوله التركيب.
- issue: دلالة Χριστός
  choice: المسيح
  alternative: كريستوس
  rationale: ينقل «المسيح» معنى اللقب في العربية بوضوح، بدل معاملته بوصفه اسمًا صوتيًا مجردًا.
- issue: نهائية التقديم
  choice: مرةً واحدةً وإلى الأبد
  alternative: مرةً واحدة
  rationale: تُظهر الصياغة قوة ἐφάπαξ في السياق، أي التفرد وعدم التكرار، من غير إضافة تفسير عن كيفية فاعلية التقدمة.
