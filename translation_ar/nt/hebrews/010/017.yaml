  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: ar
  text: وَلَنْ أَذْكُرَ خَطَايَاهُمْ وَمُخَالَفَاتِهِمْ لِلشَّرِيعَةِ بَعْدَ الآنَ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة تُظهر قوة النفي: «لن أذكر خطاياهم ومخالفاتهم للشريعة بعد الآن أبدًا».'
    reason: lexical_alternative
  - marker: b
    text: «مخالفاتهم للشريعة» تترجم الكلمة اليونانية ἀνομίαι، التي تدل على مخالفة الشريعة أو انتهاكها؛ ويمكن أيضًا ترجمتها «أعمالهم المخالفة للشريعة» أو «تعدياتهم».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف يصل هذه العبارة بما قبلها ضمن الاقتباس المستمر.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: خَطَايَاهُمْ
  rationale: ترجمة مباشرة وطبيعية للجمع، وتحافظ على اللفظ الكتابي المألوف للخطيئة.
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: وَآثَامَهُمْ
  rationale: «الآثام» لفظ عربي واضح ورصين يدل على الأفعال المخالفة للحق والشريعة، ويلائم الجمع الملموس في السياق.
- source_word: οὐ μὴ μνησθήσομαι
  choice: لَنْ أَذْكُرَ
  rationale: «لن» مع المضارع تنقل النفي المستقبلي القاطع، مع إبقاء صورة الذكر وعدم الذكر كما في الأصل.
- source_word: ἔτι
  choice: بَعْدُ
  rationale: مع النفي تفيد «بعد الآن/فيما بعد»، وتعبّر بإيجاز طبيعي عن معنى عدم الذكر من الآن فصاعدًا.
theological_decisions:
- issue: عدم تذكّر الله للخطايا
  choice: الإبقاء على التعبير «لن أذكر» دون تفسيره
  alternative: «لن أحاسبهم بعد على خطاياهم» أو «لن أستحضرها بعد»
  rationale: يحافظ ذلك على الصورة العهدية الواردة في النص وعلى توترها اللاهوتي، من غير تحويلها إلى تقرير عن فقدان المعرفة ولا حصرها في تفسير بعينه.
- issue: قوة النفي οὐ μὴ مع ἔτι
  choice: «لن أذكر بعدُ»
  alternative: «لن أذكر أبدًا بعد الآن»
  rationale: «لن» تؤدي النفي المستقبلي القاطع، و«بعدُ» تنقل معنى ἔτι، أما إضافة «أبدًا» فقد تثقل العربية مع أن قوة النفي يمكن بيانها في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «بعدُ» استعمالًا فصيحًا موجزًا بعد النفي، وحُفظ العطف الابتدائي لأن الآية تتمة للاقتباس السابق.
