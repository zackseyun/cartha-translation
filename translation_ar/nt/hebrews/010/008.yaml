source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: ar
  text: 'وبعد أن قال آنفًا: «ذبائح وقرابين ومُحرَقات[a] وذبائح عن الخطية[b] لم تُرِدْ، ولم تُسَرَّ بها»—وهي تُقَدَّم بحسب الشريعة[c]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي ذبائح تُحرَق بكاملها على المذبح.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قرابين عن الخطية».'
    reason: lexical_alternative
  - marker: c
    text: أي بحسب شريعة موسى.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: وبعد أن قال آنفًا
  rationale: يفيد الرجوع إلى العبارة السابقة في الاقتباس، ويهيئ في العربية للعبارة اللاحقة في العدد التالي.
- source_word: Θυσίας καὶ προσφορὰς
  choice: ذبائح وقرابين
  rationale: يحافظ على التمييز بين مصطلحين قربانيين، مع استعمال ألفاظ عربية واضحة وشائعة في السياق التعبدي.
- source_word: ὁλοκαυτώματα
  choice: محرقات
  rationale: مصطلح قرباني موجز يدل على الذبائح التي تُحرق بكاملها؛ وتوضح الحاشية دلالته الخاصة.
- source_word: περὶ ἁμαρτίας
  choice: ذبائح عن الخطية
  rationale: يفهم التعبير في سياقه القرباني بوصفه فئة من الذبائح المقدمة بشأن الخطية، مع إبقاء الصياغة قريبة من اليونانية.
- source_word: οὐκ ἠθέλησας
  choice: لم تُرِدْ
  rationale: ينقل معنى الإرادة أو الرغبة مباشرة من غير إضافة تفسيرية.
- source_word: οὐδὲ εὐδόκησας
  choice: ولم تُسَرَّ بها
  rationale: يحفظ التوازي مع الفعل السابق ويعبر عن عدم الرضا أو المسرة؛ والضمير العربي ضروري لاكتمال التركيب الطبيعي.
- source_word: κατὰ νόμον προσφέρονται
  choice: تُقَدَّم بحسب الشريعة
  rationale: ينقل المطابقة لأحكام الناموس؛ واختيار «الشريعة» واضح للقارئ العربي ولا يحصر اللفظ في معنى قانون مدني حديث.
theological_decisions:
- issue: موقف الله السلبي من الذبائح مع كونها مقدمة بحسب الشريعة
  choice: «لم تُرِدْ، ولم تُسَرَّ بها» مع إبقاء «مع أنها تُقَدَّم بحسب الشريعة»
  alternative: صياغة تفسر النفي بأنه رفض مطلق لنظام الذبائح
  rationale: يحافظ النص على التوتر المقصود بين نفي الإرادة والمسرة وبين إقرار أن هذه القرابين تقدم وفق الشريعة، من غير حل لاهوتي مضاف.
- issue: الدلالة الاصطلاحية لعبارة περὶ ἁμαρτίας
  choice: ذبائح عن الخطية
  alternative: قرابين الخطية أو «عن الخطية» فقط
  rationale: يبرز السياق القرباني مع عدم تحميل العبارة تفصيلًا مذهبيًا يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية موقرة. استُعملت «آنفًا» للإحالة إلى الكلام السابق، و«الشريعة» لـ νόμος، مع ضبط الكلمات التي قد يلتبس نطقها. وُضعت جميع علامات الحواشي في مواضعها في المتن.
