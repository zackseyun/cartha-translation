  source_fidelity: 'المعنى العام أمين للنص اليوناني: الشريعة لها «ظل» للخيرات الآتية، والذبائح المتكررة لا تقدر قط أن تُكمّل المتقرّبين. لكن موضع التوكيد في عبارة «صورة الحقائق نفسها» قد يُفهم عربيًا على أنه واقع على «الحقائق» لا على «الصورة»، بينما αὐτὴν تؤكد «الصورة».'
