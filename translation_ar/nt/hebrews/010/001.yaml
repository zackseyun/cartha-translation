  to: لِأَنَّ الشريعةَ، إذ لها ظلُّ الخيرات الآتية لا الصورةُ نفسها للحقائق، لا تستطيع أبدًا، بالذبائح نفسها التي يقدِّمونها على الدوام سنةً بعد سنة، أن تُكمِّل الذين يتقرَّبون[a][b][c].
  rationale: 'نُقلت «نفسها» لتتصل صراحةً بـ«الصورة»، كما في اليونانية، بدل أن يلتبس اتصالها بـ«الحقائق». وأُبقيت سائر عناصر المعنى: الظل والخيرات الآتية، والنفي المطلق للقدرة، والذبائح نفسها، والاستمرار والتكرار السنوي، ودلالة التقرّب والاكتمال.'
