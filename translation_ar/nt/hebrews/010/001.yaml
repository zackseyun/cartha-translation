id: HEB.10.1
reference: Hebrews 10:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: ar
  text: لِأَنَّ الشريعةَ، إذ لها ظلُّ الخيرات الآتية لا الصورةُ نفسها للحقائق، لا تستطيع أبدًا، بالذبائح نفسها التي يقدِّمونها على الدوام سنةً بعد سنة، أن تُكمِّل الذين يتقرَّبون[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا الصورة نفسها للأمور».'
    reason: lexical_alternative
  - marker: b
    text: يحمل «الذين يتقرَّبون» معنى الاقتراب إلى الله في العبادة.
    reason: cultural_note
  - marker: c
    text: 'أو: «أن تجعلهم كاملين» أو «أن تبلغ بهم إلى الغاية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκιὰν
  choice: ظلُّ
  rationale: يحافظ على استعارة «الظل» وعلى مقابلتها بـ«الصورة»، من غير تحويلها إلى تفسير مثل «تمهيد» أو «رمز».
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: الخيرات الآتية
  rationale: تعبير عربي واضح يحفظ الدلالة المستقبلية من غير تحديد توقيتها الأخروي أكثر مما يسمح به النص.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: لا صورةُ الحقائق نفسها
  rationale: ينقل المقابلة بين الظل والصورة ذاتها؛ و«الحقائق» توضح أن المقصود الأمور الفعلية التي يقابلها الظل، مع إثبات البديل الأقرب إلى الحرفية في الحاشية.
- source_word: κατ’ ἐνιαυτὸν
  choice: سنةً بعد سنة
  rationale: يبرز التكرار السنوي المستمر الذي يقوم عليه سياق الحجة.
- source_word: ταῖς αὐταῖς θυσίαις
  choice: بالذبائح نفسها
  rationale: يحفظ دلالة الوسيلة والتوكيد على تكرار الذبائح عينها.
- source_word: ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: التي يقدِّمونها على الدوام
  rationale: يبقي الفعل في صيغة المعلوم والفاعل غير المسمى، وينقل معنى الاستمرار في الممارسة.
- source_word: οὐδέποτε δύναται
  choice: لا تستطيع أبدًا
  rationale: ينقل القدرة المنفية والنفي المطلق بصياغة عربية طبيعية.
- source_word: τοὺς προσερχομένους
  choice: الذين يتقرَّبون
  rationale: يحفظ معنى الاقتراب التعبدي المميز في الرسالة من غير إضافة «إلى الله» إلى المتن، لأنها مضمرة سياقيًا لا مذكورة صراحة.
- source_word: τελειῶσαι
  choice: أن تُكمِّل
  rationale: يحافظ على المصطلح المحوري في الرسالة وعلى معنى الإيصال إلى الغاية، من غير حصره في الكمال الأخلاقي الخالي من الخطأ.
theological_decisions:
- issue: المقابلة بين ظل الشريعة وصورة الحقائق
  choice: للشريعة ظل الخيرات الآتية، لا صورة الحقائق نفسها
  alternative: الشريعة صورة رمزية للخيرات المستقبلية
  rationale: النص اليوناني يقابل صراحةً بين σκιά وεἰκών؛ لذلك تُحفظ المقابلة من غير الانتقاص من دور الشريعة المعطى من الله ولا مساواتها بالواقع النهائي.
- issue: دلالة τελειῶσαι في سياق الذبائح
  choice: تُكمِّل
  alternative: تجعل كاملين / تبلغ بهم إلى الغاية
  rationale: «تُكمِّل» تحفظ الصلة الاصطلاحية داخل الرسالة، مع حاشية تبين أن المعنى قد يكون الإيصال إلى الغاية، لا الادعاء بأن المقصود حصرًا كمال أخلاقي مطلق.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «الشريعة» للمفرد ὁ νόμος، وحُفظت استعارتا الظل والصورة. وُضعت الحواشي عند العبارات التي تفسرها مباشرة، مع إبقاء ترتيب «على الدوام سنةً بعد سنة» ليجمع بين الاستمرار والتكرار السنوي من غير إلغاء أي منهما.
