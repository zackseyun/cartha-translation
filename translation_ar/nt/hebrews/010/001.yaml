  terminology: «الشريعة»، «ظل»، «الخيرات الآتية»، «الذبائح»، «الذين يتقرّبون»، و«تُكمّل» اختيارات مناسبة. ينبغي فقط نقل «نفسها» لتصف «الصورة» بوضوح. الحاشيتان المتعلقتان بالتقرّب والتكميل سليمتان.
