    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: لننتبه
  rationale: فعل مضارع بصيغة الحث للجمع، يدل على توجيه الفكر والعناية نحو الآخرين؛ و«لننتبه» واضحة وطبيعية وتحفظ قوة الدعوة إلى مراعاة بعضنا بعضًا.
- source_word: ἀλλήλους
  choice: بعضنا إلى بعض
  rationale: تعبير تبادلي مألوف في العربية، يبيّن أن الانتباه والعناية متبادلان داخل الجماعة.
- source_word: εἰς
  choice: لكي
  rationale: تفيد هنا الغاية أو النتيجة، و«لكي» توضح الصلة المقصودة بين الانتباه المتبادل والتحفيز، من غير حسم زائد بين الغاية والنتيجة.
- source_word: παροξυσμὸν
  choice: نُحفِّز
  rationale: الاسم اليوناني يدل على إثارة قوية أو دفع وحث؛ وصيغة «نُحفِّز» تنقل المعنى الفاعل بقوة من غير الإيحاء السلبي الغالب في «نستفز».
- source_word: ἀγάπης
  choice: المحبة
  rationale: المقابل العربي الواضح والمألوف لـἀγάπη في هذا السياق.
- source_word: καλῶν ἔργων
  choice: الأعمال الصالحة
  rationale: ترجمة مباشرة وطبيعية تحفظ معنى الأعمال المتصفة بالخير، من غير إدخال تصور مذهبي عن الاستحقاق.
- source_word: καὶ
  choice: و
  rationale: تحفظ عطف هذه الوصية على السياق السابق، كما تحفظ الربط بين المحبة والأعمال الصالحة.
theological_decisions:
- issue: الإيحاء السلبي المحتمل في παροξυσμός
  choice: نُحفِّز على المحبة والأعمال الصالحة
  alternative: نحثّ بقوة على المحبة والأعمال الصالحة؛ أو نستثير المحبة والأعمال الصالحة
  rationale: يمكن أن يدل اللفظ اليوناني على إثارة أو استفزاز قوي، لكن المضاف إليه هنا إيجابي صراحةً. لذلك تنقل «نُحفِّز» قوة الدفع من غير تحويل العبارة إلى معنى عدائي، مع حفظ البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُعمل «لننتبه بعضنا إلى بعض» لإبراز العناية المتبادلة، و«نُحفِّز» للحفاظ على قوة الحث مع تجنب الدلالة السلبية غير اللازمة.
