  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: ar
  text: 'حينئذٍ قلتُ: «ها أنا قد أتيتُ؛ ففي لفافة الكتاب مكتوبٌ عني: لأفعل مشيئتك يا الله».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: حينئذٍ
  rationale: ظرف زمني يقدّم جواب المتكلم في الاقتباس، و«حينئذٍ» فصيحة وواضحة.
- source_word: εἶπον
  choice: قلتُ
  rationale: الصيغة الأوضح والأطبع لفعل القول في افتتاح الكلام المنقول.
- source_word: Ἰδοὺ
  choice: ها أنا
  rationale: تحفظ قوة التنبيه والحضور في العبارة، وتنسجم طبيعيًا مع ضمير المتكلم والفعل التالي.
- source_word: ἥκω
  choice: قد أتيتُ
  rationale: ينقل القوة التامة للفعل، أي الوصول الذي ما زال أثره حاضرًا، لا مجرد الشروع في المجيء.
- source_word: ἐν κεφαλίδι βιβλίου
  choice: في درج الكتاب
  rationale: تشير κεφαλίς في هذا التركيب إلى اللفافة أو الدرج المكتوب، لا إلى عنوان أو فصل في كتاب حديث التجليد.
- source_word: γέγραπται
  choice: كُتب
  rationale: صيغة عربية مألوفة لعبارة الكتاب المقدس، وتحفظ المبني للمجهول وحقيقة ثبوت المكتوب.
- source_word: περὶ ἐμοῦ
  choice: عني
  rationale: مقابل عربي موجز وطبيعي لمعنى «بشأني» أو «عنّي».
- source_word: τοῦ ποιῆσαι
  choice: لأفعل
  rationale: تعبّر اللام مع المضارع عن الغرض المقصود من المجيء.
- source_word: ὁ θεός
  choice: يا الله
  rationale: الاسم مرفوع صورةً في اليونانية لكنه مستعمل للنداء، ولذلك صُرّح بأداة النداء في العربية.
- source_word: τὸ θέλημά σου
  choice: مشيئتك
  rationale: «المشيئة» المقابل العربي الدقيق والمألوف لـ θέλημα في هذا السياق اللاهوتي.
theological_decisions:
- issue: الإشارة المسيانية إلى المتكلم في اقتباس المزمور
  choice: إبقاء الكلام بصيغة المتكلم من غير إضافة تعريف صريح له في الآية
  alternative: التصريح في النص بأن المتكلم هو المسيح أو المسيّا
  rationale: السياق في الرسالة يطبّق القول على الابن/المسيح، لكن ألفاظ الآية نفسها إعلان بضمير المتكلم؛ لذلك تُترك هوية المتكلم للسياق من دون توسعة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على نبرة الاقتباس الكتابي. استُعمل «درج الكتاب» لتجنّب إيحاء الكتاب الحديث المجلّد، ولذلك لم تلزم حاشية تفسيرية.
