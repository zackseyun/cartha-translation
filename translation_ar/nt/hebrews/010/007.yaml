  rationale: 'تعديل أسلوبي محدود لتحسين الوضوح في العربية الفصحى الحديثة: استُبدلت «درج» بـ«لفافة»، وصيغت γέγραπται بـ«مكتوبٌ». وحُفظت بنية الاقتباس، وعبارة الغرض، والنداء الإلهي، وعدم إدخال تفسير مسياني في المتن.'
