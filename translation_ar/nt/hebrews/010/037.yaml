lexical_decisions:
- source_word: ἔτι γὰρ
  choice: فَإِنَّهُ بَعْدَ
  rationale: تنقل الفاء التعليلية في γάρ صلة الآية بما قبلها، ويعبّر «بعد» مع العبارة الزمنية التالية عن معنى ἔτι تعبيرًا عربيًّا طبيعيًّا.
- source_word: μικρὸν ὅσον ὅσον
  choice: قَلِيلٍ جِدًّا
  rationale: التكرار الاصطلاحي ὅσον ὅσον يشدّد على شدة قِصَر المدة؛ و«قليل جدًا» واضح وطبيعي مع «بعد».
- source_word: ὁ ἐρχόμενος
  choice: الآتِي
  rationale: اسم الفاعل المعرّف في اليونانية مستعمل استعمال الاسم. و«الآتي» يحفظ إيجاز الأصل واحتمال كونه لقبًا مسيانيًّا، من غير أن يحسم ذلك صراحة.
- source_word: ἥξει
  choice: سَيَأْتِي
  rationale: ينقل صيغة المستقبل المباشرة ويحافظ على الجناس الاشتقاقي بين «الآتي» و«سيأتي».
- source_word: οὐ χρονίσει
  choice: وَلَنْ يَتَأَخَّرَ
  rationale: تؤدي معنى عدم الإبطاء أو التأخر بلغة عربية معاصرة واضحة.
theological_decisions:
- issue: هل ὁ ἐρχόμενος لقب مسياني أم عبارة وصفية عامة؟
  choice: الآتي
  alternative: الذي يأتي / الآتي بوصفه لقبًا صريحًا
  rationale: «الآتي» يقبل القراءة اللقبية المسيانية المرجحة في السياق، لكنه يبقي الصياغة قريبة من اسم الفاعل اليوناني ولا يضيف حسمًا غير مصرّح به في الأصل.
