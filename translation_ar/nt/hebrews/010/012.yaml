  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: ar
  text: أَمَّا هُوَ، فَبَعْدَ أَنْ قَدَّمَ ذَبِيحَةً وَاحِدَةً عَنِ الْخَطَايَا إِلَى الأَبَدِ[a]، جَلَسَ عَنْ يَمِينِ اللهِ[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم «إِلَى الأَبَدِ» على أنها تتصل مباشرة بالفعل «قَدَّمَ»: «بَعْدَ أَنْ قَدَّمَ ذَبِيحَةً وَاحِدَةً عَنِ الْخَطَايَا إِلَى الأَبَدِ». وتؤكد العبارة دوام فاعلية الذبيحة الواحدة.'
    reason: alternative_reading
  - marker: b
    text: تردد عبارة «عَنْ يَمِينِ اللهِ» صدى مزمور 110:1، وهو نص محوري في رسالة العبرانيين بشأن رفعة المسيح.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: أَمَّا هُوَ
  rationale: يحفظ قوة اسم الإشارة والمقابلة مع الكهنة المذكورين في العدد السابق، بصياغة عربية طبيعية أوضح من «هذا» وحدها.
- source_word: δὲ
  choice: أَمَّا
  rationale: تُظهر المقابلة بين وقوف الكهنة يوميًا وجلوس المسيح بعد ذبيحته الواحدة.
- source_word: μίαν ... θυσίαν
  choice: ذَبِيحَةً وَاحِدَةً
  rationale: يحفظ التشديد على وحدانية الذبيحة في مقابل الذبائح المتكررة.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: عَنِ الْخَطَايَا
  rationale: تعبير عربي مألوف في السياق الكفاري، ويحفظ صيغة الجمع في اليونانية.
- source_word: προσενέγκας
  choice: فَبَعْدَ أَنْ قَدَّمَ
  rationale: ينقل سبق فعل التقديم للفعل الرئيس ἐκάθισεν بوضوح وطبيعية.
- source_word: εἰς τὸ διηνεκές
  choice: إِلَى الأَبَدِ
  rationale: ينقل معنى الدوام والاستمرار في عبارة عربية موجزة، مع إبقاء احتمال تعلّقه بالذبيحة أو بالجلوس موضحًا في الحاشية.
- source_word: ἐκάθισεν
  choice: جَلَسَ
  rationale: يحفظ الفعل المباشر وصورته الدالة سياقيًا على اكتمال العمل الكهنوتي.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: عَنْ يَمِينِ اللهِ
  rationale: صياغة عربية كتابية واضحة تحفظ صدى مزمور 110:1 ومعنى مقام الإكرام والسلطان.
theological_decisions:
- issue: تعلّق عبارة εἰς τὸ διηνεκές
  choice: وُضعت «إِلَى الأَبَدِ» بعد «ذَبِيحَةً وَاحِدَةً عَنِ الْخَطَايَا» لتُبرز دوام فاعلية الذبيحة الواحدة.
  alternative: 'يمكن نحويًا وصلها بالفعل الرئيس: «جَلَسَ إِلَى الأَبَدِ عَنْ يَمِينِ اللهِ».'
  rationale: السياق القريب يقابل الذبائح المتكررة بذبيحة المسيح الواحدة الدائمة الفاعلية، لكن ترتيب اليونانية يسمح بقدر من الالتباس؛ لذلك لم يُخفَ البديل بل ذُكر في الحاشية.
- issue: دلالة الجلوس عن يمين الله
  choice: 'نُقلت العبارة حرفيًا نسبيًا: «جَلَسَ عَنْ يَمِينِ اللهِ».'
  alternative: تفسيرها داخل المتن بعبارة مثل «تبوأ مقام السلطان بجانب الله».
  rationale: الإبقاء على الصورة الكتابية يحفظ الإحالة إلى مزمور 110:1 من غير إدخال تفسير عقائدي زائد في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدمت «أَمَّا هُوَ» لإبراز المقابلة السياقية، وحُفظت الصورة الكتابية «عَنْ يَمِينِ اللهِ». شُكّل المتن لتيسير القراءة، وأُدرجت علامتا الحاشيتين [a] و[b] في موضعيهما.
