  to: بل ترقُّبٌ مخيفٌ للدينونة، ولهيبُ نارٍ عتيدٌ أن يلتهم المقاومين.
  rationale: استُبدلت «غيرة نار» بـ«لهيب نار» لأن هذه الصياغة العربية الطبيعية تنقل بوضوح القوة النارية المتأججة في πυρὸς ζῆλος ضمن صورة الدينونة، من غير تحويلها إلى تقرير عقائدي أوسع أو تخفيف حدتها. وحُذفت الحاشية لأن البديل لم يعد ضروريًا بعد إزالة العبارة غير المألوفة.
