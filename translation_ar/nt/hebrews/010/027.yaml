review_pass:
  verdict: revise
  source_fidelity: ينقل النص المقابلة بـ«بل»، وترقّب الدينونة المخيف، وفعل النار الآتي الذي يلتهم المعاندين/المقاومين. لكن «غيرة نار» ترجمة حرفية مضلِّلة نسبيًا لـπυρὸς ζῆλος في العربية المعاصرة؛ إذ تُفهم «الغيرة» غالبًا بمعنى الغيرة العاطفية أو الحسد، لا بوصفها الشدة النارية المهدِّدة في هذا التركيب. «لهيب نار» ينقل الصورة ووظيفتها بصورة أوضح من غير إضافة تفسير عقائدي.
  naturalness: «ترقّب مخيف للدينونة» فصيح وطبيعي. أما «غيرة نار عتيدة أن تلتهم» فمتكلف وغير مألوف في العربية الحديثة؛ واستبداله بـ«لهيب نار عتيد أن يلتهم» يحافظ على النبرة الجليلة والتحذيرية ويجعل الإسناد والفعل طبيعيين.
  terminology: «الدينونة» مناسبة لـκρίσις في السياق، و«المقاومين» مقبول لـτοὺς ὑπεναντίους. لا يلزم إدخال توصيف للعقاب بأنه أبدي أو مجازي. لا حاجة إلى حاشية بديلة بعد اعتماد الصياغة العربية الواضحة.
  issues:
  - severity: medium
    issue: «غيرة نار» غير واضحة اصطلاحيًا في العربية الحديثة.
    rationale: على الرغم من قربها الشكلي من ζῆλος، فإنها لا تؤدي طبيعيًا معنى الفوران/الاشتعال المدمر الذي يؤديه التركيب اليوناني في سياق الدينونة، وقد توحي بمعنى مختلف للغيرة.
  - severity: low
    issue: الحاشية الحالية تكرر إشكالًا دلاليًا ولا تضيف بديلًا لازمًا للنص.
    rationale: «سعير نار» بديل عربي محتمل، لكنه لا يحتاج إلى حاشية إذا صيغ المتن ابتداءً بصياغة واضحة، كما أن الحاشية تجمع شرح لفظين في موضع لا يستدعي هذا التعقيد.
  revised_text: بل ترقُّبٌ مخيفٌ للدينونة، ولهيبُ نارٍ عتيدٌ أن يلتهم المقاومين.
