  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: ar
  text: بل ترقُّبٌ مخيفٌ للدينونة، ولهيبُ نارٍ عتيدٌ أن يلتهم المقاومين.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβερὰ
  choice: مخيف
  rationale: ينقل صفة الرهبة الملازمة للترقّب من غير توسيع تفسيري.
- source_word: δέ
  choice: بل
  rationale: تفيد المقابلة مع النفي الوارد في العدد السابق، وهي طبيعية في هذا السياق.
- source_word: τις
  choice: —
  rationale: لم تُترجم بلفظ مستقل، لأن التنكير في «ترقّبٌ» يؤدي وظيفتها بصورة عربية طبيعية، وتعبير «ترقّب ما» يضعف الأسلوب.
- source_word: ἐκδοχὴ κρίσεως
  choice: ترقُّبٌ ... للدينونة
  rationale: يحفظ معنى الانتظار المشوب بالتوقع، مع إبقاء κρίσις بمعناها القضائي الواسع دون حصرها في نتيجة لاهوتية أضيق.
- source_word: πυρὸς ζῆλος
  choice: غيرةُ نارٍ
  rationale: يحافظ على الصورة المكثفة والبنية الإضافية في اليونانية، وعلى معنى الغيرة أو الحميّة الملتهبة بدل استبدالها ابتداءً بالغضب.
- source_word: μέλλοντος
  choice: عتيدةٌ أن
  rationale: تعبير عربي فصيح يدل على الفعل الآتي الوشيك أو المنتظر، ويوافق اسم الفاعل اليوناني.
- source_word: ἐσθίειν
  choice: تلتهم
  rationale: ينقل الصورة الحية للأكل والإفناء، وهو أنسب مع النار من صياغة تجريدية مثل «تفني».
- source_word: τοὺς ὑπεναντίους
  choice: المقاومين
  rationale: يدل على الذين يقفون في موقف معادٍ ومضاد، ويحفظ النبرة السياقية دون تعميمها إلى كل «الأعداء».
theological_decisions:
- issue: طبيعة صورة الدينونة بالنار
  choice: الإبقاء على النار التي تلتهم المقاومين من غير تحديد صريح لمدة العقاب أو طبيعته الميتافيزيقية
  alternative: تفسير الصورة صراحةً بأنها عذاب أبدي، أو تخفيفها إلى صورة مجازية محضة
  rationale: العدد يعلن دينونة رهيبة بلغة نارية شديدة، لكنه لا يفصّل هنا جميع أبعادها العقائدية؛ لذلك تحفظ الترجمة قوة التحذير والتوتر اللاهوتي من غير إضافة.
- issue: دلالة πυρὸς ζῆλος
  choice: غيرةُ نارٍ في المتن، مع بديل اصطلاحي في الحاشية
  alternative: سَعير نار أو غضب نار
  rationale: «الغيرة» أقرب إلى ζῆλος وتحفظ التشخيص والبنية الأصلية، بينما يوضح البديل في الحاشية المعنى العربي المحتمل من غير إحلال تفسير واحد محل الصورة اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة جليلة وتحذيرية. حُفظت الصورة الإضافية غير المألوفة نسبيًا «غيرة نار» لقربها من الأصل، مع إيراد صياغة أكثر سلاسة في الحاشية. وُضع مؤشر الحاشية بعد الجملة كلها لأنه يشرح أكثر من تعبير فيها.
