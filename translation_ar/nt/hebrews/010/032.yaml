  source_fidelity: المعنى العام منقول بأمانة، بما في ذلك الأمر بالتذكّر، والزمن السابق، والاستنارة غير المحددة، واحتمال الآلام. لكن «استُنرتم» ليس مبنيًا للمجهول على النحو الذي يقابل φωτισθέντες، كما أن الحاشية (أ) تصف الصيغة اليونانية خطأً بأنها «اسم فاعل».
  naturalness: «الأيام الماضية» و«لكن تذكّروا» عبارتان طبيعيتان. أما «صبرتم على صراع شديد من الآلام» فتركيب مفهوم لكنه مثقل وغير مألوف في العربية المعاصرة؛ و«خضتم صراعًا شديدًا في مواجهة الآلام» أسلس ويحفظ صورة الصراع مع دلالة الاحتمال في السياق.
  terminology: «أُنرتم» يحفظ المبني للمجهول والاستعارة النورية من غير تفسيرها عقائديًا. وأُضيفت حاشية للصراع/المسابقة، المقابلة للحاشية الإنجليزية (ج)، مع إبقاء «صراع» مصطلحًا عامًا غير مذهبي.
