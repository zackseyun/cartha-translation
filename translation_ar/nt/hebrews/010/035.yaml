base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: ar
  text: فلا تطرحوا إذن جرأتكم[a]، فإن لها مكافأة عظيمة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ثقتكم». يمكن أن تدل الكلمة اليونانية على الحرية الواثقة أو الصراحة، ولا سيما في الاقتراب إلى الله.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: فلا تطرحوا
  rationale: صيغة نهي تدل على التخلي المتعمد، و«تطرحوا» تحفظ قوة الفعل ولا توحي بمجرد الفقدان غير المقصود.
- source_word: οὖν
  choice: إذن
  rationale: تربط الوصية استنتاجيًا بما سبق، وموضعها بعد الفعل طبيعي في العربية الفصحى المعاصرة.
- source_word: παρρησίαν
  choice: جرأتكم
  rationale: تعبّر عن الحرية الواثقة والجسارة في الاقتراب إلى الله وفي الثبات العلني على الإيمان، مع إبقاء «الثقة» بديلًا معجميًا ممكنًا في الحاشية.
- source_word: ὑμῶν
  choice: ـكم
  rationale: ضمير ملكية لجمع المخاطبين، أُلحق بالاسم على نحو عربي طبيعي.
- source_word: ἥτις ἔχει
  choice: فإن لها
  rationale: ينقل الجملة الوصفية التفسيرية بصورة عربية طبيعية، مع إبقاء علاقة الامتلاك التي يصرح بها اليوناني بدل تفسيرها سببيًا.
- source_word: μεγάλην
  choice: عظيمة
  rationale: وصف تقويمي مباشر يلائم «مكافأة» في العربية.
- source_word: μισθαποδοσίαν
  choice: مكافأة
  rationale: تدل على الجزاء الإيجابي المنتظر، وهي واضحة وطبيعية ولا تفرض إيحاءً تجاريًا زائدًا.
theological_decisions:
- issue: دلالة παρρησία في عبرانيين 10:35
  choice: الجرأة الواثقة في الاقتراب إلى الله والثبات على الإيمان
  alternative: الثقة
  rationale: استعمال اللفظ في الرسالة يجمع بين حرية الاقتراب الواثق والثبات الجريء؛ لذلك تحافظ «الجرأة» على قوة الحث، بينما توضح الحاشية إمكان معنى «الثقة» من غير حصر الدلالة في شعور باطني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «فلا تطرحوا إذن» للحفاظ على النهي القوي والرابط الاستنتاجي، وصيغت الجملة الموصولة «فإن لها» بما يلائم الأسلوب العربي دون إزالة التوتر الدلالي في παρρησία.
