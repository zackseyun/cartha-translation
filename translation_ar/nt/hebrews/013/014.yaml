  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: ar
  text: فليس لنا هنا مدينة باقية، بل نطلب المدينة الآتية.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أكثر حرفية: «التي ستأتي» أو «المدينة التي ستأتي».'
    reason: بديل معجمي يوضح أن التعبير اليوناني اسم فاعل مؤنث يعود إلى «مدينة» ويحمل معنى الاستقبال.
lexical_decisions:
- source_word: οὐ γὰρ
  choice: لأن ليست لنا
  rationale: تربط «لأن» الآية بما قبلها بوصفها تعليلًا، ويقع النفي على امتلاك المدينة في صياغة عربية واضحة.
- source_word: ἔχομεν
  choice: لنا
  rationale: تؤدي معنى «نملك/لدينا» بصورة عربية طبيعية وموجزة في هذا السياق.
- source_word: ὧδε
  choice: هنا
  rationale: تحافظ على الإشارة المكانية المباشرة من غير توسيع تفسيري إلى «على الأرض».
- source_word: μένουσαν
  choice: باقية
  rationale: اسم الفاعل يصف المدينة بأنها ثابتة مستمرة؛ و«باقية» طبيعية وتحفظ المقابلة مع المدينة الآتية.
- source_word: πόλιν
  choice: مدينة
  rationale: تنقل الاسم المحسوس كما هو، من غير استبداله بتفسير مثل «الوطن» أو «السماء».
- source_word: ἀλλὰ
  choice: بل
  rationale: تلائم العربية بعد النفي وتبرز المقابلة القوية بين عدم وجود مدينة باقية هنا وطلب المدينة الآتية.
- source_word: τὴν μέλλουσαν
  choice: المدينة الآتية
  rationale: اسم الفاعل المؤنث يعود إلى «مدينة» المحذوفة في اليونانية؛ وإظهارها بالعربية يزيل اللبس ويحفظ التوجه المستقبلي.
- source_word: ἐπιζητοῦμεν
  choice: نطلب
  rationale: تنقل معنى السعي والبحث بلفظ عربي مألوف، من غير إضافة درجة من الشدة لا يلزم التصريح بها.
theological_decisions:
- issue: طبيعة صورة «المدينة»
  choice: الإبقاء على لفظ «المدينة» في النص بوصفه صورة للمقام أو النظام المستقبلي الذي يتطلع إليه المؤمنون.
  alternative: السماء؛ المدينة السماوية؛ أورشليم السماوية
  rationale: لا تسمي الآية نفسها السماء أو أورشليم، مع أن الرسالة توسع هذه الصورة في مواضع أخرى؛ لذلك يحفظ النص لفظ الآية وتوترها اللاهوتي من غير إدخال تفسير أوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «لأن ليست لنا» حفاظًا على الصلة التعليلية، و«بل» للمقابلة بعد النفي. أُبقيت «مدينة» دون تفسير مذهبي، وأُثبتت علامة الحاشية [a] في المتن.
