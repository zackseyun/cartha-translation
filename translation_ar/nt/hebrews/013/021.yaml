    rationale: لا يُستعمل «صالح» اسمًا على هذا النحو طبيعيًا في العربية المعاصرة؛ «بكل خير» يؤدي الشمول والمادة الحسنة التي يزوّد الله بها المؤمنين.
  - severity: medium
    issue: التركيب «مَا يُرْضِيهِ أَمَامَهُ»
    rationale: تكرار الضمير مع «أمامه» يجعل العبارة غير سلسة وقد يوحي بمعنى مكاني غير مقصود. «ما هو مرضي أمامه» ينقل بدقة معنى «ما هو مقبول/مرضي في نظره».
  - severity: low
    issue: موضع مرساة الحاشية
    rationale: الحاشية تفسر مرجع «الذي»، ولذلك ينبغي أن يلي المؤشر الموصول نفسه لا علامة نهاية الآية.
