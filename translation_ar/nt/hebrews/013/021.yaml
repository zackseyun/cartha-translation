  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: ar
  text: لِيُعِدَّكُمْ بِكُلِّ خَيْرٍ لِتَفْعَلُوا مَشِيئَتَهُ، إِذْ يَعْمَلُ فِينَا مَا هُوَ مَرْضِيٌّ أَمَامَهُ بِيَسُوعَ الْمَسِيحِ، الَّذِي[a] لَهُ الْمَجْدُ إِلَى أَبَدِ الْآبِدِينَ. آمِين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يعود «الذي» على يسوع المسيح تحديدًا، ويرى بعضهم أنه يعود بدلًا من ذلك على إله السلام، المذكور بوصفه فاعل هذا الدعاء في الآية السابقة.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: لِيُعِدَّكُمْ
  rationale: يفيد الفعل هنا إعداد المؤمنين وتجهيزهم بما يلزم لطاعة مشيئة الله، وصيغة الدعاء مناسبة لسياق البركة.
- source_word: ἐν παντὶ ἀγαθῷ
  choice: بِكُلِّ صَالِحٍ
  rationale: ترجمة موجزة تحافظ على شمول العبارة وعلى احتمال أن يكون المراد كل أمر أو شيء صالح، من غير إضافة اسم غير مصرّح به.
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: لِتَفْعَلُوا مَشِيئَتَهُ
  rationale: تنقل لام التعليل غرض الإعداد بوضوح وطبيعية في العربية.
- source_word: ποιῶν ἐν ἡμῖν
  choice: عَامِلًا فِينَا
  rationale: تحافظ على صورة عمل الله المستمر في المؤمنين وعلى المعنى الأرجح لحرف الجر بوصفه عملًا داخلهم.
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: مَا يُرْضِيهِ أَمَامَهُ
  rationale: صياغة عربية واضحة تنقل معنى ما هو مرضي في حضرة الله أو بحسب نظره، مع إبقاء تعبير «أمامه» قريبًا من الأصل.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: بِيَسُوعَ الْمَسِيحِ
  rationale: الباء تنقل معنى الوساطة هنا، و«المسيح» تؤدي Χριστός بوصفه لقبًا.
- source_word: ᾧ ἡ δόξα
  choice: الَّذِي لَهُ الْمَجْدُ
  rationale: تحافظ جملة الموصول على غموض مرجع الضمير في اليونانية بدل تعيينه صراحة.
- source_word: εἰς τοὺς αἰῶνας
  choice: إِلَى أَبَدِ الْآبِدِينَ
  rationale: تعبير عربي كتابي مفهوم ودال على الدوام بلا نهاية.
theological_decisions:
- issue: مرجع اسم الموصول ᾧ في عبارة التمجيد
  choice: 'الإبقاء على جملة موصول محتملة المرجع: «الذي له المجد»'
  alternative: تعيين المرجع صراحة بأنه الله إله السلام، أو بأنه يسوع المسيح
  rationale: يمكن نحويًا أن يعود الموصول إلى يسوع المسيح، وهو الأقرب لفظًا، كما يمكن فهم التمجيد عائدًا إلى الله، فاعل الدعاء؛ لذلك لا تُحسم المسألة في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة دعائية مهيبة. استُخدمت صيغة «لِيُعِدَّكُمْ» للدعاء، وحُفظ غموض مرجع الموصول. وُضع مؤشر الحاشية في نهاية الجملة لأنه يعلّق على مرجع «الذي».
