base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: ar
  text: وإلهُ السلام، الذي أقام من بين الأموات ربَّنا يسوع، راعيَ الخراف العظيم، بدم عهد أبدي[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُفهم العبارة على أنها متصلة بوصف يسوع: «راعي الخراف العظيم بدم عهد أبدي». ويحتمل النص اليوناني أكثر من وجه في تعلّق عبارة «بدم عهد أبدي».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ
  choice: إله السلام
  rationale: تدل δέ هنا على انتقال إلى الدعاء الختامي، ولا يلزم تمثيلها بأداة مستقلة في العربية؛ يبدأ السياق العربي طبيعيًا بصيغة الدعاء.
- source_word: θεὸς τῆς εἰρήνης
  choice: إله السلام
  rationale: يحفظ تركيب الإضافة اليوناني ومعناه الدال على الله المتصف بالسلام والواهب له.
- source_word: ὁ ἀναγαγὼν
  choice: الذي أصعد
  rationale: يحفظ الصورة الأساسية للفعل ἀνάγω، أي الإحضار أو الإصعاد، مع دلالته السياقية على القيامة.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: تعبير عربي واضح يحفظ معنى الخروج من جماعة الموتى في صيغة القيامة اليونانية.
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: راعي الخراف العظيم
  rationale: يحفظ الاستعارة الرعوية وترتيب النعت التوكيدي في عبارة عربية طبيعية.
- source_word: ἐν αἵματι
  choice: بدم
  rationale: الباء تعبّر بإيجاز عن القراءة الأداتية المحتملة لـἐν، من غير شرح زائد لطبيعة العلاقة.
- source_word: διαθήκης αἰωνίου
  choice: عهد أبدي
  rationale: «عهد» هو المقابل الملائم في سياق الرسالة، وغياب أداة التعريف في اليونانية يُحفظ بصياغة عربية نكرة.
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: ربنا يسوع
  rationale: صياغة عربية مألوفة تحفظ اللقب والإضافة والتعريف بيسوع.
theological_decisions:
- issue: تعلّق عبارة ἐν αἵματι διαθήκης αἰωνίου
  choice: 'تُفهم في المتن على أنها متعلقة بفعل إصعاد يسوع: «أصعد ... بدم عهد أبدي»'
  alternative: يمكن أن تتعلق على نحو أوثق بوصف يسوع بأنه «راعي الخراف العظيم بدم عهد أبدي»
  rationale: موضع العبارة اليونانية يسمح بأكثر من وجه نحوي. اختير التعلّق بالفعل بوصفه الأرجح في سياق الدعاء، مع إثبات الغموض الحقيقي في الحاشية وعدم تفصيل آلية لاهوتية غير مصرّح بها.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ومهيبة. أُبقيت الآية جزءًا من جملة الدعاء الممتدة إلى العدد التالي، ولذلك انتهت بفاصلة. أضيف الفعل «ليهيئكم» من العدد 21 فقط لاستكمال صيغة الدعاء، لكنه غير موجود في نص العدد 20 المعطى؛ والأدق عند نشر العدد منفردًا ضمن سياقه أن يبدأ: «وإله السلام، الذي...» انتظارًا لاكتمال الفعل في العدد 21.'
