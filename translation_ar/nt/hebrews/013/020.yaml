  verdict: revise
  source_fidelity: المتن يضيف في أوله «وليهيئكم»، وهي عبارة من العدد 21 وليست في النص اليوناني المعطى للعدد 20. كذلك «أصعد» أقل دقة وطبيعية هنا من «أقام ... من بين الأموات» في اصطلاح القيامة العربي. أما ترتيب عناصر وصف يسوع وعبارة «بدم عهد أبدي» فيحفظان بنية الأصل وغموض تعلّق العبارة الأخير.
  naturalness: الصياغة المنقحة فصحى حديثة واضحة، وتحافظ على كون الآية جزءًا من دعاء يمتد إلى العدد التالي؛ لذلك تبقى النهاية بفاصلة. «وأقام من بين الأموات» أيسر وأدق في العربية من «أصعد من بين الأموات».
  terminology: «إله السلام»، و«ربنا يسوع»، و«راعي الخراف العظيم»، و«عهد أبدي» مقابلات سليمة ومألوفة. لا ينبغي إدخال فعل التهيئة من العدد التالي في نص هذا العدد المنفرد.
  issues:
