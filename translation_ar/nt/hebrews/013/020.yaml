    rationale: لا مقابل لهذه العبارة في عبرانيين 13:20؛ فهي تبدأ في العدد 21. إدراجها يغيّر حدود النص المطلوب مراجعته، وإن كانت الجملة النحوية لا تكتمل إلا في العدد التالي.
  - severity: medium
    issue: ترجمة ὁ ἀναγαγὼν بـ«الذي أصعد».
    rationale: قد توحي «أصعد» في العربية بحركة الصعود أو بالإصعاد إلى السماء، بينما السياق اليوناني هو إقامة يسوع من الموت. «الذي أقام من بين الأموات» هي الصياغة العربية الواضحة والأمينة لدلالة القيامة هنا.
  - severity: low
