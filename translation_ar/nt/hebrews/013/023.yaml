  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: ar
  text: اعلموا أن أخانا تيموثاوس قد أُطلق سراحه[a]. فإن جاء قريبًا، فسأراكم برفقته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قد أُخلي سبيله»، وربما كان ذلك من السجن. ويمكن للفعل أيضًا أن يعني «قد أُرسل» أو «قد صُرف»، لكن «أُطلق سراحه» هو الأرجح في هذا السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: اعلموا
  rationale: صيغة المضارع المعلوم للجمع تُفهم هنا أمرًا رسائليًا يُطلع المخاطَبين على خبر، و«اعلموا» موجزة وتحفظ قوة الأمر.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: أخانا
  rationale: يحفظ التعبير العائلي المسيحي المألوف، وهو هنا مفرد مذكر يشير تحديدًا إلى تيموثاوس.
- source_word: Τιμόθεον
  choice: تيموثاوس
  rationale: نقل صوتي للاسم الشخصي وفق الصيغة العربية الكتابية الشائعة.
- source_word: ἀπολελυμένον
  choice: قد أُطلق سراحه
  rationale: اسم فاعل تام مبني للمجهول من ἀπολύω، يفيد فعلًا تمّ وبقي أثره حاضرًا. وإطلاق السراح، على الأرجح من احتجاز، هو الأنسب للسياق، مع إبقاء المعاني المعجمية الأخرى في الحاشية.
- source_word: μεθ’ οὗ
  choice: برفقته
  rationale: يبيّن أن رؤية المخاطَبين ستكون بصحبة تيموثاوس، بصياغة عربية طبيعية واضحة.
- source_word: ἐὰν τάχιον ἔρχηται
  choice: فإن جاء قريبًا
  rationale: يحفظ الشرط المتعلق بمجيء تيموثاوس. وτάχιον صيغة مقارنة من حيث المبنى، لكنها تؤدي هنا معنى «قريبًا/عاجلًا» في الاستعمال السياقي.
- source_word: ὄψομαι ὑμᾶς
  choice: فسأراكم
  rationale: ترجمة مباشرة للمستقبل من ὁράω، من غير استبداله بـ«سأزوركم»، التي تصرّح بدلالة مفهومة ضمنًا لكنها أكثر تفسيرًا.
