  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: ar
  text: ولا تنسوا فعل الخير وتقاسم ما لديكم مع الآخرين[a]، لأن الله يرضى بمثل هذه الذبائح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة العبارة بـ«العطاء بسخاء» أو «الشركة». وتشير في هذا السياق، على الأرجح، إلى المشاركة العملية للآخرين بما لدى المرء من موارد.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: فعل الخير
  rationale: ينقل معنى الإحسان العملي والعمل الصالح بعبارة عربية طبيعية وواضحة، من غير حصره في نوع معين من أعمال البر.
- source_word: κοινωνίας
  choice: المشاركة
  rationale: يحفظ سعة اللفظ اليوناني، مع دلالته السياقية على تقاسم الموارد والعطاء العملي، من غير قصره على المال وحده.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: لا تنسوا
  rationale: ترجمة مباشرة للفعل اليوناني، وهي مفهومة هنا بوصفها حثًّا على عدم إهمال ممارسة هذه الأعمال.
- source_word: τοιαύταις ... θυσίαις
  choice: بمثل هذه الذبائح
  rationale: يحافظ على الصورة التعبدية الصريحة التي تصف فعل الخير والمشاركة بأنهما ذبائح.
- source_word: εὐαρεστεῖται
  choice: يُسَرّ
  rationale: تعبير عربي واضح ودقيق عن رضا الله وقبوله، مع إبقاء الذبائح سببًا للسرور كما تفيده صيغة الجملة اليونانية.
- source_word: ὁ θεός
  choice: الله
  rationale: المقابل العربي المعياري للاسم اليوناني في هذا السياق.
- source_word: δὲ
  choice: الواو في «ولا»
  rationale: تصل الوصية بالسياق السابق من غير إقحام معنى تضاد قوي لا يقتضيه النص.
theological_decisions:
- issue: طبيعة «الذبائح» في الآية
  choice: وصف فعل الخير والمشاركة، على نحو استعاري تعبدي، بأنهما ذبائح يُسَرّ بها الله
  alternative: حصرها في الصدقة المادية، أو تسطيحها إلى سلوك أخلاقي بلا دلالة ذبائحية
  rationale: النص اليوناني يطلق صراحة لفظ «ذبائح» على هذين العملين؛ لذلك تُحفظ الصورة اللاهوتية من غير تضييقها على الصدقة وحدها أو إزالة بعدها التعبدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختيرت «لا تنسوا» لقربها من صيغة الأصل، و«المشاركة» للمحافظة على اتساع الدلالة، مع توضيح معناها العملي في الحاشية.
