  text: Ἰησοῦς Χριστὸς ἐχθὲς καὶ σήμερον ὁ αὐτός, καὶ εἰς τοὺς αἰῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: ar
  text: يَسُوعُ الْمَسِيحُ هُوَ هُوَ أَمْسِ وَالْيَوْمَ وَإِلَى الأَبَدِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: يظل يسوع المسيح هو نفسه في الماضي والحاضر وإلى الأبد.'
    reason: إيضاح موجز لدلالة التعبير «هو هو» والتسلسل الزمني من غير إضافة تقرير عقائدي إلى المتن.
lexical_decisions:
- source_word: Ἰησοῦς
  choice: يَسُوعُ
  rationale: الصيغة العربية المعيارية للاسم الشخصي اليوناني.
- source_word: Χριστὸς
  choice: الْمَسِيحُ
  rationale: ترجمة اللقب اليوناني بمعناه الوظيفي المعروف في العربية، لا معاملته كلقب عائلي.
- source_word: ἐχθὲς
  choice: أَمْسِ
  rationale: ظرف زمان مباشر يحفظ أول عناصر التسلسل الزمني.
- source_word: σήμερον
  choice: الْيَوْمَ
  rationale: ترجمة مباشرة تقابل «أمس» وتحفظ إيقاع العبارة.
- source_word: ὁ αὐτός
  choice: هُوَ هُوَ
  rationale: تعبير عربي طبيعي وموجز يدل على ثبات الهوية وعدم التغيّر، ويقابل المسند اليوناني «هو نفسه».
- source_word: εἰς τοὺς αἰῶνας
  choice: إِلَى الأَبَدِ
  rationale: تعبير عربي مألوف يؤدي معنى الاستمرار الدائم في العبارة اليونانية.
- source_word: καὶ ... καὶ ... καὶ
  choice: وَ... وَ... وَ...
  rationale: حُفظ تكرار حرف العطف لإبقاء الإيقاع والتوكيد في التسلسل الزمني.
theological_decisions:
- issue: دلالة القول على ثبات يسوع المسيح عبر الزمن
  choice: صياغة مباشرة تؤكد أن يسوع المسيح هو هو أمس واليوم وإلى الأبد، من دون توسيع عقائدي.
  alternative: تفسير العبارة صراحةً بأنها تقرير لعقيدة عدم التغيّر أو الألوهية.
  rationale: النص يقرر ثبات هوية يسوع المسيح عبر الأزمنة، أما الاستنتاجات العقائدية الأوسع فلا ينبغي إدخالها في متن الترجمة.
- issue: دلالة Χριστός بين اللقب والاسم الاصطلاحي
  choice: المسيح
  alternative: كريستوس
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني، ويحفظ قوته المسيانية من غير تحويله إلى اسم عائلي.
translation_notes:
  register: عربية فصحى واضحة ومهيبة، مع الحفاظ على الإيجاز والإيقاع الثلاثي للنص اليوناني. استُخدم التعبير العربي المألوف «هو هو»، وحُفظت حروف العطف المتكررة.
