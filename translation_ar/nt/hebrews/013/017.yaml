source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: ar
  text: استجيبوا لقادتكم وانقادوا لهم[a]، لأنهم يسهرون على نفوسكم بوصفهم مَن سيقدّمون حسابًا، لكي يفعلوا ذلك بفرح لا بأنين، لأن هذا لا ينفعكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أطيعوا قادتكم واخضعوا لهم». يمكن أن يحمل الفعل اليوناني Πείθεσθε معنى الطاعة في هذا السياق، لكن معناه الأساسي هو الاقتناع أو الاستجابة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: اقبلوا إرشاد
  rationale: يفيد الأمر معنى الاقتناع أو الاستجابة لمن يحثّ، وقد يمتد إلى الطاعة. تصوغ «اقبلوا إرشاد» المعنى العلاقي في عربية طبيعية، مع إبقاء «أطيعوا» بديلًا ممكنًا في الحاشية.
- source_word: ἡγουμένοις
  choice: قادتكم
  rationale: يشير اللفظ هنا إلى قادة الجماعة المعترف بهم، و«قادتكم» واضحة من غير إضافة دلالة سلطوية أشد من الأصل.
- source_word: ὑπείκετε
  choice: انقادوا لهم
  rationale: يحمل معنى إفساح المجال والانقياد أو الإذعان، ويحافظ على كونه فعلًا ثانيًا متميزًا من Πείθεσθε.
- source_word: ἀγρυπνοῦσιν
  choice: يسهرون على
  rationale: يحفظ صورة اليقظة والسهر، وهو تعبير عربي مألوف عن العناية الحريصة.
- source_word: ψυχῶν
  choice: نفوسكم
  rationale: يحفظ الوزن الروحي للفظ ψυχή مع إمكان دلالته الأوسع على الإنسان وحياته.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: بوصفهم مَن سيقدّمون حسابًا
  rationale: يحفظ قوة ὡς وصيغة المستقبل، ويبيّن مسؤولية القادة من غير التصريح في المتن بمن سيحاسبهم، إذ ليس مذكورًا صراحة.
- source_word: μετὰ χαρᾶς
  choice: بفرح
  rationale: مقابل مباشر وطبيعي للعبارة اليونانية.
- source_word: στενάζοντες
  choice: بأنين
  rationale: يحفظ الصورة المحسوسة للتنهّد أو الأنين بدل تحويلها إلى مجرد حزن.
- source_word: ἀλυσιτελὲς
  choice: لا ينفعكم
  rationale: يؤدي معنى ما ليس نافعًا أو مجديًا، ويتجنب المبالغة الموجودة في «يضرّكم».
theological_decisions:
- issue: طبيعة الاستجابة المطلوبة تجاه قادة الجماعة
  choice: قبول إرشاد القادة والانقياد لهم في إطار سهرهم المسؤول على النفوس
  alternative: الأمر بطاعة مطلقة غير مشروطة للقادة
  rationale: الفعلان Πείθεσθε وὑπείκετε يدلان على استجابة منفتحة وانقياد، لكنهما لا يفرضان في الترجمة مفهوم الطاعة السلطوية المطلقة. كما أن تعليل الوصية بمساءلة القادة يضع قيادتهم في إطار مسؤولية لا سلطة بلا قيد.
- issue: الجهة التي سيقدّم القادة أمامها الحساب
  choice: عدم إضافتها في المتن
  alternative: التصريح بأنهم سيقدّمون حسابًا لله
  rationale: المساءلة أمام الله مفهومة بقوة من السياق اللاهوتي، لكن لفظ «الله» غير موجود صراحة في هذه العبارة؛ لذلك تُحفظ صياغة الأصل من غير توضيح تفسيري داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «اقبلوا إرشاد» لتفادي تركيب حرفي ثقيل مثل «اقتنعوا بقادتكم»، مع حفظ احتمال «أطيعوا» في الحاشية. ويوازن «انقادوا لهم» بين الوضوح والتمييز المعجمي عن الفعل الأول.
