base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: ar
  text: لا تنقادوا وراء تعاليم متنوعة وغريبة، فإنه حسن أن يثبت القلب بالنعمة[a]، لا بالأطعمة[b] التي لم ينتفع بها الذين اتخذوها نهجًا لهم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يترسخ القلب بالنعمة» أو «أن يتقوّى القلب بالنعمة». يمكن للفعل اليوناني أن يعني التثبيت أو الترسيخ أو التقوية.'
    reason: lexical_alternative
  - marker: b
    text: يرد في اليونانية لفظ «الأطعمة» وحده؛ ويُرجَّح أنه يشير إلى ممارسات غذائية أو شعائر مرتبطة بالطعام، من غير أن يحدد النص هنا نوعها.
    reason: cultural_note
  - marker: c
    text: 'حرفيًا: «الذين يسلكون فيها». وقد يعني: «الذين عاشوا وفقها» أو «الذين انشغلوا بها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: تعاليم متنوعة وغريبة
  rationale: «تعاليم» لفظ طبيعي لا يوحي بالضرورة بمنظومة عقائدية مكتملة، و«متنوعة وغريبة» يحفظ معنى التعدد وعدم الانتماء إلى التعليم المألوف في السياق، من غير ربط الغرابة بقومية أو منشأ بعينه.
- source_word: μὴ παραφέρεσθε
  choice: لا تنقادوا وراء
  rationale: صيغة النهي المبني للمجهول تحذر من أن يُحمَل المخاطبون بعيدًا عن المسار؛ و«لا تنقادوا وراء» عربية واضحة تحفظ معنى الانجراف خلف التعاليم دون مبالغة تصويرية.
- source_word: καλὸν γὰρ
  choice: لأنه حسن
  rationale: يحفظ الحكم المباشر الذي تؤديه καλόν، مع ربطه تعليليًا بما قبله بواسطة γάρ.
- source_word: χάριτι
  choice: بالنعمة
  rationale: الباء تعبّر طبيعيًا عن دلالة الوسيلة في صيغة المجرور اليونانية، مع إبقاء «النعمة» دون تفسير لاهوتي زائد.
- source_word: βεβαιοῦσθαι τὴν καρδίαν
  choice: أن يَثبُت القلب
  rationale: ينقل معنى التثبيت والرسوخ بصياغة عربية طبيعية، ويحافظ على «القلب» بوصفه مركز الحياة الباطنة.
- source_word: οὐ βρώμασιν
  choice: لا بالأطعمة
  rationale: ترجمة مباشرة للجمع βρώμασιν، دون توسيعه في المتن إلى شرائع أو ممارسات غذائية محددة.
- source_word: ἐν οἷς οὐκ ὠφελήθησαν
  choice: التي لم ينتفع بها
  rationale: تحوّل حرفية «فيها» إلى تركيب عربي مألوف مع فعل الانتفاع، مع إبقاء الأطعمة مرجعًا للضمير.
- source_word: οἱ περιπατοῦντες
  choice: الذين سلكوا فيها
  rationale: يحفظ استعارة «السلوك/المشي» التي تستعمل للدلالة على نهج الحياة، فيما توضّح الحاشية المعنى المحتمل في هذا السياق.
theological_decisions:
- issue: مرجع «الأطعمة» وعلاقته بالنعمة
  choice: إبقاء «الأطعمة» في المتن على عموم اللفظ اليوناني، في مقابلة النعمة بوصفها ما يثبت القلب.
  alternative: تفسيرها في المتن بأنها أحكام غذائية، أو أطعمة ذبائح، أو ممارسات طقسية بعينها.
  rationale: السياق يسمح بارتباطها بممارسات غذائية أو شعائرية، لكنه لا يحدد هنا نطاقها بدقة؛ لذلك لا ينبغي حسم ما تركه النص عامًا.
- issue: الدلالة المجازية للقلب
  choice: الإبقاء على «القلب».
  alternative: العقل أو الإنسان الباطن.
  rationale: لفظ καρδία يحمل دلالة كتابية وأنثروبولوجية أوسع من العقل وحده، وترجمته الحرفية تحفظ هذا الاتساع.
- issue: معنى السلوك في الأطعمة
  choice: الإبقاء على صورة «سلكوا فيها» مع شرحها في الحاشية.
  alternative: الذين انشغلوا بها، أو الذين عاشوا وفقها.
  rationale: هذا يحفظ المجاز اليوناني ولا يحصره في مجرد الانشغال أو في نظام معيشي محدد، مع توفير صياغات تفسيرية للقارئ.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يَثبُت» بضبط أوله ووسطه لتجنب قراءته «يُثبِت». حافظ النص على ألفاظ «النعمة» و«القلب» و«الأطعمة» وعلى استعارة السلوك، مع وضع البدائل والتفسير الضروري في الحواشي.
