base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: ar
  text: اذكروا المسجونين كأنكم مقيَّدون معهم، واذكروا الذين يُساء إليهم، إذ إنكم أنتم أيضًا في جسد.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تشير عبارة «في جسد» إلى اشتراككم في الوجود البشري الجسدي القابل للألم؛ وقد يفهمها بعضهم أيضًا على أنها إشارة إلى الانتماء إلى جسد المسيح.
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: اذكروا
  rationale: فعل أمر مضارع يفيد المواظبة على التذكر والاهتمام؛ و«اذكروا» تعبير عربي طبيعي يحمل هذا المعنى في سياق الوصية.
- source_word: τῶν δεσμίων
  choice: المسجونين
  rationale: يدل اللفظ على المقيدين أو الأسرى؛ و«المسجونين» واضح في العربية المعاصرة، مع إبقاء صورة القيود في العبارة التالية.
- source_word: ὡς συνδεδεμένοι
  choice: كأنكم مقيدون معهم
  rationale: يحافظ على صورة الارتباط بالقيود وعلى دعوة المخاطبين إلى التضامن العميق معهم، من غير إضافة فعل سجن غير موجود صراحة في اليونانية.
- source_word: τῶν κακουχουμένων
  choice: المساء إليهم
  rationale: ينقل معنى من تقع عليهم إساءة المعاملة أو الأذى، ويحافظ على الصيغة المبنية للمجهول واتساع أنواع المعاناة.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: إذ أنتم أيضا في جسد
  rationale: ترجمة قريبة وطبيعية نسبيا تحفظ عبارة «في جسد» وانفتاحها الدلالي، مع إبراز القوة التعليلية للعبارة.
theological_decisions:
- issue: دلالة ἐν σώματι («في جسد»)
  choice: الحالة البشرية الجسدية المشتركة وما يصاحبها من قابلية للألم
  alternative: الانتماء إلى جسد المسيح
  rationale: السياق يحث على التعاطف مع المسجونين والمساء إليهم، ولذلك يرجح معنى الضعف الجسدي البشري المشترك. ومع ذلك تحفظ الترجمة العبارة الحرفية نسبيا كيلا تلغي احتمال الصدى الكنسي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «المسجونين» للوضوح، وأبقيت صورة القيود في «مقيدون معهم». ووضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
