  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: ar
  text: تذكَّروا قادتكم الذين كلَّموكم بكلمة الله، وإذ تتأمَّلون عاقبة أسلوب حياتهم[b]، اقتدوا بإيمانهم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأمانتهم». يمكن للكلمة اليونانية أن تعني «الإيمان» أو «الأمانة»؛ وقد اختير «الإيمان» في المتن.'
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا ترجمة «عاقبة» بـ«نهاية»، ويرى بعضهم أنها تشير تحديدًا إلى الكيفية التي ماتوا بها.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: تذكَّروا
  rationale: صيغة الأمر الحاضر تدعو إلى تذكّر مستمر، و«تذكَّروا» تعبير عربي طبيعي يمكن أن يحمل هذا المعنى في السياق.
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: قادتكم
  rationale: تشير العبارة إلى القادة المعترف بهم في الجماعة؛ و«قادتكم» واضحة وتحفظ معنى القيادة من غير إيحاء سياسي زائد.
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: الذين كلَّموكم بكلمة الله
  rationale: تحفظ الترجمة المعنى المباشر للفعل λαλέω والتعبير الكتابي المألوف «كلمة الله».
- source_word: ἀναθεωροῦντες
  choice: وإذ تتأمَّلون
  rationale: تفيد الكلمة النظر المتأني والتفكير، كما تحافظ صيغة الحال على صلتها بالأمر «اقتدوا».
- source_word: τὴν ἔκβασιν
  choice: عاقبة
  rationale: «عاقبة» تشمل النتيجة أو النهاية من غير حصر المعنى في موت القادة، وتبقي المجال الدلالي مفتوحًا.
- source_word: τῆς ἀναστροφῆς
  choice: سيرتهم
  rationale: «السيرة» في العربية تدل على نهج الحياة والسلوك، وهي موجزة وطبيعية في هذا السياق.
- source_word: μιμεῖσθε
  choice: اقتدوا
  rationale: تنقل الأمر بمحاكاة مثال القادة بأسلوب عربي طبيعي؛ وهي أوضح هنا من الترجمة الحرفية «حاكوا».
- source_word: τὴν πίστιν
  choice: بإيمانهم
  rationale: تحفظ المقابل المعتاد لكلمة πίστις، مع بيان احتمال معنى «الأمانة» في الحاشية وعدم حسم التوتر الدلالي.
theological_decisions:
- issue: معنى πίστις حين تكون صفة بشرية يُقتدى بها
  choice: إيمانهم
  alternative: أمانتهم
  rationale: يمكن أن تدل πίστις على الإيمان أو الأمانة، وكلاهما ملائم للسياق. اختير «الإيمان» في المتن مع إبقاء البديل في الحاشية.
- issue: هل تشير ἔκβασις تحديدًا إلى موت القادة أو استشهادهم؟
  choice: عاقبة
  alternative: نهاية، أو الكيفية التي ماتوا بها
  rationale: اللفظة اليونانية قد تعني النتيجة أو النهاية، ولا يصرّح النص نفسه بالموت أو الاستشهاد؛ لذلك تحافظ «عاقبة» على الاتساع الأصلي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «سيرتهم» لإيجاز معنى نهج الحياة والسلوك، وحُفظ تركيب الحال في «وإذ تتأمَّلون» لإظهار صلته بالأمر بالاقتداء.
