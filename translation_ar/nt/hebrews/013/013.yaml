  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: ar
  text: فلنخرج إذن إليه خارج المحلّة، حاملين عاره.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοίνυν
  choice: إذن
  rationale: أداة استنتاج تربط الحثّ بما سبق، ولا سيما بما ورد في 13:11–12، و«إذن» تؤدي هذه الدلالة طبيعيًا في العربية.
- source_word: ἐξερχώμεθα
  choice: فلنخرج
  rationale: فعل مضارع بصيغة الحث للمتكلم الجمع؛ وصيغة «فلنخرج» واضحة وتحافظ على قوة الدعوة الجماعية.
- source_word: πρὸς αὐτὸν
  choice: إليه
  rationale: تفيد πρός مع النصب الحركة نحو شخص؛ والضمير يحافظ على صياغة اليونانية، ومرجعه يسوع واضح من السياق السابق.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: خارج المحلّة
  rationale: «المحلّة» تعبير عربي واضح للمخيّم أو موضع نزول الجماعة، ويحفظ الصورة الطقسية والبرية المرتبطة بالآيات السابقة.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: عاره
  rationale: يدل ὀνειδισμός على العار والتعيير الذي لحق به؛ و«عاره» موجزة وطبيعية، وتشير إلى العار الواقع عليه لا إلى عيب أخلاقي فيه.
- source_word: φέροντες
  choice: حاملين
  rationale: اسم فاعل حالي يحافظ على صورة حمل العار وعلى الصلة النحوية بالفعل الحثّي، من غير تحويله تفسيريًا إلى «محتملين».
theological_decisions:
- issue: مرجع الضمير في «إليه» و«عاره»
  choice: الإبقاء على الضمير، ومرجعه يسوع بحسب السياق المباشر في 13:12
  alternative: استبدال الضمير باسم «يسوع»
  rationale: النص اليوناني يستخدم الضمير، والسياق يوضح المرجع؛ لذلك لا حاجة إلى التصريح بما أبقاه الأصل ضمنيًا.
- issue: دلالة «خارج المحلّة»
  choice: الإبقاء على الصورة المكانية والطقسية كما هي
  alternative: «خارج المؤسسة الدينية» أو «خارج الجماعة»
  rationale: العبارة تستحضر إخراج ذبائح الخطية خارج المحلّة وخروج يسوع خارج الباب؛ أما التفاسير المجازية المباشرة فتضيّق الدلالة وتطمس التناص.
- issue: دلالة «عاره»
  choice: العار والتعيير اللذان لحقا به ويشارك المؤمنون في حملهما
  alternative: «الإهانة الموجهة إليه» أو «خزيه»
  rationale: تحافظ «عاره» على الإيجاز والصورة الكتابية، مع بقاء احتمال العار الاجتماعي والتعيير قائمًا من غير تفصيل زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختيرت «المحلّة» للمحافظة على الصورة الكتابية المتصلة بالبرية والذبائح، و«فلنخرج» لصياغة الحث الجماعي بصورة طبيعية. لا توجد حاشية لأن الحاشية الإنجليزية المعطاة لا تتطابق مع موضع علامتها في النص، ولأن البديل المعجمي لا يلزم لبيان العربية.
