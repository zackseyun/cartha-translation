base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: ar
  text: لنا مذبحٌ لا يحقّ للذين يخدمون في المسكن أن يأكلوا منه[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبتحديد أدق: «الذين يؤدّون الخدمة في الخيمة/المسكن». تشير العبارة إلى القائمين بخدمة مقدس العهد القديم.'
    reason: lexical_alternative
  - marker: b
    text: 'اختلف في المقصود بـ«المذبح»: أهو المسيح نفسه، أم الصليب، أم المذبح السماوي، أم فوائد تقدمة المسيح الذبيحية. ويورد اليوناني الصورة هنا من غير مزيد من التحديد.'
    reason: alternative_reading
lexical_decisions:
- source_word: θυσιαστήριον
  choice: مذبح
  rationale: المعنى المباشر المألوف للكلمة هو «مذبح». ويُبقي هذا الاختيار الصورة الطقسية وما تحمله من دلالة لاهوتية من غير أن يفسّرها في المتن بأنها الصليب أو الذبيحة.
- source_word: ἐξ οὗ
  choice: منه
  rationale: تفيد ἐκ مع ضمير الوصل المصدر، أي الأكل «من» المذبح. والضمير في العربية طبيعي وواضح المرجع.
- source_word: φαγεῖν
  choice: أن يأكلوا
  rationale: ترجمة مباشرة للمصدر اليوناني، وصيغته ملائمة بعد «لا يحقّ».
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: لا يحقّ
  rationale: تنقل معنى انتفاء الحق أو الامتياز المأذون به في هذا السياق الطقسي، بدل حصر ἐξουσία في معنى السلطة.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: الذين يخدمون في المسكن
  rationale: الفعل λατρεύω يدل هنا على الخدمة الدينية في المقدس، لا على العبادة العامة فحسب. و«المسكن» هو المقابل الكتابي العربي الواضح لخيمة العبادة في سياق الرسالة إلى العبرانيين.
- source_word: ἔχομεν
  choice: لنا
  rationale: تعبير عربي موجز وطبيعي عن الحيازة الحاضرة التي يشترك فيها الكاتب ومخاطَبوه.
theological_decisions:
- issue: مرجع «المذبح» في عبرانيين 13:10
  choice: الإبقاء على لفظ «مذبح» من غير تحديد مرجعه في المتن.
  alternative: قد يُفهم بأنه المسيح نفسه، أو الصليب، أو المذبح السماوي، أو فوائد ذبيحة المسيح.
  rationale: النص اليوناني يذكر الصورة من غير أن يعيّن مرجعها تحديدًا، والمفسرون مختلفون فيه؛ لذلك يحفظ المتن الغموض المقصود والتوتر اللاهوتي ولا يفرض تفسيرًا مذهبيًا بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «المسكن» بوصفه المصطلح الكتابي المألوف لخيمة العبادة، مع توضيح البديل «الخيمة» في الحاشية. وُضعت علامتا الحاشيتين في المتن بحسب المطلوب.
