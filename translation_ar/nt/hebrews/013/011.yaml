source:
  edition: SBLGNT
  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: ar
  text: لِأَنَّ أَجْسَادَ الْحَيَوَانَاتِ الَّتِي يُدْخَلُ دَمُهَا إِلَى الْأَمَاكِنِ الْمُقَدَّسَةِ[a] مِنْ أَجْلِ الْخَطِيئَةِ عَلَى يَدِ رَئِيسِ الْكَهَنَةِ، تُحْرَقُ خَارِجَ الْمُعَسْكَرِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى المقدس». يقول اليوناني حرفيًا: «إلى الأماكن المقدسة»، وهو تعبير طقسي عن نطاق المَقدِس.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تُحرَق تمامًا». قد يدل الفعل على الإحراق الكامل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: أجساد الحيوانات التي ... دمها
  rationale: يحافظ هذا التركيب على الإحالة إلى الحيوانات الذبيحية وعلى استئنافها في الجملة اليونانية، مع صياغة عربية طبيعية واضحة.
- source_word: γὰρ
  choice: لأنَّ
  rationale: تُدخل الأداة تعليلًا أو تفسيرًا لما سبق، و«لأنَّ» تبيّن هذه الصلة بوضوح.
- source_word: εἰσφέρεται ... διὰ τοῦ ἀρχιερέως
  choice: يُدخل رئيس الكهنة
  rationale: حُوِّل المبني للمجهول اليوناني مع عبارة الوكالة إلى صياغة عربية مبنية للمعلوم أكثر سلاسة، من غير تغيير الفاعل الطقسي أو الحدث.
- source_word: τὸ αἷμα
  choice: دمها
  rationale: ترجمة مباشرة، والضمير يربط الدم بالحيوانات المذكورة.
- source_word: περὶ ἁμαρτίας
  choice: عن الخطيئة
  rationale: 'تحافظ العبارة على الدلالة الواسعة: ما يتصل بالتكفير عن الخطيئة، من غير حصرها صراحة في مصطلح «ذبيحة خطيئة».'
- source_word: εἰς τὰ ἅγια
  choice: إلى الأماكن المقدسة
  rationale: تحافظ على صيغة الجمع وعلى الدلالة الطقسية لنطاق المقدس، ولا تخصّص المرجع بأنه قدس الأقداس.
- source_word: κατακαίεται
  choice: تُحرَق
  rationale: تنقل الفعل الطقسي بوضوح، مع إثبات احتمال معنى الإحراق التام في الحاشية.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: خارج المعسكر
  rationale: تعبير عربي مألوف ودقيق لصورة معسكر إسرائيل في السياق الطقسي.
theological_decisions:
- issue: المرجع الطقسي لعبارة εἰς τὰ ἅγια
  choice: إلى الأماكن المقدسة
  alternative: إلى المقدس؛ إلى قدس الأقداس
  rationale: العبارة اليونانية جمع ويمكن أن تشير إلى نطاق المقدس عمومًا في الرسالة. تجنبت الترجمة تضييقها إلى «قدس الأقداس» مع إبقاء البديل الأسلس في الحاشية.
- issue: دلالة περὶ ἁμαρτίας
  choice: عن الخطيئة
  alternative: كذبيحة خطيئة؛ لأجل الخطيئة
  rationale: الصياغة المختارة تحفظ الصلة الطقسية بالخطيئة من غير أن تحسم أن العبارة اسم اصطلاحي لنوع محدد من الذبائح.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُخدم «رئيس الكهنة» و«المعسكر» بوصفهما مصطلحين مفهومين وشائعين، وحُفظت العلامتان [a] و[b] في موضعيهما في المتن.
