id: HEB.13.22
reference: Hebrews 13:22
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: ar
  text: وأناشدكم، أيها الإخوة[a]، أن تحتملوا كلمة الوعظ[b] هذه، فإني كتبت إليكم بإيجاز.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ فاليونانية تقول حرفيًا «الإخوة»، وقد يكون الخطاب شاملًا لجميع أفراد الجماعة.
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «كلمة الوعظ» بـ«رسالة التشجيع» أو «كلمة الحث».
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: أناشدكم
  rationale: يفيد الفعل هنا طلبًا شخصيًا جادًا، و«أناشدكم» تنقل قوة الالتماس بلغة عربية فصيحة وطبيعية.
- source_word: δὲ
  choice: الواو في «وأناشدكم»
  rationale: أداة انتقال خفيفة لا تفيد تضادًا قويًا؛ والواو تؤدي الربط الطبيعي في خاتمة الرسالة من غير إضافة ظرف زمان غير موجود في الأصل.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحفظ صيغة النداء المذكرة في اليونانية، مع بيان احتمال شمول جماعة المؤمنين كلها في الحاشية.
- source_word: ἀνέχεσθε
  choice: أن تحتملوا
  rationale: ينقل معنى القبول بصبر وعدم رفض الرسالة، وهو أقرب إلى الفعل من قصره على مجرد الإصغاء.
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: كلمة الوعظ هذه
  rationale: «كلمة» تقابل λόγος بوصفها رسالة منطوقة أو مكتوبة، و«الوعظ» يجمع هنا معنى الحث والتنبيه؛ وأضيف اسم الإشارة عربيًا لتوضيح أن المقصود هو الخطاب الحاضر، من غير تغيير مرجعه.
- source_word: καὶ γὰρ
  choice: فإني
  rationale: الفاء مع «إن» تنقلان التعليل والتوكيد الطبيعيين في التركيب اليوناني.
- source_word: διὰ βραχέων
  choice: بإيجاز
  rationale: تعبير عربي موجز وطبيعي يقابل الاصطلاح بمعنى «في كلمات قليلة».
- source_word: ἐπέστειλα ὑμῖν
  choice: كتبت إليكم
  rationale: الماضي العربي يطابق صيغة الفعل اليوناني ويصلح في سياق رسالة وصلت إلى المخاطبين، من دون الحاجة إلى تركيب يفيد إرسال رسالة صراحة.
theological_decisions:
- issue: مدى شمول النداء ἀδελφοί
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: النص الرئيس يحفظ الصيغة المذكرة الواردة في الأصل، بينما تبين الحاشية أن النداء قد يكون شاملًا لجميع أفراد الجماعة، فلا يُحسم هذا البعد الضمني داخل المتن.
- issue: دلالة παράκλησις
  choice: الوعظ
  alternative: التشجيع أو الحث
  rationale: للكلمة مجال دلالي يشمل الحث والتشجيع والتعزية بحسب السياق. «الوعظ» مناسب لخطاب ديني يحث السامعين، مع إبقاء البديل الألطف في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت نبرة المناشدة والنداء المباشر، وتُرك المجال الدلالي للوعظ والتشجيع ظاهرًا في الحاشية.
