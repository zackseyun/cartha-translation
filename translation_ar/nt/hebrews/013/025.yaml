lexical_decisions:
- source_word: ἡ χάρις
  choice: النِّعْمَةُ
  rationale: تؤدي «النعمة» معنى χάρις في صيغة البركة الختامية المألوفة، وتُبقي أداة التعريف اليونانية بما يلائم الأسلوب العربي الكتابي الطبيعي.
- source_word: μετὰ
  choice: مَعَ
  rationale: μετά مع المضاف إليه تعني «مع». ولأن العبارة اليونانية اسمية مقتضبة ذات قوة دعائية، صيغت عربيًا «لِتَكُنْ... مع» لإظهار معنى التمني والبركة بصورة طبيعية.
- source_word: πάντων ὑμῶν
  choice: مَعَكُمْ جَمِيعًا
  rationale: تحافظ العبارة على شمول πάντων لجميع المخاطَبين، و«جميعًا» حال طبيعية واضحة في العربية المعاصرة.
