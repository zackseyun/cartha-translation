  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: ar
  text: صلّوا لأجلنا، فنحن مقتنعون[a] بأن لنا ضميرًا صالحًا[b]، إذ نريد أن نحسن السلوك في كل شيء[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «واثقون»، أو «موقنون».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ضميرًا نقيًا».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «راغبين في أن نسلك باستقامة في كل شيء».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: Προσεύχεσθε
  choice: صلّوا
  rationale: صيغة أمر للجمع في الزمن الحاضر. «صلّوا» عربية طبيعية تؤدي الأمر، من غير أن تفرض معنى الاستمرار الذي قد يوحي به الجانب الصرفي ولا يصرّح به السياق.
- source_word: περὶ ἡμῶν
  choice: لأجلنا
  rationale: مع فعل الصلاة تؤدي «لأجلنا» معنى περί مع المضاف إليه بوضوح وطبيعية، بدل الترجمة الحرفية «من جهتنا» أو «عنّا».
- source_word: πειθόμεθα
  choice: نحن مقتنعون
  rationale: تحفظ القوة الإدراكية للفعل ومعنى الاقتناع المستقر في السياق، مع بقاء «واثقون» احتمالًا ممكنًا.
- source_word: καλὴν συνείδησιν
  choice: ضميرًا صالحًا
  rationale: ترجمة مباشرة تحفظ الصفة العامة καλὴν والاسم συνείδησιν، من غير تخصيص المعنى إلى «ضمير نقي» أو «مرتاح».
- source_word: ἔχομεν
  choice: لنا
  rationale: التركيب العربي «بأن لنا» يؤدي معنى الملكية في ἔχομεν بصورة أفصح من «بأننا نملك» في هذا السياق.
- source_word: ἐν πᾶσιν
  choice: في كل شيء
  rationale: ينقل الشمول في العبارة اليونانية بوضوح وبأسلوب عربي معاصر.
- source_word: καλῶς
  choice: حسنًا
  rationale: يحفظ المعنى الواسع للظرف، من غير حصره في «بأمانة» أو «بشرف».
- source_word: θέλοντες
  choice: إذ نريد
  rationale: يجعل صلة اسم الفاعل بما قبله مفهومة في العربية، مع إبقاء العبارة في نطاق الإرادة والقصد لا ادعاء الكمال الأخلاقي.
- source_word: ἀναστρέφεσθαι
  choice: أن يكون سلوكنا
  rationale: يؤدي معنى طريقة العيش والتصرف الأخلاقي بلغة عربية طبيعية، ويتجنب ضيق «نتصرف» أو عمومية «نعيش».
theological_decisions:
- issue: صلة العبارة الختامية التي تبدأ بـ θέλοντες بتقرير الضمير الصالح
  choice: 'صيغت بصلة تفسيرية/تعليلية خفيفة: «إذ نريد أن يكون سلوكنا حسنًا في كل شيء»'
  alternative: 'يمكن إبقاء الصلة أقرب إلى التركيب اليوناني: «راغبين في أن يكون سلوكنا حسنًا في كل شيء»'
  rationale: اسم الفاعل اليوناني يحتمل تعلقًا وصفيًا أو تفسيريًا بما قبله. «إذ نريد» توضح الصلة في العربية من غير تحويل الرغبة في السلوك الحسن إلى دعوى بالعصمة أو انعدام الخطأ.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أن يكون سلوكنا حسنًا» لتجنب تركيب ثقيل مثل «أن نتصرف تصرفًا حسنًا»، مع الحفاظ على الدلالة الأخلاقية للفعل اليوناني. وُضعت علامات الحواشي عند الألفاظ أو العبارات التي تتناولها مباشرة.
