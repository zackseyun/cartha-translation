  text: Let brotherly love continue[a].
translation:
  language: ar
  text: لتدم المحبة الأخوية[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي محبة الإخوة والأخوات في الإيمان؛ فاللفظ اليوناني يدل على المودة العائلية داخل جماعة المؤمنين، ولا يقتصر على الذكور.
    reason: بديل معجمي وتوضيح نطاق اللفظ
lexical_decisions:
- source_word: φιλαδελφία
  choice: المحبة الأخوية
  rationale: يدل الاسم على مودة أفراد الأسرة بعضهم لبعض، ويُستعمل هنا لمحبة المؤمنين بعضهم لبعض بوصفهم إخوة وأخوات. وتحفظ «المحبة الأخوية» الصورة العائلية في الأصل من غير اختزال المعنى في الذكور.
- source_word: μενέτω
  choice: لتدم
  rationale: صيغة أمر مضارع تدعو إلى استمرار حالة قائمة؛ و«لتدم» تؤدي قوة الحث ومعنى الاستمرار بإيجاز عربي طبيعي.
- source_word: Ἡ
  choice: الـ في «المحبة»
  rationale: أداة التعريف تجعل المحبة الأخوية فضيلة معروفة لدى المخاطبين، ويؤديها التعريف في العربية أداءً مباشرًا وطبيعيًا.
theological_decisions:
- issue: نطاق φιλαδελφία ولغة القرابة
  choice: المحبة الأخوية
  alternative: محبة الإخوة والأخوات في الإيمان؛ المحبة المتبادلة
  rationale: يحفظ الاختيار استعارة الأسرة التي في اللفظ اليوناني، بينما توضح الحاشية أن المقصود جماعة المؤمنين كلها لا الرجال وحدهم، من غير تحويل العبارة إلى معنى عام يفقد صورتها الأصلية.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة وكريمة النبرة. استُعملت «لتدم» للحث على الاستمرار، و«المحبة الأخوية» للمحافظة على الصورة العائلية مع إزالة احتمال الفهم الذكوري الضيق في الحاشية.
