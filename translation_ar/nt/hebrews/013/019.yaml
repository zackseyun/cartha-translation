  text: περισσοτέρως δὲ παρακαλῶ τοῦτο ποιῆσαι ἵνα τάχιον ἀποκατασταθῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/019.yaml
  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: ar
  text: وأحثّكم بإلحاح أشد أن تفعلوا هذا، لكي أُرَدَّ إليكم[a] في وقت أقرب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُعاد إليكم». يمكن أن يدل التعبير اليوناني عمومًا على ردّ الكاتب إلى قرّائه، من غير تحديد الظرف الذي حال دون وجوده بينهم.'
    reason: بديل معجمي يحفظ اتساع معنى الفعل اليوناني والمبني للمجهول.
lexical_decisions:
- source_word: περισσοτέρως
  choice: بإلحاح أشد
  rationale: حال مقارنة تقوّي الطلب. تنقل العبارة شدة المناشدة وقوتها المقارنة بلغة عربية طبيعية.
- source_word: δὲ
  choice: وَ
  rationale: أداة ربط خفيفة هنا، تصل هذه المناشدة بما قبلها من غير أن توحي بتعارض قوي.
- source_word: παρακαλῶ
  choice: أحثّكم
  rationale: يفيد الفعل في السياق طلبًا جادًا ومناشدة ملحّة، و«أحثّكم» يحفظ قوة الخطاب من غير مبالغة.
- source_word: τοῦτο ποιῆσαι
  choice: أن تفعلوا هذا
  rationale: تحيل العبارة إلى الطلب السابق، أي الصلاة من أجل الكاتب، وتحافظ الصياغة على الإحالة من غير إضافة تفسير إلى المتن.
- source_word: ἵνα
  choice: لكي
  rationale: تُظهر الغاية المقصودة من الطلب بوضوح.
- source_word: τάχιον
  choice: في وقت أقرب
  rationale: يحفظ المعنى المقارن، أي «أسرع/أبكر مما قد يحدث لولا ذلك»، بصياغة عربية واضحة.
- source_word: ἀποκατασταθῶ
  choice: أُرَدَّ
  rationale: يحفظ المبني للمجهول والمعنى العام للاستعادة أو الإرجاع، من غير تحديد سبب غياب الكاتب أو كيفية رجوعه.
- source_word: ὑμῖν
  choice: إليكم
  rationale: ينقل اتجاه الاستعادة وعلاقتها بالمخاطَبين، مع بقاء صيغة الجمع واضحة.
theological_decisions:
- issue: طبيعة ردّ الكاتب إلى المخاطَبين
  choice: 'إبقاء العبارة عامة: أن يُرَدَّ إليهم، من غير تحديد الظرف'
  alternative: أن يُطلَق من السجن، أو يعود من سفر، أو يستعيد خدمته بينهم
  rationale: لا يحدد النص اليوناني هل المقصود إطلاقًا من سجن، أم شفاءً، أم عودةً بعد غياب. لذلك تمتنع الترجمة عن حسم الخلفية التاريخية أو اللاهوتية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «بإلحاح أشد» لإبراز المقارنة من غير تركيب حرفي متكلف، وحُفظ المبني للمجهول في «أُرَدَّ» صونًا لغموض الظروف المقصودة.
