  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: ar
  text: سلِّموا على جميع قادتكم وعلى جميع القديسين. يسلِّم عليكم الذين من إيطاليا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين في إيطاليا يسلِّمون عليكم». يمكن أن تشير العبارة اليونانية إلى أناس من إيطاليا أو إلى أناس موجودين فيها.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سلِّموا على
  rationale: فعل أمر يدل في سياق الرسائل على إبلاغ التحية؛ وهذه الصياغة عربية طبيعية وتحفظ قوة الأمر.
- source_word: πάντας
  choice: جميع
  rationale: تنقل شمول الجماعة المقصودة بوضوح، وتنسجم طبيعيًا مع «قادتكم» و«القديسين».
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: قادتكم
  rationale: يشير التعبير إلى الذين يتولون قيادة الجماعة، كما في عبرانيين 13:7، 17؛ و«قادتكم» واضحة من غير إيحاء سياسي غير مقصود.
- source_word: τοὺς ἁγίους
  choice: القديسين
  rationale: يحفظ المصطلح المعتاد في العهد الجديد للمؤمنين بوصفهم مكرَّسين لله، بدل استبداله بتعبير تفسيري أوسع.
- source_word: ἀσπάζονται
  choice: يسلِّم عليكم
  rationale: صيغة المضارع في سياق ختام الرسالة تفيد توجيه التحية، وهذه العبارة مألوفة وطبيعية في العربية.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: الذين من إيطاليا
  rationale: المعنى المباشر لحرف الجر ἀπό مع المضاف إليه هو المصدر أو المنشأ؛ لذلك تحافظ الصياغة على معنى «من إيطاليا»، مع إثبات الاحتمال المكاني في الحاشية.
theological_decisions:
- issue: مرجع العبارة οἱ ἀπὸ τῆς Ἰταλίας
  choice: الذين من إيطاليا
  alternative: الذين في إيطاليا
  rationale: العبارة تحتمل أن تشير إلى أشخاص أصلهم أو قدومهم من إيطاليا، وقد فُهمت أيضًا على أنها تشير إلى مؤمنين موجودين فيها. أبقى النص الرئيسي الدلالة الأقرب لحرف الجر ἀπό، وتحفظ الحاشية الاحتمال الآخر دون الجزم بمكان كتابة الرسالة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «سلِّموا على» و«يسلِّم عليكم» لسلامة الأسلوب الرسائلي، وحُفظ مصطلح «القديسين» لما له من وزن كتابي ولاهوتي.
