  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: ar
  text: لا تهملوا إكرام الغرباء، لأن بعض الناس، بسببه، استضافوا ملائكة من غير أن يعلموا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «استضافوا رسلًا من غير أن يعلموا». يمكن للكلمة اليونانية أن تعني «ملائكة» أو «رسلًا»، غير أن «ملائكة» أنسب إلى الإشارة المرجحة هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοξενίας
  choice: إكرام الغرباء
  rationale: يدل الاسم على محبة الغرباء والترحيب بهم واستضافتهم؛ و«إكرام الغرباء» تعبير عربي واضح يحفظ عنصر الغريب الذي يتضمنه اللفظ اليوناني، ولا يقتصر على الضيافة بين المعارف.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: لا تهملوا
  rationale: يحتمل الفعل معنى النسيان والإهمال، لكن سياق الوصية العملية يرجح صياغة تفيد التقصير في ممارسة إكرام الغرباء، لا مجرد الغفلة الذهنية.
- source_word: διὰ ταύτης
  choice: بسببه
  rationale: الضمير المؤنث يعود إلى φιλοξενία، أي إكرام الغرباء، وحرف الجر يفيد الوسيلة أو السبب الذي تم من خلاله استقبال الملائكة.
- source_word: ἔλαθόν ... ξενίσαντες
  choice: استضافوا ... من غير أن يعلموا
  rationale: تركيب λανθάνω مع اسم الفاعل يدل على وقوع الاستضافة من دون وعي أصحابها بحقيقة ضيوفهم؛ والصياغة العربية تصرح بهذا المعنى الاصطلاحي طبيعيًا.
- source_word: τινες
  choice: بعض الناس
  rationale: ينقل الضمير غير المحدد بصياغة عربية واضحة من غير تعيين هوية المقصودين.
- source_word: ξενίσαντες
  choice: استضافوا
  rationale: الفعل يعني استقبال الضيف وإيواءه، وهو متصل لفظيًا ودلاليًا بإكرام الغرباء؛ و«استضافوا» أدق من ألفاظ قد توحي بمجرد التسلية أو الطعام.
- source_word: ἀγγέλους
  choice: ملائكة
  rationale: يمكن أن يعني اللفظ رسلًا أو ملائكة، لكن الإشارة المرجحة إلى روايات استقبال زوار سماويين، مثل تكوين 18–19، تجعل «ملائكة» الأنسب في المتن، مع حفظ البديل في الحاشية.
theological_decisions:
- issue: 'دلالة ἀγγέλους: ملائكة سماويون أم رسل بشريون'
  choice: ملائكة
  alternative: رسل
  rationale: الاستعمال المعجمي يجيز المعنيين، إلا أن اقتران اللفظ بإكرام الغرباء والاستضافة يرجح التلميح إلى روايات العهد القديم عن استقبال زوار سماويين. لم تُضف تفاصيل إلى المتن، وحُفظ الاحتمال المعجمي الآخر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختير «إكرام الغرباء» بدل «الضيافة» وحدها لإبراز معنى الترحيب بمن ليس من دائرة المعارف. وُضعت علامة الحاشية بعد الجملة التي تتصل بها، مع الحفاظ على إيجاز الوصية وقوتها.
