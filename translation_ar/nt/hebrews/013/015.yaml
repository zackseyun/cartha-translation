  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: ar
  text: فلنقدِّم لله، به إذًا، ذبيحةَ تسبيحٍ على الدوام[a]، أي ثمرَ شفاهٍ[b] تعترف باسمه[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «دائمًا» أو «في كل حين».
    reason: lexical_alternative
  - marker: b
    text: أو «ثمر شفاهنا»؛ أما ضمير «نا» فمفهوم من سياق الحثّ، لكنه غير مذكور صراحة في اليونانية.
    reason: lexical_alternative
  - marker: c
    text: أو «تُقِرّ باسمه». يمكن للفعل اليوناني أن يدل على الاعتراف العلني أو الإقرار.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: به
  rationale: تحفظ أداة الوساطة أو الوسيلة بإيجاز عربي طبيعي، من غير أن توسّع الضمير إلى اسمٍ غير مذكور صراحة في الآية.
- source_word: οὖν
  choice: إذًا
  rationale: تبيّن أن الحثّ نتيجة لما سبق، وتؤدي وظيفة الاستنتاج في سياق الرسالة.
- source_word: ἀναφέρωμεν
  choice: فلنقدِّم
  rationale: صيغة حثّ جماعية تقابل صيغة المضارع الالتزامي في اليونانية، وتحافظ على معنى تقديم الذبيحة.
- source_word: θυσίαν αἰνέσεως
  choice: ذبيحةَ تسبيح
  rationale: تحفظ الصورة القربانية وصداها الكتابي، وهي عبارة مفهومة وطبيعية في العربية.
- source_word: διὰ παντός
  choice: على الدوام
  rationale: تنقل معنى الاستمرار والثبات، لا مجرد التكرار العرضي.
- source_word: τῷ θεῷ
  choice: لله
  rationale: تجعل الله متلقّي التقدمة، وفق دلالة حالة المجرور غير المباشر في اليونانية.
- source_word: τοῦτ’ ἔστιν
  choice: أي
  rationale: تقدّم تفسيرًا موجزًا لما تتكوّن منه ذبيحة التسبيح.
- source_word: καρπὸν χειλέων
  choice: ثمرَ شفاهٍ
  rationale: تحفظ الاستعارة وصداها الكتابي، ولا تضيف ضمير «نا» غير الصريح في اليونانية.
- source_word: ὁμολογούντων
  choice: تعترف
  rationale: تنقل معنى الإقرار أو الاعتراف العلني، وتبقي الشفاه فاعلًا مجازيًا كما في النص.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: باسمه
  rationale: تركيب عربي طبيعي بعد «تعترف»، ويحفظ كون اسمه موضوع الإقرار من غير شرح زائد.
theological_decisions:
- issue: مرجع الضمير في «به»
  choice: الإبقاء على الضمير، مع دلالة السياق على المسيح وسيطًا للتقدمة.
  alternative: التصريح بعبارة «بيسوع» أو «بالمسيح».
  rationale: السياق السابق يعيّن المرجع، لكن النص نفسه يستخدم ضميرًا؛ لذلك يحفظ النقل الضمير والوساطة معًا من غير توسعة تفسيرية.
- issue: قوة الصورة القربانية
  choice: الإبقاء على «نقدّم» و«ذبيحة تسبيح».
  alternative: تسطيح الصورة إلى «لنسبّح الله».
  rationale: يصوغ النص التسبيح عمدًا بلغة الذبيحة؛ وحفظ الصورة يصون الصلة اللاهوتية والأدبية بسياق الرسالة وخلفيتها الكتابية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعملت «به» بدل تراكيب أطول مثل «من خلاله» للمحافظة على الإيجاز، وأُبقيت استعارتا الذبيحة والثمر. وُضعت علامة كل حاشية عند العبارة التي تشرحها.
