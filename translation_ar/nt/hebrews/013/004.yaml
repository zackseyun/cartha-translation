base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: ar
  text: ليكن الزواج مكرَّمًا[a] لدى الجميع[b]، وليكن فراش الزواج غير مدنَّس، لأن الله سيحكم على الذين يرتكبون الفجور الجنسي والزناة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الزواج مكرَّم لدى الجميع». لا تتضمن اليونانية فعلًا صريحًا في الجملة الأولى، ولذلك يمكن فهمها إما حثًّا وإما خبرًا.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «من الجميع» بدلًا من «لدى الجميع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμιος
  choice: مكرَّمًا
  rationale: تنقل معنى التوقير والتقدير والقيمة، وتنسجم مع القراءة الحثّية التي يرجحها سياق الوصايا المتتابعة.
- source_word: γάμος
  choice: الزواج
  rationale: يشير هنا إلى الزواج بوصفه رابطة وحالة، لا إلى حفل العرس.
- source_word: ἐν πᾶσιν
  choice: عند الجميع
  rationale: تحافظ على الإحالة الأرجح إلى الأشخاص وعلى شمول العبارة، من غير حسم زائد بين معنى «لدى الجميع» ومعنى «من الجميع».
- source_word: κοίτη
  choice: فراش الزواج
  rationale: اللفظة تعني الفراش حرفيًّا وتُستعمل كناية عن العلاقة الجنسية؛ والإضافة إلى الزواج توضح السياق المقصود بصورة طبيعية.
- source_word: ἀμίαντος
  choice: غير مدنَّس
  rationale: يحفظ دلالة عدم التلوث أو التدنيس، بما فيها النبرة الأخلاقية القوية في السياق.
- source_word: πόρνους
  choice: الفاسقين جنسيًّا
  rationale: تعبير معاصر واضح ينقل الفئة الواسعة التي تدل عليها اللفظة، ولا يحصرها في نوع واحد من المخالفة الجنسية.
- source_word: μοιχούς
  choice: الزناة
  rationale: ينقل المعنى المحدد لمن يرتكبون الزنى، ويحافظ على تمييزهم من الفئة الأوسع السابقة.
- source_word: κρινεῖ
  choice: سيدين
  rationale: يحافظ على زمن المستقبل وعلى معنى القضاء، من غير أن يصرح بنتيجة الحكم بما يتجاوز دلالة الفعل اليوناني.
- source_word: γάρ
  choice: لأن
  rationale: تبيّن أن الدينونة الإلهية هي التعليل للتحريض السابق، بصياغة عربية طبيعية.
theological_decisions:
- issue: هل الجملة الافتتاحية خبرية أم حثّية؟
  choice: 'صياغتها حثًّا: «ليكن الزواج مكرَّمًا»'
  alternative: 'صياغتها خبرًا: «الزواج مكرَّم عند الجميع»'
  rationale: لا يوجد فعل صريح في اليونانية، فتحتمل العبارة الخبر والحث. ويرجّح سياق الوصايا الأخلاقية المتتابعة في عبرانيين 13 القراءة الحثّية، مع إثبات الاحتمال الخبري في الحاشية حفاظًا على الغموض الأصيل.
- issue: دلالة ἐν πᾶσιν
  choice: «عند الجميع» في المتن
  alternative: «من الجميع»
  rationale: كلتا الدلالتين ممكنة نحويًّا؛ اخترنا عبارة تحافظ على السعة الاجتماعية للقول، وأثبتنا البديل الذي يشدد على فاعلي التكريم في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت صيغة «ليكن» لإبراز الحث من غير إخفاء احتمال القراءة الخبرية، وتُجنبت الألفاظ القديمة الأضيق مثل «العاهرين» لصالح تعبير مفهوم ومعاصر.
