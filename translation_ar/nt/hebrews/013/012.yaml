base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: ar
  text: لذلك تألَّم يسوع أيضًا خارج البوابة[b]، لكي يقدِّس[a] الشعب بدمه هو.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يجعل الشعب مقدسًا» أو «يكرِّس الشعب».'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن «خارج البوابة» تشير إلى الموضع خارج أورشليم حيث تألَّم يسوع، وفي العبارة صدى لإحراق أجساد الذبائح خارج المحلة في السياق السابق.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: أداة استنتاج تربط ما يقال هنا بالحجة السابقة بوضوح وطبيعية.
- source_word: καὶ
  choice: أيضًا
  rationale: تُظهر موافقة ما حدث ليسوع للنمط الذبائحي المذكور قبلًا، من غير مبالغة في التوكيد.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم.
- source_word: ἵνα ἁγιάσῃ
  choice: لكي يقدِّس
  rationale: تحفظ دلالة الغرض في ἵνα مع صيغة الالتزام، وتبقي المعنى الديني والذبائحي للفعل ἁγιάζω.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: بدم نفسه
  rationale: الباء تفيد الوسيلة، و«نفسه» تحفظ توكيد ἰδίου، أي إن الدم دمه هو.
- source_word: τὸν λαόν
  choice: الشعب
  rationale: يحفظ التعريف والمعنى العهدي المحتمل من غير إضافة «الله»، وهي غير واردة صراحة في اليونانية.
- source_word: ἔξω τῆς πύλης
  choice: خارج الباب
  rationale: يحفظ المفرد في النص، ولا يضيف «المدينة» أو «أورشليم» رغم دلالة السياق عليهما.
- source_word: ἔπαθεν
  choice: تألَّم
  rationale: مقابل عربي مباشر وموجز للفعل πάσχω في الماضي.
theological_decisions:
- issue: دلالة ἁγιάζω في السياق الذبائحي
  choice: يقدِّس
  alternative: يجعل مقدسًا؛ يكرِّس
  rationale: «يقدِّس» يحفظ المجال الديني والعهدي والذبائحي للكلمة، من غير حصرها في تصور مذهبي خاص أو في تغيير أخلاقي فقط.
- issue: مدى مدلول τὸν λαόν
  choice: الشعب
  alternative: شعب الله
  rationale: السياق يرجّح شعب الله العهدي، لكن الأصل يقول «الشعب» فقط؛ لذلك لا تُضاف عبارة تفسيرية إلى المتن.
- issue: مرجع «خارج الباب»
  choice: الإبقاء على العبارة كما هي
  alternative: خارج باب أورشليم؛ خارج المدينة
  rationale: يرجّح السياق أنها تشير إلى موضع آلام يسوع خارج أورشليم، مع صدى إخراج بقايا الذبائح إلى خارج المحلة، لكن الأصل لا يسمّي المدينة صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ ترتيب الجملة بصورة طبيعية في العربية، مع إبقاء ألفاظ «الشعب» و«الباب» من دون توسعات تفسيرية. وُضعت علامتا الحاشيتين في المتن عند اللفظين المعنيين.
