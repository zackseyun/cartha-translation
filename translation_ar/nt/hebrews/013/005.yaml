base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: ar
  text: 'لتكن سيرتكم خالية من محبة المال، واكتفوا بما لديكم[a]، لأنه هو نفسه قال: «لن أتركك أبداً[b]، ولن أتخلى عنك أبداً».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفياً: «بالأشياء الحاضرة»، أي بما هو متاح لكم الآن.'
    reason: lexical_alternative
  - marker: b
    text: يتردد في هذا الوعد صدى تأكيدات العهد في العهد القديم، ولا سيما تثنية 31:6، 8 ويشوع 1:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος
  choice: خالية من محبة المال
  rationale: يحافظ هذا التعبير على المعنى المحدد للصفة، أي عدم الاتصاف بمحبة المال، من غير توسيعه إلى الطمع بكل صوره.
- source_word: ὁ τρόπος
  choice: سيرتكم
  rationale: تشير الكلمة هنا إلى نهج العيش والسلوك، وصيغة الجمع تلائم توجيه الخطاب إلى جماعة المؤمنين.
- source_word: ἀρκούμενοι
  choice: واكتفوا
  rationale: ينقل صيغة الحث التي يؤديها اسم الفاعل في السياق، وهو تعبير عربي طبيعي وواضح.
- source_word: τοῖς παροῦσιν
  choice: بما لديكم
  rationale: تعبير عربي طبيعي يدل على الأشياء المتاحة أو الموجودة لدى المخاطبين، مع إبقاء الإشارة عامة إلى الممتلكات والظروف الحاضرة.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: لأنه هو نفسه قال
  rationale: يحفظ توكيد αὐτός، ويترك هوية القائل ضمناً كما في اليونانية، فيما تفيد صيغة «قال» بقاء سلطان القول في السياق.
- source_word: Οὐ μή σε ἀνῶ
  choice: لن أتركك أبداً
  rationale: تنقل «لن... أبداً» قوة النفي المؤكد οὐ μή بصياغة عربية طبيعية.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: ولن أتخلى عنك أبداً
  rationale: «أتخلى عنك» تنقل معنى الترك والهجر، وتكرار «أبداً» يحفظ شدة النفي في الشطر الثاني.
theological_decisions:
- issue: تحديد هوية المتكلم في الاقتباس
  choice: 'الإبقاء على الضمير المؤكد: «لأنه هو نفسه قال»'
  alternative: «لأن الله نفسه قال»
  rationale: السياق يفهم منه أن الله هو المتكلم، لكن النص اليوناني يستعمل ضميراً مؤكداً ولا يذكر اسم «الله» صراحة، لذلك لم يُضف الاسم إلى المتن.
- issue: نقل النفي اليوناني المؤكد في الوعد
  choice: «لن أتركك أبداً، ولن أتخلى عنك أبداً»
  alternative: «حاشا أن أتركك أو أتخلى عنك»
  rationale: تكرار «لن... أبداً» ينقل قوة صيغتي οὐ μή ويصون شدة الضمان الإلهي بلغة عربية واضحة من غير محاكاة حرفية متكلفة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «سيرتكم» للدلالة الموجزة على نهج الحياة والسلوك، و«بما لديكم» لطبيعتها في العربية. وُضعت علامتا الحاشيتين [a] و[b] في المتن.
