  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: ar
  text: 'لذلك نقول بثقة: «الربُّ مُعيني، لن أخاف. ماذا سيفعل بي إنسان؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: حتى إننا
  rationale: تنقل نتيجة الكلام السابق وتلائم في العربية تركيب القول الذي يليها.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: نقول واثقين
  rationale: تحافظ على دلالة الثقة والشجاعة في اسم الفاعل، من غير تحويل العبارة إلى أمر أو إضافة معنى الإمكان.
- source_word: Κύριος
  choice: الربّ
  rationale: المقابل العربي المألوف للقب κύριος في هذا السياق الاقتباسي.
- source_word: ἐμοὶ βοηθός
  choice: مُعيني
  rationale: صياغة عربية موجزة وطبيعية تؤدي معنى «معين لي» وتحافظ على الدلالة الشخصية للمعونة.
- source_word: οὐ φοβηθήσομαι
  choice: فلا أخاف
  rationale: تعبير عربي طبيعي عن المستقبل ذي القوة الإرادية أو الواثقة في هذا التصريح، مع بقاء نفي الخوف واضحًا.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: ماذا يفعل بي إنسان؟
  rationale: يحافظ على صيغة المفرد العامة ἄνθρωπος وعلى الفعل المستقبلي ذي الاستعمال البلاغي؛ والمضارع العربي هنا طبيعي للدلالة على ما قد يفعله الإنسان.
theological_decisions:
- issue: الدلالة العامة لكلمة ἄνθρωπος
  choice: إنسان
  alternative: بشر أو أيّ إنسان
  rationale: «إنسان» مفرد عام شامل في العربية، فلا يحصر المعنى في الذكور ولا يبدد الصورة التمثيلية للمفرد.
- issue: القوة البلاغية للمستقبل ποιήσει
  choice: ماذا يفعل بي إنسان؟
  alternative: ماذا يستطيع إنسان أن يفعل بي؟
  rationale: الصياغة المختارة أقرب إلى بنية المصدر وتحفظ التوتر البلاغي من غير إدخال فعل الاستطاعة الصريح، بينما يفهم السياق معنى التحدي ونفي التهديد الحاسم.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. اختيرت صياغة موجزة قريبة من بنية اليونانية، مع تجنب الأسلوب المتكلف أو الطائفي.
