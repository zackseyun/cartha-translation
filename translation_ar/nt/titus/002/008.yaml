id: TIT.2.8
reference: Titus 2:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων ⸂λέγειν περὶ ἡμῶν⸃ φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: ar
  text: وكلامًا سليمًا[a] لا مجال لإدانته[b]، لكي يُخزى المعارض[c]، إذ لا يجد ما يقوله عنا من سوء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قولًا سليمًا» أو «رسالة سليمة».
    reason: lexical_alternative
  - marker: b
    text: أو «لا غبار عليه» أو «لا يؤخذ عليه شيء».
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «الذي من الجانب المقابل»، أي المعارض.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: كلامًا
  rationale: يشير في السياق إلى مضمون الكلام وطريقته في التعليم، لا إلى لفظة مفردة. وجاء منصوبًا استمرارًا لبنية الوصايا في الآية السابقة.
- source_word: ὑγιῆ
  choice: سليمًا
  rationale: يحفظ صورة الصحة المستعملة للدلالة على الاستقامة العقدية والأخلاقية، وهو تعبير عربي طبيعي مع «الكلام».
- source_word: ἀκατάγνωστον
  choice: لا مجال لإدانته
  rationale: ينقل معنى الكلام الذي لا تقوم عليه إدانة أو مؤاخذة معتبرة، بصياغة عربية أوضح من تتابع الصفات.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية أو النتيجة المقصودة.
- source_word: ὁ ἐξ ἐναντίας
  choice: المعارض
  rationale: تعبير اصطلاحي عن الشخص الواقف في الجانب المقابل؛ و«المعارض» موجز وطبيعي، مع بيان الصورة الحرفية في الحاشية.
- source_word: ἐντραπῇ
  choice: يُخزى
  rationale: ينقل صيغة المبني للمجهول وقوة الخزي الاجتماعي والأخلاقي، دون تخفيفها إلى مجرد الحرج.
- source_word: μηδὲν ἔχων λέγειν
  choice: إذ لا يجد ما يقوله
  rationale: صياغة عربية طبيعية للبنية الحالية التي تفيد افتقار المعارض إلى أي قول أو اتهام صالح.
- source_word: περὶ ἡμῶν
  choice: عنا
  rationale: يحافظ على ضمير المتكلمين الجمع كما في النص اليوناني دون تضييق مرجعه أو توسيعه.
- source_word: φαῦλον
  choice: من سوء
  rationale: ينقل الدلالة الأخلاقية للكلمة، ويأتي طبيعيًا في العبارة العربية «ما يقوله عنا من سوء».
theological_decisions:
- issue: نطاق ضمير المتكلمين في περὶ ἡμῶν
  choice: عنا
  alternative: عنك؛ أو عن المسيحيين؛ أو عن تعليمنا
  rationale: النص اليوناني يستعمل ضمير المتكلمين الجمع، فلا ينبغي قصره على تيطس أو توسيعه صراحةً ليشمل جماعة بعينها.
- issue: دلالة ἐντραπῇ بين الخزي الذاتي والتخزية
  choice: يُخزى
  alternative: يخجل؛ أو يستحي
  rationale: الصيغة اليونانية مبنية للمجهول ويمكن أن تصف الوقوع في الخزي، لذلك اختير تعبير يحفظ هذه القوة ولا يحسمها بوصفها مجرد شعور داخلي.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. أُبقي افتتاح الآية بالواو والنصب لأنها تواصل قائمة الصفات والوصايا في السياق السابق، وتُرك ضمير «عنا» على سعته الأصلية.
