- source_word: παρακάλει
  choice: حُثَّ
  rationale: فعل أمر مضارع يدل على مواصلة الحث والإرشاد؛ و«حُثَّ» ينقل قوة الطلب بوضوح من غير اصطلاحية زائدة.
- source_word: σωφρονεῖν
  choice: على أن يكونوا متعقّلين
  rationale: يفيد المصدر التحلي بالحكم السليم وضبط النفس والسلوك المنضبط. و«متعقّلين» لفظ عربي طبيعي يحفظ اتساع الدلالة دون حصرها في جانب واحد.
theological_decisions:
- issue: المرجع الجنسي في νεωτέρους
  choice: الرجال الأصغر سنًّا
