  rationale: السياق القريب يخاطب فئات متميزة بحسب السن والجنس، والصيغة اليونانية مذكرة؛ لذلك حُفظت الإشارة المحددة إلى الذكور.
- issue: مدى دلالة σωφρονεῖν
  choice: متعقّلين
  alternative: ضابطين لأنفسهم
  rationale: الكلمة تجمع بين سلامة الحكم والانضباط وضبط النفس. اختيرت «متعقّلين» في المتن مع بيان البعد الآخر في الحاشية، حفاظًا على سعة المعنى الأصلية.
