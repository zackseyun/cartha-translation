  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعملت «العجائز» بدلالتها العربية الأصلية على المتقدمات في السن، وحُفظت صورتا ما يليق بالمقدسات والاستعباد للخمر. جميع علامات الحواشي مثبتة في المتن.
