- source_word: ἱεροπρεπεῖς
  choice: على ما يليق بالمقدسات
  rationale: يحفظ معنى ما هو ملائم للمقدس أو للقداسة، بدل اختزاله في خشوع باطني فقط.
- source_word: μὴ διαβόλους
  choice: غير مفتريات
  rationale: اللفظ هنا وصف أخلاقي للواتي يوجهن اتهامات كاذبة أو تشهيرية، وليس إشارة إلى إبليس.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: ولا مستعبدات للخمر الكثير
  rationale: يحفظ صيغة الاستعباد في اسم المفعول التام، أي الخضوع المستمر لسلطان كثرة الخمر، من غير استبدال الصورة بتفسير «مدمنات».
- source_word: καλοδιδασκάλους
  choice: ومعلِّماتٍ ما هو صالح
  rationale: يبيّن أن الصلاح وصف لمضمون التعليم، لا لمهارة المعلّمات فحسب.
theological_decisions:
- issue: صورة الاستعباد في التحذير من الخمر
  choice: ولا مستعبدات للخمر الكثير
  alternative: ولا مدمنات الخمر الكثير
  rationale: النص اليوناني يستعمل صورة العبودية للدلالة على سيطرة الخمر؛ إبقاء الصورة أوفى للنص ويحافظ على قوتها اللاهوتية والأخلاقية.
- issue: دلالة ἱεροπρεπεῖς
  choice: على ما يليق بالمقدسات
  alternative: بوقار
  rationale: البديل المختصر «بوقار» طبيعي، لكنه قد يفقد الصلة الصريحة بما يلائم المجال المقدس؛ فحُفظ هذا المعنى من غير تقرير تصور طائفي خاص للقداسة.
