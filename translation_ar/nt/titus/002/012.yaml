  text: παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: ar
  text: وهي تُدرِّبنا[a] لكي نحيا في العصر الحاضر بضبط النفس والبر والتقوى[c]، بعد أن ننبذ عدمَ التقوى والشهواتِ الدنيوية[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «تُعلِّمنا» أو «تؤدِّبنا»؛ فالكلمة اليونانية تشمل معنى التدريب الذي يُنشئ الإنسان ويهذّبه.
    reason: lexical_alternative
  - marker: b
    text: أو «الرغبات الدنيوية».
    reason: lexical_alternative
  - marker: c
    text: تَرِد في اليونانية ثلاثة أحوال تصف كيفية الحياة، أي حياة تتسم بضبط النفس والبر والتقوى.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: تُدرِّبنا
  rationale: يفيد الفعل تنشئةً تكوينية تجمع التعليم والتهذيب العملي، و«تُدرِّبنا» واضحة وطبيعية وتحفظ هذا المدى الدلالي.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية في الجملة اليونانية بصياغة عربية موجزة.
- source_word: ἀρνησάμενοι
  choice: بعدما نبذنا
  rationale: «نبذنا» تعبّر عن الرفض الحاسم، و«بعدما» تعكس سبق الفعل المعبَّر عنه باسم الفاعل الأوريستي بالنسبة إلى الفعل الرئيس.
- source_word: τὴν ἀσέβειαν
  choice: عدمَ التقوى
  rationale: تحفظ البعد الديني والأخلاقي للمصطلح، كما تُظهر مقابلته المقصودة مع εὐσεβῶς في آخر العبارة، من غير حصره في الفجور الأخلاقي.
- source_word: τὰς κοσμικὰς ἐπιθυμίας
  choice: الشهواتِ الدنيوية
  rationale: تدل على الرغبات المنتمية إلى نظام العالم الحاضر؛ و«الدنيوية» مألوفة ولا توحي بالمعنى الحديث لكلمة «علمانية».
- source_word: σωφρόνως
  choice: بضبط النفس
  rationale: تحفظ معنى الرزانة والانضباط الذاتي، وهو موضوع متكرر في رسالة تيطس.
- source_word: δικαίως
  choice: بالبر
  rationale: تنقل السلوك الموافق لما هو حق وصواب، مع إبقاء الرنين الأخلاقي والديني للكلمة.
- source_word: εὐσεβῶς
  choice: بالتقوى
  rationale: تعبّر عن حياة متجهة إلى الله تتصف بالورع والتكريس له.
- source_word: ζήσωμεν
  choice: نحيا
  rationale: صيغة المضارع بعد «لكي» تؤدي معنى صيغة الاحتمال اليونانية في سياق الغاية من دون تحويلها إلى أمر مباشر.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: في العصر الحاضر
  rationale: تحفظ معنى αἰών بوصفه العصر الراهن في مقابل العصر الآتي، لا مجرد الزمن أو العالم المكاني.
theological_decisions:
- issue: الثلاثية الأخلاقية σωφρόνως καὶ δικαίως καὶ εὐσεβῶς
  choice: بضبط النفس والبر والتقوى
  alternative: بتعقّل وعدل وتقوى
  rationale: الألفاظ الثلاثة في اليونانية أحوال تعدّل فعل «نحيا». وتحفظ الصياغة العربية وظيفتها الظرفية وتوازنها الثلاثي، من غير جعلها صفات اسمية أو اختزال أي بُعد منها.
- issue: العلاقة الزمنية في ἀρνησάμενοι
  choice: بعدما نبذنا
  alternative: نابذين
  rationale: تعكس الصياغة الفعل الأوريستي السابق منطقيًا على نمط الحياة الموصوف، مع عدم تحويل النبذ إلى عمل خلاصي مستقل أو تقرير ترتيب عقائدي يتجاوز تركيب النص.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموقّرة. أُبقيت «وهي» لإظهار صلة اسم الفاعل المؤنث بنعمة الله المذكورة في الآية السابقة، وحُفظت بنية الغاية والثلاثية الأخلاقية من غير تكلّف حرفي.
