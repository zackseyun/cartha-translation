    text: 'أي جدية كريمة تستحق الاحترام؛ ويمكن أيضًا: «رصانة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ πάντα
  choice: في كلِّ شيء
  rationale: تؤدي العبارة وظيفة ظرفية هنا، فتدل على شمول السلوك. وهذه الصياغة عربية واضحة، مع بقاء احتمال معنى «من كل وجه» مذكورًا في الحاشية.
- source_word: σεαυτὸν παρεχόμενος
  choice: قدِّم نفسك
  rationale: يحفظ التعبير قوة الضمير الانعكاسي ودور تيطس الفاعل في إظهار نفسه مثالًا، وصيغة الأمر تلائم العربية وسياق الوصايا الذي يتبعه اسم الفاعل اليوناني.
- source_word: τύπον
  choice: قدوةً
  rationale: يدل اللفظ في هذا السياق الأخلاقي على مثال يُحتذى، و«قدوة» هي المقابل العربي الطبيعي والدقيق.
- source_word: καλῶν ἔργων
  choice: في الأعمال الصالحة
  rationale: توضح الصياغة المجال الذي يكون فيه تيطس قدوة، وتحافظ على المعنى الأخلاقي المألوف للعبارة من غير تحميلها دلالة مذهبية زائدة.
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: في تعليمك
  rationale: يرجح السياق أن المقصود تعليم تيطس أو قيامه بالتعليم؛ وإضافة ضمير المخاطب تجعل المرجع واضحًا في العربية من غير حصر اللفظ في معنى «العقيدة» الاصطلاحي.
- source_word: ἀφθορίαν
  choice: نزاهةٌ
  rationale: يفيد اللفظ الخلو من الفساد. و«نزاهة» تنقل في هذا السياق سلامة التعليم واستقامته بلغة عربية طبيعية، مع بيان بدائل أصرح في الحاشية.
- source_word: σεμνότητα
  choice: وقارٌ
  rationale: يدل اللفظ على جدية كريمة تستحق الاحترام، و«وقار» يجمع الجدية والهيبة المحمودة في العربية المعاصرة.
theological_decisions:
- issue: هل تُترجم διδασκαλία بمصطلح كنسي تجريدي؟
  choice: في تعليمك
  alternative: في التعليم؛ في العقيدة
  rationale: السياق يتناول تعليم تيطس من حيث مضمونه وطريقته، ولا يفرض قصر المعنى على الصياغة العقائدية الرسمية.
- issue: مدى تخصيص معنى ἀφθορίαν
  choice: نزاهة
  alternative: عدم فساد؛ سلامة؛ طهارة
  rationale: تحفظ «نزاهة» فكرة الخلو من الفساد مع ملاءمة السياق التعليمي، من غير الجزم بأن المقصود أخلاقي محض أو تعليمي محض.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة وكريمة. استُخدمت صيغة الأمر بدل النقل الحرفي لاسم الفاعل اليوناني لأنها تتمم وصايا السياق بصورة طبيعية، واستُعملت جملة «وليكن» لإظهار العلاقة النحوية المضمرة في الشطر الثاني من غير تغيير المعنى.
