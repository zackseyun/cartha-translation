translation:
  language: ar
  text: وفي كلِّ شيء، قدِّم نفسك قدوةً في الأعمال الصالحة[a]؛ ولْيكن في تعليمك نزاهةٌ[b] ووقارٌ[c].
  philosophy: optimal-equivalence
  footnotes:
