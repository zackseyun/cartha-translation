  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: ar
  text: الذي بذل نفسه لأجلنا، لكي يفتدينا من كل تعدٍّ على الشريعة، ويطهّر لنفسه شعبًا يختصّ به[a]، متحمّسًا للأعمال الصالحة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شعبًا عزيزًا عليه»، أو: «شعبًا يملكه ملكيةً خاصة». تشير العبارة اليونانية إلى شعب يخصه على نحو مميز، وتحمل صدى لغة العهد عن شعب الله الخاص.'
    reason: بديل معجمي وبيان للدلالة العهدية
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: بذل نفسه
  rationale: تعبير عربي طبيعي يدل على العطاء الذاتي الطوعي ويحفظ قوة الضمير المنعكس، من غير إضافة تفسير يتجاوز اليونانية.
- source_word: ὑπὲρ ἡμῶν
  choice: لأجلنا
  rationale: يحفظ المعنى الواسع للعطاء لمصلحتنا ومن أجلنا، من غير حصر العبارة في صياغة محددة لكيفية الكفارة.
- source_word: ἵνα λυτρώσηται
  choice: لكي يفتدينا
  rationale: «يفتدي» ينقل معنى التحرير أو الإنقاذ بفدية، ويحافظ على الرنين الخلاصي للفعل اليوناني.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: من كل تعدٍّ على الشريعة
  rationale: توضح العبارة معنى ἀνομία بوصفه مخالفةً للشريعة أو خروجًا عليها، وهي أدق من ألفاظ عامة مثل «الشر»، مع الحفاظ على شمول πάσης.
- source_word: καθαρίσῃ
  choice: يطهّر
  rationale: ينقل المعنى الأخلاقي والعهدي للتنقية، ويلائم سياق إعداد شعب مقدس.
- source_word: ἑαυτῷ
  choice: لنفسه
  rationale: يحفظ دلالة الاختصاص والمنفعة في صيغة المجرور اليونانية، ويبين أن الشعب المعدّ يخصه.
- source_word: λαὸν περιούσιον
  choice: شعبًا خاصًّا به
  rationale: صياغة عربية واضحة تحافظ على معنى الشعب الذي يخصه ملكيةً مميزة، وعلى الصدى العهدي للعبارة، مع بيان البدائل في الحاشية.
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: متحمّسًا للأعمال الصالحة
  rationale: ينقل معنى الرغبة الجادة والاندفاع إلى فعل الصالح، بلغة عربية معاصرة واضحة.
theological_decisions:
- issue: دلالة ὑπὲρ ἡμῶν في بذل المسيح نفسه
  choice: لأجلنا
  alternative: نيابةً عنا
  rationale: قد تحمل العبارة معنى العمل لمصلحتنا، وقد تتضمن في السياق معنى النيابة؛ لذلك تحافظ «لأجلنا» على سعة النص من غير أن تحصره في تصور واحد للكفارة.
- issue: الدلالة العهدية لعبارة λαὸν περιούσιον
  choice: شعبًا خاصًّا به
  alternative: شعبًا عزيزًا عليه؛ شعبًا يملكه ملكيةً خاصة
  rationale: تحفظ الصياغة معنى الاختصاص والانتماء المميز، وتبقي صدى لغة العهد في العهد القديم من غير توسع تفسيري داخل المتن.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت تراكيب مألوفة مثل «بذل نفسه» و«يفتدينا»، مع شرح «ἀνομία» بعبارة «التعدي على الشريعة» وتجنب المصطلحات الطائفية أو التفسيرية الضيقة.
