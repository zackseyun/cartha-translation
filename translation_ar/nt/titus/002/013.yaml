  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: ar
  text: منتظرين الرجاء المبارك وظهور مجد إلهنا العظيم ومخلِّصنا، يسوع المسيح[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على وجه أقل ترجيحًا: «ظهور مجد الإله العظيم ومجد مخلِّصنا يسوع المسيح»، إذا اعتُبر «الإله» و«المخلِّص» مرجعين متميزين، لا لقبًا واحدًا ليسوع.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: منتظرين
  rationale: اسم الفاعل اليوناني متصل بما قبله ويدل على ترقّب مستمر ومتطلع؛ وصيغة «منتظرين» تحفظ الارتباط النحوي من غير إضافة غير موجودة في النص.
- source_word: τὴν μακαρίαν ἐλπίδα
  choice: الرجاء المبارك
  rationale: «الرجاء» هو المقابل المألوف لـἐλπίς في السياق الأخروي، و«المبارك» أنسب من ألفاظ السعادة العابرة.
- source_word: ἐπιφάνειαν τῆς δόξης
  choice: ظهور مجد
  rationale: يحفظ التعبير علاقة الإضافة اليونانية ويفيد انكشاف المجد وظهوره علنًا، من غير اللجوء إلى مصطلح تقني غامض.
- source_word: τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν
  choice: إلهنا العظيم ومخلِّصنا
  rationale: تنقل العبارة بوصفها لقبًا موحدًا، كما يرجّح تركيب أداة التعريف الواحدة مع الاسمين الشخصيين المفردين؛ وتوزيع ضمير المتكلم في العربية يجعل الصياغة طبيعية ولا يغيّر المرجع.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ترجمة عربية راسخة للقب Χριστός ومفهومة بوصفها لقبًا، لا مجرد نقل صوتي أجنبي.
theological_decisions:
- issue: هل تشير عبارة «الإله العظيم والمخلّص» إلى شخص واحد هو يسوع المسيح، أم إلى الله والمخلّص يسوع بوصفهما مرجعين متميزين؟
  choice: 'تُفهم العبارة أساسًا على أنها تشير إلى شخص واحد: يسوع المسيح هو «إلهنا العظيم ومخلِّصنا».'
  alternative: «مجد الإله العظيم ومخلِّصنا يسوع المسيح»، على اعتبار «الإله» و«المخلّص» مرجعين متميزين.
  rationale: في اليونانية أداة تعريف واحدة تحكم اسمين شخصيين مفردين موصولين بالواو، ثم يأتي «يسوع المسيح» لبيان المرجع؛ لذا تكون الإحالة إلى شخص واحد هي الأرجح نحويًا وسياقيًا. ومع ذلك يُذكر الوجه الآخر في الحاشية حفاظًا على إمكان التركيب وعدم طمس موضع الخلاف.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. أُبقي التركيب موجزًا ومتصلًا بسياقه السابق، واستُعملت «المسيح» كلقب عربي راسخ. وُضعت علامة الحاشية بعد الاسم الذي توضّح الحاشية هويته وصلته باللقبين.
