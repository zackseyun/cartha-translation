lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تفيد الغاية أو النتيجة المقصودة، و«لكي» تعبير عربي طبيعي يحفظ هذه الدلالة.
- source_word: σωφρονίζωσι
  choice: يُدَرِّبنَ
  rationale: يحمل الفعل معنى الإرشاد والتقويم نحو التعقل وحسن السلوك؛ و«يُدَرِّبنَ» يبرز التكوين العملي المستمر في السياق.
- source_word: τὰς νέας
  choice: الشابات
  rationale: الصفة المؤنثة المعرّفة مستعملة اسميًا، وتشير إلى النساء الأصغر سنًا في مقابل المتقدمات في السن المذكورات في السياق، من غير حصرهن لغويًا في الزوجات.
- source_word: φιλάνδρους
  choice: مُحِبّاتٍ لأزواجهنَّ
  rationale: صفة تدل على محبة المرأة لزوجها؛ والصياغة الوصفية تحفظ قوة الصفة في اليونانية.
- source_word: εἶναι
  choice: أن يكنَّ
  rationale: تنقل فعل الكينونة الذي يربط التدريب بالصفتين التاليتين.
- source_word: φιλοτέκνους
  choice: مُحِبّاتٍ لأولادهنَّ
  rationale: صفة تدل على محبة الأولاد، وصيغت بالتوازي مع φιλάνδρους حفاظًا على توازن العبارة اليونانية.
theological_decisions:
- issue: نطاق الإرشاد الموجَّه إلى الشابات في سياق التعليم الأسري
  choice: إبقاء المرجع «الشابات» عامًا بحسب اللفظ اليوناني، مع نقل وصف محبتهن لأزواجهن وأولادهن كما يورده السياق.
  alternative: ترجمة اللفظ «الزوجات الشابات» أو تحويل العبارة إلى تقرير عام شامل عن دور المرأة.
  rationale: اليونانية تقول حرفيًا «الشابات/الأصغر سنًا»، لا «الزوجات»، وإن كانت الصفتان اللاحقتان تفترضان هنا حالة من لهن أزواج وأولاد. تحفظ الترجمة هذا التحديد السياقي من غير تضييق المرجع أو استنباط تطبيق مذهبي زائد.
translation_notes:
  register: صياغة عربية فصحى معاصرة واضحة وكريمة. استُعملت «الشابات» طبيعيًا بدل تركيب أثقل مثل «النساء الأصغر سنًا»، وحُفظ التوازي بين الصفتين اليونانيتين بعبارة «مُحِبّاتٍ لأزواجهنَّ وأولادهنَّ». وُضعت علامات الحواشي جميعها في النص الرئيس.
