id: TIT.2.5
reference: Titus 2:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: σώφρονας, ἁγνάς, ⸀οἰκουργούς, ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: ar
  text: ضابطاتٍ لأنفسهن، طاهراتٍ، قائماتٍ بأعمال بيوتهن[a]، طيباتٍ، خاضعاتٍ لأزواجهن[b]، لكيلا يُطعَن في كلمة الله[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «منشغلاتٍ بأعمال البيت». اللفظ اليوناني نادر، ويشير إلى القيام بأعمال المنزل ومسؤولياته.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مُخضِعاتٍ أنفسهن لأزواجهن».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يُساء إليها»، وحرفيًا: «يُجدَّف عليها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: ضابطاتٍ لأنفسهن
  rationale: يفيد اللفظ رجاحة العقل التي تظهر في ضبط النفس والتصرف المتزن؛ وهذه الصياغة واضحة في العربية الحديثة وتحافظ على البعد العملي للفضيلة.
- source_word: ἁγνάς
  choice: طاهراتٍ
  rationale: ينقل معنى النقاء، ولا سيما النقاء الأخلاقي، من غير حصره في جانب واحد.
- source_word: οἰκουργούς
  choice: قائماتٍ بأعمال بيوتهن
  rationale: اللفظ اليوناني النادر يجمع بين البيت والعمل، فيشير إلى الاضطلاع بأعمال المنزل ومسؤولياته، لا إلى مجرد البقاء فيه أو الانحصار داخله.
- source_word: ἀγαθάς
  choice: طيباتٍ
  rationale: يناسب سياق الفضائل ويعبّر طبيعيًا عن الصلاح في المعاملة والسلوك، مع بقاء معنى «صالحات» ممكنًا.
- source_word: ὑποτασσομένας
  choice: خاضعاتٍ
  rationale: يحفظ معنى الخضوع ضمن ترتيب العلاقة كما يورده النص، من غير إضافة منظومة مذهبية أوسع.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: لأزواجهن
  rationale: في سياق العلاقة المنزلية يدل ἀνήρ على الزوج، ويقصر الضمير اليوناني ἰδίοις العلاقة على أزواجهن هن؛ وهذا مفهوم في ضمير العربية المتصل.
- source_word: ἵνα μὴ
  choice: لكيلا
  rationale: يحافظ على دلالة الغاية بصياغة عربية موجزة وطبيعية.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: كلمة الله
  rationale: ترجمة مباشرة ومألوفة للعبارة، وتبقي احتمال الإشارة إلى رسالة الله المعلنة.
- source_word: βλασφημῆται
  choice: يُطعَن في
  rationale: ينقل بوضوح معنى التنديد والكلام المسيء في العربية المعاصرة، بينما تورد الحاشية المقابل الأقرب حرفيًا «يُجدَّف على».
theological_decisions:
- issue: ترجمة οἰκουργούς من غير المبالغة في معنى تقييد المرأة بالمنزل
  choice: قائماتٍ بأعمال بيوتهن
  alternative: ملازماتٍ لبيوتهن؛ أو عاملاتٍ في البيت
  rationale: يركز المركب اليوناني على العمل المتعلق بالبيت، ولا ينص في ذاته على العزلة أو منع العمل خارجه؛ لذلك تحافظ الصياغة على المسؤولية المنزلية دون توسيع مدلول النص.
- issue: نقل ὑποτασσομένας مع حفظ الترتيب العلاقي وحدوده
  choice: خاضعاتٍ لأزواجهن
  alternative: مُخضِعاتٍ أنفسهن لأزواجهن؛ أو مطيعاتٍ لأزواجهن
  rationale: تثبت الصياغة الخضوع المذكور في النص، وتقصره على علاقة الزوجة بزوجها، من غير تحميل الآية بناءً مذهبيًا أوسع أو مساواة الخضوع بالطاعة في كل تفصيل.
- issue: دلالة βλασφημῆται حين تكون كلمة الله هي المتلقية للإساءة
  choice: يُطعَن في كلمة الله
  alternative: يُجدَّف على كلمة الله؛ أو يُساء إلى سمعة كلمة الله
  rationale: الفعل قد يدل على التجديف أو التشهير والإساءة بالقول. «يُطعَن في» يحفظ فكرة التعرض للكلمة بالقدح، وتبقي الحاشية المقابل الحرفي الأشد دينيًا.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. روعي توافق الصفات في صيغة جمع المؤنث المنصوب لأنها تتابع قائمةً بدأت في السياق السابق، واستُعملت ألفاظ مألوفة مع إبقاء البدائل ذات الصلة في الحواشي.
