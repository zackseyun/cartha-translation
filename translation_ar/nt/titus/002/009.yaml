lexical_decisions:
- source_word: Δούλους
  choice: العبيد
  rationale: يشير السياق إلى أشخاص خاضعين لسادة يملكون سلطة فعلية عليهم؛ لذلك تحافظ «العبيد» على الواقع الاجتماعي المقيَّد الذي يدل عليه اللفظ هنا، بدل تلطيفه إلى «الخدم».
- source_word: ἰδίοις δεσπόταις
  choice: لسادتهم
  rationale: «السادة» هي الصياغة العربية الطبيعية في سياق العبودية، وضمير «هم» ينقل معنى ἰδίοις، أي سادتهم هم.
- source_word: ὑποτάσσεσθαι
  choice: أن يخضعوا
  rationale: تنقل معنى وضع النفس تحت السلطة أو الترتيب، وتلائم القوة الإرشادية للمصدر في هذا السياق.
- source_word: ἐν πᾶσιν
  choice: في كل شيء
  rationale: تحافظ على الشمول اللفظي للعبارة من غير إضافة قيد غير موجود في النص.
- source_word: εὐαρέστους εἶναι
  choice: أن يكونوا موضع رضاهم
  rationale: صياغة عربية طبيعية لمعنى أن يكونوا مرضيين أو مقبولين لدى سادتهم، مع إبقاء جهة الرضا مفهومة من السياق.
- source_word: μὴ ἀντιλέγοντας
  choice: ألا يجادلوهم
  rationale: يفيد الفعل الكلام المعارض أو المناقضة؛ و«يجادلوهم» واضحة وفصيحة، مع بيان البدائل الأقرب حرفيًا في الحاشية.
theological_decisions:
- issue: دلالة δοῦλος في نظام البيت القديم
  choice: العبيد
  alternative: الخدم / العبيد المرتبطون بالخدمة
  rationale: اقتران اللفظ بـ δεσπόταις يجعل وضع العبودية والتبعية القانونية بارزًا. تنقل الترجمة الواقع الذي يتناوله النص من غير أن تُفهم بوصفها إقرارًا أخلاقيًا للمؤسسة.
- issue: شمول عبارة ἐν πᾶσιν
  choice: في كل شيء
  alternative: في جميع الأمور / من كل وجه
  rationale: أُبقيت العبارة على إطلاقها كما في اليونانية، من غير إدخال استثناء تفسيري في متن الآية، حفاظًا على التوتر والنطاق الظاهرين في النص.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ورصينة. استُخدمت صيغة «على العبيد أن...» لتأدية القوة الإرشادية للمصادر اليونانية بصورة طبيعية، وجرى تجنب كل من التلطيف التاريخي للعبودية والتعبير الذي قد يوحي بتأييدها.
