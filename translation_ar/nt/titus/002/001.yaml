  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: ar
  text: أَمَّا أَنْتَ فَتَكَلَّمْ بِمَا يَلِيقُ بِالتَّعْلِيمِ السَّلِيمِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بِالعَقِيدَةِ السَّلِيمَةِ».'
    reason: بديل معجمي؛ فقد تعني διδασκαλία التعليم أو العقيدة.
lexical_decisions:
- source_word: Σὺ δὲ
  choice: أَمَّا أَنْتَ فَـ
  rationale: الضمير اليوناني صريح ويفيد التوكيد التقابلي، وδέ تصل الكلام بما سبق مع إبراز المقابلة؛ وصيغة «أمّا أنت فـ» تنقل ذلك طبيعيًا في العربية.
- source_word: λάλει
  choice: تَكَلَّمْ
  rationale: الفعل أمر عام بالكلام والقول، واختيار «تكلّم» يحافظ على سعته ولا يضيّقه إلى التعليم الرسمي وحده.
- source_word: ἃ πρέπει
  choice: بِمَا يَلِيقُ
  rationale: تنقل العبارة معنى ما هو مناسب ومتوافق، بصياغة عربية واضحة وموجزة.
- source_word: ὑγιαινούσῃ
  choice: السَّلِيمِ
  rationale: اللفظ مستعمل مجازًا للصحة والسلامة من الفساد، و«السليم» تعبير عربي مألوف يحفظ هذه الصورة الدلالية.
- source_word: διδασκαλίᾳ
  choice: بِالتَّعْلِيمِ
  rationale: قد يدل اللفظ على فعل التعليم أو مضمونه؛ و«التعليم» يحفظ هذه السعة وهو أوضح للقارئ المعاصر من مصطلحات أكثر تخصصًا.
theological_decisions:
- issue: ترجمة τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: بِالتَّعْلِيمِ السَّلِيمِ
  alternative: بِالعَقِيدَةِ السَّلِيمَةِ
  rationale: «التعليم السليم» يحفظ إمكان دلالة διδασκαλία على التعليم أو مضمونه، وينقل استعارة الصحة من غير حصر العبارة في مصطلح عقائدي تقني، مع إثبات البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة وقورة. استُعملت «أمّا أنت فـ» لإظهار المقابلة مع المعلّمين المضلّين المذكورين قبلها، مع إبقاء الأمر عامًا كما في اليونانية.
