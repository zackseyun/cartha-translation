translation:
  language: ar
  text: غير مختلسين، بل مظهرين كل أمانة صالحة[a]، لكي يزيّنوا في كل شيء تعليم الله مخلّصنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «مظهرين كل إيمان صالح». فكلمة πίστις اليونانية كثيرًا ما تعني «الإيمان»، لكن السياق هنا يرجّح معنى الأمانة والوفاء والجدارة بالثقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νοσφιζομένους
  choice: مختلسين
  rationale: يفيد الفعل أخذ المرء لنفسه خفيةً مما يخص غيره. و«مختلسين» يلائم سياق الخدم ويحافظ على معنى الاستيلاء غير الأمين دون حصره في صورة قانونية محددة كالاختلاس المالي الرسمي.
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: مظهرين أمانةً حسنةً كاملةً
  rationale: السياق يتحدث عن السلوك الجدير بالثقة، ولذلك تؤدي «أمانة» المعنى الأخلاقي لـ πίστις. وتنقل «كاملة» قوة πᾶσαν، و«حسنة» صفة ἀγαθήν، مع إبقاء فعل الإظهار مقابل ἐνδεικνυμένους.
- source_word: κοσμῶσιν
  choice: يزيّنوا
  rationale: يحافظ هذا اللفظ على استعارة التزيين أو التجمل الواردة في اليونانية، وهي مفهومة في العربية بمعنى أن يجعل السلوك التعليم محمودًا وجذابًا.
- source_word: διδασκαλίαν
  choice: تعليم
  rationale: «تعليم» لفظ عربي واضح وشائع ينقل معنى διδασκαλία دون الإيحاء بحمولة اصطلاحية أضيق قد تحملها كلمة «عقيدة».
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: الله مخلّصنا
  rationale: ينقل تركيب الإضافة واللقب بصورة مباشرة، ويُبقي «الله» هو الموصوف هنا بأنه مخلّصنا دون إدخال تعيين آخر غير مصرح به في العبارة.
- source_word: ἐν πᾶσιν
  choice: في كل شيء
  rationale: ترجمة طبيعية تحافظ على شمول العبارة اليونانية، ويمكن أن تشمل كل جوانب السلوك المذكور.
theological_decisions:
- issue: دلالة πίστις في هذا السياق الأخلاقي
  choice: أمانة
  alternative: إيمان
  rationale: مع أن πίστις كثيرًا ما تعني «الإيمان»، فإن مقابلتها بالاختلاس وسياق علاقة الخدم بسادتهم يرجحان معنى الأمانة والوفاء والجدارة بالثقة. أُثبت البديل اللفظي في الحاشية حفاظًا على المجال الدلالي للكلمة.
- issue: مرجع لقب «مخلّصنا»
  choice: الله مخلّصنا
  alternative: فهم اللقب في ضوء استعمال «المخلّص» للمسيح في مواضع أخرى
  rationale: العبارة في هذه الآية تصف الله مباشرةً بأنه مخلّصنا؛ لذا حُفظت كما هي من غير دمجها في تصريح مسيحيّ الهوية لا تنص عليه هذه الجملة بذاتها.
translation_notes:
  register: صياغة عربية فصحى واضحة وكريمة. استُعملت البنية الحالية «غير مختلسين» للمحافظة على صيغة اسم الفاعل التابعة للسياق السابق، وأُبقيت استعارة «يزيّنوا التعليم» بدل تفسيرها تفسيرًا مباشرًا.
