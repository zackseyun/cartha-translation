source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: ar
  text: على الرجال المتقدمين في السن أن يكونوا معتدلين، وقورين، ضابطين لأنفسهم، سليمين في الإيمان[a] والمحبة والثبات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأمانة». يمكن أن تعني الكلمة اليونانية πίστις «الإيمان» أو «الأمانة» بحسب السياق.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: الرجال المتقدمين في السن
  rationale: يدل اللفظ هنا، في سياق الإرشادات لفئات الجماعة، على الرجال الأكبر سنًّا لا على شيوخ الكنيسة بوصفهم أصحاب منصب.
- source_word: νηφαλίους
  choice: معتدلين
  rationale: يشمل المعنى الصحو وضبط السلوك، ولا يحصر الوصية في الامتناع عن المسكر وحده.
- source_word: σεμνούς
  choice: وقورين
  rationale: ينقل معنى الرزانة والجدارة بالاحترام بعبارة عربية طبيعية موجزة.
- source_word: σώφρονας
  choice: ضابطين لأنفسهم
  rationale: يعبّر بوضوح عن سلامة التقدير والسيطرة المنضبطة على النفس، ويحافظ على تمييزه من الاعتدال.
- source_word: ὑγιαίνοντας
  choice: سليمين
  rationale: يحفظ استعارة الصحة في وصف رسوخ الفضائل من غير أن يبدو التعبير طبيًّا محضًا.
- source_word: τῇ πίστει
  choice: في الإيمان
  rationale: الإيمان هو المقابل الأساسي الطبيعي لـ πίστις هنا، مع إبقاء احتمال معنى الأمانة في الحاشية.
- source_word: τῇ ἀγάπῃ
  choice: في المحبة
  rationale: مقابل عربي مباشر وطبيعي لـ ἀγάπη، ويتبع تعلق أحوال المجرور بالوصف «سليمين».
- source_word: τῇ ὑπομονῇ
  choice: في الثبات
  rationale: ينقل معنى الاحتمال الراسخ والمثابرة تحت المشقة، ويناسب ثلاثية الإيمان والمحبة والثبات.
- source_word: εἶναι
  choice: أن يكونوا
  rationale: ينقل صيغة المصدر اليونانية، مع «على» لإظهار القوة الإرشادية التي يستمدها التركيب من السياق السابق.
theological_decisions:
- issue: دلالة πίστις في قائمة الفضائل
  choice: الإيمان
  alternative: الأمانة
  rationale: يمكن أن يدل اللفظ على الإيمان أو على الأمانة. تحافظ القراءة الأساسية على «الإيمان» ضمن ثلاثية الإيمان والمحبة والثبات، بينما تُذكر الدلالة الأخلاقية الممكنة في الحاشية من غير حسم الغموض الأصيل.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة، تستخدم «المتقدمين في السن» لتجنب الخلط بمنصب شيوخ الكنيسة، وتحافظ على توازي قائمة الفضائل وعلى استعارة السلامة في «سليمين».
