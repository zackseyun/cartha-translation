  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: ar
  text: لأن نعمة الله قد ظهرت، حاملةً الخلاص لجميع الناس[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويمكن ترجمة العبارة: «ظهرت مخلِّصةً جميع الناس»، أو «ظهرت لجميع الناس». فالصفة اليونانية σωτήριος («مُخلِّصة» أو «حاملة الخلاص») والعبارة «جميع الناس» تحتملان أوجهًا متقاربة في التعلق النحوي.'
    reason: lexical_alternative
  - marker: b
    text: تشير كلمة «الناس» هنا إلى البشر عمومًا، لا إلى الرجال وحدهم.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: قد ظهرت
  rationale: الفعل هنا ماضٍ يفيد الظهور أو الانكشاف؛ وتؤدي «قد ظهرت» معنى الحدث المتحقق مع بقاء أهميته في السياق.
- source_word: γὰρ
  choice: لأن
  rationale: تربط الأداة الآية بما قبلها بوصفها تعليلًا وأساسًا للوصايا السابقة.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: نعمة الله
  rationale: صياغة عربية واضحة ومألوفة تحافظ على الإضافة اليونانية وعلى دلالة النعمة بوصفها إحسان الله الفاعل.
- source_word: σωτήριος
  choice: حاملةً الخلاص
  rationale: تنقل قوة الصفة التي تصف النعمة بأنها مُخلِّصة أو جالبة للخلاص، مع تجنب صياغة قد تحسم وحدها كيفية تعلق الخلاص بكل فرد.
- source_word: πᾶσιν ἀνθρώποις
  choice: لجميع الناس
  rationale: تحافظ على شمول العبارة اليونانية، وتستعمل «الناس» للدلالة على البشر عمومًا لا على الذكور وحدهم.
theological_decisions:
- issue: نطاق πᾶσιν ἀνθρώποις وعلاقته بالخلاص
  choice: لجميع الناس
  alternative: لجميع فئات الناس؛ أو ظهرت لجميع الناس
  rationale: تحافظ الترجمة على الاتساع الصريح في اليونانية من غير أن تقيده بمعنى «كل الفئات» أو تحسم ما إذا كان المقصود كل فرد بلا استثناء وكيفية نوال الخلاص.
- issue: العلاقة النحوية بين σωτήριος وπᾶσιν ἀνθρώποις
  choice: حاملةً الخلاص لجميع الناس
  alternative: ظهرت مخلِّصةً جميع الناس؛ أو ظهرت لجميع الناس
  rationale: تتيح البنية اليونانية أكثر من وجه قريب في ربط الصفة والعبارة الداتيفية؛ اختيرت صياغة عربية طبيعية، مع إثبات البدائل في الحاشية صونًا للغموض الحقيقي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «قد ظهرت» للمحافظة على دلالة الظهور المتحقق، و«حاملةً الخلاص» بوصفها صياغة طبيعية لا تُغلق الاحتمالات النحوية أو اللاهوتية التي يحملها الأصل.
