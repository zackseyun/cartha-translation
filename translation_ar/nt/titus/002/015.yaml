  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: ar
  text: تكلَّم بهذه الأمور، وحُثَّ، ووبِّخ بكل سلطان. لا يستخفَّ بك أحد.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يحتقرْك أحد»؛ أو: «لا ينظرْ إليك أحد باستخفاف».'
    reason: بدائل معجمية للفعل περιφρονέω، الذي قد يدل على الاستخفاف أو الاحتقار أو النظر إلى شخص بدونية.
lexical_decisions:
- source_word: Ταῦτα
  choice: هذه الأمور
  rationale: اسم الإشارة المحايد الجمع يعود إلى التعليمات السابقة، و«هذه الأمور» يحفظ سعة الإحالة من غير تخصيص زائد.
- source_word: λάλει
  choice: تكلَّم
  rationale: أمر يفيد الاستمرار في الإبلاغ الشفهي، و«تكلَّم» مباشر ولا يضيّق المعنى إلى «علِّم».
- source_word: παρακάλει
  choice: شجِّع
  rationale: الفعل يحتمل التشجيع والحث؛ و«شجِّع» عربي واضح يحفظ جانبه الإيجابي إلى جانب التوبيخ، مع بقاء القوة التوجيهية مستفادة من السياق.
- source_word: ἔλεγχε
  choice: وبِّخ
  rationale: يدل هنا على كشف الخطأ ومواجهته بقصد التصحيح، و«وبِّخ» يلائم السياق الرعوي والأمري.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: بكل سلطان
  rationale: ἐπιταγή قد تعني أمرًا أو تفويضًا ذا سلطان؛ وهذه الصياغة تنقل ثقل التفويض الذي تصدر به الأفعال من غير أن تجعله سلطة ذاتية مستقلة.
- source_word: μηδείς
  choice: لا ... أحد
  rationale: ينقل صيغة النهي اليونانية بتركيب عربي فصيح وطبيعي.
- source_word: σου
  choice: بك
  rationale: يتعلق الضمير بالفعل περιφρονείτω، ويُصاغ في العربية طبيعيًا مع حرف الجر في «يستخف بك».
- source_word: περιφρονείτω
  choice: يستخفَّ
  rationale: ينقل معنى التقليل من الشأن وعدم الاعتداد بالشخص، مع إثبات بدائل أقوى في الحاشية للمحافظة على المدى الدلالي.
theological_decisions:
- issue: طبيعة السلطان في عبارة μετὰ πάσης ἐπιταγῆς
  choice: يقوم تيطس بالكلام والتشجيع والتوبيخ بكل سلطان موكول إليه في سياق التعليم الرسولي.
  alternative: أن المقصود مجرد نبرة آمرة، أو أن السلطان للرسالة وحدها دون أي صلة بدور تيطس.
  rationale: العبارة تتصل طبيعيًا بالأوامر الثلاثة وتدل على الوزن الكامل الذي يمارس به تيطس هذه المهام. وتحفظ «بكل سلطان» قوة النص من غير تحويلها إلى ادعاء بسلطة شخصية مستقلة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت أفعال أمر متوازية، ثم نهي بصيغة الجزم. وُضع مؤشر الحاشية بعد الجملة التي يشرح لفظها.
