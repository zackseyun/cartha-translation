  text: ἐπ’ ἐλπίδι ζωῆς αἰωνίου, ἣν ἐπηγγείλατο ὁ ἀψευδὴς θεὸς πρὸ χρόνων αἰωνίων
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/002.yaml
  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: ar
  text: على رجاء الحياة الأبدية، التي وعد بها الله الذي لا يكذب قبل بدء الدهور[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قبل بدء الزمن». واليونانية حرفيًا: «قبل أزمنة أزلية/دهرية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: على رجاء
  rationale: يحافظ هذا التعبير على صورة الارتكاز أو الأساس التي قد تفيدها ἐπί مع المجرور، ويلائم اتصال العبارة بما قبلها، من غير حصر العلاقة في السببية وحدها.
- source_word: ζωῆς αἰωνίου
  choice: الحياة الأبدية
  rationale: الإضافة تبين مضمون الرجاء، و«الحياة الأبدية» هي العبارة العربية الواضحة والمألوفة التي تنقل الدوام والدلالة اللاهوتية دون توسع تفسيري.
- source_word: ἣν
  choice: التي
  rationale: يعود ضمير الوصل المؤنث المفرد بصورة طبيعية إلى «الحياة الأبدية»، لا إلى «الرجاء».
- source_word: ἐπηγγείλατο
  choice: وعد بها
  rationale: ينقل الفعل الماضي معنى الوعد بوضوح، وتؤدي الباء صلة الفعل بالعائد إلى «الحياة الأبدية» في عربية طبيعية.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: الله الذي لا يكذب
  rationale: ينقل معنى الصفة ἀψευδής مباشرة من غير تقويتها إلى «الذي لا يستطيع أن يكذب»، وهو معنى أوسع مما يصرح به اللفظ.
- source_word: πρὸ χρόνων αἰωνίων
  choice: قبل بدء الدهور
  rationale: صياغة عربية طبيعية تحافظ على الإشارة إلى الدهور في الجمع وعلى القوة السابقة للتاريخ في العبارة، من غير تقرير تصور ميتافيزيقي مفصل عن الزمن.
theological_decisions:
- issue: دلالة πρὸ χρόνων αἰωνίων والوعد الإلهي
  choice: قبل بدء الدهور
  alternative: قبل بدء الزمن؛ قبل أزمنة أزلية
  rationale: تثبت العبارة أن الوعد سابق للدهور، لكنها لا تحدد لمن صدر الوعد ولا تشرح كيفية هذا السبق؛ لذلك تُترك هذه المسائل دون حسم تفسيري.
- issue: وصف الله بأنه ἀψευδής
  choice: الله الذي لا يكذب
  alternative: الله الذي لا يستطيع أن يكذب؛ الله الصادق
  rationale: الصياغة المختارة تثبت صدق الله وفق اللفظ اليوناني، ولا تستبدل الوصف بتقرير عقائدي أقوى أو أقل مباشرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. صيغت الآية بوصفها جزءًا نحويًا متصلًا بما قبلها، وحُفظت الإشارة إلى الدهور مع توضيح البديل الأكثر سلاسة في الحاشية.
