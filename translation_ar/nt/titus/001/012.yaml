  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: ar
  text: 'قال واحدٌ منهم، وهو نبيٌّ من أنبيائهم: «الكريتيون كذّابون دائمًا، وحوشٌ شريرة، بطونٌ كسولة[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: شرهون كسالى. والعبارة اليونانية حرفيًّا: «بطونٌ كسولة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: قال واحدٌ منهم
  rationale: ينقل معنى الضمير غير المحدد مع عبارة التبعيض بوضوح وطبيعية، أي شخص واحد من جماعتهم.
- source_word: ἴδιος αὐτῶν προφήτης
  choice: وهو نبيٌّ من أنبيائهم
  rationale: يُظهر أن القائل نبي ينتمي إليهم هم، ويحافظ على توكيد ἴδιος بصياغة عربية واضحة من غير الإيحاء بالضرورة بأنه نبيهم الوحيد.
- source_word: Κρῆτες
  choice: الكريتيون
  rationale: اسم النسبة العربي الواضح لسكان جزيرة كريت.
- source_word: ἀεὶ ψεῦσται
  choice: كذّابون دائمًا
  rationale: ترجمة مباشرة للمثل اليوناني، تحفظ إطلاق ἀεί وقوة وصف ψεῦσται.
- source_word: κακὰ θηρία
  choice: وحوشٌ شريرة
  rationale: تحفظ الصورة الحيوانية المجازية والقوة الأخلاقية للصفة، بدل تلطيف العبارة بتفسيرها.
- source_word: γαστέρες ἀργαί
  choice: بطونٌ كسولة
  rationale: ترجمة حرفية للصورة اليونانية المقصودة في الإهانة المثلية؛ وهي مفهومة في العربية وتحفظ مجاز الأصل بدل اختزاله في معنى الشره.
theological_decisions:
- issue: نقل الصورة النمطية القاسية عن جماعة عرقية في قول مقتبس
  choice: إبقاء القول المقتبس مباشرًا بقسوته، مع وضوح أن المتكلم يورده عن نبي من أهل كريت
  alternative: تلطيف الأوصاف أو إعادة صياغتها لتقليل حدتها
  rationale: النص اليوناني يقدّمها بوصفها مقولة مقتبسة وينسبها صراحة إلى واحد منهم؛ لذلك ينبغي حفظ حدتها وسياق الاقتباس دون تحويلها إلى تقرير تفسيري مخفف.
- issue: دلالة γαστέρες ἀργαί
  choice: بطونٌ كسولة
  alternative: شرهون كسالى
  rationale: يحفظ الاختيار الاستعارة الجسدية الغريبة في الأصل والتوتر الدلالي فيها؛ أما البديل فيفسر المقصود المحتمل ويزيل الصورة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظ إيقاع الأوصاف الثلاثة وقسوة الاقتباس، واستُعملت صياغة «نبي من أنبيائهم» لتأكيد انتمائه إليهم دون إيحاء بأنه نبيهم الوحيد.
