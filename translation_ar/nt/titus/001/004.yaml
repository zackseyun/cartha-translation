base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: ar
  text: 'إلى تيطس، ابني الحقيقي بحسب إيماننا المشترك[a]: نعمة وسلام من الله الآب، ومن المسيح يسوع[b] مخلِّصنا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إيماننا الذي نشترك فيه».'
    reason: lexical_alternative
  - marker: b
    text: «المسيح» لقب معناه «الممسوح».
    reason: alternative_reading
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: ابني الأصيل
  rationale: ينقل صورة القرابة الروحية، ويعبّر «الأصيل» عن صدق هذه البنوة وأصالتها لا عن بنوة جسدية أو شرعية نسبية.
- source_word: κατὰ κοινὴν πίστιν
  choice: بحسب إيماننا المشترك
  rationale: تحافظ «بحسب» على دلالة κατά المتعلقة بالمعيار أو العلاقة، ويبيّن «المشترك» أن الإيمان يجمع بولس وتيطس.
- source_word: πίστιν
  choice: إيماننا
  rationale: السياق يشير إلى الإيمان الذي يشترك فيه المرسِل والمخاطَب؛ وأضيف ضمير الجمع لإظهار العلاقة التي تفهم من السياق.
- source_word: χάρις καὶ εἰρήνη
  choice: نعمة وسلام
  rationale: صياغة عربية طبيعية تحافظ على عبارتي البركة في التحية الرسولية.
- source_word: θεοῦ πατρὸς
  choice: الله الآب
  rationale: يحافظ على غياب ضمير «نا» بعد «الآب» في النص اليوناني.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: «المسيح» المقابل العربي الدلالي المألوف للقب Χριστός، ويحافظ على ترتيب اللقب والاسم في اليونانية.
- source_word: σωτῆρος ἡμῶν
  choice: مخلِّصنا
  rationale: ينقل اللقب مباشرة، مع اتصاله النحوي الأقرب بالمسيح يسوع.
theological_decisions:
- issue: دلالة Χριστός في عبارة Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  alternative: يسوع المسيح، أو نقل لفظي لا يبرز معنى اللقب
  rationale: يحافظ الاختيار على ترتيب الأصل وعلى كون «المسيح» لقبًا دالًا، من غير تحويله إلى مجرد اسم.
- issue: متعلَّق عبارة σωτῆρος ἡμῶν
  choice: «مخلِّصنا» وصف للمسيح يسوع
  alternative: فهم العبارة على نحو أوسع مع الاسمين المعطوفين في مصدر النعمة والسلام
  rationale: أداة التعريف في τοῦ σωτῆρος وموقع العبارة يجعلانها بدلًا أو وصفًا للمسيح يسوع على النحو الأرجح، مع إبقاء الله الآب والمسيح يسوع مصدرين منسَّقين للبركة.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم «ابني الأصيل» بدل تعبيرات قد توحي بالبنوة الجسدية، وحُفظ إيقاع التحية الموجز مع إظهار العطف بين الله الآب والمسيح يسوع.
