  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: ar
  text: هذِهِ الشَّهَادَةُ صَحِيحَةٌ. لِهَذَا السَّبَبِ، وَبِّخْهُمْ بِصَرَامَةٍ، لِكَيْ يَكُونُوا أَصِحَّاءَ فِي الإِيمَانِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أصحّاء في إيمانهم». قد تشير العبارة اليونانية إلى أن يكون إيمانهم الشخصي سليمًا، أو إلى أن يكونوا أصحّاء في الإيمان المسيحي بوصفه منظومة معتقدات.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: الشهادة
  rationale: تنقل معنى الشهادة أو القول المشهود به عن أهل كريت في الاقتباس السابق، وتحافظ على دلالته الإثباتية.
- source_word: ἀληθής
  choice: صادقة
  rationale: صفة خبرية تفيد مطابقة الشهادة للواقع، و«صادقة» تعبير عربي طبيعي مباشر.
- source_word: δι’ ἣν αἰτίαν
  choice: لهذا السبب
  rationale: تؤدي بوضوح قوة العبارة السببية التي تستخلص الإجراء المطلوب مما سبق.
- source_word: ἔλεγχε
  choice: وبّخهم
  rationale: يحافظ فعل الأمر على معنى المواجهة بقصد كشف الخطأ وتقويمه، وهو أقوى من مجرد «صحّحهم».
- source_word: ἀποτόμως
  choice: بصرامة
  rationale: تنقل شدة أسلوب التوبيخ من غير أن تضيف معنى العقوبة أو القسوة.
- source_word: ὑγιαίνωσιν
  choice: يكونوا سليمين
  rationale: تحافظ على استعارة الصحة التي يستعملها الفعل، مع ملاءمتها للسياق التعليمي والإيماني.
- source_word: ἐν τῇ πίστει
  choice: في الإيمان
  rationale: تحتفظ بصياغة الأصل وبإمكان أن يدل الإيمان على المجال العقائدي المسيحي، مع بقاء احتمال الإيمان الشخصي موضحًا في الحاشية.
theological_decisions:
- issue: دلالة ἐν τῇ πίστει
  choice: في الإيمان
  alternative: في إيمانهم
  rationale: قد تشير العبارة في سياق الرسائل الرعوية إلى الإيمان المسيحي بوصفه مضمونًا معتقدًا، وقد تشير أيضًا إلى سلامة إيمان الأشخاص أنفسهم. لذلك تُركت العبارة الرئيسة محتملة، وأُثبت الوجه الشخصي في الحاشية من غير حسم زائد.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدمت «سليمين» للمحافظة على استعارة الصحة، ووُضع مؤشر الحاشية بعد العبارة التي يشرحها مباشرة.
