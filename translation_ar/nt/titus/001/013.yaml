  to: هذِهِ الشَّهَادَةُ صَحِيحَةٌ. لِهَذَا السَّبَبِ، وَبِّخْهُمْ بِصَرَامَةٍ، لِكَيْ يَكُونُوا أَصِحَّاءَ فِي الإِيمَانِ[a].
  rationale: 'التعديل محدود: استُبدلت «صادقة» بـ«صحيحة» بوصفها الوصف العربي الأكثر مباشرة للشهادة من حيث مطابقتها للواقع، واستُبدلت «سليمين» بـ«أصحّاء» للمحافظة على استعارة الصحة في الفعل اليوناني. كما نُقحت الحاشية أسلوبيًا مع حفظ الاحتمالين الدلاليين.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:26:42Z'
