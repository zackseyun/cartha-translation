  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: ar
  text: بولس، عبدُ الله ورسولُ يسوع المسيح، لأجل إيمان مختاري الله[a] ومعرفة الحق[b] الموافق للتقوى[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الذين اختارهم الله.'
    reason: lexical_alternative
  - marker: b
    text: 'ويجوز: «المعرفة التامة بالحق».'
    reason: lexical_alternative
  - marker: c
    text: 'ويجوز: «الحق المؤدي إلى التقوى».'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: عبد
  rationale: تنقل «عبد» معنى الانتماء التام لله والخضوع لسلطانه، وهي في العربية الكتابية والفصحى أمتن من «خادم» من غير أن تفرض معنى الرق الاجتماعي وحده.
- source_word: ἀπόστολος
  choice: رسول
  rationale: «رسول» هو المقابل العربي الراسخ لمن أُرسل بتكليف وسلطان.
- source_word: δὲ
  choice: و
  rationale: الأداة هنا للوصل والتدرج في التعريف ببولس، لا لإبراز تعارض.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ينقل اللقب Χριστός بصيغته العربية الطبيعية والراسخة.
- source_word: κατὰ
  choice: لأجل
  rationale: تفيد هنا على الأرجح وجهة رسالة بولس وغرضها بالنسبة إلى الإيمان والمعرفة، مع إبقاء احتمال المطابقة في الحاشية التفسيرية ضمنًا.
- source_word: πίστιν
  choice: إيمان
  rationale: هو المعنى الأرجح في السياق، إذ يشير إلى استجابة مختاري الله المؤمنة.
- source_word: ἐκλεκτῶν θεοῦ
  choice: مختاري الله
  rationale: صياغة موجزة وطبيعية تحفظ معنى اختيار الله من غير إدخال تصور مذهبي أضيق.
- source_word: ἐπίγνωσιν
  choice: معرفة
  rationale: «معرفة» طبيعية وكافية في المتن، أما احتمال التشديد إلى «المعرفة التامة» فمذكور في الحاشية.
- source_word: ἀληθείας
  choice: الحق
  rationale: ينقل الاسم المعرّف بوصفه الحق المعروف في مضمون البشارة، لا مجرد الصدق بالمفهوم المجرد.
- source_word: τῆς κατ’ εὐσέβειαν
  choice: الموافق للتقوى
  rationale: يحفظ علاقة κατά بالحق من غير حصرها في السببية؛ واحتمال أن يكون المعنى «المؤدي إلى التقوى» مذكور في الحاشية.
- source_word: εὐσέβειαν
  choice: التقوى
  rationale: لفظ عربي واضح وراسخ يدل على حياة الورع والإخلاص لله.
theological_decisions:
- issue: دلالة ἐκλεκτῶν θεοῦ
  choice: مختاري الله
  alternative: الذين اختارهم الله
  rationale: يحفظ النص حقيقة الاختيار الإلهي من غير أن يحدد نظامًا لاهوتيًا يتجاوز العبارة اليونانية.
- issue: علاقة κατὰ بإيمان المختارين ومعرفة الحق
  choice: لأجل إيمان مختاري الله ومعرفة الحق
  alternative: وفقًا لإيمان مختاري الله ومعرفة الحق
  rationale: التركيب اليوناني موجز ويحتمل المرجع أو المعيار أو الغاية. اختيرت الوجهة الغائية لأنها تلائم وصف رسالة بولس، من غير الادعاء بأن الاحتمال الآخر ممتنع.
- issue: علاقة الحق بالتقوى في τῆς κατ’ εὐσέβειαν
  choice: الحق الموافق للتقوى
  alternative: الحق المؤدي إلى التقوى
  rationale: الصياغة المختارة لا تحسم العلاقة على أنها سببية، وتحفظ التوتر بين موافقة الحق للتقوى وإفضائه إليها.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة رسائلية رصينة. استُعملت «عبد» و«رسول» و«المسيح» و«التقوى» لرسوخها ودقتها، مع تجنب التراكيب القديمة غير الضرورية. وُضعت جميع علامات الحواشي في مواضعها من المتن.
