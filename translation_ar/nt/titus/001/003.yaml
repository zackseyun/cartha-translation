  rationale: صُححت صيغة «ائتُمنتُ» لتطابق المبني للمجهول في اليونانية، واستُبدل التعبير الحرفي الأقل سلاسة عن الأزمنة بعبارة عربية واضحة تنقل دلالة الأزمنة التي عيّنها الله. ولم يُغيَّر ترتيب المعنى ولا مرجع الموصول الراجح، مع الإبقاء على القراءة البديلة في الحاشية.
