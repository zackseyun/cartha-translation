  source_fidelity: 'المعنى العام مطابق للنص اليوناني: الله هو الفاعل المفهوم، وقد أظهر كلمته في الأزمنة التي تخصّه/عيّنها، من خلال الكرازة التي اؤتمن عليها بولس، بحسب أمر الله مخلّصنا. لكن الفعل العربي في «اؤتمنت عليها» يحتاج إلى تصحيح صيغته الإملائية والصرفية لبيان المبني للمجهول والمتكلم.'
