  text: لكنه في الأوقات التي عيّنها أظهر كلمته من خلال الكرازة التي ائتُمنتُ عليها[a]، بحسب أمر الله مخلّصنا.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة على أن الموصول يعود إلى «كلمته»: «كلمته... التي ائتُمنتُ عليها».'
    reason: alternative_reading
  - marker: b
    text: يمكن ترجمة «الكرازة» أيضًا بـ«المناداة» أو «التبشير»؛ فاللفظ اليوناني قد يدل على فعل المناداة أو على الرسالة المُنادى بها.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: أظهر
  rationale: ينقل معنى إظهار ما كان غير معلن، ويحافظ على كون الله هو الفاعل المفهوم من السياق السابق.
- source_word: καιροῖς ἰδίοις
  choice: في أوقاته الخاصة
  rationale: يحفظ حرف الجر وصيغة الجمع وقوة ضمير الملكية في ἰδίοις، مع دلالة السياق على الأوقات التي عيّنها الله.
- source_word: τὸν λόγον αὐτοῦ
  choice: كلمته
  rationale: يحافظ على المقابل المألوف لـ λόγος، والمقصود هنا ما أعلنه الله من رسالة.
- source_word: ἐν κηρύγματι
  choice: بواسطة الكرازة
  rationale: يفيد الوسيلة، وتبقي «الكرازة» المجال الدلالي مفتوحًا نسبيًا بين فعل المناداة ومضمونها.
- source_word: ὃ ... ἐπιστεύθην ἐγώ
  choice: التي اؤتمنت عليها
  rationale: يُحمل الضمير الموصول المحايد في القراءة الأرجح على κήρυγμα، وتؤدي صيغة المبني للمجهول معنى إسناد أمانة إلى بولس لا معنى الإيمان.
- source_word: κατ’ ἐπιταγὴν
  choice: بحسب أمر
  rationale: تعبر عن موافقة التكليف للأمر السلطاني الصادر من الله.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: الله مخلّصنا
  rationale: تركيب عربي طبيعي يحفظ وصف الله بأنه مخلّصنا.
theological_decisions:
- issue: فاعل ἐφανέρωσεν ودلالة الملكية في καιροῖς ἰδίοις
  choice: 'الله هو الفاعل المفهوم: «في أوقاته الخاصة أظهر»'
  alternative: 'صياغة غير شخصية: «في الأوقات المعيّنة أُظهرت»'
  rationale: السياق السابق يجعل الله، الذي وعد، هو الذي أظهر كلمته، كما أن الصياغة المختارة تحفظ ضمير الملكية.
- issue: مرجع الضمير الموصول ὃ
  choice: يرجع إلى «الكرازة»
  alternative: 'يرجع إلى «كلمته»: «كلمته... التي اؤتمنت عليها»'
  rationale: κήρυγμα هو السابق الأقرب، وهو محايد مفرد كالموصول، مع بقاء احتمال التعلق بـ«كلمته» قائمًا بسبب تقارب المعنى والتركيب.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «الكرازة» لدقتها وشيوعها في السياق الكتابي، مع شرح بدائلها في الحاشية. حُفظ التركيب «في أوقاته الخاصة» لصون الغموض والدلالة الملكية في الأصل.
