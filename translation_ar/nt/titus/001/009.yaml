  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: ar
  text: متمسِّكًا بالقول الموثوق به، الموافق للتعليم[a]، لكي يكون قادرًا على أن يحثّ بالتعليم السليم، وأن يوبِّخ[b] الذين يناقضون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «متمسِّكًا بالقول الأمين بحسب التعليم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يدحض الذين يناقضون». فالفعل اليوناني قد يفيد إظهار خطأ شخص أو إثبات خطئه، كما قد يفيد توبيخه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: متمسِّكًا
  rationale: يفيد الفعل ملازمة الشيء بثبات والتشبث به، و«متمسِّكًا» تعبير عربي طبيعي يحفظ قوة المعنى في سياق مؤهلات الشيخ.
- source_word: πιστοῦ λόγου
  choice: بالكلمة الجديرة بالثقة
  rationale: المقصود على الأرجح كلمة أو رسالة موثوق بها، لا كلمة «مؤمنة». ويحفظ لفظ «الكلمة» مقابلة λόγος، بينما يوضح الوصف معنى πιστός.
- source_word: κατὰ τὴν διδαχήν
  choice: وفقًا للتعليم
  rationale: تفيد κατά مع النصب المطابقة والاتفاق. والتعريف في «التعليم» يشير إلى تعليم معروف، من غير إدخال مصطلحات عقائدية لاحقة.
- source_word: παρακαλεῖν
  choice: أن يحثّ
  rationale: يمكن أن يعني الفعل التشجيع أو الحث أو الوعظ. و«يحثّ» يحفظ هنا قوة التوجيه الإيجابي في مقابل توبيخ المعارضين، بلغة عربية واضحة.
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: بالتعليم الصحيح
  rationale: يستعمل ὑγιαίνω مجازيًا بمعنى السليم أو الصحيح. و«التعليم الصحيح» واضح ومعاصر، ويحمل معنى سلامة التعليم من غير اصطلاح كنسي تقني زائد.
- source_word: ἀντιλέγοντας
  choice: الذين يناقضونه
  rationale: يشير اسم الفاعل إلى من يتكلمون ضد الكلمة أو التعليم. والضمير يبيّن المرجع المفهوم من السياق من غير حصره في صياغة أطول.
- source_word: ἐλέγχειν
  choice: أن يوبِّخ
  rationale: يشمل الفعل كشف الخطأ وإثباته والتصحيح أو التوبيخ. ويؤدي «يوبِّخ» القوة الرعوية التصحيحية، مع حفظ معنى «يفحم/يدحض» في الحاشية.
- source_word: δυνατὸς ᾖ
  choice: يكون قادرًا
  rationale: تعبّر العبارة بعد ἵνα عن الغاية والقدرة، وهذه الصياغة عربية طبيعية ومباشرة.
theological_decisions:
- issue: مرجع «التعليم» و«الكلمة الجديرة بالثقة»
  choice: تشير العبارة إلى التعليم المسيحي المعترف به والمسلَّم لقادة الكنيسة، مع إبقاء النص عامًا من غير إدخال تصنيفات عقائدية متأخرة.
  alternative: أن تكون إشارة أعم إلى إرشاد أخلاقي سليم.
  rationale: أداة التعريف مع διδαχή واستعمال πιστοῦ λόγου في الرسائل الرعوية يرجحان الإشارة إلى تعليم مسيحي ثابت، لكن الترجمة لا تزيد على ما يقتضيه النص.
- issue: دلالة ἐλέγχειν تجاه المناقضين
  choice: «يوبِّخ» لإبراز المواجهة التصحيحية.
  alternative: «يدحض» أو «يثبت خطأ».
  rationale: يجمع السياق بين الحث الإيجابي ومواجهة الاعتراض. ويحفظ المتن القوة الرعوية التصحيحية، بينما تبيّن الحاشية إمكان معنى الدحض وإثبات الخطأ.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. استُعملت «يحثّ» بدل لفظ وعظي أكثر اصطلاحية، و«التعليم الصحيح» بدل تركيب حرفي مثل «التعليم المتعافي»، مع الحفاظ على التوازي بين الحث والتوبيخ. وُضعت علامتا الحاشيتين عند العبارتين اللتين تخصهما كل حاشية.
