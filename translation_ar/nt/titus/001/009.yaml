  source_fidelity: 'المعنى العام أمين للنص اليوناني: التمسك الثابت بالقول الموثوق الموافق للتعليم، والقدرة على الحث بالتعليم السليم وتوبيخ المعارضين. لكن موضع علامة الحاشية (ب) في المسودة لا يطابق الكلمة التي تشرحها الحاشية؛ إذ إن البديل «يدحض» يخص ἐλέγχειν («يوبِّخ») لا ἀντιλέγοντας («يناقضون»). كما أن صياغة الحاشية العربية تحتاج إلى إزالة التباس «إثباته».'
