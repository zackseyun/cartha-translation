translation:
  language: ar
  text: ولا يلتفتوا إلى خرافات يهودية وأوامر أناس ينصرفون عن الحق.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا يكرّسوا اهتمامهم لخرافات يهودية وأوامر أناس ينصرفون عن الحق».'
    reason: بديل معجمي لـπροσέχοντες يبرز معنى توجيه الاهتمام أو تكريسه، مع الحفاظ على ارتباط وصف «ينصرفون عن الحق» بـ«أناس».
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: ولا يلتفتوا إلى
  rationale: ينقل معنى توجيه الانتباه والاهتمام إلى شيء، ويصل طبيعيًا في العربية بما قبله بوصفه استمرارًا للحث.
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: خرافات يهودية
  rationale: «خرافات» تعبير عربي واضح عن القصص المختلقة أو الأساطير، و«يهودية» تحفظ وصف أصلها أو طابعها دون زيادة تفسيرية.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: وصايا أناس
  rationale: تحفظ معنى الأوامر ذات المصدر البشري، كما تتيح للعبارة الوصفية التالية أن تتصل طبيعيًا بـ«أناس».
- source_word: ἀποστρεφομένων
  choice: يرتدّون عن
  rationale: يحفظ صورة الانصراف عن الحق وقوة الفعل، بدل اختزالها في مجرد الرفض؛ والمضارع يلائم دلالة اسم الفاعل الحاضر.
- source_word: τὴν ἀλήθειαν
  choice: الحق
  rationale: مقابل عربي مألوف ودقيق لـἀλήθεια في هذا السياق، من غير تخصيصه صراحةً بالإنجيل بما يتجاوز النص.
theological_decisions:
- issue: متعلَّق اسم الفاعل ἀποστρεφομένων
  choice: 'ربطه بـ«أناس»: «وصايا أناس يرتدّون عن الحق»'
  alternative: فهمه على نحو أوسع بحيث ترتبط الخرافات والوصايا كلتاهما بمن يرتدّون عن الحق
  rationale: المطابقة في حالة الجر والجمع، مع قرب ἀνθρώπων، تجعل وصف «أناس» هو الارتباط النحوي الأقرب والأرجح، من غير إدخال حكم عقائدي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «خرافات» بدل اللفظ الأثقل «أساطير»، و«أناس» لإبراز الصلة النحوية بالوصف اللاحق. أُبقي «الحق» عامًا كما في اليونانية.
