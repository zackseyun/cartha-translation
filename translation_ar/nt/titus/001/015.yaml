review_pass:
  verdict: revise
  source_fidelity: المعنى العام مطابق للنص اليوناني، مع الحفاظ على تقابل الطهارة والتدنّس. لكن «المدنَّسين» أدق من «النجسين» لـμεμιαμμένοις، إذ تدل الصيغة التامة على أناس وقع عليهم التدنيس وصاروا في حالته، لا على وصف «النجاسة» بوصفه تصنيفًا ثابتًا. كما أن الفعل المثنّى يطابق «عقلهم وضميرهم» ويجسّد إسناد التدنيس إليهما معًا.
  naturalness: 'الصياغة المنقحة فصيحة وطبيعية: «بل إن عقلهم وضميرهم قد تدنسا». وهي أسلس من تأخير «كلاهما» بعد فعل مفرد، وتُبقي تأكيد اقتران العقل والضمير دون تكلّف.'
  terminology: «طاهر» مناسب لـκαθαρός ويحفظ البعدين الشعائري والأخلاقي. و«غير المؤمنين» مناسب لـἀπίστοις في السياق. نُقحت الحاشية كي تقتصر على لفظ καθαρός ومشتقاته، لأن «المدنَّسين» يترجم لفظًا يونانيًا آخر (μεμιαμμένοις) ولا يصح عرضه بوصفه بديلًا للفظ اليوناني نفسه.
  issues:
  - severity: medium
    issue: اختيار «النجسين» لـμεμιαμμένοις
    rationale: «النجسين» مفهوم، لكنه قد يوحي بوصف جوهري أو بتصنيف طقسي، بينما اسم المفعول التام اليوناني يشير بوضوح إلى حالة تدنّس ناشئة عن فعل سابق. «المدنَّسين» أقرب إلى البنية والمعنى.
  - severity: medium
    issue: عدم اتساق الفعل مع «عقلهم وضميرهم»
    rationale: «قد تنجس» مفرد، في حين أن المعطوفين هما فاعل العبارة. «قد تدنسا» يطابقهما ويجعل التأكيد اليوناني على كليهما واضحًا.
  - severity: medium
    issue: اتساع الحاشية لتشمل «النجسين/المدنَّسين»
    rationale: الحاشية الإنجليزية تتناول καθαρός في مواضعه داخل الآية فقط. أما «المدنَّسين» فيترجم μεμιαμμένοις، وهو لفظ مختلف؛ لذا ينبغي فصل الحاشية عن هذا اللفظ وعدم الإيحاء بأنها بديل معجمي له.
