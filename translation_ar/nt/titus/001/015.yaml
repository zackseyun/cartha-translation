  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: ar
  text: كُلُّ شَيْءٍ طَاهِرٌ[a] لِلطَّاهِرِينَ؛ أَمَّا لِلْمُدَنَّسِينَ وَغَيْرِ الْمُؤْمِنِينَ، فَلَا شَيْءَ طَاهِرٌ، بَلْ إِنَّ عَقْلَهُمْ وَضَمِيرَهُمْ قَدْ تَدَنَّسَا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة ألفاظ «طاهر» في الآية بـ«نقي»؛ فاللفظ اليوناني يحتمل دلالات شعائرية وأخلاقية معًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: كُلُّ شَيْءٍ
  rationale: ينقل شمول الجمع المحايد اليوناني بصياغة عربية طبيعية، ويحافظ على الطابع الجامع للمقولة.
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: طَاهِرٌ / الطَّاهِرِينَ
  rationale: لفظ «طاهر» يحتمل في العربية الدلالتين الشعائرية والأخلاقية، ويحافظ على تكرار الجذر في العبارة اليونانية.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: أَمَّا لِلنَّجِسِينَ
  rationale: يعبّر «النجسين» عن حالة التلوث القائمة التي يدل عليها اسم الفاعل التام، ويقابل «الطاهرين» بوضوح.
- source_word: ἀπίστοις
  choice: غَيْرِ الْمُؤْمِنِينَ
  rationale: السياق يرجّح معنى عدم الإيمان، وهذه الصياغة أوضح من «غير الأمناء» التي قد توحي بعدم الوفاء.
- source_word: οὐδὲν καθαρόν
  choice: فَلَا شَيْءَ طَاهِرٌ
  rationale: يحافظ على بنية الإسناد وعلى التوازي اللفظي مع صدر الآية.
- source_word: ἀλλὰ
  choice: بَلْ
  rationale: تفيد الإضراب الانتقالي القوي، وتنقل التركيز من الأشياء الخارجية إلى فساد الباطن.
- source_word: μεμίανται
  choice: قَدْ تَنَجَّسَ
  rationale: تنقل «قد» مع الفعل الماضي أثر صيغة التام اليونانية، أي حالة حاضرة ناتجة عن تنجس سابق.
- source_word: νοῦς
  choice: عَقْل
  rationale: المقابل العربي الطبيعي لملكة التفكير والإدراك في هذا السياق.
- source_word: συνείδησις
  choice: ضَمِير
  rationale: المقابل الاصطلاحي المألوف للوعي الأخلاقي والحكم الباطني على الأفعال.
- source_word: καὶ ... καὶ
  choice: كِلَاهُمَا
  rationale: يبرز شمول التنجس للعقل والضمير معًا بصياغة عربية سلسة.
theological_decisions:
- issue: نطاق ألفاظ الطهارة والنجاسة
  choice: استُعمل «طاهر» ومقابله «نجس» مع إبقاء الدلالة الشعائرية والأخلاقية مفتوحة.
  alternative: استعمال «نظيف/متسخ»، بما قد يجعل المعنى ماديًا، أو تفسير العبارة صراحةً بالطهارة الأخلاقية وحدها.
  rationale: السياق يتصل بتعاليم الطهارة والوصايا اليهودية، لكنه يربط القضية أيضًا بالعقل والضمير؛ لذلك لا ينبغي حصر المعنى في الطقوس أو الأخلاق وحدهما.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وذات نبرة كتابية رصينة. حوفظ على التوازي بين «طاهر» و«الطاهرين» وعلى المقابلة مع «النجسين»، ووُضع رمز الحاشية بعد الآية لأنه يعلّق على ألفاظ الطهارة في مجملها.
