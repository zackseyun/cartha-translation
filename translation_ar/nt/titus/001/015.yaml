- from: كُلُّ شَيْءٍ طَاهِرٌ لِلطَّاهِرِينَ؛ أَمَّا لِلنَّجِسِينَ وَغَيْرِ الْمُؤْمِنِينَ، فَلَا شَيْءَ طَاهِرٌ، بَلْ قَدْ تَنَجَّسَ عَقْلُهُمْ وَضَمِيرُهُمْ كِلَاهُمَا.[a]
  to: كُلُّ شَيْءٍ طَاهِرٌ[a] لِلطَّاهِرِينَ؛ أَمَّا لِلْمُدَنَّسِينَ وَغَيْرِ الْمُؤْمِنِينَ، فَلَا شَيْءَ طَاهِرٌ، بَلْ إِنَّ عَقْلَهُمْ وَضَمِيرَهُمْ قَدْ تَدَنَّسَا.
  rationale: تُصحَّح الترجمة لتجسيد دلالة اسم المفعول التام في «المدنَّسين»، ولمطابقة الفعل المثنّى للعقل والضمير. كما تُضبط الحاشية لتعلّقها على καθαρός/«طاهر» في جميع مواضعه، محافظةً على نطاق الحاشية الإنجليزية وعلى الدقة المعجمية.
