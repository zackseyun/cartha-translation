source:
  edition: SBLGNT
  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: ar
  text: لأن كثيرين متمردون، يتكلمون بكلام باطل ويضلّلون العقول، ولا سيما الذين من أهل الختان[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المنتمون إلى جماعة الختان»، أو «الذين من الختان». يُرجَّح أن العبارة تشير إلى معارضين يهود أو متهودين، لكن التعبير اليوناني أقل صراحة.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: لأن
  rationale: تفيد تعليل التوجيه السابق وتحافظ على الصلة المنطقية بالسياق.
- source_word: πολλοὶ
  choice: كثيرين
  rationale: تنقل الدلالة الكمية مباشرة، وجاءت منصوبة لأنها اسم «لأن».
- source_word: ἀνυπότακτοι
  choice: متمردون
  rationale: تدل على من يرفضون الخضوع للسلطة الواجبة، و«متمردون» واضحة وطبيعية في العربية المعاصرة.
- source_word: ματαιολόγοι
  choice: يتكلمون بكلام باطل
  rationale: تنقل معنى الكلام الفارغ أو العقيم بصياغة عربية مفهومة، مع إبقاء الحكم السلبي في اللفظ اليوناني.
- source_word: φρεναπάται
  choice: يضلّلون العقول
  rationale: تحفظ الإشارة الاشتقاقية إلى خداع الذهن، وهي أوضح من ترجمة الاسم المركب ترجمة حرفية ثقيلة.
- source_word: μάλιστα
  choice: ولا سيما
  rationale: تخص فئة داخل المجموعة العامة بمزيد من التركيز.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: الذين من أهل الختان
  rationale: صياغة عربية طبيعية وقريبة من العبارة اليونانية المقتضبة، من غير إضافة «حزب» أو التصريح بأن المقصود هم اليهود.
theological_decisions:
- issue: تحديد المقصود بعبارة «الذين من أهل الختان»
  choice: الإبقاء على العبارة المقتضبة «الذين من أهل الختان»
  alternative: المنتمون إلى جماعة الختان؛ أو الذين من الجماعة اليهودية
  rationale: قد تشير العبارة إلى معارضين يهود أو متهودين، لكن اليونانية لا تصرّح بهوية أضيق ولا تستعمل لفظ «حزب» أو «جماعة»، لذلك تُحفظ درجة الغموض الأصلية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت أفعال مفهومة بدل الأسماء المركبة الثقيلة في «المتكلمين بالباطل» و«خادعي العقول»، مع الحفاظ على التوازي الدلالي والنبرة التحذيرية.
