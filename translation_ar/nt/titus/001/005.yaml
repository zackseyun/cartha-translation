  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: ar
  text: لهذا تركتُك في كريت لكي تُتمّ ترتيب ما كان لا يزال ناقصًا[a]، وتعيّن شيوخًا في كل مدينة[b]، كما أوصيتُك[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما بقي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مدينةً فمدينة».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «كما أمرتُك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: لهذا
  rationale: 'تعبير سببي عربي طبيعي وموجز يحفظ معنى العبارة اليونانية: «لهذا السبب».'
- source_word: ἀπέλιπόν
  choice: تركتُك
  rationale: ينقل الفعل الماضي بوضوح، والسياق يبيّن أن بولس أبقى تيطس في كريت لمهمة محددة.
- source_word: ἐν Κρήτῃ
  choice: في كريت
  rationale: ترجمة مكانية مباشرة مع اعتماد الاسم العربي الشائع للجزيرة.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية في العبارة اليونانية بصياغة عربية واضحة.
- source_word: τὰ λείποντα
  choice: ما بقي غير مكتمل
  rationale: يجمع بين معنى ما بقي ومعنى النقص أو عدم الاكتمال، من غير حصر العبارة في مجرد الأشياء المتبقية.
- source_word: ἐπιδιορθώσῃ
  choice: ترتّب
  rationale: يدل الفعل على إصلاح الأمور المتبقية وتقويمها وتنظيمها؛ و«ترتّب» واضحة في السياق، مع بيان جانب عدم الاكتمال في مفعولها.
- source_word: καταστήσῃς
  choice: تعيّن
  rationale: المراد تنصيب أشخاص في مسؤولية معترف بها، و«تعيّن» أدق تعبير عربي مألوف هنا.
- source_word: κατὰ πόλιν
  choice: في كل مدينة
  rationale: ينقل الاستعمال التوزيعي لحرف الجر κατά مع الاسم المفرد بوضوح.
- source_word: πρεσβυτέρους
  choice: شيوخًا
  rationale: يدل السياق على قادة معترف بهم في الكنائس، لا على كبار السن عمومًا؛ و«شيوخ» يحفظ المصطلح من غير فرض بنية طائفية لاحقة.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: كما أوصيتُك
  rationale: ينقل معنى التوجيه السلطوي بصياغة عربية طبيعية؛ ويمكن أن يحمل الفعل قوة الأمر، وهو ما توضحه الحاشية.
theological_decisions:
- issue: دلالة πρεσβυτέρους على منصب كنسي
  choice: شيوخًا
  alternative: قساوسة؛ كبار السن
  rationale: السياق يتناول قيادة كنسية معترفًا بها، لكن «شيوخًا» لا يستبق الخلافات اللاحقة بشأن نظام الكنيسة ولا يحوّل اللفظ إلى مجرد وصف للعمر.
- issue: قوة διεταξάμην
  choice: كما أوصيتُك
  alternative: كما أمرتُك؛ كما وجّهتُك
  rationale: «أوصيتك» تفيد تكليفًا ذا سلطة من غير مبالغة في حدّة النبرة، مع إبقاء «أمرتك» احتمالًا صريحًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. روعي ترتيب الجملة اليونانية بقدر ما تسمح به السلاسة العربية، وحُفظت دلالة الغاية والتوزيع، مع تجنّب تحميل مصطلح «الشيوخ» بنية كنسية طائفية لاحقة.
