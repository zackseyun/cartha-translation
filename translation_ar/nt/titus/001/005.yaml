  to: لهذا تركتُك في كريت لكي تُتمّ ترتيب ما كان لا يزال ناقصًا[a]، وتعيّن شيوخًا في كل مدينة[b]، كما أوصيتُك[c].
  rationale: عُدِّلت العبارة الخاصة بما بقي إلى صياغة عربية أكثر سلاسة، تُبرز أن المهمة هي إتمام ترتيب ما ظل ناقصًا، وتحفظ العلاقة بين τὰ λείποντα وἐπιδιορθώσῃ. كما نُقلت الحاشية (أ) إلى البديل «ما بقي»، لأنه البديل الذي يقابل جانب البقاء في العبارة اليونانية بعد أن صار المتن يبرز جانب النقص المستمر. ولم تُغيَّر المصطلحات الكنسية أو درجة سلطة التوجيه.
