  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: ar
  text: لأنه يجب أن يكون المشرف[a] بلا موضع للوم، بصفته وكيلًا لله، غير مستبدّ برأيه، ولا سريع الغضب، ولا مولعًا بالخمر، ولا عنيفًا، ولا طامعًا في مكسب مُشين[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأسقف». يدل اللفظ اليوناني على من يتولى الإشراف؛ واختيار «المشرف» يتجنب تحميل النص دلالات الرتبة الكنسية التي ارتبطت لاحقًا بكلمة «الأسقف».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «طامعًا في مكسب غير نزيه». يشدد اللفظ اليوناني على طلب الربح بطريقة مخزية أخلاقيًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: يجب
  rationale: ينقل بوضوح معنى الضرورة والإلزام في العربية المعاصرة.
- source_word: γὰρ
  choice: لأنه
  rationale: يحفظ الصلة التفسيرية بما سبق، ويأتي طبيعيًا في سياق تعداد مؤهلات القادة.
- source_word: ἐπίσκοπον
  choice: المشرف
  rationale: يعكس المعنى الوظيفي، أي من يتولى الإشراف، من غير استيراد دلالات كنسية هرمية تطورت لاحقًا.
- source_word: ἀνέγκλητον
  choice: بلا موضع للوم
  rationale: يدل على ألا تكون عليه تهمة صحيحة أو مطعن معتبر، من غير الإيحاء بعصمة مطلقة.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: بصفته وكيلًا لله
  rationale: يحفظ معنى الإدارة الموكلة إليه ومسؤوليته أمام الله؛ و«بصفته» توضح دلالة ὡς الوظيفية.
- source_word: αὐθάδη
  choice: مستبدّ برأيه
  rationale: يجمع معنى الاعتداد المتعنت بالنفس والإصرار على الإرادة الذاتية، وهو أوضح من نقل حرفي مثل «ذاتيّ الإرادة».
- source_word: ὀργίλον
  choice: سريع الغضب
  rationale: يصف نزعة متكررة إلى الغضب، لا واقعة غضب منفردة.
- source_word: πάροινον
  choice: مولعًا بالخمر
  rationale: ينقل التعلق بالخمر والإفراط المرتبط بها من غير حصر اللفظ في وصف «سكّير» الأشد تحديدًا.
- source_word: πλήκτην
  choice: عنيفًا
  rationale: يعبر بوضوح عن الميل إلى الضرب والاعتداء في عربية حديثة طبيعية.
- source_word: αἰσχροκερδῆ
  choice: طامعًا في مكسب مُشين
  rationale: يحفظ عنصر الرغبة الجشعة والطابع الأخلاقي المخزي للمكسب، وهو أوسع من المكسب غير القانوني أو القائم على الخداع وحده.
theological_decisions:
- issue: نقل ἐπίσκοπος في سياق خدمة الجماعة
  choice: المشرف
  alternative: الأسقف
  rationale: «المشرف» أقرب إلى الدلالة الأصلية الوظيفية، ولا يفرض على النص بنية كنسية أو رتبة ذات دلالات تاريخية لاحقة.
