base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: ar
  text: يزعمون أنهم يعرفون الله[a]، لكنهم ينكرونه بأعمالهم[b]، إذ هم مَمقوتون وعصاة، وغير صالحين لكل عمل صالح[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُقِرّون بأنهم يعرفون الله».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ينكرونه بأفعالهم».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «غير مؤهلين لكل عمل صالح»، أو «مرفوضين بالنسبة إلى كل عمل صالح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογοῦσιν
  choice: يزعمون
  rationale: يفيد هنا إعلان دعوى باللسان تقابلها الأعمال، من غير افتراض صدقها؛ وهو طبيعي وواضح في العربية المعاصرة.
- source_word: εἰδέναι
  choice: أنهم يعرفون
  rationale: ينقل صيغة المصدر المتممة للفعل نقلاً مباشرًا، ويحفظ معنى المعرفة التي يدّعونها.
- source_word: θεὸν
  choice: الله
  rationale: مفعول المعرفة المزعومة، وهو المقابل العربي المباشر المعتاد.
- source_word: τοῖς δὲ ἔργοις
  choice: لكنهم ... بأعمالهم
  rationale: تفيد الباء الوسيلة أو المظهر الذي يتحقق به الإنكار، وتحفظ المقابلة التي تؤديها δέ.
- source_word: ἀρνοῦνται
  choice: ينكرونه
  rationale: يحمل مفعوله من «الله» في الجملة السابقة، ويعبّر مباشرة عن التعارض بين الادعاء اللفظي والسلوك.
- source_word: βδελυκτοὶ
  choice: بغيضون
  rationale: ينقل شدة النفور الأخلاقي بعبارة عربية فصيحة مفهومة، من غير اللجوء إلى لفظ مهجور.
- source_word: ἀπειθεῖς
  choice: عصاة
  rationale: يلائم السياق الأخلاقي، إذ يدل على رفض الطاعة لا على مجرد عدم الاقتناع.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: لأي عمل صالح
  rationale: تعبير عربي طبيعي عن الصلاح أو الأهلية بالنسبة إلى العمل الصالح؛ وتفيد «أي» هنا الشمول في سياق النفي.
- source_word: ἀδόκιμοι
  choice: غير صالحين
  rationale: يدل على أنهم لم يجتازوا معيار القبول أو الأهلية، مع إبقاء العبارة واضحة وغير تقنية.
theological_decisions:
- issue: العلاقة بين ادعاء معرفة الله وإنكاره عمليًا
  choice: يحمل «ينكرونه» مفعوله من «الله»، فتكون أعمالهم إنكارًا عمليًا له مع أنهم يزعمون معرفته.
  alternative: قد يُفهم الإنكار على أنه رفض لحق الله أو تعليمه بوجه عام.
  rationale: ذكر «الله» صريح في صدر الجملة، والأقرب نحويًا ودلاليًا حمله مفعولًا مفهومًا لفعل الإنكار أيضًا، من غير توسيع المعنى إلى تقرير عقائدي غير مصرّح به.
- issue: دلالة ἀδόκιμοι
  choice: غير صالحين لأي عمل صالح
  alternative: مرفوضون أو غير مؤهلين لكل عمل صالح
  rationale: يحفظ الاختيار معنى الإخفاق في معيار الأهلية أو القبول، من غير حسم ما إذا كان التشديد على عدم النفع أو عدم التأهل الرسمي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «يزعمون» لإبراز التباين السياقي بين القول والعمل، و«عصاة» للإيجاز والقوة، مع تجنب الألفاظ الطائفية أو التقنية.
