translation:
  language: ar
  text: بل يكون مُرحِّبًا بالغرباء، محبًّا للخير، متعقّلًا، عادلًا، تقيًّا، ضابطًا لنفسه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تستخدم اليونانية هنا فضيلتين متقاربتين: «متعقّلًا» (σώφρονα)، أي سليم التفكير معتدلًا، و«ضابطًا لنفسه» (ἐγκρατῆ)، أي مسيطرًا على رغباته ودوافعه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد المقابلة مع الصفات السلبية الواردة في الآية السابقة، و«بل» طبيعية في الانتقال إلى الصفات المطلوبة.
- source_word: φιλόξενον
  choice: مُضيفًا للغرباء
  rationale: ينقل معنى محبة الغريب والترحيب به، وهو أدق من لفظ قد يُفهم على أنه مجرد إكرام الضيف المعروف.
- source_word: φιλάγαθον
  choice: محبًّا للخير
  rationale: يحفظ تركيب اللفظة الدال على محبة ما هو خير بصياغة عربية واضحة وموجزة.
- source_word: σώφρονα
  choice: رزينًا
  rationale: يدل على سلامة التفكير والاعتدال والتعقل، ويُبقيه متميزًا من ضبط النفس المذكور في آخر القائمة.
- source_word: δίκαιον
  choice: عادلًا
  rationale: ينقل الاستقامة والعدل في السلوك، مع بقاء إمكان معنى «بارًّا» بحسب السياق.
- source_word: ὅσιον
  choice: تقيًّا
  rationale: يعبر عن الورع والإخلاص لما هو مقدس، وهو أنسب هنا من لفظ «قدوس» الذي قد يحمل في العربية دلالة أقوى أو أكثر تخصيصًا.
- source_word: ἐγκρατῆ
  choice: ضابطًا لنفسه
  rationale: يبرز التسلط على الرغبات والدوافع، ويحفظ الفرق بينه وبين σώφρονα.
theological_decisions:
- issue: التمييز بين الفضيلتين σώφρονα وἐγκρατῆ
  choice: ترجمة الأولى «رزينًا» والثانية «ضابطًا لنفسه»
  alternative: ترجمة الأولى «متعففًا» أو «ضابطًا لنفسه»، والثانية «منضبطًا»
  rationale: اللفظان متقاربان لكن غير متطابقين؛ الأول يركز على الرزانة وسلامة التقدير والاعتدال، والثاني على السيطرة الفعلية على النفس والرغبات. تفصل الصياغة بينهما دون تقرير تمييز لاهوتي زائد.
- issue: دلالة ὅσιον
  choice: تقيًّا
  alternative: قدوسًا أو ورعًا
  rationale: «تقيًّا» يحفظ معنى التعبد والورع الملائم لما هو مقدس، من غير أن يخلط الصفة هنا بمفهوم القداسة بمعناه الأوسع.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم اسم الفاعل في سلسلة متوازية تلائم تعلق الصفات بعبارة «ينبغي أن يكون» في السياق السابق. وُضع مؤشر الحاشية بعد الصفتين المتقاربتين لأن الحاشية تشرح التمييز بينهما.
