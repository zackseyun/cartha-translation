id: TIT.1.6
reference: Titus 1:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἴ τίς ἐστιν ἀνέγκλητος, μιᾶς γυναικὸς ἀνήρ, τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: ar
  text: إن كان أحدٌ بلا لوم، زوجَ امرأةٍ واحدة[b]، وله أولادٌ أمناء[a]، لا تُوجَّه إليهم تهمةُ الخلاعة[c] ولا يكونون متمرّدين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أولادٌ مؤمنون». فاللفظة اليونانية يمكن أن تعني «أمناء» أو «مؤمنين».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «رجلَ امرأةٍ واحدة».'
    reason: lexical_alternative
  - marker: c
    text: 'أي: العيش المنفلت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: بلا لوم
  rationale: يفيد أنه غير معرّض لاتهام مشروع، من غير أن يوحي بكمال مطلق.
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: زوجَ امرأةٍ واحدة
  rationale: ترجمة شفافة تحفظ صياغة اليونانية وخصوصيتها الذكورية، ولا تحسم الأسئلة الخلافية المتعلقة بدلالة العبارة.
- source_word: τέκνα
  choice: أولاد
  rationale: لفظ عربي طبيعي وواضح في سياق تدبير البيت، ويشمل الذكور والإناث.
- source_word: πιστά
  choice: أمناء
  rationale: يحفظ معنى الأمانة والثقة بوصفه القراءة الأوسع، مع إثبات احتمال معنى الإيمان في الحاشية.
- source_word: κατηγορίᾳ
  choice: تُوجَّه إليهم تهمة
  rationale: صياغة عربية طبيعية تحفظ الدلالة الاتهامية أو القضائية للفظ.
- source_word: ἀσωτίας
  choice: الخلاعة
  rationale: تعبّر عن العيش المنفلت والمبدّد أخلاقيًا، مع بديل أوضح في الحاشية.
- source_word: ἀνυπότακτα
  choice: متمرّدين
  rationale: ينقل معنى رفض الخضوع أو النظام بصورة مفهومة وطبيعية في سياق الأسرة.
theological_decisions:
- issue: دلالة πιστά في τέκνα ἔχων πιστά
  choice: أولادٌ أمناء
  alternative: أولادٌ مؤمنون
  rationale: يمكن أن يدل اللفظ اليوناني على الأمانة أو على الإيمان؛ اختير المعنى الأوسع في المتن وحُفظ الآخر في الحاشية دون حسم التوتر التفسيري.
- issue: دلالة μιᾶς γυναικὸς ἀνήρ
  choice: زوجَ امرأةٍ واحدة
  alternative: رجلَ امرأةٍ واحدة
  rationale: الترجمة الشفافة تتجنب فرض استنتاج طائفي بشأن الحالة الزوجية أو الوفاء الجنسي أو الزواج بعد الترمل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ تركيب الشرط بوصف الآية جزءًا من جملة متصلة بالسياق السابق، واستُعملت صياغة اتهامية طبيعية مع إبقاء الغموض الحقيقي في πιστά والشفافية في العبارة الزوجية.
