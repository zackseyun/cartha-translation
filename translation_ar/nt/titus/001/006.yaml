  verdict: approve
  source_fidelity: 'ينقل النص عناصر اليونانية كلها بأمانة: «بلا لوم» لـἀνέγκλητος، و«زوجَ امرأةٍ واحدة» للعبارة الذكورية μιᾶς γυναικὸς ἀνήρ، و«أولادٌ أمناء» مع حفظ احتمال «مؤمنون»، كما يحافظ على دلالة الاتهام في κατηγορίᾳ وعلى بديلَي السلوك المنفلت والتمرّد. والعطف بـ«ولا» يعكس ἢ هنا على نحو عربي سليم في سياق النفي، من دون إضافة حسم تفسيري.'
  naturalness: 'الصياغة فصحى معاصرة واضحة ومناسبة لسياق شروط الخدمة: «إن كان أحدٌ بلا لوم ... وله أولادٌ أمناء» سليمة، و«لا تُوجَّه إليهم تهمةُ الخلاعة ولا يكونون متمرّدين» مفهومة وطبيعية. علامات الحواشي موضوعة على الألفاظ ذات الصلة.'
  terminology: «بلا لوم» مناسب وغير مطلق، و«زوج امرأة واحدة» شفاف ولا يفرض تفسيرًا مذهبيًا للعبارة الاصطلاحية. «أمناء» يحفظ السعة الدلالية المطلوبة لـπιστά، و«الخلاعة» مع حاشية «العيش المنفلت» و«متمرّدين» خيارات عربية سليمة.
