  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: ar
  text: الذين يجب إسكاتهم[a]، لأنهم يُفسدون بيوتًا بأكملها[b] بتعليمهم ما لا ينبغي، من أجل مكسبٍ مُخزٍ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يجب سدّ أفواههم».'
    reason: lexical_alternative
  - marker: b
    text: قد يُراد بـ«البيوت» أهل البيت جميعًا، بمن فيهم الأسرة ومن يعتمدون عليها، لا المباني وحدها.
    reason: cultural_note
  - marker: c
    text: 'أو: «ربحٍ دنيء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: الذين يجب إسكاتهم
  rationale: يحافظ على صلة الموصول بمن سبق ذكرهم وعلى معنى الضرورة، ويؤدي اصطلاح «إغلاق الفم» بعبارة عربية طبيعية من غير أن يحدد وسيلة الإسكات.
- source_word: οἵτινες
  choice: لأنهم
  rationale: ينقل القوة التفسيرية للموصول، إذ يبيّن سبب وجوب إسكاتهم.
- source_word: ὅλους οἴκους
  choice: بيوتًا بأكملها
  rationale: «البيت» في العربية، كما في اليونانية هنا، يمكن أن يدل على أهل البيت ووحدته الاجتماعية، مع إبقاء صورة النص الأصلية.
- source_word: ἀνατρέπουσιν
  choice: يقلبون
  rationale: يحفظ صورة الإطاحة والقلب وقوة الاضطراب الذي يحدثه تعليمهم، من دون الجزم بأن المقصود إبادة البيوت كليًا.
- source_word: διδάσκοντες
  choice: إذ يعلّمون
  rationale: يعبّر طبيعيًا عن الحال أو الوسيلة التي بها يقلبون البيوت، مع إبقاء قدر من مرونة علاقة اسم الفاعل بما قبله.
- source_word: ἃ μὴ δεῖ
  choice: ما لا ينبغي
  rationale: صياغة عربية موجزة وطبيعية تنقل عدم ملاءمة مضمون تعليمهم أخلاقيًا.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: طلبًا لمكسبٍ مُخزٍ
  rationale: ينقل دافع الربح مع الحكم الأخلاقي الصريح في الصفة αἰσχροῦ.
theological_decisions:
- issue: طبيعة الإجراء المطلوب تجاه المعلّمين المضلّين
  choice: يجب إسكاتهم
  alternative: يجب سدّ أفواههم
  rationale: المعنى المقصود هو منع تعليمهم المؤذي، لكن النص لا يحدد وسيلة مدنية أو جسدية لذلك؛ لذا تتجنب الصياغة استيراد وسيلة غير مذكورة.
- issue: مدى الضرر الواقع على البيوت
  choice: يقلبون بيوتًا بأكملها
  alternative: يُفسدون أُسرًا بأكملها
  rationale: يحفظ الاختيار صورة الفعل اليوناني واحتمال أن يدل οἶκος على البيت كوحدة أسرية واجتماعية، من غير تضييق المعنى على المبنى أو حسمه في «الأسرة» وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «إسكاتهم» لتجنب حرفية ثقيلة، وأُبقيت «بيوتًا بأكملها» مع حاشية تشرح دلالتها الاجتماعية. وُضعت جميع علامات الحواشي في المتن بحسب ترتيب ظهورها.
