id: TIT.3.9
reference: Titus 3:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: ar
  text: أَمَّا المناقشات الحمقاء[a]، والأنساب، والنزاعات، والمشاجرات حول الشريعة[b]، فتجنَّبها؛ لأنها غير نافعة وباطلة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المباحث» أو «المجادلات».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «المشاجرات الشرعية»، أي المشاجرات المتعلقة بالشريعة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: المناقشات الحمقاء
  rationale: ينقل التعبير معنى المباحث أو الأسئلة الجدلية التي تتسم بالحماقة، لا مجرد الأسئلة المحايدة، بصياغة عربية واضحة وطبيعية.
- source_word: γενεαλογίας
  choice: الأنساب
  rationale: ترجمة مباشرة تحفظ عمومية اللفظ من غير أن تقيّده بتفسير تاريخي معين.
- source_word: ἔρεις
  choice: النزاعات
  rationale: يدل اللفظ على الخصومة والشقاق؛ واختيار «النزاعات» يميزه أسلوبيًا عن «المشاجرات» التالية مع إبقاء التقارب بينهما.
- source_word: μάχας νομικὰς
  choice: المشاجرات حول الشريعة
  rationale: السياق يدل على صراعات كلامية متعلقة بالشريعة، لا على معارك جسدية ولا على نزاعات قضائية.
- source_word: περιΐστασο
  choice: فتجنَّبها
  rationale: يحفظ قوة فعل الأمر ومعنى الابتعاد عن هذه الأمور.
- source_word: ἀνωφελεῖς
  choice: غير نافعة
  rationale: تعبير عربي معاصر ودقيق يفيد انعدام النفع.
- source_word: μάταιοι
  choice: باطلة
  rationale: ينقل معنى الخواء وعدم الجدوى، ويحافظ على التمييز النسبي عن «غير نافعة».
theological_decisions:
- issue: ماهية الأنساب والمشاجرات حول الشريعة
  choice: إبقاء التعبيرين عامَّين من غير تحديد نظام يهودي أو غنوصي أو هرطوقي بعينه
  alternative: تفسير الأنساب بأنها مناقشات خاصة بالنسب اليهودي، أو بأنها تخمينات أسطورية غنوصية مبكرة
  rationale: الآية تسمي هذه الممارسات من غير أن تعرّفها بدقة تكفي لتبنّي إعادة بناء تاريخية محددة؛ لذلك تحفظ الترجمة سعة النص وغموضه الحقيقي.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم «أَمَّا... فتجنَّبها» لتمثيل المقابلة التي تفيدها δὲ ولإبراز فعل الأمر طبيعيًا، مع الحفاظ على قائمة العناصر وعلى عمومية الإشارات التاريخية.
