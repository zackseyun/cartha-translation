lexical_decisions:
- source_word: ὅτε δὲ
  choice: ولكن حين
  rationale: تُفيد ὅτε الزمن، بينما تضيف δέ انتقالًا تقابليًا لطيفًا من وصف حال البشر سابقًا إلى تدخّل الله الخلاصي.
- source_word: χρηστότης
  choice: لطف
  rationale: ينقل معنى الإحسان والطيبة في التعامل، ويتميّز دلاليًا عن «محبّته للبشر».
- source_word: φιλανθρωπία
  choice: محبّته للبشر
  rationale: يعبّر بوضوح وطبيعية عن المحبة والإحسان الموجَّهين إلى البشر، مع إظهار عود الضمير على الله.
- source_word: ἐπεφάνη
  choice: ظهر
  rationale: يحافظ على معنى الظهور والتجلّي بصياغة عربية موجزة وطبيعية، من غير تحديد كيفية هذا الظهور بما يتجاوز النص.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: الله مخلِّصنا
  rationale: يحافظ على اللقب الإلهي والتركيب الإضافي الذي تتعلّق به صفتا اللطف والمحبة، من غير حسم زائد لهوية الأقنوم داخل صياغة الآية نفسها.
theological_decisions:
- issue: مرجع عبارة «الله مخلِّصنا»
  choice: الإبقاء على العبارة لقبًا لله كما في الأصل، من غير إضافة تفسير شخصي داخل المتن.
  alternative: تفسيرها صراحةً بأنها تشير إلى الآب، أو إبقاؤها لقبًا إلهيًا عامًا.
  rationale: سياق الرسائل الرعوية يستعمل «الله مخلِّصنا» غالبًا للآب، فيما يذكر يسوع المسيح متميّزًا في الآية 6؛ لكن الترجمة هنا تحافظ على ألفاظ الآية وتترك التحديد للسياق بدل فرضه في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «ولكن حين» لإبراز الانتقال من السياق السابق، و«محبّته للبشر» لتجنّب غموض «محبة الإنسانية». وُضع الفعل قبل الفاعلين مع إبقائه مفردًا وفق الاستعمال العربي الفصيح.
