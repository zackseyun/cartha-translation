  text: الذي سكبه علينا بفيضٍ بوساطة يسوع المسيح مخلّصنا،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: الذي
  rationale: اسم موصول مفرد يعود إلى الروح القدس المذكور في العدد السابق. وصيغة «الذي» ملائمة لمرجع شخصي، مع بقاء الصيغة اليونانية نفسها غير حاسمة من جهة التذكير والتأنيث بسبب جنس كلمة «الروح» في اليونانية.
- source_word: ἐξέχεεν
  choice: سكبه
  rationale: يحفظ المعنى الأساسي للفعل ἐκχέω، وهو السكب، وهو تعبير كتابي طبيعي عن منح الروح.
- source_word: ἐφ’ ἡμᾶς
  choice: علينا
  rationale: تنقل اتجاه السكب نحو المؤمنين بصياغة عربية موجزة وطبيعية.
- source_word: πλουσίως
  choice: بفيضٍ
  rationale: تؤدي معنى الوفرة والغنى بصورة عربية مألوفة مع فعل «سكب»، دون تحويل الظرف إلى فكرة الكرم وحدها.
- source_word: διὰ
  choice: بوساطة
  rationale: تبيّن معنى الوسيلة أو الوساطة الذي تؤديه διά مع المضاف إليه، وتتفادى احتمال فهم «من خلال» فهمًا مكانيًا.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، ويحفظ معناه اللقبي في تركيب عربي طبيعي.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: مخلّصنا
  rationale: صياغة عربية مباشرة وطبيعية للقب σωτήρ مع ضمير الملكية.
theological_decisions:
- issue: مرجع اسم الموصول οὗ
  choice: يعود إلى الروح القدس في تيطس 3:5، فيكون الله هو الذي سكب الروح علينا.
  alternative: يمكن نظريًا إبراز الصيغة اليونانية المحايدة بترجمة أقل تشخيصًا، لكن العربية تقتضي موافقة المرجع النحوي «الروح».
  rationale: الروح القدس هو أقرب سابق نحوي ودلالي، وصورة سكب الروح معروفة في الاستعمال الكتابي؛ لذلك لا توجد حاجة إلى حاشية عربية لا تنشأ فيها مشكلة الضمير الإنجليزية.
- issue: دلالة Χριστός
  choice: المسيح
  alternative: كريستوس أو استعماله كاسم غير مترجم
  rationale: «المسيح» ترجمة عربية راسخة للقب اليوناني، فتحفظ دلالته ولا تحوله إلى مجرد اسم شخصي.
translation_notes:
  register: صياغة عربية فصحى واضحة ووقورة، مرتبطة نحويًا بالعدد السابق. اختير «بفيض» بدل «بغنى» لأنه أفصح مع صورة السكب، واختيرت «بوساطة» لإظهار معنى الوسيلة. لا تلزم حاشية للموصول لأن العربية توافق كلمة «الروح» المذكرة، ولا تلزم حاشية لـΧριστός لأن «المسيح» ترجمة عربية دلالية مستقرة.
