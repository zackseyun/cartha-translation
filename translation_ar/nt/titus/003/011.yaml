lexical_decisions:
- source_word: εἰδὼς
  choice: عالمًا
  rationale: يحفظ الصيغة الحالية الظرفية واتصالها بتوجيه العدد السابق، من غير حسم دلالتها أهي سببية أم وصفية.
- source_word: ἐξέστραπται
  choice: قد انحرف
  rationale: ينقل الفعل التام بوصفه انحرافًا سابقًا أفضى إلى حالة قائمة، وهو تعبير عربي طبيعي لا يضيف تخصيصًا أخلاقيًا غير لازم.
- source_word: ὁ τοιοῦτος
  choice: مثل هذا الرجل
  rationale: يحافظ على الإشارة بالمفرد المذكر إلى صاحب البدعة المذكور في السياق السابق، بصياغة عربية واضحة.
- source_word: ἁμαρτάνει
  choice: وهو يخطئ
  rationale: ينقل المضارع الدال على الفعل الجاري أو المستمر، من غير توسيعه إلى عبارة تفسيرية مثل «يستمر في الخطيئة».
- source_word: ὢν
  choice: وقد
  rationale: صيغت العلاقة الحالية بجملة عربية مترابطة وطبيعية؛ و«قد» مع الماضي هنا تصف الحالة الناتجة من حكمه على نفسه دون الجزم بأن اسم الفاعل سببي.
- source_word: αὐτοκατάκριτος
  choice: حكم على نفسه
  rationale: يؤدي معنى كونه مدانًا من ذاته، أي إن حاله وسلوكه يشهدان عليه، من غير افتراض حكم قضائي نهائي.
theological_decisions:
- issue: الإشارة المذكرة في ὁ τοιοῦτος
  choice: مثل هذا الرجل
  alternative: مثل هذا الشخص
  rationale: التركيب اليوناني مفرد مذكر ويعود إلى الإنسان المثير للانقسام في السياق؛ لذلك حُفظ التذكير من غير إضافة معنى مذهبي.
- issue: دلالة αὐτοκατάκριτος
  choice: حكم على نفسه
  alternative: مدان من نفسه
  rationale: تحفظ العبارة كون الإدانة راجعة إلى الشخص نفسه، بأفعاله أو شهادته على ذاته، ولا تستورد تصورًا أوسع عن الدينونة النهائية.
translation_notes:
  register: العربية فصحى معاصرة، واضحة وموقرة. روعي اتصال العبارة بسياق العدد السابق، وحُفظت حالة الانحراف الناتجة من فعل سابق، كما تُركت العلاقة الدقيقة بين الجمل دون تفسير سببي زائد.
