  register: صياغة عربية فصحى واضحة وكريمة، قريبة من بنية الأصل من غير جمود. لم تُضف حواشٍ لأن البدائل الإنجليزية المذكورة فروق أسلوبية يمكن استيعابها في المتن ولا تمثل غموضًا نصيًا أو لاهوتيًا جوهريًا.
