  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: ar
  text: متى أرسلتُ إليك أرتيماس أو تيخيكس، فاجتهد أن تأتي إليَّ إلى نيكوبوليس، لأني قد قررت أن أقضي الشتاء هناك.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: متى أرسلتُ
  rationale: ينقل التركيب مع صيغة الاحتمال حدثًا مستقبليًا متوقعًا؛ وصيغة الماضي بعد «متى» عربية طبيعية للدلالة على تحقق الفعل مستقبلًا.
- source_word: Ἀρτεμᾶν
  choice: أرتيماس
  rationale: نقل صوتي للاسم اليوناني بصيغة واضحة في العربية.
- source_word: Τυχικόν
  choice: تيخيكس
  rationale: نقل صوتي للاسم اليوناني مع الحفاظ على نطقه قدر الإمكان.
- source_word: σπούδασον
  choice: فاجتهد
  rationale: يفيد بذل العناية والجد مع ما قد يصاحبه من مبادرة، من غير حصر المعنى في السرعة وحدها.
- source_word: ἐλθεῖν πρός με
  choice: أن تأتي إليَّ
  rationale: يحافظ على اتجاه الحركة نحو المتكلم بعبارة عربية طبيعية.
- source_word: εἰς Νικόπολιν
  choice: في نيكوبوليس
  rationale: مع «تأتي إليَّ» تحدد العبارة المكان الذي يوجد فيه المتكلم، وتتجنب تتابع حرفي الغاية على نحو ثقيل.
- source_word: γὰρ
  choice: لأني
  rationale: يصرح بالعلاقة السببية التي تفسر طلب المجيء.
- source_word: κέκρικα
  choice: قد قررت
  rationale: ينقل دلالة التام على قرار مستقر اتُّخذ وتظل نتيجته قائمة.
- source_word: παραχειμάσαι
  choice: أن أقضي الشتاء
  rationale: تعبير عربي طبيعي عن الإقامة في مكان خلال فصل الشتاء.
theological_decisions: []
