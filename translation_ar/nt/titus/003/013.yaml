base_translation:
  language: en
  yaml_path: translation/nt/titus/003/013.yaml
  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: ar
  text: أَعِنْ زيناسَ الخبيرَ بالقانون وأبلّوسَ في سفرهما بكل عناية[a]، لكي لا يعوزهما شيء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جَهِّزْ زيناسَ الخبيرَ بالقانون وأبلّوسَ للسفر بكل عناية». قد يتضمن الفعل اليوناني تقديم المؤن وسائر المساعدة العملية اللازمة للرحلة، لا مجرد إرسالهما.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηνᾶν
  choice: زيناس
  rationale: نقل صوتي للاسم اليوناني بصيغة عربية واضحة ومتداولة.
- source_word: τὸν νομικὸν
  choice: الخبير بالشريعة
  rationale: تدل الكلمة على شخص متمرس في القانون أو الشريعة. يحافظ هذا التعبير على سعة الدلالة، ولا يحسم دون دليل كافٍ هل المقصود محامٍ بالمفهوم المهني أم خبير بالشريعة الدينية.
- source_word: Ἀπολλῶν
  choice: أبلّوس
  rationale: نقل صوتي للاسم وفق الصيغة العربية الكتابية المألوفة.
- source_word: σπουδαίως
  choice: بكل عناية
  rationale: ينقل معنى الجدية والحرص والاجتهاد في تنفيذ الطلب، من غير قصر الدلالة على السرعة.
- source_word: πρόπεμψον
  choice: أَعِنْ ... على مواصلة سفرهما
  rationale: يُستعمل الفعل في سياقات السفر بمعنى تهيئة المسافرين ومساندتهم بما يحتاجون إليه في الطريق، لا مجرد توديعهم أو صرفهم.
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: لكي لا يعوزهما شيء
  rationale: يحافظ على جملة الغرض وعلى شمول النفي في الأصل، بصياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: هوية زيناس بوصفه νομικός
  choice: الخبير بالشريعة
  alternative: المحامي؛ الخبير بالقانون
  rationale: السياق لا يحدد هل اللقب مهني مدني أم يدل على التخصص في الشريعة؛ لذلك اختير تعبير عربي لا يفرض أحد الاحتمالين فرضًا قاطعًا.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة وكريمة. استُعمل «يعوزهما» للإيجاز مع بقاء المعنى مفهومًا، وجاء تركيب «أَعِنْ ... على مواصلة سفرهما» لإظهار معنى الدعم العملي الملازم للفعل اليوناني.
