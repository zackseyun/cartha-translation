id: TIT.3.8
reference: Titus 3:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: ar
  text: هذا القول جدير بالثقة. وأريدك أن تؤكِّد بثقة بشأن هذه الأمور[a]، لكي يحرص الذين صدَّقوا الله[b] على تكريس أنفسهم للأعمال الصالحة. فهذه الأمور حسنة ونافعة للناس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أن تشدِّد بشأن هذه الأمور» أو «أن تقرِّرها بيقين».
    reason: lexical_alternative
  - marker: b
    text: أو «آمنوا بالله» أو «وضعوا ثقتهم في الله».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: هذا القول جدير بالثقة
  rationale: صيغة رسائلية تشير في السياق إلى الكلام السابق؛ و«القول» أوضح من الترجمة الحرفية «الكلمة»، و«جدير بالثقة» تنقل معنى πιστός.
- source_word: περὶ τούτων
  choice: هذه الأمور
  rationale: أُدمج معنى «بشأن» طبيعيًا في تركيب «تؤكد هذه الأمور» من غير فقدان مرجع العبارة إلى ما سبق.
- source_word: βούλομαί σε διαβεβαιοῦσθαι
  choice: أريدك أن تؤكِّد ... بثقة
  rationale: ينقل الإرادة الشخصية وقوة التقرير الواثق في الفعل διαβεβαιόομαι، من غير تحويله بالضرورة إلى مجادلة أو إلحاح.
- source_word: ἵνα φροντίζωσιν
  choice: لكي يحرص
  rationale: يعبر «يحرص» عن التفكير والعناية المقصودين، ويمهد بصورة طبيعية للالتزام بالأعمال الصالحة.
- source_word: καλῶν ἔργων προΐστασθαι
  choice: على تكريس أنفسهم للأعمال الصالحة
  rationale: يعكس الانصراف المستمر إلى ممارسة الأعمال الصالحة، ويتجنب حصر προΐστασθαι في معنى القيادة التنظيمية الممكن لكنه غير المرجح هنا.
- source_word: οἱ πεπιστευκότες θεῷ
  choice: الذين صدَّقوا الله
  rationale: يحافظ على اتصال الفعل المباشر بالله في تركيب اليونانية مع المجرور، ويبرز قبول قول الله وتصديقه؛ وتُذكر البدائل العربية الطبيعية في الحاشية.
- source_word: ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα
  choice: فهذه الأمور حسنة ونافعة
  rationale: يحافظ على الإشارة الجمعية وعلى الجمع بين الجودة الأخلاقية والمنفعة العملية، مع استخدام الفاء لبيان الصلة بالسياق.
- source_word: τοῖς ἀνθρώποις
  choice: للناس
  rationale: ترجمة عامة تشمل البشر جميعًا ولا تقصر اللفظ على الذكور.
theological_decisions:
- issue: علاقة الإيمان بالأعمال الصالحة
  choice: جُعل تصديق الله سابقًا، وجاء الحرص على الأعمال الصالحة ثمرةً مطلوبة له.
  alternative: فهم الأعمال الصالحة أساسًا للاستحقاق أو شرطًا سابقًا للإيمان.
  rationale: صياغة اليونانية تصف المؤمنين أولًا، ثم تحثهم على الانصراف إلى الأعمال الصالحة؛ وتحافظ الترجمة على هذا الترتيب من غير إضافة تقرير مذهبي.
- issue: دلالة πιστεύω مع θεῷ في حالة المجرور
  choice: صدَّقوا الله
  alternative: آمنوا بالله؛ وضعوا ثقتهم في الله
  rationale: الاختيار الرئيس قريب من البناء اليوناني ويحتفظ بإمكان معنى تصديق الله والأخذ بقوله، بينما تعرض الحاشية المعنيين المحتملين الآخرين.
- issue: مدى دلالة προΐστασθαι
  choice: تكريس أنفسهم للأعمال الصالحة
  alternative: أن يكونوا سبّاقين إلى الأعمال الصالحة؛ أن يمارسوا الأعمال الصالحة
  rationale: السياق يرجح العناية المستمرة والانشغال الفعلي بالأعمال الصالحة، لكن اللفظ قد يحمل أيضًا إيحاء التقدم أو المبادرة، لذلك لم تُحمَّل العبارة معنى القيادة المؤسسية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «صدَّقوا الله» عمدًا مع أنه أقل شيوعًا من «آمنوا بالله» للمحافظة على تركيب الأصل وإبقاء دلالته مفتوحة، مع توضيح البدائل في الحاشية.
