  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: ar
  text: وألّا يتكلموا بالسوء على أحد[a]، وأن يكونوا مسالمين، مترفقين[b]، مظهرين كلَّ وداعةٍ نحو جميع الناس[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وألّا يشتموا أحدًا». قد يدل الفعل على الكلام المسيء أو الطاعن عمومًا، لا على الافتراء الكاذب وحده.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «متسامحين». تحمل الكلمة معنى الرفق وعدم التشدد والاستعداد للمراعاة.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «تجاه كل إنسان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: أحدًا
  rationale: مفعول به للفعل βλασφημεῖν، وصيغة النفي «ألّا... أحدًا» طبيعية وتحفظ الشمول.
- source_word: βλασφημεῖν
  choice: يشتموا
  rationale: في هذا السياق الأخلاقي المتعلق بمعاملة الناس، يدل الفعل على الكلام المسيء أو المهين، و«يشتموا» أوسع من القذف القانوني وأقرب إلى الاستعمال العربي الواضح.
- source_word: ἀμάχους εἶναι
  choice: يكونوا مسالمين
  rationale: يدل الوصف على عدم الميل إلى الخصام أو الشجار؛ و«مسالمين» صياغة عربية طبيعية موجزة.
- source_word: ἐπιεικεῖς
  choice: حليمين
  rationale: ينقل معنى الرفق والتسامح وعدم التشدد، مع تمييزه عن πραΰτης الآتية في العبارة التالية.
- source_word: πᾶσαν ἐνδεικνυμένους πραΰτητα
  choice: مظهرين كلَّ وداعةٍ
  rationale: «مظهرين» يعكس معنى الإبانة العملية، و«كل وداعة» يحفظ قوة πᾶσαν والصفة الأخلاقية التي تدل عليها πραΰτης.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: نحو جميع الناس
  rationale: تحفظ «نحو» دلالة التوجّه في πρός، و«جميع الناس» تنقل الشمول والمرجع البشري العام دون تخصيص بالذكور.
theological_decisions:
- issue: مدى النهي في βλασφημεῖν
  choice: يشتموا أحدًا
  alternative: يفتروا على أحد / يتكلموا بالسوء على أحد
  rationale: لا يقتصر الفعل هنا بالضرورة على الافتراء الكاذب، بل قد يشمل الكلام المسيء عمومًا؛ لذلك تجنبت الترجمة تضييق المعنى إلى القذف وحده.
- issue: المرجع العام في πάντας ἀνθρώπους
  choice: جميع الناس
  alternative: كل إنسان
  rationale: العبارة تشمل البشر كافة، ولا تحمل تخصيصًا بالذكور.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ورصينة. استُعملت «حليمين» و«وداعة» للتمييز بين ἐπιεικεῖς وπραΰτης مع إبقاء التقارب الدلالي بينهما، وحُفظ نسق الوصايا المتتابعة المتصل بالآية السابقة.
