base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: ar
  text: لأننا نحن أيضًا كنا قبلاً سفهاء، عاصين، مُضَلَّلين[a]، مستعبَدين لرغبات وملذّات متنوعة، نقضي حياتنا بسوء النية والحسد، بغيضين[b]، نبغض بعضنا بعضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مخدوعين».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مبغَضين». يمكن فهم الصفة اليونانية بمعنى «بغيضين، مثيرين للبغض» أو بمعنى «مبغَضين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: لأننا نحن أيضًا كنا قبلاً
  rationale: تُظهر «لأن» صلة التعليل بما قبلها، وتحفظ «نحن أيضًا» توكيد المشاركة، بينما تعبّر «قبلاً» طبيعيًا عن الزمن السابق.
- source_word: ἀνόητοι
  choice: أغبياء
  rationale: تنقل انعدام الفهم أو الرشد الأخلاقي بلفظ عربي واضح ومباشر.
- source_word: ἀπειθεῖς
  choice: عاصين
  rationale: يلائم سياق تعداد الرذائل، ويعبّر عن رفض الانقياد وما يترتب عليه من عصيان.
- source_word: πλανώμενοι
  choice: ضالّين
  rationale: يحفظ معنى الانحراف عن الطريق مع إبقاء احتمال الدلالة الوسطية أو المبنية للمجهول؛ وتُذكر «مخدوعين» في الحاشية بوصفها احتمالًا معجميًا.
- source_word: δουλεύοντες
  choice: مستعبَدين
  rationale: يحفظ قوة لغة العبودية ويبرز الخضوع القسري للشهوات والملذات، بدل اللفظ الأخف «خادمين».
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: لشهوات وملذّات شتّى
  rationale: «شهوات» هنا أوسع من الرغبة الجنسية وحدها، و«شتّى» تفيد التنوع وتشمل الاسمين في السياق.
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: نقضي حياتنا في الخبث والحسد
  rationale: يعكس الفعل معنى قضاء مسيرة الحياة، وتناسب «الخبث» السياق العلاقي للرذائل أكثر من التعبير العام «الشر».
- source_word: στυγητοί
  choice: بغيضين
  rationale: يحفظ إمكان فهم الصفة بمعنى مثيرين للبغض، مع إثبات احتمال المبني للمفعول «مبغَضين» في الحاشية.
- source_word: μισοῦντες ἀλλήλους
  choice: يبغض بعضنا بعضًا
  rationale: صياغة عربية فصيحة وطبيعية تنقل اسم الفاعل والضمير التبادلي بوضوح.
theological_decisions:
- issue: قوة دلالة δουλεύοντες عند إسناد العبودية إلى الشهوات والملذات
  choice: مستعبَدين لشهوات وملذّات شتّى
  alternative: خادمين شهوات وملذّات شتّى
  rationale: يعرض النص حالة خضوع أخلاقي قوية؛ و«مستعبَدين» تحافظ على استعارة العبودية من غير أن تفرض منظومة عقائدية تتجاوز العبارة.
- issue: اتجاه دلالة στυγητοί
  choice: بغيضين
  alternative: مبغَضين
  rationale: تحتمل الصفة اليونانية معنى الفاعلية، أي المثيرين للبغض، أو معنى المفعولية، أي الواقع عليهم البغض. اختير الأول لانسجامه مع تعداد الصفات، وحُفظ الثاني في الحاشية.
