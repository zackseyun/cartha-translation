  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: ar
  text: لم يخلّصنا على أساس أعمالٍ عملناها نحن في البر[a]، بل بحسب رحمته، بغسل الميلاد الجديد[b] والتجديد بالروح القدس[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العدل». يمكن أن تدل الكلمة اليونانية على «البر» أو «العدل»؛ ويُبقي المتن «البر» لمناسبته للاستعمال البولسي هنا.'
    reason: alternative_reading
  - marker: b
    text: قد يشير «الغسل» إلى المعمودية، أو إلى صورة التطهير، أو إلى كليهما؛ ولا يوجب اللفظ اليوناني حسم ذلك في المتن.
    reason: lexical_alternative
  - marker: c
    text: 'أو: «وتجديد الروح القدس». يسمح التركيب اليوناني بأكثر من وجه يسير في بيان علاقة «الروح القدس» بـ«التجديد».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: لا على أساس أعمال
  rationale: تفيد ἐκ هنا المصدر أو الأساس؛ وهذه الصياغة العربية طبيعية وتحفظ المقابلة مع «بحسب رحمته» من غير حصر الدلالة في مجرد الوسيلة.
- source_word: τῶν ἐν δικαιοσύνῃ
  choice: في البر[a]
  rationale: شبه الجملة اليونانية تصف الأعمال بأنها واقعة في البر. أبقينا «البر» بوصفه المقابل المألوف لـ δικαιοσύνη في السياق البولسي، مع إثبات «العدل» احتمالًا معجميًا في الحاشية.
- source_word: ἃ ἐποιήσαμεν ἡμεῖς
  choice: عملناها نحن
  rationale: يحفظ الفعل معنى الإتيان بالأعمال، ويعكس الضمير المنفصل «نحن» توكيد الضمير اليوناني الصريح ἡμεῖς.
- source_word: κατὰ τὸ αὐτοῦ ἔλεος
  choice: بحسب رحمته
  rationale: تحفظ «بحسب» قوة κατά الدالة على المعيار أو الأساس، وتبقي المقابلة بين أعمال البشر ورحمة الله.
- source_word: ἔσωσεν ἡμᾶς
  choice: خلّصنا
  rationale: «خلّص» هو المقابل العربي الطبيعي والمستقر للفعل σῴζω في هذا السياق الخلاصي.
- source_word: διὰ λουτροῦ
  choice: بغسل[b]
  rationale: الباء تنقل معنى الوسيلة في διά مع المضاف إليه، و«غسل» يبقي المجال مفتوحًا للإشارة إلى المعمودية أو إلى صورة التطهير أو إليهما معًا.
- source_word: παλιγγενεσίας
  choice: الميلاد الجديد
  rationale: ينقل معنى الولادة من جديد بعبارة واضحة للقارئ المعاصر، من غير إثقال النص بمصطلح «التجديد» الذي قد يلتبس بالاسم التالي ἀνακαίνωσις.
- source_word: καὶ ἀνακαινώσεως
  choice: والتجديد
  rationale: يحفظ الاسم المجرد والبنية المتوازية مع «الميلاد الجديد».
- source_word: πνεύματος ἁγίου
  choice: بالروح القدس[c]
  rationale: تعبّر الباء عن كون الروح القدس مصدر التجديد أو فاعله، مع إبقاء الوجه الإضافي «تجديد الروح القدس» في الحاشية.
theological_decisions:
- issue: دلالة δικαιοσύνη في السياق البولسي
  choice: البر
  alternative: العدل
  rationale: «البر» أنسب للاستعمال البولسي ولصفة الأعمال في هذا السياق، لكن اللفظة اليونانية قد تحمل معنى العدل، ولذلك لم يُلغَ هذا الاحتمال.
- issue: دلالة διὰ λουτροῦ παλιγγενεσίας
  choice: بغسل الميلاد الجديد
  alternative: بغسل المعمودية للميلاد الجديد؛ أو بتطهير الميلاد الجديد
  rationale: لا يصرّح اليوناني بلفظة «المعمودية»، مع أن الغسل قد يشير إليها؛ لذلك تُركت الصورة الأصلية بلا حسم للخلاف بين الدلالة المعمودية والمجاز التطهيري أو اجتماعهما.
- issue: علاقة πνεύματος ἁγίου بما قبله
  choice: 'ربطه مباشرة بالتجديد على معنى المصدر أو الفاعل: «التجديد بالروح القدس»'
  alternative: «تجديد الروح القدس» أو حمله على الغسل والميلاد الجديد والتجديد معًا
  rationale: قرب المضاف إليه من ἀνακαινώσεως يرجّح تعلقه بالتجديد، لكن تركيب الإضافة اليوناني يسمح بصياغة أخرى ولا يحسم تمامًا مدى امتداد التعلق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. روعي ترتيب المقابلة في اليونانية، وأُبقيت ألفاظ «البر» و«الغسل» و«التجديد» دون توسع تفسيري أو حسم مذهبي. وُضعت علامات الحواشي عقب الألفاظ التي تتناولها مباشرة.
