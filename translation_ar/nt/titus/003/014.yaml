base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: ar
  text: وليتعلَّم أهلُنا[a] أيضًا أن يواظبوا على الأعمال الصالحة[b] لسدّ الحاجات الضرورية[c]، لكيلا يكونوا بلا ثمر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خاصتُنا» أو «الذين لنا».
    reason: lexical_alternative
  - marker: b
    text: 'أو «أن يكرّسوا أنفسهم للأعمال الصالحة»؛ وقد يُفهم أيضًا: «أن يتقدّموا في الأعمال الصالحة».'
    reason: lexical_alternative
  - marker: c
    text: أو «لسدّ الحاجات الملحّة».
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: ليتعلَّم
  rationale: صيغة أمر للغائب الجمع تفيد الحث؛ وصيغة «ليتعلَّم» تحفظ قوتها الإرشادية من غير مبالغة.
- source_word: οἱ ἡμέτεροι
  choice: أهلُنا
  rationale: العبارة تعني حرفيًا «الذين لنا»، وتشير في السياق إلى أفراد الجماعة المرتبطة ببولس وتيطس؛ و«أهلنا» عربية طبيعية جامعة.
- source_word: καλῶν ἔργων
  choice: الأعمال الصالحة
  rationale: ترجمة واضحة تحافظ على التعبير المتكرر في رسالة تيطس وعلى دلالته الأخلاقية والنافعة.
- source_word: προΐστασθαι
  choice: أن يواظبوا على
  rationale: للفعل معانٍ منها التقدّم والقيام على الأمر والاهتمام به؛ وهنا يدل على الانخراط المقصود والمستمر في الأعمال الصالحة، مع إبقاء احتمال معنى التصدّر في الحاشية.
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: لسدّ الحاجات الضرورية
  rationale: يبين الغرض العملي من الأعمال الصالحة، أي تلبية الاحتياجات الحقيقية واللازمة، في صياغة عربية طبيعية.
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: لكيلا يكونوا بلا ثمر
  rationale: تحفظ جملة الغاية وصورة انعدام الثمر دون تحويلها إلى تفسير مثل «غير نافعين».
theological_decisions:
- issue: نطاق οἱ ἡμέτεροι
  choice: أهلُنا، أي أفراد الجماعة المسيحية المرتبطة ببولس وتيطس
  alternative: خاصتنا؛ أو الذين ينتمون إلينا في مقابل من هم خارج الجماعة
  rationale: التعبير علائقي وجماعي، ولا يقتضي قصره على الرجال؛ لذا تحافظ «أهلنا» على المرجع الجماعي من غير تحميله تمييزًا مذهبيًا.
- issue: دلالة προΐστασθαι في سياق الأعمال الصالحة
  choice: المواظبة الفاعلة على الأعمال الصالحة
  alternative: التقدّم أو أخذ زمام المبادرة في الأعمال الصالحة
  rationale: السياق العملي في تيطس 3:8 و3:14 يرجح الالتزام والممارسة، لكن المعنى الذي يفيد التقدّم أو التصدّر ممكن، ولذلك ذُكر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. استُخدمت «أهلنا» للتعبير الطبيعي عن الانتماء الجماعي، و«بلا ثمر» للحفاظ على الاستعارة الأصلية. وُضعت علامات الحواشي عند العبارات التي تفسرها وبترتيبها الأبجدي.
