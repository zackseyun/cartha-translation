source:
  edition: SBLGNT
  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: ar
  text: يُسَلِّمُ عليك جميعُ الذين معي. سَلِّمْ على الذين يحبوننا في الإيمان[a]. لِتَكُنِ النعمةُ معكم جميعًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «على أساس الإيمان»؛ أو «بأمانة».'
    reason: تحفظ الحاشية الاحتمال الدلالي في ἐν πίστει بين الإيمان بوصفه أساس العلاقة ومعنى الأمانة.
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: يُسَلِّمُ عليك
  rationale: تعبير عربي طبيعي في ختام الرسائل، ينقل معنى التحية الشخصية دون توسع.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: جميعُ الذين معي
  rationale: يحفظ معنى πάντες، أي «الجميع»، وعلاقة المصاحبة في μετά مع المضاف إليه.
- source_word: ἄσπασαι
  choice: سَلِّمْ على
  rationale: صيغة أمر عربية موجزة ومألوفة لنقل التحية في سياق رسائلي.
- source_word: φιλοῦντας
  choice: يحبوننا
  rationale: ينقل معنى المودة والمحبة الشخصية في φιλέω بوضوح ومن غير تخفيف.
- source_word: ἐν πίστει
  choice: في الإيمان
  rationale: يحفظ صورة العبارة اليونانية وانفتاحها على كون الإيمان مجال المحبة أو أساسها، مع إثبات البدائل الممكنة في الحاشية.
- source_word: ἡ χάρις
  choice: النعمةُ
  rationale: يحفظ التعبير البولسي المألوف عن النعمة الإلهية، مع أداة التعريف الموجودة في اليونانية.
- source_word: μετὰ πάντων ὑμῶν
  choice: معكم جميعًا
  rationale: صياغة عربية طبيعية تحفظ شمول πάντων، والفعل «لتكن» مستفاد من صيغة البركة المحذوف فعلها في اليونانية.
theological_decisions:
- issue: دلالة πίστις في عبارة ἐν πίστει
  choice: الإيمان
  alternative: الأمانة؛ أو الإيمان المشترك
  rationale: السياق يرجّح الإيمان بوصفه المجال أو الأساس المشترك للمحبة بين المؤمنين، لكنه لا يحسم تمامًا بين هذا المعنى ومعنى الأمانة، لذلك لم تُلغَ الاحتمالات الأخرى.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يُسَلِّم عليك» و«سَلِّم على» لملاءمتهما الطبيعية لخاتمة الرسالة، وأُبقيت عبارة «في الإيمان» موجزة وغير مفسِّرة أكثر مما يسمح به الأصل.
