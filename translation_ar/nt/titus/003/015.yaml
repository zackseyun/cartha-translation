  source_fidelity: 'النص العربي ينقل بدقة البنية والمعنى في اليونانية: المخاطَب في الجملة الأولى مفرد («عليك»، مقابل σε)، ثم ينتقل إلى الجمع في البركة الختامية («معكم جميعًا»، مقابل πάντων ὑμῶν). ويحفظ «جميع» شمول πάντες، وصيغة الأمر في «سَلِّمْ على»، ومعنى المحبة في φιλοῦντας، كما يجعل الفعل المحذوف في البركة ظاهرًا بصياغة عربية سليمة («لتكن»).'
