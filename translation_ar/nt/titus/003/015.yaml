  terminology: «النعمة» مناسب للتعبير الرسائلي، و«في الإيمان» يحافظ على اللفظ الرئيس لـἐν πίστει من غير تحميل مذهبي. وتُبقي الحاشية احتمال معنى الأمانة، مع بيان قراءة تفسيرية ممكنة للعلاقة بالإيمان.
