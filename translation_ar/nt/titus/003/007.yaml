  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: ar
  text: لكي نصير، بعدما بُرِّرنا بنعمته[a]، ورثةً بحسب رجاء الحياة الأبدية[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: أُعلِن أننا أبرار.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «على رجاء الحياة الأبدية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تفيد الغاية أو النتيجة، وتحافظ «لكي» على هذه الدلالة بعبارة عربية واضحة.
- source_word: δικαιωθέντες
  choice: بعدما بُرِّرنا
  rationale: تحافظ الصيغة على المبني للمجهول، وتُظهر أن هذا الفعل سابق منطقيا على صيرورتنا ورثة، من غير تفسير زائد لمعناه اللاهوتي.
- source_word: τῇ ἐκείνου χάριτι
  choice: بنعمته
  rationale: الباء تؤدي معنى الداتيف الدال على الوسيلة، والضمير يحافظ على الإحالة السياقية من غير تعيين صريح لمرجعه أكثر مما يفعل الأصل.
- source_word: κληρονόμοι
  choice: ورثةً
  rationale: يحفظ صورة الميراث الواضحة في اللفظ اليوناني واستعماله في سياق الخلاص.
- source_word: γενηθῶμεν
  choice: نصير
  rationale: تفيد الدخول في حالة أو منزلة جديدة، وهي أقرب إلى γίνομαι من عبارة قد توحي بسبب خارجي مصرح به.
- source_word: κατ’ ἐλπίδα
  choice: بحسب رجاء
  rationale: تحافظ على دلالة κατά وصلة الميراث بالرجاء الأخروي، مع إثبات البديل الاصطلاحي الممكن في الحاشية.
- source_word: ζωῆς αἰωνίου
  choice: الحياة الأبدية
  rationale: تعبير عربي مألوف ودقيق يؤدي المضاف إليه الذي يبين مضمون الرجاء.
theological_decisions:
- issue: معنى δικαιωθέντες في سياق الخلاص
  choice: بُرِّرنا
  alternative: أُعلِن أننا أبرار
  rationale: «بُرِّرنا» تحفظ الصلة بالمصطلح الكتابي ولا تحصر الفعل في شرح لاهوتي واحد؛ ويُذكر البديل التفسيري في الحاشية.
- issue: مرجع الضمير في ἐκείνου
  choice: الضمير في «بنعمته» بلا تعيين اسمي
  alternative: بنعمة الله أو بنعمة يسوع المسيح
  rationale: الأصل يستعمل ضميرا يمكن فهم مرجعه من السياق، لذلك لا تُفرض هوية أكثر صراحة مما يقدمه النص نفسه.
- issue: علاقة κατ’ ἐλπίδα بالميراث والحياة الأبدية
  choice: بحسب رجاء الحياة الأبدية
  alternative: على رجاء الحياة الأبدية
  rationale: الصياغة المختارة أقرب شكلا إلى الأصل، بينما يحفظ البديل في الحاشية الاحتمال الاصطلاحي من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ المبني للمجهول وصورة الميراث، ولم يُصرَّح بمرجع الضمير حتى لا يُزال ما في الأصل من احتمال سياقي.
