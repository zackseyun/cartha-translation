  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: ar
  text: ذَكِّرْهُمْ بأن يخضعوا للحكام والسلطات[a]، وأن يطيعوا، وأن يكونوا مستعدين لكل عمل صالح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يخضعوا للحكام وأصحاب السلطة، وأن يمتثلوا لهم».'
    reason: بديل معجمي وتركيبي يعبّر عن إمكان فهم الاسمين على الأشخاص القائمين بالحكم، ويجعل متعلّق فعل الطاعة صريحًا، مع بقاء النص الرئيس محافظًا على إيجاز اليونانية.
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: ذَكِّرْهُمْ
  rationale: فعل أمر مضارع يفيد أن يواصل تيطس تذكير المؤمنين؛ وصيغة «ذَكِّرْهُمْ» عربية طبيعية، ويمكن أن يُفهم منها التكرار في السياق دون زيادة تفسيرية.
- source_word: αὐτοὺς
  choice: هُمْ
  rationale: ضمير جمع يعود إلى المؤمنين الذين يوجّه إليهم تيطس التعليم.
- source_word: ἀρχαῖς
  choice: الرئاسات
  rationale: يشير في هذا السياق المدني إلى الجهات أو الأشخاص الحاكمين، وتحافظ «الرئاسات» على تمييزه من ἐξουσίαις مع بقائه مفهومًا في الاقتران.
- source_word: ἐξουσίαις
  choice: السُّلطات
  rationale: يدل على أصحاب السلطة أو الهيئات الحاكمة؛ واقترانه بـ«الرئاسات» يحفظ التعبير المزدوج في اليونانية.
- source_word: ὑποτάσσεσθαι
  choice: أن يخضعوا
  rationale: ينقل معنى وضع النفس تحت نظام السلطة أو الانقياد لها، من غير أن تضيف الصياغة معنى الطاعة المطلقة.
- source_word: πειθαρχεῖν
  choice: أن يطيعوا
  rationale: يدل على امتثال المرء لمن هم في موقع الحكم؛ و«أن يطيعوا» موجزة وطبيعية ضمن سلسلة صيغ المصدر المؤول.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: لكل عمل صالح
  rationale: تفيد πρός هنا التهيؤ والتوجّه إلى العمل، و«لكل عمل صالح» تنقل المعنى الأخلاقي بوضوح.
- source_word: ἑτοίμους εἶναι
  choice: أن يكونوا مستعدين
  rationale: تعبّر عن حالة دائمة من الجاهزية، و«مستعدين» صياغة عربية واضحة ومباشرة.
theological_decisions:
- issue: مدى الخضوع للبنى المدنية
  choice: صياغة الوصية بوصفها دعوة عامة إلى الخضوع للرئاسات والسلطات وطاعتها، من غير التصريح بأنها طاعة مطلقة في كل ظرف.
  alternative: صياغة توحي بوجوب الطاعة غير المشروطة للحكام والسلطات.
  rationale: يشير اقتران ἀρχαῖς وἐξουσίαις في السياق إلى الحكم والسلطة المدنية. تحافظ الترجمة على قوة الوصية كما هي، ولا تضيف قيدًا أو إطلاقًا لا يصرّح به النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «الرئاسات والسُّلطات» للمحافظة على ازدواج المصطلحين، مع توضيح البديل الشخصي في الحاشية. وحُفظ تتابع الوصايا الثلاث بإيقاع عربي طبيعي.
