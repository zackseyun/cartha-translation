  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: ar
  text: 'وقال له: «الحق أقول لك: اليوم[a] ستكون معي في الفردوس».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على وجه أقل ترجيحًا: «الحق أقول لك اليوم: ستكون معي في الفردوس». لم يتضمن النص اليوناني في الأصل علامات الترقيم الحديثة؛ ووفق هذا الوجه تتعلّق كلمة «اليوم» بعبارة «أقول لك» بدلًا من «ستكون».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: الحق
  rationale: تأتي الكلمة في أقوال يسوع توكيدًا مهيبًا يمهّد لإعلان موثوق؛ وعبارة «الحق أقول لك» عربية واضحة راسخة وتحفظ قوة الصيغة اليونانية.
- source_word: σοι λέγω
  choice: أقول لك
  rationale: ترجمة مباشرة وطبيعية لصيغة الخطاب، وتنسجم مع الأسلوب العربي الفصيح.
- source_word: σήμερον
  choice: اليوم
  rationale: يتعلّق الظرف، في القراءة الأرجح، بالفعل المستقبل «ستكون»، فيجعل الوعد متعلقًا بذلك اليوم. ولأن النص اليوناني القديم لم يتضمن علامات الترقيم الحديثة، أُثبت الاحتمال الآخر في الحاشية.
- source_word: μετ’ ἐμοῦ
  choice: معي
  rationale: تنقل العبارة بإيجاز ووضوح، وتحفظ معنى المصاحبة الشخصية.
- source_word: ἔσῃ
  choice: ستكون
  rationale: صيغة مستقبل طبيعية ودقيقة للفعل اليوناني.
- source_word: παραδείσῳ
  choice: الفردوس
  rationale: «الفردوس» المقابل العربي المألوف والدقيق في هذا السياق الأخروي، من غير إضافة تفاصيل لا يصرّح بها النص.
theological_decisions:
- issue: موضع تعلّق σήμερον («اليوم») في قول يعتمد فهمه على الترقيم وله صلة بتفسير حالة الإنسان بعد الموت
  choice: ربط «اليوم» بعبارة «ستكون معي في الفردوس»
  alternative: ربط «اليوم» بعبارة «أقول لك»
  rationale: لم تكن علامات الترقيم الحديثة جزءًا من النص اليوناني الأصلي. والقراءة الأسلس في السياق والتركيب هي أن «اليوم» يحدد زمن كون المخاطَب مع يسوع في الفردوس. لكن الاحتمال الآخر ممكن من جهة الترقيم وله أثر لاهوتي، لذلك حُفظ في الحاشية بدل تجاهله.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت الصيغة المألوفة «الحق أقول لك» من غير نقل صوتي لكلمة Ἀμήν، وحُفظ الغموض الناشئ عن الترقيم في حاشية موجزة.
