  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: ar
  text: وكان ذلك يومَ الاستعداد، وكان السبت يبدأ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «وكان السبت يطلع». يمكن أن يعني الفعل اليوناني «يطلع» أو «يبدأ»؛ والمقصود هنا ابتداء السبت عند المساء.'
    reason: بديل معجمي يوضح الصورة الحرفية ويمنع فهمها على أنها فجر الصباح.
lexical_decisions:
- source_word: παρασκευῆς
  choice: يوم الاستعداد
  rationale: ينقل المعنى الحرفي للكلمة واستعمالها اليهودي اليوناني اسمًا لليوم السابق للسبت، من غير استبدالها بالتفسير الزمني «الجمعة».
- source_word: σάββατον
  choice: السبت
  rationale: السياق يعيّن السبت الأسبوعي، والتعريف هو التعبير العربي الطبيعي.
- source_word: ἐπέφωσκεν
  choice: قد أخذ يبدأ
  rationale: يفيد شروع السبت ودخوله عند المساء، ويتجنب أن توهم عبارة «كان يطلع» أن الحديث عن فجر الصباح، مع حفظ الدلالة الحرفية في الحاشية.
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: كان ذلك يومَ الاستعداد
  rationale: صياغة عربية طبيعية تحفظ دلالة التركيب اليوناني بوصفه تعيينًا لليوم.
- source_word: καὶ
  choice: و
  rationale: أُبقي حرف العطف في الجملتين ليعكس تنسيق لوقا السردي من غير تحميله دلالة إضافية.
theological_decisions:
- issue: دلالة ἐπέφωσκεν وعلاقتها بابتداء السبت
  choice: يفيد النص أن السبت كان قد أخذ يبدأ عند المساء.
  alternative: «كان السبت يطلع» على نحو أكثر حرفية.
  rationale: يبدأ اليوم اليهودي عند المساء، وسياق الدفن قبل راحة السبت يؤيد معنى الشروع. وتحفظ الحاشية صورة الفعل اليوناني كي لا يُطمس ما فيها من توتر تعبيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «يوم الاستعداد» بوصفه تعبيرًا مفهومًا يحفظ المصطلح التقويمي، واستُعمل «قد أخذ يبدأ» لتوضيح الشروع التدريجي مع إبقاء الحرفية في الحاشية.
