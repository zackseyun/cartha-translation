  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: ar
  text: 'لأنه ها هي أيام آتية، سيقولون فيها: «طوبى للعاقرات، وللأرحام التي لم تلد، وللأثداء التي لم تُرضِع».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ها
  rationale: أداة تنبيه عربية موجزة وطبيعية، تحفظ قوة لفت الانتباه في النص اليوناني.
- source_word: Μακάριαι
  choice: طوبى
  rationale: صيغة عربية كتابية راسخة تفيد الغبطة أو اعتبار أصحابها في حال يُغبطون عليها، من دون تسطيح المفارقة السياقية.
- source_word: αἱ στεῖραι
  choice: العواقر
  rationale: تنقل وصف النساء اللواتي لا يلدن بوضوح وإيجاز، مع بقاء المقابلة البلاغية مع البطون والثدي.
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: البطون التي لم تلد
  rationale: يحفظ التشخيص المجازي والبنية الموازية في الأصل بدل تحويلها تفسيرياً إلى النساء فقط.
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: الثدي التي لم تُرضِع
  rationale: السياق يحدد معنى ἔθρεψαν هنا بالإرضاع والتغذية من الثدي؛ والصياغة تحافظ على التوازي الجسدي في القول.
theological_decisions:
- issue: المفارقة في إعلان الغبطة للعواقر
  choice: الإبقاء على «طوبى» من غير تفسير داخل المتن
  alternative: «هنيئًا» أو إضافة تفسير بأن ذلك بسبب الضيق الآتي
  rationale: الآية نفسها تعرض قولاً صادماً في سياق دينونة مقبلة، وينبغي حفظ توتره اللاهوتي والبلاغي من غير إدخال شرح غير مصرح به في المتن.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظ التوازي الثلاثي: العواقر، البطون، الثدي، كما حُفظت أداة التنبيه «ها» والمفارقة المقصودة في «طوبى».'
