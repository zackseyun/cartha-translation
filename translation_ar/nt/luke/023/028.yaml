  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: ar
  text: 'فالتفت يسوع إليهن وقال: «يا بنات أورشليم، لا تبكين عليَّ، بل ابكين على أنفسكن وعلى أولادكن».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: فالتفت يسوع إليهن
  rationale: ينقل اسم الفاعل الأَوْرِسْتي بوصفه فعلًا سابقًا ملازمًا للفعل الرئيس، ويحفظ معنى التوجّه الجسدي نحو النساء. وتؤدي الفاء الانتقال السردي بسلاسة، بينما يُفهم الضمير من السياق.
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: يا بنات أورشليم
  rationale: يحفظ الخطاب اليوناني الحرفي وصيغته ذات الصدى النبوي، وهو تعبير عربي كتابي واضح وطبيعي.
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: لا تبكين عليَّ
  rationale: يحافظ على صيغة النهي من غير الجزم بأنها تعني «توقّفن»، وتعبير «البكاء على» هو المقابل العربي الطبيعي في هذا السياق.
- source_word: πλὴν
  choice: بل
  rationale: 'تفيد التصحيح والمقابلة المباشرة: ليس عليّ، بل على أنفسكن.'
- source_word: ἐφ’ ἑαυτὰς κλαίετε
  choice: ابكين على أنفسكن
  rationale: يحفظ التوازي مع «لا تبكين عليَّ» وينقل الضمير الانعكاسي بوضوح.
- source_word: τὰ τέκνα ὑμῶν
  choice: أولادكن
  rationale: لفظ عربي طبيعي شامل للأبناء والبنات في سياق المخاطبات، وينقل المعنى العائلي لـ τέκνα.
theological_decisions:
- issue: صياغة النداء Θυγατέρες Ἰερουσαλήμ
  choice: يا بنات أورشليم
  alternative: يا نساء أورشليم
  rationale: يحفظ «بنات» الصورة الأصلية وصداها النبوي والجماعي، بدل اختزالها إلى وصف ديموغرافي، من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت صيغ جمع المؤنث «تبكين/ابكين/أنفسكن/أولادكن» لأن المخاطَبات نساء، مع الحفاظ على الإيجاز والتوازي في الأصل.
