  - marker: b
    text: تشير الكلمة اليونانية إلى ضرائب أو إتاوات تُدفع للحاكم الروماني.
    reason: cultural_note
  - marker: c
    text: 'أو: «ويقول عن نفسه إنه المسيح، ملكًا».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: وبدأوا يتهمونه
  rationale: ينقل معنى البدء وصيغة الاتهام القضائية بعبارة عربية طبيعية وموجزة، مع تمثيل δὲ بالواو الاستئنافية.
- source_word: Τοῦτον εὕραμεν
  choice: وجدنا هذا الرجل
  rationale: يحافظ على صيغة الادعاء وعلى الإشارة المباشرة التي قد تحمل نبرة ازدراء في سياق المحاكمة.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: يُضلِّل أمتنا
  rationale: يعبّر عن إفساد الاتجاه أو الإضلال من غير حصر العبارة في معنى التمرد السياسي، مع إبقاء البدائل في الحاشية.
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: ويمنعنا من دفع الجزية لقيصر
  rationale: يفهم فاعل المصدر من جماعة المتكلمين بحسب السياق، وتؤدي «الجزية» معنى الضريبة أو الخراج المستحق للحاكم الروماني.
- source_word: λέγοντα αὑτὸν
  choice: ويقول إنه هو نفسه
  rationale: يحافظ على فعل القول وعلى توكيد الضمير الانعكاسي αὑτόν.
- source_word: χριστὸν βασιλέα εἶναι
  choice: المسيح، ملكٌ
  rationale: يعرض اللقبين في علاقة بدل أو تفسير محتملة من غير دمجهما في لقب مركب أو حسم بنيتهما الدلالية.
theological_decisions:
- issue: دلالة χριστός في اتهام ذي طابع سياسي
  choice: المسيح
  alternative: المسيّا؛ الممسوح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب الملكي الديني هنا، ولا يُعامل بوصفه اسمًا مجردًا، بينما توضح الحاشية إمكان إبراز معنى اللقب.
- issue: علاقة βασιλέα بـ χριστόν
  choice: المسيح، ملكٌ
  alternative: المسيح الملك؛ المسيح، أي ملكًا
  rationale: يبقي الاسمين الخبريين ظاهرين ويحفظ احتمال أن يكون «ملك» وصفًا تفسيريًا أو لقبًا موازيًا، من غير فرض أداة تعريف غير موجودة في اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «الجزية» في معناها السياسي التاريخي مع شرحها، ووُضعت جميع علامات الحواشي في المتن.
