  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: ar
  text: 'وبدأوا يتهمونه قائلين: «وجدنا هذا الرجل يُضلِّل شعبنا[a]، ويمنعنا من دفع الضرائب لقيصر[b]، ويقول إنه هو نفسه المسيح، ملكًا[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُفسد شعبنا» أو «يُضلّ شعبنا عن الطريق».'
