  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: ar
  text: 'لكنهم صرخوا جميعًا قائلين: «أَبْعِدْ هذا، وأطلق لنا باراباس!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: صرخوا
  rationale: يفيد الفعل إطلاق صيحة عالية، و«صرخوا» تعبير عربي طبيعي يحفظ شدة النداء.
- source_word: δὲ
  choice: لكنهم
  rationale: تفيد الأداة هنا انتقالًا تقابليًا مع كلام بيلاطس السابق، ولذلك نُقلت بـ«لكن» مع ضمير الجمع الملائم للسياق.
- source_word: παμπληθεὶ
  choice: جميعًا
  rationale: تفيد مشاركة الجماعة كلها في الصراخ، و«جميعًا» تنقل المعنى بوضوح من غير إضافة صورة «بصوت واحد» التفسيرية.
- source_word: λέγοντες
  choice: قائلين
  rationale: تنقل اسم الفاعل اليوناني الذي يقدم مضمون الصراخ بصياغة عربية فصيحة ومألوفة.
- source_word: Αἶρε
  choice: أَبْعِدْ
  rationale: الأمر من αἴρω يعني هنا إزالة الشخص من أمامهم أو التخلص منه؛ و«أَبْعِدْ» يحفظ قوة الطلب من غير أن يصرح بطريقة الإزالة أو بنتيجتها.
- source_word: τοῦτον
  choice: هذا
  rationale: يحفظ اسم الإشارة المذكر وقوته الإشارية، كما أن استعماله مستقلًا طبيعي في هذا السياق ويحافظ على نبرة الازدراء المحتملة من غير زيادتها بلفظ غير موجود.
- source_word: ἀπόλυσον
  choice: أطلق
  rationale: يفيد الإفراج من الحبس، و«أطلق» ملائم للسياق القضائي ومألوف في العربية.
- source_word: ἡμῖν
  choice: لنا
  rationale: 'تنقل دلالة المستفيد في صياغة عربية طبيعية: «أطلق لنا».'
- source_word: τὸν Βαραββᾶν
  choice: باراباس
  rationale: نقل صوتي للاسم الشخصي وفق صورته اليونانية والاستعمال العربي الكتابي الشائع.
theological_decisions:
- issue: مدى دلالة الأمر Αἶρε على القتل
  choice: أَبْعِدْ هذا
  alternative: اقتل هذا / تخلَّص من هذا
  rationale: السياق قد يوحي بأن الإبعاد ينتهي إلى الإعدام، لكن الفعل نفسه لا يصرح بالقتل؛ لذا حُفظ مجال الدلالة دون حسم تفسيري زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على الإيجاز والانفعال في صيحة الجمع. لم تُضف حاشية لأن «أَبْعِدْ هذا» تنقل البديل الدلالي المقصود مباشرة ولا توجد علامة حاشية لازمة في النص العربي.
