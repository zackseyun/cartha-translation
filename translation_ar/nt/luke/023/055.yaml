source:
  edition: SBLGNT
  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: ar
  text: وتبعت النساء اللواتي كنَّ قد أتين معه من الجليل، فرأين القبر وكيف وُضع جسده.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كنَّ قد رافقنه من الجليل».'
    reason: بديل معجمي لعبارة συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ.
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: وتبعت
  rationale: اسم الفاعل الأوريستي يدل على فعل سبق فعل الرؤية في تسلسل السرد؛ وصيغة الفعل الماضي مع العطف طبيعية في العربية وتحفظ هذا التسلسل.
- source_word: δέ
  choice: الواو في «وتبعت»
  rationale: أداة انتقال سردي خفيف، وتنقلها الواو العربية دون إضافة ظرف زمني غير موجود في النص.
- source_word: αἱ γυναῖκες
  choice: النساء
  rationale: التعريف يشير إلى جماعة نساء معروفة من السياق.
- source_word: αἵτινες
  choice: اللواتي
  rationale: تحدد ضمير الصلة جماعة النساء ببيان أنهن أتين معه من الجليل.
- source_word: ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: كنَّ قد أتين معه من الجليل
  rationale: يحفظ التركيب الدال على حدث سابق معنى المجيء بصحبته ومنشأ الرحلة من الجليل، من غير تحويله إلى فعل أكثر تفسيرًا مثل «رافقنه».
- source_word: ἐθεάσαντο
  choice: فرأين
  rationale: ينقل فعل المشاهدة المقصودة بعبارة عربية طبيعية، وتوضح الجملة التالية ما عاينه النساء.
- source_word: τὸ μνημεῖον
  choice: القبر
  rationale: هو المقابل العربي الدقيق والمألوف لموضع الدفن في هذا السياق.
- source_word: ὡς
  choice: كيف
  rationale: تدخل على بيان الكيفية التي وُضع بها الجسد.
- source_word: ἐτέθη
  choice: وُضع
  rationale: مبني للمجهول يحفظ معنى τίθημι بلا افتراض تفاصيل إضافية عن هيئة الدفن.
- source_word: τὸ σῶμα αὐτοῦ
  choice: جسده
  rationale: صياغة عربية موجزة وطبيعية للإضافة مع الضمير.
theological_decisions:
- issue: العلاقة الزمنية بين κατακολουθήσασαι والفعل الرئيس ἐθεάσαντο
  choice: 'صيغ الفعلان في تسلسل سردي: «وتبعت... فرأين»'
  alternative: «وبعد أن تبعت... رأت» أو «إذ تبعت... رأت»
  rationale: يحفظ هذا الاختيار تقدم الاتباع على الرؤية بصورة طبيعية، من غير تحميل اسم الفاعل دلالة سببية أو لاهوتية إضافية.
- issue: دلالة συνεληλυθυῖαι αὐτῷ
  choice: «كنَّ قد أتين معه»
  alternative: «كنَّ قد رافقنه»
  rationale: يحافظ الاختيار على صورة المجيء مع يسوع من الجليل، بينما «رافقنه» بديل دلالي ممكن لكنه أكثر تجريدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم جمع المؤنث في الأفعال والموصول، ونُقل الانتقال السردي الخفيف بالواو، مع الفاء لإظهار تعاقب الاتباع والرؤية. وُضعت علامة الحاشية [a] في المتن كما يلزم.
