  verdict: approve
  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: النساء المعروفات في السياق، ومجيئهن السابق مع يسوع من الجليل، واتباعهن، ورؤيتهن القبر وطريقة وضع جسده. وصيغة «وتبعت النساء ... فرأين» تمثل بصورة سليمة تعاقب اسم الفاعل κατακολουθήσασαι والفعل الرئيس ἐθεάσαντο، من غير إضافة سبب أو تفصيل غير واردين.'
  naturalness: الصياغة فصحى حديثة واضحة ومناسبة للسرد الوقور. يجوز في العربية أن يأتي الفعل المؤنث المفرد «تبعت» قبل فاعله الجمع «النساء»، ثم يعود جمع المؤنث في «رأين». واستعمال «كيف وُضع جسده» طبيعي ودقيق.
  terminology: «القبر» مناسب لـ μνημεῖον في سياق الدفن، و«جسده» و«وُضع» يحفظان الإحالة والـمبني للمجهول. أما «كنَّ قد أتين معه من الجليل» فيحافظ على معنى المجيء معَه ومن الجليل دون توسيع تفسيري. الحاشية تقدم البديل «رافقنه» بوضوح ولا تفرضه على المتن.
