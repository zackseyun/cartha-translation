  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: ar
  text: 'وقال: «يا يسوع، اذكرني حين تأتي في ملكوتك».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ مخطوطات كثيرة: «إلى ملكوتك»، أما نص SBLGNT فيقرأ حرفيًا: «في ملكوتك».'
    reason: إثبات القراءة البديلة وبيان دلالة حرف الجر في النص المعتمد.
lexical_decisions:
- source_word: καὶ
  choice: وقال
  rationale: حُفظ الربط السردي بالواو من غير إضافة دلالة زمنية مثل «ثم» لا يفرضها النص.
- source_word: ἔλεγεν
  choice: قال
  rationale: الفعل في صيغة الماضي الناقص، لكنه يُستعمل هنا استعمالًا سرديًا طبيعيًا لتقديم القول؛ و«قال» أفصح في العربية من ترجمة الاستمرار ترجمة حرفية.
- source_word: Ἰησοῦ
  choice: يا يسوع
  rationale: الاسم في صيغة النداء، فأُظهرت أداة النداء التي تقتضيها العربية الطبيعية.
- source_word: μνήσθητί μου
  choice: اذكرني
  rationale: ينقل الطلب المباشر بوضوح، مع إبقاء ما قد يتضمنه السياق من التماس العناية أو الإحسان دون التصريح به في المتن.
- source_word: ὅταν ἔλθῃς
  choice: حين تأتي
  rationale: تدل العبارة مع صيغة الاحتمال اليونانية على حدث مستقبلي منتظر؛ و«حين تأتي» صياغة عربية طبيعية لا تزيد تحديدًا زمنيًا على النص.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: في ملكوتك
  rationale: تتبع حرف الجر ἐν في نص SBLGNT وتحفظ احتمال أن يكون المعنى المجيء في نطاق الملكوت أو بصفة الملك، من غير تحويله صراحة إلى حركة «إلى داخل».
- source_word: βασιλείᾳ
  choice: ملكوت
  rationale: «ملكوت» مقابل عربي راسخ ومفهوم في هذا السياق، ويمكن أن يدل على المُلك والسلطان وكذلك على المجال الملكي.
theological_decisions:
- issue: الدلالة الأخروية لطلب المصلوب من يسوع
  choice: يطلب المتكلم من يسوع أن يذكره حين يأتي في ملكوته، من غير تحديد توقيت ذلك أو بناء تصور أخروي مفصل.
  alternative: قد تُفهم العبارة على أنها مجيء يسوع بسلطانه الملكي، أو دخوله إلى ملكوته، أو ظهوره في الملكوت المكتمل.
  rationale: ينسب النص إلى يسوع ملكوتًا ومجيئًا منتظرًا، لكنه لا يحسم هنا كيفية ذلك المجيء أو تسلسله الزمني؛ لذلك حُفظ الاتساع الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعمل «يا يسوع» لإظهار النداء، و«في ملكوتك» لموافقة نص SBLGNT مع توثيق القراءة المخطوطية البديلة في الحاشية.
