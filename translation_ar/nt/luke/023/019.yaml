lexical_decisions:
- source_word: ὅστις
  choice: وكان
  rationale: يعود الضمير الموصول إلى باراباس المذكور في السياق؛ وصياغة «وكان قد» تصل الجملة بما قبلها طبيعيًا في العربية.
- source_word: διὰ
  choice: بسبب
  rationale: تفيد مع النصب العلة أو السبب هنا، و«بسبب» واضحة وطبيعية.
- source_word: στάσιν
  choice: فتنة
  rationale: تدل هنا على اضطراب مدني عنيف أو تمرد؛ و«فتنة» لفظ عربي مفهوم يتسع للاضطراب والعصيان، مع بيان البدائل السياسية الأصرح في الحاشية.
- source_word: τινὰ
  choice: فتنةٍ
  rationale: التنكير في العربية ينقل عدم التحديد الذي تفيده τις، من غير حاجة إلى «معينة» التي قد توحي بأنها معلومة.
- source_word: γενομένην ἐν τῇ πόλει
  choice: حدثت في المدينة
  rationale: ينقل العبارة الوصفية بوضوح، مع إبقاء المدينة غير مسماة كما في اليونانية.
- source_word: φόνον
  choice: جريمة قتل
  rationale: ينقل معنى القتل الجنائي، لا مجرد إزهاق النفس، ويلائم السياق القضائي.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: قد أُلقي في السجن
  rationale: يحافظ على قوة الفعل المبني للمجهول وعلى معنى الإيداع القسري في السجن.
