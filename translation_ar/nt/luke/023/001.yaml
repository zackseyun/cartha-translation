  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: ar
  text: فنهض جمعهم كلُّه وقادوه إلى بيلاطس.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فنهض جمهورهم كلُّه وقادوه إلى بيلاطس».'
    reason: بديل معجمي لكلمة πλῆθος، التي قد تدل على جمع أو جمهور.
lexical_decisions:
- source_word: Καὶ
  choice: فـ
  rationale: أداة ربط سردية تصل هذا الحدث بما قبله وتفيد التعاقب الطبيعي من غير إضافة تفسيرية.
- source_word: ἀναστὰν
  choice: قام
  rationale: اسم فاعل ماضٍ يفيد فعلاً سابقًا للفعل الرئيس؛ وصيغة «فقام» عربية طبيعية تحفظ ترتيب الحدثين.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: جمعهم كلُّه
  rationale: «الجمع» ينقل معنى πλῆθος بوصفه جماعة مجتمعة من غير أن يجعله هيئة رسمية محددة أو حشدًا عشوائيًا، و«كلّه» تحفظ قوة ἅπαν، والضمير يحفظ αὐτῶν.
- source_word: ἤγαγον
  choice: اقتادوه
  rationale: الفعل ἄγω يعني قاد أو أحضر؛ و«اقتادوه» يلائم سياق سوق يسوع تحت الحراسة إلى الحاكم، من غير أن يضيف ما يتجاوز السياق.
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير المفعول به العائد إلى يسوع، أُلحق بالفعل على النحو العربي الطبيعي.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: إلى بيلاطس
  rationale: ἐπί مع النصب بعد فعل حركة يدل على الاتجاه نحو شخص؛ و«إلى» هي المقابل العربي المباشر والطبيعي.
- source_word: Πιλᾶτον
  choice: بيلاطس
  rationale: الصيغة العربية الشائعة للاسم الشخصي Pilate.
theological_decisions:
- issue: توصيف الجماعة في السياق القضائي
  choice: جمعهم كلّه
  alternative: جمهورهم كلّه؛ جماعتهم كلّها
  rationale: يحفظ الاختيار الدلالة الجماعية للكلمة اليونانية من غير أن يحدد رسميًا طبيعة الهيئة أو يصورها جمهورًا عشوائيًا، وبذلك يبقي مقدار التحديد الموجود في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «اقتادوه» لتصوير الحركة إلى بيلاطس في هذا السياق القضائي، مع إبقاء «إلى» بدل التفسير الأوسع «أمام».
