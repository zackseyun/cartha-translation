  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: ar
  text: أَمَّا هُمْ فَظَلُّوا يُلِحُّونَ بِأَصْوَاتٍ عَالِيَةٍ[a]، طَالِبِينَ أَنْ يُصْلَبَ، وَغَلَبَتْ أَصْوَاتُهُمْ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكانت أصواتهم تزداد غَلَبَةً». وتُكرِّر اليونانية كلمة «أصوات» في شطري الآية، ويمكن في هذا السياق ترجمتها أيضًا بـ«صيحات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέκειντο
  choice: ظَلُّوا يُلِحُّونَ
  rationale: ينقل صيغة الماضي الناقص معنى الاستمرار في الإلحاح والضغط، لا مجرد طلب وقع مرة واحدة.
- source_word: φωναῖς μεγάλαις
  choice: بِأَصْوَاتٍ عَالِيَةٍ
  rationale: تعبير عربي طبيعي يحفظ الدلالة السمعية وطريقة إلحاحهم، من غير تخصيص φωνή بمعنى الصراخ وحده.
- source_word: αἰτούμενοι
  choice: طَالِبِينَ
  rationale: يحفظ المعنى المعجمي الأساسي للطلب، بينما يتولى الفعل السابق إظهار شدة الإلحاح.
- source_word: αὐτὸν σταυρωθῆναι
  choice: أَنْ يُصْلَبَ
  rationale: ينقل بوضوح تركيب المفعول مع المصدر ويحفظ المبني للمجهول، والضمير مفهوم من السياق العربي.
- source_word: κατίσχυον
  choice: غَلَبَتْ
  rationale: يفيد أن أصواتهم كانت هي التي رجحت وغلبت في مجرى القضية؛ والماضي العربي أنسب سرديًا، مع بيان الدلالة الاستمرارية المحتملة في الحاشية.
- source_word: αἱ φωναὶ αὐτῶν
  choice: أَصْوَاتُهُمْ
  rationale: يحفظ تكرار لفظ φωνή في شطري الآية، وهو تكرار مقصود يبرز أثر أصواتهم.
