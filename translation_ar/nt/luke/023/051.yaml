  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: ar
  text: هذا الرجل لم يكن قد وافق على قرارهم وعملهم. وكان من الرامة، وهي مدينة من مدن اليهود، وكان ينتظر ملكوت الله.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συγκατατεθειμένος
  choice: قد وافق
  rationale: مع النفي والتركيب المحيطي ἦν ... συγκατατεθειμένος يدل على موقف سابق ثابت من عدم الموافقة؛ و«وافق» عربي واضح وطبيعي دون افتراض إجراء تصويت محدد.
- source_word: βουλῇ
  choice: قرارهم
  rationale: يشير السياق إلى ما انتهى إليه تدبير القادة ومشورتهم، لا إلى هيئة المجلس نفسها؛ و«قرارهم» يحفظ هذا المعنى بوضوح.
- source_word: πράξει
  choice: ما فعلوه
  rationale: يميز التعبير بين القرار وتنفيذه الفعلي، و«ما فعلوه» أفصح وأيسر للقارئ العام من «فعلهم» في هذا السياق.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: من الرامة، وهي مدينة لليهود
  rationale: يحافظ على البنية التفسيرية اليونانية وعلى العبارة «مدينة لليهود» من غير تحويلها إلى تحديد جغرافي أو عرقي أضيق لا يصرح به النص.
- source_word: προσεδέχετο
  choice: كان ينتظر
  rationale: ينقل صيغة الماضي الناقص بوصفها انتظارًا مستمرًا مشوبًا بالتطلع، من غير الإيحاء ببحث مادي نشط.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي راسخ وواضح في إنجيل لوقا، ويحفظ الثقل اللاهوتي لعبارة «ملكوت الله».
- source_word: οὗτος
  choice: هذا
  rationale: يستأنف الإشارة المؤكدة إلى يوسف المذكور في الآية السابقة، ويحافظ على بروز اسم الإشارة في اليونانية.
theological_decisions:
- issue: طبيعة انفصال يوسف عن دور المجلس في موت يسوع
  choice: لم يكن قد وافق على قرارهم وما فعلوه
  alternative: لم يوافق على مشورتهم وفعلهم؛ أو لم يصوّت لمصلحة قرارهم
  rationale: النص يثبت عدم موافقته على βουλή وπρᾶξις، لكنه لا يحدد آلية تصويت ولا يقدم تقريرًا عقائديًا أوسع؛ لذلك تحافظ الصياغة على عدم مشاركته من غير إضافة إعادة بناء تاريخية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «الرامة» بوصفها الصيغة العربية التقليدية لاسم أريماثية، مع جملة تفسيرية طبيعية. لا توجد حاشية لازمة، لأن البديل الإنجليزي المذكور يشرح الألفاظ نفسها ولا يخص اسم المدينة، كما أن المعنى أمكن تمثيله مباشرة في المتن.
