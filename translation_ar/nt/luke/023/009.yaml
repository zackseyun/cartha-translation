lexical_decisions:
- source_word: ἐπηρώτα
  choice: أخذ يسأله
  rationale: صيغة الماضي الناقص تدل على سؤال متواصل أو متكرر، و«أخذ يسأله» تنقل هذا الجانب بعبارة عربية طبيعية.
- source_word: δὲ
  choice: فـ / أمّا
  rationale: الأولى رابط سردي خفيف نقلته الفاء، والثانية تبرز المقابلة بين إلحاح هيرودس وصمت يسوع، فنُقلت بـ«أمّا».
- source_word: ἐν λόγοις ἱκανοῖς
  choice: بإسهاب
  rationale: التعبير اليوناني حرفيًا قريب من «بكلام كثير»، ويدل في السياق على إطالة الاستجواب؛ و«بإسهاب» تؤدي المعنى بوضوح وطبيعية مع إبقاء البدائل في الحاشية.
- source_word: αὐτὸς
  choice: هو
  rationale: الضمير بارز قليلًا في اليونانية، وقد حُفظ توكيده ومقابلته بواسطة تركيب «أمّا هو».
- source_word: οὐδὲν ἀπεκρίνατο αὐτῷ
  choice: فلم يجبه بشيء
  rationale: ترجمة مباشرة وطبيعية تفيد أنه لم يقدم له أي جواب، مع إظهار المفعول غير المباشر αὐτῷ.
