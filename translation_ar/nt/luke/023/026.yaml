  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: ar
  text: وبينما كانوا يقتادونه، أمسكوا برجلٍ من قورينة اسمه سمعان، كان آتيًا من الريف[a]، ووضعوا عليه الصليب[b] ليحمله خلف يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «من الحقل». قد تشير الكلمة اليونانية إلى حقل بعينه أو، بصورة أعم، إلى الريف خارج المدينة.
    reason: lexical_alternative
  - marker: b
    text: يفهم بعضهم «الصليب» هنا بمعنى أخص، أي «عارضة الصليب»، لكن النص اليوناني يقول ببساطة «الصليب».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: يقتادونه
  rationale: يفيد الفعل قيادة يسوع إلى موضع آخر وهو تحت سلطتهم؛ و«يقتادونه» عربية طبيعية وتحفظ معنى الإكراه في السياق.
- source_word: ἐπιλαβόμενοι
  choice: أمسكوا
  rationale: يدل اسم الفاعل على الإمساك بالشخص وأخذه، و«أمسكوا» واضحة من غير مبالغة في مقدار العنف الذي لا يحدده اللفظ وحده.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: سمعانَ، رجلًا من القيروان
  rationale: تنقل τινα بوصفه شخصًا غير معرّف سابقًا، وتعبّر عن Κυρηναῖον بنسبة سمعان إلى مدينة القيروان بصياغة عربية واضحة.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: كان آتيًا من الريف
  rationale: يمكن أن يعني ἀγρός حقلًا بعينه أو المنطقة الريفية خارج المدينة؛ واختيار «الريف» يلائم السياق المكاني مع حفظ البديل في الحاشية.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: وضعوا عليه الصليب
  rationale: ينقل معنى وضع الحمل على سمعان بصياغة عربية مباشرة، من غير إضافة تفصيل غير مذكور.
- source_word: τὸν σταυρὸν
  choice: الصليب
  rationale: هذا هو المقابل المباشر لـσταυρός؛ ولا يخصصه النص اليوناني بأنه عارضة الصليب.
- source_word: φέρειν
  choice: ليحمله
  rationale: ينقل الغرض من وضع الصليب عليه ومعنى الحمل المادي بوضوح.
- source_word: ὄπισθεν τοῦ Ἰησοῦ
  choice: خلف يسوع
  rationale: يحفظ الدلالة المكانية الأساسية لـὄπισθεν في مشهد السير.
theological_decisions:
- issue: هل يُخصَّص σταυρός بمعنى عارضة الصليب في رواية الصلب؟
  choice: الصليب
  alternative: عارضة الصليب
  rationale: النص يستعمل اللفظ العام σταυρός ولا يذكر لفظًا خاصًا بالعارضة؛ لذا تُحفظ صياغة المصدر ولا يُفرض عليه تصور تاريخي أكثر تحديدًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «يقتادونه» لإظهار كونه تحت الحراسة، و«أمسكوا» لتجنب تشديد غير لازم، وحُفظ الاحتمال المعجمي في ἀγρός والحذر من تخصيص σταυρός في الحواشي.
