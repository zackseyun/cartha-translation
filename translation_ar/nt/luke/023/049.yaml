lexical_decisions:
- source_word: εἱστήκεισαν
  choice: كانوا واقفين
  rationale: ينقل صيغة الماضي التام ذات الدلالة الاستمرارية بوصفها هيئة متواصلة في المشهد، لا فعل وقوف لحظي.
- source_word: δὲ
  choice: لكنَّ
  rationale: تشير الأداة إلى انتقال يتضمن مقابلة خفيفة مع المشهد السابق، و«لكنَّ» تؤدي ذلك بوضوح.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: جميعَ الذين كانوا يعرفونه
  rationale: يحافظ التعبير على سعة γνωστοί، فلا يحصرهم في الأصدقاء المقرّبين، ويأتي طبيعيًّا في العربية المعاصرة.
- source_word: μακρόθεν
  choice: من بعيد
  rationale: تعبير عربي طبيعي يدل بوضوح على البعد المكاني.
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ
  choice: النساءَ اللواتي تبعنه
  rationale: التعريف يحدد جماعة النساء المعروفة من السياق، والفعل يصور صحبتهن السابقة والممتدة ليسوع.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: من الجليل
  rationale: ينقل ببساطة موضع بدء اتباعهن ومرافقتهن له.
- source_word: ὁρῶσαι ταῦτα
  choice: يشاهدون هذه الأمور
  rationale: يعبر «يشاهدون» عن المعاينة المستمرة، وتحافظ «هذه الأمور» على جمع اسم الإشارة في اليونانية؛ وجاء الفعل بصيغة جمع المذكر لأنه يعود إلى المجموعتين معًا.
