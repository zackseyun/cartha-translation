  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: ar
  text: وكان الوقت قد بلغ نحو الساعة السادسة[a]، فحلّ الظلام على كل البلاد[b] حتى الساعة التاسعة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي نحو الظهر؛ واستمر الظلام حتى نحو الساعة الثالثة بعد الظهر.
    reason: cultural_note
  - marker: b
    text: 'أو: «الأرض كلها». يمكن أن تعني الكلمة اليونانية γῆ «البلاد» أو «الأرض».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: قد
  rationale: تفيد أن السرد بلغ هذا الوقت بالفعل، وتؤدي «قد» هذا المعنى طبيعيًا مع الفعل «قارب» من غير إثقال العبارة.
- source_word: ὡσεὶ
  choice: قارب
  rationale: يحفظ معنى التقريب الزمني، وهو تعبير عربي طبيعي في هذا السياق.
- source_word: ὥρα ἕκτη
  choice: الساعة السادسة
  rationale: يحافظ على طريقة حساب الساعات في النص اليوناني، مع بيان مقابلها الزمني الحديث في الحاشية.
- source_word: σκότος
  choice: الظلام
  rationale: المقابل العربي المباشر والواضح للاسم اليوناني في هذا السياق.
- source_word: ἐγένετο
  choice: حلّ
  rationale: تعبير عربي فصيح وطبيعي عن وقوع الظلام، ويحفظ القوة الحدثية للفعل.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: على الأرض كلها
  rationale: لفظة γῆ تحتمل «الأرض» بمعنى الإقليم أو اليابسة، كما تحتمل «العالم/الكرة الأرضية». تحافظ «الأرض» على هذا الاتساع الدلالي في العربية، وتوضح الحاشية الاحتمالين.
- source_word: ἕως ὥρας ἐνάτης
  choice: حتى الساعة التاسعة
  rationale: يحافظ على التعبير الزمني الأصلي واتساقه مع «الساعة السادسة»، وتبيّن الحاشية الزمن الحديث المقابل.
theological_decisions:
- issue: نطاق γῆ في خبر الظلام
  choice: الأرض كلها
  alternative: البلاد كلها / العالم كله
  rationale: لا تحسم اليونانية هل المقصود نطاق إقليمي أم الأرض بمعناها الأوسع. اختيرت «الأرض» لأنها طبيعية وتحافظ نسبيًا على الغموض، مع حاشية تصرّح بالاحتمال الدلالي بدل فرض نطاق محلي أو كوني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ نظام عدّ الساعات القديم في المتن، مع شرحه في الحاشية، واستُعملت «الأرض» لإبقاء نطاق الظلام مفتوحًا كما يسمح به الأصل.
