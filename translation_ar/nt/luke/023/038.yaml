base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: ar
  text: 'وكانت فوقه أيضًا كتابة[a][b]: «هذا هو ملك اليهود».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لافتة»، أو «بيان مكتوب»، أو «تهمة مكتوبة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عليه» أو «في أعلاه».'
    reason: lexical_alternative
  - marker: c
    text: 'اليونانية حرفيًا: «ملك اليهود، هذا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: نقش
  rationale: يدل على كتابة مثبتة على الصليب أو فوق المصلوب. و«نقش» لفظ عربي موجز ورسمي، مع بيان البدائل الممكنة في الحاشية.
- source_word: ἐπ’ αὐτῷ
  choice: فوقه
  rationale: يفيد الموضع بالنسبة إلى يسوع في سياق لافتة الصلب، و«فوقه» تعبير طبيعي لا يحدد طريقة تثبيتها بأكثر مما يسمح به النص.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: هذا هو ملك اليهود
  rationale: العبارة اليونانية اسمية بلا فعل مصرح به، وفيها اسم الإشارة للتوكيد؛ والصياغة العربية تحافظ على ذلك بوضوح وطبيعية.
- source_word: Ἰουδαίων
  choice: اليهود
  rationale: هذا هو المعنى التقليدي والملائم سياقيًا في لقب الصلب الثابت، مع أن اللفظ قد يعني «اليهوديين» في سياقات أخرى.
- source_word: δὲ καὶ
  choice: وكان ... أيضًا
  rationale: تنقل الاستمرار السردي والقوة الإضافية للتركيب اليوناني بأسلوب عربي سلس.
theological_decisions:
- issue: طبيعة الكتابة المثبتة عند الصلب
  choice: إيراد النص بوصفه نقشًا يعرّف يسوع بأنه «ملك اليهود» دون تفسير إضافي
  alternative: صياغته كتهمة قانونية صريحة أو إظهار السخرية أو الدلالة المسيانية في متن الترجمة
  rationale: الآية نفسها تخبر بوجود الكتابة وتنقل ألفاظها، ولا تصرح هنا بطبيعتها القانونية أو بمغزاها الساخر أو اللاهوتي؛ لذلك تُحفظ هذه المساحة التفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «يقول» لإدخال مضمون النقش على نحو طبيعي في العربية، وهو مفهوم من وظيفة الكتابة لا إضافة تفسيرية. أُبقي لقب «ملك اليهود» بصيغته المألوفة والملائمة للسياق.
