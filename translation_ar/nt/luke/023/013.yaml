  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: ar
  text: فجمع بيلاطس رؤساء الكهنة والحكّام والشعب،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: بيلاطس
  rationale: النقل العربي المعياري للاسم اليوناني، والمتداول في الترجمات العربية.
- source_word: δὲ
  choice: فـ
  rationale: تفيد انتقالًا سرديًا خفيفًا مع وصل هذا الفعل بما سبقه؛ والفاء طبيعية وموجزة في العربية، من غير أن تضيف معنى تعارض قويًا.
- source_word: συγκαλεσάμενος
  choice: جمع
  rationale: اسم الفاعل اليوناني يدل على أن بيلاطس استدعاهم ليجتمعوا قبل أن يخاطبهم. صيغة «جمع» تؤدي هذا المعنى طبيعيًا في العربية وتحافظ على تسلسل الحدثين مع الآية التالية.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: تشير صيغة الجمع في استعمال العهد الجديد إلى كبار السلطات الكهنوتية، لا إلى وجود عدة شاغلين لمنصب رئيس الكهنة المفرد في وقت واحد.
- source_word: ἄρχοντας
  choice: الحكّام
  rationale: تدل على أصحاب السلطة والرئاسة في هذا السياق؛ و«الحكّام» تحفظ الدلالة الرسمية بصورة واضحة.
- source_word: λαὸν
  choice: الشعب
  rationale: يحمل اللفظ معنى جماعيًا أوسع من مجرد «الجمع»، ولذلك تحافظ «الشعب» على سعة المرجع الممكنة.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. اختير الفعل الماضي المتسلسل بدل تركيب «إذ جمع» أو «بعد أن جمع» لأن الجملة تمتد نحويًا إلى الآية التالية، ولأن الفاء مع الماضي تؤدي الانتقال والتتابع بسلاسة. لا توجد حواشٍ في هذه الآية.
