  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: ar
  text: فإن كانوا يفعلون هذه الأمور في الخشب الأخضر[a][b]، فماذا سيحدث في الخشب اليابس؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصورة أقرب إلى تركيب اليونانية: «في الخشب الأخضر... في الخشب اليابس».'
    reason: بديل لفظي يبيّن الصياغة الأكثر حرفية لحرف الجر والصورة.
  - marker: b
    text: 'يبدو أن الصورة تنتقل من الأخف إلى الأشد: فإذا كانت هذه الأمور تُفعل في الخشب الأخضر، فماذا سيحدث في الخشب اليابس؟ ولا يحدد النص صراحةً مَن يمثله كل منهما.'
    reason: إيضاح للصورة المثلية مع الحفاظ على عدم حسم مراجعها.
lexical_decisions:
- source_word: ὅτι
  choice: فـ
  rationale: تؤدي الفاء هنا معنى التعليل المتصل بما سبق على نحو طبيعي في العربية، من غير إثقال العبارة بـ«لأن» قبل جملة الشرط.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: بالخشب الأخضر
  rationale: تحافظ العبارة على صورة الخشب غير اليابس، وتستعمل «الأخضر» بالمعنى العربي المألوف للخشب الطري الذي لم يجف، مع إبقاء دلالة ἐν المرنة في هذا المثل بواسطة الباء.
- source_word: ὑγρῷ
  choice: الأخضر
  rationale: يمكن أن تعني الكلمة «الرطب» أو «النديّ»، لكن مقابلتها بـξηρός تجعل «الأخضر» وصفًا طبيعيًا للخشب غير الجاف والقليل القابلية للاشتعال.
- source_word: ξύλῳ
  choice: الخشب
  rationale: للكلمة دلالات منها الخشب والشجرة والعود. والمقابلة بين الأخضر واليابس ترجّح المادة الخشبية من غير تخصيص الصورة بشجرة بعينها.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: تحافظ الصياغة على جمع اسم الإشارة، وتترك نطاق الإشارة مفتوحًا كما في اليونانية.
- source_word: ποιοῦσιν
  choice: يفعلون
  rationale: يحافظ المضارع والجمع على الفعل وعلى فاعله غير المصرح به تحديدًا في الأصل، من غير تعيين هوية القائمين به.
- source_word: ἐν τῷ ξηρῷ
  choice: باليابس
  rationale: تقابل «بالخشب الأخضر» بإيجاز، ويُفهم الموصوف المحذوف، أي الخشب، فهمًا طبيعيًا في العربية.
- source_word: τί γένηται
  choice: فماذا سيحدث؟
  rationale: ينقل السؤال البلاغي النتيجة المرتقبة بوضوح، بينما تعبّر صيغة المستقبل عن التوقع الذي تؤديه صيغة الاحتمال اليونانية في هذا السياق.
theological_decisions:
- issue: تحديد مدلول الخشب الأخضر والخشب اليابس
  choice: الإبقاء على الصورة المجازية بلا تعيين لمرجع كل طرف في المتن
  alternative: تفسير الخشب الأخضر بأنه يسوع، واليابس بأنه أورشليم أو شعبها؛ أو عرضه مثلًا عامًا ينتقل من الأخف إلى الأشد
  rationale: يرجح أن القول ينذر بما هو أشد آتيًا، لكن النص لا يصرح بمرجعي طرفي الصورة. لذلك تُحفظ دلالته المفتوحة وتوتره اللاهوتي من غير إدخال تفسير خاص في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. اختيرت صياغة موجزة تحافظ على السؤال البلاغي والصورة الأصلية، وتستعمل «الخشب الأخضر/اليابس» بوصفهما تعبيرين مفهومين من غير شرح تفسيري داخل المتن.
