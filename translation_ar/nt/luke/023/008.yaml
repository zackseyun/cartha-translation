id: LUK.23.8
reference: Luke 23:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: ar
  text: ولما رأى هيرودس يسوع، فرح جدًا، لأنه كان منذ زمن طويل يريد أن يراه، إذ كان يسمع عنه[a]، وكان يرجو أن يرى آيةً ما يجريها يسوع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «إذ كان قد سمع عنه». وصيغة المضارع في اليونانية قد توحي بسماع متكرر أو مستمر.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «معجزةً ما». واللفظ اليوناني يعني «آية»، وقد يدل على عمل خارق يُنظر إليه بوصفه علامة ذات دلالة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρη λίαν
  choice: فرح جدًا
  rationale: ينقل معنى الفرح وشدة λίαν بعبارة عربية واضحة وطبيعية.
- source_word: ἐξ ἱκανῶν χρόνων
  choice: منذ زمن طويل
  rationale: يعبّر عن امتداد المدة من غير تخصيصها بسنوات لا يذكرها النص.
- source_word: θέλων ἰδεῖν αὐτόν
  choice: يريد أن يراه
  rationale: يحافظ على معنى الرغبة المستمرة في التركيب اليوناني.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: إذ كان يسمع عنه
  rationale: يفيد السبب، ويعكس صيغة المضارع احتمال السماع المتكرر أو المستمر.
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: كان يرجو أن يرى آيةً ما
  rationale: يحفظ معنى الرجاء في ἐλπίζω والمجال الدلالي لكلمة σημεῖον بوصفها علامة ذات دلالة، لا مجرد عمل خارق.
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: يجريها يسوع
  rationale: صياغة عربية طبيعية توضّح أن يسوع هو فاعل الآية، مع الحفاظ على معنى وقوعها بواسطته.
- source_word: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν
  choice: ولما رأى هيرودس يسوع
  rationale: تنقل δέ بواو السرد، وتجعل علاقة اسم الفاعل الظرفية بالفعل الرئيس واضحة وطبيعية في العربية.
theological_decisions:
- issue: دلالة σημεῖον
  choice: آية
  alternative: معجزة
  rationale: «آية» تحافظ على كون الفعل الخارق علامةً ذات دلالة، بينما «معجزة» قد تحصر المعنى في طبيعته الخارقة وحدها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «ولما» للسرد الطبيعي، و«آية» لصون الدلالة الأوسع للمصطلح اليوناني، مع تجنب التراكيب الحرفية الثقيلة.
