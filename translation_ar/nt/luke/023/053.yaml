  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: ar
  text: وأنزله، ولفَّه بقطعة من الكتّان، ووضعه في قبر منحوت في الصخر[a]، لم يكن أحد قد وُضع فيه بعد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قبر منحوت»، أو «قبر محفور في الصخر».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لم يكن أحد قد اضطجع فيه قط».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: وأنزله
  rationale: اسم فاعل ظرفي من καθαιρέω يدل هنا على إنزال جسد يسوع قبل لفّه ووضعه في القبر. صيغ بالعطف في العربية لتتابع الأفعال بوضوح، من غير إضافة ذكر الصليب غير المصرح به في الآية.
- source_word: ἐνετύλιξεν
  choice: ولفَّه
  rationale: ينقل معنى إحاطة الجسد بالقماش بعبارة عربية واضحة وطبيعية، من غير إضافة تفاصيل عن طريقة التكفين.
- source_word: σινδόνι
  choice: بقطعة من الكتّان
  rationale: الاسم يدل على نسيج أو قطعة قماش كتانية، وحالة المجرور تفيد الوسيلة. تجنبت كلمة «كفن» لأنها أكثر تفسيرًا من اللفظ اليوناني.
- source_word: ἔθηκεν
  choice: ووضعه
  rationale: فعل عربي مباشر ودقيق لمعنى τίθημι في سياق وضع الجسد في القبر.
- source_word: μνήματι
  choice: في قبر
  rationale: ينقل معنى موضع الدفن، وهو التعبير العربي المألوف والمناسب للسياق التاريخي.
- source_word: λαξευτῷ
  choice: منحوت في الصخر
  rationale: يفيد أن القبر نُحت أو قُطع في مادة صخرية، وهي صياغة واضحة لا تستخدم لفظًا عتيقًا.
- source_word: οὗ
  choice: فيه
  rationale: يعود الضمير على القبر ويؤدي معنى الظرف النسبي «حيث/الذي فيه» بأسلوب عربي طبيعي.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: لم يكن أحد قد وُضع فيه بعد
  rationale: يحافظ على معنى أن القبر لم يُستخدم لدفن أحد إلى ذلك الوقت، مع صياغة عربية ملائمة لسياق الدفن.
theological_decisions:
- issue: وصف الدفن ونوع القبر
  choice: وضع يوسف جسد يسوع في قبر منحوت في الصخر لم يكن أحد قد وُضع فيه بعد.
  alternative: وضعه في قبر منحوت لم يضطجع فيه أحد قط.
  rationale: النص وصفي، فحُفظت تفاصيله التاريخية من غير استيراد معلومات من الروايات الموازية أو إضافة دلالات عقائدية ليست مصرّحًا بها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم تتابع الأفعال المعطوفة بما يلائم السرد العربي، مع إبقاء مرجع الضمائر وتسلسل الدفن واضحين. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرانهما، إذ إن ترتيب العلامات في طبقة الاستشارة الإنجليزية لا يطابق مضمون الحاشيتين.
