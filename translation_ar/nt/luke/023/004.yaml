  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: ar
  text: 'فقال بيلاطس لرؤساء الكهنة والجموع: «لا أجد في هذا الرجل ما يستوجب اتهامه».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا أجد ذنبًا في هذا الرجل». يمكن أن تعني الكلمة اليونانية «ذنبًا» أو «علة»، لكنها تحمل هنا معنى قضائيًا: لا يوجد أساس صحيح للاتهام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تواصل تسلسل السرد طبيعيًا، من غير أن تفرض معنى الاستدراك.
- source_word: Πιλᾶτος
  choice: بيلاطس
  rationale: النقل العربي المألوف للاسم في التقليد الكتابي.
- source_word: εἶπεν πρὸς
  choice: قال ... لـ
  rationale: تعبير عربي طبيعي ودقيق لمخاطبة المذكورين مباشرة.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: التعبير العربي المستقر للقيادة الكهنوتية العليا، ولا يوحي بوجود عدة أشخاص يشغلون منصب رئيس الكهنة في وقت واحد.
- source_word: ὄχλους
  choice: الجموع
  rationale: يحفظ صيغة الجمع اليونانية ويؤدي معنى جماعات الناس الحاضرة.
- source_word: Οὐδὲν εὑρίσκω
  choice: لا أجد ... ما
  rationale: صياغة عربية واضحة تحافظ على زمن التقييم الحاضر وعلى النفي التام.
- source_word: αἴτιον
  choice: ما يستوجب اتهامه
  rationale: ينقل المعنى القضائي، أي عدم وجود سبب صالح يبرر توجيه اتهام، بصورة مفهومة في العربية المعاصرة.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: في هذا الرجل
  rationale: يحافظ على صورة حرف الجر اليونانية ما دامت العبارة العربية واضحة، مع إبراز أن التقييم يتعلق بالرجل نفسه.
