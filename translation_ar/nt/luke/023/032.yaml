  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: ar
  text: وكان يُقتاد معه أيضًا اثنان آخران، وهما مجرمان[a]، ليُقتلا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فاعلو الشر» أو «مرتكبو الجرائم». يشير اللفظ اليوناني إلى أشخاص مذنبين بجرائم أو أفعال شريرة وخاضعين لعقوبة جنائية.'
    reason: lexical_alternative
  - marker: b
    text: 'أي: «ليُعدما». لا يحدد الفعل اليوناني هنا وسيلة القتل، مع أن السياق يبين أنها الصلب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: كانوا يقتادون
  rationale: الفعل في صيغة الماضي الناقص المبني للمجهول يدل على حدث جارٍ في الزمن الماضي. صيغ المبني للمجهول العربية هنا ثقيلة، لذا نُقل المعنى بفاعل عام غير مذكور الهوية، مع الحفاظ على معنى الاقتياد.
- source_word: δὲ
  choice: وَ
  rationale: أداة ربط خفيفة تتابع السرد من غير أن تفيد تعارضًا قويًا.
- source_word: καὶ
  choice: أيضًا
  rationale: 'تفيد الإضافة: لم يكن يسوع وحده هو الذي يُقتاد، بل اقتيد معه آخران.'
- source_word: ἕτεροι
  choice: آخرين
  rationale: تدل على شخصين آخرين غير يسوع، وهذه الصياغة طبيعية وواضحة بالعربية.
- source_word: κακοῦργοι
  choice: من المجرمين
  rationale: تشير إلى مرتكبي أعمال إجرامية خاضعين للعقوبة، ولفظ «المجرمين» واضح ومعاصر من غير تهوين أو مبالغة.
- source_word: δύο
  choice: اثنين
  rationale: نُقل العدد مباشرة، وجاء منصوبًا لوقوعه مفعولًا به لـ«يقتادون».
- source_word: σὺν αὐτῷ
  choice: معه
  rationale: تحافظ على ضمير النص وعلى معنى المصاحبة من غير إضافة اسم غير وارد في الآية نفسها.
- source_word: ἀναιρεθῆναι
  choice: ليُوضَعا تحت حكم الموت
  rationale: يحمل الفعل هنا معنى القتل الرسمي في سياق قضائي. اختيرت صياغة عربية تبين أن المقصود تنفيذ الموت بهما من غير أن تحدد وسيلته في هذا الموضع.
theological_decisions:
- issue: هل تُذكر الصلب صراحة في ترجمة ἀναιρεθῆναι؟
  choice: عدم تحديد وسيلة الموت، واستعمال «ليُوضَعا تحت حكم الموت».
  alternative: ليُصلبا
  rationale: السياق اللاحق يوضح أن الوسيلة هي الصلب، لكن الفعل اليوناني نفسه لا يذكر الصلب تحديدًا؛ لذلك حُفظ عموم اللفظ.
- issue: مدى شمول غاية الاقتياد ليسوع مع الرجلين
  choice: جاء الفعل في المثنى «ليُوضَعا» عائدًا إلى الآخرين المذكورين صراحة بوصفهما مفعول الاقتياد.
  alternative: ليُوضَعوا تحت حكم الموت
  rationale: المصدر اليوناني لا يُظهر عددًا صرفيًا، وتركيب الجملة يجعل الآخرين موضوع العبارة مباشرة، مع بقاء موت يسوع واضحًا من السياق. تجنبت الترجمة فرض جمع صريح قد يبدو تفسيرًا نحويًا زائدًا.
translation_notes:
  register: لغة عربية فصحى واضحة ووقورة. حُفظ سير الحدث في الماضي بعبارة «كانوا يقتادون»، وحُفظ الضمير «معه» كما في الأصل. استُعملت علامتا الحاشية [a] و[b] في موضعيهما داخل النص.
