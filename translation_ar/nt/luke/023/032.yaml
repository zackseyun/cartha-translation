  to: وكان يُقتاد معه أيضًا اثنان آخران، وهما مجرمان[a]، ليُقتلا[b].
  rationale: استُبدلت العبارة التي تفيد الحكم بالموت بعبارة تفيد القتل نفسه، وحُفظ المبني للمجهول وسير الفعل المستمر في الماضي بـ«كان يُقتاد». وتبقى الإحالة في «معه» غير مسماة كما في الآية، كما لا يُفرض ذكر الصلب في المتن لأن الفعل اليوناني لا يحدده.
