  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: ar
  text: 'وكان الشعب واقفًا ينظر. وأما الرؤساء فكانوا هم أيضًا يستهزئون به قائلين: «خلَّص آخرين، فليخلِّص نفسه إن كان هذا هو مسيح الله، المختار».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مسيح الله، المصطفى».'
    reason: يبيّن بديلًا عربيًا صحيحًا للقب ὁ ἐκλεκτός مع إبقاء معنى الاختيار.
lexical_decisions:
- source_word: εἱστήκει
  choice: كان الشعب واقفًا
  rationale: ينقل المعنى الحاليّ المشهدي لصيغة الفعل، ويحفظ هيئة الوقوف بأسلوب عربي طبيعي.
- source_word: θεωρῶν
  choice: ينظر
  rationale: يعبّر عن استمرار مشاهدة الشعب للمشهد من غير إضافة تفسيرية.
- source_word: ἐξεμυκτήριζον
  choice: يستهزئون به
  rationale: ينقل دلالة السخرية الازدرائية، مع إظهار المفعول المفهوم من السياق.
- source_word: ἄρχοντες
  choice: الرؤساء
  rationale: لفظ عربي مألوف للسلطات القيادية في هذا السياق، من غير حصرهم في توصيف تفسيري أضيق.
- source_word: Ἄλλους ἔσωσεν
  choice: خلَّص آخرين
  rationale: يحفظ فعل الخلاص وتكراره البلاغي مع العبارة التالية.
- source_word: σωσάτω ἑαυτόν
  choice: فليخلِّص نفسه
  rationale: ينقل صيغة الأمر الساخرة ويحافظ على تكرار جذر الخلاص.
- source_word: εἰ οὗτός ἐστιν
  choice: إن كان هذا هو
  rationale: يحفظ قوة اسم الإشارة، بما فيها نبرة التحقير المحتملة في المقام.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: مسيح الله
  rationale: يترجم Χριστός بوصفه لقبًا مسيانيًا، ويحفظ تركيب الإضافة اليوناني بإيجاز طبيعي.
- source_word: ὁ ἐκλεκτός
  choice: المختار
  rationale: يحفظ اللقب المسياني وصيغة التعريف من غير توسيع عقائدي.
theological_decisions:
- issue: ترجمة Χριστός بوصفه لقبًا
  choice: مسيح الله
  alternative: المسيح الذي من الله
  rationale: «مسيح» هو المقابل العربي الراسخ للقب، والإضافة المباشرة تحفظ إجمال العبارة ولا تفسّر طبيعة النسبة إلى الله.
- issue: قوة ὁ ἐκλεκτός
  choice: المختار
  alternative: المختار من الله
  rationale: النص اليوناني يقول «المختار» ولا يكرر «من الله» صراحة؛ لذا تُحفظ دلالة اللقب من دون إدخال عبارة تفسيرية.
- issue: العلاقة بين اللقبين
  choice: مسيح الله، المختار
  alternative: مسيح الله المختار
  rationale: الفاصلة تُظهر أن «المختار» لقب ثانٍ معطوف بيانيًا، مع إبقاء العلاقة النحوية والدلالية موجزة كما في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «الرؤساء» و«يستهزئون» لسهولة الفهم، وحُفظ تكرار «خلَّص/فليخلِّص» وقوة اسم الإشارة في كلام السخرية.
