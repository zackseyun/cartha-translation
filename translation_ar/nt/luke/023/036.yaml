  text: ⸀ἐνέπαιξαν δὲ αὐτῷ καὶ οἱ στρατιῶται προσερχόμενοι, ⸀ὄξος προσφέροντες αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/036.yaml
  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: ar
  text: وسخر منه الجنود أيضًا، وهم يقتربون ويقدّمون له خمرًا حامضةً[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خلًّا». تشير الكلمة اليونانية ὄξος إلى خمر حامضة، وهي شراب رخيص شائع؛ وقد جرت ترجمات تقليدية كثيرة على نقلها بلفظ «الخل».
    reason: بديل معجمي يوضح طبيعة الشراب ويذكر المقابل التقليدي.
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: سخر
  rationale: ينقل معنى الاستهزاء العدائي بوضوح وفصاحة، من غير أن يخفف حدته إلى مجرد المزاح.
- source_word: δὲ ... καὶ οἱ στρατιῶται
  choice: الجنود أيضًا
  rationale: يجمع أثر الاستمرار الذي تؤديه δέ مع معنى الإضافة في καί، أي إن الجنود انضموا هم أيضًا إلى المستهزئين.
- source_word: οἱ στρατιῶται
  choice: الجنود
  rationale: المقابل العربي المباشر والواضح للجنود في مشهد تنفيذ الحكم الروماني.
- source_word: προσερχόμενοι
  choice: وهم يقتربون
  rationale: يحافظ على الصيغة الحالية للمشاركة وعلى تزامن الاقتراب مع السخرية وتقديم الشراب.
- source_word: ὄξος
  choice: خمرًا حامضة
  rationale: يدل اللفظ في هذا السياق على خمر حامضة رخيصة كانت تُشرب، وهو أدق للقارئ الحديث من «الخل» الذي قد يُفهم على أنه مادة للتتبيل فحسب.
- source_word: προσφέροντες αὐτῷ
  choice: ويقدّمون له
  rationale: ينقل فعل عرض الشراب على يسوع من غير أن يضيف حكمًا على الدافع وراءه.
theological_decisions:
- issue: طبيعة تقديم الخمر الحامضة
  choice: صيغ الفعل بصورة محايدة ضمن مشهد السخرية، من غير تحديد دافع الجنود.
  alternative: اعتبار التقديم فعل رحمة، أو اعتباره في ذاته تعذيبًا أو تهكمًا محضًا.
  rationale: السياق المباشر يضع تصرف الجنود ضمن السخرية، لكن الآية لا تشرح دافع تقديم الشراب على نحو مستقل؛ لذلك تُرك التوتر كما هو من غير إضافة تفسير نفسي أو لاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل تركيب «وهم يقتربون» للمحافظة على العلاقة الحالية بين الفعل الرئيس والمشاركتين اليونانيتين، ووُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
