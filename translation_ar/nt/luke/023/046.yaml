  naturalness: الأسلوب فصيح وموقر، لكن «بصوتٍ عظيم» أقل طبيعية في العربية المعاصرة من «بصوتٍ عالٍ»، و«لفظ أنفاسه الأخيرة» واضح ومألوف في الفصحى الحديثة.
  terminology: «أستودع» و«روحي» خياران دقيقان ومناسبان. تُستبدل «يا أبي» بـ«يا أبتِ» لتؤدي النداء «يا Father» من دون إدخال ضمير المتكلم الصريح «ـي» الذي ليس في اليونانية، مع بقاء النداء عربيًا فصيحًا طبيعيًا في هذا المقام.
