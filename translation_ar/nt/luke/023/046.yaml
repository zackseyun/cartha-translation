base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: ar
  text: 'وَصَرَخَ يَسُوعُ بِصَوْتٍ عَالٍ قَائِلًا: «يَا أَبَتِ، فِي يَدَيْكَ أَسْتَوْدِعُ رُوحِي».[a] وَلَمَّا قَالَ هَذَا لَفَظَ أَنْفَاسَهُ الأَخِيرَةَ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يرد صدى هذا القول في مزمور 31:5 بحسب الترجمة اليونانية: «في يديك أستودع روحي». ويمكن ترجمة «أستودع» أيضًا: «أضع روحي في عهدتك».'
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: 'حرفيًّا، الفعل يدل على إخراج النفَس؛ ويمكن ترجمته أيضًا: «مات» أو «لفظ نفَسه الأخير».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: صَرَخَ ... بِصَوْتٍ عَظِيمٍ
  rationale: ينقل فعل النداء القوي وعبارة الكيفية في صياغة عربية واضحة، ويحفظ التشديد على قوة الصوت.
- source_word: Πάτερ
  choice: يَا أَبِي
  rationale: صيغة النداء العربية الطبيعية للأب هي «يا أبي»، إذ تدل ياء المتكلم على علاقة المتكلم بالمخاطَب، لا على إضافة تفسيرية أجنبية عن معنى النداء.
- source_word: εἰς χεῖράς σου
  choice: فِي يَدَيْكَ
  rationale: يحفظ صيغة التثنية في اليونانية وصدى مزمور 31:5، مع استعمال حرف جر عربي طبيعي في معنى الإيداع لدى شخص.
- source_word: παρατίθεμαι
  choice: أَسْتَوْدِعُ
  rationale: يفيد وضع الشيء في عهدة آخر ورعايته، وينقل معنى الفعل الأوسط بوصفه ائتمانًا مقصودًا.
- source_word: τὸ πνεῦμά μου
  choice: رُوحِي
  rationale: «روحي» هو الأنسب في سياق الصلاة والتسليم الواعي للآب، مع بقاء المجال الدلالي المتصل بالنفَس والحياة حاضرًا في الأصل.
- source_word: τοῦτο δὲ εἰπὼν
  choice: وَلَمَّا قَالَ هَذَا
  rationale: ينقل سبق القول للفعل الرئيس بتركيب عربي فصيح وواضح.
- source_word: ἐξέπνευσεν
  choice: أَسْلَمَ الرُّوحَ
  rationale: تعبير عربي موقر ومفهوم للموت، لكنه أقل محافظة على صورة الزفير الحرفية؛ لذلك تُذكر الصورة الأصلية في الحاشية.
theological_decisions:
- issue: دلالة τὸ πνεῦμά μου في قول يسوع الأخير
  choice: رُوحِي
  alternative: نَفْسِي / نَفَسِي
  rationale: السياق هو مخاطبة واعية للآب وائتمان مقصود، مما يرجح «روحي» من غير فرض صياغة عقائدية لاحقة على النص.
- issue: دلالة παρατίθεμαι وصيغته الوسطى
  choice: أَسْتَوْدِعُ
  alternative: أَضَعُ / أُسَلِّمُ
  rationale: «أستودع» يحفظ معنى الائتمان ووضع الروح في رعاية الآب، ويؤدي القول الأدائي بصيغة المضارع العربية.
- issue: تصوير موت يسوع في ἐξέπνευσεν
  choice: أَسْلَمَ الرُّوحَ
  alternative: لَفَظَ نَفَسَهُ الأَخِيرَ / مَاتَ
  rationale: الاختيار واضح وموقر في العربية، والحاشية تحفظ الصلة الحرفية بخروج النفَس دون حسم دلالة «الروح» في الفعل اليوناني نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع نبرة كتابية غير متكلفة. استُعملت «يا أبي» بوصفها صيغة النداء العربية الطبيعية، وحُفظ صدى المزمور في «في يديك أستودع روحي». جميع علامات الحواشي مثبتة في المتن.
