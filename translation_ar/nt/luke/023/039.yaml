base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: ar
  text: 'وكان واحد من المجرمين المعلَّقين كان يسيء إليه قائلًا: «ألست أنت المسيح[a]؟ خلِّص نفسك وإيّانا!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الممسوح، وهو اللقب الذي يقابل اليونانية: ὁ χριστός.'
    reason: توضيح معنى اللقب اليوناني مع إبقاء الترجمة العربية المألوفة في المتن.
lexical_decisions:
- source_word: Εἷς δὲ
  choice: وكان واحد
  rationale: تنقل الواو انتقال δέ السردي الخفيف من غير أن تضيف معنى زمنيًا، وتلائم السياق العربي المتصل.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: من المجرمين المعلَّقين
  rationale: «المجرمين» تعبير عربي حديث طبيعي عن κακούργων، و«المعلَّقين» يحافظ على لفظ κρεμασθέντων من غير استبداله بالفعل الأكثر تخصيصًا «المصلوبين».
- source_word: ἐβλασφήμει αὐτόν
  choice: يجدّف عليه
  rationale: الفعل العربي «جدّف عليه» يتسع للكلام المهين والمسيء الموجَّه إلى يسوع ويحافظ على الصلة الدلالية بالتجديف؛ وصيغة «كان... يجدّف» تعكس الاستمرار في زمن الماضي الناقص اليوناني.
- source_word: λέγων
  choice: قائلًا
  rationale: مقابل عربي فصيح وطبيعي لاسم الفاعل الذي يقدّم الكلام المباشر.
- source_word: Οὐχὶ σὺ εἶ ὁ χριστός;
  choice: ألست أنت المسيح؟
  rationale: تحافظ «ألست» على السؤال الذي يتوقع الإيجاب وعلى نبرة التهكم، بينما يفيد إبراز «أنت» ما في الضمير اليوناني من توكيد.
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: خلِّص نفسك وإيّانا
  rationale: «خلِّص» طبيعي في سياق النجاة من الموت ويحفظ الصلة الأوسع بمفردات الخلاص، و«إيّانا» يعبّر بوضوح عن المفعول المعطوف.
theological_decisions:
- issue: ترجمة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: المسيح الممسوح / الكريستوس
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليهودي ὁ χριστός، ويحفظ كونه لقبًا لا اسمًا شخصيًا من غير إدخال تفسير طائفي.
- issue: دلالة ἐβλασφήμει في خطاب المجرم
  choice: يجدّف عليه
  alternative: كان يشتمه / يعيّره
  rationale: اختير «يجدّف» للمحافظة على المجال الدلالي القوي للفعل اليوناني، مع «عليه» التي توضّح أن الإساءة الكلامية موجَّهة إلى يسوع؛ ولا يحسم النص هنا وحده مسألة إدراك المتكلم لهوية يسوع الإلهية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. حُفظت صيغة التعليق العامة بدل تخصيصها إلى الصلب، وأُبقيت نبرة الاستهزاء في السؤال من غير شرح زائد.
