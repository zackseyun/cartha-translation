review_pass:
  verdict: revise
  source_fidelity: 'تحتاج العبارة الوسطى إلى تعديل طفيف: «ما تستحقه أفعالنا» توحي بأن الأفعال هي التي تستحق شيئًا، لا بأننا نتلقى جزاءً مستحقًا بسبب ما فعلناه. والصياغة المقترحة تنقل ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν بدقة، مع الحفاظ على المضارع الدال على التلقي الجاري. أما «شيئًا غير لائق» فهي ترجمة واسعة وأمينة لـ οὐδὲν ἄτοπον.'
  naturalness: «لأننا ننال ما نستحقه جزاءً لما فعلناه» فصيحة معاصرة وواضحة، وتتجنب الإسناد غير الطبيعي للاستحقاق إلى «أفعالنا». وبقية الأسلوب، بما في ذلك المقابلة «أما نحن... أما هذا»، طبيعي ومناسب للسجل الوقور.
  terminology: «بعدل» مناسب لـ δικαίως في السياق القضائي. و«غير لائق» مناسب لـ ἄτοπον ولا يضيّقه إلى معنى جريمة قانونية أو خطيئة محددة. لا توجد قضايا أسماء أو مصطلحات لاهوتية في الآية.
  issues:
  - severity: medium
    issue: الإسناد في «ما تستحقه أفعالنا» غير دقيق دلاليًا في العربية.
    rationale: النص اليوناني يفيد أن المتكلمين يتلقون ما يتناسب مع ما فعلوه أو ما يستحقونه بسبب أفعالهم؛ أما الصياغة الحالية فتجعل «الأفعال» هي صاحبة الاستحقاق. إضافة «جزاءً لما فعلناه» تزيل الالتباس وتحافظ على المعنى.
  revised_text: أَمَّا نَحْنُ فَبِعَدْلٍ، لِأَنَّنَا نَنَالُ مَا نَسْتَحِقُّهُ جَزَاءً لِمَا فَعَلْنَاهُ؛ أَمَّا هَذَا فَلَمْ يَفْعَلْ شَيْئًا غَيْرَ لَائِقٍ.[a]
