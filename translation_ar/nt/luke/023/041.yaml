  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: ar
  text: أَمَّا نَحْنُ فَبِعَدْلٍ، لِأَنَّنَا نَنَالُ مَا نَسْتَحِقُّهُ جَزَاءً لِمَا فَعَلْنَاهُ؛ أَمَّا هَذَا فَلَمْ يَفْعَلْ شَيْئًا غَيْرَ لَائِقٍ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أَمَّا هَذَا فَلَمْ يَفْعَلْ شَيْئًا خَاطِئًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίως
  choice: بِعَدْلٍ
  rationale: ينقل معنى استحقاق العقوبة وقِسطها، ويحافظ على الدلالة القضائية للظرف اليوناني.
- source_word: ἄξια γὰρ ὧν ἐπράξαμεν
  choice: لِأَنَّنَا نَنَالُ مَا تَسْتَحِقُّهُ أَفْعَالُنَا
  rationale: صياغة عربية طبيعية تعبّر عن تناسب الجزاء الجاري مع الأفعال السابقة، من غير خشونة الترجمة الحرفية.
- source_word: ἀπολαμβάνομεν
  choice: نَنَالُ
  rationale: فعل مضارع يبيّن أنهم يتلقّون الجزاء الآن، ويلائم السياق العربي بوضوح.
- source_word: οὗτος
  choice: هَذَا
  rationale: يحافظ على قوة اسم الإشارة وعلى المقابلة بين المتكلم ورفيقه من جهة، ويسوع من جهة أخرى.
- source_word: οὐδὲν ἄτοπον
  choice: شَيْئًا غَيْرَ لَائِقٍ
  rationale: يحافظ على سعة ἄτοπον، أي ما هو غير لائق أو خاطئ، من غير تضييق المعنى إلى جريمة قانونية محددة.
- source_word: ἔπραξεν
  choice: فَعَلْ
  rationale: الماضي العربي هو التعبير الطبيعي هنا عن فعل منفي، ولا يضيف دلالة قانونية غير موجودة في اللفظ.
theological_decisions:
- issue: صياغة شهادة المجرم ببراءة يسوع
  choice: أَمَّا هَذَا فَلَمْ يَفْعَلْ شَيْئًا غَيْرَ لَائِقٍ
  alternative: أَمَّا هَذَا فَلَمْ يَفْعَلْ شَيْئًا خَاطِئًا
  rationale: تثبت الصياغة أن يسوع لم يفعل ما يستوجب هذا العقاب في السياق القضائي، مع إبقاء لفظ ἄτοπον على سعته وعدم تحميل العبارة استنتاجات عقائدية أوسع من منطوقها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت المقابلة «أَمَّا نَحْنُ... أَمَّا هَذَا» لإظهار بنية μὲν... δὲ، مع صياغة مألوفة للقارئ الحديث.
