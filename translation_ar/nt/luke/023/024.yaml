lexical_decisions:
- source_word: καὶ
  choice: فـ
  rationale: فاء الاستئناف والنتيجة تصل هذا الحكم بما سبقه، وتلائم السياق السردي العربي من غير إضافة تفصيل غير موجود في اليونانية.
- source_word: Πιλᾶτος
  choice: بيلاطس
  rationale: الصيغة العربية الشائعة للاسم العلم.
- source_word: ἐπέκρινεν
  choice: حكم
  rationale: الفعل يدل هنا على إصدار قرار قضائي؛ و«حكم» يحفظ النبرة القانونية بوضوح وإيجاز، من غير تضييق المعنى إلى النطق بعقوبة بعينها.
- source_word: γενέσθαι
  choice: بأن يُنفَّذ
  rationale: المصدر المتمم يفيد أن المطلوب قد تقرر وقوعه أو إجراؤه؛ و«يُنفَّذ» صياغة عربية طبيعية في سياق الحكم القضائي.
- source_word: τὸ αἴτημα
  choice: مطلب
  rationale: ينقل معنى الطلب الذي ألحّ أصحابه في تحقيقه، ويحافظ على قوته السياقية من غير مبالغة «الإنذار» أو تخفيفه إلى مجرد رغبة.
- source_word: αὐτῶν
  choice: ـهم
  rationale: ضمير جمع مضاف يعود إلى أصحاب الطلب المذكورين في السياق.
theological_decisions:
- issue: الدلالة القضائية لقرار بيلاطس
  choice: فحكم بيلاطس بأن يُنفَّذ مطلبهم
  alternative: وقضى بيلاطس بأن يتم طلبهم
  rationale: تحفظ الصياغة كون فعل بيلاطس قرارًا قضائيًا بالموافقة على ما طلبوه، من غير أن تضيف أن العبارة نفسها هي حكم عقوبة محدد أو أن تحسم مسؤوليات تتجاوز منطوق الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «حكم» لإبراز السياق القضائي، و«يُنفَّذ مطلبهم» لتقديم المقصود في تركيب عربي طبيعي، مع إثبات البديل الأقرب إلى البنية اليونانية في الحاشية.
