base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: ar
  text: فأطلق الرجل الذي كان قد أُلقي في السجن بسبب تمرّدٍ وقتلٍ، وهو الذي كانوا يطلبونه؛ وأما يسوع فسلَّمه إلى مشيئتهم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: أطلق
  rationale: فعل دقيق وطبيعي في سياق الإفراج عن سجين، ولا يضيف لونًا تفسيريًا.
- source_word: διὰ στάσιν καὶ φόνον
  choice: بسبب فتنة وقتل
  rationale: تفيد διά مع النصب السبب. و«فتنة» هنا تدل على اضطراب وتمرد مدني، لا مجرد خلاف، مع بقاء الصياغة عربية واضحة وموجزة.
- source_word: βεβλημένον εἰς φυλακήν
  choice: كان قد أُلقي في السجن
  rationale: يحفظ قوة βάλλω التصويرية ومعنى اسم المفعول التام الدال على حالة نتجت من فعل سابق.
- source_word: ὃν ᾐτοῦντο
  choice: وهو الذي كانوا يطلبونه
  rationale: يحفظ الماضي المستمر في ᾐτοῦντο من غير تشديد المعنى إلى «يطالبون به» أو «يصرّون عليه».
- source_word: παρέδωκεν
  choice: سلَّمه
  rationale: ينقل معنى التسليم إلى سلطة الآخرين، وهو فعل محوري في رواية الآلام، من غير إضافة تفسير لاهوتي.
- source_word: τῷ θελήματι αὐτῶν
  choice: إلى مشيئتهم
  rationale: يحافظ على الثقل الإرادي للاسم θέλημα وعلى التركيب الموجز في اليونانية، بدل تفكيكه إلى «ليفعلوا به ما أرادوا».
- source_word: δὲ ... δὲ
  choice: فـ ... وأما
  rationale: الفاء تصل الحدث بسياقه السردي، و«أما» تُظهر بوضوح المقابلة بين إطلاق الرجل وتسليم يسوع.
theological_decisions:
- issue: المقابلة بين إطلاق المتمرد وتسليم يسوع من غير إدخال تفسير كفّاري
  choice: أُبقيت المقابلة السردية صريحة بواسطة «وأما يسوع»، من غير إضافة «بدلًا منه» أو «عوضًا عنه».
  alternative: صياغة تفسيرية مثل «وأطلقه بدلًا من يسوع» أو «عوضًا عنه».
  rationale: النص يروي فعل بيلاطس وخضوعه لمشيئة الجمهور، لكنه لا يصرّح في هذه الآية بلغة الاستبدال أو بعقيدة كفّارية؛ لذلك لا ينبغي أن تضيف الترجمة ما يُستنبط من السياق الأوسع.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت «فتنة» بمعنى الاضطراب والتمرد المدني، و«مشيئتهم» للمحافظة على الصياغة الإرادية المكثفة في الأصل. لا حاجة إلى حاشية لأن البدائل لا تكشف غموضًا نصيًا أو دلاليًا جوهريًا يتعذر حفظه في المتن.
