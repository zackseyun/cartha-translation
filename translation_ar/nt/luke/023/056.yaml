lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: ثم رجعن
  rationale: اسم الفاعل الأوريستي المؤنث الجمع يدل على أن رجوع النساء سبق إعدادهن؛ وصياغة «ثم رجعن فأعددن» تنقل هذا التتابع بوضوح وطبيعية.
- source_word: δὲ
  choice: ثم
  rationale: تفيد هنا استمرار السرد والانتقال إلى الحدث التالي، فناسبتها «ثم».
- source_word: ἡτοίμασαν
  choice: فأعددن
  rationale: ترجمة مباشرة وطبيعية لفعل الإعداد، مع تأنيث الجمع بحسب مرجع الفاعل.
- source_word: ἀρώματα
  choice: أطيابًا
  rationale: تشير في سياق الدفن إلى مواد طيبة الرائحة تُستعمل لتجهيز الجسد، و«أطياب» لفظ عربي واضح وموجز.
- source_word: μύρα
  choice: زيوتًا عطرية
  rationale: يدل اللفظ على زيت أو دهن معطّر؛ وتُبقي هذه الصياغة التمييز بينه وبين ἀρώματα.
- source_word: τὸ μὲν σάββατον
  choice: وفي السبت
  rationale: تعبير زمني طبيعي، مع نقل الانتقال الخفيف الذي تؤديه μέν من غير تكلف.
- source_word: ἡσύχασαν
  choice: استرحن
  rationale: يفيد في سياق السبت الكف عن العمل والراحة، لا مجرد الصمت.
- source_word: κατὰ τὴν ἐντολήν
  choice: بحسب الوصية
  rationale: يحفظ معنى المطابقة ويحافظ على المفرد والتعريف في النص اليوناني من غير إضافة تفسيرية.
theological_decisions:
- issue: مرجع «الوصية»
  choice: إبقاء العبارة «الوصية» من غير توسيع في المتن
  alternative: التصريح بأنها وصية الشريعة المتعلقة بالسبت
  rationale: يشير السياق إلى وصية حفظ السبت، لكن النص نفسه يقول «الوصية» فحسب؛ لذلك تحافظ الترجمة على عبارته ولا تُدخل التفسير في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. روعي تأنيث أفعال الجمع لأن الفاعل هو النساء المذكورات في السياق السابق، وحُفظ الفرق الدلالي بين الأطياب والزيوت العطرية.
