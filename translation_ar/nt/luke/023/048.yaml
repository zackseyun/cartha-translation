  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: ar
  text: وجميع الجموع التي اجتمعت لمشاهدة هذا المنظر[a]، لما رأت ما حدث، كانت تعود وهي تضرب صدورها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لمشاهدة هذا المشهد».'
    reason: lexical_alternative
  - marker: b
    text: كان ضرب الصدر إشارة إلى الحزن أو النوح أو الصدمة.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: اجتمعت
  rationale: تفيد أن الناس أتوا معًا إلى المشهد؛ و«اجتمعت» عربية طبيعية تحفظ المعنى الجمعي دون إثقال.
- source_word: ὄχλοι
  choice: الجموع
  rationale: تحفظ صيغة الجمع اليونانية، وتناسب مجموعات الناس الحاضرة.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: لمشاهدة هذا المنظر
  rationale: تنقل غرض اجتماعهم والجانب المرئي العلني في θεωρία، مع إبقاء «هذا المشهد» بديلًا معجميًا في الحاشية.
- source_word: θεωρήσαντες
  choice: لما رأت
  rationale: تعبر بوضوح عن سبق الرؤية للفعل الرئيس، كما يقتضيه اسم الفاعل الماضي في السياق.
- source_word: τὰ γενόμενα
  choice: ما حدث
  rationale: صياغة عربية موجزة وطبيعية للتركيب الذي يعني الأمور التي وقعت.
- source_word: τύπτοντες τὰ στήθη
  choice: وهي تضرب صدورها
  rationale: تحفظ الفعل الجسدي كما هو من غير أن تفسر باطن موقف الجموع.
- source_word: ὑπέστρεφον
  choice: أخذت ترجع
  rationale: تنقل الجانب الاستمراري للفعل الناقص اليوناني، مصورة الجموع وهي تنصرف تباعًا.
theological_decisions:
- issue: الدلالة الشعورية والروحية لضرب الصدور
  choice: 'إبقاء الفعل الجسدي: «تضرب صدورها»'
  alternative: التصريح بأنهم تابوا، أو بأنهم كانوا في حزن أو صدمة
  rationale: النص اليوناني يصف الإيماءة ولا يحدد صراحةً حالتهم الروحية الداخلية؛ لذلك لا تُحسم الدلالة المحتملة إلى توبة أو حزن أو صدمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أخذت ترجع» لإظهار استمرار الانصراف، و«تضرب صدورها» للحفاظ على صورة النص من دون تفسير لاهوتي زائد.
