  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: ar
  text: 'فسأله بيلاطس قائلًا: «أأنت ملك اليهود[a]؟» فأجابه قائلًا: «أنت تقول[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أهل اليهودية». فاللفظ اليوناني قد يدل على اليهود أو على أهل اليهودية بحسب السياق.
    reason: lexical_alternative
  - marker: b
    text: أو «أنت تقول ذلك»، أو «نعم، الأمر كما تقول». الجواب اليوناني موجز، ويمكن فهمه على أنه إقرار مؤهَّل.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تتابع السرد، والفاء طبيعية في العربية وتفيد التعقيب من غير إبراز مقابلة قوية.
- source_word: ἠρώτησεν
  choice: سأله
  rationale: ينقل فعل السؤال المباشر بدقة وبأسلوب عربي طبيعي.
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على البنية اليونانية التي تمهّد للكلام المباشر، من غير تكلّف في العربية.
- source_word: Σὺ εἶ
  choice: أأنت
  rationale: صيغة استفهام عربية واضحة، مع إبراز الضمير كما في النص اليوناني.
- source_word: βασιλεὺς
  choice: ملك
  rationale: المقابل المباشر للفظ الدال على المَلِك، ويحفظ طبيعة التهمة السياسية.
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: هو التعبير العربي المألوف والملائم للقب في سياق المحاكمة، مع إثبات البديل الجغرافي-القومي في الحاشية.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: فأجابه قائلًا
  rationale: صياغة عربية طبيعية تحفظ معنى الاستجابة والمخاطَب وفعل القول، من دون التكرار الثقيل في «أجاب وقال له».
- source_word: Σὺ λέγεις
  choice: أنت تقول
  rationale: يحفظ إيجاز العبارة والتباسها المقصود؛ فهي لا تنفي اللقب، لكنها ترده إلى صياغة بيلاطس بدل تحويلها إلى «نعم» صريحة.
theological_decisions:
- issue: دلالة جواب يسوع Σὺ λέγεις
  choice: إبقاء الجواب المقتضب «أنت تقول» بوصفه إقرارًا مؤهلًا يحتفظ بالتوتر البلاغي.
  alternative: «نعم، كما تقول» بوصفه تأكيدًا صريحًا، أو «هذا ما تقوله أنت» بوصفه جوابًا أكثر تباعدًا.
  rationale: العبارة اليونانية موجزة وغير مباشرة، وقد تُفهم إقرارًا مؤهلًا. لذلك لا ينبغي تقويتها إلى «نعم» ولا إضعافها إلى تنصّل، بل إبقاء توترها كما هو.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت الفاء لتدفق السرد، وحُفظت صيغة «قائلًا» لإبقاء ملمح النص الأصلي، مع تجنب تركيب عربي متكلف في جملة الجواب.
