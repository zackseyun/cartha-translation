  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: ar
  text: 'فقال لهم: «قدّمتم إليَّ هذا الرجل على أنه يُضلِّل الشعب[a]. وها أنا، بعد أن استجوبته أمامكم، لم أجد في هذا الرجل أيَّ أساس لما تتهمونه به[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يَصرف الشعب». يمكن أن يعني الفعل اليوناني الصرف عن الطريق أو الإضلال.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لم أجد في هذا الرجل ذنبًا في شيء مما تتهمونه به».'
    reason: alternative_reading
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: قدّمتم إليَّ
  rationale: ينقل فعل الإحضار إلى الوالي في سياق قضائي، مع الحفاظ على كونه فعلًا تمّ بالفعل.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: هذا الرجل
  rationale: تعبير طبيعي ودقيق لأن المقصود فرد ذكر بعينه.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: على أنه يُضلِّل الشعب
  rationale: يحفظ مضمون الاتهام، إذ يمكن للفعل أن يدل على صرف الناس أو إضلالهم، من غير تقويته إلى معنى التحريض.
- source_word: τὸν λαόν
  choice: الشعب
  rationale: يناسب الدلالة الجمعية لكلمة λαός في هذا السياق.
- source_word: ἰδοὺ
  choice: وها أنا
  rationale: ينقل أداة لفت الانتباه بصورة عربية فصيحة وطبيعية، ويرتبط مباشرة بضمير المتكلم التالي.
- source_word: ἐνώπιον ὑμῶν
  choice: أمامكم
  rationale: يبين أن الاستجواب جرى علنًا في حضور المخاطَبين.
- source_word: ἀνακρίνας
  choice: بعد أن استجوبته
  rationale: يعكس المعنى القضائي للفعل، ويُظهر العلاقة الزمنية بين الاستجواب والنتيجة التي أعلنها بيلاطس.
- source_word: οὐθὲν εὗρον ... αἴτιον
  choice: لم أجد ... أيَّ أساس
  rationale: صياغة قضائية واضحة تفيد انتفاء المسوّغ للاتهام، دون تحويل العبارة إلى حكم أخلاقي مطلق.
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: لما تتهمونه به
  rationale: ينقل فعل الاتهام وصلة الموصول بإيجاز عربي طبيعي مع الحفاظ على النبرة القضائية.
theological_decisions:
- issue: طبيعة إعلان بيلاطس
  choice: صياغته بوصفه نتيجة قضائية تنفي وجود أساس للاتهامات
  alternative: لم أجد في هذا الرجل ذنبًا مما تتهمونه به
  rationale: المفردات اليونانية تنتمي إلى سياق الفحص والاتهام القضائيين؛ لذلك لا تُوسَّع العبارة إلى حكم مطلق بشأن البراءة الأخلاقية، مع إثبات البديل الأقرب إلى لفظ الذنب في الحاشية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة قضائية رصينة. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرانهما مباشرة، وحُفظت أداة لفت الانتباه في صيغة «وها أنا».
