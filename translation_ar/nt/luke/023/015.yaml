  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: ar
  text: بل ولا هيرودس أيضًا، لأنه أعاده إلينا. وها إنه لم يفعل شيئًا يستحق الموت.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بل حتى هيرودس لم يجد عليه ما يستوجب الموت، لأنه أعاده إلينا؛ وها إنه لم يُرتكَب منه شيء يستحق الموت».'
    reason: يبيّن استكمالًا عربيًا ممكنًا للإضمار في صدر العبارة، ويحفظ في ختامها صياغة أقرب إلى المبنى غير الشخصي في اليونانية، مع بقاء المعنى القضائي.
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ
  choice: بل ولا
  rationale: تفيد استمرار الحجة مع المقابلة، وتضيف هيرودس إلى بيلاطس بوصفه سلطة لم تثبت على يسوع جريمة تستوجب الموت.
- source_word: Ἡρῴδης
  choice: هيرودس
  rationale: الصيغة العربية المألوفة للاسم في التراث الكتابي والاستعمال الحديث.
- source_word: ἀνέπεμψεν
  choice: أعاده
  rationale: الفعل في السياق القضائي يدل على إرساله راجعًا إلى بيلاطس، وهو ما تؤكده عبارة «إلينا».
- source_word: γὰρ
  choice: لأنه
  rationale: تدخل تعليلًا لاستشهاد بيلاطس بموقف هيرودس.
- source_word: αὐτὸν πρὸς ἡμᾶς
  choice: أعاده إلينا
  rationale: الضمير يعود إلى يسوع، و«إلينا» تنقل πρὸς ἡμᾶς، بينما معنى الرجوع متضمن في الفعل المركب وسياق الرواية.
- source_word: καὶ ἰδοὺ
  choice: وها إنه
  rationale: صياغة عربية واضحة ورصينة تحفظ وظيفة ἰδού في لفت الانتباه إلى النتيجة دون اللجوء إلى تعبير مهجور.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: شيئًا يستحق الموت
  rationale: تحفظ القوة القضائية للعبارة، أي عدم وجود فعل يستوجب عقوبة الإعدام.
- source_word: ἐστὶν πεπραγμένον
  choice: لم يفعل
  rationale: تحويل طبيعي إلى العربية للمركب اليوناني الدال على فعل منجز ذي صلة بالحكم الحاضر، مع نفي أي فعل جنائي منسوب إليه.
- source_word: αὐτῷ
  choice: يفعل [هو]
  rationale: فُهمت الداتيفية على أنها تشير إلى الفاعل المنسوب إليه الفعل؛ وصيغت عربيًا بالفعل المبني للمعلوم لتجنب توهم أن شيئًا فُعل به.
theological_decisions:
- issue: دلالة αὐτῷ مع πεπραγμένον
  choice: 'الفاعل: «لم يفعل شيئًا»'
  alternative: 'المرجع: «لم يوجد فيه شيء»؛ أو العلاقة: «لم يُفعل به شيء»'
  rationale: السياق هو إعلان بيلاطس أن يسوع لم يرتكب جريمة تستوجب الموت. والصياغة بالمعلوم توصل هذا الحكم بوضوح، مع التنبيه في الحاشية إلى البديل الأقرب إلى المبنى اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «وها إنه» للفت الانتباه، و«يستحق الموت» بصفتها عبارة قضائية مفهومة. وُضع مؤشر الحاشية في المتن كما هو مطلوب.
