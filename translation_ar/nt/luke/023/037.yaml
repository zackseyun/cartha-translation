translation:
  language: ar
  text: 'وكانوا يقولون: «إن كنتَ أنتَ ملكَ اليهود[a]، فخلِّص نفسك!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ملك أهل اليهودية». يمكن أن تشير الكلمة اليونانية إلى اليهود أو إلى سكان اليهودية، بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وكانوا
  rationale: رُبطت الجملة بما قبلها بالواو، وصيغت مع الفعل الناقص لتؤدي استمرار الفعل الذي يدل عليه اسم الفاعل اليوناني في سياقه السردي.
- source_word: λέγοντες
  choice: يقولون
  rationale: ترجمة محايدة تحفظ معنى القول، وتترك دلالة السخرية للسياق بدل إدخالها في الفعل نفسه.
- source_word: Εἰ
  choice: إن
  rationale: تفيد الشرط المتضمن للتحدي والتهكم، من غير افتراض إقرار المتكلمين بادعاء الملك.
- source_word: σὺ εἶ
  choice: كنتَ أنتَ
  rationale: إظهار الضمير المنفصل «أنت» يحفظ توكيد الضمير الصريح في اليونانية، مع صياغة عربية طبيعية للجملة الشرطية.
- source_word: ὁ βασιλεὺς
  choice: ملكَ
  rationale: جاءت «ملك» خبرًا منصوبًا لـ«كان»، والإضافة إلى «اليهود» تجعل اللقب معرفًا ومحددًا طبيعيًا في العربية.
- source_word: τῶν Ἰουδαίων
  choice: اليهود
  rationale: هو المقابل الأشيع والأنسب للقب السياسي المسياني في سياق الآلام، مع إثبات «اليهوديين/أهل اليهودية» بديلًا ممكنًا في الحاشية.
- source_word: σῶσον
  choice: فخلِّص
  rationale: فعل أمر مباشر يحفظ الصلة المعجمية والفكرية باستعمالات فعل الخلاص في لوقا؛ وأضيفت الفاء بوصفها جواب الشرط الطبيعي في العربية.
- source_word: σεαυτόν
  choice: نفسك
  rationale: مفعول انعكاسي مباشر، وصيغته العربية الطبيعية «نفسك».
theological_decisions:
- issue: ترجمة اللقب βασιλεὺς τῶν Ἰουδαίων
  choice: ملك اليهود
  alternative: ملك اليهوديين، أو ملك أهل اليهودية
  rationale: «ملك اليهود» هو اللقب الراسخ والملائم في رواية الصلب، ويحفظ المفارقة المتعلقة بملوكية يسوع. ومع ذلك، يمكن للفظ Ἰουδαίων أن يحمل دلالة إقليمية أو إثنية، لذلك حُفظ البديل في الحاشية من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظت بنية القول المستمر، والتوكيد في «أنت»، وقوة الأمر التهكمي، مع تجنب إضافة لفظ «ساخرين» لأن السخرية مستفادة من السياق لا من فعل القول ذاته.
