  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: ar
  text: 'فقال لهم للمرة الثالثة: «لماذا؟[a] فأيَّ شرٍّ فعل هذا؟ لم أجد فيه ما يستوجب الموت.[b] لذلك سأعاقبه[c] ثم أطلق سراحه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فأيَّ شرٍّ فعل هذا؟» فقد تُفهم Τί بوصفها احتجاجًا مقتضبًا يمهّد للسؤال الكامل.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أيَّ سببٍ للحكم عليه بالموت»، أو «شيئًا يستحق عليه الموت».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «أؤدبه»؛ وربما، على نحو أكثر تحديدًا، «أجلده». يدل الفعل اليوناني على عقاب تأديبي، لكنه لا يحدد وحده صورة العقاب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: للمرة الثالثة
  rationale: تؤدي معنى التكرار الذي تحمله صيغة النصب الظرفية، وهي عبارة عربية طبيعية تحافظ على التوكيد السردي.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: لماذا؟ فأيَّ شرٍّ فعل هذا؟
  rationale: تحافظ «لماذا؟» على الاحتجاج المقتضب المحتمل في Τί، ثم تنقل السؤال الكامل مع الغرض التفسيري في γάρ. واختيار «شرّ» يصون القوة الأخلاقية لكلمة κακόν، و«هذا» يقابل اسم الإشارة οὗτος من غير إضافة تفسيرية.
- source_word: οὐδὲν αἴτιον θανάτου
  choice: ما يستوجب الموت
  rationale: 'تنقل العبارة المعنى القضائي بوضوح: لم يجد بيلاطس في يسوع أمرًا يقتضي عقوبة الموت، من غير توسيعها إلى صياغة قانونية غير مصرّح بها.'
- source_word: εὗρον ἐν αὐτῷ
  choice: لم أجد فيه
  rationale: صياغة قريبة من اليونانية وسليمة في العربية، وتعرض حكم بيلاطس القائم من غير تحويل «فيه» تفسيرًا إلى «عليه».
- source_word: παιδεύσας
  choice: سأعاقبه
  rationale: في هذا السياق يدل الفعل على معاملة عقابية دون القتل. «أعاقبه» أوضح في العربية المعاصرة من «أؤدبه» ولا تحدد وسيلة العقاب التي لم يحددها اللفظ اليوناني وحده.
- source_word: ἀπολύσω
  choice: أطلق سراحه
  rationale: تعبير عربي طبيعي ودقيق في سياق الإفراج القضائي.
theological_decisions:
- issue: طبيعة الإجراء الذي اقترحه بيلاطس في παιδεύσας
  choice: إبقاؤه عقابًا عامًا غير محدد الوسيلة
  alternative: «أؤدبه» أو، على نحو أكثر تحديدًا، «أجلده»
  rationale: يعلن بيلاطس أن يسوع لا يستوجب الموت، لكنه يقترح مع ذلك معاقبته. يحافظ النص على هذا التوتر، ولا يحدد الجلد لأن الفعل اليوناني نفسه لا يعيّن هنا صورة العقاب تعيينًا قاطعًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية وقضائية رصينة. استُخدم «أطلق سراحه» بدل تعبير أكثر حرفية، و«أعاقبه» لإظهار المعنى العقابي بوضوح مع إبقاء وسيلته غير محددة.
