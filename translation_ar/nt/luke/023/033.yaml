  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: ar
  text: ولمّا وصلوا إلى الموضع الذي يُدعى «الجُمجمة»[a]، صلبوه هناك مع المجرمَين، أحدهما عن اليمين والآخر عن اليسار.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الموضع الذي يُدعى الجمجمة». واللفظة اليونانية Κρανίον تعني «جمجمة».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «واحدًا عن اليمين وواحدًا عن اليسار». ولا يرد في اليونانية ضمير بمعنى «عن يمينه وعن يساره»، وإن كان ذلك مفهومًا من السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἐπὶ τὸν τόπον
  choice: وصلوا إلى الموضع
  rationale: الفعل مع ἐπί وصيغة النصب يدل على الحركة إلى المكان والوصول إليه؛ و«وصلوا إلى» تعبير عربي طبيعي ودقيق في السياق السردي.
- source_word: τὸν καλούμενον Κρανίον
  choice: الذي يُدعى «الجُمجمة»
  rationale: Κρανίον اسم موضع مشتق من الاسم العام بمعنى «الجمجمة». ترجمة دلالته تحافظ على المعنى من غير استيراد تسمية من المقاطع الموازية.
- source_word: ἐσταύρωσαν
  choice: صلبوه
  rationale: «صلب» هو المقابل العربي المعياري والدقيق للفعل σταυρόω، ولا يضيف تفاصيل تنفيذية لا يصرّح بها الأصل.
- source_word: τοὺς κακούργους
  choice: المجرمَين
  rationale: κακοῦργος يدل على مرتكب الجريمة أو الشر. والمثنى العربي يوضح أن الحديث عن رجلين، مع تجنب تخصيصهما كلصين أو متمردين خلافًا للفظ لوقا.
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: أحدهما عن اليمين والآخر عن اليسار
  rationale: يحفظ هذا التعبير بنية التوزيع والموقع، ولا يضيف ضميرًا يحدد أن اليمين واليسار هما يمين يسوع ويساره، مع أن السياق يوحي بذلك.
theological_decisions:
- issue: ترجمة Κρανίον
  choice: «الجُمجمة»
  alternative: «موضع الجمجمة» أو نقل الاسم صوتيًا
  rationale: اللفظة تسمية مكان مبنية على اسم عام معناه «الجمجمة». إبقاء هذا المعنى ظاهرًا أوفى بالأصل، ولا يخلط النص بصيغ تقليدية مأخوذة من روايات موازية.
- issue: وصف الرجلين المصلوبين مع يسوع
  choice: المجرمَين
  alternative: فاعلي الشر أو اللصَّين
  rationale: «المجرمَين» يحفظ الدلالة العامة لـ κακούργους، بينما «اللصَّين» يضيّق المعنى ويُدخل مصطلحًا من تقاليد أو نصوص موازية.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة، ذات إيقاع سردي طبيعي. استُعمل المثنى في «المجرمَين» ملاءمةً لبنية العربية، وحُفظ الإبهام النسبي في تحديد صاحب اليمين واليسار.
