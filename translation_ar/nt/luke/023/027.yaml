  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: ar
  text: وكان يتبعه جمعٌ كبيرٌ من الشعب، وبينهم نساءٌ كُنَّ يلطمن صدورهنَّ وينحن عليه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: كان يتبعه
  rationale: ينقل صيغة الماضي الناقص بوصفها فعلًا مستمرًّا في خلفية المشهد السردي، بصياغة عربية طبيعية.
- source_word: δὲ
  choice: الواو في «وكان»
  rationale: تؤدي وظيفة مواصلة السرد من غير تحميل الأداة معنى استدراكيًّا غير لازم.
- source_word: αὐτῷ
  choice: ـه في «يتبعه»
  rationale: المجرور مع فعل الاتباع يشير إلى يسوع، والعربية تستعمل الفعل المتعدي مباشرة هنا.
- source_word: πολὺ πλῆθος
  choice: جمعٌ كبيرٌ
  rationale: تعبير واضح ومعاصر يحفظ معنى الكثرة وكون الجماعة جمعًا واحدًا.
- source_word: τοῦ λαοῦ
  choice: من الشعب
  rationale: يحفظ الإضافة التي تحدد أن الجمع من عامة الشعب، من غير تركيب عربي متكلف.
- source_word: καὶ γυναικῶν
  choice: وبينهم نساءٌ
  rationale: يوضح أن النساء داخل الجمع المذكور، ويهيئ بوضوح لعودة ضمير الموصول المؤنث عليهن.
- source_word: αἳ
  choice: كُنَّ
  rationale: صيغت الجملة النسبية في تركيب عربي وصفي واضح يعود حصرًا إلى النساء.
- source_word: ἐκόπτοντο
  choice: يلطمن صدورهنَّ
  rationale: في سياق الحداد يدل الفعل على ضرب الجسد تعبيرًا عن الحزن؛ وذكر الصدور يبين العادة المقصودة بعبارة عربية مألوفة.
- source_word: ἐθρήνουν
  choice: ينحن
  rationale: ينقل معنى النواح أو الرثاء المسموع، وهو أدق في هذا السياق من لفظ عام للحزن.
- source_word: αὐτόν
  choice: عليه
  rationale: حرف الجر «على» هو الاستعمال العربي الطبيعي مع النواح، ويحفظ كون يسوع موضوع رثائهن.
theological_decisions: []
