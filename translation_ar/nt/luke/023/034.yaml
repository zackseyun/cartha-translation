review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام أمين للنص اليوناني: يحافظ «وكان يسوع يقول» على دلالة الناقص في ἔλεγεν، و«يا أبتِ، اغفر لهم» و«لأنهم لا يعلمون ماذا يفعلون» ترجمات سليمة، كما تُبقي «لهم» غير محددة. لكن «ألقوا قرعة» بالمفرد لا تؤدي κλήρους («قرعًا/حصصًا بالقرعة») على الوجه المعتاد في العربية، وقد توحي بقرعة واحدة مجردة. والصياغة الأدق والأكثر رسوخًا هي «ألقوا قرعًا».'
  naturalness: 'النص فصيح واضح ومناسب للسرد الكتابي المعاصر. «يا أبتِ» نداء عربي وقور وطبيعي. التعديل المقترح محدود ويجعل العبارة الختامية أكثر اصطلاحية: «وألقوا قرعًا عليها».'
  terminology: «اغفر» مناسب في الدعاء، و«ثياب» مقابل ἱμάτια واضح، و«قرعًا» هو المقابل الاصطلاحي الملائم لـκλήρους في هذا السياق. تُحافظ الحاشية على موضعها وصياغتها وعلى الإبهام النصي دون ترجيح مذهبي.
  issues:
  - severity: low
    issue: صيغة «ألقوا قرعة»
    rationale: الأصل اليوناني يستعمل الجمع κλήρους في التعبير الاصطلاحي ἔβαλον κλήρους. العربية الكتابية والطبيعية تقول «ألقوا قرعًا»، ويمكن أن يُذكر متعلقه «عليها» لبيان أن القرعة كانت على الثياب/الأنصبة.
