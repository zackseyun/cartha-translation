base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: ar
  text: 'وكان يسوع يقول[a]: «يا أبتِ، اغفر لهم، لأنهم لا يعلمون ماذا يفعلون». ثم اقتسموا ثيابه وألقوا قرعًا عليها.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تحذف بعض المخطوطات: «يا أبتِ، اغفر لهم، لأنهم لا يعلمون ماذا يفعلون».'
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: يحفظ دلالة الماضي الناقص على قول مستمر أو متكرر، بدل تحويله إلى فعل ماضٍ بسيط.
- source_word: Πάτερ
  choice: يا أبتِ
  rationale: صيغة نداء مباشرة طبيعية وفصيحة، من غير إضافة ضمير ملكية غير موجود في اليونانية.
- source_word: ἄφες
  choice: اغفر
  rationale: في سياق دعاء موجَّه إلى الله من أجل المسيئين، هذه هي المقابلة العربية الطبيعية والدقيقة.
- source_word: αὐτοῖς
  choice: لهم
  rationale: يحفظ الضمير من غير تعيين هوية الجماعة التي يعود إليها، كما في الأصل.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: لأنهم لا يعلمون ماذا يفعلون
  rationale: ترجمة مباشرة تحافظ على معنى المعرفة في οἴδασιν، ولا تستبدله بتفسير أوسع مثل «لا يدركون».
- source_word: διαμεριζόμενοι
  choice: اقتسموا
  rationale: يؤدي معنى تقسيم الثياب بينهم بعبارة عربية طبيعية، مع تحويل التركيب بالمشاركة إلى فعل منسق ملائم للسرد.
- source_word: ἱμάτια
  choice: ثيابه
  rationale: لفظ عربي واضح ورفيع السجل يشمل قطع اللباس من غير عامية.
- source_word: ἔβαλον κλήρους
  choice: ألقوا قرعة
  rationale: تعبير عربي مألوف عن ممارسة استعمال القرعة لتعيين الأنصبة.
- source_word: δὲ
  choice: و / ثم
  rationale: نُقل الرابط الأول بالواو في تركيب «وكان» الطبيعي عربيًا، والثاني بـ«ثم» لاستمرار السرد من غير تحميله تضادًا قويًا.
theological_decisions:
- issue: 'أصالة قول يسوع: «يا أبتِ، اغفر لهم، لأنهم لا يعلمون ماذا يفعلون»'
  choice: إثبات القول في المتن
  alternative: حذف القول، كما في بعض المخطوطات
  rationale: تطبع طبعة SBLGNT العبارة ضمن النص مع إشارات تدل على اختلاف نصي مهم؛ لذلك أُثبتت في المتن ووُثّق حذفها في بعض الشواهد بالحاشية، من غير حسم الخلاف ضمن الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «يا أبتِ» للنداء المباشر، و«ثيابه» بدل تعبير أكثر عامية. حُفظ استمرار ἔλεγεν بصيغة «كان يقول»، وأُبقي مرجع «لهم» غير محدد كما في اليونانية.
