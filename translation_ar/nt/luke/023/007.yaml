  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: ar
  text: ولما علم أنه تابع لولاية هيرودس[a]، أرسله إلى هيرودس، الذي كان هو أيضًا في أورشليم في تلك الأيام.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خاضع لسلطة هيرودس». تشير العبارة اليونانية إلى النطاق الإداري أو القانوني الخاضع لسلطة هيرودس.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: ولما علم
  rationale: اسم الفاعل الأوريستي يدل على فعل سبق الفعل الرئيس؛ وصيغة «ولما علم» تنقل العلاقة الزمنية بوضوح وطبيعية.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: أنه من دائرة حكم هيرودس
  rationale: تفيد العبارة الانتماء إلى النطاق الإداري والقضائي الخاضع لهيرودس، لا مجرد القوة المجردة. وتحافظ «من دائرة حكم» على دلالة ἐκ مع توضيح السياق القانوني السياسي.
- source_word: ἀνέπεμψεν
  choice: أرسله
  rationale: الفعل قد يحمل في هذا السياق معنى إحالة الشخص أو القضية إلى صاحب الاختصاص، لكن «أرسله» عربية طبيعية ودقيقة، وتتكفل العبارة السابقة بإبراز البعد القضائي.
- source_word: πρὸς Ἡρῴδην
  choice: إلى هيرودس
  rationale: حرف الجر مع المنصوب يدل هنا على الاتجاه نحو شخص.
- source_word: ὄντα καὶ αὐτὸν
  choice: الذي كان هو أيضًا
  rationale: تحفظ الصياغة صلة العبارة بهيرودس، كما تنقل توكيد αὐτόν ودلالة καί على أن هيرودس أيضًا كان حاضرًا.
- source_word: ἐν Ἱεροσολύμοις
  choice: في أورشليم
  rationale: الصيغة العربية الكتابية المعروفة لاسم المدينة، وهي واضحة في العربية الفصحى.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: في تلك الأيام
  rationale: مع أن الإشارة اليونانية حرفيًا «هذه الأيام»، فإن «تلك الأيام» هي الصياغة السردية العربية الطبيعية عند الإحالة إلى زمن الرواية.
theological_decisions:
- issue: الدلالة السياسية والقضائية لكلمة ἐξουσία في صلتها بهيرودس
  choice: دائرة حكم هيرودس
  alternative: سلطان هيرودس
  rationale: السياق يتناول معرفة بيلاطس بأن يسوع آتٍ من منطقة خاضعة لحكم هيرودس أنتيباس، ومن ثم إرساله إليه. فالصياغة المختارة تُظهر النطاق الإداري والقضائي من غير إقحام معنى لاهوتي في ἐξουσία.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «دائرة حكم» بدل المصطلح التقني الأثقل «الاختصاص القضائي» في المتن، مع شرحه في الحاشية، وحُفظ توكيد وجود هيرودس أيضًا في أورشليم.
