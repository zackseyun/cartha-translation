  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: ar
  text: وإذا برجلٍ اسمه يوسف، كان عضوًا في المجلس، وكان رجلًا صالحًا بارًّا[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عادلًا».
    reason: بديل معجمي لـδίκαιος، التي قد تدل على البر أو الاستقامة وكذلك على العدل.
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: وإذا
  rationale: تحافظ «وإذا» على أداة الانتقال ولفت الانتباه في السرد اللوقاوي، بصياغة عربية فصيحة وطبيعية، من غير إثقال العبارة بـ«وهوذا».
- source_word: ἀνὴρ
  choice: رجلٌ
  rationale: يدل اللفظ هنا على شخص بالغ ذكر، ولذلك تُحفظ دلالته الصريحة ولا يُعمَّم إلى «شخص».
- source_word: ὀνόματι Ἰωσὴφ
  choice: اسمه يوسف
  rationale: تؤدي العبارة الاسمية اليونانية بصياغة عربية مباشرة وطبيعية عند تقديم الشخصية.
- source_word: βουλευτὴς ὑπάρχων
  choice: وكان عضوًا في المجلس
  rationale: ينقل «عضوًا في المجلس» معنى βουλευτής بوضوح للقارئ المعاصر، وتؤدي «كان» وظيفة اسم الفاعل ὑπάρχων في السياق السردي، من غير تحديد اسم المجلس بما يتجاوز نص الآية.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: رجلًا صالحًا بارًّا
  rationale: يُحفظ تكرار «رجل» للتوكيد كما في اليونانية. وتنقل «صالحًا» معنى ἀγαθός، بينما تنقل «بارًّا» البعد الأخلاقي والديني في δίκαιος مع بقاء إمكان فهم الاستقامة والعدل.
theological_decisions:
- issue: دلالة δίκαιος في وصف يوسف
  choice: بارًّا
  alternative: عادلًا
  rationale: قد يدل δίκαιος على البر والاستقامة أو العدل. وفي وصف شخصية ضمن هذا السياق، تحافظ «بارًّا» على الرنين الأخلاقي والديني الأوسع من غير تحويل اللفظ إلى مصطلح عقائدي تقني، بينما يظل معنى العدل بديلًا معجميًا حقيقيًا.
translation_notes:
  register: العربية فصحى معاصرة، واضحة ووقورة. استُخدمت «وإذا» بوصفها أداة سردية طبيعية للفت الانتباه، وحُفظ تكرار «رجل» والشرطة الختامية لأن الجملة تستمر في العدد التالي.
