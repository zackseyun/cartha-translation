  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: هذا
  rationale: اسم الإشارة يعود إلى يوسف الرامي المذكور في الآية السابقة، ويحافظ على قوة الإحالة في اليونانية من غير إضافة الاسم إلى نص الآية.
- source_word: προσελθὼν
  choice: فذهب إلى
  rationale: اسم الفاعل الماضي يدل على فعل سبق الطلب ورافق مسار الحدث؛ وصياغته فعلًا مع الفاء طبيعية في السرد العربي وتحفظ التعاقب.
- source_word: τῷ Πιλάτῳ
  choice: إلى بيلاطس
  rationale: حالة المجرور غير المباشر مع προσέρχομαι تعيّن الشخص المقصود بالتوجّه، ولا حاجة إلى إضافة «بنطيوس» لأنها غير واردة هنا.
- source_word: ᾐτήσατο
  choice: طلب
  rationale: الفعل يعني طلب شيئًا، ويتعدى في العربية مباشرة إلى المفعول به، وهو هنا جسد يسوع.
- source_word: τὸ σῶμα
  choice: جسد
  rationale: يحافظ «جسد» على الدلالة المباشرة لكلمة σῶμα، ولا يستبدلها بلفظ «جثة» الأشد تفسيرًا ونبرة.
- source_word: τοῦ Ἰησοῦ
  choice: يسوع
  rationale: الإضافة العربية «جسد يسوع» تنقل علاقة المضاف إليه في اليونانية بوضوح وطبيعية.
