source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: ar
  text: 'أما الآخر فأجابه موبِّخًا: «ألا تخاف الله حتى أنت، ما دمت تحت الحكم نفسه[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإدانة نفسها»، أو «القضاء نفسه». يمكن أن تعني الكلمة اليونانية κρίμα القضاء أو الحكم أو العقوبة المحكوم بها؛ والمقصود هنا النتيجة العقابية المشتركة.
    reason: بديل معجمي يحفظ سعة الدلالة القانونية للكلمة اليونانية.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: أما الآخر فأجابه
  rationale: تنقل «أما» المقابلة التي تفيدها δέ بين موقفَي المجرمَين، ويؤدي «فأجابه» معنى اسم الفاعل ἀποκριθείς بصياغة عربية سردية طبيعية.
- source_word: ἐπιτιμῶν αὐτῷ ἔφη
  choice: موبِّخًا
  rationale: يحفظ الحال المصاحب للكلام ونبرة ἐπιτιμάω الحازمة، وتقوم الجملة القولية المباشرة مقام فعل القول في العربية من غير تكرار ثقيل بعد «فأجابه».
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: ألا تخاف الله حتى أنت
  rationale: يحفظ «تخاف الله» القوة المعجمية والتعبير الكتابي، وتنقل «حتى أنت» توكيد الضمير σὺ ودلالة «حتى/أيضًا» الكامنة في οὐδέ.
- source_word: ὅτι
  choice: ما دمت
  rationale: تؤدي هنا معنى التعليل القائم على الحال المشتركة، بصياغة عربية واضحة وطبيعية.
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: تحت الحكم نفسه
  rationale: يفيد κρίμα الحكم أو القضاء أو العقوبة المحكوم بها؛ وفي سياق الصلب تشير العبارة إلى الوضع العقابي المشترك، و«تحت الحكم» تعبير قانوني عربي واضح من غير حصر اللفظ في «الإدانة» وحدها.
theological_decisions:
- issue: معنى مخافة الله في التوبيخ
  choice: تخاف الله
  alternative: تهاب الله؛ توقّر الله
  rationale: يحافظ هذا على العبارة الدينية المباشرة وثقلها الأخلاقي من غير تلطيفها إلى مجرد الاحترام أو توسيعها بتفسير عقائدي.
- issue: مدلول κρίμα في سياق الصلب
  choice: الحكم
  alternative: الإدانة؛ القضاء؛ العقوبة المحكوم بها
  rationale: «الحكم» يبقي المجال الدلالي القانوني مفتوحًا نسبيًا، مع إيضاح السياق أن الرجلين واقعان تحت نتيجة قضائية عقابية واحدة.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم تركيب حواري طبيعي، مع إبقاء «تخاف الله» بصيغته المباشرة، ووُضع مؤشر الحاشية عند اللفظ الذي تشرحه.
