  source_fidelity: 'ينقل النص عناصر اليونانية بأمانة: المقابلة في δέ، و«الآخر»، وفعل الإجابة مع التوبيخ، والاستفهام الإنكاري المؤكد في Οὐδὲ ... σὺ، و«تخاف الله»، وسبب التوبيخ القائم على اشتراكهما في κρίμα نفسه. وعبارة «تحت الحكم نفسه» مناسبة لسياق الحكم العقابي مع إبقاء سعة κρίμα القانونية.'
  naturalness: 'الصياغة فصحى حديثة واضحة وطبيعية في الحوار: «أما الآخر فأجابه موبِّخًا» و«ألا تخاف الله حتى أنت» سليمتان، و«ما دمت تحت الحكم نفسه» تؤدي التعليل بصورة مفهومة من غير إطالة.'
  terminology: «تخاف الله» تحفظ التعبير الديني المباشر بلا تلطيف تفسيري. و«الحكم» خيار قانوني متزن لـ κρίμα، والحاشية تذكر البدائل ذات الصلة ولا تحسم الدلالة على نحو أضيق من الأصل.
