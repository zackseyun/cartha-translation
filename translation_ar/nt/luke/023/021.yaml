  language: ar
  text: 'أما هم فظلّوا يصرخون قائلين: «اصلبه! اصلبه!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أوضح: «اقتله على صليب! اقتله على صليب!»'
