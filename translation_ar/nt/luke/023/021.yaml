lexical_decisions:
- source_word: οἱ δὲ
  choice: أما هم فـ
  rationale: يفيد الضمير المستعمل اسميًا الجماعة المذكورة في السياق، وتُبرز «أما... فـ» المقابلة التي يدل عليها δέ بصورة عربية طبيعية.
- source_word: ἐπεφώνουν
  choice: ظلّوا يصرخون
  rationale: ينقل الفعل معنى النداء بصوت عالٍ، ويعبّر الماضي الناقص عن استمرار الصراخ أو تكراره.
- source_word: λέγοντες
  choice: قائلين
  rationale: اسم حال متزامن مع الفعل الرئيس ويقدّم مضمون الصراخ.
- source_word: Σταύρου σταύρου
  choice: اصلبه! اصلبه!
  rationale: الأمر مكرر للتعبير عن الإلحاح. أُدخل المفعول به مع كل أمر في العربية لأن ذلك هو الأسلوب الطبيعي الواضح، مع بقاء التكرار والقوة الخطابية.
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير المفعول به يعود إلى يسوع؛ أُلحق بكل فعل أمر وفق مقتضى التعبير العربي الطبيعي.
theological_decisions:
- issue: دلالة الأمر σταύρου
  choice: اصلبه
  alternative: اقتله على صليب
  rationale: الفعل يدل تحديدًا على تنفيذ القتل بالصلب. «اصلبه» هو المقابل العربي الموجز والدقيق، ولا يضيف تفسيرًا لاهوتيًا إلى المعنى المعجمي.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة. حافظت على استمرار الصراخ وتكرار الأمر، وجعلت الضمير مع كل فعل أمر لتأتي العبارة طبيعية في العربية.
