base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: ar
  text: 'حينئذ سيبدأون يقولون للجبال[a]: «اسقطي علينا»، وللتلال[b]: «غطِّينا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تردد هذه العبارة صدى لغة الدينونة عند الأنبياء، ولا سيما هوشع 10:8.
    reason: cross_reference
  - marker: b
    text: 'أو: «أخفينا». المعنى الحرفي للفعل هو «غطّى»، لكنه يفيد في هذا السياق الإخفاء من الدينونة الآتية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: ظرف زمان يربط القول بما سبقه ويشير إلى ما سيحدث عند ذلك؛ و«حينئذ» موجزة وفصيحة.
- source_word: ἄρξονται λέγειν
  choice: سيبدأون يقولون
  rationale: يحفظ معنى الشروع الذي تفيده ἄρξονται مع المصدر λέγειν، بدل اختزاله إلى «سيقولون».
- source_word: τοῖς ὄρεσιν
  choice: للجبال
  rationale: يحفظ التمييز بين ὄρη، أي الجبال، وβουνοί الآتية بعدها، أي التلال.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: اسقطي علينا
  rationale: ينقل فعل الأمر وصورة سقوط الجبال على المتكلمين. جاء الأمر بالمفرد المؤنث لأن «الجبال» جمع غير عاقل ويُعامَل نحويًا معاملة المفرد المؤنث في العربية.
- source_word: τοῖς βουνοῖς
  choice: للتلال
  rationale: βουνοί تدل عادة على المرتفعات الأصغر، و«التلال» تحفظ المقابلة المعجمية مع «الجبال».
- source_word: Καλύψατε ἡμᾶς
  choice: غطّينا
  rationale: «غطّى» هو المقابل المباشر للفعل καλύπτω، مع بقاء معنى الإخفاء المحتمل في السياق مذكورًا في الحاشية.
theological_decisions:
- issue: صدى لغة الدينونة النبوية
  choice: الإبقاء على النداء الحرفي للجبال والتلال من دون شرح تفسيري داخل المتن
  alternative: صياغة النداء صراحةً بوصفه طلبًا للاختباء من الدينونة
  rationale: يحفظ النص الصورة النبوية الملموسة والتوتر اللاهوتي، ولا يضيف إلى المتن تفسيرًا لما يطلبه المتكلمون.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التوازي بين «الجبال» و«التلال»، واستُعملت صيغة المفرد المؤنث في فعلي الأمر وفق المطابقة العربية الطبيعية مع جمع غير العاقل.
