  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: ar
  text: لذلك، سأعاقبه ثم أطلق سراحه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أؤدبه ثم أطلق سراحه». يمكن أن يدل الفعل اليوناني على التأديب أو العقاب التقويمي. ويفهم بعضهم العقوبة هنا على أنها الجلد تحديدًا، لكن الفعل نفسه أوسع دلالة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: سأعاقبه ثم
  rationale: اسم الفاعل الماضي يدل هنا، في سياق محاكمة قضائية، على إجراء عقابي يسبق إطلاق السراح. «أعاقبه» يحفظ المعنى الجزائي العام من غير أن يحدد وسيلة العقاب بما يتجاوز دلالة اللفظ اليوناني.
- source_word: οὖν
  choice: لذلك
  rationale: تفيد الأداة نتيجةً أو استنتاجًا في كلام بيلاطس، و«لذلك» تنقل هذه القوة المنطقية بوضوح.
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير المفعول به يعود إلى يسوع.
- source_word: ἀπολύσω
  choice: أطلق سراحه
  rationale: في السياق القضائي والاحتجازي، يدل الفعل على الإفراج أو الإطلاق، و«أطلق سراحه» تعبير عربي طبيعي واضح.
theological_decisions:
- issue: مدى دلالة παιδεύω في اقتراح بيلاطس
  choice: 'فُهم بمعنى عقابي قضائي عام: «أعاقبه».'
  alternative: «أؤدبه» أو «أجلده»
  rationale: سياق المحاكمة يقتضي عقوبة تسبق الإفراج، لكن الفعل اليوناني نفسه أوسع من الجلد تحديدًا؛ لذلك تتجنب الصياغة تضييق المعنى، كما تتجنب إيحاء «التأديب» التربوي الذي قد يطغى في العربية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. جرى تحويل تركيب اسم الفاعل اليوناني إلى فعلين متعاقبين بـ«ثم» طلبًا للطبيعية، مع الحفاظ على سبق العقوبة لإطلاق السراح. وُضعت علامة الحاشية بعد الجملة لتشير إلى البديل المتعلق بالفعل العقابي.
