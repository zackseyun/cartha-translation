lexical_decisions:
- source_word: Πιλᾶτος
  choice: بِيلاطُسُ
  rationale: الصيغة العربية الشائعة للاسم الشخصي اليوناني.
- source_word: δὲ
  choice: فَـ
  rationale: تفيد انتقالًا سرديًّا خفيفًا وربطًا بما سبق، والفاء طبيعية في هذا السياق العربي.
- source_word: ἀκούσας
  choice: لَمَّا سَمِعَ ... هٰذَا
  rationale: تحويل اسم الفاعل الظرفي إلى جملة زمنية عربية طبيعية، مع إظهار مفعول مفهوم من السياق.
- source_word: ἐπηρώτησεν
  choice: سَأَلَ
  rationale: المقابل العربي المباشر والطبيعي لفعل السؤال والاستفسار.
- source_word: εἰ
  choice: هَلْ
  rationale: تُدخل السؤال غير المباشر في الأصل، وصيغ هنا سؤالًا مباشرًا طبيعيًّا في العربية من غير تغيير المعنى.
- source_word: ὁ ἄνθρωπος
  choice: الرَّجُلُ
  rationale: يحفظ دلالة العبارة اليونانية من غير استبدالها باسم يسوع أو إضافة اسم إشارة.
- source_word: Γαλιλαῖός
  choice: جَلِيلِيٌّ
  rationale: نسبة عربية موجزة وطبيعية تدل على الانتماء إلى منطقة الجليل.
- source_word: ἐστιν
  choice: مفهوم من الجملة الاسمية «الرجل جليلي»
  rationale: العربية الفصحى لا تحتاج إلى فعل رابط ظاهر في المضارع، وتحافظ الجملة الاسمية على زمن الأصل الحاضر.
