lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: إذ خبا نور الشمس
  rationale: ينقل التركيب المطلق في اليونانية بوصفه ظرفًا ملازمًا للحدث، ويحافظ فعل «خبا» على معنى الاضمحلال أو الانقطاع من غير تحديد آلية فلكية كحدوث كسوف. وإضافة «نور» تجعل العبارة عربية طبيعية من غير تغيير المقصود السياقي.
- source_word: ἐσχίσθη
  choice: انشق
  rationale: فعل عربي طبيعي لتمزق النسيج وانفلاقه، وينقل صيغة المبني للمجهول اليونانية من غير تعيين الفاعل.
- source_word: δὲ
  choice: و
  rationale: أداة وصل خفيفة تلائم وظيفة δέ هنا من غير إقحام معنى استدراكي قوي.
- source_word: τὸ καταπέτασμα
  choice: حجاب
  rationale: «حجاب الهيكل» تعبير عربي واضح ومألوف للحاجز النسيجي داخل المقدس، مع إمكان التعبير عنه أيضًا بالستار.
- source_word: τοῦ ναοῦ
  choice: الهيكل
  rationale: ينقل ναός في هذا السياق بوصفه المقدس أو مبنى الهيكل نفسه، لا مجموع ساحاته، وهو التعبير الكتابي العربي الأوضح هنا.
- source_word: μέσον
  choice: من وسطه
  rationale: ترجمة مباشرة تحافظ على صياغة النص ولا تجزم بما هو أصرح من الأصل، مثل «إلى اثنين».
theological_decisions:
- issue: دلالة ἐκλιπόντος في وصف الشمس
  choice: 'صياغة غير تقنية: «خبا نور الشمس»'
  alternative: «أظلمت الشمس» أو «كسفت الشمس»
  rationale: الفعل يحتمل الخفوت أو الانقطاع، لكنه لا يوجب تفسيرًا فلكيًا تقنيًا. لذلك تتجنب الصياغة الجزم بحدوث كسوف، مع إبقاء ظاهرة الظلمة واضحة.
- issue: ترجمة καταπέτασμα
  choice: «حجاب» في المتن
  alternative: «ستار»
  rationale: كلاهما صحيح، لكن «حجاب الهيكل» واضح في العربية ويحافظ على دلالة الفاصل النسيجي ذي السياق التعبدي، من غير إضافة تفسير لرمزيته.
- issue: دلالة μέσον
  choice: «من وسطه»
  alternative: «إلى نصفين» أو «من منتصفه»
  rationale: تحافظ العبارة على تحديد موضع الانشقاق كما في اليونانية، ولا تحول النتيجة المرجحة إلى تصريح زائد على النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «خبا نور الشمس» لتجنب العبارة العربية غير الطبيعية «فشلت الشمس»، وللحفاظ في الوقت نفسه على عدم التحديد الموجود في الفعل اليوناني. وُضعت علامات الحواشي ملاصقة للعبارات التي تشرحها.
