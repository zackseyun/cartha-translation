  text: حين خبا ضوء الشمس[a]، وانشق حجاب[b] الهيكل من وسطه[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حين أظلمت الشمس». ويترجم بعضهم العبارة: «حين كسفت الشمس»، لكن ذلك يحدد ظاهرة فلكية لا يقتضيها اللفظ اليوناني بالضرورة.'
