base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: ar
  text: 'ولمّا رأى قائد المئة ما حدث، مجّد الله قائلًا: «حقًّا، كان هذا الرجل بارًّا»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بريئًا» أو «عادلًا». يمكن للكلمة اليونانية أن تدل، بحسب السياق، على البرّ الأخلاقي أو البراءة القانونية.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: ولمّا رأى
  rationale: تؤدي «لمّا» المعنى الزمني لاسم الفاعل الأوريستي، وتستوعب الواو وظيفة δέ بوصفها رابطًا سرديًّا خفيفًا من غير افتعال مقابلة.
- source_word: ὁ ἑκατοντάρχης
  choice: قائد المئة
  rationale: تعبير عربي واضح ودقيق عن رتبة الضابط الروماني المسؤول أصلًا عن نحو مئة جندي.
- source_word: τὸ γενόμενον
  choice: ما حدث
  rationale: صياغة عربية طبيعية للمفعول الاسمي الدال على الأمر الذي وقع وشاهده قائد المئة.
- source_word: ἐδόξαζεν τὸν θεὸν
  choice: مجّد الله
  rationale: يحفظ المعنى القوي للفعل δοξάζω. والماضي البسيط طبيعي في السرد العربي، بينما لا يقتضي الناقص اليوناني هنا إضافة «أخذ» أو «ظلّ» حتمًا.
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على البنية الحالية التي تعرض مضمون تمجيده لله.
- source_word: Ὄντως
  choice: حقًّا
  rationale: تفيد التوكيد القوي بأسلوب عربي فصيح ومألوف.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: هذا الرجل
  rationale: ينقل الإشارة إلى يسوع بوصفه رجلًا بعينه بوضوح وطبيعية.
- source_word: δίκαιος
  choice: بارًّا
  rationale: يحفظ المجال الأخلاقي واللاهوتي الأساسي للكلمة، مع إثبات احتمال معنى «بريئًا» أو «عادلًا» في الحاشية.
- source_word: ἦν
  choice: كان
  rationale: نقل مباشر لفعل الكينونة الناقص في سياق ماضٍ.
theological_decisions:
- issue: دلالة δίκαιος في قول قائد المئة
  choice: بارًّا
  alternative: بريئًا أو عادلًا
  rationale: «بارًّا» تحفظ الثقل الأخلاقي واللاهوتي للكلمة من غير أن تجعل القول اعترافًا مسيانيًّا أوسع مما يصرّح به النص. لكن سياق محاكمة يسوع وموته يجيز فهمها بمعنى البراءة القانونية، لذلك يُصان هذا الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «قائد المئة» بدل اللفظ المعرّب الأقل وضوحًا، وصيغت الجملة بسلاسة سردية مع إبقاء الغموض المقصود في δίκαιος داخل الحاشية.
