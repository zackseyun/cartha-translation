  terminology: «يطلق» مناسب للسياق القضائي، و«العيد» يحافظ على عمومية ἑορτή من دون إدخال «الفصح». ولا يلزم وصف الرجل بأنه سجين في متن الآية، لأن ذلك غير مصرّح به في هذه الجملة اليونانية.
