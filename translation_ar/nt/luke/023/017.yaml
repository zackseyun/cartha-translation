  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: ar
  text: وكان لا بدّ له أن يطلق لهم رجلًا واحدًا في العيد.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية بأكملها غير موجودة في عدد من أقدم المخطوطات اليونانية، ومنها البردية 75 من القرن الثالث والمخطوطة الفاتيكانية من القرن الرابع، كما تغيب عن ترجمات قبطية مبكرة. وهي موجودة في مخطوطات قديمة مهمة أخرى، مثل المخطوطة السينائية من القرن الرابع، وفي التقليد اللاتيني، وفي أغلبية المخطوطات البيزنطية اللاحقة. ويُرجَّح أن ناسخين أضافوها لمواءمة رواية لوقا مع عادة إطلاق سجين المذكورة في متى 27:15 ومرقس 15:6. وتضع بعض المخطوطات هذه الجملة بعد الآية 18.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην ... εἶχεν
  choice: كان لا بدّ له
  rationale: ينقل التعبير الاصطلاحي الدال على وقوعه تحت ضرورة أو إلزام، بصياغة عربية طبيعية، من غير حسم ما إذا كان الإلزام قانونيًا أم عُرفيًا.
- source_word: ἀπολύειν
  choice: أن يطلق
  rationale: الفعل في هذا السياق القضائي يعني إطلاق شخص من الاحتجاز، و«يطلق» واضح ومباشر.
- source_word: αὐτοῖς
  choice: لهم
  rationale: يحافظ على مرجع ضمير الجمع كما في اليونانية، أي إطلاق شخص لصالحهم أو استجابةً لهم.
- source_word: κατὰ ἑορτήν
  choice: في العيد
  rationale: تعبير عربي طبيعي يدل على المناسبة الدينية المقصودة في السياق، أي عيد الفصح، من دون إضافة اسم غير وارد في الآية.
- source_word: ἕνα
  choice: واحدًا
  rationale: يحافظ على عدم تعيين الشخص وعلى الصيغة العددية الموجزة في الأصل.
theological_decisions:
- issue: طبيعة الضرورة الواقعة على بيلاطس
  choice: كان لا بدّ له
  alternative: كان ملزمًا
  rationale: الصياغة المختارة تحفظ قدرًا من الغموض بين الضرورة والعرف والالتزام، ولا تفترض وجود واجب قانوني صريح.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُخدم «العيد» بدل «المهرجان» لأنه الأنسب لمناسبة دينية معروفة في السياق الكتابي، مع تجنب إدخال «الفصح» صراحةً لأنه غير مذكور في نص الآية. وُضعت علامة الحاشية بعد الجملة لتشير إلى أن المسألة النصية تخص الآية كلها.
