source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: ar
  text: أما هيرودس أيضًا، فعامله مع جنوده باحتقار واستهزأ به، ثم ألبسه ثوبًا فاخرًا[a] وأعاده إلى بيلاطس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ثوبًا زاهيًا»؛ فقد تعني λαμπράν أيضًا «لامعًا»، ويُرجَّح أن الثوب كان جزءًا من استهزاء هيرودس، إذ أظهر يسوع في هيئة تكريم زائف.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: عامله باحتقار
  rationale: ينقل معنى عدّه بلا قيمة وإظهار الاحتقار له، ويلائم سياق الإذلال العلني أكثر من صياغة تصف شعورًا داخليًا فحسب.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: مع جنوده
  rationale: صياغة عربية واضحة وطبيعية تدل على رجال هيرودس العسكريين دون تجريد زائد.
- source_word: ἐμπαίξας
  choice: استهزأ به
  rationale: يؤدي معنى السخرية والإهانة بعبارة فصيحة شائعة تلائم وقار رواية الآلام.
- source_word: περιβαλὼν
  choice: ألبسه
  rationale: فعل عربي موجز وطبيعي يعبّر عن وضع الثوب عليه.
- source_word: ἐσθῆτα λαμπρὰν
  choice: ثوبًا فاخرًا
  rationale: ἐσθής مفرد يدل على لباس أو ثوب، وλαμπρός يحتمل الفخامة أو اللمعان والزهو. تحافظ الصياغة على دلالة المظهر المهيب ظاهريًا من غير تخصيصه برداء ملكي.
- source_word: ἀνέπεμψεν
  choice: أعاده
  rationale: يعكس في هذا السياق القضائي إرساله من جديد إلى السلطة التي كان عندها سابقًا.
- source_word: τῷ Πιλάτῳ
  choice: إلى بيلاطس
  rationale: الصيغة العربية المألوفة للاسم، مع بيان جهة الإعادة بوضوح.
theological_decisions:
- issue: دلالة الثوب في استهزاء هيرودس
  choice: الإبقاء على صورة الثوب الفاخر بما يوحي بالتكريم التهكمي من غير تفسير رمزه صراحةً
  alternative: تحديده بوصفه رداءً ملكيًا، أو جعله علامة على الجنون أو العبث
  rationale: السياق يصرّح بالاحتقار والاستهزاء، ويرجح أن الثوب جزء من هذا الاستهزاء، لكن اليونانية لا تحدد أنه رداء ملكي ولا تشرح رمزيته، لذلك تُصان المفارقة دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أما ... أيضًا» لإبراز δὲ ... καὶ، وحُفظ تسلسل الأفعال ومشهد الإذلال من غير إضافة تفسير طائفي أو رمزي غير مصرّح به.
