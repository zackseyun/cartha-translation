lexical_decisions:
- source_word: πάλιν
  choice: مرة أخرى
  rationale: يفيد الظرف تكرار الفعل، و«مرة أخرى» تعبير عربي طبيعي واضح.
- source_word: δὲ
  choice: لكن
  rationale: تفيد الأداة انتقالًا مع تباين خفيف في السياق، إذ يعاود بيلاطس الكلام رغم موقف الجمع.
- source_word: ὁ Πιλᾶτος
  choice: بيلاطس
  rationale: النقل العربي الشائع للاسم، ولا تُترجم أداة التعريف اليونانية مع اسم العلم.
- source_word: προσεφώνησεν
  choice: خاطبهم
  rationale: الفعل يعني توجيه الكلام أو النداء إلى أشخاص؛ والضمير «هم» مفهوم من سياق المخاطَبين، مع إبقاء احتمال معنى النداء في الحاشية.
- source_word: θέλων
  choice: إذ كان يريد
  rationale: يحفظ معنى اسم الفاعل الدال على رغبة بيلاطس الملازمة لفعله، بصياغة عربية طبيعية.
- source_word: ἀπολῦσαι
  choice: أن يُطلق سراح
  rationale: يلائم المعنى القانوني المتعلق بإخلاء سبيل محتجز.
- source_word: τὸν Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية المألوفة للاسم، مع عدم نقل أداة التعريف اليونانية.
theological_decisions: []
