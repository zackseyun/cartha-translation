base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: ar
  text: 'لكنهم ظلّوا يُلحّون قائلين: «إنه يُهيّج الشعب[a] بتعليمه في اليهودية كلها[b]، مبتدئًا من الجليل وصولًا إلى هنا[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُحرّض الشعب». يمكن أن يدل الفعل اليوناني على إثارة الناس وتحريكهم في اتجاه اضطرابي.'
    reason: lexical_alternative
  - marker: b
    text: قد يُقصد بـ«اليهودية» إقليم اليهودية تحديدًا، أو نطاق البلاد اليهودية بمعنى أوسع في بعض السياقات؛ وهنا يشدد التعبير على اتساع نشاطه.
    reason: cultural_note
  - marker: c
    text: 'أي: «إلى هذا المكان». يشير التعبير إلى امتداد نشاطه، بحسب الاتهام، من الجليل إلى المكان الذي كان فيه أمام بيلاطس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: ظلّوا يُلحّون
  rationale: ينقل صيغة الماضي الناقص الدالة على الاستمرار، مع قوة الإصرار والضغط في سياق الاتهام.
- source_word: λέγοντες
  choice: قائلين
  rationale: ترجمة مباشرة لاسم الفاعل الذي يقدّم مضمون إلحاحهم.
- source_word: Ἀνασείει
  choice: يُهيّج
  rationale: يحفظ معنى إثارة الناس وتحريكهم على نحو اضطرابي، من غير أن يحمّل اللفظ تهمة قانونية محددة كالتمرد المسلح.
- source_word: τὸν λαὸν
  choice: الشعب
  rationale: يشير اللفظ هنا إلى عامة الناس، لا إلى حشد مجتمع بعينه.
- source_word: διδάσκων
  choice: بتعليمه
  rationale: يبيّن وسيلة التهييج المزعوم ويربط التعليم بالاتهام في صياغة عربية طبيعية.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: في اليهودية كلها
  rationale: ينقل الامتداد المكاني الشامل للنشاط المزعوم في الإقليم.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: مبتدئًا من الجليل
  rationale: يحفظ نقطة بداية النشاط كما يحددها حرف الجر ἀπό.
- source_word: ἕως ὧδε
  choice: حتى إلى هنا
  rationale: يحفظ الامتداد من الجليل إلى المكان الحاضر أمام بيلاطس، مع إبقاء الإشارة المكانية الصريحة.
theological_decisions:
- issue: طبيعة الاتهام الموجّه إلى يسوع
  choice: يُهيّج الشعب
  alternative: يُحرّض الشعب
  rationale: يفيد الفعل إثارة الناس في معنى اضطرابي، لكنه لا يفرض بذاته توصيفًا قانونيًا دقيقًا للعصيان أو التمرد؛ لذلك تحافظ الصياغة على حدة الاتهام من دون زيادة تفسيرية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة. استُخدم «ظلّوا يُلحّون» لإظهار الاستمرار، و«يُهيّج» للإبقاء على قوة الاتهام وغموض مداه السياسي، مع تجنب ألفاظ مذهبية أو قانونية أضيق من الأصل.
