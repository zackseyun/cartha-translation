  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: ar
  text: وفي ذلك اليوم عينه صار هيرودس وبيلاطس صديقين أحدهما للآخر[a]، لأنهما كانا من قبل في عداوة أحدهما للآخر[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صارا على وفاق أحدهما مع الآخر».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لأن العداوة كانت قائمة بينهما من قبل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: صار
  rationale: يفيد فعل γίνομαι هنا انتقالًا إلى حالة جديدة في العلاقة، و«صار» تعبير عربي طبيعي ودقيق.
- source_word: φίλοι
  choice: صديقين
  rationale: خبر يدل مباشرة على الصداقة أو التحالف، من غير تحديد مدى عمق العلاقة.
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: هيرودس وبيلاطس
  rationale: ينقل طرفي العلاقة بوضوح، ولا تستلزم العربية إضافة «كلاهما».
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: في ذلك اليوم عينه
  rationale: يحفظ التوكيد الكامن في العبارة اليونانية بصياغة عربية فصيحة ومفهومة.
- source_word: μετ’ ἀλλήλων
  choice: أحدهما للآخر
  rationale: يبين التبادل في العلاقة، ويلائم خبر الصداقة في العربية.
- source_word: προϋπῆρχον
  choice: كانا من قبل
  rationale: ينقل الحالة السابقة المستمرة والتباين الزمني مع التحول الذي حدث في ذلك اليوم.
- source_word: ἐν ἔχθρᾳ
  choice: في عداوة
  rationale: يحافظ على الصورة الاسمية في الأصل وعلى معنى الخصومة المتبادلة.
- source_word: ὄντες πρὸς αὑτούς
  choice: أحدهما مع الآخر
  rationale: ينقل المعنى التبادلي في سياق العداوة بصياغة عربية واضحة.
theological_decisions:
- issue: طبيعة التحول في علاقة هيرودس وبيلاطس
  choice: صار الاثنان صديقين في ذلك اليوم
  alternative: صارت بينهما مودة أو أصبحا على وفاق
  rationale: يصرح النص بتغير العلاقة، لكنه لا يحدد هل كانت صداقة شخصية عميقة أم تقاربًا أو تحالفًا سياسيًا؛ لذلك أبقي اللفظ المباشر مع تنبيه إلى البديل دون تحميله تفسيرًا لاهوتيًا زائدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «في ذلك اليوم عينه» لإبراز التوكيد، وحُفظ التقابل بين الصداقة الجديدة والعداوة السابقة. وُضعت علامتا الحاشيتين في المتن بجوار العبارتين اللتين تشرحان بدائلهما.
