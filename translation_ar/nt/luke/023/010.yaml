  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς εὐτόνως κατηγοροῦντες αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/010.yaml
  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: ar
  text: وكان رؤساء الكهنة والكتبة واقفين هناك، يتهمونه بشدة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يوجّهون إليه الاتهامات بعنف» أو «يتهمونه بإلحاح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: كانوا واقفين هناك
  rationale: صيغة الماضي التام ذات دلالة حالية تصف وجودهم واقفين في المشهد؛ وإضافة «هناك» توضح القوة المشهدية طبيعيًا من غير تحميل الصيغة أكثر مما تحتمل.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد هنا، ولا تستلزم مقابلة قوية تستدعي «لكن».
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: المقابل العربي المألوف للقب الجمع الذي يشير إلى كبار السلطات الكهنوتية، لا إلى تعدد شاغلي منصب رئيس الكهنة المفرد في آن واحد.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: ترجمة مباشرة ومستقرة في سياق الأناجيل، وتحافظ على اللقب التاريخي دون التوسع التفسيري في «معلمي الشريعة».
- source_word: εὐτόνως
  choice: بشدة
  rationale: تنقل قوة الاتهام وحدته بعبارة عربية واضحة وطبيعية، مع إبقاء إمكان فهمها بوصفها اتهامًا عنيفًا أو ملحًّا.
- source_word: κατηγοροῦντες
  choice: يتهمونه
  rationale: المضارع العربي مع الجملة الحالية يصور الفعل الجاري المصاحب لوقوفهم، وهو المقابل المباشر للمعنى القانوني والسردي للمشاركة اليونانية.
- source_word: αὐτοῦ
  choice: ـه في «يتهمونه»
  rationale: المضاف إليه بعد الفعل اليوناني يدل اصطلاحيًا على الشخص الموجَّه إليه الاتهام؛ وضمير المفعول به هو التعبير العربي الطبيعي.
