  terminology: «المثل» مناسب لـ παραβολή هنا بوصفه قولًا مأثورًا، و«يا طبيب، اشفِ نفسك» تعبير عربي طبيعي محافظ على صيغة النداء والأمر. لا توجد مسائل لاهوتية تتطلب تعديلًا.
