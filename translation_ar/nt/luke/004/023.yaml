  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: ar
  text: 'وقال لهم: «لا بد أن تقولوا لي هذا المثل: يا طبيب، اشفِ نفسك. كل ما سمعنا أنه جرى في كفرناحوم[a]، افعله هنا أيضًا في بلدتك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرف الجر اليوناني المستعمل هو «إلى/نحو» (εἰς)، لكن مع فعل الحدوث يُفهم هنا في السياق بمعنى مكاني: «في كفرناحوم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: لا بد أن
  rationale: تنقل التوكيد مع الفعل المستقبل، وتفيد أن يسوع يتوقع منهم هذا القول بثقة، دون تحويله إلى أمر.
- source_word: ἐρεῖτέ μοι
  choice: تقولوا لي
  rationale: تحافظ على دلالة المستقبل في السياق التنبؤي، وصيغة القول مع المفعول غير المباشر.
- source_word: παραβολὴν
  choice: المثل
  rationale: تشير هنا إلى قول مأثور موجز، لا إلى قصة تمثيلية مطولة؛ و«المثل» هو التعبير العربي الطبيعي الجامع لهذا الاستعمال.
- source_word: Ἰατρέ
  choice: يا طبيب
  rationale: تنقل صيغة النداء واسم صاحب المهنة بعبارة عربية فصيحة ملائمة لطابع القول المأثور.
- source_word: θεράπευσον σεαυτόν
  choice: اشفِ نفسك
  rationale: تحافظ على قوة الأمر المباشر وعلى معنى الشفاء دون تخصيصه بنوع مرض بعينه.
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: كل ما سمعنا أنه جرى
  rationale: تحافظ على كون المعرفة منقولة بالسماع، وتترجم γενόμενα ترجمة حدثية محايدة لا تضيف فاعلًا غير مذكور.
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: في كفرناحوم
  rationale: مع أن εἰς تعني عادة «إلى/نحو»، فإنها مع فعل الحدوث تؤدي هنا معنى مكانيًا؛ لذا جاءت «في» طبيعية في العربية، مع توثيق الحرف اليوناني في الحاشية.
- source_word: ποίησον καὶ ὧδε
  choice: افعله هنا أيضًا
  rationale: تحافظ على الأمر العام ποίησον وعلى معنى الإضافة في καί، مع ضمير يعود طبيعيًا إلى مجموع ما جرى.
- source_word: ἐν τῇ πατρίδι σου
  choice: في موطنك
  rationale: تنقل معنى المكان الذي ينتمي إليه الشخص أو بلدته الأصلية، وتحافظ على شيء من سعة πατρίς بدل حصرها صراحة في مدينة.
theological_decisions:
- issue: طبيعة παραβολή في هذا السياق
  choice: المثل
  alternative: القصة التمثيلية / القول
  rationale: العبارة «يا طبيب، اشفِ نفسك» قول مأثور موجز؛ لذلك فـ«المثل» أدق سياقيًا من لفظ قد يوحي حصرًا بقصة سردية.
- issue: دلالة γενόμενα على أحداث كفرناحوم
  choice: جرى
  alternative: صُنع / حدث
  rationale: «جرى» يبقي العبارة محايدة من جهة الفاعل وطبيعة الأعمال، فلا يحوّل اسم الفاعل المتوسط إلى مبني للمجهول ولا يحدد الأعمال بأنها معجزات صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعمل «المثل» للقول المأثور، و«موطنك» للمحافظة على سعة معنى πατρίς. وُضعت علامة الحاشية [a] في المتن وربطت بالمسألة الحرفية في εἰς.
