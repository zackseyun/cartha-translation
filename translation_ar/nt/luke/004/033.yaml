  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: ar
  text: وكان في المجمع رجلٌ به روحُ شيطانٍ نجسٍ، فصرخ بصوت عالٍ،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγωγῇ
  choice: المجمع
  rationale: اللفظ يشير هنا إلى مكان اجتماع اليهود وعبادتهم، و«المجمع» هو المقابل العربي الكتابي الواضح والمألوف.
- source_word: ἄνθρωπος
  choice: رجل
  rationale: السياق السردي وصيغة المفرد المذكر يدلان على رجل بعينه، لا على الإنسان على وجه العموم.
- source_word: ἔχων
  choice: به
  rationale: تنقل معنى «له/حاملًا» بصورة عربية طبيعية، من غير إضافة التفسير الأوسع «ممسوس» أو «مستحوذ عليه».
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: روحُ شيطانٍ نجسٌ
  rationale: تحافظ العبارة على عنصري «روح» و«شيطان» الواردين في اليونانية، كما تُبقي إمكان تعلّق صفة «نجس» بالشيطان بحسب التطابق النحوي الظاهر.
- source_word: ἀνέκραξεν
  choice: صرخ
  rationale: فعل عربي طبيعي ينقل النداء القوي المفاجئ من غير مبالغة تفسيرية.
- source_word: φωνῇ μεγάλῃ
  choice: بصوت عالٍ
  rationale: تعبير عربي مباشر يحافظ على الصورة المحسوسة في العبارة اليونانية.
theological_decisions:
- issue: صياغة المصطلح المتعلق بالروح والشيطان
  choice: روحُ شيطانٍ نجسٌ
  alternative: روحٌ نجسٌ من شيطان / روحٌ شيطانيّ نجسٌ
  rationale: النص اليوناني يذكر صراحةً كلًّا من «روح» و«شيطان»، لذلك لم تُختزل العبارة إلى «روح نجس» وحدها. كذلك لا تُضاف ألفاظ تفسيرية مثل «ممسوس».
- issue: مرجع الصفة ἀκαθάρτου
  choice: تتعلق في النص الرئيس بـ«شيطان»
  alternative: يمكن فهم المعنى على أنه «روح نجس»
  rationale: في البنية اليونانية، ἀκαθάρτου مفرد مذكر/محايد في حالة المضاف إليه ويطابق δαιμονίου مباشرةً، في حين أن πνεῦμα في حالة النصب. ومع ذلك، قد يصف التركيب كله طبيعة الروح؛ لذلك تُذكر الصياغة البديلة في الحاشية ولا يُطمس التوتر.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «به» بدل الترجمة الحرفية الثقيلة «له/حاملًا»، وحُفظت المصطلحات الخارقة للطبيعة بلا اختزال أو توسع عقائدي.
