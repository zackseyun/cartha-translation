lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: مدة أربعين يومًا
  rationale: يفيد النصب امتداد الزمن، و«مدة» تُظهر هذا المعنى بوضوح وطبيعية في العربية، مع اتصال العبارة بسياق الآية السابقة.
- source_word: πειραζόμενος
  choice: وكان ... يجرّبه
  rationale: الفعل اليوناني يحتمل التجربة بمعنى الإغراء أو الاختبار؛ ومع كون الفاعل هو إبليس، فـ«يجرّبه» أنسب في السياق، مع إثبات البديل في الحاشية.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: إبليس
  rationale: διάβολος هنا لقب شخصي معروف، و«إبليس» هو المقابل العربي الواضح المألوف، لا المعنى الاشتقاقي «المفتري».
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: لم يأكل شيئًا
  rationale: صياغة عربية طبيعية تحفظ النفي التام الوارد في الأصل.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: في تلك الأيام
  rationale: تنقل الإطار الزمني بوضوح وبأسلوب عربي مباشر.
- source_word: συντελεσθεισῶν αὐτῶν
  choice: فلما انتهت
  rationale: حُوِّل التركيب اليوناني المطلق إلى جملة زمنية عربية طبيعية، والضمير يعود إلى الأيام.
- source_word: ἐπείνασεν
  choice: جاع
  rationale: الفعل العربي الموجز والطبيعي ينقل حدوث الجوع عند انتهاء المدة.
theological_decisions:
- issue: دلالة πειραζόμενος في خبر تجربة يسوع في البرية
  choice: يجرّبه
  alternative: يختبره
  rationale: يحفظ الاختيار المعنى الأرجح في هذا السياق بسبب نسبة الفعل إلى إبليس، من غير إضافة تفسير عقائدي لطبيعة تجربة المسيح؛ وتُذكر الدلالة البديلة في الحاشية صونًا للاتساع الدلالي في اليونانية.
