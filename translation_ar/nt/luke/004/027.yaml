source:
  edition: SBLGNT
  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: ar
  text: وكان في إسرائيل كثيرون مصابون بالبرص[a] في زمن أليشع النبي، ولم يُطَهَّر أحد منهم إلا نعمان السوري.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يشير «البرص» في الاستعمال الكتابي إلى طائفة من الأمراض الجلدية، ولا يلزم أن يطابق المرض المعروف بهذا الاسم في الطب الحديث.
    reason: تجنب حصر المصطلح القديم في تشخيص طبي حديث أضيق مع إبقاء اللفظ الكتابي المألوف في المتن.
lexical_decisions:
- source_word: λεπροὶ
  choice: مصابون بالبرص
  rationale: ينقل الصفة اليونانية المستعملة استعمال الاسم بعبارة عربية واضحة تحفظ دلالة المرض في الاستعمال الكتابي، وتتجنب وصف الأشخاص به على أنه هويتهم.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: في إسرائيل
  rationale: تعبير طبيعي يحفظ الدلالة المكانية أو النطاقية من غير تقييدها صراحة بالأرض أو بالشعب.
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: في زمن أليشع النبي
  rationale: ينقل الاستعمال الزمني لحرف الجر مع المضاف إليه بوضوح، ويحفظ لقب أليشع.
- source_word: ἐκαθαρίσθη
  choice: يُطَهَّر
  rationale: يحفظ معنى التطهير المرتبط بالبرص في السياق الكتابي، بما فيه من تداخل البعد الجسدي والطهاري، بدل اختزاله في الشفاء الطبي وحده.
- source_word: εἰ μὴ
  choice: إلا
  rationale: أداة الاستثناء العربية هي المقابل الطبيعي للتركيب اليوناني هنا.
- source_word: Ναιμὰν ὁ Σύρος
  choice: نعمان السوري
  rationale: يحفظ الاسم بصيغته العربية المألوفة والنسبة القومية التعريفية التي تبرز أن المستفيد كان سوريًا.
theological_decisions:
- issue: دلالة لغة التطهير في سياق البرص
  choice: يُطَهَّر
  alternative: يُشفَ أو يُنقَّ
  rationale: يحفظ الفعل المختار الصدى الكتابي الذي يجمع بين زوال العلة والانتقال من النجاسة، من غير إضافة تقرير عقائدي غير مصرح به.
- issue: القوة البلاغية لنسبة نعمان القومية
  choice: نعمان السوري
  alternative: نعمان، وهو سوري
  rationale: تبقي النسبة في صلب النص وتحفظ إبراز أن الشخص الوحيد الذي طُهِّر كان أجنبيًا لا واحدًا من الكثيرين في إسرائيل.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. رُتبت الجملة بتقديم شبه الجملة «في إسرائيل» لتأتي طبيعية، واستُعمل البناء للمجهول محافظةً على صيغة الأصل من غير تعيين فاعل التطهير.
