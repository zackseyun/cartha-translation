  source_fidelity: 'ينقل النص جميع عناصر اليونانية بأمانة: وجود كثيرين مصابين بالبرص في إسرائيل في زمن أليشع النبي، وعدم تطهير أيٍّ منهم باستثناء نعمان السوري. ويحافظ المبني للمجهول «يُطَهَّر» على عدم تسمية الفاعل كما في الأصل، وعلى دلالة التطهير الكتابية.'
  naturalness: 'الصياغة فصيحة حديثة وواضحة: «وكان في إسرائيل كثيرون مصابون بالبرص ... ولم يُطَهَّر أحد منهم إلا نعمان السوري». والترتيب طبيعي ومناسب للسياق الوعظي.'
