source:
  edition: SBLGNT
  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: ar
  text: 'ثم بدأ يقول لهم: «اليوم تمَّ هذا المكتوب على مسامعكم[a]».


    [a] حرفيًّا: «في آذانكم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «في آذانكم».'
    reason: بيان الصورة الحرفية للتعبير اليوناني الذي صيغ في المتن بصياغة عربية طبيعية.
lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν
  choice: ثم بدأ يقول
  rationale: تنقل «ثم» التقدّم السردي الذي تؤديه δέ، ويحافظ «بدأ يقول» على تركيب فعل البدء مع المصدر دون زيادة تفسيرية.
- source_word: πρὸς αὐτοὺς
  choice: لهم
  rationale: صياغة عربية طبيعية ومباشرة لتحديد المخاطَبين بعد فعل القول.
- source_word: Σήμερον
  choice: اليوم
  rationale: تحافظ على الدلالة الزمنية وعلى بروز الكلمة في صدر إعلان يسوع.
- source_word: πεπλήρωται
  choice: تمَّ
  rationale: ينقل اكتمال ما يدل عليه الفعل اليوناني التام المبني للمجهول وقيام نتيجته في الحاضر، من غير شرح لطبيعة الإتمام.
- source_word: ἡ γραφὴ αὕτη
  choice: هذا المكتوب
  rationale: يشير بوضوح إلى النص المقدس الذي قُرئ للتو، وهو تعبير عربي موجز يحافظ على معنى γραφή في السياق.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: على مسامعكم
  rationale: تعبير عربي طبيعي ينقل وقوع الإتمام في أثناء سماع المخاطَبين، مع إثبات الصياغة الحرفية في الحاشية.
theological_decisions:
- issue: طبيعة إعلان الإتمام
  choice: إبقاء الإعلان على أن المكتوب قد تمّ اليوم على مسامع الحاضرين، من غير تحديد صريح لكيفية الإتمام أو فاعله.
  alternative: 'التوسّع إلى: «تمّت هذه النبوّة اليوم بي وأنتم تسمعونها».'
  rationale: لا يذكر النص اليوناني صراحةً «النبوّة» أو «بي»، وإن كان السياق يحمل دلالة قوية على ارتباط الإتمام بيسوع؛ لذا تُحفظ قوة الإعلان وتوتّره اللاهوتي من دون إدخال تفسير في المتن.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقّرة. استُعمل «هذا المكتوب» للإشارة إلى النص المقدس المقروء، و«على مسامعكم» لنقل الاصطلاح اليوناني بصورة مألوفة مع الحفاظ على صورته الحرفية في الحاشية.
