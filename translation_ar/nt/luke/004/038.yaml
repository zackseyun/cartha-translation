lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: ثم قام وخرج من المجمع
  rationale: اسم الفاعل الماضي يدل على فعل سبق الدخول. أُظهر معنى الحركة من المجمع بعبارة عربية طبيعية، مع إبقاء «قام» مقابل Ἀναστάς.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: ودخل بيت سمعان
  rationale: صياغة عربية موجزة وطبيعية تحفظ معنى الدخول إلى المكان والإضافة الدالة على صاحب البيت.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: حماة سمعان
  rationale: «حماة» هي المقابل العربي المحدد لأم الزوجة أو الزوج، وتنقل صلة القرابة مباشرة بلا استنتاجات مضافة.
- source_word: ἦν συνεχομένη πυρετῷ μεγάλῳ
  choice: كانت تعاني حمى شديدة
  rationale: الفعل المبني للمجهول يصوّرها واقعة تحت وطأة المرض؛ و«تعاني» تعبير عربي واضح، بينما «شديدة» تنقل قوة μέγας من غير التزام بوصف طبي تقني لدرجة الحرارة.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: فسألوه من أجلها
  rationale: يحفظ فعل السؤال واتجاهه المتعلق بها، ويلائم السياق الذي يوحي بطلب المعونة من غير أن يصرّح بالشفاء بما يتجاوز اللفظ اليوناني.
theological_decisions:
- issue: ما توحي به عبارة «حماة سمعان» عن حالته الزوجية
  choice: إثبات صلة القرابة وحدها بعبارة «حماة سمعان».
  alternative: إضافة تصريح بأن سمعان كان متزوجًا.
  rationale: النص يسمّي صلة القرابة بوضوح، لكنه لا يجعل الحالة الزوجية موضوع تصريح مستقل؛ لذلك لا تُضاف نتيجة تفسيرية إلى المتن.
- issue: طبيعة الطلب في ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: «فسألوه من أجلها» في المتن.
  alternative: «فالتمسوا منه أن يشفيها» أو «طلبوا منه مساعدتها».
  rationale: السياق يرجح التماس المعونة، لكن العبارة اليونانية لا تصرّح بالفعل المطلوب؛ فتحافظ الصياغة المختارة على هذا القدر من الانفتاح، وتوضح الحاشية الدلالة السياقية المحتملة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «المجمع» للمؤسسة/مكان العبادة اليهودي، و«حمى شديدة» بدل تعبير طبي أكثر تخصيصًا، مع الحفاظ على إيجاز السرد. وُضع مؤشر الحاشية بعد العبارة التي يشرحها مباشرة.
