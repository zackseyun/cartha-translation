  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: ar
  text: ورجع يسوع إلى الجليل بقوة الروح، وذاع خبرٌ[a] عنه في المنطقة المحيطة كلها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نبأ» أو «صيت» أو «حديث». يمكن للكلمة اليونانية أن تدل على خبر واسع الانتشار من غير أن تحدد إن كان إيجابيًا أم سلبيًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: رجع
  rationale: ينقل فعل العودة في سياق الحركة السردية بعبارة عربية طبيعية موجزة.
- source_word: ἐν τῇ δυνάμει
  choice: بقوة
  rationale: الباء صياغة عربية طبيعية تعبّر عن ملابسة القوة لرجوع يسوع، من غير حسم زائد بين معنى الوسيلة ومعنى الحال أو المجال.
- source_word: τοῦ πνεύματος
  choice: الروح
  rationale: السياق القريب يدل على الروح القدس، لكن صفة «القدس» غير مذكورة صراحة في هذه الآية، لذلك حُفظت صيغة «الروح».
- source_word: εἰς τὴν Γαλιλαίαν
  choice: إلى الجليل
  rationale: تعبير عربي طبيعي عن جهة السفر ووصوله.
- source_word: φήμη
  choice: خبرٌ
  rationale: يدل اللفظ على خبر أو حديث ذائع عن شخص، من غير أن يحدد بذاته إن كان إيجابيًا أو سلبيًا.
- source_word: ἐξῆλθεν
  choice: ذاع
  rationale: ينقل في العربية بوضوح الصورة المقصودة، وهي انتشار الخبر، بدل ترجمة حرفية ثقيلة من قبيل «خرج خبر».
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: في المنطقة المحيطة كلها
  rationale: يحفظ شمول الانتشار ودلالة الإقليم المحيط بصياغة عربية واضحة.
- source_word: περὶ αὐτοῦ
  choice: عنه
  rationale: المقابل العربي الطبيعي الموجز لمعنى «بشأنه» أو «عن يسوع».
theological_decisions:
- issue: مرجع πνεύματος
  choice: الروح، والمقصود في السياق الروح القدس
  alternative: روح غير محددة
  rationale: تكرار الإشارة إلى الروح القدس في السياق المباشر من لوقا 4 يحدد المرجع، مع عدم إضافة لفظ «القدس» غير الموجود صراحة في نص الآية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «ذاع خبر» لأنه التعبير العربي المألوف لانتشار الخبر، مع إبقاء الغموض الدلالي في الحاشية. وُضعت علامة الحاشية بعد الجملة التي تتضمن «خبر» وفق تنسيق الإحالات.
