  rationale: مرجع الضمير هو يسوع، ولا تقتضي العربية إظهار «هو» هنا؛ وإظهاره قد يوحي بتوكيد أقوى مما يلزم.
- source_word: ἐδίδασκεν
  choice: كان يعلِّم
  rationale: تنقل صيغة «كان» مع المضارع الجانب الاستمراري أو الاعتيادي للفعل الناقص اليوناني.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: في مجامعهم
  rationale: ترجمة مكانية مباشرة وطبيعية، مع حفظ ضمير الملكية العائد إلى الجماعات المذكورة في السياق.
- source_word: δοξαζόμενος
  choice: وكان الجميع يمجِّدونه
  rationale: يحفظ «يمجِّدونه» الصلة اللفظية بمفهوم المجد، بينما تُحوَّل صيغة اسم المفعول اليونانية إلى جملة فعلية عربية طبيعية متزامنة مع التعليم.
- source_word: ὑπὸ πάντων
  choice: الجميع
  rationale: جُعل الفاعل صريحًا في البناء العربي المعلوم، وهو ينقل عموم πάντων بإيجاز من غير الإلزام بأن المقصود كل فرد بلا استثناء.
