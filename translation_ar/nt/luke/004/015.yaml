  choice: وكان الجميع يمجِّدونه
  alternative: وكان الجميع يمدحونه؛ وكان الجميع يكرمونه
  rationale: قد يدل الفعل على المدح أو الإكرام في سياق الاستقبال العلني الحسن. واختيار «يمجِّدونه» يحفظ الصلة بلغة المجد من غير أن يفرض على السياق معنى لاهوتيًا أوسع مما يحتمله.
