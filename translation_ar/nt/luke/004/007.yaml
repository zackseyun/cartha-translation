    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ οὖν
  choice: فإن
  rationale: تفيد الفاء هنا النتيجة المترتبة على العرض السابق، وتدخل طبيعيًّا على جملة الشرط في العربية. لا يلزم تمثيل الضمير المنفصل σὺ بضمير مستقل، لأن تاء المخاطب تؤديه بوضوح.
- source_word: ἐὰν
  choice: إن
  rationale: أداة شرط مناسبة للسياق، وتحافظ على كون الوعد معلّقًا على تحقق الفعل.
- source_word: προσκυνήσῃς
  choice: سجدتَ
  rationale: الفعل اليوناني قد يدل على السجود الجسدي أو تقديم العبادة. واختيار «سجدت» يحفظ صورة الفعل ويدع السياق، ولا سيما جواب يسوع في الآية التالية، يبيّن أن المقصود ولاء تعبدي.
- source_word: ἐνώπιον ἐμοῦ
  choice: أمامي
  rationale: تعبير عربي موجز وطبيعي يؤدي المعنى المكاني والعلاقي للعبارة اليونانية.
- source_word: ἔσται σοῦ
  choice: يصير ... لك
  rationale: ينقل فعل الكينونة المستقبلي مع دلالة الملكية بصياغة عربية طبيعية.
- source_word: πᾶσα
  choice: هذا كلُّه
  rationale: المؤنث المفرد في اليونانية يعود إجمالًا إلى ما سبق من سلطان ومجد الممالك. أضيف اسم الإشارة في العربية لإيضاح المرجع الإضماري من غير إدخال اسم غير موجود في الآية.
theological_decisions:
- issue: هل يُترجم προσκυνέω بلفظ صريح في العبادة أم بلفظ السجود؟
  choice: سجدتَ أمامي
  alternative: عبدتني؛ سجدت لي سجود عبادة
  rationale: «سجدت» يحافظ على المجال الدلالي المباشر للفعل وعلى قدر من الغموض الحقيقي بين الهيئة الجسدية والتكريم الديني، بينما يوضح سياق التجربة ورد يسوع في الآية التالية أن المطلوب عبادة لا مجرد انحناءة عادية.
