  text: And he was preaching in the synagogues of Judea[a].
translation:
  language: ar
  text: وكان يكرز في مجامع اليهودية[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تقرأ بعض المخطوطات «الجليل» بدلًا من «اليهودية». ويتبع المتن هنا قراءة «اليهودية» الواردة في النص اليوناني المعتمد.
    reason: textual_variant
lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: كان يكرز
  rationale: التركيب المحيطي في اليونانية يدل على فعل مستمر أو متكرر في الماضي، وصيغة «كان يكرز» تنقل هذا الجانب بوضوح وطبيعية.
- source_word: κηρύσσων
  choice: يكرز
  rationale: الفعل يدل على الإعلان العلني، و«يكرز» تعبير عربي كتابي واضح وملائم لسياق التعليم العلني في المجامع.
- source_word: εἰς τὰς συναγωγάς
  choice: في مجامع
  rationale: مع أن εἰς قد يدل أصلًا على الاتجاه إلى الداخل، فإنه هنا يحدد مجال النشاط ومكانه، لذلك جاءت «في» طبيعية ودقيقة.
- source_word: συναγωγάς
  choice: مجامع
  rationale: يشير اللفظ في هذا السياق إلى المجامع اليهودية بوصفها أماكن اجتماع وعبادة، و«مجامع» هي المقابل العربي المألوف.
- source_word: Ἰουδαίας
  choice: اليهودية
  rationale: النص اليوناني المعتمد يقرأ «اليهودية»، ولذلك حُفظت هذه القراءة رغم التوتر الجغرافي مع السياق القريب، من غير مواءمة صامتة.
theological_decisions:
- issue: الإشارة الجغرافية «τῆς Ἰουδαίας» في ضوء السياق الجليلي المحيط
  choice: اليهودية
  alternative: الجليل؛ أو فهم «اليهودية» بمعنى جغرافي أوسع يشمل أرض اليهود
  rationale: تقتضي أولوية شاهد اللغة الأصلية إبقاء قراءة SBLGNT «اليهودية»، مع تسجيل القراءة البديلة في الحاشية بدل تسوية التوتر النصي أو السردي داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كتابية وقورة. استُخدم «يكرز» للمحافظة على معنى الإعلان العلني، وأُبقيت «اليهودية» بحسب النص اليوناني مع بيان الاختلاف النصي في الحاشية.
