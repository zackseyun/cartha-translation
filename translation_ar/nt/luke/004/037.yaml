lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: كان ينتشر
  rationale: 'صيغة الماضي الناقص تفيد فعلًا مستمرًا في الماضي. ومع كون «الخبر» فاعلًا، تؤدي «كان ينتشر» المعنى الاصطلاحي بوضوح وطبيعية، مع إمكان الترجمة الأقرب إلى اللفظ: «كان يخرج».'
- source_word: ἦχος
  choice: الخبر
  rationale: مع أن الكلمة قد تعني حرفيًا «صوتًا»، فإن اقترانها بعبارة «عنه» وفعل الخروج يدل هنا على خبر أو تقرير ذائع عن يسوع.
- source_word: περὶ αὐτοῦ
  choice: عنه
  rationale: ترجمة عربية مباشرة وطبيعية تدل على مضمون الخبر.
- source_word: εἰς πάντα τόπον
  choice: في كل موضع
  rationale: تحافظ على القوة التوزيعية لعبارة «كل موضع»، وتأتي طبيعية في العربية مع فعل الانتشار.
- source_word: τῆς περιχώρου
  choice: من المنطقة المحيطة
  rationale: تدل περίχωρος على الناحية أو المنطقة الواقعة حول المكان المقصود؛ وصياغة «كل موضع من المنطقة المحيطة» تحفظ علاقة المضاف إليه في اليونانية بوضوح.
- source_word: καὶ
  choice: و
  rationale: تحفظ أداة الربط السردية البسيطة من غير إضافة دلالة تفسيرية.
