lexical_decisions:
- source_word: αὐτὸς
  choice: أَمَّا هُوَ
  rationale: الضمير مذكور صراحة وله شيء من التوكيد؛ وهذه الصياغة العربية تُبرزه طبيعيًّا وتربطه بالمقابلة مع قصد الجموع في السياق السابق.
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: تؤدي معنى الانتقال مع المقابلة الخفيفة بين محاولة الجمع وما فعله يسوع، من غير إثقال العبارة بحرف استدراك أقوى من اللازم.
- source_word: διελθὼν
  choice: اجْتَازَ
  rationale: ينقل فعل الحركة عبر مكان، ويأتي عربيًّا في تعاقب طبيعي مع الفعل الرئيس مع بقاء العلاقة الزمنية واضحة.
- source_word: διὰ μέσου αὐτῶν
  choice: مِنْ وَسَطِهِمْ
  rationale: يحفظ الصورة المكانية، أي مروره عبر وسط الجماعة، ولا يحدد كيفية حدوث ذلك.
- source_word: ἐπορεύετο
  choice: مَضَى فِي طَرِيقِهِ
  rationale: يعبر عن الحركة المستمرة التي يوحي بها الماضي الناقص، بصياغة عربية طبيعية تدل على أنه تابع طريقه.
theological_decisions:
- issue: هل ينبغي أن توحي الآية بأن النجاة كانت معجزية؟
  choice: 'صياغة وصفية محايدة: «اجتاز من وسطهم، ومضى في طريقه»'
  alternative: صياغة تصرح بتدخل خارق، مثل «اجتاز بينهم بمعجزة»
  rationale: اليونانية تصف حركة يسوع وسط الجمع ولا تذكر كيف حدثت؛ لذلك تُبقي الترجمة كيفية نجاته غير محددة ولا تفرض تفسيرًا معجزيًّا أو طبيعيًّا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أما هو فـ» لإظهار المقابلة والتوكيد المعتدل، و«مضى في طريقه» لنقل استمرار الحركة من غير تكلف حرفي.
