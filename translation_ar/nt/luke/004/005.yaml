  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: ar
  text: وبعد أن أصعده، أراه جميع ممالك العالم المسكون[a] في لحظة من الزمن[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العالم». وقد يدل اللفظ اليوناني على العالم المأهول، وفي بعض السياقات على العالم المتحضّر أو الخاضع للإمبراطورية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في لحظة خاطفة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν
  choice: بعد أن أصعده
  rationale: يحافظ على دلالة الصعود وعلى تعاقب الحدثين في صيغة اسم الفاعل اليونانية، من غير إضافة موضع مثل الجبل، إذ لا يذكره نص لوقا هنا.
- source_word: ἔδειξεν
  choice: أراه
  rationale: تعبير عربي طبيعي ودقيق لمعنى «جعله يرى/عرض له»، ويلائم المفعولين في السياق.
- source_word: πάσας τὰς βασιλείας
  choice: جميع ممالك
  rationale: ينقل الجمع مع معنى الشمول، ويفهم βασιλεία هنا بوصفها ممالك أو أقاليم حكم لا مفهوم المُلك المجرّد.
- source_word: τῆς οἰκουμένης
  choice: العالم المسكون
  rationale: يحفظ الدلالة الخاصة للعالم المأهول، من غير تضييقها إلى الإمبراطورية الرومانية وحدها.
- source_word: ἐν στιγμῇ χρόνου
  choice: في لحظة من الزمن
  rationale: يعكس التعبير اليوناني الذي يشدد على قِصر المدة الشديد، بصياغة عربية واضحة ورصينة.
theological_decisions:
- issue: كيفية إراءة إبليس للممالك
  choice: وصف الحدث بأنه أراه الممالك من غير تحديد آليته
  alternative: اعتباره رؤيا خارقة للطبيعة أو مشاهدة حرفية من موضع مرتفع
  rationale: لا يحدد النص إن كانت الإراءة رؤيوية أو خارقة أو جغرافية؛ لذلك تُحفظ دلالة الرواية وغموض آليتها من غير حسم.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «أصعده» لإبقاء حركة الصعود من غير استيراد ذكر الجبل من الرواية الموازية، و«العالم المسكون» للمحافظة على خصوصية οἰκουμένη.
