  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: ar
  text: وجاء إلى نازارا[a]، حيث تربّى، وكعادته دخل المجمع يوم السبت، وقام ليقرأ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الناصرة». النص اليوناني هنا يقرأ «نازارا».
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: نازارا
  rationale: نقلٌ صوتي مباشر للصيغة اليونانية الواردة في هذه الآية، من غير توحيدها ضمنًا مع الصيغة الأشهر «الناصرة»؛ وتُذكر الصيغة المألوفة في الحاشية.
- source_word: τεθραμμένος
  choice: كان قد تربّى
  rationale: ينقل معنى التنشئة والنشوء في المكان، مع مراعاة دلالة اسم المفعول التام على حال نتجت عن تربية سابقة.
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: حسب عادته
  rationale: عبارة عربية طبيعية موجزة تعبّر بوضوح عن الممارسة المعتادة.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: يوم السبت
  rationale: التركيب اليوناني ذو صيغة الجمع اصطلاحي، والمقصود في السياق يوم السبت بصيغة المفرد.
- source_word: συναγωγήν
  choice: المجمع
  rationale: يشير في هذا السياق اليهودي إلى موضع الاجتماع والعبادة؛ و«المجمع» هو المقابل العربي الواضح المألوف.
- source_word: ἀνέστη ἀναγνῶναι
  choice: قام ليقرأ
  rationale: يحافظ على فعل القيام وعلى دلالة الغرض التي يؤديها المصدر اليوناني.
theological_decisions:
- issue: نقل اسم المكان Ναζαρά
  choice: نازارا
  alternative: الناصرة
  rationale: اتُّبعت الصيغة اليونانية الفعلية في الآية بدل مواءمتها صامتًا مع الاسم العربي التقليدي الأشهر، مع إثبات البديل في الحاشية. ولا يترتب على ذلك حسم عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تسلسل الحدث ومعنى العادة والغرض، مع صياغة طبيعية غير متكلّفة.
