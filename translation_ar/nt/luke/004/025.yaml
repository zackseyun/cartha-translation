  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: ar
  text: 'لكنّي أقول لكم حقًّا: كانت في إسرائيل أرامل كثيرات في أيام إيليا، حين أُغلقت السماء ثلاث سنين وستة أشهر، فحدثت مجاعة عظيمة في الأرض كلها.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: حقًّا
  rationale: ينقل معنى التأكيد الصادق بعبارة عربية طبيعية ومباشرة.
- source_word: ἐκλείσθη ὁ οὐρανός
  choice: أُغلقت السماء
  rationale: يحافظ على الصورة المجازية في اليونانية وعلى صيغة المبني للمجهول دون تعيين الفاعل صراحة.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: في الأرض كلها
  rationale: يحفظ مدى العبارة كما ورد، مع إبقاء احتمال أن المقصود البلاد أو الأرض بحسب السياق.
theological_decisions:
- issue: الفاعل في إغلاق السماء
  choice: أُغلقت السماء
  alternative: أغلق الله السماء
  rationale: المصدر يستخدم المبني للمجهول ولا يصرّح بالفاعل؛ لذلك لم تُضف إحالة تفسيرية إلى الله داخل النص.
- issue: مدى المجاعة
  choice: في الأرض كلها
  alternative: في البلاد كلها
  rationale: لفظة γῆ تحتمل الأرض أو البلاد؛ اختيرت الصياغة الأوسع مع إبقاء الغموض السياقي الحقيقي.
