base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: ar
  text: 'لكنه قال لهم: «لا بد لي أن أبشّر[a] أيضًا في المدن الأخرى بملكوت الله، لأنني لهذا أُرسلت[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أعلن البشارة في».'
    reason: بديل معجمي يبرز صراحة معنى إعلان الخبر السار في εὐαγγελίζω.
  - marker: b
    text: 'أو: «لأنني أُرسلت لهذا الغرض».'
    reason: بديل تعبيري يوضح دلالة الغاية في ἐπὶ τοῦτο.
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: لكنه قال لهم
  rationale: تنقل «لكن» الانتقال ذا النبرة التقابلية الخفيفة في δέ، إذ يجيب يسوع بما يخالف رغبة الجموع في إبقائه.
- source_word: Καὶ ταῖς ἑτέραις πόλεσιν
  choice: المدن الأخرى أيضًا
  rationale: تحفظ «أيضًا» المعنى الإضافي لـ καί، وتدل «المدن الأخرى» بوضوح على أماكن غير المدينة الحاضرة.
- source_word: εὐαγγελίσασθαί
  choice: أن أبشّر
  rationale: الفعل العربي «بشّر» ينقل معنى إعلان الخبر السار بإيجاز وطبيعية، من غير حصره في مصطلح كنسي تقني.
- source_word: με δεῖ
  choice: لا بد لي
  rationale: تعبر العبارة عن ضرورة قوية، وتبقي ما في السياق اللوقاوي من إيحاء بضرورة مرتبطة بالرسالة.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: بملكوت الله
  rationale: «ملكوت الله» تعبير عربي كتابي راسخ يحفظ إمكان دلالة العبارة على سلطان الله وملكه من غير اختزالها في مكان أو نطاق جغرافي فقط.
- source_word: ἐπὶ τοῦτο
  choice: لهذا
  rationale: صياغة موجزة وطبيعية تفيد الغاية، مع إثبات الصياغة الأوضح «لهذا الغرض» في الحاشية.
- source_word: ἀπεστάλην
  choice: أُرسلت
  rationale: يحفظ المبني للمجهول ولغة الإرسالية من غير التصريح بهوية المُرسِل، كما يفعل النص اليوناني.
theological_decisions:
- issue: قوة ضرورة رسالة يسوع
  choice: «لا بد لي»
  alternative: «ينبغي لي» أو «يجب عليّ»
  rationale: تنقل العبارة ضرورة الرسالة بقوة، من غير إضافة شرح صريح بأنها ضرورة إلهية، مع أن السياق قد يوحي بذلك.
- issue: هوية مُرسِل يسوع
  choice: 'الإبقاء على المبني للمجهول: «أُرسلت»'
  alternative: «أرسلني الله»
  rationale: يوحي السياق بأن الله هو المُرسِل، لكن الآية لا تسميه صراحة؛ لذلك تُحفظ صيغة النص وتوترها اللاهوتي.
- issue: دلالة ملكوت الله
  choice: «ملكوت الله»
  alternative: «مملكة الله» أو «حكم الله»
  rationale: تحفظ الصياغة المختارة الاتساع الدلالي بين مُلك الله وسلطانه ونطاق ملكه، ولا تحسمه في معنى واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «لا بد لي» لإبراز الضرورة بصورة طبيعية، و«ملكوت الله» للمحافظة على المصطلح الكتابي واتساعه الدلالي. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
