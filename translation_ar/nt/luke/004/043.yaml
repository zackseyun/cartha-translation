  source_fidelity: 'المسودة تحفظ عناصر النص الأساسية: الانتقال في «لكنه»، والضرورة في «لا بد لي»، وملكوت الله، والمبني للمجهول في «أُرسلت». لكن تركيب «أبشّر المدن الأخرى بملكوت الله» يجعل «المدن» مفعولًا مباشرًا لـ«أبشّر»، وهو أقل دقة في تمثيل داتيف الجمع ταῖς ἑτέραις πόλεσιν، وقد يوحي بأن المدن نفسها هي المتلقية للبشارة. إضافة «في» توضح أن التبشير يقع في تلك المدن من دون تغيير المعنى.'
