  terminology: «ملكوت الله» مصطلح كتابي عربي مناسب ويحفظ سعة βασιλεία. و«أبشّر» مناسب لـεὐαγγελίσασθαι، مع أن الحاشية تقدم بديلًا شارحًا مقبولًا. تُحفظ «أُرسلت» مبنية للمجهول كما في اليونانية، فلا تضيف هوية المرسِل.
