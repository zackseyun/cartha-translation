  rationale: 'يقتصر التعديل على إدخال «في» بعد «أبشّر» وإعادة موضع «أيضًا» إلى ما قبل شبه الجملة، كي يظهر بوضوح أن يسوع يعلن البشارة في مدن أخرى أيضًا. ويحافظ ذلك على ترتيب المعاني اليوناني: ضرورة الإرسال إلى مدن غير الحاضرة، وإعلان ملكوت الله فيها، وغاية الإرسال.'
