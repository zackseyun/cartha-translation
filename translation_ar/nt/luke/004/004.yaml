  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: ar
  text: 'فأجابه يسوع: «مكتوب: ‹ليس بالخبز وحده يحيا الإنسان›».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اقتباس من التثنية 8:3.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: فأجابه
  rationale: صياغة عربية طبيعية تؤدي معنى الفعل مع πρός والمفعول به، وتربط الجواب بالسياق السابق بواسطة الفاء.
- source_word: Γέγραπται
  choice: مكتوب
  rationale: صيغة الاقتباس الكتابي المألوفة في العربية، وتحافظ بإيجاز على دلالة الحالة القائمة في صيغة التمام اليونانية.
- source_word: ὅτι
  choice: ':'
  rationale: تؤدي النقطتان وظيفة إدخال نص الاقتباس بصورة طبيعية، بدل ترجمة ὅτι ترجمة حرفية.
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: بالخبز وحده
  rationale: الباء تعبّر طبيعيًا عن وسيلة قوام الحياة أو أساسها، و«وحده» تحفظ قيد μόνῳ.
- source_word: ζήσεται
  choice: يحيا
  rationale: المضارع العربي في هذا القول العام طبيعي، ويؤدي المعنى المستقبلي أو المبدئي الذي للسياق دون تكلف «سيحيا».
- source_word: ὁ ἄνθρωπος
  choice: الإنسان
  rationale: يحفظ المفرد المعرّف ذا الدلالة العامة، وهو في العربية شامل للجنس البشري من غير تحويله إلى جمع أو اسم جمع مجرد.
theological_decisions:
- issue: دلالة ὁ ἄνθρωπος المفرد في الاقتباس من التثنية 8:3
  choice: الإنسان
  alternative: المرء
  rationale: «الإنسان» يحافظ على المفرد العام وعلى الصدى الكتابي، ويفيد البشر عمومًا من غير تخصيص الذكر أو تسوية العبارة إلى جمع.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع إبقاء صيغة الاقتباس الكتابي المألوفة «مكتوب» وتمييز الاقتباس الداخلي بعلامتي تنصيص داخليتين.
