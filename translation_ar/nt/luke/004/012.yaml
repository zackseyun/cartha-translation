  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: ar
  text: 'فأجابه يسوع: «قد قيل: لا تضع الرب إلهك موضع الاختبار».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تترجم بعض النسخ هذه العبارة بـ«مكتوب»، أما اليونانية هنا فتقول حرفيًا: «قد قيل».'
    reason: alternative_reading
  - marker: b
    text: هذا اقتباس من تثنية 6:16، حيث يرد في النص العبري الاسم الإلهي «يهوه»، الذي يُترجم غالبًا «الرب».
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτῷ
  choice: فأجابه يسوع
  rationale: هذا التركيب اليوناني، المتأثر بالأسلوب السامي، يؤدي معنى الإجابة أو الرد. والصياغة العربية المختصرة طبيعية وتحفظ الإحالة إلى المخاطَب من خلال ضمير المفعول.
- source_word: ὅτι
  choice: —
  rationale: لا تحتاج العربية إلى ترجمة الأداة ترجمة مستقلة بعد «أجابه»، إذ يُقدَّم مضمون الجواب مباشرة.
- source_word: Εἴρηται
  choice: قد قيل
  rationale: الفعل تام مبني للمجهول من λέγω، ومعناه الحرفي أن القول قد صدر وصار قائمًا؛ وتحفظ «قد قيل» لفظ القول بدل استبداله تقليديًا بلفظ الكتابة.
- source_word: Οὐκ ἐκπειράσεις
  choice: لا تضع ... موضع الاختبار
  rationale: ἐκπειράζω يدل على إخضاع شخص للاختبار أو امتحانه. هذه الصياغة واضحة، وتتجنب إيحاء «تجرّب» بمعنى الإغراء بالخطيئة.
- source_word: κύριον τὸν θεόν σου
  choice: الرب إلهك
  rationale: تحفظ العبارة تركيب الاقتباس العهدي، وتترجم κύριος بـ«الرب» وτὸν θεόν σου بـ«إلهك» في بدل أو بيان له.
theological_decisions:
- issue: صيغة الاستشهاد الكتابي Εἴρηται
  choice: قد قيل
  alternative: مكتوب؛ قد كُتب
  rationale: النص اليوناني يستعمل فعل «قال» لا فعل «كتب»، ولذلك يحافظ المتن على لفظ المصدر مع الإشارة في الحاشية إلى الصياغة التقليدية الشائعة.
- issue: ترجمة κύριος في اقتباس تثنية 6:16
  choice: الرب
  alternative: يهوه
  rationale: يترجم المتن اللفظ اليوناني κύριος مباشرةً بـ«الرب»، بينما توضّح الحاشية أن النص العبري المقتبس يرد فيه الاسم الإلهي يهوه، من غير إحلاله في المتن اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «فأجابه» بدل النقل الحرفي الثقيل «فأجاب وقال له»، و«موضع الاختبار» لتوضيح معنى الفعل من دون إيحاء الإغراء بالخطيئة. وُضعت علامتا الحاشية بعد الاقتباس مع الحفاظ على ترتيبهما المتسلسل.
