base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: ar
  text: 'فقال له إبليس: «إن كنتَ ابنَ الله، فقُل لهذا الحجر أن يصير خبزًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بما أنك ابن الله». قد يُفهم الشرط اليوناني على أنه يفترض صحة المقدمة لغرض التحدي، لكن النص الرئيس يحافظ على صيغة الشرط.'
    reason: alternative_reading
lexical_decisions:
- source_word: ⸂εἶπεν δὲ⸃
  choice: فقال
  rationale: تنقل الفاءُ رابط δέ الخفيف وتتابع السرد في عربية طبيعية، و«قال» يقابل εἶπεν مباشرة.
- source_word: ὁ διάβολος
  choice: إبليس
  rationale: «إبليس» هو الاسم العربي المألوف للشخص المقصود في هذا السياق، وهو أوضح من نقل المعنى الاشتقاقي مثل «المفتري».
- source_word: Εἰ
  choice: إن
  rationale: تحفظ «إن» صيغة الشرط في اليونانية ولا تحسم ما إذا كان المتكلم يفترض صحة المقدمة لأجل التحدي.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: ابنَ الله
  rationale: التركيب خبرٌ لـ«كنت» ويفيد اللقب المعروف في هذا السياق المسيحاني، لا معنى «ابن من أبناء الله».
- source_word: εἰπὲ
  choice: قُل
  rationale: يقابل فعل القول بصيغة الأمر من غير تقويته إلى «مُرْ»، التي تضيف معنى الأمر الصريح إلى اللفظ اليوناني.
- source_word: τῷ λίθῳ τούτῳ
  choice: لهذا الحجر
  rationale: «الحجر» هو المقابل الطبيعي لـ λίθος، مع الحفاظ على اسم الإشارة.
- source_word: ἵνα γένηται
  choice: أن يصير
  rationale: بعد فعل القول، ينقل تركيب «أن» مع المضارع مضمون القول ونتيجته بصورة عربية واضحة وطبيعية.
- source_word: ἄρτος
  choice: خبزًا
  rationale: «خبز» هو المقابل المباشر من غير تخصيصه برغيف أو تعميمه إلى الطعام.
theological_decisions:
- issue: دلالة الشرط في Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: إن كنتَ ابنَ الله
  alternative: بما أنك ابن الله
  rationale: يحافظ النص الرئيس على الصيغة الشرطية وعلى توتر مشهد التجربة، من غير أن ينفي بنوّة يسوع أو يحوّل الشرط صراحةً إلى حقيقة مفترضة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «إبليس» بوصفه التعبير العربي الشائع، وحُفظ الشرط بصيغة «إن كنت». وُضعت علامة الحاشية بعد الجملة التي تتعلق بها.
