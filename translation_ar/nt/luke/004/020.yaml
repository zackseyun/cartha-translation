  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: ar
  text: ثم لفَّ الدرج[a] وأعاده إلى خادم المجمع[b]، وجلس. وكانت عيون جميع من في المجمع مثبتةً عليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الكتاب». يمكن أن تدل الكلمة اليونانية على وثيقة مكتوبة بوجه عام، لكن المرجح في هذا السياق أنها درج يُقرأ منه في المجمع.
    reason: lexical_alternative
  - marker: b
    text: أي الشخص القائم على خدمة المجمع، الذي يتولى مناولة الدرج وحفظه.
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: لفَّ
  rationale: يدل الفعل في هذا السياق على لفّ الدرج بعد القراءة، لا على إغلاق كتاب ذي صفحات.
- source_word: βιβλίον
  choice: الدرج
  rationale: اللفظ اليوناني أعمّ من ذلك، لكن المقروء في مجمع يهودي في القرن الأول كان درجًا؛ وهذا الاختيار يحافظ على الصورة التاريخية.
- source_word: ἀποδοὺς
  choice: أعاده
  rationale: يفيد ردّ الشيء إلى من كان في عهدته بعد استعماله، و«أعاده» تعبير عربي موجز وطبيعي.
- source_word: ὑπηρέτῃ
  choice: المعاون
  rationale: يشير هنا إلى القائم على خدمة المجمع ومناولة الدرج، لا إلى عبد أو موظف رسمي؛ و«المعاون» يتجنب الإيحاءات المضللة لكلمة «خادم» وحدها.
- source_word: ἐκάθισεν
  choice: جلس
  rationale: ينقل الفعل السردي مباشرة من غير إضافة تفسير عن هيئة التعليم.
- source_word: πάντων
  choice: جميع الذين
  rationale: يحفظ شمول العبارة اليونانية ويأتي طبيعيًا مع تركيب «عيون جميع الذين في المجمع».
- source_word: οἱ ὀφθαλμοὶ
  choice: عيون
  rationale: الإبقاء على العيون فاعلًا يحفظ الصورة الحية في الأصل.
- source_word: ἀτενίζοντες
  choice: شاخصةً
  rationale: تنقل معنى التحديق المستمر باهتمام، من غير أن توحي بالعداء.
- source_word: συναγωγῇ
  choice: المجمع
  rationale: السياق يدل على المجمع اليهودي بوصفه مكان الاجتماع والقراءة.
theological_decisions:
- issue: الصورة التاريخية للفظ βιβλίον في عبادة المجمع
  choice: الدرج
  alternative: الكتاب
  rationale: هذا اختيار تاريخي وترجمي لا حسم عقائدي؛ فهو يحدد هيئة الوثيقة في هذا السياق مع التنبيه إلى سعة اللفظ اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «الدرج» للدقة التاريخية، و«المعاون» لتجنب فهم ὑπηρέτης على أنه عبد. وحُفظت الصورة اليونانية الحية في عبارة «كانت عيون... شاخصةً إليه».
