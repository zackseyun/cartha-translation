    issue: عدم اتساق الضمير مع التركيز التوزيعي
    rationale: النص اليوناني يقول حرفيًا «على كل واحد منهم ... كان يشفيه»؛ و«ويشفيهم» يمكن فهمها، لكنها تخفف الإفراد الذي تؤكده ἑνὶ ἑκάστῳ αὐτῶν.
  - severity: low
    issue: صياغة الأمراض غير طبيعية على النحو الأمثل
    rationale: «مرضى يعانون أمراضًا مختلفة» مفهومة، لكن «مرضى بأمراض مختلفة» تنقل νόσοις ποικίλαις مباشرة وبأسلوب عربي أيسر.
  - severity: low
    issue: دقة الوصف النحوي في الحاشية
    rationale: التركيب اليوناني هو تركيب مطلق في حالة المضاف إليه مع اسم فاعل مضارع؛ والأدق قول «اسم فاعل» لا «اسم فاعل» وحده إذا أريد الوصف الاصطلاحي للـparticiple، مع بيان حالة المضاف إليه.
