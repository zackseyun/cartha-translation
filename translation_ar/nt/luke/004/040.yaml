  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: ar
  text: ولمّا كانت الشمس تغرب[a]، أحضر إليه جميع الذين كان لديهم مرضى بأمراض مختلفة. وكان يضع يديه على كل واحد منهم ويشفيه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وفيما كانت الشمس تغرب». يستعمل النص اليوناني تركيبًا مطلقًا في حالة المضاف إليه مع اسم فاعل مضارع، فيدل على أن هذه الأحداث وقعت أثناء غروب الشمس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: ولمّا كانت الشمس تغرب
  rationale: ينقل التركيب الزمني بالمضاف المطلق مع اسم الفاعل المضارع معنى وقوع الأحداث في أثناء غروب الشمس، مع التعبير عن δέ بربط عربي طبيعي من غير إضافة ظرف بمعنى «الآن».
- source_word: ἅπαντες ὅσοι
  choice: جميع الذين
  rationale: يحفظ شمول التعبير اليوناني وتوكيده من غير إثقال الأسلوب.
- source_word: εἶχον ἀσθενοῦντας νόσοις ποικίλαις
  choice: كان لديهم مرضى يعانون أمراضًا مختلفة
  rationale: يفيد εἶχον وجود مرضى في رعايتهم أو ضمن أهلهم، ويحدد السياق أن ἀσθενοῦντας يعني المرض لا الضعف العام، بينما تنقل «مختلفة» تنوع الأمراض.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: أحضر إليه ...
  rationale: «أحضر» هو المقابل العربي الطبيعي لفعل الإتيان بالمرضى إلى يسوع في هذا السياق.
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: كل واحد منهم
  rationale: يحفظ التشديد التوزيعي على العناية بكل فرد على حدة.
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: يضع يديه على
  rationale: ينقل الفعل الجسدي الملموس بوضع اليدين من غير إقحام دلالة طقسية لاحقة.
- source_word: ἐθεράπευεν
  choice: ويشفيهم
  rationale: صيغة «كان يضع... ويشفي» تنقل القيمة الاستمرارية أو التكرارية للماضي الناقص، مع بقاء الشفاء واضحًا ومباشرًا.
theological_decisions:
- issue: دلالة وضع اليدين
  choice: كان يضع يديه على كل واحد منهم
  alternative: كان يضع يديه عليهم واحدًا واحدًا
  rationale: تحفظ الصياغة فعل يسوع الشخصي الملموس وعنايته الفردية، من غير أن تنسب إلى الفعل معنى أسراريًا أو كنسيًا لا يصرح به النص.
