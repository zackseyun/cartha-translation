  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: ar
  text: 'وقال له إبليس: «سأعطيك هذا السلطان كله ومجدها[a]، لأن هذا السلطان قد سُلِّم إليَّ، وأنا أعطيه لمن أشاء».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بهاءها». يمكن أن تدل الكلمة اليونانية في هذا السياق على المجد أو البهاء أو العظمة.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: إبليس
  rationale: اسم عربي راسخ للشخص الذي يجرّب يسوع في هذا السياق، وهو أوضح من نقل المعنى الاشتقاقي «المفتري».
- source_word: Σοὶ δώσω
  choice: سأعطيك
  rationale: صياغة عربية طبيعية تنقل الوعد، مع بقاء توجيه العطاء إلى المخاطَب واضحًا، وإن لم تُحاكِ تقديم الضمير اليوناني حرفيًا.
- source_word: ἐξουσίαν
  choice: السلطان
  rationale: يدل هنا على سلطة الحكم والتصرف، و«السلطان» يحفظ هذا المعنى دون اختزاله في القوة المجردة.
- source_word: ταύτην ἅπασαν
  choice: هذا السلطان كله
  rationale: ينقل اسم الإشارة والشمول معًا بتركيب عربي فصيح وطبيعي.
- source_word: δόξαν αὐτῶν
  choice: مجدها
  rationale: يحفظ المقابل الكتابي المعتاد لـδόξα، والضمير يعود إلى الممالك المذكورة في السياق السابق؛ ولغير العاقل الجمع يُستعمل ضمير المفرد المؤنث في العربية.
- source_word: παραδέδοται
  choice: قد سُلِّم إليَّ
  rationale: يحفظ المبني للمجهول ودلالة الفعل التام على تسليم سابق ما زال أثره قائمًا، من غير تقرير مشروعية ادعاء إبليس.
- source_word: ᾧ ἂν θέλω
  choice: لمن أشاء
  rationale: تعبير عربي موجز وطبيعي عن الشخص غير المحدد الذي تتعلق به إرادة المتكلم.
- source_word: δίδωμι αὐτήν
  choice: وأنا أعطيه
  rationale: المضارع ينقل الفعل العام أو المعتاد، والضمير المذكر في العربية يعود إلى «السلطان».
theological_decisions:
- issue: هل تصاغ العبارة بما يثبت ادعاء إبليس امتلاك سلطان الممالك؟
  choice: إبقاء الكلام ادعاءً مباشرًا على لسان إبليس بلا تعليق تحريري
  alternative: إضافة ألفاظ تباعدية مثل «يزعم أنه قد سُلِّم إليَّ»
  rationale: النص اليوناني يورد كلام إبليس مباشرة، ولا ينبغي للترجمة أن تصدّق ادعاءه أو تضعفه بإضافة غير موجودة؛ هوية المتكلم في السرد تكفي لحفظ التوتر اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «إبليس» و«السلطان» لرسوخهما في الاستعمال الكتابي العربي، مع تجنب التراكيب القديمة الثقيلة. وُضع مؤشر الحاشية بعد «مجدها» لأنه يشرح هذه الكلمة.
