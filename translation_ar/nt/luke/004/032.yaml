  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: ar
  text: وكانوا مندهشين من تعليمه، لأن كلامه كان بسلطان[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن كلامه كان ذا سلطان»، أو: «لأن ما قاله كان بسلطان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: كانوا مندهشين
  rationale: ينقل الفعل الناقص ردَّ فعل مستمرًّا أو متكررًا من الدهشة، بصياغة عربية واضحة وطبيعية.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: من تعليمه
  rationale: تفيد العبارة اليونانية أساس دهشتهم أو موضوعها؛ و«من تعليمه» تعبير عربي طبيعي يحفظ العلاقة السببية من غير توسع.
- source_word: διδαχῇ
  choice: تعليمه
  rationale: تشمل «التعليم» فعل التعليم ومضمونه، وتناسب سياق التعليم في المجمع.
- source_word: ὅτι
  choice: لأن
  rationale: تقدم سبب دهشتهم بوضوح، وهو المعنى السببي للعبارة هنا.
- source_word: ἐν ἐξουσίᾳ
  choice: بسلطان
  rationale: صياغة عربية موجزة تحفظ وصف كلام يسوع بأنه صادر بقوة وسلطة، من غير شرح مصدر هذا السلطان.
- source_word: ὁ λόγος αὐτοῦ
  choice: كلامه
  rationale: يشير λόγος هنا إلى كلام يسوع المنطوق؛ و«كلامه» أوضح في العربية المعاصرة من «كلمته» وأقرب إلى السياق.
theological_decisions:
- issue: طبيعة سلطان كلام يسوع
  choice: لأن كلامه كان بسلطان
  alternative: لأن كلامه كان ذا سلطان؛ أو لأن ما قاله كان بسلطان
  rationale: يثبت النص أن كلام يسوع اتصف بالسلطان، لكنه لا يشرح في هذه الآية مصدر ذلك السلطان أو أبعاده اللاهوتية؛ لذلك تُحفظ دلالة النص بلا إضافة عقائدية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «بسلطان» للمحافظة على تركيب النص المكثف، مع إيراد صيغ عربية بديلة في الحاشية.
