  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: ar
  text: رُوحُ الرَّبِّ عَلَيَّ، لِأَنَّهُ مَسَحَنِي لِأُبَشِّرَ الْفُقَرَاءَ. أَرْسَلَنِي لِأُنَادِيَ لِلْمَأْسُورِينَ بِالْحُرِّيَّةِ[a]، وَلِلْعُمْيِ بِاسْتِعَادَةِ الْبَصَرِ، وَأَنْ أُرْسِلَ الْمُنْسَحِقِينَ مُحَرَّرِينَ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني الكلمة اليونانية ἄφεσις أيضًا «المغفرة»؛ غير أن سياق المأسورين والمنسحقين يرجّح هنا معنى الحرية أو التحرير.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «الذين كُسِروا» أو «الذين حُطِّموا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου
  choice: رُوحُ الرَّبِّ
  rationale: تنقل الإضافة اليونانية بوصفها إضافة ملك أو مصدر، وتحافظ على الصدى الإشعيائي والصياغة الكتابية المألوفة.
- source_word: ἐπ’ ἐμέ
  choice: عَلَيَّ
  rationale: تقابل حرف الجر ἐπί هنا بوضوح، مع تقدير الخبر المحذوف في اليونانية كما تسمح به الجملة الاسمية العربية.
- source_word: οὗ εἵνεκεν
  choice: لِأَنَّهُ
  rationale: تؤدي المعنى السببي للتعبير اليوناني بلغة عربية طبيعية واضحة.
- source_word: ἔχρισέν με
  choice: مَسَحَنِي
  rationale: تحافظ على صورة المسح وعلى دلالتها المسيانية دون إضافة تفسير عقائدي.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: لِأُبَشِّرَ الْفُقَرَاءَ
  rationale: «أبشّر» تعبر طبيعيًا عن إعلان الخبر السار، و«الفقراء» لا تحصر المقصود في تفسير اجتماعي أو روحي وحده.
- source_word: ἀπέσταλκέν με
  choice: أَرْسَلَنِي
  rationale: تنقل فعل الإرسال والتكليف بوضوح؛ والسياق العربي يحمل أثر الإرسال المستمر من غير حاجة إلى تركيب زمني ثقيل.
- source_word: κηρύξαι
  choice: لِأُنَادِيَ
  rationale: تفيد الإعلان العلني بصوت المنادي، وهي أقرب إلى صورة κηρύσσω من لفظ قد يقتصر حديثًا على الوعظ الديني.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: لِلْمَأْسُورِينَ بِالْإِطْلَاقِ
  rationale: «الإطلاق» يلائم الأسر وسياق التحرير الإشعيائي، مع إبقاء احتمال «المغفرة» في الحاشية.
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: لِلْعُمْيِ بِاسْتِعَادَةِ الْبَصَرِ
  rationale: «استعادة البصر» تنقل دلالة ἀνάβλεψις على نيل البصر أو عودته بدقة أكبر من «البصر» وحدها.
- source_word: ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει
  choice: وَلِأُرْسِلَ الْمُنْسَحِقِينَ أَحْرَارًا
  rationale: تحافظ «أرسل» على الصلة بالفعل ἀποστέλλω، ويؤدي «أحرارًا» معنى ἐν ἀφέσει بعربية طبيعية، بينما تنقل «المنسحقين» صورة من كُسروا أو حُطّموا دون قصرها على نوع واحد من الاضطهاد.
theological_decisions:
- issue: دلالة ἄφεσις في الاقتباس الإشعيائي
  choice: الإطلاق/الحرية
  alternative: المغفرة
  rationale: اقتران اللفظة بالمأسورين والمنسحقين يرجح صورة التحرير، مع أن استعمالها اللوقاوي قد يدل أيضًا على مغفرة الخطايا. لذلك اختيرت لغة الإطلاق في المتن وأُثبت البديل في الحاشية حفظًا للتوتر الدلالي.
- issue: مدلول πτωχοῖς
  choice: الفقراء دون تقييد
  alternative: المساكين روحيًا أو المهمشون اجتماعيًا على وجه الحصر
  rationale: اللفظة تحتمل الفقر المادي والضعف الاجتماعي، وقد تكتسب أبعادًا أوسع في سياق لوقا؛ لذا لا يضيف النص وصفًا يحسم المقصود.
translation_notes:
  register: صياغة عربية فصحى حديثة ذات إيقاع كتابي وقور، مفهومة للقارئ العام. استُخدمت ألفاظ «مسحني»، و«أنادي»، و«الإطلاق»، و«المنسحقين» للمحافظة على صور الأصل وصلاته الإشعيائية، مع تجنب الحسم التفسيري الزائد.
