  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: ar
  text: 'فأجاب يسوع وقال له: «مكتوب: للرب إلهك تسجد[a]، وإياه وحده تعبد».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تعبد». والفعل اليوناني يعني حرفيًا السجود أو الانحناء أمام أحد، ويحمل هنا معنى العبادة.'
    reason: lexical_alternative
  - marker: b
    text: صدى لتثنية 6:13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: فأجابه يسوع
  rationale: صياغة عربية طبيعية تطوي تركيب اسم الفاعل مع الفعل في فعل واحد، وتحفظ معنى الرد وضمير المخاطَب.
- source_word: Γέγραπται
  choice: مكتوب
  rationale: صيغة الاقتباس الكتابي العربية المألوفة، وتحفظ دلالة النص المكتوب القائم.
- source_word: Κύριον τὸν θεόν σου
  choice: الرب إلهك
  rationale: نقل مباشر يحفظ لقب «الرب» وعلاقة الإضافة التي تعبّر عنها «إلهك».
- source_word: προσκυνήσεις
  choice: تسجد
  rationale: يحفظ الصورة الحركية المباشرة للفعل اليوناني، مع بيان دلالته التعبدية في الحاشية.
- source_word: λατρεύσεις
  choice: تعبد
  rationale: الفعل في هذا السياق يدل على خدمة دينية مقدمة لله؛ و«تعبد» أوضح للقارئ العربي من «تخدم» التي قد تُفهم بمعنى عام.
- source_word: αὐτῷ μόνῳ
  choice: إياه وحده
  rationale: يحفظ الحصر والتوكيد الواقعين على المفعول به، بصياغة عربية فصيحة وطبيعية.
theological_decisions:
- issue: ترجمة κύριος في اقتباس كتابي يشير إلى الله
  choice: الرب
  alternative: السيد
  rationale: النص اليوناني يستعمل κύριος، و«الرب» يحفظ ثقله الكتابي من غير إدخال صيغة الاسم الإلهي العبرية في متن العهد الجديد.
- issue: العلاقة بين السجود والعبادة في προσκυνήσεις وλατρεύσεις
  choice: «تسجد» للأول و«تعبد» للثاني
  alternative: «تعبد» للأول و«تخدم» للثاني
  rationale: 'هذا التفريق يحفظ التمايز اللفظي في اليونانية: الأول يصور الانحناء أو السجود في مقام التكريم، والثاني يدل على الخدمة الدينية؛ والسياق يجعل كليهما موجّهًا إلى الله وحده.'
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت جملة مقتضبة توافق إيقاع النص اليوناني، مع الحفاظ على الحصر في «إياه وحده» وعلى التمييز بين فعلي السجود والعبادة.
