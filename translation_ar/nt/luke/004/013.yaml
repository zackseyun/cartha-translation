  text: καὶ συντελέσας πάντα πειρασμὸν ὁ διάβολος ἀπέστη ἀπ’ αὐτοῦ ἄχρι καιροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/013.yaml
  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: ar
  text: وبعدما أتمَّ إبليس كلَّ تجربة[a]، انصرف عنه إلى وقتٍ مناسب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «اختبار». يمكن للكلمة اليونانية أن تعني «تجربة» أو «اختبار»، لكن دور إبليس في هذا السياق يجعل «تجربة» أنسب في المتن.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: بعدما أتمَّ
  rationale: اسم فاعل ماضٍ يدل على أن إتمام التجارب سبق ابتعاد إبليس؛ و«بعدما أتمَّ» تنقل العلاقة الزمنية بوضوح وعربية طبيعية.
- source_word: πάντα πειρασμόν
  choice: كلَّ تجربة
  rationale: تفيد العبارة مجموع التجارب أو كل تجربة ضمن السياق. و«تجربة» أنسب في المتن لأن الفاعل هو إبليس ولأن المشهد يتضمن إغراءً بالابتعاد عن الطاعة، مع حفظ معنى «الاختبار» في الحاشية.
- source_word: ὁ διάβολος
  choice: إبليس
  rationale: يشير السياق إلى الخصم الروحي الشخصي، و«إبليس» هو المقابل العربي المألوف والدقيق في هذا السياق.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: ابتعد عنه
  rationale: ينقل معنى الانصراف أو الابتعاد عن شخص، ويحافظ على دلالة الفعل من غير تكلف.
- source_word: ἄχρι καιροῦ
  choice: إلى وقتٍ مناسب
  rationale: يدل καιρός هنا على وقت ملائم أو مؤاتٍ، لا على مجرد مدة زمنية؛ وتوحي الصياغة بأن الابتعاد كان مؤقتًا وترقبًا لفرصة لاحقة.
theological_decisions:
- issue: دلالة πειρασμός في خبرة يسوع
  choice: تجربة
  alternative: اختبار
  rationale: يمكن أن تعني الكلمة اليونانية «تجربة» أو «اختبارًا». وبما أن إبليس هو القائم بالفعل وأن الأفعال المعروضة تهدف إلى صرف يسوع عن الطاعة، كانت «تجربة» أرجح في المتن، مع إبقاء البديل في الحاشية حفاظًا على الغموض الدلالي الحقيقي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «بعدما أتمَّ» لإظهار سبق الفعل، و«إلى وقت مناسب» لنقل دلالة الفرصة الملائمة الكامنة في καιρός.
