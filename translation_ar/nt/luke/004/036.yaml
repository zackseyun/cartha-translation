source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: ar
  text: 'فأخذت الدهشةُ الجميعَ، وكانوا يتحدثون بعضهم إلى بعض قائلين: «ما هذه الكلمة[a] التي بها يأمر الأرواح النجسة بسلطان وقوة، فتخرج؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ما هذا القول؟» فاللفظة اليونانية يمكن أن تعني «كلمة» أو «قولًا» أو «أمرًا».
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: الذهول
  rationale: يدل اللفظ على دهشة شديدة؛ و«الذهول» تعبير عربي فصيح ومفهوم يحفظ قوة الانفعال.
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: استولى ... على الجميع
  rationale: ينقل هذا التعبير العربي صورة حلول الدهشة بالجماعة، بدل تسطيح التركيب إلى مجرد وجود الدهشة.
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: أخذوا يتحدثون بعضهم مع بعض
  rationale: «أخذوا» مع المضارع تنقل معنى الاستمرار في صيغة الماضي الناقص، و«بعضهم مع بعض» تحفظ تبادل الحديث.
- source_word: Τίς ὁ λόγος οὗτος
  choice: ما هذه الكلمة
  rationale: تحفظ «الكلمة» اتساع λόγος وصلته المباشرة بقول يسوع الآمر، مع بيان احتمال «القول» في الحاشية.
- source_word: ὅτι
  choice: فإنه
  rationale: 'تقدم الفاء مع «إن» تفسيرًا طبيعيًا في العربية للسؤال التعجبي: ماهية هذه الكلمة تظهر في كونه يأمر بسلطان وقوة.'
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: بسلطان وقوة
  rationale: الباء تنقل الدلالة الوسيلية أو الكيفية لحرف الجر ἐν، مع حفظ ترتيب الاسمين في اليونانية.
- source_word: ἐξουσίᾳ
  choice: سلطان
  rationale: «سلطان» المقابل الكتابي العربي الواضح للحق أو الصلاحية في إصدار الأمر، وهو متميز عن القوة الفاعلة.
- source_word: δυνάμει
  choice: قوة
  rationale: تنقل القدرة الفاعلة بوضوح، وتحفظ تمييزها عن السلطان.
- source_word: ἐπιτάσσει
  choice: يأمر
  rationale: صياغة موجزة تحفظ معنى إصدار الأمر والزمن الحاضر الحي في كلام الجمع.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: الأرواح النجسة
  rationale: ترجمة مباشرة تحفظ مصطلح السرد الإنجيلي وخلفيته المتعلقة بالطهارة، من غير تحويله إلى وصف نفسي أو مجازي.
- source_word: ἐξέρχονται
  choice: تخرج
  rationale: الفعل العربي الطبيعي لخروج الأرواح من الأشخاص، ويحفظ صيغة الحاضر في التقرير.
theological_decisions:
- issue: وصف الكائنات الروحية في سياق إخراج الأرواح
  choice: الأرواح النجسة
  alternative: الأرواح الدنسة
  rationale: «النجسة» تحافظ على المصطلح اليوناني وخلفيته الدينية، وعلى الإطار الروحي الصريح للرواية، من غير إضافة تفسير مذهبي.
- issue: العلاقة بين السلطان والقوة
  choice: 'الإبقاء على الاسمين متميزين: «بسلطان وقوة»'
  alternative: بقوة عظيمة
  rationale: النص يجمع ἐξουσία وδύναμις، ولذلك لا ينبغي دمجهما؛ فالأول يشير إلى سلطان الأمر، والثاني إلى قدرته الفاعلة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدم «أخذوا يتحدثون» لإظهار استمرار الحوار، وحُفظ السؤال التعجبي والتوازي بين «سلطان» و«قوة».
