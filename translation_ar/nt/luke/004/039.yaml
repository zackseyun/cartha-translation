  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: ar
  text: ووقف فوقها، وانتهر الحُمّى، ففارقتها[أ]. وفي الحال نهضت وأخذت تخدمهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: أي إن الحُمّى هي التي فارقتها؛ وهي الفاعل المفهوم من السياق في الأصل اليوناني.
    reason: توضيح نحوي يحفظ طريقة عرض الأصل للحُمّى بوصفها الشيء الذي انتهره يسوع ثم غادر المرأة.
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: ووقف فوقها
  rationale: ينقل الوضع الجسدي الملموس ليسوع بالنسبة إلى المرأة، بصياغة عربية طبيعية من غير إضافة تفاصيل تفسيرية.
- source_word: ἐπετίμησεν
  choice: انتهر
  rationale: يحفظ قوة الفعل ونبرة السلطان في السياق، من غير أن يحدد ما إذا كان الخطاب يتضمن تشخيصًا بلاغيًا أو سببًا شيطانيًا.
- source_word: τῷ πυρετῷ
  choice: الحُمّى
  rationale: يبقي الحُمّى نفسها مفعولًا للانتهار كما في اليونانية، بدل تحويل العبارة إلى وصف عام للمرض.
- source_word: ἀφῆκεν αὐτήν
  choice: ففارقتها
  rationale: الفاعل المفهوم من السياق هو الحُمّى. واختيار «فارقتها» عربي واضح وموجز ويحفظ صورة زوال الحُمّى عنها.
- source_word: παραχρῆμα
  choice: وفي الحال
  rationale: ينقل تشديد لوقا على فورية الشفاء بصياغة عربية واضحة وطبيعية.
- source_word: ἀναστᾶσα
  choice: نهضت
  rationale: يعبر بوضوح عن قيامها فور شفائها، ويحافظ على تسلسل الأفعال.
- source_word: διηκόνει
  choice: أخذت تخدمهم
  rationale: ينقل صيغة الماضي الناقص بوصفها بداية خدمة مستمرة، ويتجنب الإيحاء الاصطلاحي الكنسي الذي قد تحمله بعض البدائل.
- source_word: αὐτοῖς
  choice: هم
  rationale: يعيد الضمير إلى الجماعة الحاضرة بصياغة عربية مباشرة وطبيعية.
theological_decisions:
- issue: هل يُصاغ انتهار الحُمّى بما يوحي بتشخيصها أو بسبب شيطاني؟
  choice: الإبقاء على العبارة المباشرة «انتهر الحُمّى»
  alternative: «أمر الحُمّى بصرامة» أو صياغة تفسر الحُمّى على أنها قوة شيطانية
  rationale: النص اليوناني يجعل الحُمّى موضوع الانتهار مباشرة، لكنه لا يشرح طبيعة ذلك. تحافظ الصياغة المختارة على سلطان يسوع وعلى التوتر الدلالي من غير استيراد تفسير عقدي إضافي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «الحُمّى» بالضبط لتيسير القراءة، وحُفظ الإيقاع السريع للأحداث مع إبقاء البناء اللاهوتي للنص بلا توسع تفسيري.
