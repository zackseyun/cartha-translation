lexical_decisions:
- source_word: εἶπεν δέ
  choice: ثم قال
  rationale: تؤدي «ثم» وظيفة δέ بوصفها رابطًا سرديًّا خفيفًا، من غير المبالغة في دلالة الاستدراك.
- source_word: Ἀμὴν
  choice: الحق
  rationale: تعبير عربي طبيعي رصين ينقل قوة ἀμήν بوصفها توكيدًا solemnًا في مطلع قول ليسوع، بدل الاكتفاء بالنقل الصوتي.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: يحافظ على صيغة الخطاب المباشر وترتيب العبارة اليونانية، وهو مألوف وواضح في العربية.
- source_word: οὐδεὶς προφήτης
  choice: ما من نبيٍّ
  rationale: صياغة عربية فصيحة وطبيعية تؤدي النفي الشامل من غير زيادة.
- source_word: δεκτός
  choice: مقبول
  rationale: ينقل معنى القبول والاستقبال باستحسان، مع إبقاء المجال الدلالي أوسع من مجرد الترحيب.
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: في موطنه
  rationale: «موطنه» تحافظ على سعة πατρίς، التي قد تدل على البلدة الأصلية أو المنطقة أو الوطن، بينما يوضح السياق أنها الناصرة.
