  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ τοῦ διαφυλάξαι σε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/010.yaml
  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: ar
  text: 'لِأَنَّهُ مَكْتُوبٌ: «سَيُوصِي مَلَائِكَتَهُ بِكَ[a] لِكَيْ يَحْفَظُوكَ[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بِشَأْنِكَ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يَحْمُوكَ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: مَكْتُوبٌ
  rationale: تعبير عربي مألوف عند الاستشهاد بالكتاب، وينقل دلالة الماضي التام المبني للمجهول بوصف المكتوب قائمًا ونافذًا.
- source_word: γὰρ
  choice: لِأَنَّهُ
  rationale: يحفظ القوة التفسيرية التي تربط الاستشهاد بما سبقه، ويجري طبيعيًّا في العربية.
- source_word: ὅτι
  choice: ':'
  rationale: تؤدي النقطتان وظيفة إدخال مضمون الاقتباس بعد «مكتوب» دون الحاجة إلى ترجمة ὅτι بلفظ مستقل.
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: مَلَائِكَتَهُ
  rationale: صياغة عربية طبيعية للمفعول غير المباشر مع فعل الوصية، وتحفظ ضمير الملكية.
- source_word: ἐντελεῖται
  choice: سَيُوصِي
  rationale: ينقل صيغة المستقبل ومعنى إصدار وصية أو تكليف، مع ملاءمة السياق الكتابي ودون إضافة مضمون غير موجود.
- source_word: περὶ σοῦ
  choice: بِكَ
  rationale: تعبير عربي موجز وطبيعي في تركيب «يوصي ملائكته بك»، ويؤدي معنى الاهتمام أو التكليف المتعلق بالمخاطَب، مع إثبات البديل الأقرب شكليًّا في الحاشية.
- source_word: τοῦ διαφυλάξαι σε
  choice: لِكَيْ يَحْفَظُوكَ
  rationale: ينقل المصدر المعرّف بوصفه غاية الوصية، ويترجم διαφυλάσσω بفعل واضح يحفظ دلالة الحراسة والصون.
theological_decisions:
- issue: صياغة اقتباس المزمور داخل كلام المجرِّب
  choice: ترجمة الألفاظ التي يوردها لوقا وحدها بصيغة اقتباس كتابي واضحة.
  alternative: إكمال الاقتباس بإضافة بقية عبارة المزمور أو مواءمته حرفيًّا مع نص المزمور الكامل.
  rationale: النص اليوناني هنا يورد جزءًا محددًا من الاقتباس؛ لذلك لا تُضاف إليه ألفاظ من سياقه في المزمور، حفاظًا على صياغة لوقا كما وصلت.
- issue: العلاقة بين περὶ σοῦ وτοῦ διαφυλάξαι σε
  choice: «بك لكي يحفظوك»، على أن تكون الحراسة غاية الوصية.
  alternative: «بشأنك، أي أن يحفظوك»، باعتبار المصدر شارحًا لمضمون الوصية.
  rationale: البنية اليونانية تسمح بتقارب الغاية والتفسير. الصياغة المختارة طبيعية وتحفظ اتجاه المعنى من الوصية إلى الحفظ من غير توسيع لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت الصيغة المألوفة «مكتوب» للاستشهاد، و«سيوصي ملائكته بك» لتجنب التراكيب الحرفية المتكلفة. وُضعت علامتا الحاشية في المتن عند اللفظين المعنيين.
