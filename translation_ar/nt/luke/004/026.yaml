review_pass:
  verdict: revise
  source_fidelity: يحافظ المسودّة على المبني للمجهول في «لم يُرسَل»، وعلى الاستثناء في εἰ μὴ، وعلى التكرار المقصود لحرف الاتجاه قبل الموضع ثم المرأة. لكن «التابعة لصيدا» تعبير إداري حديث لا يلائم الإضافة الجغرافية τῆς Σιδωνίας على نحوٍ طبيعي. والصيغة الكتابية العربية المألوفة للاسم الجغرافي هي «صَرْفَة صيدون».
