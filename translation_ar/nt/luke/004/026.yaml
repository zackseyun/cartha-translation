  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: ar
  text: ولم يُرسَل إيليا إلى واحدةٍ منهن، إلا إلى صَرْفَةَ صيدون[a]، إلى امرأةٍ أرملة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «ساربتا الصيدونية»؛ والمقصود صَرْفَة المعروفة في العهد القديم (1 ملوك 17:9).'
    reason: يوضح المقابل العربي التقليدي للاسم اليوناني ويربطه بموضع العهد القديم المشار إليه.
lexical_decisions:
- source_word: ἐπέμφθη
  choice: يُرسَل
  rationale: يحافظ المبني للمجهول على الفاعل الضمني من غير التصريح بأن الله هو المُرسِل، موافقًا لصياغة اليونانية.
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: إلى واحدةٍ منهن
  rationale: ينقل اتجاه الإرسال والنفي المؤكد، وضمير المؤنث الجمع يعود طبيعيًا إلى الأرامل المذكورات في السياق السابق.
- source_word: Ἠλίας
  choice: إيليا
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: εἰ μὴ
  choice: إلا
  rationale: أداة الاستثناء العربية الطبيعية في هذا التركيب.
- source_word: Σάρεπτα
  choice: صَرْفَة
  rationale: اسم الموضع المعروف في العهد القديم وراء الصيغة اليونانية Σάρεπτα، وهو أوضح للقارئ العربي.
- source_word: τῆς Σιδωνίας
  choice: التابعة لصيدا
  rationale: ينقل علاقة الإضافة الجغرافية بصياغة عربية واضحة، من غير حصرها بالضرورة داخل مدينة صيدا نفسها.
- source_word: γυναῖκα χήραν
  choice: امرأة أرملة
  rationale: يحافظ على عنصري العبارة اليونانية، «امرأة» و«أرملة»، مع تعبير عربي طبيعي ومفهوم.
theological_decisions:
- issue: هوية مُرسِل إيليا في الفعل المبني للمجهول
  choice: 'الإبقاء على المبني للمجهول: «يُرسَل إيليا»'
  alternative: 'التصريح بالفاعل: «أرسل الله إيليا»'
  rationale: السياق يفهم منه عمل الله، لكن النص اليوناني لا يسمّي الفاعل؛ لذلك تُصان حدود ما يصرّح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «التابعة لصيدا» لبيان النسبة الجغرافية في τῆς Σιδωνίας، وحُفظ ترتيب الاستثناء والتوجيه إلى الأرملة قدر الإمكان.
