  terminology: «إيليا» و«صَرْفَة» و«امرأة أرملة» مناسبة. يُستحسن «صيدون» بدل «صيدا» في هذا السياق الكتابي التاريخي، وإضافة حاشية مربوطة بـ«صَرْفَة» لتوثيق أن الترجمة العربية تستعمل المقابل التقليدي للاسم اليوناني Σάρεπτα وربطه بموضع العهد القديم.
