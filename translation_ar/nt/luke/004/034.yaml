source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: ar
  text: '«آه! ما لنا ولك[a]، يا يسوع الناصري[b]؟ أجئت لتهلكنا؟[c] أنا أعرف من أنت: قدوس الله[d].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «ما لنا ولك؟» وهو تعبير سامي يفيد الاعتراض وإظهار الانفصال أو الخصومة؛ ويمكن نقل معناه: «ما شأنك بنا؟»'
    reason: cultural_note
  - marker: b
    text: 'أو: «يا يسوع الذي من الناصرة».'
    reason: lexical_alternative
  - marker: c
    text: لم يحدد النص مرجع صيغة الجمع «نا»؛ فقد يتكلم الروح ممثلًا غيره من الأرواح الشريرة، أو قد يشير الجمع إلى نطاق أوسع مرتبط بحالة الرجل.
    reason: alternative_reading
  - marker: d
    text: 'العبارة لقب معناه: «القدوس المنسوب إلى الله» أو «قدوس الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: آه!
  rationale: صيحة مفاجئة تدل على الفزع أو الاعتراض. يحفظ هذا المقابل الإيجاز والانفعال من غير أن يضيف تفسيرًا مثل «دعنا وشأننا».
- source_word: τί ἡμῖν καὶ σοί
  choice: ما لنا ولك
  rationale: يحافظ على بنية التعبير السامي المستعمل للاعتراض وإظهار الانفصال أو الخصومة، وهو تعبير عربي مفهوم وفصيح.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: يا يسوع الناصري
  rationale: ينقل صيغة النداء والنسبة إلى الناصرة طبيعيًا؛ ويمكن من جهة الدلالة المكانية أن يُفهم أيضًا «يا يسوع الذي من الناصرة».
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: أجئت لتهلكنا؟
  rationale: صياغة عربية مباشرة تنقل سؤال المجيء وغايته، ويؤدي «تهلك» معنى الإبادة أو التدمير من غير توسع تفسيري.
- source_word: οἶδά σε τίς εἶ
  choice: أنا أعرف من أنت
  rationale: ينقل دعوى التعرّف بوضوح، مع إظهار الضمير للتوكيد الطبيعي في سياق المواجهة.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: قدوس الله
  rationale: صياغة موجزة وقريبة من تركيب الإضافة اليوناني، وتحفظ اللقب المسيحاني كما ورد من غير شرح عقائدي زائد.
theological_decisions:
- issue: مرجع ضمير الجمع ἡμᾶς في كلام الروح النجس
  choice: الإبقاء على «نا» في «تهلكنا» من غير تحديد مرجع الجمع
  alternative: قد يتكلم الروح ممثلًا عالم الأرواح الشريرة، أو مشيرًا إلى نفسه وإلى الممسوس
  rationale: النص اليوناني لا يحدد نطاق ضمير الجمع، ولذلك ينبغي إبقاء الغموض بدل حسمه تفسيريًا.
- issue: دلالة اللقب ὁ ἅγιος τοῦ θεοῦ
  choice: «قدوس الله» من غير توسع عقائدي
  alternative: «القدوس الذي لله» أو «قدوس الله» بوصفه لقبًا مسيحانيًا يؤكد التكريس والرسالة الإلهية
  rationale: يحمل اللقب دلالة مسيحانية مهمة، لكن الآية لا تفصل أبعادها؛ لذا يُحفظ كما هو دون إدخال صياغة عقائدية لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة. استُبقي التعبير السامي «ما لنا ولك» لأنه مألوف في العربية ومطابق لبنية الأصل، مع شرح دلالته في الحاشية. وُضعت جميع علامات الحواشي في مواضعها داخل المتن.
