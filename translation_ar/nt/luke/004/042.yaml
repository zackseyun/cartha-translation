review_pass:
  verdict: revise
  source_fidelity: 'النص الرئيس أمين للنص اليوناني: «ولمّا طلع النهار» ينقل الظرف الزمني، و«خرج ومضى» يحافظ على الفعلين، و«موضع مقفر» مناسب لـ εἰς ἔρημον τόπον. كما أن استمرار البحث ومحاولة منع يسوع من الرحيل ظاهران في الصياغة العربية. لكن بديل الحاشية «يستبقونه عندهم» لا يعبّر عن κατεῖχον، بل يوحي بالسباق أو التقدّم، ولذلك يلزم تصحيحه.'
  naturalness: العربية فصيحة وواضحة. استبدال «حتى وصلت إليه» بـ«ووصلت إليه» يتجنب الإيحاء بأن الوصول نتيجةٌ زمنية أو غايةٌ لما قبله، ويحافظ على عطف الأحداث المتتابعة في الأصل. وتظل معاملة «الجموع» بالمفرد المؤنث سليمة في العربية.
  terminology: «موضع مقفر» و«الجموع» مناسبان. «إبقاؤه عندها» ينقل المعنى السياقي، لكن «منعه من الرحيل» أصرح وأقرب إلى تركيب المنع في اليونانية. الحاشية (ب) ينبغي أن تقدم بدائل عربية صحيحة لمعنى الإمساك أو الاحتجاز أو المنع من المغادرة.
  issues:
