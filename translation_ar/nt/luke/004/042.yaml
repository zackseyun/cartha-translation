base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: ar
  text: ولمّا طلع النهار، خرج ومضى إلى موضع مقفر[a]. وكانت الجموع تبحث عنه، ووصلت إليه، وأخذت تحاول منعه من الرحيل عنها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إلى موضع منعزل» أو «إلى موضع في البرية». تصف اليونانية مكانًا خاليًا من السكان أو بعيدًا عن الناس.
    reason: lexical_alternative
  - marker: b
    text: أو «كانت تحتجزه» أو «كانت تحاول إبقاءه عندها». المعنى أن الجموع كانت تحاول منعه من المغادرة.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: ولمّا طلع النهار
  rationale: ينقل التركيب الزمني المستقل بمعنى حلول النهار، بصياغة عربية طبيعية واضحة.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: خرج ومضى
  rationale: يحافظ على تعاقب الفعلين من غير تكرار عربي ثقيل مثل «خرج وذهب».
- source_word: εἰς ἔρημον τόπον
  choice: إلى موضع مقفر
  rationale: «مقفر» يدل على موضع خالٍ أو منعزل، ولا يحصر المعنى في صحراء جغرافية.
- source_word: οἱ ὄχλοι
  choice: الجموع
  rationale: مقابل عربي فصيح وواضح للجماعات الكثيرة من الناس.
- source_word: ἐπεζήτουν αὐτόν
  choice: تبحث عنه
  rationale: المضارع بعد «كانت» ينقل استمرار الفعل الذي يدل عليه الماضي الناقص اليوناني.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: حتى وصلت إليه
  rationale: يعبّر بوضوح عن بلوغ الجموع المكان الذي كان فيه.
- source_word: κατεῖχον αὐτὸν
  choice: أخذت تحاول إبقاءه عندها
  rationale: ينقل معنى السعي إلى منعه من المغادرة واستمرار المحاولة، من غير افتراض إمساك جسدي صريح.
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: لئلّا يذهب عنها
  rationale: يبيّن غاية محاولتهم، وهي منعه من الابتعاد عنهم، مع الحفاظ على صورة «الذهاب عن» الواردة في الأصل.
