  text: and[a], ‘On their hands they will carry you[b], lest you strike your foot against a stone.’
translation:
  language: ar
  text: و«وأنهم على أيديهم يحملونك، لئلا تضرب قدمك بحجر».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف يواصل اقتباس الكتاب المقدس من الآية السابقة.
- source_word: ὅτι
  choice: لم يُترجم بلفظ مستقل
  rationale: يُدخل هنا مضمون الاقتباس، وقد أدّت علامتا الاقتباس هذه الوظيفة في العربية.
- source_word: Ἐπὶ χειρῶν
  choice: على أيديهم
  rationale: صياغة عربية واضحة تحافظ على صورة حمل الشخص فوق أيدي الملائكة.
- source_word: ἀροῦσίν σε
  choice: يحملونك
  rationale: الفعل يدل هنا على الرفع والحمل؛ و«يحملونك» تعبير حديث طبيعي يحفظ المعنى.
- source_word: μήποτε
  choice: لئلا
  rationale: تنقل بإيجاز معنى الغاية الوقائية أو النتيجة المنفية.
- source_word: προσκόψῃς
  choice: تصدم
  rationale: في سياق القدم والحجر، يدل الفعل على الارتطام أو الاصطدام، و«تصدم» واضحة ومباشرة.
- source_word: πρὸς λίθον
  choice: بحجر
  rationale: الباء هي الصياغة العربية الطبيعية للتعبير عن ملامسة القدم الحجر واصطدامها به.
- source_word: τὸν πόδα σου
  choice: قدمك
  rationale: حُفظ الإفراد الوارد في اليونانية.
theological_decisions:
- issue: صياغة اقتباس المزمور مع الحفاظ على صورة الحماية الملائكية
  choice: يحملونك
  alternative: يرفعونك
  rationale: لا يترتب على الاختيار فرق عقدي؛ و«يحملونك» أوضح في العربية المعاصرة ويحافظ على صورة الحماية في الاقتباس.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظ اتصال الآية بما قبلها بحرف العطف، وحُفظت صورة الأيدي والقدم والحجر دون توسع تفسيري.
