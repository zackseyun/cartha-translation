  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: ar
  text: ونزل إلى كفرناحوم، وهي مدينة في الجليل، وكان يعلّمهم في أيام السبت[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «في السبوت». والكلمة في اليونانية بصيغة الجمع، ويُرجَّح أنها تشير إلى مناسبات سبت متكررة؛ ويمكن التعبير عنها عربيًا: «كل سبت».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατῆλθεν
  choice: نزل
  rationale: يحفظ معنى الاتجاه إلى موضع أخفض الذي يفيده الفعل اليوناني، من غير إضافة منظور غير مذكور.
- source_word: Καφαρναοὺμ
  choice: كفرناحوم
  rationale: الصيغة العربية الشائعة لاسم المكان.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: وهي مدينة في الجليل
  rationale: ينقل كون كفرناحوم مدينة ضمن إقليم الجليل بصياغة عربية طبيعية، مع إبقاء الاسم نكرة كما في اليونانية.
- source_word: ἦν διδάσκων
  choice: كان يعلّم
  rationale: تركيب «كان» مع المضارع يحفظ دلالة الفعل المستمر أو المتكرر في الأصل.
- source_word: αὐτοὺς
  choice: هم
  rationale: يحافظ على الضمير من غير تعيين مرجع لم يصرّح به النص في هذه الآية.
- source_word: ἐν τοῖς σάββασιν
  choice: في أيام السبوت
  rationale: يحفظ صيغة الجمع في اليونانية ويرجّح دلالة التعليم في مناسبات سبت متكررة، مع صياغة عربية واضحة.
theological_decisions:
- issue: هل تُصاغ كلمة σάββασιν بصيغة الجمع أم تُسوّى إلى المفرد المألوف؟
  choice: في أيام السبوت
  alternative: في يوم السبت؛ كل سبت
  rationale: الجمع في الأصل قد يدل على مناسبات متكررة، وهو ينسجم مع صيغة التعليم المستمر؛ لذلك أُبقي من غير حصر الحدث في سبت واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت جملة «وهي مدينة في الجليل» لتفادي ثقل البدل الحرفي، وأُبقيت دلالة الاستمرار والتكرار في التعليم.
