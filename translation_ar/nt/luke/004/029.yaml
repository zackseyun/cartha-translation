  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: ar
  text: فقاموا وطردوه إلى خارج البلدة، واقتادوه إلى حافة الجبل الذي كانت بلدتهم مبنية عليه، لكي يلقوه من فوقه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «حتى يلقوه إلى أسفل». والفعل اليوناني يدل على إلقاء شخص من علو أو طرحه منحدرًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: فقاموا
  rationale: ينقل اسم الفاعل الأوريستي حركة الجماعة إلى الفعل بصورة طبيعية موجزة، من غير إضافة معنى يتجاوز النهوض.
- source_word: ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως
  choice: طردوه إلى خارج البلدة
  rationale: يعبر «طردوه» عن الإخراج القسري الملائم للسياق العدائي، و«البلدة» أنسب لحجم الناصرة في العربية المعاصرة من «المدينة».
- source_word: ἤγαγον αὐτόν
  choice: اقتادوه
  rationale: «اقتادوه» يحفظ معنى سوقه إلى الموضع في سياق قسري، من دون تشديد غير منصوص عليه مثل «جرّوه».
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: إلى حافة الجبل
  rationale: ὀφρύς تعني حرفيًا الحاجب، وتستعمل لطرف المرتفع أو حافته؛ و«حافة الجبل» واضحة وطبيعية في العربية.
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: الذي كانت بلدتهم مبنية عليه
  rationale: يحفظ المبني للمجهول ودلالة الماضي الأسبق في ᾠκοδόμητο، كما يحفظ αὐτῶν في «بلدتهم».
- source_word: ὥστε κατακρημνίσαι αὐτόν
  choice: لكي يطرحوه من فوقه
  rationale: يفيد ὥστε مع المصدر هنا الغاية المقصودة في السياق، والفعل يدل على الإلقاء من علو؛ والضمير «من فوقه» يربط الفعل بالجبل من غير إدخال لفظ «جرف» غير المذكور صراحة.
theological_decisions:
- issue: مقدار العنف المنقول في فعل الجماعة
  choice: إظهار القصد العدائي والقتل المتوقع من تسلسل الأفعال، من غير التصريح بعبارة مثل «حاولوا قتله».
  alternative: استعمال ألفاظ أشد مثل «جرّوه ليقتلوه بإلقائه من الجرف»، أو ألفاظ أخف مثل «أخرجوه».
  rationale: النص يصور بوضوح قصد إلقائه من مرتفع، لكن ينبغي أن يظهر ذلك من الأفعال نفسها دون إضافة تفسير للنية في المتن.
- issue: دلالة ὥστε مع المصدر
  choice: 'ترجمتها غائية: «لكي».'
  alternative: 'ترجمتها نتيجية: «حتى يطرحوه».'
  rationale: السياق يجعل الإلقاء المقصود غاية اقتيادهم إياه، مع بقاء الصياغة اليونانية قابلة من حيث البنية للتعبير عن النتيجة المقصودة؛ لذلك نُبّه إلى البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «البلدة» مراعاةً لطبيعة الناصرة، و«حافة الجبل» بدل التعبير الحرفي غير الطبيعي «حاجب الجبل». وُضع مؤشر الحاشية بعد عبارة الإلقاء التي يشرحها.
