reference: Luke 4:41
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: ar
  text: 'وكانت شياطين تخرج أيضًا من كثيرين، وهي تصرخ وتقول: «أنت ابن الله!» فكان ينتهرها ولا يسمح لها أن تتكلم، لأنها كانت تعرف أنه المسيح[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «خريستوس» (Χριστός)، أي «الممسوح».'
    reason: توضيح دلالة اللقب اليوناني الذي يُترجم في المتن بـ«المسيح».
lexical_decisions:
- source_word: δαιμόνια
  choice: شياطين
  rationale: ينقل الاسم اليوناني الدال مباشرة على الشياطين، من غير استبداله بتعبير «أرواح نجسة» غير الوارد هنا.
- source_word: ἐξήρχετο
  choice: كانت تخرج
  rationale: صيغة الماضي الناقص تدل على فعل جارٍ أو متكرر في سياق السرد، ويؤديها التركيب العربي «كانت تخرج» بوضوح.
- source_word: ἀπὸ πολλῶν
  choice: من أناس كثيرين
  rationale: اليونانية تحذف الموصوف وتقول حرفيًا «من كثيرين»؛ أُظهر المرجع البشري في العربية لأن ذلك أوضح وأطبع، من غير تغيير للمعنى.
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: وهي تصرخ وتقول
  rationale: يحفظ اقتران الصراخ بالقول وشدة النداء، بصياغة عربية طبيعية.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ابن الله
  rationale: يحفظ اللقب المسياني بصيغته المعروفة من غير شرح أو اختزال.
- source_word: ἐπιτιμῶν
  choice: ينتهرها
  rationale: يفيد التوبيخ أو الأمر الحازم، ويلائم سلطان يسوع في السياق.
- source_word: οὐκ εἴα
  choice: لا يسمح لها
  rationale: مع «كان» يؤدي استمرار المنع أو تكرره الذي تفيده صيغة الماضي الناقص.
- source_word: ᾔδεισαν
  choice: كانت تعرف
  rationale: يُنقل الفعل الدال على المعرفة المستقرة بصيغة ماضية طبيعية، مع مراعاة المطابقة العربية لجمع غير العاقل.
- source_word: τὸν χριστὸν αὐτὸν εἶναι
  choice: أنه هو المسيح
  rationale: يحفظ تركيب التوكيد في αὐτόν ولقب Χριστός بوصفه «المسيح»، لا اسمًا شخصيًا.
theological_decisions:
- issue: دلالة Χριστός في تعريف الشياطين لهوية يسوع
  choice: المسيح
  alternative: الممسوح
  rationale: اللفظ هنا لقب يدل على الملك الممسوح المنتظر. «المسيح» هو المقابل العربي الراسخ، وتوضح الحاشية أصل معنى اللقب من غير تحويله إلى اسم مجرد.
- issue: العلاقة بين لقبي «ابن الله» و«المسيح»
  choice: الإبقاء على اللقبين متميزين كما في اليونانية
  alternative: دمجهما في عبارة تفسيرية واحدة
  rationale: تنقل الترجمة قول الشياطين «أنت ابن الله»، ثم تعليل الراوي بأنها عرفت أنه المسيح، فلا تسوّي بين العبارتين تفسيرًا ولا تفصل بينهما لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أناس كثيرين» لإظهار المرجع البشري المحذوف في اليونانية على نحو طبيعي، وروعي في الضمائر والأفعال حكم جمع غير العاقل في العربية.
