  text: to proclaim the favorable year of the Lord[a][b].
translation:
  language: ar
  text: لأُعلن سنةَ رضا الرب[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأُعلن سنة الرب المقبولة».'
    reason: بديل معجمي يحافظ بصورة أقرب على كون δεκτόν صفةً لـ«سنة».
  - marker: b
    text: تردد العبارة صدى إشعياء 61:2، وقد تستدعي معاني سنة اليوبيل.
    reason: إشارة إلى الخلفية الكتابية من غير إدخال «اليوبيل» في المتن.
lexical_decisions:
- source_word: κηρύξαι
  choice: لأُعلن
  rationale: يحافظ «أُعلن» على معنى النداء العلني الذي يحمله الفعل κηρύσσω، كما أن صيغة الغرض تواصل تسلسل المصدر في السياق السابق، من غير حصر المعنى في الوعظ.
- source_word: ἐνιαυτὸν
  choice: سنةَ
  rationale: المعنى المعتاد للكلمة هو «سنة»، وإبقاؤها يصون صدى إشعياء 61:2 ولا يعممها إلى «زمن» أو «فترة».
- source_word: κυρίου
  choice: الرب
  rationale: «الرب» هو المقابل الطبيعي لـ κύριος، وتفيد الإضافة هنا أن السنة متصفة برضا الرب أو مرتبطة به.
- source_word: δεκτόν
  choice: رضا
  rationale: ينقل تركيب «سنة رضا الرب» معنى السنة المقبولة أو المؤاتية من جهة الرب بلغة عربية طبيعية، مع تجنب الإيحاء بأن المقصود مجرد قبول بشري.
theological_decisions:
- issue: الإشارة إلى إشعياء 61:2 وما قد تستدعيه من معنى اليوبيل
  choice: الإبقاء على «سنة» و«رضا الرب» من غير إدخال لفظ «اليوبيل» في المتن
  alternative: لأُعلن يوبيل الرب
  rationale: النص اليوناني يردد إشعياء 61:2 وقد يستدعي موضوعات اليوبيل، لكنه لا يذكر اليوبيل صراحة؛ لذلك لا ينبغي تحويل الإيحاء إلى تصريح تفسيري.
- issue: دلالة δεκτόν
  choice: سنة رضا الرب
  alternative: سنة الرب المقبولة
  rationale: العبارتان ممكنتان؛ المختار أوضح في العربية المعاصرة ويبرز معنى الرضا الإلهي، بينما تُحفظ الصياغة الأقرب شكليًا في الحاشية.
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: «الرب» يلائم سياق الاقتباس الإشعيائي ولا يضيّق الدلالة إلى معنى السيد البشري.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «أُعلن» بدل «أكرز» لتجنب قصر الفعل على الوعظ الكنسي، واستُعمل «سنة رضا الرب» بوصفه تركيبًا عربيًا طبيعيًا يحفظ الصدى الإشعيائي.
