base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: ar
  text: 'ثم قاده إلى أورشليم، وأوقفه على ذروة الهيكل[a]، وقال له: «إن كنتَ ابن الله[b]، فألقِ بنفسك من هنا إلى أسفل».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «على جناح الهيكل» أو «على طرفٍ مرتفع من الهيكل». تشير الكلمة اليونانية إلى طرف بارز أو موضع مرتفع من مجمّع الهيكل، لا إلى المقْدس الداخلي وحده.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن يُفهم الشرط أيضًا: «بما أنك ابن الله». أُبقيت صيغة «إن كنت» للمحافظة على نبرة تحدي المجرِّب.'
    reason: alternative_reading
lexical_decisions:
- source_word: ⸂Ἤγαγεν δὲ⸃
  choice: ثم قاده
  rationale: تفيد δέ هنا تتابع أحداث السرد، ويعبّر «ثم» عنه طبيعيًا، أما ἤγαγεν فتدل على القيادة أو الإحضار؛ و«قاده» موجزة وتحافظ على فاعلية المجرِّب في نقل يسوع.
- source_word: εἰς Ἰερουσαλήμ
  choice: إلى أورشليم
  rationale: ترجمة مباشرة لحرف الاتجاه واسم المدينة بصيغته العربية الكتابية الشائعة.
- source_word: ἔστησεν
  choice: أوقفه
  rationale: الصيغة هنا سببية بمعنى جعله يقف أو وضعه قائمًا؛ و«أوقفه» عربية طبيعية ودقيقة في السياق.
- source_word: ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ
  choice: على شُرْفة الهيكل
  rationale: يدل πτερύγιον حرفيًا على جناح صغير، ويشير معماريًا إلى طرف بارز أو موضع مرتفع؛ وتنقل «شُرْفة» صورة البروز بوضوح. أما ἱερόν فيشير إلى مجمّع الهيكل، لا إلى المقدس الداخلي وحده.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: إن كنتَ ابن الله
  rationale: تحافظ «إن كنت» على صيغة الشرط وعلى نبرة التحدي، من غير أن تحسمها إلى معنى «بما أنك». و«ابن الله» تنقل التركيب اللقبي بوضوح.
- source_word: βάλε σεαυτὸν
  choice: فألقِ بنفسك
  rationale: الأمر من βάλλω يدل هنا على الإلقاء أو الطرح؛ و«ألقِ بنفسك» فصيحة واضحة وغير متكلفة.
- source_word: ἐντεῦθεν κάτω
  choice: من هنا إلى أسفل
  rationale: ينقل التعبير موضع الانطلاق والاتجاه الهابط معًا بوضوح في العربية.
theological_decisions:
- issue: صياغة تحدي المجرِّب لهوية يسوع
  choice: إن كنتَ ابن الله
  alternative: بما أنك ابن الله
  rationale: يمكن للشرط اليوناني مع صيغة الخبر أن يُفهم أحيانًا بمعنى قريب من «بما أنك»، لكن صيغة الشرط هنا تحفظ التوتر البلاغي ونبرة الاختبار، من غير أن توحي بأن الراوي نفسه يشك في هوية يسوع.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «شُرْفة» بدل اللفظ الحرفي الغامض «جناح»، مع إثبات البدائل في الحاشية، وحُفظت صيغة الشرط اللاهوتية دون حسم زائد.
