  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: ar
  text: 'وكان الجميع يتحدثون عنه بخير[a] ويتعجّبون من كلمات النعمة[b] الخارجة من فمه، وكانوا يقولون: «أليس هذا ابن يوسف؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان الجميع يشهدون له». يمكن للتعبير اليوناني أن يعني الشهادة له أو التحدث عنه بخير؛ والسياق، مع تعجّبهم من كلامه، يرجّح معنى الإشادة به.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كلمات النعمة» بمعنى كلمات تتصف بالنعمة أو اللطف أو القبول؛ ويمكن ترجمتها أيضًا: «الكلمات الرقيقة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: يشهدون له
  rationale: يحفظ هذا التعبير الدلالة المباشرة للفعل والضمير في اليونانية، مع إبقاء احتمال الشهادة المؤيدة أو التحدث عنه بإعجاب؛ ويبيّن السياق، ولا سيما اقترانه بالتعجب، أن الاستجابة إيجابية.
- source_word: ἐθαύμαζον
  choice: يتعجّبون
  rationale: ينقل معنى الدهشة المستمرة الذي يوحي به زمن الماضي الناقص، وهو تعبير عربي واضح لا يحصر رد الفعل في الصدمة.
- source_word: ἐπὶ τοῖς λόγοις τῆς χάριτος
  choice: من كلمات النعمة
  rationale: تؤدي «من» معنى سبب التعجب، وتحفظ «كلمات النعمة» الإضافة اليونانية واحتمال أن تكون الكلمات متصفة بالنعمة أو حاملة لها، بدل حسمها في معنى واحد.
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: الخارجة من فمه
  rationale: يحفظ الصورة الحسية في الأصل، ويربط العبارة بالكلمات ربطًا طبيعيًا وموجزًا في العربية.
- source_word: Οὐχὶ
  choice: أليس هذا
  rationale: ينقل السؤال الإنكاري الذي يتوقع جوابًا بالإيجاب، بصياغة عربية فصيحة وطبيعية.
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: هذا ابن يوسف
  rationale: صياغة عربية مباشرة وأمينة لإدراك أهل المجمع لهويته، من غير إضافة تفسير عقدي إلى كلامهم.
theological_decisions:
- issue: وصف يسوع بأنه ابن يوسف في ضوء الحبل العذراوي
  choice: 'إبقاء قول الحاضرين مباشرًا: «أليس هذا ابن يوسف؟»'
  alternative: إضافة قيد مثل «كما كانوا يظنون» أو تفسير يوضح علاقة يوسف بيسوع
  rationale: النص يسجل تصور الحاضرين ولا يقدم هنا تصحيحًا من الراوي؛ لذلك تُحفظ المفارقة اللاهوتية والسردية من غير حلها بإضافة تفسير غير موجود في الآية.
- issue: دلالة τῆς χάριτος
  choice: «كلمات النعمة» مع شرح الاحتمال في الحاشية
  alternative: «الكلمات المملوءة لطفًا» أو «الكلمات الرقيقة»
  rationale: الإضافة اليونانية تحتمل كلمات تتصف بالنعمة أو اللطف أو القبول؛ والصياغة المختارة تحافظ على السعة الدلالية ولا تختزل χάρις في الجاذبية البلاغية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الماضي الناقص «كان... يشهدون» مع العطف بالفعل المضارع لاستحضار رد الفعل المستمر، وحُفظت العبارة الملموسة «الخارجة من فمه». وُضعت علامتا الحاشية في المتن عند العبارتين اللتين تحتملان أكثر من وجه.
