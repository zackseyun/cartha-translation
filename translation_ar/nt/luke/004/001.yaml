- source_word: ἤγετο
  choice: كان يُقاد
  rationale: يحافظ على صيغة المبني للمجهول وعلى الدلالة الاستمرارية للفعل الناقص في الزمن الماضي.
- source_word: ἐν τῷ πνεύματι
  choice: بالروح
  rationale: تفيد الباء هنا الوساطة أو الفاعلية، فتوضح أن الروح هو الذي يقود يسوع، مع إبقاء البديل الحرفي «في الروح» في الحاشية.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: «البرية» تعبر عن المنطقة المقفرة من غير حصر الصورة في صحراء رملية، وهي طبيعية في السياق الكتابي العربي.
- source_word: δὲ
  choice: و
  rationale: الواو تؤدي الانتقال السردي الخفيف بصورة طبيعية من السياق السابق.
theological_decisions:
- issue: مرجع «الروح» في ἐν τῷ πνεύματι
  choice: الروح القدس
  alternative: حالة يسوع الروحية الداخلية
  rationale: ذكر «الروح القدس» في العبارة السابقة مباشرةً، مع إبراز لوقا عمل الروح بوصفه فاعلًا، يجعل عود الضمير إلى الروح القدس هو القراءة الأرجح، من غير إضافة تقرير عقائدي يتجاوز النص.
