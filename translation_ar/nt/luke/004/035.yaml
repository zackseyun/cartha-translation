  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: ar
  text: 'فانتهره يسوع قائلًا: «اخرس[a] واخرج منه!» فطرحه الشيطان في الوسط، ثم خرج منه دون أن يصيبه بأذى.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «كُنْ مُلجَمًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: انتهره
  rationale: ينقل الفعل معنى الزجر السلطوي الشديد، والضمير مفهوم من السياق العربي على أنه عائد إلى الشيطان.
- source_word: Φιμώθητι
  choice: اخرس
  rationale: الفعل يعني حرفيًا وضع الكمامة على الفم، ويُستعمل هنا أمرًا حادًا بالكف عن الكلام؛ «اخرس» طبيعي وقوي في هذا السياق.
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: اخرج منه
  rationale: ترجمة مباشرة وواضحة لصيغة الأمر ولتركيب الخروج من الشخص.
- source_word: ῥίψαν αὐτὸν
  choice: فطرحه
  rationale: يحفظ الفعل الدال على الرمي أو الطرح، ويصوغ علاقة اسم الفاعل الماضي بالفعل الرئيس صياغة عربية طبيعية من دون إضافة معنى السقوط غير المصرح به.
- source_word: εἰς τὸ μέσον
  choice: في الوسط
  rationale: ينقل العبارة كما هي من دون إضافة «بينهم»، مع بقاء الجماعة مفهومة من السياق.
- source_word: τὸ δαιμόνιον
  choice: الشيطان
  rationale: «الشيطان» مقابل عربي مألوف لـ δαιμόνιον بوصفه كائنًا روحيًا شريرًا؛ والسياق يميزه من الإنسان الذي خرج منه.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: من غير أن يؤذيه بشيء
  rationale: يحفظ نفي أي أذى وقع على الرجل، بصياغة عربية واضحة وطبيعية.
theological_decisions:
- issue: طبيعة δαιμόνιον والمشهد المروي
  choice: تصوير الشيطان ككائن روحي شرير يخاطبه يسوع ويأمره بالخروج
  alternative: تجريد العبارة إلى قوة شريرة أو علة نفسية
  rationale: النص اليوناني نفسه يعرض مخاطبة مباشرة وخروجًا من الرجل؛ لذلك لا ينبغي للترجمة أن تزيل هذا التصوير أو تعيد تفسيره.
- issue: حدة الأمر Φιμώθητι
  choice: «اخرس» مع إيراد الصورة الحرفية في الحاشية
  alternative: «اصمت» أو «كن ساكتًا» بلا حاشية
  rationale: يحفظ الاختيار حدة الأمر في السياق، بينما تمنع الحاشية ضياع صورة الإلجام الكامنة في اللفظ اليوناني.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة، بجمل متدفقة وأوامر مباشرة. استُخدم «الشيطان» بالمعنى العام للكائن الشيطاني، لا بوصفه بالضرورة اسمًا علمًا لإبليس.
