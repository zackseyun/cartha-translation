    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: فَدُفِعَ إليه
  rationale: ينقل صيغة المبني للمجهول ومعنى إعطاء الدرج له في سياق القراءة بالمجمع، بعبارة عربية طبيعية.
- source_word: βιβλίον
  choice: دَرْج
  rationale: مع أن اللفظة قد تدل عمومًا على كتاب أو وثيقة، فإن سياق المجمع في القرن الأول، مع فعل ἀναπτύξας، يرجّح الدرج الملفوف.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: النبي إشعياء
  rationale: يحفظ الإضافة التي تعرّف الدرج بأنه للنبي إشعياء، مع إبقاء لقبه النبوي.
- source_word: ἀναπτύξας
  choice: لما فتح الدَّرْج
  rationale: يعبّر عن فعل سابق للفعل الرئيس ويلائم التعامل مع الدرج؛ واختير «فتح» لأنه عربي طبيعي، مع وضوح طبيعة الشيء من لفظ «الدرج».
- source_word: εὗρεν
  choice: وجد
  rationale: مقابل مباشر وطبيعي للفعل، من غير إيحاء بصعوبة البحث.
- source_word: τόπον
  choice: الموضع
  rationale: يحفظ الدلالة المكانية الحرفية داخل النص، بدل تفسيرها ابتداءً بأنها «الفقرة».
- source_word: οὗ ἦν γεγραμμένον
  choice: الذي كُتب فيه
  rationale: صياغة عربية واضحة تقدم الاقتباس التالي وتحافظ على معنى كون الكتابة قائمة في ذلك الموضع.
