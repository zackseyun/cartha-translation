  rationale: «كلمة الله» تعبير عربي واضح ومألوف يحفظ الدلالة المباشرة لـ λόγος والإضافة في τοῦ θεοῦ، من غير تحويلها تفسيريا إلى «الرسالة الآتية من الله».
theological_decisions:
- issue: هل تُترجم παραβολή بلفظ «المثل» أم يُصرَّح بأنها «معنى المثل»؟
  choice: المثل
  alternative: معنى المثل
  rationale: السياق يدل على أن يسوع يشرح المثل، لكن النص اليوناني يقول حرفيا «هذا هو المثل». لذلك تُحفظ صياغته والتوتر القائم بين اللفظ والسياق، ويُذكر البديل التفسيري في الحاشية.
