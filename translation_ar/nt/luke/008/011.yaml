  rationale: تحافظ الصياغة على فعل الكينونة وعلى لفظ «المثل» من غير إضافة تفسيرية مثل «معنى»، وتؤدي δὲ بواو انتقالية طبيعية في العربية.
- source_word: ὁ σπόρος
  choice: الزرع
  rationale: «الزرع» اسم جمعي طبيعي في العربية يلائم صورة البذار ويحافظ على المفرد الجمعي في اليونانية.
- source_word: ὁ λόγος τοῦ θεοῦ
