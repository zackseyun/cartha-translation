  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: ar
  text: 'وبينما كان لا يزال يتكلّم، جاء شخص من عند رئيس المجمع[a] يقول: «ابنتك قد ماتت؛ فلا تُتعِب المعلّم بعد الآن[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المشرف على المجمع».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فلا تُزعِج المعلّم بعد الآن».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: وبينما كان لا يزال يتكلّم
  rationale: ينقل تركيب المضاف المطلق الدال على تزامن الحدثين، ويحفظ دلالة ἔτι على الاستمرار بعبارة عربية طبيعية.
- source_word: ἔρχεταί τις
  choice: جاء شخص
  rationale: صيغ المضارع التاريخي في السرد اليوناني تُنقل طبيعيًا بالماضي في العربية، وτις يدل على شخص غير معيّن.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: من عند رئيس المجمع
  rationale: παρά مع المجرور تدل هنا على المصدر أو الجهة التي جاء منها الرسول، وἀρχισυνάγωγος لقب للمسؤول المتقدّم في المجمع.
- source_word: λέγων
  choice: يقول
  rationale: يحفظ الصلة الحالية التي يؤديها اسم الفاعل اليوناني ويمهّد مباشرة لمضمون الرسالة.
- source_word: Τέθνηκεν
  choice: قد ماتت
  rationale: تؤدي «قد» مع الماضي معنى اكتمال الحدث، بما يلائم صيغة التام اليونانية ونتيجتها القائمة.
- source_word: ἡ θυγάτηρ σου
  choice: ابنتك
  rationale: ترجمة مباشرة وموجزة للاسم مع ضمير الملكية.
- source_word: μηκέτι
  choice: بعد الآن
  rationale: تبيّن أن المطلوب هو الكف عن الفعل من هذه اللحظة فصاعدًا.
- source_word: σκύλλε
  choice: فلا تُتعِب
  rationale: ينقل معنى التسبب في العناء أو المشقة، ويحافظ على نبرة الرسالة الجادة المهذبة.
- source_word: τὸν διδάσκαλον
  choice: المعلّم
  rationale: هو المعنى المباشر المعتاد لـδιδάσκαλος، من غير رفع اللقب إلى دلالة غير مصرّح بها في العبارة.
theological_decisions:
- issue: دلالة لقب ἀρχισυνάγωγος المتصل بيايرس
  choice: رئيس المجمع
  alternative: المشرف على المجمع
  rationale: اللفظ لقب وظيفي مؤسسي، و«رئيس المجمع» واضح ومألوف في العربية الكتابية المعاصرة من غير إقحام رتبة كنسية لاحقة.
- issue: ترجمة διδάσκαλος
  choice: المعلّم
  alternative: السيّد
  rationale: يحفظ المعنى المعجمي الصريح للقب في هذا الموضع، ولا يضيف تشديدًا لاهوتيًا لا يصرّح به النص، مع بقائه منسجمًا مع السياق المسيحاني الأوسع.
- issue: قوة صيغة Τέθνηκεν التامة
  choice: قد ماتت
  alternative: ماتت؛ هي ميتة
  rationale: «قد ماتت» تعبّر طبيعيًا عن وقوع الموت واكتماله، من دون تحويل الصيغة إلى تقرير لاهوتي أو تفسير زائد عن حالة الابنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «المجمع» للدلالة على موضع الاجتماع اليهودي، و«المعلّم» للقب العادي في النص. حُفظ تسلسل الجملة السردي، مع علامات ترقيم عربية تسهّل القراءة.
