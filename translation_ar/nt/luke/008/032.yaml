id: LUK.8.32
reference: Luke 8:32
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: ar
  text: وكان هناك قطيع كبير من الخنازير يرعى على الجبل[a]. فتوسّلوا إليه أن يأذن لهم بالدخول في تلك الخنازير[b]، فأذن لهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على سفح الجبل».'
    reason: lexical_alternative
  - marker: b
    text: فاعل «توسّلوا» هو الشياطين أو الأرواح النجسة المذكورة في السياق السابق.
    reason: referent_clarification
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: قطيع كبير من الخنازير
  rationale: ينقل «قطيع» معنى ἀγέλη الطبيعي، ويفيد «كبير» كثرة عدد الخنازير التي تدل عليها ἱκανῶν في هذا السياق.
- source_word: βοσκομένη
  choice: يرعى
  rationale: فعل عربي طبيعي لنشاط القطيع في طلب الطعام، مع إبقاء صيغة المفرد لمراعاة «قطيع».
- source_word: ἐν τῷ ὄρει
  choice: على الجبل
  rationale: ترجمة قريبة وواضحة للعبارة اليونانية، من غير تحويلها تفسيرياً إلى «السفح».
- source_word: παρεκάλεσαν
  choice: توسّلوا إليه
  rationale: يعكس شدة الطلب في السياق أكثر من «طلبوا» وحدها.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: يأذن / أذن
  rationale: يحافظ تكرار الجذر العربي على المقابلة اللفظية بين الطلب والاستجابة في الأصل.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: بالدخول في تلك الخنازير
  rationale: يحفظ معنى الدخول واسم الإشارة البعيد ἐκείνους، مع تعبير عربي واضح.
- source_word: δὲ / καὶ
  choice: وكان / فتوسّلوا / فأذن
  rationale: صيغ ربط سردية عربية طبيعية تنقل تطور الخبر والعطف من غير إضافة ظرف زمني صريح غير موجود في الأصل.
theological_decisions:
- issue: مرجع واو الجماعة في «فتوسّلوا»
  choice: إبقاء الفاعل مستتراً كما في النص اليوناني، ويُفهم من السياق السابق أنه الشياطين أو الأرواح النجسة.
  alternative: 'التصريح: «فتوسّلت إليه الشياطين».'
  rationale: الفعل اليوناني جمع بلا اسم فاعل صريح في هذه الآية؛ إبقاء الضمير يحفظ صياغة المصدر واعتمادها على السياق، من غير إزالة هذا الإضمار.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «الخنازير» بدل لفظ أقدم أو أقل تداولاً، وأُبقي مرجع الفاعل الجمع ضمنياً وفق الأصل، مع إيضاحه في الحاشية.
