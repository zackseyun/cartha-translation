source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: ar
  text: 'وقال يسوع: «مَن الذي لمسني؟» وبينما كان الجميع ينكرون ذلك، قال بطرس: «يا سيّد، الجموع تحاصرك وتضغط عليك[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الجموع تكتنفك وتزحمك».'
    reason: بديل معجمي يحفظ إمكان فهم الفعلين بمعنى الإحاطة الشديدة والتزاحم الضاغط.
lexical_decisions:
- source_word: ἁψάμενός
  choice: لمسني
  rationale: يدل الفعل هنا على التلامس الجسدي، و«لمسني» هو التعبير العربي الطبيعي الملائم لسياق لمس المرأة ليسوع.
- source_word: ἀρνουμένων δὲ πάντων
  choice: وبينما كان الجميع ينكرون ذلك
  rationale: يحفظ هذا التعبير دلالة اسم الفاعل المضارع على الاستمرار، ويعود «ذلك» طبيعيًا إلى الفعل الذي سأل يسوع عمّن قام به.
- source_word: Ἐπιστάτα
  choice: يا سيّد
  rationale: صيغة خطاب لوقاوية تعبّر عن الاحترام والإقرار بالسلطة؛ و«يا سيّد» تؤدي هذا المعنى من غير أن تستعمل اللقب الإلهي «الرب» أو تحصر المعنى في التعليم.
- source_word: ὄχλοι
  choice: الجموع
  rationale: تحافظ على صيغة الجمع في اليونانية وعلى صورة كثرة الناس المحيطين بيسوع.
- source_word: συνέχουσίν
  choice: تحاصرك
  rationale: ينقل معنى إحاطة الجموع بيسوع وتضييقها عليه، لا مجرد وجودها حوله.
- source_word: ἀποθλίβουσιν
  choice: تضغط عليك
  rationale: يعبر عن الضغط الناتج من تزاحم الجموع، مع إبقاء تمييزه عن فعل الإحاطة السابق من غير مبالغة كلفظ «تسحقك».
theological_decisions:
- issue: ترجمة صيغة الخطاب Ἐπιστάτα الموجهة إلى يسوع
  choice: يا سيّد
  alternative: يا معلّم؛ يا رب
  rationale: الأصل لا يستعمل κύριος («الرب»)، ولذلك تجنبت الترجمة إدخال لقب مسيحاني أقوى مما يصرح به النص. وفي الوقت نفسه، «يا سيّد» أنسب من «يا معلّم» للدلالة على السلطة والاحترام، لأن اللفظة ليست διδάσκαλος.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. صيغ السؤال والحوار طبيعية، مع الحفاظ على استمرار إنكار الجميع وعلى جمع «الجموع». وُضعت علامة الحاشية عند العبارة التي تشرح بديلها المعجمي.
