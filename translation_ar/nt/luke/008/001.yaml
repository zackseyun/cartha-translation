source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: ar
  text: وبعد ذلك بقليل، كان يجوب مدينةً بعد مدينة وقريةً بعد قرية[a]، يكرز ويبشّر بملكوت الله[b]، وكان الاثنا عشر معه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من مدينة إلى مدينة ومن قرية إلى قرية».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حُكم الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: وبعد ذلك بوقت قصير
  rationale: صياغة زمنية عربية طبيعية تنقل تعاقب الأحداث المقصود في التعبير اللوقاوي، من غير استعمال تركيب حرفي ثقيل مثل «وحدث في ما بعد».
- source_word: αὐτὸς
  choice: أخذ يسير
  rationale: يُفهم الضمير في تصريف الفعل العربي، ولا يقتضي السياق إبرازًا من قبيل «هو نفسه».
- source_word: διώδευεν
  choice: أخذ يسير
  rationale: تنقل الصيغة الناقصة معنى الحركة المستمرة والمتكررة بين الأماكن، وتنسجم طبيعيًا مع التعبير التوزيعي التالي.
- source_word: κατὰ πόλιν καὶ κώμην
  choice: من مدينة إلى مدينة ومن قرية إلى قرية
  rationale: ينقل هذا التعبير القوة التوزيعية لحرف κατά مع الاسمين المفردين، أي الانتقال المتكرر بين المدن والقرى.
- source_word: κηρύσσων
  choice: يكرز
  rationale: لفظ عربي كتابي معروف يدل على الإعلان العلني، ويحافظ على تميزه عن εὐαγγελιζόμενος.
- source_word: εὐαγγελιζόμενος
  choice: ويبشّر
  rationale: ينقل معنى إعلان الخبر السار، مع إبقاء فعل مستقل إلى جانب «يكرز» كما في اليونانية.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: بملكوت الله
  rationale: «ملكوت الله» تعبير عربي راسخ وواسع الدلالة، يحتمل معنى سلطان الله ومجال حكمه من غير حصره في أحدهما.
- source_word: οἱ δώδεκα
  choice: الاثنا عشر
  rationale: يحافظ على تسمية الجماعة كما وردت، من غير إضافة «تلاميذ» أو «رسل» غير المذكورتين هنا.
- source_word: σὺν αὐτῷ
  choice: وكان الاثنا عشر معه
  rationale: صياغة عربية مكتملة وطبيعية تنقل معنى المصاحبة.
theological_decisions:
- issue: ترجمة βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  alternative: حُكم الله
  rationale: «ملكوت الله» يحفظ الاتساع الدلالي بين المُلك بوصفه سلطانًا وبين نطاق ذلك السلطان، بينما قد تقصر «حكم الله» العبارة على الجانب الدينامي وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية رصينة. استُعمل «يكرز ويبشّر» للمحافظة على الفعلين اليونانيين المتجاورين، و«الاثنا عشر» بوصفها تسمية معروفة للجماعة من غير إضافة تفسيرية.
