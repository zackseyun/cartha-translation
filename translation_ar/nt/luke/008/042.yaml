  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: ar
  text: لأن له ابنة وحيدة[a]، عمرها نحو اثنتي عشرة سنة، وكانت تحتضر. وبينما كان ذاهبًا، كانت الجموع تضغط عليه بشدة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ابنة واحدة لا غير».'
    reason: lexical_alternative
  - marker: b
    text: قد يوحي الفعل اليوناني بأن الجموع كانت تضغط عليه ضغطًا شديدًا حتى تكاد تخنقه أو تسحقه.
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: وحيدة
  rationale: مع «ابنة» تدل الكلمة على أنها ابنته الوحيدة، لا على معنى يركّز على الولادة؛ وهذه الصياغة طبيعية وواضحة في العربية.
- source_word: ὡς ἐτῶν δώδεκα
  choice: عمرها نحو اثنتي عشرة سنة
  rationale: تفيد ὡς مع العدد التقريب، وتوضح كلمة «عمرها» المقصود في العربية دون تغيير المعنى.
- source_word: ἀπέθνῃσκεν
  choice: كانت تحتضر
  rationale: صيغة الماضي الناقص تصوّر حالة مستمرة واقترابًا من الموت، و«كانت تحتضر» تؤدي ذلك بإيجاز طبيعي.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: وبينما كان ذاهبًا
  rationale: التركيب بالمصدر المعرّف مع ἐν يفيد تزامن الفعلين؛ ولا يصرّح النص هنا بالوجهة، لذلك لم تُضف.
- source_word: οἱ ὄχλοι
  choice: الجموع
  rationale: تحافظ «الجموع» على صيغة الجمع في الأصل، مع أسلوب عربي فصيح مفهوم.
- source_word: συνέπνιγον
  choice: كانت الجموع تزحمه بشدة
  rationale: يفيد الفعل ضغط الجموع المحكم حوله، حتى يحمل إيحاء الخنق أو السحق؛ و«تزحمه بشدة» تنقل المشهد من غير مبالغة.
- source_word: ὅτι
  choice: لأن
  rationale: تبيّن الأداة سبب إلحاح يايرس الوارد في السياق السابق.
- source_word: αὐτῷ
  choice: له
  rationale: الداتيف مع فعل الكينونة يفيد الملكية، و«له ابنة» تركيب عربي طبيعي يحافظ على بنية موجزة.
