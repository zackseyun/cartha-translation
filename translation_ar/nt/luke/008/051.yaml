base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: ar
  text: ولمّا جاء إلى البيت، لم يسمح لأحد أن يدخل معه إلا بطرس ويوحنا ويعقوب ووالد الصبيّة ووالدتها.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν δὲ εἰς τὴν οἰκίαν
  choice: ولمّا جاء إلى البيت
  rationale: تنقل «لمّا» الدلالة الزمنية لاسم الفاعل اليوناني، وتؤدي الواو وظيفة δὲ في مواصلة السرد، و«البيت» هو المقابل المباشر والطبيعي لـ οἰκία.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν
  choice: لم يسمح ... أن يدخل
  rationale: الفعل ἀφίημι هنا بمعنى السماح، والمصدر εἰσελθεῖν يبيّن الفعل المسموح به؛ والصياغة العربية واضحة وطبيعية.
- source_word: τινα σὺν αὐτῷ
  choice: لأحد أن يدخل معه
  rationale: في سياق النفي تفيد τινα العموم، ولذلك تُترجم «أحد»، ويرتبط «معه» بفعل الدخول على نحو طبيعي.
- source_word: εἰ μὴ
  choice: إلا
  rationale: تأتي بعد النفي للاستثناء، لا للشرط.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: بطرس ويوحنا ويعقوب
  rationale: أُبقي عطف الأسماء المتتابع كما في اليونانية، مع استعمال صيغ الأسماء العربية المألوفة.
- source_word: τῆς παιδὸς
  choice: الصبيّة
  rationale: يمكن أن تدل παῖς على طفل أو طفلة، لكن أداة التعريف المؤنثة والسياق يحددان أن المقصود فتاة؛ و«الصبيّة» تحافظ كذلك على معنى صغر السن.
- source_word: τὸν πατέρα ... καὶ τὴν μητέρα
  choice: أبا الصبيّة ... وأمّها
  rationale: تحافظ الصياغة على ذكر الأب والأم كلٍّ على حدة، ويعود الضمير في «أمّها» بوضوح إلى الصبيّة.
theological_decisions:
- issue: تحديد جنس παῖς ودلالة اللفظة العمرية
  choice: أبا الصبيّة وأمّها
  alternative: أبا الطفلة وأمّها
  rationale: ليست المسألة خلافًا عقائديًا؛ فالصيغة المؤنثة والسياق يثبتان أن الحديث عن ابنة يايرس، بينما تبقى «الطفلة» صياغة عربية صحيحة وأعم من حيث المرحلة العمرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُعملت «لم يسمح» بدل تعبير أشد حرفية، مع الحفاظ على ترتيب الاستثناء وأسماء الداخلين.
