review_pass:
  verdict: revise
  source_fidelity: 'النص ينقل بدقة البنية الأساسية لليونانية: الوصول إلى البيت، منع أي شخص من الدخول مع يسوع، والاستثناء الذي يضم بطرس ويوحنا ويعقوب ووالدي الفتاة. لكن الحاشية تُرجع تحديد كون الطفل فتاة جزئيًا إلى «صيغة» اللفظة اليونانية، وهذا غير دقيق؛ فـ παῖς لفظة مشتركة الجنس، وحالة الجر في τῆς παιδὸς لا تثبت وحدها جنس الطفل. السياق هو الذي يحدد أنها فتاة.'
  naturalness: الصياغة فصيحة وسلسة. واستبدال «أبا الصبيّة» بـ«والد الصبيّة» أوضح في العربية الفصحى الحديثة وأقل تكلّفًا، مع بقاء المعنى نفسه.
  terminology: الأسماء المستعملة مألوفة، و«الصبيّة» مناسبة في السياق. ينبغي فقط تصحيح تعليل الحاشية كي لا يوحي بأن الصيغة النحوية اليونانية تحدد الجنس هنا.
  issues:
  - severity: medium
    issue: الحاشية تقول إن «صيغتها هنا والسياق» يبيّنان أن المقصود فتاة.
    rationale: اللفظة اليونانية παῖς مشتركة الجنس، والصيغة τῆς παιδὸς (المضاف إليه) لا تعيّن جنس المرجع. تحديد أنها فتاة مستفاد من سياق الرواية، لا من هذه الصيغة وحدها.
  - severity: low
    issue: «أبا الصبيّة» صحيحة إعرابيًا، لكنها أقل سلاسة في الفصحى الحديثة من «والد الصبيّة».
    rationale: «والد الصبيّة ووالدتها» يحافظ على ذكر كل من الأب والأم بوضوح ويخدم سجل الترجمة المستهدف.
  revised_text: ولمّا جاء إلى البيت، لم يسمح لأحد أن يدخل معه إلا بطرس ويوحنا ويعقوب ووالد الصبيّة ووالدتها.
