base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: ar
  text: 'فقال: «قد أُعطي لكم أن تعرفوا أسرار ملكوت الله[a]، وأما الباقون فبالأمثال، لكي ينظروا ولا يبصروا، ويسمعوا ولا يفهموا[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خفايا ملكوت الله». المقصود حقائق إلهية كانت محجوبة وكُشف عنها، لا أمورًا غامضة يستحيل فهمها.
    reason: lexical_alternative
  - marker: b
    text: 'تردّد هذه العبارة صدى إشعياء 6: 9–10، ويمكن أن تفيد الغاية الإلهية أو النتيجة القضائية أو كليهما.'
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: قد أُعطي
  rationale: يحفظ صيغة التام المبني للمجهول، فيدل على عطية سابقة باقية الأثر، ويترك المُعطي مفهومًا من السياق كما في اليونانية.
- source_word: γνῶναι
  choice: أن تعرفوا
  rationale: ترجمة مباشرة تميّز المعرفة هنا من الفهم الذي يعبّر عنه συνιῶσιν في ختام الآية.
- source_word: μυστήρια
  choice: أسرار
  rationale: «أسرار» لفظ عربي طبيعي يدل هنا على حقائق إلهية كانت محجوبة ثم كُشف عنها، لا على ألغاز يتعذر فهمها.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير كتابي عربي مألوف يحفظ إمكان دلالة اللفظ على سلطان الله وملكه معًا.
- source_word: τοῖς δὲ λοιποῖς
  choice: وأما الباقون
  rationale: ينقل معنى «الذين بقوا/سائر الناس» دون استيراد عبارة «الذين هم خارج» من النص الموازي في مرقس.
- source_word: ἐν παραβολαῖς
  choice: فبالأمثال
  rationale: يحافظ على إيجاز العبارة اليونانية الناقصة الفعل، ويعبّر طبيعيًا عن وسيلة التعليم أو صورته.
- source_word: ἵνα
  choice: لكي
  rationale: يبقي قوة الغاية أو النتيجة القضائية مفتوحة، ولا يخفف التوتر الموجود في النص.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: ينظروا ولا يبصروا
  rationale: يحفظ التقابل والتكرار الاشتقاقي قدر الإمكان بالعربية، مع إيصال الفرق بين فعل النظر وحصول الإدراك البصري.
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: يسمعوا ولا يفهموا
  rationale: صياغة عربية واضحة تميّز السماع من الفهم المقصود بالفعل συνίημι.
theological_decisions:
- issue: 'دلالة ἵνα في صدى إشعياء 6: 9–10'
  choice: «لكي» مع إبقاء العبارة على حدّتها
  alternative: «حتى تكون النتيجة» أو «لأنهم»
  rationale: «لكي» تحفظ احتمال الغاية الإلهية والنتيجة القضائية، أو اجتماعهما، بدل حسم التوتر اللاهوتي في اتجاه واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «ملكوت الله» للمألوفية الكتابية، وحُفظ إيجاز العبارة اليونانية «وأما الباقون فبالأمثال» من غير إضافة تفسيرية واسعة.
