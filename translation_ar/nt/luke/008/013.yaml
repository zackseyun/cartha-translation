source:
  edition: SBLGNT
  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: ar
  text: وأمّا الذين على الصخرة فهم الذين حين يسمعون يقبلون الكلمة بفرح، ولكن لا جذر لهم. يؤمنون إلى حين، وفي وقت الاختبار[a] يرتدّون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وقت التجربة» أو «وقت البلاء». قد يدل اللفظ اليوناني على الاختبار أو المحنة أو الإغراء، بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: على الصخرة
  rationale: صياغة قريبة من العبارة اليونانية تحفظ صورة الصخرة المفردة في المثل من غير توسيعها إلى «الأرض الصخرية».
- source_word: ὅταν ἀκούσωσιν
  choice: حين يسمعون
  rationale: تؤدي معنى الشرط الزمني العام في اليونانية بعبارة عربية طبيعية واضحة.
- source_word: μετὰ χαρᾶς
  choice: بفرح
  rationale: تنقل العبارة الجارّة بإيجاز وتحفظ الانفعال الإيجابي عند تلقّي الكلمة.
- source_word: δέχονται τὸν λόγον
  choice: يقبلون الكلمة
  rationale: «يقبلون» مقابل مباشر وطبيعي للفعل، و«الكلمة» تحفظ التعبير الكتابي مع دلالته هنا على الرسالة المعلنة.
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: لا أصل لهم
  rationale: تحفظ استعارة الجذر المفرد، و«أصل» هو المقابل العربي الطبيعي في وصف رسوخ النبات أو الإنسان.
- source_word: πρὸς καιρόν
  choice: إلى حين
  rationale: تعبّر عن مدة محدودة بصياغة عربية موجزة وكريمة.
- source_word: πιστεύουσιν
  choice: يؤمنون
  rationale: المقابل المباشر للفعل، من غير إضافة حكم على حقيقة هذا الإيمان أو طبيعته الخلاصية.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: في وقت الاختبار
  rationale: «الاختبار» يحفظ سعة المصطلح اليوناني، الذي قد يدل على الاختبار أو البلاء أو التجربة، وتُذكر البدائل في الحاشية.
- source_word: ἀφίστανται
  choice: يرتدّون
  rationale: ينقل معنى الابتعاد والتخلّي بعد الإيمان في هذا السياق، ويحفظ خطورة الفعل من غير شرح مذهبي لطبيعة الارتداد.
theological_decisions:
- issue: هل يدل πιστεύουσιν على إيمان خلاصي حقيقي أم على تصديق سطحي؟
  choice: يؤمنون
  alternative: يبدون مؤمنين؛ أو يؤمنون إيمانًا سطحيًا
  rationale: النص يصرّح بأنهم يؤمنون إلى حين ثم يرتدّون، لكنه لا يحسم بذاته الجدل اللاهوتي اللاحق بشأن طبيعة هذا الإيمان أو المثابرة؛ لذلك تُحفظ صياغته وتوتره من غير إضافة.
- issue: مدلول πειρασμός في السياق
  choice: الاختبار
  alternative: التجربة؛ البلاء
  rationale: قد يشمل اللفظ اليوناني امتحانًا خارجيًا أو تجربة تدفع إلى السقوط. «الاختبار» أوسع في المتن، مع إثبات البدائل في الحاشية.
- issue: الدلالة اللاهوتية للفعل ἀφίστανται
  choice: يرتدّون
  alternative: يبتعدون؛ يتخلّون
  rationale: يحفظ هذا الاختيار قوة الفعل واتجاهه بعيدًا عن الإيمان السابق، من غير تقرير ما إذا كان ذلك يثبت فقدان خلاص حقيقي أو يكشف غياب الإيمان الراسخ منذ البداية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدمت «وأمّا... فهم» لتوضيح بنية التعريف في المثل، وحُفظت استعارات الصخرة والأصل والكلمة، مع تجنّب المصطلحات التفسيرية التي تحسم الخلاف اللاهوتي.
