  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: ar
  text: 'وكان الرجل الذي خرجت منه الشياطين يتوسّل إليه أن يكون معه، لكنه صرفه قائلًا:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: كان يتوسّل
  rationale: صيغة الماضي الناقص تدل على التماس مستمر أو متكرر بإلحاح، و«كان يتوسّل» تنقل هذه القوة بلغة عربية طبيعية.
- source_word: ὁ ἀνὴρ
  choice: الرجل
  rationale: تشير الكلمة هنا إلى الرجل المذكور سابقًا، وهذه هي المقابلة العربية المباشرة والطبيعية.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: الذي خرجت منه الشياطين
  rationale: تنقل العبارة خروج الشياطين السابق على توسّل الرجل، ويُفهم هذا الترتيب الزمني طبيعيًا من السياق العربي.
- source_word: τὰ δαιμόνια
  choice: الشياطين
  rationale: مقابل مباشر يحفظ تصوير النص لكائنات شيطانية شخصية، من غير تلطيف إلى تعبير أعم مثل «الأرواح الشريرة».
- source_word: εἶναι σὺν αὐτῷ
  choice: أن يبقى معه
  rationale: في هذا السياق تعبّر «يبقى معه» طبيعيًا عن رغبة الرجل في ملازمته، مع الحفاظ على معنى الوجود معه.
- source_word: ἀπέλυσεν αὐτὸν
  choice: صرفه
  rationale: يفيد الفعل هنا أن يسوع لم يقبل طلب الرجل ووجّهه إلى الانصراف؛ و«صرفه» موجزة وطبيعية ولا توحي بإطلاقه من قيد.
- source_word: λέγων
  choice: قائلًا
  rationale: ينقل اسم الفاعل اليوناني الذي يمهّد للكلام المباشر في الآية التالية.
theological_decisions:
- issue: دلالة τὰ δαιμόνια في سياق إخراج الشياطين
  choice: الشياطين
  alternative: الأرواح الشريرة
  rationale: يحفظ هذا الاختيار العرض الصريح في النص لكائنات شيطانية خرجت من الرجل، من غير تحويلها إلى فئة أعم أو تفسيرها تفسيرًا مخففًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. أُبقيت الجملة مفتوحة بنقطتين لأنها تمهّد مباشرةً لقول يسوع في الآية التالية. استُعملت الواو لنقل δέ بوصفها رابطًا سرديًا، من غير إضافة ظرف زمني مثل «والآن» لا وجود له في الأصل.
