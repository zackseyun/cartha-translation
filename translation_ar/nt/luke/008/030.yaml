id: LUK.8.30
reference: Luke 8:30
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: ar
  text: 'فَسَأَلَهُ يَسُوعُ: «مَا اسْمُكَ؟» فَقَالَ: «لَجْيُون»[a]، لِأَنَّ شَيَاطِينَ كَثِيرَةً كَانَتْ قَدْ دَخَلَتْ فِيهِ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «لَجْيُون» لفظ لاتيني الأصل يشير إلى فيلق كبير في الجيش الروماني؛ وهو هنا يدل على كثرة الشياطين في الرجل.
    reason: cultural_note
  - marker: b
    text: 'أو: «لأن شياطين كثيرة دخلت فيه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: سَأَلَ
  rationale: الفعل هنا يقدّم سؤالًا مباشرًا في سياق سردي، و«سأل» هو المقابل العربي الطبيعي والدقيق.
- source_word: δὲ
  choice: فَـ
  rationale: تفيد الفاء تتابع السرد وانتقاله انتقالًا خفيفًا، من غير مبالغة في إبراز أداة الربط.
- source_word: Τί σοι ὄνομά ἐστιν
  choice: مَا اسْمُكَ؟
  rationale: هذه هي الصياغة العربية المألوفة التي تنقل معنى التعبير اليوناني بوضوح من غير حرفية متكلّفة.
- source_word: Λεγιών
  choice: لَجْيُون
  rationale: نُقلت التسمية صوتيًا لأنها الجواب الذي اتخذه المتكلم اسمًا، مع شرح أصلها العسكري اللاتيني في الحاشية.
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تقدّم الأداة سبب التسمية «لَجْيُون»، ولذلك تنقل «لأن» العلاقة السببية بوضوح.
- source_word: εἰσῆλθεν
  choice: كَانَتْ قَدْ دَخَلَتْ
  rationale: يبين هذا التركيب أن دخول الشياطين سبق الجواب والتعليل، مع إبقاء معنى الدخول الذي يحمله الفعل اليوناني.
- source_word: δαιμόνια πολλὰ
  choice: شَيَاطِينَ كَثِيرَةً
  rationale: ينقل التعبير بوضوح كثرة الكائنات الروحية الشريرة المشار إليها في النص، من غير تلطيف للمعنى.
- source_word: εἰς αὐτόν
  choice: فِيهِ
  rationale: «دخل فيه» هو التعبير العربي الطبيعي عن الحركة إلى داخل الشخص في هذا السياق، ويحفظ دلالة الدخول.
theological_decisions:
- issue: دلالة δαιμόνια في سياق دخولها في الرجل
  choice: شياطين
  alternative: أرواح شريرة
  rationale: «شياطين» أقرب إلى اللفظ اليوناني المباشر، وتحفظ عرض النص لهذه الكائنات بوصفها متعددة وشخصية وشريرة.
- issue: العلاقة الزمنية بين دخول الشياطين والجواب «لَجْيُون»
  choice: كانت قد دخلت
  alternative: دخلت
  rationale: الصياغة المختارة توضّح أن الدخول سابق للتسمية، من غير إضافة حكم عقائدي؛ وتبقى الصياغة الأبسط ممكنة لأن الفعل اليوناني ماضٍ بسيط من حيث الصيغة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة، تحافظ على سرعة السرد وبساطة الحوار. وُضعت علامة الحاشية الثقافية بعد «لَجْيُون» مباشرة، وعلامة البديل الزمني بعد العبارة التي تتعلق بها.
