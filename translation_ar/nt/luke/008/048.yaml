  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: ar
  text: 'فقال لها: «يا ابنتي، إيمانك قد خلَّصكِ[a]. اذهبي بسلام».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إيمانك قد شفاكِ» أو «إيمانك قد عافاكِ». يمكن أن يدل الفعل اليوناني على الشفاء كما يدل على الخلاص.'
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: يا ابنتي
  rationale: نُقلت صيغة النداء الحرفية لما فيها من حنان وقرب، من غير استبدالها بتعبير تفسيري مثل «يا عزيزتي».
- source_word: πίστις
  choice: إيمانك
  rationale: يحفظ المصطلح اللاهوتي ودلالة الثقة المؤمنة بيسوع في هذا السياق.
- source_word: σέσωκέν
  choice: قد خلَّصكِ
  rationale: يحفظ الاتساع الدلالي للفعل، الذي قد يشير إلى الخلاص والشفاء معًا، كما أن «قد» تلائم دلالة صيغة التام اليونانية على نتيجة قائمة.
- source_word: πορεύου
  choice: اذهبي
  rationale: أمر طبيعي واضح يطابق المخاطبة المؤنثة.
- source_word: εἰς εἰρήνην
  choice: بسلام
  rationale: تعبير عربي طبيعي عن الانصراف في حال من السلام وتحت بركته، بدل النقل الحرفي المتكلف «إلى سلام».
- source_word: δὲ
  choice: فـ
  rationale: الفاء هنا أيسر في العربية للسرد والانتقال إلى جواب يسوع، ولا تبالغ في دلالة التضاد التي قد يوحي بها «لكن».
theological_decisions:
- issue: مدى دلالة σῴζω في سياق الشفاء
  choice: «قد خلَّصكِ» في المتن
  alternative: «قد شفاكِ» أو «قد عافاكِ»
  rationale: السياق يتضمن شفاءً جسديًا واضحًا، لكن الفعل اليوناني أوسع من الشفاء وحده وقد يحمل صدى الخلاص أيضًا؛ لذلك حُفظ الاتساع في المتن، مع بيان المعنى السياقي الأضيق في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل التأنيث في «خلَّصكِ» و«اذهبي» لمطابقة المخاطَبة، وحُفظ النداء الحميم «يا ابنتي».
