source:
  edition: SBLGNT
  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: ar
  text: فاقتربت من خلفه، ولمست هدب ثوبه[a]، فتوقّف نزف دمها في الحال.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حاشية ثوبه» أو «شرّابة ثوبه».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: فدنت من خلفه
  rationale: ينقل اسم الفاعل الماضي حركة الاقتراب السابقة للفعل الرئيس، ويعبّر «من خلفه» بوضوح عن الموضع الذي أتت منه.
- source_word: ἥψατο
  choice: لمست
  rationale: المعنى المعتاد للفعل في هذا السياق هو اللمس، من غير دلالة لازمة على الإمساك.
- source_word: τοῦ κρασπέδου
  choice: هدب
  rationale: «هدب» لفظ عربي طبيعي يمكن أن يدل على طرف الثوب أو ما يتدلّى من حاشيته، من غير حسم ما إذا كان المقصود الحاشية عامة أم الشرّابة خاصة.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ثوبه
  rationale: «الثوب» تعبير عام واضح يحافظ على عموم ἱμάτιον ولا يحدده عباءة أو رداءً على نحو غير لازم.
- source_word: παραχρῆμα
  choice: في الحال
  rationale: ينقل الأثر الزمني الفوري بعبارة عربية واضحة وطبيعية.
- source_word: ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: توقّف نزف دمها
  rationale: صياغة عربية مباشرة تحافظ على صورة توقف سيلان الدم، مع وضوح أن المقصود نزفها المستمر.
theological_decisions:
- issue: احتمال الإشارة إلى حاشية الثوب اليهودي أو شرّابته في κράσπεδον
  choice: هدب ثوبه في المتن
  alternative: حاشية ثوبه أو شرّابة ثوبه
  rationale: اللفظ اليوناني يحتمل طرف الثوب أو هدبه، وربما الشرّابة المرتبطة باللباس اليهودي، لكن الآية وحدها لا توجب تخصيصه بشرّابة الشريعة؛ لذلك يحافظ المتن على الاحتمال وتورد الحاشية البدائل.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «فدنت» للإيجاز والسلاسة السردية، و«نزف دمها» لتوضيح الحالة من غير توسع تفسيري.
