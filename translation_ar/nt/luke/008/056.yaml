  source_fidelity: 'المسودة تنقل المعنى العام بدقة: دهشة الوالدين، ثم توجيه يسوع لهما بعدم إخبار أحد بما وقع. لكن «أوصاهما» قد تُفهم في العربية المعاصرة بوصفها نصحًا أو توصية غير ملزمة، وهي أضعف قليلًا من παρήγγειλεν في هذا السياق.'
  naturalness: العبارة فصيحة وواضحة. غير أن «أما هو» تُظهر بوضوح التحول الذي تفيده ὁ δὲ وتزيل أي احتمال طفيف لالتباس مرجع «لكنه» عند قراءة الآية منفردة.
  terminology: «والداها» و«بما حدث» مناسبان. يُستحسن «أمرهما» مقابل παρήγγειλεν، مع إبقاء الحاشية لبدائل الترجمة. وتحتاج الحاشية (ج) إلى ضبط العبارة الحرفية؛ فالتركيب اليوناني هو «الشيء الذي حدث»، لا «بالأمر الذي حدث».
  issues:
