  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: ar
  text: فدُهِش والداها[a]، أما هو فأمرهما[b] ألّا يُخبِرا أحدًا بما حدث[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اندهش والداها»، أو: «خرجا عن طورهما من شدة الدهشة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أوصاهما»، أو: «أمرهما بشدة».'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «الشيء الذي حدث»، أو: «الواقعة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: دُهِش
  rationale: ينقل الفعل شدة التعجب والذهول في هذا السياق، بعبارة عربية واضحة لا توحي بالضرورة بفقدان الوعي أو الاتزان.
- source_word: γονεῖς
  choice: والداها
  rationale: مقابل عربي مباشر وطبيعي للاسم الجمع الذي يعني الأب والأم.
- source_word: παρήγγειλεν
  choice: أوصاهما
  rationale: يحفظ قوة التوجيه الملزم من غير أن يضيف إلى السياق نبرة قاسية؛ وتوضح جملة النهي التالية مضمون الوصية.
- source_word: μηδενὶ
  choice: أحدًا
  rationale: جاءت ضمن تركيب النفي «ألّا يخبرا أحدًا»، وهو المقابل العربي الطبيعي للنهي عن إبلاغ أي شخص.
- source_word: εἰπεῖν
  choice: يُخبرا
  rationale: لأن الفعل هنا يتعدى إلى شخص ويشير إلى نقل خبر، فـ«يخبرا» أوضح في العربية من «يقولا».
- source_word: τὸ γεγονός
  choice: بما حدث
  rationale: ينقل اسم الفاعل التام المستعمل اسميًا بوصفه إشارة إلى الأمر الذي وقع، بصياغة عربية طبيعية.
- source_word: δὲ
  choice: لكن
  rationale: يُظهر المقابلة الخفيفة بين دهشة الوالدين وبين توجيه يسوع لهما.
theological_decisions:
- issue: سرية هوية المسيح ونطاق توجيه يسوع
  choice: 'صياغة التوجيه كما ورد: ألّا يخبرا أحدًا بما حدث، من غير بيان سببه أو مدته.'
  alternative: تفسيره في صلب النص على أنه أمر صارم بالصمت العلني مرتبط بموضوع السر المسياني، أو تقييده ضمنيًا بمدة أو جماعة معينة.
  rationale: لا تذكر الآية إلا النهي عن إخبار أحد بما حدث؛ لذلك تُحفظ دلالتها المباشرة وما يكتنف الدافع والنطاق من توتر دون حسم تفسيري.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُعمل المبني للمجهول «دُهِش» استعمالًا عربيًا فصيحًا للدلالة على غلبة الدهشة، وصيغ النهي بـ«ألّا يخبرا أحدًا» للمحافظة على سلاسة العبارة وقوة التوجيه.
