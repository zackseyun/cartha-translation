    rationale: الفعل يدل على توجيه أو أمر، لا مجرد نصيحة؛ و«أمرهما» يحفظ هذه القوة دون تحميل النص تفسيرًا إضافيًا.
  - severity: low
    issue: الحاشية (ج) تصف الحرفي بزيادة حرف الجر «بالـ».
    rationale: τὸ γεγονός تعني «الشيء الذي حدث/ما وقع»؛ أما الباء فهي من مقتضى التركيب العربي في المتن وليست جزءًا من العبارة اليونانية نفسها.
