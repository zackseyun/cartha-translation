  to: فدُهِش والداها[a]، أما هو فأمرهما[b] ألّا يُخبِرا أحدًا بما حدث[c].
  rationale: عُدِّل الفعل إلى «أمرهما» للمحافظة على قوة التوجيه في الأصل اليوناني، واستُبدلت «لكنه» بـ«أما هو» لإبراز المقابلة السردية التي تفيدها ὁ δὲ. كما صُححت صياغة الحاشية الحرفية من غير تغيير في المعنى.
