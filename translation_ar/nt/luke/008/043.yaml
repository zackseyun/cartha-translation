- source_word: οὐκ ἴσχυσεν ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: ولم يقدر أحد أن يشفيها
  rationale: تحويل طبيعي للمبني للمجهول اليوناني إلى تركيب عربي معلوم مع الحفاظ على معنى العجز الشامل عن شفائها.
