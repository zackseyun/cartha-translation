  source_fidelity: 'ينقل المتن المعنى الأساسي للنص اليوناني نقلًا صحيحًا: امرأة تعاني نزفًا لمدة اثنتي عشرة سنة، أنفقت جميع موارد معيشتها على الأطباء، ولم تستطع أن تُشفى من أحد. لكن الحاشية النصية (ج) تصف اختلافًا مخطوطيًا على نحو غير دقيق، إذ توحي بأن بعض الشواهد تحذف ذكر إنفاق الموارد، وهو ليس البيان المناسب للاختلاف المتصل بصياغة الشطر الأخير.'
