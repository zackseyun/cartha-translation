review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام أمين للنص اليوناني: السقوط في التربة الجيدة، ثم النمو والإثمار مئة ضعف، والنداء الختامي محفوظة جميعًا. لكن «غيره» لا تؤدي بسلاسة إحالة ἕτερον إلى بذرٍ آخر في سلسلة المثل، وقد توحي بمعنى «غيره/شيء سواه» أو بإضافة ضميرية غير مقصودة. «آخر» أدق وأفصح في هذا الحذف السياقي.'
  naturalness: الصياغة فصيحة وواضحة عمومًا. استبدال «غيره» بـ«آخر» يجعل افتتاح الجملة طبيعيًا في العربية الكتابية المعاصرة. وتبقى «مَن له أذنان للسمع فليسمع» صياغة عربية رصينة ومألوفة وتحفظ قوة النداء.
  terminology: «التربة الجيدة» مناسبة للسياق الزراعي لـγῆ τὴν ἀγαθήν، و«نما» و«أثمر» و«مئة ضعف» تؤدي المعنى بدقة. «مَن» تحافظ على العموم التمثيلي دون تذكيرٍ حصري أو تفسير لاهوتي زائد.
  issues:
  - severity: medium
    issue: «غيره» في افتتاح الآية
    rationale: ἕτερον تشير إلى بذر آخر ضمن عناصر المثل المتتابعة. «غيره» أقل طبيعية في العربية هنا وتضيف إيحاءً بإحالة ضميرية، بينما «آخر» يحفظ الحذف السياقي ويؤدي المعنى بوضوح.
  - severity: low
    issue: الحاشية [c] مصنفة «حرفيًا» مع أن نصها مطابق للنص الرئيس تقريبًا
    rationale: لا تقدم الحاشية بديلًا مفيدًا، ولا ينسجم توصيفها مع سبب «بديل معجمي». تُستبدل ببديل تركيبي عربي مشروع يحافظ على المعنى.
  - severity: low
    issue: الحاشية [b] تستعمل صيغة مؤنثة «أنتجت» بلا مرجع مؤنث ظاهر
    rationale: بعد اعتماد «آخر» يكون البديل الأنسب بصيغة المذكر، مع إمكان استعمال «غلة» لتوضيح الدلالة الزراعية.
