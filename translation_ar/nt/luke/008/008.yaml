  rationale: التعديل الضروري يقتصر على «غيره» ← «آخر» لتأدية ἕτερον على نحو عربي طبيعي ودقيق في سياق المثل. كما نُقحت الحواشي لتكون بدائل حقيقية متسقة مع النص العربي ووظيفة الحاشية، من غير تغيير في معنى الآية أو إضافة تفسيرية.
