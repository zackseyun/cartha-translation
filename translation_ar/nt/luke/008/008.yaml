base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: ar
  text: 'وَوَقَعَ آخَرُ فِي التُّرْبَةِ الْجَيِّدَةِ[a]، فَلَمَّا نَمَا أَثْمَرَ مِئَةَ ضِعْفٍ[b]. وَإِذْ كَانَ يَقُولُ هذَا، نَادَى: «مَنْ لَهُ أُذُنَانِ لِلسَّمَاعِ فَلْيَسْمَعْ!»[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأرض الجيدة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أنتج غلة مئة ضعف».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «الذي له أذنان للسمع فليسمع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: غَيْرُهُ
  rationale: ضمير محايد مفرد يشير إلى زرع آخر ضمن تسلسل المثل، و«غيره» عربية طبيعية موجزة.
- source_word: γῆν τὴν ἀγαθήν
  choice: التُّرْبَةِ الجَيِّدَةِ
  rationale: السياق زراعي، ولذلك تؤدي «التربة» معنى γῆ هنا بوضوح أكبر من «الأرض» الأوسع دلالة.
- source_word: φυὲν
  choice: فَلَمَّا نَمَا
  rationale: صياغة طبيعية تحفظ وقوع النمو قبل الإثمار، من غير إثقال العبارة بتركيب اسمي.
- source_word: ἐποίησεν καρπὸν
  choice: أَثْمَرَ
  rationale: فعل عربي فصيح وطبيعي يؤدي التعبير الزراعي «أنتج ثمرًا» بإيجاز.
- source_word: ἑκατονταπλασίονα
  choice: مِئَةَ ضِعْفٍ
  rationale: يحفظ مقدار الغلة المضاعفة كما في اليونانية، مع إمكان التعبير العربي البديل «مئة مثل».
- source_word: ταῦτα λέγων
  choice: وَإِذْ كَانَ يَقُولُ هذَا
  rationale: يحفظ تزامن القول مع النداء الذي يعقبه، مع استعمال المفرد «هذا» للدلالة على مضمون الكلام.
- source_word: ἐφώνει
  choice: نَادَى
  rationale: ينقل النطق الجهوري المؤكد من غير المبالغة التي قد توحي بها «صرخ».
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: مَنْ لَهُ أُذُنَانِ لِلسَّمَاعِ
  rationale: «مَن» عامة غير مقصورة على الذكور، وتحفظ البنية الشرطية التمثيلية والمقصود من امتلاك الأذنين للسماع.
- source_word: ἀκουέτω
  choice: فَلْيَسْمَعْ
  rationale: لام الأمر مع المضارع تؤدي بدقة صيغة الأمر للغائب وتحفظ نبرة الحث الجادة.
theological_decisions:
- issue: اللغة التمثيلية العامة في نداء يسوع
  choice: «مَنْ لَهُ أُذُنَانِ لِلسَّمَاعِ فَلْيَسْمَعْ»
  alternative: «مَن له أذنان تسمعان فليسمع» أو «الذي له أذنان للسمع فليسمع»
  rationale: «مَن» تنقل العموم المقصود في التركيب اليوناني من غير تخصيص بالذكور، وتحفظ صيغة المفرد وقوة الأمر، من دون تفسير المقصود الروحي داخل المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية وقورة. استُخدم التشكيل الجزئي للمساعدة على القراءة، وحُفظ الإيقاع الموجز للمثل والنداء الختامي المؤكد.
