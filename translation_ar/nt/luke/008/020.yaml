  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: ar
  text: 'فقيل له: «أمك وإخوتك[a] واقفون في الخارج، يريدون أن يروك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أقرباؤك»، إذا فُهمت كلمة ἀδελφοί بمعنى أوسع في هذا السياق؛ غير أن معناها المعتاد هو «الإخوة».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: فأُبلِغَ
  rationale: صيغة مبنية للمجهول تنقل معنى وصول الخبر إليه، وتحافظ على المبني للمجهول في اليونانية بعبارة عربية فصيحة وموجزة.
- source_word: δὲ
  choice: فـ
  rationale: الفاء رابط سردي خفيف يلائم انتقال الرواية هنا من غير أن يضفي معنى الاستدراك.
- source_word: αὐτῷ
  choice: الضمير المستتر في «أُبلِغَ»
  rationale: الفعل المبني للمجهول في العربية يشتمل على ضمير نائب الفاعل العائد إلى يسوع، فيؤدي معنى «له» طبيعيًا من غير تركيب ثقيل.
- source_word: μήτηρ
  choice: أمك
  rationale: المقابل العربي المباشر والفصيح للكلمة في هذا السياق العائلي.
- source_word: ἀδελφοί
  choice: إخوتك
  rationale: المعنى المعتاد للفظ اليوناني هنا هو الإخوة الذكور؛ ولم يُستبدل به لفظ أوسع يحسم طبيعة القرابة تفسيرًا.
- source_word: ἑστήκασιν
  choice: واقفون
  rationale: ينقل الحالة القائمة الناتجة التي تفيدها صيغة التام اليونانية، بصياغة عربية طبيعية.
- source_word: ἔξω
  choice: في الخارج
  rationale: ينقل الدلالة المكانية مباشرة من غير إضافة مكان غير مذكور في النص.
- source_word: ἰδεῖν
  choice: أن يروك
  rationale: يحافظ على المعنى الأساسي للفعل، وهو الرؤية، ولا يوسعه إلى المقابلة أو الحديث.
- source_word: θέλοντες
  choice: يريدون
  rationale: ينقل رغبتهم القائمة المصاحبة لوقوفهم، ويطابق جمع المذكّر الذي يعود إلى الأم والإخوة معًا بحسب الاستعمال العربي.
theological_decisions:
- issue: هوية «الإخوة» وصلتهم بيسوع
  choice: إخوتك
  alternative: أقرباؤك
  rationale: يحافظ النص على المعنى المعتاد للفظ ἀδελφοί ولا يفرض تفسيرًا مذهبيًا لطبيعة صلة هؤلاء بيسوع. ويُذكر الاحتمال الأوسع في الحاشية بدل إدخاله في المتن.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. استُعمل المبني للمجهول للمحافظة على بنية الخبر اليونانية، ووُضعت علامة الحاشية عقب اللفظ الذي تتناوله مباشرة.
