  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: ar
  text: 'وحدث في أحد تلك الأيام أن ركب هو وتلاميذه قاربًا، فقال لهم: «لنعبر إلى الضفة الأخرى من البحيرة».[a] ثم أبحروا.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لنعبر إلى الجانب الآخر من البحيرة».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن يفيد الفعل اليوناني: «انطلقوا بالقارب» أو «أقلعوا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وحدث
  rationale: صيغة انتقال سردي مألوفة عند لوقا؛ تنقل وقوع الحدث وتحافظ على قوة δέ الرابطة من غير استعمال تعبير قديم مثل «وكان فيما كان».
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: في أحد تلك الأيام
  rationale: يحفظ التعبير معنى يوم غير محدد ضمن فترة معلومة من السياق.
- source_word: καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: أن ركب هو وتلاميذه قاربًا
  rationale: صياغة عربية طبيعية تُبقي الضمير الصريح αὐτός وتفيد اشتراك التلاميذ معه في ركوب القارب، مع نقل πλοῖον النكرة إلى «قاربًا».
- source_word: εἶπεν πρὸς αὐτούς
  choice: فقال لهم
  rationale: نقل مباشر وطبيعي للفعل مع πρός، والفاء تلائم تعاقب الحدث في العربية.
- source_word: Διέλθωμεν
  choice: لنعبر
  rationale: ينقل صيغة المتكلم الجمع الحثية في الفعل اليوناني، بوصفها اقتراحًا يشمل المتكلم والمخاطبين.
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: إلى الضفة الأخرى من البحيرة
  rationale: «الضفة الأخرى» تعبير عربي واضح عن τὸ πέραν، و«البحيرة» هي المقابل المحدد لـ λίμνη.
- source_word: ἀνήχθησαν
  choice: أبحروا
  rationale: للفعل هنا استعمال ملاحي يفيد الانطلاق بالقارب؛ و«أبحروا» موجزة وطبيعية، ولا توهم أن المسطح المائي بحر لا بحيرة.
