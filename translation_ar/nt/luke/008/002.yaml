  rationale: حُذف الرابط التفسيري «ومنهن» ليُتبع بناء الأصل مباشرة، وأعيدت صياغة العبارة الأخيرة لإبراز قيمة الماضي الأسبق من غير إضافة تفسير لاهوتي أو تغيير للمعنى. وحُفظت الألفاظ الرئيسة والتمييز بين الأرواح الشريرة والأمراض، كما حُفظت الفاصلة الختامية لأن النص جزء من جملة متصلة في الآية.
