source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: ar
  text: 'وبعضُ النساء اللواتي كُنَّ قد شُفِينَ من أرواح شريرة وأمراض: مريمُ التي تُدعى المجدلية، التي كانت سبعةُ شياطين قد خرجت منها،'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: بعضُ النساء
  rationale: تفيد τινες مع الاسم الجمع جماعة غير محددة من النساء، و«بعض النساء» تعبير عربي طبيعي وواضح.
- source_word: ἦσαν τεθεραπευμέναι
  choice: كُنَّ قد شُفين
  rationale: ينقل التركيب المحيطي بصيغة الماضي التام معنى شفاء سبق زمن السرد وبقي أثره قائمًا.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: من أرواح شريرة
  rationale: «شريرة» تقابل πονηρῶν مباشرة، ولا يحوّل النص اللفظ إلى «نجسة»، لأن الأصل لا يستعمل ἀκάθαρτος هنا.
- source_word: καὶ ἀσθενειῶν
  choice: وأمراض
  rationale: يشير اللفظ في السياق إلى العلل الجسدية، و«أمراض» لفظ حديث واضح ينسجم مع فعل الشفاء.
- source_word: Μαρία ἡ καλουμένη Μαγδαληνή
  choice: مريم التي تُدعى المجدلية
  rationale: صياغة عربية طبيعية تحفظ كون «المجدلية» تسمية تُعرَف بها مريم.
- source_word: ἀφ’ ἧς
  choice: منها
  rationale: تنقل ἀπό الدالة على الانفصال أو المصدر بإيجاز عربي طبيعي.
- source_word: δαιμόνια ἑπτὰ
  choice: سبعة شياطين
  rationale: يحفظ «شياطين» الدلالة الشخصية المحددة لـδαιμόνια، المتميزة من لفظ «الأرواح» الأوسع في أول الآية.
- source_word: ἐξεληλύθει
  choice: قد خرج
  rationale: تنقل صيغة الماضي الأسبق أن الخروج تم قبل زمن السرد، مع صياغة عربية سليمة بعد تقديم المفعول العددي.
theological_decisions:
- issue: صياغة لغة الأذى الشيطاني
  choice: الإبقاء على «أرواح شريرة» و«شياطين» بوصفهما فئتين لغويتين شخصيتين، مع تمييزهما من الأمراض
  alternative: اعتبار الألفاظ مجازًا عن حالات نفسية أو جسدية
  rationale: يميز اليوناني بين πνευμάτων πονηρῶν وδαιμόνια من جهة، وἀσθενειῶν من جهة أخرى؛ لذلك تحفظ الترجمة هذا التمييز من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختير «كُنَّ قد شُفين» لإظهار الأسبقية الزمنية، و«المجدلية» وفق الاستعمال العربي الكتابي الشائع. لا توجد حواشٍ لأن البدائل الإنجليزية المذكورة لا تمثل فروقًا ضرورية في العربية.
