review_pass:
  verdict: revise
  source_fidelity: تحتاج الصياغة إلى مراجعة محدودة لضبط الأزمنة والجهات النحوية. فـ συνήρπακει فعل تام سابق في السياق، والأدق «كان قد استولى عليه»، بينما ἐδεσμεύετο وφυλασσόμενος مبنيان للمجهول ولا يلزم تعيين «كانوا» فاعلًا لهما. كما أن «الرُّبُط» غير طبيعية هنا ولا تميّز بوضوح عن أدوات التقييد المذكورة سابقًا.
  naturalness: النص المقترح بعد التعديل فصيح واضح وسلس، ويحافظ على النبرة السردية من دون تراكم غير طبيعي للأفعال المبنية للمعلوم أو استعمال «الرُّبُط».
  terminology: «الروح النجس» و«الشيطان» مناسبان للسياق ويحفظان التمييز القائم في اليونانية بين الروح النجس والديمون، من غير تفسير نفسي أو تحديد الديمون بإبليس. واستعمال «السلاسل والقيود» ثم «الوثاق» يعبّر عن تنوع ألفاظ التقييد في الأصل.
  issues:
  - severity: medium
    issue: زمن «كان يستولي عليه» لا يعكس تمام الفعل συνηρπάκει.
    rationale: الفعل اليوناني بصيغة التام الأسبق، ويشير إلى استيلاءات سابقة قبل لحظة السرد؛ «كان قد استولى عليه» أدق، مع إبقاء احتمال التكرار في «مرات كثيرة» والحاشية.
  - severity: medium
    issue: تحويل «كان يُقيَّد ويُحرس» إلى «كانوا يربطونه... ويحرسونه» يضيف فاعلًا بشريًا صريحًا ويضعف بنية المبني للمجهول.
    rationale: الأصل يصف الرجل بأنه كان مقيّدًا ومحروسًا من غير تسمية الفاعلين. صيغة المبني للمجهول العربية طبيعية وتحفظ هذا القدر من عدم التعيين.
  - severity: medium
    issue: «فيحطم الرُّبُط» غير طبيعي لغويًا ولا يترجم δεσμά بوضوح.
    rationale: «الوثاق» لفظ عربي واضح للروابط أو القيود عامة، و«يمزق الوثاق» ينقل قوة διαρρήσσων ويجنب تكرار اللفظين السابقين.
  revised_text: لِأَنَّهُ كَانَ قَدْ أَمَرَ الرُّوحَ النَّجِسَ أَنْ يَخْرُجَ مِنَ الرَّجُلِ. فَقَدْ كَانَ قَدِ اسْتَوْلَى عَلَيْهِ مَرَّاتٍ كَثِيرَةً[a]، وَكَانَ يُرْبَطُ بِالسَّلَاسِلِ وَالْقُيُودِ وَيُحْرَسُ، وَإِذْ كَانَ يُمَزِّقُ الْوَثَاقَ، كَانَ الشَّيْطَانُ يَسُوقُهُ إِلَى الْأَمَاكِنِ الْمُقْفِرَةِ[b].
