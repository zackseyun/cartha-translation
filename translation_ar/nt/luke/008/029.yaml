source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: ar
  text: لِأَنَّهُ كَانَ قَدْ أَمَرَ الرُّوحَ النَّجِسَ أَنْ يَخْرُجَ مِنَ الرَّجُلِ. فَقَدْ كَانَ قَدِ اسْتَوْلَى عَلَيْهِ مَرَّاتٍ كَثِيرَةً[a]، وَكَانَ يُرْبَطُ بِالسَّلَاسِلِ وَالْقُيُودِ وَيُحْرَسُ، وَإِذْ كَانَ يُمَزِّقُ الْوَثَاقَ، كَانَ الشَّيْطَانُ يَسُوقُهُ إِلَى الْأَمَاكِنِ الْمُقْفِرَةِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «منذ زمن طويل»؛ فالعبارة اليونانية قد تدل على مدة ممتدة، مع أن السياق يؤيد أيضًا تكرر النوبات.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «إلى الأماكن الخالية»؛ واللفظ اليوناني بصيغة الجمع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: كان قد أمر
  rationale: ينقل الفعل الماضي الناقص في سياقه التفسيري بوصفه حدثًا سابقًا لجواب الروح، من غير إغفال دلالته السياقية.
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: الروح النجس
  rationale: تعبير عربي كتابي واضح يحفظ الصلة اللفظية بمفهوم النجاسة.
- source_word: πολλοῖς γὰρ χρόνοις
  choice: مرات كثيرة
  rationale: السياق يرجح تكرر نوبات الاستيلاء، مع إثبات احتمال دلالة الامتداد الزمني في الحاشية.
- source_word: συνηρπάκει
  choice: كان يستولي عليه
  rationale: يعبر عن القبض العنيف والتغلب، وهو طبيعي وواضح في العربية.
- source_word: ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις
  choice: كانوا يربطونه بالسلاسل والقيود
  rationale: صيغ المبني للمعلوم مع فاعل بشري عام توضح المعنى الطبيعي للمبني للمجهول، وتحافظ «السلاسل والقيود» على تمييز أداتي التقييد.
- source_word: φυλασσόμενος
  choice: ويحرسونه
  rationale: ينقل الظرف المصاحب بصياغة عربية مباشرة سلسة.
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: فيحطم الربط
  rationale: يحفظ معنى تمزيق وسائل التقييد، مع تجنب تكرار السلاسل والقيود حرفيًا.
- source_word: ἠλαύνετο ὑπὸ τοῦ δαιμονίου
  choice: ويسوقه الشيطان
  rationale: «يسوقه» يحفظ معنى الإجبار، و«الشيطان» هنا اسم جنس مفرد لكائن شيطاني، لا اسم علم لإبليس.
- source_word: εἰς τὰς ἐρήμους
  choice: إلى الأماكن المقفرة
  rationale: يحفظ صيغة الجمع ومعنى المواضع الخالية غير المأهولة.
theological_decisions:
- issue: المصطلحات الدالة على القوى الشيطانية
  choice: الروح النجس والشيطان
  alternative: الروح الشرير أو الجني
  rationale: يحافظ النص على الوكالة الشخصية الصريحة التي تعرضها الرواية، من غير تلطيف نفسي أو تفسير مجازي؛ و«الشيطان» في العربية المعاصرة أوضح من «العفريت»، مع بقاء المقصود شيطانًا لا إبليس تحديدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُعمل الضبط الجزئي في النص لتسهيل القراءة، وحُفظت أدوات الربط التفسيرية، مع إعادة بناء التراكيب الوصفية بما يلائم العربية الطبيعية.
