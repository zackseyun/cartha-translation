- from: لِأَنَّهُ كَانَ قَدْ أَمَرَ الرُّوحَ النَّجِسَ أَنْ يَخْرُجَ مِنَ الرَّجُلِ. فَقَدْ كَانَ يَسْتَوْلِي عَلَيْهِ مَرَّاتٍ كَثِيرَةً[a]، وَكَانُوا يَرْبِطُونَهُ بِالسَّلَاسِلِ وَالْقُيُودِ وَيَحْرُسُونَهُ، فَيُحَطِّمُ الرُّبُطَ، وَيَسُوقُهُ الشَّيْطَانُ إِلَى الْأَمَاكِنِ الْمُقْفِرَةِ[b].
  to: لِأَنَّهُ كَانَ قَدْ أَمَرَ الرُّوحَ النَّجِسَ أَنْ يَخْرُجَ مِنَ الرَّجُلِ. فَقَدْ كَانَ قَدِ اسْتَوْلَى عَلَيْهِ مَرَّاتٍ كَثِيرَةً[a]، وَكَانَ يُرْبَطُ بِالسَّلَاسِلِ وَالْقُيُودِ وَيُحْرَسُ، وَإِذْ كَانَ يُمَزِّقُ الْوَثَاقَ، كَانَ الشَّيْطَانُ يَسُوقُهُ إِلَى الْأَمَاكِنِ الْمُقْفِرَةِ[b].
