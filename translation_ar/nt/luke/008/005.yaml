revisions:
- from: خرج الزارع ليزرع بذاره. وفيما هو يزرع، وقع بعض البذار بجانب الطريق، فديس، وأكلته طيور السماء.[a]
  to: خرج الزارع ليزرع بذاره. وفيما كان يزرع، سقط بعض بذاره بجانب الطريق، فديس، والتهمته طيور السماء.
  rationale: عُدّل الفعل الأخير إلى «التهَمته» لإظهار قوة κατέφαγεν، وصُقلت العبارة الزمنية والمرجع إلى البذار. وحُذفت الحاشية لأن البديل الإنجليزي بين “sky/heaven” لا يقتضي فرقًا دلاليًا مفيدًا في العربية هنا، ولأن قوة الفعل صارت ممثلة في المتن نفسه.
