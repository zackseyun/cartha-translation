review_pass:
  verdict: revise
  source_fidelity: 'النص ينقل البنية والمعنى الأساسيين بدقة: خروج الزارع لغرض الزرع، وسقوط جزء من البذار بمحاذاة الطريق، ودوسه، ثم أكل الطيور له. لكن «أكلته» أضعف قليلًا من دلالة κατέφαγεν المكثفة، والأقرب في هذا السياق «التهَمته».'
  naturalness: الصياغة عربية فصحى معاصرة وسلسة عمومًا. و«وفيما كان يزرع» أكثر انسيابًا قليلًا من «وفيما هو يزرع»، كما أن «سقط بعض بذاره» أوضح اتصالًا بالمرجع السابق.
  terminology: «الزارع» و«البذار» و«طيور السماء» اختيارات دقيقة وطبيعية. لا توجد مصطلحات لاهوتية خاصة في الآية.
  issues:
  - severity: low
    issue: ضعف التوكيد في «أكلته»
    rationale: الفعل κατέφαγεν يحمل في السياق معنى الأكل التام أو الافتراس؛ «التهَمته» تنقل هذه القوة بصورة عربية طبيعية، وتوافق مسار التدقيق الإنجليزي الذي اختار “devoured.”
  - severity: low
    issue: الحاشية الحالية لا تقدّم بديلًا لازمًا للنص العربي
    rationale: الحاشية تشرح قوة الفعل مع أن النص الرئيس يستعمل «أكلته»، وتأتي علامتها بعد «طيور السماء» لا بعد الفعل الذي تتعلق به. يمكن حل الأمر باعتماد «التهَمته» في المتن وحذف الحاشية؛ أما «طيور السماء» فهي بالفعل ترجمة مباشرة وطبيعية للتعبير اليوناني.
  revised_text: خرج الزارع ليزرع بذاره. وفيما كان يزرع، سقط بعض بذاره بجانب الطريق، فديس، والتهمته طيور السماء.
