  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: ar
  text: خرج الزارع ليزرع بذاره. وفيما كان يزرع، سقط بعض بذاره بجانب الطريق، فديس، والتهمته طيور السماء.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξῆλθεν
  choice: خرج
  rationale: فعل ماضٍ طبيعي في العربية، ينقل معنى الخروج من غير صياغة قديمة أو توسع.
- source_word: ὁ σπείρων
  choice: الزارع
  rationale: اسم الفاعل المعرّف مستعمل استعمال الاسم؛ و«الزارع» تعبير عربي موجز وملائم للمثل.
- source_word: τοῦ σπεῖραι
  choice: ليزرع
  rationale: المصدر المعرّف المجرور بعد فعل الحركة يفيد الغرض، ولام التعليل تنقل هذا المعنى بوضوح.
- source_word: τὸν σπόρον αὐτοῦ
  choice: بذاره
  rationale: تنقل معنى البذار المخصص للزرع وضمير الملكية، وهي طبيعية في السياق الزراعي.
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: وفيما هو يزرع
  rationale: تنقل تزامن الحدثين بصياغة عربية واضحة وتحافظ على استمرارية فعل الزرع.
- source_word: ὃ μὲν
  choice: بعض البذار
  rationale: التركيب اليوناني يشير توزيعيًا إلى قسم من البذار؛ وذكر «البذار» يزيل غموض الضمير في العربية دون تغيير المرجع.
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: وقع ... بجانب الطريق
  rationale: «بجانب» تنقل دلالة παρά المكانية هنا، و«وقع» فعل مألوف للبذار.
- source_word: κατεπατήθη
  choice: فديس
  rationale: يحافظ على المبني للمجهول وعلى معنى الوطء بالأقدام بإيجاز.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: طيور السماء
  rationale: ترجمة مباشرة للتعبير اليوناني، طبيعية وفصيحة، مع إبقاء صورة السماء بدل استبدالها بالهواء.
- source_word: κατέφαγεν αὐτό
  choice: وأكلته
  rationale: الفعل اليوناني يدل على الأكل التام أو الشديد؛ وفي هذا السياق تؤدي «أكلته» المعنى طبيعيًا، مع إمكان بيان قوة الفعل في الحاشية.
