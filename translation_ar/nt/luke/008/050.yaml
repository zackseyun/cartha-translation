  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: ar
  text: 'أَمَّا يَسُوعُ، فَلَمَّا سَمِعَ ذَلِكَ، أَجَابَهُ: «لَا تَخَفْ؛ آمِنْ فَقَطْ[a]، وَسَتُخَلَّصُ[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثِقْ فقط»، أو: «ليكن لك إيمان».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ستنجو»، أو: «ستُشفى» أو «تسترد عافيتها». قد يعني الفعل اليوناني الخلاص أو الإنقاذ أو الشفاء؛ وفي هذا السياق يتصل بإنقاذها من الموت وإعادتها إلى العافية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: فَلَمَّا سَمِعَ
  rationale: ينقل اسم الفاعل اليوناني الدال على فعل سابق بصياغة عربية طبيعية، من غير إضافة مفعول صريح غير مذكور في النص اليوناني.
- source_word: ἀπεκρίθη αὐτῷ
  choice: أَجَابَهُ
  rationale: تعبير عربي موجز وطبيعي ينقل فعل الإجابة مع المفعول غير المباشر.
- source_word: Μὴ φοβοῦ
  choice: لَا تَخَفْ
  rationale: صيغة نهي عربية مباشرة تحفظ قوة أمر يسوع وإيجازه.
- source_word: μόνον πίστευσον
  choice: آمِنْ فَقَطْ
  rationale: يحفظ «فقط» قصر المطلوب على الإيمان، ويترجم فعل πιστεύω بصيغته المباشرة، مع بيان دلالة الثقة والإيمان في الحاشية.
- source_word: σωθήσεται
  choice: وَسَتَنْجُو هِيَ
  rationale: «ستنجو» عربية واضحة تلائم سياق إنقاذ الفتاة من الموت، مع إبقاء البدائل «ستُخلَّص» و«ستُشفى» في الحاشية حفظًا لاتساع معنى الفعل اليوناني. وأُبرز الضمير «هي» لإظهار أن الفاعل المؤنث المفهوم من السياق هو ابنة يايرس.
theological_decisions:
- issue: دلالة πιστεύω في أمر يسوع
  choice: آمِنْ فَقَطْ
  alternative: 'ثِقْ فقط؛ أو: ليكن لك إيمان'
  rationale: «آمن» هو المقابل الفعلي المباشر، لكن الفعل اليوناني قد يشدد كذلك على الاتكال والثقة، لذلك تُذكر هذه الدلالة في الحاشية دون حصر المعنى في التصديق الذهني.
- issue: دلالة σωθήσεται في سياق الموت والشفاء
  choice: وَسَتَنْجُو هِيَ
  alternative: 'ستُخلَّص؛ أو: ستُشفى وتسترد عافيتها'
  rationale: الفعل σῴζω يتسع للإنقاذ والخلاص والشفاء. «ستنجو» يلائم الخطر المباشر من الموت من غير اختزال الكلمة في الشفاء وحده، بينما تحفظ الحاشية الصياغتين الخلاصية والعلاجية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت جمل قصيرة توافق إيجاز القول اليوناني، ووُضعت علامتا الحاشية بعد اللفظين اللذين تشرحانهما مباشرة.
