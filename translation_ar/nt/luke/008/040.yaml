  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: ar
  text: ولمّا رجع يسوع، رحّب به الجمع[a]، لأنهم كانوا جميعًا ينتظرونه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «استقبله الجمع»؛ فالفعل اليوناني قد يدل على الاستقبال أو الترحيب، والسياق هنا إيجابي.
    reason: lexical_alternative
  - marker: b
    text: أو «كانوا جميعًا يتوقعون مجيئه».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: ولمّا رجع
  rationale: ينقل تركيب ἐν مع المصدر المعرّف بوصفه جملة زمنية، وتؤدي الواو وظيفة δέ في مواصلة السرد من غير إضافة ظرف زمان غير موجود في الأصل.
- source_word: ὑποστρέφειν
  choice: رجع
  rationale: تعبير عربي فصيح وطبيعي لمعنى العودة، ويلائم رجوع يسوع في السياق.
- source_word: ἀπεδέξατο
  choice: رحّب به
  rationale: يفيد الفعل قبولًا إيجابيًا في هذا السياق؛ و«رحّب به» أوضح من «استقبله» في نقل هذا البعد، من غير إضافة معنى الفرح الصريح.
- source_word: ὁ ὄχλος
  choice: الجمع
  rationale: ينقل دلالة جماعة الناس المحتشدة بلفظ عربي كتابي واضح ومألوف.
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: لأنهم كانوا جميعًا ينتظرونه
  rationale: تنقل «لأن» تعليل γάρ، ويحفظ تركيب «كانوا... ينتظرونه» الاستمرار في اسم الفاعل، مع إبراز πάντες بلفظ «جميعًا».
- source_word: Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية المعيارية المتداولة للاسم في ترجمات الكتاب المقدس.
