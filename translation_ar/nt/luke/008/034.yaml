  terminology: «رعاة الخنازير» ملائم للسياق المباشر ولا يوقع في إيحاء رعاة الغنم. و«الريف» اختيار حديث واضح لـ«τοὺς ἀγρούς» في مقابل المدينة، وقد حفظت الحاشية البديل الحرفي «الحقول».
