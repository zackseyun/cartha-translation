  source_fidelity: الترجمة تنقل بدقة البنية الزمنية لاسم الفاعل «Ἰδόντες» في «فلما رأى»، والحدث المكتمل في «ما حدث»، ثم فعلي الهرب والإبلاغ. و«في المدينة وفي الريف» تعكس بصورة طبيعية نطاق الإبلاغ المقصود في السياق، مع بقاء المقابلة بين المدينة والمنطقة المحيطة.
