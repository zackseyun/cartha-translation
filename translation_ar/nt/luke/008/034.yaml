  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: ar
  text: فَلَمَّا رَأَى رُعَاةُ الْخَنَازِيرِ مَا حَدَثَ، هَرَبُوا وَأَخْبَرُوا بِهِ فِي الْمَدِينَةِ وَفِي الرِّيفِ.[a]
  philosophy: optimal-equivalence
  footnotes:
