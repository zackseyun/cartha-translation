    text: 'حرفيًا: «وفي الحقول»، والمقصود هنا المنطقة الريفية المحيطة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: فَلَمَّا رَأَى
  rationale: يؤدي اسم الفاعل الماضي هنا معنى زمنيًا تابعًا للفعلين الرئيسيين، وصيغة «فلما رأى» طبيعية في العربية السردية.
- source_word: οἱ βόσκοντες
  choice: رُعَاةُ الْخَنَازِيرِ
  rationale: التركيب يعني القائمين على رعي القطيع، والسياق يحدد أنه قطيع خنازير؛ والتصريح بها يمنع أن يُفهم أنهم رعاة غنم.
- source_word: τὸ γεγονός
  choice: مَا حَدَثَ
  rationale: ينقل معنى الحدث الذي وقع واكتمل بعبارة عربية واضحة وموجزة.
- source_word: ἔφυγον
  choice: هَرَبُوا
  rationale: مقابل مباشر وطبيعي للفعل، من غير إضافة معنى النجاة أو الإفلات.
- source_word: ἀπήγγειλαν
  choice: أَخْبَرُوا بِهِ
  rationale: ينقل معنى إبلاغ الخبر، والضمير يعود إلى ما حدث وهو مفهوم من السياق.
- source_word: εἰς τὴν πόλιν
  choice: فِي الْمَدِينَةِ
  rationale: مع فعل الإخبار يدل السياق على المكان الذي نُشر فيه الخبر؛ وهذه الصياغة أفصح وأوضح عربيًا من النقل الحرفي «إلى المدينة».
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: وَفِي الرِّيفِ
  rationale: مع أن اللفظ قد يعني حرفيًا «الحقول»، فإنه في مقابل «المدينة» يشير إلى المنطقة الريفية المحيطة.
