lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: أَمَّا هُوَ فَـ
  rationale: ينقل التحول السردي الخفيف في δέ مع إبراز الضمير αὐτός من غير مبالغة في التأكيد.
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: أَمْسَكَ بِيَدِهَا
  rationale: تعبير عربي طبيعي يصور إمساكه بيدها، من غير إيحاء بالعنف كما قد يفعل «قبض عليها».
- source_word: ἐφώνησεν λέγων
  choice: نَادَى قَائِلًا
  rationale: يحافظ على معنى النداء المسموع وعلى صيغة الحال التي تمهد للكلام المباشر.
- source_word: Ἡ παῖς
  choice: يَا طِفْلَةُ
  rationale: السياق يحدد أن المخاطبة أنثى، و«طفلة» تحفظ معنى παῖς بوصفها ولدًا صغيرًا دون إدخال صيغة التصغير الواردة في مواضع موازية.
- source_word: ἔγειρε
  choice: قُومِي
  rationale: أمر مباشر طبيعي في العربية، يؤدي معنى النهوض أو القيام في هذا السياق، ويصلح كذلك ضمن مشهد إعادتها إلى الحياة.
theological_decisions:
- issue: صيغة مخاطبة ابنة يايرس
  choice: يَا طِفْلَةُ
  alternative: يَا فَتَاةُ
  rationale: «طفلة» أقرب إلى المجال الدلالي العام لـπαῖς، بينما يبين التأنيث ما يفرضه السياق، من غير مواءمة النص مع ألفاظ الروايات الموازية.
- issue: صياغة أمر الإقامة
  choice: قُومِي
  alternative: انْهَضِي
  rationale: «قومي» أمر عربي واضح ومباشر، ولا يضيف تفسيرًا صريحًا للقيامة مع بقاء قوة الحدث ظاهرة من السياق.
