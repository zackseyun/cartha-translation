  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: ar
  text: وَأَمَّا مَا سَقَطَ بَيْنَ الشَّوْكِ، فَهَؤُلَاءِ هُمُ الَّذِينَ سَمِعُوا، لَكِنَّهُمْ، وَهُمْ مَاضُونَ، تَخْنُقُهُمْ هُمُومُ[a] الْحَيَاةِ وَغِنَاهَا وَمَلَذَّاتُهَا، فَلَا يَأْتُونَ بِثَمَرٍ مُكْتَمِلٍ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قلق».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فلا يثمرون إلى التمام»، أو: «فلا يأتون بثمر ناضج».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... πεσόν
  choice: مَا سَقَطَ
  rationale: يحافظ على صيغة المفرد المحايد في اليونانية من غير إضافة كلمة «البذر» غير المذكورة صراحة في هذه الجملة، مع وضوح الإحالة في سياق المثل.
- source_word: εἰς τὰς ἀκάνθας
  choice: بَيْنَ الشَّوْكِ
  rationale: تعبير عربي طبيعي يحفظ صورة سقوط البذر في موضع الشوك، وهو المقابل المألوف في سياق المثل.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: فَهَؤُلَاءِ هُمُ الَّذِينَ سَمِعُوا
  rationale: ينقل اسم الإشارة وصيغة التعريف، ويعبّر بالفعل الماضي عن اسم الفاعل اليوناني الدال على وقوع السماع.
- source_word: πορευόμενοι
  choice: فِيمَا هُمْ مَاضُونَ
  rationale: ينقل معنى الاستمرار في السير أو المضي من غير حصره تفسيرًا في «مسيرة الحياة» كلها.
- source_word: ὑπὸ μεριμνῶν
  choice: تَخْنُقُهُمْ هُمُومُ
  rationale: «هموم» لفظ واسع يشمل القلق والانشغال، ويستقيم فاعلًا في الصياغة العربية المبنية للمعلوم مع حفظ كون هذه الأمور سبب الاختناق.
- source_word: πλούτου
  choice: غِنَاهَا
  rationale: «الغنى» ينقل معنى الثروة والوفرة، وإضافة الضمير إلى الحياة توضّح أن المضافات الثلاثة مرتبطة بـ«الحياة» بحسب إمكان التركيب اليوناني وسياقه.
- source_word: ἡδονῶν τοῦ βίου
  choice: مَلَذَّاتُهَا
  rationale: ينقل معنى ملذات الحياة الدنيوية بعبارة موجزة وطبيعية، والضمير عائد إلى «الحياة» المذكورة.
- source_word: συμπνίγονται
  choice: تَخْنُقُهُمْ
  rationale: يحفظ صورة الاختناق الزراعية بوضوح، مع تحويل المبني للمجهول إلى تركيب عربي طبيعي يصرّح بالأسباب الواردة في النص بوصفها الفاعل.
- source_word: οὐ τελεσφοροῦσιν
  choice: فَلَا يُنْضِجُونَ ثَمَرًا
  rationale: يحفظ استعارة الثمر ويعبّر عن بلوغه النضج والتمام، لا عن مجرد بدء الإثمار.
theological_decisions:
- issue: طبيعة إخفاق السامعين المشبَّهين بالأرض ذات الشوك
  choice: الإبقاء على صورتي الاختناق وعدم إنضاج الثمر من غير تقرير حكم عقائدي إضافي على حالتهم الروحية.
  alternative: تفسير العبارة صراحة بأنهم غير متجددين أصلًا، أو مؤمنون حقيقيون صاروا بلا ثمر، أو أشخاص ارتدوا بعد بداية صحيحة.
  rationale: تصف الآية أثر هموم الحياة وغناها وملذاتها في السامعين، لكنها لا تحسم بذاتها الجدل المتعلق بالتجدد أو الارتداد أو فقدان المكافأة؛ لذلك تحفظ الترجمة التوتر القائم في النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية كريمة. استُخدم «ما سقط» التزامًا بصيغة الأصل، و«فيما هم ماضون» لحفظ دلالة الاستمرار، مع تجنب تفسير المضي تفسيرًا لاهوتيًا زائدًا. وُضعت علامتا الحاشيتين عند اللفظين اللذين تتعلق بهما البدائل مباشرة.
