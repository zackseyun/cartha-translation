  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما في ذلك صورة الشوك والاختناق وعدم بلوغ الإثمار تمامه. لكن «فلا يُنضجون ثمرًا» تجعل السامعين يُنضجون الثمر، في حين أن τελεσφοροῦσιν تصف إتيانهم/إثمارهم بثمر يبلغ الاكتمال؛ لذا يلزم تعديلها.
  naturalness: «فيما هم ماضون» مفهومة لكنها متكلّفة في الفصحى المعاصرة. وصياغة «وهم ماضون» أسلس وتحافظ على دلالة المشاركة الحاضرة المستمرة من غير توسيعها إلى تفسير صريح لمسيرة الحياة.
  terminology: «الشوك»، «هموم»، «الغنى»، و«الملذات» مناسبة. ويجوز أن يشمل تركيب «هموم الحياة وغناها وملذاتها» عناصر الثلاثة في سياق الحياة، من غير فرض نتيجة لاهوتية إضافية. استُبدلت الحاشية «مخاوف» ببديل أدق لـμερίμναι، وهو «قلق».
  issues:
  - severity: medium
    issue: «فلا ينضجون ثمرًا» لا ينقل بدقة فعل τελεσφοροῦσιν.
    rationale: الفعل اليوناني يعني الإثمار إلى التمام أو إتيان ثمر مكتمل، لا إنضاج الثمر بوصفه مفعولًا مباشرًا. «فلا يأتون بثمر مكتمل» يحفظ الاستعارة والنتيجة.
  - severity: low
    issue: «فيما هم ماضون» أقل سلاسة من المطلوب في العربية الفصحى المعاصرة.
    rationale: «وهم ماضون» يؤدي الدلالة المستمرة نفسها بصياغة عربية أوضح.
