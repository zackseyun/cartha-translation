  text: وكانوا يتوسّلون إليه ألّا يأمرهم بالذهاب إلى الهاوية[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الغمر السحيق». يمكن للكلمة اليونانية أن تدل على عمق عظيم؛ ويُرجَّح هنا أنها تشير إلى الهاوية بوصفها موضعًا لحبس الأرواح الشريرة.'
