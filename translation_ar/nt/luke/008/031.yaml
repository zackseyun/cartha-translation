lexical_decisions:
- source_word: παρεκάλουν
  choice: كانوا يتوسّلون
  rationale: صيغة الماضي الناقص تدل على التوسّل المستمر أو المتكرر، و«كانوا يتوسّلون» تنقل هذا الجانب وتلائم طلب الأرواح الشريرة الملحّ.
- source_word: ἐπιτάξῃ
  choice: يأمرهم
  rationale: الفعل يدل على إصدار أمر بسلطان، وإدراج ضمير المفعول في «يأمرهم» ينقل علاقة αὐτοῖς بالفعل بصورة عربية طبيعية.
- source_word: ἄβυσσον
  choice: الهاوية
  rationale: «الهاوية» مقابل عربي مباشر يحفظ معنى العمق السحيق والدلالة الخارقة للطبيعة في هذا السياق، من غير إضافة تفسير مثل «بئر لا قرار لها».
- source_word: ἀπελθεῖν
  choice: بالذهاب
  rationale: ينقل فعل الحركة ببساطة، بينما تحدد عبارة «إلى الهاوية» وجهته، فلا حاجة إلى إضافة «بعيدًا».
- source_word: ἵνα μὴ
  choice: ألّا
  rationale: بعد فعل التوسّل، تعبّر ἵνα مع صيغة النفي عن مضمون الطلب؛ و«ألّا» صياغة عربية طبيعية ودقيقة.
- source_word: αὐτοῖς
  choice: هم في «يأمرهم»
  rationale: الداتيف يعيّن الذين يتوجه إليهم الأمر؛ وقد دُمج الضمير في الفعل وفق الأسلوب العربي الطبيعي.
theological_decisions:
- issue: دلالة ἄβυσσος في سياق الأرواح الشريرة
  choice: «الهاوية» بوصفها عمقًا ذا دلالة على موضع حبس أو دينونة خارق للطبيعة
  alternative: «الغمر» أو «العمق السحيق» بمعنى مكاني أعم
  rationale: السياق يتحدث عن أرواح شريرة تخشى أمر يسوع السلطاني. وتحفظ «الهاوية» البعد الروحي والكوني للنص من غير أن تحدد طبيعة الموضع بأكثر مما يصرّح به لوقا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم تركيب «كانوا يتوسّلون» لإبراز الاستمرار في الماضي، وحُفظ مصطلح «الهاوية» مع بيان البديل المعجمي في الحاشية دون حسم ما لا يحسمه النص.
