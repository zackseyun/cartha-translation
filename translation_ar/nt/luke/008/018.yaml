  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: ar
  text: فانتبهوا إذن كيف تسمعون؛ لأن مَن له سيُعطى له، ومَن ليس له سيُنتزع منه حتى ما يظن أن له.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حتى ما يبدو أن له سيُنتزع منه».'
    reason: 'يحمل δοκέω هنا احتمالين معجميين معتبرين: «يظن» و«يبدو».'
lexical_decisions:
- source_word: βλέπετε
  choice: انتبهوا
  rationale: فعل أمر يفيد الحذر وإمعان النظر مجازيًا، و«انتبهوا» يؤدي قوة التنبيه بوضوح في العربية المعاصرة.
- source_word: οὖν
  choice: إذن
  rationale: تربط الوصية بما سبق من تعليم عن السماع والإعلان، وتحافظ على دلالة الاستنتاج.
- source_word: πῶς ἀκούετε
  choice: كيف تسمعون
  rationale: تحافظ على التركيز في كيفية السماع، بما يشمل التلقي والاستجابة، من غير إضافة تفسير إلى المتن.
- source_word: ὃς ἂν ... ἔχῃ
  choice: مَن له
  rationale: تنقل صيغة الشرط العام غير المحدد بإيجاز طبيعي وتحافظ على الطابع المثلي للقول.
- source_word: δοθήσεται αὐτῷ
  choice: سيُعطى
  rationale: يحافظ المبني للمجهول وعدم ذكر المفعول به على صياغة اليونانية وغموضها المقصود، بدل إضافة «المزيد» إلى المتن.
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: مَن ليس له
  rationale: تقابل العبارة الأولى وتحافظ على بنية الشرط العام.
- source_word: ὃ δοκεῖ ἔχειν
  choice: ما يظن أن له
  rationale: يفهم δοκεῖ على أنه ظنّ الشخص امتلاكه شيئًا؛ وهو معنى طبيعي في السياق، مع إثبات احتمال «يبدو أن له» في الحاشية.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: سيُنتزع منه
  rationale: ينقل معنى الإزالة والحرمان بقوة واضحة، مع الحفاظ على المبني للمجهول.
- source_word: αὐτῷ / αὐτοῦ
  choice: له / منه
  rationale: صياغة عربية موجزة تحافظ على المفرد العام من غير إدخال جمع أو تخصيص غير موجود في المصدر.
theological_decisions:
- issue: دلالة القول المثلي عن مَن له ومَن ليس له
  choice: أُبقي القول عامًا ومفارِقًا ضمن سياقه المتعلق بكيفية السماع والتلقي.
  alternative: تفسيره صراحةً على أنه عن سبق التعيين، أو الاستحقاق، أو الازدهار المادي، أو مبدأ عام في الوكالة.
  rationale: النص يقرر مبدأ مرتبطًا بالسماع من غير أن يحدد في هذه الآية وحدها ماهية ما يملكه المرء أو يُعطاه؛ لذلك لا تُفرض عليه منظومة لاهوتية أو تطبيق مخصوص.
- issue: المفعول المحذوف في δοθήσεται αὐτῷ
  choice: «سيُعطى» من دون إضافة مفعول.
  alternative: «سيُعطى المزيد».
  rationale: اليونانية لا تذكر «المزيد»، والعربية تسمح بالمبني للمجهول من غير مفعول صريح؛ فالإبقاء على الحذف يصون الانفتاح الدلالي للنص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «فانتبهوا إذن» لربط التحذير بما قبله، وحوفظ على الإيجاز والمفارقة وعلى المبني للمجهول في عبارتي العطاء والانتزاع.
