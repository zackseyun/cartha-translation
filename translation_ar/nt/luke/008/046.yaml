  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: ar
  text: 'لكن يسوع قال: «قد لمسني أحد، لأني عرفت أن قوةً قد خرجت مني».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: قد لمسني أحد
  rationale: ينقل الفعل في الماضي مع دلالة وقوع الحدث، ويحافظ على عدم تعيين الشخص في τις.
- source_word: ἔγνων
  choice: عرفت
  rationale: المعنى المباشر هو العلم أو المعرفة؛ وهذا يحافظ على صياغة المصدر من غير تحويلها إلى مجرد إحساس أو إدراك حسي.
- source_word: δύναμιν
  choice: قوةً
  rationale: المقابل العربي الطبيعي لـ δύναμις في هذا السياق، من غير إضافة تفسير لطبيعة القوة.
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: قد خرجت مني
  rationale: يحافظ على صورة خروج القوة من يسوع وعلى دلالة الفعل التام في أن الخروج قد وقع.
theological_decisions:
- issue: طبيعة معرفة يسوع بخروج القوة
  choice: «عرفت»
  alternative: «أدركت» أو «شعرت»
  rationale: اختيار «عرفت» يطابق ἔγνων ولا يفرض أن المعرفة كانت إحساسًا جسديًا أو حدسًا، فيبقي النص على توتره اللاهوتي الطبيعي.
- issue: وصف القوة الخارجة
  choice: الإبقاء على «قوة» بلا توصيف
  alternative: «قوة شفاء»
  rationale: النص اليوناني لا يضيف «شفاء»، ولذلك لا ينبغي إدخال تفسير صحيح سياقيًا في صلب الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدمت «لكن» لربط الاستدراك بالسياق السابق، و«قد» لإبراز وقوع اللمس وخروج القوة دون إثقال العبارة.
