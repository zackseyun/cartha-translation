source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: ar
  text: 'فتقدَّموا وأيقظوه قائلين: «يا سيّد، يا سيّد، إننا نهلك!» فاستيقظ وانتهر الريح وهيجان الماء[a]، فسكنَا، وحلَّ هدوءٌ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأمواج المتلاطمة».'
    reason: بديل معجمي محتمل لعبارة κλύδωνι τοῦ ὕδατος، التي قد تشير إلى هيجان الماء أو أمواجه المتدفقة.
lexical_decisions:
- source_word: προσελθόντες
  choice: فتقدَّموا
  rationale: ينقل حركة التلاميذ نحو يسوع بوصفها فعلًا مصاحبًا سبق إيقاظه، بصياغة عربية طبيعية.
- source_word: διήγειραν
  choice: أيقظوه
  rationale: المعنى المباشر للفعل المتعدي هنا هو إيقاظ النائم.
- source_word: Ἐπιστάτα
  choice: يا سيّد
  rationale: لقب لوقاوي يدل على الاعتراف بالسلطة؛ و«سيّد» واضح ومحترم ولا يحصر المعنى في التعليم وحده.
- source_word: ἀπολλύμεθα
  choice: إننا نهلك
  rationale: يحفظ صيغة الحاضر وخطر الموت الوشيك، مع إبقاء التعبير المألوف كتابيًا وعربيًا.
- source_word: διεγερθεὶς
  choice: فنهض
  rationale: ينقل استيقاظه وقيامه إلى الفعل بصياغة عربية موجزة وطبيعية، من غير تقرير ما إذا كان الاستيقاظ ذاتيًا أو بسببهم على نحو يتجاوز السياق.
- source_word: ἐπετίμησεν
  choice: انتهر
  rationale: يحفظ قوة الأمر السلطاني الموجَّه إلى الريح والماء، ويتسق مع الاستعمال الإنجيلي للفعل.
- source_word: ἀνέμῳ
  choice: الريح
  rationale: المقابل المباشر من غير إضافة وصف غير موجود في النص.
- source_word: κλύδωνι τοῦ ὕδατος
  choice: هيجان الماء
  rationale: يحفظ صورة اضطراب الماء واندفاعه، ولا يختزلها تفسيرًا في الأمواج وحدها.
- source_word: ἐπαύσαντο
  choice: فسكنَا
  rationale: صيغة التثنية العربية تُظهر أن المرجع هو الريح وهيجان الماء معًا، وتحفظ دلالة الجمع اليوناني طبيعيًا.
- source_word: ἐγένετο γαλήνη
  choice: وحلَّ هدوء
  rationale: تعبير عربي طبيعي ينقل نشوء حالة السكون بعد توقف الريح وهيجان الماء.
theological_decisions:
- issue: لقب يسوع Ἐπιστάτα
  choice: يا سيّد
  alternative: يا معلّم
  rationale: «يا سيّد» يحفظ دلالة السلطة والاحترام في اللقب اللوقاوي، من غير قصرها على وظيفة التعليم أو إدخال لقب كنسي مخصوص.
- issue: سلطة يسوع على الخليقة في ἐπετίμησεν
  choice: انتهر
  alternative: أمر
  rationale: «انتهر» يبقي القوة الشخصية والسلطانية للفعل كما يرد في الأناجيل، من غير إضافة تفسير عقائدي إلى الحدث.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ تكرار النداء، وتسلسل الأفعال، والجمع الدال على توقف الريح وهيجان الماء، مع تجنب التفسير العقائدي الزائد.
