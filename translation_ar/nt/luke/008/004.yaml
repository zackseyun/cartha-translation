lexical_decisions:
- source_word: Συνιόντος
  choice: كان ... يجتمع
  rationale: يحافظ على دلالة الحدث الجاري في التركيب المطلق بالمضاف إليه، ويعبّر طبيعيًا عن توافد الناس واجتماعهم.
- source_word: δὲ
  choice: وبينما
  rationale: تؤدي وظيفة الانتقال السردي من غير افتراض تضاد، وتنسجم مع الظرف المصاحب الذي ينشئه التركيب المطلق.
- source_word: ὄχλου πολλοῦ
  choice: جمع كبير
  rationale: ينقل معنى كثرة الجمع بلغة عربية معاصرة واضحة من غير مبالغة أسلوبية.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: كان الناس يأتون ... من مدينة تلو الأخرى
  rationale: تُظهر «من مدينة تلو الأخرى» القوة التوزيعية لعبارة κατὰ πόλιν، بينما يعبّر الفعل عن مجيئهم المتواصل.
- source_word: πρὸς αὐτόν
  choice: إليه
  rationale: ترجمة عربية موجزة وطبيعية للحركة في اتجاه يسوع.
- source_word: εἶπεν
  choice: قال
  rationale: المقابل السردي المباشر والطبيعي للفعل، ويتلاءم مع العبارة التالية.
- source_word: διὰ παραβολῆς
  choice: بمثل
  rationale: تحافظ الباء على إمكان فهم διά على أنها تفيد الوسيلة، مع بقاء احتمال دلالتها على الكيفية مذكورًا في الحاشية.
