id: LUK.8.47
reference: Luke 8:47
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: ar
  text: فلما رأت المرأة أنها لم تَبْقَ خافيةً[a]، جاءت وهي ترتجف، وخرّت أمامه[b]، وأخبرت أمام الشعب كله لماذا لمسته، وكيف شُفيت في الحال.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن أمرها لم يَخْفَ» أو «أنها لم تفلت من الانتباه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ووقعت أمامه». وقد يُفهم أنها خرّت عند قدميه، لكن اليونانية تقول حرفيًا «خرّت أمامه» من غير ذكر القدمين صراحةً.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: فلما رأت
  rationale: ينقل اسم الفاعل الأوريستي بوصفه ظرفًا زمنيًا يمهّد للأفعال الرئيسة، بصياغة عربية طبيعية.
- source_word: οὐκ ἔλαθεν
  choice: لم تَبْقَ خافيةً
  rationale: ينقل معنى عدم الإفلات من الانتباه أو عدم البقاء في الخفاء، والمقصود أن فعلها لم يظل مستورًا.
- source_word: τρέμουσα
  choice: وهي ترتجف
  rationale: يحفظ الوصف الحسي والانفعالي الحي من غير اختزاله في الخوف وحده.
- source_word: προσπεσοῦσα αὐτῷ
  choice: وخرّت أمامه
  rationale: يعبر عن السقوط أمامه في تضرع أو مهابة، من غير إضافة «عند قدميه» غير المذكورة صراحة في اليونانية.
- source_word: δι’ ἣν αἰτίαν
  choice: لماذا
  rationale: صياغة عربية موجزة وطبيعية تؤدي معنى السبب الذي من أجله لمسته.
- source_word: ἥψατο αὐτοῦ
  choice: لمسته
  rationale: الفعل مع المضاف إليه يفيد اللمس هنا، والسياق العربي يوضح أن اللمس سبق الإخبار.
- source_word: ἀπήγγειλεν
  choice: أخبرت
  rationale: ينقل معنى التقرير أو الإخبار العلني بوضوح، بلا رفع للنبرة إلى اعتراف ديني غير مصرح به.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: أمام الشعب كله
  rationale: ترجمة مباشرة وواضحة للحضور العلني أمام جميع المجتمعين.
- source_word: ὡς ἰάθη
  choice: كيف شُفيت
  rationale: يحفظ ὡς بوصفها مقدمة لبيان كيفية الشفاء أو واقعه من غير حسم زائد.
- source_word: παραχρῆμα
  choice: في الحال
  rationale: تعبير عربي فصيح ومألوف يدل على وقوع الشفاء فورًا.
theological_decisions:
- issue: طبيعة إخبار المرأة العلني وسجودها الجسدي
  choice: 'وصف الموقف كما يورده النص: خرّت أمامه وأخبرت علنًا بسبب لمسها وكيف شُفيت.'
  alternative: تفسير الفعل صراحةً على أنه توبة أو عبادة، أو إضافة أنها خرّت عند قدميه.
  rationale: النص يصف الارتجاف والخرور والإخبار، وقد توحي الهيئة بالمهابة أو التضرع، لكنه لا يصرح هنا بتوبة أو عبادة، ولا يذكر القدمين صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «خرّت» لدقته السردية وشيوعه الكتابي المقبول، مع تجنب ألفاظ تفسيرية مثل «سجدت» التي قد تحسم دلالة لاهوتية لا يصرح بها النص.
