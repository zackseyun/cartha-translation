  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: ar
  text: وجاءت إليه أمه وإخوته، ولم يستطيعوا الوصول إليه[a] بسبب الحشد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الالتقاء به» أو «النفاذ إليه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρεγένετο δὲ πρὸς αὐτὸν
  choice: وجاءت إليه
  rationale: ينقل مجيء الأسرة إليه مع انتقال سردي طبيعي؛ وصيغة المؤنث المفرد جائزة لأن الفاعل المركب يبدأ بـ«أمه» ويتقدم عليه الفعل.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: أمه وإخوته
  rationale: صياغة عربية طبيعية تحفظ لفظ القرابة الصريح ἀδελφοί من غير توسيعه إلى «أقربائه» أو حسم طبيعة العلاقة بأكثر مما يقوله النص.
- source_word: οὐκ ἠδύναντο
  choice: لم يستطيعوا
  rationale: ينقل بوضوح معنى العجز في صيغة الماضي.
- source_word: συντυχεῖν αὐτῷ
  choice: الوصول إليه
  rationale: يلائم عائق الجموع، ويحفظ في الحاشية احتمال معنى اللقاء به.
- source_word: διὰ τὸν ὄχλον
  choice: بسبب الجموع
  rationale: διά مع المنصوب سببية، و«بسبب» تعبير عربي واضح؛ واختيار «الجموع» يلائم صورة الحشد المحيط به.
theological_decisions:
- issue: هوية «إخوته» وطبيعة قرابتهم
  choice: إخوته
  alternative: أقرباؤه أو أنسباؤه
  rationale: النص اليوناني يقول ἀδελφοί، ومعناه المباشر «إخوة». لا يحدد العدد طبيعة العلاقة بأكثر من ذلك، ولذلك لا تحسم الترجمة الجدل بشأن كونهم إخوة أشقاء أو إخوة من أحد الوالدين أو ذوي قرابة أخرى.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. أُبقي «إخوته» في المتن بلا حاشية عقائدية مطولة، لأن اللفظ نفسه مباشر بينما تظل طبيعة القرابة غير محسومة في هذه الآية.
