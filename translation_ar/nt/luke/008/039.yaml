  terminology: استعمال «الله» و«يسوع» سليم ومتسق، واختيار «صنع» في الموضعين يحافظ على التوازي اللفظي. «ينادي» مناسب لـκηρύσσων هنا، إذ يدل على إعلان علني من غير تحميل اللفظ اصطلاحًا كنسيًا محددًا.
