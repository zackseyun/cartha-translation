  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: ar
  text: «ارجع إلى بيتك، وحدِّث بكل ما صنع الله لك». فانصرف وهو ينادي في المدينة كلها بكل ما صنع يسوع له.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: ارجع
  rationale: فعل أمر يدل على العودة إلى موضع سابق؛ و«ارجع» تعبير عربي مباشر وطبيعي.
- source_word: εἰς τὸν οἶκόν σου
  choice: إلى بيتك
  rationale: يحافظ على المعنى المكاني المباشر لـοἶκος مع دلالة الرجوع إلى المنزل.
- source_word: διηγοῦ
  choice: حدِّث
  rationale: يدل الفعل على رواية الأمر وبيانه؛ و«حدِّث» فصيحة وواضحة في سياق الأمر، من غير إثقال بلفظ تقني.
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: بكل ما صنع الله لك
  rationale: تنقل ὅσα بوصفها «كل ما» من غير إضافة صفة «عظيمة» غير مصرّح بها، وتحافظ على دلالة الإحسان في «لك».
- source_word: ἀπῆλθεν
  choice: فانصرف
  rationale: ينقل مغادرة الرجل للمشهد بإيجاز عربي طبيعي.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: في المدينة كلها
  rationale: ينقل المعنى التوزيعي، أي انتشار النداء في جميع أنحاء المدينة، بصياغة عربية سلسة.
- source_word: κηρύσσων
  choice: وهو ينادي
  rationale: يحفظ معنى الإعلان العلني القوي في κηρύσσω من غير أن يوحي حصراً بعظة دينية رسمية.
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: بكل ما صنع يسوع له
  rationale: يوازي العبارة السابقة عن الله ويحافظ على اختلاف الضمير بحسب منظور السرد.
theological_decisions:
- issue: الموازاة بين «الله» في أمر يسوع و«يسوع» في إعلان الرجل
  choice: 'الإبقاء على: «ما صنع الله لك» ثم «ما صنع يسوع له»'
  alternative: توحيد الاسمين في العبارتين أو إضافة تفسير يصرّح بالعلاقة بينهما
  rationale: النص يضع «الله» و«يسوع» في موازاة سردية مقصودة من غير شرح تحريري؛ لذلك تُحفظ القوة اللاهوتية والتوتر الدلالي من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. اختيرت «صنع» للمحافظة على التوازي اللفظي في الجملتين، و«ينادي» لإبراز الإعلان العلني. لا توجد حاشية، لأن الترجمة الأساسية تنقل ὅσα بدقة على صورة «كل ما» ولا تضيف «أمورًا عظيمة».
