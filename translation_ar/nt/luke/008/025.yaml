id: LUK.8.25
reference: Luke 8:25
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: ar
  text: 'ثم قال لهم: «أين إيمانكم[a]؟» فخافوا وتعجّبوا، وقال بعضهم لبعض: «فمَن هذا الذي يأمر حتى الرياح والماء فتطيعه؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثقتكم». ويمكن فهم سؤال يسوع أيضًا هكذا: «أين ثقتكم؟»'
    reason: بديل معجمي يبرز دلالة الثقة التي يحملها السياق.
lexical_decisions:
- source_word: Ποῦ
  choice: أين
  rationale: 'تحافظ على صيغة السؤال المباشرة في اليونانية، من غير تحويلها إلى تفسير مثل: لماذا لا إيمان لكم؟'
- source_word: πίστις
  choice: إيمانكم
  rationale: «الإيمان» هو المقابل العربي المألوف والأوسع دلالة، مع أن السياق يبرز معنى الثقة، ولذلك ذُكر البديل في الحاشية.
- source_word: φοβηθέντες
  choice: فخافوا
  rationale: ينقل الظرف المصاحب بصياغة عربية طبيعية، ويحفظ وقوع الخوف قبل التعجب في تسلسل السرد.
- source_word: ἐθαύμασαν
  choice: تعجّبوا
  rationale: يفيد الدهشة الممزوجة بالعجب، ويلائم الأسلوب السردي الفصيح الواضح.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: فمَن هذا
  rationale: الفاء تنقل القوة الاستنتاجية للأداة ἄρα بعد المعجزة، مع سؤال عربي طبيعي ومباشر.
- source_word: ἐπιτάσσει
  choice: يأمر
  rationale: مقابل مباشر لفعل إصدار الأمر، من غير استيراد معنى «ينتهر» من العدد السابق.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: الرياح والماء
  rationale: 'يحافظ على لفظ لوقا المحدد: الرياح بصيغة الجمع والماء بصيغة المفرد، بدل استبدال الماء بالأمواج أو البحر.'
- source_word: ὑπακούουσιν αὐτῷ
  choice: فتطيعه
  rationale: صياغة عربية موجزة وطبيعية تؤدي معنى امتثال عناصر الخليقة لأمره؛ جاء الفعل مفردًا مؤنثًا مراعاةً لغير العاقل.
theological_decisions:
- issue: دلالة πίστις بين الإيمان والثقة
  choice: إيمانكم
  alternative: ثقتكم
  rationale: يحفظ «الإيمان» المصطلح الأوسع والمألوف، بينما تبقى «الثقة» دلالة سياقية حقيقية لا ينبغي إغفالها، وقد أُثبتت في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت أفعال منسقة بدل محاكاة اسم الفاعل اليوناني على نحو ثقيل، مع الحفاظ على تسلسل الخوف ثم التعجب. وُضع مؤشر الحاشية مباشرة بعد اللفظة التي يشرحها.
