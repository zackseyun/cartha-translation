  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: ar
  text: 'فأجاب وقال لهم: «أمّي وإخوتي[a] هم الذين يسمعون كلمة الله ويعملون بها».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اليونانية تقول حرفيًا «إخوتي» بصيغة المذكر، وقد يمتد المقصود إلى الإخوة والأخوات.
    reason: lexical_alternative
  - marker: b
    text: 'ويمكن ترجمة العبارة مع إبراز اسم الإشارة: «أمّي وإخوتي، هؤلاء هم الذين يسمعون كلمة الله ويعملون بها».'
    reason: source_structure
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: فأجاب وقال لهم
  rationale: يحافظ على اقتران فعلي «أجاب» و«قال» في النص اليوناني، مع صياغة عربية واضحة ومألوفة.
- source_word: Μήτηρ μου καὶ ἀδελφοί μου
  choice: أمّي وإخوتي
  rationale: ترجمة مباشرة تحفظ المفرد «أمّي» وصيغة الجمع المذكر «إخوتي»، مع بيان احتمال الشمول في الحاشية.
- source_word: οὗτοί εἰσιν οἱ ... ἀκούοντες
  choice: هم الذين يسمعون
  rationale: صياغة عربية طبيعية تؤدي معنى التعيين والتوكيد في οὗτοί εἰσιν من غير تركيب متكلف مثل «هؤلاء هم الذين» بعد المبتدأ المذكور.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: كلمة الله
  rationale: يحفظ المقابل التقليدي والدلالة على ما يصدر عن الله من قول أو رسالة، من غير تضييقها إلى معنى تفسيري واحد.
- source_word: ἀκούοντες καὶ ποιοῦντες
  choice: يسمعون ... ويعملون بها
  rationale: يحافظ على توازي الفعلين وعلى دلالة الاستمرار الوصفية، وتأتي «بها» عربيةً طبيعية للدلالة على تطبيق الكلمة المسموعة.
theological_decisions:
- issue: نطاق الأسرة التي يعرّفها يسوع
  choice: تُبقي العبارة «أمّي وإخوتي» وتعرّفهم بأنهم الذين يسمعون كلمة الله ويعملون بها.
  alternative: صياغة الكلام كرفض صريح لأسرته الجسدية، أو حصره في الذكور وحدهم.
  rationale: يوسّع النص مفهوم القرابة ليشمل المستجيبين لكلمة الله، لكنه لا يصرّح برفض الأسرة الجسدية. كما أن صيغة المذكر في اليونانية لا تحسم أن التطبيق مقصور على الرجال.
- issue: العلاقة بين السماع والعمل
  choice: ويعملون بها
  alternative: ويطيعونها
  rationale: «يطيعونها» يصرّح بمفهوم الطاعة تفسيرًا، أما «يعملون بها» فيحفظ توتر النص بين تلقي الكلمة وتنفيذها من غير زيادة لاهوتية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت البنية الثنائية «أجاب وقال»، واستُعملت «هم الذين» لتجنب ثقل الترجمة الحرفية لاسم الإشارة مع إبقاء قوة التعيين.
