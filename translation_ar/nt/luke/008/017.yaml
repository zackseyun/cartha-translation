  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: ar
  text: لأنه ما من شيء خفيّ إلا سيصير ظاهرًا، ولا شيء مكتوم إلا سيُعرَف ويأتي إلى العلن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويظهر إلى العلن».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸν
  choice: خفيّ
  rationale: ينقل معنى ما هو مستور أو غير ظاهر، ويحافظ على المقابلة مع «ظاهرًا».
- source_word: φανερὸν
  choice: ظاهرًا
  rationale: يقابل «خفيّ» بوضوح، ويلائم معنى الانتقال إلى حالة الظهور.
- source_word: γενήσεται
  choice: سيصير
  rationale: يحفظ دلالة γίνομαι على التحول من حال الخفاء إلى حال الظهور.
- source_word: ἀπόκρυφον
  choice: مكتومٌ
  rationale: يميّزه قليلًا عن κρυπτόν مع إبقاء التوازي الدلالي بين شطري القول.
- source_word: οὐ μὴ γνωσθῇ
  choice: إلا سيُعرَف
  rationale: 'جاءت «إلا» بعد النفي العام لتؤدي معنى التركيب اليوناني المؤكد: لا شيء مكتوم سيبقى غير معروف.'
- source_word: εἰς φανερὸν ἔλθῃ
  choice: يظهر إلى العلن
  rationale: تعبير عربي واضح عن الانكشاف والخروج إلى المجال الظاهر، مع إبقاء صلة اللفظ بجذر φανερός.
- source_word: γάρ
  choice: لأنه
  rationale: يحفظ وظيفة γάρ التعليلية التي تربط القول بما قبله.
theological_decisions:
- issue: نطاق قول الانكشاف
  choice: صياغة مبدأ عام يفيد أن الخفي والمكتوم سيُكشفان
  alternative: قصر القول على الدينونة الأخيرة، أو على انكشاف تعليم يسوع في سياقه المباشر
  rationale: لا يحدد نص الآية نفسه زمن الانكشاف أو مجاله، لذلك تُبقي الترجمة عبارته العامة ولا تحسم أحد التطبيقات اللاهوتية المحتملة.
- issue: قوة النفي في οὐ μὴ γνωσθῇ
  choice: التعبير ببنية «ليس... إلا» التي تؤكد حتمية المعرفة
  alternative: ترجمة حرفية ملتبسة من قبيل «لن يُعرَف» داخل جملة موصولة منفية
  rationale: البنية اليونانية تؤكد أن المكتوم لن يبقى مجهولًا؛ والصياغة العربية المختارة تنقل هذه القوة من غير إضافة تفسير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حوفظ على التوازي بين «خفيّ/ظاهرًا» و«مكتوم/يُعرَف»، وعلى عموم القول دون تقييده بزمن أو تطبيق لاهوتي بعينه.
