  to: لأنه ما من شيء خفيّ إلا سيصير ظاهرًا، ولا شيء مكتوم إلا سيُعرَف ويأتي إلى العلن.[a]
  rationale: صُحِّح البناء النحوي في الشق الأول باستعمال «ما من ... إلا»، وهو بناء فصيح ينقل النفي العام والحتمية في الأصل من غير تغيير المعنى. واستُبدل «يظهر إلى العلن» في المتن بـ«يأتي إلى العلن» لسلاسته ومناسبته للتعبير اليوناني، مع إبقاء الصياغة السابقة بديلًا في الحاشية المربوطة بموضعها.
