  text: Then his disciples asked him what this parable meant[a].
translation:
  language: ar
  text: فسأله تلاميذه ما معنى هذا المثل.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكبر: «ما عسى أن يكون هذا المثل؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτων
  choice: سأله
  rationale: صيغة الماضي الناقص قد تدل على فعل مستمر أو متكرر، لكن الماضي البسيط هو الأسلس عربيًا في هذا السياق السردي.
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تصل السؤال بما سبقه في تسلسل السرد من غير أن توحي بتعارض قوي.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: تعبير عربي موجز ومألوف يحفظ معنى علاقة التعلّم والتبعية.
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: ما معنى هذا المثل
  rationale: ينقل المقصود من سؤال التلاميذ عن دلالة المثل بعبارة عربية طبيعية، مع إثبات الصياغة الأقرب إلى الحرفية في الحاشية.
- source_word: παραβολή
  choice: المثل
  rationale: المصطلح العربي الكتابي المألوف والدقيق لهذا النوع من التعليم القصصي أو التشبيهي.
- source_word: εἴη
  choice: معنى
  rationale: صيغة التمني في السؤال غير المباشر التابع لفعل ماضٍ تفيد هنا الاستفسار عن ماهية المثل أو دلالته؛ و«معنى» أوضح في العربية ضمن السياق.
