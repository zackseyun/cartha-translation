source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: ar
  text: 'فلما رأى يسوع، صرخ وخرَّ أمامه، وقال بصوت عالٍ: «ما لي ولك[a] يا يسوع، يا ابن الله العلي؟ أتوسل إليك ألّا تعذِّبني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما الذي بيني وبينك؟»'
    reason: بديل حرفي للتعبير اليوناني ذي الصبغة السامية «Τί ἐμοὶ καὶ σοί»، الذي يفيد هنا الاعتراض أو رفض التدخل.
lexical_decisions:
- source_word: ἰδὼν
  choice: فلما رأى
  rationale: اسم الفاعل الأوريستي يبيّن الظرف السابق للأفعال الرئيسة؛ و«فلما رأى» عربية طبيعية تحفظ التعاقب الزمني.
- source_word: ἀνακράξας
  choice: صرخ
  rationale: يدل الفعل على صيحة قوية، وتبقي «صرخ» هذا المعنى من غير دمجه في العبارة اللاحقة «بصوت عظيم».
- source_word: προσέπεσεν αὐτῷ
  choice: خرَّ أمامه
  rationale: يفيد السقوط أمام شخص في هيئة خضوع أو ضراعة، و«أمامه» أقرب إلى صيغة اليونانية من التحديد التفسيري «عند قدميه».
- source_word: φωνῇ μεγάλῃ
  choice: بصوت عظيم
  rationale: ترجمة مباشرة تحفظ الصورة التعبيرية ودرجة الشدة في الأصل، وهي صياغة عربية كتابية مفهومة.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: ما لي ولك
  rationale: تعبير سامي مستعمل عربيًا يدل على الاعتراض والتنصل من العلاقة أو التدخل، ويحفظ صورة الأصل وإيجازه مع إبقاء دلالته مفتوحة للسياق.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: يا ابن الله العلي
  rationale: تحفظ العبارة اللقب الكامل وصيغة النداء من دون إضافة تفسير عقائدي.
- source_word: δέομαί σου
  choice: أتوسل إليك
  rationale: ينقل الضراعة الملحّة بعبارة عربية طبيعية وكريمة.
- source_word: μή με βασανίσῃς
  choice: ألّا تعذِّبني
  rationale: ينقل βασανίζω معنى إيقاع العذاب الشديد، من غير حصره في التعذيب الجسدي.
theological_decisions:
- issue: إقرار الروح بهوية يسوع
  choice: يا يسوع، يا ابن الله العلي
  alternative: يا يسوع ابن الله الأعلى
  rationale: يحفظ النص اعتراف المتكلم الصريح بهوية يسوع كما ورد، من غير تخفيفه أو توسيعه إلى صيغة عقائدية لاحقة.
- issue: طبيعة العذاب المطلوب تجنبه
  choice: ألّا تعذِّبني
  alternative: ألّا تؤلمني
  rationale: «تعذِّبني» تحفظ القوة الروحية والقضائية المحتملة للفعل، ولا تحصر المعنى في ألم عام أو في تعذيب جسدي محدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. اختير «خرَّ» و«ما لي ولك» لأنهما موجزان ومفهومان ويحفظان الصياغة الكتابية دون غموض مفرط. وُضعت علامة الحاشية بعد الآية لأنها تشرح العبارة الاصطلاحية «ما لي ولك».
