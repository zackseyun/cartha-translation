  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: ar
  text: وأخبرهم الذين رأوا ما حدث كيف نجا الرجل الذي كان به شيطان[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كيف شُفي الرجل الذي كان به شيطان»، أو: «كيف أُنقذ». قد يعني الفعل اليوناني «ينجو/يُخلَّص» أو «يُشفى» أو «يُنقذ»، بحسب السياق.'
    reason: بديل معجمي يحفظ اتساع دلالة الفعل اليوناني σῴζω في سياق طرد الشياطين.
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: أخبرهم
  rationale: فعل ماضٍ يدل على نقل الخبر أو رواية ما وقع؛ و«أخبرهم» عربي طبيعي وواضح في سياق شهادة من عاينوا الحدث.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تتابع السرد، والواو تؤدي هذا المعنى من غير إضافة مقابلة أو تعارض غير موجودين في الأصل.
- source_word: αὐτοῖς
  choice: هم في «أخبرهم»
  rationale: ضمير الداتيف يحدد متلقي الخبر، وقد أُدمج طبيعيًا في الفعل العربي.
- source_word: οἱ ἰδόντες
  choice: الذين رأوا ما حدث
  rationale: التركيب الاسمي بالمشاركة يدل على شهود الواقعة. وإضافة «ما حدث» توضح المفعول المفهوم من السياق من غير حصره في جانب واحد.
- source_word: πῶς
  choice: كيف
  rationale: تحفظ دلالة كيفية ما جرى، مع احتمال أن تقدم مضمون الخبر أيضًا.
- source_word: ἐσώθη
  choice: خَلَصَ
  rationale: يحفظ اتساع دلالة σῴζω، التي قد تشمل الخلاص والشفاء والإنقاذ. وصيغة «خَلَصَ» العربية مناسبة هنا لأنها لا تحصر المعنى في الخلاص الروحي وحده، مع بيان البدائل في الحاشية.
- source_word: ὁ δαιμονισθείς
  choice: الرجل الذي كانت تسكنه الشياطين
  rationale: صياغة عربية واضحة تنقل كون الرجل واقعًا تحت سكنى الأرواح الشريرة، وتحافظ على الإشارة الشخصية المذكرة من غير استعمال تعبير اصطلاحي غامض أو جارح.
theological_decisions:
- issue: دلالة ἐσώθη في سياق طرد الشياطين والشفاء
  choice: خَلَصَ
  alternative: شُفي؛ أو أُنقذ
  rationale: يمكن أن يدل الفعل اليوناني على الخلاص أو الإنقاذ أو الشفاء. يحافظ المتن على سعته الدلالية، بينما تعرض الحاشية البدائل المناسبة للسياق، فلا يُختزل المعنى في شفاء جسدي محض ولا في خلاص روحي محض.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُعمل «كانت تسكنه الشياطين» بدل مصطلح معرَّب أو وصف اسمي ثقيل، واستُبقيت مرونة الفعل اليوناني في المتن والحاشية.
