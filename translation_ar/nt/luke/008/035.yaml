  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: ar
  text: فخرجوا ليروا ما حدث، وجاؤوا إلى يسوع، فوجدوا الرجل الذي خرجت منه الشياطين[b] جالسًا، لابسًا ثيابًا وسليم العقل[a]، عند قدمي يسوع، فخافوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «واعيًا متزنًا».'
    reason: lexical_alternative
  - marker: b
    text: 'تقرأ بعض المخطوطات الفعل بصيغة الجمع، أي: «خرجت الشياطين». أما النص المطبوع ففيه فعل مفرد مع فاعل جمع محايد في اليونانية، والمعنى لا يتغير. ولا يظهر الفرق في العربية لأن جمع غير العاقل يعامل معاملة المفرد المؤنث.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξῆλθον
  choice: خرجوا
  rationale: ينقل فعل الحركة إلى خارج البلدة أو المنطقة في سياق سردي طبيعي.
- source_word: τὸ γεγονός
  choice: ما حدث
  rationale: ترجمة واضحة لاسم الفاعل التام المستعمل استعمال الاسم، وتشير إلى الواقعة التي تمت.
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: الذي خرجت منه الشياطين
  rationale: يحافظ على تعريف الرجل بما جرى له، وعلى الدلالة الشخصية الخارقة للطبيعة في لفظ δαιμόνια.
- source_word: ἱματισμένον
  choice: مرتديًا ثيابه
  rationale: تعبير عربي طبيعي يبرز حالته الجديدة في مقابل عريه السابق في السياق.
- source_word: σωφρονοῦντα
  choice: سليم العقل
  rationale: ينقل معنى استعادة سلامة التفكير والاتزان دون إدخال تصنيف سريري حديث.
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: عند قدمي يسوع
  rationale: ينقل موضع الرجل بجوار قدمي يسوع بصياغة عربية مألوفة، من غير تحميل العبارة دلالة تفسيرية زائدة.
- source_word: ἐφοβήθησαν
  choice: فخافوا
  rationale: ينقل رد فعل الجماعة مباشرة، مع إبراز تتابع الحدث بالفاء.
theological_decisions:
- issue: دلالة δαιμόνια في سياق إخراج الأرواح
  choice: الشياطين
  alternative: الأرواح الشريرة
  rationale: «الشياطين» هي المقابل المباشر وتحفظ تصوير النص لكائنات شخصية خارقة للطبيعة، من غير اختزال الحدث في مرض أو استعارة.
- issue: دلالة σωφρονοῦντα بعد خروج الشياطين
  choice: سليم العقل
  alternative: واعيًا متزنًا
  rationale: تحفظ العبارة معنى سلامة الذهن وضبط النفس واستعادة الاتزان، بلا مبالغة أو مصطلحات طبية مستحدثة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. رُتبت أوصاف الرجل بما يلائم العربية مع الحفاظ على جميع عناصر النص اليوناني، ووُضع كل هامش عند اللفظ الذي يخصه.
