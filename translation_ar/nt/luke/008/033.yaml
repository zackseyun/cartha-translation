base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: ar
  text: فخرجت الشياطين من الرجل ودخلت في الخنازير، فاندفع القطيع هابطًا على السفح الشديد الانحدار[a] إلى البحيرة وغرق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «من على الجرف» أو «فوق حافة الهاوية»؛ يدل اللفظ اليوناني على انحدار شديد، وقد يفيد الهبوط عليه أو الاندفاع من فوق حافته.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα
  choice: فخرجت
  rationale: اسم الفاعل الأوريستي يسبق الفعل الرئيس ويدل على تعاقب الحدثين؛ وصيغة الفعل المعطوفة طبيعية في العربية وتحفظ هذا التعاقب.
- source_word: τὰ δαιμόνια
  choice: الشياطين
  rationale: اللفظ اليوناني يعني الشياطين تحديدًا، فلا يُستبدل به التعبير الأوسع «الأرواح النجسة».
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: من الرجل
  rationale: يشير الاسم المفرد في السياق إلى الرجل المذكور سابقًا، وحرف الجر مع فعل الخروج يبيّن مفارقة الشياطين له.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: دخلت في الخنازير
  rationale: تعبير عربي واضح يحفظ معنى الحركة إلى داخل الحيوانات.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: فاندفع القطيع
  rationale: الفعل يفيد حركة مفاجئة وقوية، و«القطيع» هو المقابل الطبيعي لاسم الجماعة.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: هابطًا على السفح الشديد الانحدار
  rationale: يحفظ اتجاه الحركة إلى أسفل والطبيعة الشديدة الانحدار للمكان، من غير الجزم بأنه جرف عمودي.
- source_word: εἰς τὴν λίμνην
  choice: إلى البحيرة
  rationale: λίμνη تعني «بحيرة»، ويحسن إبقاء تمييز لوقا اللفظي بينها وبين «البحر».
- source_word: ἀπεπνίγη
  choice: وغرق
  rationale: في سياق اندفاع القطيع إلى الماء يدل الفعل على الغرق؛ والصيغة العربية اللازمة طبيعية، والمفرد يوافق «القطيع» بوصفه اسم جمع.
theological_decisions:
- issue: تعيين مدلول δαιμόνια في رواية إخراج الشياطين
  choice: الشياطين
  alternative: الأرواح النجسة
  rationale: يحفظ الاختيار لفظ الآية نفسه ولا يستبدل به وصفًا قريب المعنى يرد في مواضع أخرى.
- issue: درجة التحديد الطبوغرافي في κρημνός
  choice: السفح الشديد الانحدار
  alternative: الجرف أو الهاوية
  rationale: اللفظ يدل على موضع شديد الانحدار، لكنه لا يحسم وحده أنه جرف عمودي؛ لذلك تُحفظ سعة الدلالة ويُذكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. وُضع رمز الحاشية بعد العبارة التي يشرحها، أي الوصف الطبوغرافي، لا بعد «الخنازير».
