  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: ar
  text: وَوَقَعَ بَذْرٌ آخَرُ بَيْنَ الشَّوْكِ[a]، فَنَمَا الشَّوْكُ مَعَهُ وَخَنَقَهُ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في وسط الشوك».'
