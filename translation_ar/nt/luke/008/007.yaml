  - marker: b
    text: 'ويجوز وصل العبارة هكذا: «فخنقه الشوكُ الذي نما معه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: بَذْرٌ آخَرُ
  rationale: الصفة المحايدة المفردة مستعملة استعمال الاسم، ومرجعها المفهوم من سياق المثل هو البذر؛ لذلك صُرِّح به للوضوح في العربية.
- source_word: ἔπεσεν
  choice: وَقَعَ
  rationale: ينقل الفعل الماضي البسيط وحركة سقوط البذر بصياغة عربية طبيعية.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: بينَ الشَّوْكِ
  rationale: 'تعبير عربي طبيعي يحفظ المعنى المكاني: في وسط نباتات الشوك.'
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: الشَّوْك
  rationale: اسم جنس عربي واضح يحافظ على الصورة الزراعية وعلى تكرار اللفظ اليوناني.
- source_word: συμφυεῖσαι
  choice: نما الشَّوْكُ معه
  rationale: ينقل معنى نمو الشوك مع البذر وفي الوقت نفسه، دون إضافة تفسير لآلية المنافسة.
- source_word: ἀπέπνιξαν
  choice: خَنَقَهُ
  rationale: يحفظ الصورة المجازية القوية للفعل، أي منع النبات من مواصلة نموه كما ينبغي.
- source_word: αὐτό
  choice: ـهُ
  rationale: الضمير المفرد يعود إلى البذر المذكور صراحة في أول الجملة.
