  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: ar
  text: والذين على جانب الطريق هم الذين سمعوا؛ ثم يأتي إبليس وينزع الكلمة[a] من قلوبهم، لئلا يؤمنوا فيخلصوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الكلمة» هنا هي رسالة الله المعلنة في المثل.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: على جانب الطريق
  rationale: ينقل المعنى المكاني لحرف الجر مع المفعول به ويحفظ صورة البذار الواقع بمحاذاة الطريق، بصياغة عربية واضحة وطبيعية.
- source_word: ἀκούσαντες
  choice: سمعوا
  rationale: اسم الفاعل الماضي يدل على الذين سبق لهم سماع الرسالة، ويؤديه الماضي العربي بإيجاز ووضوح.
- source_word: εἶτα
  choice: ثم
  rationale: تدل على تعاقب الحدث التالي، و«ثم» هي المقابل العربي الطبيعي هنا.
- source_word: ὁ διάβολος
  choice: إبليس
  rationale: يشير السياق إلى الكائن الشرير الشخصي؛ و«إبليس» تسمية عربية كتابية واضحة وشائعة.
- source_word: αἴρει
  choice: ينزع
  rationale: يفيد الفعل إزالة الكلمة وأخذها، و«ينزع» يحافظ على قوة الصورة من غير أن يضيف كيفية عنيفة غير مصرّح بها.
- source_word: τὸν λόγον
  choice: الكلمة
  rationale: تحفظ العبارة الكتابية، ويبيّن سياق المثل أن المقصود رسالة الله المعلنة.
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: من قلوبهم
  rationale: يحافظ على الجمع في الضمير وعلى الاستعمال الكتابي للقلب بوصفه مركز الإدراك والإرادة والاستجابة.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: لئلا يؤمنوا فيخلصوا
  rationale: تنقل «لئلا» غرض فعل إبليس، وتؤدي البنية العربية تعاقب الإيمان والخلاص من غير شرح سببي أو مذهبي زائد.
- source_word: πιστεύσαντες
  choice: يؤمنوا
  rationale: المقابل المباشر والطبيعي للفعل، ويحفظ لغة الإيمان دون تضييقها على التصديق الذهني وحده.
- source_word: σωθῶσιν
  choice: يخلصوا
  rationale: ينقل المعنى الخلاصي الكامل في سياق لوقا، لا مجرد النجاة الزمنية.
theological_decisions:
- issue: العلاقة بين الإيمان والخلاص
  choice: لئلا يؤمنوا فيخلصوا
  alternative: كيلا يؤمنوا فينالوا الخلاص
  rationale: تحفظ الصياغة تقرير النص أن نزع الكلمة يهدف إلى منع الإيمان والخلاص، من غير فرض تفسير مذهبي لكيفية العلاقة السببية بينهما.
- issue: دلالة ἵνα μή بين الغرض والنتيجة
  choice: لئلا
  alternative: فلا يؤمنوا ولا يخلصوا
  rationale: «لئلا» تحفظ بوضوح دلالة الغرض المقصود من مجيء إبليس ونزعه الكلمة، مع إبقاء ما قد ينطوي عليه التركيب من نتيجة تابعة لذلك الغرض.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «على جانب الطريق» للمشهد المكاني، و«ينزع» لفعل الإزالة، مع الحفاظ على المصطلحات الكتابية «الكلمة» و«القلوب» و«يؤمنوا فيخلصوا». وُضع مؤشر الحاشية [a] بعد الجملة التي ترد فيها «الكلمة» لأنه يشرح معناها في سياق الآية.
