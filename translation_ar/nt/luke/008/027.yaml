source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: ar
  text: ولمّا خرج إلى البرّ[a]، لقيه رجل من المدينة كان به شياطين[b]. ولم يلبس ثوبًا منذ زمن طويل، ولم يكن يقيم في بيت، بل بين القبور.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نزل إلى البرّ».'
    reason: بديل أسلوبي يوضح أن المقصود نزوله من القارب إلى البر من غير إضافة تفاصيل غير مذكورة في اليونانية.
  - marker: b
    text: 'أو بتعبير أكثر اصطلاحية: «كان ممسوسًا بالشياطين». واليونانية تعني حرفيًا: «كان به شياطين».'
    reason: إظهار البديل الاصطلاحي مع الحفاظ في المتن على الصياغة الأقرب إلى الأصل.
lexical_decisions:
- source_word: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν
  choice: ولمّا خرج إلى البرّ
  rationale: صيغت العبارة بوصفها جملة زمنية متعلقة بيسوع. و«إلى البرّ» تنقل معنى الانتقال من القارب إلى اليابسة من غير تخصيص زائد للشاطئ.
- source_word: ὑπήντησεν
  choice: لقيه
  rationale: فعل سردي مباشر يفيد اللقاء، و«لقيه» عربي طبيعي موجز.
- source_word: ἀνήρ τις
  choice: رجل
  rationale: «رجل» تنقل دلالة ἀνήρ الجنسية، والتنكير في العربية يؤدي وظيفة τις هنا من غير الحاجة إلى التعبير المتكلف «رجل ما».
- source_word: ἐκ τῆς πόλεως
  choice: من المدينة
  rationale: تحافظ على دلالة المنشأ أو الانتساب التي تفيدها العبارة اليونانية.
- source_word: ἔχων δαιμόνια
  choice: كان به شياطين
  rationale: تحافظ على صورة «وجود شياطين به» من غير أن تفرض في المتن مصطلح «ممسوس» أو «ممسوك» الأكثر تفسيرًا.
- source_word: χρόνῳ ἱκανῷ
  choice: منذ زمن طويل
  rationale: تنقل امتداد المدة بعبارة عربية واضحة وطبيعية في سياق وصف حالة مستمرة.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: لم يكن يرتدي ثوبًا
  rationale: تعبر عن عدم ارتداء لباس طوال المدة المذكورة، وتحافظ على مفرد ἱμάτιον بصيغة «ثوبًا».
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: لم يكن يقيم في بيت
  rationale: «يقيم» تنقل معنى μένω المستمر أو الاعتيادي من غير الجزم بأنه سكن دائم.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: بل بين القبور
  rationale: «بين القبور» تعبير عربي طبيعي يصور موضع إقامته وسط أماكن الدفن، مع إبقاء صيغة الجمع.
theological_decisions:
- issue: ترجمة δαιμόνια في سياق تسلط الأرواح الشريرة
  choice: شياطين
  alternative: أرواح نجسة
  rationale: اللفظ اليوناني هنا هو δαιμόνια تحديدًا، لا πνεύματα ἀκάθαρτα؛ لذلك تحافظ «شياطين» على التمييز المعجمي في النص.
- issue: مدى تفسير العبارة ἔχων δαιμόνια
  choice: كان به شياطين
  alternative: كان ممسوسًا بالشياطين
  rationale: النص يقول حرفيًا إنه كان «به شياطين». أبقت الصياغة هذا الوصف ولم تحسم في المتن طبيعة التسلط بمصطلح اصطلاحي أشد تفسيرًا، مع ذكر البديل في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة من غير تقعر. استُخدمت «ولمّا» للسرد الزمني، و«بل» للمقابلة الصريحة، مع تجنب المصطلحات الطائفية أو الحسم التفسيري الزائد.
