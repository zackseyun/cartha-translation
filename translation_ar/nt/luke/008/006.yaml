  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: ar
  text: وَوَقَعَ بَعْضٌ آخَرُ عَلَى الصَّخْرَةِ، فَلَمَّا نَبَتَ يَبِسَ لِأَنَّهُ لَمْ تَكُنْ لَهُ رُطُوبَةٌ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: بَعْضُهُ الآخَرُ
  rationale: الصفة المحايدة المفردة مستعملة استعمال الاسم، والمقصود جزء آخر من البذار المذكور في سياق المثل؛ وهذه الصياغة طبيعية بالعربية وتحفظ تسلسل الحالات.
- source_word: κατέπεσεν
  choice: وَقَعَ
  rationale: ينقل وقوع البذار على الموضع بوضوح، من غير إضافة توكيد لا يقتضيه السياق.
- source_word: ἐπὶ τὴν πέτραν
  choice: عَلَى الصَّخْرَةِ
  rationale: يحفظ الاسم اليوناني المفرد وصورته المحسوسة، بدل توسيع المعنى إلى «أرض صخرية».
- source_word: φυὲν
  choice: فَلَمَّا نَبَتَ
  rationale: ينقل اسم الفاعل الأوريستي بمعنى زمني سابق للفعل الرئيس، ويوافق صورة البذار في عربية طبيعية.
- source_word: ἐξηράνθη
  choice: يَبِسَ
  rationale: فعل عربي واضح ملائم للنبات، وينقل معنى الجفاف والذبول في هذا السياق.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: لِأَنَّهُ لَمْ تَكُنْ لَهُ
  rationale: يحفظ الدلالة السببية للتركيب اليوناني ذي المصدر المؤول بصياغة عربية واضحة.
- source_word: ἰκμάδα
  choice: رُطُوبَةٌ
  rationale: لفظ مفهوم ودقيق للرطوبة اللازمة للنمو، من غير تخصيص المعنى إلى العصارة.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. أُبقيت «الصخرة» مفردة كما في اليونانية، ولم تُستبدل بها عبارة «أرض صخرية». لا حاجة إلى حاشية لأن المقابل العربي يحفظ هذه الدقة مباشرة.
