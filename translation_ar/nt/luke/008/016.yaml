id: LUK.8.16
reference: Luke 8:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: ar
  text: ولا أحد يوقد مصباحًا ثم يغطيه بإناء أو يضعه تحت سرير، بل يضعه على منارة، لكي يرى الداخلون النور.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: مصباحًا
  rationale: يدل اللفظ على سراج أو مصباح صغير يُوقَد؛ و«مصباح» لفظ عربي واضح ومعاصر يحفظ صورة النص.
- source_word: σκεύει
  choice: بإناء
  rationale: اللفظ عام لوعاء أو أداة، لكن سياق التغطية يرجّح «إناء» دون تقييده بنوع مخصوص.
- source_word: κλίνης
  choice: سرير
  rationale: المعنى هنا موضع النوم أو الاضطجاع، و«سرير» هو المقابل الطبيعي الواضح.
- source_word: λυχνίας
  choice: منارة
  rationale: المقصود حامل المصباح الذي يُرفع عليه ليضيء؛ و«منارة» هي التسمية الكتابية العربية المألوفة لهذا الحامل، لا برجًا.
- source_word: οἱ εἰσπορευόμενοι
  choice: الداخلون
  rationale: اسم فاعل جمع يفيد الذين يدخلون، وقد صيغ بإيجاز طبيعي يحفظ عموم العبارة.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى واضحة وكريمة، تحافظ على صورة المصباح وتسلسل الأفعال والغرض المعبَّر عنه بـ«لكي». تُرجمت δὲ بواو الربط «ولا» في سياق القول، من غير إدخال ظرف زمني مثل «الآن» لا أصل صريحًا له.
