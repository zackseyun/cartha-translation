revisions:
- from: وطلب منه كلُّ جمهور المنطقة المحيطة ببلاد الجراسيين أن يرحل عنهم، لأن خوفًا شديدًا استولى عليهم[a]. أما هو فركب قاربًا ورجع.
  to: وطلب منه جميعُ جمهورِ المنطقة المحيطة ببلاد الجراسيين أن يرحل عنهم، لأن خوفًا شديدًا استولى عليهم[a]. أما هو فركب قاربًا ورجع.
  rationale: يقتصر التعديل على إصلاح صياغة أداة الشمول مع الاسم الجماعي، من «كلُّ جمهور» إلى «جميعُ جمهور»، لتكون العبارة عربية طبيعية وتحافظ بدقة على قوة ἅπαν τὸ πλῆθος. وبقيت الإحالة إلى الخوف والاسم الجغرافي ومرساة الحاشية كما هي.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: طلب الجمع من يسوع أن يبتعد، وسبب ذلك خوف شديد أحاط بهم، ثم ركب قاربًا ورجع. لكن تركيب «كلُّ جمهور» غير سليم/غير طبيعي في العربية؛ فـ«كل» هنا تحتاج إلى تركيب يعبّر بوضوح عن الشمول الجماعي.'
  naturalness: «كلُّ جمهور المنطقة» ثقيل وغير مألوف في الفصحى الحديثة، وقد يُفهم على أنه «كل جمهورٍ» لا «الجمهور كله». ويُستحسن «جميعُ جمهور المنطقة» مع بقاء الدلالة على الحشد الجماعي.
  terminology: «الجراسيين» يحافظ على قراءة Γερασηνῶν، و«يرحل عنهم» و«استولى عليهم خوف شديد» مناسبان. لا يلزم تفسير طبيعة الخوف. التعديل المقترح لا يغيّر المصطلحات أو المعنى.
