    rationale: التركيب لا يعبّر بسلاسة عن ἅπαν τὸ πλῆθος («الجمهور كله/جميع الجمهور») وقد يُشعر بالتوزيع على جماهير متعددة. «جميعُ جمهورِ المنطقة» أوضح وأفصح.
