source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: ar
  text: وطلب منه جميعُ جمهورِ المنطقة المحيطة ببلاد الجراسيين أن يرحل عنهم، لأن خوفًا شديدًا استولى عليهم[a]. أما هو فركب قاربًا ورجع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنهم كانوا مأخوذين بخوف شديد».'
    reason: بديل لفظي يعكس معنى συνείχοντο بوصفهم واقعين تحت قبضة الخوف.
lexical_decisions:
- source_word: ἠρώτησεν
  choice: طلب منه
  rationale: الفعل هنا يفيد الطلب، وتعبير «طلب منه أن» عربي طبيعي ينقل مضمون الالتماس من غير مبالغة في شدته.
- source_word: ἅπαν τὸ πλῆθος
  choice: كل جمهور
  rationale: يحافظ على الدلالة الجماعية وعلى قوة الشمول في ἅπαν، مع صياغة عربية واضحة.
- source_word: τῆς περιχώρου
  choice: المنطقة المحيطة
  rationale: يدل اللفظ على الناحية أو الإقليم المحيط، وهذه صياغة عربية مباشرة ومفهومة.
- source_word: τῶν Γερασηνῶν
  choice: ببلاد الجراسيين
  rationale: يحافظ على قراءة النص اليوناني المقدَّم وعلى نسبة المنطقة إلى الجراسيين، من غير استبدالها بقراءة اسمية أخرى.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: أن يرحل عنهم
  rationale: ينقل فعل الابتعاد مع حرف الجر الدال على المفارقة، بأسلوب عربي طبيعي ذي وقار.
- source_word: φόβῳ μεγάλῳ
  choice: خوفًا شديدًا
  rationale: «شديد» يؤدي معنى μέγας هنا بصورة أفصح في وصف درجة الخوف من الترجمة الحرفية «عظيم».
- source_word: συνείχοντο
  choice: استولى عليهم
  rationale: ينقل معنى إحكام الخوف قبضته عليهم، ويحافظ على قوة الصورة في تعبير عربي مألوف.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: فركب قاربًا
  rationale: صياغة موجزة وطبيعية لفعل الصعود إلى المركب، مع إبقاء التنكير الموجود في اليونانية.
- source_word: ὑπέστρεψεν
  choice: رجع
  rationale: ينقل معنى العودة بلفظ عربي واضح يلائم السرد.
theological_decisions:
- issue: طبيعة خوف سكان منطقة الجراسيين من يسوع
  choice: ذُكر أن خوفًا شديدًا استولى عليهم من غير تحديد طبيعته أو سببه الأبعد.
  alternative: تفسير الخوف بأنه رهبة من القدرة الإلهية، أو بأنه عداء ناشئ عن الخسارة الاقتصادية أو الاضطراب الاجتماعي.
  rationale: النص يذكر الخوف دافعًا إلى طلب رحيل يسوع، لكنه لا يصفه صراحة بأنه خشية تعبدية أو عداء أو مزيج منهما؛ لذلك تُحفظ دلالة النص المفتوحة.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية وقورة. استُخدم «أما هو» لإبراز المقابلة التي تؤديها δέ، وحُفظ اسم «الجراسيين» وفق قراءة SBLGNT المقدَّمة.
