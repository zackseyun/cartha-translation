base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: ar
  text: 'وكان الجميع يبكون ويندبونها. فقال: «لا تبكوا، لأنها لم تمت، بل هي نائمة[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تنام». يستخدم يسوع النوم وصفًا مجازيًا في سياق إعادتها الوشيكة إلى الحياة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: كانوا يبكون
  rationale: صيغة الماضي الناقص تدل على فعل مستمر، وتركيب «كانوا يبكون» ينقل هذا المعنى بوضوح.
- source_word: πάντες
  choice: الجميع
  rationale: يحفظ شمول اللفظ اليوناني بصياغة عربية طبيعية.
- source_word: ἐκόπτοντο αὐτήν
  choice: يندبونها
  rationale: الفعل في سياق الموت يدل على النواح والحداد، وقد يصاحبه ضرب الصدر؛ و«يندبونها» ينقل المعنى من غير إضافة تفصيل جسدي غير مصرّح به.
- source_word: Μὴ κλαίετε
  choice: لا تبكوا
  rationale: نهي طبيعي واضح، ويمكن بحسب السياق أن يفيد الكف عن بكاء جارٍ.
- source_word: οὐ γὰρ
  choice: لأنها لم
  rationale: تنقل «لأن» وظيفة γάρ التعليلية وتربط قول يسوع بالنهي السابق.
- source_word: ἀπέθανεν
  choice: لم تمت
  rationale: ترجمة مباشرة للماضي اليوناني، وتصلح عربيًا في مقابل العبارة الحالية «هي نائمة».
- source_word: καθεύδει
  choice: هي نائمة
  rationale: تحفظ صورة النوم في كلام يسوع ولا تفسرها على أنها مجرد موت أو نوم حرفي.
theological_decisions:
- issue: قول يسوع إن الفتاة لم تمت بل هي نائمة
  choice: إبقاء العبارة كما وردت مع صورة النوم ومن دون تفسير داخل المتن
  alternative: «ليست ميتة موتًا نهائيًا» أو «تبدو ميتة لكنها نائمة فعلًا»
  rationale: النص يصوغ حالتها بتقابل مقصود بين الموت والنوم في ضوء إعادتها الوشيكة؛ لذلك ينبغي الحفاظ على التوتر اللاهوتي والسردي وعدم حسم طبيعة العبارة تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدم «يندبونها» لأنه طبيعي في سياق الحداد، مع الحفاظ على تقابل «لم تمت» و«هي نائمة» من دون تسويته تفسيريًا.
