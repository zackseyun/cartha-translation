  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: ar
  text: ويوانا، زوجة خوزا وكيل هيرودس، وسوسنة، ونساء أخريات كثيرات، كنَّ يخدمنهم[a] من ممتلكاتهن.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تقرأ بعض المخطوطات «يخدمنه» بدلًا من «يخدمنهم».
    reason: textual_variant
  - marker: b
    text: 'أو: «من أموالهن» أو «مما كان لهن».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: زوجة
  rationale: وقوع الكلمة وصفًا ليوَنّا مع اسم خُوزِي في المضاف إليه يدل طبيعيًا على العلاقة الزوجية.
- source_word: ἐπιτρόπου
  choice: وكيل
  rationale: يدل اللفظ على شخص موكَّل بإدارة شؤون أو ممتلكات؛ و«وكيل» عربية موجزة ملائمة لسياق بلاط هيرودس.
- source_word: ἕτεραι πολλαί
  choice: نساء كثيرات غيرهن
  rationale: صيغة المؤنث الجمع تعود إلى النساء المذكورات، والتصريح بـ«نساء» يوضح المرجع في العربية.
- source_word: διηκόνουν
  choice: كُنَّ يخدمنهم
  rationale: يحفظ المعنى العام للخدمة من غير حصره في وظيفة كنسية أو في نوع واحد من الإعالة.
- source_word: αὐτοῖς
  choice: هم
  rationale: النص اليوناني المعطى يقرأ ضمير الجمع، والأقرب أنه يشير إلى يسوع والذين معه.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: من أموالهن
  rationale: تعبير عربي طبيعي ينقل معنى الإنفاق أو الخدمة من موارد النساء وممتلكاتهن الخاصة، مع ذكر البديل الأوسع في الحاشية.
theological_decisions:
- issue: مرجع αὐτοῖς واختلاف القراءة النصية
  choice: 'ضمير الجمع: «يخدمنهم»'
  alternative: 'ضمير المفرد: «يخدمنه» أي يسوع'
  rationale: اتباعًا لنص SBLGNT المزوَّد، تُترجم قراءة الجمع من غير تسويتها بقراءة المفرد الموجودة في بعض المخطوطات، وتُذكر القراءة البديلة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «وكيل هيرودس» بدل تعبير إداري مطوّل، وصُرّح بـ«نساء» لوضوح مرجع صيغة المؤنث. وُضعت علامة الحاشية النصية بعد اسم يوَنّا اتساقًا مع طبقة التشاور الإنجليزية، مع أن موضوع الحاشية هو الضمير اللاحق.
