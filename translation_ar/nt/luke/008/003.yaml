  to: ويوانا، زوجة خوزا وكيل هيرودس، وسوسنة، ونساء أخريات كثيرات، كنَّ يخدمنهم[a] من ممتلكاتهن.[b]
  rationale: صُحِّح نقل اسم يوانا، وحُسِّن تركيب «نساء أخريات كثيرات»، ونُقلت علامة الحاشية النصية إلى «يخدمنهم» لتطابق اختلاف القراءة الذي تشرحه. كما استُخدمت «ممتلكاتهن» في المتن لتقارب معنى «ما كان لهن/ما يملكنه»، مع حفظ البدائل العربية الطبيعية في الحاشية.
