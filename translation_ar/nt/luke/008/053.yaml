  yaml_path: translation/nt/luke/008/053.yaml
  text: And they were laughing at him, because they knew that she had died.
translation:
  language: ar
  text: وكانوا يضحكون منه، لأنهم كانوا يعلمون أنها ماتت.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: كانوا يضحكون منه
  rationale: ينقل صيغة الماضي الناقص فعلًا مستمرًا أو متكررًا، ويحفظ دلالة الضحك التهكمي في تعبير عربي واضح وطبيعي.
- source_word: αὐτοῦ
  choice: منه
  rationale: الضمير المجرور متعلق بفعل السخرية، والتعبير العربي «يضحكون منه» يؤدي معنى اتخاذه موضعًا للضحك.
- source_word: εἰδότες
  choice: لأنهم كانوا يعلمون
  rationale: اسم الفاعل هنا يحمل معنى سببيًا في السياق؛ والصياغة تبين أن معرفتهم بموتها كانت سبب ضحكهم، من غير تغيير لمضمون العبارة.
- source_word: ὅτι
  choice: أنها
  rationale: تدخل على مضمون ما كانوا يعلمونه، والضمير المؤنث يعود إلى الفتاة المفهومة من السياق.
- source_word: ἀπέθανεν
  choice: ماتت
  rationale: ينقل الفعل الماضي وقوع الموت بوصفه حدثًا مكتملًا، ويحافظ على الإيجاز من غير تحويله إلى وصف للحالة مثل «كانت ميتة».
theological_decisions:
- issue: هل يُصرَّح بهوية الفتاة مع أن اليونانية لا تذكر اسمًا في هذه الجملة؟
  choice: أنها ماتت
  alternative: أن الصبية ماتت؛ أنها كانت ميتة
  rationale: الفاعل المؤنث مفهوم بوضوح من السياق، والضمير يحفظ إيجاز الأصل ولا يضيف اسمًا غير وارد في الجملة. كما أن «ماتت» يحافظ على دلالة الحدث بدل تحويلها إلى مجرد حالة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. اختير «يضحكون منه» لصياغة طبيعية تحمل معنى التهكم، واستُعمل «كانوا» مع الفعلين لإظهار الاستمرار الذي يفيده الماضي الناقص في κατεγέλων وحالة المعرفة المصاحبة.
