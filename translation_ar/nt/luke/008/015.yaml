base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: ar
  text: أَمَّا الْبِذَارُ الَّذِي وَقَعَ فِي التُّرْبَةِ الْجَيِّدَةِ، فَأُولَئِكَ هُمُ الَّذِينَ، بَعْدَ أَنْ يَسْمَعُوا الْكَلِمَةَ بِقَلْبٍ نَبِيلٍ وَصَالِحٍ[a]، يَتَمَسَّكُونَ بِهَا وَيُثْمِرُونَ بِالْمُثَابَرَةِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بقلب مستقيم وصالح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... ἐν τῇ καλῇ γῇ
  choice: الذي في التربة الجيدة
  rationale: التركيب اليوناني محذوف المقدَّر، ويعود في سياق المثل إلى البذار أو ما زُرع. أبقت الصياغة العربية الإيجاز المجازي الطبيعي من غير إضافة تفسيرية زائدة، مع وضوح المرجع من السياق.
- source_word: καλῇ γῇ
  choice: التربة الجيدة
  rationale: γῆ تدل هنا على الأرض الزراعية التي تستقبل البذار؛ و«التربة» أدق في الصورة الزراعية الحديثة من «الأرض»، مع إبقاء وصفها بأنها جيدة.
- source_word: οὗτοί εἰσιν οἵτινες
  choice: فهم أولئك الذين
  rationale: تنقل العبارة وظيفة التعريف بالفئة المقصودة بوضوح وبأسلوب عربي طبيعي.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: بقلب صالح ونبيل
  rationale: «القلب» هو باطن الإنسان وموضع استجابته. واللفظان καλῇ وἀγαθῇ متقاربان، فصيغَا بلفظين عربيين متميزين يحفظان المدح المزدوج من غير تكرار ثقيل.
- source_word: ἀκούσαντες τὸν λόγον
  choice: يسمعون الكلمة
  rationale: استُعمل المضارع العربي لبيان السمة المميزة لهذه الفئة في شرح المثل، مع بقاء سماع الكلمة سابقًا منطقيًا للتمسك والإثمار.
- source_word: κατέχουσιν
  choice: يتمسكون بها
  rationale: الفعل يدل على الاحتفاظ الراسخ لا مجرد الحيازة، والضمير يعود بوضوح إلى «الكلمة».
- source_word: καρποφοροῦσιν
  choice: يثمرون
  rationale: يحفظ الفعل الصورة الزراعية والاستعمال المجازي بإيجاز طبيعي.
- source_word: ἐν ὑπομονῇ
  choice: بالثبات
  rationale: ὑπομονή تفيد الاحتمال الراسخ والمداومة تحت المشقة؛ و«الثبات» هنا تعبر بإيجاز عن كيفية الإثمار المستمر، دون حصر المعنى في الصبر السلبي.
theological_decisions:
- issue: الوصف الأخلاقي للقلب المتقبل
  choice: بقلب صالح ونبيل
  alternative: بقلب صادق وصالح
  rationale: تحفظ الصياغة وصف النص الإيجابي للاستعداد الباطني، من غير أن تحدد كيف تكوَّن هذا القلب أو تستنتج ترتيبًا عقديًا يتعلق بالاستحقاق أو التجديد. كما تصون الصفتين اليونانيتين المترادفتين نسبيًا بلفظين متميزين.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «التربة» لدقة الصورة الزراعية، و«يتمسكون بها» لإبراز رسوخ الاحتفاظ بالكلمة. أُثبتت علامة الحاشية [a] في المتن.
