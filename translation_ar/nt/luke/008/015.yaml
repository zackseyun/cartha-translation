  to: أَمَّا الْبِذَارُ الَّذِي وَقَعَ فِي التُّرْبَةِ الْجَيِّدَةِ، فَأُولَئِكَ هُمُ الَّذِينَ، بَعْدَ أَنْ يَسْمَعُوا الْكَلِمَةَ بِقَلْبٍ نَبِيلٍ وَصَالِحٍ[a]، يَتَمَسَّكُونَ بِهَا وَيُثْمِرُونَ بِالْمُثَابَرَةِ.
  rationale: تُظهر المراجعة تسلسل الأفعال الذي يفيده النص اليوناني، وتوضح المحذوف السياقي («البذار») كما يفعل مسار التدقيق الإنجليزي، وتحافظ على صورة المثل ومعنى الاحتفاظ الراسخ بالكلمة. ولا تستنتج أي آلية عقدية لتكوين القلب الممدوح.
