review_pass:
  verdict: revise
  source_fidelity: يلزم إظهار أن سماع «الكلمة» سابق على التمسك بها والإثمار، لأن «ἀκούσαντες» اسم فاعل ماضٍ يسبق الفعلين الرئيسيين. كما أن إحلال «البذار الذي وقع» محل الحذف اليوناني مشروع وآمن في هذا السياق، إذ يعيّن المرجع الذي يقتضيه المثل ولا يضيف معنى جديدًا.
  naturalness: الصياغة المقترحة فصحى حديثة واضحة. «المثابرة» تؤدي معنى ὑπομονή بوضوح أكبر من «الثبات» في سياق الإثمار المتواصل، و«بعد أن يسمعوا» تجعل الترتيب المفهوم من اليونانية طبيعيًا بالعربية.
  terminology: «الكلمة»، و«يتمسكون بها»، و«يثمرون» مناسبة. يُفضَّل ترتيب صفتي القلب بما يوازي ترتيب اليونانية، مع إبقاء التمييز بين الوصفين. وتُعدَّل بديلة الحاشية كي لا يُفهم «صادق» في المقام الأول بمعنى الصدق في القول فقط.
  issues:
  - severity: medium
    issue: الفعل «يسمعون» لا يُظهر بوضوح أسبقية السماع على التمسك والإثمار.
    rationale: الفعل اليوناني ἀκούσαντες يدل على سماعٍ متقدم على الفعلين κατέχουσιν وκαρποφοροῦσιν؛ والصياغة الحالية قد تُقرأ بوصفها ثلاثة أفعال متزامنة.
  - severity: low
    issue: «الثبات» أضيق قليلًا من دلالة ὑπομονή.
    rationale: تتضمن ὑπομονή المثابرة والصمود المستمر؛ و«بالمثابرة» أوضح في العربية المعاصرة من حيث دوام الإثمار.
  - severity: low
    issue: بديل الحاشية «صادق وصالح» قد يضيّق الوصف الأخلاقي إلى الصدق اللفظي.
    rationale: البديل الإنجليزي honest يتصل بالاستقامة والنزاهة؛ و«مستقيم وصالح» ينقل هذا الاحتمال العربي بصورة أوسع.
