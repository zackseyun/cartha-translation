  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: ar
  text: وأبحروا إلى ناحية الجراسيين[a]، وهي تقع قبالة الجليل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات، وكذلك مواضع موازية في الأناجيل: «الجدريين» أو «الجرجسيين».'
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: أبحروا إلى
  rationale: يدل الفعل على السفر بحرًا إلى موضع والوصول نحوه. وهذه الصياغة عربية طبيعية تنقل وسيلة الانتقال ووجهته من غير أن تفرض معنى اتجاهيًا زائدًا على السياق.
- source_word: χώραν
  choice: ناحية
  rationale: تشير الكلمة هنا إلى إقليم أو منطقة، لا إلى دولة بالمعنى الحديث. و«ناحية» واضحة وطبيعية في هذا السياق الجغرافي.
- source_word: Γερασηνῶν
  choice: الجراسيين
  rationale: نقل صوتي لاسم سكان جراسا بحسب قراءة SBLGNT، مع إبقاء القراءات الأخرى في الحاشية.
- source_word: ἥτις
  choice: وهي
  rationale: تستأنف جملة وصفية تعود على الناحية، و«وهي» تؤدي هذه الصلة بوضوح وسلاسة في العربية.
- source_word: ἀντιπέρα
  choice: قبالة
  rationale: تفيد وقوع الموضع في الجهة المقابلة أو عبر المياه، و«قبالة» موجزة ودقيقة جغرافيًا.
- source_word: Γαλιλαίας
  choice: الجليل
  rationale: الصيغة العربية الراسخة لاسم هذا الإقليم.
theological_decisions:
- issue: اختلاف اسم الموضع في مخطوطات الأناجيل الإزائية وتقليدها النصي
  choice: الجراسيين
  alternative: الجدريين أو الجرجسيين
  rationale: 'يتبع المتن قراءة SBLGNT: Γερασηνῶν، من غير مواءمة صامتة مع القراءات الأخرى؛ وتُذكر البدائل في الحاشية حفظًا للشفافية النصية.'
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ورصينة. استُخدمت «ناحية» لتجنب إيحاء «بلاد» بدولة حديثة، و«تقع قبالة» لتوضيح العلاقة الجغرافية بأسلوب طبيعي.
