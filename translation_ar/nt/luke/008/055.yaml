  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: ar
  text: فعادت روحها[a]، ونهضت في الحال، فأمر أن تُعطى شيئًا تأكله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نَفَسها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: عادت
  rationale: ينقل معنى الرجوع بوضوح وطبيعية، ويصف هنا عودة روح الفتاة من غير إضافة تفسيرية.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: روحها
  rationale: يحفظ الدلالة الأساسية لكلمة πνεῦμα وملاءمتها لسياق العودة من الموت؛ ويمكن أن تدل الكلمة أيضًا على نَفَسها.
- source_word: ἀνέστη
  choice: نهضت
  rationale: تعبير عربي واضح ومعاصر عن قيامها الجسدي عقب عودة روحها.
- source_word: παραχρῆμα
  choice: في الحال
  rationale: ينقل التشديد على وقوع الفعل فورًا بلغة عربية طبيعية رصينة.
- source_word: διέταξεν
  choice: أمر
  rationale: يعكس بوضوح قوة الفعل الدال على إصدار توجيه ملزم، من دون مبالغة.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: أن تُعطى شيئًا تأكله
  rationale: يحافظ على صيغة المبني للمجهول وعلى ذكر الأكل صراحة كما في اليونانية، وهو أسلوب عربي طبيعي.
theological_decisions:
- issue: دلالة πνεῦμα في سياق العودة من الموت
  choice: روحها
  alternative: نَفَسها
  rationale: «روحها» تحافظ على السعة الدلالية والثقل السياقي للكلمة من غير اختزال الحدث في استعادة التنفس، مع إثبات البديل الممكن في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. روعي ترتيب الجمل اليوناني وإيجازها، مع صياغة طبيعية لعبارة الطعام. صُحّح موضع الحاشية الدلالية مقارنة بطبقة الاستشارة الإنجليزية، إذ تتعلق «نَفَسها» بكلمة πνεῦμα لا بظرف «في الحال».
