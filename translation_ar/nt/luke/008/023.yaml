review_pass:
  verdict: revise
  source_fidelity: 'المسودة تنقل تسلسل الحدث ومعاني الأفعال الأساسية بأمانة: الإبحار الجاري، نوم يسوع، نزول عاصفة ريح على البحيرة، امتلاء المركب/غمر الركاب بالماء، والخطر. لكن «صاروا في خطر» توحي بتحول لحظي أكثر من كونها حالة مستمرة، في حين أن الفعل اليوناني في صيغة الناقص يدل على خطر متواصل.'
  naturalness: الأسلوب فصيح وواضح. وتكون «وكان الماء يغمرهم» أنسب من «أخذ الماء يغمرهم»، لأنها تنقل الاستمرار من غير إضافة إيحاء البدء الذي لا يقتضيه النص. كما أن «غلبه النوم» عربية طبيعية تؤدي المعنى الافتتاحي لـ ἀφύπνωσεν.
  terminology: لا توجد مصطلحات لاهوتية خاصة في الآية. «عاصفة من الريح» و«البحيرة» مناسبتان. تُصاغ الحاشية بعبارة عربية سليمة، مع إبقاء الإحالة غير المصرح بها إلى القارب في موضع الحاشية لا في المتن.
  issues:
  - severity: medium
    issue: «صاروا في خطر» لا تحافظ على دلالة الاستمرار في ἐκινδύνευον.
    rationale: الفعل الناقص يصف حالة خطر قائمة أثناء العاصفة؛ «وكانوا في خطر» أدق وأبسط.
  - severity: low
    issue: «أخذ الماء يغمرهم» يضيف إيحاء الشروع.
    rationale: أخذ + المضارع يبرز بدء الفعل، أما συνεπληροῦντο فتصوير مستمر للامتلاء/الغمر؛ «وكان الماء يغمرهم» أوفق.
  - severity: low
    issue: صياغة الحاشية «وكانوا يمتلئون» غير مألوفة عربيًا من دون تقييد.
    rationale: ينبغي بيان أن المقصود المحتمل هو امتلاء القارب بالماء، مع الحفاظ على أن النص اليوناني يستعمل صيغة الجمع ولا يذكر القارب صراحة.
