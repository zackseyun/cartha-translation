- from: وفيما هم يبحرون، نام. فانحدرت عاصفةٌ من الريح على البحيرة، وأخذ الماء يغمرهم[a]، وصاروا في خطر.
  to: وفيما هم يبحرون، غلبه النوم. فانحدرت عاصفةٌ من الريح على البحيرة، وكان الماء يغمرهم[a]، وكانوا في خطر.
  rationale: تُبقي المراجعة صورة العاصفة المنحدرة ومعنى الغمر، وتستبدل ما قد يوحي ببداية الحدث أو بتحول منجز بصيغ عربية تعكس الاستمرار في الفعلين اليونانيين الناقصين. وتُهذَّب الحاشية لتكون طبيعية ودقيقة من دون فرض مرجع غير مذكور صراحة في المتن اليوناني.
  reviewer_model: gpt-5.6-terra
