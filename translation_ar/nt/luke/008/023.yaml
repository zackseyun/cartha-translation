base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: ar
  text: وفيما هم يبحرون، غلبه النوم. فانحدرت عاصفةٌ من الريح على البحيرة، وكان الماء يغمرهم[a]، وكانوا في خطر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكانوا يمتلئون [بالماء]»؛ أي إن القارب كان يمتلئ بالماء.'
    reason: يحمل الفعل اليوناني معنى الامتلاء، ويأتي بصيغة الجمع من غير ذكر القارب صراحة؛ لذلك يصوغ المتن أثر الماء في الركاب، وتبيّن الحاشية احتمال الإشارة إلى امتلاء القارب.
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: وفيما هم يبحرون
  rationale: ينقل التركيب المطلق وفعل المضارع الدال على حدث مستمر ومتزامن، بصياغة عربية طبيعية.
- source_word: ἀφύπνωσεν
  choice: نام
  rationale: يعبر بوضوح وإيجاز عن شروعه في النوم بحسب دلالة الماضي السياقية، والفاعل معلوم من السياق.
- source_word: κατέβη
  choice: انحدرت
  rationale: يحفظ صورة نزول العاصفة من جهة أعلى نحو البحيرة، بدل الاكتفاء بقول «هبّت».
- source_word: λαῖλαψ ἀνέμου
  choice: عاصفة من الريح
  rationale: يحفظ التصريح بأن العاصفة ريحية، بلغة عربية واضحة من غير إضافة وصف غير مصرح به.
- source_word: εἰς τὴν λίμνην
  choice: على البحيرة
  rationale: «على» هي الصياغة العربية الطبيعية لنزول ظاهرة جوية على سطح البحيرة، مع أن حرف الجر اليوناني يعني أصلًا «إلى/داخل».
- source_word: συνεπληροῦντο
  choice: أخذ الماء يغمرهم[a]
  rationale: ينقل الفعل المستمر وصيغة الجمع بوصفهم متأثرين بدخول الماء، مع إثبات البديل الأقرب إلى معنى الامتلاء في الحاشية بسبب غموض المرجع في اليونانية.
- source_word: ἐκινδύνευον
  choice: صاروا في خطر
  rationale: صياغة عربية واضحة تنقل دخولهم في حالة الخطر واستمرارها في المشهد.
