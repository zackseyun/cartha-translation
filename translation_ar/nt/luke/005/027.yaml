source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: ar
  text: 'وبعد هذه الأمور خرج، فرأى[a] جابي ضرائب اسمه لاوي جالسًا عند مكتب جباية الضرائب[b]، وقال له: «اتبعني».


    [a] أو «لاحظ» أو «نظر إلى»؛ فقد يدل الفعل اليوناني على أكثر من نظرة عابرة.

    [b] أو «مكتب تحصيل الرسوم» أو «محطة الجمارك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لاحظ» أو «نظر إلى»؛ فقد يدل الفعل اليوناني على أكثر من نظرة عابرة.
    reason: lexical_alternative
  - marker: b
    text: أو «مكتب تحصيل الرسوم» أو «محطة الجمارك».
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: بعد هذه الأمور
  rationale: يحافظ على صيغة الجمع في العبارة اليونانية وعلى الانتقال السردي الصريح، من غير اختزالها إلى «بعد ذلك».
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: ينقل دلالة الحركة الملموسة في الفعل اليوناني بإيجاز وطبيعية.
- source_word: ἐθεάσατο
  choice: رأى
  rationale: صياغة عربية طبيعية وأمينة للسياق، مع إثبات احتمال دلالة النظر المقصود أو المتأمل في الحاشية.
- source_word: τελώνην
  choice: جابي ضرائب
  rationale: تعبير واضح وشائع ينقل وظيفة الشخص الاجتماعية من غير تحميلها مصطلحًا إداريًا حديثًا أكثر مما يلزم.
- source_word: ὀνόματι Λευὶν
  choice: اسمه لاوي
  rationale: مقابل عربي موجز وطبيعي للتركيب الدال على الاسم.
- source_word: καθήμενον
  choice: جالسًا
  rationale: يحافظ على صورة لاوي وهو في موضع عمله وعلى دلالة اسم الفاعل الحاضر.
- source_word: ἐπὶ τὸ τελώνιον
  choice: عند مكتب جباية الضرائب
  rationale: يبيّن أنه المكان الذي كانت تُجمع فيه الضرائب أو الرسوم، مع تجنب حصر المكان في هيئة حديثة بعينها؛ وترد البدائل المحتملة في الحاشية.
- source_word: Ἀκολούθει μοι
  choice: اتبعني
  rationale: ينقل الأمر المباشر بأوجز صياغة عربية طبيعية، ويحفظ في السياق قوة الدعوة إلى التلمذة من غير شرح زائد.
theological_decisions:
- issue: قوة صيغة الأمر بوصفها دعوة إلى التلمذة
  choice: «اتبعني» بوصفها دعوة مباشرة دون توسيع تفسيري
  alternative: «صِر تلميذًا لي» أو «اتبعني كتلميذ»
  rationale: السياق يدل على الدعوة إلى التلمذة، لكن النص اليوناني يكتفي بفعل الاتباع؛ لذلك تُحفظ عبارته المباشرة ولا تُضاف إليها دلالة تفسيرية صريحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ الانتقال السردي بصيغة «بعد هذه الأمور»، واستُعمل «مكتب جباية الضرائب» لتوضيح المكان للقارئ المعاصر مع إبقاء البدائل التاريخية الممكنة في الحاشية. وُضعت علامتا الحاشيتين عند اللفظين اللذين تتعلقان بهما مباشرة.
