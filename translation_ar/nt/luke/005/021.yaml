source:
  edition: SBLGNT
  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: ar
  text: 'وبدأ الكتبة والفريسيون يفكّرون قائلين: «مَن هذا الذي يتكلّم بتجاديف؟ مَن يقدر أن يغفر الخطايا إلا الله وحده؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: بدأوا يفكّرون
  rationale: يحفظ معنى البدء مع دلالة المداولة والتفكير في السياق، من غير الجزم بأن الأمر كان حديثًا جهريًا فيما بينهم أو تفكيرًا باطنيًا محضًا.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: المقابل العربي الكتابي المألوف للخبراء المعترف بهم في الشريعة، وهو أوثق اتصالًا باللفظ اليوناني من ترجمة تفسيرية مثل «معلّمي الشريعة».
- source_word: Φαρισαῖοι
  choice: الفريسيون
  rationale: الصيغة العربية المستقرة لاسم هذه الجماعة.
- source_word: λαλεῖ βλασφημίας
  choice: يتكلّم بتجاديف
  rationale: يبقي صيغة الجمع في βλασφημίας ويحافظ على اتهام المتكلمين الحاد، بصياغة عربية واضحة وطبيعية.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: يغفر الخطايا
  rationale: هذا هو المقابل العربي الطبيعي والدقيق للتعبير اليوناني الاصطلاحي عن غفران الخطايا.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: إلا الله وحده
  rationale: ينقل أسلوب الاستثناء ويحفظ بوضوح دلالة الحصر في μόνος.
- source_word: Τίς ἐστιν οὗτος
  choice: مَن هذا
  rationale: يحفظ إيجاز العبارة ونبرتها الاعتراضية من غير إضافة «الرجل»، وهي غير موجودة في اليونانية.
theological_decisions:
- issue: دلالة سلطان يسوع على غفران الخطايا
  choice: نقل اعتراض الكتبة والفريسيين كما هو، مع إبقاء قولهم إن الله وحده يغفر الخطايا.
  alternative: إضافة استنتاج مسيحاني صريح أو تخفيف دلالة الحصر.
  rationale: يحمل الاعتراض توترًا لاهوتيًا مقصودًا في السرد، لكن الآية لا تصرّح هنا بحلّه؛ لذلك ينبغي حفظه من غير زيادة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «يفكّرون» لئلا يُحسم هل كانت المداولة داخلية محضة أم متبادلة، واستُبقي جمع «تجاديف» موافقةً للنص اليوناني.
