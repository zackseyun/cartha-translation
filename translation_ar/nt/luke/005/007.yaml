base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: ar
  text: فأشاروا إلى شركائهم في القارب الآخر أن يأتوا لمساعدتهم[a]. فجاؤوا وملأوا القاربين كليهما، حتى أخذا يغرقان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يأتوا ويعاونوهم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حتى كانا يغرقان».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατένευσαν
  choice: أشاروا
  rationale: يفيد الفعل إعطاء إشارة أو إيماءة، على الأرجح من مسافة فوق الماء؛ و«أشاروا» تعبير عربي طبيعي وواضح.
- source_word: μετόχοις
  choice: شركائهم
  rationale: يدل اللفظ في سياق الصيد على المشاركين أو الشركاء في العمل، لا على مجرد الرفاق.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: في القارب الآخر
  rationale: يُميّز التعبير القارب الآخر في المشهد، وهذه صياغة عربية طبيعية.
- source_word: τοῦ ἐλθόντας
  choice: أن يأتوا
  rationale: ينقل غرض الإشارة بصياغة عربية سلسة.
- source_word: συλλαβέσθαι αὐτοῖς
  choice: ويساعدوهم
  rationale: يفيد الفعل هنا الانضمام إليهم لتقديم العون في التعامل مع الصيد الوفير.
- source_word: ἔπλησαν
  choice: ملأوا
  rationale: يحافظ على صورة امتلاء القاربين، مع بقاء المملوء به مفهومًا من السياق.
- source_word: ἀμφότερα τὰ πλοῖα
  choice: القاربين كليهما
  rationale: ينقل معنى ἀμφότερα الصريح، أي القاربين معًا.
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: حتى أخذا يغوصان
  rationale: المضارع في المصدر اليوناني يصور عملية جارية ناتجة عن الامتلاء؛ و«أخذا يغوصان» يوضح بدء العملية من غير أن يفيد أنهما غرقا تمامًا.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية كريمة. استُخدم «القارب» اتساقًا مع مشهد الصيد، وحُفظت دلالة العملية المستمرة في العبارة الختامية دون الإيحاء بغرق القاربين غرقًا كاملًا.
