  yaml_path: translation/nt/luke/005/009.yaml
  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: ar
  text: لِأَنَّ الدَّهشةَ استولت عليه وعلى جميعِ مَن معه بسبب صيدِ السمك الذي اصطادوه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسبب حصيلة السمك التي اصطادوها».'
    reason: 'بديل تعبيري لـ«صيد السمك»، يُظهر أن ἄγρα قد تشير إلى الحصيلة المصطادة، مع الحفاظ على معنى συνέλαβον: «اصطادوا».'
lexical_decisions:
- source_word: θάμβος
  choice: الذُّهول
  rationale: يدل اللفظ على دهشة شديدة ومفاجئة تستولي على الإنسان؛ و«الذهول» ينقل قوة الانفعال في هذا السياق من غير مبالغة أسلوبية.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تربط الأداة هذه الجملة بما قبلها بوصفها تعليلًا لرد فعل سمعان.
- source_word: περιέσχεν
  choice: استولى عليه
  rationale: المعنى الحرفي هو الإحاطة أو الأخذ من كل جانب، واستعماله مع الانفعال يفيد أنه تمكّن منه؛ و«استولى عليه» تعبير عربي طبيعي يحفظ شدة الأثر.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: جميع مَن معه
  rationale: صياغة واضحة موجزة تشمل كل رفاق سمعان الحاضرين.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: بسبب صيد السمك
  rationale: تفيد ἐπί هنا سبب الذهول، وتدل ἄγρα على الصيد أو الحصيلة المصطادة؛ فالصياغة تنقل العلاقة السببية والمعنى البحري بوضوح.
- source_word: ὧν συνέλαβον
  choice: الذي اصطادوه
  rationale: تعود العبارة على السمك وتفيد أن الجماعة شاركت في اصطياده؛ واستُعمل ضمير الجمع للمشاركين، مع مراعاة الأسلوب العربي في الإحالة إلى اسم الجمع «السمك».
