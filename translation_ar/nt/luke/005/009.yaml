review_pass:
  verdict: revise
  source_fidelity: النص الرئيس ينقل بدقة العلاقة التعليلية في γάρ، واستيلاء الدهشة على سمعان ورفاقه، وسبب ذلك وهو صيد السمك الذي اشتركوا في اصطياده. واستبدلتُ «الذُّهول» بـ«الدهشة» لأنها أقرب إلى θάμβος في هذا السياق وأوضح في العربية المعاصرة، من غير أن توحي بحالة فقدان إدراك قد تحملها «الذهول».
  naturalness: 'الصياغة المعدلة فصيحة وسلسة: «استولت عليه وعلى جميع من معه» تعبير طبيعي، و«صيد السمك الذي اصطادوه» يحافظ على الإحالة إلى السمك وعلى فعل الجمع.'
  terminology: «الدهشة» مناسبة لـθάμβος، و«استولت» مناسبة للاستعمال المجازي لـπεριέσχεν. وقد صُححت الحاشية؛ إذ إن «أمسكوا بها» لا تعني بوضوح «اصطادوا/أخذوا» في هذا المقام، كما أن الحاشية السابقة لم تكن بديلًا مباشرًا مضبوطًا للعبارة الأصلية.
  issues:
  - severity: low
    issue: اختيار «الذُّهول» لـθάμβος
    rationale: مقبول في الجملة، لكنه قد يدل في الاستعمال الحديث على الحيرة المشلولة أو الغياب الذهني. «الدهشة» أقرب إلى معنى الانبهار/العجب في السياق.
  - severity: medium
    issue: صياغة الحاشية «حصيلة السمك التي أمسكوا بها»
    rationale: الفعل «أمسكوا بها» يوحي بالإمساك الجسدي لا بالفعل المقصود συνέλαβον، أي صادوا/أخذوا، كما أن الصياغة لا تقدم بديلًا دقيقًا وطبيعيًا للتركيب.
  revised_text: لِأَنَّ الدَّهشةَ استولت عليه وعلى جميعِ مَن معه بسبب صيدِ السمك الذي اصطادوه.[a]
