  text: ولمّا فعلوا ذلك، أحاطوا بعدد غفير من السمك[a]، وأخذت شباكهم تتمزّق[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «اصطادوا عددًا كبيرًا من السمك». يدل الفعل اليوناني حرفيًّا على الإحاطة بالشيء أو حصره، فيبرز صورة السمك وقد أحاطت به الشباك.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «وكانت شباكهم تتمزّق». تصوّر صيغة الفعل اليوناني التمزّق وهو جارٍ، ولا تدل بالضرورة على أن الشباك تمزّقت تمامًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: ولمّا فعلوا ذلك
  rationale: صيغ اسم الفاعل اليوناني الدال على فعل سابق في تركيب زمني عربي طبيعي، مع إبقاء الإشارة إلى الأمر الذي نفّذه الصيادون.
- source_word: συνέκλεισαν
  choice: حاصروا بشباكهم
  rationale: يحفظ معنى الإحاطة والتطويق في الفعل اليوناني، بدل اختزاله في النتيجة الأعم «اصطادوا»، ويبيّن دور الشباك بعبارة عربية واضحة.
- source_word: πλῆθος ἰχθύων πολύ
  choice: عددًا كبيرًا من السمك
  rationale: ينقل التشديد على كثرة السمك بعبارة عربية مألوفة، من غير تكلف في استعمال «جمهور» أو «حشد» للحيوانات.
- source_word: διερρήσσετο
  choice: أخذت ... تتمزّق
  rationale: ينقل صيغة الماضي الناقص بوصف التمزق عملية بدأت وكانت جارية، لا حدثًا اكتمل تمامًا.
- source_word: τὰ δίκτυα αὐτῶν
  choice: شباكهم
  rationale: يحافظ على الجمع والملكية الواضحين في النص اليوناني بصياغة عربية موجزة وطبيعية.
