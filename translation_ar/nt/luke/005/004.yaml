  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: ar
  text: 'ولمّا فرغ من الكلام، قال لسمعان: «تقدَّم إلى المياه العميقة[a]، وأنزلوا شباككم للصيد».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إلى العمق». يقول اليوناني حرفيًا «إلى العُمق»، والمقصود هنا المياه العميقة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: ولمّا فرغ من الكلام
  rationale: ينقل العلاقة الزمنية والتقدّم السردي الخفيف، ويعبّر طبيعيًا عن انتهاء فعل الكلام المستمر.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: قال لسمعان
  rationale: صياغة مباشرة وقريبة من فعل القول اليوناني من غير زيادة تفسيرية.
- source_word: Ἐπανάγαγε
  choice: تقدَّم
  rationale: أمر مفرد موجّه إلى سمعان بالابتعاد بالقارب عن الشاطئ؛ والصياغة ملائمة لبحيرة ولا توحي بالضرورة بالإبحار في البحر.
- source_word: εἰς τὸ βάθος
  choice: إلى المياه العميقة
  rationale: المقصود في سياق الصيد هو موضع عميق من الماء، وهذه العبارة واضحة وطبيعية، مع إثبات الصياغة الأقرب إلى اللفظ في الحاشية.
- source_word: χαλάσατε
  choice: أنزلوا
  rationale: أمر جمع بخفض الشباك من القارب، ويحافظ على انتقال النص من الأمر المفرد إلى الأمر الجمع.
- source_word: τὰ δίκτυα ὑμῶν
  choice: شباككم
  rationale: ينقل الاسم الجمع وضمير الملكية بصياغة عربية طبيعية.
- source_word: εἰς ἄγραν
  choice: للصيد
  rationale: يعبّر بإيجاز عن الغرض، أي إنزال الشباك لتحصيل صيد من السمك.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ اختلاف العدد بين «تقدَّم» المفرد و«أنزلوا» الجمع كما في اليونانية، ولم يُضف إلى النص اسم القارب أو البحر لأنه غير مصرح بهما.
