source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: ar
  text: 'وكان أيضًا يقول لهم مثلًا: «لا أحد يمزّق رقعةً من ثوب جديد ويضعها على ثوب عتيق[a]. وإلا فسيمزّق الثوب الجديد أيضًا، والرقعة المأخوذة من الجديد لا تلائم العتيق[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أقرب إلى ترتيب اليونانية: «لا أحد، بعد أن يمزّق رقعةً من ثوب جديد، يضعها على ثوب عتيق». ففي اليونانية يسبق الفعلَ الرئيسَ اسمُ فاعلٍ في صيغة الماضي، دالٌّ على فعل سابق له.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «لا تلائم» بـ«لا تناسب» أو «لا تتوافق مع». فاللفظ اليوناني يدل على عدم التوافق أو المناسبة بين الرقعة والثوب العتيق.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: وكان أيضًا يقول
  rationale: ينقل صيغة الماضي الناقص بما يوحي باستمرار القول في السياق السردي، ويحفظ معنى «أيضًا» دون إثقال العبارة.
- source_word: παραβολὴν
  choice: مثلًا
  rationale: «مثل» هو المقابل العربي المألوف لهذا النوع من القول التصويري في سياق الأناجيل.
- source_word: ἐπίβλημα
  choice: رقعةً
  rationale: يدل اللفظ في سياق الثياب على قطعة تُستخدم لترقيع الثوب، و«رقعة» أوضح من «قطعة» وحدها.
- source_word: ἀπὸ ἱματίου καινοῦ
  choice: من ثوب جديد
  rationale: «ثوب» تعبير عربي طبيعي عام يحفظ دلالة ἱμάτιον دون تخصيصه برداء بعينه.
- source_word: σχίσας
  choice: يمزّق
  rationale: صيغ اسم الفاعل اليوناني السابق للفعل الرئيس بعبارة عربية فعلية طبيعية، مع بقاء ترتيب الحدث مفهومًا.
- source_word: ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν
  choice: ويضعها على ثوب عتيق
  rationale: يحفظ المعنى العام للفعل «يضع على» ولا يضيف فعل الخياطة غير المذكور صراحة.
- source_word: εἰ δὲ μήγε
  choice: وإلا
  rationale: تؤدي بوضوح معنى النتيجة السلبية المترتبة على الفعل المفترض.
- source_word: καὶ τὸ καινὸν σχίσει
  choice: فإنه يمزّق الثوب الجديد أيضًا
  rationale: يحفظ صيغة الفعل المعلوم وفاعله البشري الضمني، ويصرّح بمرجع «الجديد» منعًا للالتباس.
- source_word: συμφωνήσει
  choice: تلائم
  rationale: «تلائم» تحفظ سعة المعنى بين التوافق والمناسبة، وهي طبيعية في سياق رقعة وثوب.
theological_decisions: []
