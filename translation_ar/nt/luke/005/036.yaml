  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «عتيق» مقابل «قديم» لإبراز التقابل مع الثوب الجديد مع بقاء العبارة مفهومة، ولم تُضف تفاصيل مثل الخياطة لأنها غير مصرّح بها في النص اليوناني.
