  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: ar
  text: وإذا برجالٍ يحملون رجلًا مشلولًا على فراش، وكانوا يحاولون أن يُدخلوه ويضعوه أمامه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي أمام يسوع.
    reason: إيضاح مرجع الضمير
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا بـ
  rationale: صيغة عربية فصيحة وطبيعية تسترعي الانتباه وتُبرز دخول المشهد المفاجئ، فتحفظ الوظيفة الخطابية للأداة اليونانية دون تكلف.
- source_word: ἄνδρες
  choice: رجال
  rationale: يحفظ الدلالة المحددة على ذكور بالغين.
- source_word: φέροντες
  choice: يحملون
  rationale: المضارع في سياق السرد يصور الفعل الجاري الذي يدل عليه اسم الفاعل اليوناني.
- source_word: ἐπὶ κλίνης
  choice: على فراش
  rationale: «فراش» لفظ طبيعي واسع الدلالة يمكن أن يشير إلى سرير أو مضجع قابل للحمل، من غير فرض معنى «نقالة» غير المصرح به.
- source_word: ἄνθρωπον
  choice: رجلًا
  rationale: السياق يدل على فرد ذكر، وهذه الصياغة واضحة وطبيعية بالعربية.
- source_word: παραλελυμένος
  choice: كان مشلولًا
  rationale: ينقل حالة الشلل الناتجة والمستمرة التي يفيدها اسم المفعول التام، دون إضافة أنه كان طريح الفراش.
- source_word: ἐζήτουν
  choice: كانوا يحاولون
  rationale: يعبر طبيعيًا عن المحاولة المستمرة في صيغة الماضي الناقص؛ وهو أنسب سياقيًا من «كانوا يطلبون».
- source_word: εἰσενεγκεῖν
  choice: أن يُدخلوه
  rationale: ينقل معنى الإتيان به إلى الداخل، ويترك طريقة الحمل مفهومة من السياق.
- source_word: θεῖναι
  choice: ويضعوه
  rationale: ترجمة عامة دقيقة لفعل الوضع، من غير تحديد هيئة الرجل بأكثر مما يورده النص.
- source_word: ἐνώπιον αὐτοῦ
  choice: أمامه
  rationale: يحفظ الضمير الوارد في اليونانية بدل استبداله باسم يسوع، مع إمكان إيضاح مرجعه في الحاشية.
theological_decisions:
- issue: مرجع الضمير αὐτοῦ في ختام الآية
  choice: أمامه
  alternative: أمام يسوع
  rationale: السياق يبين أن المرجع هو يسوع، لكن الأصل يستعمل ضميرًا؛ لذلك حُفظ الضمير في المتن وأُوضح مرجعه في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «وإذا برجال» لحيوية السرد، و«يحاولون» لنقل المحاولة المستمرة بصورة مألوفة، مع الحفاظ على ضمير الأصل في آخر الآية.
