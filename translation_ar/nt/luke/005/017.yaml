  naturalness: النص فصيح عمومًا، لكن «لكي يشفي هو» ثقيلة قليلًا في العربية الحديثة. وإظهار المرجع بالاسم في هذه الجملة يزيل اللبس المحتمل مع «الرب» من غير تغيير للمعنى.
  terminology: «فريسيون»، و«معلّمو الشريعة»، و«قدرة الرب» اختيارات سليمة وواضحة. وتبقى «أورشليم» الصيغة العربية المألوفة.
