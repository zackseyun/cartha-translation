- from: وفي أحد الأيام، كان يعلِّم، وكان فريسيون ومعلِّمو الشريعة جالسين هناك، وقد جاؤوا من كل قرية في الجليل واليهودية، ومن أورشليم. وكانت قدرة الرب حاضرة لكي يشفي هو[a].
  to: وحدث في أحد الأيام أنه كان يعلِّم، وكان فريسيون ومعلِّمو الشريعة جالسين هناك، وقد جاؤوا من كل قرية في الجليل واليهودية، ومن أورشليم؛ وكانت قدرة الرب حاضرة لكي يشفي يسوع[a].
  rationale: أُعيد فعل الحدث في افتتاح السرد لتمثيل ἐγένετο. وفي الخاتمة استُبدل الضمير المنفصل باسم يسوع لتكون العربية سلسة ولتتضح القراءة المعتمدة، التي تجعل αὐτόν فاعل المصدر، مع إبقاء المفعول غير مذكور كما في النص اليوناني. وعُدّلت الحاشية لتطابق صياغة المتن الجديدة وتحافظ على موضع الاختلاف النصي.
  reviewer_model: gpt-5.6-terra
