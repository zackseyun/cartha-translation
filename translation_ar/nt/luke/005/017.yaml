  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: ar
  text: وحدث في أحد الأيام أنه كان يعلِّم، وكان فريسيون ومعلِّمو الشريعة جالسين هناك، وقد جاؤوا من كل قرية في الجليل واليهودية، ومن أورشليم؛ وكانت قدرة الرب حاضرة لكي يشفي يسوع[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «ليشفيهم» بدلًا من «لكي يشفي يسوع».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: وفي أحد الأيام
  rationale: صياغة عربية طبيعية تؤدي وظيفة العبارة اللوقاوية في افتتاح مشهد جديد، من غير الإبقاء على تركيب زائد مثل «وحدث في أحد الأيام».
- source_word: αὐτὸς ἦν διδάσκων
  choice: كان يعلِّم
  rationale: ينقل البناء الدال على استمرار الفعل، ولا يحمّل الضمير αὐτός توكيدًا أقوى مما يقتضيه السياق.
- source_word: καθήμενοι
  choice: جالسين هناك
  rationale: يصور وجودهم المستقر في موضع التعليم، و«هناك» تتميم عربي طبيعي للمشهد دون إضافة تفسيرية مؤثرة.
- source_word: Φαρισαῖοι
  choice: فريسيون
  rationale: اللفظ العربي المستقر لاسم هذه الجماعة اليهودية.
- source_word: νομοδιδάσκαλοι
  choice: معلِّمو الشريعة
  rationale: ينقل معنى المركب اليوناني بوضوح إلى القارئ المعاصر، مع إبقاء المرجع إلى الشريعة اليهودية في سياقه.
- source_word: ἐληλυθότες
  choice: قد جاؤوا
  rationale: يعكس مجيئهم السابق وما نتج عنه من حضورهم في المشهد.
- source_word: ἐκ πάσης κώμης
  choice: من كل قرية
  rationale: يحافظ على القوة التوزيعية لـ πάσης وعلى معنى κώμη بوصفها قرية لا مدينة.
- source_word: Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: في الجليل واليهودية، ومن أورشليم
  rationale: يميّز في العربية بين القريتين الإقليميتين وبين مدينة أورشليم، مع الحفاظ على نطاق الأماكن المذكورة.
- source_word: δύναμις κυρίου
  choice: قدرة الرب
  rationale: يحافظ على الإضافة اليونانية وعلى دلالة القوة الإلهية الفاعلة، ويترجم κύριος باللفظ العربي المألوف «الرب».
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: كانت حاضرة لكي يشفي هو
  rationale: ينقل غرض/نتيجة التركيب، ويعامل αὐτόν بوصفه فاعل المصدر، أي إن يسوع هو الذي يشفي، من غير إضافة مفعول غير موجود في القراءة المعتمدة.
theological_decisions:
- issue: مرجع وقوة العبارة δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: قدرة الرب حاضرة لكي يشفي هو
  alternative: قدرة الرب حاضرة لتشفيه؛ أو قدرة الرب حاضرة ليشفيهم
  rationale: قراءة النص المقدَّم هي αὐτόν، والأرجح نحويًا أن يكون ضميرًا منصوبًا بوصفه فاعل المصدر، فيشير إلى يسوع باعتباره القائم بالشفاء. أُبقيت «هو» لإظهار هذه البنية، من غير جعل القدرة ذاتها فاعل الشفاء ومن غير إدخال «هم» في المتن.
- issue: مرجع κύριος
  choice: الرب
  alternative: السيد
  rationale: السياق يعرض قدرة إلهية عاملة في خدمة يسوع، و«الرب» يحفظ الرنين اللاهوتي للنص من غير تضييق المرجع أكثر مما تسمح به العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. روعي انسياب السرد، واستُعمل «الشريعة» بدل التعبير الحرفي الأثقل، مع إبقاء غرابة القراءة النصية الأخيرة بقدر تسمح به العربية ووضع علامة الحاشية عند موضع الاختلاف نفسه.
