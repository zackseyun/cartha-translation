- from: وأقام لاوي له وليمةً عظيمةً في بيته، وكان هناك جمعٌ كبيرٌ من جباة الضرائب وغيرهم، متكئين معهم على المائدة.[a]
  to: وأقام لاوي له وليمةً عظيمةً في بيته، وكان هناك جمعٌ كبيرٌ من جباة الضرائب وغيرهم، وهم متكئون[b] على المائدة معهم[a].
  rationale: يُحسَّن الربط النحوي بين «الجمع» وأفراده بإضافة «وهم»، مع المحافظة على ضمير الجمع في المتن وعدم حسم مرجعه. كما تُصحَّح الحاشية الثقافية لتكون وصفية غير متجاوزة للنص، وتُستعاد الحاشية النصية الخاصة بالضمير.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:02:13Z'
review_pass:
  verdict: revise
  source_fidelity: 'يحافظ النص المنقح على عناصر اليونانية كلها: لاوي هو صاحب الوليمة، و«له» تعود إلى يسوع، والوليمة في بيت لاوي، والحضور «جمع كبير» من جباة الضرائب وغيرهم، وفعل الاتكاء لتناول الطعام، وضمير الجمع في «معهم».'
  naturalness: صياغة «وكان هناك جمع كبير ...، وهم متكئون» أسلس وأدق نحويًا من تعليق «متكئين» مباشرة بعد «جمع»، مع بقاء الأسلوب فصيحًا معاصرًا.
  terminology: «وليمة عظيمة»، و«جباة الضرائب»، و«متكئون على المائدة» اختيارات واضحة ومناسبة. تُصاغ الحاشية الثقافية دون تقرير زائد بأنهم لم يكونوا يجلسون على كراسٍ، وتُضاف حاشية للضمير كما في مسار التدقيق الإنجليزي.
  issues:
  - severity: medium
    issue: تركيب «جمعٌ كبيرٌ من جباة الضرائب وغيرهم، متكئين معهم» يعلّق اسم الفاعل الجمعي بعد «جمع» بطريقة أقل سلاسة.
    rationale: اليونانية تصف أفراد الجمع بضمير جمع («الذين كانوا متكئين»). وإضافة «وهم» في العربية تجعل الإسناد إلى الأشخاص واضحًا وطبيعيًا.
  - severity: low
    issue: الحاشية الثقافية الحالية تتضمن مقارنة غير لازمة بالكراسي، ولا توجد حاشية تحفظ ملاحظة الضمير «معهم».
    rationale: المصدر يذكر وضع الاتكاء في الولائم، لا نفي كل جلوس على الكراسي. كما أن الحاشية النصية تبيّن أن اليونانية تستعمل ضمير الجمع مع إمكان فهم مرجعه سياقيًا.
  revised_text: وأقام لاوي له وليمةً عظيمةً في بيته، وكان هناك جمعٌ كبيرٌ من جباة الضرائب وغيرهم، وهم متكئون[b] على المائدة معهم[a].
