base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: ar
  text: وأقام لاوي له وليمةً عظيمةً في بيته، وكان هناك جمعٌ كبيرٌ من جباة الضرائب وغيرهم، وهم متكئون[b] على المائدة معهم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «معه». تقرأ اليونانية «معهم» بصيغة الجمع، وقد يُفهم مرجع الضمير بحسب السياق على نحو مختلف.'
    reason: alternative_reading
  - marker: b
    text: كان الاتكاء على المائدة هيئةً معتادةً لتناول الطعام في الولائم الرسمية في العالم المتوسطي القديم.
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: وليمةً عظيمةً
  rationale: تفيد العبارة وليمة أو مأدبة كبيرة يقيمها المضيف؛ و«وليمة عظيمة» واضحة وطبيعية وتحفظ دلالة الحدث البارز.
- source_word: αὐτῷ
  choice: له
  rationale: الضمير يعود إلى يسوع في السياق المباشر، والإبقاء عليه ضميرًا يحفظ ترابط النص اليوناني من غير إضافة الاسم.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: في بيته
  rationale: ترجمة مباشرة وطبيعية للعبارة، وضمير الملكية يعود إلى لاوي.
- source_word: ὄχλος πολὺς
  choice: جمعٌ كبيرٌ
  rationale: ينقل معنى كثرة المجتمعين بعبارة عربية فصيحة واضحة، من غير إيحاءات زائدة.
- source_word: τελωνῶν
  choice: جباة الضرائب
  rationale: تعبير عربي حديث واضح للوظيفة الاجتماعية المقصودة في سياق الأناجيل.
- source_word: ἄλλων
  choice: غيرهم
  rationale: يحفظ الإبهام والإيجاز في اليونانية، فلا يحدد هوية سائر الحاضرين.
- source_word: μετ’ αὐτῶν
  choice: معهم
  rationale: يحفظ صيغة ضمير الجمع في النص اليوناني، من غير حسم زائد لمرجعه.
- source_word: κατακείμενοι
  choice: متكئين ... على المائدة
  rationale: ينقل هيئة تناول الطعام المعتادة في الولائم القديمة، ويوضح أن الاتكاء كان عند الطعام لا للراحة العامة.
theological_decisions:
- issue: مرجع ضمير الجمع في μετ’ αὐτῶν
  choice: معهم
  alternative: معه
  rationale: قراءة SBLGNT هي ضمير الجمع، ولذلك تُحفظ في المتن. قد يلتبس مرجعه دلاليًا، لكن لا موجب نصيًا لتحويله إلى المفرد أو حصره في يسوع.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «جباة الضرائب» بدل ألفاظ تاريخية أقل وضوحًا، وحُفظ ضمير الجمع «معهم» كما في اليونانية. وُضع مؤشر الحاشية بعد العبارة التي تشرحها مباشرة.
