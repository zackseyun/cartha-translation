  terminology: «يمجِّد الله» مقابلة دقيقة لـ δοξάζων τὸν θεόν، و«بيته» مناسبة لـ οἶκος في هذا السياق. لا تفرض الترجمة تحديدًا غير موجود في العبارة اليونانية للشيء المحمول، وتأتي الحاشية لتقديم البديل التوضيحي بصورة منضبطة.
