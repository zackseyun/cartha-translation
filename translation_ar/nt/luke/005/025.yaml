  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: ar
  text: وفي الحال نهض أمامهم، وحمل ما كان مضطجعًا عليه[a]، ومضى إلى بيته وهو يمجِّد الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الفراش الذي كان مضطجعًا عليه». وحرفيًا: «ما كان مضطجعًا عليه».'
    reason: بديل معجمي يوضح الشيء المقصود مع الحفاظ في المتن على عدم تحديده في العبارة اليونانية.
lexical_decisions:
- source_word: παραχρῆμα
  choice: في الحال
  rationale: تدل الكلمة على وقوع الحدث بلا إبطاء، و«في الحال» تعبير عربي طبيعي يحفظ تأكيد لوقا على فورية الشفاء.
- source_word: ἀναστὰς
  choice: نهض
  rationale: صيغتها في اليونانية اسم فاعل دال على حدث سابق، لكن تحويلها إلى فعل تام في العربية يقدّم تسلسل الأفعال بوضوح وطبيعية.
- source_word: ἐνώπιον αὐτῶν
  choice: أمامهم
  rationale: ينقل العبارة بإيجاز ويحفظ معنى وقوع الحدث علنًا في حضورهم، من غير إضافة معنى «أمام أعينهم» غير المصرح به.
- source_word: ἄρας
  choice: حمل
  rationale: الفعل αἴρω يدل هنا على رفع الشيء وأخذه؛ و«حمل» تلائم السياق العربي وتجمع معنى الرفع والأخذ معه.
- source_word: ἐφ’ ὃ κατέκειτο
  choice: ما كان مضطجعًا عليه
  rationale: يحافظ هذا التعبير على صيغة الموصول في الأصل، الذي لا يذكر في هذه العبارة اسمًا صريحًا كالسرير أو الفراش.
- source_word: κατέκειτο
  choice: كان مضطجعًا
  rationale: تنقل صيغة الماضي الناقص حالته المستمرة السابقة، و«كان مضطجعًا» أفصح وأدق من تعبير قد يوحي بمجرد النوم.
- source_word: ἀπῆλθεν
  choice: مضى
  rationale: يفيد الفعل الذهاب والانصراف، و«مضى» سرد عربي طبيعي يحفظ حركة الابتعاد نحو البيت.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: إلى بيته
  rationale: «بيته» تنقل οἶκος طبيعيًا في هذا السياق، مع إمكان دلالتها على المسكن والمنزل.
- source_word: δοξάζων τὸν θεόν
  choice: وهو يمجِّد الله
  rationale: تحفظ «يمجِّد» دلالة إكرام الله وتعظيمه، وهي أوسع قليلًا من حصر الفعل في التسبيح اللفظي وحده؛ كما تنقل العبارة الحالية تزامن التمجيد مع ذهابه.
theological_decisions:
- issue: هل يُحدَّد الشيء الذي حمله بأنه فراش أو سرير في المتن؟
  choice: 'إبقاء صيغة الأصل العامة: «ما كان مضطجعًا عليه»، مع ذكر «الفراش» بوصفه بديلًا توضيحيًا في الحاشية.'
  alternative: «الفراش الذي كان مضطجعًا عليه» أو «السرير الذي كان مضطجعًا عليه».
  rationale: تستعمل هذه الآية نفسها عبارة موصولة ولا تذكر اسم الشيء صراحة. يحفظ المتن هذا القدر من عدم التحديد، بينما تساعد الحاشية القارئ على فهم المرجع في ضوء السياق من غير فرض تعيين زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُخدم «نهض» بدل تركيب حرفي ثقيل، وحُفظ تسلسل الأفعال وسرعة الحدث، كما وُضع مؤشر الحاشية مباشرة بعد العبارة التي تشرحها.
