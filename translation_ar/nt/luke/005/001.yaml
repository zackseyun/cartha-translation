lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وحدث
  rationale: صيغة لوقا السردية التي تُدخل حدثًا جديدًا؛ تمثل δέ تمثيلًا خفيفًا بالواو من غير إضافة ظرف زمان غير موجود في اليونانية.
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: فيما كان الجمع يزدحم عليه ويستمع
  rationale: التركيب بالمصدر المعرّف مع ἐν يفيد الزمن، وإبقاء الفعلين ظاهرين يحفظ كون الجمع يضغط عليه ويصغي في آن واحد.
- source_word: ὄχλον
  choice: الجمع
  rationale: لفظ عربي كتابي واضح ومألوف يدل على جمهور الناس المحتشد.
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: يزدحم عليه
  rationale: ينقل معنى اقتراب الجمع منه حتى الضغط عليه، بصياغة عربية طبيعية.
- source_word: ἀκούειν
  choice: يستمع
  rationale: يفيد الإصغاء المقصود، وهو الأنسب في سياق تلقي التعليم.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: كلمة الله
  rationale: يحفظ التعبير اللاهوتي الواسع والصدى الكتابي من غير حصره في معنى «الرسالة» وحده.
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: أنه كان واقفًا
  rationale: يعكس البناء المحيطي الدال على هيئة مستمرة، من غير تشديد مصطنع على الضمير αὐτός.
- source_word: παρὰ τὴν λίμνην
  choice: عند بحيرة
  rationale: صياغة عربية موجزة وطبيعية للموقع بمحاذاة البحيرة.
- source_word: Γεννησαρέτ
  choice: جَنِّيسارَت
  rationale: نقل صوتي للاسم الوارد في النص اليوناني بدل استبداله باسم تفسيري أو موازٍ.
theological_decisions:
- issue: ترجمة τὸν λόγον τοῦ θεοῦ
  choice: كلمة الله
  alternative: رسالة الله
  rationale: «كلمة الله» أقرب إلى اللفظ اليوناني وتحفظ اتساع الدلالة وروابط التعبير الكتابية، من غير فرض معنى أضيق.
- issue: معاملة اسم Γεννησαρέτ
  choice: جَنِّيسارَت
  alternative: بحر الجليل
  rationale: النص يسمي البحيرة جَنِّيسارَت؛ واستبدال الاسم ببحر الجليل يضيف توحيدًا تفسيريًا لا يرد في صياغة الآية.
