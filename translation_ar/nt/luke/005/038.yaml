translation:
  language: ar
  text: بل يجب أن توضع الخمر الجديدة في قِرَبٍ طريّة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الخمر الجديدة في قِرَب جديدة». يستعمل اليوناني صفتين مختلفتين: νέος («جديد»، ولا سيما من جهة الزمن) للخمر، وκαινός («جديد/طريّ»، ولا سيما من جهة النوع أو الحالة) للقِرَب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد الإضراب الانتقالي من التصرف غير الملائم في الآية السابقة إلى التصرف الواجب هنا، و«بل» طبيعية وموجزة في العربية.
- source_word: οἶνον νέον
  choice: الخمر الجديدة
  rationale: النعت νέον يدل هنا على الجِدّة من جهة الزمن، أي الخمر الحديثة الصنع، و«الخمر الجديدة» تعبير عربي واضح ومألوف.
- source_word: εἰς
  choice: في
  rationale: تدل εἰς على إدخال الخمر إلى الوعاء. ومع الفعل المبني للمجهول «توضع» تؤدي «في» هذا المعنى في العربية الطبيعية دون حاجة إلى تركيب أثقل.
- source_word: ἀσκοὺς
  choice: قِرَب
  rationale: المقصود أوعية مصنوعة من جلود الحيوانات لحفظ السوائل، ولا سيما الخمر. و«القِرَب» لفظ عربي واضح ودقيق لهذا الشيء.
- source_word: καινοὺς
  choice: طريّة
  rationale: يبرز καινός حداثة حال القِرَب وصلاحيتها، لا مجرد حداثتها زمنيا. وتوضح «طريّة» أنها لم تتيبس بعد، وتحافظ على الفرق بين νέος للخمر وκαινός للقِرَب.
- source_word: βλητέον
  choice: يجب أن توضع
  rationale: الصيغة اللفظية βλητέον تفيد اللزوم أو ما ينبغي فعله، و«يجب أن توضع» تنقل هذا المعنى بصياغة عربية واضحة.
theological_decisions:
- issue: التمييز بين νέος وκαινός في الجملة نفسها
  choice: ترجمة νέος بـ«الجديدة» وκαινός بـ«طريّة»
  alternative: ترجمة الصفتين كلتيهما بـ«الجديدة»
  rationale: استعمل النص اليوناني صفتين مختلفتين، والمثل قائم على ملاءمة القِرَب في حالتها للخمر الجديدة. تحافظ «طريّة» على هذا الفرق وتبين قابلية القِرَب للتمدد، من غير تحميل القول دلالة لاهوتية إضافية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «قِرَب» بوصفها تسمية مفهومة للأوعية الجلدية، واستعملت «طريّة» لإبراز صلاحية الجلد الجديد ومرونته مع الحفاظ على التمييز المعجمي في الأصل.
