base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: ar
  text: 'ولما رأى إيمانهم[a]، قال: «يا إنسان، قد غُفرت لك خطاياك[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ثقتهم»؛ واللفظ اليوناني يعني «الإيمان».
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «خطاياك مغفورة لك». والصيغة اليونانية تدل على حالة حاضرة ناتجة من فعل تم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ولما رأى
  rationale: ينقل اسم الفاعل اليوناني بصياغة عربية طبيعية تبين الارتباط الزمني من غير مبالغة في تحديد التعاقب.
- source_word: πίστιν
  choice: إيمان
  rationale: المعنى هنا هو الثقة التي أظهرها الرجل ومن كانوا معه، ولفظ «إيمان» هو المقابل العربي المألوف والمناسب للسياق.
- source_word: αὐτῶν
  choice: هم
  rationale: يحافظ ضمير الجمع على إبهام المرجع في اليونانية، فلا يحصر الإيمان في حاملي الرجل ولا في الرجل وحده.
- source_word: Ἄνθρωπε
  choice: يا إنسان
  rationale: ترجمة مباشرة للنداء اليوناني، وهي أفصح في العربية من «يا رجل» هنا، من غير إضافة معنى المودة الموجود في «يا صديقي».
- source_word: ἀφέωνταί
  choice: قد غُفرت
  rationale: صيغة الماضي المبني للمجهول مع «قد» تعبر طبيعيًا عن فعل تم وتثبت نتيجته الحاضرة، بما يلائم التام المبني للمجهول في اليونانية.
- source_word: ἁμαρτίαι
  choice: خطايا
  rationale: المقابل العربي المباشر والمألوف الذي يحفظ الدلالة الأخلاقية واللاهوتية.
- source_word: σοι ... σου
  choice: لك ... خطاياك
  rationale: يمثل كلاً من ضمير المفعول غير المباشر وضمير الملكية في صياغة عربية سليمة وطبيعية.
theological_decisions:
- issue: نطاق «إيمانهم»
  choice: الإبقاء على ضمير الجمع من غير تعيين أصحابه على نحو أضيق.
  alternative: أن يكون المقصود إيمان حاملي المشلول وحدهم، أو إيمان المشلول ومن معه جميعًا.
  rationale: النص اليوناني لا يحسم بدقة أفراد الجماعة المشار إليها، ولذلك ينبغي حفظ هذا الاتساع بدل تفسيره داخل الترجمة.
- issue: القوة الزمنية والتقريرية لعبارة الغفران
  choice: «قد غُفرت لك خطاياك» بوصفها إعلانًا لحالة الغفران الناتجة من فعل تام.
  alternative: «تُغفر لك خطاياك» أو «خطاياك مغفورة».
  rationale: التام المبني للمجهول يبرز نتيجة حاضرة لفعل مكتمل، لكنه لا يحسم وحده هل القول يُجري الغفران في تلك اللحظة أم يعلن غفرانًا حاصلًا؛ والصياغة المختارة تحفظ هذا التوتر قدر الإمكان.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يا إنسان» للمحافظة على النداء الصريح من غير استيراد مودة غير منصوص عليها، واستُعملت «قد غُفرت» لتحقيق التوازن بين دقة صيغة التام وطبيعية الأسلوب العربي.
