  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: ar
  text: 'فلما رأى سمعان بطرس ذلك، خرّ عند ركبتي يسوع، قائلًا: «ابتعد عني، لأني رجل خاطئ[a] يا رب».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لأن رجلًا خاطئًا أنا أكون، يا رب». يستعمل النص اليوناني لفظًا مذكرًا صريحًا بمعنى «رجل»، في إشارة إلى سمعان بطرس نفسه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: فلما رأى ... ما حدث
  rationale: اسم الفاعل الأوريستي يفيد الظرف الزمني هنا. والمفعول به محذوف في اليونانية ومفهوم من السياق، فأضيف «ما حدث» إشارة إلى صيد السمك العجيب من غير تفسير زائد.
- source_word: δὲ
  choice: فـ
  rationale: تؤدي الفاء الانتقال السردي والارتباط بما سبق بصورة طبيعية، من غير تشديد تباين لا يلزم من السياق.
- source_word: Σίμων Πέτρος
  choice: سمعان بطرس
  rationale: حُفظ الاسمان كما وردا في النص اليوناني.
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: ارتمى عند ركبتي يسوع
  rationale: «ارتمى» تنقل حركة السقوط المتجه نحو يسوع، و«عند ركبتي يسوع» تحفظ الصورة الجسدية الحية في الأصل.
- source_word: λέγων
  choice: قائلًا
  rationale: صياغة عربية فصيحة وطبيعية تحفظ دلالة الفعل المصاحب.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: ابتعد عني
  rationale: تنقل صيغة الأمر العاجلة وطلب الانفصال بلغة عربية واضحة وحديثة؛ و«اذهب عني» بديل حرفي ممكن لكنه أقل سلاسة هنا.
- source_word: ὅτι
  choice: لأني
  rationale: توضح علة طلب بطرس مباشرة وبأسلوب عربي طبيعي.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: رجل خاطئ
  rationale: تحفظ الاسم المذكر المفرد ἀνήρ لأنه يشير إلى بطرس نفسه، وتنقل الصفة ἁμαρτωλός بوصفها وصفًا له.
- source_word: κύριε
  choice: يا رب
  rationale: تحفظ «رب» التوقير والعمق اللاهوتي الممكن في نداء بطرس، دون أن تحسم مقدار فهمه الكامل لهوية يسوع في هذه اللحظة.
theological_decisions:
- issue: دلالة κύριε في خطاب سمعان بطرس ليسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: يأتي النداء في سياق رهبة واعتراف بالخطيئة عقب آية كاشفة؛ لذلك تحفظ «يا رب» الاحترام والدلالة اللاهوتية المحتملة. أما «يا سيدي» فقد تقصره على مجرد الاحترام، مع بقاء مقدار إدراك بطرس غير محسوم في النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة من غير تقعر. حافظت الصياغة على ترتيب الحدث ورد فعل بطرس، مع إيضاح المفعول المحذوف في «رأى» بما يقتضيه السياق. وُضعت علامة الحاشية بعد العبارة التي تشرحها.
