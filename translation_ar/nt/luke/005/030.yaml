  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: ar
  text: 'وكان الفريسيون وكتبتهم يتذمّرون[a]، قائلين لتلاميذه: «لماذا تأكلون وتشربون مع جباة الضرائب والخاطئين؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كانوا يتمتمون بالشكوى». قد يدل الفعل اليوناني على شكوى متمتمة، لا على اعتراض رسمي فحسب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: كانوا يتذمّرون
  rationale: تنقل صيغة الماضي الناقص معنى الفعل المستمر أو المتكرر، ويحفظ «يتذمّرون» دلالة الشكوى بصوت خافت أو على نحو ساخط.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: المقابل التاريخي المباشر والمألوف لهذه الفئة، من غير تحويل الترجمة إلى شرح لوظيفتهم.
- source_word: αὐτῶν
  choice: كتبتهم
  rationale: يُفهم الضمير بحسب التركيب اليوناني على أنه يربط الكتبة بالفريسيين، وتحفظ صيغة الإضافة هذه العلاقة بإيجاز.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: لدى تلاميذه
  rationale: تفيد πρός مع النصب اتجاه الكلام إلى التلاميذ؛ واستُعملت «لدى» هنا مع فعل التذمر لتجنب الإيحاء بأن التلاميذ أنفسهم هم موضوع التذمر، مع بقاء الخطاب موجّهًا إليهم.
- source_word: Διὰ τί
  choice: لماذا
  rationale: مقابل عربي طبيعي ومباشر للاستفهام عن السبب.
- source_word: τελωνῶν
  choice: جباة الضرائب
  rationale: تعبير واضح وشائع يدل على الفئة التاريخية المعنية ويحفظ دلالتها الاجتماعية في سياق الأناجيل.
- source_word: ἁμαρτωλῶν
  choice: الخاطئين
  rationale: مقابل مباشر يحفظ وصف الجماعة كما يرد على لسان المتكلمين، من غير تفسير إضافي لطبيعة خطاياهم أو مكانتهم.
- source_word: ἐσθίετε καὶ πίνετε
  choice: تأكلون وتشربون
  rationale: يحفظ الفعلين الملموسين وزمن الحاضر في السؤال، من غير اختزالهما في إعادة تفسير مثل «تشاركونهم المائدة».
- source_word: καὶ
  choice: و
  rationale: يحفظ رابط السرد البسيط في مطلع الآية على نحو طبيعي في العربية.
theological_decisions:
- issue: الدلالة الاجتماعية والدينية للأكل والشرب مع جباة الضرائب والخاطئين
  choice: إبقاء الاعتراض بصورته الملموسة من غير توسع تفسيري
  alternative: التصريح بأن الاعتراض يتعلق بنجاسة طقسية أو بإقرار أخلاقي
  rationale: النص يورد فئات المتكلمين وفعل مؤاكلة هؤلاء الناس من غير أن يحدد صراحة أساس الاعتراض؛ لذلك تُحفظ حدة التوتر الاجتماعي والديني من دون حسمه مذهبيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الكتبة» بوصفها التسمية التاريخية المألوفة، و«جباة الضرائب» للوضوح المعاصر. حافظت الصياغة على استمرار التذمر في الماضي وعلى الأكل والشرب بوصفهما فعلين صريحين.
