  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: ar
  text: 'فقال لهم: «لا تستطيعون أن تجعلوا ضيوف العرس[a] يصومون ما دام العريس معهم، أليس كذلك؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أبناء حجرة العرس»، وهو تعبير يشير إلى رفاق العريس أو ضيوف العرس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: لا تستطيعون... أليس كذلك؟
  rationale: السؤال المنفي بـμή يتوقع جوابًا بالنفي؛ وتحافظ هذه الصياغة العربية على قوته البلاغية بوضوح وطبيعية.
- source_word: τοὺς υἱοὺς τοῦ νυμφῶνος
  choice: ضيوف العرس
  rationale: هذا تعبير اصطلاحي يعني حرفيًا «أبناء حجرة العرس»، ويشير إلى رفاق العريس أو المشاركين في العرس؛ و«ضيوف العرس» تعبير عربي واضح وطبيعي.
- source_word: ὁ νυμφίος
  choice: العريس
  rationale: يحفظ صورة العرس بلفظ عربي معاصر ومفهوم، من غير إضافة تفسير لمدلولها المجازي.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: ما دام العريس معهم
  rationale: ينقل معنى وجود العريس في صحبتهم، وتلائم «ما دام» تركيب ἐν ᾧ الزمني في السياق.
- source_word: ποιῆσαι νηστεῦσαι
  choice: أن تُلزموا... بالصوم
  rationale: يحفظ المعنى السببي للفعل ποιέω مع المصدر، أي جعل الآخرين يصومون، بصياغة عربية طبيعية.
- source_word: νηστεῦσαι
  choice: بالصوم
  rationale: «الصوم» هو المقابل العربي المألوف والدقيق في هذا السياق الديني.
theological_decisions:
- issue: التعريف المجازي بيسوع بوصفه العريس
  choice: الإبقاء على صورة «العريس» من غير شرح مدلولها اللاهوتي في المتن
  alternative: التصريح بأن يسوع يعرّف نفسه بأنه العريس
  rationale: الآية تعرض الصورة وتترك للقارئ استيعاب دلالتها؛ والتوسيع التفسيري سيحسم ما أبقاه النص ضمنيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة الأسلوب. استُخدم «تُلزموا... بالصوم» لإظهار السببية، و«أليس كذلك؟» لإبراز أن السؤال يتوقع جوابًا بالنفي.
