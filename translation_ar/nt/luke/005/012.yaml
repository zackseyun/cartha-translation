source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: ar
  text: 'وحدث أنه، فيما كان يسوع في إحدى المدن، إذا رجلٌ مملوءٌ بالبرص[a]. فلما رأى الرجل يسوع، خرَّ على وجهه وتوسل إليه قائلًا: «يا رب، إن شئت، فأنت قادر أن تطهِّرني[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مغطّى بالبرص». تقول اليونانية حرفيًا «مملوء بالبرص»، تشديدًا على شدة حالته. وكان لفظ «البرص» قديمًا يشمل أمراضًا جلدية متنوعة، ولا يقتصر بالضرورة على المرض المعروف طبيًا اليوم بهذا الاسم.
    reason: lexical_alternative
  - marker: b
    text: أو «تجعلني طاهرًا». يمكن أن يدل الفعل على التطهير جسديًا وطقسيًا واجتماعيًا، لا على الشفاء الطبي وحده.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: وحدث
  rationale: يحافظ على صيغة لوقا السردية في عبارة عربية واضحة وموجزة.
- source_word: ἐν τῷ εἶναι αὐτὸν
  choice: فيما كان يسوع
  rationale: يصوغ تركيب المصدر المعرّف بوصفه جملة زمنية طبيعية، ويصرّح بمرجع الضمير منعًا للالتباس في العربية.
- source_word: μιᾷ τῶν πόλεων
  choice: إحدى المدن
  rationale: تنقل العبارة من غير أن تفترض حجمًا حضريًا محددًا لا يوجبه النص اليوناني.
- source_word: ἰδοὺ
  choice: إذا بـ
  rationale: تحافظ «إذا» الفجائية على حيوية المشهد والمفاجأة بأسلوب عربي فصيح طبيعي.
- source_word: πλήρης λέπρας
  choice: ممتلئ برصًا
  rationale: يحافظ التعبير على صورة «الامتلاء» التي تشدد على تفاقم الحالة، مع استعمال «البرص» بوصفه المقابل الكتابي المألوف.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: خرَّ على وجهه
  rationale: ينقل هيئة السقوط على الوجه بما توحي به من التذلل والإلحاح، في تعبير عربي فصيح ومفهوم.
- source_word: ἐδεήθη αὐτοῦ
  choice: توسل إليه
  rationale: يعبر عن شدة الطلب والضراعة من غير مبالغة.
- source_word: Κύριε
  choice: يا رب
  rationale: يحفظ معنى الخطاب الموقر وإمكان صداه المسيحاني، من غير حسم ما يثبته السياق المباشر وحده.
- source_word: ἐὰν θέλῃς
  choice: إن شئت
  rationale: ينقل معنى الإرادة بصياغة عربية موجزة وطبيعية، ولا يوحي بأن الرجل يشك في قدرة يسوع.
- source_word: δύνασαί με καθαρίσαι
  choice: فأنت قادر أن تطهِّرني
  rationale: يحفظ معنى القدرة ولغة التطهير، بما فيها أبعادها الجسدية والطقسية والاجتماعية.
theological_decisions:
- issue: دلالة λέπρα وκαθαρίζω في سياق الشفاء
  choice: البرص / تطهِّرني
  alternative: مرض جلدي / تشفيني
  rationale: لغة الأصل لا تقتصر على العلاج الطبي، بل تستعمل التطهير بما يحمله من أبعاد طقسية واجتماعية. ولفظ «البرص» مألوف كتابيًا، مع التنبيه إلى أن المصطلح القديم أوسع من التشخيص الطبي الحديث.
- issue: دلالة κύριος في خطاب يسوع
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» تحفظ الاحترام وإمكان الدلالة المسيحانية، من غير أن تفرض على المشهد وحده إقرارًا لاهوتيًا مفصلًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية موقرة. استُعملت «إذا» الفجائية لإبراز ظهور الرجل، وحُفظت لغة «البرص» و«التطهير» مع شرح اتساع مدلولها القديم. وُضعت علامتا الحاشيتين عند اللفظين اللذين تفسرانهما مباشرة.
