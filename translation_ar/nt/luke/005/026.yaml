source:
  edition: SBLGNT
  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: ar
  text: 'واستولى الذهول عليهم جميعًا، وكانوا يمجّدون الله، وامتلأوا خوفًا وهم يقولون: «لقد رأينا اليوم أمورًا خارقةً للمألوف[a]».


    [a] أو «أمورًا غير عادية» أو «أمورًا غريبة»؛ تدل الكلمة اليونانية على أمور تتجاوز ما هو متوقَّع عادةً.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أمورًا غير عادية» أو «أمورًا غريبة»؛ تدل الكلمة اليونانية على أمور تتجاوز ما هو متوقَّع عادةً.
    reason: بدائل معجمية توضّح مجال معنى παράδοξα من غير حصره في تعبير عربي واحد.
lexical_decisions:
- source_word: ἔκστασις
  choice: الذهول
  rationale: يدل الاسم هنا على دهشة طاغية بسبب ما حدث، لا على معنى «النشوة» الصوفية الشائع في بعض الاستعمالات الحديثة.
- source_word: ἔλαβεν ἅπαντας
  choice: استولى ... عليهم جميعًا
  rationale: ينقل هذا التعبير قوة الصورة اليونانية، أي أن الذهول أمسك بالجميع، بصياغة عربية طبيعية.
- source_word: ἐδόξαζον
  choice: أخذوا يمجّدون
  rationale: يحافظ على دلالة الفعل وعلى صيغة الماضي الناقص التي تصوّر التمجيد فعلًا مستمرًا في ذلك الموقف.
- source_word: τὸν θεόν
  choice: الله
  rationale: المقابل العربي المعياري في هذا السياق.
- source_word: ἐπλήσθησαν φόβου
  choice: امتلأوا خوفًا
  rationale: ترجمة مباشرة تحافظ على صورة الامتلاء وعلى لفظ الخوف، من غير اختزاله تفسيريًا في المهابة وحدها.
- source_word: λέγοντες
  choice: وهم يقولون
  rationale: صياغة عربية طبيعية للمشاركة التي تمهّد لمضمون القول.
- source_word: Εἴδομεν
  choice: لقد رأينا
  rationale: ينقل الفعل الماضي مع إبراز صلته بردّ فعل المتكلمين الحاضر تجاه ما شاهدوه لتوّهم.
- source_word: παράδοξα
  choice: أمورًا خارقةً للمألوف
  rationale: يدل اللفظ على أمور تخالف التوقع المعتاد. وهذه الصياغة تحافظ على معنى الاستثنائية من غير الإيحاء بالاستنكار أو إدخال معنى فلسفي لـ«المفارقة».
- source_word: σήμερον
  choice: اليوم
  rationale: مقابل زمني مباشر يحفظ فورية شهادة الحاضرين.
theological_decisions:
- issue: دلالة φόβος في الاستجابة لفعل إلهي
  choice: الخوف
  alternative: المهابة
  rationale: يحمل المشهد رهبةً تعبديةً واضطرابًا أمام سلطان يسوع العجيب. والإبقاء على «الخوف» يصون هذا التوتر بدل تلطيفه تفسيريًا إلى «المهابة» وحدها.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقّرة. استُعمل «استولى الذهول» للحفاظ على حيوية العبارة، و«أخذوا يمجّدون» لإظهار استمرار الفعل، مع إبقاء «الخوف» كما في الأصل. وُضع مؤشر الحاشية بعد العبارة التي تشرحها مباشرةً.
