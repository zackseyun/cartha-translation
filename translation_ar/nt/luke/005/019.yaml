  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: ar
  text: ولمّا لم يجدوا سبيلًا لإدخاله بسبب الحشد، صعدوا إلى السطح وأنزلوه مع فراشه الصغير عبر قرميد السقف إلى الوسط أمام يسوع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: عبر قرميد السقف. وتعكس عبارة لوقا سقفًا مغطّى بالقرميد.'
    reason: cultural_note
lexical_decisions:
- source_word: ποίας εἰσενέγκωσιν
  choice: سبيلًا لإدخاله
  rationale: 'التركيب اليوناني موجز، ومعناه: بأي سبيل أو كيف يُدخلونه. «سبيلًا لإدخاله» عربية طبيعية وتحفظ دلالة طريق الوصول دون حصرها في الكيفية المجرّدة.'
- source_word: διὰ τὸν ὄχλον
  choice: بسبب الجمع
  rationale: διά مع النصب هنا سببية؛ فالجمع هو العائق، لا الطريق الذي حاولوا المرور عبره.
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: صعدوا إلى السطح
  rationale: ينقل حركة الصعود إلى سطح البيت بعبارة عربية واضحة ومألوفة.
- source_word: διὰ τῶν κεράμων
  choice: من بين القرميد
  rationale: يشير κέραμοι إلى قرميد السقف. و«من بين القرميد» ينقل أنهم أنزلوه عبر فتحة في موضع القرميد، من غير إضافة فعل صريح لنزع السقف لا يرد في الآية.
- source_word: καθῆκαν
  choice: دلّوه
  rationale: الفعل يدل على الإنزال من أعلى. «دلّوه» مناسب لحركة إنزال شخص محمول من السطح إلى داخل البيت.
- source_word: σὺν τῷ κλινιδίῳ
  choice: مع فراشه الصغير
  rationale: κλινίδιον تصغير يدل على سرير أو فراش صغير. يحفظ هذا الاختيار دلالة التصغير ويتجنب الإيحاء الطبي الحديث الملازم أحيانًا لكلمة «نقالة».
- source_word: εἰς τὸ μέσον
  choice: إلى الوسط
  rationale: ينقل موضعه في وسط المجتمعين بصياغة عربية موجزة.
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: أمام يسوع
  rationale: 'الدلالة مكانية بوضوح: وضعوه في الموضع المقابل ليسوع.'
theological_decisions: []
