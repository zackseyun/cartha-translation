  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: ar
  text: 'فمدَّ يده ولمسه قائلًا: «أريد، فاطهُرْ». وفي الحال فارقه البرص[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بمعنى أوسع: «مرض جلدي». فقد يدل اللفظ اليوناني λέπρα في الاستعمال الكتابي على طائفة من الأمراض الجلدية الخطيرة، لا على داء هانسن الحديث وحده.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: مدَّ يده
  rationale: تعبير عربي طبيعي يحافظ على الحركة الجسدية التي يصفها اسم الفاعل اليوناني السابق للفعل الرئيس.
- source_word: ἥψατο αὐτοῦ
  choice: لمسه
  rationale: ينقل المعنى المباشر للفعل مع تحويل المجرور اليوناني إلى مفعول به مباشر كما تقتضي العربية.
- source_word: εἰπών
  choice: قائلًا
  rationale: يحافظ على البنية الحالية المصاحبة للفعل الرئيس، وهو فصيح وطبيعي في هذا السياق.
- source_word: Θέλω
  choice: أريد
  rationale: يفيد الإرادة والاستعداد استجابةً لطلب الرجل، من غير تحويله إلى مجرد فعل مستقبل.
- source_word: καθαρίσθητι
  choice: اطهُرْ
  rationale: يحافظ على معنى الطهارة والتطهير، الذي يشمل الشفاء الجسدي والبُعد المتعلق بالنجاسة، بدل اختزاله في «اشفَ».
- source_word: εὐθέως
  choice: في الحال
  rationale: تعبير عربي واضح وطبيعي يدل على وقوع الأمر فورًا.
- source_word: ἡ λέπρα
  choice: البرص
  rationale: المقابل الكتابي العربي المألوف، مع إيضاح اتساع مدلول اللفظ اليوناني القديم في الحاشية.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: فارقه
  rationale: صياغة عربية موجزة وطبيعية تحافظ على صورة زوال المرض عنه.
theological_decisions:
- issue: دلالة καθαρίσθητι في شفاء المصاب بالبرص
  choice: فاطهُرْ
  alternative: فاشفَ؛ فتطهَّر
  rationale: اختير لفظ الطهارة لأنه يصون تداخل الشفاء الجسدي مع رفع النجاسة الطقسية والاجتماعية، من غير حصر العبارة في الجانب الطبي وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. نُقلت علامة الحاشية إلى «البرص» لأنها تشرح هذا اللفظ تحديدًا، لا عبارة «مدَّ يده».
