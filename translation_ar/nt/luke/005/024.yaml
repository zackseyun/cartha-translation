reference: Luke 5:24
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: ar
  text: 'ولكن لكي تعلموا أن لابن الإنسان[a] سلطانًا على الأرض أن يغفر الخطايا—قال للمشلول: «أقول لك: قم، واحمل فراشك[b]، واذهب إلى بيتك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الإنسان». أُبقي لقب «ابن الإنسان» لأنه التعبير الذي يستعمله يسوع عن نفسه ويحمل أصداءً كتابية مهمة، ولا سيما في دانيال 7.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «سريرك الصغير» أو «حصيرك». تشير الكلمة اليونانية إلى فراش صغير أو مضجع خفيف يمكن حمله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: ولكن لكي
  rationale: تحفظ «لكن» الانتقال المقابل الخفيف الذي تفيده δέ، وتعبّر «لكي» عن الغرض الذي تدخله ἵνα بصياغة عربية طبيعية.
- source_word: εἰδῆτε
  choice: تعلموا
  rationale: تنقل معنى المعرفة واليقين في οἶδα مباشرة، والخطاب بصيغة الجمع كما في اليونانية.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: تحافظ على اللقب الذي يستعمله يسوع عن نفسه وعلى صداه الكتابي، ولا تختزله في تفسير واحد.
- source_word: ἐξουσίαν ἔχει
  choice: له سلطان
  rationale: «سلطان» يعبّر عن الحق والصلاحية، لا عن القدرة المجردة فحسب، ويلائم سياق غفران الخطايا.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: ترجمة مكانية مباشرة تحافظ على إيجاز العبارة من دون توسيع تفسيري.
- source_word: ἀφιέναι ἁμαρτίας
  choice: أن يغفر الخطايا
  rationale: هذا هو المعنى السياقي المباشر للفعل ἀφίημι في الجدل المتعلق بغفران الخطايا.
- source_word: τῷ παραλελυμένῳ
  choice: للمشلول
  rationale: صياغة عربية واضحة وموجزة للاسم المشتق الدال على الرجل المصاب بالشلل.
- source_word: Σοὶ λέγω
  choice: أقول لك
  rationale: تحفظ توكيد الضمير اليوناني والمخاطبة المباشرة ذات النبرة الجازمة.
- source_word: ἔγειρε
  choice: قم
  rationale: أمر عربي طبيعي وفصيح ينقل الدعوة إلى النهوض الفوري.
- source_word: ἄρας
  choice: احمل
  rationale: في السياق يدل αἴρω على رفع الفراش وحمله؛ و«احمل» واضحة من غير تكلّف.
- source_word: κλινίδιόν σου
  choice: فراشك
  rationale: κλινίδιον سرير صغير أو مضجع خفيف؛ و«فراش» لفظ عربي مرن يلائم الشيء القابل للحمل.
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: اذهب إلى بيتك
  rationale: ترجمة مباشرة وطبيعية لأمر الحركة ووجهته.
theological_decisions:
- issue: ترجمة ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: الإبقاء على الصيغة اللقبية يحفظ استعمال يسوع لها وصداها المحتمل في دانيال 7، مع عدم حسم كل أبعادها الدلالية.
- issue: دلالة ἐξουσία في غفران الخطايا
  choice: سلطان
  alternative: قدرة
  rationale: السياق يتناول حق يسوع وصلاحيته في غفران الخطايا، لا مجرد امتلاكه قوة لفعل معجزة.
- issue: مدلول ἐπὶ τῆς γῆς
  choice: على الأرض
  alternative: في العالم الأرضي
  rationale: تحفظ العبارة المباشرة التوتر الدلالي في النص ولا تضيف تحديدًا تفسيريًا غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «سلطان» لما فيه من معنى الحق والصلاحية، واحتُفظ بلقب «ابن الإنسان». وُضعت علامتا الحاشيتين [a] و[b] في المتن، مع تجنب الشرح المذهبي أو حسم مواطن الغموض.
