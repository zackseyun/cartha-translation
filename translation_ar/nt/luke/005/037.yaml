  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: ar
  text: ولا يضع أحدٌ خمرًا جديدةً في قِرَبٍ قديمة[a]؛ وإلا فإن الخمر الجديدة ستشقّ القِرَب، وتنسكب الخمر نفسها[b]، وتتلف القِرَب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي أوعية جلدية قديمة كانت تُستعمل لحفظ الخمر.
    reason: lexical_clarification
  - marker: b
    text: 'أو: «تُهرَق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: يضع
  rationale: الفعل عامّ يدل على الوضع أو الإدخال؛ و«يضع» يحافظ على عموم اللفظ اليوناني من غير أن يضيف معنى الصب.
- source_word: οἶνον νέον
  choice: خمرًا جديدة
  rationale: تعبير عربي طبيعي يحفظ معنى الخمر الحديثة العهد في سياق التخمّر.
- source_word: ἀσκοὺς παλαιούς
  choice: قِرَبٍ قديمة
  rationale: القِربة وعاء مصنوع من الجلد يُستعمل لحفظ السوائل، وهي المقابل العربي الواضح في هذا السياق.
- source_word: εἰ δὲ μήγε
  choice: وإلا
  rationale: تنقل بإيجاز ووضوح نتيجة مخالفة القول السابق.
- source_word: ῥήξει
  choice: شقَّت
  rationale: الفعل متعدٍّ، والخمر الجديدة هي الفاعل الذي يمزق القِرَب؛ و«شقّت» تحافظ على هذه العلاقة النحوية والصورة المادية.
- source_word: ἐκχυθήσεται
  choice: انسكبت
  rationale: المبني للمجهول اليوناني يفيد خروج الخمر وضياعها عند تمزق القِرَب؛ و«انسكبت» هو التعبير العربي الطبيعي في السياق.
- source_word: ἀπολοῦνται
  choice: تلفت
  rationale: بالنسبة إلى الأوعية، يدل الفعل على هلاكها أو فقدان صلاحيتها؛ و«تلفت» طبيعي ودقيق دون إيحاء بالفناء الحرفي.
- source_word: καὶ αὐτός
  choice: وانسكبت هي
  rationale: أُثبت ضمير الفصل المنفصل «هي» لإظهار توكيد αὐτός وإرجاعه إلى الخمر.
- source_word: οὐδεὶς
  choice: لا ... أحد
  rationale: صياغة عربية معيارية واضحة تحافظ على النفي المطلق والنبرة المَثَلية.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «قِرَب» لأنها تسمية عربية مألوفة للأوعية الجلدية، مع حاشية توضيحية. حوفظ على كون الخمر الجديدة فاعل «شقّت»، وعلى توكيد الضمير في καὶ αὐτός.
