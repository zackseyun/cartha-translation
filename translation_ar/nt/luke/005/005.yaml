id: LUK.5.5
reference: Luke 5:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: ar
  text: 'فأجاب سمعان: «يا معلّم، كدحنا[a] طوال الليل ولم نصطد شيئًا، ولكن بناءً على كلمتك[b] سأُنزل الشباك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تعبنا بجهد». يدل اللفظ اليوناني على بذل جهد شاق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «على كلمتك» أو «بسبب كلمتك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: فأجاب
  rationale: هذا تركيب يوناني مألوف لتقديم الكلام المباشر، وتؤديه العربية طبيعيًا بفعل واحد من غير العبارة الحرفية الثقيلة «أجاب قائلًا».
- source_word: Ἐπιστάτα
  choice: يا معلّم
  rationale: لقب لوقاوي يدل على الاعتراف بسلطة يسوع وإشرافه. «يا معلّم» نداء عربي طبيعي هنا، ولا يحمّل اللفظ معنى «الرب» الخاص بـκύριος.
- source_word: δι’ ὅλης νυκτός
  choice: طوال الليل
  rationale: تعبير عربي طبيعي يحفظ دلالة استمرار العمل خلال الليل كله.
- source_word: κοπιάσαντες
  choice: كدحنا
  rationale: ينقل معنى الجهد الشاق الذي يؤكده الفعل اليوناني، بلفظ عربي واضح وموجز.
- source_word: οὐδὲν ἐλάβομεν
  choice: لم نصطد شيئًا
  rationale: في سياق الصيد يدل λαμβάνω على الإمساك بالسمك؛ وصيغة «لم نصطد شيئًا» طبيعية وتوضح المفعول المفهوم من السياق دون زيادة معنوية.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: ولكن بناءً على كلمتك
  rationale: يحفظ معنى أن كلمة يسوع هي الأساس الذي سيعمل سمعان بناءً عليه، مع إبقاء قدر من سعة العلاقة التي قد تُفهم أيضًا بمعنى «على كلمتك» أو «بسبب كلمتك».
- source_word: χαλάσω
  choice: سأُنزل
  rationale: الفعل هنا يعني إنزال الشباك إلى الماء، وهذه هي الصياغة العربية المباشرة الطبيعية.
- source_word: τὰ δίκτυα
  choice: الشباك
  rationale: يحفظ صيغة الجمع في النص اليوناني، والسياق يغني عن إضافة «شباك الصيد».
- source_word: δὲ
  choice: ولكن
  rationale: تُظهر المقابلة المعتدلة بين فشل الجهد السابق واستعداد سمعان للعمل وفق كلمة يسوع.
theological_decisions:
- issue: ترجمة لقب يسوع Ἐπιστάτα
  choice: يا معلّم
  alternative: يا سيّد
  rationale: المصدر يستعمل ἐπιστάτης لا κύριος. يعبّر «يا معلّم» عن سلطة يسوع المعترف بها في المشهد من غير أن يستبق الدلالة المسيحانية الأوسع التي قد يوحي بها «يا سيّد» أو «يا رب».
- issue: أساس إنزال الشباك في ἐπὶ τῷ ῥήματί σου
  choice: بناءً على كلمتك
  alternative: على كلمتك / بسبب كلمتك
  rationale: الصياغة المختارة تُبقي كلمة يسوع أساس استجابة سمعان، من غير أن تحصر العبارة في معنى سببي أو آلي واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت جملة مباشرة طبيعية، مع الحفاظ على الجمع في «الشباك» وعلى المقابلة بين الكدح غير المثمر والاستجابة لكلمة يسوع. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما.
