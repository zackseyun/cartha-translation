source:
  edition: SBLGNT
  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: ar
  text: لكن الخبر عنه كان ينتشر أكثر[a]، وكانت جموع كثيرة تجتمع لتسمع ولتُشفى من أمراضها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكلام عنه»، أو: «النبأ عنه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διήρχετο
  choice: كان ينتشر
  rationale: صيغة الماضي الناقص تصف انتشارًا مستمرًّا، وصياغة «كان ينتشر» تنقل هذا الجانب بوضوح وطبيعية.
- source_word: μᾶλλον
  choice: أكثر فأكثر
  rationale: تحفظ القوة المقارِنة والتصاعدية للفظ في سياق ازدياد انتشار الخبر.
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: الخبر عنه
  rationale: يدل λόγος هنا على الخبر المتداول بشأن يسوع، لا على استعمال لاهوتي اصطلاحي لكلمة «الكلمة»؛ وتُذكر البدائل الممكنة في الحاشية.
- source_word: συνήρχοντο
  choice: كانت ... تجتمع
  rationale: تنقل صيغة الماضي الناقص معنى الاجتماع المتكرر أو المستمر للجموع.
- source_word: ὄχλοι πολλοὶ
  choice: جموع كثيرة
  rationale: ترجمة مباشرة وطبيعية تحفظ جمع ὄχλοι ودلالة πολλοὶ على كثرة الجموع.
- source_word: ἀκούειν
  choice: لتسمع
  rationale: المصدر يفيد الغرض، ويُبقي مفعول السماع محذوفًا كما في اليونانية.
- source_word: θεραπεύεσθαι
  choice: لتُشفى
  rationale: تحفظ المبني للمجهول ومعنى نيل الشفاء من غير إضافة تفسيرية.
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: من أمراضها
  rationale: في سياق الشفاء تشير ἀσθένειαι إلى العلل الجسدية، و«من أمراضها» عربية واضحة وتحفظ دلالة ἀπό.
theological_decisions:
- issue: طبيعة لغة الشفاء
  choice: صياغة العبارة بوصفها شفاءً من الأمراض الجسدية
  alternative: استخدام تعبير أوسع مثل «لتستعيد عافيتها» قد يوحي باسترداد شامل أو روحي
  rationale: السياق المباشر يتحدث عن أمراض وشفاء، ولا يصرّح هنا بشفاء روحي؛ لذلك لا تُضاف دلالة لاهوتية غير منصوص عليها.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. استُخدم «أكثر فأكثر» لإبراز التزايد، وحُفظ توازي غرضي الاجتماع: السماع والشفاء.'
