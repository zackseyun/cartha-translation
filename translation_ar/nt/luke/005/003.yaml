  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: ar
  text: ثم صعد إلى أحد القوارب، وكان ذلك القارب لسمعان، وطلب منه أن يُبعِد القارب قليلًا عن البر[a]. ثم جلس يعلِّم الجموع من القارب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عن الشاطئ». يقول اليوناني حرفيًا: «عن البر»، في مقابلة بين القارب واليابسة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: ركب
  rationale: ينقل فعل الدخول إلى القارب بصياغة عربية طبيعية وموجزة، مع بقاء الحدث سابقًا للفعل الرئيس.
- source_word: πλοίων / πλοίου
  choice: القوارب / القارب
  rationale: السياق يتحدث عن قوارب صيد في البحيرة، ولفظ «قارب» أنسب من «سفينة»، مع مراعاة العدد في كل موضع.
- source_word: ὃ ἦν Σίμωνος
  choice: وكان لسمعان
  rationale: يحافظ على دلالة الملكية في المضاف إليه اليوناني بصياغة عربية واضحة غير متكلفة.
- source_word: ἠρώτησεν
  choice: طلب منه
  rationale: الفعل هنا يدل على الطلب، وإضافة «منه» توضّح أن المخاطَب هو سمعان كما في الضمير اليوناني.
- source_word: ἐπαναγαγεῖν
  choice: أن يُبعِد القارب
  rationale: ينقل في هذا السياق الملاحي معنى تحريك القارب بعيدًا عن اليابسة، مع إظهار المفعول المفهوم من السياق لتصفو العبارة العربية.
- source_word: ἀπὸ τῆς γῆς
  choice: عن البر
  rationale: «البر» يقابل وجود القارب على الماء ويحفظ المعنى الحرفي العام لـγῆ، بينما يرد «الشاطئ» في الحاشية بوصفه البديل السياقي.
- source_word: ὀλίγον
  choice: قليلًا
  rationale: يحفظ دلالة المسافة الصغيرة بإيجاز طبيعي.
- source_word: καθίσας
  choice: ثم جلس
  rationale: يصوغ اسم الفاعل الحدثي اليوناني فعلًا متتابعًا طبيعيًا في السرد العربي.
- source_word: ἐδίδασκεν
  choice: أخذ يعلِّم
  rationale: ينقل الجانب الاستمراري لصيغة الماضي الناقص اليونانية دون أن يجعل الفعل مجرد حدث منتهٍ.
- source_word: τοὺς ὄχλους
  choice: الجموع
  rationale: يحفظ صيغة الجمع ويستعمل لفظًا عربيًا فصيحًا واضحًا وأقل تقادمًا من بعض البدائل التقليدية.
