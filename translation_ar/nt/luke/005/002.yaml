  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: ar
  text: ورأى قاربين ثابتين عند البحيرة، وكان الصيادون، بعد أن نزلوا منهما، يغسلون الشباك.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: رأى
  rationale: ينقل فعل الرؤية في السرد ببساطة، من غير إضافة معنى الانتباه المفاجئ.
- source_word: δύο πλοῖα
  choice: قاربين
  rationale: «قارب» أنسب من «سفينة» لسياق الصيد في البحيرة.
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: راسيين عند البحيرة
  rationale: يعبّر عن كون القاربين ثابتين بمحاذاة البحيرة. «راسيين» عربية طبيعية في وصف القوارب، من غير الجزم بأنهما كانا مربوطين.
- source_word: οἱ δὲ ἁλιεῖς
  choice: وكان الصيادون
  rationale: تنقل δέ هنا بوصفها انتقالًا خفيفًا في المشهد، وهو أنسب في العربية من إظهار تضاد قوي بأداة «لكن».
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: قد نزلوا منهما
  rationale: يفيد النزول من القاربين، وتدل «قد» مع السياق على سبق هذا الفعل لعملية غسل الشباك.
- source_word: ἔπλυνον
  choice: أخذوا يغسلون
  rationale: يبرز الصيغة الناقصة بوصف الغسل عملًا جاريًا في المشهد.
- source_word: τὰ δίκτυα
  choice: الشباك
  rationale: يحافظ على أداة التعريف ولا يضيف ضمير الملكية غير المذكور صراحة في اليونانية.
theological_decisions: []
