  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: ar
  text: 'فأجابهم يسوع: «لا يحتاج الأصحّاء إلى طبيب، بل المرضى».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: فأجابهم يسوع
  rationale: يجمع هذا التعبير العربي الطبيعي بين اسم الفاعل وفعل القول في صيغة سردية واحدة، مع الحفاظ على معنى الاستجابة وعلى المخاطَبين.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: لا يحتاج
  rationale: صياغة عربية فصيحة وطبيعية تؤدي معنى «ليس لهم احتياج» من غير تكلّف.
- source_word: οἱ ὑγιαίνοντες
  choice: الأصحّاء
  rationale: يدل اسم الفاعل اليوناني المستعمل اسميًا على فئة الذين يتمتعون بالصحة؛ و«الأصحّاء» موجزة وواضحة.
- source_word: ἰατροῦ
  choice: إلى طبيب
  rationale: «طبيب» المقابل العربي الجاري والواضح لـ ἰατρός، وحرف الجر «إلى» تلزمه العربية مع فعل «يحتاج».
- source_word: οἱ κακῶς ἔχοντες
  choice: المرضى
  rationale: العبارة اليونانية اصطلاح يعني من تكون حالتهم الصحية سيئة، أي المرضى؛ والترجمة الحرفية ستكون غير طبيعية في العربية.
