  register: عربية فصحى حديثة، موجزة وكريمة النبرة، تحافظ على البنية المَثَلية والمقابلة بين الأصحّاء والمرضى. لا حاجة إلى حاشية لأن المقابل الاصطلاحي «المرضى» واضح ولا توجد هنا قراءة بديلة مؤثرة.
