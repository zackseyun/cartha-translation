  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: ar
  text: 'وكذلك كان يعقوب ويوحنا، ابنا زبدي، شريكين مع سمعان. فقال يسوع لسمعان: «لا تخف. فمن الآن فصاعدًا ستصطاد الناس أحياءً».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ستمسك الناس أحياءً». يدل الفعل اليوناني على الإمساك بشخص أو أخذه حيًّا، لا على مجرد الصيد.'
    reason: lexical_alternative
  - marker: b
    text: قارن متى 4:19 ومرقس 1:17، حيث ترد عبارة «صيادي الناس». أما لوقا فيستعمل هنا فعلًا مختلفًا، لذلك لم تُسوَّ عبارته بالصياغة الواردة هناك.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: وكذلك
  rationale: تؤدي معنى المقارنة والإضافة بعبارة عربية طبيعية، وتربط يعقوب ويوحنا بما سبق من دهشة سمعان.
- source_word: υἱοὺς Ζεβεδαίου
  choice: ابنا زبدي
  rationale: صياغة عربية موجزة وطبيعية، مع رفع «ابنا» لأنها بدل أو عطف بيان من الاسمين المرفوعين.
- source_word: κοινωνοὶ
  choice: شريكين
  rationale: السياق سياق عمل الصيد، ولذلك تدل الكلمة على شريكي عمل لا على مجرد رفيقين.
- source_word: Μὴ φοβοῦ
  choice: لا تخف
  rationale: تعبير عربي مباشر وطبيعي ينقل طمأنة يسوع لسمعان.
- source_word: ἀπὸ τοῦ νῦν
  choice: فمن الآن فصاعدًا
  rationale: يبين التحول الحاسم الذي يبدأ في هذه اللحظة، والفاء تصل القول بما قبله طبيعيًا.
- source_word: ἀνθρώπους
  choice: الناس
  rationale: المقصود البشر عامة لا الذكور وحدهم، و«الناس» أوضح تعبير عربي جامع في هذا السياق.
- source_word: ζωγρῶν
  choice: ستصطاد الناس أحياءً
  rationale: يحافظ على صورة الصيد وعلى الدلالة الخاصة للفعل، أي الإمساك بأحياء، من غير تسوية عبارة لوقا بعبارة «صيادي الناس» في المواضع الموازية.
theological_decisions:
- issue: صياغة استعارة ζωγρέω في دعوة سمعان
  choice: ستصطاد الناس أحياءً
  alternative: ستصطاد الناس؛ أو ستصير صيادًا للناس
  rationale: فعل لوقا يعني الأخذ أو الإمساك حيًّا، وهو يختلف عن صياغة متى 4:19 ومرقس 1:17. إبراز «أحياءً» يحفظ خصوصية اللفظ والتوتر في الاستعارة دون مواءمة النص مع المواضع الموازية.
- issue: دلالة ἀνθρώπους من جهة الجنس
  choice: الناس
  alternative: الرجال؛ البشر
  rationale: المرجع عام ويشمل البشر، فلا ينبغي حصره في الذكور بسبب الصيغة النحوية اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «شريكين» لدقة سياق العمل، و«الناس» للشمول، وحُفظت صياغة لوقا المميزة في «أحياءً». وُضعت علامتا الحاشيتين بعد الجملة التي تتناولانها.
