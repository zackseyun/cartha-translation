  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: ar
  text: لم آتِ لأدعو أبرارًا، بل خطاةً إلى التوبة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للتوبة». تفيد العبارة اليونانية الغرض أو الغاية.'
    reason: بديل معجمي لتركيب εἰς μετάνοιαν
lexical_decisions:
- source_word: ἐλήλυθα
  choice: آتِ
  rationale: صيغ الفعل اليوناني في الزمن التام، فيدل على مجيء ما زالت غايته قائمة. والتعبير العربي «لم آتِ» طبيعي في بيان الرسالة والغرض.
- source_word: καλέσαι
  choice: لأدعو
  rationale: المصدر اليوناني يبيّن الغرض من المجيء. و«أدعو» يحفظ مجال المعنى بين النداء والدعوة دون حصره في مجرد عرض أو أمر.
- source_word: δικαίους
  choice: أبرارًا
  rationale: الصفة مستعملة استعمال الاسم في الجمع، والترجمة بلا أداة تعريف طبيعية بعد «أدعو»، وتحفظ الفئة الأخلاقية والدينية من غير أن تحدد هل البر حقيقي أم منظور إليه اجتماعيًا.
- source_word: ἁμαρτωλοὺς
  choice: خطاةً
  rationale: ترجمة عربية مباشرة للاسم الدال على من يتصفون بالخطيئة، وتحفظ المقابلة الموجزة مع «أبرارًا».
- source_word: εἰς μετάνοιαν
  choice: إلى التوبة
  rationale: حرف الجر εἰς مع μετάνοιαν يدل على الغاية أو الهدف. و«إلى التوبة» تعبير عربي واضح وطبيعي، ويحفظ الاسم بدل تحويله إلى فعل.
theological_decisions:
- issue: هل ينفي يسوع وجود أبرار حقًا، أم يتحدث بحسب التصنيف الديني والاجتماعي الظاهر؟
  choice: الإبقاء على المقابلة المباشرة بين «أبرارًا» و«خطاةً» بلا قيد تفسيري.
  alternative: الذين يظنون أنفسهم أبرارًا / الذين يُعَدّون أبرارًا
  rationale: النص اليوناني نفسه لا يضيف قيدًا يدل صراحة على التهكم أو التصور الذاتي، لذلك تحافظ الترجمة على التوتر اللاهوتي ولا تحسمه بإضافة تفسير.
translation_notes:
  register: فصحى حديثة واضحة وموجزة ذات نبرة كتابية رصينة. استُخدمت «التوبة» لأنها المقابل العربي الطبيعي والدقيق لـ μετάνοια في هذا السياق، مع إثبات بديل الصياغة في الحاشية.
