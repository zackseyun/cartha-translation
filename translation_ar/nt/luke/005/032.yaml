  source_fidelity: 'الترجمة «لم آتِ لأدعو أبرارًا، بل خطاةً إلى التوبة» تنقل بدقة بنية اليونانية ومعناها: النفي مع الفعل التام ἐλήλυθα، وغرض المجيء في καλέσαι، والمقابلة غير المفسَّرة بين «الأبرار» و«الخطاة»، وغاية الدعوة في εἰς μετάνοιαν. ولا تضيف قيدًا تفسيريًا إلى «الأبرار».'
