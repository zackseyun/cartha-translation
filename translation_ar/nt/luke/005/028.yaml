base_translation:
  language: en
  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: ar
  text: وترك كلَّ شيء[a]، ونهض وتبعه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبعد أن ترك كلَّ شيء، نهض وتبعه».'
    reason: بديل نحوي يبرز أن الترك سبق النهوض والاتباع.
lexical_decisions:
- source_word: καταλιπὼν
  choice: ترك
  rationale: اسم فاعل ماضٍ يفيد أن الترك سبق الفعل الرئيس، و«ترك» عربية طبيعية لا تبالغ بإضافة معنى الهجر.
- source_word: πάντα
  choice: كلَّ شيء
  rationale: تنقل شمول صيغة المحايد الجمع، وتحافظ على إطلاق العبارة من غير تحديد ما تركه لاوي.
- source_word: ἀναστὰς
  choice: نهض
  rationale: اسم فاعل ماضٍ يُستعمل في السرد للنهوض بقصد الفعل، و«نهض» موجزة وفصيحة وواضحة.
- source_word: ἠκολούθει
  choice: تبعه
  rationale: الماضي الناقص يصور الاتباع بوصفه فعلًا ممتدًا، لكن الماضي البسيط في العربية يؤدي المعنى السردي طبيعيًا من غير فرض دلالة البدء التي لا يصرح بها اللفظ.
- source_word: αὐτῷ
  choice: ـه
  rationale: ضمير يعود إلى يسوع في السياق المباشر، وبذلك يُحفظ ترابط النص من غير تكرار الاسم.
- source_word: καὶ
  choice: و
  rationale: واو عطف بسيطة تحفظ اتصال الآية بما قبلها من غير إضافة معنى زمني أو سببي.
theological_decisions:
- issue: مدى تخلّي لاوي عند اتباع يسوع
  choice: الإبقاء على العبارة الشاملة «كل شيء» من غير تحديد دوام التخلي أو طبيعته
  alternative: تفسيرها بأنه ترك عمله مؤقتًا، أو بأنه تخلّى نهائيًا عن جميع ممتلكاته
  rationale: يشدد النص على الاستجابة الحاسمة لدعوة يسوع، لكنه لا يفصل هنا ما إذا كان التخلي دائمًا ولا ما الذي شمله على وجه التحديد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة سردية كريمة. استُعمل «نهض» بدل تعبير أطول، وحُفظ الضمير العائد إلى يسوع كما في اليونانية.
