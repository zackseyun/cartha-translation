    reason: lexical_alternative
lexical_decisions:
- source_word: καταγαγόντες
  choice: ولمّا أخرجوا
  rationale: اسم فاعل ماضٍ يدل على فعل سبق الفعل الرئيس؛ وتؤدي «ولمّا أخرجوا» هذا التعاقب بعبارة عربية طبيعية.
- source_word: τὰ πλοῖα
  choice: القوارب
  rationale: يمكن أن تدل اللفظة على السفن أو القوارب، لكن سياق الصيد في بحيرة الجليل يرجّح «القوارب».
- source_word: ἐπὶ τὴν γῆν
  choice: إلى البرّ
  rationale: المعنى الحرفي قريب من «على اليابسة»، و«إلى البرّ» تعبير عربي طبيعي لا يضيّق المعنى إلى الشاطئ وحده.
- source_word: ἀφέντες
  choice: تركوا
  rationale: يدل الفعل هنا على الترك وراءهم؛ وصياغته فعلاً معطوفاً واضحة وتحافظ على تتابع الأفعال.
- source_word: πάντα
  choice: كلّ شيء
  rationale: صيغة الجمع المحايد شاملة، و«كلّ شيء» تنقل قوة الشمول من غير تعيين ما تركوه أو مدة تركه.
- source_word: ἠκολούθησαν αὐτῷ
  choice: تبعوه
  rationale: تحفظ العبارة معنى السير وراءه وإيحاء التلمذة معاً من غير شرح زائد.
theological_decisions:
- issue: مدى الترك الذي تدل عليه πάντα
  choice: تركوا كلّ شيء
  alternative: تركوا الجميع / تركوا كلّ ما لهم
  rationale: يحافظ النص على شمول الترك، من غير أن يضيف أن المقصود ممتلكاتهم حصراً أو أن يحسم دوام هذا التخلي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «البرّ» في مقابل الماء، ووضعت علامات الحواشي في مواضعها داخل النص.
