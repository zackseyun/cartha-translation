  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: ar
  text: ولمّا أخرجوا القوارب إلى البرّ[a]، تركوا كلّ شيء[b] وتبعوه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
