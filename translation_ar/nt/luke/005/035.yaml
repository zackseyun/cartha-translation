  source_fidelity: 'النص العربي ينقل بنية القول اليوناني ومعناه بدقة: الاستقبال في «ستأتي أيام»، والتباين في «لكن»، والظرف المستقبلي في «وحين»، والمبني للمجهول في «يُنتزَع»، ثم النتيجة الزمنية في «عندئذ يصومون». كما يحافظ على التكرار المقصود لعبارة «في تلك الأيام».'
  naturalness: الصياغة عربية فصحى حديثة سليمة وواضحة ووقورة. «من بينهم» تعبير طبيعي يبين انفصال العريس عن جماعته، و«العريس» هو المقابل العربي المألوف في صورة العرس.
