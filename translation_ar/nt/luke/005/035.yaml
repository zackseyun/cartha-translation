id: LUK.5.35
reference: Luke 5:35
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: ar
  text: لكن ستأتي أيام، وحين يُنتزَع العريس من بينهم، عندئذ يصومون في تلك الأيام.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: ستأتي أيام
  rationale: يحافظ على التعبير اليوناني الاستشرافي بصياغة عربية طبيعية، مع إبقاء «أيام» نكرة كما في الأصل.
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا تقابليًا لطيفًا من الوضع الحاضر، حيث لا يصومون، إلى زمن الصوم الآتي.
- source_word: ὅταν
  choice: حين
  rationale: تقدّم الحدث المستقبلي الذي سيقع عنده الصوم، وهي طبيعية في هذا السياق.
- source_word: ἀπαρθῇ
  choice: يُنتزَع
  rationale: يحفظ صيغة المبني للمجهول وإيحاء الإزالة القسرية، بدل تصوير الأمر على أنه مجرد رحيل طوعي.
- source_word: ἀπ’ αὐτῶν
  choice: من بينهم
  rationale: يعبّر بوضوح عن فصل العريس عن الجماعة التي هو في وسطها.
- source_word: ὁ νυμφίος
  choice: العريس
  rationale: المقابل العربي الواضح والطبيعي لـνυμφίος، ويحفظ صورة العرس.
- source_word: τότε
  choice: عندئذ
  rationale: يحفظ الرابط الزمني والنتيجة التي تعقب انتزاع العريس.
- source_word: νηστεύσουσιν
  choice: يصومون
  rationale: ينقل المعنى الديني المحدد للفعل، لا مجرد الامتناع العادي عن الطعام.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: في تلك الأيام
  rationale: يحفظ التكرار والتوكيد الزمني الموجودين في اليونانية.
theological_decisions:
- issue: هل تُلطَّف صيغة المبني للمجهول في ἀπαρθῇ إلى مجرد رحيل؟
  choice: 'الإبقاء على المعنى القوي: «يُنتزَع العريس من بينهم»'
  alternative: «يرحل العريس عنهم» أو «يفارقهم العريس»
  rationale: الفعل اليوناني المبني للمجهول يوحي بأن العريس يُزال عنهم، لا بأنه يغادر فحسب. وتحفظ الصياغة هذا التوتر الاستباقي من غير أن تفسره صراحة بأنه موت يسوع.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظ ترتيب الجملة اليونانية وتكرار الإشارة إلى الأيام، مع استخدام «يُنتزَع» لإبراز قوة المبني للمجهول من غير إضافة تفسير عقائدي.
