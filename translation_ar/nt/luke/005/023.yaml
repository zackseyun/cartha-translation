source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: ar
  text: 'أيهما أيسر: أن تقول: «مغفورة لك خطاياك»، أم أن تقول: «قُم وامشِ»؟'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: أيهما أيسر
  rationale: صياغة عربية طبيعية تحفظ المقارنة الصريحة بين القولين.
- source_word: εἰπεῖν
  choice: أن تقول
  rationale: المصدر اليوناني يقدّم مضمون كل واحد من القولين، وهذه هي الصياغة العربية المباشرة.
- source_word: Ἀφέωνταί σοι αἱ ἁμαρτίαι σου
  choice: مغفورة لك خطاياك
  rationale: تحفظ العبارة حالة الغفران الناتجة عن فعل مكتمل، وتبقي المبني للمجهول دون تعيين الفاعل، مع ترتيب عربي واضح وفصيح.
- source_word: ἢ
  choice: أم
  rationale: لأنها تصل بين بديلين داخل سؤال تعييني مباشر.
- source_word: Ἔγειρε καὶ περιπάτει
  choice: قُم وامشِ
  rationale: أمران موجزان طبيعيان يدلان على النهوض والمشي الحرفي.
theological_decisions:
- issue: نقل صيغة الغفران التامة المبنية للمجهول دون زيادة تحديد لزمنها أو فاعلها
  choice: مغفورة لك خطاياك
  alternative: قد غُفرت لك خطاياك
  rationale: الصياغة المختارة تبرز الحالة الراهنة الناتجة عن الغفران، وتحفظ عدم التصريح بالفاعل كما في اليونانية، من غير تحميل الزمن دلالة عقائدية زائدة.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات نبرة كريمة. استُعمل «قُم» بدل تعبير عامي، و«أم» لأنها الأنسب للمفاضلة بين جوابين في استفهام واحد.
