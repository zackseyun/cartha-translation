  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: ar
  text: 'وقالوا له: «تلاميذ يوحنا يصومون كثيرًا ويقدّمون ابتهالات، وكذلك أتباع الفريسيين[a]، أما تلاميذك[b] فيأكلون ويشربون».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الذين للفريسيين»، وكلمة «تلاميذ» مفهومة من العبارة السابقة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أما الذين لك»، والمقصود تلاميذك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: فقالوا له
  rationale: الفاء تلائم استئناف الحوار في العربية، وتنقل وظيفة δέ بوصفها رابطًا خفيفًا من غير تضخيم معنى الاستدراك.
- source_word: μαθηταὶ Ἰωάννου
  choice: تلاميذ يوحنا
  rationale: تعبير عربي طبيعي ودقيق لعلاقة التلاميذ بيوحنا.
- source_word: νηστεύουσιν πυκνά
  choice: يصومون كثيرًا
  rationale: كثيرًا تنقل دلالة التكرار في πυκνά بلغة عربية واضحة، لا دلالة طول الصوم أو شدته.
- source_word: δεήσεις ποιοῦνται
  choice: يرفعون صلوات
  rationale: يحافظ هذا التعبير على القوة الاسمية لـ δεήσεις وعلى معنى ممارسة الدعاء، وهو أفصح وأطبع عربيًا من الترجمة الحرفية «يصنعون صلوات».
- source_word: ὁμοίως καὶ οἱ τῶν Φαρισαίων
  choice: وكذلك أتباع الفريسيين
  rationale: يفهم الاسم المحذوف من السياق. استُعمل «أتباع» في المتن لتجنب تركيب عربي مبهم، مع بيان الاحتمال الأدق «تلاميذ» في الحاشية.
- source_word: οἱ δὲ σοὶ
  choice: أما تلاميذك
  rationale: العربية لا تستسيغ هنا ترجمة الإضمار حرفيًا بـ«أما خاصتك»؛ لذلك صُرّح بالمقصود السياقي، مع توضيح الإيجاز اليوناني في الحاشية.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: فيأكلون ويشربون
  rationale: المضارع العربي يعبر طبيعيًا عن السلوك المتكرر المقابل للصوم.
theological_decisions:
- issue: التصريح بكلمة «تلاميذ» في العبارتين المحذوف منهما الاسم في اليونانية
  choice: استعمال «أتباع الفريسيين» و«تلاميذك» في المتن، مع توثيق الحذف اليوناني في الحاشيتين
  alternative: محاكاة الحذف بعبارتي «الذين للفريسيين» و«أما خاصتك»
  rationale: الحذف واضح في اليونانية بفضل البنية النحوية، لكنه ينتج في العربية تعبيرًا غامضًا أو غير طبيعي. التصريح بالمرجع لا يحسم مسألة لاهوتية، بل ينقل المعنى السياقي بوضوح مع إبقاء شفافية النص الأصلي في الحواشي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. اختيرت صياغة طبيعية للحوار مع الحفاظ على المقابلة بين كثرة الصوم والصلاة من جهة، والأكل والشرب من جهة أخرى. جميع علامات الحواشي مثبتة في المتن.
