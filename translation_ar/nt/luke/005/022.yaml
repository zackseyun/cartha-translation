  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: ar
  text: 'لكن يسوع أدرك أفكارهم، فأجابهم قائلًا: «لماذا تتفكرون في قلوبكم؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: أدرك
  rationale: ينقل معنى الوعي الواضح بما يدور في داخلهم، من غير أن يضيف تفسيرًا لكيفية هذه المعرفة.
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا مع مقابلة خفيفة بين اعتراضاتهم الباطنية واستجابة يسوع لها.
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: أفكارهم
  rationale: تعبير عربي طبيعي يشمل خواطرهم ومداولاتهم الداخلية في هذا السياق.
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: فأجابهم قائلًا
  rationale: يحافظ على عنصري الإجابة والقول في صياغة عربية فصيحة غير متكلفة.
- source_word: Τί
  choice: لماذا
  rationale: تؤدي الأداة هنا معنى السؤال عن سبب تفكيرهم، وهو الأنسب في العربية ضمن هذا التركيب.
- source_word: διαλογίζεσθε
  choice: تفكّرون هكذا
  rationale: ينقل فعل المداولة الذهنية المستمرة، وتوضح «هكذا» أن السؤال متعلق بمضمون الأفكار المذكورة في السياق.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: في قلوبكم
  rationale: يحفظ الصورة الكتابية للقلب بوصفه موضع الفكر والنية في الإنسان الباطن.
theological_decisions:
- issue: طبيعة معرفة يسوع بأفكار الآخرين الباطنية
  choice: «أدرك أفكارهم» من غير بيان وسيلة الإدراك
  alternative: التصريح بأنها معرفة خارقة، أو تخفيف العبارة إلى مجرد تخمين
  rationale: النص يقرر علم يسوع بمداولاتهم الداخلية، لكنه لا يشرح كيفية هذا العلم؛ لذلك تُحفظ دلالة النص وتوتره اللاهوتي بلا زيادة أو انتقاص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة سردية طبيعية، مع إبقاء التعبير الكتابي «في قلوبكم».
