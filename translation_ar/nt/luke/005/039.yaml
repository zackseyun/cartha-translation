  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: ar
  text: 'ولا أحد، بعدما يشرب الخمر العتيقة، يريد الجديدة، لأنه يقول: «العتيقة طيّبة».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «العتيقة أفضل».'
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: ولا أحد
  rationale: تعبير عام يشمل أي شخص، وصياغته طبيعية وواضحة في العربية المعاصرة.
- source_word: πιὼν
  choice: بعدما يشرب
  rationale: اسم الفاعل الأوريستي يدل هنا على فعل سابق للفعل الرئيس؛ و«بعدما يشرب» تنقل العلاقة الزمنية بسلاسة.
- source_word: παλαιὸν
  choice: الخمر العتيقة
  rationale: الموصوف «الخمر» مفهوم من السياق، وإظهاره في العربية يزيل اللبس. واختيار «العتيقة» يلائم الخمر المعتّقة ويحافظ على مقابلة القديم بالجديد.
- source_word: θέλει
  choice: يريد
  rationale: ينقل معنى الرغبة أو التفضيل بلفظ عربي شائع غير متكلف.
- source_word: νέον
  choice: الجديدة
  rationale: الصفة مؤنثة لأن «الخمر» مقدرة، مع إبقاء الاسم محذوفًا كما في اليونانية.
- source_word: λέγει γάρ
  choice: لأنه يقول
  rationale: ينقل γάρ بوصفها تعليلًا للجملة السابقة ويمهّد للكلام المباشر.
- source_word: Ὁ παλαιὸς
  choice: العتيقة
  rationale: أُبقي الموصوف «الخمر» محذوفًا اقتداءً بإيجاز الأصل، وهو واضح من السياق.
- source_word: χρηστός
  choice: طيّبة
  rationale: ينقل المعنى الوصفي «جيدة/مستساغة» من دون إدخال معنى المقارنة «أفضل» الذي لا تدل عليه قراءة النص المطبوع.
theological_decisions:
- issue: دلالة χρηστός في المثل عن الخمر العتيقة والجديدة
  choice: طيّبة
  alternative: أفضل
  rationale: النص اليوناني المطبوع يقرأ χρηστός، وهي صفة بمعنى «طيب/جيد» لا صيغة تفضيل. لذلك حُفظت القراءة المقارنة المعروفة في الحاشية ولم تُدخل في المتن؛ وهذا قرار لغوي نصي لا حسم عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة ومثلية موجزة. استُعملت «الخمر العتيقة» بدل «القديمة» لأنها أكثر طبيعية في وصف الخمر التي مضى عليها زمن، مع تجنب أي تفسير مذهبي للمثل.
