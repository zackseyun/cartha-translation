source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: ar
  text: فأمره ألّا يخبر أحدًا، بل أن يذهب فيُري نفسه للكاهن، ويقدّم عن تطهيره ما أمر به موسى[b]، شهادةً لهم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن فهم «شهادةً لهم» على أنها شهادة للكهنة أو لغيرهم، ويفهمها بعضهم بمعنى حجة عليهم.
    reason: alternative_reading
  - marker: b
    text: انظر اللاويين 14 بشأن ما أمر موسى بتقديمه للتطهير من البرص.
    reason: cross_reference
lexical_decisions:
- source_word: παρήγγειλεν
  choice: أوصاه
  rationale: ينقل توجيهًا مباشرًا ذا سلطة، من غير إضافة معنى التشديد الذي لا يصرّح به الفعل.
- source_word: μηδενὶ εἰπεῖν
  choice: ألّا يخبر أحدًا
  rationale: صياغة عربية طبيعية تحافظ على النهي المطلق عن إخبار أي شخص.
- source_word: ἀπελθὼν
  choice: أن يذهب
  rationale: يؤدي معنى الذهاب السابق لإراءة النفس للكاهن، مع تركيب عربي سلس ضمن الوصية غير المباشرة.
- source_word: δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: يري نفسه للكاهن
  rationale: ترجمة قريبة من اليونانية وتحافظ على فعل الإراءة والضمير المنعكس دون تفسير زائد.
- source_word: προσένεγκε
  choice: يقدّم
  rationale: يلائم السياق الشعائري ويمكن أن يشمل تقديم القربان المطلوب دون إضافة اسم غير مذكور صراحة.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: عن تطهيره
  rationale: يعبر عن الأمر الذي يتعلق به التقديم؛ و«التطهير» أنسب من «الشفاء» للسياق الطقسي.
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: ما أمر به موسى
  rationale: صياغة عربية واضحة تحافظ على الإحالة إلى الحكم الموسوي.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: شهادةً لهم
  rationale: تحافظ على إيجاز العبارة وعلى غموض مرجع الضمير وقوة الشهادة، فلا تحدد إن كانت لهم أو عليهم.
theological_decisions:
- issue: مرجع الضمير وقوة العبارة في εἰς μαρτύριον αὐτοῖς
  choice: شهادةً لهم
  alternative: شهادةً عليهم؛ أو شهادةً للكهنة
  rationale: النص اليوناني لا يحدد مرجع «لهم»، ولا يحسم ما إذا كانت الشهادة إثباتًا مقدمًا إليهم أم حجة عليهم؛ لذلك تُرك الغموض قائمًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الأسلوب غير المباشر بعد «أوصاه» لتوحيد بنية الوصية، مع إبقاء «شهادةً لهم» دون تعيين مرجع الضمير أو طابع الشهادة.
