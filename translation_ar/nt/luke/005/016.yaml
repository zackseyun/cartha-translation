  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: ar
  text: 'أَمَّا هُوَ فَكَانَ يَعْتَزِلُ فِي الْأَمَاكِنِ الْمُقْفِرَةِ وَيُصَلِّي[a].


    [a] ويمكن ترجمتها ترجمة أقرب إلى تركيب اليونانية: «أَمَّا هُوَ فَكَانَ مُعْتَزِلًا فِي الْأَمَاكِنِ الْمُقْفِرَةِ وَمُصَلِّيًا». يستعمل النص اليوناني فعلًا ناقصًا مع اسمَي فاعل، وهو تركيب يدل هنا على عمل مستمر أو معتاد.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويمكن ترجمتها ترجمة أقرب إلى تركيب اليونانية: «أَمَّا هُوَ فَكَانَ مُعْتَزِلًا فِي الْأَمَاكِنِ الْمُقْفِرَةِ وَمُصَلِّيًا». يستعمل النص اليوناني فعلًا ناقصًا مع اسمَي فاعل، وهو تركيب يدل هنا على عمل مستمر أو معتاد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: هُوَ
  rationale: الضمير مذكور صراحة في اليونانية ويحمل توكيدًا خفيفًا؛ ويحفظه تركيب «أَمَّا هُوَ» مع إبقاء الأسلوب العربي طبيعيًا.
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: تفيد الأداة انتقالًا مع مقابلة خفيفة بالسياق السابق، ويؤدي تركيب «أَمَّا هُوَ فَـ» هذا المعنى بوضوح.
- source_word: ἦν ὑποχωρῶν
  choice: كَانَ يَعْتَزِلُ
  rationale: ينقل صيغة الماضي الناقص مع اسم الفاعل معنى الفعل الجاري أو المتكرر في الماضي، كما أن «يعتزل» يعبر عن التنحي والابتعاد دون إضافة مقصد غير مذكور.
- source_word: ἐν ταῖς ἐρήμοις
  choice: فِي الْأَمَاكِنِ الْمُقْفِرَةِ
  rationale: يحفظ حرف الجر «في» وصيغة الجمع، ويعبّر عن المواضع الخالية غير المأهولة دون حصرها في صحراء ذات طبيعة جغرافية معينة.
- source_word: καὶ
  choice: وَ
  rationale: عطف بسيط بين الفعلين.
- source_word: προσευχόμενος
  choice: يُصَلِّي
  rationale: يرتبط بالفعل الناقص نفسه ويصف فعلًا جاريًا أو معتادًا مقارنًا للاعتزال؛ وصيغة المضارع بعد «كان» عربية طبيعية.
theological_decisions:
- issue: دلالة هيئة فعلَي الاعتزال والصلاة
  choice: يفيد النص عادة يسوع المتكررة في الاعتزال والصلاة، لا واقعة منفردة فقط.
  alternative: أن يكون النص وصفًا لواقعة واحدة من الاعتزال والصلاة.
  rationale: تركيب ἦν مع اسمَي الفاعل في صيغة الماضي الناقص يرجح الاستمرار أو التكرار. نُقل ذلك بصيغة «كان يعتزل ... ويصلي» من غير إضافة استنتاج عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعمل «الأماكن المقفرة» بدل «الصحاري» لتجنب الإيحاء بنوع جغرافي محدد، وحُفظ التوكيد الخفيف في αὐτός بتركيب «أما هو».
