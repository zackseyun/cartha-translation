base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: ar
  text: 'فقال: «لا، يا أبي إبراهيم، بل إن ذهب إليهم أحدٌ من بين الأموات[a]، فسيتوبون».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ببساطة: «من الأموات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐχί
  choice: لا
  rationale: نفي قوي في جواب مباشر، و«لا» هي الصياغة العربية الطبيعية التي تحفظ الاعتراض دون تكلّف.
- source_word: πάτερ Ἀβραάμ
  choice: يا أبانا إبراهيم
  rationale: نداء يحمل معنى الانتساب إلى إبراهيم بوصفه أبًا للسلالة؛ وإضافة ضمير الجماعة طبيعية في هذا السياق العربي.
- source_word: ἀλλ’ ἐάν
  choice: بل إن
  rationale: تحفظ تصحيح المتكلم واعتراضه على الكلام السابق، ثم تقدم الشرط.
- source_word: τις
  choice: أحدٌ
  rationale: تعبير عربي طبيعي عن المفرد غير المعيّن.
- source_word: ἀπὸ νεκρῶν
  choice: من بين الأموات
  rationale: تعكس ἀπό مع جمع «الأموات» وتبرز الخروج من وسطهم، مع بقاء البديل الأقصر ممكنًا.
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: ذهب إليهم
  rationale: يحفظ معنى الحركة نحوهم في فعل πορεύομαι مع πρὸς، ولا يحوّل المنظور إلى «جاء».
- source_word: μετανοήσουσιν
  choice: فسيتوبون
  rationale: «يتوبون» يؤدي المعنى الأخلاقي والروحي للفعل في سياق لوقا، ولا يحصره في مجرد تغيير فكري.
theological_decisions:
- issue: دلالة لغة التوبة
  choice: فسيتوبون
  alternative: فسيغيّرون تفكيرهم / فسيرجعون
  rationale: السياق يتحدث عن الاستجابة لإنذار الله بتحول أخلاقي وروحي؛ و«يتوبون» تحفظ هذا المعنى الكتابي المألوف دون فرض تفصيل مذهبي.
- issue: دلالة ἀπὸ νεκρῶν
  choice: من بين الأموات
  alternative: من الأموات
  rationale: الصياغة المختارة تُظهر إمكان فهم العبارة على أنها خروج شخص من وسط جماعة الأموات، مع إثبات البديل الموجز في الحاشية صونًا لاتساع التعبير اليوناني.
