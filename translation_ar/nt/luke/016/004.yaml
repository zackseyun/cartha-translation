  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: ar
  text: عرفتُ ماذا سأفعل، لكي إذا عُزلتُ من الوكالة يستقبلوني في بيوتهم.[أ]
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'أو: «إذا أُقِلتُ من الوكالة».'
    reason: بديل معجمي لـ μετασταθῶ ἐκ τῆς οἰκονομίας، يحافظ على دلالة فقدان المنصب.
lexical_decisions:
- source_word: ἔγνων
  choice: قد عرفتُ
  rationale: الماضي اليوناني هنا يفيد الوصول إلى إدراك أو قرار في اللحظة الراهنة؛ و«قد عرفتُ» طبيعي في العربية ضمن حديث النفس ويحافظ على صورة الفعل دون تحويله صراحةً إلى «قررتُ».
- source_word: τί ποιήσω
  choice: ماذا سأفعل
  rationale: صيغة الاحتمال التداولية تفيد سؤالًا تدبريًا انتهى إلى خطة؛ وصيغة المستقبل العربية تنقل هذا المعنى بوضوح.
- source_word: ἵνα ὅταν
  choice: حتى إذا
  rationale: تنقل الغاية مع الحدث المستقبلي المتوقع بأسلوب عربي طبيعي وموجز.
- source_word: μετασταθῶ ἐκ τῆς οἰκονομίας
  choice: عُزلتُ عن الوكالة
  rationale: الفعل المبني للمجهول يدل على الإبعاد من المنصب، و«الوكالة» هنا مسؤولية تدبير أملاك السيد، لا معنى اقتصاديًا مجردًا.
- source_word: δέξωνταί με
  choice: يستقبلونني
  rationale: يفيد الفعل قبول الشخص وإدخاله في إطار الضيافة؛ و«يستقبلونني» أوضح وأطبع عربيًا من «يقبلونني» في هذا السياق.
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: في بيوتهم
  rationale: المقصود أن يؤووه ويستضيفوه في بيوتهم؛ وحرف «في» طبيعي عربيًا مع فعل الاستقبال ويؤدي معنى الدخول المقصود في εἰς.
theological_decisions: []
