source:
  edition: SBLGNT
  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: ar
  text: كُلُّ مَنْ يُطَلِّقُ زَوْجَتَهُ وَيَتَزَوَّجُ أُخْرَى يَزْنِي، وَمَنْ يَتَزَوَّجُ امْرَأَةً مُطَلَّقَةً مِنْ زَوْجِهَا يَزْنِي.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: كُلُّ مَنْ
  rationale: ينقل صيغة التعميم في اليونانية بعبارة عربية فصيحة طبيعية، ويحفظ شمول الحكم.
- source_word: ἀπολύων
  choice: يُطَلِّقُ
  rationale: الفعل في هذا السياق الزوجي يدل اصطلاحًا على الطلاق، لا مجرد الإرسال أو الإطلاق.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: زَوْجَتَهُ
  rationale: تدل γυνή هنا على الزوجة بوضوح بسبب سياق الزواج والطلاق.
- source_word: γαμῶν
  choice: يَتَزَوَّجُ
  rationale: صيغة المضارع مناسبة للقول العام، وهذا هو المقابل العربي الطبيعي المباشر.
- source_word: ἑτέραν
  choice: أُخْرَى
  rationale: يحفظ معنى «أخرى/غيرها»، ويُفهم مؤنثها من سياق الزواج دون حاجة إلى إضافة «امرأة».
- source_word: μοιχεύει
  choice: يَزْنِي
  rationale: الفعل اليوناني يدل على ارتكاب الزنى؛ واللفظ العربي موجز وواضح ومتداول كتابيًا.
- source_word: ἀπολελυμένην
  choice: امْرَأَةً طَلَّقَهَا
  rationale: يحفظ دلالة اسم المفعول التام المبني للمجهول، أي امرأة واقعة في حالة الطلاق، مع صياغة عربية طبيعية.
- source_word: ἀπὸ ἀνδρὸς
  choice: زَوْجُهَا
  rationale: يفرض السياق الزوجي معنى «زوج» لا مجرد «رجل». وتحويل التعبير اليوناني الحرفي «من زوج» إلى جملة «طلّقها زوجها» يوضح جهة الطلاق في العربية دون تغيير المرجع.
theological_decisions:
- issue: نطاق قول يسوع عن الطلاق والزواج
  choice: صياغة القول حكمًا أخلاقيًا عامًا بلا إضافة استثناءات غير مذكورة في نص لوقا.
  alternative: إدخال استثناء مستفاد من متى، أو تقييد الحكم ضمنًا بحالات طلاق غير مشروع بعينها.
  rationale: النص في لوقا مطلق وموجز؛ لذلك تحفظ الترجمة توتره اللاهوتي ولا توفق بينه وبين نصوص أخرى داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «يزني» لأنها المقابل المباشر المألوف لـ μοιχεύει، وصيغ الشطران بصيغة المضارع لتناسب القول العام.
