review_pass:
  verdict: revise
  source_fidelity: يفي الشطر الأول بالنص اليوناني على نحو جيد. أمّا «طَلَّقَهَا زَوْجُهَا» في الشطر الثاني فتحدد الزوج فاعلًا للطلاق، في حين أن العبارة اليونانية ἀπολελυμένην ἀπὸ ἀνδρός تصف المرأة بأنها «مطلَّقة من زوج» ولا تصرّح بفاعل الإجراء. الأنسب الحفاظ على هذه الصيغة غير المحدِّدة للفاعل.
  naturalness: الصياغة فصيحة ومباشرة. وعبارة «امرأةً مُطَلَّقةً من زوجها» طبيعية في العربية المعاصرة، وتحفظ بنية الوصف دون إطالة.
  terminology: «زوجته»، «يتزوج»، و«يزني» ملائمة للسياق وللاستعمال الكتابي العربي؛ و«يزني» هو المقابل المتعارف عليه هنا لـ μοιχεύει، مع أن دلالته العربية العامة قد تكون أوسع في بعض الاستعمالات من «يرتكب الزنى الزوجي». لا يلزم إدخال تفسير مذهبي أو استثناءات غير واردة.
  issues:
  - severity: medium
    issue: تعيين الزوج فاعلًا للطلاق في «طَلَّقَهَا زَوْجُهَا».
    rationale: اسم المفعول اليوناني مع ἀπό («مطلَّقة من زوج») لا يحدد صراحةً أن الزوج هو الذي باشر الطلاق. الصياغة الحالية تضيف تحديدًا نحويًا غير مصرح به في المصدر، بينما «مطلقة من زوجها» تحفظ المعنى والسعة.
