  to: كُلُّ مَنْ يُطَلِّقُ زَوْجَتَهُ وَيَتَزَوَّجُ أُخْرَى يَزْنِي، وَمَنْ يَتَزَوَّجُ امْرَأَةً مُطَلَّقَةً مِنْ زَوْجِهَا يَزْنِي.
  rationale: عُدِّل الشطر الثاني فقط لاستعادة عدم تعيين فاعل الطلاق في اليونانية، مع إبقاء المعنى الزوجي الواضح والأسلوب العربي الطبيعي. لا تستلزم الآية حاشية عربية، ولا توجد أخطاء بنيوية قائمة يجب معالجتها.
