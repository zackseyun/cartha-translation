source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: ar
  text: وحدث أن مات الفقير، فحملته الملائكة إلى حضن إبراهيم[a]. ومات الغني أيضًا ودُفن.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إلى جوار إبراهيم». والتعبير اليوناني حرفيًا هو «إلى حضن إبراهيم»، وهي صورة تدل على القرب والتكريم والشركة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: وحدث أن
  rationale: صيغة سردية لوقوع الحدث؛ تنقل الانتقال الخفيف الذي تؤديه δέ من غير إضافة ظرف زمان صريح.
- source_word: ἀποθανεῖν τὸν πτωχὸν
  choice: مات الفقير
  rationale: تحويل التركيب اليوناني القائم على المصدر إلى جملة عربية طبيعية، مع إبقاء πτωχός بمعنى الفقير من دون استيراد وصف «المتسول».
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: فحملته الملائكة
  rationale: صياغة عربية طبيعية تُبقي الملائكة جهة الفعل وتحافظ على معنى الحمل، مع الفاء لربط الحدث بما سبقه.
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: إلى حضن إبراهيم
  rationale: يحفظ الصورة الأصلية في κόλπος، وهي تدل حرفيًا على الحضن وتوحي بالقرب والتكريم والشركة؛ ويُذكر البديل التفسيري في الحاشية.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: ومات الغني أيضًا
  rationale: يحفظ التوازي بين موت الرجلين، وتنقل «أيضًا» دلالة καί.
- source_word: ἐτάφη
  choice: دُفن
  rationale: ترجمة مباشرة موجزة للمبني للمجهول في الفعل اليوناني.
theological_decisions:
- issue: دلالة εἰς τὸν κόλπον Ἀβραάμ
  choice: إلى حضن إبراهيم
  alternative: إلى جوار إبراهيم
  rationale: تُبقي الترجمة صورة الحضن المحمّلة بدلالات القرب والتكريم والشركة، ولا تحسمها في تعبير عام عن الحياة بعد الموت؛ وتوضح الحاشية البديل الاصطلاحي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت جمل سردية موجزة، وحُفظت الصورة المجازية الأصلية مع شرحها في الحاشية.
