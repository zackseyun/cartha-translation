base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: ar
  text: 'فقال إبراهيم: «يا بُنَيَّ، تذكَّر أنك نلت خيراتك[a] في حياتك، ونال لعازر كذلك المتاعب؛ أما الآن فهو يُعزّى هنا، وأنت تتألّم[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «استوفيت خيراتك». قد يفيد الفعل اليوناني أن المرء تلقّى ما خُصِّص له أو استوفاه كاملًا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وأنت في عذاب». يمكن أن يدل الفعل اليوناني على ألم أو كرب شديد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: يا بُنَيَّ
  rationale: نداء رقيق يدل على المودة مع تفاوت المقام، ولا يلزم منه إثبات البنوة الجسدية. وهذه الصياغة طبيعية في العربية وتحافظ على جنس المخاطَب.
- source_word: μνήσθητι
  choice: تذكَّر
  rationale: أمر مباشر باستحضار ما مضى، وهو المقابل العربي الطبيعي للفعل اليوناني.
- source_word: ἀπέλαβες
  choice: نلت
  rationale: يفيد تلقي ما صار إلى الشخص، وقد يحتمل أيضًا معنى الاستيفاء؛ و«نلت» تحافظ على سعة الدلالة من غير إثقال النص.
- source_word: τὰ ἀγαθά σου
  choice: خيراتك
  rationale: تنقل الجمع الدال على ما كان نافعًا أو سارًّا، وتتجنب اللفظ اللاهوتي الأخص «بركاتك».
- source_word: ἐν τῇ ζωῇ σου
  choice: في حياتك
  rationale: تعبير عربي واضح يحدد زمن الحياة الأرضية.
- source_word: ὁμοίως
  choice: كذلك
  rationale: تحافظ على الموازاة المقابلة بين ما ناله الغني وما ناله لعازر.
- source_word: τὰ κακά
  choice: البلايا
  rationale: السياق يدل على المصائب والشدائد التي عاناها لعازر، لا على شرور أخلاقية ارتكبها. و«البلايا» موجزة وطبيعية في العربية الفصيحة.
- source_word: παρακαλεῖται
  choice: يتعزّى
  rationale: المبني للمجهول اليوناني يدل هنا على تلقي العزاء والراحة؛ وصيغة «يتعزّى» عربية طبيعية تؤدي هذا المعنى.
- source_word: ὧδε
  choice: هنا
  rationale: تنقل الإشارة المكانية المباشرة في المشهد.
- source_word: ὀδυνᾶσαι
  choice: تتألّم
  rationale: يدل الفعل على ألم أو كرب شديد. «تتألّم» واضحة وغير محمّلة بتفصيل عقائدي زائد، مع بيان البديل الأقوى في الحاشية.
theological_decisions:
- issue: صياغة ألم الغني بعد الموت
  choice: وأنت تتألّم
  alternative: وأنت في عذاب
  rationale: يثبت النص وجود معاناة واعية، لكن الفعل نفسه يسمح بالتعبير عن الألم أو الكرب ولا يقتضي اختيار لفظ عقائدي أشد. لذلك حُفظت سعة الدلالة، وأُثبت البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعمل «يا بُنَيَّ» لصون رقة النداء، و«خيراتك/البلايا» لإبراز المقابلة من غير تفسير زائد. وُضعت علامة الحاشية [a] في المتن عند موضع البديل المعجمي.
