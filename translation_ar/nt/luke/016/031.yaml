base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: ar
  text: 'فقال له: «إن لم يسمعوا موسى والأنبياء[a]، فلن يقتنعوا[c] ولو قام أحد من بين الأموات[b]».


    [a] يمكن أيضًا: «لا يصغون إلى موسى والأنبياء» أو «لا يستجيبون لهما». فالفعل اليوناني قد يشمل السماع والانتباه المستجيب معًا.

    [b] يمكن أيضًا: «من الأموات».

    [c] يمكن أيضًا: «فلن يُقنَعوا». والمعنى هو أنهم لن يقتنعوا، وليس بالضرورة أنهم «لن يؤمنوا» بالمعنى اللاهوتي الأضيق.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لا يصغون إلى موسى والأنبياء» أو «لا يستجيبون لهما». فالفعل اليوناني قد يشمل السماع والانتباه المستجيب معًا.'
    reason: lexical_alternative
  - marker: b
