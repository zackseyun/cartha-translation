    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: فقال له
  rationale: الفاء تستأنف الرد في سياق الحوار بسلاسة، وتؤدي هنا وظيفة δέ الانتقالية ذات المسحة التقابلية من غير إثقال العبارة.
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: لموسى والأنبياء
  rationale: يحافظ التعبير على الصيغة اليهودية المعروفة التي تشير إلى شهادة الأسفار المقدسة، من غير استبدالها بتفسير مثل «الكتب المقدسة».
- source_word: οὐκ ἀκούουσιν
  choice: لا يسمعون
  rationale: «يسمعون» تقابل ἀκούω مباشرة، ويمكنها في العربية بحسب السياق أن تشمل السماع المصحوب بالإصغاء والاستجابة.
- source_word: οὐδ’ ἐάν
  choice: فلن ... حتى إن
  rationale: 'ينقل هذا التركيب تصعيد النفي: لن يقع الاقتناع حتى في الحالة الاستثنائية المفترضة التالية.'
- source_word: τις
  choice: واحد
  rationale: يحفظ الإفراد وعدم التعيين في الضمير اليوناني، وهو تعبير عربي طبيعي في هذا السياق.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: ينقل حرف الجر ἐκ مع جمع «الأموات» بوضوح، ويحفظ إمكان فهم القيام من وسط جماعة الموتى.
- source_word: ἀναστῇ
  choice: قام
  rationale: صيغة الماضي بعد «إن» عربية فصيحة طبيعية للتعبير عن الشرط المفترض، والفعل «قام» ملائم للغة القيامة في السياق.
- source_word: πεισθήσονται
  choice: يقتنعوا
  rationale: ينقل المبني للمجهول دلاليًا بصيغة عربية طبيعية، ويحفظ معنى الاقتناع دون تضييقه إلى الإيمان الخلاصي أو التوبة.
theological_decisions:
- issue: دلالة «موسى والأنبياء»
  choice: الإبقاء على العبارة الكتابية «موسى والأنبياء» بوصفها إحالة إلى الشهادة الموثوقة المعطاة لإسرائيل
  alternative: تفسيرها في المتن بعبارة «الكتب المقدسة» أو حصرها في شخصين فقط
  rationale: السياق يجعلها كناية معروفة عن الشهادة الكتابية، لكن الإبقاء على الصيغة الأصلية يصون الصورة التاريخية ولا يحول الترجمة إلى شرح.
- issue: دلالة πεισθήσονται
  choice: لن يقتنعوا
  alternative: لن يؤمنوا أو لن يتوبوا
  rationale: الفعل يدل على الإقناع أو الاقتناع عامة، أما «يؤمنوا» و«يتوبوا» فتضيفان تحديدًا لاهوتيًا لا يصرح به اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع تركيب حواري طبيعي. استُعمل «يسمعون» لقربه من الأصل مع توضيح سعته الدلالية في الحاشية، و«يقتنعوا» لصون عموم معنى الفعل اليوناني. وُضعت جميع علامات الحواشي في المتن.
