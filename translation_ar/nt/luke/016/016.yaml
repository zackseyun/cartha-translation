  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: ar
  text: «كان الناموس والأنبياء إلى يوحنا؛ ومنذ ذلك الحين يُبشَّر بملكوت الله، وكلُّ واحد يشقّ طريقه إليه بقوة[a][b].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكلُّ واحد يندفع إليه». يمكن أن يدل الفعل اليوناني على حركة قوية أو ملحّة؛ وتحفظ صياغة المتن معنى شدة السعي إلى الدخول.'
    reason: lexical_alternative
  - marker: b
    text: يفهم بعضهم العبارة الأخيرة فهمًا سلبيًا في ضوء قول مشابه في متى 11:12، لكن الفاعل هنا في اليونانية هو «كل واحد»، لا «الملكوت».
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος καὶ οἱ προφῆται
  choice: الناموس والأنبياء
  rationale: تعبير كتابي مألوف يدل على الناموس الموسوي والكتب النبوية بوصفهما قسمين من الأسفار، لا على القانون والأنبياء الأفراد فحسب.
- source_word: μέχρι Ἰωάννου
  choice: إلى يوحنا
  rationale: يحافظ على الإيجاز وعلى معنى الحد الزمني؛ والمقصود بيوحنا يُفهم من السياق.
- source_word: ἀπὸ τότε
  choice: منذ ذلك الحين
  rationale: صياغة عربية طبيعية تنقل الانتقال الزمني واستمرار الحالة بعده.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: التعبير العربي الكتابي الشائع، وهو يحفظ مدى βασιλεία الدال على الملك والحكم معًا.
- source_word: εὐαγγελίζεται
  choice: يُبشَّر بـ
  rationale: ينقل صيغة المبني للمجهول ومعنى إعلان الخبر السار، ويجري طبيعيًا مع «ملكوت الله».
- source_word: πᾶς
  choice: كلُّ واحد
  rationale: يعكس المفرد ذا القوة التوزيعية بوضوح، من غير تقييد الجماعة المقصودة.
- source_word: εἰς αὐτὴν
  choice: إليه
  rationale: الضمير يعود إلى «ملكوت الله»، وحرف الجر ينقل اتجاه الحركة إلى الداخل.
- source_word: βιάζεται
  choice: يقتحم طريقه
  rationale: يحفظ معنى الحركة القوية أو الملحّة في الصيغة الوسطى/المبنية للمجهول، مع إبقاء البديل الأخف في الحاشية.
theological_decisions:
- issue: دلالة βιάζεται وعلاقتها بالملكوت
  choice: الفعل يصف كل واحد وهو يشق طريقه بقوة إلى الملكوت.
  alternative: كل واحد يندفع إليه؛ أو فهم العبارة سلبًا في ضوء متى 11:12 بوصفها عن العنف المتصل بالملكوت.
  rationale: في تركيب لوقا، «كل واحد» هو فاعل الفعل، و«إليه» تدل طبيعيًا على الحركة نحو الملكوت. أبقت الصياغة على عنصر القوة من غير تحويله إلى تعليم عن استحقاق دخول الملكوت بالجهد.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية موقرة. استُعمل «الناموس» و«ملكوت الله» لرسوخهما في الاستعمال العربي الكتابي، مع تجنب الألفاظ المذهبية أو الشروح العقائدية المضافة.
