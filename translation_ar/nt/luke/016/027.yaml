  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: ar
  text: 'فقال: «أطلب منك إذن، يا أبتِ، أن ترسله إلى بيت أبي».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δέ
  choice: فقال
  rationale: تفيد δέ هنا انتقالًا سرديًّا خفيفًا، وتؤديه الفاء في العربية بوضوح وطبيعية في سياق الحوار.
- source_word: Ἐρωτῶ
  choice: أرجوك
  rationale: الفعل ἐρωτάω يعني الطلب أو السؤال، وفي هذا السياق يدل على التماس جاد؛ و«أرجوك» تنقل قوة الطلب الطبيعية دون مبالغة «أتوسل إليك».
- source_word: σε οὖν
  choice: إذًا ... ـك
  rationale: تنقل «إذًا» قوة οὖν الاستنتاجية أو الانتقالية بعد الرفض السابق، ويتجسد المفعول σε في ضمير الخطاب المتصل بالفعل.
- source_word: πάτερ
  choice: يا أبتِ
  rationale: صيغة نداء عربية فصيحة وطبيعية للأب أو الجد، والمقصود في سياق المثل إبراهيم بوصفه أبًا للسلالة، لا الله.
- source_word: ἵνα πέμψῃς
  choice: أن ترسله
  rationale: بعد فعل الطلب، تعبّر ἵνα مع صيغة الالتزام عن مضمون الطلب؛ و«أن ترسله» تؤدي هذا التركيب مباشرة.
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير الغائب يعود إلى لعازر المذكور في السياق السابق.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: إلى بيت أبي
  rationale: تنقل «إلى» معنى الوجهة في εἰς، و«بيت أبي» تعبير عربي موجز وطبيعي قد يشمل المنزل والأسرة بحسب السياق.
theological_decisions:
- issue: دلالة πάτερ في المثل
  choice: يا أبتِ
  alternative: يا أبي / أيها الأب
  rationale: المتكلم يخاطب إبراهيم بصفته أبًا للسلالة. تحافظ الصياغة على هذا المعنى العائلي/النسبي ولا توحي بأنه يخاطب الله مباشرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «يا أبتِ» لصيغة النداء الكتابية المألوفة من غير غموض لاهوتي، و«أرجوك» لإظهار جدية الطلب مع تجنب المبالغة العاطفية.
