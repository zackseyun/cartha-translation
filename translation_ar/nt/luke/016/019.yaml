  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: ar
  text: وكان رجلٌ غنيٌّ يلبس الأرجوان والكتّان الناعم، ويتنعّم كلَّ يوم في ترفٍ وبهاء.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويقيم كلَّ يوم ولائم فاخرة». يمكن أن يدلّ εὐφραινόμενος على الابتهاج والتمتع أو إقامة الولائم، ويؤكد λαμπρῶς الفخامة والترف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις ἦν πλούσιος
  choice: وكان رجلٌ غنيٌّ
  rationale: تقدّم «كان» مع الواو انتقالًا سرديًّا طبيعيًّا، و«رجل» مع التنكير ينقل معنى τις من غير العبارة الثقيلة «رجل معيّن»، و«غني» يقابل πλούσιος مباشرة.
- source_word: ἐνεδιδύσκετο
  choice: يلبس
  rationale: المضارع بعد «كان» يؤدي معنى الماضي الاعتيادي الذي تدل عليه صيغة الماضي الناقص اليونانية.
- source_word: πορφύραν
  choice: الأرجوان
  rationale: يشير الاسم إلى ثياب مصبوغة بالأرجوان، وهي علامة ظاهرة على الثراء؛ ويفهم معنى الثياب من فعل «يلبس».
- source_word: βύσσον
  choice: الكتّان الناعم
  rationale: ينقل نوع النسيج وجودته الفاخرة في عبارة عربية واضحة.
- source_word: εὐφραινόμενος
  choice: يتنعّم
  rationale: يحفظ معنى التمتع والعيش في ابتهاج، ويلائم سياق الرفاه من غير حصر اللفظ في الولائم وحدها.
- source_word: καθ’ ἡμέραν
  choice: كلَّ يوم
  rationale: مقابل عربي مباشر وطبيعي للدلالة على التكرار اليومي.
- source_word: λαμπρῶς
  choice: في ترفٍ وبهاء
  rationale: يجمع بين دلالة الفخامة والبذخ في السياق ودلالة اللمعان والبهاء، من غير اختزالها في الطعام.
