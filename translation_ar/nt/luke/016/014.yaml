- issue: درجة الازدراء في ἐξεμυκτήριζον
  choice: يسخرون منه
  alternative: يستهزئون به بازدراء / يلوون شفاههم استهزاءً به
  rationale: «يسخرون منه» واضحة وطبيعية، بينما توضح الحاشية أن الفعل قد يدل على سخرية احتقارية ظاهرة، من غير إلزام النص بصورة جسدية واحدة.
