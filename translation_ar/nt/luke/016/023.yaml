  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ ᾅδῃ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ, ὑπάρχων ἐν βασάνοις, ⸀ὁρᾷ Ἀβραὰμ ἀπὸ μακρόθεν καὶ Λάζαρον ἐν τοῖς κόλποις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: ar
  text: وفي الهاوية[a]، رفع عينيه وهو في العذاب، فإذا هو يرى إبراهيم من بعيد، ولعازر في حضنه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عالم الموتى». واللفظ اليوناني هو «هاديس»، وهو غير «جهنم» التي تدل على موضع الدينونة النهائية.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «في أحضانه»؛ والتعبير التقليدي: «في حضن إبراهيم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: الهاوية
  rationale: يحافظ هذا اللفظ على التمييز بين ᾅδης، عالم الموتى في سياق الرواية، وبين جهنم بوصفها موضع الدينونة النهائية.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: رفع عينيه
  rationale: تعبير عربي طبيعي يحفظ الصورة الحسية الواضحة في الأصل.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: وهو في العذاب
  rationale: ينقل الحال الملازمة وشدة المعاناة دون إثقال العبارة بصيغة الجمع اليونانية الاصطلاحية.
- source_word: ὁρᾷ
  choice: فإذا هو يرى
  rationale: يحفظ المضارع القصصي الحي في اليونانية، وتعبير «فإذا هو» يجعله سائغًا وواضحًا في العربية.
- source_word: ἀπὸ μακρόθεν
  choice: من بعيد
  rationale: صياغة عربية موجزة وطبيعية تحافظ على معنى الانفصال المكاني.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: في حضنه
  rationale: ينقل التعبير الاصطلاحي الدال على القرب والأمان، مع إبقاء الضمير كما في الأصل وعدم استبداله صراحة باسم إبراهيم.
theological_decisions:
- issue: دلالة ᾅδης وعلاقتها بالحالة الوسيطة والدينونة النهائية
  choice: الهاوية
  alternative: الجحيم؛ عالم الموتى
  rationale: «الهاوية» تحافظ على المصطلح المتميز في النص اليوناني ولا تساويه تلقائيًا بجهنم أو تحسم طبيعة الحالة الموصوفة بما يتجاوز الآية.
- issue: صورة κόλπος المرتبطة بالتعبير التقليدي «حضن إبراهيم»
  choice: في حضنه
  alternative: في أحضانه؛ إلى جواره
  rationale: يحفظ هذا الاختيار صورة القرب الحميم في عبارة عربية مفهومة، كما يحافظ على مرجع الضمير وصياغة الأصل بدل إدخال تفسير زائد في المتن.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدم «فإذا هو يرى» للمحافظة على حيوية المضارع القصصي اليوناني، ووُضعت علامتا الحاشية عند اللفظين اللذين تشرحهما مباشرة.
