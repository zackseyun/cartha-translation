  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «الهاوية» لـᾅδῃ مع شرح يميزها من جهنم، و«رفع عينيه» للمشاركة ἐπάρας، و«وهو في العذاب» للحال ὑπάρχων ἐν βασάνοις، و«فإذا هو يرى» يحافظ على حيوية المضارع ὁρᾷ، و«من بعيد»، ثم صورة لعازر «في حضنه». لا يضيف المتن حكمًا عقائديًا يتجاوز الآية.'
