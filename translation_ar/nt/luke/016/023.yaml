  terminology: «الهاوية» اختيار عربي راسخ ومناسب لتمييز ᾅδης من «جهنم» دون اختزالها في مفهوم الدينونة النهائية. «العذاب» مناسب لـβασάνοις. وتُبقي الحاشية ب التعبير الحرفي «في أحضانه» والتقليدي «في حضن إبراهيم»، بينما يظل «في حضنه» في المتن عربيًا طبيعيًا ويحفظ الإحالة الضميرية.
