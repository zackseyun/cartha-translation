  text: λέγει ⸀δὲ Ἀβραάμ· Ἔχουσι Μωϋσέα καὶ τοὺς προφήτας· ἀκουσάτωσαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: ar
  text: 'فقال إبراهيم: «عندهم موسى والأنبياء[a]؛ فليستمعوا إليهم[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير عبارة «موسى والأنبياء» إلى الشهادة الواردة في الأسفار المرتبطة بموسى وكتب الأنبياء.
    reason: cross_reference
  - marker: b
    text: 'أو، بحرفية أكبر: «فليسمعوا منهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: فقال
  rationale: صيغ المضارع التاريخي في اليونانية بصيغة الماضي العربية الطبيعية في السرد، وأدّت الفاء انتقال الجواب وارتباطه بالسياق من غير إثقال بحرف استدراك قوي.
- source_word: Ἔχουσι
  choice: عندهم
  rationale: تعبير عربي طبيعي يفيد أن شهادة موسى والأنبياء متاحة لهم، مع الحفاظ على دلالة الحاضر.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: موسى والأنبياء
  rationale: حُفظ التعبير الموجز كما في اليونانية؛ وهو يستعمل موسى والأنبياء للدلالة على الشهادة الكتابية المرتبطة بهم، من غير توسيعه داخل المتن إلى «شريعة موسى» أو «الكتب».
- source_word: ἀκουσάτωσαν
  choice: فليستمعوا
  rationale: صيغة أمر للغائب الجمع؛ و«يستمعوا» توصل معنى الإصغاء والاستجابة أوضح من مجرد السماع العارض.
- source_word: αὐτῶν
  choice: إليهم
  rationale: الضمير عائد إلى موسى والأنبياء، وحرف الجر «إلى» ملائم للفعل «استمع» في العربية، مع بقاء المجاز الذي يجعل الاستماع إليهم استماعًا إلى شهادتهم.
theological_decisions:
- issue: المقصود بعبارة «موسى والأنبياء»
  choice: أُبقيت العبارة الحرفية بوصفها إحالة مجازية إلى الشهادة الكتابية المرتبطة بموسى والأنبياء.
  alternative: تفسيرها في المتن بعبارة «شريعة موسى وكتب الأنبياء»، أو قصرها على الأشخاص التاريخيين وحدهم.
  rationale: يحفظ النص صياغة الأصل وتوترها الدلالي، بينما توضح الحاشية الاستعمال الكتابي الشائع من غير إدخال التفسير في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «عندهم» لطبيعته في العربية، و«فليستمعوا إليهم» لإبراز قوة الأمر ومعنى الإصغاء، مع إبقاء العبارة الكتابية التقليدية «موسى والأنبياء» دون تفسير زائد في المتن.
