  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: ar
  text: فإن لم تكونوا أمناء في مال الظلم[a]، فمن يأتمنكم على الغنى الحقيقي[b]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «مامون الظلم»؛ و«مامون» لفظ يعني المال أو الثروة. ويمكن أيضًا: «المال غير البار».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «الحقيقي»؛ ولفظ «الغنى» مفهوم من المقابلة بمال الظلم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: في مال الظلم
  rationale: تحافظ العبارة على الدلالة الأخلاقية لـἀδίκῳ وعلى الصياغة السامية المألوفة «مال الظلم»، من غير حصر المعنى في مال مكتسب بالغش.
- source_word: πιστοὶ οὐκ ἐγένεσθε
  choice: لم تكونوا أمناء
  rationale: يناسب «أمناء» سياق الوكالة والتصرف المسؤول، ويؤدي التركيب اليوناني طبيعيًا في العربية.
- source_word: τὸ ἀληθινὸν
  choice: الغنى الحقيقي
  rationale: الصفة اليونانية مستعملة استعمال الاسم، والاسم المقدر يُفهم من مقابلتها بالمال؛ وإظهار «الغنى» يوضح المقابلة في العربية.
- source_word: πιστεύσει
  choice: يأتمنكم على
  rationale: الفعل هنا مع مفعول غير مباشر وشيء مؤتمن عليه يعني إيداع شيء لدى شخص والثقة به، لا مجرد التصديق.
theological_decisions:
- issue: مدلول «الحقيقي» في مقابل مال الظلم
  choice: الغنى الحقيقي
  alternative: الشيء الحقيقي؛ ما هو حقيقي
  rationale: يبقي التعبير دلالة القيمة الأصيلة في مقابل المال، مع التنبيه إلى أن لفظ «الغنى» مقدر وليس مذكورًا صراحة في اليونانية.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُعملت «مال الظلم» للمحافظة على حدة التعبير الأصلي، و«يأتمنكم على» لصياغة عربية طبيعية تلائم سياق الوكالة.
