source:
  edition: SBLGNT
  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: ar
  text: 'فاستدعاه وقال له: «ما هذا الذي أسمعه عنك؟ قدِّم حسابًا عن إدارتك[a]، لأنه لم يعد بإمكانك أن تتولى الإدارة[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قدِّم حسابًا عن وكالتك».'
    reason: يحمل اللفظ اليوناني معنى الإدارة، وقد يدل أيضًا على مسؤولية الوكيل أو منصبه.
  - marker: b
    text: 'أو: «لأنك لا تستطيع بعد الآن أن تعمل وكيلاً».'
    reason: يمكن أن يشير الفعل اليوناني إلى ممارسة الإدارة أو إلى القيام بعمل الوكيل.
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: فاستدعاه
  rationale: يفيد اسم الفاعل الأوريستي فعلًا سابقًا للفعل الرئيس؛ و«استدعاه» تنقل معنى دعوته للمثول أمامه بإيجاز طبيعي.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: ما هذا الذي أسمعه عنك؟
  rationale: تحافظ الصياغة على قوة السؤال الاستنكاري وعلى دلالة περὶ σοῦ من غير زيادة تفسيرية.
- source_word: ἀπόδος τὸν λόγον
  choice: قدِّم حسابًا
  rationale: يأتي λόγος هنا بمعنى الحساب الإداري المطلوب، وἀπόδος أمر بتقديمه أو تسليمه.
- source_word: τῆς οἰκονομίας σου
  choice: عن إدارتك
  rationale: تشير οἰκονομία في السياق إلى مسؤولية إدارة ممتلكات شخص آخر؛ و«إدارتك» واضحة وطبيعية بالعربية، مع بيان البديل المرتبط بمنصب الوكيل في الحاشية.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: لأنه لم يعد بإمكانك أن تتولى الإدارة
  rationale: تنقل العبارة معنى انتفاء الإمكان من الآن فصاعدًا، وتحافظ على الصلة الاشتقاقية والدلالية بين οἰκονομία وοἰκονομεῖν من دون إضافة مفعول غير مذكور.
theological_decisions: []
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ومهيبة. استُخدمت «الإدارة» في المتن لسلاستها ووضوحها، مع حفظ الدلالة الخاصة بدور الوكيل في الحواشي. تكرار الجذر الدلالي في «إدارتك/تتولى الإدارة» يعكس الصلة بين الاسم والفعل في اليونانية.
