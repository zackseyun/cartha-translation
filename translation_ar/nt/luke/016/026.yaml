  to: وفوق هذا كله[a]، قد ثُبِّتت بيننا وبينكم هوّة عظيمة، حتى إن الذين يريدون العبور من هنا إليكم لا يستطيعون، ولا يستطيعون العبور من هناك إلينا.
  rationale: أُبقيت صياغة الافتتاح الطبيعية التي تفيد الإضافة، وصورة الهوّة الثابتة، ومعنى العجز. وعُدّل الشق الأخير إلى ضمير يعود على الفاعل المفهوم في السياق، من غير إدخال عبارة تفسيرية («الذين هناك») لا يصرح بها الأصل، كما نُقّحت الحاشية لتقديم بديل عربي لا يحمل إيحاءً استدراكيًا غير مقصود.
