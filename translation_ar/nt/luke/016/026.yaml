base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: ar
  text: وفوق هذا كله[a]، قد ثُبِّتت بيننا وبينكم هوّة عظيمة، حتى إن الذين يريدون العبور من هنا إليكم لا يستطيعون، ولا يستطيعون العبور من هناك إلينا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إضافةً إلى هذا كله». يحتمل التعبير اليوناني صياغة أقرب إلى اللفظ، لكنه في السياق يقدّم اعتبارًا إضافيًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: وفوق هذا كله
  rationale: تعبير عربي طبيعي يفيد إضافة اعتبار آخر إلى ما سبق، مع إبقاء البديل الأقرب إلى البنية اليونانية في الحاشية.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: بيننا وبينكم
  rationale: ينقل العلاقة المكانية بوضوح، ويحفظ جمع ضمير المخاطبين في اليونانية.
- source_word: χάσμα μέγα
  choice: هوّة عظيمة
  rationale: «هوّة» لفظ عربي واضح يدل على فجوة عميقة فاصلة، و«عظيمة» تقابل μέγα دون مبالغة تفسيرية.
- source_word: ἐστήρικται
  choice: قد ثُبِّتت
  rationale: الماضي التام المبني للمجهول في اليونانية يدل على فعل تمّ وما زالت نتيجته ثابتة؛ وتؤدي الصياغة العربية معنى الاستقرار والدوام.
- source_word: ὅπως
  choice: حتى إن
  rationale: تصل ما قبلها بنتيجة الانفصال العملية هنا، مع عدم حصر الأداة اليونانية في غرض مقصود دون سواه.
- source_word: οἱ θέλοντες
  choice: الذين يريدون
  rationale: صياغة عربية طبيعية لاسم الفاعل المستعمل استعمالًا اسميًا.
- source_word: διαβῆναι
  choice: العبور
  rationale: ينقل معنى الانتقال من جانب إلى آخر بإيجاز ووضوح.
- source_word: ἔνθεν
  choice: من هنا
  rationale: يحفظ منظور المتكلم والإشارة إلى جانبه.
- source_word: μὴ δύνωνται
  choice: لا يستطيعون
  rationale: يعبّر عن العجز لا عن مجرد المنع.
- source_word: μηδὲ
  choice: ولا يستطيع
  rationale: يربط حالة العجز الثانية بالأولى ويحفظ التوازي بينهما.
- source_word: ἐκεῖθεν
  choice: من هناك
  rationale: يحفظ المقابلة الإشارية مع «من هنا».
- source_word: διαπερῶσιν
  choice: أن يعبروا
  rationale: ينقل اجتياز الفاصل دون تركيب عربي متكلف، ويحافظ على التوازي الدلالي مع فعل العبور الأول.
theological_decisions:
- issue: طبيعة الفصل بين الجانبين في المثل
  choice: إظهار الهوّة بوصفها فاصلة ثابتة يتعذر عبورها، من غير تحويل العبارة إلى تقرير عقائدي موسع.
  alternative: تفسير الهوّة صراحةً إما كمعلم جغرافي حرفي في العالم الآخر أو كمجاز محض لا يدل على انفصال ثابت.
  rationale: النص نفسه يشدد على ثبات الفصل وعجز الموجودين على الجانبين عن العبور، لكنه لا يشرح في هذه الآية طبيعة الهوّة شرحًا منهجيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. اختيرت «وفوق هذا كله» لسلاستها في السياق، و«هوّة» لوضوح صورة الفاصل العميق، مع الحفاظ على الجمع في «بينكم» وعلى معنى العجز في الجملتين.
