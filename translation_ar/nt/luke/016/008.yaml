source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: ar
  text: فمدح السيدُ الوكيلَ الظالمَ لأنه تصرّف بفطنة؛ فإن أبناء هذا الدهر أفطن من أبناء النور في التعامل مع جيلهم.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فمدح الرب الوكيل الظالم». لكن السياق المباشر يرجّح أن المقصود هو سيد الوكيل داخل المثل.'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «أبناء هذا الدهر» و«أبناء النور». وهما تعبيران يصفان، على الترتيب، المنتمين إلى الدهر الحاضر والمنتمين إلى نور الله.'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن ترجمة العبارة الأخيرة ترجمة أقرب إلى اللفظ: «أفطن من أبناء النور تجاه جيلهم». والعبارة اليونانية محتملة الدلالة؛ وتوضح الصياغة في المتن معنى التصرّف بفطنة فيما يتصل بجيلهم أو دائرتهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: السيد
  rationale: في سياق المثل المباشر، يشير اللفظ على الأرجح إلى سيد الوكيل داخل القصة. وتبقي «السيد» إمكان المعنى الآخر قائمًا من غير أن تفرض أنه لقب مباشر ليسوع أو لله.
- source_word: οἰκονόμον
  choice: الوكيل
  rationale: «الوكيل» لفظ عربي واضح وشائع لمن اؤتمن على إدارة أموال سيده وشؤونه، ويحافظ على صلة العبارة بسياق المثل.
- source_word: τῆς ἀδικίας
  choice: الظالم
  rationale: الإضافة اليونانية تصف الوكيل بالارتباط بالظلم أو عدم البر. واختيار «الظالم» يحفظ الحكم الأخلاقي العام من غير حصره في الكذب أو الخيانة وحدهما.
- source_word: φρονίμως / φρονιμώτεροι
  choice: بفطنة / أفطن
  rationale: تحافظ «الفطنة» على معنى حسن التدبير العملي والحنكة، من غير الإيحاء بأن الفعل حكيم أو صالح أخلاقيًا، كما توحّد المجال الدلالي بين الصيغة الظرفية وصيغة المقارنة.
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: أبناء هذا الدهر
  rationale: يحفظ التعبير الصورة السامية والمقابلة اللفظية مع «أبناء النور»، و«الدهر» هنا هو العصر الحاضر لا مدة زمنية مجردة.
- source_word: ὑπὲρ
  choice: أفطن من
  rationale: مع صيغة المقارنة، تؤدي ὑπέρ معنى المفاضلة، وتقابلها العربية طبيعيًا بتركيب «أفطن من».
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: أبناء النور
  rationale: يحفظ التعبير الاستعارة الكتابية والتوازي مع «أبناء هذا الدهر»، ويشير إلى المنتمين إلى نور الله.
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: في التعامل مع أبناء جيلهم
  rationale: العبارة اليونانية موجزة وصعبة. تصوغ الترجمة قوتها العلائقية بصياغة عربية مفهومة، مع توضيح أن المقصود دائرتهم أو أترابهم في هذا الجيل، لا أنهم أفطن على نحو مطلق.
theological_decisions:
- issue: هوية ὁ κύριος في الجملة الأولى
  choice: السيد داخل المثل
  alternative: الرب، أي يسوع أو الله
  rationale: السياق القصصي المباشر يرجّح سيد الوكيل، لكن اللفظ اليوناني نفسه يمكن أن يعني «الرب»، لذلك ذُكر البديل في الحاشية بدل إلغاء الاحتمال.
- issue: التقييم الأخلاقي لتصرف الوكيل
  choice: مدح فطنته العملية مع إبقاء وصفه بالظلم
  alternative: اعتبار المدح تزكية أخلاقية لتصرفه أو موافقة على ظلمه
  rationale: النص يجمع عمدًا بين ἀδικία وφρονίμως؛ ومن ثم تحافظ الترجمة على التوتر بين فساد الوكيل وحنكته، ولا تحوّل المدح إلى قبول أخلاقي لأفعاله.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدم «الوكيل» بدل ألفاظ إدارية حديثة جدًا، و«بفطنة/أفطن» لتجنب الإيحاء بالاستقامة الأخلاقية. وُضعت علامات الحواشي [a][b][c] في المتن، مع الحفاظ على الصورة السامية «أبناء هذا الدهر/أبناء النور».
