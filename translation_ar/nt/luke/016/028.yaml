review_pass:
  verdict: revise
  source_fidelity: 'الصياغة الحالية تنقل البنية الأساسية للآية: التعليل، والإخوة الخمسة، وغرض إرسال لعازر، ومنع مجيئهم أيضًا إلى موضع العذاب. لكن «يشهد لهم بإنذار شديد» تركيب غير طبيعي، ويجعل الصلة بين فعل الشهادة والإنذار ملتبسة على نحو لا يلزم من اليونانية. في هذا السياق يدل διαμαρτύρηται بوضوح على التحذير المؤكد/الملح، مع إمكان ذكر معنى الشهادة في الحاشية.'
  naturalness: '«لأن لي خمسة إخوة ... لئلا يأتوا هم أيضًا إلى موضع العذاب هذا» عربية فصيحة واضحة. أما «يشهد لهم بإنذار شديد» فثقيل وغير مألوف؛ والأفصح والأبين: «ليحذرهم تحذيرًا جادًّا».'
  terminology: «العذاب» مقابِل مناسب لـ βάσανος في هذا الموضع ولا يضيف تحديدًا عقائديًا. و«إخوة» تحافظ على دلالة المذكر في ἀδελφούς. يُستحسن تجنب «يشهد لهم شهادة جادة» في الحاشية، لأن «يشهد لهم» قد تُفهم شهادةً لصالحهم في العربية؛ وتُصاغ البديلة بعبارة تبيّن أن المقصود أداء شهادة موجَّهة إليهم.
  issues:
  - severity: medium
    issue: التركيب «يشهد لهم بإنذار شديد» غير طبيعي وملتبس دلاليًا.
    rationale: الفعل اليوناني يتسع للشهادة الرسمية أو التحذير الملح، لكن سياق منع الإخوة من الوصول إلى موضع العذاب يجعل التحذير هو المعنى السياقي المباشر. الجمع بينهما بحرف الباء لا ينقل هذه السعة بوضوح في العربية.
  - severity: low
    issue: بديل الحاشية «يشهد لهم شهادة جادة» قابل لسوء الفهم.
    rationale: قد يفهم القارئ «يشهد لهم» بمعنى يدلي بشهادة لصالحهم، لا أنه يوجه إليهم شهادة أو تحذيرًا.
