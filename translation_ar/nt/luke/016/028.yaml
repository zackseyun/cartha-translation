  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: ar
  text: لأن لي خمسة إخوة، ليحذرهم تحذيرًا جادًّا[a]، لئلا يأتوا هم أيضًا إلى موضع العذاب هذا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ليشهد لهم شهادةً مؤكَّدة» أو «ليحذرهم تحذيرًا شديدًا». قد يدل الفعل اليوناني على أداء شهادة رسمية أو على توجيه تحذير ملح.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: لأن لي
  rationale: تنقل «γάρ» التعليل الذي يربط الطلب بما سبقه، وتؤدي «ἔχω» بالعربية الطبيعية من غير تكلف.
- source_word: πέντε ἀδελφούς
  choice: خمسة إخوة
  rationale: الاسم مذكر جمع ويشير في السياق إلى إخوة ذكور.
- source_word: ὅπως
  choice: لكي
  rationale: تؤدي دلالة الغرض بوضوح في العربية المعاصرة.
- source_word: διαμαρτύρηται
  choice: يشهد لهم بإنذار شديد
  rationale: يحفظ هذا التعبير جانبي الشهادة الجادة والتحذير الملح في الفعل اليوناني، بدل قصره على أحدهما.
- source_word: αὐτοῖς
  choice: لهم
  rationale: يحافظ على تركيب المفعول غير المباشر الملائم مع معنى الشهادة والإنذار.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: لئلا يأتوا هم أيضًا
  rationale: تنقل «ἵνα μή» الغرض المنفي، ويبرز الضمير «هم» قوة «αὐτοὶ» مع حفظ معنى «أيضًا».
- source_word: εἰς τὸν τόπον τοῦτον
  choice: إلى موضع ... هذا
  rationale: تؤدي جهة الحركة، وتحافظ على اسم الإشارة ووصف الموضع.
- source_word: τῆς βασάνου
  choice: العذاب
  rationale: ينقل شدة «βάσανος» من غير إضافة تصور عقائدي أوسع مما يقوله النص.
theological_decisions:
- issue: وصف موضع ما بعد الموت في كلام الغني
  choice: موضع العذاب هذا
  alternative: موضع الألم هذا / موضع المعاناة هذا
  rationale: يحافظ «العذاب» على شدة اللفظ اليوناني، من غير توسيع العبارة إلى تحديد عقائدي لا يصرح به العدد.
- issue: دلالة διαμαρτύρηται بين الشهادة والتحذير
  choice: يشهد لهم بإنذار شديد
  alternative: يحذرهم تحذيرًا شديدًا / يشهد لهم شهادة جادة
  rationale: الصياغة المختارة تبقي السعة الدلالية للفعل وتناسب غرض منع الإخوة من المجيء إلى موضع العذاب.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «لئلا» لأنها موجزة وطبيعية في هذا السياق، مع إبراز «هم أيضًا» لحفظ توكيد النص اليوناني.
