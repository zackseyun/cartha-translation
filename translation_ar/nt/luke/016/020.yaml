lexical_decisions:
- source_word: πτωχὸς
  choice: رجل فقير
  rationale: تدل الصفة على الفقر والعوز، ولا تستلزم بذاتها أن يكون الرجل متسوّلًا؛ لذا يحافظ «فقير» على المعنى من غير تخصيص زائد.
- source_word: τις
  choice: رجل
  rationale: تُدخل τις شخصية جديدة غير معيّنة. تؤدي العربية هذا المعنى طبيعيًا بتنكير «رجل»، من غير حاجة إلى العبارة الأثقل «رجل ما» أو «رجل معيّن».
- source_word: ὀνόματι Λάζαρος
  choice: اسمه لعازر
  rationale: صياغة عربية واضحة وطبيعية للتركيب الذي يفيد التسمية، مع نقل الاسم الشخصي بصورته العربية المألوفة.
- source_word: ἐβέβλητο
  choice: قد أُلقي
  rationale: يحافظ المبني للمجهول على أن آخرين وضعوه هناك، وينقل قوة βάλλω التي قد تعني الإلقاء، بما يلائم تصوير عجزه وإهماله. وتوضح الحاشية احتمال الصياغة الأقل حدّة.
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: عند بوابته
  rationale: يفيد السياق وجوده بمحاذاة مدخل بيت الغني. «بوابة» أنسب من «باب» للدلالة على πυλών، أي المدخل أو البوابة الكبيرة.
- source_word: εἱλκωμένος
  choice: قد غطَّته القروح
  rationale: ينقل بوضوح كونه مصابًا بقروح متفشية، مع الحفاظ على وظيفة اسم الفاعل بوصفه حالًا ملازمة.
