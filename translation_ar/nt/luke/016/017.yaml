  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: ar
  text: ولكن زوال السماء والأرض أيسر من أن تسقط شَرطة واحدة من الشريعة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي خط أو نتوء صغير يميّز حرفًا من حرف.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: أيسر
  rationale: اسم التفضيل اليوناني يفيد أن الأمر أسهل أو أقرب إمكانًا، و«أيسر» يحفظ المقارنة بإيجاز طبيعي.
- source_word: δέ
  choice: ولكن
  rationale: تفيد الأداة انتقالًا ذا مسحة استدراكية في السياق، و«ولكن» توصل هذا التقابل بوضوح.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: السماء والأرض
  rationale: تعبير كتابي جامع يشير إلى الخليقة كلها، وتحافظ الصياغة العربية المألوفة على صورته.
- source_word: παρελθεῖν
  choice: زوال
  rationale: يدل المصدر هنا على مضي السماء والأرض وانقضائهما؛ وصياغة «زوال» طبيعية مع بناء المقارنة العربي.
- source_word: τοῦ νόμου
  choice: الشريعة
  rationale: يشير νόμος في هذا السياق إلى شريعة الله المعلنة في الأسفار، و«الشريعة» أوضح من «القانون» في العربية الكتابية المعاصرة.
- source_word: μίαν κεραίαν
  choice: نقطة واحدة
  rationale: κεραία علامة أو نتوء كتابي بالغ الصغر يميز الحروف؛ و«نقطة» تنقل للقارئ العربي صورة أصغر تفصيل كتابي، مع بيان أدق في الحاشية.
- source_word: πεσεῖν
  choice: أن تسقط
  rationale: يحفظ الفعل صورة السقوط الواردة حرفيًا في اليونانية من غير أن يحسم هل المقصود البطلان أو الزوال.
theological_decisions:
- issue: مرجع νόμος
  choice: الشريعة بوصفها شريعة الله الكتابية
  alternative: القانون أو الشرع بمعنى عام
  rationale: السياق وصورة أصغر علامة مكتوبة يرجحان الإشارة إلى الشريعة المعلنة، من غير إضافة تحديد طائفي أو تفسير يتجاوز النص.
- issue: دلالة πεσεῖν
  choice: أن تسقط
  alternative: أن تزول أو تبطل
  rationale: الإبقاء على صورة «السقوط» يحفظ التعبير اليوناني وتوتره الدلالي، بدل أن يحصره في معنى البطلان أو الاختفاء.
- issue: تصوير κεραία
  choice: نقطة واحدة
  alternative: شرطة واحدة أو نتوء حرف واحد
  rationale: «نقطة» مفهومة وطبيعية عربيًا للدلالة على أدق عنصر خطي، والحاشية تحفظ المعنى الأوسع للفظ اليوناني ولا تقصره تقنيًا على النقطة العربية.
translation_notes:
  register: عربية فصحى واضحة وموجزة ذات نبرة كتابية وقورة. استُخدم المصدر «زوال» لتجنب ثقل تركيب مصدرين مؤولين في المقارنة، وأُبقيت صورة «تسقط» حفاظًا على الاستعارة الأصلية. ظهرت علامة الحاشية [a] في المتن.
