  register: 'عربية فصحى حديثة واضحة ووقورة. استُعمل «يا أبانا إبراهيم» لإبراز النداء والانتساب بصياغة طبيعية، وحُفظت الصورة الحسية: غمس طرف الإصبع في الماء لتبريد اللسان.'
