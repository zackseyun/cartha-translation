  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: ar
  text: 'فصرخ وقال: «يا أبي إبراهيم، ارحمني، وأرسل لعازر ليغمس طرف إصبعه في الماء ويبرّد لساني، لأنني أتألّم في هذا اللهيب[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنني أتعذّب في هذا اللهيب». يمكن أن يدل الفعل اليوناني على الألم الشديد أو العذاب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: فصرخ
  rationale: ينقل النداء المرتفع والملحّ الذي يدل عليه الفعل في هذا السياق، بصياغة عربية طبيعية موجزة.
- source_word: Πάτερ Ἀβραάμ
  choice: يا أبانا إبراهيم
  rationale: يحفظ النداء وعلاقة الانتساب إلى إبراهيم، مع استعمال صيغة عربية طبيعية في المخاطبة.
- source_word: ἐλέησόν με
  choice: ارحمني
  rationale: المقابل العربي المباشر والمألوف لطلب الرحمة.
- source_word: πέμψον
  choice: أرسل
  rationale: ينقل صيغة الأمر ومعناها المباشر بلا توسع.
- source_word: βάψῃ
  choice: ليغمس
  rationale: يدل على إدخال طرف الإصبع في الماء، ويحفظ الصورة الحسية المحددة في اليونانية.
- source_word: τὸ ἄκρον τοῦ δακτύλου αὐτοῦ
  choice: طرف إصبعه
  rationale: صياغة عربية واضحة وقريبة من البنية والمعنى اليونانيين.
- source_word: ὕδατος
  choice: في الماء
  rationale: حرف الجر «في» هو التركيب العربي الطبيعي مع «يغمس».
- source_word: καταψύξῃ
  choice: ويبرّد
  rationale: يحفظ المعنى الجسدي المباشر للتبريد، بدل تعبير أوسع مثل «ينعش».
- source_word: τὴν γλῶσσάν μου
  choice: لساني
  rationale: نقل مباشر للعضو المذكور في النص.
- source_word: ὀδυνῶμαι
  choice: أتألّم
  rationale: يعبر عن الألم الشديد دون أن يضيف فاعلًا يعذّبه أو يحسم طبيعة العذاب بما يتجاوز الفعل اليوناني.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: في هذا اللهيب
  rationale: «اللهيب» يحفظ الصورة الخاصة بالشعلة أو اللهب، وهو أدق من اللفظ الأعم «النار».
theological_decisions:
- issue: وصف معاناة الرجل الغني
  choice: لأنني أتألّم في هذا اللهيب
  alternative: لأنني أتعذّب في هذا اللهيب
  rationale: الفعل اليوناني يدل على ألم أو معاناة شديدة، لكنه لا يحدد في ذاته وجود معذِّب؛ لذلك يحفظ «أتألّم» شدة المشهد من غير تحميله تحديدًا عقائديًا زائدًا.
