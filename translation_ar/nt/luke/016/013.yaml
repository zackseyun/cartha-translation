reference: Luke 16:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: ar
  text: لا يستطيع خادمٌ من خدم البيت أن يخدم سيدين؛ لأنه إمّا أن يُبغض أحدهما ويحب الآخر، وإمّا أن يتمسّك بأحدهما ويحتقر الآخر. لا تستطيعون أن تخدموا الله والمال[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'في اليونانية: «مامون»، وهو لفظ سامي يعني المال أو الثروة، ويُصوَّر هنا كسيد منافس.'
    reason: بيان اللفظ الأصلي والمحافظة على قوة التشخيص البلاغي مع تقديم معنى واضح في المتن.
lexical_decisions:
- source_word: οἰκέτης
  choice: خادم في بيت
  rationale: يدل اللفظ على خادم ذي منزلة تابعة داخل الأسرة أو البيت، فحافظت الصياغة على الإطار المنزلي من غير أن تحسم بما يتجاوز اللفظ بين «خادم» و«عبد».
- source_word: κυρίοις
  choice: سيدين
  rationale: المقصود صاحبا السلطة على الخادم في صورة اجتماعية، و«سيدان» تعبير عربي طبيعي يحفظ علاقة السيادة والخدمة.
- source_word: δουλεύειν
  choice: يخدم
  rationale: 'ينقل معنى الخدمة الخاضعة لسيد، ويصلح في الموضعين: خدمة السيدين وخدمة الله والمال.'
- source_word: μισήσει / ἀγαπήσει
  choice: يُبغض / يحب
  rationale: يحفظ التضاد القوي والصريح في النص من غير تلطيف «يبغض» إلى مجرد تفضيل أقل.
- source_word: ἀνθέξεται
  choice: يتمسّك بـ
  rationale: يفيد التعلّق بأحد السيدين والثبات معه والولاء له، وهو قريب من الصورة الحرفية وطبيعي في العربية.
- source_word: καταφρονήσει
  choice: يحتقر
  rationale: ينقل معنى الازدراء وعدم الاعتداد، ويحافظ على قوة المقابلة مع التمسك.
- source_word: θεῷ
  choice: الله
  rationale: ترجمة مباشرة وواضحة للمفعول الذي تتجه إليه الخدمة.
- source_word: μαμωνᾷ
  choice: المال
  rationale: اللفظ اليوناني اقتراض سامي يعني المال أو الثروة. «المال» واضح للقارئ العربي، بينما تحافظ بنية الآية على تشخيصه بوصفه سيدًا منافسًا، وتوضح الحاشية اللفظ الأصلي.
theological_decisions:
- issue: تصوير μαμωνᾷ في مقابل الله
  choice: المال، مع بيان «مامون» في الحاشية
  alternative: مامون
  rationale: تجعل الآية المال سيدًا منافسًا يطالب بالولاء، من غير أن تقرر أنه إله حقيقي. الترجمة الدلالية واضحة بالعربية، والحاشية تحفظ اللفظ السامي والتشخيص البلاغي.
- issue: المفرد التمثيلي في أفعال الخادم
  choice: أحدهما... الآخر، مع أفعال مفردة مستترة الفاعل
  alternative: تكرار «الخادم» فاعلًا في كل فعل
  rationale: تحفظ العربية المفرد التمثيلي الموجود في اليونانية طبيعيًا، من غير إضافة ضمير جنس ظاهر لا يحتاج إليه الأسلوب العربي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «لا يستطيع» للتعبير الطبيعي عن الاستحالة العملية، وحُفظ التوازي بين البغض والحب وبين التمسك والاحتقار. وُضع مؤشر الحاشية مباشرة بعد اللفظ الذي تشرحه.
