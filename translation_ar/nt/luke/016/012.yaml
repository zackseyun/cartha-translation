  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: ar
  text: وإن لم تكونوا أمناء فيما يخص غيركم، فمن سيعطيكم ما هو لكم؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير المقابلة إلى الأمانة في المال الدنيوي الآن، في مقابل نوال الغنى الحقيقي أو الدائم لاحقًا؛ لكن الآية نفسها لا تحدد المقصود بالطرفين صراحةً.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: ما يخصّ غيركم
  rationale: الصفة المحايدة المفردة مع أداة التعريف مستعملة استعمال الاسم، فتدل على ما يخصّ شخصًا آخر. وتحافظ هذه الصياغة على معنى الملكية بعبارة عربية طبيعية.
- source_word: πιστοὶ
  choice: أمناء
  rationale: المقصود هنا الأمانة والجدارة بالثقة في التصرّف بما لدى الإنسان، لا الإيمان بمعنى التصديق.
- source_word: οὐκ ἐγένεσθε
  choice: لم تكونوا
  rationale: يؤدي التعبير معنى عدم الاتصاف بالأمانة أو عدم ثبوتها، و«لم تكونوا» سليمة وطبيعية في هذا الشرط.
- source_word: τὸ ὑμέτερον
  choice: ما هو لكم
  rationale: التركيب المحايد المستعمل اسميًا يعني «الذي لكم»، وتحافظ الصياغة على المقابلة مع ما يخصّ الغير من غير تعيين المقصود.
- source_word: δώσει ὑμῖν
  choice: يعطيكم
  rationale: هذا هو المعنى المباشر للفعل δίδωμι. أما «يأتمنكم على» فملائم للسياق لكنه يضيف تفسيرًا غير مصرح به.
- source_word: καὶ εἰ
  choice: وإن
  rationale: تحافظ الواو على الصلة بالقول السابق، وتدخل «إن» جملة الشرط بإيجاز عربي طبيعي.
- source_word: τίς
  choice: فمن
  rationale: استفهام إنكاري عن الشخص الذي سيعطي، وقد اقترنت الفاء بجواب الشرط وفق الأسلوب العربي.
theological_decisions:
- issue: تحديد المقصود بالمقابلة بين ما يخصّ الغير وما هو للسامعين
  choice: إبقاء طرفي المقابلة دون تحديد مرجعيهما في متن الآية
  alternative: تفسيرهما بأنهما المال الدنيوي والغنى الحقيقي، أو الأمانة الأرضية والميراث الآتي
  rationale: النص اليوناني يصرّح بالمقابلة لكنه لا يحدد مرجعي الطرفين في هذه الآية نفسها؛ لذلك تحافظ الترجمة على الغموض المقصود والتوتر اللاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، بنبرة كريمة وطبيعية. استُخدمت «ما يخصّ غيركم» و«ما هو لكم» لإظهار المقابلة من دون حصرها في الممتلكات المادية.
