  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: ar
  text: وكان يشتهي أن يشبع مما كان يتساقط من مائدة الغني[a]. بل كانت الكلاب أيضًا تأتي وتلحس قروحه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من الفتات الذي كان يتساقط من مائدة الغني». يقول اليوناني حرفيًا: «مما كان يتساقط»، أما «الفتات» فيُفهم من سياق الطعام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: يشتهي
  rationale: ينقل رغبة لعازر القوية والمستمرة، ويأتي طبيعيًا مع المصدر المؤول «أن يشبع».
- source_word: χορτασθῆναι
  choice: أن يشبع
  rationale: يحفظ معنى الامتلاء من الطعام وصيغة المبني للمجهول دلاليًا، من غير أن يضيف أن أحدًا أطعمه بالفعل.
- source_word: ἀπὸ τῶν πιπτόντων
  choice: مما كان يتساقط
  rationale: ترجمة مباشرة نسبيًا للتركيب الاسمي مع اسم الفاعل، وتحفظ الجانب الاستمراري من غير إدخال «الفتات» في المتن.
- source_word: τῆς τραπέζης
  choice: مائدة
  rationale: لفظ عربي طبيعي وفصيح للمائدة التي يؤكل عليها في هذا السياق.
- source_word: τοῦ πλουσίου
  choice: الغني
  rationale: يحفظ الصفة المستعملة اسمًا وإحالتها إلى الرجل الغني المذكور في المثل.
- source_word: ἀλλὰ καὶ
  choice: بل ... أيضًا
  rationale: ينقل الانتقال المضاد مع الإضافة اللافتة، من غير تفسير طبيعة فعل الكلاب.
- source_word: οἱ κύνες
  choice: الكلاب
  rationale: ترجمة صريحة ومحايدة للجمع، بلا تلطيف أو تخصيص غير موجود في المصدر.
- source_word: ἐρχόμενοι
  choice: تأتي
  rationale: صيغت كفعل مضارع داخل السرد الماضي بعد «كانت» لتصوير مجيئها المتكرر أو المستمر المصاحب للفعل الرئيس.
- source_word: ἐπέλειχον
  choice: تلحس
  rationale: مع «كانت» تحافظ على الجانب غير التام للفعل، أي الفعل المتكرر أو الجاري في الماضي.
- source_word: τὰ ἕλκη αὐτοῦ
  choice: قروحه
  rationale: «القروح» أدق من «الجروح» في الدلالة على الآفات أو التقرحات الجلدية، ومفهومة في العربية المعاصرة.
theological_decisions:
- issue: دلالة لحس الكلاب للقروح
  choice: إبقاء العبارة وصفية بلا بيان هل كانت تزيد المهانة أم تمنح راحة
  alternative: صياغتها بما يوحي بالشفقة أو النجاسة والإذلال
  rationale: النص اليوناني يذكر الفعل ولا يحسم مغزاه الطبي أو الرمزي، ولذلك تُحفظ دلالته المفتوحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «كان يتساقط» و«كانت ... تأتي وتلحس» للمحافظة بقدر طبيعي على الجانب الاستمراري في الأفعال اليونانية، مع إبقاء «الفتات» في الحاشية لأنه مفهوم سياقي لا لفظ صريح في الأصل.
