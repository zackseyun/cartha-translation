source:
  edition: SBLGNT
  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: ar
  text: 'ثم قال لآخر: «وأنت، كم عليك؟» فقال: «مئة كُرٍّ من القمح[b]». فيقول له: «خُذ صكَّك[a] واكتب ثمانين».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «وثيقتك المكتوبة» أو «سجلاتك». واليونانية حرفيًا: «كتاباتك»، والمقصود هنا صك الدَّين أو الوثيقة التي تسجل الحساب.'
    reason: lexical_alternative
  - marker: b
    text: الكُرّ مكيال قديم كبير للحبوب.
    reason: cultural_note
lexical_decisions:
- source_word: ἔπειτα
  choice: ثم
  rationale: تفيد التتابع الزمني وتربط هذه المعاملة بما قبلها بعبارة عربية طبيعية.
- source_word: ἑτέρῳ
  choice: لآخر
  rationale: تدل على شخص آخر غير المدين السابق، من غير إضافة وصف غير مصرح به في اليونانية.
- source_word: Σὺ δὲ
  choice: وأنت
  rationale: تحافظ على إبراز الضمير وعلى الانتقال الخفيف الذي تؤديه δέ في الخطاب المباشر.
- source_word: πόσον ὀφείλεις
  choice: كم عليك؟
  rationale: تعبير عربي موجز وطبيعي عن مقدار الدَّين في هذا السياق المالي.
- source_word: Ἑκατὸν κόρους σίτου
  choice: مئة كُرٍّ من القمح
  rationale: يحافظ «كُرّ» على اسم وحدة الكيل القديمة المحددة، ويؤدي «القمح» معنى σῖτος في السياق.
- source_word: λέγει αὐτῷ
  choice: فيقول له
  rationale: يحافظ المضارع على الانتقال إلى المضارع التاريخي في النص اليوناني وعلى حيوية السرد، وتربطه الفاء بما سبقه طبيعيًا.
- source_word: Δέξαι
  choice: خُذ
  rationale: أمر طبيعي في العربية بتسلُّم الوثيقة وحيازتها.
- source_word: σου τὰ γράμματα
  choice: صكَّك
  rationale: يشير الجمع اليوناني حرفيًا إلى «كتاباتك/وثائقك»، لكنه في سياق الدَّين يعني الوثيقة المثبتة للمبلغ؛ و«صكك» واضح وموجز.
- source_word: γράψον ὀγδοήκοντα
  choice: واكتب ثمانين
  rationale: يحافظ على فعل الكتابة الصريح وعلى العدد كما في الأصل، من غير تفسير زائد لكيفية تعديل الوثيقة.
theological_decisions: []
