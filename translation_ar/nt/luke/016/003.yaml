  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: ar
  text: 'فقال الوكيل في نفسه: «ماذا أفعل، لأن سيدي ينزع مني الوكالة؟ لا أقوى على الحفر، وأخجل من الاستعطاء».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «الوكيل / الوكالة» بـ«مدير الأموال / إدارة الأموال». تستعمل اليونانية لفظين من أصل واحد للشخص ولمنصبه.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονόμος / οἰκονομία
  choice: الوكيل / الوكالة
  rationale: يحافظ اللفظان العربيان المشتقان من أصل واحد على الصلة بين الشخص والمنصب في اليونانية، ويلائمان سياق ائتمان الرجل على تدبير أموال سيده.
- source_word: ἐν ἑαυτῷ
  choice: في نفسه
  rationale: تعبير عربي طبيعي يدل على الحديث الباطني والتفكير الداخلي.
- source_word: Τί ποιήσω
  choice: ماذا أفعل
  rationale: ينقل الاستفهام التداولي عن مسار العمل المقبل بعبارة عربية واضحة ومباشرة.
- source_word: κύριός μου
  choice: سيدي
  rationale: السياق يشير إلى صاحب السلطة البشري في المثل، و«سيدي» يحفظ علاقة التبعية من دون إيحاء بأن اللفظ هنا لقب إلهي.
- source_word: ἀφαιρεῖται ... ἀπ’ ἐμοῦ
  choice: سينزع مني
  rationale: ينقل معنى أخذ المنصب من الشخص؛ واستعمال المستقبل العربي يوضح أن نزع الوكالة وشيك في سياق مداولته.
- source_word: σκάπτειν οὐκ ἰσχύω
  choice: لا أقوى على الحفر
  rationale: يحفظ دلالة القدرة والقوة البدنية المحتملة في ἰσχύω، مع الإبقاء على الحفر بمعناه المباشر.
- source_word: ἐπαιτεῖν αἰσχύνομαι
  choice: أخجل من الاستعطاء
  rationale: «الاستعطاء» يعني طلب العطاء والصدقة، فينقل المعنى الأدق للفعل مع الحفاظ على إيجاز الأصل.
theological_decisions:
- issue: دلالة κύριος في سياق المثل غير الإلهي
  choice: سيدي
  alternative: ربي / مالكي
  rationale: المقصود هنا الرئيس البشري للوكيل؛ لذلك تتجنب «سيدي» الإيحاء بلقب إلهي، وتحفظ في الوقت نفسه معنى السلطة الشخصية. أما «مالكي» فقد يوحي بملكية الشخص نفسه أكثر مما يقتضيه السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة قصصية رصينة. اختيرت «الوكيل/الوكالة» للمحافظة على التجانس الاشتقاقي في الأصل، ووُضعت علامة الحاشية في نهاية الآية لأنها تتعلق باللفظين الواردين فيها.
