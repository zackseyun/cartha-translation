source:
  edition: SBLGNT
  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: ar
  text: 'وأنا أقول لكم: اتخذوا لكم أصدقاء بمال الظلم[a]، لكي يستقبلوكم في المساكن الأبدية[c] حين يزول[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «من مامون الظلم». و«مامون» لفظ تقليدي منقول عن اليونانية، ويعني المال أو الثروة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا أن تُفهم العبارة: «حين ينفد»، أو، بحسب قراءة تفسيرية، «حين ينتهي أجلكم»؛ أي عند الموت. لا يصرّح الفعل اليوناني هنا بفاعله، ويرى كثيرون أنه يعود إلى المال.'
    reason: alternative_reading
  - marker: c
    text: 'حرفيًا: «الخيام الأبدية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: اتخذوا لكم أصدقاء
  rationale: صياغة عربية طبيعية تحافظ على فعل الأمر وعلى معنى الضمير الانعكاسي، من غير الترجمة الحرفية الثقيلة «اصنعوا لأنفسكم أصدقاء».
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: باستخدام مال الظلم
  rationale: تفيد «باستخدام» المعنى الوسيلي للعبارة في السياق، وتحافظ «مال الظلم» على الإضافة اليونانية وعلى اتساع دلالة ἀδικία، فلا تحصر المال في ما اكتُسب بالغش وحده.
- source_word: μαμωνᾶ
  choice: مال
  rationale: لفظ واضح للقارئ العربي المعاصر، بينما يُذكر اللفظ التقليدي «مامون» في الحاشية.
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: حتى إذا زال
  rationale: الفعل لازم ويدل على الزوال أو النفاد. والمرجع الأقرب هو المال، لكن اليونانية لا تصرّح بالفاعل، لذلك حُفظت القراءات الأخرى في الحاشية.
- source_word: δέξωνται ὑμᾶς
  choice: يستقبلوكم
  rationale: ينقل معنى القبول المصحوب بالترحيب، ويلائم الدخول إلى مساكن، مع إبقاء فاعل الجمع غير معيّن كما في اليونانية.
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: في المساكن الأبدية
  rationale: «المساكن» تنقل المقصود الاصطلاحي بوضوح، مع إثبات الصورة الحرفية «الخيام» في الحاشية؛ و«الأبدية» هي المقابل المعتاد لـ αἰωνίους.
theological_decisions:
- issue: دلالة «مال الظلم»
  choice: الإبقاء على العبارة الواسعة «مال الظلم»
  alternative: المال المكتسب بالغش وحده، أو تشخيص «مامون» بوصفه سيدًا منافسًا
  rationale: لا تقتضي العبارة أن يكون كل المال المقصود مسروقًا أو مكتسبًا بطريق الاحتيال، كما لا تفرض في هذا الموضع تشخيص المال. وتحافظ الصياغة على التوتر الدلالي من غير حسم زائد.
- issue: فاعل ἐκλίπῃ
  choice: 'يُفهم في النص الأساسي أنه المال: «إذا زال»'
  alternative: إذا فشلتم أو انتهيتم، أي عند الموت؛ أو إذا نفدت الموارد الدنيوية عمومًا
  rationale: المال هو المرجع الأقرب والأرجح سياقيًا، لكن الفاعل غير مصرّح به في الفعل اليوناني، ولذلك تُذكر الاحتمالات الأخرى في الحاشية.
- issue: هوية فاعل «يستقبلوكم»
  choice: ترك الفاعل غير معيّن
  alternative: الأصدقاء الذين اتُّخذوا بالمال، أو الفقراء وشعب الله، أو كائنات سماوية
  rationale: فاعل δέξωνται مضمر في اليونانية، وتعيين هويته في الترجمة سيضيف تفسيرًا لا يصرّح به النص.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعملت «اتخذوا لكم أصدقاء» بدل الحرفية الثقيلة، وأُبقي تركيب «مال الظلم» لما فيه من إيجاز واتساع دلالي، مع شرح البدائل في الحواشي.
