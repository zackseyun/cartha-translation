id: LUK.16.5
reference: Luke 16:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: ar
  text: 'ثم دعا كلَّ واحد من مديوني سيّده[a]، وقال للأول: «كم عليك لسيّدي؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تأتي الكلمة اليونانية κύριος أيضًا بمعنى «الرب»، لكنها تشير هنا إلى الرئيس البشري للوكيل، ولذلك تُرجمت «السيّد».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: دعا
  rationale: فعل «دعا» طبيعي في العربية ويفيد استدعاء الأشخاص إليه، أما تقدُّم اسم الفاعل الأُورِسْتي على الفعل الرئيس فيظهر هنا طبيعيًّا من خلال ترتيب الفعلين مع «ثم».
- source_word: ἕνα ἕκαστον
  choice: كلَّ واحد
  rationale: يحفظ القوة التوزيعية للتركيب اليوناني من غير إضافة معنى «واحدًا بعد الآخر» الذي يظل ممكنًا لكنه أكثر تفسيرًا.
- source_word: χρεοφειλετῶν
  choice: مديوني
  rationale: «مدين» هو المقابل العربي المباشر لمن عليه دَين، وهو ملائم للسياق المالي.
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: سيّده
  rationale: الضمير المتصل يحفظ عود ἑαυτοῦ إلى الوكيل، و«السيّد» هنا يدل على الرئيس البشري في سياق إدارة الأموال.
- source_word: ἔλεγεν
  choice: وقال
  rationale: الماضي الناقص اليوناني قد يرسم مشهدًا أو يفيد التكرار مع كل مدين، لكن العربية الفصيحة الطبيعية تستخدم الماضي هنا، والسياق السابق «كل واحد» يتيح فهم الفعل المتكرر دون إثقال العبارة.
- source_word: τῷ πρώτῳ
  choice: للأول
  rationale: نقل مباشر وموجز لتركيب اسم الترتيب في حالة المجرور غير المباشر.
- source_word: Πόσον
  choice: كم
  rationale: أداة الاستفهام العربية الطبيعية عن مقدار الدَّين.
- source_word: ὀφείλεις
  choice: عليك
  rationale: التعبير «كم عليك؟» عربي شائع ودقيق في السؤال عن مقدار ما يدين به الشخص.
- source_word: τῷ κυρίῳ μου
  choice: لسيّدي
  rationale: يحفظ ضمير المتكلم في μου ويعبّر عن علاقة الوكيل برئيسه البشري دون إضفاء دلالة إلهية على κύριος.
theological_decisions:
- issue: ترجمة κύριος في سياق المثل الاقتصادي
  choice: سيّد
  alternative: ربّ
  rationale: المرجع هنا إنسان هو سيّد الوكيل، لا لقب إلهي أو مسياني. «سيّد» يوضح العلاقة الاجتماعية والإدارية، بينما قد توحي «ربّ» في العربية بدلالة إلهية غير مقصودة في هذا الموضع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «مديوني» بدل تركيب أطول، وحُفظت صيغة الخطاب المباشر الموجزة. وُضع marker الحاشية [a] في المتن كما هو مطلوب.
