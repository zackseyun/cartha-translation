base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: ar
  text: 'وكان يقول أيضًا للتلاميذ: «كان لرجل غني وكيل[a]، فوُشي بهذا الوكيل إلى الرجل الغني[b] بأنه يبدّد ممتلكاته.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مدبّر أملاكه». واللفظة اليونانية تشير إلى شخص اؤتمن على إدارة بيت أو ضيعة أو ممتلكات.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فاتُّهم أمامه بأنه يبدّد ممتلكاته» أو «فبُلِّغ عنه». يدل الفعل على وشاية أو اتهام أو بلاغ ضار، لا على أن التهمة قد ثبتت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: كان يقول
  rationale: يحفظ دلالة الماضي الناقص بوصفه تمهيدًا سرديًا أو قولًا مستمرًا، بدل تحويله إلى فعل ماضٍ نقطي فقط.
- source_word: δὲ καὶ
  choice: أيضًا
  rationale: نُقلت دلالة الإضافة في καί بلفظة «أيضًا»، أما δέ الانتقالية فاستوعبها السياق العربي من غير رابط ثقيل.
- source_word: πρὸς τοὺς μαθητάς
  choice: للتلاميذ
  rationale: ترجمة مباشرة طبيعية من دون إضافة ضمير ملكية غير موجود في النص اليوناني.
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: كان رجل غنيّ
  rationale: صيغة عربية طبيعية لتقديم شخصية غير معيّنة في المثل، وتحفظ معنى الثراء بوضوح.
- source_word: οἰκονόμον
  choice: وكيل
  rationale: «وكيل» لفظ عربي واضح لمن اؤتمن على تدبير بيت أو أملاك، مع بيان البديل الوظيفي في الحاشية.
- source_word: οὗτος
  choice: —
  rationale: أُحيل إلى الوكيل ضمنيًا في المبني للمجهول «فوُشي به»؛ وإظهار «هذا» حرفيًا يثقل العربية من غير فقد المرجع.
- source_word: διεβλήθη αὐτῷ
  choice: وُشي به إليه
  rationale: يحفظ معنى نقل قول ضار أو اتهام إلى الغني، من غير افتراض ثبوت التهمة؛ والضمير في «إليه» يعود إلى الرجل الغني.
- source_word: ὡς διασκορπίζων
  choice: بأنه يبدّد
  rationale: ينقل مضمون البلاغ أو الاتهام، و«يبدّد» هو المقابل الطبيعي في سياق إساءة التصرف في المال.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: أمواله
  rationale: تعبير عربي جامع للممتلكات والأصول التي تخص الرجل الغني، وهو أنسب في سياق إدارة أملاكه.
theological_decisions:
- issue: مدى ثبوت إساءة الوكيل
  choice: صياغة البلاغ بوصفه قولًا منقولًا لا حكمًا مثبتًا
  alternative: «ثبت لديه أنه يبدّد أمواله»
  rationale: الفعل διεβλήθη يدل على اتهام أو وشاية أو تقرير سلبي، ولا يقتضي في ذاته صحة التهمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «وكيل» بدل لفظ تراثي أقل شفافية، وحُفظت دلالة الماضي الناقص والالتباس في حقيقة الاتهام. وُضعت علامتا الحاشيتين في المتن بعد اللفظ والعبارة اللذين تشرحهما كل حاشية.
