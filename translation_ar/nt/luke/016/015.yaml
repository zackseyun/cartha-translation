source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: ar
  text: 'وقال لهم: «أنتم الذين تُظهرون أنفسكم أبرارًا أمام الناس[a]، لكن الله يعرف قلوبكم. فما يُعَدّ رفيعًا بين الناس[b] هو رجس أمام الله[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «تبرّرون أنفسكم أمام الناس»؛ أي تقدّمون أنفسكم في نظرهم على أنكم أبرار.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ما يحظى بتقدير عالٍ لدى الناس».'
    reason: alternative_reading
  - marker: c
    text: 'أو: «مكروه جدًا في نظر الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτοὺς
  choice: تُظهرون أنفسكم أبرارًا
  rationale: ينقل معنى تقديم المخاطَبين أنفسهم بوصفهم أبرارًا في نظر الآخرين، ويتجنب أن يُفهم التعبير العربي «تبرّرون أنفسكم» على أنه مجرد اختلاق الأعذار. وتُحفظ الصياغة الأقرب إلى اللفظ في الحاشية.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: أمام الناس
  rationale: تعبير عربي واضح يحفظ معنى «أمام/في نظر»، وينقل ἀνθρώπων العامة الشاملة للبشر دون تقييدها بالذكور.
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: يعرف قلوبكم
  rationale: يحفظ صورة القلب بوصفه موضع الدوافع والأفكار والداخل الإنساني، من غير إضافة تفسيرية إلى المتن.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: ما يُعَدّ رفيعًا بين الناس
  rationale: يحفظ استعارة العلو في ὑψηλόν، ويجعل الصياغة طبيعية بالعربية، مع إبقاء احتمال كون المقصود ما ينال تقديرًا اجتماعيًا عاليًا في الحاشية.
- source_word: βδέλυγμα
  choice: رجس
  rationale: اسم قوي يدل على ما هو بغيض وممقوت في نظر الله، ويحافظ على البنية الاسمية في اليونانية.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: أمام الله
  rationale: يحفظ التوازي والتباين مع «أمام الناس» في صدر الآية.
- source_word: Ὑμεῖς ἐστε οἱ ...
  choice: أنتم الذين ...
  rationale: ينقل توكيد الضمير والبناء اليوناني ذي الأداة مع اسم الفاعل، ويبرز توجيه الاتهام إلى المخاطَبين.
theological_decisions:
- issue: دلالة δικαιοῦντες ἑαυτούς على التبرير الذاتي
  choice: تُظهرون أنفسكم أبرارًا
  alternative: تبرّرون أنفسكم
  rationale: السياق يتناول ادعاء البر أو عرضه أمام الناس، لا مجرد تقديم الأعذار. ومع ذلك تُذكر الصياغة الحرفية البديلة كي لا تُحجب الصلة المعجمية بالفعل δικαιόω.
- issue: دلالة τὸ ἐν ἀνθρώποις ὑψηλόν
  choice: ما يُعَدّ رفيعًا بين الناس
  alternative: ما يحظى بتقدير عالٍ لدى الناس
  rationale: الترجمة المختارة تحفظ صورة العلو وتترك المجال مفتوحًا لما يرفعه الناس مكانةً أو قيمةً، بدل حصر المعنى في الإعجاب الاجتماعي وحده.
- issue: قوة βδέλυγμα أمام الله
  choice: رجس أمام الله
  alternative: مكروه جدًا في نظر الله
  rationale: «رجس» يحفظ القوة الدينية والأخلاقية للاسم اليوناني من غير تلطيف، بينما يوضح البديل معناه الوصفي.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُخدم «الناس» للدلالة البشرية العامة، وحُفظ التوازي بين «أمام الناس» و«أمام الله»، مع صياغة طبيعية لا تزيل حدة المواجهة أو التوتر بين الحكم البشري ومعرفة الله للقلوب.
