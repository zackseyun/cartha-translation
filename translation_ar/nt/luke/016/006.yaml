  terminology: «بَثّ» تعريب مناسب لوحدة الباث القديمة، وتشرح الحاشية طبيعتها. و«صكّ دينك» مقابل سياقي جائز لـτὰ γράμματα، مع حاشية تحفظ المعنى الحرفي الأوسع والجمع في اليونانية. لا توجد مصطلحات لاهوتية تحتاج إلى ضبط في هذه الآية.
