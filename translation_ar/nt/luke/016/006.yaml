  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «مئة بَثّ» للوحدة المحددة βάτους، و«زيت الزيتون» لـἐλαίου، وأوامر الأخذ والجلوس والكتابة، والعدد «خمسين». وتحويل اسم الفاعل καθίσας إلى أمرٍ منسق («واجلس») عربي سليم ولا يضيف معنى. وترتيب «سريعًا» يحافظ على قربه من موضعه في الأصل ولا يفرض تفسيرًا زائدًا لتعلقه.'
