  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: ar
  text: 'فقال: «مئةُ بَثٍّ[a] من زيت الزيتون». فقال له: «خُذْ صكَّ دَينك[b]، واجلس سريعًا واكتب خمسين».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'البَثّ مكيال قديم للسوائل. والنص اليوناني حرفيًا: «مئة بَثّ من الزيت».'
    reason: cultural_note
  - marker: b
    text: 'أو «وثائقك» أو «سجلَّ دَينك»؛ واليونانية حرفيًا: «كتاباتك». والمقصود في السياق الوثيقة التي تثبت دَين الرجل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: بَثٍّ
  rationale: اسم مكيال قديم للسوائل؛ إبقاء اسم الوحدة يحفظ التفصيل الاقتصادي الملموس في المثل، مع شرحه في الحاشية.
- source_word: ἐλαίου
  choice: زيت الزيتون
  rationale: يدل ἔλαιον في هذا السياق على زيت الزيتون، والتصريح به أوضح للقارئ الحديث من لفظ «زيت» وحده.
- source_word: Δέξαι
  choice: خُذْ
  rationale: أمر طبيعي في العربية بتناول وثيقة الدين، وهو أنسب سياقيًا من «تسلَّم».
- source_word: τὰ γράμματα
  choice: صكَّ دَينك
  rationale: اللفظ اليوناني حرفيًا «كتاباتك/وثائقك»، لكنه في سياق المديونية يشير إلى الوثيقة المثبتة للدين. «صك دينك» واضح وموجز ويحفظ الطابع التجاري.
- source_word: καθίσας
  choice: واجلس
  rationale: اسم الفاعل الظرفي يصاحب فعل الأمر التالي، فصيغ طبيعيًا كأمر منسق يحفظ تعاقب الفعلين.
- source_word: ταχέως
  choice: سريعًا
  rationale: ينقل معنى السرعة مباشرة، مع إبقاء احتمال تعلقه بفعل الجلوس أو بمجمل الإجراء قريبًا من تركيب الأصل.
- source_word: γράψον
  choice: واكتب
  rationale: ينقل الأمر بتدوين المقدار المعدّل من غير إضافة تفسير غير مصرح به في المتن.
- source_word: πεντήκοντα
  choice: خمسين
  rationale: نقل مباشر للعدد كما في الأصل.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «بَثّ» بوصفه اسم وحدة قديمة مع حاشية تفسيرية، و«صك دينك» لتوضيح الدلالة السياقية للجمع اليوناني من غير إثقال المتن. وُضع «سريعًا» بعد «اجلس» محافظةً على ترتيب الأصل وعلى قدر من غموض تعلّقه التركيبي.
