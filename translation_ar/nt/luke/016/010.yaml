source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: ar
  text: مَن كان أمينًا في القليل جدًا، فهو أمين أيضًا في الكثير[a]؛ ومَن كان ظالمًا[b] في القليل جدًا، فهو ظالم أيضًا في الكثير.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في ما هو قليل جدًا». يشير التعبير اليوناني إلى ما هو بالغ الصغر أو قليل الشأن.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة «ظالمًا» هنا: «غير أمين» أو «غير عادل». واللفظ اليوناني أوسع من الخيانة المالية، مع أن هذا المعنى يلائم السياق المحيط.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: أمين
  rationale: يدل هنا على من تثبت أمانته وجدارته بالثقة في ما يُؤتمن عليه، لا على مجرد الإيمان؛ و«أمين» تعبير عربي طبيعي يحفظ المقابلة الأخلاقية في القول.
- source_word: ἐν ἐλαχίστῳ
  choice: في القليل جدًا
  rationale: يحفظ معنى المجال أو الظرف الكمي الذي تفيده ἐν مع صيغة التفضيل المحايدة، ويقابل «في الكثير» بوضوح.
- source_word: πολλῷ
  choice: الكثير
  rationale: صيغة محايدة مفردة تشير إلى المقدار أو النطاق، وتقابل ἐλαχίστῳ مقابلة موجزة.
- source_word: ἄδικος
  choice: ظالم
  rationale: اللفظ اليوناني أوسع من عدم الأمانة المالية، ويدل على الظلم أو الخطأ الأخلاقي عمومًا؛ و«ظالم» يحفظ هذا الاتساع من غير قصره على المال.
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: مَن كان أمينًا ... ومَن كان ظالمًا
  rationale: ينقل الاستعمال الاسمي للصفة بصياغة عربية عامة وطبيعية، من غير تقييد المعنى بجنس معين.
- source_word: καὶ
  choice: أيضًا
  rationale: يُظهر المعنى الإضافي في كل نصف من القول، مع الحفاظ على التوازي بين القليل والكثير.
theological_decisions:
- issue: مدلول ἄδικος الأخلاقي في سياق الوكالة والمال
  choice: ظالم
  alternative: غير أمين أو غير بار
  rationale: يقرر النص مبدأ أخلاقيًا عامًا، وإن ورد في سياق المال. «غير أمين» يضيّق المعنى إلى الخيانة، و«غير بار» ممكن لكنه أقل سلاسة في العربية هنا؛ أما «ظالم» فيحفظ السعة الأخلاقية للفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «مَن» لصياغة الحكمة العامة، وحُفظ التوازي الإيقاعي والدلالي بين «القليل جدًا» و«الكثير»، وبين «أمينًا» و«ظالمًا».
