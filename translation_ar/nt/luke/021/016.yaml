    reason: بديل معجمي
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: ستُسلَّمون
  rationale: صيغة مستقبل مبني للمجهول تفيد أن المخاطَبين سيُدفَعون إلى أيدي سلطات أو خصوم. «ستُسلَّمون» واضحة وتحافظ على المعنى الأساسي من غير أن تحصره في «الخيانة»، مع أن السياق العائلي يوحي بها.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد انتقالًا مع مقابلة خفيفة بما سبق، و«ولكن» تنقل هذا التحول بوضوح.
- source_word: καὶ
  choice: حتى
  rationale: 'لها هنا قوة تصاعدية: لن يأتي التسليم من الغرباء فقط، بل حتى من أقرب الناس.'
- source_word: ὑπὸ
  choice: من
  rationale: تدل مع المبني للمجهول على الجهة الفاعلة، و«من» هي الصياغة العربية الطبيعية هنا.
- source_word: γονέων
  choice: الوالدين
  rationale: تدل صيغة الجمع اليونانية على الأب والأم بوصفهما الوالدين، وهذه عبارة عربية موجزة وشاملة.
- source_word: ἀδελφῶν
  choice: الإخوة
  rationale: تحافظ على صيغة المذكر في الأصل، مع إثبات احتمال شمول الإخوة والأخوات في الحاشية.
- source_word: συγγενῶν
  choice: الأقارب
  rationale: لفظ عربي حديث وواضح يشمل ذوي القرابة على اتساعها.
- source_word: φίλων
  choice: الأصدقاء
  rationale: المقابل المباشر والطبيعي للكلمة اليونانية في هذا السياق.
- source_word: θανατώσουσιν
  choice: سيقتلون
  rationale: الفعل يعني التسبب في الموت أو الإماتة عمدًا. «سيقتلون» طبيعي ومباشر، ولا يضيّق المعنى على الإعدام الرسمي وحده.
- source_word: ἐξ ὑμῶν
  choice: بعضًا منكم
  rationale: هذا هو المقابل العربي الاصطلاحي الطبيعي للتركيب، إذ المقصود أن القتل سيصيب بعض المخاطَبين لا جميعهم.
theological_decisions:
- issue: مدى شمول ἀδελφῶν في قائمة القرابة
  choice: الإخوة
  alternative: الإخوة والأخوات
  rationale: أُبقيت صيغة المذكر في المتن موافقةً للصيغة اليونانية، من غير نفي إمكان استعمالها لجماعة مختلطة؛ لذلك ذُكر الاحتمال الأوسع في الحاشية حفاظًا على الغموض المعجمي الحقيقي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع بناء طبيعي للمبني للمجهول وتكرار حرف العطف بما يعكس تراكم قائمة العلاقات القريبة في الأصل.
