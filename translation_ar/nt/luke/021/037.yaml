base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: ar
  text: وكان يعلّم في الهيكل[a] نهارًا، أمّا ليلًا فكان يخرج إلى الجبل الذي يُدعى جبل الزيتون ويبيت فيه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير الكلمة اليونانية هنا إلى مجمع الهيكل أو ساحاته، لا إلى المقدس الداخلي وحده.
    reason: lexical_alternative
  - marker: b
    text: أو «يقضي الليل»؛ وقد يوحي الفعل أيضًا بالمبيت في العراء.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: كان يعلّم
  rationale: ينقل التركيب المحيطي الدال على النشاط المستمر والمتكرر بصياغة عربية طبيعية.
- source_word: τὰς ἡμέρας
  choice: نهارًا
  rationale: يؤدي دلالة زمن النشاط المعتاد، ويحافظ بوضوح على المقابلة بين النهار والليل، وإن جاء الأصل بصيغة الجمع.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: «الهيكل» هو المقابل العربي المألوف، مع إيضاح أن اللفظة اليونانية تشير إلى مجمع الهيكل لا إلى المقدس الداخلي وحده.
- source_word: τὰς δὲ νύκτας
  choice: أمّا ليلًا
  rationale: تصوغ المقابلة التي تفيدها δέ بين نمط يسوع في النهار ونمطه في الليل، بأسلوب عربي واضح.
- source_word: ἐξερχόμενος
  choice: كان يخرج
  rationale: يعكس الفعل المتكرر المصاحب للمبيت، بدل ترجمته باسم فاعل قد يكون أقل سلاسة في العربية.
- source_word: ηὐλίζετο
  choice: يبيت
  rationale: فعل عربي موجز وطبيعي يدل على قضاء الليل، من غير تحديد قاطع لما إذا كان المبيت داخل مأوى أو في العراء.
- source_word: εἰς τὸ ὄρος
  choice: في الجبل
  rationale: مع فعل المبيت تدل العبارة على الوجهة المنتهية إلى موضع الإقامة؛ وحرف «في» هو الأنسب عربيًا لهذه النتيجة المكانية.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: الذي يُدعى جبل الزيتون
  rationale: يحافظ على معنى التسمية في καλούμενον ويستخدم الاسم العربي المعروف للموضع.
