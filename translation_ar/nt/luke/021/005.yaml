lexical_decisions:
- source_word: τινων λεγόντων
  choice: بينما كان بعضهم يتحدث
  rationale: نُقلت صيغة المضاف المطلق إلى جملة ظرفية زمنية طبيعية في العربية، مع الحفاظ على دلالة الفعل المستمر.
- source_word: τοῦ ἱεροῦ
  choice: الهيكل
  rationale: اللفظ اليوناني ἱερόν يدل هنا على نطاق الهيكل ومبانيه عمومًا، و«الهيكل» هو المقابل العربي المألوف، مع بيان سعته الدلالية في الحاشية.
- source_word: λίθοις καλοῖς
  choice: بحجارة جميلة
  rationale: يحافظ التعبير على وصف الحجارة بالجمال وجودة المظهر دون زيادة معنى الفخامة صراحة.
- source_word: ἀναθήμασιν
  choice: تقدمات مكرَّسة
  rationale: المقصود عطايا خُصصت لله ووُضعت في الهيكل؛ وهذه الصياغة أوضح للقارئ المعاصر من مصطلح تقني مثل «النذور» وحده.
- source_word: κεκόσμηται
  choice: تزيَّن
  rationale: ينقل حالة الهيكل الناتجة عن تزيينه، وهي الدلالة الحالية الناتجة التي تحملها صيغة التام المبني للمجهول في اليونانية.
- source_word: εἶπεν
  choice: قال
  rationale: يحافظ على الفاعل المضمر في الأصل وعلى اتصال السياق، من غير إضافة اسم يسوع صراحة.
