  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: ar
  text: الويل للحبالى وللمرضعات في تلك الأيام! إذ سيكون ضيق عظيم على الأرض[a]، وغضب على هذا الشعب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على البلاد». يمكن للكلمة اليونانية أن تعني «الأرض» أو «البلاد»، ويرجح السياق المحيط، الذي يركز على أورشليم واليهودية، معنى البلاد.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها ترجمة أقرب إلى البنية اليونانية: «غضب لهذا الشعب»؛ والمعنى أن هذا الشعب واقع تحت الغضب.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: الويل
  rationale: يحفظ قوة صيحة الرثاء والإنذار النبوي، وهو أفصح وأشد وقعًا من «وا أسفاه» في هذا السياق.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: للحبالى
  rationale: تعبير عربي واضح وموجز عن اللواتي «في أحشائهن» حمل، من غير تكلف أو صياغة قديمة غامضة.
- source_word: ταῖς θηλαζούσαις
  choice: للمرضعات
  rationale: ينقل اسم الفاعل اليوناني طبيعيًا، ويفهم منه في العربية إرضاع الأطفال من غير حاجة إلى إضافة غير مصرّح بها.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: في تلك الأيام
  rationale: ترجمة مباشرة وطبيعية تحفظ الإشارة الزمنية.
- source_word: ἀνάγκη μεγάλη
  choice: ضيق عظيم
  rationale: يعبر عن الشدة والكرب الملحّين اللذين تدل عليهما الكلمة في سياق الكارثة، لا عن مجرد الضرورة.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: «الأرض» تحتمل في العربية، كما في اليونانية، أرض البلاد أو الأرض بمعناها الأوسع؛ وتوضح الحاشية الاحتمالين مع ترجيح السياق المحلي.
- source_word: ὀργή
  choice: غضب
  rationale: يحفظ الدلالة الأساسية للكلمة من غير تحويلها تفسيريًا إلى «دينونة»، ومن غير إضافة صاحب الغضب الذي لم يذكره النص صراحة.
- source_word: τῷ λαῷ τούτῳ
  choice: على هذا الشعب
  rationale: ينقل المتأثر بالغضب بصياغة عربية مألوفة، ويحفظ اسم الإشارة من غير تعيين يتجاوز النص.
theological_decisions:
- issue: مدى دلالة γῆ وهوية «هذا الشعب»
  choice: أُبقيت «الأرض» في المتن مع حاشية تبين إمكان معنى «البلاد»، والسياق يرجح أرض اليهودية/إسرائيل.
  alternative: فهم γῆ بمعنى الأرض كلها، ومن ثم إعطاء الكلام نطاقًا عالميًا مباشرًا.
  rationale: السياق القريب يتناول أورشليم واليهودية، لكن اللفظ اليوناني نفسه يحتمل الدلالة الأوسع؛ لذلك لا ينبغي إغلاق هذا الاحتمال في المتن.
- issue: طبيعة ὀργή وصاحبها
  choice: «غضب» من غير إضافة «الله».
  alternative: «غضب الله» أو «دينونة».
  rationale: قد يفهم السياق الغضب على أنه إلهي، لكن النص لا يصرح بصاحبه؛ وإضافته تحسم أمرًا تركته العبارة اليونانية ضمنيًا.
- issue: دلالة حرف الجر مع τῷ λαῷ τούτῳ
  choice: «على هذا الشعب».
  alternative: «لهذا الشعب» أو «نحو هذا الشعب».
  rationale: الداتيف يحدد الشعب الواقع عليه الغضب، و«على» هي الصياغة العربية الأوضح، مع إثبات البديل الحرفي في الحاشية صونًا للبنية المحتملة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعملت «الحبالى» و«المرضعات» للإيجاز الطبيعي، وحُفظت شدة العبارة النبوية في «الويل». لم يُضف «الله» إلى «غضب»، محافظةً على ما صرّح به النص وما تركه ضمنيًا.
