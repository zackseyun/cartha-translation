  verdict: approve
  source_fidelity: 'ينقل المتن بنية اليونانية ومعناها بأمانة: «بـ» تؤدي دلالة الوسيلة في ἐν، و«ثباتكم» مناسب لـὑπομονῇ في سياق الضيق، و«اقتَنوا» يحافظ على صيغة الأمر في κτήσασθε بحسب نص SBLGNT. و«حياتكم» اختيار سياقي جائز لـψυχάς، مع عدم حصرها في معنى النفس غير المادية.'
  naturalness: العبارة موجزة وفصيحة وواضحة في العربية المعيارية المعاصرة. وقد يبدو «اقتَنوا حياتكم» ذا نبرة رسمية مقصودة، لكنه سليم ومناسب لترجمة قريبة من النص، ولا يستدعي استبدالًا تفسيريًا مثل «احفظوا».
  terminology: «الثبات» مناسب ومألوف، و«حياتكم» يحفظ المعنى الشامل المقصود في السياق. الحاشية (ب) تعرض «نفوسكم» بدقة بوصفه بديلًا معجميًا دون فرض قراءة لاهوتية. والحاشية (أ) تميّز بوضوح القراءة المستقبلية المخطوطية عن صيغة الأمر المعتمدة في المتن.
