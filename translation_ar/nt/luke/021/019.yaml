  text: ἐν τῇ ὑπομονῇ ὑμῶν ⸀κτήσασθε τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/019.yaml
  text: By your endurance you will gain your lives[a][b].
translation:
  language: ar
  text: بِثَباتِكُمُ اقتَنوا حياتَكُم[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «بثباتكم ستقتنون حياتكم».'
    reason: textual_variant
  - marker: b
    text: 'أو: «نفوسكم»؛ فاللفظة اليونانية قد تعني الحياة أو النفس أو الذات بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονῇ
  choice: ثَبات
  rationale: تدلّ ὑπομονή هنا على الثبات والمثابرة تحت الضيق والاضطهاد، و«الثبات» موجز وطبيعي في العربية ولا يوحي بمجرد الانتظار السلبي.
- source_word: κτήσασθε
  choice: اقتَنوا
  rationale: الصيغة في نص SBLGNT فعل أمر ماضٍ في اليونانية، ومعناها اكتساب الشيء أو الظفر به. تحافظ «اقتَنوا» على صيغة الأمر وعلى معنى الاكتساب، مع إثبات القراءة المستقبلية في الحاشية.
- source_word: ψυχὰς
  choice: حياتَكُم
  rationale: يمكن أن تعني ψυχή الحياة أو النفس أو الذات. وفي سياق الاضطهاد والموت والحفظ النهائي، تنقل «حياتكم» المعنى الشامل من غير حصره في النفس غير المادية.
- source_word: ἐν
  choice: بِـ
  rationale: تفيد ἐν مع المجرور هنا الوسيلة؛ والباء في «بثباتكم» تؤدي هذا المعنى بوضوح وإيجاز.
theological_decisions:
- issue: دلالة ψυχή في سياق الاضطهاد الأخروي
  choice: حياتكم، بمعنى شامل
  alternative: نفوسكم
  rationale: يحفظ هذا الاختيار التوتر بين خطر الموت الجسدي والحفظ النهائي، ولا يفرض تصورًا أنثروبولوجيًا يقصر المقصود على الجزء غير المادي من الإنسان.
- issue: الأمر أم الإخبار بالنتيجة
  choice: 'صيغة الأمر وفق قراءة SBLGNT: «اقتَنوا»'
  alternative: 'صيغة المستقبل بحسب قراءة مخطوطية أخرى: «ستقتنون»'
  rationale: النص اليوناني المعطى يقرأ κτήσασθε، وهي صيغة أمر، ولذلك جُعلت في المتن. وتُذكر القراءة المستقبلية في الحاشية حفاظًا على الشاهد النصي البديل وعلى ما ينشأ عنه من فرق بين الحث والوعد بالنتيجة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة. حوفظ على تقديم «بثباتكم» لإبراز الوسيلة كما في ترتيب اليونانية، وعلى صيغة الأمر في قراءة النص المعتمد، مع تجنب حصر ψυχή في معنى لاهوتي ضيق.
