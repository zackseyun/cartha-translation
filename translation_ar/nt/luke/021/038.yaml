lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: الشعب كلُّه
  rationale: تعبير جمعي شامل يشير إلى عامة الشعب، ويحفظ المعنى من غير أن يلزم منه حضور كل فرد بلا استثناء.
- source_word: ὤρθριζεν
  choice: كان يُبكِّر
  rationale: صيغة الماضي الناقص تدل على عادة متكررة، والفعل يفيد المجيء أو النهوض في وقت مبكر؛ وهذا التعبير العربي موجز وطبيعي في السياق.
- source_word: πρὸς αὐτόν
  choice: إليه
  rationale: يحفظ دلالة الحركة نحو شخص، مع إبقاء الإحالة الضميرية كما في اليونانية.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: اللفظ ἱερόν يدل على مجمّع الهيكل وساحاته، و«الهيكل» هو المقابل العربي المألوف، مع توضيح نطاق المعنى في الحاشية.
- source_word: ἀκούειν αὐτοῦ
  choice: ليسمعه
  rationale: المصدر يدل على الغرض، أي أنهم كانوا يبكرون إليه لكي يسمعوا تعليمه؛ والصياغة العربية موجزة وتحفظ تركيب الضمير.
