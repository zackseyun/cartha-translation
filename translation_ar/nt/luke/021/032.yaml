  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: ar
  text: '«الحق أقول لكم: لن يزول هذا الجيل[a] أبدًا حتى تحدث كل الأمور[b][c].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «هذا الشعب» أو «هذا العصر». تحتمل الكلمة اليونانية أكثر من فهم، لكن «الجيل» هو المقابل المباشر الأرجح.
    reason: alternative_reading
  - marker: b
    text: 'تضيف بعض الترجمات «هذه» فتقول: «كل هذه الأمور»، اعتمادًا على السياق؛ أما اليونانية هنا فلا تتضمن «هذه».'
    reason: lexical_alternative
  - marker: c
    text: أو «تقع» أو «تتم».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: الحق
  rationale: تؤدي معنى التوكيد الرسمي الجازم في مستهل القول، وهي صياغة عربية واضحة ومألوفة في هذا السياق.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: نقل مباشر وطبيعي لصيغة الخطاب اليونانية.
- source_word: οὐ μὴ παρέλθῃ
  choice: لن يزول ... أبدًا
  rationale: يجسّد النفي اليوناني المشدد οὐ μή مع الفعل بصياغة عربية قوية وواضحة، من غير تحويله إلى دعوى عن الخلود.
- source_word: ἡ γενεὰ αὕτη
  choice: هذا الجيل
  rationale: «الجيل» هو المقابل المباشر والأرجح لـ γενεά، مع إبقاء البدائل الدلالية في الحاشية بسبب الخلاف في تحديد المراد.
- source_word: ἕως ἂν
  choice: حتى
  rationale: أداة زمنية عربية طبيعية تحدد الغاية التي يستمر إليها مضمون الجملة السابقة.
- source_word: πάντα
  choice: كل الأمور
  rationale: يحافظ على شمول πάντα من دون إضافة اسم الإشارة «هذه» غير الموجود صراحة في النص اليوناني.
- source_word: γένηται
  choice: تحدث
  rationale: ينقل معنى وقوع الأمور أو حصولها في هذا السياق، من غير فرض معنى «تتم» أو «تتحقق» ذي الإيحاء التفسيري الأقوى.
theological_decisions:
- issue: دلالة «هذا الجيل» في القول الأخروي
  choice: إبقاء العبارة المباشرة «هذا الجيل» من دون تعيين مرجعها تفسيريًا
  alternative: هذا الشعب؛ هذا العصر؛ الجيل الذي يرى هذه الأمور
  rationale: النص يصرح بالعبارة لكنه لا يحسم داخل هذه الآية وحدها المراد الدقيق منها؛ لذلك تحافظ الترجمة على التوتر التفسيري ولا تتبنى قراءة مذهبية بعينها.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. وُضعت علامات الحواشي عند الألفاظ التي تتعلق بها مباشرة، مع تجنب الألفاظ المذهبية أو حسم المرجع الأخروي للعبارة.
