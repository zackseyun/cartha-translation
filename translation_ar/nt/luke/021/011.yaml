  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: ar
  text: وستحدث زلازل عظيمة، وتكون في أماكن شتّى مجاعات وأوبئة[a]، وستكون أهوال وعلامات عظيمة من السماء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «طواعين». يشير اللفظ اليوناني إلى تفشّي الأمراض الوبائية.
    reason: lexical_alternative
  - marker: b
    text: قد تشير «السماء» هنا إلى السماء ذات الدلالة اللاهوتية أو إلى السماء المرئية التي تظهر فيها الظواهر السماوية.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί μεγάλοι
  choice: زلازل عظيمة
  rationale: ينصّ التعبير اليوناني على زلازل كبيرة أو شديدة؛ و«زلازل عظيمة» ترجمة مباشرة تحفظ قوة العبارة وسجلها الكتابي.
- source_word: κατὰ τόπους
  choice: في أماكن شتّى
  rationale: يفيد التعبير توزّع الأحداث بحسب الأماكن، وهذه صياغة عربية طبيعية وواضحة.
- source_word: λιμοὶ
  choice: مجاعات
  rationale: يدل الاسم على المجاعة، لا على مجرد نقص محدود في الغذاء.
- source_word: λοιμοὶ
  choice: أوبئة
  rationale: يشير اللفظ إلى تفشّي أمراض وبائية أو طواعين؛ و«أوبئة» أوضح في العربية المعاصرة مع إبقاء البديل في الحاشية.
- source_word: φόβητρα
  choice: أمور مخيفة
  rationale: يدل الجمع المحايد النادر على أشياء أو أحداث تبعث الخوف؛ وهذه العبارة طبيعية ولا تحصر المقصود في نوع بعينه.
- source_word: σημεῖα
  choice: آيات
  rationale: «آيات» تقابل معنى العلامات ذات الدلالة، وهي مألوفة في العربية الكتابية؛ ولم تُستعمل «نُذُر» لأنها تضيف دلالة تشاؤمية أكثر تحديدًا.
- source_word: ἀπ’ οὐρανοῦ
  choice: من السماء
  rationale: تحفظ «السماء» في العربية إمكان الإشارة إلى الجرم أو الفضاء المرئي وإلى السماء ذات الرنين اللاهوتي، فلا تحسم الغموض اليوناني.
- source_word: ἔσονται / ἔσται
  choice: ستحدث / تكون / ستكون
  rationale: نُوّعت الصياغة بحسب طبيعة الأسماء في العربية لتجنب الركاكة، مع الحفاظ على دلالة المستقبل والوجود أو الوقوع.
theological_decisions:
- issue: دلالة οὐρανός في السياق الأخروي
  choice: من السماء
  alternative: من جهة السماء أو من الفضاء العلوي
  rationale: «السماء» تعبير عربي يحتمل الظواهر السماوية المرئية والمصدر السماوي ذي الرنين اللاهوتي، وبذلك يحفظ التوتر الدلالي ولا يفرض آلية طبيعية أو فوق طبيعية بعينها.
- issue: دلالة σημεῖα في السياق الرؤيوي
  choice: آيات
  alternative: علامات أو نُذُر
  rationale: «آيات» تحفظ المعنى الواسع لعلامات ذات دلالة، من غير أن تجعلها بالضرورة نُذُر شؤم، وهو معنى أضيق قد يوحي به السياق لكنه غير ملزم في اللفظ نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. روعي الإيقاع التراكمي للآية، مع استخدام «أمور مخيفة» بدل لفظ نادر أو ملتبس، والإبقاء على غموض «السماء» المقصود في الأصل.
