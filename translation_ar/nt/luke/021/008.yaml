source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: ar
  text: 'فقال: «احذروا أن تُضَلّوا، لأن كثيرين سيأتون باسمي قائلين: ‹أنا هو[a]›، و‹قد اقترب الوقت›. فلا تذهبوا وراءهم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ببساطة: «أنا». أي إن كل واحد منهم يدّعي أنه الشخص المنتظر، وربما المسيح.'
    reason: alternative_reading
lexical_decisions:
- source_word: Βλέπετε
  choice: احذروا
  rationale: فعل أمر يدعو إلى اليقظة والانتباه، و«احذروا أن» تركيب عربي طبيعي يلائم جملة التحذير التالية.
- source_word: μὴ πλανηθῆτε
  choice: أن تُضَلّوا
  rationale: يحافظ المبني للمجهول على صورة التسبب في الانحراف عن الحق، بدل حصر المعنى في مجرد الخداع الذهني.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: سيأتون باسمي
  rationale: ينقل التعبير الدال على المجيء استنادًا إلى اسم يسوع أو بادعاء سلطانه أو هويته، من غير زيادة تفسيرية في المتن.
- source_word: λέγοντες
  choice: قائلين
  rationale: ترجمة مباشرة لاسم الفاعل، وتترك مضمون الأقوال نفسه يكشف طبيعة الادعاء.
- source_word: Ἐγώ εἰμι
  choice: أنا هو
  rationale: يحافظ على إيجاز العبارة اليونانية وعلى محمولها المضمر، من غير التصريح بأن المقصود هو «المسيح» مع أن السياق قد يوحي بذلك.
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: قد اقترب الوقت
  rationale: «الوقت» واضح للقارئ، و«قد اقترب» ينقل صيغة التمام ذات الأثر الحاضر في الفعل اليوناني.
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: فلا تذهبوا وراءهم
  rationale: يحفظ صورة الحركة وراءهم، ويؤدي في السياق معنى عدم اتباع هؤلاء المدّعين.
theological_decisions:
- issue: دلالة Ἐγώ εἰμι في سياق المدّعين المضلّين
  choice: أنا هو
  alternative: 'أنا؛ أو: أنا المسيح'
  rationale: «أنا هو» تبقي الادعاء موجزًا كما في اليونانية وتدل على تعيين الذات بوصفها الشخص المنتظر، من غير إدخال لفظ «المسيح» غير المذكور صراحة. وتوضح الحاشية الاحتمال السياقي مع حفظ الغموض الحقيقي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت تراكيب مألوفة مثل «احذروا أن تُضَلّوا» و«لا تذهبوا وراءهم»، مع إبقاء الإيجاز والغموض المقصودين في «أنا هو».
