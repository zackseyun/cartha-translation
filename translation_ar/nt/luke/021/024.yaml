  terminology: اختيار «الأمم» متسق للفظة ἔθνη في مواضعها الثلاثة ويحفظ إمكان معنى «غير اليهود» في الحواشي. و«أزمنة الأمم» ترجمة سليمة لـ καιροὶ ἐθνῶν، و«تكتمل» لا تفرض تأويلًا أخرويًا محددًا.
