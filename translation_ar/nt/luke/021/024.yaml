    rationale: πεσοῦνται وαἰχμαλωτισθήσονται مستقبلان، وἔσται πατουμένη تركيب يفيد حالة مستقبلية مستمرة. المضارع العربي قد يستعمل حكائيًا أو نبويًا في سياق أوسع، لكن نص الآية المستقل يحتاج إلى قرينة استقبال صريحة.
