  source_fidelity: 'المعنى منقول بأمانة: السقوط بحد السيف، والسبي إلى جميع الأمم، ودوس أورشليم، والحد الزمني لأزمنة الأمم. لكن صيغ المضارع في المتن العربي لا تُظهر بوضوح الاستقبال الذي تدل عليه الأفعال اليونانية المستقبلية، ولا يوجد في الآية العربية المستقلة سياق سابق يقتضي حملها على المستقبل.'
