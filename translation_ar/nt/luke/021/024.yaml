source:
  edition: SBLGNT
  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: ar
  text: وَسَيَسْقُطُونَ بِحَدِّ السَّيْفِ، وَسَيُسَاقُونَ أَسْرَى إِلَى جَمِيعِ الْأُمَمِ[a]، وَسَتَكُونُ أُورُشَلِيمُ مَدُوسَةً مِنَ الْأُمَمِ[b]، إِلَى أَنْ تَكْتَمِلَ أَزْمِنَةُ الْأُمَمِ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى جميع غير اليهود» أو «بين جميع الأمم»؛ فاللفظة اليونانية يمكن أن تعني «الأمم» أو «غير اليهود» بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وستكون أورشليم مدوسةً من غير اليهود».'
    reason: alternative_reading
  - marker: c
    text: 'أو: «إلى أن تكتمل أزمنة غير اليهود».'
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: يَسْقُطُونَ
  rationale: يحافظ على صورة السقوط في سياق الحرب، حيث يفهم منه القتل، من غير تحويل الصورة إلى شرح مباشر مثل «يموتون».
- source_word: στόματι μαχαίρης
  choice: بِحَدِّ السَّيْفِ
  rationale: مقابل عربي طبيعي للتعبير اليوناني الحرفي «بفم السيف»، ويحفظ الصورة الحسية وأداة القتل.
- source_word: αἰχμαλωτισθήσονται
  choice: يُسَاقُونَ أَسْرَى
  rationale: ينقل صيغة المبني للمجهول ومعنى اقتياد الأسرى بعيدًا، لا مجرد وقوعهم في الأسر.
- source_word: εἰς τὰ ἔθνη πάντα
  choice: إِلَى جَمِيعِ الْأُمَمِ
  rationale: يعكس دلالة الحركة في εἰς، ويحافظ على تكرار ἔθνη بوصفه «الأمم» في الآية.
- source_word: Ἰερουσαλήμ
  choice: أُورُشَلِيمُ
  rationale: الصيغة العربية الكتابية المألوفة لاسم المدينة.
- source_word: πατουμένη
  choice: مَدُوسَةً
  rationale: ينقل صورة الدوس والخضوع المستمر في التركيب المستقبلي المحيطي ἔσται πατουμένη.
- source_word: ἄχρι οὗ
  choice: إِلَى أَنْ
  rationale: تعبير زمني عربي واضح وطبيعي يدل على استمرار الحال حتى بلوغ الحد المذكور.
- source_word: πληρωθῶσιν
  choice: تَكْتَمِلَ
  rationale: يحفظ معنى بلوغ الأزمنة تمامها من غير افتراض مخطط أخروي معيّن؛ وهو أوضح عربيًا هنا من ترجمة حرفية قد توهم معنى مختلفًا.
- source_word: καιροὶ ἐθνῶν
  choice: أَزْمِنَةُ الْأُمَمِ
  rationale: يحفظ صيغة الجمع والإضافة وغموض العلاقة بين الأزمنة والأمم، من غير إدخال كلمة «المعيّنة» في المتن.
theological_decisions:
- issue: دلالة ἔθνη في مواضعها الثلاثة
  choice: الأمم
  alternative: غير اليهود / الوثنيون
  rationale: «الأمم» تحافظ على التماسك المعجمي وعلى إمكان الدلالة على الشعوب أو على غير اليهود، بدل حسم هذا التوتر في المتن.
- issue: معنى καιροὶ ἐθνῶν
  choice: تكتمل أزمنة الأمم
  alternative: تتم أزمنة غير اليهود / تُستوفى الأزمنة المعيّنة للأمم
  rationale: الصياغة المختارة تبقي الفترة محدودة وقابلة لفكرة التمام، لكنها لا تفرض تصورًا أخرويًا أو تحدد بدقة نوع الإضافة.
translation_notes:
  register: 'فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم المضارع للدلالة على المستقبل بعد سياق النبوءة، مع الحفاظ على الصور الأصلية: السقوط، وحد السيف، واقتياد الأسرى، ودوس المدينة. وُضعت علامات الحواشي في المتن بترتيب ظهورها.'
