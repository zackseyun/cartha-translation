    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: حين
  rationale: تقدّم جملة زمنية احتمالية بصورة طبيعية في العربية، من غير تشديد زائد على معنى التكرار.
- source_word: προβάλωσιν
  choice: تكون قد أخرجت أوراقها
  rationale: الفعل يدل على إخراج نمو جديد. ذِكر «الأوراق» مفهوم من سياق الأشجار، مع توضيح في الحاشية أنه غير مذكور صراحة في اليونانية.
- source_word: ἤδη
  choice: بالفعل / قد صار
  rationale: 'حُفظ المعنى الزمني في الموضعين: ظهور النمو أصبح واقعًا، وقرب الصيف أصبح قائمًا.'
- source_word: βλέποντες
  choice: إذ ترونها
  rationale: يحفظ علاقة اسم الفاعل بالفعل الرئيس بوصف الرؤية ظرفًا مصاحبًا يؤدي إلى المعرفة.
- source_word: ἀφ’ ἑαυτῶν
  choice: بأنفسكم
  rationale: ينقل معنى التوصل إلى المعرفة من الملاحظة الشخصية من غير حاجة إلى تفسير خارجي.
- source_word: γινώσκετε
  choice: تعرفون
  rationale: صياغة مباشرة للفعل الدال على المعرفة الناشئة من ملاحظة العلامة.
- source_word: ἐγγὺς
  choice: قريبًا
  rationale: ينقل بوضوح معنى القرب الزمني في تشبيه الفصول.
- source_word: θέρος
  choice: الصيف
  rationale: المقابل العربي الطبيعي للموسم المقصود.
