  text: And not a hair from your head will perish[a].
translation:
  language: ar
  text: ولن تهلك شعرة واحدة من رؤوسكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفياً على نحو أقرب: «لن تهلك من رؤوسكم شعرة»؛ ويستعمل اليوناني نفياً مزدوجاً مؤكداً للتعبير عن ضمان قوي.'
    reason: بيان الصياغة الحرفية وقوة النفي في الأصل اليوناني.
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: أداة وصل عادية تحفظ اتصال القول بما قبله من غير إضافة معنى استدراكي غير صريح.
- source_word: θρὶξ
  choice: شعرة واحدة
  rationale: الاسم المفرد يُستعمل هنا في تعبير تصويري؛ وإضافة «واحدة» طبيعية في العربية وتبرز معنى عدم ضياع أدنى شيء.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: من رؤوسكم
  rationale: تحفظ «من» دلالة ἐκ، ويوافق جمع «رؤوسكم» المخاطَبين الجمع في العربية بوضوح وطبيعية.
- source_word: οὐ μὴ
  choice: لن
  rationale: «لن» تنقل النفي المستقبلي المؤكد بإيجاز عربي طبيعي، مع بيان شدة النفي اليوناني في الحاشية.
- source_word: ἀπόληται
  choice: تهلك
  rationale: تنقل معنى الفعل ἀπόλλυμι وتحفظ نبرة القول الجادة، من غير أن تحصره تفسيرياً في الضرر الجسدي وحده أو تستبدله بمعنى «تضيع» الأخف.
theological_decisions:
- issue: التوتر الظاهر بين هذا الوعد والتنبؤ القريب بالاضطهاد وموت بعض التلاميذ
  choice: الإبقاء على العبارة التصويرية كما هي بوصفها تأكيداً قوياً للحفظ، من غير تفسير نوع هذا الحفظ داخل المتن.
  alternative: صياغتها وعداً صريحاً بعدم وقوع أي أذى جسدي، أو شرحها في المتن بأنها تعني الحفظ الأبدي وحده.
  rationale: السياق نفسه يذكر الاضطهاد والموت، لذلك ينبغي ألا تحسم الترجمة التوتر بتفسير مضاف؛ فالعبارة العربية تحفظ قوة الوعد وغموض مداه المقصود.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل جمع «رؤوسكم» لموافقة المخاطَبين الجمع، مع إبقاء الصورة المأثورة والتوتر السياقي من غير شرح عقائدي داخل المتن.
