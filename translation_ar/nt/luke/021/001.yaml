  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: ar
  text: ثم رفع بصره، فرأى الأغنياء يضعون عطاياهم[a] في الخزانة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تقدماتهم» بدلًا من «عطاياهم».'
