  - marker: b
    text: يمكن أن يدل اللفظ اليوناني المترجم «الخزانة» على موضع خزانة الهيكل أو على أوعية جمع العطايا.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: رفع نظره
  rationale: ينقل المعنى الحسي لرفع العينين أو النظر إلى أعلى، بصياغة عربية فصيحة وطبيعية.
- source_word: δὲ
  choice: ثم
  rationale: أداة ربط خفيفة هنا، و«ثم» تلائم تتابع السرد من غير إقحام معنى تضاد.
- source_word: εἶδεν
  choice: فرأى
  rationale: ترجمة مباشرة لفعل الإدراك البصري، مع الفاء لربط النتيجة بالفعل السابق طبيعيًا.
- source_word: τοὺς βάλλοντας
  choice: يضعون
  rationale: مع أن الفعل قد يعني حرفيًا «يلقون»، فإن «يضعون» هو التعبير العربي الطبيعي في سياق تقديم العطايا.
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: في خزانة الهيكل
  rationale: يشير المصطلح إلى خزانة الهيكل أو موضعها أو أوعية جمع العطايا؛ وإضافة «الهيكل» توضح المرجع السياقي من غير حسم الهيئة المادية للمكان.
- source_word: τὰ δῶρα αὐτῶν
  choice: عطاياهم
  rationale: تحافظ «عطايا» على المعنى الأساسي للهبات، مع بقاء «تقدماتهم» بديلًا سياقيًا ممكنًا.
- source_word: πλουσίους
  choice: الأغنياء
  rationale: صفة مستعملة استعمال الاسم، و«الأغنياء» ترجمة عربية موجزة وطبيعية.
