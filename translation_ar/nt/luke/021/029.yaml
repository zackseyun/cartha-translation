  text: 'وقال لهم مثلًا: «انظروا إلى شجرة التين وإلى جميع الأشجار.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: تحافظ الواو على اتصال الكلام بما قبله من غير إضافة دلالة زمنية غير صريحة.
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: وقال لهم مثلًا
  rationale: صياغة عربية طبيعية وأمينة لبنية القول مع المفعول به؛ و«مثل» هو المصطلح المألوف لهذا النوع التعليمي في الأناجيل.
- source_word: Ἴδετε
  choice: انظروا إلى
  rationale: صيغة أمر توجّه انتباه المخاطبين إلى المثال المرئي، و«انظروا إلى» واضحة وطبيعية.
- source_word: τὴν συκῆν
  choice: شجرة التين
  rationale: يدل الاسم هنا على الشجرة، والتصريح بـ«شجرة» يمنع فهمه على أنه الثمرة.
- source_word: πάντα τὰ δένδρα
  choice: جميع الأشجار
  rationale: تنقل العبارة بصورتها الشاملة من دون إضافة «الأخرى»، وهي غير مذكورة صراحة في اليونانية.
