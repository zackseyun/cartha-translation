  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: ar
  text: هكذا أنتم أيضًا، متى رأيتم هذه الأمور تحدث، فاعلموا أن ملكوت الله[a] قريب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن مُلك الله قريب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: هكذا أنتم أيضًا
  rationale: تنقل تطبيق تشبيه شجرة التين السابق، وتحافظ على إبراز الضمير الصريح ὑμεῖς من غير تكلف.
- source_word: ὅταν ἴδητε
  choice: متى رأيتم
  rationale: تعبر بصورة طبيعية عن الاحتمال المستقبلي الذي تدل عليه ὅταν مع صيغة الالتزام.
- source_word: ταῦτα γινόμενα
  choice: هذه الأمور تحدث
  rationale: تحافظ على الإشارة إلى العلامات المذكورة وعلى معنى وقوع الأحداث في γινόμενα.
- source_word: γινώσκετε
  choice: فاعلموا
  rationale: تنقل صيغة الأمر الداعية إلى إدراك دلالة العلامات، وتربط النتيجة بما قبلها ربطًا عربيًا واضحًا.
- source_word: ἐγγύς ἐστιν
  choice: قريب
  rationale: تحافظ على استعارة القرب الزماني أو المكاني من غير إضافة دلالة جانبية مثل «قد اقترب».
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير كتابي عربي مألوف يحفظ اتساع βασιλεία بين معنى الملك والمُلك أو الحكم، من غير حسم تفسيري.
theological_decisions:
- issue: دلالة «ملكوت الله» في السياق الأخروي
  choice: الإبقاء على «ملكوت الله» من غير توسع تفسيري
  alternative: حُكم الله قريب
  rationale: لا يحدد النص هل المقصود أساسًا ظهور الملكوت أم اكتماله أم إثباته؛ لذلك يحافظ التعبير على التوتر اللاهوتي القائم.
- issue: طبيعة قرب الملكوت
  choice: «قريب» من غير تحديد نوع القرب
  alternative: على وشك أن يأتي
  rationale: ἐγγύς ἐστιν يقرر القرب، لكنه لا يصرح هنا بمدة زمنية أو بكيفية مجيء الملكوت، فلا ينبغي تضييق المعنى.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «ملكوت الله» بوصفه التعبير الكتابي العربي الأوسع دلالة، مع تجنب الألفاظ القديمة مثل «تصير» حين يكون «تحدث» أوضح للقارئ المعاصر.
