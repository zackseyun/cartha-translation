  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: ar
  text: أمّا هذه الأشياء التي تنظرون إليها[a]، فستأتي أيام لا يُترَك فيها حجر على حجر إلا ويُنقَض[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذه الأشياء التي ترونها». يمكن أن يدل الفعل على الرؤية عمومًا أو على النظر والملاحظة على نحو أخص.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «لا يُترَك حجر على حجر لا يُنقَض»، وهو تعبير يفيد الخراب التام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: أمّا هذه الأشياء التي تنظرون إليها
  rationale: تُبرز «أمّا» العبارة المتقدمة بوصفها موضوع الكلام، وتحافظ «تنظرون إليها» على معنى المشاهدة المتعمدة والمستمرة الذي يحتمله θεωρεῖτε، مع إبقاء الإشارة إلى الأشياء المنظورة دون تعيين زائد.
- source_word: ἐλεύσονται ἡμέραι
  choice: فستأتي أيام
  rationale: صياغة عربية طبيعية تحفظ صورة مجيء الأيام وصيغة المستقبل في اليونانية، من غير إضافة أداة تعريف غير موجودة في المصدر.
- source_word: ἐν αἷς
  choice: فيها
  rationale: 'تؤدي المعنى الزمني للعبارة الموصولة بإيجاز طبيعي، أي: في تلك الأيام.'
- source_word: οὐκ ἀφεθήσεται
  choice: لا يُترَك
  rationale: يحفظ المبني للمجهول ومعنى البقاء أو الترك في موضعه ضمن سياق هدم البناء.
- source_word: λίθος ἐπὶ λίθῳ
  choice: حجر على حجر
  rationale: تعبير عربي واضح وقريب من الصورة اليونانية، ويفيد مع بقية الجملة الخراب التام.
- source_word: ὃς οὐ καταλυθήσεται
  choice: إلا ويُنقَض
  rationale: 'تنقل صيغة الاستثناء العربية القوة الشاملة للتركيب اليوناني: لا يبقى أي حجر فوق آخر من غير أن يُهدم. و«يُنقَض» ملائمة للمباني وتحافظ على المبني للمجهول.'
theological_decisions:
- issue: نطاق نبوة يسوع وقوتها بشأن أبنية الهيكل
  choice: صياغة القول بوصفه إنذارًا واقعيًا بخراب بنيوي شامل، من غير ربطه بنظام أخروي معين.
  alternative: فهم القول على أنه رمزي في المقام الأول، أو إدخاله في إطار لاهوتي لاحق محدد.
  rationale: يتحدث النص اليوناني مباشرة عن الأشياء المنظورة وعن نقض الحجارة، لذلك تُحفظ دلالته المحسوسة وقوته الشاملة من غير إضافة تفسير عقائدي لا يصرح به العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يُنقَض» لأنه طبيعي في وصف تفكيك الأبنية وهدمها، مع الحفاظ على شمول النبوءة وصيغة المبني للمجهول.
