  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: ar
  text: ولكن متى سمعتم بحروب واضطرابات[a]، فلا ترتعبوا؛ لأنه لا بد أن تحدث هذه الأمور أولًا، ولكن النهاية لا تأتي فورًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قلاقل»، أو «فوضى»، أو «اضطراب في الأحوال».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ولكن متى
  rationale: تؤدي «متى» معنى الزمن المستقبلي غير المحدد، وتنقل «ولكن» الانتقال الخفيف الذي تفيده δέ من غير مبالغة في إبراز التضاد.
- source_word: ἀκούσητε
  choice: سمعتم بـ
  rationale: صياغة عربية طبيعية عند سماع أخبار أحداث مثل الحروب والاضطرابات.
- source_word: πολέμους
  choice: حروب
  rationale: المقابل المباشر الطبيعي للجمع، ويشير إلى صراعات مسلحة.
- source_word: ἀκαταστασίας
  choice: اضطرابات
  rationale: لفظ واسع يشمل القلاقل والفوضى وعدم الاستقرار، من غير حصر المعنى في الثورات أو أعمال الشغب.
- source_word: μὴ πτοηθῆτε
  choice: فلا ترتعبوا
  rationale: يحفظ قوة النهي عن الخوف الشديد أو الذعر، وهو أقوى من «لا تقلقوا».
- source_word: δεῖ γὰρ
  choice: لأنه لا بد
  rationale: «لا بد» تنقل معنى الضرورة في δεῖ، و«لأن» تؤدي وظيفة γάρ التفسيرية.
- source_word: ταῦτα γενέσθαι
  choice: أن تحدث هذه الأمور
  rationale: تعبير عربي واضح وطبيعي عن وقوع الأحداث.
- source_word: πρῶτον
  choice: أولًا
  rationale: 'يحفظ الدلالة الترتيبية: وقوع هذه الأمور يسبق النهاية.'
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: ولكن النهاية لا تأتي فورًا
  rationale: أُظهر الفعل المحذوف في العبارة اليونانية لتستقيم العربية، مع إبقاء النفي منصبًّا على فورية مجيء النهاية.
theological_decisions:
- issue: توقيت النهاية في سياق الحروب والاضطرابات
  choice: هذه الأحداث لا تعني أن النهاية تأتي فورًا
  alternative: هذه الأحداث تقع قبل النهاية، لكنها ليست النهاية نفسها
  rationale: يحذر النص من مساواة أخبار الاضطراب بحلول النهاية مباشرة، من غير فرض نظام أخروي معيّن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «اضطرابات» لاتساع دلالته، و«لا ترتعبوا» لحفظ قوة الفعل اليوناني. أُثبتت علامة الحاشية [a] في المتن، ولم تُضف حاشية ثانية لأن «لا تأتي فورًا» جُعلت في النص نفسه بوصفها الإظهار العربي الطبيعي للعبارة اليونانية المحذوف فعلها.
