  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: ar
  text: وحينئذ سيرون ابن الإنسان آتيًا في سحابة مع قوة ومجد عظيم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على سحابة». يرد اللفظ اليوناني بالمفرد: «في سحابة»، فيما تستدعي الصورة دانيال 7 ومواضع ذات صلة عن مجيء ابن الإنسان مع السحب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: سيرون
  rationale: ينقل دلالة المستقبل وفعل الإدراك البصري بعبارة عربية واضحة ومباشرة.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب المعروف وصلته الأدبية والرؤيوية بدانيال 7 من غير تفسير اختزالي.
- source_word: ἐρχόμενον
  choice: آتيًا
  rationale: يعبر عن اسم الفاعل المقترن بما سيرونه، ويحافظ على معنى المجيء بأسلوب عربي فصيح طبيعي.
- source_word: ἐν νεφέλῃ
  choice: في سحابة
  rationale: يتبع صيغة المصدر اليوناني المفردة واستعمال ἐν مع المجرور، من غير مواءمة العبارة قسرًا مع نصوص موازية.
- source_word: μετὰ δυνάμεως
  choice: بقوة
  rationale: صياغة عربية موجزة وطبيعية تفيد المصاحبة والحال في هذا السياق.
- source_word: δόξης πολλῆς
  choice: مجد عظيم
  rationale: تركيب عربي مألوف ينقل مقدار المجد وسمو النبرة، بدل الترجمة الحرفية غير الطبيعية «مجد كثير».
theological_decisions:
- issue: ترجمة اللقب المسيحاني τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: «ابن الإنسان» هو المقابل العربي الراسخ الذي يحفظ وظيفة العبارة كلقب وصداها مع دانيال 7، من غير حسم دلالتها بتفسير خاص.
- issue: صورة السحابة وصداها الدانيالي والظهوري
  choice: في سحابة
  alternative: على سحابة
  rationale: تتبع الترجمة لفظ لوقا المفرد كما هو، مع إثبات البديل الممكن في الحاشية، فلا تُوحِّد الصياغة مع مواضع أخرى ولا تطمس صداها النصي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «وحينئذ» لحفظ تتابع καὶ τότε، و«آتيًا» لصياغة اسم الفاعل بصورة طبيعية. وُضعت فاصلة بعد «سحابة» لتوضيح تعلق «بقوة ومجد عظيم» بهيئة المجيء.
