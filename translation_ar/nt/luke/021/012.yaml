source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: ar
  text: ولكن قبل هذا كله، سيمدّون أيديهم إليكم[a] ويضطهدونكم، ويسلّمونكم إلى المجامع والسجون، وتُساقون أمام ملوك وولاة من أجل اسمي[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: سيقبضون عليكم. واليونانية تقول حرفياً: «سيضعون أيديهم عليكم»، وهو تعبير قد يدل على القبض العدائي أو إساءة المعاملة.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضاً ترجمة «من أجل اسمي» بـ«بسبب اسمي». ويحفظ النص تعبير «اسمي» لما فيه من إشارة إلى شخص يسوع وسلطانه، بدلاً من تفسيره مباشرةً بـ«بسببي».
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: ولكن قبل هذا كله
  rationale: تفيد πρό مع المضاف إليه السبق الزمني، ويشير τούτων πάντων إلى مجموع الأمور المذكورة. ونقلت δέ بـ«ولكن» لإظهار الانتقال التقابلي.
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: سيلقون أيديهم عليكم
  rationale: يحافظ التعبير على الصورة الحسية في اليونانية، وهو في السياق كناية عن القبض العدائي أو الاعتداء، مع بيان ذلك في الحاشية.
- source_word: διώξουσιν
  choice: يضطهدونكم
  rationale: السياق يحدد معنى الملاحقة العدائية والاضطهاد، لا مجرد التتبع.
- source_word: παραδιδόντες
  choice: ويسلّمونكم
  rationale: ينقل معنى التسليم إلى جهات دينية أو عقابية بوصفه مظهراً من مظاهر الاضطهاد، بصياغة عربية طبيعية.
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: إلى المجامع والسجون
  rationale: أُبقيت أسماء المؤسسات كما في المصدر دون توسيع «المجامع» تفسيرياً إلى سلطاتها أو محاكمها.
- source_word: ἀπαγομένους
  choice: وتُساقون
  rationale: اسم المفعول اليوناني منصوب ويعود إلى المخاطَبين؛ لذلك حُفظ البناء للمجهول، و«تُساقون» ينقل الحركة القسرية بوضوح.
- source_word: ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: أمام ملوك وولاة
  rationale: تفيد ἐπί هنا المثول أمام أصحاب السلطة في سياق قضائي، و«ولاة» مقابل عربي مألوف لـἡγεμόνας.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: من أجل اسمي
  rationale: يحفظ التعبير الكتابي «اسمي» وصلته بشخص يسوع وسلطانه، كما أن «من أجل» تحتمل معنى السبب والدافع دون اختزاله إلى صياغة تفسيرية.
theological_decisions:
- issue: دلالة «اسمي» في سياق الاضطهاد
  choice: الإبقاء على التعبير «من أجل اسمي»
  alternative: بسببي؛ أو لأنكم تنتمون إليّ
  rationale: للتعبير «اسمي» وزن كتابي يشمل شخص يسوع وسلطانه والاعتراف به. إبقاؤه يصون هذا الاتساع ولا يفرض تفسيراً أضيق.
- issue: علاقة «تُساقون» بالأفعال السابقة
  choice: 'الحفاظ على البناء للمجهول: «وتُساقون أمام...»'
  alternative: ويسوقونكم أمام...
  rationale: الصيغة ἀπαγομένους مبنية للمجهول وتصف المخاطَبين، فحُفظ هذا التركيب بدل تحويله بلا ضرورة إلى فعل معلوم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت الصورة الاصطلاحية في «يلقون أيديهم عليكم» مع شرحها، واستُعمل «تُساقون» لصون المبني للمجهول والقسر الذي يفيده السياق. وُضعت علامتا الحاشيتين في موضعيهما داخل النص.
