lexical_decisions:
- source_word: εἶδεν
  choice: رأى
  rationale: ينقل الفعل الماضي من ὁράω مباشرةً ويحافظ على بساطة السرد.
- source_word: δέ
  choice: الواو في «ورأى»
  rationale: أداة ربط سردية خفيفة، والواو العربية تصل الكلام بما قبله من غير أن تفترض تعارضًا.
- source_word: τινα
  choice: أرملةً بصيغة النكرة
  rationale: تفيد τις شخصًا غير معيّن، وتؤدي النكرة العربية هذا المعنى طبيعيًا من غير حاجة إلى «إحدى» أو «أرملة معينة».
- source_word: χήραν
  choice: أرملةً
  rationale: المقابل العربي المباشر الذي يحفظ أيضًا دلالة الضعف الاجتماعي في السياق.
- source_word: πενιχρὰν
  choice: فقيرةً
  rationale: تدل الكلمة على قلة ذات اليد؛ و«فقيرة» واضحة ودقيقة، بينما قد تبالغ «معدمة» في المعنى.
- source_word: βάλλουσαν
  choice: تضع
  rationale: مع أن βάλλω قد يعني الرمي أو الإلقاء، فالمقصود هنا إيداع النقود، و«تضع» تعبير عربي طبيعي غير عتيق.
- source_word: ἐκεῖ
  choice: هناك
  rationale: ترجمة مباشرة للظرف، مع اعتماد موضع الإيداع المذكور في السياق السابق.
- source_word: λεπτὰ δύο
  choice: فلسين صغيرين من النحاس
  rationale: الـλεπτά قطعتان نقديتان نحاسيتان بالغتا الصغر والقيمة؛ و«فلسين» تعبير عربي مفهوم للعملة الضئيلة، مع بيان مادتها وصغرها وحفظ الاسم اليوناني في الحاشية.
