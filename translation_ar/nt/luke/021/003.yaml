base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: ar
  text: 'وقال: «الحق أقول لكم: إن هذه الأرملة الفقيرة وضعت أكثر منهم جميعًا[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «ألقت أكثر من الجميع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  choice: الحق
  rationale: تؤدي وظيفة الظرف الذي يفتتح توكيدًا جازمًا، وتحافظ على قوة العبارة المألوفة في أقوال يسوع بلغة عربية واضحة وموقرة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية تحفظ الخطاب الموجَّه إلى الجمع والنبرة التقريرية ذات السلطان.
- source_word: χήρα
  choice: الأرملة
  rationale: المقابل العربي الدقيق والمألوف للمرأة التي مات زوجها.
- source_word: πτωχή
  choice: الفقيرة
  rationale: ينقل معنى الفقر من غير المبالغة بتحديد درجته على نحو لا يصرح به هذا اللفظ وحده.
- source_word: αὕτη
  choice: هذه
  rationale: يحفظ قوة اسم الإشارة الذي يحدد الأرملة المقصودة.
- source_word: πλεῖον
  choice: أكثر
  rationale: ينقل صيغة المقارنة الكمية بإيجاز ووضوح.
- source_word: πάντων
  choice: منهم جميعًا
  rationale: ينقل مضافًا إليه للمقارنة، ويدل في السياق على سائر مقدمي العطايا من غير حسم ما إذا كان التركيز على كل فرد أم على مجموعهم.
- source_word: ἔβαλεν
  choice: وضعت
  rationale: تعبير عربي طبيعي عن إيداع المال في موضع العطايا، مع إثبات البديل الأقرب إلى الصورة الحرفية في الحاشية.
theological_decisions:
- issue: وجه المقارنة بين عطية الأرملة وعطايا الآخرين
  choice: وضعت أكثر منهم جميعًا
  alternative: وضعت أكثر من أي واحد منهم
  rationale: تحافظ الصياغة على سعة عبارة πλεῖον πάντων وعلى التوتر في المقارنة، فلا تحسم هنا هل المقصود أكثر من كل واحد على حدة أم أكثر من الجميع مجتمعين، ولا تستبق تفسير الآية التالية المتعلق بنسبة العطاء إلى ما يملكه صاحبه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت العبارة المألوفة «الحق أقول لكم» لما فيها من قوة تقريرية من دون تكلف، وجاء ترتيب «هذه الأرملة الفقيرة» طبيعيًا مع حفظ جميع عناصر النص اليوناني.
