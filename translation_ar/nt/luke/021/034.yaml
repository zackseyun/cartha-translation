  - severity: medium
    issue: ينبغي إظهار «ذلك اليوم» فاعلًا للمجيء المفاجئ.
    rationale: في اليونانية ἡ ἡμέρα ἐκείνη هي فاعل ἐπιστῇ، وαἰφνίδιος يصف مجيئه المفاجئ. «ويأتي عليكم ذلك اليوم بغتة» يحافظ على البنية والمعنى بوضوح.
  - severity: low
    issue: لا توجد حاشية عربية للبديل المعجمي المتصل بـκραιπάλῃ، وموضع مرساة الحاشية الإنجليزية لا يطابق موضوعها.
    rationale: محتوى الحاشية يشرح κραιπάλῃ لا الضمير «أنفسكم»؛ لذا توضع المرساة العربية بعد «الخُمار» حيث تكون ذات صلة.
