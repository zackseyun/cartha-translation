  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: ar
  text: لكن انتبهوا لأنفسكم، لئلا تُثقَل قلوبكم بالخُمار[أ] والسُّكر وهموم الحياة، ويأتي عليكم ذلك اليوم بغتة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'أو: المجون في الشرب. قد يدل اللفظ اليوناني على الإفراط في الشرب أو على آثاره، كالخُمار.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: لكن احذروا على أنفسكم
  rationale: ينقل فعل الأمر الدال على التيقظ والحذر، ويحافظ على الضمير الانعكاسي من غير أن يوحي بمجرد المشاهدة.
- source_word: μήποτε βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: لئلا تثقل قلوبكم
  rationale: يحفظ صورة القلب الذي يصير مثقلًا، مع دلالة التحذير الوقائي في μήποτε.
- source_word: κραιπάλῃ
  choice: الخمار
  rationale: يدل اللفظ في هذا السياق على آثار الإفراط في الشراب وما يصاحبها من صداع وغثيان؛ و«الخمار» لفظ عربي واضح نسبيًا يميز المعنى من «السُّكر» المذكور بعده.
- source_word: μέθῃ
  choice: السُّكر
  rationale: المقابل المباشر لحالة الثمالة، ويظل متميزًا من آثار الإفراط التي يدل عليها اللفظ السابق.
- source_word: μερίμναις βιωτικαῖς
  choice: هموم الحياة
  rationale: تعبير طبيعي جامع لانشغالات الحياة الأرضية وقلقها، من غير إضافة حكم سلبي غير مصرّح به.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: فيباغتكم
  rationale: يجمع بصورة عربية طبيعية معنى المجيء على المخاطبين ومعنى المفاجأة الذي يحمله αἰφνίδιος.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: ذلك اليوم
  rationale: يحافظ على العبارة الإشارية كما وردت، من غير إضافة تفسير مثل «يوم الدينونة».
theological_decisions:
- issue: المرجع الأخروي لعبارة ἡ ἡμέρα ἐκείνη
  choice: ذلك اليوم
  alternative: يوم الدينونة
  rationale: السياق يضفي على العبارة دلالة أخروية، لكن النص نفسه لا يضيف وصفًا عقائديًا، لذلك تُحفظ صياغته الموجزة.
translation_notes:
  register: صياغة عربية فصحى معاصرة رصينة ومباشرة. استُخدم «الخمار» للحفاظ على التمييز بين κραιπάλη وμέθη، واستُخدم «فيباغتكم» لنقل الوصول المفاجئ بإيجاز طبيعي.
