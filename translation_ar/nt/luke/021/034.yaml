  rationale: تُستبدل الصياغة غير المألوفة بتعبير عربي فصيح طبيعي، ويُعاد بناء الشطر الأخير ليبقى «ذلك اليوم» فاعلًا ويُعبَّر عن عنصر المفاجأة صراحةً. وأُضيفت حاشية معجمية في موضعها الدلالي الصحيح، مع إبقاء الغموض المعجمي المشروع في κραιπάλῃ.
