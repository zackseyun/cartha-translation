  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: ar
  text: كَفَخٍّ؛[a] لأنه سيحلّ على جميع الساكنين على وجه الأرض كلها.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كشَرَكٍ».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني الكلمة اليونانية المترجمة «الأرض» أيضًا «البلاد»، لكن «الأرض كلها» أنسب لشمول العبارة هنا. ويعني التعبير المترجم «الساكنين» حرفيًا «الجالسين»، ويُراد به المقيمون أو العائشون على الأرض.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς παγίς
  choice: كَفَخٍّ
  rationale: تنقل كاف التشبيه معنى ὡς، و«فخ» تعبير عربي واضح يحفظ صورة الخطر المباغت الذي يصعب الإفلات منه.
- source_word: ἐπεισελεύσεται
  choice: سيحلّ على
  rationale: ينقل معنى المجيء على الناس أو مباغتتهم، بصياغة عربية طبيعية ورصينة. والفاعل المستتر يعود بحسب السياق إلى اليوم المذكور في العدد السابق.
- source_word: γὰρ
  choice: لأنه
  rationale: تحفظ أداة التعليل صلة الجملة بالتحذير السابق.
- source_word: ἐπὶ πάντας
  choice: على جميع
  rationale: تعكس شمول πάντας واتجاه الفعل نحو جميع الناس المعنيين.
- source_word: τοὺς καθημένους
  choice: الساكنين
  rationale: مع أن الفعل يعني حرفيًا الجلوس، فإنه في هذا التركيب يدل اصطلاحيًا على الإقامة أو السكن.
- source_word: ἐπὶ πρόσωπον
  choice: على وجه
  rationale: يحفظ التعبير الكتابي المتأثر بالأسلوب السامي، وهو مفهوم في العربية بمعنى على سطح.
- source_word: πάσης τῆς γῆς
  choice: الأرض كلها
  rationale: تحفظ إمكان معنى الأرض في سياق التحذير الشامل، مع الإشارة في الحاشية إلى احتمال معنى البلاد أو اليابسة.
theological_decisions:
- issue: نطاق γῆ في التحذير الأخروي
  choice: الأرض كلها
  alternative: البلاد كلها
  rationale: اقتران العبارة بـ«جميع الساكنين على وجه» يرجّح هنا النطاق الشامل، من غير إلغاء المرونة المعجمية لكلمة γῆ، ولذلك ذُكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة، مع إبقاء صورة الفخ والتعبير الكتابي «على وجه الأرض»، وعدم التصريح بمرجع ضمير الفعل داخل النص لأن اليونانية تتركه مستفادًا من السياق.
