id: LUK.21.28
reference: Luke 21:28
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: ar
  text: ولكن عندما تبدأ هذه الأمور بالحدوث[a]، فانتصبوا وارفعوا رؤوسكم[b]، لأن فداءكم يقترب[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حين تبدأ هذه الأمور بالوقوع».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا فهم العبارة: «اعتدلوا وارفعوا رؤوسكم».'
    reason: lexical_alternative
  - marker: c
    text: يمكن أيضًا ترجمة «الفداء» بـ«الخلاص» أو «التحرير»؛ ويشير هنا إلى الخلاص النهائي الآتي لشعب يسوع.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων δὲ τούτων γίνεσθαι
  choice: ولكن عندما تبدأ هذه الأمور بالحدوث
  rationale: تنقل العبارة المطلقة بالمضاف زمن الحدث بمعنى «عندما/حين تبدأ هذه الأمور أن تحدث»، وتحافظ على معنى البدء والحدوث، بينما تفيد «ولكن» انتقالًا لطيفًا من الضيق السابق إلى التشجيع.
- source_word: ἀνακύψατε
  choice: فانتصبوا
  rationale: يفيد الفعل الاعتدال بعد الانحناء، حرفيًا ومجازيًا، ولذلك ينقل صورة استعادة الشجاعة من غير اختزالها في مجرد النظر إلى أعلى.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: وارفعوا رؤوسكم
  rationale: يحافظ على صورة النص وصيغة الجمع، ويعبّر طبيعيًا عن الثقة والرجاء.
- source_word: διότι
  choice: لأن
  rationale: تنقل العلاقة السببية بوضوح في العربية المعاصرة.
- source_word: ἐγγίζει
  choice: يقترب
  rationale: يحافظ المضارع على معنى الدنو الجاري، لا مجرد حالة ثابتة.
- source_word: ἀπολύτρωσις
  choice: فداءكم
  rationale: «الفداء» المقابل اللاهوتي المألوف الذي يحتفظ بمعنى التحرير والخلاص، من غير قصره على نجاة سياسية أو روحية مجردة.
theological_decisions:
- issue: دلالة «فداءكم» في الخطاب الأخروي
  choice: الإبقاء على «فداءكم» بما يشير في السياق إلى خلاص تلاميذ يسوع النهائي القريب
  alternative: «نجاتكم» بوصفها نجاة من الأزمة التاريخية المباشرة وحدها
  rationale: السياق مستقبلي وأخروي، ولفظ ἀπολύτρωσις أوسع وأثقل دلالة من مجرد الإفلات من خطر آني؛ لذلك تُحفظ العبارة دون تحديد آلية الفداء بما يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «فانتصبوا» لصون الصورة الجسدية والمجازية، و«فداءكم» للحفاظ على الثقل الخلاصي للفظ اليوناني دون تفسير مذهبي زائد.
