  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: ar
  text: 'فسألوه قائلين: «يا معلّم، متى إذًا تكون هذه الأمور، وما العلامة حين توشك هذه الأمور أن تحدث؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يدل الفعل اليوناني أيضًا على مستقبل عام، لا على قرب الوقوع وحده.
    reason: بديل معجمي يحفظ اتساع دلالة μέλλῃ بين قرب الوقوع والمستقبل العام.
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: فسألوه
  rationale: الفعل في الماضي البسيط يروي فعل السؤال، و«سألوا» هو المقابل العربي الطبيعي المباشر، مع إلحاق الضمير للمفعول به.
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تواصل السرد؛ والفاء تلائم السياق العربي من غير أن توحي بتعارض قوي.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ اسم الفاعل على البنية التي تمهّد لنص السؤال، وهو تعبير عربي فصيح واضح.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: ينقل المعنى الأساسي بوصفه لقبًا لمن يعلّم، من غير إضافة دلالة «السيد» أو سلطة أقوى من اللفظ اليوناني.
- source_word: πότε οὖν
  choice: متى إذًا
  rationale: «متى» للسؤال عن الزمن، و«إذًا» تحفظ دلالة الاستنتاج من الكلام السابق.
- source_word: ταῦτα ἔσται
  choice: تكون هذه الأمور
  rationale: يحافظ على فعل الكينونة في العبارة الأولى، مع صياغة عربية سليمة تشير إلى وقوع الأمور المذكورة.
- source_word: σημεῖον
  choice: العلامة
  rationale: «العلامة» هي المقابل العربي الواضح لما يدل على قرب حدث أو يكشفه.
- source_word: ὅταν
  choice: حين
  rationale: تقدّم جملة زمنية مستقبلية على نحو طبيعي في العربية.
- source_word: μέλλῃ
  choice: توشك
  rationale: تنقل دلالة التهيؤ أو القرب المحتملة في الفعل اليوناني، مع إبقاء مدى هذا القرب غير محدد.
- source_word: γίνεσθαι
  choice: أن تحدث
  rationale: المقصود وقوع الأحداث؛ و«تحدث» صياغة عربية معاصرة واضحة.
theological_decisions:
- issue: الدلالة الأخروية وال nuance الزمنية في μέλλῃ
  choice: «حين توشك هذه الأمور أن تحدث»
  alternative: «حين تكون هذه الأمور عتيدة أن تحدث» أو «حين ستحدث هذه الأمور»
  rationale: تحفظ «توشك» احتمال دلالة القرب في اليونانية من غير تحديد مقدار القرب أو فرض تصور أخروي بعينه، وتذكر الحاشية إمكان فهم الفعل بدلالة مستقبلية أعم.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعملت «يا معلّم» للنداء الطبيعي، و«متى إذًا» لحفظ الاستنتاج، مع تجنّب الألفاظ القديمة مثل «مزمع» و«يكون كائنًا».
