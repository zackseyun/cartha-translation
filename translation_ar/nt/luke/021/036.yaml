  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: ar
  text: لكن اسهروا في كل حين، مصلّين لكي تقووا[a] على الإفلات من جميع هذه الأمور المزمع أن تحدث[b]، وعلى الوقوف أمام ابن الإنسان.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «لكي تُحسبوا أهلًا للإفلات من جميع هذه الأمور...» بدلًا من: «لكي تقووا على الإفلات...»'
    reason: textual_variant
  - marker: b
    text: 'أو: «التي ستقع».'
    reason: lexical_alternative
  - marker: c
    text: قد يفيد «الوقوف أمام ابن الإنسان» الوقوف مقبولين أو مُبرَّئين أمامه، لكن اليونانية تترك هذا المعنى ضمنيًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: اسهروا
  rationale: أمر باليقظة المستمرة؛ و«اسهروا» يحفظ صورة الاستيقاظ والتنبه بصياغة عربية كتابية واضحة.
- source_word: δὲ
  choice: بل
  rationale: تفيد انتقالًا ذا مسحة استدراكية بعد التحذير السابق، و«بل» تلائم السياق من غير مبالغة في قوة التعارض.
- source_word: ἐν παντὶ καιρῷ
  choice: في كل حين
  rationale: تعبير عربي طبيعي يحفظ معنى الاستمرار والشمول الزمني.
- source_word: δεόμενοι
  choice: مصلّين
  rationale: اسم الحال يدل هنا على الدعاء والابتهال إلى الله، و«مصلّين» أوضح تعبير سياقي.
- source_word: ἵνα κατισχύσητε
  choice: لكي تقووا
  rationale: الفعل κατισχύω يدل على امتلاك القوة أو القدرة الكافية والغلبة؛ واختيار «تقووا» موجز ويحفظ تعلّقه بالمصدرين التاليين من غير إدخال معنى الاستحقاق الوارد في قراءة نصية أخرى.
- source_word: ἐκφυγεῖν
  choice: على الإفلات من
  rationale: ينقل معنى النجاة أو الهرب من الأمور الآتية، ويتصل طبيعيًا في العربية بعبارة «تقووا على».
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: جميع هذه الأمور المزمع أن تحدث
  rationale: يحفظ μέλλω دلالة المستقبل القريب أو المتوقع من غير حسم مقدار قربه؛ و«تحدث» عربية واضحة لـγίνεσθαι في هذا السياق.
- source_word: σταθῆναι
  choice: على الوقوف
  rationale: يحفظ صورة الوقوف كما في اليونانية، من غير التصريح بقبول أو تبرئة يتركهما السياق ضمنيين.
- source_word: ἔμπροσθεν
  choice: أمام
  rationale: مقابل مكاني وعلاقي مباشر وطبيعي في العربية.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الصيغة العربية الراسخة لهذا اللقب، وتحفظ خلفيته السامية واستعماله المسيحاني في الأناجيل.
theological_decisions:
- issue: دلالة κατισχύσητε وصلتها بالثبات في الأحداث الأخروية
  choice: «لكي تقووا» بحسب قراءة SBLGNT، أي تكون لكم القوة أو القدرة الكافية.
  alternative: «لكي تُحسبوا أهلًا» بحسب قراءة نصية أخرى.
  rationale: النص المعتمد يقرأ κατισχύσητε، وهو يدل على القوة أو الغلبة لا على الحكم بالاستحقاق. ولأهمية القراءة الأخرى في تاريخ النص والتفسير، تُذكر في الحاشية ولا تُدخل في المتن.
- issue: دلالة σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: «الوقوف أمام ابن الإنسان» من غير إضافة تفسيرية.
  alternative: «الوقوف مقبولين أمام ابن الإنسان» أو «المثول أمام ابن الإنسان».
  rationale: قد يوحي التعبير بالقبول أو التبرئة في الدينونة، لكن اليونانية لا تصرّح بذلك؛ لذلك تُحفظ الصورة والتوتر اللاهوتي في المتن، مع بيان الاحتمال في الحاشية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة وقورة. استُعملت «اسهروا» و«في كل حين» للمحافظة على الصورة الإنجيلية المألوفة من غير غموض، وربطت «تقووا على» بالمصدرين «الإفلات» و«الوقوف» لإظهار البنية النحوية للآية. وُضعت علامة الحاشية [b] عند العبارة التي تشمل البديل المعجمي والقراءة النصية، وعلامة [a] بعد عبارة الوقوف التي تشرحها.
