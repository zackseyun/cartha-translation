base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: ar
  text: لِأَنَّ هذِهِ أَيَّامُ الانْتِقَامِ، لِيَتِمَّ كُلُّ مَا كُتِبَ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن هذه أيام القصاص».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حتى يتم كل ما كُتب».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تؤدي القوة السببية والتفسيرية التي تربط الآية بالتحذير السابق، وهي طبيعية في العربية.
- source_word: ἡμέραι ἐκδικήσεως
  choice: أَيَّامُ الانْتِقَامِ
  rationale: يحافظ التعبير على صورة «الأيام» وعلى المعنى القضائي الشديد لـἐκδίκησις، من غير تحويله إلى مجرد عدالة عامة.
- source_word: αὗταί εἰσιν
  choice: هذِهِ ...
  rationale: صياغة اسمية عربية طبيعية تحفظ اسم الإشارة والتوكيد السياقي، ولا تحتاج إلى مقابل مستقل لفعل الكينونة في المضارع.
- source_word: τοῦ πλησθῆναι
  choice: لِكَيْ يَتِمَّ
  rationale: ينقل دلالة الغاية أو النتيجة في تركيب τοῦ مع المصدر، مع إبقاء العلاقة بينهما مفتوحة نسبيًا.
- source_word: πάντα τὰ γεγραμμένα
  choice: كُلُّ مَا هُوَ مَكْتُوبٌ
  rationale: يحفظ الشمول ودلالة اسم المفعول التام، من غير تخصيص المرجع صراحةً بالنبوات أو بالكتب المقدسة وحدها.
theological_decisions:
- issue: طبيعة ἐκδικήσεως في النبوة
  choice: الانتقام
  alternative: القصاص / الجزاء
  rationale: «الانتقام» هو المقابل المباشر ويحفظ حدة الحكم القضائي في السياق، من غير إضافة وصف تفسيري يحسم طبيعته بأكثر مما يقوله النص.
- issue: دلالة τοῦ مع المصدر
  choice: لكي يتم
  alternative: حتى يتم / ليتم
  rationale: يحتمل التركيب الغاية والنتيجة؛ و«لكي» تنقل هذه الصلة بوضوح من غير تقرير تفسير لاهوتي أضيق.
- issue: مرجع τὰ γεγραμμένα
  choice: ما هو مكتوب
  alternative: ما كُتب / النبوات المكتوبة
  rationale: أُبقي المرجع عامًا كما في اليونانية، فلا يُقصر صراحةً على مجموعة محددة من النصوص.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية وقورة. استُخدم «الانتقام» للمحافظة على القوة القضائية للنص، و«يتم» لأنه طبيعي مع «ما هو مكتوب» ويشمل معنى الإتمام والتحقق. أُثبتت علامتا الحاشيتين في المتن.
