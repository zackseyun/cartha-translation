  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «ثم» لـ τότε، و«قال لهم» لصيغة تقديم القول، و«ستنهض» لصيغة Ἐγερθήσεται في سياق الصراع، مع المحافظة على التوازي بين الأمة والمملكة.'
  naturalness: الصياغة فصيحة حديثة وموجزة وطبيعية في العربية. والتعبير المتوازي «أمة على أمة، ومملكة على مملكة» مألوف ومناسب للأسلوب النبوي/الإنذاري، وتُفهم «على» فيه على معنى المواجهة.
  terminology: «أمة» و«مملكة» اختياران مناسبان للسياق السياسي وللتوازي في الأصل. ولا تُدخل الترجمة تفسيرًا أخرويًا أو مذهبيًا زائدًا.
