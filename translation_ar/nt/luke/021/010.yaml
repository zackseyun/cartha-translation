base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: ar
  text: 'ثم قال لهم: «ستنهض أمة على أمة، ومملكة على مملكة»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: ثم
  rationale: أداة زمنية تربط القول بالسياق السابق وتحافظ طبيعيًا على تتابع السرد.
- source_word: ἔλεγεν
  choice: قال
  rationale: مع أن صيغة الماضي الناقص قد تفيد الاستمرار، فإن «قال» هي الصياغة العربية المألوفة عند تقديم الكلام المباشر من غير مبالغة في إبراز الجانب الاستمراري.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ترجمة طبيعية للمفعول غير المباشر في العربية.
- source_word: Ἐγερθήσεται
  choice: ستنهض
  rationale: يناسب الفعل في صيغة الصراع بين الجماعات السياسية، ويحافظ على معنى القيام أو النهوض للمواجهة من غير افتراض فاعل خارجي.
- source_word: ἔθνος
  choice: أمة
  rationale: يدل هنا على جماعة قومية بوصفها كيانًا جماعيًا أو سياسيًا، ويتوازى مع «مملكة».
- source_word: ἐπ’ ἔθνος
  choice: على أمة
  rationale: تؤدي «على» معنى المواجهة والعداء في هذا التركيب، وتحافظ على الصيغة العربية الموجزة المتوازية.
- source_word: βασιλεία
  choice: مملكة
  rationale: المقصود كيان أو سلطان سياسي ملموس، لا مفهوم المُلك المجرد.
- source_word: ἐπὶ βασιλείαν
  choice: على مملكة
  rationale: تحافظ على التوازي البلاغي، وتفيد المواجهة في السياق.
theological_decisions:
- issue: صيغة الصراع الأخروي
  choice: صياغة القول بوصفه تنبؤًا مباشرًا بصراع الأمم والممالك، من غير إدخال نظام محدد لأحداث النهاية.
  alternative: قصره على سقوط أورشليم وحده، أو عرضه بوصفه جدولًا تفصيليًا لنهاية الزمان.
  rationale: الآية نفسها تعلن نهوض أمة على أمة ومملكة على مملكة، ولا تحسم وحدها الخلافات الأخروية الأوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على الإيجاز والتوازي في العبارة اليونانية. لم تُضف حاشية لأن البديل الإنجليزي «will arise» يخص دقة التعبير الإنجليزي، بينما «ستنهض» يستوعب في العربية معنى النهوض أو القيام في هذا السياق.
