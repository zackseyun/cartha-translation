id: LUK.21.21
reference: Luke 21:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: ar
  text: حينئذٍ، فليهرب الذين في اليهودية إلى الجبال، وليخرج الذين في وسطها[a]، ولا يدخل إليها الذين في المناطق الريفية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الضميران في «وسطها» و«إليها» يعودان إلى أورشليم المذكورة في السياق السابق.
    reason: توضيح مرجع الضمير المؤنث الذي قد يلتبس بلفظ «اليهودية» في العربية.
lexical_decisions:
- source_word: τότε
  choice: حينئذٍ
  rationale: ظرف زمان يربط الأمر بما سبق، وهذه الصياغة موجزة وطبيعية وتحفظ تسلسل الخطاب.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: الذين في اليهودية
  rationale: ينقل التعبير الدال على الأشخاص الموجودين في إقليم اليهودية من غير زيادة تفسيرية.
- source_word: φευγέτωσαν
  choice: فليهرب
  rationale: لام الأمر تحفظ قوة صيغة الأمر للغائب، والفعل «يهرب» هو المقابل المباشر في سياق الخطر العاجل.
- source_word: εἰς τὰ ὄρη
  choice: إلى الجبال
  rationale: ترجمة مباشرة لعبارة الوجهة، وتحفظ معنى ὄρη بوصفها جبالًا.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: الذين في وسطها
  rationale: يحفظ تركيب «في وسطها» والضمير المؤنث من دون إدخال اسم «أورشليم» صراحة في المتن.
- source_word: ἐκχωρείτωσαν
  choice: وليخرج
  rationale: ينقل الأمر بالانسحاب والخروج من المكان بلغة عربية واضحة، من غير إضافة مفعول غير مصرح به.
- source_word: οἱ ἐν ταῖς χώραις
  choice: الذين في المناطق الريفية
  rationale: يشير في هذا السياق إلى النواحي خارج المدينة، لا إلى الحقول المزروعة حصرًا.
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: ولا يدخل إليها
  rationale: «لا» الناهية تحفظ قوة النهي، و«إليها» تبقي ضمير الجهة المؤنث كما في اليونانية.
theological_decisions:
- issue: مرجع الضميرين αὐτῆς وαὐτήν
  choice: إبقاء الضمير المؤنث في المتن مع توضيح أن مرجعه أورشليم في الحاشية
  alternative: التصريح باسم «أورشليم» أو «المدينة» في المتن
  rationale: السياق السابق يشير إلى أورشليم، لكن الاسم غير مكرر في هذه الآية. إبقاء الضمير يحفظ نسيج الأصل وما فيه من إحالة، والحاشية تزيل الالتباس المحتمل مع «اليهودية».
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت لام الأمر و«لا» الناهية للمحافظة على توازي الأوامر وإلحاحها، مع تجنب الأسلوب المتقادم أو الشرح الزائد داخل المتن.
