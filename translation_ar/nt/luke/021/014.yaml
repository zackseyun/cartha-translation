  text: ⸀θέτε οὖν ⸂ἐν ταῖς καρδίαις⸃ ὑμῶν μὴ προμελετᾶν ἀπολογηθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/014.yaml
  text: Therefore[a], settle it in your hearts not to prepare beforehand to defend yourselves[b],
translation:
  language: ar
  text: فاعزموا إذًا في قلوبكم[a] ألّا تستعدّوا مسبقًا للدفاع عن أنفسكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اجعلوا في قلوبكم»، أي «قرّروا في داخلكم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ألّا تتمرّنوا مسبقًا على تقديم دفاعكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέτε
  choice: اعزموا
  rationale: الفعل أمرٌ يدل هنا، في التركيب الاصطلاحي مع «في قلوبكم»، على تثبيت قرار داخلي؛ و«اعزموا» يؤدي هذا المعنى بوضوح وطبيعية.
- source_word: οὖν
  choice: إذًا
  rationale: تفيد النتيجة المترتبة على الكلام السابق، وتحافظ «إذًا» على الصلة الاستنتاجية في سياق عربي فصيح طبيعي.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: في قلوبكم
  rationale: تحافظ على صورة القلب بوصفه موضع العزم الداخلي، وعلى صيغة الجمع الموجّهة إلى جماعة المخاطبين.
- source_word: μὴ
  choice: ألّا
  rationale: تنفي مضمون المصدر التابع لفعل الأمر، وصيغة «اعزموا... ألّا» سليمة وطبيعية في العربية.
- source_word: προμελετᾶν
  choice: تستعدّوا مسبقًا
  rationale: يدل الفعل على الإعداد أو التمرّن سلفًا؛ وهذه الصياغة واضحة ومعاصرة وتحفظ عنصر السبق دون إيحاءات غير مقصودة.
- source_word: ἀπολογηθῆναι
  choice: للدفاع عن أنفسكم
  rationale: يشير إلى تقديم جواب دفاعي، غالبًا في مقام رسمي أو قضائي، وتحفظ الصياغة العربية البعد الانعكاسي للفعل.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم التعبير «اعزموا... في قلوبكم» للموازنة بين الصورة اليونانية والطبيعية العربية، مع إبقاء النهي متعلقًا بالاستعداد السابق للدفاع دون توسيع المعنى ليدل على كل نوع من الاستعداد.
