  to: لِأَنَّ هَؤُلَاءِ جَمِيعًا قَدَّمُوا فِي الْعَطَايَا[a] مِنْ فَضْلَةِ مَا لَدَيْهِمْ، أَمَّا هِيَ فَقَدَّمَتْ مِنْ عَوَزِهَا[b] كُلَّ مَا كَانَتْ تَمْلِكُهُ لِلْمَعِيشَةِ[c].
  rationale: عُدِّل الفعل في الموضعين إلى «قدّموا/قدّمت» لتجنّب تركيب عربي غير مألوف مع «العطايا»، مع الحفاظ على فعل الإيداع/التبرع الذي يفيده βάλλω في هذا السياق. كما صيغت خاتمة الآية بصورة أكثر سلاسة وأمانة لمعنى موارد العيش. أبقيت «العطايا» في المتن والحاشية المرتبطة بها، ولم أضف تفسير «الخزانة» أو «الصندوق».
