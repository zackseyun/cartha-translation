  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: ar
  text: لِأَنَّ هَؤُلَاءِ جَمِيعًا قَدَّمُوا فِي الْعَطَايَا[a] مِنْ فَضْلَةِ مَا لَدَيْهِمْ، أَمَّا هِيَ فَقَدَّمَتْ مِنْ عَوَزِهَا[b] كُلَّ مَا كَانَتْ تَمْلِكُهُ لِلْمَعِيشَةِ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «التقدمات». يقول اليوناني حرفيًا «العطايا»، والمقصود عطايا مقدَّمة في سياق الهيكل.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من فقرها» أو «من حاجتها».'
    reason: lexical_alternative
  - marker: c
    text: 'أي: جميع وسائل معيشتها أو كل ما تقتات به؛ وليس المقصود «حياتها كلها» بمعنى وجودها بأكمله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: لِأَنَّ هَؤُلَاءِ جَمِيعًا
  rationale: تحفظ «لأن» الصلة التفسيرية التي تؤديها γάρ مع الكلام السابق، وتؤدي πάντες مع οὗτοι بوضوح ومن غير توسع.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: مِنْ فَضْلَةِ مَا لَدَيْهِمْ
  rationale: تدل العبارة على ما يزيد عن حاجتهم؛ و«فضلة ما لديهم» عربية واضحة وتحفظ المقابلة مع عوز المرأة.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: أَلْقَوْا فِي الْعَطَايَا
  rationale: يحفظ «ألقوا» الصورة الحسية للفعل βάλλω، وتبقي «العطايا» المعنى الحرفي لـ δῶρα في سياق تقدمات الهيكل دون تحويله إلى «الخزانة».
- source_word: αὕτη δὲ
  choice: أَمَّا هِيَ
  rationale: صياغة عربية طبيعية تُبرز المقابلة، والضمير يعود إلى الأرملة المذكورة في السياق.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: مِنْ عَوَزِهَا
  rationale: «العوز» يؤدي معنى النقص والحاجة في ὑστέρημα، ويحافظ على التضاد مع الفضل والزيادة.
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: كُلَّ مَا كَانَ لَهَا لِمَعِيشَتِهَا
  rationale: يفيد βίος هنا موارد العيش أو أسباب المعيشة، لا الحياة بمعنى الوجود كله؛ والصياغة واضحة في سياق المال.
- source_word: ἔβαλεν
  choice: فَأَلْقَتْ
  rationale: يكرر الفعل العربي نفسه للمحافظة على توازي الفعل اليوناني وصورته المادية في إيداع النقود.
theological_decisions:
- issue: معنى βίος في عطية الأرملة
  choice: ما كان لها لمعيشتها، أي جميع موارد عيشها
  alternative: كل حياتها
  rationale: السياق مالي، وβίος هنا يدل على أسباب العيش أو النفقة. أما «كل حياتها» فقد توحي بأنها قدمت وجودها نفسه، وهو معنى لا يقتضيه النص.
- issue: مرجع τὰ δῶρα
  choice: العطايا
  alternative: التقدمات؛ خزانة الهيكل
  rationale: تحافظ «العطايا» على اللفظ اليوناني من غير إضافة تخصيص «الخزانة» الذي يستفاد من السياق ولا يرد في هذه العبارة نفسها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «العطايا» لقربها من δῶρα، و«العوز» للمقابلة الموجزة مع الفضل، مع شرح البدائل في الحواشي. جميع علامات الحواشي مثبتة في المتن.
