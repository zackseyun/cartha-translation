  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: ar
  text: ويُغمى على الناس من الخوف ومن توقُّع ما هو آتٍ على العالم المسكون[a]، لأن قوى السماوات[b] ستتزعزع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «العالم» أو «الأرض»؛ واللفظ اليوناني يعني حرفيًا «العالم المسكون».
    reason: lexical_alternative
  - marker: b
    text: أو «القوى السماوية» أو «قوى السماء». وقد يشير التعبير على نحو واسع إلى قوى كونية أو سماوية.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων
  choice: يُغمى على
  rationale: ينقل معنى انهيار الناس أو فقدانهم الوعي والقوة من شدة الرعب، بصياغة عربية واضحة، من غير إدخال التعبير التفسيري التقليدي «تخور قلوبهم».
- source_word: ἀνθρώπων
  choice: الناس
  rationale: اللفظ اليوناني عام ويشير إلى البشر، لا إلى الذكور وحدهم.
- source_word: ἀπὸ φόβου
  choice: من الخوف
  rationale: تفيد ἀπό هنا السبب أو المصدر، و«من الخوف» تؤدي هذا المعنى بإيجاز ووضوح.
- source_word: προσδοκίας
  choice: توقُّع
  rationale: يحافظ على معنى الانتظار أو الترقب، بينما يبيّن السياق طابعه المخيف من غير إضافة معنى «التشاؤم» صراحةً إلى اللفظ.
- source_word: τῶν ἐπερχομένων
  choice: ما هو آتٍ
  rationale: صياغة عربية طبيعية للاسم الموصول المستفاد من اسم الفاعل اليوناني، وتشير إلى الأحداث المقبلة من غير زيادة «وشيكًا» التي لا يصرح بها النص.
- source_word: τῇ οἰκουμένῃ
  choice: على العالم المسكون
  rationale: يحفظ الدلالة الخاصة للعالم الذي يسكنه البشر، مع بيان البدائل العربية الأيسر في الحاشية.
- source_word: αἱ ... δυνάμεις τῶν οὐρανῶν
  choice: قوى السماوات
  rationale: ترجمة قريبة من التركيب اليوناني تبقي مفتوحًا احتمال الإشارة إلى قوى كونية أو سماوية، ولا تحصرها في أجرام أو كائنات بعينها.
- source_word: σαλευθήσονται
  choice: ستتزعزع
  rationale: ينقل المبني للمجهول وصورة الاضطراب الكوني، وهو طبيعي في العربية وأوسع دلالة من الحركة المكانية وحدها.
theological_decisions:
- issue: مدلول «قوى السماوات» في السياق الرؤيوي
  choice: الإبقاء على التعبير الكوني الملتبس «قوى السماوات»
  alternative: الأجرام السماوية؛ القوات الملائكية
  rationale: قد يستحضر التعبير بُنى الكون أو أجرامه أو قوى سماوية؛ لذلك لا تحصر الترجمة معناه في تفسير لاهوتي واحد لا يوجبه النص اليوناني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة مهيبة تلائم الخطاب الرؤيوي. استُخدم «يُغمى على الناس» بدل تعبيرات قديمة أو تفسيرية، وأُبقي «قوى السماوات» على غموضه المقصود.
