  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ar
  text: السماء والأرض ستزولان، أمّا كلامي فلن يزول أبدًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: السماء
  rationale: في اقترانه بالأرض يشير إلى السماء بوصفها جزءًا من الخليقة كلها، لا إلى الجو المرئي وحده.
- source_word: ἡ γῆ
  choice: الأرض
  rationale: في التعبير «السماء والأرض» تدل الكلمة على الأرض في النطاق الكوني، لا على أرض أو إقليم بعينه.
- source_word: παρελεύσονται
  choice: ستزولان / يزول
  rationale: الفعل هنا يفيد الزوال أو الانقضاء. صيغ في الجملة الأولى بالمثنى لموافقة الفاعلين، وكرر بالجذر نفسه في الثانية للمحافظة على المقابلة البلاغية.
- source_word: δὲ
  choice: أمّا ... فـ
  rationale: تنقل هذه الصياغة العربية قوة المقابلة بين زوال السماء والأرض وثبات كلام يسوع بصورة طبيعية وفصيحة.
- source_word: οἱ λόγοι μου
  choice: كلامي
  rationale: «كلامي» اسم جنس عربي طبيعي يدل على مجموع أقوال المتكلم، ويحفظ المعنى من غير إيحاء بأنه كلمات مفردة منعزلة.
- source_word: οὐ μὴ
  choice: لن ... أبدًا
  rationale: النفي المؤكد مع الفعل المستقبل نُقل بتركيب عربي صريح يجمع «لن» و«أبدًا»، فيحفظ شدة النفي.
theological_decisions:
- issue: قوة تأكيد دوام كلام يسوع
  choice: فلن يزول أبدًا
  alternative: فلا يزول مطلقًا
  rationale: يحفظ الاختيار النفي اليوناني المؤكد οὐ μὴ والتباين الحاد مع زوال السماء والأرض، من غير إضافة تفسير عقدي إلى النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم المثنى «ستزولان» على وفق النحو العربي، مع إبقاء تكرار جذر «زول» لإظهار التوازي والمقابلة في الأصل.
