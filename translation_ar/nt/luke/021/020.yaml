  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: ar
  text: ولكن عندما ترون أورشليم محاطة بالجيوش[a]، فاعلموا حينئذٍ أن خرابها[b] قد اقترب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «محاطة بالمعسكرات العسكرية». يمكن أن تشير الكلمة اليونانية إلى المعسكرات أو إلى الجيوش المرابطة فيها؛ والمقصود هنا القوات التي تحاصر أورشليم.'
    reason: lexical_alternative
  - marker: b
    text: يتردد في لفظ «الخراب» صدى لغة الدينونة النبوية؛ قارن الصياغة ذات الصلة في متى 24:15 ومرقس 13:14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: ولكن عندما
  rationale: تنقل أداة الانتقال أو المقابلة الخفيفة δὲ، وتقدّم الشرط المستقبلي الذي تعبّر عنه ὅταν مع صيغة الاحتمال، بأسلوب عربي واضح وطبيعي.
- source_word: ἴδητε
  choice: ترون
  rationale: تنقل فعل الرؤية الموجّه إلى جماعة، وتلائم العربية في سياق علامة مستقبلية.
- source_word: κυκλουμένην ὑπὸ στρατοπέδων
  choice: تحاصرها الجيوش
  rationale: صياغة عربية طبيعية تحفظ صورة تطويق أورشليم بقوات عسكرية. ويمكن أن يدل στρατόπεδον حرفيًا على المعسكر أو على الجيش المقيم فيه، لذلك ذُكر البديل في الحاشية.
- source_word: Ἰερουσαλήμ
  choice: أورشليم
  rationale: الاسم العربي الكتابي الشائع للمدينة.
- source_word: τότε γνῶτε
  choice: فاعلموا حينئذ
  rationale: تحفظ الظرف الزمني وقوة فعل الأمر الداعي إلى إدراك معنى العلامة.
- source_word: ἤγγικεν
  choice: قد اقترب
  rationale: تنقل دلالة صيغة التام اليونانية على اقتراب حدث ترتبت عليه حالة راهنة، من غير أن تجعله قد وقع بالفعل.
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: خرابها
  rationale: لفظ «الخراب» واضح ويحفظ صدى لغة الدينونة النبوية، كما يعود الضمير إلى أورشليم من غير إضافة تفسير زمني أو عقائدي.
theological_decisions:
- issue: مدلول خراب أورشليم الآتي
  choice: الإبقاء على «خرابها» من غير ربطه صراحةً بإطار أخروي معيّن
  alternative: ترجمته بـ«دمارها» أو إدخال صلة «رجسة الخراب» في المتن
  rationale: النص نفسه يعلن اقتراب خراب أورشليم عند محاصرتها بالجيوش. وتحفظ الصياغة الثقل النبوي للمفردة من غير حسم كيفية ارتباطها بالنصوص الموازية أو بمنظومة تفسيرية أوسع.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدمت جملة فعلية نشطة «تحاصرها الجيوش» بدل تركيب المبني للمجهول الأثقل، مع الحفاظ على صورة التطويق العسكري. وُضعت علامتا الحاشيتين في المتن كلتاهما.
