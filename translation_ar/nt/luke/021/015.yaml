  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: ar
  text: لأني أنا سأعطيكم كلامًا وحكمةً لن يستطيع أيٌّ من معارضيكم أن يقاومها أو يناقضها.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: كلامًا
  rationale: تعني «فمًا» حرفيًا، لكنها هنا كناية عن القدرة على الكلام أو الكلام الذي يُقال؛ و«كلامًا» تنقل المعنى بوضوح في العربية المعاصرة.
- source_word: σοφίαν
  choice: حكمةً
  rationale: المقابل العربي المباشر والطبيعي، ويُبقي الحكمة متميزة عن الكلام.
- source_word: ἀντιστῆναι
  choice: يقاوموهما
  rationale: ينقل معنى الوقوف في وجه الكلام والحكمة وعدم القدرة على الصمود أمامهما.
- source_word: ἀντειπεῖν
  choice: يناقضوهما
  rationale: يفيد الرد المعارض أو التفنيد بالكلام، و«يناقض» مناسب في سياق المحاجّة.
- source_word: ἅπαντες οἱ ἀντικείμενοι ὑμῖν
  choice: جميع معارضيكم
  rationale: يحفظ شمول «جميع» ويصوغ وصف الذين يقفون ضد المخاطَبين بعبارة عربية موجزة وطبيعية.
theological_decisions:
- issue: هوية المتكلم وتوكيد الضمير ἐγώ
  choice: لأني أنا سأعطيكم
  alternative: لأني سأعطيكم
  rationale: إظهار «أنا» يحفظ التوكيد الصريح في اليونانية من غير إضافة تفسير لهوية المتكلم أو لطبيعة العطية.
- issue: مرجع أداة الوصل المفردة ᾗ بعد «فمًا وحكمةً»
  choice: ربط عدم القدرة بالكلام والحكمة معًا بضمير التثنية
  alternative: قصرها نحويًا على الحكمة وحدها
  rationale: السياق يعرض الكلام والحكمة عطيةً مترابطة يواجه بها التلاميذ خصومهم؛ والتثنية أوضح عربيًا، مع الإقرار بأن صيغة اليونانية المفردة يمكن أن تُقرأ بوصفها متعلقة بالحكمة على نحو أضيق.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة، مع الحفاظ على توكيد المتكلم وشمول جميع المعارضين. استُبدلت كناية «فمًا» بمعناها السياقي «كلامًا» لتجنب الغموض غير المقصود لدى القارئ الحديث.
