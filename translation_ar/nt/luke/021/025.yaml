  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: ar
  text: «وستكون علامات في الشمس والقمر والنجوم، وعلى الأرض كربٌ للأمم، وهي في حيرةٍ من هدير البحر واضطرابه[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «من صوت البحر واضطرابه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: علامات
  rationale: المقابل العربي الواسع والمألوف، ويحافظ على إمكان فهم الظواهر بوصفها آيات كونية من غير زيادة معنى «النُّذُر».
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: في الشمس والقمر والنجوم
  rationale: صياغة عربية طبيعية تحافظ على دلالة ἐν وعلى ترتيب الأجرام السماوية.
- source_word: συνοχὴ ἐθνῶν
  choice: كربٌ بين الأمم
  rationale: «كرب» ينقل معنى الضيق الشديد، و«بين الأمم» يعبّر طبيعيًا عن امتداد الحالة إلى الشعوب مع بقاء إمكان فهم الإضافة اليونانية.
- source_word: ἐν ἀπορίᾳ
  choice: وحيرةٌ
  rationale: ينقل معنى العجز والحيرة عند انعدام المخرج، من غير إطالة ثقيلة في العربية.
- source_word: ἤχους θαλάσσης καὶ σάλου
  choice: من دويّ البحر واضطرابه
  rationale: «دويّ» يلائم الصوت الهائل، و«اضطرابه» يحافظ على معنى هيجان البحر وتقلبه دون إضافة «الأمواج» غير المذكورة صراحة.
theological_decisions:
- issue: طبيعة العلامات الكونية
  choice: إبقاء الحديث عن علامات في الأجرام السماوية بصورته المباشرة
  alternative: تفسيرها صراحةً على أنها أحداث فلكية حرفية أو رموز سياسية
  rationale: النص لا يحسم ما إذا كانت الظواهر حرفية أو رمزية أو تجمع بين الأمرين، لذلك تحافظ الترجمة على هذا التوتر.
- issue: علاقة دوي البحر بكرب الأمم وحيرتها
  choice: استعمال «من» بما يسمح بفهم الدوي والاضطراب سببًا للكرب والحيرة
  alternative: «عند دويّ البحر» بوصفها علاقة ظرفية أو استجابة للمشهد
  rationale: التركيب اليوناني موجز وقد يحتمل صلة سببية أو وصفية؛ «من» عربية طبيعية وتفيد المنشأ أو السبب دون شرح زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة مهيبة؛ استُعمل «كرب» و«دويّ» لقوتهما ووضوحهما، مع تجنب تفسير الصورة الأخروية تفسيرًا مذهبيًا.
