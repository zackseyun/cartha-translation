revisions:
- from: «وستكون علامات في الشمس والقمر والنجوم، وعلى الأرض كربٌ بين الأمم وحيرةٌ من دويّ البحر واضطرابه[a]».
  to: «وستكون علامات في الشمس والقمر والنجوم، وعلى الأرض كربٌ للأمم، وهي في حيرةٍ من هدير البحر واضطرابه[a]».
  rationale: التعديل يقرّب علاقة «الأمم» بـ«الكرب» من الإضافة اليونانية، ويجعل الحيرة حالًا للأمم كما في النص، من غير حسمٍ لطبيعة العلامات الكونية أو للعلاقة الدقيقة بين كرب الأمم وهدير البحر واضطرابه.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:33:40Z'
review_pass:
  verdict: revise
  source_fidelity: «بين الأمم» لا ينقل الإضافة في συνοχὴ ἐθνῶν بأقرب صورة؛ فالنص يتحدث عن كربٍ يخصّ الأمم/يصيبها، لا عن كرب واقعٍ فيما بينها. كما أن ἐν ἀπορίᾳ تصف الأمم في حال حيرة، والأوضح عربيًا إسناد الحيرة إليها صراحة. أمّا «من هدير البحر واضطرابه» فيحافظ على العلاقة الموجزة المحتملة في اليونانية من غير تقريرٍ تفسيري زائد.
  naturalness: الصياغة المنقحة فصحى حديثة سلسة، وتزيل اللبس الذي قد يفهم من «كرب بين الأمم» بوصفه نزاعًا بين الأمم، ومن عطف «وحيرة» بوصفه اسمًا مستقلاً غير مسند بوضوح إلى الأمم.
  terminology: «علامات» و«كرب» و«حيرة» ألفاظ مناسبة. استُبدل «دويّ» بـ«هدير» لأنه أشيع مع البحر في الاستعمال المعاصر، مع بقاء المعنى الصوتي لـἤχους. «اضطرابه» ينقل σάλου من غير إضافة لفظ «أمواج».
  issues:
  - severity: medium
    issue: «كربٌ بين الأمم»
    rationale: التركيب اليوناني συνοχὴ ἐθνῶν هو «كرب الأمم/كرب يصيب الأمم»، لا «كرب بين الأمم»، إذ قد توحي «بين» بعلاقة صراع أو تبادل بينهم لا يقتضيها المصدر.
  - severity: low
    issue: عدم إسناد «حيرة» إلى الأمم بوضوح
    rationale: ἐν ἀπορίᾳ يبيّن حال الأمم الواقعة في الكرب. إسنادها بضمير الجمع يحفظ هذه العلاقة النحوية والمعنوية بوضوح في العربية.
  revised_text: «وستكون علامات في الشمس والقمر والنجوم، وعلى الأرض كربٌ للأمم، وهي في حيرةٍ من هدير البحر واضطرابه[a]».
  revised_footnotes:
