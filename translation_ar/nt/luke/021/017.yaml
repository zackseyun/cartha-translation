lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: ستكونون مكروهين
  rationale: يجمع التعبير اليوناني بين فعل الكينونة في المستقبل واسم مفعول، فحُفظ تركيبه ودلالته على ما سيتعرض له المخاطبون بصياغة عربية واضحة.
- source_word: ὑπὸ πάντων
  choice: من الجميع
  rationale: تدل ὑπό مع المضاف إليه على الجهة الفاعلة، وπάντων تعني «الجميع» من غير حاجة إلى إضافة «الناس» غير المذكورة صراحة.
- source_word: διὰ τὸ ὄνομά μου
  choice: بسبب اسمي
  rationale: تفيد διά مع المنصوب السبب، وحفظت عبارة «اسمي» كما وردت لما تحمله من دلالة على هوية يسوع وسلطانه والإقرار بالولاء له.
theological_decisions:
- issue: دلالة «اسمي» في سياق الاضطهاد
  choice: الإبقاء على التعبير الحرفي «بسبب اسمي»
  alternative: بسببي؛ لأنكم تنتسبون إليّ
  rationale: النص اليوناني يذكر «اسمي» صراحة، وهذه العبارة قد تشمل شخص يسوع وهويته وسلطانه والاعتراف به. إبقاؤها يصون هذا الاتساع ولا يحصر المعنى في تفسير واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «مكروهين» للحفاظ على المبني للمجهول، و«الجميع» للإيجاز وموافقة عموم اللفظ اليوناني.
