  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: ar
  text: فيؤول ذلك لكم إلى شهادة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فيصير ذلك لكم فرصةً لتشهدوا».'
    reason: بديل معجمي وسياقي يبرز أن الأحداث تتيح للتلاميذ مناسبة لأداء الشهادة.
lexical_decisions:
- source_word: ἀποβήσεται
  choice: فيؤول ذلك
  rationale: الفعل في صيغة المستقبل يدل هنا على المآل أو النتيجة، لا على مجرد الحدوث؛ و«يؤول» ينقل هذا المعنى بإيجاز وفصاحة.
- source_word: ὑμῖν
  choice: لكم
  rationale: تحافظ اللام على دلالة المآل المتعلق بالتلاميذ، مع إبقاء احتمال المنفعة أو إتاحة المناسبة دون حسم زائد.
- source_word: εἰς
  choice: إلى
  rationale: تفيد «إلى» هنا النتيجة أو الغاية، وتحافظ على صورة التعبير اليوناني من غير أن تحسم بين كون الشهادة نتيجة وكونها فرصة.
- source_word: μαρτύριον
  choice: شهادة
  rationale: «شهادة» تنقل معنى الإدلاء بالشهادة أو مضمونها، وتلائم السياق العلني والقضائي، مع إبقاء احتمال دلالة البرهان قائمًا.
theological_decisions:
- issue: دلالة ما سيؤول إليه اضطهاد التلاميذ ومثولهم أمام السلطات
  choice: ستؤول هذه الأحداث بالنسبة إليهم إلى شهادة، من غير تحديد صريح لوجهتها أو وظيفتها.
  alternative: ستتيح لهم هذه الأحداث فرصة ليشهدوا؛ أو ستصير دليلًا على خصومهم.
  rationale: العبارة اليونانية موجزة، ويمكن أن تشير إلى شهادة يؤديها التلاميذ أو إلى شهادة ذات وظيفة إثباتية. لذلك أبقت الصياغة العربية هذا الاتساع، ووضحت الحاشية القراءة السياقية الأرجح دون إدخالها حصرًا في المتن.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات نبرة كتابية رصينة. استُخدم «فيؤول» لإبراز النتيجة، وأُبقي تركيب «إلى شهادة» للمحافظة على الإيجاز والغموض الحقيقي في دلالة الغاية أو النتيجة.
