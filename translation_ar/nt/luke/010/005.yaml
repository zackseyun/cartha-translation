- source_word: Εἰρήνη
  choice: سلامٌ
  rationale: تحافظ على إيجاز صيغة التحية والبركة، من غير إضافة فعل غير مصرح به في اليونانية.
- source_word: τῷ οἴκῳ τούτῳ
  choice: لهذا البيت
  rationale: اللام تنقل دلالة المجرور اليوناني بوصف البيت متلقي السلام، و«البيت» يبقي المعنى المكاني المحسوس مع إمكان شموله لأهله بحسب السياق.
theological_decisions:
