- source_word: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃
  choice: وأيَّ بيتٍ دخلتموه
  rationale: تنقل العبارة جملة الصلة غير المحددة ذات المعنى العام المستقبلي، وتحافظ صيغة «دخلتموه» على معنى الحركة إلى داخل البيت بلغة عربية طبيعية.
- source_word: πρῶτον
