  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: ar
  text: 'فقال لهم[a]: «كنتُ أرى الشيطان يسقط من السماء كالبرق».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رأيتُ الشيطان يسقط من السماء كالبرق». يمكن ترجمة الفعل اليوناني الناقص بماضٍ بسيط، لكن «كنتُ أرى» تُبرز جانبه الاستمراري.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: فقال لهم
  rationale: ينقل الفعل الماضي السردي والربط الخفيف بـ«فـ»، مع إبقاء الضمير مفعولًا غير مباشر.
- source_word: Ἐθεώρουν
  choice: كنتُ أرى
  rationale: يحافظ تركيب «كان» مع المضارع على الجانب الاستمراري للفعل اليوناني الناقص، من غير أن يفرض تفسيرًا زمنيًا بعينه.
- source_word: τὸν Σατανᾶν
  choice: الشيطان
  rationale: هو المقابل العربي المألوف للاسم/اللقب الشخصي Σατανᾶς.
- source_word: ὡς ἀστραπὴν
  choice: كالبرق
  rationale: تعبير عربي طبيعي وموجز يحفظ صورة التشبيه.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: من السماء
  rationale: «السماء» أنسب هنا من «الجو» أو «السّماء المرئية»، وتحفظ الدلالة الكونية واللاهوتية المحتملة.
- source_word: πεσόντα
  choice: ساقطًا
  rationale: حال منصوبة تتبع «الشيطان» في تركيب الإدراك، وتحفظ رؤية حدث السقوط من غير إضافة نتيجة أو توقيت غير مصرّح بهما.
theological_decisions:
- issue: القوة الزمنية والجانبية لقول يسوع عن سقوط الشيطان
  choice: كنتُ أرى الشيطان ساقطًا من السماء كالبرق
  alternative: رأيتُ الشيطان يسقط من السماء كالبرق
  rationale: يحفظ النص الجانب الاستمراري للماضي الناقص اليوناني، من غير حسم ما إذا كان الكلام عن سقوط بدئي، أو أثر خدمة التلاميذ آنذاك، أو رؤية نبوية للهزيمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «كنتُ أرى» بدل صياغة أثقل مثل «كنت أشاهد»، وحُفظ التشبيه الموجز «كالبرق» والغموض المتعلق بزمن السقوط ودلالته.
