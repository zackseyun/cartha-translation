source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: ar
  text: 'فأجاب: «تُحِبُّ الرَّبَّ إلهَكَ مِنْ كُلِّ قلبِكَ[a]، وبكلِّ نفسِكَ، وبكلِّ قوَّتِكَ، وبكلِّ فكرِكَ، وتُحِبُّ قريبَكَ كنفسِكَ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تَرِد العبارة عادةً في العربية: «بكل قلبك». أمّا اليونانية هنا فتقول حرفيًّا: «مِنْ كل قلبك» (ἐξ ὅλης τῆς καρδίας)، بينما تستعمل العبارات التالية حرف الجر بمعنى «بـ/في» (ἐν).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجاب
  rationale: صياغة عربية سردية طبيعية تختصر تركيب اسم الفاعل مع الفعل من غير فقدان المعنى.
- source_word: Ἀγαπήσεις
  choice: تُحِبُّ
  rationale: المضارع العربي في سياق الاقتباس التشريعي يؤدي معنى الأمر بصيغة تقريرية، ويحافظ على صدى نص الوصية دون تحويله إلى شرح.
- source_word: κύριον τὸν θεόν σου
  choice: الرَّبَّ إلهَكَ
  rationale: ترجمة مباشرة تحفظ اللقب الإلهي والعلاقة الإضافية في العبارة.
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: مِنْ كُلِّ قلبِكَ
  rationale: تحفظ دلالة ἐξ «من» وتميّزها عن ἐν في العبارات التالية، مع بقاء الأسلوب العربي مفهومًا.
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: بكلِّ نفسِكَ
  rationale: «النفس» مقابل راسخ وواضح لـ ψυχή، من غير فرض تقسيم أنثروبولوجي تقني.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: بكلِّ قوَّتِكَ
  rationale: «القوة» تنقل معنى ἰσχύς بوضوح في العربية المعاصرة.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: بكلِّ فكرِكَ
  rationale: «الفكر» تعبير عربي طبيعي عن القدرة الذهنية المقصودة بـ διάνοια في هذا السياق.
- source_word: τὸν πλησίον σου
  choice: قريبَكَ
  rationale: يحفظ المفهوم العلاقي للشخص القريب الوارد في الاقتباس الأخلاقي، وهو أوجز من صياغة تفسيرية مثل «مَن هو قريب منك».
- source_word: ὡς σεαυτόν
  choice: كنفسِكَ
  rationale: مقابل عربي مألوف يحفظ قوة المقارنة في ὡς.
theological_decisions:
- issue: ترجمة κύριος كلقب إلهي في اقتباس كتابي
  choice: الرَّبّ
  alternative: السيّد
  rationale: «الرَّبّ» هو المقابل العربي الراسخ للقب الإلهي هنا، ويحفظ الصدى الكتابي من غير إدخال تفسير طائفي.
- issue: تراكم ألفاظ القلب والنفس والقوة والفكر
  choice: الإبقاء على العناصر الأربعة منفصلة
  alternative: جمعها في عبارة تفسيرية مثل «بكل كيانك»
  rationale: يحفظ الامتلاء البلاغي للنص ولا يفرض تصورًا تقنيًا لطبيعة الإنسان ولا يسطّح الألفاظ المتمايزة.
- issue: اختلاف حرف الجر في العبارة الأولى عن العبارات التالية
  choice: «مِنْ كل قلبك» ثم «بكل...»
  alternative: توحيد الجميع بصيغة «بكل...»
  rationale: يحفظ التمييز الحقيقي بين ἐξ وἐν في النص اليوناني، مع الإشارة إلى البديل العربي الأكثر شيوعًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت حركات جزئية لرفع الالتباس النحوي، وحُفظ اختلاف حروف الجر في الأصل مع حاشية توضيحية.
