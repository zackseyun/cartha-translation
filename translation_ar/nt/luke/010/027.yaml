    issue: غياب الفعل قبل «قريبك»
    rationale: 'في اليونانية يُفهم Ἀγαπήσεις أيضًا مع τὸν πλησίον σου، أما العربية فلا تجعل «وقريبك كنفسك» مفعولًا ثانيًا لـ«تحب» بوضوح بعد عبارة «الرب إلهك». يلزم تكرار الفعل: «وتحب قريبك كنفسك».'
