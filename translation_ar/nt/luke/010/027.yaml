  to: 'فأجاب: «تُحِبُّ الرَّبَّ إلهَكَ مِنْ كُلِّ قلبِكَ[a]، وبكلِّ نفسِكَ، وبكلِّ قوَّتِكَ، وبكلِّ فكرِكَ، وتُحِبُّ قريبَكَ كنفسِكَ».'
  rationale: أُعيد الفعل «تُحِبُّ» قبل «قريبك» ليظهر في العربية أن المحبة المطلوبة تتجه إلى القريب أيضًا، وهو المعنى الذي يعبّر عنه الفعل اليوناني نفسه مع المفعولين. ولم يُغيَّر ما عدا ذلك، بما في ذلك موضع علامة الحاشية ومضمونها.
