source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: ar
  text: 'واشفوا المرضى فيها، وقولوا لهم: «قد اقترب منكم ملكوت الله».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد دنا منكم ملكوت الله».'
    reason: بديل معجمي يحافظ على معنى الاقتراب في ἤγγικεν بصياغة عربية أفصح قليلًا وأقل تداولًا.
lexical_decisions:
- source_word: θεραπεύετε
  choice: اشفوا
  rationale: فعل أمر حاضر يدعو إلى عمل مستمر في سياق إرسالية التلاميذ. ولفظ «اشفوا» هو المقابل العربي الطبيعي المباشر هنا، بخلاف «اعتنوا» الأوسع دلالة.
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: المرضى فيها
  rationale: قد يدل ἀσθενεῖς على الضعفاء أو المرضى، لكن اقترانه بفعل الشفاء يرجّح المرض الجسدي. والضمير في «فيها» يعود إلى المدينة المذكورة في السياق السابق.
- source_word: λέγετε αὐτοῖς
  choice: قولوا لهم
  rationale: يحافظ على بساطة فعل القول وصيغة الأمر المباشرة في اليونانية.
- source_word: Ἤγγικεν
  choice: قد اقترب
  rationale: ينقل صيغة التام اليونانية بوصفها اقترابًا حدث وله أثر حاضر، من غير اختزالها إلى مجرد حالة ساكنة مثل «هو قريب».
- source_word: ἐφ’ ὑμᾶς
  choice: منكم
  rationale: مع فعل الاقتراب، التعبير العربي الطبيعي هو «اقترب منكم»، وهو يعبّر عن وصول الملكوت إلى مجال السامعين وعلاقته بهم دون الإيحاء بالعداء الذي قد تحمله صياغات حرفية أخرى.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير كتابي عربي راسخ ومفهوم، ويحفظ المجال الدلالي الذي يشمل سلطان الله وملكه دون حصره في معنى واحد.
theological_decisions:
- issue: دلالة إعلان اقتراب الملكوت
  choice: «قد اقترب منكم ملكوت الله» تعلن اقتراب مُلك الله وحضوره ذي الأثر الراهن، دون تحديد أنه تحقق كاملًا أو أنه مستقبلي فقط.
  alternative: «ملكوت الله حاضر الآن حضورًا كاملًا» أو «ملكوت الله لن يأتي إلا في المستقبل القريب».
  rationale: صيغة ἤγγικεν تفيد اقترابًا تم وله صلة بالحاضر، لكن الآية وحدها لا تحسم التوتر بين الحضور الراهن والاكتمال المستقبلي، لذلك تُرك التعبير على اتساعه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ملكوت الله» لرسوخه في الخطاب الكتابي العربي، مع إبقاء الجملة مباشرة وسهلة الفهم.
