lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: أيَّ مدينةٍ
  rationale: يفيد الموصول مع ἄν العموم وعدم التعيين. وهذه الصياغة العربية واضحة وتحفظ معنى «أيّ مدينة» دون تقييد.
- source_word: εἰσέρχησθε
  choice: دخلتموها
  rationale: ينقل فعل الدخول إلى المدينة بصياغة عربية طبيعية، ويؤدي معنى المضارع الالتزامي في الشرط العام.
- source_word: δέχωνται ὑμᾶς
  choice: قَبِلكم أهلُها
  rationale: الفعل δέχομαι يحتمل القبول والاستقبال والترحيب. اختير «قَبِلكم» لقربه المعجمي، وأُظهر «أهلها» فاعلًا مفهومًا من سياق المدينة لتجنب إبهام الضمير في العربية.
- source_word: ἐσθίετε
  choice: فكُلوا
  rationale: صيغة أمر مباشرة وطبيعية تنقل القوة الإلزامية لفعل الأمر اليوناني.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: مما يُقدَّم لكم
  rationale: يحفظ معنى الطعام الموضوع أو المقدَّم أمامهم بصياغة عربية معاصرة، مع بقاء المبني للمجهول في الأصل.
