  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: ar
  text: 'فإني أقول لكم: إن أنبياء وملوكًا كثيرين اشتهوا أن يروا ما ترونه، فلم يروه، وأن يسمعوا ما تسمعونه، فلم يسمعوه.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أرادوا» أو «تاقوا» أن يروا ما ترونه.'
    reason: بدائل معجمية للفعل ἠθέλησαν، الذي يحتمل إرادة الشيء أو التوق إليه بحسب السياق.
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: فإني أقول لكم
  rationale: تحفظ «فـ» الصلة التفسيرية بما سبق، وتنقل العبارة اليونانية بوضوح ووقار.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: أنبياء وملوكًا كثيرين
  rationale: نقل مباشر للفئتين التاريخيتين مع إبقاء «كثيرين» وصفًا لهما معًا.
- source_word: ἠθέλησαν
  choice: اشتهوا
  rationale: تفيد رغبة قوية دون أن تضيف إلى النص فكرة لم يصرح بها؛ ويمكن أيضًا ترجمتها «أرادوا» أو «تاقوا».
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: أن يروا ما ترونه
  rationale: صياغة عربية طبيعية تحافظ على فعل الرؤية وعلى المقابلة بين رغبتهم وخبرة المخاطبين.
- source_word: καὶ οὐκ εἶδαν
  choice: فلم يروه
  rationale: يعود ضمير المفعول إلى «ما ترونه»، ويصوغ العربية بوضوح مع الحفاظ على النفي التاريخي.
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: وأن يسمعوا ما تسمعونه، فلم يسمعوه
  rationale: تحافظ العبارة على التوازي المقصود بين الرؤية والسمع.
theological_decisions:
- issue: هوية «الأنبياء والملوك»
  choice: إبقاء الفئتين «أنبياء وملوكًا» بلا توسيع تفسيري
  alternative: أنبياء وحكام؛ أو أنبياء وملوك من القدماء
  rationale: اليونانية تسمي الفئتين مباشرة، وإضافة تحديد زمني أو توسيع معنى «الملوك» تحسم ما تركه النص ضمنيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «اشتهوا» بمعنى رغبوا بشدة، وأُبقي التوازي البلاغي بين «يروا/ترونه/يروه» و«يسمعوا/تسمعونه/يسمعوه».
