  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: ar
  text: 'فقال له: «ماذا كُتب في الشريعة؟ كيف تقرؤها؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كيف تفسرها؟» فاليونانية تقول حرفيًا: «كيف تقرأ؟»، وقد تتضمن معنى الفهم أو التفسير.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: فقال
  rationale: تفيد δέ انتقالًا سرديًا خفيفًا، وتؤديه الفاء العربية بطلاقة من غير تشديد معنى الاستدراك، أما أداة التعريف فاستُعملت ضميرًا في اليونانية وظهر مرجعها في الفعل العربي.
- source_word: εἶπεν πρὸς αὐτόν
  choice: قال له
  rationale: ترجمة مباشرة لفعل القول مع بيان المخاطَب، بلا إضافة معنى الجواب أو الرد غير المصرح به.
- source_word: Ἐν τῷ νόμῳ
  choice: في الشريعة
  rationale: يشير νόμος هنا إلى شريعة إسرائيل المعترف بها بوصفها نصًا مقدسًا؛ و«الشريعة» تعبير عربي واضح ومألوف يحفظ هذا التحديد.
- source_word: τί γέγραπται
  choice: ماذا كُتب
  rationale: صيغة عربية طبيعية للمبني للمجهول، وتحافظ على الاحتكام إلى النص المكتوب، وإن كانت دلالة الحالة المستمرة في التام اليوناني تُفهم من السياق.
- source_word: πῶς
  choice: كيف
  rationale: تحفظ السؤال عن الكيفية مفتوحًا من غير حصره في التفسير وحده.
- source_word: ἀναγινώσκεις
  choice: تقرأ
  rationale: المعنى المعجمي المباشر هو القراءة. ويظل احتمال الفهم أو التفسير قائمًا في السياق، لذلك لم يُحسم في المتن.
theological_decisions:
- issue: مدلول νόμος في سؤال يسوع
  choice: الشريعة بوصفها شريعة إسرائيل المكتوبة والمعترف بها
  alternative: التوراة؛ أو الشريعة بمعنى عام
  rationale: السياق حوار مع عالم بالشريعة، والسؤال يحيل إلى نص مكتوب؛ لذا تحافظ «الشريعة» على المرجع الكتابي من غير تضييق زائد.
- issue: الدلالة التفسيرية لعبارة πῶς ἀναγινώσκεις
  choice: الإبقاء على الصياغة الحرفية «كيف تقرأ؟»
  alternative: كيف تفسرها؟؛ أو كيف تفهمها؟
  rationale: قد يسأل التعبير عن فهم النص أو تفسيره، لكن الفعل نفسه يعني «تقرأ». إبقاء اللفظ المباشر يصون الانفتاح البلاغي والدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «الشريعة» للمفهوم الكتابي المحدد، وحُذفت «ها» بعد «تقرأ» لأن العربية تجيز فهم المفعول من السياق، وللاقتراب من الصياغة اليونانية المفتوحة.
