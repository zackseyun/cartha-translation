  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: الظرف الزمني «وفي اليوم التالي»، وإخراج الدينارين وإعطاؤهما لصاحب النزل، والأمر بالعناية، ووعد سداد أي نفقة زائدة عند العودة. و«أردّه إليك» مفهومة في السياق بوصفها ردّ النفقة الإضافية إلى صاحب النزل.'
