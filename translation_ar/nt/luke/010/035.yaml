  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: ar
  text: 'وفي اليوم التالي، أخرج دينارَين[a] وأعطاهما لصاحب النُّزُل، وقال: «اعتنِ به، ومهما أنفقتَ فوق ذلك أردّه إليك حين أعود».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان الدينار عملة فضية رومانية شائعة، تعادل تقريباً أجرة يوم لعامل.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: في اليوم التالي
  rationale: تعبير زمني طبيعي وواضح يفيد اليوم الذي يلي ما سبق.
- source_word: ἐκβαλών
  choice: أخرج
  rationale: يفيد هنا إخراج المال من حيازته، من غير استحضار المعنى الحرفي القوي للفعل في سياقات أخرى.
- source_word: δύο δηνάρια
  choice: دينارَين
  rationale: يحافظ على اسم العملة التاريخية كما في اليونانية، بدل تحويلها تفسيرياً إلى مقدار من الأجور.
- source_word: πανδοχεῖ
  choice: صاحب النُّزُل
  rationale: يشير إلى الشخص القائم على مكان الإقامة، لا إلى النُّزُل نفسه.
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: اعتنِ به
  rationale: ينقل صيغة الأمر الداعية إلى الرعاية والاهتمام بعبارة عربية طبيعية موجزة.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: مهما أنفقتَ فوق ذلك
  rationale: يحفظ عدم تحديد المقدار ومعنى النفقة الإضافية الذي تفيده السابقة προσ-.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: حين أعود
  rationale: صياغة عربية طبيعية للبناء اليوناني الزمني بالمصدر المعرّف.
- source_word: ἀποδώσω σοι
  choice: أردّه إليك
  rationale: ينقل معنى ردّ ما أنفقه صاحب النُّزُل أو تعويضه عنه، مع إبقاء الإحالة إلى المبلغ السابق.
theological_decisions: []
