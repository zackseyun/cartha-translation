  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: ar
  text: وبالمصادفة، كان كاهنٌ ينزل في ذلك الطريق، فلما رآه مرَّ به من الجانب الآخر[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مرَّ به»؛ غير أن الفعل اليوناني يوحي بأنه مرَّ سائرًا في الجانب المقابل، مما يفيد تجنبه عمدًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: وبالمصادفة
  rationale: ينقل التعبير معنى وقوع الحدث مصادفةً في سياق الرواية، من غير أن يضيف حكمًا فلسفيًا على العناية الإلهية أو العشوائية.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد، والواو تؤدي هذا الدور طبيعيًا في العربية من غير إبراز معنى الاستدراك.
- source_word: ἱερεύς τις
  choice: كاهنٌ
  rationale: التنكير العربي ينقل دلالة τις على شخص غير معيَّن؛ ولا حاجة إلى «كاهن معيّن»، التي قد توحي بأن هويته معروفة.
- source_word: κατέβαινεν
  choice: كان نازلًا
  rationale: يحافظ التركيب على الجانب الاستمراري للفعل الناقص، ويصف حركة الكاهن الجارية في خلفية المشهد.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: في ذلك الطريق
  rationale: صياغة عربية واضحة وقريبة من تركيب الأصل، وتشير إلى الطريق المذكور في السياق.
- source_word: ἰδὼν αὐτὸν
  choice: فلما رآه
  rationale: يبيّن العلاقة الزمنية بين الرؤية والفعل اللاحق، وتفيد الفاء تعاقبهما في السرد من غير إضافة تعليل صريح.
- source_word: ἀντιπαρῆλθεν
  choice: مرَّ من الجهة الأخرى
  rationale: ينقل الفعل المركب معنى المرور مع اتخاذ الجهة المقابلة، لا مجرد المضي بجانب الرجل، ويحافظ على الإيحاء بالتجنب من غير التصريح بدافع غير مذكور.
theological_decisions:
- issue: هل تُفهم «بالمصادفة» نفيًا للعناية الإلهية؟
  choice: الإبقاء على التعبير السردي «بالمصادفة»
  alternative: حذف التعبير أو استبداله بما يوحي بتدبير إلهي صريح
  rationale: الأصل يصف تزامن الحدث من منظور الرواية، ولا يحسم مسألة العناية الإلهية؛ لذلك تُحفظ هذه المساحة اللاهوتية من غير تفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية رصينة. استُخدم «كاهن» بلا «معيّن» لأن التنكير يؤدي معنى τις طبيعيًا، ووُضع دليل الحاشية مباشرة بعد العبارة التي تشرحها.
