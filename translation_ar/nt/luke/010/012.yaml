  register: عربية فصحى حديثة واضحة ومهيبة. وُضع كل من علامتي الحاشية [a] و[b] في المتن، مع الحفاظ على ترتيب منطقي للقراءة العربية وعلى الغموض المقصود في عبارة «ذلك اليوم».
