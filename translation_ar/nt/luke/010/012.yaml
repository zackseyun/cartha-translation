  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: ar
  text: 'أقول لكم[b]: إن الأمر سيكون أيسرَ احتمالًا على سدوم في ذلك اليوم منه على تلك المدينة.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن الأمر سيكون أهون على سدوم في ذلك اليوم منه على تلك المدينة». تفيد صيغة المقارنة اليونانية ἀνεκτότερον معنى «أيسر احتمالًا» أو «أهون».'
    reason: lexical_alternative
  - marker: b
    text: تشير عبارة «ذلك اليوم» إلى يوم الدينونة الإلهية؛ وتصرّح بعض المواضع الموازية بذلك.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية للمضارع الذي يقدّم تقريرًا مؤكدًا وموجّهًا إلى المخاطَبين.
- source_word: Σοδόμοις
  choice: لسدوم
  rationale: يحافظ على اسم الموضع واستعماله المجازي للدلالة على أهله، من غير زيادة تفسيرية في المتن.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: في ذلك اليوم
  rationale: تعبير عربي طبيعي يحفظ الإشارة القضائية الأخروية من غير أن يضيف لفظ «الدينونة» غير الوارد صراحة في الآية.
- source_word: ἀνεκτότερον
  choice: الاحتمال ... أيسر
  rationale: صياغة عربية واضحة للمقارنة، تفيد أن الحال أقل مشقة أو أشد قابلية للاحتمال، مع إثبات البديل اللفظي في الحاشية.
- source_word: ἔσται
  choice: سيكون
  rationale: ينقل زمن المستقبل بوضوح في العربية المعاصرة.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: منه لتلك المدينة
  rationale: يحفظ المقارنة والإشارة إلى المدينة المذكورة في السياق السابق، مع إبقاء لفظ πόλις بمعنى «مدينة».
theological_decisions:
- issue: مدلول «ذلك اليوم»
  choice: إبقاء «في ذلك اليوم» في المتن
  alternative: في يوم الدينونة
  rationale: السياق يدل على يوم الدينونة الإلهية، لكن نص الآية نفسه لا يصرّح بلفظ «الدينونة»، ولذلك حُفظ التعبير كما هو مع توضيحه في الحاشية.
