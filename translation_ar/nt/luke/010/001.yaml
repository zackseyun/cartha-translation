  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: ar
  text: وبعد ذلك، عيَّن الرب أيضًا اثنين وسبعين آخرين[a]، وأرسلهم اثنين اثنين أمامه إلى كل مدينة وموضع كان هو نفسه على وشك أن يأتي إليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «سبعين» بدلًا من «اثنين وسبعين».'
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: وبعد ذلك
  rationale: ينقل الانتقال الزمني بعبارة عربية طبيعية، من غير إثقالها بالترجمة الحرفية للجمع اليوناني.
- source_word: ἀνέδειξεν
  choice: عيَّن
  rationale: يفيد اختيار أشخاص وتكليفهم بمهمة، وهو أوضح هنا من «أظهر» أو «كشف».
- source_word: ὁ κύριος
  choice: الرب
  rationale: المقابل العربي المألوف للقب κύριος، ويشير في السياق إلى يسوع.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: سبعين واثنين آخرين أيضًا
  rationale: يحفظ معنى الإضافة في ἑτέρους وκαί، ويتبع قراءة نص SBLGNT «اثنين وسبعين»، مع إثبات القراءة البديلة في الحاشية.
- source_word: ἀπέστειλεν
  choice: أرسلهم
  rationale: تعبير مباشر يحفظ فعل الإرسال من غير تحميله دلالة اصطلاحية زائدة.
- source_word: ἀνὰ δύο δύο
  choice: اثنين اثنين
  rationale: يحافظ على الصيغة التوزيعية والتكرار في اليونانية، وهو تعبير عربي واضح بمعنى أزواج.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: أمامه
  rationale: يفيد إرسالهم قبله تمهيدًا لوصوله، بصياغة موجزة وطبيعية.
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: إلى كل مدينة وموضع
  rationale: يحفظ الاسمين المتعاطفين في الأصل ولا يختزلهما في لفظ واحد.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: كان هو مزمعًا أن يأتي إليه
  rationale: «مزمعًا» تنقل معنى μέλλω الدال على الفعل المرتقب أو المقصود، و«هو» تحفظ توكيد αὐτός، بينما «يأتي» تراعي منظور الأماكن التي سيتوجه إليها.
theological_decisions:
- issue: الاختلاف النصي في عدد المعيَّنين
  choice: سبعين واثنين
  alternative: سبعين
  rationale: نص SBLGNT المعطى يقرأ ἑβδομήκοντα δύο، لكن قراءة «سبعين» اختلاف نصي قديم ومهم، لذلك أُثبتت في الحاشية دون حسم دلالتها لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «مزمعًا» لما فيها من دقة كتابية مفهومة، مع تجنب التفسير الطائفي أو توسيع معنى الإرسال.
