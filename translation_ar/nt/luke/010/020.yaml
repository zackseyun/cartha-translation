base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: ar
  text: ولكن لا تفرحوا لأن الأرواح تخضع لكم[a]، بل افرحوا لأن أسماءكم قد كُتبت في السماوات[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'السياق يدل على أرواح معادية؛ ويمكن تفسيرها بأنها «أرواح شريرة» أو «شياطين»، لكن اليونانية هنا تقول ببساطة: «الأرواح».'
    reason: lexical_alternative
  - marker: b
    text: 'أو بحسب التعبير العربي التقليدي: «في السماء». واليونانية بصيغة الجمع: «في السماوات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: ولكن
  rationale: تفيد استدراكًا يصحح موضع فرح التلاميذ، وهي واضحة وطبيعية في العربية المعاصرة.
- source_word: ἐν τούτῳ
  choice: بهذا
  rationale: تحافظ على الإشارة المباشرة إلى الأمر السابق بصياغة عربية موجزة.
- source_word: μὴ χαίρετε ... χαίρετε δὲ
  choice: لا تفرحوا ... بل افرحوا
  rationale: تكرار الفعل نفسه يحفظ المقابلة البلاغية في اليونانية.
- source_word: τὰ πνεύματα
  choice: الأرواح
  rationale: يحفظ اللفظ العام في الأصل؛ والسياق يدل على أنها أرواح معادية، من غير استبداله في المتن بتعبير أضيق مثل الشياطين.
- source_word: ὑμῖν ὑποτάσσεται
  choice: تخضع لكم
  rationale: تعبير عربي طبيعي ينقل معنى وقوع الأرواح تحت سلطان المخاطَبين.
- source_word: τὰ ὀνόματα ὑμῶν
  choice: أسماءكم
  rationale: المقابل العربي الطبيعي للتركيب اليوناني المضاف إلى ضمير الجمع.
- source_word: ἐγγέγραπται
  choice: قد كُتبت
  rationale: صيغة الماضي المبني للمجهول مع «قد» تنقل الفعل التام ونتيجته القائمة دون زيادة تفسيرية مثل «سُجلت».
- source_word: ἐν τοῖς οὐρανοῖς
  choice: في السماوات
  rationale: يحفظ صيغة الجمع الصريحة في النص اليوناني، مع بقاء العبارة مفهومة وفصيحة.
theological_decisions:
- issue: ماهية الأرواح
  choice: الأرواح
  alternative: الأرواح الشريرة؛ الشياطين
  rationale: السياق يحددها بوصفها كائنات روحية معادية، لكن اللفظ في هذه الآية هو «الأرواح» فحسب؛ لذلك لا يضيّق المتن دلالته.
- issue: موضع كتابة الأسماء
  choice: في السماوات
  alternative: في السماء
  rationale: يحافظ الاختيار على جمع οὐρανοῖς بدل تسويته إلى المفرد التقليدي، من غير استنتاج تصور تفصيلي عن السماوات.
- issue: دلالة الفعل التام المبني للمجهول
  choice: قد كُتبت
  alternative: مكتوبة؛ كُتبت
  rationale: يحافظ على كون الكتابة حدثًا تم وله أثر قائم، مع إبقاء فاعل الكتابة غير مذكور كما في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «ولكن ... بل» لإبراز الاستدراك والمقابلة، وحُفظ تكرار «تفرحوا/افرحوا» وصيغة جمع «السماوات» وغموض «الأرواح» المقصود في الأصل.
