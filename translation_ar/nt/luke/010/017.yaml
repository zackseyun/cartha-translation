  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: ar
  text: 'ثم رجع الاثنان والسبعون بفرح[a]، قائلين: «يا رب، حتى الشياطين تخضع لنا باسمك!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «السبعون» بدلًا من «الاثنين والسبعين».'
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: رجع
  rationale: فعل ماضٍ يعبّر بوضوح عن عودتهم من المهمة، وهو طبيعي في العربية المعاصرة.
- source_word: δὲ
  choice: ثم
  rationale: تفيد هنا انتقال السرد وتتابع أحداثه، و«ثم» تلائم السياق العربي دون إثقال.
- source_word: οἱ ἑβδομήκοντα δύο
  choice: الاثنان والسبعون
  rationale: يتبع النص المطبوع في SBLGNT الذي يقرأ اثنين وسبعين، مع إثبات القراءة البديلة المهمة في الحاشية.
- source_word: μετὰ χαρᾶς
  choice: بفرح
  rationale: تحافظ على دلالة الاسم في العبارة اليونانية، وهي صياغة عربية موجزة وطبيعية.
- source_word: λέγοντες
  choice: قائلين
  rationale: تحافظ على الصلة الحالية في اسم الفاعل اليوناني وتقدّم الكلام المباشر بأسلوب عربي فصيح.
- source_word: Κύριε
  choice: يا رب
  rationale: نداء موجّه إلى يسوع؛ و«يا رب» المقابل العربي المباشر والمألوف لصيغة النداء κύριε.
- source_word: καὶ
  choice: حتى
  rationale: 'لها هنا قوة تصاعدية تعكس دهشة العائدين: حتى الشياطين نفسها تخضع لهم.'
- source_word: τὰ δαιμόνια
  choice: الشياطين
  rationale: مقابل مباشر للكائنات الروحية المعادية، ويحافظ على أداة التعريف دون استبداله بتفسير أوسع مثل «الأرواح الشريرة».
- source_word: ὑποτάσσεται
  choice: تخضع
  rationale: المضارع يصوّر الخضوع بوصفه واقعًا اختبروه، و«تخضع لنا» تعبير عربي واضح غير متكلّف.
- source_word: ἡμῖν
  choice: لنا
  rationale: ينقل المفعول غير المباشر بعد فعل الخضوع على نحو عربي طبيعي.
- source_word: ἐν τῷ ὀνόματί σου
  choice: باسمك
  rationale: ينقل العبارة الاصطلاحية الدالة على ممارسة السلطان المرتبط باسم يسوع؛ وهو تعبير عربي مألوف يحفظ إيجاز الأصل.
theological_decisions:
- issue: اختلاف نصي في عدد التلاميذ
  choice: الاثنان والسبعون
  alternative: السبعون
  rationale: نص SBLGNT المعطى يقرأ «اثنين وسبعين». ولأن قراءة «السبعين» بديل نصي مهم ومعروف، ذُكرت في الحاشية بدل تجاهلها أو إدخالها في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة قريبة من بنية اليونانية مع مراعاة السلاسة العربية، وحُفظت نبرة الدهشة بعلامة التعجب وبالأداة «حتى».
