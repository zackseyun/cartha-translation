source:
  edition: SBLGNT
  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: ar
  text: 'فأجاب يسوع: «كان رجلٌ نازلًا من أورشليم إلى أريحا، فوقع في أيدي لصوص، فجرّدوه من ثيابه وضربوه، ثم مضوا وتركوه بين حيّ وميت.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ
  choice: فأجاب
  rationale: في سياق الحوار يدل الفعل على أن يسوع أخذ الكلام وردّ على السؤال؛ وصيغة «فأجاب» عربية طبيعية ومباشرة.
- source_word: Ἄνθρωπός τις
  choice: كان رجلٌ
  rationale: تنقل افتتاح القصة بشخص غير معيّن من غير إثقال العبارة بلفظ «رجل معيّن».
- source_word: κατέβαινεν
  choice: نازلًا
  rationale: يحفظ معنى النزول الجغرافي من أورشليم إلى أريحا، ويصوّر الرحلة وهي جارية.
- source_word: λῃσταῖς περιέπεσεν
  choice: وقع في أيدي لصوص
  rationale: تعبير عربي واضح يؤدي معنى الوقوع بين جماعة من اللصوص والتعرض لاعتدائهم.
- source_word: ἐκδύσαντες αὐτὸν
  choice: فجرّدوه من ثيابه
  rationale: يصرّح بالمقصود من نزع ما عليه، ويحافظ على أثر الإذلال والاعتداء.
- source_word: πληγὰς ἐπιθέντες
  choice: وضربوه
  rationale: صياغة عربية طبيعية تفيد أنهم أوقعوا به ضربات وجروحًا، من غير إضافة تفصيل غير مذكور.
- source_word: ἡμιθανῆ
  choice: بين حيّ وميت
  rationale: تعبير عربي مألوف ودقيق وظيفيًا لوصف من تُرك في حالة قريبة من الموت، وهو أنسب من اللفظ الحرفي الثقيل «نصف ميت».
