source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: ar
  text: «مَنْ يسمعكم يسمعني، ومَنْ يرفضكم يرفضني[a]؛ أمّا مَنْ يرفضني فيرفض الذي أرسلني.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يعتدّ بي» أو «ينبذني». ويمكن أن يحمل الفعل اليوناني معنى الرفض أو عدم الاعتداد أو الإقصاء.'
    reason: بدائل معجمية للفعل ἀθετέω مع الحفاظ على اتساع دلالته.
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: مَنْ يسمع
  rationale: تنقل اسم الفاعل المعرَّف المستعمل استعمالًا اسميًّا للدلالة العامة، بصياغة عربية طبيعية وموجزة.
- source_word: ὑμῶν ... ἐμοῦ
  choice: منكم ... مني
  rationale: الفعل اليوناني ἀκούω هنا يتعدّى بالمضاف إليه الدال على الشخص المسموع؛ و«يسمع منكم/مني» تحفظ المرجع الشخصي من غير إضافة «رسالة» أو «صوت» غير مذكورين.
- source_word: ἀθετέω
  choice: يرفض
  rationale: يفيد الفعل رفض شخص أو نبذه وعدم الاعتداد به في هذا السياق التمثيلي. وتُذكر في الحاشية إمكانات معجمية أخرى صونًا لاتساع الدلالة.
- source_word: δὲ
  choice: أمّا
  rationale: تُظهر الانتقال البلاغي إلى العبارة الختامية وتلائم بناء الجملة العربية من غير تضخيم معنى المقابلة.
- source_word: τὸν ἀποστείλαντά με
  choice: الذي أرسلني
  rationale: تنقل اسم الفاعل اليوناني المستعمل اسمًا بعبارة عربية واضحة، وتترك هوية المُرسِل ضمنية كما في الأصل.
theological_decisions:
- issue: اتحاد استقبال الرسل أو رفضهم باستقبال يسوع أو رفضه
  choice: 'الإبقاء على السلسلة الشخصية المباشرة: منكم، مني، يرفضكم، يرفضني'
  alternative: صياغة المعنى على أنه سماع رسالة التلاميذ أو رفضها فقط
  rationale: يستعمل النص ضمائر شخصية لا ألفاظًا مجردة مثل «الرسالة» أو «التعليم»، ولذلك تُحفظ علاقة التمثيل والوكالة من غير تضييقها إلى المضمون وحده.
- issue: هوية «الذي أرسلني»
  choice: ترك المرجع ضمنيًا
  alternative: التصريح بعبارة «الآب الذي أرسلني»
  rationale: السياق يدل على الله الآب، لكن لفظ «الآب» غير وارد في هذه الآية؛ وعدم إضافته يحفظ صياغة الأصل وتوترها اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «مَنْ» العامة لتفادي ثقل الترجمة الحرفية لاسم الفاعل، وحُفظ التوازي والتكرار البلاغي في الأفعال والضمائر.
