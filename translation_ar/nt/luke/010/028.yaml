  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: ar
  text: 'فقال له: «أجبتَ بالصواب. افعل هذا فتحيا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يتناول السياق الأوسع الحياة الأبدية (انظر لوقا 10:25)، لكن اليونانية هنا تقول ببساطة: «تحيا».'
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: فقال له
  rationale: ينقل الفعل البسيط «قال» مع δέ بوصفها أداة ربط خفيفة؛ والفاء طبيعية في تتابع الحوار العربي من غير مبالغة في معنى التعقيب أو التضاد.
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: أجبتَ بالصواب
  rationale: Ὀρθῶς تعني على نحو صحيح أو صائب، وἀπεκρίθης فعل ماضٍ مخاطب مفرد. والعبارة العربية واضحة وطبيعية وتحافظ على تقويم الجواب.
- source_word: τοῦτο ποίει
  choice: افعل هذا
  rationale: اسم الإشارة المفرد يعود إلى الوصية المذكورة قبله، وصيغة الأمر الحاضر قد تحتمل الاستمرار، لكن الأمر العربي الموجز يحفظ هذا الاحتمال في السياق من غير زيادة تفسيرية.
- source_word: καὶ ζήσῃ
  choice: فتحيا
  rationale: ينقل المعنى المباشر «ستحيا» في صياغة عربية فصيحة متصلة بنتيجة الأمر، من غير توسيعه إلى «ترث الحياة الأبدية» رغم حضور ذلك في السياق الأوسع.
theological_decisions:
- issue: مدى معنى «تحيا» في سياق الحياة الأبدية
  choice: فتحيا
  alternative: فترث الحياة الأبدية
  rationale: النص اليوناني هنا يقول ببساطة ζήσῃ، أي «تحيا». أما الحياة الأبدية فهي موضوع السؤال في لوقا 10:25، ولذلك تُذكر في الحاشية ولا تُدرج تفسيرًا في المتن، حفاظًا على شفافية اللفظ والتوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «أجبتَ بالصواب» بدل صياغة أثقل، وحُفظ إيجاز الأمر والنتيجة في الأصل. وُضع مؤشر الحاشية [a] في المتن كما يلزم.
