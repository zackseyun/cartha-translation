  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: ar
  text: 'وفي تلك الساعة نفسها ابتهج بالروح القدس وقال: «أحمدك[a] يا أبتِ، يا ربَّ السماء والأرض، لأنك أخفيت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال الصغار[b]. نعم، يا أبتِ، لأنه هكذا حَسُنَ في عينيك[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أشكرك». يمكن للفعل اليوناني في الصلاة أن يدل على الشكر كما يدل على الحمد.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «للرُّضَّع». ويُحتمل أن تكون الصورة مجازية للدلالة على المتواضعين أو قليلي الشأن، لا على صغار السن وحدهم.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «لأن هكذا كانت مشيئتك الصالحة»، أو: «لأن هذا كان مرضيًّا أمامك».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: وفي تلك الساعة نفسها
  rationale: يحفظ التوكيد الإشاري في العبارة اليونانية بصياغة عربية طبيعية واضحة.
- source_word: ἠγαλλιάσατο
  choice: ابتهج
  rationale: ينقل معنى الفرح الشديد والابتهاج، وهو أفصح وأقوى من مجرد «فرح» من غير تكلف.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: بالروح القدس
  rationale: تركيب التعريف يرجح الإشارة إلى الروح القدس؛ والباء تحفظ احتمال الدلالة على الوسيلة أو المجال من غير إفراط في التحديد.
- source_word: Ἐξομολογοῦμαί σοι
  choice: أحمدك
  rationale: في سياق الصلاة يدل الفعل على الحمد أو الشكر؛ و«أحمدك» تجمع معنى الثناء مع بقاء احتمال الشكر، المثبت في الحاشية.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: يا أبتِ، يا ربَّ السماء والأرض
  rationale: تحفظ النداءين المتعاقبين ومعنى السيادة الإلهية في κύριος.
- source_word: σοφῶν καὶ συνετῶν
  choice: الحكماء والفهماء
  rationale: يقابل اللفظين اليونانيين بزوج عربي مألوف يحفظ التمييز بين الحكمة والفهم.
- source_word: ἀπεκάλυψας
  choice: كشفتها
  rationale: يحفظ المقابلة المباشرة مع «أخفيت» وينقل معنى الإظهار والإعلان بوضوح.
- source_word: νηπίοις
  choice: للأطفال الصغار
  rationale: يحفظ الصورة الحرفية القريبة، مع التنبيه في الحاشية إلى «الرُّضَّع» وإلى الاستعمال المجازي المحتمل.
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: لأن هذا كان مرضيًّا أمامك
  rationale: صياغة قريبة من بنية اليونانية تحفظ معنى الرضا وعبارة «أمامك» من دون تحويلها صراحة إلى مفهوم الإرادة.
theological_decisions:
- issue: مرجع τῷ πνεύματι τῷ ἁγίῳ
  choice: الروح القدس
  alternative: في الروح أو بروحه
  rationale: التعريف الملازم للاسم والصفة يرجح مرجعًا شخصيًا محددًا، مع عدم تحميل العبارة تفصيلًا عقائديًا زائدًا على النص.
- issue: دور الله في الإخفاء والكشف
  choice: لأنك أخفيت... وكشفت
  alternative: لأن هذه الأمور خفيت... وانكشفت
  rationale: حُفظ الإسناد الصريح إلى الآب كما في الفعلين اليونانيين، من غير تخفيف للتوتر اللاهوتي في العبارة.
- issue: دلالة εὐδοκία في الخاتمة
  choice: هذا كان مرضيًّا أمامك
  alternative: هكذا كانت مشيئتك الصالحة أو هكذا حسن في عينيك
  rationale: يحفظ معنى الرضا الإلهي وصيغة ἔμπροσθέν σου، ولا يحسم العبارة في معنى «الإرادة» وحده.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدمت «يا أبتِ» للحفاظ على النداء المباشر الموقر، و«الفهماء» لمقابلة συνετοί بلفظ مفهوم، مع إبقاء الحواشي ملاصقة للعبارات التي تشرحها.
