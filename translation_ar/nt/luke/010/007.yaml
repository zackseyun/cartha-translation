  verdict: approve
  source_fidelity: 'ينقل النص بدقة عناصر اليونانية: الإشارة إلى البيت الذي استقبلهم («ذلك البيت نفسه»)، والأمر المستمر بالبقاء، وحالي الأكل والشرب، وما يقدمه المضيفون، وتعليل قبول الضيافة باستحقاق العامل أجره، ثم النهي عن الانتقال بين البيوت. ولا يضيف سببًا أو تفصيلًا غير وارد في الأصل.'
  naturalness: الصياغة فصيحة حديثة واضحة. «أقيموا» مناسبة لسياق الإقامة في بيت الضيافة، و«آكلين وشاربين» تحافظ طبيعيًا على وظيفة الحال المصاحبة للأمر. «ولا تنتقلوا من بيت إلى بيت» سليمة ومباشرة.
  terminology: «العامل» مقابل ἐργάτης و«أجره» مقابل μισθός مناسبان للسياق الاقتصادي. وحافظ الضمير في «أجره» على الإفراد والتذكير النحويين في اليونانية من غير تحميل العبارة دلالة مذهبية. الحاشية تقدم بديلًا لفظيًا مقبولًا ولا تدّعي وجود قراءة نصية مختلفة.
