source:
  edition: SBLGNT
  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: ar
  text: وأقيموا في ذلك البيت نفسه، آكلين وشاربين مما يقدّمونه، لأن العامل يستحق أجره.[a] ولا تنتقلوا من بيت إلى بيت.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن العامل جدير بالأجر المستحق له».'
    reason: بديل لفظي يحافظ بصورة أصرح على تركيب ἄξιος مع المضاف إليه، بينما يعبّر المتن عنه بالعربية الطبيعية «يستحق أجره».
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ
  choice: في ذلك البيت نفسه
  rationale: تفيد العبارة الإحالة إلى البيت الذي استقبلهم، مع التشديد على لزوم البيت عينه وعدم تبديل مكان الإقامة.
- source_word: μένετε
  choice: أقيموا
  rationale: فعل الأمر المضارع يدل على الاستمرار؛ و«أقيموا» تعبير عربي طبيعي عن البقاء في مكان الضيافة.
- source_word: ἐσθίοντες καὶ πίνοντες
  choice: آكلين وشاربين
  rationale: يحافظ الحالان على تزامن الأكل والشرب مع الإقامة المستمرة.
- source_word: τὰ παρ’ αὐτῶν
  choice: مما يقدّمونه
  rationale: تدل العبارة في السياق على ما يوفّره أهل البيت من طعام وشراب، وهذه الصياغة واضحة من غير إضافة تفاصيل غير موجودة في النص.
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: لأن العامل يستحق أجره
  rationale: تنقل «يستحق» معنى ἄξιος مع المضاف إليه، ويحمل «أجره» المعنى الاقتصادي لـ μισθός ويحافظ على المفرد المذكر في اليونانية.
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: ولا تنتقلوا من بيت إلى بيت
  rationale: تفيد العبارة النهي عن تغيير محل الضيافة والتنقل بين البيوت، وصياغتها العربية مباشرة وطبيعية.
theological_decisions:
- issue: التذكير والإفراد في τοῦ μισθοῦ αὐτοῦ
  choice: أجره
  alternative: الأجر المستحق له
  rationale: الضمير اليوناني مفرد مذكر عائد إلى «العامل». حُفظ ذلك في العربية من غير تحويله إلى جمع أو صيغة محايدة، مع بقاء القول ذا دلالة عامة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أقيموا» للإقامة المستمرة، و«البيت نفسه» لإبراز عدم الانتقال، مع تجنّب التراكيب الحرفية الثقيلة.
