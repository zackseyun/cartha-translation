source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: ar
  text: 'ثم التفت إلى التلاميذ وقال لهم على انفراد[a]: «طوبى للعيون التي ترى ما ترونه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في خلوة».'
    reason: بديل معجمي للتعبير κατ’ ἰδίαν، يحفظ معنى الكلام بعيدًا عن الآخرين.
lexical_decisions:
- source_word: στραφεὶς
  choice: التفت
  rationale: ينقل اسم الفاعل الأوريستي بوصفه فعلًا تمهيديًا سابقًا للكلام، وهو تعبير عربي طبيعي يحفظ حركة يسوع نحو التلاميذ.
- source_word: κατ’ ἰδίαν
  choice: على انفراد
  rationale: تعبير عربي واضح يفيد أن الكلام وُجِّه إلى التلاميذ بمعزل عن الآخرين، من غير تحديد زائد لطبيعة المكان.
- source_word: μαθητάς
  choice: التلاميذ
  rationale: المقابل العربي المألوف في العهد الجديد، ويحفظ معنى التعلّم والارتباط بالمعلّم.
- source_word: Μακάριοι
  choice: طوبى
  rationale: صيغة عربية راسخة في أقوال التطويب، تنقل إعلان البركة والحظوة الإلهية ولا تختزل المعنى في شعور نفسي بالسعادة.
- source_word: ὀφθαλμοὶ
  choice: العيون
  rationale: يحفظ الصورة المجازية الصريحة في اليونانية بدل تحويلها تفسيريًا إلى أصحاب العيون.
- source_word: οἱ βλέποντες
  choice: التي ترى
  rationale: صلة وصفية طبيعية في العربية تحفظ وظيفة اسم الفاعل المعرّف في وصف العيون.
- source_word: ἃ βλέπετε
  choice: ما ترونه
  rationale: ترجمة مباشرة وطبيعية للضمير الموصول مع فعل الرؤية في المضارع، وتحفظ إيجاز القول.
theological_decisions:
- issue: دلالة صيغة التطويب
  choice: إعلان البركة للعيون التي ترى ما يراه التلاميذ
  alternative: مجرد وصف للسعادة أو السرور النفسي
  rationale: لفظة Μακάριοι في هذا السياق تحمل قوة إعلان التطويب والحظوة، ولذلك اختيرت «طوبى» من غير إضافة تفسيرية تحدد مضمون ما رأوه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «طوبى» لصياغة التطويب الكتابية المألوفة، مع إبقاء صورة «العيون» كما في الأصل، ووُضع البديل المعجمي لعبارة الانفراد في الحاشية.
