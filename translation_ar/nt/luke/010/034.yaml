  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: ar
  text: فتقدَّم إليه وضمَّد جراحه[a]، وصبَّ عليها زيتًا وخمرًا. ثم أركبه على دابته الخاصة[b]، وأتى به إلى نُزُل، واعتنى به.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ربط جراحه».'
    reason: lexical_alternative
  - marker: b
    text: تشير الكلمة اليونانية إلى حيوان يُستعمل للحمل أو الركوب.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: فتقدَّم إليه
  rationale: ينقل حركة الاقتراب من الجريح بعبارة عربية طبيعية، مع إبقاء الصلة الزمنية بالفعل الرئيس.
- source_word: κατέδησεν
  choice: ضمَّد
  rationale: فعل عربي واضح يدل على ربط الجراح ومعالجتها، وهو المقابل الطبيعي في هذا السياق.
- source_word: τραύματα
  choice: جراحه
  rationale: مقابل مباشر يلائم الإصابات الناتجة عن الاعتداء المذكور في السياق.
- source_word: ἐπιχέων
  choice: وصبَّ عليها
  rationale: يعبّر عن سكب المادتين على الجراح، ويجعل مرجع الضمير واضحًا في العربية.
- source_word: ἔλαιον
  choice: زيتًا
  rationale: يحافظ على اللفظ العام في اليونانية دون زيادة «زيت الزيتون» في المتن.
- source_word: οἶνον
  choice: خمرًا
  rationale: مقابل عربي مباشر للاسم اليوناني، من غير إضافة تفسير طبي غير مصرّح به.
- source_word: ἐπιβιβάσας
  choice: أركبه
  rationale: صياغة عربية موجزة وطبيعية تفيد أنه وضع الجريح على الدابة ليُحمل عليها.
- source_word: τὸ ἴδιον κτῆνος
  choice: دابته
  rationale: «دابة» تدل طبيعيًا على حيوان الركوب أو الحمل، وضمير الملكية ينقل كونها له؛ ولا حاجة في العربية إلى زيادة «الخاصة» إلا للتوكيد الشديد.
- source_word: πανδοχεῖον
  choice: نُزُل
  rationale: اسم واضح لمكان يؤوي المسافرين، ويقابل معنى اللفظة اليونانية بإيجاز.
- source_word: ἐπεμελήθη
  choice: اعتنى به
  rationale: ينقل معنى الرعاية الشخصية والاهتمام بصورة طبيعية وكريمة.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما، لا وفق موضعيهما الظاهرين في طبقة الاستشارة الإنجليزية، لأن الحاشية [a] تخص فعل تضميد الجراح والحاشية [b] تخص الدابة.
