  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: ar
  text: 'وقال لهم: «الحصاد كثير، لكن العمال قليلون. فاطلبوا إذن من رب الحصاد أن يرسل[a] عمالًا إلى حصاده».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يرسل بقوة»؛ فقد يحمل الفعل اليوناني معنى أقوى من مجرد الإرسال.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: وكان يقول
  rationale: صيغة الماضي الناقص تدل على قول مستمر أو متكرر في السياق، وصياغة «كان يقول» طبيعية وتحفظ هذا الجانب.
- source_word: δὲ
  choice: —
  rationale: أداة ربط خفيفة تُفهم من تتابع الكلام في العربية، وحذف مقابل لفظي لها هنا أكثر سلاسة ولا يغيّر العلاقة السياقية.
- source_word: θερισμός
  choice: الحصاد
  rationale: المقابل العربي المألوف الذي يحفظ الصورة الزراعية واستعمالها المجازي.
- source_word: πολύς
  choice: كثير
  rationale: ينقل معنى الوفرة بوضوح، ويقيم المقابلة المباشرة مع «قليلون».
- source_word: ἐργάται
  choice: العمال
  rationale: لفظ عربي حديث وواضح يشمل القائمين بعمل الحصاد من غير تقييد زائد.
- source_word: ὀλίγοι
  choice: قليلون
  rationale: مقابل مباشر يحفظ التضاد مع كثرة الحصاد.
- source_word: δεήθητε
  choice: فاطلبوا
  rationale: يدل الفعل على التماس جاد موجَّه إلى الله؛ و«اطلبوا من رب الحصاد» صياغة عربية واضحة تحفظ قوة الأمر من غير إضافة تفسيرية.
- source_word: οὖν
  choice: إذن
  rationale: تبيّن النتيجة المنطقية المترتبة على كثرة الحصاد وقلة العمال.
- source_word: κύριος
  choice: رب
  rationale: «رب الحصاد» عنوان عربي طبيعي يحفظ معنى السيادة والملكية الكامن في κύριος ضمن هذه الصورة.
- source_word: ὅπως
  choice: أن
  rationale: تدخل على مضمون الطلب وغايته في تركيب عربي موجز وطبيعي.
- source_word: ἐκβάλῃ
  choice: يرسل
  rationale: «يرسل» ملائم للسياق في المتن، مع التنبيه في الحاشية إلى أن الفعل اليوناني قد يحمل قوة أشد، مثل الدفع إلى الخروج.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: إلى حصاده
  rationale: ترجمة قريبة تحفظ اتجاه الحركة وضمير الملكية من غير إضافة «حقل»، وهي غير مذكورة صراحة.
theological_decisions:
- issue: مرجع لقب «رب الحصاد» ودلالته
  choice: الإبقاء على اللقب المجازي «رب الحصاد» من غير تعيين صريح لمرجعه أو شرح دلالته اللاهوتية.
  alternative: تفسيره صراحة بأنه الله مالك الحصاد ومدبّر الرسالة، أو ربطه مباشرة بسلطان يسوع الإلهي.
  rationale: النص يثبت سلطان رب الحصاد وملكيته وإرساله للعمال، لكنه لا يفصّل هنا هوية المرجع أو الدلالة المسيحانية؛ لذا تُحفظ مساحة النص وتوتره اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صورة الحصاد وتكرارها، واستُعمل «العمال» بدل ألفاظ أقدم مثل «الفعلة». وُضع مؤشر الحاشية عند «يرسل» لأنه يخص الفعل اليوناني ἐκβάλῃ.
