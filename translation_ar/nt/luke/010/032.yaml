  rationale: يبقي النص على التسمية التاريخية المحددة والموازية للكاهن، من غير إدخال شرح وظيفي أو نسبي في صلب الآية.
- issue: مدى دلالة ἀντιπαρῆλθεν على التعمد
  choice: اجتاز من الجانب المقابل
  alternative: مرَّ به؛ تجاوزه متعمدًا
  rationale: تنقل الصياغة صورة الانتقال إلى الجانب المقابل، لكنها لا تصرّح بالدافع النفسي تصريحًا يتجاوز دلالة الفعل والسياق.
