lexical_decisions:
- source_word: ὁμοίως
  choice: وكذلك
  rationale: تفيد مماثلة فعل اللاوي لفعل الكاهن المذكور قبله، وهذه صياغة عربية طبيعية موجزة.
- source_word: δὲ καὶ
  choice: أيضًا
  rationale: تؤدي القوة الإضافية، أما الربط الخطابي الخفيف في δέ فتؤديه الواو وانسياب الجملة.
- source_word: Λευίτης
  choice: لاويٌّ
  rationale: يحافظ على التعيين التاريخي والديني للشخص بوصفه من اللاويين، من غير استبداله بوصف تفسيري أوسع.
- source_word: κατὰ τὸν τόπον
  choice: إلى ذلك الموضع
  rationale: تدل العبارة في السياق على وصوله إلى الموضع الذي كان فيه الرجل، والإشارة بـ«ذلك» تعيد القارئ إلى المكان المعروف من السياق.
- source_word: ἐλθὼν
  choice: جاء
  rationale: اسم الفاعل الماضي يسبق الفعل الرئيس زمنيًا، وتحويله إلى فعل تام يجعل التسلسل طبيعيًا في العربية.
- source_word: ἰδὼν
  choice: فلمّا رآه
  rationale: تنقل العلاقة الزمنية السابقة للفعل الرئيس، والضمير يعود إلى الرجل الجريح المفهوم من السياق.
- source_word: ἀντιπαρῆλθεν
  choice: اجتاز من الجانب المقابل
  rationale: يحفظ دلالة الفعل المركب على المرور بمحاذاة الشخص مع اتخاذ الجانب المقابل، بما يوحي بالتجنب من غير زيادة تفسيرية صريحة.
