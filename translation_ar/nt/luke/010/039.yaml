  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: ar
  text: وكان لهذه أخت تُدعى مريم، جلست هي أيضًا عند قدمي يسوع[a]، وكانت تستمع إلى كلامه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «الرب» بدلًا من «يسوع».'
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: لهذه
  rationale: اسم الإشارة المؤنث يعود إلى مرثا في الآية السابقة. وصيغة «لهذه أخت» واضحة وطبيعية وتحافظ على الإشارة الموجودة في اليونانية.
- source_word: ἀδελφὴ
  choice: أخت
  rationale: نقل مباشر ودقيق للفظ القرابة.
- source_word: καλουμένη Μαριάμ
  choice: تُدعى مريم
  rationale: صياغة عربية فصيحة وطبيعية للمشاركة التي تعرّف باسم الشخص.
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: جلست ... عند قدمي
  rationale: تنقل اتخاذ وضع الجلوس عند قدمي يسوع، وتحافظ على هيئة التلميذ الذي يصغي إلى معلّمه من غير تفسير زائد.
- source_word: τοῦ Ἰησοῦ
  choice: يسوع
  rationale: النص اليوناني المعطى في SBLGNT يقرأ Ἰησοῦ، ولذلك يُنقل الاسم صراحة في المتن.
- source_word: ἤκουεν
  choice: كانت تستمع
  rationale: الماضي الناقص يدل على فعل مستمر، و«كانت تستمع» يؤدي هذا الجانب بوضوح في العربية.
- source_word: τὸν λόγον αὐτοῦ
  choice: كلامه
  rationale: «كلامه» طبيعي في سياق الإصغاء إلى حديث يسوع، ويحافظ على سعة معنى λόγος دون تضييقه إلى «تعليمه» أو «رسالته».
theological_decisions:
- issue: القراءة النصية للاسم أو اللقب في عبارة الجلوس عند القدمين
  choice: يسوع
  alternative: الرب
  rationale: المصدر اليوناني المحدد يقرأ «يسوع»، لذلك اعتُمد في المتن. وتُحفظ قراءة «الرب» في الحاشية لأنها اختلاف نصي ذو دلالة في طريقة الإشارة إلى الشخص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «عند قدمي» لأنها طبيعية وتحافظ على الصورة المكانية والتلميذية في الأصل، مع إبقاء تتابع الأفعال جاريًا بسلاسة.
