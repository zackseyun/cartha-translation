  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: ar
  text: 'فقال: «هو الذي عامله برحمة». فقال له يسوع: «اذهب أنت أيضًا وافعل هكذا».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: هو الذي عامله برحمة
  rationale: ينقل التعبير اليوناني الحرفي «صنع الرحمة معه» إلى صياغة عربية طبيعية، مع الحفاظ على معنى إظهار الرحمة عمليًا تجاه الرجل.
- source_word: Πορεύου
  choice: اذهب
  rationale: أمر مباشر مفرد يطابق الفعل اليوناني.
- source_word: καὶ σὺ
  choice: أنت أيضًا
  rationale: يحافظ على ضمير المخاطب المؤكد σὺ وعلى معنى καὶ الإضافي، فلا يختزل العبارة إلى «افعل هكذا» فقط.
- source_word: ποίει ὁμοίως
  choice: وافعل هكذا
  rationale: ينقل صيغة الأمر الحاضرة بوصفها توجيهًا إلى ممارسة مماثلة، بصياغة عربية واضحة ومألوفة.
theological_decisions:
- issue: هوية القريب في جواب معلّم الشريعة
  choice: 'الإبقاء على الجواب في صورة وصف للفعل: «هو الذي عامله برحمة»'
  alternative: تسمية السامري صراحة
  rationale: النص اليوناني لا يكرر تسمية السامري، بل يعرّفه بعمل الرحمة؛ لذلك لا تُضاف هوية صريحة تحجب تركيز الجواب الأخلاقي.
- issue: توكيد مسؤولية المخاطب في وصية يسوع
  choice: «أنت أيضًا»
  alternative: «اذهب وافعل هكذا» دون ضمير مؤكد
  rationale: يحفظ التوكيد الموجود في καὶ σὺ ويبرز توجيه يسوع الشخصي إلى السامع دون إضافة دلالة مذهبية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدمت «عامله برحمة» بدل الحرفية الثقيلة «صنع الرحمة معه»، مع إبقاء الأمر المباشر والتوكيد الشخصي في «أنت أيضًا».
