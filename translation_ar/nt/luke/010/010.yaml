  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: ar
  text: 'وأمّا أيّة مدينة تدخلونها ولا يقبلونكم، فاخرجوا إلى ساحاتها[a] وقولوا:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «شوارعها العريضة»؛ تشير الكلمة اليونانية إلى الشوارع الواسعة أو الساحات العامة المفتوحة.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: وأمّا أيّة مدينة
  rationale: التركيب الموصول مع ἄν يفيد حالة عامة غير معيّنة؛ وصياغة «أيّة مدينة» تنقل هذا المعنى بوضوح وطبيعية.
- source_word: εἰσέλθητε
  choice: تدخلونها
  rationale: فعل ماضٍ في صيغة الاحتمال ضمن تركيب عام شرطي المعنى؛ والمضارع العربي مناسب للسياق التعليمي العام.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: ولا يقبلونكم
  rationale: يحفظ «يقبلونكم» المعنى الواسع للفعل، أي استقبال الرسل والترحيب بهم، من غير تضييقه على مجرد الضيافة.
- source_word: ἐξελθόντες
  choice: فاخرجوا
  rationale: اسم الفاعل الظرفي يسبق فعل الأمر ويدل على تتابع الفعلين؛ لذا نُقل بأمر مع فاء الترتيب.
- source_word: τὰς πλατείας αὐτῆς
  choice: إلى ساحاتها
  rationale: تشير πλατεῖαι إلى المواضع العامة المفتوحة، من شوارع عريضة أو ساحات؛ و«ساحاتها» طبيعية في العربية وتبرز علنية القول، مع حفظ البديل في الحاشية.
- source_word: εἴπατε
  choice: وقولوا
  rationale: ترجمة مباشرة وطبيعية لفعل الأمر، وتمهّد للقول المنقول في الآية التالية.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «وأمّا» لإبراز المقابلة مع توجيه الآية السابقة، وحُفظت نهاية الآية بنقطتين لأنها تمهّد للاقتباس في الآية التالية.
