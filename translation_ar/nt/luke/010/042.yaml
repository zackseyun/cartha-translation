base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: ar
  text: لكن الحاجة إلى أشياء قليلة، أو إلى شيء واحد[a]. لأن مريم اختارت النصيب الصالح[b]، الذي لن يُؤخذ منها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يلزم إلا شيء واحد». ويمكن أيضًا فهم اليونانية، في سياق إعداد الطعام، بمعنى: «لا حاجة إلا إلى أطباق قليلة، أو إلى طبق واحد».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «الحصة الصالحة». وقد يلمّح «النصيب» إلى حصة من الطعام وإلى نصيب مجازي في ما له قيمة حقيقية معًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων
  choice: أشياء قليلة
  rationale: جاءت الكلمة في صيغة جمع المضاف إليه مع χρεία للدلالة اصطلاحيًا على الحاجة إلى عدد قليل؛ وإضافة «أشياء» تجعل العبارة عربية طبيعية من غير حصر المقصود في الأطباق.
- source_word: χρεία
  choice: الحاجة إلى
  rationale: ينقل تركيب ἐστιν χρεία بوضوح ودقة بوصفه تعبيرًا عن الاحتياج أو الضرورة.
- source_word: ἢ ἑνός
  choice: أو إلى شيء واحد
  rationale: يحافظ على المقابلة الموجزة بين القليل والواحد، مع إضمار «شيء» اللازم لوضوح العربية، من غير الجزم أهو طبق واحد أم أمر واحد ضروري.
- source_word: Μαριὰμ
  choice: مريم
  rationale: الصيغة العربية المألوفة للاسم الكتابي.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: النصيب الصالح
  rationale: «النصيب» ينقل معنى الحصة أو القسم الذي يقع للمرء، و«الصالح» يقابل ἀγαθή بلا إدخال معنى المفاضلة غير الصريح في الأصل.
- source_word: ἐξελέξατο
  choice: اختارت
  rationale: فعل ماضٍ عربي طبيعي ينقل الاختيار الشخصي المتعمد الذي تعبّر عنه صيغة الوسط اليونانية.
- source_word: ἥτις
  choice: الذي
  rationale: ضمير موصول يعود بوضوح إلى «النصيب» ويقدّم صفته المميزة.
- source_word: οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: لن يُنتزع منها
  rationale: ينقل المستقبل المبني للمجهول ومعنى الإزالة أو الأخذ، ويبرز ثبات ما اختارته مريم.
theological_decisions:
- issue: تفسير «أشياء قليلة، أو شيء واحد» في صلته بخدمة مرثا واختيار مريم
  choice: الإبقاء على العبارة عامة بوصفها كلامًا عما تدعو إليه الحاجة، دون تحديد المقصود بأنه أطباق قليلة أو طبق واحد أو أمر جوهري واحد.
  alternative: «إنما الحاجة إلى شيء واحد» أو «تكفي أطباق قليلة، بل طبق واحد».
  rationale: تحتمل الصياغة اليونانية إشارة عملية إلى إعداد الطعام كما تحتمل معنى أوسع يتعلق بالأمر الضروري حقًا؛ لذلك يحافظ النص على هذا التوتر ولا يحسمه تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة الأسلوب. حُفظ الإيجاز والغموض الحقيقيان في صدر الآية، واستُعمل «النصيب الصالح» بدل صيغة تفاضلية مثل «النصيب الأفضل» لأن الأصل يصفه بالصالح ولا يستعمل صيغة المقارنة.
