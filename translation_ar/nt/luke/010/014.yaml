  text: πλὴν Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν τῇ κρίσει ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: ar
  text: لكن سيكون الأمر أهون على صور وصيدا في الدينونة منه عليكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيكون احتمالُ الدينونة أيسرَ على صور وصيدا منه عليكم».'
    reason: بديل معجمي وتركيبي ممكن لـ ἀνεκτότερον ولصيغة المقارنة.
lexical_decisions:
- source_word: πλὴν
  choice: ولكن
  rationale: تفيد انتقالًا استدراكيًا قويًا متصلًا بالتوبيخ السابق، و«لكن» صياغة عربية واضحة وطبيعية.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: على صور وصيدا
  rationale: الاسمان في حالة المجرور اليونانية متعلقان بصيغة المقارنة، و«على» تلائم العربية مع التعبير «أيسر احتمالًا» وتحدد من يقع عليه الحكم.
- source_word: ἀνεκτότερον
  choice: احتمالُ ... أيسرَ
  rationale: ينقل المعنى المقارن، أي أن اجتياز الحكم أو تحمله سيكون أقل مشقة، بصياغة عربية طبيعية مع إبقاء البديل «أهون» في الحاشية.
- source_word: ἔσται
  choice: سيكون
  rationale: ينقل صيغة المستقبل بوضوح ومن دون أسلوب عتيق.
- source_word: ἐν τῇ κρίσει
  choice: الدينونة
  rationale: «الدينونة» تعكس κρίσις في هذا السياق القضائي الأخروي، والتعريف يحافظ على الإشارة إلى الدينونة المعينة من غير إضافة تفسيرية.
- source_word: ἢ ὑμῖν
  choice: منه عليكم
  rationale: يتمم المقارنة بوضوح؛ والضمير «منه» يعود إلى احتمال الدينونة، و«عليكم» يطابق بناء المقارنة العربي المختار.
theological_decisions:
- issue: طبيعة κρίσις في السياق
  choice: الدينونة
  alternative: الحُكم
  rationale: السياق يقارن مصير المدن غير التائبة بصور وصيدا، ويرجح الإشارة إلى الدينونة الإلهية الأخيرة. تحافظ «الدينونة» على هذا المعنى من غير أن تضيف لفظ «الأخيرة» غير الوارد صراحة في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير تركيب اسمي طبيعي لتجنب العبارة الحرفية الثقيلة «سيكون أكثر احتمالًا»، مع المحافظة على المقارنة وعلى دلالة الدينونة.
