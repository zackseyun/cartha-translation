  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: ar
  text: اذهبوا؛ ها أنا أرسلكم مثل حملان في وسط ذئاب.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάγετε
  choice: اذهبوا
  rationale: فعل أمر للجمع، و«اذهبوا» صياغة عربية طبيعية موجزة تحفظ قوة التكليف.
- source_word: ἰδοὺ
  choice: ها أنا
  rationale: أداة تنبيه تلفت النظر إلى القول التالي، وتركيب «ها أنا» فصيح وطبيعي مع ضمير المتكلم والفعل اللاحق.
- source_word: ἀποστέλλω ὑμᾶς
  choice: أرسلكم
  rationale: يحفظ المضارع المتكلم والمفعول به الجمع، ويؤدي معنى الإرسال للمهمة بلا إضافة تفسيرية.
- source_word: ὡς
  choice: مثل
  rationale: تدل على التشبيه، و«مثل» واضحة في العربية المعاصرة ولا تحول الصورة إلى تقرير هوية.
- source_word: ἄρνας
  choice: حملان
  rationale: اللفظ اليوناني يعني الحملان تحديدًا، لا الغنم بوجه عام، وبذلك تبقى صورة الضعف وقلة الحيلة.
- source_word: ἐν μέσῳ λύκων
  choice: في وسط ذئاب
  rationale: ترجمة قريبة من البنية اليونانية، وتحفظ صورة الإحاطة والخطر بلغة عربية واضحة.
theological_decisions:
- issue: الصورة الحيوانية المجازية في إرسال التلاميذ
  choice: مثل حملان في وسط ذئاب
  alternative: مثل خراف بين ذئاب
  rationale: النص اليوناني يستعمل ἄρνας، أي «حملان»، لا لفظًا عامًا بمعنى «خراف» أو «غنم»؛ لذلك حُفظت دلالة الضعف الأشد ولم تُسوَّ العبارة بمواضع مشابهة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «ها أنا» بدل «انظروا» لأن ἰδοὺ هنا يمهد مباشرة لقول المتكلم، وحُفظ الجمع في «اذهبوا» و«أرسلكم». لا توجد حاجة إلى حاشية لأن الفروق المهمة ممثلة صراحة في المتن.
