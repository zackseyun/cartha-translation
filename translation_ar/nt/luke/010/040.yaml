source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: ar
  text: 'أما مرثا فكانت كثرةُ الخدمة تشتّت انتباهها. فتقدّمت وقالت: «يا رب، أما يهمّك أن أختي تركتني أخدم وحدي؟[a] فقل لها إذن أن تساعدني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أفلا تبالي بأن أختي تركتني وحدي أقوم بالخدمة؟»'
    reason: بديل معجمي وصياغي للعبارتين οὐ μέλει σοι وμόνην με κατέλειπεν διακονεῖν.
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: كانت ... تشتّت انتباهها
  rationale: ينقل الفعل الناقص حالة مستمرة من الانجذاب بعيدًا أو تشتّت الانتباه، ويحافظ على المقابلة السياقية مع إصغاء مريم.
- source_word: περὶ πολλὴν διακονίαν
  choice: كثرةُ الخدمة
  rationale: تشير العبارة هنا إلى أعمال الضيافة والخدمة العملية، من غير حصرها في إعداد الطعام أو تحميلها معنى خدمة دينية رسمية.
- source_word: ἐπιστᾶσα
  choice: فتقدّمت
  rationale: يفيد اسم الفاعل اقتراب مرثا قبل أن تتكلم، و«تقدّمت» تعبير عربي واضح وموجز.
- source_word: Κύριε
  choice: يا رب
  rationale: يحفظ اللقب المعتاد في خطاب يسوع، ويؤدي معنى الاحترام مع إبقاء الدلالة الأوسع للقب في إنجيل لوقا.
- source_word: οὐ μέλει σοι
  choice: أما يهمّك
  rationale: ينقل صيغة السؤال التي تتوقع جوابًا بالإيجاب ومعنى كون الأمر موضع اهتمام، من غير تشديدها إلى اتهام أقسى مما يقتضيه النص.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: تركتني أخدم وحدي
  rationale: يحفظ معنى الوحدة والفعل المكمّل «أخدم» بصياغة عربية طبيعية، من غير المبالغة باستعمال لفظ مثل «هجرتني».
- source_word: εἰπὲ οὖν αὐτῇ
  choice: فقل لها إذن
  rationale: ينقل فعل الأمر المباشر ويحفظ القوة الاستنتاجية للأداة οὖν.
- source_word: συναντιλάβηται
  choice: أن تساعدني
  rationale: الفعل يعني أن تنضم إلى شخص في حمل العبء أو مساعدته؛ و«تساعدني» أوضح مقابل عربي، بينما يبيّن السياق أن المساعدة مشاركة في العمل.
theological_decisions:
- issue: ترجمة κύριος في خطاب مرثا ليسوع
  choice: يا رب
  alternative: يا معلّم
  rationale: «يا رب» هو المقابل المعتاد للقب κύριος ويحفظ الاحترام والدلالة اللوقاوية الأوسع، ولا يقتضي السياق تضييقه إلى معنى «المعلّم» وحده.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وكريمة النبرة. استُعملت «كثرة الخدمة تشتّت انتباهها» لإظهار الاستمرار والتشتّت في الأصل، مع تجنّب تفسير الخدمة بأنها إعدادات منزلية بعينها أو خدمة كنسية رسمية.
