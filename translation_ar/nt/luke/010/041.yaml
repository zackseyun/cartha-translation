  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: ar
  text: 'فأجابها الرب: «مرثا، مرثا، أنتِ تقلقين وتضطربين بشأن أمور كثيرة،»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: فأجابها
  rationale: يُعبَّر عن تركيب اسم الفاعل مع فعل القول بصيغة فعل عربي واحد طبيعية، وتفيد الفاء الانتقال الاستجابي مع شيء من المقابلة في السياق.
- source_word: ὁ κύριος
  choice: الرب
  rationale: يحفظ اللقب السردي والمسيحاني المعتاد ليسوع في لوقا، ولا يختزله في معنى «السيد» أو «المعلّم».
- source_word: Μάρθα Μάρθα
  choice: مرثا، مرثا
  rationale: يحفظ تكرار النداء بما فيه من توكيد وعاطفة.
- source_word: μεριμνᾷς
  choice: تقلقين
  rationale: ينقل معنى الانشغال الداخلي والهم بصياغة عربية واضحة وشائعة.
- source_word: θορυβάζῃ
  choice: تضطربين
  rationale: ينقل معنى الاضطراب والانزعاج الداخلي، مع إبقاء تمييزه عن القلق الذي يدل عليه الفعل السابق.
- source_word: περὶ πολλά
  choice: بشأن أمور كثيرة
  rationale: صياغة عربية طبيعية تحافظ على عموم العبارة اليونانية من غير تحديد زائد.
theological_decisions:
- issue: ترجمة κύριος لقبًا ليسوع
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ القوة الاحترامية والمسيحانية للقب في سرد لوقا، بينما قد تقصر «السيد» المعنى على المخاطبة الاجتماعية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة، مع مخاطبة المؤنث صراحة، والحفاظ على تكرار الاسم وعلى التمييز الدلالي بين القلق والاضطراب.
