lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: وبينما كانوا سائرين
  rationale: تنقل صيغة ἐν مع المصدر المعرّف معنى التزامن، وتحافظ صيغة الجمع على كون الجماعة كلها سائرة. وأُفادت δέ بخفة ضمن استئناف السرد دون إضافة ظرف زمان غير موجود في الأصل.
- source_word: αὐτὸς
  choice: هو
  rationale: أُظهر الضمير المنفصل للمحافظة على توكيد الأصل والتمييز بينه وبين جماعة السائرين، من غير إحلال اسم «يسوع» تفسيرًا محل الضمير.
- source_word: εἰσῆλθεν
  choice: دخل
  rationale: مقابل عربي مباشر وطبيعي لفعل الدخول في سياق الحركة السردية.
- source_word: εἰς κώμην τινά
  choice: قريةً ما
  rationale: «قرية» تقابل κώμη، و«ما» تحفظ التنكير المخصوص الذي تؤديه τινά من غير الإيحاء بأن اسم القرية معلوم.
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: امرأة اسمها مرثا
  rationale: صياغة عربية طبيعية تُدخل الشخصية الجديدة، ويغني ذكر اسمها عن تكرار أداة تفيد معنى «امرأة ما» على نحو ثقيل.
- source_word: ὑπεδέξατο
  choice: استقبلته
  rationale: يفيد الفعل اليوناني قبول الشخص والترحيب به على سبيل الضيافة. يحافظ «استقبلته» على إيجاز الأصل، وتوضح الحاشية دلالة الضيافة من غير إضافة «في بيتها» إلى المتن.
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير المفعول يعود بوضوح إلى المفرد المذكور في «دخل هو».
