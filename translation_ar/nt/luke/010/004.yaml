  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: ar
  text: لا تحملوا كيسَ نقود، ولا حقيبةَ سفر[b]، ولا نعالًا، ولا تسلِّموا على أحد في الطريق[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود على الأرجح ليس منع المجاملة العادية منعًا مطلقًا، بل التشديد على إلحاح المهمة وعدم إضاعة الوقت في التحيات الاجتماعية المطوّلة التي كانت مألوفة في تلك الثقافة.
    reason: cultural_note
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «حقيبة» أو «مزود».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζετε
  choice: تحملوا
  rationale: الفعل βαστάζω يعني «يحمل»، وهو هنا أنسب تعبير عربي مباشر في سياق تعليمات السفر.
- source_word: βαλλάντιον
  choice: كيس نقود
  rationale: يدل اللفظ على كيس يُحفظ فيه المال؛ و«كيس نقود» واضح ودقيق للقارئ المعاصر.
- source_word: πήραν
  choice: حقيبة سفر
  rationale: يشير إلى حقيبة تُحمل فيها مؤونة الطريق أو حاجات المسافر. و«حقيبة سفر» تنقل وظيفتها بوضوح، مع ذكر البديل الأقرب في الحاشية.
- source_word: ὑποδήματα
  choice: نعالًا
  rationale: اللفظ عام لما يُلبس في القدم، وغالبًا ما يشير في البيئة المتوسطية القديمة إلى النعال؛ لذا يحافظ الاختيار على السياق التاريخي.
- source_word: μηδένα
  choice: على أحد
  rationale: 'هو مفعول فعل التحية المنفي، وتقتضي العربية مع «سلَّم» استعمال حرف الجر «على»: «لا تسلِّموا على أحد».'
- source_word: κατὰ τὴν ὁδόν
  choice: في الطريق
  rationale: تعبير عربي طبيعي ينقل معنى وقوع الفعل أثناء السير، من غير توسع تفسيري.
- source_word: ἀσπάσησθε
  choice: تسلِّموا على
  rationale: الفعل ἀσπάζομαι يعني يحيّي أو يسلّم على. و«تسلِّموا على» صياغة عربية فصيحة ومألوفة، ولا تحصر المعنى في العناق.
theological_decisions:
- issue: مدى النهي عن تحية الناس في أثناء السفر
  choice: 'الإبقاء على صيغة النهي المباشر: «لا تسلِّموا على أحد في الطريق»'
  alternative: «لا تتوقفوا لتبادل التحيات في الطريق»
  rationale: النص اليوناني يصوغ نهيًا مباشرًا، ولذلك لا تُخفَّف قوته في المتن بإضافة تفسير. أما احتمال أن المقصود تجنب التحيات الاجتماعية المطوّلة بسبب إلحاح المهمة، فيُذكر في الحاشية بوصفه خلفية ثقافية محتملة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة، مع الحفاظ على تتابع النواهي المباشرة في اليونانية. وُضعت علامة الحاشية [a] بعد عبارة التحية، وعلامة [b] بعد «حقيبة سفر»، لتطابق كل حاشية العبارة التي تشرحها.
