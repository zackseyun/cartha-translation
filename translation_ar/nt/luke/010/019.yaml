source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: ar
  text: ها قد أعطيتكم السلطان لتدوسوا الحيّات والعقارب، والسلطان على كل قوة العدو، ولن يضرّكم شيء قط.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يأتي النفي في اليونانية بصيغة شديدة التوكيد، ويمكن أيضًا ترجمة العبارة: «ولن يؤذيكم شيء بأي حال». وقد تحمل صورة الحيّات والعقارب، في هذا السياق، إشارة أيضًا إلى قوى روحية معادية.'
    reason: lexical_and_interpretive_note
lexical_decisions:
- source_word: ἰδού
  choice: ها أنا
  rationale: تعبير عربي طبيعي ذو نبرة مهيبة يسترعي الانتباه، ومع وجود فعل المتكلم بعده ينسجم «ها أنا» مع السياق أكثر من «انظروا».
- source_word: δέδωκα
  choice: قد أعطيتكم
  rationale: يحفظ دلالة التام اليوناني على عطاء تمّ وتبقى نتيجته قائمة، وتؤكد «قد» تحقق الفعل.
- source_word: ἐξουσίαν
  choice: السلطان
  rationale: يدل على سلطة أو صلاحية ممنوحة، ويحافظ على تمييزه من δύναμις، أي «قوة»، لاحقًا في الآية.
- source_word: τοῦ πατεῖν
  choice: أن تدوسوا
  rationale: ينقل مضمون السلطان الممنوح وصورة الوطء بعبارة عربية واضحة ومباشرة.
- source_word: ἐπάνω ὄφεων καὶ σκορπίων
  choice: الحيّات والعقارب
  rationale: يحفظ الصورة الحرفية دون أن يحسم هل لها أيضًا دلالة رمزية في السياق.
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: أن تتسلّطوا على كل قوة
  rationale: يُظهر امتداد السلطان الممنوح إلى قوة العدو، ويجعل العلاقة النحوية طبيعية في العربية من غير الخلط بين السلطان والقوة.
- source_word: δύναμιν
  choice: قوة
  rationale: يحفظ معنى القدرة أو البأس، مع إبقاء التمييز المعجمي عن ἐξουσία «السلطان».
- source_word: τοῦ ἐχθροῦ
  choice: العدو
  rationale: ينقل المفرد المعرّف كما هو من غير التصريح بأنه الشيطان، مع أن السياق قد يشير إليه.
- source_word: οὐδὲν ... οὐ μὴ ἀδικήσῃ
  choice: لن يضرّكم شيء قط
  rationale: «لن» مع «قط» تنقلان النفي اليوناني المشدد بصياغة عربية طبيعية، و«يضرّ» يلائم معنى الأذى في هذا السياق.
theological_decisions:
- issue: مرجع «العدو»
  choice: 'إبقاء اللفظ عامًا: «العدو»'
  alternative: «الشيطان» أو «إبليس»
  rationale: يشير السياق القريب إلى مقاومة شيطانية، لكن النص اليوناني لا يسمّي العدو صراحة؛ لذلك تُصان سعة اللفظ الأصلية.
- issue: دلالة الحيّات والعقارب
  choice: إبقاء الصورة الحرفية في المتن
  alternative: تفسيرها في المتن على أنها قوى روحية معادية
  rationale: الألفاظ تشير مباشرة إلى الحيّات والعقارب، بينما قد يضفي السياق عليها بعدًا رمزيًا؛ فلا ينبغي للترجمة أن تحسم هذا التوتر التفسيري.
- issue: مدى الوعد بعدم الضرر
  choice: نقل النفي المشدد كما ورد من غير إضافة قيد تفسيري
  alternative: تقييد الوعد صراحة بالضرر الروحي أو بالمهمة المرسلية
  rationale: النص نفسه مطلق الصياغة ومؤكد النفي، وأي تقييد صريح في المتن يتجاوز ما تقوله الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. اختير «السلطان» مقابل ἐξουσία و«قوة» مقابل δύναμις للمحافظة على التمييز بين السلطة الممنوحة وبأس العدو. وُضعت علامة الحاشية [a] في نهاية الآية لتشمل توكيد النفي واحتمال البعد الرمزي للصورة.
