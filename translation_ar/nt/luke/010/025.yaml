  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: ar
  text: 'وإذا برجل من علماء الشريعة[a] قد قام ليختبره، قائلًا: «يا معلّم، ماذا أعمل لأرث الحياة الأبدية؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رجل من خبراء الشريعة». واللفظ اليوناني يشير هنا إلى متخصّص في شريعة موسى.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: وإذا بـ
  rationale: صياغة عربية فصيحة تؤدي وظيفة لفت الانتباه وإبراز ظهور الحدث في السرد، من غير استعمال تعبير متكلف.
- source_word: νομικός τις
  choice: رجل من علماء الشريعة
  rationale: يدل اللفظ في هذا السياق على المتخصص في شريعة موسى، لا على المحامي بالمعنى المدني الحديث. وإضافة «رجل» تنقل دلالة τις وتأتي طبيعية في العربية.
- source_word: ἀνέστη
  choice: قد قام
  rationale: ينقل فعل النهوض في المشهد السردي بوضوح، وتفيد «قد» تحقق الحدث.
- source_word: ἐκπειράζων αὐτὸν
  choice: ليختبره
  rationale: ينقل قصد وضع يسوع موضع الاختبار، من غير أن يوحي بالضرورة بإغراء مباشر نحو الخطيئة كما قد يفعل لفظ «يجرّبه».
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على البنية الحالية للفعل اليوناني مع أسلوب عربي فصيح وطبيعي.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: المقابل العربي المباشر والواضح للقب المخاطبة في السياق التعليمي.
- source_word: τί ποιήσας
  choice: ماذا أعمل
  rationale: صياغة عربية طبيعية تنقل سؤال الرجل عما ينبغي أن يفعله، وتحافظ على تأطيره العملي للسؤال من غير إضافة تفسير عقائدي.
- source_word: ζωὴν αἰώνιον
  choice: الحياة الأبدية
  rationale: التعبير العربي المألوف والدقيق الذي ينقل معنى الحياة الدائمة ذات البعد الأخروي.
- source_word: κληρονομήσω
  choice: لأرث
  rationale: يحافظ على استعارة الميراث في الأصل بدل تسطيحها إلى «أنال» أو «أحصل على».
theological_decisions:
- issue: دلالة νομικός في السياق اليهودي
  choice: رجل من علماء الشريعة
  alternative: ناموسي؛ خبير في الشريعة
  rationale: المقصود عالم متخصّص في شريعة موسى. تتجنب الصياغة إيحاء «المحامي» الحديث، من غير إدخال توصيف مذهبي زائد.
- issue: قوة العبارة τί ποιήσας ... κληρονομήσω
  choice: ماذا أعمل لأرث الحياة الأبدية؟
  alternative: ماذا ينبغي أن أفعل لكي أرث الحياة الأبدية؟
  rationale: تحافظ الصياغة على سؤال الرجل المتمحور حول الفعل وعلى استعارة الميراث، ولا تحسم التوتر اللاهوتي الكامن بين الفعل والميراث.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «وإذا بـ» للحيوية السردية، و«علماء الشريعة» لتجنب الالتباس الذي قد ينشأ من ترجمة اللفظ بما يعني المحامي الحديث.
