source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: ar
  text: كلُّ شيء قد سُلِّم إليَّ من أبي[a]، ولا أحد يعرف مَن هو الابن إلا الآب، ولا أحد يعرف مَن هو الآب إلا الابن ومَن يختار الابن أن يكشف له الآب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جميع الأشياء قد سُلِّمت إليَّ من أبي».'
    reason: بديل لفظي يحفظ صيغة الجمع المحايد في الأصل بدل التعبير الجمعي «كل شيء».
  - marker: b
    text: 'أو: «ومَن يشاء الابن أن يكشف له الآب».'
    reason: «يشاء» بديل أقرب في صورته إلى التعبير عن الإرادة، مع بقاء «يختار» أوضح في العربية المعاصرة من حيث القرار المقصود.
lexical_decisions:
- source_word: πάντα
  choice: كلُّ شيء
  rationale: يحفظ شمول الجمع المحايد في اليونانية بصياغة عربية طبيعية، من غير تقييد لنطاقه.
- source_word: παρεδόθη
  choice: قد سُلِّم إليَّ
  rationale: صيغة المبني للمجهول تنقل المعنى الأساسي للفعل، وتفيد فعلًا تمّ وتظل نتيجته قائمة في السياق، من غير إدخال معنى الأمانة أو الوكالة غير المصرّح به.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: من أبي
  rationale: تؤدي «من» في العربية معنى الجهة الفاعلة في هذا التركيب المبني للمجهول بصورة طبيعية، مع إبقاء العلاقة الشخصية التي يدل عليها «أبي».
- source_word: γινώσκει
  choice: يعرف
  rationale: ينقل المعنى المباشر للفعل من غير إضافة «تمامًا» أو «حقًّا»، مع أن السياق نفسه يُظهر فرادة هذه المعرفة المتبادلة.
- source_word: τίς ἐστιν ὁ υἱὸς / τίς ἐστιν ὁ πατήρ
  choice: مَن هو الابن / مَن هو الآب
  rationale: يحفظ السؤال عن الهوية بصياغة عربية واضحة وشخصية، من غير تفسير زائد.
- source_word: ὁ υἱός / ὁ πατήρ
  choice: الابن / الآب
  rationale: استُعمل اللقبان المسيحيان العربيان المألوفان لأن السياق يشير إلى الابن والآب على نحو تعريفي وعلاقاتي.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: ومَن يختار الابن أن يكشف له الآب
  rationale: تحفظ الصياغة المتلقي غير المحدد وإرادة الابن الفاعلة، وتُظهر أن «الآب» هو المفعول المفهوم من السياق، من غير توسيع لاهوتي.
- source_word: βούληται
  choice: يختار
  rationale: تعبير عربي معاصر واضح عن الإرادة المقصودة؛ وأُثبت البديل الأقرب إلى الصياغة التقليدية، «يشاء»، في الحاشية.
- source_word: ἀποκαλύψαι
  choice: أن يكشف
  rationale: يحفظ معنى الإعلان والكشف الإلهي من غير تحويله إلى شرح تفسيري مثل «يعرّف به».
theological_decisions:
- issue: المعرفة المتبادلة الحصرية بين الآب والابن
  choice: 'الإبقاء على العبارة المباشرة: لا يعرف أحد الابن إلا الآب، ولا الآب إلا الابن.'
  alternative: إضافة ألفاظ تفسيرية مثل «يعرف تمام المعرفة» أو «يعرف حقًّا».
  rationale: يحمل التركيب نفسه ثقله اللاهوتي ويؤكد فرادة المعرفة المتبادلة، فلا حاجة إلى تقويته بكلمات غير موجودة صراحة في الأصل.
- issue: نطاق إرادة الابن في الكشف
  choice: ترجمة βούληται بما يحفظ اختيار الابن وفاعليته في الكشف.
  alternative: تخفيف العبارة إلى مجرد رغبة، أو إعادة صياغتها بما يقلل من فاعلية الابن.
  rationale: يجعل النص اليوناني الابن صاحب الإرادة في كشف الآب؛ لذلك حُفظ هذا المعنى من غير بناء منظومة عقائدية تتجاوز العبارة.
- issue: المفعول المفهوم مع ἀποκαλύψαι
  choice: 'التصريح بأن المكشوف هو الآب: «أن يكشف له الآب».'
  alternative: استعمال ضميرين متتابعين مثل «أن يكشفه له»، بما قد يسبب غموضًا عربيًا مصطنعًا.
  rationale: المفعول محذوف في اليونانية لكنه مفهوم مباشرة من الجملة السابقة، والتصريح بالآب ضروري لوضوح العربية ولا يحسم غموضًا لاهوتيًا حقيقيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع الحفاظ على التوازي بين «مَن هو الابن» و«مَن هو الآب». استُعمل «الآب» بوصفه اللقب المسيحي العربي المستقر، وتُجنبت الإضافات التي تشدد معنى المعرفة أو تفسر إرادة الابن مذهبيًا.
