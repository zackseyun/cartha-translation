  to: كلُّ شيء قد سُلِّم إليَّ من أبي[a]، ولا أحد يعرف مَن هو الابن إلا الآب، ولا أحد يعرف مَن هو الآب إلا الابن ومَن يختار الابن أن يكشف له الآب[b].
