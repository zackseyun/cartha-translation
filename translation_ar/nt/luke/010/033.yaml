  to: لكنَّ سامريًّا، بينما كان مسافرًا، أتى إلى حيث كان الرجل، فلمّا رآه تحنَّن عليه[a].
  rationale: 'التعديل أسلوبي محدود: رُبطت حالة السفر بالفعل الرئيس بعبارة «بينما كان مسافرًا» لتحسين الجريان العربي وإظهار وظيفة الحال في النص اليوناني، واستُعمل «أتى» بوصفه المقابل السردي الطبيعي لـἦλθεν. ولم يُضف التعديل أي تفسير عن هوية الرجل أو دافع السامري أو مغزى المثل.'
