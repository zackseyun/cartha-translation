  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: ar
  text: لكنَّ سامريًّا، بينما كان مسافرًا، أتى إلى حيث كان الرجل، فلمّا رآه تحنَّن عليه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أشفق عليه».'
    reason: بديل معجمي يعبّر عن المعنى نفسه بعبارة عربية أبسط، وإن كان أقل إبرازًا لقوة التأثر الوجداني.
lexical_decisions:
- source_word: Σαμαρίτης
  choice: سامريًّا
  rationale: المقابل العربي المألوف والدقيق للهوية العِرقية الدينية، ويحفظ قوة المفارقة في سياق المثل.
- source_word: δέ
  choice: لكنَّ
  rationale: تفيد المقابلة مع تصرّف الكاهن واللاوي في العددين السابقين.
- source_word: τις
  choice: سامريًّا بصيغة النكرة
  rationale: تؤدي تنكير الشخص طبيعيًّا في العربية من غير إضافة «أحد» أو «معيّن» التي لا يقتضيها السياق.
- source_word: ὁδεύων
  choice: كان مسافرًا
  rationale: تنقل الحدث الخلفي المستمر الذي يعبّر عنه اسم الفاعل اليوناني بصياغة عربية طبيعية.
- source_word: ἦλθεν
  choice: وصل
  rationale: ينقل مجيئه إلى موضع الرجل في السياق السردي بوضوح.
- source_word: κατ’ αὐτόν
  choice: إلى حيث كان الرجل
  rationale: يوضح أن الحركة انتهت عند موضع المصاب، مع ذكر «الرجل» لرفع التباس الضمير في العربية.
- source_word: ἰδών
  choice: ولمّا رآه
  rationale: يحفظ العلاقة الزمنية بين الرؤية والاستجابة الوجدانية بأسلوب عربي سلس.
- source_word: ἐσπλαγχνίσθη
  choice: تحنَّن عليه
  rationale: ينقل معنى الشفقة العميقة والحركة الوجدانية القوية دون اللجوء إلى حرفية غير مألوفة مثل «تحرّكت أحشاؤه».
theological_decisions:
- issue: نقل استجابة السامري الوجدانية من غير إضافة تفسير أخلاقي أو عقائدي
  choice: تحنَّن عليه
  alternative: أشفق عليه
  rationale: يحفظ التعبير المختار قوة العاطفة التي يدل عليها الفعل اليوناني، ولا يضيف إلى النص مفاهيم عن الرحمة أو النعمة أو محبة القريب لم يصرّح بها هذا العدد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة الأسلوب. وُضع رمز الحاشية بعد العبارة التي تشرحها الحاشية، تجنبًا لالتباسه بالهوية السامرية.
