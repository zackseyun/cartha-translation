  terminology: «سامريًّا» مقابل راسخ ودقيق لـΣαμαρίτης، و«تحنَّن عليه» ينقل ἐσπλαγχνίσθη نقلًا طبيعيًا قويًا من غير تحميل تفسيري. والبديل في الحاشية «أشفق عليه» مناسب، مع أنه أخفّ وقعًا.
