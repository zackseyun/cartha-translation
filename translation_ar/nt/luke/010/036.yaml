  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: ar
  text: فأيُّ هؤلاء الثلاثة يبدو لك أنه صار قريبًا للذي وقع بين اللصوص؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فأيُّ هؤلاء الثلاثة تظن أنه كان قريبًا للذي وقع بين اللصوص؟» واليونانية، بحرفية أكبر، تقول: «يبدو لك أنه صار قريبًا»، فتبرز فعل صيرورته قريبًا للآخر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς τούτων τῶν τριῶν
  choice: فأيُّ هؤلاء الثلاثة
  rationale: تفيد العبارة الاختيار من مجموعة محددة، وتحافظ «أيّ» على هذا المعنى بوضوح، من غير إضافة «رجال» غير المذكورة صراحة.
- source_word: πλησίον
  choice: قريبًا
  rationale: تأتي هنا بمعنى «قريب» من حيث العلاقة والمسؤولية الأخلاقية، لا بمعنى القرب المكاني.
- source_word: δοκεῖ σοι
  choice: يبدو لك
  rationale: يحافظ هذا على دلالة الفعل «يبدو» والضمير «لك»، بدل اختزالهما في صيغة أكثر تفسيرًا مثل «تظن».
- source_word: γεγονέναι
  choice: أنه صار
  rationale: ينقل معنى الصيرورة في صيغة الفعل التامة، ويبرز أن السؤال عمّن صار قريبًا بالفعل، لا عمّن كان قريبًا في وضع ثابت.
- source_word: τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς
  choice: للذي وقع بين أيدي اللصوص
  rationale: «للذي» تقابل اسم الفاعل المعرّف دون إضافة جنس غير مصرح به، و«وقع بين أيدي اللصوص» تعبير عربي طبيعي يؤدي معنى الوقوع في قبضتهم.
theological_decisions:
- issue: المحور الأخلاقي للسؤال في مثل السامري
  choice: ترجمة γίνομαι بـ«صار» للمحافظة على انتقال السؤال من تحديد القريب إلى أن يصير المرء قريبًا للآخر بفعله.
  alternative: «كان قريبًا للذي وقع بين أيدي اللصوص»
  rationale: الصياغة اليونانية تدل على الصيرورة لا مجرد الحالة الثابتة؛ وإبقاء «صار» يحفظ قوة إعادة صياغة السؤال من غير إدخال تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. اختيرت «صار قريبًا» للمحافظة على الصياغة اليونانية وعلى التوتر المقصود بين هوية القريب وفعل التقرّب، مع وضع علامة الحاشية في المتن.
