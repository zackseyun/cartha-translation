source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: ar
  text: فإن يكن هناك ابنُ سلامٍ[a]، فسيستقرّ سلامكم عليه؛ وإلّا فسيرجع إليكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: شخصٌ من أهل السلام؛ وقد يُفهم في السياق أنه متقبّل لرسالة السلام.'
    reason: بديل معجمي يوضح التعبير السامي «ابنُ سلامٍ» من دون استبداله في المتن أو حصر مدلوله.
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: ابنٌ للسلام
  rationale: يحافظ على التعبير السامي بصيغة المذكر المفرد، ويدل في السياق على شخص يتصف بقبول السلام أو يتقبّل رسالة السلام. أُثبت البديل التفسيري الأوضح في الحاشية.
- source_word: ἐπαναπαήσεται
  choice: استقرَّ ... عليه
  rationale: ينقل صورة حلول السلام واستقراره على الشخص بصياغة عربية طبيعية، ويؤدي المستقبل اليوناني هنا بوصفه نتيجة متوقعة للشرط.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: سلامكم
  rationale: يحافظ على الإضافة المباشرة، ويترك العبارة محتملة لإفادة تحية السلام وبركته دون حصرها في تفسير واحد.
- source_word: εἰ δὲ μήγε
  choice: وإلّا
  rationale: 'صياغة عربية موجزة وطبيعية تؤدي الشرط المنفي المؤكد: إن لم يوجد مثل هذا الشخص.'
- source_word: ἀνακάμψει
  choice: رجع
  rationale: ينقل معنى العودة أو الارتداد، مع بقاء السلام هو الفاعل المفهوم من الجملة السابقة.
- source_word: ἐφ’ ὑμᾶς
  choice: إليكم
  rationale: حرف الجر العربي الملائم مع فعل «رجع»، مع حفظ معنى عودة السلام إلى المرسَلين.
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: وإن كان هناك
  rationale: يحفظ الواو والشرط والدلالة المكانية في ترتيب عربي واضح.
theological_decisions:
- issue: هل يُستبدل التعبير المذكر υἱὸς εἰρήνης بعبارة محايدة وأكثر تفسيرًا؟
  choice: إبقاء «ابنٌ للسلام» في المتن
  alternative: شخصٌ من أهل السلام / شخصٌ يتقبّل السلام
  rationale: النص اليوناني يستعمل مفردًا مذكرًا في تعبير ذي خلفية سامية. إبقاء الصورة في المتن يصون نسيج المصدر ولا يحسم مدلولها في مجرد المسالمة أو الاستحقاق، بينما توضّح الحاشية المعنى الوظيفي المحتمل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «استقرَّ» لصورة حلول السلام، و«وإلّا» لسلاسة الشرط، مع إبقاء التعبير السامي «ابنٌ للسلام» وإيضاحه في الحاشية.
