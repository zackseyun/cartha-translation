  to: «ويلٌ لكِ يا كورزين! وويلٌ لكِ يا بيت صيدا! لأنه لو جرت في صور وصيدا أعمالُ القدرة التي جرت فيكما، لتابتا منذ زمن بعيد وهما جالستان في المسوح والرماد.»[a]
  rationale: صُحّح الظرف المكاني من «بينكما» إلى «فيكما» ليطابق ἐν ὑμῖν، واستُخدم «أعمال القدرة» لصياغة عربية أكثر طبيعية مع حفظ دلالة δυνάμεις. وأُضيفت الواو والضمير في «وهما جالستان» لإبانة الحال مع الإبقاء على تشخيص المدينتين وصورة الجلوس الواردة في النص اليوناني.
