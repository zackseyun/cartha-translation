source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: ar
  text: «ويلٌ لكِ يا كورزين! وويلٌ لكِ يا بيت صيدا! لأنه لو جرت في صور وصيدا أعمالُ القدرة التي جرت فيكما، لتابتا منذ زمن بعيد وهما جالستان في المسوح والرماد.»[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسوح» ثياب خشنة كانت تُلبس علامةً على الحزن والتوبة؛ والعبارة اليونانية تصوّر صور وصيدا جالستين في المسوح والرماد.
    reason: cultural_and_grammatical_clarification
lexical_decisions:
- source_word: Οὐαί σοι
  choice: ويلٌ لكِ
  rationale: يحفظ «ويل» قوة الإعلان النبوي الذي يجمع الوعيد والتحسر، وجاء ضمير الخطاب مؤنثًا لأن المخاطَب مدينتان.
- source_word: Χοραζίν / Βηθσαϊδά
  choice: كورزين / بيت صيدا
  rationale: نقل الاسمين وفق الصيغ العربية الكتابية الشائعة، مع فصل «بيت صيدا» بما يلائم أصل الاسم واستعماله العربي.
- source_word: δυνάμεις
  choice: أعمالُ القوة
  rationale: يحفظ معنى الأعمال التي تتجلى فيها القدرة، من غير اختزال اللفظ في المصطلح التفسيري «معجزات».
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: جرت ... التي جرت
  rationale: يعكس فعل γίνομαι بوصفه دالًا على الوقوع والحدوث، ويحافظ على تكراره في اليونانية بصياغة عربية طبيعية.
- source_word: ἐν ὑμῖν
  choice: بينكما
  rationale: الضمير اليوناني جمع لأنه يخاطب سكان المدينتين، أما العربية فتعامل اسمي المدينتين بوصفهما مثنى في هذا السياق؛ و«بين» توضح أن الأعمال وقعت في وسطهما.
- source_word: πάλαι
  choice: منذ زمن بعيد
  rationale: ينقل الدلالة الزمنية بوضوح داخل الجملة الشرطية المخالفة للواقع.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: في المسوح والرماد
  rationale: يحافظ على الصورة النبوية التقليدية للحزن والتوبة؛ وصيغة الجمع «المسوح» مألوفة عربيًا في هذا التعبير.
- source_word: καθήμενοι
  choice: جالستين
  rationale: يحفظ صورة الجلوس الحسية، مع المطابقة العربية لصور وصيدا بوصفهما مدينتين.
- source_word: μετενόησαν
  choice: لتابتا
  rationale: «تاب» هو المقابل العربي الطبيعي في السياق اللوقاوي، ويعبّر عن التحول الأخلاقي والروحي، مع صيغة جواب الشرط المخالف للواقع.
theological_decisions:
- issue: طبيعة δυνάμεις في خدمة يسوع
  choice: أعمالُ القوة
  alternative: المعجزات
  rationale: اللفظ اليوناني يبرز القدرة المتجلية في الأعمال، ولذلك حُفظ هذا البعد من دون تحويله إلى مصطلح تفسيري أضيق.
- issue: مرجع صيغ التثنية في جواب الشرط
  choice: لتابتا ... جالستين
  alternative: لتاب أهلُهما ... جالسين
  rationale: يحافظ الاختيار على تشخيص المدينتين الموجود في الخطاب اليوناني، ولا يضيف «الأهل» مع أنه المعنى المفهوم ضمنًا.
- issue: صورة التوبة
  choice: لتابتا ... جالستين في المسوح والرماد
  alternative: لأظهرتا التوبة بالمسوح والرماد
  rationale: أُبقيت صورة الجلوس الملموسة بدل تجريدها إلى وصف عام، حفاظًا على التوتر والصبغة النبوية في النص.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة نبوية مهيبة. حُفظ تشخيص المدن وتأنيثها وتثنيتها في العربية، كما حُفظ تكرار فعل الوقوع والصورة الحسية للجلوس في المسوح والرماد.
