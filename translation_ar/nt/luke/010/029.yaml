  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: ar
  text: 'أمّا هو، فإذ أراد أن يبرّر نفسه، قال ليسوع: «ومَن هو قريبي؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ومَن يُعَدّ قريبي؟»'
    reason: بديل دلالي يوضح أن السؤال قد يتعلق بمن يدخل ضمن نطاق «القريب».
lexical_decisions:
- source_word: θέλων
  choice: إذ أراد
  rationale: ينقل اسم الفاعل الدال على دافع الرجل وقصده بصياغة عربية طبيعية، من غير أن يحوّله إلى فعل مستقل عن الجملة.
- source_word: δικαιῶσαι ἑαυτόν
  choice: أن يبرّر نفسه
  rationale: يحافظ على الصلة المعجمية بالفعل «برّر»، ويدل في السياق على محاولته إظهار أنه على حق، من غير فرض المعنى الاصطلاحي البولسي الكامل للتبرير.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: قال ليسوع
  rationale: صياغة سردية عربية واضحة ومباشرة للاسم وصيغة القول.
- source_word: Καὶ
  choice: وَ
  rationale: تُحفظ الواو التي تستهل السؤال بوصفه متابعة للحوار، وهي طبيعية في الكلام العربي.
- source_word: τίς ἐστίν μου πλησίον
  choice: مَن هو قريبي؟
  rationale: «القريب» هو المقابل الكتابي والسياقي الطبيعي لـ πλησίον في ضوء وصية التوراة، وتحفظ الصياغة مباشرة السؤال وغموض حدوده.
theological_decisions:
- issue: دلالة δικαιῶσαι ἑαυτόν
  choice: محاولة الرجل أن يبرّر نفسه، أي أن يُظهر أنه على حق
  alternative: أن يزكّي نفسه أخلاقيًا أو يدافع عن نفسه أمام الحاضرين
  rationale: السياق حوار شرعي وأخلاقي، والعبارة تفيد طلب إثبات صواب موقفه. تُبقي الترجمة لفظ «يبرّر» بما فيه من توتر ودلالة سردية، دون تحويله إلى تقرير عقائدي تقني.
- issue: مدلول «القريب» في السؤال
  choice: 'الإبقاء على السؤال المباشر: «مَن هو قريبي؟»'
  alternative: «مَن يُعَدّ قريبي؟»
  rationale: النص اليوناني يسأل مباشرة عن هوية القريب، بينما البديل يصرّح ضمنًا بمسألة التصنيف والحدود. لذلك بقي البديل في الحاشية ولم يُدمج في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أمّا هو» لإبراز المقابلة التي تؤديها δέ، و«إذ أراد» لربط الدافع بالفعل ربطًا طبيعيًا. وُضعت علامة الحاشية بعد السؤال الذي تفسّره.
