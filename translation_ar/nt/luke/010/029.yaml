  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «أمّا هو» تؤدي δέ في استئنافٍ مقابِل، و«إذ أراد» تحافظ على اسم الفاعل θέλων بوصفه دافعًا للفعل الرئيس، و«أن يبرّر نفسه» تنقل δικαιῶσαι ἑαυτόν دون تحميلها معنى عقائديًا تقنيًا. كما أن «قال ليسوع» و«ومن هو قريبي؟» يقابلان الصياغة اليونانية المباشرة بدقة.'
  naturalness: الصياغة فصيحة واضحة وملائمة للسرد الحواري الكتابي في العربية المعاصرة. تركيب «أمّا هو، فإذ أراد...» أفصح قليلًا من الأسلوب اليومي، لكنه طبيعي ومناسب للسجل الوقور ولا يوقع في غموض.
  terminology: «يبرّر نفسه» يحفظ الارتباط المعجمي بالفعل δικαιόω، ويُفهم هنا سياقيًا بوصفه إظهارَ المرء أنه على حق. و«قريبي» هو المقابل الكتابي المألوف لـ πλησίον. اسم «يسوع» متسق مع الاستعمال العربي الشائع. الحاشية «ومن يُعَدّ قريبي؟» بديل دلالي مشروع، ولا تفرض تفسيرًا على المتن.
