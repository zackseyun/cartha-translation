source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: ar
  text: '«حتى غبار مدينتكم العالق بأقدامنا نمسحه ضدكم.[a] ولكن اعلموا هذا: لقد اقترب ملكوت الله.[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «حتى الغبار الذي علق بأقدامنا من مدينتكم نمسحه ضدكم». والعبارة اليونانية المتعلقة بالأقدام اصطلاحية، وتصف الغبار بأنه عالق بأقدام الرسل. والفعل يعني «نمسح» على وجه أخص، لا «ننفض». وتدل «ضدكم» على أن هذا الفعل الرمزي موجَّه إلى المخاطبين بوصفه إنذارًا.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «قد دنا ملكوت الله». وتدل صيغة الفعل اليوناني على أن الاقتراب قد حدث وما زالت له دلالة قائمة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: غبار
  rationale: يدل الاسم على الغبار تحديدًا، لا على التراب بوجه عام، ويحفظ دلالة الحركة الرمزية في سياق الإرسالية.
- source_word: κολληθέντα
  choice: العالق
  rationale: ينقل معنى الالتصاق والثبات في صياغة عربية طبيعية.
- source_word: ἐκ τῆς πόλεως ὑμῶν
  choice: مدينتكم
  rationale: أضيف الغبار إلى المدينة للتعبير عربيًا عن مصدره، وهو مدلول حرف الجر ἐκ في السياق.
- source_word: εἰς τοὺς πόδας
  choice: بأقدامنا
  rationale: العبارة اليونانية اصطلاحية وتصف وصول الغبار إلى الأقدام والتصاقه بها؛ والباء صياغة عربية واضحة لذلك.
- source_word: ἀπομασσόμεθα
  choice: نمسحه
  rationale: الفعل يعني المسح والإزالة، لا النفض على وجه التحديد؛ واختيار «نمسحه» يحافظ على هذا الفرق.
- source_word: ὑμῖν
  choice: شاهدًا عليكم
  rationale: يبرز اتجاه الفعل نحو المخاطبين بوصفه علامة إنذار وشهادة عليهم، مع تجنب تركيب «نمسحه عليكم» غير الطبيعي في العربية.
- source_word: πλήν
  choice: ولكن
  rationale: تفيد انتقالًا استدراكيًا قويًا إلى حقيقة ينبغي لهم معرفتها، وهي واضحة وطبيعية هنا.
- source_word: γινώσκετε
  choice: اعلموا
  rationale: صيغة أمر مباشرة تنقل طلب المعرفة والإقرار.
- source_word: ἤγγικεν
  choice: لقد اقترب
  rationale: تنقل صيغة التام اليونانية اقترابًا قد تحقق وله أثر قائم، من غير اختزاله إلى مجرد قرب مستقبلي.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي معروف ومفهوم، ويحفظ مفهوم الملك والسيادة من غير تفسير زائد.
theological_decisions:
- issue: دلالة مسح الغبار
  choice: فعل رمزي يشهد على المدينة الرافضة وينذرها
  alternative: فعل عادي متعلق بالنظافة أو السفر فقط
  rationale: السياق الإرسالي وضمير ὑμῖν يجعلان الحركة موجهة إلى الرافضين؛ وتعبير «شاهدًا عليكم» يحفظ القوة القضائية من غير توسع في مضمون النص.
- issue: معنى اقتراب ملكوت الله
  choice: اقترب الملكوت اقترابًا متحققًا ذا أثر مستمر في رسالة يسوع ومرسليه
  alternative: الملكوت وشيك زمنيًا فقط، أو قد اكتمل نهائيًا بالفعل
  rationale: صيغة ἤγγικεν التامة تدل على اقتراب وقع وبقيت نتيجته، لكنها لا تحسم التوتر الأخروي بادعاء اكتمال الملكوت النهائي.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كريمة ومباشرة. روعي تجنب الترجمة الحرفية المتعثرة لعبارة الأقدام، مع إبقاء صورة الغبار والمسح وقوة الإنذار، والحفاظ على التوتر بين اقتراب الملكوت وعدم التصريح باكتماله النهائي.
