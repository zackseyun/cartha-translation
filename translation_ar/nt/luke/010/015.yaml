  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: ar
  text: وأنتِ يا كفرناحوم، أإلى السماء ستُرفعين؟ إلى الهاوية[a] ستُهبطين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «عالم الأموات». اللفظ اليوناني هو «هاديس»، لا «جهنم».
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: كفرناحوم
  rationale: استُخدمت الصيغة العربية الشائعة لاسم المدينة، وهي نقل صوتي مستقر في الاستعمال الكتابي العربي.
- source_word: μὴ ... ὑψωθήσῃ
  choice: أإلى السماء تُرفعين؟
  rationale: صيغت العبارة سؤالًا إنكاريًا يتوقع جوابًا بالنفي، محافظةً على دلالة μὴ وعلى المبني للمجهول. وجاء الخطاب مؤنثًا لأن المقصود مدينة كفرناحوم.
- source_word: ἕως οὐρανοῦ
  choice: إلى السماء
  rationale: تنقل مدى الارتفاع وتحافظ على الصورة الرأسية المقابلة للهبوط إلى الهاوية.
- source_word: ἕως τοῦ ᾅδου
  choice: إلى الهاوية
  rationale: «الهاوية» المقابل العربي الكتابي الشائع لـᾅδης، وتشير هنا إلى عالم الأموات، لا إلى «جهنم». أُضيفت حاشية لمنع الخلط الدلالي.
- source_word: καταβιβασθήσῃ
  choice: ستُهبطين
  rationale: تحافظ الصيغة على المستقبل والمبني للمجهول وعلى معنى الإنزال من علو، من غير تقوية الفعل إلى معنى الطرح العنيف.
theological_decisions:
- issue: ترجمة ᾅδης
  choice: الهاوية
  alternative: عالم الأموات؛ هاديس؛ جهنم
  rationale: تحافظ «الهاوية» مع الحاشية على التمييز بين ᾅδης وγέεννα، فلا تُدخل مفهوم «جهنم» في موضع لا يذكره النص اليوناني، مع إبقاء معنى عالم الأموات واضحًا.
- issue: قوة السؤال المنفي μὴ ... ὑψωθήσῃ
  choice: سؤال إنكاري يتوقع النفي
  alternative: لن تُرفعي إلى السماء
  rationale: السؤال الإنكاري يحفظ هيئة العبارة اليونانية وتوترها البلاغي، بدل تحويلها إلى تقرير صريح.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ومهيبة. عوملت المدينة بوصفها مؤنثة في الخطاب، وهو الاستعمال العربي الطبيعي. أُضيفت «بل» لإظهار الانتقال البلاغي من الارتفاع المنفي ضمنًا إلى المصير المقابل، من غير تغيير مضمون النص.
