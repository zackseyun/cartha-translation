  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: ar
  text: 'فيقول لكم: «لا أعرف من أين أنتم. ابتعدوا عني، يا جميع فاعلي الظلم[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا جميع مرتكبي الإثم» أو «يا جميع فاعلي الشر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: فيقول لكم
  rationale: التركيب اليوناني يجمع فعل القول مع اسم فاعل زائد توكيديًا؛ صيغته العربية الطبيعية «فيقول لكم» تنقل إدخال الخطاب والمخاطَبين من غير تكرار ثقيل.
- source_word: οἶδα
  choice: أعرف
  rationale: «أعرف» تقابل معنى العلم أو المعرفة هنا بوضوح، مع إبقاء دلالة التنصل من العلاقة مفهومة من السياق دون إدخالها في الترجمة.
- source_word: πόθεν ἐστέ
  choice: من أين أنتم
  rationale: تعبير عربي مباشر يحفظ الاستفهام عن الأصل أو المصدر الكامن في πόθεν.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: ابتعدوا عني
  rationale: ينقل أمر الانفصال الحاسم بصياغة عربية واضحة وذات وقع مناسب، من دون تقادم «انصرفوا» أو تضييق الدلالة.
- source_word: πάντες ἐργάται
  choice: يا جميع فاعلي
  rationale: أداة النداء تُظهر القوة الندائية للعبارة، و«جميع» تحفظ شمول πάντες، و«فاعلي» تلائم من يمارسون الأمر المذكور.
- source_word: ἀδικίας
  choice: الظلم
  rationale: «الظلم» لفظ عربي طبيعي واسع يشمل الإثم والجور وفعل ما هو غير مستقيم، ويحفظ المجال الأخلاقي لـἀδικία دون استيراد معنى «مخالفة الشريعة» الأخص.
theological_decisions:
- issue: دلالة ἀδικίας في قول الدينونة
  choice: الظلم
  alternative: الإثم؛ الشر؛ مخالفة الشريعة
  rationale: يحفظ «الظلم» الإدانة الأخلاقية الواسعة ويمكن أن يشمل الجور وعدم البر، بينما «مخالفة الشريعة» قد توحي تحديدًا بمفهوم νόμος غير المذكور، و«الشر» أعم، و«الإثم» ديني النبرة لكنه أقل إبرازًا لبعد عدم العدل.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. جرى دمج التركيب اليوناني التوكيدي ἐρεῖ λέγων في عبارة عربية طبيعية، مع الحفاظ على الخطاب المباشر وشدة أمر الابتعاد. تظهر علامة الحاشية [a] في المتن.
