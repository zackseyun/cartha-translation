  text: And someone said to him[a], “Lord, are only a few being saved?” And he said to them[b],
translation:
  language: ar
  text: 'وقال له شخص: «يا ربّ[a]، هل الذين يُخَلَّصون قليلون؟[b]» فقال لهم:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يُفهم النداء أيضًا بمعنى «يا سيّد» بوصفه خطابًا توقيريًا؛ فاللفظ اليوناني يترك قوة اللقب هنا مفتوحة.
    reason: alternative_reading
  - marker: b
    text: 'وبصياغة عربية بديلة: «ألا يخلص إلا قليلون؟» غير أن الأصل حرفيًا أقرب إلى: «هل قليلون هم الذين يُخَلَّصون؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: و / فـ
  rationale: أداة ربط سردية خفيفة؛ نُقلت أولًا بالواو، ثم بالفاء عند الانتقال إلى جواب يسوع، بما يلائم انسياب السرد العربي من غير إقحام معنى تضاد قوي.
- source_word: τις
  choice: شخص
  rationale: ضمير نكرة يشير إلى فرد غير محدد، و«شخص» صياغة عربية واضحة لا تضيف هوية غير مذكورة.
- source_word: αὐτῷ
  choice: له
  rationale: يحافظ على الضمير الوارد في اليونانية من غير استبداله باسم يسوع داخل هذه الآية.
- source_word: Κύριε
  choice: يا ربّ
  rationale: يحافظ على اللفظ المعتاد للقب κύριος وعلى إمكان فهمه نداءً توقيريًا أو ذا دلالة أعمق، مع بيان البديل في الحاشية.
- source_word: εἰ
  choice: هل
  rationale: تدخل هنا على استفهام، و«هل» هي الصياغة العربية الطبيعية المباشرة.
- source_word: ὀλίγοι
  choice: قليلون
  rationale: ينقل معنى قلة العدد دون إضافة لفظ «فقط» غير الصريح في الأصل.
- source_word: οἱ σῳζόμενοι
  choice: الذين يُخَلَّصون
  rationale: يحافظ على التعريف وعلى صيغة المبني للمجهول في اسم الفاعل المضارع، من غير حسم كيفية الخلاص أو اختزاله إلى نتيجة ماضية مكتملة.
- source_word: πρὸς αὐτούς
  choice: لهم
  rationale: ينقل ضمير الجمع كما هو، مع إبقاء مرجعه معتمدًا على السياق.
theological_decisions:
- issue: دلالة κύριε في مخاطبة يسوع
  choice: يا ربّ
  alternative: يا سيّد
  rationale: قد يكون النداء توقيريًا مهذبًا أو يحمل دلالة أرفع؛ «يا ربّ» يبقي هذا الانفتاح اللاهوتي، والحاشية تنبّه إلى إمكان المعنى الاحترامي.
- issue: صيغة σῳζόμενοι ودلالتها الزمنية
  choice: الذين يُخَلَّصون
  alternative: الذين يخلصون / الناجون
  rationale: الصيغة اليونانية مضارعة مبنية للمجهول، والترجمة المختارة تحافظ على كون الخلاص واقعًا عليهم وعلى طابعه الجاري، من غير فرض منظومة خلاصية بعينها.
- issue: هل يتضمن ὀλίγοι معنى «فقط» صراحة؟
  choice: قليلون
  alternative: قليلون فقط / لا يخلص إلا قليلون
  rationale: الأصل يسأل إن كان المخلَّصون قليلين، ولا يشتمل على أداة حصر مستقلة؛ لذلك تجنبت الترجمة زيادة الحصر مع الإبقاء على مغزى السؤال.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. استُعمل «يُخَلَّصون» رغم ثقله النسبي للحفاظ على المبني للمجهول وعلى الدلالة الجارية في الأصل، ووُضعت الحواشي عند الألفاظ التي تفسرها مباشرة.
