  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: ar
  text: لا، أقول لكم؛ بل إن لم تتوبوا، فستهلكون جميعًا كذلك[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بالطريقة نفسها». قد تشير كلمة «كذلك» إلى دينونة مباغتة مشابهة، لا بالضرورة إلى كيفية موت مطابقة.
    reason: بديل معجمي يحفظ مجال دلالة ὁμοίως واحتمال المقارنة دون حسم زائد.
lexical_decisions:
- source_word: οὐχί
  choice: كَلّا
  rationale: نفي قوي يردّ على الافتراض الضمني في السياق السابق، و«كَلّا» تؤدي هذا الرد بوضوح وفصاحة من غير إضافة مبالغة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: صيغة خطاب مباشرة وتوكيدية شائعة في لوقا، وقد حُفظ تركيبها الطبيعي في العربية.
- source_word: ἀλλ’
  choice: بل
  rationale: تفيد الإضراب والانتقال من نفي الافتراض السابق إلى التحذير المقابل.
- source_word: ἐὰν μὴ
  choice: إن لم
  rationale: تحفظ بنية الشرط المنفي وقوته بصورة عربية طبيعية.
- source_word: μετανοῆτε
  choice: تتوبوا
  rationale: يدل الفعل هنا على التوبة والرجوع الأخلاقي والروحي إلى الله، لا على مجرد تغيير رأي ذهني؛ و«تتوبوا» هي المقابل العربي الواضح والمألوف.
- source_word: πάντες
  choice: جميعًا
  rationale: تحفظ شمول التحذير لكل المخاطَبين، وجاء موضعها طبيعيًا مع الفعل في العربية.
- source_word: ὁμοίως
  choice: كذلك
  rationale: تحفظ المقارنة بالأحداث السابقة دون أن تفرض تطابقًا تامًا في كيفية الموت؛ وقد أُثبت البديل الأصرح في الحاشية.
- source_word: ἀπολεῖσθε
  choice: ستهلكون
  rationale: تنقل معنى المصير إلى الهلاك أو الخراب، من غير حصره في الموت الجسدي وحده أو التصريح بتحديد عقائدي يتجاوز اللفظ اليوناني.
theological_decisions:
- issue: مدى معنى الهلاك في تحذير يسوع
  choice: ستهلكون
  alternative: ستموتون؛ ستُدانون أبديًا؛ ستُدمَّرون
  rationale: يحذر النص من الدينونة عند غياب التوبة، لكن الفعل اليوناني لا يحدد هنا وحده صورة الهلاك أو مداه تحديدًا كاملًا. لذلك يحفظ «ستهلكون» ثقل التحذير واتساع دلالته من غير تضييق أو تفصيل عقائدي زائد.
- issue: وجه الشبه الذي يفيده ὁμοίως
  choice: كذلك، مع حاشية توضيحية
  alternative: بالطريقة نفسها
  rationale: قد تتعلق المقارنة بمجيء الدينونة المباغت أو بالمصير المشابه عمومًا، لا بالضرورة بكيفية موت مطابقة؛ لذا تُرك هذا القدر من الاحتمال قائمًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعملت «تتوبوا» لأنها طبيعية ودقيقة دينيًا وأخلاقيًا، مع تجنب شرح معنى التوبة داخل المتن. وُضعت علامة الحاشية [a] بعد «كذلك» لأنها الكلمة التي تتناولها الحاشية مباشرة.
