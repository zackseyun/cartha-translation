  rationale: صيغة الماضي الناقص تدل على قول جارٍ أو متكرر في سياق السرد؛ و«فكان يقول» تنقل هذا الجانب بصورة طبيعية.
- source_word: οὖν
  choice: فـ
  rationale: تفيد مواصلة الكلام وربطه بما سبق، وتؤدي الفاء هذا المعنى بإيجاز وطبيعية في العربية.
- source_word: Τίνι ... ὁμοία ἐστὶν
  choice: بماذا يشبه ...؟
  rationale: تؤدي تركيب المقارنة الاستفهامي بعبارة عربية واضحة ومباشرة.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير كتابي عربي راسخ يحفظ مجال المعنى الذي يشمل سلطان الله وملكه، من غير حصره في مكان.
- source_word: καὶ
  choice: و
  rationale: تحفظ العطف البسيط بين السؤالين المتوازيين.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: وبماذا أشبّهه؟
  rationale: تنقل صيغة المستقبل ذات القوة التداولية الاستفهامية هنا بصيغة مضارع عربية طبيعية، مع عودة الضمير على «ملكوت» المذكر في العربية.
theological_decisions:
- issue: ترجمة βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  alternative: مُلك الله / سلطان الله
  rationale: «ملكوت الله» يحفظ التعبير الكتابي المألوف واتساع الدلالة بين نطاق الملك وممارسة السلطان، بينما تُبرز البدائل جانب الحكم وحده وقد تضيّق الصورة المجازية.
