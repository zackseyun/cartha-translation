  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: ar
  text: 'حينئذ تبدؤون أن تقولوا: «أكلنا وشربنا بحضورك، وعلَّمتَ في شوارعنا[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في ساحاتنا العامة»؛ فاللفظة اليونانية قد تشير إلى الشوارع الواسعة أو الأماكن العامة المفتوحة داخل البلدة.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: تفيد التتابع الزمني في سياق الكلام، وتحافظ على الصلة بما يسبق.
- source_word: ἄρξεσθε λέγειν
  choice: تبدأون تقولون
  rationale: تنقل بوضوح الدلالة الابتدائية للفعل مع المصدر، بدل اختزالها إلى «تقولون» فقط.
- source_word: Ἐφάγομεν ... καὶ ἐπίομεν
  choice: أكلنا وشربنا
  rationale: صيغة الماضي البسيط طبيعية في العربية وتناسب اقتران الفعلين في الحديث عن الأكل والشرب.
- source_word: ἐνώπιόν σου
  choice: بحضورك
  rationale: تعبير عربي واضح يدل على وجودهم في حضرته من غير أن يضيف معنى القبول أو الشركة الحقيقية.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: في شوارعنا
  rationale: تنقل المعنى المكاني العام للطرق الواسعة أو الأماكن العامة داخل البلدة، مع إثبات البديل الممكن في الحاشية.
- source_word: ἐδίδαξας
  choice: علَّمتَ
  rationale: الماضي البسيط يحافظ على الإشارة إلى واقعة تعليمه بينهم علنًا.
theological_decisions:
- issue: طبيعة احتجاج المتكلمين بعلاقتهم بيسوع
  choice: صيغت العبارة بوصفها ادعاءً بأنهم كانوا في حضرته وسمعوا تعليمه في مواضعهم العامة.
  alternative: صياغة قد توحي بأنه شاركهم مائدة شركة مقبولة أو أقرّ لهم بعلاقة خلاصية.
  rationale: النص يذكر قربًا خارجيًا وتعليمًا علنيًا، لكنه لا يصرّح بقبولهم؛ لذلك تُحفظ هذه المفارقة من غير حسم لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. وُضع رمز الحاشية بعد «شوارعنا» لأنه يشرح هذه اللفظة تحديدًا.
