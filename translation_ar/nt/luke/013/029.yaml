id: LUK.13.29
reference: Luke 13:29
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: ar
  text: وسيأتون من المشرق والمغرب، ومن الشمال والجنوب، ويتكئون إلى المائدة[a] في ملكوت الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يجلسون إلى الطعام»؛ والفعل اليوناني يشير على نحو أخص إلى الاتكاء لتناول وليمة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: سيأتون
  rationale: صيغة المستقبل من ἥκω تدل هنا على المجيء أو الوصول، و«سيأتون» أنسب مع عبارات الجهات اللاحقة.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: من المشرق والمغرب
  rationale: اللفظان في صيغة الجمع يعنيان حرفيًا مواضع الشروق والغروب، وهما تعبيران عن جهتي الشرق والغرب؛ و«المشرق والمغرب» تعبير عربي طبيعي وفصيح.
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: من الشمال والجنوب
  rationale: تُكمل هاتان الجهتان الإحاطة الجغرافية التي بدأها المشرق والمغرب، دون إضافة تحديد عرقي غير مذكور في النص.
- source_word: ἀνακλιθήσονται
  choice: يتكئون إلى المائدة
  rationale: الفعل في سياق الولائم يدل على الاتكاء لتناول الطعام. تحافظ العبارة على صورة الوليمة، مع التصريح بالمائدة لإيضاح الاستعمال الثقافي للقارئ الحديث.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: في ملكوت الله
  rationale: ترجمة عربية مألوفة وشفافة تحفظ الدلالة اللاهوتية والأخروية للعبارة من غير شرح زائد.
theological_decisions:
- issue: صورة الوليمة في الملكوت الأخروي
  choice: يتكئون إلى المائدة
  alternative: يجلسون في ملكوت الله
  rationale: تحفظ الصياغة صورة المشاركة في وليمة التي يحملها الفعل اليوناني، بدل تسطيحها إلى مجرد الجلوس أو الدخول، من غير استيراد تفصيل عقائدي إضافي.
- issue: الشمول الجغرافي
  choice: ذكر الجهات الأربع كما وردت دون تعيين هوية القادمين
  alternative: التصريح بأنهم من الأمم أو من جميع الشعوب
  rationale: يفيد النص مجيء أناس من كل الجهات، لكنه لا يسمّيهم صراحةً أممًا أو يحدد عرقهم؛ لذلك تُحفظ سعة العبارة وغموضها المقصود.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «المشرق والمغرب» لطبيعته في العربية، و«يتكئون إلى المائدة» للموازنة بين دقة صورة الوليمة وسهولة الفهم.
