source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: ar
  text: 'في تلك الساعة عينها[a]، اقترب بعض الفريسيين من يسوع وقالوا له: «اخرج وامضِ من هنا[b]، لأن هيرودس يريد أن يقتلك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في تلك الساعة نفسها».'
    reason: بديل لفظي يحافظ كذلك على معنى التوكيد والتوقيت المحدد.
  - marker: b
    text: 'أو: «اخرج وارحل من هنا».'
    reason: بديل لفظي أوضح لمعنى المغادرة في πορεύου، وإن كان أقل محافظة على التمييز الأسلوبي بين الفعلين.
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: في تلك الساعة عينها
  rationale: يحافظ التعبير على التوقيت المحدد وعلى قوة التوكيد في αὐτῇ، بصياغة عربية فصيحة وطبيعية.
- source_word: προσῆλθάν
  choice: اقترب ... من يسوع
  rationale: ينقل معنى الدنو والاقتراب المقصود في προσέρχομαι. وذُكر اسم يسوع بدل الضمير لسلامة الإحالة ووضوحها بالعربية.
- source_word: τινες Φαρισαῖοι
  choice: بعض الفريسيين
  rationale: ينقل عدم التعيين في τινες من غير أن يوحي بأن جميع الفريسيين اشتركوا في القول.
- source_word: λέγοντες αὐτῷ
  choice: وقالوا له
  rationale: صيغ اسم الفاعل اليوناني فعلًا معطوفًا، وهو الأسلوب العربي الطبيعي مع الحفاظ على تزامن القول مع الاقتراب.
- source_word: Ἔξελθε
  choice: اخرج
  rationale: يحافظ على صورة فعل الأمر اليوناني المباشر، وهو أوفق من إضافة معنى الطرد الذي قد توحي به تعبيرات أشد.
- source_word: καὶ πορεύου ἐντεῦθεν
  choice: وامضِ من هنا
  rationale: ينقل معنى الانطلاق ومغادرة المكان مع إبقاء الفعلين المتتابعين في الأصل، من غير حشو ثقيل.
- source_word: ὅτι
  choice: لأن
  rationale: يبيّن بوضوح أن الجملة التالية تعليل للتحذير.
- source_word: Ἡρῴδης
  choice: هيرودس
  rationale: الصيغة العربية المألوفة للاسم.
- source_word: θέλει
  choice: يريد
  rationale: ينقل معنى الرغبة في θέλω من غير المبالغة إلى معنى الخطة المحسومة أو النية المدبرة.
- source_word: ἀποκτεῖναι
  choice: أن يقتلك
  rationale: ترجمة مباشرة لمعنى القتل، ولا تفترض أن المقصود إعدام رسمي.
theological_decisions:
- issue: دافع الفريسيين إلى تحذير يسوع
  choice: عرض كلامهم بوصفه تحذيرًا من غير وصف نياتهم
  alternative: التصريح بأنهم كانوا مخلصين في التحذير، أو بأنهم أرادوا تخويف يسوع وحمله على الرحيل
  rationale: النص اليوناني يورد قولهم ولا يكشف صراحة عن دافعهم؛ لذلك تُحفظ المساحة السردية والتوتر التفسيري دون حسم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. أُبقي الأمر مباشرًا، وحُفظ تتابع فعلي الخروج والمضي، ولم تُضف أي إشارة إلى صدق الفريسيين أو خداعهم.
