  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: ar
  text: ولكن ينبغي لي أن أواصل المسير اليوم وغدًا واليوم الذي يليه[b]، لأنه لا يمكن[a] أن يهلك نبي خارج أورشليم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يُتصور» أو «لا يعقل» أن يهلك نبي خارج أورشليم.'
    reason: lexical_alternative
  - marker: b
    text: قد تكون عبارة «اليوم وغدًا واليوم الذي يليه» تعبيرًا اصطلاحيًا عن مسار قصير محدد، لا تحديدًا لثلاثة أيام تقويمية حرفية.
    reason: cultural_note
lexical_decisions:
- source_word: πλὴν
  choice: ولكن
  rationale: تفيد الاستدراك والتباين مع الكلام السابق، و«ولكن» واضحة وطبيعية في العربية المعاصرة.
- source_word: δεῖ με
  choice: ينبغي لي
  rationale: تنقل معنى الضرورة في الفعل غير الشخصي δεῖ، من غير أن تحدد صراحةً مصدر هذه الضرورة.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: اليوم وغدًا واليوم الذي يليه
  rationale: تحافظ على التدرج الزمني الثلاثي الصريح في اليونانية، مع صياغة عربية طبيعية.
- source_word: πορεύεσθαι
  choice: أن أواصل المسير
  rationale: ينقل معنى الذهاب أو المضي في الطريق، كما يبرز الاستمرار الملائم للسياق.
- source_word: ὅτι
  choice: لأنه
  rationale: يقدم علة الضرورة المذكورة قبله بربط سببي واضح.
- source_word: οὐκ ἐνδέχεται
  choice: لا يمكن
  rationale: يحافظ على معنى الاستحالة أو عدم التصور، من غير أن يحسم ما في العبارة من مفارقة بلاغية.
- source_word: προφήτην
  choice: نبي
  rationale: النكرة المفردة هنا ذات دلالة عامة، فتناسب الطابع الشبيه بالمثل في العبارة.
- source_word: ἀπολέσθαι
  choice: أن يهلك
  rationale: يحفظ المدى الدلالي للفعل، الذي قد يدل على الهلاك أو الموت أو التدمير، مع نبرة جليلة.
- source_word: ἔξω Ἰερουσαλήμ
  choice: خارج أورشليم
  rationale: ترجمة مكانية مباشرة ودقيقة للتعبير اليوناني.
theological_decisions:
- issue: قوة قول يسوع عن هلاك نبي خارج أورشليم
  choice: 'صيغ القول بلغة الاستحالة: «لا يمكن»، مع إبقاء المفارقة النبوية والبلاغية مفتوحة.'
  alternative: «لا يُتصور» أو «لا يعقل» لإبراز عدم الملاءمة والمفارقة أكثر من الاستحالة الحرفية.
  rationale: قد يفيد οὐκ ἐνδέχεται الاستحالة أو ما لا يُتصور عرفًا. تحافظ الصياغة على التوتر في الأصل، فلا تجعل القول تقريرًا ميتافيزيقيًا صارمًا ولا تحوله صراحةً إلى تهكم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «أواصل المسير» للتعبير طبيعيًا عن استمرار الذهاب، مع الحفاظ على التتابع الزمني وعلى غموض العبارة الختامية ومفارقتها.
