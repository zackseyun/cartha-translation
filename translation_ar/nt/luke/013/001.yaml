source:
  edition: SBLGNT
  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: ar
  text: وكان في ذلك الوقت نفسه بعضُ الحاضرين يخبرونه عن الجليليين الذين خلط بيلاطس دماءهم بذبائحهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مزج دماءهم بذبائحهم».'
    reason: بديل معجمي للفعل ἔμιξεν يحفظ صورة الاختلاط بلفظ عربي آخر.
lexical_decisions:
- source_word: Παρῆσαν δέ τινες
  choice: وكان ... بعضُ الحاضرين
  rationale: ينقل معنى الحضور المستمر في الفعل الناقص، مع أداء δέ بواو انتقالية خفيفة من غير إدخال ظرف زمني غير موجود في الأصل.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: في ذلك الوقت نفسه
  rationale: يحفظ التحديد والتوكيد في αὐτῷ، ويربط الخبر بالسياق السابق بعبارة عربية طبيعية.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: يخبرونه
  rationale: يؤدي معنى نقل خبر إليه بوضوح وإيجاز، وتستقيم به العربية أكثر من الصياغة الاسمية الثقيلة.
- source_word: περὶ τῶν Γαλιλαίων
  choice: عن الجليليين
  rationale: تنقل περί مع المضاف إليه بوصفها محددة لموضوع الخبر.
- source_word: ὧν τὸ αἷμα
  choice: الذين ... دماءهم
  rationale: أعيد بناء الصلة وفق الأسلوب العربي الطبيعي، واستعمل الجمع «دماءهم» لأن الحديث عن جماعة، مع بقاء المعنى مطابقًا للمفرد الجمعي في اليونانية.
- source_word: Πιλᾶτος
  choice: بيلاطس
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: ἔμιξεν
  choice: خلط
  rationale: المعنى المباشر للفعل هو المزج أو الخلط؛ والماضي العربي يعبّر طبيعيًا عن الحدث السابق الذي يورده المخبرون.
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: بذبائحهم
  rationale: الباء تؤدي معنى المصاحبة في تركيب عربي موجز، وتحفظ إضافة الذبائح إليهم من غير تفسير هل كانوا يقدمونها لحظة قتلهم.
theological_decisions:
- issue: المدلول التاريخي والأخلاقي لفعل بيلاطس
  choice: 'الإبقاء على الصورة الصادمة المباشرة: خلط دماء الجليليين بذبائحهم.'
  alternative: 'التوسيع التفسيري: «قتلهم وهم يقدمون ذبائحهم».'
  rationale: النص لا يشرح كيفية وقوع الحادثة ولا يصرح بأن القتل جرى في أثناء تقديم الذبائح؛ لذلك لا تُضاف تفاصيل تفسيرية تحسم ما تركه الأصل غير مفصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير تركيب طبيعي يحفظ دقة الزمن والسياق، وتُركت ملابسات الحادثة كما هي في اليونانية بلا شرح زائد.
