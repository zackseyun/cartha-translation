  verdict: approve
  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «الرب» لـ κύριος، والنداء التوبيخي الجمعي «يا مراؤون»، والقوة التوزيعية في «كل واحد منكم»، وفكّ الحيوان من المِذود ثم اقتياده لسقيه. والاستفهام بـ«ألا» يؤدي الوظيفة الإنكارية للسؤال اليوناني على نحو سليم.'
  naturalness: الصياغة فصيحة واضحة ومناسبة للسرد الإنجيلي المعاصر. «في السبت» مستعملة ومفهومة في السجل الكتابي العربي، و«المِذود» لفظ دقيق ومألوف في هذا السياق. تسلسل «ثم يقتاده ليسقيه» طبيعي ويحفظ ترتيب الأفعال.
  terminology: «الرب» يحافظ على اللقب السردي لـ κύριος، و«مراؤون» مقابِل مناسب لـ Ὑποκριταί في خطاب توبيخي. كما أن «يحلّ» و«المِذود» و«يسقيه» دقيقة في سياق ربط الحيوان وإطعامه وسقيه.
