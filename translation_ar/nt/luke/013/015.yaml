  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: ar
  text: 'فأجابه الرب قائلًا: «يا مراؤون! ألا يحلّ كل واحد منكم في السبت ثوره أو حماره من عند المِذود، ثم يقتاده ليسقيه؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: الرب
  rationale: يحفظ اللقب السردي الذي يطلقه لوقا على يسوع وما يحمله من دلالة، من غير خفضه إلى «السيد» بمعنى صاحب السلطة البشرية فقط.
- source_word: Ὑποκριταί
  choice: يا مراؤون
  rationale: صيغة نداء جمع وتوبيخ مباشر؛ و«مراؤون» تنقل حدّة الوصف بعبارة عربية فصيحة ومفهومة.
- source_word: ἕκαστος ὑμῶν
  choice: كل واحد منكم
  rationale: تحفظ القوة التوزيعية للتعبير اليوناني.
- source_word: τῷ σαββάτῳ
  choice: في السبت
  rationale: تعبير عربي موجز وطبيعي للدلالة الزمنية.
- source_word: λύει
  choice: يحلّ
  rationale: يدل بوضوح على فك رباط الحيوان، ويحافظ أيضًا على الصلة اللفظية في السياق الأوسع بين الحلّ والتحرير.
- source_word: βοῦν
  choice: ثوره
  rationale: «الثور» المقابل العربي المألوف والمناسب لحيوان العمل المذكور مع الحمار.
- source_word: ὄνον
  choice: حماره
  rationale: مقابل عربي واضح وحديث للاسم اليوناني.
- source_word: φάτνης
  choice: المِذود
  rationale: لفظ عربي دقيق لموضع علف الحيوان أو معلفه، وهو مناسب لصورة فك الحيوان من عنده.
- source_word: ἀπαγαγὼν
  choice: ثم يقتاده
  rationale: ينقل حركة قيادة الحيوان بعيدًا وتسلسلها السابق لفعل السقي، بصياغة عربية طبيعية.
- source_word: ποτίζει
  choice: ليسقيه
  rationale: ينقل معنى تقديم الماء للحيوان بإيجاز ووضوح.
theological_decisions:
- issue: إطلاق κύριος على يسوع في السرد
  choice: الرب
  alternative: السيد
  rationale: يحفظ لقب لوقا السردي وثقله المسيحاني من غير إضافة تفسير عقائدي إلى النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. صيغ الاستفهام الإنكاري محفوظة، وكذلك حدّة التوبيخ. لا حاجة إلى حاشية لـ«المِذود»، لأن اللفظ العربي نفسه يعبّر عن موضع العلف المقصود في السياق.
