source:
  edition: SBLGNT
  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ ⸀μετανοῆτε πάντες ⸀ὡσαύτως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: ar
  text: كَلَّا، أقولُ لكم؛ بل إن لم تتوبوا، فستهلكون جميعًا كذلك[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ستهلكون جميعًا بالطريقة نفسها». قد تشير «كذلك» في اليونانية إلى دينونة مماثلة في ضوء الأمثلة السابقة.'
    reason: بديل معجمي يحفظ احتمال أن تكون المقارنة في طريقة الهلاك، مع عدم الجزم بذلك في المتن.
lexical_decisions:
- source_word: οὐχί
  choice: كَلَّا
  rationale: جواب نفي مباشر ومؤكد عن السؤال الضمني في السياق السابق، و«كَلَّا» أفصح من «لا» في نقل قوة النفي هنا من غير مبالغة.
- source_word: λέγω ὑμῖν
  choice: أقولُ لكم
  rationale: صياغة عربية طبيعية وقريبة من العبارة اليونانية الشائعة عند لوقا.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: بل إن لم
  rationale: تحفظ الاستدراك وقوة الشرط، وتأتي سليمة وواضحة في العربية المعاصرة.
- source_word: μετανοῆτε
  choice: تتوبوا
  rationale: «تتوبوا» هي المقابل الكتابي العربي المألوف، وتشمل الرجوع إلى الله وتغيّر التوجه، فلا تختزل المعنى في الندم العاطفي أو تغيير الرأي الذهني وحده.
- source_word: πάντες
  choice: جميعًا
  rationale: 'تبيّن شمول التحذير لكل المخاطَبين، مع اتصالها الطبيعي بفاعل الفعل: «ستهلكون جميعًا».'
- source_word: ὡσαύτως
  choice: كذلك
  rationale: تحفظ المقارنة الموجزة المفتوحة في اليونانية دون حصرها في مماثلة طريقة الهلاك وحدها.
- source_word: ἀπολεῖσθε
  choice: ستهلكون
  rationale: تنقل معنى الهلاك والضياع الخطير، ولا تحصر التحذير في الموت الجسدي فحسب.
theological_decisions:
- issue: معنى التوبة في تحذير يسوع
  choice: تُرجمت μετανοῆτε بـ«تتوبوا» من غير تضييقها إلى مجرد الندم أو تغيير الفكر.
  alternative: تغيّروا أفكاركم؛ ترجعوا
  rationale: اللفظ في هذا السياق دعوة جادة إلى التوبة أمام الله، و«تتوبوا» يحفظ ثقله الكتابي من دون فرض صياغة مذهبية مفصلة.
- issue: دلالة ὡσαύτως ἀπολεῖσθε
  choice: «ستهلكون جميعًا كذلك» مع إبقاء وجه المشابهة غير محدد.
  alternative: ستهلكون جميعًا بالطريقة نفسها
  rationale: قد تتعلق المقارنة بنوع الدينونة أو وجه مشابه آخر في ضوء الأمثلة السابقة؛ لذلك لا ينبغي أن تحصر الترجمة المعنى في كيفية الهلاك وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «كَلَّا» للنفي المؤكد، و«تتوبوا» للمصطلح الكتابي الطبيعي، مع إبقاء الغموض الحقيقي في «كذلك» وعدم تفسير وجه المقارنة داخل المتن.
