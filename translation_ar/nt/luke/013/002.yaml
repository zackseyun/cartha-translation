  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: ar
  text: 'فأجابهم: «أتظنون أن هؤلاء الجليليين صاروا أكثر خطيئةً من سائر الجليليين لأنهم عانوا هذه الأمور؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: فأجابهم
  rationale: صياغة عربية طبيعية تؤدي معنى العبارة اليونانية الاصطلاحية «أجاب وقال لهم» من غير حشو.
- source_word: ἐγένοντο
  choice: صاروا
  rationale: يحافظ على الدلالة الصريحة للفعل الدال على الصيرورة، من غير استبداله بالفعل الساكن «كانوا».
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους
  choice: أكثر خطيئةً من سائر الجليليين
  rationale: ينقل المقارنة التي تفيد أنهم يفوقون جميع الجليليين الآخرين في الخطيئة، مع تجنب تركيب عربي ثقيل من قبيل «خطاة أكثر من».
- source_word: ταῦτα πεπόνθασιν
  choice: عانوا هذه الأمور
  rationale: ينقل معنى الفعل التام «عانوا/كابدوا» ويحافظ على الإشارة العامة «هذه الأمور» كما في المصدر.
theological_decisions:
- issue: هل تدل المأساة على تفوق ضحاياها في الخطيئة؟
  choice: الإبقاء على السؤال كما هو، من غير إضافة جواب أو تفسير داخل الآية
  alternative: تفسير السؤال صراحةً بأنه ينفي وجود علاقة مباشرة بين شدة الألم وشدة الخطيئة
  rationale: الآية نفسها تطرح السؤال، أما الجواب الصريح فيأتي في السياق اللاحق؛ وإدخاله هنا يسبق النص ويزيل توتره البلاغي.
- issue: دلالة ἐγένοντο
  choice: «صاروا»
  alternative: «كانوا» أو «ثبت أنهم»
  rationale: يحفظ اختيار المصدر اللفظي الدال على الصيرورة، مع بقاء احتمال الاستعمال الذي يفيد الظهور أو الاتصاف بحسب السياق، من غير حسم تفسيري زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعمل «سائر الجليليين» بمعنى بقية الجليليين، وحُذفت ازدواجية «أجاب وقال» لأنها غير طبيعية في العربية المعاصرة مع حفظ وظيفتها.
