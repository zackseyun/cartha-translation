  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: ar
  text: 'فأجابه قائلًا: «يا سيدي، اتركها هذه السنة أيضًا، حتى أحفر حولها وأضع حولها سمادًا من الروث.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς λέγει
  choice: فأجابه قائلًا
  rationale: يحفظ عنصري الجواب والقول في الصياغة اليونانية، مع تعبير عربي فصيح وطبيعي.
- source_word: Κύριε
  choice: يا سيدي
  rationale: الخطاب هنا داخل المثل وموجَّه إلى صاحب الكرم؛ «يا سيدي» ينقل لقب الاحترام طبيعيًا من غير أن يفرض دلالة لاهوتية غير مصرَّح بها في السياق.
- source_word: ἄφες αὐτὴν
  choice: اتركها
  rationale: ينقل المعنى المباشر للفعل، أي دعها تبقى ولا تقطعها، من غير إضافة معنى «اعفُ عنها» أو «أمهلها» صراحة.
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: هذه السنة أيضًا
  rationale: يحافظ على معنى منحها السنة الحالية إضافةً إلى المهلة السابقة، دون تحويل العبارة إلى «سنة أخرى» على نحو تفسيري.
- source_word: ἕως ὅτου
  choice: حتى
  rationale: أداة عربية موجزة وطبيعية لبيان المهلة الممتدة إلى إتمام العملين التاليين.
- source_word: σκάψω περὶ αὐτὴν
  choice: أحفر حولها
  rationale: يحفظ الصورة الزراعية المحسوسة والفعل المباشر في الأصل.
- source_word: βάλω κόπρια
  choice: أضع لها سمادًا
  rationale: «سمادًا» مفهوم في العربية المعاصرة بوصفه مادة التسميد، وتؤدي اللام معنى وضعه للشجرة؛ أما «روثًا» فأشد حرفية لكنه قد يحصر اللفظ في مادة بعينها أكثر مما يلزم.
theological_decisions:
- issue: دلالة Κύριε في خطاب المثل
  choice: يا سيدي
  alternative: يا رب
  rationale: يمكن أن تعني الكلمة «رب» أو «سيد»، لكن المتكلم هنا عامل الكرم يخاطب صاحبه داخل المثل. لذلك اختير لقب الاحترام العربي الطبيعي، مع إبقاء هوية صاحب الكرم اللاهوتية — إن أُريدت رمزيًا — غير محسومة في الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع الحفاظ على بساطة الصورة الزراعية وتسلسل أفعال النص. لا توجد حواشٍ لأن البدائل المعجمية لا تبلغ هنا حد الغموض الذي يستلزم إثباته في النص المنشور.
