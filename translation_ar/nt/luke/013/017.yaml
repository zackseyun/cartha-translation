  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: ar
  text: وبينما كان يقول هذا، كان جميع الذين يقاومونه يُخزَون، وكان الجمع كله يفرح بجميع الأعمال المجيدة[a] التي كان يفعلها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأعمال العجيبة» أو «الأعمال الباهرة». واليونانية تقول حرفيًا: «الأمور المجيدة»، وهي عبارة واسعة قد تشمل أعماله المقتدرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: وبينما كان يقول هذا
  rationale: ينقل تركيب المضاف المطلق مع اسم الفاعل المضارع معنى التزامن والاستمرار، واسم الإشارة المحايد الجمع يُعبَّر عنه طبيعيًا في العربية بـ«هذا» إشارةً إلى الكلام السابق.
- source_word: κατῃσχύνοντο
  choice: كانوا يُخزَون
  rationale: يحفظ دلالة المبني للمجهول وما يفيده الماضي الناقص من حالة متواصلة، مع إبراز الخزي العلني الناتج من كلام يسوع.
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: الذين يقاومونه
  rationale: يحافظ على القوة الفعلية المستمرة لاسم الفاعل اليوناني بدل اختزالها في الاسم «خصومه».
- source_word: πᾶς ὁ ὄχλος
  choice: الجمع كله
  rationale: صياغة عربية طبيعية تحافظ على شمول الجماعة بوصفها وحدة واحدة.
- source_word: ἔχαιρεν
  choice: كان يفرح
  rationale: ينقل الماضي الناقص بوصفه فرحًا مستمرًا، لا مجرد استجابة لحظية.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: بجميع الأعمال المجيدة
  rationale: تفيد الباء سبب الفرح أو متعلَّقه، و«المجيدة» تحفظ اتساع ἔνδοξος دون قصر العبارة على المعجزات؛ وأُضيفت «الأعمال» لتستقيم العبارة العربية مع ما كان يسوع يفعله.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: التي كان يفعلها
  rationale: صياغة عربية مباشرة تحفظ إسناد الأعمال إلى يسوع، وتنقل الاستمرار الذي في اسم الفاعل المضارع.
theological_decisions:
- issue: طبيعة الأمور المجيدة
  choice: الأعمال المجيدة
  alternative: الأعمال العجيبة أو المعجزات
  rationale: لفظة ἐνδόξοις واسعة، فتشمل الأعمال الباهرة والمشرِّفة دون أن تحصرها الترجمة في المعجزات وحدها، مع أن السياق يتضمن شفاءً.
- issue: فاعلية يسوع في ὑπ’ αὐτοῦ
  choice: التي كان يفعلها
  alternative: التي كانت تحدث على يده
  rationale: يُسند النص الأعمال إلى يسوع بوصفه فاعلها؛ وهذه الصياغة تحفظ الوكالة المباشرة ولا تدخل معنى وساطة غير لازم.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يُخزَون» للمبني للمجهول مع ضبطه منعًا لالتباس القراءة، وحُفظ توازي الفعلين المستمرين «كانوا يُخزَون» و«كان ... يفرح».
