base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: ar
  text: 'وكان يروي هذا المثل: «كان لرجل شجرة تين مغروسة في كرمه، فجاء يطلب ثمرًا فيها، فلم يجد.»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان لشخص ما شجرة تين مغروسة في كرمه». فالضمير اليوناني نكرة، ويمكن نقله بصيغة أعم، لكن «لرجل» أنسب لأسلوب المثل القصصي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: كان يروي
  rationale: صيغة الماضي الناقص تدل على فعل ماضٍ ممتد أو تمهيدي، و«كان يروي» طبيعية في افتتاح المثل وتحفظ هذا الجانب دون تكلّف.
- source_word: δὲ
  choice: الواو في «وكان»
  rationale: أداة ربط خفيفة تصل الكلام بسياقه السابق من غير أن تفرض انتقالًا زمنيًا أو منطقيًا أقوى مما في اليونانية.
- source_word: παραβολήν
  choice: المثل
  rationale: «المثل» هو المقابل العربي المألوف والدقيق للقصة التعليمية التصويرية في هذا السياق.
- source_word: Συκῆν
  choice: شجرة تين
  rationale: الاسم يدل تحديدًا على شجرة التين، وذكر «شجرة» يزيل أي التباس مع الثمر.
- source_word: εἶχέν τις
  choice: كان لرجل
  rationale: τις ضمير نكرة؛ وهذه الصياغة عربية قصصية طبيعية، ولا تضيف إلى الشخصية أي تحديد لاهوتي.
- source_word: πεφυτευμένην
  choice: مغروسة
  rationale: اسم المفعول التام المبني للمجهول يصوّر الشجرة في حالة ثابتة ناتجة عن غرسها؛ و«مغروسة» تحفظ الحالة والمبني للمجهول.
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: في كرمه
  rationale: «كرم» هو المقابل العربي الطبيعي للبستان المزروع بالكروم، والضمير يحفظ معنى الملكية.
- source_word: ἦλθεν ζητῶν
  choice: فجاء يطلب
  rationale: تحفظ الفعل الرئيس مع الفعل المصاحب الدال على البحث أو القصد، وهي صياغة عربية سلسة.
- source_word: καρπὸν
  choice: ثمرًا
  rationale: يحفظ المعنى الحرفي والرنين المجازي للكلمة، وجاء نكرة كما في الأصل.
- source_word: ἐν αὐτῇ
  choice: فيها
  rationale: يحافظ على صورة التعبير اليوناني، وهو استعمال عربي طبيعي في طلب الثمر في الشجرة.
- source_word: οὐχ εὗρεν
  choice: فلم يجد
  rationale: يفهم المفعول من «ثمرًا» المذكورة قبلها، والإضمار موجز وطبيعي في العربية.
theological_decisions:
- issue: دلالة الفاعل النكرة τις في المثل
  choice: لرجل
  alternative: لشخص ما
  rationale: يقدّم النص شخصية بشرية غير معيّنة بلا دلالة لاهوتية خاصة. «لرجل» أنسب للأسلوب القصصي العربي وتحفظ الإشارة المذكرة في السياق، مع إثبات البديل العام في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدم «كان يروي» لحفظ جانب الماضي الناقص، و«كرمه» للإيجاز والطبيعية، مع إبقاء العبارة غير المعيّنة بلا تحميل تفسيري.
