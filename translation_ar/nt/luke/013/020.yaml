  text: 'وقال مرة أخرى: «بماذا أشبّه ملكوت الله؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: حرف عطف يحفظ الصلة البسيطة بما قبله من غير إضافة دلالة زمنية غير مصرّح بها.
- source_word: πάλιν
  choice: أيضًا
  rationale: يفيد تكرار القول، و«أيضًا» طبيعية هنا في العربية وتربط هذا السؤال بما سبقه.
- source_word: εἶπεν
  choice: قال
  rationale: صيغة الماضي من λέγω تُستعمل في السرد لتقديم الكلام المباشر، و«قال» هي المقابل العربي المألوف والدقيق.
- source_word: Τίνι
  choice: بماذا
  rationale: اسم استفهام مفرد محايد في حالة المجرور، يسأل هنا عن وجه أو موضوع المقارنة لا عن شخص.
- source_word: ὁμοιώσω
  choice: أشبّه
  rationale: يحفظ معنى ὁμοιόω وصيغة المتكلم، ويؤدي في السؤال العربي معنى التشاور البلاغي الذي تحمله صيغة المستقبل اليونانية من غير تكلّف.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير كتابي عربي راسخ يحفظ اتساع βασιλεία ليشمل سلطان الله وملكه، من غير قصره على فعل الحكم وحده.
theological_decisions:
- issue: ترجمة βασιλεία في قول يتناول سلطان الله
  choice: ملكوت الله
  alternative: حُكم الله
  rationale: «ملكوت الله» يحفظ التعبير الكتابي المألوف والمدى الدلالي الذي قد يشمل سلطان الله ومجال ملكه، بينما «حُكم الله» قد يضيّق المعنى إلى ممارسة الحكم وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على بنية السؤال البلاغي وعبارة «ملكوت الله» المألوفة كتابيًا.
