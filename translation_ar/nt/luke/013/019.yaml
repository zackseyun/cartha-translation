  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: ar
  text: هي مثل حبّة خردل أخذها رجل وألقاها في بستانه، فنمت وصارت شجرة، وعشّشت طيور السماء في أغصانها.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: هي مثل
  rationale: صيغة عربية طبيعية موجزة تحفظ أسلوب التشبيه، والضمير المؤنث يعود إلى ملكوت الله المذكور في السياق السابق.
- source_word: κόκκῳ σινάπεως
  choice: حبّة خردل
  rationale: تعبير عربي مألوف ودقيق؛ ويمكن أن تدل κόκκος على الحبّة أو البذرة.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: أخذها رجل
  rationale: يحفظ صورة الرجل المفرد في اليونانية وترتيب الفعل بصورة عربية سليمة.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: ألقاها في بستانه
  rationale: «ألقى» يحفظ حيوية βάλλω من غير تحويله تفسيريًا إلى «زرع»، و«بستان» ملائم لـ κῆπος.
- source_word: ηὔξησεν
  choice: فنمت
  rationale: ينقل معنى النمو اللازم بعبارة عربية طبيعية، مع الفاء لبيان تتابع الحدث.
- source_word: ἐγένετο εἰς δένδρον
  choice: وصارت شجرة
  rationale: يحفظ لفظ «شجرة» وصورة النمو المتضخمة في المثل بلا تخفيف نباتي تفسيري.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: طيور السماء
  rationale: ترجمة مباشرة وطبيعية للمعنى المكاني هنا، من غير تحميل «السماء» دلالة لاهوتية خاصة.
- source_word: κατεσκήνωσεν
  choice: عشّشت
  rationale: في سياق الطيور والأغصان، ينقل الفعل بوضوح معنى الاستقرار واتخاذ موضع للعش.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: في أغصانها
  rationale: «أغصان» مقابل طبيعي لـ κλάδοις، والضمير المؤنث يعود إلى «شجرة» في العربية.
theological_decisions:
- issue: مرجع الضمير في ὁμοία ἐστὶν
  choice: هي مثل
  alternative: إنه مثل
  rationale: الصفة اليونانية مؤنثة لأن مرجعها «ملكوت الله» في الآية السابقة، وهو مؤنث نحويًا في اليونانية؛ وفي العربية «المملكة/الملكوت» يمكن الإحالة إليه بحسب الصياغة السياقية. اختير المؤنث اتساقًا مع بنية التشبيه الأصلية والسياق.
- issue: تصوير δένδρον في مثل حبّة الخردل
  choice: شجرة
  alternative: شجيرة أو نبتة كبيرة
  rationale: النص اليوناني يقول صراحة δένδρον، ولذلك تُحفظ صورة «الشجرة» وما فيها من تضخيم مقصود بدل تصحيحها نباتيًا.
- issue: جنس شخصية ἄνθρωπος
  choice: رجل
  alternative: شخص
  rationale: السياق يقدم فردًا مذكرًا في المثل، و«رجل» يحفظ ذلك بلا تعميم أو تحييد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على إيقاع المثل المتتابع، وعلى الألفاظ التصويرية «ألقاها»، «شجرة»، و«عشّشت»، من غير إضافة تفسير غير موجود في الأصل.
