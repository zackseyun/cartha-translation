  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: ar
  text: «اجتهدوا أن تدخلوا من الباب الضيق[a]، لأن كثيرين، أقول لكم، سيطلبون أن يدخلوا ولن يقدروا.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من البوابة الضيقة». والكلمة اليونانية في لوقا هي «باب» (θύρα)، في حين أن النص الموازي في متى يستعمل كلمة «بوابة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: اجتهدوا
  rationale: فعل أمر حاضر يدل على بذل جهد جاد ومثابر. «اجتهدوا» طبيعي في العربية الفصحى ويحفظ قوة الأمر من غير أن يضيف تفسيرًا عقديًا.
- source_word: εἰσελθεῖν
  choice: أن تدخلوا
  rationale: ترجمة مباشرة وطبيعية للمصدر، وقد حوفظ عليها في موضعي الفعل في الآية.
- source_word: διὰ τῆς στενῆς θύρας
  choice: من الباب الضيق
  rationale: θύρα تعني في الأصل «باب»، وστενῆς تصفه بالضيق. واستعمال «من» مع الدخول هو التعبير العربي الطبيعي لعبور الباب، مع إثبات البديل «عبر» في الحاشية.
- source_word: ὅτι
  choice: لأن
  rationale: تُظهر بوضوح أن الجملة التالية تعليل للأمر السابق.
- source_word: πολλοί
  choice: كثيرين
  rationale: الصفة مستعملة استعمال الاسم، وترجمتها العربية المباشرة هنا «كثيرين».
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: يحفظ صيغة الخطاب اليونانية حفظًا مباشرًا ودقيقًا، وهو تعبير فصيح واضح.
- source_word: ζητήσουσιν
  choice: سيطلبون
  rationale: يحفظ المعنى الأساسي للفعل ζητέω، أي الطلب أو السعي، ويصون الفرق اللفظي بينه وبين الأمر Ἀγωνίζεσθε بدل تسوية الفعلين بمعنى «يحاول».
- source_word: οὐκ ἰσχύσουσιν
  choice: لن يقدروا
  rationale: يؤدي معنى عدم امتلاك القدرة على إنجاز الدخول بعبارة عربية موجزة وطبيعية.
theological_decisions:
- issue: الجهد البشري ولغة الخلاص
  choice: الإبقاء على الأمر القوي «اجتهدوا» من دون تخفيفه أو شرحه عقديًا
  alternative: «ابذلوا كل جهد» أو «حاولوا»
  rationale: النص يأمر ببذل جهد جاد ويحذر من أن كثيرين سيطلبون الدخول ولا يقدرون. تحافظ الصياغة على هذا التوتر من غير حسم مسائل الاستحقاق أو الأعمال أو العلاقة بين المسؤولية البشرية والسيادة الإلهية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. اختير «اجتهدوا» لقوة الأمر، و«الباب» التزامًا بلفظ لوقا، مع تجنب استبداله بلفظ مأخوذ من النص الموازي في متى.
