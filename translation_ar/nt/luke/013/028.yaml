source:
  edition: SBLGNT
  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: ar
  text: هُنَاكَ يَكُونُ الْبُكَاءُ وَصَرِيرُ الأَسْنَانِ، حِينَ تَرَوْنَ إِبْرَاهِيمَ وَإِسْحَاقَ وَيَعْقُوبَ وَجَمِيعَ الأَنْبِيَاءِ فِي مَلَكُوتِ اللهِ، أَمَّا أَنْتُمْ فَمَطْرُودُونَ إِلَى الْخَارِجِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «وأنتم تُطرَدون إلى الخارج». تأتي العبارة اليونانية في صيغة اسم مفعول حاضر مبني للمجهول، وتؤكد الإقصاء القسري.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: هُنَاكَ
  rationale: ظرف مكان يشير إلى موضع الإقصاء والدينونة، و«هناك» ترجمة عربية مباشرة وطبيعية.
- source_word: ὁ κλαυθμὸς
  choice: الْبُكَاءُ
  rationale: ينقل معنى النحيب أو البكاء في صيغة الدينونة المألوفة من غير مبالغة تفسيرية.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: صَرِيرُ الأَسْنَانِ
  rationale: تعبير عربي كتابي واضح يحفظ صورة طحن الأسنان الدالة على الكرب أو الغيظ.
- source_word: ὅταν ὄψησθε
  choice: حِينَ تَرَوْنَ
  rationale: ينقل الحدث المستقبلي الذي يعرّف الظرف الذي يقع فيه البكاء وصرير الأسنان، بصياغة عربية طبيعية.
- source_word: πάντας τοὺς προφήτας
  choice: جَمِيعَ الأَنْبِيَاءِ
  rationale: يحفظ شمول πάντας وتحديد جماعة الأنبياء.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: فِي مَلَكُوتِ اللهِ
  rationale: يحفظ العبارة اللاهوتية المركزية بصيغتها العربية المألوفة والمباشرة.
- source_word: ὑμᾶς δὲ
  choice: أَمَّا أَنْتُمْ
  rationale: يبرز المقابلة التي تفيدها δέ ويعكس توكيد الضمير الصريح ὑμᾶς.
- source_word: ἐκβαλλομένους ἔξω
  choice: فَمَطْرُودُونَ إِلَى الْخَارِجِ
  rationale: يحفظ معنى الإقصاء القسري في الفعل المبني للمجهول، كما يحفظ دلالة ἔξω المكانية صراحة.
theological_decisions:
- issue: طبيعة صورة الدينونة
  choice: 'الإبقاء على صورتي الألم والإقصاء كما وردتا: البكاء وصرير الأسنان والطرد إلى الخارج.'
  alternative: تفسير الصورة بعبارات مثل «الحزن الشديد» أو «الهلاك الأبدي».
  rationale: تصف الآية الإقصاء من ملكوت الله وما يصاحبه من كرب، لكنها لا تفصّل هنا عقيدة الدينونة كاملة؛ لذلك تُحفظ الصورة دون تلطيف أو توسع مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أما أنتم» لإظهار المقابلة والتوكيد، و«مطرودون إلى الخارج» للمحافظة على قوة ἐκβάλλω وعلى ذكر ἔξω الصريح. وُضع الهامش عند العبارة التي يشرحها مباشرة.
