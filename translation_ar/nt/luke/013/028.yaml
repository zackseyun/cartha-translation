review_pass:
  verdict: approve
  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «هناك» لـἐκεῖ، و«البكاء وصرير الأسنان» للصيغة الثابتة، و«حين ترون» للظرف المستقبلي، والأسماء والألقاب، و«في ملكوت الله». كما أن «أما أنتم فمطرودون إلى الخارج» يحفظ المقابلة المؤكدة في ὑμᾶς δὲ وصورة الإقصاء القسري في ἐκβαλλομένους ἔξω دون توسع تفسيري.'
  naturalness: الصياغة فصيحة واضحة ومناسبة للسجل الكتابي المعاصر. «صرير الأسنان» و«ملكوت الله» تعبيران عربيان راسخان، و«مطرودون إلى الخارج» مفهوم ويحفظ التحديد المكاني الصريح في ἔξω، وإن كان أكثر رسمية من «مطرودون خارجًا».
  terminology: أسماء إبراهيم وإسحاق ويعقوب مضبوطة ومألوفة، و«الأنبياء» و«ملكوت الله» مصطلحان دقيقان ومتسقان. لا يفرض النص أي تفسير مذهبي لطبيعة الدينونة، بل يبقي على صورتي الكرب والإقصاء كما في الأصل.
