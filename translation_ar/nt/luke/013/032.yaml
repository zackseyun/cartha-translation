  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: ar
  text: 'وقال لهم: «اذهبوا وقولوا لذلك الثعلب: ها أنا أطرد الشياطين وأُجري أعمال شفاء اليوم وغدًا، وفي اليوم الثالث أُكمَّل[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أبلغ غايتي»، أو «أتم مسيرتي». يمكن أن يدل التعبير اليوناني على أن يُبلَغ المرء إلى التمام أو يُكمَّل، ويرجح أنه يشير إلى اكتمال رسالة يسوع المعيَّنة له.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι ταύτῃ
  choice: لذلك الثعلب
  rationale: يحافظ على صورة الثعلب وعلى اسم الإشارة ذي النبرة الازدرائية، من غير أن يفسر المجاز بإضافة وصف مثل «الماكر».
- source_word: Ἰδοὺ
  choice: ها أنا
  rationale: تعبير عربي طبيعي يلفت الانتباه إلى ما يفعله المتكلم، ويلائم مجيء الفعل بصيغة المتكلم بعد أداة التنبيه.
- source_word: ἐκβάλλω δαιμόνια
  choice: أطرد الشياطين
  rationale: ينقل بقوة ووضوح التعبير الإنجيلي عن إخراج الشياطين.
- source_word: ἰάσεις ἀποτελῶ
  choice: أُجري أعمال شفاء
  rationale: صياغة عربية طبيعية تحافظ على كون ἰάσεις اسمًا جمعيًا وعلى معنى إحداث الشفاء وإتمامه، من غير تسوية العبارة بالفعل السابق.
- source_word: σήμερον καὶ αὔριον
  choice: اليوم وغدًا
  rationale: يحافظ على اللفظ الزمني المباشر وعلى إمكان استعماله للدلالة على مدة قصيرة محددة.
- source_word: τῇ τρίτῃ
  choice: في اليوم الثالث
  rationale: يوضح الاستعمال الزمني للترتيبي المقدر معه لفظ «اليوم».
- source_word: τελειοῦμαι
  choice: أُبلَغ الكمال
  rationale: يحافظ على صيغة المبني للمجهول وعلى معنى بلوغ الغاية أو الإتمام، ويتجنب قصر العبارة صراحة على الموت أو القيامة أو مجرد انتهاء العمل.
theological_decisions:
- issue: دلالة τελειοῦμαι وصلتها بإتمام رسالة يسوع، مع احتمال الإيماء إلى موته وقيامته
  choice: أُبلَغ الكمال
  alternative: أبلغ غايتي؛ أُكمَّل؛ أتم مسيرتي
  rationale: النص اليوناني يحتمل الإتمام وبلوغ الغاية، وقد يشير إلى اكتمال رسالة يسوع، لكنه لا يصرح هنا بالقيامة أو التمجيد. لذلك تُحفظ صيغة المبني للمجهول والتوتر الدلالي دون حسمه بتفسير عقائدي أضيق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «ها أنا» بدل الصيغة الأقدم «هوذا»، وحُفظ المجاز الحرفي في «الثعلب» والغموض المقصود في العبارة الختامية.
