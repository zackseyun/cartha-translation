  terminology: «الشياطين» و«الثعلب» و«أعمال شفاء» مناسبة للسجل الإنجيلي العربي. لا يلزم تفسير «الثعلب» بإضافة «الماكر»، ولا يلزم تعيين الإتمام بأنه موت أو قيامة.
