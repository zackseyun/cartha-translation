  source_fidelity: 'الترجمة تنقل عناصر النص اليوناني الأساسية بأمانة: الأمر بالذهاب والإبلاغ، وصورة «ذلك الثعلب»، وإخراج الشياطين، وأعمال الشفاء، والتتابع الزمني، وصيغة المبني للمجهول في τελειοῦμαι. لكن «أُبلَغ الكمال» ليست صياغة عربية سليمة أو واضحة بما يكفي لتمثيل الفعل اليوناني.'
