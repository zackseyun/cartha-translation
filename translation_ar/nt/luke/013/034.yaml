id: LUK.13.34
reference: Luke 13:34
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: ar
  text: يا أورشليم، يا أورشليم، يا قاتلةَ الأنبياء وراجمةَ المرسَلين إليها[a]! كم مرة أردتُ أن أجمع أولادك، كما تجمع الدجاجة فراخها تحت جناحيها[b]، ولم تريدوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يا من تقتلين الأنبياء وترجمين المرسَلين إليها». يستعمل اليوناني اسمي فاعل مضارعين يصوّران أورشليم بحسب معاملتها المعهودة للمرسَلين إليها.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «كما يجمع الطائر صغاره». قد تدل الكلمة اليونانية ὄρνις على الطائر بوجه عام، لكن صورة الأم التي تضم صغارها تحت جناحيها تجعل «الدجاجة» أرجح هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: يا أورشليم، يا أورشليم
  rationale: حُفظ تكرار اسم المدينة وما فيه من نداء مؤكد ونبرة رثاء، وأُدخل حرف النداء وفق الأسلوب العربي الطبيعي.
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: يا قاتلةَ الأنبياء وراجمةَ المرسَلين إليها
  rationale: صيغتا اسم الفاعل تحفظان الصورة الوصفية الحية في اسمي الفاعل اليونانيين المضارعين، وتعرضان هذا بوصفه سلوكًا مميزًا للمدينة.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: المرسَلين إليها
  rationale: يحفظ اسم المفعول معنى المبني للمجهول، وتؤدي «إليها» اتجاه الإرسال بوضوح.
- source_word: ποσάκις ἠθέλησα
  choice: كم مرة أردتُ
  rationale: تعبير عربي واضح يحفظ نبرة التحسر ودلالة الإرادة أو الرغبة في السياق.
- source_word: ἐπισυνάξαι τὰ τέκνα σου
  choice: أن أجمع أولادك
  rationale: «أجمع» تؤدي معنى الضم والجمع، و«أولادك» تبقي استعارة المدينة الأم من غير تضييق مرجعها.
- source_word: ὄρνις τὴν ἑαυτῆς νοσσιὰν
  choice: الدجاجة فراخها
  rationale: مع أن ὄρνις قد يدل على طائر عمومًا، فإن صورة الأم التي تضم صغارها تحت جناحيها تجعل «الدجاجة» التعبير الأوضح والأكثر طبيعية هنا؛ و«فراخها» تؤدي المعنى الجمعي لصغارها.
- source_word: ὑπὸ τὰς πτέρυγας
  choice: تحت جناحيها
  rationale: صيغة المثنى العربية طبيعية ودقيقة في تصوير الجناحين.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: ولم تريدوا
  rationale: يحفظ الفعل دلالة الإرادة نفسها ويصون التحول المهم من ضمير المفرد في «أولادك» إلى المخاطب الجمع في الفعل.
theological_decisions:
- issue: مرجع «أولادك» في خطاب أورشليم
  choice: أولادك
  alternative: سكانك أو شعبك
  rationale: يخاطب النص أورشليم مجازًا كمدينة أم، ولا يحدد على نحو صريح هل المقصود سكانها وحدهم أم الشعب الذي تمثله؛ لذلك حُفظت الاستعارة من غير حسم زائد.
- issue: المقابلة الإرادية بين ἠθέλησα وἠθελήσατε
  choice: أردتُ ... ولم تريدوا
  alternative: شئتُ ... ولم تشاؤوا؛ رغبتُ ... ولم ترغبوا
  rationale: يحفظ هذا الاختيار المقابلة الصريحة في الإرادة بين المتكلم والمخاطَبين من غير استنباط موقف عقدي أوسع مما تقوله الآية.
- issue: التحول من أورشليم المفردة إلى المخاطبين بالجمع
  choice: أولادك ... ولم تريدوا
  alternative: أولادك ... ولم تريدي
  rationale: اليونانية تنتقل من ضمير الملكية المفرد إلى فعل المخاطب الجمع؛ أبقت الترجمة هذا التوتر النحوي والدلالي بدل تسويته، إذ يبدو أن الرفض منسوب إلى الناس الذين تمثلهم المدينة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رثائية مهيبة. استُعمل النداء المتكرر وصيغة اسمي الفاعل للمحافظة على قوة الخطاب، مع الإبقاء على التحول المقصود من مخاطبة المدينة بالمفرد إلى مخاطبة أبنائها أو ممثليها بالجمع.
