  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: ar
  text: وكان يمرّ بالمدن والقرى، يعلّم وهو في طريقه نحو أورشليم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى أورشليم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  choice: كان يسير
  rationale: صيغة الماضي الناقص تدل على حركة مستمرة في سياق الرحلة، فعبارة «كان يسير» تنقل هذا الاستمرار بوضوح.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: في المدن والقرى
  rationale: تدل κατά مع صيغة النصب هنا على المرور التوزيعي عبر أماكن متعددة؛ وتحافظ «المدن والقرى» على التمييز بين التجمعات الأكبر والأصغر بصياغة عربية طبيعية.
- source_word: διδάσκων
  choice: يعلّم
  rationale: اسم الفاعل المضارع يصف نشاطًا مصاحبًا للسير، وتحافظ الصياغة على تزامن التعليم مع الرحلة.
- source_word: πορείαν ποιούμενος
  choice: وهو ماضٍ في طريقه
  rationale: ينقل التعبير الاصطلاحي الدال على مواصلة الرحلة بقصد واتجاه، من غير حرفية ثقيلة.
- source_word: εἰς Ἱεροσόλυμα
  choice: نحو أورشليم
  rationale: تنقل «نحو» اتجاه الرحلة المستمرة من غير أن توحي بأن الوصول وقع في هذه اللحظة؛ وتذكر الحاشية البديل المباشر الممكن للأداة εἰς.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الشائعة لاسم الموضع.
theological_decisions:
- issue: اتجاه رحلة يسوع إلى أورشليم
  choice: نحو أورشليم
  alternative: إلى أورشليم
  rationale: السياق يلخص تقدم الرحلة المستمر لا الوصول، ولذلك تحافظ «نحو» على الحركة السردية، مع إبقاء البديل المعجمي في الحاشية دون تحميل العبارة استنتاجًا عقائديًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت جملة حالية طبيعية لنقل اقتران التعليم بمواصلة الرحلة، وأُبقي اتجاه السير مفتوحًا للبديل المعجمي في الحاشية.
