source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: ar
  text: 'حين يقوم ربُّ البيت ويُغلق الباب[a]، وتبدؤون أنتم بالوقوف في الخارج وقرع الباب قائلين: «يا رب[b]، افتح لنا»، يجيبكم قائلًا: «لا أعرفكم، ولا أعرف من أين أنتم»[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أقرب إلى ترتيب اليونانية: «بعد أن يقوم رب البيت ويُغلق الباب».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تُفهم «يا رب» في سياق المثل أيضًا بمعنى «يا سيد».
    reason: alternative_reading
  - marker: c
    text: 'اليونانية أقرب حرفيًا إلى: «لا أعرفكم، من أين أنتم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: حين
  rationale: تُدخل العبارة جملة زمنية غير محددة بمعنى «حين/متى/بعد أن». و«حين» عربية طبيعية وتحافظ على الارتباط الزمني من غير أن تحوّله إلى توقيت محدد.
- source_word: ἐγερθῇ
  choice: يقوم
  rationale: المقصود قيام صاحب البيت من جلوس أو اتكاء، لا القيامة من الموت؛ و«يقوم» هو التعبير العربي المباشر والطبيعي.
- source_word: ὁ οἰκοδεσπότης
  choice: ربُّ البيت
  rationale: يدل اللفظ على صاحب السلطة في البيت أو سيده. و«رب البيت» تعبير عربي فصيح موجز يحفظ معنى السيادة المنزلية.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: يُغلق الباب
  rationale: الفعل يدل على إغلاق الباب بما يمنع الدخول. و«يغلق الباب» واضح وطبيعي، بينما يُفهم أثر الإقصاء من السياق.
- source_word: ἄρξησθε ἔξω ἑστάναι
  choice: تبدؤون أنتم بالوقوف في الخارج
  rationale: يحفظ «تبدؤون» دلالة الشروع، ويعبّر «بالوقوف في الخارج» عن حالة البقاء خارج الباب. وأُظهر الضمير للتوكيد والمقابلة مع رب البيت.
- source_word: κρούειν τὴν θύραν
  choice: قرع الباب
  rationale: «قرع الباب» المقابل العربي المألوف، ولا يبالغ في شدة الفعل كما قد يفعل «ضرب الباب».
- source_word: Κύριε
  choice: يا رب
  rationale: يحفظ المقابل التقليدي لـκύριος وإمكان صداه اللاهوتي في لوقا، مع بقاء معنى المخاطبة لسيد البيت ممكنًا في سياق المثل.
- source_word: ἄνοιξον ἡμῖν
  choice: افتح لنا
  rationale: ترجمة موجزة ومباشرة تحفظ صيغة الأمر ودلالة ضمير المتكلمين في المجرور اليوناني.
- source_word: ἀποκριθεὶς ἐρεῖ
  choice: يجيبكم قائلًا
  rationale: يحفظ كِلا عنصري التركيب اليوناني، أي الإجابة والقول، بصياغة عربية فصيحة غير متكلفة.
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: لا أعرفكم ولا من أين أنتم
  rationale: يحفظ المفعول الصريح «كم» ودلالة الأصل أو الانتماء في πόθεν ἐστέ. أُضيفت «ولا» للربط العربي الطبيعي، مع بيان الصيغة الحرفية في الحاشية.
theological_decisions:
- issue: دلالة κύριος في خطاب داخل مثل
  choice: يا رب
  alternative: يا سيد
  rationale: يمكن أن تكون الكلمة نداءً عاديًا لسيد البيت، لكنها تحمل أيضًا في إنجيل لوقا صدى لقب «الرب». يحفظ «يا رب» هذا التوتر من غير أن يحسم هوية رب البيت تفسيرًا.
- issue: قوة العبارة Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: لا أعرفكم ولا من أين أنتم
  alternative: لا أعرفكم، من أين أنتم
  rationale: أُبقيت المعرفة الشخصية للمخاطَبين ودلالة منشئهم معًا، لأن حذف «كم» قد يخفف قوة الرفض. والربط بـ«ولا» يجعل العبارة سليمة في العربية، بينما تُذكر البنية الأقرب إلى اليونانية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدم «رب البيت» استعمالًا عربيًا مألوفًا للسلطة المنزلية، وحُفظت صيغة «يا رب» مع التنبيه إلى احتمال «يا سيد». رُبطت العبارة الختامية بـ«ولا» لتجنب تركيب عربي متعثر، مع حفظ الصيغة الحرفية في الحاشية.
