  source_fidelity: 'المسودة تنقل تسلسل المثل ومعاني الألفاظ الأساسية بدقة جيدة: قيام ربّ البيت، إغلاق الباب، الوقوف خارجه وقرعه، ثم الجواب الرافض. لكن «لا أعرفكم ولا من أين أنتم» تجعل «ولا» تعطف جملةً ناقصة وقد تُفهم نفيًا لمعرفتين منفصلتين من دون إظهار الفعل الثاني، في حين أن اليونانية تجمع بين عدم معرفة الأشخاص وعدم معرفة منشئهم/هويتهم. الصياغة المراجعة تُظهر المعنيين بوضوح.'
