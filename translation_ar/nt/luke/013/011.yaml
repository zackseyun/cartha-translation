  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: ar
  text: وإذا بامرأةٍ بها روحُ ضعفٍ منذ ثماني عشرة سنة، وكانت منحنيةً لا تستطيع أن تنتصب تمامًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لا تستطيع أن ترفع نفسها على الإطلاق». وقد تفيد العبارة اليونانية إمّا أنها لم تكن تستطيع الانتصاب تمامًا، وإمّا أنها لم تكن تستطيع الانتصاب مطلقًا.'
    reason: حفظ احتمال دلالة εἰς τὸ παντελές بين معنى «تمامًا» ومعنى «على الإطلاق».
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا بـ
  rationale: تركيب عربي سردي طبيعي يلفت الانتباه إلى ظهور المرأة في المشهد من غير استعمال صيغة تراثية ثقيلة.
- source_word: γυνὴ
  choice: امرأةٍ
  rationale: نكرة في السياق لأنها تُقدَّم لأول مرة في المشهد.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: فيها روحُ ضعفٍ
  rationale: يحفظ ذكر «الروح» الصريح في اليونانية، ويبقي إضافة «الضعف» من غير حسم طبيعة الفاعلية الروحية أو تحويل العبارة إلى وصف طبي محض.
- source_word: ἔτη δεκαοκτώ
  choice: منذ ثماني عشرة سنة
  rationale: تعبير عربي واضح عن حالة استمرت مدة ثماني عشرة سنة حتى زمن الحدث.
- source_word: συγκύπτουσα
  choice: منحنيةً
  rationale: ينقل هيئة الانحناء الجسدي بعبارة عربية موجزة وطبيعية من غير المبالغة إلى معنى الانثناء التام.
- source_word: μὴ δυναμένη ἀνακύψαι
  choice: لا تستطيع أن تنتصب
  rationale: يفيد العجز عن رفع الجسد والعودة إلى هيئة مستقيمة.
- source_word: εἰς τὸ παντελές
  choice: تمامًا
  rationale: يحفظ دلالة التوكيد على عدم القدرة على الانتصاب الكامل.
theological_decisions:
- issue: هل تُعرض حالة المرأة بوصف طبي فقط أم يُحفظ ذكر الروح؟
  choice: فيها روحُ ضعفٍ
  alternative: مصابة بضعف؛ أو فيها روحٌ مُقعِدة
  rationale: النص اليوناني يذكر πνεῦμα صراحة، لذلك أُبقي «روح» في المتن. وفي الوقت نفسه لا تُسمّى الروح هنا شيطانًا صراحة ولا يُحسم نوع علاقتها بالمرض بما يتجاوز العبارة الأصلية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «وإذا بـ» بوصفه أداة سردية لافتة طبيعية، وحُفظ التركيب اللاهوتي الملتبس «روح ضعف» من غير تفسير زائد.
