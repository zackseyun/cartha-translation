  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: ar
  text: 'ها إنَّ بيتكم[b] يُترَك لكم[a]. وأقول لكم: لن تروني البتة حتى يأتي وقت تقولون فيه[d]: «مبارك الآتي باسم الرب»[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يُهجَر» أو «يُتخلّى عنه». وقد يحمل المبني للمجهول في اليونانية معنى قضائيًا، أي إن البيت يُسلَّم إلى مصيره.'
    reason: lexical_alternative
  - marker: b
    text: 'يرجح أن «بيتكم» يشير إلى أورشليم، ولا سيما هيكلها، لكن اليونانية تقول ببساطة: «بيتكم».'
    reason: alternative_reading
  - marker: c
    text: 'عبارة «مبارك الآتي باسم الرب» تردد صدى مزمور 118: 26.'
    reason: cross_reference
  - marker: d
    text: يفهم بعض المفسرين هذا الكلام على أنه يشير إلى دخول يسوع الظافر، ويفهمه آخرون على أنه اعتراف به في المستقبل. ولا تفرض اليونانية بذاتها توقيتًا واحدًا محددًا.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ها إنَّ
  rationale: أداة تنبيه عربية فصيحة ومعاصرة نسبيًا، تحفظ قوة الالتفات والإعلان الجاد من غير اللجوء إلى صياغة شديدة القِدم.
- source_word: ἀφίεται
  choice: يُترَك
  rationale: يحفظ المبني للمجهول والزمن الحاضر، ويبقي مجال المعنى بين مجرد الترك والتخلي القضائي دون حسم زائد.
- source_word: ὁ οἶκος ὑμῶν
  choice: بيتكم
  rationale: ترجمة مباشرة تحفظ اتساع اللفظ اليوناني، فلا تستبدله بالهيكل أو أورشليم في المتن.
- source_word: λέγω δὲ ὑμῖν
  choice: وأقول لكم
  rationale: الواو تنقل δέ هنا بوصفها انتقالًا واستمرارًا خفيفًا، من غير فرض مقابلة قوية.
- source_word: οὐ μὴ ἴδητέ με
  choice: لن تروني البتة
  rationale: يجمع بين النفي المستقبلي وقوة النفي المؤكد في οὐ μή، بصياغة عربية طبيعية.
- source_word: ἕως ἥξει ὅτε
  choice: حتى يأتي وقت
  rationale: صياغة عربية واضحة تؤدي التركيب الزمني اليوناني الذي يصعب نقله حرفيًا.
- source_word: εἴπητε
  choice: تقولون فيه
  rationale: يرتبط في العربية بوقت مستقبلي بعد «حتى»، ويحفظ الحدث المنتظر دون إثقال العبارة.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: مبارك الآتي
  rationale: يحفظ الصيغة الكتابية الموجزة وصدى المزمور، مع إبقاء اسم الفاعل معرفًا كما في اليونانية.
- source_word: ἐν ὀνόματι κυρίου
  choice: باسم الرب
  rationale: تعبير عربي كتابي طبيعي يؤدي معنى العمل أو المجيء في اسم الرب وسلطانه.
theological_decisions:
- issue: مرجع «بيتكم»
  choice: الإبقاء على «بيتكم» في المتن
  alternative: الهيكل، أو أورشليم، أو بيت إسرائيل
  rationale: السياق يرجح معنى جماعيًا مرتبطًا بأورشليم وهيكلها، لكن النص اليوناني يقول «بيتكم» فقط؛ لذلك لا يُضيَّق المرجع في المتن.
- issue: التوقيت المقصود بالإقرار الختامي
  choice: ترك العبارة شرطًا مستقبليًا غير محدد التوقيت
  alternative: الدخول الظافر، أو اعتراف مستقبلي من أورشليم/إسرائيل، أو إقرار أخروي عند مجيء يسوع
  rationale: الصياغة اليونانية لا تلزم وحدها بأحد هذه التحديدات، فحُفظ التوتر التفسيري في النص ونُبّه إليه في الحاشية.
- issue: قوة ἀφίεται
  choice: يُترَك
  alternative: يُهجَر أو يُتخلّى عنه
  rationale: «يُترَك» تحفظ المبني للمجهول والغموض بين الترك والإهمال والحكم بالتخلية، بينما البدائل أشد تفسيرًا.
translation_notes:
  register: عربية فصحى واضحة ومهيبة. استُخدمت «ها إنَّ» للتنبيه، و«لن... البتة» لإظهار النفي المؤكد. حُفظت «بيتكم» و«الآتي» لإبقاء الصدى الكتابي والغموض المقصودين. وُضعت علامات الحواشي المتعلقة بعبارة القول قبل الاقتباس، مع علامة الإحالة إلى المزمور بعد الاقتباس أيضًا لتوضيح موضعها.
