base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: ar
  text: هي مثل خميرةٍ[a] أخذتها امرأة وأخفتها[b] في ثلاثة أكيال[c] من الدقيق، حتى اختمر كله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «عامل تخمير» أو «خمير». وتشير الكلمة اليونانية إلى مادة تُستعمل لتخمير العجين، لا يلزم أن تكون الخميرة التجارية الحديثة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن، بحسب المعنى العملي في هذا السياق: «مزجتها». لكن الفعل اليوناني يعني حرفيًا «أخفتها» أو «سترَتها».'
    reason: lexical_alternative
  - marker: c
    text: 'اليونانية: «ثلاثة ساتا»، وهي كمية كبيرة من الدقيق. والساتا مكيال جاف قديم، يقارب السَّأَة العبرية.'
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοία
  choice: مثل
  rationale: خبر يفيد التشبيه في المثل؛ وصيغة «هي مثل» عربية واضحة وتحافظ على الإيجاز اليوناني، مع عودة الضمير إلى ملكوت الله من السياق السابق.
- source_word: ζύμῃ
  choice: خميرة
  rationale: تدل على عامل التخمير المستعمل في العجين، وهي اللفظة الحديثة الطبيعية، من غير أن تُدخل في النص حكمًا رمزيًا إيجابيًا أو سلبيًا.
- source_word: λαβοῦσα γυνὴ
  choice: أخذتها امرأة
  rationale: يُنقل اسم الفاعل الماضي اليوناني بتتابع فعلي طبيعي في العربية، وتبقى «امرأة» نكرة كما يقتضي سياق المثل.
- source_word: ἔκρυψεν
  choice: أخفتها
  rationale: يحافظ على الدلالة الحرفية للفعل، أي أخفى أو ستر، بدل تفسير الصورة مباشرةً بمعنى الخلط.
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: في ثلاثة أكيال من الدقيق
  rationale: «أكيال» تنقل كون الساتا وحدات قياس جافة بصياغة مفهومة، مع بيان الاسم والمقدار التقريبي في الحاشية.
- source_word: ἕως οὗ
  choice: حتى
  rationale: أداة زمنية طبيعية وموجزة في العربية.
- source_word: ἐζυμώθη ὅλον
  choice: اختمر كله
  rationale: ينقل المبني للمجهول اليوناني بصيغة المطاوعة العربية الطبيعية، ويحفظ معنى شمول التخمير للكمية كلها.
theological_decisions:
- issue: الدلالة الرمزية للخميرة في المثل
  choice: إبقاء صورة الخميرة محايدة من غير تفسير لاهوتي مضاف
  alternative: تفسير الخميرة في الترجمة بوصفها رمزًا إيجابيًا لانتشار الملكوت أو رمزًا سلبيًا للفساد
  rationale: النص نفسه يقدّم تشبيهًا ولا يصرّح بتقويم رمزي مستقل للخميرة؛ لذلك ينبغي للترجمة أن تحفظ الصورة والتوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة بلا تكلّف. اختيرت «خميرة» لشيوعها المعاصر، و«أخفتها» لصون الصورة الأصلية، مع حواشٍ تشرح البدائل ووحدة القياس القديمة.
