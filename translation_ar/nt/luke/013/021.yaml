  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: التشبيه، والخميرة، والمرأة، وفعل الإخفاء، وثلاثة المقاييس، وبلوغ التخمير الكمية كلها. وصيغة «اختمر كله» طبيعية وتنقل نتيجة المبني للمجهول اليوناني دون تحميل الصورة تفسيرًا إضافيًا.'
