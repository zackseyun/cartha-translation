  terminology: «خميرة» مناسبة لـ ζύμῃ، و«أكيال» مناسبة ومفهومة للمكيال القديم مع إبقاء الاسم التقني في الحاشية. لكن الحاشية (أ) تورد «عجين مخمَّر» بديلًا لـ«خميرة»، وهذا ليس بديلًا معجميًا دقيقًا؛ كما أن تسمية السَّأَة العبرية في الحاشية (ج) تحتاج تصحيحًا.
