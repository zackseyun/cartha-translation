  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: ar
  text: وها إنَّ هناك آخِرين سيكونون أوَّلين، وإنَّ هناك أوَّلين سيكونون آخِرين.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يوجد آخِرون سيكونون أوَّلين، ويوجد أوَّلون سيكونون آخِرين».'
    reason: بيان الصياغة الوجودية المباشرة في النص اليوناني مع المحافظة على سلاسة المتن العربي.
lexical_decisions:
- source_word: ἰδοὺ
  choice: وها إنَّ
  rationale: صيغة عربية فصيحة وواضحة تسترعي الانتباه إلى القول من غير استعمال تعبير غامض أو شديد القِدم.
- source_word: ἔσχατοι
  choice: الآخِرين
  rationale: تحافظ على معنى الموقع الأخير أو المرتبة المتأخرة، وعلى التضاد الموجز مع «الأوَّلين»، من غير تحويل المعنى إلى حكم أخلاقي مثل «الأدنى».
- source_word: πρῶτοι
  choice: الأوَّلين
  rationale: المقابل المباشر والطبيعي لـ«الآخِرين» في هذا القول القائم على انقلاب المراتب.
- source_word: εἰσὶν
  choice: مِنَ ... مَن
  rationale: تركيب وجودي عربي طبيعي ينقل معنى «يوجد من بين...» ويحافظ على عمومية الفئتين دون إثقال العبارة بترجمة حرفية جامدة.
- source_word: οἳ ἔσονται
  choice: مَن سيكونون
  rationale: ينقل جملة الصلة والفعل المستقبل بوضوح، مع مراعاة المعنى الجمعي للموصول في السياق.
- source_word: καὶ
  choice: وَ
  rationale: حُفظ حرف العطف لإبقاء التوازي المتوازن بين شطري القول.
theological_decisions:
- issue: نطاق انقلاب المراتب في القول
  choice: صياغته مبدأً عامًا عن صيرورة الآخِرين أوَّلين والأوَّلين آخِرين
  alternative: تخصيصه باليهود والأمم، أو بالتواضع والكبرياء، أو بمراتب الدينونة الأخيرة
  rationale: سياق الملكوت يسمح بأكثر من وجه تطبيقي، لكن النص اليوناني نفسه موجز وعام؛ لذلك لا تُدرج في الترجمة فئة تفسيرية بعينها.
translation_notes:
  register: عربية فصحى معاصرة ذات نبرة وقورة ومباشرة. حُفظ الإيقاع المتوازي والتضاد بين «الآخِرين» و«الأوَّلين»، مع تجنب تفسير نوع الانقلاب داخل المتن.
