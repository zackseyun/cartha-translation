  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: ar
  text: فإن أثمرت في المستقبل[a]، فذلك حسن؛ وإن لم تثمر، تقطعها».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في السنة المقبلة». فالعبارة اليونانية هنا تعني حرفيًا «في المستقبل» أو «في الزمن الآتي»، وإن كانت بعض الترجمات تحدد المدة اعتمادًا على الآية السابقة.'
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: فإن
  rationale: تنقل أداة الشرط مع الصلة بما قبلها، وتمهّد طبيعيًا للمقابلة مع «وإن لم».
- source_word: ποιήσῃ καρπὸν
  choice: أثمرت
  rationale: الفعل ποιέω مع καρπός تعبير زراعي معناه إنتاج الثمر؛ و«أثمرت» أفصح وأطبع في العربية وتحفظ الصورة الزراعية.
- source_word: εἰς τὸ μέλλον
  choice: في المستقبل
  rationale: يحافظ على الدلالة الزمنية العامة للعبارة اليونانية من غير تخصيصها صراحة بالسنة المقبلة.
- source_word: εἰ δὲ μήγε
  choice: وإن لم تثمر
  rationale: يُظهر المقابلة ويصرّح بالفعل المفهوم من السياق، بما يلائم العربية الواضحة من غير إضافة معنى جديد.
- source_word: ἐκκόψεις αὐτήν
  choice: تقطعها
  rationale: ينقل صيغة المستقبل اليونانية بوصفها نتيجة لاحقة للشرط، ويحفظ صورة قطع شجرة التين؛ وضمير المؤنث طبيعي لأن «الشجرة» و«التينة» مؤنثتان في السياق.
theological_decisions:
- issue: المدلول الزمني لإمهال الشجرة قبل الحكم عليها
  choice: 'الإبقاء على الزمن عامًا: «في المستقبل»'
  alternative: «في السنة المقبلة» أو «في العام الآتي»
  rationale: نص هذه الآية لا يذكر «السنة المقبلة» صراحة، بل يستعمل εἰς τὸ μέλλον، أي ما يتصل بالزمن الآتي. لذلك لا يُستورد التحديد الزمني من الآية السابقة إلى المتن.
- issue: المحذوف بعد الشرط الأول
  choice: «فحسن» بوصفها تتمة عربية موجزة تفيد قبول النتيجة
  alternative: 'ترك العبارة معلّقة حرفيًا: «فإن أثمرت في المستقبل— وإن لم...»'
  rationale: التركيب اليوناني يترك جواب الشرط الأول محذوفًا ومفهومًا، وتحتاج العربية الطبيعية إلى إظهار دلالته المضمرة. «فحسن» لا تحدد نتيجة لاهوتية إضافية، بل تحفظ الانقطاع والتوتر الشرطي في المثل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على الصورة الزراعية وعلى التعليق الشرطي في الأصل. وُضعت علامة الحاشية بعد الشرط السلبي لتوافق موضعها في طبقة المراجعة الإنجليزية، مع أن الحاشية تشرح العبارة الزمنية السابقة.
