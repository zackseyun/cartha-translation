reference: Luke 13:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: ar
  text: 'فأجاب رئيسُ المجمع، وهو ساخط لأن يسوع شفى في يوم السبت، وقال للجمع: «هناك ستة أيام ينبغي فيها العمل؛ فتعالوا في تلك الأيام وتلقَّوا الشفاء، لا في يوم السبت».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا صياغة كلامه بأسلوب أكثر تداولًا: «هناك ستة أيام يُعمَل فيها؛ فتعالوا في تلك الأيام وتلقَّوا الشفاء، لا في يوم السبت».'
    reason: بديل أسلوبي يحافظ على معنى الوجوب في δεῖ وعلى كون θεραπεύεσθε تلقيًا للشفاء.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: فأجاب
  rationale: تفيد δέ انتقالًا ذا مسحة تقابل مع حادثة الشفاء السابقة، وتؤدي الفاء هذا الانتقال طبيعيًا في العربية، بينما يحافظ «أجاب» على الوظيفة الخطابية للاسم الفاعل اليوناني.
- source_word: ἀρχισυνάγωγος
  choice: رئيس المجمع
  rationale: يدل اللفظ على المسؤول عن شؤون المجمع اليهودي؛ و«رئيس المجمع» تعبير عربي واضح وشائع لا يوحي بسلطة مدنية.
- source_word: ἀγανακτῶν
  choice: وهو ساخط
  rationale: ينقل الاستياء الشديد ذا الطابع الاعتراضي، مع الحفاظ على تزامنه مع كلام رئيس المجمع.
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: لأن يسوع شفى في السبت
  rationale: ὅτι سببية هنا، والفعل الماضي العربي يؤدي الحدث السابق الذي أثار سخطه دون حاجة إلى تركيب ماضٍ مركب.
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: وقال للجموع
  rationale: الماضي البسيط طبيعي في سرد القول بالعربية، ويمكنه في السياق نقل الفعل الناقص اليوناني دون فرض معنى التكرار. واختيار «الجموع» يلائم الجماعة الحاضرة التي كان يخاطبها على نحو عام.
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: هناك ستة أيام ينبغي فيها العمل
  rationale: يحافظ على بنية العبارة وقوة الإلزام في δεῖ، مع صياغة عربية طبيعية غير متكلفة.
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: فتعالوا في هذه الأيام واستشفوا
  rationale: الفاء تنقل الاستنتاج في οὖν، و«استشفوا» هنا طلب لتلقي الشفاء، وهو أدق من صيغة قد توحي بأن المخاطَبين يشفون أنفسهم أو الآخرين.
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: لا في يوم السبت
  rationale: صياغة موجزة تحفظ المقابلة بين الأيام الستة ويوم السبت من غير زيادة تفسيرية.
theological_decisions:
- issue: هل تُصاغ مقولة رئيس المجمع باعتبارها حكمًا إلهيًا أم اعتراضًا بشريًا؟
  choice: 'نقل كلامه مباشرة: «هناك ستة أيام ينبغي فيها العمل؛ فتعالوا في هذه الأيام واستشفوا»'
  alternative: إعادة صياغة كلامه بما يصرّح بنفاقه أو يبطل اعتراضه داخل الآية
  rationale: النص يعرض اعتراض رئيس المجمع ولا يقرره حكمًا إلهيًا. إبقاء كلامه بصيغته يحفظ التوتر السردي ويترك تقويمه للسياق اللاحق دون إدخال تعليق مذهبي.
- issue: دلالة θεραπεύεσθε في الأمر
  choice: استشفوا
  alternative: اشفوا أنفسكم أو اطلبوا العلاج
  rationale: الصيغة يمكن أن تُفهم بمعنى تلقي الشفاء في هذا السياق. «استشفوا» تحفظ هذا المعنى ولا تنسب قدرة الشفاء إلى المرضى أنفسهم.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «المجمع» للمجمع اليهودي و«السبت» للمصطلح الديني المعروف. وُضعت علامة الحاشية [a] في المتن، مع تجنب التفسير الطائفي أو تخفيف حدة اعتراض المتكلم.
