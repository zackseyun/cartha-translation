source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: ar
  text: أما هذه، وهي ابنة إبراهيم، التي ربطها الشيطان، وها هي مربوطة منذ ثماني عشرة سنة، أفما كان ينبغي أن تُحَلَّ من هذا الرباط في يوم السبت؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: ابنة إبراهيم
  rationale: نقل حرفي طبيعي يحفظ دلالة الانتماء إلى شعب العهد والكرامة التي يؤكدها يسوع.
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: ربطها / تُحَلَّ / الرباط
  rationale: يحافظ على صورة الربط والحل المتكررة في اليونانية وعلى الترابط اللفظي في الآية.
- source_word: ἰδοὺ
  choice: محذوفة لفظًا وممثلة بنبرة الجملة الاعتراضية
  rationale: تفيد لفت الانتباه إلى طول المدة؛ وإقحام «ها» أو «انظروا» هنا أقل سلاسة في العربية، بينما تؤدي الشرطة الاعتراضية والنبرة وظيفة التنبيه.
- source_word: οὐκ ἔδει
  choice: أفما كان ينبغي
  rationale: ينقل السؤال الإنكاري الذي يتوقع جوابًا بالإيجاب، مع إبقاء معنى الالتزام أو الملاءمة الضرورية.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: في يوم السبت
  rationale: صياغة عربية واضحة ومباشرة للمحدد الزمني.
theological_decisions:
- issue: نسبة مرض المرأة إلى عمل الشيطان
  choice: وقد ربطها الشيطان
  alternative: التي كان الشيطان قد قيّدها
  rationale: تُبقي النسبة الصريحة إلى الشيطان كما في النص من غير تفسير طبي أو عقدي زائد.
- issue: هوية المرأة بوصفها ابنة إبراهيم
  choice: وهي ابنة إبراهيم
  alternative: لأنها من نسل إبراهيم
  rationale: يحفظ الاستعارة وصيغتها الشخصية، ولا يحصر معناها مسبقًا في النسب الجسدي وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدمت «أما هذه» لمقابلة التقديم التوكيدي في ταύτην δὲ، وحُفظت استعارة الربط والحل. لا توجد حواشٍ، ولذلك لا توجد علامات حواشٍ في المتن.
