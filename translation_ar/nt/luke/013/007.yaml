  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: ar
  text: 'ثم قال للكرّام: «انظر، منذ ثلاث سنوات وأنا آتي أطلب ثمرًا من شجرة التين هذه ولا أجد. اقطعها. فلماذا تجعل الأرض غير منتجة أيضًا؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلماذا تشغل الأرض أيضًا بلا جدوى؟» قد يدل الفعل اليوناني على جعل الأرض غير منتجة أو عديمة النفع، لا على مجرد شغل حيزٍ منها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: الكرّام
  rationale: يدل اللفظ على العامل الذي يفلح الكرم ويعتني به؛ و«الكرّام» تعبير عربي موجز يحفظ مشهد الكرم.
- source_word: Ἰδοὺ
  choice: ها أنا
  rationale: في التركيب «Ἰδοὺ ... ἔρχομαι» تلفت العبارة الانتباه إلى استمرار مجيء المتكلم، و«ها أنا» طبيعية في العربية.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: منذ ثلاث سنوات
  rationale: تنقل مدة ممتدة من الماضي إلى وقت الكلام بوضوح.
- source_word: ἔρχομαι ζητῶν
  choice: آتي طالبًا
  rationale: يحفظ الفعل الحاضر مع اسم الفاعل، ويتيح للسياق الزمني الدلالة على تكرر المجيء.
- source_word: καρπὸν ἐν τῇ συκῇ ταύτῃ
  choice: ثمرًا في شجرة التين هذه
  rationale: صياغة زراعية مباشرة تحافظ على الصورة المثلية دون تفسيرها لاهوتيًا.
- source_word: οὐχ εὑρίσκω
  choice: ولا أجد
  rationale: ينقل المضارع اليوناني مباشرة، مع فهم المفعول المحذوف من «ثمرًا» السابق.
- source_word: ἔκκοψον αὐτήν
  choice: اقطعها
  rationale: أمر مباشر بقطع الشجرة؛ والضمير واضح المرجع في العربية.
- source_word: καὶ τὴν γῆν καταργεῖ
  choice: تُعطِّل الأرض أيضًا
  rationale: يحفظ المعنى الأقوى المحتمل للفعل، أي جعل الأرض عديمة النفع أو غير منتجة، كما يحفظ «أيضًا» قيمة καί الإضافية.
theological_decisions:
- issue: الصورة المثلية أم التفسير الصريح
  choice: الإبقاء على الألفاظ الزراعية كما هي
  alternative: إدخال معنى روحي صريح عن انعدام الثمر
  rationale: النص يقدّم مثلًا، فلا ينبغي أن تدمج الترجمة تفسيره اللاهوتي في ألفاظ الآية.
- issue: دلالة καταργεῖ
  choice: تُعطِّل الأرض
  alternative: تشغل الأرض بلا جدوى
  rationale: اللفظ اليوناني قد يعني جعل الأرض غير نافعة، لا مجرد شغل حيز منها؛ أُبقي البديل السياقي في الحاشية لصون سعة الدلالة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «الكرّام» للدقة والإيجاز، وحُفظت الصورة الزراعية والغموض المعجمي في السؤال الختامي دون فرض تفسير طائفي.
