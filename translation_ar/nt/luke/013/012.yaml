  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: ar
  text: 'ولمّا رآها يسوع، ناداها وقال لها: «يا امرأة، لقد تحررتِ من ضعفك».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لقد تحررتِ من علتك».'
    reason: بديل معجمي لـ«ضعفك»؛ إذ يمكن أن تدل ἀσθένεια في هذا السياق على علة أو وهن جسدي.
lexical_decisions:
- source_word: ἰδὼν δὲ αὐτὴν
  choice: ولمّا رآها
  rationale: صيغ اسم الفاعل الماضي هنا طبيعيًا بوصفه جملة زمنية، وأُديت δέ بواو الاستئناف الملائمة للسرد العربي من غير تضخيم معنى المقابلة.
- source_word: προσεφώνησεν
  choice: ناداها
  rationale: يفيد الفعل توجيه النداء أو الخطاب إلى شخص، و«ناداها» تعبير عربي واضح يحفظ مبادرة يسوع إليها من غير الجزم بأنها اقتربت إليه.
- source_word: Γύναι
  choice: يا امرأة
  rationale: نداء مباشر ومحترم في سياقه، وهو أقرب مقابل عربي من دون إضافة معنى المودة أو اللقب الاجتماعي.
- source_word: ἀπολέλυσαι
  choice: قد أُطلِقتِ
  rationale: يحفظ البناء للمجهول ودلالة صيغة التام على فعل منجز ذي نتيجة قائمة؛ وتساعد «قد» على إبراز الإنجاز.
- source_word: τῆς ἀσθενείας σου
  choice: من ضعفك
  rationale: «الضعف» يحفظ السعة الدلالية لـἀσθένεια، مع أن السياق يدل على علة جسدية، ولا يفرض تشخيصًا طبيًا أضيق.
theological_decisions:
- issue: طبيعة حالة المرأة في لفظ ἀσθένεια
  choice: ضعفك
  alternative: مرضك / علتك / عجزك
  rationale: اختير اللفظ الأوسع المطابق للأصل كي لا تُختزل الحالة في تشخيص طبي حديث أو معنى أضيق مما يصرح به النص.
- issue: قوة ἀπολέλυσαι الزمنية والمبني للمجهول
  choice: قد أُطلِقتِ
  alternative: أنتِ طليقة / تحررتِ
  rationale: يحفظ الاختيار كون الفعل مبنيًا للمجهول وكون التحرير قد تم وله أثر حاضر، من غير تعيين الفاعل نحويًا داخل القول.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «ولمّا» للسرد الزمني، و«ناداها» بدل صياغة توحي حتمًا بأنها دُعيت إلى الاقتراب. وُضعت علامة الحاشية بعد الاقتباس لأنها تتعلق بصياغة القول كله.
