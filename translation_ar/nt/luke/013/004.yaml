  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: ar
  text: أو أولئك الثمانية عشر الذين سقط عليهم البرج في سلوام وقتلهم، أتظنون أنهم كانوا أشدَّ ذنبًا من جميع الساكنين في أورشليم؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «مدينين أكثر من جميع الساكنين في أورشليم»؛ و«مدينين» تُستعمل هنا على الأرجح بمعنى التبعة الأخلاقية، ويمكن أن تُفهم: «أشد ذنبًا» أو «أسوأ جرمًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: أو
  rationale: تقدّم مثالًا بديلًا ضمن الحجة المتواصلة، وتحافظ على التدفق البلاغي البسيط.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: أولئك الثمانية عشر
  rationale: ينقل تركيب اسم الإشارة والعدد من دون إضافة «رجلًا»، وهي غير مصرّح بها في اليونانية.
- source_word: ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ
  choice: سقط عليهم البرج في سلوام
  rationale: صياغة عربية مباشرة تحفظ فعل «سقط» واسم المكان، من غير تفسيره بلفظ «انهار».
- source_word: ἀπέκτεινεν αὐτούς
  choice: وقتلهم
  rationale: ينقل نتيجة سقوط البرج بعبارة طبيعية واضحة، من غير إيحاء بإعدام قضائي.
- source_word: δοκεῖτε ὅτι
  choice: أتظنون أنهم
  rationale: يحفظ صيغة السؤال المباشر وتحدّي المخاطبين.
- source_word: ὀφειλέται
  choice: مذنبين
  rationale: المعنى الحرفي هو «مدينين»، لكنه هنا يدل على التبعة أو المديونية الأخلاقية؛ «مذنبين» واضحة في العربية مع إبقاء الحرفي في الحاشية.
- source_word: ἐγένοντο
  choice: صاروا
  rationale: يحفظ الدلالة الفعلية لـγίνομαι بدل تسويتها إلى مجرد «كانوا».
- source_word: παρὰ πάντας τοὺς ἀνθρώπους
  choice: أكثر من جميع
  rationale: ينقل قوة المقارنة في παρά مع النصب عربيًا؛ ويتصل «أكثر» بـ«مذنبين» اتصالًا طبيعيًا.
- source_word: τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: الساكنين في أورشليم
  rationale: صياغة فصيحة مفهومة تحفظ معنى الإقامة المستمرة وتشمل البشر عمومًا كما يقتضي السياق.
theological_decisions:
- issue: دلالة ὀφειλέται الأخلاقية
  choice: مذنبين
  alternative: 'مدينين؛ أو: أشد إثمًا'
  rationale: لا يتعلق السياق بدين مالي، بل بتبعة أخلاقية مفترضة من حجم الكارثة. اختيرت «مذنبين» للوضوح، مع توثيق صورة «المدينين» الأصلية في الحاشية وعدم اختزال العبارة في حكم مذهبي.
- issue: شمول ἀνθρώπους
  choice: جميع الساكنين
  alternative: 'جميع الناس الساكنين؛ أو: جميع الرجال الساكنين'
  rationale: اللفظة اليونانية هنا عامة، وتشير إلى سكان أورشليم لا إلى الذكور حصرًا؛ وحذف الاسم بعد «جميع» طبيعي في العربية ويظل شاملًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «أورشليم» و«سلوام» وفق الصيغ الكتابية العربية المألوفة، وحُفظ السؤال البلاغي والتوتر بين صورة المديونية ودلالة الذنب بواسطة الحاشية.
