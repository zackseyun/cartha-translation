  text: καὶ ἐπέθηκεν αὐτῇ τὰς χεῖρας· καὶ παραχρῆμα ἀνωρθώθη, καὶ ἐδόξαζεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/013.yaml
  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: ar
  text: ووضع يديه عليها، فانتصبت في الحال[a]، وأخذت تمجِّد الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «استقامت»، أو «صارت مستقيمة».
    reason: بدائل معجمية للفعل اليوناني قد تصف الوقوف منتصبة أو التحول إلى هيئة مستقيمة.
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: وضع يديه عليها
  rationale: تعبير عربي طبيعي يحفظ الفعل الملموس، ويستعمل ضمير الملكية لأن أداة التعريف اليونانية مع أعضاء الجسد تُؤدَّى هكذا طبيعيًا في العربية.
- source_word: παραχρῆμα
  choice: في الحال
  rationale: ينقل معنى وقوع الحدث فورًا بعبارة عربية واضحة ومألوفة.
- source_word: ἀνωρθώθη
  choice: انتصبت
  rationale: ينقل عودة المرأة من الانحناء إلى هيئة منتصبة، ويحافظ على دلالة الفعل الجسدية دون إضافة لفظ «من جديد» غير الصريح في اليونانية.
- source_word: ἐδόξαζεν
  choice: أخذت تمجِّد
  rationale: يصون دلالة الماضي الناقص على استجابة بدأت واستمرت، مع الاحتفاظ بالثقل الديني لفعل تمجيد الله.
- source_word: τὸν θεόν
  choice: الله
  rationale: المقابل العربي المعتاد للمفعول به θεόν في هذا السياق.
theological_decisions:
- issue: طبيعة النتيجة التي يصفها ἀνωρθώθη
  choice: انتصبت
  alternative: استقامت / صارت مستقيمة
  rationale: السياق يصف شفاءً جسديًا لامرأة كانت منحنية، لكن الفعل نفسه يسمح بالتعبير عن النتيجة بوصفها انتصابًا أو استقامة؛ لذلك لم تُضف تفاصيل عن آلية الشفاء أو دلالته العقائدية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعملت «فانتصبت» لربط اللمس بنتيجته المباشرة، و«أخذت تمجِّد» لإظهار الجانب الاستمراري للفعل اليوناني.
