  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: ar
  text: 'الحق أقول لكم: مَن لا يقبل ملكوت الله كالطفل[a]، فلن يدخله أبدًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مثل طفل». قد يشير التشبيه إلى التقبّل أو الثقة أو الاتضاع أو الاعتماد الذي يتصف به الطفل؛ ولا تحدد اليونانية الصفة المقصودة بدقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صيغة عربية فصيحة ومألوفة تنقل التوكيد الرسمي في قول يسوع، من غير الاكتفاء بالنقل الصوتي «آمين».
- source_word: ὃς ἂν
  choice: مَن
  rationale: تنقل الشرط العام غير المحدد بإيجاز وطبيعية.
- source_word: μὴ δέξηται
  choice: لا يقبل
  rationale: الفعل δέχομαι يحتمل القبول والتلقي والترحيب؛ و«يقبل» يلائم ملكوت الله ويحفظ معنى الاستجابة المتقبلة دون توسيع الصورة.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير كتابي عربي واضح ومستقر، ينقل معنى مُلك الله وسلطانه دون حصره في مكان.
- source_word: ὡς παιδίον
  choice: مثل طفل
  rationale: يحفظ التشبيه كما هو، من غير تحديد ما إذا كانت الصفة المقصودة هي الاتضاع أو الثقة أو الاعتماد أو التقبل.
- source_word: οὐ μὴ εἰσέλθῃ εἰς αὐτήν
  choice: فلن يدخله أبدًا
  rationale: «لن» مع «أبدًا» ينقلان النفي اليوناني المؤكد οὐ μή، والضمير يعود بوضوح إلى ملكوت الله.
theological_decisions:
- issue: معنى قبول ملكوت الله «مثل طفل»
  choice: إبقاء التشبيه مفتوح الدلالة في المتن
  alternative: بتواضع الطفل؛ بثقة الطفل؛ معتمدًا مثل الطفل؛ أو بصفته طفلًا
  rationale: النص اليوناني لا يحدد وجه الشبه، ولذلك لا ينبغي للترجمة أن تحسم توترًا تفسيريًا مشروعًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «ملكوت الله» للمحافظة على المصطلح الكتابي المألوف، مع صياغة مباشرة مفهومة للقارئ العام.
