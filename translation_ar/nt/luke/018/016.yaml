  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: ar
  text: 'أَمَّا يَسُوعُ فَدَعَاهُمْ إِلَيْهِ وَقَالَ: «دَعُوا الأَطْفَالَ يَأْتُونَ إِلَيَّ، وَلَا تَمْنَعُوهُمْ، لِأَنَّ مَلَكُوتَ اللهِ هُوَ لِأَمْثَالِ هَؤُلَاءِ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أقرب إلى ترتيب الأصل: «لأنَّ لأمثال هؤلاء ملكوتَ الله».'
    reason: بيان الصياغة الحرفية لتركيب الاختصاص في اليونانية، مع الحفاظ على إمكان دلالته على من يماثلون هؤلاء الأطفال.
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: فدعاهم إليه
  rationale: ينقل معنى الفعل المتوسط، أي استدعاهم أو دعاهم إلى نفسه، مع إبقاء الضمير العائد إلى الأطفال.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: دعوا الأطفال يأتون إليَّ
  rationale: صياغة عربية مباشرة وطبيعية تحفظ قوة الأمر ومعنى الحركة نحو يسوع.
- source_word: μὴ κωλύετε αὐτά
  choice: لا تمنعوهم
  rationale: الفعل κωλύω يدل على المنع أو الإعاقة؛ و«لا تمنعوهم» واضحة ومألوفة في العربية المعاصرة.
- source_word: τῶν ... τοιούτων
  choice: لأمثال هؤلاء
  rationale: تحفظ الدلالة التمثيلية للتعبير، فلا تحصر القول في الأطفال الحاضرين وحدهم ولا تحدد الصفة المقصودة منهم.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: «ملكوت الله» تعبير عربي راسخ ودقيق لمعنى سيادة الله وملكه في هذا السياق.
theological_decisions:
- issue: نطاق التعبير τῶν τοιούτων
  choice: «أمثال هؤلاء» يشمل فئة يمثلها الأطفال الحاضرون من غير تعيين الصفة المقصودة.
  alternative: قصر الإشارة على الأطفال الحاضرين أنفسهم فقط.
  rationale: صيغة τοιούτων تتجاوز عادةً الأفراد المشار إليهم إلى من يماثلونهم، لكن الآية لا تشرح وجه المماثلة؛ لذلك تُحفظ هذه المساحة من الغموض والتوتر اللاهوتي.
- issue: دلالة تركيب الملكية أو الاختصاص في τῶν τοιούτων ἐστὶν ἡ βασιλεία
  choice: «ملكوت الله هو لأمثال هؤلاء»
  alternative: «ملكوت الله يخص أمثال هؤلاء» أو «ملكوت الله ينتمي إلى أمثال هؤلاء».
  rationale: الصياغة المختارة تحفظ تركيب الاختصاص القريب من اليونانية من غير أن تضيف تفسيرًا لطبيعة الانتماء إلى الملكوت.
translation_notes:
  register: العربية فصحى حديثة، واضحة ومهيبة من غير تكلّف. استُعمل «الأطفال» بلا إضافة «الصغار» لأن παιδία لا تقتضي هنا زيادة وصفية، وجاءت الأوامر بصياغة مباشرة تناسب خطاب يسوع.
