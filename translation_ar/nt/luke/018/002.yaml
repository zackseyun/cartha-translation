translation:
  language: ar
  text: 'قائلًا: «كان في مدينةٍ ما قاضٍ لا يخاف الله ولا يحترم أحدًا.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا يراعي إنسانًا». يأتي الاسم اليوناني مفردًا بمعنى عام، والفعل يدل على إظهار الاعتبار أو الاحترام.'
    reason: يوضح البديل الدلالي للفعل ويبيّن أن المفرد في اليونانية مستعمل استعمالًا عامًا.
lexical_decisions:
- source_word: λέγων
  choice: قائلًا
  rationale: اسم فاعل حالي يربط مضمون المثل بما قبله، وتحافظ «قائلًا» على هذه الصلة بصورة طبيعية.
- source_word: Κριτής τις
  choice: قاضٍ
  rationale: تدل τις على شخص غير معيّن؛ والتنكير العربي في «قاضٍ» يؤدي المعنى من غير العبارة الثقيلة «قاضٍ ما»، ولا سيما مع إبقاء عدم التعيين صريحًا في المدينة.
- source_word: ἦν ἔν τινι πόλει
  choice: كان في مدينةٍ ما
  rationale: صياغة عربية طبيعية لتقديم شخصية في قصة، و«ما» تنقل عدم تعيين المدينة الذي تفيده τινι.
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: لا يخاف الله
  rationale: تنقل «يخاف» الدلالة الأخلاقية والدينية للفعل، ويعبّر المضارع عن الصفة الملازمة للقاضي.
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: لا يهاب أحدًا
  rationale: الاسم المفرد ἄνθρωπον عام، و«أحدًا» ينقل شموله الطبيعي في العربية. أما «يهاب» فتحفظ معنى الاعتداد بالشخص ومراعاته مع شيء من الرهبة الذي يحتمله ἐντρέπομαι.
theological_decisions:
- issue: المفرد العام ἄνθρωπον في مقابلة الله
  choice: أحدًا
  alternative: الناس / إنسانًا
  rationale: «أحدًا» عربية طبيعية تحفظ المعنى العام للمفرد في هذا السياق من غير أن توهم أن المقصود رجل بعينه، وتبقي المقابلة بين عدم مخافة الله وعدم مراعاة أي إنسان.
- issue: دلالة ἐντρέπομαι
  choice: يهاب
  alternative: يحترم / يراعي
  rationale: للفعل مجال دلالي يشمل الاستحياء أمام شخص وإظهار الاعتبار أو الاحترام له. «يهاب» تلائم الموازاة مع «يخاف» من غير مساواة الفعلين تمامًا، وتُذكر بدائل المعنى في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. حُفظ الربط بالمقطع السابق بواسطة «قائلًا»، واستُعملت صياغة قصصية طبيعية مع إبقاء عدم تعيين المدينة ودلالة العبارة العامة.
