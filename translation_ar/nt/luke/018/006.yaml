lexical_decisions:
- source_word: εἶπεν δὲ
  choice: وقال
  rationale: تؤدي صيغة الماضي السردي مع أداة الربط δέ بعبارة عربية طبيعية تحافظ على استمرار السياق من غير أن تضيف دلالة زمنية غير مصرَّح بها.
- source_word: ὁ κύριος
  choice: الرب
  rationale: يشير اللقب في سياق لوقا إلى يسوع، و«الرب» يحفظ ثقله اللقبي من غير إضافة تفسير عقائدي.
- source_word: Ἀκούσατε
  choice: اسمعوا
  rationale: فعل أمر للجمع يدعو إلى السماع المنتبه، و«اسمعوا» موجز ومباشر ويحفظ صورة السماع في الأصل.
- source_word: τί ... λέγει
  choice: ما يقوله
  rationale: ينقل محتوى القول ويحافظ على زمن المضارع في λέγει بصياغة عربية طبيعية.
- source_word: ὁ κριτὴς τῆς ἀδικίας
  choice: القاضي الظالم
  rationale: الإضافة اليونانية وصفية، و«القاضي الظالم» تعبير عربي واضح وطبيعي يحفظ الحكم الأخلاقي الكامن في ἀδικία؛ وتُذكر الصيغة الحرفية في الحاشية.
theological_decisions:
- issue: ترجمة κύριος حين يشير إلى يسوع
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ الدلالة اللقبية في رواية لوقا، بينما قد تجعل «السيد» اللفظ مجرد نداء اجتماعي أو وصف لعلاقة السيادة.
- issue: دلالة τῆς ἀδικίας في وصف القاضي
  choice: القاضي الظالم
  alternative: قاضي الظلم
  rationale: تُفهم الإضافة هنا على أنها وصف لنوعية القاضي أو صفته الأخلاقية. الصياغة المختارة طبيعية في العربية، مع إبقاء البنية الحرفية واحتمالها الدلالي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظت أداة الربط السردية، واستُعمل أمر مباشر وموجز. وُضع مؤشر الحاشية عند العبارة التي يشرحها، وهي وصف القاضي.
