review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بدقة: رجلان صعدا بغرض الصلاة، أحدهما فريسي والآخر جابي ضرائب. لكن «ساحة الهيكل» بالمفرد أضيق من τὸ ἱερόν، الذي يدل على نطاق/مجمع الهيكل لا على ساحة واحدة بعينها. كما أن «إلى» لا تحافظ، بقدر الإمكان، على اتجاه εἰς إلى داخل نطاق الهيكل؛ و«إلى الهيكل» تعبير عربي طبيعي وقد يشمل المجمع في السياق.'
