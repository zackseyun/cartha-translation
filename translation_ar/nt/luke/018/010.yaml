base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: ar
  text: 'صَعِدَ رجلانِ إلى الهيكلِ ليُصَلِّيا: أحدُهما فَرِّيسيٌّ والآخرُ جابيَ ضرائبَ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: رجلان
  rationale: مع أن ἄνθρωποι قد تدل عمومًا على البشر أو الناس، فإن الوصفين المذكرين اللاحقين يحددان شخصين ذكرين؛ و«رجلان» عربية واضحة وموجزة.
- source_word: ἀνέβησαν
  choice: صَعِدَ
  rationale: يحفظ معنى الصعود المكاني الملازم للذهاب إلى أورشليم والهيكل، وهو تعبير طبيعي في العربية.
- source_word: εἰς τὸ ἱερὸν
  choice: إلى ساحة الهيكل
  rationale: لفظة ἱερόν تشير إلى مجمّع الهيكل أو ساحاته، لا إلى المقدس الداخلي تحديدًا؛ و«ساحة الهيكل» تنقل هذا الفرق بوضوح من غير حاجة إلى حاشية.
- source_word: προσεύξασθαι
  choice: ليُصَلِّيَا
  rationale: المصدر اليوناني يفيد الغرض؛ وصيغة المثنى العربية تطابق الفاعلَين بدقة وطبيعية.
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: أحدهما ... والآخر
  rationale: صياغة عربية مألوفة تحفظ التقابل التوزيعي بين الشخصين.
- source_word: Φαρισαῖος
  choice: فَرِّيسيّ
  rationale: الصيغة العربية المستقرة لاسم هذه الجماعة اليهودية.
- source_word: τελώνης
  choice: جابي ضرائب
  rationale: ينقل الوظيفة بعبارة عربية حديثة واضحة، بخلاف الألفاظ القديمة أو الأقل تداولًا.
theological_decisions:
- issue: التمييز بين ἱερόν وναός
  choice: ساحة الهيكل
  alternative: الهيكل
  rationale: يحيل النص إلى نطاق الهيكل أو ساحاته، لا بالضرورة إلى المقدس الداخلي؛ فاختير تعبير يصرّح بهذا الفرق المعجمي من غير توجيه لاهوتي زائد.
- issue: دلالة جنس ἄνθρωποι
  choice: رجلان
  alternative: شخصان
  rationale: مع إمكان استعمال اللفظة اليونانية استعمالًا عامًا، يعيّن السياق شخصين مذكرين؛ لذلك يحفظ الاختيار دقة المشهد.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعمل المثنى حيث يلائم بنية الآية، وتُجنبت الألفاظ الكنسية الغامضة أو القديمة. لا توجد حواشٍ لأن دلالة ἱερόν الأوسع نُقلت في المتن بعبارة «ساحة الهيكل».
