  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: ar
  text: 'ولمّا رآه يسوع قال: «ما أصعبَ على الذين يملكون الثروة[a] أن يدخلوا إلى ملكوت الله!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المال».'
    reason: بديل معجمي؛ قد تدل χρήματα على المال تحديدًا، كما قد تدل في هذا السياق على الثروة أو الممتلكات بمعنى أوسع.
lexical_decisions:
- source_word: Ἰδὼν δὲ αὐτὸν
  choice: ولمّا رآه
  rationale: صيغ اسم الفاعل الماضي هنا في جملة زمنية عربية طبيعية، مع إبقاء الصلة المباشرة بين رؤية يسوع للرجل وقوله التالي.
- source_word: Πῶς δυσκόλως
  choice: ما أصعب
  rationale: تعبير تعجبي ينقل درجة الصعوبة بوضوح وطبيعية، من غير تحويلها إلى استحالة مطلقة.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: الذين يملكون الثروة
  rationale: يحافظ على البناء الوصفي في اليونانية، وتؤدي «الثروة» هنا المعنى الأوسع لـ χρήματα، أي المال والممتلكات، بدل قصره على النقد.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται
  choice: دخولَ ... إلى ملكوت الله
  rationale: صياغة عربية سليمة تحافظ على معنى الدخول وعلى العبارة الكتابية المألوفة «ملكوت الله».
theological_decisions:
- issue: قوة قول يسوع عن أصحاب الثروة ودخول ملكوت الله
  choice: إثبات شدة الصعوبة التي يواجهها أصحاب الثروة
  alternative: اعتبار دخول كل غني مستحيلًا على الإطلاق
  rationale: النص يقول «ما أصعب» ولا يصرح هنا بالاستحالة؛ لذلك تُحفظ حدة القول وتوتره اللاهوتي من غير زيادة على ألفاظ الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «ولمّا رآه» لطبيعية السرد العربي، و«ما أصعب دخول» لنقل التعجب اليوناني بإيجاز، مع إبقاء الإشارة إلى أصحاب الثروة في صيغة وصفية لا في تصنيف مختزل.
