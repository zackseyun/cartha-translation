lexical_decisions:
- source_word: Ἔλεγεν
  choice: كان يضرب
  rationale: الماضي الناقص اليوناني يرسم فعلًا ماضيًا جاريًا أو تمهيديًا؛ وعبارة «كان يضرب لهم مثلًا» عربية طبيعية في هذا السياق.
- source_word: δὲ
  choice: وَ
  rationale: أداة انتقال خفيفة؛ نُقلت بواو الاستئناف من غير إضافة دلالة زمنية صريحة.
- source_word: παραβολὴν
  choice: مثلًا
  rationale: المقابل العربي المألوف والدقيق لأمثال يسوع، ويحفظ نوع القول.
- source_word: αὐτοῖς
  choice: لهم
  rationale: يمثل المفعول غير المباشر ويشير إلى مخاطَبي يسوع.
- source_word: πρὸς τὸ δεῖν
  choice: ليبيّن أنه ينبغي
  rationale: يحفظ دلالة الغرض أو المقصد في πρὸς τὸ مع المصدر، ودلالة الضرورة في δεῖν، بصياغة عربية واضحة.
- source_word: πάντοτε προσεύχεσθαι
  choice: أن يصلّوا دائمًا
  rationale: ترجمة مباشرة وطبيعية تفيد المثابرة المستمرة، من غير أن تفرض معنى الصلاة اللفظية بلا انقطاع.
- source_word: αὐτοὺς
  choice: لهم / واو الجماعة في يصلّوا ويفتروا
  rationale: الضمير هو فاعل المصدرين في اليونانية، ومُثّل بوضوح في التركيب العربي.
- source_word: μὴ ἐγκακεῖν
  choice: ولا يفتروا
  rationale: «يفتروا» تفيد الوهن والكلال المؤدي إلى التراجع، وتحافظ على صلة العبارة بالمثابرة في الصلاة؛ ويبيّن الهامش البديل الدال على الإحباط.
theological_decisions:
- issue: قوة تعليم يسوع بشأن المواظبة على الصلاة
  choice: «ينبغي لهم أن يصلّوا دائمًا» لإبقاء معنى الضرورة والإلزام من غير بناء نظرية عن كيفية استجابة الصلاة.
  alternative: «حاجتهم إلى أن يصلّوا دائمًا» أو «يجب عليهم أن يصلّوا دائمًا».
  rationale: δεῖν يدل على الضرورة. «ينبغي» يحفظ القوة الحثّية بوضوح، من غير تشديد مذهبي زائد أو تخفيفها إلى مجرد وصف.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل التعبير المألوف «يضرب مثلًا»، وتُجنبت الإضافات الزمنية أو التفسيرات المذهبية غير الموجودة في النص.
