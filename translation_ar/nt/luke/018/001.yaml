  source_fidelity: 'النص العربي ينقل العناصر الأساسية للنص اليوناني بأمانة: الفعل الناقص في «وكان يضرب»، والمثل، والمخاطَبون في «لهم»، وغاية/مقصد المثل، وضرورة الصلاة الدائمة، والنهي عن الفتور. و«ليبيّن أنه ينبغي لهم» تمثيل عربي سليم لبناء πρὸς τὸ δεῖν، ولا يضيف تقريرًا لاهوتيًا خارج النص.'
  naturalness: 'الصياغة فصيحة واضحة وطبيعية: «يضرب لهم مثلًا» تعبير عربي راسخ، و«ينبغي لهم أن يصلّوا دائمًا ولا يفتروا» سهل ومناسب للسجل الكتابي الحديث. الواو في «وكان» تؤدي وظيفة انتقالية خفيفة مناسبة لـ δέ من غير افتعال دلالة زمنية.'
  terminology: «مثلًا» مقابل ثابت لـ παραβολή، و«يصلّوا» المقابل الاصطلاحي الطبيعي لـ προσεύχεσθαι. و«يفتروا» يحافظ على معنى الوهن وفقدان المثابرة في ἐγκακεῖν من غير حسم المعنى في اليأس أو الإحباط وحدهما. الهامش يقدّم بديلًا مقبولًا لمعنى فقدان الشجاعة.
