  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: ar
  text: وكان يضرب لهم مثلًا ليبيّن أنه ينبغي لهم أن يصلّوا دائمًا ولا يفتروا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عن حاجتهم إلى أن يصلّوا دائمًا ولا يصابوا بالإحباط».'
