base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: ar
  text: 'ثم أخذ الاثني عشر على انفراد وقال لهم: «ها نحن صاعدون إلى أورشليم، وكل ما كُتب على ألسنة الأنبياء عن ابن الإنسان[a] سيتمّ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وسيتمّ لابن الإنسان كل ما كُتب على ألسنة الأنبياء». تسمح البنية اليونانية بهذه الصياغة الأقرب إلى الحرفية، لكن المرجح هنا أن المعنى هو ما كتبه الأنبياء عنه.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παραλαβὼν
  choice: أخذ ... جانبًا
  rationale: الفعل يدل على اصطحاب الاثني عشر، ويُفهم من سياق الخطاب الخاص أنه أخذهم جانبًا؛ وهذه صياغة عربية طبيعية تحفظ الدلالة السياقية.
- source_word: τοὺς δώδεκα
  choice: الاثني عشر
  rationale: يحافظ على التسمية اليونانية الموجزة المعروفة من غير إضافة «تلميذًا» تفسيرًا.
- source_word: Ἰδοὺ
  choice: ها نحن
  rationale: تؤدي «ها» وظيفة التنبيه، ومع ضمير المتكلم في الفعل التالي تأتي العبارة «ها نحن» طبيعية وواضحة.
- source_word: ἀναβαίνομεν
  choice: صاعدون
  rationale: يحفظ معنى الصعود الجغرافي إلى أورشليم، ويعكس الحاضر اليوناني ذي الحيوية السردية.
- source_word: Ἰερουσαλήμ
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الراسخة لاسم المدينة.
- source_word: τελεσθήσεται
  choice: سيتمّ
  rationale: الفعل اليوناني يحتمل الإتمام والإنجاز في سياق النبوة؛ و«سيتمّ» يحفظ هذا المعنى من غير حصره في مصطلح تفسيري واحد.
- source_word: πάντα τὰ γεγραμμένα
  choice: كل ما كُتب
  rationale: صياغة عربية موجزة وطبيعية تحفظ الشمول ودلالة الكتابة السابقة القائمة.
- source_word: διὰ τῶν προφητῶν
  choice: بالأنبياء
  rationale: تحفظ دلالة الوساطة أو الأداة في διά مع المضاف إليه، أي إن المكتوب جاء بواسطة الأنبياء.
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: عن ابن الإنسان
  rationale: 'يُفهم المجرور اليوناني هنا على الأرجح باعتباره دالًا على المرجع: ما كُتب بشأن ابن الإنسان، مع إثبات البديل الأقرب حرفيًا في الحاشية.'
theological_decisions:
- issue: ترجمة اللقب المسيحاني ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: يحفظ اللقب بصيغته الكتابية وصلته المحتملة بدانيال، ولا يختزله إلى تعبير عام.
- issue: وظيفة صيغة المجرور τῷ υἱῷ τοῦ ἀνθρώπου
  choice: عن ابن الإنسان
  alternative: لابن الإنسان
  rationale: 'القراءة المرجعية أنسب في السياق: سيتم ما كتبه الأنبياء بشأنه، لكن البنية اليونانية تسمح بترجمة أقرب إلى الحرفية، لذلك حُفظ البديل في الحاشية.'
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «ها نحن» للتنبيه الطبيعي، و«أورشليم» و«ابن الإنسان» للمحافظة على الصيغ الكتابية الراسخة. أُثبتت علامة الحاشية [a] في المتن.
