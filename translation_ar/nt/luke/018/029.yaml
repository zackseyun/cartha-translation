id: LUK.18.29
reference: Luke 18:29
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: ar
  text: 'فقال لهم: «الحق أقول لكم: ما من أحد ترك بيتًا أو زوجةً أو إخوةً أو والدين أو أولادًا من أجل ملكوت الله،»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν
  choice: الحق
  rationale: صيغة عربية واضحة ومألوفة تنقل التوكيد السلطاني في قول يسوع «آمين أقول لكم» دون غموض لفظ «آمين» لدى بعض القراء.
- source_word: ἀφῆκεν
  choice: ترك
  rationale: ينقل المعنى المباشر للفعل في السياق، أي مفارقة البيت أو الأقارب لأجل الملكوت.
- source_word: οἰκίαν
  choice: بيتًا
  rationale: يحافظ على المفرد النكرة في اليونانية، ويمكن أن يدل على المسكن أو البيت بمعناه المعيشي بحسب السياق.
- source_word: γυναῖκα
  choice: زوجةً
  rationale: في قائمة العلاقات الأسرية، المقصود الطبيعي هو الزوجة لا المرأة عمومًا.
- source_word: γονεῖς
  choice: والدين
  rationale: لفظ عربي جامع للأب والأم يطابق صيغة الجمع اليونانية.
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: من أجل ملكوت الله
  rationale: تعبير طبيعي ودقيق يحفظ معنى الدافع أو الغاية ويحافظ على المصطلح اللاهوتي «ملكوت الله».
theological_decisions:
- issue: طبيعة الوعد المتعلق بترك الأسرة
  choice: الإبقاء على «ترك» بلا شرح يحدّد صورة المفارقة أو مدتها
  alternative: هجر أو تخلّى عن
  rationale: النص لا يشرح كيفية الترك، وقد يكون مفارقة فعلية بسبب التلمذة دون أن يستلزم إدانة الروابط الأسرية أو إبطال الالتزامات الأخلاقية؛ لذا ينبغي حفظ اتساع الدلالة.
- issue: ترجمة βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  alternative: مملكة الله أو حُكم الله
  rationale: «ملكوت الله» تعبير عربي كتابي راسخ، ويحتفظ بالتوتر الدلالي بين سلطان الله وحيز ملكه دون حصره في كيان جغرافي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع الحفاظ على ترتيب عناصر القائمة وبنية القول المباشر. أُبقيت الفاصلة الختامية لأن الآية نحويًا تستمر في العدد التالي.
