  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: ar
  text: ولكن لأن هذه الأرملة تسبّب لي المتاعب، سأنصفها[a]، لئلا تظل تأتي فتُنهكني[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سأجري لها العدل» أو «سأردّ لها حقها». ويمكن أن يعني الفعل اليوناني «أنتقم لها» في سياقات أخرى، لكنه هنا يشير إلى إنصافها قضائيًا.'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «تضربني تحت العين»؛ والمقصود على الأرجح: «تُنهكني» أو «تُعييني» بإلحاحها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: ولكن لأن هذه الأرملة تسبّب لي المتاعب
  rationale: تفيد διά مع المصدر المعرّف التعليل، وتزيد γε المعنى توكيدًا. والعبارة παρέχειν ... κόπον اصطلاح يفيد التسبب في العناء أو المتاعب.
- source_word: χήραν ταύτην
  choice: هذه الأرملة
  rationale: ترجمة مباشرة تحفظ ذكر الترمل، وهو عنصر مهم في وضع المرأة الاجتماعي وسياق المثل.
- source_word: ἐκδικήσω αὐτήν
  choice: سأنصفها[a]
  rationale: في السياق القضائي يعني الفعل منحها حقها أو إجراء العدل لها، لا الانتقام الشخصي. و«أنصفها» عربية واضحة وموجزة.
- source_word: ἵνα μὴ εἰς τέλος ἐρχομένη
  choice: لئلا تظل تأتي
  rationale: «لئلا» تنقل الغاية المنفية، و«تظل تأتي» تعبّر طبيعيًا عن تكرر مجيئها واستمراره، مع أخذ εἰς τέλος في معنى الاستمرار إلى غير نهاية من منظور القاضي.
- source_word: ὑπωπιάζῃ με
  choice: فتُنهكني[b]
  rationale: المعنى الحرفي هو الضرب تحت العين، لكن الاستعمال هنا مجازي على الأرجح ويفيد الإنهاك أو الإعياء من شدة الإلحاح.
theological_decisions:
- issue: دلالة ἐκδικήσω في مثل عن الصلاة والعدل
  choice: سأنصفها
  alternative: سأنتقم لها
  rationale: السياق هو طلب حكم قضائي يردّ الحق، لا انتقام شخصي؛ وتحفظ «سأنصفها» الصلة الموضوعية بالعدل في الآيات المحيطة.
- issue: هل ὑπωπιάζῃ يدل على اعتداء جسدي أم إنهاك مجازي
  choice: فتُنهكني
  alternative: فتضربني تحت عيني
  rationale: أُبقيت قوة الصورة في حاشية، بينما اختير في المتن المعنى الاصطلاحي الأنسب لشكوى القاضي من إلحاحها المتكرر، دون الجزم بأن المرأة تهدده حرفيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة قصصية كريمة. اختير «تسبّب لي المتاعب» لنقل الاصطلاح اليوناني، و«تظل تأتي» لتجسيد الاستمرار دون صياغة ثقيلة. وُضعت علامتا الحاشية بعد اللفظين اللذين تشرحانهما مباشرة.
