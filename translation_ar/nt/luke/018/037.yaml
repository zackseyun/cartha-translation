  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: ar
  text: 'فأخبروه: «يسوع الناصري يمرّ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يسوع الذي من الناصرة يمرّ». والنص اليوناني يقول حرفيًا: «يسوع الناصري».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: فأخبروه
  rationale: الفعل يدل على نقل الخبر أو الإخبار، و«أخبروه» تعبير عربي طبيعي يلائم جواب الناس للرجل في السياق.
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تواصل السرد، وتؤدي الفاء هذا الانتقال طبيعيًا من سؤاله السابق إلى جوابهم.
- source_word: αὐτῷ
  choice: ـه في «أخبروه»
  rationale: يمثل ضمير المفعول غير المباشر تمثيلًا عربيًا موجزًا وطبيعيًا.
- source_word: ὅτι
  choice: النقطتان والاقتباس المباشر
  rationale: تدخل الأداة مضمون الخبر، ويؤديه الاقتباس المباشر بوضوح وحيوية من غير تغيير المعنى.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المألوفة للاسم الشخصي اليوناني.
- source_word: ὁ Ναζωραῖος
  choice: الناصري
  rationale: يحافظ على صيغة النسبة/التسمية في اليونانية، بدل تحويلها في المتن إلى عبارة مكانية صريحة مثل «من الناصرة».
- source_word: παρέρχεται
  choice: يمرّ من هنا
  rationale: المضارع يصف حدثًا جاريا في اللحظة نفسها؛ و«يمرّ من هنا» عربية طبيعية توضح أنه يعبر بالمكان.
theological_decisions:
- issue: ترجمة تسمية يسوع Ναζωραῖος
  choice: الناصري
  alternative: يسوع الذي من الناصرة
  rationale: التعبير في المقام الأول نسبة جغرافية أو تسمية تعريفية، وليس لقبًا عقائديًا يستدعي شرحًا مذهبيًا. وتحافظ «الناصري» على صيغة الأصل مع بقائها مألوفة وواضحة.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة بلا تكلّف. استُعملت «فأخبروه» لوصل الحدث بما قبله، وحُفظت تسمية «الناصري» في المتن مع بيان البديل الجغرافي في الحاشية.
