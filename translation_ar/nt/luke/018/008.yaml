id: LUK.18.8
reference: Luke 18:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: ar
  text: أقول لكم إنه سينصفهم سريعًا.[a] ولكن، حين يأتي ابن الإنسان، أتراه يجد الإيمان على الأرض؟[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سيجري لهم العدل» أو «سيثبت حقهم». يمكن أن يدل التعبير اليوناني على الإنصاف القضائي أو إجراء العدل لمصلحة شخص.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تعني الكلمة اليونانية أيضًا «الثقة» أو «الأمانة»؛ وقد أُبقيت في المتن بالمعنى الأوسع: «الإيمان».'
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: سينصفهم
  rationale: يفيد التعبير اليوناني إجراء العدل لمصلحة شخص أو إثبات حقه. و«سينصفهم» تعبير عربي طبيعي يحافظ على السياق القضائي من غير إبراز معنى الانتقام.
- source_word: ἐν τάχει
  choice: سريعًا
  rationale: يحافظ على معنى السرعة أو عدم الإبطاء، من غير حسم العبارة على أنها تحديد لموعد قريب.
- source_word: πλὴν
  choice: ولكن
  rationale: تؤدي الانتقال الاستدراكي القوي إلى السؤال الختامي بلغة عربية واضحة وطبيعية.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة العربية الراسخة للقب، وتحفظ صداه الكتابي.
- source_word: ἐλθὼν
  choice: حين يأتي
  rationale: يُفهم اسم الفاعل اليوناني هنا زمنيًا بالنسبة إلى الفعل الرئيس، وهذه صياغة عربية طبيعية.
- source_word: ἆρα
  choice: أتراه
  rationale: تنقل أداة الاستفهام التأملية ذات النبرة الفاحصة، من غير إضافة جواب صريح لا يورده النص.
- source_word: τὴν πίστιν
  choice: الإيمان
  rationale: يحفظ اتساع πίστις، مع ذكر احتمالي «الأمانة» و«الثقة» في الحاشية بدل تضييق المعنى في المتن.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: هو المعنى المباشر الملائم للنطاق الأخروي للقول، مع إبقاء لفظ الأرض عامًا.
theological_decisions:
- issue: هل تدل πίστις هنا على الإيمان أم الثقة أم الأمانة؟
  choice: الإيمان
  alternative: الثقة أو الأمانة
  rationale: السياق قد يشير إلى إيمان مثابر يظهر في الصلاة، لكن اللفظ اليوناني أوسع من أن يُحسم في معنى واحد؛ لذلك أُبقي «الإيمان» في المتن وذُكرت البدائل في الحاشية.
- issue: دلالة ἐκδίκησις بين الإنصاف والانتقام
  choice: سينصفهم
  alternative: سيجري لهم العدل أو يثبت حقهم
  rationale: سياق الأرملة والقاضي قضائي ويركز على منح المظلوم حقه؛ و«الإنصاف» يحفظ ذلك من غير استيراد إيحاء انتقامي غير لازم.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «أتراه» لنقل قوة السؤال التأملي، و«سينصفهم» لتجنب إيحاء انتقامي زائد مع حفظ السياق القضائي.
