    rationale: المتن يستعمل «من ثقب إبرة»، والحاشية «عبر ثقب إبرة»؛ والفرق بينهما أسلوبي محدود، كما أن وصف الثانية بأنها «بحرفية أشد» غير دقيق على نحو كافٍ. «عين إبرة» بديل عربي مألوف يوازي العبارة الاصطلاحية بصورة أوضح.
  - severity: low
    issue: صياغة المقارنة بالمصدرين أقل قربًا من حركة النص الفعلية.
