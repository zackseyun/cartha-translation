  to: لِأَنَّ أَنْ يَدْخُلَ جَمَلٌ مِنْ ثَقْبِ إِبْرَةٍ أَيْسَرُ مِنْ أَنْ يَدْخُلَ غَنِيٌّ إِلَى مَلَكُوتِ اللهِ.[a][b]
  rationale: تُبقي المراجعة الصورة الحرفية المبالِغة كما في κάμηλον، والاتجاه في «إلى ملكوت الله» كما في εἰς، مع جعل بناء المقارنة أكثر سلاسة بالعربية والمحافظة على تكرار فعل «يدخل». كما تُصلح الحاشية (a) لتكون بديلًا تعبيريًا واضحًا ومفيدًا.
