  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: ar
  text: لِأَنَّ أَنْ يَدْخُلَ جَمَلٌ مِنْ ثَقْبِ إِبْرَةٍ أَيْسَرُ مِنْ أَنْ يَدْخُلَ غَنِيٌّ إِلَى مَلَكُوتِ اللهِ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عبر عين إبرة».'
    reason: lexical_alternative
  - marker: b
    text: اقترح بعضهم تفسيرات مثل وجود باب ضيق يُسمّى «ثقب الإبرة»، أو أن المقصود «حبل» بدلًا من «جمل»، لكن النص اليوناني هنا يقول «جمل».
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: أَيْسَرُ
  rationale: صيغة تفضيل خبرية تفيد المقارنة، و«أيسر» تعبير عربي موجز وطبيعي.
- source_word: γάρ
  choice: لِأَنَّ
  rationale: تحفظ الأداة وظيفتها التعليلية وتربط القول بسياقه السابق.
- source_word: κάμηλον
  choice: جَمَلٍ
  rationale: المعنى المعجمي المباشر هو «جمل»، ولا يوجد في النص اليوناني ما يسوّغ استبداله بـ«حبل».
- source_word: διὰ τρήματος βελόνης
  choice: مِنْ ثَقْبِ إِبْرَةٍ
  rationale: ينقل معنى المرور عبر فتحة الإبرة بصياغة عربية واضحة وقريبة من تركيب الأصل.
- source_word: εἰσελθεῖν
  choice: دُخُولَ
  rationale: المصدر العربي يلائم بناء المقارنة، وقد حوفظ عليه في طرفيها كما في الأصل.
- source_word: πλούσιον
  choice: غَنِيٍّ
  rationale: الصفة اليونانية المذكرة المفردة مستعملة استعمال الاسم؛ و«غني» يحفظ الإفراد وصيغة المصدر.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: إِلَى مَلَكُوتِ اللهِ
  rationale: «إلى» تحفظ معنى الاتجاه في εἰς، و«ملكوت الله» عبارة كتابية عربية مألوفة وشفافة.
theological_decisions:
- issue: تفسير صورة الجمل وثقب الإبرة
  choice: 'الإبقاء على الصورة الحرفية المبالِغة: جمل يمر من ثقب إبرة'
  alternative: تفسير «ثقب الإبرة» على أنه اسم باب ضيق، أو حمل «جمل» على معنى «حبل»
  rationale: النص اليوناني المعطى يقرأ κάμηλον، أي «جمل»، والصورة المتعمدة الشديدة الاستحالة تؤكد صعوبة دخول الغني إلى ملكوت الله؛ فلا تُدرج التفسيرات اللاحقة في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُعمل «ملكوت الله» للمحافظة على المصطلح الكتابي المألوف، وصيغت المقارنة بالمصدرين «دخول... دخول» لتكون طبيعية وموازية للأصل.
