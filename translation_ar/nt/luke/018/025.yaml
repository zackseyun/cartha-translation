  terminology: «ملكوت الله» مصطلح كتابي عربي راسخ ومناسب. ينبغي أن تبيّن الحاشية البديلة فرقًا حقيقيًا في التعبير («عين إبرة») بدل أن تعيد المعنى نفسه تقريبًا بعبارة «عبر ثقب إبرة».
  issues:
