  verdict: revise
  source_fidelity: 'المعنى الأساسي أمين للنص اليوناني: المقارنة محفوظة، و«جمل» تقابل κάμηλον، و«ملكوت الله» تقابل βασιλεία τοῦ θεοῦ. لكن صياغة المتن بالمصدرين («دخول... دخول») أقل مباشرة من بنية الفعلين في الأصل، ويمكن تحسين وضوح صورة العبور دون تغيير المعنى.'
