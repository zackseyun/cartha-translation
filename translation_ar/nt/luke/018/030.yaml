  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: ar
  text: الذي سينال حتمًا أضعافًا كثيرة في هذا الزمان، وفي الدهر الآتي الحياة الأبدية[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العصر الآتي».'
    reason: بديل ترجمي للفظ αἰών مع الحفاظ على معنى النظام الأخروي المقبل.
lexical_decisions:
- source_word: οὐχὶ μὴ
  choice: حتمًا
  rationale: يفيد اجتماع أداتي النفي مع صيغة الاحتمال توكيدًا قويًّا لوقوع الأمر؛ وتنقل «حتمًا» هذه القوة بعبارة عربية طبيعية من غير تركيب نفي مزدوج متكلف.
- source_word: ἀπολάβῃ
  choice: سينال
  rationale: الفعل قد يعني «يسترد» أو «ينال». والسياق يتضمن معنى التعويض، لكن «ينال» يحافظ على سلاسة العبارة من غير تحميل السابقة اللفظية أكثر مما تحتمل.
- source_word: πολλαπλασίονα
  choice: أضعافًا كثيرة
  rationale: تدل على عوض مضاعف وفير، وهذه العبارة واضحة وطبيعية وتحفظ معنى التعدد والكثرة.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: في هذا الزمان
  rationale: تحفظ الإشارة إلى الوقت الحاضر وتقابله بالدهر الآتي.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: في الدهر الآتي
  rationale: «الدهر الآتي» تعبير عربي موجز يحفظ تصور العهد الجديد للدهر الحاضر والدهر المقبل، ولا يختزله إلى مجرد وقت مستقبلي.
- source_word: ζωὴν αἰώνιον
  choice: الحياة الأبدية
  rationale: هو المقابل العربي الراسخ والواضح الذي يؤدي المعنى الأخروي للتعبير في الأناجيل.
- source_word: ὃς
  choice: الذي
  rationale: ضمير موصول يعود على الشخص المذكور في الآية السابقة، ولذلك يحافظ «الذي» على اتصال الجملة بسياقها.
theological_decisions:
- issue: الدلالة الأخروية لعبارة αἰῶνι τῷ ἐρχομένῳ
  choice: الدهر الآتي
  alternative: العصر الآتي
  rationale: يحفظ «الدهر الآتي» التقابل اللاهوتي بين الحاضر والنظام الأخروي المقبل، بدل تسطيح العبارة إلى معنى «المستقبل» العام.
- issue: قوة الوعد في οὐχὶ μὴ ἀπολάβῃ
  choice: سينال حتمًا
  alternative: لن يفوته أن ينال
  rationale: الصياغة المختارة تثبت يقين الوعد من غير أن تجعل النفي الاصطلاحي في اليونانية نفيًا دلاليًّا في العربية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعمل المستقبل مع «حتمًا» لنقل التوكيد اليوناني القوي، وحُفظت بنية الجملة الموصولة لأنها امتداد مباشر للآية السابقة.
