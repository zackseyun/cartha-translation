lexical_decisions:
- source_word: Εἶπεν δὲ ὁ Πέτρος
  choice: فقال بطرس
  rationale: تؤدي الفاء انتقال δέ في سياق الحوار على نحو عربي طبيعي، و«قال» هي المقابل السردي المباشر لـ Εἶπεν.
- source_word: Ἰδοὺ ἡμεῖς
  choice: ها نحن
  rationale: «ها» أداة تنبيه عربية طبيعية تقابل Ἰδοὺ، ومع «نحن» تحفظ إبراز الضمير الصريح.
- source_word: ἀφέντες
  choice: قد تركنا
  rationale: تحول اسم الفاعل اليوناني السابق للفعل الرئيس إلى فعل عربي منسق، و«قد» تبرز وقوع الترك وما له من نتيجة حاضرة دون تشديد معنى الهجر.
- source_word: τὰ ἴδια
  choice: ما لنا
  rationale: صياغة عربية موجزة وواسعة تحافظ على عدم تحديد اليونانية للأشياء المتروكة، فلا تحصرها في الأموال أو البيوت.
- source_word: ἠκολουθήσαμέν σοι
  choice: وتبعناك
  rationale: مقابل طبيعي ودقيق لفعل الاتباع مع المفعول، ويحفظ دلالته السياقية على التلمذة من غير شرح زائد.
theological_decisions:
- issue: مدى ما تركه بطرس والآخرون
  choice: ما لنا
  alternative: ممتلكاتنا؛ كل ما لنا؛ بيوتنا
  rationale: العبارة τὰ ἴδια عامة ولا تعين نوع المتروك ولا تصرح بالشمول الكلي؛ لذلك تُترك دلالتها مفتوحة.
