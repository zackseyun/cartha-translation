  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: ar
  text: 'أَمَّا جَابِي الضَّرَائِبِ، فَكَانَ وَاقِفًا مِنْ بَعِيدٍ، وَلَمْ يَشَأْ حَتَّى أَنْ يَرْفَعَ عَيْنَيْهِ نَحْوَ السَّمَاءِ، بَلْ ظَلَّ يَضْرِبُ صَدْرَهُ وَيَقُولُ: «اللَّهُمَّ، ارْحَمْنِي[a] أَنَا الْخَاطِئَ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «تَرَضَّ عني»؛ فالفعل اليوناني مرتبط بمفردات التكفير وطلب رضا الله.'
    reason: بديل معجمي يحفظ البعد التكفيري في الفعل ἱλάσκομαι.
lexical_decisions:
- source_word: τελώνης
  choice: جابي الضرائب
  rationale: تعبير عربي معاصر واضح يدل على محصّل الضرائب، ويحافظ في السياق الإنجيلي على ما ارتبط بهذه المهنة من نظرة اجتماعية سلبية.
- source_word: μακρόθεν
  choice: من بعيد
  rationale: ينقل المعنى المكاني بإيجاز وطبيعية، مع إبقاء ما يوحي به السياق من تواضع وابتعاد.
- source_word: ἑστὼς
  choice: كان واقفًا
  rationale: صياغة عربية طبيعية تصف هيئة الرجل المستمرة في المشهد.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: ولم يشأ حتى أن
  rationale: يحافظ على دلالة الإرادة في θέλω وعلى قوة οὐδέ، بدل تحويل العبارة إلى عدم قدرة.
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: يرفع عينيه نحو السماء
  rationale: ينقل التعبير اليوناني واتجاه النظر بصياغة عربية مألوفة ومهيبة.
- source_word: ἔτυπτε
  choice: ظل يضرب
  rationale: يُظهر الاستمرار أو التكرار الذي تدل عليه صيغة الماضي الناقص اليونانية.
- source_word: τὸ στῆθος αὐτοῦ
  choice: صدره
  rationale: التعبير العربي الطبيعي لهذه الإيماءة الدالة على الحزن والندم.
- source_word: ἱλάσθητί μοι
  choice: ارحمني
  rationale: ينقل طلب الرحمة الإلهية بوضوح وطبيعية في متن النص، مع حفظ الصلة اللغوية بالتكفير واسترضاء الغضب في الحاشية.
- source_word: τῷ ἁμαρτωλῷ
  choice: أنا الخاطئ
  rationale: يحافظ على أداة التعريف اليونانية ونبرتها التشديدية في اعتراف المتكلم، وهو أوضح عربيًا من الاقتصار على «الخاطئ» بعد ضمير المفعول.
theological_decisions:
- issue: كيفية نقل ἱλάσθητί μοι في صلاة تطلب قبول الله ورحمته
  choice: ارحمني
  alternative: 'كن راضيًا عني؛ أو: كفِّر عني'
  rationale: الفعل ينتمي إلى حقل لغوي متصل بالتكفير واسترضاء الغضب، لكن «ارحمني» هو الأنسب لصلاة مباشرة مفهومة لعامة القراء. وتُذكر الدلالة التكفيرية في الحاشية دون فرض تفسير عقائدي كامل داخل المتن.
- issue: دلالة أداة التعريف في τῷ ἁμαρτωλῷ
  choice: أنا الخاطئ
  alternative: أنا خاطئ
  rationale: يبقي الاختيار على الصيغة المعلَّمة في اليونانية وعلى قوة إذلال النفس في الصلاة، دون الجزم بأن العبارة تصنيف حصري حرفي.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة مهيبة غير متكلّفة. استُخدم «جابي الضرائب» بدل ألفاظ قديمة أو مبهمة، وحُفظ استمرار ضرب الصدر وقوة عبارة «أنا الخاطئ». وُضع مؤشر الحاشية بعد «ارحمني» لأنه يشرح الفعل اليوناني ἱλάσθητί، لا اسم جابي الضرائب.
