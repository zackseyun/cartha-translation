  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: ar
  text: 'والذين كانوا يسيرون في المقدمة كانوا ينتهرونه ليسكت، أما هو فظل يصرخ أكثر فأكثر: «يا ابن داود، ارحمني!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: الذين كانوا يسيرون في المقدمة
  rationale: ينقل التعبير معنى الأشخاص الذين كانوا أمامه في الجمع أو الموكب، من غير افتراض أنهم قادة.
- source_word: ἐπετίμων
  choice: كانوا ينتهرونه
  rationale: الفعل يدل على الزجر أو التوبيخ بشدة، وصيغة الماضي الناقص اليونانية تشير إلى فعل مستمر أو متكرر.
- source_word: ἵνα σιγήσῃ
  choice: ليسكت
  rationale: صياغة عربية موجزة وطبيعية تعبّر بوضوح عن الغرض المقصود من انتهارهم له.
- source_word: αὐτὸς δὲ
  choice: أما هو
  rationale: تحفظ المقابلة والتوكيد في الضمير اليوناني من غير إثقال العبارة.
- source_word: πολλῷ μᾶλλον
  choice: أكثر فأكثر
  rationale: تحفظ شدة المقارنة المتزايدة من غير إضافة قيد «بصوت أعلى» غير المصرح به في الأصل.
- source_word: ἔκραζεν
  choice: فظل يصرخ
  rationale: ينقل صيغة الماضي الناقص الدالة على الاستمرار والإلحاح.
- source_word: Υἱὲ Δαυίδ
  choice: يا ابن داود
  rationale: ترجمة مباشرة للقب الندائي ذي الدلالة الداودية المسيانية، مع أداة النداء الطبيعية في العربية.
- source_word: ἐλέησόν με
  choice: ارحمني
  rationale: صيغة عربية واضحة ومألوفة تحفظ قوة الالتماس العاجل ومعنى طلب الرحمة.
theological_decisions:
- issue: الدلالة المسيانية للقب Υἱὲ Δαυίδ
  choice: يا ابن داود
  alternative: اعتباره مجرد نداء تشريفي بلا دلالة مسيانية
  rationale: يحمل اللقب في سياق لوقا دلالة ملكية داودية ومسيانية؛ وترجمته مباشرة تحفظ هذه الدلالة من غير إضافة شرح تفسيري إلى المتن.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «أما هو» لإبراز المقابلة، و«فظل يصرخ» لإظهار استمرار الصراخ وإلحاحه.
