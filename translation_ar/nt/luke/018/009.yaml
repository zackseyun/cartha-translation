  rationale: يستبدل التعديل الوصف الماضي بوصف قائم يوافق البنية اليونانية، ويجعل مرجع τοὺς λοιπούς أقرب إلى اللفظ الأصلي. ولا يغيّر المعنى أو المصطلحات اللاهوتية أو موضع الحاشية.
