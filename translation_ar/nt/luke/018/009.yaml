  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: ar
  text: وقال أيضًا هذا المثل لبعض الذين يثقون في أنفسهم أنهم أبرار، ويحتقرون الآخرين:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويزدرون الآخرين» أو «ينظرون إلى الآخرين باحتقار».'
    reason: بدائل معجمية توضّح مجال معنى ἐξουθενοῦντας.
lexical_decisions:
- source_word: Εἶπεν
  choice: قال ... هذا المثل
  rationale: الفعل λέγω يعني «قال»، ومع كون المفعول «هذا المثل» تصح هذه الصياغة العربية طبيعيًا وتحافظ على قوة الفعل السردية.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تتابع السرد، ولا يقتضي السياق إبراز معنى الاستدراك.
- source_word: καὶ
  choice: أيضًا
  rationale: تفيد الإضافة هنا، أي إن يسوع أضاف هذا المثل إلى تعليمه السابق.
- source_word: πρός τινας
  choice: لبعض
  rationale: يدل حرف الجر مع أشخاص بعد فعل القول على الجهة التي وُجّه إليها الكلام.
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: الذين كانوا واثقين بأنفسهم
  rationale: ينقل اسم الفاعل التام حالة راسخة من الثقة، ويحافظ «بأنفسهم» على تركيز العبارة في اعتمادهم على ذواتهم.
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: أنهم أبرار
  rationale: تحافظ «أبرار» على الدلالة الأخلاقية والدينية للمصطلح، وتترك للسياق أن يكشف بطلان تقييمهم لأنفسهم.
- source_word: ἐξουθενοῦντας
  choice: يحتقرون
  rationale: الفعل يعني عدَّ الآخرين بلا قيمة أو ازدراءهم؛ و«يحتقرون» موجزة وطبيعية وتحفظ القوة الفعلية لاسم الفاعل.
- source_word: τοὺς λοιπούς
  choice: سائر الناس
  rationale: تنقل معنى «الباقين/الآخرين» بعبارة عربية واضحة، وتُظهر أن المقصود جميع من عداهم من الناس.
- source_word: τὴν παραβολὴν ταύτην
  choice: هذا المثل
  rationale: «المثل» هو المقابل العربي المألوف والدقيق لهذا النوع التعليمي في الأناجيل.
theological_decisions:
- issue: ترجمة δίκαιοι في سياق نقد البر الذاتي
  choice: أبرار
  alternative: صالحون / على حق
  rationale: النص يستخدم اللفظ اللاهوتي المعتاد للبر ولا يستخدم وصفًا تهكميًا صريحًا؛ لذلك تُحفظ الكلمة، ويُترك للسياق أن يكشف نقد ادعائهم.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، بصياغة قريبة من بنية الأصل من غير تكلّف. استُخدم «سائر الناس» بدل «الباقين» لسلامة الأسلوب ووضوح المرجع، مع إبقاء نقد البر الذاتي نابعًا من السياق لا من إضافة تفسيرية.
