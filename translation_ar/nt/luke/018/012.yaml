  text: I fast twice a week[a]; I tithe everything I acquire.
translation:
  language: ar
  text: أصوم مرتين في الأسبوع[a]، وأُخرج العُشر من كل ما أقتنيه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «مرتين من السبت»، وهو تعبير اصطلاحي يعني «مرتين في الأسبوع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: أصوم
  rationale: المضارع هنا يفيد العادة في وصف المتكلم لممارسته المنتظمة، وصيغة «أصوم» طبيعية وواضحة.
- source_word: δὶς
  choice: مرتين
  rationale: ينقل الظرف الدال على وقوع الفعل مرتين نقلًا مباشرًا.
- source_word: τοῦ σαββάτου
  choice: في الأسبوع
  rationale: التركيب اصطلاح زمني في اليونانية الكوينية يشير إلى دورة الأسبوع، وليس إلى صومين في يوم السبت.
- source_word: ἀποδεκατῶ
  choice: أُعشِّر
  rationale: الفعل يعني إخراج العُشر، و«أُعشِّر» تعبير عربي موجز ودقيق في هذا السياق.
- source_word: πάντα ὅσα
  choice: كلَّ ما
  rationale: ينقل الشمول وقوة الموصول معًا بصياغة عربية طبيعية.
- source_word: κτῶμαι
  choice: أقتنيه
  rationale: الفعل الأوسط يدل هنا على ما يكتسبه المرء أو يحصّله لنفسه؛ و«أقتنيه» يحافظ على معنى الاكتساب دون قصره على الدخل النقدي.
theological_decisions:
- issue: دلالة τοῦ σαββάτου في قول المتكلم عن الصوم
  choice: 'المعنى الزمني الاصطلاحي: «في الأسبوع»'
  alternative: 'الترجمة الحرفية: «من السبت» أو «في السبت»'
  rationale: السياق يبيّن أن العبارة تحدد وتيرة الصوم، لا ممارسة مرتبطة بيوم السبت؛ لذا تمنع الصياغة الاصطلاحية فهمًا مضللًا.
- issue: مدى ما يدّعي المتكلم تقديم عُشره
  choice: «كل ما أقتنيه»
  alternative: «كل ما أملك»
  rationale: يحمل κτῶμαι معنى الاقتناء أو الاكتساب، لا مجرد حالة التملك؛ فاختيار «أقتنيه» يصون هذا الفرق ولا يضيّق الادعاء لاهوتيًا.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة وكريمة. استُعمل «أُعشِّر» بوصفه مصطلحًا دقيقًا موجزًا، مع إبقاء نبرة التعداد المتفاخر في كلام المتكلم من غير إضافة تفسير.
