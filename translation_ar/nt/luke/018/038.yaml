lexical_decisions:
- source_word: ἐβόησεν
  choice: فَصَرَخَ
  rationale: يدل الفعل على رفع الصوت بصرخة أو نداء قوي، و«صرخ» تنقل شدة الصوت وإلحاح الطلب بوضوح.
- source_word: λέγων
  choice: قَائِلًا
  rationale: يحفظ اسم الفاعل المصاحب للفعل في اليونانية، ويقدّم الكلام المباشر بصياغة عربية طبيعية.
- source_word: Ἰησοῦ
  choice: يَا يَسُوعُ
  rationale: الصيغة اليونانية للنداء، ولذلك أُظهرت أداة النداء العربية مع الاسم المتعارف عليه.
- source_word: υἱὲ Δαυίδ
  choice: يَا ابْنَ دَاوُدَ
  rationale: يحفظ اللقب الداودي بصيغته الكتابية المعروفة وما يحمله في السياق من دلالة ملكية مسيانية، من غير تحويله إلى تفسير.
- source_word: ἐλέησόν με
  choice: ارْحَمْنِي
  rationale: أمر مباشر يلتمس الرحمة؛ و«ارحمني» هي المقابل العربي الطبيعي الموجز، وتحفظ إلحاح الالتماس ووزنه اللاهوتي.
theological_decisions:
- issue: الدلالة المسيانية للقب υἱὲ Δαυίδ
  choice: ترجمة اللقب «ابن داود».
  alternative: 'ترجمته تفسيرًا: «يا من نسل داود» أو «يا سليل داود».'
  rationale: يعمل التعبير في سياق لوقا بوصفه لقبًا ملكيًا مسيانيًا موجّهًا إلى يسوع. وتحفظ «ابن داود» صيغته الكتابية ودلالته، مع إبقاء إمكان فهم النسب حاضرًا من غير حسم تفسيري زائد.
translation_notes:
  register: عربية فصحى واضحة ومهيبة، مع الحفاظ على الإيقاع العاجل للنداء. استُعملت «يا» قبل «يسوع» وقبل اللقب لتوضيح النداء طبيعيًا في العربية، ووُضع مؤشر الحاشية بعد الاقتباس لأنه يشرح لقب «ابن داود» الوارد فيه.
