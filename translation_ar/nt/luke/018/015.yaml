lexical_decisions:
- source_word: Προσέφερον
  choice: كان الناس يأتون إليه
  rationale: صيغة الماضي الناقص تدل على فعل جارٍ أو متكرر. وإظهار «الناس» يوضح الفاعل المستتر في اليونانية من غير تحديد هويته، بينما «يأتون إليه» تعبير عربي طبيعي عن إحضار الأطفال إليه.
- source_word: δὲ
  choice: و
  rationale: أداة انتقال سردي خفيف؛ والواو تؤدي هذا الدور طبيعيًا من غير المبالغة في إفادة التعارض.
- source_word: καὶ τὰ βρέφη
  choice: حتى بالرضّع
  rationale: تفيد καὶ هنا معنى الإضافة المؤكدة، فتنقلها «حتى»، و«الرضّع» تعبّر بدقة عن الأطفال الصغار جدًا الذين يدل عليهم βρέφη.
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: لكي يلمسهم
  rationale: تحافظ «لكي» على معنى الغرض، و«يلمسهم» تنقل الفعل كما هو من غير إدخال معنى البركة أو وضع اليدين في صلب النص.
- source_word: ἰδόντες δὲ οἱ μαθηταὶ
  choice: فلما رأى التلاميذ ذلك
  rationale: تحويل اسم الفاعل اليوناني إلى جملة زمنية أسلوب عربي سلس، و«ذلك» يعود إلى مجمل ما كان يحدث.
- source_word: ἐπετίμων αὐτοῖς
  choice: انتهروهم
  rationale: «انتهر» يحفظ قوة التوبيخ في ἐπιτιμάω، والضمير يعود بحسب السياق إلى الذين كانوا يأتون بالرضّع.
theological_decisions:
- issue: طبيعة فعل يسوع تجاه الرضّع
  choice: يلمسهم
  alternative: يباركهم أو يضع يديه عليهم
  rationale: النص في لوقا يستعمل فعل «يلمس» تحديدًا. أما اقتران اللمس بالبركة ووضع اليدين في الروايات الموازية فيُذكر في الحاشية، حتى لا يُستبدل لفظ لوقا بتفسيره.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. اختير «الرضّع» للدقة، وحُفظ تتابع السرد وصيغة الفعل المتكرر، مع إبقاء اللمس في المتن وعدم تفسيره صراحةً بالبركة.
