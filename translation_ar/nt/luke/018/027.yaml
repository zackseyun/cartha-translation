  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: ar
  text: 'فقال: «ما يستحيل على البشر ممكن لدى الله».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما يستحيل على الناس ممكن عند الله».'
    reason: بديل معجمي يعبّر عن ἀνθρώποις بـ«الناس» وعن παρὰ τῷ θεῷ بـ«عند الله».
lexical_decisions:
- source_word: ἀδύνατα
  choice: ما يستحيل
  rationale: الصفة المحايدة الجمع مستعملة استعمال الاسم؛ وصياغة «ما يستحيل» عربية طبيعية وتحافظ على معنى ما يتعذر تحقيقه.
- source_word: παρὰ ἀνθρώποις
  choice: على البشر
  rationale: تفيد παρά مع المجرور هنا جهة القياس أو المجال؛ و«على البشر» تعبّر بوضوح عن العجز البشري مع إبقاء الإشارة عامة إلى الناس جميعًا.
- source_word: δυνατὰ
  choice: ممكن
  rationale: تقابل ἀδύνατα مباشرة، و«ممكن» هي المقابل العربي الموجز والطبيعي في هذا التركيب.
- source_word: παρὰ τῷ θεῷ
  choice: لدى الله
  rationale: تحافظ «لدى الله» على دلالة المجال أو جهة القياس التي تفيدها παρά مع المجرور، وعلى الموازاة مع المجال البشري، من غير أن توحي بمجرد الحضور المكاني.
- source_word: ὁ δὲ εἶπεν
  choice: فقال
  rationale: تؤدي الفاء الانتقال الاستدراكي الخفيف والجواب المتصل بالسياق بصورة طبيعية في السرد العربي.
theological_decisions:
- issue: نطاق الإمكان الإلهي
  choice: تقرر الآية أن ما يتعذر في المجال البشري ممكن لدى الله، في سياق الخلاص ودخول الغني ملكوت الله.
  alternative: فهم العبارة على أنها تقرير فلسفي مطلق عن كل فعل يمكن تصوره.
  rationale: تحافظ الصياغة على عموم المقابلة اليونانية بين العجز البشري والقدرة الإلهية، من غير إضافة قيود إلى النص أو تحميله دعاوى فلسفية تتجاوز سياقه.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، بنبرة كتابية رصينة. استُعمل «البشر» للدلالة الإنسانية العامة، و«لدى الله» لإبراز جهة القياس والمجال.
