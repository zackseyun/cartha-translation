source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: ar
  text: 'أقول لكم: إن هذا الرجل نزل إلى بيته وقد بُرِّر دون الآخر[a]؛ لأن كل من يرفع نفسه سيُخفَض، ومن يخفض نفسه سيُرفَع.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وقد بُرِّر بالمقارنة بالآخر»؛ فالعبارة تقابل بين هذا الرجل والمصلّي الآخر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: وقد بُرِّر
  rationale: يحافظ المبني للمجهول على معنى الحكم المؤيد والنتيجة المستمرة التي يدل عليها اسم الفاعل التام المبني للمجهول، من غير تعيين الفاعل صراحة أو تحميل العبارة صياغة لاهوتية أوسع من النص.
- source_word: παρ’ ἐκεῖνον
  choice: دون الآخر
  rationale: تنقل المقابلة بين جابي الضرائب والفريسي بإيجاز عربي طبيعي، مع إبقاء إمكان فهم العبارة على معنى التفضيل أو المقارنة.
- source_word: κατέβη
  choice: نزل
  rationale: يحفظ صورة النزول المكانية من منطقة الهيكل بدل اختزال الفعل في معنى الرجوع.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: إلى بيته
  rationale: مقابل عربي مباشر وطبيعي يحفظ دلالة البيت أو المنزل.
- source_word: οὗτος
  choice: هذا الرجل
  rationale: يوضح أن الإشارة تعود إلى جابي الضرائب، ويحافظ على المقابلة الشخصية مع الفريسي.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: كل من يرفع نفسه
  rationale: يحفظ صيغة المبدأ العام والقوة الانعكاسية وصورة الرفع.
- source_word: ταπεινωθήσεται
  choice: سيُوضَع
  rationale: يحافظ على المبني للمجهول وعلى التضاد التصويري مع الرفع، مع ترك الفاعل الضمني غير مصرَّح به كما في اليونانية.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: ومن يضع نفسه
  rationale: يحفظ التوازي والانعكاس المقصودين في القول، ويعبر عن خفض الإنسان لنفسه بتعبير عربي موجز.
- source_word: ὑψωθήσεται
  choice: سيُرفَع
  rationale: يحافظ على المبني للمجهول وعلى صورة الانقلاب بين الرفع الذاتي والرفع الذي يناله المتواضع.
- source_word: ὅτι
  choice: لأن
  rationale: تبيّن أن المبدأ التالي هو تعليل للحكم السابق.
theological_decisions:
- issue: دلالة δικαιόω في خاتمة المثل
  choice: وقد بُرِّر
  alternative: وقد أُعلن بارًّا؛ وقد حُكم له بالبر
  rationale: يحفظ الاختيار معنى الحكم الإلهي المؤيد والبعد القضائي/التبريري، من غير حصره في تبرئة اجتماعية ولا إدخال بناء عقائدي كامل غير مصرَّح به في الآية.
- issue: المبني للمجهول في فعلي الخفض والرفع
  choice: سيُوضَع ... سيُرفَع
  alternative: سيضعه الله ... سيرفعه الله
  rationale: يترك الفاعل ضمنيًا كما في الأصل؛ والسياق يسمح بفهم المبني للمجهول على أنه فعل الله من غير إضافته صراحة إلى المتن.
- issue: الصيغة المفردة التمثيلية في المبدأ العام
  choice: كل من يرفع نفسه ... ومن يضع نفسه
  alternative: الذين يرفعون أنفسهم ... والذين يضعون أنفسهم
  rationale: تحفظ الصيغة المفردة العامة والتوازي الانعكاسي في اليونانية، وهي طبيعية وشاملة في العربية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدم «بُرِّر» للمحافظة على الثقل القضائي واللاهوتي للفظ اليوناني، ووُضع هامش يبيّن إمكان الصياغة المقارِنة. حُفظ التوازي البلاغي بين رفع النفس ووضعها، وبين الوضع والرفع بالمبني للمجهول.
