  terminology: اختيار «صالح» مناسب لـἀγαθός ويحافظ على التكرار المقصود في الأصل. واسم «يسوع» ولفظ «الله» مستعملان استعمالًا عربيًا معياريًا. لا توجد حواشٍ أو مراسٍ تحتاج إلى تدقيق.
