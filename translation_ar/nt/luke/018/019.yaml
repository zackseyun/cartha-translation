  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: فعل القول مع الضمير («فقال له يسوع»)، والسؤال السببي، ووصف «صالح» المتكرر، والنفي الشامل، والاستثناء الذي يعيّن الله. كما يحفظ السؤال دون أن يفرض نتيجة مسيحولوجية تفسيرية.'
