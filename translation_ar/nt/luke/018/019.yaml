id: LUK.18.19
reference: Luke 18:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: ar
  text: 'فقال له يسوع: «لماذا تدعوني صالحًا؟ لا أحد صالح إلا واحد، وهو الله.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تفيد الفاء هنا التعقيب والجواب في السياق بصورة طبيعية، من غير تشديد زائد على معنى الاستدراك الممكن في δὲ.
- source_word: εἶπεν ... αὐτῷ ὁ Ἰησοῦς
  choice: فقال له يسوع
  rationale: يحافظ هذا الترتيب العربي الطبيعي على فعل القول والضمير الصريح، من دون تحويله تفسيريًا إلى «أجابه».
- source_word: Τί
  choice: لماذا
  rationale: تأتي τί هنا في سؤال عن سبب إطلاق الوصف، ويؤديها «لماذا» بوضوح وطبيعية في العربية.
- source_word: με λέγεις ἀγαθόν
  choice: تدعوني صالحًا
  rationale: «تدعو» تعبر طبيعيًا عن إطلاق اللقب أو الوصف على شخص، و«صالحًا» خبر ثانٍ يحافظ على مباشرة العبارة.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: صالحًا / صالح
  rationale: يحافظ تكرار الجذر نفسه على الصلة اللفظية بين السؤال والتقرير، ولا يضيف تحديدًا أخلاقيًا غير مصرح به.
- source_word: οὐδεὶς
  choice: لا أحد
  rationale: تؤدي النفي الشامل بعبارة عربية واضحة وشائعة.
- source_word: εἰ μὴ εἷς
  choice: إلا واحد
  rationale: تنقل تركيب الاستثناء وتحفظ إبراز الواحد دون إضافة «فقط» غير الموجودة صراحة.
- source_word: ὁ θεός
  choice: وهو الله
  rationale: 'يجعل الضمير الفاصل عطف البيان مفهومًا وطبيعيًا بالعربية: الواحد المقصود هو الله، من غير تحويل العبارة إلى صياغة عقائدية موسعة.'
theological_decisions:
- issue: الدلالة المسيحولوجية لسؤال يسوع
  choice: الإبقاء على السؤال كما هو، من غير جعله إنكارًا لصلاح يسوع أو تصريحًا مباشرًا بألوهيته.
  alternative: صياغة تفسيرية تقول إن يسوع ينفي عن نفسه الصلاح المطلق، أو صياغة تجعله يصرح ضمنًا بأنه الله.
  rationale: النص اليوناني يطرح السؤال ثم يقصر الصلاح على الله، لكنه لا يصرح هنا بكيفية ربط الجملتين بهوية يسوع؛ لذلك ينبغي حفظ التوتر اللاهوتي وعدم حسمه داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «تدعوني» بمعنى «تسمّيني/تصفني»، و«صالح» للمحافظة على التكرار اليوناني وعلى النبرة الأخلاقية واللاهوتية من غير توسع تفسيري.
