  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: وجود الأرملة في المدينة، ومجيئها المتكرر إلى القاضي، وطلبها إنصافًا في نزاع مع خصمها. «كانت تأتي إليه مرارًا» تمثّل الماضي الناقص ἤρχετο تمثيلًا سليمًا، و«أنصِفني من خصمي» تحافظ على الإطار القضائي لـ Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου من دون إدخال معنى الثأر الشخصي.'
