source:
  edition: SBLGNT
  text: χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα· Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: ar
  text: 'وكانت في تلك المدينة أرملة، وكانت تأتي إليه مرارًا قائلة: «أنصِفني من خصمي».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أعطني حقي على خصمي»، أو: «اقضِ لي بالعدل في مواجهة خصمي». يمكن أن يدل الفعل اليوناني على نيل الإنصاف أو إثبات الحق قضائيًّا، لا على الانتقام الشخصي بالضرورة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: أرملة
  rationale: المقابل العربي المباشر والدقيق للمرأة التي مات زوجها، ويحفظ دلالتها الاجتماعية في سياق المثل.
- source_word: δὲ
  choice: و
  rationale: أداة ربط تواصل السرد من غير فرض معنى تقابلي لا يقتضيه السياق.
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: كانت في تلك المدينة
  rationale: صياغة عربية طبيعية تحافظ على وجود الأرملة في المدينة المذكورة.
- source_word: ἤρχετο πρὸς αὐτὸν
  choice: كانت تأتي إليه مرارًا
  rationale: الماضي الناقص في السياق يدل على الفعل المتكرر؛ وإضافة «مرارًا» تُظهر إلحاحها بوضوح.
- source_word: λέγουσα
  choice: قائلة
  rationale: حال موجزة وطبيعية تعبّر عن الكلام المصاحب لمجيئها المتكرر.
- source_word: Ἐκδίκησόν με
  choice: أنصِفني
  rationale: الفعل في هذا السياق القضائي يطلب إحقاق الحق والإنصاف، لا الانتقام الشخصي.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: من خصمي
  rationale: «خصمي» يلائم الطرف المقابل في نزاع قضائي، و«من» تحفظ بصورة طبيعية دلالة ἀπό مع فعل الإنصاف.
theological_decisions:
- issue: هل طلب الأرملة انتقام شخصي أم إنصاف قضائي؟
  choice: إنصاف قضائي
  alternative: الانتقام من الخصم
  rationale: السياق هو التماس امرأة من قاضٍ، ودلالة ἐκδικέω هنا تتسع لإحقاق الحق والتبرئة؛ لذلك تجنبت الصياغة التي توحي بثأر شخصي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت «مرارًا» لإبراز تكرار المجيء الكامن في صيغة الماضي الناقص، و«أنصِفني» للحفاظ على الإطار القضائي بلغة مفهومة.
