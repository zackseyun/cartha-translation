  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. حُفظ الاستمرار في الفعلين، وتُركت مسحة τις ضمن التنكير الطبيعي لأن ترجمتها حرفيًا بـ«رجل معيّن» ثقيلة وقد تبالغ في قوة التعيين.
