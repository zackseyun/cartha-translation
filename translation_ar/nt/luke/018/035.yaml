  text: Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν ⸀ἐπαιτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: ar
  text: وفيما كان يقترب من أريحا، كان رجل أعمى جالسًا بجانب الطريق يستعطي.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وفيما
  rationale: عوملت العبارة بوصفها انتقالًا سرديًا لا حدثًا مستقلًا بمعنى «حدث»، وحُمِل الربط طبيعيًا في افتتاح الجملة الزمنية.
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: كان يقترب من أريحا
  rationale: ينقل التركيب الزمني المعاصرة والاستمرار، وتحمل «من» معنى الحركة نحو المدينة مع الفعل «يقترب».
- source_word: τυφλός τις
  choice: رجل أعمى
  rationale: تفيد τις التنكير مع مسحة تعيين طفيفة، لكن «رجل أعمى» هو التعبير العربي الطبيعي، ولا يلزم إقحام «معيّن» الذي قد يوحي بتحديد أقوى من الأصل.
- source_word: ἐκάθητο
  choice: كان ... جالسًا
  rationale: يحافظ على الهيئة المستمرة للفعل الناقص وعلى وظيفة العبارة في رسم المشهد.
- source_word: παρὰ τὴν ὁδὸν
  choice: بجانب الطريق
  rationale: تعبير عربي واضح وطبيعي يدل على الموضع بمحاذاة الطريق.
- source_word: ἐπαιτῶν
  choice: يستعطي
  rationale: ينقل بإيجاز فعل طلب الصدقة المستمر، وهو أدق من إضافة «المال» غير المذكور في الأصل.
