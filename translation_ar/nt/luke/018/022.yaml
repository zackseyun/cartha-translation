  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: الجملة الزمنية بعد ἀκούσας δέ، والنقص الباقي الواحد، وشمول «كل ما لك»، وأمري البيع والتوزيع على الفقراء، ووعد الكنز في السماوات، ثم دعوة الإقبال والاتباع. صيغة «ينقصك شيء واحد بعد» تمثل المعنى بوضوح، وإن غيّرت ترتيب الموضوع الطبيعي بين اليونانية والعربية دون أثر معنوي. والضمير في «ووزّعه» توضيح عربي مقبول لمفعول «وزّع» المفهوم من السياق.'
