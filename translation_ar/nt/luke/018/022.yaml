  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: ar
  text: 'فَلَمَّا سَمِعَ يَسُوعُ هٰذَا، قَالَ لَهُ: «يَنْقُصُكَ شَيْءٌ وَاحِدٌ بَعْدُ: بِعْ كُلَّ مَا لَكَ وَوَزِّعْهُ عَلَى الْفُقَرَاءِ، فَيَكُونَ لَكَ كَنْزٌ فِي السَّمَاوَاتِ[a]؛ ثُمَّ تَعَالَ وَاتْبَعْنِي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «في السماوات». وقد يُقال بالعربية أيضًا: «في السماء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: فَلَمَّا سَمِعَ يَسُوعُ هٰذَا
  rationale: صيغ اسم الفاعل الماضي مع δέ في جملة زمنية عربية طبيعية، وأُعيد الضمير المفهوم إلى الكلام السابق بلفظ «هذا».
- source_word: Ἔτι ἕν σοι λείπει
  choice: يَنْقُصُكَ شَيْءٌ وَاحِدٌ بَعْدُ
  rationale: يحفظ معنى النقص الباقي وعددَه، مع ترتيب عربي واضح؛ و«بعدُ» تؤدي معنى ἔτι في هذا السياق.
- source_word: πάντα ὅσα ἔχεις
  choice: كُلَّ مَا لَكَ
  rationale: تعبير عربي موجز وطبيعي يحفظ الشمول في الأصل.
- source_word: πώλησον
  choice: بِعْ
  rationale: أمر مباشر يوافق قوة صيغة الأمر اليونانية.
- source_word: διάδος πτωχοῖς
  choice: وَوَزِّعْهُ عَلَى الْفُقَرَاءِ
  rationale: «وزّع» يحفظ دلالة التفريق والتوزيع في διαδίδωμι، والضمير يوضح أن المبيع أو حصيلته هو موضوع التوزيع دون تغيير المقصود.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: فَيَكُونَ لَكَ كَنْزٌ فِي السَّمَاوَاتِ
  rationale: صياغة عربية طبيعية لمعنى الامتلاك المستقبلي، مع إبقاء جمع οὐρανοῖς كما في النص اليوناني.
- source_word: δεῦρο ἀκολούθει μοι
  choice: ثُمَّ تَعَالَ وَاتْبَعْنِي
  rationale: «تعال» تؤدي الدعوة إلى الإقبال، و«اتبعني» تحمل في السياق معنى التلمذة المستمرة من غير إثقال العبارة بصيغة تفسيرية.
theological_decisions:
- issue: مدى أمر التجرد وعلاقته بالتلمذة
  choice: أُبقيت الأوامر موجهة مباشرة إلى الرجل، وانتهت بالدعوة إلى اتباع يسوع.
  alternative: اعتبار الكلام حكمًا عامًا صريحًا يلزم كل مؤمن ببيع جميع ممتلكاته، أو اعتباره رمزًا محضًا بلا مطلب اقتصادي فعلي.
  rationale: النص يورد أمرًا عينيًا حقيقيًا لهذا المخاطَب، لكنه لا يصرّح في هذه الآية وحدها بتعميمه على الجميع؛ لذلك تحافظ الترجمة على حدة الطلب والتوتر اللاهوتي من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، بأوامر مباشرة وتراكيب مألوفة. أُبقي جمع «السماوات» موافقةً للأصل، مع بيان البديل الاصطلاحي في الحاشية.
