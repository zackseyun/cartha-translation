lexical_decisions:
- source_word: Εἶπαν
  choice: فقال
  rationale: الفعل في الماضي البسيط يقدّم جواب السامعين بوصفه حدثًا سرديًا، وربطُه بالفاء طبيعي في العربية.
- source_word: δὲ
  choice: الفاء في «فقال»
  rationale: تؤدي الفاء وظيفة الانتقال السردي والتعقيب التي تؤديها δέ هنا، من غير إثقال العبارة.
- source_word: οἱ ἀκούσαντες
  choice: الذين سمعوا
  rationale: ترجمة مباشرة لاسم الفاعل المستعمل استعمال الاسم؛ ومفعول السماع مفهوم من السياق فلا حاجة إلى إضافته.
- source_word: Καὶ
  choice: الفاء في «فمَن»
  rationale: تنقل الفاء استئناف السؤال بوصفه نتيجة مندهشة لما سبق، وهو تعبير عربي طبيعي يحفظ قوة الربط في καί.
- source_word: τίς
  choice: مَن
  rationale: أداة الاستفهام العربية المباشرة عن الشخص.
- source_word: δύναται
  choice: يستطيع
  rationale: تعبّر بوضوح وبأسلوب عربي معاصر عن القدرة أو الإمكان.
- source_word: σωθῆναι
  choice: أن يخلُص
  rationale: يحفظ المبني للمجهول دلاليًا في تركيب عربي مألوف، ويؤدي معنى الخلاص المقصود في سياق دخول ملكوت الله.
theological_decisions:
- issue: دلالة σωθῆναι في السياق
  choice: أن يخلُص
  alternative: أن يُنقَذ
  rationale: السياق السابق يتناول دخول ملكوت الله، ولذلك فالمعنى الخلاصي هو الأرجح، مع عدم إضافة تحديد عقائدي لا يصرّح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على نبرة الدهشة في السؤال. لا توجد حواشٍ لازمة لهذه الآية.
