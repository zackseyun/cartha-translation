  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: ar
  text: أَمَّا هُوَ، فَلَمَّا سَمِعَ هَذَا حَزِنَ حُزْنًا شَدِيدًا[a]، لِأَنَّهُ كَانَ غَنِيًّا جِدًّا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اغتمَّ جدًّا». تدل الكلمة اليونانية على حزن أو ضيق بالغ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: أَمَّا هُوَ، فَـ
  rationale: تُبرز أداة الاستدراك الانتقال إلى رد فعله والمقابلة مع ما سبق، بصياغة عربية طبيعية.
- source_word: ἀκούσας
  choice: لَمَّا سَمِعَ
  rationale: اسم الفاعل الأوريستي ذو دلالة زمنية هنا؛ و«لما سمع» يحفظ تتابع السماع ثم التأثر.
- source_word: ταῦτα
  choice: هَذَا
  rationale: مع أن اليونانية تستعمل جمعًا محايدًا، فالمفرد الإشاري في العربية يحيل طبيعيًا إلى مجموع الكلام السابق من غير تغيير للمرجع.
- source_word: περίλυπος
  choice: حَزِنَ حُزْنًا شَدِيدًا
  rationale: ينقل شدة الحزن والضيق التي يفيدها الوصف اليوناني، بعبارة عربية واضحة ومألوفة.
- source_word: ἐγενήθη
  choice: حَزِنَ
  rationale: الفعل اليوناني يدل على دخوله في حالة الحزن؛ وصياغة «حزن» تؤدي التحول إلى الحالة طبيعيًا، بدل تعبير حرفي ثقيل مثل «صار حزينًا».
- source_word: πλούσιος
  choice: غَنِيًّا
  rationale: المقابل العربي المباشر والطبيعي للصفة التي تدل على امتلاك الثروة.
- source_word: σφόδρα
  choice: جِدًّا
  rationale: تنقل درجة التكثيف القوية في وصف غناه بلغة عربية معاصرة واضحة.
- source_word: γὰρ
  choice: لِأَنَّهُ
  rationale: 'توضح العلاقة التعليلية: شدة غناه تفسر حزنه عند سماع الطلب.'
