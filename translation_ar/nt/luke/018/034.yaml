  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: ar
  text: أما هم فلم يفهموا شيئًا من هذه الأمور، وكان هذا الكلام مخفيًّا عنهم[a]، ولم يدركوا ما كان يُقال.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لا يذكر النص من أو ما جعل هذا الكلام مخفيًّا عنهم.
    reason: alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: يفهموا
  rationale: يدل الفعل هنا على الفهم الذهني لكلام يسوع السابق، و«يفهموا» تعبير عربي طبيعي ودقيق.
- source_word: οὐδὲν τούτων
  choice: شيئًا من ذلك
  rationale: يحيل التعبير إلى مجمل الأقوال السابقة، وهذه الصياغة عربية سلسة وتحفظ معنى النفي الشامل.
- source_word: τὸ ῥῆμα τοῦτο
  choice: هذا الكلام
  rationale: يمكن أن تعني ῥῆμα القول أو الكلام أو الأمر؛ و«هذا الكلام» تلائم السياق وتحيل بوضوح إلى ما قاله يسوع.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: كان مخفيًّا عنهم
  rationale: تحفظ الصياغة حالة الخفاء الناتجة عن فعل سابق، كما تبقي المبني للمجهول من غير تعيين من أخفاه.
- source_word: ἐγίνωσκον
  choice: يدركوا
  rationale: يفيد الفعل هنا إدراك معنى ما قيل؛ واختيار «يدركوا» يحفظ قدرًا من التمييز الأسلوبي عن συνῆκαν المترجم «يفهموا» من غير إخلال بالسياق.
- source_word: τὰ λεγόμενα
  choice: ما كان يُقال
  rationale: صياغة عربية طبيعية تحافظ على دلالة الكلام الجاري أو المقول في ذلك السياق.
theological_decisions:
- issue: طبيعة خفاء الكلام عن التلاميذ
  choice: الإبقاء على المبني للمجهول من غير تحديد الفاعل
  alternative: التصريح بأن الله أخفاه عنهم، أو تفسير الخفاء بأنه مجرد ارتباك نفسي
  rationale: النص اليوناني لا يعيّن من أو ما جعل الكلام مخفيًّا، ولذلك ينبغي صون هذا الغموض والتوتر اللاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «أما هم» لإبراز الضمير اليوناني، وحُفظ التتابع الثلاثي الذي يشدد على عدم فهم التلاميذ.
