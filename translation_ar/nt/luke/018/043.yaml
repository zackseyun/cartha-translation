base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: ar
  text: 'وفي الحال أبصر[a]، وكان يتبعه[b] ممجِّدًا الله. ولما رأى الشعب كله ذلك، قدَّم حمدًا لله.


    [a] أو: «عاد يبصر» أو «استعاد بصره». يمكن أن يدل الفعل اليوناني على الإبصار أو استعادة البصر؛ وقد اختير «أبصر» لأنه طبيعي في السياق ولا يفترض أنه كان مبصرًا من قبل.


    [b] أو: «أخذ يتبعه». صيغة الفعل اليوناني تدل على فعل مستمر في الماضي.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عاد يبصر» أو «استعاد بصره». يمكن أن يدل الفعل اليوناني على الإبصار أو استعادة البصر؛ وقد اختير «أبصر» لأنه طبيعي في السياق ولا يفترض أنه كان مبصرًا من قبل.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أخذ يتبعه». صيغة الفعل اليوناني تدل على فعل مستمر في الماضي.'
    reason: aspectual_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: في الحال
  rationale: ينقل معنى وقوع الحدث بلا تأخير، وهو تعبير عربي فصيح وطبيعي.
- source_word: ἀνέβλεψεν
  choice: أبصر
  rationale: الفعل في سياق الشفاء يدل على حصول البصر أو استعادته. «أبصر» موجز وطبيعي ولا يحسم ما إذا كان الرجل قد أبصر سابقًا.
- source_word: ἠκολούθει
  choice: أخذ يتبعه
  rationale: ينقل استمرار الفعل الذي تفيده صيغة الماضي الناقص اليونانية، مع الحفاظ على سلاسة السرد العربي.
- source_word: δοξάζων
  choice: ممجِّدًا
  rationale: يحافظ على معنى إسناد المجد إلى الله ويميّزه عن تعبير الحمد الوارد لاحقًا.
- source_word: πᾶς ὁ λαός
  choice: الشعب كله
  rationale: يحافظ على الدلالة الجمعية وعلى بنية المفرد الجمعي في اليونانية، بصياغة عربية واضحة.
- source_word: ἰδών
  choice: لما رأى ... ذلك
  rationale: يعبّر عن الفعل المصاحب، و«ذلك» يوضح أن المقصود هو ما حدث من شفاء الرجل واستجابته دون حصر زائد.
- source_word: ἔδωκεν αἶνον
  choice: قدَّم الحمد
  rationale: يحافظ على التركيب اليوناني الحرفي «أعطى حمدًا» في صياغة عربية طبيعية نسبيًا، بدل اختزاله إلى فعل واحد.
- source_word: θεός / θεῷ
  choice: الله
  rationale: المقابل العربي المعياري، مع إبقاء تكرار الاسم كما في النص اليوناني.
theological_decisions:
- issue: دلالة صيغة ἠκολούθει على استمرار اتباع الرجل ليسوع
  choice: أخذ يتبعه
  alternative: وكان يتبعه / وتبعه
  rationale: الصيغة المختارة تُظهر أن الاتباع صار فعلًا مستمرًا بعد الشفاء، من غير تحميل العبارة تصورًا مذهبيًا إضافيًا؛ وتثبت الحاشية البديل الأقرب إلى البنية اليونانية.
- issue: هل ἀνέβλεψεν يعني أنه كان مبصرًا سابقًا
  choice: أبصر
  alternative: استعاد بصره / عاد يبصر
  rationale: السياق يثبت حصول البصر، لكنه لا يثبت بذاته أن الرجل كان مبصرًا من قبل؛ لذلك تتجنب الصياغة الأساسية حسم هذا التفصيل وتذكر البدائل في الحاشية.
- issue: المفرد الجمعي في πᾶς ὁ λαός
  choice: الشعب كله ... قدَّم
  alternative: الناس جميعًا ... قدَّموا
  rationale: يحافظ الاختيار على التطابق بالمفرد الموجود في اليونانية وعلى الصورة الجمعية للشعب، دون تغيير دلالة اشتراك الجميع في الحمد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «في الحال» بدل تعبير أثقل، وحوفظ على التمييز بين «ممجِّدًا» و«الحمد» وعلى تكرار اسم الله. وُضعت علامتا الحاشيتين في المتن مباشرة بعد اللفظين المعنيين.
