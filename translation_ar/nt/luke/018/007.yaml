  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: ar
  text: أفلا يُنصِفُ اللهُ مختاريه الذين يصرخون إليه نهارًا وليلًا؟ وهل يتأخر طويلًا عن إنصافهم؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة: «مع أنه يتأنّى معهم»، أو: «وهل يتأنّى معهم؟» فالعبارة اليونانية قد تدل على الصبر وطول الأناة، لا على تأخير الإنصاف وحده.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: يُنصِف
  rationale: يفيد السياق منح المظلوم حقه وإجراء العدل له، لا الانتقام الشخصي؛ و«يُنصِف» تعبير عربي طبيعي يحفظ المعنى القضائي.
- source_word: ἐκλεκτῶν
  choice: مختاريه
  rationale: الصفة مستعملة استعمال الاسم، والمقصود الذين اختارهم الله. تحافظ «مختاريه» على هذا المعنى من غير إدخال تحديد مذهبي أضيق.
- source_word: βοώντων
  choice: الذين يصرخون
  rationale: يدل الفعل على نداء ملحّ شديد، وهو مناسب لسياق الدعاء المتواصل.
- source_word: ἡμέρας καὶ νυκτός
  choice: نهارًا وليلًا
  rationale: يحفظ التعبير الزمني وصورة الاستمرار والإلحاح الواردة في اليونانية.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: وهل يتمهّل طويلًا في أمرهم؟
  rationale: يحفظ في المتن احتمال تأخر الفعل الذي يلائم الانتقال إلى سرعة الإنصاف في العدد التالي، مع إبقاء معنى الصبر أو طول الأناة في الحاشية بسبب الغموض الدلالي والتركيبي.
- source_word: οὐ μὴ ποιήσῃ
  choice: أفلا يُنصِف
  rationale: السؤال البلاغي ذو النفي المؤكد ينتظر جوابًا بالإيجاب؛ وتؤدي «أفلا» هذه القوة بصورة عربية فصيحة وطبيعية.
- source_word: θεὸς
  choice: الله
  rationale: المقابل العربي المعياري الواضح للاسم في هذا السياق.
theological_decisions:
- issue: دلالة μακροθυμεῖ ἐπ’ αὐτοῖς وعلاقتها بفعل الله وصفته
  choice: 'صيغت في المتن سؤالًا عن التمهّل في إنصافهم: «وهل يتمهّل طويلًا في أمرهم؟»'
  alternative: 'يمكن فهمها بمعنى صبر الله عليهم أو طول أناته نحوهم، أو بصيغة تنازلية: «مع أنه يطيل أناته عليهم».'
  rationale: سياق العدد التالي يرجّح إبراز عدم إبطاء الله في إنصاف مختاريه، لكن العبارة اليونانية تحتمل معنى الصبر وطول الأناة؛ لذلك لم يُحسم التوتر، بل ذُكر الاحتمال الآخر في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. استُعمل «مختاريه» بدل مصطلح مذهبي تقني، و«يُنصِف» لإبراز رد الحق قضائيًا دون إيحاء بالانتقام الشخصي. قُسّمت الجملة إلى سؤالين للمقروئية مع الحفاظ على ترابط الحجة البلاغية.
