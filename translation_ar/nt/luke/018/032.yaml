  text: παραδοθήσεται γὰρ τοῖς ἔθνεσιν καὶ ἐμπαιχθήσεται καὶ ὑβρισθήσεται καὶ ἐμπτυσθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: ar
  text: لأنه سيُسلَّم إلى غير اليهود، ويُستهزأ به، ويُهان، ويُبصق عليه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى الأمم». والمقصود هنا تحديدًا غير اليهود.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: سيُسلَّم
  rationale: يحفظ صيغة المستقبل المبني للمجهول ومعنى نقله إلى أيدي آخرين، من غير تضييق المعنى إلى «سيُخان».
- source_word: γὰρ
  choice: لأنه
  rationale: تنقل القوة التفسيرية التي تربط الآية بما سبق، وتلائم العربية الحديثة في هذا السياق.
- source_word: τοῖς ἔθνεσιν
  choice: إلى غير اليهود
  rationale: المقصود في السياق التاريخي أناس من الأمم، أي غير اليهود، لا الدول أو الشعوب بمعناها السياسي الحديث.
- source_word: ἐμπαιχθήσεται
  choice: يُستهزأ به
  rationale: تؤدي معنى السخرية والتهكم بصياغة عربية طبيعية ورصينة.
- source_word: ὑβρισθήσεται
  choice: يُهان
  rationale: تنقل معنى المعاملة المهينة أو المشينة بإيجاز، من غير حصر الفعل في الإهانة اللفظية وحدها.
- source_word: ἐμπτυσθήσεται
  choice: يُبصق عليه
  rationale: تحفظ الفعل الحسي المحدد وما يتضمنه من إذلال.
theological_decisions:
- issue: مرجع الفاعل المستتر في الأفعال المبنية للمجهول
  choice: أُبقي الفاعل مستترًا في صيغ المبني للمجهول العربية، ومرجعه ابن الإنسان في السياق السابق.
  alternative: التصريح بضمير منفصل مثل «هو» أو تكرار «ابن الإنسان».
  rationale: الأفعال اليونانية مفردة غائبة مبنية للمجهول بلا فاعل مصرح به، ومرجعها واضح من لوقا 18:31؛ والعربية لا تحتاج إلى إضافة ضمير مستقل.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ورصينة. حُفظ تتابع الأفعال المبنية للمجهول، واستُعمل «غير اليهود» في المتن لبيان المعنى المقصود من «الأمم» للقارئ المعاصر، مع إثبات البديل الحرفي في الحاشية.
