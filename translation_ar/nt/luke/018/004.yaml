  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: ar
  text: 'ولم يشأ أن يفعل ذلك مدةً من الزمن، لكنه قال بعد ذلك في نفسه: «مع أني لا أخاف الله ولا أحترم أحدًا[a]،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «إنسانًا»، والمفرد هنا مستعمل بمعنى عام.'
    reason: توضيح صيغة المفرد العام في الأصل مع إبقاء المتن عربيًا طبيعيًا.
lexical_decisions:
- source_word: ἤθελεν
  choice: لم يشأ أن يفعل ذلك
  rationale: ينقل معنى الإرادة المنفية، ويُظهر المفعول المفهوم من السياق السابق دون تحديده بما يتجاوز النص.
- source_word: ἐπὶ χρόνον
  choice: مدةً من الزمن
  rationale: تعبير عربي واضح يحافظ على امتداد الرفض فترة غير محددة.
- source_word: μετὰ ταῦτα δὲ
  choice: لكنه قال بعد ذلك
  rationale: يحفظ التعاقب الزمني مع التحول المقابل الذي تؤديه δὲ.
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: قال في نفسه
  rationale: صياغة عربية مألوفة تحافظ على صورة الكلام الداخلي بدل اختزالها إلى مجرد التفكير.
- source_word: Εἰ καὶ
  choice: مع أني
  rationale: يؤدي المعنى التنازلي المناسب للسياق، لا معنى الشرط الاحتمالي.
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: لا أخاف الله
  rationale: يحافظ على العبارة الكتابية المباشرة وعلى دلالة النقص الأخلاقي في اعتراف القاضي.
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: ولا أحترم أحدًا
  rationale: ينقل معنى المراعاة والاعتبار في ἐντρέπομαι بصياغة عربية طبيعية، ويعبّر «أحدًا» عن المفرد اليوناني المستعمل استعمالًا عامًا.
theological_decisions:
- issue: المفرد العام ἄνθρωπον في مقابلة الله
  choice: أحدًا
  alternative: إنسانًا
  rationale: «أحدًا» مفرد عام في العربية ويبين أن القاضي لا يحترم أي شخص، مع إبقاء المقابلة الأخلاقية بين عدم مخافة الله وعدم مراعاة البشر، من غير تخصيص المعنى بالذكور.
