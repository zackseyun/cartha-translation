lexical_decisions:
- source_word: σταθεὶς
  choice: توقّف
  rationale: اسم الفاعل الأوريستي من ἵστημι مستعمل هنا بمعنى لازم، والسياق يدل على أن يسوع أوقف سيره؛ و«توقّف» أفصح وأطبع في العربية من التعبير الحرفي «وقف ثابتًا».
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط سردية خفيفة، والفاء تنقل تتابع الحدث وارتباطه بما قبله من غير أن تضيف معنى تضاد قويًا.
- source_word: ἐκέλευσεν
  choice: أمر
  rationale: يحفظ معنى إصدار الأمر والسلطة الكامن في κελεύω، وهو تعبير عربي طبيعي ومباشر.
- source_word: ἀχθῆναι
  choice: أن يُقاد
  rationale: المصدر المبني للمجهول من ἄγω يدل على نقل الرجل نحو يسوع، و«يُقاد» ملائم خصوصًا لحال الرجل الأعمى، مع بقاء «يُؤتى به» احتمالًا صحيحًا أوسع.
- source_word: πρὸς αὐτόν
  choice: إليه
  rationale: ينقل اتجاه الحركة نحو يسوع بإيجاز عربي واضح.
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: ولما اقترب
  rationale: ينقل التركيب المطلق بالمضاف إليه ومعناه الزمني بصياغة عربية طبيعية؛ والضمير عائد إلى الرجل المذكور.
- source_word: ἐπηρώτησεν αὐτόν
  choice: سأله
  rationale: ἐπερωτάω هنا يعني السؤال، والضمير المتصل يحافظ على الإيجاز وسلاسة السرد.
- source_word: ὁ Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المعيارية المستقرة للاسم الشخصي.
