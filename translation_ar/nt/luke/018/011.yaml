review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، لكن «خاطفين» يوحي في الاستعمال العربي الحديث بخاطفي الأشخاص، ولا ينقل بدقة ἅρπαγες، أي السالبين أو الناهبين الجشعين. كذلك «وأخذ يصلّي» يضيف إيحاءً ابتدائيًا غير لازم للفعل الناقص προσηύχετο، و«هكذا» لا يعبّر بوضوح عن ταῦτα («هذه الكلمات/الأمور»).
  naturalness: الصياغة فصيحة وواضحة عمومًا. وتكون أكثر طبيعية ودقة باستبدال «وأخذ يصلّي هكذا» بـ«وكان يصلّي بهذه الكلمات»، وباختيار «السالبين» بدل «خاطفين».
  terminology: «الفريسي» و«جابي الضرائب» مناسبان. و«الظالمين» و«الزناة» مناسبان في سياق تعداد الرذائل. ينبغي أن تصف الحاشية القراءة البديلة بأنها «يصلّي إلى نفسه»، لا «في نفسه»، لأن الأخيرة قد توحي بمجرد الصلاة الصامتة، وهي ليست وجه الالتباس المقصود في πρὸς ἑαυτόν.
  issues:
  - severity: medium
    issue: «خاطفين» مقابل ἅρπαγες
    rationale: «خاطفون» يُفهم اليوم غالبًا بمعنى مختطفي الأشخاص، بينما تشير الكلمة اليونانية إلى السالبين أو الناهبين/المستغلين الجشعين. «السالبين» يحفظ المعنى العام دون تضييقه إلى ابتزاز مالي أو تغيير نوع الجريمة.
  - severity: low
    issue: «وأخذ يصلّي هكذا»
    rationale: «أخذ» يضيف معنى الشروع، في حين أن προσηύχετο فعل ماضٍ ناقص يدل على استمرار الصلاة. كما أن ταῦτα جمع، والأدق عربيًا «بهذه الكلمات».
  - severity: medium
    issue: 'صياغة البديل في الحاشية: «في نفسه»'
    rationale: البديل التفسيري الذي تتيحه πρὸς ἑαυτόν هو «إلى نفسه/لنفسه» على نحو ساخر، لا مجرد «في نفسه» التي قد تعني الصلاة الصامتة. ينبغي صون هذا الفرق وعدم توسيع البديل إلى معنى غير محدد في النص.
