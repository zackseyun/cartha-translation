source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: ar
  text: 'أَمَّا الْفَرِّيسِيُّ فَوَقَفَ مُنْفَرِدًا، وَكَانَ يُصَلِّي بِهَذِهِ الْكَلِمَاتِ[a]: «يَا اللهُ، أَشْكُرُكَ لِأَنِّي لَسْتُ مِثْلَ سَائِرِ النَّاسِ: السَّالِبِينَ وَالظَّالِمِينَ وَالزُّنَاةِ، وَلَا حَتَّى مِثْلَ جَابِي الضَّرَائِبِ هَذَا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وقف يصلّي إلى نفسه بهذه الكلمات». قد تعني العبارة اليونانية أنه وقف منفردًا، أو أن صلاته كانت، على سبيل المفارقة، موجَّهة إلى ذاته.'
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: فَوَقَفَ
  rationale: ينقل اسم الفاعل الماضي بوصفه فعلًا ظرفيًا يمهّد لهيئة الفريسي، ويأتي طبيعيًا في السرد العربي.
- source_word: πρὸς ἑαυτὸν
  choice: مُنْفَرِدًا
  rationale: يعبّر في المتن عن المعنى المكاني المحتمل، أي وقوفه على حدة، مع إبقاء المعنى الانعكاسي المحتمل في الحاشية.
- source_word: ταῦτα προσηύχετο
  choice: وَأَخَذَ يُصَلِّي هَكَذَا
  rationale: ينقل استمرار الفعل الناقص، ويقدّم مضمون الصلاة اللاحق بصياغة عربية طبيعية؛ و«هكذا» تؤدي وظيفة الإشارة إلى الكلام الآتي دون ثقل حرفية «هذه الأشياء».
- source_word: εὐχαριστῶ σοι
  choice: أَشْكُرُكَ
  rationale: المقابل العربي المباشر والطبيعي لعبارة الشكر الموجّهة إلى الله.
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: مِثْلَ سَائِرِ النَّاسِ
  rationale: يحفظ معنى λοιποί، أي الباقين أو السائرين، ويستعمل «الناس» للدلالة البشرية العامة بوضوح معاصر.
- source_word: ἅρπαγες
  choice: خَاطِفِينَ
  rationale: يحفظ دلالة الاستيلاء الجشع والسلب في اللفظ اليوناني، من غير حصرها في ابتزاز مالي فحسب.
- source_word: ἄδικοι
  choice: ظَالِمِينَ
  rationale: ينقل البعد الأخلاقي الواسع لعدم العدل بصياغة عربية كتابية مفهومة وطبيعية.
- source_word: μοιχοί
  choice: زُنَاةً
  rationale: مقابل عربي موجز للاسم الجمع الدال على مرتكبي الزنى، ويلائم تعداد الرذائل.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: وَلَا حَتَّى مِثْلَ جَابِي الضَّرَائِبِ هَذَا
  rationale: «ولا حتى» تنقل تصعيد ἢ καὶ ونبرة الاحتقار، و«جابي الضرائب» مقابل واضح وحديث لـ τελώνης.
theological_decisions:
- issue: دلالة πρὸς ἑαυτόν في وصف صلاة الفريسي
  choice: 'فُهمت مكانيًا في المتن: «وقف منفردًا»'
  alternative: 'يمكن أن تُفهم انعكاسيًا: «وقف يصلّي في نفسه بهذه الكلمات» أو، على نحو أشد مفارقة، «كان يصلّي إلى نفسه»'
  rationale: التركيب اليوناني يحتمل أن يصف وقوفه منفردًا، كما يحتمل أن يتصل بفعل الصلاة فيدل على صلاته في نفسه أو يوحي بأنها متمحورة حول ذاته. اختير المعنى المكاني في المتن لسلاسة المشهد، وحُفظ الاحتمال الآخر في الحاشية من غير حسم للتوتر اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعمل التشكيل لتيسير القراءة، مع تجنب التراكيب المذهبية أو التفسيرية الزائدة، والمحافظة على غموض العبارة اليونانية في الحاشية.
