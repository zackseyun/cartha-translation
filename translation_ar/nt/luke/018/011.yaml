  to: 'أَمَّا الْفَرِّيسِيُّ فَوَقَفَ مُنْفَرِدًا، وَكَانَ يُصَلِّي بِهَذِهِ الْكَلِمَاتِ[a]: «يَا اللهُ، أَشْكُرُكَ لِأَنِّي لَسْتُ مِثْلَ سَائِرِ النَّاسِ: السَّالِبِينَ وَالظَّالِمِينَ وَالزُّنَاةِ، وَلَا حَتَّى مِثْلَ جَابِي الضَّرَائِبِ هَذَا».'
  rationale: تُصحَّح دلالة ἅρπαγες إلى «السالبين»، ويُحافَظ على استمرارية προσηύχετο وعلى إشارة ταῦτα إلى الكلام الآتي بعبارة «وكان يصلّي بهذه الكلمات». كما تُنقَّح الحاشية لتعكس بدقة الالتباس بين المعنى المكاني («منفردًا») والقراءة الانعكاسية/الساخرة («إلى نفسه») دون تفسير مذهبي أو إضافة معنى الصلاة الصامتة.
