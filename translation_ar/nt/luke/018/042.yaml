  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: ar
  text: 'فقال له يسوع: «أبصر[a]؛ إيمانك قد خلَّصك[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «استعد بصرك» أو «أبصر من جديد». يمكن أن يعني الأمر اليوناني، في سياق الشفاء، استعادة البصر.
    reason: lexical_alternative
  - marker: b
    text: أو «قد شفاك» أو «قد عافاك». يمكن أن يدل الفعل اليوناني على الشفاء كما يدل على الخلاص.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: فـ
  rationale: رابط سردي طبيعي في العربية يصل هذه الجملة بما قبلها من غير إضافة دلالة تفسيرية زائدة.
- source_word: ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: قال له يسوع
  rationale: صياغة عربية مباشرة تحفظ فعل القول والمفعول غير المباشر، وتضع الفاعل بعد الفعل على نحو طبيعي.
- source_word: Ἀνάβλεψον
  choice: أبصر من جديد
  rationale: يدل الفعل في سياق شفاء الأعمى على عودة البصر، لا على مجرد النظر إلى أعلى. وتُبقي العبارة معنى الاستعادة واضحًا بلغة مفهومة.
- source_word: πίστις
  choice: إيمانك
  rationale: «الإيمان» هو المقابل العربي المألوف، ويدل هنا على اتكال الرجل الواثق بيسوع من غير تضييق اللفظ إلى معنى نفسي محض.
- source_word: σέσωκέν σε
  choice: قد خلَّصك
  rationale: تحفظ «خلَّصك» اتساع فعل σῴζω بين الخلاص والشفاء في هذا السياق، بينما تنقل «قد» دلالة الحالة الحاضرة الناتجة عن الفعل التام.
theological_decisions:
- issue: مدى دلالة σῴζω في رواية شفاء
  choice: قد خلَّصك
  alternative: قد شفاك / قد عافاك
  rationale: قد يشير الفعل في السياق مباشرةً إلى الشفاء الجسدي، لكنه يحمل أيضًا معنى الخلاص الأوسع. لذلك تحافظ صيغة «خلَّصك» على التوتر الدلالي واللاهوتي بدل حصره في العلاج البدني.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت صياغة موجزة تناسب القول المباشر، مع إبقاء التباس الفعل بين الشفاء والخلاص ظاهرًا في الحاشية.
