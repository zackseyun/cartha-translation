base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: ar
  text: 'أنت تعرف الوصايا: لا تزنِ، لا تقتل[a]، لا تسرق، لا تشهد بالزور، أكرم أباك وأمك.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الفعل المترجم «تقتل» يدل في هذا السياق على القتل الإجرامي، لا على كل إزهاق للحياة.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: الوصايا
  rationale: يدل اللفظ على أوامر ملزمة، وفي هذا السياق يشير إلى وصايا معروفة من الوصايا العشر؛ لذلك تحافظ «الوصايا» على الصدى الكتابي والقانوني.
- source_word: οἶδας
  choice: أنت تعرف
  rationale: مع أن الصيغة تامة من حيث البناء، فإنها تؤدي معنى الحاضر في اليونانية الكوينه؛ و«تعرف» هي المقابل العربي الطبيعي.
- source_word: Μὴ μοιχεύσῃς
  choice: لا تزنِ
  rationale: ينقل النهي عن الزنى بعبارة عربية موجزة ومألوفة، ويحافظ على صيغة الوصية المباشرة.
- source_word: Μὴ φονεύσῃς
  choice: لا تقتل
  rationale: الفعل اليوناني يدل على القتل الإجرامي لا على كل إزهاق للحياة. والصياغة «لا تقتل» هي العبارة العربية الموروثة المعروفة في سياق الوصايا، ويُفهم معناها هنا ضمن هذا الإطار.
- source_word: Μὴ κλέψῃς
  choice: لا تسرق
  rationale: مقابل مباشر وواضح للفعل الذي يعني السرقة.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: لا تشهد بالزور
  rationale: يحفظ معنى الإدلاء بشهادة كاذبة، كما يحافظ على الصدى المألوف لصياغة الوصايا العشر.
- source_word: Τίμα
  choice: أكرم
  rationale: ينقل معنى إظهار الكرامة والتوقير للوالدين، وهو التعبير العربي الكتابي الطبيعي في هذا السياق.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: أباك وأمك
  rationale: صياغة عربية طبيعية تذكر كلا الوالدين وتحفظ ضمير المخاطب دون تكرار غير لازم.
theological_decisions:
- issue: صياغة نواهي الوصايا العشر
  choice: استعمال النهي العربي المباشر «لا...»
  alternative: صياغة تقريرية مستقبلية أو أكثر تقليدية
  rationale: اليونانية تستعمل صيغ نهي مباشرة. ويؤدي «لا...» قوة الوصية بوضوح في العربية المعاصرة مع الحفاظ على طابع الاقتباس من الوصايا العشر؛ وهذا قرار أسلوبي لا عقائدي.
- issue: مدى دلالة φονεύω
  choice: «لا تقتل» في الصياغة المتوارثة للوصية، مع بيان الدقة في الحاشية
  alternative: «لا ترتكب جريمة قتل»
  rationale: الفعل أضيق من مطلق القتل ويدل على القتل الإجرامي. لكن «لا تقتل» هي الصياغة العربية الموجزة المعروفة للوصية، أما الحاشية فتحفظ التحديد المعجمي دون إثقال المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة، مع الحفاظ على الإيجاز والإيقاع المعروفين في صياغة الوصايا العشر. أُثبتت علامة الحاشية [a] في المتن.
