id: LUK.18.41
reference: Luke 18:41
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: ar
  text: '«ماذا تريد أن أفعل لك؟» فقال: «يا ربّ[a]، أن أُبصر من جديد[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يا سيدي»؛ فقد تأتي اليونانية κύριε نداءَ احترام، مع أن «يا ربّ» هي الترجمة المعتمدة عادةً لـ κύριος.
    reason: alternative_reading
  - marker: b
    text: أو «أن أستعيد بصري».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: ماذا
  rationale: اسم استفهام يسأل عن الطلب المحدد، وهو المعنى المباشر هنا لا معنى «لماذا».
- source_word: σοι
  choice: لك
  rationale: ضمير في حالة المجرور يؤدي معنى المنفعة مع فعل «أفعل»، وتعبيره العربي الطبيعي هو «لك».
- source_word: θέλεις
  choice: تريد
  rationale: يفيد الإرادة، و«تريد» تعبير عربي واضح وطبيعي يلائم الحوار المباشر.
- source_word: ποιήσω
  choice: أن أفعل
  rationale: 'صيغة الفعل بعد «تريد» تُنقل طبيعيًا إلى العربية بالمصدر المؤول: «أن أفعل».'
- source_word: ὁ δὲ εἶπεν
  choice: فقال
  rationale: δέ هنا أداة وصل سردية خفيفة لا تفيد استدراكًا قويًا؛ والفاء تمنح العبارة تسلسلًا عربيًا طبيعيًا.
- source_word: Κύριε
  choice: يا ربّ
  rationale: تحافظ «يا ربّ» على دلالة اللقب وعلى إمكان حمله معنى التوقير أو الاعتراف الأعمق، من غير حسم التوتر الدلالي.
- source_word: ἵνα
  choice: أن
  rationale: تُدخل مضمون الطلب أو غايته، والمصدر المؤول هو الأسلوب العربي الموجز والطبيعي هنا.
- source_word: ἀναβλέψω
  choice: أُبصر من جديد
  rationale: في سياق الشفاء يدل الفعل غالبًا على استعادة البصر؛ وهذه الصياغة مباشرة وتحافظ على عنصر العودة الكامن في الفعل.
theological_decisions:
- issue: ترجمة κύριος في خطاب مباشر ليسوع
  choice: يا ربّ
  alternative: يا سيدي
  rationale: «يا ربّ» تحافظ على الرنين اللاهوتي المحتمل، بينما يمكن أن تكون الكلمة اليونانية أيضًا نداء احترام بمعنى «يا سيدي»؛ لذلك أُبقي البديل في الحاشية بدل حسم الدلالة.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة، مع حوار مباشر طبيعي. وُضعت علامتا الحاشيتين عند اللفظين اللذين تتعلقان بهما، وحُفظ احتمال κύριε بين نداء الاحترام واللقب ذي الرنين اللاهوتي.
