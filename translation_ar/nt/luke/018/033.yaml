  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: ar
  text: وبعد أن يجلدوه، سيقتلونه، وفي اليوم الثالث سيقوم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيُقام». والعبارة اليونانية هنا، على نحو أكثر مباشرة: «سيقوم».'
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: بعد أن يجلدوه
  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل هنا طبيعيًا على فعل يسبق الفعل الرئيس. و«يجلدوه» تعبير عربي واضح ومعاصر ينقل عنف الفعل من غير لفظ عتيق.
- source_word: ἀποκτενοῦσιν
  choice: سيقتلونه
  rationale: فعل مستقبل مبني للمعلوم في صيغة الجمع، والفاعل مفهوم من السياق. «سيقتلونه» يؤدي المعنى المباشر من غير إضافة دلالة «الاغتيال» أو صياغة أكثر رسمية مثل «يميتونه».
- source_word: αὐτόν
  choice: ـه في «سيقتلونه»
  rationale: ضمير المفعول يعود إلى ابن الإنسان، وقد أُدمج طبيعيًا في الفعل العربي.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: في اليوم الثالث
  rationale: ترجمة عربية مألوفة ودقيقة لدلالة ظرف الزمان، من غير إضافة تفسير زمني غير مصرح به.
- source_word: ἀναστήσεται
  choice: سيقوم
  rationale: 'الصيغة اليونانية مستقبل أوسط، وتُفهم هنا بمعنى لازم: «سيقوم». تحافظ هذه الصياغة على التعبير المباشر في الأصل ولا تحوله صراحةً إلى المبني للمجهول.'
theological_decisions:
- issue: صياغة القيامة
  choice: سيقوم
  alternative: سيُقام
  rationale: «سيقوم» هي المقابلة الأشد مباشرة للصيغة اليونانية الوسطى المستعملة استعمالًا لازمًا. أما «سيُقام» فمعنى تشهد له مواضع أخرى، لكنه يجعل العبارة هنا مبنية للمجهول على نحو غير صريح في هذه الصيغة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «يجلدوه» بدل ألفاظ أقل تداولًا مثل «يسوطوه»، وحُفظ تسلسل الأفعال وإيجاز النص الأصلي.
