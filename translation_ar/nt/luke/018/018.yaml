  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: ar
  text: 'وسأله رئيسٌ قائلًا: «أيها المعلّم الصالح، ماذا أعمل لأرث الحياة الأبدية؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «ماذا، بعدما أفعل، سأرث الحياة الأبدية؟»؛ والصياغة في المتن تعبّر عربيًا عن البناء اليوناني.'
    reason: إيضاح البنية الحرفية لاسم الفاعل اليوناني (أوريست) من غير فرض ترتيب زمني أو إضافة ألفاظ غير موجودة في الأصل.
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: سأله
  rationale: ينقل المعنى الشائع للفعل، أي طرح سؤالًا عليه، بصياغة عربية طبيعية ومباشرة.
- source_word: τις ἄρχων
  choice: أحدُ الرؤساء
  rationale: تحفظ العبارة عدم تعيين الشخص وتدل على أنه صاحب سلطة، من غير تحديد منصبه بما لا يصرّح به النص.
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على البنية الوصفية للنص اليوناني مع سلامة الأسلوب العربي.
- source_word: Διδάσκαλε ἀγαθέ
  choice: أيها المعلّم الصالح
  rationale: ترجمة مباشرة للنداء، وتحفظ وصف «الصالح» الذي يتناوله يسوع في العدد التالي.
- source_word: τί ποιήσας
  choice: ماذا أعمل
  rationale: صياغة عربية واضحة تعبّر عن الفعل الذي يسأل عنه الرجل، من غير إضافة «يجب» غير المذكورة صراحة في اليونانية.
- source_word: ζωὴν αἰώνιον
  choice: الحياة الأبدية
  rationale: التعبير العربي الراسخ والدقيق في هذا السياق، مع إبقاء الدلالة الزمنية واللاهوتية للعبارة.
- source_word: κληρονομήσω
  choice: لأرث
  rationale: يحفظ صورة الميراث الواضحة في الفعل اليوناني، بدل اختزالها في معنى الحصول العام.
theological_decisions:
- issue: صياغة سؤال الخلاص من جهة العمل البشري
  choice: ماذا أعمل لأرث الحياة الأبدية؟
  alternative: ماذا يجب أن أعمل لكي أرث الحياة الأبدية؟
  rationale: تحفظ الصياغة سؤال الرجل كما ورد، بما فيه من ربط بين العمل وميراث الحياة الأبدية، من غير أن تقرّه بوصفه خلاصة تعليم لوقا أو تحسم التوتر اللاهوتي بإضافة تفسير.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أحد الرؤساء» للدلالة العامة على صاحب سلطة من دون افتراض منصب بعينه، وحُفظت لغة الميراث والتوتر الكامن في سؤال الرجل.
