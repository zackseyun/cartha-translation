base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: ar
  text: ولا تحكموا، فلن يُحكَم عليكم أبدًا؛ ولا تدينوا، فلن تُدانوا أبدًا. سامحوا[a]، تُسامَحوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أطلقوا، تُطلَقوا» أو «أخلوا السبيل، يُخلَى سبيلكم». يمكن أن يعني الفعل اليوناني «أطلق» أو «أخلى السبيل»، ويُفهم في هذا السياق أيضًا بمعنى «سامح» أو «اغفر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: تدينوا
  rationale: يفيد الفعل الحكم أو إصدار الدينونة؛ واختيار «تدينوا» يحافظ على الإيجاز وعلى المقابلة مع المبني للمجهول «تُدانوا»، مع تمييزه عن الإدانة المشددة في الفعل التالي.
- source_word: οὐ μὴ κριθῆτε
  choice: فلن تُدانوا أبدًا
  rationale: تركيب οὐ μή نفي مؤكد؛ و«لن... أبدًا» ينقل قوته بعبارة عربية طبيعية.
- source_word: καταδικάζετε
  choice: تحكموا على أحد
  rationale: الفعل أقوى من κρίνω ويدل على الحكم بالإدانة أو إثبات الذنب. أضيف «على أحد» لسلامة العربية ولإظهار جهة الحكم من غير توسع تفسيري.
- source_word: οὐ μὴ καταδικασθῆτε
  choice: فلن يُحكم عليكم أبدًا
  rationale: يحافظ على التوازي وعلى النفي المؤكد، ويعبّر عن صدور حكم بالإدانة دون تكرار لفظ «تُدانوا» نفسه.
- source_word: ἀπολύετε
  choice: أطلقوا
  rationale: للفعل مجال دلالي يشمل الإطلاق والتخلية والإعفاء، وقد يعني في السياق المسامحة. «أطلقوا» يحفظ سعته ومقابلته اللفظية مع صيغة المبني للمجهول.
- source_word: ἀπολυθήσεσθε
  choice: تُطلَقوا
  rationale: يحافظ على التطابق اللفظي والتبادلية في القول اليوناني، مع إبقاء معنى «تُغفر لكم» احتمالًا تفسيريًا في الحاشية.
- source_word: καὶ
  choice: و / فـ
  rationale: تُرجمت واو العطف «و» مع الأوامر، واستُعملت الفاء في جمل النتيجة لتكون العلاقة طبيعية واضحة في العربية من غير تغيير مضمونها.
theological_decisions:
- issue: هل يُضيَّق معنى ἀπολύετε إلى الغفران أم يُحفظ معناه الأوسع، أي الإطلاق والإعفاء؟
  choice: أطلقوا، تُطلَقوا
  alternative: سامحوا، تُسامَحوا؛ أو اغفروا، يُغفر لكم
  rationale: السياق يتناول الدينونة والحكم بالإدانة، ويمكن أن يدل الفعل على إطلاق الشخص أو إعفائه من مطالبة. تحفظ الصياغة المختارة سعة اللفظ والتقابل بين المبني للمعلوم والمبني للمجهول، بينما تُذكر دلالة الغفران المألوفة والمحتملة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة موجزة ذات إيقاع متوازٍ. حُفظ النفي اليوناني المؤكد بتركيب «لن... أبدًا»، وحُفظت السعة الدلالية للفعل الأخير مع إيضاح البديل السياقي في الحاشية.
