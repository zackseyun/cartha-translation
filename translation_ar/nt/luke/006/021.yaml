  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: ar
  text: طوبى لكم، يا من تجوعون الآن، لأنكم ستشبعون. طوبى لكم، يا من تبكون الآن، لأنكم ستضحكون.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: طوباكم
  rationale: تحافظ «طوباكم» على صيغة التطويب ووزنها الديني، وتلائم المخاطب الجمع؛ أما «سعداء» فقد توحي أساسًا بشعور نفسي عابر.
- source_word: οἱ πεινῶντες
  choice: أيها الجياع
  rationale: اسم الفاعل المعرّف يدل حرفيًا على الجياع، لكن صيغة «طوباكم» وسياق الخطاب والفعل الآتي بضمير الجمع تجعل المخاطبة المباشرة طبيعية من غير محو الدلالة الوصفية.
- source_word: νῦν
  choice: الآن
  rationale: ينقل المقابلة الزمنية الصريحة بين الحرمان الحاضر والانقلاب الآتي.
- source_word: χορτασθήσεσθε
  choice: ستشبعون
  rationale: الفعل المبني للمجهول يدل على الامتلاء من الطعام أو بلوغ الشبع؛ و«ستشبعون» يحفظ الصورة الحسية مع بقائها قابلة لدلالة أوسع.
- source_word: οἱ κλαίοντες
  choice: أيها الباكون
  rationale: يحفظ معنى اسم الفاعل الدال على الذين يبكون، ضمن المخاطبة المباشرة التي يقتضيها السياق وصيغة الفعل في الجواب.
- source_word: γελάσετε
  choice: ستضحكون
  rationale: ينقل المعنى المباشر للفعل ويحفظ صورة الانقلاب الحية، بدل تفسيرها بلفظ أعم مثل «ستفرحون».
theological_decisions:
- issue: المخاطبة المباشرة أم صيغة التطويب العامة بضمير الغائب
  choice: 'صيغة المخاطب: «طوباكم أيها الجياع... طوباكم أيها الباكون»'
  alternative: «طوبى للجياع الآن... طوبى للباكين الآن»
  rationale: اليونانية تستعمل اسمَي فاعل معرّفين، لكن فعلي الوعد بضمير المخاطب الجمع والسياق المباشر يدعمان إبراز المخاطبة. والصياغة المختارة تبقي الوصف ظاهرًا في «الجياع» و«الباكون».
- issue: طبيعة الانقلاب الموعود
  choice: 'الإبقاء على الصورتين الملموستين: الشبع والضحك'
  alternative: تفسيرهما صراحةً بالشبع الروحي أو الفرح الأخروي
  rationale: لا تحدد الآية هنا كيفية الإتمام أو توقيته تحديدًا تفصيليًا، لذلك لا تحصر الترجمة الوعد في بُعد زمني أو روحي بعينه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت صيغة «طوباكم» المألوفة كتابيًا مع نداء وصفي طبيعي، وحُفظ التوازي الإيقاعي بين شطري الآية.
