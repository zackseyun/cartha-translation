  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: ar
  text: فكلُّ شجرةٍ تُعرَف من ثمرها الخاص بها؛ فإنهم لا يجمعون تينًا من الشوك، ولا يقطفون عنقودَ عنبٍ من العُلَّيق.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'العُلَّيق: شجيرة شائكة؛ ويمكن ترجمة الكلمة أيضًا: «شجيرة شوكية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: كلُّ شجرةٍ
  rationale: ينقل الدلالة التوزيعية للتركيب اليوناني المفرد بصياغة عربية طبيعية.
- source_word: γὰρ
  choice: فـ / إذ
  rationale: تُظهر الفاء صلة القول بما قبله، وتُظهر «إذ» أن الجملة الثانية تعليل للمبدأ، من غير تكرار ثقيل.
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: من ثمرها الخاص
  rationale: يحافظ على دلالة ἐκ «من» وعلى توكيد ἰδίου للمطابقة بين الشجرة وثمرها.
- source_word: γινώσκεται
  choice: تُعرَف
  rationale: ينقل المضارع المبني للمجهول ودلالته العامة المأثورية بإيجاز.
- source_word: ἀκανθῶν
  choice: الشوك
  rationale: لفظ عربي مألوف يشمل النباتات الشوكية من غير تحديد نوع نباتي غير وارد.
- source_word: συλλέγουσιν
  choice: يجمعون
  rationale: مقابل مباشر وطبيعي لجمع الثمار.
- source_word: σῦκα
  choice: تينًا
  rationale: المقابل العربي القياسي لاسم الثمر، ويصح اسم جنس جمعيًّا في السياق.
- source_word: βάτου
  choice: العُلَّيق
  rationale: يدل على شجيرة شائكة متسلقة أو متشابكة، وهو أدق من «شجيرة» العامة وأقرب إلى βάτος.
- source_word: σταφυλήν
  choice: عنقودَ عنبٍ
  rationale: يحفظ صيغة المفرد ودلالة اللفظة على العنقود، بدل تحويلها إلى جمع عام.
- source_word: τρυγῶσιν
  choice: يقطفون
  rationale: ينقل فعل جني الثمر الناضج بعبارة عربية طبيعية، مع تمييزه عن «يجمعون».
theological_decisions:
- issue: القوة المجازية لصورة الشجرة والثمر
  choice: الإبقاء على المثل الزراعي من غير تفسير أخلاقي داخل نص الآية
  alternative: التصريح بأن الثمر يعني الأعمال أو الأخلاق
  rationale: النص اليوناني يورد الصورة نفسها، وسياقها يتيح تطبيقها دون أن تفرض الترجمة تفسيرًا لاهوتيًّا واحدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مأثورية. استُخدم «العُلَّيق» للدقة النباتية، مع حاشية تشرح اللفظ الأقل شيوعًا، وحُفظ الفرق بين فعلي الجمع والقطف.
