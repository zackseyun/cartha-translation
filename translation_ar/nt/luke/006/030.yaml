  text: ⸀παντὶ αἰτοῦντί σε δίδου, καὶ ἀπὸ τοῦ αἴροντος τὰ σὰ μὴ ἀπαίτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: ar
  text: أَعْطِ كُلَّ مَنْ يَسْأَلُكَ، ومَنْ يَأْخُذُ مَا هُوَ لَكَ فَلَا تُطَالِبْهُ بِرَدِّهِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلا تطلب منه أن يردّه».'
    reason: بديل معجمي للفعل ἀπαιτέω، الذي قد يدل على طلب الشيء ثانيةً أو المطالبة بردّه.
lexical_decisions:
- source_word: παντὶ αἰτοῦντί σε
  choice: كُلَّ مَنْ يَسْأَلُكَ
  rationale: ينقل الاستعمال التوزيعي لـ«παντί» مع اسم الفاعل، ويحافظ على شمول الوصية من غير أن يقيّد السائل بوصف اجتماعي مثل الفقير أو المتسوّل.
- source_word: δίδου
  choice: أَعْطِ
  rationale: صيغة أمر مباشرة وطبيعية في العربية. ولا يلزم إبراز دلالة المضارع اليوناني بعبارة مثل «داوم على العطاء»، لأن ذلك قد يزيد على صراحة النص.
- source_word: ἀπὸ τοῦ αἴροντος
  choice: ومَنْ يَأْخُذُ
  rationale: يؤدي اسم الفاعل المعرّف الدال على من يأخذ الشيء أو يرفعه من حيازة صاحبه، من غير حصر المعنى في السرقة بوصفها القانوني.
- source_word: τὰ σὰ
  choice: مَا هُوَ لَكَ
  rationale: صياغة عربية طبيعية تحافظ على عموم التعبير اليوناني الحرفي «الأشياء التي لك»، ولا تحصره في فئة محددة من الممتلكات.
- source_word: μὴ ἀπαίτει
  choice: فَلَا تُطَالِبْهُ بِرَدِّهِ
  rationale: ينقل النهي ومعنى المطالبة باستعادة المأخوذ. ولفظ «تطالبه» يحفظ قوة الفعل أكثر من «تطلب منه» من غير أن يفرض إطارًا قضائيًا.
theological_decisions:
- issue: مدى وصايا يسوع الأخلاقية وقوتها في هذا القول
  choice: صيغت الوصيتان أمرًا ونهيًا مباشرين واسعين، من غير تلطيف أو تقييد تفسيري.
  alternative: اعتبار القول مبالغة بلاغية، أو قصره على الصدقة، أو حصر الشطر الثاني في أحكام ردّ المسروق.
  rationale: يعرض اليوناني أمرًا مباشرًا بلغة شاملة، ثم نهيًا مباشرًا يتعلق بمن يأخذ ما للسامع. لذلك يحافظ النص العربي على اتساع القول وتوتره الأخلاقي، ويترك مسائل التطبيق للتفسير.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات نبرة كريمة. استُعمل المفرد المخاطب موافقةً لصيغ اليونانية، مع الحفاظ على التوازي بين الأمر والنهي.
