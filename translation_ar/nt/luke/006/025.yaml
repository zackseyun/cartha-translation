  timestamp: '2026-07-17T03:35:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى الأساسي محفوظ: «ويل»، والحالة الحاضرة من الشبع والضحك، والانقلاب المستقبلي إلى الجوع والنوح والبكاء. غير أن «أيها الشِّباع» وإن أمكن تخريجه جمعًا لـ«شبعان»، غير مألوف في العربية الفصحى المعاصرة في هذا النداء وقد يربك القارئ.'
  naturalness: تعديل العبارة إلى «يا من أنتم شِباع الآن» يعبّر طبيعيًا عن اسم الفاعل التامّ المستعمل اسميًا في اليونانية (οἱ ἐμπεπλησμένοι)، أي حالة الشبع الحاضرة الناتجة عن الامتلاء، مع صون المقابلة مع «ستجوعون». وبقية الصياغة فصيحة ومناسبة للسجل النبوي.
  terminology: «ويل لكم» مناسب لـοὐαί ويحفظ قوة الإنذار. «تنوحون وتبكون» ينقل πενθήσετε καὶ κλαύσετε مع إبقاء الفعلين متميزين. الحاشية البديلة لـ«ويل» مقبولة، وإن كان «يا لحسرتكم» أضعف قليلًا من «ويل» في قوة الوعيد؛ وهي مع ذلك بديل معجمي لا يفرض تفسيرًا عقائديًا.
