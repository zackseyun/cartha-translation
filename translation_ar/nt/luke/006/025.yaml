- from: ويلٌ لكم، أيها الشِّباع الآن، لأنكم ستجوعون. ويلٌ لكم[a]، أيها الضاحكون الآن، لأنكم ستنوحون وتبكون.
  to: ويلٌ لكم، يا من أنتم شِباع الآن، لأنكم ستجوعون. ويلٌ لكم[a]، يا من تضحكون الآن، لأنكم ستنوحون وتبكون.
  rationale: استُبدل النداء غير المألوف «أيها الشِّباع» بتركيب فصيح واضح يحفظ دلالة الحالة الناتجة عن الامتلاء في ἐμπεπλησμένοι. كما جُعلت الجملة الثانية موازية في البنية باستخدام «يا من تضحكون»، مع عدم تغيير المعنى أو القوة التحذيرية للنص.
