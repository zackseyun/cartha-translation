    rationale: «الشِّباع» جمع صحيح أو ممكن الاستعمال، لكنه قليل السلاسة في موقع النداء. الصياغة المقترحة تبيّن بوضوح أن المقصود أناس هم في حالة شبع الآن، لا فعل الأكل الجاري.
