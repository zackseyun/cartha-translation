  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: ar
  text: ويلٌ لكم، يا من أنتم شِباع الآن، لأنكم ستجوعون. ويلٌ لكم[a]، يا من تضحكون الآن، لأنكم ستنوحون وتبكون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يا لحسرتكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: ويلٌ لكم
  rationale: يحافظ على قوة التحذير النبوي والوعيد، ولا يختزله في مجرد الشفقة. ويمكن أن يحمل اللفظ أيضًا معنى التحسر، وهو مبيَّن في الحاشية.
- source_word: ἐμπεπλησμένοι
  choice: الشِّباع
  rationale: ينقل الحالة الحاضرة الناتجة عن الامتلاء، ويحافظ على المقابلة المباشرة مع الجوع الآتي.
- source_word: νῦν
  choice: الآن
  rationale: يحفظ التقابل الزمني المحوري بين الحال الحاضر والانقلاب الآتي، وقد أُبقي في الموضعين.
- source_word: πεινάσετε
  choice: ستجوعون
  rationale: صياغة عربية طبيعية ومباشرة للمستقبل الدال على الحرمان الآتي.
- source_word: γελῶντες
  choice: الضاحكون
  rationale: يحافظ على صورة الضحك الحاضر دون توسيع المعنى إلى الفرح عمومًا.
- source_word: πενθήσετε
  choice: ستنوحون
  rationale: ينقل معنى الحداد والحزن الشديد، مع إبقاء تمييزه عن البكاء في الفعل التالي.
- source_word: κλαύσετε
  choice: تبكون
  rationale: يحافظ على التصعيد البلاغي من النواح إلى البكاء ولا يدمج الفعلين في معنى واحد.
- source_word: ὅτι
  choice: لأنكم
  rationale: يبين بوضوح أن ما يلي هو سبب إعلان الويل.
theological_decisions:
- issue: طبيعة إعلان الويل
  choice: تحذير نبوي من انقلاب آتٍ ودينونة على مَن هم الآن في الشبع واللهو
  alternative: مجرد ملاحظة اجتماعية عن تقلّب الأحوال
  rationale: تكرار «ويل»، وصيغ المستقبل، والتوازي مع التطويبات المحيطة تشير إلى تحذير يتجاوز الوصف الاجتماعي المحايد، من غير تحديد كيفية هذا الانقلاب بما يتعدى نص الآية.
translation_notes:
  register: لغة عربية فصحى واضحة ومهيبة. استُخدم «الشِّباع» بوصفه جمع «شبعان» للدلالة على حالة الامتلاء الحاضرة، وحُفظ التوازي بين «الآن» والمستقبل، وكذلك التمييز بين النواح والبكاء.
