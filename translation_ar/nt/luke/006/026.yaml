base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: ar
  text: الويل لكم حين يتحدث جميع الناس عنكم بخير[a]، لأن آباءهم[b] كانوا يتحدثون عن الأنبياء الكذبة بخير بالطريقة نفسها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يتكلمون عنكم كلامًا حسنًا».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «آباؤهم»؛ والمقصود الأجيال السابقة من قومهم.'
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαί
  choice: الويل لكم
  rationale: يحافظ «الويل» على قوة التحذير والإدانة النبوية. وأُضيفت «لكم» في العربية لإتمام التركيب الطبيعي، والمخاطَبون ظاهرون من ضمير «عنكم» ومن سياق الأقوال السابقة.
- source_word: ὅταν
  choice: حين
  rationale: تفيد حالة عامة متوقعة، و«حين» واضحة وطبيعية وتحافظ على قوة التحذير.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: يتحدث ... عنكم بخير
  rationale: ينقل المعنى الاصطلاحي، أي أن يتكلم الناس عن المخاطَبين كلامًا حسنًا أو مؤيدًا، لا أن يتكلموا بطريقة صحيحة فحسب.
- source_word: πάντες οἱ ἄνθρωποι
  choice: جميع الناس
  rationale: تعبير عام شامل يطابق دلالة ἄνθρωποι من غير تخصيص بالذكور.
- source_word: κατὰ τὰ αὐτά
  choice: الأمر نفسه
  rationale: ينقل المقارنة المباشرة في العبارة اليونانية بوضوح، مع إبقاء طبيعة الفعل مستفادة من الجملة السابقة.
- source_word: γάρ
  choice: لأن
  rationale: يبين أن معاملة الأجيال السابقة للأنبياء الكذبة هي علة التحذير السابق.
- source_word: ἐποίουν
  choice: كانوا يفعلون
  rationale: ينقل دلالة الماضي الاعتيادي في صيغة الماضي الناقص اليونانية.
- source_word: τοῖς ψευδοπροφήταις
  choice: بالأنبياء الكذبة
  rationale: يعبّر عن الأشخاص الذين وُجّه إليهم ذلك الفعل، ويحافظ على وصفهم الصريح بأنهم أنبياء كذبة.
- source_word: οἱ πατέρες αὐτῶν
  choice: آباؤهم
  rationale: ترجمة مباشرة تحفظ الصورة الكتابية وقوة المقارنة بين الأجيال، مع إيضاح المقصود في الحاشية.
theological_decisions:
- issue: مرجع المقارنة بالأنبياء الكذبة وقوتها
  choice: يحذّر النص من مديح جميع الناس، لأنه يشبه نمط قبول الأجيال السابقة للأنبياء الكذبة.
  alternative: اعتبار الآية إدانة مطلقة لكل كلام حسن يقوله الآخرون، أو حصرها في نقد الشعبية وحدها.
  rationale: تربط γάρ وκατὰ τὰ αὐτά التحذير بنمط تاريخي من الاستحسان الذي حظي به الأنبياء الكذبة. وتحفظ الصياغة هذا التوتر من غير أن تجعل كل ثناء مرفوضًا على الإطلاق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة تحذيرية مهيبة. استُخدم «يتحدث عنكم بخير» بوصفه تعبيرًا طبيعيًا، مع الحفاظ على «الويل» و«الأنبياء الكذبة» للمحافظة على القوة النبوية للنص.
