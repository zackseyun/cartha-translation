  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: ar
  text: طُوبَى لَكُمْ حِينَ يُبْغِضُكُمُ النَّاسُ، وَحِينَ يُقْصُونَكُمْ وَيُعَيِّرُونَكُمْ وَيَنْبُذُونَ اسْمَكُمْ بِوَصْفِهِ شِرِّيرًا[a]، مِنْ أَجْلِ ابْنِ الإِنْسَانِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: يرفضون اسمكم أو ذكركم علنًا ويعاملونه على أنه شرير؛ وقد تشير العبارة إلى نبذكم وتشويه سمعتكم.'
    reason: توضيح التعبير اليوناني غير المألوف ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν، مع إبقاء دلالته بين نبذ الاسم أو الهوية والتشهير بالشخص مفتوحة.
lexical_decisions:
- source_word: Μακάριοί
  choice: طُوبَى لَكُمْ
  rationale: صيغة عربية راسخة ومفهومة للتطويبات، وتحفظ معنى الغبطة والبركة دون اختزاله في شعور ذاتي بالسعادة.
- source_word: μισήσωσιν
  choice: أَبْغَضَكُم
  rationale: ينقل معنى العداوة والكراهية بوضوح وفي أسلوب عربي فصيح.
- source_word: οἱ ἄνθρωποι
  choice: النَّاس
  rationale: تعبير جمعي عام يشمل البشر، ولا يقصر المرجع على الذكور.
- source_word: ἀφορίσωσιν
  choice: نَبَذُوكُم
  rationale: ينقل الإقصاء الاجتماعي المقصود في السياق، وهو أوضح من الترجمة الحرفية «فصلوكم».
- source_word: ὀνειδίσωσιν
  choice: عَيَّرُوكُم
  rationale: يدل على التوبيخ المهين والتشهير اللفظي، ويحافظ على قوة الفعل اليوناني.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν
  choice: طَرَحُوا اسْمَكُمْ
  rationale: يحفظ الصورة الملموسة للفعل «أخرج/طرح» مع إبقاء احتمال أن يكون «الاسم» دالًا على السمعة أو الهوية الاجتماعية.
- source_word: ὡς πονηρὸν
  choice: كَأَنَّهُ شِرٌّ
  rationale: يبين أن اسمهم يُعامَل ويُوصَف بوصفه شرًّا، من غير الجزم بأن هذا الحكم صحيح.
- source_word: ἕνεκα
  choice: مِنْ أَجْلِ
  rationale: تعبير عربي طبيعي يدل هنا على السبب والدافع.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ابْنِ الإِنْسَانِ
  rationale: يحفظ اللقب الإنجيلي وصيغته المتداولة وصلاته النصية دون إعادة تفسيره.
theological_decisions:
- issue: دلالة العبارة ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν
  choice: طَرَحُوا اسْمَكُمْ كَأَنَّهُ شِرٌّ
  alternative: شَهَّرُوا بِكُمْ عَلَى أَنَّكُمْ أَشْرَار / رَفَضُوا اسْمَكُمْ كَاسْمٍ شِرِّير
  rationale: الصياغة المختارة تحافظ على صورة «طرح الاسم» وعلى الغموض الحقيقي بين رفض الشخص، ونبذ هويته، وتشويه سمعته، بينما تشرح الحاشية المقصود المحتمل.
- issue: مرجع οἱ ἄνθρωποι العام
  choice: النَّاس
  alternative: الرِّجَال / البَشَر
  rationale: اللفظ اليوناني عام في هذا السياق، و«الناس» يؤدي هذا العموم طبيعيًا.
- issue: لقب τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ابْنِ الإِنْسَانِ
  alternative: الإنسان / ابن البشر
  rationale: يحفظ اللقب المعروف في الأناجيل وما يحمله من صدى كتابي، دون فرض تفسير لاهوتي بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدمت «طوبى لكم» و«ابن الإنسان» لصِلتهما الراسخة بأسلوب التطويبات والأناجيل، مع تجنب الألفاظ شديدة القِدم. وُضعت علامة الحاشية بعد الجملة كلها لأنها تشرح عبارة «طرحوا اسمكم كأنه شر».
