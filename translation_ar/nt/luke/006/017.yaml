  to: ونزل معهم، فوقف في مكانٍ مستوٍ[a]، وكان هناك جمهورٌ كبير من تلاميذه، وحشدٌ عظيم من الشعب من جميع أنحاء اليهودية وأورشليم وساحل صور وصيدا.
