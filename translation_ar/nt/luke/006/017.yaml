  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: ar
  text: ونزل معهم، فوقف في مكانٍ مستوٍ[a]، وكان هناك جمهورٌ كبير من تلاميذه، وحشدٌ عظيم من الشعب من جميع أنحاء اليهودية وأورشليم وساحل صور وصيدا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في سهل». والعبارة اليونانية حرفيًا: «في مكانٍ مستوٍ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς
  choice: ونزل
  rationale: اسم الفاعل الأُحادي يدل على نزوله السابق أو المصاحب لوقوفه؛ وصيغة الفعل المعطوف طبيعية في السرد العربي وتحفظ معنى الاتجاه.
- source_word: μετ’ αὐτῶν
  choice: معهم
  rationale: ترجمة مباشرة للجار والمجرور، والضمير يعود في السياق إلى المذكورين قبله.
- source_word: ἔστη
  choice: فوقف
  rationale: ينقل المعنى السردي البسيط للفعل، أي اتخذ موضعًا واقفًا، من غير إضافة معنى التوقف أو الثبات غير المصرح به.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: في مكانٍ مستوٍ
  rationale: يحفظ اللفظ اليوناني العام «مكان» ومعنى πεδινός، أي مستوٍ أو منبسط، من غير الجزم بأنه سهل جغرافي واسع.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: جمعٌ كبير من تلاميذه
  rationale: يفيد ὄχλος جماعة محتشدة، ويبين تركيب «من تلاميذه» أن الجمع مؤلف منهم.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: حشدٌ عظيم من الشعب
  rationale: يميّز πλῆθος عن الجمع السابق، ويحفظ «الشعب» بوصفه جماعة أوسع متميزة عن التلاميذ.
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: من جميع أنحاء اليهودية
  rationale: صياغة عربية واضحة تنقل شمول πάσης للمنطقة، ولا توحي بأن كل فرد من سكانها حضر.
- source_word: Ἰερουσαλήμ
  choice: أورشليم
  rationale: الاسم العربي الكتابي الشائع للمدينة.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: المنطقة الساحلية عند صور وصيدا
  rationale: ينقل معنى παράλιος بوصفه المنطقة المحاذية للبحر والمرتبطة بصور وصيدا، مع تجنب إيحاء الملكية الذي قد ينشأ من «ساحل صور وصيدا».
theological_decisions:
- issue: الوصف الطبوغرافي لموضع الخطاب وصلته برواية متى
  choice: في مكانٍ مستوٍ
  alternative: في سهل
  rationale: تتبع الترجمة الدلالة المعجمية للعبارة من غير مواءمة الرواية مع موضع الجبل في متى، ومن غير تضخيم الاختلاف؛ فاليونانية تصف موضعًا مستويًا ولا تلزم بسهل جغرافي واسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت جملة جديدة بعد وصف المكان لتجنب ثقل العطف اليوناني، وأُضيف «كان هناك» و«أتوا» لإظهار العلاقات النحوية المضمرة طبيعيًا في العربية، من غير تغيير مضمون الآية.
