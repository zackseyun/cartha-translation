  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: ar
  text: وفي تلك الأيام، حدث أن خرج إلى الجبل ليصلّي، وقضى الليل كلَّه[a] في الصلاة لله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وظلّ طوال الليل في الصلاة لله».'
    reason: بديل معجمي وتركيبي يبرز بوضوح أكبر دلالة الاستمرار في ἦν διανυκτερεύων.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وحدث
  rationale: ينقل أسلوب لوقا في الانتقال السردي، مع تمثيل δέ بواو ربط خفيفة من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: في تلك الأيام
  rationale: تعبير زمني عربي طبيعي يشير إلى الفترة المحيطة بالأحداث المذكورة في السياق.
- source_word: ἐξελθεῖν αὐτὸν
  choice: أنه خرج
  rationale: تحويل التركيب اليوناني بالمصدر وفاعله المنصوب إلى جملة عربية صريحة وطبيعية مع الحفاظ على معنى الخروج.
- source_word: εἰς τὸ ὄρος
  choice: إلى الجبل
  rationale: يحافظ على معنى الحركة نحو موضع مرتفع وعلى أداة التعريف في النص اليوناني، من غير تعيين مكان لا يعيّنه السياق.
- source_word: προσεύξασθαι
  choice: ليصلّي
  rationale: اللام تعبّر بوضوح وطبيعية عن غرض خروجه.
- source_word: ἦν διανυκτερεύων
  choice: وقضى الليل كله
  rationale: صياغة عربية مألوفة تنقل استمرار الفعل طوال الليل، وهو المعنى السياقي للفعل διανυκτερεύω مع التركيب الدال على الاستمرار.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: في الصلاة لله
  rationale: تجعل الله جهة الصلاة، وهو المعنى الأنسب للسياق، وتتجنب عبارة «صلاة الله» التي قد توهم أن الصلاة صادرة من الله.
theological_decisions:
- issue: دلالة المضاف إليه τοῦ θεοῦ في صلة صلاة يسوع بالله
  choice: في الصلاة لله
  alternative: في صلاة الله
  rationale: يبيّن السياق أن يسوع يوجّه الصلاة إلى الله، لا أن الصلاة مملوكة لله أو صادرة منه. وتحافظ الصياغة على هذا المعنى من غير إدخال تفسير عقائدي إضافي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة سردية طبيعية، مع إبقاء «الجبل» معرّفًا، ووُضع رمز الحاشية بعد العبارة التي تشرحها الحاشية.
