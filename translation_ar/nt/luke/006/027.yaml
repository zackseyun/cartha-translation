lexical_decisions:
- source_word: Ἀλλὰ
  choice: لكنني
  rationale: تُظهر «لكن» المقابلة القوية مع الكلام السابق، واتصالها بضمير المتكلم يجعل العبارة طبيعية في العربية.
- source_word: ὑμῖν λέγω
  choice: أقول لكم
  rationale: نقل مباشر يحافظ على صيغة الخطاب وترتيب عناصرها الأساسي.
- source_word: τοῖς ἀκούουσιν
  choice: أنتم الذين تُصغون
  rationale: «تُصغون» تبرز الاستماع الفعلي والمتواصل الذي يفيده اسم الفاعل المضارع في السياق، مع إبقاء «تسمعون» بديلًا ممكنًا في الحاشية.
- source_word: ἀγαπᾶτε
  choice: أحبّوا
  rationale: يحافظ على صيغة الأمر وعلى المعنى المباشر للفعل دون تقييده أو تلطيفه.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: أعداءكم
  rationale: مقابل عربي مباشر وطبيعي للمفعول به مع ضمير الملكية.
- source_word: καλῶς ποιεῖτε
  choice: أحسنوا
  rationale: فعل عربي موجز وطبيعي يؤدي معنى صنع الخير إلى الآخرين، ويتعدى بـ«إلى».
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: إلى الذين يبغضونكم
  rationale: يحافظ على المعنى الصريح لـ«يبغضون» دون تخفيف، وتلائم «إلى» تعدية فعل «أحسنوا».
theological_decisions:
- issue: الأوامر الأخلاقية تجاه الأعداء
  choice: صيغت الأوامر بصيغة الجمع المباشرة ومن دون تقييد نطاقها.
  alternative: قصرها على الأعداء الشخصيين أو عدّها مبالغة بلاغية.
  rationale: النص اليوناني يقدم أمرين مباشرين لجمع المخاطبين، ولا يتضمن قيدًا صريحًا؛ لذلك ينبغي أن تبقى قوة المطالبة الأخلاقية وتوترها التفسيري ظاهرين.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بصياغة مباشرة مفهومة للقارئ العام. استُخدم «الذين تُصغون» بدل الصيغة الاسمية الأشد رسمية «السامعين» لإبراز الخطاب الحي والاستمرار في الفعل.
