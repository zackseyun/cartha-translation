  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: ar
  text: بَلْ أَحِبُّوا أَعْدَاءَكُمْ، وَافْعَلُوا الْخَيْرَ، وَأَقْرِضُوا غَيْرَ مُنْتَظِرِينَ شَيْئًا فِي الْمُقَابِلِ[a]؛ فَسَيَكُونُ أَجْرُكُمْ عَظِيمًا، وَتَكُونُونَ أَبْنَاءَ الْعَلِيِّ[b]، لِأَنَّهُ مُحْسِنٌ إِلَى نَاكِرِي الْجَمِيلِ وَالْأَشْرَارِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا، على وجه أقل ترجيحًا: «غير يائسين من أحد» أو «لا تفقدوا الرجاء قط». فالعبارة اليونانية عسيرة، وقد فُهمت هنا في سياق الإقراض بمعنى عدم انتظار السداد أو المقابل.'
    reason: lexical_alternative
  - marker: b
    text: «أبناء» ترجمة لجمع المذكر في اليونانية، ويمكن أن تكون له هنا دلالة تمثيلية تشمل جماعة أوسع.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: بَلْ
  rationale: تفيد الانتقال الاستدراكي القوي من مبدأ المعاملة بالمثل في السياق السابق إلى الأمر المخالف له.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: أَحِبُّوا أَعْدَاءَكُمْ
  rationale: ترجمة مباشرة للأمر، وتحافظ على قوة لفظ «الأعداء» من غير تلطيف.
- source_word: ἀγαθοποιεῖτε
  choice: افْعَلُوا الْخَيْرَ
  rationale: تعبير عربي طبيعي يدل على الإحسان العملي المقصود بالفعل اليوناني.
- source_word: δανίζετε
  choice: أَقْرِضُوا
  rationale: ينقل معنى الإقراض من غير تقييده بالمال، إذ لا يصرح النص اليوناني بذلك.
- source_word: μηδὲν ἀπελπίζοντες
  choice: غَيْرَ مُنْتَظِرِينَ شَيْئًا فِي الْمُقَابِلِ
  rationale: يلائم سياق الإقراض والتخلي عن انتظار السداد أو المقابل، مع إثبات الوجه الدلالي الآخر في الحاشية لصعوبة العبارة اليونانية.
- source_word: μισθὸς ὑμῶν πολύς
  choice: أَجْرُكُمْ عَظِيمًا
  rationale: «الأجر» مقابل عربي واضح لفكرة الجزاء، و«عظيم» تؤدي قوة الصفة πολύς في هذا السياق.
- source_word: υἱοὶ Ὑψίστου
  choice: أَبْنَاءَ الْعَلِيِّ
  rationale: تحافظ «أبناء» على صيغة الجمع المذكر في اليونانية، و«العلي» لقب إلهي عربي راسخ.
- source_word: χρηστός
  choice: رَؤُوفٌ
  rationale: تعبّر عن لطف الله وإحسانه إلى من لا يستحق، وتنسجم طبيعيًا مع حرف الباء في العربية.
- source_word: ἀχαρίστους
  choice: جَاحِدِي الْفَضْلِ
  rationale: تعبير عربي واضح عن الذين لا يشكرون الإحسان ولا يعترفون بالفضل.
- source_word: πονηρούς
  choice: الْأَشْرَارِ
  rationale: ينقل الوصف الأخلاقي المباشر للأشخاص من غير تخفيفه.
theological_decisions:
- issue: دلالة υἱοὶ Ὑψίστου وصيغتها المذكرة
  choice: أَبْنَاءَ الْعَلِيِّ
  alternative: أولاد العلي / أبناء العلي وبناته
  rationale: النص اليوناني يستعمل جمع «ابن» المذكر، فحُفظت صيغته في المتن، مع بيان إمكان دلالته التمثيلية في السياق دون إدخال توسعة تفسيرية في النص.
- issue: تفسير μηδὲν ἀπελπίζοντες ضمن أمر الإقراض
  choice: غَيْرَ مُنْتَظِرِينَ شَيْئًا فِي الْمُقَابِلِ
  alternative: غير يائسين من أحد / لا تفقدوا الرجاء قط
  rationale: سياق الإقراض والمقابلة يرجح معنى عدم انتظار السداد أو العوض، لكن العبارة اليونانية عسيرة ويمكن فهمها من جذر اليأس، لذلك حُفظ البديل في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم «العلي» كلقب إلهي مألوف، وحُفظ تتابع الأوامر وقوة المفارقة الأخلاقية في الأصل، مع تجنب حل موضع الغموض المتعلق بعبارة الإقراض من غير تنبيه.
