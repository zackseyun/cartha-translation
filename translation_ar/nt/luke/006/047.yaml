review_pass:
  verdict: revise
  source_fidelity: ينقل النص نطاق العموم في «كُلُّ مَنْ»، وتسلسل المجيء والسماع والعمل، كما يحافظ على المقارنة الشخصية في «بِمَنْ يُشْبِهُ». غير أن «سَأُبَيِّنُ» تميل إلى معنى الشرح، في حين أن ὑποδείξω تعني هنا «سأُري/سأُوضِح بالمثال»؛ و«سَأُرِيكُمْ» أقرب وأوضح في التمهيد للتشبيه التالي.
  naturalness: الصياغة فصيحة معاصرة وسلسة. «يعمل بها» تعبير عربي طبيعي في تطبيق الكلام أو الوصايا. واستبدال «سأبيّن لكم» بـ«سأريكم» يجعل الانتقال إلى المثل الآتي أشد طبيعية.
  terminology: «كلماتي» مقابل λόγων و«يعمل بها» مقابل ποιῶν αὐτούς مناسبان. لا يلزم التصريح بجنس الشخص؛ فـ«مَنْ» تؤدي العموم والإفراد التمثيليين بصورة طبيعية في العربية.
