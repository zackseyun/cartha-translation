  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: ar
  text: 'كُلُّ مَنْ يَأْتِي إِلَيَّ، وَيَسْمَعُ كَلِمَاتِي وَيَعْمَلُ بِهَا، سَأُرِيكُمْ بِمَنْ يُشْبِهُ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: كُلُّ مَنْ يَأْتِي إِلَيَّ
  rationale: ينقل التركيب الاسمي مع اسم الفاعل معنى العموم، ويحافظ حرف الجر «إلى» على دلالة الحركة نحو يسوع.
- source_word: ἀκούων μου τῶν λόγων
  choice: وَيَسْمَعُ كَلِمَاتِي
  rationale: صياغة مباشرة تحفظ التوازي بين السماع والعمل، وتفهم المضاف إليه على أنه يفيد نسبة الكلمات إلى المتكلم.
- source_word: ποιῶν αὐτούς
  choice: وَيَعْمَلُ بِهَا
  rationale: العربية الطبيعية تقول «يعمل بالكلمات» بمعنى يطبقها؛ أما «يفعلها» فثقيلة وغير مألوفة هنا.
- source_word: ὑποδείξω ὑμῖν
  choice: سَأُبَيِّنُ لَكُمْ
  rationale: ينقل معنى إظهار المثال الآتي وشرحه بعبارة عربية واضحة وطبيعية.
- source_word: τίνι ἐστὶν ὅμοιος
  choice: بِمَنْ يُشْبِهُ
  rationale: يحافظ على صيغة المقارنة وعلى استفهام العاقل في اليونانية، من غير استباق الشخص الذي سيُشبَّه به في العدد التالي.
theological_decisions:
- issue: العدد النحوي والتذكير في الوصف العام
  choice: استخدام «مَنْ» مع أفعال المفرد من غير ضمير جنسي صريح
  alternative: استخدام «الرجل الذي» أو التصريح بضمير «هو»
  rationale: «مَنْ» في العربية تفيد عموم كل إنسان، ويجوز معها إفراد الفعل؛ وهكذا يُحفظ العموم والإفراد التمثيليان في اليونانية من غير حصر المقصود في الذكور.
- issue: العلاقة بين السماع والطاعة
  choice: «يسمع كلماتي ويعمل بها»
  alternative: «يصغي إلى كلماتي ويطيعها»
  rationale: يحفظ النص الفعلين المتميزين في الأصل ولا يجعل السماع نفسه طاعة، مع بيان أن المقصود بالفعل هو تطبيق الكلمات.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. استُخدم الضبط الجزئي الكامل في نص الآية لتيسير القراءة، وحُفظت الجملة الاستهلالية التي تمهّد للتشبيه في العدد التالي.
