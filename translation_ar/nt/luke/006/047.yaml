  to: 'كُلُّ مَنْ يَأْتِي إِلَيَّ، وَيَسْمَعُ كَلِمَاتِي وَيَعْمَلُ بِهَا، سَأُرِيكُمْ بِمَنْ يُشْبِهُ:'
