  source_fidelity: 'النص ينقل بدقة بنية القول اليوناني: نفي علوّ التلميذ على معلّمه، ثم نتيجة التكوين/الإعداد المكتمل، وهي أن يصير المرء مثل معلّمه. و«اكتمل إعداده» تؤدي اسم المفعول التام κατηρτισμένος من غير أن تفرض معنى الكمال المطلق أو تقيّده بالتدريب الأكاديمي وحده.'
