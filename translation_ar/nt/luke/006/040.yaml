  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: ar
  text: ليس التلميذ أرفع من معلّمه، بل كلُّ من اكتمل إعداده سيكون مثل معلّمه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بل كلُّ من اكتمل تدريبه سيكون مثل معلّمه». ويمكن أن يفيد اللفظ أيضًا: من جرى تجهيزه أو تقويمه أو استكماله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: التلميذ
  rationale: يحفظ معنى المتعلّم المرتبط بمعلّمه والخاضع لتكوينه، وهو أنسب في هذا القول من «الطالب» ذي الإيحاء الأكاديمي الأضيق.
- source_word: ὑπὲρ
  choice: أرفع من
  rationale: تفيد هنا المقارنة في المنزلة أو المرتبة، و«أرفع من» عربية واضحة وطبيعية في سياق المقابلة بين التلميذ والمعلّم.
- source_word: διδάσκαλον / διδάσκαλος
  choice: معلّمه / معلّمه
  rationale: «المعلّم» هو المقابل المباشر الواضح، ويحافظ على الإطار التعليمي من غير إضافة معنى السيادة الذي قد توحي به «السيد».
- source_word: κατηρτισμένος
  choice: من اكتمل إعداده
  rationale: ينقل اسم المفعول التام معنى بلوغ حالة من التهيئة والتكوين المكتملين. وفي سياق التلميذ والمعلّم يشمل التدريب والتقويم، من غير حصر اللفظ في التعليم النظري وحده.
- source_word: πᾶς
  choice: كلُّ من
  rationale: ينقل القوة التعميمية للمفرد المذكر اليوناني بصياغة عربية طبيعية، مع بقاء المرجع المفرد في «معلّمه».
- source_word: ὡς
  choice: مثل
  rationale: تؤدي معنى المقارنة بوضوح في هذا القول المأثور.
- source_word: αὐτοῦ
  choice: معلّمه
  rationale: تحفظ عود الضمير المفرد المذكر إلى الشخص المذكور في «كل من»، كما في تركيب الأصل.
theological_decisions:
- issue: طبيعة اكتمال إعداد التلميذ
  choice: اكتمل إعداده
  alternative: تدرّب تدريبًا كاملًا / صار كاملًا / أُصلح
  rationale: للفعل καταρτίζω مجال دلالي يشمل الإعداد والتجهيز والتقويم والاستكمال. اختيرت عبارة واسعة تلائم سياق التلمذة ولا تحوّل القول إلى تقرير عن الكمال المطلق، مع إثبات البدائل المهمة في الحاشية.
- issue: مرجع الضمير والتذكير العام في المثل
  choice: كلُّ من ... معلّمه
  alternative: كل إنسان ... معلّمه / الجميع ... معلّمهم
  rationale: تحفظ الصيغة العربية المفردة المذكرة ذات الدلالة العامة، وتبقي التطابق بين الشخص ومعلّمه من غير تضييق المقصود على الذكور.
translation_notes:
  register: عربية فصحى معاصرة، موجزة وذات نبرة مثلية كالأصل. استُعمل «التلميذ» و«المعلّم» للمحافظة على علاقة التكوين، واختير «اكتمل إعداده» لصون السعة الدلالية للمبني للمجهول التام κατηρτισμένος.
