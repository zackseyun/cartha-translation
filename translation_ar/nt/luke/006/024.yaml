  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: ar
  text: لكن الويل لكم أيها الأغنياء، لأنكم قد نلتم عزاءكم كاملًا[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنكم تنالون عزاءكم». وقد يدل الفعل على تلقي الشيء كاملًا.'
