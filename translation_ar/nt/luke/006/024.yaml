lexical_decisions:
- source_word: πλὴν
  choice: لكن
  rationale: تُبرز المقابلة القوية مع التطويبات السابقة بعبارة عربية طبيعية واضحة.
- source_word: οὐαὶ ὑμῖν
  choice: الويل لكم
  rationale: تحافظ على صيغة التحذير النبوي الشديدة وعلى الخطاب المباشر، من غير تلطيفها إلى مجرد تعبير عن الأسف.
- source_word: τοῖς πλουσίοις
  choice: أيها الأغنياء
  rationale: تنقل النداء المباشر إلى فئة الأغنياء بصياغة عربية فصيحة ومفهومة، من غير إضافة قيد غير موجود في اليونانية.
- source_word: ὅτι
  choice: لأنكم
  rationale: توضح أن الجملة التالية تذكر سبب إعلان الويل.
- source_word: ἀπέχετε
  choice: قد استوفيتم
  rationale: ينقل المعنى الاصطلاحي المحتمل للفعل، أي نيل الشيء أو استيفاؤه كاملًا، كما يعبّر عن حالة قائمة ناتجة من التلقي؛ ويُذكر البديل الحاضر زمنيًا في الحاشية حفظًا للتوتر الدلالي.
- source_word: παράκλησιν ὑμῶν
  choice: عزاءكم
  rationale: «العزاء» مقابل عربي طبيعي لمعنى الراحة أو التعزية في هذا السياق، مع إثبات البديل الممكن في الحاشية.
theological_decisions:
- issue: طبيعة التحذير الموجَّه إلى الأغنياء
  choice: إبقاء إعلان الويل مباشرًا على الأغنياء
  alternative: تخفيفه إلى مجرد رثاء، أو إضافة قيد مثل «الذين يتكلون على غناهم»
  rationale: النص اليوناني يخاطب الأغنياء مباشرة ولا يذكر قيدًا يحدد نوعهم أو موقفهم من المال، لذلك لا تُضاف إليه علة تفسيرية غير منصوص عليها.
- issue: القوة الزمنية والدلالية للفعل ἀπέχετε
  choice: قد استوفيتم
  alternative: تنالون الآن؛ أو قد نلتم
  rationale: يمكن أن يكون الفعل حاضرًا من جهة الصيغة، لكنه يُستعمل أيضًا بمعنى استيفاء المستحق كاملًا. يحافظ المتن على هذا المعنى الاصطلاحي، وتورد الحاشية صياغة تُظهر احتمال الدلالة الحاضرة.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُخدمت صيغة «الويل لكم» للحفاظ على النبرة النبوية، و«أيها الأغنياء» لإبقاء المواجهة المباشرة. وُضعت علامتا الحاشيتين بعد «عزاءكم» لأنهما تتصلان بالفعل ومفعوله.
