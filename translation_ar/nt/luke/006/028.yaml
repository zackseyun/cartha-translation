lexical_decisions:
- source_word: εὐλογεῖτε
  choice: باركوا
  rationale: فعل أمر للجمع؛ «باركوا» هو المقابل العربي الطبيعي المألوف، ويحفظ المقابلة الأخلاقية المباشرة مع اللعن.
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: لاعنيكم
  rationale: اسم الفاعل المعرّف يؤدي وظيفة اسمية بمعنى «الذين يلعنونكم». وصيغة «لاعنيكم» موجزة وفصيحة وتحفظ معنى الكلام العدائي.
- source_word: προσεύχεσθε
  choice: صلّوا
  rationale: فعل أمر للجمع. «صلّوا» ينقل قوة الأمر بوضوح، من غير تحميل صيغة المضارع اليونانية دلالة استمرارية زائدة في العربية.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: من أجل الذين يسيئون إليكم
  rationale: تأتي περί مع فعل الصلاة بمعنى «من أجل». أما ἐπηρεάζω فيشمل الإساءة والامتهان وسوء المعاملة، واختيار «يسيئون إليكم» عربي طبيعي وواسع الدلالة.
theological_decisions:
- issue: نطاق وصايا محبة الأعداء
  choice: نقل الأمرين بوصفهما توجيهين أخلاقيين مباشرين من دون شرح عقائدي مضاف
  alternative: إضافة قيد أو تفسير يحدد كيفية البركة أو الصلاة
  rationale: النص يأمر بمقابلة العداء بالبركة والصلاة، وينبغي إبقاء قوة هذه المفارقة وتوترها الأخلاقيين من دون تضييقها بتفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «لاعنيكم» للإيجاز وحفظ المقابلة بين البركة واللعن، و«يسيئون إليكم» لتغطية المجال الدلالي الواسع للفعل اليوناني من غير حصره في الإهانة اللفظية وحدها.
