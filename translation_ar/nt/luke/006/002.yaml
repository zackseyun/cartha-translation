lexical_decisions:
- source_word: τινὲς
  choice: بعضُ
  rationale: تفيد جماعة غير محددة من الفريسيين، لا جميعهم.
- source_word: δὲ
  choice: فـ
  rationale: تربط الكلام بالسياق السابق مع إظهار الانتقال إلى اعتراض الفريسيين، وهي طبيعية في السرد العربي.
- source_word: Φαρισαίων
  choice: الفريسيين
  rationale: الاسم العربي المتداول لهذه الجماعة اليهودية.
- source_word: εἶπαν
  choice: قال
  rationale: الماضي البسيط ينقل حدث القول بصيغة سردية مباشرة؛ وجاء الفعل مفردًا وفق الاستعمال العربي مع تقدمه على الفاعل الجمع.
- source_word: Τί ποιεῖτε
  choice: لماذا تفعلون
  rationale: مع أن Τί تعني حرفيًا «ماذا»، فإن التركيب هنا سؤال اعتراضي عن سبب الفعل، فتؤدي «لماذا» قوته الطبيعية.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ما لا يحلّ
  rationale: يحفظ النبرة الشرعية الدينية ويفيد ما لا يُسمح به بحسب الحكم المتنازع عليه.
- source_word: τοῖς σάββασιν
  choice: في السبت
  rationale: الصيغة اليونانية جمع، لكنها اصطلاح شائع للدلالة على يوم السبت أو حفظه؛ والمفرد هو التعبير العربي الطبيعي.
theological_decisions:
- issue: صيغة التعبير عن السبت
  choice: في السبت
  alternative: في السبوت
  rationale: وردت الكلمة في اليونانية بصيغة الجمع، لكن هذا استعمال اصطلاحي شائع بمعنى يوم السبت. ترجمة المفرد تنقل المعنى طبيعيًا في العربية من غير أن تحسم الخلاف نفسه حول ما يحل فيه.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «يحلّ» للمحافظة على الطابع الشرعي للاعتراض، مع تجنب تركيب الجمع غير الطبيعي «في السبوت».
