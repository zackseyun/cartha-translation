  source_fidelity: 'النص العربي ينقل تسلسل اليونانية ومعناها بدقة: نظر يسوع إلى الجميع، ثم خاطب الرجل، فامتثل الرجل للأمر، واستُعيدت يده إلى حالتها السليمة. وتحافظ «عادت يده سليمة» على دلالة ἀπεκατεστάθη الاستعادية دون اختزالها في تعبير طبي محض.'
