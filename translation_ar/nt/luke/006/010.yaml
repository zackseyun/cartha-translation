  text: καὶ περιβλεψάμενος πάντας αὐτοὺς εἶπεν αὐτῷ· Ἔκτεινον τὴν χεῖρά σου· ὁ δὲ ἐποίησεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: ar
  text: 'وبعدما نظر حوله إليهم جميعًا، قال له: «مُدَّ يدك». ففعل، فعادت يده سليمة.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شُفيت يده». واليونانية أقرب حرفيًا إلى معنى عودة اليد إلى حالتها السليمة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: وبعدما نظر حوله
  rationale: يحفظ معنى اسم الفاعل الأُحادي الدال على أن يسوع تفحّص الحاضرين بنظره قبل أن يتكلم، ويؤدي التعاقب بصياغة عربية طبيعية.
- source_word: πάντας αὐτούς
  choice: إليهم جميعًا
  rationale: ينقل شمول النظرة لجميع الموجودين المشار إليهم من غير توسيع المرجع إلى أشخاص لا يحددهم النص.
- source_word: εἶπεν αὐτῷ
  choice: قال له
  rationale: ترجمة مباشرة طبيعية للفعل مع المفعول غير المباشر، من غير إضافة دلالة أمرية إلى فعل القول نفسه.
- source_word: Ἔκτεινον
  choice: مُدَّ
  rationale: ينقل فعل الأمر المباشر بعبارة عربية مألوفة تناسب حركة اليد.
- source_word: τὴν χεῖρά σου
  choice: يدك
  rationale: يحافظ على الدلالة المعتادة لـχείρ هنا، وهي اليد، وعلى ضمير الملكية الصريح.
- source_word: ὁ δὲ ἐποίησεν
  choice: ففعل
  rationale: يفيد أنه نفّذ ما أُمر به، وتؤدي الفاء الانتقال والتعاقب السردي بإيجاز طبيعي.
- source_word: ἀπεκατεστάθη
  choice: عادت ... سليمة
  rationale: ينقل معنى عودة اليد إلى حالتها الصحيحة أو السابقة، وهو أقرب إلى دلالة ἀποκαθίστημι من التصريح بالفعل الطبي «شُفيت»، مع سلامة الأسلوب العربي.
- source_word: ἡ χεὶρ αὐτοῦ
  choice: يده
  rationale: يحافظ على ذكر اليد صراحة كما في اليونانية، بصيغة ملكية عربية طبيعية.
theological_decisions:
- issue: طبيعة التعبير عن المعجزة في ἀπεκατεστάθη
  choice: عادت يده سليمة
  alternative: شُفيت يده؛ استُعيدت يده
  rationale: الصياغة المختارة تحفظ معنى عودة اليد إلى حالتها الصحيحة من غير حصر التعبير في مصطلح طبي، وتتجنب في الوقت نفسه الغموض غير الطبيعي في قول «استُعيدت يده» بالعربية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «مُدَّ يدك» للأمر الطبيعي المباشر، و«عادت يده سليمة» للجمع بين دقة معنى الاستعادة وسلاسة العربية. وُضع مؤشر الحاشية بعد الجملة التي يشرح بديلها اللفظي.
