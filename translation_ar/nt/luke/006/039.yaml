  source_fidelity: 'ينقل النص عناصر اليونانية كلها بأمانة: فعل القول مع المخاطَبين، والقوة الإضافية لـ«أيضًا»، و«مثلًا»، وسؤال القدرة البلاغي، وصورة الأعمى الذي يقود أعمى، ثم سؤال النتيجة المتوقعة بالإيجاب وسقوط الاثنين في حفرة. واستعمال المضارع العربي في «يسقط» مناسب للحقيقة العامة ذات الدلالة المستقبلية في اليونانية.'
  naturalness: 'الصياغة فصيحة حديثة، موجزة، وسليمة الإيقاع: «هل يقدر أعمى أن يقود أعمى؟ ألا يسقط كلاهما في حفرة؟». وهي تحافظ على التوازي الاستفهامي البلاغي دون تكلّف.'
