id: LUK.6.39
reference: Luke 6:39
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: ar
  text: 'وقال لهم أيضًا مثلًا: «هل يقدر أعمى أن يقود أعمى؟ ألا يسقط كلاهما في حفرة؟»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «شخص أعمى ... شخصًا أعمى». يستعمل اليوناني صيغتي المفرد المذكر استعمالًا تمثيليًا عامًا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «خندق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: أيضًا
  rationale: تحفظ القوة الإضافية للكلمة بعد δὲ بصياغة عربية طبيعية.
- source_word: παραβολὴν
  choice: مثلًا
  rationale: «مثل» هو المصطلح العربي المألوف لهذا النوع من الأقوال التصويرية في الأناجيل.
- source_word: Μήτι δύναται
  choice: هل يقدر
  rationale: ينقل سؤال القدرة البلاغي الذي يتوقع جوابًا بالنفي، من غير إضافة النفي صراحة إلى السؤال الأول.
- source_word: τυφλὸς ... τυφλὸν
  choice: أعمى ... أعمى
  rationale: يحافظ على الصيغة المذكرة المفردة المستعملة استعمالًا تمثيليًا عامًا، وهو تعبير عربي موجز وطبيعي.
- source_word: ὁδηγεῖν
  choice: أن يقود
  rationale: يلائم صورة شخص يوجّه آخر في الطريق، ويحفظ معنى المصدر اليوناني.
- source_word: οὐχὶ
  choice: ألا
  rationale: ينقل السؤال البلاغي الذي يتوقع جوابًا بالإيجاب بصياغة عربية فصيحة موجزة.
- source_word: ἀμφότεροι
  choice: كلاهما
  rationale: ينقل بوضوح أن الاثنين معًا يشتركان في المصير.
- source_word: βόθυνον
  choice: حفرة
  rationale: لفظ واسع وطبيعي يدل على نقرة أو هوة في الأرض، مع بقاء «خندق» احتمالًا معجميًا.
- source_word: ἐμπεσοῦνται
  choice: يسقط
  rationale: المضارع العربي بعد الاستفهام مناسب للدلالة المستقبلية العامة هنا، و«في» تؤدي معنى الدخول إلى الحفرة طبيعيًا.
theological_decisions:
- issue: الصيغة المذكرة في τυφλός المستعمل اسمًا
  choice: أعمى ... أعمى
  alternative: شخص أعمى ... شخص أعمى
  rationale: النص اليوناني يستعمل المفرد المذكر استعمالًا تمثيليًا في قول عام؛ أبقت الترجمة الصيغة العربية المذكرة من دون حصر دلالة المثل في الرجال.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «مثلًا» للمصطلح الإنجيلي المألوف، وحُفظ التوازي البلاغي بين السؤالين. جميع علامات الحواشي مثبتة في المتن.
