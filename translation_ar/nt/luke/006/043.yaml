  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: ar
  text: فَلَا تُوجَدُ شَجَرَةٌ جَيِّدَةٌ تُثْمِرُ ثَمَرًا فَاسِدًا[a]، وَلَا شَجَرَةٌ فَاسِدَةٌ، فِي الْمُقَابِلِ، تُثْمِرُ ثَمَرًا جَيِّدًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثَمَرًا رَدِيئًا» و«شَجَرَةٌ رَدِيئَةٌ». يمكن للكلمة اليونانية أن تعني فاسدًا أو متعفّنًا أو رديئًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ
  choice: فَلَيْسَتْ
  rationale: تنقل الفاء وظيفة γάρ التفسيرية والوصليّة في السياق، ويؤدي «ليست» نفي وجود هذا النوع من الشجر بصياغة عربية موجزة وطبيعية.
- source_word: δένδρον
  choice: شَجَرَةٌ
  rationale: المقصود شجرة مثمرة في صورة زراعية واضحة، و«شجرة» هي المقابل العربي المباشر والطبيعي.
- source_word: καλὸν
  choice: جَيِّدَةٌ
  rationale: تحفظ «جيدة» الدلالة الزراعية والتقويمية لكلمة καλός من غير حصرها في الصحة أو الجمال.
- source_word: ποιοῦν καρπὸν
  choice: تُثْمِرُ ثَمَرًا
  rationale: هذا تعبير عربي مألوف عن إنتاج الشجرة للثمر، ويحافظ على الفعل وصورة الثمر في الأصل.
- source_word: σαπρόν
  choice: فَاسِدًا
  rationale: «فاسد» يشمل معنى المتعفن أو التالف ومعنى الرديء، ويلائم الثمر والشجر معًا ويحفظ امتداد الصورة إلى معناها الأخلاقي.
- source_word: οὐδὲ πάλιν
  choice: وَلَا، فِي الْمُقَابِلِ،
  rationale: «ولا» تصل النفي الثاني بالأول، و«في المقابل» تنقل وظيفة πάλιν هنا في عرض الحالة العكسية، بصورة أوضح من «أيضًا».
- source_word: καρπὸν καλόν
  choice: ثَمَرًا جَيِّدًا
  rationale: يحافظ على التوازي والتضاد اللفظي بين «جيد» و«فاسد» في شطري القول.
theological_decisions:
- issue: حدة الصورة الزراعية والأخلاقية في σαπρός
  choice: فاسد
  alternative: متعفّن؛ رديء
  rationale: «متعفّن» يقصر اللفظ غالبًا على التحلل المادي، و«رديء» يجعله تقويميًا مجردًا؛ أما «فاسد» فيحفظ الصورة الزراعية مع السماح بدلالتها الأخلاقية في السياق من غير تفسير مذهبي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «تُثمر ثمرًا» لطبيعته في العربية، وحُفظ التوازي بين الشجرة والثمر وبين «جيد» و«فاسد». وُضع التشكيل الكامل دعمًا للقراءة المنضبطة.
