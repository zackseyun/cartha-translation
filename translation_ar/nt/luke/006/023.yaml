source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: ar
  text: افرحوا في ذلك اليوم واقفزوا من الفرح[a]، فهوذا أجركم عظيم في السماء؛ لأن آباءهم كانوا يفعلون بالأنبياء الشيء نفسه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «ابتهجوا في ذلك اليوم واقفزوا».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «لأن آباءهم كانوا يفعلون بالأنبياء الأمور نفسها»؛ أي إنهم كانوا يعاملون الأنبياء على النحو نفسه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρητε
  choice: افرحوا
  rationale: فعل أمر جمع يدعو إلى الفرح بصورة مباشرة، و«افرحوا» فصيحة وطبيعية وتحافظ على قوة الأمر.
- source_word: σκιρτήσατε
  choice: اقفزوا من الفرح
  rationale: يدل الفعل على قفز جسدي نابض بالابتهاج؛ وتوضح العبارة العربية أن القفز تعبير عن الفرح لا مجرد حركة.
- source_word: ἰδοὺ
  choice: فهوذا
  rationale: تحافظ «هوذا» على وظيفة أداة التنبيه وتناسب الأسلوب الكتابي الفصيح، وربطها بالفاء يبيّن التعليل الوارد في السياق.
- source_word: μισθὸς
  choice: أجركم
  rationale: «الأجر» هو المقابل العربي الطبيعي للمكافأة أو الجزاء الإيجابي هنا، من غير حصر المعنى في الأجرة الاقتصادية.
- source_word: πολὺς
  choice: عظيم
  rationale: 'ينقل مقدار الأجر وعلو شأنه بعبارة عربية مألوفة: «أجر عظيم».'
- source_word: ἐν τῷ οὐρανῷ
  choice: في السماء
  rationale: ينقل العبارة المكانية كما وردت من غير إضافة تفسير لاهوتي.
- source_word: κατὰ τὰ αὐτά
  choice: الأمور نفسها
  rationale: يحافظ على الصياغة المقارنة في اليونانية وعلى الإحالة إلى المعاملة المذكورة في السياق، من غير تحديد تفاصيل لم يذكرها النص.
- source_word: ἐποίουν
  choice: كانوا يفعلون
  rationale: «كانوا يفعلون» تنقل القوة الاستمرارية أو الاعتيادية لصيغة الماضي الناقص، وتبقي مفعول الفعل من جهة طبيعته غير مصرح به كما في الأصل.
- source_word: τοῖς προφήταις
  choice: بالأنبياء
  rationale: تؤدي الباء مع «يفعلون» معنى ما كان يُفعل بالأنبياء، مع إبقاء طبيعة المعاملة مستفادة من السياق.
- source_word: οἱ πατέρες αὐτῶν
  choice: آباؤهم
  rationale: ترجمة مباشرة تحافظ على التعبير العائلي والاتهام الممتد عبر الأجيال، مع احتمال أن يكون المقصود الأسلاف.
theological_decisions:
- issue: طبيعة الأجر الموعود وموضعه
  choice: أجركم عظيم في السماء
  alternative: أجركم عند الله عظيم في السماء
  rationale: يذكر النص أن الأجر عظيم «في السماء» ولا يضيف عبارة «عند الله»؛ لذلك حُفظت الصياغة وما فيها من توتر أخروي بلا توسيع تفسيري.
- issue: مرجع «آباؤهم»
  choice: آباؤهم
  alternative: أسلافهم
  rationale: قد يشير اللفظ إلى أسلاف المضطهِدين الذين عاملوا الأنبياء على النحو نفسه. أُبقي اللفظ العائلي المباشر من غير تضييق المرجع أو تلطيف الاتهام.
- issue: طبيعة ما فعله الآباء بالأنبياء
  choice: كانوا يفعلون بالأنبياء الأمور نفسها
  alternative: كانوا يعاملون الأنبياء بالطريقة نفسها
  rationale: الصياغة المختارة أقرب إلى التركيب اليوناني وتحافظ على عدم تصريح الآية هنا بالفعل المحدد، بينما البديل أوضح أسلوبيًا لكنه أكثر تفسيرًا.
