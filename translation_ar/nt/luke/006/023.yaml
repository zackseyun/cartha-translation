  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُخدمت «هوذا» للمحافظة على أداة التنبيه ذات النبرة الكتابية، مع تجنب الألفاظ المذهبية أو الشروح التي تتجاوز النص.
