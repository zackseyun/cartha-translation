  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: ar
  text: ومَتّى وتوما، ويعقوب بن حَلْفَى، وسمعان الذي يُدعى الغَيور[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المتحمّس». قد يعمل اللقب اليوناني هنا بوصفه نعتًا، ولا يقتضي بذاته أن سمعان كان عضوًا رسميًا في جماعة سياسية معيّنة.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف العطف المعتاد في العربية، وقد حُفظ تكراره بما يلائم أسلوب سرد الأسماء من غير تكلّف.
- source_word: Μαθθαῖον
  choice: مَتّى
  rationale: الصيغة العربية الراسخة لاسم Μαθθαῖος.
- source_word: Θωμᾶν
  choice: توما
  rationale: نقل عربي واضح وراسخ لاسم Θωμᾶς.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: يعقوب بن حَلْفَى
  rationale: تفيد صيغة المضاف إليه في هذا السياق علاقة البنوة على الأرجح، و«بن» هي الصياغة العربية الطبيعية المميِّزة لهذا اليعقوب.
- source_word: Σίμωνα
  choice: سمعان
  rationale: الصيغة العربية الكتابية الراسخة لاسم Σίμων.
- source_word: τὸν καλούμενον
  choice: الذي يُدعى
  rationale: ينقل التركيب الوصفي مع اسم المفعول في اليونانية بعبارة عربية طبيعية، من دون تحويل اللقب إلى تفسير زائد.
- source_word: Ζηλωτὴν
  choice: الغَيور
  rationale: ينقل اللقب اليوناني بوصفه لقبًا دالًا على الغيرة والحماسة، مع إبقاء مسألة انتسابه الرسمي إلى جماعة سياسية غير محسومة.
theological_decisions:
- issue: هل يدل Ζηλωτής على عضوية سمعان في جماعة سياسية محددة أم هو لقب وصفي؟
  choice: الغَيور
  alternative: المتحمّس؛ أو عضو جماعة الغيورين
  rationale: النص اليوناني يثبت لقبًا لسمعان، لكنه لا يحسم وحده كونه عضوًا رسميًا في حركة سياسية لاحقة؛ لذلك يحافظ «الغيور» على اللقب وعلى قدر من الغموض التاريخي دون إفراط في التفسير.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقّرة، تحافظ على إيقاع قائمة الأسماء. وُضع رمز الحاشية بعد «الغيور» لأنه يشرح هذا اللقب تحديدًا.
