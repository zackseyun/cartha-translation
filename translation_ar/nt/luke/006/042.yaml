reference: Luke 6:42
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: ar
  text: 'كيف تقدر أن تقول لأخيك[c]: «يا أخي، دعني أُخرج القذى[a] الذي في عينك»، وأنت لا ترى الخشبة[b] التي في عينك أنت؟ يا مرائي، أخرج أولًا الخشبة من عينك، وحينئذٍ ستبصر بوضوح فتُخرج القذى الذي في عين أخيك.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «القذى» بـ«شظية صغيرة»؛ فاللفظ اليوناني κάρφος يدل على قطعة صغيرة جدًا من مادة جافة.
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «الخشبة» بـ«عارضة» أو «جذع»؛ فاللفظ اليوناني δοκός يشير إلى قطعة كبيرة من الخشب.
    reason: lexical_alternative
  - marker: c
    text: لفظ «أخ» يترجم الكلمة اليونانية ἀδελφός، وهي هنا اسم قرابة مذكر مفرد. وقد ينطبق التعليم على نطاق أوسع، لكن صياغة الأصل مذكرة مفردة.
    reason: cultural_note
lexical_decisions:
- source_word: πῶς δύνασαι
  choice: كيف تقدر
  rationale: ينقل السؤال الإنكاري عن القدرة أو مشروعية الفعل بصياغة عربية واضحة وطبيعية.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: أخيك / يا أخي / أخيك
  rationale: يحافظ على لفظ القرابة المذكر المفرد في اليونانية وعلى تكراره داخل القول.
- source_word: ἄφες ἐκβάλω
  choice: دعني أُخرج
  rationale: ينقل صيغة طلب الإذن بصورة عربية مألوفة، مع الحفاظ على صورة إخراج جسم من العين.
- source_word: κάρφος
  choice: القذى
  rationale: لفظ عربي فصيح موجز لشيء صغير يقع في العين، ويحفظ التضاد البلاغي مع الخشبة.
- source_word: δοκός
  choice: الخشبة
  rationale: يدل على قطعة كبيرة من الخشب، فيحفظ المبالغة المقصودة والتباين مع القذى دون تقييدها بنوع إنشائي أدق مما يقتضيه السياق.
- source_word: αὐτὸς ... οὐ βλέπων
  choice: وأنت لا ترى ... أنت
  rationale: تكرار ضمير الخطاب في آخر العبارة يُظهر القوة التوكيدية للضمير اليوناني ويبرز مفارقة عدم رؤية العيب الذاتي.
- source_word: ὑποκριτά
  choice: يا مرائي
  rationale: نداء مفرد مباشر وحاد، وهو المقابل العربي المألوف في هذا السياق الأخلاقي.
- source_word: διαβλέψεις
  choice: ستبصر بوضوح
  rationale: يحفظ معنى استعادة الرؤية الواضحة، لا مجرد النظر، ويربط الصورة الحسية بالبصيرة اللازمة للإصلاح.
- source_word: ἐκβαλεῖν
  choice: فتُخرج
  rationale: تؤدي الفاء معنى النتيجة أو الغاية العملية بعد الإبصار الواضح، في عربية طبيعية دون حسم زائد للعلاقة النحوية.
theological_decisions:
- issue: لفظ القرابة المذكر ἀδελφός في تعليم أخلاقي
  choice: أخ / أخيك
  alternative: أخ أو أخت؛ قريبك؛ رفيقك في الإيمان
  rationale: النص اليوناني يستعمل المذكر المفرد في النداء والإشارة، لذلك حُفظ كما هو دون توسيع صريح، مع بيان إمكان شمول التعليم على نطاق أوسع في الحاشية.
- issue: التضاد المجازي بين κάρφος وδοκός
  choice: القذى ... الخشبة
  alternative: الشظية ... العارضة؛ القذى ... الجذع
  rationale: يحفظ الاختيار المفارقة المبالغ فيها بين شيء بالغ الصغر وقطعة خشب كبيرة، من غير تسطيح للصورة أو تحويلها إلى تعبير تجريدي.
- issue: قوة διαβλέψεις وعلاقتها بإزالة القذى
  choice: ستبصر بوضوح فتُخرج
  alternative: سترى كيف تُخرج؛ ستتمكن من أن تُخرج
  rationale: يبقي النص صورة الرؤية واضحة، ولا يحوّلها حصريًا إلى أهلية أخلاقية أو قدرة عملية، مع صياغة العلاقة التالية بصورة عربية سلسة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة تعليمية قوية. استُعمل «القذى» لما له من صلة طبيعية بالعين، وأُبقيت الصورة الحسية والمبالغة البلاغية. وُضعت علامات الحواشي عند أول موضع معجمي ذي صلة، وحاشية النوع النحوي بعد اكتمال الآية.
