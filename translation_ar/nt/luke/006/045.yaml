  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: ar
  text: الإنسان الصالح يُخرج الخير من الكنز الصالح في قلبه، والإنسان الشرير يُخرج الشر من كنزه الشرير؛ لأن فمه يتكلم مما يفيض به قلبه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن فمه يتكلم من وفرة قلبه».'
    reason: بديل لفظي لـ«مما يفيض به قلبه»، يعكس إمكان ترجمة περισσεύματος بـ«وفرة» مع الحفاظ على المعنى.
lexical_decisions:
- source_word: ὁ ἀγαθὸς ἄνθρωπος
  choice: الإنسان الصالح
  rationale: يحافظ على الوصف الأخلاقي وعلى شمول المثل للإنسان عمومًا، ويأتي طبيعيًا في العربية الفصحى.
- source_word: θησαυροῦ
  choice: كنز
  rationale: يحفظ صورة المخزون الباطني الذي يخرج منه الخير أو الشر، من غير توسيعها إلى «مخزن».
- source_word: καρδίας
  choice: قلبه
  rationale: «القلب» المقابل العربي المباشر والطبيعي للدلالة على باطن الإنسان وإرادته وميوله.
- source_word: προφέρει
  choice: يُخرج
  rationale: ينقل معنى الإبراز من مصدر باطني، ويكرر بصورة متوازية في شطري المقابلة.
- source_word: τὸ ἀγαθόν
  choice: الصلاح
  rationale: صيغة اسمية عربية طبيعية تحفظ المعنى الأخلاقي، مع تجنب العبارة الأثقل «ما هو صالح».
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: الشرير / الشرير / الشر
  rationale: يحافظ على القوة الأخلاقية للجذر وعلى المقابلة الواضحة مع الصالح والصلاح.
- source_word: περισσεύματος
  choice: مما يفيض به
  rationale: يستبقي صورة الامتلاء الذي يفيض إلى الخارج، ويصوغ العلاقة بين القلب والكلام بأسلوب عربي طبيعي.
- source_word: λαλεῖ
  choice: يتكلم
  rationale: لفظ فصيح مألوف يلائم حكمة مثلية ذات نبرة جليلة.
- source_word: τὸ στόμα αὐτοῦ
  choice: فمه
  rationale: يحفظ ذكر الفم صراحة بوصفه أداة التعبير الخارجي عن مكنون القلب.
theological_decisions:
- issue: التقابل الأخلاقي في ἀγαθός وπονηρός
  choice: الإبقاء على «الصالح/الصلاح» و«الشرير/الشر» بوصفها أوصافًا أخلاقية
  alternative: «الطيب/الرديء» أو أوصاف وظيفية مخففة
  rationale: السياق يتناول طبع الإنسان الأخلاقي وما يصدر عنه، فلا ينبغي تخفيف التقابل إلى مجرد الجودة والرداءة.
- issue: علاقة الكلام بباطن الإنسان في περισσεύματος καρδίας
  choice: الإبقاء على صورة فيضان ما في القلب إلى كلام الفم
  alternative: تفسيرها تفسيرًا مجردًا مثل «يتكلم بما في قلبه»
  rationale: صيغة الفيضان تحفظ الصورة البيانية وقوة العلاقة السببية في النص من غير تقرير نظرية أنثروبولوجية أوسع مما يقوله.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. روعي التوازي بين الصالح والشرير، وحُفظت استعارتا الكنز والفيضان. وُضع مؤشر الحاشية بعد الجملة التي تشرحها.
