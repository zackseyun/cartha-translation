revisions:
- from: الإنسان الصالح يُخرج الصلاح من كنز قلبه الصالح، والإنسان الشرير يُخرج الشر من كنزه الشرير؛ لأن فمه يتكلم مما يفيض به قلبه.[a]
  to: الإنسان الصالح يُخرج الخير من الكنز الصالح في قلبه، والإنسان الشرير يُخرج الشر من كنزه الشرير؛ لأن فمه يتكلم مما يفيض به قلبه.[a]
  rationale: نُقل وصف «الصالح» في الشطر الأول إلى «الكنز» صراحةً، لأنه الوصف المقصود في النص اليوناني. وأُبقيت بقية البنية، بما فيها المقابلة بين الخير والشر وصورة فيضان القلب إلى كلام الفم، دون تغيير في المعنى.
