  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: ar
  text: وحدث في سبتٍ آخر أنه دخل المجمع وكان يعلِّم. وكان هناك رجل كانت يده اليمنى يابسة[a].
  philosophy: optimal-equivalence
