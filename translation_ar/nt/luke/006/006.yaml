    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وحدث
  rationale: ينقل افتتاح الحدث والانتقال السردي اللطيف، من غير إضافة ظرف زمان لا وجود له في اليونانية.
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: في سبتٍ آخر
  rationale: تعبير عربي طبيعي يحافظ على كون الحادثة وقعت في مناسبة أخرى من أيام السبت.
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: أنه دخل المجمع
  rationale: تحويل المصدر اليوناني التابع لـἘγένετο إلى جملة فعلية واضحة وطبيعية في العربية.
- source_word: καὶ διδάσκειν
  choice: وأخذ يعلِّم
  rationale: صيغة «أخذ يعلِّم» تنقل الجانب الاستمراري للمصدر المضارع، بدل أن توحي بفعل منجز لحظي.
- source_word: ἄνθρωπος ἐκεῖ
  choice: كان هناك رجل
  rationale: يحافظ على الإحالة إلى ذكر بعينه ويصوغ جملة الوجود بأسلوب عربي مألوف.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: يده اليمنى
  rationale: يحافظ على التحديد الصريح لليد اليمنى بصياغة عربية موجزة.
- source_word: ξηρά
  choice: يابسة
  rationale: المعنى الأساسي هو الجفاف أو اليبس، وفي هذا السياق يصف يدًا مصابة بالضمور أو العجز؛ و«يابسة» تحافظ على الصورة الأصلية من غير تشخيص طبي زائد.
