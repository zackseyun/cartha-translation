  naturalness: «أمّا هم فامتلأوا حماقةً» فصيحة ومفهومة، وإن كانت ذات نبرة كتابية مناسبة. أما «وأخذوا يتشاورون فيما بينهم بشأن ما عساهم أن يفعلوا» فتجمع عدة تراكيب دالة على التداول والاستمرار، فتبدو مطوّلة. «وأخذوا يتباحثون في ما عساهم أن يفعلوا بيسوع» أكثر سلاسة مع بقاء المعنى.
  terminology: «حماقة» اختيار سليم لـἀνοία ولا يحمل إيحاءً سريريًا حديثًا. وينبغي أن تذكر الحاشية أيضًا «فقدان الرشد» بوصفه بديلًا شارحًا للمدى المعجمي، مع إبقاء «جنونًا» بديلًا ممكنًا لا تفسيرًا تشخيصيًا.
