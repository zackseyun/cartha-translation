  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: ar
  text: أمّا هم فامتلأوا حماقةً[a]، وأخذوا يتباحثون في ما عساهم أن يفعلوا بيسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «جنونًا» أو «فقدانًا للرشد». يمكن أن يدل اللفظ اليوناني على الحماقة أو فقدان الرشد أو حالة هائجة من انعدام التعقل.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: أمّا هم
  rationale: تنقل الضمير المؤكد مع قوة المقابلة التي تؤديها δὲ، بصياغة عربية طبيعية وواضحة.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: فامتلأوا حماقةً
  rationale: تحافظ على صورة الامتلاء وعلى المعنى الأساسي لـ ἄνοια، أي انعدام الرشد والحماقة، من غير حصر اللفظ في الغضب أو إعطائه دلالة مرضية حديثة.
- source_word: διελάλουν πρὸς ἀλλήλους
  choice: وأخذوا يتشاورون فيما بينهم
  rationale: «أخذوا» تبرز الاستمرار الذي يفيده الماضي الناقص، و«يتشاورون فيما بينهم» تنقل تبادل الحديث والتداول المتبادل في الأمر.
- source_word: τί ἂν ποιήσαιεν
  choice: بشأن ما عساهم أن يفعلوا
  rationale: «عساهم» تعبّر عن الاحتمال التداولي الذي تنقله ἄν مع صيغة التمني، من غير تحويله إلى وجوب أو قدرة محضة.
- source_word: τῷ Ἰησοῦ
  choice: بيسوع
  rationale: الباء بعد «يفعلوا» صياغة عربية طبيعية للفعل الموجَّه إلى يسوع، ولا تصرّح بأكثر مما يصرّح به النص اليوناني بقول «ضد يسوع».
theological_decisions:
- issue: هل تُترجم ἀνοίας بلفظ يوحي باضطراب نفسي أم بلفظ يبرز انعدام الرشد الأخلاقي؟
  choice: حماقةً
  alternative: جنونًا؛ غيظًا أعمى
  rationale: «حماقة» تحفظ البعد المتعلق بانعدام الرشد، ولا تستورد مفهومًا سريريًا حديثًا، كما أنها لا تضيف الغضب صراحةً مع أن السياق العدائي قد يوحي به. وتُذكر البدائل في الحاشية لصون سعة اللفظ اليوناني.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. حُفظت مقابلة «أمّا هم» واستمرارية التشاور، وتُركت طبيعة الفعل المزمع ضد يسوع غير محددة كما في الأصل.
