  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: ar
  text: وكان الكتبة والفريسيون يراقبونه عن كثب[a] ليروا هل يشفي في يوم السبت، لكي يجدوا ما يتهمونه به[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يرصدونه بدقة». يمكن للفعل اليوناني أن يدل على مراقبة دقيقة، بل متربصة في هذا السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لكي يجدوا سبيلًا إلى اتهامه»، أو ببساطة: «لكي يتهموه». يفيد التعبير اليوناني أنهم كانوا يبحثون عما يستندون إليه في توجيه اتهام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: كانوا يراقبونه عن كثب
  rationale: ينقل صيغة الماضي الناقص معنى المراقبة المستمرة المتعمدة، ويعكس السياق طابعها المتربص. أُضيف ضمير المفعول «ـه» اعتمادًا على المرجع السياقي الواضح، أي يسوع.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: المقابل العربي المألوف والمباشر لهذه الفئة في سياق الأناجيل، من غير تحويل الاسم إلى تفسير وظيفي.
- source_word: Φαρισαῖοι
  choice: الفريسيون
  rationale: التسمية العربية القياسية لهذه الجماعة.
- source_word: εἰ
  choice: ليروا هل
  rationale: صياغة عربية طبيعية للسؤال غير المباشر الواقع بعد فعل المراقبة، مع إظهار غرضهم من الترقب.
- source_word: ἐν τῷ σαββάτῳ
  choice: في السبت
  rationale: تعبير عربي واضح يحافظ على مفرد المصدر ودلالته الزمنية.
- source_word: θεραπεύει
  choice: يشفي
  rationale: المضارع العربي داخل السؤال غير المباشر طبيعي، ويُبقي الفعل عامًا من غير افتراض وقوع الشفاء مسبقًا.
- source_word: ἵνα εὕρωσιν
  choice: لكي يجدوا
  rationale: يحافظ على دلالة الغرض الصريحة في تركيب ἵνα.
- source_word: κατηγορεῖν αὐτοῦ
  choice: ما يتهمونه به
  rationale: ينقل اصطلاحيًا معنى إيجاد أساس أو مادة لاتهامه، من غير تقييد الاتهام بصيغة قانونية أشد مما يقتضيه النص.
theological_decisions:
- issue: تصوير قصد الكتبة والفريسيين
  choice: مراقبة متربصة غايتها العثور على ما يُتَّهم به يسوع
  alternative: ملاحظة محايدة لمعرفة هل سيشفي
  rationale: دلالة فعل المراقبة في السياق، مع جملة الغرض «لكي يجدوا»، تكشف قصدًا اتهاميًا متعمدًا، لكن الصياغة لا تضيف حكمًا أوسع على الجماعتين يتجاوز هذه الواقعة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على مصطلحي «الكتبة» و«الفريسيون» لشيوعهما ودقتهما، واستُخدمت «يراقبونه عن كثب» لإبراز الاستمرار والترصد من غير مبالغة.
