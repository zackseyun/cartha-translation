base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: ar
  text: 'وكان يقول لهم: «ابن الإنسان هو ربُّ السبت».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ابن الإنسان هو صاحب السلطان على السبت».'
    reason: بديل معجمي يصرّح بدلالة الإضافة بعد «ربّ» على السلطان المتعلق بالسبت.
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: تحافظ أداة العطف على تسلسل السرد من غير إضافة دلالة زمنية غير مصرَّح بها.
- source_word: ἔλεγεν
  choice: كان يقول
  rationale: ينقل صيغة الماضي الناقص اليونانية بما تحتمله من استمرار أو تكرار في سياق السرد، مع بقاء العبارة طبيعية في العربية.
- source_word: αὐτοῖς
  choice: لهم
  rationale: ترجمة مباشرة وطبيعية لضمير الجمع في حالة المجرور، من غير زيادة في تحديد المخاطَبين.
- source_word: Κύριος
  choice: ربّ
  rationale: تعبّر عن السيادة والسلطان هنا، وتحفظ القوة المسيحانية للقول بدل اختزاله في معنى المعلّم أو السيد بوصفه خطابًا مهذبًا.
- source_word: τοῦ σαββάτου
  choice: السبت
  rationale: يُعبَّر عن تركيب الإضافة اليوناني طبيعيًا في العربية بقول «ربّ السبت»، وهو تركيب موجز يدل على السلطان المتعلق بالسبت.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الصياغة الراسخة والواضحة لهذا اللقب، وتحفظ خلفيته السامية وصلته المحتملة بدانيال 7.
theological_decisions:
- issue: دلالة قول يسوع عن سيادة ابن الإنسان على السبت
  choice: «ابن الإنسان هو ربّ السبت»
  alternative: «ابن الإنسان صاحب السلطان على السبت»
  rationale: تحفظ الصياغة المختارة الإسناد المباشر والقوي للسيادة إلى ابن الإنسان، ولا تضيف «حتى» أو غيرها مما ليس صريحًا في نص لوقا هنا. أما البديل فيوضح معنى السلطان لكنه يفسر لفظ «رب» بدل أن ينقله.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «كان يقول» لحفظ جانب الفعل الناقص، و«ابن الإنسان» بوصفه اللقب الكتابي المألوف. وُضعت علامة الحاشية بعد الاقتباس لأنها تتعلق بصياغة الجملة المقتبسة.
