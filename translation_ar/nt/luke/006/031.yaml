  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: ar
  text: وكما تريدون أن يفعل الناس بكم، افعلوا بهم كذلك.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: كما
  rationale: تُدخل معيار المقارنة بوضوح وطبيعية، وتحافظ على قوة المماثلة في الأصل.
- source_word: θέλετε
  choice: تريدون
  rationale: ينقل معنى الرغبة العادية بلغة عربية معاصرة واضحة، من غير رفع الأسلوب إلى «تشتهون» أو تخصيصه.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: أن يفعل ... بكم
  rationale: تركيب «تريدون أن» هو المقابل العربي الطبيعي لمضمون الإرادة، و«يفعل بكم» يبقي الفعل عامًا كما في اليونانية.
- source_word: οἱ ἄνθρωποι
  choice: الناس
  rationale: اللفظ اليوناني عام يشمل البشر ولا يختص بالذكور؛ و«الناس» أوضح مقابل عربي طبيعي.
- source_word: ποιεῖτε
  choice: افعلوا
  rationale: يحافظ على صيغة الأمر وعلى تكرار جذر «فعل» في شطري القول، من غير تحميل صيغة المضارع اليونانية دلالة زائدة.
- source_word: αὐτοῖς
  choice: بهم
  rationale: يوازي «بكم» ويحافظ على البنية التبادلية وعلى عموم ما يفعله المرء تجاه الآخرين.
- source_word: ὁμοίως
  choice: كذلك
  rationale: يعبّر بإيجاز وطبيعية عن الفعل الموافق أو المماثل لما يرغب المخاطبون أن يُفعل بهم.
theological_decisions:
- issue: الدلالة العامة للفظ οἱ ἄνθρωποι
  choice: الناس
  alternative: البشر؛ الرجال
  rationale: السياق يقدم قاعدة أخلاقية عامة، واللفظ اليوناني هنا لا يدل على الذكور وحدهم؛ لذلك تتجنب «الناس» إدخال تخصيص جنسي غير موجود في المصدر.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة ووقورة. حُفظ التوازي بين «يفعل ... بكم» و«افعلوا ... بهم»، ولم يُستبدل الفعل العام «يفعل» بتفسير أضيق مثل «يعامل».
