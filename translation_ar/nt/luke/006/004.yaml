  to: كَيْفَ دَخَلَ بَيْتَ اللهِ، وَأَخَذَ خُبْزَ الْحُضُورِ[a] فَأَكَلَ، وَأَعْطَى مِنْهُ الَّذِينَ مَعَهُ؛ وَهُوَ خُبْزٌ لَا يَحِلُّ أَكْلُهُ إِلَّا لِلْكَهَنَةِ وَحْدَهُمْ؟
  rationale: حُذفت الإضافة غير الصريحة «أيضًا»، واستُبدلت وصلة «مع أنه» بصياغة وصفية تربط القيد الشرعي مباشرة بخبز الحضور. وأضيفت «منه» لإظهار مرجع العطاء المفهوم من السياق من غير تغيير المعنى.
