  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: ar
  text: كَيْفَ دَخَلَ بَيْتَ اللهِ، وَأَخَذَ خُبْزَ الْحُضُورِ[a] فَأَكَلَ، وَأَعْطَى مِنْهُ الَّذِينَ مَعَهُ؛ وَهُوَ خُبْزٌ لَا يَحِلُّ أَكْلُهُ إِلَّا لِلْكَهَنَةِ وَحْدَهُمْ؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الخبز المقدَّس»؛ ويُسمّى تقليديًا «خبز التقدمة».
    reason: بدائل معجمية لعبارة ἄρτους τῆς προθέσεως توضّح المقصود الطقسي.
lexical_decisions:
- source_word: ὡς
  choice: كَيْفَ
  rationale: تقدّم مضمون الفعل الذي فعله داود في سياق السؤال، وتحافظ على صيغة الاستفهام غير المباشر.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: دَخَلَ بَيْتَ اللهِ
  rationale: صياغة عربية طبيعية ودقيقة تحافظ على لفظ «بيت الله» بدل استبداله تفسيرًا بـ«الهيكل».
- source_word: ἄρτους τῆς προθέσεως
  choice: خُبْزَ الْحُضُورِ
  rationale: يحافظ على الدلالة الطقسية للخبز الموضوع أمام الله، مع صياغة مفهومة في العربية الحديثة.
- source_word: λαβὼν ἔφαγεν
  choice: أَخَذَ ... فَأَكَلَ
  rationale: تحويل اسم الفاعل اليوناني مع الفعل الرئيس إلى فعلين عربيين متتابعين يبيّن ترتيب الحدث طبيعيًا.
- source_word: καὶ ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: وَأَعْطَى الَّذِينَ مَعَهُ أَيْضًا
  rationale: «الذين معه» يقابل العبارة اليونانية مباشرة، و«أيضًا» يبيّن أن داود لم يأكل وحده بل أعطى رفاقه.
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: لَا يَحِلُّ أَكْلُهُ
  rationale: «لا يحل» تنقل معنى الجواز الشرعي والديني، لا مجرد المنع الاجتماعي.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: إِلَّا لِلْكَهَنَةِ وَحْدَهُمْ
  rationale: تحافظ على الحصر المؤكد الذي تعبّر عنه εἰ μὴ وμόνους.
theological_decisions:
- issue: القيد الشرعي والطقسي المتعلق بالخبز المقدس
  choice: لَا يَحِلُّ أَكْلُهُ
  alternative: لا يُسمح بأكله
  rationale: الاختيار يحفظ كون المنع قائمًا على شريعة العبادة الخاصة بالكهنة، من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. وُضع رمز الحاشية بعد «خبز الحضور» لأنه المصطلح الذي تشرحه الحاشية. حُفظ الاستفهام الختامي بوصف الآية جزءًا من سؤال يسوع في السياق.
