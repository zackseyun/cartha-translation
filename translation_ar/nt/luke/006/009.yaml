base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: ar
  text: 'فقال يسوع لهم: «أسألكم: أيحلّ في يوم السبت أن نفعل الخير أم نُلحق الضرر[a]، وأن ننقذ حياةً[b] أم نهلكها؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن نفعل الشر». يفيد الفعل اليوناني فعل ما هو شرير أو مؤذٍ، ويقيم مقابلة أخلاقية مع فعل الخير.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «نفسًا». تدل الكلمة اليونانية هنا على حياة الإنسان أو شخصه في سياق الإنقاذ والإهلاك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تربط الكلام بما سبقه وتفيد الانتقال مع مسحة خفيفة من المقابلة، من غير إثقال العربية بأداة استدراك قوية.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: أسألكم
  rationale: صياغة عربية مباشرة وطبيعية تحفظ قوة السؤال التحدّية.
- source_word: εἰ ἔξεστιν
  choice: أيحلّ
  rationale: يحفظ البعد الشرعي والأخلاقي للسؤال في سياق الخلاف بشأن السبت، وهو أدق من مجرد «أيمكن».
- source_word: τῷ σαββάτῳ
  choice: في السبت
  rationale: تعبير عربي موجز ومألوف للدلالة على وقوع الفعل في يوم السبت.
- source_word: ἀγαθοποιῆσαι
  choice: أن نفعل الخير
  rationale: يحفظ الدلالة الأخلاقية الصريحة ويقيم المقابلة مع الفعل المؤذي.
- source_word: κακοποιῆσαι
  choice: أن نُلحق الضرر
  rationale: يلائم سياق الشفاء والمقابلة التالية بين إنقاذ الحياة وإهلاكها، مع إبقاء «فعل الشر» بديلًا معجميًا مشروعًا في الحاشية.
- source_word: ψυχὴν
  choice: حياةً
  rationale: تشير ψυχή هنا، في تركيب الإنقاذ والإهلاك، إلى حياة إنسان في معناها الملموس، لا بالضرورة إلى النفس بوصفها عنصرًا غير مادي.
- source_word: σῶσαι
  choice: أن ننقذ
  rationale: تعبير عربي طبيعي عند الحديث عن حفظ حياة، وينقل معنى التخليص من الهلاك في هذا السياق.
- source_word: ἀπολέσαι
  choice: نهلكها
  rationale: يحفظ قوة التضاد مع الإنقاذ، ولا يضيّق المعنى إلى القتل وحده.
theological_decisions:
- issue: دلالة ψυχή في عبارة ψυχὴν σῶσαι ἢ ἀπολέσαι
  choice: «أن ننقذ حياةً أم نهلكها»
  alternative: «أن نخلّص نفسًا أم نهلكها»
  rationale: السياق المباشر هو شفاء إنسان في السبت، ولذلك ترجّح الدلالة الملموسة المتعلقة بحفظ الحياة، من غير إنكار إمكان ترجمة اللفظة «نفسًا» في مواضع أخرى أو بحسب الصياغة الحرفية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «أيحلّ» لإبراز الطابع الشرعي للسؤال، وحُفظ التوازي بين فعل الخير وإلحاق الضرر، وبين إنقاذ الحياة وإهلاكها.
