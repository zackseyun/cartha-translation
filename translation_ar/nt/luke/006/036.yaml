  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: ar
  text: كونوا رحماء[a]، كما أن أباكم رحيم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شفوقين». تدل الصفة اليونانية على من تتحرك فيه الشفقة ويُظهر الرحمة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: كونوا
  rationale: فعل أمر حاضر للجمع؛ و«كونوا» صياغة عربية طبيعية تحفظ قوة الأمر، ويمكن أن تفيد السلوك المستمر بحسب السياق، من غير إثقال العبارة بـ«صيروا».
- source_word: οἰκτίρμονες
  choice: رحماء
  rationale: تدل الصفة على المتصفين بالرحمة والشفقة. «رحماء» واضحة وطبيعية، وتحافظ على الصلة اللفظية مع الصفة المفردة في آخر الآية.
- source_word: καθὼς
  choice: كما أن
  rationale: تفيد المقارنة واتخاذ رحمة الآب مثالًا؛ و«كما أن» تنقل هذا المعنى بوضوح من غير تحويلها إلى تعليل سببي.
- source_word: ὁ πατὴρ ὑμῶν
  choice: أباكم
  rationale: يحافظ على عبارة المصدر «أبوكم» من غير إضافة «السماوي» غير الموجودة في النص اليوناني.
- source_word: οἰκτίρμων
  choice: رحيم
  rationale: يحافظ على الجذر العربي نفسه المستعمل في «رحماء»، فيعكس تكرار الصفة اليونانية مع مراعاة المطابقة النحوية العربية.
theological_decisions:
- issue: علاقة الوصية بصفة الآب
  choice: 'تُعرض رحمة الآب بوصفها المثال الذي يقتدي به المخاطبون: «كونوا رحماء، كما أن أباكم رحيم».'
  alternative: كونوا رحماء لأن أباكم رحيم.
  rationale: الأقرب أن καθώς أداة مقارنة («كما») لا أداة تعليل («لأن»)، وبذلك يبقى معنى الاقتداء الأخلاقي من غير إضافة تفسير لاهوتي إلى النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة وذات نبرة كريمة. استُعمل «رحماء/رحيم» للمحافظة على التكرار الدلالي في الأصل، مع إيراد «شفوقين» بديلًا في الحاشية.
