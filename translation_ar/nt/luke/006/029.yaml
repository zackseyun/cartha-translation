review_pass:
  verdict: revise
  source_fidelity: المعنى العام أمين للنص اليوناني، بما في ذلك التمييز بين فعل لوقا «قدِّم/أتح» وبين الصياغة المألوفة «أدر». لكن «فلا تمنعه من قميصك» أقل مباشرة في العربية من حيث بيان أن المنع يتعلق بأخذ القميص؛ فإظهار فعل الأخذ يحفظ علاقة «لا تمنع» بالسياق على نحو أوضح.
  naturalness: «فاعرض له الآخر» مفهومة، لكنها تترك المرجع محذوفًا في موضع تكون فيه إعادة «الخد» أفصح وأوضح للقارئ العربي الحديث. كما أن «فلا تمنعه أن يأخذ قميصك أيضًا» أكثر سلاسة ودقة من «فلا تمنعه من قميصك».
  terminology: «خد»، «رداء»، و«قميص» اختيارات مناسبة. وتظل الحاشية مفيدة في بيان أن الرداء هو الثوب الخارجي وأن القميص هو الثوب الداخلي. لا يلزم نقل حاشية إنجليزية خاصة بتقليد الصياغة الإنجليزية.
