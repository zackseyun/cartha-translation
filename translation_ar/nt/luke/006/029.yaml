    rationale: قد يُفهم، لكنه لا يصرح بالفعل الذي يمنع عنه المخاطَب. وإضافة «أن يأخذ» تنقل بصورة أوضح معنى μὴ κωλύσῃς في سياق الآخذ للرداء.
