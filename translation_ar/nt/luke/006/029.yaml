  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: ar
  text: مَن يضربك على خدِّك[a]، فقدِّم له الخدَّ الآخر أيضًا؛ ومَن يأخذ رداءك، فلا تمنعه أن يأخذ قميصك أيضًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على فكِّك».'
    reason: lexical_alternative
  - marker: b
    text: «الرداء» هو الثوب الخارجي، و«القميص» هو الثوب الداخلي.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί
  choice: مَن يضربك
  rationale: اسم الفاعل المعرَّف بالتركيب اليوناني يدل هنا على شخص على وجه العموم؛ وصيغة «مَن يضربك» عربية طبيعية وتحفظ هذا المعنى.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: على خدِّك
  rationale: يمكن أن تدل σιαγών على الخد أو الفك؛ و«الخد» أنسب في سياق الضرب على الوجه، مع إثبات البديل في الحاشية.
- source_word: πάρεχε
  choice: فاعرض له
  rationale: الفعل يعني قدِّم أو أتح؛ و«اعرض له» يحفظ صياغة لوقا المميزة ولا يستورد فعل «أدر» من الصياغة المألوفة في متى.
- source_word: καὶ τὴν ἄλλην
  choice: الآخر أيضًا
  rationale: الموصوف المحذوف مفهوم من «الخد»، و«أيضًا» تنقل دلالة καί وتحفظ التوازي.
- source_word: ἀπὸ τοῦ αἴροντός σου
  choice: ومَن يأخذ
  rationale: ينقل اسم الفاعل الدال على الشخص عمومًا، ويؤدي αἴρω هنا معنى الأخذ أو النزع بحسب السياق.
- source_word: τὸ ἱμάτιον
  choice: رداءك
  rationale: ἱμάτιον هو الثوب الخارجي؛ و«الرداء» لفظ عربي واضح وموجز يميزه من الثوب الداخلي.
- source_word: τὸν χιτῶνα
  choice: قميصك
  rationale: χιτών هو الثوب الداخلي الملاصق للجسد. «القميص» أوضح للقارئ العربي الحديث من اللفظ التاريخي «التونيك»، مع شرح الفرق في الحاشية.
- source_word: μὴ κωλύσῃς
  choice: فلا تمنعه من
  rationale: κωλύω يعني يمنع أو يعيق؛ وفي هذا السياق تفيد العبارة عدم منع الآخذ من الثوب الآخر، وتحفظ صورة الأمر المباشر.
theological_decisions:
- issue: هل تُوفَّق صياغة لوقا مع العبارة الأشهر «أدر له الخد الآخر»؟
  choice: 'الإبقاء على صياغة لوقا: «فاعرض له الآخر أيضًا»'
  alternative: «فأدر له الخد الآخر»
  rationale: يستعمل النص πάρεχε، أي «قدِّم/اعرض»، لا فعلًا بمعنى «أدر». وبذلك تبقى الترجمة أمينة لصياغة لوقا ولا تستورد تعبير النص الموازي.
- issue: هل تُضاف قيود تفسيرية إلى الأمرين؟
  choice: نقل الأمرين مباشرة من غير تلطيف أو تقييد تفسيري
  alternative: إضافة عبارات تشرح أنهما عن عدم الانتقام أو أنهما مبالغة بلاغية
  rationale: يعرض النص أمرين مباشرين للمخاطب؛ ومن ثم ينبغي حفظ قوة التعليم وتوتره التفسيري بدل حسمه داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختيرت «فاعرض له» بدل العبارة التقليدية «فأدر له» للمحافظة على فعل لوقا، واستُخدم «رداء/قميص» لبيان التمييز بين الثوب الخارجي والداخلي دون ألفاظ أثرية غامضة.
