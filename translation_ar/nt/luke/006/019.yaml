source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: ar
  text: وكان الجمع كله يحاول أن يلمسه، لأن قوة كانت تخرج منه[a] وتشفي الجميع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كانت تصدر عنه».'
    reason: بديل معجمي للتعبير παρ’ αὐτοῦ ἐξήρχετο.
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: الجمع كله
  rationale: يحافظ على دلالة الاسم الجمعي المفرد مع πᾶς، ويعبّر طبيعيًا عن اشتراك الجمع بأسره.
- source_word: ἐζήτουν
  choice: كان ... يحاول
  rationale: ينقل صيغة الماضي الناقص بوصفها فعلًا مستمرًا أو متكررًا، كما أن «يحاول» أنسب من النقل الحرفي «يطلب» في هذا السياق.
- source_word: ἅπτεσθαι αὐτοῦ
  choice: أن يلمسه
  rationale: «يلمس» هو المعنى الطبيعي للفعل في سياق طلب الشفاء بالاتصال بيسوع.
- source_word: δύναμις
  choice: قوة
  rationale: ينقل اللفظ اليوناني مباشرة من غير إضافة وصف مثل «عجائبية» غير مصرّح به في النص.
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: كانت تخرج منه
  rationale: يحفظ صورة القوة الصادرة من يسوع واستمرار خروجها الذي تدل عليه صيغة الماضي الناقص.
- source_word: ἰᾶτο πάντας
  choice: تشفي الجميع
  rationale: يجعل «القوة» فاعل الشفاء كما يسمح به التركيب اليوناني، ويحفظ استمرار الفعل وشموله للجميع.
theological_decisions:
- issue: طبيعة القوة الخارجة من يسوع
  choice: قوة كانت تخرج منه
  alternative: قوة عجائبية كانت تصدر عنه
  rationale: يثبت النص أن يسوع مصدر قوة فعالة للشفاء، لكن الترجمة لا تضيف توصيفًا عقائديًا أو تفسيرًا يتجاوز اللفظ اليوناني.
- issue: فاعل فعل الشفاء
  choice: القوة هي التي «تشفي الجميع» نحويًا
  alternative: يسوع هو الفاعل المفهوم ضمنًا
  rationale: الفعلان اليونانيان ἐξήρχετο وἰᾶτο مفردان، وأقرب مرجع نحوي صريح هو δύναμις «قوة»؛ لذلك تُحفظ هذه البنية من غير نفي أن القوة صادرة من يسوع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الجمع» بدل «الحشد» لملاءمة الأسلوب الكتابي المعاصر، مع إبقاء العبارة مباشرة وغير مثقلة بالتفسير.
