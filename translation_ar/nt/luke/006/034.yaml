  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: ar
  text: وإن أقرضتم الذين تتوقعون أن تستردّوا منهم، فأيّ فضلٍ لكم؟[a] فالخطاة أيضًا يُقرضون الخطاة لكي يستردّوا ما يعادل ما أقرضوه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فأيّ شكرٍ لكم؟» يمكن للكلمة اليونانية أن تعني «الشكر» أيضًا، لكن السياق هنا يرجّح معنى الفضل أو ما يستحق التقدير.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: أقرضتم / يُقرضون
  rationale: الفعل يدل على إقراض مال أو متاع، و«أقرض» هو المقابل العربي الواضح والمباشر.
- source_word: παρ’ ὧν ἐλπίζετε λαβεῖν
  choice: الذين ترجون أن تستردّوا منهم
  rationale: تحافظ الصياغة على دلالة ἐλπίζω بين الرجاء والتوقّع، وتُظهر أن الاسترداد يكون من المقترضين، بينما يوضّح السياق أن المقصود ردّ القرض.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: فأيّ فضلٍ لكم؟
  rationale: «فضل» تعبر هنا عن المزيّة أو الاستحقاق المحمود، مع إبقاء احتمال معنى الشكر في الحاشية، من غير حمل χάρις على النعمة الخلاصية.
- source_word: ἁμαρτωλοὶ
  choice: الخطاة
  rationale: مقابل عربي مألوف ودقيق للصفة المستعملة اسمًا، ويحفظ التصنيف الأخلاقي في النص.
- source_word: ἵνα ἀπολάβωσιν τὰ ἴσα
  choice: لكي يستردّوا ما يعادل ما أقرضوه
  rationale: تنقل معنى الاسترداد والمماثلة في τὰ ἴσα، من غير افتراض فائدة أو ربح، كما تلائم القرض مالًا كان أو متاعًا.
theological_decisions:
- issue: دلالة χάρις في السؤال البلاغي
  choice: «فضل» بمعنى المزيّة أو موضع التقدير
  alternative: «شكر» أو «نعمة» أو «فائدة»
  rationale: السياق يقارن سلوك التلاميذ بسلوك الخطاة، فالمقصود ما يميّز الفعل ويجعله جديرًا بالتقدير، لا النعمة الخلاصية بوصفها مفهومًا لاهوتيًا؛ ومع ذلك أُثبت احتمال «الشكر» في الحاشية.
- issue: طبيعة ما يُنتظر استرداده من القرض
  choice: استرداد ما يعادل ما أُقرض
  alternative: استرداد القرض مع فائدة أو ربح
  rationale: تفيد عبارة τὰ ἴσα التكافؤ أو المماثلة، ولا تنص على فائدة، لذلك تجنبت الترجمة إضافة حكم اقتصادي غير موجود في النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. استُعمل «تستردّوا» لإبراز معنى الرجوع في ἀπολαμβάνω، وصيغت المماثلة بعبارة طبيعية لا تحصر القرض في النقود.
