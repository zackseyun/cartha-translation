  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: ar
  text: فلماذا تدعونني «يا رب، يا رب»، ولا تفعلون ما أقول؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί
  choice: فَلِمَاذَا
  rationale: تأتي Τί هنا استعمالًا ظرفيًّا للسؤال عن السبب، لا للسؤال عن ماهية شيء؛ و«فلماذا» تنقل قوة الاستفهام التوبيخي، مع وصل السؤال بسياقه السابق.
- source_word: δέ
  choice: فَـ
  rationale: δέ أداة ربط خفيفة، ونقلت هنا بالفاء التي تلائم الانتقال السياقي إلى السؤال الاستنكاري من غير مبالغة في معنى الاستدراك.
- source_word: με
  choice: ـنِي
  rationale: ضمير مفعول به مباشر للفعل καλεῖτε، وألحق بالفعل على مقتضى العربية.
- source_word: καλεῖτε
  choice: تَدْعُونَنِي
  rationale: الفعل مضارع مخاطب لجمع، و«تدعونني» طبيعي في سياق مخاطبة شخص بلقب.
- source_word: Κύριε κύριε
  choice: يَا رَبُّ، يَا رَبُّ
  rationale: حُفظ النداء المكرر بما فيه من توكيد، واختير «رب» لما يحمله κύριος هنا من معنى السيادة واللقب الموجَّه إلى يسوع.
- source_word: καὶ οὐ
  choice: وَلَا
  rationale: تنقل «ولا» التنسيق مع التباين بين النداء اللفظي وعدم العمل، بأسلوب عربي طبيعي.
- source_word: ποιεῖτε
  choice: تَفْعَلُونَ
  rationale: يدل ποιέω هنا على تنفيذ ما يقوله يسوع؛ و«تفعلون» مباشر ويحافظ على صياغة النص من غير إدخال لفظ «تطيعون» تفسيرًا.
- source_word: ἃ
  choice: مَا
  rationale: اسم موصول يشمل مضمون أقوال يسوع، و«ما» هي المقابل العربي الطبيعي الموجز.
- source_word: λέγω
  choice: أَقُولُ
  rationale: نقل مباشر للمضارع المتكلم، من غير إضافة مفعول غير مصرح به في اليونانية.
theological_decisions:
- issue: دلالة κύριος لقبًا موجَّهًا إلى يسوع
  choice: رَبّ
  alternative: معلّم / سيّد
  rationale: «رب» يحفظ ثقل اللقب ومعنى السيادة واحتماله المسيحاني في السياق، بينما «معلّم» أو «سيّد» ممكنان معجميًّا لكنهما قد يضيّقان الدلالة. أُبقي البديل في الحاشية حفاظًا على المجال الدلالي.
- issue: العلاقة بين الاعتراف اللفظي والعمل
  choice: ولا تفعلون ما أقول
  alternative: ولا تطيعونني
  rationale: الصياغة المختارة تحافظ على ألفاظ النص وتوتره بين تسمية يسوع ربًّا وعدم تنفيذ كلامه، من غير تحويل ποιεῖτε إلى مصطلح لاهوتي أكثر تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل الضبط الجزئي في النداء لتفادي قراءة «يا ربِّ» الشائعة غير الموافقة لحكم المنادى المضاف إليه ضمير مقدر في هذا التركيب، وحُفظ تكرار اللقب والاستفهام التوبيخي.
