  naturalness: الصياغة فصيحة وواضحة عمومًا. لكن النقطتين بعد «تدعونني» ليستا ضروريتين في العربية هنا؛ فالقول المنقول يقع مفعولًا به مباشرًا للفعل، وتأتي العبارة أسلس من دون نقطتين. كما أن حذف الضبط الجزئي يجعل النص أكثر اتساقًا مع الاستعمال العربي الحديث ويجنب إشكالًا شكليًا غير لازم في نداء «يا رب».
  terminology: «رب» اختيار مناسب لـΚύριε ويحفظ ثقل اللقب في هذا السياق، مع أن «سيّد» بديل معجمي ممكن وقد أُشير إليه في الحاشية. و«تفعلون ما أقول» ترجمة مباشرة وطبيعية لـποιεῖτε ἃ λέγω، من غير تفسير زائد.
