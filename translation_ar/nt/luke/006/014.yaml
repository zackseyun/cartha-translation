lexical_decisions:
- source_word: Σίμωνα
  choice: سِمْعَانَ
  rationale: الصيغة العربية الكتابية المألوفة لاسم Σίμων، مع ضبطها بما يلائم موقعها في قائمة المفعول بهم المتصلة بالآية السابقة.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: الذي سمّاه أيضًا بطرس
  rationale: «سمّاه» تنقل فعل إطلاق الاسم بدقة، و«أيضًا» تعكس καί في هذا التركيب دون اختزاله إلى مجرد أداة عطف.
- source_word: Πέτρον
  choice: بطرس
  rationale: الصيغة العربية الراسخة لاسم Πέτρος في العهد الجديد.
- source_word: Ἀνδρέαν
  choice: أندراوسَ
  rationale: الصيغة العربية الكتابية الشائعة للاسم اليوناني Ἀνδρέας.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: أخاه
  rationale: تعبير عربي طبيعي ودقيق يدل هنا على الأخ الشقيق، والضمير يعود إلى سمعان.
- source_word: Ἰάκωβον
  choice: يعقوبَ
  rationale: الصيغة العربية الكتابية المألوفة للاسم Ἰάκωβος، وتحافظ على صلته بالاسم السامي يعقوب.
- source_word: Ἰωάννην
  choice: يوحنا
  rationale: الصيغة العربية الراسخة لاسم Ἰωάννης.
- source_word: Φίλιππον
  choice: فيلبّسَ
  rationale: الصيغة العربية الشائعة في الترجمات الكتابية لاسم Φίλιππος.
- source_word: Βαρθολομαῖον
  choice: برثولماوسَ
  rationale: الصيغة العربية الكتابية المألوفة لاسم Βαρθολομαῖος.
- source_word: καὶ
  choice: و
  rationale: تؤدي واو العطف وظيفة καί الطبيعية في تعداد الأسماء، مع إبقاء καί في عبارة التسمية بمعنى «أيضًا».
