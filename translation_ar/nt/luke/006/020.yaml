base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: ar
  text: 'ورفع عينيه نحو تلاميذه، وكان يقول: «طوبى لكم أيها الفقراء، لأن ملكوت الله لكم».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا من حيث صيغة العبارة اليونانية: «طوبى للفقراء»، لكن كلمة «لكم» تجعل القول خطابًا مباشرًا. ويقول لوقا «الفقراء»، لا «الفقراء بالروح» (قارن متى 5:3).'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: رفع عينيه
  rationale: ينقل الصورة الحسية بعبارة عربية طبيعية، ويؤدي اسم الفاعل اليوناني بوصفه فعلًا سابقًا للفعل الرئيس.
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: نحو تلاميذه
  rationale: تفيد εἰς هنا اتجاه النظر، و«نحو» واضحة وفصيحة.
- source_word: ἔλεγεν
  choice: وقال
  rationale: الماضي الناقص اليوناني يقدّم القول في سياق الخطاب، لكن «كان يقول» أثقل في العربية هنا؛ لذلك اختير الماضي البسيط الطبيعي من غير إضافة معنى «ابتدأ» غير الصريح.
- source_word: Μακάριοι
  choice: طوبى لكم
  rationale: «طوبى» صيغة عربية راسخة ومفهومة في التطويبات، وتجمع معنى الغبطة والبركة من غير اختزاله في شعور عابر بالسعادة.
- source_word: οἱ πτωχοί
  choice: أيها الفقراء
  rationale: يحافظ على معنى «الفقراء» من غير إضافة «بالروح»، ويجعل الخطاب مباشرًا بما يوافق ضمير المخاطبين في ὑμετέρα.
- source_word: ὅτι
  choice: لأن
  rationale: تنقل العلاقة السببية بوضوح.
- source_word: ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله لكم
  rationale: صياغة عربية طبيعية تحفظ الإسناد إلى المخاطبين، ولا تحصر βασιλεία في مفهوم الحكم وحده.
theological_decisions:
- issue: هل يُفسَّر πτωχοί بأنه «الفقراء بالروح»؟
  choice: الفقراء
  alternative: الفقراء بالروح
  rationale: نص لوقا يذكر الفقراء بلا قيد، فلا تُستورد إليه زيادة متى 5:3، وبذلك يبقى مدلوله الاجتماعي واللاهوتي مفتوحًا كما في النص.
- issue: هل تُصاغ التطويبة بضمير الغائب أم بوصفها خطابًا مباشرًا؟
  choice: طوبى لكم أيها الفقراء
  alternative: طوبى للفقراء
  rationale: οἱ πτωχοί في صيغة الغائب من حيث المبنى، لكن ὑμετέρα («لكم») يجعل القول خطابًا مباشرًا للتلاميذ؛ والصياغة المختارة تُظهر ذلك من غير إخفاء هوية المخاطبين.
- issue: دلالة ملكوت الله
  choice: ملكوت الله
  alternative: حكم الله
  rationale: «ملكوت الله» يحفظ الاتساع الدلالي لعبارة βασιλεία τοῦ θεοῦ ولا يقصرها على فعل الحكم وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «طوبى» لصيغ التطويبات و«ملكوت الله» للمصطلح الكتابي الراسخ، مع تجنب التفسير المذهبي أو مواءمة نص لوقا مع متى.
