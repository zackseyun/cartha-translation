source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: ar
  text: 'أَعْطُوا، فَسَيُعْطَى لَكُمْ: كَيْلًا جَيِّدًا، مَكْبُوسًا مَهْزُوزًا فَائِضًا[a]، سَيُعْطُونَهُ فِي حُجُورِكُمْ[b]. فَبِالْكَيْلِ الَّذِي تَكِيلُونَ بِهِ سَيُكَالُ لَكُمْ فِي الْمُقَابِلِ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مُتَدَفِّقًا من فوقه». الصورة لمكيال مملوء إلى حد أن محتواه ينسكب خارجه.'
    reason: lexical_alternative
  - marker: b
    text: أي في طيّة الثوب الأمامية التي كانت تُستعمل لتلقّي الحبوب أو غيرها من السلع المكيلة.
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: أَعْطُوا
  rationale: فعل أمر مضارع للجمع. صيغة «أعطوا» عربية طبيعية تحفظ الأمر العام من غير أن تفرض معنى التكرار المستمر الذي قد يفهم من «داوموا على العطاء».
- source_word: δοθήσεται ὑμῖν
  choice: فَسَيُعْطَى لَكُمْ
  rationale: يحفظ المبني للمجهول في اليونانية، ويترك الفاعل غير مصرَّح به كما في المصدر.
- source_word: μέτρον καλὸν
  choice: كَيْلًا جَيِّدًا
  rationale: «الكيل» يلائم صورة قياس الحبوب أو السلع، و«جيدًا» يحفظ الوصف الواسع من غير إضافة تفسير «سخيّ» إلى النص.
- source_word: πεπιεσμένον
  choice: مَكْبُوسًا
  rationale: ينقل صورة ضغط محتوى المكيال كي يتسع لكمية أكبر، وهو تعبير واضح في العربية المعاصرة.
- source_word: σεσαλευμένον
  choice: مَهْزُوزًا
  rationale: يحفظ فعل هز المكيال حتى يستقر محتواه ويتراص، من غير شرح زائد داخل المتن.
- source_word: ὑπερεκχυννόμενον
  choice: فَائِضًا
  rationale: ينقل صورة امتلاء المكيال حتى يفيض ما فيه؛ وأثبت البديل التصويري في الحاشية.
- source_word: δώσουσιν
  choice: سَيُعْطُونَهُ
  rationale: يحفظ صيغة الغائب الجمع ذات الفاعل غير المحدد بدل تحويلها إلى مبني للمجهول؛ والضمير يعود إلى «كيلًا».
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: فِي حُجُورِكُمْ
  rationale: تعبير عربي مفهوم يحفظ الصورة العامة لموضع تلقي السلع، مع بيان خلفيتها اللباسية في الحاشية.
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: فَبِالْكَيْلِ الَّذِي تَكِيلُونَ بِهِ
  rationale: يحفظ تكرار جذر القياس والصورة المجازية، وينقل أداة التعليل أو الربط «فـ» بصورة طبيعية.
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: سَيُكَالُ لَكُمْ فِي الْمُقَابِلِ
  rationale: المبني للمجهول يوافق المصدر، و«في المقابل» يظهر دلالة المعاملة بالمثل الكامنة في ἀντί من غير تحويلها إلى سداد مالي.
theological_decisions:
- issue: هل يختص القول بالمال والصدقة أم يبقى أوسع دلالة؟
  choice: الإبقاء على لغة العطاء والكيل المتبادل من غير قصرها على المال.
  alternative: تفسير الأمر بأنه خاص بالصدقة أو العطاء المادي.
  rationale: السياق القريب يتناول الرحمة وعدم الإدانة والغفران والعطاء، ولا يحدد النص اليوناني المال صراحة. لذلك تحفظ الصياغة سعة القول ولا تُدخل قراءة ازدهارية أو مالية ضيقة.
- issue: هوية الفاعل الذي يعطي في عبارة δώσουσιν
  choice: 'الإبقاء على فاعل جمع غير محدد: «سيعطونه».'
  alternative: تعيين الله فاعلًا أو تحويل العبارة إلى المبني للمجهول.
  rationale: النص يستعمل صيغة الغائب الجمع من غير تسمية الفاعل. تعيين الله أو الناس صراحة يحسم غموضًا أصيلًا لا تحسمه الصيغة اليونانية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. حُفظت صورة الكيل وتتابع الأوصاف، مع ضبط موضعي علامتي الحاشية بحسب الكلمتين اللتين تشرحهما الحاشيتان. استُعمل «حجوركم» مع حاشية ثقافية حتى لا تُستبدل الصورة القديمة بشرح مطوّل داخل المتن.
