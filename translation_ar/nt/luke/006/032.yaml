  to: وَإِنْ كُنْتُمْ تُحِبُّونَ الَّذِينَ يُحِبُّونَكُمْ، فَأَيُّ فَضْلٍ لَكُمْ؟[a] فَحَتَّى الْخَاطِئُونَ يُحِبُّونَ الَّذِينَ يُحِبُّونَهُمْ.
