  source_fidelity: 'الترجمة أمينة لبنية النص اليوناني وتكرار فعل «يحبّ»، وتنقل χάρις بـ«فضل» في معناها السياقي: ما يُعَدّ مزية أو أمرًا جديرًا بالثناء، لا النعمة الخلاصية. غير أن عبارة «في ذلك» ليست ظاهرة في اليونانية، وإن كانت مفهومة من السياق؛ وحذفها يحفظ الإيجاز والاستفهام المفتوح في الأصل.'
