  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: ar
  text: وَإِنْ كُنْتُمْ تُحِبُّونَ الَّذِينَ يُحِبُّونَكُمْ، فَأَيُّ فَضْلٍ لَكُمْ؟[a] فَحَتَّى الْخَاطِئُونَ يُحِبُّونَ الَّذِينَ يُحِبُّونَهُمْ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فأيُّ نعمةٍ لكم؟» يمكن أن تعني الكلمة اليونانية «نعمة» أو «فضل» أو «حظوة»؛ والمقصود هنا ما يستحق التقدير والثناء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: تُحِبُّونَ / يُحِبُّونَ / يُحِبُّونَ
  rationale: حُفظ تكرار الفعل نفسه في المواضع الثلاثة لإبراز الصلة اللفظية والقوة البلاغية في الأصل.
- source_word: ποία
  choice: فَأَيُّ
  rationale: ينقل الاستفهام عن نوع الفضل أو قيمته بصياغة عربية طبيعية موجزة.
- source_word: χάρις
  choice: فَضْل
  rationale: يفيد هنا ما يُحسب للإنسان من مزية أو استحقاق للثناء، مع إبقاء قدر من السعة الدلالية للكلمة اليونانية، من غير حصرها في معنى النعمة الخلاصية.
- source_word: ἁμαρτωλοὶ
  choice: الْخَاطِئُونَ
  rationale: ترجمة مباشرة وطبيعية للصفة المستعملة استعمال الاسم، وتحفظ التصنيف الأخلاقي الوارد في النص.
- source_word: καὶ γὰρ
  choice: فَحَتَّى
  rationale: تؤدي التعليل المصحوب بالتوكيد في سياق السؤال البلاغي، وتوصل الحجة بعربية سليمة غير متكلفة.
- source_word: ὑμῖν
  choice: لَكُمْ
  rationale: 'صياغة عربية اصطلاحية ملائمة مع «فضل»، إذ يقال: أي فضل لكم؟'
theological_decisions:
- issue: دلالة χάρις في قول يسوع
  choice: الفضل أو المزية الجديرة بالتقدير، لا المعنى الاصطلاحي الحصري للنعمة الخلاصية
  alternative: نعمة؛ شكر؛ استحقاق
  rationale: السياق يقارن السلوك الذي يتجاوز المعاملة بالمثل بما يفعله الخطاة أيضًا. «فضل» يلائم هذه الحجة الأخلاقية، مع التنبيه في الحاشية إلى اتساع اللفظ اليوناني وعدم إلغاء احتمال ترجمته حرفيًا بـ«نعمة».
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدم «فضل» لأنه طبيعي ومفهوم في السؤال البلاغي، وأُبقي البديل الحرفي «نعمة» في الحاشية لصون السعة الدلالية. ضُبط النص ضبطًا كاملًا للنشر.
