  terminology: «تحبّون/يحبّون» يحفظ التكرار المقصود. و«الخاطئون» مناسبة لـἁμαρτωλοί، و«فضل» مناسبة لـχάρις في هذا السياق. تُبقي الحاشية البديل الحرفي «نعمة» مع شرح يمنع تحميله معنى لاهوتيًا غير مقصود.
