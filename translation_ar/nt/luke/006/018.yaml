  source_fidelity: 'النص العربي ينقل بنية اليونانية بأمانة: الموصول رابطٌ بما قبله، و«جاؤوا ليسمعوه ويُشفَوا» يعبّر عن غرض المجيء مع حفظ المبني للمجهول، و«من أمراضهم» مناسب لـἀπό. كما أن «الذين تؤذيهم أرواح نجسة» ينقل المشاركة المبنية للمجهول ودلالة السبب/المصدر دون تحميل اصطلاح «الأرواح النجسة» تفسيرًا إضافيًا. وصيغة «كانوا يُشفَون»/«وكان الذين... يُشفَون» تحفظ بصورة سليمة الدلالة الاستمرارية أو التكرارية للفعل الناقص ἐθεραπεύοντο.'
