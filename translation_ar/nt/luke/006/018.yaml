  text: οἳ ἦλθον ἀκοῦσαι αὐτοῦ καὶ ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν· καὶ οἱ ⸂ἐνοχλούμενοι ἀπὸ⸃ πνευμάτων ⸀ἀκαθάρτων ἐθεραπεύοντο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: ar
  text: الذين جاؤوا ليسمعوه ويُشفَوا من أمراضهم؛ وكان الذين تؤذيهم أرواح نجسة[a] يُشفَون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «تعذّبهم» أو «تضايقهم». يحتمل الفعل اليوناني درجات مختلفة من الأذى أو الإزعاج بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: الذين جاؤوا
  rationale: يحافظ على صلة الموصول بما سبق وعلى زمن الفعل السردي البسيط.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: ليسمعوه
  rationale: ينقل غرض المجيء بصياغة عربية موجزة وطبيعية.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: ويُشفَوا من أمراضهم
  rationale: يحافظ على المبني للمجهول، ويعبّر حرف الجر «من» عن الخلاص والانفصال عن الأمراض.
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: الذين تؤذيهم أرواح نجسة
  rationale: «تؤذيهم» تعبير عربي واضح عن وقوع الضرر والإزعاج عليهم، و«أرواح نجسة» يحافظ على الاصطلاح الإنجيلي من غير استبداله بتفسير مثل «شياطين».
- source_word: ἐθεραπεύοντο
  choice: كانوا يُشفَون
  rationale: صيغة «كانوا يُشفَون» تنقل المبني للمجهول والدلالة الاستمرارية أو التكرارية للفعل الناقص في سياق المشهد.
theological_decisions:
- issue: دلالة πνευμάτων ἀκαθάρτων
  choice: أرواح نجسة
  alternative: أرواح دنسة؛ شياطين
  rationale: يحافظ «أرواح نجسة» على اللفظ اليوناني والتعبير الإنجيلي المألوف، من غير تحويله إلى التفسير الأصرح «شياطين».
- issue: دلالة هيئة ἐθεραπεύοντο
  choice: كانوا يُشفَون
  alternative: شُفوا
  rationale: تنقل الصياغة المختارة استمرار الشفاء أو تكراره في ذلك المشهد، بدل اختزاله في حدث تام واحد.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وكريمة، مع وصل الآية بما قبلها بالموصول «الذين». وُضع الفاصل المنقوط بين غرض مجيء الجموع وبين شفاء المتأذين من الأرواح النجسة.
