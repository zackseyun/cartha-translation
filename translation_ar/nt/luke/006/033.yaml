  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: ar
  text: وَإِنْ أَحْسَنْتُمْ إِلَى الَّذِينَ يُحْسِنُونَ إِلَيْكُمْ، فَأَيُّ فَضْلٍ لَكُمْ؟[a] فَحَتَّى الْخَاطِئُونَ يَفْعَلُونَ الشَّيْءَ نَفْسَهُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فأي نعمة لكم؟» ويمكن للكلمة اليونانية أن تعني «نعمة» أو «حظوة» أو «شكر» أو «فضل»؛ والمقصود هنا ما يناله المرء من تقدير على إحسانه المتبادل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε
  choice: أحسنتم إلى
  rationale: الفعل يدل على فعل الخير أو نفع الآخرين، وتعبير «أحسن إلى» عربي طبيعي واضح ويلائم وجود مفعول بشري.
- source_word: ἀγαθοποιοῦντας
  choice: الذين يحسنون إليكم
  rationale: يحافظ على الصلة اللفظية مع «أحسنتم» وينقل صيغة اسم الفاعل اليونانية بعبارة موصولة طبيعية.
- source_word: ποία ... χάρις
  choice: فأي فضل لكم في ذلك؟
  rationale: «فضل» هنا يفيد ما يعود على الفاعل من استحقاق للثناء أو التقدير، من غير تحميل χάρις معنى النعمة الخلاصية؛ وأضيف «في ذلك» لتوضيح الإحالة في العربية.
- source_word: ὑμῖν
  choice: لكم
  rationale: اللام هي الصياغة العربية الطبيعية للداتيف في سؤال «أي فضل لكم؟».
- source_word: ἁμαρτωλοὶ
  choice: الخاطئون
  rationale: ترجمة مباشرة للفئة الأخلاقية والدينية التي يدل عليها اللفظ في لوقا، من دون تلطيف.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: يفعلون الشيء نفسه
  rationale: ينقل التعبير اليوناني بدقة ووضوح في العربية المعاصرة.
- source_word: καὶ
  choice: و / فحتى
  rationale: لم يُجعل حرف العطف الأول كلمة مستقلة بعد أداة الشرط في الصياغة العربية الطبيعية، بينما نُقل الثاني بصيغة «فحتى» لإبراز دلالته التصاعدية والسياقية.
theological_decisions:
- issue: دلالة χάρις في سياق التعليم الأخلاقي
  choice: الفضل بمعنى الاستحقاق للتقدير أو الثناء
  alternative: النعمة، أو الشكر، أو الحظوة
  rationale: السؤال البلاغي يتناول ما يستحقه المرء من تقدير عندما يبادل الإحسان بمثله، لا النعمة الخلاصية. وتبقي الحاشية المجال الدلالي للكلمة ظاهرًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. استُعمل «أحسن إلى» لصياغة طبيعية، و«الخاطئون» للمحافظة على مباشرة النص. وُضع رمز الحاشية بعد السؤال الذي تتعلق به.
