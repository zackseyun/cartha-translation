  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: ar
  text: وحدث أنه في يوم سبت كان يجتاز حقول الحبوب، وكان تلاميذه يقطفون السنابل[a] ويأكلون، وهم يفركونها بأيديهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي رؤوس نبات الحبوب التي تحمل الحب.
    reason: lexical_alternative
  - marker: b
    text: كانوا يفركون السنابل بأيديهم لفصل حبوبها الصالحة للأكل.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وحدث أنه
  rationale: صياغة سردية عربية طبيعية تنقل إدخال الحدث، من غير إضافة ظرف زمني لا يقابله لفظ صريح في اليونانية.
- source_word: ἐν σαββάτῳ
  choice: في يوم سبت
  rationale: يحافظ على دلالة المناسبة غير المعيّنة في التركيب اليوناني الخالي من أداة التعريف، ويأتي واضحًا في العربية المعاصرة.
- source_word: διαπορεύεσθαι αὐτὸν
  choice: كان يجتاز
  rationale: ينقل الاستمرار الذي يفيده المصدر المضارع في سياق الصيغة الحدثية.
- source_word: διὰ σπορίμων
  choice: بين حقول الحبوب
  rationale: ينقل معنى الأراضي المزروعة بالحبوب من غير تحديد نوع المحصول، و«بين» طبيعية مع الاجتياز في الحقول.
- source_word: ἔτιλλον
  choice: كانوا يقطفون
  rationale: ينقل الفعل المستمر الذي تدل عليه صيغة الماضي الناقص.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: مقابل عربي موجز وطبيعي لتركيب الملكية.
- source_word: καὶ ἤσθιον
  choice: ويأكلون
  rationale: يحافظ على اقتران الفعلين الجاريين وعلى عدم التصريح بمفعول جديد في اليونانية.
- source_word: τοὺς στάχυας
  choice: السنابل
  rationale: «السنابل» هي التسمية العربية الطبيعية لأجزاء نبات الحبوب التي تحمل الحب، وتوافق معنى اللفظ اليوناني.
- source_word: ψώχοντες ταῖς χερσίν
  choice: وهم يفركونها بأيديهم
  rationale: ينقل هيئة الفعل المصاحب كما في اسم الفاعل اليوناني، ويحافظ على الصورة الحسية من غير استبدالها بتفسير صرفي مثل «يفصلون الحب».
