  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: ar
  text: ولمّا طلع النهار، استدعى تلاميذه[a]، واختار منهم اثني عشر، وسمّاهم أيضًا رسلًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «دعا تلاميذه». يمكن أن يدل الفعل اليوناني على الاستدعاء أو المخاطبة، لكن السياق يرجّح أنه جمعهم لاختيار اثني عشر منهم.
    reason: lexical_alternative
  - marker: b
    text: أو «دعاهم أيضًا رسلًا». يدل الفعل على التسمية أو إطلاق الاسم؛ واستُخدمت «سمّاهم» هنا لتمييزه من استدعاء التلاميذ في أول الآية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: لمّا طلع النهار
  rationale: تعبير عربي طبيعي يؤدي معنى حلول النهار في العبارة الزمنية اليونانية.
- source_word: προσεφώνησεν
  choice: دعا ... إليه
  rationale: السياق يدل على استدعاء التلاميذ وجمعهم من أجل الاختيار، لا مجرد مخاطبتهم؛ وإضافة «إليه» توضح اتجاه الدعوة الذي يفيده الفعل في هذا السياق.
- source_word: μαθητὰς
  choice: تلاميذه
  rationale: «التلاميذ» هو المقابل العربي المألوف والواضح في سياق الأناجيل، ويحفظ معنى التعلّم واتباع المعلّم.
- source_word: ἐκλεξάμενος
  choice: اختار
  rationale: صياغة عربية موجزة وطبيعية تحفظ معنى الانتقاء المقصود.
- source_word: ἀπ’ αὐτῶν
  choice: منهم
  rationale: تفيد أن الاثني عشر اختيروا من جماعة التلاميذ الأكبر، من غير حاجة إلى إطالة العبارة العربية.
- source_word: δώδεκα
  choice: اثني عشر
  rationale: صيغة العدد المناسبة نحويًا لوقوعه مفعولًا به.
- source_word: ἀποστόλους
  choice: رسلًا
  rationale: «رسل» مصطلح عربي كتابي راسخ، ويحفظ معنى أشخاص مُرسلين مع أداء وظيفته هنا بوصفه تسمية للاثني عشر.
- source_word: ὠνόμασεν
  choice: سمّاهم
  rationale: ينقل فعل التسمية والتعيين بوضوح، ويميّزه عن فعل الاستدعاء السابق.
theological_decisions:
- issue: هل تُترجم ἀποστόλους بوصفها تسمية معروفة أم بمعناها الوصفي العام؟
  choice: رسلًا
  alternative: مبعوثين
  rationale: تعمل الكلمة هنا تسميةً منحها يسوع للاثني عشر، لا مجرد وصف عام لمن أُرسلوا في مهمة. «رسلًا» تحفظ هذه الوظيفة السردية من غير إضافة ادعاءات عقائدية.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم «لمّا طلع النهار» بدل الصياغة الحرفية الجامدة، وحُفظ الفرق بين استدعاء التلاميذ وتسميتهم رسلًا.
