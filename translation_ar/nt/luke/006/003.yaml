  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: ar
  text: 'فأجابهم يسوع: «أما قرأتم حتى هذا: ما فعله داود حين جاع هو والذين كانوا معه؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: فأجابهم
  rationale: هذا تركيب شائع في اليونانية الكوينية بمعنى «أجاب وقال». وصيغة «فأجابهم» عربية طبيعية تنقل فعل الرد من غير تكرار ثقيل.
- source_word: πρὸς αὐτοὺς
  choice: هم في «أجابهم»
  rationale: إدماج الجار والمجرور في مفعول الفعل هو الأسلوب العربي المألوف ويحفظ جهة الجواب.
- source_word: Οὐδὲ τοῦτο
  choice: أما قرأتم حتى هذا
  rationale: تحفظ «حتى» توكيد οὐδέ بمعنى «ولا حتى هذا»، بينما تجعل «أما» السؤال الإنكاري طبيعيًا وواضحًا بالعربية.
- source_word: ἀνέγνωτε
  choice: قرأتم
  rationale: الماضي العربي مناسب للسؤال البلاغي الذي يحتج بمعرفتهم السابقة بنص الكتاب.
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: ما فعله داود
  rationale: تركيب موصول طبيعي ودقيق يقابل العبارة اليونانية من غير تكلف.
- source_word: Δαυὶδ
  choice: داود
  rationale: الصيغة العربية الكتابية المعروفة للاسم.
- source_word: ὁπότε
  choice: حين
  rationale: أداة زمنية عربية موجزة تنقل معنى «عندما».
- source_word: ἐπείνασεν
  choice: جاع
  rationale: فعل عربي مباشر يطابق الحدث الماضي، ولا يضيف درجة جوع غير مصرّح بها.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: هو والذين كانوا معه
  rationale: تحفظ الضمير الصريح والعبارة الوصفية، ولا تستبدلهما بتفسير مثل «أصحابه».
