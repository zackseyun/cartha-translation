source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: ar
  text: أمّا الذي سمع ولم يعمل[a]، فيشبه رجلًا بنى بيتًا على الأرض بلا أساس. فارتطم به النهر، فانهار في الحال، وكان خراب ذلك البيت عظيمًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ولم يفعل»، أو «ولم يضع ما سمعه موضع العمل». الفعل اليوناني يعني ببساطة «يفعل/يعمل»، والمقصود هنا العمل بكلام يسوع.
    reason: lexical_alternative
  - marker: b
    text: أو «وكان تصدّع ذلك البيت عظيمًا». يمكن أن تدل الكلمة اليونانية على الكسر أو التصدع أو الخراب؛ واختير «خراب» لملاءمته سياق انهيار البيت.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας
  choice: أمّا الذي سمع
  rationale: اسم الفاعل المعرّف مستعمل استعمال الاسم للدلالة على صاحب الحالة، و«أمّا» تُظهر المقابلة مع الصورة السابقة بعبارة عربية طبيعية.
- source_word: καὶ μὴ ποιήσας
  choice: ولم يعمل
  rationale: الفعل ποιέω يعني هنا العمل بموجب كلام يسوع. أبقت الصياغة الفعل عامًا وموجزًا كما في اليونانية، من غير إضافة مفعول تفسيري إلى المتن.
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: فيشبه رجلًا
  rationale: صياغة عربية مباشرة للتشبيه، وتحافظ على المفرد المذكر في صورة المثل.
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: بنى بيتًا على الأرض بلا أساس
  rationale: «الأرض» هنا سطح البناء لا الكرة الأرضية، و«بلا أساس» تعبير عربي واضح يحفظ مركز الصورة.
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: فاندفع النهر على البيت
  rationale: يحمل προσρήγνυμι معنى الاندفاع أو الارتطام العنيف. أُعيد ذكر البيت بدل الضمير الموصول لتفادي التباس المرجع في العربية.
- source_word: εὐθὺς συνέπεσεν
  choice: فانهار في الحال
  rationale: συμπίπτω في وصف البناء يدل على انهياره، و«في الحال» تنقل دلالة السرعة في εὐθύς.
- source_word: τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: كان دمار ذلك البيت عظيمًا
  rationale: ῥῆγμα قد يدل على الكسر أو التصدع أو الخراب الناتج منه. «دمار» أوضح في سياق انهيار البيت، مع إبقاء وصف «عظيمًا» دون تضخيم تفسيري.
theological_decisions:
- issue: صيغة المذكر التمثيلية في التشبيه
  choice: رجلًا
  alternative: شخصًا
  rationale: النص اليوناني يصوغ المثال بالمفرد ويقدمه في صورة رجل. تحافظ الترجمة على صورة المثل من غير أن تحصر انطباق التعليم في الرجال.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، بجمل قصيرة وصورة ملموسة. حُفظت المقابلة بين السماع والعمل، كما حُفظت صورة الرجل في المثل، وأُشير في الحاشية إلى المجال الدلالي المفتوح لكلمة ῥῆγμα.
