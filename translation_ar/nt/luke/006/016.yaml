source:
  edition: SBLGNT
  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: ar
  text: ويهوذا بن يعقوب[a]، ويهوذا الإسخريوطي، الذي صار خائنًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «يهوذا أخو يعقوب»؛ فالنص اليوناني يقول حرفيًا: «يهوذا الذي ليعقوب»، من غير أن يحدد صلة القرابة.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: يهوذا بن يعقوب
  rationale: الإضافة اليونانية مختصرة، وحرفيًا تفيد «يهوذا الذي ليعقوب» من غير بيان صلة القرابة. أُثبتت «بن» في المتن لأنها الأرجح والأطبع في قائمة أسماء، مع حفظ الاحتمال الآخر في الحاشية.
- source_word: Ἰσκαριὼθ
  choice: الإسخريوطي
  rationale: لقب أو نسبة لاسم علم، فنُقل بصيغته العربية الكتابية الشائعة بدل ترجمته دلاليًا.
- source_word: ὃς ἐγένετο
  choice: الذي صار
  rationale: يحفظ معنى γίνομαι الدال على الصيرورة، ولا يختزله إلى مجرد وصف ثابت مثل «كان».
- source_word: προδότης
  choice: خائنًا
  rationale: اسم يدل على من يخون أو يسلّم غيره غدرًا؛ و«خائنًا» موجزة وطبيعية خبرًا لـ«صار» وتحفظ قوة التوصيف.
- source_word: καὶ
  choice: و
  rationale: الواو هي المقابل العربي الطبيعي للربط المتكرر بين الاسمين في ختام القائمة.
theological_decisions:
- issue: صلة يهوذا بيعقوب التي تفيدها الإضافة Ἰακώβου
  choice: «يهوذا بن يعقوب» في المتن
  alternative: «يهوذا أخو يعقوب»، أو حرفيًا «يهوذا الذي ليعقوب»
  rationale: النص اليوناني لا يصرّح بنوع الصلة، لكن العربية الطبيعية تقتضي غالبًا بيانها. اختيرت البنوة بوصفها الاحتمال الأرجح في هذا السياق، مع إبقاء احتمال الأخوّة في الحاشية لئلا يُحسم ما تركه الأصل ضمنيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع استعمال الأسماء بصيغها العربية المألوفة. حُفظت صيرورة يهوذا خائنًا بلفظ «صار»، وحُفظ غموض صلة القرابة بالحاشية.
