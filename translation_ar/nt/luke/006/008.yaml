  text: αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: ar
  text: 'أما هو فكان يعرف أفكارهم، فقال للرجل الذي كانت يده يابسة[a]: «انهض وقف في الوسط». فنهض ووقف.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كانت يده ضامرة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: كان يعرف
  rationale: ينقل دلالة المعرفة المستمرة في السياق السردي من غير أن يحدد كيف عرف يسوع ذلك.
- source_word: διαλογισμοὺς
  choice: أفكارهم
  rationale: لفظ عربي واضح يشمل ما دار في داخلهم، مع إمكان معنى الاستدلالات أو المداولات.
- source_word: ἀνδρὶ
  choice: الرجل
  rationale: يحافظ على دلالة ἀνήρ على الذكر البالغ.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: كانت يده يابسة
  rationale: يعبّر تعبيرًا طبيعيًا ومباشرًا عن اليد الضامرة أو التيبّس الذي أصابها.
- source_word: Ἔγειρε
  choice: انهض
  rationale: يحافظ على أمر النهوض متميزًا من أمر الوقوف التالي.
- source_word: στῆθι
  choice: قف
  rationale: ينقل أمر الوقوف بوضوح ولا يدمجه مع Ἔγειρε.
- source_word: εἰς τὸ μέσον
  choice: في الوسط
  rationale: صياغة عربية طبيعية تدل على انتقاله إلى وسط المجتمعين، وإن كانت اليونانية حرفيًا «إلى الوسط».
- source_word: ἀναστὰς ἔστη
  choice: فنهض ووقف
  rationale: يحافظ على تعاقب الفعلين كما في تركيب اسم الفاعل والفعل الرئيس.
theological_decisions:
- issue: معرفة يسوع بأفكار الآخرين الداخلية
  choice: كان يعرف أفكارهم
  alternative: أدرك مقاصدهم؛ عرف أفكارهم بمعرفة فائقة للطبيعة
  rationale: النص يثبت معرفته بما دار في داخلهم، لكنه لا يبيّن آلية هذه المعرفة؛ لذلك لا تضيف الترجمة تفسيرًا عقائديًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أما هو» لإبراز المقابلة التي تفيدها αὐτὸς δέ، وحُفظ التمييز بين «انهض» و«قف» وبين الفعلين في الاستجابة.
