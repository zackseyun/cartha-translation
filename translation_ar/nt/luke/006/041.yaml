  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: ar
  text: فلماذا ترى القذاة[a] التي في عين أخيك[b]، ولا تلاحظ الخشبة[c] التي في عينك أنت؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «شظية» أو «تبنة»؛ فالكلمة اليونانية تشير إلى جسم صغير جاف، في مقابلة الخشبة الكبيرة.
    reason: lexical_alternative
  - marker: b
    text: وردت «أخيك» بصيغة المذكر المفرد في اليونانية، لكن التعليم لا يقتصر على أخٍ ذكر أو على الأخ الشقيق وحده.
    reason: cultural_note
  - marker: c
    text: أي قطعة كبيرة من خشب البناء؛ ويمكن ترجمتها «الجائز» أو «العارضة».
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: لماذا
  rationale: تأتي τί مع βλέπεις هنا في سؤال توبيخي بمعنى سببي، فـ«لماذا» تنقل قوة السؤال طبيعيًا.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد انتقالًا مع مقابلة خفيفة بما سبق، و«ولكن» تحفظ هذا الاستدراك.
- source_word: βλέπεις
  choice: ترى
  rationale: تحفظ الصورة البصرية المباشرة والفعل اليوناني العادي للرؤية.
- source_word: κάρφος
  choice: القَذَاة
  rationale: لفظة عربية فصيحة لشيء صغير يقع في العين، وتحفظ المقابلة المبالغ فيها مع الخشبة؛ ويُشرح معناها ببدائل أوضح في الحاشية.
- source_word: ὀφθαλμῷ
  choice: عين
  rationale: المقابل العربي المباشر، مع إبقاء المفرد كما في اليونانية.
- source_word: ἀδελφοῦ
  choice: أخيك
  rationale: يحفظ الاسم المذكر المفرد في النص، من غير حصر التطبيق الأخلاقي في الأخ الشقيق.
- source_word: δοκόν
  choice: الخشبة
  rationale: تشير إلى قطعة كبيرة من خشب البناء، وتوصل التضاد الواضح مع القذاة بلغة عربية طبيعية.
- source_word: ἰδίῳ
  choice: عينك أنت
  rationale: إضافة «أنت» تُبرز معنى الاختصاص والتوكيد في ἰδίῳ، وتشدّد المقابلة مع عين الأخ.
- source_word: κατανοεῖς
  choice: لا تنتبه إلى
  rationale: ينقل معنى الملاحظة الواعية أو الإدراك، مع تمييزه عن فعل الرؤية βλέπεις.
theological_decisions:
- issue: اللفظ العلاقي المذكر ἀδελφοῦ
  choice: أخيك
  alternative: أخيك أو أختك؛ قريبك
  rationale: النص يستخدم مفردًا مذكرًا في مثال أخلاقي تمثيلي؛ تحافظ الترجمة على صورته، وتوضح الحاشية أن التعليم أوسع من الأخ الذكر وحده.
translation_notes:
  register: عربية فصحى حديثة ذات نبرة كريمة ومباشرة. اختيرت «القذاة» لدقتها ورسوخها في صورة العين، مع شرحها في الحاشية لأنها أقل تداولًا اليوم. وُضعت علامات الحواشي عقب الألفاظ المعنية، مع إبقاء الاستفهام التوبيخي والتضاد البلاغي بين الجسيم الصغير والخشبة الكبيرة.
