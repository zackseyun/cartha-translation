source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: ar
  text: هو مثل رجلٍ[a] يبني بيتًا؛ حفر وعمَّق، ووضع أساسًا على الصخر. ولما حدث فيضان، ضرب النهر ذلك البيت بعنف، ولم يقدر أن يزعزعه، لأنه كان قد بُني بإتقان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إنسان». تستعمل اليونانية هنا صيغة المفرد المذكر بوصفه الشخصية التمثيلية في التشبيه.
    reason: بديل معجمي يوضح مدى دلالة اللفظ اليوناني مع الحفاظ على الصورة المذكرة في المتن.
lexical_decisions:
- source_word: ὅμοιός ἐστιν
  choice: هو مثل
  rationale: صيغة عربية طبيعية ومباشرة للتشبيه، وتحافظ على قوة المقارنة في اليونانية.
- source_word: ἀνθρώπῳ
  choice: رجلٍ
  rationale: المفرد المذكر هنا هو الشخصية التمثيلية في التشبيه؛ واختيار «رجل» يحافظ على صورة الفرد المذكر الواردة في النص.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: يبني بيتًا
  rationale: تعبير عربي واضح ومألوف ينقل صورة البناء دون تكلف.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: حفر وعمَّق الحفر
  rationale: يحافظ على الفعلين المتعاقبين وعلى التشديد في بلوغ عمق مناسب، بدل اختزالهما في فعل واحد.
- source_word: ἔθηκεν θεμέλιον
  choice: وضع أساسًا
  rationale: مقابل عربي مباشر وطبيعي لفعل وضع الأساس.
- source_word: ἐπὶ τὴν πέτραν
  choice: على الصخر
  rationale: يحافظ على صورة الكتلة الصخرية من غير تقييدها تفسيريًا بمصطلح «الصخر الأم».
- source_word: πλημμύρης δὲ γενομένης
  choice: ولما حدث فيضان
  rationale: ينقل الظرف الزمني بوضوح ويحافظ على الفيضان بوصفه الحدث الذي أعقب البناء.
- source_word: προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ
  choice: ضرب النهر ذلك البيت بعنف
  rationale: ينقل الاصطدام الشديد الذي يفيده الفعل النادر؛ وأُضيف «بعنف» لإظهار قوة الضرب الملازمة لمعناه.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν
  choice: لم يقدر أن يزعزعه
  rationale: يحافظ على معنى العجز وعلى محاولة زعزعة البيت أو إفقاده ثباته.
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: لأنه كان قد بُني بناءً حسنًا
  rationale: ينقل علاقة السببية وصيغة المبني للمجهول، كما يوضح أن جودة البناء سابقة للفيضان.
theological_decisions:
- issue: دلالة ἀνθρώπῳ المذكرة في الشخصية التمثيلية
  choice: رجل
  alternative: إنسان
  rationale: أُبقيت الشخصية المذكرة المفردة كما في صورة التشبيه، من غير جعلها حصرًا عقائديًا؛ وتوضح الحاشية إمكان التعبير الأعم من جهة المعجم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. حوفظ على تتابع أفعال البناء، وعلى شدة اصطدام النهر، وعلى المبني للمجهول في خاتمة الآية. وُضعت علامة الحاشية [a] بعد «رجلٍ» في المتن.
