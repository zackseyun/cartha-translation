  to: هو مثل رجلٍ[a] يبني بيتًا؛ حفر وعمَّق، ووضع أساسًا على الصخر. ولما حدث فيضان، ضرب النهر ذلك البيت بعنف، ولم يقدر أن يزعزعه، لأنه كان قد بُني بإتقان.
  rationale: 'عُدِّل موضعان لتحسين سلامة العربية وطبيعيتها من غير تغيير المعنى: استُبدل التركيب غير المألوف «عمَّق الحفر» بـ«عمَّق» مع بقاء الفعلين المتتابعين، واستُبدل «بناءً حسنًا» بـ«بإتقان» مع الحفاظ على السببية والمبني للمجهول والسبق الزمني. كما حُذف «لكنه» لأنه يضيف رابط استدراك غير مصرح به في اليونانية، مع بقاء المقابلة مفهومة من السياق.'
