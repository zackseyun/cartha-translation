  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: ar
  text: 'لِهٰذَا قَالَتْ أَيْضًا حِكْمَةُ اللهِ[a]: «سَأُرْسِلُ إِلَيْهِمْ أَنْبِيَاءَ وَرُسُلًا، فَيَقْتُلُونَ وَيَضْطَهِدُونَ بَعْضًا مِنْهُمْ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن فهم «حكمة الله» هنا على أنها تشخيص للحكمة الإلهية، أو تدبير الله الحكيم، أو إشارة ضمنية من يسوع إلى نفسه.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لِهٰذَا
  rationale: تعبير سببي واستنتاجي طبيعي في العربية، يربط القول بما سبقه من توبيخ.
- source_word: καὶ
  choice: أَيْضًا
  rationale: يحفظ القوة الإضافية للأداة في هذا السياق.
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: حِكْمَةُ اللهِ
  rationale: صياغة قريبة من التركيب اليوناني، وتبقي مفتوحًا احتمال التشخيص أو الإشارة إلى تدبير الله الحكيم دون حسم تفسيري.
- source_word: εἶπεν
  choice: قَالَتْ
  rationale: فعل ماضٍ بسيط، وجاء مؤنثًا لمطابقة «حكمة».
- source_word: Ἀποστελῶ
  choice: سَأُرْسِلُ
  rationale: ينقل المستقبل المباشر للفعل اليوناني بوضوح وطبيعية.
- source_word: εἰς αὐτούς
  choice: إِلَيْهِمْ
  rationale: الوجه الطبيعي مع فعل الإرسال، ويحفظ معنى الاتجاه نحوهم.
- source_word: προφήτας
  choice: أَنْبِيَاءَ
  rationale: المقابل العربي المعياري للمصطلح.
- source_word: ἀποστόλους
  choice: رُسُلًا
  rationale: يحفظ معنى المرسَلين ووظيفتهم، وهو المقابل الكتابي العربي الطبيعي هنا.
- source_word: ἐξ αὐτῶν
  choice: مِنْهُمْ
  rationale: يحفظ الدلالة التبعيضية من غير إضافة «بعض» غير الموجودة لفظًا، مع وضوحها في العربية.
- source_word: ἀποκτενοῦσιν
  choice: يَقْتُلُونَ
  rationale: مقابل مباشر وطبيعي للفعل في سياق العداء.
- source_word: διώξουσιν
  choice: يَضْطَهِدُونَ
  rationale: ينقل معنى الملاحقة العدائية والاضطهاد في هذا السياق.
theological_decisions:
- issue: دلالة «حكمة الله»
  choice: الإبقاء على عبارة «حكمة الله» من غير تعيين صريح لهويتها
  alternative: فهمها تشخيصًا للحكمة الإلهية، أو إشارة إلى تدبير الله الحكيم، أو إحالة ضمنية إلى يسوع نفسه
  rationale: العبارة تحتمل هذه الأوجه في السياق؛ لذلك يحافظ النص على التوتر الدلالي واللاهوتي ولا يحسمه داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «رُسُلًا» بوصفها المقابل العربي الطبيعي لـἀποστόλους، وحُفظت صيغة «حكمة الله» بما لا يفرض تفسيرًا بعينه.
