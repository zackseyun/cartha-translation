id: LUK.11.26
reference: Luke 11:26
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: ar
  text: حينئذ يذهب ويأخذ معه سبعة أرواح أخرى أشرّ منه[a]، فتدخل وتسكن هناك[b]؛ فتصير حال ذلك الإنسان الأخيرة أسوأ من حاله الأولى[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أكثر شرًّا منه».'
    reason: lexical_alternative
  - marker: b
    text: يقول اليوناني «أرواحًا»، ولا يصرّح في هذه الآية بأنها «شياطين» أو «أرواح نجسة»، وإن كان السياق يوضح طبيعتها المعادية.
    reason: lexical_alternative
  - marker: c
    text: 'أو: «فتغدو عاقبة ذلك الإنسان أسوأ من بدايته».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: حينئذ
  rationale: أداة زمنية تفيد تتابع أحداث المثل، و«حينئذ» فصيحة وطبيعية في السياق السردي.
- source_word: πορεύεται
  choice: يذهب
  rationale: تنقل معنى الحركة المباشر من غير إضافة معنى المغادرة أو السفر.
- source_word: παραλαμβάνει
  choice: يأخذ معه
  rationale: تحفظ دلالة المصاحبة في الفعل، لا مجرد الأخذ.
- source_word: ἕτερα πνεύματα
  choice: أرواح أخرى
  rationale: يلتزم الاسم اليوناني العام «أرواح» من غير إدخال «شياطين» أو «نجسة» في هذه الآية.
- source_word: πονηρότερα ἑαυτοῦ
  choice: أشرّ منه
  rationale: صيغة مقارنة عربية طبيعية، والضمير يعود إلى الروح المذكور في السياق.
- source_word: ἑπτά
  choice: سبعة
  rationale: نقل مباشر للعدد، مع مراعاة قاعدة مخالفة العدد للمعدود المؤنث لفظًا في العربية.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: فتدخل وتسكن هناك
  rationale: يُفهم اسم الفاعل المحايد الجمع مع الأرواح السبعة، وتأتي العربية بالجمع الطبيعي؛ أما مفرد κατοικεῖ في النص المنقول فيحتمل حمل الجماعة كوحدة، ولذلك لا يُثقل المتن بإظهار عدم المطابقة اليونانية.
- source_word: τὰ ἔσχατα ... τῶν πρώτων
  choice: أواخر ... أسوأ من أوائله
  rationale: يحفظ التقابل الاسمي بين «الأواخر» و«الأوائل» من غير إضافة لفظ «حال» غير الموجود صراحة.
- source_word: τοῦ ἀνθρώπου ἐκείνου
  choice: ذلك الإنسان
  rationale: إحالة إلى الفرد المحدد في المثل، مع نقل ἄνθρωπος بلفظ عربي عام ودقيق.
theological_decisions:
- issue: هل تُوصَف الأرواح بأنها شياطين أو أرواح نجسة؟
  choice: أرواح
  alternative: شياطين / أرواح نجسة
  rationale: السياق يبين طبيعتها المعادية، لكن هذه الآية تقول πνεύματα فقط؛ لذا لا تُضاف تسمية غير مصرّح بها في المتن.
- issue: كيفية تمثيل عدم التطابق العددي بين εἰσελθόντα الجمع وκατοικεῖ المفرد
  choice: فتدخل وتسكن بصيغة الجمع
  alternative: فتدخل وتسكن الجماعة هناك / وبعد أن تدخل تسكن هناك بصيغة مفردة
  rationale: مرجع اسم الفاعل هو الأرواح، وصيغة الجمع أوضح في العربية. لا ينبغي بناء معنى لاهوتي على المفرد النصي الذي يمكن فهمه جمعيًا أو بوصف الجماعة وحدة.
- issue: معنى τὰ ἔσχατα وτῶν πρώτων
  choice: أواخر ذلك الإنسان أسوأ من أوائله
  alternative: حال ذلك الإنسان الأخيرة أسوأ من الأولى
  rationale: الصياغة المختارة تحافظ على التوتر والتقابل الموجزين في اليونانية، بينما يوضح البديل المقصود الدلالي بإضافة «حال».
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «حينئذ» للوصل السردي، و«يأخذ معه» لحفظ معنى المصاحبة، و«أواخره/أوائله» للمحافظة على التقابل اليوناني الموجز. وُضعت علامات الحواشي عند العبارات التي تشرحها مباشرة وبترتيب أبجدي.
