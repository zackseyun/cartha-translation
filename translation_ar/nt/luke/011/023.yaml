  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: ar
  text: مَنْ ليس معي فهو عليَّ، ومَنْ لا يجمع معي يبدِّد.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: مَنْ ليس
  rationale: أداة «مَنْ» مع جملة الصلة تؤدي معنى التركيب اليوناني الاسمي العام الدال على كل شخص يتصف بعدم كونه مع يسوع، وهي طبيعية وواضحة في العربية المعاصرة.
- source_word: μετ’ ἐμοῦ
  choice: معي
  rationale: تحفظ معنى المصاحبة والانحياز الذي تدل عليه μετά مع المضاف إليه، وتلائم المقابلة المباشرة مع «عليَّ».
- source_word: κατ’ ἐμοῦ
  choice: عليَّ
  rationale: تعبير عربي فصيح موجز عن المعارضة، ويحفظ التضاد البلاغي بين «معي» و«عليَّ» دون إضافة تفسير.
- source_word: συνάγων
  choice: يجمع
  rationale: ينقل معنى الجمع أو الضم ويحافظ على الصورة المجازية وعلى التضاد مع التبديد.
- source_word: σκορπίζει
  choice: يبدِّد
  rationale: ينقل معنى التفريق والتشتيت، ويكوّن مقابلة عربية طبيعية مع «يجمع».
- source_word: καὶ
  choice: وَ
  rationale: تربط الجملتين المتوازيتين ربطًا مباشرًا كما في اليونانية.
theological_decisions:
- issue: دلالة قول يسوع في انتفاء الحياد تجاهه
  choice: 'الإبقاء على الثنائية الحادة: من ليس مع يسوع فهو في موقف مضاد له.'
  alternative: صياغة أخف تفيد مجرد عدم المساندة، أو حصر العبارة تفسيريًا في سياق إخراج الشياطين.
  rationale: صيغة اليونانية مطلقة ومباشرة؛ لذلك تُحفظ قوتها من غير تلطيف ولا تحميلها صياغة عقائدية لاحقة.
translation_notes:
  register: عربية فصحى حديثة، موجزة ومهيبة، مع توازٍ بلاغي واضح بين «معي/عليَّ» و«يجمع/يبدِّد». لا حاجة إلى حاشية لأن «مَنْ» تنقل بصورة طبيعية القوة العامة للتركيب اليوناني.
