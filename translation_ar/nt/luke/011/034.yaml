source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: ar
  text: سراج جسدك هو عينك. فعندما تكون عينك سليمة[a]، يكون جسدك كله أيضًا منيرًا؛ أما عندما تكون رديئة[b]، فيكون جسدك أيضًا مظلمًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «صافية» أو «بسيطة». قد تدل اللفظة اليونانية على السلامة أو البساطة وعدم انقسام التوجّه؛ وهي هنا تصف العين في مقابل العين الرديئة.
    reason: lexical_alternative
  - marker: b
    text: أو «شريرة». قد تعني اللفظة اليونانية «رديئة» أو «شريرة»، فتحتمل الإشارة إلى عيب في العين وإلى انحراف أخلاقي في الإدراك.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: سراج
  rationale: يحافظ على صورة مصدر الضوء الملموس، لا على معنى «النور» المجرّد.
- source_word: σῶμα
  choice: جسد
  rationale: هو المعنى المعتاد للجسد المادي هنا، ضمن صورة مجازية تربط الإدراك بحالة الإنسان كلها.
- source_word: ὀφθαλμός
  choice: عين
  rationale: تُحفظ الدلالة الحرفية للعضو الذي تقوم عليه صورة السراج والإبصار.
- source_word: ἁπλοῦς
  choice: سليمة
  rationale: في مقابل العين «الرديئة»، تنقل «سليمة» معنى العين الصحيحة الأداء بلغة عربية واضحة، مع إبقاء دلالات البساطة وعدم الانقسام في الحاشية.
- source_word: φωτεινόν
  choice: منيرًا
  rationale: ينقل صفة الامتلاء بالنور أو الإشراق بإيجاز، ويحافظ على التضاد مع «مظلمًا».
- source_word: πονηρός
  choice: رديئة
  rationale: تحفظ قدرًا من الغموض بين الخلل الوظيفي والفساد الأخلاقي، من غير حصر اللفظة في «مريضة» أو «شريرة».
- source_word: σκοτεινόν
  choice: مظلمًا
  rationale: مقابل عربي مباشر يحافظ على التضاد التصويري مع «منيرًا».
theological_decisions:
- issue: دلالة ἁπλοῦς في وصف العين
  choice: سليمة
  alternative: صافية، بسيطة، غير منقسمة التوجّه
  rationale: صورة العين بوصفها سراج الجسد ترجّح في النص الرئيس تعبيرًا وظيفيًا واضحًا، لكن اللفظة قد تحمل أيضًا معنى البساطة أو وحدة التوجّه؛ لذلك لم يُحسم البعد الأخلاقي في اتجاه واحد.
- issue: دلالة πονηρός في وصف العين
  choice: رديئة
  alternative: شريرة، فاسدة، مريضة
  rationale: تتيح «رديئة» للصورة أن تشير معًا إلى عين معيبة وإلى إدراك منحرف أخلاقيًا، من غير إزالة هذا التوتر الدلالي.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم التوازي بين «عندما تكون... يكون» و«أما عندما تكون... فيكون»، وحُفظت صورة السراج والنور والظلمة من دون تفسير مذهبي داخل المتن.
