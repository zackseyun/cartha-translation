base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: ar
  text: لِأَنَّ كُلَّ مَنْ يَطْلُبُ يَنَالُ، وَمَنْ يَبْحَثُ يَجِدُ، وَمَنْ يَقْرَعُ سَيُفْتَحُ لَهُ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتصريح أوضح مما يُفهم من السياق: «سيُفتَح الباب لمن يقرع». فالنص اليوناني لا يذكر الشيء الذي يُفتَح.'
    reason: بديل معجمي وتوضيح للمفعول المحذوف
lexical_decisions:
- source_word: πᾶς
  choice: كُلَّ مَنْ
  rationale: تؤدي المعنى التوزيعي الشامل مع اسم الفاعل، وهي صياغة عربية طبيعية واضحة.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تحفظ القوة التفسيرية التي تربط هذه المقولة بالحث السابق.
- source_word: ὁ αἰτῶν
  choice: مَنْ يَطْلُبُ
  rationale: تنقل اسم الفاعل المضارع بصيغة عامة تدل على من يطلب، وتناسب سياق الطلب في الصلاة.
- source_word: λαμβάνει
  choice: يَنَالُ
  rationale: مقابل عربي فصيح وطبيعي يفيد حصول الطالب على ما يُعطى له، من غير عامية.
- source_word: ὁ ζητῶν
  choice: مَنْ يَبْحَثُ
  rationale: يحفظ معنى السعي إلى العثور على شيء، ويميّزه بوضوح عن فعل الطلب السابق.
- source_word: εὑρίσκει
  choice: يَجِدُ
  rationale: مقابل مباشر ومألوف يحافظ على التوازي المأثوري في العبارة.
- source_word: τῷ κρούοντι
  choice: مَنْ يَقْرَعُ ... لَهُ
  rationale: تفيد «له» علاقة المفعول غير المباشر التي تعبّر عنها صيغة المجرور اليونانية، مع أسلوب عربي طبيعي.
- source_word: ἀνοιγήσεται
  choice: يُفْتَحُ لَهُ
  rationale: تحفظ صيغة المستقبل الدلالية للمضارع العربي في هذا السياق وصيغة المبني للمجهول، وتترك الشيء المفتوح غير مذكور كما في اليونانية.
theological_decisions:
- issue: نطاق الوعد الشامل وقوته
  choice: صياغة القول مبدأً عامًا شاملًا من غير إضافة قيود
  alternative: اعتباره مبالغة تشجيعية، أو إضافة قيد تفسيري مثل «من يطلب طلبًا صحيحًا»
  rationale: النص اليوناني يورد قاعدة عامة غير مقيّدة في سياق الحث على الصلاة؛ لذلك تُحفَظ حدة هذا الإطلاق من غير إدخال شروط لاهوتية غير مذكورة.
- issue: المفعول المحذوف مع «يُفتح»
  choice: إبقاؤه غير مصرّح به في المتن
  alternative: التصريح بقول «يُفتح له الباب»
  rationale: الفعل اليوناني مبني للمجهول ولا يذكر ما الذي يُفتح، وإن كان الباب مفهومًا من سياق القرع؛ فحُفظ الإبهام الأصلي وأُوضح الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة ومألوفة. حُفظ التوازي الثلاثي بين الطلب والبحث والقرع، مع تجنب اللغة القديمة والتفسير الزائد.
