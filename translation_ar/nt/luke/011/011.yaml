source:
  edition: SBLGNT
  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: ar
  text: وأيُّ أبٍ منكم، إذا طلب منه ابنه سمكةً، يعطيه بدلًا منها حيّةً؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: وأيُّ أبٍ منكم
  rationale: صياغة عربية طبيعية تحفظ قوة السؤال الإنكاري ومعنى اختيار واحد من بين المخاطَبين.
- source_word: αἰτήσει
  choice: إذا طلب منه
  rationale: المستقبل اليوناني واقع في سؤال ذي معنى شرطي عام؛ و«إذا طلب منه» تنقل هذا المعنى بوضوح، مع بيان أن الطلب موجَّه إلى الأب.
- source_word: ὁ υἱὸς
  choice: ابنه
  rationale: الإضافة تعبّر طبيعيًا عن العلاقة المفهومة سياقيًا بين الأب والابن، من غير زيادة دلالية.
- source_word: ἰχθύν / ἰχθύος
  choice: سمكةً / منها
  rationale: حُفظ المفرد في ذكر السمكة أولًا، ثم استُعمل الضمير في عبارة الاستبدال لتجنب تكرار ثقيل مع بقاء المرجع واضحًا.
- source_word: ἀντὶ
  choice: بدلًا منها
  rationale: تنقل معنى الاستبدال صراحةً وبأسلوب عربي سلس.
- source_word: ὄφιν
  choice: حيّةً
  rationale: «حيّة» مقابل عربي واضح وشائع لـὄφις في هذا السياق، ولا يفرض رمزية غير مصرّح بها.
- source_word: αὐτῷ ἐπιδώσει
  choice: يعطيه
  rationale: الفعل العربي «يعطي» يؤدي معنى التسليم أو الإعطاء، والضمير يبيّن أن المتلقي هو الابن.
