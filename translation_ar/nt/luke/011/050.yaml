  choice: صياغة تفيد مساءلة هذا الجيل قضائيًا عن دم الأنبياء المتراكم
  alternative: اعتبار العبارة مجرد بيان بلاغي للاستمرار التاريخي بلا دلالة قضائية قوية
  rationale: استعمال ἐκζητέω في سياق الدم يفيد طلب الحساب والمساءلة. وتحافظ الصياغة على هذا المعنى من غير أن تفصّل نظرية في الذنب الجماعي لا يصرح بها النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «يُطالَب ... بدم» لتجنب تركيب حرفي متعثر، مع إبقاء صورة الدم وقوة المساءلة القضائية. وُضعت علامة الحاشية عند العبارة الفعلية التي تفسرها.
