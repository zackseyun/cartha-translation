  rationale: الفعل المبني للمجهول يحمل هنا معنى قضائيًا، أي محاسبة جهة على الدم المسفوك. أُعيد ترتيب التركيب لتكون العبارة عربية واضحة، من غير حذف صورة «الدم» أو تخفيف معنى المساءلة.
- source_word: τὸ αἷμα
