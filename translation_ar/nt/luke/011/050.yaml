- source_word: πάντων τῶν προφητῶν
  choice: جميع الأنبياء
  rationale: ينقل شمول πάντων ويحافظ على الإضافة المباشرة.
- source_word: τὸ ἐκκεχυμένον
  choice: المسفوك
  rationale: وصف عربي مألوف للدم الناتج عن القتل، وينقل اسم المفعول اليوناني الذي يصف الدم.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: منذ تأسيس العالم
  rationale: يحافظ على الصورة الكتابية في καταβολή مع صياغة مفهومة في العربية المعاصرة.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: هذا الجيل
  rationale: جُعل «هذا الجيل» الجهة المطالَبة في التركيب العربي «يُطالَب ... بدم»، وهو ينقل دلالة ἀπό على الجهة التي تُطلب منها المحاسبة.
theological_decisions:
