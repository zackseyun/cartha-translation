  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: ar
  text: فإن كان الشيطان أيضًا قد انقسم على نفسه، فكيف تثبت مملكته؟ لأنكم تقولون إني ببعل زبول[a] أُخرج الشياطين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «بعل زبول»؛ وتستعمل بعض التقاليد صيغة «بعل زبوب».'
    reason: alternative_reading
lexical_decisions:
- source_word: Σατανᾶς
  choice: الشيطان
  rationale: الصيغة العربية الكتابية المألوفة للاسم/اللقب اليوناني، وهي واضحة للقارئ المعاصر.
- source_word: ἐφ’ ἑαυτὸν
  choice: على نفسه
  rationale: مع فعل الانقسام تفيد المعارضة الداخلية؛ والتعبير العربي «انقسم على نفسه» طبيعي ويحفظ صورة النص.
- source_word: διεμερίσθη
  choice: قد انقسم
  rationale: ينقل الماضي اليوناني مع إبراز الحالة الناتجة عنه في الشرط، من غير افتراض كيفية وقوع الانقسام.
- source_word: πῶς σταθήσεται
  choice: فكيف تثبت
  rationale: يحفظ استعارة الثبات والاستمرار وقوة السؤال البلاغي، وصيغة التأنيث توافق «مملكته».
- source_word: βασιλεία
  choice: مملكته
  rationale: «المملكة» المقابل المباشر والراسخ هنا، وتشير إلى سلطان الشيطان أو نطاق حكمه من غير توسيع تفسيري.
- source_word: ὅτι
  choice: لأنكم
  rationale: تُظهر الأداة أن قول المخاطَبين هو أساس الحجة؛ و«لأن» أوضح في العربية من «فإنكم» في هذا السياق.
- source_word: ἐν Βεελζεβοὺλ
  choice: ببعل زبول
  rationale: الباء تؤدي معنى الوساطة أو الاستعانة الذي تفيده ἐν هنا، من غير إضافة عبارة «بقوة» غير المصرح بها.
- source_word: Βεελζεβοὺλ
  choice: بعل زبول
  rationale: نقل صوتي عربي لصيغة الاسم اليونانية Βεελζεβούλ، مع فصل جزأيه وفق الاستعمال العربي الواضح.
- source_word: ἐκβάλλειν
  choice: أُخرج
  rationale: «أُخرج الشياطين» تعبير عربي مباشر ودقيق في سياق طرد الأرواح الشريرة.
- source_word: δαιμόνια
  choice: الشياطين
  rationale: المقابل العربي الشائع والمباشر لـ δαιμόνια في هذا السياق، من غير استبداله بالتفسير الأوسع «أرواح شريرة».
theological_decisions:
- issue: طبيعة اتهام خصوم يسوع
  choice: نُقل الاتهام على أنه إخراج الشياطين ببعل زبول، من غير شرح إضافي لطبيعة القوة أو العلاقة.
  alternative: إني بقوة بعل زبول أُخرج الشياطين؛ أو إني بالاتحاد مع بعل زبول أُخرجها.
  rationale: الباء تنقل معنى الوساطة/الاستعانة المحتمل في ἐν، مع إبقاء طبيعة العلاقة الدقيقة غير مفصلة كما في اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختير تركيب «انقسم على نفسه» و«تثبت مملكته» للمحافظة على الصورة البلاغية مع سلاسة الأسلوب. وُضع مؤشر الحاشية بعد الاسم الذي تشرحه مباشرة.
