  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: ar
  text: 'وبينما كان يقول هذا، رفعت امرأة من الجمع صوتها وقالت له: «طوبى للرحم الذي حملك، وللثديين اللذين رضعتهما!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُترجم: «طوبى للرحم الذي حملك، وللثديين اللذين أرضعاك». وفي اليونانية، الفعل في العبارة الأخيرة يجعل يسوع فاعل الرضاعة: «الثديين اللذين رضعتهما».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: وبينما كان يقول هذا
  rationale: ينقل التزامن والاستمرار في العبارة اليونانية نقلاً طبيعيًا، ويؤدي δὲ وظيفة الانتقال السردي من غير تركيب عربي ثقيل من نوع «وحدث».
- source_word: ἐπάρασά ... φωνὴν
  choice: رفعت ... صوتها
  rationale: تعبير عربي طبيعي يقابل المصطلح اليوناني بمعنى الجهر بالصوت أو الصياح.
- source_word: τις γυνὴ ἐκ τοῦ ὄχλου
  choice: امرأة من الجمع
  rationale: يحافظ على التنكير ومصدر الصوت داخل الجمع من غير الترجمة الحرفية الثقيلة «امرأة ما».
- source_word: Μακαρία
  choice: طوبى لـ
  rationale: صيغة عربية كتابية راسخة تنقل معنى الغبطة والبركة والحال المحمودة، لا مجرد الشعور بالسعادة.
- source_word: ἡ κοιλία ἡ βαστάσασά σε
  choice: البطن الذي حملك
  rationale: كلمة κοιλία تعني البطن، وفي السياق بطن الأم تحديدًا؛ و«حملك» تنقل βαστάζω مع إبقاء صورة الحمل الواردة في الأصل.
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: الثديين اللذين رضعتهما
  rationale: يحافظ على الصورة التشريحية وعلى كون يسوع هو فاعل الرضاعة في اليونانية، بصياغة عربية واضحة.
theological_decisions:
- issue: مدح أم يسوع في صيغة التطويب
  choice: طوبى للبطن الذي حملك، وللثديين اللذين رضعتهما
  alternative: مبارك البطن الذي حملك، والثديان اللذان أرضعاك
  rationale: تحفظ «طوبى» القوة التكريمية لعبارة Μακαρία من غير زيادة دلالة عقائدية لاحقة أو الانتقاص منها، كما تُبقي القول في صورة مدح الأم بواسطة وظائف الأمومة المذكورة في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدمت «الجمع» و«طوبى» للمحافظة على السجل الكتابي المألوف، مع تجنب التراكيب العتيقة غير الضرورية.
