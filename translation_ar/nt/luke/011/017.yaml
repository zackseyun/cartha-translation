base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: ar
  text: 'لكنه كان يعلم أفكارهم، فقال لهم: «كل مملكة تنقسم على ذاتها تُخرَّب، وبيت يسقط على بيت[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأسرة تسقط على أسرة». يمكن أن تعني الكلمة اليونانية οἶκος بيتًا مبنيًّا أو أهل بيتٍ وأسرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: كان يعلم
  rationale: ينقل معنى الإدراك الذهني المستمر في اسم الفاعل اليوناني بصياغة عربية طبيعية، مع إبقاء علاقته بالفعل الرئيسي واضحة.
- source_word: διανοήματα
  choice: أفكارهم
  rationale: لفظ واضح ومحايد يدل على ما يجري في الذهن من أفكار أو تدبيرات، من غير أن يضيف نية عدائية غير مصرَّح بها.
- source_word: Πᾶσα βασιλεία
  choice: كل مملكة
  rationale: يحفظ قوة التعميم في πᾶσα وصيغة المثل العام.
- source_word: ἐφ’ ἑαυτὴν
  choice: على ذاتها
  rationale: تعبير عربي فصيح يفيد توجّه الانقسام ضد المملكة نفسها ويحافظ على البنية المجازية.
- source_word: διαμερισθεῖσα
  choice: تنقسم
  rationale: ينقل الانقسام الداخلي المقصود في العبارة، بصيغة عربية سلسة تناسب الحكمة العامة.
- source_word: ἐρημοῦται
  choice: تُخرَّب
  rationale: يحفظ معنى الخراب والدمار وشدة النتيجة، كما يحافظ على المبني للمجهول في اليونانية.
- source_word: οἶκος ἐπὶ οἶκον
  choice: بيت يسقط على بيت
  rationale: يحافظ على الصورة الحسية والتركيب اليوناني المكثف، من غير حسم ما إذا كان οἶκος يراد به المبنى أم أهل البيت.
- source_word: πίπτει
  choice: يسقط
  rationale: مقابل مباشر يحفظ المضارع وصورة السقوط في القول المأثور.
theological_decisions:
- issue: دلالة οἶκος في الشطر الثاني من المثل
  choice: بيت
  alternative: أسرة أو أهل بيت
  rationale: لا يشتمل النص اليوناني على قرينة تحسم المعنى الاجتماعي، لذلك أُبقيت صورة «البيت» في المتن، مع إثبات المعنى الاجتماعي الممكن في الحاشية حفاظًا على الغموض الحقيقي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. صيغت الجملة بأسلوب طبيعي، مع الحفاظ على التعميم، والمبني للمجهول، والصورة الموجزة الملتبسة في خاتمة القول.
