lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: مُتَرَبِّصين
  rationale: يفيد اسم الفاعل الترقب الخفي بقصد الإيقاع به، و«مترصّدين» بديل ممكن، لكن «متربصين به» أفصح وأيسر هنا.
- source_word: αὐτόν
  choice: به
  rationale: الضمير يعود إلى يسوع، وتعدية «متربصين» بالباء طبيعية في العربية من غير استبدال الضمير باسم صريح.
- source_word: θηρεῦσαί
  choice: ليصطادوا
  rationale: يحفظ صورة الصيد في الفعل اليوناني، وفي السياق يدل على محاولة الإمساك عليه بقول.
- source_word: τι
  choice: شيئًا
  rationale: ينقل ضمير التنكير من غير تخصيصه بكلمة أو عبارة لم يصرح بها النص.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: من فمه
  rationale: يحافظ على الصورة المحسوسة في اليونانية، مع أن المقصود شيء مما يقوله.
