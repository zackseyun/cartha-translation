  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: ar
  text: إذًا أنتم شهود، وتوافقون على أعمال آبائكم؛ لأنهم هم قتلوهم، أما أنتم فتبنون قبورهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي قبور الأنبياء، كما يتضح من الآية السابقة؛ فكلمة «قبورهم» مفهومة من السياق وليست مذكورة صراحة في هذه الآية اليونانية.
    reason: توضيح سياقي ونصي
lexical_decisions:
- source_word: ἄρα
  choice: إذًا
  rationale: تفيد النتيجة المستخلصة من الاتهام السابق، وتحافظ على قوة الاستدلال بأسلوب عربي واضح.
- source_word: μάρτυρές ἐστε
  choice: أنتم شهود
  rationale: 'يحافظ على تركيب الاسم الخبري في اليونانية وعلى المفارقة السياقية: فأعمال المخاطَبين تجعلهم شهودًا على موقفهم.'
- source_word: συνευδοκεῖτε
  choice: توافقون على
  rationale: تنقل معنى الإقرار والموافقة الأخلاقية على أفعال الآباء، من غير أن تضيف معنى مذهبيًا أو نفسيًا زائدًا.
- source_word: τοῖς ἔργοις τῶν πατέρων ὑμῶν
  choice: على أعمال آبائكم
  rationale: «أعمال» مناسبة للأفعال المقصودة في السياق، و«آبائكم» تحفظ الصلة العائلية والبلاغية التي في النص.
- source_word: ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς
  choice: لأنهم هم قتلوهم
  rationale: «لأن» تبين أساس الاتهام، والضمير المنفصل «هم» يبرز المقابلة بين الآباء والمخاطَبين كما يفعل αὐτοὶ μὲν.
- source_word: ὑμεῖς δὲ οἰκοδομεῖτε
  choice: وأنتم تبنون قبورهم
  rationale: «وأنتم» تُظهر المقابلة، أما «قبورهم» فهي المفعول المفهوم مباشرة من الآية السابقة، وقد أُثبت لتكتمل العبارة طبيعيًا بالعربية.
theological_decisions:
- issue: هل يُذكر مفعول «تبنون» المفهوم من السياق؟
  choice: 'إثباته في المتن: «تبنون قبورهم»'
  alternative: 'تركه مقدرًا: «وأنتم تبنون»'
  rationale: الفعل οἰκοδομεῖτε ورد بلا مفعول مصرح به في هذه الآية، لكن مفعوله واضح من ذكر قبور الأنبياء في الآية السابقة. إثباته يجعل العربية طبيعية ومفهومة، مع بيان هذه الإضافة السياقية في الحاشية.
- issue: دلالة العلاقة بين قتل الآباء وبناء المخاطَبين
  choice: الإبقاء على المقابلة من غير شرح لاهوتي زائد
  alternative: التصريح بأن بناء القبور مشاركة في ذنب القتل أو إدانة له
  rationale: النص يجمع بين الشهادة والموافقة ثم يقابل بين القتل والبناء، وفي ذلك توتر بلاغي مقصود. لا ينبغي للترجمة أن تحسم بشرح مضاف الكيفية الدقيقة التي يدل بها البناء على الموافقة.
translation_notes:
  register: صياغة عربية فصحى معاصرة واضحة ووقورة. استُخدمت «إذًا» للاستنتاج، و«أنتم شهود» للمحافظة على بنية الأصل، مع إبراز المقابلة بواسطة «هم» و«أنتم».
