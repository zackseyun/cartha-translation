  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: ar
  text: 'أما هو فقال: «بل طوبى للذين يسمعون كلمة الله ويحفظونها».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «نعم، بل طوبى للذين…» أو «حقًّا، طوبى للذين…». فالأداة اليونانية قد تفيد الإقرار مع إعادة توجيه التركيز.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: بل
  rationale: تفيد هنا تصحيح مسار التركيز أو الارتقاء به من غير أن تستلزم نقض كلام المرأة نقضًا حادًّا. و«بل» عربية طبيعية موجزة تحفظ هذا التوتر.
- source_word: μακάριοι
  choice: طوبى للذين
  rationale: «طوبى» تعبير عربي كتابي راسخ ينقل معنى الغبطة والبركة الإلهية، ولا يحصره في شعور نفسي عابر أو حظ دنيوي.
- source_word: οἱ ἀκούοντες
  choice: الذين يسمعون
  rationale: ينقل اسم الفاعل المضارع الدال على فئة تتصف بالسماع، بصياغة عربية واضحة وطبيعية.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: كلمة الله
  rationale: تحفظ المدى الدلالي والوقع الكتابي للفظ λόγος، الذي يشير هنا إلى قول الله أو إعلانه، من غير تضييقه إلى «رسالة» فقط.
- source_word: φυλάσσοντες
  choice: يحفظونها
  rationale: «يحفظونها» تتسع لمعاني صون كلمة الله ومراعاتها والعمل بها، وتحافظ على صورة الفعل اليوناني أكثر من قصره على «يطيعونها».
- source_word: αὐτὸς δὲ εἶπεν
  choice: أما هو فقال
  rationale: تبرز «أما هو» انتقال الكلام إلى جواب يسوع مع قدر لطيف من المقابلة بالسياق السابق، من غير جعل δέ أداة تعارض حاد.
theological_decisions:
- issue: قوة جواب يسوع لقول المرأة عن الطوبى
  choice: يعيد يسوع توجيه التركيز إلى أن الطوبى الحقيقية للذين يسمعون كلمة الله ويحفظونها، من غير تصريح بنفي طوبى أمه.
  alternative: إما أن يرفض قول المرأة رفضًا صريحًا، أو أن يضيف إليه تطويبًا آخر بلا أي تصحيح للتركيز.
  rationale: يمكن أن تجمع Μενοῦν بين الإقرار وإعادة التوجيه أو التصحيح. لذلك تحافظ «بل» مع الحاشية على التوتر الدلالي ولا تحسمه في اتجاه الرفض التام أو الإضافة المحضة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدمت «طوبى» لرنينها الكتابي المفهوم، و«يحفظونها» لإبقاء معنى الصون والمراعاة والعمل دون اختزاله في الطاعة وحدها. وُضعت علامة الحاشية بعد الجملة كاملة، وهي تشير إلى دلالة «بل» في صدر القول.
