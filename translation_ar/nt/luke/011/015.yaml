  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: ar
  text: 'لكن بعضٌ منهم قالوا: «ببعل زبول[a]، رئيس الشياطين، يُخرج الشياطين».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تَرِد أيضًا الصيغة المألوفة للاسم: «بعل زبوب». أمّا المتن هنا فيتبع الصيغة اليونانية: «بعل زبول».'
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: لكن بعضًا منهم
  rationale: ينقل «لكن» قوة δὲ التقابلية في السياق، وتؤدي «بعضًا منهم» معنى المجموعة غير المحددة الخارجة من بين الحاضرين مع الحفاظ على الدلالة التبعيضية.
- source_word: εἶπον
  choice: قالوا
  rationale: الماضي البسيط مناسب لصيغة الماضي اليونانية التي تعرض القول بوصفه حدثًا.
- source_word: Ἐν Βεελζεβοὺλ
  choice: ببعل زبول
  rationale: الباء تعبّر طبيعيًا عن الوساطة أو القوة التي زعموا أنه يعمل بها، والاسم منقول بحسب الصيغة اليونانية Βεελζεβούλ.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: رئيس الشياطين
  rationale: «رئيس» لفظ عربي واضح يدل على صاحب السلطة والسيادة، من غير إضافة تفصيلات لاحقة إلى بنية عالم الشياطين.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: يُخرج الشياطين
  rationale: «يُخرج» يؤدي المعنى المألوف للفعل ἐκβάλλω في سياق طرد الشياطين، ويحافظ «الشياطين» على المقابل المباشر لـ δαιμόνια.
theological_decisions:
- issue: نقل الاسم Βεελζεβούλ
  choice: بعل زبول
  alternative: بعل زبوب
  rationale: يتبع المتن الصيغة اليونانية «زبول»، بينما تُذكر الصيغة التقليدية الأشهر «زبوب» في الحاشية من غير إحلالها محل قراءة النص المصدر.
- issue: ترجمة ἄρχων
  choice: رئيس الشياطين
  alternative: حاكم الشياطين
  rationale: «رئيس» تعبير عربي طبيعي وواضح عن السلطة المقصودة، ولا يفرض تصورًا مذهبيًا أكثر تحديدًا مما يقوله النص.
