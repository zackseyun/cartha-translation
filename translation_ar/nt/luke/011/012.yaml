  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: ar
  text: أو إن طلب بيضة، أفيعطيه عقربًا؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: أو إن
  rationale: تُدخل المثال الموازي التالي في سلسلة الأسئلة البلاغية، وتحافظ «أو» على الانتقال التخييري من غير إثقال ترجمة καί.
- source_word: αἰτήσει
  choice: طلب
  rationale: الفعل مستقبل في اليونانية ضمن تركيب ذي معنى شرطي؛ والماضي بعد «إن» عربي فصيح طبيعي يؤدي معنى افتراض الطلب.
- source_word: ᾠόν
  choice: بيضة
  rationale: المقابل العربي المباشر والمألوف للاسم اليوناني.
- source_word: ἐπιδώσει
  choice: أفيعطيه
  rationale: يفيد إعطاء الشيء أو تقديمه استجابةً للطلب؛ والاستفهام بالهمزة يحفظ القوة البلاغية، والضمير المتصل يؤدي المفعول غير المباشر.
- source_word: αὐτῷ
  choice: ـه
  rationale: ضمير المفعول غير المباشر، وصيغة «يعطيه» هي التعبير العربي الطبيعي.
- source_word: σκορπίον
  choice: عقربًا
  rationale: المقابل المباشر، ويحفظ التباين الصادم بين البيضة والعقرب.
theological_decisions:
- issue: القوة البلاغية لتشبيه الأب والابن
  choice: صياغته سؤالًا بلاغيًا مباشرًا من غير شرح تفسيري زائد.
  alternative: إضافة «بدلًا منها» لتصريح المقابلة الضمنية.
  rationale: النص اليوناني يترك معنى الاستبدال مفهومًا من المقابلة، والصياغة العربية تنقله بوضوح من غير أن تحسم أو تضيف ما لم يُصرَّح به.
translation_notes:
  register: عربية فصحى حديثة، موجزة وطبيعية وذات نبرة كريمة. استُعملت همزة الاستفهام في «أفيعطيه» لإبراز السؤال البلاغي، ولم تُضف عبارة «بدلًا منها» لأن المقابلة واضحة ضمنًا.
