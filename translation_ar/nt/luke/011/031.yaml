id: LUK.11.31
reference: Luke 11:31
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: ar
  text: مَلِكَةُ الجنوب ستقوم في الدينونة مع رجال هذا الجيل وتدينهم[a]، لأنها جاءت من أقاصي الأرض لتسمع حكمة سليمان، وها هنا ما هو أعظم من سليمان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي الشخصية التي تُعرَف عادةً بملكة سبأ (انظر 1 ملوك 10: 1–13؛ 2 أخبار الأيام 9: 1–12).'
    reason: cross_reference
  - marker: b
    text: 'أو: «مَن هو أعظم من سليمان». التعبير اليوناني محايد نحويًا، وحرفيًّا: «ما هو أعظم من سليمان»، وقد يفيد معنى أوسع من المقارنة المباشرة بين شخصين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: مَلِكَةُ الجنوب
  rationale: يحافظ على تركيب اليونانية وإشارتها إلى الشخصية المعروفة من العهد القديم، من غير إدخال اسم «ملكة سبأ» في المتن.
- source_word: ἐγερθήσεται
  choice: ستقوم
  rationale: يناسب مشهد الدينونة، ويحفظ احتمال الإيحاء بالقيامة من غير التصريح بما لا يصرح به الفعل في هذا السياق.
- source_word: ἐν τῇ κρίσει
  choice: في الدينونة
  rationale: أداة التعريف في اليونانية تشير إلى دينونة محددة ذات طابع أخروي، و«الدينونة» لفظ عربي كتابي واضح.
- source_word: μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης
  choice: مع رجال هذا الجيل
  rationale: يحافظ على الدلالة المذكرة الصريحة لكلمة ἀνδρῶν وعلى المعنى المعتاد لكلمة γενεά، أي الجيل المعاصر.
- source_word: κατακρινεῖ αὐτούς
  choice: وتدينهم
  rationale: ينقل معنى الإدانة لا مجرد إصدار حكم محايد، مع صياغة عربية موجزة وطبيعية.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: من أقاصي الأرض
  rationale: تعبير عربي مألوف ينقل الصورة الاصطلاحية لمكان شديد البعد.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: لتسمع حكمة سليمان
  rationale: ينقل مصدر الغاية ويحافظ على كون الحكمة هي موضوع السماع.
- source_word: ἰδοὺ
  choice: وها إنَّ
  rationale: أداة تنبيه فصيحة تحفظ القوة البلاغية الجليلة للفظ اليوناني من غير ركاكة.
- source_word: πλεῖον Σολομῶνος
  choice: ما هو أعظم من سليمان
  rationale: يحافظ على الصيغة المحايدة في اليونانية، فلا يحصر المقارنة صراحة في شخص وحده.
- source_word: ὧδε
  choice: هنا
  rationale: مقابل عربي مباشر وطبيعي للدلالة على الحضور في الموضع.
theological_decisions:
- issue: هل تُذكر هوية الملكة صراحة بوصفها ملكة سبأ؟
  choice: مَلِكَةُ الجنوب في المتن
  alternative: ملكة سبأ
  rationale: الإشارة إلى ملكة سبأ قوية، لكن النص اليوناني يقول «ملكة الجنوب»؛ لذلك حُفظ اللفظ الأصلي ووُضّحت الإشارة في الحاشية.
- issue: هل تُشخَّص عبارة πλεῖον Σολομῶνος؟
  choice: ما هو أعظم من سليمان
  alternative: مَن هو أعظم من سليمان
  rationale: الصفة اليونانية محايدة نحويًا، وقد تحمل معنى أوسع من مجرد مقارنة شخصية مباشرة؛ فالصياغة المختارة تحفظ هذا التوتر.
- issue: هل يُصرَّح بالقيامة في ترجمة ἐγερθήσεται؟
  choice: ستقوم
  alternative: ستُقام
  rationale: السياق الأخروي قد يوحي بالقيامة، لكن الفعل في المشهد القضائي يمكن أن يعني أيضًا القيام للشهادة أو الدينونة؛ لذا لم يُحسم الاحتمال في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت ألفاظ كتابية مألوفة مثل «الدينونة» و«أقاصي الأرض»، مع الحفاظ على الغموض المقصود في العبارة الختامية وعلى جميع علامات الحواشي في المتن.
