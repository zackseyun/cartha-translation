  register: عربية فصحى معاصرة واضحة وكريمة النبرة. اختيرت صياغة طبيعية مع إبقاء صورة الطريق الحرفية في الحاشية، وتُرك مفعول «أقدّمه» غير مصرّح به كما في اليونانية.
