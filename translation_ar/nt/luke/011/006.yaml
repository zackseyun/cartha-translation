  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: ar
  text: لأن صديقًا لي وصل إليَّ من سفر[a]، وليس عندي ما أقدّمه له.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «من الطريق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: لأن
  rationale: تُدخل سبب الطلب في المثل بعبارة سببية طبيعية وواضحة.
- source_word: φίλος μου
  choice: صديقًا لي
  rationale: يحافظ على التنكير في φίλος مع دلالة الملكية في μου، وهو أسلس من «صديقي» هنا.
- source_word: παρεγένετο
  choice: وصل
  rationale: يدل الفعل في السياق على الوصول والحضور، والماضي العربي الطبيعي يعبّر عن وصول الصديق وبقائه حاضرًا.
- source_word: ἐξ ὁδοῦ
  choice: من سفر
  rationale: المعنى الحرفي «من الطريق»، لكن العبارة اصطلاحيًا تشير إلى مجيئه بعد سفر؛ لذا يوضح «من سفر» المقصود مع إثبات الحرفي في الحاشية.
- source_word: πρός με
  choice: إليَّ
  rationale: ينقل اتجاه الحركة نحو المتكلم دون إضافة البيت أو قصد الزيارة، وهما غير مصرّح بهما.
- source_word: οὐκ ἔχω
  choice: ليس عندي
  rationale: صياغة عربية طبيعية ومباشرة لنفي امتلاك ما يلزم.
- source_word: ὃ παραθήσω αὐτῷ
  choice: ما أقدّمه له
  rationale: يفيد παρατίθημι وضع الطعام أمام الضيف في سياق الضيافة؛ و«أقدّمه له» طبيعي ويحفظ المعنى دون التصريح بالطعام، الذي يفهم من السياق.
theological_decisions: []
