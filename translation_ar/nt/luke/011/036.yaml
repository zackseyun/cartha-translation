base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: ar
  text: فإن كان جسدك كله منيرًا، ولا جزء فيه مظلم، فسيكون كله منيرًا، كما حين ينيرك المصباح بضيائه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كما حين ينيرك المصباح بوميضه». يمكن أن تدل الكلمة اليونانية على الوميض أو اللمعان، ويُرجَّح هنا أنها تشير إلى إشراق المصباح لا إلى البرق الحرفي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: جسدك
  rationale: يحفظ اللفظ الحسي في اليونانية والصورة المتصلة بالعين والمصباح، من غير تحويله تفسيرًا إلى النفس أو الإنسان الباطن.
- source_word: ὅλον
  choice: كله
  rationale: يحفظ قوة الشمول في موضعيها بصياغة عربية طبيعية.
- source_word: φωτεινόν
  choice: منيرًا
  rationale: يقابل صفة الإضاءة بوضوح، ويحافظ على التضاد مع «مظلم» من غير إطالة تفسيرية.
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: وليس فيه جزء مظلم
  rationale: صياغة عربية سلسة تحافظ على صورة وجود جزء مظلم وعلى معنى النفي.
- source_word: ἔσται
  choice: كان
  rationale: جاء جواب الشرط الماضي لفظًا في العربية الفصيحة، وهو يؤدي معنى النتيجة المستقبلية أو المتحققة بحسب الشرط من غير تكلف.
- source_word: ὡς ὅταν
  choice: كما حين
  rationale: يحفظ الجمع بين المقارنة والدلالة الزمنية في العبارة اليونانية.
- source_word: λύχνος
  choice: المصباح
  rationale: يدل على المصباح المادي، لا على النور المجرد ولا على المنارة.
- source_word: τῇ ἀστραπῇ
  choice: بلمعانه
  rationale: يناسب المصباح في السياق ويعكس معنى اللمعان أو الوميض الممكن في ἀστραπή، من غير فهمه برقًا حرفيًا.
- source_word: φωτίζῃ σε
  choice: يضيء لك
  rationale: تعبير عربي طبيعي يحفظ فعل الإنارة وتوجيهها إلى المخاطب.
theological_decisions:
- issue: القوة المجازية للجسد والنور في قول يسوع
  choice: الإبقاء على صورتي الجسد والنور من غير شرحهما عقائديًا
  alternative: تفسيرهما صراحة بالحياة الباطنة أو الحالة الروحية أو الأخلاقية
  rationale: السياق السابق يتحدث عن العين بوصفها مصباح الجسد؛ لذا يحفظ النص المجاز والتوتر الدلالي بدل حسم المراد في ترجمة تفسيرية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. أُبقي التكرار المقصود في «كله منيرًا»، واستُعمل تركيب شرطي عربي طبيعي مع الحفاظ على الصور الحسية في الأصل.
