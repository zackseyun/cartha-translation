  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: ar
  text: الويل لكم، لأنكم مثل القبور غير الظاهرة، يمشي الناس فوقها وهم لا يعلمون.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: الويل لكم
  rationale: صياغة عربية فصيحة ومباشرة تحفظ نبرة التحذير والدينونة في الأصل.
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: القبور غير الظاهرة
  rationale: ἄδηλα تعني غير الظاهرة أو غير المعلَّمة؛ اختيرت صياغة تحفظ اتساع الدلالة ولا تفترض أن المشكلة مقتصرة على غياب علامة موضوعة.
- source_word: οἱ ἄνθρωποι
  choice: الناس
  rationale: اللفظ اليوناني هنا عام يشمل البشر الذين يمشون فوق القبور، و«الناس» هي المقابل العربي الطبيعي غير المقيَّد بالذكور.
- source_word: περιπατοῦντες ἐπάνω
  choice: يمشي الناس فوقها
  rationale: ينقل فعل المشي وحرف الجر الدال على المرور فوق القبور بوضوح وطبيعية.
- source_word: οὐκ οἴδασιν
  choice: وهم لا يعلمون
  rationale: يحفظ عدم المعرفة في الأصل، مع عود الضمير المفهوم سياقيًا إلى حقيقة وجود القبور تحتهم.
theological_decisions:
- issue: صلة القبور غير الظاهرة بالنجاسة الطقسية
  choice: الإبقاء على الصورة دون شرح داخل النص
  alternative: إضافة أن المرور فوقها ينجّس الناس من غير علمهم
  rationale: النص اليوناني لا يصرّح بالنجاسة هنا، وإن كانت الخلفية الثقافية والناموسية تضيء الصورة؛ لذلك لا ينبغي إدخال التفسير في المتن.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. حُفظت استعارة القبور وغموض ما لا يعلمه المارّون من غير توسع تفسيري.
