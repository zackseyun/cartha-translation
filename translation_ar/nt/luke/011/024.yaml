  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: ar
  text: '«متى خرج الروح النجس من الإنسان، يجتاز أماكن لا ماء فيها[a] طالبًا راحة، فإذا لم يجدها يقول: ‹سأرجع إلى بيتي الذي خرجت منه›».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أماكن جافة». والعبارة اليونانية تعني حرفيًا أماكن لا ماء فيها.'
    reason: بديل معجمي يوضح المعنى الحرفي لـ ἀνύδρων.
lexical_decisions:
- source_word: Ὅταν
  choice: متى
  rationale: تفيد شرطًا زمنيًا عامًا مع صيغة الاحتمال، وتحافظ على طابع القول التمثيلي المتكرر دون حصره في واقعة واحدة.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: الروح النجس
  rationale: تعبير عربي واضح ومألوف يحفظ دلالة النجاسة في العبارة اليونانية ويعرض الروح بوصفه فاعلًا شخصيًا.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: خرج ... من الإنسان
  rationale: ينقل فعل الخروج ومصدره مباشرة؛ و«الإنسان» مفرد مذكر يمثل حالة عامة، كما في اليونانية.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: يجتاز في أماكن لا ماء فيها
  rationale: يحفظ الصورة الحرفية لأماكن منعدمة الماء، مع تركيب عربي طبيعي.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: طالبًا راحة
  rationale: يحافظ على صيغة الحال وعلى معنى السعي إلى الراحة بإيجاز.
- source_word: καὶ μὴ εὑρίσκον
  choice: فإذا لم يجدها
  rationale: الضمير يعود بوضوح إلى «راحة»، وهو مفعول مفهوم من السياق اليوناني، والفاء تلائم تتابع الحدث في العربية.
- source_word: Ὑποστρέψω
  choice: سأرجع
  rationale: ينقل صيغة المستقبل الدالة على العزم، ويرتبط طبيعيًا بصورة الخروج والعودة.
- source_word: εἰς τὸν οἶκόν μου
  choice: إلى بيتي
  rationale: يحفظ استعارة البيت الملموسة التي تتواصل في السياق التالي.
- source_word: ὅθεν ἐξῆλθον
  choice: الذي خرجت منه
  rationale: صياغة عربية واضحة تحافظ على جملة الصلة وتكرر صورة الخروج الواردة في أول الآية.
theological_decisions:
- issue: طبيعة «الروح النجس»
  choice: الإبقاء عليه روحًا شخصيًا يتصرف ويتكلم
  alternative: فهمه مجازًا للانتكاس الأخلاقي أو قوة غير شخصية
  rationale: يعرضه النص فاعلًا يخرج ويجتاز ويطلب ويقول ويرجع؛ لذلك لا تحوّله الترجمة إلى مجرد رمز أو قوة مجردة.
- issue: دلالة ἀνθρώπου من جهة الجنس والعموم
  choice: الإنسان
  alternative: رجل أو شخص
  rationale: «الإنسان» مفرد مذكر في العربية ويؤدي معنى الحالة البشرية التمثيلية من غير أن يضيف تخصيصًا برجل بالغ لا يقتضيه الاسم اليوناني في هذا السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية رصينة. استُخدم الحاضر في «يجتاز» و«يقول» للمحافظة على حيوية القول العام، ووُضع رمز الحاشية بعد العبارة التي يشرحها.
