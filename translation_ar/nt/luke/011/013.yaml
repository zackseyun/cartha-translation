reference: Luke 11:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: ar
  text: فإن كنتم أنتم، مع أنكم أشرار، تعرفون كيف تعطون أولادكم عطايا صالحة، فكم بالحري يعطي الآب الذي من السماء[a] الروح القدس للذين يطلبونه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقول اليونانية حرفيًا: «الآب الذي من السماء»، لا «أبوكم السماوي» كما في بعض الترجمات التي توافق صياغة متى 7:11.'
    reason: alternative_reading
  - marker: b
    text: في متى 7:11 تأتي «خيرات» في الموضع الذي يذكر فيه لوقا هنا «الروح القدس»؛ وقد حُفظت الصياغة الخاصة بكل إنجيل.
    reason: cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: مع أنكم أشرار
  rationale: ينقل التركيب الوصفي معنى الحال التنازلية الملائم للسياق، بلغة عربية طبيعية، من غير تخفيف لوصف الشر.
- source_word: οἴδατε ... διδόναι
  choice: تعرفون أن تعطوا
  rationale: يحافظ على دلالة المعرفة العملية المتصلة بفعل العطاء، مع تركيب عربي فصيح واضح.
- source_word: δόματα ἀγαθὰ
  choice: عطايا صالحة
  rationale: «عطايا» تنقل معنى δόματα المحدد، و«صالحة» تحفظ وصف الجودة والنفع.
- source_word: τέκνοις ὑμῶν
  choice: أولادكم
  rationale: لفظ طبيعي ودقيق في سياق علاقة الوالدين بأبنائهم.
- source_word: πόσῳ μᾶλλον
  choice: فكم بالحري
  rationale: تعبير عربي مألوف للحجة من الأدنى إلى الأعلى ويحفظ قوة المقارنة.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: الآب الذي من السماء
  rationale: يحفظ حرف الجر ἐξ، أي «من»، ولا يضيف ضمير الملكية الغائب عن نص لوقا ولا ينسجم النص قسرًا مع متى 7:11.
- source_word: πνεῦμα ἅγιον
  choice: الروح القدس
  rationale: السياق يشير إلى روح الله بوصفه عطية الآب، والتعبير العربي المعهود والدقيق هو «الروح القدس».
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: للذين يطلبونه
  rationale: ينقل اسم الفاعل الدال على الذين يطلبون، ويحفظ ضمير المفعول الصريح αὐτόν؛ ومرجعه النحوي الطبيعي الآب.
theological_decisions:
- issue: مرجع πνεῦμα ἅγιον
  choice: الروح القدس، أي روح الله
  alternative: روح مقدس على نحو غير معيّن
  rationale: مع أن العبارة بلا أداة تعريف في اليونانية، فإن السياق اللوقاوي يدل على روح الله الذي يمنحه الآب، من غير إضافة تفصيل عقائدي غير مصرح به في الآية.
- issue: صياغة لوقا المتميزة عن متى 7:11
  choice: إبقاء «الآب الذي من السماء» و«الروح القدس»
  alternative: المواءمة إلى «أبوكم السماوي» أو «خيرات»
  rationale: يجب حفظ ألفاظ النص اللوقاوي؛ فهو لا يذكر «أبوكم»، ويخص العطية هنا بالروح القدس.
- issue: مرجع الضمير في αὐτόν
  choice: 'الآب: «يطلبونه»'
  alternative: فهم الضمير على أنه يعود إلى الروح القدس
  rationale: الضمير المذكر المفرد يعود نحويًا على «الآب» المذكر، بينما πνεῦμα محايد في اليونانية؛ لذا المقصود الذين يطلبون من الآب.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعمل «فكم بالحري» لصون بنية القياس من الأدنى إلى الأعلى، و«الآب الذي من السماء» للمحافظة على صياغة لوقا غير المعتادة من دون مواءمتها مع النص الموازي.
