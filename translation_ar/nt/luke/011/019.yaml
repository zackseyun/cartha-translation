  source_fidelity: 'النص العربي ينقل البنية الحجاجية للنص اليوناني بأمانة: الشرط الاستدراكي، وتوكيد «أنا»، والمعنى الأداتي لـἐν، وفعل إخراج الشياطين، والتعبير غير المحسوم «أبناؤكم»، والاستنتاج الختامي مع توكيد αὐτοί. و«فبمن» اختيار مشروع للسؤال عن العامل/الواسطة في ضوء المقابلة ببعلزبول، من غير إضافة تفسيرية.'
