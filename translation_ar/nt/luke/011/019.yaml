  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: ar
  text: ولكن إن كنتُ أنا ببعلزبول أُخرج الشياطين، فبمن يُخرجها أبناؤكم؟ لذلك هم أنفسهم سيكونون قضاتكم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: ولكن إن
  rationale: تنقل δέ بوصفها أداة استدراك خفيف تواصل حجة يسوع وتبرز المقابلة.
- source_word: ἐγὼ
  choice: كنتُ أنا
  rationale: إظهار الضمير المنفصل «أنا» يحفظ توكيد الضمير اليوناني الصريح والمقابلة في الحجة.
- source_word: ἐν Βεελζεβοὺλ
  choice: ببعلزبول
  rationale: الباء تؤدي المعنى الأداتي لـἐν في هذا السياق، مع نقل الاسم العلم صوتيًا دون إضافة تفسيرية مثل «بقوة».
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: أُخرج الشياطين
  rationale: «أُخرج» تعبير عربي طبيعي وواضح عن طرد الشياطين، و«الشياطين» تقابل τὰ δαιμόνια في هذا السياق.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: أبناؤكم
  rationale: يحفظ المعنى المباشر لـυἱοί ولا يحسم هوية المشار إليهم بتفسير مثل «تلاميذكم» أو «أتباعكم».
- source_word: ἐν τίνι
  choice: فبمن
  rationale: السؤال هنا عن العامل أو الوسيط، والمقابلة مع بعلزبول ترجح صيغة السؤال عن شخص، مع بقاء احتمال الوسيلة مفهومًا من السياق.
- source_word: ἐκβάλλουσιν
  choice: يُخرجها
  rationale: يحافظ على تكرار الفعل، ويعود ضمير المؤنث المفرد غير العاقل طبيعيًا في العربية إلى جمع «الشياطين».
- source_word: διὰ τοῦτο
  choice: لذلك
  rationale: تؤدي الاستنتاج السببي بإيجاز ووضوح في العربية المعاصرة.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: هم أنفسهم سيكونون قضاتكم
  rationale: يحفظ «هم أنفسهم» توكيد αὐτοί الظاهر في اليونانية، فيما تنقل «قضاتكم» علاقة الإضافة في ὑμῶν κριταί.
theological_decisions:
- issue: هوية «أبنائكم»
  choice: الإبقاء على التعبير الحرفي «أبناؤكم»
  alternative: أتباعكم أو تلاميذكم أو أبناء قومكم
  rationale: النص اليوناني يقول حرفيًا «أبناؤكم»، وتعيينهم على أنهم فئة بعينها يحسم غموضًا تفسيريًا لا يحسمه النص نفسه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أُخرج الشياطين» بدل تعبيرات أشد قدمًا، وحُفظ التوكيد في «أنا» و«هم أنفسهم» لما له من أثر حجاجي في الأصل.
