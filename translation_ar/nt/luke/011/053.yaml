    text: 'أو: «يستجوبونه بإلحاح»، أو: «يحملونه على الكلام من غير إعداد». الفعل اليوناني نادر، ويشير إلى محاولة عدائية لاستنطاقه وانتزاع أجوبة منه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: ولما خرج من هناك
  rationale: ينقل الظرف المكاني مع تركيب المضاف إليه المطلق ذي الدلالة الزمنية السابقة للفعل الرئيس، بصياغة عربية طبيعية وواضحة.
- source_word: ἤρξαντο
  choice: بدأ
  rationale: يعكس الدلالة الشروعّية للفعل مع المصدرين التاليين، مع إفراد الفعل قبل الفاعل المركب وفق الأسلوب العربي الفصيح.
- source_word: οἱ γραμματεῖς
  choice: الكتبة
  rationale: المقابل العربي المباشر والمستقر للفئة المعروفة في سياق الأناجيل، من غير تحويل الاسم إلى تفسير وظيفي أضيق.
- source_word: οἱ Φαρισαῖοι
  choice: الفريسيون
  rationale: الصيغة العربية الشائعة لاسم هذه الجماعة.
- source_word: δεινῶς ἐνέχειν
  choice: يضايقونه بشدة
  rationale: ينقل الضغط العدائي الشديد الذي يدل عليه اقتران الفعل بالظرف، بلغة عربية مفهومة من غير مبالغة تفسيرية.
- source_word: ἀποστοματίζειν αὐτόν
  choice: ويستدرجونه إلى الكلام
  rationale: الفعل نادر، ويشير في هذا السياق إلى انتزاع أقوال منه أو حمله على الإجابة بأسلوب عدائي؛ و«يستدرجونه إلى الكلام» يحفظ قصد الاستنطاق من غير أن يحسم طريقته بدقة زائفة.
- source_word: περὶ πλειόνων
  choice: في أمور كثيرة
  rationale: يفيد تعدد الموضوعات أو المسائل هنا، لا مجرد المقارنة الزمنية بمعنى «أكثر من قبل».
