  source_fidelity: 'ينقل النص تسلسل الحدث في الأصل اليوناني: مغادرة يسوع للمكان، ثم شروع الكتبة والفريسيين في ممارسة ضغط عدائي شديد عليه واستنطاقه في مسائل كثيرة. و«ولما خرج من هناك» تمثيل عربي سليم للتركيب المطلق، وإن كان يحتمل أيضًا معنى «بعدما خرج».'
