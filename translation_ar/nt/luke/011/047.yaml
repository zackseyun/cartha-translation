  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: ar
  text: الويل لكم، لأنكم تبنون قبور الأنبياء[a]، أما آباؤكم[b] فقتلوهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أضرحة الأنبياء»؛ فاللفظ اليوناني قد يعني القبور أو الأبنية التذكارية المقامة عليها.'
    reason: lexical_alternative
  - marker: b
    text: 'أي: أسلافكم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: الويل لكم
  rationale: تعبير عربي فصيح ومألوف يحفظ قوة الإنذار النبوي والإدانة المباشرة.
- source_word: ὅτι
  choice: لأنكم
  rationale: يبيّن أن ما بعده سبب إعلان الويل، بصياغة عربية واضحة.
- source_word: οἰκοδομεῖτε
  choice: تبنون
  rationale: يحافظ على المضارع اليوناني من غير فرض دلالة الاستمرار الزمني.
- source_word: τὰ μνημεῖα
  choice: قبور
  rationale: يدل اللفظ في هذا السياق على القبور أو الأبنية التذكارية الجنائزية؛ و«قبور» أوضح في المتن.
- source_word: τῶν προφητῶν
  choice: الأنبياء
  rationale: إضافة مباشرة طبيعية تعبّر عن القبور المنسوبة إلى الأنبياء.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: أما آباؤكم
  rationale: تنقل δέ بوصفها انتقالًا تقابليًا خفيفًا، من غير تقوية العلاقة إلى تناقض صريح يفوق النص، وتحفظ صورة «الآباء» الأصلية.
- source_word: ἀπέκτειναν αὐτούς
  choice: فقتلوهم
  rationale: ترجمة مباشرة للفعل والضمير، من غير إضافة الدلالة القانونية الأقوى في «اغتالوهم» أو «قتلوهم ظلمًا».
theological_decisions:
- issue: العلاقة البلاغية بين بناء قبور الأنبياء وقتل الآباء لهم
  choice: 'الإبقاء على المجاورة المتوترة: «أما آباؤكم فقتلوهم»'
  alternative: «قبور الأنبياء الذين قتلهم آباؤكم»
  rationale: تركيب الجملة اليونانية يستأنف بفاعل صريح مع δέ، فيعرض الفعلين في مقابلة من غير أن يشرح بعدُ معنى الشهادة أو المشاركة؛ وهذا التفسير يتضح في الآية التالية، فلا يُستبق هنا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعمل «الويل لكم» لصون نبرة الإدانة النبوية، مع ترتيب علامتي الحاشية بحسب موضع ظهورهما في النص.
