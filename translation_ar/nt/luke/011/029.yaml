  source_fidelity: 'النص العربي يطابق اليونانية بدقة: يحفظ الظرف المصاحب المستمر في «وبينما كانت الجموع تتجمّع»، والبناء الابتدائي «بدأ يقول»، والتكرار التوكيدي في «هذا الجيل جيل شرير»، والمستقبل المبني للمجهول المنفي، والاستثناء في «إلا آية يونان». كما أبقى إضافة «آية يونان» مفتوحة الدلالة كما في الأصل.'
  naturalness: الصياغة فصحى معاصرة سليمة وواضحة، وعلامات الترقيم والحوار مناسبة. «آية» اختيار طبيعي في السياق الكتابي العربي دون زيادة تفسيرية.
  terminology: «الجيل»، «شرير»، و«آية» مقابلات مستقرة ومناسبة. الحاشية على «آية يونان» تشرح إمكانات الفهم دون أن تحسمها مذهبيًا أو تدخلها في المتن. البديل «خبيث» ممكن معجميًا، وإن كان «شرير» أدق في هذا السياق وقد اختير في المتن.
