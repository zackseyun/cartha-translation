id: LUK.11.29
reference: Luke 11:29
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: ar
  text: 'وبينما كانت الجموع تتجمّع، بدأ يقول: «هذا الجيل جيل شرير[a]. يطلب آية، ولن تُعطى له آية إلا آية يونان[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جيل خبيث».'
    reason: lexical_alternative
  - marker: b
    text: قد تشير «آية يونان» إلى يونان نفسه بوصفه آية من خلال رسالته النبوية، وقد تستحضر أيضًا، في ضوء النصوص الإنجيلية الموازية، صلات رمزية بموت يسوع وقيامته.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: كانت الجموع تتجمّع
  rationale: يحفظ معنى الفعل المستمر المتزامن مع بدء الكلام، ويؤدي صورة اجتماع الجموع بلغة عربية طبيعية.
- source_word: ἤρξατο λέγειν
  choice: بدأ يقول
  rationale: ينقل البناء الدال على ابتداء الفعل من غير أن يوحي بتكرار القول.
- source_word: γενεά
  choice: الجيل
  rationale: المقابل العربي المباشر الذي يحفظ الدلالة الزمنية والجماعية في قول يسوع.
- source_word: πονηρά
  choice: شرير
  rationale: ينقل الحكم الأخلاقي الصريح، مع إبقاء البديل «خبيث» في الحاشية.
- source_word: σημεῖον
  choice: آية
  rationale: لفظ كتابي عربي واضح يدل على علامة ذات دلالة إلهية، من غير إضافة وصف «معجزية» غير الصريح في اليونانية.
- source_word: ζητεῖ
  choice: يطلب
  rationale: يحفظ المعنى المباشر للفعل، ويترك للسياق أن يبيّن ما في الطلب من موقف سلبي.
- source_word: δοθήσεται
  choice: ستُعطى / لن تُعطى في السياق المنفي
  rationale: ينقل صيغة المستقبل المبني للمجهول بوضوح؛ وجاءت «لن» لتأدية النفي المستقبلي.
- source_word: εἰ μὴ
  choice: إلا
  rationale: تؤدي الاستثناء بعد النفي بدقة وإيجاز في العربية.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: آية يونان
  rationale: يحفظ تركيب الإضافة مفتوح الدلالة، فلا يحسم هل المقصود يونان نفسه ورسالته أم دلالة رمزية أوسع.
theological_decisions:
- issue: مدى الإدانة في عبارة «هذا الجيل»
  choice: حكم أخلاقي جماعي على جيل معاصري يسوع، من غير تلطيف
  alternative: قصر العبارة على خصوم محددين كانوا حاضرين
  rationale: تكرار «الجيل» في الأصل يقوّي الحكم الجماعي، ولا يقدّم النص ما يبرر تضييق المرجع في الترجمة.
- issue: معنى «آية يونان»
  choice: إبقاء تركيب الإضافة كما هو في المتن
  alternative: تفسيرها صراحة بأنها رسالة يونان ودعوته إلى التوبة، أو بأنها رمز إلى موت يسوع وقيامته
  rationale: السياق القريب يشرح العبارة من زاوية معينة، بينما تثير النصوص الإنجيلية الموازية صلات رمزية أخرى؛ لذلك تُحفظ سعة العبارة ولا يُفرض تفسير واحد في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ التكرار التوكيدي في «هذا الجيل جيل شرير»، واستُعملت «آية» بدل «علامة» لاتساقها مع الاستعمال الكتابي العربي الشائع من غير زيادة تفسيرية.
