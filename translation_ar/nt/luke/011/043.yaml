  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: ar
  text: ويلٌ لكم أيها الفريسيون، لأنكم تحبّون المقاعد الأولى[a] في المجامع، والتحيات في الأسواق[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مقاعد الصدارة» أو «أماكن الشرف».'
    reason: lexical_alternative
  - marker: b
    text: المقصود تحيات علنية تحمل معنى التكريم والاعتراف بالمكانة الاجتماعية.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ
  choice: ويلٌ
  rationale: يحافظ على قوة صيغة الوعيد النبوي والإدانة، من غير تلطيفها إلى مجرد تعبير عن الأسف.
- source_word: ὑμῖν τοῖς Φαρισαίοις
  choice: لكم أيها الفريسيون
  rationale: ينقل المخاطبة المباشرة بصياغة عربية فصيحة وطبيعية.
- source_word: ὅτι
  choice: لأنكم
  rationale: يبيّن بوضوح أن ما بعده هو سبب الويل.
- source_word: ἀγαπᾶτε
  choice: تحبّون
  rationale: ترجمة مباشرة تحفظ دلالة التعلّق الشديد بهذه المظاهر، من دون إضافة تفسير.
- source_word: πρωτοκαθεδρίαν
  choice: المقاعد الأولى
  rationale: يحفظ الصورة المكانية في الأصل، مع الإشارة إلى الصدارة والمكانة؛ وتوضح الحاشية دلالة الشرف.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: في المجامع
  rationale: «المجامع» تعبير عربي معروف وواضح لمواضع الاجتماع والعبادة اليهودية.
- source_word: ἀσπασμοὺς
  choice: التحيات
  rationale: ينقل المعنى الأساسي بإيجاز، بينما توضّح الحاشية البعد الاجتماعي والتكريمي المحتمل في السياق.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: في الأسواق
  rationale: صياغة طبيعية تنقل الفضاء العام الذي كانت تتم فيه اللقاءات والمعاملات الاجتماعية.
theological_decisions:
- issue: طبيعة قول الويل
  choice: وعيد نبوي موجّه إلى الفريسيين بسبب حبهم لمظاهر التكريم العلني
  alternative: مجرد نقد اجتماعي لسوء السلوك أو الآداب
  rationale: تفيد «οὐαί» إدانة أخلاقية وروحية قوية، ويذكر النص سببها صراحة، من غير أن يضيف تفاصيل عقائدية غير واردة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التوازي بين «في المجامع» و«في الأسواق»، واستُعملت «المقاعد الأولى» لصون الصورة الأصلية مع شرح دلالة الشرف في الحاشية.
