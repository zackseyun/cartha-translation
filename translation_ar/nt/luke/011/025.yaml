  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: ar
  text: وحين يأتي، يجد البيت مكنوسًا ومرتَّبًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مكنوسًا ومزيَّنًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὸν
  choice: ومتى جاء
  rationale: اسم الفاعل اليوناني في صيغة الماضي يُفهم هنا زمنيًا، وفاعله هو الروح النجس المذكور في الآية السابقة؛ وهذه الصياغة طبيعية وتحافظ على ترابط السرد.
- source_word: εὑρίσκει
  choice: وجد
  rationale: المضارع التاريخي اليوناني يمنح السرد حيوية، لكن الماضي أنسب للسرد العربي المتصل بالفعل السابق من غير فقدان المعنى.
- source_word: σεσαρωμένον
  choice: مكنوسًا
  rationale: اسم مفعول تام يدل على أن الكنس قد تم وأن البيت باقٍ في تلك الحال. «مكنوسًا» ينقل المعنى بلا إضافة «نظيفًا» غير المصرح بها.
- source_word: κεκοσμημένον
  choice: مرتَّبًا
  rationale: الفعل κοσμέω قد يدل على الترتيب أو التزيين. وفي سياق البيت، «مرتَّبًا» هو المعنى الأرجح، مع إثبات البديل الممكن في الحاشية.
theological_decisions:
- issue: المفعول المحذوف في εὑρίσκει
  choice: وجد البيت
  alternative: وجده
  rationale: المفعول غير مصرح به في هذه الجملة اليونانية، لكن «البيت» هو المرجع الواضح من الآية السابقة. إظهاره في العربية يزيل غموض الضمير من غير أن يضيف تفسيرًا عقائديًا.
- issue: دلالة κεκοσμημένον
  choice: مرتَّبًا
  alternative: مزيَّنًا
  rationale: يحافظ المتن على المعنى المنزلي السياقي الأرجح، بينما تسجل الحاشية الدلالة المعجمية البديلة ولا تحسم إمكانها بصمت.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «ومتى» لربط الجملة بما قبلها، وأُظهر «البيت» لأن الضمير المفرد المذكر في العربية قد يُفهم عائدًا إلى الروح النجس لا إلى البيت.
