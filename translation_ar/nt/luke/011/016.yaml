  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: ar
  text: وأما آخرون، فكانوا، وهم يختبرونه، يطلبون منه آية من السماء[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «آية سماوية».'
    reason: بديل معجمي وتركيبي لعبارة ἐξ οὐρανοῦ، مع بقاء «من السماء» أدق في إظهار دلالة المنشأ.
lexical_decisions:
- source_word: ἕτεροι
  choice: آخرون
  rationale: تدل الكلمة على جماعة أخرى في مقابل المتكلمين السابقين، و«آخرون» هي الصياغة العربية الطبيعية المباشرة.
- source_word: δὲ
  choice: الواو
  rationale: تؤدي الواو هنا وظيفة الانتقال مع تباين خفيف في السياق، من غير أن تبالغ في جعل العلاقة استدراكية صريحة.
- source_word: πειράζοντες
  choice: وهم يختبرونه
  rationale: تنقل معنى إخضاع يسوع للاختبار، مع إبقاء سوء القصد مفهومًا من السياق دون حصر اللفظ في معنى الإغراء بالخطيئة.
- source_word: σημεῖον
  choice: آية
  rationale: «آية» تقابل معنى العلامة الدالة، وتلائم السياق المعجزي دون إضافة وصف تفسيري غير موجود في اليونانية.
- source_word: ἐξ οὐρανοῦ
  choice: من السماء
  rationale: تحافظ العبارة على دلالة المصدر أو المنشأ السماوي كما في الأصل.
- source_word: ἐζήτουν
  choice: كانوا يطلبون
  rationale: ينقل تركيب «كانوا يطلبون» دلالة الماضي الناقص على الفعل المستمر أو المتكرر، بصياغة عربية واضحة.
- source_word: παρ’ αὐτοῦ
  choice: منه
  rationale: تفيد العبارة أن المطلوب كان صادرًا من يسوع، و«منه» تحافظ بوضوح على معنى المصدر.
theological_decisions:
- issue: طبيعة الآية المطلوبة
  choice: آية من السماء
  alternative: آية سماوية
  rationale: تحافظ «من السماء» على احتمال دلالة المنشأ أو المصادقة السماوية، دون تحديد طبيعة الآية بما يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت الجملة الحالية «وهم يختبرونه» لتمثيل اسم الفاعل اليوناني بوصفه فعلًا مصاحبًا، وتُركت دلالة العداء للسياق.
