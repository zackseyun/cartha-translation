reference: Luke 11:46
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: ar
  text: 'فقال: «ويلٌ لكم أنتم أيضًا، يا علماء الشريعة[a]! لأنكم تحمِّلون الناس أحمالًا عسيرة الحمل، وأنتم أنفسكم لا تمسّون تلك الأحمال بإصبع واحد من أصابعكم[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي المتخصصون في الشريعة اليهودية.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تُفهم العبارة بمعنى: «لا تمدّون إصبعًا إلى تلك الأحمال». وهي تشدد على أنهم لا يبذلون حتى أدنى جهد إزاء ما يفرضونه على غيرهم.'
    reason: idiom_explanation
lexical_decisions:
- source_word: νομικοῖς
  choice: علماء الشريعة
  rationale: يدل اللفظ في سياق لوقا على المتخصصين في الشريعة اليهودية، لا على المحامين بالمعنى المدني الحديث. وهذه الصياغة واضحة وطبيعية وتحافظ على المرجع الديني القانوني.
- source_word: οὐαί
  choice: ويلٌ
  rationale: تحافظ على قوة الإعلان النبوي بالدينونة، ولا تخففها إلى مجرد التحسر.
- source_word: φορτίζετε
  choice: تحمِّلون
  rationale: تنقل الفعل السببي وصورة وضع الأحمال على الناس، كما تنسجم مع تكرار لفظ الأحمال.
- source_word: ἀνθρώπους
  choice: الناس
  rationale: اللفظ اليوناني عام هنا ويشمل البشر دون تخصيص الذكور.
- source_word: φορτία δυσβάστακτα
  choice: أحمالًا عسيرة الحمل
  rationale: تحافظ على استعارة الحمل وعلى معنى الصعوبة، من غير المبالغة بجعلها مستحيلة الاحتمال.
- source_word: αὐτοὶ
  choice: أنتم أنفسكم
  rationale: تبرز الضمير المؤكد والمقابلة بين من يفرضون الأحمال ومن يحملونها.
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: بإصبع واحد من أصابعكم
  rationale: تحافظ على التركيب التبعي والصورة التي تؤكد انعدام أدنى مشاركة.
- source_word: προσψαύετε
  choice: لا تمسّون
  rationale: تنقل المعنى المباشر للفعل، أي اللمس أو الاتصال، من غير تحويل المعنى الضمني إلى شرح داخل المتن.
- source_word: Καὶ ὑμῖν
  choice: لكم أنتم أيضًا
  rationale: تحفظ قوة الإضافة، إذ يمتد الويل إلى هذه الفئة أيضًا.
theological_decisions:
- issue: هوية νομικοῖς
  choice: علماء الشريعة، أي المتخصصون في الشريعة اليهودية
  alternative: الناموسيون؛ المحامون؛ الكتبة
  rationale: «المحامون» يوحي بالمهنة القانونية الحديثة، و«الكتبة» ليس مطابقًا بالضرورة لهذا المصطلح، أما «علماء الشريعة» فيوضح المقصود من غير إدخال هوية أضيق من النص.
- issue: دلالة العبارة الختامية
  choice: 'الإبقاء على الصورة الحسية: لا تمسّون الأحمال بإصبع واحد'
  alternative: لا تساعدونهم في حملها إطلاقًا؛ لا تحركون ساكنًا لمساعدتهم
  rationale: النص يصرح بعدم لمس الأحمال ويُفهم منه الامتناع عن أدنى مساعدة. إبقاء الصورة يحفظ قوة الاتهام وغموض مدى الإشارة إلى عدم المساعدة أو عدم المشاركة في الالتزام.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم «علماء الشريعة» بدل «الناموسيين» لسهولة الفهم، مع الحفاظ على استعارة الأحمال واللمس كما في اليونانية. وُضعت علامتا الحاشية عند اللفظ والعبارة اللذين تشرحهما كل حاشية.
