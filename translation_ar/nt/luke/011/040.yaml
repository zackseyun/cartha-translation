  text: يا عديمي الفهم! أما الذي صنع الظاهر صنع الباطن أيضًا؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الخارجَ ... الداخلَ». يمكن أن تشير العبارة في سياقها المباشر إلى خارج الإناء وداخله، وبالامتداد إلى ظاهر حياة الإنسان وباطنها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: يا عديمي الفهم
  rationale: صفة جمع في النداء مستعملة استعمال الاسم، وتحمل توبيخًا مباشرًا حادًّا. هذه الصياغة عربية فصيحة واضحة وتحفظ معنى انعدام التعقل دون إدخال وصف أخلاقي أوسع من اللفظ.
- source_word: οὐχ ... ἐποίησεν;
  choice: أما صنع ...؟
  rationale: سؤال منفي يتوقع جوابًا بالإيجاب؛ وصيغة «أما ...؟» تنقل قوة السؤال البلاغي طبيعيًا في العربية، مع ترجمة الماضي اليوناني بالماضي.
- source_word: ὁ ποιήσας
  choice: الذي صنع
  rationale: اسم فاعل ماضٍ مع أداة التعريف يؤدي وظيفة اسمية. تحفظ الصياغة الإشارة الشخصية الضمنية من غير إضافة «الله» التي لا يصرح بها النص.
- source_word: τὸ ἔξωθεν
  choice: الظاهر
  rationale: يدل على الجانب الخارجي، ويمكن أن يشير في السياق إلى خارج الإناء، وبالامتداد إلى الحياة الظاهرة. «الظاهر» موجز ويحفظ هذا الاتساع.
- source_word: τὸ ἔσωθεν
  choice: الباطن
  rationale: يقابل «الظاهر» ويدل على الجانب الداخلي، بما يسمح بالإشارة إلى داخل الإناء وإلى باطن الإنسان معًا.
- source_word: καὶ
  choice: أيضًا
  rationale: 'تبرز معنى الإضافة في الحجة: من صنع الظاهر صنع الباطن كذلك.'
theological_decisions:
- issue: مرجع «الذي صنع»
  choice: الإبقاء على الإشارة الضمنية إلى الله الخالق من غير التصريح باسمه
  alternative: قصر العبارة على صانع الإناء في الصورة المباشرة
  rationale: تعمل العبارة ضمن صورة الكأس والقصعة، وتحمل في الوقت نفسه دلالة أوسع على الخالق الذي صنع الظاهر والباطن. إبقاء التعبير عامًا يحفظ المستويين ولا يحسم ما تركه اليوناني ضمنيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم التقابل «الظاهر/الباطن» لحفظ الإيجاز والتطبيق المزدوج، مع بيان البديل الحسي المباشر في الحاشية.
