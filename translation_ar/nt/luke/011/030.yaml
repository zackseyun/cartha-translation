source:
  edition: SBLGNT
  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: ar
  text: فكما صار يونان آيةً لأهل نينوى، كذلك سيكون ابن الإنسان أيضًا آيةً لهذا الجيل.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «كذلك سيكون ابن الإنسان أيضًا لهذا الجيل»؛ أما معنى «سيكون آيةً لهذا الجيل» فمفهوم من المقابلة مع يونان.'
    reason: بيان الخبر المفهوم الذي لم يُكرَّر لفظه في اليونانية
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: فكما
  rationale: تنقل الفاء الصلة التفسيرية التي تؤديها γάρ، وتنقل «كما» المقارنة التي تؤديها καθώς، بصياغة عربية طبيعية موجزة.
- source_word: ἐγένετο
  choice: صار
  rationale: تحفظ معنى الانتقال إلى حال أو وظيفة، أي إن يونان صار يؤدي دور الآية، ولا تكتفي بالمعنى الساكن «كان».
- source_word: Ἰωνᾶς
  choice: يونان
  rationale: الصيغة العربية الكتابية المألوفة للاسم.
- source_word: τοῖς Νινευίταις
  choice: لأهل نينوى
  rationale: تعبير عربي واضح وطبيعي يدل على سكان نينوى، وتحفظ اللام علاقة الآية بهم.
- source_word: σημεῖον
  choice: آية
  rationale: «آية» هي المقابل العربي المألوف لعلامة ذات دلالة إعلانية أو إلهية في هذا السياق.
- source_word: οὕτως ... καὶ
  choice: كذلك ... أيضًا
  rationale: تحفظ الصياغة ترابط المقارنة والقوة الإضافية لأداة καί.
- source_word: ἔσται
  choice: سيكون
  rationale: تنقل مستقبل فعل الكينونة مباشرة؛ وأُعيد الخبر المفهوم من الشطر الأول لتوضيح المقابلة.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: تحفظ اللقب الإنجيلي التقليدي ودلالاته المتعددة من غير تفسيره أو تسطيحه.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: لهذا الجيل
  rationale: تحفظ اللام علاقة المرجع وتحافظ كلمة «الجيل» على الدلالة الزمنية والنبوية للفظ اليوناني.
theological_decisions:
- issue: الخبر المحذوف في الشطر الثاني
  choice: إثبات «آيةً» بوصفها خبرًا مفهومًا من المقابلة
  alternative: «كذلك سيكون ابن الإنسان أيضًا لهذا الجيل» من غير ذكر «آية»
  rationale: لا يكرر اليوناني كلمة σημεῖον في الشطر الثاني، لكن التوازي مع يونان يجعلها مفهومة بوضوح. إثباتها يجعل العربية سليمة واضحة، مع بيان الحذف الأصلي في الحاشية صونًا لبنية النص وتوتره.
- issue: دلالة لقب «ابن الإنسان»
  choice: الإبقاء على «ابن الإنسان»
  alternative: تفسيره بعبارة مثل «الإنسان» أو «الشخص البشري»
  rationale: العبارة لقب ذو أصداء كتابية ومسيانية وأخروية، والإبقاء عليها يحفظ هذه الدلالات من غير حصرها في تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُعمل «أهل نينوى» بدل النسبة الأقل تداولًا «النينويين»، وحُفظ اللقب التقليدي «ابن الإنسان». وُضعت علامة الحاشية بعد الجملة التي أُثبت فيها الخبر المفهوم.
