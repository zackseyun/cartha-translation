translation:
  language: ar
  text: أَعْطِنا كلَّ يومٍ خبزَنا اليوميَّ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خبزَنا لليوم الآتي»، أو «الخبزَ الذي نحتاج إليه»، أو، وهو أقل احتمالًا هنا، «الخبزَ الفائقَ الجوهر». الصفة اليونانية نادرة، ومعناها محل خلاف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: خبزَنا
  rationale: الاسم يعني حرفيًا «خبزًا»، ويمكن أن يدل في سياق الصلاة على القوت الأساسي. تحافظ الصياغة على الصورة المحسوسة والمألوفة دون توسيعها في المتن إلى «طعام».
- source_word: ἡμῶν
  choice: ـنا
  rationale: ضمير ملكية يعود إلى جماعة المتكلمين، وأُلحق طبيعيًا بكلمة «خبز» في العربية.
- source_word: ἐπιούσιον
  choice: اليوميَّ
  rationale: هذه الصفة اليونانية نادرة ومختلف في معناها. تؤيد عبارة τὸ καθ’ ἡμέραν في لوقا معنى العطاء اليومي المنتظم، مع إبقاء الاحتمالات المعجمية الأخرى في الحاشية.
- source_word: δίδου
  choice: أَعْطِ
  rationale: فعل أمر مضارع في اليونانية قد يحمل معنى الاستمرار أو التكرار؛ ويؤدي الأمر العربي «أعطِ» المعنى طبيعيًا، بينما تُظهر عبارة «كل يوم» جانب التكرار.
- source_word: ἡμῖν
  choice: ـنا
  rationale: ضمير المتكلمين مفعول به أول في التركيب العربي «أعطنا».
- source_word: τὸ καθ’ ἡμέραν
  choice: كلَّ يومٍ
  rationale: تدل العبارة صراحة على العطاء المتكرر يومًا بعد يوم، و«كل يوم» عربية واضحة وطبيعية تحفظ تشديد لوقا على الاعتماد المستمر.
theological_decisions:
- issue: معنى ἐπιούσιον في الصلاة الربانية
  choice: اليومي
  alternative: لليوم الآتي؛ الذي نحتاج إليه؛ الفائق الجوهر
  rationale: مع أن معنى الصفة موضع خلاف معجمي، فإن إضافة لوقا «كل يوم» ترجح في المتن معنى القوت اليومي المعتاد. وتُحفظ الاحتمالات الأخرى في الحاشية من غير فرض قراءة أسرارية أو ميتافيزيقية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم التعبير المألوف «خبزنا اليومي» مع «كل يوم» للمحافظة على عنصري ἐπιούσιον وτὸ καθ’ ἡμέραν، وإن نشأ عن ذلك تكرار دلالي مقصود موجود في بنية النص.
