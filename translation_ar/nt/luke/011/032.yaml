  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: ar
  text: سيقوم رجال نينوى في الدينونة مع هذا الجيل ويدينونه، لأنهم تابوا استجابةً لمناداة يونان، وها هنا ما هو أعظم من يونان[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هنا من هو أعظم من يونان»، أو: «هنا أكثر من يونان». استعمل اليوناني صيغة محايدة بمعنى «أعظم/أكثر»، وقد تشير على نحو واسع إلى الواقع الأعظم الحاضر في يسوع وخدمته، لا إلى مقارنة بين شخصين فقط.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: رجال نينوى
  rationale: يحفظ الدلالة المذكرة الصريحة لكلمة ἄνδρες، مع صياغة عربية طبيعية واضحة.
- source_word: ἀναστήσονται
  choice: سيقوم
  rationale: ينقل معنى النهوض في مشهد الدينونة الأخروية دون التصريح بأكثر مما يقوله الفعل، مع بقاء دلالة القيامة مفهومة من السياق.
- source_word: ἐν τῇ κρίσει
  choice: في الدينونة
  rationale: ترجمة مباشرة تحفظ معنى الحدث القضائي النهائي وصيغة حرف الجر اليونانية.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: مع هذا الجيل
  rationale: يحفظ معنى المصاحبة في μετά مع المضاف إليه، والتعبير الإنجيلي «هذا الجيل».
- source_word: κατακρινοῦσιν αὐτήν
  choice: ويدينونه
  rationale: الفعل يعني إصدار حكم بالإدانة لا مجرد المحاكمة؛ والضمير يعود إلى «هذا الجيل» وهو مذكر في العربية.
- source_word: μετενόησαν
  choice: تابوا
  rationale: ينقل معنى التوبة الأخلاقية والروحية في السياق النبوي، لا مجرد تغيير الرأي.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: استجابةً لمناداة يونان
  rationale: يوضح أن توبتهم حدثت استجابةً للبلاغ الذي نادى به يونان، وهو معنى εἰς في هذا التركيب؛ و«مناداة» تلائم κήρυγμα في سياق إعلان نبوي.
- source_word: ἰδοὺ
  choice: وها إن
  rationale: أداة تنبيه عربية فصيحة ذات قوة خطابية تناسب ἰδού وتحافظ على النبرة المهيبة.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: هنا ما هو أعظم من يونان
  rationale: تحفظ الصيغة المحايدة πλεῖον بواسطة «ما هو أعظم»، فلا تحصر المقارنة في شخص وحده، مع بقاء يسوع وخدمته في بؤرة السياق.
theological_decisions:
- issue: مرجع ودلالة πλεῖον Ἰωνᾶ
  choice: هنا ما هو أعظم من يونان
  alternative: هنا من هو أعظم من يونان؛ هنا أكثر من يونان
  rationale: 'تعبير «ما هو أعظم» يصون الحياد النحوي في πλεῖον والتوتر الدلالي في النص: يسوع هو المقصود في السياق، لكن العبارة قد تشمل أيضًا الواقع الأعظم الحاضر في شخصه وخدمته، بدل حصرها سلفًا في مقارنة شخصية فقط.'
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «الدينونة» للمشهد القضائي الأخروي، و«تابوا» للدلالة الروحية المألوفة، وصيغت خاتمة الآية بما يحفظ حياد العبارة اليونانية. وُضع مؤشر الحاشية بعد العبارة التي تفسرها مباشرة.
