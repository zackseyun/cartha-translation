    issue: صياغة «طلب إليه فريسي أن...» أقل سلاسة في الفصحى الحديثة من «طلب منه فريسي أن...».
    rationale: كلا التعبيرين صحيح، غير أن «طلب من فلان أن يفعل» هو الاستعمال المعاصر الأوضح والأكثر مباشرة لنقل ἐρωτᾷ ... ὅπως ἀριστήσῃ.
