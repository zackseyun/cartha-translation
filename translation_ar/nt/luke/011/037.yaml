base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: ar
  text: وبينما كان يتكلم، طلب منه فريسي أن يتناول الطعام معه؛ فدخل واتكأ إلى المائدة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي اتخذ وضع الاتكاء المعتاد عند تناول الطعام في المآدب آنذاك.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: وبينما كان يتكلم
  rationale: ينقل تركيب ἐν مع المصدر المحلّى بأداة التعريف بوصفه دالًّا على التزامن، بصياغة عربية طبيعية تحافظ على معنى الاستمرار.
- source_word: ἐρωτᾷ
  choice: طلب إليه
  rationale: يحافظ على المعنى الأساسي للفعل، وهو السؤال أو الطلب، من غير أن يضمّن فيه معنى «دعاه» صراحة؛ وتبيّن جملة الغرض أن الطلب كان دعوة إلى الطعام. صيغ الماضي أنسب للسرد العربي من محاكاة المضارع التاريخي اليوناني حرفيًا.
- source_word: Φαρισαῖος
  choice: فريسي
  rationale: المقابل العربي المألوف لاسم الجماعة، وتفيد نكرته أنه واحد من الفريسيين.
- source_word: ὅπως ἀριστήσῃ
  choice: أن يتناول الطعام
  rationale: يتجنب التحديد الزائد لوقت الوجبة؛ فالفعل قد يدل على وجبة صباحية أو نهارية، بينما السياق لا يقتضي الجزم بموعدها.
- source_word: παρ’ αὐτῷ
  choice: معه
  rationale: ينقل العبارة اليونانية بدقة من غير التصريح بأن المكان كان بيته، إذ إن ذلك مفهوم محتمل من السياق لا مذكور صراحة.
- source_word: εἰσελθὼν
  choice: فدخل
  rationale: يعبّر بوضوح عن الحدث السابق للفعل الرئيس، في تسلسل سردي عربي طبيعي.
- source_word: ἀνέπεσεν
  choice: واتكأ إلى المائدة
  rationale: يحافظ على هيئة تناول الطعام الشائعة في المآدب القديمة، بدل تسويتها إلى مجرد الجلوس، مع إضافة «إلى المائدة» لإيضاح السياق.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ورصينة. استُخدم الماضي في السرد لأن محاكاة المضارع التاريخي اليوناني بالمضارع العربي تبدو متكلفة، مع بقاء تسلسل الحدث ومعناه. وُضع مؤشر الحاشية بعد العبارة التي يشرحها مباشرة.
