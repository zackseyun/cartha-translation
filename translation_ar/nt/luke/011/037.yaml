  verdict: revise
  source_fidelity: 'الترجمة تنقل عناصر النص اليوناني بدقة: الظرف الزمني المتزامن، طلب الفريسي، تناول الطعام معه دون افتراض أن المكان بيته، ثم الدخول والاتكاء لتناول الطعام. ويُحافظ «اتكأ» على دلالة ἀνέπεσεν الخاصة بهيئة المائدة القديمة.'
  naturalness: «طلب إليه» مفهومة وفصيحة، لكن «طلب منه» أشيع وأوضح في العربية الفصحى المعاصرة مع هذا التركيب، ولا يغيّر المعنى. وبقية الصياغة طبيعية ورصينة.
  terminology: «فريسي» هو المقابل العربي المألوف. و«يتناول الطعام» مناسب لأنه لا يقيّد ἀριστήσῃ بوجبة إفطار أو بوقت محدد. و«اتكأ إلى المائدة» مناسب في السياق التاريخي، وتشرح الحاشية الهيئة المقصودة.
  issues:
