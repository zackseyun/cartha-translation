  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: ar
  text: واغفر لنا خطايانا، لأننا نحن أيضًا نغفر لكلِّ مَن هو مَدينٌ لنا[a]. ولا تُدخِلنا في تجربة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكلِّ مَن عليه دَينٌ لنا». تستخدم اليونانية هنا لغة الدَّين، مع أن العبارة الأولى تقول «خطايانا».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تعني أيضًا: «اختبار» أو «ابتلاء».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: اغفر
  rationale: فعل أمر في سياق صلاة موجَّهة إلى الله، و«اغفر» هو المقابل العربي الطبيعي الذي يحفظ معنى الصفح دون جمود لفظي.
- source_word: τὰς ἁμαρτίας
  choice: خطايانا
  rationale: النص اليوناني يذكر الخطايا صراحةً في هذه العبارة، لا الديون. و«خطايانا» عربية واضحة ومألوفة وتحفظ المعنى الأخلاقي والديني.
- source_word: καὶ γὰρ
  choice: لأننا ... أيضًا
  rationale: تُبيّن العبارة أساس الطلب السابق، وتنقل «لأن» العلاقة التعليلية، فيما تعبّر «أيضًا» عن العنصر الإضافي في التركيب.
- source_word: αὐτοὶ
  choice: نحن
  rationale: إظهار الضمير المنفصل مع الضمير المتصل في «لأننا نحن» يحفظ التوكيد الموجود في اليونانية من غير تكلّف.
- source_word: ἀφίομεν
  choice: نغفر
  rationale: يحافظ هذا الاختيار على الصلة اللفظية مع «اغفر» ويلائم سياق المعاملة الشخصية، من غير حصر الصورة في إلغاء دين مالي.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: لكلِّ مَن هو مَدينٌ لنا
  rationale: يحفظ لغة الدَّين في اليونانية، مع إبقاء التمييز بينها وبين «خطايانا» في العبارة الأولى، وهو تعبير مفهوم في العربية المعاصرة.
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: ولا تُدخِلنا في تجربة
  rationale: «تُدخِلنا» أقرب إلى دلالة εἰσφέρω من الصياغة التقليدية «تقُدنا»، أما «تجربة» فتحفظ إمكان معنى الإغراء أو الاختبار مع بيان البدائل في الحاشية.
- source_word: πειρασμόν
  choice: تجربة
  rationale: للكلمة اليونانية مجال دلالي يشمل التجربة والاختبار والابتلاء. و«تجربة» تحفظ قدرًا من هذا الاتساع في المتن، مع توضيح البدائل في الحاشية.
theological_decisions:
- issue: دلالة الطلب الأخير المتعلق بـ πειρασμός وعلاقة الله بالتجربة
  choice: ولا تُدخِلنا في تجربة
  alternative: 'ولا تُدخِلنا في اختبار؛ أو: ولا تَقُدنا إلى تجربة'
  rationale: تُحفظ صيغة الطلب كما وردت، من غير تلطيفها أو إضافة تفسير عقائدي يحسم كيفية علاقة الله بالتجربة. وتُذكر السعة المعجمية للكلمة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ توكيد الضمير في «لأننا نحن أيضًا»، والتمييز المقصود بين «الخطايا» وكون الشخص «مَدينًا»، كما حُفظ التوتر الدلالي واللاهوتي في الطلب الأخير دون تفسير زائد.
