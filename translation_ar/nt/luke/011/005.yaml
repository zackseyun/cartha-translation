  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: ar
  text: 'وقال لهم: «مَن منكم يكون له صديق، فيذهب إليه عند منتصف الليل ويقول له: يا صديقي، أعرني ثلاثة أرغفة،»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: مَن منكم
  rationale: صياغة عربية طبيعية لسؤال بلاغي موجَّه إلى السامعين، وتحافظ على التحدي المباشر.
- source_word: ἕξει
  choice: يكون له
  rationale: تحافظ على دلالة فعل الملك أو العلاقة، وتنسجم مع البنية الافتراضية للسؤال البلاغي؛ أما زمن المستقبل اليوناني فلا يلزم إبرازه بأداة «سـ» في العربية.
- source_word: φίλον / Φίλε
  choice: صديق / يا صديقي
  rationale: يحافظ على تكرار اللفظ اليوناني، مع استعمال النداء العربي الطبيعي في الموضع الثاني.
- source_word: πορεύσεται πρὸς αὐτόν
  choice: فيذهب إليه
  rationale: نقل مباشر وطبيعي لفعل الحركة دون إضافة معنى غير موجود في الأصل.
- source_word: μεσονυκτίου
  choice: عند منتصف الليل
  rationale: يؤدي الاستعمال الزمني للمضاف إليه اليوناني بعبارة عربية واضحة ودقيقة.
- source_word: εἴπῃ αὐτῷ
  choice: ويقول له
  rationale: يحافظ على معنى فعل القول وعلى تتابع الأفعال في السؤال البلاغي.
- source_word: χρῆσόν μοι
  choice: أعرني
  rationale: أمر يطلب إعطاء شيء على سبيل العارية أو القرض، وهو الأنسب لسياق طلب الخبز من صديق.
- source_word: τρεῖς ἄρτους
  choice: ثلاثة أرغفة
  rationale: «أرغفة» المقابل العربي المألوف لأرغفة الخبز المعدودة، ولا حاجة إلى إضافة «خبز».
theological_decisions: []
