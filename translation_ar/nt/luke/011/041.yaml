  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: ar
  text: بل أعطوا ما في الداخل صدقةً[a]، وها إن كلَّ شيءٍ طاهرٌ لكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أعطوا ما عندكم صدقةً». يمكن أن تشير العبارة اليونانية إما إلى ما في الداخل وإما إلى ما لدى الإنسان من ممتلكات.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: بل
  rationale: تفيد تصحيحًا ومقابلةً لما سبق من الاهتمام بتطهير الظاهر، و«بل» عربية موجزة وطبيعية تحافظ على هذه القوة.
- source_word: τὰ ἐνόντα
  choice: ما في داخلكم
  rationale: العبارة حرفيًا «الأشياء التي في الداخل». وفي سياق المقابلة بين خارج الكأس وداخلها، تحافظ هذه الصياغة على الإشارة إلى الباطن، مع إبقاء احتمال معنى الممتلكات في الحاشية.
- source_word: δότε
  choice: أعطوا
  rationale: صيغة أمر تدعو إلى فعل حاسم، و«أعطوا» تنقل المعنى من غير تحميل الصيغة الزمنية أكثر مما تحتمل.
- source_word: ἐλεημοσύνην
  choice: صدقةً
  rationale: يدل الاسم على العطاء الإحساني، ولا سيما الصدقة. واستعمال «صدقةً» بوصفها حالًا أو مفعولًا دلاليًا يجعل التركيب عربيًا واضحًا من دون إضافة مستفيد غير مذكور صراحة.
- source_word: ἰδοὺ
  choice: ها إن
  rationale: أداة تنبيه وتوكيد للنتيجة؛ و«ها إن» تحافظ على القوة الخطابية بلغة عربية فصيحة مفهومة.
- source_word: πάντα
  choice: كلَّ شيءٍ
  rationale: ينقل شمول صيغة الجمع المحايد بأسلوب عربي طبيعي.
- source_word: καθαρὰ
  choice: طاهرٌ
  rationale: يحافظ على صلة اللفظ بسياق الطهارة والتنظيف في الآيات السابقة، و«طاهر» أنسب هنا من لفظ يقتصر على النظافة المادية.
- source_word: ὑμῖν
  choice: لكم
  rationale: 'ينقل دلالة الإضافة أو المرجع: كل شيء طاهر بالنسبة إليهم أو لأجلهم، وهي صياغة عربية موجزة.'
theological_decisions:
- issue: دلالة τὰ ἐνόντα وعلاقتها بالطهارة والصدقة
  choice: «ما في داخلكم»، في إشارة إلى الباطن
  alternative: «ما عندكم»، في إشارة إلى الممتلكات المتاحة
  rationale: السياق القريب يقابل بين خارج الكأس وداخلها (لوقا 11:39)، ولذلك تحافظ قراءة الباطن على القوة البلاغية والأخلاقية للتوبيخ. لكن العبارة اليونانية تحتمل أيضًا الإشارة إلى ما يملكه الإنسان أو ما هو في حوزته، فذُكر هذا الاحتمال في الحاشية بدل حسمه نهائيًا.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة كريمة. اختيرت «بل» للمقابلة التصحيحية، و«ها إن» للاحتفاظ بالتنبيه الخطابي، مع تجنب ألفاظ طائفية أو تفسيرية زائدة. أُثبتت علامة الحاشية [a] في المتن.
