  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: ar
  text: 'مِن دم هابيل إلى دم زكريا[b]، الذي هلك بين المذبح والبيت[a]. نعم، أقول لكم: سيُطالَب به من هذا الجيل.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بين المذبح والهيكل»؛ واليونانية حرفيًا: «بين المذبح والبيت».'
    reason: lexical_alternative
  - marker: b
    text: 'اختلف في تحديد زكريا المذكور هنا؛ ومن الاحتمالات زكريا بن يهوياداع (أخبار الأيام الثاني 24: 20–22)، أو زكريا بن برخيا.'
    reason: cross_reference
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ
  choice: مِن دم هابيل
  rationale: يحافظ على حرف الجر وصيغة الإضافة، وعلى الدلالة الكتابية للدم بوصفه دمًا مسفوكًا يستوجب الحساب.
- source_word: ἕως αἵματος Ζαχαρίου
  choice: إلى دم زكريا
  rationale: يقابل افتتاح العبارة «مِن دم هابيل» ويحفظ المدى البلاغي من أول المذكورين إلى آخرهما.
- source_word: τοῦ ἀπολομένου
  choice: الذي هلك
  rationale: ينقل معنى اسم الفاعل من ἀπόλλυμι من غير التصريح بفاعل القتل، مع بقاء دلالة الموت العنيف مفهومة من السياق.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: بين المذبح والبيت
  rationale: يحفظ المعنى الحرفي لـ οἶκος، بينما يوضح الهامش أن المقصود في السياق بيت الله، أي الهيكل.
- source_word: ναί
  choice: نعم
  rationale: ينقل التوكيد الصريح بعبارة عربية طبيعية ومباشرة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة قريبة وطبيعية للصيغة اليونانية، وتحافظ على نبرة التصريح المهيب.
- source_word: ἐκζητηθήσεται
  choice: سيُطالَب به
  rationale: يحفظ صيغة المبني للمجهول والمعنى القضائي المتعلق بالمحاسبة على الدم، من غير إضافة فاعل غير مصرّح به.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: من هذا الجيل
  rationale: يحفظ حرف الجر ἀπό ويُبقي «هذا الجيل» على مرجعه الخطابي المباشر دون توسيع عقائدي.
theological_decisions:
- issue: هوية زكريا ومدى الإدانة الموجهة إلى «هذا الجيل»
  choice: تُترك هوية زكريا بلا تحديد في المتن، وتُترجم «هذا الجيل» كما وردت بوصفها الجيل الذي يخاطبه يسوع.
  alternative: قد يكون المقصود زكريا بن يهوياداع، أو زكريا بن برخيا، أو شهيدًا نبويًا تمثيليًا.
  rationale: النص اليوناني يذكر زكريا بلا تعريف إضافي، فلا ينبغي للترجمة أن تحسم خلافًا تاريخيًا. كما أن إبقاء «هذا الجيل» دون توسيع أو تضييق يحفظ التوتر القضائي واللاهوتي في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، قريبة من بنية الأصل من غير تكلّف. وُضع [a] بعد «زكريا» لارتباطه بعبارة موته ومكانه، ووُضع [b] في نهاية الآية لأنه يشرح هوية زكريا المختلف فيها.
