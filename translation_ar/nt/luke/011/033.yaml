id: LUK.11.33
reference: Luke 11:33
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: ar
  text: لا أحد يوقد مصباحًا ثم يضعه في موضع خفي[a] أو تحت وعاءٍ للكيل[b]، بل يضعه على حاملٍ للمصباح، لكي يرى الداخلون النور.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «في قبو» أو «في موضع مستور»؛ فاللفظة اليونانية κρύπτη قد تدل على مكان خفي، ومنه موضع تخزين تحت الأرض.'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية μόδιος: مكيال للحبوب، ويُقصد بها أيضًا الوعاء المستخدم لهذا الكيل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: لا أحد
  rationale: مقابل عربي طبيعي لضمير النفي العام، ويحفظ شمول النفي.
- source_word: λύχνον
  choice: مصباحًا
  rationale: يشير اللفظ إلى مصباح زيتي محمول، و«مصباح» هو المقابل العربي الواضح دون تخصيصه بشمعة.
- source_word: ἅψας
  choice: يوقد ... ثم
  rationale: اسم الفاعل اليوناني في صيغة الماضي يدل على فعل سابق للفعل الرئيس؛ وصياغة «يوقد ... ثم يضعه» تنقل تتابع الفعلين بوضوح وطبيعية.
- source_word: εἰς κρύπτην
  choice: في موضع خفي
  rationale: يحفظ المعنى العام للمكان المستور دون حصره في قبو أو مخزن تحت الأرض.
- source_word: τίθησιν
  choice: يضعه
  rationale: ينقل فعل الوضع بصياغة عربية بسيطة ومباشرة، مع ضمير يعود إلى المصباح.
- source_word: ὑπὸ τὸν μόδιον
  choice: تحت وعاءٍ للكيل
  rationale: الموديوس مكيال للحبوب، ويُطلق أيضًا على الوعاء المستعمل في الكيل؛ وهذه العبارة توضّح الشيء المقصود للقارئ الحديث.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: على حاملٍ للمصباح
  rationale: اللفظ يعني ما يوضع عليه المصباح؛ و«حامل المصباح» أوضح من «منارة» التي قد تحمل معاني حديثة أخرى.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغرض التي تقدمها الأداة اليونانية.
- source_word: οἱ εἰσπορευόμενοι
  choice: الداخلون
  rationale: ينقل اسم الفاعل المستعمل اسميًا بإيجاز عربي طبيعي.
- source_word: τὸ φέγγος
  choice: النور
  rationale: يدل اللفظ على الضوء أو السطوع، و«النور» ملائم للصورة الحسية للمصباح.
- source_word: βλέπωσιν
  choice: يرى
  rationale: المضارع المنصوب بعد أداة الغرض يُنقل طبيعيًا بالفعل المضارع بعد «لكي».
theological_decisions:
- issue: تحديد معنى κρύπτη
  choice: موضع خفي
  alternative: قبو أو مخزن سري
  rationale: محور المثل هو إخفاء النور، لا تحديد نوع الموضع المعماري؛ لذلك تُحفظ سعة اللفظ في المتن، مع بيان الاحتمال الأخص في الحاشية.
- issue: تصوير μόδιος
  choice: وعاء للكيل
  alternative: مكيال أو وعاء بسعة موديوس
  rationale: يحفظ هذا التعبير كون الشيء إناء قياس يمكن أن يُغطّى به المصباح، من غير استبداله بوحدة قياس عربية أو حديثة غير مطابقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدمت «حامل للمصباح» بدل «منارة» تجنبًا لدلالات «المنارة» الحديثة، ووُضعت علامتا الحاشيتين مباشرة بعد اللفظين اللذين تشرحانهما.
