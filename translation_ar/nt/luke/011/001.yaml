source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: ar
  text: 'وبينما كان يصلّي في مكان ما، ولما توقّف، قال له أحد تلاميذه: «يا رب، علّمنا أن نصلّي، كما علّم يوحنا أيضًا تلاميذه».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: وحدث
  rationale: صيغة سردية طبيعية في العربية المعاصرة، تحافظ على وظيفة العبارة في تقديم الحدث من غير استعمال تعبير عتيق مثل «وكان لما».
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: أنه كان يصلّي
  rationale: تنقل الظرفية المتزامنة والاستمرار الدال عليهما التركيب اليوناني واسم الفاعل، بصياغة عربية واضحة.
- source_word: ἐν τόπῳ τινὶ
  choice: في موضع ما
  rationale: تحافظ على عدم تعيين المكان في الأصل، وهي أفصح وأيسر من «في موضع معيّن» التي قد توحي بأن المكان معروف.
- source_word: ὡς ἐπαύσατο
  choice: فلما توقّف
  rationale: ينقل معنى الكفّ أو التوقف مباشرة، من غير تفسيره بلفظ «فرغ» أو «انتهى»؛ والسياق يبيّن أن المقصود توقفه عن الصلاة.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: واحد من تلاميذه
  rationale: الصياغة العربية الطبيعية للبناء التبعيضي، مع إبقاء التلميذ غير معيّن.
- source_word: Κύριε
  choice: يا رب
  rationale: يحافظ على المقابل المعتاد للقب κύριος وعلى دلالته المفتوحة بين نداء الاحترام واللقب ذي الأهمية الأوسع في لوقا.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: علّمنا أن نصلّي
  rationale: ترجمة مباشرة لبنية فعل التعليم مع المصدر، من غير إضافة «كيف» غير الصريحة في اليونانية.
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: كما علّم يوحنا أيضًا تلاميذه
  rationale: «كما» تؤدي المقارنة، و«أيضًا» تنقل καί مع إبقاء ترتيب عربي واضح وطبيعي.
theological_decisions:
- issue: ترجمة κύριος في خطاب موجّه إلى يسوع
  choice: يا رب
  alternative: يا معلّم
  rationale: «يا رب» تحفظ المجال الدلالي للفظ اليوناني واللقب المتكرر في العهد الجديد، من غير حصره في معنى الدور التعليمي وحده أو فرض مقدار محدد من الدلالة المسيحانية في هذا الموضع.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حوفظ على عدم تعيين المكان والتلميذ، وعلى معنى «توقّف» بدل تفسير الفعل بأنه أكمل الصلاة. لا توجد حواشٍ لازمة لهذه الآية.
