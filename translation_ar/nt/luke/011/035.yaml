  text: σκόπει οὖν μὴ τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: ar
  text: فانتبه إذن لئلا يكون النور الذي فيك ظلامًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فاحرص إذن على ألا يكون النور الذي فيك ظلامًا».'
    reason: بديل معجمي وتركيبي للفعل σκόπει وبنية التحذير مع μή.
lexical_decisions:
- source_word: σκόπει
  choice: انتبه
  rationale: فعل أمر مضارع للمفرد يدعو إلى اليقظة المستمرة؛ و«انتبه» عربية طبيعية تحفظ قوة التحذير.
- source_word: οὖν
  choice: إذن
  rationale: تفيد الاستنتاج مما سبق عن العين والنور، وتحافظ على الصلة المنطقية بالسياق.
- source_word: μὴ
  choice: لئلا
  rationale: تأتي مع الأمر للتحذير من احتمال غير مرغوب فيه؛ و«لئلا» تؤدي هذا المعنى بإيجاز.
- source_word: τὸ φῶς
  choice: النور
  rationale: ترجمة مباشرة تحفظ صورة النور المجازية ولا تحصرها في تفسير بعينه.
- source_word: τὸ ἐν σοὶ
  choice: الذي فيك
  rationale: صياغة واضحة وطبيعية تحافظ على اتساع الصورة من غير تفسير نفسي أو روحي زائد.
- source_word: σκότος
  choice: ظلامًا
  rationale: تحفظ المقابلة المباشرة بين النور والظلام في السياق وقوتها المجازية والأخلاقية.
- source_word: ἐστίν
  choice: يكون
  rationale: جاءت «يكون» بعد «لئلا» بما يلائم التركيب العربي ويؤدي معنى فعل الكينونة اليوناني.
theological_decisions:
- issue: المعنى المجازي للنور والظلام
  choice: الإبقاء على الاستعارة في النص من غير تحديد مدلول عقائدي ضيق
  alternative: تفسير النور بأنه الفهم أو الضمير أو الحالة الروحية وحدها
  rationale: يرتبط القول بالسياق السابق عن الإدراك والحالة الباطنة، لكن اليونانية لا تحصر الصورة في مدلول واحد؛ لذلك تُحفظ سعتها وتوترها اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «فانتبه» لإبراز قوة التحذير، مع الحفاظ على استعارة النور والظلام وعلى المخاطب المفرد.
