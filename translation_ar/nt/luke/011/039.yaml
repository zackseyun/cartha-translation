  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: ar
  text: 'فقال له الرب: «أنتم أيها الفريسيون تنظفون الآن ظاهر الكأس والصحن، أما باطنكم فمملوء بالنهب[a] والشر.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «السلب»، أو «الابتزاز»، أو «الجشع».'
    reason: بدائل معجمية للفظ ἁρπαγή، الذي قد يدل على فعل الاستيلاء أو على الطمع الافتراسي.
lexical_decisions:
- source_word: κύριος
  choice: الرب
  rationale: لقب العهد الجديد المألوف هنا، وهو أنسب من حمله على مجرد نداء مهذب بمعنى السيد.
- source_word: Νῦν
  choice: الآن
  rationale: حُفظ بوصفه أداة خطاب تستهل توبيخًا مباشرًا، ووُضع في موضع طبيعي في العربية.
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: أنتم أيها الفريسيون
  rationale: يحفظ توكيد الضمير مع توجيه الخطاب إلى الفريسيين بصياغة عربية واضحة.
- source_word: τὸ ἔξωθεν
  choice: ظاهر
  rationale: ينقل معنى الجزء الخارجي في مقابلة مباشرة مع الباطن، بلفظ عربي طبيعي وموجز.
- source_word: ποτηρίου
  choice: الكأس
  rationale: المقابل العربي المعتاد للإناء المقصود، ولا يقتضي السياق مزيدًا من التحديد.
- source_word: πίνακος
  choice: الصحن
  rationale: لفظ حديث واضح لإناء تقديم الطعام، من غير تخصيصه بطبق كبير.
- source_word: καθαρίζετε
  choice: تنظفون
  rationale: يناسب الفعل الحسي المتعلق بظاهر الأواني، ويحفظ دلالة المضارع على الممارسة الجارية أو المعتادة.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: أما باطنكم
  rationale: يحفظ الانتقال المقصود من ظاهر الأواني إلى داخل المخاطَبين من غير تفسيره بالقلب أو الذهن.
- source_word: γέμει
  choice: فمملوء
  rationale: تعبير عربي طبيعي عن الامتلاء، مع بقاء المفرد موافقًا لـ«باطنكم» بوصفه اسم جنس جمعيًا في الإضافة.
- source_word: ἁρπαγῆς
  choice: النهب
  rationale: يحفظ المعنى الملموس للاغتصاب والاستيلاء الجشع، ويُبقي احتمال الإشارة إلى السلب والاستغلال بدل حصره في شعور داخلي عام.
- source_word: πονηρίας
  choice: الشر
  rationale: ينقل المصطلح الأخلاقي الواسع بوضوح وجدية، من غير تضييقه إلى الخبث أو سوء النية وحدهما.
theological_decisions:
- issue: المرجع المجازي للباطن
  choice: أما باطنكم فمملوء
  alternative: أما قلوبكم فمملوءة؛ أو أنتم في داخلكم مملوءون
  rationale: النص اليوناني يقابل الظاهر بباطن المخاطَبين، ولا يحدد القلب أو العقل؛ لذلك حُفظت الصورة والتوتر بين الطهارة الخارجية والفساد الداخلي.
- issue: دلالة ἁρπαγή الأخلاقية
  choice: النهب في المتن مع بدائل في الحاشية
  alternative: الجشع؛ الطمع؛ السلب؛ الابتزاز
  rationale: قد يدل اللفظ على الاستيلاء والسلب أو على النزعة الافتراسية الكامنة وراءهما. اختيار «النهب» يحفظ حدة الدلالة الملموسة، وتعرض الحاشية المدى الدلالي دون حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت المقابلة «ظاهر/باطن» لصون البنية البلاغية، مع تجنب ألفاظ تفسيرية مثل «قلوبكم».
