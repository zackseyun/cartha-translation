  verdict: approve
  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: الشرط المقابل، مجيء شخص أقوى على الآخر وغلبته، نزع العُدّة التي كان يعتمد عليها، ثم توزيع الغنائم. لا يضيف تحديدًا لاهوتيًا لهوية الشخصيات، ويحافظ على الصورة القتالية في السياق.'
  naturalness: 'الصياغة فصيحة حديثة وواضحة: «أمّا إذا هاجمه من هو أقوى منه وغلبه» و«عُدَّته الحربية الكاملة» و«يوزّع غنائمه» تراكيب سليمة ومناسبة للسجل الوقور. اختيار «هاجمه» تفسير سياقي معقول لـἐπελθών في مشهد الغلبة ونزع العتاد، ولا يتجاوز المعنى بأثر يقتضي تعديلًا.'
  terminology: «عُدَّته الحربية الكاملة» تؤدي πανοπλία بدقة، إذ تشير إلى تجهيز كامل لا إلى قطعة درع واحدة. و«غنائمه» و«أسلابه» مناسبان لـσκῦλα، و«غلبه» مقابل طبيعي ودقيق لـνικήσῃ. الحواشي مرتبطة بعلاماتها وتعرض بدائل معجمية مفيدة.
