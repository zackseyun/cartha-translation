  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: ar
  text: أمّا إذا هاجمه من هو أقوى منه وغلبه[a]، فإنه ينتزع منه عُدَّته الحربية الكاملة[b] التي كان يعتمد عليها، ويوزّع غنائمه[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هزمه» أو «قهره».'
    reason: lexical_alternative
  - marker: b
    text: يدل اللفظ اليوناني على مجموعة العتاد الحربي الكاملة.
    reason: lexical_alternative
  - marker: c
    text: 'أو: «أسلابه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: أمّا إذا
  rationale: تنقل معنى الشرط الزمني مع إبراز المقابلة بالحالة المذكورة في الآية السابقة، بصياغة عربية طبيعية.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: من هو أقوى منه
  rationale: تحافظ على استعمال صفة المقارنة استعمالًا اسميًّا من غير إضافة كلمة «رجل»، وهي غير مذكورة صراحة في هذه الجملة.
- source_word: ἐπελθὼν
  choice: هاجمه
  rationale: يبيّن المجيء عليه في سياق صراع، وهو أوضح في العربية من ترجمة حرفية مبهمة، من غير تحميل الصورة تفسيرًا لاهوتيًّا زائدًا.
- source_word: νικήσῃ αὐτόν
  choice: غلبه
  rationale: لفظ عربي واضح يدل على الانتصار عليه وإخضاعه، وتُذكر بدائل قريبة في الحاشية حفظًا للمجال الدلالي.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: عُدَّته الحربية الكاملة
  rationale: πανοπλία تدل على مجموعة العتاد أو السلاح الكاملة، لا على قطعة واحدة من الدرع؛ وهذه الصياغة دقيقة ومفهومة.
- source_word: αἴρει
  choice: ينتزع منه
  rationale: يناسب سياق نزع العتاد من المغلوب، وينقل معنى الأخذ والإزالة بقوة بصورة طبيعية.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: التي كان يعتمد عليها
  rationale: ينقل الثقة المستقرة أو الاتكال على العدة، مع المحافظة على الصلة المباشرة بها.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: غنائمه
  rationale: يدل اللفظ على ما يؤخذ من العدو المهزوم؛ و«الغنائم» واضحة في العربية المعاصرة، مع إثبات «الأسلاب» بديلًا.
- source_word: διαδίδωσιν
  choice: يوزّع
  rationale: يعبر بدقة عن توزيع الغنائم أو تقسيمها بين آخرين.
theological_decisions:
- issue: هل يُصرَّح بأن الأقوى «رجل» ربطًا بالصورة الواردة في الآية السابقة؟
  choice: من هو أقوى منه
  alternative: رجل أقوى منه
  rationale: اليونانية تستعمل صفة مقارنة اسمية من غير ذكر «رجل» في هذه الجملة. عدم إضافتها يحافظ على صياغة النص، بينما يظل السياق السابق واضحًا.
- issue: درجة القوة التي يفيدها الفعل νικάω في صورة الصراع
  choice: غلبه
  alternative: هزمه أو قهره
  rationale: «غلبه» يحفظ معنى الانتصار والإخضاع الذي يفضي إلى نزع العتاد، من غير أن يضيف إلى الصورة تفسيرًا خاصًّا لهوية الشخصيتين.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «عُدَّته الحربية الكاملة» للدقة وتجنب فهم «الدرع» على أنه قطعة واحدة، وحُفظت صورة الصراع وتوزيع الغنائم من غير تفسير لاهوتي مضاف.
