id: LUK.11.8
reference: Luke 11:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: ar
  text: 'أقول لكم: حتى إن لم ينهض ليعطيه لأنه صديقه، فإنه بسبب عدم تحرّجه[a] سينهض ويعطيه كلَّ ما يحتاج إليه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «بسبب جرأته»، أو «بسبب وقاحته»، أو، حرفيًا، «بسبب عدم خجله». والضمير في اليونانية محتمل المرجع: فقد يُفهم عن الطالب وإصراره غير المتحرّج، أو عن صاحب البيت وتجنّبه الخزي.'
    reason: بدائل معجمية وغموض مرجع الضمير في العبارة اليونانية.
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: صيغة مباشرة مألوفة في كلام يسوع، وتحافظ على فعل القول والخطاب بصيغة الجمع.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ
  choice: حتى إن كان لا يقوم ويعطيه
  rationale: تنقل العبارة معنى التنازل الشرطي في εἰ καί، من غير تحويله إلى تقرير سببي قاطع.
- source_word: ἀναστὰς
  choice: يقوم
  rationale: المقصود في المشهد المنزلي أن ينهض من موضع نومه؛ و«يقوم» تعبير عربي طبيعي موجز.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: لكونه صديقه
  rationale: تحافظ الصياغة على العلاقة الشخصية التي يدل عليها φίλον بدل تجريدها إلى «الصداقة».
- source_word: διά γε
  choice: فإنه بسبب
  rationale: الفاء مع «فإنه» تُظهر الانتقال التوكيدي من الدافع غير الكافي إلى الدافع المؤثر.
- source_word: ἀναίδειαν
  choice: إلحاحه بلا خجل
  rationale: يجمع التعبير بين المعنى المعجمي الحاد، أي انعدام الخجل، وبين دلالة الإلحاح التي يبرزها سياق الطلب المتكرر، من غير اختزال اللفظة إلى المثابرة وحدها.
- source_word: ἐγερθεὶς
  choice: سيقوم
  rationale: يدل في السياق على النهوض من الفراش، وهو متداخل دلاليًا هنا مع ἀναστὰς، وتوحيد المقابل طبيعي في العربية.
- source_word: ὅσων χρῄζει
  choice: كلَّ ما يحتاج إليه
  rationale: تنقل شمول الموصول الجمعي ومقدار الأشياء المطلوبة بلغة عربية واضحة.
- source_word: τι implied after δώσει in the first clause
  choice: ويعطيه
  rationale: لا تحتاج العربية إلى إضافة مفعول به صريح بعد «يعطيه»؛ لذا لا تُزاد كلمة غير منصوص عليها، ويُفهم الشيء المعطى من السياق.
theological_decisions:
- issue: دلالة ἀναίδεια ومرجع الضمير αὐτοῦ
  choice: إلحاحه بلا خجل، مع إبقاء الضمير من غير تعيين صريح
  alternative: وقاحته؛ جرأته؛ عدم خجله؛ أو فهم العبارة على أنها تشير إلى تجنب صاحب البيت للخزي
  rationale: تدل اللفظة أصلًا على انعدام الخجل، بينما يجعل السياق هذا الوصف متعلقًا بالإصرار على الطلب. ولا يعيّن التركيب اليوناني مرجع الضمير تعيينًا صريحًا مستقلًا عن السياق، لذلك أبقت العربية الضمير محتمل المرجع ولم تضف تفسيرًا عقائديًا يحسم التوتر.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كريمة. حافظت الصياغة على بنية الشرط التنازلي وعلى غموض الضمير، ووضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
