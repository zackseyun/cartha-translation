id: LUK.11.52
reference: Luke 11:52
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: ar
  text: «ويلٌ لكم يا علماء الشريعة[a]، لأنكم نزعتم مفتاح المعرفة؛ أنتم أنفسكم لم تدخلوا، وعرقلتم الذين كانوا يدخلون».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي المتخصصون في شريعة موسى، لا المحامون بالمعنى الحديث.
    reason: توضيح دلالة المصطلح في سياقه اليهودي.
lexical_decisions:
- source_word: οὐαί
  choice: ويلٌ لكم
  rationale: يحافظ على قوة التنديد النبوي في العبارة اليونانية، ولا يخففها إلى مجرد تعبير عن الأسف.
- source_word: νομικοῖς
  choice: علماء الشريعة
  rationale: يدل اللفظ على المتخصصين في الشريعة اليهودية، لا على المحامين بالمعنى المدني الحديث. وهذه الصياغة واضحة وطبيعية في العربية المعاصرة.
- source_word: ἤρατε
  choice: نزعتم
  rationale: ينقل معنى الإزالة والحرمان من وسيلة الوصول، لا مجرد الأخذ أو الحمل.
- source_word: κλεῖδα τῆς γνώσεως
  choice: مفتاح المعرفة
  rationale: يحافظ على صورة المفتاح وعلى تركيب الإضافة في اليونانية بصياغة عربية طبيعية.
- source_word: αὐτοὶ
  choice: أنتم أنفسكم
  rationale: ينقل توكيد الضمير والمقابلة بين موقف المخاطَبين وموقف الداخلين.
- source_word: οὐκ εἰσήλθατε
  choice: لم تدخلوا
  rationale: يبقي استعارة الدخول من غير تعيين ما الذي يُدخَل إليه، إذ لا يذكره النص صراحة.
- source_word: τοὺς εἰσερχομένους
  choice: الذين كانوا يدخلون
  rationale: يعكس دلالة اسم الفاعل الحاضر على فعل جارٍ، من غير إضافة معنى المحاولة الذي لا يصرح به النص.
- source_word: ἐκωλύσατε
  choice: عرقلتم
  rationale: يفيد وضع العوائق دون الجزم بأن الدخول مُنع منعًا تامًّا، وبذلك يحافظ على اتساع دلالة الفعل اليوناني.
theological_decisions:
- issue: مرجع استعارة «الدخول» و«مفتاح المعرفة»
  choice: الإبقاء على استعارة الوصول والدخول من غير تحديد الشيء الذي يدخلون إليه
  alternative: تفسير الدخول بأنه دخول ملكوت الله، أو بأنه بلوغ المعرفة الحقيقية بالله
  rationale: لا يصرح النص اليوناني بمتعلَّق الدخول؛ لذلك تتجنب الترجمة إدخال تفسير عقدي محدد، وتحفظ الإيحاء الخلاصي والإعلاني ضمن سياق لوقا.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ومهيبة. استُعملت «علماء الشريعة» بدل لفظ قد يوحي بالمحاماة المدنية، وحُفظت استعارتا المفتاح والدخول، كما حُفظ توكيد «أنتم أنفسكم».
