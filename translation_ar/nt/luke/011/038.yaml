  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: ar
  text: أَمَّا الْفَرِّيسِيُّ، فَلَمَّا رَأَى ذَلِكَ تَعَجَّبَ مِنْ أَنَّهُ لَمْ يَغْتَسِلْ أَوَّلًا قَبْلَ الطَّعَامِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يُجْرِ أولًا الاغتسالَ الطقسيَّ قبل الطعام». والفعل اليوناني نفسه يُستعمل كثيرًا بمعنى «يُعَمِّد»، لكنه يشير هنا، في سياق ممارسات الطهارة الفريسية، إلى اغتسال طقسي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: أَمَّا ... فَـ
  rationale: تنقل الانتقال السردي والمقابلة الخفيفة بأسلوب عربي طبيعي.
- source_word: Φαρισαῖος
  choice: الْفَرِّيسِيُّ
  rationale: المقابل العربي المعياري لاسم هذه الجماعة، مع الحفاظ على التعريف.
- source_word: ἰδὼν
  choice: فَلَمَّا رَأَى ذَلِكَ
  rationale: تفيد الظرفية الزمنية السابقة للفعل الرئيس، ويعود اسم الإشارة إلى ما فعله يسوع بحسب السياق.
- source_word: ἐθαύμασεν
  choice: تَعَجَّبَ
  rationale: ينقل معنى الدهشة والاستغراب من دون إضافة حكم نفسي غير مصرح به.
- source_word: οὐ πρῶτον
  choice: لَمْ ... أَوَّلًا
  rationale: يحافظ على نفي الفعل الذي كان متوقعًا أن يسبق تناول الطعام.
- source_word: ἐβαπτίσθη
  choice: يَغْتَسِلْ
  rationale: السياق هو غسل طقسي قبل الطعام، لا المعمودية المسيحية؛ والاغتسال أوسع وأدق هنا من غسل اليدين، الذي لا يصرح به اللفظ اليوناني.
- source_word: πρὸ τοῦ ἀρίστου
  choice: قَبْلَ الطَّعَامِ
  rationale: يحافظ على معنى الوجبة من غير تقييدها بالغداء أو بوقت محدد.
theological_decisions:
- issue: دلالة ἐβαπτίσθη في سياق مائدة فريسية
  choice: الاغتسال الطقسي قبل الطعام، بصيغة «يَغْتَسِلْ»
  alternative: يَعْتَمِدْ / يَغْطِسْ نَفْسَهُ
  rationale: السياق يتناول ممارسات الطهارة الفريسية قبل الأكل، لا فريضة المعمودية المسيحية. وتبقي الحاشية الصلة اللفظية بالفعل المستعمل للمعمودية من غير أن تفرضها على المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «يغتسل» بدل «يغسل يديه» تجنبًا لتخصيص ما لم يحدده النص، ووُضعت علامة الحاشية [a] في المتن.
