  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: ar
  text: 'فأجابه واحدٌ من علماء الشريعة[a]: «يا معلّم، بقولك هذا تُهيننا نحن أيضًا[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: المتخصصين في الشريعة اليهودية؛ وليس المقصود محامين بالمفهوم المهني الحديث.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تعاملنا بازدراء نحن أيضًا». يمكن أن يدل الفعل اليوناني على الإهانة أو الإذلال، لا مجرد التسبّب في الاستياء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: فأجابه
  rationale: ينقل اسم الفاعل الماضي بوظيفته السردية بوصفه ردًّا على الكلام السابق، وتفيد الفاء الانتقال الطبيعي من غير مبالغة في معنى δέ.
- source_word: τις τῶν νομικῶν
  choice: واحدٌ من علماء الشريعة
  rationale: يشير νομικός هنا إلى المتخصص في الشريعة اليهودية، لا إلى المحامي بالمفهوم المهني الحديث.
- source_word: λέγει αὐτῷ
  choice: أجابه
  rationale: دُمج فعل القول مع صيغة الجواب في تعبير عربي طبيعي موجز، وحُوِّل المضارع التاريخي إلى الماضي الملائم للسرد العربي.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: ترجمة مباشرة وطبيعية لصيغة النداء، بلا إيحاءات زائدة تحملها ألفاظ مثل «يا سيد».
- source_word: ταῦτα λέγων
  choice: بقولك هذا
  rationale: يحفظ علاقة الوسيلة أو السبب بين قول يسوع والحكم بأنه إهانة، ويشير «هذا» طبيعيًّا إلى الكلام السابق بمجموعه.
- source_word: καὶ ἡμᾶς
  choice: نحن أيضًا
  rationale: يحفظ القوة الإضافية لـ καί، إذ يضم المتكلم علماء الشريعة إلى من مسّهم الكلام السابق.
- source_word: ὑβρίζεις
  choice: تُهيننا
  rationale: ينقل معنى الإهانة والمعاملة بازدراء على نحو أقوى وأدق من مجرد «تسيء إلينا» أو «تجرح مشاعرنا».
