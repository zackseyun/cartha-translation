  source_fidelity: 'ينقل النص عناصر اليونانية بدقة: الشرط بـ«إن»، وفعل طرد الشياطين، وصورة «بإصبع الله»، والاستنتاج الناتج عن ذلك، ووصول ملكوت الله إلى المخاطَبين. و«فقد حلَّ عليكم» تعبير عربي فصيح يفي بدلالة ἔφθασεν ἐφ’ ὑμᾶς بوصفه وصولًا متحققًا وحاسمًا، من غير حصره في معنى الوعيد.'
