id: LUK.11.20
reference: Luke 11:20
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: ar
  text: ولكن إن كنتُ بإصبع الله[a] أطرد الشياطين، فقد حلَّ عليكم ملكوت الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: بقدرة الله المباشرة. وتحافظ العبارة على صورة «إصبع الله»، ولها صدى في خروج 8:19.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فقد بلغكم ملكوت الله»، أو «فقد أدرككم ملكوت الله».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: بإصبع الله
  rationale: تحافظ العبارة على الصورة الحسية الواردة في اليونانية وعلى صداها المحتمل لخروج 8:19، بينما تفيد الباء في العربية الوسيلة أو الفاعلية من غير أن تستبدل الصورة بتفسيرها.
- source_word: ἐκβάλλω
  choice: أطرد
  rationale: فعل عربي واضح وطبيعي يفيد إخراج الشياطين بالقوة، ويلائم الاستعمال المتكرر في سياقات طرد الأرواح.
- source_word: τὰ δαιμόνια
  choice: الشياطين
  rationale: مقابل مباشر وشائع لـ δαιμόνια، ولا يستبدله بتعبير «الأرواح النجسة» الذي يترجم لفظًا يونانيًا آخر.
- source_word: ἄρα
  choice: فقد
  rationale: تربط جواب الشرط بالنتيجة المستنبطة منه، وتفيد مع «قد» تحقق الوصول على نحو طبيعي في العربية.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: حلَّ عليكم
  rationale: ينقل بلوغ الملكوت للمخاطَبين وحضوره الحاسم، ويحافظ على دلالة ἐπί الاتجاهية في تعبير عربي فصيح وطبيعي.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي راسخ ودقيق، يحتمل معنى سلطان الله ومجال حكمه من غير حصره في أحد الجانبين.
theological_decisions:
- issue: دلالة «إصبع الله»
  choice: الإبقاء على الصورة بوصفها تعبيرًا عن قدرة الله وفعله المباشرَين
  alternative: تفسيرها صراحةً بأنها الروح القدس بالاستناد إلى متى 12:28
  rationale: نص لوقا يذكر «إصبع الله»، لذلك تُحفظ صورته وصِلته النصية المحتملة بخروج 8:19 من غير دمج صياغته بصياغة متى أو إدخال تفسير مذهبي في المتن.
- issue: دلالة حلول ملكوت الله على المخاطَبين
  choice: إعلان أن ملكوت الله قد بلغهم وحضر في خدمة يسوع
  alternative: قصر الملكوت على المستقبل، أو فهم العبارة على أنها وعيد محض بمعنى «أدرككم»
  rationale: صيغة الفعل والسياق يبرزان وصولًا متحققًا وحاسمًا، لكن الصياغة لا تفرض منظومة أخروية مفصلة ولا تلغي الأبعاد المستقبلية للملكوت.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «إن كنتُ» لإظهار أن فاعل «أطرد» هو المتكلم من غير إثقال، وحُفظت الصورة المجازية والتوتر الدلالي في فعل وصول الملكوت.
