  terminology: «الشياطين» مقابل مباشر مناسب لـτὰ δαιμόνια، و«ملكوت الله» مصطلح كتابي عربي راسخ يحفظ سعة βασιλεία. كما أن «إصبع الله» يحافظ على الصورة النصية ولا يستبدلها بتفسير لاهوتي. الحاشيتان مرتبطتان بالموضعين المناسبين وتعرضان البدائل أو الإيضاح دون تغيير المتن.
