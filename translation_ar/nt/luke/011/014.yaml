source:
  edition: SBLGNT
  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: ar
  text: وكان يطرد شيطانًا أخرس[a]. فلما خرج الشيطان، تكلَّم الأخرس، فتعجَّبت الجموع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أصم»؛ فالصفة اليونانية قد تعني «أصم» أو «أخرس»، لكن «أخرس» أنسب هنا لأن الشخص تكلَّم بعد خروج الشيطان.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: كان يطرد
  rationale: يحافظ تركيب «كان» مع المضارع على دلالة الفعل المستمر في الزمن الماضي التي يؤديها التركيب اليوناني المحيطي.
- source_word: δαιμόνιον
  choice: شيطانًا
  rationale: ترجمة مباشرة للاسم اليوناني، وتحفظ التصوير الصريح لطرد كائن شيطاني من غير استبداله بتعبير غير وارد في الآية.
- source_word: κωφόν
  choice: أخرس
  rationale: قد تدل الكلمة اليونانية على الصمم أو الخرس، لكن تكلم المصاب بعد خروج الشيطان يجعل الخرس هو المعنى الأنسب في هذا السياق.
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: فلما خرج الشيطان
  rationale: صياغة عربية طبيعية تحفظ تعاقب الحدثين وتبين أن خروج الشيطان سبق تكلم الأخرس، من غير الإبقاء على عبارة يونانية اصطلاحية ثقيلة مثل «وحدث أنه».
- source_word: ἐλάλησεν
  choice: تكلَّم
  rationale: ينقل المعنى المباشر للفعل من غير إضافة معنى «بدأ يتكلم» غير المصرح به.
- source_word: ὁ κωφός
  choice: الأخرس
  rationale: الصفة المستعملة استعمال الاسم تشير إلى الشخص المصاب، و«الأخرس» موجزة وطبيعية في العربية ولا تضيف تحديدًا للجنس لا يصرح به اللفظ نفسه.
- source_word: ἐθαύμασαν
  choice: تعجَّبت
  rationale: ينقل معنى الدهشة الممزوجة بالعجب، ويلائم الأسلوب السردي العربي.
- source_word: οἱ ὄχλοι
  choice: الجموع
  rationale: يحفظ صيغة الجمع في الأصل، وهو تعبير عربي واضح وأفصح من تحويله إلى مفرد.
theological_decisions:
- issue: طبيعة العلة ولغة طرد الشيطان
  choice: عرض الحدث بوصفه طردًا فعليًا لشيطان أعقبه تكلم الأخرس.
  alternative: تخفيف التصوير الغيبي باستعمال تعبير ظاهراتي أو تجنب نسبة العلة إلى شيطان.
  rationale: النص اليوناني يذكر δαιμόνιον صراحة ويربط خروجه بتكلم المصاب؛ لذلك تُحفظ دعوى النص من غير اختزال أو إضافة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية رصينة. استُعمل «كان يطرد» لإبراز استمرار الفعل، و«فلما» لربط خروج الشيطان بالحدث اللاحق بسلاسة. وُضع مؤشر الحاشية بعد «أخرس» لأنه يتعلق بالبديل المعجمي لهذه الصفة.
