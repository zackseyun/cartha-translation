review_pass:
  verdict: approve
  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: صدور الجواب من الداخل، وطلب عدم الإزعاج، وحالة الباب المغلق بالفعل، ووجود الأطفال مع المتكلم في موضع النوم، وعدم استطاعته النهوض والعطاء. ولا يضيف مفعولًا به إلى «أعطيك»، وهو محافظ على إبهام النص اليوناني في هذا الموضع.'
  naturalness: الصياغة فصحى حديثة وواضحة، والحوار طبيعي ومناسب لسياق المثل. «فيجيبه ذاك من الداخل قائلًا» سليمة، وإن كانت محافظة نسبيًا على بنية الأصل، وهذا ملائم للترجمة ذات التكافؤ الأمثل.
  terminology: «لا تُزعجني»، و«الباب مغلق بالفعل»، و«أطفالي»، و«في الفراش» اختيارات دقيقة وطبيعية. لا يحمل «مغلق» معنى القفل غير المذكور في κέκλεισται. والحاشية الثقافية ترفع احتمال الفهم الجنسي غير المقصود من «في الفراش».
