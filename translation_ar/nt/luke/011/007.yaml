source:
  edition: SBLGNT
  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: ar
  text: 'فيجيبه ذاك من الداخل قائلًا: «لا تُزعجني[a]. الباب مغلق بالفعل[b]، وأطفالي معي في الفراش[c]. لا أستطيع أن أنهض وأعطيك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تُتعِبني» أو «لا تواصل إزعاجي». والتعبير اليوناني يعني حرفيًا تقديم المتاعب أو التسبب فيها.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قد أُغلق الباب بالفعل». قد يبرز الفعل اليوناني التام إما فعل الإغلاق المكتمل وإما الحالة الناتجة منه.'
    reason: lexical_alternative
  - marker: c
    text: المقصود بـ«في الفراش» موضع النوم الذي كان أفراد البيت يشتركون فيه، ولا يدل هنا على علاقة زوجية.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος
  choice: فيجيبه ذاك
  rationale: تحافظ «ذاك» على الإشارة إلى الرجل الموجود في الداخل، وتصل «فـ» الجواب بسياق المثل ربطًا طبيعيًا.
- source_word: ἔσωθεν
  choice: من الداخل
  rationale: تنقل بوضوح موضع صدور الجواب وتقابله مع وجود الطالب خارج البيت.
- source_word: ἀποκριθεὶς εἴπῃ
  choice: قائلًا
  rationale: صيغتا «أجاب وقال» تؤديان معًا وظيفة تعبير سردي واحد؛ وقد نُقل معنى الإجابة في «فيجيبه» ومعنى القول في «قائلًا» من غير حشو عربي.
- source_word: Μή μοι κόπους πάρεχε
  choice: لا تُزعجني
  rationale: تؤدي المعنى الاصطلاحي، أي التسبب في العناء أو الإزعاج، بعبارة عربية واضحة وطبيعية.
- source_word: ἤδη
  choice: بالفعل
  rationale: تفيد أن إغلاق الباب واقع قبل لحظة الكلام وأن حالته ما زالت قائمة.
- source_word: ἡ θύρα κέκλεισται
  choice: الباب مغلق
  rationale: تنقل حالة الباب الناتجة من فعل الإغلاق، من غير إضافة معنى القفل الذي لا يقتضيه الفعل اليوناني.
- source_word: τὰ παιδία μου
  choice: أطفالي
  rationale: مقابل عربي طبيعي يدل على أولاد المتكلم من غير مبالغة في تحديد أعمارهم.
- source_word: μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: معي في الفراش
  rationale: تحافظ على صورة موضع النوم المشترك في البيت، مع إيضاحها ثقافيًا في الحاشية دفعًا لسوء الفهم.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: لا أستطيع أن أنهض وأعطيك
  rationale: تنقل عدم الاستطاعة والفعل المصاحب المطلوب قبل العطاء، ولا تضيف مفعولًا به غير مذكور صراحة في اليونانية.
