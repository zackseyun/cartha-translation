  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: ar
  text: لكن الويل لكم أيها الفريسيون! فإنكم تُعشِّرون النعناع والسَّذاب وكل خضرة، وتتجاوزون العدل ومحبة الله. كان ينبغي أن تفعلوا هذه الأمور، من غير أن تُهمِلوا تلك الأمور.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: الويل لكم
  rationale: صياغة عربية طبيعية تحفظ قوة التحذير والقضاء في العبارة اليونانية.
- source_word: ἀποδεκατοῦτε
  choice: تُعشِّرون
  rationale: 'ينقل الفعل الديني المحدد: تقديم العُشر.'
- source_word: ἡδύοσμον
  choice: النعناع
  rationale: المقابل النباتي العربي المألوف والدقيق.
- source_word: πήγανον
  choice: السَّذاب
  rationale: اسم النبات المعروف المقابل لـ rue.
- source_word: πᾶν λάχανον
  choice: كلَّ نوع من البقول
  rationale: يحفظ الشمول، ويعبّر عن النبات المزروع للأكل دون حصره في نبات واحد.
- source_word: παρέρχεσθε
  choice: تتجاوزون
  rationale: يحفظ صورة المرور بجانب الأمر وعدم الاعتناء به، بدل تسويتها إلى مجرد الإهمال.
- source_word: κρίσιν
  choice: العدل
  rationale: في هذا السياق الأخلاقي يدل اللفظ على ممارسة العدل، لا على فعل الدينونة وحده.
- source_word: ἀγάπην τοῦ θεοῦ
  choice: محبة الله
  rationale: يحفظ الإضافة اليونانية كما هي، بما فيها احتمال الإشارة إلى محبة الإنسان لله أو المحبة المرتبطة بالله.
- source_word: ταῦτα ... κἀκεῖνα
  choice: بهذه ... تلك
  rationale: يحفظ الإحالة المتقابلة في الأصل من غير إدخال تفسير زائد.
theological_decisions:
- issue: العلاقة بين العدل ومحبة الله من جهة، والتعشير من جهة أخرى
  choice: كان ينبغي أن تعملوا بهذه، من غير أن تُهمِلوا تلك
  alternative: كان ينبغي أن تفعلوا هذه الأمور دون إهمال الأمور الأخرى
  rationale: يحفظ إلزام يسوع بالأولى مع عدم إسقاط الثانية، من غير ترتيب لاهوتي إضافي أو إلغاء لممارسة التعشير في سياق الخطاب.
- issue: دلالة «محبة الله»
  choice: الإبقاء على «محبة الله»
  alternative: محبتكم لله / محبة الله لكم
  rationale: الإضافة في الأصل قابلة لأكثر من علاقة دلالية، لذلك لا ينبغي حسمها تفسيرياً داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «تتجاوزون» للمحافظة على الصورة الحركية في παρέρχεσθε، و«تُعشِّرون» بوصفه مصطلحاً كتابياً موجزاً يفهم من السياق.
