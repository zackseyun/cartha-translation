- from: لكن الويل لكم أيها الفريسيون! فإنكم تُعشِّرون النعناع والسَّذاب وكلَّ نوع من البقول، وتتجاوزون العدل ومحبة الله. كان ينبغي أن تعملوا بهذه، من غير أن تُهمِلوا تلك.
  to: لكن الويل لكم أيها الفريسيون! فإنكم تُعشِّرون النعناع والسَّذاب وكل خضرة، وتتجاوزون العدل ومحبة الله. كان ينبغي أن تفعلوا هذه الأمور، من غير أن تُهمِلوا تلك الأمور.
  rationale: يصحح التعديل خاتمة الآية إلى تركيب عربي فصيح يحفظ مقابلة ταῦτα/κἀκεῖνα، من غير إضافة تفسير لاهوتي، ويستبدل «البقول» بـ«الخضرة» لتوسيع الدلالة بما يلائم λάχανον.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'النص ينقل عناصر الآية الأساسية بأمانة: الوعيد، وتعشير النعناع والسذاب، والشمول في النباتات، وتجاوز العدل ومحبة الله، ثم عدم إهمال الأمرين الآخرين. لكن «كان ينبغي أن تعملوا بهذه» غير سليمة الأسلوب والإحالة فيها غير واضحة في العربية؛ فـ«بهذه» لا تقوم مقام مفعول الفعل على نحو طبيعي هنا.'
  naturalness: الترجمة فصيحة في معظمها، و«الويل لكم» و«تُعشِّرون» و«السذاب» مناسبة. يلزم استبدال الخاتمة بتعبير عربي مباشر يوضح المقابلة بين «هذه» و«تلك». كما أن «كل خضرة» أدق وأيسر من «كل نوع من البقول»، لأن λάχανον تدل على الخضر/النباتات المأكولة ولا تقتصر على البقول بمعنى القرنيات.
  terminology: «العدل» مقابل مناسب لـκρίσις في السياق، و«محبة الله» تحافظ على سعة الإضافة اليونانية من دون ترجيح تفسيري. و«تتجاوزون» مقبول بوصفه ترجمة محافظة على صورة παρέρχεσθε، وإن كان سياقه يفيد الإهمال.
  issues:
  - severity: medium
    issue: الخاتمة «كان ينبغي أن تعملوا بهذه» غير طبيعية وغير دقيقة نحويًا ودلاليًا.
    rationale: الفعل «عمل بـ» لا يؤدي هنا بوضوح معنى ποιῆσαι («يفعل/يمارس»)، والضمير «بهذه» يحجب الإحالة إلى الأمور المذكورة. ينبغي التصريح بـ«هذه الأمور» و«تلك الأمور».
  - severity: low
    issue: «كل نوع من البقول» أضيق من λάχανον.
    rationale: اللفظ اليوناني يشمل الخضر أو النباتات المأكولة عمومًا، لا البقول بمعناها العربي الشائع على وجه الخصوص.
  revised_text: لكن الويل لكم أيها الفريسيون! فإنكم تُعشِّرون النعناع والسَّذاب وكل خضرة، وتتجاوزون العدل ومحبة الله. كان ينبغي أن تفعلوا هذه الأمور، من غير أن تُهمِلوا تلك الأمور.
