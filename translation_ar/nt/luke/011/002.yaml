source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: ar
  text: 'فقال لهم: «عندما تصلّون، قولوا: يا أبتِ[a]، ليُقَدَّس اسمك[b]. ليأتِ ملكوتك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض التقاليد: «يا أبانا»، متأثرة بالنص الموازي في متى 6:9، أما اليونانية هنا فتقول ببساطة: «يا أبتِ».'
    reason: alternative_reading
  - marker: b
    text: 'أي: ليُعترف بقداسة اسمك وليُعامَل بوصفه مقدسًا. ويمكن ترجمتها: «ليكن اسمك مقدسًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: متى
  rationale: 'تدخل على حالة زمنية عامة، فتفيد: في كل مرة تصلّون فيها، من غير حاجة إلى إثقال العبارة بالتكرار.'
- source_word: προσεύχησθε
  choice: صلَّيتم
  rationale: صيغة المضارع الاحتمالي في الشرط العام تشير إلى فعل متكرر أو معتاد، ويؤديه الماضي العربي بعد «متى» أداءً طبيعيًا.
- source_word: λέγετε
  choice: فقولوا
  rationale: أمر حاضر يفيد التوجيه المعتاد؛ وصيغة الأمر العربية المباشرة واضحة وطبيعية.
- source_word: Πάτερ
  choice: يا أبتِ
  rationale: نداء مفرد يطابق النص اليوناني «أيها الآب/يا أبتِ» من غير إضافة ضمير الجمع الموجود في النص الموازي بمتى.
- source_word: ἁγιασθήτω
  choice: ليتقدَّس
  rationale: أمر غائب مبني للمجهول في اليونانية وصيغته هنا دعائية؛ ويحافظ «ليتقدس» على الإيجاز وعلى عدم التصريح بمن يقدّس الاسم، مع بقاء معنى الاعتراف بقداسته وإكرامه.
- source_word: τὸ ὄνομά σου
  choice: اسمك
  rationale: ترجمة مباشرة تحفظ التعبير الكتابي الذي يشمل هوية الله المعلنة وسمعته وكرامته من غير شرح زائد داخل النص.
- source_word: ἐλθέτω
  choice: ليأتِ
  rationale: أمر غائب ذو قوة دعائية، وتنقله لام الأمر العربية بوضوح وإيجاز.
- source_word: ἡ βασιλεία σου
  choice: ملكوتك
  rationale: «الملكوت» تعبير عربي كتابي مفهوم يحفظ مجال βασιλεία الدلالي، بما فيه مُلك الله وسلطانه والمجال الذي يظهر فيه حكمه.
theological_decisions:
- issue: مخاطبة الله بلفظ «الآب» من غير «نا»
  choice: يا أبتِ
  alternative: يا أبانا
  rationale: النص اليوناني المعطى يقرأ Πάτερ فقط؛ لذلك لا تُضاف «نا» انسجامًا مع متى 6:9 أو مع الصيغة الطقسية المألوفة.
- issue: معنى ἁγιασθήτω τὸ ὄνομά σου
  choice: ليتقدَّس اسمك
  alternative: ليكن اسمك مقدسًا؛ ليُعترف بقداسة اسمك
  rationale: يحفظ الاختيار صيغة الدعاء المبنية للمجهول والتوتر بين قداسة اسم الله في ذاته وطلب الاعتراف بهذه القداسة وإكرامها، من غير أن يوحي الشرح بأن اسم الله كان غير مقدس.
- issue: مدلول βασιλεία
  choice: ملكوتك
  alternative: مُلكك؛ سلطانك الملكي
  rationale: يبقي «ملكوتك» سعة اللفظ اليوناني، فلا يقصره على مكان ولا يحصره في مفهوم مجرد للسلطان.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة مهيبة مناسبة للصلاة. استُعملت «يا أبتِ» لأنها صيغة نداء عربية طبيعية ودقيقة، و«ملكوتك» للمحافظة على المصطلح الإنجيلي وسعته الدلالية. وُضعت علامتا الحاشية عند الموضعين اللذين تشرحانهما مباشرة.
