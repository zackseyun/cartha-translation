  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: ar
  text: حين يحرس الرجل القوي، وهو مسلَّح تسليحًا كاملًا، ساحته الخاصة[a]، تكون ممتلكاته في أمان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «فناءه» أو «داره»؛ فقد تدل الكلمة اليونانية على الساحة الداخلية، أو على المسكن وما يحيط به.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «في سلام».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: حين
  rationale: تقدّم مشهدًا زمنيًا ذا طابع عام، و«حين» عربية طبيعية موجزة تحافظ على هذا المعنى.
- source_word: ὁ ἰσχυρός
  choice: الرجل القوي
  rationale: الصفة المعرّفة مستعملة استعمال الاسم وتشير بصيغتها اليونانية إلى شخص مذكر مفرد؛ وهذه الصياغة واضحة وتحفظ صورة المثل.
- source_word: καθωπλισμένος
  choice: كاملُ التسليح
  rationale: اسم فاعل تام يدل على حالة ناجمة عن اكتمال التسلّح، فتنقل العبارة استعداده القائم من غير إطالة.
- source_word: φυλάσσῃ
  choice: يحرس
  rationale: ينقل معنى المراقبة والحماية المستمرة في المشهد من غير إضافة تفسيرية.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: ساحتَه الخاصة
  rationale: «ساحة» تنقل المعنى المباشر لـ αὐλή بوصفها فناءً أو ساحةً تابعة للمسكن، و«الخاصة» تُظهر توكيد ἑαυτοῦ. ويُذكر اتساع الدلالة في الحاشية.
- source_word: ἐν εἰρήνῃ
  choice: في أمان
  rationale: العبارة اليونانية تعني حرفيًا «في سلام»، لكنها هنا تصف حال الممتلكات من حيث السلامة وعدم التعرض؛ فـ«في أمان» طبيعية في العربية، مع حفظ اللفظ الحرفي في الحاشية.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ممتلكاته
  rationale: تشير العبارة الاسمية إلى ما يملكه الشخص من أمتعة أو أموال، و«ممتلكاته» واضحة وشاملة.
theological_decisions:
- issue: الدلالة المجازية للرجل القوي في السياق
  choice: الإبقاء على صورة «الرجل القوي» من غير التصريح بهويته في متن الآية
  alternative: تفسير الرجل القوي صراحةً بأنه الشيطان
  rationale: تعرض الآية نفسها صورةً تمثيلية، أما السياق المحيط فيوجّه إلى مدلولها؛ والتصريح بالهوية داخل النص يحسم ما أبقته صياغة الآية ضمن الصورة المجازية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ بناء الصورة التمثيلية، واستُعملت صياغة طبيعية للأمان مع توثيق التعبير اليوناني الحرفي في الحاشية.
