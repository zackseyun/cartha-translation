base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: ar
  text: 'وأنا أقول لكم[a]: اسألوا تُعطَوا؛ اطلبوا تجدوا؛ اقرعوا يُفتَح لكم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بإظهار ما قد تدل عليه صيغ الأمر المضارع في اليونانية: «داوموا على السؤال... واصلوا الطلب... استمروا في القرع».'
    reason: بديل معجمي يوضح احتمال الاستمرار أو التكرار من غير فرضه في المتن.
lexical_decisions:
- source_word: Κἀγὼ ὑμῖν λέγω
  choice: وأنا أقول لكم
  rationale: تحفظ «الواو» صلة الكلام بما سبقه، ويبرز الضمير المنفصل «أنا» التأكيد الموجود في Κἀγώ، مع صياغة عربية طبيعية ومهيبة.
- source_word: αἰτεῖτε
  choice: اسألوا
  rationale: أمر مباشر يحتمل في اليونانية الاستمرار أو التكرار، لكن صيغة الأمر العربية البسيطة تحفظ هذا الاحتمال من غير حسم زائد؛ ويبيّن الهامش الوجه المستمر.
- source_word: δοθήσεται ὑμῖν
  choice: يُعطَ لكم
  rationale: مبني للمجهول يحافظ على عدم ذكر الفاعل صراحة، كما في اليونانية، وعلى اتجاه العطية إلى المخاطَبين.
- source_word: ζητεῖτε
  choice: اطلبوا
  rationale: تنقل معنى السعي والبحث بلفظ عربي مألوف يحتفظ بالمجال الحرفي والمجازي.
- source_word: εὑρήσετε
  choice: تجدوا
  rationale: جواب مباشر موازٍ للأمر السابق؛ وحذف «سوف» يجعل التوازي العربي موجزًا وقويًا من غير تغيير دلالة الوعد المستقبلية في السياق.
- source_word: κρούετε
  choice: اقرعوا
  rationale: «اقرعوا» هو اللفظ العربي الدقيق للطرق على الباب، ويحفظ الصورة المجازية وإيجاز الأصل.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: يُفتَح لكم
  rationale: يحفظ المبني للمجهول ويترك الشيء المفتوح غير مصرّح به، كما في الأصل، مع فهم الباب من فعل القرع.
theological_decisions:
- issue: دلالة صيغ الأمر المضارع αἰτεῖτε، ζητεῖτε، κρούετε من جهة الاستمرار أو التكرار
  choice: 'صيغ أمر بسيطة: «اسألوا... اطلبوا... اقرعوا»'
  alternative: «داوموا على السؤال... واصلوا الطلب... استمروا في القرع»
  rationale: قد توحي صيغ المضارع اليونانية بفعل متكرر أو مستمر، لكن التصريح بذلك في المتن قد يحسم ما يظل محتملًا من جهة الجانب الفعلي؛ لذلك تُحفظ الصيغة المباشرة ويُذكر الوجه الآخر في الهامش.
- issue: الفاعل الضمني في المبني للمجهول «يُعطَ» و«يُفتَح»
  choice: الإبقاء على المبني للمجهول من غير تسمية الفاعل
  alternative: «يعطيكم الله» و«يفتح الله لكم»
  rationale: السياق اللاهوتي يشير إلى الله، لكن النص اليوناني لا يسمّيه في هاتين العبارتين؛ فعدم التصريح به يحفظ صياغة المصدر ولا يضيف تفسيرًا إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. روعي التوازي الثلاثي والإيجاز البلاغي في الأصل، واستُخدم «اقرعوا» لدقة صورة الطرق على الباب. وُضع مؤشر الهامش بعد العبارة التمهيدية كما في طبقة الاستشارة الإنجليزية، مع كون الهامش متعلقًا بصيغ الأوامر الثلاثة.
