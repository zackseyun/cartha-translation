source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: ar
  text: 'ولمّا رأياه، دُهِشا، فقالت له أمّه: «يا ولدي، لماذا فعلت بنا هكذا؟ ها إنّ أباك وأنا كنّا نبحث عنك ونحن متألّمان[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ونحن في كرب» أو «بألم شديد»؛ فاللفظة اليونانية تدل على ألم نفسي أو معاناة شديدة أثناء البحث.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: ولمّا رأياه
  rationale: صيغ اسم الفاعل الماضي في عبارة زمنية عربية طبيعية، مع الحفاظ على تعاقب الحدثين.
- source_word: ἐξεπλάγησαν
  choice: دُهِشا
  rationale: ينقل شدة المفاجأة والانفعال من غير مبالغة تفسيرية.
- source_word: Τέκνον
  choice: يا ولدي
  rationale: نداء حنون طبيعي على لسان الأم؛ والسياق يحدد أن المخاطَب ابنها، مع أن اللفظة اليونانية في ذاتها تعني «ولد/طفل».
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: لماذا فعلت بنا هكذا؟
  rationale: يحفظ صيغة العتاب ودلالة ἡμῖν العلاقية، ويأتي بأسلوب عربي واضح قريب من تركيب الأصل.
- source_word: ἰδοὺ
  choice: ها إنّ
  rationale: أداة تنبيه وتوكيد طبيعية في العربية المعاصرة الرصينة.
- source_word: ὁ πατήρ σου
  choice: أباك
  rationale: يحفظ التعبير الصريح في كلام مريم من غير إضافة وصف تفسيري مثل «الأرضي».
- source_word: ὀδυνώμενοι
  choice: ونحن متألّمان
  rationale: يحفظ صورة اسم الفاعل ودلالته على الألم النفسي والكرب المصاحب للبحث، بدل اختزاله في مجرد القلق.
- source_word: ἐζητοῦμέν σε
  choice: كنّا نبحث عنك
  rationale: الماضي الناقص اليوناني يدل على بحث مستمر في الزمن الماضي؛ و«كنّا نبحث» يؤدي ذلك طبيعيًا بالعربية.
theological_decisions:
- issue: وصف يوسف بأنه أبو يسوع مع ورود بنوّة يسوع الإلهية في السياق
  choice: الإبقاء على «أباك» بلا قيد
  alternative: أباك الأرضي
  rationale: النص ينقل كلام مريم العائلي المألوف كما هو، وإضافة «الأرضي» تحسم توترًا يتركه السرد قائمًا وتزيد على الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «يا ولدي» بوصفه نداءً أموميًا طبيعيًا، وحُفظت نبرة العتاب والألم من غير إدخال تفسير عقائدي في المتن.
