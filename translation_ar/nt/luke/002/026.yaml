  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: ar
  text: وكان الروح القدس قد أوحى إليه أنه لن يرى الموت قبل أن يرى مسيح الرب[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ممسوح الرب»، وهي صياغة تُبرز المعنى الاشتقاقي للقب اليوناني Χριστός.'
    reason: توضيح المعنى الاشتقاقي للقب مع الحفاظ على «مسيح الرب» في المتن.
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: قد أُوحي إليه
  rationale: يدل الفعل في صيغة المبني للمجهول هنا على تلقي إبلاغ إلهي؛ و«أُوحي إليه» عربية واضحة وموجزة، مع ذكر الروح القدس صراحة بوصفه مصدر الإبلاغ.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: من الروح القدس
  rationale: تدل ὑπό مع المضاف إليه على الفاعل أو المصدر الشخصي. وتعبير «من الروح القدس» طبيعي في العربية ويحفظ إسناد الإعلان إليه.
- source_word: μὴ ἰδεῖν θάνατον
  choice: لن يرى الموت
  rationale: يحفظ الصورة الأصلية «يرى الموت» بدل تفسيرها مباشرة بمعنى «يموت»، وهي عبارة مفهومة في السياق العربي الكتابي.
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: قبل أن يرى
  rationale: ينقل بوضوح وقوع رؤية المسيح قبل الموت، دون إثقال العبارة العربية بصيغة زمنية لا تحتاج إليها.
- source_word: τὸν χριστὸν κυρίου
  choice: مسيح الرب
  rationale: Χριστός لقب مسياني هنا، و«مسيح الرب» صياغة عربية طبيعية ودقيقة، تحتفظ بعلاقة الإضافة في اليونانية وبالخلفية الكتابية للقب.
- source_word: κυρίου
  choice: الرب
  rationale: يحفظ اللقب الإلهي κύριος بصيغته العربية المألوفة دون توسيع تفسيري.
theological_decisions:
- issue: ترجمة Χριστός حين يأتي لقبًا مسيانيًا
  choice: مسيح الرب
  alternative: الممسوح للرب
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός ويحفظ دلالته المسيانية؛ أما «الممسوح» فيوضح المعنى الاشتقاقي لكنه أقل طبيعية بوصفه لقبًا في هذا الموضع.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. حُفظت صورة «يرى الموت» والتعبير اللقبي «مسيح الرب»، مع صياغة طبيعية غير متكلفة.
