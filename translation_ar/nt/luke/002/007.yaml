  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: ar
  text: فولدت ابنها البكر، ولفَّته بقطع من القماش[a]، وأضجعته في مِذود[b]، لأنه لم يكن لهما مكان في غرفة الضيوف[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قمَّطته». يشير الفعل إلى لفّ الرضيع بقطع من القماش.'
    reason: lexical_alternative
  - marker: b
    text: المِذود هو موضع أو حوض يوضع فيه علف الحيوان.
    reason: lexical_clarification
  - marker: c
    text: 'تقليديًا: «النُّزُل» أو «الخان». يمكن للكلمة اليونانية أن تعني غرفة ضيوف أو موضع نزول؛ ويستعمل لوقا كلمة أخرى للنُّزُل التجاري في لوقا 10:34.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: ولدت
  rationale: تعبير عربي فصيح وطبيعي يؤدي المعنى المباشر للفعل في سياق الولادة.
- source_word: πρωτότοκον
  choice: البكر
  rationale: اللفظ العربي المألوف للدلالة على الأول في ترتيب الولادة، من غير تحميل السياق دلالات لاهوتية زائدة.
- source_word: ἐσπαργάνωσεν
  choice: لفَّته بقطع من القماش
  rationale: يوضح للقارئ الحديث طريقة لفّ الرضيع بالأقمطة، مع إثبات التعبير العربي التقليدي في الحاشية.
- source_word: ἀνέκλινεν
  choice: أضجعته
  rationale: ينقل وضع الطفل مستلقيًا، وهو أدق سياقيًا من مجرد «وضعته» وطبيعي في العربية الفصحى.
- source_word: φάτνῃ
  choice: مِذود
  rationale: لفظ عربي معروف لموضع علف الحيوان أو معلفه؛ وتوضح الحاشية مدلوله الحسي للقارئ.
- source_word: τόπος
  choice: مكان
  rationale: يحافظ على المعنى العام للكلمة اليونانية، أي عدم وجود حيز متاح لهما.
- source_word: καταλύματι
  choice: غرفة الضيوف
  rationale: يعكس استعمال الكلمة لموضع نزول أو غرفة ضيافة، ويتفق مع استعمالها في لوقا 22:11، من غير افتراض خان تجاري.
theological_decisions:
- issue: هل تُفهم κατάλυμα على أنها خان تجاري أم موضع ضيافة في منزل؟
  choice: غرفة الضيوف
  alternative: النُّزُل أو الخان
  rationale: اليونانية لا تفرض معنى الخان التجاري؛ فلوقا يستعمل πανδοχεῖον للنُّزُل في 10:34، ويستعمل κατάλυμα لغرفة الضيوف في 22:11. لذلك يحفظ هذا الاختيار دلالة النص من غير إدخال مشهد تقليدي لا يوجبه اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «المِذود» لوجازته ورسوخه مع شرحه في الحاشية، و«غرفة الضيوف» بدل اللفظ التقليدي الذي قد يوحي بخان تجاري لا يقتضيه الأصل.
