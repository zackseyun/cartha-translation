  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: ar
  text: وكان يسوع يزداد حكمةً وقامةً[a] وحظوةً عند الله والناس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سنًّا» أو «نضجًا»؛ فالكلمة اليونانية (ἡλικία) تحتمل هذه المعاني أيضًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτεν
  choice: كان يزداد
  rationale: صيغة الماضي الناقص تدل على نمو متواصل مع مرور الزمن؛ وينقل تركيب «كان يزداد» هذا الجانب الاستمراري بوضوح وطبيعية.
- source_word: σοφίᾳ
  choice: حكمةً
  rationale: المقابل العربي المباشر والطبيعي، ويشمل الفهم والتمييز وحسن التصرف.
- source_word: ἡλικίᾳ
  choice: قامةً
  rationale: يمكن أن تدل الكلمة اليونانية على القامة الجسدية أو السن، وربما النضج. اختيرت «قامة» لأنها تعبّر بوضوح عن نمو يسوع البشري الظاهر، مع حفظ الاحتمالات الأخرى في الحاشية.
- source_word: χάριτι
  choice: حظوةً
  rationale: في اقترانها بعبارة «عند الله والناس»، تدل الكلمة هنا على الرضا والقبول لا على «النعمة» بوصفها مصطلحًا لاهوتيًا مجردًا.
- source_word: παρὰ θεῷ
  choice: عند الله
  rationale: تنقل معنى العلاقة والتقدير في نظر الله، وتنسجم طبيعيًا مع العبارة الموازية «والناس».
- source_word: ἀνθρώποις
  choice: الناس
  rationale: الجمع اليوناني يشير هنا إلى البشر عمومًا، و«الناس» هو المقابل العربي الدقيق والطبيعي من غير إيحاء باختصاص المعنى بالذكور.
theological_decisions:
- issue: نمو يسوع البشري الحقيقي وعلاقته بهويته المسيانية
  choice: تُرجم النص بوضوح على أنه يصف نمو يسوع المتواصل في الحكمة والقامة والحظوة.
  alternative: صياغة تخفف معنى نمو يسوع أو تحجبه لتجنب التوتر اللاهوتي.
  rationale: يقرر النص اليوناني صراحة أن يسوع كان يتقدم؛ لذلك يُحفظ وصف نموه الإنساني الحقيقي من غير تخفيف أو تفسير مذهبي مضاف.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموقرة. استُعمل «كان يزداد» لإبراز الاستمرار، و«حظوة» للدلالة على القبول والرضا في هذا السياق العلاقي.
