  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: ar
  text: وإذا بملاكٍ من عند الرب وقف عندهم[a]، وأشرق مجد الرب حولهم، فخافوا خوفًا عظيمًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ظهر لهم» أو «وقف بجانبهم». يمكن للفعل اليوناني أن يدل على حضور مفاجئ، وكذلك على الوقوف بالقرب من شخص.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «خافوا خوفًا عظيمًا»، وهو أسلوب يفيد شدة الخوف والهلع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: ملاك من عند الرب
  rationale: يدل ἄγγελος في هذا السياق على كائن سماوي، لا على رسول بشري؛ وصيغة الإضافة غير المعرّفة لا تقتضي «ملاك الرب» بوصفه ملاكًا معيّنًا، لذلك توضح «من عند الرب» المعنى غير المحدد طبيعيًا في العربية.
- source_word: ἐπέστη αὐτοῖς
  choice: وقف بهم
  rationale: يحفظ التعبير معنى الوقوف بالقرب منهم، مع بقاء دلالة الحضور المفاجئ التي يعززها الأسلوب «وإذا»؛ وللفعل أيضًا احتمال «حضر إليهم» أو «وقف بجانبهم».
- source_word: δόξα κυρίου
  choice: مجد الرب
  rationale: ترجمة مباشرة تحفظ الثقل اللاهوتي لـ δόξα، الذي يشمل الجلال الإلهي المتجلي بالنور.
- source_word: περιέλαμψεν αὐτούς
  choice: أضاء ... من حولهم
  rationale: ينقل معنى إحاطة الضوء بهم بعبارة عربية واضحة وقريبة من تركيب الأصل.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: خافوا خوفًا عظيمًا
  rationale: يحفظ المفعول المطلق العربي بنية الفعل مع الاسم المشتق منه في اليونانية، وينقل شدة الخوف بأسلوب عربي طبيعي فصيح.
theological_decisions:
- issue: ترجمة κύριος في عبارتي الإضافة
  choice: الرب
  alternative: السيد
  rationale: المرجع هنا إلهي بوضوح، و«الرب» يحفظ الاستعمال الكتابي واللاهوتي دون إدخال تخصيص طائفي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «وإذا» لإبراز عنصر الظهور المفاجئ الذي يحمله الفعل في السياق، وحُفظت بنية «خافوا خوفًا عظيمًا» لأنها طبيعية في العربية وقريبة من الأصل.
