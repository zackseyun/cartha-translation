base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: ar
  text: وفي تلك الساعة عينها[a]، تقدَّمت وأخذت تشكر الله[b] وتتحدث إلى جميع الذين كانوا ينتظرون فداء أورشليم عنه[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وفي الساعة نفسها».
    reason: lexical_alternative
  - marker: b
    text: أو «كانت تحمد الله» أو «كانت تشكر الله».
    reason: lexical_alternative
  - marker: c
    text: يعود الضمير «عنه» بحسب السياق، على الأرجح، إلى الطفل يسوع، مع أن «الله» هو أقرب اسم صريح يسبقه في اليونانية.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: في تلك الساعة عينها
  rationale: تؤدي العبارة معنى الزمن الذي وقع فيه الحدث، وتُبرز «عينها» قوة التوكيد في αὐτῇ من غير أن تحوّلها إلى لحظة غير محددة.
- source_word: ἐπιστᾶσα
  choice: تقدَّمت
  rationale: يفيد اسم الفاعل هنا وصول حنّة واقترابها من المشهد؛ و«تقدمت» تعبير عربي طبيعي لا يحدد هيئة الاقتراب بأكثر مما يسمح به الأصل.
- source_word: ἀνθωμολογεῖτο
  choice: أخذت تشكر
  rationale: يمكن أن يدل الفعل على الشكر أو الحمد الموجَّه إلى الله. وتؤدي «أخذت» بدء الفعل عقب تقدمها، مع بقاء دلالة الاستمرار التي يحملها الماضي الناقص في السياق.
- source_word: τῷ θεῷ
  choice: الله
  rationale: هذا هو المقابل العربي الطبيعي للاسم المعرّف في هذا السياق، وتتعدى «تشكر» إليه مباشرة في العربية.
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: تتحدث عنه
  rationale: تحافظ الصياغة على دلالة الاستمرار وعلى الضمير الغامض نسبيًا في اليونانية، بدل استبداله باسم تفسيري.
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: إلى جميع الذين كانوا ينتظرون
  rationale: يفيد προσδέχομαι انتظارًا مشوبًا بالتطلع والرجاء، و«ينتظرون» واضحة وطبيعية في العربية المعاصرة.
- source_word: λύτρωσιν
  choice: فداء
  rationale: يحفظ «فداء» الثقل الخلاصي للفظ λύτρωσις، مع إمكان دلالته على التحرير والإنقاذ دون حصر العبارة في بُعد سياسي أو روحي وحده.
- source_word: Ἰερουσαλήμ
  choice: أورشليم
  rationale: الاسم الكتابي العربي الشائع للمدينة.
theological_decisions:
- issue: مرجع الضمير في περὶ αὐτοῦ («عنه»)
  choice: الإبقاء على الضمير «عنه»، ويُفهم من السياق على الأرجح أنه يعود إلى الطفل يسوع.
  alternative: قد يُفهم الضمير على أنه يعود إلى الله، لأنه أقرب اسم صريح سابق له في التركيب اليوناني.
  rationale: محور المشهد هو الطفل، وحديث حنّة إلى منتظري الفداء يُرجّح الإشارة إليه؛ لكن إبقاء الضمير يصون غموض الأصل ولا يحسم المرجع داخل المتن.
- issue: معنى «فداء أورشليم»
  choice: إبقاء العبارة «فداء أورشليم» من غير توسيع تفسيري.
  alternative: يمكن فهمها بمعنى «تحرير أورشليم» أو خلاص شعب الله المرتبط بأورشليم.
  rationale: قد تشمل العبارة عمل الله الخلاصي المرتقب لشعبه بأبعاده الجماعية والأخروية، لذلك لا تُقصر على معنى سياسي أو روحي بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «عينها» للتوكيد، و«أورشليم» للاسم الكتابي المألوف، مع تجنب شرح المقصود بالفداء أو حسم مرجع الضمير داخل المتن.
