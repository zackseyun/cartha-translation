  text: καὶ αὐτοὶ οὐ συνῆκαν τὸ ῥῆμα ὃ ἐλάλησεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/050.yaml
  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: ar
  text: وَهُمَا لَمْ يَفْهَمَا الْقَوْلَ الَّذِي قَالَهُ لَهُمَا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكلمة»، أو «ما قاله»، أو «الأمر».'
    reason: يعرض البدائل الدلالية الممكنة للاسم اليوناني ῥῆμα، الذي قد يدل على قول منطوق أو كلمة أو أمر بحسب السياق.
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: أداة ربط تحفظ تتابع السرد من غير إضافة معنى استدراكي غير صريح في اليونانية.
- source_word: αὐτοὶ
  choice: هُمَا
  rationale: يعود الضمير في السياق إلى والدي يسوع، وهما اثنان؛ وإظهاره في العربية يحفظ وجود الضمير الصريح في اليونانية.
- source_word: οὐ συνῆκαν
  choice: لَمْ يَفْهَمَا
  rationale: ينقل المعنى المباشر للفعل συνίημι بصياغة عربية طبيعية، من غير تلطيفه إلى عدم الفهم الكامل أو تحويله إلى عدم القبول.
- source_word: τὸ ῥῆμα
  choice: الْقَوْلَ
  rationale: يشير ῥῆμα هنا إلى ما نطق به يسوع للتو؛ و«القول» عربي طبيعي يحفظ صلته بالكلام، مع إبقاء البدائل الدلالية في الحاشية.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: الَّذِي قَالَهُ لَهُمَا
  rationale: صياغة عربية واضحة وطبيعية للصلة، وتحفظ كون الكلام موجَّهًا إلى الوالدين كليهما.
theological_decisions:
- issue: تصوير استجابة والدي يسوع
  choice: التصريح بأنهما لم يفهما قوله
  alternative: أنهما لم يفهما تمامًا، أو لم يقبلا قوله
  rationale: النص اليوناني يقرر عدم الفهم، ولا يصفه بأنه جزئي ولا يحوّله إلى رفض؛ وبذلك يبقى التوتر السردي المتعلق بهوية يسوع ورسالته من غير تفسير مذهبي مضاف.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم ضمير التثنية لأن المرجع في السياق هو والدا يسوع، واستُعمل «القول» لتجنب غرابة «العبارة التي تكلم بها» مع الحفاظ على دلالة الكلام المنطوق.
