  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἦλθεν ἐν τῷ πνεύματι εἰς τὸ ἱερόν· καὶ ἐν τῷ εἰσαγαγεῖν τοὺς γονεῖς τὸ παιδίον Ἰησοῦν τοῦ ποιῆσαι αὐτοὺς κατὰ τὸ εἰθισμένον τοῦ νόμου περὶ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: ar
  text: فجاء في الروح[a] إلى الهيكل، وحين أدخل الوالدان[b] الطفل يسوع، ليعملا له بحسب ما جرت به عادة الشريعة،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالروح». يحتمل التعبير اليوناني الوجهين، لكن «في الروح» أقرب إلى لفظ الأصل وإلى تشديد لوقا المتكرر في هذا السياق على الروح القدس.'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «الوالدان». يستعمل لوقا هنا لغة الأسرة العادية عن مريم ويوسف في رعايتهما ليسوع.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: في الروح
  rationale: يحافظ على صورة التعبير اليوناني، ويرجّح السياق القريب الإشارة إلى الروح القدس، مع إبقاء احتمال الدلالة الأداتية في الحاشية.
- source_word: ἱερόν
  choice: الهيكل
  rationale: اللفظ اليوناني يدل على مجمّع الهيكل عمومًا لا على القدس الداخلي خاصة؛ و«الهيكل» هو المقابل العربي المألوف والواضح في هذا السياق.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: وحين أدخل
  rationale: المصدر المعرّف المسبوق بـἐν ذو دلالة زمنية هنا، وصيغة «حين أدخل» تؤديها بعربية طبيعية.
- source_word: γονεῖς
  choice: الوالدان
  rationale: هذا هو المعنى المباشر للفظ، ويصف مريم ويوسف بلغة الأسرة العادية من منظور السرد، من غير تقرير إضافي بشأن الأبوة البيولوجية.
- source_word: παιδίον Ἰησοῦν
  choice: الطفل يسوع
  rationale: παιδίον يدل هنا على طفل صغير، والتركيب العربي يحفظ اقتران الوصف بالاسم.
- source_word: τοῦ ποιῆσαι αὐτοὺς ... περὶ αὐτοῦ
  choice: ليعملا له
  rationale: المصدر يفيد الغاية، وαὐτούς فاعله العائد إلى الوالدين، أما περὶ αὐτοῦ فيبين أن العمل متعلق بيسوع؛ والصياغة العربية توضح هذه العلاقات بإيجاز.
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: بحسب ما جرت به عادة الشريعة
  rationale: εἰθισμένον يدل على الأمر المعتاد أو المتبع، وهذه الصياغة واضحة وتحفظ صلته بالشريعة.
theological_decisions:
- issue: مرجع «الروح» في مجيء سمعان
  choice: فهمه على أنه الروح القدس مع ترجمة العبارة «في الروح»
  alternative: روح سمعان أو حالته الباطنية؛ أو ترجمة العبارة «بالروح»
  rationale: تكرار ذكر الروح القدس في لوقا 2:25–27 يرجح هذا الفهم، لكن الحاشية تحفظ الاحتمال النحوي في دلالة حرف الجر.
- issue: وصف مريم ويوسف بأنهما «الوالدان»
  choice: ترجمة γονεῖς مباشرة إلى «الوالدان»
  alternative: «القائمان على رعايته» أو «يوسف ومريم»
  rationale: ينبغي إبقاء لغة الأسرة العادية التي يستعملها لوقا، من غير إضعاف للنص ولا إضافة إليه؛ ولا يلزم من هذا الوصف نفي الحبل العذراوي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على بنية الآية المتصلة وعلى غموض ἐν الدلالي، مع صياغة الغاية والعبارة الشرعية بأسلوب عربي طبيعي.
