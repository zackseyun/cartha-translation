  yaml_path: translation/nt/luke/002/045.yaml
  text: And when they did not find him[a], they returned to Jerusalem, searching for him.
translation:
  language: ar
  text: ولمّا لم يجداه، رجعا إلى أورشليم يبحثان عنه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل الآية بسياق السرد السابق ويحافظ على تتابع لوقا القصصي.
- source_word: μὴ εὑρόντες
  choice: لمّا لم يجداه
  rationale: يؤدي معنى اسم الفاعل الماضي المنفي بوصفه ظرفًا زمانيًا، بصياغة عربية طبيعية وواضحة، مع تثنية الفعل لأن المقصود مريم ويوسف.
- source_word: ὑπέστρεψαν
  choice: رجعا
  rationale: ينقل معنى الرجوع، وجاء بصيغة المثنى بحسب مرجع الفاعل في السياق العربي.
- source_word: εἰς Ἰερουσαλήμ
  choice: إلى أورشليم
  rationale: «إلى» هي المقابل العربي الطبيعي لحرف الاتجاه مع اسم المدينة، و«أورشليم» الصيغة الكتابية العربية المألوفة.
- source_word: ἀναζητοῦντες
  choice: يبحثان عنه
  rationale: ينقل معنى البحث الفعلي المتواصل بعبارة عربية حديثة واضحة، مع تثنية الفعل وفق الفاعل.
- source_word: αὐτόν
  choice: عنه
  rationale: ضمير مذكر مفرد يعود إلى يسوع، وقد اتصل بحرف الجر الذي يقتضيه الفعل «يبحث» في العربية.
