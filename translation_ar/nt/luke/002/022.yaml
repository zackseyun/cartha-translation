lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: اكتملت
  rationale: يفيد الفعل هنا بلوغ مدة زمنية تمامها؛ و«اكتملت» عربية طبيعية واضحة وتحفظ المعنى الزمني.
- source_word: καθαρισμοῦ
  choice: تطهير
  rationale: يشير في السياق إلى التطهير الطقسي المتصل بالولادة وفق شريعة موسى، و«تطهير» هو المقابل العربي الواضح في هذا المقام الشرعي.
- source_word: αὐτῶν
  choice: هما
  rationale: النص اليوناني المعطى يقرأ ضمير الجمع «αὐτῶν». ولأن المرجعين الظاهرين في السياق هما يوسف ومريم، صيغ الضمير في العربية بصيغة المثنى من غير تسوية الإشكال التفسيري.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: بحسب شريعة موسى
  rationale: تحفظ العبارة معنى المطابقة لما تقضي به الشريعة، وتأتي بصياغة عربية فصيحة ومباشرة.
- source_word: ἀνήγαγον
  choice: صعدا به
  rationale: يحفظ الفعل دلالة الصعود إلى أورشليم، ويعبّر المثنى عن الفاعلين المفهومين من السياق.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الشائعة لاسم المدينة.
- source_word: παραστῆσαι
  choice: ليقدّماه
  rationale: يفيد الفعل تقديم شخص أمام الله في سياق ديني وشرعي، و«يقدّماه» طبيعي ودقيق.
- source_word: κυρίῳ
  choice: للرب
  rationale: ينقل κύριος باللقب الإلهي العربي المألوف «الرب» ويحفظ النبرة التعبدية.
theological_decisions:
- issue: عدد الضمير في عبارة «أيام تطهيرهما»
  choice: إبقاء قراءة الجمع في النص بصيغة المثنى العربية «تطهيرهما»
  alternative: «أيام تطهيرها»
  rationale: النص اليوناني المعطى يقرأ αὐτῶν، أي ضمير الجمع. لذلك تُحفظ هذه القراءة في المتن، مع إثبات القراءة المفردة في الحاشية بدل حسم التوتر النصي أو التفسيري ضمنًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم المثنى لأن العربية تميّز بين الاثنين والجمع، وهو الأنسب للضمير اليوناني الجمع في سياقه المباشر. ووُضع مؤشر الحاشية بعد «شريعة موسى» اقتداءً بطبقة المراجعة الإنجليزية، مع كون الحاشية متعلقة بلفظ «تطهيرهما».
