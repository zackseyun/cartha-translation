  terminology: «تطهير»، و«شريعة موسى»، و«أورشليم»، و«الرب» مقابلات مناسبة للسياق الطقسي والكتابي. وينبغي نقل الحاشية إلى لفظ «تطهيرهم» لأنه موضع المتغير النصي، لا إلى «موسى».
