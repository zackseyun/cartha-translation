  rationale: يُبقي التعديل قراءة الجمع التي في النص اليوناني من دون تحويلها إلى مثنّى عربي يعيّن عدد الفاعلين، ويحافظ على دلالة الصعود إلى أورشليم وعلى السجل الشرعي الطقسي. كما يصحح مرساة الحاشية لتتصل مباشرة بالمتغير النصي.
