  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: ar
  text: 'فقال لهما: «لماذا كنتما تبحثان عني؟ أما كنتما تعلمان أنه لا بد أن أكون في بيت أبي[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنه لا بد أن أكون في ما يخص أبي»، أو «أن أنشغل بشؤون أبي». فالعبارة اليونانية ناقصة، ويمكن أن تشير إلى بيت الآب أو إلى ما يخصه وشؤونه.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: لماذا
  rationale: تؤدي معنى السؤال عن السبب بصياغة عربية طبيعية ومباشرة.
- source_word: ἐζητεῖτέ
  choice: كنتما تبحثان عني
  rationale: الفعل في سياق بحث الوالدين المستمر عن يسوع، والمخاطَب مثنى في العربية.
- source_word: οὐκ ᾔδειτε
  choice: أما كنتما تعلمان
  rationale: يحافظ على السؤال الاستنكاري وعلى معنى المعرفة أو الإدراك، مع مطابقة المثنى.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: في بيت أبي
  rationale: العبارة اليونانية محذوفة الموصوف حرفيًا، وسياق الهيكل يرجّح معنى البيت، مع حفظ احتمال الشؤون في الحاشية.
- source_word: δεῖ
  choice: لا بد أن
  rationale: تعبّر بوضوح عن الضرورة الملزمة التي يحملها اللفظ اليوناني.
- source_word: εἶναί με
  choice: أكون
  rationale: صياغة عربية طبيعية للمصدر مع فاعله في تركيب الضرورة.
- source_word: πατρός μου
  choice: أبي
  rationale: ينقل تعبير يسوع البنوي المباشر بلا إضافة تفسيرية إلى المتن.
theological_decisions:
- issue: دلالة العبارة الناقصة ἐν τοῖς τοῦ πατρός μου
  choice: في بيت أبي
  alternative: في ما لأبي؛ أو منشغلًا بشؤون أبي
  rationale: وجود يسوع في الهيكل يجعل معنى البيت مرجحًا سياقيًا، لكن اليونانية تحتمل أيضًا شؤون الآب، ولذلك حُفظ هذا الاحتمال في الحاشية.
- issue: مرجع «أبي»
  choice: الإبقاء على «أبي» كما وردت
  alternative: إضافة «الله» تفسيرًا
  rationale: السياق يبيّن أن الإشارة إلى الله لا إلى يوسف، لكن الترجمة لا تضيف إلى كلام يسوع ما ليس ملفوظًا في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم المثنى لأن الخطاب موجّه إلى مريم ويوسف، ووُضعت علامة الحاشية بعد الجملة التي تتعلق بها.
