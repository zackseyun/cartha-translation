  rationale: يحافظ التعديل على قراءة εὐδοκίας بوصفها متعلقة بالناس، فلا يجعل «المسرة/الرضا» بندًا ثالثًا مستقلًا كما في القراءة الاسمية المختلفة. وتعبير «الذين هم موضع رضاه» يوضح في العربية أن الرضا واقع عليهم، مع أن الضمير يستمد مرجعه من «الله» المذكور في صدر الآية ولا يفرض تفصيلًا عقديًا عن سبب هذا الرضا أو مداه. كما أبقيت حاشية القراءة النصية المختلفة ومثبتَي الحاشيتين.
