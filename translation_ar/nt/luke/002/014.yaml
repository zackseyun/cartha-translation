  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: ar
  text: «المجد لله في الأعالي، وعلى الأرض سلام بين الناس الذين هم موضع رضاه».[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وعلى الأرض سلام للناس الذين يرضى عنهم».'
    reason: lexical_alternative
  - marker: b
    text: 'تقرأ بعض المخطوطات: «وعلى الأرض السلام، والمسرة بين الناس».'
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: المجد
  rationale: يحفظ صيغة الإسناد التمجيدية ووقع العبارة الليتورجي، من غير تحويلها إلى فعل تفسيري مثل «سبّحوا».
- source_word: ἐν ὑψίστοις
  choice: في الأعالي
  rationale: تعبير عربي موجز وطبيعي يدل على أعلى المقامات السماوية، ويحافظ على المقابلة المكانية مع «على الأرض».
- source_word: θεῷ
  choice: لله
  rationale: اللام تؤدي معنى الداتيف في إسناد المجد إلى الله بصورة عربية سليمة.
- source_word: ἐπὶ γῆς
  choice: على الأرض
  rationale: ترجمة مكانية مباشرة تقابل «في الأعالي».
- source_word: εἰρήνη
  choice: السلام
  rationale: يحفظ المعنى الكتابي الواسع للسلام دون تضييقه إلى مجرد غياب النزاع.
- source_word: ἐν ἀνθρώποις
  choice: بين أناس
  rationale: «أناس» تشمل البشر من غير إيحاء بأن المقصود الذكور وحدهم، وهي طبيعية في العربية المعاصرة.
- source_word: εὐδοκίας
  choice: الرضا
  rationale: 'تحافظ على صيغة المضاف إليه في القراءة اليونانية المعتمدة وعلى قدر من غموضها: أهو الرضا الإلهي الواقع عليهم أم وصف لهم، من غير إدخال ضمير ملكية غير مصرّح به.'
theological_decisions:
- issue: دلالة المضاف إليه εὐδοκίας في البشارة الملائكية
  choice: «بين أناس الرضا» بما يربط السلام بأناس يتصفون بالرضا أو يكونون موضعه، مع إبقاء جهة الرضا غير مصرّح بها في المتن
  alternative: '«بين أناس يرضى عنهم»؛ أو بحسب القراءة الاسمية المختلفة: «وعلى الأرض السلام، والمسرة بين الناس»'
  rationale: نص SBLGNT يقرأ εὐδοκίας بصيغة المضاف إليه، لا εὐδοκία بصيغة الرفع. لذلك ينبغي أن تتعلق الكلمة بـ«أناس» بدل جعلها بندًا ثالثًا مستقلًا. والصياغة المختارة لا تستورد منظومة عقدية بشأن الاختيار، كما لا تضيف ضميرًا غير موجود صراحة.
translation_notes:
  register: عربية فصحى حديثة، موجزة ووقورة. استُعملت «أناس» للدلالة العامة على البشر، لذلك لا حاجة إلى حاشية ثقافية خاصة بالنوع الاجتماعي. وُضعت علامتا الحاشيتين في المتن كما يلزم.
