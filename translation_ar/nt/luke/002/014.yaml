  source_fidelity: 'الترجمة تعكس بدقة البنية الأساسية للآية: «المجد» لله في المجال العلوي، و«السلام» على الأرض. لكنها تحتاج إلى تعديل في العبارة الأخيرة؛ فـ«بين أناس الرضا» تركيب غير مستقر في العربية الحديثة وقد يُفهَم على أنه أناس يتصفون هم بالرضا، بدل أن يكونوا موضع الرضا الذي تشير إليه εὐδοκίας في السياق.'
