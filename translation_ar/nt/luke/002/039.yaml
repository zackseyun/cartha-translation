  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: ar
  text: ولما أتمّوا كل ما تقتضيه شريعة الرب[a]، رجعوا إلى الجليل، إلى بلدتهم[b] الناصرة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل ما كان وفق شريعة الرب».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «مدينتهم»؛ وقد تُستعمل الكلمة اليونانية أيضًا لبلدة، وكانت الناصرة تجمعًا سكانيًا صغيرًا.'
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: ولما
  rationale: تفيد الزمن الذي أعقب فيه الفعل الرئيس إتمام الأعمال المذكورة، وتحافظ على التعاقب من غير أن توحي بالفورية.
- source_word: ἐτέλεσαν
  choice: أتمّوا
  rationale: يدل الفعل هنا على إكمال الأعمال المطلوبة؛ و«أتمّوا» طبيعي ودقيق ولا يحمّله معنى لاهوتيًا زائدًا مثل «حقّقوا».
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: كل ما بحسب شريعة الرب
  rationale: صياغة قريبة من اليونانية وتحفظ اتساع العبارة بين ما يوافق الشريعة وما تقضي به، من غير إضافة «المطلوب» إلى المتن.
- source_word: νόμον κυρίου
  choice: شريعة الرب
  rationale: «شريعة» هي اللفظة العربية الطبيعية في سياق أحكام الله، والإضافة تنقل تركيب المضاف إليه اليوناني بوضوح.
- source_word: κυρίου
  choice: الرب
  rationale: ينقل κύριος بصيغته المعتادة، والمقصود هنا الله بوصف الشريعة شريعته.
- source_word: ἐπέστρεψαν
  choice: رجعوا
  rationale: تعبير عربي طبيعي ومناسب للسرد عن العودة إلى موطن سابق.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: إلى الجليل
  rationale: تنقل جهة الحركة إلى المقصد بصورة عربية مألوفة.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: إلى مدينتهم
  rationale: تحفظ المعنى المباشر لـ πόλις وضمير الملكية المؤكد؛ وتوضح الحاشية أن اللفظة قد تدل هنا على بلدة صغيرة.
- source_word: Ναζαρέθ
  choice: الناصرة
  rationale: الاسم العربي المعياري المعروف للمكان.
theological_decisions:
- issue: مرجع «الرب» في «شريعة الرب»
  choice: يشير «الرب» إلى الله، أي إلى الشريعة الإلهية الواردة في الأسفار المقدسة.
  alternative: لا توجد قراءة بديلة ذات أثر لاهوتي مهم في هذا السياق.
  rationale: العبارة اصطلاح كتابي يهودي مألوف، وصياغتها المباشرة تبرز طاعة الأسرة من غير استيراد استنتاجات عقائدية إضافية.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية رصينة. اختيرت «مدينتهم» في المتن للمحافظة على اللفظ اليوناني، مع بيان الحجم الفعلي للناصرة في الحاشية.
