  text: καὶ τοῦτο ὑμῖν ⸀τὸ σημεῖον, εὑρήσετε βρέφος ἐσπαργανωμένον ⸀καὶ κείμενον ἐν φάτνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: ar
  text: 'وهذه هي العلامة لكم: ستجدون رضيعًا مُقمَّطًا[a] ومستلقيًا في مِذود[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: ملفوفًا بأقمطة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: في معلف للدواب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: العلامة
  rationale: يدل اللفظ هنا على علامة مميِّزة يتعرّف بها الرعاة إلى الطفل، من غير أن يفرض النص وصفها بأنها معجزة أو برهان.
- source_word: εὑρήσετε
  choice: ستجدون
  rationale: ينقل صيغة المستقبل والخطاب للجمع نقلًا مباشرًا وطبيعيًا.
- source_word: βρέφος
  choice: رضيعًا
  rationale: يشير اللفظ إلى طفل بالغ الصغر، و«رضيع» فصيحة واضحة وأدق من اللفظ العام «طفل».
- source_word: ἐσπαργανωμένον
  choice: مُقمَّطًا
  rationale: ينقل فعل لفّ الرضيع بالقماط بإيجاز، مع شرح بديل أوضح في الحاشية.
- source_word: κείμενον
  choice: مضجعًا
  rationale: يصف حالة الرضيع وموضعه، لا مجرد الفعل السابق المتمثل في وضعه هناك.
- source_word: φάτνῃ
  choice: في مِذود
  rationale: «المِذود» هو المقابل العربي المألوف للوعاء الذي تأكل منه الدواب، مع توضيح معناه الحسي في الحاشية.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: وهذه هي العلامة لكم
  rationale: تحافظ الصياغة على الجملة الاسمية الموجزة في اليونانية، وتأتي طبيعية في العربية من غير ضرورة لإضافة فعل مستقبل غير مصرح به.
theological_decisions:
- issue: طبيعة العلامة المعطاة للرعاة
  choice: عرضها بوصفها علامة تعريفية
  alternative: فهمها أيضًا على أنها تأييد إلهي أوسع أو آية خارقة
  rationale: يركز السياق المباشر على ما سيمكّن الرعاة من التعرّف إلى الطفل. لذلك تُترك كلمة «العلامة» بلا توسع تفسيري، بحيث تظل الدلالة اللاهوتية الأوسع ممكنة من غير فرضها على النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «رضيع» للدقة، و«مُقمَّطًا» و«مِذود» للمحافظة على الصورة التاريخية الملموسة، مع حاشيتين تشرحان اللفظين الأقل تداولًا.
