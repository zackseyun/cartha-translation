  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: ar
  text: 'كما هو مكتوب في شريعة الرب: «كلُّ ذكرٍ يفتح الرحم يُدعى مقدَّسًا للرب».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي إن المولود الذكر البكر يُعَدّ مقدَّسًا، أو مكرَّسًا، للرب. قارن خروج 13: 2، 12.'
    reason: توضيح مدلول التعبير الكتابي «يفتح الرحم» وصلته بالتكريس للرب.
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: كما هو مكتوب
  rationale: صيغة عربية مألوفة للاقتباس من الكتاب، وتحفظ معنى المطابقة والقوة المستمرة لصيغة الفعل اليوناني التام المبني للمجهول.
- source_word: ἐν νόμῳ κυρίου
  choice: في شريعة الرب
  rationale: تشير العبارة إلى شريعة موسى بوصفها مرجعًا مكتوبًا؛ و«شريعة» أوضح في العربية المعاصرة من «ناموس»، مع نقل κύριος إلى «الرب».
- source_word: Πᾶν ἄρσεν
  choice: كلُّ ذكرٍ
  rationale: نقل مباشر للفظ اليوناني المذكر من غير إضافة «مولود» إلى المتن، وإن كان السياق يدل على المولود البكر.
- source_word: διανοῖγον μήτραν
  choice: يفتح الرحم
  rationale: يحفظ الصورة الكتابية التي تدل اصطلاحيًا على أول مولود يخرج من الرحم، من غير استبدالها بتفسير «البكر» في المتن.
- source_word: ἅγιον τῷ κυρίῳ κληθήσεται
  choice: يُدعى مقدَّسًا للرب
  rationale: يحفظ المبني للمجهول ومعنى ἅγιον الصريح، ويعبّر عن اختصاص المولود بالرب من غير إحلال تعبير تفسيري مثل «مكرَّس» محل لفظ القداسة.
theological_decisions:
- issue: نقل κύριος في اقتباس من شريعة إسرائيل
  choice: الرب
  alternative: الربّ بحروف أو صياغة مميزة للدلالة على الاسم الإلهي
  rationale: النص اليوناني يقرأ κύριος، لذلك تُنقل الكلمة كما هي إلى «الرب»، مع عدم استبدالها بصيغة مبنية مباشرة على النص العبري وراء الاقتباس.
- issue: لغة القداسة أم لغة التكريس التفسيرية
  choice: مقدَّسًا للرب
  alternative: مكرَّسًا للرب
  rationale: لفظة ἅγιον تعبّر صراحة عن القداسة؛ أما التكريس فهو تفسير صحيح محتمل لعلاقتها بالرب، لكنه لا ينبغي أن يحل محل اللفظ في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدمت النقطتان لتمييز صيغة التقديم عن نص الاقتباس، مع إبقاء التعبير التصويري «يفتح الرحم» وشرحه في الحاشية.
