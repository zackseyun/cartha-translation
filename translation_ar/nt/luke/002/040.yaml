  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: ar
  text: وكان الطفل ينمو ويتقوّى، ممتلئًا بالحكمة، وكانت نعمة الله[a] عليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رضا الله».'
    reason: بديل معجمي لـ χάρις يحفظ معنى الحظوة والقبول الإلهي في هذا السياق.
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: وكان الطفل
  rationale: «الطفل» يلائم سياق حداثة السن، والواو تنقل δέ بوصفها أداة وصل خفيفة في السرد.
- source_word: ηὔξανεν
  choice: ينمو
  rationale: صيغة الماضي الناقص اليونانية تدل على نمو متواصل؛ والمضارع بعد «كان» يؤدي هذا المعنى طبيعيًا بالعربية.
- source_word: ἐκραταιοῦτο
  choice: يتقوّى
  rationale: ينقل الفعل معنى ازدياد القوة تدريجيًا، كما تحافظ صيغة «كان... يتقوّى» على الجانب الاستمراري.
- source_word: πληρούμενον σοφίᾳ
  choice: ممتلئًا حكمة
  rationale: ينقل اسم الفاعل اليوناني حالًا مصاحبة لنمو الطفل، وتُفهم «حكمة» بوصفها مضمون الامتلاء.
- source_word: χάρις θεοῦ
  choice: نعمة الله
  rationale: «نعمة» المقابل العربي الواسع والطبيعي لـ χάρις، ويمكن أن تدل هنا على إحسان الله ورضاه دون حصر اللفظ في معنى اصطلاحي واحد.
- source_word: ἦν ἐπ’ αὐτό
  choice: كانت ... عليه
  rationale: يحافظ هذا التركيب على صورة حضور نعمة الله عليه، وهو تعبير عربي واضح ومألوف.
theological_decisions:
- issue: دلالة χάρις θεοῦ في سياق نمو المسيح
  choice: نعمة الله
  alternative: رضى الله
  rationale: اختيرت «نعمة الله» لاتساعها الدلالي وقربها من اللفظ اليوناني، مع إبقاء معنى «الرضى» بديلًا مشروعًا في الحاشية؛ فلا تُحسم العبارة بما يتجاوز ما يقوله النص عن نمو الطفل وحضور إحسان الله عليه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «كان» مع المضارع لإظهار الاستمرار في الفعلين، ووُضعت علامة الحاشية عقب العبارة التي تخصها مباشرة.
