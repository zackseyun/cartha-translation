  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: ar
  text: وكانت هناك نبيّة اسمها حنّة، ابنة فنوئيل، من سبط أشير. وكانت متقدّمة في السن[a]، وقد عاشت مع زوجها سبع سنوات منذ زواجها[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «متقدّمة في أيام كثيرة»، وهو تعبير يوناني اصطلاحي يدل على كِبَر السن.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «من عذريتها». ويُفهم في سياق عيشها مع زوجها: منذ أن غادرت حال العذرية، أي عند زواجها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆτις
  choice: نبيّة
  rationale: اسم مؤنث صريح يدل على امرأة نبيّة، وهذه الصياغة العربية موجزة وتحفظ التأنيث الموجود في اليونانية.
- source_word: θυγάτηρ Φανουήλ
  choice: ابنة فَنُوئِيل
  rationale: تعبير نسب مباشر، وصيغة «ابنة» طبيعية في العربية بعد ذكر حنّة.
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: من سبط أَشِير
  rationale: تحفظ «من» دلالة الأصل أو الانتماء في ἐκ، و«سبط» هو اللفظ الكتابي العربي الواضح للانتماء القبلي الإسرائيلي.
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: تقدّمت في أيام كثيرة
  rationale: يحفظ التعبير المجازي اليوناني حرفيًا بقدر تسمح به العربية، مع بقاء معناه الدال على الشيخوخة مفهومًا من السياق، وتوضحه الحاشية.
- source_word: ζήσασα μετὰ ἀνδρὸς
  choice: عاشت مع زوجها
  rationale: يدل ἀνήρ في هذا السياق على الزوج والحياة الزوجية، والإضافة بالضمير طبيعية في العربية ولا تتجاوز المعنى السياقي.
- source_word: ἔτη ἑπτὰ
  choice: سبع سنين
  rationale: نقل مباشر للمدة العددية بصياغة عربية سليمة.
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: منذ عذريتها
  rationale: يحافظ على صورة العبارة اليونانية وعلى شيء من إيجازها واحتمالها، من غير إدخال شرح زمني صريح في المتن.
theological_decisions:
- issue: وصف حنّة بأنها προφῆτις
  choice: إثبات أنها «نبيّة» بالمعنى الكتابي المعتاد
  alternative: تخفيف اللفظ إلى وصف ديني عام أو اعتباره لقبًا تشريفيًا فقط
  rationale: النص يستخدم الاسم اليوناني المعتاد للنبي بصيغته المؤنثة، فلا موجب لغويًا أو لاهوتيًا لإضعاف دلالته.
- issue: وصف سن حنّة
  choice: الإبقاء على الصورة «تقدّمت في أيام كثيرة» مع توضيح معناها في الحاشية
  alternative: تسوية التعبير في المتن إلى «كانت طاعنة في السن» أو إدخال حساب عمرها من العدد التالي
  rationale: يحفظ هذا الاختيار الصورة الأصلية ولا يجعل الآية أكثر تحديدًا من النص اليوناني، مع توفير المعنى الاصطلاحي للقارئ في الحاشية.
- issue: بداية حساب السنوات السبع
  choice: «منذ عذريتها» مع شرح الاحتمال الزمني في الحاشية
  alternative: «بعد زواجها» أو «بعد انتهاء عذريتها» في المتن
  rationale: العبارة اليونانية موجزة، والأفضل ألا يُستبدل بها تفسير زمني أكثر صراحة، مع بيان المقصود المحتمل في الحاشية.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. ضُبطت الأسماء جزئيًا لتيسير قراءتها، ووُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحهما كل حاشية، مع إبقاء الفاصلة الختامية لأن الجملة تستمر في العدد التالي.
