  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: ar
  text: 'وباركهم سمعان، وقال لمريم، أمه: «ها إن هذا موضوع لسقوط وقيام كثيرين في إسرائيل، ولآية تُقاوَم.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «آية يُعارَض فيها»؛ فاللفظ اليوناني يدل على علامة تواجه الاعتراض أو المناقضة، وقد يفيد أن الاعتراض موجَّه إلى الشخص بوصفه آية.'
    reason: إيضاح مجال معنى ἀντιλεγόμενον من غير حصر جهة المعارضة أو تغيير النص.
lexical_decisions:
- source_word: εὐλόγησεν αὐτούς
  choice: باركهم
  rationale: ينقل الفعل والضمير بصياغة عربية مباشرة، مع إبقاء مرجع الجمع كما في اليونانية.
- source_word: Ἰδού
  choice: ها إن
  rationale: أداة تنبيه فصيحة وواضحة في العربية المعاصرة، وتحافظ على قوة لفت الانتباه.
- source_word: κεῖται εἰς
  choice: موضوع لـ
  rationale: يحافظ على الصورة الحرفية نسبيًا وعلى المبني الدال على التعيين أو المصير، من غير التصريح بمن عيّنه.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: سقوط ... وقيامهم
  rationale: «قيام» هو المقابل الطبيعي لـἀνάστασις ويحفظ احتمال النهوض أو القيامة؛ أضيف الضمير إلى الثاني لسلامة العربية مع بقاء «كثيرين» متعلقًا بالحدثين.
- source_word: σημεῖον ἀντιλεγόμενον
  choice: آية تُقاوَم
  rationale: «آية» تلائم الاستعمال الكتابي لـσημεῖον، و«تُقاوَم» تنقل معنى المعارضة والمناقضة بصيغة موجزة.
theological_decisions:
- issue: دلالة κεῖται على التعيين
  choice: موضوع
  alternative: مُعيَّن
  rationale: «موضوع» يبقي الصياغة أقرب إلى الأصل ولا يحدد صراحة الفاعل أو طبيعة التعيين.
- issue: هل السقوط والقيام يخصان الجماعة نفسها أم جماعتين
  choice: سقوط كثيرين ... وقيامهم
  alternative: سقوط وقيام كثيرين
  rationale: الصياغة المختارة طبيعية عربيًا، لكنها لا تحسم إن كان الأشخاص أنفسهم يسقطون ثم يقومون أو إن كانت النتيجتان تقعان على فئات مختلفة.
- issue: مدى معنى ἀνάστασις
  choice: قيام
  alternative: نهوض
  rationale: «قيام» يحفظ الاتساع الدلالي بين النهوض والاستعادة والقيامة، ولا يضيّق المعنى سلفًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «ها إن» بدل صيغة قديمة أثقل، مع الحفاظ على الإيجاز والتوتر الدلالي في النبوءة.
