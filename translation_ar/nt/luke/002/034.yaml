  source_fidelity: 'المسودة تنقل عناصر الآية الأساسية بأمانة: بركة سمعان، خطابه إلى مريم أمّ يسوع، التنبيه، وكون الطفل موضوعًا للسقوط والقيام ولآية تواجه المعارضة. لكن ضمير الجمع في «وقيامهم» يرجّح أن الذين يقومون هم أنفسهم الذين يسقطون، بينما العبارة اليونانية «πτῶσιν καὶ ἀνάστασιν πολλῶν» لا تحسم ذلك، وقد تفيد فئات مختلفة أو نتائج متباينة لكثيرين.'
