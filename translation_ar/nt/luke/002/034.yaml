  to: 'وباركهم سمعان، وقال لمريم، أمه: «ها إن هذا موضوع لسقوط وقيام كثيرين في إسرائيل، ولآية تُقاوَم.[a]»'
  rationale: أزيل الضمير من «قيامهم» لصون الغموض المقصود في الأصل بشأن علاقة السقوط بالقيام ومن تشمل كلٌّ منهما. وضُبطت بدلية «أمه» بعلامات الترقيم، وعُدّل الربط الأخير ليعكس تناظر عبارات εἰς في اليونانية. ولا يمسّ ذلك المعنى اللاهوتي أو يفرض تفسيرًا مذهبيًا.
