lexical_decisions:
- source_word: ποιμένες
  choice: رعاة
  rationale: المعنى المعتاد هو رعاة الغنم، و«رعاة» تعبير عربي طبيعي ودقيق في هذا السياق.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: في تلك الناحية نفسها
  rationale: تفيد χώρα هنا الناحية أو المنطقة المحيطة ببيت لحم، و«الناحية» واضحة ولا توحي ببلد كامل.
- source_word: ἀγραυλοῦντες
  choice: يبيتون في العراء
  rationale: الفعل يدل على قضاء الليل خارج المساكن، في الحقول أو في الهواء الطلق؛ و«يبيتون في العراء» ينقل العنصر الليلي بوضوح.
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: يتناوبون حراسة ... ليلًا
  rationale: التركيب الحرفي «يحرسون حراسات الليل» يشير إلى نوبات الحراسة الليلية؛ والصياغة المختارة طبيعية وتُظهر معنى النوبات.
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: حراسة قطيعهم
  rationale: ποίμνη اسم جمعي يدل على القطيع الواقع تحت رعايتهم، وتندمج العبارة طبيعيًا مع فعل الحراسة.
- source_word: Καὶ ... ἦσαν
  choice: وكان
  rationale: يحافظ على الاستمرار السردي ويقدّم المشهد الجديد بأسلوب عربي فصيح طبيعي.
