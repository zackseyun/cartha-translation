  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: ar
  text: فنزل معهما وجاء إلى الناصرة، وكان خاضعًا لهما[a]. وكانت أمه تحفظ كل هذه الأقوال في قلبها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وكان يطيعهما». تفيد العبارة اليونانية خضوعًا أو طاعة مستمرين.
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تعني الكلمة اليونانية «الكلمات» أو «الأقوال»، وقد تُفهم أيضًا بمعنى «الأمور» التي جرى الحديث عنها.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: نزل
  rationale: ينقل المعنى الجغرافي المباشر للفعل من غير استعمال صياغة متكلّفة مثل «انحدر».
- source_word: μετ’ αὐτῶν
  choice: معهما
  rationale: الضمير اليوناني جمع، لكنه يعود في السياق إلى مريم ويوسف؛ والمثنى هو التعبير العربي الطبيعي والدقيق.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: جاء إلى الناصرة
  rationale: يحافظ على حركة السرد وعلى الدلالة المكانية الطبيعية للفعل ἔρχομαι.
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: كان خاضعًا لهما
  rationale: تنقل الصيغة المركبة في الماضي حالة الخضوع المستمرة، بصياغة عربية واضحة غير مثقلة.
- source_word: διετήρει
  choice: تحفظ
  rationale: يعني الفعل إبقاء الشيء وصونه بعناية؛ و«تحفظ» تلائم سياق التذكر الداخلي من غير إضافة تفسير «تكنز» إلى المتن.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: هذه الأمور كلها
  rationale: قد تدل ῥήματα على الأقوال أو الكلمات، وقد تمتد إلى الأمور التي قيلت أو حدثت؛ و«الأمور» طبيعية في السياق وتحفظ هذا الاتساع.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: في قلبها
  rationale: يحافظ على الصورة الأصلية المألوفة الدالة على الحفظ والتأمل الباطنيين.
theological_decisions:
- issue: علاقة يسوع بوالديه الأرضيين
  choice: وكان خاضعًا لهما
  alternative: وكان يطيعهما / وكان يُخضع نفسه لهما
  rationale: يثبت النص خضوع يسوع المستمر لمريم ويوسف في هذه المرحلة من حياته، من غير إضعاف هويته أو إدخال شرح عقائدي غير مذكور. وتحافظ «خاضعًا» على معنى ὑποτάσσω وعلى التوتر اللاهوتي الذي في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المثنى في «معهما» و«لهما» لأنه الأنسب عربيًا لمرجع الضمير، أي مريم ويوسف. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحهما الحاشيتان.
