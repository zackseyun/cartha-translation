  text: καὶ ἦν ⸂ὁ πατὴρ αὐτοῦ⸃ καὶ ἡ ⸀μήτηρ θαυμάζοντες ἐπὶ τοῖς λαλουμένοις περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: ar
  text: وكان أبوه وأمه يتعجبان مما كان يُقال عنه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «أبوه». والمقصود يوسف وفق الاستعمال الأسري والقانوني المعتاد في سياق الرواية. وتقرأ بعض الترجمات: «يوسف وأمه» تجنبًا لسوء الفهم في ضوء ما سبق أن رواه لوقا عن الحبل العذراوي بيسوع.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: أبوه
  rationale: ينقل اللفظ اليوناني مباشرة من غير استبداله باسم يوسف أو حسم دلالته الأسرية والقانونية داخل المتن.
- source_word: μήτηρ
  choice: أمه
  rationale: المقابل العربي الطبيعي المباشر، ويكوّن مع «أبوه» الزوج الأسري الوارد في النص.
- source_word: ἦν ... θαυμάζοντες
  choice: كان ... يتعجبان
  rationale: يعكس التركيب المحيطي الدال على فعل مستمر في الزمن الماضي، مع استعمال المثنى العربي لموافقة الفاعلين.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: مما كان يُقال
  rationale: صياغة عربية طبيعية تحفظ المبني للمجهول والاستمرار الماضي، وتؤدي معنى التعجب بسبب الأقوال المتداولة.
- source_word: περὶ αὐτοῦ
  choice: عنه
  rationale: مقابل موجز وطبيعي لمعنى «بشأنه/عنه» في هذا السياق.
theological_decisions:
- issue: إطلاق «أبوه» على يوسف في سياق سبق أن أكد حبل مريم العذراوي
  choice: إبقاء «أبوه» في المتن كما يرد في النص اليوناني، وشرح المقصود السردي في الحاشية.
  alternative: «يوسف وأمه» أو «أبوه، أي يوسف بمعناه القانوني والاجتماعي» داخل المتن
  rationale: أولوية النص الأصلي تقتضي نقل عبارته دون مواءمة تفسيرية. يصف السرد يوسف هنا بالأب وفق الاستعمال الأسري والقانوني المعتاد، من غير أن يلغي ذلك رواية لوقا السابقة عن الحبل العذراوي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المثنى «يتعجبان» للدقة والطبيعية، وحُفظ التوتر الدلالي في «أبوه» بدل تسويته داخل المتن.
