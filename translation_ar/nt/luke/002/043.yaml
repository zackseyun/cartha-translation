id: LUK.2.43
reference: Luke 2:43
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: ar
  text: ولمّا أتمّوا الأيام، وبينما كانوا عائدين، بقي[a] الصبي يسوع في أورشليم، ولم يعلم والداه[b] بذلك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «تخلّف».
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «والداه». يستخدم لوقا هنا لغة الأسرة المعتادة، وهذا لا ينفي خبر الحبل العذراوي المذكور سابقًا في الإنجيل.'
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: ولمّا أتمّوا الأيام
  rationale: يحافظ على صورة التعبير اليوناني الذي يشير، في السياق، إلى إتمام أيام العيد، من غير إضافة «العيد» إلى نص الآية.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: وبينما كانوا عائدين
  rationale: ينقل الدلالة الزمنية المتزامنة للتركيب مع المصدر المعرّف، ويُظهر أن بقاء يسوع حدث في أثناء عودتهم.
- source_word: ὑπέμεινεν
  choice: بقي
  rationale: يفيد الفعل هنا البقاء في المكان، مع احتمال المعنى السياقي «تخلّف»، المثبت في الحاشية.
- source_word: ὁ παῖς
  choice: الصبي
  rationale: لفظة مناسبة لعمر يسوع، وهو في الثانية عشرة بحسب السياق القريب، وتحافظ على كونه ذكرًا من غير استعمال لفظ قد يوحي بصغر السن أكثر من اللازم.
- source_word: ἐν Ἰερουσαλήμ
  choice: في أورشليم
  rationale: ترجمة مكانية مباشرة، مع اعتماد الاسم الكتابي العربي الشائع.
- source_word: οὐκ ἔγνωσαν
  choice: لم يعلم ... بذلك
  rationale: ينقل معنى عدم معرفتهم بواقعة بقائه، ويضيف «بذلك» وفق مقتضى العربية لتوضيح متعلق العلم المفهوم من السياق.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: والداه
  rationale: المثنى العربي الطبيعي والدقيق لكلمة «والديه/أبويه» في اليونانية، من غير توسيع إلى «أبوه وأمه» أو مواءمة لاهوتية.
theological_decisions:
- issue: وصف مريم ويوسف بأنهما οἱ γονεῖς αὐτοῦ
  choice: والداه
  alternative: أبوه وأمه
  rationale: ينقل النص اليوناني كما هو، بلغة أسرية عادية، من غير أن يلغي أو يفسر التوتر مع خبر الحبل العذراوي المذكور سابقًا في لوقا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت عبارة «أتمّوا الأيام» لقربها من الأصل، واستُعمل «بينما كانوا عائدين» بسلاسة لبيان التزامن. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
