  text: ἀπογράψασθαι σὺν Μαριὰμ τῇ ⸂ἐμνηστευμένῃ αὐτῷ⸃, οὔσῃ ἐγκύῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/005.yaml
  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: ar
  text: ليكتتب مع مريم، المخطوبة له[a]، وهي حامل[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي المرتبطة به رسميًا للزواج؛ وكانت الخطبة آنذاك رابطة قانونية واجتماعية أقوى من مفهوم الخطوبة الحديث.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حبلى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: ليكتتب
  rationale: يفيد المصدر الغرض من سفر يوسف في سياق الإحصاء، و«يكتتب» تعبير عربي موجز مناسب للتسجيل الرسمي.
- source_word: σὺν
  choice: مع
  rationale: ينقل معنى المصاحبة مباشرة وبطبيعية.
- source_word: Μαριὰμ
  choice: مريم
  rationale: الصيغة العربية المألوفة للاسم الكتابي.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: المخطوبة له
  rationale: يحفظ معنى الارتباط الرسمي الملزم اجتماعيًا وقانونيًا، من غير أن يحوّله إلى زواج مكتمل أو يضعفه إلى مجرد ارتباط حديث.
- source_word: οὔσῃ ἐγκύῳ
  choice: وهي حامل
  rationale: صياغة عربية واضحة وطبيعية تصف حال مريم وقتئذ، مع إبقاء العلاقة الحالية التي يفيدها اسم الفاعل اليوناني.
theological_decisions:
- issue: وصف علاقة مريم بيوسف
  choice: المخطوبة له
  alternative: المرتبطة به للزواج؛ زوجته
  rationale: النص اليوناني يصرح بخطبة رسمية، لا بمجرد وعد حديث ولا يصفها في هذه العبارة بأنها زوجته؛ لذا تحافظ الصياغة على الوضع الاجتماعي والقانوني من غير إضافة لاهوتية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «ليكتتب» لملاءمته السياق الإداري، و«المخطوبة له» لصون الدلالة التاريخية، و«حامل» لوضوحها المعاصر.
