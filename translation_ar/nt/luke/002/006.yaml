  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: ar
  text: وبينما كانا هناك، اكتملت أيام حملها لتلد[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تمّت أيام حملها لكي تلد».'
    reason: بديل معجمي لـ«اكتملت» يحافظ على معنى بلوغ أيام الحمل تمامها.
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: و
  rationale: هذا التعبير يؤدي هنا وظيفة الانتقال السردي؛ فحُفظت قوة الربط بالواو من غير إدخال عبارة ثقيلة مثل «وحدث أن».
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: بينما كانا هناك
  rationale: تركيب المصدر المسبوق بـἐν يفيد التزامن. واستُعمل المثنى في العربية لأن الضمير يعود في السياق إلى يوسف ومريم.
- source_word: ἐπλήσθησαν
  choice: تمّت
  rationale: يفيد الفعل بلوغ المدة تمامها. و«تمّت» عربية طبيعية تحافظ على معنى الاكتمال من غير أن تضيف تفسيرًا لاهوتيًا صريحًا.
- source_word: αἱ ἡμέραι
  choice: الأيام
  rationale: حُفظ الاسم الصريح في اليونانية بدل اختزاله إلى «الوقت»، إبقاءً لصورة اكتمال الأيام.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: لتلد
  rationale: يحفظ المصدر العربي القوة الفعلية للتعبير اليوناني بوضوح وإيجاز، مع إظهار أن مريم هي التي ستلد.
theological_decisions:
- issue: احتمال إيحاء عبارة ἐπλήσθησαν αἱ ἡμέραι بتوقيت مقدّر أو إتمام ذي دلالة لاهوتية
  choice: تمّت الأيام لتلد
  alternative: حان وقت ولادتها
  rationale: تحافظ الصياغة على لغة اكتمال الأيام عند لوقا ولا تختزلها إلى مجرد حلول الوقت، لكنها لا تصرّح بعناية إلهية أو إتمام نبوي لا يذكرهما النص صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع نبرة سردية موقرة. استُخدم المثنى بحسب مرجع الضمير في السياق، وحُفظت صورة «الأيام» رغم أن التعبير العربي الأبسط هو «حان وقت ولادتها».
