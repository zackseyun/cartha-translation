  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: ar
  text: 'وفجأةً كان مع الملاك جمعٌ غفيرٌ من الجند السماوي[a]، يسبّحون الله ويقولون:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جيش السماء».'
    reason: بديل معجمي يحفظ بصورة أوضح الدلالة العسكرية لكلمة στρατιά.
lexical_decisions:
- source_word: ἐξαίφνης
  choice: فجأةً
  rationale: تنقل معنى المباغتة وتلائم السرد العربي الطبيعي.
- source_word: ἐγένετο
  choice: ظهر
  rationale: يؤدي في هذا السياق معنى الحضور المفاجئ من غير أن يحمّل الفعل وصفًا تفصيليًا لكيفية الظهور.
- source_word: σὺν τῷ ἀγγέλῳ
  choice: مع الملاك
  rationale: ترجمة مباشرة لعلاقة المصاحبة التي تفيدها σύν مع المجرور.
- source_word: πλῆθος
  choice: جمهورٌ
  rationale: يدل على العدد الكثير، ويحافظ على نبرة مهيبة واضحة من غير إيحاء غير لازم بأنهم حشد بشري.
- source_word: στρατιᾶς οὐρανίου
  choice: من الجند السماوي
  rationale: يحفظ الصورة العسكرية الكامنة في στρατιά مع بيان الانتماء السماوي، ولا يختزل الجماعة في مجرد ملائكة كثيرين.
- source_word: αἰνούντων τὸν θεόν
  choice: يسبّحون الله
  rationale: «يسبّحون» تعبير عربي كتابي طبيعي عن الثناء التعبدي على الله، ويؤدي وظيفة اسم الفاعل اليوناني الدال على نشاط الجماعة.
- source_word: καὶ λεγόντων
  choice: ويقولون
  rationale: يحافظ على التنسيق مع الفعل السابق ويمهّد للاقتباس في العدد التالي.
theological_decisions:
- issue: ترجمة στρατιᾶς οὐρανίου
  choice: الجند السماوي
  alternative: جيش السماء
  rationale: «الجند السماوي» يحفظ معنى الجماعة السماوية المنظمة والصورة العسكرية، مع عدم جعل القتال محور المشهد، إذ إن عملهم هنا تسبيح الله.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. استُعمل «جمهور من الجند» للمحافظة على كلٍّ من معنى الكثرة والصورة الجماعية المنظمة، ووُضع البديل الأكثر عسكرية في الحاشية.
