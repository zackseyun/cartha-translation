lexical_decisions:
- source_word: ἐξίσταντο
  choice: كانوا مندهشين
  rationale: ينقل الفعل في صيغة الماضي الناقص ردَّ فعل قويًّا ومستمرًّا من الدهشة، بعبارة عربية طبيعية لا توحي بفقدان الصواب.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد، والواو أنسب مقابل عربي في هذا السياق.
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: جميع الذين يسمعونه
  rationale: يحفظ الشمول في πάντες ودلالة اسم الفاعل الحاضر على من كانوا يصغون إليه في ذلك الموقف.
- source_word: ἐπὶ τῇ συνέσει
  choice: من فهمه
  rationale: تفيد ἐπί مع المجرور هنا سبب الدهشة أو أساسها، و«من» طبيعية بعد «مندهشين»، أما σύνεσις فتدل على الفهم والإدراك.
- source_word: ταῖς ἀποκρίσεσιν αὐτοῦ
  choice: إجاباته
  rationale: «إجابات» تلائم سياق الحوار وتحفظ معنى الردود التي كان يقدمها.
