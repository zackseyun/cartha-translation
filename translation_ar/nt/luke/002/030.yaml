    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تفيد هنا التعليل، إذ تبيّن سبب قول سمعان السابق إنه يستطيع الآن أن ينصرف بسلام.
- source_word: εἶδον
  choice: قَدْ أَبْصَرَتَا
  rationale: ينقل الفعل الماضي المكتمل مع إبراز أثر الرؤية الحاضر، وتثنية الفعل توافق «عينيَّ» في العربية الفصيحة.
- source_word: οἱ ὀφθαλμοί μου
  choice: عَيْنَيَّ
  rationale: يحافظ على التعبير الجسدي الحي في اليونانية بدل اختزاله إلى «أنا»، وهو تعبير طبيعي واضح في العربية.
- source_word: τὸ σωτήριόν σου
  choice: خَلَاصَكَ
  rationale: يحافظ على الدلالة الأصلية التي تشير إلى الخلاص أو وسيلته، من غير أن يستبدلها صراحة بالاسم الشخصي «مخلّصك».
theological_decisions:
- issue: هل تُترجم τὸ σωτήριόν σου باسم مجرد («خلاصك») أم تُشخَّص في ضوء حضور الطفل يسوع («مخلّصك»).
  choice: خَلَاصَكَ
  alternative: مُخَلِّصَكَ
  rationale: 'اللفظ اليوناني σωτήριον ليس الاسم الشخصي المعتاد σωτήρ («مخلّص»)، بل يدل بصورة أرجح على الخلاص أو ما يحققه. وتُبقي «خلاصك» التوتر المقصود: خلاص الله منظور هنا في شخص يسوع، من غير أن تحسم الترجمة هذا التفسير داخل المتن.'
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «أبصرتا» للمحافظة على صورة العينين وعلى المطابقة النحوية الطبيعية مع المثنى، مع إبقاء «خلاصك» الأقرب إلى اللفظ اليوناني.
