  yaml_path: translation/nt/luke/002/003.yaml
  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: ar
  text: وكان الجميع يذهبون ليُسجَّلوا[b]، كلُّ واحدٍ إلى مدينته[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «كل واحد إلى مدينته». جاء التعبير اليوناني بصيغة المفرد المذكر.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ليُدرَجوا في السجل». يشير الفعل إلى التسجيل الرسمي المتصل بالإحصاء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: كانوا يذهبون
  rationale: صيغة الماضي الناقص تصوّر الذهاب بوصفه حركة جارية في سياق السرد؛ والتركيب «كانوا يذهبون» ينقل هذا الجانب بصورة عربية طبيعية.
- source_word: πάντες
  choice: الجميع
  rationale: تنقل معنى الشمول من غير إضافة اسم غير موجود في اليونانية، وتنسجم مع التفصيل التوزيعي اللاحق «كل واحد».
- source_word: ἀπογράφεσθαι
  choice: ليُسجَّلوا
  rationale: المصدر في هذا السياق يدل على التسجيل الرسمي المتصل بالإحصاء، والبناء للمجهول يحافظ على كون الأشخاص واقعين تحت إجراء التسجيل.
- source_word: ἕκαστος
  choice: كلُّ واحدٍ
  rationale: يعبّر بوضوح عن المعنى التوزيعي المفرد، أي إن كل شخص كان يتوجه على حدة.
- source_word: ἑαυτοῦ
  choice: ـه في «مدينته»
  rationale: ضمير الغائب المفرد المذكر في العربية يحفظ عدد الصيغة اليونانية وجنسها النحوي، كما تؤدي الإضافة معنى «الخاصة به» من غير تثقيل العبارة.
- source_word: πόλιν
  choice: مدينة
  rationale: هي المقابل المباشر المعتاد لـ πόλις، ولا تضيف التفسير الأضيق «مسقط الرأس» أو «البلدة الأصلية».
theological_decisions:
- issue: العبارة التوزيعية المذكرة المفردة ἕκαστος ... ἑαυτοῦ
  choice: «كل واحد إلى مدينته» مع إبقاء المفرد المذكر
  alternative: «كل شخص إلى مدينته» أو صياغة جمع محايدة
  rationale: يحافظ هذا على البنية التوزيعية وعلى المفرد المذكر في النص اليوناني، من غير أن يضيف تحديدًا عقائديًا أو يحوّل «المدينة» إلى «مسقط الرأس».
translation_notes:
  register: صياغة عربية فصحى واضحة ووقورة. استُخدم «وكان الجميع يذهبون» لنقل استمرارية الماضي الناقص، و«ليُسجَّلوا» لبيان الإجراء الرسمي من غير توسع تفسيري.
