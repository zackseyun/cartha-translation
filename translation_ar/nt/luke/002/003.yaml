  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «وكان» مع «يذهبون» يعكسان دلالة الماضي الناقص في ἐπορεύοντο، و«الجميع» يقابل πάντες، و«ليُسجَّلوا» يحافظ على دلالة التسجيل الرسمي والبناء الواقع على الأشخاص في ἀπογράφεσθαι، و«كل واحد إلى مدينته» ينقل التوزيع المفرد في ἕκαστος εἰς τὴν ἑαυτοῦ πόλιν دون إضافة «مسقط رأس» أو «مدينة الأجداد».'
