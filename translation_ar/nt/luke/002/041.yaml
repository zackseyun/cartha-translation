source:
  edition: SBLGNT
  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: ar
  text: وكان والداه يذهبان كل سنة إلى أورشليم في عيد الفصح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: كانا يذهبان
  rationale: صيغة الماضي الناقص تدل هنا على عادة متكررة في الماضي؛ وتركيب «كانا يذهبان» مع «كل سنة» يؤدي هذا المعنى بوضوح وطبيعية.
- source_word: γονεῖς
  choice: والداه
  rationale: المثنى المضاف هو المقابل العربي الطبيعي الدقيق لكلمة «والداه/أبواه» في هذا السياق، ويحافظ على التعبير العائلي العادي في النص.
- source_word: κατ’ ἔτος
  choice: كل سنة
  rationale: تعبير عربي واضح وطبيعي ينقل معنى التكرار السنوي الذي تفيده κατά مع اسم السنة في حالة النصب.
- source_word: Ἰερουσαλὴμ
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الشائعة لاسم المدينة.
- source_word: τῇ ἑορτῇ
  choice: في عيد
  rationale: يفيد الداتيف زمن/مناسبة الذهاب، و«في عيد» تعبير عربي موجز وطبيعي يدل على أن الرحلة كانت بمناسبة الاحتفال.
- source_word: τοῦ πάσχα
  choice: الفصح
  rationale: الاسم العربي المستقر للعيد اليهودي المقصود، والإضافة في اليونانية تُنقل طبيعيًا بتركيب «عيد الفصح».
theological_decisions:
- issue: الإشارة إلى أفراد عائلة يسوع
  choice: والداه
  alternative: أبوه وأمه
  rationale: النص اليوناني يستعمل اللفظ العادي الذي يعني «والديه». تُحفظ دلالة السرد كما هي من غير إدخال تفسير ينفي الحبل العذراوي الذي يقرره لوقا في موضع آخر أو يحاول حل التوتر اللاهوتي ضمن الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «كان والداه يذهبان» للتعبير الطبيعي عن العادة الماضية، و«كل سنة» بدل صياغة حرفية أثقل.
