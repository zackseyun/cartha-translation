  source_fidelity: 'ينقل النص عناصر اليونانية كلها بأمانة: «هذا» لـ αὕτη، و«التسجيل» لـ ἀπογραφή، و«أولًا» لـ πρώτη، و«جرى» لـ ἐγένετο، والظرف الزمني المصاحب في «حين كان كيرينيوس يتولى حكم سورية» لـ ἡγεμονεύοντος τῆς Συρίας Κυρηνίου. ولا يحسم المتن الخلاف التاريخي أو النحوي المتصل بـ πρώτη.'
