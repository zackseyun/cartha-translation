translation:
  language: ar
  text: جرى هذا التسجيل أولًا حين كان كيرينيوس يتولى حكم سورية[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جرى هذا التسجيل قبل أن يتولى كيرينيوس حكم سورية». يفهم بعضهم كلمة «أولًا» هنا بمعنى زمني مقارن.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «الإحصاء» بدلًا من «التسجيل». يشير اللفظ اليوناني إلى تسجيل رسمي، غالبًا ما يكون مرتبطًا بالضرائب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: هذا
  rationale: اسم إشارة يعود إلى التسجيل المذكور في الآية السابقة، وصيغة «هذا» طبيعية وواضحة في العربية.
- source_word: ἀπογραφὴ
  choice: التسجيل
  rationale: يدل اللفظ على تسجيل رسمي للسكان، وقد يرتبط بالضرائب؛ و«التسجيل» يحفظ المعنى الإداري من غير تضييقه إلى مجرد تعداد سكاني.
- source_word: πρώτη
  choice: أولًا
  rationale: يحفظ المعنى الترتيبي المباشر للفظ اليوناني، مع إبقاء الفهم الزمني المقارن «قبل» في الحاشية بسبب الخلاف النحوي والتاريخي.
- source_word: ἐγένετο
  choice: جرى
  rationale: تعبير عربي طبيعي عن وقوع الحدث وحدوثه.
- source_word: ἡγεμονεύοντος
  choice: حين كان ... يتولى حكم
  rationale: ينقل قوة التركيب الزمني المصاحب، من غير افتراض لقب إداري أدق مما يقتضيه الفعل اليوناني.
- source_word: τῆς Συρίας
  choice: سورية
  rationale: الاسم الجغرافي العربي المعياري للإقليم.
- source_word: Κυρηνίου
  choice: كيرينيوس
  rationale: نقل صوتي عربي واضح للاسم اليوناني Κυρήνιος.
theological_decisions:
- issue: تفسير πρώτη في عبارة مختلف عليها تاريخيًا ونحويًا
  choice: إثبات المعنى الترتيبي «أولًا» في المتن.
  alternative: «جرى هذا التسجيل قبل أن يتولى كيرينيوس حكم سورية».
  rationale: المعنى الترتيبي هو الدلالة المباشرة المعتادة للفظ، لكن الفهم المقارن الزمني قد دافع عنه بعض المفسرين؛ لذلك حُفظ في حاشية بدل حسم موضع الخلاف داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «يتولى حكم» بدل «كان واليًا» لتجنب فرض لقب رسمي لا يصرح به الفعل اليوناني، وحُفظ ترتيب العبارة بما يجعل «أولًا» متصلًا بوقوع التسجيل.
