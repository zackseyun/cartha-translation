  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: الصيغة السردية ἐγένετο، والظرف الزمني، ومغادرة الملائكة إلى السماء، وتبادل الرعاة الكلام، وصيغتي الحث، وواقعة ῥῆμα التي حدثت، وإعلام الرب لهم بها. و«إلى بيت لحم» ترجمة سليمة وطبيعية لـἕως Βηθλέεμ في هذا السياق، مع حفظ البديل الحرفي في الحاشية.'
