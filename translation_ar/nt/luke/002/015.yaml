  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: ar
  text: 'وحدث أنه لما انصرفت الملائكة عنهم إلى السماء، قال الرعاة بعضهم لبعض: «لنذهب الآن إلى بيت لحم[a]، ولنرَ هذا الأمر الذي حدث[b]، والذي عرَّفنا به الرب».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «حتى بيت لحم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «هذا الشيء الذي حدث»، أو «هذا القول الذي تحقق»؛ فاللفظة اليونانية ῥῆμα قد تعني «قولًا» أو «أمرًا» أو «شيئًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: وحدث أنه
  rationale: يحفظ صيغة لوقا السردية المألوفة من غير استعمال تعبير عربي عتيق مثل «وكان فيما كان».
- source_word: ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι
  choice: لما انصرفت الملائكة عنهم إلى السماء
  rationale: «لما» تؤدي الظرف الزمني، و«انصرفت» تنقل معنى المغادرة، و«السماء» تلائم الإشارة هنا إلى العالم السماوي لا إلى الجو المرئي فحسب.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: قال الرعاة بعضهم لبعض
  rationale: صياغة عربية طبيعية لإدخال الكلام المباشر، من دون تحميل صيغة الماضي الناقص دلالة استمرارية لا يقتضيها السياق.
- source_word: Διέλθωμεν δὴ
  choice: لنذهب الآن
  rationale: «لنذهب» تؤدي صيغة الحث، و«الآن» تنقل ما في δὴ من تعجيل وإلحاح.
- source_word: ἕως Βηθλέεμ
  choice: إلى بيت لحم
  rationale: هذه هي الصياغة العربية الطبيعية للمقصد، مع إثبات الدلالة الحرفية لـἕως في الحاشية.
- source_word: καὶ ἴδωμεν
  choice: ولنرَ
  rationale: يحفظ تنسيق صيغة الحث الثانية مع الأولى بأسلوب عربي موجز وطبيعي.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: هذا الأمر الذي حدث
  rationale: قد تعني ῥῆμα قولًا أو أمرًا أو شيئًا؛ و«الأمر» يناسب إحالة الرعاة إلى الواقعة المعلنة، مع إبقاء البدائل الدلالية في الحاشية.
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: والذي عرَّفنا به الرب
  rationale: «عرَّفنا به» تنقل معنى جعله معلومًا لنا دون تضخيمه إلى مصطلح تقني مثل «أوحى»، و«الرب» يحفظ لقب κύριος.
theological_decisions:
- issue: مرجع «الرب» (ὁ κύριος)
  choice: الإبقاء على «الرب» من غير تحديد أقنومي زائد
  alternative: تفسيره صراحة بأنه الله الآب، أو ربطه بالمولود المسمى ربًّا في السياق القريب
  rationale: السياق يفهم منه أن الله هو مصدر الإعلان الذي نقلته الملائكة، لكن النص نفسه يقول «الرب» ولا يحدد المرجع بعبارة أضيق؛ لذلك تحافظ الترجمة على التوتر اللاهوتي القائم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «لما» للسرد الزمني، و«لنذهب الآن» لنقل الحث والاستعجال، وتُجنبت الصيغ التراثية الثقيلة والتفسيرات المذهبية الزائدة.
