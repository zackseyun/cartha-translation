source:
  edition: SBLGNT
  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: ar
  text: الآن تُطلِق عبدك[a]، يا سيد، بحسب قولك، بسلام[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الكلمة اليونانية δοῦλος قد تدل على العبد أو الخادم المملوك لسيده. واختيار «عبدك» هنا يحفظ صلتها بالنداء «يا سيد».
    reason: lexical_alternative
  - marker: b
    text: يفيد السياق أن سمعان مستعد للرحيل عن هذه الحياة بسلام، مع أن اليونانية تقول حرفيًا «تُطلِق» ولا تذكر الموت صراحة.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: الآن
  rationale: ظرف زمان يدل على أن انتظار سمعان يتحقق في اللحظة الحاضرة، و«الآن» هي المقابل العربي المباشر والطبيعي.
- source_word: ἀπολύεις
  choice: تُطلِق
  rationale: فعل مضارع للمخاطب المفرد، ومعناه هنا الإطلاق أو السماح بالانصراف. يحافظ «تُطلِق» على الصورة الأصلية من غير أن يصرّح بالموت.
- source_word: τὸν δοῦλόν σου
  choice: عبدك
  rationale: «عبد» يقابل δοῦλος، ويعبّر عن الخضوع والانتساب إلى السيد. كما أن اقترانه بالنداء «يا سيد» يحفظ العلاقة اللفظية البارزة في اليونانية.
- source_word: δέσποτα
  choice: يا سيد
  rationale: اللفظة نداء لمن له السيادة والسلطان، و«يا سيد» صياغة عربية طبيعية تحافظ على صلتها بكلمة «عبدك» من غير إضافة تفسيرية مثل «أيها الرب المتسلط».
- source_word: κατὰ τὸ ῥῆμά σου
  choice: بحسب قولك
  rationale: تفيد العبارة المطابقة لما قاله الله أو وعد به. «قولك» أنسب في العربية للكلام المنطوق من الترجمة الحرفية «كلمتك»، مع إبقاء الإشارة إلى الوعد الإلهي.
- source_word: ἐν εἰρήνῃ
  choice: بسلام
  rationale: تعبير عربي موجز وطبيعي يحفظ معنى الرحيل في سلام، من غير تحويله إلى مجرد وصف لكيفية الموت.
theological_decisions:
- issue: هل يُصرَّح بأن سمعان يتحدث عن موته؟
  choice: الإبقاء على صورة الإطلاق من غير ذكر الموت صراحة في المتن
  alternative: الآن تدع عبدك يموت بسلام
  rationale: يفهم من السياق أن سمعان مستعد للرحيل عن هذه الحياة، لكن ἀπολύω يعني الإطلاق أو الصرف، ولا يذكر الموت صراحة. لذلك تحافظ الصياغة المختارة على الصورة الشعرية وعلى ما في النص من إيحاء دون زيادة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة دعائية مهيبة. روعي إبقاء ترتيب العبارة قريبًا من الأصل، مع استعمال «بحسب قولك» و«بسلام» لصياغة عربية طبيعية، والحفاظ على التقابل بين «عبدك» و«يا سيد».
