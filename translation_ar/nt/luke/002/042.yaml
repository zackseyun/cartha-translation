  text: ولمّا بلغ اثنتي عشرة سنة[a]، إذ كانوا يصعدون بحسب عادة العيد[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز تبسيط العبارة إلى: «إذ صعدوا بحسب عادة العيد». لكن اسم الفاعل المضارع في اليونانية يمكن أن يبرز الفعل الجاري المتزامن، ولذلك جاء النص: «كانوا يصعدون».'
