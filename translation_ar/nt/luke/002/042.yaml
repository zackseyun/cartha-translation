lexical_decisions:
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: بلغ اثنتي عشرة سنة
  rationale: هذا تركيب يوناني اصطلاحي للدلالة على بلوغ سن معينة أو كونه في تلك السن. و«بلغ اثنتي عشرة سنة» تعبير عربي طبيعي، والفاعل المفرد هو يسوع بحسب السياق السابق.
- source_word: ἀναβαινόντων
  choice: كانوا يصعدون
  rationale: الفعل يعني حرفيًا «يصعد»، ويُستعمل اعتياديًا للصعود إلى أورشليم. وصيغة اسم الفاعل الحاضر تدل هنا على فعل متزامن مستمر، لذلك تحافظ «كانوا يصعدون» على هذا الجانب دون إضافة «إلى أورشليم»، لأنها مفهومة من السياق السابق وليست مذكورة في هذه الآية.
- source_word: αὐτῶν
  choice: هم في «كانوا»
  rationale: الضمير يعود في السياق إلى الجماعة العائلية، ولا سيما أبويه، لكن إبقاءه ضميرًا جمعيًا يتجنب تخصيص المرجع بما يتجاوز لفظ اليونانية.
- source_word: κατὰ τὸ ἔθος
  choice: بحسب عادة
  rationale: يدل التعبير على موافقة ممارسة مستقرة. و«بحسب عادة» واضح وقريب من الأصل، مع اتصال «العادة» بالإضافة إلى «العيد» في العربية.
- source_word: τῆς ἑορτῆς
  choice: العيد
  rationale: الكلمة تدل على عيد أو احتفال ديني. و«العيد» عربي فصيح وطبيعي في سياق الحج والفصح.
- source_word: καὶ ὅτε
  choice: ولمّا
  rationale: الواو تواصل السرد، و«لمّا» تدخل الجملة الزمنية بصورة عربية طبيعية مع الحفاظ على معنى «حين».
theological_decisions: []
translation_notes:
  register: صياغة عربية معيارية واضحة ورصينة. استُعملت «إذ كانوا يصعدون» لتمثيل التركيب اليوناني الظرفي مع الحفاظ على استمرارية الفعل، وأُبقيت الوجهة غير مصرّح بها لأن «إلى أورشليم» واردة في السياق السابق لا في نص هذه الآية.
