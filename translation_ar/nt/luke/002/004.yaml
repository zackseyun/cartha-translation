source:
  edition: SBLGNT
  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: ar
  text: وصعد يوسف أيضًا من الجليل، من مدينة الناصرة، إلى اليهودية، إلى مدينة داود التي تُدعى بيت لحم، لأنه كان من بيت داود وعشيرته.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέβη
  choice: صعد
  rationale: يحفظ تعبير الصعود الجغرافي المألوف في الانتقال إلى اليهودية، من غير تسطيحه إلى «ذهب».
- source_word: δὲ καὶ
  choice: أيضًا
  rationale: تفيد καὶ اشتراك يوسف في الحركة المذكورة في السياق، أما δὲ فهي أداة ربط خفيفة لا يلزم إظهارها بحرف مستقل في العربية.
- source_word: ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ
  choice: من الجليل، من مدينة الناصرة
  rationale: 'يحافظ على التحديد المتدرج في اليونانية: الإقليم ثم المدينة.'
- source_word: εἰς τὴν Ἰουδαίαν
  choice: إلى اليهودية
  rationale: الاسم الجغرافي المعياري للإقليم في العصر الروماني.
- source_word: εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: إلى مدينة داود التي تُدعى بيت لحم
  rationale: يحفظ تركيب الصلة التفسيري والارتباط بداود، مع صياغة عربية طبيعية.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: لأنه كان
  rationale: ينقل دلالة السبب في تركيب διά مع المصدر المعرّف بصيغة عربية سلسة.
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: من بيت داود وعشيرته
  rationale: يميّز بين οἶκος بمعناه الأسري أو السلالي وπατριά بوصفها جماعة النسب، مع إعادة الضمير إلى داود بوضوح طبيعي.
theological_decisions:
- issue: مصطلحا النسب الداودي οἶκος وπατριά
  choice: من بيت داود وعشيرته
  alternative: من بيت داود ونسبه؛ من بيت داود وعائلته
  rationale: يحافظ على وجود مصطلحين متقاربين من غير دمجهما في مفهوم واحد، ويؤكد انتساب يوسف إلى داود دون إضافة استنتاج عقائدي يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «صعد» لصون الصورة الجغرافية، و«تُدعى» لمجاراة المبني للمجهول في الأصل. لم تُضف حاشية لأن البدائل المعجمية لا تكشف غموضًا نصيًا ضروريًا للقارئ في هذه الآية.
