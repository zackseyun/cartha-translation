  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: الملاك المعرّف في السياق، النهي بصيغة الجمع، أداة التنبيه والتعليل، فعل إعلان البشارة مع المخاطبين، الفرح العظيم، والاستقبال والشمول في «للشعب كله». وصيغة «فها أنا أبشّركم» عربية مألوفة تؤدي وظيفة ἰδού مع فعل المتكلم، ولا تضيف معنى جوهريًا مخالفًا للأصل.'
