id: LUK.2.10
reference: Luke 2:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: ar
  text: 'فقال لهم الملاك: «لا تخافوا، فها أنا أبشّركم بفرح عظيم يكون للشعب كله[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لجميع الناس». واليونانية حرفيًا أقرب إلى «للشعب كله»، وهي في لوقا كثيرًا ما تدل في السياق على شعب معيّن.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: الملاك
  rationale: أداة التعريف اليونانية تشير طبيعيًا إلى الملاك الذي سبق ذكره في السياق، ويؤدي التعريف بالعربية المعنى نفسه.
- source_word: Μὴ φοβεῖσθε
  choice: لا تخافوا
  rationale: صياغة عربية طبيعية مباشرة للنهي، وتحافظ على خطاب الجمع الموجّه إلى الرعاة.
- source_word: ἰδοὺ γὰρ
  choice: فها أنا
  rationale: الفاء تبيّن سبب عدم الخوف، و«ها أنا» تحفظ قوة أداة التنبيه ἰδού وتتلاءم عربيًا مع فعل المتكلم الذي يليها.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: أبشّركم
  rationale: «أبشّر» ينقل معنى إعلان خبر سار، وضمير المفعول «كم» يعبّر طبيعيًا عن ὑμῖν من غير إطالة.
- source_word: χαρὰν μεγάλην
  choice: بفرح عظيم
  rationale: صياغة عربية واضحة تحفظ قوة الصفة μεγάλην، ويستقيم حرف الباء مع الفعل «أبشّر».
- source_word: ἥτις ἔσται
  choice: يكون
  rationale: يحفظ معنى المستقبل في السياق، وصلة الموصول مفهومة من تركيب الجملة العربية من غير حاجة إلى «الذي»، الذي قد يثقل العبارة.
- source_word: παντὶ τῷ λαῷ
  choice: للشعب كله
  rationale: يحفظ تعريف λαός ويرجّح الإشارة في السياق المباشر إلى شعب معيّن، مع نقل παντί بمعنى الشمول داخل ذلك الشعب.
theological_decisions:
- issue: نطاق παντὶ τῷ λαῷ
  choice: للشعب كله
  alternative: لجميع الناس
  rationale: وجود أداة التعريف مع λαός يرجّح معنى شعب محدد في السياق، وعلى الأرجح إسرائيل في المشهد السردي المباشر. لذلك لا تعمّم الصياغة مدلول العبارة قبل أوانه، من غير أن تنفي امتداد الخلاص إلى الأمم في مواضع أخرى من لوقا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدمت «فها أنا أبشّركم» للموازنة بين الطبيعة العربية وقوة التنبيه في الأصل، مع تجنب الأسلوب العتيق أو المصطلحات المذهبية.
