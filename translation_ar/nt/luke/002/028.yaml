  text: καὶ αὐτὸς ἐδέξατο αὐτὸ εἰς τὰς ⸀ἀγκάλας καὶ εὐλόγησεν τὸν θεὸν καὶ εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: ar
  text: 'فأخذه بين ذراعيه[a]، وبارك الله وقال:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فتلقّاه بين ذراعيه». يمكن أن يعني الفعل اليوناني «تلقّى» أو «استقبل»، لكن عبارة «بين ذراعيه» تجعل معنى الأخذ والحمل هو الأنسب هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξατο
  choice: أخذه
  rationale: الفعل يعني في الأصل «تلقّى» أو «استقبل»، لكن اقترانه بعبارة «بين ذراعيه» يدل طبيعيًا على فعل حمل الطفل وأخذه.
- source_word: αὐτό
  choice: ـه
  rationale: الضمير اليوناني محايد نحويًا تبعًا لمرجعه «الطفل»، لكنه يعود إلى يسوع، ولذلك يُترجم بضمير المذكر في العربية.
- source_word: εἰς τὰς ἀγκάλας
  choice: بين ذراعيه
  rationale: تشير العبارة إلى الذراعين بوصفهما موضع احتضان الطفل أو حمله. أُضيف ضمير الملكية الذي يفهمه السياق، إذ المقصود ذراعا سمعان.
- source_word: εὐλόγησεν τὸν θεόν
  choice: بارك الله
  rationale: يحافظ هذا التعبير على المعنى المباشر للفعل وعلى الأسلوب الكتابي الواضح، بدل تفسيره الأوسع بـ«سبّح الله».
- source_word: καὶ εἶπεν
  choice: وقال
  rationale: استمرار سردي بسيط يمهّد للكلام المنقول في الآية التالية.
- source_word: αὐτός
  choice: فاعل مستتر في «أخذه»
  rationale: الضمير يحدد الفاعل مع قدر خفيف من التوكيد، لكن إظهاره بعبارة «هو نفسه» سيكون أثقل وأشد توكيدًا مما يقتضيه السياق العربي.
theological_decisions:
- issue: مرجع الضمير المحايد αὐτό
  choice: إحالته شخصيًا إلى الطفل يسوع بضمير المذكر «ـه»
  alternative: نقل جنسه النحوي بصيغة غير شخصية
  rationale: حياد الضمير في اليونانية نحوي ويتبع لفظ «الطفل»، ولا ينفي أن المرجع شخص؛ لذلك يقتضي الاستعمال العربي ضمير المذكر.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «بين ذراعيه» كتعبير عربي طبيعي للاحتضان، ووُضعت النقطتان لأن الكلام المباشر يبدأ في الآية التالية.
