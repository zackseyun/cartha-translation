  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: ar
  text: وظلَّت أرملةً إلى أن بلغت الرابعة والثمانين من عمرها[a]. وكانت لا تفارق الهيكل[b]، متعبِّدةً بالأصوام والتضرعات[c] ليلًا ونهارًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وظلَّت أرملةً أربعًا وثمانين سنة». يمكن فهم العبارة اليونانية على أنها تحدد عمر حنّة أو مدة ترمّلها.'
    reason: alternative_reading
  - marker: b
    text: تشير الكلمة اليونانية هنا إلى مجمّع الهيكل وساحاته، لا إلى المقدس الداخلي تحديدًا.
    reason: cultural_note
  - marker: c
    text: 'أو: «الابتهالات» أو «الطلبات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: أرملة
  rationale: المعنى المألوف للمرأة التي مات زوجها، وهو يواصل وصف حنّة بعد سنوات زواجها.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: إلى أن بلغت الرابعة والثمانين من عمرها
  rationale: صياغة عربية طبيعية تفهم العبارة على أنها تحدد عمر حنّة، مع إبقاء احتمال أن المقصود مدة ترمّلها في الحاشية.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: لا تفارق الهيكل
  rationale: ينقل الفعل الناقص معنى العادة المستمرة، وتؤدي العبارة العربية هذا المعنى بإيجاز ووضوح.
- source_word: ἱεροῦ
  choice: الهيكل
  rationale: هو المقابل العربي المألوف، مع توضيح أن اللفظة اليونانية تدل على مجمّع الهيكل وساحاته لا المقدس الداخلي وحده.
- source_word: νηστείαις
  choice: بالأصوام
  rationale: يحفظ صيغة الجمع الدالة على ممارسة الصوم مرارًا بوصفه وسيلة أو هيئة للتعبد.
- source_word: δεήσεσιν
  choice: التضرعات
  rationale: يعكس معنى الطلب والابتهال في δέησις بدقة أكبر من اللفظ العام «الصلوات»، مع ذكر البدائل في الحاشية.
- source_word: λατρεύουσα
  choice: متعبِّدةً
  rationale: ينقل معنى الخدمة التعبدية المقدمة لله بعبارة عربية طبيعية وموجزة.
- source_word: νύκτα καὶ ἡμέραν
  choice: ليلًا ونهارًا
  rationale: يحافظ على ترتيب اليونانية ويؤدي التعبير الاصطلاحي الدال على المواظبة.
theological_decisions:
- issue: هل تدل العبارة على عمر حنّة أم على مدة ترمّلها؟
  choice: يفيد النص الرئيس أنها بلغت الرابعة والثمانين من عمرها.
  alternative: قد تعني العبارة أنها ظلت أرملة أربعًا وثمانين سنة.
  rationale: التركيب اليوناني موجز ويحتمل الوجهين؛ لذلك اختير الوجه الأنسب لسلاسة النص، مع حفظ الاحتمال الآخر صراحةً في الحاشية من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الهيكل» بوصفه المصطلح الكتابي المألوف، ووضعت علامات الحواشي عند الألفاظ التي تشرحها مباشرة.
