  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: ar
  text: 'ولكي يقدِّما ذبيحةً بحسب ما قيل في شريعة الرب: «زوجَ يمامٍ أو فرخَي حمامٍ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بحسب ما يُقال في شريعة الرب».'
    reason: بديل صياغي يعكس إمكان فهم اسم المفعول التام اليوناني باعتباره ما يظلّ مقولًا أو ثابتًا في نص الشريعة.
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: لكي يقدِّما ذبيحةً
  rationale: المصدر المعرّف يفيد الغرض في السياق، ومع θυσία يكون التعبير العربي الطبيعي «يقدِّما ذبيحة» لا «يعطيا ذبيحة». وصيغة المثنى تستعيد الفاعلين المفهومين من السياق.
- source_word: κατὰ τὸ εἰρημένον
  choice: بحسب ما قيل
  rationale: يحافظ على الدلالة اللفظية لاسم المفعول التام، أي القول المثبت الذي ما زال قائمًا، من غير إدخال معنى تفسيري مثل «ما فُرض».
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: في شريعة الرب
  rationale: «شريعة» تعبير عربي واضح ومألوف عن νόμος حين يشير إلى الشريعة الإلهية، و«الرب» هو المقابل المعتاد لـ κύριος في هذا السياق.
- source_word: ζεῦγος τρυγόνων
  choice: زوجَ يمامٍ
  rationale: ζεῦγος يدل على زوج من الطيور، وτρυγών هو اليمام تحديدًا؛ ويحافظ التعبير على الصياغة الكتابية المعروفة.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: فرخَي حمامٍ
  rationale: νοσσός هو صغير الطائر، وπεριστερά حمام؛ وصيغة المثنى العربية تنقل العدد بوضوح وطبيعية.
theological_decisions:
- issue: ترجمة κύριος في عبارة تتعلق بالشريعة الإلهية
  choice: الرب
  alternative: السيد
  rationale: السياق يتحدث عن شريعة الله، و«الرب» يحفظ الاستعمال الكتابي واللاهوتي المعتاد من غير تحويله إلى «الربّ» الدال صراحةً على الاسم الإلهي في العهد القديم.
- issue: القيمة الزمنية لعبارة τὸ εἰρημένον
  choice: ما قيل
  alternative: ما كان قد قيل
  rationale: اسم المفعول التام يدل على قول سابق ذي أثر قائم، لكن العربية الطبيعية تستطيع حفظ ذلك بعبارة «ما قيل». وتُذكر الصياغة الزمنية الأصرح في الحاشية حفاظًا على الاحتمال.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم المثنى حيث يلائم بنية العربية، وحُفظت الصياغة الاقتباسية للشريعة من غير إضافة مرجع غير موجود في الآية.
