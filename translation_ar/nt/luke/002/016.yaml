lexical_decisions:
- source_word: ἦλθαν
  choice: جاؤوا
  rationale: صيغة الماضي من ἔρχομαι تصف وصول الرعاة إلى المكان الذي أعلن لهم الملاك عنه، و«جاؤوا» هي الصياغة العربية الطبيعية في هذا السياق السردي.
- source_word: σπεύσαντες
  choice: مسرعين
  rationale: اسم الفاعل يبيّن هيئة مجيئهم ويعبّر عن العجلة؛ و«مسرعين» موجزة وطبيعية وتحفظ الإحساس بالإلحاح.
- source_word: ἀνεῦραν
  choice: وجدوا
  rationale: يدل الفعل على العثور بعد بحث؛ والسياق يوصل دلالة البحث الناجح من غير حاجة إلى توسيع العبارة.
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: مريم ويوسف
  rationale: نُقل الاسمان بصيغتيهما العربيتين المألوفتين، وأُدي ربط τε وκαί بحرف العطف الطبيعي في العربية.
- source_word: τὸ βρέφος
  choice: الرضيع
  rationale: يشير βρέφος إلى طفل بالغ الصغر، وهنا إلى المولود حديثًا؛ و«الرضيع» أدق من «الطفل» مع بقائه واضحًا للقارئ العام.
- source_word: κείμενον
  choice: مستلقيًا
  rationale: يصف اسم الفاعل حالة الرضيع وموضعه، لا فعل شخص أضجعه؛ لذلك تحفظ «مستلقيًا» المعنى الساكن من دون إدخال فاعل ضمني.
- source_word: ἐν τῇ φάτνῃ
  choice: في المذود
  rationale: يمكن أن تدل φάτνη على المذود، أي معلف الحيوانات. «المذود» لفظ عربي دقيق ومألوف في سياق الميلاد، مع بيان البديل الأوضح في الحاشية.
- source_word: καὶ ... καὶ ... καὶ
  choice: فـ... و... و...
  rationale: حُفظ التدفق الإضافي البسيط الذي تصنعه أدوات العطف اليونانية، مع استخدام الربط الطبيعي في العربية.
