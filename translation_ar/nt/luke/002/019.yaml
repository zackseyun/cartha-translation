base_translation:
  language: en
  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: ar
  text: أمّا مريم فكانت تحفظ هذه الأقوال كلّها، وتتأمّل فيها في قلبها.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كانت تصون هذه الأمور كلّها»، أي تحفظها بعناية.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تحمل «تتأمّل» معنى جمع هذه الأمور بعضها إلى بعض ومقارنتها في فكرها.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: أمّا
  rationale: تفيد انتقالًا سرديًّا مع مقابلة لطيفة بين استجابة الآخرين واستجابة مريم الداخلية، من غير مبالغة في معنى التعارض.
- source_word: Μαρία
  choice: مريم
  rationale: الصيغة العربية المعيارية للاسم الكتابي.
- source_word: συνετήρει
  choice: كانت تحفظ
  rationale: ينقل الماضي الناقص معنى الفعل المستمر، ويدل الفعل على إبقاء الأقوال وصونها بعناية، لا مجرد تذكّر عابر.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: هذه الأقوال كلّها
  rationale: «الأقوال» تلائم السياق المباشر الذي يتناول ما أخبر به الرعاة، مع بقاء احتمال أن تشمل العبارة الأمور أو الأحداث المرتبطة بها.
- source_word: συμβάλλουσα
  choice: وتتأمّل فيها
  rationale: صياغة عربية طبيعية تعبّر عن جمع المعاني ذهنيًّا ومقارنتها والنظر فيها، دون الإيحاء بأنها فهمتها فهمًا كاملًا.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: في قلبها
  rationale: يحفظ الاستعارة الأصلية الدالة على الفكر الباطني والتدبر والوجدان.
theological_decisions:
- issue: طبيعة استجابة مريم
  choice: كانت تصون الأقوال وتتدبرها في داخلها
  alternative: أنها كانت تتذكر الأحداث فحسب، أو أنها أدركت معناها كاملًا في تلك اللحظة
  rationale: النص يدل على الحفظ المتأني والتفكير المستمر، لكنه لا يثبت اكتمال فهم مريم؛ لذلك تُحفظ هذه المساحة من التوتر دون حسم تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أمّا» للمقابلة السردية اللطيفة، و«كانت تحفظ» لإظهار الاستمرار، مع إبقاء صورة «القلب» كما في الأصل.
