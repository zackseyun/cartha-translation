  text: which you prepared before the face of all the peoples[b][a],
translation:
  language: ar
  text: الذي أعددتَه أمام جميع الشعوب[a][b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على مرأى من جميع الشعوب»؛ فالتعبير اليوناني يدل على شيء موضوع علنًا أمام أنظار الجميع.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «جميع الأمم».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: الذي
  rationale: اسم موصول مفرد يعود في اليونانية إلى «الخلاص» في الآية السابقة؛ وجاء مذكرًا في العربية موافقةً لجنس «الخلاص» النحوي.
- source_word: ἡτοίμασας
  choice: أعددتَه
  rationale: فعل ماضٍ موجَّه إلى الله، والضمير المتصل يعيد الصلة بوضوح إلى «الخلاص».
- source_word: κατὰ πρόσωπον
  choice: أمام
  rationale: تعبير عربي طبيعي يحفظ معنى وضع الشيء في حضرة الآخرين وعلى مرأى منهم، من غير حرفية ثقيلة مثل «أمام وجه».
- source_word: πάντων
  choice: جميع
  rationale: ينقل الشمول الذي تفيده الكلمة اليونانية بوضوح.
- source_word: τῶν λαῶν
  choice: الشعوب
  rationale: يحفظ صيغة الجمع واتساع مدلول λαοί، ولا يستبق التفصيل الوارد في الآية التالية عن الأمم وإسرائيل.
theological_decisions:
- issue: مدلول «τῶν λαῶν» وعلاقته بالآية التالية
  choice: جميع الشعوب
  alternative: جميع الأمم؛ الناس جميعًا
  rationale: «الشعوب» تحافظ على الجمع في اليونانية وعلى الإشارة إلى جماعات بشرية متعددة، وتترك للآية التالية أن تبيّن علاقتها بالأمم وإسرائيل، من غير تضييق المعنى مسبقًا.
translation_notes:
  register: صياغة عربية فصحى واضحة ورصينة، تتصل نحويًا بالآية السابقة. اختير «أمام» بدل النقل الحرفي «أمام وجه» لأنه أفصح في الاستعمال العربي المعاصر مع إبقاء معنى العلانية والحضور.
