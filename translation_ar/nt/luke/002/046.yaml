  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: ar
  text: وبعد ثلاثة أيام، وجداه في الهيكل[a]، جالسًا وسط المعلّمين، يستمع إليهم ويسألهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير الكلمة اليونانية إلى مجمّع الهيكل أو ساحاته، لا إلى المقدس الداخلي تحديدًا.
    reason: cultural_note
  - marker: b
    text: 'أو: «يستفهم منهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: وبعد
  rationale: الصيغة اللوقاوية هنا تمهّد للحدث، لكن نقلها حرفيًا بعبارة مثل «وحدث أنه» يثقل العربية؛ ويؤدي الربط بـ«وبعد» وظيفتها السردية طبيعيًا.
- source_word: μετὰ ἡμέρας τρεῖς
  choice: بعد ثلاثة أيام
  rationale: ينقل الدلالة الزمنية المباشرة للتركيب اليوناني بوضوح وقرب من بنيته.
- source_word: εὗρον αὐτόν
  choice: وجداه
  rationale: الفعل اليوناني بصيغة الجمع، ويُفهم من السياق أن الفاعلين هما أبواه؛ والتثنية العربية طبيعية ودقيقة هنا.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: «الهيكل» هو المقابل العربي المألوف، مع إيضاح في الحاشية أن اللفظة اليونانية تشير إلى مجمّع الهيكل أو ساحاته، لا إلى المقدس الداخلي تحديدًا.
- source_word: καθεζόμενον
  choice: جالسًا
  rationale: ينقل اسم الفاعل الحالي الذي يصوّر هيئة يسوع حين وجداه.
- source_word: ἐν μέσῳ τῶν διδασκάλων
  choice: وسط المعلّمين
  rationale: صياغة عربية واضحة تحافظ على معنى وجوده بين المعلّمين، من غير إضافة «الشريعة» غير المذكورة صراحة في النص.
- source_word: ἀκούοντα αὐτῶν
  choice: يستمع إليهم
  rationale: يعبر عن الإصغاء المقصود والمستمر في هذا المشهد، لا مجرد السماع العارض.
- source_word: ἐπερωτῶντα αὐτούς
  choice: يسألهم
  rationale: يحافظ على المعنى الواسع للفعل اليوناني دون أن يوحي بالاستجواب أو المواجهة؛ وتذكر الحاشية البديل الممكن.
theological_decisions:
- issue: طبيعة تفاعل يسوع مع المعلّمين
  choice: «يستمع إليهم ويسألهم» بوصفه مشاركًا في حوار تعليمي
  alternative: «يستجوبهم» أو «يمتحنهم بأسئلته»
  rationale: النص يصوّر الإصغاء والسؤال معًا، ولا يلزم منه موقف تحدٍّ أو امتحان. تحافظ الصياغة على تواضع المشهد وحكمة يسوع دون حسم التوتر اللاهوتي بإضافة غير منصوص عليها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت التثنية «وجداه» موافقةً للسياق العربي، وحُذفت الترجمة الحرفية الثقيلة للصيغة السردية ἐγένετο مع الحفاظ على تسلسل الحدث.
