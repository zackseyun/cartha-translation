  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: ar
  text: لأنه وُلد لكم اليوم مخلّص في مدينة داود، وهو المسيح الرب[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تتألف العبارة اليونانية χριστὸς κύριος من اللقبين «مسيح» و«رب»، وتُفهم عادةً على أنها «المسيح الرب». ويمكن إبراز اللقبين بعلامة فصل: «المسيح، الرب». وقد يفهمها بعضهم بمعنى «مسيح الرب»، لكن هذا تفسير محتمل للتركيب لا تفرضه الألفاظ اليونانية وحدها.'
    reason: بيان تركيب اللقبين والحفاظ على الاحتمال التفسيري من غير حسم زائد.
lexical_decisions:
- source_word: ὅτι
  choice: لأنه
  rationale: تفيد التعليل والشرح لما أعلنه الملاك في الآية السابقة، و«لأنه» واضحة في العربية المعاصرة.
- source_word: ἐτέχθη
  choice: وُلد
  rationale: صيغة ماضٍ مبني للمجهول من τίκτω، وتقابلها طبيعيًا في العربية «وُلد».
- source_word: ὑμῖν
  choice: لكم
  rationale: 'تحفظ دلالة المنفعة: المولود مخلّص لأجل المخاطَبين، لا مجرد مولود أُخبروا به.'
- source_word: σήμερον
  choice: اليوم
  rationale: المقابل الزمني المباشر والطبيعي.
- source_word: σωτὴρ
  choice: مخلّص
  rationale: يحفظ معنى الإنقاذ ودلالة اللقب الخلاصية والملكية في السياق.
- source_word: ὅς ἐστιν
  choice: وهو
  rationale: صياغة عربية طبيعية تربط «مخلّص» باللقبين اللذين يعرّفانه، من غير زيادة تفسيرية.
- source_word: χριστὸς
  choice: المسيح
  rationale: الكلمة لقب هنا مرتبط بانتظار الملك الممسوح من نسل داود، ولذلك تُترجم «المسيح» لا اسمًا منقولًا صوتيًا.
- source_word: κύριος
  choice: الرب
  rationale: يحفظ معنى السيادة والثقل اللاهوتي للقب في هذا الإعلان.
- source_word: ἐν πόλει Δαυίδ
  choice: في مدينة داود
  rationale: ترجمة مباشرة وطبيعية تحفظ الصلة الملكية بداود، مع أن المقصود في السياق هو بيت لحم.
theological_decisions:
- issue: دلالة وتركيب χριστὸς κύριος
  choice: المسيح الرب
  alternative: مسيح الرب؛ أو المسيح، الرب
  rationale: 'يعرض اليوناني لقبين في حالة الرفع يعرّفان «المخلّص»: «المسيح» و«الرب». وتحفظ «المسيح الرب» هذا التجاور من غير تحويل κύριος إلى مضاف إليه؛ أما «مسيح الرب» فقد تُفهم على أن معناها «مسيح الرب/المسيح التابع للرب»، وهو تركيب تفسيري أقل مباشرة هنا.'
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «وهو» بدل «الذي هو» لسلاسة الجملة، وحُفظ ترتيب عناصر الخبر قريبًا من الأصل من غير الإخلال بالطبيعية العربية.
