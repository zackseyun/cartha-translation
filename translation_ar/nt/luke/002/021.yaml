  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: ar
  text: ولمّا اكتملت ثمانية أيام لختانه[a]، سُمّي يسوع[b]، وهو الاسم الذي سمّاه الملاك قبل أن يُحبل به في الرحم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولمّا اكتملت الأيام الثمانية لختانه».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «دُعي اسمه يسوع».'
    reason: lexical_alternative
  - marker: c
    text: أي في رحم مريم، بحسب سياق البشارة السابق.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: تمّت ثمانية أيام
  rationale: تنقل المعنى الإتمامي لصيغة المجهول اليونانية بعبارة عربية طبيعية، من غير تحويلها ببساطة إلى «مرّت».
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: ليُختن
  rationale: تفيد الغاية المقصودة من بلوغ اليوم الثامن، وتحافظ على المبني للمجهول من غير تعبير عربي متكلّف.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: سُمّي يسوع
  rationale: هذه الصياغة هي المقابل العربي الطبيعي للتعبير اليوناني الحرفي «دُعي اسمه يسوع»، وتحافظ على صيغة المبني للمجهول.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المعيارية لاسم شخص يسوع في العهد الجديد، بدل ترجمة الاسم إلى «يشوع».
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: الاسم الذي كان الملاك قد سمّاه به
  rationale: تُظهر رجوع اسم الموصول إلى «الاسم»، وتحافظ على فعل التسمية وعلى الإشارة إلى الملاك المعروف من سياق البشارة السابق.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ
  choice: قبل أن يُحبل به في الرحم
  rationale: تنقل دلالة الفعل على الحبل أو التصوّر في هذا السياق، وتحافظ على ذكر الرحم صراحة من غير إضافة مصطلحات لاهوتية لا يقتضيها النص.
theological_decisions:
- issue: صياغة عبارة الحبل وعلاقتها بالمسيحولوجيا
  choice: قبل أن يُحبل به في الرحم
  alternative: قبل الحبل به في الرحم
  rationale: تذكر العبارة حدث الحبل البشري بيسوع كما يورده النص، من غير توسع عقائدي أو إدخال لغة «الولادة» أو «الإنجاب» التي لا يدل عليها الفعل هنا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «سُمّي» بدل النقل الحرفي المتكلّف «دُعي اسمه»، مع إبقاء البديل الحرفي في الحاشية. وحافظت الصياغة على تكرار معنى التسمية في شطري الآية وعلى المبني للمجهول في الحبل والختان.
