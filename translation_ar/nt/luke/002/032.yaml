    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: نُورًا
  rationale: يحافظ على الصورة الشعرية المباشرة في اليونانية، وتلائم صيغة النصب السياق النحوي المتصل بما قبل الآية.
- source_word: εἰς ἀποκάλυψιν
  choice: لإعلانٍ
  rationale: اللام تعبّر بإيجاز عن الغاية أو النتيجة التي تفيدها εἰς، و«إعلان» ينقل معنى الكشف والإظهار مع الحفاظ على الرنين الكتابي.
- source_word: ἐθνῶν
  choice: الأمم
  rationale: هو المقابل العربي الطبيعي والأقرب إلى اللفظ اليوناني، مع بقاء احتمال الإشارة السياقية إلى غير اليهود في مقابل إسرائيل؛ لذلك وُضّح هذا الاحتمال في الحاشية.
- source_word: δόξαν
  choice: مجدًا
  rationale: ينقل معنى المجد والكرامة والبهاء، ويحافظ على الدلالة الكتابية للمفردة.
- source_word: λαοῦ σου Ἰσραήλ
  choice: شعبك إسرائيل
  rationale: صياغة عربية واضحة تحفظ علاقة الإضافة وتبيّن أن «إسرائيل» بدل أو عطف بيان يحدد هوية الشعب.
- source_word: καὶ
  choice: و
  rationale: تربط بصورة طبيعية بين شطري العبارة المتوازيين.
theological_decisions:
- issue: دلالة ἐθνῶν في مقابل إسرائيل
  choice: الأمم
  alternative: غير اليهود
  rationale: اختير «الأمم» حفاظًا على السعة المعجمية للنص اليوناني، بينما يجعل التقابل مع «شعبك إسرائيل» معنى غير اليهود مرجحًا في السياق؛ وتعرض الحاشية هذا المعنى من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة، مع الحفاظ على الإيقاع الشعري والتوازي في قول سمعان. أبقيت العبارة جزءًا نحويًا من الجملة السابقة كما في النص اليوناني.
