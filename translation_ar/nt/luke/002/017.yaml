lexical_decisions:
- source_word: ἰδόντες
  choice: ولمّا رأوه
  rationale: اسم فعل ماضٍ يفيد وقوع الرؤية قبل الفعل الرئيس. أُثبت ضمير المفعول في العربية على نحو طبيعي، ومرجعه الطفل بحسب السياق.
- source_word: δὲ
  choice: و
  rationale: أداة وصل خفيفة تتابع السرد ولا تدل هنا على مقابلة قوية.
- source_word: ἐγνώρισαν
  choice: أخبروا
  rationale: ينقل معنى جعل الأمر معلومًا أو الإبلاغ به، بصياغة عربية واضحة وطبيعية دون إيحاء بإعلان رسمي.
- source_word: περὶ τοῦ ῥήματος
  choice: بالقول
  rationale: يحافظ «القول» على الصلة اللفظية بما قيل للرعاة، مع إمكان أن يدل ῥῆμα على الكلام أو مضمونه؛ وتُذكر «الرسالة» بديلًا في الحاشية.
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: الذي قيل لهم
  rationale: يحفظ البناء المبني للمجهول وسبق القول على إخبار الرعاة.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: عن هذا الطفل
  rationale: ترجمة مباشرة وطبيعية تشير إلى الطفل يسوع في السياق من غير إضافة تفسيرية.
theological_decisions:
- issue: دلالة ῥῆμα وصلته بإعلان الملاك
  choice: القول
  alternative: الرسالة أو الكلام
  rationale: «القول» يحفظ التعدد الدلالي للمفردة وصلتها بما نطق به الملاك، دون تحميلها معنى لاهوتيًا اصطلاحيًا؛ وتوضح الحاشية البدائل الممكنة.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدم «ولمّا» لإظهار التعاقب الزمني، و«أخبروا» لطلاقة العبارة، مع إبقاء الغموض المعجمي في ῥῆμα ظاهرًا في الحاشية.
