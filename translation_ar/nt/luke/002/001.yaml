  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: ar
  text: وحدث في تلك الأيام أن صدر مرسوم عن قيصر أغسطس بأن يُسجَّل العالم المسكون كله[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «العالم الروماني كله»، أو «الإمبراطورية كلها». كثيرًا ما يشير اللفظ اليوناني إلى العالم المسكون كما كان يُتصوَّر في سياق الإمبراطورية الرومانية.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وحدث
  rationale: صيغة سردية تنقل إلى حدث جديد؛ «وحدث» عربية طبيعية تحفظ معنى الوقوع وقوة الربط التي تؤديها δὲ من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: في تلك الأيام
  rationale: تعبير زمني مباشر وطبيعي يطابق بنية اليونانية ومعناها.
- source_word: ἐξῆλθεν
  choice: صدر
  rationale: يصف خروج الأمر من السلطة وإعلانه؛ «صدر» هو التعبير العربي المألوف مع المراسيم، ويحفظ المعنى من غير حرفية ثقيلة.
- source_word: δόγμα
  choice: مرسوم
  rationale: يدل هنا على أمر رسمي إمبراطوري، و«مرسوم» واضح ودقيق في هذا السياق.
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: عن قيصر أغسطس
  rationale: παρά مع المضاف إليه تدل على المصدر؛ «عن» تبين أن المرسوم صادر من قيصر، وهي سليمة مع الفعل «صدر».
- source_word: ἀπογράφεσθαι
  choice: بأن يُسجَّل
  rationale: الفعل يدل على التسجيل الرسمي، وقد يرتبط بالإحصاء أو الضرائب، لكن الآية نفسها لا تصرح بتلك الغاية؛ لذلك تجنبت زيادة «إحصاء» في المتن.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: العالم المسكون كله
  rationale: يحفظ المعنى الأساسي لـ οἰκουμένη، أي العالم المأهول أو المسكون، من غير حصر صريح في الإمبراطورية داخل المتن، مع بيان الاحتمال السياقي في الحاشية.
theological_decisions:
- issue: نطاق οἰκουμένη
  choice: العالم المسكون كله
  alternative: العالم الروماني كله؛ أو الإمبراطورية كلها
  rationale: المسألة تاريخية معجمية في المقام الأول. يحافظ المتن على الدلالة الواسعة للفظ اليوناني، بينما تعرض الحاشية الفهم المقيد بالسياق الإمبراطوري الروماني من غير أن تحسم ما أبقاه اللفظ قابلًا لأكثر من تصور.
translation_notes:
  register: فصحى معاصرة واضحة ورصينة. استُخدم «صدر مرسوم» بوصفه تركيبًا عربيًا طبيعيًا للقرار الإمبراطوري، مع إبقاء «العالم المسكون» في المتن حفاظًا على سعة اللفظ اليوناني. تظهر علامة الحاشية [a] في موضعها.
