  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: ar
  text: لكنّهما، إذ ظنّا أنه بين جماعة المسافرين[a]، سارا مسيرة يوم، ثم أخذا يبحثان عنه[b] بين الأقارب والمعارف.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «القافلة»؛ واللفظ اليوناني يشير إلى جماعة تسافر معًا.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة الفعل: «وكانا يبحثان عنه»، لإبراز استمرار البحث.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: إذ ظنّا
  rationale: ينقل اسم الفاعل الماضي افتراض مريم ويوسف عند انطلاقهما، مع إبقاء معنى الظن غير اليقيني.
- source_word: δὲ
  choice: لكنّهما
  rationale: تفيد الأداة انتقالًا فيه مقابلة خفيفة مع بقاء يسوع في أورشليم في الآية السابقة، والضمير المثنى يلائم مريم ويوسف.
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: أنه بين جماعة المسافرين
  rationale: تدل συνοδία على جماعة تسافر معًا؛ وهذه الصياغة عربية واضحة ولا تحصر المعنى في قافلة تجارية.
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: سارا مسيرة يوم
  rationale: صياغة عربية موجزة تنقل التعبير اليوناني الدال على مسافة أو مدة سفر يوم واحد.
- source_word: ἀνεζήτουν
  choice: ثم أخذا يبحثان عنه
  rationale: ينقل الفعل الناقص بدء البحث واستمراره في سياق السرد، من غير اختزاله إلى حدث لحظي.
- source_word: συγγενεῦσιν
  choice: الأقارب
  rationale: لفظ عام طبيعي يشمل ذوي القرابة دون تخصيص جنس.
- source_word: γνωστοῖς
  choice: المعارف
  rationale: يحافظ على معنى الأشخاص المعروفين لهما دون رفع درجة العلاقة بالضرورة إلى الصداقة الحميمة.
