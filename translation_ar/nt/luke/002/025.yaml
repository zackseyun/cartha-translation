language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: ar
  text: وإذا رجلٌ في أورشليم اسمه سمعان. وكان هذا الرجل بارًّا تقيًّا، ينتظر تعزية إسرائيل[a]، وكان الروح القدس عليه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي التعزية الإلهية التي كان إسرائيل يرجوها، وما تتضمنه من راحة واسترداد؛ ويمكن أيضًا ترجمتها: «راحة إسرائيل».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن، من جهة الصياغة اليونانية، أن تُفهم العبارة: «كان روحٌ مقدسةٌ عليه»، لكن سياق لوقا يرجّح أن المقصود هو الروح القدس.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: وها إنّ
  rationale: تحافظ على أداة التنبيه والتقديم الحي في السرد، بصياغة عربية فصيحة واضحة، بدل حذفها.
- source_word: ἄνθρωπος
  choice: رجلًا
  rationale: المراد شخص ذكر بعينه، وهو سمعان، لذلك كانت «رجل» أدق من لفظ عام مثل «إنسان».
- source_word: ᾧ ὄνομα Συμεών
  choice: اسمه سمعان
  rationale: صياغة عربية طبيعية تؤدي وظيفة التركيب اليوناني في التعريف بالشخص.
- source_word: δίκαιος
  choice: بارًّا
  rationale: تنقل الدلالة الأخلاقية والعلاقية الواسعة للكلمة، وهي أنسب هنا من «عادلًا» التي قد تُفهم بمعنى قضائي أضيق.
- source_word: εὐλαβής
  choice: تقيًّا
  rationale: لفظ عربي موجز وطبيعي يدل على توقير الله والحرص في العبادة والسلوك.
- source_word: προσδεχόμενος
  choice: ينتظر
  rationale: ينقل معنى الترقب المستمر المشوب بالتوقع، من غير إضافة درجة من اللهفة لا يصرح بها اللفظ.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: تعزية إسرائيل
  rationale: تحفظ معنى التعزية والراحة الإلهية المنتظرة، مع صداها الكتابي المتصل برجاء استرداد إسرائيل.
- source_word: πνεῦμα ἅγιον
  choice: الروح القدس
  rationale: مع أن العبارة اليونانية بلا أداة تعريف، فإن استعمال لوقا والسياق القريب في العددين التاليين يرجحان الإشارة إلى الروح القدس المعروف.
- source_word: ἐπ’ αὐτόν
  choice: كان ... عليه
  rationale: يحفظ التعبير الكتابي الدال على حضور الروح وعمله، من غير إضافة معنى «استقر» أو «حلّ» غير المصرح به هنا.
theological_decisions:
- issue: مرجع العبارة πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν
  choice: كان الروح القدس عليه
  alternative: كان روحٌ قدوسٌ عليه
  rationale: السياق المباشر في لوقا 2:26-27 واستعمال لوقا لعبارة «الروح القدس» يرجحان أن المقصود هو الروح القدس، مع إبقاء الاحتمال النحوي الآخر في الحاشية بدل طمسه.
- issue: دلالة «تعزية إسرائيل»
  choice: تعزية إسرائيل
  alternative: راحة إسرائيل
  rationale: المقصود ليس مجرد شعور فردي بالارتياح، بل الرجاء في تعزية الله لشعبه واسترداده؛ وتحفظ الصياغة هذا الغنى من غير تحديد كيفية تحقق الرجاء بما يتجاوز النص.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموقرة. استُعملت «وها إنّ» لإبقاء أداة التنبيه السردية، وقُسّمت الجملة بعد اسم سمعان لتجنب الثقل مع الحفاظ على ترابط أوصافه. أُثبتت علامتا الحاشيتين في موضعيهما المطابقين لمضمونهما.
