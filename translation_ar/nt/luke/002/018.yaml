  text: καὶ πάντες οἱ ἀκούσαντες ἐθαύμασαν περὶ τῶν λαληθέντων ὑπὸ τῶν ποιμένων πρὸς αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/018.yaml
  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: ar
  text: وَكُلُّ الَّذِينَ سَمِعُوا تَعَجَّبُوا مِمَّا قَالَهُ لَهُمُ الرُّعَاةُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «دُهِشُوا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: تحافظ الواو على صلة الآية البسيطة بسياق السرد السابق.
- source_word: πάντες οἱ ἀκούσαντες
  choice: كُلُّ الَّذِينَ سَمِعُوا
  rationale: ترجمة طبيعية ودقيقة لاسم الفاعل المعرّف المستعمل استعمال الاسم؛ ولا يلزم في العربية ذكر مفعول به مقدّر لأن السياق يوضّح المسموع.
- source_word: ἐθαύμασαν
  choice: تَعَجَّبُوا
  rationale: يفيد الفعل اليوناني الدهشة والتعجب إزاء الخبر، وهذا المقابل عربي فصيح واضح ولا يقرر إيمان السامعين أو عدمه.
- source_word: περὶ τῶν λαληθέντων
  choice: مِمَّا قَالَهُ
  rationale: ينقل مضمون الكلام وسبب التعجب بصياغة عربية طبيعية؛ وتحويل المبني للمجهول إلى صيغة معلومة جائز هنا لأن الفاعل مذكور صراحة في العبارة التالية.
- source_word: ὑπὸ τῶν ποιμένων
  choice: الرُّعَاةُ
  rationale: ينقل فاعل الكلام، أي الرعاة، مع إعادة بناء الجملة بصيغة المعلوم الطبيعية في العربية.
- source_word: πρὸς αὐτούς
  choice: لَهُم
  rationale: تحفظ اللام اتجاه الكلام إلى السامعين، وتبقي مرجع الضمير على عمومه كما في اليونانية.
theological_decisions:
- issue: طبيعة استجابة السامعين التي يصفها ἐθαύμασαν
  choice: تُعرض بوصفها تعجبًا دون الجزم بأنها إيمان خلاصي أو عدم إيمان.
  alternative: فهم التعجب على أنه استجابة إيمانية إيجابية، أو مجرد فضول عابر.
  rationale: الفعل اليوناني يصف رد فعل من الدهشة، ولا يحدد وحده الموقف الروحي النهائي للسامعين؛ لذلك تُحفظ مساحة النص الدلالية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغة المعلوم لتجنب ثقل «مما قيل لهم على يد الرعاة»، مع حفظ جميع العلاقات الدلالية في الأصل.
