  source_fidelity: 'الترجمة أمينة للنص اليوناني: «وكل الذين سمعوا» تقابل πάντες οἱ ἀκούσαντες، و«تعجبوا» تنقل ἐθαύμασαν دون تحميلها دلالة إيمانية زائدة. كما أن «مما قاله لهم الرعاة» تعيد بصورة عربية سليمة مضمون περὶ τῶν λαληθέντων ὑπὸ τῶν ποιμένων πρὸς αὐτούς، مع إظهار الفاعل المذكور في الأصل والمحافظة على جهة الخطاب «لهم».'
