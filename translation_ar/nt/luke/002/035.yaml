  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: ar
  text: وسيجتاز سيفٌ[b] نفسكِ أنتِ أيضًا[a]، لكي تنكشف أفكارٌ من قلوبٍ كثيرة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيخترق نفسك». المعنى الأساسي للفعل اليوناني هو «يجتاز» أو «يمرّ عبر»، أمّا معنى الاختراق فتستدعيه صورة السيف طبيعيًا.'
    reason: lexical_alternative
  - marker: b
    text: يُفهم «السيف» عادةً على أنه صورة للألم العميق الذي ستختبره مريم، من غير أن تحدد الآية هنا كيفية وقوع ذلك الألم.
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: نفسك أنتِ
  rationale: يؤكد الضمير αὐτῆς الضمير المضاف σοῦ؛ وإضافة «أنتِ» تنقل هذا التوكيد في خطاب مريم بوضوح طبيعي.
- source_word: ψυχή
  choice: نفس
  rationale: تشير هنا إلى باطن الإنسان وموضع ألمه العميق، و«نفس» مقابل عربي راسخ يحفظ الثقل النفسي والروحي دون حصر المعنى في الحياة الجسدية.
- source_word: διελεύσεται
  choice: سيجوز في
  rationale: المعنى الأساسي للفعل هو المرور أو الاجتياز. ويحفظ «يجوز في» الصورة الأصلية من غير أن يضيف صراحة معنى «يطعن»، مع أن صورة السيف توحي به.
- source_word: ῥομφαία
  choice: سيف
  rationale: تدل الكلمة على سيف كبير، لكن «سيف» هو التعبير العربي الطبيعي والكافي في هذا السياق المجازي.
- source_word: ὅπως ἂν
  choice: لكي
  rationale: تنقل الغاية أو النتيجة المقصودة التي تربط ما سبق بانكشاف الأفكار.
- source_word: ἀποκαλυφθῶσιν
  choice: تنكشف
  rationale: تحفظ معنى الكشف والبنية المبنية للمجهول دلاليًا بصياغة عربية طبيعية.
- source_word: ἐκ πολλῶν καρδιῶν
  choice: قلوب كثيرة
  rationale: تتعلق العبارة بالأفكار الكامنة في القلوب والصادرة منها؛ وصياغة «أفكار قلوب كثيرة» طبيعية وتدل على مصدر الأفكار من داخل القلوب.
- source_word: διαλογισμοί
  choice: أفكار
  rationale: لفظ واسع يشمل الخواطر والاستدلالات والمداولات الباطنية، من غير فرض كونها شريرة أو صالحة.
theological_decisions:
- issue: المخاطَبة ودلالة السيف النبوية
  choice: حُفظ الخطاب المباشر لمريم، ووُصف السيف من غير تحديد الحدث التاريخي الذي يحقق صورة الألم.
  alternative: تفسير السيف صراحة بأنه حزن مريم عند صلب يسوع، أو بأنه الألم الناشئ عن أثر رسالة يسوع الذي يقسم الناس.
  rationale: اليونانية تخاطب مريم مباشرة وتنبئ بألم شخصي عميق، لكنها لا تحدد في هذه الجملة كيفية تحقق الصورة؛ لذا لا ينبغي حسم ما أبقاه النص ضمنيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يجوز في» للمحافظة على صورة العبور في الأصل مع إيضاح البديل «يخترق» في الحاشية، ووُضع ضمير التأكيد «أنتِ» لإبراز التوكيد الموجَّه إلى مريم.
