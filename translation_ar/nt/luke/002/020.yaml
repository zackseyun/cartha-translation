source:
  edition: SBLGNT
  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: ar
  text: ورجع الرعاة وهم يمجّدون الله ويسبّحونه على كل ما سمعوه ورأوه، كما قيل لهم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: رجع
  rationale: فعل ماضٍ يدل على عودة الرعاة من زيارتهم، و«رجع» تعبير عربي واضح وطبيعي.
- source_word: οἱ ποιμένες
  choice: الرعاة
  rationale: المقابل العربي المألوف في هذا السياق، ويشير إلى الرجال المذكورين سابقًا في الرواية.
- source_word: δοξάζοντες
  choice: يمجّدون
  rationale: يحفظ معنى إسناد المجد إلى الله، وصيغة الحال مع «وهم» تبيّن أن ذلك صاحب رجوعهم.
- source_word: αἰνοῦντες
  choice: يسبّحونه
  rationale: يحفظ فعلاً مستقلاً إلى جانب «يمجّدون»، ويعبّر طبيعيًا عن الثناء التعبدي على الله.
- source_word: τὸν θεὸν
  choice: الله
  rationale: مفعول به للفعلين المشار إليهما، وذُكر الضمير في الفعل الثاني اتساقًا مع الأسلوب العربي.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: على كل ما
  rationale: تفيد العبارة أساس التمجيد والتسبيح أو مناسبتهما، و«على كل ما» تحافظ على سعة الدلالة دون حصرها صراحة في السببية.
- source_word: ἤκουσαν καὶ εἶδον
  choice: سمعوه ورأوه
  rationale: يحافظ الماضي العربي على تسلسل السرد بوضوح، والضميران العائدان إلى «ما» طبيعيان في العربية.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: كما قيل لهم
  rationale: يحفظ المبني للمجهول ويترك القائل غير مصرّح به كما في اليونانية، من غير إضافة «الملاك» من السياق.
theological_decisions:
- issue: هل يُصرَّح بأن القائل هو الملاك أو الملائكة؟
  choice: 'الإبقاء على المبني للمجهول: «كما قيل لهم»'
  alternative: «كما قال لهم الملاك» أو «كما قالت لهم الملائكة»
  rationale: النص اليوناني لا يسمّي الفاعل في هذه الجملة، وإن كان السياق يشير إلى البشارة الملائكية؛ لذلك تُحفظ صياغته المفتوحة بلا توسعة تفسيرية.
- issue: دلالة ἐπί في أساس التسبيح
  choice: «على كل ما»
  alternative: «بسبب كل ما»
  rationale: يمكن أن تدل ἐπί مع المجرور على الأساس أو المناسبة؛ والصياغة المختارة طبيعية وتحفظ قدرًا من هذا الاتساع بدل حصرها في علاقة سببية صريحة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت جملة الحال «وهم يمجّدون» لإظهار أن التمجيد والتسبيح رافقا رجوع الرعاة، مع الحفاظ على التمييز بين الفعلين وعلى المبني للمجهول في خاتمة الآية.
