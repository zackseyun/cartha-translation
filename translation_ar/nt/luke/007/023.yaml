  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: ar
  text: وطوبى لمن لا يعثر بسببي[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يستاء مني»، أو: «لا يسقط بسببي».'
    reason: بدائل معجمية توضّح مدى دلالة الفعل اليوناني، من اتخاذ يسوع موضع اعتراض إلى التعثر أو السقوط بسببه.
lexical_decisions:
- source_word: μακάριος
  choice: طوبى
  rationale: تعبير عربي كتابي فصيح وطبيعي يحفظ معنى البركة والغبطة ذات البعد الديني في أقوال التطويب، ولا يختزلها في مجرد السعادة النفسية أو الحظ.
- source_word: ὃς
  choice: لمن
  rationale: صياغة عربية موجزة وطبيعية للموصول المفرد ذي الدلالة العامة، من غير تقييده بجنس معين.
- source_word: ἐὰν μὴ
  choice: لا
  rationale: ينقل الشرط العام مع صيغة الفعل اليونانية بأسلوب عربي سليم داخل تركيب التطويب، من غير إثقال العبارة بأداة شرط صريحة.
- source_word: σκανδαλισθῇ
  choice: يعثر
  rationale: يحفظ صورة العثرة المقصودة في الفعل اليوناني، بما تتضمنه من اتخاذ يسوع سببًا للتردد أو السقوط، من غير حصرها في الاستياء العاطفي وحده. ومع أن اليونانية مبنية للمجهول، فإن العربية تستعمل «يعثر» طبيعيًا بهذا المعنى السببي في هذا التركيب.
- source_word: ἐν ἐμοί
  choice: بسببي
  rationale: ينقل دلالة المناسبة أو السبب في هذا الاستعمال بوضوح، ويبيّن أن شخص يسوع أو عمله قد يصير موضع عثرة، بينما تبدو «فيَّ» غامضة في العربية الحديثة.
theological_decisions:
- issue: مدى دلالة العثرة بسبب يسوع
  choice: 'الإبقاء على صورة العثرة: «لا يعثر بسببي»'
  alternative: «لا يستاء مني» أو «لا يرتد بسببي»
  rationale: يحفظ النص التوتر بين الاعتراض على يسوع وبين ما قد ينجم عنه من تعثر روحي، من غير تضييق المعنى إلى شعور بالإساءة فقط، ولا توسيعه حتمًا إلى الارتداد الكامل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «طوبى» لرسوخها وفصاحتها في سياق أقوال التطويب، و«يعثر بسببي» للمحافظة على الصورة المجازية والتوتر الدلالي في الأصل.
