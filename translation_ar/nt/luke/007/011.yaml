base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: ar
  text: وَحَدَثَ فِي الْيَوْمِ التَّالِي أَنَّهُ ذَهَبَ إِلَى بَلْدَةٍ تُدْعَى نَايِين، وَكَانَ تَلَامِيذُهُ وَجَمْعٌ غَفِيرٌ يَسِيرُونَ مَعَهُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «بعد ذلك بقليل» بدلًا من «في اليوم التالي».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: وحدث ... أنه
  rationale: تنقل الصيغة السردية اللوقاوية بعبارة عربية فصيحة طبيعية، من غير استعمال تعبير قديم متكلف.
- source_word: ἐν τῷ ἑξῆς
  choice: بعد ذلك بقليل
  rationale: التركيب المحايد ذو الأداة τῷ يفيد الزمن اللاحق، والأقرب هنا «بعد ذلك بقليل»، بخلاف قراءة توضح أن الحدث كان في اليوم التالي.
- source_word: ἐπορεύθη
  choice: ذهب
  rationale: فعل عربي مباشر وطبيعي ينقل معنى الانتقال في السياق السردي.
- source_word: εἰς πόλιν
  choice: إلى بلدة
  rationale: «بلدة» أنسب لحجم نايين، وحرف «إلى» يؤدي معنى الاتجاه المقصود من εἰς بصورة طبيعية في العربية.
- source_word: καλουμένην Ναΐν
  choice: تُدعى نايين
  rationale: صياغة عربية مألوفة تنقل اسم الموضع واسم المفعول اليوناني بوضوح.
- source_word: συνεπορεύοντο
  choice: كانوا يسيرون معه
  rationale: تركيب «كانوا يسيرون» يحفظ دلالة الماضي المستمر في الفعل اليوناني وحركة المصاحبة.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذه
  rationale: المقابل العربي الاصطلاحي الطبيعي والموجز للعبارة اليونانية.
- source_word: ὄχλος πολύς
  choice: جمع غفير
  rationale: تعبير عربي فصيح واضح يدل على كثرة الجمع من غير مبالغة تفسيرية.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة سردية كريمة. أُبقيت صيغة «وحدث ... أنه» لتعكس افتتاح الحدث في الأصل، واستُعمل «جمع غفير» بوصفه تعبيرًا عربيًا شائعًا مفهومًا.
