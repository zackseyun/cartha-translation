lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: جميعُ الشعب
  rationale: يحافظ على دلالة التعبير الجمعي الشامل بصياغة عربية واضحة وطبيعية.
- source_word: ἀκούσας
  choice: لمّا سمعوا
  rationale: ينقل اسم الفاعل الأوريستي بوظيفة زمنية طبيعية، من غير إضافة مفعول صريح غير موجود في اليونانية.
- source_word: οἱ τελῶναι
  choice: جُباةُ الضرائب
  rationale: تعبير عربي معاصر وواضح يدل على أصحاب هذه الوظيفة في السياق القديم.
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: أقرّوا بأن الله على حقّ
  rationale: ينقل معنى اعترافهم بصواب الله وبرّه، ولا يوهم بأنهم جعلوا الله بارًّا. وتُحفظ الصياغة الأكثر حرفية في الحاشية.
- source_word: βαπτισθέντες
  choice: إذ كانوا قد اعتمدوا
  rationale: يحافظ على الصلة الظرفية الخلفية من غير الجزم بأنها سببية، مع الإشارة إلى احتمال السببية في الحاشية.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: بمعمودية يوحنا
  rationale: صياغة عربية موجزة ومألوفة تنقل تركيب الإضافة اليوناني وتدل على المعمودية المرتبطة بيوحنا.
theological_decisions:
- issue: معنى «ἐδικαίωσαν τὸν θεόν»
  choice: أقرّوا بأن الله على حقّ
  alternative: برّروا الله؛ أو أقرّوا بأن الله عادل
  rationale: المقصود إقرار الناس بصواب الله وعدله، لا إحداث تغيير في برّه أو مكانته. تحافظ الصياغة على الدلالة القضائية بصورة مفهومة.
- issue: دلالة اسم الفاعل «βαπτισθέντες»
  choice: 'صياغته ظرفيًا: «إذ كانوا قد اعتمدوا»'
  alternative: 'صياغته سببيًا: «لأنهم كانوا قد اعتمدوا»'
  rationale: يمكن للسياق أن يحمّله معنى سببيًا، لكن الصيغة اليونانية نفسها لا تحسم ذلك؛ لذلك يحافظ المتن على الغموض المشروع وتذكر الحاشية القراءة السببية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «ومنهم» لبيان أن جباة الضرائب داخلون في عموم الشعب من غير إضافة نبرة استغراب لا يقتضيها النص، وحُفظ الغموض النحوي في علاقة المعمودية بإقرارهم.
