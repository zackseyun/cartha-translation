  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: ar
  text: ولمّا لم يكن لديهما ما يسدّدان به، أعفاهما كليهما من دَيْنَيْهما تفضّلًا.[a] فأيُّهما إذن سيحبّه أكثر؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غفر لهما تفضّلًا». يمكن أن يدلّ الفعل اليوناني على منح الشيء تفضّلًا أو إسقاط ما هو مستحقّ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: ولمّا لم يكن لديهما ما يوفِيان به
  rationale: ينقل التركيب المطلق في المضاف إليه الظرف المبيّن لعجز المدينين عن السداد، ويؤدي ἀποδοῦναι في سياق الدَّين بمعنى الوفاء أو السداد.
- source_word: ἀμφοτέροις ἐχαρίσατο
  choice: أسقط عنهما الدَّين كليهما بكرمه
  rationale: يجمع التعبير بين إسقاط ما استُحق عليهما وبين دلالة χαρίζομαι على التفضّل والعطاء بلا مقابل، مع جعل المرجع المالي واضحًا في العربية.
- source_word: τίς οὖν αὐτῶν
  choice: فأيُّهما إذن
  rationale: صيغة «أيّهما» طبيعية لأن الحديث عن مدينين اثنين، و«إذن» تحفظ دلالة الاستنتاج في οὖν.
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: سيحبّه أكثر
  rationale: ترجمة مباشرة تحفظ صيغة المستقبل والمقارنة ودلالة ἀγαπάω على المحبة.
theological_decisions:
- issue: دلالة χαρίζομαι في مثل عن الدَّين والغفران
  choice: أسقط عنهما الدَّين كليهما بكرمه
  alternative: غفر لكليهما بكرمه
  rationale: السياق المباشر مالي، ولذلك يوضح النص إسقاط الدَّين، فيما تحفظ عبارة «بكرمه» معنى التفضّل الملازم للفعل. وتذكر الحاشية البديل الذي يبرز لغة الغفران، من غير حصر اللفظ في بُعد واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل المثنى حيث يلائم طرفي المثل، وصيغت العبارة المالية بأسلوب طبيعي مع إبقاء الصلة الدلالية بين إسقاط الدَّين والتفضّل والغفران.
