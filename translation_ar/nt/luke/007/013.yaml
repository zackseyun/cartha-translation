base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: ar
  text: 'ولمّا رآها الرب، تحنَّن عليها وقال لها: «لا تبكي».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لا تذرفي الدموع» أو «كفّي عن البكاء». يمكن أن يُفهم اليوناني إمّا نهيًا عامًا، وإمّا طلبًا منها أن تتوقف عن بكائها الجاري.
    reason: بديل معجمي ودلالة صيغة الأمر
lexical_decisions:
- source_word: ἰδὼν
  choice: ولمّا رآها
  rationale: اسم الفاعل الأُورستي يدل هنا على فعل سابق للفعل الرئيس؛ وصياغة «ولمّا رآها» تنقل العلاقة الزمنية بوضوح وطبيعية.
- source_word: ὁ κύριος
  choice: الرب
  rationale: يحفظ اللقب الذي يستخدمه لوقا ليسوع في السرد، بدل اختزاله إلى معنى «السيد» أو «المعلّم».
- source_word: ἐσπλαγχνίσθη
  choice: تحنَّن
  rationale: ينقل معنى التأثر العميق بالشفقة والرحمة، بعبارة عربية موجزة وكريمة، من غير اللجوء إلى النقل الحرفي الغريب المتعلق بالأحشاء.
- source_word: ἐπ’ αὐτῇ
  choice: عليها
  rationale: مع فعل التحنن، تفيد العبارة الشخص الذي اتجهت إليه الرحمة؛ و«تحنَّن عليها» تعبير عربي طبيعي.
- source_word: εἶπεν αὐτῇ
  choice: وقال لها
  rationale: مطابقة طبيعية ومباشرة لفعل القول، من غير إضافة إيحاء يتجاوز النص.
- source_word: Μὴ κλαῖε
  choice: لا تبكي
  rationale: تحفظ المعنى المباشر لفعل البكاء، كما تُبقي احتمال النهي العام أو طلب الكف عن البكاء الجاري دون حسم زائد.
theological_decisions:
- issue: ترجمة κύριος بوصفه لقبًا ليسوع
  choice: الرب
  alternative: السيد
  rationale: سياق لوقا السردي يقدّم اللفظة هنا لقبًا مرفوعًا ليسوع؛ و«الرب» يحفظ ثقلها الكريستولوجي من غير إضافة تفسير عقائدي إلى العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدم «تحنَّن عليها» للحفاظ على قوة الرحمة العميقة مع تجنب الحرفية المستغرَبة، ووُضعت علامة الحاشية بعد العبارة التي تشرحها.
