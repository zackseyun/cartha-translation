source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: ar
  text: 'لذلك أقول لك: قد غُفرت خطاياها الكثيرة، لأنها أحبّت كثيرًا.[a] وأمّا من يُغفر له قليلًا، فيحبّ قليلًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ومن ثمّ أحبّت كثيرًا». يمكن فهم أداة الربط اليونانية على نحو يجعل محبتها دليلًا على أنها نالت الغفران، لا سببًا له.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: لذلك
  rationale: تعبير سببي أو استنتاجي، و«لذلك» ينقل قوة الربط بإيجاز وطبيعية في العربية.
- source_word: ἀφέωνται
  choice: قد غُفرت
  rationale: المضارع التام المبني للمجهول في اليونانية يدل على فعل تمّ وبقيت نتيجته؛ وتؤدي «قد غُفرت» هذا المعنى بوضوح.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: خطاياها الكثيرة
  rationale: صياغة عربية طبيعية تحفظ دلالة كثرة الخطايا وإضافتها إلى المرأة.
- source_word: ὅτι
  choice: لأنها
  rationale: تحفظ الدلالة السببية الظاهرة لأداة الربط اليونانية، مع إبقاء التوتر التفسيري وعدم حسم ما إذا كانت المحبة سببًا أم دليلًا في متن الترجمة.
- source_word: ἠγάπησεν πολύ
  choice: أحبّت كثيرًا
  rationale: ترجمة مباشرة وطبيعية للفعل الماضي والظرف، وتحفظ التوازي مع «فيحبّ قليلًا».
- source_word: ᾧ δὲ
  choice: وأمّا من
  rationale: ينقل التقابل ويعبّر عن الموصول المفرد بصيغة عامة لا تفرض تخصيصًا جنسيًا غير لازم.
- source_word: ὀλίγον ἀφίεται
  choice: يُغفر له قليلًا
  rationale: يحفظ المبني للمجهول والمعنى الكمي، مع صياغة عربية واضحة.
- source_word: ὀλίγον ἀγαπᾷ
  choice: فيحبّ قليلًا
  rationale: يحافظ على الإيجاز والقوة الحكمية وعلى التوازي اللفظي مع الشطر السابق.
theological_decisions:
- issue: هل تفيد ὅτι أن محبة المرأة هي السبب المستحق لغفرانها؟
  choice: الإبقاء على الصيغة السببية «لأنها أحبّت كثيرًا» في المتن، مع بيان إمكان فهم المحبة دليلًا على حالة الغفران في الحاشية.
  alternative: «ومن ثمّ أحبّت كثيرًا» أو صياغة تُظهر أن المحبة نتيجة الغفران.
  rationale: تحفظ «لأن» الدلالة المباشرة الممكنة للأداة اليونانية والتوتر اللاهوتي في العبارة، بينما يوحي سياق المثل والآية 50 بأن الغفران يسبق المحبة ويولّدها؛ لذلك تُذكر القراءة الاستدلالية في الحاشية من غير فرضها على المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «قد غُفرت» لإبراز الفعل المكتمل ذي النتيجة القائمة، وحُفظ التوازي الموجز بين «يُغفر له قليلًا» و«فيحبّ قليلًا».
