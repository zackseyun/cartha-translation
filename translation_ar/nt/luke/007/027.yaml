  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: ar
  text: 'هذا هو الذي كُتب عنه: «ها أنا أرسل رسولي أمام وجهك[a]، الذي سيهيّئ طريقك أمامك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بأسلوب أسلس: «أمامك». واليونانية حرفيًا: «أمام وجهك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: هذا هو
  rationale: يحفظ قوة الإشارة إلى يوحنا، وهو تعبير عربي طبيعي في هذا السياق.
- source_word: περὶ οὗ γέγραπται
  choice: الذي كُتب عنه
  rationale: صياغة عربية واضحة تحفظ تركيب الإحالة وصيغة الاقتباس الكتابي.
- source_word: Ἰδοὺ
  choice: ها أنا
  rationale: مع اقترانها بالفعل بضمير المتكلم، تنقل قوة التنبيه في الاقتباس النبوي بصورة فصيحة وطبيعية.
- source_word: ἀποστέλλω
  choice: أرسل
  rationale: المضارع العربي مناسب للحاضر اليوناني الحي في سياق القول النبوي.
- source_word: ἄγγελόν μου
  choice: رسولي
  rationale: لفظ «رسول» هنا يدل بوضوح على مبعوث بشري، أي يوحنا، من غير الإيحاء بكائن سماوي.
- source_word: πρὸ προσώπου σου
  choice: أمام وجهك
  rationale: يحفظ الصورة الحسية في اليونانية وخلفية الاقتباس، مع بيان البديل الأسلس في الحاشية.
- source_word: κατασκευάσει
  choice: يهيّئ
  rationale: ينقل معنى الإعداد والتجهيز بوضوح، والمضارع العربي صالح لاستقبال الفعل بعد السياق النبوي.
- source_word: τὴν ὁδόν σου
  choice: طريقك
  rationale: المقابل العربي الطبيعي الذي يلائم الاستعمال النبوي والمجازي.
- source_word: ἔμπροσθέν σου
  choice: أمامك
  rationale: صياغة عربية طبيعية تميّزه عن العبارة التصويرية السابقة «أمام وجهك».
theological_decisions:
- issue: تطبيق يسوع لغة الاقتباس النبوي على يوحنا في علاقته به
  choice: 'الإبقاء على ضمائر المخاطب: «وجهك»، «طريقك»، «أمامك» من دون شرح تفسيري داخل النص'
  alternative: التصريح بأن الرسول يهيئ طريق الرب أو المسيح
  rationale: يحفظ النص كما صاغه اليوناني، ويبقي القوة اللاهوتية والتوتر الدلالي في تطبيق الاقتباس من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «رسولي» لا «ملاكي» لأن السياق يتحدث عن يوحنا بوصفه مبعوثًا بشريًا. وُضعت علامة الحاشية [a] بعد العبارة التي تشرحها مباشرة.
