  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: ar
  text: 'أقول لكم: بين المولودين من النساء[b] لا أحد أعظم من يوحنا؛ ومع ذلك، فالأصغر[c] في ملكوت الله أعظم منه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: تعبير «المولودين من النساء» يُراد به البشر عمومًا.
    reason: cultural_note
  - marker: c
    text: 'ويجوز توضيح العبارة: «الذي هو الأصغر في ملكوت الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: صيغة خطاب مباشرة شائعة، وتحافظ على دلالة الفعل في اليونانية من غير زيادة تفسيرية.
- source_word: μείζων
  choice: أعظم
  rationale: تحافظ على صيغة المقارنة ولا تحدد إن كانت العظمة منزلة أو امتيازًا أو صفة أخرى.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: بين المولودين من النساء
  rationale: صياغة عربية واضحة وقريبة من التعبير اليوناني، مع إبقاء النكهة السامية للتعبير الدال على البشر عمومًا.
- source_word: Ἰωάννου
  choice: يوحنا
  rationale: الصيغة العربية الكتابية المألوفة للاسم.
- source_word: οὐδείς ἐστιν
  choice: لا أحد
  rationale: تعبير عربي طبيعي ومباشر عن النفي المطلق في سياق المقارنة.
- source_word: ὁ δὲ μικρότερος
  choice: ومع ذلك، فالأصغر
  rationale: استُعمل «الأصغر» اسميًا كما في اليونانية، مع نقل قوة δέ التقابلية من غير المبالغة في حدتها.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: في ملكوت الله
  rationale: يحافظ على التعبير الكتابي العربي المألوف وعلى الدلالة المكانية لحرف الجر.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: أعظم منه
  rationale: ينقل المقارنة بإيجاز عربي طبيعي، ويبقي مرجع الضمير إلى يوحنا واضحًا من السياق.
theological_decisions:
- issue: أساس المقارنة بين يوحنا و«الأصغر» في ملكوت الله
  choice: إبقاء المفارقة كما وردت، من غير تحديد المقصود بالعظمة.
  alternative: تفسير العظمة بأنها امتياز عهدي، أو منزلة روحية وأخلاقية، أو موقع في تاريخ الخلاص.
  rationale: النص اليوناني يقرر المقارنة لكنه لا يبين وجه العظمة؛ لذلك لا تحسم الترجمة توترًا لاهوتيًا تركه النص مفتوحًا.
- issue: دلالة ὁ μικρότερος
  choice: الأصغر
  alternative: من هو أصغر / الأقل شأنًا
  rationale: الصيغة اليونانية تحتمل تعبيرًا اسميًا موجزًا، ولا يلزم منها تحديد نوع الصغر أو ربطه حكمًا بالقيمة الروحية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. حُفظ التعبير الكتابي «المولودين من النساء» و«ملكوت الله»، مع تجنب تفسير أساس المفاضلة أو إزالة المفارقة المقصودة.
