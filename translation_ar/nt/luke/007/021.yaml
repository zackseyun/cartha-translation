    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: وفي تلك الساعة عينها
  rationale: يحافظ على التحديد الزمني، ويُبرز فورية الحدث التي قد يفيدها التعبير اليوناني في السياق.
- source_word: ἐθεράπευσεν
  choice: شفى
  rationale: المقابل العربي الطبيعي المباشر لفعل الشفاء في سياق معجزات الإنجيل.
- source_word: πολλοὺς
  choice: كثيرين
  rationale: يبقي المفعول البشري مفهومًا من الصيغة من غير إضافة اسم غير مصرح به.
- source_word: ἀπὸ νόσων
  choice: من أمراضٍ
  rationale: تفيد ἀπό الخلاص أو الانفصال عن الأمراض، وحرف الجر «من» يحفظ هذه الدلالة طبيعيًا.
- source_word: μαστίγων
  choice: آلامٍ شديدة
  rationale: اللفظة تعني حرفيًا الضربات أو السياط، وتُستعمل مجازًا للمعاناة الجسدية القاسية؛ وهذه الصياغة واضحة في العربية الحديثة.
- source_word: πνευμάτων πονηρῶν
  choice: أرواحٍ شريرة
  rationale: ترجمة مباشرة تحفظ الوصف الروحي الشخصي؛ فالصفة هي «شريرة» لا «نجسة».
- source_word: τυφλοῖς πολλοῖς
  choice: كثيرين من العميان
  rationale: صياغة عربية طبيعية للدال على متلقي الهبة، من غير حصر غير لازم في الذكور.
- source_word: ἐχαρίσατο
  choice: وهب
  rationale: يحفظ معنى العطاء التفضلي الكريم الكامن في الفعل، ويتلاءم مع المصدر المؤول بعده.
- source_word: βλέπειν
  choice: أن يبصروا
  rationale: ترجمة مباشرة للمصدر اليوناني، وتحافظ على البناء «وهبهم أن يبصروا» بدل تحويله إلى اسم.
theological_decisions:
- issue: طبيعة عمل يسوع تجاه من كانوا تحت تأثير πνεύματα πονηρά
  choice: إبقاء «أرواح شريرة» على معناها الروحي الظاهر في النص
  alternative: اعتبار العبارة وصفًا غير شخصي لأمراض نفسية أو جسدية
  rationale: العبارة اليونانية تسمية صريحة للأرواح الشريرة، فلا ينبغي اختزالها في المرض أو نزع بعدها الروحي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «عينها» لإظهار احتمال التوكيد الزمني، و«آلام شديدة» لشرح الاستعمال المجازي دون إخفاء المعنى الحرفي المثبت في الحاشية. جميع علامات الحواشي مثبتة في مواضعها في المتن.
