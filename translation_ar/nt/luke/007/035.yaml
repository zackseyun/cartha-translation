translation:
  language: ar
  text: ومع ذلك، أظهر جميع أبنائها أن الحكمة على صواب[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثبت صواب الحكمة»، أو «أُثبت أنها على صواب».'
    reason: lexical_alternative
  - marker: b
    text: «الأبناء» استعارة لمن يُظهرون صواب الحكمة باستجابتهم أو بسيرتهم.
    reason: lexical_alternative
  - marker: c
    text: 'ترد في متى 11:19: «وثبت صواب الحكمة بأعمالها».'
    reason: cross_reference
lexical_decisions:
- source_word: ἐδικαιώθη
  choice: تبرهنت على صوابها
  rationale: يفيد الفعل المبني للمجهول هنا أن الحكمة ثبت أو ظهر صوابها، لا معنى التبرير القضائي الشائع في سياقات أخرى. وهذه الصياغة عربية طبيعية وتحفظ دلالة الإثبات العلني.
- source_word: σοφία
  choice: الحكمة
  rationale: المقابل العربي المباشر، ويحفظ تشخيص الحكمة في العبارة.
- source_word: ἀπὸ πάντων
  choice: بجميع
  rationale: تدل ἀπό مع المبني للمجهول هنا على الوسيلة أو الجهة التي يظهر بها صواب الحكمة؛ والباء تؤدي هذا المعنى بوضوح في العربية.
- source_word: τέκνων
  choice: أبنائها
  rationale: يحفظ المعنى المعجمي المباشر والاستعارة الواردة في نص لوقا من غير تفسيرها في المتن على أنها أعمال أو نتائج.
- source_word: αὐτῆς
  choice: ها في «أبنائها»
  rationale: يعود الضمير إلى الحكمة المؤنثة، ويحفظ تشخيصها بصياغة عربية سليمة.
- source_word: καὶ
  choice: ومع ذلك
  rationale: يُفهم حرف العطف هنا في سياق تقابلي عقب نقد الجيل؛ فالصياغة تبرز المقابلة المعتدلة من غير مبالغة.
theological_decisions:
- issue: المقصود بـ«أبناء» الحكمة
  choice: الإبقاء على صورة «أبنائها» في المتن بوصفها استعارة لمن يُظهرون صدق الحكمة باستجابتهم أو سيرتهم.
  alternative: ثمار الحكمة أو نتائجها؛ أو تقريب العبارة من «أعمالها» في متى 11:19.
  rationale: نص لوقا اليوناني يقرأ τέκνων، أي «أبناء»، لذلك تُحفظ الصورة والتوتر الدلالي بدل حسمهما تفسيريًا في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «تبرهنت على صوابها» لإيصال معنى الإثبات والاعتراف بالصواب، مع إبقاء استعارة أبناء الحكمة كما في الأصل.
