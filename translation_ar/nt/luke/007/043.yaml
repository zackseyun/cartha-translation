  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: ar
  text: 'فأجاب سمعان: «أظنّ[a] أنه الذي أعفاه من الدَّين الأكبر[b]». فقال له: «حكمتَ بالصواب».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أحسب»؛ فاللفظ اليوناني يدل هنا على استنتاج متحفّظ.
    reason: lexical_alternative
  - marker: b
    text: أو «الذي أسقط عنه الدَّين الأكبر»؛ فالفعل اليوناني قد يدل على إعفاء الدَّين أو إسقاطه تفضّلًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: فأجاب
  rationale: التركيب اليوناني، وهو اسم فاعل يتبعه فعل القول، يؤدي اصطلاحيًّا معنى تقديم جواب؛ وصيغة «فأجاب» عربية طبيعية تحفظ المعنى من غير تكرار ثقيل.
- source_word: Ὑπολαμβάνω
  choice: أظنّ
  rationale: تفيد هنا استنتاجًا متحفّظًا لا يقينًا جازمًا، و«أظنّ» تنقل هذا التردد بوضوح.
- source_word: ᾧ τὸ πλεῖον
  choice: مَن سامحه بالدَّين الأكبر
  rationale: تحفظ «مَن» بنية الموصول، ويعبّر «الدَّين الأكبر» طبيعيًّا عن المقدار الأكثر في سياق المثل الذي يقارن بين دَينين.
- source_word: ἐχαρίσατο
  choice: سامحه بالدَّين
  rationale: للفعل معنى المنح تفضّلًا أو الإعفاء والمسامحة بالدَّين. وفي هذا السياق تنقل «سامحه بالدَّين» معنى إسقاطه مجانًا، مع إبقاء الصلة اللغوية بموضوع المغفرة في السياق الأوسع.
- source_word: Ὀρθῶς ἔκρινας
  choice: أصبتَ في حكمك
  rationale: صياغة عربية جارية تجمع معنى الصواب في ὀρθῶς ومعنى إصدار الحكم في κρίνω.
theological_decisions:
- issue: دلالة ἐχαρίσατο بين المسامحة والغفران وإسقاط الدَّين
  choice: سامحه بالدَّين
  alternative: أسقط عنه الدَّين / أعفاه منه
  rationale: المثل يتحدث مباشرة عن دَين مالي، لكن الفعل نفسه يحمل معنى التفضّل والمسامحة ويتصل بموضوع غفران الخطايا في السياق. تحافظ الصياغة المختارة على الجانبين من غير تحويل المثل إلى تقرير عقائدي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدمت «سامحه بالدَّين» لتناسب سياق الديون مع إبقاء صلة التعبير بالمغفرة، وصيغت العبارة الختامية بأسلوب عربي طبيعي يحفظ لفظ الحكم.
