  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: ar
  text: '«كان لرجلٍ مُقرِضٍ مدينان: على أحدهما خمس مئة دينارٍ[a]، وعلى الآخر خمسون.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان الدينار قطعة نقدية فضية رومانية شائعة، وكان يعادل تقريبًا أجرة عامل ليوم واحد.
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: مدينان
  rationale: اسم يدل مباشرةً على شخصين عليهما دَين، وصيغة المثنى العربية تنقل العدد بوضوح وطبيعية.
- source_word: δανιστῇ τινι
  choice: لرجلٍ مُقرِضٍ
  rationale: ينقل معنى شخص غير معيّن لكنه حاضر بوصفه مقرضًا للمال، وتستقيم معه الصياغة العربية الطبيعية «كان له مدينان».
- source_word: ὤφειλεν
  choice: على أحدهما
  rationale: التعبير العربي «على فلان مبلغ» يؤدي معنى قيام الدَّين المستمر الذي يعبّر عنه الماضي الناقص اليوناني، من غير تكلّف.
- source_word: δηνάρια
  choice: دينارٍ
  rationale: يحافظ على اسم الوحدة النقدية التاريخية، مع شرح قيمتها التقريبية في الحاشية بدل استبدالها بقيمة حديثة.
- source_word: πεντακόσια
  choice: خمس مئة
  rationale: نقل مباشر للعدد، وفق الإملاء العربي الواضح المعاصر.
- source_word: ἕτερος
  choice: الآخر
  rationale: يقابل «أحدهما» طبيعيًا ويحافظ على المقارنة بين المدينين.
- source_word: πεντήκοντα
  choice: خمسون
  rationale: نقل مباشر للعدد، ويُفهم اسم الوحدة النقدية من الجملة السابقة كما في الأصل.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموجزة وذات نبرة قصصية كريمة. استُخدم المثنى «مدينان» واستُعيض عن التكرار الحرفي للفعل بصيغة «على أحدهما... وعلى الآخر...» الطبيعية في العربية، مع الحفاظ على الوحدة النقدية التاريخية وإثبات علامة الحاشية في المتن.
