  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: ar
  text: بل ماذا خرجتم لتنظروا؟ رجلًا يرتدي ثيابًا ناعمة[a]؟ ها إن الذين يرتدون ثيابًا فاخرة ويعيشون في ترف هم في القصور الملكية[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: ثيابًا رقيقة فاخرة؛ ولا تشير العبارة هنا إلى ضعف أخلاقي.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: بلاطات الملوك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد الانتقال الاستدراكي إلى السؤال البلاغي التالي، وهي طبيعية في هذا السياق العربي.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: ماذا خرجتم لتنظروا؟
  rationale: تحافظ على الاستفهام البلاغي وعلى دلالة المصدر في بيان غرض الخروج.
- source_word: ἄνθρωπον
  choice: رجلًا
  rationale: يشير السياق إلى فرد ذكر بعينه في السؤال عن يوحنا، لذا ينقل «رجلًا» المعنى بوضوح.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: يرتدي ثيابًا ناعمة
  rationale: ينقل صورة الثياب الرقيقة الفاخرة بوصفها حالة لباس، من غير إقحام معنى أخلاقي في صفة μαλακοῖς.
- source_word: ἰδοὺ
  choice: ها إن
  rationale: تلفت الانتباه إلى التفسير التالي بصياغة عربية فصيحة واضحة.
- source_word: οἱ ... ὑπάρχοντες
  choice: الذين ... ويعيشون
  rationale: يفك التركيب الوصفي اليوناني إلى صلة موصول طبيعية، مع بيان أن الترف نمط عيش.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: يرتدون ثيابًا فاخرة
  rationale: تنقل ἐνδόξῳ هنا معنى البهاء والفخامة الاجتماعية، لا «المجد» بمعناه اللاهوتي.
- source_word: τρυφῇ
  choice: يعيشون في ترف
  rationale: يعبر بوضوح عن حياة النعمة والرفاه التي يدل عليها الاسم اليوناني في هذا السياق.
- source_word: ἐν τοῖς βασιλείοις
  choice: في القصور الملكية
  rationale: يشير الاسم الجمع إلى مساكن الملوك أو البيئات القصرية الملكية، ويحافظ هذا التعبير على صيغة الجمع.
theological_decisions:
- issue: دلالة μαλακοῖς في السياق
  choice: إشارة حرفية إلى الثياب الناعمة الدقيقة المرتبطة بالترف
  alternative: وصف أخلاقي بالرخاوة أو التخنث
  rationale: المقابلة بين البرية والثياب الفاخرة والترف والقصور الملكية اجتماعية ومعيشية؛ ولا يقتضي السياق حكمًا أخلاقيًا متعلقًا بالذكورة.
- issue: المكان المقصود بلفظة βασιλείοις
  choice: القصور الملكية
  alternative: بلاطات الملوك
  rationale: تحتمل اللفظة المساكن الملكية أو أوساط البلاط؛ اختيرت «القصور الملكية» لوضوحها مع إبقاء البديل في الحاشية.
translation_notes:
  register: صياغة عربية معيارية حديثة، واضحة ووقورة. حوفظ على تتابع الأسئلة البلاغية وعلى التقابل بين خشونة حياة البرية ورفاه القصور، مع تجنب تفسير لاهوتي أو أخلاقي زائد.
