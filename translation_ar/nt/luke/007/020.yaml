  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: ar
  text: 'ولمّا جاء الرجال إليه، قالوا: «يوحنا المعمدان أرسلنا إليك قائلاً: أأنت الآتي[a]، أم ننتظر آخر؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي سيأتي».'
    reason: بديل لفظي يوضح إمكان ترجمة اسم الفاعل اليوناني بعبارة موصولية مستقبلية، مع الحفاظ على معنى التوقع.
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: ولمّا جاء الرجال إليه
  rationale: ينقل اسم الفاعل الماضي بوصفه ظرفًا سرديًّا سابقًا للقول، ويحافظ على اتجاه المجيء نحو يسوع بعبارة عربية طبيعية.
- source_word: οἱ ἄνδρες
  choice: الرجال
  rationale: يحافظ على الدلالة الذكورية الصريحة في ἀνήρ من غير إضافة وصف غير وارد في هذه الآية.
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: يوحنا المعمدان
  rationale: اللقب العربي الراسخ والمفهوم، وهو مقابل طبيعي للقب اليوناني.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ
  choice: أرسلنا إليك
  rationale: صياغة عربية موجزة تحافظ على فعل الإرسال ووجهته، مع بقاء يوحنا فاعلًا ظاهرًا في أول الجملة.
- source_word: λέγων
  choice: قائلاً
  rationale: يحافظ على البنية الحالية التي تقدّم مضمون الرسالة مباشرة.
- source_word: ὁ ἐρχόμενος
  choice: الآتي
  rationale: تعبير اسمي موجز يحفظ قوة العبارة بوصفها لقبًا أو وصفًا مشحونًا بالتوقع، من غير أن يصرّح بهوية لا يصرّح بها النص.
- source_word: ἄλλον προσδοκῶμεν
  choice: ننتظر آخر
  rationale: ينقل معنى الترقب والانتظار في προσδοκάω، ويحافظ على إيجاز ἄλλον وعلى صيغة السؤال التشاوري.
theological_decisions:
- issue: القوة المسيانية المحتملة لعبارة ὁ ἐρχόμενος
  choice: الآتي
  alternative: الذي سيأتي
  rationale: «الآتي» يحافظ على الصيغة اللقبية وعلى التوتر بين الوصف العادي والإشارة الأخروية أو المسيانية، من غير إضافة لفظ «المسيح» أو حسم المقصود تفسيرًا.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُعملت «أأنت» لإظهار الاستفهام بوضوح، و«ننتظر» بدل تعبير تفسيري أوسع، مع وضع علامة الحاشية مباشرة بعد العبارة التي تشرحها.
