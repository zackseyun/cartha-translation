base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: ar
  text: 'فَلَمَّا سَمِعَ يَسُوعُ هَذَا، تَعَجَّبَ مِنْهُ، وَالْتَفَتَ إِلَى الْجَمْعِ الَّذِي كَانَ يَتْبَعُهُ، وَقَالَ: «أَقُولُ لَكُمْ: لَمْ أَجِدْ حَتَّى فِي إِسْرَائِيلَ إِيمَانًا بِهَذَا الْقَدْرِ[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «إيمانًا عظيمًا إلى هذا الحد». والكلمة اليونانية المترجمة هنا «إيمان» يمكن أن تدل أيضًا على «الثقة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: فَلَمَّا سَمِعَ يَسُوعُ هَذَا
  rationale: اسم الفاعل الأوريستي يفيد ظرفًا زمنيًّا سابقًا للفعل الرئيس، و«فلما سمع» تعبير عربي طبيعي. وجاء «هذا» مفردًا لأن العربية تستعمله طبيعيًّا للإشارة إلى مجمل الكلام السابق، مع أن اليونانية تستعمل جمعًا حرفيًّا بمعنى «هذه الأمور».
- source_word: ἐθαύμασεν αὐτόν
  choice: تَعَجَّبَ مِنْهُ
  rationale: ينقل معنى الدهشة والإعجاب الموجَّهين إلى قائد المئة، ويحافظ على بساطة السرد ووقاره.
- source_word: στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: ثُمَّ الْتَفَتَ إِلَى الْجَمْعِ الَّذِي كَانَ يَتْبَعُهُ
  rationale: صيغ الفعل الصريح طبيعية في العربية السردية، و«كان يتبعه» تنقل الاستمرار الذي يدل عليه اسم الفاعل المضارع اليوناني.
- source_word: Λέγω ὑμῖν
  choice: أَقُولُ لَكُمْ
  rationale: ترجمة مباشرة وطبيعية لصيغة التصريح والتوكيد الموجَّهة إلى المخاطبين.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: لَمْ أَجِدْ حَتَّى فِي إِسْرَائِيلَ
  rationale: «حتى» تنقل قوة οὐδέ بمعنى «ولا حتى»، و«في إسرائيل» تُبقي الصياغة المكانية التي تُفهم أيضًا عن شعب إسرائيل.
- source_word: τοσαύτην πίστιν
  choice: إِيمَانًا بِهَذَا الْقَدْرِ
  rationale: «إيمان» هو المقابل المعتاد لـ πίστις هنا، والعبارة تنقل مقدار الإيمان أو درجته دون إضافة وصف غير موجود في النص.
- source_word: εὗρον
  choice: لَمْ أَجِدْ
  rationale: الماضي العربي يطابق الأوريست اليوناني ويؤدي طبيعيًّا معنى خبرة يسوع إلى تلك اللحظة.
theological_decisions:
- issue: دلالة πίστις
  choice: إيمان
  alternative: ثقة
  rationale: السياق يتحدث عن ثقة قائد المئة بسلطان يسوع، لكن «إيمان» يحافظ على المصطلح الأوسع والمتكرر في لوقا، مع بيان «ثقة» بوصفها دلالة ممكنة في الحاشية.
- issue: موضوع تعجُّب يسوع
  choice: تَعَجَّبَ مِنْهُ
  alternative: دُهِشَ مِنْهُ
  rationale: يحافظ «تعجّب» على الإخبار الصريح في النص من غير محاولة تخفيف التوتر اللاهوتي أو تفسير طبيعة معرفة يسوع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة، بصياغة سردية طبيعية. أُثبتت الحاشية [a] في المتن، وجُمعت فيها البدائل الدلالية المتصلة بعبارة τοσαύτην πίστιν وكلمة πίστις.
