lexical_decisions:
- source_word: εἶπεν
  choice: قال
  rationale: صيغة الماضي من λέγω تُنقل طبيعيًا بالفعل «قال»، وتحافظ على مباشرة القول.
- source_word: δὲ
  choice: ثم
  rationale: تؤدي δέ هنا وظيفة رابط سردي خفيف ينقل إلى الحدث التالي، و«ثم» واضحة وطبيعية من غير تشديد على المقابلة.
- source_word: αὐτῇ
  choice: لها
  rationale: ضمير المؤنث في حالة المجرور باليونانية يحدد المخاطَبة بوصفها المتلقي، ويقابله طبيعيًا «لها».
- source_word: Ἀφέωνταί
  choice: مغفورة
  rationale: اسم المفعول في الجملة الاسمية العربية يعبّر عن حالة قائمة ناتجة من فعل تمّ، فيلائم دلالة التام المبني للمجهول في اليونانية.
- source_word: σου
  choice: لكِ / خطاياكِ
  rationale: الضمير مفرد مؤنث بحسب السياق؛ صيغتا «لكِ» و«خطاياكِ» توضحان أن الغفران والخطايا متعلقان بالمخاطَبة.
- source_word: αἱ ἁμαρτίαι
  choice: خطاياكِ
  rationale: «الخطايا» هي المقابل الطبيعي لـἁμαρτίαι في سياق الذنوب أمام الله، والإضافة إلى ضمير المخاطَبة تنقل σου بعبارة عربية سليمة.
theological_decisions:
- issue: دلالة صيغة التام المبني للمجهول Ἀφέωνταί في إعلان الغفران
  choice: «مغفورة لكِ خطاياكِ» بوصفها إعلانًا عن حالة حاضرة ناتجة من فعل مكتمل
  alternative: «قد غُفرت لكِ خطاياكِ» مع إبراز أوضح لاكتمال الفعل
  rationale: تحتمل صيغة التام اليونانية إبراز الفعل المكتمل أو نتيجته المستمرة. تحافظ الصياغة المختارة على الحالة القائمة، بينما تذكر الحاشية البديل الذي يبرز اكتمال الفعل، من غير حسم زائد لتوقيت الغفران أو فاعله.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم التأنيث الظاهر في «لكِ» و«خطاياكِ» لأن المخاطَبة امرأة، وصيغت عبارة الغفران جملة اسمية طبيعية تحفظ دلالة النتيجة القائمة.
