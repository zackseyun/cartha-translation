lexical_decisions:
- source_word: ἀγαπᾷ
  choice: يحب
  rationale: ينقل المعنى المباشر للفعل في الزمن الحاضر ويحفظ قوة تزكية الشيوخ له.
- source_word: γὰρ
  choice: لأنه
  rationale: تبيّن الأداة سبب قولهم السابق إنه مستحق، وصيغة «لأنه» طبيعية وواضحة في العربية.
- source_word: τὸ ἔθνος ἡμῶν
  choice: أمتنا
  rationale: تشير العبارة إلى الشعب اليهودي بوصفه جماعة قومية، و«أمتنا» موجزة وتحفظ الدلالة الجماعية.
- source_word: τὴν συναγωγήν
  choice: المجمع
  rationale: المقصود دار الاجتماع والعبادة اليهودية المعروفة في السياق؛ و«المجمع» مصطلح عربي واضح لا يضيف ضمير ملكية غير موجود في اليونانية.
- source_word: αὐτός
  choice: هو نفسه
  rationale: يحفظ التوكيد الصريح في الضمير اليوناني، سواء دل البناء على مباشرة العمل أو على رعايته وتمويله.
- source_word: ᾠκοδόμησεν
  choice: بنى
  rationale: ينقل الفعل اليوناني البسيط من غير أن يحسم هل باشر البناء جسديًا أم تكفّل به بصفته راعيًا أو ممولًا.
- source_word: ἡμῖν
  choice: لنا
  rationale: 'تعبر اللام عن المنفعة: بُني المجمع لصالح جماعتهم.'
