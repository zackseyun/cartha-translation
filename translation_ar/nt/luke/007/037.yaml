  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: ar
  text: وإذا بامرأة خاطئة كانت في المدينة[a]، وقد علمت أنه متكئٌ إلى الطعام في بيت الفريسي[b]، جاءت حاملةً قارورةً من المرمر فيها طيب[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'في اليونانية: «خاطئة» بصيغة اسمية؛ ولا يحدد النص نوع خطيئتها.'
    reason: lexical_clarification
  - marker: b
    text: كان الاتكاء هو الهيئة المعتادة عند تناول وليمة رسمية في ذلك العصر.
    reason: cultural_note
  - marker: c
    text: 'أو: «قارورة مرمر من دهن عطري».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا بـ
  rationale: تؤدي وظيفة أداة التنبيه والمفاجأة في السرد بلغة عربية طبيعية، من غير اللجوء إلى «هوذا» الأشد تقليدية.
- source_word: ἥτις ἦν ἐν τῇ πόλει
  choice: كانت في المدينة
  rationale: يحافظ على دلالة العبارة المكانية كما هي، من غير تفسيرها بأنها من أهل المدينة أو معروفة فيها.
- source_word: ἁμαρτωλός
  choice: خاطئةً
  rationale: ينقل الوصف الأخلاقي الصريح للمرأة من غير تعيين نوع خطيئتها؛ وجاء حالًا/وصفًا ضمن تركيب عربي طبيعي.
- source_word: ἐπιγνοῦσα
  choice: قد علمت
  rationale: يدل على حصول معرفتها بالأمر قبل مجيئها بالطيب، مع صياغة عربية موجزة.
- source_word: κατάκειται
  choice: متكئ للطعام
  rationale: ينقل هيئة الاتكاء المتبعة عند تناول الولائم في ذلك العصر، بدل تحويلها إلى مجرد الجلوس أو الأكل.
- source_word: οἰκίᾳ τοῦ Φαρισαίου
  choice: بيت الفريسي
  rationale: صياغة عربية طبيعية تحافظ على الإشارة إلى الفريسي المذكور في السياق.
- source_word: κομίσασα
  choice: فجاءت بـ
  rationale: ينقل معنى أنها حضرت حاملة الشيء معها، ويربط الفعل بالسياق السردي بسلاسة.
- source_word: ἀλάβαστρον μύρου
  choice: قارورة من المرمر فيها طيب
  rationale: يميّز بوضوح بين الوعاء المصنوع من المرمر ومحتواه العطري، بألفاظ عربية مفهومة ودقيقة.
theological_decisions:
- issue: التوصيف الأخلاقي للمرأة
  choice: خاطئة
  alternative: امرأة سيئة السيرة / زانية / بَغِيّ
  rationale: النص اليوناني يصفها بأنها ἁμαρτωλός، لكنه لا يحدد طبيعة خطيئتها؛ لذلك لا تُستورد هوية جنسية أو اجتماعية غير مصرّح بها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «وإذا بـ» للتنبيه السردي، و«متكئ للطعام» لإيضاح العرف القديم دون إطالة داخل المتن. وُزعت علامات الحواشي على الألفاظ التي تشرحها مباشرة.
