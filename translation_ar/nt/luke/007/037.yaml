  to: وإذا بامرأة خاطئة كانت في المدينة[a]، وقد علمت أنه متكئٌ إلى الطعام في بيت الفريسي[b]، جاءت حاملةً قارورةً من المرمر فيها طيب[c].
  rationale: أزيلت الزيادة التفسيرية في الحاشية المتعلقة بسمعة المرأة، وحُسّنت دلالة إحضار القارورة وهيئة الاتكاء، من غير تعيين طبيعة خطيئة المرأة أو تحميل النص تفسيرًا تقليديًا غير مذكور.
