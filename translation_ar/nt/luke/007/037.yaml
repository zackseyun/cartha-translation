review_pass:
  verdict: revise
  source_fidelity: المعنى العام منقول بأمانة، بما في ذلك وصف المرأة بأنها خاطئة دون تعيين خطيئتها، وهيئة الاتكاء في الوليمة، والوعاء المرمرّي ذي الطيب. لكن عبارة الحاشية (أ) تضيف أنها «كانت معروفة» بالخطيئة، وهو أمر لا يذكره اليوناني. كما أن «فجاءت بقارورة» أضعف من دلالة «أحضرت/جاءت حاملة» في κομίσασα.
  naturalness: الصياغة مفهومة وفصيحة إجمالًا. وتكون أكثر سلاسة ودقة بقول «امرأة خاطئة كانت في المدينة» وباستعمال «جاءت حاملةً»؛ فهذا يربط حمل القارورة بالفعل دون أن يوحي بأن مجرد المجيء هو المعنى المقصود.
  terminology: «الفريسي»، و«المرمر»، و«طيب» مناسبة. و«متكئًا إلى الطعام» أدق وأيسر تركيبًا من «متكئ للطعام»، مع بقاء الإيضاح الثقافي في الحاشية.
  issues:
  - severity: medium
    issue: الحاشية (أ) تقول إن المرأة «كانت معروفة بأنها خاطئة».
    rationale: النص اليوناني يصفها بأنها خاطئة، ولا يصرح بأنها كانت معروفة بذلك؛ وإضافة الشهرة تفسير زائد.
  - severity: low
    issue: «فجاءت بقارورة» لا يبرز بوضوح أن المرأة أحضرت القارورة معها.
    rationale: κομίσασα تعني أنها جلبت أو حملت الوعاء؛ و«جاءت حاملةً قارورة» أوضح في العربية.
  - severity: low
    issue: «متكئ للطعام» يحتاج إلى ضبط تركيبي.
    rationale: «متكئًا إلى الطعام» تركيب فصيح طبيعي ويحافظ على معنى κατάκειται في سياق المائدة.
  revised_text: وإذا بامرأة خاطئة كانت في المدينة[a]، وقد علمت أنه متكئٌ إلى الطعام في بيت الفريسي[b]، جاءت حاملةً قارورةً من المرمر فيها طيب[c].
