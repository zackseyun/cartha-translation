  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: ar
  text: 'فأجابه يسوع: «يا سمعان، عندي شيء أقوله لك». فقال سمعان: «يا معلّم، قل».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا معلّم، تكلّم». والفعل اليوناني يعني حرفيًا «قل» أو «تكلّم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: فأجابه يسوع
  rationale: يجمع هذا التعبير العربي الطبيعي بين معنى اسم الفاعل «أجاب» وفعل القول اللاحق، من غير التكرار الثقيل «أجاب وقال له»، ويحفظ كون الكلام موجّهًا إليه.
- source_word: Σίμων
  choice: سمعان
  rationale: الصيغة العربية الكتابية المألوفة للاسم اليوناني Σίμων.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: عندي شيء أقوله لك
  rationale: ينقل العبارة اليونانية بوضوح وطبيعية، ويُظهر الضمير σοί في «لك».
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: «معلّم» هو المقابل المباشر لـ διδάσκαλος، ويحفظ معنى التعليم من غير إضافة دلالة «السيد» الأقوى.
- source_word: εἰπέ
  choice: قل
  rationale: أمر مفرد مباشر من فعل القول؛ وهو أقرب إلى اللفظ اليوناني وأوجز من إضافة مفعول غير مصرّح به.
- source_word: φησίν
  choice: فقال
  rationale: نُقل المضارع التاريخي بصيغة الماضي العربية الطبيعية في السرد.
