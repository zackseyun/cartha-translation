  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: ar
  text: 'وقال للمرأة: «إيمانكِ[a] قد خلَّصكِ[b]. اذهبي بسلام».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ثقتكِ قد خلَّصتكِ»؛ والأقل احتمالًا هنا: «أمانتكِ قد خلَّصتكِ».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن ترجمة الفعل اليوناني أيضًا: «قد شفاكِ» أو «قد عافاكِ». فهو قد يعني الخلاص أو الإنقاذ أو الشفاء، لكن السياق هنا يركّز على الغفران والخلاص.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: وقال
  rationale: ينقل الفعل الماضي البسيط واستمرار السرد دون افتعال معنى تقابلي للأداة δέ.
- source_word: πρὸς τὴν γυναῖκα
  choice: للمرأة
  rationale: تعبير عربي طبيعي ودقيق في السياق، فالمراد المرأة الحاضرة لا الزوجة.
- source_word: Ἡ πίστις σου
  choice: إيمانكِ
  rationale: «الإيمان» هو المقابل العربي المألوف لـ πίστις، ويشير هنا إلى ثقتها بيسوع؛ أما «أمانتكِ» فمعنى ممكن معجميًا لكنه أضعف سياقيًا.
- source_word: σέσωκέν σε
  choice: قد خلَّصكِ
  rationale: صيغة التمام اليونانية تدل على فعل تم وله أثر باقٍ؛ و«خلَّصكِ» يلائم سياق غفران الخطايا أكثر من الاقتصار على الشفاء.
- source_word: πορεύου
  choice: اذهبي
  rationale: صيغة أمر واضحة وطبيعية تقابل فعل الذهاب في اليونانية.
- source_word: εἰς εἰρήνην
  choice: بسلام
  rationale: هذا هو التعبير العربي الاصطلاحي الطبيعي الذي ينقل معنى الانصراف في حالة من السلام، بدل الترجمة الحرفية «إلى السلام».
theological_decisions:
- issue: دلالة σῴζω وصلتها بالغفران والخلاص
  choice: قد خلَّصكِ
  alternative: قد شفاكِ / قد عافاكِ
  rationale: يترك الفعل اليوناني مجالًا لمعنى الشفاء في سياقات أخرى، لكن سياق لوقا 7:36–50 يركّز على غفران الخطايا؛ لذلك يحفظ «خلَّصكِ» الثقل الخلاصي للنص من غير إضافة تفاصيل غير مصرّح بها.
- issue: دلالة πίστις
  choice: إيمانكِ
  alternative: ثقتكِ / أمانتكِ
  rationale: المعنى السياقي هو الثقة المؤمنة، و«إيمانكِ» يحفظ المصطلح اللاهوتي المألوف من غير حصره في مجرد الاعتماد النفسي؛ أما «أمانتكِ» فأقل احتمالًا هنا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم التأنيث الصريح في الضمائر والأفعال لمخاطبة المرأة، وحُفظت الصلة السردية بـ«وقال». وُضعت علامة الحاشية [a] بعد العبارة التي تتناول بدائل πίστις وσῴζω معًا، وعلامة [b] بعد الجملة لتوضيح البديل الدلالي للفعل؛ غير أن موضع [a] يعكس محتوى الحاشية العربية المدمجة بدقة.
