base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: ar
  text: ولمّا سمع عن يسوع، أرسل إليه شيوخَ اليهود، يطلب منه أن يأتي وينقذ عبده[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خادمه». اللفظة اليونانية هي δοῦλος، وقد تعني عبدًا أو خادمًا بحسب السياق؛ واختيرت «عبده» هنا لإظهار وضع التبعية والاسترقاق الذي تتضمنه اللفظة.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ
  choice: ولمّا سمع عن يسوع
  rationale: ينقل اسم الفاعل الماضي بوصفه ظرفًا زمنيًا سابقًا للفعل الرئيس، ويعبّر عن δέ بربط عربي خفيف من غير إبراز معنى الاستدراك.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: أرسل إليه
  rationale: صياغة عربية مباشرة تحافظ على فعل الإرسال وعلى كون يسوع هو المقصود بالإرسال.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: شيوخًا من اليهود
  rationale: تدل «شيوخ» هنا على وجهاء الجماعة وقادتها، لا على مجرد المتقدمين في السن، وتحافظ «من اليهود» على تركيب الإضافة اليوناني من دون افتراض مؤسسة محددة.
- source_word: ἐρωτῶν αὐτὸν
  choice: يطلب منه
  rationale: صيغة المفرد تحافظ على عود اسم الفاعل إلى قائد المئة، أي إنه قدّم طلبه بواسطة الشيوخ، و«يطلب» تلائم سياق الالتماس المهذب.
- source_word: ὅπως ἐλθὼν
  choice: أن يأتي
  rationale: تنقل مضمون الطلب وغايته بأسلوب عربي طبيعي، من غير تكلّف في محاكاة التركيب اليوناني.
- source_word: διασώσῃ
  choice: ينقذ
  rationale: يحافظ «ينقذ» على الدلالة الواسعة للفعل، وهي التخليص أو الإبقاء سالمًا، من غير حصرها في «يشفي» رغم أن السياق سياق مرض.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: عبده
  rationale: «عبد» تحافظ على وضع التبعية والاسترقاق الذي تدل عليه δοῦλος في هذا السياق المنزلي، بينما يُذكر البديل الأخف «خادمه» في الحاشية.
theological_decisions:
- issue: ترجمة δοῦλος في سياق بيت قائد المئة
  choice: عبده
  alternative: خادمه
  rationale: السياق يشير إلى شخص خاضع لسلطة قائد المئة ضمن واقع اجتماعي قائم على الاسترقاق؛ لذلك تحافظ «عبده» على هذه الدلالة بدل تلطيفها، مع إثبات «خادمه» بديلًا ممكنًا بحسب موضع التركيز في السياق.
- issue: مدى دلالة διασώσῃ في سياق المرض
  choice: ينقذ
  alternative: يشفي
  rationale: «ينقذ» تُبقي المجال الدلالي الأوسع للفعل اليوناني ولا تحسمه في الشفاء وحده، مع أن الشفاء هو التطبيق المقصود في سياق مرض العبد.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ورصينة. استُخدمت «ولمّا» للربط الزمني الطبيعي، و«شيوخًا من اليهود» لتجنب إيحاء أن المقصود مجرد كبار السن. وُضع مؤشر الحاشية بعد «عبده» لأنه متعلق بترجمة δοῦλος.
