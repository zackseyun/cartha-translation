  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: ar
  text: لذلك لم أحسب نفسي أهلًا حتى للمجيء إليك. لكن قُلْ كلمةً، وليُشفَ خادمي[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «صبيّي» أو «طفلي»؛ فاللفظة اليونانية قد تدل على طفل أو فتى أو خادم، بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تفيد الاستنتاج مما سبق وتحافظ على الصلة المنطقية بعبارة عربية واضحة.
- source_word: οὐδὲ
  choice: لم... حتى
  rationale: تنقل تقوية النفي بمعنى «لم... حتى»، مع صياغة عربية طبيعية.
- source_word: ἐμαυτὸν ἠξίωσα
  choice: لم أحسب نفسي أهلًا
  rationale: تنقل معنى اعتبار النفس جديرة أو مستحقة، وتحافظ على الضمير الانعكاسي.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: للمجيء إليك
  rationale: تعبير مباشر عن الاقتراب الشخصي من يسوع.
- source_word: ἀλλὰ
  choice: لكن
  rationale: تقدم الطلب المقابل بوضوح وبأسلوب عربي طبيعي.
- source_word: εἰπὲ λόγῳ
  choice: قُلْ كلمةً
  rationale: تحافظ على دلالة القول السلطاني من غير إضافة أداة تعريف غير موجودة في اليونانية.
- source_word: ἰαθήτω
  choice: وليُشفَ
  rationale: صيغة أمر مبني للمجهول للغائب، فتحافظ على قوة الأمر في اليونانية بدل تحويلها إلى خبر مستقبلي.
- source_word: ὁ παῖς μου
  choice: خادمي
  rationale: السياق يتحدث عن شخص في بيت قائد المئة وتحت سلطته، لذا «خادمي» أوضح اختيار، مع إثبات المجال الدلالي الأوسع في الحاشية.
theological_decisions:
- issue: دلالة παῖς في رواية قائد المئة
  choice: خادمي
  alternative: صبيّي أو طفلي
  rationale: اللفظة اليونانية واسعة الدلالة، لكن سياق علاقة السلطة داخل البيت يرجح معنى الخادم من غير الجزم بما يتجاوز النص؛ وتُحفظ الدلالات الأخرى في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أهلًا» بدل تعبيرات أثقل مثل «مستحقًّا»، وحُفظت صيغة الأمر المبني للمجهول في «وليُشفَ». وُضعت علامة الحاشية بعد «خادمي» لأنها تخص اللفظة اليونانية παῖς.
