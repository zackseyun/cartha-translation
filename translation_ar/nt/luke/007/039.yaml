  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: ar
  text: 'فَلَمَّا رَأَى الْفَرِّيسِيُّ الَّذِي كَانَ قَدْ دَعَاهُ ذَلِكَ، قَالَ فِي نَفْسِهِ: «لَوْ كَانَ هَذَا الرَّجُلُ نَبِيًّا، لَعَرَفَ مَنْ تَكُونُ هَذِهِ الْمَرْأَةُ الَّتِي تَلْمِسُهُ، وَمَا صِفَتُهَا[a]، لِأَنَّهَا خَاطِئَةٌ[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَنْ هِيَ وَأَيُّ امْرَأَةٍ هِيَ». يؤكد اليوناني هويتها وصفتها أو سمعتها معًا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أَنَّهَا خَاطِئَةٌ». قد تُفهم العبارة إما على أنها مضمون ما كان سيعرفه، وإما على أنها سبب الحكم على صفة المرأة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: فَلَمَّا رَأَى ... ذَلِكَ
  rationale: تؤدي الفاء مع «لما» وظيفة الانتقال السردي والعلاقة الزمنية، و«ذلك» مستفاد من الفعل السابق في السياق من غير إدخال ظرف لا أصل له.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτόν
  choice: الْفَرِّيسِيُّ الَّذِي كَانَ قَدْ دَعَاهُ
  rationale: «دعاه» في سياق الوليمة تعني أنه وجّه إليه دعوة، و«كان قد» توضح سبق الدعوة للرؤية والكلام.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: قَالَ فِي نَفْسِهِ
  rationale: صياغة عربية طبيعية تنقل الكلام الداخلي من غير تكرار حرفي للفعل واسم الفاعل.
- source_word: Οὗτος
  choice: هَذَا الرَّجُلُ
  rationale: توضح الإشارة إلى يسوع وتحافظ على نبرة التباعد في كلام الفريسي.
- source_word: εἰ ἦν προφήτης, ἐγίνωσκεν ἂν
  choice: لَوْ كَانَ ... نَبِيًّا، لَعَرَفَ
  rationale: تركيب «لو... لَـ» هو المقابل العربي الطبيعي للشرط المخالف لاعتقاد المتكلم.
- source_word: τίς καὶ ποταπὴ
  choice: مَنْ تَكُونُ ... وَمَا صِفَتُهَا
  rationale: يحفظ السؤالين المتلازمين عن هوية المرأة وصفتها أو سمعتها، بدل دمجهما في معنى واحد.
- source_word: ἥτις ἅπτεται αὐτοῦ
  choice: الَّتِي تَلْمِسُهُ
  rationale: المضارع العربي ينقل الفعل الجاري في المشهد، و«تلمسه» هو التعبير الواضح المباشر.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: لِأَنَّهَا خَاطِئَةٌ
  rationale: يُفهم ὅτι في المتن على أنه تعليل لحكم الفريسي، مع إثبات احتمال دلالته على مضمون المعرفة في الحاشية.
theological_decisions:
- issue: دلالة الشرط المتعلق بكون يسوع نبيًّا
  choice: «لو كان هذا الرجل نبيًّا، لعرف...» بوصفه شرطًا مخالفًا لاعتقاد الفريسي
  alternative: «إن كان هذا الرجل نبيًّا، فهو يعرف...» بصياغة أكثر حيادًا
  rationale: تركيب εἰ مع الماضي ثم الماضي وἄν يدل طبيعيًّا على افتراض غير متحقق في نظر المتكلم. تنقل الترجمة شك الفريسي من غير أن تتبنى حكمه.
- issue: علاقة ὅτι ἁμαρτωλός ἐστιν بما قبله
  choice: 'تعليل: «لأنها خاطئة»'
  alternative: 'مضمون للمعرفة: «أنها خاطئة»'
  rationale: كلا الوجهين ممكن نحويًّا؛ اختير التعليل في المتن لملاءمته لسياق حكم الفريسي، وأُبقي الوجه الآخر في الحاشية حفاظًا على الالتباس الأصيل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة، مع إبقاء نبرة الفريسي المتشككة من خلال «هذا الرجل»، والحفاظ على التمييز بين هوية المرأة وصفتها وعلى الاحتمال النحوي في جملة ὅτι. استُعمل الضبط الجزئي/الكامل في نص الآية والحواشي لضمان القراءة الواضحة.
