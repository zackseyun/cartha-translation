  source_fidelity: 'الترجمة تنقل عناصر اليونانية الأساسية بأمانة: الظرف الزمني والسردي في «فلما رأى ... ذلك»، والفريسي الذي سبق أن دعا يسوع، والكلام الداخلي، والشرط المخالف لاعتقاد المتكلم «لو كان ... لعرف»، والاستفهامين المتلازمين عن هوية المرأة وصفتها، وفعل اللمس الجاري، ووصفها بأنها خاطئة. ولا تحسم الترجمة التوتر السردي أو الحكم اللاهوتي الكامن في قول الفريسي.'
  naturalness: الصياغة فصحى معاصرة واضحة ووقورة. «قال في نفسه» و«لو كان هذا الرجل نبيًّا، لعرف» طبيعيان في العربية. كما أن ترتيب «من تكون هذه المرأة ... وما صفتها» مفهوم وسلس، مع إبقاء نبرة الفريسي المتحفظة في «هذا الرجل».
  terminology: «الفريسي»، «نبيًّا»، و«خاطئة» مصطلحات مستقرة ومناسبة. و«ما صفتها» يؤدي معنى ποταπή، بما فيه الإيحاء بالشخصية أو السمعة، من غير تحميل النص توصيفًا مذهبيًا زائدًا.
