  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: ar
  text: 'فأجابهم قائلاً: «اذهبوا وأخبروا يوحنا بما رأيتم وسمعتم: العمي يُبصرون[a]، والعرج يمشون، والمصابون بالبرص يُطهَّرون، والصم يسمعون، والموتى يُقامون، والفقراء يُعلَن لهم الخبر السارّ[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العمي يستعيدون بصرهم». يمكن للفعل اليوناني أن يدل على استعادة البصر أو نيله؛ والمقصود هنا أنهم صاروا يبصرون.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الفقراء يُبشَّرون». العبارة اليونانية مبنية للمجهول، أي إن الخبر السار يُعلَن لهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: فأجابهم قائلاً
  rationale: صياغة عربية طبيعية تحفظ معنى الاستجابة في اسم الفاعل اليوناني، من غير تركيب حرفي ثقيل.
- source_word: Πορευθέντες ἀπαγγείλατε
  choice: اذهبوا وأخبروا
  rationale: اسم الفاعل السابق للأمر يؤدي وظيفة فعل ملازم له؛ والعربية الطبيعية تعبّر عنه بفعلَي أمر منسقين.
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: بما رأيتم وسمعتم
  rationale: ترجمة مباشرة وموجزة للموصول والفعلين، وتحفظ كون الشهادة مبنية على المشاهدة والسماع.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: العمي يُبصرون
  rationale: تحفظ العبارة موجزة وقريبة من الأسلوب النبوي، ولا تحسم هل المقصود استعادة البصر أم نيله، مع بيان البديل في الحاشية.
- source_word: χωλοὶ περιπατοῦσιν
  choice: العرج يمشون
  rationale: مقابل عربي واضح ومباشر لبنية الصفة الاسمية مع الفعل.
- source_word: λεπροὶ καθαρίζονται
  choice: المصابون بالبرص يُطهَّرون
  rationale: تعبير محترم وواضح عن الأشخاص، مع إبقاء معنى التطهير في المبني للمجهول بدل اختزاله في الشفاء الطبي.
- source_word: κωφοὶ ἀκούουσιν
  choice: الصم يسمعون
  rationale: اقتران الوصف بفعل السماع يحدد أن κωφοί تعني الصم هنا.
- source_word: νεκροὶ ἐγείρονται
  choice: الموتى يُقامون
  rationale: يحفظ المبني للمجهول ولا يضيف فاعلاً لم يصرح به النص.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: يُعلَن للفقراء الخبر السارّ
  rationale: ينقل كون الفقراء متلقّي البشارة ويحفظ المبني للمجهول، مع تجنب تعبير اصطلاحي كنسي غير واضح للقارئ العام.
theological_decisions:
- issue: دلالة قائمة الأعمال على هوية يسوع ورسالته
  choice: عرض أعمال الاسترداد كما هي بوصفها أموراً شوهدت وسُمعت، من غير إضافة تصريح مسياني
  alternative: إدخال ألفاظ تفسيرية صريحة عن إتمام النبوات
  rationale: النص نفسه يكتفي بتقديم هذه الأعمال جواباً يُنقل إلى يوحنا؛ والصياغة تحتفظ بأصداء النبوات من غير أن تضيف استنتاجاً تفسيرياً.
- issue: فاعل أفعال المبني للمجهول
  choice: الإبقاء على المبني للمجهول في «يُطهَّرون» و«يُقامون» و«يُعلَن»
  alternative: التصريح بأن الله أو يسوع هو الفاعل
  rationale: اليونانية لا تصرح بالفاعل في هذه المواضع، وإظهاره في الترجمة يضيف تحديداً لاهوتياً غير ملفوظ به.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. روعي الإيقاع المتوازي للقائمة، مع استعمال «المصابون بالبرص» بدلاً من تسمية الأشخاص بمرضهم، والمحافظة على صيغ المبني للمجهول حيث وردت في المصدر.
