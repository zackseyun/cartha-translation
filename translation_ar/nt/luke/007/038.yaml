id: LUK.7.38
reference: Luke 7:38
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: ar
  text: ووقفت من ورائه عند قدميه وهي تبكي، وبدأت تبلّ قدميه بدموعها وتمسحهما بشعر رأسها، وظلّت تقبّل قدميه[a] وتدهنهما بالطيب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: أخذت تقبّل قدميه مرارًا؛ فالفعل اليوناني قوي الدلالة، وصيغة الماضي الناقص توحي باستمرار الفعل أو تكراره.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بالزيت العطري» أو «بالمرهم المعطّر»؛ فاللفظ اليوناني يدل على مادة عطرية زيتية أو مرهمية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: وقفت
  rationale: اسم فاعل ماضٍ من ἵστημι يهيئ للمشهد؛ وصيغة الفعل الماضي طبيعية في السرد العربي وتحفظ سبق الوقوف للأفعال التالية.
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: من ورائه عند قدميه
  rationale: تحفظ ὀπίσω معنى وجودها خلفه، وتنقل παρά مع المفعول بمعنى القرب المكاني، بما يلائم هيئة الاتكاء إلى المائدة.
- source_word: κλαίουσα
  choice: وهي تبكي
  rationale: تنقل الفعل المستمر المصاحب للوقوف بلغة عربية واضحة وطبيعية.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: وبدأت تبلّ قدميه بدموعها
  rationale: تحفظ ἤρξατο ابتداء الفعل، وتؤدي βρέχειν بمعناه المباشر «تبلّ» من غير مبالغة مثل «تغمر».
- source_word: ἐξέμασσεν
  choice: وتمسحهما
  rationale: الفعل يدل على المسح أو التجفيف بالمسح، والماضي الناقص اليوناني يصوّر فعلًا جاريًا؛ والسياق العربي المتتابع يوصل ذلك من غير إثقال الصياغة.
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: بشعر رأسها
  rationale: يحفظ العبارة اليونانية الكاملة وصورتها الحسية، وهو تعبير عربي طبيعي.
- source_word: κατεφίλει
  choice: وظلّت تقبّل
  rationale: «ظلّت» مع المضارع تنقل الاستمرار والتكرار اللذين يوحي بهما الماضي الناقص والفعل المركب، من غير إضافة وصف عاطفي تفسيري.
- source_word: ἤλειφεν
  choice: وتدهنهما
  rationale: ينقل ἀλείφω بوصفه وضع مادة دهنية أو عطرية على القدمين؛ وهو أوضح في العربية المعاصرة من استعمال «تمسحهما» مرة أخرى.
- source_word: τῷ μύρῳ
  choice: بالطيب
  rationale: «الطيب» لفظ عربي جامع للعطر أو الزيت العطري أو المرهم المعطّر، ويحفظ طبيعة μύρον دون حصرها في هيئة واحدة.
theological_decisions:
- issue: تصوير أفعال المرأة تجاه قدمي يسوع
  choice: الإبقاء على الأفعال الجسدية المحددة وعلى تتابعها وانفعالها، بما في ذلك التقبيل المستمر
  alternative: تلخيصها بعبارة تفسيرية مثل «أظهرت له تكريمها» أو تخفيف دلالة التقبيل المتكرر
  rationale: النص اليوناني يعرض أفعالًا حسية ومشحونة بالعاطفة، ولا يصرّح في هذه الآية وحدها بتفسير لاهوتي لها؛ لذلك ينبغي عدم استبدالها بتأويل تعبدي أو مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت ضمائر التثنية في «تمسحهما» و«تدهنهما» لسلامة الإحالة إلى القدمين، وحُفظت حيوية المشهد من غير توسع تفسيري.
