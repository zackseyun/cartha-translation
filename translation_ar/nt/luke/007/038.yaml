  source_fidelity: 'النص العربي ينقل بدقة تسلسل الأفعال اليونانية وهيئتها: وقوف المرأة خلفه عند قدميه وهي تبكي، وابتداؤها بتبليل قدميه بدموعها، ومسحهما بشعر رأسها، ثم تقبيلهما ودهنهما. وتحافظ «ظلّت تقبّل» على دلالة الماضي الناقص والفعل المركب κατεφίλει في الاستمرار أو التكرار دون إضافة تفسير عاطفي إلى المتن.'
