lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: أخبر
  rationale: يفيد الفعل نقل الخبر أو إبلاغه، و«أخبر» تعبير عربي طبيعي يلائم السياق السردي من غير مبالغة في الرسمية.
- source_word: Ἰωάννῃ
  choice: يوحنا
  rationale: اسم مجرور معنىً بوصفه المفعول غير المباشر؛ ويؤدَّى في العربية مفعولًا به ثانيًا مع الفعل «أخبر».
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: تلاميذ يوحنا
  rationale: أُظهر مرجع الضمير في العربية دفعًا لاحتمال التباسه بأقرب مذكور في السياق، مع الحفاظ على علاقة التعلّم والاتباع التي يدل عليها μαθηταί.
- source_word: περὶ πάντων τούτων
  choice: بهذه الأمور كلِّها
  rationale: الباء تلائم تعدية «أخبر» في العربية، و«كلها» تحفظ شمول πάντων، واسم الإشارة يحفظ قوة τούτων.
- source_word: προσκαλεσάμενος
  choice: فاستدعى
  rationale: يدل على أن يوحنا دعا التلميذين للحضور إليه؛ و«استدعى» موجزة وطبيعية وتحفظ مبادرة الفاعل من غير إضافة اتجاه غير ملفوظ به صراحة.
- source_word: δύο τινὰς
  choice: اثنين
  rationale: تفيد τινάς هنا اختيار فردين غير مسمّيين من الجماعة، وهو معنى تؤديه العربية طبيعيًا بقولها «اثنين من تلاميذه» من غير العبارة الثقيلة «اثنين معيّنين».
- source_word: τῶν μαθητῶν αὐτοῦ
  choice: من تلاميذه
  rationale: '«من» تُظهر بوضوح دلالة التبعيض في المضاف إليه اليوناني: اختار اثنين من جماعة تلاميذه.'
- source_word: ὁ Ἰωάννης
  choice: يوحنا
  rationale: أُبقي الاسم الصريح كما في اليونانية لتحديد فاعل الاستدعاء بوضوح.
