  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُخدم «تلاميذ» للمصطلح الإنجيلي المألوف، وأُظهر اسم يوحنا في مطلع الجملة لتفادي غموض الضمير في العربية. وُضع مؤشر الحاشية بعد الفاصلة الختامية لأن الحاشية تشرح استمرار التركيب النحوي إلى الآية التالية.
