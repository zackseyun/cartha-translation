  - severity: low
    issue: «وهم لم يعتمدوا على يده»
    rationale: المشاركة المنفية μὴ βαπτισθέντες ظرفية؛ و«إذ لم يعتمدوا على يده» أمتن عربيًا وتحافظ على عدم التصريح بعلاقة سببية حصرية.
