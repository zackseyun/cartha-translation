revisions:
- from: أمّا الفريسيون وعلماء الشريعة فرفضوا قصد الله من جهتهم[a]، وهم لم يعتمدوا على يده[b].
  to: أمّا الفريسيون وعلماء الشريعة فرفضوا قصد الله بشأنهم[a]، إذ لم يعتمدوا على يده[b].
  rationale: استُبدلت «من جهتهم» بـ«بشأنهم» لتؤدي بوضوح أن قصد الله متعلق بهم، مع إبقاء احتمال «ضد أنفسهم» في الحاشية. واستُبدلت الجملة الحالية بـ«إذ لم يعتمدوا» لتكون العربية أكثر سلاسة وتمثل الوظيفة الظرفية للمشاركة اليونانية، من دون فرض سبب حصري. ولم يُسمَّ يوحنا في المتن حفاظًا على الضمير الوارد في الأصل، ووُضّح مرجعه في الحاشية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:36:35Z'
review_pass:
  verdict: revise
  source_fidelity: ينقل المتن المقابلة التي تفيدها δέ، وتعيين «الفريسيين» و«علماء الشريعة»، ورفض قصد الله المتعلق بهم. لكن «من جهتهم» أقل دقة وطبيعية هنا من «بشأنهم»، إذ قد توحي بصدور الأمر من ناحيتهم لا بتعلقه بهم. كما أن الصياغة الحالية للجملة الأخيرة أضعف في تمثيل المشاركة اليونانية الظرفية.
  naturalness: «أمّا ... فـ» و«علماء الشريعة» فصيحتان واضحتان. و«على يده» استعمال معروف في سياق المعمودية، لكن تركيب «وهم لم يعتمدوا» أقل سلاسة من جملة ظرفية بـ«إذ».
  terminology: «علماء الشريعة» مناسب لـνομικοί ولا يساويهم بالكتبة. و«قصد الله» مناسب لـβουλή. أُبقيت المعمودية بصيغة «اعتمدوا» وبالضمير العائد إلى يوحنا، مع توضيحه في الحاشية.
