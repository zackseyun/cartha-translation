  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: ar
  text: أمّا الفريسيون وعلماء الشريعة فرفضوا قصد الله بشأنهم[a]، إذ لم يعتمدوا على يده[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مشورة الله ضد أنفسهم»، أو «خطة الله بشأنهم».'
    reason: alternative_reading
  - marker: b
    text: 'أي: على يد يوحنا المعمدان.'
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: علماء الشريعة
  rationale: يدل اللفظ هنا على العارفين المتخصصين في شريعة موسى؛ وهذه العبارة أوضح في العربية المعاصرة من «الناموسيين»، ولا تخلط بينهم وبين الكتبة.
- source_word: βουλὴν
  choice: قصد
  rationale: تنقل «قصد» معنى التدبير أو الغاية المقصودة، بلغة عربية طبيعية، مع إبقاء بدائل «المشورة» و«الخطة» في الحاشية.
- source_word: ἠθέτησαν
  choice: رفضوا
  rationale: تؤدي المعنى المباشر للفعل، أي نبذ الشيء وعدم قبوله، من غير إضافة معنى الإبطال المطلق.
- source_word: εἰς ἑαυτούς
  choice: من جهتهم
  rationale: تحافظ العبارة على تعلق قصد الله بهم شخصيًا، ولا تحسم احتمال فهم حرف الجر بمعنى «ضد أنفسهم».
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: وهم لم يعتمدوا على يده
  rationale: صياغة حالية عربية واضحة تحافظ قدر الإمكان على الصلة الظرفية في اسم الفاعل اليوناني، من غير التصريح بأن عدم المعمودية سبب حصري للرفض.
- source_word: αὐτοῦ
  choice: يده
  rationale: أُبقي الضمير كما في اليونانية، مع بيان مرجعه، يوحنا المعمدان، في الحاشية.
- source_word: δὲ
  choice: أمّا ... فـ
  rationale: يبين هذا التركيب المقابلة مع الفئة المذكورة في الآية السابقة بأسلوب عربي طبيعي.
theological_decisions:
- issue: دلالة قصد الله وعلاقته بالفريسيين وعلماء الشريعة
  choice: قصد الله من جهتهم
  alternative: مشورة الله ضد أنفسهم؛ أو خطة الله بشأنهم
  rationale: تبقي الصياغة القصد الإلهي متعلقًا بهم، من غير أن تحسم توتر النص بإقرار أن إرادة الله المطلقة قد أُبطلت، أو بأن المقصود حصرًا حكم صدر ضدهم.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت «علماء الشريعة» بدل المصطلح الأقدم «الناموسيين»، وأُبقي الضمير العائد إلى يوحنا في المتن وفق الأصل مع توضيحه في الحاشية.
