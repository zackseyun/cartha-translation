source:
  edition: SBLGNT
  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: ar
  text: 'وبعدما انصرف رسل يوحنا، بدأ يقول للجموع عن يوحنا: «ماذا خرجتم إلى البرية لتنظروا؟ أقصبةً تهزّها الريح؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: وبعدما انصرف
  rationale: اسم الفاعل الأوريستي في تركيب المضاف إليه المطلق يفيد هنا الظرف الزمني، وتُظهر «بعدما انصرف» أن انصراف الرسل سبق بدء الكلام.
- source_word: ἀγγέλων
  choice: رسل
  rationale: السياق يدل على مبعوثين بشريين أرسلهم يوحنا، لا على ملائكة سماويين.
- source_word: Ἰωάννου
  choice: يوحنا
  rationale: الصيغة الأولى تفيد أن الرسل تابعون ليوحنا، والثانية بعد περί تعني أن الكلام كان عنه.
- source_word: ἤρξατο λέγειν
  choice: بدأ يقول
  rationale: يحفظ قوة البدء في التركيب اليوناني، وهو تعبير عربي طبيعي عند افتتاح خطاب.
- source_word: πρὸς τοὺς ὄχλους
  choice: للجموع
  rationale: يحفظ جمع ὄχλους، وتؤدي اللام معنى πρός مع فعل القول بوضوح وطبيعية.
- source_word: περὶ Ἰωάννου
  choice: عن يوحنا
  rationale: مقابل عربي مباشر وطبيعي لـ περί مع المضاف إليه في سياق الحديث عن شخص.
- source_word: Τί ἐξήλθατε
  choice: ماذا خرجتم
  rationale: السؤال عن الشيء الذي خرجوا لينظروه، لا عن علة خروجهم؛ لذلك حُفظت «ماذا» بدل «لماذا».
- source_word: εἰς τὴν ἔρημον
  choice: إلى البرية
  rationale: «البرية» تعبر عن المنطقة المقفرة قليلة السكان المرتبطة بخدمة يوحنا، وهي مألوفة في الأسلوب الكتابي العربي.
- source_word: θεάσασθαι
  choice: لتنظروا
  rationale: ينقل معنى المشاهدة المقصودة أو المتأملة بصياغة عربية واضحة، من غير نبرة قديمة ثقيلة.
- source_word: κάλαμον
  choice: قصبةً
  rationale: يحفظ الصورة الحرفية للنبات الرقيق الذي تحركه الريح وما تحمله من إيحاء بعدم الثبات.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: تهزّها الريح
  rationale: صياغة عربية حية وطبيعية تحفظ المبني للمجهول دلاليًا وتبرز حركة القصبة تحت تأثير الريح.
theological_decisions:
- issue: القوة المجازية للسؤال البلاغي عن يوحنا
  choice: 'الإبقاء على الصورة الحرفية: «أقصبةً تهزّها الريح؟»'
  alternative: «أرجلًا ضعيفًا أو متقلّبًا؟»
  rationale: يعرض النص الصورة ويترك للسامعين استنتاج نفي التذبذب عن يوحنا؛ وشرح المجاز داخل المتن يحسم دلالة أبقاها النص ضمنية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختيرت «الجموع» حفظًا للجمع اليوناني، و«البرية» لملاءمة السياق الجغرافي والكتابي. لم تُضف حاشية لأن البدائل الدلالية لـ θεάσασθαι لا تستلزم تنبيهًا نصيًا في العربية، كما أن علامة الحاشية الإنجليزية موضوعة بعد «انصرف» على نحو لا يطابق الكلمة المشروحة.
