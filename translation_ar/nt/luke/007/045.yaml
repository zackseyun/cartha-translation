  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: ar
  text: أنت لم تُعْطِني قُبلةً[a]، أمّا هي فمنذ أن دخلتُ لم تكفّ عن تقبيل قدميَّ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قبلة تحية»؛ فقد كانت القبلة من عادات الترحيب بالضيف.'
    reason: cultural_note
  - marker: b
    text: 'يمكن أن يدل الفعل على التقبيل بحرارة أو بصورة متكررة: «لم تكفّ عن إغراق قدميَّ بالقبلات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά
  choice: قُبلةً
  rationale: الاسم مع فعل «أعطى» يدل على تقديم قبلة، وهي في هذا السياق قبلة التحية المعتادة. أبقى المتن موجزًا، ويُشرح العرف في الحاشية.
- source_word: μοι
  choice: لي / ـني في «تُعْطِني»
  rationale: ضمير المفعول غير المباشر أُدمج في الفعل وفق الأسلوب العربي الطبيعي.
- source_word: ἔδωκας
  choice: تُعْطِ
  rationale: يحافظ على المعنى المباشر للفعل δίδωμι، مع صياغة عربية فصيحة طبيعية تحت تأثير النفي بـ«لم».
- source_word: αὕτη δὲ
  choice: أمّا هي
  rationale: تُبرز المقابلة بين المخاطَب والمرأة من غير إضافة تفسيرية مثل «هذه المرأة».
- source_word: ἀφ’ ἧς
  choice: منذ أن
  rationale: تنقل الدلالة الزمنية بوضوح وطبيعية في العربية.
- source_word: εἰσῆλθον
  choice: دخلتُ
  rationale: المقابل المباشر والطبيعي لفعل الدخول في هذا السياق.
- source_word: οὐ διέλιπεν
  choice: لم تكفّ
  rationale: ينقل معنى عدم التوقف عن فعل بدأ عند الدخول واستمر حتى لحظة الكلام.
- source_word: καταφιλοῦσά
  choice: عن تقبيل
  rationale: صياغة عربية طبيعية، مع إبقاء دلالة التقبيل الحميم أو المتكرر في الحاشية بدل تثقيل المتن.
- source_word: μου τοὺς πόδας
  choice: قدميَّ
  rationale: يحافظ على جمع «القدمين» الوارد صراحة في اليونانية، بصيغة المثنى العربية الطبيعية.
theological_decisions:
- issue: الدلالة الضمنية لقبلة الضيافة
  choice: ذكر القبلة ببساطة في المتن وشرح كونها قبلة تحية وضيافة في الحاشية.
  alternative: أنت لم تُعْطِني قبلة التحية المعتادة.
  rationale: النص اليوناني يذكر الفعل نفسه دون تفسير العرف. الحاشية تحفظ الخلفية الثقافية من غير إدخال شرح تفسيري في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «أمّا هي» لإظهار المقابلة، و«قدميَّ» للمثنى الطبيعي. وُضعت علامتا الحاشيتين [a] و[b] في المتن، مع الحفاظ على شدة فعل καταφιλέω في الحاشية.
