  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: ar
  text: 'يشبهون أطفالًا جالسين في ساحة السوق، ينادون بعضهم بعضًا قائلين: «عزفنا لكم على الناي فلم ترقصوا، وندبنا[a] فلم تبكوا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أنشدنا لكم مرثاة»؛ فالفعل اليوناني قد يدل على الندب أو إنشاد مرثاة، ولا سيما في سياق جنائزي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: يشبهون
  rationale: تعبير عربي طبيعي ومباشر للمقارنة، ويحافظ على تقديم التشبيه دون زيادة تفسيرية.
- source_word: παιδίοις
  choice: أطفالًا
  rationale: يدل اللفظ على الأطفال عمومًا، من غير ضرورة لتحديد الجنس أو تضييق المرحلة العمرية.
- source_word: ἐν ἀγορᾷ
  choice: في ساحة السوق
  rationale: كانت ἀγορά ساحة عامة تُقام فيها الأسواق وتدور فيها الحياة الاجتماعية؛ و«ساحة السوق» أوضح من «السوق» وحدها للمشهد.
- source_word: καθημένοις
  choice: جالسين
  rationale: ينقل هيئة الأطفال ببساطة ويحافظ على قيمة اسم الفاعل في الأصل.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: ينادون بعضهم بعضًا
  rationale: يحفظ معنى النداء المتبادل الذي تفيده ἀλλήλοις، ويلائم مشهد الأطفال في الساحة.
- source_word: ἃ λέγει
  choice: قائلين
  rationale: صياغة عربية سلسة تتبع المعنى الجمعي العائد إلى الأطفال، مع أن الفعل اليوناني مفرد ذو استعمال جمعي في هذا التركيب.
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: عزفنا لكم بالناي
  rationale: الفعل αὐλέω يخص العزف بالناي أو المزمار؛ والتصريح بالناي يحفظ الصورة الملموسة.
- source_word: οὐκ ὠρχήσασθε
  choice: فلم ترقصوا
  rationale: ينقل الفعل بصيغة ماضية عربية طبيعية، ويحفظ الاستجابة المتوقعة للعزف دون تفسيرها بالاحتفال.
- source_word: ἐθρηνήσαμεν
  choice: ندبنا
  rationale: «ندبنا» فعل عربي موجز يدل على إنشاد المرثاة أو إظهار الحزن، ويحافظ على المقابلة مع العزف.
- source_word: οὐκ ἐκλαύσατε
  choice: فلم تبكوا
  rationale: ترجمة مباشرة لـ κλαίω، وتحفظ التوازي بين الندب والبكاء.
theological_decisions:
- issue: الحفاظ على القوة التشبيهية لأفعال الأطفال المتقابلة من غير استباق تفسير المثل
  choice: 'استخدام الأفعال الحسية الملموسة: «عزفنا»، «ترقصوا»، «ندبنا»، «تبكوا»'
  alternative: صياغة تفسيرية مثل «فرحنا فلم تفرحوا، وحزنّا فلم تحزنوا»
  rationale: النص يعرض صورة تمثيلية ولا يشرح تطبيقها في هذه الآية؛ لذا تحافظ الأفعال الملموسة على الصورة والتوتر الدلالي دون إدخال تفسير لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «ساحة السوق» لتصوير المكان العام، و«بالناي» لإظهار الآلة التي يتضمنها الفعل اليوناني. وُضعت علامة الحاشية بعد الاقتباس لأنها تتعلق بلفظ «ندبنا» داخله.
