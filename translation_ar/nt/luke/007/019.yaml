  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: ar
  text: 'فأرسل إلى الرب قائلًا: «أأنت الآتي[a]، أم ننتظر آخر؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي يأتي». يمكن أن تُفهم العبارة اليونانية وصفًا، لكنها على الأرجح تُستعمل هنا لقبًا مسيانيًا.'
    reason: بديل معجمي مع بيان القوة اللقبية المحتملة
lexical_decisions:
- source_word: ἔπεμψεν
  choice: فأرسل
  rationale: فعل ماضٍ يعبّر عن حدث سردي بسيط، وتُفهم الجهة المرسَل إليها من العبارة التالية. أُضيفت الفاء لوصل الحدث بسياقه السردي العربي.
- source_word: πρὸς τὸν κύριον
  choice: إلى الرب
  rationale: تفيد πρός مع النصب الاتجاه إلى شخص، و«الرب» تنقل κύριος بوصفه اللقب المعتاد ليسوع في سياق لوقا، مع إبقاء ثقله الدلالي.
- source_word: λέγων
  choice: قائلًا
  rationale: اسم فاعل حالي يقدّم مضمون الرسالة، و«قائلًا» يحافظ طبيعيًا على الصلة التركيبية.
- source_word: Σὺ εἶ
  choice: أأنت
  rationale: صيغتها خبرية من حيث البناء اليوناني، لكن السياق الاستفهامي يقتضي في العربية همزة الاستفهام مع إبراز الضمير.
- source_word: ὁ ἐρχόμενος
  choice: الآتي
  rationale: اسم فاعل معرّف مستعمل استعمال الاسم؛ و«الآتي» موجز وطبيعي، ويحفظ إمكان فهم العبارة لقبًا مسيانيًا أو وصفًا لمن سيأتي.
- source_word: ἢ
  choice: أم
  rationale: تدخل هنا على الشق الثاني من استفهام تعييني، ولذلك «أم» أدق عربيًا من «أو».
- source_word: ἄλλον
  choice: آخر
  rationale: ينقل المفعول به بإيجاز، من غير إضافة «شخص» غير المذكورة صراحة.
- source_word: προσδοκῶμεν
  choice: ننتظر
  rationale: المضارع المتكلم الجمع يدل على انتظار مستمر متجه إلى المستقبل؛ و«ننتظر» عربي طبيعي يشمل معنى الترقب والتوقع.
theological_decisions:
- issue: ترجمة κύριος لقبًا ليسوع
  choice: الرب
  alternative: السيد
  rationale: «الرب» هو المقابل الأنسب للقب κύριος في سرد لوقا ويحفظ ثقله المسيحاني، بينما قد تُضعف «السيد» هذا البعد في هذا الموضع.
- issue: هل ὁ ἐρχόμενος لقب مسياني أم وصف عام؟
  choice: الآتي
  alternative: الذي يأتي؛ المزمع أن يأتي
  rationale: «الآتي» يحافظ على الصيغة الاسمية المعرّفة وعلى قوة اللقب المحتملة، من غير أن يحسم تمامًا بين الاستعمال اللقبي والوصف المباشر.
- issue: دلالة προσδοκῶμεν في السؤال
  choice: ننتظر
  alternative: نتوقع؛ ينبغي أن ننتظر
  rationale: الصيغة اليونانية مضارع خبري في سؤال بديل، ويمكن أن تحمل معنى الترقب أو التوقع. «ننتظر» تحفظ الاستمرار ولا تضيف صراحة معنى الوجوب غير الملفوظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «أأنت» لصياغة السؤال مباشرة، و«أم» للمفاضلة بين البديلين، مع إبقاء العبارة المركزية موجزة وقابلة للفهم اللقبي والوصفي.
