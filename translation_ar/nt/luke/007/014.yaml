source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: ar
  text: 'فتقدَّم ولمس النعش[a]، فتوقَّف حاملوه، وقال: «أيها الشاب، أقول لك: قُمْ!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي السرير أو الإطار الذي كان الميت يُحمل عليه في موكب الجنازة؛ ويمكن أن يُترجم أيضًا «سرير حمل الميت»، وليس المقصود بالضرورة تابوتًا مغلقًا بالمفهوم الحديث.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: فتقدَّم
  rationale: اسم فاعل فعلي ماضٍ يفيد اقتراب يسوع قبل الفعل الرئيس؛ و«فتقدَّم» تنقل الحركة والتتابع بإيجاز طبيعي.
- source_word: ἥψατο
  choice: لمس
  rationale: الفعل في هذا السياق يعني اللمس، ولا يلزم منه الإمساك أو التشبث.
- source_word: σοροῦ
  choice: النعش
  rationale: يدل اللفظ على السرير أو الإطار الذي كان يُحمل عليه الميت في موكب الجنازة، و«النعش» هو المقابل العربي الطبيعي والدقيق، دون افتراض تابوت مغلق بالمفهوم الحديث.
- source_word: οἱ δὲ βαστάζοντες
  choice: حاملوه
  rationale: تعبير عربي موجز وواضح عن الأشخاص الذين كانوا يحملون النعش، والضمير عائد إليه من السياق.
- source_word: ἔστησαν
  choice: توقَّف
  rationale: يفيد الفعل هنا انقطاع حركة الحاملين وثباتهم في موضعهم؛ و«توقَّف» هو التعبير العربي الطبيعي في سياق الموكب.
- source_word: Νεανίσκε
  choice: أيها الشاب
  rationale: نداء مباشر لذكر في سن الشباب، وهو تعبير فصيح واضح ومعاصر.
- source_word: σοὶ λέγω
  choice: أقول لك
  rationale: يحافظ على ضمير المخاطب الصريح وعلى مباشرة القول وقوته، من غير إضافة تفسير.
- source_word: ἐγέρθητι
  choice: قُمْ
  rationale: أمر مباشر بالنهوض؛ و«قُمْ» طبيعي ومهيب في العربية، ويناسب خطاب الميت دون إدخال شرح عقائدي في النص.
theological_decisions:
- issue: نبرة أمر يسوع للميت ودلالة ἐγέρθητι
  choice: قُمْ
  alternative: انهض؛ أُقِمْ
  rationale: «قُمْ» يحفظ صيغة الأمر المباشر وسلطان القول في المشهد، مع إبقاء دلالة القيامة ضمن السرد نفسه. أما «أُقِمْ» فتُبرز المبني للمجهول صرفيًا لكنها غير طبيعية هنا وقد توحي بفاعل آخر على نحو يحسم ما لا يحتاج النص إلى حسمه.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. وُضعت علامة الحاشية بعد «النعش» لأنها تشرح اللفظ اليوناني σορός. استُخدم «فتقدَّم» و«فتوقَّف» لإظهار تعاقب الأفعال طبيعيًا، وحُفظت مباشرة خطاب يسوع في «أقول لك: قُمْ!».'
