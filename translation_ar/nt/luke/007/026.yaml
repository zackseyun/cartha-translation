  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: ar
  text: 'لكن ماذا خرجتم لتروا؟ أنبيًّا؟ نعم، أقول لكم: بل أكثر من نبيّ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكن
  rationale: أداة استدراك تقابل السؤال البلاغي السابق، و«لكن» انتقال عربي طبيعي يحفظ هذا التقابل.
- source_word: τί
  choice: ماذا
  rationale: ضمير استفهام واقع مفعولًا به لفعل الرؤية؛ فالمعنى «ماذا» لا «لماذا».
- source_word: ἐξήλθατε
  choice: خرجتم
  rationale: فعل ماضٍ للمخاطبين بصيغة الجمع، ويحفظ الفعل العربي الحدث الماضي بإيجاز وطبيعية.
- source_word: ἰδεῖν
  choice: لتروا
  rationale: مصدر يدل على الغرض بعد فعل الخروج؛ ولام التعليل مع المضارع صياغة عربية واضحة وطبيعية.
- source_word: προφήτην
  choice: أنبيًّا؟
  rationale: 'اسم نكرة منصوب في سؤال بلاغي محذوف الفعل تقديره: أخرجتم لتروا نبيًّا؟'
- source_word: ναί
  choice: نعم
  rationale: جواب إثبات مباشر وقوي للسؤال البلاغي.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: يحفظ صيغة الخطاب الإنجيلية الشائعة وبنيتها المباشرة.
- source_word: καὶ
  choice: بل
  rationale: مع أن معناها الأساسي «و»، فإن السياق التصاعدي بعد الإثبات يُعبَّر عنه عربيًّا على نحو أوضح بـ«بل»، إذ ينتقل من كونه نبيًّا إلى ما هو أكثر من ذلك دون نفي الوصف الأول.
- source_word: περισσότερον προφήτου
  choice: أكثر من نبيّ
  rationale: ينقل تركيب المقارنة مع المضاف إليه بصياغة عربية موجزة، ويحفظ عدم تحديد وجه التفوق في هذه الآية.
theological_decisions:
- issue: هوية يوحنا المعمدان ومكانته في وصف يسوع
  choice: يؤكد يسوع أن يوحنا نبي، بل أكثر من نبي، من غير أن يحدد في هذه الآية وحدها طبيعة هذه الزيادة.
  alternative: التصريح بأنه أعظم الأنبياء أو بأنه الرسول الأخروي المقصود تحديدًا.
  rationale: ينبغي إبقاء العبارة الموجزة على توترها الدلالي، وعدم إدخال شرح يقدمه السياق اللاحق لكنه غير مصرح به هنا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حوفظ على تتابع الأسئلة البلاغية وعلى الإيجاز، واستُعملت «بل» لإظهار التصاعد الطبيعي في العربية من إثبات النبوة إلى منزلة تتجاوزها.
