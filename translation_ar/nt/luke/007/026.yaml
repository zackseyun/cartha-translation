  source_fidelity: الترجمة تنقل بدقة الأسئلة البلاغية المتتابعة في اليونانية، وفعل الخروج لغرض الرؤية، والإقرار «نعم، أقول لكم»، ثم المقارنة التصاعدية غير المفسَّرة «أكثر من نبي». ولم تُضف تحديدًا لطبيعة تفوق يوحنا.
  naturalness: 'الصياغة فصيحة معاصرة وموجزة وطبيعية: «لكن ماذا خرجتم لتروا؟ أنبيًّا؟ نعم، أقول لكم: بل أكثر من نبيّ.» وتناسب النبرة الخطابية في السياق.'
  terminology: «نبيّ» مصطلح سليم ومألوف في العربية الكتابية المعاصرة. واستعمال «بل» في الخاتمة عربي طبيعي لإبراز التصاعد، ولا يفرض تفسيرًا لوجه المقارنة، مع أن اليونانية تستعمل حرف عطف بسيطًا.
