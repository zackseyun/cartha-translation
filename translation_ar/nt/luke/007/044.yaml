  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: ar
  text: 'ثم التفت إلى المرأة وقال لسمعان: «أترى هذه المرأة؟ دخلت بيتك، فلم تعطِني ماءً لقدميَّ[a]، أمّا هي فبلَّلت قدميَّ بدموعها ومسحتهما بشعرها».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «ماءً على قدميَّ». والمقصود تقديم الماء بحسب عادة غسل أقدام الضيف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: التفت إلى المرأة
  rationale: ينقل حركة الالتفات الجسدية نحو المرأة بصياغة عربية طبيعية، مع إبقاء الفعل سابقًا للقول كما في تركيب اسم الفاعل اليوناني.
- source_word: τῷ Σίμωνι ἔφη
  choice: وقال لسمعان
  rationale: صياغة سردية عربية مألوفة تؤدي معنى فعل القول واسم المخاطَب بوضوح.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: أترى هذه المرأة؟
  rationale: يحافظ على السؤال المباشر وعلى اسم الإشارة الذي يبرز المرأة في المقابلة الآتية.
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: دخلت بيتك
  rationale: ترجمة موجزة ومباشرة للفعل الماضي ولـοἰκία، بلغة عربية طبيعية.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: فلم تعطِني ماءً لقدميَّ
  rationale: يبقي النص على فعل إعطاء الماء من غير إضافة فعل غسل غير مذكور صراحة، ويؤدي الغرض المقصود طبيعيًا في العربية.
- source_word: αὕτη δὲ
  choice: أمّا هي فـ
  rationale: يبين المقابلة القوية بين ما لم يفعله سمعان وما فعلته المرأة، من غير تكرار الاسم.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: بلَّلت قدميَّ بدموعها
  rationale: ينقل معنى βρέχω، أي جعل الشيء مبتلًا، ويصرح بأداة الفعل التي يدل عليها المجرور اليوناني.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: ومسحتهما بشعرها
  rationale: الضمير المثنى يعود بوضوح إلى القدمين، و«مسح» يؤدي معنى ἐκμάσσω من غير زيادة تفسيرية.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أترى» للحفاظ على مباشرة السؤال، و«أمّا هي» لإبراز المقابلة البلاغية. وُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
