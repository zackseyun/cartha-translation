  text: فجلس الميت وبدأ يتكلم، فأعطاه يسوع لأمه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز بحسب المعنى السياقي: «فأعاده إلى أمه» أو «فأعطاه من جديد لأمه». أما اليونانية فتقول حرفيًا: «فأعطاه لأمه»، ومعنى الإعادة مفهوم من السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: جلس
  rationale: يدل الفعل هنا على الانتقال من وضع الاستلقاء إلى الجلوس. و«جلس» تعبير عربي طبيعي واضح، من غير أن يضيف إلى النص معنى القيام واقفًا.
- source_word: ὁ νεκρός
  choice: الميت
  rationale: صياغة عربية طبيعية تحافظ على الوصف الاسمي في اليونانية وتشير بوضوح إلى الشاب الذي كان ميتًا.
- source_word: ἤρξατο λαλεῖν
  choice: بدأ يتكلم
  rationale: ينقل البناء الدال على ابتداء الفعل بوضوح، و«يتكلم» فصيحة وطبيعية في السرد الحديث.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: فأعطاه يسوع لأمه
  rationale: يحافظ على الفعل البسيط «أعطى» دون إضافة «أعاده» إلى المتن. أُظهر اسم يسوع لأن ضمير الفاعل المستتر في العربية قد يُفهم خطأً على أنه عائد إلى الميت، مع أن السياق اليوناني يدل على يسوع.
theological_decisions:
- issue: هل يُصرَّح بأن يسوع أعاد الابن إلى أمه؟
  choice: الإبقاء على «أعطاه ... لأمه» في المتن
  alternative: أعاده إلى أمه / أعطاه من جديد لأمه
  rationale: السياق يفيد الاسترداد بوضوح، لكن اليونانية تستعمل فعل «أعطى» من غير لفظ صريح بمعنى «أعاد». لذلك تُحفظ بساطة النص، ويُذكر المعنى السياقي البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت الفاء في الجملة الأخيرة لإبراز تتابع الحدث طبيعيًا، وصُرّح باسم يسوع لرفع التباس مرجع الضمير في العربية دون تغيير هوية الفاعل في السياق.
