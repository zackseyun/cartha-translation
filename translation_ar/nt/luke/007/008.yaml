  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: ar
  text: 'فأنا أيضًا رجل خاضع لسلطة، ولي جنود تحت إمرتي. أقول لهذا: «اذهب»، فيذهب؛ ولآخر: «تعال»، فيأتي؛ ولعبدي[a]: «افعل هذا»، فيفعله.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خادمي». تدل الكلمة اليونانية على شخص تابع في وضع عبودية أو مملوكية، مع إمكان ترجمتها في بعض السياقات بلفظ أعم هو «خادم».
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: فأنا أيضًا
  rationale: تربط الفاء الكلام بما قبله بوصفه تعليلًا، وتنقل «أيضًا» قوة καί المقارِنة في هذا السياق.
- source_word: ἄνθρωπός εἰμι
  choice: أنا رجل
  rationale: المتكلم رجل يتحدث عن نفسه، و«رجل» هنا طبيعية ودقيقة سياقيًا.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: خاضع لسلطة
  rationale: صياغة عربية واضحة تحفظ موقعه ضمن تسلسل قيادي، وإن كانت تعبّر عن نتيجة تعيينه أو وضعه تحت سلطة بدل محاكاة المبني للمجهول حرفيًا.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: ولي جنود تحت إمرتي
  rationale: تنقل بصورة طبيعية كون الجنود دونه في السلم العسكري وخاضعين لأوامره.
- source_word: λέγω τούτῳ
  choice: أقول لهذا
  rationale: تحفظ اسم الإشارة τούτῳ وبنية المثال المباشر.
- source_word: Πορεύθητι ... πορεύεται
  choice: اذهب، فيذهب
  rationale: تنقل الأمر والاستجابة المباشرة وتحافظ على التوازي اللفظي.
- source_word: Ἔρχου ... ἔρχεται
  choice: تعال، فيأتي
  rationale: صياغة عربية مباشرة تحافظ على نمط الأمر ثم تنفيذه.
- source_word: τῷ δούλῳ μου
  choice: لعبدي
  rationale: لأن علاقة التبعية والسلطة بارزة في التشبيه، فإن «عبدي» أدق من اللفظ الأعم «خادمي»، مع إثبات البديل في الحاشية.
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: افعل هذا، فيفعله
  rationale: تحافظ على الأمر ووقوع الفعل؛ وضمير المفعول في «يفعله» طبيعي في العربية ومرجعه «هذا».
theological_decisions:
- issue: دلالة δοῦλος في مثال قائد المئة
  choice: عبد
  alternative: خادم
  rationale: لا يقرر النص تعليمًا عن الرق، لكن منزلة التابع الخاضع محورية في المثال. لذلك يحفظ «عبد» الواقع الاجتماعي ودلالة السلطة، مع إبقاء «خادم» بديلًا ممكنًا في الحاشية دون حسم ما قد يتسع له اللفظ في بعض السياقات.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع توازٍ موجز بين الأوامر ونتائجها. استُعملت علامات الوقف لإبراز البنية الإيقاعية للمثال، ووُضع مؤشر الحاشية مباشرة بعد اللفظ المختلف عليه.
