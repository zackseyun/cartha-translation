  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: ar
  text: 'فلما جاءوا إلى يسوع، رجوه بإلحاح قائلين: «هو مستحق أن تمنحه هذا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هو مستحق أن تفعل له هذا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: جاءوا
  rationale: يدل اسم الفاعل على الوصول أو الحضور، وصيغة «فلما جاءوا» تنقل معناه الزمني بوضوح وطبيعية.
- source_word: παρεκάλουν
  choice: أخذوا يتوسلون إليه
  rationale: يفيد الفعل الطلب الملحّ أو الالتماس، وهذه الصياغة تحفظ نبرة الرجاء الجاد من غير أن تجعلها أمرًا.
- source_word: σπουδαίως
  choice: بإلحاح
  rationale: ينقل جدية الطلب وشدته في هذا السياق، وهو أنسب عربيًا مع «يتوسلون».
- source_word: Ἄξιος
  choice: مستحق
  rationale: ينقل الحكم بأن قائد المئة جدير بنيل المطلوب، وهو واضح في العربية المعاصرة.
- source_word: ᾧ
  choice: ـه في «تمنحه»
  rationale: يعود ضمير الموصول في حالة المجرور/الداتيف إلى قائد المئة، وتؤديه العربية طبيعيًا بضمير المفعول غير المباشر المتصل بالفعل.
- source_word: παρέξῃ
  choice: تمنحه
  rationale: يفيد الفعل التقديم أو المنح؛ و«تمنحه» تلائم نبرة الالتماس وبنية الجملة، مع بقاء مضمون «هذا» محالًا إلى الطلب السابق.
- source_word: τοῦτο
  choice: هذا
  rationale: يحيل اسم الإشارة إلى الفعل المطلوب في السياق من غير إضافة تفسيرية غير موجودة في النص.
theological_decisions:
- issue: دلالة الاستحقاق في قول الشيوخ
  choice: 'الإبقاء على تقريرهم المباشر: «هو مستحق»'
  alternative: تفسير الاستحقاق على أنه أهلية دينية أو استحقاق للخلاص
  rationale: الآية تسجل تقييم المتكلمين لأهلية قائد المئة لنيل هذه المعونة، ولا تحدد عقيدة عامة في الاستحقاق؛ لذلك لا ينبغي توسيع العبارة لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «فلما» لربط الحدث بما قبله، و«أخذوا يتوسلون إليه بإلحاح» لإظهار استمرار الطلب وجديته. وُضع مؤشر الحاشية بعد الاقتباس الذي تتعلق به الصياغة البديلة.
