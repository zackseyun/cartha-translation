source:
  edition: SBLGNT
  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: ar
  text: 'فاستولى الخوف على الجميع[a]، وكانوا يمجِّدون الله قائلين: «قد قام بيننا نبيٌّ عظيم[b]، وافتقد الله شعبه[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فاستولت الرهبة على الجميع»؛ غير أن «الخوف» ينقل اللفظ اليوناني بصورة مباشرة ويحفظ معنى الخشية والرهبة معًا.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «قد أُقيم بيننا نبيٌّ عظيم»، وفي ذلك إبراز لاحتمال أن الله هو الذي أقامه.'
    reason: lexical_alternative
  - marker: c
    text: «افتقد» هنا تعبير كتابي يعني أن الله أتى إلى شعبه بعناية واهتمام وتدخّل، لا مجرد الزيارة العادية.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλαβεν ... φόβος πάντας
  choice: فاستولى الخوف على الجميع
  rationale: يحافظ على كون «الخوف» فاعلًا في التعبير اليوناني وعلى معنى الاستحواذ المفاجئ، من غير اختزاله في «الرهبة» وحدها.
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط سردية خفيفة تصل رد فعل الجمع بالحدث السابق بصورة طبيعية في العربية.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: وأخذوا يمجِّدون الله
  rationale: صيغة «أخذوا يمجِّدون» تنقل الاستمرار الذي تدل عليه صيغة الماضي الناقص، وتحافظ على الصلة المعجمية بفعل التمجيد.
- source_word: λέγοντες
  choice: قائلين
  rationale: ينقل اسم الفاعل اليوناني بإيجاز، ويدخل مضمون تمجيدهم لله.
- source_word: Προφήτης μέγας
  choice: نبيٌّ عظيم
  rationale: ترجمة مباشرة وطبيعية للتركيب، وتحفظ قوة الوصف μέγας.
- source_word: ἠγέρθη
  choice: قد قام
  rationale: تعبير عربي طبيعي يدل على ظهور النبي وقيامه في الجماعة، مع إبقاء احتمال الإقامة بفعل الله في الحاشية لأن اليونانية مبنية للمجهول.
- source_word: ἐν ἡμῖν
  choice: بيننا
  rationale: تعبير عربي واضح عن الظهور في وسط الجماعة.
- source_word: Ἐπεσκέψατο
  choice: افتقد
  rationale: يحفظ اصطلاح الافتقاد الكتابي الذي يدل على مجيء الله إلى شعبه بعناية وتدخّل، من غير حصره في معنى واحد كالإنقاذ أو المعونة.
- source_word: τὸν λαὸν αὐτοῦ
  choice: شعبه
  rationale: صياغة عربية موجزة وطبيعية تحفظ دلالة الانتماء والعلاقة العهدية.
theological_decisions:
- issue: دلالة φόβος بعد المعجزة
  choice: الخوف
  alternative: الرهبة
  rationale: «الخوف» أقرب إلى اللفظ اليوناني ويحفظ التوتر بين الخشية والرهبة التعبدية، بدل أن يحسم المقصود في شعور إيجابي فقط.
- issue: دلالة ἠγέρθη في الحديث عن النبي
  choice: قد قام
  alternative: قد أُقيم
  rationale: الصياغة المختارة طبيعية في العربية ويمكن أن تدل على ظهور النبي، بينما يحفظ البديل في الحاشية البناء للمجهول وإمكان الإشارة إلى أن الله أقامه.
- issue: دلالة Ἐπεσκέψατο في فعل الله
  choice: افتقد الله شعبه
  alternative: جاء الله إلى شعبه ليعينه
  rationale: لغة الافتقاد تحفظ الغنى الكتابي المتعلق بعناية الله وتدخله، ولا تختزله في نوع واحد من المعونة.
- issue: العلاقة بين عبارتي ὅτι ... καὶ ὅτι
  choice: قول واحد متصل داخل علامتي اقتباس
  alternative: 'قولان منفصلان: «قد قام...» و«افتقد الله...»'
  rationale: العبارتان مضمونا فعل «قائلين» ومتوازيتان نحويًا؛ جمعهما في اقتباس واحد هو الأسلس عربيًا من غير تغيير المعنى.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «افتقد» للمحافظة على اصطلاح الافتقاد الكتابي مع شرحه في الحاشية، واستُخدم «أخذوا يمجِّدون» لإظهار استمرار الفعل. وُضعت جميع علامات الحواشي في مواضعها داخل المتن.
