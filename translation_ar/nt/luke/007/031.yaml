  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: ar
  text: «فبمَن أشبّه أهل هذا الجيل؟ ومَن يشبهون؟»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνι
  choice: بمَن
  rationale: أداة الاستفهام اليونانية هنا في صيغة المفرد، ويأتي جواب التشبيه لاحقًا بأشخاص؛ لذا فـ«بمَن» طبيعية ودقيقة.
- source_word: οὖν
  choice: فـ
  rationale: تنقل الاستنتاج والانتقال الناتج من السياق السابق بإيجاز طبيعي.
- source_word: τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης
  choice: أهل هذا الجيل
  rationale: «أهل» تشمل الناس المنتمين إلى الجيل وتحافظ على الدلالة الجماعية من غير حصرها في الذكور، لأن ἀνθρώπους هنا عامة.
- source_word: καὶ τίνι εἰσὶν ὅμοιοι
  choice: ومَن يشبهون؟
  rationale: صياغة عربية واضحة تحفظ السؤال الموازي، مع فهم ὅμοιοι بمعنى المماثلة.
