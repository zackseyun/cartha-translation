  verdict: approve
  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: النفي في الشطر الأول، ومسح الرأس بالزيت، والمقابلة بـ«لكنها»، ومسح القدمين بالطيب. واستعمال «قدميَّ» يعبّر طبيعيًا عن الجمع اليوناني في العربية. كما أن صيغة الماضي في «مسحت» توافق الفعل اليوناني الماضي ولا تفرض دلالة زمنية زائدة.'
  naturalness: 'الصياغة فصيحة حديثة وواضحة: «أمّا أنت فلم تمسح رأسي بزيت، لكنها مسحت قدميّ بطيب» سليمة ومناسبة لسياق الخطاب. التقديم بـ«أمّا أنت» يبرز المقابلة دون تكلّف.'
  terminology: «زيت» مقابل مناسب لـἐλαίῳ، و«مسح» يحافظ على التوازي المعجمي للفعل ἀλείφω من دون تحميله معنى طقسيًا حتميًا. و«طيب» مقابل عربي صالح لـμύρῳ في هذا السياق، والحاشية تورد البدائل المعجمية ذات الصلة. موضع علامة الحاشية صحيح لأنه يتصل بـ«طيب».
