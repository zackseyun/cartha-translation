  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: ar
  text: أَمَّا أَنْتَ فَلَمْ تَمْسَحْ رَأْسِي بِزَيْتٍ، لَكِنَّهَا مَسَحَتْ قَدَمَيَّ بِطِيبٍ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بزيت عطري» أو «بمرهم عطري» بدلًا من «بطيب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαίῳ
  choice: بزيت
  rationale: اسم في حالة المجرور الأداتي يدل على الوسيلة. «زيت» هو المقابل العربي الطبيعي، ولا يلزم تخصيصه بزيت الزيتون في هذا السياق.
- source_word: ἤλειψας / ἤλειψεν
  choice: تمسح / مسحت
  rationale: الفعل ἀλείφω يدل على دهن الجسد أو مسحه بزيت أو طيب. «مسح» واضح وطبيعي هنا، ويحافظ على الفعل نفسه في طرفي المقابلة من غير أن يحمّله معنى تكريسيًا غير لازم.
- source_word: τὴν κεφαλήν μου
  choice: رأسي
  rationale: نقل مباشر للمفعول به مع ضمير المتكلم.
- source_word: αὕτη δὲ
  choice: لكنها
  rationale: تحافظ على المقابلة المؤكدة بين تقصير المخاطَب وفعل المرأة، مع إحالة طبيعية إلى المرأة الحاضرة.
- source_word: μύρῳ
  choice: بطيب
  rationale: μύρον هو زيت أو مرهم عطري. «طيب» لفظ عربي واضح ودقيق في هذا السياق، ويُظهر المقابلة مع الزيت العادي.
- source_word: τοὺς πόδας μου
  choice: قدميَّ
  rationale: نقل مباشر للجمع اليوناني مع ضمير المتكلم؛ وصيغة المثنى العربية أنسب لأن المقصود القدمان.
theological_decisions:
- issue: المقابلة الاجتماعية في عتاب يسوع
  choice: صياغة المقابلة بوضوح باستعمال «مسح» في الشطرين، من غير إضافة إيحاء بطقس تكريس رسمي.
  alternative: استعمال «دهنت» أو «مسحت بالزيت»، أو لفظ ذي حمولة طقسية أقوى.
  rationale: السياق يقابل بين عدم إكرام المضيف ليسوع وبين إكرام المرأة البالغ له. اللفظ المختار يحفظ دلالة الفعل ولا يفرض تفسيرًا أسراريًا أو مسيانيًا زائدًا على النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. قُدِّم «أما أنت» لإبراز المقابلة الكامنة في ترتيب النص اليوناني، واستُعملت صيغة المثنى «قدميَّ» وفق الأسلوب العربي الطبيعي. وُضعت علامة الحاشية بعد «بطيب» لأنها تتعلق بالبدائل المعجمية لـ μύρον.
