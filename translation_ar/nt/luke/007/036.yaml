  verdict: revise
  source_fidelity: ينقل النص الفعل الناقص Ἠρώτα بعبارة «كان ... يطلب»، ويحفظ معنى الغاية في «أن يأكل معه»، ويعبّر «اتكأ للطعام» بأمانة عن κατεκλίθη في سياق الوجبة. لكن انتقال الفاعل في «فدخل بيت الفريسي» ملتبس عربيًا؛ إذ قد يُفهم أن الفريسي المذكور هو الذي دخل بيته، بينما الفاعل في اليونانية هو يسوع المشار إليه بالضمير αὐτόν.
  naturalness: الفصحى سليمة عمومًا. واستعمال «أحد الفريسيين» أيسر وأفصح من «واحد من الفريسيين» في هذا السرد. وإظهار اسم «يسوع» عند انتقال الفاعل يجعل التسلسل واضحًا للقارئ العربي دون زيادة في المعنى.
  terminology: «الفريسيين» و«اتكأ للطعام» مناسبان. تُعدَّل الحاشية الثقافية لتقتصر على عادة الاتكاء عند الطعام، من غير توصيف الوجبة بأنها «وليمة رسمية»، إذ لا يقتضي النص هذا التحديد.
  issues:
