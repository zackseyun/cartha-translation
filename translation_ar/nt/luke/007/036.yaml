base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: ar
  text: وكان أحدُ الفريسيين يطلب منه أن يأكل معه[a]، فلما دخل يسوع بيتَ الفريسي اتكأ للطعام[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان يسأله أن يأكل معه».'
    reason: lexical_alternative
  - marker: b
    text: أي اتخذ الهيئة المعتادة لتناول الطعام آنذاك، إذ كانوا يتكئون بدلًا من الجلوس منتصبين.
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: كان ... يطلب
  rationale: صيغة الماضي الناقص تدل على فعل مستمر أو متكرر في الماضي؛ وهذا التعبير يحفظ الجانب الفعلي دون أن يحوّل الطلب صراحة إلى «دعوة».
- source_word: δέ
  choice: الواو في «وكان»
  rationale: أداة ربط سردية خفيفة، فنُقلت بواو الاستئناف من غير إقحام ظرف زمان مثل «الآن».
- source_word: τις ... τῶν Φαρισαίων
  choice: واحد من الفريسيين
  rationale: ينقل تركيب التبعيض بعبارة عربية طبيعية وواضحة.
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: أن يأكل معه
  rationale: يحفظ تركيب الغاية أو مضمون الطلب قريبًا من اليونانية، مع أن السياق يفيد الدعوة إلى الطعام.
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: فدخل بيت الفريسي
  rationale: الفعل المشارك الأوريستي يسبق الفعل الرئيس زمنيًا؛ والفاء تنقل تعاقب الحدثين طبيعيًا، و«بيت» مقابل مباشر لـ οἶκος.
- source_word: κατεκλίθη
  choice: اتكأ للطعام
  rationale: يدل في سياق الوليمة على اتخاذ هيئة الاتكاء المعتادة عند الأكل، لا مجرد الجلوس؛ وإضافة «للطعام» توضح المعنى السياقي بإيجاز.
