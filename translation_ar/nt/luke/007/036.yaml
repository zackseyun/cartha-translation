    rationale: الفاعل الظاهر السابق هو «أحد الفريسيين»، ولذلك قد تعود الواو/الفاء في العربية عليه. أما اليونانية فضمير المفعول في البداية وسياق السرد يحددان أن الداخل والمتكئ هو يسوع.
