  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: ar
  text: 'جاء ابن الإنسان يأكل ويشرب، فتقولون: «انظروا! إنه رجل أكول وسكير، وصديق لجباة الضرائب والخاطئين!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، أقرب إلى اللفظ: «هوذا رجل، أكول وشارب خمر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: جاء
  rationale: الفعل اليوناني في صيغة التام يدل على المجيء بوصفه واقعًا قد تحقق؛ والماضي «جاء» هو التعبير العربي الطبيعي هنا، من غير إثقال العبارة بمحاولة نقل الأثر الزمني حرفيًا.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الصياغة العربية المألوفة للقب الذي يستخدمه يسوع عن نفسه، وتحفظ طابعه اللقبي وإيحاءاته الكتابية من غير تفسير زائد.
- source_word: ἐσθίων καὶ πίνων
  choice: يأكل ويشرب
  rationale: تنقل اسما الفاعل الدالين على الكيفية أو المصاحبة بأسلوب عربي واضح ومباشر.
- source_word: λέγετε
  choice: فتقولون
  rationale: تحفظ المضارع والخطاب المباشر، وتصل الجملة بما قبلها اتصالًا طبيعيًا يبرز المقابلة.
- source_word: Ἰδοὺ
  choice: انظروا!
  rationale: تؤدي قوة التنبيه والتعجب في اليونانية بلغة عربية حديثة غير مهجورة.
- source_word: ἄνθρωπος
  choice: رجل
  rationale: إثبات اللفظة يحافظ على البنية الظاهرة للنص اليوناني، وهو طبيعي في العربية ضمن هذا الاتهام.
- source_word: φάγος
  choice: أكول
  rationale: لفظ عربي موجز يحمل معنى الإفراط في الأكل والنبرة التحقيرية المقصودة في الاتهام.
- source_word: οἰνοπότης
  choice: مدمن خمر
  rationale: ينقل القوة الذمية للفظ في السياق إلى العربية المعاصرة، بخلاف «شارب خمر» التي قد تبدو وصفًا محايدًا؛ وتوضح الحاشية البديل الأقرب حرفيًا.
- source_word: φίλος
  choice: صديق
  rationale: ترجمة مباشرة تحفظ وصف العلاقة الاجتماعية الذي يستعمله الخصوم على سبيل الاتهام.
- source_word: τελωνῶν
  choice: جباة الضرائب
  rationale: تعبير عربي حديث واضح للمهنة التي يشير إليها اللفظ اليوناني.
- source_word: ἁμαρτωλῶν
  choice: الخاطئين
  rationale: يحفظ الوصف الديني والاجتماعي الذي يطلقه المتكلمون على هذه الفئة، من غير إعادة تفسيره.
theological_decisions:
- issue: ترجمة لقب ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: تحفظ الصياغة المختارة اللقب كما يرد في التقليد الكتابي وإيحاءاته المحتملة، ولا تختزله في تعبير تفسيري قد يطمس توتره الدلالي.
- issue: حدة الاتهامين φάγος وοἰνοπότης
  choice: رجل أكول ومدمن خمر
  alternative: رجل نهم وشارب خمر
  rationale: السياق ينقل افتراءً عدائيًا لا حكمًا يقره النص. لذلك حُفظت حدة الإهانة في العربية، مع بيان الصياغة الحرفية للفظ الثاني في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «انظروا» بدل «هوذا» لتجنب الأسلوب المهجور، مع إبقاء نبرة الاتهام الحادة وبنية القول المباشر. وُضعت علامة الحاشية بعد الاقتباس كله، وهي تشرح البديل الحرفي للفظ «مدمن خمر».
