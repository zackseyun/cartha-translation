source:
  edition: SBLGNT
  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: ar
  text: ولمّا أتمَّ كلامه كلَّه على مسامع الشعب[a]، دخل كفرناحوم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «إلى مسامع الشعب»، أي بحيث يسمعه الشعب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: ولمّا
  rationale: تؤدي هنا معنى زمنيًا يربط اكتمال الكلام بدخول كفرناحوم، لا معنى سببيًا.
- source_word: ἐπλήρωσεν
  choice: أتمَّ
  rationale: الفعل في هذا التركيب مع «الكلام» يدل على إكمال القول والفراغ منه، لا على الملء الحرفي.
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: كلامه كلَّه
  rationale: صياغة عربية طبيعية تحفظ معنى الشمول وضمير الملكية في الأصل؛ و«الأقوال» ترجمة حرفية ممكنة لكنها أقل سلاسة هنا.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: على مسامع الشعب
  rationale: تعبير عربي مألوف يحفظ دلالة أن الشعب كان يسمع الكلام، بدل النقل الحرفي غير الطبيعي «إلى آذان الشعب».
- source_word: λαοῦ
  choice: الشعب
  rationale: يحفظ المعنى الجمعي العام للفظ اليوناني من غير تضييقه إلى «الجمهور» أو «الحشد».
- source_word: εἰσῆλθεν
  choice: دخل
  rationale: مقابل مباشر وموجز للفعل الذي يفيد الدخول إلى المكان المذكور.
- source_word: Καφαρναούμ
  choice: كفرناحوم
  rationale: الصيغة العربية الشائعة لاسم الموضع.
theological_decisions: []
