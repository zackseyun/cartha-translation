  source_fidelity: 'المعنى العام أمين للنص اليوناني: يسوع يمضي مع القوم، وقائد المئة يرسل أصدقاء حين لم يكن يسوع بعيدًا عن البيت، ويظهر تواضعه وطلبه ألا يكلّف يسوع نفسه عناء الدخول. لكن «أصدقاء يقولون له» تجعل الأصدقاء، في القراءة العربية المباشرة، هم القائلين، بينما يربط النص اليوناني «قائلًا له» بقائد المئة؛ لذا يلزم رفع هذا الالتباس.'
