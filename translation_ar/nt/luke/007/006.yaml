  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: ar
  text: 'فذهب يسوع معهم. ولما صار غير بعيد عن البيت، أرسل إليه قائدُ المئة أصدقاءَ، قائلًا له: «يا رب[a]، لا تُتعِب نفسك، لأني لستُ أهلًا[b] لأن تدخل تحت سقفي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «يا سيدي». اليونانية: «يا رب» (κύριε)، وقد تُستعمل خطابَ احترام، وقد تدل أيضًا على الإقرار بسلطان يسوع.'
    reason: alternative_reading
  - marker: b
    text: أو «جديرًا» أو «كفؤًا». يمكن أن تدل الكلمة اليونانية على الأهلية أو الكفاية؛ وهي هنا تعبّر عن تواضع قائد المئة أمام يسوع.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: فذهب
  rationale: ينقل حركة يسوع في سياق السرد بعبارة عربية طبيعية، مع أن صيغة الماضي الناقص اليونانية قد تفيد أنه كان في طريقه.
- source_word: σὺν αὐτοῖς
  choice: معهم
  rationale: ترجمة مباشرة تحفظ معنى المصاحبة.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: ولما صار غير بعيد عن البيت
  rationale: يحفظ تركيب «غير بعيد» الوارد في اليونانية، ويؤدي وظيفة العبارة الظرفية الدالة على الزمن والحال بأسلوب عربي واضح.
- source_word: ἔπεμψεν φίλους
  choice: أرسل ... أصدقاء
  rationale: يحافظ على دلالة φίλους بوصفهم أصدقاء، من غير إضافة «بعض» التي لا يقتضيها النص.
- source_word: ὁ ἑκατοντάρχης
  choice: قائد المئة
  rationale: تعبير عربي مألوف ودقيق للرتبة العسكرية الرومانية.
- source_word: Κύριε
  choice: يا رب
  rationale: يحفظ اللقب اليوناني وما يحتمله من خطاب احترام ومن إقرار بسلطان يسوع، دون حسم مقدار الدلالة اللاهوتية في هذا الموضع.
- source_word: μὴ σκύλλου
  choice: لا تُتعِب نفسك
  rationale: تعبير عربي طبيعي ينقل معنى عدم تكليف المخاطَب مشقة أو عناء.
- source_word: ἱκανός εἰμι
  choice: لستُ أهلًا
  rationale: «أهلًا» تؤدي معنى الجدارة أو الكفاية في هذا السياق، وتحفظ نبرة تواضع قائد المئة.
- source_word: ἵνα ... εἰσέλθῃς
  choice: لأن تدخل
  rationale: ينقل مضمون الأمر الذي لا يرى قائد المئة نفسه أهلًا له في تركيب عربي موجز وواضح.
- source_word: ὑπὸ τὴν στέγην μου
  choice: تحت سقفي
  rationale: يحفظ الصورة الملموسة والتعبير المجازي عن دخول البيت كما في الأصل.
theological_decisions:
- issue: دلالة κύριος في خطاب قائد المئة ليسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: قد تكون الكلمة خطاب احترام، وقد تتضمن أيضًا اعترافًا بسلطان يسوع. ترجمة «يا رب» تحفظ هذا الاتساع الدلالي، وتوضح الحاشية البديل الممكن من غير فرض اعتراف مسياني مكتمل.
- issue: دلالة ἱκανός على الجدارة أو الكفاية
  choice: لستُ أهلًا
  alternative: لستُ جديرًا / لستُ كفؤًا
  rationale: السياق يبرز تواضع قائد المئة، لكن اللفظ اليوناني يحتمل معنى الكفاية أو الأهلية كذلك؛ لذلك اختير تعبير عربي يتسع لهذين الجانبين مع بيان البدائل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت صورتا «غير بعيد» و«تحت سقفي» لقربهما من الأصل وسلامتهما في العربية، ووُضعت علامتا الحاشيتين مباشرة بعد اللفظين اللذين تشرحانهما.
