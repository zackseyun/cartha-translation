  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: ar
  text: 'وبدأ الذين كانوا متكئين معه عند المائدة يقولون فيما بينهم[a]: «مَن هذا الذي يغفر حتى الخطايا؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يقولون في أنفسهم». قد يدل التعبير اليوناني على حديث داخلي أو على كلام متبادل بين الضيوف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: بدأ
  rationale: يحفظ معنى الشروع في الفعل الذي تفيده صيغة ἄρχω مع المصدر، وهو تعبير عربي طبيعي وواضح.
- source_word: οἱ συνανακείμενοι
  choice: المتكئون معه على المائدة
  rationale: ينقل هيئة تناول الطعام في ذلك العصر، ويُظهر معنى المشاركة الذي تفيده السابقة συν-، مع توضيح سياق المائدة من دون تحويل التعبير إلى مجرد «الجالسين».
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: يقولون فيما بينهم
  rationale: يحفظ الاحتمال بأن الكلام دار بين الضيوف، مع بقاء إمكان أن يكون حديثًا خافتًا أو داخليًا؛ وتوضح الحاشية الغموض الأصيل في التعبير اليوناني.
- source_word: Τίς οὗτός ἐστιν
  choice: مَن هذا
  rationale: يحافظ على إيجاز السؤال وحدّته، ولا يضيف كلمة «الرجل» غير الموجودة في اليونانية.
- source_word: καὶ
  choice: حتى
  rationale: استُعملت «حتى» هنا استعمالًا تصاعديًا للتعبير عن دهشة المتكلمين من بلوغ فعله حد غفران الخطايا، بدل المعنى الإضافي المحايد «أيضًا».
- source_word: ἁμαρτίας ἀφίησιν
  choice: يغفر الخطايا
  rationale: هذا هو المقابل العربي الواضح والمستقر للتعبير اليوناني في سياق الصفح عن الخطايا، ويحفظ دلالته اللاهوتية من غير شرح زائد.
theological_decisions:
- issue: دلالة سلطان يسوع على غفران الخطايا
  choice: 'الإبقاء على سؤال الضيوف كما هو: «مَن هذا الذي يغفر حتى الخطايا؟»'
  alternative: تفسير السؤال داخل النص بإضافة بيان عن هوية يسوع أو مصدر سلطانه
  rationale: النص يثير سؤالًا ذا دلالة مسيانية ولا يقدّم في هذه الآية جوابًا تفسيريًا صريحًا؛ لذلك تُحفظ الدهشة والتوتر اللاهوتي من غير حسمهما بإضافة عقائدية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أبقيت صورة الاتكاء على المائدة لما لها من قيمة سياقية، واستُخدم «فيما بينهم» في المتن مع حاشية تحفظ الاحتمال الآخر في الأصل.
