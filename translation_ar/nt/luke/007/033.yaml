base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: ar
  text: 'لِأَنَّ يُوحَنَّا الْمَعْمَدَانَ قَدْ جَاءَ لَا يَأْكُلُ خُبْزًا وَلَا يَشْرَبُ خَمْرًا، فَتَقُولُونَ: «بِهِ شَيْطَانٌ»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أكثر اصطلاحية: «إنه ممسوس بشيطان».'
    reason: بديل تعبيري يوضح المعنى المقصود من العبارة اليونانية المباشرة.
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: قَدْ جَاءَ
  rationale: ينقل صيغة الماضي التام اليونانية مع دلالتها على حدث وقع وبقي حاضر الصلة بالسياق.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تفيد تعليل الكلام السابق، وهي صياغة عربية طبيعية وواضحة هنا.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: يُوحَنَّا الْمَعْمَدَانَ
  rationale: اللقب العربي المألوف للشخصية التاريخية، ويحافظ على صلة اللقب بفعل المعمودية.
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: لَا يَأْكُلُ خُبْزًا وَلَا يَشْرَبُ خَمْرًا
  rationale: يحافظ على الصورة الملموسة في النص، ولا يعمم ἄρτον إلى «طعام»، مع تعبير عربي طبيعي عن نهجه النسكي.
- source_word: λέγετε
  choice: فَتَقُولُونَ
  rationale: المضارع يلائم قول المخاطَبين المتكرر أو المميز لموقفهم، والفاء تصل النتيجة بما قبلها في العربية.
- source_word: Δαιμόνιον ἔχει
  choice: بِهِ شَيْطَانٌ
  rationale: تعبير عربي مفهوم يحافظ على البنية المباشرة للاتهام، من غير تحويلها في المتن إلى صياغة تفسيرية مثل «ممسوس».
theological_decisions:
- issue: دلالة δαιμόνιον في الاتهام الموجَّه إلى يوحنا
  choice: شَيْطَانٌ
  alternative: رُوحٌ نَجِسٌ
  rationale: اللفظة هنا δαιμόνιον لا التعبير اليوناني المقابل لـ«روح نجس»، ولذلك لا ينبغي توحيد المصطلحين. «شيطان» هو المقابل العربي الكتابي الواضح في هذا السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على «خبزًا» و«خمرًا» بوصفهما لفظين ملموسين في الأصل، وعلى الاتهام المباشر «به شيطان». وُضع رمز الحاشية بعد العبارة التي تشرحها.
