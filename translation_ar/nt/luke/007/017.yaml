  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: ar
  text: وانتشر هذا الخبر عنه في اليهودية كلها وفي المنطقة المحيطة بها كلها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذا النبأ عنه» أو «هذا الكلام عنه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: انتشر
  rationale: الفعل يعني حرفيًا «خرج»، لكنه مع الخبر يدل في هذا السياق على ذيوعه وانتشاره؛ و«انتشر» هو التعبير العربي الطبيعي الذي ينقل الصورة المقصودة.
- source_word: ὁ λόγος οὗτος
  choice: هذا الخبر
  rationale: λόγος هنا هو الخبر أو الحديث المتداول عن عمل يسوع، لا «كلمة» مفردة؛ لذا يلائم السياق «هذا الخبر»، مع إثبات البدائل الممكنة في الحاشية.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: في اليهودية كلها
  rationale: ينقل هذا التعبير شمول انتشار الخبر في أنحاء اليهودية بلغة عربية واضحة، من غير تحويل حرف الجر إلى معنى مكاني أدق مما يقتضيه الأصل.
- source_word: περὶ αὐτοῦ
  choice: عنه
  rationale: ترجمة موجزة وطبيعية لحرف الجر περί مع المضاف إليه، وتشير بحسب السياق إلى يسوع.
- source_word: πάσῃ τῇ περιχώρῳ
  choice: في المنطقة المحيطة بها كلها
  rationale: περίχωρος تدل على الناحية أو المنطقة المحيطة. أُضيف الضمير «بها» لبيان الارتباط باليهودية طبيعيًا في العربية، و«كلها» تحفظ معنى الشمول.
- source_word: καὶ ... καὶ
  choice: و... و
  rationale: تكرار الواو يحفظ التراكم والتنسيق البسيط بين المجالين الجغرافيين كما في اليونانية.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «انتشر» بدل الترجمة الحرفية «خرج» لأن العربية تعبّر به طبيعيًا عن ذيوع الخبر، مع إبقاء تعدد دلالة λόγος في الحاشية.
