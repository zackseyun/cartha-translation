  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: ar
  text: وكان لأحد قادة المئة عبدٌ كان مريضًا وعلى وشك الموت، وكان عزيزًا عليه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خادم». الكلمة اليونانية هي δοῦλος، وقد تدل على «عبد» أو «خادم» بحسب السياق؛ واختيرت هنا «عبد» للمحافظة على علاقة الاستعباد والتبعية التي يفيدها اللفظ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: لأحد قادة المئة
  rationale: يحفظ التنكير في τινος وعلاقة الاختصاص التي تفيدها صيغة المضاف إليه، بصياغة عربية طبيعية.
- source_word: δέ
  choice: الواو في «وكان»
  rationale: تفيد δέ انتقالًا سرديًا خفيفًا؛ وأدت الواو هذا الربط دون إضافة ظرف زمان غير موجود في الأصل.
- source_word: δοῦλος
  choice: عبد
  rationale: يدل اللفظ في هذا السياق المنزلي القديم على شخص مستعبَد خاضع لسيده، و«عبد» أوضح من «خادم» في حفظ هذه العلاقة.
- source_word: κακῶς ἔχων
  choice: مريض
  rationale: تعبير اصطلاحي يعني أنه في حال صحية سيئة؛ و«مريض» واضحة وطبيعية في السياق.
- source_word: ἤμελλεν τελευτᾶν
  choice: قد أشرف على الموت
  rationale: ينقل دلالة قرب وقوع الموت التي تفيدها μέλλω مع المصدر، بأسلوب عربي مألوف.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: وكان عزيزًا عليه
  rationale: ينقل ἔντιμος معنى علو القيمة والمكانة لدى قائد المئة، من غير حصره في التكريم الرسمي.
theological_decisions:
- issue: ترجمة δοῦλος في سياق الاستعباد المنزلي
  choice: عبد
  alternative: خادم
  rationale: يحفظ «عبد» واقع التبعية والاستعباد الذي يتضمنه اللفظ في هذا السياق، بينما قد توحي «خادم» بعلاقة عمل حرة؛ وأُثبت البديل في الحاشية لبيان المجال الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «قائد المئة» بدل اللفظ المعرَّب الأقل وضوحًا، وحُفظ الانتقال السردي الخفيف بالواو، مع إبقاء تقدير قائد المئة لعبده في عبارة طبيعية لا تبالغ في تفسير نوع العلاقة العاطفية.
