  to: ولمّا اقترب من باب المدينة، إذا بميتٍ يُحمَل إلى خارجها، وكان هذا الميت ابنَ أمّه الوحيد[a]، وكانت هي أرملة، وكان معها جمعٌ كثير من أهل المدينة.
  rationale: التعديل الوحيد هو إظهار أن الابن الوحيد هو الميت المحمول، وهو ما يطابق البناء اليوناني بوضوح أكبر في العربية. حُفظت دلالة المفاجأة، والمبني للمجهول، واستمرار الحدث، وإبراز حال الأم الأرملة، وكون الجمع من أهل المدينة معها.
