  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: ar
  text: ولمّا اقترب من باب المدينة، إذا بميتٍ يُحمَل إلى خارجها، وكان هذا الميت ابنَ أمّه الوحيد[a]، وكانت هي أرملة، وكان معها جمعٌ كثير من أهل المدينة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ابنها الأوحد».'
    reason: بديل معجمي وأسلوبي لـ μονογενὴς υἱός.
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: ولمّا اقترب
  rationale: ينقل العلاقة الزمنية وقوة الانتقال السردي في δέ بعبارة عربية طبيعية، ويحافظ على معنى الاقتراب في ἤγγισεν.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: من باب المدينة
  rationale: تعبير عربي واضح عن اقترابه من بوابة المدينة، مع استعمال «من» الملائم للفعل «اقترب».
- source_word: καὶ ἰδοὺ
  choice: إذا بـ
  rationale: تؤدي «إذا» الفجائية وظيفة ἰδού في لفت الانتباه إلى المشهد المفاجئ، من غير تكلف.
- source_word: ἐξεκομίζετο
  choice: يُحمَل إلى خارجها
  rationale: يحفظ المبني للمجهول ودلالة الماضي الناقص على حدث كان جاريًا، ويبين اتجاه الإخراج من المدينة.
- source_word: τεθνηκώς
  choice: ميت
  rationale: ينقل حالة الشخص الذي مات بإيجاز ووضوح، كما يدل عليها اسم الفاعل التام اليوناني.
- source_word: μονογενὴς υἱός
  choice: الابن الوحيد
  rationale: يدل في هذا السياق العائلي على أنه لم يكن لأمه ابن سواه، وهو التعبير العربي الطبيعي المباشر.
- source_word: τῇ μητρὶ αὐτοῦ
  choice: لأمّه
  rationale: ينقل الداتيف العلاقي الذي يبين أن الميت كان ابنها الوحيد.
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: وكانت هي أرملة
  rationale: إثبات الضمير «هي» يحفظ إبراز αὐτή لحال الأم ويزيد وضوح المأساة من غير إضافة تفسير.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: جمعٌ كثير من أهل المدينة
  rationale: ينقل مقدار ἱκανός بوصفه عددًا ملحوظًا، ويفهم الإضافة إلى المدينة طبيعيًا على أنها جماعة من أهلها.
- source_word: ἦν σὺν αὐτῇ
  choice: كان معها
  rationale: ينقل معنى المصاحبة في σύν بعبارة عربية بسيطة ودقيقة.
theological_decisions:
- issue: دلالة μονογενής في سياق غير مسياني
  choice: الابن الوحيد
  alternative: ابنها الأوحد
  rationale: السياق عائلي، والكلمة تصف علاقة الابن بأمه الأرملة، فتدل طبيعيًا على أنه ابنها الوحيد. لا ينبغي استيراد دلالة لاهوتية خاصة من مواضع أخرى، مع إثبات البديل الأسلوبي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت «إذا بـ» لإبراز المفاجأة السردية، ووُضع رمز الحاشية بعد العبارة التي تتعلق بها مباشرة.
