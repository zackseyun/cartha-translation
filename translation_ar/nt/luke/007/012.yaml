review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام محفوظ بدقة: الاقتراب من بوابة المدينة، خروج موكب الجنازة، كون الميت الابن الوحيد لأمه الأرملة، ومرافقة جمع كبير لها. لكن تركيب «وكان الابن الوحيد لأمّه» بعد «إذا بميت» أضعف في ربط وصف الابن الوحيد بالميت المحمول، وقد يبدو انتقالًا إلى مبتدأ جديد؛ والصياغة المنقحة تجعل الإحالة صريحة مع الحفاظ على ترتيب المعنى اليوناني.'
  naturalness: اللغة فصحى معاصرة ومفهومة. «إذا بميتٍ يُحمَل» تؤدي وظيفة ἰδού جيدًا، و«إلى خارجها» طبيعية. إعادة صياغة الجملة الوسطى إلى «وكان هذا الميت ابنَ أمّه الوحيد» أوضح وأشد سلاسة في العربية، من غير إطالة تفسيرية.
  terminology: «أرملة» و«الابن الوحيد» و«جمع كثير» اختيارات سليمة ومحايدة. لا توجد هنا دلالة مسيانية خاصة لـ μονογενής؛ ويظل «الوحيد» الأنسب في السياق العائلي. الحاشية تقدم بديلًا أسلوبيًا مقبولًا.
  issues:
  - severity: low
    issue: ارتباط وصف «الابن الوحيد» بالميت غير صريح بما يكفي في التركيب الحالي.
    rationale: في اليونانية، «μονογενὴς υἱὸς» وصف للميت الذي كان يُحمَل. أما «وكان الابن الوحيد لأمّه» فقد يُفهم عربيًا كبدء جملة مستقلة ذات مبتدأ جديد. إضافة «هذا الميت» تربط الوصف بمرجعه مباشرة ولا تضيف معنى.
