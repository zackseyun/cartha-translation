id: LUK.7.10
reference: Luke 7:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: ar
  text: وَلَمَّا رَجَعَ الَّذِينَ أُرْسِلُوا إِلَى الْبَيْتِ، وَجَدُوا الْعَبْدَ[a] مُعَافًى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الخادم». اللفظة اليونانية δοῦλος قد تدل على عبدٍ مملوك أو على خادم بحسب السياق.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: وَلَمَّا رَجَعَ
  rationale: اسم فاعل ماضٍ يؤدي وظيفة زمنية سابقة للفعل الرئيس؛ وصيغة «ولمّا رجع» تنقل هذا التعاقب طبيعيًّا في العربية.
- source_word: εἰς τὸν οἶκον
  choice: إِلَى الْبَيْتِ
  rationale: يحافظ على دلالة الحركة نحو المكان من غير أن يضيف معنى «المنزل» بوصفه موطنًا شخصيًّا.
- source_word: οἱ πεμφθέντες
  choice: الَّذِينَ أُرْسِلُوا
  rationale: يحفظ صيغة المبني للمجهول ولا يضيف تسمية تفسيرية مثل «الرسل» أو «الموفدين».
- source_word: εὗρον
  choice: وَجَدُوا
  rationale: المقابل السردي المباشر والطبيعي للفعل εὑρίσκω.
- source_word: τὸν δοῦλον
  choice: الْعَبْدَ
  rationale: «العبد» هو المقابل العربي الموجز الذي يحفظ دلالة التبعية وعدم الحرية المحتملة في δοῦλος، ولا يختزلها في مجرد خدمة مأجورة.
- source_word: ὑγιαίνοντα
  choice: مُعَافًى
  rationale: ينقل كونه في حال صحة وعافية، من غير أن يستبدل الوصف بكلمة «شُفي» التي تصرّح بعملية الشفاء أكثر مما يصرّح به اللفظ اليوناني.
theological_decisions:
- issue: دلالة δοῦλος في خبر الشفاء
  choice: الْعَبْدَ
  alternative: الْخَادِمَ
  rationale: السياق لا يقتضي تخفيف الوضع الاجتماعي إلى مجرد خادم، لذلك حُفظت دلالة العبودية في المتن، مع إثبات البديل السياقي في الحاشية.
translation_notes:
  register: عربية فصحى واضحة وموقّرة، بجملة سردية طبيعية. وُضع رمز الحاشية بعد «العبد» لأنه اللفظ الذي تتعلق به، لا بعد «البيت».
