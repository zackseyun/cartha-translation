  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: ar
  text: 'ولكن اعلموا هذا: لو كان ربُّ البيت يعلم في أية ساعة يأتي اللص، لما ترك بيته يُنقَب[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يُحفَر فيه/يُثقَب». والمقصود نَقْب جدار البيت بالحفر، إذ كان اللصوص قد يدخلون البيوت من خلال جدرانها.'
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: ولكن اعلموا هذا
  rationale: الفعل γινώσκετε أمر حاضر موجَّه إلى الجمع، فتنقله «اعلموا» مباشرة، وتحمل «ولكن» قوة δέ الانتقالية والمقابِلة.
- source_word: ὅτι
  choice: ': لو'
  rationale: تُبيّن النقطتان أن ما بعدها هو مضمون ما ينبغي معرفته، وتفتتح «لو» الشرط الممتنع الملائم للسياق الافتراضي المخالف للواقع.
- source_word: ὁ οἰκοδεσπότης
  choice: ربُّ البيت
  rationale: تعبير عربي طبيعي ومهيب يدل على صاحب السلطة على البيت وأهله، ويحفظ المعنى الاجتماعي للكلمة اليونانية دون حصره في الملكية القانونية.
- source_word: ποίᾳ ὥρᾳ
  choice: في أية ساعة
  rationale: يحفظ التحديد الحرفي للساعة، ويناسب موضوع السهر والاستعداد في السياق.
- source_word: ὁ κλέπτης ἔρχεται
  choice: يأتي اللص
  rationale: يحفظ المضارع اليوناني داخل مضمون المعرفة، وهو طبيعي في العربية بعد «يعرف» من غير حاجة إلى تحويله إلى ماضٍ أو مستقبل.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: لما سمح
  rationale: يؤدي جواب الشرط الممتنع معنى النتيجة المخالفة للواقع، ويعبّر «سمح» بوضوح عن ἀφῆκεν مع المصدر المبني للمجهول.
- source_word: διορυχθῆναι
  choice: بأن يُنقَب
  rationale: يحفظ الصورة المادية المحددة في اليونانية، أي اختراق جدار البيت بالحفر أو النقب، بدل تسطيحها إلى مجرد «اقتحام».
- source_word: τὸν οἶκον αὐτοῦ
  choice: بيته
  rationale: مقابل عربي مباشر وموجز يحفظ الإحالة إلى بيت رب البيت المذكور.
theological_decisions: []
translation_notes:
  register: 'صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «ربّ البيت» بمعناه العربي العام: القائم على البيت وصاحب السلطان فيه. وحُفظت صورة «النقب» الأصلية في المتن، مع شرحها ثقافيًا في الحاشية.'
