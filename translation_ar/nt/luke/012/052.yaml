    rationale: السياق والتركيب اليوناني يدلان على انقسام طرفين متقابلين؛ «ثلاثة ضد اثنين» يحفظ هذا المعنى والتوازي بإيجاز عربي طبيعي.
  - severity: low
    issue: الحاشية تضيف «أو مختلفين فيما بينهم» بوصفه بديلًا لـ«منقسمين».
    rationale: الحاشية الإنجليزية المعتمدة خاصة بـοἶκος، ولا يقتضي διαμεμερισμένοι هذا البديل. «مختلفين» لا يوازي بالضرورة حالة الانقسام المذكورة في الأصل.
