review_pass:
  verdict: revise
  source_fidelity: ينقل المتن الزمن المستقبلي في «من الآن فصاعدًا»، وعدد الأشخاص، وموقعهم في بيت واحد، وحالة الانقسام. لكن «على اثنين/على ثلاثة» ليست التعبير العربي الحديث الواضح عن المعارضة المتبادلة التي تدل عليها ἐπί مع الداتيف هنا؛ و«ضد» أدق وأوضح في هذا السياق.
  naturalness: التركيب فصيح في الجملة، لكن «ثلاثة على اثنين» قد تُفهم على أنها تفوق عددي أو وقوع فوق شيء، لا اصطفافٌ متعارض. كذلك تضم الحاشية بديلًا لـ«منقسمين» لا يسنده مسار التدقيق الإنجليزي ولا يلزم لحفظ غموض الأصل.
  terminology: «بيت» اختيار سليم لـοἶκος مع بيان البديل الاجتماعي في الحاشية. و«منقسمين» مناسب لـδιαμεμερισμένοι، فلا حاجة إلى استبداله بـ«مختلفين»، إذ إن الأخير أضعف وقد يضيّق معنى الانقسام الناتج.
  issues:
