  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: ar
  text: فَمِنَ الآنَ فَصَاعِدًا سَيَكُونُ خَمْسَةٌ فِي بَيْتٍ وَاحِدٍ مُنْقَسِمِينَ[a]، ثَلَاثَةٌ ضِدَّ اثْنَيْنِ، وَاثْنَانِ ضِدَّ ثَلَاثَةٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أهل بيت واحد». فقد تعني الكلمة اليونانية «بيت» أو جماعة الأسرة التي فيه.
    reason: يحفظ البديل المعجمي لـοἶκος دون إدخال بديل غير لازم لـδιαμεμερισμένοι.
lexical_decisions:
- source_word: ἔσονται
  choice: سيكون خمسة
  rationale: صيغة المستقبل من εἰμί، والتركيب العربي مع «سيكون» يقدّم وجود خمسة أشخاص في البيت بصورة طبيعية.
- source_word: γὰρ
  choice: فَـ
  rationale: الفاء تصل هذه العبارة بما قبلها وتحفظ قوتها التفسيرية في سياق الحديث عن الانقسام.
- source_word: ἀπὸ τοῦ νῦν
  choice: من الآن فصاعدًا
  rationale: تعبير عربي واضح يحفظ الدلالة الزمنية الممتدة إلى المستقبل.
- source_word: πέντε
  choice: خمسة
  rationale: نقل مباشر للعدد، والمقصود خمسة أشخاص كما يتضح من السياق.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: في بيت واحد
  rationale: يحفظ المعنى الأساسي لـ οἶκος، مع إبقاء احتمال دلالته على أهل البيت أو الأسرة في الحاشية.
- source_word: διαμεμερισμένοι
  choice: منقسمين
  rationale: اسم مفعول يدل على حالة قائمة نتجت عن الانقسام؛ وتوافق صيغة الجمع العاقل «خمسة» في العربية.
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: ثلاثة على اثنين
  rationale: «على» تؤدي معنى المواجهة والخصومة في هذا التركيب، وتحافظ على التوازي الموجز في الأصل.
- source_word: καὶ δύο ἐπὶ τρισίν
  choice: واثنان على ثلاثة
  rationale: يحفظ التوازي والمقابلة مع العبارة السابقة دون زيادة تفسيرية.
theological_decisions:
- issue: هل يُنقل οἶκος نقلًا حسيًا بمعنى «بيت» أم اجتماعيًا بمعنى «أهل بيت/أسرة»؟
  choice: بيت
  alternative: أهل بيت أو أسرة
  rationale: السياق اللاحق يوضح أن الحديث عن علاقات أسرية، لكن «بيت» يحفظ اتساع اللفظ اليوناني ولا يحسم دلالته الاجتماعية في المتن؛ لذلك ذُكر البديل في الحاشية.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُعمل «من الآن فصاعدًا» لتجنب الأسلوب العتيق، وحُفظ الإيقاع المتوازي في «ثلاثة على اثنين، واثنان على ثلاثة».
