  to: فَمِنَ الآنَ فَصَاعِدًا سَيَكُونُ خَمْسَةٌ فِي بَيْتٍ وَاحِدٍ مُنْقَسِمِينَ[a]، ثَلَاثَةٌ ضِدَّ اثْنَيْنِ، وَاثْنَانِ ضِدَّ ثَلَاثَةٍ.
  rationale: أُبقيت البنية الأساسية واختيار «بيت» و«منقسمين»، إذ يوافقان الأصل ولا يحسمان امتداد οἶκος الاجتماعي في المتن. واستُبدل حرف الجر «على» بـ«ضد» لإظهار المعارضة التي في الأصل بعبارة عربية حديثة واضحة، وقُصرت الحاشية على البديل المعجمي المقصود لـοἶκος.
