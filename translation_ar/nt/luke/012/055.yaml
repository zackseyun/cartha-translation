  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: ar
  text: 'وحين تهبّ ريح الجنوب[a]، تقولون: «سيكون حرٌّ لافح[b]»، ويحدث ذلك.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الجنوب»، أي الريح الجنوبية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حر شديد» أو «قيظ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νότον
  choice: ريح الجنوب
  rationale: قد يدل الاسم على «الجنوب» أو «ريح الجنوب»، ومع اسم الفاعل πνέοντα («تهبّ») يتضح أن المقصود في هذا السياق الجوي هو الريح الآتية من الجنوب.
- source_word: πνέοντα
  choice: تهبّ
  rationale: ينقل الفعل العربي حركة الريح المستمرة بصورة طبيعية، من غير إضافة فعل للرؤية غير موجود في اليونانية.
- source_word: λέγετε
  choice: تقولون
  rationale: المضارع مناسب للعادة العامة المتكررة التي يصفها القول.
- source_word: Καύσων
  choice: حرٌّ لافح
  rationale: يدل اللفظ على حر شديد أو محرق؛ و«حر لافح» تعبير عربي واضح يحفظ شدة المعنى من غير استعمال مصطلح حديث مثل «موجة حر».
- source_word: ἔσται
  choice: سيكون
  rationale: يحافظ على صيغة المستقبل المباشرة في اليونانية، ويأتي طبيعيًا مع خبر الطقس.
- source_word: γίνεται
  choice: فيحدث كذلك
  rationale: يفيد تحقق ما توقعوه، و«كذلك» يوضح أن الواقع يأتي موافقًا للقول من غير زيادة تفسيرية بعيدة.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، محافظة على إيجاز الأصل وتسلسل ملاحظة الطقس والتنبؤ ثم تحققه. وُضعت علامة الحاشية [b] بعد «حر لافح» لأنها تخص لفظ Καύσων، لا بعد «تقولون».
