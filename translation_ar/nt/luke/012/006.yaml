- from: أَلَا تُبَاعُ خَمْسَةُ عَصَافِيرَ بِفَلْسَيْنِ؟ وَمَعَ ذَلِكَ، لَا يُنْسَى وَاحِدٌ مِنْهَا أَمَامَ اللهِ[a][b].
  to: أَلَا تُبَاعُ خَمْسَةُ عَصَافِيرَ بِأَسَّارِيُونَيْنِ؟ وَمَعَ ذَلِكَ، لَا يُنْسَى وَاحِدٌ مِنْهَا أَمَامَ اللهِ[a][b].
  rationale: حُفظت البنية البلاغية والمعنى المعجمي لـ«لا يُنسى»، مع إبقاء «أمام الله» قريبًا من ἐνώπιον τοῦ θεοῦ. والتعديل يقتصر على صون اسم العملة المحدد في الأصل، ثم إتاحة التقريب المفهوم للقارئ في الحاشية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: السؤال البلاغي، وعدد العصافير، وثمنها، وعدم نسيان واحد منها أمام الله. لكن «بفلسين» يستبدل اسم العملة المعيّن في اليونانية بمقابل نقدي عربي عام، مع أن الأصل يسمّي الأسّاريون صراحةً.'
  naturalness: الصياغة فصيحة وواضحة. و«ألا تُباع خمسة عصافير؟» و«لا يُنسى واحد منها أمام الله» سليمتان وطبيعيتان في العربية المعاصرة.
  terminology: '«عصافير» و«تُباع» و«أمام الله» اختيارات مناسبة. والأدق أن يُحافَظ في المتن على اسم العملة «أسّاريون»، وأن تشرح الحاشية أنه نقد روماني نحاسي صغير القيمة. كما أن صياغة الحاشية الحالية «حرفيًا: بأسّاريونين» غير دقيقة من حيث العرض؛ فالمتن اليوناني يعني «بأسّاريونين/بعملتين من الأسّاريون»، لا أن هذه العبارة وحدها شرح حرفي مستقل عن العدد.'
  issues:
  - severity: medium
    issue: استبدال اسم العملة في المتن بـ«فلسين».
    rationale: الأصل اليوناني يذكر ἀσσαρίων، أي الأسّاريون، تحديدًا. و«فلس» تقريب تقريبي مفيد في الشرح، لكنه ليس اسم العملة المذكور في المصدر.
  - severity: low
    issue: الحاشية أ تصف «بأسّاريونين» بأنه النقل الحرفي مع أن المتن لا يستعمله، وتحتاج إلى صياغة أوضح.
    rationale: يلزم أن تبيّن الحاشية أن الأسّاريون هو اسم العملة الرومانية وأن المقصود عملتان منها، من غير إيهام بأن «فلس» هو الاسم الأصلي للعملة.
  revised_text: أَلَا تُبَاعُ خَمْسَةُ عَصَافِيرَ بِأَسَّارِيُونَيْنِ؟ وَمَعَ ذَلِكَ، لَا يُنْسَى وَاحِدٌ مِنْهَا أَمَامَ اللهِ[a][b].
