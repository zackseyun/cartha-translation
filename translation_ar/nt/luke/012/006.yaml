base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: ar
  text: أَلَا تُبَاعُ خَمْسَةُ عَصَافِيرَ بِأَسَّارِيُونَيْنِ؟ وَمَعَ ذَلِكَ، لَا يُنْسَى وَاحِدٌ مِنْهَا أَمَامَ اللهِ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الأسّاريون قطعة نقدية رومانية نحاسية صغيرة القيمة؛ ويمكن تقريب المعنى بـ«فلسين» أو «قطعتين نحاسيتين».
    reason: cultural_note
  - marker: b
    text: 'أو: «لا يُغفَل عن واحد منها في نظر الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: عصافير
  rationale: يدل اللفظ هنا على العصافير، وهو مقابل عربي طبيعي ومحدد، مع إمكان أن يعني اللفظ في نطاق أوسع طيورًا صغيرة.
- source_word: πωλοῦνται
  choice: تُباع
  rationale: صيغة المبني للمجهول في المضارع تُنقل طبيعيًا ودقيقًا بلفظ «تُباع».
- source_word: ἀσσαρίων δύο
  choice: بفلسين
  rationale: «الفلس» اسم عربي قديم لقطعة نقدية نحاسية زهيدة، فيؤدي المعنى الثقافي والاقتصادي بوضوح، مع بيان اسم العملة اليوناني في الحاشية.
- source_word: ἐπιλελησμένον
  choice: يُنسى
  rationale: يحافظ على المعنى المعجمي لحالة النسيان من غير توسيعه إلى تقرير لاهوتي أشمل عن العناية.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: أمام الله
  rationale: ترجمة مباشرة وطبيعية تحفظ صورة الحضور أو الوقوف في نظر الله، بدل تحويلها صراحةً إلى «من الله».
- source_word: οὐχὶ ... ;
  choice: ألا ...؟
  rationale: «ألا» تؤدي السؤال البلاغي الذي يتوقع جوابًا بالإيجاب بأسلوب عربي فصيح طبيعي.
- source_word: καὶ ἓν ἐξ αὐτῶν
  choice: ومع ذلك، لا يُنسى واحد منها
  rationale: يُظهر التعبير المفارقة بين ضآلة ثمن العصافير وعدم نسيان أي واحد منها، مع إبقاء التركيز على الواحد.
theological_decisions:
- issue: لغة تذكّر الله وعنايته
  choice: لا يُنسى واحد منها أمام الله
  alternative: لا يُغفَل عن واحد منها في نظر الله
  rationale: يحافظ «يُنسى» على الدلالة الأقرب للفعل اليوناني، بينما يصون «أمام الله» الصياغة الأصلية ولا يحسمها بتعبير تفسيري مثل «لا يهمله الله».
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فلسان» في المتن لسهولة الفهم، مع حفظ اسم العملة القديمة في الحاشية، وأُبقيت عبارة «أمام الله» لصون الصورة والدلالة المحتملة في الأصل.
