  source_fidelity: 'المعنى منقول بأمانة: الجهل لا يلغي العقوبة المخففة، وتبقى صورة الضرب الصريحة، كما تُحفظ قاعدة ازدياد المساءلة بحسب ما أُعطي أو اؤتمن عليه الشخص. غير أن تحويل فعلي المساءلة في العربية إلى المضارع («يُطلَب»، «يطالبونه») يضعف مقابلة الاستقبال الصريحة في اليونانية.'
