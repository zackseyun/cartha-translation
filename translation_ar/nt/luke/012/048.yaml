reference: Luke 12:48
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: ar
  text: أمّا الذي لم يعلم، لكنه فعل ما يستحق الضرب، فسيُضرَب ضربات قليلة. وكل من أُعطي كثيرًا، سيُطلَب منه كثير؛ ومن ائتمنوه على كثير، سيطالبونه بأكثر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا، يرد الفعلان في العبارة الأخيرة بصيغة جمع الغائب من غير ذكر الفاعل: «ائتمنوه ... سيطالبونه». ويمكن ترجمة الشطر الأخير أيضًا: «ومن استودعوه كثيرًا، سيطلبون منه أكثر».'
    reason: حفظ الفاعل غير المعيّن وبيان بديل لغوي للائتمان والمطالبة
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: الذي لم يعلم
  rationale: ينقل اسم الفاعل المنفي بصياغة عربية طبيعية، ويحفظ معنى غياب المعرفة من غير أن يضيف حكمًا على سبب الجهل أو درجة المسؤولية.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: فعل ما يستحق الضرب
  rationale: يحفظ علاقة الاستحقاق بالعقوبة وصورة الضرب الملموسة، مع تجنب تعبير حرفي ثقيل مثل «أمورًا جديرة بضربات».
- source_word: δαρήσεται ὀλίγας
  choice: فسيُضرَب ضربات قليلة
  rationale: يجعل معنى الفعل δέρω الصريح ظاهرًا، وتنسجم معه «ضربات» المقدرة بوصفها مفعولًا داخليًا مؤنثًا يوافق ὀλίγας.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: كل من أُعطي كثيرًا
  rationale: صياغة عربية واضحة للمبني للمجهول وللمبدأ العام الذي يربط العطية بالمساءلة.
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: يُطلَب منه كثير
  rationale: يحفظ المبني للمجهول ومعنى المطالبة أو المتطلب في هذا السياق، ويقابل παρά مع المضاف إليه بعبارة «منه».
- source_word: ᾧ παρέθεντο πολύ
  choice: من ائتمنوه على كثير
  rationale: يعبر «ائتمنوه» عن إسناد شيء كثير إلى عهدة شخص، ويحفظ الجمع غير المسمى في الفعل اليوناني.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: يطالبونه بأكثر
  rationale: ينقل αἰτέω هنا بمعنى المطالبة الملائمة لسياق الأمانة والمساءلة، مع إبقاء التمييز الأسلوبي عن «يُطلَب منه».
theological_decisions:
- issue: طبيعة صورة العقوبة
  choice: 'الإبقاء على صورة الضرب الملموسة: «فسيُضرَب ضربات قليلة»'
  alternative: استبدال الصورة بلفظ عام مثل «ينال عقابًا قليلًا»، أو تخصيصها بالجلد أو السياط
  rationale: النص يستخدم صورة مَثَلية لعقوبة متفاوتة بحسب المعرفة والمسؤولية؛ لذا لا تُخفف الصورة إلى نتيجة مبهمة ولا تُخصص بأداة أو نظام عقابي لم يذكرهما النص.
- issue: الفاعل في العبارة الأخيرة
  choice: الإبقاء على الجمع غير المسمى في «ائتمنوه» و«يطالبونه»
  alternative: تعيين الفاعل بأنه الله أو الناس
  rationale: الأصل يستعمل فعلين بصيغة جمع الغائب من غير فاعل مصرح به؛ وتعيينه يتجاوز ألفاظ النص ويحسم غموضًا أصيلًا.
- issue: العلاقة بين الجهل والمسؤولية
  choice: ترجمة «لم يعلم» من غير شرح يبرئ الشخص أو يدينه
  alternative: «كان جاهلًا» أو إضافة وصف للجهل بأنه معذور أو متعمد
  rationale: الآية تقر بجهل الشخص مع بقاء قدر من العقوبة، لكنها لا توضح هنا سبب الجهل؛ لذلك ينبغي حفظ هذا التوتر.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «أمّا» لإبراز المقابلة مع الحالة السابقة، و«لكنه» لحفظ التوتر بين عدم العلم وفعل ما يستحق الضرب. أُبقيت صورة الضرب والجمع غير المسمى في الخاتمة، مع تجنب ألفاظ قديمة مثل «جلدات» أو تعيين فاعل لم يذكره الأصل.
