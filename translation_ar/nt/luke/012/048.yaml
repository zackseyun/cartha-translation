  terminology: «الضرب/ضربات»، و«ائتمنوه»، و«يطالبونه» اختيارات مناسبة للسياق. ولا ينبغي تعيين الفاعل المضمر في جمع الغائب بأنه الله أو غيره. الحاشية تحافظ على هذا الغموض، لكن صياغتها تحتاج إلى بيان أدق أن عدم تسمية الفاعل متعلق بالفعلين اليونانيين.
