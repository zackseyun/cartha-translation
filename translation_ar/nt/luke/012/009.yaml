  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: ar
  text: أَمَّا مَنْ يُنْكِرُنِي أَمَامَ النَّاسِ، فَسَيُنْكَرُ أَمَامَ مَلَائِكَةِ اللهِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فَسَيُتَبَرَّأُ مِنْهُ»؛ أمّا المتن فيحافظ على المقابلة اللفظية: «يُنْكِرُنِي ... فَسَيُنْكَرُ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀρνησάμενός με
  choice: أَمَّا مَنْ يُنْكِرُنِي
  rationale: 'تفيد أداة الربط المقابلة مع التركيب الاسمي للمشارِك: «أمّا من»، في موازاة القول السابق. وصيغة المضارع العربية تعبّر طبيعيًا عن المبدأ العام، مع إبقاء المفعول «ني» العائد إلى يسوع.'
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: أَمَامَ النَّاسِ
  rationale: «أمام» تعبير عربي موجز وطبيعي للحضور العلني، و«الناس» تشمل البشر عمومًا في مقابل ملائكة الله، من غير إيحاء بأن المقصود الذكور وحدهم.
- source_word: ἀπαρνηθήσεται
  choice: فَسَيُنْكَرُ
  rationale: يحافظ المبني للمجهول على عدم تسمية الفاعل في اليونانية، كما يحافظ الجذر «نكر» على المقابلة اللفظية بين «ينكرني» و«سينكر».
- source_word: ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ
  choice: أَمَامَ مَلَائِكَةِ اللهِ
  rationale: نقل مباشر وطبيعي للإضافة اليونانية، ويحفظ صورة المشهد السماوي العلني.
theological_decisions:
- issue: هوية الفاعل الضمني في «فَسَيُنْكَرُ»
  choice: إبقاء الفعل مبنيًا للمجهول بلا تعيين للفاعل
  alternative: التصريح بأنه سيُنكر من ابن الإنسان، أو من الله
  rationale: النص اليوناني لا يسمّي فاعل الإنكار. وقد يوحي السياق بفاعل معيّن، لكن التصريح به هنا يحسم ما أبقاه النص ضمنيًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُعملت «أمّا» لإبراز المقابلة مع الآية السابقة، و«الناس» للدلالة العامة على البشر. ضُبطت الكلمات بالشكل لتيسير القراءة، مع إبقاء الغموض المقصود في المبني للمجهول.
