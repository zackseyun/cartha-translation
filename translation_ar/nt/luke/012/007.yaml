  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: ar
  text: بل حتى شعور رؤوسكم قد أُحصيت كلها. فلا تخافوا؛ أنتم أثمن من عصافير كثيرة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: بل حتى
  rationale: 'تنقل أداة الاستدراك مع معنى التصعيد في καί، وتصل الكلام بما قبله: ليست العصافير وحدها موضع عناية، بل حتى شعور الرؤوس محصاة.'
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: شعور رؤوسكم ... كلها
  rationale: صياغة عربية واضحة تحفظ الصورة الحسية وتبرز الشمول الذي تدل عليه πᾶσαι.
- source_word: ἠρίθμηνται
  choice: قد أُحصيت
  rationale: المبني للمجهول مع «قد» ينقل دلالة التمام والنتيجة القائمة في صيغة الماضي التام اليونانية، من غير التصريح بالفاعل الذي يتركه النص ضمنيًا.
- source_word: μὴ φοβεῖσθε
  choice: فلا تخافوا
  rationale: نهي مباشر بصيغة الجمع، وربطه بالفاء يجعل التعليل والطمأنة طبيعيين في العربية من غير تغيير المعنى.
- source_word: πολλῶν στρουθίων
  choice: عصافير كثيرة
  rationale: يحفظ نوع الطائر المذكور في السياق القريب، بدل تعميمه إلى طيور صغيرة.
- source_word: διαφέρετε
  choice: أنتم أثمن من
  rationale: ينقل معنى التفوق في القيمة الذي يقتضيه السياق، بصياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: المقارنة بين قيمة المخاطَبين وقيمة العصافير
  choice: أنتم أثمن من عصافير كثيرة
  alternative: أنتم تفوقون عصافير كثيرة
  rationale: يفهم الفعل διαφέρετε في السياق على أنه تفوق في القيمة ضمن حجة من الأقل إلى الأعظم، من غير توسيع العبارة إلى دعوى فلسفية أبعد من النص.
- issue: الفاعل الضمني في إحصاء الشعور
  choice: قد أُحصيت
  alternative: قد أحصاها الله
  rationale: يحفظ المبني للمجهول في الأصل، مع بقاء الفاعل الإلهي مفهومًا من السياق، ولا يضيف اسمًا غير مصرح به في الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «شعور رؤوسكم» بدل تعبيرات أكثر حرفية وأقل سلاسة، و«أثمن» لنقل المقارنة في القيمة بعبارة مألوفة. لا توجد حواشٍ لازمة لهذه الآية؛ الحاشيتان في طبقة الاستشارة الإنجليزية تبدوان متبادلتين بالنسبة إلى موضعيهما ولا تستندان إلى غموض يحتاجه النص العربي.
