  verdict: revise
  source_fidelity: 'تحتاج الصياغة إلى تصحيح موضع «كلها». في المسودة الحالية «أمم العالم كلها» تجعل الشمول واقعًا على الأمم، بينما «πάντα ταῦτα» يشمل الأشياء المطلوبة. أما بقية عناصر الآية فتنقل اليونانية بأمانة: «أمم العالم» لـτὰ ἔθνη τοῦ κόσμου، و«تسعى وراء» لـἐπιζητοῦσιν، و«أبوكم» بلا إضافة، و«تعلمون/تحتاجون» بحسب المعنى الحاضر.'
