    issue: موضع «كلها» في «أمم العالم كلها».
    rationale: تتعلق πᾶν/πάντα في اليونانية بـ«هذه الأشياء»، لا بـ«الأمم». لذا يلزم أن تكون العربية «هذه الأشياء كلها» كي لا يصبح المعنى أن جميع أمم العالم هي التي تسعى.
