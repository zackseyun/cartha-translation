  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: ar
  text: فَإِنَّ أُمَمَ الْعَالَمِ تَسْعَى وَرَاءَ هَذِهِ الْأَشْيَاءِ كُلِّهَا[a]، أَمَّا أَبُوكُمْ فَيَعْلَمُ أَنَّكُمْ تَحْتَاجُونَ إِلَيْهَا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غير اليهود في العالم». فاللفظ اليوناني يمكن أن يعني «الأمم» أو «غير اليهود».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: هذه الأشياء كلها
  rationale: يشير التركيب إلى الاحتياجات المادية المذكورة في السياق، وتُبقي الصياغة العربية المرجع صريحًا.
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: أمم العالم
  rationale: يحافظ هذا الاختيار على المعنى الأساسي للفظ ἔθνη وعلى اتساع العبارة، من غير حصرها تفسيرًا في غير اليهود.
- source_word: ἐπιζητοῦσιν
  choice: تسعى وراء
  rationale: ينقل معنى الطلب الحثيث والملاحقة الذي يفيده الفعل المركب، بصياغة عربية طبيعية.
- source_word: ὑμῶν ... ὁ πατὴρ
  choice: أبوكم
  rationale: ترجمة مباشرة موجزة، من غير إضافة «السماوي» غير الواردة في النص اليوناني لهذه الآية.
- source_word: οἶδεν
  choice: يعلم
  rationale: للفعل هنا دلالة حاضرة، و«يعلم» هي الصياغة العربية الطبيعية المناسبة.
- source_word: χρῄζετε τούτων
  choice: تحتاجون إليها
  rationale: ينقل المعنى بوضوح في العربية الحديثة، ويعود الضمير صراحة إلى الأشياء المذكورة في صدر الآية.
theological_decisions:
- issue: المقابلة بين سعي أمم العالم وثقة التلاميذ بأبيهم
  choice: الإبقاء على «أمم العالم» و«أبوكم» بلا توسع تفسيري
  alternative: ترجمة ἔθνη بـ«وثنيي العالم» أو إضافة «السماوي» إلى «أبوكم»
  rationale: تحفظ الصياغة المقابلة اللاهوتية في النص من غير تضييق مدلول ἔθνη أو استيراد لفظ من الموضع الموازي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعملت «تسعى وراء» لإظهار قوة الطلب، مع تجنب التراكيب القديمة أو الإضافات التفسيرية.
