  terminology: «أمم العالم» يحفظ اتساع ἔθνη ولا يفرض معنى «غير اليهود». والحاشية تقدم هذا المعنى البديل بوضوح. «أبوكم» مناسب للنص ولا يستورد «السماوي».
  issues:
