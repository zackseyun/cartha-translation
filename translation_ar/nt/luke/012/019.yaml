  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: ar
  text: 'وسأقول لنفسي[a]: «يا نفس، لك خيرات كثيرة مدَّخرة لسنين كثيرة. استريحي، وكلي، واشربي، وافرحي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تدل اللفظة اليونانية هنا على «الذات» أو «الحياة» بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: سأقول
  rationale: صيغة مستقبل من λέγω، ونقلها بالمستقبل الصريح يحافظ على تسلسل كلام الرجل وخطته.
- source_word: ψυχῇ / Ψυχή
  choice: لنفسي / يا نفس
  rationale: تحافظ «النفس» على صورة مخاطبة الإنسان باطنه وعلى تكرار اللفظة اليونانية، من غير أن تجعل الآية تقريرًا تقنيًا عن تكوين الإنسان.
- source_word: ἀγαθὰ
  choice: خيرات
  rationale: لفظة عربية جامعة تناسب في السياق ما جمعه الرجل من محاصيل ومقتنيات نافعة، من غير حصر المعنى في النقود وحدها.
- source_word: κείμενα
  choice: مدَّخرة
  rationale: تفيد أن الخيرات موضوعة ومحفوظة للمستقبل، وهو المقصود من κεῖμαι في سياق التخزين.
- source_word: εἰς ἔτη πολλά
  choice: لسنين كثيرة
  rationale: تنقل مدة الانتفاع المستقبلية بعبارة عربية واضحة وقريبة من تركيب الأصل.
- source_word: ἀναπαύου
  choice: استريحي
  rationale: أمر بالراحة والدعة، وجاء مؤنثًا لمخاطبة «النفس».
- source_word: φάγε
  choice: كلي
  rationale: نقل مباشر لفعل الأمر، مع مراعاة تأنيث المخاطَب في العربية.
- source_word: πίε
  choice: اشربي
  rationale: نقل مباشر لفعل الأمر، مع مراعاة تأنيث المخاطَب في العربية.
- source_word: εὐφραίνου
  choice: افرحي
  rationale: ينقل معنى الفرح والتمتع في صيغة أمر طبيعية، مع إبقاء الحكم الأخلاقي مستفادًا من سياق المثل لا مضافًا إلى اللفظة.
theological_decisions:
- issue: دلالة ψυχή في خطاب الإنسان لنفسه
  choice: النفس
  alternative: الذات أو الحياة
  rationale: السياق يصور الرجل وهو يخاطب باطنه، لا يقدّم تعريفًا مذهبيًا للنفس. وتحفظ «النفس» الصدى الأدبي للفظة مع إبقاء سعتها الدلالية في الحاشية.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة من غير تقليد متكلّف للأساليب القديمة. استُعملت صيغ التأنيث في الأوامر لأن المخاطَب هو «النفس»، وحُفظ تتابع الأوامر القصير في الأصل.
