source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: ar
  text: 'فقال الرب: «فمن هو الوكيل الأمين الحكيم، الذي سيقيمه سيده على خدم بيته ليعطيهم حصة الطعام في وقتها؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: الرب / سيده
  rationale: أُبقي لقب «الرب» في الإشارة السردية إلى يسوع، وجاءت «سيده» داخل صورة المثل للدلالة على صاحب البيت، مع الحفاظ على المجال الدلالي للكلمة اليونانية نفسها.
- source_word: πιστός
  choice: الأمين
  rationale: تفيد الكلمة الثقة بمن أُسندت إليه مسؤولية، و«الأمين» تعبير عربي طبيعي في سياق الوكالة.
- source_word: οἰκονόμος
  choice: الوكيل
  rationale: يدل اللفظ على من اؤتمن على تدبير شؤون بيت أو مُلك، و«الوكيل» يحفظ معنى التفويض والمسؤولية.
- source_word: φρόνιμος
  choice: الحكيم
  rationale: المقصود حكمة عملية وحسن تدبير؛ و«الحكيم» واضحة وشائعة، دون حصر المعنى في مجرد الحذر.
- source_word: καταστήσει
  choice: سيقيمه
  rationale: يفيد وضع الشخص في منصب مسؤولية، و«سيقيمه على» صياغة عربية فصيحة تحافظ على صورة النص.
- source_word: θεραπείας
  choice: خدم بيته
  rationale: تشير هنا إلى جماعة الخدم أو المرافقين الخاضعين لإدارة الوكيل، لا إلى العلاج أو الخدمة بمعناها المجرد.
- source_word: ἐν καιρῷ
  choice: في وقتها
  rationale: تنقل معنى الوقت المناسب أو المعيّن، ويرجع الضمير طبيعيًا إلى حصة الطعام.
- source_word: σιτομέτριον
  choice: حصة الطعام
  rationale: يدل اللفظ على مقدار موزون أو مخصص من القوت، وغالبًا من الحبوب؛ و«حصة الطعام» واضحة وتحفظ فكرة التوزيع المحدد.
theological_decisions:
- issue: تكرار κύριος في الإطار السردي وداخل المثل
  choice: «الرب» ليسوع المتكلم، و«سيده» لصاحب البيت في المثل
  alternative: «الرب» في الموضعين
  rationale: 'الكلمة اليونانية واحدة، لكن اختلاف الصياغة العربية يوضح مستويي الإشارة من غير تغيير معناها: لقب يسوع في السرد، وصاحب السلطة على الوكيل داخل المثل.'
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ الاستفهام المفتوح في اليونانية، واستُعملت ألفاظ مألوفة مثل «الوكيل» و«خدم بيته» و«حصة الطعام» مع إبقاء نبرة المثل ومسؤوليته الإدارية.
