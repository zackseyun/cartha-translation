  source_fidelity: 'المسودة تنقل البنية والمعنى الأساسيين نقلًا أمينًا: المخاطَبون «أصدقائي»، وقتل الجسد، وحدود قدرة القتلة بعد ذلك. لكن فعل الخوف في العربية يحتاج إلى حرف الجر «من» قبل الاسم الموصول ليعبّر صراحة عن متعلَّق الخوف الذي تؤديه ἀπό في اليونانية.'
  naturalness: الأسلوب فصيح وواضح عمومًا. غير أن «لا تخافوا الذين» أقل سلاسةً ودقة من «لا تخافوا من الذين»، كما أن «وبعد ذلك لا يستطيعون أن يفعلوا شيئًا آخر» أيسر وأفصح في سياق بيان العجز عن فعل المزيد.
  terminology: «الجسد» مناسب لـ τὸ σῶμα، و«يا أصدقائي» مناسب لـ τοῖς φίλοις μου، ولا تُدخل الصياغة أي تفسير لاهوتي زائد، مثل ذكر النفس، غير موجود في الآية.
  issues:
