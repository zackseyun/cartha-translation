- from: 'ولكني أقول لكم، يا أصدقائي: لا تخافوا الذين يقتلون الجسد، ثم لا يملكون بعد ذلك أن يفعلوا شيئًا أكثر.'
  to: 'ولكني أقول لكم، يا أصدقائي: لا تخافوا من الذين يقتلون الجسد، وبعد ذلك لا يستطيعون أن يفعلوا شيئًا آخر.'
  rationale: أُضيفت «من» لضبط تعدية فعل الخوف وتمثيل متعلَّق الخوف في الأصل، واستُبدلت العبارة الأخيرة بتعبير عربي طبيعي يحافظ على معنى «لا يملكون/لا يستطيعون فعل شيء إضافي». ولم يُضف أي تحديد بشأن النفس أو ما بعد الموت، لأن النص اليوناني في هذه الآية لا يصرح به.
