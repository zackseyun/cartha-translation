  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: ar
  text: 'ولكني أقول لكم، يا أصدقائي: لا تخافوا من الذين يقتلون الجسد، وبعد ذلك لا يستطيعون أن يفعلوا شيئًا آخر.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: ولكني أقول
  rationale: تفيد δέ انتقالًا فيه مقابلة خفيفة؛ فحافظت «ولكني» على هذا التحول في الخطاب من غير مبالغة في شدة التضاد.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: لكم، يا أصدقائي
  rationale: العبارة في صيغة البدل أو التفسير، إذ يخاطب يسوع السامعين بوصفهم أصدقاءه؛ وتحفظ الصياغة الضمير والنداء الودّي معًا.
- source_word: μὴ φοβηθῆτε
  choice: لا تخافوا
  rationale: صيغة نهي، و«لا تخافوا» هي المقابل العربي المباشر والطبيعي.
- source_word: ἀπὸ τῶν ἀποκτεινόντων
  choice: الذين يقتلون
  rationale: تدل ἀπό بعد فعل الخوف على متعلَّق الخوف، واسم الفاعل الحاضر هنا عامّ الدلالة، لذلك نُقل بصلة موصول تصف من يقتلون.
- source_word: τὸ σῶμα
  choice: الجسد
  rationale: المقصود هو الجسد المادي، وهذه هي الصياغة العربية الواضحة والمناسبة للسياق.
- source_word: καὶ μετὰ ταῦτα
  choice: ثم ... بعد ذلك
  rationale: العبارة زمانية وتشير إلى ما يلي قتل الجسد؛ واستعمال «ثم» مع «بعد ذلك» يوضح التعاقب طبيعيًا في العربية.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: لا يملكون ... أن يفعلوا شيئًا أكثر
  rationale: تحفظ العبارة صورة النص التي تعبّر حرفيًا عن عدم امتلاكهم مزيدًا مما يفعلونه، وتبقي περισσότερόν τι بمعنى «شيئًا أكثر» من غير إضافة تفسيرية.
theological_decisions:
- issue: حدود قدرة البشر بعد قتل الجسد
  choice: يقرر النص أن قاتلي الجسد لا يملكون أن يفعلوا بعد ذلك شيئًا أكثر.
  alternative: التصريح بأنهم لا يستطيعون قتل النفس.
  rationale: لا تذكر الآية النفس صراحة، وإن كان السياق اللاحق يبيّن المقابلة مع سلطان الله؛ لذلك لم تُستورد إلى هذه الآية عبارة تفسيرية من الآية التالية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُخدم النداء «يا أصدقائي» لإظهار حرارة المخاطبة، مع الحفاظ على ترتيب المعنى وحدود ما يصرّح به النص اليوناني.
