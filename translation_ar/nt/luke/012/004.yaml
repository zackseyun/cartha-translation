    rationale: تتطلب العربية المعيارية عادةً «خاف من»، كما أن ἀπό في الأصل تحدد من يقع الخوف منه. إضافة «من» تصحح التركيب وتظهر العلاقة الدلالية من دون زيادة في المعنى.
  - severity: low
    issue: «لا يملكون ... أن يفعلوا شيئًا أكثر» ترجمة مفهومة لكنها أقل طبيعية في العربية المعاصرة.
    rationale: «لا يستطيعون أن يفعلوا شيئًا آخر» تنقل القيد نفسه، أي عدم القدرة على فعل شيء إضافي بعد قتل الجسد، بصياغة عربية أوضح.
