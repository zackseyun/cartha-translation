base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: ar
  text: وحتى إن جاء في نوبة الحراسة الثانية من الليل[a]، أو حتى في الثالثة، ووجدهم على هذه الحال، فطوبى لأولئك الخدم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: نوبة الحراسة الثانية من الليل، أو نوبة الحراسة الثالثة؛ فقد كان الليل يُقسَّم إلى نوبات للحراسة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «فطوبى لأولئك». والمقصود هم الخدم المذكورون في السياق السابق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: وحتى إن ... أو حتى
  rationale: ينقل هذا التعبير معنى الشرط الاحتمالي ذي النبرة التنازلية، ويحافظ على توكيد الأداة بتكرار «حتى» مع الفترتين.
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: نوبة الحراسة الثانية من الليل ... الثالثة
  rationale: تشير φυλακή هنا إلى إحدى فترات تقسيم الليل للحراسة. وإظهار «من الليل» يزيل الالتباس للقارئ المعاصر، مع عدم الحاجة إلى تكرارها بعد «الثالثة».
- source_word: ἔλθῃ
  choice: جاء
  rationale: صيغة الماضي العربية بعد «إن» تؤدي بصورة طبيعية معنى الاحتمال المستقبلي غير المحدد في صيغة الشرط اليونانية.
- source_word: εὕρῃ οὕτως
  choice: وجدهم على هذه الحال
  rationale: تشير οὕτως إلى حال الخدم الموصوفة في السياق السابق، وإضمار المفعول في اليونانية يُعبَّر عنه طبيعيًا في العربية بضمير الجمع.
- source_word: μακάριοί
  choice: طوبى
  rationale: «طوبى» تعبير عربي كتابي راسخ يدل على الغبطة والحظوة، ويحفظ الوزن الديني للكلمة دون اختزالها في مجرد السعادة النفسية.
- source_word: ἐκεῖνοι
  choice: أولئك الخدم
  rationale: اللفظ اليوناني يعني حرفيًا «أولئك»، ومرجعه في السياق المباشر هو الخدم المذكورون في الآيات السابقة؛ وإظهار المرجع يحقق الوضوح دون إضافة معنى جديد.
theological_decisions:
- issue: إظهار مرجع اسم الإشارة ἐκεῖνοι
  choice: أولئك الخدم
  alternative: أولئك
  rationale: النص اليوناني يستعمل اسم إشارة وحده، لكن مرجعه الواضح هم الخدم في السياق المباشر. أُظهر المرجع في المتن مع توثيق الحرفية في الحاشية، من غير حسم أي مسألة لاهوتية إضافية.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، بنبرة كتابية كريمة. استُخدم «نوبة الحراسة» بدل المصطلح الأقدم «الهزيع» لسهولة الفهم، وأُبقي التوكيد المتكرر في κἂν ... κἂν بواسطة «حتى».
