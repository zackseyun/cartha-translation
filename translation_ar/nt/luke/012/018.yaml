  source_fidelity: 'النص العربي ينقل بدقة تسلسل القول والخطة المستقبلية في اليونانية: هدم المخازن، وبناء مخازن أكبر، ثم جمع الحبوب والممتلكات فيها. ويحافظ على عدم إضافة ضمير ملكية إلى «الحبوب»، إذ إن النص اليوناني لا يصرح به معها، مع أن السياق يفهمه.'
