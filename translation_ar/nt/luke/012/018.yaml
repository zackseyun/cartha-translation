  text: καὶ εἶπεν· Τοῦτο ποιήσω· καθελῶ μου τὰς ἀποθήκας καὶ μείζονας οἰκοδομήσω, καὶ συνάξω ἐκεῖ πάντα ⸂τὸν σῖτον⸃ καὶ τὰ ἀγαθά μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: ar
  text: 'فقال: «سأفعل هذا: أهدم مخازني[a] وأبني مخازن أكبر منها، وأجمع هناك الحبوب كلها[b] وممتلكاتي[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مستودعاتي».
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تشير الكلمة اليونانية إلى «القمح» على وجه أخص في بعض السياقات.
    reason: lexical_alternative
  - marker: c
    text: أو «خيراتي» أو «أموالي».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: سأفعل هذا
  rationale: صياغة عربية مباشرة تحفظ الإشارة الاستباقية المؤكدة إلى الخطة التي سيذكرها.
- source_word: καθελῶ
  choice: أهدم
  rationale: ينقل بوضوح فعل إزالة الأبنية القائمة، وهو مناسب لسياق المخازن.
- source_word: ἀποθήκας
  choice: مخازني
  rationale: «مخازن» لفظ طبيعي واسع الدلالة لمواضع حفظ المحصول، من غير حصرها في نوع معماري بعينه.
- source_word: μείζονας οἰκοδομήσω
  choice: وأبني مخازن أكبر منها
  rationale: إعادة الاسم المحذوف مفهومة في العربية، و«أكبر منها» تحفظ صيغة المقارنة.
- source_word: συνάξω ἐκεῖ
  choice: وأجمع هناك
  rationale: يحفظ المعنى الأساسي للجمع وتحديد موضعه من غير تفسير زائد بمعنى الادخار.
- source_word: πάντα τὸν σῖτον
  choice: الحبوب كلها
  rationale: «الحبوب» تنقل المعنى العام لـσῖτος، وترتيب «كلها» عربي طبيعي. لم تُضف ملكية غير مصرّح بها في هذه العبارة اليونانية.
- source_word: τὰ ἀγαθά μου
  choice: ممتلكاتي
  rationale: ينقل المعنى المادي الواسع للأشياء النافعة التي يملكها المتكلم، من غير تضييقه إلى المال وحده.
theological_decisions: []
