  yaml_path: translation/nt/luke/012/017.yaml
  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: ar
  text: 'فكان يفكّر في نفسه، قائلًا: «ماذا أفعل[a]، إذ ليس لديّ مكان أجمع فيه غلالي[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما عساي أن أفعل؟»'
    reason: بديل أسلوبي للسؤال التداولي في الأصل اليوناني.
  - marker: b
    text: 'أو: «محاصيلي».'
    reason: بديل معجمي لعبارة τοὺς καρπούς μου التي تدل هنا على الناتج الزراعي.
lexical_decisions:
- source_word: διελογίζετο
  choice: أخذ يفكّر
  rationale: ينقل صيغة الماضي الناقص بوصفها عملية تفكير ومداولة داخلية مستمرة، بلغة عربية طبيعية.
- source_word: ἐν ἑαυτῷ
  choice: في نفسه
  rationale: يوضح أن المداولة كانت باطنية، من غير أن يوحي بالضرورة بأنه نطق بصوت مسموع.
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على تركيب اسم الفاعل الذي يقدّم مضمون حديثه الداخلي.
- source_word: Τί ποιήσω
  choice: ماذا أفعل
  rationale: يؤدي السؤال التداولي بصياغة عربية واضحة ومعاصرة، مع إبقاء معنى الحيرة بشأن التصرف المطلوب.
- source_word: ὅτι
  choice: إذ
  rationale: تفيد هنا التعليل وتربط السؤال بسبب حيرته بإيجاز وفصاحة.
- source_word: οὐκ ἔχω ποῦ
  choice: ليس لديّ مكان
  rationale: صياغة عربية اصطلاحية واضحة لمعنى عدم وجود موضع متاح.
- source_word: συνάξω
  choice: أجمع
  rationale: يحافظ على المعنى الأساسي للفعل، وهو الجمع، من غير أن يحصره في التخزين مع أن السياق قد يتضمنه.
- source_word: τοὺς καρπούς μου
  choice: غلالي
  rationale: تشير «الغلال» بوضوح إلى الناتج الزراعي المقصود في السياق، وتتجنب فهم «الثمار» بمعناها الضيق.
