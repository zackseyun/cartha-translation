  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: ar
  text: وكونوا أنتم مثل أناس ينتظرون سيدهم متى يرجع من العرس، لكي يفتحوا له فورًا إذا جاء وقرع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμοιοι ἀνθρώποις
  choice: مثل أناس
  rationale: صياغة عربية طبيعية تحافظ على صورة التشبيه من غير تقييدها بالذكور لفظًا، مع أن السياق يصور خدمًا ينتظرون سيدهم.
- source_word: προσδεχομένοις
  choice: ينتظرون
  rationale: ينقل معنى الترقب والاستعداد لاستقبال الآتي بوضوح.
- source_word: τὸν κύριον ἑαυτῶν
  choice: سيدهم
  rationale: السياق سياق خدم وصاحب بيت، لذا «سيدهم» أدق من «ربهم» هنا، مع إبقاء دلالة السلطة.
- source_word: πότε ἀναλύσῃ
  choice: متى يرجع
  rationale: الفعل في هذا السياق يعني الرجوع أو الانصراف من مناسبة، و«متى يرجع» يحفظ تركيب السؤال الزمني غير المباشر.
- source_word: ἐκ τῶν γάμων
  choice: من العرس
  rationale: الجمع اليوناني الاصطلاحي يشير إلى احتفال العرس أو الوليمة؛ و«العرس» تعبير عربي موجز وطبيعي.
- source_word: εὐθέως
  choice: في الحال
  rationale: ينقل معنى الاستجابة الفورية بعبارة عربية واضحة.
theological_decisions:
- issue: ترجمة κύριος في المثل
  choice: سيدهم
  alternative: ربهم
  rationale: لا تُفرض هنا دلالة الاسم الإلهي؛ فالمعنى المباشر هو سيد الخدم، مع بقاء إمكان التطبيق الرمزي ضمن سياق المثل.
- issue: هوية العائد من العرس ودوره
  choice: الإبقاء على صورة السيد العائد من العرس من دون شرح إضافي
  alternative: تحديده صراحة بأنه العريس أو المسيح
  rationale: النص لا يسمي السيد عريسًا في هذه الآية، ولذلك لا ينبغي حسم علاقة رمزية لا يصرح بها اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على المخاطب الجمع «أنتم» للتوكيد، وعلى تسلسل الأفعال وصورة الانتظار والقرع والفتح الفوري.
