  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: ar
  text: 'أقول لك: لن تخرج من هناك حتى تؤدّي حتى آخر فلس.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: أصغر قطعة نقدية. «الفلس» هنا مقابل للفظة اليونانية λεπτόν، وهي قطعة نقدية صغيرة جدًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω σοι
  choice: أقول لك
  rationale: صيغة خطاب مباشرة وطبيعية، تحافظ على دلالة المضارع والضمير في الأصل.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: لن تخرج ... أبدًا
  rationale: يجمع «لن» مع «أبدًا» لنقل النفي المستقبلي المؤكد الذي تعبّر عنه οὐ μή مع صيغة الاحتمال.
- source_word: ἐκεῖθεν
  choice: من هناك
  rationale: مقابل عربي مباشر وطبيعي للظرف الدال على الابتعاد من موضع.
- source_word: ἕως
  choice: حتى
  rationale: تحافظ على الحد الزمني الذي يستمر إليه المنع من الخروج.
- source_word: καὶ τὸ ἔσχατον
  choice: آخر
  rationale: يفيد السياق استيفاء الدين إلى أصغر وآخر جزء منه؛ وتُفهم دلالة التوكيد في اقتران «آخر» بفئة العملة الصغيرة، من غير إثقال العبارة.
- source_word: λεπτόν
  choice: فلس
  rationale: «فلس» اسم عربي قديم لقطعة نقدية ضئيلة القيمة، وهو أوضح للقارئ العربي من نقل الاسم اليوناني صوتيًا، مع توضيح الخصوصية التاريخية في الحاشية.
- source_word: ἀποδῷς
  choice: تؤدّي
  rationale: الفعل يلائم أداء ما في الذمة في سياق الدين والقضاء، ويحافظ على معنى السداد الكامل قبل الخروج.
theological_decisions:
- issue: طبيعة صورة الدين والسجن
  choice: الإبقاء على صورة الاحتجاز إلى حين أداء الدين كاملًا من غير تعيين مرجعها اللاهوتي
  alternative: تفسيرها صراحةً بأنها تحذير قضائي دنيوي، أو صورة للدينونة الإلهية، أو إشارة إلى عقوبة تطهيرية لاحقة
  rationale: لا يحدّد العدد نفسه مرجع الصورة؛ لذلك تحفظ الصياغة توترها واحتمالاتها ولا تُدخل تفسيرًا عقائديًا لاحقًا.
- issue: دلالة «حتى» في العبارة المنفية
  choice: صياغة الحد الزمني كما في الأصل من غير تقرير ما إذا كان السداد أو الخروج سيقع فعلًا
  alternative: فهم العبارة على أنها وعد ضمني بالخروج بعد السداد، أو على أنها نفي مطلق لإمكان الخروج
  rationale: ἕως يبيّن الحد الذي يستمر إليه النفي، لكنه لا يحسم وحده إمكان تحقق الشرط؛ لذا لا ينبغي للترجمة أن تحسم المسألة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «فلس» بوصفه مقابلاً عربيًا مفهومًا لقطعة نقدية زهيدة، وتجنبت الصياغة التفسير العقائدي للصورة.
