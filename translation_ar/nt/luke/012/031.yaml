lexical_decisions:
- source_word: πλὴν
  choice: بل
  rationale: تفيد الانتقال التقابلي من النهي عن طلب حاجات الحياة بقلق إلى توجيه الطلب نحو الملكوت، وهي موجزة وطبيعية في العربية.
- source_word: ζητεῖτε
  choice: اطلبوا
  rationale: تنقل صيغة الأمر الحاضر الدالة على توجّه مستمر، من غير زيادة تفسيرية مثل «داوموا على طلب».
- source_word: βασιλείαν
  choice: ملكوت
  rationale: «الملكوت» تعبير عربي كتابي معروف، ويمكنه أن يشمل سلطان الله ومجال حكمه من دون حصر المعنى في أحدهما.
- source_word: αὐτοῦ
  choice: ـه
  rationale: تحافظ على الضمير الوارد في اليونانية، ومرجعه إلى الله مفهوم من السياق، من غير استبداله باسم صريح داخل المتن.
- source_word: ταῦτα
  choice: هذه الأشياء
  rationale: تشير إلى ضروريات الحياة المذكورة في السياق السابق، ولا تضيف «كل» غير الموجودة في قراءة النص المعتمدة.
- source_word: προστεθήσεται
  choice: تُزاد
  rationale: تحافظ على المبني للمجهول وصورة الإضافة في الأصل، بدل تفسيرها مباشرة بصيغة مثل «تُعطى» أو «تُوفَّر».
- source_word: ὑμῖν
  choice: لكم
  rationale: صياغة عربية طبيعية للداتيف في هذا التركيب، وتؤدي معنى أن هذه الأشياء ستُضاف لصالح المخاطَبين.
theological_decisions:
- issue: مرجع الضمير αὐτοῦ
  choice: إبقاء الضمير في «ملكوته»، مع فهم مرجعه إلى الله من السياق.
  alternative: التصريح بعبارة «ملكوت الله».
  rationale: السياق القريب يتحدث عن الله وعناية الآب، ولذلك يتضح المرجع، بينما يحافظ الضمير على صيغة النص اليوناني ولا يزيل ما فيه من إحالة سياقية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع نبرة كتابية رصينة. وُضعت علامتا الحاشيتين بعد «ملكوته» بحسب ترتيب الإحالات المطلوب، مع ظهور كل علامة في المتن.
