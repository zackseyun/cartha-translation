  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: ar
  text: بل اطلبوا ملكوته[b][a]، وهذه الأشياء ستُزاد لكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ملكوت الله»؛ فالنص اليوناني يقول حرفيًا «ملكوته»، ويتحدد مرجع الضمير من السياق.
    reason: lexical_alternative
