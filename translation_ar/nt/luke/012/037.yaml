reference: Luke 12:37
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: ar
  text: 'طوبى لأولئك العبيد الذين يجدهم السيد، حين يأتي، ساهرين. الحق أقول لكم: إنه سيشدّ ثوبه حول وسطه للخدمة[a]، ويجعلهم يتكئون إلى المائدة، ثم يتقدّم ويخدمهم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «سيتمنطق»، أي سيشدّ ثوبه حول وسطه استعدادًا للخدمة.'
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: طوبى
  rationale: صيغة عربية راسخة للتطويب، تحفظ النبرة الدينية المهيبة ولا تختزل المعنى في شعور ذاتي بالسعادة.
- source_word: δοῦλοι
  choice: العبيد
  rationale: المشهد المنزلي يبرز علاقة الملكية والخضوع للسيد، ولذلك تنقل «العبيد» دلالة اللفظ اليوناني بوضوح أكبر من «الخدم».
- source_word: κύριος
  choice: السيد
  rationale: في سياق المثل المنزلي يدل اللفظ مباشرة على سيد العبيد، مع بقاء إمكان صدى لقب «الرب» في السياق الأوسع دون فرضه في الترجمة.
- source_word: γρηγοροῦντας
  choice: ساهرين
  rationale: تنقل اليقظة الفعلية والاستعداد معًا بعبارة عربية موجزة وطبيعية.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: الحق أقول لكم
  rationale: صيغة عربية كتابية واضحة تحفظ توكيد القول ووظيفته الاستهلالية.
- source_word: περιζώσεται
  choice: سيشدّ ثوبه إلى وسطه للخدمة
  rationale: تحفظ الصورة الثقافية للتمنطق وتوضح غايتها العملية بدل استعمال تعبير عربي غامض مثل «يتمنطق» وحده.
- source_word: ἀνακλινεῖ αὐτούς
  choice: يُتكئهم للطعام
  rationale: الفعل يدل على جعلهم يتكئون في وضع تناول الطعام، لا على مجرد إجلاسهم.
- source_word: παρελθὼν
  choice: ثم يمرّ بينهم
  rationale: يحفظ معنى الحركة في أثناء خدمة الجالسين، وهو أنسب من إسقاط مدلول اسم الفاعل إلى مجرد «يأتي».
- source_word: διακονήσει αὐτοῖς
  choice: يخدمهم
  rationale: ينقل الخدمة العملية، وبخاصة خدمة الطعام في هذا السياق، من غير إيحاء كنسي زائد.
theological_decisions:
- issue: دلالة κύριος بين «السيد» و«الرب»
  choice: السيد
  alternative: الرب
  rationale: العلاقة المنزلية الصريحة بين العبيد وصاحبهم تجعل «السيد» المعنى المباشر هنا. ويحافظ هذا الاختيار على إمكان المفارقة اللاهوتية في أن السيد يخدم عبيده، من غير أن يحسم وحده هوية الشخصية خارج ما يتيحه المثل.
- issue: نقل δοῦλοι في مشهد اجتماعي هرمي
  choice: العبيد
  alternative: الخدم
  rationale: حالة العبودية جزء بارز من قلب المفارقة في الآية؛ فالسيد يتخذ هيئة الخادم ويخدم عبيده. أما «الخدم» فقد تخفف هذه العلاقة الاجتماعية التي يصرح بها الأصل.
- issue: صورة السيد الذي يخدم عبيده
  choice: الإبقاء على الانقلاب الصريح في الأدوار
  alternative: تلطيف العبارة إلى ضيافة عامة
  rationale: 'النص يتعمد المفارقة الشديدة: السيد يتمنطق، ويجعل العبيد يتكئون، ويخدمهم. لذلك لم تُخفف الصورة ولم تُفسر عقائديًا بما يتجاوز العبارة.'
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدمت «طوبى» و«الحق أقول لكم» بوصفهما صيغتين كتابيتين مألوفتين، مع تجنب الألفاظ القديمة غير المشروحة. أُبقيت صورة الاتكاء للطعام والحركة بين الجالسين لأنها أساسية في مشهد الوليمة.
