  terminology: «طوبى»، و«العبيد»، و«السيد»، و«ساهرين»، و«الحق أقول لكم» اختيارات سليمة في هذا السياق. ويحسن التعبير عن περιζώσεται بعبارة عربية طبيعية هي «يشدّ ثوبه حول وسطه» مع الإبقاء على الحاشية الحرفية.
