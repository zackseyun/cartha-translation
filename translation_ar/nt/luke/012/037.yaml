  source_fidelity: 'النص ينقل البنية والمعنى الرئيسيين بأمانة: التطويب، والعبيد، ويقظة العبيد عند مجيء السيد، ثم مفارقة أن السيد نفسه يتهيأ للخدمة ويخدمهم. لكن «ثم يمرّ بينهم» قد توحي بالمرور المجرد أكثر من حركة التقدّم لخدمتهم التي يؤديها παρελθών في هذا السياق.'
