  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: ar
  text: هكذا يكون مَن يكنز لنفسه ولا يكون غنيًّا عند الله[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَن يكنز لنفسه ولا يكون غنيًّا أمام الله».'
    reason: بديل تعبيري لـ εἰς θεόν؛ يحافظ على البعد العلاقي/التقييمي في العبارة دون تفسير ماهية الغنى.
lexical_decisions:
- source_word: οὕτως
  choice: هكذا يكون
  rationale: تفيد استخلاص التطبيق من المثل السابق، وتحافظ على الإيجاز والقوة الحكمية مع إظهار المسند المفهوم في اليونانية.
- source_word: ὁ θησαυρίζων
  choice: مَن يكنز
  rationale: اسم الموصول مع الفعل المضارع ينقل وظيفة اسم الفاعل المعرّف الدالة على شخص يتصف بهذا العمل، و«يكنز» يحفظ صلة اللفظ بالكنز وتكديسه.
- source_word: ἑαυτῷ
  choice: لنفسه
  rationale: تنقل الداتيف الانعكاسي الدال على المنفعة الذاتية بصورة مباشرة وطبيعية.
- source_word: καὶ μὴ
  choice: ولا يكون
  rationale: تحفظ العطف والنفي، مع إضمار فعل الكينونة في الأصل وإظهاره عربيًّا لاستقامة العبارة.
- source_word: εἰς θεὸν
  choice: نحو الله
  rationale: تحفظ الاتجاه والعلاقة اللذين تفيدهما εἰς من غير اختزال العبارة إلى الملكية أو إلى مجرد التقييم الإلهي.
- source_word: πλουτῶν
  choice: غنيًّا
  rationale: تنقل اسم الفاعل بوصفه خبرًا لحال الشخص، وتحافظ على المقابلة مع كنز الغنى الأرضي.
theological_decisions:
- issue: التعبير العام بصيغة المفرد في القول الأخلاقي
  choice: مَن يكنز
  alternative: الرجل الذي يكنز
  rationale: التركيب اليوناني مفرد مذكر من جهة النحو، لكنه يؤدي وظيفة عامة؛ و«مَن» تنقل العموم طبيعيًّا في العربية من غير حصر التطبيق في الرجال.
- issue: معنى الغنى εἰς θεὸν
  choice: غنيًّا نحو الله
  alternative: غنيًّا أمام الله
  rationale: أُبقي الاتجاه العلاقي في العبارة من غير إضافة تفسير عقائدي يحدد ماهية هذا الغنى أكثر مما يحدده النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة ذات نبرة حكمية. استُخدم «يكنز» للمحافظة على الصورة اللفظية، و«نحو الله» للمحافظة على الغموض العلاقي المقصود، مع إثبات البديل «أمام الله» في الحاشية.
