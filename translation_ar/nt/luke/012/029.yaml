  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: ar
  text: وَأَنْتُمْ، لَا تَطْلُبُوا مَا تَأْكُلُونَ وَمَا تَشْرَبُونَ، وَلَا تَضْطَرِبُوا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تقلقوا»، أو «لا تكونوا متزعزعين»؛ وحرفيًّا على نحو أقرب: «لا تبقوا معلَّقين في حيرة».'
    reason: بدائل معجمية للفعل μετεωρίζεσθε، الذي قد يدل على القلق أو الاضطراب أو البقاء في حالة ترقّب وحيرة.
lexical_decisions:
- source_word: ὑμεῖς
  choice: أَنْتُمْ
  rationale: الضمير مذكور صراحةً في اليونانية للتوكيد؛ وإبرازه في صدر الجملة يحفظ هذا التوكيد من غير إثقال.
- source_word: ζητεῖτε
  choice: تَطْلُبُوا
  rationale: يحفظ المعنى الأساسي للفعل، أي الطلب أو السعي، ويُبقي النهي مباشرًا من غير أن يفسره مسبقًا بأنه مجرد تخطيط أو قلق.
- source_word: τί φάγητε
  choice: مَا تَأْكُلُونَ
  rationale: صياغة عربية طبيعية تنقل المضمون الاستفهامي غير المباشر المتعلق بما يؤكل، من غير إضفاء معنى التنبؤ أو الوجوب.
- source_word: τί πίητε
  choice: مَا تَشْرَبُونَ
  rationale: يحافظ على التوازي مع عبارة الأكل وعلى انفتاح المعنى في الأصل.
- source_word: μετεωρίζεσθε
  choice: تَضْطَرِبُوا
  rationale: ينقل حالة التزعزع والقلق الذهني التي يدل عليها الفعل في السياق، مع إبقاء البدائل الدلالية في الحاشية.
- source_word: καὶ ... καὶ ... καὶ
  choice: وَ... وَ... وَ
  rationale: يحفظ التنسيق التراكمي وإيقاع تكرار أداة العطف في اليونانية.
theological_decisions:
- issue: هل النهي موجَّه إلى كل طلب للطعام والشراب أم إلى الانشغال القَلِق بشأنهما؟
  choice: الإبقاء على صيغة النهي المباشر عن طلب ما يؤكل وما يُشرب، يليها النهي عن الاضطراب
  alternative: تفسير العبارة صراحةً بأنها نهي عن القلق وحده أو عن التخطيط المعتاد للطعام والشراب
  rationale: 'يحفظ هذا التركيب توتر النص وسياقه: فلا يحوّل القول إلى دعوة زهدية ترفض الحاجات الجسدية، ولا يضيّق النهي بإضافة تفسير غير مصرح به في العبارة ذاتها.'
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. أُبرز الضمير للتوكيد، وحُفظ التوازي بين الأكل والشرب وتكرار العطف، مع تجنب لغة مذهبية أو تفسيرية زائدة.
