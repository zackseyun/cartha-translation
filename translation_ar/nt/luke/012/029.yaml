  source_fidelity: 'النص العربي يحافظ على عناصر اليونانية الأساسية: إبراز الضمير «وأنتم»، والنهي المستمر بصيغة «لا تطلبوا»، والتوازي بين الطعام والشراب، ثم النهي عن الاضطراب. وترجمة «تضطربوا» تعكس بصورة سليمة المجال الدلالي لـ μετεωρίζεσθε، أي القلق أو الحيرة الذهنية، من غير حسمٍ تفسيري زائد.'
  naturalness: 'الصياغة فصيحة حديثة، واضحة، ومناسبة للسياق: «وَأَنْتُمْ، لَا تَطْلُبُوا مَا تَأْكُلُونَ وَمَا تَشْرَبُونَ، وَلَا تَضْطَرِبُوا». التوازي وتكرار الواو طبيعيان هنا ويحفظان إيقاع الأصل.'
