  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: ar
  text: 'فقال له شخصٌ من الحشد: «يا معلّم، قل لأخي أن يقسم الميراث معي[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يشركني في الميراث»، أو: «أن يوزّع لي نصيبي من الميراث».'
    reason: يحمل μερίσασθαι مع μετ’ ἐμοῦ معنى تقسيم الميراث مع المتكلم أو إشراكه فيه أو تخصيص نصيبه منه؛ ولا يحدد النص الإجراء القانوني بدقة.
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: فقال
  rationale: تنقل δέ بوصفها أداة ربط سردية خفيفة، وتأتي الفاء طبيعية في سياق العربية من غير إقحام معنى تعارض قوي.
- source_word: τις ἐκ τοῦ ὄχλου
  choice: واحدٌ من الجمع
  rationale: تعبير عربي واضح يحافظ على عدم تعيين الشخص وعلى كونه واحدًا ممن كانوا في الجمع.
- source_word: αὐτῷ
  choice: له
  rationale: ضمير المفعول غير المباشر يعود إلى يسوع بحسب السياق، وتؤديه العربية بإيجاز طبيعي.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: ينقل صيغة النداء والمعنى المباشر لمن يعلّم، من غير إضافة إيحاء سلطوي غير لازم.
- source_word: εἰπὲ
  choice: قل
  rationale: أمر من λέγω يُستعمل هنا في طلب توجيه الكلام إلى الأخ؛ و«قل» هو المقابل المباشر والطبيعي.
- source_word: τῷ ἀδελφῷ μου
  choice: لأخي
  rationale: يحافظ على علاقة القرابة وعلى وظيفة الاسم بوصفه متلقي القول.
- source_word: μερίσασθαι
  choice: أن يقسم
  rationale: الفعل يدل على تقسيم المال أو توزيعه إلى أنصبة، و«يقسم» ملائم لسياق الميراث مع إبقاء كيفية القسمة غير محددة.
- source_word: μετ’ ἐμοῦ
  choice: معي
  rationale: يحافظ على دلالة المصاحبة أو المشاركة في μετά مع المضاف إليه، من غير تحويلها تفسيرًا إلى «بيننا».
- source_word: τὴν κληρονομίαν
  choice: الميراث
  rationale: لفظ عربي مألوف ودقيق للمال الموروث، ولا يضيّق المعنى إلى تركة قانونية محددة.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الجمع» للمجموعة المحتشدة، و«الميراث» للوضوح والشيوع. حُفظت خفة أداة الربط اليونانية بصيغة «فقال»، وأُبقي الغموض في طبيعة القسمة ضمن الحاشية.
