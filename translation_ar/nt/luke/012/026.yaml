  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: ar
  text: فإن كنتم لا تقدرون حتى على أصغر أمر، فلماذا تقلقون بشأن سائر الأمور؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: فإن
  rationale: تحفظ «إن» القوة الشرطية، وتنقل الفاء الصلة الاستنتاجية بما سبق في صياغة عربية طبيعية موجزة.
- source_word: οὐδὲ ἐλάχιστον
  choice: لا تقدرون حتى على أصغر الأمور
  rationale: «حتى» تنقل معنى οὐδέ التصاعدي، و«أصغر الأمور» تؤدي الصفة المحايدة المستعملة استعمال الاسم، مع إظهار الاسم المضمر طبيعيًا في العربية.
- source_word: δύνασθε
  choice: تقدرون
  rationale: ينقل معنى القدرة والاستطاعة مباشرة، ويتلاءم مع حرف الجر «على» في العربية.
- source_word: τί
  choice: لماذا
  rationale: تؤدي الاستفهام السببي البلاغي المقصود في هذا التركيب، بدل الترجمة الحرفية غير الطبيعية «ماذا».
- source_word: περὶ τῶν λοιπῶν
  choice: بشأن الباقي
  rationale: تحفظ الإشارة الموجزة إلى سائر الأمور بعد «أصغر الأمور»، من غير زيادة تفسيرية.
- source_word: μεριμνᾶτε
  choice: تقلقون
  rationale: تنقل معنى الانشغال القَلِق في السياق، وتحافظ على صيغة المضارع الدالة على الحالة أو الفعل الجاري.
theological_decisions:
- issue: دلالة μεριμνάω في تعليم يسوع عن الاتكال على الله
  choice: تقلقون
  alternative: تهتمون
  rationale: «تقلقون» تعبّر عن القلق المذموم في سياق المقطع، من غير أن توحي بأن كل اهتمام حكيم أو تدبير عملي ممنوع.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموقرة. حافظت الترجمة على بنية الشرط والاستنتاج وعلى السؤال البلاغي، مع تجنب المصطلحات النفسية السريرية أو التفسير العقائدي الزائد.
