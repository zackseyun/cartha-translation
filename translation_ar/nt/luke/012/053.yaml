    issue: ترجمة ἐπί بـ«على» في جميع علاقات الخصومة.
    rationale: في تركيب الانقسام بين أفراد الأسرة، تدل ἐπί على المعارضة («ضد»). «الأب على ابنه» أقل وضوحًا وطبيعية من «الأب ضد ابنه» في العربية الفصحى الحديثة.
