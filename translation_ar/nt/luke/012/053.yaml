revisions:
- from: 'سوف ينقسمون: الأب على ابنه، والابن على أبيه؛ والأم على ابنتها، والابنة على أمها؛ والحماة على كنّتها، والكنّة على حماتها.[a]'
  to: 'سينقسمون: الأب ضد الابن، والابن ضد الأب؛ والأم ضد الابنة، والابنة ضد الأم؛ والحماة ضد كنّتها، والكنّة ضد الحماة.[a]'
  rationale: استُبدلت «على» بـ«ضد» لإظهار دلالة المعارضة التي يقتضيها السياق اليوناني بلغة عربية معاصرة طبيعية، مع الإبقاء على بنية الأزواج المتقابلة وعدم إضافة تفسير لسبب الانقسام. وحُذفت من الحاشية ملاحظة لم تعد لازمة بعد هذا التعديل، وأُبقي التوضيح المعجمي اللازم لـ«الكنّة».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:37Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام وترتيب أزواج القرابة محفوظان، وكذلك ضمير الملكية الصريح في «كنّتها». لكن «على» لا تنقل في العربية المعاصرة بوضوح دلالة المواجهة/الخصومة التي يؤديها ἐπί في هذا السياق، وقد تُفهم على أنها علاقة مكانية أو صياغة غير مكتملة.
  naturalness: الصياغة متوازنة في الجملة، لكن تكرار «على» بعد أسماء القرابة غير طبيعي بما يكفي للفصحى المعاصرة الواضحة. «ضدّ» مباشر وطبيعي ويحفظ التوازي.
  terminology: «الحماة» و«الكنّة» صحيحان فصيحان في هذا السياق. ولأن «الكنّة» قد لا تكون مألوفة لبعض القراء، فشرحها بأنها زوجة الابن في الحاشية مناسب. لا حاجة إلى الحاشية المتعلقة بترجمة «على» بعد اعتماد «ضدّ».
  issues:
