  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: ar
  text: 'سينقسمون: الأب ضد الابن، والابن ضد الأب؛ والأم ضد الابنة، والابنة ضد الأم؛ والحماة ضد كنّتها، والكنّة ضد الحماة.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تعني الكلمة اليونانية المترجمة «الكنّة» «العروس» في سياقات أخرى، لكن مقابلتها بـ«الحماة» هنا ترجّح معنى زوجة الابن.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: سوف ينقسمون
  rationale: يحفظ صيغة المستقبل المبني للمجهول ودلالة وقوع الانقسام داخل الأسرة، من غير تحديد فاعل الانقسام أو سببه صراحة.
- source_word: ἐπὶ
  choice: على
  rationale: تكرار «على» يحافظ على بنية الأصل، ويفيد هنا الوقوف في مواجهة الطرف الآخر أو معارضته بحسب السياق.
- source_word: πατήρ / υἱός
  choice: الأب / الابن
  rationale: ينقل صلة القرابة المحددة والتقابل المتبادل في الأصل.
- source_word: μήτηρ / θυγάτηρ
  choice: الأم / الابنة
  rationale: ينقل صلة القرابة المحددة ويحافظ على التوازي بين طرفي العبارة.
- source_word: πενθερά
  choice: الحماة
  rationale: المقابل العربي الفصيح الواضح لأم الزوج أو أم الزوجة.
- source_word: νύμφη
  choice: الكنّة
  rationale: قد تدل الكلمة اليونانية على العروس، لكن اقترانها المتبادل بالحماة هنا يرجح معنى زوجة الابن؛ و«الكنّة» أدق لفظ عربي لهذه الصلة.
- source_word: αὐτῆς
  choice: كنّتها
  rationale: ينقل ضمير الملكية الصريح في العبارة اليونانية، بينما تُفهم الإضافة في العبارة المقابلة طبيعيًا من «حماتها».
theological_decisions:
- issue: طبيعة الانقسام المذكور
  choice: الإبقاء على وصف حادّ لانقسام أسري متبادل مرتبط بسياق رسالة يسوع
  alternative: صياغته مثلًا عامًا عن التوترات العائلية أو عرضه بوصفه أمرًا بالعداوة
  rationale: السياق السابق يتحدث عن الانقسام الناتج عن رسالة يسوع. وتحفظ الصياغة التوتر من غير أن تجعل النص إقرارًا أخلاقيًا للخصومة الأسرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «الكنّة» لدقتها في صلة القرابة، مع شرحها في الحاشية، وحُفظ التوازي الإيقاعي بين الأزواج الثلاثة.
