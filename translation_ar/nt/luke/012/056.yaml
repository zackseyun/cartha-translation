  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: ar
  text: يا مراؤون! تعرفون كيف تميّزون مظهر الأرض والسماء، فكيف لا تعرفون كيف تميّزون هذا الوقت[a]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «هذا الموسم» أو «هذا الوقت الحاسم». قد تدل الكلمة اليونانية καιρός على وقت مهم أو فرصة مواتية، لا على الزمن بوجه عام فحسب.
    reason: بدائل معجمية تحفظ سعة دلالة καιρός.
lexical_decisions:
- source_word: ὑποκριταί
  choice: يا مراؤون
  rationale: نداء توبيخي مباشر؛ و«مراؤون» يؤدي معنى التظاهر الأخلاقي والديني، لا معنى الممثلين الحرفي.
- source_word: τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ
  choice: مظهر الأرض والسماء
  rationale: تأتي πρόσωπον هنا بمعنى الهيئة أو المظهر المرئي، ومع اقتران الأرض بالسماء يشير السياق إلى العلامات الجوية المشاهدة.
- source_word: οἴδατε δοκιμάζειν
  choice: تعرفون كيف تميّزون
  rationale: يفيد تركيب οἴδατε مع المصدر معرفة الكيفية أو القدرة، وتفيد δοκιμάζειν هنا الفحص المؤدي إلى التمييز وفهم الدلالة. ويحافظ تكرار العبارة على التوازي في النص اليوناني.
- source_word: τὸν καιρὸν τοῦτον
  choice: هذا الوقت
  rationale: تحافظ العبارة على اسم الإشارة وعلى سعة معنى καιρός، الذي قد يدل على وقت ذي شأن أو فرصة حاسمة، من غير أن تفرض تفسيرًا لاهوتيًا أضيق.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: فكيف لا تعرفون كيف تميّزون
  rationale: تنقل «كيف» قوة السؤال الإنكاري والتوبيخ، مع إبقاء البنية المتكررة في الشطر الأول.
theological_decisions:
- issue: دلالة καιρός في توبيخ يسوع
  choice: هذا الوقت
  alternative: هذا الموسم؛ هذا الوقت الحاسم
  rationale: قد يشير السياق إلى مغزى زمن خدمة يسوع وعمل الله، لكن النص لا يصرّح بوصفه «حاسمًا». لذلك تُبقي الصياغة المختارة التوتر بين المعنى الزمني والمعنى النوعي دون حسم زائد.
translation_notes:
  register: العربية فصحى حديثة واضحة ومهيبة. استُخدم «يا مراؤون» للتوبيخ المباشر، وحوفظ على تكرار «تعرفون كيف تميّزون» لإبراز المقابلة البلاغية في الأصل.
