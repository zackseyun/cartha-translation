  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: ar
  text: ولماذا لا تحكمون بأنفسكم في ما هو صواب؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما هو عادل»، أو «الأمر الصائب».'
    reason: بدائل معجمية للعبارة τὸ δίκαιον، التي تحتمل معنى الصواب والعدل.
lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: ولماذا
  rationale: تؤدي معنى الانتقال إلى سؤال بلاغي يضغط الحجة السابقة، وتحافظ الواو على قوة الربط من غير ترجمة جامدة لكل أداة.
- source_word: ἀφ’ ἑαυτῶν
  choice: من تلقاء أنفسكم
  rationale: تعبير عربي طبيعي يدل على الحكم بمبادرة السامعين أنفسهم وبتمييزهم، وهو أقرب إلى حرفية «من أنفسكم» من دون غرابة أسلوبية.
- source_word: οὐ κρίνετε
  choice: لا تحكمون
  rationale: يحفظ المعنى الأساسي للفعل κρίνω، أي إصدار حكم أو تقويم الأمر، مع ملاءمته للسياق.
- source_word: τὸ δίκαιον
  choice: ما هو صواب
  rationale: الصفة المحايدة المستعملة استعمال الاسم تعني الأمر الصائب أو العادل. و«ما هو صواب» عربية واضحة وتحفظ المجال الأخلاقي والتقويمي الواسع.
theological_decisions:
- issue: دلالة τὸ δίκαιον
  choice: ما هو صواب
  alternative: ما هو عادل؛ الأمر الصائب
  rationale: لا يلزم السياق حصر العبارة في العدالة القانونية أو في مصطلح عقائدي خاص؛ لذلك تحافظ «ما هو صواب» على اتساع الدلالة الأخلاقية والعملية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُعمل «من تلقاء أنفسكم» لتجنب غرابة «من أنفسكم»، مع إبقاء السؤال البلاغي مباشرًا.
