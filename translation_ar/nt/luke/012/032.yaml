base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: ar
  text: «لا تَخَفْ، أيها القطيع الصغير، لأن أباكم ارتضى أن يعطيكم الملكوت»[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «الملكوت» بـ«المُلك» أو «السلطان الملكي»، إذ قد يشير اللفظ إلى حكم الله الملكي وإلى المجال الذي يملكه ويمنحه لشعبه.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: لا تَخَفْ
  rationale: ينقل صيغة النهي المباشرة بإيجاز وفصاحة، ويحافظ على المعنى من غير زيادة.
- source_word: τὸ μικρὸν ποίμνιον
  choice: أيها القطيع الصغير
  rationale: يحافظ على استعارة الرعاية وعلى دلالة صِغَر القطيع، مع صياغة نداء طبيعية في العربية الفصحى المعاصرة.
- source_word: ὅτι
  choice: لأن
  rationale: يُظهر بوضوح أن ما يلي هو سبب النهي عن الخوف.
- source_word: εὐδόκησεν
  choice: سُرَّ
  rationale: ينقل معنى الرضا والمسرة، من غير تحويل اللفظ إلى تقرير تقني عن القضاء أو الإرادة.
- source_word: ὁ πατὴρ ὑμῶν
  choice: أباكم
  rationale: ترجمة مباشرة للفظ اليوناني من غير إضافة وصف مثل «السماوي» غير الموجود في النص.
- source_word: δοῦναι ὑμῖν
  choice: بأن يعطيكم
  rationale: صياغة عربية طبيعية تنقل المصدر اليوناني مع ضمير المفعول غير المباشر.
- source_word: τὴν βασιλείαν
  choice: الملكوت
  rationale: لفظ كتابي عربي مألوف يتسع لمعنى سلطان الله الملكي ولمجال مُلكه، فلا يحصر الدلالة في أحدهما.
theological_decisions:
- issue: دلالة βασιλεία
  choice: الملكوت
  alternative: المُلك أو السلطان الملكي
  rationale: يحافظ «الملكوت» على الاتساع الدلالي بين ممارسة الحكم الملكي والمجال الخاضع له، بدل حسم التوتر لصالح معنى واحد.
- issue: دلالة εὐδόκησεν وعلاقتها بالإرادة الإلهية
  choice: سُرَّ
  alternative: ارتضى أو شاء عن رضى
  rationale: تُبرز الصياغة مسرة الآب وإحسانه من غير استيراد تقرير عقائدي تقني عن القرار أو القضاء.
translation_notes:
  register: عربية فصحى واضحة وكريمة النبرة. استُخدم «أيها» لإبراز النداء، و«القطيع الصغير» لصون الصورة الرعوية. وُضع مؤشر الحاشية بعد الجملة، وتتعلق الحاشية بلفظ «الملكوت».
