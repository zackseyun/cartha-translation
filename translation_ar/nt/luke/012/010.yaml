  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: ar
  text: وكلُّ مَن يقول كلمةً ضدَّ ابن الإنسان[a] سيُغفَر له[b]، أمّا مَن جدَّف على الروح القدس فلن يُغفَر له.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَن يقول قولًا ضد ابن الإنسان».'
    reason: lexical_alternative
  - marker: b
    text: 'النص اليوناني يقول حرفيًا: «سيُغفَر له»، والمغفور، أي الذنب أو الإساءة، مفهوم من السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὃς
  choice: كلُّ مَن
  rationale: تركيب توزيعي عام، و«كل من» تعبير عربي فصيح وطبيعي يحفظ شمول العبارة.
- source_word: ἐρεῖ λόγον
  choice: يقول كلمةً
  rationale: يحفظ ذكر λόγον صراحة، ويؤدي الفعل بصيغة عربية طبيعية من غير إطالة.
- source_word: εἰς
  choice: ضدَّ
  rationale: السياق سياق كلام معادٍ، ولا سيما مع المقابلة بالتجديف، لذلك تعبّر «ضد» عن معنى المعارضة المقصود.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: المقابل العربي الراسخ والدقيق لهذا اللقب، ويحفظ خلفيته السامية ودلالته المسيانية من غير تفسير زائد.
- source_word: ἀφεθήσεται αὐτῷ
  choice: يُغفَر له
  rationale: هذه هي الصياغة العربية الطبيعية للمبني للمجهول مع المجرور، ويبقى الذنب أو القول المغفور مفهومًا من السياق.
- source_word: τῷ ... βλασφημήσαντι
  choice: مَن يجدّف
  rationale: يؤدي اسم الفاعل اليوناني المستعمل استعمالًا اسميًا بصيغة عامة طبيعية، من غير فرض دلالة زمنية مكتملة لا يقتضيها السياق.
- source_word: τὸ ἅγιον πνεῦμα
  choice: الروح القدس
  rationale: التعبير العربي المعياري المعاصر للاسم الوارد في النص.
- source_word: οὐκ ἀφεθήσεται
  choice: فلن يُغفَر له
  rationale: ينقل النفي مع المستقبل والمبني للمجهول بوضوح، ويحفظ حدة الحكم الوارد في النص.
theological_decisions:
- issue: المقابلة بين الكلام ضد ابن الإنسان والتجديف على الروح القدس
  choice: إبقاء التمييز النصي في إمكان المغفرة من غير شرح ماهية التجديف أو آليته داخل الترجمة.
  alternative: تفسير العبارة بأنها تقابل بين جهل عابر ورفض نهائي، أو توسيعها وفق المقاطع الموازية.
  rationale: الآية نفسها تقرر المقابلة لكنها لا تشرحها هنا؛ لذا ينبغي حفظ التوتر اللاهوتي وعدم حسم تفسير مختلف عليه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أمّا» لإبراز المقابلة التي تؤديها δέ، و«فلن» لنقل النفي المستقبلي بوضوح. أُبقيت علامتا الحاشية [a] و[b] في المتن.
