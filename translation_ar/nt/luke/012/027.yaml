  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: ar
  text: 'تأمّلوا الزنابق[a] كيف تنمو: لا تتعب ولا تغزل. لكني أقول لكم: حتى سليمان، في كل مجده، لم يكن يرتدي مثل واحدة منها.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الأزهار البرية» أو «الأزهار»؛ واللفظ اليوناني هو «الزنابق».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: تأمّلوا
  rationale: فعل أمر يدعو إلى الملاحظة المتأنية والتفكير، لا إلى مجرد النظر؛ و«تأمّلوا» عربية طبيعية موجزة تحفظ هذه القوة.
- source_word: τὰ κρίνα
  choice: الزنابق
  rationale: اللفظ اليوناني يذكر الزنابق تحديدًا، مع إمكان استعماله في السياق للنباتات المزهرة البرية؛ لذلك أُبقي المعنى المحدد في المتن وذُكر البديل في الحاشية.
- source_word: πῶς αὐξάνει
  choice: كيف تنمو
  rationale: يحفظ التركيب دلالة πῶς على الكيفية، وتأتي المطابقة بالجمع وفق الأسلوب العربي الطبيعي.
- source_word: οὐ κοπιᾷ οὐδὲ νήθει
  choice: لا تتعب ولا تغزل
  rationale: «تتعب» تنقل معنى بذل الجهد في κοπιάω، و«تغزل» هي المقابل المباشر لعمل غزل الألياف أو الخيوط في νήθω.
- source_word: λέγω δὲ ὑμῖν
  choice: لكني أقول لكم
  rationale: تنقل «لكن» الانتقال التقابلي الخفيف الذي تؤديه δέ، مع إبقاء صيغة التوكيد المباشر.
- source_word: οὐδὲ Σολομὼν
  choice: ولا سليمان
  rationale: السياق والنفي السابقان يجعلان «ولا سليمان» صياغة عربية طبيعية تفيد أن حتى سليمان لم يبلغ هذه الكسوة.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: في كل مجده
  rationale: تحفظ «مجده» الصدى الدلالي الواسع لـ δόξα، بينما يدل السياق هنا على البهاء الملكي.
- source_word: περιεβάλετο
  choice: كان يلبس
  rationale: الصيغة اليونانية الوسطى يمكن أن تفيد ارتداء اللباس؛ و«كان يلبس» طبيعية ولا تحسمها على أنها مبني للمجهول أو تفصّل جهة الإلباس.
- source_word: ὡς ἓν τούτων
  choice: كواحدة منها
  rationale: «واحدة» توافق «الزنابق» المؤنث غير العاقل في العربية، والضمير يعيد المقارنة إليها من غير تكرار زائد.
theological_decisions:
- issue: مدلول الصورة النباتية
  choice: الإبقاء على «الزنابق»
  alternative: الأزهار أو الأزهار البرية
  rationale: النص اليوناني يسمّي κρίνα، فلا موجب لطمس التحديد في المتن، مع التنبيه إلى اتساع محتمل في الحاشية.
- issue: معنى δόξα في وصف سليمان
  choice: مجده
  alternative: بهائه أو أبهته
  rationale: «المجد» مفهوم في السياق ويحفظ الامتداد الكتابي للفظ، مع أن المقصود القريب هو البهاء الملكي.
- issue: صيغة περιεβάλετο
  choice: كان يلبس
  alternative: كان يكتسي أو أُلبس
  rationale: تحفظ الصياغة العربية صورة اللباس من غير الجزم بفاعل خارجي، وتبقي قدرًا من مرونة الصيغة الوسطى اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «تأمّلوا» للدعوة إلى النظر المتفكر، وحُفظت صورة الغزل واللباس. وُضع فاصل نقطي بين الملاحظة والقول التفسيري لتحسين انسياب الآية من غير تغيير بنائها الحجاجي.
