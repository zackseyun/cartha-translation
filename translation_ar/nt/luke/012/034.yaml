  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: ar
  text: لِأَنَّهُ حَيْثُ يَكُونُ كَنْزُكُمْ، هُنَاكَ سَيَكُونُ قَلْبُكُمْ أَيْضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنَّه حيثما يكون كنزكم، سيكون قلبكم هناك أيضًا».'
    reason: بديل معجمي وأسلوبي لـὅπου، مع الحفاظ على صيغة المستقبل في ἔσται.
lexical_decisions:
- source_word: ὅπου
  choice: حيث
  rationale: تؤدي معنى المكان بوضوح، وتحافظ مع «هناك» على البنية الترابطية في اليونانية. ويمكن فهمها هنا بمعنى عام قريب من «حيثما».
- source_word: γάρ
  choice: لأنَّه
  rationale: يحفظ الوظيفة التعليلية التي تربط القول بالتوجيه السابق، وهو تعبير عربي واضح وطبيعي.
- source_word: θησαυρός
  choice: كنز
  rationale: مقابل مباشر وطبيعي يحفظ الدلالة الحرفية والمجازية في سياق الغنى الأرضي والسماوي.
- source_word: καρδία
  choice: قلب
  rationale: يحفظ التعبير الكتابي عن مركز رغبات الإنسان وعواطفه والتزاماته من غير حصره في جانب نفسي واحد.
- source_word: ἐκεῖ
  choice: هناك
  rationale: يحافظ على التقابل المكاني «حيث... هناك...» الموجود في النص اليوناني.
- source_word: καὶ
  choice: أيضًا
  rationale: ينقل المعنى الإضافي، أي إن القلب يكون مع الكنز ويتبعه في وجهته.
- source_word: ἔσται
  choice: سيكون
  rationale: يحفظ صيغة المستقبل الصريحة، بما فيها من معنى النتيجة واليقين الحكمي.
- source_word: ὑμῶν
  choice: ـكم
  rationale: تنقل ضمير المخاطبين بصيغة الجمع في الموضعين، كما يقتضي النص اليوناني.
theological_decisions:
- issue: الدلالة الأنثروبولوجية لكلمة «القلب»
  choice: الإبقاء على «القلب» بوصفه التعبير الكتابي الجامع عن التوجه الداخلي والرغبات والالتزامات.
  alternative: ترجمتها تفسيرًا بـ«رغباتكم» أو «فكركم».
  rationale: التعبير يتناول توجه باطن الإنسان نحو ما يعدّه ذا قيمة. والإبقاء على «القلب» يصون الاتساع اللاهوتي والأدبي من غير تضييق المعنى.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت صيغة الجمع في «كنزكم» و«قلبكم» مطابقةً للأصل، وحُفظت بنية «حيث... هناك...» وصيغة المستقبل.
