source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: ar
  text: 'ولكن إن قال ذلك العبد[a] في قلبه: «سيدي يتأخر في المجيء»[b]، وبدأ يضرب الخدم والخادمات، ويأكل ويشرب ويسكر،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الخادم». تدل الكلمة اليونانية δοῦλος على شخص خاضع لسلطة سيد، وغالبًا ما تعني عبدًا؛ والسياق هنا يبرز علاقة التبعية في البيت.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «سيدي يتأخر أن يأتي». والمقصود بـ«السيد» هنا صاحب السلطة في البيت داخل المثل، مع أن الكلمة اليونانية κύριος قد تُترجم أيضًا «الرب».'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: العبد
  rationale: ينقل علاقة الخضوع والتبعية في البيت بوضوح، وهو في العربية أنسب من «الخادم» هنا لأن سياق المثل يبرز سلطة السيد ومساءلة العبد.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: في قلبه
  rationale: تعبير عربي مفهوم يحافظ على صورة الأصل ويدل على القول الداخلي الخفي.
- source_word: Χρονίζει ... ἔρχεσθαι
  choice: يتأخر في المجيء
  rationale: صياغة عربية طبيعية تنقل استمرار التأخر الذي يشكو منه العبد، من غير إضافة سبب أو مدة.
- source_word: κύριός μου
  choice: سيدي
  rationale: السياق هو علاقة سيد البيت بعبده داخل المثل؛ و«سيدي» تحافظ على معنى السلطة من دون جعل اللفظ بالضرورة لقبًا إلهيًا.
- source_word: τύπτειν
  choice: يضرب
  rationale: يفيد الاعتداء الجسدي، ويلائم إمكان تكرر الفعل في السياق.
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: الخدم والخادمات
  rationale: يحافظ على التمييز بين الذكور والإناث في الأصل، مع استعمال تعبير عربي معاصر واضح؛ ولا يفرض على اللفظين درجة من الاسترقاق أشد مما يقتضيه السياق وحده.
- source_word: μεθύσκεσθαι
  choice: يسكر
  rationale: تعبير عربي موجز وطبيعي يدل على بلوغ حال السكر.
theological_decisions:
- issue: 'دلالة κύριος في المثل: أهو لقب إلهي أم سيد البيت؟'
  choice: سيدي
  alternative: ربي
  rationale: المرجع المباشر داخل عالم المثل هو صاحب السلطة المنزلية؛ لذلك تمنع «سيدي» الخلط بلقب إلهي، مع إبقاء إمكان الدلالة الرمزية للمثل من غير التصريح بها في الترجمة.
- issue: دلالة δοῦλος في سياق التبعية المنزلية
  choice: العبد
  alternative: الخادم
  rationale: العلاقة الهرمية والمساءلة في السياق تجعل معنى التبعية القوية بارزًا، و«العبد» أقرب إلى δοῦλος من «الخادم».
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على تسلسل الأفعال وعلى صورة «في قلبه»، واستُعملت «الخدم والخادمات» لإظهار التقابل الجنسي في اللفظين اليونانيين من غير لغة قديمة ثقيلة.
