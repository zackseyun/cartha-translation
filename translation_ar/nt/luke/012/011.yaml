  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: ar
  text: ولكن متى أحضروكم أمام المجامع والحكام والسلطات[a]، فلا تقلقوا بشأن كيف أو ماذا تقولون دفاعًا عن أنفسكم[b]، أو ماذا تقولون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير عبارة «المجامع والحكام والسلطات» إلى هيئات دينية ومدنية قد يُستجوب التلاميذ أمامها.
    reason: cultural_note
  - marker: b
    text: 'أو بصياغة أكثر رسمية: «كيف أو ماذا تقدّمون في دفاعكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ولكن متى
  rationale: تنقل «متى» الاحتمال المستقبلي غير المحدد، وتحفظ «ولكن» الانتقال الخفيف الذي تؤديه δέ في السياق.
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: أحضروكم
  rationale: صياغة عربية طبيعية تلائم سياق المثول القضائي، من غير إضافة معنى غير موجود في الفعل.
- source_word: ἐπὶ τὰς συναγωγὰς
  choice: أمام المجامع
  rationale: تحفظ المعنى اللفظي لـ«المجامع»، بينما تنقل «أمام» دلالة المثول للفحص أو المحاكمة التي يقتضيها السياق.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: الحكّام وأصحاب السلطة
  rationale: تميّز بين ذوي الحكم والجهات أو الأشخاص المخولين بالسلطة، مع تجنب التعبير الملتبس «القوات».
- source_word: μὴ μεριμνήσητε
  choice: فلا تقلقوا
  rationale: ينقل النهي عن الانشغال القَلِق بعبارة عربية حديثة ومباشرة.
- source_word: πῶς ἢ τί
  choice: كيف أو بماذا
  rationale: 'يمثل عنصري العبارة اليونانية: كيفية الدفاع ومضمونه أو وسيلته، بصياغة عربية سليمة.'
- source_word: ἀπολογήσησθε
  choice: تدافعون عن أنفسكم
  rationale: ينقل الدلالة القضائية للفعل وصيغته الوسطى بوضوح وطبيعية.
- source_word: ἢ τί εἴπητε
  choice: أو ماذا تقولون
  rationale: يحفظ الجملة الموازية التي تتناول ما سيقولونه عمومًا، بعد الإشارة إلى دفاعهم.
theological_decisions: []
