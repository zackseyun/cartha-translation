  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «أصحاب السلطة» بدل «السلطات» للحفاظ على التوازي مع الحكّام، وأُبقيت «المجامع» في المتن مع توضيح وظيفتها القضائية المحتملة في الحاشية.
