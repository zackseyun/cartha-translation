revisions:
- from: ولكن متى أحضروكم أمام المجامع والحكّام وأصحاب السلطة[a]، فلا تقلقوا بشأن كيف أو بماذا تدافعون عن أنفسكم[b]، أو ماذا تقولون.
  to: ولكن متى أحضروكم أمام المجامع والحكام والسلطات[a]، فلا تقلقوا بشأن كيف أو ماذا تقولون دفاعًا عن أنفسكم[b]، أو ماذا تقولون.
  rationale: يصحح التعديل دلالة «ماذا» في سؤال محتوى الدفاع، ويستبدل «أصحاب السلطة» بـ«السلطات» لمقابل مؤسسي عربي طبيعي. وتبقى البنية ذاتها، بما فيها التكرار الظاهر لـ«ماذا تقولون»، لأنه يعكس البنية اليونانية ولا يقتضي تفسيرًا عقائديًا.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:25Z'
review_pass:
  verdict: revise
  source_fidelity: يحتاج النص إلى تعديل محدود في «بماذا تدافعون عن أنفسكم». فـτί هنا تقابلها «ماذا» بوصفها مضمون الدفاع، لا وسيلته؛ كما أن ἀπολογήσησθε تحمل دلالة الدفاع في سياق مثول قضائي. وتحافظ الصياغة المنقحة على التمييز اليوناني بين ما يقال دفاعًا وبين ما يقال عمومًا.
  naturalness: «أمام المجامع والحكام والسلطات» عربية فصيحة واضحة في سياق الاستجواب. و«كيف أو ماذا تقولون دفاعًا عن أنفسكم» أسلس وأدق من «كيف أو بماذا تدافعون عن أنفسكم».
  terminology: «المجامع» تحافظ على اللفظ الأصلي دون حسمٍ تفسيري بأنها محاكم، وتشرح الحاشية وظيفتها المحتملة. «السلطات» أفصح وأشمل من «أصحاب السلطة» لترجمة ἐξουσίας في هذا التعداد المؤسسي، مع بقاء «الحكام» لترجمة ἀρχάς.
  issues:
  - severity: medium
    issue: ترجمة τί بـ«بماذا» في عبارة الدفاع
    rationale: تفيد «بماذا» غالبًا الأداة أو الوسيلة، في حين أن τί في هذا التركيب يسأل عن مضمون ما يقوله الشخص في دفاعه. والصياغة المقترحة تنقل هذا المعنى دون طمس التوازي المقصود مع «أو ماذا تقولون» اللاحقة.
  - severity: low
    issue: «أصحاب السلطة» أقل طبيعية وأضيق من «السلطات»
    rationale: ἐξουσίαι تشير في السياق إلى السلطات أو الجهات ذات الصلاحية، لا يلزم أن تقتصر على أفراد؛ و«السلطات» هي المقابل العربي المؤسسي المألوف.
