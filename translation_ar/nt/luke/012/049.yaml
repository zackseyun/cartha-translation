  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: ar
  text: جئتُ لأُلقي نارًا على الأرض، وكم أتمنى لو كانت قد اشتعلت بالفعل![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على نحو أقرب إلى الحرفية: «وماذا أريد إن كانت قد أُضرمت بالفعل؟» العبارة اليونانية صعبة، والمتن يعكس معناها الاصطلاحي الراجح بوصفها تعبيرًا عن شدة التمني.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: نارًا
  rationale: يحافظ على الصورة المجازية من غير أن يفسرها في المتن بأنها دينونة أو تطهير أو غير ذلك، والتنكير طبيعي في العربية هنا.
- source_word: ἦλθον
  choice: جئتُ
  rationale: ينقل صيغة الماضي ودلالتها على مجيء يسوع بقصد أو رسالة، بعبارة عربية طبيعية ومباشرة.
- source_word: βαλεῖν
  choice: لأُلقي
  rationale: يحفظ قوة فعل الرمي في الأصل وصورته الحية، وهو أفصح وأنسب للنبرة من «لأجلب».
- source_word: ἐπὶ τὴν γῆν
  choice: على الأرض
  rationale: ينقل المعنى الأوسع المحتمل لـγῆ، من غير تضييقه إلى أرض أو إقليم محلي.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: وكم أتمنى لو كانت قد اشتعلت بالفعل!
  rationale: يعكس الفهم الاصطلاحي الراجح للعبارة الصعبة بوصفها تعبيرًا قويًا عن التمني، مع إثبات الصياغة الأقرب إلى الحرفية في الحاشية.
- source_word: ἤδη
  choice: بالفعل
  rationale: يؤدي معنى تحقق الاشتعال قبل الآن أو بحلوله، ويأتي طبيعيًا مع «قد اشتعلت».
- source_word: ἀνήφθη
  choice: كانت قد اشتعلت
  rationale: ينقل المبني للمجهول اليوناني دلاليًا بصيغة عربية طبيعية؛ فالنار هي التي اشتعلت من غير تعيين الفاعل.
theological_decisions:
- issue: دلالة «النار» في قول يسوع
  choice: الإبقاء على الاستعارة «نارًا» بلا تفسير
  alternative: الدينونة، أو التطهير، أو الروح القدس، أو الأزمة والانقسام الناشئان عن رسالة يسوع
  rationale: الآية لا تعرّف الاستعارة صراحة، لذلك ينبغي حفظ تعدد إيحاءاتها والتوتر اللاهوتي فيها بدل حسمه داخل الترجمة.
- issue: قوة العبارة الصعبة τί θέλω εἰ ἤδη ἀνήφθη
  choice: صياغتها تعجبًا دالًا على شدة التمني
  alternative: 'السؤال الأقرب إلى الحرفية: «وماذا أريد إن كانت قد اشتعلت بالفعل؟»'
  rationale: البنية اليونانية موجزة وملتبسة، والفهم التعجبي ينسجم مع السياق ويعطي عربية واضحة، مع حفظ الوجه الحرفي البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «أُلقي» للمحافظة على حيوية الصورة، وحُفظ غموض «النار» من غير إدخال تفسير مذهبي. وُضعت علامة الحاشية بعد الجملة التي تشرحها.
