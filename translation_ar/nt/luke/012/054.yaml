  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: ar
  text: 'وكان يقول أيضًا للجموع: «متى رأيتم سحابةً ترتفع من جهة الغرب، تقولون فورًا: "مطر غزير قادم[a]"، فيحدث الأمر هكذا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مطر قادم». يمكن أن تدل الكلمة اليونانية ὄμβρος على المطر عمومًا أو، على نحو أخص، على المطر الغزير.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: وكان يقول
  rationale: يحفظ صيغة الماضي الناقص الدالة هنا على كلام مستمر أو متكرر في خلفية السرد، بصياغة عربية طبيعية.
- source_word: δὲ καὶ
  choice: أيضًا
  rationale: تنقل القوة الإضافية في التركيب، بينما يؤدي سياق العربية ووصل الجملة وظيفة δέ من غير إثقال.
- source_word: τοῖς ὄχλοις
  choice: للجموع
  rationale: يحفظ صيغة الجمع الصريحة في اليونانية، وهو تعبير عربي واضح ومألوف.
- source_word: Ὅταν ἴδητε
  choice: متى رأيتم
  rationale: ينقل الشرط العام المتكرر أو المتوقع، ويحافظ على معنى الزمن والاحتمال في ὅταν مع صيغة الشرط.
- source_word: νεφέλην
  choice: سحابةً
  rationale: اللفظة تعني سحابة من غير أن تصفها صراحة بأنها ممطرة؛ ويفهم ذلك من السياق.
- source_word: ἀνατέλλουσαν
  choice: ترتفع
  rationale: يحفظ صورة السحابة وهي تصعد أو تظهر في الأفق.
- source_word: ἐπὶ δυσμῶν
  choice: من جهة الغرب
  rationale: تعبير عربي طبيعي يحفظ الدلالة الاتجاهية للغرب في سياق مراقبة الطقس، من غير إضافة صورة «الأفق» غير المذكورة صراحة.
- source_word: εὐθέως
  choice: فورًا
  rationale: ينقل معنى المبادرة والسرعة بإيجاز ووضوح.
- source_word: λέγετε
  choice: تقولون
  rationale: المضارع العربي مناسب للفعل المعتاد في هذا القول العام.
- source_word: ὅτι
  choice: علامتا الاقتباس
  rationale: ὅτι تقدم مضمون القول، وتمثيله باقتباس مباشر هو الأسلوب العربي الطبيعي.
- source_word: Ὄμβρος
  choice: مطر غزير
  rationale: يمكن أن تدل اللفظة على المطر عمومًا، وقد تدل على مطر شديد أو هطول غزير؛ اختير التعبير الأخص في المتن مع توثيق البديل في الحاشية.
- source_word: ἔρχεται
  choice: قادم
  rationale: يحفظ صورة اقتراب المطر والقوة الوشيكة للفعل المضارع في هذا السياق.
- source_word: καὶ γίνεται οὕτως
  choice: فيحدث الأمر هكذا
  rationale: صياغة عربية واضحة تحافظ على تحقق التوقع كما قيل، من غير تحديد زائد لطبيعة الحدث.
