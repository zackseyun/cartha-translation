base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: ar
  text: أَمَّا ذَلِكَ الْعَبْدُ الَّذِي عَرَفَ إِرَادَةَ سَيِّدِهِ، وَلَمْ يَسْتَعِدَّ أَوْ يَعْمَلْ بِحَسَبِ إِرَادَتِهِ، فَسَيُضْرَبُ ضَرَبَاتٍ كَثِيرَةً.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «فسيُضرَب كثيرًا». يورد النص اليوناني صفة «كثيرة» ويترك الاسم، أي «ضربات»، مفهومًا من السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: العبد
  rationale: يدل اللفظ على شخص خاضع لسلطة سيده، لا على أجير؛ و«العبد» هو المقابل العربي المباشر والطبيعي في سياق المثل.
- source_word: γνοὺς
  choice: عَرَفَ
  rationale: ينقل المعرفة السابقة بإرادة السيد بصياغة عربية واضحة، من غير إثقال النص بمحاكاة صيغة اسم الفاعل اليونانية.
- source_word: θέλημα
  choice: إرادة
  rationale: «إرادة» تعبر بوضوح عن مشيئة السيد وما يريده من عبده، وهي ملائمة للسياق.
- source_word: κυρίου αὐτοῦ
  choice: سَيِّدِهِ
  rationale: يشير κύριος هنا إلى صاحب السلطة على العبد داخل المثل؛ لذلك «سيده» أدق سياقيًا من استعمال لقب ديني مباشر.
- source_word: μὴ ἑτοιμάσας
  choice: لم يستعدّ
  rationale: الفعل متعدٍّ في اليونانية من غير مفعول مذكور، و«لم يستعدّ» يحافظ طبيعيًا على هذا الإطلاق من دون اختراع مفعول.
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: أو يعمل بحسب إرادته
  rationale: تنقل العبارة عدم القيام بما يوافق إرادة السيد، مع الحفاظ على العطف «أو» الوارد في النص.
- source_word: δαρήσεται
  choice: فسيُضرَب
  rationale: يحافظ المبني للمجهول على صيغة المستقبل المبني للمجهول في الأصل وعلى صورة العقاب الجسدي في المثل.
- source_word: πολλάς
  choice: ضربات كثيرة
  rationale: الصفة اليونانية جمع مؤنث وقد حُذف موصوفها المفهوم من السياق؛ وإظهار «ضربات» ضروري لوضوح العربية ويحفظ الصورة المحسوسة.
theological_decisions:
- issue: دلالة κύριος في إطار المثل
  choice: سيده
  alternative: ربه
  rationale: العلاقة المباشرة في العبارة هي علاقة عبد بسيده داخل بيت، واختيار «سيده» يحفظ هذه الصورة من غير أن يمنع الدلالة الأوسع للمثل أو يحول الكلمة في الجملة نفسها إلى لقب إلهي صريح.
- issue: العبارة العقابية المختصرة πολλάς
  choice: ضربات كثيرة
  alternative: ضربًا كثيرًا / عقابًا شديدًا
  rationale: الأصل يضمر اسمًا مثل «ضربات»، ولذلك يحافظ الاختيار على ملموسية الصورة وعدد الضربات، بدل تحويلها تفسيريًا إلى مجرد شدة العقاب.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «أمّا... فـ» لإبراز المقابلة التي تفيدها δέ، وحُفظ توازي الفعلين «يستعدّ» و«يعمل» من غير إضافة مفعول غير مذكور في الأصل.
