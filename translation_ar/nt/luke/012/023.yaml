translation:
  language: ar
  text: لأن الحياة[a] أعظم من الطعام، والجسد أعظم من اللباس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «النفس»: يمكن أن تعني الكلمة اليونانية ψυχή «الحياة» أو «الذات» أو «النفس»؛ ويرجّح السياق هنا معنى «الحياة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: لأن
  rationale: تربط العبارة بما قبلها بوصفها تعليلًا للنهي عن القلق، وهو استعمال عربي طبيعي يحفظ القوة التفسيرية للأداة.
- source_word: ψυχή
  choice: الحياة
  rationale: يدل السياق، حيث الطعام وتدبير الاحتياجات الجسدية، على حياة الإنسان، لا على النفس بمعناها غير المادي على وجه التحديد.
- source_word: πλεῖόν
  choice: أثمن من
  rationale: يفيد التركيب المقارنة وتجاوز القيمة؛ و«أثمن من» يوضح أن المقصود ليس مجرد الزيادة الكمية بل علو القيمة، من غير إضافة تفسير عقائدي.
- source_word: τροφή
  choice: الطعام
  rationale: المقابل العربي الواضح والطبيعي في سياق الأكل والاحتياجات اليومية.
- source_word: σῶμα
  choice: الجسد
  rationale: يشير إلى الجسد المادي في موازاة اللباس، وهو المقابل العربي المباشر.
- source_word: ἔνδυμα
  choice: اللباس
  rationale: لفظ عربي معاصر عام يدل على ما يُلبس ويوافق صيغة الاسم المفرد ذي الدلالة الجمعية في السياق.
theological_decisions:
- issue: دلالة ψυχή في تعليم عن القلق والتدبير
  choice: الحياة
  alternative: النفس
  rationale: الموازاة بين ψυχή والطعام، وبين الجسد واللباس، تشير إلى الحياة الأرضية التي يُحتاج إلى الطعام لبقائها. وتُذكر «النفس» في الحاشية للمحافظة على الاتساع الدلالي للكلمة اليونانية من غير فرض معنى أنثروبولوجي أضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. أُعيد وصف المقارنة في الشطر الثاني لتحقيق التوازن الطبيعي وإظهار أن πλεῖόν مفهوم فيه أيضًا. وُضعت علامة الحاشية بعد الجملة لأنها تتصل بلفظ «الحياة» الوارد في أولها.
