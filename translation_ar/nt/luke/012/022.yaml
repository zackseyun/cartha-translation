  source_fidelity: 'الترجمة أمينة للنص اليوناني: «ثم قال» تؤدي δέ بوصفها رابطًا سرديًّا خفيفًا، و«لتلاميذه» تحافظ على ضمير الملكية، و«لهذا أقول لكم» تنقل القوة الاستنتاجية لـ Διὰ τοῦτο λέγω ὑμῖν. كما أن «لا تقلقوا ... بشأن ما تأكلون ... ما تلبسون» تؤدي النهي عن القلق المتصل بالطعام واللباس دون زيادة تفسيرية.'
