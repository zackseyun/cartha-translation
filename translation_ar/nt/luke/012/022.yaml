  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: ar
  text: 'ثم قال لتلاميذه: «لهذا أقول لكم: لا تقلقوا[a] على حياتكم[b] بشأن ما تأكلون، ولا على أجسادكم بشأن ما تلبسون».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لا تحملوا همًّا».
    reason: lexical_alternative
  - marker: b
    text: أو «نفوسكم»؛ والكلمة اليونانية هنا تُستعمل بمعنى «الحياة»، أي وجود الإنسان في هذه الدنيا.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: ثم قال
  rationale: تفيد δέ هنا انتقالًا سرديًّا خفيفًا، و«ثم» تؤديه طبيعيًّا من غير أن تضيف معنى تعارض قوي.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: لتلاميذه
  rationale: تحافظ الصياغة على ضمير الملكية الصريح αὐτοῦ، وتستعمل المقابل العربي المألوف لـ μαθηταί.
- source_word: Διὰ τοῦτο
  choice: لهذا
  rationale: تشير العبارة إلى ما سبق وتقدم نتيجة أو استنتاجًا منه؛ و«لهذا» واضحة وموجزة.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ترجمة مباشرة وطبيعية تحتفظ بصيغة المخاطبة.
- source_word: μὴ μεριμνᾶτε
  choice: لا تقلقوا
  rationale: يدل الفعل هنا على الانشغال القَلِق أو حمل الهم؛ و«لا تقلقوا» واضحة في العربية المعاصرة.
- source_word: τῇ ψυχῇ
  choice: على حياتكم
  rationale: تشير ψυχή في هذا السياق إلى الحياة الأرضية التي يقيمها الطعام، لا بالضرورة إلى النفس بوصفها كيانًا غير مادي.
- source_word: τί φάγητε
  choice: بشأن ما تأكلون
  rationale: تنقل الصياغة مضمون القلق المتعلق بالطعام، ويؤدي المضارع العربي الدلالة المستقبلية السياقية طبيعيًّا.
- source_word: μηδὲ τῷ σώματι
  choice: ولا على أجسادكم
  rationale: تحافظ «ولا» على التنسيق السلبي، ويعبّر الجمع العربي عن أجساد المخاطَبين المتعددين بوضوح.
- source_word: τί ἐνδύσησθε
  choice: بشأن ما تلبسون
  rationale: الفعل المتوسط يعني ارتداء الثياب، و«ما تلبسون» تعبير عربي طبيعي موازٍ لـ«ما تأكلون».
theological_decisions:
- issue: دلالة ψυχή في هذا السياق
  choice: حياتكم
  alternative: نفوسكم
  rationale: الموازاة بين الطعام للحياة والكساء للجسد ترجّح معنى الوجود أو الحياة الأرضية. ويجنب هذا الاختيار فرض معنى أنثروبولوجي تقني لا يقتضيه السياق، مع إثبات البديل الحرفي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي التوازي بين الحياة والطعام وبين الجسد واللباس، ووُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
