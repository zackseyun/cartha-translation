source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: ar
  text: سيأتي سيد ذلك العبد في يوم لا يتوقع مجيئه، وفي ساعة لا يعرفها، وسيقطّعه نصفين[a]، ويجعل نصيبه مع غير الأمناء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو يُفهم التعبير بمعنى: «يعاقبه عقابًا شديدًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «غير المؤمنين».'
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: سيد
  rationale: يدل السياق على سيد العبد في المثل، لا على استعمال «الرب» بوصفه لقبًا مباشرًا.
- source_word: δοῦλος
  choice: عبد
  rationale: يحفظ علاقة التبعية والملكية الظاهرة في سياق البيت، وهو أفصح وأدق من تلطيفها إلى «خادم».
- source_word: ἥξει
  choice: يأتي
  rationale: المضارع العربي مناسب لاستقبال الحدث في سياق التحذير، وينقل معنى وصول السيد ببساطة وطبيعية.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: في يوم لا يتوقع مجيئه
  rationale: المفعول محذوف في اليونانية ويفهم من السياق؛ وإظهار «مجيئه» يزيل التباس الضمير في العربية من غير توسع.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: في ساعة لا يعرفها
  rationale: يحافظ على الفرق بين عدم التوقع في العبارة الأولى وعدم المعرفة في الثانية.
- source_word: διχοτομήσει
  choice: يقطّعه نصفين
  rationale: ينقل الصورة الحرفية القاسية للفعل، أي الشطر إلى قسمين، بدل تلطيفها إلى عقوبة شديدة؛ وتذكر الحاشية الفهم الاصطلاحي الممكن.
- source_word: τὸ μέρος αὐτοῦ
  choice: نصيبه
  rationale: المعنى المباشر هو الجزء أو الحصة؛ و«نصيبه» طبيعي في العربية ويحفظ صورة المصير المعين له.
- source_word: ἀπίστων
  choice: غير الأمناء
  rationale: يناسب موضوع الأمانة والخيانة في المثل، مع إبقاء معنى «غير المؤمنين» الممكن في الحاشية.
- source_word: θήσει
  choice: يجعل
  rationale: ينقل معنى وضع نصيبه أو تعيينه مع جماعة معينة بصياغة عربية طبيعية.
theological_decisions:
- issue: هل تُنقل صورة العقوبة حرفيًا أم تُفهم اصطلاحيًا بمعنى العقاب الشديد؟
  choice: 'إبقاء الصورة الصريحة: «يقطّعه نصفين»'
  alternative: «يعاقبه عقابًا شديدًا»
  rationale: الفعل اليوناني يرسم صورة الشطر إلى قسمين، ولا يحسم السياق وحده أنها مجرد اصطلاح؛ لذلك بقيت الصورة في المتن وذُكر الفهم المجازي في الحاشية.
- issue: هل يدل ἀπίστων على عدم الأمانة أم عدم الإيمان؟
  choice: «غير الأمناء»
  alternative: «غير المؤمنين»
  rationale: سياق المثل المباشر هو أمانة العبد لسيده، لكن اللفظة اليونانية تحتمل أيضًا معنى عدم الإيمان، ولا سيما في سياق الدينونة؛ فحُفظ البديل في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ومهيبة. استُعمل «العبد» للمحافظة على علاقة السيد بالعبد في المثل، ووُضعت علامتا الحاشيتين بعد اللفظتين اللتين تتعلقان بهما مباشرة.
