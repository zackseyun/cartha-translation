base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: ar
  text: طُوبَى لِذَلِكَ الْعَبْدِ الَّذِي يَجِدُهُ سَيِّدُهُ، عِنْدَمَا يَأْتِي، يَفْعَلُ هَكَذَا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «طُوبَى لِذَلِكَ الْعَبْدِ الَّذِي يَجِدُهُ رَبُّهُ، عِنْدَمَا يَأْتِي، يَفْعَلُ هَكَذَا». يمكن أن تعني الكلمة اليونانية «السيد» في إطار المثل المنزلي، أو «الرب» بالنظر إلى التطبيق الأوسع.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: طُوبَى
  rationale: تنقل صيغة التطويب وما تحمله من وزن ديني، بدل قصر المعنى على شعور السعادة أو حسن الحظ.
- source_word: δοῦλος
  choice: العبد
  rationale: يدل اللفظ اليوناني على شخص مملوك وخاضع لسلطة سيده؛ و«العبد» يحفظ هذه العلاقة بوضوح في سياق المثل المنزلي.
- source_word: ἐκεῖνος
  choice: ذلك
  rationale: يحفظ اسم الإشارة وما فيه من تخصيص وتوكيد.
- source_word: κύριος
  choice: سيده
  rationale: يناسب علاقة ربّ البيت بعبده في الصورة المباشرة للمثل، مع إبقاء احتمال «ربه» ذي الصدى اللاهوتي في الحاشية.
- source_word: ἐλθὼν
  choice: عندما يأتي
  rationale: صياغة زمنية عربية طبيعية تحفظ ترتيب المجيء والعثور.
- source_word: εὑρήσει
  choice: يجد
  rationale: المضارع العربي بعد تركيب الجملة الموصولة والزمنية يؤدي معنى المستقبل بحسب السياق بصورة طبيعية.
- source_word: ποιοῦντα οὕτως
  choice: يفعل هكذا
  rationale: تعبير موجز يعود إلى السلوك الموصوف سابقًا، ويحفظ دلالة οὕτως دون إطناب.
theological_decisions:
- issue: احتمال الصدى المسيحاني للفظ κύριος في مثل يتحدث عن مجيء السيد
  choice: «سيده» في المتن
  alternative: «ربه»
  rationale: المعنى المباشر في صورة المثل هو سيد العبد في البيت، لكن سياق لوقا الأوسع قد يستدعي مجيء الرب؛ لذلك حُفظ الاحتمال الآخر في الحاشية بدل حسم التوتر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، بصياغة قريبة من بنية الأصل من غير جمود. استُعمل الضبط الجزئي/الكامل في نص الآية لتيسير القراءة، وحُفظ التوتر بين المعنى المنزلي والبعد اللاهوتي في الحاشية.
