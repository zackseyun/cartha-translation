  source_fidelity: 'ينقل النص عناصر اليونانية بدقة: «طوبى» لـ μακάριος، و«ذلك العبد» مع قوة اسم الإشارة، و«سيده» في إطار المثل، والجملة الزمنية «عندما يأتي»، ثم العثور عليه «يفعل هكذا». والمضارع العربي في هذا التركيب مفهوم مستقبلًا بحسب السياق، موافقًا لـ εὑρήσει.'
  naturalness: الصياغة فصيحة واضحة ووقورة، وترتيب «الذي يجده سيده، عندما يأتي» طبيعي ومفهوم؛ ويعود ضمير «يأتي» إلى السيد بوضوح من السياق النحوي. و«يفعل هكذا» سليمة وتحافظ على الإحالة الموجزة إلى السلوك المذكور سابقًا.
  terminology: «العبد» و«سيده» مناسبان لصورة البيت في المثل ولا يخففان علاقة التبعية التي في δοῦλος. والحاشية تحفظ، من غير فرض تفسير، إمكان قراءة κύριος بمعنى «ربه» في ضوء الصدى الأوسع. «طوبى» مصطلح عربي كتابي راسخ لصيغة التطويب.
