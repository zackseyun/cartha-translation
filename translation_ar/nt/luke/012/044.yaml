  text: ἀληθῶς λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: ar
  text: 'الحق أقول لكم: إنه سيقيمه على جميع ما له.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على جميع ممتلكاته»، أو: «على كل أملاكه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθῶς
  choice: الحق
  rationale: تعبير عربي فصيح وطبيعي يحفظ توكيد صدق القول وجلاله في صيغة كلام يسوع.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ينقل صيغة الخطاب المباشر وسلطان التصريح مع المحافظة على ترتيب عربي طبيعي.
- source_word: ὅτι
  choice: إنه
  rationale: تدخل مضمون القول في العربية، والضمير يعود إلى السيد المذكور في السياق.
- source_word: ἐπὶ
  choice: على
  rationale: تفيد هنا الولاية والإشراف عند اقترانها بفعل الإقامة.
- source_word: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: جميع ما له
  rationale: صياغة جامعة وموجزة تشمل كل ما يملكه من غير حصر المعنى في نوع معين من الممتلكات.
- source_word: καταστήσει
  choice: سيقيمه
  rationale: يفيد الفعل في السياق تعيين شخص وإسناد سلطة أو مسؤولية إليه؛ و«يقيمه على» تعبير عربي واضح يحفظ هذه الدلالة.
- source_word: αὐτόν
  choice: ـه
  rationale: يحفظ ضمير المذكر المفرد العائد إلى العبد الأمين في سياق المثل.
theological_decisions:
- issue: ضمائر المذكر في سياق المثل
  choice: الإبقاء على المذكر المفرد في «سيقيمه»
  alternative: استخدام تعبير محايد مثل «سيقيم ذلك الشخص»
  rationale: النص اليوناني يشير بصيغة المذكر المفرد إلى الشخصية الذكورية في المثل، ولا داعي إلى تحييدها أو توسيع مرجعها داخل نص الآية.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدمت الصيغة المألوفة «الحق أقول لكم» لحفظ التوكيد، و«سيقيمه على» لنقل معنى التعيين في موضع سلطة من غير شرح زائد.
