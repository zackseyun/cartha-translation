base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: ar
  text: 'وأقول لكم: كلُّ من يعترف بي أمام الناس، فإن ابنَ الإنسان أيضًا سيعترف به أمام ملائكة الله.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «كلُّ من يقرّ بي أمام الناس، فإن ابن الإنسان أيضًا سيقرّ به أمام ملائكة الله». والفعل اليوناني يدل هنا على الإقرار أو الاعتراف العلني.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: وأقول لكم
  rationale: تؤدي صيغة الحاضر معنى التصريح المؤكد، وتصل الواو الكلام بسياقه من غير المبالغة في معنى الاستدراك الذي قد توحي به «لكن».
- source_word: πᾶς ὃς ἂν
  choice: كلُّ من
  rationale: تركيب عربي طبيعي يحفظ العموم والشرط غير المحدد في الأصل.
- source_word: ὁμολογήσῃ ... ὁμολογήσει
  choice: يعترف ... يعترف
  rationale: يحفظ تكرار الفعل اليوناني والتقابل بين اعتراف الإنسان العلني بيسوع واعتراف ابن الإنسان به. و«يعترف بـ» هنا بمعنى يقرّ علنًا ولا تعني الاعتراف بخطيئة.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: بي ... به
  rationale: الباء مع «يعترف» هي الصياغة العربية المألوفة لهذا الإقرار الشخصي، وتنقل معنى التركيب اليوناني الاصطلاحي من غير حرفية غريبة مثل «يعترف فيَّ».
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: أمام الناس
  rationale: «الناس» تؤدي معنى ἀνθρώπων العام، أي البشر، بوضوح طبيعي في العربية؛ وليس المقصود الرجال دون النساء.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب المعروف وإيحاءاته الكتابية، من غير تفسير أو إعادة صياغة عقائدية.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: أمام ملائكة الله
  rationale: ترجمة مباشرة تحفظ مشهد الإقرار العلني في الحضرة السماوية.
theological_decisions:
- issue: صيغة الاعتراف المتبادل مع ἐν وحالة المجرور
  choice: «يعترف بي ... يعترف به»
  alternative: «يعترف فيَّ ... يعترف فيه» أو «يقرّ بي ... يقرّ به»
  rationale: الصياغة المختارة عربية سليمة وتحفظ التوازي اللفظي والمعنوي من غير أن تضيف معنى الولاء أو الشفاعة صراحةً، وهما أضيق من دلالة النص.
- issue: دلالة ἀνθρώπων من جهة الجنس
  choice: «الناس»
  alternative: «الرجال»
  rationale: اللفظ اليوناني هنا عام يشمل البشر، لا الذكور وحدهم. واختيار «الناس» ينقل المرجع المقصود في العربية المعاصرة من غير طمس تمييز دلالي قائم في الأصل، إذ لا يوجد في السياق تخصيص للرجال.
- issue: زمن ὁμολογήσει في الجملة الثانية
  choice: «يعترف» في سياق جواب الشرط، بدلالة مستقبلية عربية مفهومة
  alternative: «فسوف يعترف» أو «سيعترف»
  rationale: المضارع العربي بعد تركيب «كل من» يؤدي النتيجة العامة والمستقبلية طبيعيًا، ويحافظ على التوازي مع الفعل الأول. ويمكن التصريح بالسين، لكنه أقل سلاسة في هذا التقابل الموجز.
translation_notes:
  register: لغة عربية فصحى واضحة ومهيبة من غير تقعر. استُخدم «يعترف بي» حفاظًا على تكرار الفعل في شطري الآية، وأُضيفت حاشية لتوضيح دلالته العلنية وتقديم البديل «يقرّ». وُضعت علامة الحاشية في نهاية الآية لأنها تتناول الفعل المتكرر في الجملتين.
