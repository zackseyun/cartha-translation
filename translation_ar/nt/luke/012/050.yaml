  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: ar
  text: لكن أمامي معمودية لا بد أن أتلقّاها[a][b]، وما أشدّ ضيقي[c] حتى تتمّ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن ترجمتها حرفيًا: «لي معمودية ينبغي أن أُعمَّد بها». فاليونانية تكرر صورة المعمودية في الاسم والفعل.'
    reason: lexical_alternative
  - marker: b
    text: «المعمودية» هنا صورة مجازية تشير إلى الألم الساحق الذي كان يسوع مقبلًا عليه.
    reason: alternative_reading
  - marker: c
    text: 'أو: «ما أشدّ ما أنا تحت ضغط»، أو «ما أشدّ الضغط الواقع عليّ»، حتى تتمّ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: معمودية
  rationale: يحافظ هذا اللفظ على صورة المعمودية المقصودة في اليونانية، بدل أن يستبدلها في المتن بتفسير مثل «الألم» أو «الموت».
- source_word: ἔχω βαπτισθῆναι
  choice: عليّ أن أعتمد بمعمودية
  rationale: تنقل العبارة معنى الأمر المقبل الذي لا بد من خوضه، وتحافظ في الوقت نفسه على تكرار صورة المعمودية في الاسم والفعل بصياغة عربية مفهومة.
- source_word: πῶς
  choice: ما أشدّ
  rationale: تؤدي معنى التعجب وشدة الحالة التي يعبّر عنها يسوع.
- source_word: συνέχομαι
  choice: الضيق الذي أنا فيه
  rationale: يعبر عن كونه واقعًا تحت ضغط شديد أو محصورًا من الداخل، من غير حصر اللفظ في انفعال نفسي واحد.
- source_word: ἕως ὅτου
  choice: إلى أن
  rationale: تحدد الغاية الزمنية للحالة المذكورة بصياغة عربية طبيعية.
- source_word: τελεσθῇ
  choice: تتمّ
  rationale: ينقل المبني للمجهول ومعنى بلوغ الحد المقصود أو الاكتمال، من غير استيراد صياغة يوحنا 19:30.
theological_decisions:
- issue: المراد المجازي من «المعمودية»
  choice: الإبقاء على صورة المعمودية في المتن، مع بيان أنها تشير في السياق إلى الألم الساحق المقبل على يسوع.
  alternative: استبدال الصورة مباشرة بعبارة «عذاب» أو «موت»، أو فهمها على أنها معمودية ماء حرفية.
  rationale: يشير السياق إلى آلام يسوع وموته المقبلين، لكن النص يتعمد التعبير بصورة المعمودية؛ لذلك ينبغي ألا تزيل الترجمة هذا التوتر الأدبي واللاهوتي.
- issue: دلالة συνέχομαι
  choice: الضيق الذي أنا فيه
  alternative: ما أشدّ انحصاري؛ أو ما أشدّ الضغط الواقع عليّ
  rationale: يتسع الفعل لمعاني الضيق والانحصار والضغط. واختيار «الضيق» واضح للقارئ الحديث من غير أن يحسم هل التركيز على الكرب النفسي أم الإحساس بالتقييد والضغط.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة ذات نبرة وقورة. أُبقيت صورة المعمودية صريحة، واستُخدم التعجب «ما أشدّ» لنقل قوة πῶς، مع تجنب الألفاظ القديمة مثل «أصطبغ» لأنها أقل وضوحًا للقارئ المعاصر.
