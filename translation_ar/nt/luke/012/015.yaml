  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: ar
  text: 'ثم قال لهم: «انتبهوا واحترسوا من كل طمع[a]، لأن حياة الإنسان لا تقوم على كثرة ما يملكه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل جشع». يمكن أن تدل الكلمة اليونانية πλεονεξία على الطمع أو الجشع أو النزعة إلى الاستحواذ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: انتبهوا
  rationale: فعل أمر للجمع يحمل قوة التحذير والتنبيه؛ و«انتبهوا» تعبير عربي معاصر واضح يحفظ هذا المعنى.
- source_word: φυλάσσεσθε
  choice: احترسوا
  rationale: صيغة الأمر الوسطى تفيد حماية المرء نفسه؛ و«احترسوا» تنقل معنى التحفظ الوقائي طبيعيًا مع فعل التنبيه السابق.
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: من كل طمع
  rationale: تشمل πλεονεξία الجشع والطمع والرغبة الاستحواذية، و«كل طمع» موجزة وتحفظ شمول πάσης من غير تضييق المعنى على اشتهاء ممتلكات الغير وحدها.
- source_word: ὅτι
  choice: لأن
  rationale: تقدم علة التحذير بوضوح وتحفظ القوة السببية للأداة اليونانية.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: حياة الإنسان لا تقوم على كثرة
  rationale: «لا تقوم على» تعبر طبيعيًا عن أن الحياة لا تتأسس أو تتحدد بوفرة الممتلكات، و«الإنسان» ينقل الدلالة العامة للضمير المفرد.
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: ما يملكه
  rationale: تشير العبارة إلى الأشياء التي تخص الإنسان أو مقتنياته؛ و«ما يملكه» عربية واضحة لا تحصرها في نوع معين من الممتلكات.
theological_decisions:
- issue: الدلالة العامة للتعبير المفرد المذكر
  choice: حياة الإنسان ... ما يملكه
  alternative: حياته ... ممتلكاته
  rationale: القول عام ولا يختص بالذكور؛ واستخدام «الإنسان» يحفظ الإفراد والدلالة التمثيلية الشاملة في عربية طبيعية.
- issue: مدى التحذير من πλεονεξία
  choice: كل طمع
  alternative: كل جشع
  rationale: «الطمع» يشمل التطلع الاستحواذي والرغبة في المزيد، ويحفظ اتساع التحذير من غير قصره على صورة قانونية أو مالية ضيقة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. جُمعت قوتا فعلي التحذير في «انتبهوا واحترسوا»، وحُفظت عمومية القول من غير إدخال تفسير طائفي أو تضييق أخلاقي غير موجود في المصدر.
