  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: ar
  text: ولكن إن كان الله يكسو هكذا عشب الحقل[a]، الذي يوجد اليوم ويُطرح غدًا في التنور[b]، فكم بالأحرى يكسوكم أنتم، يا قليلي الإيمان!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «كلأ الحقل» أو «نبات الحقل».
    reason: lexical_alternative
  - marker: b
    text: المقصود تنور الخبز؛ وكان من الممكن استعمال عشب الحقل اليابس وقودًا له.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: عشب
  rationale: تدل الكلمة على العشب أو الكلأ والنباتات الحقلية. و«عشب» لفظ عربي واضح وطبيعي، ويلائم سياق نبات الحقل السريع الزوال الذي يمكن تجفيفه واستعماله وقودًا.
- source_word: ἐν ἀγρῷ
  choice: الحقل
  rationale: تُدمج العبارة طبيعيًا في التركيب «عشب الحقل»، مع الحفاظ على الدلالة العامة لموضع العشب من غير تخصيص زائد.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: الذي يوجد اليوم ويُطرح غدًا
  rationale: يفك هذا التعبير التركيب اليوناني الموجز إلى صياغة عربية واضحة، ويحفظ التقابل الزمني بين وجود العشب اليوم وطرحه غدًا.
- source_word: κλίβανον
  choice: التنور
  rationale: تشير الكلمة إلى فرن للخبز، وغالبًا ما يكون طينيًا؛ و«التنور» مقابل عربي دقيق ومألوف في هذا السياق، بخلاف «الأتون» الذي قد يوحي بحرارة صناعية أو بصهر المعادن.
- source_word: ἀμφιέζει
  choice: يكسو
  rationale: الفعل يعني يُلبس أو يكسو. و«يكسو» فصيح واضح، ويحفظ صورة إلباس النبات التي يقوم عليها القياس بإلباس البشر.
- source_word: πόσῳ μᾶλλον
  choice: فكم بالأحرى
  rationale: يحفظ هذا التعبير أسلوب الاستدلال من الأقل إلى الأعظم، وهو طبيعي ومفهوم في العربية المعاصرة الفصيحة.
- source_word: ὀλιγόπιστοι
  choice: يا قليلي الإيمان
  rationale: يحفظ صيغة النداء المباشر والتوبيخ اللطيف، من غير تحويل العبارة إلى حكم عقائدي تقني بشأن الخلاص أو الارتداد.
- source_word: εἰ δὲ
  choice: ولكن إن كان
  rationale: «ولكن» تصل الكلام بما قبله مع شيء من المقابلة، و«إن كان» تحافظ على الصيغة الشرطية للحجة.
- source_word: ὁ θεὸς
  choice: الله
  rationale: الفاعل مذكور صراحة في النص اليوناني، والترجمة المباشرة هي الأنسب.
- source_word: οὕτως
  choice: هكذا
  rationale: تفيد هيئة الكسوة أو درجتها في هذا السياق، و«هكذا» واضحة وتحافظ على الإشارة إلى ما سبق من وصف زينة النبات.
theological_decisions:
- issue: دلالة ὀλιγόπιστοι في خطاب يسوع
  choice: 'نداء مباشر يتضمن توبيخًا لطيفًا: «يا قليلي الإيمان»'
  alternative: توبيخ شديد ينم عن الضجر، أو مجرد وصف محايد لضعف الثقة
  rationale: ينتقد اللفظ قصور ثقتهم بعناية الله، لكنه لا يقرر بذاته تعليمًا تقنيًا عن الإيمان المخلِّص أو الارتداد. وتحفظ الصياغة العربية مباشرة الخطاب والتوتر الرعوي من غير تشديد أو تلطيف زائد.
- issue: زمن الكسوة في جواب الشرط
  choice: «يكسوكم» بالمضارع العربي
  alternative: «سيكسوكم» بالمستقبل الصريح
  rationale: جواب القياس مفهوم من الفعل اليوناني المذكور في صدر الجملة، والمضارع العربي يؤدي معنى عناية الله العامة وامتدادها إلى المخاطَبين من غير فرض تقييد زمني غير مصرح به.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة من غير تقعر. استُعمل «عشب الحقل» و«التنور» لصون الصورة الزراعية والثقافية، ووُضع مؤشر الحاشية الثقافية عند «التنور» لأنه موضع الإيضاح المقصود.
