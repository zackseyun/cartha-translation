  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: ar
  text: 'فقال بطرس: «يا رب، أتقول لنا هذا المثل، أم أيضًا للجميع؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: فقال
  rationale: الفعل هو ماضي λέγω، فحُفظ معنى القول بدل تحويله إلى «سأل»، مع إظهار الاستفهام بصياغة الكلام وعلامة الاستفهام.
- source_word: δὲ
  choice: فـ
  rationale: تؤدي الفاء انتقالًا سرديًّا طبيعيًّا واستمرارًا في السياق، من غير إثقال العبارة بأداة زمنية صريحة.
- source_word: Κύριε
  choice: يا رب
  rationale: «رب» المقابل المعتاد لـ κύριος، وأداة النداء لازمة في العربية الطبيعية عند مخاطبة يسوع مباشرة.
- source_word: πρὸς ἡμᾶς
  choice: ألنا
  rationale: اللام مع ضمير المتكلمين تؤدي جهة توجيه الكلام في عربية موجزة وطبيعية، مع بقاء المقابلة مع «للجميع».
- source_word: τὴν παραβολὴν ταύτην
  choice: هذا المثل
  rationale: «المثل» هو المقابل العربي المستقر لـ παραβολή في سياق تعليم يسوع، واسم الإشارة يطابق تركيب اليونانية.
- source_word: λέγεις
  choice: تقول
  rationale: المضارع العربي يحفظ زمن الفعل اليوناني، ويأتي طبيعيًّا في السؤال عن المخاطَبين بهذا التعليم.
- source_word: ἢ καὶ
  choice: أم ... أيضًا
  rationale: «أم» تلائم السؤال الذي يطرح بديلين، و«أيضًا» تحفظ القوة الإضافية لـ καί.
- source_word: πρὸς πάντας
  choice: للجميع
  rationale: ينقل اللفظ معنى πάντας العام الشامل من غير قصره على الذكور أو إضافة فئة غير مصرّح بها.
theological_decisions:
- issue: ترجمة κύριος في خطاب بطرس ليسوع
  choice: يا رب
  alternative: يا سيد
  rationale: «يا رب» تحفظ الدلالة الاحترامية وإمكان الصدى المسيحاني معًا، من غير أن تحسم وحدها مدى الدلالة اللاهوتية في هذا الموضع.
- issue: الجموع المذكر πάντας المستعمل استعمالًا عامًا
  choice: الجميع
  alternative: كل الناس
  rationale: «الجميع» يشمل جمهور السامعين الأوسع ويحفظ عمومية اللفظ اليوناني من غير تقييده بالذكور.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة ومهيبة. حُفظ فعل القول بدل استبداله بفعل السؤال، وحُفظت المقابلة بين «لنا» و«للجميع» مع دلالة «أيضًا».
