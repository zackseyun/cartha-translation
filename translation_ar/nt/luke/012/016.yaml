  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: ar
  text: 'وضرب لهم مثلًا قائلًا: «أثمرت أرضُ رجلٍ غنيٍّ محصولًا وفيرًا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أثمرت بوفرة»، أو: «كانت وافرة الإنتاج».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: ثم ضرب
  rationale: تؤدي «ثم» وظيفة الرابط السردي الخفيف، وتأتي «ضرب» طبيعية في العربية مع «مثلًا» بدل الترجمة الحرفية للفعل «قال».
- source_word: παραβολὴν
  choice: مثلًا
  rationale: «المثل» هو المقابل العربي المألوف لهذا الجنس التعليمي القصصي في الأناجيل.
- source_word: πρὸς αὐτοὺς
  choice: لهم
  rationale: تحفظ جهة الخطاب بصياغة عربية طبيعية ضمن التعبير «ضرب لهم مثلًا».
- source_word: λέγων
  choice: قائلًا
  rationale: تمثل اسم الفاعل اليوناني الذي يقدم مضمون المثل، وتحافظ على البنية بأسلوب عربي فصيح.
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: رجلٍ غنيٍّ
  rationale: تحفظ جنس المرجع ووصفه، ولا تستلزم τινός هنا في العربية إضافة «ما» أو «معيّن» لأن التنكير يؤدي المعنى طبيعيًا.
- source_word: εὐφόρησεν
  choice: تُنتج محصولًا وفيرًا
  rationale: ينقل المعنى الزراعي للفعل، أي جودة إنتاج الأرض ووفرته، بعبارة واضحة معاصرة.
- source_word: ἡ χώρα
  choice: أرضُ
  rationale: السياق زراعي، والمقصود أرض الرجل أو ملكه الزراعي لا بلدًا أو إقليمًا.
