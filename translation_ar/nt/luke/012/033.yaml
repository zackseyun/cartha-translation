  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: ar
  text: بيعوا ممتلكاتكم وأعطوا صدقةً[a]. اصنعوا لأنفسكم أكياسًا للنقود لا تبلى، وكنزًا لا ينفد في السماوات[b]، حيث لا يقترب سارق ولا يُتلف العثّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي قدّموا إحسانًا للمحتاجين؛ فاللفظ اليوناني يدل على أعمال الرحمة التي يُعبَّر عنها بالعطاء.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها «في السماء»؛ والصيغة في اليونانية هنا جمع: «في السماوات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πωλήσατε
  choice: بيعوا
  rationale: فعل أمر للجمع ينقل الدعوة المباشرة إلى البيع من غير إضافة معنى تصفية جميع الممتلكات.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: ممتلكاتكم
  rationale: تعبير عربي واضح وطبيعي يدل على ما يملكه المخاطبون.
- source_word: δότε ἐλεημοσύνην
  choice: أعطوا صدقةً
  rationale: يحافظ على فعل العطاء وعلى معنى الصدقة بوصفها إحسانًا ماديًا للمحتاجين، من غير حصرها في مؤسسة خيرية.
- source_word: ποιήσατε ἑαυτοῖς
  choice: اصنعوا لأنفسكم
  rationale: يحفظ صيغة الأمر والدلالة الانعكاسية التي تفيد العمل لمنفعة المخاطبين أنفسهم.
- source_word: βαλλάντια
  choice: أكياسًا للنقود
  rationale: ينقل الصورة المحسوسة لأكياس أو صرر كانت تُحفظ فيها النقود، ويتجنب لفظًا حديثًا قد يوحي بمحفظة معاصرة.
- source_word: μὴ παλαιούμενα
  choice: لا تبلى
  rationale: صياغة عربية موجزة وطبيعية لمعنى عدم التقادم أو الاهتراء.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: كنزًا لا ينفد
  rationale: يعبر بوضوح عن كنز لا يفشل ولا ينقص، ويحافظ على الصورة المجازية.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: في السماوات
  rationale: يحفظ صيغة الجمع الواردة في اليونانية، وهي مألوفة في الأسلوب الكتابي العربي.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: حيث لا يقترب سارق
  rationale: يحافظ على صورة الاقتراب المكانية وعلى نفي وصول السارق.
- source_word: οὐδὲ σὴς διαφθείρει
  choice: ولا يُتلف العثّ
  rationale: العثّ هو الحشرة المقصودة، و«يُتلف» يلائم ما تفعله بالثياب والمقتنيات ويحمل معنى الإفساد أو التدمير.
theological_decisions:
- issue: دلالة ἐλεημοσύνην في الوصية المتعلقة بالممتلكات
  choice: أعطوا صدقةً
  alternative: أعطوا الفقراء؛ تصدّقوا
  rationale: يحفظ الاختيار اسم العمل الوارد في الأصل وفعل العطاء، بينما توضح الحاشية أن المقصود إحسان عملي للمحتاجين؛ فلا يُحوَّل النص إلى مبدأ اقتصادي أوسع مما يقوله.
- issue: صيغة ἐν τοῖς οὐρανοῖς
  choice: في السماوات
  alternative: في السماء
  rationale: أُبقي الجمع لتمثيل صيغة الأصل والتعبير اليهودي والكتابي، من غير استنتاج تصور كوني أو عقائدي زائد.
- issue: العلاقة التصويرية بين أكياس النقود والكنز
  choice: 'الإبقاء على الاسمين متتابعين: «أكياسًا... وكنزًا»'
  alternative: تفسير أكياس النقود مباشرة بأنها الكنز
  rationale: يحافظ هذا على توتر الصورة وصياغة الأصل، ولا يحسم نحويًا أو تفسيريًا العلاقة الدقيقة بين الاستعارتين.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدمت «صدقة» لشيوعها ودقتها، و«أكياس للنقود» لصون الصورة القديمة من غير غموض، مع إبقاء «السماوات» جمعًا وفق الأصل.
