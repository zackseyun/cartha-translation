  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπε, τίς με κατέστησεν ⸀κριτὴν ἢ μεριστὴν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: ar
  text: 'فقال له: «يا إنسان، مَن أقامني عليكم قاضيًا أو مُقسِّمًا؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: يا إنسان
  rationale: نداء مباشر يحافظ على اللفظ اليوناني العام وعلى نبرته الرسمية المقتضبة، من غير إضافة اسم المخاطَب أو وصفه.
- source_word: κατέστησεν
  choice: أقامني
  rationale: ينقل معنى التعيين أو التنصيب في مهمة، وهو تعبير عربي فصيح مناسب للسياق.
- source_word: κριτὴν
  choice: قاضيًا
  rationale: المقابل المباشر لمن يفصل قضائيًا في النزاع.
- source_word: μεριστὴν
  choice: مُقسِّمًا
  rationale: يحافظ على التمييز المعجمي عن «قاضيًا» وينقل معنى من يتولى قسمة المال أو الميراث، بدل تفسيره تفسيرًا أوسع مثل «حَكَمًا».
- source_word: ἐφ’ ὑμᾶς
  choice: عليكم
  rationale: يحافظ على صيغة الجمع في الأصل، إذ يشمل المخاطَب والطرف الآخر في النزاع.
theological_decisions:
- issue: نطاق سؤال يسوع عن السلطة
  choice: صياغته سؤالًا عن مَن أقامه لهذه المهمة
  alternative: صياغته رفضًا مطلقًا لأي دور قضائي
  rationale: النص يسأل عن التعيين في هذا النزاع بعينه، ولا يصرّح بحكم لاهوتي شامل على كل سلطة قضائية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حوفظ على الإيجاز، وعلى الفرق بين وظيفة القاضي ووظيفة من يقسم المال، وعلى جمع «عليكم» في اليونانية.
