  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: ar
  text: أَتَظُنُّونَ أَنِّي جِئْتُ لِأُعْطِيَ[a] سَلَامًا عَلَى الْأَرْضِ[b]؟ كَلَّا، أَقُولُ لَكُمْ، بَلِ انْقِسَامًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأجلب». الفعل اليوناني يعني حرفيًّا «لأعطي»، لكن التعبير عن جلب السلام جائز بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «في الأرض» أو «في البلاد»، لكن المعنى الأوسع أرجح هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖτε
  choice: أَتَظُنُّونَ
  rationale: فعل مضارع موجَّه إلى جمع السامعين، يفتتح سؤالًا إنكاريًّا يتحدّى افتراضهم مباشرة.
- source_word: εἰρήνην
  choice: سَلَامًا
  rationale: المقابل العربي المباشر الذي يحفظ اتساع المعنى، مع دلالته السياقية على السلام والوئام بين الناس.
- source_word: παρεγενόμην
  choice: جِئْتُ
  rationale: ينقل الاستعمال الاصطلاحي للفعل في الحديث عن مجيء يسوع لغرض، وتليه هنا صيغة المصدر الدالة على الغاية.
- source_word: δοῦναι
  choice: لِأُعْطِيَ
  rationale: يحفظ المعنى المعجمي المباشر للفعل وصيغة الغاية، مع بيان البديل الاصطلاحي في الحاشية.
- source_word: ἐν τῇ γῇ
  choice: عَلَى الْأَرْضِ
  rationale: صياغة عربية طبيعية تفيد النطاق الواسع للمجيء، من غير تضييق المعنى على إقليم محلي.
- source_word: οὐχί
  choice: كَلَّا
  rationale: نفي قوي وموجز يناسب الجواب الحاسم عن السؤال الإنكاري.
- source_word: λέγω ὑμῖν
  choice: أَقُولُ لَكُمْ
  rationale: يحفظ صيغة الخطاب المباشر والتوكيد الواردين في العبارة اليونانية.
- source_word: ἀλλ’ ἢ
  choice: بَلِ
  rationale: تنقل أداة الإضراب المقابلة التي تأتي بعد النفي وتبرز التضاد الحاد.
- source_word: διαμερισμόν
  choice: انْقِسَامًا
  rationale: مقابل مباشر يشمل الانشقاق والتفرّق الاجتماعي والعائلي اللذين توضحهما الآيتان التاليتان.
theological_decisions:
- issue: هل ينبغي تخفيف التعارض الظاهر بين هذا القول والنصوص التي تتحدث عن السلام؟
  choice: الإبقاء على المقابلة الحادة بين السلام والانقسام.
  alternative: تفسير العبارة داخل المتن بأنها تعني صراعًا عارضًا فقط أو تخفيفها بلفظ أقل حدّة.
  rationale: النص اليوناني يتعمد هذه المقابلة الصريحة، والسياق التالي يبيّن أثر رسالة يسوع في انقسام الناس، ولا يصح أن تحسم الترجمة التوتر اللاهوتي أو توفّقه بما يتجاوز النص.
translation_notes:
  register: لغة عربية فصحى واضحة ومباشرة ذات نبرة وقورة. حُفظ السؤال الإنكاري والتضاد الصادم في الأصل، ووُضعت علامتا الحاشية عند اللفظين اللذين تتناولهما الحاشيتان.
