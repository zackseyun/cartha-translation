  source_fidelity: 'الترجمة أمينة للنص اليوناني: «أتظنون» تنقل δοκεῖτε في سؤال مباشر إلى الجمع، و«جئت لأعطي» تحافظ على فعل المجيء مع مصدر الغاية δοῦναι، و«سلامًا على الأرض» تؤدي εἰρήνην ἐν τῇ γῇ على نحو عربي سليم واسع الدلالة. كما أن «كلا، أقول لكم، بل انقسامًا» تحفظ النفي المؤكد والمقابلة الحادة في οὐχί ... ἀλλ’ ἢ διαμερισμόν، من دون تلطيف أو تفسير زائد.'
  naturalness: الصياغة فصحى حديثة واضحة ووقورة، وعلامات الاستفهام والوقف مناسبة. «على الأرض» تعبير عربي طبيعي في هذا السياق، و«انقسامًا» مناسب للسياق الاجتماعي/العائلي الذي يتلو الآية.
  terminology: «سلام» و«انقسام» مقابلان مباشران ومألوفان للمصطلحين الرئيسيين، ولا تحمل الترجمة توجيهًا مذهبيًا أو تفسيرًا مفروضًا. الحاشية (أ) تبيّن البديل الاصطلاحي «لأجلب» من غير أن تستبدل الاختيار الأقرب إلى δοῦναι، والحاشية (ب) تذكر إمكان «في الأرض» أو «في البلاد» مع عدم ترجيح تضييق محلي في المتن.
