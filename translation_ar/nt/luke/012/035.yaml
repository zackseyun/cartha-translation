  yaml_path: translation/nt/luke/012/035.yaml
  text: Let your waists be girded and your lamps burning,[a]
translation:
  language: ar
  text: لِتَكُنْ أَوْسَاطُكُمْ مَشْدُودَةً، وَمَصَابِيحُكُمْ مُتَّقِدَةً.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «كونوا مستعدين للعمل». تشير الصورة إلى جمع أطراف الثياب الطويلة وشدّها عند الخصر استعدادًا للحركة.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἔστωσαν
  choice: لِتَكُنْ
  rationale: فعل أمر غائب في اليونانية يفيد الحث على دوام الحال؛ وصيغة «لِتَكُنْ» تنقل ذلك طبيعيًّا في العربية مع فاعلين منسقين.
- source_word: ὑμῶν
  choice: ـكُمْ
  rationale: ضمير مضاف إليه يعود على المخاطَبين، وصيغته العربية المتصلة هي الأسلس مع «أوساط» و«مصابيح».
- source_word: ὀσφύες
  choice: أَوْسَاطُكُمْ
  rationale: يشير اللفظ إلى منطقة الخصر أو الحقوين. «الأوساط» واضحة وفصيحة وتحافظ على الصورة الجسدية من غير الوقع القديم أو التشريحي لعبارة «الحقوين».
- source_word: περιεζωσμέναι
  choice: مَشْدُودَةً
  rationale: اسم مفعول تام يفيد أن الأوساط قد شُدّت وبقيت على حال الاستعداد. يحافظ الاختيار على الصورة الحسية، وتشرح الحاشية عادة جمع الثياب الطويلة وتثبيتها.
- source_word: λύχνοι
  choice: مَصَابِيحُكُمْ
  rationale: يدل على مصابيح زيتية ملموسة لا على النور المجرّد.
- source_word: καιόμενοι
  choice: مُتَّقِدَةً
  rationale: اسم فاعل حاضر يصور استمرار الاشتعال؛ و«متقدة» تنقل الحالة المستمرة بوضوح وكرامة أسلوبية.
theological_decisions:
- issue: صورة الاستعداد الاصطلاحية
  choice: 'الإبقاء على الصورة المحسوسة: «أوساطكم مشدودة»'
  alternative: «كونوا مستعدين للعمل» أو «لتكن ثيابكم مهيأة للحركة»
  rationale: النص اليوناني يستعمل صورة ثقافية ملموسة للاستعداد. إبقاؤها في المتن يصون المجاز ولا يحوّله إلى تفسير، بينما توضح الحاشية دلالته العملية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. حُفظت صورة الأصل الثقافية في المتن، مع تفسيرها في الحاشية، وتجنُّب الألفاظ الأشد قِدمًا مثل «ممنطقة أحقاؤكم».
