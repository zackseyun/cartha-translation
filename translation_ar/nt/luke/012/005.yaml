base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: ar
  text: 'لكنني سأبيّن لكم مَن تخافون: خافوا الذي، بعدما يقتل، له سلطان أن يُلقي في جهنم[a]. نعم، أقول لكم: خافوا هذا بالذات.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الجحيم». «جهنم» مصطلح للدينونة، وترتبط صورته بوادي هنوم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: سأبيّن
  rationale: ينقل معنى الإرشاد إلى الشخص المقصود وتحديده بوضوح، من غير إضافة معنى التحذير صراحةً.
- source_word: τίνα φοβηθῆτε
  choice: مَن تخافون
  rationale: صياغة عربية موجزة وطبيعية للسؤال غير المباشر، وتحافظ على تكرار جذر الخوف في الآية.
- source_word: φοβήθητε
  choice: خافوا
  rationale: أمر صريح يحفظ قوة التحذير والتكرار في اليونانية، ولا يخففه إلى معنى التوقير وحده.
- source_word: τὸν
  choice: الذي
  rationale: اسم الموصول العربي يؤدي وظيفة أداة التعريف المستعملة اسميًا، من غير أن يحدد الهوية التي لا يصرح بها النص هنا.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: بعدما يقتل
  rationale: يحفظ التعاقب الزمني في التركيب اليوناني، ويجعل الفاعل المفهوم عائدًا إلى «الذي».
- source_word: ἔχοντα ἐξουσίαν
  choice: له سلطان
  rationale: «سلطان» يدل على الصلاحية والقدرة المخوّلة، لا على القوة المجردة فقط.
- source_word: ἐμβαλεῖν εἰς
  choice: أن يلقي في
  rationale: تعبير عربي واضح ومهيب ينقل فعل الإلقاء إلى داخل الموضع.
- source_word: γέενναν
  choice: جهنم
  rationale: «جهنم» هي الصيغة العربية الراسخة للاسم المنقول عن جي هنوم، وتحافظ هنا على كونه مصطلحًا للدينونة؛ وتوضح الحاشية خلفيته.
- source_word: ναί
  choice: نعم
  rationale: يحفظ التوكيد الصريح الذي يستهل به يسوع إعادة الأمر.
- source_word: τοῦτον φοβήθητε
  choice: هذا هو الذي خافوه
  rationale: يحفظ قوة اسم الإشارة والتوكيد الختامي، مع إحالة عربية واضحة إلى الشخص المذكور.
theological_decisions:
- issue: هوية صاحب السلطان على الإلقاء في جهنم
  choice: 'الإبقاء على الإحالة غير المسمّاة: «الذي»'
  alternative: التصريح بأنه الله
  rationale: السياق قد يقود إلى فهم المرجع على أنه الله، لكن الآية نفسها لا تسميه؛ لذلك لا تُحسم الإحالة بإضافة تفسير إلى المتن.
- issue: دلالة γέεννα في سياق الدينونة
  choice: جهنم
  alternative: الجحيم
  rationale: «جهنم» تقابل الاسم اليوناني تقليديًا في العربية وتحفظ صلته التصويرية بوادي هنوم أكثر من اللفظ العام «الجحيم»، مع شرح الخلفية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. حوفظ على تكرار فعل الخوف وعلى عدم تسمية مرجع «الذي» صراحةً. استُعملت «جهنم» بوصفها المقابل العربي الراسخ للاسم اليوناني، مع بيان أصله في الحاشية.
