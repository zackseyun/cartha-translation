  source_fidelity: 'الترجمة تنقل البنية والمعنى الرئيسيين بدقة: الإرشاد إلى مَن ينبغي خوفه، والتعاقب «بعد القتل»، وامتلاك السلطان للإلقاء في جهنم، ثم التوكيد والأمر الختامي. ولا تسمّي هوية «الذي»، محافظةً على عدم التصريح في النص اليوناني. يلزم فقط ضبط الصياغة الختامية لتكون أمرًا عربيًا فصيحًا طبيعيًا مع إبقاء توكيد اسم الإشارة.'
