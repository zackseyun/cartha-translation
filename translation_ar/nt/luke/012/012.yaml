translation:
  language: ar
  text: لِأَنَّ الرُّوحَ الْقُدُسَ سَيُعَلِّمُكُمْ فِي تِلْكَ السَّاعَةِ بِالذَّاتِ مَا يَجِبُ أَنْ تَقُولُوهُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في تلك الساعة» أو «عند تلك الساعة». يؤكد التعبير اليوناني اللحظة المحددة للحاجة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تحفظ القوة التعليلية التي تربط الوعد بما سبقه، وهي صياغة عربية طبيعية واضحة.
- source_word: τὸ ἅγιον πνεῦμα
  choice: الرُّوحَ الْقُدُسَ
  rationale: المقابل العربي المعاصر المألوف للعبارة المعرفة، ويحفظ الإشارة إلى الروح بوصفه فاعل فعل التعليم.
- source_word: διδάξει
  choice: سَيُعَلِّمُكُمْ
  rationale: ينقل صيغة المستقبل والمعنى المباشر للفعل διδάσκω، مع إظهار ضمير المخاطبين الجمع.
- source_word: ὑμᾶς
  choice: ـكُمْ
  rationale: يحفظ كون المفعول به ضمير مخاطب جمعًا، وهو أمر ظاهر صرفيًا في العربية.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: فِي تِلْكَ السَّاعَةِ عَيْنِهَا
  rationale: تنقل «في» معنى ἐν، وتعبّر «عينها» عن التوكيد في αὐτῇ وعن دقة وقت المعونة.
- source_word: ἃ
  choice: مَا
  rationale: اسم موصول عربي طبيعي يؤدي معنى الموصول المحايد الجمع من غير تكلّف حرفي.
- source_word: δεῖ
  choice: يَجِبُ
  rationale: يحفظ معنى الضرورة في السياق من غير أن يضيف تحديدًا لمصدرها.
- source_word: εἰπεῖν
  choice: أَنْ تَقُولُوهُ
  rationale: صياغة عربية طبيعية للمصدر اليوناني؛ والهاء تعود إلى مضمون «ما».
theological_decisions:
- issue: دلالة الرُّوح القدس بوصفه فاعلًا
  choice: الإبقاء على الرُّوح القدس فاعلًا شخصيًا مباشرًا لفعل التعليم
  alternative: فهم العبارة على أنها تأثير أو إلهام إلهي غير شخصي
  rationale: النص اليوناني يجعل «الرُّوح القدس» فاعل الفعل المستقبلي «سيعلّم»، ولذلك تحفظ الترجمة هذه البنية من غير إدخال صياغات عقائدية تتجاوز الآية.
- issue: قوة δεῖ الدالة على الضرورة
  choice: «ما يجب أن تقولوه»
  alternative: «ما ينبغي أن تقولوه» أو «ما تحتاجون إلى قوله»
  rationale: «يجب» تنقل معنى الضرورة المباشر، مع إبقاء طبيعة هذه الضرورة كما يعرضها النص دون تفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم جمع المخاطبين صراحة، وحُفظ التوكيد الزمني بعبارة «عينها». أُثبتت علامة الحاشية [a] في المتن.
