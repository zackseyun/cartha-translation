  source_fidelity: 'الترجمة تنقل بأمانة البنية والمعنى الأساسيين: «لأن» لـ γάρ، و«الروح القدس» فاعلًا، والمستقبل في «سيعلّمكم»، وضمير الجمع، وضرورة «يجب»، ومضمون الكلام الذي ينبغي أن يقال. لكن «في تلك الساعة عينها» أقل سلاسة في العربية الفصحى المعاصرة من التعبير التوكيدي الطبيعي «في تلك الساعة بالذات».'
