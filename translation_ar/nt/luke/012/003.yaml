revisions:
- from: لِذَلِكَ، كُلُّ مَا قُلْتُمُوهُ فِي الظُّلْمَةِ سَيُسْمَعُ فِي النُّورِ، وَمَا هَمَسْتُمْ بِهِ فِي الآذَانِ دَاخِلَ الْغُرَفِ سَيُنَادَى بِهِ مِنْ فَوْقِ السُّطُوحِ.[a]
  to: لِذَلِكَ، كُلُّ مَا قُلْتُمُوهُ فِي الظُّلْمَةِ سَيُسْمَعُ فِي النُّورِ، وَمَا قُلْتُمُوهُ فِي الأُذُنِ فِي الْغُرَفِ الدَّاخِلِيَّةِ سَيُعْلَنُ عَلَى السُّطُوحِ.[a]
  rationale: عُدّل الشق الثاني ليتبع مفرد «الأذن» في اليونانية وألا يضيف فعل الهمس صراحةً، مع إبقاء دلالة السرية من السياق المكاني. واستُبدل «سيُنادى به» بـ«سيُعلَن» لتأدية فعل الإعلان العلني، وجُعلت «على السطوح» في المتن موافقةً مباشرةً لحرف الجر اليوناني، مع حفظ «من فوق السطوح» بديلًا في الحاشية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:21Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما في ذلك الاستنتاج من السياق، والمقابلة بين الظلمة والنور، وصيغة المبني للمجهول التي لا تعيّن فاعل الكشف. لكن «في الآذان» تحوّل المفرد اليوناني «في الأذن» إلى جمع، و«همستم» يزيد معنى الهمس الصريح على فعل «تكلّمتم/قلتم»؛ والأفضل نقل صورة الكلام في الأذن من غير هذه الزيادة.
  naturalness: الصياغة المنقحة فصحى معاصرة واضحة وتحافظ على التوازي البلاغي. «في الأذن» و«الغرف الداخلية» طبيعيان في هذا السياق، و«سيُعلَن» يؤدي الإعلان العلني بوضوح.
  terminology: «الظلمة/النور» يحفظان الصورة المقابلة، و«الغرف الداخلية» مناسب لـ ταμεῖα من غير قصر المعنى على المخازن. «سيُعلَن» أنسب من «سيُنادى به» لـ κηρυχθήσεται لأنه ينقل الإعلان أو النداء العلني من غير إيحاء غير لازم.
  issues:
  - severity: medium
    issue: «هَمَسْتُمْ بِهِ فِي الآذَانِ»
    rationale: التركيب اليوناني πρὸς τὸ οὖς يذكر الكلام إلى/في الأذن بالمفرد، ولا يصرّح بالفعل بمعنى الهمس. الجمع وإضافة «همستم» يضيّقان أو يزيدان على العبارة الأصلية.
  - severity: low
    issue: موضع «من فوق السطوح» والحاشية
    rationale: النص اليوناني يقول حرفيًا «على السطوح»، بينما «من فوق السطوح» بديل عربي سليم من حيث الصورة. جعل «على السطوح» في المتن وذكر البديل في الحاشية يطابق المصدر ومسار التدقيق الإنجليزي على نحو أدق.
