base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: ar
  text: لِذَلِكَ، كُلُّ مَا قُلْتُمُوهُ فِي الظُّلْمَةِ سَيُسْمَعُ فِي النُّورِ، وَمَا قُلْتُمُوهُ فِي الأُذُنِ فِي الْغُرَفِ الدَّاخِلِيَّةِ سَيُعْلَنُ عَلَى السُّطُوحِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من فوق السطوح». والصورة هي إعلان علني من على سطوح البيوت المستوية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: لِذَلِكَ
  rationale: تؤدي العبارة هنا وظيفة استنتاجية تربط القول بما سبقه عن انكشاف المستور، و«لذلك» تنقل هذا الربط بوضوح وطبيعية.
- source_word: ὅσα
  choice: كُلُّ مَا
  rationale: تنقل الشمول في اسم الموصول غير المحدد، وتشمل كل ما قيل في الخفاء.
- source_word: ἐν τῇ σκοτίᾳ / ἐν τῷ φωτί
  choice: فِي الظُّلْمَةِ / فِي النُّورِ
  rationale: تحافظ على المقابلة التصويرية بين الخفاء والظهور، من غير حصرها في معنى حرفي أو مجازي وحده.
- source_word: ἀκουσθήσεται
  choice: سَيُسْمَعُ
  rationale: يحافظ على المبني للمجهول وعلى فكرة انكشاف الكلام من غير تحديد الفاعل أو الآلية.
- source_word: πρὸς τὸ οὖς ἐλαλήσατε
  choice: هَمَسْتُمْ بِهِ فِي الآذَانِ
  rationale: المقصود كلام سري يقال للأذن؛ والتعبير العربي يوضح صورة الهمس الخاص، مع استعمال الجمع الملائم لفاعل الجمع.
- source_word: ἐν τοῖς ταμείοις
  choice: دَاخِلَ الْغُرَفِ
  rationale: يمكن أن تدل الكلمة على مخادع أو غرف داخلية أو مواضع خزن؛ والسياق يركز على الخصوصية والانغلاق، لذا يتجنب الاختيار حصرها في المخازن.
- source_word: κηρυχθήσεται
  choice: سَيُنَادَى بِهِ
  rationale: ينقل معنى الإعلان الجهري العلني، من غير الإيحاء حصرا بالوعظ الديني.
- source_word: ἐπὶ τῶν δωμάτων
  choice: مِنْ فَوْقِ السُّطُوحِ
  rationale: ينقل الصورة الثقافية للإعلان العلني من أسطح البيوت المستوية؛ وتفيد «من فوق» جهة صدور النداء بصورة طبيعية في العربية.
theological_decisions:
- issue: طبيعة انكشاف الكلام الخفي
  choice: إبقاء القول تحذيرا عاما بأن المستور والمهموس به سيصيران علنيين، من غير تحديد زمن الانكشاف أو وسيلته.
  alternative: تفسير الانكشاف حصرا على أنه في الدينونة الأخيرة، أو حصرا على أنه افتضاح تاريخي حاضر للرياء.
  rationale: السياق يتناول انكشاف المستور، لكن الآية نفسها لا تحصر ذلك في توقيت أو آلية بعينهما؛ والمبني للمجهول يحفظ هذا الاتساع والتوتر اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على توازي الظلمة والنور، وعلى المبني للمجهول في فعلي الانكشاف. استُعمل «همستم» لإظهار دلالة الكلام في الأذن، و«ينادى به» لتصوير الإعلان العام.
