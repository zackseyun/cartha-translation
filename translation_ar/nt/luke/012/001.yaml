source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: ar
  text: 'وفي أثناء ذلك، إذ اجتمعت عشرات الآلاف من الناس حتى إنهم كانوا يدوسون بعضهم بعضًا، بدأ يقول لتلاميذه أولًا: «احذروا خمير الفريسيين، الذي هو الرياء[b]».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ربوات من الجمع»؛ وقد تدل الكلمة اليونانية على عشرات الآلاف أو، على نحو أعم، على جمع هائل.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كونوا على حذر من خمير الفريسيين» أو «انتبهوا لأنفسكم من خمير الفريسيين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: وفي أثناء ذلك، إذ
  rationale: ينقل الدلالة الزمنية والظرفية للعبارة، ويربط المشهد بالسياق السابق بلغة عربية طبيعية.
- source_word: ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου
  choice: احتشدت جماهير غفيرة بالآلاف
  rationale: يعبر «احتشدت» عن التجمع الكثيف، وتنقل «بالآلاف» العدد الهائل المقصود من μυριάδες من غير حصره بالضرورة في عشرات الآلاف.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: حتى أخذ بعضهم يدوس بعضًا
  rationale: يحفظ معنى النتيجة في ὥστε ويبين استمرار الفعل الناجم عن شدة الازدحام.
- source_word: ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: بدأ يقول لتلاميذه أولًا
  rationale: يحافظ على البناء الاستهلالي وعلى احتمال تعلق «أولًا» بأولوية مخاطبة التلاميذ.
- source_word: Προσέχετε ἑαυτοῖς ἀπὸ
  choice: احذروا
  rationale: صيغة عربية موجزة وطبيعية تؤدي معنى الانتباه الوقائي للنفس مع حرف الجر الدال على الابتعاد عن الخطر.
- source_word: τῆς ζύμης
  choice: خمير
  rationale: يحفظ الصورة المجازية الكتابية، وهو في العربية ما يُخمَّر به العجين، بدل استبدال المجاز بتفسير مثل «التأثير» أو «التعليم».
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: الذي هو الرياء
  rationale: ينقل التفسير الصريح للمجاز، مع مطابقة اسم الموصول للمذكر «خمير» في العربية.
- source_word: τῶν Φαρισαίων
  choice: الفريسيين
  rationale: إضافة «خمير» إلى «الفريسيين» تنقل العلاقة الوصفية أو الاختصاصية في صياغة عربية واضحة.
theological_decisions:
- issue: القوة المجازية للخمير
  choice: الإبقاء على صورة «خمير الفريسيين» مع تعريفه بأنه الرياء
  alternative: استبدال الخمير بتفسير مباشر مثل «تعليم الفريسيين» أو «تأثيرهم»
  rationale: النص نفسه يفسر المجاز بالرياء؛ لذلك يحسن حفظ الصورة الأدبية دون تضييقها بإضافة تفسير عقائدي غير منصوص عليه.
- issue: متعلَّق πρῶτον
  choice: «لتلاميذه أولًا» بما يبقي أولوية المخاطَبين ظاهرة
  alternative: «أول ما قال لتلاميذه» باعتبارها إشارة إلى ترتيب الأقوال
  rationale: موضع اللفظة اليونانية يحتمل قدرًا من الغموض بين أولوية الجمهور وأولوية القول، والصياغة المختارة لا تحسم أكثر مما يقتضيه النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «جماهير غفيرة بالآلاف» لتجنب تركيب حرفي ثقيل، وأُبقي مجاز الخمير دون تفسير زائد. وُضعت علامتا الحاشية [a] و[b] في المتن.
