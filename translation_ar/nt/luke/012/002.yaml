  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: ar
  text: لكن ما من شيءٍ مستورٍ إلا وسيُكشَف، ولا شيءٍ خفيٍّ إلا وسيُعرَف.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يقع هذا الكشف في الحاضر أو عند الدينونة الأخيرة؛ فالعبارة لا تحدد موعده.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: ليس ... شيءٌ
  rationale: ينقل النفي المطلق بصياغة عربية طبيعية، فيفيد أنه لا يوجد أي شيء مستور يُستثنى من الكشف.
- source_word: δὲ
  choice: لكن
  rationale: يحفظ معنى الانتقال المصحوب بمقابلة خفيفة في السياق السابق.
- source_word: συγκεκαλυμμένον
  choice: مستورًا
  rationale: ينقل حالة الشيء الذي غُطّي أو حُجب، ويحافظ على صورة الستر التي تقابل الكشف.
- source_word: ἀποκαλυφθήσεται
  choice: سيُكشَف
  rationale: فعل مستقبل مبني للمجهول يقابل الستر مباشرة، من غير تحديد لفاعل الكشف أو وقته.
- source_word: κρυπτὸν
  choice: خفيًّا
  rationale: يحفظ التوازي مع «مستورًا» ويعبّر عن الشيء الخفي من غير حصره في معنى السر المتعمَّد.
- source_word: γνωσθήσεται
  choice: سيُعرَف
  rationale: يحفظ صيغة المستقبل المبني للمجهول والنتيجة المتمثلة في صيرورة الخفي معلومًا.
- source_word: ὃ οὐκ / ὃ οὐ
  choice: إلا
  rationale: تؤدي البنية العربية «ليس... إلا» معنى الجملتين الموصولتين المنفيتين في اليونانية بصورة موجزة وطبيعية، من دون تغيير نطاق النفي.
theological_decisions:
- issue: نطاق القول وموعد انكشاف المستور
  choice: مبدأ عام يفيد أن كل ما هو مستور الآن سيُكشف ويُعرف في النهاية
  alternative: قصر القول على انكشاف النفاق في الزمن الحاضر، أو على الدينونة الأخيرة وحدها
  rationale: صيغتا المستقبل المبني للمجهول تؤكدان الكشف الآتي، لكنهما لا تحددان توقيته؛ لذلك تُبقي الصياغة الاحتمالين قائمين ولا تحسم التوتر اللاهوتي.
translation_notes:
  register: عربية فصحى واضحة وموجزة ذات إيقاع متوازٍ. استُخدمت «مستورًا/سيُكشَف» للمحافظة على صورة الستر والكشف، و«خفيًّا/سيُعرَف» لصون التوازي الدلالي في الأصل.
