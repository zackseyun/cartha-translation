  source_fidelity: 'يحفظ النص العربي البنية القانونية المتتابعة في اليونانية بدقة: الخصم، ثم الحاكم، ثم القاضي، ثم مأمور التنفيذ، ثم السجن. وترجمة «ابذل جهدك» مناسبة لـ δὸς ἐργασίαν، و«تتخلّص منه» تحفظ عمدًا اتساع ἀπηλλάχθαι ἀπ’ αὐτοῦ من غير إدخال تفسير التسوية في المتن. كما أن «يجرّك» و«يلقيك في السجن» ينقلان قوة الفعلين κατασύρῃ وβαλεῖ.'
