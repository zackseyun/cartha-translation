id: LUK.12.58
reference: Luke 12:58
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: ar
  text: فحين تذهب مع خصمك إلى الحاكم، ابذل جهدك وأنت في الطريق لكي تتخلّص منه[a]، لئلّا يجرّك إلى القاضي، فيسلّمك القاضي إلى مأمور التنفيذ، ويلقيك مأمور التنفيذ في السجن.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي تتصالح معه». والعبارة اليونانية حرفيًا: «لكي تنفكّ منه»، ويُرجَّح في السياق أنها تشير إلى تسوية القضية قبل وصولها إلى القاضي.'
    reason: بديل معجمي يوضح الدلالة السياقية المحتملة مع حفظ الصياغة الأقرب إلى الأصل في المتن.
lexical_decisions:
- source_word: ἀντιδίκου
  choice: خصمك
  rationale: يدل اللفظ في هذا السياق على الطرف المقابل في دعوى قضائية. و«خصمك» تعبير عربي واضح يحفظ الطابع القانوني من غير أن يحصر دوره في توجيه اتهام جنائي.
- source_word: ἄρχοντα
  choice: الحاكم
  rationale: يشير هنا إلى صاحب سلطة مدنية تُرفع إليه القضية. وتحفظ «الحاكم» معنى السلطة الإدارية والقانونية، مع إبقاء التمييز بينه وبين «القاضي» المذكور بعده.
- source_word: δὸς ἐργασίαν
  choice: ابذل جهدك
  rationale: ينقل هذا التعبير قوة الحث على السعي الجاد بصياغة عربية طبيعية معاصرة.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: لكي تتخلّص منه
  rationale: يحفظ معنى الانفكاك من الخصم أو من مطالبته من غير أن يحسم صراحةً أن المقصود هو التسوية، وهي دلالة سياقية محتملة مذكورة في الحاشية.
- source_word: κατασύρῃ
  choice: يجرّك
  rationale: فعل قوي يصوّر الاقتياد القسري إلى القاضي، ويقابل حيوية الفعل اليوناني.
- source_word: κριτήν / κριτής
  choice: القاضي
  rationale: هو المقابل القانوني المباشر والواضح للفظ اليوناني في هذا السياق.
- source_word: παραδώσει
  choice: يسلّمك
  rationale: ينقل انتقال الشخص بأمر قضائي إلى الموظف المكلف بتنفيذ الحكم.
- source_word: πράκτορι / πράκτωρ
  choice: مأمور التنفيذ
  rationale: يدل اللفظ على موظف ينفذ أمر القاضي، وربما يتولى التحصيل أو الحبس. و«مأمور التنفيذ» أوضح قانونيًا من «الشرطي» وأقل ارتباطًا بنظام قضائي أجنبي بعينه.
- source_word: βαλεῖ εἰς φυλακήν
  choice: يلقيك ... في السجن
  rationale: تحفظ «يلقيك» القوة التصويرية للفعل βάλλω، بدل تسطيحها إلى مجرد «يضعك».
- source_word: ὡς γὰρ
  choice: فحين
  rationale: تربط العبارة المثال القانوني بما قبله، وتنقله إلى العربية بسلاسة من غير تكلف حرفي في تركيب «كما لأن».
- source_word: ἐν τῇ ὁδῷ
  choice: وأنت في الطريق
  rationale: 'يحفظ المعنى المكاني والإلحاح الزمني: ينبغي التصرف قبل بلوغ ساحة القضاء.'
theological_decisions:
- issue: مدى التصريح بالتطبيق الروحي للصورة القانونية
  choice: الإبقاء على المشهد القانوني كما يورده النص من غير تعيين رمزي لشخصياته
  alternative: صياغة الآية صراحةً بوصفها دعوة إلى المصالحة مع الله قبل الدينونة الأخيرة
  rationale: النص نفسه يعرض صورة قانونية ولا يسمّي الخصم أو القاضي أو السجن بوصفها رموزًا لحقائق لاهوتية محددة. لذلك تُحفظ الصورة وما فيها من توتر، ويُترك تطبيقها الأوسع للسياق.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. حُفظ تسلسل الجهات القانونية في الأصل: الحاكم، ثم القاضي، ثم مأمور التنفيذ. ووُضعت علامة الحاشية عند العبارة التي تشرحها مباشرةً.'
