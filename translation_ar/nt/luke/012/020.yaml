  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: ar
  text: 'لكن الله قال له: «يا أحمق، في هذه الليلة عينها تُطلَب منك حياتك[a]. وهذه الأشياء التي أعددتها، فلمن تكون؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نفسك». يمكن للكلمة اليونانية أن تعني «الحياة» أو «النفس» بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: يا غبي
  rationale: صفة مفردة في صيغة النداء تحمل توبيخًا مباشرًا وقويًا. «يا غبي» تعبير عربي طبيعي يحفظ حدّة الخطاب، من غير إضافة تفسيرية.
- source_word: ταύτῃ τῇ νυκτί
  choice: في هذه الليلة عينها
  rationale: ينقل التعبير الزمني مع اسم الإشارة معنى التوكيد والفورية، بصياغة عربية فصيحة واضحة.
- source_word: ψυχήν
  choice: حياتك
  rationale: يشير السياق إلى حياة الرجل التي ستنتهي في تلك الليلة، لا إلى تقرير تفصيلي عن طبيعة النفس. وأُثبت البديل «نفسك» في الحاشية حفاظًا على السعة الدلالية للكلمة اليونانية.
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: تُطلَب منك
  rationale: الفعل اليوناني جمع وفاعله غير مذكور؛ لذلك تحافظ صيغة المبني للمجهول على إبهام الفاعل ولا تستحدث جهة بعينها. ولم تُضف دلالة «الاسترداد» صراحة لأن السياق يحتملها، لكن اللفظ اليوناني هنا لا يوجب التصريح بها.
- source_word: ἃ δὲ ἡτοίμασας
  choice: وهذه الأشياء التي أعددتها
  rationale: ترجمة قريبة وواضحة للموصول المحايد الجمع، الذي يعود في السياق إلى ما جمعه الرجل وهيأه.
- source_word: τίνι ἔσται
  choice: فلمن تكون؟
  rationale: ينقل الاستفهام بالداتيف معنى الاختصاص أو الملكية، ويحفظ إيجاز السؤال وقوته البلاغية.
theological_decisions:
- issue: ترجمة ψυχή في سياق الموت
  choice: حياتك
  alternative: نفسك
  rationale: محور السياق هو الموت الوشيك وخسارة الحياة الأرضية؛ لذا فـ«حياتك» أوضح في المتن، بينما تحافظ الحاشية على «نفسك» بوصفها ترجمة ممكنة من غير حسم لمسألة أنثروبولوجية لا يفصل فيها النص هنا.
- issue: الفاعل غير المعيّن في ἀπαιτοῦσιν
  choice: 'صيغة المبني للمجهول: تُطلَب منك'
  alternative: يطلبونها منك
  rationale: لا يحدد النص اليوناني مرجع الفعل بصيغة الجمع. المبني للمجهول العربي يحفظ هذا الإبهام ولا ينسب الطلب صراحة إلى الله أو الملائكة أو غيرهم.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدم النداء المباشر «يا غبي» لحفظ قوة التوبيخ، مع صياغة طبيعية للسؤال الختامي والحفاظ على إبهام فاعل الطلب في الأصل.
