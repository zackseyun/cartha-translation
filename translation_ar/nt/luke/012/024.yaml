  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: ar
  text: 'تأمّلوا الغربان[a]: فهي لا تزرع ولا تحصد، وليس لها مخزن ولا مستودع[b]، والله يطعمها. فكم أنتم أثمن من الطيور![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لاحظوا الغربان» أو «فكّروا مليًّا في الغربان».'
    reason: lexical_alternative
  - marker: b
    text: تترجم «مخزن» الكلمة اليونانية ταμεῖον، وتترجم «مستودع» الكلمة ἀποθήκη؛ فالنص اليوناني يستعمل لفظين مختلفين لمواضع التخزين.
    reason: lexical_alternative
  - marker: c
    text: 'أو: «فكم تزيد قيمتكم على قيمة الطيور!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: تأمّلوا
  rationale: فعل أمر يدعو إلى الملاحظة المتأنية والتفكير، لا إلى مجرد النظر العابر.
- source_word: τοὺς κόρακας
  choice: الغربان
  rationale: ينقل الاسم اليوناني المحدد لهذا النوع من الطيور ويحافظ على الصورة الملموسة.
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν
  choice: لا تزرع ولا تحصد
  rationale: صياغة عربية مباشرة تحفظ ازدواج الفعلين الزراعيين وإيجازهما.
- source_word: ταμεῖον
  choice: مخزن
  rationale: يدل على موضع داخلي لحفظ المؤن، واختير لفظ يميزه عن ἀποθήκη.
- source_word: ἀποθήκη
  choice: مستودع
  rationale: يدل على مكان تخزين المحاصيل أو المؤن؛ واستعمال لفظ مختلف يحفظ وجود مصطلحين متمايزين في اليونانية.
- source_word: τρέφει
  choice: يطعمها
  rationale: ينقل الفعل المضارع الدال على عناية الله المستمرة بعبارة عربية طبيعية.
- source_word: πόσῳ μᾶλλον
  choice: فكم
  rationale: ينقل بإيجاز أسلوب الاستدلال من الأدنى إلى الأعلى في عربية طبيعية.
- source_word: διαφέρετε
  choice: أنتم أثمن
  rationale: السياق يقتضي التفوق في القيمة لا مجرد الاختلاف، مع إبقاء المقارنة صريحة.
- source_word: τῶν πετεινῶν
  choice: من الطيور
  rationale: اللفظ اليوناني عام، فينتقل الكلام من الغربان خاصة إلى الطيور عامة.
theological_decisions:
- issue: عناية الله في حجة المقارنة
  choice: ومع ذلك يطعمها الله
  alternative: والله يطعمها
  rationale: يحفظ النص إسناد الإطعام مباشرة إلى الله، وتبرز «ومع ذلك» المفارقة السياقية من غير إضافة دعوى عقائدية تتجاوز الآية.
- issue: معنى διαφέρετε في المقارنة
  choice: فكم أنتم أثمن من الطيور!
  alternative: فكم تفوقون الطيور!
  rationale: السياق يتحدث عن قيمة البشر في قياس من الأدنى إلى الأعلى؛ والصياغة المختارة تبقي هذا المعنى من غير تحديد أساس لاهوتي للقيمة لم يذكره النص هنا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «تأمّلوا» لإفادة النظر المتفكر، وحُفظ التمييز بين موضعي التخزين بلفظي «مخزن» و«مستودع». وُضعت علامة التعجب لتلائم القوة البلاغية للمقارنة، مع إبقاء العبارة مفهومة بوصفها تقريرًا تعجبيًا.
