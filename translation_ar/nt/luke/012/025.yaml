source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: ar
  text: ومَن منكم يستطيع، بالقلق، أن يزيد ذراعًا واحدة على عمره؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يزيد ذراعًا واحدة على قامته؟» فاللفظة اليونانية المترجمة «عمره» يمكن أن تعني أيضًا «قامته».'
    reason: حفظ الغموض الحقيقي في ἡλικία، إذ يسمح الأصل بمعنى العمر أو القامة.
lexical_decisions:
- source_word: μεριμνῶν
  choice: بالقلق
  rationale: ينقل معنى الانشغال القَلِق، ويوافق سياق النهي عن القلق في المقطع.
- source_word: ἡλικίαν
  choice: عمره
  rationale: يمكن أن تعني اللفظة «القامة» أو «العمر». ومع استعمال «ذراع» تبقى العبارة مجازية، لكن سياق القلق بشأن الحياة يرجّح «العمر» دون إلغاء الاحتمال الآخر.
- source_word: πῆχυν
  choice: ذراعًا واحدة
  rationale: يحافظ على وحدة القياس القديمة والصورة البلاغية في النص اليوناني، مع إضافة «واحدة» الطبيعية في العربية.
- source_word: δύναται ... προσθεῖναι
  choice: يستطيع ... أن يزيد
  rationale: صياغة عربية واضحة تحافظ على دلالة القدرة وعلى فعل الإضافة.
theological_decisions:
- issue: 'المقصود بـ ἡλικία: العمر أم القامة'
  choice: العمر
  alternative: القامة
  rationale: السياق السابق يتناول الحياة والطعام، واللاحق يصف الأمر بأنه بالغ الصغر؛ لذلك رُجّح العمر، مع توثيق الغموض المعجمي في الحاشية بدل حسمه بصمت.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقّرة. استُعمل «القلق» بدل تعبير أثقل، وحُفظ السؤال البلاغي ووحدة القياس القديمة.
