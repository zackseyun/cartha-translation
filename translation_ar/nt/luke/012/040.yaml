  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: ar
  text: وأنتم أيضًا كونوا مستعدين، لأن ابن الإنسان يأتي في ساعة لا تتوقعونها.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الساعة التي لا تظنونها».'
    reason: lexical_alternative
  - marker: b
    text: '«ابن الإنسان» لقب يستخدمه يسوع عن نفسه، ويُرجَّح أن فيه صدى لدانيال 7: 13–14.'
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: وأنتم أيضًا
  rationale: 'تحفظ معنى الشمول والتوكيد: فالمخاطبون أيضًا، مثل العبيد في المثل السابق، مطالبون بالاستعداد.'
- source_word: γίνεσθε ἕτοιμοι
  choice: كونوا مستعدين
  rationale: صيغة الأمر تدعو إلى حالة مستمرة من الاستعداد. وهذه العبارة عربية طبيعية وتحفظ قوة الأمر من غير إضافة لفظ «يجب» غير الموجود صراحة في اليونانية.
- source_word: ὅτι
  choice: لأن
  rationale: تدخل على علة الأمر بالاستعداد.
- source_word: ᾗ ὥρᾳ
  choice: في ساعة
  rationale: تعبير زمني يفيد وقتًا غير معلوم، وصيغة التنكير تلائم التركيز على مباغتة التوقيت.
- source_word: οὐ δοκεῖτε
  choice: لا تتوقعونها
  rationale: الفعل قد يعني تظنون أو تحسبون؛ وفي سياق التحذير من وقت المجيء، ينقل «تتوقعون» المعنى العملي بوضوح. أُضيف ضمير الساعة وفق مقتضى العربية.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب بصيغته التقليدية الشفافة وأصداءه الكتابية، ولا سيما دانيال 7:13–14.
- source_word: ἔρχεται
  choice: يأتي
  rationale: يحفظ المضارع اليوناني وصبغة الحضور والحيوية، ويمكن أن يُفهم في السياق على مجيء مستقبلي.
theological_decisions:
- issue: ترجمة اللقب المسيحاني ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: الصيغة المختارة تحفظ لقب يسوع وأصداءه الرؤيوية والمسيحانية من غير أن تضيف تحديدًا عقائديًا يتجاوز النص.
- issue: القوة الزمنية للفعل ἔρχεται في قول أخروي
  choice: يأتي
  alternative: سيأتي
  rationale: المضارع اليوناني يمكن أن يدل على المستقبل هنا. «يأتي» يحفظ صورة النص وإلحاح التحذير، من غير حسم إطار أخروي أوسع.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُخدم «كونوا مستعدين» لصياغة أمر طبيعية تحافظ على معنى الاستمرار، و«يأتي» لإبقاء حيوية المضارع اليوناني. وُضعت علامتا الحاشية بعد الجملة، وكلتاهما ظاهرة في المتن.
