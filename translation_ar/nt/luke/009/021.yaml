lexical_decisions:
- source_word: ἐπιτιμήσας
  choice: انتهرهم
  rationale: يدل الفعل هنا على توجيه كلام حازم أو تحذير شديد، و«انتهرهم» يحفظ قوة اللفظ من غير أن يخففها إلى مجرد نصيحة.
- source_word: παρήγγειλεν
  choice: أوصاهم
  rationale: يفيد الفعل إصدار توجيه ذي سلطة. و«أوصاهم» عربية واضحة وفصيحة، مع بقاء قوة الأمر ظاهرة من اقترانه بـ«انتهرهم» وبصيغة النهي.
- source_word: μηδενὶ
  choice: لأحد
  rationale: مع النفي بـ«ألا» يؤدي التعبير معنى «لا يقولوا لأي أحد»، وهو تركيب عربي طبيعي ومباشر.
- source_word: λέγειν
  choice: يقولوا
  rationale: يحافظ على المعنى الأساسي للفعل λέγω، ويلائم وجود اسم الإشارة «هذا» والمخاطَب غير المعيّن «لأحد».
- source_word: τοῦτο
  choice: هذا
  rationale: يحفظ إحالة اسم الإشارة إلى اعتراف بطرس في السياق السابق من غير إضافة تفسيرية إلى المتن.
- source_word: δὲ
  choice: لكن
  rationale: تبرز أداة الاستدراك الانتقال المتباين من اعتراف بطرس إلى رد يسوع الحازم.
theological_decisions:
- issue: قوة منع يسوع بعد اعتراف بطرس
  choice: منع حازم من إخبار أي شخص بهذا في تلك المرحلة من السرد
  alternative: تحذير أخف من مجرد ذكر الأمر
  rationale: اجتماع ἐπιτιμήσας وπαρήγγειλεν يدل على أكثر من طلب عابر، مع إبقاء سبب المنع والتوتر اللاهوتي دون تفسير مذهبي مضاف.
