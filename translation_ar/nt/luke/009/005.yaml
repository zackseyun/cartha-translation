  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: ar
  text: وَأَمَّا كُلُّ مَنْ لَا يَقْبَلُكُمْ[a]، فَحِينَ تَخْرُجُونَ مِنْ تِلْكَ الْبَلْدَةِ[b]، انْفُضُوا الْغُبَارَ عَنْ أَقْدَامِكُمْ شَهَادَةً عَلَيْهِمْ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لَا يُرَحِّبُ بِكُمْ». يمكن أن يشمل الفعل اليوناني قبول الرسل والترحيب بهم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الْمَدِينَةِ». يمكن أن تدل الكلمة اليونانية على بلدة أو مدينة بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: كُلُّ مَنْ لَا يَقْبَلُكُمْ
  rationale: تنقل «كل من» الدلالة العامة غير المحددة للتركيب ὅσοι ἂν، ويحفظ «يقبلكم» اتساع δέχομαι ليشمل قبول الرسل والترحيب بهم دون قصره على الضيافة.
- source_word: ἐξερχόμενοι
  choice: فَحِينَ تَخْرُجُونَ
  rationale: يؤدي القوة الزمنية للحال اليونانية المعاصرة لفعل الأمر بصياغة عربية طبيعية واضحة.
- source_word: ἀπὸ τῆς πόλεως ἐκείνης
  choice: مِنْ تِلْكَ الْبَلْدَةِ
  rationale: «البلدة» لفظ مرن يلائم πόλις التي قد تدل على بلدة أو مدينة بحسب السياق، مع إبقاء اسم الإشارة ἐκείνης.
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν
  choice: الْغُبَارَ عَنْ أَقْدَامِكُمْ
  rationale: «الغبار» هو المقابل الطبيعي لـ κονιορτός، و«عن أقدامكم» تلائم العربية مع فعل النفض وتحفظ الصورة الحسية.
- source_word: ἀποτινάσσετε
  choice: انْفُضُوا
  rationale: فعل أمر عربي موجز ودقيق يصور إزالة الغبار بحركة قوية رمزية.
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: شَهَادَةً عَلَيْهِمْ
  rationale: تحفظ العبارة غرض الفعل ووظيفته الإثباتية، وتنقل «عليهم» القوة المناوئة في السياق دون إضافة حكم نهائي غير مصرح به.
theological_decisions:
- issue: دلالة فعل نفض الغبار الرمزي
  choice: شَهَادَةً عَلَيْهِمْ
  alternative: علامةً لهم؛ أو إعلانًا صريحًا بدينونة نهائية
  rationale: تفيد εἰς μαρτύριον ἐπ’ αὐτούς شهادة ذات طابع إنذاري وقضائي، لكنها لا تفصّل في هذه الآية مدى الدينونة؛ لذلك تحفظ الصياغة هذا التوتر دون جعل الفعل علامة محايدة أو تصريحًا بما يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل ضبط جزئي موسع لتسهيل القراءة، مع تراكيب طبيعية وتجنب الألفاظ المذهبية أو التفسير الزائد.
