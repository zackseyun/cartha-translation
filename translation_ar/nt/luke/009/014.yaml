  text: 'فَقَدْ كَانَ هُنَاكَ نَحْوُ خَمْسَةِ آلَافِ رَجُلٍ[a]. فَقَالَ لِتَلَامِيذِهِ: «اجْعَلُوهُمْ يَتَّكِئُونَ لِلطَّعَامِ فِي جَمَاعَاتٍ، نَحْوَ خَمْسِينَ فِي كُلِّ جَمَاعَةٍ»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
