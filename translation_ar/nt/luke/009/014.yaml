lexical_decisions:
- source_word: ὡσεὶ
  choice: نحو
  rationale: تفيد التقريب لا العدد الدقيق، وتلائم موضعيها في الآية بأسلوب عربي طبيعي.
- source_word: ἄνδρες
  choice: رجل
  rationale: تشير ἀνήρ هنا إلى الذكور البالغين تحديدًا، لا إلى الناس عمومًا.
- source_word: πεντακισχίλιοι
  choice: خمسة آلاف
  rationale: نقل مباشر للعدد الوارد في النص اليوناني.
- source_word: Κατακλίνατε
  choice: أجلسوهم للطعام
  rationale: الفعل سببي ويدل على جعل الناس يتكئون أو يستلقون لتناول الطعام؛ وصياغة «أجلسوهم للطعام» تنقل المقصود بوضوح في العربية المعاصرة من غير الإيحاء بالاستلقاء للنوم.
- source_word: κλισίας
  choice: في مجموعات
  rationale: الجمع يدل على جماعات أو وحدات مرتبة، و«في مجموعات» تعبير عربي واضح وطبيعي.
- source_word: ἀνὰ πεντήκοντα
  choice: نحو خمسين في كل واحدة
  rationale: تنقل ἀνά معنى التوزيع، مع إبقاء التقريب الذي تدل عليه ὡσεὶ.
- source_word: γὰρ ... δὲ
  choice: فقد ... فقال
  rationale: تحفظ الفاء مع «قد» القوة التفسيرية لـγάρ، وتوصل الفاء الثانية استمرار السرد الذي تؤديه δέ.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: لتلاميذه
  rationale: تحفظ ضمير الملكية الصريح وتؤدي معنى القول الموجّه إليهم بإيجاز عربي طبيعي.
