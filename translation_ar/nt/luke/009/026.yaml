base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: ar
  text: فمَن يستحي بي وبكلامي، يستحي به ابن الإنسان حين يأتي في مجده ومجد الآب والملائكة القديسين.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة: «حين يأتي في مجده، وفي مجد الآب والملائكة القديسين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: فمَن
  rationale: تنقل الفاء معنى γάρ التفسيري الرابط بالسياق، وتنقل «مَن» قوة التركيب الموصولي العام ὃς ... ἄν بمعنى «كل من» دون إثقال العبارة.
- source_word: ἐπαισχυνθῇ ... ἐπαισχυνθήσεται
  choice: يستحي بـ... يستحي به
  rationale: يحافظ تكرار الفعل نفسه على المقابلة المقصودة في اليونانية. والتعدية بالباء عربية فصيحة وطبيعية مع «استحيا» عند الإشارة إلى الشخص أو القول الذي يُستحيا من الانتساب إليه أو الإقرار به.
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: بي وبكلامي
  rationale: «بي» تقابل με، و«كلامي» تنقل λόγους بصياغة عربية طبيعية وتحفظ الإشارة إلى أقوال يسوع دون تحويلها إلى شرح تفسيري مثل «ما أقوله».
- source_word: τοῦτον
  choice: به
  rationale: الضمير المفرد يعود بوضوح إلى «مَن» العامة، ويحفظ الإحالة المفردة في الأصل دون صياغة ثقيلة مثل «بهذا الشخص».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة العربية الراسخة والشفافة لهذا اللقب، وتحفظ صلته اللفظية والتناصية بخلفيته الكتابية.
- source_word: ὅταν ἔλθῃ
  choice: حين يأتي
  rationale: ينقل الدلالة الزمنية المستقبلية لتركيب ὅταν مع صيغة الالتزام، وهو طبيعي في العربية ضمن الحديث عن المجيء الآتي.
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: في مجده ومجد الآب والملائكة القديسين
  rationale: تُذكر «مجد» ثانية لتوضيح تعلّق المضافَيْن «الآب» و«الملائكة» بها في العربية، مع إبقاء احتمال فهم العبارة على أنها مجد مرتبط بالثلاثة ضمن تركيب واحد.
- source_word: τῶν ἁγίων ἀγγέλων
  choice: الملائكة القديسين
  rationale: نقل مباشر للصفة ἁγίων مع ἀγγέλων بصياغة عربية واضحة ومألوفة.
theological_decisions:
- issue: المقابلة بين استحياء الإنسان واستحياء ابن الإنسان
  choice: تكرار «يستحي» في طرفي العبارة
  alternative: «ينكره ابن الإنسان» أو «يتبرأ منه ابن الإنسان»
  rationale: الأصل يكرر الفعل اليوناني نفسه، ولذلك لا تُستبدل الجملة الثانية بتعبير أشد دلالة على الرفض أو الإنكار، إذ سيكون ذلك حسمًا تفسيريًا يتجاوز اللفظ.
- issue: نسبة المجد إلى ابن الإنسان والآب والملائكة القديسين
  choice: «في مجده ومجد الآب والملائكة القديسين» مع حاشية توضح البديل التركيبي
  alternative: «في مجده، وفي مجد الآب والملائكة القديسين»
  rationale: تحفظ الصياغة وحدة تركيب «المجد» قدر الإمكان، بينما تشير الحاشية إلى أن حرف الجر الواحد قد يُفهم ممتدًا إلى العناصر المنسقة، من غير فرض قراءة لاهوتية أضيق.
- issue: الإحالة المفردة العامة في τοῦτον
  choice: «به» عائدًا إلى «مَن»
  alternative: «بذلك الشخص»
  rationale: تحافظ العربية على المفرد العام طبيعيًا من غير إدخال تخصيص جنسي غير لازم أو تحويله إلى جمع محايد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة مهيبة مناسبة للسياق. استُخدم «كلامي» بدل «أقوالي» لطبيعته في العربية، مع الحفاظ على معنى λόγοι، وثُبّتت المقابلة اللفظية بين فعلي الاستحياء.
