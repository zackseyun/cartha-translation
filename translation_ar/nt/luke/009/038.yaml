base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: ar
  text: 'وإذا برجلٍ من الجمع صرخ قائلًا: «يا معلّم، أتوسّل إليك أن تنظر إلى ابني، فهو ابني الوحيد[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فهو ولدي الوحيد». اللفظ اليوناني يعني «الوحيد» أو «الفريد» بالنسبة إليه. ولأن الشخص قد ذُكر ابنًا، فالمعنى المباشر هو أنه ابنه الوحيد، وقد يُفهم أيضًا أنه ولده الوحيد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا بـ
  rationale: تؤدي وظيفة لفت الانتباه والانتقال السردي في عربية فصيحة طبيعية، من غير ثقل «هوذا» على القارئ المعاصر.
- source_word: ἀνὴρ
  choice: رجل
  rationale: يحفظ التحديد الجنسي الصريح في اليونانية.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: من بين الجمع
  rationale: يبين أنه واحد من الحاضرين في الجمع، بصياغة عربية طبيعية.
- source_word: ἐβόησεν
  choice: يصرخ
  rationale: ينقل علو الصوت وشدة الاستغاثة؛ واستعمال المضارع بعد «إذا» السردية مألوف وحيوي في العربية.
- source_word: λέγων
  choice: قائلًا
  rationale: يحفظ الصلة الحالية في التركيب اليوناني بصياغة عربية فصيحة.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: المعنى المباشر للفظ هو المعلّم، والنداء الصريح طبيعي في العربية.
- source_word: δέομαί σου
  choice: أتوسّل إليك
  rationale: يعبر عن الطلب الملحّ والاستعطاف، وهو أقوى من مجرد «أطلب منك».
- source_word: ἐπιβλέψαι ἐπὶ
  choice: أن تنظر بعناية إلى
  rationale: يحفظ معنى الالتفات والاهتمام، لا مجرد إلقاء نظرة بصرية.
- source_word: τὸν υἱόν μου
  choice: ابني
  rationale: ترجمة مباشرة ومألوفة.
- source_word: μονογενής μοί ἐστιν
  choice: لأنه وحيدي
  rationale: ينقل كون الابن الوحيد للمتكلم مع إبقاء إمكان فهمه بأنه ابنه الوحيد أو ولده الوحيد؛ وتوضح الحاشية مجال الدلالة.
theological_decisions:
- issue: مدلول μονογενής في وصف الابن
  choice: وحيدي
  alternative: ابني الوحيد / ولدي الوحيد
  rationale: «وحيدي» تحافظ على إيجاز الأصل وعلى شيء من اتساعه الدلالي، فلا تحسم داخل المتن هل المقصود الابن الذكر الوحيد تحديدًا أم الولد الوحيد مطلقًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «وإذا بـ» بوصفها أداة لفت سردي طبيعية، و«تنظر بعناية إلى» لإظهار أن الطلب يتضمن الالتفات والاهتمام لا مجرد الرؤية.
