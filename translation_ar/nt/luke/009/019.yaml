base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: ar
  text: 'فأجابوا: «يوحنا المعمدان؛ وقال آخرون: إيليا؛ وقال آخرون: إن نبيًّا من أنبياء الأزمنة القديمة قد قام[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نبيّ من زمن قديم قد نهض».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: فأجابوا
  rationale: هذا التركيب اليوناني، المتأثر بالأسلوب السامي، يفيد الجواب، وتؤديه العربية الطبيعية بفعل واحد من غير تكرار «أجابوا وقالوا».
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: يوحنا المعمدان
  rationale: «المعمدان» هو اللقب العربي المألوف، ويؤدي معنى βαπτιστής في هذا السياق.
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: ويقول آخرون ... وآخرون
  rationale: يحافظ هذا على تكرار فئات القائلين وعلى بنية المقابلة، مع إضمار فعل القول في العبارة الأخيرة على نحو طبيعي.
- source_word: Ἠλίαν
  choice: إيليا
  rationale: الصيغة العربية الكتابية المألوفة لاسم النبي.
- source_word: ὅτι
  choice: —
  rationale: مضمون القول في العربية يأتي هنا مباشرة بعد «آخرون»، فلا يلزم نقل ὅτι بحرف مستقل.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: نبيٌّ من أنبياء الأزمنة القديمة
  rationale: تحفظ «نبيٌّ» التنكير في τις، وتوضح العبارة أن المقصود واحد من الأنبياء المنتمين إلى العصور القديمة، لا وصف النبي نفسه بأنه متقدم في السن.
- source_word: ἀνέστη
  choice: قد قام
  rationale: «قام» يحفظ المجال الدلالي للفعل بين النهوض والقيام من الموت، ولا يفرض تفسيرًا أشد صراحة من النص اليوناني.
theological_decisions:
- issue: هل يُصرَّح بأن ἀνέστη يعني القيامة من الموت؟
  choice: قد قام
  alternative: قد قام من الموت / قد ظهر من جديد
  rationale: الصياغة المختارة تبقي صدى لغة القيامة ممكنًا، من غير أن تحسم كلام الجموع إلى تصريح عقائدي لا يصرح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «ويقول آخرون» لتجنب قائمة اسمية متعثرة، و«أنبياء الأزمنة القديمة» بدل «القدماء» دفعًا لاحتمال فهمها على أنها تشير إلى أشخاص قدماء عمومًا لا إلى الأنبياء.
