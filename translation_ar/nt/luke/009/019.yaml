    issue: عدم اتساق الزمن في «ويقول آخرون».
    rationale: السياق اليوناني يورد جوابًا في الماضي (ἀποκριθέντες εἶπαν)، وعبارتا ἄλλοι δέ تسجلان أقوال فئات أخرى في ذلك الجواب؛ لذا «وقال آخرون» أدق وأيسر.
  - severity: low
    issue: حذف أداة مضمون القول في الجملة الأخيرة يقلل وضوح البنية.
    rationale: يجوز الحذف عربيًا، لكن «إنّ» تؤدي ὅτι بوضوح بعد «وقال آخرون» من دون إثقال الأسلوب.
  - severity: low
    issue: الحاشية الحالية تقدم احتمال «القيام من الموت» تفسيرًا مطولًا بدل البديل المعجمي المباشر.
    rationale: الأصل الإنجليزي يورد بديلًا أكثر اصطلاحية لـ«قد قام/نهض»؛ والأفضل أن تعكس الحاشية هذا البديل من غير تعليق تفسيري زائد.
