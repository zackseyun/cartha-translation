  rationale: يصحح التعديل اتساق زمن السرد، ويجعل علاقة الجملة الأخيرة بفعل القول أوضح بواسطة «إنّ»، مع الإبقاء على التنكير في τις، وعلى الإحالة إلى الأنبياء القدماء، وعلى غموض ἀνέστη المقصود. كما تختصر الحاشية إلى بديل معجمي مباشر مماثل لمسار التدقيق الإنجليزي.
