  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: ar
  text: وأما يسوع، فإذ علم ما يدور في قلوبهم[a]، أخذ طفلًا وأقامه بجانبه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «تفكير قلبهم»؛ جاءت كلمة «قلب» في اليونانية بالمفرد، مع ضمير يعود إلى جماعة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أوقفه بجانبه»؛ يفيد الفعل أنه جعله يقف هناك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: كان يعلم
  rationale: يفيد اسم الفاعل هنا الإدراك أو العلم الذهني، من غير أن يحدّد النص كيف عرف يسوع ذلك.
- source_word: διαλογισμὸν
  choice: ما يدور
  rationale: تعبير عربي طبيعي ينقل معنى التفكير والمداولة الباطنية، ولا يختزله في خاطرة عابرة.
- source_word: τῆς καρδίας αὐτῶν
  choice: في قلوبهم
  rationale: هذه الصياغة هي الأوضح في العربية للدلالة على باطنهم، مع بيان صيغة المفرد اليونانية في الحاشية.
- source_word: ἐπιλαβόμενος
  choice: أخذ
  rationale: ينقل فعل الإمساك بالطفل في السياق بلغة طبيعية، من غير إيحاء بخشونة لا يقتضيها النص.
- source_word: παιδίον
  choice: طفلًا
  rationale: لفظ واضح ومعاصر يدل على الطفل من غير إضافة تصغير أو توكيد غير صريح.
- source_word: ἔστησεν
  choice: أقامه
  rationale: يحفظ المعنى السببي للفعل، أي جعله يقف أو وضعه واقفًا، بصياغة عربية فصيحة.
- source_word: παρ’ ἑαυτῷ
  choice: إلى جانبه
  rationale: يعبّر بوضوح عن موضع الطفل بالقرب من يسوع، ويتجنب الغموض الذي قد ينشأ من ترجمة حرفية للضمير الانعكاسي.
theological_decisions:
- issue: معرفة يسوع بما في باطن التلاميذ
  choice: يقرر النص أن يسوع كان يعلم ما يدور في قلوبهم من غير بيان وسيلة معرفته.
  alternative: تفسير المعرفة هنا بأنها علم فائق للطبيعة، أو بأنها فطنة بشرية نافذة.
  rationale: تحافظ الصياغة على تقرير لوقا نفسه، ولا تحسم آلية المعرفة بما يتجاوز النص.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُعمل «ما يدور في قلوبهم» لطبيعته في العربية مع الحفاظ في الحاشية على مفرد «القلب» في اليونانية، واستُعمل «أقامه إلى جانبه» للجمع بين صورة الوقوف وسلاسة التعبير.
