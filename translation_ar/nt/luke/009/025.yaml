    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: فماذا ينتفع
  rationale: صياغة عربية طبيعية لسؤال إنكاري عن المنفعة، مع إبقاء γὰρ رابطًا تعليليًا بما قبله بواسطة الفاء.
- source_word: ἄνθρωπος
  choice: الإنسان
  rationale: اسم جنس مفرد يشمل الإنسان عمومًا ويحافظ على الصيغة التمثيلية في اليونانية.
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: إن ربح العالم كله
  rationale: تحويل اسم الفاعل إلى جملة شرطية يعبّر بوضوح وطبيعية عن الحالة الافتراضية، مع إبقاء صورة ربح العالم كله.
- source_word: ἑαυτὸν
  choice: نفسه
  rationale: الضمير الانعكاسي يدل على ذات الإنسان نفسها؛ و«نفسه» هنا تعبير عربي انعكاسي طبيعي من غير حصر المعنى في النفس بوصفها جزءًا غير مادي.
- source_word: ἀπολέσας
  choice: أضاع
  rationale: ينقل معنى الفقد أو الإهلاك الواقع على الذات، ويظل متميزًا عن فعل تحمّل الخسارة التالي.
- source_word: ζημιωθείς
  choice: خسرها
  rationale: ينقل صيغة المبني للمجهول الدالة على تكبد الخسارة بعبارة عربية موجزة، ويحافظ على التمييز الدلالي النسبي عن «أضاع».
theological_decisions:
- issue: دلالة ἑαυτόν في مصير الإنسان
  choice: نفسه
  alternative: حياته أو روحه
  rationale: النص اليوناني يستعمل الضمير الانعكاسي، لا ψυχή؛ لذلك تحافظ «نفسه» على الإشارة الواسعة إلى ذات الإنسان ولا تحصرها في حياته الجسدية أو روحه غير المادية.
- issue: العلاقة بين ἀπολέσας وζημιωθείς
  choice: أضاع نفسه أو خسرها
  alternative: أهلك نفسه أو لحقه الضرر
  rationale: أُبقي حرف العطف «أو» والتعبيران المتقاربان من دون دمجهما، حفاظًا على التوتر والتمايز الموجودين في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة وقورة. استُعملت «الإنسان» استعمالًا جنسيًا عامًا، وصيغ السؤال بصورة عربية مألوفة مع الحفاظ على طابعه الإنكاري وصلته بما قبله.
