  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: ar
  text: 'فقال لهم: «وأنتم، من تقولون إني أنا؟» فأجاب بطرس: «مسيحُ الله[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الممسوح الذي لله.'
    reason: توضيح المعنى الاشتقاقي للقب «مسيح» مع إبقاء علاقة الإضافة في العبارة اليونانية.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: وأنتم
  rationale: الضمير اليوناني مذكور للتوكيد والمقابلة؛ وتنقل «وأنتم» هذا التركيز بوضوح وطبيعية.
- source_word: τίνα με λέγετε εἶναι
  choice: من تقولون إني أنا؟
  rationale: صياغة عربية واضحة تنقل تركيب القول مع المصدر، مع إبراز هوية المتكلم دون حرفية ثقيلة.
- source_word: ἀποκριθεὶς εἶπεν
  choice: فأجاب
  rationale: يُؤدَّى التركيب اليوناني المكوَّن من اسم فاعل وفعل قول بفعل عربي واحد طبيعي يحفظ المعنى.
- source_word: χριστόν
  choice: مسيح
  rationale: اللفظ هنا لقب اعترافي، و«مسيح» ينقل معنى الممسوح في الاستعمال الكتابي العربي بدل معاملته كاسم علم.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: الإضافة العربية «مسيح الله» تنقل علاقة المضاف إليه في اليونانية بإيجاز ودقة.
- source_word: δέ
  choice: فـ / و
  rationale: نُقلت أداة الربط الأولى بالفاء الملائمة لتتابع الكلام، والثانية بالواو في «وأنتم» لإظهار المقابلة السياقية.
theological_decisions:
- issue: ترجمة χριστός في اعتراف بطرس
  choice: مسيح الله
  alternative: المسيح الذي من الله / كريستوس الله
  rationale: يحمل اللفظ اليوناني هنا وظيفة اللقب، و«مسيح الله» هو المقابل العربي الطبيعي الذي يبقي الصلة بفكرة المسح والانتماء إلى الله من غير إضافة تفسير عقائدي غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «وأنتم» لحفظ المقابلة المؤكدة، وصيغت الإجابة بإيجاز اعترافي يوافق الأصل.
