  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: ar
  text: وتوسَّلتُ إلى تلاميذك أن يُخرجوه[a]، فلم يقدروا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يعود الضمير إلى الروح، وهو الأرجح في سياق إخراج الأرواح، أو إلى الصبي.
    reason: الحفاظ على احتمال مرجع الضمير في الأصل مع توضيح ما يتيحه التركيب العربي.
lexical_decisions:
- source_word: ἐδεήθην
  choice: توسَّلتُ
  rationale: يفيد الفعل طلبًا ملحًّا، و«توسَّلتُ» تنقل شدة طلب الأب بعبارة عربية طبيعية من غير أن تجعله مجرد سؤال عابر.
- source_word: τῶν μαθητῶν σου
  choice: إلى تلاميذك
  rationale: «تلاميذ» هي المقابل المعتاد لـ μαθηταί في سياق الأناجيل، وتحفظ علاقة التلميذ بالمعلّم.
- source_word: ἵνα ἐκβάλωσιν αὐτό
  choice: أن يُخرجوه[a]
  rationale: تنقل «أن» معنى الغرض في تركيب ἵνα مع صيغة الالتزام، ويوافق «يُخرجوه» الاستعمال الإنجيلي لطرد الروح، مع إبقاء مرجع الضمير غير مصرَّح به كما في اليونانية.
- source_word: οὐκ ἠδυνήθησαν
  choice: فلم يقدروا
  rationale: تعبّر العبارة بوضوح عن انعدام القدرة، وتحافظ على دلالة δύναμαι في أسلوب عربي موجز وطبيعي.
theological_decisions:
- issue: مرجع الضمير αὐτό في سياق إخراج الروح
  choice: الإبقاء على الضمير في «يُخرجوه»، مع بيان الاحتمال في الحاشية.
  alternative: التصريح بقول «أن يُخرجوا الروح منه» أو حمل الضمير على الصبي.
  rationale: الضمير اليوناني المحايد يوافق على الأرجح πνεῦμα، أي الروح، وإخراج الروح هو التعبير المألوف في هذا السياق. لكن العربية لا تملك هنا ضميرًا محايدًا، كما أن صيغة المذكر قد تُفهم عائدة إلى الصبي أو إلى الروح؛ لذلك تُحفظ الصياغة الضميرية ويُشرح الاحتمال بدل حسمه داخل النص.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. اختيرت «توسَّلتُ» لإظهار إلحاح الأب، و«فلم يقدروا» لصون معنى عدم القدرة من غير تعقيد.
