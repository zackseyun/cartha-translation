  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: ar
  text: 'وحدث أنه، فيما كان يصلّي منفردًا[a]، كان التلاميذ معه. فسألهم قائلًا: «من تقول الجموع إني أنا؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على انفراد». قد تدل العبارة اليونانية (κατὰ μόνας) على الخلوة، لا على غياب كل شخص آخر غيابًا مطلقًا.'
    reason: بديل معجمي يحفظ اتساع دلالة العبارة ويفسر إمكان اجتماعها مع وجود التلاميذ معه.
lexical_decisions:
- source_word: ἐγένετο
  choice: وحدث أنه
  rationale: صيغة سردية شائعة عند لوقا؛ تحافظ على وظيفتها الانتقالية بصياغة عربية طبيعية.
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: فيما كان يصلّي
  rationale: تفيد البنية بالمصدر المعرّف مع ἐν حدثًا معاصرًا، وتنقل «فيما» هذا المعنى الزمني بوضوح.
- source_word: κατὰ μόνας
  choice: منفردًا
  rationale: تعبير اصطلاحي يحتمل الانفراد أو الخلوة؛ «منفردًا» موجزة وتحفظ التوتر مع وجود التلاميذ، مع بيان البديل في الحاشية.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: كان التلاميذ معه
  rationale: نقل مباشر للعلاقة التي تفيدها العبارة، من غير إضافة أنهم اقتربوا أو كانوا على مسافة.
- source_word: ἐπηρώτησεν αὐτοὺς
  choice: فسألهم
  rationale: مقابل عربي طبيعي ودقيق لفعل توجيه السؤال.
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على اسم الفاعل الذي يقدّم الكلام في الأصل، وهو فصيح وطبيعي في هذا السياق.
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: من تقول الجموع إني أنا؟
  rationale: صياغة عربية واضحة للسؤال غير المباشر، وتحافظ على ضمير المتكلم البارز في العبارة.
- source_word: οἱ ὄχλοι
  choice: الجموع
  rationale: تنقل معنى الجماعات أو الحشود ولا تختزله في اللفظ الأعم «الناس».
theological_decisions:
- issue: التوتر الظاهري بين صلاة يسوع منفردًا ووجود التلاميذ معه
  choice: 'إبقاء العبارتين كما هما: كان يصلّي منفردًا، وكان التلاميذ معه.'
  alternative: ترجمة κατὰ μόνας بـ«على انفراد» ثم صياغة السياق بما يوحي صراحة بأن التلاميذ كانوا قريبين، أو إضافة تفسير يزيل التوتر.
  rationale: النص اليوناني يجمع بين الانفراد في الصلاة ووجود التلاميذ معه. لا يحدد كيفية اجتماعهما مكانيًا، ولذلك تُصان الدلالة والتوتر من غير تفسير زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «فيما» للدلالة الزمنية، و«الجموع» للدقة الاجتماعية، وحُفظت البنية السردية والتوتر النصي بلا تسوية تفسيرية.
