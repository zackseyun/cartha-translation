  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: ar
  text: وأرسل رسلًا أمامه[a]. فمضوا ودخلوا قريةً للسامريين[b] ليُعِدّوا له.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أمام وجهه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قريةً سامرية». واليونانية حرفيًا: «قريةً للسامريين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: أرسل
  rationale: فعل ماضٍ يعبّر بوضوح وطبيعية عن إرسال أشخاص في مهمة.
- source_word: ἀγγέλους
  choice: رسلًا
  rationale: السياق يدل على مبعوثين من البشر، ولفظ «رسل» يؤدي معنى المرسَلين دون الإيحاء هنا بكائنات سماوية.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: أمامه
  rationale: تعبير عربي طبيعي ينقل دلالة التقدّم عليه في الطريق، مع إبقاء الصيغة الحرفية في الحاشية.
- source_word: πορευθέντες
  choice: فمضوا
  rationale: تحويل اسم الفاعل الظرفي السابق للفعل الرئيس إلى فعل معطوف طبيعي في العربية، مع الحفاظ على تعاقب الأحداث.
- source_word: εἰσῆλθον
  choice: دخلوا
  rationale: المقابل العربي المباشر والطبيعي للفعل الدال على الدخول.
- source_word: κώμην
  choice: قريةً
  rationale: يناسب مستوطنة صغيرة، وهو أدق من «مدينة».
- source_word: Σαμαριτῶν
  choice: للسامريين
  rationale: يحافظ على تركيب الإضافة اليوناني، الذي قد يدل على قرية يسكنها السامريون أو تُنسب إليهم.
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: ليُعِدّوا له
  rationale: ينقل معنى الغرض بإيجاز، ويترك مفعول الإعداد غير مذكور كما في اليونانية.
