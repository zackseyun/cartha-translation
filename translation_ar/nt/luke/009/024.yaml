  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: ar
  text: لأن من أراد أن ينقذ حياته[a] سيخسرها، أما من خسر حياته من أجلي، فهو سينقذها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نفسه» أو «ذاته»؛ فالكلمة اليونانية قد تعني الحياة أو النفس أو الذات بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: لأن من أراد
  rationale: تؤدي «من» مع الفعل معنى الشرط العام غير المحدد، وتحفظ «لأن» الصلة التفسيرية التي تفيدها γάρ بما قبلها. و«أراد» تعبير عربي طبيعي عن الإرادة هنا.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: حياته
  rationale: تدل ψυχή في هذا السياق على حياة الإنسان أو نفسه، والمفارقة هنا تتعلق بمحاولة الاحتفاظ بالحياة وفقدانها في سبيل يسوع؛ لذلك كانت «حياته» أوضح في المتن، مع بيان المدى الدلالي في الحاشية.
- source_word: σῶσαι / σώσει
  choice: أن ينقذ / سينقذ
  rationale: يحفظ تكرار جذر «أنقذ» التناظر اللفظي والمفارقة بين أول القول وآخره، وهو طبيعي عند الحديث عن إنقاذ الحياة.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: سيخسر / خسر
  rationale: «خسر حياته» تعبير عربي واضح عن فقدانها، ويحافظ استعمال الجذر نفسه في الشطرين على التوازي البلاغي.
- source_word: ἕνεκεν ἐμοῦ
  choice: من أجلي
  rationale: تنقل السبب أو الدافع المقصود، وتحفظ التركيز الشخصي على التلمذة ليسوع.
- source_word: οὗτος
  choice: فهو
  rationale: يُبرز الضمير المنفصل الشخص الموصوف بوصفه نتيجة الشرط، مع صياغة عربية طبيعية غير متكلفة.
theological_decisions:
- issue: دلالة ψυχή في مفارقة يسوع
  choice: حياته
  alternative: نفسه أو ذاته
  rationale: السياق المباشر يتناول إنكار الذات وفقدان الحياة من أجل يسوع، فلا تُحصر الكلمة في مفهوم «الروح» غير المادية. وتُحفظ البدائل الدلالية في الحاشية.
- issue: المرجع المذكر المفرد ذو الدلالة العامة
  choice: من أراد... حياته
  alternative: من أرادوا... حياتهم
  rationale: تحافظ صيغة المفرد على بناء الأصل وعلى الطابع الفردي المباشر للقول، مع بقاء «من» عامة تشمل كل إنسان.
- issue: المفارقة بين إنقاذ الحياة وخسارتها
  choice: تكرار «ينقذ» و«خسر» في طرفي القول
  alternative: التنويع بين «يحفظ» و«يفقد»
  rationale: يحفظ التكرار المقصود في الأصل حدة المفارقة من غير تفسير لاهوتي زائد.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ومهيبة. استُعملت «أما» لإظهار المقابلة التي تفيدها δέ، و«فهو» لنقل إبراز οὗτος بأسلوب عربي طبيعي.
