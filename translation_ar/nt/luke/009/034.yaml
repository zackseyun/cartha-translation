  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: ar
  text: وبينما كان يتكلم بهذا، ظهرت سحابة[b] وأخذت تظلّلهم[a]؛ فخافوا حين دخلوا في السحابة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويمكن ترجمة الفعل: «وظلّلتهم». فصيغة الفعل اليوناني قد تدل على فعل جارٍ، ولا يلزم أن تفيد صراحة بدء التظليل.'
    reason: lexical_alternative
  - marker: b
    text: تُذكّر السحابة بمشاهد في العهد القديم ارتبطت بظهور حضور الله، لكن الآية لا تصرّح بهذا التفسير.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα
  choice: هذا
  rationale: اسم الإشارة اليوناني جمع، لكنه يعود إلى الكلام السابق، والعربية المعاصرة تعبّر طبيعيًا عن مجموع الكلام بالمفرد «هذا» دون تغيير المرجع.
- source_word: αὐτοῦ λέγοντος
  choice: وبينما كان يقول
  rationale: ينقل تركيب المضاف المطلق مع اسم الفاعل المضارع معنى التزامن والاستمرار بعبارة عربية طبيعية.
- source_word: ἐγένετο νεφέλη
  choice: ظهرت سحابة
  rationale: يفيد التركيب حدوث السحابة أو بروزها في المشهد؛ و«ظهرت» واضحة ولا تحدد منشأها.
- source_word: ἐπεσκίαζεν
  choice: أخذت تظلّلهم
  rationale: ينقل الفعل الناقص اليوناني فعلًا جاريًا أو آخذًا في الحدوث، مع إبقاء صورة السحابة التي تظلّل الأشخاص.
- source_word: ἐφοβήθησαν
  choice: فخافوا
  rationale: صياغة عربية مباشرة وطبيعية تنقل وقوع الخوف في سياق السرد.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς
  choice: حين دخلوا
  rationale: ينقل المصدر المعرّف المسبوق بـἐν العلاقة الزمنية، مع إبقاء الضمير فاعلًا للدخول كما في القراءة النصية المعتمدة.
- source_word: εἰς τὴν νεφέλην
  choice: في السحابة
  rationale: الفعل العربي «دخل» يتعدى طبيعيًا بـ«في»، ويحفظ معنى الحركة إلى داخل السحابة.
theological_decisions:
- issue: طبيعة السحابة ودلالتها
  choice: وصف ظهور السحابة وتظليلها دون تسميتها صراحة حضورًا إلهيًا
  alternative: تفسيرها في المتن بأنها سحابة المجد أو حضور الله
  rationale: السياق يستدعي مشاهد الحضور الإلهي في العهد القديم، لكن الآية نفسها لا تصرح بهذا التفسير، لذلك تُحفظ الصورة ويُذكر الصدى المحتمل في الحاشية.
- issue: هوية الداخلين في السحابة
  choice: «دخلوا» وفق ظاهر الضمير في النص المعتمد، مع إبقاء مرجعه غير مصرّح به
  alternative: «حين دخل أولئك في السحابة» بما قد يقصر المرجع على يسوع وموسى وإيليا
  rationale: الضمير اليوناني يحتمل التباسًا مرجعيًا في السياق؛ وعدم تسمية الداخلين يحفظ هذا الالتباس بدل حسمه تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «تظلّلهم» حفاظًا على الصورة، و«دخلوا في السحابة» لإبراز الدخول إلى داخلها. وُضعت علامتا الحاشيتين في المتن، مع تجنب إدخال تفسير لاهوتي صريح أو حسم مرجع الضمير.
