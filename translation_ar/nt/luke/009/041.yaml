  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: ar
  text: 'فأجاب يسوع وقال: «أيها الجيل غير المؤمن والملتوي، إلى متى أكون معكم وأحتملكم؟ أحضر ابنَك إلى هنا».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενεὰ
  choice: جيلًا
  rationale: المقابل العربي الطبيعي الذي يحافظ على دلالة الجماعة المعاصرة ليسوع في هذا السياق.
- source_word: ἄπιστος
  choice: غير مؤمن
  rationale: ينقل معنى انعدام الإيمان بوضوح، من غير تضييقه إلى مجرد الشك أو عدم الأمانة.
- source_word: διεστραμμένη
  choice: ملتويًا
  rationale: يحافظ على صورة الانحراف والاعوجاج في اللفظ اليوناني، ولا يحصرها في فساد أخلاقي محدد.
- source_word: ἀνέξομαι ὑμῶν
  choice: أحتملكم
  rationale: صياغة عربية موجزة وطبيعية تعبّر عن الصبر على المخاطَبين وتحملهم.
- source_word: προσάγαγε ὧδε
  choice: أحضر ... إلى هنا
  rationale: ينقل الأمر بالحركة نحو المتكلم بعبارة عربية واضحة ومباشرة.
theological_decisions:
- issue: نطاق التوبيخ في عبارة «يا جيلًا غير مؤمن وملتويًا»
  choice: الإبقاء على المخاطَبين بصيغة الجمع من غير تحديد فئة بعينها
  alternative: تفسير الجيل بأنه التلاميذ وحدهم أو الجمع كله
  rationale: النص اليوناني لا يصرّح بمن تقع عليه العبارة على وجه الحصر، لذلك تُحفظ سعة المرجع والتوتر السياقي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، مع الحفاظ على نبرة التوبيخ والسؤال البلاغي والأمر المباشر. استُعمل النصب في النداء «يا جيلًا» على الوجه الفصيح، ووُصفت كلمة «جيل» بالمذكر بحسب جنسها النحوي.
