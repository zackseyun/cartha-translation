base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: ar
  text: وبعد هذه الأقوال[a] بنحو ثمانية أيام[b]، أخذ معه بطرس ويوحنا ويعقوب، وصعد إلى الجبل ليصلّي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بعد هذه الكلمات». يمكن أن تعني الكلمة اليونانية λόγους «الأقوال» أو «الكلمات» هنا.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «نحو ثمانية أيام»؛ وتدل الكلمة اليونانية ὡσεὶ على التقريب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وبعد
  rationale: تؤدي العبارة وظيفة انتقال سردي، وقد نُقلت الواو بوصفها رابطًا سرديًا طبيعيًا، بينما اندمج البناء الحدثي في الجملة الزمنية من غير إضافة «الآن» غير الصريحة في الأصل.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: بعد هذه الأقوال
  rationale: تشير λόγους إلى الكلام السابق مباشرة؛ و«الأقوال» عربية طبيعية ودقيقة، مع إثبات بديل «الكلمات» في الحاشية.
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: بنحو ثمانية أيام
  rationale: تحفظ «بنحو» دلالة التقريب التي تحملها ὡσεὶ، فلا تجعل المدة ثمانية أيام على وجه الدقة.
- source_word: παραλαβὼν
  choice: أخذ معه
  rationale: يفيد الفعل هنا اصطحاب الأشخاص المذكورين، و«أخذ معه» أوضح من «أخذ» وحدها في العربية.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: بطرس ويوحنا ويعقوب
  rationale: استُعملت الصيغ العربية المألوفة للأسماء، مع الحفاظ على تتابعها في النص اليوناني.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: صعد إلى الجبل
  rationale: تنقل «صعد» حركة الارتفاع، و«إلى الجبل» تؤدي دلالة الاتجاه في εἰς بصورة عربية سليمة، من غير افتراض تحديد هوية الجبل.
- source_word: προσεύξασθαι
  choice: ليصلّي
  rationale: 'اللام تنقل بوضوح دلالة الغرض في المصدر اليوناني: كان الصعود بقصد الصلاة.'
theological_decisions:
- issue: تقريب المدة الزمنية وعلاقتها بالروايات الموازية
  choice: بنحو ثمانية أيام
  alternative: ثمانية أيام
  rationale: تحفظ الترجمة أداة التقريب ὡσεὶ ولا توحّد صياغة لوقا مع الروايات الموازية أو تجعل العدد دقيقًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التقريب الزمني، وصيغت الجملة بسلاسة من غير ترجمة حرفية ثقيلة لعبارة الانتقال السردي.
