  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: ar
  text: ولمّا رجع الرسل، أخبروه بكلّ ما فعلوه. فأخذهم معه، وانصرف بهم على انفراد[a] إلى بلدة تُدعى بيت صيدا.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي منفصلين عن الآخرين؛ ويمكن ترجمتها: «في خلوة» أو «بعيدًا عن الناس». ولا تعني العبارة أن يسوع كان وحده، إذ كان الرسل معه.'
    reason: lexical_alternative
  - marker: b
    text: تضيف بعض المخطوطات وصفًا للوجهة بأنها «موضع مقفر تابع لبلدة تُدعى بيت صيدا»، وترد في مخطوطات أخرى صيغ قريبة.
    reason: textual_variant
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: ولمّا رجع
  rationale: صيغ اسم الفاعل اليوناني السابق للفعل الرئيسي في تركيب زمني عربي طبيعي يحفظ تعاقب الرجوع ثم الإخبار.
- source_word: οἱ ἀπόστολοι
  choice: الرسل
  rationale: «الرسل» هو المقابل العربي المألوف والدقيق للقب التلاميذ المرسلين في هذا السياق.
- source_word: διηγήσαντο αὐτῷ
  choice: أخبروه
  rationale: ينقل معنى إبلاغ يسوع وسرد ما جرى بعد عودتهم من المهمة، من غير إضفاء طابع رسمي زائد.
- source_word: ὅσα ἐποίησαν
  choice: بكلّ ما فعلوه
  rationale: ينقل شمول ὅσα، ويعبّر بوضوح عن الأعمال السابقة لإخبارهم.
- source_word: παραλαβὼν αὐτούς
  choice: فأخذهم معه
  rationale: يبيّن أن يسوع اصطحبهم، وهو المعنى السياقي للفعل παραλαμβάνω.
- source_word: ὑπεχώρησεν κατ’ ἰδίαν
  choice: وانصرف بهم على انفراد
  rationale: «انصرف» يحفظ معنى الابتعاد أو الانسحاب، و«بهم على انفراد» يوضح أن الخصوصية تشمل يسوع والرسل معًا ولا تعني أنه كان وحده.
- source_word: πόλιν καλουμένην Βηθσαϊδά
  choice: إلى بلدة تُدعى بيت صيدا
  rationale: «بلدة» مقابل طبيعي لـ πόλις لا يبالغ في حجم الموضع، و«تُدعى» تنقل καλουμένην، مع اعتماد الصيغة العربية المألوفة لاسم المكان.
theological_decisions:
- issue: دلالة κατ’ ἰδίαν مع كون الرسل برفقة يسوع
  choice: على انفراد، أي منفصلين عن الآخرين
  alternative: في خلوة؛ بعيدًا عن الناس
  rationale: النص يصرّح بأن يسوع أخذ الرسل معه، فلا يصح أن توحي العبارة بأنه كان وحده. وفي الوقت نفسه يُحفظ معنى الابتعاد والخصوصية من غير تحديد من انفصلوا عنهم صراحة في المتن.
- issue: الاختلاف النصي في وصف الوجهة
  choice: 'اتباع نص SBLGNT: «إلى بلدة تُدعى بيت صيدا»'
  alternative: «إلى موضع مقفر تابع لبلدة تُدعى بيت صيدا» أو صيغ مشابهة في بعض المخطوطات
  rationale: تُرجم النص اليوناني المعطى كما هو، مع التنبيه في الحاشية إلى القراءة الأطول ذات الشهادة المخطوطية.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة ووقورة. استُخدم «الرسل» و«بيت صيدا» وفق الاستعمال الكتابي العربي الشائع، وجاءت الجمل مترابطة من غير محاكاة ثقيلة لترتيب الكلمات اليوناني.
