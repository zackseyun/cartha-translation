- from: وإذا روحٌ يستولي عليه، فيصرخ فجأة، ويصرعه مصحوبًا بالزبد، ولا يكاد يفارقه إلا بعد أن يرضّه.
  to: وها إن روحًا يستولي عليه، فيصرخ فجأة، ويشنّجه مزبدًا، ولا يكاد يفارقه وهو يرهقه.
  rationale: عُدِّلت الصياغة لحفظ أداة التنبيه في ἰδοὺ، ولجعل الزبد حالًا للصبي، ولإزالة الاستنتاج الزمني غير الموجود في «إلا بعد أن». وتحافظ الترجمة على عدم توصيف πνεῦμα بما يتجاوز الأصل وعلى تسلسل الأفعال وزمنها الوصفي.
