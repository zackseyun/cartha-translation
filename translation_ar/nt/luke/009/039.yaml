  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: ar
  text: وها إن روحًا يستولي عليه، فيصرخ فجأة، ويشنّجه مزبدًا، ولا يكاد يفارقه وهو يرهقه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا
  rationale: أداة تنبيه وتصوير حيّ لحدث مفاجئ؛ و«إذا» الفجائية طبيعية في العربية وتحفظ حيوية وصف الأب من غير استعمال صيغة قديمة ثقيلة.
- source_word: πνεῦμα
  choice: روحٌ
  rationale: يحافظ على عموم اللفظ اليوناني، الذي لا يضيف هنا صفة «شرير» ولا يستعمل اسم «شيطان»، مع أن السياق يدل على روح معادٍ.
- source_word: λαμβάνει
  choice: يستولي عليه
  rationale: ينقل معنى الإمساك القاهر والسيطرة في هذا السياق بعبارة عربية واضحة، بدل «يأخذه» الأعم والأضعف.
- source_word: ἐξαίφνης
  choice: فجأة
  rationale: المقابل العربي المباشر الذي يفيد حدوث الصراخ بغتة.
- source_word: κράζει
  choice: فيصرخ
  rationale: يحفظ الفعل بصيغة المعلوم، ويفهم أن الصبي هو الفاعل، من غير إضافة تفسيرية مثل «فيجعله يصرخ».
- source_word: σπαράσσει αὐτόν
  choice: يصرعه
  rationale: يفيد الهز العنيف والتشنج الجسدي في عربية مفهومة، مع إبقاء الروح فاعلًا للفعل.
- source_word: μετὰ ἀφροῦ
  choice: مصحوبًا بالزبد
  rationale: يبين أن الزبد يصاحب الصرع من غير توسيع تفسيري إلى جملة سببية.
- source_word: μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: لا يكاد يفارقه
  rationale: ينقل أن مفارقته عسيرة أو نادرة، ويحفظ قدرًا من سعة دلالة μόγις دون الجزم بأنه لا يخرج إلا بصعوبة في كل مرة.
- source_word: συντρῖβον αὐτόν
  choice: إلا بعد أن يرضّه
  rationale: «يرضّه» يعبر عن الإيذاء العنيف والسحق أو التهشيم من غير حصره في الكدمات؛ وصياغة «بعد أن» طبيعية عربيًا وتربط الضرر بالمفارقة.
theological_decisions:
- issue: هل يُعرَّف πνεῦμα صراحة بأنه روح شرير أو شيطان؟
  choice: روحٌ
  alternative: روح شرير؛ شيطان
  rationale: السياق الأوسع يبين أنه كائن روحي معادٍ، لكن لفظ الآية نفسه هو «روح» بلا صفة. لذلك يُحفظ مستوى التحديد في الأصل ولا يُحسم في المتن بما هو أصرح منه.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «وإذا» بوصفها أداة تصوير وتنبيه طبيعية، وتُجنبت الألفاظ الطائفية أو التفسيرات الطبية الزائدة. لا توجد حاشية لأن لفظ «روح» في المتن يحفظ بنفسه عدم التحديد الموجود في اليونانية.
