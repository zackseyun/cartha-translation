review_pass:
  verdict: revise
  source_fidelity: المسودة تحافظ على «روح» غير الموصوفة وعلى معنى الاستيلاء والصراخ والتشنج إجمالًا. لكن «إلا بعد أن يرضّه» تجعل الإيذاء شرطًا زمنيًا سابقًا للمفارقة، في حين أن participle اليوناني συντρῖβον يصف فعلًا مصاحبًا للمفارقة («وهو يحطمه/يرهقه»)، لا فعلًا منتهيًا قبلها.
  naturalness: «وإذا روحٌ» مفهومة لكنها أقل سلاسة بوصفها افتتاحًا تنبيهيًا في الفصحى الحديثة؛ «وها إن روحًا» أوضح في نقل ἰδοὺ. كما أن «ويصرعه مصحوبًا بالزبد» قد تجعل «مصحوبًا» حالًا للروح أو للفعل على نحو ملتبس. صياغة «ويشنّجه مزبدًا» تجعل الحال راجعًا إلى الصبي بوضوح مقبول.
  terminology: «روح» اختيار سليم ولا ينبغي استبداله في المتن بـ«روح شرير» أو «شيطان». «يشنّجه» أدق من «يصرعه» لـσπαράσσει في هذا السياق، إذ ينقل التقلصات العنيفة دون الإيحاء الأساسي بإسقاطه أرضًا. «يرهقه» ينقل أثر συντρῖβον المدمّر المستمر من غير تحديد طبي زائد.
  issues:
  - severity: medium
    issue: إضافة ترتيب زمني في «إلا بعد أن يرضّه».
    rationale: الأصل يقول إن الروح بالكاد يفارقه «وهو يحطمه/يرهقه»، لا إنه لا يفارقه إلا بعد إتمام الإرضاض. يلزم حفظ المصاحبة بالفعل أو الحال.
  - severity: low
    issue: التباس الحال في «مصحوبًا بالزبد».
    rationale: قد يُفهم أن الروح هو المصحوب بالزبد. الحال «مزبدًا» بعد مفعول «يشنّجه» أوضح في إسناد الرغوة إلى الصبي.
  - severity: low
    issue: «يصرعه» أضيق وأقل دقة من معنى التشنج.
    rationale: σπαράσσει في هذا الوصف تدل على التشنج/الاختلاج العنيف؛ «يشنّجه» أوضح للقارئ الحديث.
  revised_text: وها إن روحًا يستولي عليه، فيصرخ فجأة، ويشنّجه مزبدًا، ولا يكاد يفارقه وهو يرهقه.
