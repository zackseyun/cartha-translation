  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: ar
  text: وأرسلهم ليعلنوا ملكوت الله ويشفوا المرضى.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حُكم الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: أرسلهم
  rationale: ينقل فعل الإرسال والتكليف بوضوح، ولا تحتاج العربية هنا إلى إضافة ما يقابل «إلى الخارج».
- source_word: κηρύσσειν
  choice: ليعلنوا
  rationale: يفيد الإعلان العلني، وهو تعبير عربي واضح ومعاصر وأقل تقييدًا بالسياق الوعظي من «ليكرزوا».
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: مصطلح كتابي عربي راسخ يحفظ اتساع الدلالة بين مُلك الله وسلطانه ونطاق حكمه.
- source_word: ἰᾶσθαι
  choice: يشفوا
  rationale: المقابل الطبيعي لفعل الشفاء في هذا السياق، ويحافظ على موازاة الغرضين بعد فعل الإرسال.
- source_word: τοὺς ἀσθενεῖς
  choice: المرضى
  rationale: مع أن اللفظة قد تعني الضعفاء، فإن اقترانها بالشفاء يرجح معنى المصابين بالمرض.
theological_decisions:
- issue: دلالة βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  alternative: حُكم الله
  rationale: «ملكوت الله» يحفظ الاتساع اللاهوتي للعبارة ولا يحصرها في فعل الحكم وحده، مع إثبات البديل الدلالي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات نبرة كتابية رصينة. استُعمل «يعلنوا» بدل المصطلح الكنسي الأضيق «يكرزوا»، مع إبقاء «ملكوت الله» بوصفه التعبير الكتابي العربي المألوف.
