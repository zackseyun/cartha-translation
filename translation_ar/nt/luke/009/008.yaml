  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: ar
  text: وقال بعضهم إن إيليا قد ظهر، وقال آخرون إن نبيًّا من الأنبياء القدماء قد قام[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نبيًّا من القدماء قد قام».'
    reason: يعكس الصياغة الأقرب حرفيًّا للعبارة اليونانية، حيث يُوصف النبي بأنه من «القدماء» دون ذكر لفظ «الأنبياء» صراحةً في الإضافة.
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: وقال بعضهم ... وقال آخرون
  rationale: حوِّل التركيب المبني على المصدر أو الجهة في اليونانية إلى صيغة قول عربية طبيعية، مع الحفاظ على توازي الرأيين وعلى الإضمار المستفاد من سياق الآية السابقة.
- source_word: δὲ ... δὲ
  choice: '... وقال آخرون'
  rationale: تؤدي δέ هنا وظيفة الربط الإضافي بين آراء متتابعة؛ والتوازي في العربية يغني عن ترجمتها بأداة مستقلة في الموضع الأول.
- source_word: ὅτι
  choice: إن
  rationale: تُدخل «إن» مضمون القول المنقول بوضوح وطبيعية في العربية.
- source_word: Ἠλίας
  choice: إيليا
  rationale: الصيغة العربية الكتابية المألوفة لاسم النبي.
- source_word: ἐφάνη
  choice: قد ظهر
  rationale: يحفظ معنى الظهور أو الصيرورة مرئيًّا، ويميّزه من فعل القيام في العبارة التالية.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: نبيًّا من القدماء
  rationale: يحافظ على عدم تعيين النبي وعلى بنية اليونانية التي تصفه بأنه نبي من أهل الأزمنة القديمة، من غير تحويلها جزمًا إلى «أحد الأنبياء القدماء».
- source_word: ἀνέστη
  choice: قد قام
  rationale: يحفظ دلالة النهوض التي تشير في السياق إلى القيام من الموت، من غير إدخال صيغة المبني للمجهول غير الصريحة في النص.
theological_decisions:
- issue: طبيعة قول الناس عن النبي القديم
  choice: قد قام
  alternative: قد أُقيم من الموت / عاد إلى الحياة
  rationale: يحفظ التعبير صلة الفعل بفكرة القيامة من الموت، من غير أن يشرح قول الناس أكثر مما يفعل النص أو يصادق عليه.
- issue: هوية النبي المذكور
  choice: نبيًّا من القدماء
  alternative: أحد الأنبياء القدماء
  rationale: يبقي النبي غير معيَّن، ويتبع تركيب النص الذي يقول حرفيًّا «نبيّ ما من القدماء» بدل أن يحسم أن المضاف إليه هو جماعة الأنبياء تحديدًا.
translation_notes:
  register: لغة عربية فصحى واضحة وموقرة. استُخدمت صيغة القول الصريحة لأن البنية اليونانية إضمارية تعتمد على سياق الآية السابقة، بينما تبدو هذه الصيغة طبيعية ومفهومة في العربية. وُضع «قد» مع الفعلين لإبراز أن القولين يتعلقان بحدث سابق.
