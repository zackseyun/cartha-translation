  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: ar
  text: 'لكن يسوع قال له: «لا تمنعوه[a]، لأن من ليس ضدكم فهو معكم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تعوقوه»، أو: «لا تحظروه».'
    reason: بدائل معجمية للفعل κωλύω، الذي يمكن أن يدل على المنع أو الإعاقة أو الحظر.
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: لكن يسوع قال له
  rationale: تفيد δέ هنا انتقالًا يحمل قدرًا خفيفًا من المقابلة مع اعتراض يوحنا السابق، ولذلك تنقلها «لكن» بوضوح من غير مبالغة. وتُبقي «له» الضمير الوارد في اليونانية بدل استبداله باسم يوحنا.
- source_word: Μὴ κωλύετε
  choice: لا تمنعوه
  rationale: الفعل κωλύω يعني المنع أو الإعاقة. والصيغة اليونانية تخاطب جماعة، وهو ما يظهر في واو الجماعة في «تمنعوه»، أما الهاء فتعود إلى الرجل المذكور في السياق السابق.
- source_word: ὃς γὰρ
  choice: لأن من
  rationale: تنقل «لأن» وظيفة γάρ التعليلية، وتفيد «من» قاعدة عامة مع بقائها منطبقة على الشخص المذكور مباشرة.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: ليس ضدكم
  rationale: تفيد κατά مع المضاف إليه معنى المعارضة. وتحافظ «ضدكم» على ضمير المخاطبين الجمع الواضح في اليونانية.
- source_word: ὑπὲρ ὑμῶν ἐστιν
  choice: فهو معكم
  rationale: تفيد ὑπέρ هنا التأييد والانحياز. و«معكم» عربية طبيعية تحفظ المقابلة الموجزة مع «ضدكم» وتحافظ على صيغة الجمع.
theological_decisions:
- issue: نطاق قول يسوع
  choice: صياغة القول قاعدةً عامة باستعمال «من»
  alternative: قصر العبارة على الرجل المعني بصياغة «فالذي ليس ضدكم هو معكم»
  rationale: يمكن للضمير الموصول اليوناني أن يشير إلى الحالة المباشرة وأن يصوغ في الوقت نفسه مبدأ أعم. وتحفظ «من» هذا الاتساع من غير إضافة تحديد عقائدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، مع الحفاظ على نبرة القول الحاسمة، وعلى جمع المخاطبين في «تمنعوه»، «ضدكم»، و«معكم».
