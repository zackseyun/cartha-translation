  source_fidelity: 'النص العربي ينقل عناصر اليونانية بأمانة: «لكن» تؤدي وظيفة δέ في سياق الرد، و«قال له» يحافظ على الضمير πρὸς αὐτόν دون استبداله باسم يوحنا. «لا تمنعوه» يحافظ على صيغة المخاطَب الجمع في Μὴ κωλύετε وعلى المفعول المفرد العائد إلى الرجل. كما تنقل «من ليس ضدكم فهو معكم» البنية المبدئية العامة والتقابل بين καθ’ ὑμῶν وὑπὲρ ὑμῶν، مع إبقاء ضمائر الجمع.'
  naturalness: الصياغة فصيحة معاصرة، موجزة، وسلسة في العربية. واو الجماعة في «تمنعوه» وضمائر الجمع في «ضدكم» و«معكم» واضحة وطبيعية. علامات الاقتباس والحاشية موضوعتان بصورة سليمة.
  terminology: استعمال «يسوع» متسق مع نقل الاسم، و«تمنعوه» اختيار واضح ودقيق لـ κωλύω في هذا السياق. بدائل الحاشية («لا تعوقوه»، «لا تحظروه») مفهومة وتخدم الغرض المعجمي من غير تحميل العبارة معنى مذهبيًا أو تفسيريًا زائدًا.
