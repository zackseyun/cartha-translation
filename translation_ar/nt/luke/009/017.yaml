lexical_decisions:
- source_word: ἔφαγον
  choice: أكلوا
  rationale: الماضي البسيط ينقل الفعل السردي في صيغة الماضي اليوناني نقلاً طبيعيًا ومباشرًا.
- source_word: ἐχορτάσθησαν
  choice: شبعوا
  rationale: تعبير عربي واضح وطبيعي يدل على أنهم أكلوا حتى الامتلاء، من غير تكلّف حرفي.
- source_word: πάντες
  choice: كلهم
  rationale: يحفظ التشديد على أن جميع الحاضرين أكلوا.
- source_word: ἤρθη
  choice: جُمع
  rationale: الفعل في المبني للمجهول، والسياق يدل على جمع البقايا؛ وتذكر الحاشية المقابل الأقرب إلى الصورة اللفظية، «رُفع».
- source_word: τὸ περισσεῦσαν
  choice: ما فضل
  rationale: ينقل اسم الفاعل المعرّف المستعمل استعمال الاسم بمعنى الشيء الذي بقي أو زاد.
- source_word: αὐτοῖς
  choice: لهم
  rationale: يحفظ ضمير الداتيف في موضع قريب من تركيبه اليوناني، من غير حسم زائد لطبيعة علاقته بالبقايا.
- source_word: κλασμάτων
  choice: الكِسَر
  rationale: يدل على القطع المكسورة من الطعام، وهو موجز ومألوف في العربية.
- source_word: κόφινοι δώδεκα
  choice: اثنتا عشرة قُفّة
  rationale: «قُفّة» اسم عربي مناسب لنوع السلة المشار إليه، مع مراعاة تأنيث المعدود في صياغة العدد.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وكريمة النبرة. استُعمل «شبعوا» لسلامته ووضوحه، و«قُفّة» للدقة من غير إثقال النص بشرح مادي غير لازم. أُبقي «لهم» قريبًا من «ما فضل» حفاظًا على تركيب المصدر وما فيه من احتمال دلالي.
