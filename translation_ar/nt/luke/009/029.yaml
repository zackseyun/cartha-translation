  choice: صار مظهر وجهه مختلفًا
  alternative: تغيّر مظهر وجهه؛ أضاء وجهه
  rationale: تحافظ الصياغة على وصف لوقا المتحفظ لتغيّر مرئي حقيقي، من غير مواءمته مع تعبير متى عن إشراق الوجه.
translation_notes:
