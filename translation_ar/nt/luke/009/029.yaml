lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: وفيما كان يصلّي
  rationale: ينقل الدلالة الزمنية للتركيب اللوقاوي بصياغة عربية طبيعية، من غير الإبقاء على العبارة الأسلوبية الثقيلة «وحدث».
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον
  choice: صار مظهر وجهه مختلفًا
  rationale: يحافظ على معنى εἶδος بوصفه المظهر المرئي، وعلى ἕτερον بمعنى «مختلفًا»، من غير استيراد وصف «أضاء» من الروايات الموازية.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: ثيابه
  rationale: مقابل عربي واضح وطبيعي يدل على لباسه في هذا السياق السردي.
- source_word: λευκὸς
  choice: بيضاء
  rationale: ينقل معنى اللون مباشرة، ويترك وصف اللمعان للكلمة التالية.
- source_word: ἐξαστράπτων
  choice: تتلألأ كالبرق
  rationale: يبرز الصورة البرقية الحية في الفعل اليوناني، بدل الاكتفاء بوصف عام مثل «لامعة» أو «باهرة».
theological_decisions:
