  rationale: جُعل «أعاده إلى أبيه» النص الرئيس لأنه ينقل بدقة معنى ἀπέδωκεν في سياق استرداد الأب لابنه بعد الشفاء، ونُقل «سلّمه» إلى الحاشية بوصفه بديلًا تعبيريًا. كما أُظهر «الصبي» فاعلًا لفعل الاقتراب لسلامة الإحالة العربية. ولم يُضف التعديل أي تفسير عقائدي أو تفصيل غير وارد في الأصل.
