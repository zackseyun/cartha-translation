  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: ar
  text: وبينما كان الصبي لا يزال يقترب، طرحه الشيطان أرضًا وجعله يتشنّج بعنف. لكن يسوع انتهر الروح النجس، وشفى الصبي، وأعاده إلى أبيه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سلّمه إلى أبيه».'
    reason: بديل تعبيري للفعل ἀπέδωκεν؛ والمعنى الأساسي في السياق هو الإرجاع أو الردّ إلى أبيه.
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: وبينما كان لا يزال يقترب
  rationale: ينقل التركيب المطلق في اليونانية بوصفه فعلًا متزامنًا مستمرًا، ويحفظ معنى ἔτι «لا يزال» من غير تحديد زائد لوجهة الاقتراب.
- source_word: ἔρρηξεν αὐτὸν
  choice: طرحه ... أرضًا
  rationale: يعبّر عن إسقاط الصبي بعنف تعبيرًا عربيًا طبيعيًا وواضحًا في هذا السياق.
- source_word: τὸ δαιμόνιον
  choice: الشيطان
  rationale: ترجمة مباشرة للموجود الروحي الشرير الشخصي في النص، مع إبقاء التعبير اللاحق «الروح النجس» متميزًا لفظيًا.
- source_word: συνεσπάραξεν
  choice: جعله يتشنّج بعنف
  rationale: ينقل معنى التقلصات أو الاختلاجات الشديدة بلغة عربية معاصرة مفهومة.
- source_word: ἐπετίμησεν
  choice: انتهر
  rationale: فعل عربي مألوف في سياق المواجهة السلطانية الحازمة ويحفظ قوة الفعل اليوناني.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: الروح النجس
  rationale: يحفظ وصف النجاسة كما في الأصل، وهو تعبير واضح ومستقر في العربية الكتابية.
- source_word: ἰάσατο
  choice: شفى
  rationale: ينقل بوضوح فعل الشفاء المذكور في النص من دون اختزاله في طرد الروح وحده.
- source_word: τὸν παῖδα
  choice: الصبي
  rationale: يلائم سياق الذكر الصغير ويظل أدق من «الابن»، لأن لفظ البنوة غير مصرح به في هذه العبارة نفسها.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: وسلّمه إلى أبيه
  rationale: تعبير عربي طبيعي يفيد إرجاع الصبي إلى أبيه بعد شفائه، مع إثبات البديل الأكثر تصريحًا بالعودة في الحاشية.
theological_decisions:
- issue: لغة الإصابة الشيطانية
  choice: 'ترجمة δαιμόνιον وπνεῦμα ἀκάθαρτον بوصفهما عاملًا روحيًا شخصيًا: «الشيطان» و«الروح النجس».'
  alternative: تفسيرهما على أنهما قوة شريرة غير شخصية أو حالة مرضية محضة.
  rationale: يعرض النص العامل الشيطاني بوصفه فاعلًا شخصيًا، فلا ينبغي للترجمة أن تحوّله إلى ظاهرة غير شخصية. وفي الوقت نفسه، يحفظ فعل «شفى» البعد العلاجي الذي يصرح به النص دون إذابة أحد البعدين في الآخر.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «جعله يتشنّج بعنف» بدل لفظ طبي غامض، وحُفظ التمييز اللفظي بين «الشيطان» و«الروح النجس» كما في اليونانية.
