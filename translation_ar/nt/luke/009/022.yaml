source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: ar
  text: 'قائلًا: «لا بد أن يتألم ابن الإنسان كثيرًا[a]، وأن يرفضه الشيوخ ورؤساء الكهنة والكتبة، وأن يُقتل، وأن يُقام[b] في اليوم الثالث».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ينبغي أن يتألم ابن الإنسان كثيرًا…».'
    reason: lexical_alternative
  - marker: b
    text: 'الفعل اليوناني مبني للمجهول؛ ويمكن أن يُترجم أيضًا: «أن يقوم»، لكن ذلك لا يحفظ صيغة المبني للمجهول.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰπὼν
  choice: قائلًا
  rationale: اسم فاعل حالي يؤدي وظيفة اسم الفاعل اليوناني الماضي في ربط القول بالسياق السابق، وهو تعبير عربي موجز وطبيعي.
- source_word: Δεῖ
  choice: ينبغي لـ
  rationale: يحفظ معنى الضرورة في التركيب غير الشخصي قدر الإمكان، من غير أن يصرح بفاعل الضرورة أو يفسر آليتها.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب بصيغته المعهودة ورنينه النصي، من غير تحويله إلى وصف عام للإنسان.
- source_word: πολλὰ παθεῖν
  choice: أن يتألم كثيرًا
  rationale: صياغة عربية طبيعية تنقل اتساع المعاناة الذي يفيده الجمع المحايد πολλὰ، من غير العبارة المتكلفة «يتألم أشياء كثيرة».
- source_word: ἀποδοκιμασθῆναι
  choice: أن يرفضه
  rationale: ينقل الرفض الرسمي بعد النظر والتقييم. استُعمل المبني للمعلوم مع ضمير المفعول لأن الجهات الفاعلة مذكورة، ولأن ذلك أوضح في العربية.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: الشيوخ ورؤساء الكهنة والكتبة
  rationale: تحدد هذه الأسماء الجهات القائمة بالرفض؛ والربط العربي المباشر بعد الفعل المتعدي يبين ذلك بوضوح.
- source_word: πρεσβυτέρων
  choice: الشيوخ
  rationale: يحفظ اسم فئة القيادة اليهودية المعروفة في سياق الأناجيل.
- source_word: ἀρχιερέων
  choice: رؤساء الكهنة
  rationale: يعبر عن طبقة كبار الكهنة في صيغة الجمع، لا عن وجود عدة شاغلين متزامنين لمنصب رئيس الكهنة المفرد.
- source_word: γραμματέων
  choice: الكتبة
  rationale: المقابل المباشر المألوف للفئة المذكورة، وأقل تفسيرًا من «معلمي الشريعة».
- source_word: ἀποκτανθῆναι
  choice: أن يُقتل
  rationale: يحفظ صيغة المبني للمجهول ودلالة وقوع القتل عليه، بعبارة مباشرة وواضحة.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: في اليوم الثالث
  rationale: المقابل العربي الطبيعي للدلالة الزمنية، ويحفظ الصيغة الإنجيلية المألوفة.
- source_word: ἐγερθῆναι
  choice: أن يُقام
  rationale: يحفظ المبني للمجهول في اليونانية وإيحاء الفعل الإلهي من غير تسمية الفاعل، ولا يحوله إلى فعل لازم بمعنى «يقوم».
theological_decisions:
- issue: صيغة فعل القيامة المبنية للمجهول
  choice: أن يُقام
  alternative: أن يقوم؛ أن يُبعث
  rationale: الفعل اليوناني ἐγερθῆναι مبني للمجهول. «أن يُقام» يحفظ الصيغة وإيحاء الفاعل الإلهي من غير التصريح به، بينما «أن يقوم» يحوله إلى المبني للمعلوم، و«أن يُبعث» يفسر المعنى بمصطلح آخر.
- issue: قوة Δεῖ
  choice: ينبغي لابن الإنسان أن
  alternative: لا بد أن؛ يجب على ابن الإنسان أن
  rationale: ينقل ضرورة الأحداث في التدبير الإلهي من غير الإيحاء بإلزام أخلاقي مفروض على ابن الإنسان، ويحافظ نسبيًا على البناء غير الشخصي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ لقب «ابن الإنسان» والمصطلحات الجماعية «الشيوخ ورؤساء الكهنة والكتبة». وُضعت علامة الحاشية بعد كامل القول لأنها تقدم بديلًا لتركيب افتتاح الجملة.
