  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: ar
  text: وحين صدر الصوت، وُجد يسوع وحده.[a] أما هم فظلّوا صامتين، ولم يخبروا أحدًا في تلك الأيام بشيء مما رأوه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بقي يسوع وحده» أو «لم يُرَ إلا يسوع». واليونانية حرفيًا: «وُجد يسوع وحده».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: وحين صدر الصوت
  rationale: 'تفيد صيغة ἐν مع المصدر المعرّف الزمن: «حين/عندما». واختيار «صدر الصوت» عربي طبيعي يحافظ على وقوع الصوت من غير أن يضيف مضمونًا غير مذكور.'
- source_word: φωνή
  choice: الصوت
  rationale: يدل اللفظ في السياق على الصوت السماوي المتكلم، و«الصوت» هو المقابل العربي المباشر والطبيعي.
- source_word: εὑρέθη
  choice: وُجد
  rationale: يحافظ المبني للمجهول على صيغة اليونانية وعلى تحفظ السرد، بدل تفسيرها صراحة بمعنى «شوهد» أو «بقي».
- source_word: μόνος
  choice: وحده
  rationale: تعبير عربي موجز وطبيعي يدل على أن يسوع كان منفردًا بعد غياب موسى وإيليا.
- source_word: ἐσίγησαν
  choice: ظلّوا صامتين
  rationale: ينقل استمرارهم في الصمت في سياق النتيجة، من غير مبالغة في دلالة الفعل.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: لم يخبروا أحدًا
  rationale: «أخبر» مقابل عربي مألوف لـἀπαγγέλλω في السرد، والنفي مع «أحدًا» طبيعي وواضح.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: في تلك الأيام
  rationale: ترجمة مباشرة تحافظ على الإطار الزمني الوارد في النص.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: بشيء مما رأوه
  rationale: يحافظ هذا التركيب على العلاقة التبعيضية في اليونانية، ويأتي عربيًا طبيعيًا بعد «لم يخبروا أحدًا».
theological_decisions:
- issue: الدلالة السردية لوجود يسوع منفردًا بعد الصوت السماوي
  choice: وُجد يسوع وحده
  alternative: بقي يسوع وحده / لم يُرَ إلا يسوع
  rationale: يصف النص نتيجة المشهد ولا يصرح بتفسير لاهوتي لها. تحافظ الصياغة المختارة على المبني للمجهول وعلى الغموض المشروع بدل تحديد هل المقصود البقاء أم الرؤية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «أما هم» لتمييز التلاميذ عن يسوع وتيسير انتقال السرد، مع المحافظة على تتابع الجمل في الأصل.
