base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: ar
  text: 'وقال لهم: «لا تحملوا شيئًا للطريق: لا عصًا، ولا كيس زاد[a]، ولا خبزًا، ولا مالًا[b]، ولا يكن لدى كل واحد منكم قميصان[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي كيسًا يحمله المسافر لمؤونته.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «فضة»، والمقصود هنا النقود.'
    reason: lexical_alternative
  - marker: c
    text: 'يفيد التعبير اليوناني التوزيع: «قميصان لكل واحد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: لا تحملوا شيئًا للطريق
  rationale: ينقل النهي بإيجاز، ويؤدي معنى أخذ المؤن أو حملها استعدادًا للسفر، مع الحفاظ على دلالة العبارة اليونانية الغائية.
- source_word: ῥάβδον
  choice: عصًا
  rationale: المراد في سياق السفر عصا يستعين بها المسافر، و«عصا» لفظ عربي واضح وموجز.
- source_word: πήραν
  choice: كيس زاد
  rationale: تشير الكلمة إلى كيس يحمله المسافر للمؤن؛ وهذه الصياغة أوضح من «كيس» وحدها من غير أن تفرط في التفسير.
- source_word: ἄρτον
  choice: خبزًا
  rationale: يحافظ على الشيء المذكور صراحة في المصدر، ولا يعممه إلى الطعام كله.
- source_word: ἀργύριον
  choice: مالًا
  rationale: المعنى الحرفي «فضة»، لكنها هنا مستعملة بمعنى النقود؛ و«مالًا» يؤدي المقصود العملي طبيعيًا.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: ولا يكن لكل واحد منكم قميصان
  rationale: يُظهر «لكل واحد» القوة التوزيعية لـἀνά، ويحافظ على النهي عن امتلاك قميصين لكل فرد في سياق الرحلة.
- source_word: χιτῶνας
  choice: قمصان
  rationale: χιτών ثوب يُلبس ملاصقًا للجسد؛ و«قميص» لفظ عربي تاريخي ومفهوم، وأقرب من التعميم بـ«ثياب».
theological_decisions: []
