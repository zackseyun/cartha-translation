  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: ar
  text: 'ولكني أقول لكم حقًّا: إنَّ بعض الواقفين هنا[a] لن يذوقوا الموت قطعًا[b] حتى يروا ملكوت الله.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «بعضٌ من الواقفين هنا».'
    reason: lexical_alternative
  - marker: b
    text: «يذوقوا الموت» تعبير اصطلاحي معناه «يختبروا الموت» أو «يموتوا».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: ولكني أقول لكم حقًّا
  rationale: تحافظ «ولكن» على وظيفة δέ الانتقالية/الاستدراكية، وتنقل «حقًّا» معنى ἀληθῶς بوصفه توكيدًا لصدق القول، مع ترتيب عربي طبيعي.
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: إنَّ بعض الواقفين هنا
  rationale: تنقل «بعض» معنى τινες والبنية التبعيضية، بينما تعبّر «الواقفين هنا» طبيعيًّا عن الحاضرين في الموضع المشار إليه، من غير إبقاء تركيب يوناني ثقيل في العربية.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: لن يذوقوا الموت قطعًا
  rationale: أُبقيت استعارة «ذوق الموت»، ونُقلت قوة النفي المؤكد في οὐ μή بواسطة «لن... قطعًا».
- source_word: ἕως ἂν ἴδωσιν
  choice: حتى يروا
  rationale: صياغة عربية طبيعية ودقيقة للحد الزمني المستقبلي الذي تعبّر عنه ἕως ἄν مع صيغة الاحتمال.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: «ملكوت الله» تعبير عربي كتابي راسخ ومفهوم، ويحفظ المجال الدلالي للباسيليا من غير اختزاله في «حكم الله» وحده.
theological_decisions:
- issue: المقصود برؤية ملكوت الله في السياق
  choice: الإبقاء على العبارة من دون شرح تفسيري
  alternative: تحديدها بالتجلّي، أو القيامة والصعود، أو خراب أورشليم، أو انتشار الكنيسة
  rationale: يسمح النص بأكثر من إحالة تفسيرية محتملة؛ لذلك لا تحسم الترجمة التوتر الأخروي ولا تُدخل مخططًا لاهوتيًّا بعينه.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. حُفظت استعارة «ذوق الموت» والتعبير التقليدي «ملكوت الله»، مع تجنّب الصياغة الجامدة أو التفسير العقائدي الزائد.
