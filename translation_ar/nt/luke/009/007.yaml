  text: Ἤκουσεν δὲ Ἡρῴδης ὁ τετραάρχης τὰ ⸀γινόμενα πάντα, καὶ διηπόρει διὰ τὸ λέγεσθαι ὑπό τινων ὅτι Ἰωάννης ⸀ἠγέρθη ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: ar
  text: وسمع هيرودس رئيسُ الربع عن كل ما كان يجري، فتحيَّر لأن بعض الناس كانوا يقولون إن يوحنا قد أُقيم من بين الأموات[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد قام من بين الأموات». غير أن الفعل اليوناني مبني للمجهول، وحرفيًا: «قد أُقيم».'
    reason: بيان البديل المعجمي مع توضيح أن صيغة الأصل مبنية للمجهول.
lexical_decisions:
- source_word: Ἤκουσεν δὲ
  choice: وسمع
  rationale: تؤدي الواو وظيفة δέ بوصفها رابطًا سرديًا خفيفًا، ويعبّر الفعل «سمع بـ» طبيعيًا عن وصول أخبار الأحداث إلى هيرودس من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: ὁ τετραάρχης
  choice: رئيسُ الربع
  rationale: يحافظ هذا التعبير على اللقب السياسي التاريخي المحدد، بدل تسطيحه إلى «ملك» أو «حاكم» فقط.
- source_word: τὰ γινόμενα πάντα
  choice: بجميع ما كان يجري
  rationale: صياغة عربية طبيعية تنقل شمول πάντα والطابع الجاري للأحداث في γινόμενα.
- source_word: διηπόρει
  choice: فتحيَّر
  rationale: ينقل حالة الحيرة وعدم الاهتداء إلى تفسير، في عبارة عربية واضحة وموجزة.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: لأن بعض الناس كانوا يقولون
  rationale: ينقل معنى السببية ويُظهر أصحاب القول غير المحددين المذكورين في ὑπό τινων، مع تحويل المبني للمجهول إلى تركيب عربي أكثر سلاسة من غير تغيير المعنى.
- source_word: ἠγέρθη
  choice: قد أُقيم
  rationale: يحافظ على صيغة المبني للمجهول في اليونانية وعلى دلالة الحدث السابق للخبر المتداول.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: ينقل العبارة اليونانية بدقة في تعبير عربي مألوف في سياق القيامة.
theological_decisions:
- issue: صياغة خبر قيامة يوحنا
  choice: قد أُقيم من بين الأموات
  alternative: قد قام من بين الأموات
  rationale: الفعل اليوناني مبني للمجهول، لذلك أبقى المتن هذه الصيغة ولم يحوّلها بصمت إلى فعل لازم، مع ذكر البديل الطبيعي في الحاشية حفاظًا على التوتر الدلالي.
translation_notes:
  register: العربية فصحى حديثة واضحة وذات نبرة سردية رصينة. استُعمل اللقب التاريخي «رئيس الربع»، ووُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
