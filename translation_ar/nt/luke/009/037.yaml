lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وَ
  rationale: تؤدي العبارة هنا وظيفة انتقال سردي، فصيغت بواو الاستئناف الطبيعية من غير ترجمة حرفية ثقيلة مثل «وحدث».
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: في اليوم التالي
  rationale: تعبير زمني يدل على اليوم اللاحق، وهذه صياغة عربية واضحة وقريبة من الأصل.
- source_word: κατελθόντων αὐτῶν
  choice: لما نزلوا
  rationale: ينقل التركيب المطلق الظرفي بوصف النزول فعلًا تم قبل الفعل الرئيس، من غير إثقال الأسلوب.
- source_word: ἀπὸ τοῦ ὄρους
  choice: من الجبل
  rationale: «الجبل» هو المقابل المعتاد والملائم سياقيًا لكلمة ὄρος.
- source_word: συνήντησεν αὐτῷ
  choice: لاقاه
  rationale: فعل عربي موجز وطبيعي يفيد الالتقاء به، ويحافظ على كون يسوع هو مرجع الضمير المفرد.
- source_word: ὄχλος πολύς
  choice: جمع كبير
  rationale: ينقل معنى حشد كثير العدد بلغة عربية فصيحة ومفهومة.
