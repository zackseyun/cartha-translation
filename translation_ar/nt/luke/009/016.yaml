base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: ar
  text: ثم أخذ الأرغفة الخمسة والسمكتين، ورفع نظره نحو السماء، وباركها[a]، وكسرها، وظلّ يناولها للتلاميذ ليضعوها أمام الجمع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شكر لأجلها». الفعل اليوناني هنا يعني حرفيًا «بارك»، بينما تستعمل بعض الروايات الموازية تعبير «شكر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν δὲ
  choice: ثم أخذ
  rationale: تنقل التقدّم السردي والفعل السابق للأفعال الرئيسة بصياغة عربية طبيعية واضحة.
- source_word: τοὺς πέντε ἄρτους
  choice: الأرغفة الخمسة
  rationale: الرغيف هو المقصود المعدود في سياق الإطعام، لا الخبز بوصفه اسم جنس.
- source_word: τοὺς δύο ἰχθύας
  choice: السمكتين
  rationale: صيغة المثنى العربية تقابل العدد اليوناني بوضوح وطبيعية.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ورفع نظره نحو السماء
  rationale: تعبير عربي طبيعي يحفظ حركة النظر إلى أعلى ودلالة السماء في سياق الصلاة.
- source_word: εὐλόγησεν αὐτοὺς
  choice: وباركها
  rationale: يحفظ فعل «بارك» الوارد في اليونانية، والضمير يعود إلى الأرغفة والسمكتين معًا، ويأتي في العربية لغير العاقل بصيغة المفرد المؤنث.
- source_word: κατέκλασεν
  choice: وكسرها
  rationale: ينقل معنى كسر الطعام تمهيدًا لتوزيعه، مع إظهار المفعول المفهوم من السياق.
- source_word: ἐδίδου
  choice: وظلّ يناولها
  rationale: «ظلّ» مع المضارع تبرز الاستمرار أو التكرار الذي تدل عليه صيغة الماضي الناقص اليونانية، و«يناول» تلائم إعطاء الطعام للتلاميذ.
- source_word: τοῖς μαθηταῖς
  choice: للتلاميذ
  rationale: يحفظ أداة التعريف من غير إضافة ضمير ملكية غير مصرّح به.
- source_word: παραθεῖναι τῷ ὄχλῳ
  choice: ليضعوها أمام الجمع
  rationale: يحفظ معنى الغرض في المصدر، والمعنى الملموس لوضع الطعام أمام الحاضرين، ويترجم ὄχλος بلفظ عربي فصيح شائع في السرد الكتابي.
theological_decisions:
- issue: دلالة οὐρανός في سياق رفع النظر والبركة
  choice: السماء
  alternative: الفضاء أو العلو
  rationale: «السماء» تحفظ البعد الديني للسياق من غير حصر اللفظ في المشهد المادي وحده أو إضافة تفسير عقائدي.
- issue: معنى εὐλόγησεν
  choice: باركها
  alternative: شكر لأجلها
  rationale: النص اليوناني يستعمل فعل «بارك» لا فعل «شكر»، ولذلك تُحفظ خصوصيته ولا يُسوّى صامتًا بالروايات الموازية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. روعي تسلسل الأفعال، واستمرار فعل المناولة، والتمييز بين البركة والشكر، مع تجنب الألفاظ المذهبية أو التفسير الزائد.
