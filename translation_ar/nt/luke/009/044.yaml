    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: ضعوا أنتم ... في آذانكم
  rationale: يحافظ هذا التعبير على صورة الأصل الحية وعلى توكيد الضمير ὑμεῖς، مع صيغة أمر عربية مباشرة تدعو إلى الإصغاء الواعي وحفظ الكلام.
- source_word: τοὺς λόγους τούτους
  choice: هذه الكلمات
  rationale: إحالة مباشرة إلى الكلام المحدد الذي يقوله يسوع، من غير توسيع تفسيري.
- source_word: ὁ γὰρ
  choice: إن
  rationale: تربط الجملة التالية بالأمر السابق بوصفها مضمونه وسبب ضرورة الانتباه إليه، مع صياغة عربية طبيعية.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة العربية الحرفية الراسخة لهذا اللقب، وتحفظ غموضه ودلالاته الكتابية من غير تفسير زائد.
- source_word: μέλλει
  choice: على وشك أن
  rationale: تنقل معنى الحدث الوشيك الذي تفيده μέλλω هنا، من غير إدخال معنى الحتمية أو القدر.
- source_word: παραδίδοσθαι
  choice: يُسلَّم
  rationale: تحفظ سعة الفعل اليوناني، الذي يدل على التسليم إلى سلطة آخرين وقد يحمل في السياق معنى الخيانة، من غير حصره في ذلك المعنى.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: إلى أيدي الناس
  rationale: تحافظ على الصورة الاصطلاحية الدالة على الوقوع تحت سلطان الآخرين؛ و«الناس» تقابل ἀνθρώπων هنا من غير قصر المرجع على الذكور.
theological_decisions:
- issue: لقب ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: يحفظ اللقب بصيغته الموروثة وإمكان صلته بدانيال 7، ولا يختزل دلالته المسيانية أو يحسم غموضه.
- issue: مدى دلالة παραδίδοσθαι
  choice: يُسلَّم
  alternative: يُخان
  rationale: يتنبأ النص بتسليم يسوع إلى سلطان البشر على نحو أوسع من فعل خيانة يهوذا وحده؛ لذلك تبقى الترجمة الأوسع في المتن، ويُذكر البديل في الحاشية.
- issue: دلالة ἀνθρώπων
  choice: الناس
  alternative: الرجال
  rationale: ἀνθρώπων يمكن أن يشمل البشر عمومًا هنا، والمقابلة الأساسية هي بين «ابن الإنسان» ومن سيقع في أيديهم، لا إثبات جنس أولئك الأشخاص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. أُبقيت صورة «في آذانكم» لما فيها من قوة مقصودة في الأصل، واستُعمل «على وشك أن» بدل الصيغ الأشد قدمًا مثل «مزمع أن».
