  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: ar
  text: «ضعوا أنتم هذه الكلمات في آذانكم، فإن ابن الإنسان على وشك أن يُسلَّم[a] إلى أيدي الناس».
