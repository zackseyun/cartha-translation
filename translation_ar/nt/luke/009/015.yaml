  rationale: تعبير عربي واضح يحيل إلى أمر يسوع في الآية السابقة ويحفظ معنى «صنعوا على هذا النحو».
- source_word: καὶ
  choice: و
  rationale: تحفظ العطف البسيط بين الفعلين وتسلسل الحدث.
- source_word: κατέκλιναν
  choice: أجلسوا
  rationale: فعل متعدٍّ يحفظ السببية في الأصل، أي إنهم جعلوا الناس يتخذون وضع الجلوس أو الاتكاء استعدادًا للطعام، وهو طبيعي وواضح بالعربية المعاصرة.
- source_word: ἅπαντας
  choice: الجميع
  rationale: ينقل شمول اللفظ اليوناني بإيجاز، ويفهم مرجعه إلى الحاضرين من السياق.
