  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: ar
  text: 'لكن يسوع قال: «ما من أحد يضع يده على المحراث ثم ينظر إلى الوراء يصلح لملكوت الله».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما من أحد، بعدما وضع يده على المحراث وأخذ ينظر إلى الوراء، يكون ملائمًا لملكوت الله». تشير الصورة إلى من يبدأ عمل الحرث ثم يوجّه انتباهه إلى الخلف؛ ويمكن أن تعني «يصلح» أيضًا «يكون ملائمًا» أو «نافعًا».'
    reason: بيان البديل التركيبي والمدى الدلالي للصورة ولصفة εὔθετος.
lexical_decisions:
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا ذا مسحة استدراكية في جواب يسوع، و«لكن» تلائم السياق السابق.
- source_word: Οὐδεὶς
  choice: ما من أحد
  rationale: تؤدي النفي العام بعبارة عربية طبيعية من غير تقييد بالجنس.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: يضع يده على المحراث
  rationale: تحافظ على الصورة الزراعية وعلى معنى الشروع في الحرث؛ وصيغة المضارع أنسب لسلاسة التركيب العربي بعد «ما من أحد» دون إلغاء سبق هذا الفعل للنظر إلى الوراء.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: ينظر إلى الوراء
  rationale: ترجمة مباشرة وطبيعية تحفظ الصورة الحرفية ودلالتها المجازية على الالتفات عما بدأه المرء.
- source_word: εὔθετός
  choice: يصلح
  rationale: تفيد الملاءمة والصلاح لغرض، من غير أن تضيف حكمًا صريحًا بالاستحقاق أو تحدد المقصود بالخلاص النهائي.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: لملكوت الله
  rationale: اللام تؤدي علاقة الملاءمة التي تفيدها صيغة الداتيف مع εὔθετος، و«ملكوت الله» تعبير عربي كتابي واضح ومستقر.
theological_decisions:
- issue: دلالة εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: «يصلح لملكوت الله» بوصفها عبارة عامة عن الملاءمة لمقتضيات الملكوت
  alternative: «يستحق دخول ملكوت الله» أو «ينفع في خدمة ملكوت الله»
  rationale: النص يقرر عدم الملاءمة من خلال صورة الحرث والالتفات إلى الوراء، لكنه لا يحصر ذلك صراحةً في استحقاق الدخول ولا في منفعة الخدمة؛ لذلك تُحفظ سعته وتوتره اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظت الصورة الزراعية، واستُعمل «ملكوت الله» للمصطلح المألوف. وُضع مؤشر الحاشية [a] في المتن، وجُمعت فيه البدائل التي تفيد القارئ دون إثقال الآية.
