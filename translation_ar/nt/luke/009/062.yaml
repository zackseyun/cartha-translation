  source_fidelity: 'النص العربي ينقل بدقة البنية الأساسية للقول: النفي الشامل («ما من أحد»)، وصورة وضع اليد على المحراث، والالتفات إلى الوراء، والحكم بعدم الملاءمة لملكوت الله. استعمال المضارع العربي في «يضع ... ينظر» طبيعي في صياغة قولٍ عام، ولا يخلّ جوهريًا بتقدّم فعل وضع اليد في المشاركة اليونانية عن فعل النظر المستمر.'
  naturalness: الصياغة فصيحة واضحة وموجزة، وتحافظ على جرس المثل التحذيري. «يصلح لملكوت الله» تعبير عربي طبيعي في هذا السياق، و«المحراث» هو المقابل الزراعي المباشر والمألوف.
  terminology: «يسوع» و«ملكوت الله» مصطلحان مستقران ومناسبان للسجل الكتابي العربي. و«يصلح» ينقل εὔθετος بوصفه ملاءمة أو صلاحية، من غير فرض تفسير يتعلق بالخلاص النهائي أو بالخدمة وحدها.
