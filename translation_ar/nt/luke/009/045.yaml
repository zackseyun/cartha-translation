id: LUK.9.45
reference: Luke 9:45
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: ar
  text: أما هم فلم يفهموا هذا القول[a]، وكان محجوبًا عنهم لكيلا يدركوه[b]، وخافوا أن يسألوه عن هذا القول.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكلمة» أو «الكلام» أو «الأمر»؛ فالكلمة اليونانية (ῥῆμα) تحتمل هذه المعاني بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'يقول النص اليوناني: «كان محجوبًا عنهم» من غير أن يحدّد مَن حجبه.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: لم يفهموا
  rationale: يدل الفعل في السياق على عجز التلاميذ عن فهم قول يسوع، وهذه صياغة عربية واضحة وطبيعية.
- source_word: ῥῆμα
  choice: القول
  rationale: يشير هنا إلى الكلام المحدد الذي قاله يسوع، و«القول» يحافظ على دلالة الكلام المنطوق.
- source_word: παρακεκαλυμμένον
  choice: كان محجوبًا
  rationale: تحافظ الصياغة على حالة الاحتجاب التي تفيدها البنية اليونانية وعلى المبني للمجهول من غير تعيين الفاعل.
- source_word: ἀπ’ αὐτῶν
  choice: عنهم
  rationale: تنقل العبارة معنى كون القول محجوبًا عن إدراكهم.
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: لكيلا يدركوه
  rationale: «يدركوه» تترجم معنى الوعي أو التبيّن، وتحافظ على تمييز معقول عن «لم يفهموا» في أول الآية.
- source_word: ἐφοβοῦντο
  choice: خافوا
  rationale: صياغة عربية مباشرة وطبيعية تنقل خوفهم من طرح السؤال.
- source_word: ἐρωτῆσαι
  choice: أن يسألوه
  rationale: يفيد المصدر سؤال يسوع طلبًا للإيضاح، و«يسألوه» هو المقابل العربي الطبيعي.
theological_decisions:
- issue: الجهة التي حجبت القول
  choice: 'الإبقاء على المبني للمجهول: «كان محجوبًا عنهم»'
  alternative: أن يُصرَّح بأن الله حجبه عنهم، أو أن يقال فقط إنه ظل غامضًا لديهم
  rationale: النص اليوناني لا يسمّي من حجب القول؛ لذلك تحافظ الترجمة على الغموض المقصود ولا تحسم المسألة لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أما هم» لإظهار المقابلة التي تفيدها οἱ δὲ، وحُفظ المبني للمجهول والغموض المتعلق بفاعل الحجب.
