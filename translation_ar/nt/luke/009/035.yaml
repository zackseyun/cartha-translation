  naturalness: الصياغة فصيحة واضحة ومناسبة للسرد الكتابي الحديث. و«فاسمعوا له» تعبير عربي سليم ذو دلالة الإصغاء والامتثال في هذا المقام، ويحافظ على قوة الأمر.
