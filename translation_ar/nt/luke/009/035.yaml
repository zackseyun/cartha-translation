  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: ar
  text: 'وجاء صوتٌ من السحابة يقول: «هذا هو ابني، المختار[a]؛ فاسمعوا له».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «ابني الحبيب» بدلًا من «ابني، المختار».'
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: وجاء صوتٌ
  rationale: ينقل التعبير اليوناني الدال على حدوث الصوت بصياغة عربية طبيعية، من غير الترجمة الحرفية الثقيلة «صار صوت».
- source_word: ἐκ τῆς νεφέλης
  choice: من السحابة
  rationale: تفيد ἐκ مصدر الصوت أو منشأه، و«من السحابة» تعبير عربي واضح ودقيق.
- source_word: λέγουσα
  choice: يقول
  rationale: يقدّم مضمون الصوت بصياغة سردية عربية طبيعية، مع مراعاة تذكير «صوت» في العربية.
- source_word: Οὗτός ἐστιν
  choice: هذا هو
  rationale: يحفظ قوة التعريف والإشارة في التركيب اليوناني، ويأتي طبيعيًّا في العربية.
- source_word: ὁ υἱός μου
  choice: ابني
  rationale: ترجمة مباشرة للفظ البنوة مع ضمير الملكية، بلا إضافة تفسير عقائدي.
- source_word: ὁ ἐκλελεγμένος
  choice: المختار
  rationale: ينقل اسم المفعول التام من ἐκλέγομαι بمعنى الذي وقع عليه الاختيار، ويحفظ أداة التعريف ولا يضيف ضمير ملكية ثانيًا غير موجود في النص اليوناني.
- source_word: αὐτοῦ ἀκούετε
  choice: فاسمعوا له
  rationale: يفيد الأمر بالإصغاء إليه وقبول قوله، ويحفظ إبراز الضمير المتقدم في اليونانية بصياغة عربية واضحة ومهيبة.
theological_decisions:
- issue: وصف الابن في الصوت السماوي مع وجود قراءة نصية بديلة
  choice: اتباع قراءة ἐκλελεγμένος وترجمتها «المختار»
  alternative: قراءة ἀγαπητός وترجمتها «الحبيب»
  rationale: النص اليوناني المعتمد يقرأ «المختار»، ولذلك لا تُسوّى عبارة لوقا بعبارة الأناجيل الموازية الأشهر. وتُذكر القراءة البديلة في الحاشية حفاظًا على الشاهد النصي من غير حسم تفسيري زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. وُضع رمز الحاشية عند «المختار» لأنه موضع الاختلاف النصي. حافظت الصياغة على لقبي «ابني» و«المختار» من غير دمجهما أو إضافة ملكية غير مصرّح بها في اليونانية.
