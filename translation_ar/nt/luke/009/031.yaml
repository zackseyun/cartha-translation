translation:
  language: ar
  text: اللذان ظهرا في مجد، وكانا يتحدثان عن خروجه[a] الذي كان مزمعًا أن يتمّه في أورشليم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي رحيله؛ ويُفهم في السياق أنه مرتبط بموته في أورشليم. والكلمة اليونانية تعني حرفيًا «الخروج»، وقد تحمل أيضًا صدى خروج بني إسرائيل من مصر.
    reason: يوضح الصلة السياقية بالموت دون اختزال دلالة ἔξοδος في الموت وحده، ويحافظ على الإيحاء الكتابي المحتمل.
lexical_decisions:
- source_word: οἳ
  choice: اللذان
  rationale: الضمير الموصول اليوناني بصيغة الجمع، لكنه يعود في السياق إلى شخصين هما موسى وإيليا، فاستُعمل المثنى العربي الطبيعي.
- source_word: ὀφθέντες ἐν δόξῃ
  choice: ظهرا في مجد
  rationale: ينقل معنى الظهور العلني في هيئة مجيدة بإيجاز ووضوح.
- source_word: ἔλεγον
  choice: كانا يتحدثان
  rationale: صيغة الماضي الناقص تدل على حديث جارٍ ومستمر، لا على قول لحظي واحد.
- source_word: ἔξοδον
  choice: خروجه
  rationale: يحافظ على الصورة اللفظية اليونانية وعلى دلالتها المفتوحة بين الرحيل بالموت وإيحاء الخروج، بدل اختزالها في «موته».
- source_word: ἤμελλεν πληροῦν
  choice: كان مزمعًا أن يتمّه
  rationale: «مزمعًا» تنقل معنى الأمر الوشيك أو المقدّر، و«يتمّه» تحفظ دلالة πληροῦν على الإتمام والإنجاز دون تسطيحها إلى مجرد الحدوث.
- source_word: ἐν Ἰερουσαλήμ
  choice: في أورشليم
  rationale: نقل مباشر لاسم المدينة ولحرف الجر المكاني.
theological_decisions:
- issue: دلالة «خروجه» وصلتها بموت يسوع وقيامته وصعوده
  choice: الإبقاء على «خروجه» في المتن
  alternative: «رحيله» أو «موته»
  rationale: اللفظ اليوناني ἔξοδος أوسع من «الموت» وحده، وقد يحمل صدى قصة الخروج؛ لذلك تُحفظ كثافته ولا يُحسم مدلوله لاهوتيًا في المتن.
- issue: معنى «يتمّه»
  choice: صياغة الفعل بحيث يكون يسوع فاعل إتمام خروجه
  alternative: «الذي كان سيحدث له»
  rationale: النص اليوناني يسند فعل πληροῦν إلى يسوع نفسه، بما يوحي بإتمام مقصود، ولذلك لم تُستعمل صياغة مبنية للمجهول.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة ذات نبرة كتابية رصينة. استُعمل المثنى لأن المرجع شخصان، وحُفظ لفظ «الخروج» لما فيه من دقة وتعدد دلالي.
