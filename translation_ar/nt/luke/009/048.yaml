reference: Luke 9:48
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: ar
  text: 'وقال لهم: «مَن يقبل هذا الطفل باسمي[a] يقبلني، ومَن يقبلني يقبل الذي أرسلني. لأن مَن كان الأصغر[b] بينكم جميعًا، فهو عظيم.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «يقبل» في أنحاء الآية بـ«يرحّب بـ»؛ فالفعل اليوناني يحتمل معنى القبول والترحيب والضيافة. و«باسمي» قد تعني أيضًا «على أساس اسمي» أو «بسبب اسمي»، أي قبول الطفل لارتباطه بيسوع وسلطانه.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «الأصغر». وقد يدل «الأصغر» هنا على الأقل منزلة أو الأكثر تواضعًا، لا على الأصغر سنًا أو حجمًا بالضرورة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: يقبل
  rationale: يحفظ تكرار الفعل في أجزاء القول الثلاثة، ويتسع لمعنى القبول والترحيب دون حصره في الضيافة وحدها.
- source_word: παιδίον
  choice: الطفل
  rationale: هو المقابل العربي الواضح المباشر، ولا يقتضي اللفظ اليوناني هنا إضافة «الصغير».
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: باسمي
  rationale: صياغة عربية طبيعية تحفظ ارتباط القبول باسم يسوع وسلطانه والولاء له، من غير تضييق المعنى على سبب واحد.
- source_word: τὸν ἀποστείλαντά με
  choice: الذي أرسلني
  rationale: ينقل اسم الفاعل المعرّف بوضوح، ويحفظ المرجع الضمني من غير إضافة «الآب» أو «الله» إلى نص الآية.
- source_word: μικρότερος
  choice: الأصغر
  rationale: يحفظ الصيغة المقارنة في اليونانية، مع إبقاء إمكان فهمها من جهة المنزلة المتواضعة لا السن أو الحجم فقط.
- source_word: ἐν πᾶσιν ὑμῖν
  choice: بينكم جميعًا
  rationale: ينقل العلاقة داخل الجماعة بعبارة عربية واضحة وطبيعية.
- source_word: ὑπάρχων
  choice: مَن هو
  rationale: يؤدي وظيفة اسم الفاعل الخبرية بصلة عربية سلسة.
- source_word: οὗτός ἐστιν μέγας
  choice: فهذا هو عظيم
  rationale: يحفظ توكيد اسم الإشارة والمفارقة المقصودة في الحكم بالعظمة.
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: مَن ... ومَن
  rationale: ينقل الشرط العام غير المحدد بإيجاز وفصاحة.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: وقال لهم
  rationale: يعكس أداة العطف والسرد المباشر من غير إضافة دلالة زمنية غير مصرّح بها.
theological_decisions:
- issue: مرجع «الذي أرسلني»
  choice: الإبقاء على الإشارة الضمنية إلى الآب/الله من غير تسميته صراحة
  alternative: «الآب الذي أرسلني» أو «الله الذي أرسلني»
  rationale: النص اليوناني يستعمل اسم فاعل معرّفًا ولا يسمّي الآب، ولذلك تُحفظ دعوى الإرسال والعلاقة من غير توسيع النص.
- issue: معنى قبول الطفل «باسمي»
  choice: إبقاء العبارة واسعة لتشمل القبول المتصل باسم يسوع وسلطانه والولاء له
  alternative: «لأنه ينتمي إليّ» أو «من أجلي»
  rationale: تحفظ «باسمي» البعد التمثيلي والسلطاني ولا تختزل القول في مجرد الإحسان الإنساني.
- issue: مفارقة العظمة والصغر
  choice: الحفاظ على وصف «الأصغر» وعلى الحكم المؤكد بأنه عظيم
  alternative: تفسير «الأصغر» مباشرةً بأنه «الأقل شأنًا» أو «الأكثر تواضعًا»
  rationale: يبقي هذا التوتر المقصود واتساع المقارنة اليونانية، بينما توضح الحاشية أن السياق يرجح المنزلة المتواضعة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ التكرار البلاغي للفعل «يقبل»، كما حُفظ توكيد «فهذا هو» والمفارقة بين «الأصغر» و«عظيم». وُضعت علامتا الحاشيتين في المتن، وجُمعت البدائل المتصلة بالقبول و«باسمي» في الحاشية [a].
