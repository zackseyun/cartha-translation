  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: ar
  text: 'وبينما كانوا سائرين في الطريق، قال له شخص: «سأتبعك أينما تذهب».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «أينما تمضي» أو «أينما ترحل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: وبينما كانوا سائرين
  rationale: تركيب المضاف إليه المطلق مع اسم الفاعل المضارع يدل على حركة مستمرة متزامنة مع القول؛ وهذه الصياغة عربية طبيعية تحفظ ذلك المعنى الزمني.
- source_word: ἐν τῇ ὁδῷ
  choice: في الطريق
  rationale: يحفظ المعنى المكاني الملموس للطريق، مع إبقاء ما قد يحمله سياق لوقا من صدى لمسيرة الرحلة دون التصريح به تفسيرًا.
- source_word: εἶπέν τις
  choice: قال له شخص
  rationale: الضمير τις نكرة ولا يصرّح بأن المتكلم رجل؛ لذلك تتجنب الصياغة إضافة جنس غير مذكور في اليونانية.
- source_word: Ἀκολουθήσω σοι
  choice: سأتبعك
  rationale: المستقبل يدل على قصد أو التزام معلن، وفعل «أتبع» يحفظ معنيي السير وراءه والتلمذة من غير توسع تفسيري.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: أينما تذهب
  rationale: 'ὅπου مع ἐάν وصيغة الاحتمال تفيد العموم غير المحدد: «أينما»؛ و«تذهب» عربية طبيعية في السياق، مع الإشارة في الحاشية إلى المعنى الحرفي المحتمل «تمضي/ترحل».'
theological_decisions:
- issue: الدلالة التلمذية المحتملة في ἀκολουθέω
  choice: سأتبعك
  alternative: سأصير تلميذًا لك أينما تذهب
  rationale: يحمل الفعل في لوقا دلالة التلمذة، لكنه يحتفظ أيضًا بصورة الاتباع الحرفي في الطريق؛ لذا تحافظ «أتبعك» على المستويين من غير إضافة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بتراكيب مألوفة للقارئ العام. وُضعت علامة الحاشية بعد الاقتباس لأنها تتعلق بعبارته الختامية.
