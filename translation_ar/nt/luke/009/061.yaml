base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: ar
  text: 'وقال آخر أيضًا: «سأتبعك يا رب، لكن اسمح لي[a] أولًا أن أودّع[b] مَن في بيتي[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ائذن لي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أستأذن من» أو «أقول وداعًا لـ».'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «الذين إلى بيتي»، والمقصود مَن هم في بيته أو ينتمون إليه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: آخر
  rationale: تدل الكلمة على شخص إضافي متميز عن المتكلمين السابقين، و«آخر» هي الصياغة العربية الموجزة والطبيعية.
- source_word: Ἀκολουθήσω
  choice: سأتبعك
  rationale: صيغة المستقبل تعبّر عن نية المتكلم المعلنة، وتحافظ «سأتبعك» على هذه القوة الإرادية بوضوح.
- source_word: κύριε
  choice: يا رب
  rationale: تحافظ «يا رب» على الاحترام وعلى ما قد يحمله اللقب من دلالة لاهوتية، من غير قصره على معنى «يا سيدي» فحسب.
- source_word: πρῶτον
  choice: أولًا
  rationale: تفيد ترتيب الأولوية، و«أولًا» واضحة وطبيعية في السياق.
- source_word: ἐπίτρεψόν μοι
  choice: اسمح لي
  rationale: الأمر هنا طلب للإذن، و«اسمح لي» أفصح وأشيع في العربية المعاصرة من البدائل الأشد رسمية.
- source_word: ἀποτάξασθαι
  choice: أن أودّع
  rationale: يفيد الفعل المتوسط هنا توديع أشخاص أو أخذ الإذن منهم عند الانصراف، و«أن أودّع» موجزة ودقيقة.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: مَن في بيتي
  rationale: تنقل العبارة الإشارة إلى الأشخاص الموجودين في بيت المتكلم أو المنتمين إليه، من غير حصرهم صراحة في الأسرة وحدها.
- source_word: δὲ καὶ
  choice: وقال آخر أيضًا
  rationale: تحفظ «الواو» صلة القول بما قبله، وتنقل «أيضًا» القوة الإضافية للجسيم καί بصياغة عربية سليمة.
theological_decisions:
- issue: ترجمة κύριε في خطاب موجّه إلى يسوع
  choice: يا رب
  alternative: يا سيدي / يا معلّم
  rationale: قد يتراوح النداء في لوقا بين خطاب الاحترام والإقرار الأعمق بهوية يسوع؛ لذلك تحافظ «يا رب» على هذا التوتر الدلالي ولا تختزله في مجرد لقب اجتماعي أو وظيفي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «مَن في بيتي» بدل «أهل بيتي» لتجنب التحديد الزائد للعلاقة، مع شرح التركيب اليوناني غير المألوف في الحاشية.
