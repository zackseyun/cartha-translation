  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: ar
  text: 'فقال له يسوع: «للثعالب أوكار، ولطيور السماء أعشاش، أما ابن الإنسان[a] فليس له أين يضع رأسه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «ابن الإنسان» لقب يستعمله يسوع عن نفسه، وقد يلمّح إلى دانيال 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: الثعالب
  rationale: اسم الحيوان المباشر في اليونانية، ولا يقتضي السياق تعميمه أو تأويله.
- source_word: φωλεοὺς
  choice: أوكار
  rationale: لفظ عربي طبيعي لمآوي الثعالب، ويحفظ معنى الجحور أو المخابئ الحيوانية.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: طيور السماء
  rationale: ترجمة واضحة وقريبة من التركيب اليوناني الحرفي، وهي أفصح هنا من «طيور الهواء».
- source_word: κατασκηνώσεις
  choice: أعشاش
  rationale: يدل اللفظ على أماكن الحلول أو المبيت، و«أعشاش» هو المقابل الطبيعي في سياق الطيور.
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب المعروف الذي يستعمله يسوع عن نفسه، مع إبقاء صداه المحتمل لدانيال 7 دون تفسيره داخل المتن.
- source_word: οὐκ ἔχει ποῦ
  choice: ليس له موضع
  rationale: ينقل اصطلاح النفي اليوناني بمعنى عدم وجود مكان، بصياغة عربية طبيعية.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: يسند إليه رأسه
  rationale: يحفظ الصورة الملموسة للفعل اليوناني الدال على إمالة الرأس أو إراحته، مع تعبير عربي مفهوم.
- source_word: δὲ
  choice: أما ... فـ
  rationale: يبين المقابلة بين امتلاك الحيوانات مأوى وعدم امتلاك ابن الإنسان موضعًا يستريح فيه.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: فقال له يسوع
  rationale: صياغة سردية عربية مباشرة تنقل ترتيب الحدث والقول بوضوح.
theological_decisions:
- issue: ترجمة لقب يسوع υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: «ابن الإنسان» هو المقابل العربي الراسخ والأقرب إلى البنية الأصلية، ويحفظ إمكان الدلالة المسيانية والرؤيوية وصدى دانيال 7:13–14 دون حسمها في المتن.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «أوكار» و«أعشاش» لطبيعتهما في سياق الحيوان والطير، وحُفظ لقب «ابن الإنسان» بصيغته العربية المألوفة. وُضع مؤشر الحاشية بعد اللقب الذي تشرحه.
