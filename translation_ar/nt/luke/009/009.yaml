  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: ar
  text: 'لكن هيرودس قال: «أمّا يوحنا، فأنا قطعتُ رأسه؛ فمن يكون هذا الذي أسمع عنه مثل هذه الأمور؟» وظلّ يسعى إلى رؤيته.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكان يسعى إلى رؤيته». قد تدل صيغة الماضي الناقص في اليونانية على فعل مستمر أو متكرر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: لكن
  rationale: أداة ربط تحمل هنا مسحةً من المقابلة مع ما سبق، و«لكن» تؤدي هذا التحول في الحديث بصورة طبيعية.
- source_word: Ἡρῴδης
  choice: هيرودس
  rationale: نقل الاسم وفق الصيغة العربية الشائعة في الكتاب المقدس.
- source_word: Ἰωάννην ἐγὼ ἀπεκεφάλισα
  choice: أمّا يوحنا، فأنا قطعتُ رأسه
  rationale: يحافظ هذا التركيب على تقديم «يوحنا» وعلى ضمير المتكلم الصريح المؤكد ἐγώ، وينقل المعنى المحدد للفعل، وهو قطع الرأس، من غير إضافة معنى الإعدام العام أو صيغة الماضي الأسبق.
- source_word: τίς δέ ἐστιν οὗτος
  choice: فمن يكون هذا
  rationale: ينقل السؤال المباشر ونبرة الاستغراب مع إبقاء اسم الإشارة، من غير إضافة كلمة «الرجل» غير الموجودة صراحةً.
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: الذي أسمع عنه مثل هذه الأمور
  rationale: صياغة عربية واضحة تحافظ على عموم τοιαῦτα، فلا تحصرها في «أخبار» أو تقارير محددة.
- source_word: ἐζήτει
  choice: ظلّ يسعى
  rationale: ينقل دلالة الماضي الناقص على فعل مستمر أو متكرر، مع إبقاء معنى الطلب والسعي.
- source_word: ἰδεῖν αὐτόν
  choice: إلى رؤيته
  rationale: ترجمة مباشرة لمعنى الرؤية، من غير توسيعه تفسيرياً إلى «لقائه».
theological_decisions:
- issue: قول هيرودس عن يوحنا وتساؤله عن هوية يسوع
  choice: صياغة القول والسؤال كما وردا، من غير التصريح بأن هيرودس خاف أن يكون يوحنا قد قام.
  alternative: إضافة تفسير يفيد أن هيرودس ظن أن يوحنا قام من الموت أو خشي ذلك.
  rationale: السياق السابق يذكر حيرة هيرودس، لكن هذه الآية نفسها لا تتجاوز إقراره بقطع رأس يوحنا وسؤاله عمّن يسمع عنه هذه الأمور؛ لذلك تُحفظ محدودية النص وتوتره السردي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم تركيب «أمّا يوحنا، فأنا...» لإبراز الضمير الصريح والمحافظة على تقديم اسم يوحنا، ووُضع الفاصل المنقوط بين التصريح والسؤال لبيان الانتقال المنطقي.
