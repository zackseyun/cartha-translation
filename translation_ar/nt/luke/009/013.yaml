  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: ar
  text: 'فقال لهم: «أنتم أعطوهم شيئًا يأكلونه»[a]. فقالوا: «ليس عندنا أكثر من خمسة أرغفة وسمكتين، إلا إذا ذهبنا نحن واشترينا طعامًا لهذا الشعب كله[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أنتم أنفسكم أعطوهم شيئًا يأكلونه»، لإبراز توكيد الضمير في الأصل.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «هذا الشعب كله» بـ«هذه الجموع كلها». وقد تحمل عبارة «إلا إذا» هنا نبرة احتمال أو اعتراض عملي.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δότε ... φαγεῖν
  choice: أعطوهم ... ما يأكلون
  rationale: ينقل تركيب العطاء مع مصدر الأكل بعبارة عربية طبيعية وواضحة، من غير تحويله إلى معنى أبعد مثل «وفّروا لهم الطعام».
- source_word: ὑμεῖς
  choice: أنتم
  rationale: ذِكر ضمير المخاطبين صراحةً في اليونانية يفيد التوكيد، ووضع «أنتم» بعد الفعل يحفظ هذا التوكيد بأسلوب عربي طبيعي.
- source_word: πλεῖον ἢ
  choice: أكثر من
  rationale: مع النفي في «ليس عندنا» تفيد العبارة حصر ما لديهم في خمسة أرغفة وسمكتين.
- source_word: ἄρτοι πέντε
  choice: خمسة أرغفة
  rationale: المقصود وحدات معدودة من الخبز، ولذلك «أرغفة» أدق من «خبز» بوصفه اسم جنس.
- source_word: ἰχθύες δύο
  choice: سمكتين
  rationale: مقابل عربي مباشر وطبيعي للمثنى في السياق.
- source_word: εἰ μήτι
  choice: إلا إذا
  rationale: يحفظ معنى الاستثناء المشوب باحتمال أو اعتراض عملي، من غير زيادة نبرة تهكم أو استنكار غير مصرّح بها.
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: ذهبنا نحن واشترينا
  rationale: يُفكّ التركيب بالمشاركة إلى فعلين منسقين طبيعيين في العربية، مع إبراز الضمير ἡμεῖς.
- source_word: λαὸν
  choice: الشعب
  rationale: هو المقابل المباشر لـλαός ويحفظ دلالته الجمعية؛ وتُذكر «الجموع» في الحاشية بوصفها بديلًا سياقيًا ممكنًا.
- source_word: βρώματα
  choice: طعامًا
  rationale: اسم الجنس المفرد في العربية هو التعبير الطبيعي عن مواد الطعام في هذا السياق.
theological_decisions:
- issue: نبرة أمر يسوع وجواب التلاميذ
  choice: صياغة مباشرة تحفظ توكيد الضمير من غير إضافة توبيخ أو سخرية
  alternative: «أنتم أنفسكم أعطوهم ما يأكلون» أو جواب بصيغة أشد استنكارًا
  rationale: النص يثبت أمرًا مباشرًا واعتراضًا عمليًا، لكنه لا يصرّح بنبرة انفعالية أقوى؛ لذا تُحفظ قوة ὑμεῖς من غير تفسير زائد.
- issue: دلالة εἰ μήτι في جواب التلاميذ
  choice: «إلا إذا» في المتن مع بيان النبرة الاحتمالية في الحاشية
  alternative: «إلا لعلنا نذهب...» أو «إلا إن ذهبنا...»
  rationale: «إلا إذا» تنقل بنية الاستثناء بوضوح، بينما تحافظ الحاشية على احتمال وجود نبرة تردّد أو اعتراض من غير إثقال المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «أعطوهم أنتم» لإظهار التوكيد من غير تكلف، و«الشعب» حفظًا للمقابل المعجمي المباشر مع إتاحة البديل السياقي في الحاشية.
