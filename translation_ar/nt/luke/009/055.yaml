  text: But he turned and rebuked them[a].
translation:
  language: ar
  text: لكنه التفت وانتهرهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تضيف بعض المخطوطات المتأخرة: «وقال: إنكما لا تعلمان من أي روح أنتما؛ لأن ابن الإنسان لم يأت ليهلك نفوس الناس، بل ليخلّصها.»'
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: التفت
  rationale: اسم فعل ماضٍ من στρέφω يصف توجّه يسوع بجسده نحو التلاميذ قبل مخاطبتهم؛ و«التفت» تعبير عربي طبيعي يحفظ هذا المعنى.
- source_word: δὲ
  choice: لكن
  rationale: تفيد δέ هنا انتقالًا سرديًّا مع مقابلة لطيفة بين طلب التلميذين وردّ يسوع، ولذلك تلائمها «لكن».
- source_word: ἐπετίμησεν
  choice: انتهرهم
  rationale: الفعل ἐπιτιμάω يدل في هذا السياق على توبيخ حازم، و«انتهر» ينقل قوة التصحيح اللفظي بإيجاز ووضوح.
- source_word: αὐτοῖς
  choice: هم (في «انتهرهم»)
  rationale: الضمير في صيغة الجمع ويعود في السياق إلى يعقوب ويوحنا، أو إلى التلاميذ المخاطَبين؛ وتعدية «انتهر» مباشرةً بالضمير طبيعية في العربية.
theological_decisions:
- issue: الزيادة النصية المطوّلة الموجودة في بعض المخطوطات المتأخرة
  choice: 'إثبات نص SBLGNT الأقصر وحده في المتن: «لكنه التفت وانتهرهم.»'
  alternative: '«لكنه التفت وانتهرهم وقال: إنكما لا تعلمان من أي روح أنتما؛ لأن ابن الإنسان لم يأت ليهلك نفوس الناس، بل ليخلّصها.»'
  rationale: النص اليوناني المعطى يشتمل على القراءة الأقصر فقط. ولأن الزيادة معروفة ومؤثرة في تاريخ نقل النص، تُذكر في الحاشية ولا تُدرج في المتن.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة ووقورة. اختير «التفت» للسرد الطبيعي و«انتهرهم» لنقل حزم الفعل اليوناني، مع إبقاء القراءة المطوّلة في الحاشية بوصفها اختلافًا نصيًّا.
