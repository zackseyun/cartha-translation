  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: ar
  text: ثم نشأ بينهم جدال حول مَن منهم قد يكون الأعظم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نشأ فيهم تفكير في مَن منهم قد يكون الأعظم»؛ أو: «نشأ بينهم نقاش».'
    reason: بدائل معجمية تحفظ احتمال أن يكون الأمر تفكيرًا داخليًا أو نقاشًا متبادلًا، إلى جانب معنى الجدال.
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: نشأ
  rationale: الفعل يعني حرفيًا «دخل»، لكن اقترانه بـ«جدال/تفكير» يُعبَّر عنه طبيعيًا في العربية بـ«نشأ»، مع الحفاظ على معنى ابتداء الأمر بينهم.
- source_word: δὲ
  choice: ثم
  rationale: أداة ربط خفيفة تتابع السرد، و«ثم» تلائم الانتقال في السياق من غير إثقال.
- source_word: διαλογισμὸς
  choice: جدال
  rationale: يمكن أن يدل اللفظ على تفكير أو مداولة أو نقاش. والسؤال التنافسي عن الأعظم يرجّح هنا معنى الجدال، مع إثبات البدائل الممكنة في الحاشية.
- source_word: ἐν αὐτοῖς
  choice: بينهم
  rationale: معناها الحرفي «فيهم»، لكن «بينهم» هي الصياغة العربية الطبيعية لما يجري داخل جماعة، من غير حسم ما إذا كان تفكيرًا داخليًا أو نقاشًا متبادلًا؛ ولذلك توضّح الحاشية الاحتمال.
- source_word: τὸ τίς ἂν εἴη
  choice: حول مَن منهم قد يكون
  rationale: تُدخل العبارة مضمون الجدال في صورة سؤال غير مباشر، وتحفظ «قد يكون» دلالة الاحتمال في ἄν مع صيغة التمني/الاحتمال.
- source_word: μείζων
  choice: الأعظم
  rationale: اللفظ صيغة مقارنة حرفيًا «أكبر/أعظم»، لكن المقارنة داخل الجماعة تفيد في العربية السؤال عن صاحب المرتبة العليا، فتأتي «الأعظم» طبيعية ودقيقة.
- source_word: αὐτῶν
  choice: منهم
  rationale: تحدد الجماعة التي تجري المقارنة داخلها، و«منهم» تؤدي هذا المعنى مباشرة.
theological_decisions:
- issue: طبيعة ما جرى بين التلاميذ
  choice: جدال
  alternative: تفكير أو نقاش
  rationale: السياق التنافسي للسؤال عن الأعظم يرجّح وجود جدال، لكن اليونانية تحتمل أيضًا التفكير أو المداولة؛ لذا لم يُحجب هذا الغموض، بل ذُكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «نشأ بينهم جدال» بدل النقل الحرفي غير الطبيعي «دخل فيهم جدال»، مع حاشية تحفظ الصورة الحرفية والغموض الدلالي في النص اليوناني.
