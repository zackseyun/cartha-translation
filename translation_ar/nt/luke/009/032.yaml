source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: ar
  text: وكان بطرس والذين معه قد أثقلهم النوم، لكنهم لما أفاقوا تمامًا[a] رأوا مجده والرجلين الواقفين معه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بعدما استيقظوا»، أو: «حين صاروا يقظين تمامًا». الفعل اليوناني نادر، وقد يشدد على بلوغهم اليقظة التامة، لا على أنهم ظلوا مستيقظين طوال الوقت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: قد أثقلهم النوم
  rationale: يحفظ صورة النوم بوصفه ثقلًا غالبًا عليهم، وهو أقوى من مجرد القول إنهم كانوا ناعسين، كما يلائم حالة اسم المفعول التام في اليونانية.
- source_word: διαγρηγορήσαντες
  choice: لما أفاقوا تمامًا
  rationale: الفعل نادر، ويرجح في السياق الانتقال إلى اليقظة التامة بعد أن أثقلهم النوم، مع إبقاء احتمال دلالته موضحًا في الحاشية.
- source_word: δόξαν αὐτοῦ
  choice: مجده
  rationale: «المجد» هو المقابل الكتابي الطبيعي الذي يحفظ البعد المرئي واللاهوتي للمشهد من غير شرح زائد.
- source_word: τοὺς δύο ἄνδρας
  choice: الرجلين
  rationale: ترجمة مباشرة وطبيعية للمثنى، والمقصود بحسب السياق موسى وإيليا.
- source_word: τοὺς συνεστῶτας αὐτῷ
  choice: الواقفين معه
  rationale: يحفظ الهيئة المشهدية لاسم الفاعل ويدل على وجود الرجلين واقفين إلى جانبه.
- source_word: δὲ ... δὲ
  choice: وكان ... لكنهم
  rationale: نُقل الأول بربط سردي عربي طبيعي، ونُقل الثاني بأداة استدراك تُظهر المقابلة بين ثقل النوم ورؤية المشهد بعد الإفاقة.
theological_decisions:
- issue: دلالة δόξα في سياق التجلي
  choice: مجده
  alternative: بهاؤه / جلاله
  rationale: «مجده» يحفظ الصلة بالمصطلح الكتابي الواسع من غير أن يحصر المقصود في اللمعان المرئي وحده أو يضيف تفسيرًا عقائديًا إلى النص.
- issue: تفسير διαγρηγορήσαντες
  choice: لما أفاقوا تمامًا
  alternative: إذ ظلوا مستيقظين / بعدما استيقظوا
  rationale: الاختيار ينسجم مع كون النوم قد أثقلهم، لكنه لا يخفي ندرة الفعل أو الاحتمال الآخر، ولذلك تُذكر البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «قد أثقلهم النوم» للحفاظ على الاستعارة اليونانية بصياغة عربية طبيعية، و«لما أفاقوا تمامًا» لإبراز الانتقال إلى اليقظة مع توثيق الغموض المعجمي في الحاشية.
