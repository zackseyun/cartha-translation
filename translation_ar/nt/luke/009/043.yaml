  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: ar
  text: 'وكان الجميع يندهشون من جلال الله[a]. وبينما كان الجميع يتعجبون من كل ما كان يفعله، قال لتلاميذه:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عظمة الله». تدل الكلمة اليونانية μεγαλειότης على العظمة أو الجلال أو الفخامة.'
    reason: بديل معجمي يبيّن مدى دلالة اللفظة اليونانية.
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: كانوا يندهشون
  rationale: ينقل الفعل الناقص حالة الدهشة الشديدة المستمرة، مع صياغة عربية طبيعية.
- source_word: πάντες
  choice: الجميع
  rationale: يحافظ على شمول رد الفعل من غير إثقال العبارة.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: من جلال الله
  rationale: تفيد ἐπί مع المجرور هنا سبب الدهشة أو موضوعها، و«جلال» تعبير عربي فصيح وطبيعي عن μεγαλειότης في وصف الله.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: وبينما كان الجميع يتعجبون
  rationale: صيغ التركيب المطلق في اليونانية جملةً زمنية ظرفية، مع تمييز «يتعجبون» عن الفعل الأقوى «يندهشون» في الجملة السابقة.
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: من كل ما كان يفعله
  rationale: تحفظ العبارة شمول الأعمال، وينقل «كان يفعله» دلالة الماضي المستمر في ἐποίει.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: قال لتلاميذه
  rationale: صياغة عربية مباشرة وطبيعية لفعل القول ومتعلقه، مع حفظ ضمير الملكية.
theological_decisions:
- issue: مرجع الفاعل المستتر في οἷς ἐποίει وεἶπεν
  choice: يُفهم من السياق أنه يسوع من غير إضافة اسمه إلى النص
  alternative: إظهار الاسم بقول «قال يسوع لتلاميذه»
  rationale: السياق يجعل يسوع الفاعل المباشر للأعمال والقول، في حين ينسب النص الجلال إلى الله. إبقاء الفاعل مستترًا يحفظ صياغة الأصل والتوتر اللاهوتي فيها من غير طمس التمييز أو إضافة تفسير صريح.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «جلال الله» لسلامته وطبيعته في السياق، وحُفظ التدرج بين الدهشة الشديدة والتعجب، كما حُفظت دلالة الاستمرار في الفعلين الناقصين.
