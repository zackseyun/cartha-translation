  source_fidelity: 'النص العربي ينقل بدقة البنية والمعنى: «كانوا يندهشون» يحفظ دلالة الماضي الناقص للدهشة الشديدة، و«الجميع» ينقل πάντες. و«من جلال الله» تعبير سليم لعلة/موضوع الدهشة في ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. كما أن «وبينما كان الجميع يتعجبون» يعكس التركيب المطلق الزمني Πάντων δὲ θαυμαζόντων، و«كل ما كان يفعله» يحفظ شمول πᾶσιν ودلالة الاستمرار في ἐποίει. الفاعل المستتر في «يفعله» و«قال» يحافظ على إحالة الأصل السياقية إلى يسوع دون إضافة تفسيرية.'
