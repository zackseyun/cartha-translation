base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: ar
  text: 'فلما رأى التلميذان يعقوب ويوحنا ذلك، قالا: «يا رب، أتريد أن نأمر نارًا أن تنزل من السماء وتلتهمهم؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن نستدعي نارًا من السماء فتهلكهم». واليونانية حرفيًا: «أن نقول لنارٍ أن تنزل من السماء وتلتهمهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: فلما رأى ... ذلك
  rationale: صيغ اسم الفاعل الأوريستي بوصفه جملة زمنية طبيعية في العربية، وأضيف «ذلك» إحالةً إلى رفض السامريين في الآية السابقة، من غير إضافة مضمون جديد.
- source_word: δὲ
  choice: فـ
  rationale: أُديت أداة الانتقال والربط ضمن «فلما» بما يلائم تسلسل السرد العربي.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: التلميذان يعقوب ويوحنا
  rationale: المثنى يعبّر بوضوح وطبيعية عن كون يعقوب ويوحنا هما التلميذين المقصودين.
- source_word: Κύριε
  choice: يا رب
  rationale: ترجمة مباشرة للنداء κύριε، وهي الصيغة العربية المعيارية الملائمة في خطاب يسوع.
- source_word: θέλεις
  choice: أتريد
  rationale: تؤدي معنى الإرادة أو الرغبة بصياغة عربية واضحة وموجزة.
- source_word: εἴπωμεν
  choice: أن نأمر
  rationale: الفعل في الأصل هو «نقول»، لكن تركيبه مع أن تنزل النار يحمل هنا قوة توجيه القول إليها؛ و«نأمر» ينقل المقصود بصورة عربية طبيعية، مع توثيق الحرفية في الحاشية.
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: نارًا بأن تنزل من السماء
  rationale: يحفظ صورة النار النازلة من السماء وترتيب عناصرها الأساسي.
- source_word: ἀναλῶσαι
  choice: تلتهمهم
  rationale: ينقل معنى الاستهلاك أو الإهلاك مع إبقاء صورة النار حاضرة، بخلاف «تهلكهم» الأعم.
- source_word: αὐτούς
  choice: هم
  rationale: ضمير جمع يعود إلى أهل القرية السامرية في السياق السابق.
theological_decisions:
- issue: المفعول المفهوم مع «رأى»
  choice: إضافة «ذلك» إحالةً إلى الرفض المذكور في الآية السابقة
  alternative: فلما رأى التلميذان يعقوب ويوحنا
  rationale: الأصل لا يصرّح بالمفعول، لكن «ذلك» توضح الصلة السياقية في العربية من غير حسم مسألة لاهوتية أو إضافة حدث.
- issue: قوة اقتراح التلميذين
  choice: «أن نأمر نارًا» في المتن
  alternative: «أن نقول لنار أن تنزل» أو «أن نستدعي نارًا»
  rationale: مع أن εἴπωμεν يعني حرفيًا «نقول»، فإن القول المتبوع بمضمون نزول النار يفيد الأمر في السياق. اختير التعبير الطبيعي في المتن، وحُفظت الصياغة الحرفية والبدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم المثنى «التلميذان/قالا» لطبيعية الأسلوب، و«تلتهمهم» للمحافظة على صورة النار. وُضعت علامة الحاشية بعد الاقتباس لأنها تتناول صياغة الطلب كله.
