base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: ar
  text: 'فأجاب يوحنا: «يا سيّد، رأينا شخصًا يُخرج شياطين باسمك، وحاولنا أن نمنعه، لأنه لا يتبعك معنا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنه لا يتبعنا». واليونانية حرفيًا أقرب إلى «لا يتبع معَنا»، وقد تشدّد على أنه لم يكن من جماعة التلاميذ.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ Ἰωάννης εἶπεν
  choice: فقال يوحنا
  rationale: هذه صيغة انتقال سردية شائعة، ولا يلزم أن تدل «أجاب» هنا على جواب مباشر عن سؤال. «فقال» عربية طبيعية تحفظ صلة الكلام بما قبله.
- source_word: Ἐπιστάτα
  choice: يا سيّد
  rationale: لقب لوقاوي يخاطب به التلاميذ يسوع اعترافًا بسلطانه وقيادته؛ و«يا سيّد» واضحة وكريمة من غير حصر المعنى في التعليم.
- source_word: εἴδομέν τινα
  choice: رأينا شخصًا
  rationale: تنقل التنكير في τινα بعبارة عربية طبيعية من غير إضافة تحديد غير موجود في المصدر.
- source_word: ἐν τῷ ὀνόματί σου
  choice: باسمك
  rationale: تعبير عربي مألوف يحفظ معنى العمل استنادًا إلى اسم يسوع وسلطانه.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: يُخرج شياطين
  rationale: صياغة مباشرة وطبيعية للمشهد، وتحفظ دلالة طرد الشياطين.
- source_word: ἐκωλύομεν αὐτόν
  choice: حاولنا أن نمنعه
  rationale: ينقل الماضي الناقص اليوناني بوصفه فعلًا جاريًا أو محاولة، من غير الجزم بأنهم نجحوا في منعه.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: لأنه لا يتبع معَنا
  rationale: يحفظ حرفيًا نسبيًا وجود μετά «مع»، فيبقى الاعتراض متعلقًا بعدم انضمامه إلى جماعة التلاميذ، ولا يتحول إلى تصريح بأنه لا يتبع يسوع.
theological_decisions:
- issue: احتمال التباس جهة الاتباع والانتماء إلى جماعة التلاميذ
  choice: لأنه لا يتبع معَنا
  alternative: لأنه لا يتبعنا
  rationale: النص اليوناني يقول صراحة «معنا». إبقاء هذا العنصر يمنع الإيحاء بأن الرجل كان رافضًا ليسوع نفسه، ويحفظ التوتر السردي بشأن عدم انضمامه إلى جماعة التلاميذ.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. اختيرت «يا سيّد» لسلطة الخطاب، و«حاولنا أن نمنعه» لإظهار دلالة الماضي الناقص، وأُبقي تركيب «يتبع معنا» رغم شيء من غرابته المقصودة لصيانة الغموض اللاهوتي في الأصل.
