id: LUK.9.11
reference: Luke 9:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: ar
  text: أَمَّا الجموع، فلمّا علمت بذلك تبعته. فرحّب بهم، وكان يكلّمهم عن ملكوت الله، ويشفي من كانوا بحاجة إلى علاج[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى شفاء». فاللفظة اليونانية θεραπεία يمكن أن تعني «الشفاء» أو «العلاج والرعاية».'
    reason: بديل معجمي يحفظ سعة دلالة اللفظة اليونانية.
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: أَمَّا الجموع
  rationale: تنقل δέ بوصفها أداة انتقال ومقابلة خفيفة في السياق، وتحافظ «الجموع» على صيغة الجمع في اليونانية.
- source_word: γνόντες
  choice: فلمّا علمت بذلك
  rationale: تؤدي اسم الفاعل الأوريستي بوصفه ظرفًا زمنيًا، بصياغة عربية طبيعية، وتشير «بذلك» إلى خبر موضع يسوع أو تحرّكه المفهوم من السياق.
- source_word: ἠκολούθησαν αὐτῷ
  choice: تبعته
  rationale: ترجمة مباشرة وطبيعية تحتفظ بالمعنى الحركي، من غير أن تفرض هنا معنى اصطلاحيًا خاصًا بالتلمذة.
- source_word: ἀποδεξάμενος αὐτούς
  choice: فرحّب بهم
  rationale: تعكس معنى الاستقبال الحسن الذي يحمله الفعل، لا مجرد السماح لهم بالحضور.
- source_word: ἐλάλει αὐτοῖς
  choice: وكان يكلّمهم
  rationale: تحافظ صيغة «كان» مع المضارع على دلالة الاستمرار في زمن الماضي التي يفيدها الفعل الناقص اليوناني.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: عن ملكوت الله
  rationale: صياغة عربية كتابية راسخة وواضحة للمصطلح المحوري، وتحفظ اتساقه في الأناجيل.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: من كانوا بحاجة إلى علاج
  rationale: تحافظ على التركيب الاسمي وعلى إمكان دلالة θεραπεία على العلاج أو الرعاية، كما تتجنب تكرار «الشفاء» مباشرة مع الفعل التالي.
- source_word: ἰᾶτο
  choice: ويشفي
  rationale: المضارع بعد «كان يكلّمهم» يصوّر نشاط الشفاء المستمر الذي تدل عليه صيغة الماضي الناقص اليونانية.
theological_decisions:
- issue: ترجمة βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  alternative: مُلك الله / سيادة الله
  rationale: «ملكوت الله» تعبير عربي كتابي معروف ودقيق بما يكفي، ويحفظ الصلة الاصطلاحية باستعمال الأناجيل من غير حصر المعنى في مكان جغرافي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أَمَّا» للانتقال الخفيف، وصيغ الاستمرار للماضي الناقص، ووُضعت علامة الحاشية عند العبارة التي تتعلق بها دلالة θεραπεία.
