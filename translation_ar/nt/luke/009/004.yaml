- source_word: ἐκεῖθεν ἐξέρχεσθε
  choice: ومنه اخرجوا
  rationale: يحافظ على دلالة الانطلاق من ذلك البيت نفسه، مع إبقاء صيغة الأمر كما يقتضي السياق.
