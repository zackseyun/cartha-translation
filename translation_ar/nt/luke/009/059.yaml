  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: ar
  text: 'وقال لآخر: «اتبعني». فقال: «يا رب، اسمح لي أن أذهب أولًا وأدفن أبي».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: لآخر
  rationale: تنقل معنى «شخص آخر» بإيجاز وطبيعية، من غير تحديد زائد لهويته.
- source_word: Ἀκολούθει μοι
  choice: اتبعني
  rationale: صيغة الأمر العربية المباشرة هي المقابل الطبيعي للعبارة اليونانية، ولا يلزم إظهار الاستمرارية المحتملة في زمن المضارع بصياغة تفسيرية.
- source_word: Κύριε
  choice: يا رب
  rationale: تحافظ على كون اللفظ نداء احترام ولقبًا قد يحمل دلالة لاهوتية، من غير اختزاله إلى مجرد «يا سيدي».
- source_word: ἐπίτρεψόν μοι
  choice: اسمح لي
  rationale: تؤدي طلب الإذن بلغة عربية واضحة ومحترمة، من غير التكلف الذي قد توحي به «ائذن لي» في الاستعمال الحديث.
- source_word: ἀπελθόντι πρῶτον
  choice: أن أذهب أولًا
  rationale: 'تحافظ على ترتيب الفعل المطلوب: الذهاب أولًا تمهيدًا للدفن، مع صياغة عربية طبيعية.'
- source_word: θάψαι τὸν πατέρα μου
  choice: وأدفن أبي
  rationale: ترجمة مباشرة وواضحة للفعل ومفعوله، ولا تضيف افتراضًا بشأن ما إذا كان الأب قد مات لتوّه أو أن الكلام يشير إلى التزام عائلي أوسع.
theological_decisions:
- issue: دلالة κύριος في خطاب يسوع
  choice: يا رب
  alternative: يا سيدي
  rationale: «يا رب» تبقي التوتر المقصود بين نداء الاحترام واللقب ذي الرنين المسيحاني، بينما قد تحصر «يا سيدي» المعنى في المجاملة الاجتماعية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعمل «لآخر» للإيجاز السردي، و«اسمح لي» لطلب الإذن الطبيعي، مع إبقاء «يا رب» بما يحمله من احترام ورنين لاهوتي.
