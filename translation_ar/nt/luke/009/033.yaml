source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: ar
  text: 'وفيما كانا يفارقان يسوع، قال له بطرس: «يا معلّم، حسنٌ أن نكون هنا. فلنصنع ثلاث مظالّ[a]: واحدة لك، وواحدة لموسى، وواحدة لإيليا». ولم يكن يدري ما يقول.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «خيام» أو «أكواخ». تشير الكلمة اليونانية إلى مساكن مؤقتة، وقد تستحضر صور عيد المظال في الكتاب المقدس.'
    reason: بديل معجمي مع احتمال صدى كتابي
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: وفيما كانا يفارقان يسوع
  rationale: صيغت العبارة الزمنية اليونانية بأسلوب عربي طبيعي، وعاد ضمير التثنية على موسى وإيليا اللذين كانا يفارقان يسوع. وذُكر اسم يسوع بدل الضمير دفعًا للالتباس في العربية.
- source_word: Ἐπιστάτα
  choice: يا معلّم
  rationale: لفظ احترام يخاطَب به صاحب السلطة والمعرفة. «يا معلّم» واضح وفصيح، مع أنه لا يطابق تمامًا διδάσκαλε، ويحفظ مقام المخاطَب دون استعمال لفظ عربي قد يوحي بالملكية.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: حسنٌ أن نكون هنا
  rationale: يحفظ التقييم المباشر في καλόν وبنية المصدر بصورة عربية موجزة وطبيعية.
- source_word: ποιήσωμεν
  choice: فلنصنع
  rationale: ينقل صيغة الحث في فعل المتكلم الجمع من غير إضافة معنى البناء غير الصريح في ποιέω.
- source_word: σκηνὰς
  choice: مظالّ
  rationale: يدل اللفظ على مساكن أو أغطية مؤقتة. «مظالّ» عربية مفهومة وتحفظ احتمال الصدى الكتابي المرتبط بعيد المظال دون أن تفرضه.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: ولم يكن يدري ما يقول
  rationale: يحفظ معنى عدم علم بطرس أو إدراكه لما كان يقوله، ويعبّر بالمضارع العربي عن الكلام الجاري آنذاك.
theological_decisions:
- issue: دلالة σκηνάς في سياق التجلي واحتمال الإشارة إلى عيد المظال أو خيمة الاجتماع
  choice: مظالّ
  alternative: خيام؛ أكواخ؛ مساكن مؤقتة
  rationale: لا يصرّح النص بأن اقتراح بطرس إحالة إلى عيد المظال أو خيمة الاجتماع. لذلك اختير لفظ يحفظ طبيعة المنشآت المؤقتة وإمكان الصدى الكتابي من غير حسم دلالة لاهوتية غير مصرّح بها.
- issue: هوية فاعل διαχωρίζεσθαι في صيغة الجمع
  choice: صيغة التثنية «كانا» لموسى وإيليا
  alternative: صيغة الجمع الحرفية «كانوا»
  rationale: السياق السابق يحدد موسى وإيليا بوصفهما اللذين كانا يفارقان يسوع. العربية تقتضي التثنية هنا، بخلاف اليونانية التي تستعمل صيغة الجمع لاثنين.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت التثنية الطبيعية في العربية، ووُضع اسم يسوع موضع الضمير لتجنب غموض مرجعه. حافظت الصياغة على اندفاع اقتراح بطرس وعلى تعليق الراوي الذي يكشف عدم إدراكه.
