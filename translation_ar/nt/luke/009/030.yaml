  text: وإذا رجلان يتحدّثان معه، وهما موسى وإيليا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا بـ
  rationale: تنقل أداة لفت الانتباه والمفاجأة السردية بصياغة عربية فصيحة طبيعية، من غير حذف قوتها الخطابية.
- source_word: ἄνδρες δύο
  choice: رجلين
  rationale: يحيل اللفظ إلى شخصين ذكرين محددين، موسى وإيليا؛ و«رجلين» هي المقابلة العربية الطبيعية الدقيقة، وجاءت مجرورة لفظًا بعد الباء الزائدة في تركيب «إذا بـ».
- source_word: συνελάλουν
  choice: يتحدّثان
  rationale: صيغة الماضي الناقص اليونانية تصوّر حديثًا مستمرًا؛ والمضارع العربي بعد «إذا» يستحضر المشهد ويحافظ على استمرارية الفعل.
- source_word: αὐτῷ
  choice: معه
  rationale: الفعل اليوناني يدل هنا على حديث متبادل، ولذلك تعبّر «معه» عن المشاركة في الحوار أدق من «إليه».
- source_word: οἵτινες ἦσαν
  choice: وهما
  rationale: يعرّف التركيب الرجلين مباشرة بأنهما موسى وإيليا؛ و«وهما» صياغة عربية موجزة وطبيعية تحفظ هذا التعريف دون زيادة تفسيرية.
- source_word: Μωϋσῆς
  choice: موسى
  rationale: الصيغة العربية المألوفة للاسم الكتابي.
- source_word: Ἠλίας
  choice: إيليا
  rationale: الصيغة العربية الكتابية المألوفة لاسم النبي، وهي أقرب إلى صورة الاسم في النص اليوناني من غير إخلال بالتعرّف عليه.
theological_decisions:
- issue: هوية الرجلين في مشهد التجلّي
  choice: يحدّد النص الرجلين مباشرة بأنهما موسى وإيليا.
  alternative: إضافة تفسير لرمزيتهما أو لطبيعة ظهورهما.
  rationale: لا يشرح العدد دلالة الشخصيتين ولا طبيعة ظهورهما، لذا تُحفظ هوية الرجلين الصريحة من غير إدخال تفسير لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «وإذا بـ» لاستحضار المفاجأة السردية بصورة طبيعية، و«يتحدّثان معه» لإبراز استمرار الحديث وتبادله.
