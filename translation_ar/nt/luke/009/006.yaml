  terminology: «يبشّرون» تعبير فصيح واضح لإعلان الخبر السار في هذا السياق، ولا يفرض المصطلح الكنسي «الإنجيل». و«يشفون» ينقل θεραπεύοντες مباشرة، من دون تضييق غير لازم أو تحويله إلى تركيب اسمي.
