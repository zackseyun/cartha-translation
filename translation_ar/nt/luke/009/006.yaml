base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: ar
  text: فخرجوا، وكانوا ينتقلون من قرية إلى قرية، يبشّرون ويشفون في كل مكان.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: فخرجوا
  rationale: اسم الفاعل الأوريستي يمهّد للفعل التالي ويدل على انطلاقهم بعد الإرسالية؛ وصيغة الفعل العربية طبيعية وتحفظ تتابع الأحداث.
- source_word: δὲ
  choice: الفاء في «فخرجوا»
  rationale: تفيد δέ هنا استمرار السرد مع تقدّم خفيف، والفاء تصل الخروج طبيعيًا بما سبق من تكليف.
- source_word: διήρχοντο
  choice: أخذوا يجتازون
  rationale: الماضي الناقص يدل على حركة مستمرة ومتكررة بين مواضع متعددة؛ والتركيب يحفظ هذا الجانب الاستمراري.
- source_word: κατὰ τὰς κώμας
  choice: من قرية إلى قرية
  rationale: κατά مع النصب ذات دلالة توزيعية هنا، فتشير إلى التنقل بين القرى واحدة بعد أخرى.
- source_word: εὐαγγελιζόμενοι
  choice: مبشِّرين بالبشارة
  rationale: ينقل فعل إعلان الخبر السار بعبارة عربية واضحة، مع الحفاظ على الصلة اللفظية بمفهوم البشارة دون تحميله صياغة عقائدية لاحقة.
- source_word: θεραπεύοντες
  choice: شفاء المرضى
  rationale: السياق يدل على الشفاء الجسدي المصاحب للإرسالية؛ وإضافة «المرضى» تجعل المفعول المفهوم واضحًا بالعربية دون تغيير المعنى.
- source_word: πανταχοῦ
  choice: في كل مكان
  rationale: تعبير عربي مباشر ينقل شمول نطاق نشاطهم.
theological_decisions:
- issue: دلالة εὐαγγελιζόμενοι في إرسالية التلاميذ
  choice: مبشِّرين بالبشارة
  alternative: كارزين بالإنجيل
  rationale: الاختيار يحفظ معنى إعلان الخبر السار ويظل مفهومًا للقارئ المعاصر، من غير افتراض معنى اصطلاحي متأخر أكثر تحديدًا مما يصرّح به السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أخذوا يجتازون» لإظهار استمرار الفعل، و«من قرية إلى قرية» لإبراز الدلالة التوزيعية. لا توجد حواشٍ لأن البدائل لا تمثل غموضًا جوهريًا يستلزم إثقال نص هذه الآية.
