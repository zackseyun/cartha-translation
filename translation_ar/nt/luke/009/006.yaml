  verdict: revise
  source_fidelity: 'المعنى العام محفوظ: خرج التلاميذ وتنقّلوا بين القرى وأعلنوا الخبر السار وشفوا. لكن «أخذوا يجتازون» يضيف دلالة البدء («شرعوا») لا يقتضيها الفعل اليوناني الناقص، و«شفاء المرضى» يحوّل الفعل المشارك θεραπεύοντες إلى مصدر ويضع مفعولًا به صريحًا حيث يتركه الأصل غير مذكور.'
