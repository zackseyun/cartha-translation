id: LUK.9.23
reference: Luke 9:23
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: ar
  text: 'وكان يقول للجميع: «إن أراد أحد[أ] أن يأتي ورائي، فلينكر نفسه، وليحمل صليبه كل يوم، وليتبعني».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'يستعمل الأصل مفردًا عامًا: «إن أراد أحد... فلينكر نفسه وليحمل صليبه...». والمقصود أي شخص، لا الرجال وحدهم.'
    reason: توضيح دلالة المفرد المذكر العامة في الأصل وفي العربية.
lexical_decisions:
- source_word: Ἔλεγεν
  choice: وكان يقول
  rationale: ينقل صيغة الماضي الناقص اليونانية بما يفيد الاستمرار في القول أو تكراره، مع سلامة الأسلوب العربي.
- source_word: πρὸς πάντας
  choice: للجميع
  rationale: ينقل شمول المخاطَبين بعبارة عربية موجزة وطبيعية.
- source_word: Εἴ τις θέλει
  choice: إن أراد أحد
  rationale: «أحد» تؤدي معنى اسم النكرة العام، و«أراد» تنقل معنى المشيئة أو الرغبة من غير مبالغة.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: أن يأتي ورائي
  rationale: يحفظ صورة المجيء وراء يسوع ولا يدمجها مسبقًا في فعل الاتباع الوارد في ختام الآية.
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: فلينكر نفسه
  rationale: صيغة الأمر بلام الأمر تنقل الأمر للغائب، و«ينكر نفسه» تحافظ على العبارة المباشرة من غير تفسيرها بالتخلي أو الزهد.
- source_word: ἀράτω
  choice: وليحمل
  rationale: «يحمل» هي العبارة العربية الطبيعية لأخذ الصليب وحمله، وتحفظ الصورة العملية المرتبطة بالصليب.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: صليبه
  rationale: ينقل الاسم المحسوس والضمير الملكي مباشرة، من غير استبداله بتفسير مثل العبء أو المعاناة.
- source_word: καθ’ ἡμέραν
  choice: كل يوم
  rationale: عبارة واضحة وطبيعية تنقل معنى المواظبة اليومية الذي يختص به نص لوقا هنا.
- source_word: ἀκολουθείτω μοι
  choice: وليتبعني
  rationale: يحافظ على الأمر الثالث المستقل وعلى التوازي بين الأفعال المأمور بها.
theological_decisions:
- issue: دلالة الصليب في التلمذة
  choice: الإبقاء على اللفظ الحرفي «صليبه»
  alternative: عبئه أو معاناته أو تضحيته
  rationale: النص يستعمل اسمًا محسوسًا هو «الصليب»، وتبقى أبعاده المجازية واللاهوتية مفتوحة بدل اختزالها في تفسير واحد.
- issue: المفرد المذكر العام في سلسلة الأوامر
  choice: «أحد ... نفسه ... صليبه» بصيغة المفرد المذكر العامة
  alternative: صياغة جمع شاملة مثل «من أرادوا... فلينكروا أنفسهم»
  rationale: اليونانية تستعمل مفردًا نكرة ذا دلالة عامة ثم تواصل بالأمر والضمير في المفرد المذكر؛ والعربية تستطيع تمثيل هذه البنية طبيعيًا من غير قصر المعنى على الرجال.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حُفظ تتابع الأوامر وإيقاعها، كما حُفظ الفرق بين «أن يأتي ورائي» و«ليتبعني»، وتُركت صورة الصليب من غير تفكيك تفسيري.
