base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: ar
  text: 'وبدأ النهار يميل إلى الغروب، فتقدّم الاثنا عشر وقالوا له: «اصرف الجمع، ليذهبوا إلى القرى والنواحي الريفية المحيطة، فيجدوا مبيتًا ومؤنًا[b]، لأننا هنا في مكان مقفر[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مكان خالٍ». يمكن للكلمة اليونانية ἔρημος أن تدل على موضع غير مأهول أو قليل السكان.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «طعامًا». تشير الكلمة اليونانية ἐπισιτισμός إلى مؤن أو زاد غذائي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: وبدأ النهار يميل إلى الغروب
  rationale: يحفظ صورة ميل النهار في κλίνειν، ويبيّن معناها الزمني الطبيعي في العربية من غير اختزالها إلى مجرد حلول المساء. ونُقلت δέ بواو استئنافية خفيفة.
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: فتقدّم الاثنا عشر
  rationale: «تقدّم» يؤدي معنى الاقتراب في προσέρχομαι، و«الاثنا عشر» يحفظ اللقب الجمعي الوارد في النص.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: اصرف الجمع
  rationale: «اصرف» تعبير عربي طبيعي ودقيق لمعنى الإرسال أو الإذن بالانصراف في هذا السياق، و«الجمع» يقابل ὄχλος.
- source_word: ἵνα πορευθέντες
  choice: ليذهبوا
  rationale: تنقل لام التعليل غرض الطلب، ويُستوعب معنى اسم الفاعل اليوناني في الفعل العربي من غير تركيب متكلّف.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: إلى القرى والريف المحيط
  rationale: «القرى» تقابل κώμας، و«الريف» ينقل هنا المعنى الواسع لـἀγρούς بوصفه النواحي الريفية لا الحقول وحدها، أما «المحيط» فيؤدي κύκλῳ.
- source_word: καταλύσωσιν
  choice: فيجدوا مبيتًا
  rationale: يفيد καταλύω هنا النزول والمبيت؛ وإظهار المفعول في العربية يوضح المقصود الطبيعي من السياق.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: وطعامًا
  rationale: ἐπισιτισμός يعني الزاد أو المؤونة الغذائية. «طعامًا» واضح للقارئ ويصون المعنى المباشر، مع تجنب لفظ «مؤن» الذي قد يوحي بإمدادات أوسع من المقصود.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: لأننا هنا في مكان مقفر
  rationale: يحفظ «هنا» دلالة ὧδε، و«مكان مقفر» يؤدي معنى الموضع الخالي أو القليل العمران في ἔρημος دون إقحام إيحاء لاهوتي خاص بالبرية.
