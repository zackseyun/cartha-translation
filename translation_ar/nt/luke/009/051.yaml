  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: ar
  text: وحدث أنه، حين كانت أيام رفعه تكتمل[a]، فهو نفسه ثبّت وجهه[b] ليذهب إلى أورشليم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صعوده». واليونانية تقول حرفيًا: «رفعه» أو «أن يُرفَع».'
    reason: alternative_reading
  - marker: b
    text: «ثبّت وجهه» تعبير مجازي يدل على العزم الراسخ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وحدث أنه
  rationale: صيغة انتقال سردي تُنقل بعبارة عربية معاصرة من غير إدخال ظرف زمني غير موجود صراحة في الأصل.
- source_word: ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας
  choice: حين كانت الأيام ... تبلغ تمامها
  rationale: يحفظ التركيب الزمني ودلالة بلوغ مدة محددة اكتمالها، مع مراعاة الجانب الاستمراري في صيغة المصدر الحاضر.
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: أيام رفعه
  rationale: «الرفع» قريب من المعنى المباشر للاسم اليوناني، وأوسع من حصره في «الصعود» وحده؛ لذا يحفظ احتمال أن تشمل العبارة الحركة القصصية نحو الموت والقيامة والتمجيد.
- source_word: καὶ αὐτὸς
  choice: هو نفسه
  rationale: يُظهر توكيد الضمير في اليونانية بعبارة عربية طبيعية نسبيًا.
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: ثبّت ... وجهه
  rationale: يحفظ الصورة المجازية ذات النبرة النبوية، وهي تدل في السياق على العزم الراسخ.
- source_word: τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: لينطلق إلى أورشليم
  rationale: اللام تنقل دلالة الغاية في المصدر، و«ينطلق» تعبير طبيعي عن الشروع المقصود في الرحلة إلى المدينة.
theological_decisions:
- issue: مدى دلالة ἀνάλημψις
  choice: رفعه
  alternative: صعوده؛ رحيله
  rationale: الاسم اليوناني يدل حرفيًا على الأخذ إلى فوق أو الرفع، وقد يُفهم في سياق لوقا على الصعود خصوصًا أو على المسار الأوسع نحو الموت والقيامة والتمجيد. أبقت الصياغة هذا الاتساع، مع ذكر «صعوده» في الحاشية.
- issue: القوة المجازية لعبارة «ثبّت وجهه»
  choice: الإبقاء على الصورة في المتن
  alternative: عزم عزمًا راسخًا؛ صمّم بحزم
  rationale: الإبقاء على المجاز يصون النسيج الأدبي والإيحاء النبوي، بينما توضح الحاشية معناه من غير تسطيحه في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت صورة «ثبّت وجهه» لقيمتها الأدبية، ووُضّحت في حاشية، كما حُفظ اتساع دلالة «رفعه» من غير حصرها عقائديًا في حدث واحد.
