lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: ودعا ... إلى الاجتماع
  rationale: ينقل معنى الاستدعاء للاجتماع الذي تدل عليه السابقة συν-، مع صياغة عربية طبيعية تربط الفعل التمهيدي بالفعل الرئيس.
- source_word: δὲ
  choice: وَ
  rationale: أداة ربط سردية خفيفة هنا، فلا يلزم منها تضاد قوي.
- source_word: τοὺς δώδεκα
  choice: الاثني عشر
  rationale: يحافظ على عبارة اليونانية بلا إضافة «تلاميذ» أو «رسل».
- source_word: δύναμιν καὶ ἐξουσίαν
  choice: قوةً وسلطانًا
  rationale: يحفظ التمييز بين القدرة على الفعل والسلطان المخوَّل لممارسته.
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: على جميع الشياطين
  rationale: تفيد ἐπί هنا التسلط على، و«جميع الشياطين» تقابل صيغة الجمع مع πάντα.
- source_word: νόσους θεραπεύειν
  choice: أن يشفوا الأمراض
  rationale: ينقل المصدر اليوناني الدال على ما مُنحوا القدرة والسلطان لفعله، مع استعمال عربي واضح ومباشر.
theological_decisions:
- issue: التمييز بين δύναμις وἐξουσία
  choice: قوةً وسلطانًا
  alternative: قدرةً وحقًّا
  rationale: إبقاء اللفظين منفصلين يصون الجمع في النص بين القدرة الفعلية والتفويض السلطاني.
- issue: هوية «الاثني عشر»
  choice: الاثني عشر
  alternative: التلاميذ الاثنا عشر / الرسل الاثنا عشر
  rationale: النص اليوناني لا يضيف «التلاميذ» أو «الرسل»، لذلك تُترك العبارة بلا توسعة تفسيرية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُعمل «سلطان» إلى جانب «قوة» للحفاظ على التمييز الدلالي، وتُركت «الاثني عشر» بلا إضافة تفسيرية.
