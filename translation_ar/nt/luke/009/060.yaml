  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: ar
  text: 'فقال له[a]: «دَعِ الموتى يدفنون موتاهم، وأما أنت فاذهب وأعلن ملكوت الله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يُرجَّح أن «الموتى» في المرة الأولى وصفٌ مجازي لغير المستجيبين روحيًا، أما في المرة الثانية فالمقصود موتى جسديًا. ويستعمل النص اليوناني الكلمة نفسها في الموضعين، لذلك تحافظ الترجمة على هذا الأثر.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: دَعِ
  rationale: فعل أمر حازم وموجز يفيد ترك هذا الواجب للآخرين والانصراف عنه، ويحافظ على قوة التعبير اليوناني.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: الموتى ... موتاهم
  rationale: يُبقي تكرار اللفظ نفسه في الموضعين، محافظًا على المفارقة المقصودة من غير أن يحسم في المتن كون الأول مجازيًا والثاني حرفيًا. وتؤدي «موتاهم» معنى ضمير الانعكاس ἑαυτῶν بصورة عربية طبيعية.
- source_word: θάψαι
  choice: يدفنون
  rationale: ينقل فعل الدفن بوصفه العمل الذي يُتركون ليفعلوه، وتلائم صيغة المضارع العربية التركيب بعد فعل الأمر «دَعِ».
- source_word: ἀπελθὼν
  choice: فاذهب
  rationale: اسم فعل ماضٍ يوناني سابق للأمر الرئيس؛ وصيغة «اذهب» هي التعبير العربي الطبيعي عن الحركة السابقة للمناداة، من غير تركيب حرفي ثقيل.
- source_word: διάγγελλε
  choice: نادِ
  rationale: أمر مضارع يدل على إعلان علني ممتد أو واسع؛ و«نادِ» موجزة وطبيعية في سياق إعلان ملكوت الله.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي راسخ يشير إلى سلطان الله وحكمه، ويحافظ على الصياغة الاسمية في الأصل.
theological_decisions:
- issue: دلالة «الموتى» في الموضعين
  choice: الإبقاء على لفظ «الموتى» من غير تفسير داخل المتن
  alternative: دَعِ الموتى روحيًا يدفنون موتاهم
  rationale: يستعمل اليوناني اللفظ نفسه في الموضعين، فتظل العبارة حادة ومفارِقة. يُرجَّح أن الأول مجازي والثاني حرفي، لكن التصريح بذلك في المتن يحسم ما تركه النص ضمنيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «وأما أنت» لإبراز المقابلة التي تفيدها الضمائر والتركيب اليوناني، وحُفظت المفارقة اللفظية في «الموتى ... موتاهم».
