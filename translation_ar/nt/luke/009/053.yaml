base_translation:
  language: en
  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: ar
  text: فَلَمْ يَقْبَلُوهُ[a]، لِأَنَّ وَجْهَهُ كَانَ مُتَّجِهًا إِلَى أُورُشَلِيمَ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلم يرحّبوا به» أو «فلم يستقبلوه». وقد يشير السياق إلى رفض ضيافته.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «لأن وجهه كان سائرًا إلى أورشليم». وهي عبارة تصوّر ثبات اتجاهه نحو أورشليم، وقد تفيد أيضًا عزمه على الذهاب إليها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: يَقْبَلُوهُ
  rationale: الفعل δέχομαι يدل على القبول أو الاستقبال والترحيب. و«يقبلوه» يحفظ المعنى المعجمي الواسع، بينما يوضح السياق أن المقصود غالبًا الامتناع عن استضافته أو الترحيب به.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: وَجْهَهُ
  rationale: ترجمة مباشرة لـ πρόσωπον، وتحفظ الصورة السامية الواردة في العبارة بدل اختزالها إلى ضمير.
- source_word: ἦν πορευόμενον
  choice: كَانَ مُتَّجِهًا
  rationale: تعكس الصيغة المحيطية الدالة على السير والتوجّه، وتنتظم طبيعيًا مع «وجهه» في العربية من غير إضافة معنى العزم صراحةً إلى النص.
- source_word: εἰς Ἰερουσαλήμ
  choice: إِلَى أُورُشَلِيمَ
  rationale: «إلى» تؤدي قوة الاتجاه والغاية في εἰς بوضوح في هذا التركيب.
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تبيّن بوضوح أن ما يلي هو سبب عدم قبولهم له.
theological_decisions:
- issue: الدلالة الاصطلاحية لعبارة «وجهه كان متجهًا إلى أورشليم»
  choice: الإبقاء على صورة «الوجه» مع صياغة عربية مفهومة تدل على الاتجاه إلى أورشليم.
  alternative: «لأنه كان عازمًا على الذهاب إلى أورشليم» أو «لأنه كان ذاهبًا إلى أورشليم».
  rationale: الاختيار يحفظ صورة النص ووقعها السردي، مع عدم الجزم بأن العبارة تصرّح بالعزم الداخلي؛ فذلك معنى محتمل في السياق لكنه ليس التعبير الحرفي للعبارة اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حُفظت صورة «الوجه» الواردة في الأصل، وأُسند إليها «متجهًا» لصياغة طبيعية نسبيًا دون تسطيح التعبير أو تحميله تفسيرًا زائدًا.
