lexical_decisions:
- source_word: καὶ
  choice: فـ
  rationale: تفيد الربط السردي البسيط مع تعاقب الحدث في السياق، من غير إضافة معنى غير موجود في اليونانية.
- source_word: ἐμνήσθησαν
  choice: تذكَّرنَ
  rationale: فعل ماضٍ بصيغة جمع المؤنث، لأن الفاعل في السياق هو النساء؛ وينقل المعنى الفعلي المباشر للفعل اليوناني.
- source_word: τῶν ῥημάτων
  choice: كلام
  rationale: ينقل معنى الأقوال أو ما قيل بعبارة عربية طبيعية، ويحافظ على كون المرجع كلامًا منطوقًا.
- source_word: αὐτοῦ
  choice: ـه
  rationale: ضمير الغائب المضاف إلى «كلام»، محافظًا على صيغة النص اليوناني من غير استبداله بالاسم الصريح «يسوع».
