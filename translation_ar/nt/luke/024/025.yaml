base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: ar
  text: 'فقال لهما: «يا عديمي الفهم[a] وبطيئي القلوب[b] في الإيمان بكل ما تكلَّم به الأنبياء!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا قليلي الإدراك»، أو «يا من لا تفهمون».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «بطيئي القلوب»؛ والقلب هنا يشير إلى باطن الإنسان، أي إنهما كانا متثاقلين في تصديق ما قاله الله وقبوله.'
    reason: cultural_note
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: فقال لهما
  rationale: تؤدي العبارة وظيفة الانتقال السردي طبيعيًا في العربية، والمثنى «لهما» يوافق المخاطبَين في السياق.
- source_word: Ὦ
  choice: يا
  rationale: أداة النداء العربية تنقل قوة الخطاب المباشر والتوبيخ الوقور من غير تكلف.
- source_word: ἀνόητοι
  choice: عديمي الفهم
  rationale: ينقل نقص الإدراك الذي تدل عليه اللفظة، ولا يحصر التوبيخ في فساد أخلاقي محض.
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: بطيئي القلب
  rationale: يحفظ صورة «القلب» بوصفه باطن الإنسان، بدل اختزال المعنى في بطء الفهم العقلي وحده.
- source_word: τοῦ πιστεύειν
  choice: عن الإيمان
  rationale: يربط بطء القلب بالإيمان ربطًا عربيًا واضحًا مع إبقاء الإيمان فعل ثقة وقبول.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: بكل ما
  rationale: صياغة عربية طبيعية تحفظ شمول الكلام النبوي كله.
- source_word: ἐλάλησαν
  choice: تكلَّم به
  rationale: يحافظ على معنى النطق والإعلان النبوي، مع صياغة عربية مألوفة.
- source_word: οἱ προφῆται
  choice: الأنبياء
  rationale: المقابل العربي القياسي والدقيق للشهود النبويين.
theological_decisions:
- issue: طبيعة توبيخ يسوع
  choice: التوبيخ يتناول قصور الفهم وبطء الثقة بكلام الأنبياء معًا.
  alternative: أن يكون إدانة أخلاقية محضة، أو وصفًا لسوء فهم عقلي محض.
  rationale: الجمع بين «عديمي الفهم» و«بطيئي القلب عن الإيمان» يشمل الإدراك والثقة، وحفظ لفظ «القلب» يمنع اختزال المعنى في العقل وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت استعارة «بطيئي القلب» لما لها من دلالة كتابية، وأُرفقت بحاشية تفسيرية. استُعمل المثنى بحسب سياق لوقا 24.
