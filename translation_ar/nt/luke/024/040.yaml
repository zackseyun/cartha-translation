  text: ⸂[καὶ τοῦτο εἰπὼν ⸀ἔδειξεν αὐτοῖς τὰς χεῖρας καὶ τοὺς πόδας.]⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/040.yaml
  text: And after saying this[a], he showed them his hands and his feet.
translation:
  language: ar
  text: وبعدما قال هذا[a]، أراهم يديه ورجليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لا ترد هذه الجملة في بعض المخطوطات.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يحفظ تتابع السرد من غير إضافة دلالة زمنية ليست صريحة في اللفظ اليوناني.
- source_word: τοῦτο εἰπὼν
  choice: بعدما قال هذا
  rationale: ينقل اسم الفاعل الأوريستي بوصفه فعلًا سابقًا للفعل الرئيس، بصياغة عربية واضحة وطبيعية.
- source_word: ἔδειξεν
  choice: أراهم
  rationale: يؤدي معنى الإظهار المرئي في السياق، ويجمع الفعل مع المفعول غير المباشر بصياغة عربية موجزة وطبيعية.
- source_word: αὐτοῖς
  choice: هم في «أراهم»
  rationale: أُدمج الضمير في الفعل وفق الأسلوب العربي الطبيعي، مع الحفاظ على كونه مفعولًا غير مباشر.
- source_word: τὰς χεῖρας
  choice: يديه
  rationale: المثنى هو المقابل العربي الطبيعي، والضمير المضاف إليه مفهوم من السياق مع أن اليونانية تستعمل أداة التعريف.
- source_word: τοὺς πόδας
  choice: رجليه
  rationale: اختير «الرجلين» للدلالة الطبيعية على طرفي الجسد في العربية، بصيغة المثنى ومع ضمير الملكية الذي يقتضيه السياق.
theological_decisions:
- issue: الوضع النقدي للنص الكامل للآية
  choice: إثبات الجملة في المتن مع حاشية تبين الاختلاف النصي
  alternative: حذف الجملة لأن بعض المخطوطات لا تتضمنها
  rationale: تورد SBLGNT الآية كلها بين معقوفين، بما يدل على شك نصي مهم. ولأن نص المصدر المقدم يثبتها، تُترجم في المتن مع توثيق احتمال الحذف في الحاشية، من غير حسم ما يظل موضع خلاف نصي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «بعدما» لتتابع الحدث، و«أراهم يديه ورجليه» لصياغة طبيعية مباشرة، مع إبقاء علامة الحاشية في موضعها بعد العبارة التي تشير إليها.
