- source_word: ἐφάνησαν
  choice: بدت
  rationale: يفيد الفعل هنا حكمهم على الأقوال، لا مجرد ظهور بصري؛ لذا تعبّر «بدت» طبيعيًا عن معنى «ظهر لهم/بدا لهم».
- source_word: ἐνώπιον αὐτῶν
  choice: لهم
  rationale: المعنى الحرفي «أمامهم»، لكنه في سياق التقييم يدل طبيعيًا على منظورهم وحكمهم.
- source_word: ὡσεὶ λῆρος
  choice: كأنها هذيان
  rationale: تحفظ «كأنها» أداة التشبيه، وتعبّر «هذيان» عن كلام يُعَدّ بلا معنى أو سخيفًا، من غير أن تجعل الراوي نفسه يقرّ بهذا التقييم.
- source_word: τὰ ῥήματα ταῦτα
  choice: هذه الأقوال
  rationale: ترجمة مباشرة وطبيعية للعبارة اليونانية، وتحافظ على صيغة الجمع والإشارة.
- source_word: ἠπίστουν
  choice: لم يصدِّقوا
  rationale: ينقل عدم التصديق في الماضي دون إضافة معنى العناد أو الرفض المتعمد.
- source_word: αὐταῖς
  choice: هنَّ
  rationale: يحافظ ضمير جمع المؤنث على صيغة الأصل وإحالته السياقية إلى النساء، دون استبداله باسم صريح.
