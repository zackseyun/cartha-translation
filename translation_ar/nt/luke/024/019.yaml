lexical_decisions:
- source_word: Ποῖα
  choice: ما هي؟
  rationale: يحفظ صيغة الجمع المحايد بالإحالة إلى «الأمور» المفهومة من السياق، وهو عربي طبيعي في الحوار.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: الأمور المتعلقة بيسوع
  rationale: يعكس تركيب اليونانية «الأمور التي بشأن يسوع» من غير إضافة معنى وقوع أحداث غير مصرح به.
- source_word: Ναζαρηνοῦ
  choice: الناصري
  rationale: ينقل النعت اليوناني بوصفه لقبًا أو نسبة، مع بيان البديل الجغرافي في الحاشية.
- source_word: ἐγένετο
  choice: صار
  rationale: يحفظ القوة الفعلية لـγίνομαι بدل تسويتها إلى «كان»، مع إبقاء البديل الاصطلاحي في الحاشية.
- source_word: ἀνὴρ προφήτης
  choice: رجلًا نبيًّا
  rationale: يحفظ الاسمين الواردين في اليونانية ويصوغهما بالعربية على أن «نبيًّا» وصف أو بدل من «رجلًا»، من غير حذف ἀνήρ.
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: مقتدرًا في العمل والقول
  rationale: «مقتدر» ينقل معنى القوة والفاعلية، و«العمل والقول» يحفظ المقابلة المفردة في الأصل بأسلوب عربي واضح.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: أمام الله والشعب كله
  rationale: ينقل معنى الحضور والمشهد العلني أمام الله وجميع الشعب بإيجاز طبيعي.
theological_decisions:
- issue: إثبات لفظ ἀνήρ في وصف يسوع
  choice: الذي صار رجلًا نبيًّا
  alternative: الذي كان نبيًّا
  rationale: النص اليوناني يذكر ἀνήρ صراحة، فحُفظ اللفظ مع التوتر الذي قد ينشأ من «صار»، بدل حذفه أو تسوية العبارة لاهوتيًا. وتوضح الحاشية إمكان الاستعمال الاصطلاحي «كان رجلًا نبيًّا».
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ تركيب «العمل والقول» ولفظ «الشعب» للمحافظة على توازي الأصل، ووُضعت علامتا الحاشية في موضعيهما داخل المتن.
