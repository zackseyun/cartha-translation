  yaml_path: translation/nt/luke/024/053.yaml
  text: And they were continually in the temple[a], blessing God.
translation:
  language: ar
  text: وكانوا دائمًا في الهيكل يباركون[a] الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يسبّحون». والفعل اليوناني هو حرفيًا «يباركون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: أداة ربط بسيطة تصل خاتمة الرواية بما قبلها من غير إضافة دلالة تفسيرية.
- source_word: ἦσαν διὰ παντός
  choice: كانوا دائمًا
  rationale: ينقل هذا التعبير الاستمرار والتكرار المنتظم، ويؤدي الفعل الناقص مع الظرف معنى الحالة المستمرة في الماضي بصياغة عربية طبيعية.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: تشير ἱερόν إلى مجمّع الهيكل لا إلى قدس المبنى الداخلي وحده، ولفظ «الهيكل» هو المقابل العربي الموجز المألوف.
- source_word: εὐλογοῦντες
  choice: يباركون
  rationale: يحافظ على الدلالة المباشرة للفعل اليوناني، أي المباركة أو القول الحسن، مع إثبات البديل السياقي «يسبّحون» في الحاشية.
- source_word: τὸν θεόν
  choice: الله
  rationale: مفعول به مباشر للفعل «يباركون»، وترجمته المباشرة هي «الله».
theological_decisions:
- issue: صياغة لغة العبادة الموجّهة إلى الله في εὐλογοῦντες τὸν θεόν
  choice: يباركون الله
  alternative: يسبّحون الله
  rationale: الفعل في النص هو εὐλογέω، لا αἰνέω؛ لذلك تحفظ «يباركون» الصورة اللفظية الأصلية ولا تختزلها في لفظ عبادي أعم، بينما «يسبّحون» تفسير سياقي صحيح ومفيد للقارئ.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات نبرة كتابية مهيبة من غير تكلّف. وُضعت علامة الحاشية بعد «يباركون» لأنها تتعلق بهذا الفعل، لا بلفظ «الهيكل».
