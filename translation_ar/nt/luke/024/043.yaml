    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: فـ
  rationale: فاء السرد تصل الفعل بما سبقه اتصالًا طبيعيًا في العربية، من غير إضافة دلالة زمنية تفصيلية ليست صريحة في اليونانية.
- source_word: λαβὼν
  choice: أخذه
  rationale: اسم فعل ماضٍ من λαμβάνω يدل على فعل الأخذ السابق للأكل. أُثبت ضمير المفعول العائد إلى قطعة السمك المذكورة في الآية السابقة لأن العربية الطبيعية تقتضيه هنا.
- source_word: ἐνώπιον αὐτῶν
  choice: أمامهم
  rationale: تعبير عربي واضح يفيد أن الفعل وقع بحضورهم وعلى مرأى منهم، ويحفظ القوة المشهدية والبرهانية للعبارة.
- source_word: ἔφαγεν
  choice: أكله
  rationale: فعل ماضٍ يسرد فعل الأكل المكتمل، مع إظهار المفعول المفهوم من السياق بضمير يعود إلى الطعام المذكور سابقًا.
theological_decisions:
- issue: إظهار المفعول المحذوف في اليونانية
  choice: إثبات ضمير المفعول في «أخذه» و«أكله»
  alternative: فأخذ وأكل أمامهم
  rationale: المفعول مفهوم من الآية السابقة، وهي قطعة السمك. إظهار الضمير يحقق عربية طبيعية ويوضح تسلسل الحدث من غير إضافة مضمون جديد أو تفسير لاهوتي زائد، مع إبقاء التركيز على وقوع الأكل أمام التلاميذ.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة وسردية. استُخدمت «أمامهم» بوصفها واضحة لعامة القراء وتحفظ معنى وقوع الفعل في حضورهم.
