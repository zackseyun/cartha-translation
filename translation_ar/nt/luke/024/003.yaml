  text: But when they entered[a], they did not find the body.
translation:
  language: ar
  text: لكنهن حين دخلن، لم يجدن الجسد.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «جسد الرب يسوع».'
