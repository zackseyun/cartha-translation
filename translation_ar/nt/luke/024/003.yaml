lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: حين دخلن
  rationale: اسم فاعل ماضٍ مؤنث جمع يعود إلى النساء، وصيغته الزمنية «حين دخلن» طبيعية في العربية وتحفظ تعاقب الحدثين.
- source_word: δὲ
  choice: لكن
  rationale: تفيد الأداة انتقالًا سرديًا مع مقابلة خفيفة بين دخول النساء والنتيجة غير المتوقعة.
- source_word: οὐχ εὗρον
  choice: لم يجدن
  rationale: ينقل النفي مع الفعل الماضي نقلًا عربيًا مباشرًا، مع إبقاء مرجع الفاعل المؤنث الجمع واضحًا.
- source_word: τὸ σῶμα
  choice: الجسد
  rationale: المعنى المباشر هو «الجسد»، وهو أدق وأقل إيحاءً تفسيريًا من «الجثة» في سياق القيامة.
theological_decisions:
- issue: هل يُصرَّح بهوية صاحب الجسد؟
  choice: الجسد
  alternative: جسد الرب يسوع
  rationale: النص اليوناني المعتمد يقرأ الصيغة الأقصر «الجسد» فقط؛ لذلك لا تُدرج الزيادة الواردة في بعض المخطوطات في المتن، بل تُذكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة؛ استُعمل ضمير جمع المؤنث لأن الفاعل هو النساء المذكورات في السياق السابق.
