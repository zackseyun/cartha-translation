lexical_decisions:
- source_word: τότε
  choice: حينئذٍ
  rationale: ظرف زمان يبيّن تتابع أحداث الرواية، و«حينئذٍ» تعبير عربي موجز وطبيعي.
- source_word: διήνοιξεν
  choice: فتح
  rationale: يحافظ على الصورة المجازية المباشرة في اليونانية، من غير تحويلها تفسيريًا إلى «مكّن» أو «شرح».
- source_word: αὐτῶν τὸν νοῦν
  choice: أذهانهم
  rationale: اللفظ νοῦς يدل على ملكة الإدراك والفهم؛ وصيغة الجمع العربية تلائم تعدد أصحاب الضمير وتحافظ على كون الذهن مفعولًا مباشرًا لفعل «فتح».
- source_word: τοῦ συνιέναι
  choice: ليفهموا
  rationale: ينقل المصدر المعرّف الذي يحتمل دلالة الغرض أو النتيجة بصياغة عربية طبيعية موجزة، مع إثبات البديل الأكثر تصريحًا بالغاية في الحاشية.
- source_word: τὰς γραφάς
  choice: الكتب المقدسة
  rationale: يشير التعبير في سياق لوقا إلى كتابات إسرائيل المعترف بها بوصفها نصوصًا مقدسة؛ و«الكتب المقدسة» هو المقابل العربي الواضح الجاري.
theological_decisions:
- issue: طبيعة فعل يسوع في فتح الفهم
  choice: الإبقاء على العبارة المباشرة «فتح أذهانهم» دون شرح عقائدي إضافي
  alternative: مكّنهم من فهم الكتب المقدسة؛ أو شرح لهم الكتب المقدسة
  rationale: النص اليوناني يجعل فتح الأذهان فعلًا مباشرًا ليسوع، لكنه لا يشرح آلية هذا الفعل؛ لذا تحافظ الصياغة على التقرير اللاهوتي وعلى توتره من غير اختزاله في مجرد الشرح أو ربطه بمذهب لاحق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «أذهانهم» بدل «فهمهم» للحفاظ على استعارة الفتح وعلى البنية المباشرة للنص، وجُمعت البدائل المتصلة بعبارة الغرض في حاشية واحدة تجنبًا لإثقال آية قصيرة.
