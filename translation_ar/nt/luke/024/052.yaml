  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: ar
  text: أَمَّا هُمْ، فَبَعْدَ أَنْ سَجَدُوا لَهُ[a][b]، رَجَعُوا إِلَى أُورُشَلِيمَ بِفَرَحٍ عَظِيمٍ،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لا ترد عبارة «بعد أن سجدوا له» في بعض المخطوطات.
    reason: textual_variant
  - marker: b
    text: 'يمكن أن تعني العبارة أيضًا: «بعد أن عبدوه» أو «بعد أن انحنوا له تعظيمًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: أَمَّا هُمْ
  rationale: ينقل الضمير الصريح ذي النبرة التأكيدية، ويربط الجملة بما قبلها ربطًا طبيعيًّا في العربية من غير إضافة دلالة زمنية غير موجودة في اليونانية.
- source_word: προσκυνήσαντες αὐτόν
  choice: بَعْدَ أَنْ سَجَدُوا لَهُ
  rationale: يعبّر عن سبق فعل اسم الفاعل الأوريستي للفعل الرئيس، ويحافظ «سجدوا له» على مجال الفعل اليوناني الذي قد يدل على العبادة أو الانحناء للتعظيم، مع ملاءمته لسياق يسوع القائم والممجَّد.
- source_word: ὑπέστρεψαν
  choice: رَجَعُوا
  rationale: ترجمة عربية واضحة ومباشرة لمعنى العودة، وملائمة للأسلوب القصصي.
- source_word: εἰς Ἰερουσαλήμ
  choice: إِلَى أُورُشَلِيمَ
  rationale: ينقل اتجاه الحركة إلى المدينة بصياغة عربية طبيعية، مع اعتماد الاسم الكتابي العربي الشائع.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: بِفَرَحٍ عَظِيمٍ
  rationale: يحفظ الاسم «الفرح» وصفته المكثفة «عظيم» في عبارة عربية فصيحة ومفهومة.
theological_decisions:
- issue: دلالة προσκυνέω الموجَّه إلى يسوع القائم
  choice: سجدوا له
  alternative: عبدوه / انحنوا له تعظيمًا
  rationale: «سجدوا له» ينسجم مع السياق الرفيع بعد القيامة، لكنه لا يحسم وحده كل المدى الدلالي للفعل اليوناني، الذي قد يشمل العبادة أو الانحناء وإبداء الإجلال. وهكذا تُصان الدلالة المسيحانية من غير فرض صياغة عقائدية أضيق من النص.
- issue: العبارة المختلف في ثبوتها προσκυνήσαντες αὐτόν
  choice: إثباتها في المتن مع حاشية نقدية
  alternative: حذفها وفق بعض الشواهد المخطوطية
  rationale: أُثبتت العبارة لأنها واردة في النص اليوناني المقدَّم، مع بيان عدم ثبوتها في بعض المخطوطات صونًا للشفافية النصية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «أمّا هم» لإظهار التأكيد في الضمير اليوناني من غير تثقيل، و«سجدوا له» لصون المدى الدلالي والسياق اللاهوتي معًا.
