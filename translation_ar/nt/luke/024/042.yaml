lexical_decisions:
- source_word: οἱ δὲ
  choice: فَـ...ـوا
  rationale: الضمير المستتر في الفعل يدل على الجماعة المذكورة في السياق، والفاء تؤدي وظيفة δέ بوصفها رابطًا خفيفًا يواصل السرد من غير إبراز مقابلة قوية.
- source_word: ἐπέδωκαν
  choice: أَعْطَوْهُ
  rationale: الفعل ἐπιδίδωμι هنا يعني الإعطاء أو المناولة، وصيغة «أعطوه» عربية طبيعية وتضمّن المفعول غير المباشر αὐτῷ.
- source_word: αὐτῷ
  choice: ـهُ في «أعطوه»
  rationale: ضمير الغائب في محل المفعول غير المباشر يؤدي معنى «له» بسلاسة في التركيب العربي.
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: قِطْعَةً مِنْ سَمَكٍ مَشْوِيٍّ
  rationale: μέρος هو الاسم الرئيس بمعنى «قطعة»، ويبيّن تركيب المضاف إليه أن القطعة من سمك أُعدّ بالشواء.
- source_word: ὀπτοῦ
  choice: مَشْوِيٍّ
  rationale: يدل ὀπτός على طعام أُعدّ بالشيّ أو التحميص؛ و«مشوي» هو المقابل العربي الواضح والطبيعي في هذا السياق.
theological_decisions:
- issue: الصيغة النصية للوقا 24:42
  choice: 'ترجمة نص SBLGNT وحده: «قطعة من سمك مشوي»'
  alternative: 'تضيف بعض المخطوطات المتأخرة: «وشيئًا من شهد عسل»'
  rationale: النص اليوناني المقدَّم ينتهي بكلمة μέρος ولا يتضمن العبارة الأطول؛ لذلك يتبع المتن القراءة النقدية، مع إثبات الزيادة المعروفة في حاشية صونًا للشفافية النصية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم الربط بالفاء لمواصلة الحدث بصورة طبيعية، مع تشكيل محدود يعين القراءة ولا يثقل النص.
