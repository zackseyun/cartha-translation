  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: ar
  text: فانفتحت أعينهما فعرفاه، وصار غير مرئيّ لهما.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اختفى عنهما»، أو: «غاب عن أنظارهما».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: انفتحت
  rationale: يحافظ المبني للمجهول على دلالة أن الإدراك أُتيح لهما، مع صياغة عربية طبيعية.
- source_word: οἱ ὀφθαλμοὶ
  choice: أعينهما
  rationale: الضمير في اليونانية للجمع، والسياق يحدد أنه يعود إلى التلميذين؛ والتثنية أفصح وأوضح في العربية.
- source_word: ἐπέγνωσαν
  choice: عرفاه
  rationale: يدل الفعل هنا على التعرف إلى شخص كان أمامهما ولم يكونا قد تبيناه.
- source_word: ἄφαντος
  choice: غير منظور
  rationale: ينقل معنى ما لا يُرى من غير تحديد آلية اختفائه.
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: صار غير منظور لهما
  rationale: صياغة قريبة من تركيب «صار» مع الصفة، وتحفظ كون عدم الرؤية متعلقًا بهما.
- source_word: δὲ
  choice: فـ
  rationale: الفاء تلائم تطور الحدث في السرد العربي من غير إثقال.
theological_decisions:
- issue: طبيعة غياب يسوع عن نظر التلميذين
  choice: صار غير منظور لهما
  alternative: اختفى عنهما / غاب عن أنظارهما
  rationale: يحافظ هذا التعبير على غموض النص بشأن كيفية الحدث، فلا يفترض آلية بعينها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت التثنية لأن السياق يتحدث عن تلميذي عمواس، وحُفظت الصياغة غير المحدِّدة لطبيعة الاختفاء.
