  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: ar
  text: وها أنا أرسل إليكم وعد أبي. أما أنتم فالزموا المدينة إلى أن تُلبَسوا قوةً من العلاء.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: وها
  rationale: أداة تنبيه عربية طبيعية تحفظ وظيفة اللفظ اليوناني في لفت الانتباه من غير ثقل «هوذا» على القارئ المعاصر.
- source_word: ἐξαποστέλλω
  choice: أرسل
  rationale: مضارع خبري مباشر يوافق الفعل اليوناني ويحفظ مبادرة المتكلم؛ و«إليكم» تعبّر طبيعيًا عن اتجاه الإرسال.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: وعد أبي
  rationale: يحفظ الإضافة كما هي من غير أن يصرّح في المتن بمضمون الوعد الذي يوضحه السياق.
- source_word: καθίσατε ἐν τῇ πόλει
  choice: الزموا المدينة
  rationale: الفعل هنا يفيد البقاء والانتظار، لا مجرد الجلوس الجسدي؛ وهذه صياغة عربية واضحة تحفظ قوة الأمر.
- source_word: ἐνδύσησθε
  choice: تُلبَسوا
  rationale: يحفظ استعارة ارتداء القوة وصيغة المبني للمجهول بدل تسويتها إلى مجرد «تنالوا».
- source_word: ἐξ ὕψους δύναμιν
  choice: قوةً من العلاء
  rationale: يحفظ ترتيب المعنى وصورة المصدر السماوي بعبارة عربية فصيحة ومفهومة.
theological_decisions:
- issue: تعيين «وعد أبي» صراحةً بأنه الروح القدس
  choice: الإبقاء على «وعد أبي» من غير تفسير داخل المتن
  alternative: «الروح القدس الذي وعد به أبي»
  rationale: النص اليوناني نفسه يستخدم «الوعد»، والسياق يبيّن المقصود؛ إدخال التفسير في المتن يضيّق العبارة أكثر مما يفعل الأصل.
- issue: طبيعة القوة الموعودة
  choice: «تُلبَسوا قوةً»
  alternative: «تمتلئوا قوةً» أو «تنالوا قوةً»
  rationale: الصياغة المختارة تحفظ المجاز اليوناني والتوتر بين عطية تأتي من فوق وتمكين يتلقاه المخاطبون.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «وها أنا» بدل «وهوذا أنا»، و«الزموا المدينة» لتجنب الفهم الحرفي الضيق للجلوس، مع الحفاظ على استعارة اللباس في «تُلبَسوا قوةً».
