lexical_decisions:
- source_word: Ταῦτα
  choice: بهذه الأمور
  rationale: يحفظ صيغة الجمع وإحالتها إلى الأمور التي كان التلاميذ يتحدثون عنها، وهو طبيعي في العربية المعاصرة.
- source_word: δὲ ... αὐτῶν λαλούντων
  choice: وبينما كانوا يتكلمون
  rationale: ينقل تركيب المضاف إليه المطلق مع اسم الفاعل المضارع بوصفه حدثًا مستمرًا تزامن معه الحدث الرئيس؛ والواو تصل الكلام بسياقه.
- source_word: αὐτὸς
  choice: هو نفسه
  rationale: يحفظ توكيد الضمير اليوناني الصريح ولا يختزله إلى مجرد فاعل مستتر.
- source_word: ἔστη
  choice: وقف
  rationale: ترجمة مباشرة للفعل، من غير إضافة معنى الظهور أو الحركة إلى المكان مما لا يصرح به اللفظ.
- source_word: ἐν μέσῳ αὐτῶν
  choice: في وسطهم
  rationale: تعبير عربي واضح يحافظ على الصورة المكانية في الأصل، بدل الاكتفاء بتعبير أقل تحديدًا مثل «بينهم».
theological_decisions:
- issue: 'إدراج القراءة الأطول: «وقال لهم: سلام لكم»'
  choice: حذفها من المتن اتباعًا لنص SBLGNT المقدم
  alternative: 'إدراج «وقال لهم: سلام لكم» في المتن'
  rationale: النص اليوناني المعتمد هنا ينتهي بعبارة «في وسطهم». ولأن القراءة الأطول ذات شأن في التقليد المخطوطي، تُذكر في الحاشية من غير إدخالها في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ توكيد «هو نفسه» والصورة المكانية «في وسطهم»، ووُضع مؤشر الحاشية بعد الجملة التي تتعلق بها القراءة النصية.
