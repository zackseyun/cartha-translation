  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: ar
  text: وكيف أسلمه رؤساء الكهنة وحكامنا ليُحكم عليه بالموت، وصلبوه.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى حكم بالموت»، أو: «ليُدان بالموت».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وجعلوه يُصلب»، لإظهار مسؤولية القادة عن تنفيذ الحكم مع أن السلطات الرومانية هي التي نفذت الصلب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: وكيف
  rationale: تنقل ὅπως مضمون متابعة الرواية بمعنى «كيف»، بينما تؤدي الواو قوة τε الرابطة بالسياق السابق.
- source_word: παρέδωκαν
  choice: أسلمه
  rationale: الفعل παραδίδωμι هنا يعني التسليم إلى السلطة بقصد المحاكمة والتنفيذ، و«أسلمه» تعبير عربي طبيعي يحفظ دلالته القضائية دون حصره في معنى الخيانة.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء كهنتنا
  rationale: يشير الجمع إلى طبقة القيادة الكهنوتية العليا، لا إلى وجود عدة رؤساء كهنة قائمين بالمنصب نفسه في آن واحد. وتقديم الضمير بهذه الصياغة يربط رؤساء الكهنة والحكام معًا بالمتكلمين.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: حكامنا
  rationale: ἄρχοντες يدل على أصحاب السلطة والقيادة، و«حكامنا» يلائم السياق القضائي والسياسي ويحفظ ضمير المتكلمين.
- source_word: εἰς κρίμα θανάτου
  choice: ليُحكم عليه بالموت
  rationale: κρίμα يدل هنا على الحكم أو الإدانة القضائية، وθανάτου يحدد نتيجتها بالموت. هذه الصياغة عربية واضحة وتحفظ معنى الغاية أو النتيجة في εἰς.
- source_word: ἐσταύρωσαν αὐτόν
  choice: صلبوه
  rationale: يحفظ الفعل العربي المباشر صيغة الفعل اليوناني المبني للمعلوم وإسناد المسؤولية إلى رؤساء الكهنة والحكام، من غير إضافة تفسير عن وساطة السلطة الرومانية.
theological_decisions:
- issue: الفاعلية في صلب يسوع
  choice: صلبوه
  alternative: جعلوه يُصلب
  rationale: النص اليوناني يسند الفعل مباشرة إلى رؤساء الكهنة والحكام. تحافظ الصياغة المختارة على قوة الإسناد والمسؤولية، من غير أن تحسم أن هؤلاء نفذوا الصلب بأيديهم.
- issue: طبيعة κρίμα θανάτου
  choice: ليُحكم عليه بالموت
  alternative: إلى حكم بالموت
  rationale: تُظهر الصياغة المعنى القضائي والنتيجة المفضية إلى الموت، مع عدم قصر κρίμα على مصطلح قانوني عربي واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «رؤساء كهنتنا وحكامنا» كي يشمل ضمير المتكلمين الفئتين كما في اليونانية، مع تجنب تركيب أثقل من قبيل «رؤساء الكهنة والحكام الذين لنا».
