  register: عربية فصحى حديثة واضحة وموقّرة، مع استخدام صيغة المثنّى الطبيعية. أُبقي معنى التبادل المتقابل في الحوار، وصيغت خاتمة الآية بما يحفظ احتمال دلالة ἐστάθησαν على الوقوف أو التوقّف، ودلالة σκυθρωποί على مظهر الحزن أو العبوس.
