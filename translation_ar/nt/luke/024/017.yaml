base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: ar
  text: 'فقال لهما: «ما هذا الكلام الذي تتبادلانه بينكما وأنتما سائران؟» فتوقّفا حزينين.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فوقفا كئيبين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτούς
  choice: فقال لهما
  rationale: الفاء تلائم تقدّم السرد، و«قال» تحافظ على دلالة الفعل من غير تحويله تفسيرياً إلى «سأل». والمثنّى العربي يعبّر بوضوح عن αὐτούς في سياق التلميذين.
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: ما هذا الكلام
  rationale: «الكلام» مفرد جمعي طبيعي في العربية يدل على الأقوال المتبادلة، ويحافظ على الإشارة إلى الحديث الجاري من غير تضييقه إلى مسائل محددة.
- source_word: ἀντιβάλλετε πρὸς ἀλλήλους
  choice: تتبادلانه بينكما
  rationale: ينقل الفعل معنى التبادل الكلامي المتقابل، ويعبّر «بينكما» عن العلاقة التبادلية بصياغة عربية طبيعية.
- source_word: περιπατοῦντες
  choice: وأنتما سائران
  rationale: الحال العربية تنقل تزامن السير مع تبادل الكلام، و«سائران» فصيحة واضحة في هذا السياق الرحلي.
- source_word: ἐστάθησαν
  choice: فتوقّفا
  rationale: يدل السياق على أنهما كفّا عن السير ووقفا؛ «توقّفا» أوضح في العربية الحديثة من ترجمة شكلية قد توحي بأنهما كانا واقفين أصلاً.
- source_word: σκυθρωποί
  choice: عابسين
  rationale: تنقل الكلمة هيئة الوجه الحزينة أو المتجهّمة بإيجاز، من غير إضافة فعل نظر غير موجود في اليونانية.
