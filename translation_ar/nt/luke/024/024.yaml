source:
  edition: SBLGNT
  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: ar
  text: وذهب بعضُ الذين معنا إلى القبر، فوجدوا الأمر كما قالت النساء، لكنهم لم يروه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: ذهب
  rationale: فعل سردي يدل هنا على التوجّه إلى القبر؛ و«ذهب» طبيعي ومباشر، من غير مبالغة في معنى المغادرة.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: بعضُ الذين معنا
  rationale: يحافظ على معنى أن المذكورين فئة من الجماعة المرتبطة بالمتكلمين، مع صياغة عربية واضحة وقريبة من تركيب اليونانية.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: إلى القبر
  rationale: يشير μνημεῖον في هذا السياق إلى موضع دفن يسوع، و«القبر» هو التعبير العربي المألوف والدقيق.
- source_word: εὗρον
  choice: وجدوا
  rationale: ينقل المعنى السردي البسيط للفعل من دون تحميله معنى أقوى مثل «اكتشفوا».
- source_word: οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: فوجدوا الأمر كما قالت النساء
  rationale: «الأمر» مفعول مفهوم يقتضيه الأسلوب العربي لبيان أن الحال التي وجدوها وافقت ما قالته النساء، من دون تحديد تفاصيل لم يذكرها النص. ولم يُفرد καί بلفظ «أيضًا» لأن معنى المطابقة ظاهر في العربية.
- source_word: αὐτὸν
  choice: ـه في «يروه»
  rationale: أُبقي الضمير العائد إلى يسوع بدل التصريح باسمه، حفاظًا على تماسك النص وعدم زيادة الإيضاح على الأصل.
- source_word: δὲ
  choice: لكن
  rationale: ينقل المقابلة بين تأكيد ما قالته النساء وعدم رؤية يسوع.
- source_word: οὐκ εἶδον
  choice: لم يروه
  rationale: يحافظ على دلالة ὁράω، أي الرؤية لا العثور، وعلى كون الفاعل هم الذين ذهبوا إلى القبر.
theological_decisions:
- issue: صياغة خبر القيامة
  choice: تقرير أن الزائرين وجدوا الحال موافقة لقول النساء، لكنهم لم يروا يسوع نفسه.
  alternative: تفصيل ما وجدوه في القبر أو مواءمة الخبر صراحةً مع روايات أخرى.
  rationale: يحفظ هذا الاختيار التمييز السردي في اليونانية بين موافقة الحال لقول النساء وعدم رؤية يسوع، من غير إدخال تفاصيل أو محاولات توفيق من خارج الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فوجدوا» لربط النتيجة بالذهاب في سياق سردي طبيعي، و«الأمر» لتجنب صياغة عربية مبتورة مع إبقاء مضمون ما وُجد غير محدد كما في الأصل.
