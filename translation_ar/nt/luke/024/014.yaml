  language: ar
  text: وكانا يتحدثان أحدهما مع الآخر عن جميع هذه الأمور التي حدثت.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكانا يتحاوران أحدهما مع الآخر بشأن جميع هذه الأحداث التي وقعت».'
    reason: بديل معجمي يحافظ على إمكان فهم ὡμίλουν بوصفه تحاورًا، وτῶν συμβεβηκότων بوصفه أحداثًا أو وقائع.
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف سردي بسيط يحفظ اتصال الجملة بما قبلها من غير إضافة دلالة زمنية غير مصرَّح بها.
- source_word: αὐτοὶ
  choice: ضمير التثنية المستتر في «كانا»
  rationale: السياق اليوناني يشير إلى الشخصين المذكورين، والعربية الفصحى تعبّر عنهما طبيعيًا بصيغة المثنى؛ ولا يلزم إبراز معنى «هما نفسيهما» لأن التوكيد هنا خفيف.
- source_word: ὡμίλουν
  choice: كانا يتحدثان
  rationale: تركيب «كانا» مع المضارع ينقل دلالة الماضي المستمر في صيغة الناقص اليونانية، و«يتحدثان» يدل على محادثة عادية لا خطاب رسمي.
- source_word: πρὸς ἀλλήλους
  choice: أحدهما مع الآخر
  rationale: ينقل بوضوح معنى التبادل بين الشخصين، ويلائم فعل «يتحدثان» في العربية المعاصرة.
- source_word: περὶ
  choice: عن
  rationale: يقدّم موضوع الحديث بصياغة عربية واضحة وطبيعية.
- source_word: πάντων
  choice: جميع
  rationale: يحفظ شمول مجموعة الأمور أو الوقائع التي دار حولها الحديث.
- source_word: τῶν συμβεβηκότων τούτων
  choice: هذه الأمور التي حدثت
  rationale: ينقل اسم الفاعل التام بوصفه أحداثًا وقعت وظلت حاضرة في سياق الحديث، من غير استعمال تعبير عتيق.
