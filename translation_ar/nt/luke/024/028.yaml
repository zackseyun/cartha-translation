  source_fidelity: 'المتن ينقل عناصر اليونانية الأساسية بدقة: الاقتراب من القرية، وجهة الرفيقين، وتصرف يسوع بما يوحي باستمرار السير إلى مسافة أبعد. لكن «سيواصل» قد تُفهم بوصفها مستقبلًا صريحًا أكثر من كونها الفعل الظاهر الذي تصنّعه في تلك اللحظة؛ وصيغة المضارع «يواصل» أقرب إلى قيمة المصدر الحاضر πορεύεσθαι في هذا التركيب.'
