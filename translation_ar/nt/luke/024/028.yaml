  rationale: يحافظ التعديل على المعنى المقارن لـπορρώτερον وعلى الإيحاء المتعمد بمواصلة الرحلة في προσεποιήσατο، مع صياغة عربية أقرب إلى الفعل الجاري الذي تصفه البنية اليونانية. كما صُححت ترقيم الحاشية.
