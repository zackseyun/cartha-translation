  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: ar
  text: ولمّا اقتربا من القرية التي كانا ذاهبَين إليها، تصرّف هو كأنه يواصل السير إلى مكان أبعد.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تظاهر بأنه ذاهب إلى مكان أبعد»، أو: «أظهر كأنه سيمضي إلى أبعد».'
    reason: بدائل معجمية لعبارة προσεποιήσατο πορρώτερον πορεύεσθαι؛ إذ يمكن التعبير عنها بالتظاهر أو بإظهار هيئة من يواصل السير.
lexical_decisions:
- source_word: ἤγγισαν
  choice: اقتربا
  rationale: الفعل يدل على الدنو من مكان، وصيغة التثنية العربية تُظهر أن المقصود رفيقا الطريق المذكوران في السياق.
- source_word: κώμην
  choice: القرية
  rationale: تشير الكلمة عادةً إلى تجمع سكني صغير لا إلى مدينة، و«القرية» هي المقابل العربي الطبيعي.
- source_word: οὗ ἐπορεύοντο
  choice: التي كانا ذاهبَين إليها
  rationale: ينقل هذا التعبير وجهة الرحلة المستمرة التي يدل عليها الفعل في صيغة الماضي الناقص، بعبارة عربية واضحة.
- source_word: προσεποιήσατο
  choice: تصرّف ... كأنه
  rationale: ينقل إعطاء انطباع بأنه سيفعل الأمر من غير أن يحسم في المتن ما إذا كان الوصف يعني التظاهر أو مجرد إظهار نية مواصلة الطريق.
- source_word: πορρώτερον
  choice: إلى مكان أبعد
  rationale: يحفظ المعنى المقارن المتعلق بالمسافة في سياق السير.
- source_word: πορεύεσθαι
  choice: سيواصل السير
  rationale: يفيد أن الحركة الظاهرة كانت استمرارًا في الرحلة بعد الوصول إلى جوار القرية، وهو تعبير طبيعي في العربية.
theological_decisions:
- issue: دلالة προσεποιήσατο في وصف تصرف يسوع
  choice: تصرّف هو كأنه سيواصل السير إلى مكان أبعد
  alternative: تظاهر بأنه ذاهب إلى مكان أبعد
  rationale: تحفظ الصياغة التوتر السردي في النص اليوناني، لكنها لا تفرض حكمًا أقوى بشأن الخداع مما تقتضيه اللفظة نفسها. وتورد الحاشية البديل الأكثر صراحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة التثنية موافقةً للسياق، ووُضع الضمير «هو» لإبراز انتقال الفاعل في الجملة كما في اليونانية. علامة الحاشية موضوعة عند العبارة التي تتعلق بها مباشرة.
