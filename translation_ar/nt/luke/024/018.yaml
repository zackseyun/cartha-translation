    text: 'يمكن أيضًا فهم السؤال: «أأنت الوحيد الذي يقيم في أورشليم كغريب ولا يعلم ما جرى فيها؟» فالفعل اليوناني يدل على الإقامة في مكان بصفة الغريب أو الوافد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: فأجابه
  rationale: يجمع التعبير العربي الطبيعي بين أداة الانتقال السردي ومعنى اسم الفاعل الدال على الجواب، من غير إثقال العبارة بصيغة حرفية.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: أحدهما، واسمه كليوباس
  rationale: السياق السابق يبيّن أنه واحد من الاثنين؛ و«واسمه» تعبير عربي واضح عن ὀνόματι.
- source_word: εἶπεν πρὸς αὐτόν
  choice: 'أجابه ...:'
  rationale: أُدمج فعل القول في فعل الجواب منعًا للتكرار الثقيل في العربية، مع الحفاظ على توجيه الكلام إليه.
- source_word: Σὺ μόνος
  choice: أأنت وحدك
  rationale: يحفظ توكيد الحصر في μόνος وصيغة السؤال الاستنكاري.
- source_word: παροικεῖς
  choice: غريبٌ مقيم في
  rationale: ينقل معنى الإقامة في موضع بصفة الغريب أو الوافد، وهو أدق من «زائر» التي قد توحي بزيارة عابرة فقط.
- source_word: Ἰερουσαλὴμ
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الشائعة لاسم المدينة.
- source_word: οὐκ ἔγνως
  choice: ولا تعلم
  rationale: الماضي اليوناني يفيد هنا حالة عدم الاطلاع على الأحداث الواقعة حديثًا؛ والمضارع العربي طبيعي في هذا السؤال ويحفظ النتيجة الراهنة.
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: ما جرى فيها
  rationale: صياغة عربية موجزة وطبيعية تنقل الأحداث التي وقعت في المدينة، مع إبقاء مرجع الضمير ظاهرًا من السياق.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: في هذه الأيام
  rationale: ترجمة قريبة وواضحة للتعبير الزمني اليوناني.
