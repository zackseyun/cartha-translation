  source_fidelity: 'النص ينقل عناصر اليونانية كاملة: العلامة السردية «Καὶ ἰδού» بصيغة «وإذا»، والتبعيض في «اثنان منهم»، وتوكيد الزمن «في ذلك اليوم نفسه»، والحركة المستمرة في «كانا ... ذاهبَين»، وكون المكان قرية، والمسافة ووحدة القياس، واسم «عمواس». لا توجد إضافة تفسيرية أو تحديد غير موجود في المصدر.'
  naturalness: الصياغة فصيحة ومفهومة في العربية المعاصرة، مع نبرة سردية كتابية مناسبة. تركيب «وإذا اثنان منهم كانا...» جائز في هذا السجل، و«اسمها عمواس» طبيعي وموجز.
  terminology: «أورشليم» و«عمواس» صيغتان عربيتان كتابيتان راسختان. و«غلوة» مستخدمة في التراث الترجمـي العربي كوحدة للمسافة، وقد أزيل احتمال غموضها بالحاشية. التقريب إلى نحو 11 كيلومترًا مناسب لستين ستاديونًا.
