lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: وإذا
  rationale: تنقل أداة لوقا السردية التي تلفت الانتباه إلى تطور جديد، بصياغة عربية فصيحة وطبيعية دون إثقال العبارة بـ«وهوذا».
- source_word: δύο ἐξ αὐτῶν
  choice: اثنان منهم
  rationale: تؤدي التعبير التبعيضي بوضوح، وتحيل إلى الجماعة المذكورة في السياق دون تحديد زائد.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: في ذلك اليوم نفسه
  rationale: تحفظ توكيد العبارة اليونانية وتبرز أن الرحلة وقعت في اليوم عينه.
- source_word: ἦσαν πορευόμενοι
  choice: كانا ... ذاهبَين
  rationale: تعكس الصيغة المحيطية الناقصة، بما فيها من دلالة على حركة كانت جارية في الماضي.
- source_word: εἰς κώμην
  choice: إلى قرية
  rationale: «قرية» المقابل المباشر لـκώμη، وحرف الغاية «إلى» يلائم فعل الحركة.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: تبعد عن أورشليم ستين غلوة
  rationale: تحفظ وحدة القياس القديمة في المتن وتضع التقريب الحديث في الحاشية؛ و«غلوة» اسم عربي فصيح لوحدة stadion القديمة.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: اسمها عمواس
  rationale: صياغة عربية موجزة وطبيعية تحافظ على ذكر الاسم صراحة في التركيب اليوناني.
