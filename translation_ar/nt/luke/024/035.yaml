  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: ar
  text: وكانا هما يرويان ما جرى في الطريق، وكيف انكشف لهما عند كسر الخبز.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكيف تعرّفا إليه عند كسر الخبز». الفعل اليوناني مبني للمجهول، وقد يبرز إما تعرّفهما إليه وإما كونه قد انكشف لهما.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτοὶ
  choice: هما أيضًا
  rationale: الضمير اليوناني الصريح يحمل توكيدًا ويميّز التلميذين اللذين صارا الآن يرويان خبرهما؛ وتؤدي صيغة المثنى العربية هذا بوضوح طبيعي.
- source_word: ἐξηγοῦντο
  choice: أخذا يرويان
  rationale: تفيد صيغة الماضي الناقص سردًا كان جاريًا، و«أخذا يرويان» تعبير عربي طبيعي ينقل الاستمرار في رواية الوقائع دون جعله شرحًا رسميًا.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: ما جرى في الطريق
  rationale: العبارة اليونانية موجزة وحذفُ فعل الوقوع مفهوم منها؛ والإظهار بـ«ما جرى» لازم لفصاحة العربية ولا يضيف مضمونًا غريبًا عن السياق.
- source_word: ὁδῷ
  choice: الطريق
  rationale: المقصود طريق رحلة عمواس، و«الطريق» هو المقابل العربي المباشر والطبيعي.
- source_word: ὡς
  choice: كيف
  rationale: تدخل هنا على مضمون الرواية وتبيّن كيفية المعرفة أو حدوثها، ولذلك تحافظ «كيف» على الدلالة.
- source_word: ἐγνώσθη
  choice: عُرِفَ لهما
  rationale: يحافظ البناء للمجهول على صيغة اليونانية وعلى التوتر الدلالي بين كونه صار معروفًا لهما وبين أنهما تعرّفا إليه، من غير تعيين فاعل الإظهار.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: عند كسر الخبز
  rationale: تنقل «عند» الملابسة الزمنية والحدثية التي تفيدها ἐν طبيعيًا في العربية، و«كسر الخبز» يحافظ على الاسم المصدري وعلى الخبز المعيّن في مشهد الوجبة.
theological_decisions:
- issue: هل يُصاغ ἐγνώσθη بوصفه تعرّفًا بشريًا صريحًا أم يُحافَظ على المبني للمجهول؟
  choice: عُرِفَ لهما
  alternative: تعرّفا إليه
  rationale: الصيغة المبنية للمجهول في اليونانية تترك مفتوحًا هل التركيز على إدراكهما أم على إظهاره لهما. إبقاء المبني للمجهول يصون هذا التوتر ولا يفرض تفسيرًا لاهوتيًا بعينه.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. استُعمل المثنى لأن المرجع هو تلميذا عمواس، وحُفظ البناء للمجهول في العبارة المحورية. لم توضع علامة حاشية على «الخبز» لأن التعريف في العربية يلائم العبارة اليونانية وسياق الوجبة المحددة، بينما البديل غير المعرّف أقل طبيعية هنا.
