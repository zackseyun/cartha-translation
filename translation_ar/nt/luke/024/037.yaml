  terminology: «روحًا» مقابِل مباشر ومحايد لـπνεῦμα في هذا الموضع، والحاشية تعرض «شبحًا» بديلًا سياقيًا دون فرض تفسير أو إيحاء شعبي. مرساة الحاشية موضوعة على «روحًا» في موضعها الصحيح.
