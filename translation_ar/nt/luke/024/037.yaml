  text: πτοηθέντες δὲ καὶ ἔμφοβοι γενόμενοι ἐδόκουν πνεῦμα θεωρεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: ar
  text: لكنهم ارتاعوا وصاروا خائفين، وظنّوا أنهم يرون روحًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شبحًا». والكلمة اليونانية تعني حرفيًا «روحًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: ارتاعوا
  rationale: ينقل الفعل معنى الاضطراب المفاجئ والذعر عند ظهور يسوع، من غير أن يطمس ذكر الخوف الصريح في العبارة التالية.
- source_word: δὲ
  choice: لكنهم
  rationale: تفيد الأداة انتقالًا ذا مسحة تقابلية بين ظهور يسوع ورد فعل التلاميذ، و«لكنهم» تعبير عربي طبيعي عن ذلك.
- source_word: ἔμφοβοι γενόμενοι
  choice: صاروا خائفين
  rationale: يحفظ معنى الدخول في حالة الخوف الذي تفيده الصفة مع فعل الصيرورة.
- source_word: ἐδόκουν
  choice: ظنّوا
  rationale: ينقل افتراضهم أو انطباعهم المستمر في ذلك الموقف بعبارة عربية واضحة.
- source_word: πνεῦμα
  choice: روحًا
  rationale: هو المقابل المباشر للكلمة اليونانية، ويحفظ فهم التلاميذ الخاطئ ليسوع بوصفه كائنًا غير جسدي، من غير إدخال تصورات شعبية زائدة.
- source_word: θεωρεῖν
  choice: يرون
  rationale: المضارع العربي بعد «ظنّوا» يلائم المصدر المضارع اليوناني ويعبّر طبيعيًا عن الرؤية التي حسبوا أنهم يختبرونها آنذاك.
theological_decisions:
- issue: ترجمة πνεῦμα في سياق ظهور يسوع بعد القيامة
  choice: روحًا
  alternative: شبحًا
  rationale: '«روحًا» أقرب إلى اللفظ اليوناني وتحفظ التوتر السردي: فقد ظن التلاميذ أن ما يرونه كائن غير جسدي، ثم يصحح يسوع هذا الظن في السياق التالي. أما «شبحًا» فهي ممكنة سياقيًا لكنها قد تستدعي إيحاءات شعبية لا يصرح بها النص.'
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، تحافظ على تتابع الارتياع ثم الصيرورة إلى الخوف، وعلى الفرق بين الصدمة المفاجئة وحالة الخوف، من غير تكلف أو حسم زائد لدلالة «روح».
