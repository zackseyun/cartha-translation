  to: 'وبينما كانوا لا يزالون، من الفرح والدهشة، غير مصدقين، قال لهم: «أعندكم هنا شيء يؤكل؟»'
  rationale: حُذفت «شدة» لأنها زيادة تفسيرية غير لازمة، وأعيد ترتيب العبارة لتوضيح أن الفرح سبب عدم تصديقهم وأن الدهشة حالة متزامنة. واستُبدلت «ههنا» بـ«هنا» لسلامة الاستعمال الفصيح الحديث، من دون تغيير المعنى.
