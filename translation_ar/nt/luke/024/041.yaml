  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: ar
  text: 'وبينما كانوا لا يزالون، من الفرح والدهشة، غير مصدقين، قال لهم: «أعندكم هنا شيء يؤكل؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτι δὲ
  choice: وبينما كانوا لا يزالون
  rationale: تنقل «ἔτι» معنى الاستمرار، ويهيئ «وبينما» الجملة الظرفية المتزامنة في عربية طبيعية، مع تمثيل «δέ» بواو ربط خفيفة.
- source_word: ἀπιστούντων
  choice: غير مصدِّقين
  rationale: يحفظ اسم الفاعل معنى الحالة المستمرة المؤقتة في السياق، من غير أن يوحي بكفر راسخ.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: من شدة الفرح
  rationale: 'تؤدي «ἀπό» معنى السبب أو المصدر، وهذه العبارة العربية الطبيعية تبرز المفارقة: كان فرحهم الغامر سببًا في تعذر التصديق عليهم.'
- source_word: θαυμαζόντων
  choice: متعجِّبين
  rationale: يحفظ اسم الفاعل التزامن والاستمرار، وينقل معنى الدهشة المشوبة بالعجب.
- source_word: Ἔχετέ τι
  choice: أعندكم ... شيء
  rationale: صياغة استفهامية عربية موجزة وطبيعية تنقل سؤال الحيازة المفتوح.
- source_word: βρώσιμον
  choice: يؤكل
  rationale: يعكس معنى «صالح للأكل/مأكول» بصورة عربية مألوفة في هذا السؤال.
- source_word: ἐνθάδε
  choice: ههنا
  rationale: مقابل مكاني موجز وفصيح بمعنى «في هذا المكان».
theological_decisions:
- issue: طبيعة عدم تصديق التلاميذ ليسوع القائم
  choice: إبقاء عدم التصديق حالة مؤقتة مرتبطة بشدة الفرح والدهشة
  alternative: تصويرهم على أنهم رافضون أو واقعون في عدم إيمان راسخ
  rationale: يربط النص اليوناني عدم تصديقهم بالفرح والعجب في تركيب واحد، فيحفظ النقل التوتر النفسي واللاهوتي ولا يحوله إلى رفض متعمد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «من شدة الفرح» لبيان السببية بصورة مألوفة، و«ههنا» محافظةً على الإيجاز والنبرة الكتابية من غير غموض.
