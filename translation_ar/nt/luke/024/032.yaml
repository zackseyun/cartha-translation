base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: ar
  text: 'وقالا أحدهما للآخر: «أما كان قلبنا مشتعلًا في داخلنا[a] حين كان يكلّمنا في الطريق، وحين كان يفتح لنا الكتب المقدسة[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لا ترد عبارة «في داخلنا» في بعض المخطوطات القديمة.
    reason: textual_variant
  - marker: b
    text: 'أي: كان يكشف لنا معنى الكتب المقدسة ويوضحه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: أحدهما للآخر
  rationale: تعبير عربي طبيعي في سياق شخصين، ويحفظ معنى التبادل في العبارة اليونانية.
- source_word: Οὐχὶ
  choice: أما كان
  rationale: يصوغ سؤالًا بلاغيًا يتوقع جوابًا بالإيجاب، كما في اليونانية.
- source_word: ἡ καρδία ἡμῶν
  choice: قلبنا
  rationale: يحفظ المفرد الوارد في اليونانية، ويمكن فهمه بوصفه تعبيرًا عن استجابتهما الداخلية المشتركة.
- source_word: καιομένη
  choice: مشتعلًا
  rationale: يحفظ استعارة الاحتراق من غير حصرها في انفعال عاطفي أو استنارة روحية بعينها.
- source_word: ἐν ἡμῖν
  choice: في داخلنا
  rationale: ينقل بوضوح موضع الاختبار الباطني، مع إثبات الهامش لاختلاف مخطوطات قديمة في وجود العبارة.
- source_word: ἐλάλει
  choice: كان يكلّمنا
  rationale: صيغة «كان» مع المضارع تنقل الجانب الاستمراري للفعل الناقص.
- source_word: ἐν τῇ ὁδῷ
  choice: في الطريق
  rationale: ترجمة مباشرة وطبيعية تحتفظ بالمشهد السردي، ويمكن أن تُفهم أيضًا بمعنى «في أثناء السير».
- source_word: διήνοιγεν
  choice: كان يفتح لنا
  rationale: يحفظ استعارة الفتح ويعبّر بصيغة مستمرة عن الفعل الناقص، من غير استبدالها في المتن بتفسير مثل «يشرح».
- source_word: τὰς γραφάς
  choice: الكتب المقدسة
  rationale: المقصود هو الأسفار المعترف بها بوصفها كتابات مقدسة؛ وهذه العبارة واضحة ومستقرة في العربية المعاصرة.
theological_decisions:
- issue: القوة المجازية لعبارة «قلبنا مشتعلًا»
  choice: الإبقاء على صورة اشتعال القلب
  alternative: كان قلبانا متأثرين بشدة؛ أو شعرنا بنار في داخلنا
  rationale: لا يحدد النص هل المقصود انفعال عاطفي أم استنارة روحية أم استجابة معرفية؛ فالإبقاء على الاستعارة يصون هذا التوتر.
- issue: معنى «يفتح الكتب المقدسة»
  choice: حفظ استعارة الفتح في المتن
  alternative: كان يشرح لنا الكتب المقدسة أو يوضح معناها
  rationale: الاستعارة في διανοίγω مقصودة، مع أن السياق يدل على كشف المعنى؛ وحفظها يتجنب حل الصورة بتفسير مباشر.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «أحدهما للآخر» لأن المتكلمين اثنان، وحُفظ مفرد «قلبنا» واستعارتا الاشتعال والفتح التزامًا بالنص اليوناني.
