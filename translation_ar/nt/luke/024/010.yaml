base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: ar
  text: 'وكانت النساء: مريم المجدلية، ويونّا، ومريم أم يعقوب[a]، والنساء الأخريات اللواتي كنّ معهن؛ وكنّ يخبرن الرسل بهذه الأمور.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية حرفيًا: «مريم ليعقوب»، من غير تحديد نوع الصلة. والأرجح أن المقصود «مريم أم يعقوب»، لكن قد يُفهم أيضًا «مريم زوجة يعقوب».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: وكانت النساء
  rationale: تؤدي الواو الانتقال السردي الخفيف الذي تفيده δὲ، ويُصرَّح بـ«النساء» لأن العربية لا تستسيغ بدء الجملة بضمير جمع مؤنث يعود إلى المذكورات في السياق على نحو مماثل لليونانية.
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: مريم المجدلية
  rationale: الصيغة العربية المألوفة للاسم والنسبة إلى مجدل.
- source_word: Ἰωάννα
  choice: يونّا
  rationale: نقل عربي واضح للاسم اليوناني، ومتسق مع الاستعمال الكتابي الشائع.
- source_word: Μαρία ἡ Ἰακώβου
  choice: مريم أم يعقوب
  rationale: التركيب اليوناني موجز، وحرفيًا «مريم التي ليعقوب». والأرجح أنه يعرّفها بوصفها أم يعقوب، مع إبقاء احتمال الزوجية في الحاشية.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: سائر النساء اللواتي معهن
  rationale: صيغة المؤنث الجمع تشير في السياق إلى نساء أخريات؛ والتصريح بالاسم المحذوف طبيعي وواضح بالعربية.
- source_word: ἔλεγον
  choice: كنّ يخبرن
  rationale: الماضي الناقص اليوناني يصور الإخبار بوصفه جاريًا أو متكررًا، فتؤديه «كنّ يخبرن» دون اختزاله إلى فعل ماض بسيط.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: الرسل
  rationale: «الرسل» هو المقابل العربي الراسخ والدقيق لـἀπόστολοι في هذا السياق.
- source_word: ταῦτα
  choice: بهذه الأمور
  rationale: تحافظ العبارة على جمع اسم الإشارة وإحالته إلى الأحداث والرسالة المذكورة سابقًا، بصياغة عربية طبيعية.
theological_decisions:
- issue: تحديد صلة مريم بيعقوب في Μαρία ἡ Ἰακώβου
  choice: مريم أم يعقوب
  alternative: 'مريم زوجة يعقوب، أو حرفيًا: مريم التي ليعقوب'
  rationale: اليونانية تترك نوع الصلة محذوفًا. والأرجح بحسب صيغة التعريف في سياق الأناجيل أنها الأم، لكن لا ينبغي إخفاء احتمال أن تكون الزوجة، لذلك أُثبت الغموض في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت صيغة جمع المؤنث في «كنّ يخبرن» للمحافظة على مرجع الفاعل وعلى دلالة الاستمرار في الماضي، وفُصلت الجملتان بفاصلة منقوطة إظهارًا لبنية الأصل.
