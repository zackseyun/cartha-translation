  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: ar
  text: ثم قادهم خارجًا حتى بيت عنيا[a]، ورفع يديه وباركهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «إلى بيت عنيا» أو «قرب بيت عنيا»؛ فالتعبير اليوناني أكثر تفصيلًا قليلًا، وحرفيًّا: «حتى نحو بيت عنيا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: أخرجهم
  rationale: الفعل ἐξάγω يدل على الإخراج أو الاقتياد إلى الخارج؛ و«أخرجهم» عربية طبيعية وتحفظ دلالة الاتجاه الكامنة في السابقة ἐξ- من غير إضافة مكان لم يذكره النص.
- source_word: δὲ
  choice: ثم
  rationale: تؤدي δέ هنا وظيفة الانتقال في سياق السرد لا المقابلة، و«ثم» تنقل هذا التتابع بوضوح.
- source_word: ἕως πρὸς Βηθανίαν
  choice: حتى بيت عنيا
  rationale: يحفظ التعبير معنى الامتداد المكاني إلى بيت عنيا، مع إثبات حاشية تبين أن تركيب ἕως πρός يحتمل الوصول إليها أو التوجه إلى ناحيتها أو الاقتراب منها.
- source_word: Βηθανίαν
  choice: بيت عنيا
  rationale: الصيغة العربية المألوفة لاسم الموضع Βηθανία.
- source_word: ἐπάρας
  choice: ورفع
  rationale: اسم الفاعل الماضي يدل على فعل سابق أو ملازم لفعل البركة؛ وصياغته فعلاً معطوفاً طبيعية في العربية وتحفظ ترتيب الحركة.
- source_word: τὰς χεῖρας αὐτοῦ
  choice: يديه
  rationale: المثنى العربي ينقل بدقة صيغة الجمع اليونانية في الإشارة إلى يدي يسوع كلتيهما، ويحفظ هيئة البركة الموصوفة.
- source_word: εὐλόγησεν
  choice: باركهم
  rationale: ينقل المعنى المباشر للفعل εὐλογέω، أي إيقاع البركة عليهم، من غير توسيع طقسي أو مذهبي.
theological_decisions:
- issue: طبيعة مباركة يسوع للتلاميذ
  choice: باركهم
  alternative: نطق عليهم بالبركة
  rationale: يحافظ التعبير المباشر على فعل البركة كما يورده النص، من غير اختزاله إلى مجرد تمنٍّ ولا تحميله صيغة كهنوتية أو طقسية لاحقة.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموجزة وذات نبرة سردية مهيبة. استُخدم «يديه» بدل تركيب أطول، وأُبقي غموض العبارة المكانية في الحاشية من غير حسم زائد.
