base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: ar
  text: وبينما كنّ متحيّرات في هذا، إذا برجلين قد وقفا بجانبهنّ، بلباسٍ يلمع كالبرق.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: بينما
  rationale: تؤدي الصياغة العربية «وبينما... إذا...» وظيفة العبارة السردية اللوقاوية وتقدّم الحدث المفاجئ بصورة طبيعية، من غير استعمال تركيب عتيق مثل «وحدث أنه».
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς
  choice: بينما كنّ متحيّرات
  rationale: التركيب ذو المصدر المعرّف مع ἐν زمني، وἀπορέω يدل على الحيرة والعجز عن فهم الأمر، لا على مجرد التعجب أو التساؤل.
- source_word: περὶ τούτου
  choice: في هذا
  rationale: إحالة موجزة وطبيعية إلى ما سبق وصفه في السياق.
- source_word: ἰδοὺ
  choice: إذا
  rationale: استُعملت «إذا» الفجائية لجذب الانتباه إلى التطور المفاجئ في المشهد، بما يلائم السرد العربي الحديث أكثر من «هوذا» هنا.
- source_word: ἄνδρες δύο
  choice: رجلين
  rationale: يحافظ اللفظ على عرض الشخصيتين في هذه الآية كرجلين، من غير استباق تعريفهما بوصفهما ملاكين في السياق الأوسع.
- source_word: ἐπέστησαν αὐταῖς
  choice: قد وقفا بجانبهنّ
  rationale: يحفظ المعنى المكاني، أي صارا واقفين بالقرب منهنّ، كما تلائم «قد» بنية «إذا» الفجائية.
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: في لباسٍ باهر
  rationale: صياغة عربية واضحة وموجزة تنقل شدة اللمعان، مع إبقاء صورة البرق الصريحة في الحاشية لأنها دلالة حقيقية في اللفظ اليوناني.
theological_decisions:
- issue: هوية الشخصيتين
  choice: رجلين
  alternative: ملاكين
  rationale: تقدمهما هذه الآية نفسها بوصفهما «رجلين». أما كونهما رسولين سماويين فيتضح من السياق، ولذلك لا تُستورد هذه الهوية إلى نص الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية مهيبة. استُعملت بنية «بينما... إذا...» لتجنب الترجمة الحرفية الثقيلة للصيغة اللوقاوية، وحُفظ التأنيث الجمعي في «كنّ» و«هنّ» لبيان رجوع الضمائر إلى النساء.
