  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: ar
  text: 'فألحّا عليه بشدة[a] قائلين: «ابقَ معنا، لأن المساء يقترب، وقد مال النهار بالفعل[b]». ودخل ليمكث معهما.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ضغطا عليه بإلحاح»، وتقليديًا «ألزماه».
    reason: lexical_alternative
  - marker: b
    text: أو «وقد أوشك النهار أن ينقضي».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: ألحّا عليه بشدة
  rationale: يفيد الفعل هنا الإلحاح القوي في الطلب، لا الإكراه الجسدي بالضرورة. واستُعمل المثنى لأن المتكلمين هما التلميذان المذكوران في السياق.
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: ابقَ معنا
  rationale: صياغة عربية طبيعية مباشرة لطلب البقاء في سياق الضيافة، وتحفظ معنى المصاحبة في μεθ’ ἡμῶν.
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: لأن المساء يقترب
  rationale: تنقل العبارة اتجاه الوقت نحو المساء، من غير أن تفترض أن المساء قد حلّ تمامًا.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: وقد مال النهار بالفعل
  rationale: تحفظ صورة النهار الذي أخذ يميل إلى نهايته، كما تنقل دلالة الحالة القائمة في صيغة التام κέκλικεν ومعنى ἤδη.
- source_word: εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς
  choice: فدخل ليمكث معهما
  rationale: تنقل الدخول وغايته بوضوح؛ واستُعمل المثنى بحسب مرجع الضمير في السياق العربي.
