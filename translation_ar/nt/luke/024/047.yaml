review_pass:
  verdict: revise
  source_fidelity: 'المعنى الأساسي محفوظ: إعلان التوبة المرتبطة بغفران الخطايا باسم يسوع، لجميع الأمم، من أورشليم. لكن «يُنادى باسمه بالتوبة» تركيب غير سلس وقد يلتبس فيه متعلَّق «باسمه» أو يبدو أن المناداة هي «بالتوبة». كما أن «إلى جميع الأمم» أقرب إلى اتجاه εἰς من «بين جميع الأمم».'
  naturalness: الفصحى المعاصرة الأوضح هي «تُعلَن باسمه التوبة...»؛ فهي تعبّر عن الإعلان العلني بصيغة المبني للمجهول من غير الإيحاء بنداءٍ مباشر أو استعمال تركيب غير مألوف. وصياغة الحاشية (أ) تحتاج إلى تعيين ما الذي يمكن فهمه في اليونانية.
  terminology: «التوبة» و«غفران الخطايا» و«الأمم» مقابلات عربية راسخة ومناسبة. «باسمه» يحفظ دلالة العمل باسمه/بسلطانه دون تحميل النص تفصيلًا لاهوتيًا إضافيًا.
