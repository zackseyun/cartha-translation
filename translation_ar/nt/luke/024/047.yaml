  - severity: low
    issue: دقة صياغة الحاشية (أ)
    rationale: لا يصح أسلوبيًا أن يقال «يمكن فهم اليونانية على أنهما» من غير بيان البنية أو النص؛ والصياغة المنقحة توضّح أن التوبة وغفران الخطايا هما العنصران المتعاطفان المحتملان.
