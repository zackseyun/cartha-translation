  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: ar
  text: وأن تُعلَن باسمه التوبة لغفران الخطايا إلى جميع الأمم[b][a]، ابتداءً من أورشليم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «التوبة وغفران الخطايا»؛ إذ يمكن فهم النص اليوناني على أن التوبة وغفران الخطايا عنصران متعاطفان في مضمون الإعلان.'
    reason: alternative_reading
  - marker: b
    text: يمكن أن تعني الكلمة اليونانية أيضًا «غير اليهود» في بعض السياقات.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: يُنادى
  rationale: يحفظ معنى الإعلان العلني، وتناسب صيغة المبني للمجهول المصدرية اعتمادها على سياق وجوب إتمام ما كُتب.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: باسمه
  rationale: تعبير عربي طبيعي يدل على أن الإعلان قائم على شخص يسوع وسلطانه.
- source_word: μετάνοιαν
  choice: التوبة
  rationale: المقابل العربي المألوف والدقيق لمعنى الرجوع وتغيير التوجه، وهو أوضح من قصر اللفظ على تغيير الفكر.
- source_word: καὶ ἄφεσιν ἁμαρτιῶν
  choice: لغفران الخطايا
  rationale: يربط التوبة بالغفران من غير فرض ترتيب خلاصي تفصيلي لا يصرح به النص؛ وتُذكر القراءة التنسيقية الممكنة في الحاشية.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: بين جميع الأمم
  rationale: ينقل الامتداد العالمي للإعلان؛ و«الأمم» تحفظ المجال الدلالي الذي قد يشمل أيضًا غير اليهود بحسب السياق.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: ابتداءً من أورشليم
  rationale: يحفظ كون أورشليم نقطة انطلاق الإعلان مع صياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: العلاقة بين التوبة وغفران الخطايا في مضمون الإعلان
  choice: التوبة لغفران الخطايا
  alternative: التوبة وغفران الخطايا بوصفهما عنصرين متعاطفين في مضمون الإعلان
  rationale: تسمح البنية اليونانية بربط التوبة بالغفران، كما تسمح بجعل الاسمين متعاطفين؛ أُبقي الربط في المتن مع توثيق الاحتمال الآخر، بلا استنباط ترتيب خلاصي كامل.
- issue: مدلول ἔθνη
  choice: جميع الأمم
  alternative: جميع غير اليهود
  rationale: السياق يبرز النطاق العالمي، و«الأمم» تحافظ على اللفظ ولا تحصره صراحة في غير اليهود، مع التنبيه إلى إمكان هذا المعنى.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «يُنادى» لإبراز الإعلان العلني، و«التوبة» بوصفها المقابل العربي الطبيعي، مع إبقاء موضعي الالتباس الحقيقيين في حاشيتين تحملان علامتيهما في المتن.
