  yaml_path: translation/nt/luke/024/022.yaml
  text: But also[a], some women from among us astonished us, having gone early in the morning to the tomb[b],
translation:
  language: ar
  text: بل إن بعض النساء من جماعتنا أدهشننا[a]، إذ أتين إلى القبر عند الفجر[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حيّرننا» أو «أذهلننا». يمكن للفعل اليوناني أن يدل على مفاجأة شديدة أو ارتباك.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في الصباح الباكر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: بل إن
  rationale: تنقل القوة الاستدراكية مع إضافة عنصر مفاجئ إلى ما سبق، بصياغة عربية طبيعية.
- source_word: γυναῖκές τινες
  choice: بعض النساء
  rationale: تؤدي معنى الجمع غير المعيّن بوضوح وطبيعية.
- source_word: ἐξ ἡμῶν
  choice: من جماعتنا
  rationale: توضح أن النساء كنّ من دائرة التلاميذ، لا أنهن أتين من عند المتكلمين فحسب.
- source_word: ἐξέστησαν ἡμᾶς
  choice: أدهشننا
  rationale: تحفظ معنى المفاجأة الشديدة من غير أن تحصره في الارتباك أو توحي بإيمانهم بصحة الخبر.
- source_word: γενόμεναι
  choice: إذ أتين
  rationale: تجعل الدلالة الاصطلاحية للمشاركة مع وصف التبكير والاتجاه إلى القبر واضحة في العربية.
- source_word: ὀρθριναὶ
  choice: عند الفجر
  rationale: تؤدي معنى التبكير أو وقت انبلاج الصبح بصياغة عربية موجزة.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: إلى القبر
  rationale: حرف الجر اليوناني مع النصب يلائم هنا معنى الحركة نحو القبر.
theological_decisions:
- issue: دلالة ἐξέστησαν في سياق خبر القيامة
  choice: أدهشننا
  alternative: حيّرننا
  rationale: تحفظ الصياغة شدة رد الفعل والتوتر السردي، من غير أن تقرر أن التلاميذ صدقوا الخبر أو رفضوه.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختيرت «من جماعتنا» لبيان الانتماء إلى دائرة التلاميذ، وحُفظت نهاية الآية بفاصلة لأنها تتصل نحويًا وسرديًا بما يليها.
