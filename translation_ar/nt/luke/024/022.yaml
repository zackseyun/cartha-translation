  verdict: approve
  source_fidelity: النص العربي ينقل بدقة البنية الاستدراكية الإضافية في «بل إن»، وعدم تعيين «بعض النساء»، وانتماءهن إلى جماعة المتكلمين، وقوة رد الفعل في «أدهشننا». كما أن «إذ أتين إلى القبر عند الفجر» تمثّل تمثيلاً عربيًا سليمًا للعبارة الوصفية اليونانية الخاصة بذهابهن/وجودهن المبكر عند القبر، من غير تحميل الخبر حكمًا إيمانيًا مسبقًا.
  naturalness: الصياغة فصيحة حديثة وواضحة ومترابطة. «من جماعتنا» طبيعية في السياق وتبيّن المقصود أكثر من ترجمة حرفية قد تكون ملتبسة. إبقاء الفاصلة الختامية مناسب لأن الكلام يتصل بما بعده.
  terminology: «القبر» مناسب لـ μνημεῖον في سياق دفن يسوع. و«أدهشننا» اختيار محايد ودقيق لـ ἐξέστησαν، لا يختزل المعنى في التصديق ولا في الحيرة وحدها. الحواشي تقدم بدائل معجمية مشروعة، وعلاماتها موضوعة في مواضعها.
