  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: ar
  text: أَمَا كَانَ يَنْبَغِي لِلْمَسِيحِ أَنْ يُقَاسِيَ هذِهِ الْآلَامَ وَيَدْخُلَ فِي مَجْدِهِ؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «الممسوح». اللفظة اليونانية Χριστός لقبٌ، وتُترجم هنا «المسيح» في سياق إتمام الأسفار.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  choice: أَمَا
  rationale: تُدخل سؤالًا استنكاريًّا يتوقع جوابًا بالإيجاب، وهي صياغة عربية طبيعية موجزة.
- source_word: ταῦτα
  choice: هذِهِ الْآلَامَ
  rationale: الإشارة تعود في السياق إلى ما كان لا بد أن يعانيه المسيح؛ وإظهار المرجع في العربية أوضح من «هذه الأشياء» من غير أن يضيف معنى غريبًا عن السياق.
- source_word: ἔδει
  choice: كَانَ يَنْبَغِي
  rationale: تحفظ معنى الضرورة المرتبطة بتدبير الله وإتمام الأسفار، من غير أن تحصرها في الإكراه أو تشرحها داخل النص.
- source_word: παθεῖν
  choice: أَنْ يَتَأَلَّمَ
  rationale: مقابل عربي مباشر وطبيعي للفعل، ويلائم الإشارة إلى آلام المسيح.
- source_word: τὸν χριστὸν
  choice: لِلْمَسِيحِ
  rationale: تُرجم اللقب اليوناني بمعناه الكتابي الشائع في العربية، لا بوصفه اسمًا مجردًا.
- source_word: καὶ
  choice: وَ
  rationale: تحفظ العطف البسيط بين فعلي التألم والدخول، من غير إضافة ترتيب زمني صريح.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: وَيَدْخُلَ فِي مَجْدِهِ
  rationale: تحفظ صورة الدخول، وحرف الجر، وضمير الملكية الوارد في اليونانية.
- source_word: δόξαν
  choice: مَجْدِ
  rationale: «المجد» هو المقابل العربي المألوف والدقيق في سياق القيامة والرفعة.
- source_word: αὐτοῦ
  choice: ـهِ
  rationale: نقل مباشر لضمير الغائب مع إبقاء دلالة «مجده» مفتوحة كما في الأصل.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو اللقب العربي الكتابي الراسخ الذي ينقل معنى Χριστός في سياق إتمام الأسفار، بينما «الممسوح» أكثر حرفية وأقل طبيعية هنا.
- issue: قوة ἔδει
  choice: كان ينبغي
  alternative: كان لا بد
  rationale: الصياغة المختارة تعبّر عن الضرورة الإلهية/الكتابية مع الحفاظ على النبرة الاستفهامية، ولا تجعلها مجرد حتمية آلية.
- issue: مرجع αὐτοῦ في «مجده»
  choice: مجده
  alternative: المجد المعد له
  rationale: أُبقي ضمير الملكية كما في اليونانية، بلا تفسير يحدد هل المقصود مجده الذاتي أم المجد الذي يدخل إليه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة. استُخدم «أما كان ينبغي» لسؤال يتوقع الإقرار، و«هذه الآلام» لتوضيح مرجع اسم الإشارة في العربية. ظهرت علامة الحاشية [a] في المتن.
