base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: ar
  text: وحدث أنه حين اتكأ إلى المائدة معهم، أخذ الخبز وباركه، ثم كسره وأخذ يناولهم إياه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة الأخيرة: «وكان يناولهم إياه». فصيغة الفعل اليوناني قد تبرز استمرار المناولة، أما «أخذ يناولهم» فتبرز بدايتها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: وحدث أنه
  rationale: تحافظ العبارة على صيغة لوقا الانتقالية في السرد بلغة عربية فصيحة غير عتيقة.
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: حين اتكأ معهم إلى المائدة
  rationale: البناء ذو معنى زمني، والفعل في سياق الطعام يدل على الاتكاء بحسب عادة تناول الطعام القديمة، لا مجرد الجلوس.
- source_word: λαβὼν τὸν ἄρτον
  choice: أخذ الخبز
  rationale: صيغ اسم الفاعل اليونانية المتتابعة تُنقل بأفعال عربية متسلسلة طبيعية، مع إبقاء التعريف في «الخبز».
- source_word: εὐλόγησεν
  choice: وباركه
  rationale: يحافظ على معنى التلفظ بالبركة على الخبز دون استبداله بفعل الشكر أو إضافة تفسير طقسي.
- source_word: κλάσας
  choice: ثم كسره
  rationale: تفيد صيغة الماضي اليونانية وقوع الكسر قبل المناولة، و«ثم» توضح تتابع الفعلين طبيعيًا.
- source_word: ἐπεδίδου
  choice: وأخذ يناولهم إياه
  rationale: تنقل «أخذ يناول» إمكان الدلالة الابتدائية والاستمرارية في الماضي الناقص اليوناني، مع بقاء بديل «كان يناولهم إياه» ممكنًا.
theological_decisions:
- issue: الإيحاءات الإفخارستية أو الأسرارية المحتملة في أفعال المائدة
  choice: استعمال لغة أفعال المائدة العادية دون تفسير أسراري صريح
  alternative: صياغة تستحضر العشاء الرباني بصورة أقوى
  rationale: تتابع الأخذ والبركة والكسر والمناولة قد يثير صدى مشاهد أخرى، لكن الآية نفسها لا تعرّف الحدث بأنه طقس أسراري؛ لذلك تُحفظ الأفعال من غير توسيع مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «اتكأ إلى المائدة» للحفاظ على الخلفية الثقافية القديمة مع توضيح سياق الطعام داخل المتن، وتُجنبت المصطلحات الطقسية المضافة.
