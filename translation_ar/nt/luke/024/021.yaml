  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: ar
  text: أمّا نحن فكنا نرجو أنه هو الذي سيفدي إسرائيل[b]. لكن، فوق هذا كله، فهذا هو اليوم الثالث منذ أن حدثت هذه الأمور[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كنا نرجو أنه كان هو الذي سيفدي إسرائيل». في اليونانية فعل في المضارع («هو») ضمن مضمون رجائهم الماضي.'
    reason: alternative_reading
  - marker: b
    text: قد يشير «يفدي إسرائيل» بوجه عام إلى الخلاص المسياني المأمول؛ ولا يحدد النص هل المقصود تحرير سياسي أم خلاص روحي أم كلاهما.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: أمّا نحن
  rationale: تنقل إبراز الضمير وقوة المقابلة التي تؤديها δέ في سياق عربي طبيعي.
- source_word: ἠλπίζομεν
  choice: فكنا نرجو
  rationale: صيغة «كنا نرجو» تعبّر عن الرجاء المستمر في الماضي وما يوحي به السياق من خيبة لاحقة.
- source_word: ὅτι αὐτός ἐστιν
  choice: أنه هو
  rationale: الجملة الاسمية العربية تؤدي معنى المضارع اليوناني ἐστιν من غير حاجة إلى فعل رابط ظاهر، وتحافظ على توكيد αὐτός بالضمير «هو».
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: المزمع أن يفدي
  rationale: «المزمع» تنقل معنى التوقع أو القصد المستقبلي في μέλλων، و«يفدي» تحفظ الدلالة الخلاصية والعهدية للفعل λυτρόομαι.
- source_word: τὸν Ἰσραήλ
  choice: إسرائيل
  rationale: ترجمة مباشرة لاسم الشعب بوصفه مفعول الفداء، من غير إضافة تفسيرية.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: لكن فوق هذا كله
  rationale: 'تؤدي الاستدراك والقوة التراكمية للعبارة: ثمة اعتبار محبط آخر يضاف إلى ما سبق.'
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: فهذا هو اليوم الثالث
  rationale: صياغة عربية واضحة للمصطلح اليوناني الدال اصطلاحًا على بلوغ الزمن يومه الثالث.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: منذ حدثت هذه الأمور
  rationale: تحافظ على نقطة ابتداء حساب الزمن وعلى الإشارة العامة إلى الوقائع السابقة.
theological_decisions:
- issue: مدلول «يفدي إسرائيل» في الرجاء المسياني
  choice: الإبقاء على «يفدي إسرائيل» من غير تحديد نوع الفداء
  alternative: يحرر إسرائيل سياسيًا؛ أو يخلّص إسرائيل روحيًا
  rationale: النص يحتمل رجاءً مسيانيًا واسعًا قد يجمع التحرير القومي والخلاص، ولا يحدد هنا وجه الفداء تحديدًا ضيقًا.
- issue: القيمة الزمنية للمضارع ἐστιν بعد الماضي الناقص ἠλπίζομεν
  choice: «كنا نرجو أنه هو المزمع»
  alternative: «كنا نرجو أنه كان هو المزمع»
  rationale: تحافظ الجملة الاسمية بعد «أنه» على المضارع الموجود في اليونانية ضمن مضمون رجائهم الماضي، من غير فرض نقل زمني كامل إلى الماضي.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «المزمع» لما فيها من دقة في نقل معنى μέλλων، مع بقاء العبارة مفهومة في السياق. وُضعت علامتا الحاشيتين عند عبارة الرجاء والفداء اللتين تفسرهما الحاشيتان.
