  source_fidelity: ينقل النص الرجاء الماضي المستمر في ἠλπίζομεν، والتأكيد في αὐτός، والفعل المضارع ἐστιν ضمن مضمون ذلك الرجاء، ومعنى الفداء في λυτροῦσθαι، وحساب اليوم الثالث. لكن تركيب «أنه هو المزمع أن يفدي» أقلّ سلامة وطبيعية في العربية، وقد يوحي بأن «المزمع» وصفٌ لنيّة الشخص أكثر من كونه المخلّص المنتظر.
