  terminology: «يفدي إسرائيل» اختيار دقيق ومحايد لــλυτροῦσθαι، ولا ينبغي تضييقه إلى تحرير سياسي أو خلاص روحي. يُستبقى اسم «إسرائيل» كما هو. الحاشية التفسيرية المتعلقة باتساع مدلول الفداء مناسبة، مع تحسين موضع العلامة بحيث تتصل بالعبارة التي تشرحها.
