  to: 'ثم قال لهم: «هذه هي كلماتي التي قلتها لكم حين كنت لا أزال معكم: لا بد أن يتحقق كل ما كُتب[a] عني[c] في شريعة موسى والأنبياء والمزامير[b]».'
  rationale: 'التعديل محدود وآمن: قُدِّمت «عني» لتتعلق بوضوح بـ«ما كُتب»، واستُبدلت الصياغة الزمنية بتعبير عربي أفصح، واستُعمل «يتحقق» لإبراز معنى الإتمام في سياق المكتوب. وحُفظت الحواشي وعلاماتها مع نقل موضع علامة الحاشية (c) إلى العبارة التي تشرحها مباشرة.'
