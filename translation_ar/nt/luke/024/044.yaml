reference: Luke 24:44
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: ar
  text: 'ثم قال لهم: «هذه هي كلماتي التي قلتها لكم حين كنت لا أزال معكم: لا بد أن يتحقق كل ما كُتب[a] عني[c] في شريعة موسى والأنبياء والمزامير[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جميع الأشياء المكتوبة».'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن عبارة «شريعة موسى والأنبياء والمزامير» تشير إلى الأقسام الكبرى لكتب إسرائيل المقدسة؛ وقد يُقصد بـ«المزامير» سفر المزامير تحديدًا، أو قسم «الكتابات» بمعنى أوسع.
    reason: cultural_note
  - marker: c
    text: 'أو: «بشأني».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: ثم قال لهم
  rationale: تؤدي «ثم» وظيفة δέ بوصفها رابطًا سرديًا خفيفًا، و«قال لهم» ترجمة طبيعية لـ πρὸς αὐτούς بعد فعل القول.
- source_word: Οὗτοι οἱ λόγοι μου
  choice: هذه هي كلماتي
  rationale: تحافظ على الإشارة والتعريف، وتنقل λόγοι بلفظ عربي واضح ومباشر.
- source_word: οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: التي قلتها لكم
  rationale: «قلتُها لكم» أفصح وأطبع في هذا السياق من النقل الحرفي «تكلمت بها إليكم»، مع حفظ معنى فعل الكلام والجملة الموصولة.
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: حين كنت ما أزال معكم
  rationale: تصوغ العبارة الحالية في اليونانية جملة زمنية عربية طبيعية، وتحفظ دلالة ἔτι على الاستمرار.
- source_word: ὅτι δεῖ πληρωθῆναι
  choice: لا بد أن يتم
  rationale: «لا بد» تحفظ قوة الضرورة في δεῖ، و«يتم» تنقل معنى بلوغ المكتوب تمامه وتحققه من غير توسع تفسيري.
- source_word: πάντα τὰ γεγραμμένα
  choice: كل ما كُتب
  rationale: صياغة عربية جامعة وطبيعية تحفظ شمول πάντα وصيغة المكتوب.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: في شريعة موسى والأنبياء والمزامير
  rationale: تُبقي أسماء مجموعات الأسفار كما في المصدر، من غير أن تحسم في المتن هل «المزامير» اسم للسفر نفسه أم دال على قسم أوسع.
- source_word: περὶ ἐμοῦ
  choice: عني
  rationale: مقابل موجز وطبيعي لـ περί مع المضاف إليه، ويحفظ معنى الإشارة إلى ما يختص بيسوع.
theological_decisions:
- issue: قوة ضرورة إتمام المكتوب
  choice: لا بد أن يتم
  alternative: كان ينبغي أن يتم؛ لا بد أن يتحقق
  rationale: تحفظ الصياغة قوة δεῖ والبعد المتعلق بإتمام الكتاب، من غير أن تشرح آلية الإتمام أو تفرض نظرية بعينها للنبوة.
- issue: هوية «شريعة موسى والأنبياء والمزامير»
  choice: إبقاؤها أسماء لمجاميع كتابية مع شرح الاحتمال في الحاشية
  alternative: اعتبار «المزامير» صراحةً اسمًا لقسم «الكتابات» كله؛ أو قصرها صراحةً على سفر المزامير
  rationale: يرجح أن العبارة تشير إلى الأقسام الكبرى لكتب إسرائيل المقدسة، لكن النص لا يحسم مدى دلالة «المزامير»، ولذلك تُحفظ المسألة دون تسوية مذهبية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعملت «شريعة موسى» بدل «ناموس موسى» لوضوحها للقارئ الحديث، مع إبقاء البنية الثلاثية للنص. وُضعت علامات الحواشي بجوار العبارات التي تشرحها.
