source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: ar
  text: 'قائلًا: «لا بُدَّ أن يُسلَّم[a] ابنُ الإنسان إلى أيدي أناسٍ خاطئين، وأن يُصلب، وأن يقوم في اليوم الثالث[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُدفع إلى أيدي أناسٍ خاطئين».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ينهض». والفعل اليوناني بصيغة المعلوم، لا المجهول؛ فقارن: «يُقام».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ اسم الفاعل على الصلة النحوية بعبارة التذكّر في الآية السابقة بدل تحويله إلى فعل مستقل.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة العربية الاصطلاحية المعروفة لهذا اللقب، وتحفظ صلاته بنصوص دانيال واستعماله في الأناجيل.
- source_word: ὅτι δεῖ
  choice: لا بُدَّ أن
  rationale: تعبّر عن الضرورة، بما في ذلك دلالة الضرورة في تدبير الله عند لوقا، لا عن مجرد توقع لما سيحدث.
- source_word: παραδοθῆναι
  choice: يُسلَّم
  rationale: ينقل المبني للمجهول ومعنى التسليم إلى سلطان الآخرين، من غير حصر المعنى في خيانة يهوذا.
- source_word: εἰς χεῖρας
  choice: إلى أيدي
  rationale: يحفظ صورة التعبير اليوناني الدال على الوقوع تحت سلطان أشخاص آخرين، وهو طبيعي في العربية.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: أناسٍ خاطئين
  rationale: يترجم ἀνθρώπων صراحةً ويحفظ وصفهم بالخطيئة. لفظ «أناس» عربي طبيعي، ولا يفرض تخصيصًا جنسيًا لا يلزم من صيغة الجمع اليونانية وحدها.
- source_word: σταυρωθῆναι
  choice: يُصلب
  rationale: اللفظ العربي الدقيق والمألوف للمصدر اليوناني المبني للمجهول.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: في اليوم الثالث
  rationale: صياغة عربية طبيعية ودقيقة لدالّ الزمن في اليونانية، من غير إضافة تفسيرية.
- source_word: ἀναστῆναι
  choice: يقوم
  rationale: يحفظ الصيغة اليونانية الفعلية المعلومة، ولا يحولها إلى مبني للمجهول مثل «يُقام».
theological_decisions:
- issue: دلالة δεῖ في التنبؤ بالآلام
  choice: لا بُدَّ أن، للدلالة على الضرورة
  alternative: سوف، بوصفها مجرد إخبار بالمستقبل
  rationale: يستعمل لوقا δεῖ مرارًا للدلالة على ضرورة مرتبطة بإتمام قصد الله؛ والصياغة المختارة تحفظ هذه الدلالة دون شرح عقائدي زائد.
- issue: صيغة القيامة في ἀναστῆναι
  choice: يقوم، بصيغة المعلوم
  alternative: يُقام، بصيغة المجهول
  rationale: المصدر اليوناني هنا معلوم، فينبغي الحفاظ على ذلك مع عدم إنكار استعمال العهد الجديد للمبني للمجهول في مواضع أخرى.
- issue: تعيين جنس ἀνθρώπων ἁμαρτωλῶν
  choice: أناسٍ خاطئين
  alternative: رجالٍ خاطئين
  rationale: الجمع المذكر في اليونانية قد يكون عامًا نحويًا، والنص نفسه لا يصرح بأن المقصود محصور في الذكور؛ لذا تحفظ الترجمة الإحالة البشرية دون زيادة تخصيص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة. استُعمل «قائلًا» لحفظ اتصال الآية بما قبلها، ووُضعت علامات الحاشيتين في المتن بعد العبارة التي تتصل بها البدائل.
