lexical_decisions:
- source_word: εὗρον
  choice: فوجدن
  rationale: فعل ماضٍ للجمع، وفاعله المفهوم من السياق السابق هو النساء؛ وصيغة جمع المؤنث توضح المرجع الطبيعي في العربية من غير إضافة مضمون جديد.
- source_word: δὲ
  choice: فـ
  rationale: أداة ربط خفيفة تدفع السرد إلى الأمام؛ والفاء هنا طبيعية في العربية وتصل الوصول إلى القبر بما وجدنه عنده، من غير إفادة تضاد قوي.
- source_word: τὸν λίθον
  choice: الحجر
  rationale: يشير في سياق الدفن إلى الحجر الذي كان يغلق القبر، و«الحجر» هو المقابل العربي المباشر والمألوف.
- source_word: ἀποκεκυλισμένον
  choice: قد دُحرج
  rationale: اسم مفعول تام مبني للمجهول يصف الحالة الناتجة عن فعل سابق؛ و«قد دُحرج» يحفظ معنى التدحرج وكون الحجر في حالة الإزاحة عند عثورهن عليه.
- source_word: ἀπὸ τοῦ μνημείου
  choice: عن القبر
  rationale: μνημεῖον هنا قبر، و«عن» تلائم فعل الدحرجة وتفيد إبعاد الحجر عن موضعه عند القبر بعبارة عربية طبيعية.
theological_decisions:
- issue: الفاعل المضمر غير المكرر في الجملة اليونانية
  choice: فوجدن
  alternative: فوجدوا
  rationale: الفعل اليوناني بصيغة الجمع ويحيل إلى النساء المذكورات في الآية السابقة. تتيح العربية بيان جنس الفاعل في صيغة الفعل نفسها، فيُحفظ الترابط السردي بلا إدخال تفسير لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بصياغة سردية كريمة. حُفظت دلالة الحالة الناتجة في الصيغة التامة المبنية للمجهول، ولم يُصرَّح بمن دحرج الحجر لأن النص لا يذكر الفاعل.
