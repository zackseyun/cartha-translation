  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: ar
  text: وبينما كانا يتحدثان ويتناقشان[a]، اقترب يسوع نفسه وكان يسير معهما.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يتجادلان»؛ فقد تدل الكلمة اليونانية على مناقشة أشد.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «اقترب وسار معهما».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ
  choice: وبينما
  rationale: تؤدي الصيغة السردية مع تركيب المصدر المسبوق بـἐν معنى الانتقال إلى الحدث المتزامن؛ و«وبينما» عربية طبيعية واضحة من غير صياغة عتيقة مثل «وحدث أنه».
- source_word: ὁμιλεῖν
  choice: يتحدثان
  rationale: يدل الفعل هنا على الحديث المتبادل، وصيغة المثنى يفرضها رجوع الضمير إلى التلميذين.
- source_word: συζητεῖν
  choice: يتناقشان
  rationale: تحفظ معنى البحث المتبادل الجاد من غير أن تفترض خصومة؛ ويمكن أن يحتمل اللفظ مناقشة أشد، وهو مبيّن في الحاشية.
- source_word: αὐτὸς Ἰησοῦς
  choice: يسوع نفسه
  rationale: تحفظ «نفسه» توكيد الضمير αὐτός الملحق بالاسم.
- source_word: ἐγγίσας
  choice: اقترب
  rationale: ينقل حركة يسوع نحو التلميذين بإيجاز طبيعي، مع بقاء العلاقة الزمنية بالحدث الرئيس.
- source_word: συνεπορεύετο
  choice: صار يسير معهما
  rationale: تعكس «يسير» الاستمرار الذي تفيده صيغة الماضي الناقص، وتفيد «معهما» المصاحبة التي تحملها بادئة συν-؛ أما «صار» فتجعل بدء المصاحبة بعد الاقتراب واضحًا في العربية.
theological_decisions:
- issue: التوكيد السردي لهوية الشخص الذي اقترب
  choice: يسوع نفسه
  alternative: يسوع
  rationale: النص اليوناني يؤكد أن الذي اقترب هو يسوع بعينه؛ وهذا توكيد نحوي وسردي ينبغي حفظه من غير إضافة استنتاج عقائدي.
- issue: طبيعة الحديث بين التلميذين
  choice: يتناقشان
  alternative: يتجادلان
  rationale: يحتمل συζητέω مناقشة قوية أو مجادلة، لكن السياق لا يوجب معنى الخصومة؛ لذلك اختير اللفظ الأوسع وأثبت الاحتمال الأشد في الحاشية.
translation_notes:
  register: العربية فصحى حديثة واضحة وذات نبرة سردية كريمة. استُخدم المثنى اتساقًا مع سياق التلميذين، وحُفظ توكيد «يسوع نفسه» واستمرار فعل المصاحبة. وُضعت علامتا الحاشية في المتن عند اللفظ أو العبارة المعنية.
