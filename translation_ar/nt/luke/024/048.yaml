  text: You are witnesses of these things[a].
translation:
  language: ar
  text: أَنْتُمْ شُهُودٌ عَلَى هذِهِ الأُمُورِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ببساطة: «أنتم شهود على هذه». واسم الإشارة اليوناني يعود إلى الأحداث التي تكلّم عنها يسوع للتو.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: أَنْتُمْ
  rationale: ضمير جمع المخاطبين مذكور صراحةً في اليونانية للتوكيد، وإظهاره في العربية يحفظ هذا التوكيد الطبيعي.
- source_word: ἐστε
  choice: —
  rationale: فعل الكينونة في المضارع لا يُصرَّح به عادةً في الجملة الاسمية العربية، فتؤدي البنية «أنتم شهود» معنى «أنتم تكونون/أنتم» بصورة طبيعية ودقيقة.
- source_word: μάρτυρες
  choice: شُهُودٌ
  rationale: يدل اللفظ هنا على مَن يشهدون بما رأوه وسمعوه، من غير تحميله الدلالة اللاحقة الخاصة بالاستشهاد والموت.
- source_word: τούτων
  choice: عَلَى هذِهِ الأُمُورِ
  rationale: اسم الإشارة في صيغة الجمع المحايد يعود إلى الوقائع التي ذكرها يسوع توًّا. و«على هذه الأمور» تعبير عربي طبيعي عن مضمون الشهادة، مع إبقاء المرجع عامًا كما في الأصل.
theological_decisions:
- issue: دلالة دور التلاميذ بوصفهم μάρτυρες
  choice: يصفهم النص بأنهم شهود يؤدون شهادة بشأن الوقائع المذكورة آنفًا.
  alternative: قد يُفهم اللفظ في ضوء استعمال مسيحي لاحق مرتبط بالاستشهاد والموت.
  rationale: السياق المباشر هو آلام المسيح وقيامته والمناداة بالتوبة لغفران الخطايا؛ لذلك فالمعنى الأساسي هنا هو الشهادة، دون استيراد الدلالة الاصطلاحية اللاحقة.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة وذات نبرة كتابية رصينة. أُبقي ضمير المخاطبين ظاهرًا لحفظ التوكيد، واستُعملت جملة اسمية طبيعية بدل إقحام فعل كينونة غير مألوف في المضارع.
