  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: ar
  text: ليس هو هنا، بل قد أُقيم.[a] تذكَّرن كيف كلَّمكنَّ حين كان لا يزال في الجليل،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بل قد قام». الفعل اليوناني مبني للمجهول، ومعناه الحرفي «قد أُقيم»، غير أنه يمكن التعبير عن حدث القيامة بالعربية بصيغة «قد قام».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: ليس هو هنا
  rationale: أُظهر الضمير «هو» لأن السياق يحيل بوضوح إلى يسوع، ولأن إظهاره طبيعي في العربية، مع نقل ὧδε بالمكان «هنا».
- source_word: ἀλλὰ
  choice: بل
  rationale: 'تفيد «بل» الانتقال التصحيحي المقابل: ليس هنا، بل حدث أمر آخر، وهي أنسب في هذا التركيب العربي من «لكن».'
- source_word: ἠγέρθη
  choice: قد أُقيم
  rationale: يحافظ المبني للمجهول على صيغة الفعل اليوناني وعلى الإيحاء بعمل الله من غير التصريح بالفاعل، وتفيد «قد» تحقق الحدث وأثره القائم.
- source_word: μνήσθητε
  choice: تذكَّرن
  rationale: صيغة أمر مباشرة، وجاء التأنيث جمعًا بحسب المخاطَبات في السياق، وهن النساء المذكورات في الآيات السابقة.
- source_word: ὡς
  choice: كيف
  rationale: تقدّم مضمون التذكّر من جهة الطريقة التي سبق أن كلّمهن بها، وتحافظ على الصياغة اليونانية الطبيعية في العربية.
- source_word: ἐλάλησεν ὑμῖν
  choice: كلَّمكنَّ
  rationale: تنقل فعل الكلام من غير زيادة تفسيرية مثل «أخبركن»، مع بيان المخاطبات بحسب السياق.
- source_word: ἔτι ὢν
  choice: حين كان لا يزال
  rationale: تحويل العبارة الوصفية إلى جملة زمنية عربية طبيعية، مع الحفاظ على معنى ἔτι، أي «لا يزال».
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: في الجليل
  rationale: نقل مكاني مباشر للاسم الجغرافي بصيغته العربية الشائعة.
theological_decisions:
- issue: صياغة فعل القيامة ἠγέρθη
  choice: قد أُقيم
  alternative: قد قام
  rationale: يحافظ الاختيار على المبني للمجهول في اليونانية، ومن ثم على الإيحاء بالعمل الإلهي من غير تسمية الفاعل؛ أما «قد قام» فهي عربية مألوفة وصحيحة دلاليًا، لكنها تحوّل الفعل إلى صيغة لازمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل خطاب جمع المؤنث لأن السياق يحدد المخاطَبات بالنساء، مع أن صيغ الضمائر اليونانية نفسها لا تميّز الجنس هنا. وُضعت علامة الحاشية بعد فعل القيامة الذي تتعلق به.
