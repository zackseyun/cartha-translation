  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: ar
  text: 'فقال لهم: «لماذا أنتم مضطربون، ولماذا تنشأ شكوك[a] في قلوبكم؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أفكار» أو «تساؤلات» أو «استدلالات».'
    reason: بدائل معجمية لكلمة διαλογισμοί، التي قد تدل على نشاط التفكير أو التساؤل، وإن كان السياق هنا يرجح الشكوك.
lexical_decisions:
- source_word: Τί
  choice: لماذا
  rationale: 'تأتي أداة الاستفهام هنا مع خبر وفعل الكينونة للسؤال عن السبب، فالمعنى الطبيعي: «لماذا أنتم مضطربون؟»'
- source_word: τεταραγμένοι
  choice: مضطربون
  rationale: اسم مفعول تام يصف حالتهم الراهنة من الاضطراب الداخلي، و«مضطربون» تنقل المعنى بوضوح ووقار.
- source_word: διαλογισμοὶ
  choice: شكوك
  rationale: للكلمة مجال دلالي يشمل الأفكار والاستدلالات والتساؤلات؛ وفي سياق تردد التلاميذ أمام ظهور يسوع تؤدي «شكوك» المعنى السياقي، مع إثبات البدائل في الحاشية حفظًا للاتساع الدلالي.
- source_word: ἀναβαίνουσιν
  choice: تراود
  rationale: المعنى الحرفي «تصعد»، لكنه استعارة لنشوء نشاط داخلي. والتعبير «تراود قلوبكم شكوك» عربي طبيعي يحافظ على كون هذه الشكوك تتولد في الداخل.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: قلوبكم
  rationale: مع أن «القلب» مفرد في اليونانية مع ضمير جمع ذي دلالة توزيعية، فإن جمعه في العربية أفصح وأوضح عند مخاطبة جماعة.
- source_word: καρδία
  choice: قلب
  rationale: يحفظ المصطلح الكتابي الذي يشمل باطن الإنسان وفكره وموقفه، ولا يضيّق المعنى إلى الذهن وحده.
theological_decisions:
- issue: الدلالة الأنثروبولوجية لكلمة καρδία
  choice: قلوبكم
  alternative: أذهانكم / دواخلكم
  rationale: يحفظ «القلب» التصور الكتابي للإنسان الباطن، بما فيه الفكر والعاطفة والإرادة، من غير اختزاله في وظيفة عقلية محضة.
- issue: مدى دلالة διαλογισμοί
  choice: شكوك
  alternative: أفكار / تساؤلات / استدلالات
  rationale: السياق المباشر يرجح معنى الشك والتردد، لكن الكلمة أوسع في أصلها؛ لذلك ذُكرت البدائل في الحاشية بدل طمس الغموض المعجمي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل التركيب الاسمي «لماذا أنتم مضطربون» ليعكس حالة قائمة، وجاءت «تراود قلوبكم شكوك» بصياغة عربية طبيعية مع الحفاظ على الصورة الداخلية للنص.
