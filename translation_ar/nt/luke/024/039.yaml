  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: ar
  text: انظروا إلى يديَّ وقدميَّ، فإني أنا هو[a]. المسوني[b] وانظروا؛ فالروح[c] لا لحم له ولا عظام، كما ترون أن لي لحمًا وعظامًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فإني أنا نفسي». والعبارة اليونانية مؤكَّدة: «أنا نفسي هو المقصود».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن يفيد الفعل أيضًا: «جسُّوني» أو «تحسَّسوني».'
    reason: lexical_alternative
  - marker: c
    text: 'أو بحسب المعنى السياقي: «الشبح». واللفظ اليوناني هو «روح».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: انظروا / ترون
  rationale: فعل أمر يدعو إلى المعاينة المباشرة؛ وتكراره بصيغ عربية طبيعية يحفظ دعوة يسوع إلى التحقق الحسي.
- source_word: χεῖράς ... πόδας
  choice: يديَّ ... قدميَّ
  rationale: ترجمة مباشرة لأعضاء الجسد المذكورة بوصفها دليلًا على الهوية والحضور الجسدي.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: وتحقَّقوا أني أنا هو
  rationale: يفهم ὅτι هنا على أنه يبين مضمون ما ينبغي إدراكه بالنظر، وتحفظ الصياغة توكيد الهوية في ἐγώ وαὐτός دون تحميل العبارة إيحاءً لاهوتيًا زائدًا.
- source_word: ψηλαφήσατέ
  choice: المسوني
  rationale: ينقل معنى اللمس والفحص باليد بعبارة عربية واضحة ومباشرة.
- source_word: πνεῦμα
  choice: الروح
  rationale: المقابل المعجمي المباشر، مع إبقاء احتمال فهمه في السياق بمعنى كائن روحي أو شبح في الحاشية.
- source_word: σάρκα καὶ ὀστέα
  choice: لحم وعظام
  rationale: يحفظ التعبير الجسدي الملموس الوارد في اليونانية دون تلطيف أو تفسير زائد.
- source_word: θεωρεῖτε
  choice: ترون
  rationale: صياغة عربية طبيعية تنقل المعاينة البصرية التي يحتج بها السياق.
- source_word: ἔχοντα
  choice: أن لي
  rationale: 'تحويل النعت الحالي اليوناني إلى جملة عربية سليمة مع الحفاظ على دلالته: كما ترونني مالكًا لحمًا وعظامًا.'
theological_decisions:
- issue: إثبات حقيقة جسد يسوع بعد القيامة
  choice: الإبقاء صراحة على النظر واللمس و«اللحم والعظام»
  alternative: صياغة تفسيرية تخفف المقابلة بين الجسد والروح
  rationale: النص اليوناني يشدد على التحقق الحسي وعلى الحضور الجسدي الحقيقي، ولذلك تُحفظ عباراته من غير إضافة شرح عقائدي خارج الآية.
- issue: قوة عبارة ἐγώ εἰμι αὐτός
  choice: أني أنا هو
  alternative: أني أنا نفسي
  rationale: الصياغة المختارة تؤكد أن المتكلم هو الشخص نفسه المقصود، فيما تورد الحاشية البديل الذي يُظهر التوكيد بصورة أوضح؛ ولا تُحوَّل العبارة إلى دعوى لاهوتية مستقلة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «تحقَّقوا» لإكمال دلالة النظر على إدراك الهوية وتجنب التركيب العربي المتعثر «انظروا... أني»، مع إبقاء العلاقة النصية ومضمون ὅτι. وُضعت جميع علامات الحواشي في المتن.
