lexical_decisions:
- source_word: λέγοντας
  choice: قائلين
  rationale: اسم فاعل حالي، منصوب مذكر جمع، يرتبط بالفعل في السياق السابق. تحافظ «قائلين» على الصلة النحوية من غير تعيين زائد للفاعل داخل هذه الآية.
- source_word: ὅτι
  choice: علامتا الاقتباس المباشر
  rationale: تقدّم الأداة مضمون القول، وصياغته اقتباسًا مباشرًا طبيعية في العربية وتحفظ المعنى.
- source_word: ὄντως
  choice: حقًّا
  rationale: تؤكد الواقع الفعلي للخبر، و«حقًّا» موجزة وفصيحة وتحمل قوة التوكيد في اليونانية.
- source_word: ἠγέρθη
  choice: أُقيم
  rationale: فعل ماض مبني للمجهول من ἐγείρω. تحفظ «أُقيم» صيغة المبني للمجهول ودلالتها، من غير تحويلها إلى فعل لازم مثل «قام».
- source_word: ὁ κύριος
  choice: الرب
  rationale: لقب للمسيح في هذا السياق، وترجمته «الرب» تحفظ ثقله ودلالته من غير إضعاف.
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل خبر الإقامة بالظهور لسمعان.
- source_word: ὤφθη
  choice: ظهر
  rationale: صيغة ماضية مبنية للمجهول صرفيًّا من ὁράω، لكنها تُستعمل اصطلاحيًّا في روايات الظهور بمعنى «ظهر». وهذه الصياغة عربية طبيعية ولا توحي بأن سمعان هو الذي أظهره.
- source_word: Σίμωνι
  choice: لسمعان
  rationale: اسم علم في حالة المجرور الدالة على المتلقي. يذكر النص «سمعان» وحده، فلا تضاف إليه تسمية «بطرس».
theological_decisions:
- issue: صيغة فعل القيامة
  choice: أُقيم
  alternative: قام
  rationale: اليونانية تستعمل المبني للمجهول ἠγέρθη؛ والإبقاء عليه يصون صياغة النص واحتمال الإشارة الضمنية إلى فاعل غير مذكور، من غير التصريح به.
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: يَرِد اللفظ هنا لقبًا للمسيح في سياق القيامة، و«الرب» تحفظ ثقله المسيحاني المعتاد.
- issue: صيغة فعل الظهور
  choice: ظهر
  alternative: شُوهد
  rationale: مع أن ὤφθη مبني للمجهول من حيث الصيغة، فإنه في هذا الاستعمال يدل اصطلاحيًّا على الظهور لشخص؛ و«ظهر لسمعان» أدق وأطبع عربيًّا من «شُوهد من سمعان».
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ المبني للمجهول في فعل القيامة، مع استعمال التعبير العربي الطبيعي «ظهر لسمعان» لفعل الظهور. وُضع «لقد» مع «حقًّا» لنقل قوة تقرير ὄντως من غير مبالغة تفسيرية.
