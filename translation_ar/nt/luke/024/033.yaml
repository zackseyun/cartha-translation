  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: ar
  text: وفي تلك الساعة عينها قاما ورجعا إلى أورشليم، فوجدا الأحد عشر والذين معهم مجتمعين[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي إنهم كانوا مجتمعين بالفعل حين وجداهم.
    reason: يوضح أن صيغة ἠθροισμένους تصف حالة قائمة عند العثور عليهم، لا فعل اجتماع بدأ بعد ذلك.
lexical_decisions:
- source_word: ἀναστάντες
  choice: قاما
  rationale: اسم فاعل ماضٍ من ἀνίστημι يدل هنا على فعل جسدي سبق الرجوع. استُعمل المثنى لأن الفاعلين هما تلميذا عمواس، وصيغة «قاما» طبيعية وموجزة في العربية.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: في تلك الساعة عينها
  rationale: تنقل العبارة التحديد الزمني والتوكيد معًا، من غير اختزالها في معنى «فورًا» وحده.
- source_word: ὑπέστρεψαν
  choice: رجعا
  rationale: الفعل ὑποστρέφω هنا يفيد العودة إلى مكان سبق أن أتيا منه؛ وصيغة المثنى توافق الفاعلين المعروفين من السياق.
- source_word: Ἰερουσαλήμ
  choice: أورشليم
  rationale: النقل العربي المألوف للاسم الكتابي، مع الحفاظ على كونه اسم مكان منقولًا صوتيًا.
- source_word: εὗρον
  choice: فوجدا
  rationale: ينقل المعنى السردي المعتاد، وتفيد الفاء تعاقب الوصول والعثور من غير إضافة تفسيرية.
- source_word: ἠθροισμένους
  choice: مجتمعين
  rationale: اسم فاعل تام مبني للمجهول يصف الحالة القائمة التي وجدوا عليها الجماعة. «مجتمعين» عربية طبيعية وتشمل الأحد عشر والذين معهم بحسب تركيب الجملة اليونانية.
- source_word: τοὺς ἕνδεκα
  choice: الأحد عشر
  rationale: يحافظ على تسمية المجموعة كما وردت، من غير إضافة «الرسل» أو محاولة تحديد عدد الحاضرين فعليًا.
- source_word: τοὺς σὺν αὐτοῖς
  choice: الذين معهم
  rationale: ترجمة مباشرة وواضحة لا تحدد هوية المرافقين بما يتجاوز النص.
theological_decisions:
- issue: دلالة «الأحد عشر» مع احتمال غياب بعض أفراد المجموعة
  choice: الإبقاء على التسمية الجماعية «الأحد عشر»
  alternative: الرسل الأحد عشر؛ التلاميذ الباقون
  rationale: يستعمل النص اليوناني τοὺς ἕνδεκα بوصفها تسمية معروفة للمجموعة. والإبقاء عليها يمنع إدخال مواءمة أو تحديد لا يصرح به النص.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة وذات نبرة سردية كريمة. استُعمل المثنى في «قاما ورجعا» و«وجدا» وفق سياق التلميذين، ووُضع وصف «مجتمعين» بعد المجموعتين ليشملهما معًا كما في اليونانية.
