  text: But their eyes were kept from recognizing him[a].
translation:
  language: ar
  text: لكن كانت عيونهم تُمنَع من التعرّف إليه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كانت عيونهم محجوزة عن التعرّف إليه» أو «كان يُحال بين عيونهم والتعرّف إليه». ولا يذكر النص اليوناني مَن الذي كان يمنع ذلك.'
    reason: بدائل معجمية توضّح أن الفعل اليوناني مبني للمجهول وأن فاعله غير مذكور.
lexical_decisions:
- source_word: δὲ
  choice: لكن
  rationale: أداة ربط خفيفة تفيد هنا انتقالًا مع شيء من المقابلة بين حضور يسوع وعدم تعرفهما إليه.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: عيونهم
  rationale: يحافظ هذا التعبير الطبيعي في العربية على الصورة الجسدية الملموسة في اليونانية، بدل تجريدها إلى عدم القدرة على الإدراك.
- source_word: ἐκρατοῦντο
  choice: كانت ممسوكة
  rationale: يحافظ المبني للمجهول على معنى الإمساك أو الحجز، ولا يحدد الفاعل الذي تركه النص اليوناني غير مذكور.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: عن أن تعرفه
  rationale: يفيد التركيب المنع من التعرّف أو التحقق من الهوية، لا مجرد المعرفة العامة؛ وصياغة «عن أن تعرفه» تلائم تعدية «ممسوكة» وتحافظ على بنية النتيجة أو الغاية دون حسمها.
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير مفعول به يعود في السياق إلى يسوع.
theological_decisions:
- issue: هل يُصرَّح بمن منع عيونهما من التعرّف؟
  choice: 'إبقاء الفعل مبنيًا للمجهول: «كانت ممسوكة عن أن تعرفه».'
  alternative: التصريح بأن الله منعهما، أو تحويل العبارة إلى «لم يستطيعا أن يعرفاه».
  rationale: لا يذكر النص اليوناني فاعل الإمساك. لذلك يحافظ المبني للمجهول على الغموض المقصود والتوتر اللاهوتي، من غير نسبة الفعل صراحة إلى الله أو اختزاله في عجز ذاتي.
translation_notes:
  register: عربية فصحى واضحة ومهيبة. أُبقيت صورة «العيون» والمبني للمجهول كما في الأصل، مع تجنب تعيين الفاعل. لفظ «ممسوكة» أقرب إلى الصورة اليونانية، وتشرح الحاشية البدائل العربية الأيسر.
