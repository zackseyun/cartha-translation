  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: ar
  text: وفي اليوم الأول من الأسبوع[a]، عند الفجر، باكرًا جدًا، جئن إلى القبر حاملاتٍ الأطياب التي أعددنها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وحرفيًا: «في أول السبوت»، وهو تعبير اصطلاحي يعني اليوم الأول من الأسبوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: ولكن في اليوم الأول من الأسبوع
  rationale: هذا تعبير زمني سامي/يوناني دارج يدل على اليوم الأول من الأسبوع. نقل معناه الاصطلاحي أوضح من الترجمة الحرفية «في أول السبوت»، مع إبقاء البديل الحرفي في الحاشية.
- source_word: ὄρθρου βαθέως
  choice: عند الفجر الباكر جدًا
  rationale: تفيد العبارة وقت الفجر المبكر للغاية؛ وتحافظ «الباكر جدًا» على قوة التعبير اليوناني بلغة عربية طبيعية وواضحة.
- source_word: ἐπὶ τὸ μνῆμα
  choice: إلى القبر
  rationale: مع فعل الحركة تدل ἐπί على الاتجاه نحو الموضع، و«القبر» هي المقابل العربي الطبيعي في سياق الدفن.
- source_word: ἦλθον
  choice: جئن
  rationale: صيغة الجمع المؤنث يستدل عليها من اسم الفاعل المؤنث φέρουσαι ومن سياق النساء المذكورات سابقًا، والفعل يقرر مجيئهن إلى القبر.
- source_word: φέρουσαι
  choice: حاملاتٍ
  rationale: اسم الفاعل يصف فعلًا متزامنًا مع مجيئهن؛ و«حاملات» تنقل بصورة مباشرة أن الأطياب كانت معهن.
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: الأطياب التي أعددنها
  rationale: تشير ἀρώματα إلى مواد عطرية استُخدمت في تجهيز الدفن، و«الأطياب» لفظ عربي مفهوم وملائم للسياق، مع ترتيب العبارة وفق الأسلوب العربي الطبيعي.
theological_decisions:
- issue: الدلالة الزمنية للتعبير τῇ μιᾷ τῶν σαββάτων في سياق القيامة
  choice: في اليوم الأول من الأسبوع
  alternative: في أول السبوت
  rationale: اختير المعنى الاصطلاحي المعتاد للتعبير بدل صياغة حرفية قد توحي بدلالة تقويمية أو مذهبية لا يفرضها النص اليوناني، مع توثيق الحرفية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم جمع المؤنث «جئن/أعددن» اتساقًا مع القرينة النحوية والسياق السابق، وصيغت العبارة الزمنية بأسلوب طبيعي مع الحفاظ على شدة التبكير في ὄρθρου βαθέως.
