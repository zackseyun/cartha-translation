  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: ar
  text: ولمّا لم يجدن جسده، جئن يقلن إنهن رأين أيضًا رؤيا لملائكة، يقولون إنه حيّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز، على وجه أضعف، أن يعود معنى «يقولون» إلى النساء لا إلى الملائكة، فيكون المعنى: «جئن يقلن إنهن رأين أيضًا رؤيا لملائكة، وإنهن يقلن إنه حيّ».'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εὑροῦσαι
  choice: ولمّا لم يجدن
  rationale: اسم فاعل ماضٍ مؤنث جمع منفي، صيغ زمنيًا بأسلوب عربي طبيعي مع إبقاء النفي.
- source_word: τὸ σῶμα αὐτοῦ
  choice: جسده
  rationale: ينقل المعنى العادي المباشر لـσῶμα في سياق الدفن والقيامة.
- source_word: ἦλθον λέγουσαι
  choice: جئن يقلن
  rationale: يحافظ على معنى المجيء وعلى دلالة اسم الفاعل المصاحب له، من غير إضافة معنى الرجوع غير المصرح به لفظًا.
- source_word: καὶ ὀπτασίαν
  choice: أيضًا رؤيا
  rationale: تفيد καί هنا الإضافة إلى خبر عدم وجود الجسد؛ و«أيضًا» عربية واضحة من غير مبالغة في القوة التصاعدية المحتملة.
- source_word: ὀπτασίαν ἀγγέλων
  choice: رؤيا لملائكة
  rationale: «رؤيا» تنقل دلالة المشهد أو الظهور فوق العادي، واللام تبين أن الملائكة هم موضوع الرؤيا.
- source_word: ἑωρακέναι
  choice: رأين
  rationale: المصدر التام واقع في خطاب غير مباشر؛ ويؤدي الماضي العربي المعنى طبيعيًا بعد «يقلن إنهن».
- source_word: οἳ λέγουσιν
  choice: قالوا
  rationale: أعيد الضمير إلى الملائكة، وهم أقرب سابق مذكر جمع. اختير الماضي العربي لينسجم مع نقل خبر الرؤيا، مع أن اليونانية تستعمل المضارع التاريخي/الحالي «يقولون».
- source_word: αὐτὸν ζῆν
  choice: إنه حيّ
  rationale: صياغة عربية طبيعية للمصدر في الخطاب غير المباشر، وتحفظ تقرير كونه حيًا دون توسع تفسيري.
theological_decisions:
- issue: مرجع اسم الموصول οἳ في οἳ λέγουσιν
  choice: 'يعود إلى الملائكة: «ملائكة، قالوا إنه حيّ»'
  alternative: 'يمكن نحويًا على وجه أضعف ربط القول بالنساء: «جئن يقلن... ويقلن إنه حيّ»'
  rationale: الملائكة هم السابق الأقرب، كما أن صيغة المذكر الجمع توافقهم، لكن البديل محفوظ في الحاشية لعدم إخفاء الاحتمال التركيبي.
- issue: زمن λέγουσιν
  choice: «قالوا»
  alternative: «يقولون»
  rationale: المضارع اليوناني محفوظ دلاليًا بوصفه مضمون الرسالة، لكن الماضي أفصح في العربية عند سرد ما نطق به الملائكة في الرؤيا؛ ولا يغير مضمون إعلان الحياة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل جمع المؤنث في «يجدن، جئن، يقلن، رأين» لإبراز أن الفاعل هو النساء، وحُفظ الاحتمال النحوي الأضعف في حاشية واحدة.
