  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: ar
  text: ورجعن من القبر، وأخبرن الأحد عشر وجميع الباقين بكل هذه الأمور.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: ورجعن
  rationale: صيغة الجمع المؤنث تُظهر أن الفاعل هو النساء المذكورات في السياق السابق، وتحافظ على معنى الرجوع بصياغة عربية طبيعية. وعُطف الفعل على الفعل الرئيس بدل محاكاة اسم الفاعل اليوناني حرفيًا.
- source_word: μνημείου
  choice: القبر
  rationale: «القبر» هو المقابل العربي الواضح والدقيق لموضع دفن يسوع في سياق القيامة.
- source_word: ἀπήγγειλαν
  choice: أخبرن
  rationale: ينقل معنى إبلاغ الآخرين بما حدث، ويلائم السرد دون أن يوحي بإعلان عام أو رسمي أكثر مما يقتضيه السياق.
- source_word: ταῦτα πάντα
  choice: بهذه الأمور كلها
  rationale: يحفظ اسم الإشارة وقوة الشمول في πάντα، وهو تعبير عربي واضح وطبيعي.
- source_word: τοῖς ἕνδεκα
  choice: الأحد عشر
  rationale: يحافظ على التسمية الواردة في اليونانية دون إضافة «الرسل»، وهي غير مذكورة صراحة في الآية.
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: سائر الآخرين
  rationale: يعبّر عن جميع من بقوا خارج مجموعة الأحد عشر، ويحافظ على التمييز بين المجموعتين.
theological_decisions:
- issue: مرجع الفاعل المؤنث الجمع
  choice: استعمال «رجعن» و«أخبرن» للدلالة على النساء الآتيات إلى القبر
  alternative: إضافة الاسم الصريح «النساء»
  rationale: الصيغ اليونانية مؤنثة جمعًا، والسياق السابق يحدد المرجع. يبيّن التصريف العربي جنس الفاعل وعدده من غير إضافة اسم غير وارد في نص الآية.
- issue: تسمية جماعة الرسل
  choice: الأحد عشر
  alternative: الرسل الأحد عشر
  rationale: النص اليوناني يقول «الأحد عشر» فقط؛ لذلك لا تُضاف تسمية تفسيرية، مع بقاء المرجع مفهومًا من السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم العطف بين الفعلين لأن تحويل المشاركة الظرفية اليونانية إلى فعل معطوف هو الأسلوب العربي الطبيعي، مع إبراز التأنيث والجمع في التصريف.
