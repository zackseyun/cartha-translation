    reason: إثبات البديل الحرفي للاستفهام Τί ولحرف الجر μετά، مع بيان المعنى السياقي من غير إخفاء بنية الأصل المحتملة.
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: استولى عليهنّ الخوف
  rationale: ينقل نشوء حالة الخوف وشدتها بصياغة عربية طبيعية، ويحافظ على كون العبارة ظرفًا مصاحبًا يسبق الفعل الرئيس.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: أحنين وجوههنّ إلى الأرض
  rationale: يحافظ على الصورة الحسية لانحناء الوجوه نحو الأرض، مع صياغة عربية واضحة تدل على حركة فعلية ناشئة عن الخوف أو التوقير.
- source_word: εἶπαν πρὸς αὐτάς
  choice: قالا لهنّ
  rationale: الفاعل في السياق هو الرجلان المذكوران في العدد السابق، ولذلك استُعمل المثنى العربي؛ والضمير المؤنث الجمع يحافظ على الإحالة إلى النساء.
- source_word: Τί ζητεῖτε
  choice: لماذا تطلبن
  rationale: تؤدي «لماذا» الوظيفة الاستفهامية المقصودة في السياق، إذ ينكر السؤال ملاءمة البحث، مع التنبيه في الحاشية إلى الصياغة الأقرب إلى الحرفية.
- source_word: τὸν ζῶντα
  choice: الحيّ
  rationale: صفة معرفة مستعملة استعمال الاسم، مفردة ومذكرة، فتحافظ على الإشارة الشخصية إلى يسوع بوصفه حيًا دون إضافة تفسير غير وارد في النص.
- source_word: μετὰ τῶν νεκρῶν
  choice: بين الأموات
  rationale: هي العبارة العربية الطبيعية في هذا السياق، وتبرز المقابلة بين الحي والأموات؛ أما «مع الأموات» فهي أقرب إلى البنية اللفظية اليونانية وقد ذُكرت في الحاشية.
theological_decisions:
- issue: دلالة القيامة في τὸν ζῶντα
  choice: الحيّ
  alternative: مَن هو حيّ
  rationale: تحافظ «الحيّ» على صيغة المفرد الشخصية وعلى المقابلة اللاهوتية مع الأموات، من غير أن تضيف تصريحًا تفسيريًا بالقيامة ليس واردًا في هذه العبارة نفسها.
- issue: عدد فاعل εἶπαν
  choice: قالا
  alternative: قالوا
  rationale: صيغة الجمع اليونانية تحيل في السياق المباشر إلى الرجلين المذكورين في لوقا 24:4. يقتضي النحو العربي استعمال المثنى، من غير تغيير هوية المتكلمين أو إضافة أسمائهم.
