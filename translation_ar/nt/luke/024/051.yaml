  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: ar
  text: وفيما كان يباركهم، فارقهم، وكان يُرفَع إلى السماء[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تحذف بعض المخطوطات عبارة «وكان يُرفَع إلى السماء».
