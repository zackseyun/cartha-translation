lexical_decisions:
- source_word: ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτούς
  choice: وبينما كان يباركهم
  rationale: تؤدي «بينما» معنى التزامن في تركيب ἐν مع المصدر المعرّف، أما ἐγένετο فهي صيغة لوقا السردية لوقوع الحدث، ولا يلزم نقلها بعبارة مستقلة ثقيلة في العربية.
- source_word: εὐλογεῖν
  choice: يباركهم
  rationale: ترجمة مباشرة وطبيعية للفعل، وتحافظ على استمرار الفعل وقت الانفصال.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: انفصل عنهم
  rationale: ينقل معنى المفارقة والانفصال المكاني من غير أن يضيف كيفية لم يذكرها النص.
- source_word: ἀνεφέρετο
  choice: كان يُرفَع
  rationale: يحافظ على الصيغة الناقصة المبنية للمجهول، فيفيد أن الرفع كان جارياً من غير تعيين الفاعل.
- source_word: εἰς τὸν οὐρανόν
  choice: إلى السماء
  rationale: «السماء» هي الدلالة السياقية المناسبة هنا، و«إلى» عربية طبيعية مع فعل الرفع وتؤدي اتجاه الحركة.
theological_decisions:
- issue: العبارة المختلف في ثبوتها καὶ ἀνεφέρετο εἰς τὸν οὐρανόν
  choice: إثباتها في المتن مع حاشية تبين الاختلاف النصي
  alternative: حذف عبارة «وكان يُرفَع إلى السماء»
  rationale: يثبتها النص المقدم بين معقوفين للدلالة على عدم اليقين النصي؛ لذا تُترجم في المتن مع توثيق الحذف في بعض المخطوطات، من غير حسم صامت للخلاف.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. وُضع رمز الحاشية عند موضع بدء العبارة المختلف في ثبوتها، كي يتضح أن الحاشية تخص ما يلي الرمز.
