  rationale: 'تُحافظ المراجعة على تسلسل اليونانية: البدء بموسى وجميع الأنبياء، ثم تفسير ما يتعلق بيسوع في جميع الأسفار. واستُبدلت «ما يختص به» بـ«الأمور المتعلقة به» لتأدية العبارة اليونانية الواسعة بوضوح عربي طبيعي، مع نقل علامتي الحاشية إلى موضعيهما الصحيحين.'
