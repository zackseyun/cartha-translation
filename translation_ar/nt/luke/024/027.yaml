base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: ar
  text: وبدءًا من موسى وجميع الأنبياء[b]، فسّر[a] لهما في جميع الأسفار المقدسة الأمور المتعلقة به.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شرح» أو «بيَّن»؛ فالفعل اليوناني قد يدل على التفسير المفصل.'
    reason: lexical_alternative
  - marker: b
    text: تشير عبارة «موسى وجميع الأنبياء» إلى الأسفار المرتبطة بموسى وإلى كتب الأنبياء.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ Μωϋσέως
  choice: وابتدأ من موسى
  rationale: يحافظ على صورة نقطة البدء التي تعبّر عنها ἀπό، ويفهم «موسى» في السياق على أنه يشير إلى الأسفار المرتبطة به.
- source_word: πάντων τῶν προφητῶν
  choice: جميع الأنبياء
  rationale: ينقل الشمول في πάντων، ويشير في هذا السياق إلى القسم النبوي من الأسفار، من غير إثقال المتن بتفسير إضافي.
- source_word: διερμήνευσεν
  choice: فسَّر
  rationale: الفعل يدل على البيان والتفسير المفصل؛ و«فسَّر» لفظ عربي طبيعي يحفظ المعنى التفسيري.
- source_word: αὐτοῖς
  choice: لهما
  rationale: الضمير يعود في سياق الرواية إلى تلميذي عمواس، والمثنى العربي أدق من الجمع في هذا الموضع.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: في جميع الأسفار المقدسة
  rationale: γραφή هنا تدل على الكتابات المقدسة؛ و«الأسفار المقدسة» تعبير عربي واضح يحفظ الجمع والصفة الاستغراقية.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: ما يختص به
  rationale: ينقل الإشارة الواسعة إلى الأمور المتعلقة بيسوع من غير حصرها في نبوات صريحة أو فئة تفسيرية واحدة.
theological_decisions:
- issue: نطاق تفسير يسوع للأسفار
  choice: تقرر الآية أنه فسّر عبر الأسفار ما يختص به، من غير تحديد ذلك في نوع تفسيري واحد
  alternative: قصر المعنى على النبوات المسيانية المباشرة، أو القول إن كل مقطع على حدة يتحدث عنه مباشرة
  rationale: العبارة اليونانية واسعة، لكنها لا تفصّل طبيعة كل صلة ولا تستلزم أن كل نص منفرد يشير إليه مباشرة؛ لذلك تُحفظ السعة والتوتر من غير إضافة مذهبية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المثنى «لهما» وفق سياق تلميذي عمواس، ووُضعت علامتا الحاشيتين بعد العبارة ذات الصلة مع الحفاظ على ظهورهما في المتن.
