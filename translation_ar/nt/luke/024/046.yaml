  source_fidelity: 'النص العربي أمين للأصل اليوناني: يحفظ صيغة القول، والصيغة الكتابية الدالة على ما هو ثابت مكتوب، ومضمون ὅτι، والمصدرين «أن يتألم» و«أن يقوم»، وفاعلية فعل القيامة، وعبارة «من بين الأموات»، والتحديد الزمني «في اليوم الثالث». ولا يضيف معنى الوجوب غير المصرح به في هذه العبارة.'
