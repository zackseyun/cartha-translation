  terminology: «المسيح» المقابل العربي الراسخ للقب τὸν χριστόν، و«يقوم من بين الأموات» يحافظان على المصطلح والمعنى دون فرض تفسير مذهبي. لا تحتاج العربية إلى حاشية تمييزية بين Messiah وChrist، ولا تتطلب «من بين الأموات» حاشية لأنها صياغة سليمة ومفهومة.
