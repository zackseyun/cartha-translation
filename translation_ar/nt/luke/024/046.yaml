  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: ar
  text: 'وقال لهم: «هكذا هو مكتوب: أن يتألم المسيح، وأن يقوم من بين الأموات في اليوم الثالث».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: هو مكتوب
  rationale: صيغة التام المبني للمجهول تُستعمل هنا بوصفها عبارة كتابية تدل على ما كُتب وما يزال ثابتًا في الكتاب؛ و«هو مكتوب» تعبير عربي واضح يحفظ هذه الدلالة.
- source_word: παθεῖν
  choice: أن يتألم
  rationale: المصدر يبيّن مضمون المكتوب. تحافظ الصياغة على بنية المصدر من غير إضافة معنى الوجوب، إذ لا توجد في العبارة أداة صريحة تدل عليه.
- source_word: τὸν χριστόν
  choice: المسيح
  rationale: اللفظة لقب معرف هنا، و«المسيح» مقابل عربي راسخ يحفظ خلفيتها الكتابية بوصفه الممسوح المنتظر، من غير تحويل اللقب إلى اسم مجرد.
- source_word: ἀναστῆναι
  choice: أن يقوم
  rationale: الفعل مصدر ماضٍ معلوم ويُستعمل هنا استعمالًا لازمًا؛ لذلك تحافظ «أن يقوم» على صيغة المعلوم ولا تستبدلها بصيغة «أن يُقام» المبنية للمجهول.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: تحفظ العبارة دلالة ἐκ الحرفية، أي الخروج من وسط الأموات، وهي سليمة وطبيعية في العربية في سياق القيامة.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: في اليوم الثالث
  rationale: الداتيف ذو دلالة زمنية، و«في اليوم الثالث» هو التعبير العربي الطبيعي الموافق له.
- source_word: οὕτως
  choice: هكذا
  rationale: تحفظ «هكذا» الصلة بين الصيغة التمهيدية ومضمون ما هو مكتوب، مع نبرة كتابية واضحة.
- source_word: ὅτι
  choice: ':'
  rationale: يُفهم مضمون القول والمكتوب بوضوح من خلال النقطتين ثم المصدر المؤول بـ«أن»، من غير إثقال العبارة بتكرار أداة تفسيرية.
theological_decisions:
- issue: دلالة Χριστός في خلاصة الآلام والقيامة
  choice: المسيح
  alternative: الممسوح
  rationale: تؤدي «المسيح» معنى اللقب في العربية وتحفظ خلفيته الملكية والكتابية، بينما «الممسوح» حرفية مفرطة وغير مألوفة كلقب في هذا السياق.
- issue: صيغة فعل القيامة ἀναστῆναι
  choice: أن يقوم من بين الأموات
  alternative: أن يُقام من بين الأموات
  rationale: الأصل اليوناني معلوم لا مبني للمجهول. يحفظ النص ذلك من غير إنكار المواضع الأخرى التي تنسب إقامة يسوع إلى الله.
- issue: العلاقة بين المكتوب وآلام المسيح
  choice: أن يتألم
  alternative: أنه كان لا بد أن يتألم
  rationale: يفيد المصدر مضمون المكتوب، لكنه لا يتضمن في هذا الموضع لفظًا صريحًا للوجوب؛ لذلك لم تُضف عبارة «كان لا بد».
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعملت «من بين الأموات» لأنها دقيقة وطبيعية، فلم تلزم حاشية لبديل أكثر حرفية. ولم تُنقل الحاشية الإنجليزية الخاصة بالفرق بين Messiah وChrist لأن العربية تستعمل «المسيح» مقابلاً راسخًا لكليهما، وإقحام تمييز غير قائم في العربية سيُربك القارئ بدل أن يوضح الأصل.
