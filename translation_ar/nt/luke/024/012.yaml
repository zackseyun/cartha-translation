source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: ar
  text: أما بطرس فقام وركض إلى القبر؛ وانحنى متطلعًا إلى الداخل، فرأى أقمشة الكتان وحدها. ثم مضى وهو يتعجب في نفسه[أ] مما حدث.
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'حرفيًا: «إلى نفسه». وقد يُفهم التعبير أيضًا بمعنى أنه عاد إلى مكانه؛ والعبارة اليونانية تحتمل ذلك.'
    reason: يحفظ الغموض الدلالي في πρὸς ἑαυτόν بدل تحويله في المتن إلى «إلى بيته».
lexical_decisions:
- source_word: μνημεῖον
  choice: القبر
  rationale: المقصود موضع الدفن، و«القبر» تعبير عربي طبيعي وواضح في هذا السياق.
- source_word: παρακύψας
  choice: انحنى لينظر
  rationale: ينقل فعل الانحناء إلى الأمام بغرض النظر داخل القبر.
- source_word: τὰ ὀθόνια
  choice: أكفان الكتان
  rationale: يشير إلى قطع القماش الكتانية المستعملة في التكفين، وهذه الصياغة أوضح من «الكتان» وحده.
- source_word: μόνα
  choice: وحدها
  rationale: يحافظ على التشديد بأن الأكفان كانت موجودة وحدها، من دون الجسد.
- source_word: πρὸς αὑτόν
  choice: إلى بيته
  rationale: يُفهم التعبير اصطلاحيًا على أنه الرجوع إلى موضعه أو بيته، وهو الأنسب بالعربية في سياق الانصراف.
- source_word: θαυμάζων
  choice: متعجبًا
  rationale: ينقل الدهشة والحيرة إزاء الحدث من غير إضافة حكم إيماني غير مصرح به.
theological_decisions:
- issue: التحول إلى المضارع التاريخي في βλέπει
  choice: فرأى
  alternative: فيرى
  rationale: استُخدم الماضي الطبيعي في السرد العربي مع الحفاظ على تسلسل الحدث؛ المضارع اليوناني هنا مضارع تاريخي لا يلزم نسخه حرفيًا.
- issue: دلالة πρὸς αὑτόν
  choice: إلى بيته
  alternative: وهو في نفسه / إلى نفسه
  rationale: البديل الحرفي غامض وغير طبيعي بالعربية، بينما الاستعمال اليوناني يسمح بمعنى الرجوع إلى موضعه؛ لا يغيّر ذلك الموقف اللاهوتي لبطرس.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة، بإيقاع سردي طبيعي. لا توجد علامات حواشٍ لأن النص لا يحتاج إلى حاشية لازمة للنشر.
