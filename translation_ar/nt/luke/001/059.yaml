  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: ar
  text: وحدث في اليوم الثامن أنهم جاءوا ليختنوا الطفل، وأخذوا يسمّونه زكريا[a]، على اسم أبيه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكانوا يسمّونه زكريا». قد تدل صيغة الفعل اليوناني على تسمية جارية أو مقترحة لم تكتمل، وهو ما يلائم التصحيح الوارد في الآية التالية.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «كانوا يسمّونه باسم أبيه، زكريا»، في إشارة إلى عادة إطلاق اسم أحد أفراد الأسرة على الطفل.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: وحدث
  rationale: صيغة لوقا السردية الشائعة لافتتاح حدث جديد؛ وتحافظ «وحدث» على وظيفتها من غير تكلّف.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: في اليوم الثامن
  rationale: تعبير زمني عربي طبيعي يحفظ التوقيت المحدد في اليونانية.
- source_word: ἦλθον
  choice: جاءوا
  rationale: الفعل اليوناني يترك الفاعل جمعًا مستترًا، فحُفظ عدم تعيين الجماعة.
- source_word: περιτεμεῖν
  choice: ليختنوا
  rationale: المصدر اليوناني يفيد الغرض، واللام مع المضارع تنقل هذا المعنى مباشرة.
- source_word: τὸ παιδίον
  choice: الطفل
  rationale: مقابل واضح وطبيعي لـ παιδίον ويلائم السياق.
- source_word: ἐκάλουν
  choice: أخذوا يسمّونه
  rationale: ينقل صيغة الماضي الناقص بوصفها فعلًا جاريًا أو شروعًا في التسمية، بما ينسجم مع اعتراض الأم في الآية التالية، من غير الجزم بأن التسمية اكتملت.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: على اسم
  rationale: تعبير عربي مألوف يدل على تسمية شخص تيمّنًا أو اقتداءً باسم شخص آخر.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: أبيه
  rationale: صياغة عربية موجزة وطبيعية للملكية.
- source_word: Ζαχαρίαν
  choice: زكريا
  rationale: الصيغة العربية الكتابية المألوفة للاسم.
