  text: For no word from God will be impossible[a].
translation:
  language: ar
  text: لأنه لن تكون أي كلمة من الله مستحيلة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنه لا شيء مستحيل لدى الله».'
    reason: قراءة بديلة معتبرة نحويًا وتفسيريًا لعبارة παρὰ τοῦ θεοῦ πᾶν ῥῆμα.
lexical_decisions:
- source_word: ὅτι
  choice: لأنه
  rationale: تؤدي الأداة هنا معنى التعليل، إذ تبيّن أساس قول الملاك السابق، و«لأنه» عربية طبيعية واضحة.
- source_word: οὐκ ἀδυνατήσει
  choice: لن تستحيل
  rationale: تنقل صيغة المستقبل المنفية ومعنى عدم الإمكان مباشرة، مع موافقة «كلمة» في التأنيث.
- source_word: παρὰ τοῦ θεοῦ
  choice: على الله
  rationale: مع ἀδυνατέω يمكن أن تدل العبارة على ما لا يستحيل لدى الله أو عليه؛ وهذه الصياغة تحفظ صلة «الكلمة» بالله دون حسمها صراحةً بوصفها كلمة صادرة منه.
- source_word: πᾶν
  choice: أي
  rationale: 'في سياق النفي، تنقل «أي» القوة الشمولية لـπᾶν بأسلوب عربي طبيعي: لن تستحيل أي كلمة.'
- source_word: ῥῆμα
  choice: كلمة
  rationale: تحفظ اللفظ الصريح في اليونانية وصلته بالقول الإلهي في السياق، بدل توسيعه إلى «شيء» أو تضييقه إلى «وعد».
theological_decisions:
- issue: دلالة παρὰ τοῦ θεοῦ πᾶν ῥῆμα
  choice: لن تستحيل على الله أي كلمة.
  alternative: لأنه لا شيء يستحيل على الله.
  rationale: يثبت النص اليوناني لفظ ῥῆμα، ولذلك يحفظ المتن معنى «كلمة»، مع إبقاء القراءة التقليدية الأوسع في الحاشية حتى لا يُمحى التوتر الدلالي بين الكلمة الإلهية وقدرة الله المطلقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير ترتيب طبيعي، مع الحفاظ على «كلمة» الظاهرة في الأصل وإيراد الصياغة التقليدية في الحاشية.
