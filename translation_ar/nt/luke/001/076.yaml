id: LUK.1.76
reference: Luke 1:76
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: ar
  text: وأنت أيضًا، أيها الطفل، ستُدعى نبيَّ العلي، لأنك ستتقدَّم أمام الرب[a] لتُعِدَّ طرقه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في حضرة الرب». يمكن للعبارة أن تدل على التقدُّم أمام شخص أو على الخدمة في حضرته.'
    reason: lexical_alternative
  - marker: b
    text: تردد هذه العبارة صدى الوعود النبوية عن إعداد الطريق أمام الرب (قارن إشعياء 40:3؛ ملاخي 3:1). وفي سرد لوقا يتحقق ذلك في خدمة يوحنا السابقة ليسوع.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: وأنت أيضًا
  rationale: ينقل الانتقال في الكلام مع توكيد المخاطَب، ويحفظ الدلالة الإضافية بعبارة عربية طبيعية.
- source_word: παιδίον
  choice: أيها الطفل
  rationale: نداء موجَّه إلى يوحنا وهو رضيع؛ و«الطفل» واضحة ولا تضيف تحديدًا عمريًا لا يقتضيه اللفظ.
- source_word: προφήτης
  choice: نبيّ
  rationale: المقابل العربي المألوف والدقيق للمصطلح.
- source_word: Ὑψίστου
  choice: العلي
  rationale: لقب إلهي جليل شائع في العربية الكتابية، مع الحفاظ على علاقة الإضافة في «نبي العلي».
- source_word: κληθήσῃ
  choice: ستُدعى
  rationale: يحفظ صيغة المستقبل المبني للمجهول، ويفيد التسمية أو الاعتراف بالصفة.
- source_word: προπορεύσῃ
  choice: ستتقدَّم
  rationale: يدل الفعل على السير في المقدمة أو السبق، ويلائم دور السابق الذي يهيئ الطريق.
- source_word: ἐνώπιον κυρίου
  choice: أمام الرب
  rationale: يحفظ إمكان الدلالة على التقدُّم أمام شخص، مع بقاء معنى الحضور لديه ممكنًا؛ كما لا يحسم هوية مرجع «الرب» داخل سطر الترجمة.
- source_word: ἑτοιμάσαι
  choice: لتُعِدَّ
  rationale: لام التعليل مع الفعل تنقل غرض التقدُّم بصورة موجزة وطبيعية.
- source_word: ὁδοὺς αὐτοῦ
  choice: طرقه
  rationale: يحفظ الجمع الوارد في اليونانية وصدى لغة النبوات عن تهيئة طرق الرب.
theological_decisions:
- issue: مرجع لقب «الرب» في نبوة السابق
  choice: إبقاء «الرب» من غير تضييق المرجع في نص الآية
  alternative: تحديده صراحة بأنه الله بحسب خلفية إشعياء وملاخي، أو بأنه يسوع بحسب تحقق الكلام في سرد لوقا
  rationale: الصياغة تستدعي وعود العهد القديم عن إعداد الطريق أمام الرب، بينما يعرض لوقا خدمة يوحنا بوصفها سابقة لخدمة يسوع. إبقاء اللقب كما هو يصون هذا التوتر اللاهوتي ولا يحسمه تفسيرًا داخل الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وجليلة. استُخدم «أيها الطفل» لسلامة النداء، و«نبي العلي» للإيجاز الطبيعي، وحُفظ جمع «طرقه» وصدى الأسلوب النبوي. وُضع هامش البديل المعجمي عند «أمام الرب» حيث يتصل فعليًا بالعبارة.
