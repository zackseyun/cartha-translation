  text: καὶ ἔσται χαρά σοι καὶ ἀγαλλίασις, καὶ πολλοὶ ἐπὶ τῇ ⸀γενέσει αὐτοῦ χαρήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: ar
  text: وسيكون لك فرح وابتهاج، وسيفرح كثيرون عند ولادته[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسبب ولادته». يمكن للعبارة اليونانية أن تدل على مناسبة الفرح أو سببه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: سيكون
  rationale: صيغة مستقبل من «يكون»، وقد صيغت بالعربية صياغة طبيعية تدل على ما سيحدث.
- source_word: χαρά
  choice: فرح
  rationale: المقابل العربي الواضح والمألوف لمعنى الفرح والسرور.
- source_word: σοι
  choice: لك
  rationale: تؤدي دلالة المجرور اليوناني على الشخص الذي سيكون له الفرح.
- source_word: ἀγαλλίασις
  choice: ابتهاج
  rationale: يحفظ لفظًا متميزًا عن «فرح» ويعبر عن سرور قوي احتفالي.
- source_word: πολλοὶ
  choice: كثيرون
  rationale: ينقل الصفة المستعملة اسميًا بإيجاز ووضوح.
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: عند ولادته
  rationale: ينقل المعنى الزمني أو الظرفي الطبيعي للعبارة، مع إبقاء احتمال دلالتها على سبب الفرح في الحاشية.
- source_word: χαρήσονται
  choice: سيفرح
  rationale: ينقل المستقبل ويحافظ على الصلة اللفظية مع «فرح» في صدر الآية.
