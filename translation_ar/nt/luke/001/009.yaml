    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: بحسب عادة الخدمة الكهنوتية
  rationale: ينقل معنى الالتزام بالعرف المتبع في ممارسة الوظيفة الكهنوتية، مع الحفاظ على دلالة ἱερατεία بوصفها خدمة أو وظيفة كهنوتية لا مجرد جماعة الكهنة.
- source_word: ἔλαχε
  choice: وقعت عليه القرعة
  rationale: تعبير عربي طبيعي يصرّح بوسيلة الاختيار التي يدل عليها الفعل λαγχάνω، من غير تحويلها إلى تعيين إداري عام.
- source_word: τοῦ θυμιᾶσαι
  choice: ليُبخِّر
  rationale: ينقل الفعل الخاص بإحراق البخور أو تقديمه، وتؤدي اللام معنى مضمون ما آل إليه بالقرعة وغايته.
- source_word: εἰσελθὼν εἰς
  choice: فدخل إلى
  rationale: يحافظ على دخول زكريا إلى المكان من أجل التبخير، ويصوغ علاقة اسم الفاعل اليوناني بالسياق صياغة عربية سلسة من دون تحميلها تحديدًا زمنيًا زائدًا.
- source_word: τὸν ναὸν τοῦ κυρίου
  choice: مَقدِس الرب
  rationale: ναός في سياق تقديم البخور يدل على مبنى المقدس الداخلي، لا مجمل ساحات الهيكل؛ و«مَقدِس الرب» أدق هنا من «هيكل الرب» مع بقاء البديل المألوف في الحاشية.
theological_decisions:
- issue: مدلول ναός في سياق العبادة في الهيكل
  choice: مَقدِس الرب
  alternative: هيكل الرب
  rationale: دخول زكريا لتقديم البخور يرجّح أن المقصود هو المقدس داخل مجمّع الهيكل، ولذلك اختير اللفظ الأدق في المتن، مع توثيق البديل الأوسع والأكثر شيوعًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «مَقدِس» للدقة المكانية، و«وقعت عليه القرعة» لبيان طريقة الاختيار بصياغة مألوفة.
