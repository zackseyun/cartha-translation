source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: ar
  text: 'فأجابها الملاك: «الروح القدس يحلّ عليكِ، وقدرة العليّ تظلّلكِ؛ لذلك فالذي سيولد قدوسٌ[a]، وسيُدعى ابن الله[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فالقدوس الذي سيولد». تحتمل العبارة اليونانية أن تكون «قدوس» خبرًا عن الذي سيولد أو وصفًا له.'
    reason: syntactic_ambiguity
  - marker: b
    text: وردت «ابن» في اليونانية بلا أداة تعريف، لكن العبارة في هذا السياق تؤدي وظيفة اللقب، ولا تعني «ابنًا من أبناء الله».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: فأجابها الملاك
  rationale: ينقل التركيب اليوناني الاصطلاحي الدال على الجواب بصياغة عربية طبيعية موجزة، من غير تكرار «أجاب وقال».
- source_word: Πνεῦμα ἅγιον
  choice: الروح القدس
  rationale: الإشارة في السياق إلى روح الله بوصفه الفاعل الإلهي، وهذه هي الصياغة العربية الواضحة والمألوفة.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: يحلّ عليكِ
  rationale: يحفظ معنى المجيء على مريم بفعل إلهي، وهو تعبير عربي كتابي طبيعي لا يضيف تفسيرًا آليًا أو جسديًا.
- source_word: δύναμις Ὑψίστου
  choice: قدرة العليّ
  rationale: ينقل الإضافة مباشرة ويحفظ «العليّ» لقبًا إلهيًا.
- source_word: ἐπισκιάσει σοι
  choice: تظلّلكِ
  rationale: يحفظ صورة الظل والحضور الإلهي في الفعل اليوناني، من غير إدخال إيحاءات جسدية لا يتضمنها النص.
- source_word: διὸ καὶ
  choice: لذلك فـ
  rationale: ينقل النتيجة التي يدل عليها διό، بينما تؤدي الفاء وظيفة الربط والتوكيد بصورة عربية طبيعية؛ ولا يلزم نقل καί بكلمة «أيضًا» إذا أثقلت العبارة أو أوهمت إضافة غير واضحة.
- source_word: τὸ γεννώμενον ἅγιον
  choice: الذي سيولد قدوسٌ
  rationale: يعامل ἅγιον خبرًا للمولود، وهو تحليل نحوي معتبر يحفظ توتر العبارة بدل تحويلها حتمًا إلى لقب «القدوس المولود». صيغة المستقبل العربية طبيعية في سياق البشارة.
- source_word: κληθήσεται
  choice: سيُدعى
  rationale: يحفظ المبني للمجهول واتساع معنى καλέω بين التسمية والإقرار بالهوية.
- source_word: υἱὸς θεοῦ
  choice: ابن الله
  rationale: العبارة لقب في السياق، ولا تستلزم نكرة بسبب غياب أداة التعريف اليونانية. العربية لا تحتاج إلى أداة تعريف مستقلة في هذا التركيب الإضافي.
theological_decisions:
- issue: طبيعة الإشارة في Πνεῦμα ἅγιον
  choice: الروح القدس
  alternative: روحٌ مقدسة
  rationale: السياق يعرض روح الله فاعلًا إلهيًا في الحبل، فلا تُختزل العبارة في قوة مجردة أو صفة بشرية، من غير توسع عقائدي يتجاوز النص.
- issue: العلاقة النحوية في τὸ γεννώμενον ἅγιον
  choice: الذي سيولد قدوسٌ
  alternative: القدوس الذي سيولد
  rationale: 'يجوز فهم ἅγιον خبرًا للمولود أو وصفًا له. اختيرت الصياغة الخبرية لأنها قريبة من ترتيب اليونانية وتحفظ إمكان أن يكون المعنى: «المولود سيكون قدوسًا»، مع إثبات البديل في الحاشية.'
- issue: قوة التعريف في υἱὸς θεοῦ
  choice: ابن الله
  alternative: ابنٌ لله
  rationale: غياب أداة التعريف في اليونانية لا يجعل التعبير نكرة بالضرورة؛ ففي سياق البشارة يؤدي وظيفة لقب وهوية. الإضافة العربية «ابن الله» تنقل ذلك طبيعيًا من غير إدخال أداة غير متاحة في العربية قبل المضاف.
- issue: صورة الفعل الإلهي في ἐπισκιάσει
  choice: تظلّلكِ
  alternative: تغشاكِ
  rationale: تحفظ الصياغة صورة الظل والحضور الإلهي، وتتجنب أي شرح بيولوجي أو جنسي لا يقدمه النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم خطاب المؤنث بعلامة ظاهرة عند الحاجة، وحُفظت الاستعارة الإلهية في «تظلّلكِ». وُضعت علامتا الحاشية في المتن وطابقتا محتوى الحاشيتين، لا ترتيب الحواشي الإنجليزية المقدم الذي بدا غير متوافق مع مواضع علاماته.
