lexical_decisions:
- source_word: ἔδοξε
  choice: رأيتُ ... أن
  rationale: ينقل التعبير حكمًا مدروسًا وقرارًا واعيًا، مع الحفاظ على الأسلوب الرسمي للمقدمة.
- source_word: κἀμοὶ
  choice: أنا أيضًا
  rationale: يُظهر انضمام الكاتب إلى من سبقوه في تدوين الروايات، ويحافظ على الصلة بالسياق السابق.
- source_word: παρηκολουθηκότι
  choice: إذ تتبعتُ
  rationale: يحافظ على المعنى المباشر للفعل، الذي قد يدل على التتبع الدقيق أو التحقيق؛ وتوضح الحاشية البديل الممكن.
- source_word: ἄνωθεν
  choice: منذ البداية
  rationale: هذا هو المعنى الأنسب في سياق المقدمة التاريخية، إذ يشير إلى تتبع الأمور من منشئها.
- source_word: πᾶσιν
  choice: كلَّ شيء
  rationale: صياغة عربية طبيعية تشمل جميع الأمور أو الأحداث المشار إليها في السياق.
- source_word: ἀκριβῶς
  choice: بدقة
  rationale: ينقل معنى العناية والضبط اللذين يتضمنهما الظرف اليوناني.
- source_word: καθεξῆς
  choice: بتسلسل منظَّم
  rationale: يحفظ دلالة التتابع والترتيب من غير أن يفرض بالضرورة تسلسلًا زمنيًا صارمًا.
- source_word: σοι γράψαι
  choice: أن أكتب إليك
  rationale: ترجمة مباشرة وطبيعية للفعل مع متلقي الكتابة في حالة المجرور اليونانية.
- source_word: κράτιστε
  choice: يا صاحب السعادة
  rationale: صيغة خطاب تكريمية رسمية ملائمة للقب الذي يُستعمل في لوقا وأعمال الرسل عند مخاطبة ذوي المكانة.
- source_word: Θεόφιλε
  choice: ثاوفيلس
  rationale: نقل صوتي عربي شائع للاسم الشخصي اليوناني.
theological_decisions:
- issue: دلالة καθεξῆς وعلاقتها بالترتيب التاريخي
  choice: بتسلسل منظَّم
  alternative: 'بالترتيب؛ أو: وفق تسلسل زمني'
  rationale: قد تشير الكلمة إلى تتابع أو إلى ترتيب أدبي منظم، لكن النص لا يوجب فهمها ادعاءً بترتيب زمني صارم لكل التفاصيل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رسمية تليق بمقدمة أدبية وتاريخية. استُعملت صيغة تكريمية مفهومة للقارئ المعاصر، وحُفظ الغموض المشروع في معنى التتبع وطبيعة الترتيب بواسطة الحاشيتين.
