  text: Καὶ εἶπεν Μαριάμ· Μεγαλύνει ἡ ψυχή μου τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: ar
  text: 'وقالت مريم: «تُعَظِّم نفسي الربَّ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تُعلن نفسي عظمة الرب».'
    reason: بديل معجمي يوضح أن التعظيم هنا هو إعلان عظمة الرب والإشادة بها.
lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: أداة عطف بسيطة تحفظ تتابع السرد اليوناني من غير إضافة دلالة زمنية غير مصرَّح بها.
- source_word: εἶπεν
  choice: قالت
  rationale: الصيغة العربية الطبيعية للفعل السردي، مع تأنيثه لموافقة مريم.
- source_word: Μαριάμ
  choice: مريم
  rationale: الصيغة العربية الكتابية الراسخة للاسم.
- source_word: Μεγαλύνει
  choice: تُعَظِّم
  rationale: تحفظ المضارع والصورة الشعرية للفعل، الذي يفيد الإشادة بعظمة الرب وإعلانها، لا جعله أعظم في ذاته.
- source_word: ἡ ψυχή μου
  choice: نفسي
  rationale: تحفظ التعبير الشعري والأنثروبولوجي في الأصل، بدل اختزاله إلى الضمير «أنا» أو تفسيره بعبارة أضيق.
- source_word: τὸν κύριον
  choice: الربَّ
  rationale: لقب إلهي توقيري يوافق سياق التسبيح وأصداء لغة الأسفار المقدسة، وهو أنسب من «السيد» هنا.
theological_decisions:
- issue: ترجمة κύριος
  choice: الربَّ
  alternative: السيد
  rationale: السياق ترنيمي موجَّه إلى الله، و«الرب» يحفظ الثقل الكتابي واللاهوتي للقب، بينما «السيد» أضيق دلالة في هذا الموضع.
- issue: التعبير الأنثروبولوجي ἡ ψυχή μου
  choice: نفسي
  alternative: أنا / كياني الداخلي
  rationale: تحفظ «نفسي» الصياغة الشعرية المقصودة من غير فرض تحليل فلسفي لطبيعة الإنسان أو تسطيح التعبير إلى مجرد ضمير.
- issue: دلالة μεγαλύνει
  choice: تُعَظِّم
  alternative: تعلن عظمة / تمجِّد
  rationale: تحافظ الصياغة المختارة على الاستعارة الأصلية وعلى توترها الدلالي؛ والمقصود في سياق التسبيح الإقرار بعظمة الرب والإشادة بها، لا زيادة عظمته.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة شعرية كتابية. استُعمل ترتيب «تُعَظِّم نفسي الربَّ» حفاظًا على بروز الفعل في مطلع الترنيمة، مع ضبط المفعول به منعًا للالتباس.
