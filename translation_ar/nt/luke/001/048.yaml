  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: ar
  text: لأنه نظر إلى ضَعَة أَمَتِه[a]؛ فها منذ الآن ستَعُدُّني جميع الأجيال مباركة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خادمته» أو «جاريته». واللفظ اليوناني مؤنث «عبد»، ويؤكد الخضوع والانتماء.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «ستطوّبني». أي ستعلن أنني مباركة أو تعدّني كذلك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: نظر إلى
  rationale: يحفظ معنى توجيه النظر والاعتناء بالشخص، ويلائم سياق تسبيح مريم من غير إضافة صريحة لا يحملها اللفظ.
- source_word: ταπείνωσιν
  choice: ضَعَة
  rationale: تدل هنا على دنو المكانة والحال المتواضعة، لا على فضيلة التواضع الباطنية وحدها؛ كما تبقي احتمال معنى المذلة حاضرًا.
- source_word: δούλης
  choice: أَمَتِه
  rationale: «أَمَة» هي المؤنث الصريح لـ«عبد»، وتحفظ معنى الخضوع والانتماء الذي في اللفظ اليوناني وفي ضمير الملكية، من غير تلطيفه إلى مجرد خدمة طوعية.
- source_word: ἰδοὺ
  choice: فها
  rationale: أداة تنبيه عربية موجزة وطبيعية تحافظ على القوة الإشارية والتوكيدية في الأسلوب الشعري.
- source_word: ἀπὸ τοῦ νῦν
  choice: منذ الآن
  rationale: تنقل بوضوح ابتداء الأمر من اللحظة الحاضرة وامتداده إلى المستقبل.
- source_word: μακαριοῦσίν με
  choice: ستَعُدُّني ... مباركة
  rationale: يعبّر عن إعلان مريم أو اعتبارها مباركة، وهو أوضح للقارئ المعاصر من الاقتصار على الفعل التراثي «تطوّبني».
- source_word: πᾶσαι αἱ γενεαί
  choice: جميع الأجيال
  rationale: يحفظ شمول العبارة وإشارتها إلى الأجيال المتعاقبة، من غير إضافة كلمة «الآتية» التي يفهمها السياق الزمني.
theological_decisions:
- issue: وصف مريم لنفسها بلفظ δούλη
  choice: أَمَتِه
  alternative: خادمته أو جاريته
  rationale: يحفظ النص لغة العبودية والانتماء لله من غير أن يستخلص منها ادعاءً مريميًا لاحقًا؛ وتُذكر البدائل الألين في الحاشية.
- issue: دلالة ταπείνωσις في نشيد مريم
  choice: ضَعَة
  alternative: حال وضيعة أو مذلة
  rationale: يشير السياق أساسًا إلى انخفاض حال مريم ومكانتها، لا إلى تواضعها النفسي وحده، مع بقاء احتمال المذلة اللغوي.
- issue: دلالة μακαρίζω
  choice: ستَعُدُّني ... مباركة
  alternative: ستطوّبني
  rationale: تُفهم العبارة على أنها إقرار الأجيال ببركتها، لا أنها مصدر البركة أو العبادة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة شعرية موقرة. ضُبطت «ضَعَة» و«أَمَتِه» و«ستَعُدُّني» جزئيًا منعًا للالتباس، واستُعملت «فها» بدل «هوذا» لسلامة الأسلوب المعاصر مع إبقاء قوة التنبيه.
