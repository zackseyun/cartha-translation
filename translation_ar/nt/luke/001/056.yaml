  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: ar
  text: ومكثت مريم معها نحو ثلاثة أشهر، ثم رجعت إلى بيتها.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔμεινεν
  choice: مكثت
  rationale: يفيد الفعل البقاء في مكان مدة من الزمن، و«مكثت» تعبير عربي فصيح وطبيعي يلائم السياق السردي.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد من غير إفادة تعارض قوي؛ والواو تؤدي هذا الدور طبيعيًا في العربية.
- source_word: Μαριὰμ
  choice: مريم
  rationale: الصيغة العربية المألوفة للاسم في الكتاب المقدس.
- source_word: σὺν αὐτῇ
  choice: معها
  rationale: تنقل معنى المصاحبة بوضوح، ويُفهم من السياق أن الضمير يعود إلى أليصابات.
- source_word: ὡς μῆνας τρεῖς
  choice: نحو ثلاثة أشهر
  rationale: تدل ὡς مع المقدار الزمني هنا على التقريب، و«نحو» تحافظ على ذلك بإيجاز وفصاحة.
- source_word: ὑπέστρεψεν
  choice: رجعت
  rationale: يعني الفعل العودة إلى مكان سابق، و«رجعت» طبيعية في السرد العربي.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: إلى بيتها
  rationale: السياق يدل على مكان السكن، و«بيتها» تنقل الدلالة المكانية والشخصية من غير تحويل المعنى إلى أهل البيت.
