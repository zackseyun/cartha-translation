source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: ar
  text: ولمّا اكتملت أيام خدمته[a]، مضى إلى بيته[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود بـ«خدمته» مدة عمل زكريا الكهنوتي المعيَّن في الهيكل.
    reason: cultural_note
  - marker: b
    text: 'يمكن أن تُترجم أيضًا: «إلى منزله». فاللفظ اليوناني قد يشير إلى البيت نفسه أو، بمعنى أوسع، إلى المنزل وأهل البيت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: لم تُترجم بلفظ مستقل
  rationale: هي صيغة سردية شائعة عند لوقا، ويؤدي تركيب «ولمّا...» وظيفتها طبيعيًا في العربية من غير حشو مثل «وحدث أنه».
- source_word: ὡς
  choice: لمّا
  rationale: تُدخل جملة زمنية، و«لمّا» تفيد هنا وقوع الذهاب عند اكتمال مدة الخدمة.
- source_word: ἐπλήσθησαν
  choice: اكتملت
  rationale: تدل على بلوغ الأيام المعيّنة تمامها، و«اكتملت» واضحة وطبيعية.
- source_word: λειτουργίας
  choice: خدمته
  rationale: تحافظ على اللفظ الموجز، بينما يوضح السياق والحاشية أنها خدمة زكريا الكهنوتية في الهيكل.
- source_word: ἀπῆλθεν
  choice: مضى
  rationale: فعل عربي فصيح طبيعي يدل على الانصراف والذهاب، من غير مبالغة في الرسمية.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: إلى بيته
  rationale: «بيت» يقابل οἶκος ويمكن أن يدل على المسكن، مع إمكان امتداد الدلالة إلى المنزل أو أهل البيت بحسب السياق.
theological_decisions: []
