source:
  edition: SBLGNT
  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: ar
  text: ولم يكن لهما ولد، لأن أليصابات كانت عاقرًا، وكانا كلاهما قد تقدّما في السنّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «كانا قد تقدّما في أيامهما».'
    reason: بيان الصورة الحرفية للتعبير اليوناني الذي يعني التقدّم في السن.
lexical_decisions:
- source_word: τέκνον
  choice: ولد
  rationale: المفرد «ولد» ينقل دلالة اللفظة اليونانية على طفل واحد من غير تحويلها إلى جمع، وهو تعبير عربي طبيعي يشمل الذكر والأنثى في هذا السياق.
- source_word: καθότι
  choice: لأن
  rationale: تُدخل الأداة اليونانية سبب عدم وجود ولد لهما، و«لأن» أوضح رابط سببي في العربية المعاصرة.
- source_word: στεῖρα
  choice: عاقرًا
  rationale: تصف اللفظة عدم القدرة على الإنجاب، لا مجرد واقع عدم وجود أولاد؛ و«عاقر» موجزة ودقيقة ومألوفة في العربية الفصيحة.
- source_word: ἀμφότεροι
  choice: كلاهما
  rationale: تحافظ على التشديد بأن الوصف ينطبق على زكريا وأليصابات معًا.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: قد تقدّما في السنّ
  rationale: هذا هو المقابل العربي الطبيعي والمحترم للتعبير الاصطلاحي الذي يفيد أنهما كانا كبيرين في السن، مع إبقاء صورة الأصل الحرفية في الحاشية.
- source_word: οὐκ ἦν αὐτοῖς
  choice: لم يكن لهما
  rationale: يحافظ على البنية الوجودية/الملكية في اليونانية، وهو تعبير عربي فصيح وطبيعي.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «ولد» للمفرد المحايد سياقيًا، و«عاقرًا» للتمييز بين سبب العقم ونتيجة عدم وجود ولد، ووُضعت علامة الحاشية بعد العبارة التي تشرحها.
