  text: καὶ πᾶν τὸ πλῆθος ἦν τοῦ λαοῦ προσευχόμενον ἔξω τῇ ὥρᾳ τοῦ θυμιάματος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: ar
  text: وكان جمهور الشعب كله يصلّي في الخارج وقت تقديم البخور[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وقت إحراق البخور».'
    reason: بديل معجمي يبرز الفعل الشعائري الذي يدل عليه السياق.
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: جمهور الشعب كله
  rationale: ينقل معنى الجماعة الكبيرة المجتمعة مع توكيد شمولها، بصياغة عربية طبيعية تتجنب ثقل «كل جمهور».
- source_word: τοῦ λαοῦ
  choice: الشعب
  rationale: يحافظ على اللفظ العام في النص من غير إضافة «إسرائيل»، وإن كان سياق الهيكل يوحي بشعب العهد.
- source_word: προσευχόμενον
  choice: يصلّي
  rationale: مع «كان» يفيد فعلًا مستمرًا جارياً في ذلك الوقت، من غير إضافة أنهم كانوا يصلّون معًا.
- source_word: ἔξω
  choice: في الخارج
  rationale: ينقل المعنى المكاني كما هو، من غير تحديد «خارج المقدس» الذي لا يصرح به النص اليوناني.
- source_word: τῇ ὥρᾳ
  choice: وقت
  rationale: يدل هنا على الموعد المحدد للشعيرة، و«وقت» أفصح وأطبع في العربية ضمن هذا التركيب من «ساعة».
- source_word: τοῦ θυμιάματος
  choice: تقديم البخور
  rationale: يبين الاستعمال الشعائري للبخور في سياق الهيكل، مع بقاء الحاشية على البديل الأقرب إلى معنى الإحراق.
theological_decisions:
- issue: المصطلح الشعائري في θυμίαμα
  choice: تقديم البخور
  alternative: إحراق البخور
  rationale: يحفظ سياق العبادة الكهنوتية في الهيكل من غير تحميل العبارة دعوى عقائدية لاحقة، بينما يبيّن البديل الفعل الطقسي بصورة أصرح.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. روعي تقديم الفعل واستعمال «جمهور الشعب كله» لنقل الجمعية والتوكيد بصورة طبيعية، مع إبقاء «في الخارج» غير مقيّدة بما لم يصرح به الأصل.
