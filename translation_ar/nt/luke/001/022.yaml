base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: ar
  text: ولمّا خرج، لم يستطع أن يكلّمهم، فأدركوا أنه رأى رؤيا في المقدس[a]. وظلّ يومئ لهم، وبقي أبكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في الهيكل». غير أن اللفظة اليونانية هنا تدل على نحو أخص على المقدس نفسه، لا على مجمّع الهيكل كله.
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تدل اللفظة اليونانية على من لا يستطيع الكلام، وقد تفيد الصمم أيضًا في بعض السياقات.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ولمّا خرج
  rationale: حُوِّل اسم الفاعل الماضي إلى جملة زمنية طبيعية تفيد أن الخروج سبق تعذّر الكلام.
- source_word: οὐκ ἐδύνατο λαλῆσαι
  choice: لم يستطع أن يكلّمهم
  rationale: يحفظ معنى العجز الصريح في δύναμαι مع المصدر، كما يحفظ وجود المفعول «لهم» في النص اليوناني.
- source_word: ἐπέγνωσαν
  choice: فأدركوا
  rationale: يفيد وصولهم إلى معرفة واضحة استنادًا إلى ما شاهدوه، وهو أنسب للسياق من ترجمة حرفية مثل «تعرّفوا».
- source_word: ὀπτασίαν
  choice: رؤيا
  rationale: تعبّر بوضوح عن مشاهدة ذات طابع فوق طبيعي أو إعلاني في هذا السياق.
- source_word: ἐν τῷ ναῷ
  choice: في المَقدِس
  rationale: لفظة ναός تشير هنا على نحو أخص إلى موضع المقدس نفسه، لا إلى مجمّع الهيكل كله.
- source_word: διανεύων
  choice: ظلّ يشير إليهم
  rationale: تركيب ἦν مع اسم الفاعل يفيد الاستمرار؛ و«ظلّ يشير» صياغة عربية طبيعية تحفظ هذا الامتداد.
- source_word: διέμενεν
  choice: بقي
  rationale: ينقل استمرار الحالة الذي يدل عليه الفعل في صيغة الماضي الناقص.
- source_word: κωφός
  choice: أبكم
  rationale: ينقل هنا حالة عدم القدرة على الكلام بإيجاز، مع إبقاء احتمال دلالة اللفظة على الصمم في الحاشية.
theological_decisions:
- issue: دلالة κωφός في وصف حالة زكريا
  choice: ترجمة الوصف في المتن بما يدل على البكم، دون التصريح بالصمم
  alternative: أصم وأبكم؛ أو عاجز عن الكلام
  rationale: السياق المباشر يصرّح بتعذّر الكلام ويذكر الإشارة، لكنه لا يحسم في هذه الآية وحدها أن الوصف يشمل الصمم. لذلك لا يُضاف الصمم إلى المتن، وتُحفظ السعة الدلالية في الحاشية.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة ووقورة. استُعمل «المَقدِس» للتمييز بين الحرم الداخلي ومجمّع الهيكل، و«ظلّ يشير» لإبراز استمرار الفعل. وُضعت علامتا الحاشيتين عند اللفظتين اللتين تتعلق بهما الملاحظتان، تجنبًا لالتباس موضعهما.
