  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: ar
  text: «هكذا صنع الرب بي في الأيام التي نظر فيها إليَّ، ليرفع عاري بين الناس»[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مذلتي»، أو: «ما كان الناس يعيّرونني به». تشير الكلمة اليونانية إلى العار أو المهانة في نظر المجتمع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: محذوفة لفظًا ومفهومة بوصفها أداة إدخال للقول الداخلي
  rationale: يمكن أن تؤدي ὅτι هنا وظيفة إدخال مضمون ما قالته أليصابات، ولا يلزم نقلها بـ«لأن» في العربية عند بدء الاقتباس المستقل؛ فهذا أجزل وأوضح في السياق.
- source_word: Οὕτως μοι πεποίηκεν κύριος
  choice: هكذا صنع الرب بي
  rationale: يحفظ التركيب معنى الكيفية المؤكد في Οὕτως، وينقل الداتيف μοι مع ποιέω بتعبير عربي طبيعي وقريب من الأصل.
- source_word: ἐν ἡμέραις αἷς
  choice: في الأيام التي
  rationale: نقل قريب للبناء الزمني النسبي، مع وضوحه في العربية المعاصرة.
- source_word: ἐπεῖδεν
  choice: نظر فيها إليَّ
  rationale: يحفظ صورة النظر المقترن بالالتفات والعناية، ويُصرّح بالمفعول المفهوم من السياق.
- source_word: ἀφελεῖν
  choice: ليرفع
  rationale: اللام مع المضارع تنقل دلالة الغاية أو النتيجة في المصدر، و«يرفع» تعبير عربي طبيعي عن إزالة العار.
- source_word: ὄνειδός μου
  choice: عاري
  rationale: «العار» يعبّر بوضوح عن المذمة والمهانة الاجتماعية المقصودة، لا عن مجرد شعور داخلي بالخجل.
- source_word: ἐν ἀνθρώποις
  choice: بين الناس
  rationale: ينقل المجال الاجتماعي للعار بصياغة عربية طبيعية وشاملة.
theological_decisions:
- issue: مرجع κύριος
  choice: الرب، في إشارة إلى الله
  alternative: لا بديل رئيسيًا في السياق
  rationale: السياق يتناول فعل الله في إزالة عقم أليصابات وما ترتب عليه اجتماعيًا، من غير فرض قراءة مسيانية أضيق على هذا الموضع.
- issue: الدلالة الاجتماعية لكلمة ὄνειδος
  choice: عاري
  alternative: مذلتي؛ ما كان الناس يعيّرونني به
  rationale: يحافظ «العار» على بُعد المهانة الاجتماعية، مع تجنب حصر المعنى في الإحساس النفسي بالخجل.
- issue: دلالة ἀφελεῖν بعد ἐπεῖδεν
  choice: ليرفع
  alternative: فرفع
  rationale: تحفظ اللام إمكان فهم المصدر على الغاية أو النتيجة بدل حسم العلاقة على أنها نتيجة فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «صنع الرب بي» لقربه من الأصل وطبيعته العربية، و«عاري بين الناس» لإبراز البعد الاجتماعي. أُثبتت علامة الحاشية [a] بعد الآية.
