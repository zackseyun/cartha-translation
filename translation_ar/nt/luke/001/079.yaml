  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: ar
  text: ليشرق على الجالسين في الظلمة وظلّ الموت[a]، وليهدِ أقدامنا إلى طريق السلام.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ظلمة عميقة»؛ لكن اللفظ اليوناني يذكر «الموت» صراحة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: ليشرق على
  rationale: يحفظ صورة النور المنبثق على من في الظلمة، وتؤدي اللام معنى الغرض الذي يحمله المصدر في السياق.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: الجالسين في الظلمة
  rationale: ترجمة مباشرة وطبيعية تحفظ صورة الجلوس وصداها الكتابي، من غير تحويلها إلى «الساكنين» أو تفسيرها مجازيًا.
- source_word: σκιᾷ θανάτου
  choice: ظلال الموت
  rationale: يحفظ ذكر الموت الصريح والصورة الشعرية. وجاء الجمع «ظلال» لأن التعبير العربي المألوف «ظلال الموت» أفصح وأطبع من «ظل الموت» في هذا السياق، مع بقاء الحاشية للتنبيه إلى البديل.
- source_word: τοῦ κατευθῦναι
  choice: ويهدي
  rationale: ينقل معنى التوجيه والإرشاد في تركيب عربي طبيعي مع «أقدامنا»، وتحمل الواو مع صيغة المضارع الغرض الموازي للمصدر السابق.
- source_word: τοὺς πόδας ἡμῶν
  choice: أقدامنا
  rationale: يحفظ الاستعارة الجسدية الواضحة ولا يختزلها إلى «إيانا».
- source_word: εἰς ὁδὸν εἰρήνης
  choice: إلى طريق السلام
  rationale: يحفظ استعارة الطريق والإضافة الوصفية من غير تفسير السلام على أنه نتيجة الطريق أو حصر معناه.
theological_decisions:
- issue: هل تُفسَّر صور الظلمة والموت والأقدام والطريق في المتن؟
  choice: 'الإبقاء على الصور كما هي: الظلمة، وظلال الموت، والأقدام، وطريق السلام.'
  alternative: شرحها بأنها جهل روحي أو خطر الموت أو سلوك أخلاقي يقود إلى السلام.
  rationale: النص شعري وتلميحي، وتفسير الصور في المتن يحسم دلالات يتركها الأصل متوترة ومتعددة الأبعاد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة شعرية رصينة. حُفظ التوازي بين الإشراق والهداية، واستُعمل «الجالسين» و«أقدامنا» و«طريق السلام» لصون الصور الأصلية دون شرح زائد.
