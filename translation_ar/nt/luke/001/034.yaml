base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: ar
  text: 'لكن مريم قالت للملاك: «كيف يكون هذا، وأنا لا أعرف رجلًا[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي، بتعبير أوضح: «لم أُقِم علاقةً جنسيةً مع رجل». فعبارة «أعرف رجلًا» في اليونانية تعبير محتشم يشير إلى المعاشرة الجنسية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا مع تباين خفيف بين إعلان الملاك وسؤال مريم، من غير مبالغة في قوة الاعتراض.
- source_word: Μαριὰμ
  choice: مريم
  rationale: الصيغة العربية المعيارية الراسخة للاسم.
- source_word: πρὸς τὸν ἄγγελον
  choice: للملاك
  rationale: السياق يحدد أن المقصود كائن سماوي، لذلك «الملاك» أدق من «الرسول» أو «المرسَل» هنا.
- source_word: Πῶς ἔσται τοῦτο
  choice: كيف يكون هذا
  rationale: يحافظ على بساطة التركيب اليوناني وعلى السؤال عن كيفية تحقق ما أُعلن.
- source_word: ἐπεὶ
  choice: وَ
  rationale: 'صيغت الجملة العربية في تركيب حالي طبيعي: «وأنا لا أعرف رجلًا»، وهو يؤدي معنى التعليل الذي تحمله ἐπεὶ من غير إثقال العبارة بـ«بما أنني».'
- source_word: ἄνδρα
  choice: رجلًا
  rationale: يحافظ على الدلالة العامة لـἀνήρ هنا ولا يضيّقها إلى «زوج»، مع أن السياق يتصل بالعلاقة الجنسية.
- source_word: οὐ γινώσκω
  choice: لا أعرف
  rationale: يحافظ على التعبير الكنائي المتواضع في الأصل بصيغة المضارع، وتوضح الحاشية أن المقصود عدم إقامة علاقة جنسية.
theological_decisions:
- issue: قول مريم وعلاقته بالحبل بيسوع
  choice: الإبقاء على التعبير الكنائي الحرفي «لا أعرف رجلًا» في المتن مع شرحه في الحاشية
  alternative: «لم أقم علاقةً برجل» أو «أنا عذراء»
  rationale: الأصل لا يستعمل لفظ «عذراء» في هذه الجملة، بل تعبير «لا أعرف رجلًا» الدال في السياق على عدم المعاشرة الجنسية. إبقاؤه يصون صياغة النص وما فيها من احتشام، من غير إضافة تفسير عقائدي إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت صياغة طبيعية للسؤال، مع الحفاظ على الكناية الأصلية وشرح معناها للقارئ المعاصر في الحاشية.
