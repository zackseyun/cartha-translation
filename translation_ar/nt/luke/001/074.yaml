    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: بلا خوف
  rationale: ينقل معنى الحال «من دون خوف» بعبارة عربية طبيعية، مع إبقاء إمكان فهمها بمعنى «غير خائفين».
- source_word: ἐκ χειρὸς
  choice: من يد
  rationale: يحافظ على الصورة الكتابية الدالة اصطلاحًا على السلطان أو القبضة، وهي مفهومة في العربية.
- source_word: ἐχθρῶν
  choice: أعدائنا
  rationale: لا يرد ضمير الملكية صراحة في اليونانية، لكن سياق النشيد وصيغة المتكلم الجمع في الكلام يبينان أن المقصود أعداء الشعب المتكلم باسمه.
- source_word: ῥυσθέντας
  choice: بعد أن أُنقذنا
  rationale: يعبر عن اسم الفاعل الماضي المبني للمجهول بوصف الإنقاذ سابقًا للخدمة وممهّدًا لها.
- source_word: λατρεύειν
  choice: نخدمه
  rationale: الفعل يدل على خدمة مقدسة موجّهة إلى الله، وقد يشمل العبادة؛ و«نخدمه» يبقي المجال الدلالي أوسع من الشعائر وحدها.
- source_word: αὐτῷ
  choice: ـه
  rationale: الضمير يعود إلى الله بحسب السياق، واتصاله بالفعل هو الأسلوب العربي الطبيعي.
theological_decisions:
- issue: مدى دلالة λατρεύειν في الخدمة المقدمة لله
  choice: نخدمه
  alternative: نعبده
  rationale: «نخدمه» تحفظ معنى التعبد والطاعة معًا ولا تحصر الدلالة في العبادة الشعائرية، بينما تظل «نعبده» ترجمة ممكنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. قُدِّمت عبارة «بلا خوف» قرب الفعل الذي تتعلق به لتفادي التباس موقع الحال، مع الحفاظ على علاقة الإنقاذ بالخدمة.
