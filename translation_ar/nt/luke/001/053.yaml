  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: ar
  text: أَشْبَعَ الْجِيَاعَ مِنَ الْخَيْرَاتِ، وَصَرَفَ الْأَغْنِيَاءَ فَارِغِينَ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وَصَرَفَ الْأَغْنِيَاءَ خَالِيَ الْوِفَاضِ».'
    reason: بديل معجمي يعبّر اصطلاحيًا عن κενούς، لكنه يزيد صورة اليد أو الوفاض غير الصريحة في اليونانية.
lexical_decisions:
- source_word: πεινῶντας
  choice: الْجِيَاعَ
  rationale: اسم فاعل حاضر مستعمل استعمال الاسم، فيشير بوضوح إلى الجياع بوصفهم فئة، من غير المبالغة إلى معنى «المتضورين جوعًا».
- source_word: ἐνέπλησεν
  choice: أَشْبَعَ
  rationale: الفعل يدل على الملء حتى الاكتفاء؛ و«أشبع» تعبير عربي طبيعي في سياق الجوع، ويحفظ معنى الإملاء دون تركيب متكلف.
- source_word: ἀγαθῶν
  choice: مِنَ الْخَيْرَاتِ
  rationale: المضاف إليه بعد فعل الملء يبيّن المحتوى. و«الخيرات» تنقل الأشياء الجيدة دون إضافة معنى «الهبات» غير المصرح به.
- source_word: πλουτοῦντας
  choice: الْأَغْنِيَاءَ
  rationale: اسم فاعل حاضر مستعمل استعمال الاسم؛ و«الأغنياء» يحفظ المقابلة الاجتماعية المباشرة مع «الجياع».
- source_word: ἐξαπέστειλεν
  choice: صَرَفَ
  rationale: ينقل معنى الإرسال بعيدًا أو ردّ الشخص، وهو موجز وطبيعي في العربية؛ ولا يفترض إجراءً رسميًا.
- source_word: κενούς
  choice: فَارِغِينَ
  rationale: صفة خبرية تصف الحال التي انصرف عليها الأغنياء. «فارغين» تحافظ على اللفظ الواسع والصورة المجردة في اليونانية، بينما «خالي الوفاض» تفسير تصويري ممكن.
theological_decisions:
- issue: الانقلاب الاجتماعي واللاهوتي في ترنيمة مريم
  choice: الإبقاء على المقابلة الحسية بين «الجياع» و«الأغنياء» من غير إضفاء معنى روحي حصري على أي منهما.
  alternative: تفسير الجياع بالمحتاجين روحيًا، أو الأغنياء بالمكتفين بأنفسهم أو المتكبرين.
  rationale: النص اليوناني يسمّي الجياع والأغنياء بألفاظ اجتماعية ملموسة ضمن موضوع الانقلاب الإلهي في لوقا. وقد تكون للنص دلالات روحية، لكن الترجمة لا تحصر عباراته فيها ولا تزيل توترها.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كريمة. استُعمل «أشبع» لملازمته الطبيعية للجوع، مع إبقاء المقابلة الملموسة وبنية الجملة المتوازنة. أُثبتت علامة الحاشية [a] في المتن.
