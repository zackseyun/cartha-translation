  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: ar
  text: 'فقالت مريم: «ها أنا أَمَةُ الرب[a]. ليكن لي بحسب قولك[b]». وانصرف الملاك من عندها.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «خادمة الرب» أو «مملوكة الرب». فاللفظة اليونانية تدل على أَمَة أو خادمة، وتعبّر هنا عن خضوع مريم المتواضع للرب.'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا: «ليحدث لي بحسب قولك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: حرف ربط خفيف يواصل السرد طبيعيًا من غير إضافة دلالة زمنية صريحة.
- source_word: Ἰδοὺ
  choice: ها أنا
  rationale: تعبير عربي طبيعي يحفظ قوة الالتفات والتقديم الشخصي في جواب مريم، وهو أنسب هنا من «انظر» الحرفية.
- source_word: δούλη
  choice: أَمَة
  rationale: يحفظ المؤنث ودلالة الانتماء والخضوع لسيد، ويمكن أن يدل على الخادمة أو المملوكة؛ وتوضح الحاشية هذا المجال الدلالي.
- source_word: κυρίου
  choice: الرب
  rationale: ينقل اللقب الإلهي κύριος بالصيغة العربية الكتابية الواضحة والمألوفة.
- source_word: γένοιτό μοι
  choice: ليكن لي
  rationale: ينقل صيغة التمني والقبول في فعل الأمر الغائب العربي، ويحفظ إيجاز الأصل من غير تحويله إلى تقرير عن المستقبل.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: بحسب قولك
  rationale: «بحسب» تحفظ معنى المطابقة، و«قولك» يشير طبيعيًا إلى الكلام المحدد الذي نطق به الملاك.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: انصرف من عندها
  rationale: صياغة عربية سردية فصيحة تفيد مغادرة الملاك موضع حضوره معها.
- source_word: ὁ ἄγγελος
  choice: الملاك
  rationale: السياق يحدد أنه كائن ملائكي لا مجرد رسول بشري.
theological_decisions:
- issue: دلالة وصف مريم لنفسها بلفظة δούλη
  choice: أَمَةُ الرب
  alternative: خادمة الرب؛ مملوكة الرب
  rationale: «أَمَة» تحفظ جنس اللفظة وقوة الخضوع والانتماء من دون حصرها في تصور قانوني حديث للعبودية؛ وتُبقي الحاشية الاحتمال الدلالي الأشد صراحة.
- issue: قوة العبارة γένοιτό μοι
  choice: ليكن لي بحسب قولك
  alternative: ليحدث لي بحسب قولك
  rationale: الصيغة اليونانية تفيد التمني والقبول الطوعي، لا مجرد الإخبار بما سيقع. «ليكن لي» تحفظ هذا التوتر وإيجاز العبارة، بينما يوضح البديل جانب الحدوث.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة موقرة. استُخدمت «ها أنا» بدل المقابل الحرفي الجامد لـἸδοὺ، و«أَمَة» للحفاظ على المؤنث وقوة الخضوع. تظهر علامتا الحاشيتين [a] و[b] في موضعيهما في المتن.
