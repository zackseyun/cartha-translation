  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ μακαρία ἡ πιστεύσασα ὅτι ἔσται τελείωσις τοῖς λελαλημένοις αὐτῇ παρὰ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: ar
  text: وطوبى للتي آمنت أن ما قيل لها من عند الرب سيتمّ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن ما قيل لها من عند الرب سيتم». قد تأتي الأداة اليونانية بمعنى سببي، لكن معنى المضمون «أن» أرجح هنا.'
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا ترجمة «سيتمّ» بـ«سيكتمل» أو «سيتحقق».
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: طوبى
  rationale: صيغة عربية كتابية فصيحة وطبيعية تحفظ الدلالة الدينية والتقويمية، ولا تختزلها في شعور ذاتي بالسعادة.
- source_word: ἡ πιστεύσασα
  choice: للتي آمنت
  rationale: ينقل اسم الفاعل المعرّف المستعمل اسميًا، ويحافظ على الإشارة إلى فعل الإيمان الذي وقع.
- source_word: ὅτι
  choice: أن
  rationale: 'الأرجح أنها تُدخل مضمون الإيمان: آمنت أن القول سيتم؛ أما المعنى السببي «لأن» فممكن ويُذكر في الحاشية.'
- source_word: τελείωσις
  choice: سيتمّ
  rationale: يعبر طبيعيًا عن بلوغ القول الإلهي تمامه وتحققه، من غير إثقال العبارة باسم مجرد.
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: ما قيل لها
  rationale: صياغة عربية موجزة تحفظ المبني للمجهول وتشير إلى مضمون الكلام السابق.
- source_word: παρὰ κυρίου
  choice: من عند الرب
  rationale: تحفظ دلالة المصدر أو المنشأ في παρά مع المضاف إليه، وتوضح أن القول صادر من الرب من غير حسمه إلى مجرد أداة الفاعل.
- source_word: κυρίου
  choice: الرب
  rationale: المقابل العربي المألوف لـ κύριος في هذا السياق، حيث يشير إلى الله مصدر الوعد.
theological_decisions:
- issue: علاقة تطويب مريم بإيمانها وبالكلمة الموعودة
  choice: تُطوَّب لأنها آمنت بأن ما قيل لها من عند الرب سيتم.
  alternative: تُطوَّب لأن ما قيل لها من عند الرب سيتم، فتكون ὅτι سببية.
  rationale: التركيب اليوناني يرجح أن ὅτι تقدم مضمون الإيمان، مع إبقاء القراءة السببية الممكنة في الحاشية وعدم تحميل الآية قضايا عقائدية لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «طوبى» حفاظًا على النبرة الكتابية، وصيغت بقية الآية بأسلوب طبيعي مفهوم للقارئ المعاصر.
