  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: ar
  text: بسبب رحمة إلهنا الحانية، التي بها سيزورنا الفجر الآتي من العلى[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الشروق». وقد تستحضر الكلمة اليونانية أيضًا صدى اللقب المسياني «الغصن» في العهد القديم اليوناني.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ
  choice: بسبب
  rationale: تأتي διά مع المنصوب هنا للدلالة على السبب أو الأساس، و«بسبب» تنقل هذه العلاقة بوضوح.
- source_word: σπλάγχνα ἐλέους
  choice: رحمة ... الحانية
  rationale: التعبير اليوناني حرفيًا «أحشاء الرحمة»، وهو كناية عن رحمة عميقة نابعة من الداخل؛ والصياغة العربية المختارة تحفظ المعنى الوجداني من غير حرفية مستغلقة.
- source_word: θεοῦ ἡμῶν
  choice: إلهنا
  rationale: تنقل الإضافة والضمير بصورة عربية موجزة وطبيعية.
- source_word: ἐν οἷς
  choice: التي بها
  rationale: تربط الزيارة برحمة الله بوصفها أساسًا أو وسيلة، مع مراعاة أن المرجع الدلالي في العربية مفرد هو «الرحمة».
- source_word: ἐπισκέψεται
  choice: سيزورنا
  rationale: الفعل مستقبل، و«سيزورنا» يحفظ دلالته الأساسية ويترك للسياق معنى التفقد الخلاصي والعون الإلهي.
- source_word: ἀνατολὴ
  choice: الفجر
  rationale: يمكن أن تعني اللفظة الشروق أو الفجر، وسياق النور في العدد التالي يرجح الصورة الضوئية؛ و«الفجر» عربي واضح وطبيعي مع إبقاء الصدى المسياني البديل في الحاشية.
- source_word: ἐξ ὕψους
  choice: الآتي من العلى
  rationale: «من العلى» قريبة من اليونانية وتحفظ الإشارة إلى المجال السماوي من غير تحويلها صراحة إلى «من السماء»؛ وأضيف «الآتي» لسلامة تعلق العبارة في العربية.
theological_decisions:
- issue: دلالة ἀνατολή في السياق المسياني
  choice: الفجر
  alternative: الشروق؛ أو «الغصن» بوصفه صدى محتملًا للقب مسياني في العهد القديم اليوناني
  rationale: صورة النور التي تلي مباشرة ترجح معنى الفجر أو الشروق، لكن استعمال الكلمة في السبعينية قد يستحضر لقب «الغصن». لذلك لم يُحسم هذا الصدى في المتن، بل حُفظ في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. حُفظت استعارة الزيارة وصورة الفجر، وتُجنبت الحرفية الغريبة في «أحشاء الرحمة».
