base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: ar
  text: 'فقال زكريا للملاك: «كيف سأعرف هذا؟ فأنا رجل مسنّ، وزوجتي متقدمة في السن[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «قد تقدمت في أيامها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: قال
  rationale: فعل القول السردي المألوف، وصيغة «فقال» تلائم اتصال الجملة بما قبلها.
- source_word: πρὸς τὸν ἄγγελον
  choice: للملاك
  rationale: تدل πρός مع فعل القول على المخاطَب، واللام هي الصياغة العربية الطبيعية هنا.
- source_word: Κατὰ τί
  choice: كيف
  rationale: يسأل التعبير عن الكيفية أو الأساس الذي سيعرف به زكريا صدق الخبر؛ و«كيف» واضحة وطبيعية من غير إضافة علامة غير مذكورة صراحة.
- source_word: γνώσομαι
  choice: سأعرف
  rationale: يحافظ حرف الاستقبال على دلالة صيغة المستقبل في الفعل اليوناني.
- source_word: τοῦτο
  choice: هذا
  rationale: اسم إشارة يعود مباشرة إلى ما أعلنه الملاك، ولا يحتاج إلى توسيع.
- source_word: πρεσβύτης
  choice: شيخ
  rationale: يدل اللفظ هنا على رجل متقدم في السن، لا على صاحب منصب؛ و«شيخ» موجزة وفصيحة في هذا السياق.
- source_word: γυνή
  choice: زوجتي
  rationale: السياق مع ضمير الملكية يحدد المعنى الزوجي، لا المعنى العام «امرأة».
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: قد تقدمت في أيامها
  rationale: تحافظ العبارة على صورة الأصل، أي التقدم في الأيام، مع بيان الصياغة العربية الاصطلاحية في الحاشية.
theological_decisions:
- issue: دلالة ἄγγελος
  choice: الملاك
  alternative: الرسول
  rationale: مع أن اللفظ قد يعني رسولًا بشريًا، فإن السياق المباشر يعرّف المتكلم بأنه جبرائيل، ولذلك فـ«الملاك» هو المعنى السياقي من غير توسع عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صورة «التقدم في الأيام» في المتن لقربها من الأصل، مع تقديم التعبير الاصطلاحي المألوف في الحاشية.
