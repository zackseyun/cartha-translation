  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: ar
  text: وكان كلاهما بارَّيْن أمام الله[a]، سالكَين بلا لوم في جميع وصايا الرب وأحكامه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في نظر الله».
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: بارَّيْن
  rationale: ينقل الوصف الأخلاقي والعهدي القوي لكلمة δίκαιοι، مع إبقاء الحكم على الشخصين كليهما وعدم اختزاله في مجرد الإنصاف القانوني.
- source_word: ἀμφότεροι
  choice: كلاهما
  rationale: يحفظ التشديد الصريح على أن الوصف ينطبق على زكريا وأليصابات معًا.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: أمام الله
  rationale: تعبير عربي موجز وطبيعي يحفظ معنى كون برهما منظورًا إليه ومقوَّمًا في حضرة الله، لا بحسب حكم الناس فقط.
- source_word: πορευόμενοι
  choice: سالكَين
  rationale: يحفظ استعارة السلوك الدالة على نهج الحياة، وهي واضحة ومألوفة في العربية الكتابية المعاصرة.
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: في جميع وصايا
  rationale: يحفظ شمول πάσαις، ويعبّر عن مجال السلوك المطيع من غير إضافة تفسير زائد.
- source_word: δικαιώμασιν
  choice: أحكامه
  rationale: يميز بصورة طبيعية بين الوصايا والأحكام المقررة، مع تجنب لفظ قانوني حديث أضيق من السياق.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: الترجمة العربية المألوفة لـ κύριος هنا، حيث يدل السياق على إله إسرائيل.
- source_word: ἄμεμπτοι
  choice: بلا لوم
  rationale: ينقل معنى السلوك الذي لا يؤخذ عليه مأخذ. وصيغة شبه الجملة طبيعية مع «سالكَين» وتحافظ على قوة الوصف من غير أن تضيف ادعاءً صريحًا بالعصمة من كل خطيئة.
- source_word: ἦσαν δὲ
  choice: وكان
  rationale: تنقل δέ بوصفها رابطًا سرديًا خفيفًا، وتلائم «كان» تركيب «كلاهما» في العربية.
theological_decisions:
- issue: هل يدل ἄμεμπτοι على انعدام الخطيئة مطلقًا؟
  choice: أُبقي الوصف قويًا بصيغة «بلا لوم» في سياق السلوك في وصايا الرب وأحكامه.
  alternative: صياغته بما يفيد الكمال المطلق أو العصمة من كل خطيئة.
  rationale: النص يصف استقامة السلوك والأمانة أمام الله، لكنه لا يصرح هنا بعقيدة الكمال المطلق؛ لذلك لا تُضعف العبارة ولا تُحمَّل ما لا تقوله.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم المثنى في «بارَّيْن» و«سالكَين» لإبراز انطباق الوصف على الشخصين، مع الحفاظ على استعارة السلوك في الأصل اليوناني.
