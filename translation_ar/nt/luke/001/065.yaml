  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: ar
  text: فحلَّ الخوفُ[b] على جميع الذين يسكنون حولَهما، وكان يُتحدَّث في كلِّ المنطقة الجبلية من اليهودية عن جميع هذه الأمور[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «جميع هذه الكلمات» أو «جميع هذه الوقائع». فاللفظة اليونانية قد تشير إلى أقوال منطوقة أو إلى الأحداث التي دار عنها الكلام.
    reason: lexical_alternative
  - marker: b
    text: قد يشمل «الخوف» هنا معنى الرهبة إزاء عمل الله الظاهر.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας φόβος
  choice: فحلَّ الخوفُ بجميع
  rationale: ينقل التعبير العربي «حلَّ الخوف بفلان» نشوء الخوف ووقوعه على الأشخاص، ويحافظ على القوة الحدثية للتركيب اليوناني من غير ترجمة حرفية متكلّفة.
- source_word: φόβος
  choice: الخوف
  rationale: «الخوف» هو المقابل المباشر، مع إبقاء احتمال اشتماله في السياق على الرهبة أمام عمل الله دون إدخال هذا التفسير في المتن.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: الساكنين حولهم
  rationale: يعكس معنى السكن في المنطقة المحيطة بوضوح، ولا يضيّق الدلالة إلى «الجيران» وحدهم.
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: في منطقة جبال اليهودية كلِّها
  rationale: يصوغ المرجع الجغرافي بلغة عربية واضحة، ويُظهر شمول الحديث المنطقة الجبلية بأسرها.
- source_word: διελαλεῖτο
  choice: كان يُتحدَّث ... عن
  rationale: المبني للمجهول مع «كان» ينقل الاستمرار في الماضي الذي يدل عليه الفعل اليوناني الناقص، ويعبّر طبيعيًا عن تداول الخبر بين الناس.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: جميع هذه الأمور
  rationale: لفظة ῥήματα قد تشير إلى الأقوال أو إلى الوقائع التي يدور عنها الكلام؛ و«الأمور» ملائمة للسياق السردي مع بيان البدائل في الحاشية.
theological_decisions:
- issue: دلالة φόβος في الاستجابة لنشاط الله الظاهر
  choice: الخوف
  alternative: الرهبة؛ الخوف الممزوج بالخشوع
  rationale: تحافظ الترجمة المباشرة على التوتر الدلالي، فلا تحصر رد الفعل في الفزع ولا تفسّره صراحة بأنه خشوع، بينما يسمح السياق بفهم عنصر الرهبة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم المبني للمجهول «كان يُتحدَّث» للمحافظة على تداول الحديث المستمر، ووُضعت علامتا الحاشيتين في المتن عند اللفظتين المعنيتين.
