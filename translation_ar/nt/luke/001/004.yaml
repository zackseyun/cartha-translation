translation:
  language: ar
  text: لكي تعرف مدى موثوقية الأمور التي تلقّيتَ تعليمًا بشأنها[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مدى يقين الأمور»؛ فالاسم اليوناني قد يدل على اليقين أو الثبات أو الموثوقية.
    reason: lexical_alternative
  - marker: b
    text: أو «تعلّمتَها»؛ والفعل اليوناني يدل على تلقّي التعليم، وهو أصل المصطلح الدال على التعليم الديني المنهجي في بعض اللغات.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تُدخل جملة الغرض وتحافظ بوضوح وطبيعية على دلالة القصد.
- source_word: ἐπιγνῷς
  choice: تعرف
  rationale: تنقل معنى المعرفة أو التحقق في هذا السياق من غير مبالغة بإضافة معنى «المعرفة الكاملة».
- source_word: περὶ ὧν
  choice: بشأنها
  rationale: تحافظ على معنى الإحالة إلى الأمور التي كان التعليم متعلقًا بها، بصياغة عربية طبيعية.
- source_word: κατηχήθης
  choice: تلقّيت التعليم
  rationale: تنقل المبني للمجهول ومعنى التلقين أو التعليم المنهجي، من غير استيراد مصطلح كنسي متأخر أو إيحاء سلبي.
- source_word: λόγων
  choice: الأمور
  rationale: يدل λόγων هنا على مضمون ما تلقّاه المخاطَب من تعليم؛ و«الأمور» أوضح من الترجمة الحرفية «الكلمات» في هذا التركيب.
- source_word: τὴν ἀσφάλειαν
  choice: يقين
  rationale: تحافظ «يقين» على معنى الثبوت والموثوقية المؤدي إلى الاطمئنان، مع بيان البديل الدلالي في الحاشية.
theological_decisions:
- issue: طبيعة الغرض الذي يعلنه لوقا من الكتابة
  choice: الإبقاء على «يقين» بما يسمح بدلالة ثبوت التعليم وموثوقيته وما ينشأ عنهما من اطمئنان.
  alternative: قصر المعنى على طمأنينة ذاتية، أو على تحقق تاريخي موضوعي وحده.
  rationale: لفظة ἀσφάλεια تتسع لليقين والثبات والموثوقية؛ لذلك لا ينبغي حصرها في جانب نفسي أو تاريخي فقط.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ورصينة. استُعملت «تلقّيت التعليم بشأنها» لإبراز علاقة التعليم بالأمور المذكورة، وتجنُّب «لُقِّنت» لما قد تحمله حديثًا من إيحاء سلبي.
