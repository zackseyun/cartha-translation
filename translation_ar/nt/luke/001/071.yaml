  text: salvation from our enemies and from the hand of all who hate us,[a]
translation:
  language: ar
  text: خلاصًا من أعدائنا ومن يد جميع مبغضينا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نجاةً من أعدائنا ومن سلطان جميع مبغضينا».'
