lexical_decisions:
- source_word: σωτηρίαν
  choice: خلاصًا
  rationale: يحفظ الثقل اللاهوتي للكلمة، مع بقائها قادرة في هذا السياق على الدلالة الملموسة على النجاة من الأعداء.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: من أعدائنا
  rationale: تنقل ἐξ معنى الانفصال أو النجاة من مصدر الخطر من غير إضافة معنى «السلطان» غير المصرح به هنا.
- source_word: ἐκ χειρὸς
  choice: من يد
  rationale: تحافظ على الصورة الكتابية التي تستعمل «اليد» للدلالة على السيطرة أو السلطان، وهي صورة مفهومة في العربية.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: جميع مبغضينا
  rationale: صياغة عربية موجزة وطبيعية تنقل اسم الفاعل المستعمل استعمالًا اسميًا، بما يدل على الذين يتصفون ببغضنا.
- source_word: καὶ
  choice: و
  rationale: تربط عبارتي النجاة ربطًا مباشرًا من دون تفسير زائد.
theological_decisions:
- issue: طبيعة الخلاص الموعود في نبوة زكريا
  choice: استعمال «خلاصًا» مع الإبقاء على الإشارتين الصريحتين إلى الأعداء ومبغضينا.
  alternative: «نجاةً» أو «إنقاذًا»، بما قد يبرز الخلاص السياسي أو الجسدي وحده.
  rationale: تحفظ الصياغة معًا معنى النجاة الواقعية من القوى المعادية والمدلول الخلاصي الأوسع في إنجيل لوقا، من غير حصر النص في خلاص سياسي محض أو روحي محض.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. أُبقي تعبير «من يد» لما له من صدى كتابي، مع شرح معناه البديل في الحاشية.
