translation:
  language: ar
  text: إلى عذراءَ مخطوبةٍ[a] لرجلٍ اسمه يوسف، من بيت داود؛ واسم العذراء مريم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي مرتبطة بعهد زواج رسمي يسبق اكتمال الزواج، لا بمجرد خطبة غير ملزمة بالمفهوم الحديث.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: عذراء / العذراء
  rationale: هذا هو المعنى المباشر للكلمة في السياق، وتكرارها في الآية نفسها يؤكده.
- source_word: ἐμνηστευμένην
  choice: مخطوبة
  rationale: صيغة اسم المفعول التام تصف حالة خطبة رسمية قائمة. ولفظ «مخطوبة» عربي طبيعي، مع حاشية تبين أن المقصود عهد رسمي سابق لاكتمال الزواج، لا مجرد ارتباط حديث غير ملزم.
- source_word: ἀνδρὶ
  choice: لرجل
  rationale: يمكن أن تعني الكلمة «رجلًا» أو «زوجًا»، لكن تركيبها مع حالة الخطبة يجعل «لرجل» أدق هنا، من غير استباق اكتمال الزواج.
- source_word: ᾧ ὄνομα Ἰωσὴφ
  choice: اسمه يوسف
  rationale: صياغة عربية طبيعية تؤدي تركيب التسمية اليوناني بوضوح.
- source_word: ἐξ οἴκου Δαυίδ
  choice: من بيت داود
  rationale: تحافظ على التعبير الأسري والسلالي الكتابي «بيت داود» وتعكس حرف الجر ἐξ.
- source_word: Μαριάμ
  choice: مريم
  rationale: «مريم» هي الصيغة العربية الراسخة للاسم، وهي قريبة أيضًا من صورة الاسم اليونانية، لذلك لا حاجة إلى حاشية بديل صوتي كما في الإنجليزية.
theological_decisions:
- issue: هل تُترجم παρθένος بما يحفظ معنى البتولية في رواية الميلاد؟
  choice: عذراء
  alternative: شابة
  rationale: لفظ παρθένος وسياق لوقا وتكرار الكلمة في الآية تدل بوضوح على «عذراء». أما «شابة» فأوسع دلالة وتفقد عنصرًا صريحًا في النص.
- issue: هل يُفهم ἀνδρί هنا بمعنى الزوج أم الرجل؟
  choice: لرجل
  alternative: لزوج
  rationale: النص يصف مريم بأنها في حالة خطبة رسمية، ولذلك يحفظ «رجل» المرحلة التي يصفها النص ولا يحسمها بلفظ قد يوحي بزواج مكتمل.
translation_notes:
  register: لغة عربية فصحى واضحة وموقرة. استُخدم «مخطوبة» لسلامته وطبيعته في العربية، وأضيفت حاشية لتوضيح القوة الرسمية والاجتماعية للمصطلح اليوناني. لم تُنقل حاشية الاسم الإنجليزية لأن «مريم» هي أصلًا الصيغة العربية القياسية والقريبة من Μαριάμ.
