base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: ar
  text: 'فأجابه الملاك: «أنا جبرائيل، الواقف في حضرة الله، وقد أُرسلت لأكلّمك وأبشّرك بهذه الأمور[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بهذه الأشياء». وتشير العبارة إلى مضمون الرسالة التي أعلنها جبرائيل للتو.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: فأجابه
  rationale: اسم فاعل ماضٍ يمهّد للكلام المباشر؛ وصيغة الفعل العربية طبيعية وتحفظ معنى الرد على زكريا.
- source_word: ἄγγελος
  choice: الملاك
  rationale: السياق يحدد رسولًا سماويًا، إذ يعرّف نفسه بأنه جبرائيل الواقف في حضرة الله.
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: أنا جبرائيل
  rationale: يحفظ ضمير المتكلم الصريح ونبرة التعريف المؤكدة في اليونانية.
- source_word: ὁ παρεστηκὼς
  choice: الواقف
  rationale: اسم الفاعل التام يدل على مقام ثابت ومستمر؛ و«الواقف» تعبير عربي موجز وطبيعي دون تقييده بزمن منقضٍ.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: في حضرة الله
  rationale: ينقل معنى المثول أمام الله والقرب من حضرته، ويلائم صورة البلاط السماوي.
- source_word: ἀπεστάλην
  choice: قد أُرسلت
  rationale: يحفظ المبني للمجهول والتكليف الذي تلقاه جبرائيل، وتفيد «قد» تحقق الإرسال.
- source_word: λαλῆσαι πρὸς σὲ
  choice: لأكلّمك
  rationale: مصدر غرض بعد فعل الإرسال؛ والعبارة واضحة وطبيعية في العربية الحديثة.
- source_word: εὐαγγελίσασθαί σοι
  choice: وأبشّرك
  rationale: الفعل العربي «بشّر» ينقل فعل إعلان الخبر السار بصورة طبيعية، من غير تحويله هنا إلى المصطلح الاسمي «الإنجيل».
- source_word: ταῦτα
  choice: بهذه الأمور
  rationale: يحفظ اسم الإشارة الجمعي المحايد حرفيًا نسبيًا، ويشير إلى مضمون رسالة جبرائيل السابقة من غير دمجه ضمن فعل البشارة.
theological_decisions:
- issue: دلالة εὐαγγελίζω في سياق إعلان الملاك
  choice: أبشّرك
  alternative: أعلن لك هذه البشارة / أحمل إليك هذا الخبر السار
  rationale: «أبشّرك» يؤدي معنى إعلان خبر سار ويحفظ الصدى اللاهوتي للجذر من غير استعمال «الإنجيل» بوصفه مصطلحًا تقنيًا قد يبدو سابقًا لأوانه في هذا السياق.
- issue: علاقة ταῦτα بفعل البشارة
  choice: بهذه الأمور
  alternative: بهذا الخبر السار
  rationale: اليونانية تقول حرفيًا إن جبرائيل أُرسل ليبشّر زكريا «بهذه الأمور». إبقاء اسم الإشارة ظاهرًا يحفظ تركيب المصدر ولا يحسمه بإعادة صياغة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «جبرائيل» وفق الصيغة العربية الكتابية الشائعة، و«في حضرة الله» لنقل معنى المثول المستمر أمامه. أُثبتت علامة الحاشية في المتن.
