lexical_decisions:
- source_word: εἰσῆλθεν
  choice: دخلت
  rationale: فعل ماضٍ يدل على الدخول إلى مكان، والتأنيث مستفاد من سياق الفاعل، أي مريم، في الآية السابقة.
- source_word: οἶκον
  choice: بيت
  rationale: المقصود هنا مكان السكن المادي بعد حرف الجر الدال على الاتجاه، و«بيت» هي الصياغة العربية الطبيعية المباشرة.
- source_word: Ζαχαρίου
  choice: زكريا
  rationale: الصيغة العربية الكتابية الشائعة للاسم الشخصي.
- source_word: ἠσπάσατο
  choice: سلَّمت على
  rationale: ينقل معنى التحية نقلاً طبيعيًا ودقيقًا في العربية، من غير إضافة معنى الترحيب أو الرسمية.
- source_word: Ἐλισάβετ
  choice: أليصابات
  rationale: الصيغة العربية الكتابية الشائعة للاسم الشخصي.
- source_word: καὶ
  choice: و
  rationale: تحافظ الواو في الموضعين على تنسيق الفعلين وعلى التدفق السردي البسيط في اليونانية.
