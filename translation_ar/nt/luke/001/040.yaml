translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على أسلوب السرد المتتابع. لم تُضف حواشٍ لأن البدائل الإنجليزية المذكورة لا تعبّر عن غموض جوهري يحتاجه القارئ العربي؛ فـ«دخلت» و«سلَّمت على» هما المقابلان الطبيعيان المباشران في السياق.
