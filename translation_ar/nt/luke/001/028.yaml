  rationale: أُضيفت حاشية مستقلة للتحية كي يُحفظ المعنى الحرفي لـΧαῖρε إلى جانب المقابل الاصطلاحي العربي. وعُدّل المقابل الرئيسي لـκεχαριτωμένη إلى «يا مَن نالت حظوةً» لإظهار دلالة تلقي الفضل، مع صون «النعمة» و«الممتلئة نعمةً» بدائلَ شفافة في الحاشية. ولم يُضف النص أي تحديد مكاني أو تفسير لاهوتي غير وارد في اليونانية.
