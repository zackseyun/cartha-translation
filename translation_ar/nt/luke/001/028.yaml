  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: ar
  text: 'فدخل إليها وقال: «سلامٌ لكِ[a]، يا مَن نالت حظوةً[b]؛ الرب معكِ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «افرحي»، أو تقليديًا: «السلام لكِ». والفعل اليوناني، مع أنه في أصله أمر بمعنى «افرحي»، يُستعمل هنا تحيةً اصطلاحية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يا مَن أُنعِم عليها» أو «يا مَن نالت نعمةً»؛ وتقليديًا: «يا ممتلئة نعمةً». تدل الصيغة اليونانية على امرأة نالت نعمةً أو حظوةً.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: فدخل إليها
  rationale: ينقل اسم الفاعل الأوريستي الدال على الفعل السابق للقول، مع πρός الدالة على الاتجاه نحو مريم، بعبارة عربية طبيعية من غير إضافة مكان لم يصرّح به النص.
- source_word: Χαῖρε
  choice: سلامٌ لكِ
  rationale: الفعل في صيغته أمر بمعنى «افرحي»، لكنه يُستعمل هنا تحيةً اصطلاحية؛ و«سلام لك» تحية عربية واضحة وموقرة، مع إثبات المعنى الحرفي البديل في الحاشية.
- source_word: κεχαριτωμένη
  choice: يا مَن نالت نعمةً
  rationale: صيغة اسم المفعول التام من χαριτόω تصف مريم بأنها متلقية للنعمة أو الحظوة؛ وهذه الصياغة تحفظ الدلالة المبنية للمجهول ولا تجعل النعمة صفة ذاتية المصدر.
- source_word: ὁ κύριος
  choice: الرب
  rationale: اللقب الكتابي المعتاد لله في هذا السياق، ويحفظ الوقار والاستمرارية الاصطلاحية.
- source_word: μετὰ σοῦ
  choice: معكِ
  rationale: تنقل μετά مع المضاف إليه بمعنى المصاحبة والحضور، والجملة الاسمية العربية لا تحتاج إلى فعل رابط.
theological_decisions:
- issue: ترجمة κεχαριτωμένη في نص ذي حساسية مريمية
  choice: يا مَن نالت نعمةً
  alternative: يا مَن أُنعِم عليها؛ يا ممتلئة نعمةً
  rationale: تحفظ الصياغة المختارة كون مريم قد تلقت نعمة الله، وفق الدلالة المبنية للمجهول في اليونانية، من غير إدخال صياغة عقائدية لاحقة. وتُذكر البدائل المؤثرة في الحاشية حفاظًا على الشفافية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «سلام لكِ» بوصفها تحية طبيعية؛ أما المعنى الحرفي «افرحي» فليس لازمًا في المتن لأن الاستعمال اليوناني هنا اصطلاحي.
