- source_word: φόβος
  choice: خوف
  rationale: المقابل المباشر والأقل تحميلًا للتفسير، فلا يشدد المعنى إلى رعب أو فزع.
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: وقع عليه
  rationale: يحافظ على الصورة الحرفية للفعل اليوناني مع تعبير عربي واضح ومألوف.
