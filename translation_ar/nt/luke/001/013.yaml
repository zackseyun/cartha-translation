source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: ar
  text: 'فقال له الملاك: «لا تخف يا زكريا، لأن طلبتك قد سُمعت، وأليصابات امرأتك ستلد لك ابنًا، وتسمّيه يوحنا.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «وتدعو اسمه يوحنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος
  choice: فقال له الملاك
  rationale: تؤدي الفاء الانتقال السردي الخفيف الذي تؤديه δέ في السياق، و«الملاك» هو المعنى الطبيعي لـἄγγελος هنا.
- source_word: Μὴ φοβοῦ
  choice: لا تخف
  rationale: صياغة عربية فصيحة وطبيعية للنهي، وتناسب خوف زكريا المذكور في السياق.
- source_word: διότι εἰσηκούσθη ἡ δέησίς σου
  choice: لأن طلبتك قد سُمعت
  rationale: «طلبتك» تحافظ على دلالة δέησις بوصفها التماسًا موجَّهًا إلى الله، والبناء للمجهول يبقي فاعل الاستجابة ضمنيًا كما في اليونانية.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: أليصابات امرأتك
  rationale: السياق والضمير يحددان معنى γυνή بأنه الزوجة، و«امرأتك» تعبير كتابي واضح ومفهوم.
- source_word: γεννήσει υἱόν σοι
  choice: ستلد لك ابنًا
  rationale: ينقل المعنى المباشر للفعل مع المؤنث ويحفظ دلالة σοι على العلاقة والمنفعة.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: وتسمّيه يوحنا
  rationale: صياغة عربية طبيعية تؤدي اصطلاح «تدعو اسمه» من غير غرابة، مع إثبات الصياغة الحرفية في الحاشية.
theological_decisions:
- issue: فاعل «قد سُمعت» المحذوف
  choice: الإبقاء على البناء للمجهول، بما يلمّح إلى أن الله سمع الطلبة دون تسميته صراحة
  alternative: 'التصريح: «لأن الله قد سمع طلبتك»'
  rationale: السياق الديني يفيد الفاعل الإلهي، لكن النص اليوناني لا يذكره؛ لذلك يحفظ البناء للمجهول دقة النص وتوتره الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية موقرة. اختيرت «طلبتك» بدل «صلاتك» للمحافظة على الدلالة الأخص لـδέησις، واستُعملت صياغة عربية طبيعية في التسمية مع توثيق اللفظ الحرفي في الحاشية.
