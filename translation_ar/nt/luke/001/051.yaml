  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: ar
  text: أظهر قوةً بذراعه[a]، وشتّت المتكبّرين في أفكار قلوبهم.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صنع قوةً بذراعه». والعبارة اليونانية حرفيًا: «صنع قوة»، وهي تعبير عن إظهار القدرة أو إعمالها.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «شتّت المتكبّرين بمقاصد قلوبهم»، أو: «في تصوّرات قلوبهم».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: صنع قوةً
  rationale: يحافظ هذا التعبير على الصياغة اليونانية ذات النبرة الكتابية، حيث يدل اقتران الفعل «صنع» بـ«قوة» على إظهار القدرة والقيام بأعمال مقتدرة.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: بذراعه
  rationale: الباء تؤدي المعنى الأداتي المحتمل لحرف الجر ἐν، وتحفظ صورة ذراع الله المألوفة في لغة العهد القديم.
- source_word: διεσκόρπισεν
  choice: شتّت
  rationale: فعل عربي واضح وقوي يؤدي معنى التفريق والتبديد.
- source_word: ὑπερηφάνους
  choice: المتكبّرين
  rationale: صفة مستعملة اسميًا تصف أشخاصًا يتصفون بالكبرياء؛ و«المتكبّرين» طبيعية وواضحة في العربية المعاصرة.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: في أفكار قلوبهم
  rationale: يحفظ العبارة السامية التي تجعل القلب مركز الفكر والقصد، ولا يحصر διάνοια في معنى واحد مثل النية أو الخيال.
theological_decisions:
- issue: دلالة صيغ الماضي في نشيد مريم
  choice: 'استعمال الماضي العربي: «صنع» و«شتّت»'
  alternative: استعمال صياغة تفيد الإنجاز المستمر أو التقرير العام، مثل «قد صنع» و«يشتّت»
  rationale: الأفعال اليونانية في الماضي البسيط تعرض أعمال الله بوصفها أفعالًا حاسمة مكتملة، وقد تحمل في سياق النشيد قوة نبوية أو تلخيصية. الماضي العربي يحفظ الصيغة دون أن يحسم طبيعة مرجعها الزمني.
- issue: علاقة «في أفكار قلوبهم» بفعل التشتيت
  choice: إبقاء «في» بما يسمح بدلالة المجال الداخلي
  alternative: 'ترجمتها أداتيًا: «بمقاصد قلوبهم»'
  rationale: حرف الجر اليوناني ἐν قد يدل على المجال أو الوسيلة. إبقاء «في» يحفظ الغموض الحقيقي بين تشتيتهم في عالم أفكارهم وبين صلة التشتيت بمقاصدهم الداخلية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقّرة، مع الحفاظ على الإيقاع الشعري والصورة الكتابية. وُضع مؤشر الحاشية بعد العبارة التي تتناول بدائلها.
