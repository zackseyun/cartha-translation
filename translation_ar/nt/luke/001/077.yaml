  yaml_path: translation/nt/luke/001/077.yaml
  text: to give knowledge of salvation to his people in the forgiveness of their sins,[a]
translation:
  language: ar
  text: لِيُعْطِيَ شَعْبَهُ مَعْرِفَةَ الْخَلَاصِ فِي غُفْرَانِ خَطَايَاهُمْ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مِنْ خِلَالِ غُفْرَانِ خَطَايَاهُمْ»، أو: «بِغُفْرَانِ خَطَايَاهُمْ».'
    reason: بديل معجمي ودلالي لحرف الجر ἐν.
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: لِيُعْطِيَ
  rationale: المصدر المعرّف يفيد الغرض ويتعلق بما قبله؛ وتحافظ صيغة «ليعطي» على معنى الغاية وعلى الفعل المباشر.
- source_word: γνῶσιν
  choice: مَعْرِفَةَ
  rationale: تنقل المعنى الأساسي للفظ اليوناني من غير أن تحدد نوع المعرفة بما يتجاوز النص.
- source_word: σωτηρίας
  choice: الْخَلَاصِ
  rationale: «الخلاص» هو المقابل الطبيعي في هذا السياق اللوقاوي، وتبقى الإضافة في «معرفة الخلاص» قريبة من التركيب اليوناني.
- source_word: τῷ λαῷ αὐτοῦ
  choice: شَعْبَهُ
  rationale: الداتيف يحدد متلقي المعرفة، وتؤدي «شعبه» معنى الإضافة والسياق العهدي بإيجاز عربي طبيعي.
- source_word: ἐν ἀφέσει
  choice: فِي غُفْرَانِ
  rationale: تحافظ «في» على سعة دلالة ἐν، فلا تحصر العلاقة في الوسيلة أو السبب وحدهما.
- source_word: ἁμαρτιῶν αὐτῶν
  choice: خَطَايَاهُمْ
  rationale: تحفظ صيغة الجمع وضمير الملك العائد إلى الشعب.
theological_decisions:
- issue: علاقة الخلاص بغفران الخطايا
  choice: يُعرَف الخلاص في غفران خطايا الشعب، مع إبقاء طبيعة العلاقة مفتوحة ضمن دلالة «في».
  alternative: يمكن فهم العبارة بمعنى «من خلال غفران خطاياهم» أو «بغفران خطاياهم».
  rationale: تحتمل عبارة ἐν ἀφέσει دلالة المجال أو الكيفية أو الوسيلة؛ لذلك يحافظ المتن على «في»، وتعرض الحاشية البدائل القريبة من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير ترتيب عربي طبيعي مع إبقاء صلة الغاية بالسياق السابق، وحُفظت علامة الحاشية في المتن.
