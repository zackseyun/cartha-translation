lexical_decisions:
- source_word: ἔλεος
  choice: رحمته
  rationale: «الرحمة» هي المقابل العربي المباشر والطبيعي، وتشمل الإحسان والعطف على المحتاج من غير أن تحصر اللفظ في معنى أضيق.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: جيلًا بعد جيل
  rationale: صياغة عربية طبيعية تعبّر عن امتداد الرحمة عبر الأجيال المتعاقبة، وتحافظ على القيمة التوزيعية للتعبير اليوناني.
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: للذين يخافونه
  rationale: لام الجر تعبّر طبيعيًا عن المستفيدين من الرحمة، و«يخافونه» تحفظ التعبير الكتابي بما يحمله هنا من خشية وتوقير.
- source_word: καὶ
  choice: و
  rationale: تربط الآية بما قبلها وتحافظ على التتابع الشعري في نشيد مريم.
- source_word: αὐτοῦ / αὐτόν
  choice: ـه / ـه
  rationale: الضميران عائدان إلى الله بحسب السياق، ويؤديهما ضمير الغائب العربي بوضوح من دون إضافة تفسيرية.
theological_decisions:
- issue: معنى الخوف عندما يكون الله مفعوله
  choice: يخافونه
  alternative: يهابونه / يوقّرونه
  rationale: يحفظ لفظ «الخوف» ثقل التعبير اليوناني واتساعه، بينما توضّح الحاشية أن المقصود في هذا السياق خشية موقّرة، لا مجرد الفزع.
- issue: علاقة الرحمة بالأجيال وبالذين يخافون الله
  choice: للذين يخافونه جيلًا بعد جيل
  alternative: إلى أجيال وأجيال للذين يخافونه
  rationale: تجعل الصياغة العربية المستفيدين وامتداد الرحمة واضحين، من غير أن تغيّر مضمون التركيب اليوناني أو تحصر الرحمة في جيل واحد.
