  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: ar
  text: وفي الحال انفتح فمه ولسانه أيضًا[a]، وأخذ يتكلّم[b] مباركًا الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي إن قدرته على النطق عادت أيضًا. يذكر اليوناني اللسان بإيجاز، من غير أن يقول حرفيًا: «انحلّ لسانه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وكان يتكلّم مباركًا الله». قد يركّز الفعل بصيغة الماضي الناقص على استمرار الكلام، لا على بدايته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: انفتح
  rationale: ينقل صيغة المبني للمجهول في اليونانية على نحو عربي طبيعي، ويعبّر عن زوال العجز فجأة من غير تعيين الفاعل صراحة.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تتابع السرد، ولا يلزم منها معنى الاستدراك.
- source_word: τὸ στόμα αὐτοῦ
  choice: فمه
  rationale: مقابل مباشر وطبيعي للاسم التشريحي في سياق استعادة القدرة على الكلام.
- source_word: παραχρῆμα
  choice: في الحال
  rationale: ينقل معنى الفورية والتتابع المباشر بلغة عربية واضحة.
- source_word: καὶ ἡ γλῶσσα αὐτοῦ
  choice: وكذلك لسانه
  rationale: يحافظ على الذكر الصريح للفم واللسان وعلى الإيجاز النحوي في الأصل، من غير إضافة عبارة «انحلّ لسانه» غير الموجودة نصًّا.
- source_word: ἐλάλει
  choice: أخذ يتكلّم
  rationale: يناسب السياق الذي تبدأ فيه القدرة على الكلام بعد الخرس، مع بقاء احتمال دلالة الماضي الناقص على الكلام المستمر موضحًا في الحاشية.
- source_word: εὐλογῶν
  choice: مباركًا
  rationale: يحافظ على المقابل الأقرب للفعل اليوناني، ويبيّن هيئة كلامه ومضمونه.
- source_word: τὸν θεόν
  choice: الله
  rationale: المفعول به المباشر لاسم الفاعل، وصيغته العربية المألوفة في هذا السياق.
