base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: ar
  text: وفي الشهر السادس[a]، أُرسل الملاك جبرائيل من الله إلى مدينة في الجليل اسمها الناصرة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الشهر السادس من حمل أليصابات؛ انظر لوقا 1:24، 36.
    reason: cross_reference
  - marker: b
    text: 'أو: «إلى مدينة من الجليل اسمها الناصرة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: وفي الشهر السادس
  rationale: تفيد Ἐν مع المجرور الظرف الزمني «في الشهر السادس»، وتنقل الواو برفق وظيفة δέ بوصفها أداة وصل سردية من غير الإيحاء بتعارض قوي.
- source_word: ἀπεστάλη
  choice: أُرسل
  rationale: يحفظ صيغة المبني للمجهول في الفعل اليوناني ودلالة الإرسال من غير إضافة تفسيرية.
- source_word: ὁ ἄγγελος
  choice: الملاك
  rationale: السياق يدل على كائن ملائكي سماوي، و«الملاك» هو المقابل العربي الطبيعي والدقيق.
- source_word: Γαβριὴλ
  choice: جبرائيل
  rationale: استُخدمت الصيغة العربية الكتابية الشائعة للاسم الشخصي.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: من عند الله
  rationale: تحفظ دلالة المصدر أو المنشأ في ἀπό، ولا تحوّل العبارة إلى «بواسطة الله» التي تبرز الفاعلية أكثر من لفظ الأصل.
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: إلى مدينة في الجليل
  rationale: تفيد εἰς جهة الوصول، أما الإضافة اليونانية فتؤدي هنا معنى الموقع، ولذلك جاءت «في الجليل» عربية طبيعية.
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: اسمها الناصرة
  rationale: تنقل بإيجاز وبنية عربية طبيعية المعنى الحرفي «التي اسمها الناصرة».
theological_decisions:
- issue: مرجع «الشهر السادس»
  choice: أُبقيت العبارة «الشهر السادس» في المتن، مع بيان مرجعها السياقي في الحاشية.
  alternative: التصريح في المتن بأنه الشهر السادس من حبل أليصابات، أو فهمه على أنه الشهر السادس من السنة.
  rationale: يشير السياق القريب في لوقا 1:24 و36 إلى حبل أليصابات، لكن الآية نفسها لا تعيد التصريح بذلك؛ لذا يحفظ المتن صياغة الأصل ولا يحسمها بإضافة تفسيرية داخله.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختيرت «في الجليل» لطبيعتها في العربية، مع إثبات البديل الأقرب إلى صيغة الإضافة اليونانية في الحاشية. وُضع حرف العطف لنقل δέ بوصفها وصلة سردية خفيفة.
