  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: ar
  text: وحدث، بينما كان يقوم بخدمته الكهنوتية أمام الله حسب ترتيب فرقته،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وحدث
  rationale: صيغة سردية تنقل الكلام إلى تطور جديد؛ الواو تؤدي وظيفة δὲ الانتقالية الخفيفة، و«حدث» تنقل Ἐγένετο بعبارة عربية طبيعية غير متكلفة.
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: بينما كان يقوم بخدمته الكهنوتية
  rationale: التركيب المصدري المسبوق بـἐν يفيد الزمن هنا، وἱερατεύω يدل تحديدًا على أداء خدمة الكاهن.
- source_word: τάξει
  choice: ترتيب
  rationale: يشير في هذا السياق التعبدي إلى النظام المقرر الذي تتم وفقه الخدمة.
- source_word: ἐφημερίας
  choice: فرقته
  rationale: يدل على الفرقة الكهنوتية ذات النوبة المحددة؛ و«الفرقة» واضحة وتحافظ على المعنى المؤسسي.
- source_word: ἔναντι τοῦ θεοῦ
  choice: أمام الله
  rationale: تعبير موجز ودقيق يدل على أداء الخدمة في حضرة الله.
theological_decisions:
- issue: المصطلح التعبدي المتعلق بخدمة زكريا في الهيكل
  choice: يقوم بخدمته الكهنوتية أمام الله حسب ترتيب فرقته
  alternative: يخدم كاهنًا أمام الله في نوبة فرقته
  rationale: تحافظ الصياغة المختارة على الإطار التاريخي لخدمة كهنة الهيكل، من غير إدخال مفاهيم كنسية لاحقة. أما «نوبة» فتبين الجانب الزمني، لكنها قد تضيق دلالة ἐφημερία التي تشمل الفرقة وجدول خدمتها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على كون الآية جملة تمهيدية غير مكتملة تتصل بما بعدها، ولذلك انتهت بفاصلة. لا توجد علامة حاشية لأن البديل الإنجليزي لا يعكس غموضًا أصليًا يستلزم حاشية عربية.
