lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: وبعد هذه الأيام
  rationale: تفيد «μετά» مع النصب التعاقب الزمني، أي «بعد»، وتربط «δέ» الكلام بما قبله ربطًا خفيفًا، فنُقلت بالواو. أما «ταύτας» فاسم إشارة يفيد في الأصل «هذه».
- source_word: συνέλαβεν
  choice: حبلت
  rationale: يدل الفعل في هذا السياق على الحبل بطفل، و«حبلت» تعبير عربي مباشر وموجز يوافق المعنى.
- source_word: Ἐλισάβετ
  choice: أليصابات
  rationale: الصيغة العربية الكتابية الشائعة للاسم اليوناني Ἐλισάβετ.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: امرأته
  rationale: يمكن أن تعني «γυνή» امرأة أو زوجة، لكن الإضافة إلى الضمير والسياق يحددان معنى الزوجة؛ و«امرأته» صياغة عربية طبيعية موجزة.
- source_word: περιέκρυβεν ἑαυτὴν
  choice: ظلّت تخفي نفسها
  rationale: تنقل هذه الصياغة معنى الإخفاء الانعكاسي، كما تُظهر الاستمرار الذي يفيده زمن الماضي الناقص اليوناني طوال المدة المذكورة.
- source_word: μῆνας πέντε
  choice: خمسة أشهر
  rationale: جاءت العبارة اليونانية في حالة النصب للدلالة على مدة زمنية، ويؤدي التركيب العربي المعنى بلا حاجة إلى حرف جر.
- source_word: λέγουσα
  choice: قائلةً
  rationale: تحافظ «قائلةً» على الصلة الحالية التي يؤديها اسم الفاعل اليوناني، وتمهد للقول الوارد في الآية التالية.
