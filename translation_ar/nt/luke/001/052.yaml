  rationale: تُستبدل «المقتدرين» بـ«أصحاب السلطان» لأن اقتران δυνάστας بالعروش يجعل دلالة الحكم بارزة، مع حفظ البديل الأوسع في الحاشية. وتُنقل علامة كل حاشية إلى اللفظ المعني. و«عروشهم» إضافة عربية طبيعية تستعيد علاقة المالك بالعرش المفهومة من السياق، لا معلومة تفسيرية مستقلة. ويُحافَظ على الماضي العربي المقابل للأوريست وعلى تقابل «أنزل/رفع».
