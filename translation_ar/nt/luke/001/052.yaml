  naturalness: الصياغة فصيحة وموجزة، لكن وضع العلامتين معًا في آخر الآية يجعل مرجع الحاشية الأولى غير واضح. وإضافة ضمير في «عروشهم» عربية طبيعية، وتعبّر عن علاقة مفهومة من السياق دون تغيير المعنى.
