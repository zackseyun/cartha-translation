lexical_decisions:
- source_word: καθεῖλεν
  choice: أَنْزَلَ
  rationale: ينقل معنى الحطّ من مقام عالٍ بعبارة عربية طبيعية، من غير أن يخصّ الفعل بالعزل السياسي أو بالإسقاط العنيف.
- source_word: δυνάστας
  choice: الْمُقْتَدِرِينَ
  rationale: يدل اللفظ اليوناني على أصحاب القوة أو السلطان. ويحفظ «المقتدرين» سعته، بينما تجعل صورة العروش معنى الحكام حاضرًا بقوة.
- source_word: ἀπὸ θρόνων
  choice: عَنْ عُرُوشٍ
  rationale: يحفظ الصورة المحسوسة في اليونانية من غير إضافة ضمير ملكية غير مذكور في النص.
- source_word: ὕψωσεν
  choice: رَفَعَ
  rationale: لفظ عربي واضح يجمع بين الرفع في المنزلة وصدى المقابلة المكانية مع الإنزال.
- source_word: ταπεινούς
  choice: الْمُتَوَاضِعِينَ
  rationale: يحفظ معنى الاتضاع، مع التنبيه في الحاشية إلى إمكان دلالة اللفظ أيضًا على دنو المكانة الاجتماعية.
theological_decisions:
- issue: دلالة الماضي في أفعال نشيد مريم
  choice: 'صيغة الماضي العربية: «أَنْزَلَ ... وَرَفَعَ»'
  alternative: «قد أَنْزَلَ ... وقد رَفَعَ» أو صياغة أقرب إلى المضارع العام
  rationale: الماضي هو المقابل العربي المباشر لصيغة الأوريست، ويصلح في سياق التسبيح لوصف فعل الله الحاسم من غير حسم ما إذا كان الكلام تلخيصًا تاريخيًا أو يقينًا نبويًا أو إعلانًا ذا دلالة مستمرة.
