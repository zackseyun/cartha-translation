  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: ar
  text: كما كلَّم آباءنا[a]، إبراهيم ونسله[b]، إلى الأبد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أسلافنا». واليونانية حرفيًا: «آباءنا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ذريته». تستعمل اليونانية اسمًا جمعيًا مفردًا يمكن أن يعني «زرعًا» أو «نسلًا» أو «ذرية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: كما
  rationale: تفيد المطابقة مع ما سبق، وهي صياغة عربية طبيعية تحافظ على معنى موافقة الفعل للوعد السابق.
- source_word: ἐλάλησεν
  choice: كلَّم
  rationale: يناسب حرف الجر πρὸς ومعنى توجيه الكلام إلى الآباء، كما يوضح أن إبراهيم ونسله متلقّيا الوعد.
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: آباءنا
  rationale: يحافظ على اللفظ اليوناني المذكر وعلى صداه العهدي، مع إمكان فهمه بمعنى الأسلاف.
- source_word: τῷ Ἀβραὰμ
  choice: إبراهيم
  rationale: بدل من «آباءنا» يحدّد إبراهيم بوصفه المقصود الأول، وتغني بنية الفعل العربي عن تكرار حرف الجر.
- source_word: τῷ σπέρματι αὐτοῦ
  choice: نسله
  rationale: لفظ «نسل» عربي طبيعي وهو اسم جمعي مفرد، فيحافظ على صورة المفرد الجمعي في σπέρμα وعلى الصدى العهدي.
- source_word: εἰς τὸν αἰῶνα
  choice: إلى الأبد
  rationale: تعبير عربي مألوف يؤدي معنى الدوام في هذا السياق.
theological_decisions:
- issue: دلالة «آباءنا» في سياق تاريخ العهد
  choice: آباءنا
  alternative: أسلافنا
  rationale: أُبقيت الصيغة المذكرة الصريحة لما لها من صدى أبوي وعهدي، مع إثبات البديل الأوسع دلالة في الحاشية.
- issue: دلالة σπέρματι αὐτοῦ في وعد إبراهيم
  choice: نسله
  alternative: ذريته
  rationale: «نسله» يحافظ على الاسم الجمعي المفرد ولا يحصر المرجع في فرد واحد أو يحوله صراحة إلى جمع، وبذلك يصون الاحتمال النصي والصدى العهدي.
- issue: العلاقة النحوية بين «آباءنا» و«إبراهيم ونسله»
  choice: إبراهيم ونسله بدل أو بيان لما قبله
  alternative: 'تكرار حرف الجر: «لإبراهيم ولنسله»'
  rationale: تركيب اليونانية يحتمل أن يبيّن العبارة اللاحقة من هم الآباء أو من يشملهم القول. الصياغة العربية بالفاصلة تحافظ على هذا الارتباط من غير إضافة تفسير حاسم.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «كلَّم» بدل «تكلَّم إلى» لطبيعته في العربية، وحُفظت «آباءنا» و«نسله» لصونهما الصدى العهدي وصيغة المصدر.
