  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: ar
  text: 'فقالوا لها: «ليس بين أقاربك أحدٌ يُدعى بهذا الاسم».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: فقالوا لها
  rationale: ينقل فعل القول في السرد وعلاقة المخاطبة التي تدل عليها πρός مع ضمير النصب، بصياغة عربية طبيعية.
- source_word: Οὐδείς ἐστιν ἐκ τῆς συγγενείας σου
  choice: ليس بين أقاربك أحدٌ
  rationale: صياغة عربية واضحة تنقل النفي المطلق والبنية التبعيضية، وتعبّر «أقاربك» عن جماعة ذوي القرابة دون حصرها في الأسرة المنزلية.
- source_word: ὃς καλεῖται
  choice: يُدعى
  rationale: ينقل المضارع المبني للمجهول في سياق التسمية بصورة موجزة وفصيحة.
- source_word: τῷ ὀνόματι τούτῳ
  choice: بهذا الاسم
  rationale: يحافظ على اسم الإشارة القريب τούτῳ وعلى الدلالة الاصطلاحية لتركيب التسمية.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. روعي ترتيب عربي طبيعي مع الحفاظ على معنى النص اليوناني وبنيته الأساسية. لا تستدعي الآية حاشية؛ فالبديل «من أهل قرابتك» لا يضيف غموضًا نصيًا أو دلاليًا جوهريًا.
