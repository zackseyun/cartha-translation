  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: ar
  text: وحدث أنه، لما سمعت أليصابات تحية مريم[a]، قفز الطفل في رحمها، وامتلأت أليصابات من الروح القدس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سلام مريم».'
    reason: بديل معجمي محتمل لـ«تحية»، إذ قد تشير ἀσπασμός إلى كلمات السلام عند اللقاء.
lexical_decisions:
- source_word: ἐγένετο
  choice: حدث أنه
  rationale: يحفظ الصيغة السردية اللوقاوية من غير استعمال تعبير عربي عتيق أو ثقيل.
- source_word: ὡς
  choice: عندما
  rationale: يفيد التوقيت والتعاقب المباشر بصورة طبيعية في العربية.
- source_word: ἀσπασμός
  choice: تحية
  rationale: يدل هنا على كلمات مريم عند لقائها أليصابات، وهو تعبير عربي واضح ومعاصر.
- source_word: ἐσκίρτησεν
  choice: قفز
  rationale: ينقل الحركة المفاجئة الحية التي يدل عليها الفعل، بدل تخفيفها إلى مجرد التحرك.
- source_word: βρέφος
  choice: الجنين
  rationale: يشير في هذا السياق إلى الطفل وهو في رحم أمه؛ و«الجنين» هو التعبير العربي الطبيعي والدقيق هنا.
- source_word: κοιλία
  choice: بطنها
  rationale: المقصود في السياق موضع الجنين في جسد أليصابات، و«بطنها» تعبير عربي طبيعي لا يغيّر المعنى.
- source_word: ἐπλήσθη
  choice: امتلأت
  rationale: يحفظ صورة الامتلاء وصيغة الفعل المبني للمجهول دلاليًا من غير شرح زائد.
- source_word: πνεύματος ἁγίου
  choice: الروح القدس
  rationale: العبارة في سياق لوقا تشير إلى روح الله الذي يمنح الإلهام النبوي، والتعريف هو الصياغة العربية المألوفة لهذا المرجع.
theological_decisions:
- issue: مرجع πνεύματος ἁγίου
  choice: الروح القدس، أي روح الله
  alternative: روح مقدس غير معيّن
  rationale: الاستعمال اللوقاوي والسياق النبوي يرجحان أن المقصود روح الله، من غير إضافة تفصيل عقائدي غير مذكور في النص.
- issue: تسمية βρέφος وهو في الرحم
  choice: الجنين
  alternative: الطفل أو الرضيع
  rationale: يحافظ هذا الاختيار على الإشارة الملموسة إلى يوحنا قبل ولادته، من غير إدخال تعليق لاهوتي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. أُبقيت الصيغة السردية «وحدث أنه»، واستُخدم «قفز» للمحافظة على حيوية الفعل اليوناني.
