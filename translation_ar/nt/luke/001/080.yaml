  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: ar
  text: وكان الطفل ينمو ويتقوّى في الروح[a]، وكان في البراري[b] إلى يوم ظهوره أمام إسرائيل[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالروح». قد يُفهم اليوناني بمعنى القوة الباطنية أو الروحية عمومًا، أو بمعنى القوة المرتبطة بالروح القدس على وجه أخص.'
    reason: alternative_reading
  - marker: b
    text: 'اليونانية بصيغة الجمع، أي حرفيًا: «في المناطق البرية» أو «في الأماكن المقفرة».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يوم إعلانه لإسرائيل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: الطفل
  rationale: لفظ عربي طبيعي وواسع يشير إلى يوحنا في حداثته من غير أن يحدد مرحلة عمرية أضيق.
- source_word: ηὔξανε
  choice: كان ينمو
  rationale: ينقل دلالة الماضي الناقص على النمو المستمر.
- source_word: ἐκραταιοῦτο
  choice: يتقوّى
  rationale: يحفظ معنى العملية المتواصلة، ولا يحسم بين الدلالة الانفعالية «كان يُقوّى» والدلالة اللازمة «كان يزداد قوة».
- source_word: πνεύματι
  choice: في الروح
  rationale: يحافظ على الصياغة العامة في اليونانية، التي قد تدل على القوة الباطنية أو الروحية ولا تُصرّح هنا بأن المقصود هو الروح القدس.
- source_word: ἐν ταῖς ἐρήμοις
  choice: في البراري
  rationale: يجمع بين طبيعية العربية والمحافظة على صيغة الجمع اليونانية وعلى معنى الأماكن المقفرة، من غير تضييقها إلى الصحارى الرملية.
- source_word: ἀναδείξεως
  choice: ظهوره
  rationale: يؤدي معنى إبرازه أو ظهوره العلني بعبارة عربية واضحة؛ وتوضح الحاشية احتمال «إعلانه».
- source_word: πρὸς τὸν Ἰσραήλ
  choice: لإسرائيل
  rationale: يفيد توجّه ظهوره نحو شعب إسرائيل بوصفهم الجمهور المقصود، مع إبقاء بديل «أمام إسرائيل» في الحاشية.
theological_decisions:
- issue: دلالة πνεύματι في نمو يوحنا
  choice: في الروح
  alternative: بالروح، أي بالروح القدس؛ أو روحيًا
  rationale: لا توجد أداة تعريف في النص ولا يعيّن السياق هنا الروح القدس تعيينًا صريحًا؛ لذلك تُحفظ سعة الدلالة والتوتر اللاهوتي في المتن وتُذكر القراءات الممكنة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «البراري» للمحافظة طبيعيًا على جمع ἐρήμοις، و«ظهوره» لعبارة موجزة مفهومة، مع وضع علامات الحواشي بعد الألفاظ التي تشرحها مباشرة.
