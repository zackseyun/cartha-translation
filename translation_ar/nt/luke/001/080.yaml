  source_fidelity: المتن ينقل نمو الطفل وتقوّيه وإقامته في مواضع البرية إلى وقت ظهوره العام نقلًا قريبًا من اليونانية. لكن «لإسرائيل» قد تُفهم عربيًا على أنها تفيد المنفعة أو الاختصاص أكثر من توجّه الظهور إلى إسرائيل بوصفه الجمهور المخاطَب؛ و«أمام إسرائيل» أوضح لهذا المعنى.
