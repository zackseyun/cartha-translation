  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: ar
  text: فظهر له ملاك الرب، واقفًا عن يمين مذبح البخور.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: ظهر
  rationale: صيغة المبني للمجهول من ὁράω تُستعمل هنا بمعنى لازم في السرد، أي «ظهر»، وهو تعبير عربي طبيعي ينقل حدوث الظهور المرئي.
- source_word: δὲ
  choice: فـ
  rationale: تفيد هنا استمرار السرد وتقدّمه، والفاء تربط الحدث بما سبقه طبيعيًا من غير أن تضيف معنى تعارض.
- source_word: αὐτῷ
  choice: له
  rationale: يحفظ المفعول الذي وقع له الظهور، وهو زكريا، وفق الاستعمال المعتاد مع ὤφθη.
- source_word: ἄγγελος
  choice: ملاك
  rationale: السياق رؤيا في الهيكل ويشير بوضوح إلى كائن سماوي، لذلك «ملاك» أدق من «رسول».
- source_word: κυρίου
  choice: من عند الرب
  rationale: ينقل تركيب ἄγγελος κυρίου بعبارة عربية واضحة تدل على أن الملاك تابع للرب ومرسَل من حضرته، من دون الإيحاء بأن «الرب» اسم للملاك.
- source_word: ἑστὼς
  choice: واقفًا
  rationale: يصف هيئة الملاك وموقعه وقت ظهوره؛ وصيغة الحال هي الأنسب في العربية.
- source_word: ἐκ δεξιῶν
  choice: عن يمين
  rationale: تعبير عربي فصيح وطبيعي عن الموقع الواقع إلى الجهة اليمنى.
- source_word: τοῦ θυσιαστηρίου τοῦ θυμιάματος
  choice: مذبح البخور
  rationale: التركيب الإضافي يحدد المذبح بأنه المخصص للبخور، و«مذبح البخور» هو التعبير العربي الموجز والمألوف.
theological_decisions:
- issue: ترجمة κύριος في عبارة ἄγγελος κυρίου
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ اللقب الكتابي في السياق الإلهي، ولا يضيف تحديدًا مذهبيًا يتجاوز النص.
- issue: دلالة تركيب ἄγγελος κυρίου
  choice: ملاك من عند الرب
  alternative: ملاك الرب
  rationale: البديل الحرفي «ملاك الرب» صحيح، لكن «من عند الرب» أوضح للقارئ المعاصر في بيان المصدر أو التبعية، مع بقاء هوية الملاك متميزة عن الرب.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُخدمت الفاء لتقدّم السرد، وصيغة الحال «واقفًا» للمشاركة اليونانية، من دون حواشٍ لعدم وجود غموض نصي يحتاج إلى شرح.
