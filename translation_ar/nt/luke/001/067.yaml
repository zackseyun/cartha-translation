  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: ar
  text: 'وامتلأ زكريا أبوه من الروح القدس، وتنبأ قائلًا:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζαχαρίας
  choice: زكريا
  rationale: الصيغة العربية الكتابية المألوفة للاسم، وهي واضحة وطبيعية للقارئ العربي.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: أبوه
  rationale: تعبير عربي موجز وطبيعي يحفظ الإحالة إلى والد الطفل المذكور في السياق.
- source_word: ἐπλήσθη
  choice: امتلأ
  rationale: يحفظ معنى الحدث في صيغة الماضي، وهو التعبير العربي المألوف مع الروح القدس؛ وتؤدي صيغة المطاوعة معنى المبني للمجهول اليوناني طبيعيًا دون افتعال.
- source_word: πνεύματος ἁγίου
  choice: من الروح القدس
  rationale: حرف الجر «من» فصيح مع «امتلأ»، و«الروح القدس» يعبّر عن روح الله المقصود في سياق الإلهام عند لوقا.
- source_word: ἐπροφήτευσεν
  choice: تنبأ
  rationale: المقابل العربي المباشر للفعل، ويحفظ دلالة النطق النبوي الملهم دون شرح زائد.
- source_word: λέγων
  choice: قائلًا
  rationale: يحفظ البناء الحالي الذي يمهّد لمضمون النبوءة التالية، بصياغة عربية سلسة.
- source_word: Καὶ
  choice: و
  rationale: تحفظ استمرارية السرد التي تفيدها أداة العطف اليونانية، وتلائم الأسلوب العربي.
theological_decisions:
- issue: مرجع πνεύματος ἁγίου
  choice: الروح القدس
  alternative: روح مقدس
  rationale: يشير التعبير في سياق لوقا، ولا سيما في مشاهد الإلهام الإلهي، إلى روح الله؛ لذلك يحفظ التعريف المرجع المقصود من غير إضافة تفصيل عقائدي غير منصوص عليه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة، مع الحفاظ على إيقاع السرد الكتابي. لا حاجة إلى حاشية لأن النص لا يتضمن غموضًا نصيًا أو دلاليًا يستلزم التنبيه هنا.
