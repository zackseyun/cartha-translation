  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: ar
  text: وها إن أليصابات قريبتك قد حبلت هي أيضًا بابن في شيخوختها، وهذا شهرها السادس، وهي التي كانت تُدعى عاقرًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: وها إن
  rationale: أداة تنبيه طبيعية وفصيحة في العربية، تنقل دعوة المخاطَبة إلى الالتفات إلى الخبر من غير استعمال تعبير قديم ثقيل.
- source_word: συγγενίς
  choice: نسيبتك
  rationale: يدل اللفظ على قريبة أو امرأة من ذوي القرابة من غير تحديد درجة القرابة؛ و«نسيبتك» تحافظ على هذا العموم.
- source_word: συνείληφεν υἱόν
  choice: قد حبلت ... بابن
  rationale: ينقل معنى الحمل بطفل ذكر بوضوح، مع «قد» للدلالة على تحقق الخبر.
- source_word: ἐν γήρει αὐτῆς
  choice: في شيخوختها
  rationale: مقابل مباشر يحفظ الإشارة إلى تقدمها في السن.
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: للتي كانت تُدعى عاقرًا
  rationale: يحافظ على المبني للمجهول وعلى كون هذا وصفًا كان الناس يطلقونه عليها، دون تقرير أنه هويتها الدائمة.
theological_decisions:
- issue: درجة قرابة أليصابات بمريم
  choice: نسيبتك
  alternative: قريبتك
  rationale: النص اليوناني لا يحدد صلة بعينها مثل ابنة الخال أو ابنة العم؛ لذلك تُركت درجة القرابة غير محددة.
- issue: وصف أليصابات بالعقر
  choice: كانت تُدعى عاقرًا
  alternative: هي العاقر
  rationale: الصياغة تتبع النص في نسبة الوصف إلى ما كانت تُسمّى به، وتحفظ التوتر بين ماضيها المعروف وحملها الحاضر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ ترتيب الأفكار والتوكيد في «هي أيضًا»، مع صياغة طبيعية مفهومة للقارئ المعاصر.
