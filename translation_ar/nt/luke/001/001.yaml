source:
  edition: SBLGNT
  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: ar
  text: بما أن كثيرين قد شرعوا في تأليف سردٍ عن الأمور التي تمّت بيننا،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أُنجزت»، أو «تأكَّدت لدينا تمامًا».
    reason: بدائل معجمية تحفظ احتمال أن يدل الفعل على الإنجاز أو على التحقق التام.
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: بما أن
  rationale: تؤدي معنى التمهيد السببي الذي يفتتح به لوقا مقدمته، بلغة عربية فصيحة وواضحة، من غير تكلف في تمثيل أداة التوكيد الملحقة.
- source_word: πολλοὶ
  choice: كثيرين
  rationale: تنقل الدلالة الكمية مباشرة من غير إضافة «آخرين»، فهي غير مصرّح بها في اليونانية.
- source_word: ἐπεχείρησαν
  choice: قد شرعوا
  rationale: يدل الفعل هنا على مباشرة عمل أدبي، ولا يلزم منه أن المحاولة أخفقت؛ لذلك تجنبت «حاولوا».
- source_word: ἀνατάξασθαι
  choice: في تأليف
  rationale: يعبر عن جمع المادة وصوغها في عمل مكتوب منظم، وهو طبيعي في العربية ضمن هذا السياق الأدبي.
- source_word: διήγησιν
  choice: رواية
  rationale: تنقل معنى السرد أو العرض المتتابع للأحداث، وتلائم نبرة المقدمة التاريخية الأدبية.
- source_word: περὶ
  choice: عن
  rationale: صياغة عربية طبيعية واضحة تؤدي معنى تعلق الرواية بموضوعها.
- source_word: τῶν πεπληροφορημένων
  choice: التي تمّت
  rationale: تحافظ على معنى بلوغ الأمور تمامها أو إنجازها، ولا تحصر اللفظ في معنى اليقين أو الإثبات؛ وأُثبتت الاحتمالات المعجمية الأخرى في الحاشية.
- source_word: ἐν ἡμῖν
  choice: بيننا
  rationale: تحفظ الدلالة الجماعية من غير تعيين المقصودين بـ«نا» أو إضافة وصف غير موجود في النص.
- source_word: πραγμάτων
  choice: الأمور
  rationale: تحافظ على سعة اللفظ اليوناني الذي قد يشمل الأحداث والأعمال والوقائع، بدل تضييقه إلى «الأحداث» وحدها.
theological_decisions:
- issue: دلالة πεπληροφορημένων في مقدمة لوقا
  choice: تمّت
  alternative: أُنجزت؛ ثبتت تمامًا
  rationale: يرجح مع «الأمور» وسياق الرواية معنى الإتمام أو الإنجاز، مع إمكان فهم اللفظ من جهة التحقق التام؛ لذلك حُفظت القراءات الممكنة في الحاشية من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة أدبية رصينة تناسب افتتاح مقدمة لوقا. تُركت الجملة منتهية بفاصلة لأنها تتصل نحويًا بما يليها.
