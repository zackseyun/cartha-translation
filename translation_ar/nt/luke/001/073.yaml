lexical_decisions:
- source_word: ὅρκον
  choice: القَسَمَ
  rationale: اسم منصوب يتبع تركيب الآية السابقة، ويشير إلى القَسَم المحدد المذكور في السياق.
- source_word: ὃν ὤμοσεν
  choice: الذي حلفه
  rationale: يحافظ على صلة الموصول وعلى الارتباط اللفظي الطبيعي في العربية بين القَسَم والحلف.
- source_word: πρὸς Ἀβραὰμ
  choice: لإبراهيم
  rationale: اللام تؤدي بوضوح معنى توجيه القَسَم إلى إبراهيم في هذا السياق.
- source_word: τὸν πατέρα ἡμῶν
  choice: أبينا
  rationale: يحفظ التعبير العائلي والعهدي في اليونانية، بدل اختزاله إلى مجرد النسب التاريخي.
- source_word: τοῦ δοῦναι ἡμῖν
  choice: أن يمنحنا
  rationale: ينقل المصدر المعرّف الذي يبين مضمون القَسَم أو غايته، ويظل التركيب مفتوحًا ليكتمل في الآية التالية.
theological_decisions:
- issue: لغة العهد المرتبطة بإبراهيم
  choice: أبينا
  alternative: سلفنا
  rationale: يحافظ «أبينا» على العبارة الكتابية العهدية الواردة حرفيًا في اليونانية، من غير إضافة تفسير عقائدي.
- issue: علاقة τοῦ δοῦναι بالقَسَم
  choice: أن يمنحنا
  alternative: لكي يمنحنا
  rationale: اختير تركيب يحتمل بيان مضمون القَسَم أو غايته، فلا يحسم الغموض النحوي الأصيل بإدخال أداة غائية صريحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مهيبة تلائم نشيد زكريا. يبدأ النص منصوبًا لاتصاله نحويًا بالآية السابقة، وينتهي تركيبُه مفتوحًا لأنه يكتمل في الآية التالية.
