  source_fidelity: 'النص العربي يحافظ بدقة على البنية التابعة للنص اليوناني: «القَسَمَ» مفعولٌ يمتد من الآية السابقة، و«الذي حلفه» ينقل الموصول والفعل، و«لإبراهيم أبينا» يؤدي πρὸς Ἀβραὰμ τὸν πατέρα ἡμῶν، و«أن يمنحنا» يحافظ على المصدر ذي الأداة وعلى انفتاح التركيب إلى الآية التالية. ولا يفرض تفسيرًا حاسمًا لعلاقة المصدر بالقسم يتجاوز ما يحتمله الأصل.'
