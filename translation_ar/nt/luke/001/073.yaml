  terminology: «القَسَم» و«حلفه» يحفظان الارتباط المعجمي بين ὅρκον وὤμοσεν. و«أبينا» ينقل لغة الأبوة العهدية دون تحميلها تقريرًا مذهبيًا. الحاشية تقدم «سلفنا» بديلًا مع بيان أن اللفظ اليوناني الحرفي هو «أبينا».
