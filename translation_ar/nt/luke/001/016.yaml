lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حُفظ حرف العطف في صدر العبارة لربطها بما قبلها واستمرار تدفق السرد.
- source_word: πολλοὺς
  choice: كثيرين
  rationale: الصفة مستعملة استعمال الاسم، وصيغة «كثيرين» العربية موجزة وطبيعية مع المفعول به العاقل.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: من بني إسرائيل
  rationale: «بنو إسرائيل» تعبير عربي كتابي راسخ يحفظ البنية العهدية التقليدية ومعنى النسب، وهو أفصح من الترجمة الحرفية «أبناء إسرائيل» في هذا السياق.
- source_word: ἐπιστρέψει
  choice: سيردُّ
  rationale: الفعل مستقبل متعدٍّ، ويوحنا هو الفاعل الذي يتسبب في رجوع كثيرين. «سيردّ» يحفظ السببية ولا يحمّل العبارة المصطلح التفسيري «يُهدي» أو «يحوّل».
- source_word: ἐπὶ
  choice: إلى
  rationale: مع ἐπιστρέφω والمفعول به يفيد توجيه الرجوع نحو شخص، و«إلى» هي المقابل العربي الطبيعي.
- source_word: κύριον
  choice: الرب
  rationale: السياق يعيّن إله إسرائيل، لا سيدًا بشريًا، و«الرب» يحفظ الثقل العهدي واللاهوتي.
- source_word: τὸν θεὸν αὐτῶν
  choice: إلههم
  rationale: بدلٌ أو بيان من «الرب»، وصيغة «إلههم» طبيعية وتحفظ علاقة العهد التي في العبارة.
theological_decisions:
- issue: صياغة التعبير العهدي τῶν υἱῶν Ἰσραὴλ
  choice: من بني إسرائيل
  alternative: من أبناء إسرائيل؛ من الإسرائيليين
  rationale: «بنو إسرائيل» هو التعبير العربي الموروث والواضح الذي يحفظ دلالة النسب والرنين الكتابي، من غير حصر المقصود عمليًا في الأبناء المباشرين.
- issue: مرجع κύριον τὸν θεὸν αὐτῶν
  choice: الرب إلههم
  alternative: سيدهم، إلههم
  rationale: العبارة نفسها تعرّف «الرب» بأنه إله إسرائيل، لذلك لا يُفهم κύριος هنا بمعنى سيد بشري.
- issue: القوة السببية للفعل ἐπιστρέψει
  choice: سيردُّ
  alternative: سيُرجع؛ سيعود بكثيرين
  rationale: حُفظ كون يوحنا فاعلًا في ردّ كثيرين إلى الله، من دون تفسير طبيعة هذا التأثير تفسيرًا مذهبيًا أو إلغاء استجابتهم الضمنية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. اختير «سيردّ» لصون تعدية الفعل و«بني إسرائيل» لصون التعبير العهدي المألوف. وُضعت علامة الحاشية [a] في النص بعد الجملة المعنية.
