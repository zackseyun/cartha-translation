  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: ar
  text: في أيام هيرودس، ملك اليهودية، كان كاهن اسمه زكريا، من فرقة أبيا[a]؛ وكانت له زوجة من بنات هارون[b]، واسمها أليصابات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كانت «فرقة أبيا» واحدة من فرق الكهنة التي كانت تتناوب خدمة الهيكل.
    reason: cultural_note
  - marker: b
    text: 'أي: من نسل هارون. واليونانية تقول حرفيًا: «من بنات هارون»، وهي عبارة تدل على انتمائها إلى السلالة الكهنوتية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο ἐν ταῖς ἡμέραις
  choice: في أيام ... كان
  rationale: تؤدي صيغة الاستهلال السردي والعبارة الزمنية بعربية طبيعية، من غير ترجمة حرفية متكلفة مثل «حدث في الأيام».
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: هيرودس، ملك اليهودية
  rationale: ينقل تركيب الإضافة الذي يعرّف هيرودس بمنصبه وإقليمه، مع اعتماد «اليهودية» للدلالة التاريخية الجغرافية.
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: كاهن اسمه زكريا
  rationale: أداة التنكير العربية تنقل وظيفة τις في تقديم شخصية جديدة، و«اسمه» تعبير طبيعي عن صيغة التسمية.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: من فرقة أبيا
  rationale: تشير ἐφημερία إلى فرقة من فرق الكهنة المناوبة في خدمة الهيكل؛ و«فرقة» موجزة وواضحة.
- source_word: γυνὴ αὐτῷ
  choice: كانت له زوجة
  rationale: ينقل الداتيف الدال على الملكية بعربية سليمة، ويحافظ على توازي السرد مع «كان كاهن».
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: من بنات هارون
  rationale: يحافظ على الصورة العائلية الملموسة في اليونانية، مع بيان دلالتها النسبية في الحاشية.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: واسمها أليصابات
  rationale: صيغة عربية طبيعية ومباشرة لعبارة التسمية.
- source_word: Ζαχαρίας / Ἐλισάβετ / Ἀβιά / Ἀαρών
  choice: زكريا / أليصابات / أبيا / هارون
  rationale: أشكال عربية كتابية شائعة وواضحة للأسماء، من غير ترجمة دلالاتها.
theological_decisions:
- issue: صياغة نسب أليصابات إلى هارون
  choice: من بنات هارون
  alternative: من نسل هارون
  rationale: النص اليوناني يقول حرفيًا «من بنات هارون». إبقاء العبارة يصون الصورة والنبرة الكهنوتية، بينما توضح الحاشية أن المقصود الانتساب إلى نسله من غير إضافة تقرير عقائدي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. حوفظ على الجملة الواحدة والفاصلة المنقوطة لإبراز ترابط جزأي الآية، ووُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحانهما فعلًا.
