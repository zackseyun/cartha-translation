base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: ar
  text: 'فقال لها الملاك: «لا تخافي يا مريم، لأنك وجدتِ حظوةً عند الله.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نعمةً»؛ فالكلمة اليونانية χάρις قد تعني «النعمة» أو «الحظوة»، لكن تعبير «وجد حظوةً عند الله» أنسب لهذا السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: فقال
  rationale: صيغة الماضي السردي من λέγω، والفاء تلائم اتصال القول بالسياق القصصي العربي.
- source_word: ἄγγελος
  choice: الملاك
  rationale: المرجع في سياق رواية الميلاد كائن سماوي، ولذلك «الملاك» أدق من «الرسول» أو «المرسَل».
- source_word: Μὴ φοβοῦ
  choice: لا تخافي
  rationale: نهي موجَّه إلى مريم، وصيغة المؤنث العربية طبيعية وواضحة.
- source_word: Μαριάμ
  choice: مريم
  rationale: الصيغة العربية الراسخة للاسم.
- source_word: εὗρες
  choice: وجدتِ
  rationale: يحافظ الماضي على صيغة الفعل اليوناني، بينما يبيّن السياق أن أثر ما وجدته قائم وقت الخطاب.
- source_word: χάριν
  choice: حظوةً
  rationale: في تركيب «وجد حظوة عند» تنقل الكلمة معنى القبول والرضا ضمن تعبير عربي طبيعي، من غير تحميلها معنى اصطلاحيًا لاحقًا.
- source_word: παρὰ τῷ θεῷ
  choice: عند الله
  rationale: يعبر طبيعيًا عن نيل الحظوة في نظر الله أو لديه، وهو المقصود بتركيب παρά مع المجرور هنا.
theological_decisions:
- issue: ترجمة χάριν في سياق مريمي
  choice: حظوةً
  alternative: نعمةً
  rationale: التركيب اليوناني εὑρίσκω χάριν παρά تعبير مألوف يفيد «وجد حظوة عند». وتُذكر «نعمة» في الحاشية بوصفها بديلًا معجميًا ممكنًا، من غير فرض دلالة عقائدية لاحقة على النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «حظوة» لأنها تلائم التعبير الاصطلاحي «وجد حظوة عند» وتحفظ التمييز عن الاستعمالات اللاهوتية الاصطلاحية المحتملة لكلمة «نعمة».
