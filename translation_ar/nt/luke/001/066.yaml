  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: «كل الذين سمعوا»، وحفظ الأمر في القلب، والاستفهام الاستنتاجي عن مستقبل الطفل، والتعليل بأن «يد الرب كانت معه». ويحافظ «سيكون» على بساطة ἔσται وغموضها، كما يحافظ «معه» على معنى μετά المباشر.'
