  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: ar
  text: 'وكل الذين سمعوا وضعوا ذلك في قلوبهم، قائلين: «فماذا سيكون هذا الطفل؟»[a] لأن يد الرب كانت معه.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فماذا سيصير هذا الطفل؟» الفعل اليوناني يعني حرفيًا «سيكون»، والسياق يجعل السؤال متعلقًا بمستقبل الطفل أو شأنه.'
    reason: lexical_alternative
  - marker: b
    text: «يد الرب» تعبير كتابي يشير إلى فعل الله وقوته أو عنايته، من غير أن يحصر المعنى في واحد منها.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: وضعوا ذلك في قلوبهم
  rationale: يحافظ على صورة الأصل، أي حفظ الأمر والتأمل فيه بجدية، بصياغة عربية كتابية واضحة.
- source_word: πάντες οἱ ἀκούσαντες
  choice: كل الذين سمعوا
  rationale: ينقل العبارة الاسمية الموصولة من غير إضافة مرجع غير مصرّح به في اليونانية.
- source_word: Τί ἄρα
  choice: فماذا
  rationale: الفاء تنقل دلالة ἄρα الاستنتاجية، إذ ينبني السؤال على الأحداث السابقة.
- source_word: τὸ παιδίον τοῦτο
  choice: هذا الطفل
  rationale: تعبير طبيعي لا يفرط في تحديد العمر أو الدور.
- source_word: ἔσται
  choice: سيكون
  rationale: يحافظ على بساطة فعل الكينونة وعلى الغموض المقصود بشأن هوية الطفل أو شأنه في المستقبل.
- source_word: καὶ γὰρ
  choice: لأن
  rationale: تؤدي الوظيفة التعليلية الطبيعية للتركيب في السياق، من غير نقل حرفي ثقيل للجسيمين.
- source_word: χεὶρ κυρίου
  choice: يد الرب
  rationale: يحفظ الاستعارة الكتابية التي تدل على فعل الله أو قوته أو عنايته دون حصر معناها في تفسير واحد.
- source_word: μετ’ αὐτοῦ
  choice: كانت معه
  rationale: ينقل معنى المصاحبة المباشر، والضمير يعود طبيعيًا إلى الطفل.
theological_decisions:
- issue: دلالة «يد الرب كانت معه»
  choice: الإبقاء على الاستعارة كما هي
  alternative: كان الرب يعينه / كانت قوة الله عليه
  rationale: لا يحدد النص هل المقصود العون أو القوة أو الرعاية أو الرضا؛ لذلك يحافظ نقل الصورة على سعة الدلالة والتوتر اللاهوتي.
- issue: دلالة ἔσται في السؤال عن مستقبل الطفل
  choice: سيكون
  alternative: سيصير
  rationale: «سيكون» أقرب إلى الفعل اليوناني ويحفظ احتمال السؤال عن هوية الطفل أو شأنه أو دوره، بدل ترجيح معنى التطور إلى حالة جديدة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية موقرة. حُفظت استعارتا القلب واليد، كما حُفظ الغموض في سؤال مستقبل الطفل.
