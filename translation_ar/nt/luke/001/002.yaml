  text: just as those who from the beginning were eyewitnesses and became servants of the word handed them down to us,[a]
translation:
  language: ar
  text: كما نقل إلينا الذين كانوا منذ البدء شهودَ عيان، وصاروا خُدّامًا للكلمة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للرسالة». يمكن أن تعني الكلمة اليونانية λόγος «الكلمة» أو «الرسالة» أو «الرواية»، ويُرجَّح هنا أنها تشير إلى الرسالة المعلنة عن يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: كما
  rationale: تؤدي معنى المطابقة والارتباط بما سبق بأسلوب عربي طبيعي.
- source_word: παρέδοσαν
  choice: سلَّمها
  rationale: يفيد الفعل نقل المادة المتلقاة إلى آخرين بأمانة، والضمير يعود إلى الأمور المذكورة في الآية السابقة.
- source_word: ἡμῖν
  choice: إلينا
  rationale: ترجمة مباشرة للمفعول غير المباشر.
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: الذين كانوا منذ البدء
  rationale: تحافظ على تعريف الجماعة وعلى الدلالة الزمنية للعبارة.
- source_word: αὐτόπται
  choice: شهودَ عيان
  rationale: تعبير عربي واضح ودقيق لمن شاهدوا الأحداث بأنفسهم.
- source_word: ὑπηρέται
  choice: خُدّامًا
  rationale: ينقل معنى القائمين بالخدمة من غير أن يفترض منصبًا كنسيًا رسميًا.
- source_word: γενόμενοι
  choice: صاروا
  rationale: يحافظ على دلالة الصيرورة في اسم الفاعل اليوناني، بدل تسويته إلى مجرد الكينونة.
- source_word: τοῦ λόγου
  choice: للكلمة
  rationale: يحافظ على الاتساع المعجمي للفظ λόγος، مع بيان البديل التفسيري الأرجح في الحاشية.
theological_decisions:
- issue: مرجع «الكلمة» (τοῦ λόγου)
  choice: الكلمة، مع إبقاء اللفظ واسع الدلالة
  alternative: الرسالة أو البشارة المعلنة عن يسوع
  rationale: يرجح في السياق أن المقصود هو الرسالة المعلنة عن يسوع، لا استعمال «الكلمة» لقبًا أقنوميًا؛ لكن الترجمة الرئيسية لا تحسم هذا الاتساع المعجمي دون ضرورة.
- issue: دلالة γενόμενοι وعلاقتها بشهود العيان والخدام
  choice: «كانوا منذ البدء شهود عيان، وصاروا خدامًا»
  alternative: «كانوا منذ البدء شهود عيان وخدامًا»
  rationale: اختيرت «صاروا» لإظهار معنى الصيرورة الذي يحمله اسم الفاعل، من غير إضافة ظرف مثل «ثم» يفرض تعاقبًا زمنيًا صريحًا غير موجود في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «شهود عيان» للتعبير الاصطلاحي الطبيعي، و«خُدّام» لتجنب الإيحاء بمنصب كنسي محدد. وُضعت فاصلة قبل «وصاروا» لتوضيح التمييز بين كونهم شهودًا منذ البدء وصيرورتهم خدامًا، من غير إدخال تعاقب زمني غير مصرّح به.
