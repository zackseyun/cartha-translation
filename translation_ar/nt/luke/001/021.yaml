  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: ar
  text: وكان الشعب ينتظر زكريا، ويتعجب من تأخره في المقدس[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي مبنى الهيكل المقدس نفسه، لا ساحات الهيكل الواسعة.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: الشعب
  rationale: اسم جمع يشير إلى جماعة المصلين المنتظرين في الخارج، و«الشعب» تعبير عربي واضح ومألوف في هذا السياق.
- source_word: προσδοκῶν
  choice: ينتظر
  rationale: جاء مع ἦν في تركيب يفيد الاستمرار في الماضي، فنقلته «كان... ينتظر» للمحافظة على المعنى الاستمراري.
- source_word: Ζαχαρίαν
  choice: زكريا
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: ἐθαύμαζον
  choice: يتعجب
  rationale: الماضي الناقص يدل على رد فعل مستمر، و«يتعجب» يحفظ معنى الدهشة دون أن يحوله إلى مجرد تساؤل.
- source_word: ἐν τῷ χρονίζειν
  choice: من تأخره
  rationale: المصدر المعرّف مع ἐν يبين الظرف أو باعث التعجب؛ و«من تأخره» صياغة عربية طبيعية تحافظ على أنه استغرق وقتًا أطول من المتوقع.
- source_word: ναῷ
  choice: المقدس
  rationale: ναός هنا هو مبنى الهيكل المقدس نفسه، لا مجموع ساحاته؛ لذا فـ«المقدس» أدق من «الهيكل» وحدها، مع توضيح المقصود في الحاشية.
- source_word: αὐτόν
  choice: ـه في «تأخره»
  rationale: الضمير في حالة النصب هو فاعل المصدر اليوناني، ونُقل في العربية ضميرًا مضافًا إلى المصدر.
