  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: ar
  text: لِأَنَّ الْقَدِيرَ صَنَعَ لِي عَظَائِمَ، وَقُدُّوسٌ اسْمُهُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «واسمه قدوس». يقدّم النص اليوناني كلمة «قدوس» على «اسمه» للتوكيد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لأنَّ
  rationale: تُبيّن سبب تعظيم مريم للرب في الآية السابقة، وتحفظ الدلالة السببية بعبارة عربية واضحة.
- source_word: ἐποίησέν
  choice: صنع
  rationale: فعل ماضٍ يدل على عمل إلهي حاسم تمّ لمصلحة مريم، و«صنع» ملائم في سياق الحديث عن عظائم الله.
- source_word: μοι
  choice: لي
  rationale: الداتيف هنا يفيد المنفعة؛ أي إن الله صنع عظائم لمصلحة مريم، لا مجرد أشياء حدثت لها.
- source_word: μεγάλα
  choice: عظائم
  rationale: صفة جمع محايد مستعملة استعمال الاسم، وتشير بإيجاز إلى أعمال عظيمة من غير تقييد معناها بنوع محدد.
- source_word: ὁ δυνατός
  choice: القدير
  rationale: الصفة المعرّفة مستعملة لقبًا لله. و«القدير» لقب عربي موجز ومهيب يحفظ معنى القوة والاقتدار.
- source_word: ἅγιον
  choice: قدوس
  rationale: خبر يصف اسم الله، وتقديمه في العربية يحفظ بروز الصفة في ترتيب اليونانية. واختيار «قدوس» يلائم أسلوب التسبيح واللقب الخبري هنا.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: اسمه
  rationale: ترجمة عربية مباشرة وطبيعية تحفظ لفظ «الاسم» بما يحمله في الاستعمال الكتابي من دلالة على الشخص وصفاته المعلنة.
theological_decisions:
- issue: صياغة ὁ δυνατός كلقب إلهي
  choice: القدير
  alternative: القوي؛ مَن هو قدير
  rationale: وجود أداة التعريف مع الصفة يجعلها اسمًا لقبيًا لله. «القدير» يحفظ هذه القوة اللقبية من غير إضافة مضمون مذهبي غير موجود في النص.
- issue: ترتيب الكلمات في καὶ ἅγιον τὸ ὄνομα αὐτοῦ
  choice: وقدوس اسمه
  alternative: واسمه قدوس
  rationale: تقديم «قدوس» يحافظ على توكيد الصفة في الأصل اليوناني، ويبقى طبيعيًا في أسلوب التسبيح العربي. تُذكر الصياغة البديلة في الحاشية لأنها أكثر اعتيادًا في النثر.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة تسبيح مهيبة. حافظت الصياغة على إيجاز الأصل وعلى تقديم صفة القداسة، وتجنبت التفسير الزائد أو إدخال اصطلاح مذهبي خاص.
