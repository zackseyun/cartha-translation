lexical_decisions:
- source_word: δὲ
  choice: ولما
  rationale: أُدمجت أداة الانتقال السردي في تركيب «ولما» الطبيعي بالعربية، من غير إضافة ظرف صريح بمعنى «الآن».
- source_word: ἐπλήσθη ὁ χρόνος
  choice: اكتمل الوقت
  rationale: يحافظ على صورة اكتمال المدة في اليونانية، وهي هنا مدة الحمل، مع وضوح العبارة بالعربية المعاصرة.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: لتلد أليصابات
  rationale: ينقل مصدر الولادة بعبارة عربية واضحة، ويُظهر مرجع الضمير بالاسم تجنبًا للالتباس.
- source_word: ἐγέννησεν
  choice: ولدت
  rationale: فعل عربي طبيعي ومباشر يصف وقوع الولادة، ويحافظ على تتابع السرد.
- source_word: υἱόν
  choice: ابنًا
  rationale: ينقل الدلالة المحددة على الابن الذكر، لا مجرد طفل.
- source_word: Ἐλισάβετ
  choice: أليصابات
  rationale: نقل عربي كتابي شائع للاسم، مناسب لسجل النص المقدس ومفهوم للقارئ العربي.
