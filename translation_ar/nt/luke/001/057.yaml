  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: ar
  text: أما أليصابات، فقد اكتمل وقت ولادتها[a]، فولدت ابنًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بعبارة أكثر سلاسة: «وحان وقت أن تلد أليصابات».'
