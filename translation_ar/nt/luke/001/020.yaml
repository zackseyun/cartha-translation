source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: ar
  text: وها أنت ستكون صامتًا، غير قادر على الكلام[a]، إلى اليوم الذي تحدث فيه هذه الأمور، لأنك لم تصدّق أقوالي، التي ستتحقق في وقتها المعيَّن[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ستكون أبكم». يجمع اليوناني بين الصمت وعدم القدرة على الكلام، مؤكدًا أن السكوت مفروض لا اختياري.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «في وقتها المناسب». تشير العبارة إلى الوقت الملائم أو المعيَّن لتحقق هذه الأقوال.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: وها أنت
  rationale: تنقل أداة لفت الانتباه مع نبرة الإعلان الجاد، وتأتي طبيعية في العربية المعاصرة.
- source_word: ἔσῃ σιωπῶν
  choice: ستكون صامتًا
  rationale: تحافظ على صيغة الحالة المستقبلية الناتجة، وتبقي عنصر الصمت مستقلًا عن بيان العجز عن الكلام الذي يليه.
- source_word: μὴ δυνάμενος λαλῆσαι
  choice: غير قادر على الكلام
  rationale: تنقل العجز الفعلي بوضوح، فلا يُفهم الصمت على أنه امتناع اختياري.
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: إلى اليوم الذي تحدث فيه هذه الأمور
  rationale: صياغة زمنية واضحة تحافظ على معنى وقوع الأمور المذكورة دون استعمال تعبير قديم.
- source_word: ἀνθ’ ὧν
  choice: لأنك
  rationale: يناسب السياق السببي، إذ يبيّن أن الحالة المفروضة جاءت بسبب عدم التصديق.
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: لم تصدّق أقوالي
  rationale: «تصدّق» مع الأقوال يعبّر مباشرة عن عدم قبول ما قيل على أنه حق، و«أقوالي» تحفظ جمع λόγοι.
- source_word: οἵτινες πληρωθήσονται
  choice: التي ستتحقق
  rationale: يربط الضمير بالأقوال ويحفظ معنى بلوغها التمام ووقوع مضمونها، بصياغة عربية طبيعية.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: في وقتها المعيَّن
  rationale: يعكس καιρός بوصفه الوقت الملائم أو المحدد، لا مجرد زمن متتابع.
theological_decisions:
- issue: طبيعة الحكم الواقع على زكريا
  choice: يعرض النص صمتًا مفروضًا يتضمن العجز عن الكلام إلى أن يتحقق الوعد.
  alternative: قد يُفهم الصمت وحده على أنه سكوت اختياري.
  rationale: الجمع بين «ستكون صامتًا» و«غير قادر على الكلام» يدل على حالة قسرية، مع إبقاء عنصري العبارة اليونانية دون شرح عقائدي زائد.
- issue: دلالة وقت تحقق الأقوال
  choice: ستتحقق الأقوال في وقتها المعيَّن.
  alternative: ستتحقق في وقتها المناسب.
  rationale: كلاهما ممكن، لكن «المعيَّن» يحفظ قوة καιρός في السياق بوصفه وقتًا محددًا للتحقق، من غير التصريح بمن عيّنه بما يتجاوز العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. وُضع هامش [a] بعد عبارة العجز عن الكلام لأنه يشرح اجتماع الصمت والبكم، ووُضع [b] بعد عبارة الوقت المعيَّن لأنه يشرح دلالة καιρός.
