  text: καὶ ἠγαλλίασεν τὸ πνεῦμά μου ἐπὶ τῷ θεῷ τῷ σωτῆρί μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: ar
  text: وابتهجت روحي بالله مخلّصي[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وتهلّلت روحي بالله مخلّصي».'
    reason: بديل معجمي ينقل شدة الفرح التي يحملها الفعل اليوناني.
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل هذه العبارة بما قبلها ويحفظ التوازي الشعري.
- source_word: ἠγαλλίασεν
  choice: ابتهجت
  rationale: ينقل معنى الفرح الشديد الذي يدل عليه الفعل اليوناني، بلفظ عربي فصيح وواضح، ويحافظ الماضي على صيغة الفعل دون تحميلها دلالة زمنية زائدة.
- source_word: τὸ πνεῦμά μου
  choice: روحي
  rationale: يحفظ اللفظ المباشر والتوازي الشعري مع «نفسي» في العدد السابق، من غير حسم العلاقة الأنثروبولوجية بين النفس والروح.
- source_word: ἐπὶ τῷ θεῷ
  choice: بالله
  rationale: الباء تعبير عربي طبيعي عن تعلّق الابتهاج بالله وكونه أساسه وموضوعه، مع إبقاء الدلالة العلائقية للسياق.
- source_word: τῷ σωτῆρί μου
  choice: مخلّصي
  rationale: ترجمة مباشرة وشائعة للفظ σωτήρ، وتحفظ إسناد الخلاص إلى الله وضمير المتكلم.
theological_decisions:
- issue: وصف الله بأنه مخلّص المتكلمة
  choice: بالله مخلّصي
  alternative: بالله منقذي
  rationale: النص اليوناني يصف الله مباشرة بأنه مخلّص مريم؛ فحُفظ هذا الإسناد من غير تخفيفه أو استنباط نتائج عقائدية تتجاوز العبارة.
- issue: العلاقة بين «روحي» و«نفسي» في التوازي المحيط
  choice: الإبقاء على «روحي» بوصفها لفظًا متميزًا
  alternative: استبدالها بتعبير مثل «كياني الداخلي» أو دمجها دلاليًا مع «نفسي»
  rationale: يستخدم اليوناني لفظين مختلفين ضمن توازٍ شعري يوحي بالتقارب، ولذلك تحافظ الترجمة على التمييز من غير أن تحوّله إلى فصل تقني حاسم بين النفس والروح.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة شعرية كريمة. استُعمل «ابتهجت» لسهولة فهمه، مع إثبات «تهلّلت» في الحاشية بوصفه بديلًا عربيًا أدبيًا ممكنًا.
