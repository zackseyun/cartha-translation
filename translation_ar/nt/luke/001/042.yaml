  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: ar
  text: 'فهتفت بصوت عالٍ وقالت[a]: «مباركة أنتِ بين النساء، ومباركة ثمرة بطنكِ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فهتفت هتافًا عظيمًا».'
    reason: بديل معجمي يحافظ بصورة أقرب على الاسم κραυγή وصفته، مع أن «بصوت عالٍ» أفصح وأطبع في السياق العربي.
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: هتفت
  rationale: يفيد الفعل النطق بصوت مرتفع أو الهتاف، و«هتفت» تنقل القوة المسموعة من غير أن توحي بالضرورة بضيق أو استغاثة.
- source_word: κραυγῇ μεγάλῃ
  choice: بصوت عالٍ
  rationale: العبارة في حالة الداتيف وتبيّن هيئة الكلام. والصياغة العربية طبيعية وتحفظ شدة الصوت ووضوح سماعه.
- source_word: Εὐλογημένη
  choice: مباركة أنتِ
  rationale: اسم المفعول التام المبني للمجهول مستعمل خبريًا في صيغة بركة. ويحفظ التقديم النبرة التعجبية والتوازي في الجملة.
- source_word: ἐν γυναιξίν
  choice: بين النساء
  rationale: تعبر العبارة عن مكانة مريم المتميزة في جملة النساء، من غير إضافة «جميع» التي لا يصرح بها اليوناني.
- source_word: εὐλογημένος
  choice: مباركة
  rationale: تكرار اللفظ نفسه يحفظ التوازي المقصود بين البركة المعلنة لمريم والبركة المعلنة للجنين.
- source_word: ὁ καρπὸς
  choice: ثمرة
  rationale: تحفظ «ثمرة» الاستعارة الأصلية، وهي مفهومة في هذا السياق، بدل تفسيرها مباشرة بلفظ «الطفل» أو «النسل».
- source_word: τῆς κοιλίας σου
  choice: بطنكِ
  rationale: تشير κοιλία هنا إلى موضع الحمل. و«ثمرة بطنكِ» تعبير عربي كتابي واضح يحفظ الصورة الأمومية وصيغة الإضافة في الأصل.
theological_decisions:
- issue: صياغة البركة الموجهة إلى مريم
  choice: مباركة أنتِ بين النساء
  alternative: أنتِ مباركة بين النساء
  rationale: تحفظ الصياغة قالب البركة والنبرة التعجبية في النص من غير توسيع دور مريم أو تقليله وفق صياغات عقائدية لاحقة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «فهتفت» لتجنب إيحاء الحزن الذي قد يصاحب «صرخت»، وحُفظ التوازي اللفظي في عبارتي البركة، كما أُبقيت استعارة «ثمرة البطن» دون تفسير زائد.
