lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: فأجابت
  rationale: اسم فاعل ماضٍ من ἀποκρίνομαι يقدّم الكلام المباشر بمعنى الإجابة أو الرد؛ وصيغ الفعل الماضي أنسب بالعربية.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: أمه
  rationale: تعبير عربي طبيعي يحفظ التعريف والإحالة إلى أم الصبي.
- source_word: εἶπεν
  choice: وقالت
  rationale: حُفظ فعل القول الوارد في اليونانية إلى جانب فعل الإجابة، مع ربطهما بأسلوب عربي واضح.
- source_word: Οὐχί
  choice: لا
  rationale: نفي مباشر وقاطع ملائم لسياق رفض الاسم المقترح.
- source_word: ἀλλὰ
  choice: بل
  rationale: 'تفيد «بل» الإضراب التصحيحي: رفض الاقتراح السابق وإثبات الاسم الصحيح.'
- source_word: κληθήσεται
  choice: سيُدعى
  rationale: يحفظ صيغة المستقبل المبني للمجهول ومعنى إطلاق الاسم.
- source_word: Ἰωάννης
  choice: يوحنا
  rationale: الصيغة العربية الكتابية الراسخة للاسم الشخصي.
