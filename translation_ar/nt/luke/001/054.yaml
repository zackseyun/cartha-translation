lexical_decisions:
- source_word: ἀντελάβετο
  choice: أعان
  rationale: يفيد الفعل الأخذ بيد شخص لإعانته أو نصرته؛ و«أعان» تعبير عربي موجز وطبيعي ينقل معنى العون الإلهي.
- source_word: Ἰσραὴλ
  choice: إسرائيل
  rationale: إبقاء اسم العلم بصيغته العربية المعيارية، والمقصود في السياق شعب إسرائيل بصفته الجماعية.
- source_word: παιδὸς
  choice: عبده
  rationale: يمكن أن تعني الكلمة «عبدًا/خادمًا» أو «ولدًا»، لكن «عبده» أرجح هنا لاتساقها مع وصف إسرائيل بأنه عبد الله في نصوص العهد القديم التي يتردد صداها في الترنيمة.
- source_word: αὐτοῦ
  choice: ـه
  rationale: ضمير الملكية عائد إلى الله، أي إن إسرائيل عبده.
- source_word: μνησθῆναι
  choice: ذاكرًا
  rationale: ينقل المصدر اليوناني بوصف التذكر مصاحبًا لفعل الإعانة، مع بقاء احتمال دلالته على الغاية أو النتيجة قائمًا.
- source_word: ἐλέους
  choice: الرحمة
  rationale: «الرحمة» المقابل المباشر الطبيعي، وقد تحمل في السياق إيحاء الرحمة العهدية أو الأمانة المشفقة دون لزوم إدخال هذا التفسير في المتن.
theological_decisions:
- issue: دلالة παῖς في وصف إسرائيل
  choice: إسرائيل عبده
  alternative: إسرائيل ولده
  rationale: يحفظ اختيار «عبده» صدى لغة العهد القديم عن إسرائيل عبد الرب، مع التنبيه إلى أن اللفظة اليونانية نفسها تحتمل معنى «الولد».
- issue: دلالة μνησθῆναι ἐλέους
  choice: ذاكرًا الرحمة
  alternative: لكي يذكر الرحمة؛ إظهارًا لرحمته
  rationale: الصياغة المختارة موجزة وقريبة من تركيب اليونانية، ولا تحسم صلة المصدر بالفعل على أنها غاية أو نتيجة فقط، كما لا تضيف ضمير ملكية غير مصرح به في هذه العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة ترنيمية وقورة. استُعمل «ذاكرًا» للمحافظة على الإيجاز وعلى الصلة النحوية المفتوحة نسبيًا بين التذكر والإعانة، ووُضعت علامتا الحاشيتين في المتن.
