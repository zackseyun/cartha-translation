  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ولده». يمكن للكلمة اليونانية أن تعني «عبدًا» أو «ولدًا»؛ ورُجِّحت «عبده» هنا لأن العهد القديم يصف إسرائيل بأنه عبد الله.
