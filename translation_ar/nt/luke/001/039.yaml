  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: ar
  text: وفي تلك الأيام، قامت مريم ومضت مسرعةً إلى المنطقة الجبلية، إلى بلدة في يهوذا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى مدينة في يهوذا» أو «إلى بلدة يهودية». فاللفظة اليونانية المترجمة «بلدة» قد تعني «مدينة» أو «بلدة»، وقد تدل «يهوذا» على إقليم يهوذا، أي اليهودية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: قامت
  rationale: اسم فاعل ماضٍ يسبق الفعل الرئيس ويعرض تتابع الحدث؛ «قامت» تحافظ على الصورة السردية من غير اختزالها إلى «انطلقت».
- source_word: δὲ
  choice: و
  rationale: أداة انتقال سردي خفيف؛ الواو طبيعية في العربية وتصل الجملة بسياقها من غير إضافة معنى زمني مستقل.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: في تلك الأيام
  rationale: تعبير زمني مألوف يحفظ الإشارة إلى الفترة المذكورة في السياق.
- source_word: ἐπορεύθη
  choice: مضت
  rationale: ينقل معنى الذهاب والسفر، وهو أفصح في هذا السياق السردي من تكرار «ذهبت» بعد «قامت».
- source_word: εἰς τὴν ὀρεινὴν
  choice: إلى المنطقة الجبلية
  rationale: الصفة مستعملة استعمال الاسم للدلالة على الإقليم المرتفع أو الجبلي، لا على جبل بعينه.
- source_word: μετὰ σπουδῆς
  choice: مسرعةً
  rationale: ينقل في سياق السفر معنى المبادرة والسرعة، مع بقاء احتمال دلالة اللفظة على الجد أو الحماسة.
- source_word: εἰς πόλιν Ἰούδα
  choice: إلى بلدة في يهوذا
  rationale: πόλις قد تدل على مدينة أو بلدة، وἸούδα تُفهم هنا على الأرجح دلالة إقليمية؛ «في يهوذا» عربية طبيعية من غير تسمية البلدة غير المذكورة.
theological_decisions:
- issue: تحديد مدلول Ἰούδα
  choice: يهوذا بوصفها المنطقة أو الإقليم
  alternative: بلدة اسمها يهوذا، أو الإقليم المسمى اليهودية
  rationale: السياق الجغرافي يرجح الدلالة الإقليمية، لكن اليونانية تحتمل من حيث الصياغة فهمًا آخر؛ لذلك ذُكر الاحتمال في الحاشية ولم يُجزم بما يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُعملت «المنطقة الجبلية» لبيان أن المقصود إقليم مرتفع، ووُضعت علامة الحاشية بعد العبارة التي تتناولها الحاشية.
