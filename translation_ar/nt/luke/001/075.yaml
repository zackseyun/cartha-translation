lexical_decisions:
- source_word: ἐν
  choice: في
  rationale: يفيد المجال أو الكيفية التي تجري فيها العبادة المذكورة في السياق، ويحافظ على بنية اليونانية بصورة طبيعية في العربية.
- source_word: ὁσιότητι
  choice: قداسة
  rationale: يدل على القداسة والتقوى في العلاقة بالله، ويظل متميزًا عن δικαιοσύνη.
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل بين الاسمين.
- source_word: δικαιοσύνῃ
  choice: برّ
  rationale: يناسب اقترانه بالقداسة ويعبّر عن الاستقامة الأخلاقية أمام الله، مع بقاء «عدل» احتمالًا معجميًا ممكنًا.
- source_word: ἐνώπιον αὐτοῦ
  choice: أمامه
  rationale: تعبير عربي موجز وطبيعي يفيد الحضور والنظر والتقييم الإلهي.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: كلَّ أيامنا
  rationale: ينقل العبارة اليونانية مباشرة وبأسلوب عربي طبيعي، ويدل ضمنًا على امتداد العمر كله من غير إضافة لفظ «الحياة» غير الوارد صراحة.
theological_decisions:
- issue: دلالة δικαιοσύνη في سياق أخلاقي غير بولسي
  choice: برّ
  alternative: عدل
  rationale: «برّ» يحفظ معنى الاستقامة أمام الله ويلائم اقتران اللفظة بالقداسة في هذا السياق، بينما «عدل» بديل معجمي حقيقي لكنه قد يضيّق المعنى نحو الإنصاف القضائي أو الاجتماعي.
translation_notes:
