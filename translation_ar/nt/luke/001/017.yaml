reference: Luke 1:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: ar
  text: وهو سيتقدَّم أمامه بروح إيليا وقوته[a]، ليردَّ قلوب الآباء إلى الأبناء[b]، والعصاة إلى فطنة الأبرار[c]، وليهيِّئ للرب شعبًا مُعَدًّا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود أن خدمته ستكون على مثال خدمة إيليا النبوية وبالتمكين المرتبط بها، لا أن العبارة تصرّح بعودة إيليا نفسه حرفيًا.
    reason: cross_reference
  - marker: b
    text: 'أو: «نحو الأبناء». تردّد العبارة صدى ملاخي 4: 6، وقد تتضمن معنى المصالحة واستعادة الروابط العائلية.'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا ترجمتها: «حكمة الأبرار» أو «نهج تفكير الأبرار» أو «في فطنة الأبرار».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: سيتقدَّم أمامه
  rationale: ينقل معنى السبق في المسير أو المهمة، مع إبقاء ضمير «أمامه» كما في اليونانية من غير التصريح بمرجعه داخل الآية.
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: بروح إيليا وقوته
  rationale: صياغة عربية واضحة تحافظ على اقتران الروح بالقوة وعلى نسبة كليهما إلى إيليا، من غير مساواة الشخص الآتي بإيليا نفسه.
- source_word: ἐπιστρέψαι
  choice: ليردَّ
  rationale: المصدر هنا يفيد الغاية؛ و«يردّ» يلائم صورة تحويل القلوب والناس إلى وجهة أخرى ويحافظ على صدى ملاخي.
- source_word: καρδίας πατέρων ἐπὶ τέκνα
  choice: قلوب الآباء إلى الأبناء
  rationale: ترجمة قريبة من تركيب الأصل وتحافظ على الإحالة إلى ملاخي، من غير إضافة ضمير الملكية «أبنائهم» غير الوارد صراحة.
- source_word: ἀπειθεῖς
  choice: العصاة
  rationale: تعبّر عن رفض الانقياد والطاعة، وتناسب المقابلة الأخلاقية مع «الأبرار».
- source_word: ἐν φρονήσει δικαίων
  choice: إلى فطنة الأبرار
  rationale: «فطنة» تنقل معنى الإدراك العملي والحصافة الأخلاقية في φρόνησις، وجاءت «إلى» لتوضيح الوجهة المفهومة مع فعل الردّ، مع بقاء احتمال صياغة العبارة بمعنى السير وفق فطنة الأبرار.
- source_word: ἑτοιμάσαι
  choice: ليهيِّئ
  rationale: مصدر غاية ثانٍ موازٍ لـ«ليردّ»، وترجمته بالفعل المسبوق بلام التعليل طبيعية في العربية.
- source_word: κυρίῳ
  choice: للرب
  rationale: الداتيف يدل هنا على أن الشعب يُهيّأ للرب، مع الحفاظ على لقب κύριος دون توسيع مرجعه في متن الآية.
- source_word: λαὸν κατεσκευασμένον
  choice: شعبًا مُعَدًّا
  rationale: ينقل اسم المفعول التام الدال على شعب صار في حالة استعداد نتيجة التهيئة.
theological_decisions:
- issue: هوية الآتي وعلاقته بإيليا
  choice: وصف خدمته بأنها تتم بروح إيليا وقوته
  alternative: فهم العبارة على أن إيليا نفسه عاد حرفيًا
  rationale: الأصل يقول «بروح إيليا وقوته»، وهو يدل مباشرة على تواصل الدور النبوي والتمكين المشابه لإيليا، لا على التطابق الشخصي.
- issue: مرجع الضمير ولقب الرب
  choice: الإبقاء على «أمامه» و«للرب» كما في الأصل
  alternative: التصريح في المتن بأن المقصود هو المسيح أو يسوع
  rationale: السياق يساعد على تعيين المرجع، لكن نص الآية نفسه يستعمل ضميرًا ثم لقب «الرب»؛ لذلك تُصان صياغته ولا يُحسم المرجع بإضافة تفسيرية.
- issue: العلاقة بين العصاة وفطنة الأبرار
  choice: تصويرها كتحويل العصاة إلى فطنة الأبرار
  alternative: 'ترجمتها: «والعصاة بفطنة الأبرار» أو «ليسلك العصاة بفطنة الأبرار»'
  rationale: يحمل حرف الجر ἐν معنى المجال أو النمط، لكن تعلّقه بفعل «يردّ» يسمح بفهم اتجاهي؛ أثبت المتن هذا الفهم الواضح وأبقت الحاشية البدائل المعجمية دون إلغاء الغموض.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «سيتقدَّم أمامه» بدل تعبير أثقل مثل «يسير قدّامه»، و«فطنة» للدلالة على الحكمة العملية الأخلاقية. حوفظ على التوازي بين «ليردّ» و«ليهيّئ»، وعلى إيجاز الأصل وغموض مرجع الضمير.
