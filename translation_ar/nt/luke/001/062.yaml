- source_word: καλεῖσθαι αὐτό
  choice: أن يُسمّى الصبي
  rationale: حُفظ المبني للمجهول في «يُسمّى»، وصُرّح بمرجع الضمير «الصبي» لتجنب غموض الضمير المحايد اليوناني في العربية.
