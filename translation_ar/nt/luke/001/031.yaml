  text: وها أنتِ ستحبلين وتلدين ابنًا، وتسمّينه يسوع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: وها أنتِ
  rationale: تنقل أداة لفت الانتباه ἰδού بعبارة عربية فصيحة وطبيعية، مع إظهار أن الخطاب لمريم بصيغة المؤنث.
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: ستحبلين في بطنكِ
  rationale: الفعل يدل على الحبل، وعبارة ἐν γαστρί تعني حرفيًا «في البطن/الجوف». تحافظ الصياغة على صورة الأصل وتبقى مفهومة في العربية الكتابية الحديثة.
- source_word: τέξῃ υἱόν
  choice: وتلدين ابنًا
  rationale: 'تنقل بدقة معنى الولادة وتحافظ على الدلالة المحددة لكلمة υἱός: «ابن».'
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: وتسمّينه
  rationale: هذه هي الصياغة العربية الطبيعية لفعل التسمية، وتتجنب تركيب «تدعين اسمه» الذي قد يبدو مترجمًا ترجمة حرفية وغير سلسة.
- source_word: Ἰησοῦν
  choice: يسوع
  rationale: الصيغة العربية المعيارية الشائعة لاسم Ἰησοῦς في العهد الجديد.
theological_decisions:
- issue: صيغة إعلان الاسم καλέσεις τὸ ὄνομα αὐτοῦ
  choice: وتسمّينه يسوع
  alternative: وتدعين اسمه يسوع
  rationale: لا يتعلق الاختيار بخلاف عقائدي. اعتُمدت الصياغة الطبيعية الواضحة، إذ تؤدي فعل التسمية كاملًا دون فقدان المعنى، بينما البديل يحافظ بصورة أوثق على قالب الأصل السامي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت علامات التأنيث لأن الملاك يخاطب مريم مباشرة، مع الحفاظ على النبرة الإعلانية المهيبة دون ألفاظ مهجورة.
