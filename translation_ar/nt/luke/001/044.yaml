source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: ar
  text: فها إنَّ الجنين ارتكض ابتهاجًا[a] في رحمي حين بلغ صوتُ تحيَّتكِ أذني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ارتكض الجنين في ابتهاج في رحمي».'
    reason: بديل أقرب إلى البنية اليونانية لعبارة ἐν ἀγαλλιάσει، مع الحفاظ على معنى الابتهاج.
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: فها إن
  rationale: تؤدي «فـ» وظيفة الربط التفسيري لـγάρ، وتحفظ «ها» قوة ἰδού في لفت الانتباه بصياغة عربية فصيحة.
- source_word: ὡς ἐγένετο ... εἰς τὰ ὦτά μου
  choice: ما إن بلغ أذني حتى
  rationale: تنقل التعاقب الزمني المباشر بصورة عربية طبيعية، مع بقاء صورة وصول الصوت إلى الأذن.
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: صوت تحيتك
  rationale: «صوت» يلائم التركيز الحسي في φωνή، و«تحيتك» مقابل عربي معاصر وطبيعي لـἀσπασμός.
- source_word: ἐσκίρτησεν
  choice: ارتكض
  rationale: فعل عربي فصيح وواضح يصف حركة الجنين المفاجئة في الرحم بدقة أكبر من تعبير عام مثل «قفز».
- source_word: ἐν ἀγαλλιάσει
  choice: ابتهاجًا
  rationale: يحفظ معنى الفرح الغامر أو التهلل، ويؤدي العبارة بوصفها حالًا أو هيئة للحركة دون حسم زائد لعلاقتها الدلالية بالفعل.
- source_word: τὸ βρέφος
  choice: الجنين
  rationale: السياق يتحدث عن طفل في الرحم، و«الجنين» هو التعبير العربي الطبيعي والدقيق في هذا الموضع، مع بقاء دلالة βρέφος على الصغير.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: في بطني
  rationale: ترجمة مباشرة لـκοιλία تحافظ على الصورة الجسدية التي في اليونانية؛ ويمكن بحسب السياق فهمها بمعنى الرحم.
theological_decisions:
- issue: وصف يوحنا قبل ولادته بلفظة βρέφος
  choice: الجنين
  alternative: الطفل
  rationale: اختير اللفظ العربي السياقي للكائن البشري في الرحم من غير إضافة تقرير عقائدي يتجاوز وصف النص.
- issue: دلالة ἐν ἀγαλλιάσει
  choice: ابتهاجًا
  alternative: من الفرح
  rationale: تحفظ الصياغة معنى الابتهاج وتوتر العبارة اليونانية بين بيان الهيئة أو المصاحبة وبين الدافع، بدل حصرها في سببية صريحة.
translation_notes:
  register: عربية فصحى حديثة ذات نبرة كتابية كريمة. استُخدمت صيغة «ما إن... حتى» لتجنب ترجمة حرفية متعثرة، و«ارتكض» للدقة السياقية. وُضع مؤشر الحاشية في المتن كما هو مطلوب.
