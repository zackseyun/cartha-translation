  terminology: «الجنين» اختيار سياقي مقبول لـβρέφος هنا، و«ابتهاجًا» ينقل ἐν ἀγαλλιάσει نقلًا جيدًا. «رحمي» هو المقابل السياقي الأدق لـἐν τῇ κοιλίᾳ μου في هذه الآية.
