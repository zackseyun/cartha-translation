  to: فها إنَّ الجنين ارتكض ابتهاجًا[a] في رحمي حين بلغ صوتُ تحيَّتكِ أذني.
  rationale: تُبقي المراجعة قوة الاستهلال في ἰδοὺ γάρ بصيغة «فها إنَّ»، وتحافظ على علاقة الزمن في ὡς ἐγένετο باستعمال «حين». واستُبدلت «بطني» بـ«رحمي» لأن السياق يحدد κοιλία بالرحم، ونُقلت علامة الحاشية إلى العبارة التي تتصل بها.
