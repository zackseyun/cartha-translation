  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: ar
  text: 'فطلب لوحًا للكتابة، وكتب قائلًا: «يوحنا هو اسمه».[a] فتعجّبوا جميعًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة عربية أكثر سلاسة: «اسمه يوحنا». أما ترتيب الأصل اليوناني فأقرب إلى: «يوحنا هو اسمه»، وفيه توكيد للاسم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτήσας
  choice: فطلب
  rationale: اسم الفاعل الماضي يدل على فعل سبق فعل الكتابة؛ والفاء مع الفعل الماضي تنقل تعاقب الحدثين بوضوح وطبيعية في العربية.
- source_word: πινακίδιον
  choice: لوحًا للكتابة
  rationale: يدل اللفظ على لوح صغير يُكتب عليه؛ وهذه العبارة واضحة للقارئ الحديث ولا توحي باللوح الإلكتروني.
- source_word: ἔγραψεν λέγων
  choice: وكتب قائلًا
  rationale: يحافظ على فعل الكتابة وعلى اسم الفاعل الذي يقدّم مضمون المكتوب، مع بقاء الصياغة عربية مفهومة.
- source_word: Ἰωάννης
  choice: يوحنا
  rationale: الصيغة العربية الكتابية المألوفة للاسم اليوناني.
- source_word: ἐστὶν ὄνομα αὐτοῦ
  choice: هو اسمه
  rationale: مع تقديم «يوحنا» تحافظ العبارة على ترتيب اليونانية وتوكيد الاسم المعطى، من غير تحويل المضارع إلى معنى مستقبلي.
- source_word: ἐθαύμασαν πάντες
  choice: فتعجّبوا جميعًا
  rationale: ينقل الدهشة الجماعية التي عبّر عنها الفعل والضمير مع πάντες، بصياغة عربية طبيعية.
theological_decisions:
- issue: دلالة تقرير اسم الطفل
  choice: «يوحنا هو اسمه» بصيغة الحاضر
  alternative: «سيكون اسمه يوحنا»
  rationale: النص اليوناني يستعمل فعل الكينونة في الحاضر، فيقرّر الاسم ولا يصوغه بوصفه تسمية مستقبلية؛ وهذا يحفظ صلة العبارة بالاسم المعطى إلهيًا من غير إضافة تفسير إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ ترتيب الجملة اليونانية في القول المكتوب لإبراز التوكيد، مع إيضاح الصياغة العربية الأسلس في الحاشية.
