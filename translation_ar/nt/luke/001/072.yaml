lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: لِيَصْنَعَ رَحْمَةً
  rationale: يحافظ هذا التعبير على صورة الأصل اليوناني، وهو أيضًا تعبير عربي كتابي مفهوم يدل على إظهار الرحمة والعمل بها.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: مَعَ آبَائِنَا
  rationale: تنقل «مع» الدلالة المباشرة لحرف الجر μετά مع المضاف إليه، وتبقي احتمال فهم الرحمة في صلتها بآباء إسرائيل دون حسمه إلى «لآبائنا».
- source_word: πατέρων
  choice: آبَائِنَا
  rationale: تحافظ على الصيغة المذكرة وعلى الصدى العهدي المتعلق بآباء إسرائيل، مع توضيح المقصود في الحاشية.
- source_word: μνησθῆναι
  choice: يَذْكُرَ
  rationale: ترجمة مباشرة تحفظ لغة العهد الكتابية، من غير توسيعها في المتن إلى الوفاء أو التنفيذ، وإن كان الذكر الإلهي يتضمن غالبًا العمل بأمانة.
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: عَهْدَهُ الْمُقَدَّسَ
  rationale: «العهد» هو المقابل الملائم في هذا السياق الخلاصي، وإضافة الضمير إلى الاسم طبيعية في العربية وتحفظ مرجع αὐτοῦ، أما «المقدس» فتنقل وصف ἁγίας بوضوح.
theological_decisions:
- issue: الذكر الإلهي بوصفه فعلًا عهديًا
  choice: وَيَذْكُرَ عَهْدَهُ الْمُقَدَّسَ
  alternative: ويعمل بأمانة وفق عهده المقدس؛ ويتمم عهده المقدس
  rationale: الأصل يقول «يذكر»، مع أن الاستعمال العهدي الكتابي قد يتضمن اتخاذ فعل أمين بناءً على الوعد. إبقاء «يذكر» يصون هذا التوتر ولا يستبدل اللفظ بتفسيره.
- issue: مدلول «آبائنا»
  choice: آبَائِنَا
  alternative: أسلافنا؛ أجدادنا
  rationale: يحفظ اللفظ صيغة الأصل المذكرة ورنينه العهدي، فيما تبين الحاشية أن المراد آباء إسرائيل أو أسلافهم.
- issue: دلالة μετά مع الرحمة
  choice: مَعَ آبَائِنَا
  alternative: لآبائنا؛ نحو آبائنا
  rationale: «مع» أقرب إلى البنية اليونانية وتحفظ غرابة التعبير واحتماله الحقيقي، بينما توضح الحاشية أن المعنى هو صنع الرحمة في العلاقة بآباء إسرائيل.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية كريمة. استُعمل الضبط الجزئي/الكامل في نص الآية لرفع اللبس النحوي، وحُفظت العبارة العهدية «يصنع رحمة» وبنية «مع آبائنا» لقربهما من الأصل مع شرح البدائل في الحواشي.
