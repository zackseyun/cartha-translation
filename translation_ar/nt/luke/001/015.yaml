id: LUK.1.15
reference: Luke 1:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: ar
  text: لِأَنَّهُ سَيَكُونُ عَظِيمًا أَمَامَ الرَّبِّ، وَلَنْ يَشْرَبَ خَمْرًا وَلَا مُسْكِرًا[a]، وَسَيَمْتَلِئُ مِنَ الرُّوحِ الْقُدُسِ وَهُوَ بَعْدُ فِي بَطْنِ أُمِّهِ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'المسكر: شراب مُسكِر غير الخمر.'
    reason: cultural_note
  - marker: b
    text: 'أو: «منذ أن كان في بطن أمه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: عظيمًا
  rationale: المقابل العربي المباشر الذي يحفظ معنى العظمة والمكانة من غير تحديد زائد لطبيعتها.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: أمام الرب
  rationale: صياغة عربية واضحة تحفظ معنى كونه عظيمًا في نظر الرب وحضرته، من غير حصر العبارة في معنى قضائي.
- source_word: οἶνον καὶ σίκερα
  choice: خمرًا ولا مسكرًا
  rationale: «الخمر» مقابل οἶνος، و«المسكر» يدل على الشراب المسكر غير الخمر من غير تضييق نوعه إلى الجعة أو غيرها.
- source_word: οὐ μὴ πίῃ
  choice: لن يشرب
  rationale: «لن» تنقل النفي المستقبلي المؤكد بصورة طبيعية؛ والسياق يبيّن أن ذلك من مقتضيات دعوته، من غير تحويل الصيغة الخبرية صراحة إلى أمر.
- source_word: πνεύματος ἁγίου πλησθήσεται
  choice: سيمتلئ من الروح القدس
  rationale: يحفظ المبني للمجهول الدال على فعل إلهي، ويجري على الاستعمال العربي الطبيعي مع «امتلأ من».
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: وهو بعد في بطن أمه
  rationale: ينقل بوضوح المعنى الزمني المرجح، أي أن الامتلاء يقع وهو لا يزال في بطن أمه، مع إبقاء دلالة التبكير الاستثنائي.
theological_decisions:
- issue: قوة النفي المؤكد οὐ μὴ πίῃ في إعلان نبوي
  choice: 'صيغة خبرية مؤكدة: «لن يشرب»'
  alternative: 'صيغة إلزام: «يجب ألا يشرب أبدًا»'
  rationale: التركيب اليوناني نفي مستقبلي شديد، أما دلالة التكريس والإلزام فتُفهم من السياق ولا يلزم إدخالها في الصيغة نفسها.
- issue: مرجع πνεύματος ἁγίου
  choice: «الروح القدس» بوصفه المرجع الإلهي الشخصي في سياق لوقا
  alternative: «روح قداسة» أو قوة غير شخصية
  rationale: استعمال لوقا والسياق المباشر يؤيدان الإشارة إلى الروح القدس، مع أن اليونانية لا تستعمل أداة تعريف هنا.
- issue: توقيت الامتلاء بالروح
  choice: وهو لا يزال في بطن أمه
  alternative: منذ بطن أمه، بما قد يُفهم منه البدء عند الولادة أو الأصل
  rationale: العبارة اليونانية تحتمل التعبير بـ«من بطن أمه»، لكن ἔτι والسياق يرجحان وقوع الأمر في المرحلة السابقة للولادة؛ وقد حُفظ البديل في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة وموقرة. استُعملت صياغة خبرية طبيعية، مع تجنب التراكيب التراثية الغامضة للقارئ المعاصر. وُضعت علامتا الحاشية في المتن عند موضعيهما.
