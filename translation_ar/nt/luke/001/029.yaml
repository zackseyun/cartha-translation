  text: ἡ δὲ ⸂ἐπὶ τῷ λόγῳ διεταράχθη⸃ καὶ διελογίζετο ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: ar
  text: لكنها اضطربت جدًا من الكلام[a]، وظلت تتساءل[b] ما عسى أن تكون عليه هذه التحية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «من القول»، أو «بسبب الكلام». يمكن أن تعني الكلمة اليونانية λόγος «كلمة» أو «قولًا» أو «كلامًا».
    reason: lexical_alternative
  - marker: b
    text: أو «أخذت تتأمل»، أو «ظلت تتساءل». تدل صيغة الفعل اليوناني على تفكير متواصل.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: لكنها
  rationale: تفيد انتقالًا سرديًا مع مقابلة خفيفة بين التحية ورد فعلها، و«لكنها» واضحة وطبيعية في العربية.
- source_word: ἐπὶ τῷ λόγῳ
  choice: من هذا الكلام
  rationale: يشير λόγος هنا إلى الكلام الذي قيل لها، وتفيد «من» سبب اضطرابها من غير حصر المعنى في كلمة مفردة.
- source_word: διεταράχθη
  choice: اضطربت جدًا
  rationale: ينقل شدة الاضطراب التي تفيدها صيغة الفعل، من غير إضافة حكم أخلاقي أو لاهوتي إلى رد فعلها.
- source_word: διελογίζετο
  choice: ظلت تتفكر
  rationale: تنقل صيغة الماضي الناقص بوصفها تفكيرًا داخليًا مستمرًا، لا خاطرًا عابرًا.
- source_word: ποταπὸς
  choice: أيَّ نوع
  rationale: يحافظ على السؤال عن طبيعة هذه التحية أو صفتها.
- source_word: εἴη
  choice: عسى أن تكون
  rationale: يعكس طابع الاحتمال والتساؤل في صيغة التمني الواردة ضمن خطاب غير مباشر.
- source_word: ἀσπασμὸς
  choice: التحية
  rationale: لفظ عربي حديث وواضح يشير إلى تحية الملاك المنطوقة.
- source_word: οὗτος
  choice: هذه
  rationale: يشير مباشرة إلى التحية المذكورة قبلًا.
theological_decisions:
- issue: طبيعة رد فعل مريم
  choice: يُعرض اضطرابها على أنه ناشئ من الكلام الذي سمعته، ويتبعه تفكر مستمر في طبيعة التحية.
  alternative: ربط اضطرابها بظهور الملاك نفسه، أو اعتبار ردها دليلًا على عدم الإيمان.
  rationale: النص اليوناني يربط الاضطراب صراحةً بالكلام أو القول، ويصف التفكر من غير أن يصدر حكمًا على إيمانها أو حالتها الأخلاقية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «هذا الكلام» بدل ترجمة حرفية قد توحي بكلمة مفردة، وحُفظ استمرار التفكر واحتمالية السؤال من غير تفسير زائد.
