  text: καθὼς ἐλάλησεν διὰ στόματος τῶν ⸀ἁγίων ἀπ’ αἰῶνος προφητῶν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/070.yaml
  text: just as he spoke through the mouth of his holy prophets from of old,[a]
translation:
  language: ar
  text: كما تكلَّم بفم أنبيائه القديسين منذ القِدَم،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «منذ الأزمنة القديمة». وقد تدل العبارة على القِدَم السحيق، ويفهمها بعضهم بمعنى أقوى: «منذ الأزل»؛ لكن ذكر الأنبياء هنا يرجّح معنى «منذ القِدَم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: كما
  rationale: تفيد المطابقة والاتساق مع ما سبق، وهي صياغة عربية طبيعية تحفظ معنى أن الحدث جاء وفق كلام الله السابق.
- source_word: ἐλάλησεν
  choice: تكلَّم
  rationale: يناسب فعل الكلام، ويتآلف طبيعيًّا مع العبارة الأداتية «بفم».
- source_word: διὰ στόματος
  choice: بفم
  rationale: يحفظ الصورة الكتابية الملموسة التي تعبّر عن إيصال كلام الله بواسطة الأنبياء، بدل تسطيحها إلى «بواسطة» فقط.
- source_word: τῶν ἁγίων ... προφητῶν
  choice: أنبيائه القديسين
  rationale: تعكس الصفة المنسوبة إلى الأنبياء بوضوح، وتحفظ معنى تخصيصهم لله.
- source_word: ἀπ’ αἰῶνος
  choice: منذ القِدَم
  rationale: تدل هنا على الأزمنة السحيقة في التاريخ، وهو ما يلائم ذكر الأنبياء، مع إبقاء البديل الأقوى «منذ الأزل» في الحاشية.
- source_word: αὐτοῦ
  choice: ـه في «أنبيائه»
  rationale: يعود الضمير في السياق على الله، أي الأنبياء المنسوبون إليه.
theological_decisions:
- issue: مدى دلالة ἀπ’ αἰῶνος
  choice: 'القِدَم التاريخي: «منذ القِدَم»'
  alternative: «منذ الأزمنة القديمة» أو، بدلالة أقوى، «منذ الأزل»
  rationale: ذكر الأنبياء يرجّح الإشارة إلى الشهادة النبوية الممتدة من العصور القديمة، لا تقريرًا تجريديًّا عن الأزل؛ ومع ذلك تُصان سعة العبارة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ التعبير التصويري «بفم» لصياغة الوساطة النبوية، واستُعمل «منذ القِدَم» لتجنب الإيحاء الحاسم بالأزل مع توثيق البديل في الحاشية.
