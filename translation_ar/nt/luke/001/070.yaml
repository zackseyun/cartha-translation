  source_fidelity: 'النص العربي ينقل عناصر اليونانية كاملة: أداة المطابقة «كما»، وفعل الكلام، ووساطة الكلام بالصيغة التصويرية «بفم»، ونسبة الأنبياء إلى الله، ووصفهم بالقداسة، والإطار الزمني «منذ القِدَم». ويظل نطاق ἀπ’ αἰῶνος غير مُفرَط في تحديده، مع توثيق البديل الأشد في الحاشية.'
  naturalness: «كما تكلَّم بفم أنبيائه القديسين منذ القِدَم» فصيحة ومفهومة في العربية المعيارية الحديثة، وتحافظ على النبرة الكتابية الملائمة. والتركيب «بفم» مقصود بوصفه تعبيرًا تصويريًا موروثًا وواضحًا في هذا السجل.
  terminology: «أنبيائه القديسين» يقابل τῶν ἁγίων ... προφητῶν بدقة ويحفظ الصفة دون تفسير مذهبي زائد. كما أن «منذ القِدَم» مناسب للسياق النبوي التاريخي، والحاشية تعرض «منذ الأزل» بوصفه احتمالًا لا ترجمة مفروضة.
