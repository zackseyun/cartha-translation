source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: ar
  text: وسمع جيرانها وأقرباؤها أن الرب أظهر لها رحمة عظيمة، ففرحوا معها.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: جيرانها
  rationale: تعبير طبيعي واضح يدل على الساكنين حولها.
- source_word: συγγενεῖς
  choice: أقرباؤها
  rationale: ينقل معنى ذوي القرابة بوضوح في العربية المعاصرة.
- source_word: ἐμεγάλυνεν
  choice: عظَّم
  rationale: يحافظ على الصورة اللفظية للفعل، أي جعل الرحمة عظيمة أو أظهر عظمتها، مع بقاء العبارة مفهومة بالعربية.
- source_word: κύριος
  choice: الرب
  rationale: لقب إلهي معرَّف دلاليًا في السياق، وإن ورد الاسم بلا أداة تعريف في اليونانية.
- source_word: ἔλεος
  choice: رحمته
  rationale: «الرحمة» المقابل المباشر والمألوف، وتلائم استعمال لوقا في رواية الميلاد.
- source_word: μετ’ αὐτῆς
  choice: لها
  rationale: المعنى السياقي هو أن رحمة الرب العظيمة صارت نحوها ولأجلها؛ وهذه صياغة عربية طبيعية أكثر من النقل الحرفي «معها».
- source_word: συνέχαιρον αὐτῇ
  choice: ففرحوا معها
  rationale: ينقل مباشرة معنى مشاركتها الفرح.
theological_decisions:
- issue: صياغة التعبير ἐμεγάλυνεν...τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς
  choice: قد عظَّم رحمته لها
  alternative: قد أظهر لها رحمة عظيمة
  rationale: تحافظ الصياغة المختارة على القوة المعجمية للفعل «عظَّم» وعلى الصلة الأسلوبية بلغة التعظيم في سياق لوقا، من غير أن تُبقي تركيبًا عربيًا متكلفًا مثل «عظَّم رحمته معها». وتورد الحاشية البديل الاصطلاحي الأوضح.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُخدم «ففرحوا» لإظهار تتابع الخبر والنتيجة بسلاسة، مع الحفاظ على مشاركة الجيران والأقرباء أليصابات في فرحها.
