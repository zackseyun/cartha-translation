  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: ar
  text: وسيملك على بيت يعقوب إلى الأبد[a]، ولن يكون لملكه نهاية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى الدهور» أو «مدى العصور». والتعبير اليوناني يفيد هنا دوامًا لا نهاية له.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: يملك
  rationale: الفعل في صيغة المستقبل ويدل على ممارسة المُلك والسلطان الملكي؛ و«يملك» تعبير عربي طبيعي موجز يحفظ هذا المعنى.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: على بيت يعقوب
  rationale: حرف الجر مع الفعل يفيد السلطان على جماعة، و«بيت يعقوب» يحفظ التعبير الكتابي ذي الدلالة الجماعية والعهدية من غير تفسيره بعبارة أوسع.
- source_word: εἰς τοὺς αἰῶνας
  choice: إلى الأبد
  rationale: هذا التعبير اليوناني الاصطلاحي يدل في السياق على دوام غير منقطع؛ و«إلى الأبد» صياغة عربية واضحة ومألوفة.
- source_word: βασιλείας
  choice: ملكه
  rationale: قد تعني الكلمة المُلك أو المملكة. واختيار «ملكه» طبيعي مع نفي النهاية، ويحفظ هنا معنى السلطان الملكي الدائم دون حصر اللفظ في إقليم أو مملكة مكانية.
- source_word: οὐκ ἔσται τέλος
  choice: لن يكون ... نهاية
  rationale: صيغة وجودية مستقبلية منفية؛ تنقل «لن يكون لملكه نهاية» النفي والمستقبل بوضوح وفصاحة.
theological_decisions:
- issue: نطاق «بيت يعقوب»
  choice: الإبقاء على «بيت يعقوب» كما وردت
  alternative: شعب إسرائيل؛ شعب الله
  rationale: يحفظ ذلك التسمية العهدية التقليدية ولا يوسّع مرجعها أو يفسره على ضوء نتائج لاهوتية لاحقة.
- issue: مدة المُلك
  choice: «إلى الأبد» مع «لن يكون لملكه نهاية»
  alternative: إلى الدهور؛ مدى العصور
  rationale: الجملتان في الآية تؤكدان دوام المُلك بلا نهاية. والصياغة المختارة تنقل هذا المعنى بوضوح مع الإشارة في الحاشية إلى الصورة اللفظية اليونانية.
- issue: دلالة βασιλεία
  choice: «ملكه» بمعنى سلطانه الملكي
  alternative: مملكته
  rationale: تحتمل اليونانية المُلك أو المملكة. يحافظ «ملكه» على هذا البعد الدلالي الملائم لاقترانه بالفعل «يملك»، من غير إنكار احتمال ترجمتها «مملكته».
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظ التعبير الكتابي «بيت يعقوب»، واستُعملت صياغة طبيعية غير متكلفة مع إبقاء البديل الحرفي للتعبير الزمني في الحاشية.
