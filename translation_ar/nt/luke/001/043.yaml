  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: ar
  text: ومن أين لي هذا[a]، أن تأتي إليَّ أمُّ ربّي؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: كيف حظيت بهذا؟ التعبير الحرفي «من أين لي هذا؟» يدل هنا على التعجب من نيل هذا الشرف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν
  choice: من أين
  rationale: يحافظ على صورة المصدر أو المنشأ في اللفظ اليوناني، وهو تعبير يفيد هنا التعجب من نيل هذا الشرف، كما أنه واضح وطبيعي في العربية ضمن العبارة «ومن أين لي هذا؟».
- source_word: μοι
  choice: لي
  rationale: تنقل دلالة المفعول له أو الشخص الذي آل إليه هذا الامتياز، وتلائم التعبير العربي الموجز «من أين لي هذا».
- source_word: τοῦτο
  choice: هذا
  rationale: يُبقي اسم الإشارة على إيجازه من غير إدخال اسم تفسيري مثل «الشرف» أو «الامتياز» في المتن.
- source_word: ἵνα ἔλθῃ
  choice: أن تأتي
  rationale: تقدّم مضمون الأمر المثير للدهشة بصياغة عربية طبيعية، مع بقاء الفعل في إطار الحدث المقصود في السؤال التعجبي.
- source_word: ἡ μήτηρ
  choice: أمّ
  rationale: المقابل العربي المباشر والطبيعي للكلمة اليونانية.
- source_word: τοῦ κυρίου μου
  choice: ربّي
  rationale: يحفظ لقب κύριος وثقله التوقيري والمسيحاني من غير توسيع عقائدي يتجاوز نص الآية.
- source_word: πρὸς ἐμέ
  choice: إليَّ
  rationale: ينقل اتجاه الحركة نحو أليصابات من غير إضافة «بيتي»، وهو ما لا يصرّح به النص اليوناني.
theological_decisions:
- issue: ترجمة κυρίου في عبارة ἡ μήτηρ τοῦ κυρίου μου
  choice: ربّي
  alternative: سيّدي
  rationale: «ربّي» يحفظ قوة اللقب التوقيرية والمسيحانية في سياق لوقا، من غير أن يضيف إلى الآية صياغات عقائدية لاحقة.
- issue: درجة حرفية التعبير πόθεν μοι τοῦτο
  choice: ومن أين لي هذا
  alternative: وكيف حظيت بهذا؟
  rationale: الصياغة المختارة قريبة من بنية الأصل، ومفهومة في العربية الفصحى، وتحفظ صورة «من أين» والتعجب المقصود بدل حسمها في تفسير واحد مثل الاستحقاق أو المنح.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. حُفظ الإيجاز والاستفهام التعجبي في الأصل، واستُخدم «أمّ ربّي» بلا توسع تفسيري.
