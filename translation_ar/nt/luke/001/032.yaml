lexical_decisions:
- source_word: οὗτος
  choice: هذا
  rationale: حُفظ اسم الإشارة اليوناني لأنه طبيعي في العربية ويشير إلى الطفل الذي أعلن عنه الملاك.
- source_word: ἔσται μέγας
  choice: سيكون عظيمًا
  rationale: ترجمة مباشرة تحفظ اتساع معنى μέγας من غير حصره في القوة أو الأهمية وحدهما.
- source_word: υἱὸς Ὑψίστου
  choice: ابن العليّ
  rationale: صياغة عربية لقبية طبيعية تحفظ اللقب الإلهي Ὕψιστος وقوة وصف البنوة من غير إدخال أداة تنكير.
- source_word: κληθήσεται
  choice: سيُدعى
  rationale: المبني للمجهول في المستقبل يدل هنا على التسمية أو إطلاق اللقب، و«سيُدعى» موجزة وقريبة من الأصل.
- source_word: κύριος ὁ θεὸς
  choice: الرب الإله
  rationale: تحفظ ترتيب اللقب والاسم في اليونانية، ولا تستبدل «الرب» بصيغة توحي صراحةً باسم العهد غير الوارد في النص اليوناني.
- source_word: δώσει αὐτῷ
  choice: سيعطيه
  rationale: ترجمة عربية واضحة ومباشرة للفعل مع ضمير المفعول غير المباشر.
- source_word: τὸν θρόνον Δαυὶδ
  choice: عرش داود
  rationale: تحفظ الإضافة الملكية وصدى وعد المُلك الداودي بصياغة عربية طبيعية.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: أبيه
  rationale: تحفظ اللفظ المباشر πατήρ بدل تفسيره داخل المتن بـ«سلفه»، مع بيان الدلالة النَّسَبية في الحاشية.
theological_decisions:
- issue: اللقب المسيحاني υἱὸς Ὑψίστου
  choice: ابن العليّ
  alternative: ابنٌ للعليّ
  rationale: السياق يجعل العبارة لقبًا خاصًا بالمولود المعلَن عنه؛ وتحفظ الصياغة المختارة قوة البنوة من غير إضافة صياغة عقائدية لاحقة إلى النص.
- issue: ترجمة κύριος في κύριος ὁ θεὸς
  choice: الرب الإله
  alternative: السيد الإله
  rationale: «الرب» هو المقابل الكتابي العربي الطبيعي هنا، مع تجنب الإفراط في التحديد بما يتجاوز النص اليوناني.
- issue: أبوة داود
  choice: داود أبيه
  alternative: داود سلفه
  rationale: تُبقي الترجمة لغة الأصل الأسرية والسلالية، بينما توضّح الحاشية أن المقصود الأبوة من جهة النسب الملكي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُبقي اسم الإشارة «هذا» لأنه طبيعي في العربية وأقرب إلى οὗτος من تحويله إلى ضمير. وُضعت علامات الحواشي في المتن وربطت كل حاشية بموضعها.
