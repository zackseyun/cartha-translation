  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: ar
  text: 'وقال آخر: «اشتريتُ خمسة أزواج من الثيران، وأنا ذاهب لأجرّبها. أرجوك، عُدَّني معذورًا[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اعتبرني مُعفًى». يفيد الأصل طلب معاملته بوصفه قد أُعفي من تلبية الدعوة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: آخر
  rationale: تدل الكلمة هنا على شخص آخر ضمن سلسلة المدعوين الذين يقدّمون أعذارهم، و«آخر» موجزة وطبيعية في العربية.
- source_word: Ζεύγη βοῶν ... πέντε
  choice: خمسة أزواج من الثيران
  rationale: يدل ζεῦγος على زوج من الحيوانات المقرونة للعمل؛ والتعبير المختار ينقل العدد والصورة الزراعية بوضوح، من غير افتراض أن المقصود خمسة ثيران منفردة.
- source_word: ἠγόρασα
  choice: اشتريتُ
  rationale: صيغة الماضي اليونانية تصف فعل الشراء المكتمل، والماضي العربي هو المقابل الطبيعي هنا، مع بقاء صلته المباشرة بالعذر مفهومة من السياق.
- source_word: πορεύομαι
  choice: أنا ذاهب
  rationale: ينقل المضارع اليوناني معنى التوجّه أو القصد الحالي، والتعبير العربي يوضح أن الأمر وشيك أو جارٍ.
- source_word: δοκιμάσαι
  choice: لأجرّبها
  rationale: الفعل يعني اختبار الشيء لمعرفة صلاحيته؛ و«أجرّبها» طبيعية في سياق ثيران اشتراها حديثًا، مع إمكان فهمها بمعنى اختبارها في العمل.
- source_word: ἐρωτῶ σε
  choice: أرجوك
  rationale: يفيد التعبير طلبًا مباشرًا مهذبًا، و«أرجوك» أنسب في العربية الحالية من الترجمة الحرفية «أسألك» في هذا السياق.
- source_word: ἔχε με παρῃτημένον
  choice: عُدَّني معذورًا
  rationale: يجمع الأصل بين فعل بمعنى «اعتبر/اجعل في حكم» واسم مفعول يفيد حالة الإعفاء من الالتزام؛ والصياغة العربية تحفظ معنى اعتباره قد قُبل عذره، بدل اختزاله إلى مجرد تقديم العذر.
theological_decisions: []
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُخدم «خمسة أزواج من الثيران» بدل تعبير حرفي غير مألوف من قبيل «خمسة أنيار»، واستُبقيت دلالة الحالة الناتجة في العبارة الختامية بصياغة طبيعية.
