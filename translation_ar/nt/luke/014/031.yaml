  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: ar
  text: أو أيُّ ملكٍ، وهو ماضٍ ليشتبك مع ملكٍ آخر في حرب، لا يجلس أولًا ويتدبّر هل يقدر بعشرة آلاف أن يواجه[a] من يأتي عليه بعشرين ألفًا؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يلاقي»؛ فالفعل اليوناني يعني حرفيًّا اللقاء، لكنه يشير هنا إلى مواجهة جيش متقدّم في القتال.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: أو
  rationale: تُدخل المَثَل المقارن الثاني وتحافظ على انسياب السؤال البلاغي.
- source_word: τίς βασιλεὺς
  choice: أيُّ ملكٍ
  rationale: صياغة عربية طبيعية لسؤال بلاغي عام يتوقع جوابًا معلومًا.
- source_word: πορευόμενος
  choice: وهو ماضٍ
  rationale: تنقل معنى الحركة المقصودة من غير أن تضيف تحديدًا عسكريًا غير لازم؛ ويبيّن السياق غاية الذهاب.
- source_word: ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: ليشتبك مع ملكٍ آخر في حرب
  rationale: «يشتبك» يعبّر بوضوح عن الدخول في مواجهة عسكرية، و«ملك آخر» تنقل الدلالة العامة لـἕτερος.
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: لا يجلس أولًا ويتدبّر
  rationale: يحفظ ترتيب الفعلين وقوة السؤال البلاغي، و«يتدبّر» ينقل معنى المداولة والتفكير المتأني.
- source_word: εἰ δυνατός ἐστιν
  choice: هل يقدر
  rationale: تعبير عربي واضح عن القدرة العملية على خوض المواجهة.
- source_word: ἐν δέκα χιλιάσιν
  choice: بعشرة آلاف
  rationale: الباء تفيد الاستعانة بالقوة المتاحة له، كما يقتضي السياق العسكري.
- source_word: ὑπαντῆσαι
  choice: أن يواجه
  rationale: المعنى الأساسي هو اللقاء، لكنه هنا لقاء عسكري مع جيش متقدم؛ و«يواجه» يوضح السياق من غير مبالغة.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: من يأتي عليه بعشرين ألفًا
  rationale: يحافظ على صورة الخصم الآتي نحوه بقوة أكبر وعلى دلالة ἐπ’ αὐτόν العدائية في السياق.
theological_decisions: []
