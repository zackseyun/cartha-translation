base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: ar
  text: لا يصلح لا للأرض ولا لكومة السماد[a]؛ يطرحونه خارجًا. مَن له أذنان للسمع[b]، فليسمع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كومة الروث».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الذي له أذنان للسمع، فليسمع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: الأرض
  rationale: تشير الكلمة هنا إلى الأرض أو التربة في سياق زراعي، لا إلى العالم بمعناه الكوني. و«الأرض» تعبير عربي طبيعي وواضح في هذا التقابل.
- source_word: κοπρίαν
  choice: كومة السماد
  rationale: تدل الكلمة على الروث أو السماد العضوي ومكان جمعه. و«كومة السماد» تحافظ على الصورة الزراعية الملموسة بلغة معاصرة مهذبة.
- source_word: εὔθετόν
  choice: يصلح
  rationale: يفيد اللفظ معنى الملاءمة لغرض أو استعمال. و«يصلح لـ» ينقل هذا المعنى بوضوح ومن غير حصره في مجرد المنفعة.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: يطرحونه خارجًا
  rationale: يحافظ هذا التعبير على الفعل المبني للمعلوم وفاعل الجمع غير المعيّن في اليونانية، كما يصون الصورة الحسية للطرد إلى الخارج.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: مَن له أذنان للسمع، فليسمع
  rationale: ينقل الصيغة الختامية المأثورة وقوة الأمر في ἀκουέτω، مع تعبير عربي طبيعي يفيد العموم من غير إزالة صورة الأذنين.
theological_decisions:
- issue: صيغة المفرد المذكر ذات الدلالة التمثيلية في النداء الختامي
  choice: مَن له أذنان للسمع، فليسمع
  alternative: الذي له أذنان للسمع، فليسمع
  rationale: اليونانية مفرد مذكر من حيث الصياغة، لكنها عامة الدلالة. تستعمل العربية «مَن» استعمالًا عامًا، مع إبقاء فعل الأمر بصيغة المفرد المذكر المطابقة لبنية النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على الصورة الزراعية، وعلى الفعل المعلوم ذي الفاعل غير المعيّن، وعلى النبرة الآمرة في خاتمة القول.
