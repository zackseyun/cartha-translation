  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: ar
  text: 'فقال السيد لعبده: «اخرج إلى الطرق والأسيجة، وألزمهم أن يدخلوا[a]، لكي يمتلئ بيتي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ألحّ عليهم بشدة أن يدخلوا». الفعل اليوناني قوي، وقد يعني «ألزم» أو «اضغط عليهم»، لكن سياق هذا المثل لا يقتضي أن يكون المقصود استخدام القوة الجسدية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: السيد
  rationale: في سياق المثل يدل اللفظ على صاحب البيت وسيد العبد داخل أحداث القصة، لا بالضرورة على لقب إلهي مباشر.
- source_word: δοῦλον
  choice: عبده
  rationale: يحفظ «عبد» دلالة التبعية الاجتماعية في δοῦλος بوضوح أكبر من «خادم»، مع ملاءمته لسياق البيت.
- source_word: Ἔξελθε
  choice: اخرج
  rationale: ينقل فعل الأمر ودلالة الحركة إلى الخارج الواضحة في ἐξέρχομαι.
- source_word: ὁδοὺς
  choice: الطرق
  rationale: تعبير عربي طبيعي عن مسالك التنقل خارج الموضع المباشر، ويلائم اقترانه بالأسيجة.
- source_word: φραγμοὺς
  choice: الأسيجة
  rationale: يمكن أن يدل φραγμός على سياج أو حاجز نباتي؛ و«الأسيجة» يحفظ صورة حدود الطرق والأراضي دون تقييدها بالشجيرات وحدها.
- source_word: ἀνάγκασον
  choice: ألزم الناس
  rationale: يحفظ قوة الفعل اليوناني الذي يفيد الإلزام أو الضغط، بينما توضح الحاشية أن سياق المثل لا يوجب فهم العنف الجسدي.
- source_word: εἰσελθεῖν
  choice: بالدخول
  rationale: صياغة عربية طبيعية بعد «ألزم»، وتنقل معنى الدخول إلى البيت.
- source_word: ἵνα γεμισθῇ
  choice: لكي يمتلئ
  rationale: ينقل بوضوح معنى الغاية في تركيب ἵνα مع صيغة المبني للمجهول.
- source_word: μου ὁ οἶκος
  choice: بيتي
  rationale: يشير οἶκος هنا إلى البيت الذي تُقام فيه الوليمة، و«بيتي» ترجمة مباشرة وطبيعية.
theological_decisions:
- issue: دلالة κύριος داخل المثل
  choice: السيد
  alternative: الرب
  rationale: اللفظ يؤدي هنا دور صاحب البيت وسيد العبد ضمن عالم المثل. «السيد» يمنع فرض لقب إلهي مباشر، من غير أن يلغي الدلالة اللاهوتية التي قد يحملها المثل في سياقه.
- issue: قوة ἀνάγκασον
  choice: ألزم الناس بالدخول
  alternative: ألحّ عليهم أن يدخلوا
  rationale: يحفظ النص الرئيس قوة الفعل اليوناني ولا يخففها، مع إبقاء طبيعة الإلزام مفتوحة بحسب السياق؛ وتمنع الحاشية افتراض أن المقصود حتمًا هو استخدام القوة الجسدية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «السيد» لدور صاحب البيت، و«عبد» لصون الوضع الاجتماعي الذي يدل عليه الأصل، مع حاشية تشرح قوة فعل الإلزام من غير حسمها في معنى العنف.
