  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: ar
  text: 'لكنهم أخذوا جميعًا يعتذرون بإجماع[a]. فقال له الأول: «اشتريتُ حقلًا، ولا بدّ لي أن أخرج لأراه. أرجوك، عُدَّني معذورًا»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: حرفيًا «من واحدة»، وهو تعبير اصطلاحي يعني «معًا» أو «بإجماع». ويمكن أن يدل فعل «يعتذرون» أيضًا على رفض الدعوة مع تقديم عذر.
    reason: lexical_alternative
  - marker: b
    text: 'تعبير «عُدَّني معذورًا» يعني: اقبل اعتذاري عن الحضور.'
    reason: idiom_clarification
lexical_decisions:
- source_word: καὶ
  choice: لكن
  rationale: تؤدي أداة الربط هنا معنى التحول المناقض للدعوة الواردة في السياق السابق، و«لكن» طبيعية وواضحة بالعربية.
- source_word: ἤρξαντο ... παραιτεῖσθαι
  choice: أخذوا يعتذرون
  rationale: ينقل التركيب معنى الشروع في رفض الدعوة بتقديم الاعتذار، مع إبقاء الصياغة طبيعية في العربية.
- source_word: ἀπὸ μιᾶς
  choice: كأنهم على رأي واحد
  rationale: تعبير اصطلاحي يفيد اجتماعهم أو اتفاقهم في الموقف، من غير ترجمة حرفية غامضة مثل «من واحدة».
- source_word: πάντες
  choice: جميعًا
  rationale: يحفظ شمول الاستجابة لجميع المدعوين المذكورين.
- source_word: Ἀγρόν
  choice: حقلًا
  rationale: مقابل مباشر لـἀγρός، ولا يضيف معنى «مزرعة» الأخص.
- source_word: ἠγόρασα
  choice: اشتريتُ
  rationale: الماضي العربي ينقل الفعل المكتمل بوضوح، وتُفهم صلته بالحاضر من السياق.
- source_word: ἔχω ἀνάγκην
  choice: لا بدّ لي
  rationale: تعبير عربي طبيعي عن الضرورة مع الحفاظ على قوة الأصل.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: أن أخرج لأراه
  rationale: يحفظ فعل الخروج وغرض الرؤية دون إضافة دلالة الفحص التي لا يوجبها الأصل.
- source_word: ἐρωτῶ σε
  choice: أرجوك
  rationale: ينقل صيغة الطلب المهذب الصريحة بأسلوب عربي مألوف.
- source_word: ἔχε με παρῃτημένον
  choice: عُدَّني معذورًا
  rationale: صياغة عربية موجزة تحفظ معنى اعتبار المتكلم في حالة قبول اعتذاره.
- source_word: ὁ πρῶτος
  choice: الأول
  rationale: ترجمة مباشرة للترتيب الذي يفتتح سلسلة الأعذار.
