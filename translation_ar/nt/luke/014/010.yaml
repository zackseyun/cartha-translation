source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: ar
  text: 'بل حين تُدعَى، اذهب واتكئ[a] في المكان الأدنى، حتى إذا جاء الذي دعاك، قال لك: «يا صديقي، تقدَّم إلى مكان أعلى[b]». فحينئذ تكون لك كرامة أمام جميع المتكئين معك.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اجلس». يدل الفعل اليوناني تحديدًا على الاتكاء إلى المائدة عند تناول الطعام.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «اصعد إلى موضع أعلى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθῇς
  choice: تُدعَى
  rationale: في سياق الوليمة تعني الدعوة إلى الحضور، لا مجرد النداء؛ والصياغة العربية تحافظ أيضًا على الصلة اللفظية بالفعل «دعاك» لاحقًا.
- source_word: πορευθεὶς ἀνάπεσε
  choice: اذهب واتكئ
  rationale: صيغ اسم الفاعل بوصفه فعلًا منسقًا مع الأمر، مع إبقاء صورة الاتكاء إلى المائدة المعهودة في سياق الولائم القديمة.
- source_word: ἔσχατον τόπον
  choice: المكان الأدنى
  rationale: المقصود الموضع الأقل منزلة في ترتيب الضيوف، و«الأدنى» يبين دلالة المرتبة الاجتماعية دون تحويل العبارة إلى تفسير مطول.
- source_word: ὁ κεκληκώς σε
  choice: الذي دعاك
  rationale: ترجمة مباشرة وواضحة لاسم الفاعل، من غير استبداله بتعبير تفسيري مثل «صاحب الوليمة».
- source_word: Φίλε
  choice: يا صديقي
  rationale: نداء عربي طبيعي مهذب يقابل صيغة الخطاب اليونانية، ولا يضيف مضمونًا عقديًا.
- source_word: προσανάβηθι ἀνώτερον
  choice: تقدَّم إلى مكان أعلى
  rationale: ينقل الانتقال إلى موضع أرفع منزلة مع الحفاظ على صورة العلو، ويتجنب العبارة العربية المتكلفة «اصعد إلى أعلى».
- source_word: δόξα
  choice: كرامة
  rationale: في هذا السياق الاجتماعي تدل الكلمة على التكريم العلني والمكانة أمام الضيوف، لا على المجد الإلهي.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: أمام جميع المتكئين معك
  rationale: يحفظ علنية التكريم وصورة المشاركين في الوليمة وهم متكئون إلى المائدة.
theological_decisions:
- issue: طبيعة التعليم في القول
  choice: إبقاء العبارة تعليمًا في التواضع وانقلاب مراتب الكرامة ضمن صورة الوليمة، من غير حصرها في آداب اجتماعية فقط أو في جزاء أخروي فقط.
  alternative: صياغتها إما نصيحة سلوكية محضة في آداب الولائم، وإما وعدًا أخرويًا صريحًا حصريًا.
  rationale: النص نفسه يستخدم موقفًا اجتماعيًا يحمل مغزى أوسع، لكنه لا يصرح هنا بحصر ذلك المغزى في أحد التفسيرين.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة وقورة. حُفظت صورة الاتكاء التاريخية، مع شرحها في الحاشية، واستُعملت «كرامة» للدلالة الاجتماعية لـδόξα في هذا السياق.
