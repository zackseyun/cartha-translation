  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: ar
  text: لأن كلَّ من يتعالى سيُذَلّ، ومن يتواضع سيُرفَع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تُبقي الأداة تعليلية، إذ تبيّن هذه الحكمة سبب التوجيه السابق، من غير تحويلها إلى مجرد استئناف.
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: كلَّ من يتعالى
  rationale: ينقل «كل من» العموم الذي في التركيب اليوناني، ويعبّر «يتعالى» عربيًا بوضوح عن رفع المرء نفسه وطلب المنزلة الرفيعة، مع بقاء المعنى الانعكاسي ملازمًا لصيغة الفعل.
- source_word: ταπεινωθήσεται
  choice: سيُذَلّ
  rationale: يحافظ على صيغة المستقبل المبني للمجهول وعلى انقلاب حال المتعالي، من غير التصريح بمن يقوم بالفعل.
- source_word: καὶ
  choice: و
  rationale: تحافظ الواو على عطف الشطر الثاني كما في اليونانية، بينما يظهر التضاد من الألفاظ نفسها.
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: من يتواضع
  rationale: «يتواضع» هو التعبير العربي الطبيعي عن خفض المرء نفسه طوعًا، وتفيد «من» المعنى العام من غير حصره في شخص بعينه.
- source_word: ὑψωθήσεται
  choice: سيُرفَع
  rationale: يحافظ على المستقبل المبني للمجهول وعلى صورة الرفع المقابلة للتواضع، دون إضافة فاعل لم يذكره النص.
theological_decisions:
- issue: الفاعل المضمر في فعلي المستقبل المبنيين للمجهول
  choice: الإبقاء على «سيُذَلّ» و«سيُرفَع» من غير ذكر الفاعل
  alternative: 'أن يُقال: «سيُذِلّه الله» و«سيرفعه الله»'
  rationale: قد يُفهَم من السياق الكتابي أن الله هو الفاعل، لكن النص اليوناني لا يصرّح به؛ لذلك يحفظ المبني للمجهول الإيحاء اللاهوتي من غير أن يحوّله إلى تصريح.
- issue: الصيغ المذكرة المفردة ذات الدلالة العامة
  choice: استعمال «كل من» و«من» للدلالة العامة
  alternative: إبراز ضمير مذكر صريح مثل «نفسه» في كلا الشطرين
  rationale: أداة الشرط والموصول «من» عامة في العربية وتشمل كل إنسان، والفعلان «يتعالى» و«يتواضع» يؤديان المعنى الانعكاسي طبيعيًا من غير حاجة إلى ضمير قد يثقل العبارة.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة وحِكمية، تحافظ على التوازي والتضاد بين التعالي والتواضع، وعلى المبني للمجهول في النتيجتين. لم تُضف حاشية لأن الصياغة العربية العامة بـ«من» لا تحتاج إلى تنبيه خاص بشأن المذكر اليوناني.
