  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: ar
  text: هكذا إذن، كلُّ واحدٍ منكم[b]، إن لم يتخلَّ[a] عن جميع ممتلكاته، لا يقدر أن يكون تلميذًا لي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يودّع جميع ما له». يمكن أن يعني الفعل اليوناني «يقول وداعًا لـ»، ويدل هنا على التخلي الحاسم عما يملكه الإنسان؛ ولا تحسم العبارة وحدها صورة هذا التخلي.'
    reason: lexical_alternative
  - marker: b
    text: جاء ضمير الملكية في اليونانية بصيغة المفرد المذكر («ممتلكاته الخاصة»)، لكنه مستعمل استعمالًا عامًا وينطبق على كل تلميذ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: وهكذا إذن
  rationale: يحفظ التعبيران معًا معنى الكيفية أو المماثلة في οὕτως وقوة الاستنتاج والربط في οὖν، فيصل القول بالمثلين السابقين ويقدمه بوصفه خلاصة تطبيقية.
- source_word: πᾶς ἐξ ὑμῶν
  choice: كلُّ واحدٍ منكم
  rationale: صياغة توزيعية تُبرز أن المطلب موجَّه إلى كل سامع على حدة.
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: لا يتخلّى
  rationale: الفعل اليوناني قد يعني حرفيًا «يودّع» أو «يفارق»، ويعبّر هنا عن ترك حاسم لما يملكه الإنسان. «يتخلّى» عربية طبيعية تحافظ على شدة المطلب من غير أن تحسم وحدها كيفية هذا التخلي.
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: عن كلِّ ما يملكه
  rationale: التركيب الاصطلاحي يشير إلى ممتلكات الشخص وما هو له. وهذه الصياغة واضحة وشاملة، وتعكس ضمير الملكية المفرد في الأصل.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: لا يقدر أن يكون تلميذًا لي
  rationale: يحفظ معنى العجز أو الاستحالة في οὐ δύναται، لا مجرد عدم الملاءمة، ويؤدي علاقة التلميذ بيسوع بعبارة عربية طبيعية.
- source_word: μαθητής
  choice: تلميذ
  rationale: هو المقابل العربي الراسخ في سياق الأناجيل، ويحفظ معنى التعلّم والاتباع والعلاقة بالمعلم.
theological_decisions:
- issue: طبيعة التخلي المطلوب عما يملكه الإنسان
  choice: استعمال «يتخلّى عن كل ما يملكه» مع إيضاح المجال الدلالي في الحاشية، من غير تقييد المطلب بالتجرد المادي وحده أو بالموقف الباطني وحده.
  alternative: «يتنازل عن جميع ممتلكاته» أو «يبيع كل ممتلكاته»، بما قد يحسم القول لصالح نقل الملكية أو التصرف المادي المطلق.
  rationale: ἀποτάσσεται لفظ قوي يمكن أن يدل على التوديع والمفارقة والتخلي. لا يحدد العدد وحده صورة التنفيذ في كل حالة، ولذلك ينبغي إبقاء حدة القول والتوتر بين ترك التملك فعليًا والتخلي عن التمسك والادعاء، بدل حلّه مذهبيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. أُبقي تركيب «وهكذا إذن» لإظهار الصلة الاستنتاجية بالمثلين السابقين، واستُخدم المفرد المذكر العام وفق بنية الأصل مع حاشية توضيحية. وُضعت علامتا الحاشيتين في المتن صراحة.
