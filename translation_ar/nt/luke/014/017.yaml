base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: ar
  text: 'وعند وقت العشاء أرسل خادمه ليقول للمدعوين: «تعالوا، لأن كل شيء جاهز الآن».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لأن الأشياء جاهزة الآن». تترك اليونانية ما هو الجاهز غير مصرَّح به، وتستعمل صفةً في الجمع المحايد ذات معنى جمعي؛ والمعنى في السياق أن الاستعدادات قد اكتملت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: أرسل
  rationale: ينقل الفعل الماضي نقلاً مباشرًا وطبيعيًا من غير إضافة دلالة أقوى مثل «أوفد».
- source_word: δοῦλον
  choice: خادمه
  rationale: يلائم وظيفة الشخص في سياق البيت والمأدبة، بينما «عبده» ممكنة معجميًا لكنها قد تبرز الوضع الاجتماعي أكثر مما يقتضيه السياق.
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: في ساعة العشاء
  rationale: يحافظ على التعبير الزمني المحدد في اليونانية، بصياغة عربية واضحة ومفهومة.
- source_word: εἰπεῖν
  choice: ليقول
  rationale: يعبّر عن غرض الإرسال ويتصل طبيعيًا بالقول المباشر اللاحق.
- source_word: τοῖς κεκλημένοις
  choice: للمدعوين
  rationale: اسم المفعول العربي يدل على الذين سبق توجيه الدعوة إليهم، بإيجاز طبيعي.
- source_word: Ἔρχεσθε
  choice: تعالوا
  rationale: ينقل صيغة الأمر بوصفها دعوة مباشرة إلى الحضور.
- source_word: ὅτι
  choice: لأن
  rationale: تبيّن سبب الدعوة بوضوح، وفق الوظيفة السببية للأداة.
- source_word: ἤδη
  choice: الآن
  rationale: في هذا السياق تفيد بلوغ الاستعداد تمامه عند هذه اللحظة؛ وموضعها مع «قد صار» يؤدي معنى «بالفعل/الآن» عربيًا.
- source_word: ἕτοιμά ἐστιν
  choice: كلَّ شيء قد صار جاهزًا
  rationale: التعبير اليوناني جمع محايد ذو معنى جمعي وفاعلُه الضمني غير مصرّح به؛ وهذه الصياغة العربية الطبيعية تنقل المعنى الجمعي من غير حصره صراحة في الطعام وحده.
