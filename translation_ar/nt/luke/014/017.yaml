  to: 'وعند وقت العشاء أرسل خادمه ليقول للمدعوين: «تعالوا، لأن كل شيء جاهز الآن».[a]'
  rationale: صُحِّحت الحاشية لكي تمثل بدقة الفعل الحاضر والمرجع الضمني للجمع المحايد في اليونانية، من غير إدخال ضمير مؤنث أو معنى «الصيرورة». كما عُدِّلت العبارة الزمنية إلى تركيب عربي أحدث سلاسة، وصيغت الجملة الأخيرة بما يحافظ على المعنى الجمعي الضمني.
