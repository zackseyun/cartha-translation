  source_fidelity: 'النص ينقل البنية والمعنى الأساسيين بأمانة: إرسال الخادم عند وقت العشاء، والمخاطبون الذين سبق أن دُعوا، والدعوة إلى المجيء بسبب اكتمال الاستعداد. غير أن الحاشية الحالية تصف العبارة اليونانية وصفًا غير دقيق، إذ لا تتضمن ضميرًا مؤنثًا ولا فعل «صار».'
