  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: ar
  text: 'وكان يقول للمدعوين مثلًا، إذ لاحظ كيف كانوا يختارون أماكن الصدارة، قائلًا لهم:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν δὲ
  choice: وكان يقول
  rationale: ينقل الفعل الناقص بوصفه فعلًا مستمرًا أو ممهدًا للمشهد، وتؤدي الواو وظيفة δὲ الانتقالية الخفيفة من غير افتعال معنى زمني أو تقابلي.
- source_word: τοὺς κεκλημένους
  choice: للمدعوين
  rationale: يحافظ على دلالة اسم المفعول التام، أي الأشخاص الذين وُجّهت إليهم الدعوة وصاروا في عداد المدعوين.
- source_word: παραβολήν
  choice: مثلًا
  rationale: «مَثَل» هو المقابل العربي المألوف لمصطلح παραβολή في سياق الأناجيل.
- source_word: ἐπέχων
  choice: إذ لاحظ
  rationale: يبين الظرف الذي دفع إلى قول المثل، وينقل معنى الانتباه والملاحظة بصياغة عربية طبيعية.
- source_word: πῶς
  choice: كيف
  rationale: يحفظ دلالة الكيفية مباشرة.
- source_word: τὰς πρωτοκλισίας
  choice: أماكن الصدارة
  rationale: يعبر بوضوح عن المواضع الأرفع منزلة في ترتيب الاتكاء إلى المائدة، لا عن مقاعد بالمعنى الحديث حصرًا.
- source_word: ἐξελέγοντο
  choice: كانوا يختارون
  rationale: يحفظ الاستمرار أو التكرر الذي يدل عليه الماضي الناقص؛ والسياق يوضح أنهم يختارون هذه الأماكن لأنفسهم دون حاجة إلى زيادة ثقيلة.
- source_word: λέγων πρὸς αὐτούς
  choice: فقال لهم
  rationale: يحوّل اسم الفاعل إلى فعل عربي طبيعي يمهد للكلام المباشر، مع بقاء الصلة المنطقية بالملاحظة السابقة.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُعمل «أماكن الصدارة» بدل تعبير حرفي قد يوحي بكراسٍ حديثة، لأن الوليمة القديمة كانت تُرتب فيها مواضع الاتكاء بحسب المكانة. لا توجد حاجة إلى حاشية في هذه الصياغة، ولا تظهر علامة حاشية في المتن.
