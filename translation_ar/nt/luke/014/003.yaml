source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: ar
  text: 'فأجاب يسوع وقال لعلماء الشريعة والفريسيين[a]: «هل يحلّ الشفاء في يوم السبت أم لا؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي المختصين بالشريعة اليهودية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: فأجاب
  rationale: يحفظ معنى الاستجابة في الصيغة السردية اليونانية، سواء أكانت ردًّا على كلام أم على الموقف القائم.
- source_word: εἶπεν
  choice: وقال
  rationale: يحفظ التعبير اليوناني المزدوج «أجاب وقال» بدل دمج الفعلين.
- source_word: νομικοὺς
  choice: علماء الشريعة
  rationale: يشير اللفظ إلى المختصين بالشريعة اليهودية، لا إلى المحامين بالمعنى المدني الحديث.
- source_word: Φαρισαίους
  choice: الفريسيين
  rationale: التسمية العربية المألوفة لهذه الجماعة اليهودية.
- source_word: Ἔξεστιν
  choice: هل يحلّ
  rationale: ينقل القوة الشرعية للسؤال عن الجواز في سياق أحكام السبت، بصياغة عربية موجزة وطبيعية.
- source_word: τῷ σαββάτῳ
  choice: في يوم السبت
  rationale: ينقل دلالة الزمن بوضوح ويستعمل التعبير العربي المألوف.
- source_word: θεραπεῦσαι
  choice: الشفاء
  rationale: ينقل معنى θεραπεύω في سياق أعمال الشفاء؛ وجاء مصدرًا بعد «يحلّ» في تركيب عربي طبيعي.
- source_word: ἢ οὔ
  choice: أم لا
  rationale: صياغة عربية مباشرة وطبيعية للسؤال المنفصل.
theological_decisions:
- issue: صياغة سؤال حكم الشفاء في السبت دون استباق جواب يسوع
  choice: هل يحلّ الشفاء في يوم السبت أم لا؟
  alternative: هل يجوز أن يُشفى أحد في يوم السبت أم لا؟
  rationale: تحافظ الصياغة على الطابع الشرعي اللاهوتي للسؤال وعلى توتره المفتوح، من غير إضافة تفسير عن الرحمة أو الضرورة أو سلطان يسوع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «علماء الشريعة» لتجنب الإيحاء بالمحاماة الحديثة، و«هل يحلّ» لإبراز طبيعة السؤال الشرعية مع إبقاء الجواب مفتوحًا.
