  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: ar
  text: بل، كلما أقمتَ مأدبةً[a]، فادعُ الفقراء وذوي الإعاقات الجسدية[b] والعُرج والعميان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وليمة» أو «ضيافة».
    reason: lexical_alternative
  - marker: b
    text: يشير اللفظ اليوناني إلى أشخاص ذوي إعاقات أو عاهات جسدية، وقد يُترجم أيضًا «ذوي العاهات الجسدية».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: بل
  rationale: أداة استدراك تقابل بين هذه الوصية وما سبقها بشأن من لا ينبغي أن يوجَّه إليهم العزم طلبًا للمكافأة.
- source_word: ὅταν
  choice: كلما
  rationale: تنقل دلالة الزمن غير المحدد مع صيغة الاحتمال في اليونانية، أي في كل مناسبة من هذا النوع، لا في مناسبة واحدة بعينها.
- source_word: δοχὴν ποιῇς
  choice: أقمتَ مأدبةً
  rationale: تعبير عربي طبيعي عن إقامة ضيافة أو وليمة، ويحفظ معنى الاستضافة المرتبطة بالطعام.
- source_word: κάλει
  choice: فادعُ
  rationale: الفعل في سياق المأدبة يعني توجيه الدعوة، وصيغة الأمر العربية تنقل قوة الأصل.
- source_word: πτωχούς
  choice: الفقراء
  rationale: ينقل الصفة المستعملة اسميًا بوصفها فئة اجتماعية ضمن القائمة الموجزة.
- source_word: ἀναπείρους
  choice: ذوي الإعاقات
  rationale: تعبير حديث محترم يشير إلى أصحاب الإعاقات الجسدية، مع إبقاء هذا الوصف متميزًا عن العُرج المذكورين بعده.
- source_word: χωλούς
  choice: العُرج
  rationale: يشير تحديدًا إلى من تعوقهم إصابة أو إعاقة في المشي، ويحفظ تمايز اللفظ عن ἀναπείρους الأوسع.
- source_word: τυφλούς
  choice: العميان
  rationale: مقابل عربي موجز ومباشر للصفة اليونانية المستعملة اسميًا.
theological_decisions:
- issue: صياغة أوصاف الإعاقة مع حفظ بنية القائمة ودلالتها
  choice: ذوي الإعاقات والعُرج
  alternative: أصحاب العاهات والمقعدون؛ أو ذوو الإعاقات الحركية والعُرج
  rationale: يحفظ الاختيار فئتين متمايزتين في النص اليوناني من غير استعمال تعبير جارح أو حصر ἀναπείρους في نوع واحد من الإعاقة. والمقصود وصية بإكرام فئات مهمشة اجتماعيًا، لا تقرير قيمة هوياتية أو مذهبية عنها.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعملت «كلما» لإبراز الزمن غير المحدد المتكرر، و«ذوي الإعاقات» لصياغة مفهومة ومحترمة، مع الحفاظ على إيقاع القائمة اليونانية الموجز.
