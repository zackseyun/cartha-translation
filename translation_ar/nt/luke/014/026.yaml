  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: ar
  text: إن جاء إليّ أحد ولم يبغض[a] أباه وأمه وزوجته وأولاده وإخوته وأخواته، وحتى حياته نفسها[b]، فلا يقدر أن يكون تلميذًا لي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا يحب أباه وأمه... حبًّا أقل». الفعل يعني حرفيًا «يبغض»، لكنه في هذا السياق يفيد أن الولاء ليسوع يتقدّم حتى على أوثق الروابط العائلية؛ قارن متى 10:37.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «نفسه». تدل الكلمة هنا، على الأرجح، على حياة الإنسان أو ذاته في سياق كلفة التلمذة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: يبغض
  rationale: يحافظ على المعنى المعجمي المباشر وعلى حدّة قول يسوع، من غير أن يحسم في المتن دلالته المقارِنة المحتملة؛ وقد ذُكرت هذه الدلالة في الحاشية.
- source_word: ἔρχεται πρός με
  choice: جاء إليّ
  rationale: تعبير عربي طبيعي يحفظ معنى التوجّه المباشر إلى يسوع، من غير استبداله بعبارة «يتبعني» غير الواردة هنا.
- source_word: πατέρα ἑαυτοῦ
  choice: أباه
  rationale: ضمير الملكية المتصل في العربية يبيّن أن المقصود أبوه هو، ولا تحتاج العربية إلى إضافة لفظ مستقل يقابل الضمير الانعكاسي كي تؤدي المعنى طبيعيًا.
- source_word: γυναῖκα
  choice: زوجته
  rationale: سياق تعداد أفراد الأسرة يعيّن معنى الزوجة، لا المعنى العام «امرأة».
- source_word: τὰ τέκνα
  choice: أولاده
  rationale: لفظ عربي جامع وطبيعي للأبناء ضمن قائمة العلاقات العائلية.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: إخوته وأخواته
  rationale: يحفظ ذكر الذكور والإناث صراحة كما في النص اليوناني.
- source_word: ἔτι τε καὶ
  choice: بل حتى
  rationale: ينقل التصعيد البلاغي الذي يجعل حياة المرء نفسه ذروة القائمة.
- source_word: ψυχὴν ἑαυτοῦ
  choice: حياته نفسها
  rationale: يدل ψυχή هنا على حياة الإنسان أو ذاته في سياق كلفة التلمذة، و«نفسها» تحافظ على قوة الضمير الانعكاسي.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: فلا يقدر أن يكون تلميذًا لي
  rationale: يحفظ معنى عدم القدرة أو عدم التوافق، لا مجرد المنع، مع إبقاء صلة التلميذ بيسوع واضحة.
theological_decisions:
- issue: هل يُلطَّف طلب يسوع بترجمة μισεῖ تعبيرًا مقارنًا في المتن؟
  choice: إبقاء «يبغض» في المتن وشرح معنى «يحب أقل» المحتمل في الحاشية.
  alternative: 'ترجمة العبارة في المتن: «لا يحب ... أقل».'
  rationale: اللفظ اليوناني شديد ومقصود، وإبقاؤه يصون التوتر اللاهوتي والبلاغي، بينما تتيح الحاشية بيان أن السياق يطالب بتقديم الولاء ليسوع على أقرب الروابط من غير تسطيح العبارة.
- issue: دلالة ψυχή في هذه الآية
  choice: ترجمتها «حياته» لا «نفسه» بالمعنى الأنثروبولوجي الضيق.
  alternative: «نفسه» أو «روحه».
  rationale: سياق كلفة التلمذة يشير إلى حياة الإنسان وذاته التي يتمسك بها، ولا يركّز على تمييز النفس غير المادية عن الجسد.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ومهيبة. استُعمل «يبغض» للمحافظة على حدّة الأصل، و«زوجته» و«حياته نفسها» للوضوح الطبيعي. وُضعت علامتا الحاشيتين بعد الجملة لأنهما تشرحان لفظين بارزين فيها.
