lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: فقال له
  rationale: تنقل الفاء انتقال الحديث وجوابه لما سبق بصورة طبيعية، و«له» تحفظ مرجع الضمير في الأصل من غير مبالغة في إبراز التقابل الذي قد توحي به «لكن».
- source_word: Ἄνθρωπός τις
  choice: كان رجلٌ
  rationale: هذا أسلوب عربي طبيعي لافتتاح المثل بشخص غير معيّن، ويؤدي معنى التنكير في τις مع حفظ صيغة المذكر المفرد.
- source_word: ἐποίει
  choice: يُعِدُّ
  rationale: المضارع بعد «كان» ينقل دلالة الماضي المستمر في صيغة الناقص اليونانية، و«يُعِدّ» هو التعبير العربي الطبيعي في سياق تجهيز وليمة.
- source_word: δεῖπνον μέγα
  choice: وليمةً عظيمةً
  rationale: «وليمة» تلائم سياق وجبة كبيرة رسمية يدعو إليها المضيف ضيوفًا، و«عظيمة» تقابل μέγα من حيث الحجم والشأن.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: ودعا كثيرين
  rationale: «دعا» في سياق الوليمة يفيد توجيه الدعوة، و«كثيرين» تحفظ إيجاز πολλούς من غير إضافة اسم غير مصرح به.
