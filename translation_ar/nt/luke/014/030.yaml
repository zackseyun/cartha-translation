  language: ar
  text: 'قائلين: «هذا الرجل شرع في البناء، ولم يقدر[a] أن يُكمله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم تكن لديه القوة الكافية لإتمامه».'
    reason: بديل معجمي يحفظ الدلالة الأقرب إلى القوة أو المقدرة في ἴσχυσεν.
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'قائلين:'
  rationale: اسم الفاعل يربط القول بفاعل الآية السابقة، والنقطتان وعلامتا الاقتباس تؤديان وظيفة ὅτι في إدخال الكلام المباشر بصورة عربية طبيعية.
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: هذا الرجل
  rationale: ينقل اسم الإشارة والاسم المذكر المفرد بوضوح، ويحفظ النبرة العلنية المشيرة إليه من غير إضافة تحقير غير صريح.
- source_word: ἤρξατο οἰκοδομεῖν
  choice: شرع في البناء
  rationale: تعبير عربي فصيح وطبيعي يدل على ابتداء فعل البناء، من غير إضافة مفعول غير مذكور في اليونانية.
- source_word: οὐκ ἴσχυσεν
  choice: لم يقدر
  rationale: يؤدي معنى عدم الاستطاعة في السياق، مع بقاء احتمال دلالة الفعل على عدم امتلاك القوة الكافية في الحاشية.
- source_word: ἐκτελέσαι
  choice: أن يُكمله
  rationale: يدل على إتمام مشروع البناء؛ والضمير يعود طبيعيًا إلى البناء المفهوم من السياق.
theological_decisions: []
