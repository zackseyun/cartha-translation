  register: عربية فصحى حديثة واضحة وذات وقار. استُخدم «شرع في البناء» لصياغة طبيعية، و«لم يقدر» لنقل القدرة العامة، مع إثبات البديل الدلالي المتعلق بالقوة في الحاشية.
