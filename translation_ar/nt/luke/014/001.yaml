  rationale: أُضيفت «عندما» لإبراز العلاقة الزمنية في الأصل اليوناني. كما استُبدلت «واحدٍ من» بـ«أحد» لتحسين السلاسة العربية دون تغيير المعنى. بقيت الحاشيتان وعلامتاهما ملازمتين للكلمتين المعنيتين، وحُفظت دلالة المراقبة المتحفزة بوصفها احتمالًا في الحاشية لا تقريرًا في المتن.
