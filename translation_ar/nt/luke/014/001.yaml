  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: ar
  text: وحدث أنه، عندما دخل يوم السبت بيتَ أحد رؤساء الفريسيين ليأكل خبزًا[a]، كانوا يراقبونه عن كثب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليتناول وجبة»؛ حرفيًا: «ليأكل خبزًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كانوا يلاحظونه بدقة»؛ وقد توحي الكلمة اليونانية بمراقبة يشوبها الارتياب أو العداء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: وحدث أنه
  rationale: صيغة سردية لوقاوية تمهّد للحدث، وصيغتها العربية طبيعية ومعاصرة من غير تقادم لفظي.
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: دخل
  rationale: المصدر المعرّف مع ἐν يفيد الزمن؛ وفي العربية يتضح المعنى طبيعيًا ضمن تركيب «وحدث أنه دخل» من غير حاجة إلى عبارة زمنية ثقيلة.
- source_word: οἶκόν
  choice: بيتَ
  rationale: المقابل المباشر الملائم لمكان الضيافة وتناول الطعام.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: واحدٍ من رؤساء الفريسيين
  rationale: يحفظ معنى الانتماء إلى جماعة من ذوي القيادة، ولا يختزله إلى مجرد شخص بارز.
- source_word: σαββάτῳ
  choice: يوم السبت
  rationale: الداتيف هنا زمني، و«يوم السبت» تعبير عربي واضح وطبيعي.
- source_word: φαγεῖν ἄρτον
  choice: ليأكل خبزًا
  rationale: يحفظ الصورة الحرفية للتعبير اليوناني، مع حاشية توضّح استعماله بمعنى تناول وجبة.
- source_word: παρατηρούμενοι
  choice: يراقبونه عن كثب
  rationale: ينقل شدة الملاحظة وما قد يصاحبها من ترقّب مريب، من غير أن يصرّح بعداء لا يذكره العدد صراحة.
- source_word: αὐτοὶ
  choice: كانوا
  rationale: يُفهم مرجع الضمير من السياق العربي، ولا تستلزم فصاحة العربية إظهار التوكيد بصيغة «هم أنفسهم».
theological_decisions:
- issue: دلالة مراقبة الفريسيين ليسوع وإمكان اشتمالها على الريبة أو العداء
  choice: كانوا يراقبونه عن كثب
  alternative: كانوا يتجسسون عليه
  rationale: الفعل παρατηρέω قد يوحي بمراقبة متحفزة أو معادية، لكن النص لا يصرّح بالدافع؛ لذلك تحفظ الصياغة التوتر السردي ولا تحسم النية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التعبير التصويري «يأكل خبزًا» مع توضيحه في الحاشية، وصيغت المراقبة بما يصون الإيحاء بالتوتر من غير المبالغة في إثبات نية عدائية.
