  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: ar
  text: 'فلما سمع هذا واحدٌ من المتكئين معه، قال له: «طوبى لمن سيأكل خبزًا[a] في ملكوت الله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تعبير «يأكل خبزًا» قد يعني في اليونانية مشاركة الآخرين في وجبة، وقد أُبقيت صورة الخبز في المتن.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: لما سمع
  rationale: يحافظ على الدلالة الزمنية لاسم الفاعل الأوريستي بصياغة عربية طبيعية توضح أن القول جاء استجابة لما سمعه.
- source_word: δέ
  choice: فـ
  rationale: تفيد الانتقال الخفيف والتعقيب في السياق، وهي أنسب للسرد العربي هنا من أداة استدراك قوية.
- source_word: τις τῶν συνανακειμένων
  choice: واحد من المتكئين معه
  rationale: ينقل الإبهام في τις ويحفظ صورة الاتكاء إلى المائدة في بيئة الطعام القديمة دون إضافة «إلى المائدة» غير المذكورة صراحة.
- source_word: ταῦτα
  choice: هذا
  rationale: الإشارة إلى مجمل الكلام السابق تُؤدَّى طبيعيًا في العربية بالمفرد «هذا»، مع بقاء المرجع واضحًا.
- source_word: εἶπεν αὐτῷ
  choice: قال له
  rationale: صياغة سردية مباشرة تحفظ الضمير والجهة المخاطبة.
- source_word: Μακάριος
  choice: طوبى لمن
  rationale: «طوبى» تعبير عربي كتابي مفهوم يحفظ معنى الغبطة والبركة ذات الثقل الديني، ولا يحصر المعنى في شعور نفسي بالسعادة.
- source_word: ὅστις
  choice: من
  rationale: اسم موصول عام يحفظ القوة غير المحددة والعمومية في اليونانية.
- source_word: φάγεται
  choice: سيأكل
  rationale: ينقل صيغة المستقبل ودلالتها الأخروية المحتملة بوضوح.
- source_word: ἄρτον
  choice: خبزًا
  rationale: يحفظ الاسم المحسوس والصورة الأصلية، مع أن التعبير قد يدل في الاستعمال على تناول وجبة.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: في ملكوت الله
  rationale: ترجمة مباشرة تحفظ المصطلح اللاهوتي المألوف من غير إدخال صورة الوليمة إلى المتن.
theological_decisions:
- issue: قوة Μακάριος في قول ذي أفق أخروي
  choice: طوبى لمن سيأكل خبزًا في ملكوت الله
  alternative: سعيد من سيأكل خبزًا في ملكوت الله
  rationale: «طوبى» تحفظ معنى الغبطة والرضا الإلهي المرتبط بالمشاركة المقبلة في الملكوت، بينما قد تُفهم «سعيد» على أنها حالة نفسية فحسب.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صورة الاتكاء القديمة وصورة أكل الخبز، واستُخدمت «طوبى» لما لها من رسوخ كتابي مع بقائها مفهومة. وُضع مؤشر الحاشية بعد الاقتباس لأنه يشرح تعبير «يأكل خبزًا».
