  text: Καλὸν ⸀οὖν τὸ ἅλας· ἐὰν δὲ ⸀καὶ τὸ ἅλας μωρανθῇ, ἐν τίνι ἀρτυθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: ar
  text: فَالْمِلْحُ جَيِّدٌ؛ وَلَكِنْ إِنْ فَقَدَ حَتَّى الْمِلْحُ طَعْمَهُ، فَبِمَاذَا يُمَلَّحُ؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καλὸν
  choice: جَيِّدٌ
  rationale: تنقل التقييم الإيجابي العام للملح من غير حصر المعنى في المنفعة أو الجمال.
- source_word: οὖν
  choice: فَـ
  rationale: تفيد الربط الاستنتاجي بما سبق بصورة عربية طبيعية موجزة.
- source_word: ἅλας
  choice: الْمِلْحُ
  rationale: ترجمة مباشرة تحفظ الصورة المَثَلية كما هي.
- source_word: ἐὰν δὲ καὶ
  choice: وَلَكِنْ إِنْ ... حَتَّى
  rationale: تحفظ أداة الاستدراك وقوة καί التي تفيد أن هذا الافتراض يشمل حتى الملح نفسه.
- source_word: μωρανθῇ
  choice: فَقَدَ ... طَعْمَهُ
  rationale: الفعل يعني حرفيًا في استعمالات أخرى «صار أحمق»، لكنه مع الملح يدل اصطلاحيًا على زوال طعمه؛ وهذه الصياغة واضحة وطبيعية في العربية.
- source_word: ἐν τίνι
  choice: فَبِمَاذَا
  rationale: تعبير عربي طبيعي عن الوسيلة في السؤال البلاغي.
- source_word: ἀρτυθήσεται
  choice: يُمَلَّحُ
  rationale: يحفظ معنى التتبيل وإكساب الملوحة في هذا السياق، مع إبقاء مرجع الضمير محتملًا كما في اليونانية.
theological_decisions:
- issue: الدلالة المجازية لمثل الملح
  choice: الإبقاء على صورة الملح من غير شرح تطبيقها على التلمذة داخل نص الآية.
  alternative: 'التوسّع تفسيريًا، مثل: «إن فقد التلاميذ تميّزهم».'
  rationale: النص يورد صورة مَثَلية، ويترك للسياق المحيط بيان تطبيقها؛ لذلك ينبغي عدم حسم التوتر الدلالي بإضافة تفسير إلى المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «فقد طعمه» بدل النقل الحرفي «صار أحمق» لأن المقصود السياقي زوال مذاق الملح، واستُبقي السؤال البلاغي والإيجاز المَثَلي.
