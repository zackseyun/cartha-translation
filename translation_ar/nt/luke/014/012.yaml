  terminology: «غداء» و«عشاء»، و«إخوتك»، و«أقرباءك»، و«جيرانك الأغنياء» اختيارات مناسبة. لا تستلزم الآية مصطلحًا لاهوتيًا خاصًا؛ والخاتمة تتعلق بالمعاملة الاجتماعية بالمثل لا بجزاء إلهي مصرح به.
  issues:
