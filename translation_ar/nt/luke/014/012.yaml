source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: ar
  text: 'وكان يقول أيضًا للذي دعاه: «متى أقمتَ غداءً أو عشاءً، فلا تدعُ أصدقاءك، ولا إخوتك، ولا أقرباءك، ولا جيرانك الأغنياء، لئلا يدعوك هم أيضًا في المقابل، فيكون ذلك ردًّا لك بالمثل[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فيكون ذلك جزاءً لك». واليونانية تقول حرفيًا: «فيصير لك ردٌّ بالمثل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: وكان يقول أيضًا
  rationale: يحفظ زمن الماضي الناقص واستمرارية القول، مع نقل الرابط الخفيف δὲ ومعنى الإضافة في καὶ بصياغة عربية طبيعية.
- source_word: τῷ κεκληκότι αὐτόν
  choice: للذي دعاه
  rationale: ينقل اسم الفاعل التام بوضوح ويشير إلى من سبق أن دعا يسوع، من غير استبداله بتعبير تفسيري مثل «مضيفه».
- source_word: Ὅταν ποιῇς
  choice: متى صنعتَ
  rationale: يحافظ على صورة الفعل ποιέω المرتبط بإقامة وليمة، وهو تعبير عربي مفهوم بمعنى إعدادها أو إقامتها.
- source_word: ἄριστον
  choice: غداءً
  rationale: يدل على الوجبة الأبكر، وغالبًا وجبة النهار أو الظهيرة؛ و«غداء» أوضح مقابل عربي معاصر لها.
- source_word: δεῖπνον
  choice: عشاءً
  rationale: يدل على الوجبة الرئيسية المتأخرة، و«عشاء» يحفظ المقابلة الزمنية مع الغداء.
- source_word: μὴ φώνει
  choice: فلا تدعُ
  rationale: مع أن الفعل يعني حرفيًا «تنادي»، فسياق الطعام يجعله بمعنى توجيه الدعوة.
- source_word: τοὺς ἀδελφούς σου
  choice: إخوتك
  rationale: يحفظ صيغة الجمع المذكر في الأصل من غير توسيعها صراحةً إلى الإخوة والأخوات.
- source_word: τοὺς συγγενεῖς σου
  choice: أقرباءك
  rationale: مقابل عربي واضح وحديث للأقارب وذوي القرابة.
- source_word: γείτονας πλουσίους
  choice: جيرانك الأغنياء
  rationale: يحفظ تعلق الصفة «الأغنياء» بالجيران مباشرةً.
- source_word: μήποτε
  choice: لئلا
  rationale: ينقل التحذير من النتيجة المحتملة بصياغة عربية فصيحة وموجزة.
- source_word: ἀντικαλέσωσίν σε
  choice: يدعوك هم أيضًا في المقابل
  rationale: ينقل معنى الدعوة المتبادلة الكامن في الفعل المركب، مع إبراز الضمير للتوكيد الموجود في αὐτοὶ.
- source_word: καὶ γένηται ἀνταπόδομά σοι
  choice: فيكون ذلك وفاءً لك
  rationale: يحافظ على البنية التي تجعل الدعوة المقابلة وفاءً أو ردًّا مستحقًا له، بدل تسطيح العبارة إلى مجرد «فتنال أجرك».
theological_decisions:
- issue: طبيعة «الوفاء» في ختام الآية
  choice: فيكون ذلك وفاءً لك
  alternative: فتُكافأ على ذلك
  rationale: الأصل يتحدث عن تحقق ردّ مقابل اجتماعي، لا يصرح بمكافأة إلهية؛ لذا تُرك التوتر بين المعاملة بالمثل والجزاء من غير إضافة لاهوتية.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كريمة ومعاصرة. استُخدمت «غداء» و«عشاء» لإظهار التباين بين الوجبة الأبكر والوجبة المتأخرة، وحُفظ تكرار «ولا» لإبراز بنية القائمة في الأصل.
