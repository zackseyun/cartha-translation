  source_fidelity: 'ينقل النص بنية الآية ومعناها الأساسي بأمانة: المخاطَب هو الذي سبق أن دعا يسوع، والتباين بين الغداء والعشاء محفوظ، وقائمة المدعوين والتحذير من الدعوة بالمثل واضحان. لكن «وفاءً لك» لا يؤدي معنى ἀνταπόδομα بأوضح عبارة عربية معاصرة، إذ قد يُفهم بوصفه إتمامًا أو وفاءً بالتزام أكثر من كونه ردًّا اجتماعيًا بالمثل.'
