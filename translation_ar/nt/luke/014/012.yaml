    issue: استعمال «وفاءً لك» لترجمة ἀνταπόδομα
    rationale: اللفظة العربية «وفاء» قابلة للفهم، لكنها أقل مباشرة وقد توحي بإيفاء حق أو التزام. «ردٌّ بالمثل» ينقل بدقة أوضح معنى المقابلة/الجزاء المتبادل في السياق، من دون إضافة تفسير لاهوتي.
