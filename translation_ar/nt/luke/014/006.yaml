lexical_decisions:
- source_word: καὶ
  choice: فـ
  rationale: تربط الجملة بما قبلها ربطًا طبيعيًا، وتُظهر أنها نتيجة مباشرة للموقف السابق من غير إضافة دلالة زمنية.
- source_word: οὐκ ἴσχυσαν
  choice: لم يقدروا
  rationale: الفعل هنا يدل اصطلاحيًا على عدم القدرة، لا على انعدام القوة الجسدية؛ وهذه صياغة عربية واضحة ومباشرة.
- source_word: ἀνταποκριθῆναι
  choice: أن يجيبوا
  rationale: يدل المصدر على تقديم جواب في المقابل. «يجيبوا» طبيعية في العربية ولا تضيف نبرة التحدي التي قد توحي بها تعبيرات مثل «يردّوا عليه».
- source_word: πρὸς ταῦτα
  choice: عن هذه الأمور
  rationale: يحفظ جمع اسم الإشارة اليوناني ويؤدي معنى الإجابة بشأن ما طُرح، بصياغة عربية مفهومة.
