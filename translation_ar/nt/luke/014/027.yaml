  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: ar
  text: مَنْ لا يحمل صليبه ويأتي ورائي، لا يقدر أن يكون لي تلميذًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يأتي خلفي»؛ وهي عبارة شائعة في سياق التلمذة بمعنى «يتبعني».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: مَنْ
  rationale: اسم شرط/موصول عام موجز وطبيعي في العربية، يحفظ شمول العبارة لكل شخص.
- source_word: βαστάζει
  choice: يحمل
  rationale: ينقل المعنى الحسي للفعل، أي حمل الصليب، مع إبقاء دلالته المجازية على كلفة التلمذة.
- source_word: τὸν σταυρὸν ἑαυτοῦ
  choice: صليبه هو
  rationale: «الصليب» هو المقابل المألوف لـσταυρός، وإضافة «هو» تؤكد دلالة الضمير الانعكاسي ἑαυτοῦ على أن المقصود صليب الشخص نفسه.
- source_word: ἔρχεται ὀπίσω μου
  choice: يأتي ورائي
  rationale: صياغة عربية طبيعية قريبة من الصورة المكانية الحرفية «يأتي خلفي»، وتحفظ صلتها بلغة اتباع المعلّم من غير استبدال الصورة بتفسيرها فقط.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: لا يقدر أن يكون لي تلميذًا
  rationale: تحفظ دلالة عدم القدرة أو عدم الإمكان، كما تحفظ تقديم ضمير المتكلم في اليونانية بصيغة عربية واضحة.
- source_word: μαθητής
  choice: تلميذ
  rationale: المقابل العربي الراسخ في سياق الأناجيل، ويدل على من يتبع المعلّم ويتعلم منه.
theological_decisions:
- issue: القوة العامة للضمير الانعكاسي المفرد المذكر
  choice: 'الإبقاء على المفرد المذكر: «صليبه هو»'
  alternative: «صليبهم» أو إعادة الصياغة بالجمع
  rationale: النص اليوناني مفرد مذكر ذو دلالة عامة. يحفظ المفرد بنية العبارة، بينما يوضح «مَنْ» أن الحكم عام لا يختص برجل بعينه.
- issue: علاقة «يأتي ورائي» باتباع يسوع
  choice: الإبقاء على صورة المجيء وراءه
  alternative: «يتبعني»
  rationale: الصياغة اليونانية تحمل صورة مكانية وحركية مستخدمة في سياق التلمذة؛ لذلك لا تُختزل في المعنى التفسيري «يتبعني»، مع توضيحه في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «ورائي» بدل «خلفي» في المتن لسلاستها مع فعل المجيء، مع حفظ الصياغة الحرفية في الحاشية. وُضعت علامة الحاشية بعد الجملة كاملة.
