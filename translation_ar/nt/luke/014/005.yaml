id: LUK.14.5
reference: Luke 14:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: ar
  text: 'ثم قال لهم: «مَن منكم إذا وقع ابنه أو ثوره في بئر، لا ينتشله فورًا في يوم السبت؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «حماره» بدلًا من «ابنه».'
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: مَن منكم
  rationale: تعبير عربي طبيعي يؤدي معنى الاستفهام البلاغي عن الشخص الذي قد يتصرف على خلاف ذلك.
- source_word: υἱὸς
  choice: ابنه
  rationale: 'يحافظ على المعنى المحدد للمفرد المذكر «ابن»، وتناسب الإضافة إلى المخاطَب سياق السؤال: ابن أي واحد منكم.'
- source_word: βοῦς
  choice: ثوره
  rationale: «ثور» هو المقابل الواضح المعتاد للحيوان البقري المفرد المذكور هنا، والإضافة توافق بناء المثال مع «ابنه».
- source_word: φρέαρ
  choice: بئر
  rationale: المعنى الأقرب للكلمة اليونانية هو البئر، فلا تُستبدل بحفرة أو صهريج ولا تُواءَم مع ألفاظ المقاطع الموازية.
- source_word: πεσεῖται
  choice: وقع
  rationale: يؤدي المستقبل اليوناني في هذا الشرط البلاغي بصياغة عربية طبيعية مباشرة.
- source_word: εὐθέως
  choice: فورًا
  rationale: يحفظ دلالة العجلة وعدم تأخير الإنقاذ بسبب السبت.
- source_word: ἀνασπάσει
  choice: ينتشله
  rationale: يفيد إخراجه بجذبه من أسفل، وهو فعل عربي موجز وطبيعي في سياق الإنقاذ من بئر.
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير مفرد مذكر يمكن أن يعود إلى الابن أو الثور، كما في اليونانية، من غير تكرار ثقيل.
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: في يوم السبت
  rationale: يعكس ذكر «اليوم» صراحة ويحافظ على صياغة عربية واضحة ومألوفة.
theological_decisions:
- issue: الاختلاف النصي في أول طرفي المثال
  choice: ابنه أو ثوره
  alternative: حماره أو ثوره
  rationale: النص المعتمد SBLGNT يقرأ υἱὸς، أي «ابن»، ولذلك أُثبتت هذه القراءة في المتن، مع حفظ القراءة الأخرى المهمة في الحاشية دون إدخالها في النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «ينتشله» لإبراز حركة الإخراج من البئر مع بقاء السؤال البلاغي طبيعيًا. وُضعت علامة الحاشية بعد الاقتباس كله لأنها تتعلق بقراءة داخل الجملة.
