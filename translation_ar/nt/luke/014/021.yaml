id: LUK.14.21
reference: Luke 14:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: ar
  text: 'ولمّا عاد الخادم، أخبر سيّده[a] بهذه الأمور. فغضب صاحب البيت وقال لخادمه: «اخرج سريعًا إلى شوارع المدينة الواسعة وأزقّتها، وأدخل إلى هنا الفقراء وذوي الإعاقة[b] والعميان والعُرج».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي سيد الخادم البشري؛ ويمكن ترجمتها «مولاه» (κύριος)، وليس المقصود هنا لقبًا إلهيًا.
    reason: lexical_alternative
  - marker: b
    text: أو «ذوي العاهات» (ἀναπείρους)، أي من أصابت أجسادهم إعاقة أو عاهة.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: عاد
  rationale: يفيد السياق أن الخادم رجع بعد تنفيذ مهمته ليقدّم الخبر؛ و«عاد» تؤدي هذا المعنى الضمني بوضوح وطبيعية.
- source_word: δοῦλος
  choice: الخادم
  rationale: مع أن اللفظة قد تعني «العبد»، فإن التركيز هنا على وظيفة الشخص في البيت ضمن المثل؛ لذا فـ«الخادم» أوضح للقارئ المعاصر من غير إنكار للوضع الاجتماعي المحتمل.
- source_word: ἀπήγγειλεν
  choice: أخبر
  rationale: يناسب نقل الخادم ما حدث إلى من هو أعلى منه، ويحافظ على سلاسة السرد.
- source_word: κυρίῳ
  choice: سيّده
  rationale: المراد هنا سيد الخادم البشري داخل المثل، لا لقب إلهي؛ و«سيّده» تؤدي علاقة السلطة بوضوح.
- source_word: ὀργισθεὶς
  choice: فغضب
  rationale: ينقل رد الفعل الذي سبق الكلام بإيجاز عربي طبيعي، مع بقاء التعاقب السردي واضحًا.
- source_word: οἰκοδεσπότης
  choice: صاحب البيت
  rationale: يدل اللفظ على رب الأسرة أو المتصرف في البيت؛ و«صاحب البيت» تعبير عربي طبيعي يميّزه عن «سيّده» في الجملة السابقة.
- source_word: πλατείας καὶ ῥύμας
  choice: شوارع المدينة الواسعة وأزقّتها
  rationale: يحفظ التقابل بين الطرق العامة الرحبة والطرق الضيقة داخل المدينة.
- source_word: ἀναπείρους
  choice: ذوي الإعاقة
  rationale: صياغة عربية معاصرة كريمة تفيد أصحاب الإعاقات الجسدية، مع إثبات البديل الأقرب إلى معنى العاهة في الحاشية.
- source_word: εἰσάγαγε ὧδε
  choice: أدخل إلى هنا
  rationale: يحفظ فعل الإدخال وتحديد الوجهة الواردين صراحة في اليونانية.
theological_decisions:
- issue: دلالة δοῦλος في إطار بيت بشري داخل مثل
  choice: الخادم
  alternative: العبد
  rationale: المشهد يبرز مهمة الشخص وعلاقته بصاحب البيت، لا حالته القانونية بوصفها محورًا لاهوتيًا؛ لذلك اختير «الخادم» مع إبقاء الدلالة الأصلية المحتملة في الاعتبار.
- issue: دلالة κύριος على مرجع بشري
  choice: سيّده
  alternative: مولاه
  rationale: المرجع هو الرئيس البشري للخادم داخل القصة، فلا تُستعمل صيغة توحي بأن اللفظ هنا لقب إلهي.
- issue: التعبير عن الأشخاص المذكورين بإعاقاتهم
  choice: ذوي الإعاقة، والعميان، والعُرج
  alternative: ذوي العاهات، والعمي، والكسح
  rationale: الصياغة المختارة واضحة ومعاصرة وكريمة، وتحافظ في الوقت نفسه على الفئات المتمايزة التي يسردها النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة سردية كريمة. استُعمل «صاحب البيت» بدل «ربّ البيت» لتجنب إيحاء ديني غير مقصود، وحُفظ التقابل المكاني بين الشوارع الواسعة والأزقة. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحهما الحاشيتان مباشرة.
