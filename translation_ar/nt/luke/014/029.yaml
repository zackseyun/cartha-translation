  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: ar
  text: لئلّا، بعد أن يضع الأساس ولا يقدر على إتمامه، يبدأ جميع الذين يرون ذلك بالاستهزاء به.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: لئلّا
  rationale: تؤدي معنى التحذير من نتيجة غير مرغوب فيها، وهي صياغة عربية فصيحة وطبيعية في سياق المثل.
- source_word: θέντος αὐτοῦ
  choice: يكون قد وضع
  rationale: تنقل سبق وضع الأساس زمنيًا على العجز عن الإكمال وعلى بدء الاستهزاء.
- source_word: θεμέλιον
  choice: الأساس
  rationale: التعريف طبيعي في العربية لأن المقصود أساس البناء الذي شرع فيه الرجل، من غير تغيير للمعنى.
- source_word: μὴ ἰσχύοντος
  choice: لا يقدر
  rationale: الفعل هنا يدل على القدرة على إنجاز العمل، لا على القوة الجسدية وحدها.
- source_word: ἐκτελέσαι
  choice: أن يُكمل
  rationale: ينقل معنى إتمام مشروع البناء إلى نهايته بإيجاز ووضوح.
- source_word: πάντες οἱ θεωροῦντες
  choice: جميع الذين يرون ذلك
  rationale: يحافظ على شمول πάντες وعلى معنى المعاينة في θεωρέω، وتعود «ذلك» طبيعيًا إلى حال البناء غير المكتمل.
- source_word: ἄρξωνται
  choice: فيبدأ
  rationale: يحفظ معنى الشروع، وتنسجم الصيغة مع نتيجة التحذير المحتملة التي افتتحتها «لئلّا».
- source_word: αὐτῷ ἐμπαίζειν
  choice: بالاستهزاء به
  rationale: صياغة عربية واضحة وكريمة النبرة تنقل معنى السخرية الموجّهة إلى الشخص.
