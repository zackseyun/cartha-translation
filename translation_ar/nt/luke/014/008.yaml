  text: Ὅταν κληθῇς ὑπό τινος εἰς γάμους, μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ’ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: ar
  text: «متى دعاك أحدٌ إلى وليمة عرس[a]، فلا تتكئ[c] في مكان الصدارة[b]، لئلّا يكون قد دُعيَ منه شخصٌ أرفع منك مقامًا.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى عرس». فصيغة الجمع اليونانية قد تشير إلى احتفالات العرس، ولا سيما الوليمة.'
    reason: lexical_alternative
  - marker: b
    text: أي المكان الذي ينال صاحبه أكبر قدر من التكريم على المائدة.
    reason: cultural_note
  - marker: c
    text: كان المدعوون في الولائم الرسمية القديمة يتكئون إلى المائدة بدلًا من الجلوس منتصبين كما هو شائع اليوم.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: متى دعاك أحدٌ
  rationale: ينقل الظرف العام وصيغة المبني للمجهول إلى تعبير عربي طبيعي، مع الحفاظ على فاعل الدعوة غير المحدد.
- source_word: εἰς γάμους
  choice: إلى وليمة عرس
  rationale: جمع γάμοι قد يدل على احتفالات العرس، وسياق الاتكاء وترتيب الأماكن يحدد الوليمة خصوصًا.
- source_word: μὴ κατακλιθῇς
  choice: فلا تتكئ
  rationale: يحافظ على هيئة تناول الطعام في الولائم القديمة بدل تعميمها إلى الجلوس.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: في مكان الصدارة
  rationale: يعبر بوضوح عن أعلى موضع من حيث التكريم على المائدة، دون الإيحاء بمقعد حديث.
- source_word: μήποτε
  choice: لئلّا
  rationale: ينقل معنى التحذير والاحتمال الذي يعلل النهي.
- source_word: ἐντιμότερός σου
  choice: شخصًا أرفعَ منك مقامًا
  rationale: ينقل المفاضلة في الشرف والمكانة الاجتماعية بصورة عربية طبيعية.
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: يكون قد دعا
  rationale: يعكس الدعوة السابقة ذات الصلة بالحاضر، ويُبقي الداعي نفسه فاعلًا مفهومًا من السياق.
