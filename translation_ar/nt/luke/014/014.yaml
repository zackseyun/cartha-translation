  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: ar
  text: وستكون مباركًا، لأنهم لا يستطيعون أن يكافئوك[a]؛ إذ ستُكافأ عند قيامة الأبرار[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا، تستعمل اليونانية تعبيرًا معناه: «ليس لديهم أن يردّوا لك»؛ والمقصود هنا أنهم لا يقدرون على مكافأتك أو لا يملكون وسيلة لذلك.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «في قيامة الأبرار».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: مباركًا
  rationale: تحفظ البعد الإلهي والأخروي للتطويب في أقوال يسوع، بخلاف «سعيدًا» التي قد توحي بحالة شعورية فحسب.
- source_word: ἔσῃ
  choice: تكون
  rationale: تنقل صيغة المستقبل مع الخبر «مباركًا» نقلًا طبيعيًا واضحًا.
- source_word: ὅτι
  choice: لأن
  rationale: تبيّن أن عدم قدرتهم على المكافأة هو سبب التطويب المذكور.
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: لا يملكون أن يكافئوك
  rationale: تحافظ على صورة الأصل، «ليس لديهم أن يردّوا لك»، مع دلالة عدم القدرة أو الوسيلة، من غير أن توحي بانتفاء الالتزام.
- source_word: ἀνταποδοθήσεται
  choice: سوف تُكافأ
  rationale: تحفظ المبني للمجهول والمقابلة اللفظية مع «يكافئوك»، من دون التصريح بمن يمنح المكافأة حين لا يصرّح به النص.
- source_word: ἐν τῇ ἀναστάσει
  choice: عند قيامة
  rationale: «عند» تعبير عربي طبيعي للدلالة الزمنية التي تؤديها ἐν هنا.
- source_word: τῶν δικαίων
  choice: الأبرار
  rationale: صياغة عربية موجزة ومألوفة تحفظ الدلالة الأخلاقية واللاهوتية للصفة substantivized.
theological_decisions:
- issue: المقصود بقيامة الأبرار
  choice: قيامة الأبرار
  alternative: القيامة العامة مع إبراز الأبرار، أو قيامة متميزة للأبرار
  rationale: تنقل العبارة كما هي من غير حسم ترتيب أحداث القيامة أو بناء مخطط أخروي لا يصرّح به العدد.
- issue: فاعل المكافأة الأخيرة
  choice: 'المبني للمجهول: «سوف تُكافأ»'
  alternative: «سوف يكافئك الله»
  rationale: السياق يفهم منه الجزاء الإلهي، لكن الأصل يستعمل المبني للمجهول؛ لذلك لا يُضاف فاعل صريح إلى النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «مباركًا» لصون نبرة التطويب، وحوفظ على التوازي بين «يكافئوك» و«تُكافأ». وُضعت علامتا الحاشية بعد العبارتين اللتين تشرحهما كل حاشية.
