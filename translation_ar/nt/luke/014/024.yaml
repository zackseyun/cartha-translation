base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: ar
  text: 'لأني أقول لكم: لن يذوق أحدٌ من أولئك الرجال الذين دُعوا عشائي.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مأدبتي» أو «وليمتي».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: لأني أقول لكم
  rationale: تحافظ الصياغة على «γάρ» التعليلية وعلى خطاب الجمع المباشر، وهي فصيحة وطبيعية في العربية.
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: لن ... أحد من أولئك الرجال
  rationale: تنقل النفي القاطع مع العبارة التبعيضية، وتحافظ على الدلالة المذكرة الصريحة لكلمة ἀνδρῶν وعلى الإشارة في ἐκείνων.
- source_word: τῶν κεκλημένων
  choice: الذين دُعوا
  rationale: المبني للمجهول يحفظ صيغة الأصل، و«دُعوا» في سياق الوليمة تفيد تلقي الدعوة بوضوح من غير تحويلها إلى مفهوم لاهوتي صريح.
- source_word: γεύσεταί
  choice: سيذوق / لن يذوق مع النفي
  rationale: يحفظ صورة التذوق في اليونانية، والتي قد تتسع في السياق لمعنى الأكل أو المشاركة، من غير إلغاء الصورة البلاغية.
- source_word: μου τοῦ δείπνου
  choice: عشائي
  rationale: «العشاء» مقابل عربي مباشر وطبيعي للوجبة الرئيسية المسائية، ويحفظ ضمير المتكلم وقوة الاستبعاد في كلام صاحب الوليمة.
theological_decisions:
- issue: علاقة قول صاحب الوليمة بالدلالة الرمزية للمثل
  choice: 'الإبقاء على صوت المتكلم داخل المثل: «عشائي»'
  alternative: مأدبتي
  rationale: لا يصرّح النص هنا بالتفسير الرمزي، لذلك تحافظ الترجمة على المستوى القصصي وعلى ضمير الملكية من غير إدخال تأويل لاهوتي في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «عشائي» في المتن لقربه المعجمي من δεῖπνον، مع إثبات «مأدبتي» في الحاشية بوصفه احتمالًا سياقيًا. وُضعت علامة الحاشية [a] بعد الجملة.
