  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: ar
  text: وَإِلَّا، فَبَيْنَمَا الْمَلِكُ الْآخَرُ لَا يَزَالُ بَعِيدًا، يُرْسِلُ إِلَيْهِ وَفْدًا[a] وَيَطْلُبُ شُرُوطَ السَّلَامِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بعثةً» أو «مبعوثين».
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «الأمور المؤدية إلى السلام»؛ أي الشروط التي يتحقق بها السلام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: وَإِلَّا
  rationale: 'تنقل بإيجاز وطبيعية معنى الشرط المخالف: «ولكن إن لم يكن الأمر كذلك» أو «وإلا».'
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: فَبَيْنَمَا الْمَلِكُ الْآخَرُ لَا يَزَالُ بَعِيدًا
  rationale: تنقل العبارة المطلقة بالمضاف إليه بوصفها ظرفًا متزامنًا، وتوضح أن الضمير يعود إلى الملك المقابل المذكور في سياق المثل.
- source_word: πρεσβείαν
  choice: وَفْدًا
  rationale: «وفد» لفظ عربي معاصر وطبيعي يدل على جماعة من المبعوثين، ويلائم سياق التفاوض بين ملكين.
- source_word: ἀποστείλας
  choice: يُرْسِلُ إِلَيْهِ
  rationale: صيغ اسم الفاعل اليوناني بفعل مضارع منسق مع الفعل الرئيس، مع إظهار جهة الإرسال التي يفهمها السياق.
- source_word: ἐρωτᾷ
  choice: وَيَطْلُبُ
  rationale: الفعل هنا يفيد الطلب لا مجرد الاستفهام، ولذلك يناسبه «يطلب».
- source_word: τὰ πρὸς εἰρήνην
  choice: شُرُوطَ السَّلَامِ
  rationale: هذه صياغة عربية موجزة ومألوفة للعبارة التي تعني حرفيًا الأمور المؤدية إلى السلام، وفي السياق العسكري تشير إلى شروط إقرار السلام.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى واضحة ووقورة، مع تركيب طبيعي يناسب السرد. أضيف «الملك» و«إليه» لتوضيح المرجع والاتجاه المفهومين من سياق المثل، من غير تغيير المعنى. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما مباشرة.
