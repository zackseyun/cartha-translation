  text: And behold[a], a certain man with dropsy was before him.
translation:
  language: ar
  text: وإذا برجلٍ مصابٍ بالاستسقاء أمامه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف ربط يحفظ اتصال المشهد بما قبله من غير إضافة دلالة زمنية غير مصرّح بها.
- source_word: ἰδοὺ
  choice: إذا بـ
  rationale: تركيب عربي طبيعي يوجّه الانتباه ويمنح السرد حيوية، من غير اللجوء إلى «هوذا» الأقل شيوعًا في العربية المعاصرة.
- source_word: ἄνθρωπός τις
  choice: رجل
  rationale: يدل التركيب على شخص معيّن غير مسمّى؛ وتؤدي النكرة العربية هذا المعنى طبيعيًا، فلا حاجة إلى «رجل ما» أو «رجل معيّن».
- source_word: ἦν
  choice: مفهوم ضمنًا في الجملة الاسمية
  rationale: لا يُترجم فعل الكينونة الماضي ترجمة حرفية مستقلة هنا؛ فتركيب «وإذا برجل... أمامه» يؤدي معنى وجود الرجل وموقعه بأسلوب عربي سليم.
- source_word: ὑδρωπικὸς
  choice: مصاب بالاستسقاء
  rationale: «الاستسقاء» هو المقابل العربي الطبي المعروف لتجمع السوائل المسبب للتورم، و«مصاب بـ» يوضح أن الصفة تصف حالة الرجل.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: أمامه
  rationale: يحفظ المعنى المكاني المباشر، مع إمكان فهم وجود الرجل في حضرته من السياق.
theological_decisions: []
