  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: ar
  text: 'فقال العبد[a]: «يا سيدي[b]، قد تمَّ ما أمرتَ به، ولا يزال هناك مكان».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «الخادم»؛ فاللفظ اليوناني (δοῦλος) قد يدل على عبد مملوك.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «يا رب»؛ لكن المقصود هنا في سياق المثل صاحب البيت أو السيد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: العبد
  rationale: اللفظ اليوناني يدل في الأصل على عبد مملوك، وهو هنا تابع لربّ البيت. واختيار «العبد» يحفظ دلالة العلاقة الاجتماعية والسلطوية بوضوح، مع بقاء العبارة طبيعية في سياق المثل.
- source_word: Κύριε
  choice: يا سيدي
  rationale: صيغة نداء موجَّهة إلى ربّ البيت. «يا سيدي» عربية طبيعية في خطاب العبد لصاحب السلطة، وتحفظ معنى الاحترام والسيادة من غير أن تفرض هنا استعمالًا لاهوتيًا للقب «الرب».
- source_word: γέγονεν
  choice: قد تمَّ
  rationale: صيغة التام تفيد إنجاز المطلوب وقيام نتيجته في الحاضر؛ و«قد تمَّ» تؤدي هذا المعنى بإيجاز وطبيعية.
- source_word: ὃ ἐπέταξας
  choice: ما أمرتَ به
  rationale: يحيل الموصول المحايد إلى مضمون الأمر السابق، والفعل يدل على إصدار أمر ذي سلطة؛ لذا تنقل العبارة المعنى بوضوح.
- source_word: ἔτι
  choice: لا يزال
  rationale: يفيد استمرار وجود المكان بعد تنفيذ الأمر.
- source_word: τόπος
  choice: مكان
  rationale: يدل في سياق الوليمة على موضع أو سعة متاحة لاستقبال مزيد من المدعوين؛ و«مكان» هو التعبير العربي الطبيعي هنا.
theological_decisions:
- issue: دلالة Κύριε في سياق المثل
  choice: يا سيدي
  alternative: يا رب
  rationale: المخاطَب داخل القصة هو ربّ البيت، ولذلك يعبّر «يا سيدي» عن العلاقة المقصودة من غير أن يحسم ما إذا كان القارئ سيستشف دلالة رمزية أوسع من المثل.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على إيجاز الأصل وتسلسل خبره. وُضعت علامتا الحاشية في المتن عند اللفظين اللذين لهما بدائل معجمية معتبرة.
