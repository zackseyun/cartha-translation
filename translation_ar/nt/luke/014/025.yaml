- source_word: αὐτῷ
  choice: معه
  rationale: يحفظ الضمير اليوناني ويدل، مع فعل السير، على المصاحبة، من غير تكرار اسم يسوع حيث يتضح مرجعه من السياق.
- source_word: ὄχλοι πολλοί
