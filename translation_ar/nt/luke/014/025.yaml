  rationale: تصل الفاء بين مرافقة الجموع ورد فعل يسوع في تسلسل سردي طبيعي، من غير تحميل الرابط معنى سببيًا قويًا.
- source_word: στραφεὶς
  choice: التفت
  rationale: ينقل الالتفات السابق مباشرة للقول بصياغة عربية موجزة وطبيعية، من غير زيادة «إلى الوراء» التي لا يصرح بها اللفظ.
- source_word: εἶπεν
  choice: قال
  rationale: المقابل السردي العربي المعتاد والدقيق لفعل القول في الماضي.
- source_word: πρὸς αὐτούς
  choice: لهم
  rationale: يحدد المخاطَبين ويحفظ الإحالة الضميرية إلى الجموع بصياغة عربية مألوفة مع فعل «قال».
