- source_word: Συνεπορεύοντο
  choice: كانت... تسير معه
  rationale: يفيد الفعل الناقص حدثًا مستمرًا في الماضي، ومعناه أن الجموع كانت ترافقه في سيره؛ والصياغة العربية طبيعية وتحفظ معنى المصاحبة في الطريق.
- source_word: δὲ
  choice: الواو في «وكانت»
