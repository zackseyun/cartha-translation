  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: ar
  text: 'وقال آخر: «تزوجتُ امرأةً[a]، ولذلك لا أستطيع أن آتي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تزوجتُ زوجةً».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: آخر
  rationale: تُدخل الكلمة متحدثًا إضافيًا ضمن تسلسل المعتذرين، و«آخر» هي الصياغة العربية الطبيعية الموجزة.
- source_word: Γυναῖκα
  choice: امرأةً
  rationale: مع فعل الزواج تدل γυνή على المرأة بوصفها زوجة. وتعبير «تزوجت امرأةً» فصيح وطبيعي، بخلاف «تزوجت زوجةً» الحرفي الأثقل.
- source_word: ἔγημα
  choice: تزوجتُ
  rationale: ينقل الفعل الماضي اليوناني بوصفه حدثًا مكتملًا، من غير إضافة دلالة صريحة على حداثة الزواج لا يفرضها النص نفسه.
- source_word: διὰ τοῦτο
  choice: ولذلك
  rationale: توضح العبارة أن الزواج هو السبب الذي يسوقه المتكلم لعدم المجيء، وتحافظ «ولذلك» على الرابط السببي بإيجاز طبيعي.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: لا أستطيع أن آتي
  rationale: تنقل معنى عدم القدرة مع الحفاظ على الفعل «آتي» المقابل المباشر لـἐλθεῖν.
