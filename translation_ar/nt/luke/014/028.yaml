base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: ar
  text: فمَن منكم، إذا أراد أن يبني برجًا، لا يجلس أولًا ويحسب النفقة، ليرى هل لديه ما يكفي لإتمامه؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «هل لديه للإتمام؟» والمقصود: هل لديه من الموارد ما يكفي لإكمال البناء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: فمَن منكم
  rationale: تفيد العبارة سؤالًا بلاغيًا موجَّهًا إلى السامعين، وتنقل الفاء صلة γάρ بما قبلها.
- source_word: θέλων πύργον οἰκοδομῆσαι
  choice: إذا أراد أن يبني برجًا
  rationale: صياغة عربية طبيعية تحفظ معنى الإرادة أو القصد في اسم الفاعل، وتبقي صورة البرج كما هي.
- source_word: οὐχὶ πρῶτον καθίσας
  choice: لا يجلس أولًا
  rationale: يحفظ السؤال البلاغي المتوقع جوابه بالإيجاب، كما يعبّر عن سبق الجلوس على الحساب.
- source_word: ψηφίζει τὴν δαπάνην
  choice: ويحسب النفقة
  rationale: الفعل يدل على الحساب أو التقدير، و«النفقة» تؤدي معنى الكلفة المطلوبة للمشروع.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: ليرى هل لديه ما يكفي لإتمامه
  rationale: توضح الصياغة العربية الغرض من الحساب، وتُظهر الكفاية المفهومة من السياق من غير تغيير المعنى.
