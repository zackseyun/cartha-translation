  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «خزي» للمحافظة على قوة بُعد العار الاجتماعي، و«المكان الأخير» للإبقاء على مرونة التعبير اليوناني. وُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
