base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: ar
  text: 'فيأتي الذي دعاك ودعاه، ويقول لك: «أعطِ هذا مكانك». وحينئذ تبدأ، في خزي، في شغل المكان الأخير.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المكان الأدنى». يمكن أن تعني العبارة اليونانية «المكان الأخير» آخر موضع في الترتيب، ومن ثم أدنى مقعد من حيث التكريم في سياق الوليمة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: الذي دعاك ودعاه
  rationale: يحافظ على البناء الوصفي الاسمي في اليونانية وعلى التمييز بين المدعوَّين، بصياغة عربية طبيعية.
- source_word: ἐλθὼν ... ἐρεῖ σοι
  choice: فيأتي ... ويقول لك
  rationale: اسم الفاعل الماضي يسبق فعل القول المستقبل في تسلسل الحدث؛ والعطف بالمضارع الحكائي ملائم لسياق المثل العربي ويحفظ الترابط.
- source_word: Δὸς τούτῳ τόπον
  choice: أعطِ هذا مكانك
  rationale: المقصود في سياق ترتيب المقاعد أن يتنازل المخاطَب عن مكانه لهذا الشخص؛ وإضافة «مكانك» توضّح ما يقتضيه السياق دون تغيير المعنى.
- source_word: μετὰ αἰσχύνης
  choice: وأنت في خزي
  rationale: «خزي» ينقل قوة αἰσχύνη الاجتماعية، وهي أقوى من مجرد الحرج أو الإحراج.
- source_word: τὸν ἔσχατον τόπον
  choice: المكان الأخير
  rationale: يحفظ المعنى المباشر لـἔσχατος، مع بقاء دلالة أدنى مراتب الشرف مفهومة من سياق الوليمة ومبيّنة في الحاشية.
- source_word: ἄρξῃ ... κατέχειν
  choice: تبدأ ... تأخذ
  rationale: يحافظ على دلالة البدء الصريحة من غير إضافة معنى الاضطرار، ويعبّر «تأخذ» طبيعيًا عن الانتقال إلى ذلك المكان.
theological_decisions: []
