lexical_decisions:
- source_word: οἱ δὲ
  choice: أما هم فـ
  rationale: يحيل الضمير إلى المخاطَبين في السياق السابق، وتفيد δέ مقابلة خفيفة بعد سؤال يسوع؛ وصيغة «أما هم فـ» عربية طبيعية تُظهر هذا الانتقال المقابل.
- source_word: ἡσύχασαν
  choice: ظلّوا صامتين
  rationale: يدل الفعل هنا على امتناعهم عن الإجابة. وتحافظ الصياغة على معنى استمرار الصمت في هذا الموقف دون إضافة سبب له.
- source_word: ἐπιλαβόμενος
  choice: فأمسكه
  rationale: يحمل الفعل معنى الأخذ أو الإمساك بالشخص، فتحفظ «أمسكه» الدلالة الجسدية بإيجاز طبيعي.
- source_word: ἰάσατο
  choice: شفاه
  rationale: المعنى المباشر في سياق المرض الجسدي هو الشفاء، و«شفاه» التعبير العربي الواضح المألوف.
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير مذكر مفرد يعود إلى الرجل المريض المذكور في السياق.
- source_word: ἀπέλυσεν
  choice: أطلقه
  rationale: يمكن أن يعني الفعل أطلق أو صرف أو ترك يمضي. «أطلقه» يحفظ سعته الدلالية، مع توضيح البدائل السياقية في الحاشية.
