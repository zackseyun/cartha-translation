  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: ar
  text: 'ولمّا سأله الفريسيون متى يأتي ملكوت الله، أجابهم قائلًا: «لا يأتي ملكوت الله بطريقة يمكن رصدها[a]،»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مع مراقبة»، أو «على نحو يمكن ملاحظته»، أو «مع ترقّب دقيق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ
  choice: ولمّا سأله
  rationale: ينقل اسم الفاعل الماضي المبني للمجهول بوصفه ظرفًا سابقًا للجواب، مع التعبير العربي الطبيعي بالمعلوم؛ والواو تحمل الانتقال الخفيف الذي تفيده δέ من غير إدخال «الآن».
- source_word: ὑπὸ τῶν Φαρισαίων
  choice: الفريسيون
  rationale: جُعل الفاعل النحوي في الصياغة العربية المعلومة، مع الحفاظ على أن الفريسيين هم الذين وجّهوا السؤال.
- source_word: πότε ἔρχεται
  choice: متى يأتي
  rationale: يحافظ على السؤال الزمني وعلى المضارع اليوناني ذي التوجّه المستقبلي، وهو تعبير عربي فصيح وطبيعي.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير كتابي عربي معروف وواضح، ويحفظ دلالة الحكم والسلطان الإلهي من غير شرح تفسيري داخل النص.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: أجابهم قائلًا
  rationale: يمثل الفعلين اليونانيين بصياغة عربية طبيعية تحفظ معنى الجواب والقول من غير تكرار ثقيل.
- source_word: Οὐκ ἔρχεται
  choice: لا يأتي
  rationale: يحفظ صيغة المضارع بوصفها تقريرًا عامًا عن كيفية مجيء الملكوت.
- source_word: μετὰ παρατηρήσεως
  choice: بطريقة يمكن رصدها
  rationale: ينقل معنى الملاحظة أو الترقب أو الفحص في عبارة عربية واضحة، من غير حصر اللفظة في «علامات» غير مذكورة صراحة في اليونانية.
theological_decisions:
- issue: دلالة نفي كيفية مجيء ملكوت الله
  choice: لا يأتي بطريقة يمكن رصدها
  alternative: لا يأتي بعلامات ظاهرة؛ لا يأتي مع مراقبة؛ لا يأتي نتيجة ترقّب دقيق
  rationale: يحفظ اتساع παρατήρησις بين الرصد والملاحظة والترقّب، ولا يحوّل القول إلى نفي مطلق لكل علامة أخروية ولا إلى تقرير مذهبي كامل بشأن تحقق الملكوت.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ملكوت الله» لاتساقه مع الاصطلاح الكتابي الشائع، وصيغت الجملة بالمعلوم لطبيعية الأسلوب العربي مع بقاء هوية السائلين والجواب واضحة.
