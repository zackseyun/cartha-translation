  verdict: revise
  source_fidelity: 'الترجمة تنقل الاستفهام الإنكاري المتوقع جوابه بالإيجاب، والإحالة إلى جماعة العشرة، والمقابلة مع التسعة بدقة. لكن «يتطهّر» فعل لازم/مطاوع قد يُفهم منه أن العشرة باشروا التطهر أو دخلوا فيه، بينما ἐκαθαρίσθησαν مبني للمجهول: «طُهِّروا/تمّ تطهيرهم».'
  naturalness: «فأجاب يسوع» و«ولكن أين التسعة؟» فصيحتان وطبيعيتان. وصيغة «ألم يُطهَّر العشرة؟» سليمة ومفهومة في العربية المعاصرة، وتحفظ البناء للمجهول دون تكلّف.
  terminology: «يُطهَّر» يحافظ على مجال καθαρίζω الدلالي في سياق البرص، بما فيه الطهارة وليس الشفاء الجسدي وحده. ويستحسن في الحاشية بديل عربي طبيعي («يصبح ... طاهرين») بدل «يُجعَل ... طاهرين» الذي يبدو مصطنعًا.
