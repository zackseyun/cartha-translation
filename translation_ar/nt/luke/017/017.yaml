    rationale: الفعل اليوناني أوريست مبني للمجهول («طُهِّروا»). أما «تطهّر» فيدل عادة على التطهر الذاتي أو التحول اللازم؛ لذا فـ«يُطهَّر» أوفى من غير تغيير للمعنى.
  - severity: low
    issue: صياغة الحاشية «ألم يُجعَل العشرة طاهرين؟» غير سلسة عربيًا.
    rationale: هي مفهومة، لكن التعبير بالفعل «جعل» ثقيل في هذا الموضع. البديل «ألم يصبح العشرة طاهرين؟» عربي طبيعي ويعرض البديل المعجمي من دون ادعاء فرق تفسيري زائد.
