  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: ar
  text: 'فأجاب يسوع: «ألم يُطهَّر العشرة[a]؟ ولكن أين التسعة؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ألم يصبح العشرة طاهرين؟»'
    reason: بديل لفظي يعبّر عن نتيجة التطهير، مع أن النص الرئيس يحافظ على الصيغة المبنية للمجهول في اليونانية.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: فأجاب يسوع
  rationale: تؤدي الصياغة العربية الطبيعية وظيفة العبارة السردية اليونانية التي تجمع بين «أجاب» و«قال»، من غير تكرار ثقيل، كما تنقل الفاء استمرار السرد.
- source_word: Οὐχὶ
  choice: ألم
  rationale: تقدّم سؤالًا إنكاريًا يتوقع جوابًا بالإيجاب، موافقًا لقوة οὐχί في السياق.
- source_word: οἱ δέκα
  choice: العشرة
  rationale: يشير التعريف مع العدد إلى جماعة الرجال العشرة المعروفة من السياق، من غير إضافة توكيد غير مصرح به مثل «جميعًا».
- source_word: ἐκαθαρίσθησαν
  choice: يتطهّر
  rationale: يحفظ معنى καθαρίζω المتعلق بالطهارة، بما يشمله السياق من زوال البرص واستعادة الطهارة، ولا يختزله في مجرد الشفاء الجسدي. وجاء الفعل مفردًا لتقدمه على فاعل عددي في العربية.
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: ولكن أين التسعة؟
  rationale: تنقل «ولكن» المقابلة بين الواحد الذي رجع والتسعة الآخرين، بينما تؤدي «أين» سؤال المكان الموجز ذا القوة البلاغية.
theological_decisions:
- issue: دلالة καθαρίζω في سياق شفاء البرص
  choice: يتطهّر
  alternative: يُشفَ
  rationale: اللفظ اليوناني يدل على التطهير أو الصيرورة إلى حال الطهارة، وفي سياق البرص يجمع بين البعد الجسدي والاعتباري المتعلق بالطهارة؛ لذلك لا تُحصر دلالته في الشفاء وحده.
translation_notes:
