  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: ar
  text: كانوا يأكلون ويشربون، ويتزوّجون ويُزوَّجون[a]، حتى اليوم الذي دخل فيه نوح الفلك؛ فجاء الطوفان وأهلكهم جميعًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تستعمل اليونانية فعلين مختلفين: الأول بصيغة المعلوم بمعنى الإقدام على الزواج، والثاني بصيغة المبني للمجهول بمعنى أن يزوِّجهم آخرون. ويمكن التعبير عنهما بإيجاز: «يتزوّجون ويُزوَّجون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤσθιον، ἔπινον
  choice: كانوا يأكلون ويشربون
  rationale: صيغتا الماضي الناقص تصوّران نشاطين مستمرين أو معتادين في الماضي؛ وينقل التركيب «كانوا يفعلون» هذا الجانب بوضوح وطبيعية.
- source_word: ἐγάμουν
  choice: يتزوّجون
  rationale: يحافظ هذا التعبير على معنى الإقدام على الزواج من غير تقييده بجنس معيّن في العربية.
- source_word: ἐγαμίζοντο
  choice: يُزوَّجون
  rationale: الصيغة المبنية للمجهول تحفظ تمييز اليونانية بين الإقدام على الزواج وبين أن يزوّج الآخرون الشخص، من غير إضافة مفعول أو تفصيل غير مذكور.
- source_word: ἄχρι ἧς ἡμέρας
  choice: حتى اليوم الذي
  rationale: تعبير عربي واضح يبيّن الحد الزمني لاستمرار تلك الأنشطة.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: دخل فيه نوح الفلك
  rationale: «دخل الفلك» تركيب عربي فصيح وطبيعي، و«الفلك» هو المقابل المألوف لسفينة نوح في السياق الكتابي.
- source_word: ὁ κατακλυσμός
  choice: الطوفان
  rationale: اللفظ العربي الراسخ والواضح للطوفان المرتبط بقصة نوح.
- source_word: ἀπώλεσεν πάντας
  choice: أهلكهم جميعًا
  rationale: يعبّر عن الهلاك الشامل، ويجعل مرجع «الجميع» البشري مفهومًا بضمير الجمع كما يقتضي السياق.
theological_decisions:
- issue: تمييز فعلي الزواج المتقابلين
  choice: يتزوّجون ويُزوَّجون
  alternative: يتزوّجون
  rationale: يستعمل النص اليوناني فعلين مختلفين، أحدهما معلوم والآخر مبني للمجهول. إبقاء التقابل يحفظ نسيج النص وتصوير الحياة الاجتماعية المعتادة من غير تحميله دلالة مذهبية إضافية.
- issue: جانب الأفعال الأربعة الافتتاحية
  choice: كانوا يأكلون ويشربون، ويتزوّجون ويُزوَّجون
  alternative: أكلوا وشربوا وتزوّجوا وزُوِّجوا
  rationale: الماضي الناقص اليوناني يصوّر أفعالًا جارية أو معتادة استمرت إلى مجيء الطوفان؛ لذلك استُعمل «كانوا» مع المضارع، ويستمر حكمه دلاليًا على الفعلين التاليين.
translation_notes:
  register: العربية فصحى معاصرة واضحة وذات نبرة كتابية رصينة. حُفظ تتابع الأنشطة المعتادة ثم الانتقال المفاجئ إلى الطوفان، كما حُفظ الفرق بين فعلي الزواج من دون إضافة تحديدات اجتماعية أو جنسية لا يصرّح بها النص.
