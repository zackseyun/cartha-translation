  text: Δύο ἔσονται ἐν τῷ ἀγρῷ· εἷς παραληφθήσεται, καὶ ὁ ἕτερος ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: ar
  text: يكون اثنان[a] في الحقل؛ فيُؤخذ أحدهما ويُترك الآخر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: هذه الآية غير موجودة في أقدم المخطوطات اليونانية، ومنها السينائية والفاتيكانية من القرن الرابع، ولا في الترجمات القبطية المبكرة. لكنها موجودة في التقليد الغربي، مثل مخطوطة بيزا من القرن الخامس، وفي أغلبية المخطوطات البيزنطية، وكذلك في الفولغاتا اللاتينية. ويُرجَّح أن نُسّاخًا متأخرين أضافوها لموافقة متى 24:40.
    reason: textual_critical
lexical_decisions:
- source_word: παραληφθήσεται
  choice: فيُؤخذ
  rationale: صيغة مبني للمجهول تحافظ على الفعل الإلهي الضمني وعلى عدم التصريح بوجهة المأخوذ، وتؤدي معنى أخذه أو ضمه في مقابل ترك الآخر.
- source_word: ἀφεθήσεται
  choice: ويُترك
  rationale: تحافظ على المبني للمجهول وعلى المقابلة المباشرة بين الأخذ والترك، من غير زيادة معنى الهجر أو الإفلات.
- source_word: ἕτερος
  choice: الآخر
  rationale: يدل هنا على الثاني من الاثنين المذكورين، ولذلك فـ«الآخر» أدق من «شخص آخر».
- source_word: Δύο
  choice: اثنان
  rationale: يحافظ على إيجاز اليونانية؛ وصيغة المذكر تدل طبيعيًا على شخصين من غير الحاجة إلى إضافة كلمة «رجلان» غير الموجودة صراحة في النص.
theological_decisions:
- issue: دلالة الأخذ والترك في السياق الأخروي
  choice: الإبقاء على «يُؤخذ» و«يُترك» من دون تحديد أن الأخذ للخلاص أو للدينونة
  alternative: تفسير المأخوذ بأنه يُجمع للخلاص، أو بأنه يُؤخذ للدينونة
  rationale: العبارة نفسها لا تصرح بمصير أي منهما، وسياق لوقا يتيح توترًا تفسيريًا لا ينبغي حسمه بإضافة تفسير إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة ذات نبرة كتابية رصينة. استُعمل المبني للمجهول في الفعلين لمضاهاة الصياغة اليونانية، ووُضع حرف الفاء قبل «يُؤخذ» لإظهار تتابع الجملة والمقابلة الطبيعية في العربية.
