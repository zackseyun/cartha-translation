  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: ar
  text: 'وقال الرب: «لو كان لكم إيمان مثل حبة خردل، لقلتم لشجرة التوت هذه[a]: لتُقتَلَعي من جذورك ولتُغرَسي في البحر، لأطاعتكم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «شجرة السيكامين»، وهو نقل تقليدي للفظ اليوناني الدال على نوع من شجر التوت.
    reason: بديل معجمي يحفظ النقل التقليدي مع توضيح مدلوله.
lexical_decisions:
- source_word: κύριος
  choice: الرب
  rationale: يحفظ اللقب السردي والمسيحاني المألوف في سياق لوقا، ولا يخففه إلى معنى «المعلّم» أو «السيد» فحسب.
- source_word: πίστιν
  choice: إيمان
  rationale: هو المقابل العربي الطبيعي في هذا السياق، حيث يدل على الثقة بالله، لا على الأمانة أو الثبات الأخلاقي في المقام الأول.
- source_word: ὡς κόκκον σινάπεως
  choice: مثل حبة خردل
  rationale: يحفظ التشبيه كما هو، من غير حصر دلالته صراحة في صغر الحجم وحده.
- source_word: συκαμίνῳ
  choice: شجرة التوت
  rationale: المقصود شجرة من جنس التوت؛ وهذه العبارة أوضح للقارئ العربي المعاصر من النقل الصوتي التقليدي.
- source_word: ἐλέγετε ἂν
  choice: لقلتم
  rationale: ينقل دلالة الاحتمال في جواب الشرط بصياغة عربية طبيعية.
- source_word: Ἐκριζώθητι
  choice: لتُقتَلَعي من جذورك
  rationale: يحفظ المبني للمجهول ومعنى الاقتلاع الكامل من الجذور، مع صيغة أمر عربية غير مباشرة لأن العربية لا تصوغ أمرًا مباشرًا مبنيًا للمجهول على نحو طبيعي.
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: لتُغرَسي في البحر
  rationale: يحفظ المبني للمجهول والصورة المفارِقة للغرس في البحر، من غير تفسيرها أو تخفيفها.
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: لأطاعتكم
  rationale: «أطاعتكم» أنسب لصورة توجيه الأمر إلى الشجرة، وتحفظ معنى الاستجابة الخاضعة للأمر.
theological_decisions:
- issue: دلالة πίστις في قول يتعلق بالمعجزة
  choice: إيمان
  alternative: ثقة؛ أمانة
  rationale: السياق يتناول الثقة بالله إزاء ما يبدو مستحيلًا، ولا يركّز أساسًا على الأمانة بوصفها ثباتًا أخلاقيًا؛ ومع ذلك لا تضيف الصياغة تحديدًا عقائديًا يتجاوز النص.
- issue: قوة الجملة الشرطية
  choice: لو كان لكم إيمان... لقلتم
  alternative: إن كان لكم إيمان... لقلتم
  rationale: جواب الشرط اليوناني المصحوب بـἄν يفيد الاحتمال الافتراضي، وتؤديه «لو... لَـ» بوضوح وطبيعية في العربية، من غير تحويل القول إلى تقرير عن مقدار الإيمان.
translation_notes:
  register: 'عربية فصحى حديثة واضحة ووقورة. وُضع مؤشر الحاشية بعد «شجرة التوت» لأنه يتعلق بهذا اللفظ، وحُفظت الصورة البلاغية الغريبة: اقتلاع الشجرة وغرسها في البحر.'
