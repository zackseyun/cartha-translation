language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: ar
  text: 'وهكذا أنتم أيضًا، متى فعلتم كلَّ ما أُمرتم به، فقولوا: «نحن عبيد لا فضل لنا[a]؛ فعلنا ما كان علينا أن نفعله[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عبيد غير نافعين» أو «عبيد عديمو النفع». وقد تدل الكلمة اليونانية أيضًا على مَن لا فضل زائدًا له ولا حق له في المطالبة بمكافأة.'
    reason: بديل معجمي وحفظ لاتساع دلالة ἀχρεῖοι.
  - marker: b
    text: 'أو: «فعلنا ما كان واجبًا علينا».'
    reason: بديل معجمي يصرّح بمعنى الالتزام في ὀφείλω.
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: وهكذا أنتم أيضًا
  rationale: تربط العبارة تطبيق القول بالمثال السابق، وتحافظ «وهكذا» على قوة الاستنتاج والمقارنة.
- source_word: ὅταν ποιήσητε
  choice: متى فعلتم
  rationale: تفيد ὅταν مع صيغة الماضي الاحتمالية حالة عامة مستقبلية، و«متى فعلتم» عربية واضحة تدل على اكتمال الفعل قبل الأمر بالقول.
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: كلَّ ما أُمرتم به
  rationale: تنقل سلطة الفعل διατάσσω بصيغة عربية طبيعية، من غير تليينه إلى مجرد التكليف أو الإسناد.
- source_word: λέγετε
  choice: فقولوا
  rationale: صيغة الأمر هي المقصودة، والفاء تُظهر النتيجة الزمنية والمنطقية بعد إتمام المأمور به.
- source_word: Δοῦλοι
  choice: عبيد
  rationale: سياق المثل السابق قائم على علاقة السيد بالعبد، ولذلك تحافظ «عبيد» على الوضع الاجتماعي والقوة البلاغية أكثر من «خدم».
- source_word: ἀχρεῖοί
  choice: لا فضل لنا
  rationale: يفيد الوصف انعدام النفع الزائد أو عدم وجود استحقاق يوجب مكافأة؛ وهذه الصياغة تنقل المعنى السياقي من غير أن توحي بأن العبيد لا قيمة لهم في ذواتهم.
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: ما كان علينا أن نفعله
  rationale: ينقل ὀφείλω معنى الالتزام والواجب بعبارة عربية مألوفة، مع إبقاء صلة الموصول بالفعل.
- source_word: πεποιήκαμεν
  choice: فعلنا
  rationale: يدل الفعل اليوناني التام على عمل مكتمل ذي صلة بالحاضر؛ ويؤدي الماضي العربي هذا المعنى بوضوح في السياق بعد «متى فعلتم».
theological_decisions:
- issue: ترجمة δοῦλοι في تشبيه عن التلمذة
  choice: عبيد
  alternative: خدم
  rationale: العلاقة في السياق علاقة سيد بعبد، والمغزى هو أن أداء المأمور به لا يجعل السيد مدينًا للعبد؛ لذلك لا تُخفَّف دلالة الوضع المقيد.
- issue: دلالة ἀχρεῖοι
  choice: لا فضل لنا
  alternative: غير نافعين / عديمو النفع / لا استحقاق لنا
  rationale: يحفظ الاختيار محور القول، وهو عدم وجود فضل زائد أو حق في المكافأة بسبب مجرد الطاعة، مع تجنب الجزم بأن التلاميذ عديمو القيمة مطلقًا. وتُذكر الدلالة الأقرب حرفيًا في الحاشية إبقاءً للاتساع المعجمي.
- issue: طبيعة الالتزام في ὀφείλομεν
  choice: ما كان علينا أن نفعله
  alternative: ما كان واجبًا علينا أن نفعله
  rationale: الصياغتان تدلان على الواجب، لكن المختارة أكثر سلاسة ولا تحوّل العبارة إلى مصطلح لاهوتي زائد.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة. استُعملت «عبيد» حفاظًا على صورة السيد والعبد في السياق، و«لا فضل لنا» لنقل غياب الاستحقاق الزائد من غير تقرير انعدام القيمة الذاتية. وُضعت علامتا الحاشية عند اللفظين اللذين تشرحانهما.
