  text: καὶ ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ εὐχαριστῶν αὐτῷ· καὶ αὐτὸς ἦν Σαμαρίτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: ar
  text: فَخَرَّ عَلَى وَجْهِهِ عِنْدَ قَدَمَيْهِ، وَهُوَ يَشْكُرُهُ. وَكَانَ هُوَ سَامِرِيًّا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν
  choice: خَرَّ
  rationale: يعبّر الفعل «خَرَّ» طبيعيًا وبإيجاز عن السقوط المقصود في مقام التذلل، فيما توضح عبارة «على وجهه» هيئة السجود دون زيادة تفسيرية.
- source_word: ἐπὶ πρόσωπον
  choice: على وجهه
  rationale: مقابل عربي واضح وقريب من صورة الأصل الجسدية، ويدل في السياق على الانطراح بخشوع.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: عند قدميه
  rationale: تنقل «عند» الدلالة السياقية لـπαρά مع الجمع «قدميه»، وتحافظ على صورة وجود الرجل منطرحًا بالقرب من قدمي يسوع من غير تفسير زائد.
- source_word: εὐχαριστῶν αὐτῷ
  choice: وهو يشكره
  rationale: تنقل اسم الفاعل الحاضر بوصفه فعلًا مصاحبًا للانطراح، وتحافظ على توجيه الشكر إليه مباشرة.
- source_word: Σαμαρίτης
  choice: سامريًّا
  rationale: هو المقابل العربي المستقر للانتماء السامري الذي يحمل أهمية اجتماعية وسردية في المقطع.
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: وكان هو سامريًّا
  rationale: يحافظ الضمير المنفصل «هو» على توكيد αὐτός وعلى وقع الكشف عن هوية الرجل دون إضافة تعليق تفسيري.
theological_decisions:
- issue: التوكيد السردي لهوية الرجل الذي شُفي
  choice: وكان هو سامريًّا
  alternative: وكان سامريًّا؛ أما هو فكان سامريًّا
  rationale: يُبقي النص خبر هويته بسيطًا ومؤكدًا كما في اليونانية، لتظل المفارقة الاجتماعية واللاهوتية قائمة من غير شرح مذهبي أو توسيع تفسيري.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «خَرَّ على وجهه» للمحافظة على الصورة الحسية ونبرة التذلل، و«عند قدميه» لتجنب تركيب غير طبيعي. لا توجد حواشٍ لازمة لهذه الآية.
