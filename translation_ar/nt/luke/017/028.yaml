  register: عربية فصحى معاصرة واضحة ورصينة. حُفظ تتابع الأفعال الماضية الناقصة بصيغة «كانوا» مع أفعال مضارعة معطوفة، لإبراز أنشطة الحياة اليومية المستمرة من غير تكرار ثقيل.
