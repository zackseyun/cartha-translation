  text: ὁμοίως ⸀καθὼς ἐγένετο ἐν ταῖς ἡμέραις Λώτ· ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: ar
  text: 'وكذلك، كما حدث في أيام لوط: كانوا يأكلون ويشربون، ويشترون ويبيعون، ويغرسون ويبنون.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: وكذلك
  rationale: ظرف يربط مثال لوط بالمقارنة السابقة، و«وكذلك» واضحة وطبيعية وتحفظ معنى المماثلة.
- source_word: καθὼς
  choice: كما
  rationale: تُدخل جملة المقارنة وتؤدي معنى المماثلة على نحو طبيعي في العربية من غير إثقال.
- source_word: ἐγένετο
  choice: حدث
  rationale: الفعل هنا ذو دلالة حدثية؛ و«حدث» تعبير عربي معاصر ومباشر.
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: في أيام لوط
  rationale: تحفظ العبارة الزمنية الكتابية المألوفة، وتشير إلى الحقبة المرتبطة بلوط.
- source_word: ἤσθιον
  choice: كانوا يأكلون
  rationale: صيغة الماضي الناقص تصوّر نشاطًا مستمرًا أو معتادًا في خلفية الحدث، وتنقلها صيغة «كانوا يفعلون» بوضوح.
- source_word: ἔπινον
  choice: ويشربون
  rationale: معطوفة على «كانوا يأكلون»، فتستمد منها دلالة الاستمرار وتحافظ على انسياب القائمة.
- source_word: ἠγόραζον
  choice: ويشترون
  rationale: تصف نشاطًا تجاريًا اعتياديًا مستمرًا، و«يشترون» هي المقابل الطبيعي المباشر.
- source_word: ἐπώλουν
  choice: ويبيعون
  rationale: تقابل «يشترون» وتصور نشاط السوق المعتاد مع الحفاظ على الجانب الاستمراري.
- source_word: ἐφύτευον
  choice: ويغرسون
  rationale: الفعل يدل على غرس النبات أو زرعه؛ واختيار «يغرسون» يحفظ الدلالة الحرفية والنشاط الزراعي الجاري.
- source_word: ᾠκοδόμουν
  choice: ويبنون
  rationale: يُستعمل هنا بمعناه الحرفي في البناء، لا بالمعنى المجازي، وتبقي الصيغة على صورة النشاط المتواصل.
theological_decisions: []
