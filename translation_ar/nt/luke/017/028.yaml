  source_fidelity: الترجمة تنقل بدقة البنية المقارِنة في ὁμοίως καθὼς ἐγένετο، والعبارة الزمنية «في أيام لوط»، وقائمة الأفعال الستة بصفتها أنشطة اعتيادية/مستمرة، وذلك باستعمال «كانوا» مع المضارع المعطوف. ولا تضيف تفسيرًا أو حكمًا غير موجود في النص.
  naturalness: النص فصيح معاصر وواضح. تسلسل «كانوا يأكلون ويشربون، ويشترون ويبيعون، ويغرسون ويبنون» طبيعي ومتماسك، وعلامة النقطتين مناسبة لافتتاح القائمة.
  terminology: «لوط» هو الاسم العربي المألوف، و«يغرسون» مقابل سليم لـἐφύτευον في سياق النشاط الزراعي، و«يبنون» يحفظ المعنى الحرفي لـᾠκοδόμουν. لا توجد مصطلحات لاهوتية أو أسماء تحتاج إلى تعديل.
