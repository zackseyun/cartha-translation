base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: ar
  text: ولكن يجب عليه أولًا أن يعاني أمورًا كثيرة، وأن يرفضه هذا الجيل.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: أولًا
  rationale: ظرف يفيد الأولوية الزمنية، ويحافظ على ترتيب الأحداث السابق لما ذُكر في السياق.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد هنا انتقالًا ذا مسحة استدراكية؛ و«لكن» العربية تؤدي هذا المعنى بوضوح وطبيعية.
- source_word: δεῖ
  choice: يجب عليه
  rationale: ينقل معنى الضرورة بقوة وإيجاز، مع إبقاء مصدر هذه الضرورة أو طبيعتها غير مصرّح بهما كما في اليونانية.
- source_word: πολλὰ παθεῖν
  choice: أن يعاني آلامًا كثيرة
  rationale: صياغة عربية طبيعية تحفظ تعدد المعاناة وشدتها، بدل التعبير الملتبس «يعاني أشياء كثيرة».
- source_word: ἀποδοκιμασθῆναι
  choice: أن يرفضه
  rationale: الفعل يدل على الرفض بعد النظر أو التقييم؛ و«يرفضه» أوضح مقابل عربي في هذا السياق، مع تحويل المبني للمجهول اليوناني إلى صياغة عربية فصيحة تحدد الفاعل المذكور.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: هذا الجيل
  rationale: مع المبني للمجهول تدل ἀπό على الجهة التي يصدر عنها الرفض؛ وجعل «هذا الجيل» فاعلًا في العربية يحفظ المعنى المقصود بوضوح.
theological_decisions:
- issue: دلالة δεῖ في ضرورة آلام ابن الإنسان
  choice: «يجب عليه» دون شرح مصدر الضرورة
  alternative: «لا بد له» أو التصريح بأن ذلك بحسب خطة الله
  rationale: يشيع في لوقا استعمال δεῖ لأحداث مرتبطة بالقصد الإلهي، لكن الآية لا تصرّح بذلك هنا؛ لذا تحافظ الصياغة على قوة الضرورة دون إضافة تفسير لاهوتي.
- issue: مرجع الضمير αὐτόν
  choice: الإبقاء على الضمير «عليه/ـه» كما في النص، اعتمادًا على السياق السابق
  alternative: إضافة «ابن الإنسان» توضيحًا
  rationale: الاسم وارد في السياق السابق لا في هذه الآية نفسها، وإدخاله هنا سيكون إضافة تفسيرية غير لازمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم المبني للمعلوم في «يرفضه هذا الجيل» لأنه أكثر طبيعية في العربية، مع حفظ جهة الرفض ومعنى النص اليوناني.
