base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: ar
  text: خيرٌ له أن يُعلَّق حجرُ رحى حول عنقه ويُطرَح في البحر، من أن يُعثِر واحدًا من هؤلاء الصغار[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، على وجهٍ أخص: «حجر رحى كبير». قد تشير العبارة اليونانية إلى حجر الرحى الأثقل المستخدم في المطحنة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يتسبب في أن يخطئ واحدٌ من هؤلاء الصغار». يتضمن الفعل اليوناني معنى التسبب في سقوط شخص في الخطيئة أو الهلاك الروحي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: خيرٌ له
  rationale: تعبير عربي طبيعي موجز يفيد أن المصير المذكور أفضل له من البديل، ويحفظ قوة المقارنة في اليونانية.
- source_word: λίθος μυλικὸς
  choice: حجر رحى
  rationale: المقابل العربي المباشر والمألوف للحجر المستخدم في الطحن، من غير تحميل المتن تحديدًا حجميًا غير محسوم.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: يُعلَّق ... حول عنقه
  rationale: صياغة مبنية للمجهول تعبّر طبيعيًا عن وضع حجر الرحى محيطًا بالعنق في هذا السياق الشرطي.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: يُطرَح في البحر
  rationale: يحفظ المبني للمجهول واتجاه الفعل إلى البحر، وينسجم مع البنية العربية المقترنة بـ«أن يُعلَّق».
- source_word: σκανδαλίσῃ
  choice: يجعل ... يعثر
  rationale: يحفظ صورة العثرة في الأصل، مع دلالة السياق على التسبب في السقوط في الخطيئة أو الضرر الروحي؛ ويُذكر التفسير الأصرح في الحاشية.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: واحدًا من هؤلاء الصغار
  rationale: يحافظ على عموم العبارة ولا يحصر مرجعها في الأطفال أو التلاميذ أو المؤمنين المتواضعين.
- source_word: ἢ ἵνα
  choice: من أن
  rationale: تركيب عربي طبيعي لإقامة المقارنة بين المصيرين بعد «خيرٌ له».
theological_decisions:
- issue: مرجع «هؤلاء الصغار»
  choice: الإبقاء على العبارة العامة «هؤلاء الصغار»
  alternative: هؤلاء الأطفال؛ أو هؤلاء المؤمنون/التلاميذ المتواضعون
  rationale: النص نفسه لا يحدد المرجع تحديدًا قاطعًا، ولذلك لا ينبغي للترجمة أن تحسم التوتر التفسيري لمصلحة فئة بعينها.
- issue: مدلول σκανδαλίσῃ
  choice: يجعل ... يعثر
  alternative: يتسبب في أن يخطئ؛ أو يوقع في الخطيئة
  rationale: يحفظ الاختيار صورة العثرة الأصلية، بينما توضّح الحاشية أن المقصود قد يشمل الإيقاع في الخطيئة أو الهلاك الروحي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع تراكيب مألوفة للقارئ العام. حُفظت استعارة العثرة وغموض مرجع «الصغار»، ووُضعت البدائل التفسيرية في الحواشي بدل إدخالها في المتن.
