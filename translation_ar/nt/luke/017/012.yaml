lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: وبينما كان يدخل
  rationale: ينقل تركيب المضاف المطلق مع اسم الفاعل المضارع معنى التزامن واستمرار فعل الدخول، من غير تحويله إلى حدث لحظي مكتمل.
- source_word: εἴς τινα κώμην
  choice: قريةً ما
  rationale: تحفظ «ما» دلالة τινα التنكيرية من غير أن توحي بأن للقرية هوية معلومة للقارئ.
- source_word: ἀπήντησαν
  choice: لاقاه
  rationale: تعبير عربي واضح وموجز يدل على اللقاء، من غير زيادة تفصيل حركي لا يصرّح به السياق.
- source_word: δέκα λεπροὶ ἄνδρες
  choice: عشرة رجال بُرْص
  rationale: يحافظ على الوصف النعتي في اليونانية ولا يحوّله إلى تشخيص طبي حديث دقيق؛ و«بُرْص» جمع «أبرص».
- source_word: οἳ ἔστησαν
  choice: فوقفوا
  rationale: ينقل الفعل ببساطة ويصل الجملة بالفعل السابق اتصالًا طبيعيًا في العربية، من غير تفسير الوقوف بأنه توقف بعد حركة.
- source_word: πόρρωθεν
  choice: على مسافةٍ منه
  rationale: تعبير عربي معاصر واضح يفيد الانفصال المكاني، مع إظهار المرجع المفهوم من السياق.
theological_decisions:
- issue: دلالة وصف λεπροί
  choice: رجال بُرْص
  alternative: رجال مصابون بالبرص
  rationale: الصياغة المختارة تحافظ على كون اللفظ اليوناني وصفًا نعتيًا، ولا تساوي تلقائيًا بين الفئة الجلدية القديمة وتشخيص طبي حديث بعينه.
