  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: ar
  text: 'بل ألن يقول له: «أَعِدَّ لي ما أتعشّى به، وشُدَّ ثيابك للخدمة[a] واخدمني حتى آكل وأشرب[b]، وبعد ذلك تأكل وتشرب أنت»؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «تمنطق»، أي اجمع ثيابك واربطها استعدادًا للخدمة.'
    reason: cultural_note
  - marker: b
    text: 'يمكن أيضًا: «حتى أكون قد أكلت وشربت»، لإبراز اكتمال أكل السيد وشربه قبل دور الآخر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: بل ألا
  rationale: تُبرز «بل» الانتقال المناقض في السياق، وتفيد «ألا» أن السؤال البلاغي يتوقع جوابًا بالإيجاب.
- source_word: ἐρεῖ αὐτῷ
  choice: يقول له
  rationale: ترجمة مباشرة تحافظ على فعل القول وعلى المفعول غير المباشر الصريح.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: أَعِدَّ لي ما أتعشّى به
  rationale: تنقل صيغة الأمر ومعنى إعداد ما سيتناوله المتكلم في وجبة المساء، من غير تحويل المفعول المبهم إلى اسم طبق محدد.
- source_word: περιζωσάμενος
  choice: شُدَّ ثيابك للخدمة
  rationale: توضح الصورة الثقافية، أي جمع الثياب وشدها استعدادًا للعمل، بلغة عربية مفهومة مع إبقاء الصورة في الحاشية.
- source_word: διακόνει μοι
  choice: اخدمني
  rationale: السياق هو خدمة المائدة، و«اخدمني» واضحة ولا تُضفي على الفعل دلالة كنسية.
- source_word: ἕως φάγω καὶ πίω
  choice: حتى آكل وأشرب
  rationale: تحافظ على بساطة الصياغة اليونانية وعلى الغاية الزمنية؛ ويُذكر احتمال إبراز اكتمال الفعل في الحاشية.
- source_word: μετὰ ταῦτα
  choice: بعد ذلك
  rationale: تعبير زمني عربي طبيعي ودقيق.
- source_word: φάγεσαι καὶ πίεσαι σύ
  choice: تأكل وتشرب أنت
  rationale: تحافظ صيغة المستقبل المفهومة من السياق على ترتيب الحدثين، ويعكس الضمير المنفصل «أنت» توكيد σύ الصريح.
theological_decisions:
- issue: تسمية الدور الاجتماعي في المثل
  choice: إبقاء المرجع ضميرًا من غير إدخال «الخادم» أو «العبد» في هذه الآية
  alternative: إضافة «ذلك العبد» أو «الخادم» للتوضيح
  rationale: تستعمل الآية نفسها الضمائر والأوامر ولا تكرر اسم δοῦλος الوارد في السياق السابق؛ لذلك يحافظ النص على ما هو مصرح به من غير إخفاء علاقة الآمر بالمأمور.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعملت «ما أتعشّى به» لتعكس τί δειπνήσω طبيعيًا، وأُبقي توكيد «أنت» في ختام العبارة. جميع علامات الحواشي مثبتة في المتن.
