  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: ar
  text: 'فأجابوه قائلين: «أين يا رب؟» فقال لهم: «حيث يكون الجسد[a]، هناك أيضًا ستجتمع النسور[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «الجسد» بـ«الجثة»، فيصبح مشهد الطيور التي تقتات من الجيف أكثر صراحة.
    reason: lexical_alternative
  - marker: b
    text: أو «العقبان». يمكن للكلمة اليونانية أن تدل على العقبان، لكن سياق تجمّع الطيور حول جسد يرجّح هنا معنى النسور التي تقتات من الجيف.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: فأجابوا
  rationale: ينقل اسم الفاعل الدال على الرد بصيغة فعلية طبيعية في السرد العربي، من غير إضافة تفسير لهوية المتكلمين أو مقصد سؤالهم.
- source_word: λέγουσιν
  choice: وقالوا له
  rationale: صيغ المضارع التاريخي في اليونانية بصيغة الماضي المناسبة للسرد العربي، مع إبقاء فعل القول صريحًا.
- source_word: Ποῦ
  choice: أين
  rationale: ينقل سؤال المكان بإيجاز مباشر كما في اليونانية.
- source_word: κύριε
  choice: يا رب
  rationale: «رب» هو المقابل العربي المألوف للقب κύριος في خطاب يسوع، وأداة النداء تجعل العبارة طبيعية.
- source_word: Ὅπου
  choice: حيث
  rationale: تحافظ على الصياغة المَثَلية العامة من غير أن تضيف معنى تفسيريًا.
- source_word: σῶμα
  choice: الجسد
  rationale: هو المقابل المباشر المعتاد لـσῶμα، بينما يوحي السياق بأنه جسد ميت؛ لذلك ذُكر «الجثة» بديلًا في الحاشية بدل إدخاله في المتن.
- source_word: ἀετοὶ
  choice: النسور
  rationale: تلائم صورة الطيور التي تتجمع حول جسد، مع إبقاء «العقبان» بوصفه البديل المعجمي الممكن في الحاشية.
- source_word: ἐπισυναχθήσονται
  choice: ستُجمع
  rationale: تحافظ على المستقبل المبني للمجهول في اليونانية وعلى النبرة المَثَلية، من غير تعيين الجهة التي تجمعها.
theological_decisions:
- issue: دلالة المثل المتعلق بالجسد والنسور
  choice: إبقاء الصورة كما وردت من غير تعيين مرجعها
  alternative: تفسيرها صراحةً على أنها الدينونة الأخيرة، أو الجيوش الغازية، أو مبدأ عام لحتمية انكشاف الدينونة
  rationale: النص اليوناني لا يحدد مرجع الصورة، ولذلك يحفظ المتن غموضها وتوترها اللاهوتي ولا يحسم الخلاف التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظ الإيجاز والبناء المَثَلي، ووُضعت علامتا الحاشيتين بجوار اللفظين اللذين تتعلقان بهما مباشرة.
