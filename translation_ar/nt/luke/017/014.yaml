  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: ar
  text: 'فلما رآهم قال لهم: «اذهبوا وأروا أنفسكم للكهنة».[a] وفيما هم ذاهبون، طُهِّروا.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان عرض النفس على الكهنة مرتبطًا بالفحص الكهنوتي المقرر لمن طَهُر من مرض جلدي؛ انظر اللاويين 14.
    reason: cross_reference
  - marker: b
    text: 'أو: «صاروا طاهرين». يمكن أن يدل الفعل اليوناني على التطهير من الناحيتين الجسدية والشعائرية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: فلما رآهم
  rationale: اسم الفاعل الماضي من ὁράω مرتبط بالفعل εἶπεν، فصيغ بعبارة زمنية عربية طبيعية، وأُظهر ضمير الجمع المفهوم من السياق.
- source_word: Πορευθέντες
  choice: اذهبوا
  rationale: اسم فاعل ماضٍ يؤدي هنا وظيفة الأمر مع ἐπιδείξατε؛ وصيغة الأمر العربية تنقل المعنى بوضوح وطبيعية.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: أروا أنفسكم
  rationale: ترجمة مباشرة واضحة في سياق عرض أنفسهم على الكهنة للفحص، من غير زيادة تفسيرية في المتن.
- source_word: τοῖς ἱερεῦσιν
  choice: للكهنة
  rationale: حُفظ التعريف، والإحالة إلى الكهنة المختصين بالفحص بحسب الشريعة.
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: وفيما هم ذاهبون
  rationale: تنقل العبارة تزامن التطهير مع ذهابهم، وتحافظ على السرد الطبيعي دون إثقاله بترجمة حرفية لـ ἐγένετο.
- source_word: ἐκαθαρίσθησαν
  choice: طُهِّروا
  rationale: البناء للمجهول يحفظ صيغة اليونانية، و«طُهِّروا» يستوعب التعافي الجسدي والطهارة الشعائرية، بخلاف «شُفوا» التي تضيق الدلالة.
theological_decisions:
- issue: دلالة التطهير في سياق المرض الجلدي والفحص الكهنوتي
  choice: طُهِّروا
  alternative: شُفوا / صاروا طاهرين
  rationale: الفعل καθαρίζω يحمل هنا تداخل التعافي الجسدي والطهارة الشعائرية؛ فاختير لفظ يحفظ البعدين ولا يحسم الدلالة في أحدهما وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أروا أنفسكم» لبساطته ومباشرته، و«طُهِّروا» للحفاظ على التوتر الدلالي بين الشفاء والطهارة الشعائرية. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرهما كل حاشية، إذ يبدو أن ترتيب علامتي الحواشي في طبقة الاستشارة الإنجليزية لا يطابق مضمونهما.
