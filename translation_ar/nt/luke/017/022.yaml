  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: ar
  text: 'ثم قال للتلاميذ: «ستأتي أيام تشتهون فيها أن تروا يومًا واحدًا من أيام ابن الإنسان[a]، ولن تروه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير عبارة «أيام ابن الإنسان» إلى زمن حضوره وعمله، أو، على نحو أخص، إلى ظهوره في المستقبل؛ والصياغة اليونانية تترك مدى الإشارة مفتوحًا.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: ثم قال
  rationale: تؤدي «ثم» وظيفة δέ بوصفها رابطًا سرديًا خفيفًا يدفع الكلام إلى الأمام من غير أن يضيف مقابلة قوية.
- source_word: πρὸς τοὺς μαθητάς
  choice: للتلاميذ
  rationale: يحافظ التعبير على أداة التعريف في اليونانية من غير إضافة ضمير ملكية غير مذكور صراحة.
- source_word: Ἐλεύσονται ἡμέραι ὅτε
  choice: ستأتي أيام تشتهون فيها
  rationale: صياغة عربية طبيعية تحفظ التعبير النبوي المستقبلي، وتؤدي ὅτε بصلة زمنية واضحة.
- source_word: ἐπιθυμήσετε
  choice: تشتهون
  rationale: الفعل يدل على رغبة قوية؛ و«تشتهون» فصيحة ومباشرة وتحفظ شدة التطلع في السياق.
- source_word: μίαν τῶν ἡμερῶν
  choice: يومًا واحدًا من أيام
  rationale: 'تحفظ البنية التبعيضية والتوكيد العددي: يوم واحد ضمن مجموعة الأيام.'
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: ترجمة حرفية للقب تحافظ على صداه الكتابي والدانيالي من غير تفسيره داخل المتن.
- source_word: ἰδεῖν
  choice: أن تروا
  rationale: ترجمة واضحة وطبيعية للمصدر المتمم لفعل الاشتهاء.
- source_word: καὶ οὐκ ὄψεσθε
  choice: ولن تروه
  rationale: تحفظ الواو قوة καί من غير تحويلها إلى استدراك صريح، ويعود الضمير على اليوم الواحد المذكور.
theological_decisions:
- issue: مدلول «أيام ابن الإنسان»
  choice: الإبقاء على العبارة الواسعة ذات الشحنة الأخروية من غير قصرها على مرحلة واحدة
  alternative: أيام حضور يسوع الأرضي مع تلاميذه فقط، أو زمن ظهوره ودينونته في المستقبل فقط
  rationale: تسمح الصياغة اليونانية بأن تستحضر حضور ابن الإنسان وعمله، كما تسمح بإحالة أخص إلى ظهوره المستقبلي في سياق المقطع؛ لذلك لا يحسم المتن هذا التوتر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «ستأتي أيام» للمحافظة على النبرة النبوية، و«ابن الإنسان» بوصفه لقبًا كتابيًا ثابتًا. وُضع مؤشر الحاشية بعد العبارة التي تشرحها مباشرة.
