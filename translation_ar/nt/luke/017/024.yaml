  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: ar
  text: لأنه كما أن البرق، حين يبرق من جهةٍ تحت السماء إلى جهةٍ أخرى تحت السماء[a]، يلمع، هكذا سيكون ابن الإنسان في يومه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصياغة عربية أكثر سلاسة: «من أحد أطراف السماء إلى طرفها الآخر». واليونانية تكرر حرفيًا عبارة «تحت السماء» في شطري التعبير.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في اليوم الخاص به». تشير العبارة إلى الزمن المرتبط بابن الإنسان، وقد أُبقي معناها واسعًا كما في الأصل.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: لأنه كما أن
  rationale: يحفظ «لأن» القوة التفسيرية لـγάρ، وتُنشئ «كما أن» المقارنة التي تبدأ بها ὥσπερ بصياغة عربية واضحة.
- source_word: ἡ ἀστραπὴ ἀστράπτουσα
  choice: البرق، إذ يبرق
  rationale: يحافظ على الصلة الاشتقاقية والتصوير الحي في الاسم والفعل اليونانيين، من غير تكرار ثقيل في العربية.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν ... εἰς τὴν ὑπ’ οὐρανόν
  choice: من جهةٍ تحت السماء إلى جهةٍ أخرى تحت السماء
  rationale: يُظهر الانتقال من جهة إلى أخرى ويحفظ تكرار عبارة «تحت السماء» في شطري التعبير، كما في اليونانية.
- source_word: λάμπει
  choice: يلمع
  rationale: يميّز هذا الفعل من «يبرق» الذي ترجم ἀστράπτουσα، محافظًا على استعمال فعلين متقاربين غير متطابقين.
- source_word: οὕτως ἔσται
  choice: هكذا يكون
  rationale: ينقل نتيجة التشبيه وصيغة المستقبل بحسب السياق، بصياغة عربية طبيعية.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الترجمة العربية الراسخة والشفافة لهذا اللقب، من غير تفسير أو إعادة صياغة.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: في يومه
  rationale: يحفظ حرف الجر والقوة الإضافية للضمير، ويترك دلالة الزمن المرتبط بابن الإنسان واسعة كما هي في النص.
theological_decisions:
- issue: دلالة «ابن الإنسان ... في يومه» في السياق الأخروي
  choice: في يومه
  alternative: عند مجيئه؛ في يوم الدينونة؛ في يوم ابن الإنسان
  rationale: النص اليوناني يذكر «في يومه» فقط؛ لذلك لا تُزاد إليه هوية الحدث أو طبيعته على نحو يحسم ما تركه النص واسعًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ تكرار «تحت السماء» والتمايز بين «يبرق» و«يلمع»، مع وضع علامتي الحاشيتين في موضعيهما من المتن.
