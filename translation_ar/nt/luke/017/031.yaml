  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: ar
  text: في ذلك اليوم، مَن كان على سطح البيت[a] وأمتعته في داخله، فلا ينزل ليأخذها؛ وكذلك مَن كان في الحقل، فلا يرجع إلى ما وراءه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان سطح البيت في ذلك الزمان مستويًا في العادة، ويمكن الوصول إليه واستخدامه.
    reason: cultural_note
  - marker: b
    text: 'أو بسلاسة أكثر: «فلا يرجع إلى ما تركه وراءه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: في ذلك اليوم
  rationale: تعبير زمني عربي طبيعي يحفظ الإشارة والتوكيد في اليونانية.
- source_word: ὃς ἔσται
  choice: مَن كان
  rationale: ينقل المعنى التعميمي وصيغة الاستقبال في السياق من غير إثقال العبارة.
- source_word: ἐπὶ τοῦ δώματος
  choice: على سطح البيت
  rationale: يدل δῶμα هنا على السطح المستوي القابل للاستعمال، وإضافة «البيت» تمنع فهمه على أنه أي سطح عام.
- source_word: τὰ σκεύη αὐτοῦ
  choice: أمتعته
  rationale: تشمل الأشياء والمقتنيات القابلة للأخذ، وهي أوضح وأوجز في هذا السياق من «أدواته».
- source_word: μὴ καταβάτω
  choice: فلا ينزل
  rationale: صيغة نهي عربية مباشرة تحفظ قوة الأمر المنفي في اليونانية.
- source_word: ἆραι αὐτά
  choice: ليأخذها
  rationale: تنقل غرض النزول واسترجاع الأمتعة من داخل البيت من غير زيادة تفسيرية غير لازمة.
- source_word: ὁ ἐν ἀγρῷ
  choice: مَن كان في الحقل
  rationale: صياغة تمثيلية طبيعية توازي الشطر الأول.
- source_word: ὁμοίως
  choice: وكذلك
  rationale: تحفظ الصلة والموازاة بين النهيين بعبارة عربية مألوفة.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: فلا يرجع إلى ما وراءه
  rationale: يحفظ فعل الرجوع والعبارة الاسمية المبهمة نسبيًا τὰ ὀπίσω، من غير حصرها صراحة في الممتلكات المتروكة.
theological_decisions:
- issue: إلحاح المشهد الأخروي
  choice: 'الإبقاء على النهيين الحسيين: عدم النزول وعدم الرجوع'
  alternative: تحويلهما إلى تحذير عام من التعلق بالممتلكات
  rationale: النص يرسم موقفًا عمليًا محددًا مرتبطًا بـ«ذلك اليوم»؛ والإبقاء على صورته الملموسة يحفظ إلحاحه ولا يضيف تعميمًا وعظيًا.
- issue: مرجع εἰς τὰ ὀπίσω
  choice: 'إبقاء العبارة مفتوحة: «إلى ما وراءه»'
  alternative: تحديدها بـ«ليأخذ ما تركه وراءه» أو اختزالها إلى «فلا يرجع»
  rationale: العبارة اليونانية توحي بما هو خلف الشخص، لكنها لا تسمي الممتلكات صراحة؛ لذا تحفظ الترجمة قدرًا من الغموض مع بيان المعنى السلس في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع نهي مباشر وموازاة إيقاعية بين شطري الآية. وُضعت علامتا الحاشيتين في المتن كما هو مطلوب.
