  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: ar
  text: 'وقال الرسل للرب: «زِدْ[a] إيماننا[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أضِفْ لنا إيمانًا». الفعل اليوناني يعني حرفيًا «أضِفْ»، لكنه في هذا السياق يفيد «زِدْ».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا فهم «الإيمان» بمعنى «الثقة»؛ ومن معاني الكلمة في بعض السياقات «الأمانة»، لكن هذا المعنى أقل احتمالًا هنا.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: حرف عطف يحافظ على اتصال السرد البسيط من غير إضافة دلالة زمنية غير مصرّح بها.
- source_word: εἶπαν
  choice: قال
  rationale: صيغة الماضي اليونانية هنا تُنقل طبيعيًا بفعل ماضٍ سردي بسيط، ومع الفاعل الجمع المتأخر يأتي الفعل مفردًا في العربية الفصحى.
- source_word: οἱ ἀπόστολοι
  choice: الرسل
  rationale: هو التعبير العربي الكتابي المألوف والدقيق لجماعة الذين أرسلهم يسوع، وهو أوضح وأفصح هنا من ترجمة اشتقاقية مثل «الموفدين».
- source_word: τῷ κυρίῳ
  choice: للرب
  rationale: ينقل لقب κύριος الموجَّه إلى يسوع ويحفظ ما فيه من معنى المخاطبة الموقرة والرنين المسيحاني، بخلاف «السيد» التي قد تضعف هذا الرنين.
- source_word: Πρόσθες
  choice: زِدْ
  rationale: الفعل يعني حرفيًا «أضِف»، لكنه مع «الإيمان» يفيد اصطلاحيًا طلب الزيادة؛ و«زِدْ إيماننا» عربية طبيعية وموجزة.
- source_word: ἡμῖν
  choice: ـنا في «إيماننا»
  rationale: 'الداتيف اليوناني يعني حرفيًا «لنا»، لكن العربية الطبيعية مع «زِدْ» تصوغ الطلب بضمير الملكية: «زِدْ إيماننا».'
- source_word: πίστιν
  choice: إيماننا
  rationale: «الإيمان» هو المقابل العربي الراسخ لـ πίστις، والسياق يرجّح معنى الإيمان أو الثقة أكثر من معنى الأمانة.
theological_decisions:
- issue: ترجمة κύριος في الإشارة إلى يسوع
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ اللقب المتعارف عليه في سياق لوقا وما يحمله من وزن مسيحاني، مع بقاء معنى المخاطبة الموقرة.
- issue: مدلول πίστις
  choice: الإيمان
  alternative: الثقة؛ والأمانة في سياقات أخرى
  rationale: السياق يتحدث على الأرجح عن مقدار إيمان الرسل أو ثقتهم، لكن الحاشية تحفظ المجال الدلالي للكلمة من غير حسم زائد.
- issue: موضع علامتي الحاشية
  choice: بعد الجملة المقتبسة بالترتيب [a][b]
  alternative: إلحاق [a] بالفعل و[b] بكلمة الإيمان
  rationale: إبقاؤهما في ختام الآية يحافظ على نص عربي سلس، مع بيان البديل المعجمي للفعل ثم المجال الدلالي للاسم في الحواشي.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُخدمت الصياغة المألوفة «زِدْ إيماننا» مع حاشية تحفظ البنية الحرفية «أضِفْ لنا إيمانًا»، من غير تسوية المجال الدلالي لكلمة πίστις أو فرض قراءة مذهبية.
