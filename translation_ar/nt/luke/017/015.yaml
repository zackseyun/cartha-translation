base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: ar
  text: لكن واحدًا منهم، إذ رأى أنه قد شُفي، رجع وهو يمجِّد الله بصوت عالٍ،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: أما واحدٌ منهم
  rationale: يحافظ على معنى التبعيض في «واحد منهم»، وينقل δέ انتقالًا يتضمن مقابلة سردية لطيفة من غير مبالغة في معنى الاستدراك.
- source_word: ἰδὼν ὅτι ἰάθη
  choice: فلما رأى أنه قد شُفي
  rationale: تفيد «لما» أن إدراكه للشفاء سبق رجوعه مباشرة، و«قد شُفي» تنقل تمام الفعل المبني للمجهول بعبارة عربية طبيعية.
- source_word: ὑπέστρεψεν
  choice: رجع
  rationale: ترجمة موجزة وطبيعية لمعنى العودة في السياق السردي.
- source_word: μετὰ φωνῆς μεγάλης
  choice: بصوت عالٍ
  rationale: هذا هو المقابل العربي الاصطلاحي الطبيعي للتعبير اليوناني، بدلًا من الترجمة الحرفية «بصوت عظيم».
- source_word: δοξάζων τὸν θεόν
  choice: وهو يمجِّد الله
  rationale: يحفظ المعنى الأساسي للفعل δοξάζω وصلته بالمجد، كما أن تركيب الحال ينقل وظيفة اسم الفاعل اليوناني أثناء الرجوع.
theological_decisions:
- issue: ترجمة τὸν θεόν
  choice: الله
  alternative: الإله
  rationale: «الله» هو المقابل العربي المألوف والدقيق في هذا السياق، ولا يضيف أي تحديد عقائدي غير موجود في النص.
- issue: دلالة δοξάζων
  choice: يمجِّد
  alternative: يسبِّح / يحمد
  rationale: «يمجِّد» يحافظ على الدلالة المباشرة المتعلقة بإعطاء المجد لله، من غير حصرها في التسبيح أو الحمد وحدهما.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم «أما» لإبراز المقابلة السردية، و«وهو يمجِّد» للحفاظ على تزامن التمجيد مع الرجوع. لا توجد حاشية لازمة؛ فالبديل الدلالي لـδοξάζω يمكن تمثيله بدقة في المتن بلفظ «يمجِّد».
