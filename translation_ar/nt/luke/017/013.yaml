lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يحفظ تتابع السرد من غير إضافة دلالة زمنية غير صريحة.
- source_word: αὐτοὶ
  choice: واو الجماعة في «رفعوا»
  rationale: الضمير اليوناني صريح وفيه شيء من التوكيد، لكن العربية الطبيعية تستغني هنا عن «هم أنفسهم»، ويبيّن الفعل المسند إلى الجماعة الفاعل بوضوح.
- source_word: ἦραν φωνὴν
  choice: رفعوا أصواتهم
  rationale: تعبير عربي طبيعي يحفظ صورة رفع الصوت ويفيد النداء بصوت عالٍ؛ وجاء الجمع موافقةً للاستعمال العربي مع تعدد المتكلمين.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحفظ هيئة اسم الفاعل في الأصل، ويرتبط بسلاسة بعبارة «رفعوا أصواتهم».
- source_word: Ἰησοῦ
  choice: يا يسوع
  rationale: الاسم في صيغة النداء، وإظهار أداة النداء طبيعي وواضح في العربية.
- source_word: ἐπιστάτα
  choice: يا معلّم
  rationale: لقب نداء يدل على صاحب سلطة وقيادة. «معلّم» لفظ عربي مألوف لمخاطبة يسوع ويحفظ تميّزه عن «الرب» المترجمة عادةً عن κύριος، مع إيضاح مجال المعنى في الحاشية.
- source_word: ἐλέησον
  choice: ارحمنا
  rationale: أمر التماس عاجل يطلب الرحمة والتدخل المشفق، وصيغة «ارحمنا» موجزة وطبيعية وراسخة في العربية.
- source_word: ἡμᾶς
  choice: نا في «ارحمنا»
  rationale: ضمير المفعول المتصل ينقل المفعول به اليوناني بأوجز صياغة عربية طبيعية.
theological_decisions:
- issue: ترجمة لقب ἐπιστάτα الموجَّه إلى يسوع
  choice: يا معلّم
  alternative: يا ربّ
  rationale: الأصل يستعمل ἐπιστάτης لا κύριος؛ لذلك تجنبت «يا ربّ» كيلا يُطمس الفرق المعجمي أو تُضاف إلى اللفظ دلالة لاهوتية أقوى مما يقتضيه هذا اللقب نفسه. وتوضح الحاشية أن المقصود صاحب سلطة وقيادة.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وكريمة النبرة. استُعمل «أصواتهم» بدل المفرد الحرفي لأن هذا هو التعبير العربي الطبيعي لجماعة، مع حفظ الصورة الأصلية وشرحها في الحاشية. تكرار «يا» قبل اللقب يوضح النداء ويجعل العبارة سلسة في العربية.
