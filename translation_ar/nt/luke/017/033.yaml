base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: ar
  text: مَن سعى إلى أن يحتفظ بحياته يفقدها، وأمّا مَن يفقدها فيُبقيها حيّة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «حياته» بـ«نفسه»، وترجمة «فيُبقيها حيّة» بـ«فيصونها حيّة»؛ فالفعل اليوناني يعني إبقاءها على قيد الحياة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: سعى
  rationale: يفيد الفعل هنا القصد والجهد المتعمّد، لا مجرد الرغبة؛ و«سعى» تعبير عربي طبيعي يحفظ هذه الدلالة.
- source_word: ψυχὴν
  choice: حياته
  rationale: السياق يتناول فقدان الإنسان حياته أو إبقاءها في زمن الدينونة، ولذلك فـ«الحياة» أنسب من «النفس» مع إمكان الدلالة البديلة المذكورة في الحاشية.
- source_word: περιποιήσασθαι
  choice: أن يحتفظ
  rationale: صيغة الوسط تدل على الاحتفاظ بالشيء أو تأمينه للذات؛ و«يحتفظ بحياته» واضحة وطبيعية في العربية.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: يفقدها / يفقدها
  rationale: يحفظ تكرار اللفظ في اليونانية والمفارقة المقصودة في القول دون إضافة تفسيرية.
- source_word: ζῳογονήσει
  choice: فيُبقيها حيّة
  rationale: الفعل يعني حرفيًا إبقاء الشيء حيًا أو صونه حيًا، وهذه الصياغة تحافظ على صورته اللفظية بدل تسويته بالفعل المعتاد «يخلّص».
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: مَن ... وأمّا مَن
  rationale: تنقل الشرط العام وتُظهر المقابلة التي تؤديها δέ بصياغة عربية فصيحة واضحة.
theological_decisions:
- issue: دلالة ψυχή في هذا القول المتناقض ظاهريًا
  choice: الحياة
  alternative: النفس
  rationale: يركّز السياق على محاولة الإنسان الاحتفاظ بحياته وعلى فقدانها، ولا يقتضي حصر الكلام في النفس غير المادية. تحافظ «الحياة» على قوة القول الوجودية دون فرض ثنائية جسد ونفس.
- issue: ترجمة ζῳογονήσει
  choice: فيُبقيها حيّة
  alternative: يخلّصها؛ يصونها
  rationale: ليس هذا هو الفعل اليوناني المعتاد للخلاص، بل يدل على إبقاء الحياة؛ لذا تحافظ الترجمة الشفافة على التوتر اللفظي بين الفقد والحياة.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدمت «وأمّا» لإبراز المقابلة، وحُفظت المفارقة الأصلية من غير شرح داخل المتن.
