  text: Remember Lot's wife[a][b].
translation:
  language: ar
  text: اذكروا زوجة لوط.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'إشارة إلى تكوين 19: 26، حيث نظرت زوجة لوط إلى الوراء أثناء هلاك سدوم.'
    reason: cross_reference
lexical_decisions:
- source_word: μνημονεύετε
  choice: اذكروا
  rationale: فعل أمر مضارع موجَّه إلى الجمع، و«اذكروا» تنقل الأمر المباشر الموجز بصورة طبيعية في العربية، من غير تحميل صيغة المضارع معنى زائدًا.
- source_word: τῆς γυναικὸς
  choice: زوجة
  rationale: يمكن أن تعني γυνή «امرأة» أو «زوجة»، لكن إضافتها هنا إلى اسم لوط تدل بوضوح على العلاقة الزوجية. وصيغة «زوجة لوط» عربية طبيعية وتحافظ على تركيب الإضافة.
- source_word: Λώτ
  choice: لوط
  rationale: نقل الاسم وفق صيغته العربية الكتابية المستقرة.
theological_decisions:
- issue: صيغة التحذير والإشارة إلى رواية التكوين
  choice: اذكروا زوجة لوط.
  alternative: اذكروا امرأة لوط.
  rationale: 'يحافظ النص على أمر يسوع الموجز وإحالته التحذيرية إلى تكوين 19: 26. واختيار «زوجة» يبيّن العلاقة المقصودة في السياق من غير إضافة تفسير إلى المتن.'
translation_notes:
  register: عربية فصحى معاصرة، واضحة وموجزة وذات نبرة تحذيرية مباشرة. لم تُضف حاشية لبديل حرفي على غرار «امرأة لوط»، لأن «زوجة لوط» نفسها تحافظ على الإضافة اليونانية طبيعيًا، بينما البديل قد يوهم بمعنى غير مقصود.
