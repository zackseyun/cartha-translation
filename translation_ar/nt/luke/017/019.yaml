lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: وقال له
  rationale: صياغة سردية عربية طبيعية وأمينة للفعل وضمير المجرور، من غير إضافة تفسيرية.
- source_word: Ἀναστὰς
  choice: قُمْ
  rationale: اسم فاعل ماضٍ يؤدي وظيفة الأمر مع الفعل التالي؛ و«قُمْ» يحفظ الإيجاز والقوة والنبرة الوقورة.
- source_word: πορεύου
  choice: اذهب
  rationale: أمر واضح وطبيعي في العربية، ولا يحتاج إلى زيادة مثل «في طريقك».
- source_word: πίστις
  choice: إيمانك
  rationale: «الإيمان» هو المقابل المعتاد هنا، مع إمكان دلالة اللفظة على الثقة؛ وقد حُفظ هذا الاحتمال في الحاشية.
- source_word: σέσωκέν σε
  choice: قد خلَّصك
  rationale: يحفظ المجال الأوسع للفعل σῴζω وصيغة التام الدالة على نتيجة قائمة، ولا يحصر القول في الشفاء الجسدي وحده.
theological_decisions:
- issue: دلالة σέσωκέν σε في سياق الشفاء
  choice: قد خلَّصك
  alternative: قد شفاك / قد عافاك
  rationale: يمكن أن يدل الفعل على الشفاء أو الإنقاذ أو الخلاص. ولأن العشرة جميعًا طُهِّروا بينما عاد هذا الرجل ممجِّدًا الله، تُبقي «خلَّصك» التوتر الدلالي واللاهوتي بدل اختزاله في التعافي الجسدي.
- issue: دلالة πίστις
  choice: إيمانك
  alternative: ثقتك
  rationale: «الإيمان» هو المقابل الافتراضي الأنسب في هذا السياق، مع الإقرار بأن «الثقة» احتمال لغوي معتبر؛ أما «الأمانة» فأبعد هنا.
