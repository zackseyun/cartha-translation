  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: ar
  text: انتبهوا لأنفسكم. إن أخطأ أخوك[b]، فوبِّخه[a]، وإن تاب، فاغفر له.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «إن أخطأ أخوك في حقك، فوبِّخه».'
    reason: textual_variant
  - marker: b
    text: كلمة «أخوك» مفرد مذكر في اليونانية، وقد يُراد بها هنا، على نحو أوسع، أحد رفقاء التلمذة.
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε
  choice: انتبهوا
  rationale: فعل أمر مضارع يفيد اليقظة المستمرة؛ و«انتبهوا» تعبير عربي واضح يحفظ قوة التحذير.
- source_word: ἑαυτοῖς
  choice: لأنفسكم
  rationale: يحفظ دلالة ضمير الانعكاس، مع إبقاء احتمال مراقبة كل واحد لنفسه والتنبه داخل الجماعة.
- source_word: ἁμάρτῃ
  choice: أخطأ
  rationale: النص اليوناني الأقصر لا يذكر مفعولًا مثل «إليك»، لذلك لا تُحصر الخطيئة في الإساءة الشخصية. و«أخطأ» طبيعي في هذا التركيب الشرطي.
- source_word: ὁ ἀδελφός σου
  choice: أخوك
  rationale: ينقل صيغة المفرد المذكر في اليونانية بدقة؛ وقد يكون المراد في السياق أخًا في جماعة التلاميذ، وهو موضح في الحاشية.
- source_word: ἐπιτίμησον αὐτῷ
  choice: فوبِّخه
  rationale: ينقل أمرًا مباشرًا بالزجر والتصحيح، من غير تلطيفه إلى مجرد النصح.
- source_word: μετανοήσῃ
  choice: تاب
  rationale: «تاب» هو المقابل العربي المألوف في السياق الأخلاقي والروحي، ويحفظ معنى الرجوع عن الخطيئة.
- source_word: ἄφες αὐτῷ
  choice: فاغفر له
  rationale: في هذا السياق العلاقي يدل الفعل على الغفران، وهذه الصياغة هي الأوضح والأطبع عربيًا.
theological_decisions:
- issue: هل تُضاف عبارة «إليك» بعد «أخطأ»؟
  choice: حذف «إليك» من المتن
  alternative: إن أخطأ إليك أخوك، فوبخه...
  rationale: نص SBLGNT المعطى يقرأ ἐὰν ἁμάρτῃ ὁ ἀδελφός σου من دون εἰς σέ أو ما يعادلها، لذا يحافظ المتن على المعنى الأوسع، وتُذكر القراءة الأطول في الحاشية.
- issue: صياغة ἀδελφός من جهة الجنس والدلالة الجماعية
  choice: أخوك
  alternative: أخوك أو أختك / أحد إخوتك في الإيمان
  rationale: اللفظ اليوناني مفرد مذكر، فحُفظ في المتن، مع بيان احتمال دلالته الأوسع على أحد رفقاء التلمذة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت أفعال موجزة مباشرة تحفظ تتابع الأوامر والشروط في اليونانية. وُضعت علامتا الحاشيتين عند ختام الآية لأن الأولى تتعلق بصياغة جملة الشرط، والثانية تشرح مدلول «أخوك».
