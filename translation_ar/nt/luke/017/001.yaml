  naturalness: '«لا يمكن ألّا تأتي العثرات» عربية فصيحة واضحة. والأفصح والأكثر سلاسة في الجملة الثانية: «ولكن ويلٌ للذي تأتي العثرات بواسطته»، بدل «ولكن الويل لمن تأتي بواسطته»، إذ يكتمل التركيب الاسمي ويزول أي التباس عابر في مرجع «تأتي».'
  terminology: «العثرات» اختيار جيد يحفظ استعارة σκάνδαλα واتساعها الأخلاقي. لكن إدراج «المعاصي» بديلًا في الحاشية غير دقيق؛ فالكلمة تشير إلى ما يوقع في السقوط أو الخطيئة، لا إلى الخطايا نفسها بالضرورة. يُستبدل ببديل مثل «الإساءات» مع إبقاء البدائل التفسيرية المقيّدة.
