  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: ar
  text: 'ثم قال لتلاميذه: «لا يمكن ألّا تأتي العثرات[a]، ولكن ويلٌ للذي تأتي العثرات بواسطته!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «الإساءات»، أو «أسباب السقوط في الخطيئة»، أو «التجارب المؤدية إلى الخطيئة». وتشير الكلمة اليونانية إلى ما يجعل الناس يتعثرون أخلاقيًا أو روحيًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: ثم قال
  rationale: تفيد δέ هنا ربطًا سرديًا خفيفًا، و«ثم» طبيعية في السياق من غير تشديد على معنى الاستدراك.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: لتلاميذه
  rationale: تنقل μαθητάς بالمصطلح العربي المألوف «تلاميذ»، وتحفظ ضمير الملكية αὐτοῦ.
- source_word: Ἀνένδεκτόν ἐστιν
  choice: لا يمكن
  rationale: تحفظ صيغة الاستحالة في اليونانية، فيما توضّح جملة المصدر المنفي أن المقصود استحالة عدم وقوع العثرات، أي حتمية مجيئها.
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: ألّا تأتي العثرات
  rationale: صياغة عربية واضحة تنقل تركيب المصدر المنفي وتحافظ على صورة مجيء العثرات.
- source_word: σκάνδαλα
  choice: العثرات
  rationale: تحفظ الاستعارة المكانية في اللفظ اليوناني وتشمل ما يوقع الإنسان أخلاقيًا أو روحيًا، من غير حصر المعنى في الإساءة الشعورية أو التجربة وحدها.
- source_word: πλὴν οὐαὶ
  choice: ولكن الويل
  rationale: «ولكن» تنقل التحول من الإقرار بحتمية العثرات إلى إعلان الويل على المتسبب فيها.
- source_word: δι’ οὗ
  choice: لمن ... بواسطته
  rationale: تحفظ الإشارة الشخصية المفردة ومعنى الوساطة الذي تؤديه διά مع المضاف إليه، بصياغة عربية طبيعية.
- source_word: ἔρχεται
  choice: تأتي
  rationale: الفعل مفرد في اليونانية، وفي العربية يجوز إفراد الفعل المتقدم على جمع غير العاقل؛ لذا تلائم «تأتي» «العثرات» وتحفظ صورة الأصل.
theological_decisions:
- issue: الدلالة الأخلاقية والروحية لكلمة σκάνδαλα
  choice: العثرات
  alternative: المعاصي؛ أسباب السقوط في الخطيئة؛ التجارب المؤدية إلى الخطيئة
  rationale: «العثرات» تبقي الاستعارة واتساع الدلالة، فلا تختزل التحذير في مجرد الإساءة إلى المشاعر ولا تحصره في نوع واحد من الإغواء أو السقوط.
- issue: العلاقة بين حتمية مجيء العثرات ومسؤولية المتسبب فيها
  choice: الإبقاء على التوتر بصيغة «لا يمكن ألّا تأتي... ولكن الويل»
  alternative: إعادة الصياغة بما يوحي بأن الحتمية تعفي الفاعل من المسؤولية
  rationale: النص يجمع عمدًا بين حتمية وقوع العثرات وإدانة الشخص الذي تأتي بواسطته، ولا ينبغي للترجمة أن تزيل هذا التوتر اللاهوتي.
- issue: الإشارة الشخصية المفردة في δι’ οὗ
  choice: لمن تأتي بواسطته
  alternative: للرجل الذي تأتي بواسطته؛ للشخص الذي يتسبب فيها
  rationale: تحفظ المفرد الممثل لأي شخص من غير إضافة تخصيص جنسي غير لازم أو تحويل معنى الوساطة إلى تفسير سببي أضيق.
translation_notes:
  register: العربية فصحى معاصرة واضحة وذات نبرة وقورة. اختيرت «العثرات» للمحافظة على الاستعارة الأصلية، واستُعملت «بواسطته» لإبراز معنى δι’ οὗ من غير تفسير زائد.
