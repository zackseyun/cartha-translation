base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: ar
  text: 'أقول لكم: في تلك الليلة يكون اثنان على فراش واحد؛ يُؤخذ أحدهما[a]، ويُترك الآخر[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُصطحَب». لا يحدد الفعل παραλημφθήσεται في هذا الموضع هل الأخذ للنجاة أم للدينونة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يُترك وراءه». استُعملت الصيغة الأقصر «يُترك» في المتن لتجنب إدخال إيحاءات أخروية لاحقة لا يصرح بها النص اليوناني.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: صيغة خطاب مباشرة ومألوفة، تحافظ على دلالة القول المؤكد من غير زيادة تفسيرية.
- source_word: ταύτῃ τῇ νυκτί
  choice: في تلك الليلة
  rationale: تعبير زمني عربي طبيعي يشير إلى ليلة محددة حاضرة في سياق الكلام.
- source_word: ἔσονται δύο
  choice: يكون اثنان
  rationale: يحافظ على صيغة المستقبل وعلى الإشارة إلى شخصين، مع تركيب عربي واضح.
- source_word: ἐπὶ κλίνης μιᾶς
  choice: على فراش واحد
  rationale: κλίνη قد تعني فراشًا أو سريرًا، وسياق الليل يرجح «فراش». كما أن «على» تقابل ἐπί بصورة طبيعية.
- source_word: ὁ εἷς
  choice: أحدهما
  rationale: ينقل المقابلة بين الشخصين بإيجاز عربي طبيعي، تمهيدًا لذكر «الآخر».
- source_word: παραλημφθήσεται
  choice: يُؤخذ
  rationale: صيغة مبني للمجهول موجزة تحفظ معنى الأخذ، ولا تحسم هل هو للنجاة أم للدينونة.
- source_word: ὁ ἕτερος
  choice: الآخر
  rationale: المقابل العربي الطبيعي للشخص الثاني المتميز عن الأول.
- source_word: ἀφεθήσεται
  choice: يُترك
  rationale: السياق والمقابلة مع «يُؤخذ» يدلان على الترك، لا الغفران. والصياغة لا تضيف إيحاءات أخروية غير مصرّح بها.
theological_decisions:
- issue: هل المأخوذ هو الناجي أم الواقع تحت الدينونة؟
  choice: 'يبقى النص محايدًا: «يُؤخذ أحدهما، ويُترك الآخر».'
  alternative: قد يُفهم الأخذ على أنه للنجاة، أو على أنه للدينونة.
  rationale: الفعلان اليونانيان في هذه الآية وحدها لا يحسمان مصير أي من الشخصين، ولذلك تُحفظ دلالة النص المحتملة وتوتره اللاهوتي من غير فرض تصور أخروي بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «فراش» ملاءمةً لسياق الليل، وحُفظ التوازي الإيقاعي بين «يُؤخذ» و«يُترك». وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما.
