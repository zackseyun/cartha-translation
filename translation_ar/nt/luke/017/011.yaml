  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: ar
  text: وفيما كان ذاهبًا إلى أورشليم، حدث أنه كان يمرّ بين السامرة والجليل.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان يمرّ في وسط السامرة والجليل». يمكن أن تُفهم العبارة اليونانية على أنها حركة بين الإقليمين، أو عبر المنطقة الحدودية الفاصلة بينهما.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: حدث أنه
  rationale: صيغة لوقا السردية التي تُدخل الحدث؛ وهذه الصياغة عربية حديثة واضحة بلا مسحة قديمة.
- source_word: ἐν τῷ πορεύεσθαι
  choice: فيما كان ذاهبًا
  rationale: المصدر المعرّف مع ἐν يدل على التزامن والاستمرار، وتنقل الصياغة ذلك طبيعيًا.
- source_word: εἰς Ἰερουσαλήμ
  choice: إلى أورشليم
  rationale: تنقل جهة الرحلة ووجهتها بوضوح، مع استعمال الاسم الكتابي العربي الشائع.
- source_word: αὐτός
  choice: الفاعل المستتر في «كان يمرّ»
  rationale: يبقى مرجع الضمير واضحًا في العربية، ولا يستدعي السياق إبرازًا ثقيلًا مثل «هو نفسه».
- source_word: διήρχετο
  choice: كان يمرّ
  rationale: تنقل صيغة الماضي الناقص بوصفها حركة مستمرة، ولا تحسم وحدها هل المرور داخل المنطقتين أم بمحاذاة الحد بينهما.
- source_word: διὰ μέσον Σαμαρείας καὶ Γαλιλαίας
  choice: بين السامرة والجليل
  rationale: صياغة عربية طبيعية تحافظ على إمكان فهم العبارة اليونانية على أنها مرور في المنطقة الواقعة بين الإقليمين، مع بيان الاحتمال الآخر في الحاشية.
