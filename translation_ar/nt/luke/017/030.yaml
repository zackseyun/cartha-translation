  naturalness: الصياغة «هكذا يكون» ممكنة، لكن إضافة «الأمر» تجعل الحذف الذي في اليونانية عربيًا طبيعيًا وواضحًا. والتعبير «يُكشَف فيه عن ابن الإنسان» أفصح وأدق في الدلالة على انكشافه من «يُعلَن فيه ابن الإنسان».
  terminology: «ابن الإنسان» هو المقابل المستقر والدقيق للقب ὁ υἱὸς τοῦ ἀνθρώπου. ويُستحسن «يُكشَف عن» لـἀποκαλύπτεται لأنه يحفظ معنى الكشف وصيغة المبني للمجهول دون إدخال معنى المجيء. ينبغي أن يوضع مرساة الحاشية بعد «هكذا» لأنها تشرح العبارة المقارِنة κατὰ τὰ αὐτά.
  issues:
