  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: ar
  text: هكذا[a] سيكون الأمر في اليوم الذي يُكشَف فيه عن ابن الإنسان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبالمثل» أو «على النحو نفسه». تشير العبارة اليونانية إلى الأمثلة السابقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: هكذا يكون
  rationale: العبارة الاصطلاحية تحيل إلى أمثلة الأيام السابقة، وتفيد أن الأمر سيكون على النحو نفسه. والصياغة العربية طبيعية وتحفظ قوة المقارنة مع دلالة الاستقبال في ἔσται.
- source_word: ἔσται
  choice: يكون
  rationale: فعل مستقبل من εἰμί؛ يدل هنا على ما سيكون، ويظهر الاستقبال في العربية من السياق الزمني الأخروي.
- source_word: ᾗ ἡμέρᾳ
  choice: في اليوم الذي
  rationale: الداتيف ذو دلالة زمنية، وهذه صياغة عربية واضحة تحدد اليوم الذي يقع فيه الحدث.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب الإنجيلي المعروف وصلته الأخروية والمسيانية بدانيال 7، من غير تحويله إلى شرح تفسيري.
- source_word: ἀποκαλύπτεται
  choice: يُعلَن
  rationale: يحفظ معنى الكشف والظهور العلني وصيغة المبني للمجهول، من غير استبداله بفكرة المجيء التي ليست المعنى المعجمي المباشر للفعل.
theological_decisions:
- issue: ترجمة اللقب الأخروي ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: الصياغة التقليدية تحفظ كونه لقبًا مميزًا في الأناجيل وتحافظ على صلته بدانيال 7، بينما يضعف البديل هذه الصلة.
- issue: دلالة ἀποκαλύπτεται في السياق
  choice: يُعلَن
  alternative: يأتي؛ يظهر
  rationale: الفعل يدل على الكشف أو الإعلان، لا على مجرد المجيء. واختيار «يُعلَن» يحفظ المبني للمجهول والوزن الأخروي من غير زيادة تفسيرية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على وقار اللقب وعلى الإحالة المقارِنة إلى السياق السابق.
