    rationale: الفعل اليوناني ἔσται مستقبل صريح؛ «سيكون» أوضح من «يكون» في العربية الفصحى الحديثة هنا.
  - severity: medium
    issue: اختيار «يُعلَن فيه ابن الإنسان» أضيق وأقل دقة من معنى الكشف
    rationale: قد يدل «يُعلَن» على الإخبار أو التصريح، في حين أن ἀποκαλύπτεται يدل على الانكشاف/الإظهار. «يُكشَف عن ابن الإنسان» طبيعي ويحفظ المقصود دون تفسير زائد.
  - severity: low
