review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: خروج لوط من سدوم، ونزول النار والكبريت من السماء، وهلاك الجميع. لكن تركيب «هطل ... مطرٌ من نار وكبريت» يحوّل الفعل اليوناني المباشر «أمطر/هطل نارًا وكبريتًا» إلى اسم «مطر»، وهو توسع غير لازم وأقل سلاسة في العربية.'
  naturalness: 'الفصحى واضحة في الجملة عمومًا، لكن «هطل من السماء مطرٌ من نار وكبريت» ثقيل نسبيًا؛ والأفصح والأقرب إلى الصورة الأصلية: «هطلت من السماء نارٌ وكبريتٌ».'
  terminology: «لوط»، «سدوم»، «السماء»، و«كبريت» مناسبة ودقيقة. الحاشية المقترحة ليست بديلًا عربيًا تقليديًا مستقرًا؛ فـ«حجر كبريت» ليس المقابل التعبيري المعتاد لـ«brimstone» في هذا السياق، كما أن الترجمة الأساسية تستغني عن الحاشية دون فقدان معنى معجمي.
  issues:
  - severity: low
    issue: إقحام الاسم «مطر» في عبارة «مطرٌ من نار وكبريت».
    rationale: الأصل يستعمل فعل الإمطار/الهطول مع «نار وكبريت» مفعولًا أو موضوعًا للهطول. حذف الاسم الزائد يجعل العربية أقرب إلى الأصل وأكثر طبيعية.
  - severity: low
    issue: الحاشية «نار وحجر كبريت» غير موفقة بوصفها تعبيرًا تقليديًا بديلًا.
    rationale: «حجر الكبريت» ليس الصياغة العربية الكتابية أو الشائعة هنا، ولا تحتاج «كبريت» إلى توضيح معجمي إضافي في النص الحديث.
  revised_text: أمّا في اليوم الذي خرج فيه لوط من سدوم، فهطلت من السماء نارٌ وكبريتٌ، فأهلك الجميع.
