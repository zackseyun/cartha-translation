revisions:
- from: أمّا في اليوم الذي خرج فيه لوط من سدوم، فهطل من السماء مطرٌ من نار وكبريت[a]، فأهلك الجميع.
  to: أمّا في اليوم الذي خرج فيه لوط من سدوم، فهطلت من السماء نارٌ وكبريتٌ، فأهلك الجميع.
  rationale: يحافظ النص المنقح على الغموض القائم في الأصل بشأن الفاعل غير المسمى، وعلى ترتيب الأحداث ومعنى القضاء الشامل، مع استعمال تركيب عربي مباشر لصورة هطول النار والكبريت. حُذفت الحاشية لأن بديلها غير راسخ ولا يضيف توضيحًا دقيقًا.
