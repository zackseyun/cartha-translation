  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: ar
  text: أمّا في اليوم الذي خرج فيه لوط من سدوم، فهطلت من السماء نارٌ وكبريتٌ، فأهلك الجميع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: أمّا في اليوم الذي
  rationale: تؤدي العبارة معنى الزمن «في اليوم الذي»، وتحفظ «أمّا» الانتقال المقارن ذا النبرة التقابلية الخفيفة الذي تفيده δέ في السياق.
- source_word: ἐξῆλθεν
  choice: خرج
  rationale: ترجمة مباشرة لحركة الخروج، من غير توسيعها إلى معنى الرحيل أو الهرب.
- source_word: Λὼτ
  choice: لوط
  rationale: الصيغة العربية الكتابية المستقرة للاسم.
- source_word: ἀπὸ Σοδόμων
  choice: من سدوم
  rationale: صياغة عربية طبيعية لاسم المكان، مع المحافظة على حرف الابتداء.
- source_word: ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ
  choice: فهطل من السماء مطرٌ من نار وكبريت
  rationale: تعيد الصياغة الاسمية إنتاج صورة المطر بصورة عربية طبيعية، من غير إضافة فاعل صريح غير مذكور في اليونانية، وتحافظ على مصدره «من السماء».
- source_word: θεῖον
  choice: كبريت
  rationale: هو المعنى المعجمي الواضح والحديث، خلافًا للتعبير العربي التقليدي «حجر الكبريت» الذي يمكن إيضاحه في الحاشية.
- source_word: ἀπώλεσεν πάντας
  choice: فأهلك الجميع
  rationale: «أهلك» يلائم سياق القضاء التام، و«الجميع» يحفظ شمول πάντας مع بقاء المرجع البشري مفهومًا من السياق.
theological_decisions:
- issue: الفاعل غير المصرح به في فعلي الإمطار والإهلاك
  choice: صياغة الحدث بعبارة «هطل ... مطرٌ ... فأهلك» من غير تسمية فاعل إلهي
  alternative: فأمطر الله نارًا وكبريتًا من السماء وأهلك الجميع
  rationale: يفهم السياق الكتابي القضاء الإلهي، لكن النص اليوناني في هذه الآية لا يذكر «الله» صراحة؛ لذلك لا تضيف الترجمة اسم فاعل يحسم ما تركه التركيب ضمنيًا.
- issue: دلالة οὐρανός
  choice: السماء
  alternative: الجو
  rationale: «السماء» هي المقابل العربي الطبيعي وتحفظ صدى رواية التكوين وصورة القضاء الآتي من فوق من غير شرح عقائدي زائد.
- issue: دلالة θεῖον في سياق القضاء
  choice: كبريت
  alternative: حجر الكبريت
  rationale: «كبريت» واضح للقارئ المعاصر ودقيق معجميًا، بينما تُذكر الصيغة التراثية في الحاشية.
translation_notes:
  register: لغة عربية فصحى واضحة ومهيبة. استُعملت «أمّا» لربط المقارنة بما قبلها، واختير تركيب «هطل ... مطرٌ» لتجنب إدخال فاعل غير مصرح به، مع إبقاء صورة النار والكبريت النازلين من السماء.
