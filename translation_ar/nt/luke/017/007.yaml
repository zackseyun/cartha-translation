  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: ar
  text: '«فمَن منكم له عبدٌ[a] يحرث أو يرعى، يقول له حين يدخل من الحقل: تعال حالًا واتكئ إلى المائدة[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'الكلمة اليونانية تعني عبدًا مملوكًا، ويمكن أن تُترجم بحسب السياق: «خادمًا» أو «عبدًا مرتبطًا بسيده»، لكنها لا تعني هنا عاملًا مأجورًا.'
    reason: alternative_reading
  - marker: b
    text: 'كان الناس في ذلك الزمان يتكئون عند تناول الطعام؛ والمعنى بصياغة أوسع: «اجلس لتأكل».'
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: عبد
  rationale: يحفظ معنى العامل المملوك والخاضع لسلطة سيده، لا العامل المأجور، وهو عنصر أساسي في صورة المثل.
- source_word: ἀροτριῶντα
  choice: يحرث
  rationale: مقابل مباشر وطبيعي للفعل الدال على شق الأرض بالمحراث.
- source_word: ποιμαίνοντα
  choice: يرعى
  rationale: ينقل فعل رعاية القطيع من غير تقييد النص بنوع حيوان لم يذكره اليوناني.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: حين يرجع من الحقل
  rationale: يؤدي المعنى الزمني للمشاركة، أي وقت دخوله عائدًا من الحقل، بصياغة عربية طبيعية.
- source_word: ἐρεῖ αὐτῷ
  choice: يقول له
  rationale: يحافظ على فعل القول وعلى بنية السؤال البلاغي؛ والمضارع العربي مناسب في عرض الحالة المفترضة العامة.
- source_word: Εὐθέως
  choice: حالًا
  rationale: تعبير عربي واضح يدل على الفورية.
- source_word: παρελθὼν
  choice: تعال
  rationale: المشاركة تفيد حركة مصاحبة للأمر التالي؛ وصيغة الأمر «تعال» تنقلها طبيعيًا.
- source_word: ἀνάπεσε
  choice: اتكئ للطعام
  rationale: يحفظ هيئة الاتكاء المتبعة قديمًا عند تناول الطعام، مع بيان الغرض كي لا يبدو الفعل غامضًا للقارئ الحديث.
theological_decisions:
- issue: دلالة δοῦλος في سياق بيت السيد والمثل
  choice: عبد
  alternative: خادم
  rationale: «عبد» يحفظ عدم التكافؤ القانوني والاجتماعي وسلطة السيد التي يقوم عليها السؤال البلاغي، بينما قد توحي «خادم» بعامل حر أو مأجور. ولا تُحمَّل الكلمة هنا دلالة مذهبية لاحقة.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُعمل «عبد» للمحافظة على قوة العلاقة الاجتماعية في الأصل، و«اتكئ للطعام» للجمع بين الدقة التاريخية ووضوح المعنى.
