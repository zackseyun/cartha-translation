lexical_decisions:
- source_word: καθὼς
  choice: وكما
  rationale: تُدخل أداةُ التشبيه مقارنةً واضحة، وتحافظ «وكما» على قوة المقابلة في اليونانية.
- source_word: ἐγένετο
  choice: حدث
  rationale: تفيد هنا ما وقع في زمن نوح؛ و«حدث» تعبير عربي معاصر يحفظ المعنى الحدثي من غير صياغة قديمة.
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: في أيام نوح
  rationale: تعبير زمني عربي طبيعي وقريب من تركيب الأصل.
- source_word: οὕτως
  choice: فكذلك
  rationale: تأتي جوابًا للمقارنة التي تبدأ بـ«وكما»، والفاء تجعل ترابط طرفيها طبيعيًا في العربية.
- source_word: ἔσται
  choice: سيكون
  rationale: تحفظ دلالة المستقبل وصيغة الكينونة من غير أن تضيف تحديدًا تفسيريًا لما سيحدث.
- source_word: καὶ
  choice: أيضًا
  rationale: تحفظ امتداد المقارنة وتوكيدها في العبارة اليونانية.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: هو اللقب الإنجيلي المألوف، ويحفظ صورة العبارة وصلتها المحتملة بدانيال 7 من غير تسطيح دلالتها المسيانية والأخروية.
theological_decisions:
- issue: ترجمة اللقب τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: «ابن الإنسان» ترجمة راسخة وقريبة من بنية الأصل، وتحفظ أصداء دانيال 7 والتوتر بين الدلالة البشرية والاستعمال المسياني، بدل حصر اللقب في تفسير واحد.
