translation:
  language: ar
  text: أفهل يشكر سيّدُه العبدَ لأنه فعل ما أُمر به؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الخادم» أو «المملوك» بدلًا من «العبد» (اليونانية: دولوس).'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: أفهل ...؟
  rationale: تدخل «μή» هنا على سؤال بلاغي يُنتظر جوابه بالنفي. وصيغة «أفهل» العربية الطبيعية تحفظ قوة السؤال من غير أن تضيف جوابًا صريحًا إلى النص.
- source_word: ἔχει χάριν
  choice: يشكر
  rationale: التعبير «ἔχειν χάριν τινί» يدل هنا على إبداء الشكر أو الامتنان لشخص، و«يشكر» أوضح صياغة عربية موجزة في السياق.
- source_word: δούλῳ
  choice: العبد
  rationale: يدل «δοῦλος» في هذا السياق على شخص مملوك خاضع لسلطة سيده وملزم بأوامره. وتحفظ «العبد» في العربية الفصحى هذا التفاوت في المنزلة والسلطة أكثر من «الخادم».
- source_word: ὅτι
  choice: لأنه
  rationale: تبيّن «ὅτι» سبب الشكر المفترض في السؤال، ولذلك تؤدي «لأنه» المعنى بوضوح.
- source_word: ἐποίησεν
  choice: فعل
  rationale: الفعل «ποιέω» عام، ويعني هنا تنفيذ المطلوب؛ و«فعل» طبيعي ودقيق مع الصلة التالية.
- source_word: τὰ διαταχθέντα
  choice: ما أُمر به
  rationale: اسم المفعول المبني للمجهول المستعمل استعمال الاسم يعني حرفيًا «الأشياء التي أُمر بها». والصياغة «ما أُمر به» عربية طبيعية وتحفظ معنى الأمر وصيغة المبني للمجهول.
theological_decisions:
- issue: ترجمة δοῦλος في سياق السيد والعبد في المثل
  choice: العبد
  alternative: الخادم أو المملوك
  rationale: يقوم منطق القول على خضوع الشخص لسلطة سيده والتزامه بتنفيذ الأوامر. وتحفظ «العبد» هذا الواقع الاجتماعي والتفاوت المقصودين، من غير تلطيفهما بكلمة «الخادم» ولا حصرهما في صياغة تفسيرية.
translation_notes:
  register: صياغة فصحى حديثة موجزة وكريمة. استُخدم السؤال البلاغي «أفهل» للإشارة طبيعيًا إلى أن الجواب المتوقع هو النفي، مع إبقاء الجواب غير مصرّح به كما في الأصل.
