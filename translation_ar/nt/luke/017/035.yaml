  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: ar
  text: ستكون امرأتان تطحنان معًا[a]؛ فتُؤخذ إحداهما[b]، وتُترك الأخرى.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في المكان نفسه». فالعبارة اليونانية قد تعني «معًا» أو «في المكان نفسه».'
    reason: lexical_alternative
  - marker: b
    text: لا تحدد عبارة «تُؤخذ» في ذاتها هل الأخذ للخلاص أم للدينونة؛ ويُترك تحديد ذلك للسياق الأوسع.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται δύο
  choice: تكون امرأتان
  rationale: ينشئ فعل الكينونة في المستقبل المشهد، وتدل صيغة اسم الفاعل المؤنثة في ἀλήθουσαι على أن المقصود امرأتان، فذُكر الاسم صراحةً لسلامة العربية ووضوحها.
- source_word: ἀλήθουσαι
  choice: تطحنان
  rationale: يدل الفعل على الطحن، وغالبًا طحن الحبوب، لكن المفعول به مفهوم من النشاط ولا يلزم التصريح به.
- source_word: ἐπὶ τὸ αὐτό
  choice: معًا
  rationale: العبارة اليونانية تحتمل معنى الاجتماع في العمل أو الوجود في الموضع نفسه؛ و«معًا» موجزة وطبيعية وتحفظ المعنى الأساسي.
- source_word: ἡ μία παραλημφθήσεται
  choice: فتُؤخذ إحداهما
  rationale: الصيغة مستقبل مبني للمجهول، و«تُؤخذ» تنقلها مباشرة من غير تحديد ما إذا كان الأخذ للخلاص أم للدينونة.
- source_word: ἡ δὲ ἑτέρα ἀφεθήσεται
  choice: وتُترك الأخرى
  rationale: تفيد δέ المقابلة بين المرأتين، وἀφεθήσεται مستقبل مبني للمجهول بمعنى تُترك؛ ولا حاجة إلى إضافة «خلفها» أو معنى الهجر.
theological_decisions:
- issue: هل يدل الأخذ والترك على الخلاص أو الدينونة؟
  choice: 'الإبقاء على الصياغة المحايدة: «تُؤخذ إحداهما، وتُترك الأخرى».'
  alternative: تفسير المأخوذة بأنها للخلاص والمتروكة للدينونة، أو العكس بأن المأخوذة للدينونة والمتروكة ناجية.
  rationale: الآية نفسها تصف الفصل ولا تصرّح بمآل كل واحدة؛ لذلك تحفظ الترجمة التوتر الدلالي ولا تحسم الخلاف التفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، مع استعمال المثنى الطبيعي في «امرأتان تطحنان»، والحفاظ على المبني للمجهول والغموض اللاهوتي الموجودين في الأصل.
