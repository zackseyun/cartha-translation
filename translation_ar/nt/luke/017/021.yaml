  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: ar
  text: 'ولن يقولوا: «ها هو هنا!» أو: «هناك!» فإن ملكوت الله هوذا في وسطكم[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في داخلكم». يمكن للعبارة اليونانية أن تدل على معنى داخلي، أو على معنى جماعي، مثل «بينكم» أو «في وسطكم».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: ولا يقولون
  rationale: يحافظ على استمرار النفي من السياق السابق، ويعبّر عن المستقبل في العربية بصيغة المضارع بعد النفي على نحو طبيعي.
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: '«ها هو هنا!» أو: «هناك!»'
  rationale: ينقل أداة التنبيه والإشارة المكانية بعبارة عربية واضحة، مع الحفاظ على التقابل بين «هنا» و«هناك».
- source_word: ἰδοὺ γὰρ
  choice: لأن... ها هو
  rationale: «لأن» تنقل العلاقة التفسيرية التي تفيدها γὰρ، و«ها هو» تحفظ قوة أداة التنبيه ἰδοὺ دون حذفها.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي راسخ وشفاف يحفظ الدلالتين الملكية والأخروية للمصطلح.
- source_word: ἐντὸς ὑμῶν
  choice: في وسطكم
  rationale: المخاطَب جمع، والسياق يتناول إمكان تحديد موضع الملكوت؛ لذلك ترجّح العبارة معنى وجوده بين المخاطَبين، مع إبقاء معنى «في داخلكم» الممكن في الحاشية.
- source_word: ἐστιν
  choice: مفهومة في التركيب الاسمي «ملكوت الله... في وسطكم»
  rationale: العربية الفصحى لا تحتاج إلى فعل رابط ظاهر في الجملة الاسمية الحاضرة، فتؤدي العبارة معنى «هو كائن» طبيعيًا.
theological_decisions:
- issue: دلالة ἐντὸς ὑμῶν
  choice: في وسطكم
  alternative: في داخلكم
  rationale: التركيب اليوناني يحتمل معنى داخليًا ومعنى جماعيًا مثل «بينكم/في وسطكم». وبالنظر إلى جمع المخاطَبين وسياق الإشارة إلى الموضع، اختير المعنى الجماعي في المتن، مع حفظ الاحتمال الآخر في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدم «ملكوت الله» للمحافظة على المصطلح الكتابي المألوف، ووُضعت علامة الحاشية بعد العبارة المختلف في معناها مباشرة.
