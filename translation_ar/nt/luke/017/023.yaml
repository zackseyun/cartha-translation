  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: ar
  text: 'وسيقولون لكم: «انظروا، هناك!» أو «انظروا، هنا!» فلا تذهبوا ولا تسعوا وراءهم[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لا يذكر النص اليوناني مفعول «تسعوا وراء» صراحةً؛ والضمير في الترجمة يوضّح المعنى من السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν
  choice: سيقولون
  rationale: صيغة المستقبل من λέγω، وترجمتها المباشرة والطبيعية هنا «سيقولون» لأنها تمهّد لقول منقول.
- source_word: Ἰδοὺ
  choice: انظروا
  rationale: أداة تنبيه وإشارة تستدعي الانتباه إلى موضع مزعوم؛ و«انظروا» عربية معاصرة واضحة وتحفظ قوة الأمر.
- source_word: ἐκεῖ / ὧδε
  choice: هناك / هنا
  rationale: يحفظ هذا التقابل الموجز بين الإشارة إلى المكان البعيد والمكان القريب.
- source_word: μὴ ἀπέλθητε
  choice: فلا تذهبوا
  rationale: نهي عن التحرك استجابةً لهذه الأقوال؛ و«لا تذهبوا» طبيعية ولا تحدد وجهة لم يذكرها النص.
- source_word: μηδὲ διώξητε
  choice: ولا تسعوا وراءهم
  rationale: يدل διώκω هنا على الملاحقة أو السعي وراء شيء أو أشخاص؛ أُضيف الضمير في المتن لسلاسة العربية، مع بيان أن المفعول غير مصرّح به في اليونانية.
theological_decisions:
- issue: المفعول المحذوف مع διώξητε
  choice: ولا تسعوا وراءهم
  alternative: 'ولا تسعوا وراء ذلك؛ أو: ولا تلاحقوا'
  rationale: لا يصرّح اليوناني بالمفعول، ولذلك يبقى مرجعه محتملًا بين أصحاب الأقوال وما يدّعونه. استُعمل «وراءهم» في المتن للوضوح، مع حاشية تحفظ الإبهام الأصلي.
- issue: صياغة عبارتي الإشارة
  choice: '«انظروا، هناك!» أو: «انظروا، هنا!»'
  alternative: «ها هو هناك! ها هو هنا!»
  rationale: لا يذكر النص اليوناني اسم المشار إليه في هاتين العبارتين؛ لذا تتجنب الصياغة إضافة «هو» وتحفظ إيجاز النداءين وتوترهما السياقي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. استُخدم «انظروا» بدل الصيغة التراثية «هوذا»، وحُفظ التقابل الإشاري بين «هناك» و«هنا» دون تفسير هوية المشار إليه.
