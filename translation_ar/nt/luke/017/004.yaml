  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: ar
  text: 'وَإِنْ أَخْطَأَ فِي حَقِّكَ سَبْعَ مَرَّاتٍ فِي يَوْمٍ، وَرَجَعَ إِلَيْكَ سَبْعَ مَرَّاتٍ قَائِلًا: «أَنَا تَائِبٌ»، فَاغْفِرْ لَهُ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فستغفر له». جاءت العبارة اليونانية بصيغة المستقبل، لكنها تحمل هنا قوة الأمر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτάκις
  choice: سَبْعَ مَرَّاتٍ
  rationale: ينقل معنى الظرف الدال على تكرار الفعل سبع مرات، بصياغة عربية طبيعية وواضحة.
- source_word: τῆς ἡμέρας
  choice: فِي يَوْمٍ
  rationale: يعبّر طبيعيًا عن ظرف الزمن الذي تقع الأفعال في حدوده، من غير إضافة معنى «اليوم نفسه» أو «يوم واحد» صراحةً.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: أَخْطَأَ إِلَيْكَ
  rationale: تعبير عربي مألوف يفيد ارتكاب خطيئة أو إساءة بحق المخاطَب، ويحافظ على لفظ الجذر المتعلق بالخطية.
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: رَجَعَ إِلَيْكَ
  rationale: يحفظ معنى العودة إلى المخاطَب في سياق تكرار الإساءة ثم الرجوع إليه، مع بقاء «التفت إليك» احتمالًا معجميًا أقل ملاءمة للسياق.
- source_word: λέγων
  choice: قَائِلًا
  rationale: يحافظ على الصلة الحالية للمشاركة اليونانية ويبيّن أن القول يصاحب الرجوع.
- source_word: Μετανοῶ
  choice: أَنَا تَائِبٌ
  rationale: صياغة عربية طبيعية ومباشرة لإقرار المتكلم بتوبته، وتحفظ الدلالة الأخلاقية والروحية بدل اختزالها في الأسف.
- source_word: ἀφήσεις αὐτῷ
  choice: فَاغْفِرْ لَهُ
  rationale: ينقل القوة الأمرية للمستقبل اليوناني في هذا السياق التعليمي بصيغة أمر عربية واضحة، مع ترجمة المفعول غير المباشر إلى «له».
theological_decisions:
- issue: قوة صيغة المستقبل في ἀφήσεις
  choice: فَاغْفِرْ لَهُ
  alternative: فسوف تغفر له / فعليك أن تغفر له
  rationale: المستقبل هنا يؤدي وظيفة الأمر أو الإلزام في سياق وصية يسوع. صيغة الأمر العربية تنقل هذه القوة بوضوح من غير تحويلها إلى مجرد تنبؤ، ولا إضافة لفظ «يجب» غير الموجود صراحةً.
- issue: دلالة Μετανοῶ
  choice: أَنَا تَائِبٌ
  alternative: أنا نادم / لقد غيّرت رأيي
  rationale: يحفظ معنى التوبة الأخلاقي والروحي، ولا يخففه إلى مجرد الندم أو تغيير الرأي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «في يوم» لسلاسة العبارة، و«رجع إليك» لإبقاء معنى العودة في السياق. ضُبط النص جزئيًا لتيسير القراءة من غير إثقال كامل بالحركات.
