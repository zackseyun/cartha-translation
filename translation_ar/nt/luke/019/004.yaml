lexical_decisions:
- source_word: προδραμὼν ... εἰς τὸ ἔμπροσθεν
  choice: ركض إلى الأمام
  rationale: يجمع التعبير بين الركض والتقدّم إلى موضع أمام المسار، وهي صياغة عربية طبيعية تحفظ معنى الفعل والعبارة الظرفية.
- source_word: ἀνέβη ἐπὶ
  choice: صعد إلى
  rationale: ينقل فعل الصعود إلى الشجرة بوضوح، من غير تكلّف في إضافة كيفية لا يصرّح بها النص.
- source_word: συκομορέαν
  choice: شجرة جُمَّيْز
  rationale: الجُمَّيْز هو الاسم العربي الدقيق والشائع نسبيًا لشجرة Ficus sycomorus، وليس التوت ولا القيقب المعروف في بعض الاستعمالات الحديثة باسم sycamore.
- source_word: ἵνα ἴδῃ αὐτόν
  choice: لكي يراه
  rationale: يحفظ دلالة الغاية التي تعبّر عنها ἵνα مع صيغة الاحتمال، بأسلوب عربي واضح.
- source_word: ἐκείνης
  choice: من هناك
  rationale: الضمير المؤنث اليوناني يحيل على طريق أو جهة مفهومة ضمنًا؛ وتعبير «من هناك» يحفظ الإضمار من دون إدخال اسم غير موجود صراحة.
- source_word: ἤμελλεν διέρχεσθαι
  choice: كان مزمعًا أن يمر
  rationale: ينقل معنى الفعل الدال على الفعل المتوقع أو الوشيك، مع المحافظة على نبرة سردية فصيحة.
