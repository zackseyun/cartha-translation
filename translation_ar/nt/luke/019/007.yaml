  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: ar
  text: 'فَلَمَّا رَأَى الْجَمِيعُ ذَلِكَ، أَخَذُوا يَتَذَمَّرُونَ قَائِلِينَ: «دَخَلَ لِيُقِيمَ عِنْدَ رَجُلٍ خَاطِئٍ!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: فَلَمَّا رَأَى ... ذَلِكَ
  rationale: صيغ اسم الفاعل الماضي بوصفه ظرفًا زمنيًا طبيعيًا في العربية، وأضيف «ذلك» ليدل في السياق على دخول يسوع مع زكّا.
- source_word: πάντες
  choice: الْجَمِيعُ
  rationale: يحفظ شمول رد الفعل كما تفيده اليونانية.
- source_word: διεγόγγυζον
  choice: أَخَذُوا يَتَذَمَّرُونَ
  rationale: تنقل «أخذوا» بدء الفعل، وينقل المضارع استمراره الذي توحي به صيغة الماضي الناقص اليونانية، مع إبقاء معنى التذمر السلبي.
- source_word: λέγοντες
  choice: قَائِلِينَ
  rationale: صياغة حالية عربية طبيعية تقدم مضمون التذمر.
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: عِنْدَ رَجُلٍ خَاطِئٍ
  rationale: «عند» تلائم معنى الإقامة لدى شخص، و«رجل خاطئ» تحفظ كلا من الاسم المذكر والصفة بدل اختزالهما في «خاطئ» وحدها.
- source_word: εἰσῆλθεν
  choice: دَخَلَ
  rationale: ينقل الماضي اليوناني بوضوح وطبيعية، ويفهم من السياق أنه دخل البيت.
- source_word: καταλῦσαι
  choice: لِيُقِيمَ
  rationale: يفيد المكث أو النزول ضيفًا دون أن يفرض معنى المبيت، وهو أفصح وأوضح هنا من «ينزل» المحتملة دلاليًا.
theological_decisions:
- issue: وصف الجموع لزكّا
  choice: رَجُلٍ خَاطِئٍ
  alternative: خاطئ
  rationale: يحفظ تركيب الصفة مع الاسم المذكر في اليونانية، وينقل حكم الجموع الازدرائي من غير إضافة تقرير لاهوتي من المترجم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استعملت «أخذوا يتذمرون» للجمع بين بدء التذمر واستمراره، و«ليقيم عند» لنقل معنى الضيافة أو المكث دون حصره في المبيت.
