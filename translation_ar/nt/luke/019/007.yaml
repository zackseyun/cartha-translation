  source_fidelity: 'النص العربي ينقل بدقة البنية والمعنى في اليونانية: الظرف الزمني في «فلما رأى الجميع ذلك»، وشمول «الجميع»، وفعل التذمر المستمر/الابتدائي في «أخذوا يتذمرون»، ومضمون اعتراضهم. كما أن «دخل ليقيم عند رجل خاطئ» يحفظ فعل الدخول وغرض الإقامة لدى شخص، ويحافظ على تركيب الصفة مع الاسم المذكر في ἁμαρτωλῷ ἀνδρί.'
