lexical_decisions:
- source_word: εἶπεν δὲ
  choice: وقال
  rationale: تنقل الفعل السردي بصيغة الماضي، وتؤدي δέ بوصفها رابطًا خفيفًا في تتابع الكلام دون إقحام معنى التعارض.
- source_word: καὶ τούτῳ
  choice: لهذا أيضًا
  rationale: تحافظ على دلالة اسم الإشارة τούτῳ وعلى معنى الإضافة في καί، وتُبقي التوازي مع مخاطبة العبد السابق.
- source_word: Καὶ σὺ
  choice: وأنتَ
  rationale: تحافظ على الخطاب الشخصي المؤكد وعلى التوازي في اليونانية، مع ضبط التاء دفعًا لالتباس المخاطَب.
- source_word: ἐπάνω γίνου
  choice: كُنْ على
  rationale: صياغة موجزة وقريبة من تركيب الأصل، وتفيد إسناد موضع سلطة، مع إبقاء البدائل التفسيرية في الحاشية.
- source_word: πέντε πόλεων
  choice: خمس مدن
  rationale: العدد يوافق قاعدة العربية مع جمع «مدينة»، والمضاف إليه متعلق بعبارة السلطة «على».
