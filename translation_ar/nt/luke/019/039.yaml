source:
  edition: SBLGNT
  text: καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν· Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: ar
  text: 'وقال له بعضٌ من الفريسيين من بين الجمع[a]: «يا معلّم، انتهر تلاميذك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من الجمع».'
    reason: بديل معجمي لعبارة «من بين الجمع»؛ فالعبارة اليونانية ἀπὸ τοῦ ὄχλου يمكن أن تُفهم بمعنى المصدر/الخروج من الجمع أو الموقع ضمنه.
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: بعضُ الفرّيسيّين
  rationale: ينقل الضمير غير المحدد مع الإضافة التبعيضية، فيدل على جماعة غير معيّنة من الفرّيسيّين لا عليهم جميعًا.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: الذين كانوا بين الجموع
  rationale: تدل ἀπό هنا على منشأ المتكلمين أو موضعهم ضمن الجموع المحيطة بيسوع. صيغت العبارة عربيًا بوضوح مع إبقاء احتمال ترجمتها حرفيًا في الحاشية.
- source_word: εἶπαν πρὸς αὐτόν
  choice: فقال له
  rationale: صيغة عربية طبيعية ومباشرة لعبارة الخطاب السردية، مع ربطها بالسياق السابق بالفاء.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: ينقل اللقب في معناه التعليمي المباشر من غير إضافة دلالة سلطوية أو إقرارية أقوى مما يقوله النص.
- source_word: ἐπιτίμησον
  choice: انتهر
  rationale: فعل أمر يدل على الزجر والتوبيخ المباشر، ويحفظ قوة اللفظة من غير أن يفسرها بالنتيجة المقصودة مثل «أسكت».
- source_word: τοῖς μαθηταῖς σου
  choice: تلاميذك
  rationale: يحفظ علاقة المعلّم بالتلاميذ، وتأتي صيغة المفعول به طبيعية بعد «انتهر» في العربية.
theological_decisions:
- issue: دلالة لقب Διδάσκαλε الموجّه إلى يسوع
  choice: يا معلّم
  alternative: يا سيّد
  rationale: السياق يقدّم لقبًا تعليميًا، ولا يقتضي بذاته لقبًا ذا دلالة سلطوية أو مسيانية أقوى؛ لذلك تحافظ «يا معلّم» على حدود المعنى.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعملت «الجموع» مراعاةً لسياق دخول يسوع حيث يحيط به جمع كبير، و«انتهر» لحفظ قوة الأمر اليوناني دون تفسير زائد.
