base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: ar
  text: 'وقال للواقفين هناك: «خذوا منه المَنا وأعطوها للذي لديه عشر مَنات[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المَنا وحدة نقدية قديمة.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς παρεστῶσιν
  choice: للواقفين هناك
  rationale: اسم فاعل تام مبني للمعلوم مستعمل استعمال الاسم، ويشير إلى الحاضرين بالقرب منه. يحافظ التعبير على الصورة المكانية في اليونانية ويأتي طبيعيًا في العربية.
- source_word: Ἄρατε
  choice: خذوا
  rationale: أمر جمع من αἴρω، ومع ἀπ’ αὐτοῦ يدل هنا على الأخذ والنزع منه، لا مجرد الرفع.
- source_word: ἀπ’ αὐτοῦ
  choice: منه
  rationale: حرف الجر ἀπό مع المضاف إليه يفيد الانفصال، و«منه» ينقل المعنى بإيجاز ووضوح.
- source_word: τὴν μνᾶν
  choice: المَنَا
  rationale: μνᾶ وحدة نقدية قديمة. نُقلت بصيغة معرَّبة تحفظ البيئة التاريخية ولا توهم أنها عملة حديثة ذات قيمة مطابقة.
- source_word: δότε
  choice: أعطوه
  rationale: أمر جمع من δίδωμι يدل على نقل الشيء إلى شخص آخر. أُلحقت به هاء المفعول لتعود بوضوح إلى المَنَا، وهو تعبير عربي طبيعي.
- source_word: τῷ ... ἔχοντι
  choice: للذي معه
  rationale: اسم فاعل معرّف بالأداة ومستعمل استعمال الاسم. «للذي معه» واضح وطبيعي، ولا يضيف لفظ «رجل» غير المصرح به.
- source_word: τὰς δέκα μνᾶς
  choice: العشرة مَنَات
  rationale: حُفظت أداة التعريف الدالة على المقدار المذكور سابقًا، واستُعمل جمع «مَنَات» لملاءمة العربية.
theological_decisions:
- issue: نقل μνᾶ بوصفها وحدة نقدية قديمة
  choice: المَنَا
  alternative: الرطل / الجنيه
  rationale: النقل الصوتي المعرَّب يحفظ اسم الوحدة القديمة ولا يستبدل بها وحدة وزن أو عملة حديثة قد توحي بقيمة غير دقيقة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. حُفظت صورة الواقفين بالقرب، واستُعمل اسم الوحدة النقدية القديمة بصيغة معرَّبة مع إيضاح موجز في الحاشية.
