  source_fidelity: 'المعنى الأساسي منقول بدقة: المخاطَبون هم الواقفون/الحاضرون بقربه، والأمران هما نزع المَنا منه وإعطاؤها لمن يملك عشر مَنات. لكن الضمير في «وأعطوه للذي» لا يؤدي المفعول المنقول بوضوح، بل قد يُفهم منه إعطاء الشخص ثم يكرر المتلقي بحرف الجر.'
  naturalness: '«وقال للواقفين هناك» عربية مفهومة، و«الواقفين» تحافظ على الصورة الحركية. أما «وأعطوه للذي معه...» فغير سليمة دلاليًا في هذا التركيب؛ والصواب إظهار ضمير المَنا المؤنث: «وأعطوها للذي لديه...». كما أن «العشرة مَنات» ليست الصياغة العددية الأفصح مع اسم مؤنث معرّب؛ «عشر مَنات» أوضح وأفصح.'
