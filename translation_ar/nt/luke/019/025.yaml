  text: καὶ εἶπαν αὐτῷ· Κύριε, ἔχει δέκα μνᾶς—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/025.yaml
  text: And they said to him[a], ‘Lord[b], he has ten minas—’
translation:
  language: ar
  text: 'فقالوا له: «يا سيدي[a]، عنده عشر مَنات[b]—»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يا مولاي» أو «يا رب»؛ فاللفظ اليوناني يُستعمل للسيد وللرب بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: المَنا وحدة نقدية قديمة، تساوي تقريبًا أجر مئة يوم.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: فـ
  rationale: الفاء تربط الاعتراض بما قبله ربطًا سرديًا طبيعيًا في العربية، من غير إضافة معنى زمني أو استدراكي صريح.
- source_word: εἶπαν αὐτῷ
  choice: قالوا له
  rationale: صيغة الماضي اليونانية تدل هنا على حدث سردي بسيط، والضمير يعود إلى صاحب السلطان في المثل.
- source_word: Κύριε
  choice: يا سيدي
  rationale: نداء طبيعي محترم لصاحب السلطان في سياق المثل. وهو يحفظ معنى السيادة من غير أن يحسم وحده أن النداء اعتراف لاهوتي؛ وتوضح الحاشية البدائل الممكنة.
- source_word: ἔχει
  choice: عنده
  rationale: تعبير عربي واضح ومباشر عن حيازة الشخص للمبلغ، من غير إضافة معنى «بالفعل» غير المصرح به في اليونانية.
- source_word: δέκα μνᾶς
  choice: عشر مَنات
  rationale: نُقلت تسمية الوحدة النقدية القديمة بصيغة معرّبة بدل استبدالها بعملة حديثة قد توهم قيمة غير دقيقة، مع شرحها في الحاشية.
theological_decisions:
- issue: دلالة Κύριε في خطاب مباشر داخل المثل
  choice: يا سيدي
  alternative: يا رب؛ يا مولاي
  rationale: قد يكون اللفظ اليوناني نداء احترام وسيادة لصاحب السلطة في المثل، وقد يحمل في مواضع أخرى دلالة «الرب». اختيار «يا سيدي» يلائم المتكلم داخل القصة ولا يفرض اعترافًا لاهوتيًا غير لازم، بينما تحفظ الحاشية المجال الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية كريمة. استُعملت «مَنات» جمعًا معرّبًا لـ«مَنا»، ووُضع الشرح الثقافي في الحاشية. وتُركت الشرطة الطويلة في نهاية القول لأنها تعكس انقطاع الاعتراض واستمرار المشهد في الآية التالية.
