- from: أمّا هؤلاء أعدائي، الذين لم يريدوا أن أملك عليهم[a]، فأتوا بهم إلى هنا واذبحوهم[b] أمامي.
  to: أمّا هؤلاء أعدائي، الذين لم يريدوا أن أملك عليهم[a]، فائتوا بهم إلى هنا واذبحوهم[b] أمامي.
  rationale: صُحِّحت صيغة الأمر وحدها من «فأتوا» إلى «فائتوا» كي تطابق أمر الجمع اليوناني وتستقيم في العربية المعاصرة. كما صيغت الحاشية الثانية بديلًا معجميًا موجزًا بدل شرح تفسيري، مع بقاء المتن محتفظًا بقوة الفعل اليوناني في «اذبحوهم».
