  terminology: «أعدائي» مناسب لـἐχθρούς، و«أملك عليهم» ينقل βασιλεῦσαι مع حفظ طابع المُلك/الحكم. و«اذبحوهم» ينقل قوة κατασφάξατε من غير إدخال دلالة قضائية. تُبقي الحاشية البديلة «أن أكون ملكًا عليهم» خيارًا سليمًا.
