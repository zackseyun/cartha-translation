base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: ar
  text: أمّا هؤلاء أعدائي، الذين لم يريدوا أن أملك عليهم[a]، فائتوا بهم إلى هنا واذبحوهم[b] أمامي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن أكون ملكًا عليهم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «اقتلوهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: أمّا
  rationale: تؤدي هنا وظيفة الانتقال القوي إلى البند الختامي، مع إبراز «هؤلاء الأعداء» موضوعًا للكلام، وهي صياغة عربية طبيعية في هذا السياق.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: هؤلاء أعدائي
  rationale: تحفظ معنى العداوة وقوة اسم الإشارة الذي يحدد المقصودين ويؤكدهم.
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: الذين لم يريدوا أن أملك عليهم
  rationale: تُنقل العبارة الوصفية بصلة موصول طبيعية، ويُحفظ معنى θέλω الدال على الإرادة ومعنى βασιλεύω الفعلي، أي ممارسة المُلك والحكم.
- source_word: ἀγάγετε ὧδε
  choice: فأتوا بهم إلى هنا
  rationale: صياغة عربية واضحة للأمر بإحضارهم إلى الموضع الذي فيه المتكلم؛ والفاء تلائم الانتقال من وصفهم إلى الأمر بشأنهم.
- source_word: κατασφάξατε
  choice: اذبحوهم
  rationale: فعل قوي وصريح يحفظ حدة κατασφάζω وصورته العنيفة، ولا يضيف معنى قضائيًا غير مصرّح به.
- source_word: ἔμπροσθέν μου
  choice: أمامي
  rationale: تنقل الدلالة المكانية ودلالة الحضور بإيجاز ووضوح، وتحافظ على قوة المشهد.
theological_decisions:
- issue: هوية المتكلم ودلالة الأمر داخل المثل
  choice: نقل أمر الرجل النبيل مباشرة وبكل حدته ضمن كلام الشخصية في المثل، من غير تخفيف للعنف ومن غير إضافة تفسير يساويه صراحة بأمر مباشر من يسوع خارج إطار المثل.
  alternative: إضافة تعبير يباعد بين القول ودلالته أو يصرّح بأنه مجرد صورة مَثَلية.
  rationale: النص اليوناني يورد الكلام على لسان الشخصية داخل المثل. لذلك ينبغي حفظ القوة السردية والتوتر اللاهوتي من غير حسم تفسيري زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «أمّا» لإبراز التحول الختامي، و«اذبحوهم» للمحافظة على شدة الفعل اليوناني من غير لغة قديمة أو تلطيف للمعنى.
