  source_fidelity: 'النص يحفظ عناصر اليونانية الأساسية: الانتقال الاستدراكي، وتوكيد «هؤلاء»، ورفضهم مُلك المتكلم عليهم، والإحضار إلى الموضع، وفعل القتل الشديد، والحضور المكاني للمتكلم. غير أن «فأتوا بهم» تُقرأ في الفصحى فعلًا ماضيًا («أتوا») لا صيغة أمر؛ والصيغة الصحيحة للأمر هي «فائتوا بهم».'
