  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: ar
  text: وبينما كانوا يسمعون هذه الأمور، تابع كلامه وضرب مثلًا، لأنه كان قريبًا من أورشليم، ولأنهم كانوا يظنون أن ملكوت الله كان على وشك أن يظهر في الحال.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان على وشك أن يُعلَن في الحال». قد يدل الفعل على أن يصير الشيء ظاهرًا أو يتجلّى.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: وبينما كانوا يسمعون هذه الأمور
  rationale: يحفظ تركيب الحال المطلق اليوناني ودلالة الفعل المضارع على التزامن والاستمرار، بصياغة عربية طبيعية.
- source_word: προσθεὶς εἶπεν παραβολὴν
  choice: تابع كلامه وضرب مثلًا
  rationale: ينقل معنى مواصلة الحديث وإضافة مثل إليه، ويستعمل التعبير العربي المألوف «ضرب مثلًا».
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: لأنه كان قريبًا من أورشليم
  rationale: ينقل الدلالة السببية ويوضح، وفق التركيب اليوناني، أن يسوع هو القريب من أورشليم.
- source_word: δοκεῖν αὐτοὺς
  choice: لأنهم كانوا يظنون
  rationale: يحفظ السبب الثاني ويعبّر عن اعتقادهم أو توقعهم من غير الإيحاء باليقين.
- source_word: παραχρῆμα
  choice: في الحال
  rationale: تعبير عربي واضح يفيد الفورية.
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: سيظهر
  rationale: يفيد التوقع الوشيك مع معنى صيرورة الملكوت ظاهرًا؛ وتتكفل عبارة «في الحال» بإبراز شدة القرب الزمني.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: المقابل الكتابي العربي الراسخ، ويحفظ الاتساق اللاهوتي والسردي.
theological_decisions:
- issue: طبيعة ظهور ملكوت الله المتوقع
  choice: سيظهر في الحال
  alternative: سيُعلَن في الحال / سيظهر بوصفه ملكًا سياسيًا أو تحققًا أخرويًا كاملًا
  rationale: النص يذكر توقع ظهور الملكوت قريبًا جدًا من غير أن يحدد طبيعة ذلك الظهور؛ لذلك لا تفرض الترجمة تفسيرًا سياسيًا أو روحيًا أو أخرويًا بعينه.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «أورشليم» و«ملكوت الله» للمحافظة على المصطلح الكتابي المألوف، و«ضرب مثلًا» بوصفها عبارة عربية طبيعية راسخة.
