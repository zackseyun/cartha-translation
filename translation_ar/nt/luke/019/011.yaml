  to: وبينما كانوا يسمعون هذه الأمور، تابع كلامه وضرب مثلًا، لأنه كان قريبًا من أورشليم، ولأنهم كانوا يظنون أن ملكوت الله كان على وشك أن يظهر في الحال.[a]
  rationale: أُضيفت عبارة «كان على وشك أن» لتمثيل دلالة μέλλει على الوشيك، مع الإبقاء على «في الحال» لـπαραχρῆμα وعلى غموض النص المقصود بشأن كيفية ظهور ملكوت الله. ونُقّحت الحاشية لتعبّر عن البديل المعجمي من غير الإيحاء بتفسير لاهوتي محدد.
