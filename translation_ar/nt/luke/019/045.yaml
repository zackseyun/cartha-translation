lexical_decisions:
- source_word: εἰσελθὼν
  choice: ودخل
  rationale: اسم الفاعل اليوناني الماضي يدل على فعل وقع قبل ابتداء الفعل الرئيس أو مقترنًا به في تسلسل السرد. والعطف بالفعل «ودخل» عربي طبيعي واضح يحفظ حركة السرد من غير إثقال.
- source_word: ἱερὸν
  choice: الهيكل
  rationale: لفظ ἱερόν يشير إلى مجمّع الهيكل وساحاته، لا إلى المقدس الداخلي تحديدًا. «الهيكل» هو المقابل العربي الموجز المألوف، مع توضيح النطاق المكاني في الحاشية.
- source_word: ἤρξατο
  choice: بدأ
  rationale: يحفظ معنى الشروع الذي يفيده الفعل اليوناني مع المصدر.
- source_word: ἐκβάλλειν
  choice: يُخرج
  rationale: ينقل معنى الإخراج الحازم في سياق الحدث، بلغة عربية طبيعية، من غير إضافة وصف صريح للقوة لا يورده النص نفسه.
- source_word: πωλοῦντας
  choice: الذين كانوا يبيعون
  rationale: يحفظ دلالة اسم الفاعل الحاضر على أشخاص كانوا يمارسون البيع، من غير تحديد ما كانوا يبيعونه لأن الآية لا تذكره.
theological_decisions:
- issue: نطاق ἱερόν المكاني في عمل يسوع داخل الهيكل
  choice: الهيكل، بمعنى مجمّع الهيكل وساحاته
  alternative: ساحات الهيكل؛ حرم الهيكل؛ المقدس
  rationale: المصطلح اليوناني يدل عادة على مجمّع الهيكل، بخلاف ναός الذي قد يدل على البناء المقدس الداخلي. أبقى المتن موجزًا، وتمنع الحاشية فهمه على أنه المقدس الداخلي تحديدًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم تسلسل فعلي طبيعي («ودخل... وبدأ») بدل تركيب حالي ثقيل، مع إبقاء الفاصلة الختامية لأن الآية جزء من جملة تستمر في السياق.
