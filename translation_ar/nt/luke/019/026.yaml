  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: ar
  text: 'أقول لكم: كلُّ من له سيُعطى[a]، وأمّا من ليس له، فحتى ما له سيُؤخذ منه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي بحسب المعنى المفهوم من السياق: «سيُعطى المزيد». أمّا اليونانية فتقول حرفيًا: «سيُعطى» من غير ذكر «المزيد» صراحةً.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: ينقل فعل القول في المضارع مع ضمير المخاطبين بعبارة عربية مباشرة وطبيعية، ويحافظ على نبرة التصريح المؤكد.
- source_word: παντὶ τῷ ἔχοντι
  choice: كلُّ من له
  rationale: اسم الموصول مع فعل الملكية يصوغ اسم الفاعل المعرّف صياغة عربية موجزة وعامة، من غير تحديد لما يملكه الشخص.
- source_word: δοθήσεται
  choice: سيُعطى
  rationale: يحافظ على المستقبل المبني للمجهول وعلى عدم ذكر المفعول به في اليونانية، فلا يضيف «المزيد» إلى المتن مع أن معنى الزيادة مفهوم من السياق.
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: وأمّا من ليس له
  rationale: «وأمّا» تُظهر المقابلة التي تؤديها δέ، و«من ليس له» تنقل الوصف العام من غير افتراض الشيء الذي يفتقر إليه.
- source_word: καὶ ὃ ἔχει
  choice: فحتى ما له
  rationale: تؤدي «حتى» معنى καί التوكيدي هنا، وتحافظ «ما له» على عموم صلة الموصول.
- source_word: ἀρθήσεται
  choice: سيُؤخذ منه
  rationale: ينقل المبني للمجهول ومعنى النزع أو الحرمان، ويُظهر تركيب ἀπό الدال على الأخذ من الشخص.
theological_decisions:
- issue: مدى انطباق القول بوصفه مبدأً للزيادة والخسارة
  choice: إبقاء القول عامًا وموجزًا كما في النص، من غير إدخال تفسير عقائدي عن الخلاص أو الاستحقاق أو سبق التعيين.
  alternative: تقييد القول صراحةً بالأمانة في الوكالة ضمن سياق المثل، أو صياغته بوصفه مبدأً عامًا عن الملكوت.
  rationale: الآية نفسها لا تحدد الآلية اللاهوتية ولا تصرح بموضوع العطاء، ولذلك ينبغي أن يبقى تطبيقها مستفادًا من السياق والتفسير لا مضافًا إلى الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت صياغة مثلية موجزة، مع إبقاء موضوع الملكية والعطاء غير مصرح به كما في اليونانية، ووُضعت علامة الحاشية [a] في المتن.
