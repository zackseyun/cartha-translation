  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: ar
  text: فلماذا لم تُودِع مالي في المصرف؟ فحين جئتُ، لكنتُ قد استوفيته مع فائدة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τί
  choice: فلماذا
  rationale: استفهام عن السبب يحمل نبرة التوبيخ، والفاء تصل السؤال بما سبقه ربطًا طبيعيًا.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: تضع ... في المصرف
  rationale: التعبير يعني حرفيًا وضع المال على مائدة، لكنه في هذا السياق المالي يشير إلى إيداعه لدى جهة تتعامل بالنقود؛ و«المصرف» تعبير عربي واضح ومعاصر.
- source_word: μου τὸ ἀργύριον
  choice: مالي
  rationale: ἀργύριον قد يعني الفضة أو النقود، والمقصود هنا المال في سياق تجاري، لذا فـ«مالي» طبيعي ودقيق.
- source_word: κἀγὼ ἐλθὼν
  choice: وحين أعود
  rationale: حُوِّل اسم الفاعل اليوناني إلى جملة زمانية طبيعية. واختيار المضارع «أعود» يلائم قول السيد قبل عودته المفترضة في صيغة الشرط المخالف للواقع.
- source_word: σὺν τόκῳ
  choice: مع الفائدة
  rationale: τόκος هنا هو العائد المالي على المال المودَع، و«الفائدة» هي المقابل العربي المعاصر المباشر من غير إيحاءات زائدة.
- source_word: αὐτὸ ἔπραξα
  choice: كنت سأسترده
  rationale: πράσσω يحمل هنا معنى تحصيل المال أو استيفائه؛ و«أسترده» يوضح استعادة أصل المال مع فائدته، مع الحفاظ على دلالة الاحتمال غير المتحقق في ἄν.
theological_decisions: []
translation_notes:
  register: صياغة عربية فصحى واضحة وكريمة، تحافظ على صورة المعاملة المالية وعلى صيغة النتيجة غير المتحققة. لا حاجة إلى حاشية، لأن «المصرف» ينقل الدلالة السياقية مباشرة من غير غموض جوهري.
