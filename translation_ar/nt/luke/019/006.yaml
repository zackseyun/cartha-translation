lexical_decisions:
- source_word: σπεύσας
  choice: أسرع
  rationale: اسم الفاعل الأوريستي يدل على المبادرة والسرعة، و«أسرع» تعبير عربي طبيعي يحفظ تتابع الحدث.
- source_word: κατέβη
  choice: نزل
  rationale: يحفظ معنى الحركة إلى أسفل بوضوح، دون إضافة جهة نظر لا يحددها السياق.
- source_word: ὑπεδέξατο
  choice: استقبله
  rationale: الفعل في صيغة الوسط يفيد التلقي والترحيب، وغالبًا ما يحمل إيحاء الضيافة؛ و«استقبله» أنسب هنا من «تلقّاه» وأوضح للقارئ المعاصر.
- source_word: αὐτόν
  choice: ـه
  rationale: ضمير المفعول يعود إلى يسوع بحسب السياق.
- source_word: χαίρων
  choice: بفرح
  rationale: اسم الفاعل المضارع يصف الفرح المصاحب للاستقبال؛ و«بفرح» يحفظ هذا المعنى بصورة عربية طبيعية.
- source_word: καὶ ... καὶ
  choice: فـ ... و
  rationale: الفاء في البدء تلائم التعاقب السريع في العربية، والواو تربط الفعلين التاليين من غير تحميل العلاقة معنى زائدًا.
