lexical_decisions:
- source_word: ἐζήτει
  choice: كان يحاول
  rationale: صيغة الماضي الناقص تدل على محاولة مستمرة، لا على مجرد رغبة عابرة.
- source_word: ἰδεῖν
  choice: أن يرى
  rationale: المصدر يبين غاية محاولته، وهذه الصياغة واضحة وطبيعية.
- source_word: τίς ἐστιν
  choice: مَن هو يسوع
  rationale: تحافظ على دلالة العبارة اليونانية التي قد تتصل بالهوية أو بمعرفة أي شخص هو، دون حسم زائد.
- source_word: οὐκ ἠδύνατο
  choice: لم يستطع
  rationale: تعبير عربي مألوف ينقل عدم القدرة بوضوح.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: بسبب الجمع
  rationale: يؤدي معنى السبب المعيق الذي تحمله ἀπό في هذا السياق.
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: كان قصير القامة
  rationale: مع أن ἡλικία قد تشير إلى السن أو القامة، فإن عجزه عن الرؤية بسبب الجمع يرجح بوضوح أن المقصود قصر الطول.
