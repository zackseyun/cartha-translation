  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: ar
  text: 'فقال: «ذهب رجلٌ من أسرةٍ نبيلة إلى بلدٍ بعيد لينال لنفسه المُلك[a] ويعود».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مملكة»، أو: «سلطة ملكية». يمكن للكلمة اليونانية أن تدل على المملكة نفسها أو على المُلك وسلطة الحكم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فـ
  rationale: تفيد الاستمرار والنتيجة في السياق، والفاء طبيعية موجزة في السرد العربي.
- source_word: Ἄνθρωπός τις εὐγενὴς
  choice: رجلٌ من أسرةٍ نبيلة
  rationale: ينقل التعريف بشخص غير معيّن مع دلالة εὐγενής على شرف النسب أو علوّ المولد، دون استعمال لقب عربي قد يوحي بمنصب محدد.
- source_word: ἐπορεύθη
  choice: ذهب
  rationale: مقابل عربي واضح وطبيعي لفعل الانتقال في هذا السياق.
- source_word: εἰς χώραν μακρὰν
  choice: إلى بلاد بعيدة
  rationale: يحفظ معنى البعد الجغرافي بصياغة عربية مألوفة، و«بلاد» لا تفرض مفهوم الدولة الحديثة.
- source_word: λαβεῖν
  choice: لينال
  rationale: يدل السياق السياسي على تلقّي المُلك أو الحصول عليه، لا اغتصابه؛ و«ينال» يؤدي هذا المعنى طبيعيًا.
- source_word: ἑαυτῷ
  choice: لنفسه
  rationale: يحفظ دلالة ضمير الانعكاس في اليونانية.
- source_word: βασιλείαν
  choice: المُلك
  rationale: يحتمل اللفظ اليوناني المملكة بوصفها حيزًا، أو المُلك والسلطان الملكي. وفي سياق السفر لتلقّي الاعتراف بالحكم، «المُلك» طبيعي ويحفظ الدلالة السياسية الأرجح.
- source_word: ὑποστρέψαι
  choice: ثم يعود
  rationale: الفعلان المنصوبان يعبّران عن غرض الرحلة وتسلسلها المقصود؛ و«ثم» تجعل العودة اللاحقة واضحة وطبيعية في العربية.
theological_decisions:
- issue: دلالة βασιλείαν في مثل ذي صورة سياسية
  choice: المُلك
  alternative: مملكة، أو سلطانًا ملكيًا
  rationale: السياق يصوّر رجلًا يسافر لينال صفة الحكم أو سلطانه ثم يرجع. اختيار «المُلك» يعبّر عن الحكم الملكي من غير حصر اللفظ في الإقليم، مع إثبات البدائل في الحاشية للمحافظة على اتساع الدلالة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «رجل من أسرة نبيلة» بدل «نبيل» لتوضيح دلالة شرف المولد، و«بلاد» لتجنب الإيحاء بالدولة القومية الحديثة.
