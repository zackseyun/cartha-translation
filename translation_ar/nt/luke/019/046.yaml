base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: ar
  text: 'قائلًا لهم: «مكتوب: ‹وسيكون بيتي بيتَ صلاة، أما أنتم فجعلتموه مغارةَ لصوص[a]›».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«مغارة لصوص» صدى لإرميا 7:11؛ ويمكن ترجمة «لصوص» أيضًا: «قطّاع طرق».'
    reason: cross_reference
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: قائلًا لهم
  rationale: يحافظ على صيغة اسم الفاعل المرتبطة بسياق الرواية السابق، بدل تحويلها إلى فعل مستقل.
- source_word: Γέγραπται
  choice: مكتوب
  rationale: صيغة عربية مألوفة وموجزة لإدخال اقتباس كتابي ذي سلطان، وتعكس دلالة التمام في المبني للمجهول.
- source_word: Καὶ ἔσται
  choice: وسيكون
  rationale: يحفظ الواو الواردة في نص الاقتباس، ويؤدي معنى المستقبل بصياغة عربية طبيعية.
- source_word: ὁ οἶκός μου
  choice: بيتي
  rationale: ترجمة مباشرة لكلمة οἶκος، وتحافظ على صدى إشعياء 56:7 بدل تفسير المرجع صراحةً بأنه الهيكل.
- source_word: οἶκος προσευχῆς
  choice: بيتَ صلاة
  rationale: تركيب عربي طبيعي يحفظ البنية والدلالة الأساسيتين لعبارة الاقتباس.
- source_word: ὑμεῖς δὲ
  choice: أما أنتم
  rationale: يبرز ضمير المخاطبين المؤكد ويعبّر بوضوح عن المقابلة مع قصد الله لبيته.
- source_word: ἐποιήσατε
  choice: فجعلتموه
  rationale: الماضي العربي طبيعي هنا، وضمير المفعول يوضح رجوع الكلام إلى البيت؛ والفاء تلائم نتيجة المقابلة في السياق العربي.
- source_word: σπήλαιον
  choice: مغارة
  rationale: تحفظ الصورة الحرفية لمكان اختباء اللصوص، وتنسجم مع صدى إرميا 7:11.
- source_word: λῃστῶν
  choice: لصوص
  rationale: تنقل المعنى العام دون تضييقه على قطّاع الطرق أو تحميله دلالة سياسية غير لازمة.
theological_decisions:
- issue: ترجمة وصف الهيكل بكلمة «بيت» أو التصريح بكلمة «هيكل»
  choice: بيتي ... بيتَ صلاة
  alternative: هيكلي ... هيكلًا للصلاة
  rationale: اليونانية تستعمل οἶκος، والاحتفاظ بـ«بيت» يصون الصلة النصية بإشعياء 56:7 ولا يحسم الصورة التفسيرية بتبديلها إلى «هيكل»، مع أن السياق يدل على الهيكل.
- issue: مدى تخصيص λῃστῶν
  choice: لصوص
  alternative: قطّاع طرق
  rationale: اللفظ قد يدل على لصوص أو قطّاع طرق؛ واختيار «لصوص» يحفظ اتساع الدلالة ولا يفرض معنى العنف المنظم أو التمرد السياسي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت صيغة الاقتباس الكتابي، واستُعمل «بيت» بدل «هيكل» التزامًا باللفظ اليوناني وصدى إشعياء 56:7. وُضع مؤشر الحاشية بعد العبارة التي تشرحها مباشرة.
