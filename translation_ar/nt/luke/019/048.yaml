translation:
  language: ar
  text: ولم يجدوا ما عساهم أن يفعلوا، لأن الشعب كله كان متعلّقًا به، منصتًا إليه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا، على نحو تقريبي: «كان الشعب كله متعلّقًا به وهو يستمع». وهذا تعبير يوناني يدلّ على شدة انتباه الشعب إلى يسوع وإصغائهم إليه بشغف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: لم يجدوا
  rationale: ينقل فعل «وجد» مع النفي، ويفيد في السياق استمرار عجزهم عن التوصل إلى مسار للعمل، من غير استبداله بفعل «عرف».
- source_word: τὸ τί ποιήσωσιν
  choice: ما عساهم أن يفعلوا
  rationale: صياغة عربية تحفظ نبرة التساؤل والتداول بشأن ما يمكنهم الإقدام عليه، بدل تسويتها إلى مجرد «ما يفعلون».
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: لأن الشعب كله
  rationale: تُظهر «لأن» التعليل الذي تؤديه γάρ، وتحفظ «الشعب» وشمول ἅπας.
- source_word: ἐξεκρέματο αὐτοῦ
  choice: كان مشدودًا إليه
  rationale: ينقل المعنى الاصطلاحي، أي شدة الانتباه والتعلّق بما يقوله يسوع، مع إبقاء الضمير عائدًا إليه هو، لا إضافة لفظ «كلماته» إلى المتن.
- source_word: ἀκούων
  choice: يصغي إليه
  rationale: «يصغي» أنسب من مجرد «يسمع» للدلالة على الاستماع بانتباه، وصيغة المفرد توافق الاسم الجمعي «الشعب» في العربية.
