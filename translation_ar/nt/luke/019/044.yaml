  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: ar
  text: ويسوّونكِ بالأرض، ويسوّون أولادكِ فيكِ، ولا يتركون فيكِ حجرًا على حجر، لأنكِ لم تعرفي زمان افتقادكِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تفقُّدكِ». يمكن أن يدل اللفظ اليوناني على زيارة أو تفقُّد، ولا سيما افتقاد إلهي قد يحمل الرحمة أو الدينونة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: يسوّونكِ بالأرض
  rationale: يفيد الفعل إسقاط الشيء إلى الأرض وهدمه هدمًا شاملًا؛ وهذه العبارة عربية طبيعية تحفظ قوة الصورة.
- source_word: σε
  choice: كِ
  rationale: يحافظ على الخطاب المباشر لأورشليم المشخَّصة، ويأتي التأنيث موافقًا لاسم المدينة في العربية دون استبدال الضمير بتفسير مثل «مدينتك».
- source_word: τὰ τέκνα σου ἐν σοί
  choice: أولادكِ الذين فيكِ
  rationale: يحفظ المعنى الحرفي لـ«الأولاد» وصورة المدينة الأم، بدل تسطيحها إلى «السكان»، ويبيّن أن المقصود من هم داخلها.
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: ولا يتركون فيكِ حجرًا على حجر
  rationale: صياغة عربية واضحة تحفظ التعبير التصويري الدال على الدمار التام، كما تُبقي «فيكِ» صريحة.
- source_word: ἀνθ’ ὧν
  choice: لأن
  rationale: تؤدي المعنى السببي المقصود في السياق بوضوح وطبيعية.
- source_word: ἔγνως
  choice: لم تعرفي
  rationale: يحفظ الدلالة الأساسية للفعل، وهي المعرفة أو الإدراك؛ والسياق يوضح أن المقصود عدم تمييز الحدث الحاسم.
- source_word: καιρὸν
  choice: زمان
  rationale: يدل على وقت ذي دلالة أو موعد حاسم، و«زمان» ملائم للأسلوب الكتابي الواضح من غير إضافة تفسيرية.
- source_word: τῆς ἐπισκοπῆς σου
  choice: افتقادكِ
  rationale: يحفظ «الافتقاد» دلالة الزيارة أو التفقد، ولا يحسم هل يحمل الافتقاد الرحمة أم الدينونة، كما يعكس ضمير المخاطب في اليونانية.
theological_decisions:
- issue: دلالة ἐπισκοπή في سياق الدينونة
  choice: افتقادكِ، مع إبقاء كون الافتقاد إلهيًا ضمنيًا
  alternative: تفقدكِ؛ أو الوقت الذي جاء الله فيه إليكِ
  rationale: قد يدل اللفظ على زيارة أو تفقد إلهي يحمل الرحمة أو الدينونة. والسياق يربطه بدينونة أورشليم، لكن التصريح باسم الله أو حصر المعنى في التفتيش يزيل توترًا قائمًا في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدم خطاب المؤنث لأن المخاطَبة هي أورشليم، وحُفظ تشخيص المدينة وصورة أولادها. وُضع مؤشر الحاشية بعد «افتقادكِ» لأنه يشرح هذا اللفظ.
