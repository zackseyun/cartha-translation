  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: ar
  text: 'قائلين: «مباركٌ الملكُ الآتي باسم الرب! سلامٌ في السماء، ومجدٌ في الأعالي!»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تتبع بعض الترجمات الصيغة الأشهر: «مبارك الآتي باسم الرب»، لكن نص لوقا يذكر «الملك» صراحة.'
    reason: alternative_reading
  - marker: b
    text: 'يتردد في هذا الهتاف صدى لوقا 2:14، لكنه يغيّر موضع السلام: هناك «على الأرض»، وهنا «في السماء».'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: قائلين
  rationale: اسم فاعل حالي يربط هتاف الجمع بما سبق، وتحافظ «قائلين» على الصيغة الإيجازية في اليونانية.
- source_word: Εὐλογημένος
  choice: مباركٌ
  rationale: صيغة ملائمة للهتاف التبريكي، وتحافظ على صدى لغة المزامير ودخول الملك.
- source_word: ὁ ἐρχόμενος
  choice: الآتي
  rationale: ترجمة اسمية طبيعية لاسم الفاعل المعرّف، وتلائم وصف «الملك» من غير زيادة تفسيرية.
- source_word: βασιλεὺς
  choice: الملكُ
  rationale: الكلمة مذكورة صراحة في نص لوقا، وإثباتها يحفظ الطابع الملكي للهتاف.
- source_word: ἐν ὀνόματι κυρίου
  choice: باسم الرب
  rationale: تعبير عربي مألوف يحفظ الخلفية السامية ودلالة المجيء باسم الرب وسلطانه، من غير تفكيك العبارة إلى شرح.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: سلامٌ في السماء
  rationale: يحفظ الجملة الاسمية الموجزة وموقع السلام في السماء، كما يرد في المصدر.
- source_word: δόξα ἐν ὑψίστοις
  choice: مجدٌ في الأعالي
  rationale: صياغة عربية راسخة ومفهومة تحفظ التعبير عن العوالم العلوية وصدى لوقا 2:14.
theological_decisions:
- issue: الهتاف الملكي المسياني عند الدخول إلى أورشليم
  choice: إثبات «الملك» صراحة
  alternative: «مبارك الآتي باسم الرب» من دون «الملك»
  rationale: يتضمن النص اليوناني βασιλεὺς صراحة؛ وحذفها يضعف التشديد الملكي الخاص بصياغة لوقا.
- issue: العلاقة بلوقا 2:14
  choice: «سلامٌ في السماء»
  alternative: «سلامٌ على الأرض»
  rationale: يقول المصدر «في السماء» بوضوح. وتحافظ الترجمة على هذا الاختلاف والتوتر النصي بدل مواءمته مع نشيد الميلاد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على الإيقاع الهتافي والجمل الاسمية الموجزة. وُضعت علامتا الحاشيتين بعد الاقتباس لأن الأولى تتصل بصيغة الهتاف كله، والثانية بالشطر الأخير وعلاقته بلوقا 2:14.
