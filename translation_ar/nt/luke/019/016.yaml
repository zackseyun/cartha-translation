base_translation:
  language: en
  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: ar
  text: 'ثم جاء الأول وقال: «يا سيدي[a]، مَنَاكَ[b] ربحت عشرة أمناء.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا رب». يمكن أن يكون اللقب اليوناني κύριε نداء احترام لمن له سلطة، كما يمكن ترجمته «يا رب».'
    reason: alternative_reading
  - marker: b
    text: المَنَا وحدة نقدية قديمة، وجمعها هنا «أمناء».
    reason: historical_term
lexical_decisions:
- source_word: παρεγένετο
  choice: جاء
  rationale: يفيد الفعل المجيء أو الوصول، و«جاء» أنسب للسرد العربي الطبيعي في سياق مثول الخادم أمام سيده.
- source_word: δὲ
  choice: ثم
  rationale: تدل الأداة هنا على تقدّم أحداث السرد، وتنقل «ثم» هذا التتابع بوضوح.
- source_word: ὁ πρῶτος
  choice: الأول
  rationale: يشير التعبير إلى أول الخدم في ترتيب المثول، ويكفي في العربية أن يقال «الأول».
- source_word: λέγων
  choice: وقال
  rationale: تحويل اسم الفاعل اليوناني المصاحب للفعل الرئيس إلى فعل معطوف أسلوب عربي طبيعي يحفظ تزامن المجيء والكلام.
- source_word: Κύριε
  choice: يا سيدي
  rationale: النداء موجّه داخل المثل إلى صاحب سلطة، فـ«يا سيدي» يؤدي معنى المخاطبة الاحترامية طبيعيًا، مع إثبات «يا رب» احتمالًا في الحاشية.
- source_word: ἡ μνᾶ σου
  choice: مَنَاكَ
  rationale: يحافظ نقل اسم الوحدة النقدية القديمة على خصوصيتها التاريخية، وتبيّن كاف الخطاب أن رأس المال ملك للسيد.
- source_word: δέκα προσηργάσατο μνᾶς
  choice: ربحت عشرة أمناء
  rationale: يفيد προσεργάζομαι تحقيق كسب إضافي بالعمل. وإسناد «ربحت» إلى المَنَا يحفظ الصورة اليونانية التي تجعل المبلغ الأصلي هو الذي حقق العائد، من غير إضافة لفظ «أخرى» غير الموجود صراحة.
theological_decisions:
- issue: ترجمة κύριος في نداء داخل المثل
  choice: يا سيدي
  alternative: يا رب
  rationale: لا يقتضي السياق أن يكون النداء اعترافًا لاهوتيًا؛ فاللفظ اليوناني قد يكون لقب احترام لمن له سلطة. ومع ذلك يبقى «يا رب» ترجمة ممكنة، ولذلك ذُكرت في الحاشية بدل إلغاء هذا الاحتمال.
- issue: هل العشرة أمناء هي مجموع المال أم ربح إضافي؟
  choice: ربحت عشرة أمناء
  alternative: أنتجت عشرة أمناء أخرى
  rationale: الفعل المركب προσεργάζομαι يحمل معنى الكسب الناتج أو الإضافي، لكن النص لا يذكر لفظًا مستقلًا بمعنى «أخرى». تحافظ الصياغة المختارة على مقدار الربح المذكور من غير أن تحسم حساب المجموع بصياغة تفسيرية زائدة.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ذات نبرة سردية موقرة. استُعمل «وقال» بدل البنية الحرفية «قائلًا» لسلاسة الأسلوب، وأُبقي اسم الوحدة النقدية التاريخية مع شرح موجز في الحاشية.
