  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: ar
  text: لأنه ستأتي عليك أيامٌ، سيقيم أعداؤك فيها ضدك سياجًا للحصار[a]، ويحيطون بك، ويضيّقون عليك من كل جهة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «متراسًا ضدك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لأنه
  rationale: تربط النبوءة بما قبلها على أنها تعليل لرثاء يسوع، مع الحفاظ على القوة السببية للأداة اليونانية.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: ستأتي عليك أيامٌ
  rationale: صياغة عربية واضحة تحافظ على الأسلوب النبوي وعلى صورة الأيام الآتية على أورشليم.
- source_word: παρεμβαλοῦσιν
  choice: يبني
  rationale: مع «متراسًا» يدل الفعل في السياق على إنشاء أعمال حصار؛ و«يبني» تعبير طبيعي واضح في العربية المعاصرة.
- source_word: οἱ ἐχθροί σου
  choice: أعداؤك
  rationale: نقل مباشر للعبارة الإضافية الدالة على القوات المعادية لأورشليم.
- source_word: χάρακά σοι
  choice: متراسًا ضدك
  rationale: يدل χάραξ هنا على منشأة عسكرية تُقام للحصار، وتبيّن «ضدك» معنى الضرر في صيغة المفعول غير المباشر.
- source_word: περικυκλώσουσίν σε
  choice: يحيطون بك
  rationale: ينقل فعل التطويق العسكري بلغة عربية مألوفة ومباشرة.
- source_word: συνέξουσίν σε πάντοθεν
  choice: يضيّقون عليك من كل جهة
  rationale: يحافظ على معنى إحكام الخناق والضغط من جميع النواحي من غير دمجه في مجرد الإحاطة المذكورة قبله.
theological_decisions:
- issue: مرجع ضمائر المخاطب المفرد في رثاء يسوع لأورشليم
  choice: الإبقاء على خطاب المفرد كما في اليونانية، بحيث تُخاطَب أورشليم بوصفها مدينة مشخصنة.
  alternative: توسيع الضمائر لتشير صراحةً إلى سكان المدينة بصيغة الجمع.
  rationale: السياق اليوناني يستخدم المفرد في مخاطبة أورشليم، والإبقاء عليه يصون القوة النبوية والأدبية دون حسم المرجع على أنه السكان وحدهم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة نبوية رصينة. استُخدمت أفعال متمايزة للإحاطة والتضييق حفاظًا على تتابع الأفعال في الأصل، ووُضع مؤشر الحاشية [a] مباشرة بعد العبارة التي يشرحها.
