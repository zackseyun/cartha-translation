- from: لأنه ستأتي عليك أيامٌ يبني فيها أعداؤك متراسًا ضدك[a]، ويحيطون بك، ويضيّقون عليك من كل جهة.
  to: لأنه ستأتي عليك أيامٌ، سيقيم أعداؤك فيها ضدك سياجًا للحصار[a]، ويحيطون بك، ويضيّقون عليك من كل جهة.
  rationale: يصحح التعديل ترتيب الإسناد في العربية ويجعل صورة عمل الحصار أوضح، مع الحفاظ على العلاقة السببية لـ«لأنه»، وعلى المخاطَب المفرد، وعلى الأفعال الثلاثة المتتابعة في النص اليوناني. وُضع مؤشر الحاشية عقب العبارة التي يشرحها.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:32:23Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام منقول بأمانة، بما في ذلك خطاب المفرد إلى أورشليم المشخَّصة، وتسلسل إقامة أعمال الحصار ثم التطويق ثم التضييق من كل الجهات. لكن تركيب «ستأتي عليك أيامٌ يبني فيها أعداؤك» يجعل «أيام» إطارًا زمنيًا مباشرًا لفعل البناء على نحو أقل سلاسة، والأدق أن يُسند الفعل إلى الأعداء بعد الجملة التمهيدية.
  naturalness: اللغة فصيحة معاصرة في الجملة، لكن إعادة ترتيب الجملة إلى «ستأتي عليك أيامٌ، سيقيم أعداؤك فيها...» أوضح وأفصح. كما أن «سياجًا للحصار» أوضح للقارئ المعاصر من «متراسًا» بوصفه عمل حصار محيطًا، مع إبقاء «متراسًا» بديلًا في الحاشية.
  terminology: «يحيطون بك» و«يضيّقون عليك من كل جهة» يحافظان على تمييز الفعلين اليونانيين. واستعمال «سياج للحصار» يعبّر عن χάραξ في سياقه العسكري دون تحميل المصطلح تحديدًا هندسيًا غير لازم.
  issues:
  - severity: medium
    issue: موضع الجملة الموصولة «يبني فيها أعداؤك» بعد «أيام».
    rationale: لا يخطئ المعنى، لكنه أقل مباشرة في العربية ويُضعف الإسناد الواضح لفعل إقامة عمل الحصار إلى الأعداء. إعادة الصياغة تحافظ على المعنى والزمن النبوي.
  - severity: low
    issue: «متراسًا» قد لا يعيّن بوضوح عمل الحصار المقصود بـ χάραξ.
    rationale: المتراس في الاستعمال الحديث قد يُفهم ساترًا دفاعيًا موضعيًا؛ لذلك يُفضَّل في المتن تعبير أوضح مثل «سياجًا للحصار»، مع ذكر «متراسًا» بديلًا معجميًا في الحاشية.
  revised_text: لأنه ستأتي عليك أيامٌ، سيقيم أعداؤك فيها ضدك سياجًا للحصار[a]، ويحيطون بك، ويضيّقون عليك من كل جهة.
