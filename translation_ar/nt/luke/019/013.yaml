base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: ar
  text: 'ثم دعا عشرةً من عبيده، وأعطاهم عشرَ مَنَواتٍ[a]، وقال لهم: «تاجروا بها[b] إلى أن آتي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المَنَا وحدة نقدية قديمة.
    reason: cultural_note
  - marker: b
    text: 'أو: «اتَّجروا حتى آتي» أو «اشتغلوا بالتجارة حتى آتي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: ثم دعا
  rationale: اسم الفاعل الماضي يسبق الفعل الرئيس ويدل على تعاقب الحدثين؛ و«ثم دعا» صياغة عربية طبيعية تحفظ هذا التسلسل.
- source_word: δούλους ἑαυτοῦ
  choice: من عبيده
  rationale: «عبيد» يحفظ علاقة الملكية الاجتماعية الظاهرة في سياق المثل، و«من عبيده» ينقل دلالة ἑαυτοῦ من غير حشو غير طبيعي.
- source_word: μνᾶς
  choice: مَنَوات
  rationale: تعريب اسم الوحدة النقدية القديمة يحفظ الخصوصية التاريخية ويتجنب مساواتها بعملة حديثة.
- source_word: Πραγματεύσασθε
  choice: تاجروا بها
  rationale: الأمر يدل على ممارسة التجارة أو تشغيل المال المعهود إليهم؛ وإضافة «بها» مفهومة من السياق وتجعل العبارة طبيعية واضحة بالعربية.
- source_word: ἐν ᾧ ἔρχομαι
  choice: إلى أن آتي
  rationale: هذا التركيب الزمني يُفهم اصطلاحيًا بمعنى استمرار العمل حتى مجيء المتكلم، لا بمعنى مكاني أو حرفي جامد.
theological_decisions:
- issue: ترجمة δοῦλος في إطار علاقة السيد بالعبد في المثل
  choice: عبيد
  alternative: خدم
  rationale: السياق يصور أشخاصًا تابعين لسيدهم ويتصرفون في ماله؛ لذلك تنقل «عبيد» الواقع الاجتماعي المقصود بوضوح، من غير إقحام دلالة مذهبية لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «عبيد» بدل «خدم» حفاظًا على إطار الملكية في المثل، و«مَنَوات» بوصفها جمعًا عربيًا لاسم الوحدة النقدية المعرَّبة. وُضعت علامتا الحاشيتين بعد الجملة مع ورود كلتيهما في النص.
