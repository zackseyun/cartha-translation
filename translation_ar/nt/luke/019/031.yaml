id: LUK.19.31
reference: Luke 19:31
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: ar
  text: 'وإن سألكم أحد: «لماذا تحلّونه؟» فقولوا هكذا: «الرب[a] محتاج إليه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «السيد محتاج إليه».'
    reason: يحمل κύριος أيضًا معنى «السيد» بحسب فهم المقام.
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: سألكم
  rationale: فعل عربي طبيعي للسؤال، ويلائم دخول الكلام المباشر.
- source_word: Διὰ τί
  choice: لماذا
  rationale: المقابل الاستفهامي الموجز والطبيعي للعبارة اليونانية.
- source_word: λύετε
  choice: تحلّونه
  rationale: السياق هو حلّ الجحش المربوط؛ أُظهر المفعول بضمير يعود إلى الجحش لوضوح العربية.
- source_word: οὕτως ἐρεῖτε
  choice: فقولوا هكذا
  rationale: ينقل المستقبل ذا القوة الإرشادية، ويحافظ على معنى «على هذا النحو» من غير تكلّف.
- source_word: κύριος
  choice: الرب
  rationale: يحفظ اللقب واحتماله اللاهوتي في استعمال لوقا، مع بقاء احتمال المعنى العادي «السيد» مذكورًا في الحاشية.
- source_word: αὐτοῦ
  choice: إليه
  rationale: الضمير يعود في الأرجح إلى الجحش، والتعبير العربي الاصطلاحي هو «محتاج إليه».
- source_word: χρείαν ἔχει
  choice: محتاج إليه
  rationale: صياغة عربية واضحة تحافظ على تركيب الاحتياج، بدل العبارة الأثقل «له حاجة إليه».
theological_decisions:
- issue: دلالة Ὁ κύριος
  choice: الرب
  alternative: السيد
  rationale: يرجح السياق واستعمال لوقا الإشارة إلى يسوع بلقب «الرب»، لكن اللفظ اليوناني يمكن في ذاته أن يعني «السيد»، ولذلك لم يُطمس هذا الاحتمال.
translation_notes:
  register: 'عربية فصحى معاصرة واضحة ومهيبة. استُعمل «تحلّونه» بالمعنى السياقي: تفكون رباطه، وحُفظت صيغة الجواب المباشر والتوتر الدلالي في κύριος بواسطة الحاشية.'
