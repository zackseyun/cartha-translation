  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: ar
  text: وكان يعلِّم كلَّ يوم في الهيكل. أمّا رؤساء الكهنة والكتبة ووجهاء الشعب، فكانوا يسعون إلى إهلاكه،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: كان يعلِّم
  rationale: تركيب فعلي محيطي بصيغة الماضي الناقص، يدل على فعل مستمر أو متكرر في الزمن الماضي؛ وتحفظ العربية هذا المعنى بتركيب «كان يعلِّم».
- source_word: τὸ καθ’ ἡμέραν
  choice: كلَّ يوم
  rationale: تعبير توزيعي يفيد التكرار يومًا بعد يوم، و«كل يوم» صياغة عربية طبيعية واضحة.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: يشير ἱερόν إلى مجمّع الهيكل لا إلى المقدس الداخلي وحده، و«الهيكل» هو المقابل العربي المألوف الذي يظل موجزًا.
- source_word: οἱ ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: تعبير عربي راسخ يدل على طبقة القيادة الكهنوتية، لا على تعدد شاغلي منصب رئيس الكهنة بالمعنى الحرفي الضيق.
- source_word: οἱ γραμματεῖς
  choice: الكتبة
  rationale: مقابل مباشر ومألوف للفظ اليوناني، ويتجنب التفسير الأوسع «معلّمو الشريعة».
- source_word: ἐζήτουν
  choice: كانوا يسعون
  rationale: يحفظ دلالة الماضي الناقص على المحاولة المستمرة، كما يبقي معنى الطلب والسعي دون زيادة تفسيرية.
- source_word: ἀπολέσαι
  choice: إهلاكه
  rationale: يحفظ المجال الدلالي للفعل، الذي قد يعني الإهلاك أو القتل بحسب السياق، من غير حصره صراحة في طريقة بعينها.
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: وجهاء الشعب
  rationale: المعنى الحرفي «أوائل الشعب» يشير هنا إلى ذوي المكانة والنفوذ. و«وجهاء الشعب» تعبير عربي طبيعي يدل على الرجال البارزين اجتماعيًا من غير إدخال منصب رسمي غير مذكور.
theological_decisions:
- issue: الدلالة الجندرية والاجتماعية في οἱ πρῶτοι τοῦ λαοῦ
  choice: وجهاء الشعب
  alternative: قادة الشعب
  rationale: «وجهاء» جمع مذكر يدل في هذا السياق التاريخي على الرجال ذوي المكانة والنفوذ، ويحفظ طابع العبارة الاجتماعي أكثر من «قادة»، التي قد توحي بمنصب قيادي رسمي.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «أمّا ... فـ» لإظهار المقابلة التي تفيدها δέ بصورة طبيعية، مع الإبقاء على الفاصلة الختامية لأن الآية تتصل نحويًا بما بعدها.
