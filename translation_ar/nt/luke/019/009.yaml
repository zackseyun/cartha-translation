lexical_decisions:
- source_word: εἶπεν δὲ
  choice: فقال
  rationale: الفاء تربط القول بالسياق السردي ربطًا خفيفًا وطبيعيًا، من غير أن تضيف تعارضًا قويًا.
- source_word: πρὸς αὐτὸν
  choice: له
  rationale: تحافظ على الضمير الصريح في اليونانية من غير إضافة اسم زكّا غير الوارد في الآية.
- source_word: Σήμερον
  choice: اليوم
  rationale: المقابل العربي الطبيعي، ويحفظ التقديم الزمني والتوكيد في صدر الكلام.
- source_word: σωτηρία
  choice: الخلاص
  rationale: يحفظ الدلالة اللاهوتية الواسعة للكلمة في إنجيل لوقا، بدل حصرها في مجرد النجاة.
- source_word: τῷ οἴκῳ τούτῳ
  choice: لهذا البيت
  rationale: ينقل صيغة المجرور الدالة على الجهة المنتفعة ويحافظ على المقابل المباشر لكلمة οἶκος، التي قد تعني المسكن أو أهل البيت.
- source_word: ἐγένετο
  choice: صار
  rationale: ينقل معنى γίνομαι الأقرب، أي حدث أو أصبح واقعًا، من غير أن يفرض استعارة المجيء غير الصريحة في الفعل اليوناني.
- source_word: καθότι
  choice: لأنه
  rationale: يعبّر بوضوح عن العلاقة التعليلية في النص.
- source_word: καὶ αὐτὸς
  choice: هو أيضًا
  rationale: 'يحفظ معنى الإدراج والتوكيد: هذا الرجل داخل أيضًا في الوصف المذكور.'
- source_word: υἱὸς Ἀβραάμ
  choice: ابنٌ لإبراهيم
  rationale: يحافظ على التعبير المفرد المذكر وعلى صداه النسبي والعهدي، من غير اختزاله في معنى واحد.
theological_decisions:
- issue: دلالة «ابن لإبراهيم»
  choice: الإبقاء على التعبير كما هو بوصفه تعبيرًا عن النسب أو الهوية العهدية، أو كليهما، دون حسم.
  alternative: ترجمته «من نسل إبراهيم» أو تفسيره بأنه «من أهل إيمان إبراهيم».
  rationale: الآية لا تحصر العبارة صراحةً في النسب الجسدي ولا في الانتماء الإيماني؛ لذلك يحفظ النص العربي التوتر الدلالي واللاهوتي.
- issue: نطاق الخلاص في «لهذا البيت»
  choice: الإبقاء على «البيت» مع بيان احتمال معنى أهل البيت في الحاشية.
  alternative: ترجمته في المتن «لهذه الأسرة» وحصر المرجع في أهل المنزل.
  rationale: كلمة οἶκος تحتمل المكان ومن يرتبطون به، ولا يحدد السياق هنا النطاق تحديدًا يبرر إسقاط أحد المعنيين.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «صار الخلاص» لصلة أوثق بالفعل اليوناني، مع الحفاظ على طبيعية العبارة، وأُبقي «ابن لإبراهيم» دون تفسير مذهبي.
