lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: وفيما هو سائر
  rationale: تركيب المضاف إليه المطلق مع اسم الفاعل الحاضر يدل على فعل متزامن مستمر؛ وتنقل العبارة العربية هذا المعنى الزمني بصياغة طبيعية، مع تمثيل δέ بواو السرد.
- source_word: ὑπεστρώννυον
  choice: كانوا يفرشون
  rationale: صيغة الماضي الناقص اليونانية تصوّر فعلًا جاريًا أو متكررًا في المشهد، وهو ما تنقله «كانوا يفرشون».
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: ثيابهم
  rationale: ἱμάτια لفظ عام للثياب، وقد يشير في السياق إلى الثياب الخارجية؛ واختيار «ثيابهم» يحفظ سعة الدلالة دون تخصيص زائد.
- source_word: ἐν τῇ ὁδῷ
  choice: على الطريق
  rationale: يدل التركيب على موضع فرش الثياب، و«على الطريق» هي العبارة العربية الطبيعية الواضحة في هذا السياق.
