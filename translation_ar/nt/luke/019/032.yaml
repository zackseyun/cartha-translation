lexical_decisions:
- source_word: ἀπελθόντες
  choice: فذهب
  rationale: اسم فاعل ماضٍ من ἀπέρχομαι يدل على الذهاب أو الانطلاق؛ وصيغة «فذهب» طبيعية في السرد العربي وتوصل تعاقب الحدث.
- source_word: δὲ
  choice: الفاء في «فذهب»
  rationale: تفيد δέ هنا الانتقال السردي، وتؤديه الفاء العربية بسلاسة من غير إثقال العبارة بأداة مستقلة.
- source_word: οἱ ἀπεσταλμένοι
  choice: اللذان أُرسلا
  rationale: اسم فاعل تام مبني للمجهول مستعمل استعمال الاسم. يوضح السياق السابق أن المرسلين اثنان، فحُفظ معنى المبني للمجهول بصياغة عربية طبيعية.
- source_word: εὗρον
  choice: فوجدا الأمر
  rationale: معنى الفعل «وجدا». لا يذكر اليوناني مفعولًا به صريحًا؛ وإضافة «الأمر» تحافظ على سلاسة العربية مع إبقاء المرجع عامًا، وتوضح الحاشية إمكان فهم المفعول من السياق على أنه الجحش.
- source_word: καθὼς
  choice: كما
  rationale: تدل على المطابقة بين ما وجداه وما سبق أن قاله يسوع. «كما» تؤدي المقارنة بوضوح من غير إضافة توكيد غير مصرح به.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهما
  rationale: ترجمة مباشرة للفعل λέγω مع الضمير. استُعمل المثنى لأن المخاطبين، بحسب السياق، اثنان؛ والماضي العربي يلائم تسلسل السرد من غير حاجة إلى تركيب زائد.
