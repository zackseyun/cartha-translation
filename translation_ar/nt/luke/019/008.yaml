source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: ar
  text: 'أما زكّا فوقف وقال للرب: «انظر يا رب، إني أعطي نصف ممتلكاتي للفقراء، وإن كنت قد ابتززتُ من أحدٍ شيئًا[a]، أردّ أربعة أضعافه[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خدعتُ أحدًا فاستوليتُ على شيء منه». يمكن أن يدل الفعل اليوناني على الابتزاز أو الاستغلال أو الاحتيال، وأحيانًا يكون ذلك باتهام كاذب.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا فهم فعلي المضارع اليونانيين بمعنى: «سأعطي» و«سأردّ»، تعبيرًا عن عزم فوري.'
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: فوقف
  rationale: اسم فاعل ماضٍ من ἵστημι مستعمل هنا استعمالًا لازمًا؛ و«وقف» تنقل الفعل السردي بإيجاز من غير تحديد زائد لما إذا كان قد نهض أو توقف.
- source_word: κύριον / κύριε
  choice: للرب / يا رب
  rationale: يحافظ «الرب» على اللقب في السرد والنداء، بما يترك مجاله الدلالي مفتوحًا بين خطاب الاحترام والدلالة الأعمق في سياق لوقا.
- source_word: Ἰδοὺ
  choice: انظر
  rationale: أداة استرعاء وانتباه ذات نبرة توكيدية؛ و«انظر» عربية معاصرة واضحة تؤدي وظيفتها من غير أسلوب عتيق.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: نصف ممتلكاتي
  rationale: تعبير عربي موجز وطبيعي ينقل معنى الملكية ودلالة الجزء من الكل.
- source_word: τοῖς πτωχοῖς
  choice: للفقراء
  rationale: ينقل الاستعمال الاسمي القياسي للصفة πτωχός والإحالة الاجتماعية والاقتصادية بوضوح.
- source_word: δίδωμι
  choice: أعطي
  rationale: يحافظ المضارع العربي على صيغة المضارع اليوناني، ولا يحسم هل الكلام وصف لممارسة حاضرة أم إعلان عزم فوري.
- source_word: εἴ τινός τι
  choice: إن كنت قد ... من أحدٍ شيئًا
  rationale: ينقل الشرط والنكرتين في التركيب اليوناني بصياغة عربية سليمة وواضحة.
- source_word: ἐσυκοφάντησα
  choice: ابتززتُ
  rationale: يدل الفعل على الابتزاز أو الاستغلال أو الاحتيال، وقد يرتبط بالاتهام الكاذب؛ و«ابتززت» يلائم سياق جباية الضرائب وردّ المال، مع إثبات البديل في الحاشية.
- source_word: ἀποδίδωμι
  choice: أردّه
  rationale: ينقل معنى إعادة الشيء إلى صاحبه وردّه، ويلائم سياق التعويض المالي، مع إبقاء الفعل في المضارع.
- source_word: τετραπλοῦν
  choice: أربعة أضعاف
  rationale: صياغة عربية واضحة ودقيقة لمعنى الرد الرباعي.
theological_decisions:
- issue: دلالة فعلي المضارع δίδωμι وἀποδίδωμι
  choice: أعطي ... أردّه
  alternative: سأعطي ... سأردّه، أو أنا أعطي ... وأنا أردّه
  rationale: الأصل يستعمل المضارع الخبري. ويحافظ المضارع العربي على إمكان أن يصف زكّا ممارسة قائمة أو يعبر عن قرار فوري، فلا يُحسم بذلك الجدل المتصل بما إذا كان كلامه دفاعًا عن سلوكه السابق أم علامة توبة مستجدة.
- issue: دلالة κύριος في مخاطبة يسوع
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحافظ على اللقب الذي يستعمله لوقا ولا يختزله في مجرد صيغة تهذيب، مع عدم فرض تفسير لاهوتي يتجاوز السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، بصياغة طبيعية غير متكلفة. أُبقي المضارع في المتن حفاظًا على غموض الأصل المقصود، ووُضعت علامتا الحاشيتين عند اللفظ والفعل المعنيين مباشرة.
