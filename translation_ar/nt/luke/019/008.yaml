  verdict: revise
  source_fidelity: 'المتن ينقل عناصر النص اليوناني الأساسية بأمانة: وقوف زكّا، وخطابه إلى الرب، وإعطاء نصف الممتلكات للفقراء، والشرط المتعلق بأخذ شيء من أحد، والرد الرباعي. واختيار المضارع في «أعطي» و«أردّ» يحفظ عمدًا إمكان القراءة الحاضرة أو قراءة العزم الفوري. لكن «أردّه أربعة أضعاف» أقل صراحة في الدلالة على مقدار التعويض؛ فـ«أردّ أربعة أضعافه» أوضح في نقل τετραπλοῦν.'
  naturalness: الصياغة فصيحة معاصرة في الجملة. غير أن بديل الحاشية «احتلتُ على أحدٍ في شيء» غير مألوف هنا ولا يؤدي بدقة معنى الاحتيال/الاستلاب الواقع على شخص في شأن أو مال. كما أن وضع علامة الحاشية الخاصة بزمني الفعلين بعد العبارة الختامية وحدها أضعف من وضعها بعد الفعل الثاني، مع أن الحاشية تشرح الفعلين معًا.
  terminology: «الرب»، و«ممتلكاتي»، و«الفقراء»، و«ابتززتُ» خيارات سليمة. ويُستحسن أن تصوغ الحاشية البديل المعجمي بعبارة عربية طبيعية مثل «خدعتُ أحدًا فاستوليتُ على شيء منه»، مع إبقاء التنبيه إلى الاتهام الكاذب.
