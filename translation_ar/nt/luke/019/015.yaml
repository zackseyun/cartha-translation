reference: Luke 19:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: ar
  text: ولمّا رجع بعد أن تسلَّم المُلك[a]، أمر أن يُدعى إليه أولئك العبيد[b] الذين كان قد أعطاهم المال، ليعرف ماذا حقَّقوا من تجارتهم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: السلطة الملكية أو حق الحكم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الخدم». اللفظ اليوناني يدل على عبيد أو خدم خاضعين لسلطة سيدهم.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «ماذا ربحوا» أو «ما الأعمال التجارية التي أجروها». يشمل الفعل اليوناني مزاولة التجارة وما نتج عنها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: ولمّا رجع
  rationale: تؤدي «لمّا» الوظيفة الزمنية للتركيب ذي المصدر المعرّف، أما صيغة ἐγένετο السردية فلا تحتاج إلى مقابل مستقل في العربية، إذ يكون حذفها أفصح من «وحدث أنه» هنا.
- source_word: λαβόντα τὴν βασιλείαν
  choice: بعد أن تسلَّم المُلك
  rationale: يبين «بعد أن» أن تسلُّم المُلك سبق الأمر باستدعاء العبيد، و«تسلَّم» أنسب من «أخذ» في سياق نيل السلطة الملكية.
- source_word: βασιλείαν
  choice: المُلك
  rationale: يدل اللفظ في سياق المثل على المنصب أو السلطان الملكي الذي ناله الرجل، و«المُلك» موجز وطبيعي ويحفظ الصلة بفكرة المملكة دون حصره في إقليم.
- source_word: φωνηθῆναι αὐτῷ
  choice: أن يُدعى إليه
  rationale: يحفظ صيغة المبني للمجهول ومعنى الاستدعاء إلى حضرته بعبارة عربية واضحة.
- source_word: δούλους
  choice: العبيد
  rationale: يدل δοῦλος هنا على أشخاص خاضعين لسلطة السيد وليس مجرد عاملين مأجورين؛ لذلك تنقل «العبيد» الوضع الاجتماعي بوضوح، مع إثبات البديل السياقي في الحاشية.
- source_word: δεδώκει τὸ ἀργύριον
  choice: كان قد أعطاهم المال
  rationale: تنقل «كان قد أعطاهم» دلالة الماضي الأسبق، و«المال» هو المعنى السياقي الطبيعي لـἀργύριον بدل الترجمة الحرفية «الفضة».
- source_word: ἵνα γνοῖ
  choice: ليعرف
  rationale: صيغة الغرض العربية الموجزة تنقل بوضوح قصد السيد من استدعائهم.
- source_word: τί διεπραγματεύσαντο
  choice: ماذا حقَّقوا من تجارتهم
  rationale: يحمل الفعل معنى مزاولة التجارة وما نتج عنها؛ وتحفظ الصياغة العربية النشاط ونتيجته من غير أن تفترض أن كل واحد منهم ربح بالضرورة.
theological_decisions:
- issue: دلالة βασιλεία في سياق ذهاب الرجل النبيل ورجوعه
  choice: المُلك
  alternative: السلطة الملكية أو الملوكية
  rationale: السياق سياسي مَثَلي، والمراد على الأرجح نيل حق الحكم أو المنصب الملكي. «المُلك» يحفظ سعة اللفظ ولا يحوله إلى إقليم مادي فقط.
- issue: ترجمة δοῦλος في علاقة السيد بمن ائتمنهم على ماله
  choice: العبيد
  alternative: الخدم
  rationale: سلطة الرجل عليهم ووصفهم بـδοῦλοι يرجحان إبراز وضعهم التابع، مع إبقاء «الخدم» بديلاً ممكنًا بحسب الاستعمال السياقي، من غير تحميل المثل استنتاجًا لاهوتيًا إضافيًا.
- issue: هل يدل διεπραγματεύσαντο على الربح وحده أم على النشاط التجاري ونتيجته
  choice: ماذا حقَّقوا من تجارتهم
  alternative: ماذا ربحوا أو ما الأعمال التجارية التي أجروها
  rationale: الصياغة المختارة تشمل نتيجة الاتجار لكنها لا تحسم مسبقًا أن النتيجة ربح، وبذلك تحفظ اتساع التعبير اليوناني والتوتر السردي.
translation_notes:
  register: صياغة عربية فصحى معاصرة ذات نبرة سردية كريمة وواضحة. استُغني عن مقابل حرفي مستقل لصيغة ἐγένετο لأنها افتتاحية سردية يؤدي معناها اتصال الجملة بـ«ولمّا»، وحُفظت الفروق الدلالية المهمة في الحواشي.
