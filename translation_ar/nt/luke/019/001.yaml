- source_word: τὴν Ἰεριχώ
  choice: أريحا
  rationale: اسم المدينة المعروف عربيًا، وهو مفعول حركة الاجتياز؛ ورد أولًا اسمًا صريحًا ثم عاد إليه الضمير في «يجتازها» وفق الأسلوب العربي الطبيعي.
