  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: أداة ربط سردية تواصل تسلسل الأحداث من غير إضافة دلالة تفسيرية.
- source_word: εἰπὼν ταῦτα
  choice: بعدما قال هذا
  rationale: ينقل اسم الفاعل الماضي بوصفه فعلًا سابقًا للفعل الرئيس، وتعود «هذا» طبيعيًا على الكلام السابق مع بقاء الإحالة عامة.
- source_word: ἐπορεύετο
  choice: مضى
  rationale: فعل عربي طبيعي يدل على مواصلة السير في السياق السردي، ويلائم دلالة صيغة الماضي الناقص اليونانية من غير إثقال العبارة.
- source_word: ἔμπροσθεν
  choice: متقدِّمًا
  rationale: يحفظ معنى السير في المقدمة؛ ولا يصرّح بالمرافقين لأنهم مفهومون من السياق وغير مذكورين في العبارة اليونانية نفسها.
- source_word: ἀναβαίνων
  choice: صاعدًا
  rationale: يحافظ على صورة الصعود إلى أورشليم وعلى تزامن هذا الفعل مع المضي.
- source_word: εἰς Ἱεροσόλυμα
  choice: إلى أورشليم
  rationale: تفيد الحركة نحو المقصد، ولا تفترض أن دخول المدينة قد وقع في هذه اللحظة.
theological_decisions:
- issue: الحفاظ على لغة الصعود إلى أورشليم
  choice: صاعدًا إلى أورشليم
  alternative: متجهًا إلى أورشليم
  rationale: يحفظ التعبير المكاني في الأصل وما قد يحمله ضمن السياق اللوقاوي من صدى سردي، من غير التصريح بدلالة لاهوتية زائدة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «مضى متقدِّمًا» بدل تركيب أثقل مثل «كان يسير أمامهم»، تجنبًا لإضافة ضمير غير مصرح به، مع إبقاء حركة السرد وصورة الصعود.
