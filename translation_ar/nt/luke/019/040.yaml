review_pass:
  verdict: revise
  source_fidelity: 'الترجمة تنقل عناصر النص اليوناني الأساسية بأمانة: فعل الردّ متبوعًا بالقول، وصيغة «أقول لكم»، والشرط المتعلق بهؤلاء، والصورة غير المفسَّرة لصراخ الحجارة. غير أن «صمت هؤلاء» غير مشكولة وقد تُقرأ اسمًا («صمتُ هؤلاء») بدل فعل ماضٍ في أسلوب الشرط، فتضعف وضوح الشرط المستقبلي المقصود من σιωπήσουσιν.'
