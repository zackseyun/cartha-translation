  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: ar
  text: 'فأجاب وقال: «أقول لكم: إن سكت هؤلاء، فستصرخ الحجارة».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: فأجاب
  rationale: يحفظ معنى الردّ في صيغة اسم الفاعل اليونانية، ويأتي طبيعيًا مع الفعل الرئيس «وقال».
- source_word: εἶπεν
  choice: وقال
  rationale: يمثل الفعل الرئيس في اليونانية، بينما تحمل «فأجاب» دلالة الردّ، وبذلك يُحفظ العنصران من غير دمجهما.
- source_word: Λέγω ὑμῖν
  choice: أقول لكم
  rationale: صيغة عربية مباشرة ومهيبة تحافظ على قوة العبارة التوكيدية الشائعة في الأناجيل.
- source_word: ὅτι
  choice: إن
  rationale: تُدخل مضمون القول هنا جملة شرطية؛ ولا يلزم تمثيل ὅτι بأداة مستقلة في العربية قبل الشرط.
- source_word: οὗτοι
  choice: هؤلاء
  rationale: يحافظ على اسم الإشارة من غير إضافة تفسيرية مثل «هؤلاء الناس» أو التصريح بأنهم التلاميذ.
- source_word: σιωπήσουσιν
  choice: صمت
  rationale: استعمال الماضي بعد «إن» أسلوب عربي طبيعي للتعبير عن الشرط المستقبلي، ويفيد هنا توقف الذين يهتفون عن الكلام.
- source_word: οἱ λίθοι
  choice: الحجارة
  rationale: ترجمة مباشرة للاسم المعرّف، وتحافظ على الصورة الملموسة في النص.
- source_word: κράξουσιν
  choice: فستصرخ
  rationale: «تصرخ» تنقل معنى النداء المرتفع، والسين تُظهر دلالة المستقبل، والفاء تربط جواب الشرط بوضوح.
theological_decisions:
- issue: هل تُفسَّر عبارة صراخ الحجارة على أنها مجاز أو معجزة؟
  choice: 'الإبقاء على الصورة الحرفية: «فستصرخ الحجارة» بلا تفسير إضافي.'
  alternative: أن تشهد الحجارة مجازًا، أو أن تسبّح الخليقة الله.
  rationale: يعرض النص اليوناني الصورة القوية من غير أن يحدد هل هي مبالغة بلاغية أم صورة نبوية أم إمكانًا عجائبيًا؛ لذلك تُحفظ دلالتها المفتوحة وتوترها اللاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ التركيب المزدوج «فأجاب وقال» لتمثيل اسم الفاعل والفعل الرئيس في اليونانية، مع صياغة شرطية طبيعية في العربية.
