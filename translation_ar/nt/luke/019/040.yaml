  terminology: «الحجارة» مقابِل دقيق لـλίθοι، و«تصرخ» تنقل قوة κράξουσιν. لا تتطلب الآية مصطلحات لاهوتية خاصة، وقد حُفظت الصورة من دون فرض تفسير مجازي أو عجائبي.
