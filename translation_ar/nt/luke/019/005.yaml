  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: ar
  text: 'ولما وصل يسوع إلى ذلك المكان، رفع نظره وقال له: «يا زكّا، أسرع وانزل، لأنه لا بد لي[a] أن أمكث اليوم في بيتك[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تفيد العبارة اليونانية «لا بد» (δεῖ) ضرورةً قوية، وقد ترتبط برسالة يسوع أو بالقصد الإلهي.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة العبارة: «في منزلك» أو «في دارك».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: لما
  rationale: تؤدي المعنى الزمني في سياق السرد بصورة طبيعية وواضحة.
- source_word: ἐπὶ τὸν τόπον
  choice: إلى ذلك المكان
  rationale: تعبير مكاني مباشر، واسم الإشارة يلائم الإحالة إلى الموضع الذي كان فيه زكّا.
- source_word: ἀναβλέψας
  choice: رفع نظره
  rationale: ينقل توجيه يسوع نظره إلى أعلى نحو زكّا، بأسلوب عربي طبيعي.
- source_word: εἶπεν πρὸς αὐτόν
  choice: وقال له
  rationale: الصيغة العربية المألوفة والواضحة لفعل القول الموجَّه إلى شخص.
- source_word: Ζακχαῖε
  choice: يا زكّا
  rationale: نقل للاسم وفق الصيغة العربية الكتابية الشائعة، مع أداة النداء التي تعبّر عن حالة النداء اليونانية.
- source_word: σπεύσας κατάβηθι
  choice: أسرع وانزل
  rationale: تنقل الإلحاح الذي تفيده صيغة اسم الفاعل مع فعل الأمر، من غير تكلّف حرفي.
- source_word: σήμερον γὰρ
  choice: لأنه ... اليوم
  rationale: تحفظ «لأن» القوة التعليلية لـγάρ، ويأتي «اليوم» في موضع عربي طبيعي مع الفعل.
- source_word: ἐν τῷ οἴκῳ σου
  choice: في بيتك
  rationale: ترجمة مباشرة وطبيعية للمسكن الذي سيقيم فيه يسوع، مع بقاء إمكان فهمه بوصفه البيت أو المنزل.
- source_word: δεῖ
  choice: لا بد لي
  rationale: تحفظ معنى الضرورة القوي، ولا تحصر مصدر هذه الضرورة صراحة في تفسير لاهوتي بعينه.
- source_word: μεῖναι
  choice: أن أمكث
  rationale: «أمكث» تعبّر عن البقاء أو الإقامة مدةً في بيت زكّا، وهي فصيحة ومفهومة.
theological_decisions:
- issue: دلالة الضرورة في δεῖ ضمن سرد لوقا
  choice: لا بد لي
  alternative: ينبغي لي / يجب عليّ
  rationale: تحفظ العبارة قوة الضرورة، وما قد يرتبط بها من رسالة يسوع أو قصد الله، من غير أن تجعل هذا الارتباط تفسيرًا صريحًا داخل المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت تراكيب سردية طبيعية، مع الحفاظ على الإلحاح في الأمر وعلى دلالة الضرورة دون حسم منشئها لاهوتيًا في المتن.
