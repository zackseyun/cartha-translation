  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: ar
  text: 'وجاء الآخر قائلًا: «يا سيدي، ها هي مِناك التي أبقيتُها محفوظةً في منديل[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قطعة قماش». تشير الكلمة اليونانية إلى قطعة قماش تُستعمل، غالبًا، لمسح الوجه أو العرق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: الآخر
  rationale: يشير إلى الخادم الآخر في مقابل الخادمين المذكورين قبله، ويحافظ على هذا التقابل من غير زيادة.
- source_word: ἦλθεν λέγων
  choice: جاء قائلًا
  rationale: ينقل التركيب اليوناني ونظام السرد نقلاً طبيعيًا وموجزًا في العربية.
- source_word: Κύριε
  choice: يا سيدي
  rationale: السياق هو مخاطبة عبدٍ لسيده في مثل؛ و«يا سيدي» عربية طبيعية تحافظ على معنى الاحترام والسلطة من غير أن تحسم دلالة لاهوتية ليست صريحة في هذا الموضع.
- source_word: ἰδοὺ
  choice: ها هي
  rationale: أداة تنبيه وإشارة إلى الشيء المقدَّم، وتؤدي «ها هي» الوظيفتين بوضوح في العربية الحديثة.
- source_word: ἡ μνᾶ σου
  choice: مَناتك
  rationale: «المَناة» نقل لاسم وحدة نقدية قديمة، وإضافة ضمير المخاطب تحفظ صيغة الأصل من غير استبدالها بعملة حديثة مضللة.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: التي أبقيتُها محفوظةً
  rationale: يعكس حالة الحفظ المستمرة التي يفيدها تركيب الفعل الناقص مع اسم المفعول، لا مجرد فعل وضعٍ وقع مرة واحدة.
- source_word: ἐν σουδαρίῳ
  choice: في منديل
  rationale: σουδάριον قطعة قماش تستعمل للمسح، وغالبًا منديل؛ و«منديل» لفظ عربي واضح وطبيعي، مع بيان المعنى الأعم في الحاشية.
theological_decisions:
- issue: ترجمة κύριος في النداء داخل المثل
  choice: يا سيدي
  alternative: يا رب
  rationale: المخاطَب في المستوى القصصي هو السيد النبيل، ولذلك تلائم «يا سيدي» العلاقة بين العبد وسيده. وتظل أصداء المثل الأوسع ممكنة من غير فرض لقب مسيحاني على صيغة النداء هنا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «مَناة» اسمًا لوحدة النقد القديمة، و«يا سيدي» بما يلائم خطاب العبد لسيده داخل المثل. وُضعت علامة الحاشية بعد «منديل» لأنها تتعلق بدلالة σουδάριον.
