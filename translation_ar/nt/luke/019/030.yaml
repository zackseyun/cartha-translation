  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: ar
  text: 'قائلًا: «اذهبا إلى القرية المقابلة، وحين تدخلانها ستجدان صغيرَ دابةٍ مربوطًا، لم يركبه أحد من الناس قط. فحُلّاه وائتيا به.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κώμη
  choice: القرية
  rationale: المقابل العربي الطبيعي والدقيق لمستوطنة أصغر من المدينة.
- source_word: πῶλον
  choice: جحشًا
  rationale: يدل السياق على صغير الحمار، و«جحش» هو اللفظ العربي المألوف في هذا المشهد.
- source_word: δεδεμένον
  choice: مربوطًا
  rationale: ينقل بوضوح حالة الحيوان الناتجة عن الفعل التام.
- source_word: ἀγάγετε
  choice: أتيا به
  rationale: صيغة المثنى توافق توجيه يسوع إلى اثنين، وتنقل معنى اقتياده إلى المتكلم بصورة طبيعية.
theological_decisions:
- issue: هوية πῶλον من جهة النوع
  choice: جحش
  alternative: مُهْر أو دابة صغيرة
  rationale: اللفظ اليوناني قد يُستعمل لصغير الفرس أو الحمار، لكن سياق دخول يسوع وما يوازيه في التقليد الإنجيلي يرجّح صغير الحمار، من غير إضافة وصف غير موجود في الآية.
- issue: عبارة οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν
  choice: لم يركبه أحد من الناس قط
  alternative: لم يجلس عليه قط أحد من البشر
  rationale: «يركبه» يؤدي المعنى المقصود طبيعيًا بالعربية، مع إبقاء التوكيد المطلق في «أحد من الناس قط» دون استنتاج دلالة طقسية أو لاهوتية غير مصرّح بها.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل المثنى في الأوامر لأن المخاطب رسولان، وحُفظ تسلسل الدخول والعثور والحل والإتيان بالحيوان.
