  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: ar
  text: 'فقال له: «من فمك[a] أحكم عليك، أيها العبد الشرير[b]. كنتَ تعلم أني رجل صارم، آخذ ما لم أضع[c]، وأحصد ما لم أزرع[d]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بكلامك أنت أحكم عليك».'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: δοῦλος، ويمكن ترجمتها «الخادم»، لكن «العبد» أوضح هنا لأن علاقة التبعية للسيد بارزة في المثل.'
    reason: alternative_reading
  - marker: c
    text: 'أو: «ما لم أودع»؛ فقد يحمل «أضع» في هذا السياق معنى الإيداع.'
    reason: lexical_alternative
  - marker: d
    text: 'حرفيًا بحسب النص اليوناني: «ما لم أزرع»، لا «حيث لم أزرع».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: من فمك
  rationale: يحافظ على الصورة اليونانية التي تجعل كلام العبد نفسه أساس الحكم عليه، مع بقاء المعنى واضحًا في العربية.
- source_word: κρίνω
  choice: أدينك
  rationale: الفعل يدل في أصله على الحكم، لكن السياق هنا حكم سلبي يعقبه العقاب؛ لذلك تنقل «أدينك» القوة السياقية، مع بيان البديل الأوسع في الحاشية.
- source_word: πονηρὲ
  choice: الشرير
  rationale: ينقل التوبيخ الأخلاقي المباشر، وهو أقوى وأدق من «السيئ» في هذا السياق.
- source_word: δοῦλε
  choice: العبد
  rationale: يناسب علاقة السيد بالعبد البارزة في المثل، ويحفظ دلالة التبعية الاجتماعية التي يحملها اللفظ اليوناني.
- source_word: ᾔδεις
  choice: كنتَ تعلم
  rationale: صياغة عربية طبيعية تنقل حالة العلم الماضية التي يستند إليها السيد في محاججته.
- source_word: αὐστηρός
  choice: صارم
  rationale: ينقل معنى الشدة والصرامة من غير لفظ مهجور، ويحافظ على الوصف السلبي الذي سبق أن نسبه العبد إلى سيده.
- source_word: αἴρων
  choice: آخذ
  rationale: يحافظ على عموم الفعل اليوناني وعلى موازنته مع «أحصد»، من غير تقييده بمعنى مالي تقني.
- source_word: ὃ οὐκ ἔθηκα
  choice: ما لم أضع
  rationale: ترجمة قريبة من صورة الفعل τίθημι، مع إبقاء احتمال معنى الإيداع في الحاشية.
- source_word: θερίζων
  choice: أحصد
  rationale: اللفظ العربي الطبيعي المقابل لصورة الحصاد، ويحافظ على اقترانه بالزرع.
- source_word: ὃ οὐκ ἔσπειρα
  choice: ما لم أزرع
  rationale: يتبع المفعول به في اليونانية («ما») بدل تحويله إلى ظرف مكان («حيث»)، ويحافظ على التوازي مع العبارة السابقة.
theological_decisions:
- issue: ترجمة δοῦλος في سياق المثل القائم على علاقة السيد بالتابع
  choice: العبد
  alternative: الخادم
  rationale: السياق يبرز سلطة السيد وتبعية الشخص له، ولذلك تحافظ «العبد» على قوة المصطلح التاريخية من غير تلطيفها.
- issue: هل يقرر السيد أن وصفه بالقسوة حقيقة أم يردد حجة العبد عليه؟
  choice: 'إبقاء الصياغة المباشرة: «كنت تعلم أني رجل صارم»'
  alternative: كنت تزعم أني رجل صارم
  rationale: النص اليوناني يصوغ القول مباشرة ولا يضيف فعلًا مثل «تزعم». إبقاء الصياغة يحفظ التوتر البلاغي ولا يحسم ما إذا كان السيد يقر الوصف أو يلزم العبد بكلامه.
- issue: دلالة κρίνω بين الحكم والإدانة
  choice: أدينك
  alternative: أحكم عليك
  rationale: السياق العقابي يجعل الحكم هنا حكم إدانة، لكن البديل الأوسع مذكور في الحاشية حتى لا تُحجب السعة المعجمية للفعل.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ومهيبة، مع الحفاظ على إيقاع التوبيخ والتوازي بين الأخذ والحصاد. استُخدمت «كنتَ» بعلامة المخاطب منعًا للالتباس عند القراءة، وحُفظ الاستفهام الختامي كما في النص اليوناني.
