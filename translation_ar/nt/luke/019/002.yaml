  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: ar
  text: وإذا برجلٍ اسمه زكّا، وكان رئيسَ جُباة الضرائب، وكان غنيًّا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: وإذا بـ
  rationale: تؤدي وظيفة أداة لفت الانتباه في السرد، مع الحفاظ على الحيوية بأسلوب عربي طبيعي، بدل الترجمة الحرفية الثقيلة «وها هوذا».
- source_word: ἀνὴρ
  choice: رجل
  rationale: الاسم مذكر مفرد ويشير إلى رجل بعينه، لذلك نُقل بدقة إلى «رجل».
- source_word: ὀνόματι καλούμενος
  choice: اسمه
  rationale: التركيب اليوناني يفيد أن الرجل يُدعى بهذا الاسم؛ و«اسمه» صياغة عربية موجزة وطبيعية تؤدي المعنى من غير تكرار حرفي متكلف.
- source_word: Ζακχαῖος
  choice: زكّا
  rationale: استُخدمت الصيغة العربية الكتابية الشائعة للاسم العلم.
- source_word: αὐτὸς ἦν
  choice: وكان
  rationale: تستأنف وصف الرجل بصورة طبيعية، من غير المبالغة في إبراز الضمير اليوناني بعبارة مثل «هو نفسه».
- source_word: ἀρχιτελώνης
  choice: رئيس جُباة الضرائب
  rationale: تحفظ دلالة ἀρχι- على الرئاسة أو المرتبة العليا، وتوضح للقارئ الحديث وظيفة τελώνης.
- source_word: αὐτὸς πλούσιος
  choice: وكان غنيًّا
  rationale: تنقل πλούσιος مباشرة، وتحافظ بتكرار «كان» على كون الغنى خبرًا مستقلًا، من غير تحميل αὐτός توكيدًا زائدًا.
