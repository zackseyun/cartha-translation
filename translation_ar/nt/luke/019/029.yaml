  source_fidelity: 'النص العربي ينقل تسلسل العبارة اليونانية ومعناها نقلاً أمينًا: «ولمّا» تؤدي الصيغة السردية الزمنية Καὶ ἐγένετο ὡς بأسلوب عربي طبيعي، و«اقترب من» يؤدي ἤγγισεν، و«اثنين من التلاميذ» يحافظ على التبعيض في δύο τῶν μαθητῶν من غير إضافة ضمير ملكية غير مذكور. و«عند الجبل» مقبول دلاليًا لـπρὸς τὸ ὄρος في هذا السياق المكاني، ولا يحسم أكثر مما يحسمه الأصل.'
