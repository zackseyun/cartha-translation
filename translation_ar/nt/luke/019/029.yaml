  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: ar
  text: ولمّا اقترب من بيت فاجي وبيت عنيا، عند الجبل المسمّى جبل الزيتون، أرسل اثنين من التلاميذ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὡς
  choice: ولمّا
  rationale: الصيغة اليونانية افتتاح سردي يتبعه ظرف زمان. دمجهما في «ولمّا» ينقل تتابع الحدث بعبارة عربية طبيعية، من غير استعمال الصيغة الثقيلة «وحدث أنه».
- source_word: ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: اقترب من بيت فاجي وبيت عنيا
  rationale: الفعل يدل على الدنو، وتأتي «اقترب من» فصيحة وطبيعية في العربية؛ وأسماء المواضع منقولة صوتيًا بصيغ عربية واضحة.
- source_word: πρὸς τὸ ὄρος
  choice: عند الجبل
  rationale: تحتمل πρός هنا العلاقة المكانية أو الاتجاه بحسب تركيب الجملة ومسار السرد. «عند» تلائم كون القريتين في ناحية الجبل، من غير أن توحي بالضرورة بأنه كان يتجه نحو الجبل في تلك اللحظة.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: المسمّى جبل الزيتون
  rationale: التركيب اليوناني المضغوط يعني حرفيًا «المسمّى [جبل] الزيتون»، وإظهار «جبل» في العربية لازم تقريبًا للوضوح والطبيعية، وهو مستفاد مباشرة من الاسم السابق τὸ ὄρος.
- source_word: ἀπέστειλεν
  choice: أرسل
  rationale: ينقل الفعل السردي البسيط بدقة ومن غير تكلف.
- source_word: δύο τῶν μαθητῶν
  choice: اثنين من التلاميذ
  rationale: يحافظ على تركيب التبعيض في اليونانية، ولا يضيف ضمير الملكية «تلاميذه» مع أن مرجعه مفهوم من السياق.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. روعي الإيقاع السردي الطبيعي، مع تجنب الصياغة التراثية الثقيلة مثل «وكان لما» أو «حدث أنه». لا حاجة إلى حاشية، لأن إظهار كلمة «جبل» في «جبل الزيتون» يوضح في العربية ما يدل عليه الاسم السابق في اليونانية ولا يبدد غموضًا لاهوتيًا أو نصيًا أصيلًا.
