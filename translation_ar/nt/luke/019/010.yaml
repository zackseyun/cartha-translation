id: LUK.19.10
reference: Luke 19:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: ar
  text: لِأَنَّ ابْنَ الإِنْسَانِ جَاءَ لِيَبْحَثَ عَنِ الضَّائِعِ وَيُخَلِّصَهُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَا كَانَ ضَائِعًا». التعبير اليوناني مفرد، ويمكن أن يُفهم بمعنى عام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: جَاءَ
  rationale: فعل ماضٍ بسيط يلائم صيغة الماضي في اليونانية ويعرض مجيء ابن الإنسان وغاية رسالته دون إضافة دلالة زمنية غير مصرَّح بها.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: تربط الآية بما قبلها بوصفها تعليلًا وإيضاحًا، وهي صياغة عربية واضحة وطبيعية.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابْنَ الإِنْسَانِ
  rationale: يحفظ اللقب الذي يستعمله يسوع عن نفسه وما يحمله من أصداء كتابية، من غير تفسيره أو إعادة صياغته.
- source_word: ζητῆσαι
  choice: لِيَبْحَثَ عَنْ
  rationale: ينقل معنى القصد والطلب المقصود، وتعبير «يبحث عن» طبيعي في العربية المعاصرة.
- source_word: σῶσαι
  choice: يُخَلِّصَهُ
  rationale: يحفظ الاتساع الخلاصي للفعل في لوقا، ولا يقصره على الإنقاذ الجسدي.
- source_word: τὸ ἀπολωλός
  choice: الضَّائِعِ
  rationale: ينقل اسم المفعول اليوناني المفرد المحايد بوصفه تعبيرًا عامًا، مع إبقاء إمكان فهمه على أنه الشخص الضائع أو ما كان ضائعًا؛ والضمير المفرد يوافق الصياغة العربية المختارة.
theological_decisions:
- issue: نطاق ودلالة τὸ ἀπολωλός
  choice: الضَّائِعِ
  alternative: مَا كَانَ ضَائِعًا
  rationale: التعبير اليوناني مفرد محايد مع أداة التعريف، ويمكن أن يُفهم على نحو عام أو جمعي. «الضائع» طبيعي عربيًا، وينطبق في السياق المباشر على زكّا مع إبقاء القول بيانًا أوسع لرسالة ابن الإنسان. وتوضح الحاشية البديل غير الشخصي دون حسم الغموض الأصيل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يبحث عن» بدل صياغة أشد تراثية مثل «يطلب» لتجنب احتمال فهم الطلب بمعنى السؤال، مع الحفاظ على لقب «ابن الإنسان» والمصطلح الخلاصي «يخلّص».
