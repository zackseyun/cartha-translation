  source_fidelity: 'الترجمة أمينة للنص اليوناني: «لأن» تنقل γάρ تعليليًا، و«جاء» تنقل الماضي ἦλθεν، و«ليبحث عن ... ويخلّصه» تؤدي غاية الفعلين ζητῆσαι وσῶσαι. و«الضائع» يحافظ على إمكان الدلالة العامة/الجنسية في τὸ ἀπολωλός، من غير حصرها في زكّا وحده.'
  naturalness: الصياغة فصيحة حديثة وواضحة. تركيب «جاء ليبحث عن ... ويخلّصه» طبيعي ومتماسك، والضمير في «يخلّصه» عائد بوضوح إلى «الضائع».
