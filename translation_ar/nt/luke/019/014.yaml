  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: ar
  text: 'لكنَّ مواطنيه كانوا يبغضونه، فأرسلوا وفدًا في إثره قائلين: «لا نريد هذا الرجل أن يملك علينا».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολῖται
  choice: مواطنوه
  rationale: تحافظ كلمة «مواطنوه» على المعنى المدني والسياسي للفظ اليوناني، بخلاف «رعاياه» التي قد تفترض مسبقًا مُلكه عليهم، وهو ما يرفضونه في كلامهم.
- source_word: ἐμίσουν
  choice: كانوا يبغضونه
  rationale: ينقل هذا التركيب دلالة الماضي الناقص على العداء المستمر أو المميز لهم، بلغة عربية طبيعية واضحة.
- source_word: ἀπέστειλαν
  choice: فأرسلوا
  rationale: فعل سردي بسيط وواضح، والفاء تلائم تعاقب الحدث في السياق العربي.
- source_word: πρεσβείαν
  choice: وفدًا
  rationale: يدل اللفظ على هيئة تمثيلية تُرسَل في مهمة رسمية؛ و«وفد» هو المقابل العربي الحديث الطبيعي الذي يحفظ هذا المعنى السياسي.
- source_word: ὀπίσω αὐτοῦ
  choice: في إثره
  rationale: تفيد العبارة أن الوفد أُرسل وراءه بعد انطلاقه، و«في إثره» فصيحة وطبيعية دون أن توحي بمجرد الموقع المكاني خلفه.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحافظ اسم الفاعل على الصلة النحوية المباشرة ويمهد لمضمون الرسالة.
- source_word: Οὐ θέλομεν
  choice: لا نريد
  rationale: ترجمة عربية مباشرة وطبيعية لفعل الإرادة والرغبة، وتنقل الرفض الصريح.
- source_word: τοῦτον
  choice: هذا الرجل
  rationale: تنقل الإشارة نبرة التباعد والازدراء الخفيف من غير مبالغة عامية أو إضافة احتقار غير لازم.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: أن يملك علينا
  rationale: تحفظ «يملك» الدلالة الملكية الصريحة للفعل، ولا تسطحها إلى معنى السلطة العامة كما قد تفعل «يحكم».
theological_decisions:
- issue: الدلالة السياسية والملكية في المثل
  choice: أن يملك علينا
  alternative: أن يحكمنا / أن يتسلط علينا
  rationale: يحافظ النص على صورة المُلك الواردة صراحة في اليونانية، من غير أن يفرض تفسيرًا رمزيًا أو عقائديًا يتجاوز ألفاظ المثل.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُخدم «لكنَّ» لإبراز المقابلة، و«في إثره» للحفاظ على معنى الإرسال وراءه، مع إبقاء النبرة السياسية والملكية للنص. لا توجد حاجة إلى حاشية؛ فـ«وفدًا» يؤدي معنى πρεσβείαν بوضوح. الحاشية الإنجليزية المرفقة تبدو علامةُ موضعها غير متسقة مع مضمونها، إذ تتعلق بـ«وفد» لا بـ«أبغضوه»، لذلك لم تُنقل إلى النص العربي.
