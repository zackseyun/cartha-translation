lexical_decisions:
- source_word: ὁ δεύτερος
  choice: الثاني
  rationale: يحافظ على ترتيب العبيد في المثل بصياغة عربية مباشرة.
- source_word: μνᾶ
  choice: مَنَا
  rationale: نقل لاسم وحدة النقد والوزن القديمة، وهو أدق من استبدالها بعملة حديثة.
- source_word: κύριε
  choice: يا سيدي
  rationale: خطاب مباشر للسيد في سياق المثل؛ وهذه الصياغة طبيعية وتحفظ دلالة κύριος السياقية.
- source_word: ἐποίησεν
  choice: حقَّق
  rationale: المعنى هنا أن المبلغ أنتج عائدًا؛ «حقَّق» عربية طبيعية من غير أن تنسب الفعل صراحة إلى العبد.
theological_decisions:
- issue: دلالة κύριε في خطاب المثل
  choice: يا سيدي
  alternative: يا رب
  rationale: السياق المباشر هو خطاب عبدٍ لسيده، فلا ينبغي تحميل اللفظ وحده تصريحًا لاهوتيًا يتجاوز المشهد القصصي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «مَنَا» للمفرد و«مَنَوات» للجمع، وحُفظ إسناد تحقيق الربح إلى المبلغ كما في اليونانية.
