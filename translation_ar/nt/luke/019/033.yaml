  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: ar
  text: 'وبينما كانا يحلّان رباط الجحش، قال لهما مالِكوه[a]: «لماذا تحلّان رباط الجحش؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سادته». اللفظة اليونانية هي جمع «سيد»، لكنها تشير هنا إلى مالكي الجحش من البشر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυόντων ... λύετε
  choice: كانا يحلّان رباط ... تحلّان رباط
  rationale: الفعلان من الجذر نفسه ويدلان هنا على فكّ ما رُبط به الحيوان. أُبقي التكرار، واستُعمل الماضي المستمر في العبارة الظرفية ثم المضارع في السؤال بحسب البنية اليونانية.
- source_word: δὲ
  choice: وبينما
  rationale: أُدمج الرابط السردي الخفيف في تركيب «وبينما» الطبيعي بالعربية، من غير إضفاء معنى استدراكي غير موجود.
- source_word: αὐτῶν
  choice: كانا
  rationale: الضمير يعود في السياق السابق إلى التلميذين المرسلين، وصيغة المثنى العربية تُظهر العدد الذي يقتضيه السياق من غير تكرار الاسم.
- source_word: τὸν πῶλον
  choice: الجحش
  rationale: πῶλος يعني حيوانًا فتيًا، ويحدده السياق السابق بأنه جحش. وهذه اللفظة موجزة وطبيعية في سياق دخول يسوع إلى أورشليم.
- source_word: εἶπαν
  choice: قال
  rationale: نُقل فعل القول مباشرة، مع إفراد الفعل قبل الفاعل الجمع وفق الأسلوب العربي الفصيح.
- source_word: οἱ κύριοι αὐτοῦ
  choice: أصحابُه
  rationale: κύριοι جمع κύριος، لكنه هنا يدل على البشر الذين لهم سلطان ملكية على الجحش، لا على لقب لاهوتي. «أصحابه» طبيعية وتحفظ قدرًا من اتساع اللفظ أكثر من «مالكيه».
- source_word: πρὸς αὐτούς
  choice: لهما
  rationale: نُقل اتجاه القول بلام التبليغ، مع استعمال المثنى لعود الضمير إلى الرجلين.
- source_word: Τί
  choice: لماذا
  rationale: τί في هذا السؤال يطلب سبب الفعل، ولذلك تؤدي «لماذا» المعنى الاصطلاحي بوضوح.
theological_decisions:
- issue: دلالة κύριοι في سياق ملكية بشرية غير لاهوتية
  choice: أصحابُه
  alternative: مالِكوه / سادته
  rationale: السياق يشير إلى أصحاب الجحش من البشر. «أصحابه» تتجنب الإيحاء بأن «الأرباب» لقب لاهوتي، مع الإشارة في الحاشية إلى أن الأصل حرفيًا جمع «سيد».
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية وقورة. استُعمل المثنى لأن المخاطَبَين هما التلميذان المذكوران في السياق، وحُفظ تكرار فعل فك الرباط الظاهر في الأصل.
