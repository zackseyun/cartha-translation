  text: ولما اقترب ورأى المدينة، بكى عليها.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: لما اقترب
  rationale: تفيد العبارة اقترابه في ذلك الوقت من غير أن تصرّح بالمفعول، إذ يوضحه السياق. و«لما» تربط الاقتراب بما تلاه ربطًا طبيعيًا.
- source_word: ἰδὼν
  choice: ورأى
  rationale: اسم الفاعل اليوناني يدل هنا على فعل مقارن للفعل الرئيس أو سابق له مباشرة؛ والصياغة الفعلية أنسب للعربية الواضحة وتحافظ على الصلة المباشرة بين رؤية المدينة والبكاء عليها.
- source_word: τὴν πόλιν
  choice: المدينة
  rationale: النص يقول «المدينة» بإيجاز، والسياق يبين أنها أورشليم، فلا حاجة إلى إضافة اسمها في المتن.
- source_word: ἔκλαυσεν
  choice: بكى
  rationale: ينقل الفعل معنى البكاء بوضوح ووقار من غير إضافة شدة غير مصرّح بها في اللفظ.
- source_word: ἐπ’ αὐτήν
  choice: عليها
  rationale: مع فعل البكاء تفيد العبارة أن المدينة هي موضوع رثائه. والضمير المؤنث طبيعي في العربية لاتفاقه مع «المدينة»، كما يحفظ إمكان تشخيصها من غير افتعال.
theological_decisions:
- issue: تأنيث الضمير العائد إلى المدينة وإمكان تشخيص أورشليم
  choice: عليها
  alternative: لأجلها
  rationale: «عليها» هي المقابل العربي المباشر والطبيعي، وتحفظ التأنيث النحوي وإمكان فهم المدينة بوصفها مشخصة، من غير أن تفرض هذا الفهم. أما «لأجلها» فتوضح سبب البكاء لكنها أضعف في نقل تركيب ἐπί مع المفعول به.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع ترتيب فعلي طبيعي يحفظ تتابع الاقتراب والرؤية والبكاء. لا تلزم حاشية للتأنيث لأن «المدينة» مؤنثة نحويًا في العربية وعودة الضمير المؤنث إليها طبيعية.
