  source_fidelity: 'النص العربي أمين للنص اليوناني: «كنت أخاف» ينقل دلالة الماضي الناقص، و«لأني» تؤدي التعليل، و«رجل قاسٍ» يحفظ قوة αὐστηρός بوصفه قول العبد، كما يحافظ التوازي بين «تأخذ ما لم تضعه» و«تحصد ما لم تزرعه» على الصياغة والصورتين في الأصل.'
  naturalness: الصياغة فصيحة معاصرة وواضحة، وعلامات الترقيم تخدم التوازي البلاغي. «ما لم تضعه» سليمة، وإن كانت صورتها المادية غير مألوفة قليلًا فهي مقصودة وأمينة للأصل ومفسرة في الحاشية.
  terminology: «قاسٍ» اختيار مناسب لـ αὐστηρός في سياق اتهام العبد، من غير تخفيف غير مبرر أو تقرير لصحة الاتهام. «تحصد/تزرعه» يحافظ على الاقتران الزراعي الاصطلاحي. الحاشيتان مثبتتان في موضعيهما وتقدمان بدائل معجمية دون فرض تفسير.
