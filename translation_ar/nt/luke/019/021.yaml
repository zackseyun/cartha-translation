id: LUK.19.21
reference: Luke 19:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: ar
  text: لأني كنت أخاف منك، إذ إنك رجل قاسٍ[a]، تأخذ ما لم تضعه[b]، وتحصد ما لم تزرعه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صارم» أو «شديد».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «تأخذ ما لم تضعه». وقد يُفهم في هذا السياق أيضًا بمعنى: «تجمع ما لم تودعه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: كنت أخاف
  rationale: ينقل صيغة الماضي الناقص حالة الخوف المستمرة في الزمن الماضي، وهو تعبير عربي طبيعي في هذا السياق.
- source_word: γάρ
  choice: لأني
  rationale: تفيد الأداة تعليل كلام العبد السابق، وتؤدي «لأني» هذا الارتباط بوضوح.
- source_word: αὐστηρός
  choice: قاسٍ
  rationale: تنقل الكلمة معنى الشدة والصرامة ذي النبرة السلبية في اتهام العبد، من غير أن تحسم صحة وصفه للسيد.
- source_word: αἴρεις
  choice: تأخذ
  rationale: تحافظ على المعنى العام للفعل وعلى موازاته مع «تحصد»، من غير تخصيصه بمعنى تجاري لا يفرضه اليوناني.
- source_word: ὃ οὐκ ἔθηκας
  choice: ما لم تضعه
  rationale: ترجمة مباشرة للصورة الملموسة في τίθημι، مع إبقاء المقصود الاقتصادي محتملًا دون تفسير زائد.
- source_word: θερίζεις
  choice: تحصد
  rationale: يحفظ الصورة الزراعية والمقابلة المألوفة بين الحصاد والزرع.
- source_word: ὃ οὐκ ἔσπειρας
  choice: ما لم تزرعه
  rationale: ينقل فعل البذر بعبارة عربية طبيعية ويحافظ على الصورة الزراعية المقابلة للحصاد.
- source_word: ἄνθρωπος
  choice: رجل
  rationale: يشير الاسم هنا إلى شخصية مذكرة محددة في المثل، ولذلك فـ«رجل» دقيقة وطبيعية.
theological_decisions:
- issue: هل ينبغي تخفيف وصف العبد للسيد حمايةً لصورة الرجل النبيل في المثل؟
  choice: 'الإبقاء على صيغة العبد الاتهامية: «رجل قاسٍ»'
  alternative: استعمال وصف أخف مثل «صارم» أو «شديد» في المتن
  rationale: الآية تنقل تفسير العبد واتهامه؛ لذا ينبغي حفظ قوته البلاغية من غير تقرير أن الوصف حكم موضوعي على السيد خارج إطار كلام العبد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ التوازي بين «تأخذ... تضعه» و«تحصد... تزرعه»، مع إبقاء اتهام العبد وحدّة الوصف دون تلطيف لاهوتي أو تفسير تجاري زائد.
