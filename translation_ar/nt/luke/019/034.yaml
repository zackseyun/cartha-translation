  text: And they said[a], “The Lord has need of it.”
translation:
  language: ar
  text: 'فقالا: «الرب محتاج إليه».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «السيد محتاج إليه»، إذا كان المقصود بكلمة «الرب» صاحب الجحش أو مالكه، لا لقبًا يُطلَق على يسوع.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: فقالا
  rationale: أداة الربط δέ خفيفة، والضمير المستفاد من οἱ يعود إلى التلميذين المذكورين في السياق؛ لذلك استُعملت صيغة التثنية العربية، وأُدمج الربط بالفعل على نحو طبيعي.
- source_word: εἶπαν
  choice: قالا
  rationale: الفعل هو صيغة الماضي من λέγω ومعناه المباشر «قال»؛ وصيغة التثنية تُظهر أن المتكلمين هما التلميذان من غير إضافة معنى «أجابا» غير المصرح به لفظًا.
- source_word: ὅτι
  choice: علامتا الاقتباس
  rationale: تُدخل ὅτι هنا الكلام المباشر، وتؤدي علامتا الاقتباس هذه الوظيفة بوضوح وطبيعية في العربية.
- source_word: Ὁ κύριος
  choice: الرب
  rationale: يحافظ هذا اللفظ على الاستعمال اللقبي المرجح في سياق لوقا، مع إبقاء احتمال معنى «السيد» في الحاشية.
- source_word: αὐτοῦ
  choice: إليه
  rationale: يعود الضمير بحسب السياق إلى الجحش المذكور قبله، ويأتي التعبير العربي «محتاج إليه» طبيعيًا من غير تكرار الاسم أو زيادة إيضاح على اليونانية.
- source_word: χρείαν ἔχει
  choice: محتاج
  rationale: هذا نقل عربي طبيعي ودقيق للتعبير الاصطلاحي «له حاجة»، ويحفظ معنى الاحتياج من غير تركيب متكلف.
theological_decisions:
- issue: مرجع κύριος في جواب التلميذين
  choice: الرب، في إشارة مرجحة سياقيًا إلى يسوع
  alternative: السيد، أي صاحب الجحش أو مالكه
  rationale: العبارة هي الجواب الذي سبق أن لقّنه يسوع للتلميذين، ويكثر عند لوقا استعمال κύριος ليسوع؛ لكن اللفظ اليوناني قد يعني أيضًا «السيد» أو «المالك»، لذلك لم يُطمس الاحتمال البديل بل ذُكر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغة التثنية لأنها طبيعية ودقيقة في العربية، ووُضع الكلام المباشر بين علامتي اقتباس. أُبقيت الحاشية لتصون الغموض الحقيقي في لفظ κύριος.
