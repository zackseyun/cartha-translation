  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُعمل «جبل الزيتون» بوصفه الاسم الجغرافي العربي المستقر، ووُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
