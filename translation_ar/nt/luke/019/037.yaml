lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: ولمّا كان قد اقترب بالفعل
  rationale: تنقل العبارة الظرفية الزمنية، وتحفظ دلالة ἤδη على أن الاقتراب كان قد بلغ هذه المرحلة بالفعل.
- source_word: πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: من منحدر جبل الزيتون
  rationale: تعبير عربي طبيعي يحدد موضع اقترابه عند بداية المنحدر، مع استعمال الاسم الجغرافي العربي المألوف.
- source_word: ἤρξαντο
  choice: أخذ ... يفرح ويسبّح
  rationale: «أخذ» مع المضارع تؤدي معنى الشروع الذي يحمله الفعل اليوناني.
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: جمهور التلاميذ كلّه
  rationale: «جمهور» يدل على الجمع الكبير مع إبقاء ارتباطه بالتلاميذ، و«كلّه» تنقل شمول ἅπαν للمجموعة.
- source_word: χαίροντες αἰνεῖν τὸν θεὸν
  choice: يفرح ويسبّح الله
  rationale: تحفظ الفرح بوصفه فعلًا مصاحبًا للتسبيح، وتأتي بصياغة عربية موجزة وطبيعية.
- source_word: φωνῇ μεγάλῃ
  choice: بصوت عالٍ
  rationale: المقابل العربي المباشر والطبيعي للتعبير اليوناني.
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: من أجل جميع أعمال القدرة التي رأوها
  rationale: «أعمال القدرة» تحافظ على الصلة الدلالية بالقوة ولا تحصر اللفظة في مصطلح «المعجزات»، وصيغة الجمع في «رأوها» تراعي المقصود بالتلاميذ.
theological_decisions:
- issue: دلالة δυνάμεων في سياق الأعمال الخارقة
  choice: أعمال القدرة
  alternative: المعجزات؛ الأعمال المقتدرة
  rationale: قد تدل اللفظة على قوى أو أفعال تتجلى فيها القدرة، ومنها المعجزات. يحفظ المختار سعة اللفظ وتركيزه على القدرة الظاهرة في الأفعال من غير تضييقه إلى مصطلح تقني واحد.
