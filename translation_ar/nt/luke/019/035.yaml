  text: καὶ ἤγαγον αὐτὸν πρὸς τὸν Ἰησοῦν, καὶ ἐπιρίψαντες ⸀αὐτῶν τὰ ἱμάτια ἐπὶ τὸν πῶλον ἐπεβίβασαν τὸν Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: ar
  text: فأتيا به إلى يسوع، وألقيا رداءيهما على الجحش[a]، ثم أركبا يسوع عليه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الجحش هو صغير الحمار، كما يتضح من السياق السابق.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἤγαγον αὐτὸν
  choice: فأتيا به
  rationale: الفعل بصيغة الجمع، ويُفهم الفاعل من سياق الآية السابقة على أنه التلميذان. والضمير اليوناني مذكر عائد إلى الجحش، ويوافقه الضمير العربي المذكر طبيعيًا.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: إلى يسوع
  rationale: تنقل πρός مع النصب معنى الحركة نحو شخص بوضوح.
- source_word: ἐπιρίψαντες
  choice: وألقيا
  rationale: اسم الفاعل الأوريستي يدل على فعل سبق الفعل الرئيس؛ ويبيّن ترتيب الجملة العربية مع «ثم» هذا التعاقب بوضوح.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: رداءيهما
  rationale: ἱμάτια هي الثياب الخارجية، والضمير الجمع يعود هنا إلى التلميذين، ولذلك استُعمل المثنى العربي الدقيق.
- source_word: ἐπὶ τὸν πῶλον
  choice: على الجحش
  rationale: ἐπί مع النصب هنا تدل على وضع الرداءين فوق الحيوان.
- source_word: πῶλον
  choice: الجحش
  rationale: πῶλος يدل على صغير حيوان؛ ويحدد السياق السابق أنه جحش حمار، و«الجحش» هو اللفظ العربي الطبيعي والدقيق في هذا المشهد.
- source_word: ἐπεβίβασαν τὸν Ἰησοῦν
  choice: أركبا يسوع عليه
  rationale: الفعل سببي، أي جعلا يسوع يركب الجحش؛ و«أركبا» يؤدي هذا المعنى بإيجاز ووضوح.
