source:
  edition: SBLGNT
  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: ar
  text: 'قائلًا: «لو أنكِ عرفتِ[a] في هذا اليوم، حتى أنتِ، ما يؤدّي إلى السلام[b]! لكنه الآن قد حُجب عن عينيكِ[c].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «ليتكِ عرفتِ في هذا اليوم، حتى أنتِ، ما يؤدّي إلى السلام!»'
    reason: بديل أسلوبي يصرّح بنبرة التحسر المفهومة من السياق.
  - marker: b
    text: 'اليونانية حرفيًا: «الأمور المتجهة نحو السلام»، أي ما يتصل بالسلام أو يقود إليه.'
    reason: إيضاح دلالة العبارة اليونانية الاصطلاحية.
  - marker: c
    text: 'يمكن أيضًا إظهار المرجع بصيغة الجمع: «لكن هذه الأمور قد حُجبت عن عينيكِ». أمّا الفعل اليوناني فجاء مفردًا، مستأنفًا العبارة السابقة باعتبارها مضمونًا واحدًا.'
    reason: بيان إمكان الصياغة البديلة مع الحفاظ على غموض الإحالة النحوي.
lexical_decisions:
- source_word: λέγων
  choice: قائلًا
  rationale: يحافظ على صيغة اسم الفاعل المتصلة بالسياق السردي السابق بدل تحويلها إلى فعل مستقل.
- source_word: Εἰ ἔγνως
  choice: لو أنكِ عرفتِ
  rationale: تنقل الشرط غير المتحقق في سياق الرثاء، من غير إضافة أداة صريحة بمعنى «ليت» إلى المتن.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: في هذا اليوم
  rationale: تعبير عربي طبيعي ودقيق للظرف الزمني، من غير زيادة توكيد غير منصوص عليه.
- source_word: καὶ σὺ
  choice: أنتِ أيضًا
  rationale: يبرز المخاطَبة نفسها في سياق رثاء أورشليم. استُعمل التأنيث لأن المخاطَب في السياق هو المدينة.
- source_word: τὰ πρὸς εἰρήνην
  choice: ما يؤدّي إلى السلام
  rationale: ينقل دلالة العبارة الاصطلاحية على ما يتصل بالسلام أو يقود إليه، بصياغة عربية واضحة تحافظ على سعتها.
- source_word: εἰρήνην
  choice: السلام
  rationale: هو المقابل المألوف والغني دلاليًا، ويشمل معنى السلام والخير والنجاة من الدينونة الوشيكة.
- source_word: νῦν δὲ
  choice: لكنه الآن
  rationale: يحافظ على الانتقال الحاد من الفرصة غير المتحققة إلى حالة الاحتجاب الراهنة.
- source_word: ἐκρύβη
  choice: قد حُجب
  rationale: يحافظ على المبني للمجهول وعلى النتيجة الحاضرة للفعل، ويوافق إحالة «ما» المفردة لفظًا في العربية.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: عن عينيكِ
  rationale: يحافظ على صورة العينين بوصفهما كناية عن الإدراك، بصياغة عربية طبيعية.
theological_decisions:
- issue: مرجع الفعل ἐκρύβη المفرد
  choice: إرجاعه إلى «ما يؤدّي إلى السلام» بوصفه مضمونًا مجموعًا، بصيغة «قد حُجب».
  alternative: 'إظهار المرجع جمعًا: «لكن هذه الأمور قد حُجبت عن عينيكِ».'
  rationale: الفعل اليوناني مفرد، مع أن العبارة السابقة محايدة الجمع ويمكن أن تُستأنف في اليونانية باعتبارها مفهومًا واحدًا. تتيح «ما» العربية الحفاظ على هذه الصياغة من غير قطع الصلة بالعبارة السابقة أو فرض جمع صريح.
- issue: قوة أسلوب الرثاء الشرطي
  choice: «لو أنكِ عرفتِ» مع علامة التعجب.
  alternative: «ليتكِ عرفتِ» أو «لو أنكِ فقط عرفتِ».
  rationale: السياق يحمل معنى التحسر بوضوح، لكن اليونانية لا تتضمن أداة مستقلة تقابل «ليت» أو «فقط». لذلك حُفظ الشرط في المتن، وأظهرت علامة التعجب نبرة الرثاء والجملة التي لا يرد لها جواب صريح.
- issue: جنس المخاطَب في العربية
  choice: 'صيغة المؤنث: «أنكِ عرفتِ… عينيكِ».'
  alternative: صيغة المذكر العامة.
  rationale: الضمير اليوناني لا يبيّن الجنس صرفيًا، لكن المخاطَب في السياق المباشر هو أورشليم، وهي مدينة مؤنثة في العربية؛ والتأنيث لازم لصياغة عربية سليمة.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة وقورة. حُفظ تدفق اسم الفاعل، والتأنيث السياقي لأورشليم، ونبرة الرثاء، مع تجنب إضافة جواب غير مذكور لجملة الشرط أو تحميل «السلام» معنى مذهبيًا خاصًا.
