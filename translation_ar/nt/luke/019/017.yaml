  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: ar
  text: 'فقال له: «أحسنت، أيها العبد الصالح[a]! لأنك كنت أمينًا في أمر ضئيل جدًا، فليكن لك سلطان على عشر مدن».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الخادم». الكلمة اليونانية هي doulos، وقد تعني «عبدًا» أو «خادمًا» بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὖγε
  choice: أحسنت
  rationale: صيغة عربية طبيعية للتعبير عن الاستحسان والثناء، وتقابل التعجب اليوناني الموجز.
- source_word: ἀγαθὲ
  choice: الصالح
  rationale: ينقل النعت المباشر في النداء بوضوح وكرامة.
- source_word: δοῦλε
  choice: العبد
  rationale: اللفظ اليوناني يدل هنا على شخص خاضع لسيده، و«العبد» يحفظ قوة العلاقة القانونية والاجتماعية في المثل؛ وتُذكر إمكانية «الخادم» في الحاشية.
- source_word: ἐν ἐλαχίστῳ
  choice: في أمر ضئيل جدًا
  rationale: ينقل معنى الأمانة في شأن بالغ الصغر، مع إظهار صيغة التفضيل في ἐλαχίστῳ.
- source_word: πιστὸς ἐγένου
  choice: كنت أمينًا
  rationale: ترجمة مباشرة وطبيعية للتركيب، من غير إضافة معنى «أثبتَّ» غير الصريح في المصدر.
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: فليكن لك سلطان
  rationale: يعبر عن الأمر بأن يكون صاحب سلطة، ويحفظ دلالة ἐξουσία على السلطان أو الصلاحية الحاكمة.
- source_word: ἐπάνω δέκα πόλεων
  choice: على عشر مدن
  rationale: ترجمة مباشرة تلائم سياق ممارسة الحكم على المدن.
theological_decisions:
- issue: دلالة δοῦλος في سياق علاقة السيد والتابع في المثل
  choice: العبد
  alternative: الخادم
  rationale: «العبد» أقرب إلى قوة اللفظ اليوناني وإلى وضع الشخص الخاضع لمالك أو سيد، من غير جعل هذا الاختيار تقريرًا عقائديًا؛ أما «الخادم» فألين دلالة ولذلك يُحفظ بديلًا في الحاشية.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة سردية كريمة. استُخدمت «أحسنت» للثناء الاصطلاحي، و«فليكن لك سلطان» لصياغة الأمر بصورة عربية طبيعية مع إبقاء معنى منح السلطة.
