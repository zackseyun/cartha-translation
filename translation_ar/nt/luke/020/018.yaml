base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: ar
  text: كُلُّ مَنْ يَسْقُطُ عَلَى ذَلِكَ الْحَجَرِ سَيَتَحَطَّمُ[a]، وَأَمَّا مَنْ يَسْقُطُ الْحَجَرُ عَلَيْهِ، فَإِنَّهُ سَيَسْحَقُهُ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يَتَهَشَّمُ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يُفَتِّتُهُ» أو «يُذَرِّيهِ كَالْعُصَافَةِ»؛ فَالْفِعْلُ الْيُونَانِيُّ يَحْمِلُ مَعْنًى أَشَدَّ مِنْ مُجَرَّدِ الِارْتِطَامِ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: كُلُّ مَنْ يَسْقُطُ
  rationale: ينقل اسم الفاعل المعرّف المستعمل استعمالًا اسميًا عامًا، ويحفظ شمول العبارة بصياغة عربية طبيعية.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: عَلَى ذَلِكَ الْحَجَرِ
  rationale: تحفظ حركة السقوط على الحجر كما تحفظ قوة اسم الإشارة ἐκεῖνον.
- source_word: συνθλασθήσεται
  choice: يَتَحَطَّمُ
  rationale: يفيد الفعل اليوناني التكسّر الشديد إلى أجزاء؛ و«يتحطم» واضحة وقوية من غير تحديد آلية التهشم.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: وَأَمَّا مَنْ يَسْقُطُ الْحَجَرُ عَلَيْهِ
  rationale: تعكس الصلة غير المعيّنة مع ἄν، وتوضح في العربية أن الحجر هو فاعل السقوط المفهوم من السياق، مع إبراز المقابلة بين الجملتين.
- source_word: λικμήσει
  choice: فَيَسْحَقُهُ
  rationale: ينقل الأثر الأشد للفعل، الذي قد يدل على السحق أو التفتيت والتنثير، بلفظ عربي مفهوم ومناسب لصورة الدينونة.
- source_word: αὐτόν
  choice: ـهُ
  rationale: يحفظ الضمير المفرد المذكر العائد إلى «مَنْ» ذات الدلالة العامة.
theological_decisions:
- issue: صورة الحجر بوصفه أداة للدينونة
  choice: الإبقاء على صورة الدينونة المدمرة بألفاظ «يتحطم» و«يسحقه» من غير تلطيف.
  alternative: صياغة الصورة على أنها مجرد عثرة أو إصابة.
  rationale: الفعلان συνθλασθήσεται وλικμήσει شديدا الدلالة، وسياق الحجر في الآية السابقة يقتضي عدم تخفيف قوة الصورة، من غير إضافة تفسير يتجاوز نص الآية.
- issue: الإحالة العامة بضمير مذكر مفرد
  choice: استخدام ضمير المفرد المذكر في «يسحقه».
  alternative: إعادة الاسم بصياغة محايدة مثل «يسحق ذلك الشخص».
  rationale: يحفظ الضمير اليوناني المذكر المفرد وصيغة العربية الطبيعية بعد «مَنْ»، مع بقاء الدلالة عامة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «يتحطم» و«يسحقه» للمحافظة على شدة الصورة، ووُضعت البدائل الدلالية في الحواشي. جميع علامات الحواشي مثبتة في المتن.
