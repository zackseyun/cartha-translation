  yaml_path: translation/nt/luke/020/023.yaml
  text: But perceiving their cunning[a], he said to them,
translation:
  language: ar
  text: 'لكنه أدرك مكرهم[a]، فقال لهم:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «دهاءهم» أو «حيلتهم» أو «خداعهم». تدل الكلمة اليونانية على براعة ملتوية في تدبير المكائد.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσας
  choice: أدرك
  rationale: ينقل معنى التنبّه الذهني والتمييز الذي يفيده اسم الفاعل اليوناني، من غير مبالغة مثل «كشف ما في نفوسهم».
- source_word: δὲ
  choice: لكن
  rationale: تفيد هنا انتقالًا ذا مسحة تقابلية بين تدبيرهم واستجابة يسوع، و«لكن» طبيعية وواضحة في السياق.
- source_word: αὐτῶν
  choice: ـهم
  rationale: ضمير الملكية الملحق بـ«مكر» هو الصياغة العربية الطبيعية للمضاف إليه اليوناني.
- source_word: πανουργίαν
  choice: مكرهم
  rationale: «المكر» يجمع معنى الحيلة والدهاء ذي القصد السيئ، وهو موجز وفصيح ولا يحصر اللفظ في مجرد الكذب.
- source_word: εἶπεν
  choice: فقال
  rationale: الترجمة السردية العربية المألوفة للفعل، مع الفاء لربط القول بإدراك المكر السابق له.
- source_word: πρὸς αὐτούς
  choice: لهم
  rationale: صياغة عربية طبيعية تحدد المخاطَبين من غير إضافة تفسيرية.
