lexical_decisions:
- source_word: ἴσχυσαν
  choice: يقدروا
  rationale: ينقل معنى القدرة والاستطاعة في السياق بعبارة عربية واضحة وطبيعية.
- source_word: ἐπιλαβέσθαι τοῦ ῥήματος
  choice: أن يُمسكوا عليه كلمةً
  rationale: تعبير عربي فصيح يفيد العثور في كلامه على ما يُؤخذ عليه، ويحافظ في الوقت نفسه على صورة الإمساك الواردة في اليونانية.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: أمام الشعب
  rationale: يعكس معنى الحضور العلني أمام الناس، ويحافظ على دلالة λαός بوصفه الشعب لا مجرد حشد عابر.
- source_word: θαυμάσαντες
  choice: فتعجّبوا
  rationale: ينقل رد فعلهم من الدهشة، مع ربط طبيعي بالفعل الرئيس في العربية.
- source_word: ἀπόκρισις
  choice: جوابه
  rationale: «الجواب» هو المقابل المباشر والطبيعي في سياق سؤال وردّ.
- source_word: ἐσίγησαν
  choice: لزموا الصمت
  rationale: يعبّر بوضوح عن انتقالهم إلى الصمت عقب تعجبهم، بصياغة عربية فصيحة مفهومة.
