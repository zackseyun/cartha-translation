  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: ar
  text: ولم يقدروا أن يُمسكوا عليه كلمةً أمام الشعب[a]، فتعجّبوا من جوابه ولزموا الصمت.
  philosophy: optimal-equivalence
  footnotes:
