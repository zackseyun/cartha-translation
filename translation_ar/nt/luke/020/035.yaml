source:
  edition: SBLGNT
  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: ar
  text: أَمَّا الَّذِينَ يُحْسَبُونَ أَهْلًا لِنَيْلِ ذَلِكَ الدَّهْرِ[a] وَالْقِيَامَةِ مِنْ بَيْنِ الْأَمْوَاتِ، فَلَا يَتَزَوَّجُونَ وَلَا يُزَوَّجُونَ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الدهر الآتي. وحرفيًّا: «ذلك الدهر».'
    reason: lexical_alternative
  - marker: b
    text: '«يُزَوَّجون»: أي يُعطَون للزواج أو يزوّجهم غيرهم؛ والفعل في الأصل مبني للمجهول ومتميّز عن «يتزوّجون».'
    reason: lexical_clarification
lexical_decisions:
- source_word: καταξιωθέντες
  choice: يُحْسَبُونَ أَهْلًا
  rationale: يحفظ المبني للمجهول في اليونانية، فيدل على أنهم يُعَدّون أو يُحكَم بأنهم أهل لذلك، من غير أن يقرر أنهم ينالونه باستحقاق ذاتي.
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: ذَلِكَ الدَّهْرِ
  rationale: ينقل اسم الإشارة ويحفظ المقابلة الأخروية بين الدهر الحاضر وذلك الدهر من غير استبداله بالتفسير الصريح «الدهر الآتي».
- source_word: τυχεῖν
  choice: لِنَيْلِ
  rationale: 'يفيد الحصول على شيء أو الظفر به، ويتلاءم عربيًا مع المعطوفين: ذلك الدهر والقيامة.'
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: الْقِيَامَةِ مِنْ بَيْنِ الْأَمْوَاتِ
  rationale: يعبّر بوضوح عن القيامة ويبرز دلالة ἐκ على الخروج من بين الأموات.
- source_word: γαμοῦσιν
  choice: يَتَزَوَّجُونَ
  rationale: ترجمة عربية طبيعية ومباشرة لفعل الزواج، مع إبقاء تمييزه عن الفعل المبني للمجهول التالي.
- source_word: γαμίζονται
  choice: يُزَوَّجُونَ
  rationale: يحفظ صيغة المبني للمجهول والمقابلة الاجتماعية في العبارة اليونانية، أي أن غيرهم يزوّجونهم.
theological_decisions:
- issue: هل تفيد καταξιωθέντες استحقاق الحياة في القيامة بالأعمال؟
  choice: يُحْسَبُونَ أَهْلًا
  alternative: الذين هم أهلٌ
  rationale: الصياغة المختارة تحفظ معنى التقييم في المبني للمجهول ولا تنسب إليهم استحقاقًا ذاتيًا، من غير تحديد صريح للفاعل أو حسم كيفية هذا الحكم.
- issue: هل «ذلك الدهر» تفسير صريح للدهر الآتي؟
  choice: ذلك الدهر
  alternative: الدهر الآتي
  rationale: يحافظ النص على اسم الإشارة الوارد في اليونانية وعلى الإحالة السياقية، بينما يَرِد التفسير الشائع في الحاشية.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية رصينة. استُعمل «الدهر» للدلالة على العصر أو الحقبة الأخروية، و«يُحسبون أهلًا» لصون المبني للمجهول والتوتر اللاهوتي. وُضعَت علامتا الحاشيتين في المتن كما هو مطلوب.
