base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: ar
  text: 'ثم أخذ يقول للشعب هذا المثل: «غرس رجل كرمًا، وأجّره لكرّامين، وسافر مدة طويلة[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سافر إلى بلد آخر مدة طويلة». قد يدل الفعل على الغياب عن موطن الشخص، بل على السفر إلى الخارج.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: ثم أخذ
  rationale: ينقل بدء فعل الكلام مع التقدّم السردي الذي تؤديه δέ، وهو تعبير عربي طبيعي في هذا السياق.
- source_word: πρὸς τὸν λαὸν λέγειν
  choice: يقول للشعب
  rationale: يحافظ على معنى توجيه الكلام إلى الشعب، من غير تحويل λαός إلى «الجمهور» أو «الحشد» على نحو أضيق.
- source_word: τὴν παραβολὴν ταύτην
  choice: هذا المثل
  rationale: «المثل» هو المقابل العربي المألوف لـ παραβολή في سياق الأناجيل ويحفظ نوع الخطاب.
- source_word: Ἄνθρωπος ἐφύτευσεν ἀμπελῶνα
  choice: غرس رجل كرمًا
  rationale: صياغة مباشرة تحفظ كون الشخصية رجلًا، وتنقل فعل الغرس ومعنى ἀμπελών بعبارة عربية موجزة وطبيعية.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: أجّره لكرّامين
  rationale: الفعل يدل هنا على إخراج الكرم بالإيجار، و«كرّامين» يحدد أن العاملين يزرعون الكرم من غير اختزالهم في مجرد مستأجرين.
- source_word: ἀπεδήμησεν
  choice: سافر
  rationale: ينقل معنى الابتعاد عن الموطن في سفر، مع إبقاء احتمال السفر إلى بلد آخر غير محسوم في المتن.
- source_word: χρόνους ἱκανούς
  choice: مدة طويلة
  rationale: ينقل دلالة المدة الممتدة أو المعتبرة بأسلوب عربي واضح وطبيعي.
theological_decisions:
- issue: دلالة Ἄνθρωπος من جهة الجنس
  choice: رجل
  alternative: إنسان
  rationale: المثل يقدم شخصية مفردة مذكرة بعينها؛ لذلك يحفظ «رجل» الدلالة النصية بدل تعميمها إلى لفظ محايد.
- issue: مدى سفر صاحب الكرم في ἀπεδήμησεν
  choice: سافر
  alternative: سافر إلى بلد آخر
  rationale: قد يوحي الفعل بالغياب عن الموطن، بل بالسفر إلى الخارج، لكنه لا يصرح في ذاته بالوجهة؛ لذا أبقى المتن هذا التفصيل مفتوحًا وذكره في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «كرم» و«كرّامون» لاتساق الصورة الزراعية، ووُضع مؤشر الحاشية بعد عبارة السفر التي تتعلق بها الحاشية دلاليًا.
