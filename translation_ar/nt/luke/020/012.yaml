  text: ثم أرسل ثالثًا[a]؛ لكنهم جرحوا هذا أيضًا وألقوه خارجًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا في اليونانية: «وأضاف أن يرسل ثالثًا»، وهو تعبير اصطلاحي بمعنى «ثم أرسل ثالثًا» أو «مضى فأرسل ثالثًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: ثم أرسل
  rationale: التركيب προστίθημι مع المصدر يفيد مواصلة الفعل أو الإقدام عليه مرة أخرى. تؤدي «ثم أرسل» المعنى في عربية طبيعية، ويُفهم التكرار من «ثالثًا» والسياق.
- source_word: τρίτον πέμψαι
  choice: أرسل ثالثًا
  rationale: المفعول الموصوف محذوف في اليونانية لأنه معلوم من السياق، وهو خادم. وتحافظ «ثالثًا» على هذا الإيجاز من غير غموض في سياق المثل.
- source_word: οἱ δὲ
  choice: لكنهم
  rationale: تفيد δέ هنا انتقالًا ذا طابع تقابلي بين فعل صاحب الكرم ورد المستأجرين، والضمير عائد إليهم بوضوح من السياق.
- source_word: καὶ τοῦτον
  choice: هذا أيضًا
  rationale: تنقل «أيضًا» معنى καί الإضافي، أي إن الخادم الثالث لقي هو الآخر سوء المعاملة.
- source_word: τραυματίσαντες
  choice: جرحوا
  rationale: الفعل τραυματίζω يدل تحديدًا على إحداث جرح، و«جرحوا» أدق من التعبير الأعم «آذوا».
- source_word: ἐξέβαλον
  choice: ألقوه خارجًا
  rationale: ينقل هذا التعبير قوة ἐκβάλλω واتجاه الإخراج إلى الخارج، ويلائم سياق العنف في المثل.
