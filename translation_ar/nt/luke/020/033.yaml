  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: ar
  text: ففي القيامة إذن، تصير المرأة زوجةَ مَن منهم؟ لأنها كانت زوجةً للسبعة.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'حرفيًا: «كانوا يملكونها زوجةً»؛ أي: كانت لهم زوجةً. ويمكن أيضًا: «تزوّجها السبعة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: المرأة
  rationale: يدل اللفظ هنا على المرأة التي يدور حولها السؤال، بينما يُعبَّر عن معنى الزوجية صراحةً في خبر الجملة.
- source_word: οὖν
  choice: إذًا
  rationale: تنقل أداة الاستنتاج انتقال الصدوقيين إلى نتيجة حجتهم بصياغة عربية طبيعية.
- source_word: ἐν τῇ ἀναστάσει
  choice: في القيامة
  rationale: ترجمة مباشرة تحفظ صياغة السؤال من غير إضافة «من الأموات» التي لا ترد في هذه الآية.
- source_word: τίνος αὐτῶν
  choice: مَن منهم
  rationale: يحفظ الاستفهام عن علاقة الزوجية بواحد من السبعة، وتأتي «زوجةَ» مقدمةً لتكوين السؤال العربي الطبيعي.
- source_word: γίνεται γυνή
  choice: زوجةَ ... تصير
  rationale: تحفظ «تصير» دلالة γίνομαι على الصيرورة، ويقتضي السياق الزوجي ترجمة γυνή هنا بـ«زوجة».
- source_word: οἱ γὰρ ἑπτὰ
  choice: لأن السبعة
  rationale: تطابق أداة التعليل والعدد المعرّف في اليونانية من غير إضافة لفظ «جميعًا».
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: كانت زوجةً لهم
  rationale: تنقل علاقة الزوجية المقصودة من تركيب «كان لهم إياها زوجةً» بصياغة عربية واضحة، من غير حصر المعنى في فعل عقد الزواج.
theological_decisions:
- issue: دلالة «القيامة» في سؤال الصدوقيين
  choice: إبقاء «القيامة» بلا قيد تفسيري
  alternative: القيامة من الأموات
  rationale: النص في هذه الآية يذكر ἀνάστασις وحدها؛ لذلك لا تُضاف عبارة عقائدية شارحة، وتبقى صياغة فرضية الصدوقيين وتوترها كما هي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. قُدِّم خبر «زوجةَ مَن» في السؤال للمحافظة على بؤرة الاستفهام، واستُعملت «إذًا» لإظهار تتابع الحجة من غير تشديد زائد لقوتها المنطقية.
