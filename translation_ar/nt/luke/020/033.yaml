revisions:
- from: ففي القيامة[a] إذًا، زوجةَ مَن منهم تصير المرأة؟ لأن السبعة كانت زوجةً لهم.[b]
  to: ففي القيامة إذن، تصير المرأة زوجةَ مَن منهم؟ لأنها كانت زوجةً للسبعة.[b]
  rationale: صُحّح إسناد الجملة الثانية بحيث يكون المعنى أن المرأة كانت زوجةً للسبعة، مع المحافظة على علاقة الزوجية التي يدل عليها التركيب اليوناني ἔσχον αὐτὴν γυναῖκα، لا على فعل الزواج وحده. وأُبقيت «تصير» لترجمة γίνεται، و«القيامة» بلا قيد زائد.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:34:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'الشق الثاني في المسودة («لأن السبعة كانت زوجةً لهم») يخلّ بالإسناد العربي: «السبعة» لا يصح أن يكونوا مبتدأً لخبر مؤنث مفرد بهذه الصيغة مع بقاء المرأة غير مذكورة ضميرًا، كما أن العبارة الناتجة غير سليمة. وتحتاج الجملة إلى إسناد الزوجية إلى المرأة، مع حفظ معنى ἔσχον αὐτὴν γυναῖκα، أي كانت زوجةً للسبعة في سياق القصة.'
  naturalness: صياغة السؤال مفهومة، لكن «ففي القيامة إذًا» أثقل قليلًا في الفصحى الحديثة. تقديم «إذًا» بعد «القيامة» مقبول، وإضافة «تصير المرأة» تجعل التركيب متماسكًا وواضحًا.
  terminology: «القيامة» و«المرأة» و«زوجة» اختيارات سليمة ومناسبة للسياق. وتُحفظ دلالة γίνομαι بـ«تصير» دون تحميل العبارة تفسيرًا عقائديًا.
  issues:
