  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: ar
  text: فهو ليس إله الأموات، بل إله الأحياء، لأن الجميع يحيون له.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن الجميع أحياء لديه».'
    reason: الضمير في الداتيف αὐτῷ ذو دلالة علائقية موجزة؛ ويمكن أن يُنقل بـ«له» أو بصياغة عربية دلالية مثل «لديه»، من غير تقرير تفصيلي زائد لطبيعة هذه العلاقة.
lexical_decisions:
- source_word: θεὸς
  choice: إله
  rationale: جاء الاسم في تركيب «إله أموات»، وهو معرف دلاليًا في السياق التوحيدي، وتؤدي العربية هذا التركيب طبيعيًا من غير أداة تعريف.
- source_word: δὲ
  choice: لكن
  rationale: تفيد الأداة انتقالًا مع مقابلة خفيفة، وتنسجم «لكن» مع التضاد الصريح اللاحق بين «ليس» و«بل».
- source_word: νεκρῶν
  choice: أموات
  rationale: صيغة الجمع المستعملة اسميًا تُنقل بإيجاز في تركيب «إله أموات».
- source_word: ζώντων
  choice: أحياء
  rationale: تحافظ على المقابلة الموجزة والمتوازنة مع «أموات».
- source_word: πάντες
  choice: الجميع
  rationale: تحفظ عموم اللفظ من غير تقييد مرجعه بالآباء المذكورين في السياق وحدهم.
- source_word: αὐτῷ
  choice: لديه
  rationale: 'تنقل الداتيف بوصفه علاقة أو منزلة أمام الله، وتتجنب أن توحي «له» حصرًا بمعنى الغاية: أنهم يعيشون لأجله.'
- source_word: ζῶσιν
  choice: أحياء
  rationale: الصياغة الاسمية طبيعية في العربية مع «لديه»، وتحافظ على معنى الحالة الحاضرة الذي يؤديه المضارع اليوناني.
theological_decisions:
- issue: دلالة αὐτῷ في πάντες γὰρ αὐτῷ ζῶσιν
  choice: لأن الجميع أحياء لديه
  alternative: لأن الجميع يحيون له
  rationale: الداتيف موجز ويحتمل معنى العلاقة بالله أو الحضور أمامه. تعبير «أحياء لديه» عربي واضح ولا يحصر العبارة في معنى العيش لأجل الله، بينما تُثبت الحاشية الصياغة الأقرب إلى البنية اليونانية.
translation_notes:
  register: عربية فصحى حديثة، موجزة ووقورة. حوفظ على التوازي بين «أموات» و«أحياء»، وعلى عموم «الجميع»، مع إبقاء دلالة العبارة الأخيرة مفتوحة في الحاشية.
