    rationale: δέ ليست هنا أداة استدراك قوي بالضرورة؛ والمقابلة الحاسمة موجودة في «ليس ... بل». لذا «فهو» أنسب للانتقال الخفيف.
  - severity: low
    issue: صياغة «إله أموات/أحياء» غير معرّفة
    rationale: هي ممكنة في أسلوب موجز، لكن «إله الأموات ... الأحياء» أوضح في الاستعمال العربي المعاصر وأوثق بالبنية المقصودة.
  - severity: low
    issue: موضع الاختيار بين «أحياء لديه» و«يحيون له»
    rationale: الأصل مضارع («ζῶσιν») وداتيف موجز متنازع في تحديد علاقته؛ اعتماد «يحيون له» في المتن أقرب إلى البنية، وإيراد «أحياء لديه» في الحاشية يحفظ البديل العربي الطبيعي دون حسم زائد.
