  text: For they no longer dared to ask him anything.
translation:
  language: ar
  text: لِأَنَّهُمْ لَمْ يَعُودُوا يَجْرُؤُونَ أَنْ يَسْأَلُوهُ عَنْ أَيِّ شَيْءٍ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: لَمْ يَعُودُوا
  rationale: ينقل معنى توقّف الفعل من تلك النقطة فصاعدًا بصياغة عربية فصيحة وطبيعية.
- source_word: γάρ
  choice: لِأَنَّ
  rationale: يحفظ الصلة التفسيرية أو التعليلية بالسياق السابق.
- source_word: ἐτόλμων
  choice: يَجْرُؤُونَ
  rationale: يؤدي معنى امتلاك الجرأة، وجاء بصيغة المضارع بعد «لم يعودوا» للتعبير طبيعيًا عن انقطاع حالتهم السابقة.
- source_word: ἐπερωτᾶν
  choice: أَنْ يَسْأَلُوهُ
  rationale: ترجمة طبيعية للمصدر المتمم لفعل الجرأة، مع إظهار ضمير المفعول العائد إلى يسوع.
- source_word: αὐτόν
  choice: ـهُ
  rationale: ضمير المفعول المتصل في «يسألوه» يحيل بوضوح إلى يسوع.
- source_word: οὐδέν
  choice: عَنْ أَيِّ شَيْءٍ
  rationale: ينقل الشمول المقصود في سياق النفي، ويتلاءم مع الاستعمال العربي الطبيعي للفعل «سأل».
theological_decisions: []
