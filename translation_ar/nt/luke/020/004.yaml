  text: Was John's baptism from heaven or from men?[a]
translation:
  language: ar
  text: هل كانت معمودية يوحنا من السماء أم من الناس؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «من الله»؛ واليونانية حرفيًا: «من السماء»، وهو تعبير توقيري يشير إلى المصدر أو السلطان الإلهي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: معمودية
  rationale: يدل الاسم على شعيرة المعمودية المرتبطة بيوحنا، و«معمودية» هي المقابل العربي المألوف والدقيق في هذا السياق.
- source_word: Ἰωάννου
  choice: يوحنا
  rationale: 'الإضافة اليونانية تُنقل طبيعيًا في العربية بالإضافة: «معمودية يوحنا»، أي المعمودية المرتبطة به.'
- source_word: ἐξ οὐρανοῦ
  choice: من السماء
  rationale: يحافظ هذا على اللفظ اليوناني والتعبير التوقيري اليهودي، من غير أن يفسره صراحةً بأنه «من الله».
- source_word: ἐξ ἀνθρώπων
  choice: من الناس
  rationale: المراد أصل بشري في مقابل الأصل أو السلطان الإلهي؛ و«الناس» تعبر طبيعيًا عن الجمع العام غير المقصور على الذكور.
- source_word: ἦν
  choice: كانت
  rationale: يحافظ الفعل على تركيب الجملة اليونانية القائم على فعل الكينونة مع عبارتي المصدر، وهو عربي طبيعي هنا.
- source_word: ἢ
  choice: أم
  rationale: «أم» هي الأنسب في السؤال الذي يعرض بديلين محددين.
theological_decisions:
- issue: دلالة «من السماء» في صلتها بمعمودية يوحنا
  choice: إبقاء التعبير «من السماء» في المتن
  alternative: من الله
  rationale: يدل التعبير على المصدر أو السلطان الإلهي، لكن اليونانية تقول حرفيًا «من السماء». إبقاؤه يصون الأسلوب التوقيري ولا يحسم التعبير التفسيري داخل المتن.
translation_notes:
  register: العربية فصحى حديثة واضحة وموجزة. استُعملت «هل... أم...» لصياغة السؤال ذي البديلين بصورة طبيعية، مع الحفاظ على المقابلة بين «من السماء» و«من الناس».
