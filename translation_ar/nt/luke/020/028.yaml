base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: ar
  text: 'قائلين: «يا معلّم، كتب لنا موسى: إن مات أخو أحدٍ وله زوجة، وكان بلا أولاد، فعلى أخيه أن يأخذ الزوجة وأن يقيم نسلًا لأخيه[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«يقيم نسلًا» تعكس التعبير القانوني في تثنية 25:5، أي أن يوفّر نسلًا يُنسب إلى الأخ المتوفى؛ وحرفيًا: «يقيم زرعًا».'
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: نداء مباشر ليسوع، و«معلّم» هو المقابل العربي الواضح والطبيعي دون إيحاءات زائدة.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: كتب لنا موسى
  rationale: تحفظ دلالة ἡμῖν على أن الشريعة كُتبت لهم ولأجلهم، لا أنها رسالة موجّهة إليهم مباشرة.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: إن مات أخو أحدٍ
  rationale: صياغة عربية فصيحة تحافظ على التنكير والعموم في τινος.
- source_word: ἔχων γυναῖκα
  choice: وله زوجة
  rationale: تنقل المعنى الحرفي للمشاركة «له زوجة» بصورة عربية طبيعية، من غير إضافة معنى «ترك» غير المصرّح به.
- source_word: οὗτος ἄτεκνος ᾖ
  choice: وكان بلا أولاد
  rationale: توضح أن المتوفى لم يكن له أولاد، وتحافظ على عموم ἄτεκνος من غير تقييده بالذكور.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: فعلى أخيه أن يتخذ زوجته
  rationale: «فعلى» تنقل قوة الحكم القانوني، و«يتخذ زوجته» تحافظ على فعل الأخذ في سياق الزواج دون إسهاب تفسيري.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: يقيم نسلًا
  rationale: تحفظ العبارة القانونية الكتابية وصورة «الإقامة»، بينما تعبّر «نسل» بوضوح عن σπέρμα في هذا السياق.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: لأخيه
  rationale: 'تنقل دلالة المنفعة أو النسبة: يُنسب النسل إلى الأخ المتوفى.'
theological_decisions:
- issue: صياغة حكم زواج أرملة الأخ من غير إدخال شرح ثقافي أو مذهبي في المتن
  choice: فعلى أخيه أن يتخذ زوجته، وأن يقيم نسلًا لأخيه
  alternative: يجب على أخيه أن يتزوج الأرملة وينجب أولادًا يُنسبون إلى أخيه
  rationale: الصياغة المختارة تحافظ على النبرة القانونية وعلى العبارة الكتابية، ولا تضيف في المتن تفاصيل تفسيرية تتجاوز اللفظ اليوناني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة قانونية رصينة. حُفظت العبارة «وله زوجة» قريبة من اليونانية، واستُعملت «بلا أولاد» للوضوح، مع إبقاء شرح المصطلح القانوني في الحاشية.
