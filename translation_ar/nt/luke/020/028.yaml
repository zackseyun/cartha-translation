  to: 'قائلين: «يا معلّم، كتب لنا موسى: إن مات أخو أحدٍ وله زوجة، وكان بلا أولاد، فعلى أخيه أن يأخذ الزوجة وأن يقيم نسلًا لأخيه[a]».'
