  source_fidelity: 'المعنى العام منقول بأمانة: النداء، والاستشهاد بما كتبه موسى، وموت الأخ المتزوج بلا أولاد، والواجب القانوني بإقامة نسل للأخ. غير أن ضمير «زوجته» بعد «أخيه» قد يلتبس في العربية: هل يعود إلى الأخ الذي سيأخذ المرأة أم إلى الأخ المتوفى؟ والنص اليوناني يكرر «الزوجة» مع كون المرجع السياقي هو زوجة الأخ المتوفى.'
  naturalness: «فعلى أخيه أن يتخذ زوجته» مفهومة في السياق، لكنها أقل سلاسة وتحتمل التباسًا مرجعيًا. «أن يأخذ الزوجة» أقرب إلى البنية القانونية للنص، وأوضح عربيًا بسبب سبق ذكر الزوجة.
  terminology: «معلّم»، و«بلا أولاد»، و«يقيم نسلًا» اختيارات فصيحة ملائمة. وتحافظ الحاشية على الطابع الاصطلاحي لعبارة «يقيم نسلًا» وعلى الإشارة الصحيحة إلى تثنية 25:5.
