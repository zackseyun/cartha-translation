  yaml_path: translation/nt/luke/020/003.yaml
  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: ar
  text: 'فأجابهم قائلًا: «وأنا أيضًا سأسألكم سؤالًا، فأخبروني:»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: فأجابهم قائلًا
  rationale: صياغة عربية طبيعية تحفظ معنى الاستجابة في اسم الفاعل ἀποκριθείς وفعل القول الرئيسي εἶπεν، وتؤدي δέ بوصفها انتقالًا سياقيًا من غير إثقال العبارة.
- source_word: Ἐρωτήσω
  choice: سأسأل
  rationale: المستقبل من ἐρωτάω يدل على طرح سؤال، وصيغة «سأسأل» واضحة ومباشرة.
- source_word: ὑμᾶς
  choice: كم
  rationale: ضمير جمع في موقع المفعول به، أُلحق بالفعل وفق الأسلوب العربي الطبيعي.
- source_word: κἀγὼ
  choice: وأنا أيضًا
  rationale: 'تحفظ الصياغة عنصر الإضافة والتوكيد في καὶ ἐγώ: فكما سألوه، سيسألهم هو أيضًا.'
- source_word: λόγον
  choice: سؤالًا
  rationale: مع أن اللفظة تعني حرفيًا «كلمة» أو «أمرًا»، فإن اقترانها هنا بفعل السؤال يجعل «سؤالًا» المقابل العربي الاصطلاحي الواضح.
- source_word: καὶ εἴπατέ μοι
  choice: فأخبروني
  rationale: صيغة أمر موجهة إلى جمع مع ضمير المتكلم غير المباشر؛ و«فأخبروني» تنقل الطلب المباشر والنتيجة المطلوبة بعد طرح السؤال.
theological_decisions: []
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صياغة طبيعية غير متكلفة، مع إبقاء نبرة الرد والتحدي المتبادل. لا تستلزم «سؤالًا» حاشية عربية لأن المعنى الاصطلاحي واضح في السياق، ولا توجد في الآية مسألة لاهوتية تحتاج إلى ترجيح.
