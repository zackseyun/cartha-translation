  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: ar
  text: 'فتشاوروا فيما بينهم قائلين: «إن قلنا: مِن السماء، فسيقول: لماذا لم تصدّقوه؟[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم تثقوا به؟» فالفعل اليوناني قد يعني التصديق أو الثقة بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: فتشاوروا فيما بينهم
  rationale: يفيد الفعل مداولةً عقلية وحسابًا للجواب داخل الجماعة، والعبارة العربية طبيعية وتحفظ معنى التشاور المتبادل.
- source_word: λέγοντες
  choice: قائلين
  rationale: يحفظ صيغة اسم الفاعل المعاصرة للفعل الرئيس بأسلوب عربي فصيح ومألوف.
- source_word: Ἐὰν εἴπωμεν
  choice: إن قلنا
  rationale: ينقل الشرط المحتمل بإيجاز طبيعي من غير زيادة في درجة الاحتمال.
- source_word: Ἐξ οὐρανοῦ
  choice: مِن السماء
  rationale: يحفظ التعبير اليوناني الدال ضمنًا على المصدر أو السلطان الإلهي، من غير تفسيره صراحةً بعبارة «من الله».
- source_word: ἐρεῖ
  choice: فسيقول
  rationale: ينقل الفعل البسيط «سيقول» كما هو، وتؤدي العبارة المقتبسة التالية معنى السؤال.
- source_word: Διὰ τί
  choice: لماذا
  rationale: المقابل العربي الطبيعي والمباشر لأداة السؤال عن السبب.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: لم تصدّقوه
  rationale: الفعل مع المفعول غير المباشر هنا يتعلق بقبول قول يوحنا وشهادته؛ و«تصدّقوه» أدق في هذا السياق من «تؤمنوا به»، التي قد توحي بإيمان شخصي أوسع.
theological_decisions:
- issue: المقصود بالمصدر في عبارة «مِن السماء»
  choice: الإبقاء على «مِن السماء»
  alternative: «من الله»
  rationale: العبارة تشير إلى أصل أو سلطان إلهي، لكن النص يستعمل «السماء». إبقاؤها يصون أسلوب النص ولا يحوّل الدلالة الضمنية إلى تفسير صريح.
- issue: دلالة πιστεύω في موقفهم من يوحنا
  choice: «تصدّقوه»
  alternative: «تثقوا به» أو «تؤمنوا به»
  rationale: السياق يركّز على قبول كلام يوحنا وسلطانه؛ لذلك تحافظ «تصدّقوه» على هذا المعنى من غير توسيعه إلى صيغة إيمانية أشمل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «فتشاوروا فيما بينهم» بدل تركيب حرفي ثقيل، مع الحفاظ على معنى المداولة الجماعية. وُضع مؤشر الحاشية بعد السؤال الذي تتعلق به.
