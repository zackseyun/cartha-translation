  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: ar
  text: وسعى الكتبة ورؤساء الكهنة إلى أن يضعوا أيديهم عليه في تلك الساعة نفسها[a]، لكنهم خافوا الشعب، لأنهم عرفوا أنه قال هذا المثل ضدهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يمسكوا به» أو «يقبضوا عليه»؛ وحرفيًا: «يضعوا أيديهم عليه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إليهم». ويُرجَّح أن العبارة تفيد أن المثل كان موجَّهًا ضدهم.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: سعى
  rationale: ينقل قصدهم ومحاولتهم كما يلخصهما الفعل الماضي اليوناني، من غير أن يوحي بأنهم نجحوا.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: المقابل التاريخي المألوف لهذه الفئة في سياق الأناجيل، وهو أدق من تعبير تفسيري عام مثل «علماء الشريعة».
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: يشير الجمع هنا إلى طبقة القيادة الكهنوتية، لا إلى وجود عدة أشخاص يشغلون منصب رئيس الكهنة في وقت واحد.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: أن يُلقوا أيديهم عليه
  rationale: يحافظ على صورة التعبير اليوناني وعلى دلالته العدائية، مع ترك المقصود الدقيق—الإمساك أو القبض—مفتوحًا.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: في تلك الساعة نفسها
  rationale: يحفظ التشديد على فورية رد فعلهم وارتباطه بالموقف عينه.
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: خافوا الشعب
  rationale: ينقل المفعول المباشر ويحافظ على الإشارة إلى عامة الناس، لا إلى مجرد حشد عابر.
- source_word: ἔγνωσαν
  choice: عرفوا
  rationale: ترجمة مباشرة تفيد أنهم أدركوا الجهة المقصودة بالمثل من غير زيادة تفسيرية.
- source_word: πρὸς αὐτοὺς
  choice: ضدهم
  rationale: السياق العدائي ورد فعل القادة يدلان على أن المثل كان موجَّهًا إليهم على سبيل الإدانة؛ وتوضح الحاشية المعنى الحرفي البديل.
- source_word: παραβολὴν
  choice: المثل
  rationale: هو المصطلح العربي الراسخ والطبيعي لأمثال يسوع في الأناجيل.
theological_decisions:
- issue: دلالة πρὸς αὐτοὺς في صلة المثل بالقادة الدينيين
  choice: قال المثل ضدهم
  alternative: قال المثل إليهم، أو قاله عنهم
  rationale: يبين رد فعلهم أنهم رأوا أنفسهم موضوع الإدانة في المثل السابق. وتؤدي «ضدهم» القوة التصادمية للسياق من غير إضافة مضمون عقائدي، مع حفظ البديل الأقرب إلى اللفظ في الحاشية.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. حُفظت صورة التعبير اليوناني في المتن، ووُضحت دلالته السياقية في الحاشية، كما حُفظ احتمال معنى πρὸς الحرفي من غير إضعاف القوة العدائية التي يقتضيها السياق.
