  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: ar
  text: 'سيأتي ويُهلك هؤلاء الكرّامين[a]، ويعطي الكرم لآخرين». فلما سمعوا قالوا: «حاشا أن يحدث هذا![b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الزارعين» أو «المستأجرين»؛ فاللفظ اليوناني يشير هنا إلى أناس كانوا يزرعون أرضًا يملكها غيرهم.
    reason: lexical_alternative
  - marker: b
    text: 'أو «كلا، مطلقًا!» أو «لا يكون هذا!»؛ والعبارة اليونانية رفض شديد، ومعناها الحرفي: «ليت هذا لا يحدث».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: سيأتي
  rationale: ينقل المستقبل ببساطة من غير إضافة معنى الرجوع، الذي لا يصرّح به النص اليوناني.
- source_word: ἀπολέσει
  choice: يُهلك
  rationale: يحفظ شدة الحكم واتساع دلالة الفعل، التي قد تشمل القتل أو التدمير، من غير تضييق غير لازم.
- source_word: γεωργοὺς
  choice: الكرّامين
  rationale: في سياق مثل الكرم يدل اللفظ على الذين يتولّون زراعة كرم يملكه غيرهم؛ و«الكرّامون» تعبير عربي طبيعي يحفظ صورة المثل.
- source_word: τούτους
  choice: هؤلاء
  rationale: يحفظ قوة اسم الإشارة القريب وإحالته المباشرة إلى الكرّامين المذكورين.
- source_word: δώσει
  choice: يعطي
  rationale: مقابل مباشر وطبيعي للفعل اليوناني، من غير أن يضيف تفسيرًا مثل «يأتمن» أو «يسلّم».
- source_word: τὸν ἀμπελῶνα
  choice: الكرم
  rationale: هو المقابل العربي المألوف والدقيق، ويحفظ الصورة الزراعية وأصداءها الكتابية.
- source_word: ἄλλοις
  choice: لآخرين
  rationale: يحفظ عدم تحديد هوية المتلقين كما في اليونانية.
- source_word: ἀκούσαντες δὲ εἶπαν
  choice: فلما سمعوا قالوا
  rationale: صياغة عربية سلسة تنقل العلاقة الزمنية للفعل المشارك، مع بقاء مرجع الضمير غير مصرّح به كما في الأصل.
- source_word: Μὴ γένοιτο
  choice: حاشا أن يحدث هذا!
  rationale: 'ينقل الرفض القوي المشوب بالتمني والصدمة، ويحافظ على معنى العبارة الحرفي التقريبي: ألا يحدث ذلك.'
theological_decisions:
- issue: قوة رد السامعين في Μὴ γένοιτο
  choice: حاشا أن يحدث هذا!
  alternative: كلا، مطلقًا! / لا يكون هذا!
  rationale: العبارة هنا رفض انفعالي للحكم المعلن، لا مجرد نفي منطقي. تحافظ الصياغة المختارة على قوة التمني والاعتراض من غير إضافة مضمون عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «الكرّامين» لانسجامه الطبيعي مع «الكرم»، وأُبقيت الجمل المستقبلية مباشرة ومقتضبة. وُضعت علامتا الحاشيتين في المتن كما يلزم.
