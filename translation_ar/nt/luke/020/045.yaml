lexical_decisions:
- source_word: Ἀκούοντος
  choice: بينما كان ... يستمع
  rationale: اسم الفاعل المضارع في تركيب المضاف المطلق يبيّن ظرف الكلام وفعلًا متزامنًا مستمرًّا؛ وهذه الصياغة عربية طبيعية تحفظ ذلك.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السرد من غير أن تفيد تعارضًا قويًّا؛ وقد اندمجت طبيعيًّا في «وبينما».
- source_word: παντὸς τοῦ λαοῦ
  choice: الشعب كله
  rationale: تفيد العبارة الشعب بوصفه جماعة كاملة، لا مجرد حشد؛ و«الشعب كله» تعبير عربي واضح يحفظ المعنى الجمعي.
- source_word: εἶπεν
  choice: قال
  rationale: الماضي من λέγω يفيد هنا فعل القول السردي المباشر.
- source_word: τοῖς μαθηταῖς
  choice: للتلاميذ
  rationale: «التلاميذ» المقابل المألوف والدقيق في سياق الأناجيل، ولا يضيف النص اليوناني ضمير الملكية «تلاميذه».
theological_decisions:
- issue: التمييز بين الحاضرين والمخاطَبين مباشرة
  choice: قال للتلاميذ بينما كان الشعب كله يستمع
  alternative: أن يكون الكلام موجَّهًا إلى الشعب كله مباشرة، أو أن يكون حديثًا خاصًّا مع التلاميذ بعيدًا عن الشعب
  rationale: يحدّد تركيب المضاف المطلق المشهد العلني وسماع الشعب، بينما يحدّد المجرور الدال على المتلقي «للتلاميذ» المخاطَبين مباشرة؛ فتحفظ الصياغة العنصرين دون دمجهما.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «الشعب» بدل «الجمع» للمحافظة على دلالة λαός، وصيغت الجملة بسلاسة مع إبقاء المخاطَبين المباشرين متميزين عن جمهور السامعين.
