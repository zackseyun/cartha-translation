id: LUK.20.47
reference: Luke 20:47
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: ar
  text: الذين يلتهمون بيوت الأرامل، ويتذرّعون بإطالة الصلاة[a]. هؤلاء سينالون دينونة أشد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ويصلّون طويلًا تظاهرًا»؛ أو: «يتخذون الصلاة الطويلة ستارًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إدانة أعظم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: يلتهمون
  rationale: يحافظ على الصورة المجازية القوية التي تصف الاستغلال الجشع، ولا يحوّل الفعل إلى أكل حرفي.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: بيوت الأرامل
  rationale: ينقل اللفظ اليوناني مباشرة، مع بقاء احتمال استعمال «البيوت» كناية عن الممتلكات أو موارد المعيشة.
- source_word: προφάσει
  choice: يتذرّعون
  rationale: يعبّر طبيعيًا عن اتخاذ الصلاة الطويلة ذريعة أو ستارًا، مع إثبات البديل الأقرب لفظيًا في الحاشية.
- source_word: μακρὰ προσεύχονται
  choice: بإطالة الصلاة
  rationale: صياغة عربية واضحة تفيد أنهم يصلّون زمنًا طويلًا، وتنسجم نحويًا مع «يتذرّعون».
- source_word: λήμψονται
  choice: سينالون
  rationale: ينقل معنى التلقي بوصفه عاقبة آتية بصياغة عربية فصيحة ومألوفة.
- source_word: περισσότερον κρίμα
  choice: دينونة أشد
  rationale: يحافظ على الدلالة القضائية لـκρίμα وعلى المقارنة، ويأتي طبيعيًا في العربية دون حصر المعنى في مفردة «إدانة» وحدها.
theological_decisions:
- issue: دلالة κρίμα في سياق التنديد
  choice: دينونة
  alternative: إدانة أشد
  rationale: السياق يدل على حكم إلهي سلبي، لكن «دينونة» تبقي السعة القضائية للفظ اليوناني ولا تحسمها إلى «إدانة» فقط.
- issue: علاقة الصلاة الطويلة بـπροφάσει
  choice: اتخاذها ذريعة أو ستارًا
  alternative: الصلاة الطويلة لمجرد التظاهر
  rationale: اللفظ قد يشير إلى ذريعة تُستعمل لتغطية الاستغلال أو إلى مظهر زائف؛ الترجمة والحاشية تحفظان هذا المجال دون تعيين دافع أدق مما يقوله النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُبقيت صورة «يلتهمون بيوت الأرامل» لقوتها البلاغية، ووُضعت علامتا الحاشيتين في المتن بحسب المطلوب.
