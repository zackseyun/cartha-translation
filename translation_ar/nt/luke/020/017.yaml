  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: ar
  text: 'فنظر إليهم مليًّا وقال: «فما هذا المكتوب إذًا: ‹الحجر الذي رفضه البنّاؤون صار هو رأس الزاوية[a]›؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حجر الزاوية»؛ أو: «حجر التتويج». واليونانية حرفيًا: «رأس الزاوية».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμβλέψας
  choice: نظر إليهم مليًّا
  rationale: يفيد الفعل نظرة مقصودة وموجَّهة إليهم؛ و«مليًّا» تنقل التمعّن من غير مبالغة كالتحديق.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: فما معنى هذا المكتوب
  rationale: صياغة عربية طبيعية تحفظ قوة السؤال البلاغي وإحالة اسم المفعول التام إلى نص ثابت مكتوب، من غير تخصيصه بلفظ «الكتاب» غير الوارد صراحة.
- source_word: Λίθον
  choice: الحجر
  rationale: التعريف ملائم في العربية لأن الكلام اقتباس معروف ويتناول حجرًا محددًا داخل الصورة.
- source_word: ἀπεδοκίμασαν
  choice: رفضه
  rationale: ينقل بوضوح حكم البنّائين عليه بأنه غير صالح ثم استبعادهم له.
- source_word: οἱ οἰκοδομοῦντες
  choice: البنّاؤون
  rationale: ترجمة اسمية طبيعية لاسم الفاعل المستعمل استعمال الاسم، وتحفظ استعارة البناء.
- source_word: οὗτος
  choice: هو
  rationale: الضمير المنفصل يبرز المفارقة والتوكيد في اسم الإشارة اليوناني من غير إضافة تفسير مسياني صريح.
- source_word: ἐγενήθη εἰς
  choice: صار
  rationale: ينقل التحول إلى الحالة أو المنزلة الجديدة بإيجاز عربي طبيعي.
- source_word: κεφαλὴν γωνίας
  choice: رأس الزاوية
  rationale: ترجمة حرفية مفهومة تحفظ الصورة المعمارية وغموض موضع الحجر بدل حسمها بأنه حجر أساس أو حجر تتويج.
theological_decisions:
- issue: الصورة المعمارية في اقتباس مزمور 118:22
  choice: رأس الزاوية
  alternative: حجر الزاوية؛ أو حجر التتويج
  rationale: العبارة اليونانية تحتمل تصورات معمارية متعددة. يحفظ المتن التعبير الأقرب إلى الأصل، وتعرض الحاشية البدائل من غير ترجيح مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فما معنى هذا المكتوب» لتجنب تركيب حرفي ثقيل في العربية، مع إبقاء السؤال البلاغي. وُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
