lexical_decisions:
- source_word: Δαυὶδ
  choice: داود
  rationale: الصيغة العربية الكتابية المألوفة للاسم.
- source_word: οὖν
  choice: إذًا
  rationale: تفيد الاستنتاج من الاقتباس والحجة السابقين، وهي طبيعية وواضحة في العربية المعاصرة.
- source_word: αὐτὸν κύριον
  choice: يدعوه ربًّا
  rationale: ينقل تركيب «يسمّيه/يدعوه ربًّا»، ويحفظ الوزن التكريمي والمسياني لكلمة κύριος من غير زيادة تفسيرية.
- source_word: καλεῖ
  choice: يدعوه
  rationale: فعل عربي فصيح ومباشر بمعنى يسمّيه، ويناسب بساطة المضارع اليوناني.
- source_word: πῶς
  choice: فكيف
  rationale: ينقل السؤال البلاغي بوضوح، وتربط الفاء بين شطري الاستدلال ربطًا عربيًا طبيعيًا.
- source_word: αὐτοῦ υἱός
  choice: ابنه
  rationale: يحفظ اللفظ الصريح «ابنه» بدل توسيعه في المتن إلى «من نسله»، وبذلك يبقي توتر الحجة قائمًا.
- source_word: ἐστιν
  choice: يكون
  rationale: صياغة عربية طبيعية للسؤال عن كيفية اتصافه بهذه الصفة، مع بقاء معنى فعل الكينونة.
theological_decisions:
- issue: ترجمة κύριος في سياق حجة مسيانية
  choice: ربًّا
  alternative: سيّدًا
  rationale: «رب» يحفظ قوة اللقب وارتباطه باقتباس المزمور، من غير أن يضيف إلى العبارة ما لا تصرّح به.
- issue: هل يُوسَّع υἱός إلى معنى السليل
  choice: ابنه
  alternative: من نسله
  rationale: النص اليوناني يقول صراحة «ابنه»، والحجة قائمة على هذا الوصف البنوي؛ لذلك يُحفظ في المتن، مع بيان المدلول النسبي الأوسع في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة وذات نبرة كريمة. استُعمل «يدعوه ربًّا» لصياغة طبيعية قريبة من ترتيب الأصل، وحُفظ السؤال البلاغي والتوتر بين لقب «رب» ووصف «ابن» دون حسم تفسيري.
