  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: ar
  text: وأمّا أنَّ الموتى يُقامون، فقد أظهر موسى ذلك أيضًا في المقطع الخاص بالعُلَّيقة[a]، إذ يسمّي الربَّ[b] إلهَ إبراهيم وإلهَ إسحاق وإلهَ يعقوب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عند العُلَّيقة»؛ فقد يشير التعبير اليوناني إلى المشهد نفسه أو، على سبيل الاصطلاح، إلى مقطع الكتاب عن العُلَّيقة المتقدة (الخروج 3).'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «الرب»؛ وهذا يوافق الاستعمال المعتاد في الترجمة السبعينية للاسم الإلهي في الخروج 3.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: يُقامون
  rationale: يحفظ صيغة المبني للمجهول في اليونانية، ويلائم سياق القيامة مع إبقاء فاعل الإقامة مفهومًا ضمنًا من غير إضافته إلى النص.
- source_word: οἱ νεκροὶ
  choice: الموتى
  rationale: مقابل عربي طبيعي للاسم الجمعي، ويحفظ دلالته الجامعة.
- source_word: ἐμήνυσεν
  choice: بيَّنه
  rationale: ينقل معنى الإظهار والإبانة في حجة موسى، من غير المبالغة إلى معنى الإعلان الرسمي.
- source_word: ἐπὶ τῆς βάτου
  choice: في المقطع الذي عن العُلَّيقة
  rationale: التعبير يُفهم اصطلاحيًا على أنه إحالة إلى مقطع الكتاب عن العليقة، مع إبقاء صورة العليقة نفسها ظاهرة.
- source_word: ὡς λέγει
  choice: إذ يدعو
  rationale: يناسب التركيب الذي يصف فيه موسى الرب بأنه إله إبراهيم وإسحاق ويعقوب، وهو عربي طبيعي في السياق.
- source_word: κύριον
  choice: الربَّ
  rationale: يحفظ اللقب الإلهي الوارد في النص اليوناني من دون تحويله في المتن إلى صيغة لا تظهر فيه مباشرة.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: إلهَ إبراهيم وإلهَ إسحاق وإلهَ يعقوب
  rationale: يحفظ تكرار «إله» وإيقاع العبارة اليونانية والاستشهاد من الخروج.
theological_decisions:
- issue: لغة القيامة في حجة يسوع على الصدوقيين
  choice: الموتى يُقامون
  alternative: الموتى يقومون
  rationale: المبني للمجهول أقرب إلى ἐγείρονται ويحفظ الإيحاء بالفعل الإلهي من غير تسمية الفاعل أو إضافة تقرير عقائدي خارج النص.
- issue: ترجمة κύριος في الإحالة إلى إله إسرائيل
  choice: الرب
  alternative: الرَّبّ بصيغة طباعية مميِّزة للاسم الإلهي
  rationale: النص اليوناني يقرأ κύριον، ولذلك تُحفظ ترجمته المباشرة «الرب»، مع بيان صلته بتقليد ترجمة الاسم الإلهي في الحاشية.
- issue: هل ἐπὶ τῆς βάτου مشهد مكاني أم عنوان لمقطع كتابي
  choice: في المقطع الذي عن العليقة
  alternative: عند العليقة
  rationale: القراءة الأدبية أوضح في السياق، لكن الاحتمال المكاني الحقيقي محفوظ في الحاشية بدل طمسه.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعملت «العُلَّيقة» بوصفها اللفظة الكتابية المألوفة للشجيرة، وحُفظ تكرار «إله» للتوكيد والإيقاع. وُضعت علامتا الحاشيتين في المتن كلتاهما.
