  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: ar
  text: 'ولكن إن قلنا: «من الناس»، فسيرجمنا الشعب كله، لأنه مقتنع بأن يوحنا كان نبيًّا[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأن يوحنا نبيّ». فالمصدر اليوناني لا يحدد الزمن في ذاته، ويحتمل السياق كلا التعبيرين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: ولكن إن قلنا
  rationale: ينقل «إن» مع الفعل الماضي معنى الاحتمال الشرطي، وتؤدي «لكن» القوة الاستدراكية لـ δέ في السياق.
- source_word: Ἐξ ἀνθρώπων
  choice: من الناس
  rationale: صياغة موجزة تحافظ على العبارة الإهليلجية المقابلة لمصدر معمودية يوحنا وسلطانه، من غير إضافة تفسير مثل «من أصل بشري».
- source_word: ὁ λαὸς ἅπας
  choice: الشعب كله
  rationale: تحافظ على المعنى الجمعي لـ λαός وعلى شمول ἅπας، وهي عبارة عربية طبيعية.
- source_word: καταλιθάσει ἡμᾶς
  choice: فسيرجمنا
  rationale: «يرجم» هو المقابل العربي المباشر للرمي بالحجارة، ولا يضيف صراحةً نتيجة الموت التي لم يصرح بها النص اليوناني.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: لأنه مقتنع
  rationale: جاء الوصف في اليونانية مفردًا عائدًا إلى «الشعب كله» بوصفه جماعة واحدة؛ لذلك يحافظ المفرد العربي على البنية والمعنى الطبيعيين.
- source_word: Ἰωάννην προφήτην εἶναι
  choice: بأن يوحنا كان نبيًّا
  rationale: تحويل تركيب المفعول مع المصدر إلى جملة عربية بـ«أن». واستعمال «كان» طبيعي في الإشارة إلى يوحنا ضمن السرد، مع التنبيه إلى أن المصدر اليوناني لا يحسم الزمن بذاته.
theological_decisions:
- issue: زمن وصف يوحنا بأنه نبي
  choice: بأن يوحنا كان نبيًّا
  alternative: بأن يوحنا نبيّ
  rationale: المصدر εἶναι لا يحدد الزمن مستقلًا، والعربية تقبل الماضي بحسب الإطار السردي. أُبقي البديل في الحاشية حتى لا يُحسم ما يتركه التركيب اليوناني محتملًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. حوفظ على إيجاز العبارة «من الناس» وعلى صيغة المداولة الشرطية، من غير توسيع تفسيري أو إضافة دلالات طائفية.
