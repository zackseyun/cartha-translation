source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: ar
  text: وحدث، في أحد تلك الأيام، بينما كان يعلِّم الشعب في الهيكل[a] ويعلن لهم البشارة[b]، أن أقبل عليه رؤساء الكهنة والكتبة مع الشيوخ،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير الكلمة اليونانية ἱερόν إلى مجمّع الهيكل كله، لا إلى المقدس الداخلي وحده.
    reason: cultural_note
  - marker: b
    text: 'أو: «يبشِّرهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: وحدث
  rationale: يحافظ على أداة الانتقال السردي الشائعة عند لوقا بصياغة عربية واضحة غير عتيقة.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: في أحد تلك الأيام
  rationale: ينقل معنى اليوم غير المحدد ضمن سلسلة الأيام الجارية، ويحافظ على الدلالة التبعيضية.
- source_word: διδάσκοντος αὐτοῦ
  choice: بينما كان يعلِّم
  rationale: يصوغ التركيب المطلق الدال على التزامن في جملة ظرفية عربية طبيعية.
- source_word: τὸν λαὸν
  choice: الشعب
  rationale: يدل اللفظ هنا على عامة الناس، لا على مجرد حشد حاضر.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: تعبير عربي موجز ومألوف، مع إيضاح في الحاشية أن المقصود مجمّع الهيكل لا المقدس الداخلي وحده.
- source_word: εὐαγγελιζομένου
  choice: يعلن لهم البشارة
  rationale: يحافظ على القوة الفعلية للفظ وعلى معنى إعلان الخبر السار، بلغة مفهومة لا تحصره في اصطلاح كنسي تقني.
- source_word: ἐπέστησαν
  choice: أقبل عليه
  rationale: ينقل معنى مجيئهم المباشر إليه، وربما المفاجئ، من غير أن يضيف صراحةً معنى المواجهة العدائية.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: يدل الجمع في سياق الهيكل الثاني على قادة الطبقة الكهنوتية، لا على وجود عدة أشخاص يشغلون منصب رئيس الكهنة في آن واحد.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: يحافظ على التسمية التاريخية المباشرة لهذه الفئة.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: مع الشيوخ
  rationale: ينقل معنى المصاحبة والتحالف بين فئات القيادة من غير إثقال الأسلوب.
theological_decisions:
- issue: صياغة εὐαγγελιζομένου في وصف خدمة يسوع العلنية
  choice: يعلن لهم البشارة
  alternative: يبشِّرهم / يكرز بالإنجيل
  rationale: الصياغة المختارة تنقل معنى إعلان الخبر السار وتحافظ على طبيعة الفعل، من غير استيراد دلالة كنسية تقنية أضيق من السياق.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظ الانتقال السردي والتركيب الزمني، ووُضعت علامتا الحاشية عند اللفظين اللذين تشرحهما الحاشيتان فعلًا. تنتهي الآية بفاصلة لأنها تتصل نحويًا بما يليها.
