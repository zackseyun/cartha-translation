  yaml_path: translation/nt/luke/020/043.yaml
  text: until I make your enemies a footstool for your feet[a].
translation:
  language: ar
  text: حتى أجعل أعداءك موطئًا لقدميك[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكبر: «حتى أضع أعداءك موطئًا لقدميك».'
    reason: بديل معجمي يحافظ على المعنى الأساسي للفعل θῶ، أي «أضع».
lexical_decisions:
- source_word: ἕως ἂν
  choice: حتى
  rationale: تفيد العبارة بلوغ غاية مستقبلية، و«حتى» تؤدي هذا المعنى بوضوح وطبيعية في العربية.
- source_word: θῶ
  choice: أجعل
  rationale: الفعل τίθημι يعني أصلًا «أضع»، لكن «أجعل ... موطئًا» ينقل هنا معنى النتيجة المقصودة في الصورة المجازية بصياغة عربية سليمة.
- source_word: τοὺς ἐχθρούς σου
  choice: أعداءك
  rationale: نقل مباشر للمفعول به مع ضمير المخاطب، من غير تلطيف لمعنى العداوة أو توسيع له.
- source_word: ὑποπόδιον
  choice: موطئًا
  rationale: يدل اللفظ على موضع تستقر عليه القدمان. و«موطئًا» يحافظ على صورة الإخضاع الملكية ويجري طبيعيًا في هذا الاقتباس الكتابي.
- source_word: τῶν ποδῶν σου
  choice: لقدميك
  rationale: التركيب اليوناني حرفيًا «لقدميك/لقدميك من حيث الإضافة»، وصيغة «موطئًا لقدميك» عربية واضحة وتحفظ المجاز من غير تحويله صراحة إلى «تحت قدميك».
theological_decisions:
- issue: صورة إخضاع الأعداء في اقتباس المزمور 110:1
  choice: 'الإبقاء على الصورة: «أجعل أعداءك موطئًا لقدميك»'
  alternative: حتى أضع أعداءك تحت قدميك
  rationale: يحافظ الاختيار على الصورة الملكية المسيانية كما وردت، من غير تفسيرها بعبارات صريحة عن الهزيمة الكاملة أو السيطرة، ومن غير إزالة التوتر اللاهوتي في الاقتباس.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «موطئًا لقدميك» لصون المجاز الكتابي مع تجنب الصياغة الجامدة أو الشرح التفسيري الزائد.
