  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: ar
  text: 'فقال لهم يسوع: «ولا أنا أقول لكم بأيِّ سلطان أفعل هذه الأمور» (لوقا 20:8).'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐδὲ
  choice: ولا أنا
  rationale: تربط «ولا» جواب يسوع برفضهم الإجابة في الآية السابقة، وتحافظ على قوة الرد من غير إدخال زمن مستقبل غير مصرَّح به في اليونانية.
- source_word: λέγω
  choice: أقول لكم
  rationale: يناسب الفعل «أقول» مع المفعول غير المباشر «لكم»، ويفيد هنا إخبارهم بالجواب مع بقاء الصياغة قريبة من الأصل.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: بأيِّ سلطان
  rationale: الباء عربية طبيعية للدلالة على الأساس أو التفويض الذي يجري به الفعل، و«سلطان» يعبّر عن الحق والصلاحية أكثر من القوة المجردة.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: تحافظ العبارة على جمع اسم الإشارة، وتشير طبيعيًا إلى أعمال يسوع موضع السؤال.
- source_word: ποιῶ
  choice: أفعل
  rationale: المضارع العربي يلائم المضارع اليوناني ويعبّر عن الفعل الجاري أو المعتاد من غير تقييد زائد.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: فقال لهم يسوع
  rationale: الفاء تحقق ربطًا سرديًا طبيعيًا بالعربية في سياق جواب متتابع، و«قال لهم» تنقل الداتيف αὐτοῖς بوضوح.
theological_decisions:
- issue: رفض يسوع الإجابة عن سؤال القادة
  choice: صياغة رفض مباشر لإخبارهم بأساس سلطانه من غير شرح لدافعه
  alternative: إظهار الرفض بوصفه مراوغة، أو إضافة حكم صريح على عدم إيمانهم
  rationale: النص نفسه يذكر امتناع يسوع عن إخبارهم فقط؛ لذلك تُحفظ قوته البلاغية والتوتر اللاهوتي من غير تفسير مضاف.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «سلطان» للدلالة على الصلاحية والحق المخوَّل، وصيغت الجملة بإيجاز قريب من بنية الأصل.
