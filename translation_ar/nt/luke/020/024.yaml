  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: ar
  text: '«أروني دينارًا[a]. لِمَن الصورة والكتابة اللتان عليه؟» فأجابوا: «لقيصر.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الدينار قطعة نقدية رومانية كانت شائعة الاستعمال في ذلك العصر؛ وقد أُبقي اسمها حفاظًا على الإطار التاريخي.
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: أروني
  rationale: أمر مباشر بصيغة الجمع، و«أروني» تعبير عربي طبيعي يحفظ قوة الطلب ومعنى إظهار الشيء للمتكلم.
- source_word: δηνάριον
  choice: دينارًا
  rationale: نقل اسم القطعة النقدية يحفظ التحديد التاريخي بدل تعميمها إلى «عملة رومانية»؛ ويوضح الهامش المقصود بها في هذا السياق.
- source_word: τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν
  choice: صورةُ مَن وكتابةُ مَن عليه؟
  rationale: صياغة عربية واضحة تنقل السؤال عن الشخص الذي تعود إليه الصورة والكتابة على العملة، مع تجنب تركيب حرفي ثقيل.
- source_word: εἰκόνα
  choice: صورة
  rationale: «صورة» هي المقابل الواسع والطبيعي، وتناسب الرسم أو الهيئة المضروبة على العملة.
- source_word: ἐπιγραφήν
  choice: كتابة
  rationale: «كتابة» مفهومة للقارئ العام في سياق العملة، وتنقل ما هو مكتوب أو منقوش عليها دون مصطلح فني غير لازم.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: فأجابوا
  rationale: يجمع التعبير العربي الطبيعي بين اسم الفاعل والفعل اليونانيين ويحفظ الانتقال السردي.
- source_word: Καίσαρος
  choice: قيصر
  rationale: جاء الجواب اليوناني مقتضبًا في صيغة المضاف إليه. وبعد سؤال «مَن» يصح في العربية الجواب باسم الشخص وحده، فيبقى الإيجاز قائمًا.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعملت «مَن» في السؤال لسهولة الفهم، وحُفظ إيجاز الجواب اليوناني. تظهر علامة الهامش [a] في المتن عند أول ذكر للدينار.
