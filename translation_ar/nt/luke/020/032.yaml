  text: وبعد ذلك ماتت المرأة أيضًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον
  choice: وبعد ذلك
  rationale: ظرف يدل على الزمن اللاحق في تسلسل القصة؛ وهذه العبارة عربية طبيعية تحافظ على معنى التعاقب من غير مبالغة في التحديد.
- source_word: καὶ
  choice: أيضًا
  rationale: تفيد هنا أن المرأة، مثل الإخوة المذكورين قبلها، ماتت هي كذلك، لا مجرد الربط بحرف العطف.
- source_word: ἡ γυνή
  choice: المرأة
  rationale: يمكن أن تعني اللفظة «المرأة» أو «الزوجة»، لكن «المرأة» أوضح هنا لأن الحديث عن امرأة تزوجها تباعًا عدة إخوة، فلا توحي بنسبة الزواج إلى واحد منهم وحده.
- source_word: ἀπέθανεν
  choice: ماتت
  rationale: نقل مباشر للفعل اليوناني الذي يقرر وقوع الموت في الماضي، بلا تلطيف زائد.
