  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: ar
  text: فألقوه خارج الكرم وقتلوه. فماذا، إذن، سيفعل بهم صاحب الكرم[a]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سيد الكرم» أو «ربّ الكرم». الكلمة اليونانية هي «كيريوس»، وكثيرًا ما تُترجم «الرب» حين تُستعمل لقبًا، لكنها تشير هنا، في سياق المثل، إلى صاحب الكرم البشري.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: فطرحوه خارج
  rationale: اسم الفاعل الأوْرِسطي يدل على أن إخراجه سبق قتله؛ و«طرحوه خارج» يحفظ معنى الطرد القسري بعبارة عربية واضحة.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: خارج الكرم
  rationale: تفيد العبارة الانتقال إلى موضع خارج الكرم، وهذه صياغة عربية مباشرة وطبيعية.
- source_word: ἀπέκτειναν
  choice: وقتلوه
  rationale: الفعل يعني القتل مباشرة؛ أما «اغتالوه» أو «قتلوه ظلمًا» فتضيفان دلالة ليست صريحة في اللفظ اليوناني.
- source_word: τί οὖν
  choice: فماذا، إذن،
  rationale: تحفظ «إذن» القوة الاستنتاجية للأداة οὖν، وتربط الفاء السؤال بما سبقه ربطًا طبيعيًا.
- source_word: ποιήσει
  choice: سيفعل
  rationale: صيغة المستقبل محفوظة بالسين، والفعل العام «يفعل» يلائم السؤال عن الإجراء الذي سيتخذه صاحب الكرم.
- source_word: αὐτοῖς
  choice: بهم
  rationale: «ماذا سيفعل بهم» تركيب عربي مألوف يؤدي معنى ما سيتخذه ضدهم أو في شأنهم بحسب السياق.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: صاحب الكرم
  rationale: κύριος هنا هو مالك الكرم أو سيده داخل المثل، لا لقبًا إلهيًا مباشرًا؛ و«صاحب الكرم» واضح ولا يحسم ما وراء المثل بتعبير مذهبي.
theological_decisions:
- issue: ترجمة κύριος حين يشير داخل المثل إلى مالك بشري
  choice: صاحب الكرم
  alternative: سيد الكرم؛ رب الكرم
  rationale: السياق المباشر يتحدث عن صاحب الكرم في عالم المثل. تبيّن «صاحب» وظيفته من غير أن توهم أن اللفظ هنا استعمال مباشر للقب الإلهي، مع إبقاء البدائل المعجمية في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. حُفظ تتابع إخراج الابن ثم قتله، كما حُفظت دلالة الاستنتاج في οὖν وصيغة المستقبل في ποιήσει.
