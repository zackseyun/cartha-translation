  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: ar
  text: 'فقال لهم يسوع: «أبناء هذا الدهر[a] يتزوجون ويُزوَّجون،»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «أهل هذا الدهر». واليونانية حرفيًا: «أبناء هذا الدهر»، وهو تعبير مذكر تمثيلي يدل على المنتمين إلى الدهر الحاضر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: فـ
  rationale: فاء السرد تربط جواب يسوع بما سبقه ربطًا طبيعيًا، من غير إضافة دلالة زمنية صريحة.
- source_word: εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: قال لهم يسوع
  rationale: ينقل ترتيب المعنى اليوناني بعبارة عربية طبيعية، ويحافظ على الفعل العام «قال» بدل تفسيره بـ«أجاب».
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: أبناء هذا الدهر
  rationale: يحفظ صورة «الأبناء» الدالة على الانتماء، ويترجم αἰών بـ«الدهر» بوصفه الحقبة أو النظام الحاضر، لا العالم المادي.
- source_word: γαμοῦσιν
  choice: يتزوجون
  rationale: مقابل عربي طبيعي للفعل المبني للمعلوم، مع إبقاء مقابلته بالفعل التالي المبني للمجهول.
- source_word: γαμίσκονται
  choice: يُزوَّجون
  rationale: يحافظ على صيغة المبني للمجهول وعلى التمييز المقصود عن «يتزوجون»، من غير توسيع تفسيري.
theological_decisions:
- issue: التعبير المذكر ذو الدلالة التمثيلية
  choice: أبناء هذا الدهر
  alternative: أهل هذا الدهر
  rationale: النص اليوناني يقول حرفيًا «أبناء هذا الدهر»، وهو تعبير انتماء يشمل في هذا السياق أهل الدهر الحاضر عمومًا؛ أُبقيت الصورة الأصلية مع بيان شمولها في الحاشية.
- issue: دلالة αἰών الأخروية
  choice: هذا الدهر
  alternative: هذا العالم
  rationale: «الدهر» يحفظ المقابلة بين الحقبة الحاضرة والدهر الآتي في السياق، بينما قد يوحي «العالم» بالمكان أو الخليقة المادية.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُعمل «الدهر» للمحافظة على البعد الزمني والأخروي، وأُبقي التقابل الصرفي بين «يتزوجون» و«يُزوَّجون».
