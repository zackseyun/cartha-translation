base_translation:
  language: en
  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: ar
  text: وأخذها الثالث زوجةً، وكذلك فعل السبعة جميعًا؛ ولم يتركوا أولادًا، وماتوا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: الثالث
  rationale: يحافظ على الإضمار في اليونانية، إذ لا تكرر كلمة «الأخ»، والسياق يوضح المراد طبيعيًا.
- source_word: ἔλαβεν αὐτήν
  choice: أخذها زوجةً
  rationale: الفعل يعني حرفيًا «أخذها»، لكنه في سياق زواج الولي يدل على اتخاذها زوجة؛ وإضافة «زوجةً» تجعل العبارة العربية واضحة من غير تغيير معناها السياقي.
- source_word: ὡσαύτως δὲ καὶ οἱ ἑπτὰ
  choice: وكذلك فعل السبعة جميعًا
  rationale: ينقل معنى المماثلة واستمرار التسلسل، ويُظهر أن الحكم يشمل الإخوة السبعة كلهم بصياغة عربية طبيعية.
- source_word: οὐ κατέλιπον τέκνα
  choice: لم يتركوا أولادًا
  rationale: يحافظ على دلالة καταλείπω المتعلقة بعدم إبقاء ذرية بعد الموت، و«أولادًا» تعبير عربي واضح عن τέκνα هنا.
- source_word: ἀπέθανον
  choice: ماتوا
  rationale: ترجمة مباشرة وبسيطة للفعل، بلا تلطيف أو توسع.
theological_decisions: []
