source:
  edition: SBLGNT
  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: ar
  text: 'لكن زارعي الكرم[a]، لما رأوه، تشاوروا فيما بينهم وقالوا: «هذا هو الوارث. هيا نقتله لكي يصبح الميراث لنا».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «المزارعين» أو «المستأجرين». تشير الكلمة اليونانية إلى عاملين في الزراعة، وهم في هذا المثل يعملون في كرم.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: زارعي الكرم
  rationale: يدل اللفظ اليوناني على العاملين في الزراعة، وسياق المثل يحدد أن عملهم في كرم. وتعبير «زارعي الكرم» يحفظ هذا التحديد من غير أن يضيف صراحةً علاقة الاستئجار التي تُفهم من السياق الأوسع.
- source_word: διελογίζοντο πρὸς ἀλλήλους
  choice: تشاوروا فيما بينهم
  rationale: ينقل التشاور المتبادل والتدبير المحسوب الذي يفيده الفعل مع العبارة التبادلية، بصياغة عربية طبيعية، من غير أن يوحي بنزاع كما قد يفعل «تجادلوا».
- source_word: κληρονόμος
  choice: الوارث
  rationale: هو المقابل العربي المباشر والمألوف، ويحفظ الدلالة القانونية والسردية.
- source_word: ἀποκτείνωμεν
  choice: هيا نقتله
  rationale: ينقل صيغة الحث في المتكلم الجمع بعبارة عربية مباشرة، ولا يضيف إلى الفعل توصيفًا أخلاقيًا زائدًا مثل «نغتاله».
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: لكي يصبح الميراث لنا
  rationale: يحفظ غرض الفعل الذي تدل عليه ἵνα، كما يحفظ معنى الصيرورة في γένηται بدل الاكتفاء بقول «لكي يكون الميراث لنا».
- source_word: δὲ
  choice: لكن
  rationale: تنقل الانتقال السردي المصحوب بمقابلة خفيفة عند ظهور الابن.
- source_word: ἰδόντες
  choice: لما رأوه
  rationale: تؤدي اسم الفاعل الماضي بوصفه ظرفًا زمنيًا سابقًا للمداولة، في عربية واضحة وسلسة.
theological_decisions:
- issue: تسمية γεωργοὶ في مثل الكرم
  choice: زارعي الكرم
  alternative: المستأجرون أو المزارعون
  rationale: اختير المعنى الزراعي المباشر مع تخصيصه بحسب سياق الكرم. أما كونهم مستأجرين فيُفهم من سياق المثل، لكنه ليس المعنى المعجمي الصريح للاسم وحده، ولذلك لم يُجعل هو الترجمة الأساسية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وكريمة النبرة. استُخدم «هيا نقتله» لنقل الحث الجماعي بصورة طبيعية، وحُفظت عبارة الصيرورة في جملة الغرض دون حسم الكيفية التي ظنوا أن الميراث سيؤول بها إليهم.
