  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: ar
  text: وبعد أن راقبوه عن كثب، أرسلوا جواسيس يتظاهرون بأنهم أبرار، لكي يمسكوا عليه كلمةً[a]، فيسلّموه إلى حكم الوالي وسلطانه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي يتشبثوا بقولٍ له» أو «يمسكوا عليه قولًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إلى ولاية الوالي وسلطته». ويبدو أن اقتران اللفظين يشدد على اختصاص الوالي الرسمي وقدرته على التنفيذ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: بعد أن راقبوه عن كثب
  rationale: ينقل اسم الفاعل الماضي بوصفه فعلًا سابقًا للفعل الرئيس، ويحفظ دلالة المراقبة المتربصة لا مجرد الملاحظة المحايدة.
- source_word: ἐγκαθέτους
  choice: جواسيس
  rationale: لفظ واضح موجز يدل على أشخاص أُرسلوا سرًّا للإيقاع بيسوع، وهو أنسب في العربية العامة من تعبيرات اصطلاحية غامضة مثل «مندسين موضوعين».
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: يتظاهرون بأنهم أبرار
  rationale: يحفظ معنى الادعاء الخادع، كما أن «أبرار» تنقل البعد الأخلاقي والديني في δίκαιος.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: لكي يمسكوا عليه كلمةً
  rationale: تعبير عربي طبيعي قريب من الصورة اليونانية، ويدل على اقتناص قول يصلح ذريعة لاتهامه.
- source_word: ὥστε
  choice: فـ
  rationale: الفاء في «فيسلّموه» تؤدي معنى النتيجة أو الغاية المترتبة على الإيقاع به، من غير إثقال الأسلوب.
- source_word: παραδοῦναι
  choice: يسلّموه
  rationale: صياغة قضائية واضحة تنقل معنى دفعه إلى يد السلطة المعادية.
- source_word: τῇ ἀρχῇ
  choice: حكم
  rationale: تنقل معنى الحكم أو الولاية الرسمية، مع إبقائها متميزة عن «سلطان» التي تقابل ἐξουσία.
- source_word: τῇ ἐξουσίᾳ
  choice: سلطان
  rationale: تدل على الصلاحية والقدرة الرسمية في ممارسة الحكم، وتحفظ ازدواج اللفظين في الأصل.
- source_word: τοῦ ἡγεμόνος
  choice: الوالي
  rationale: مقابل عربي مألوف لمسؤول الحكم الروماني الإقليمي، وهو أدق سياقيًا من اللفظ العام «الحاكم».
theological_decisions:
- issue: دلالة δίκαιος في سياق ادعاء الصلاح
  choice: أبرار
  alternative: صالحون أو مستقيمون
  rationale: «أبرار» تحفظ الثقل الأخلاقي والديني للفظ، ولا تختزله في الاستقامة الاجتماعية أو القانونية، مع بقاء النص صريحًا في أن هذا البر كان ادعاءً متظاهرًا به.
- issue: العلاقة بين ἀρχή وἐξουσία
  choice: حكم الوالي وسلطانه
  alternative: ولاية الوالي وسلطته
  rationale: أُبقي اللفظان متميزين كما في اليونانية، من غير دمجهما في مفهوم واحد؛ فالأول يشير إلى الحكم الرسمي والثاني إلى السلطان المخوّل.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم التعبير الاصطلاحي «يمسكوا عليه كلمة» لأنه مفهوم للقارئ ويحفظ صورة اقتناص كلام المتحدث، وأُبقي ازدواج «الحكم والسلطان» لإظهار التمييز الموجود في الأصل.
