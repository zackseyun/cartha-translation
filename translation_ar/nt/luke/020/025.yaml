  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: ar
  text: 'فقال لهم: «إذًا، أدّوا[a] إلى قيصر ما لقيصر، وإلى الله ما لله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «رُدّوا». يمكن أن يعني الفعل اليوناني: أعطوا، أو أدّوا، أو ردّوا ما هو مستحق.'
    reason: بديل معجمي يحفظ مدى دلالة ἀπόδοτε.
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: فقال لهم
  rationale: تنقل الفاءُ استئنافَ الجواب في سياق الحوار بصورة عربية طبيعية، و«لهم» هي الصياغة المألوفة مع فعل القول، من غير مبالغة في جعل δέ أداة استدراك قوية.
- source_word: Τοίνυν
  choice: إذًا
  rationale: تفيد النتيجة المبنية على ما سبق، وتحافظ على القوة الاستنتاجية للكلمة اليونانية بلغة عربية واضحة ومعاصرة.
- source_word: ἀπόδοτε
  choice: أدّوا
  rationale: يفيد الفعل اليوناني إعطاء ما ينبغي أو ما هو مستحق، وقد يشمل الردّ أو السداد. و«أدّوا» تحافظ على هذا الاتساع ولا تحصر القول في دفع الضريبة وحدها.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: إلى قيصر ما لقيصر
  rationale: تحافظ الصياغة على التوازي والإيجاز في الأصل، وعلى عموم «ما لقيصر» دون تضييقه إلى المال أو الضرائب فقط.
- source_word: Καίσαρος / Καίσαρι
  choice: قيصر
  rationale: «قيصر» هو النقل العربي الراسخ للاسم واللقب الإمبراطوري، وهو أدق من استبداله بتفسير مثل «الإمبراطور».
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: إلى الله ما لله
  rationale: تعكس العبارة التوازي المقصود مع شطر قيصر، وتحافظ على اتساع ما يخص الله من غير إضافة تفسيرية.
theological_decisions:
- issue: نطاق قول يسوع سياسيًا ولاهوتيًا
  choice: الإبقاء على الالتزام المتوازي تجاه قيصر وتجاه الله من غير تحديد تفصيلي لحدود كل منهما
  alternative: حصر القول في دفع الضرائب، أو جعله فصلًا صارمًا بين الدين والدولة، أو اعتباره تفويضًا غير محدود للسلطة المدنية
  rationale: يقرر النص إعطاء كل طرف ما يخصه، لكنه لا يضع هنا نظرية سياسية كاملة ولا يحدد حدود السلطتين؛ لذلك تحافظ الترجمة على اتساع القول وتوتره اللاهوتي.
translation_notes:
  register: العربية فصحى حديثة واضحة وموجزة، مع نبرة وقورة. استُخدم التركيب المتوازي «إلى قيصر ما لقيصر، وإلى الله ما لله» للمحافظة على إيقاع الأصل وبنيته من غير استيراد تفسير مذهبي.
