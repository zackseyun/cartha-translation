lexical_decisions:
- source_word: ἑπτὰ οὖν ἀδελφοὶ ἦσαν
  choice: فكان هناك سبعة إخوة
  rationale: ينقل العدد والقرابة بوضوح، وتؤدي الفاء وظيفة οὖν في وصل هذا الافتراض بما قبله دون تحويلها إلى ظرف زمان صريح.
- source_word: ὁ πρῶτος
  choice: الأول
  rationale: يدل على الأول في التسلسل، ولا يفترض أنه الأكبر سنًّا.
- source_word: λαβὼν γυναῖκα
  choice: فتزوّج
  rationale: العبارة اليونانية حرفيًا «أخذ امرأة/زوجة»، وهي اصطلاح شائع للزواج؛ والصياغة العربية الطبيعية «تزوّج» تؤدي معناها.
- source_word: ἀπέθανεν
  choice: مات
  rationale: ترجمة مباشرة واضحة للفعل دون تلطيف.
- source_word: ἄτεκνος
  choice: بلا أولاد
  rationale: تعبير عربي طبيعي يفيد أنه مات من غير نسل، ويحفظ أهمية ذلك في سياق زواج الأخ من أرملة أخيه.
