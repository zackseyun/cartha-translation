  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: «فداود نفسه» يحفظ التوكيد في αὐτὸς مع الوظيفة التفسيرية لـγάρ، و«يقول» مناسب لمضارع الاستشهاد، و«في سفر المزامير» يقابل ἐν βίβλῳ ψαλμῶν. كما يحافظ الاقتباس على الماضي في «قال»، وعلى التوازي المقصود بين «الرَّب» و«لربّي»، وينقل الأمر والاصطلاح المكاني في «اجلس عن يميني» نقلًا سليمًا.'
