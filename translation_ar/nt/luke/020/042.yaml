  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: ar
  text: 'فَدَاوُدُ نَفْسُهُ يَقُولُ فِي سِفْرِ الْمَزَامِيرِ: «قَالَ الرَّبُّ لِرَبِّي: اجْلِسْ عَنْ يَمِينِي».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحسب النص العبري لمزمور 110:‏1: «قَالَ يَهْوَهُ لِرَبِّي»؛ فاللفظة الأولى في العبرية هي اسم الله، أمّا النص اليوناني هنا فيقول: «الرَّبُّ».'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: فَدَاوُدُ نَفْسُهُ
  rationale: تُبرز «نفسه» توكيد αὐτός، وتؤدي الفاء وظيفة γάρ في ربط القول بتعليل السياق السابق على نحو عربي طبيعي.
- source_word: Δαυὶδ
  choice: دَاوُدُ
  rationale: الصيغة العربية المعيارية للاسم الكتابي.
- source_word: λέγει
  choice: يَقُولُ
  rationale: يحافظ المضارع على صيغة الاستشهاد الأدبي في اليونانية.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: فِي سِفْرِ الْمَزَامِيرِ
  rationale: ترجمة مباشرة وطبيعية لعبارة «كتاب/سفر المزامير»، مع اعتماد الاسم العربي الراسخ للسفر.
- source_word: Εἶπεν
  choice: قَالَ
  rationale: ينقل الماضي اليوناني البسيط داخل الاقتباس.
- source_word: κύριος
  choice: الرَّبُّ
  rationale: يتبع النص اليوناني الذي يقرأ κύριος، من غير إحلال اسم العهد العبري في المتن؛ وتوضح الحاشية نص المزمور العبري.
- source_word: τῷ κυρίῳ μου
  choice: لِرَبِّي
  rationale: يحافظ على تكرار «الرب» وعلى التوتر اللاهوتي في استدلال يسوع، بدل تخفيفه إلى «لسيدي».
- source_word: Κάθου
  choice: اجْلِسْ
  rationale: أمر موجز وطبيعي يطابق الفعل اليوناني.
- source_word: ἐκ δεξιῶν μου
  choice: عَنْ يَمِينِي
  rationale: تعبير عربي كتابي واضح وطبيعي يدل على الجلوس في موضع اليمين.
theological_decisions:
- issue: هوية κύριος الأولى مع أن النص العبري في مزمور 110:1 يستعمل الاسم الإلهي יהוה
  choice: الرَّبُّ
  alternative: يَهْوَهُ
  rationale: المتن يترجم المصدر اليوناني SBLGNT حيث اللفظ κύριος؛ أما قراءة النص العبري بالاسم الإلهي فتُحفظ في الحاشية مراعاةً لأولوية الشاهد الأصلي الخاص بكل نص وللعلاقة بين الاقتباس ومصدره.
- issue: دلالة κύριος الثانية في اقتباس ذي أهمية مسيانية
  choice: رَبِّي
  alternative: سَيِّدِي
  rationale: «ربي» تحافظ على التوازي اللفظي المقصود بين κύριος وκύριος وعلى قوة سؤال يسوع اللاحق، من غير أن تحسم هوية المشار إليه بما يتجاوز النص.
