source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: ar
  text: 'فسألوه قائلين: «يا معلّم، نعلم أنك تتكلم وتعلّم بما هو صواب، ولا تحابي أحدًا[a]، بل بالحق تعلّم طريق الله[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لا تأخذ وجهًا»، وهو تعبير اصطلاحي يعني أنك لا تحابي أحدًا ولا تتأثر بمكانته أو مظهره.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بل تعلّم طريق الله بالحق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: فسألوه
  rationale: الفعل يعني السؤال أو الاستفسار. «سألوه» طبيعي ولا يحمّل اللفظ في ذاته معنى الاستجواب العدائي، مع بقاء قصدهم الامتحاني مستفادًا من السياق.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: ترجمة مباشرة لصيغة النداء، وهي واضحة ومعاصرة وتحفظ معنى وظيفة التعليم.
- source_word: οἴδαμεν
  choice: نعلم
  rationale: ينقل تصريح المتكلمين بالمعرفة واليقين، من غير أن يحسم صدق مديحهم الذي يكشف السياق أنه تملّق.
- source_word: ὀρθῶς
  choice: بالصواب
  rationale: يفيد أن كلامه وتعليمه مستقيمان وصحيحان، ويمكن طبيعيًا تعليقه بالفعلين معًا.
- source_word: λέγεις καὶ διδάσκεις
  choice: تتكلم وتعلّم
  rationale: يحفظ الفعلين المنسقين في اليونانية ولا يختزلهما في فعل واحد.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: لا تحابي أحدًا
  rationale: ينقل معنى التعبير الاصطلاحي، أي عدم تفضيل الناس بحسب المكانة أو المظهر، بعبارة عربية واضحة.
- source_word: ἐπ’ ἀληθείας
  choice: بالحق
  rationale: يحفظ معنى التعليم وفق الحقيقة أو على نحو صادق، مع إبقاء احتمال تعلق العبارة بطريقة التعليم ظاهرًا.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: طريق الله
  rationale: يحافظ على الصورة الأصلية وعلى رنين التعبير الديني الدال على نهج الله وإرادته.
- source_word: ἀλλ’
  choice: بل
  rationale: «بل» تلائم الانتقال التقابلي من نفي المحاباة إلى إثبات التعليم بالحق.
theological_decisions:
- issue: التعبير الاصطلاحي عن عدم المحاباة
  choice: لا تحابي أحدًا
  alternative: لا تأخذ بالوجوه؛ لا تتأثر بالمظاهر
  rationale: الترجمة الحرفية غامضة في العربية الحديثة، أما «لا تحابي أحدًا» فتحفظ المقصود الأخلاقي، وهو أن يسوع لا يتأثر بمقام الأشخاص أو ظاهرهم.
- issue: موضع تعلق ἐπ’ ἀληθείας
  choice: 'تعلقت العبارة بالفعل «تعلّم»: «تعلّم طريق الله بالحق»'
  alternative: «بل بالحق تعلّم طريق الله»
  rationale: كلا الترتيبين يفيد أن تعليم طريق الله يجري وفق الحق. وُضعت «بالحق» في آخر الجملة لصياغة عربية طبيعية، مع توثيق البديل الذي يبرز العبارة أكثر.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ توازي «تتكلم وتعلّم»، وتُرجم اصطلاح المحاباة بحسب معناه مع بيان صورته الحرفية في الحاشية.
