  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: ar
  text: 'فقال لهم: «كيف يقولون إن المسيح[a] ابن داود[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «الممسوح». واللفظ اليوناني لقب يُستعمل هنا عن الملك المنتظَر.'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «ابن داود». وكلمة «ابن» غير معرَّفة في اليونانية؛ ويمكن أيضًا أن تُترجم: «ابنٌ لداود».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ثم
  rationale: أداة ربط خفيفة تشير هنا إلى انتقال في مجرى الحديث؛ و«ثم» طبيعية في العربية من غير تشديد معنى الاستدراك.
- source_word: πρὸς αὐτούς
  choice: لهم
  rationale: صياغة عربية موجزة وطبيعية لفعل القول الموجَّه إلى جماعة.
- source_word: Πῶς
  choice: كيف
  rationale: تحافظ على السؤال عن وجه صحة القول أو منطقه، من غير تفسير زائد.
- source_word: λέγουσιν
  choice: يقولون
  rationale: تحافظ على المضارع وعلى الفاعل الجمع غير المعيَّن في اليونانية.
- source_word: τὸν χριστόν
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي المألوف للقب Χριστός، والسياق يتناول المنتظَر المرتبط بداود.
- source_word: εἶναι
  choice: إن
  rationale: نُقل تركيب المصدر بعد فعل القول إلى جملة عربية بـ«إن»، وهي الصياغة الطبيعية المقابلة لمعنى «أنه يكون/هو».
- source_word: Δαυὶδ υἱόν
  choice: ابن داود
  rationale: ينقل ترتيب المعنى ونسبة البنوة إلى داود بوضوح، من غير إضافة أداة تعريف أخرى أو تحويل العبارة إلى لقب مصطلحي.
theological_decisions:
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» لقب عربي راسخ ويُبقي البعد المسياني الملكي حاضرًا في سياق السؤال عن صلته بداود.
- issue: لغة البنوة الداودية
  choice: ابن داود
  alternative: أحد أبناء داود
  rationale: الصياغة المختارة تحفظ العبارة اليونانية الموجزة والتوتر الذي سيكشفه السياق اللاحق، من غير حصرها في معنى النسب العادي ولا رفعها صراحة إلى لقب ثابت.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. اختيرت جملة موجزة قريبة من بنية الأصل، مع إبقاء الفاعل في «يقولون» غير معيَّن كما في اليونانية، وعدم حسم طبيعة بنوة المسيح لداود قبل متابعة حجة يسوع.
