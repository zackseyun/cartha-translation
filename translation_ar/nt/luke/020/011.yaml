  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: ar
  text: ثم عاد فأرسل عبدًا آخر[a]، فضربوا ذاك أيضًا وأهانوه، وصرفوه فارغ اليدين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خادمًا»؛ واللفظ اليوناني يدل هنا على عبد تابع لسيده.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: عاد فـ
  rationale: الفعل مع المصدر تركيب اصطلاحي يفيد مواصلة الفعل أو تكراره؛ و«عاد فأرسل» ينقل المعنى طبيعيًا في سياق إرسال رسول آخر.
- source_word: ἕτερον
  choice: آخر
  rationale: يدل هنا على عبد إضافي متميز من الأول، و«آخر» هي المقابل العربي الواضح.
- source_word: πέμψαι
  choice: فأرسل
  rationale: ينقل المعنى المباشر للفعل ويحافظ على تسلسل الرواية.
- source_word: δοῦλον
  choice: عبدًا
  rationale: يحفظ «عبد» علاقة التبعية والملكية التي يدل عليها اللفظ اليوناني في سياق المثل، بخلاف «خادم» التي قد توحي بعامل حر.
- source_word: κἀκεῖνον
  choice: ذاك أيضًا
  rationale: يحافظ على الإشارة المؤكدة إلى العبد الثاني وعلى معنى «أيضًا» الذي يوازي ما وقع للأول.
- source_word: δείραντες
  choice: فضربوا
  rationale: ترجمة عامة ودقيقة للأذى الجسدي من غير تخصيص وسيلته بالجلد.
- source_word: ἀτιμάσαντες
  choice: وأهانوه
  rationale: ينقل معنى معاملته بما يسلبه الكرامة ويلحق به العار.
- source_word: ἐξαπέστειλαν
  choice: وصرفوه
  rationale: يعبر طبيعيًا عن إبعاده وإرساله من المكان بعد الاعتداء عليه.
- source_word: κενόν
  choice: فارغ اليدين
  rationale: اللفظ وصف حالي يفيد أنه خرج من غير أن ينال الثمر المطلوب؛ والتعبير العربي يوضح هذا المعنى الضمني.
theological_decisions:
- issue: ترجمة δοῦλος في المثل
  choice: عبد
  alternative: خادم
  rationale: «عبد» يحفظ الوضع الاجتماعي القائم على التبعية والملكية في عالم المثل من غير إضافة دلالة عقائدية، مع إثبات البديل الألين في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة سردية كريمة. استُعمل «عاد فأرسل» للتعبير الطبيعي عن الاستمرار أو التكرار، و«فارغ اليدين» لتوضيح أن العبد صُرف من غير الثمر المنتظر.
