  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: ar
  text: احذروا من الكتبة الذين يرغبون في التجول بثياب طويلة[a]، ويحبون تلقي التحيات في الأسواق، والمقاعد الأولى في المجامع، وأماكن الصدارة في الولائم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير «الثياب الطويلة» إلى ملابس ظاهرة مميزة تدل على المكانة.
    reason: cultural_note
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: احذروا
  rationale: تركيب تحذيري موجَّه إلى جماعة، وتؤدي «احذروا» معناه بوضوح وطبيعية في العربية دون الترجمة الحرفية الثقيلة.
- source_word: γραμματέων
  choice: الكتبة
  rationale: المقابل العربي المألوف للفئة الدينية المتخصصة في الشريعة والنصوص، وهو أقرب إلى اللفظ اليوناني من التفسير التوسيعي «معلمي الشريعة».
- source_word: τῶν θελόντων περιπατεῖν
  choice: الذين يرغبون في التجول
  rationale: يحفظ معنى الإرادة أو الميل في θελόντων، ويعكس التجول العلني المقصود في السياق.
- source_word: ἐν στολαῖς
  choice: بثياب فخمة
  rationale: στολή تدل على ثوب مميز أو رسمي ذي دلالة مكانية؛ «فخمة» توصل وظيفة الثياب الاجتماعية دون حصرها صراحة في طولها، وهو غير مذكور لفظًا في اليونانية.
- source_word: φιλούντων ἀσπασμοὺς
  choice: ويحبون التحيات
  rationale: صياغة مباشرة تحفظ قوة φιλούντων، والسياق العام يوحي بأنها تحيات تنطوي على التوقير.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: في الساحات العامة
  rationale: ἀγορά هي ساحة السوق ومركز الحياة العامة؛ «الساحات العامة» تنقل موضع الظهور والاعتراف الاجتماعي بوضوح.
- source_word: πρωτοκαθεδρίας
  choice: المقاعد الأولى
  rationale: يحفظ التركيب اليوناني الدال على المقاعد ذات الأولوية والمكانة في المجامع، مع بقاء دلالة الشرف مفهومة من السياق.
- source_word: πρωτοκλισίας
  choice: أماكن الصدارة
  rationale: يشير اللفظ إلى المواضع الأرفع منزلة عند الطعام؛ «أماكن الصدارة» طبيعية وتوصل المكانة الاجتماعية دون إدخال صورة «المائدة الرئيسية» غير المصرح بها.
- source_word: ἐν τοῖς δείπνοις
  choice: في الولائم
  rationale: δείπνον هنا وجبة أو مأدبة ذات طابع اجتماعي؛ «الولائم» ملائمة لسياق التنافس على أماكن الشرف.
theological_decisions:
- issue: نطاق التحذير من الكتبة
  choice: الإبقاء على «الكتبة» معرفةً، مع جعل العبارات التالية وصفًا لسلوكهم الساعي إلى الظهور والتكريم.
  alternative: تقييد التحذير صراحةً بقول «احذروا من الكتبة الذين...» على نحو قد يوحي بأنه لا يشمل إلا فئة فرعية محددة منهم.
  rationale: النص اليوناني يذكر «الكتبة» ثم يصفهم باسمَي فاعل؛ فتحافظ الصياغة على حدة النقد كما وردت، من غير إضافة حكم عقائدي على كل فرد منهم ولا حصر النقد في عادة اللباس.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت ألفاظ مألوفة كـ«الكتبة» و«المجامع»، مع تجنب التفسير الطائفي أو توسيع الإدانة إلى ما يتجاوز السلوكيات المذكورة. وُضع مؤشر الحاشية [a] مباشرة بعد العبارة التي يشرحها.
