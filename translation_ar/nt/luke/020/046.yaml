  to: احذروا من الكتبة الذين يرغبون في التجول بثياب طويلة[a]، ويحبون تلقي التحيات في الأسواق، والمقاعد الأولى في المجامع، وأماكن الصدارة في الولائم.
  rationale: تُصحَّح علاقة التحذير بالكتبة، وتُستبدل الدلالة غير المضمونة للفخامة بدلالة الثياب الطويلة التي تناسب στολαῖς، مع تقريب موضع الأسواق وتوضيح كون التحيات متلقّاة. لا يغيّر ذلك نطاق النقد أو يضيف حكمًا على الكتبة خارج الصفات المذكورة في النص.
