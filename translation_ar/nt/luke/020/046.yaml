review_pass:
  verdict: revise
  source_fidelity: تحتاج الصياغة إلى إدراج حرف الجر «من» بعد «احذروا» لتمثيل ἀπό بوضوح. كما أن «بثياب فخمة» تضيّق دلالة στολαῖς إلى الفخامة المادية، في حين تدل الكلمة على أثواب طويلة/رسمية ظاهرة؛ والترجمة الأنسب هنا «بثياب طويلة». و«الأسواق» أدق من «الساحات العامة» لـἀγοραῖς، و«تلقي التحيات» يصرّح طبيعيًا بالمعنى المقصود من حب التحيات التكريمية.
  naturalness: «احذروا من الكتبة الذين...» تركيب عربي فصيح وطبيعي. و«يتجولون بثياب طويلة» و«يحبون تلقي التحيات» أوضح من الصياغة الحالية مع المحافظة على أسلوب موجز ووقور.
  terminology: «الكتبة» و«المجامع» و«الولائم» مناسبة. تُحافَظ «المقاعد الأولى» و«أماكن الصدارة» على تمييز موضعي الشرف في المجامع والولائم دون تحميل النص تفسيرًا إضافيًا.
  issues:
  - severity: medium
    issue: حذف «من» بعد فعل التحذير
    rationale: يرد في اليونانية Προσέχετε ἀπὸ، أي التحذير من الكتبة. «احذروا الكتبة» ممكنة في العربية، لكن «احذروا من الكتبة» أدق وأقل التباسًا.
  - severity: medium
    issue: «ثياب فخمة» ليست مقابلاً آمنًا لـστολαῖς
    rationale: تدل στολαῖς على أثواب طويلة أو رسمية ظاهرة، ولا تقتضي وصفها بالفخامة. «ثياب طويلة» يحفظ الدلالة المعجمية والسياق الاستعراضي.
  - severity: low
    issue: «الساحات العامة» أوسع من ἀγοραῖς
    rationale: المقصود مواضع السوق والحياة العامة؛ «الأسواق» أقرب إلى اللفظ اليوناني مع بقاء المعنى واضحًا.
  - severity: low
    issue: «يحبون التحيات» غير محددة نسبيًا في العربية
    rationale: إضافة «تلقي» تجعل المقصود، وهو التمتع بالتحيات العلنية الموجّهة إليهم، طبيعيًا وواضحًا من غير توسع تفسيري.
