  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: ar
  text: 'فأجاب بعض الكتبة: «يا معلّم، أحسنتَ القول».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا معلّم، قلتَ صوابًا»، أو: «يا معلّم، تكلّمتَ على نحو صحيح».'
    reason: بدائل معجمية لعبارة καλῶς εἶπας، التي قد تثني على جودة القول أو صوابه.
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: فأجاب
  rationale: اسم فاعل ماضٍ يُدخل ردًّا شفهيًّا؛ وصيغة الفعل الماضي طبيعية في السرد العربي وتحفظ معنى الاستجابة.
- source_word: δέ
  choice: فـ
  rationale: تفيد انتقالًا سرديًّا خفيفًا وربطًا بما سبق، من غير إقحام مقابلة قوية.
- source_word: τινες τῶν γραμματέων
  choice: بعض الكتبة
  rationale: تنقل التركيب التبعيضي بوضوح، فتدل على أن المتكلمين فريق منهم لا جميعهم.
- source_word: γραμματέων
  choice: الكتبة
  rationale: المقابل العربي المألوف للمصطلح في سياق الأناجيل، من غير توسع تفسيري مثل «علماء الشريعة».
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: ينقل صيغة النداء والمعنى المباشر للفظ الدال على التعليم.
- source_word: καλῶς
  choice: أحسنتَ
  rationale: في تركيب «أحسنتَ القول» يؤدي معنى الثناء على صواب الكلام وجودته بلغة عربية طبيعية.
- source_word: εἶπας
  choice: القول
  rationale: أُدمج الفعل اليوناني في التعبير العربي الاصطلاحي «أحسنتَ القول»، وهو يحفظ معنى «قلتَ/تكلّمتَ» دون تكلّف.
