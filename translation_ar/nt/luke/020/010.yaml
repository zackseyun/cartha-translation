  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: ar
  text: وفي الوقت المناسب أرسل إلى زارعي الكرم عبدًا[a]، لكي يعطوه شيئًا من ثمر الكرم. لكن زارعي الكرم ضربوه وصرفوه فارغ اليدين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «خادمًا»؛ فاللفظة اليونانية قد تُستعمل للخادم أو العبد، لكن «عبدًا» تُظهر هنا بوضوح أكبر وضع التبعية.'
    reason: alternative_reading
lexical_decisions:
- source_word: καιρῷ
  choice: في الوقت المناسب
  rationale: ينقل دلالة الوقت الملائم أو المعيَّن من غير تخصيصه صراحةً بوقت الحصاد، وهو تخصيص لا يصرّح به اليوناني.
- source_word: γεωργούς
  choice: زارعي الكرم
  rationale: يبيّن نوع عمل γεωργοί في سياق الكرم، من غير افتراض وضعهم القانوني بوصفهم مستأجرين.
- source_word: δοῦλον
  choice: عبدًا
  rationale: يحافظ على دلالة التبعية المملوكة أو المقيّدة في δοῦλος، بدل تلطيفها تلقائيًا إلى «خادم».
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: لكي يعطوه
  rationale: صياغة عربية طبيعية تحفظ معنى الغرض في التركيب اليوناني.
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: شيئًا من ثمر الكرم
  rationale: ينقل المعنى التبعيضي لحرف الجر ἀπό مع المضاف إليه، من غير إضافة مقدار أو حق قانوني محدد.
- source_word: ἐξαπέστειλαν
  choice: صرفوه
  rationale: يعكس معنى إبعاده وإرساله من عندهم، لا مجرد إرساله إلى جهة ما.
- source_word: δείραντες
  choice: ضربوه
  rationale: ينقل δέρω بوضوح من غير تخصيص وسيلة الضرب أو جعله جلدًا رسميًا.
- source_word: κενόν
  choice: فارغ اليدين
  rationale: تعبير عربي طبيعي يوضح أنه انصرف بلا شيء من ثمر الكرم، مع حفظ صورة الخواء.
theological_decisions: []
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة وكريمة. استُعمل «زارعي الكرم» بدل المصطلح الأقل تداولًا «الكرّامين»، وتُركت طبيعة علاقتهم بصاحب الكرم بلا تحديد قانوني زائد.
