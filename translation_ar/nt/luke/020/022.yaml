lexical_decisions:
- source_word: ἔξεστιν
  choice: أَيَحِلُّ
  rationale: تعبّر عن الجواز أو المشروعية، مع إبقاء المرجعية القانونية أو الدينية غير مصرَّح بها كما في اليونانية.
- source_word: ἡμᾶς
  choice: لنا
  rationale: تنقل تركيب المفعول مع المصدر بعد ἔξεστιν طبيعيًّا، من غير إضافة تحديد عرقي غير موجود في النص.
- source_word: Καίσαρι
  choice: لقيصر
  rationale: تحافظ على اللقب التاريخي والسياسي للحاكم الروماني بدل تعميمه إلى «الإمبراطور».
- source_word: φόρον
  choice: الضريبة
  rationale: لفظ واضح ومعاصر يدل على المال المفروض للسلطة الحاكمة؛ وتُذكر «الجزية» بوصفها بديلًا في الحاشية للمحافظة على البعد السياسي للكلمة.
- source_word: δοῦναι
  choice: أن ندفع
  rationale: مع أن المعنى الحرفي هو «أن نعطي»، فإن العربية المألوفة تقول «ندفع الضريبة»، وهو التعبير الأدق والأطبع في هذا السياق.
- source_word: ἢ οὔ
  choice: أم لا
  rationale: الصياغة العربية الطبيعية للسؤال الانفصالي المباشر.
theological_decisions:
- issue: مرجعية الجواز في السؤال
  choice: أَيَحِلُّ
  alternative: أهو جائز بحسب الشريعة / أهو قانوني بحسب القانون الروماني
  rationale: لا يحدّد النص اليوناني هل المقصود شريعة الله أم القانون المدني الروماني؛ لذلك تُحفظ دلالة السؤال المفتوحة وتوتره الديني والسياسي.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة ورصينة. استُخدم «ندفع الضريبة» لطبيعته في العربية، مع إبقاء «الجزية» في الحاشية لبيان معنى الخضوع لسلطة حاكمة.
