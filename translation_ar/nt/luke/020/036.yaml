base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: ar
  text: فإنهم أيضًا لا يستطيعون أن يموتوا بعد الآن، لأنهم مثل الملائكة، وهم أبناء الله[a]، إذ هم أبناء القيامة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أبناء الله» و«أبناء القيامة». وصيغة المذكر في اليونانية تعبّر هنا عن المكانة والهوية، ولا تقصر الوصف على الذكور.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται
  choice: لأنهم لا يستطيعون أن يموتوا بعد الآن
  rationale: ينقل تركيب δύνανται مع المصدر معنى عدم القدرة، وتفيد ἔτι هنا انقضاء حالة الموت لا مجرد عدم تكراره. وتؤدي «بعد الآن» هذا المعنى بوضوح في العربية المعاصرة.
- source_word: ἰσάγγελοι
  choice: مثل الملائكة
  rationale: اللفظة تعني «مساوين للملائكة» أو «مثل الملائكة». والصياغة المختارة طبيعية وواضحة، وتحافظ على المقارنة من غير أن توحي بأنهم يصيرون ملائكة.
- source_word: υἱοί ... θεοῦ
  choice: أبناء الله
  rationale: يحافظ «أبناء» على صورة البنوة الصريحة في اليونانية وعلى تكرار υἱοί في نص الآية، مع بيان المقصود الشامل في الحاشية.
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: لكونهم أبناء القيامة
  rationale: تحافظ العبارة على استعارة «أبناء القيامة»، وتنقل قوة اسم الفاعل ὄντες مع إيحاء تفسيري/سببي من غير تحويل العلاقة إلى تقرير لاهوتي أكثر تحديدًا مما يقوله النص.
- source_word: γάρ ... γάρ
  choice: لأن ... إذ
  rationale: تربط «لأن» الآية بما قبلها بوصفها تعليلًا، وتعرض «إذ» التفسير التالي بسلاسة، مع تجنب تكرار ثقيل في العربية.
theological_decisions:
- issue: لغة البنوة في سياق القيامة
  choice: إبقاء «أبناء الله» و«أبناء القيامة» في المتن
  alternative: «أولاد الله» و«أولاد القيامة» أو صياغة محايدة مثل «أهل القيامة»
  rationale: يكرر الأصل اليوناني υἱοί، وتفيد صورة البنوة المكانة والهوية الناشئتين عن القيامة. إبقاء الصورة يصون الترابط البلاغي واللاهوتي، بينما توضح الحاشية أنها لا تقصر الوصف على الذكور.
- issue: طبيعة المشابهة بالملائكة
  choice: «مثل الملائكة»
  alternative: «مساوون للملائكة»
  rationale: تثبت الصياغة وجه المقارنة في عدم الموت ضمن السياق، ولا تحمل العبارة على الهوية الجوهرية بالملائكة. أما «مساوون» فهي أقرب شكليًا إلى تركيب الكلمة لكنها قد توحي بمساواة مطلقة غير منصوص عليها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت استعارة البنوة وتكرارها، واستُعملت «بعد الآن» للدلالة الطبيعية على انتهاء سلطان الموت. وُضعت علامة الحاشية بعد «أبناء الله» لتشرح العبارتين معًا.
