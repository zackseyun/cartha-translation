  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: ar
  text: وتقدَّم بعضُ الصدوقيين، وهم الذين يقولون إنه لا قيامة، وسألوه،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσελθόντες
  choice: وتقدَّم
  rationale: اسم فاعل ظرفي ماضٍ يسبق الفعل الرئيس، و«تقدَّم» تعبير عربي طبيعي يحفظ معنى الاقتراب من يسوع.
- source_word: δέ
  choice: و
  rationale: تؤدي الواو هنا وظيفة الانتقال السردي من غير إقحام معنى تعارض قوي.
- source_word: τινες τῶν Σαδδουκαίων
  choice: بعضُ الصدوقيين
  rationale: تنقل العبارةُ معنى التبعيض بوضوح وطبيعية في العربية.
- source_word: οἱ ἀντιλέγοντες
  choice: وهم الذين يقولون
  rationale: يحفظ هذا التعبير الدلالة الحرفية القريبة من القول المخالف، ويتلاءم مع جملة المحتوى التالية من غير تشديد المعنى إلى إنكار صريح على نحو يلغي اتساع اللفظ.
- source_word: ἀνάστασιν μὴ εἶναι
  choice: إنه لا قيامة
  rationale: صياغة عربية موجزة وطبيعية تنقل مضمون القول بأن القيامة غير موجودة، مع إبقاء «قيامة» بلا تعريف كما في اليونانية.
- source_word: ἐπηρώτησαν αὐτόν
  choice: وسألوه
  rationale: «سألوه» المقابل العربي الطبيعي للفعل، ولا يلزم تحميل الآية وحدها نبرة التحدي التي يوضحها السياق اللاحق.
theological_decisions:
- issue: صياغة موقف الصدوقيين من القيامة
  choice: وهم الذين يقولون إنه لا قيامة
  alternative: وهم الذين ينكرون القيامة
  rationale: الصياغة المختارة تلتزم ببنية القول ومضمونه في اليونانية، وتثبت موقفهم العقائدي من غير استيراد تفصيل لاهوتي زائد أو حسم درجة القوة المعجمية في ἀντιλέγοντες أكثر مما يقتضيه السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «الصدوقيين» بوصفه الاسم العربي الشائع تاريخيًا، وحُفظ ترتيب الاقتراب ثم السؤال.
