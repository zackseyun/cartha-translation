  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: ar
  text: 'فقال صاحب الكرم[a]: «ماذا أفعل؟ سأرسل ابني الحبيب؛ لعلهم يحترمونه[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «رب الكرم».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن يعني الفعل أيضًا: «يستحيون منه» أو «يوقّرونه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: صاحب الكرم
  rationale: يفيد التركيب في سياق المثل الشخص الذي له الكرم، و«صاحب الكرم» تعبير عربي طبيعي يحفظ معنى الملكية من غير أن يفرض لقبًا لاهوتيًا على شخصية المثل.
- source_word: Τί ποιήσω;
  choice: ماذا أفعل؟
  rationale: ينقل السؤال التداولي الذي يوجهه المتكلم إلى نفسه بصياغة عربية واضحة وطبيعية.
- source_word: πέμψω
  choice: سأرسل
  rationale: ينقل المستقبل الدال على مسار العمل الذي قرره صاحب الكرم.
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: ابني الحبيب
  rationale: يحفظ معنى البنوة ووقع وصف «الحبيب»، بما فيه من صدى محتمل للغة البنوة الإلهية في لوقا، دون إضافة تفسير.
- source_word: ἴσως
  choice: لعل
  rationale: تعبر «لعل» عن الرجاء أو التوقع غير المتيقن، وتلائم المقام والأسلوب العربي الفصيح.
- source_word: τοῦτον ἐντραπήσονται
  choice: لعلهم يهابونه
  rationale: «يهابونه» تنقل في هذا السياق معنى إظهار التوقير والمراعاة تجاه الابن، مع إبقاء مجال دلالي يتضمن الحياء أمامه؛ وتوضح الحاشية البدائل الممكنة.
theological_decisions:
- issue: ترجمة κύριος في مثل قد تمثل شخصيته الله رمزيًا
  choice: صاحب الكرم
  alternative: رب الكرم
  rationale: المعنى المباشر في سياق القصة هو صاحب الكرم. تحافظ هذه الصياغة على مستوى السرد وتترك للقارئ إدراك الدلالة الرمزية من غير فرضها بواسطة لقب ديني.
- issue: الرنين المسيحاني لعبارة «الابن الحبيب»
  choice: ابني الحبيب
  alternative: ابني، الحبيب
  rationale: الصياغة العربية الطبيعية تحفظ وصف الابن بالمحبوب، وما قد يحمله ذلك من صدى لمشاهد المعمودية والتجلي في لوقا، من غير توسيع تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «صاحب الكرم» للسلاسة والدقة السياقية، و«يهابونه» للجمع بين التوقير والحياء الذي قد يفيده الفعل اليوناني، مع توثيق البدائل في الحاشية.
