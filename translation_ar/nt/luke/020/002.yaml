source:
  edition: SBLGNT
  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: ar
  text: 'وقالوا له: «قل لنا: بأيِّ سلطان تفعل هذه الأمور؟ أو مَن هو الذي أعطاك هذا السلطان؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: أداة ربط سردية بسيطة تصل السؤال بما قبله من غير إضافة دلالة زمنية غير صريحة.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: قالوا له
  rationale: صياغة عربية طبيعية تؤدي معنى تركيب القول مع اسم الفاعل المتضمن توجيه الكلام إليه، من غير تكرار ثقيل مثل «قالوا قائلين له».
- source_word: Εἰπὸν ἡμῖν
  choice: قل لنا
  rationale: يحافظ على صيغة الأمر المباشرة وعلى الفعل الأساسي «قال»، وهو تعبير عربي واضح وطبيعي في هذا السياق.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: بأيِّ سلطان
  rationale: الباء تؤدي معنى الأساس أو الصلاحية التي يُمارَس بها الفعل، و«سلطان» يدل هنا على التفويض والحق المشروع لا على القدرة المجردة.
- source_word: ταῦτα
  choice: هذه الأمور
  rationale: يحافظ على جمع اسم الإشارة، ويشير طبيعيًا إلى أعمال يسوع الأخيرة في سياق الهيكل.
- source_word: ποιεῖς
  choice: تفعل
  rationale: المضارع العربي ينقل الفعل الجاري أو المتكرر بحسب السياق من غير حاجة إلى تركيب تقدمي أثقل.
- source_word: ἢ
  choice: أو
  rationale: تقدم السؤال الثاني بوصفه صياغة بديلة وثيقة الصلة للسؤال عن أساس السلطان أو مصدره.
- source_word: τίς ἐστιν ὁ δούς
  choice: مَن هو الذي أعطاك
  rationale: يحافظ على الصيغة التفسيرية للاسم الموصول القائم مقام الاسم في الأصل، بدل اختزالها إلى «مَن أعطاك».
- source_word: σοι
  choice: أعطاك
  rationale: أُدمج ضمير المفعول غير المباشر في الفعل وفق الأسلوب العربي الطبيعي.
- source_word: τὴν ἐξουσίαν ταύτην
  choice: هذا السلطان
  rationale: يحافظ على اسم الإشارة وعلى المصطلح نفسه في شطري السؤال، بما يبرز وحدة موضوع التحدي.
theological_decisions:
- issue: دلالة ἐξουσία في مواجهة يسوع داخل الهيكل
  choice: سلطان
  alternative: سلطة؛ صلاحية؛ قدرة
  rationale: السياق يسأل عن مشروعية أفعال يسوع ومصدر التفويض بها، لا عن مجرد استطاعته. و«سلطان» يحفظ البعد المؤسسي واللاهوتي للسؤال من غير أن يحسم مسبقًا هوية مصدره.
translation_notes:
  register: العربية فصحى حديثة واضحة ومهيبة. اختير تركيب مباشر يحفظ حدّة الاستجواب، مع تجنب التكرار الحرفي غير الطبيعي في مقدمة القول. لا توجد حواشٍ لازمة في هذه الآية.
