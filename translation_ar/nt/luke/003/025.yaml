lexical_decisions:
- source_word: τοῦ
  choice: بْنِ
  rationale: أداة التعريف المكررة في حالة المضاف إليه مختصرة في سياق سلسلة النسب، وتُفهم بحسب الصيغة التي بدأت في الآيات السابقة بمعنى «ابن». وإثبات «بْنِ» عند كل اسم يجعل العلاقة واضحة ويحافظ على إيقاع النسب.
- source_word: Ματταθίου
  choice: مَتَّاثِيَا
  rationale: نقل صوتي لاسم العلم اليوناني، بصيغة عربية واضحة تميّزه من الأسماء القريبة منه في سلسلة النسب.
- source_word: Ἀμὼς
  choice: عَامُوسَ
  rationale: استُخدمت الصيغة العربية الكتابية المألوفة للاسم، من غير افتراض أن صاحبه هنا هو النبي المعروف.
- source_word: Ναοὺμ
  choice: نَاحُومَ
  rationale: استُخدمت الصيغة العربية المألوفة المقابلة للاسم Ναούμ.
- source_word: Ἑσλὶ
  choice: حَصْلِي
  rationale: نقل صوتي للاسم مع تمثيل الروح الخشنة الابتدائية بحاء، وهو أقرب إلى صورة النص اليوناني من إسقاطها.
- source_word: Ναγγαὶ
  choice: نَجَّايَ
  rationale: نقل صوتي يحافظ على الجيم المشددة وعلى النهاية المسموعة في الاسم اليوناني.
