  footnotes:
  - marker: a
    text: 'اليونانية: «مَلِيَا، مَنَّا، مَتَّاثَا، ناثان، داود» في صيغة الإضافة؛ وفي هذا التركيب المتكرر من سلسلة النسب يُفهم معنى «ابن».'
    reason: lexical_alternative
