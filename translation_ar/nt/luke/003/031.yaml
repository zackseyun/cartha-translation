    text: ترد في بعض الترجمات الإنجليزية صيغة «مينان» بدلًا من «مَنَّا»، متأثرة بصيغة مختلفة للاسم؛ أما نص SBLGNT هنا فيقرأ «مَنَّا».
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: ابنِ
  rationale: أداة التعريف في صيغة المضاف إليه مكررة قبل كل اسم، وهي هنا جزء من تركيب نسَبي موجز يعتمد على سياق السلسلة. إظهار «ابن» يجعل العلاقة واضحة بالعربية من غير إضافة معنى جديد.
- source_word: Μελεὰ
  choice: مَلْيَا
  rationale: نقل صوتي للاسم اليوناني Μελεά بصيغة عربية واضحة.
- source_word: Μεννὰ
  choice: مَنَّا
  rationale: ينقل مباشرة قراءة SBLGNT، Μεννά، ولا يستبدل بها صيغة اسم مختلفة.
- source_word: Ματταθὰ
  choice: مَتَّاثَا
  rationale: نقل صوتي مباشر للاسم Ματταθά مع صياغة ملائمة للنطق العربي.
- source_word: Ναθὰμ
  choice: نَاثَان
  rationale: استُخدمت الصيغة العربية الكتابية المعروفة للاسم، وهي تمثل الشخص المعروف من أبناء داود وتحافظ على سهولة التعرف إليه.
- source_word: Δαυὶδ
  choice: دَاوُدَ
  rationale: الصيغة العربية الكتابية الراسخة للاسم Δαυίδ.
theological_decisions:
- issue: الحذف في سلسلة النسب
  choice: إظهار كلمة «ابن» قبل كل اسم.
  alternative: 'ترجمة السلسلة حرفيًا: «لمليا، لمنا، لمتاثا، لناثان، لداود».'
  rationale: اليونانية تستخدم سلسلة من صيغ المضاف إليه تعتمد على تركيب النسب في السياق. وإظهار «ابن» ضروري لوضوح العربية ويحفظ الدلالة السياقية من دون حسم قضية لاهوتية إضافية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. أُبقي تتابع «ابن» ليعكس إيقاع سلسلة النسب ويصرح بالعلاقة التي تتركها اليونانية مقدرة. وُضعت الحركات الضرورية في الأسماء للحد من التباس النطق.
