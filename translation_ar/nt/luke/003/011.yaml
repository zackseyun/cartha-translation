  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: ar
  text: 'فأجابهم قائلًا: «مَن له ثوبان فليُعطِ مَن ليس له ثوبًا، ومَن له طعام فليفعل كذلك».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الثوب المذكور هو الـ«خِيتون»، وهو لباس أساسي كان يُلبس مباشرة على الجسد، ويمكن ترجمته أيضًا «قميص».
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: فأجابهم قائلًا
  rationale: ينقل تركيب المشاركة مع فعل القول في صياغة عربية طبيعية، وتؤدي الفاء وظيفة الربط السردي الخفيف التي تؤديها δέ هنا.
- source_word: Ὁ ἔχων
  choice: مَن له
  rationale: صياغة عربية عامة وموجزة تحافظ على الدلالة التمثيلية دون حصرها في جنس بعينه.
- source_word: δύο χιτῶνας
  choice: ثوبان
  rationale: الـχιτών ثوب أساسي يُلبس على الجسد؛ و«ثوب» أوضح للقارئ العربي المعاصر من اللفظ التاريخي «قميص» في بعض استعمالاته، مع إيضاح النوع في الحاشية.
- source_word: μεταδότω
  choice: فليشارك
  rationale: صيغة الأمر بلام الأمر تحفظ قوة صيغة الأمر اليونانية للغائب، و«يشارك» تلائم التعدية مع المستفيد وتدل على إعطائه نصيبًا.
- source_word: τῷ μὴ ἔχοντι
  choice: مَن ليس له
  rationale: تحافظ على الإضمار الموجود في الأصل، إذ يُفهم أن المقصود مَن ليس له ثوب.
- source_word: βρώματα
  choice: طعام
  rationale: مقابل عربي واضح وطبيعي للاسم الجمع اليوناني الدال عمومًا على المأكولات.
- source_word: ὁμοίως ποιείτω
  choice: فليفعل كذلك
  rationale: يحفظ التوازي وقوة الأمر، ويُبقي كيفية المشاركة في الطعام مرتبطة بالمثال السابق.
theological_decisions:
- issue: مدى إلزام صيغة الأمر في الوصية الأخلاقية
  choice: فليشارك ... فليفعل
  alternative: ينبغي أن يشارك ... وأن يفعل
  rationale: الأصل يستعمل صيغتي أمر للغائب؛ لذلك تحافظ لام الأمر على قوة التوجيه من غير إضافة توصيف لاهوتي لطبيعة الإلزام.
- issue: العدد المفرد التمثيلي والتعبير الجنسي
  choice: مَن له ... مَن ليس له
  alternative: الذي له ... الذي ليس له
  rationale: «مَن» تنقل العموم المقصود في المشاركات المذكرة المفردة اليونانية، من غير أن توهم اقتصار القول على الذكور.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت لام الأمر لنقل قوة الأمر اليوناني، مع تركيب موجز وطبيعي يحافظ على التوازي بين الثياب والطعام.
