  to: 'فأجابهم قائلًا: «مَن له ثوبان فليُعطِ مَن ليس له ثوبًا، ومَن له طعام فليفعل كذلك».[a]'
  rationale: يُستبدل بالفعل المحتمل الالتباس «فليشارك» تركيبٌ عربي واضح يعبّر عن منح نصيب من الثياب لمن لا يملك ثوبًا، مع إبقاء قوة الأمر والتوازي في الجملة الثانية. وتُنقّح الحاشية لتصف χιτών وصفًا أدق وتزيل البديل الذي قد يدل على لباس خارجي.
