review_pass:
  verdict: revise
  source_fidelity: المعنى العام منقول بأمانة، بما في ذلك العموم في «مَن» والتوازي بين الثياب والطعام. لكن «فليشارك مَن ليس له» غير مكتمل الدلالة في العربية الفصحى المعاصرة؛ إذ لا يبيّن بوضوح أن صاحب الثوبين يعطي من ثوبيه لمن لا ثوب له. صياغة «فليُعطِ مَن ليس له ثوبًا» تنقل المقصود السياقي لفعل μεταδίδω بوضوح.
  naturalness: العبارة سلسة إجمالًا، و«فأجابهم قائلًا» مقبولة. إلا أن فعل «يشارك» في هذا التركيب قد يُفهم على أنه مشاركةٌ مع شخص أو اشتراكٌ في أمر، لا إعطاءُ نصيبٍ من الثياب؛ ولذلك تحتاج الجملة إلى تعديل يسير للوضوح الطبيعي.
  terminology: «ثوب» مقابل مناسب لـ χιτών في المتن مع حاشية ثقافية. أما الحاشية فتحتاج إلى حذف «رداء» بوصفه بديلًا مقترحًا، لأن الرداء يُفهم عادةً لباسًا خارجيًا، في حين أن χιτών لباس أساسي يُلبس مباشرة على الجسد.
  issues:
