    issue: غموض التعدية في «فليشارك مَن ليس له».
    rationale: الأصل يأمر صاحب الثوبين بأن يمنح/يقاسم شخصًا لا يملك ثوبًا. «يشارك» وحدها لا توضّح في العربية ما الذي يُشارك به ولا أن المقصود إعطاء ثوب.
  - severity: low
    issue: إدراج «رداء» بديلًا لـ χιτών في الحاشية.
    rationale: قد يوحي «رداء» بلباس خارجي، بخلاف χιτών الذي هو لباس أساسي أقرب إلى ثوب داخلي أو قميص طويل.
