lexical_decisions:
- source_word: ἐπηρώτων
  choice: كانت... تسأله
  rationale: ينقل صيغة الماضي الناقص الدالة على فعل مستمر أو متكرر، بتعبير عربي طبيعي.
- source_word: οἱ ὄχλοι
  choice: الجموع
  rationale: يحفظ صيغة الجمع ويصف جماعات الناس المحتشدة بلفظ عربي واضح وشائع.
- source_word: λέγοντες
  choice: قائلة
  rationale: يحفظ الصلة الحالية التي تمهّد لمضمون السؤال، مع مطابقة «الجموع» في الاستعمال العربي.
- source_word: Τί οὖν
  choice: فماذا
  rationale: الفاء تنقل دلالة الاستنتاج في οὖν، أي سؤالهم عن النتيجة العملية لما سبق.
- source_word: ποιήσωμεν
  choice: نفعل
  rationale: السياق الاستفهامي التداولي ينقل معنى صيغة الالتماس التشاورية دون حاجة إلى إضافة «ينبغي»؛ فالعربية الطبيعية تعبّر عنه بـ«ماذا نفعل؟».
