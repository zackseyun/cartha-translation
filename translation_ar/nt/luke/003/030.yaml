lexical_decisions:
- source_word: τοῦ
  choice: بْنِ
  rationale: أداة التعريف المضافة المتكررة مع الأعلام تحذف متعلقها اعتمادًا على صيغة النسب في السياق؛ والتعبير العربي الطبيعي الموجز هو «بن».
- source_word: Συμεὼν
  choice: سِمْعَانَ
  rationale: الصيغة العربية الكتابية المألوفة للاسم السامي، وهي أوضح للقارئ من النقل الحرفي للحروف اليونانية.
- source_word: Ἰούδα
  choice: يَهُوذَا
  rationale: يعكس الاسم السامي الذي تمثله الصيغة اليونانية، ويلائم سياق سلسلة النسب، مع بقاء إمكان نقله «يهوذا الإسخريوطي/يوداس» بحسب السياق في مواضع أخرى.
- source_word: Ἰωσὴφ
  choice: يُوسُفَ
  rationale: الصيغة العربية الراسخة والمفهومة للاسم.
- source_word: Ἰωνὰμ
  choice: يُونَامَ
  rationale: نقل مباشر لصيغة SBLGNT «Ἰωνάμ»، من غير استبدال الميم النهائية بنون.
- source_word: Ἐλιακὶμ
  choice: أَلِيَاقِيمَ
  rationale: الصيغة العربية الكتابية المألوفة للاسم السامي، وتحافظ على عناصر الاسم بوضوح.
