  footnotes:
  - marker: a
    text: تتكرر في اليونانية أداة التعريف في صيغة الجر مع كل اسم، من غير ذكر كلمة «ابن»؛ وقد أُظهرت «ابنِ» وفق النمط الواضح لسلسلة النسب.
    reason: lexical_alternative
  - marker: b
    text: اللفظ اليوناني للاسم هو «سالاتيئيل»، ويُعرَف عادةً بالاسم الوارد في العهد القديم «شَأَلْتِيئِيل».
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: بْنِ
  rationale: أداة التعريف المكررة في صيغة المضاف إليه تقوم هنا مقام عبارة نسب محذوفة يفهمها السياق؛ وإظهار «بْنِ» ينقل العلاقة المقصودة بوضوح وطبيعية في العربية.
- source_word: Ἰωανὰν
  choice: يُوَانَانَ
  rationale: نقل صوتي للاسم اليوناني، مع صيغة عربية واضحة تميّزه من «يوحنا».
- source_word: Ῥησὰ
  choice: رِيسَا
  rationale: نقل صوتي مباشر للاسم اليوناني، بصياغة يسهل نطقها بالعربية.
- source_word: Ζοροβαβὲλ
  choice: زَرُبَّابِلَ
  rationale: استُخدمت الصيغة العربية الكتابية المعروفة للاسم، حفاظًا على إمكان التعرف إلى الشخصية المذكورة في أسفار العهد القديم.
- source_word: Σαλαθιὴλ
  choice: شَأَلْتِيئِيلَ
  rationale: استُخدمت الصيغة المقابلة للاسم العبري المعروف كتابيًا، بدل النقل الحرفي للصيغة اليونانية «سالاتيئيل».
- source_word: Νηρὶ
  choice: نِيرِي
  rationale: نقل صوتي مباشر للاسم اليوناني إلى العربية.
theological_decisions:
- issue: الحذف في صيغة سلسلة النسب
  choice: إظهار كلمة «بْنِ» قبل كل اسم.
  alternative: ترجمة حرف الجر الإضافي وحده بسلسلة من «لـ» أو «مِن».
  rationale: اليونانية تعتمد على علاقة بنوّة مفهومة من سياق سلسلة النسب. وإظهارها في العربية يترجم المعنى النحوي الضمني من غير إضافة تفسير لاهوتي.
- issue: هوية Σαλαθιὴλ
  choice: شَأَلْتِيئِيلَ
  alternative: سالاتيئيل
  rationale: الصيغة المختارة تربط الاسم بصورته المعروفة في التقليد العبري، مع التنبيه إلى أن اللفظ اليوناني هو «سالاتيئيل»، من غير الجزم بأكثر مما يتيحه النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. ضُبطت كلمة «بْنِ» والأسماء بالشكل لتوضيح القراءة والإعراب في سلسلة الأعلام، واستُخدمت الأسماء الكتابية العربية المألوفة حين أمكن.
