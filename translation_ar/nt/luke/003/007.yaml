base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: ar
  text: 'فكان يقول للجموع الخارجة لتنَال المعمودية على يده: «يا نسل الأفاعي[a]، من حذّركم أن تهربوا من الغضب الآتي[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا أولاد الأفاعي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من الغضب المزمع أن يأتي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: فكان يقول
  rationale: صيغة الماضي الناقص اليونانية توحي بفعل مستمر أو متكرر؛ وتحافظ «فكان يقول» على هذا الجانب من غير الجزم بمقدار التكرار.
- source_word: οὖν
  choice: فـ
  rationale: تربط الفاء الكلام بما سبقه ربطًا سرديًا ونتائجيًا طبيعيًا في العربية.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: للجموع الخارجة
  rationale: ينعت اسم الفاعل الجموع ويصوّر خروجها متجهة إلى يوحنا، فجاء التعبير موجزًا وطبيعيًا.
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: لتتعمد على يده
  rationale: ينقل التعبير غرض خروج الجموع ويحافظ على كونها متلقية للمعمودية، و«على يده» تعبير عربي طبيعي يدل على أن يوحنا هو الذي يعمدها من غير إضافة اسمه إلى النص.
- source_word: Γεννήματα ἐχιδνῶν
  choice: يا ذرية الأفاعي
  rationale: تفيد γέννημα ما وُلد أو نتج؛ و«ذرية» تنقل الصورة بوضوح وقوة، مع إثبات البديل الأكثر مباشرة في الحاشية.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: من حذّركم
  rationale: يحمل الفعل في سياق الدينونة معنى التنبيه والتحذير، وهو أنسب من مجرد «أراكم».
- source_word: φυγεῖν
  choice: أن تهربوا
  rationale: يحافظ على صورة الفرار من خطر مقبل، بدل تحويلها إلى مجرد تحقق النجاة.
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: من الغضب الآتي
  rationale: تنقل «الآتي» معنى ما هو مقبل، ويحافظ «الغضب» على لفظ الدينونة العام من غير تقييده بتفسير زمني أو عقائدي أضيق.
theological_decisions:
- issue: طبيعة ὀργή في تحذير يوحنا
  choice: الغضب الآتي، بوصفه دينونة إلهية مقبلة من غير تحديد مخطط عقائدي أضيق
  alternative: الدينونة الأخروية حصرًا، أو عقاب تاريخي زمني حصرًا
  rationale: السياق يدعو إلى التوبة في ضوء دينونة الله، لكن العبارة نفسها لا تحصر الغضب في تصور تفصيلي بعينه؛ لذلك أُبقي التوتر الدلالي كما هو.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت «تتعمد على يده» بوصفها صياغة طبيعية للمبني للمجهول اليوناني، وحوفظ على حدة خطاب يوحنا وعلى عمومية «الغضب» اللاهوتية.
