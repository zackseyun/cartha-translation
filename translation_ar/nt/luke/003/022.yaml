source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: ar
  text: 'ونزل عليه الروح القدس في هيئة جسدية، مثل حمامة، وجاء صوت من السماء: «أنت ابني الحبيب، بك سُررتُ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فيك رضيتُ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβῆναι
  choice: نزل
  rationale: يحفظ معنى الحركة إلى أسفل، ويناسب تسلسل أحداث الرواية بصياغة عربية طبيعية.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: الروح القدس
  rationale: المقابل العربي المعياري الواضح للعبارة اليونانية المعرفة.
- source_word: σωματικῷ εἴδει
  choice: في هيئة جسدية
  rationale: ينقل دلالة الظهور المحسوس المرئي من غير أن يزيد على النص ادعاء التجسد.
- source_word: ὡς περιστερὰν
  choice: مثل حمامة
  rationale: يحفظ أداة التشبيه، فلا يوحي بأن الروح القدس صار حمامة حرفيًا.
- source_word: ἐπ’ αὐτόν
  choice: عليه
  rationale: تعبير عربي موجز وطبيعي يدل على اتجاه النزول إلى يسوع.
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: جاء صوت من السماء
  rationale: ينقل التعبير الحدثي اليوناني إلى عبارة عربية مألوفة من دون التزام بحرفية «صار صوت» غير الطبيعية.
- source_word: Σὺ εἶ
  choice: أنت
  rationale: الضمير المنفصل يحفظ توكيد الضمير الصريح في اليونانية، وخبره يأتي في «ابني» على نحو عربي سليم.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: ابني الحبيب
  rationale: صياغة عربية طبيعية تحفظ البنوة ووصف المحبة من غير توسع تفسيري.
- source_word: ἐν σοὶ εὐδόκησα
  choice: بك سُررتُ
  rationale: يحفظ صيغة الماضي في الفعل اليوناني، ويؤدي العبارة في العربية الفصيحة بوضوح وإيجاز.
theological_decisions:
- issue: طبيعة ظهور الروح القدس
  choice: في هيئة جسدية مثل حمامة
  alternative: في هيئة حمامة فعلية
  rationale: يجمع النص بين ظهور محسوس وبين التشبيه بأداة ὡς؛ لذلك تحفظ الترجمة المقارنة ولا تقرر أن الروح صار حمامة حرفيًا.
- issue: القوة الزمنية للفعل εὐδόκησα
  choice: بك سُررتُ
  alternative: بك أُسَرّ / عنك رضيت
  rationale: الفعل اليوناني ماضٍ بسيط، فحُفظت دلالته الماضية في المتن بدل تحويلها إلى حاضر. وتوضح الحاشية إمكان فهم العبارة بوصفها تعبيرًا عن الرضا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. وُضع مؤشر الحاشية بعد الاقتباس لأنه يشرح عبارته الأخيرة، مع تجنب الألفاظ المذهبية أو التفسير الزائد.
