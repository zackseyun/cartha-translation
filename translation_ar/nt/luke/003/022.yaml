  to: 'ونزل عليه الروح القدس في هيئة جسدية، مثل حمامة، وجاء صوت من السماء: «أنت ابني الحبيب، بك سُررتُ».[a]'
  rationale: أُبقي المتن كما هو في جوهره لأنه أمين وطبيعي، مع ضبط ترقيم التشبيه. واستُبدلت الحاشية ببديل يحافظ على دلالة ἐν σοὶ وعلى معنى الرضا في εὐδόκησα، من غير تغيير المعنى أو فرض تفسير زمني أو مذهبي إضافي.
