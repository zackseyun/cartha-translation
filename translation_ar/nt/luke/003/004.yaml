source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: ar
  text: 'كما كُتب في سفر أقوال إشعياء النبي: «صوت من يصرخ في البرية[b]: أَعِدّوا طريق الرب[a]، واجعلوا سبله مستقيمة».


    [a] يقتبس النص إشعياء 40:3، حيث يَرِد في النص العبري الاسم الإلهي «يهوه»، الذي يُترجم عادةً «الرب».


    [b] يمكن ربط عبارة «في البرية» بالفعل «يصرخ»، كما في المتن، أو بالأمر الذي يليها: «صوت من يصرخ: أَعِدّوا في البرية طريق الرب».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يقتبس النص إشعياء 40:3، حيث يَرِد في النص العبري الاسم الإلهي «يهوه»، الذي يُترجم عادةً «الرب».
    reason: alternative_reading
  - marker: b
    text: 'يمكن ربط عبارة «في البرية» بالفعل «يصرخ»، كما في المتن، أو بالأمر الذي يليها: «صوت من يصرخ: أَعِدّوا في البرية طريق الرب».'
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: هو مكتوب
  rationale: صيغة عربية مألوفة لافتتاح الاقتباس الكتابي، وتحافظ على دلالة الفعل التام المبني للمجهول وعلى استمرار أثر المكتوب.
- source_word: βίβλῳ λόγων
  choice: في سفر أقوال
  rationale: يحافظ «سفر» على الإطار الكتابي القديم، وتُبقي «أقوال» كلا الاسمين في العبارة اليونانية من غير تثقيل.
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: إشعياء النبي
  rationale: تركيب عربي طبيعي يحفظ وصف إشعياء بالنبي.
- source_word: Φωνὴ βοῶντος
  choice: صوت صارخ
  rationale: صياغة موجزة وطبيعية تمثل «صوت واحد يصرخ» وتحافظ على نبرة الاقتباس النبوية.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: «البرية» أنسب للسياق النبوي ولموضع خدمة يوحنا، مع بيان احتمال التعلّق النحوي الآخر في الحاشية.
- source_word: Ἑτοιμάσατε
  choice: أعدّوا
  rationale: أمر مباشر فصيح ومعاصر ينقل معنى التهيئة.
- source_word: τὴν ὁδὸν κυρίου
  choice: طريق الرب
  rationale: يحفظ صورة الطريق والتعبير الكتابي، وينقل κύριος إلى «الرب» وفق النص اليوناني.
- source_word: εὐθείας ποιεῖτε
  choice: اجعلوا ... مستقيمة
  rationale: ينقل بوضوح تركيب الصفة الخبرية مع فعل الجعل ويحافظ على قوة الأمر.
- source_word: τὰς τρίβους αὐτοῦ
  choice: سبله
  rationale: «السبل» طبيعية في العربية الكتابية، وتلائم التوازي مع «الطريق» وصورة إعداد المسار.
theological_decisions:
- issue: ترجمة κύριος في اقتباس من إشعياء يشير أصله العبري إلى YHWH
  choice: الرب
  alternative: يهوه
  rationale: يتبع المتن لفظ κύριος في النص اليوناني، بينما تبيّن الحاشية أن إشعياء 40:3 يورد الاسم الإلهي YHWH؛ وبذلك لا يُطمس الأصل العهدي ولا يُفرض تفسير كرستولوجي زائد في الترجمة.
- issue: تعلّق عبارة «في البرية»
  choice: ربطها بـ«صارخ»
  alternative: ربطها بالأمر «أعدّوا»
  rationale: ترتيب النص اليوناني في لوقا يلائم ربطها بالصراخ، لكن البنية تسمح بالقراءة الأخرى المتوافقة مع تقسيم النص العبري؛ لذلك حُفظ الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «سفر» و«البرية» و«السبل» لما تحمله من دقة سياقية وألفة كتابية، مع تجنب التراكيب القديمة الثقيلة. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرهما كل حاشية.
