  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: ar
  text: 'وجاء أيضًا جباةُ الضرائب ليعتمدوا، فقالوا له: «يا معلّم، ماذا ينبغي لنا أن نفعل؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον
  choice: جاء
  rationale: الفعل في صيغة الماضي اليوناني يدل هنا بصورة طبيعية على حدث ماضٍ بسيط.
- source_word: δὲ καὶ τελῶναι
  choice: وجاء أيضًا جباةُ الضرائب
  rationale: تحفظ «أيضًا» القوة الإضافية في δὲ καὶ من غير أن تفرض معنى الاستغراب الذي قد توحي به «حتى»، و«جباة الضرائب» تعبير عربي واضح عن τελῶναι.
- source_word: βαπτισθῆναι
  choice: ليعتمدوا
  rationale: 'المصدر المبني للمجهول بعد فعل المجيء يفيد الغرض: جاءوا لكي ينالوا المعمودية.'
- source_word: εἶπαν πρὸς αὐτόν
  choice: فقالوا له
  rationale: ينقل حرفيًا وطبيعيًا فعل القول مع πρὸς، مع أن مضمون القول سؤال.
- source_word: Διδάσκαλε
  choice: يا معلّم
  rationale: ترجمة مباشرة للنداء، تبرز وظيفة التعليم دون إضافة دلالة «السيد» أو استعمال لقب منقول صوتيًا.
- source_word: τί ποιήσωμεν
  choice: ماذا ينبغي لنا أن نفعل؟
  rationale: تنقل صيغة الاحتمال التداولية الدالة على طلب معرفة التصرف الواجب بصورة عربية معاصرة وواضحة.
theological_decisions:
- issue: اشتمال جباة الضرائب في استجابة الناس لدعوة يوحنا
  choice: الحفاظ على معنى الإضافة باستعمال «أيضًا»
  alternative: «حتى جباة الضرائب جاءوا»
  rationale: النص اليوناني يبرز انضمام جباة الضرائب إلى القادمين، لكن «أيضًا» تصون ذلك من غير أن تجعل الاستغراب تفسيرًا لازمًا أو تضيف حكمًا أخلاقيًا غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «جباة الضرائب» بدل تعبيرات إدارية أقل شيوعًا، وحوفظ على ترتيب طبيعي في العربية وعلى صيغة السؤال التداولية.
