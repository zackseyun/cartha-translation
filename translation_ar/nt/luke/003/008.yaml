id: LUK.3.8
reference: Luke 3:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: ar
  text: 'فأتوا إذًا بثمارٍ تليق بالتوبة[a]، ولا تبدأوا تقولون في أنفسكم[b]: «لنا إبراهيم أبًا»، لأني أقول لكم إن الله قادر أن يقيم لإبراهيم أولادًا من هذه الحجارة.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ثمرًا يوافق التوبة» أو «ثمارًا تتفق مع التوبة». جاءت كلمة «ثمار» في اليونانية بصيغة الجمع، والمقصود سلوك ينسجم مع التوبة الحقيقية ويُظهرها.
    reason: lexical_alternative
  - marker: b
    text: أو «بينكم» أو «بعضكم لبعض». قد تشير العبارة إلى حديث النفس، أو إلى ما يقولونه داخل جماعتهم.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: أثمروا
  rationale: الأمر اليوناني يدعو إلى فعل حاسم. و«أثمروا» تعبير عربي طبيعي مع «ثمارًا»، وينقل معنى إظهار نتائج عملية.
- source_word: οὖν
  choice: إذًا
  rationale: تبيّن النتيجة المترتبة على التحذير السابق، وتحافظ على الصلة المنطقية.
- source_word: καρποὺς ἀξίους τῆς μετανοίας
  choice: ثمارًا تليق بالتوبة
  rationale: حُفظ جمع «ثمار» كما في اليونانية، و«تليق بالتوبة» تفيد التوافق والمناسبة من غير إيحاء بأن الأعمال تستحق الغفران.
- source_word: μὴ ἄρξησθε λέγειν
  choice: لا تبدأوا تقولون
  rationale: يحفظ معنى النهي عن الشروع في هذا القول، بصياغة عربية واضحة وطبيعية.
- source_word: ἐν ἑαυτοῖς
  choice: في أنفسكم
  rationale: يحفظ احتمال الحديث الباطني، مع إمكان فهم العبارة أيضًا على أنها قول متداول داخل جماعتهم؛ وقد بُيّن الاحتمال الآخر في الحاشية.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: لنا إبراهيم أبًا
  rationale: صياغة عربية موجزة تحفظ دعوى الانتساب الأبوي ونبرة الاتكال على النسب.
- source_word: δύναται ὁ θεὸς
  choice: الله قادر
  rationale: تنقل بوضوح معنى القدرة الإلهية وتحافظ على قوة التصريح.
- source_word: ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: أن يقيم لإبراهيم أولادًا
  rationale: «يقيم» يقابل اتساع معنى الفعل الذي قد يدل على الإنهاض أو الإيجاد، من غير حصره في الخلق المباشر، و«أولادًا» طبيعي في سياق النسب.
- source_word: ἐκ τῶν λίθων τούτων
  choice: من هذه الحجارة
  rationale: ترجمة مباشرة وطبيعية تحافظ على صورة المصدر أو المنشأ المستحيل في الظاهر.
theological_decisions:
- issue: معنى «ثمارًا تليق بالتوبة»
  choice: أفعال ونتائج ظاهرة تتوافق مع التوبة الحقيقية وتدل عليها، من غير القول إنها تكسب الغفران.
  alternative: «ثمرًا يوافق التوبة» أو «ثمارًا جديرة بالتوبة».
  rationale: يدل التركيب اليوناني على المناسبة والتطابق بين السلوك والتوبة. وتحافظ الصياغة على التوتر الأخلاقي واللاهوتي من غير إدخال تصور عن استحقاق الأعمال.
- issue: مكانة الانتساب إلى إبراهيم
  choice: يرفض يوحنا الاتكال على النسب الجسدي إلى إبراهيم بوصفه ضمانًا كافيًا أمام الله.
  alternative: قد تُفهم العبارة على أنها إنكار لقيمة كل صلة بإبراهيم، لكن النص نفسه يهاجم الاتكال على النسب لا مجرد وجود الصلة.
  rationale: يتحدى النص الثقة بالأنساب ويؤكد حرية الله وقدرته على إقامة أولاد لإبراهيم من حيث لا يتوقع البشر، من غير إضافة صيغ لاهوتية لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «التوبة» بوصفها المقابل الطبيعي والدقيق لـ μετάνοια في هذا السياق، مع الحفاظ على جمع «ثمار» وعلى غموض ἐν ἑαυτοῖς في الحاشية.
