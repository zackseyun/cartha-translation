    rationale: افتتاح السلسلة بـ«ابنِ» يوحي بتبعية نحوية ظاهرة لما قبلها، في حين أن الترجمة المقدمة للآية ينبغي أن تُقرأ بوضوح مستقلة. كما أن ضبط أواخر الأسماء الأعجمية في هذه السلسلة ليس لازمًا وقد يثير إشكالات إعرابية.
