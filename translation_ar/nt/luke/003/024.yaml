  text: ابن متات[a]، ابن لاوي، ابن ملكي، ابن يناي، ابن يوسف،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أكثر حرفية: «لمتات، للاوي، لملكي، ليناي، ليوسف». تواصل اليونانية سلسلة النسب بتكرار صيغة الإضافة، وتُفهم منها كلمة «ابن» من السياق المحيط.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: ابْنِ
  rationale: أداة التعريف المكررة في صيغة المضاف إليه تواصل سلسلة النسب، وفيها تقدير «ابن». إظهاره بالعربية يوضح العلاقة التي يدل عليها السياق.
- source_word: Μαθθὰτ
  choice: مَتَّاتَ
  rationale: نقل صوتي للاسم اليوناني، مع ضبطه بما يميزه في سلسلة الأسماء.
- source_word: Λευὶ
  choice: لَاوِي
  rationale: الصيغة العربية المألوفة للاسم الكتابي، وهي تقابل الاسم اليوناني Λευί.
- source_word: Μελχὶ
  choice: مَلْكِي
  rationale: نقل صوتي واضح للاسم Μελχί، من غير افتراض مطابقته لشخص آخر يحمل اسمًا قريبًا.
- source_word: Ἰανναὶ
  choice: يَنَّايَ
  rationale: نقل قريب من الصيغة اليونانية Ἰανναί، يحافظ على المقطع الأخير بدل اختزاله.
- source_word: Ἰωσὴφ
  choice: يُوسُفَ
  rationale: الصيغة العربية الراسخة للاسم Ἰωσήφ.
theological_decisions:
- issue: الحذف في صيغة النسب
  choice: إظهار كلمة «ابن» قبل كل اسم
  alternative: 'الإبقاء على سلسلة إضافية حرفية: «لمتات، للاوي، لملكي، ليناي، ليوسف»'
  rationale: النص اليوناني يكرر المضاف إليه ويعتمد على صيغة النسب في السياق السابق. إظهار «ابن» يجعل المعنى طبيعيًا وواضحًا بالعربية من غير إضافة علاقة جديدة إلى النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. أُظهرت العلاقة المحذوفة «ابن» لتيسير قراءة سلسلة النسب، واستُخدمت صيغ عربية مألوفة أو منقولة صوتيًا للأسماء، مع ضبطها بالشكل لتقليل الالتباس.
