  text: وجاء إلى جميع أنحاء المنطقة المحيطة بنهر الأردن، مناديًا بمعمودية التوبة لمغفرة الخطايا،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: جاء
  rationale: ينقل فعل ἔρχομαι في السرد بصياغة عربية مباشرة وطبيعية، من غير إضافة تحديد لاتجاه الحركة لا يصرّح به السياق.
- source_word: εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: إلى كل المنطقة المحيطة بالأردن
  rationale: تحافظ «إلى» على دلالة εἰς، وتنقل «كل» لفظ πᾶσαν، بينما تعبّر «المنطقة المحيطة بالأردن» بوضوح عن περίχωρον τοῦ Ἰορδάνου.
- source_word: κηρύσσων
  choice: مناديًا
  rationale: تعكس اللفظة فعل الإعلان العلني الذي يؤديه المنادي، وهي طبيعية وفصيحة في العربية وأقل اقترانًا بالاستعمال الكنسي الاصطلاحي من «واعظًا».
- source_word: βάπτισμα
  choice: معمودية
  rationale: هو المقابل العربي الكتابي المستقر والواضح للاسم الدال على المعمودية أو الاغتسال الطقسي.
- source_word: μετανοίας
  choice: التوبة
  rationale: تأتي في تركيب «معمودية التوبة» للمحافظة على علاقة الإضافة في اليونانية من غير تفسير زائد لطبيعة العلاقة بين المعمودية والتوبة.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: لمغفرة الخطايا
  rationale: تنقل «مغفرة» المعنى السياقي المألوف لـἄφεσις، وتبقي اللام دلالة εἰς مفتوحة من غير حسم ما إذا كانت العلاقة غائية أو سببية أو إعلانية.
theological_decisions:
- issue: العلاقة بين المعمودية والتوبة ومغفرة الخطايا
  choice: معمودية التوبة لمغفرة الخطايا
  alternative: معمودية تدل على التوبة المؤدية إلى المغفرة؛ أو معمودية يُعبَّر بها عن التوبة لنوال المغفرة
  rationale: يحافظ التركيب على توتر النص اليوناني وغموض العلاقة المقصودة، ولا يحسم جدلًا لاهوتيًا لاحقًا بشأن كون المعمودية وسيلة للمغفرة أو علامة عليها أو إعلانًا لها.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختيرت صياغة قريبة من بنية الأصل مع الحفاظ على سلاسة العبارة. لا توجد حاشية لازمة؛ فالبدائل الإنجليزية المذكورة لا تكشف غموضًا جوهريًا يحتاج إليه القارئ العربي.
