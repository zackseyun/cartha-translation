source:
  edition: SBLGNT
  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: ar
  text: 'وكان جنود أيضًا يسألونه قائلين: «وماذا نفعل نحن أيضًا؟» فقال لهم: «لا تبتزّوا أحدًا[a]، ولا تتّهموا أحدًا زورًا، واكتفوا برواتبكم[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يحمل الفعل معنى إخافة شخص أو الضغط عليه بالقوة لانتزاع مال أو منفعة منه.
    reason: lexical_alternative
  - marker: b
    text: يمكن ترجمة الكلمة أيضًا «أجوركم» أو «مخصّصاتكم»؛ وكانت تُستعمل كثيرًا لأجرة الجنود ومؤونتهم.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: جنود
  rationale: اسم الفاعل اليوناني يدل على أناس يؤدون الخدمة العسكرية، و«جنود» أوضح تعبير عربي طبيعي في السياق.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: وماذا نفعل نحن أيضًا؟
  rationale: يحافظ الاستفهام على معنى صيغة التشاور، ويُظهر «نحن أيضًا» التوكيد الصريح في καὶ ἡμεῖς مع صياغة عربية طبيعية.
- source_word: διασείσητε
  choice: لا تبتزّوا أحدًا
  rationale: يدل الفعل في هذا السياق على انتزاع المال أو المنفعة بالإكراه واستغلال السلطة؛ و«تبتزّوا» موجزة وواضحة، مع بيان ظلال المعنى في الحاشية.
- source_word: συκοφαντήσητε
  choice: لا تتّهموا أحدًا زورًا
  rationale: ينقل التعبير معنى توجيه اتهام باطل، من غير تضييقه على الابتزاز أو الوشاية وحدهما.
- source_word: ἀρκεῖσθε
  choice: اكتفوا
  rationale: ينقل فعل الأمر معنى القناعة والاستمرار في اعتبار ما يُعطى كافيًا.
- source_word: ὀψωνίοις
  choice: رواتبكم
  rationale: كان اللفظ يُستعمل خصوصًا لأجرة الجندي أو مخصصاته؛ و«رواتبكم» هو المقابل العربي المعاصر الأنسب هنا.
theological_decisions:
- issue: التوجيه الأخلاقي للجنود
  choice: إبقاء الخطاب موجّهًا إلى الجنود في شأن الامتناع عن استغلال السلطة والطمع
  alternative: صياغة الآية بما يوحي بأنها تأمرهم بترك الخدمة العسكرية أو تدينها في ذاتها
  rationale: النص لا يصرّح بحكم عام على الخدمة العسكرية، بل ينهى المخاطَبين عن الابتزاز والاتهام الباطل ويأمرهم بالقناعة؛ لذلك لا تُضاف إليه نتيجة عقائدية غير منطوقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ توكيد «نحن أيضًا»، واستُخدمت ألفاظ معاصرة مفهومة من غير إدخال تفسير طائفي أو توسيع دلالي غير لازم.
