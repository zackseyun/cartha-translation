lexical_decisions:
- source_word: Ἰησοῦ
  choice: يَشُوعَ
  rationale: نقل الاسم اليوناني بصيغته العربية الكتابية الشائعة «يشوع»، مع تمييزه في السياق عن «يسوع».
- source_word: Ἐλιέζερ
  choice: أَلِيعَازَرَ
  rationale: استخدام الصيغة العربية الكتابية المستقرة للاسم السامي الذي يمثله اليوناني.
- source_word: Ἰωρὶμ
  choice: يُورِيمَ
  rationale: نقل صوتي قريب من صورة الاسم في النص اليوناني.
- source_word: Μαθθὰτ
  choice: مَتَّاتَ
  rationale: نقل صوتي يحافظ على التشديد الصامت في الصورة اليونانية ويميّزه عن أسماء قريبة.
- source_word: Λευὶ
  choice: لَاوِي
  rationale: اعتماد الصيغة العربية الكتابية المعروفة للاسم.
- source_word: τοῦ
  choice: بْنِ
  rationale: المضاف إليه اليوناني المتكرر يدل ضمن سلسلة النسب على علاقة البنوة؛ والتصريح بـ«بن» هو التعبير العربي الطبيعي الواضح.
