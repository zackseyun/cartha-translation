lexical_decisions:
- source_word: τοῦ
  choice: ابنِ
  rationale: أداة التعريف اليونانية في صيغة المضاف تتكرر هنا استعمالًا حذفيًّا ضمن سلسلة النسب؛ لذلك أُثبتت كلمة «ابن» التي يفهمها السياق، بدل ترجمة «لـ» المبهمة وغير الطبيعية بالعربية.
- source_word: Μελχὶ
  choice: مَلْكِي
  rationale: نقل صوتي للاسم اليوناني بصيغة عربية واضحة، مع ضبطه للتمييز عن الكلمة العربية «ملكي».
- source_word: Ἀδδὶ
  choice: أَدِّي
  rationale: نقل صوتي يحافظ على تشديد الدال في الاسم اليوناني.
- source_word: Κωσὰμ
  choice: قُوسَام
  rationale: نقل صوتي للاسم اليوناني Κωσὰμ بصيغة عربية مقروءة.
- source_word: Ἐλμαδὰμ
  choice: أَلْمَادَام
  rationale: نقل صوتي مباشر للاسم اليوناني مع الحفاظ على ترتيب مقاطعه.
- source_word: Ἢρ
  choice: عِيرَ
  rationale: اختيرت الصيغة العربية الكتابية المألوفة للاسم السامي المقابل، مع الفتحة الإعرابية لأنه مجرور بالإضافة وهو ممنوع من الصرف.
