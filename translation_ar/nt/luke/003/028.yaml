  naturalness: النص موجز وطبيعي في أسلوب الأنساب العربي. لكن الحاشية الحالية غير دقيقة حين تصف τοῦ بأنه يحمل «معنى لِـ»؛ فهو أداة تعريف في صيغة المضاف إليه ضمن تركيب حذفي، لا حرف جر. كما أن حذف علامات الإعراب من الأسماء أنسب للفصحى الحديثة ويجنب تقريرًا صرفيًّا غير لازم عن «عير».
