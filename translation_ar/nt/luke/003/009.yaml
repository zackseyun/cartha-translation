  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: ar
  text: وها هي الفأس قد وُضعت عند جذور الأشجار. لذلك كل شجرة لا تُنتج ثمرًا جيدًا تُقطع وتُلقى في النار.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: وها هي ... قد
  rationale: تنقل الاستمرار مع إبراز أن أداة الدينونة صارت منذ الآن مهيأة، بصياغة عربية طبيعية وحية.
- source_word: ἡ ἀξίνη
  choice: الفأس
  rationale: المقابل العربي الواضح لأداة القطع في صورة الدينونة.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: قد وُضعت على أصل الأشجار
  rationale: تحافظ على صورة الفأس الموضوعة عند موضع القطع وعلى معنى الاستعداد الوشيك؛ واستُعمل «أصل» مفردًا كما في اليونانية.
- source_word: πᾶν οὖν δένδρον
  choice: لذلك كل شجرة
  rationale: «لذلك» تُظهر الاستنتاج الذي تفيده οὖν بوضوح.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: لا تُنتج ثمرًا جيدًا
  rationale: صياغة عربية طبيعية تحفظ معنى إنتاج الثمر، من غير تفسير أخلاقي زائد داخل النص.
- source_word: ἐκκόπτεται
  choice: تُقطع
  rationale: تنقل قطع الشجرة في سياق الصورة؛ والسياق يوضح أن المقصود إزالتها بالقطع.
- source_word: εἰς πῦρ βάλλεται
  choice: تُلقى في النار
  rationale: مقابل عربي مباشر وطبيعي للمبني للمجهول، يحفظ شدة صورة المصير.
theological_decisions:
- issue: صورة الدينونة المجازية
  choice: الإبقاء على صورة الفأس والأشجار والنار بوصفها إنذارًا بدينونة وشيكة، من غير تحديد ماهية النار أبعد مما يقوله النص.
  alternative: تفسير النار صراحةً بأنها جهنم، أو حصر الصورة في دينونة تاريخية على إسرائيل.
  rationale: النص يعلن دينونة شديدة ووشيكة، لكنه لا يحدد هنا وحده المرجع الكامل للنار؛ والإبقاء على الصورة يحفظ التوتر اللاهوتي ولا يفرض قراءة مذهبية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت صيغة المبني للمجهول في «وُضعت، تُقطع، تُلقى» لمطابقة بنية المصدر من غير تعيين فاعل لم يذكره النص.
