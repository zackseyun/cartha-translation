- source_word: Φάλεκ
  choice: فَالَجَ
  rationale: اختيرت الصيغة العربية المألوفة للاسم في سفر التكوين بدل النقل الصوتي المباشر للصيغة اليونانية.
- source_word: Ἔβερ
  choice: عَابِرَ
  rationale: هذه هي الصيغة العربية الكتابية المعروفة للاسم العبري المقابل، وهي أوضح للقارئ من نقل الحروف اليونانية وحدها.
- source_word: Σαλὰ
  choice: شَالَحَ
  rationale: استُخدمت الصيغة العربية المعروفة في نسب سفر التكوين لتيسير التعرف إلى الشخص نفسه عبر العهدين.
