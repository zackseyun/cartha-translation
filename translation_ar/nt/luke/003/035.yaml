  rationale: تأتي أداة التعريف في صيغة المضاف إليه مكررةً مع الأسماء ضمن سلسلة نسب مختصرة، وتدل من السياق على البنوة. والتصريح بـ«ابن» يجعل المعنى طبيعيًا وواضحًا بالعربية.
- source_word: Σεροὺχ
  choice: سَرُوجَ
