  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: ar
  text: وبينما كان الشعب ينتظر بترقّب، وكان الجميع يفكّرون في قلوبهم في شأن يوحنا، لعلّه هو المسيح[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الممسوح المنتظر؛ أو «المسيّا». اليونانية: ὁ χριστός.'
    reason: توضيح أن «المسيح» في هذا الموضع لقب مسياني، مع ذكر المقابل البديل.
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: كان الشعب ينتظر بترقّب
  rationale: ينقل معنى الانتظار المشحون بالتوقع، ويحافظ تركيب «بينما كان» على وظيفة المضاف المطلق في تمهيد المشهد.
- source_word: δὲ
  choice: وبينما
  rationale: أُدمج الرابط الخفيف في وصل الجملة بسياقها من غير إضافة ظرف زمني صريح غير موجود في الأصل.
- source_word: τοῦ λαοῦ
  choice: الشعب
  rationale: مقابل مباشر للاسم الجمعي، وهو أنسب من «الجمهور» لما قد يحمله اللفظ اللوقاوي من دلالة على الشعب بوصفه جماعة.
- source_word: διαλογιζομένων πάντων
  choice: وكان الجميع يفكّرون
  rationale: يحفظ شمول πάντων ودلالة المداولة الداخلية في διαλογίζομαι بصياغة عربية طبيعية.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: في قلوبهم
  rationale: ترجمة مباشرة وطبيعية تحافظ على التصور الكتابي للقلب بوصفه موضع الفكر والتداول الباطني.
- source_word: περὶ τοῦ Ἰωάννου
  choice: بشأن يوحنا
  rationale: ينقل معنى περί مع المضاف إليه بوضوح، ويصلح للانتقال إلى مضمون تفكيرهم.
- source_word: μήποτε αὐτὸς εἴη
  choice: هل عسى أن يكون هو
  rationale: «هل» تقدم الاستفهام غير المباشر، و«عسى» تحفظ قوة الاحتمال والتردد في μήποτε مع صيغة التمني الاحتمالية εἴη، و«هو» يحافظ على توكيد αὐτός.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: اللفظ هنا لقب مسياني منتظر لا اسم شخصي، و«المسيح» هو المقابل العربي الراسخ الذي يؤدي معنى الممسوح.
theological_decisions:
- issue: دلالة ὁ χριστός بوصفه لقبًا
  choice: المسيح
  alternative: المسيّا
  rationale: السياق يتناول توقع الشعب لهوية الشخص الممسوح المنتظر. أبقت الترجمة اللقب العربي الكتابي المألوف «المسيح»، مع حاشية توضّح معناه اللقبي كي لا يُقرأ هنا بوصفه اسمًا شخصيًا فحسب.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت صيغة السؤال بعد النقطتين لإظهار مضمون المداولة الباطنية، مع إبقاء التردد والاحتمال من غير الجزم بهوية يوحنا.
