  source_fidelity: 'ينقل المسودة المعنى الأساسي بدقة: انتظار الشعب بترقّب، وتداول الجميع داخليًا في أمر يوحنا، واحتمال كونه المسيح. لكن تحويل المداولة غير المباشرة في اليونانية إلى سؤال مباشر بعد نقطتين وعلامة استفهام أقل مطابقة لبنية الأصل، الذي يعلّق الاحتمال ضمن الجملة السردية.'
