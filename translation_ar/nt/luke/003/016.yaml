id: LUK.3.16
reference: Luke 3:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: ar
  text: 'فأجاب يوحنا الجميع قائلًا: «أنا أعمّدكم بالماء[a]، ولكن يأتي من هو أقوى مني[b]، ولست أهلًا لأن أحلّ رباط نعليه. هو سيعمّدكم في الروح القدس والنار[c][d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الماء». يمكن أن تدل صيغة الاسم اليونانية هنا على الوسيلة أو العنصر.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من هو أشدّ اقتدارًا مني».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «بالروح القدس والنار». يرد في اليونانية حرف الجر بمعنى «في»، وقد يُفهم هنا بأكثر من وجه.'
    reason: lexical_alternative
  - marker: d
    text: قد تُفهم «النار» على أنها للتطهير، أو للدينونة، أو جزء من صورة واحدة للتعميد بالروح والنار؛ وتُبقي الترجمة العبارة كما وردت.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: فأجاب يوحنا الجميع قائلًا
  rationale: يحافظ على صيغة السرد اليونانية وعلى كون جواب يوحنا موجّهًا إلى الجميع، بعبارة عربية طبيعية واضحة.
- source_word: Ἐγὼ μὲν ... δὲ
  choice: أنا ... ولكن
  rationale: يُبرز التقابل بين عمل يوحنا وعمل الآتي بعده من غير نقل حرفي متكلّف للأداتين اليونانيتين.
- source_word: ὕδατι
  choice: بالماء
  rationale: صيغة عربية مألوفة يمكن أن تدل على الوسيلة أو العنصر، مع إثبات البديل «في الماء» في الحاشية.
- source_word: βαπτίζω / βαπτίσει
  choice: أعمّد / سيعمّد
  rationale: «عمّد» هو اللفظ العربي المعياري في سياق الأناجيل، أما «غمر» فقد يضيّق الدلالة على نحو يتجاوز ما يحسمه النص هنا.
- source_word: ὁ ἰσχυρότερός μου
  choice: من هو أقوى مني
  rationale: ينقل صيغة المقارنة بوضوح ويحافظ على معنى القوة من غير إضافة تفسيرية.
- source_word: ἔρχεται
  choice: يأتي
  rationale: ينقل المضارع اليوناني الدال على مجيء قريب أو جارٍ بأسلوب عربي موجز وطبيعي.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: ولست أهلًا
  rationale: يفيد ἱκανός الكفاية أو الاستحقاق؛ وفي صيغة الاتضاع هذه تعبّر «أهلًا» عن المعنى الاصطلاحي بوضوح.
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: لأن أحلّ رباط نعليه
  rationale: ينقل فعل فكّ رباط النعلين، وهو عمل متواضع، بعبارة عربية مفهومة وغير قديمة.
- source_word: αὐτὸς
  choice: هو
  rationale: الضمير منفصل لإظهار التوكيد والتقابل بين يوحنا والآتي بعده.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: في الروح القدس
  rationale: يحافظ حرف «في» على احتمال دلالة ἐν على الوسيلة أو المجال أو العنصر، ولا يحسم ما يتركه الأصل محتملًا.
- source_word: καὶ πυρί
  choice: والنار
  rationale: يُترك التعبير كما هو بلا تحديد ما إذا كانت النار للتطهير أو للدينونة أو جزءًا من صورة واحدة.
theological_decisions:
- issue: معنى التعميد في الروح القدس والنار
  choice: الإبقاء على العبارة الموجزة «في الروح القدس والنار» دون تفسير وظيفة النار داخل المتن.
  alternative: تفسير النار بأنها تطهير، أو بأنها دينونة لفئة مغايرة، أو بأنها وجه من وجوه تعميد واحد.
  rationale: لا تحسم صياغة الآية وحدها هذه الاحتمالات، والسياق يتيح نقاشًا تفسيريًا؛ لذلك يحافظ النص على التوتر اللاهوتي بدل أن يفصل فيه بالترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت ألفاظ كتابية مألوفة مثل «أعمّد» و«الروح القدس»، مع تجنّب التراكيب العتيقة والحسم الطائفي. وُضعَت علامات الحواشي عند الألفاظ التي تتعلق بها مباشرة.
