  text: the son of Methuselah[a], the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan,
translation:
  language: ar
  text: ابن مَتُوشَالَح، ابن أَخْنُوخ، ابن يَارَد، ابن مَهَلَّلْئِيل، ابن قَيْنَان[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: Καϊνάμ، والنص اليوناني للوقا يتضمن هذا الاسم. ويمكن نقله صوتيًا «كَاينام»، بينما تَرِد في العربية الكتابية المألوفة صيغة «قَيْنَان».'
    reason: alternative_rendering
lexical_decisions:
- source_word: τοῦ
  choice: ابن
  rationale: أداة التعريف المجرورة المتكررة تأتي هنا على سبيل الحذف ضمن سلسلة النسب؛ وإظهار «ابن» ينقل العلاقة المفهومة من السياق بوضوح وطبيعية في العربية.
- source_word: Μαθουσαλά
  choice: مَتُوشَالَح
  rationale: الصيغة العربية الكتابية المألوفة للاسم، وتعين القارئ على التعرّف إلى الشخصية المقابلة في نسب سفر التكوين.
- source_word: Ἑνώχ
  choice: أَخْنُوخ
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: Ἰάρετ
  choice: يَارَد
  rationale: الصيغة العربية المألوفة المقابلة للاسم الوارد في نسب سفر التكوين.
- source_word: Μαλελεήλ
  choice: مَهَلَّلْئِيل
  rationale: اختيرت الصيغة العربية الكتابية المعروفة للاسم، بدل النقل الصوتي المباشر الأقل ألفة.
- source_word: Καϊνάμ
  choice: قَيْنَان
  rationale: الصيغة العربية الكتابية المألوفة لهذا الاسم في سلسلة النسب؛ وأُثبت اختلاف النقل الصوتي الممكن في الحاشية دون حذف الاسم أو تسويته صامتًا.
theological_decisions:
- issue: الحذف في صيغة النسب اليونانية القائمة على تكرار المجرور
  choice: إظهار كلمة «ابن» قبل كل اسم
  alternative: الإبقاء على سلسلة من الأسماء المسبوقة بمعنى «لـ» أو حذف «ابن» بعد أول اسم
  rationale: السياق النَّسَبي يجعل علاقة البنوة مفهومة، وإظهارها يحفظ المعنى ويجعل العربية واضحة من غير إضافة تفسير عقائدي.
- issue: صياغة الاسم Καϊνάμ
  choice: إثبات الاسم في المتن بصيغة «قَيْنَان»
  alternative: نقله صوتيًا بصيغة «كَاينام»
  rationale: النص اليوناني يثبت الاسم، لذلك لا يجوز حذفه. أما «قينان» فهي الصيغة العربية الكتابية الأعرف، مع بيان النقل الأقرب إلى اليونانية في الحاشية.
translation_notes:
  register: عربية فصحى واضحة وموقرة، مع استعمال صيغ الأسماء الكتابية العربية المألوفة. أُبقيت بنية الآية كسلسلة نسب، ووُضعت علامة الحاشية بعد الاسم الذي تتعلق به مباشرة.
