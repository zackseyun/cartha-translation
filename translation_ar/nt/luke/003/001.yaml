source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: ar
  text: وفي السنة الخامسة عشرة من حكم طيباريوس قيصر، حين كان بيلاطس البنطي يحكم اليهودية، وكان هيرودس رئيسَ ربعِ الجليل، وكان فيلبس أخوه رئيسَ ربعِ إقليم إيطورية وتراخونيتس، وكان ليسانيوس رئيسَ ربعِ أبيلينة[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «رئيس الربع» لقب لحاكم إقليم خاضع للسلطة الرومانية.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ
  choice: وفي السنة الخامسة عشرة
  rationale: ينقل الإطار الزمني، ويؤدي الواو وظيفة δὲ الانتقالية في سياق السرد من غير إقحام معنى التعارض.
- source_word: τῆς ἡγεμονίας Τιβερίου Καίσαρος
  choice: من حكم طيباريوس قيصر
  rationale: «حكم» تعبير عربي طبيعي ودقيق للسلطة الإمبراطورية هنا، مع نقل الاسمين وفق الصيغة العربية الشائعة.
- source_word: ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας
  choice: حين كان بيلاطس البنطي يحكم اليهودية
  rationale: يحافظ على القوة الظرفية والصيغة الفعلية لاسم الفاعل اليوناني بدل تحويله إلى مجرد لقب رسمي.
- source_word: τετρααρχοῦντος
  choice: كان ... رئيسَ ربعٍ على
  rationale: يحفظ خصوصية اللقب السياسي التاريخي ولا يختزله في «حاكم»، مع تركيب عربي مفهوم.
- source_word: Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ
  choice: وفيلبس أخوه
  rationale: يحافظ بإيجاز على علاقة البدل وعلى عود الضمير إلى هيرودس.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: إقليم إيطورية وتراخونيتس
  rationale: يثبت معنى χώρα بوصفه إقليمًا، فلا يسقط الدلالة الجغرافية.
- source_word: τῆς Ἀβιληνῆς
  choice: أبيلينة
  rationale: اسم الإقليم منقول بصيغة عربية واضحة، ويتعلق به حرف الجر «على» في العبارة السابقة.
theological_decisions:
- issue: نقل اللقب السياسي τετρααρχοῦντος
  choice: رئيس ربع
  alternative: حاكم / كان يحكم
  rationale: اللقب تاريخي لا لاهوتي أساسًا، لكن إبقاء خصوصيته يمنع تسطيح دلالة النص، وتوضح الحاشية وظيفته للقارئ المعاصر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «حين كان» لبناء الجملة الظرفية الطويلة بصورة طبيعية، وأُبقيت فاصلة ختامية لأن الآية في اليونانية تستمر نحويًا إلى الآية التالية.
