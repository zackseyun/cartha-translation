base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: ar
  text: وكان يسوع نفسه، حين بدأ، في نحو الثلاثين من عمره، وكان يُظَنّ أنه ابن يوسف بن هالي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة: «وكان يسوع نفسه في نحو الثلاثين من عمره عند بدئه». ولا يذكر النص اليوناني صراحةً ما الذي بدأه، وإن كان السياق يشير إلى بدء نشاطه العلني.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: و
  rationale: حرف عطف يحفظ استمرارية السرد مع مشهد المعمودية السابق.
- source_word: αὐτὸς
  choice: نفسه
  rationale: يحفظ توكيد الضمير اليوناني في تعبير عربي طبيعي.
- source_word: ἀρχόμενος
  choice: حين بدأ
  rationale: صياغة عربية واضحة لا تضيف «خدمته»، إذ لا يرد هذا الاسم صراحة في اليونانية.
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: نحو ابن ثلاثين سنة
  rationale: تعبير عربي طبيعي للعمر يحفظ معنى التقريب في ὡσεὶ.
- source_word: ὢν υἱός, ὡς ἐνομίζετο, Ἰωσὴφ
  choice: وهو—كما كان يُظَنّ—ابن يوسف
  rationale: يحفظ الربط الوصفي ويجعل العبارة الاعتراضية متعلقة ببنوّة يسوع ليوسف كما في السياق.
- source_word: τοῦ Ἠλὶ
  choice: بن هالي
  rationale: يفك الإضمار النسبي في سلسلة النسب بصيغة عربية مألوفة؛ والمقصود أن يوسف منسوب إلى هالي.
theological_decisions:
- issue: علاقة «كما كان يُظَنّ» ببنوّة يسوع ليوسف
  choice: وضع العبارة بين شرطتين اعتراضيتين بعد «وهو» وقبل «ابن يوسف» لتفيد أن الناس كانوا يعدّون يسوع ابن يوسف.
  alternative: إدراج العبارة بلا فصل اعتراضي، أو جعلها وصفًا عامًا لا يحدد جهة الظن.
  rationale: يحفظ النص التوتر المقصود بين النسبة الاجتماعية الشائعة إلى يوسف وبين رواية لوقا السابقة عن الحبل العجيب، من غير أن يضيف إلى الآية ما لا تقوله.
- issue: هل تُضاف كلمة «خدمته» بعد «بدأ»؟
  choice: عدم إضافتها في المتن.
  alternative: «حين بدأ خدمته»
  rationale: السياق يرجح بدء نشاط يسوع العلني، لكن الاسم غير مذكور في الأصل، ولذلك تُصان درجة الإبهام.
- issue: مرجع «بن هالي» في سلسلة النسب
  choice: 'صياغته بعد يوسف على أنه استمرار لسلسلة النسب: «يوسف، بن هالي».'
  alternative: الإبقاء على تركيب حرفي ملتبس مثل «يوسف، لهالي».
  rationale: اليونانية تستعمل توالي المضاف إليه المحذوف منه لفظ «ابن»؛ وإظهاره بالعربية ضروري لوضوح النسب من غير حسم مسائل نسبية أوسع لا تفصل فيها الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «ابن ثلاثين سنة» بوصفه تعبيرًا عربيًا طبيعيًا عن العمر، والشرطتان لإبراز الجملة الاعتراضية. وُضع مؤشر الحاشية في المتن كما يلزم.
