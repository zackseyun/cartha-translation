  text: the son of Enosh[a], the son of Seth, the son of Adam, the son of God.
translation:
  language: ar
  text: ابن أنوش[a]، ابن شيث، ابن آدم، ابن الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تكرر اليونانية ببساطة صيغة المضاف إليه: «لأنوش، لشيث، لآدم، لله»؛ وأُضيفت كلمة «ابن» في العربية استنادًا إلى تركيب سلسلة النسب الواضح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: ابن أنوش
  rationale: يتابع تركيب أداة التعريف مع المضاف إليه صيغةَ النسب الناقصة في السياق، وفيها تُفهم كلمة «ابن». واستُعمل «أنوش» بوصفه الصيغة العربية الشائعة للاسم الكتابي.
- source_word: τοῦ Σὴθ
  choice: ابن شيث
  rationale: صيغة المضاف إليه تواصل سلسلة النسب نفسها وتدل سياقيًا على البنوة؛ و«شيث» هو الرسم العربي الشائع للاسم.
- source_word: τοῦ Ἀδὰμ
  choice: ابن آدم
  rationale: حُفظ «آدم» اسمًا علمًا، ولم يُترجم بمعنى «إنسان»، لأن السياق قائمة أنساب.
- source_word: τοῦ θεοῦ
  choice: ابن الله
  rationale: رغم أن اليونانية تورد المضاف إليه وحده، فإن النمط المتكرر في سلسلة النسب يقتضي إظهار «ابن» بالعربية للوضوح مع إبقاء الخاتمة اللاهوتية كما هي.
theological_decisions:
- issue: صياغة العبارة الأخيرة τοῦ θεοῦ في نسب آدم
  choice: ابن الله
  alternative: من الله؛ لله
  rationale: يحافظ هذا الاختيار على نمط البنوة الذي يحكم سلسلة النسب وعلى قوة الخاتمة، من غير أن يساوي ضمنًا بين بنوة آدم وأي مفهوم لاهوتي آخر للبنوة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع استعمال الأسماء الكتابية العربية الشائعة والمحافظة على الإيقاع المتوازي لسلسلة النسب.
