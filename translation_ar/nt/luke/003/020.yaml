lexical_decisions:
- source_word: προσέθηκεν
  choice: وأضاف
  rationale: يحافظ على معنى ضمّ فعل جديد إلى أفعال سابقة، بصياغة عربية طبيعية وموجزة.
- source_word: τοῦτο
  choice: هذا أيضًا
  rationale: يشير اسم الإشارة إلى الفعل اللاحق، وتعبّر «أيضًا» عن القوة الإضافية في السياق.
- source_word: ἐπὶ πᾶσιν
  choice: إلى شروره كلها
  rationale: يفيد التعبير معنى الإضافة إلى كل ما سبق، والسياق المباشر في الآية السابقة يحدد تلك الأمور بأنها شرور هيرودس.
- source_word: κατέκλεισεν
  choice: أودع ... السجن
  rationale: تعبير عربي واضح يدل على الحبس والإغلاق على الشخص، من غير تكرار ثقيل.
- source_word: Ἰωάννην
  choice: يوحنا
  rationale: الصيغة العربية المألوفة للاسم الكتابي.
- source_word: ἐν φυλακῇ
  choice: السجن
  rationale: تدل φυλακή هنا على مكان الحبس، و«السجن» هي المقابلة العربية الطبيعية في هذا السياق.
theological_decisions:
- issue: مرجع ἐπὶ πᾶσιν وقوته
  choice: يفيد أن هيرودس أضاف حبس يوحنا إلى شروره السابقة كلها.
  alternative: 'يمكن إبقاء العبارة أقرب إلى صورتها اللفظية: «وأضاف هذا أيضًا إلى جميعها».'
  rationale: السياق المباشر في لوقا 3:19–20 يذكر شرور هيرودس ثم يعرض حبس يوحنا بوصفه شرًا إضافيًا. توضيح «شروره» يستند إلى السياق ولا يضيف مضمونًا مذهبيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أودع يوحنا السجن» بدل تركيب حرفي ثقيل، مع إبقاء المعنى التراكمي للعبارة اليونانية وذكر البديل الأكثر حرفية في الحاشية.
