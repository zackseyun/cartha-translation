  to: سيُملَأُ كلُّ وادٍ[a]، وسيُخفَضُ كلُّ جبلٍ وتلٍّ، وسيصيرُ المُعْوَجُّ مستقيمًا، وستصيرُ الطُّرُقُ الوَعْرَةُ طُرُقًا مَلْساءَ[b].
