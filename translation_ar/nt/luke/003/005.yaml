  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: ar
  text: سيُملَأُ كلُّ وادٍ[a]، وسيُخفَضُ كلُّ جبلٍ وتلٍّ، وسيصيرُ المُعْوَجُّ مستقيمًا، وستصيرُ الطُّرُقُ الوَعْرَةُ طُرُقًا مَلْساءَ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تُمْلَأُ كلُّ وَهْدةٍ عميقة».'
    reason: lexical_alternative
  - marker: b
    text: تُردِّد هذه العبارة صدى إشعياء 40:4، مستخدمةً صورة إعداد الطريق لتهيئة طريق الرب.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: كُلُّ وَادٍ
  rationale: تدل φάραγξ على وادٍ أو وهدة عميقة أو خانق. «وادٍ» تعبير عربي واضح وطبيعي يلائم صورة تسوية الأرض، مع إثبات البديل الأدق تضاريسيًا في الحاشية.
- source_word: πληρωθήσεται
  choice: يُمْلَأُ
  rationale: فعل مستقبل مبني للمجهول من πληρόω، ومعناه المباشر في الصورة التضاريسية أن الوادي يُملأ.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: كُلُّ جَبَلٍ وتَلٍّ
  rationale: حُفظ الاسمان المتقاربان لتمييز المرتفع الأكبر من الأصغر ولصون الامتلاء الشعري في الأصل.
- source_word: ταπεινωθήσεται
  choice: يُخْفَضُ
  rationale: السياق تضاريسي، لذلك ينقل «يُخفض» معنى إنزال الأرض المرتفعة بوضوح، من غير تحويل الصورة إلى تواضع أخلاقي.
- source_word: τὰ σκολιά
  choice: المُعْوَجُّ
  rationale: الصفة اليونانية المحايدة مستعملة استعمال الاسم من غير ذكر اسم محدد. يحافظ المفرد الجمعي العربي على هذا الإبهام ولا يضيف «أماكن» أو «طرقًا» إلى النص.
- source_word: εἰς εὐθείαν
  choice: مستقيمًا
  rationale: تفيد العبارة التحول إلى الاستقامة؛ وصياغة «يصير المعوج مستقيمًا» عربية طبيعية وتحفظ التقابل.
- source_word: αἱ τραχεῖαι
  choice: الطُّرُقُ الوَعْرَةُ
  rationale: الصفة المؤنثة في الجمع مستعملة اسميًا، ويرجح أن الموصوف المحذوف هو الطرق في ضوء ὁδοὺς التالية. التصريح به في العربية يزيل الغموض النحوي غير المقصود.
- source_word: εἰς ὁδοὺς λείας
  choice: طُرُقًا مَلْساءَ
  rationale: ὁδοὺς مذكورة صراحة، وλείας تفيد النعومة أو الاستواء. «طرقًا ملساء» تحفظ صورة تمهيد الطريق بوضوح.
theological_decisions:
- issue: الصورة النبوية والتضاريسية المقتبسة من إشعياء 40:4
  choice: الإبقاء على صورة ملء الوادي وخفض المرتفعات وتقويم المعوج وتمهيد الطرق
  alternative: تفسير الصورة مباشرة بلغة روحية أو أخلاقية، مثل رفع المتواضعين وإذلال المتكبرين
  rationale: يورد لوقا هنا لغة حسية خاصة بتهيئة الطريق. إبقاؤها كما هي يصون قوتها الشعرية وإيحاءاتها اللاهوتية من غير فرض تفسير بعينه داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة نبوية مهيبة. استُخدم المضارع المبني للمجهول للدلالة على المستقبل، وهو أسلوب عربي طبيعي في سياق النبوة. وُضعت علامتا الحاشية في المتن عند موضعيهما.
