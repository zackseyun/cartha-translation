  - severity: low
    issue: حذف الفعل في الشطر الأخير
    rationale: الأصل يعبّر عن تحول الطرق الوعرة إلى طرق ملساء؛ وإعادة «ستصير» تجعل العلاقة النحوية والدلالة التحولية ظاهرتين.
  - severity: low
