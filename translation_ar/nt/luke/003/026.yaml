lexical_decisions:
- source_word: τοῦ
  choice: ابن
  rationale: تأتي أداة التعريف في صيغة المضاف إليه مكررةً على نحو إضماري في سلسلة النسب، وتدل في سياقها على علاقة البنوة. أُثبتت «ابن» في العربية لتوضيح العلاقة التي يفهمها السياق، بدل ترجمة كل تكرار بحرف إضافة مبهم.
- source_word: Μάαθ
  choice: مآث
  rationale: نقل صوتي للاسم اليوناني، مع تمثيل امتداد الألف وصوت الثيتا بصورة واضحة في العربية.
- source_word: Ματταθίου
  choice: متاثياس
  rationale: نقل للاسم في صيغته المعجمية «Ματταθίας»، إذ إن «Ματταθίου» صيغة المضاف إليه؛ واختيار «متاثياس» يحافظ على صورة الاسم اليونانية.
- source_word: Σεμεῒν
  choice: سِمْعِين
  rationale: نقل صوتي مقروء للاسم اليوناني، مع استخدام العين لتقريب البنية السامية التي تعكسها الصيغة اليونانية، من غير استبداله باسم آخر.
- source_word: Ἰωσὴχ
  choice: يوسيخ
  rationale: نقل مباشر للصيغة التي يقرأها SBLGNT، مع تمثيل الحرف اليوناني χ بالخاء وعدم مواءمة الاسم مع صيغ أخرى.
- source_word: Ἰωδὰ
  choice: يودا
  rationale: نقل مباشر للاسم اليوناني Ἰωδά، دون توسيعه إلى صيغة عبرية مفترضة أو مطابقته تلقائيًا مع اسم آخر.
