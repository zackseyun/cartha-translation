  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الجملة مفتوحة بفاصلة لأنها جزء من تركيب يستمر في العدد التالي، كما في المصدر. استُعمل اللقب التاريخي «رئيس الربع» بدل تعميمه إلى «حاكم».
