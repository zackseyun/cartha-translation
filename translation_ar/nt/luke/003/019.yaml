lexical_decisions:
- source_word: τετραάρχης
  choice: رئيس الرُّبع
  rationale: ينقل اللقب السياسي التاريخي الدال أصلًا على حاكم جزء من إقليم، وهو تعبير عربي موجز معروف في الترجمات والكتابات التاريخية.
- source_word: ἐλεγχόμενος
  choice: كان يوحنا يوبِّخه
  rationale: ينقل معنى اللوم الأخلاقي المستمر أو المتكرر في اسم المفعول اليوناني، مع تحويل المبني للمجهول إلى صياغة عربية طبيعية وإيضاح مرجع الضمير من السياق.
- source_word: ὑπ’ αὐτοῦ
  choice: يوحنا
  rationale: الضمير اليوناني يعود إلى يوحنا في السياق؛ ذُكر الاسم في العربية لتجنب غموض غير طبيعي بعد تقديم هيرودس، من غير إضافة معلومة جديدة.
- source_word: περὶ Ἡρῳδιάδος
  choice: بسبب هيروديا
  rationale: «بسبب» تلائم سياق التوبيخ وتبيّن أن الأمر المتعلق بهيروديا كان موضوع المؤاخذة، مع موازاة العبارة التالية.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: زوجة أخيه
  rationale: صياغة عربية طبيعية تحفظ علاقة الإضافة المركزية في الاتهام.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: وبسبب كل الشرور التي ارتكبها هيرودس
  rationale: يحفظ شمول πάντων والجمع الدال على الأفعال الشريرة، و«ارتكب» عربي طبيعي مع الشرور ويصون القوة الأخلاقية.
- source_word: δὲ
  choice: أمّا
  rationale: تؤدي الانتقال والمقابلة السردية في صدر العبارة، وتناسب استئناف الحديث عن هيرودس.
theological_decisions:
- issue: القوة الأخلاقية لتوبيخ يوحنا لهيرودس
  choice: يوبِّخه
  alternative: يفضحه أو يقرِّعه
  rationale: «يوبِّخه» يحفظ دلالة المواجهة الأخلاقية النبوية من غير حصر اللفظ في كشف المستور أو زيادة حدّة لا يفرضها السياق.
- issue: تحديد فاعل التوبيخ
  choice: التصريح بيوحنا
  alternative: كان يُوبَّخ منه
  rationale: الأصل يستخدم ضميرًا واضح المرجع سياقيًا، لكن محاكاته حرفيًا في العربية ثقيلة وملتبسة؛ التصريح بالمرجع يحقق الوضوح ولا يضيف تفسيرًا عقديًا.
