  text: the son of Cainan[a], the son of Arphaxad, the son of Shem, the son of Noah, the son of Lamech[c][b],
translation:
  language: ar
  text: بن قينان[a][b]، بن أرفكساد[c]، بن سام، بن نوح، بن لامك،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يُنقل هذا الاسم أيضًا بصيغة «كينان».
    reason: lexical_alternative
  - marker: b
    text: تحذف بعض التقاليد النصية اسم قينان هنا، توفيقًا للنسب بدرجة أكبر مع بعض صيغ العهد القديم.
    reason: textual_variant
  - marker: c
    text: تعكس «أرفكساد» الصيغة اليونانية الواردة في لوقا؛ وقارن اسم العهد القديم الذي يُنقل غالبًا «أرفكشاد».
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: بن
  rationale: أداة التعريف المضافة المتكررة مع الأسماء تُفهم، في سياق سلسلة النسب المحيطة، على معنى الانتساب البنوي؛ ولفظة «بن» تؤدي هذا المعنى بإيجاز وطبيعية في العربية.
- source_word: Καϊνὰμ
  choice: قينان
  rationale: نقل للاسم اليوناني بصيغته الكتابية العربية المألوفة، مع إثبات صيغة نقل بديلة في الحاشية.
- source_word: Ἀρφαξὰδ
  choice: أرفكساد
  rationale: يعكس نطق الصيغة اليونانية في نص لوقا، ولا يستبدل بها صامتًا الصيغة المأخوذة من الاسم العبري في العهد القديم.
- source_word: Σὴμ
  choice: سام
  rationale: الصيغة العربية الراسخة للاسم الكتابي.
- source_word: Νῶε
  choice: نوح
  rationale: الصيغة العربية الراسخة للاسم الكتابي، وهي أوضح للقارئ من النقل الحرفي للصيغة اليونانية.
- source_word: Λάμεχ
  choice: لامك
  rationale: الصيغة العربية المألوفة للاسم الكتابي.
theological_decisions:
- issue: ورود قينان في نسب لوقا بين أرفكساد وسام
  choice: إثبات قينان في المتن
  alternative: حذف قينان لموافقة بعض صيغ أنساب العهد القديم
  rationale: نص SBLGNT المعطى يثبت Καϊνὰμ، ولذلك تُحفظ قراءة لوقا ولا تُسوّى مع صيغ نسب أخرى؛ وتُذكر القراءة المخالفة بشفافية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم الأسلوب النسبي العربي الموجز «بن» بدل تكرار تركيب أطول، وحُفظت جميع الأسماء وترتيبها كما في المصدر اليوناني.
