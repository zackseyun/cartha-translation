  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: ar
  text: في عهد رئاسة حَنّان وقيافا للكهنة[a]، جاءت كلمة الله إلى يوحنا بن زكريا في البرية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكبر: «في رئاسة حَنّان وقيافا للكهنة». يذكر لوقا الرجلين مع أن لفظ «رئاسة الكهنة» في الأصل مفرد.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: في عهد رئاسة حَنّان وقيافا للكهنة
  rationale: تفيد ἐπί مع المضاف إليه هنا الزمن، أي «في عهد». وتحافظ صياغة «رئاسة ... للكهنة» على إفراد ἀρχιερέως مع ذكر حَنّان وقيافا معًا، من غير تسوية التوتر التاريخي في العبارة.
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: صارت كلمة الله
  rationale: صيغة نبوية كتابية تعبّر عن وصول إعلان إلهي. و«صارت كلمة الله إلى» تحافظ على الطابع الحدثي للفعل ἐγένετο وعلى رنين العبارة النبوية، دون ترجمته ترجمة حرفية جامدة.
- source_word: ἐπὶ Ἰωάννην
  choice: إلى يوحنا
  rationale: تفيد ἐπί مع المفعول هنا اتجاه الكلمة ووصولها إلى يوحنا؛ و«إلى» عربية واضحة وطبيعية.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: بن زكريا
  rationale: عبارة بدل توضّح هوية يوحنا. و«بن زكريا» موجزة وفصيحة وطبيعية في العربية.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: تشير ἔρημος إلى منطقة مقفرة قليلة السكان، لا بالضرورة إلى صحراء رملية؛ و«البرية» هي المقابل الكتابي الدقيق والمألوف.
theological_decisions:
- issue: نسبة حَنّان وقيافا إلى لفظ ἀρχιερέως المفرد
  choice: 'الإبقاء على المؤسسة بصيغة المفرد: «في عهد رئاسة حَنّان وقيافا للكهنة»'
  alternative: حين كان حَنّان وقيافا رئيسَي كهنة
  rationale: النص اليوناني يستعمل ἀρχιερέως بالمفرد مع تسمية رجلين. تحافظ الصياغة المختارة على هذا التوتر الأدبي والتاريخي ولا تفترض حلًا توفيقيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «البرية» للدقة السياقية، وأُبقي تركيب رئاسة الكهنة مفردًا لصون دلالة الأصل وغموضه المقصود.
