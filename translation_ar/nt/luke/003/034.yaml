lexical_decisions:
- source_word: τοῦ
  choice: ابن
  rationale: تكرار أداة التعريف في صيغة المضاف إليه يواصل النمط النسبي المحذوف صدره في السياق؛ وإظهار «ابن» يجعل علاقة النسب واضحة وطبيعية بالعربية.
- source_word: Ἰακώβ
  choice: يعقوب
  rationale: الصيغة العربية الكتابية المألوفة لاسم الأب القديم.
- source_word: Ἰσαάκ
  choice: إسحاق
  rationale: الصيغة العربية الكتابية المألوفة للاسم.
- source_word: Ἀβραάμ
  choice: إبراهيم
  rationale: الصيغة العربية الكتابية الراسخة للاسم، وفق هوية الشخصية في العهد القديم.
- source_word: Θάρα
  choice: تارح
  rationale: استُعملت الصيغة العربية المألوفة لاسم الشخصية نفسها في العهد القديم بدل نقل اللفظ اليوناني حرفيًا «ثارا».
- source_word: Ναχώρ
  choice: ناحور
  rationale: استُعملت الصيغة العربية المألوفة لاسم الشخصية نفسها في العهد القديم، وهي توافق أيضًا اللفظ اليوناني توافقًا قريبًا.
theological_decisions:
- issue: إظهار علاقة البنوة المضمرة في سلسلة النسب
  choice: تكرار «ابن» قبل كل اسم
  alternative: إيراد الأسماء في تراكيب إضافة مجردة أو الاكتفاء بعلامة النسب من السياق
  rationale: النص اليوناني موجز ويكرر صيغة المضاف إليه اعتمادًا على نمط السلسلة في الآيات المحيطة. إظهار «ابن» ينقل وظيفة التركيب بوضوح من غير إضافة مضمون عقائدي.
translation_notes:
  register: عربية فصحى واضحة وموجزة، مع اعتماد صيغ الأسماء الكتابية العربية الشائعة والمحافظة على إيقاع سلسلة النسب.
