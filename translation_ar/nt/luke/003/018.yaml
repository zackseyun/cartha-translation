  text: وهكذا، كان يبشّر الشعب، حاثًّا إياه على أمور كثيرة أخرى[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبكلمات كثيرة أخرى كان يحثّهم». تستعمل اليونانية «كثيرة» و«أخرى» استعمال الاسم، من غير أن تذكر ما هي تلك الأمور صراحةً.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ ... καὶ ἕτερα
  choice: بأمور كثيرة أخرى
  rationale: ينقل الصفة المحايدة المستعملة استعمال الاسم مع معنى الإضافة في ἕτερα، مع إبقاء كلمة «أمور» عامة لأن اليونانية لا تصرّح بالمقصود.
- source_word: μὲν οὖν
  choice: وهكذا
  rationale: تؤدي وظيفة الانتقال والاستمرار والاستنتاج الخفيف في السياق من غير تفكيك الأداتين إلى عبارتين عربيتين مثقلتين.
- source_word: παρακαλῶν
  choice: حاثًّا
  rationale: صيغة اسم الفاعل تحافظ على تبعية الفعل للمسند الرئيس، و«حثّ» يلائم طابع دعوة يوحنا الأخلاقية والنبوية، مع إمكان معنى التشجيع أو المناشدة بحسب السياق.
- source_word: εὐηγγελίζετο
  choice: كان يبشّره
  rationale: تركيب «كان» مع المضارع ينقل الاستمرار في صيغة الماضي الناقص، و«يبشّر» يحفظ دلالة إعلان الخبر السار بدل اختزالها إلى الوعظ العام.
- source_word: τὸν λαόν
  choice: الشعب
  rationale: ينقل λαός بدقة ويحافظ على إمكان إيحاءاته الجماعية والعهدية من غير تقييده بالحشد أو إضافة «إسرائيل» التي لا ترد صراحة هنا.
theological_decisions:
- issue: دلالة εὐηγγελίζετο في وصف خدمة يوحنا
  choice: كان يبشّره
  alternative: كان يعظ الشعب / كان يعلن للشعب
  rationale: النص اليوناني نفسه يصف خطاب يوحنا، على الرغم من اشتماله على الحث والإنذار، بأنه تبشير؛ لذلك حُفظ هذا التوتر اللاهوتي ولم يُسوَّ إلى مجرد وعظ.
- issue: علاقة الحث بالتبشير
  choice: جُعل «حاثًّا» حالًا تابعة لفعل التبشير الرئيس
  alternative: كان يحثّ الشعب ويبشّره
  rationale: يحافظ ذلك على البنية النحوية التي تجعل παρακαλῶν اسم فاعل تابعًا وεὐηγγελίζετο الفعل الرئيس، من غير الفصل بين جانبي رسالة يوحنا.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «حاثًّا» لصون بناء الجملة اليوناني، و«يبشّره» عائدًا إلى «الشعب» بوصفه اسم جمع مفردًا، مع تجنّب الألفاظ الكنسية الاصطلاحية الأثقل مثل «يكرز بالإنجيل».
