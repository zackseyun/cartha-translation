  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: ar
  text: مِذْراتُه في يده، لينقّي بيدره تنقيةً تامةً، ويجمع القمح في مخزنه[b]؛ أمّا التبن فيحرقه حرقًا تامًّا بنار لا تنطفئ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: أو «مستودعه» أو «مخزن حبوبه».
    reason: lexical_alternative
  - marker: c
    text: أو «بنار لا يمكن إطفاؤها».
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: مِذراة
  rationale: اسم عربي لأداة تذرية الحبوب وفصلها عن التبن، ويحفظ الصورة الزراعية بلفظ موجز ومفهوم.
- source_word: διακαθᾶραι
  choice: لينقّي ... تنقيةً تامة
  rationale: ينقل معنى التنقية مع القوة التكثيفية للفعل المركب، ويأتي طبيعيًا في سياق البيدر.
- source_word: ἅλωνα
  choice: بيدره
  rationale: «البيدر» هو الموضع الذي تُدرَس فيه الحبوب وتُذرّى، وهو المقابل العربي المألوف للصورة الزراعية.
- source_word: συναγαγεῖν
  choice: ويجمع
  rationale: يؤدي معنى الجمع بعد فصل الحبوب عن التبن دون زيادة تفسيرية.
- source_word: σῖτον
  choice: القمح
  rationale: مع أن اللفظة قد تدل على الحبوب عمومًا، فإن القمح هو المعنى الطبيعي في مقابل التبن هنا.
- source_word: ἀποθήκην
  choice: مخزنه
  rationale: لفظ عام ودقيق لمكان حفظ المحصول، من غير تخصيصه بنوع معماري بعينه.
- source_word: ἄχυρον
  choice: التبن
  rationale: لفظ عربي مألوف للمادة الخفيفة عديمة النفع التي تنفصل عن الحب في التذرية؛ ويخدم المقابلة الزراعية مع القمح.
- source_word: κατακαύσει
  choice: فيحرقه
  rationale: يفيد الإحراق، والسياق مع النار والتبن يوصل معنى الاستهلاك التام من غير تركيب عربي ثقيل.
- source_word: πυρὶ ἀσβέστῳ
  choice: بنار لا تنطفئ
  rationale: يحفظ وصف النار بأنها غير قابلة للانطفاء من غير توسيع الصورة إلى صياغة عقائدية تتجاوز النص.
- source_word: οὗ
  choice: مِذراته
  rationale: نُقل ضمير الموصول اليوناني بصيغة الملكية العربية، بما يلائم استمرار وصف الآتي المذكور في السياق السابق.
theological_decisions:
- issue: صورة الدينونة والفصل الزراعي
  choice: الإبقاء على التباين الصريح بين جمع القمح وإحراق التبن بنار لا تنطفئ
  alternative: تفسير الصورة صراحةً على أنها دينونة زمنية فقط، أو تحويلها إلى صياغة عقائدية مفصلة عن العقاب النهائي
  rationale: النص نفسه يصوّر فصلًا حاسمًا يتضمن الجمع من جهة والإحراق من جهة أخرى، لكنه لا يشرح هنا جميع تفاصيل مدلوله الأخروي؛ لذلك تحفظ الترجمة قوة الصورة وتوترها من غير حسم ما لم يحسمه النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «البيدر» و«المِذراة» للمحافظة على الصورة الزراعية، مع شرح اللفظ الأداتي في الحاشية. وُضعت علامات الحواشي [a] و[b] و[c] في مواضعها داخل النص.
