  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: ar
  text: وحدث أنه، حين كان الشعب كله يُعمَّد، وكان يسوع أيضًا قد اعتمد ويصلّي، انفتحت السماء[a]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُفهم: «السماء المنظورة». فاللفظ اليوناني قد يدل على السماء المنظورة أو على المجال السماوي، غير أن المعنى الإعلاني هو الأرجح في هذا السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: وحدث أنه
  rationale: صيغة سردية لوقاوية تنقل القصة إلى مشهد جديد؛ الواو تؤدي وظيفة δὲ الانتقالية من غير أن توحي بتعارض.
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: إذ كان الشعب كله يعتمد
  rationale: المصدر المعرّف مع ἐν ذو دلالة زمنية، وصيغة «إذ كان» تعبّر طبيعيًا عن الإطار الزمني، مع إبقاء «الشعب كله» دالًا على الجماعة في مجموعها.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: وكان يسوع أيضًا قد اعتمد
  rationale: تعكس «أيضًا» القوة الإضافية لـ καί، ويبيّن «قد اعتمد» أن المعمودية سبقت حال صلاته وفتح السماء في تسلسل الجملة.
- source_word: καὶ προσευχομένου
  choice: وكان يصلّي
  rationale: تفيد صيغة الاستمرار أن الصلاة كانت جارية حين وقع الحدث الرئيس.
- source_word: ἀνεῳχθῆναι
  choice: انفتحت
  rationale: تنقل وقوع الفتح من غير استيراد صورة الانشقاق الأقوى الواردة في رواية مرقس؛ والبناء العربي المطاوع طبيعي ويحافظ على عدم ذكر الفاعل.
- source_word: τὸν οὐρανὸν
  choice: السماء
  rationale: «السماء» هي المقابل العربي الطبيعي، ويمكنها بحسب السياق أن تدل على المجال السماوي أو السماء المنظورة، مع رجحان المعنى الإعلاني هنا.
theological_decisions:
- issue: مرجع οὐρανός في مشهد معمودية يسوع
  choice: السماء
  alternative: الجو أو السماء المنظورة
  rationale: سياق نزول الروح والصوت الإلهي يرجّح المجال السماوي، لكن لفظ «السماء» يحفظ سعة الدلالة الأصلية ولا يحسمها بتفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يعتمد» بوصفه المصطلح الكتابي العربي المألوف، مع تركيب زمني سلس يحافظ على تتابع المعمودية والصلاة وانفتاح السماء.
