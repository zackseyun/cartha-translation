  text: وَسَيَرَى كُلُّ بَشَرٍ خَلَاصَ اللهِ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «البشر جميعًا». يقول اليوناني حرفيًا «كل جسد»، في صدى لإشعياء 40:5، والمقصود هنا جميع الناس.
