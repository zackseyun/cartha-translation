lexical_decisions:
- source_word: ὄψεται
  choice: سيرى
  rationale: فعل مستقبل من ὁράω، واستعمال «سيرى» طبيعي ومباشر ويحفظ الصورة البصرية في اليونانية.
- source_word: πᾶσα σὰρξ
  choice: كل بشر
  rationale: يحفظ هذا التعبير الصياغة النبوية وصدى إشعياء 40:5، مع كونه مفهومًا في العربية بمعنى البشر جميعًا، من غير تسطيحه إلى «الجميع».
- source_word: σωτήριον
  choice: خلاص
  rationale: اللفظة مستعملة هنا استعمال الاسم مع أداة التعريف، و«خلاص» هو المقابل العربي الراسخ الذي يحفظ اتساع معنى عمل الله المنقذ.
- source_word: τοῦ θεοῦ
  choice: اللهِ
  rationale: الإضافة «خلاص الله» تقابل تركيب المضاف إليه اليوناني وتحفظ إمكان دلالته على النسبة أو المصدر دون حسم زائد.
theological_decisions:
- issue: دلالة التعبير πᾶσα σὰρξ
  choice: «كل بشر» بمعنى البشرية كلها
  alternative: «البشر جميعًا» أو قراءة حرفية تركز على كل ذي جسد
  rationale: السياق يقتبس من إشعياء، وفيه يدل التعبير على نطاق بشري شامل. وإبقاء الصياغة «كل بشر» يحفظ الصدى الكتابي مع وضوح المقصود.
- issue: دلالة إضافة الخلاص إلى الله في τοῦ θεοῦ
  choice: «خلاص الله»
  alternative: «الخلاص الآتي من الله»
  rationale: الإضافة العربية تحفظ إيجاز اليونانية وما فيها من سعة دلالية، بدل قصرها صراحة على معنى المصدر وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «كل بشر» للحفاظ على النبرة النبوية والصلة النصية، مع شرح معناها الاصطلاحي في الحاشية.
