  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: ar
  text: ابن عميناداب[a]، ابن أدمين، ابن أرني، ابن حصرون، ابن فارص، ابن يهوذا،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «ابن عميناداب، ابن أدمين، ابن أرام»، بينما تحذف مخطوطات أخرى «أدمين» وتقرأ: «ابن عميناداب، ابن أرام».'
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: ابن
  rationale: أداة التعريف المضافة المتكررة موجزة في سياق النسب، وتحمل معنى «ابن» من الصيغة السابقة؛ وإظهاره بالعربية يجعل سلسلة النسب طبيعية وواضحة.
- source_word: Ἀμιναδάβ
  choice: عميناداب
  rationale: الصيغة العربية الكتابية المألوفة للاسم السامي، وهي أوضح للقارئ من النقل الحرفي للصيغة اليونانية.
- source_word: Ἀδμίν
  choice: أدمين
  rationale: نقل مباشر للاسم اليوناني الوارد في نص SBLGNT، مع إبقاء اختلاف المخطوطات في الحاشية.
- source_word: Ἀρνί
  choice: أرني
  rationale: نقل قراءة SBLGNT كما هي، دون استبدالها بقراءة «أرام»؛ وقد ذُكرت القراءة البديلة في الحاشية.
- source_word: Ἑσρώμ
  choice: حصرون
  rationale: الصيغة العربية المتداولة للاسم في العهد القديم، بما يحافظ على إمكان التعرف إلى الشخصية نفسها عبر الأسفار.
- source_word: Φαρές
  choice: فارص
  rationale: الصيغة العربية الكتابية المألوفة للاسم العبري، بدل نقل أكثر التصاقًا بالنطق اليوناني.
- source_word: Ἰούδα
  choice: يهوذا
  rationale: الصيغة العربية المعهودة لاسم السبط والجد في سياق أنساب العهد القديم.
