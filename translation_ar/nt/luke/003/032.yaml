  text: ابن يسى، ابن يوبيل[أ]، ابن بوعز، ابن سالا، ابن نحشون،
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'يقرأ النص اليوناني هنا «يوبيل»؛ وتقرأ السلسلة الموازية في راعوث 4: 21 «عوبيد».'
    reason: لتوضيح اختلاف الاسم مع الحفاظ على قراءة المصدر اليوناني في المتن.
lexical_decisions:
- source_word: Ἰεσσαί
  choice: يَسَّى
  rationale: الصيغة العربية الكتابية الشائعة لاسم يسى، مع الحفاظ على تسلسل النسب.
- source_word: Ἰωβήλ
  choice: عُوبِيدَ
  rationale: يمثل الاسم الوارد في هذا الموضع من سلسلة النسب، وهو المقابل العربي المألوف لعوبيد؛ وتبدو قراءة Ἰωβήλ في النص اليوناني تهجئة مختلفة للاسم.
- source_word: Βόος
  choice: بُوعَزَ
  rationale: المقابل العربي المألوف للاسم المعروف في سلسلة النسب الكتابية.
- source_word: Σαλά
  choice: سَالَا
  rationale: نقل صوتي مباشر للاسم كما يرد في النص اليوناني، من غير تصحيح ضمني إلى اسم آخر.
- source_word: Ναασσών
  choice: نَحْشُونَ
  rationale: المقابل العربي المألوف للاسم العبري الذي يمثله الشكل اليوناني.
- source_word: τοῦ
  choice: بْنِ
  rationale: في سياق سلسلة النسب، تفيد أداة الإضافة المتكررة علاقة البنوة، ويعبّر عنها العربية طبيعيًا بتكرار «بن».
theological_decisions:
- issue: هوية الاسم Ἰωβήλ وتهجئته
  choice: عُوبِيدَ
  alternative: يُوبِيلَ/يوبيل
  rationale: سياق النسب الموازي لسلسلة راعوث وداود يدل على عوبيد، لكن لا تُضاف حاشية لأن الاختلاف هنا اسمي نصي لا يحمل ضرورة تفسيرية في نص الآية.
- issue: هوية Σαλά
  choice: سَالَا
  alternative: سَلْمُونَ
  rationale: حُفظت الصيغة التي يشهد لها النص اليوناني المعطى بدل مواءمتها لاهوتيًا أو تاريخيًا مع سلسلة نسب أخرى.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة، تلائم كون العبارة جزءًا متصلًا من سلسلة نسب. استُعملت الكسرة في «بْنِ» للدلالة على الإضافة، مع ضبط الأسماء لتيسير القراءة.
