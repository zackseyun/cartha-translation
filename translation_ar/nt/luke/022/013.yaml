  text: ἀπελθόντες δὲ εὗρον καθὼς ⸀εἰρήκει αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: ar
  text: فذهبا ووجدا الأمر كما كان قد قال لهما، وأعدّا الفصح.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وجبة الفصح»، أو «حمل الفصح». يمكن أن يشير اللفظ اليوناني إلى الاحتفال بالفصح عمومًا، أو إلى وجبته أو ذبيحته على نحو أخص.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες δὲ
  choice: فذهبا
  rationale: اسم الفاعل الأُحادي يدل على فعل سابق للفعل الرئيس، وδέ رابط سردي خفيف؛ وصيغة الفعل المعطوف بالفاء تنقل التتابع والنتيجة بأسلوب عربي طبيعي.
- source_word: εὗρον
  choice: وجدا الأمر
  rationale: الفعل يعني «وجدا»، ومفعوله مفهوم من السياق، أي الحال أو الترتيبات التي وصفها يسوع. وإضافة «الأمر» توضح المحذوف من غير تضييق معناه إلى شيء بعينه.
- source_word: καθὼς εἰρήκει αὐτοῖς
  choice: كما كان قد قال لهما
  rationale: καθώς تفيد المطابقة، وصيغة الماضي التام في εἰρήκει تشير إلى قول سابق؛ و«كان قد قال» تحافظ على هذا التسلسل الزمني. ضمير التثنية يلائم بطرس ويوحنا في السياق السابق.
- source_word: ἡτοίμασαν
  choice: أعدّا
  rationale: ينقل معنى التهيئة والإعداد بإيجاز، مع استعمال التثنية بحسب مرجع الفاعل في السياق.
- source_word: τὸ πάσχα
  choice: الفصح
  rationale: «الفصح» هو المقابل العربي المألوف لـπάσχα، ويحافظ على سعة اللفظ الذي قد يدل على الاحتفال أو وجبته أو ذبيحته دون حسم المقصود في المتن.
theological_decisions:
- issue: مدى دلالة πάσχα في السياق
  choice: الفصح
  alternative: وجبة الفصح؛ أو حمل الفصح
  rationale: اللفظ اليوناني واسع الدلالة، وقد يشير إلى الاحتفال أو الوجبة أو العنصر الذبائحي. إبقاء «الفصح» في المتن يصون هذا الاتساع، بينما تعرض الحاشية الاحتمالات الأخص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت صيغة التثنية لأن السياق يحدد المرسلين بأنهما بطرس ويوحنا، مع الحفاظ على إيجاز السرد واتساع دلالة «الفصح».
