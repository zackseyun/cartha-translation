  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: ar
  text: ونشأ بينهم أيضًا نزاعٌ حول مَن منهم يُعَدّ أعظم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يبدو أعظم». يمكن أن يعني الفعل اليوناني «يبدو» أو «يُعَدّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: نشأ
  rationale: يفيد هنا حدوث وضع جديد وبروز النزاع، و«نشأ» تعبير عربي طبيعي موجز.
- source_word: δὲ
  choice: —
  rationale: أُبقيت قوة الانتقال السردي ضمن ترتيب الجملة من غير إضافة رابط قد يوحي بتعارض أقوى مما في الأصل.
- source_word: καὶ
  choice: أيضًا
  rationale: تحفظ القوة الإضافية للكلمة اليونانية.
- source_word: φιλονεικία
  choice: نزاع
  rationale: ينقل معنى الخصومة والجدال التنافسي بلغة عربية واضحة، من غير تضخيمه إلى شجار عنيف.
- source_word: ἐν αὐτοῖς
  choice: بينهم
  rationale: تعبير عربي طبيعي يدل على أن النزاع وقع داخل الجماعة.
- source_word: τὸ τίς αὐτῶν
  choice: حول مَن منهم
  rationale: ينقل مضمون النزاع بوصفه سؤالًا غير مباشر.
- source_word: δοκεῖ
  choice: يُعَدّ
  rationale: يعبر عن معنى التقدير أو الاعتبار الاجتماعي، مع إثبات البديل «يبدو» في الحاشية حفاظًا على الاحتمال المعجمي.
- source_word: εἶναι
  choice: —
  rationale: مدلول فعل الكينونة مندمج طبيعيًا في التركيب العربي «يُعَدّ أعظم».
- source_word: μείζων
  choice: أعظم
  rationale: تحفظ صيغة المقارنة اليونانية ولا تحولها صراحة إلى صيغة تفضيل جماعية مثل «الأعظم بينهم».
theological_decisions:
- issue: لغة المكانة بين التلاميذ
  choice: أعظم
  alternative: الأعظم / أهم
  rationale: الأصل يستعمل صيغة المقارنة μείζων، ولذلك تُحفظ المقارنة من غير تحويلها إلى صيغة تفضيل صريحة أو تفسيرها بأنها مجرد أهمية.
- issue: دلالة δοκεῖ
  choice: يُعَدّ
  alternative: يبدو
  rationale: السياق يرجح تقدير المكانة داخل الجماعة، لكن الفعل يحتمل أيضًا معنى الظهور أو الانطباع؛ لذا لم يُطمس البديل ووُضع في حاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «مَن» للسؤال عن الأشخاص، وحُفظت دلالة المقارنة والاحتمال المعجمي من غير تسوية تفسيرية.
