  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: ar
  text: لكن من الآن فصاعدًا سيكون ابن الإنسان جالسًا عن يمين قوة الله.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: من الآن فصاعدًا
  rationale: تعبير عربي طبيعي يحفظ ابتداء الحالة المعلنة من الزمن الحاضر وامتدادها إلى ما بعده.
- source_word: δὲ
  choice: لكن
  rationale: تفيد هنا انتقالًا ذا مسحة مقابلة في جواب يسوع، و«لكن» تنقل هذه الدلالة بوضوح.
- source_word: ἔσται
  choice: سيكون
  rationale: ينقل مستقبل فعل الكينونة مباشرة، من غير تحويله إلى معنى الصيرورة.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحفظ اللقب كما هو وصِلته بالنصوص النبوية والرؤيوية، من غير تفسير هويته داخل الترجمة.
- source_word: καθήμενος
  choice: جالسًا
  rationale: يصف هيئة الجلوس المرتبطة هنا بالتتويج والسلطان، مع إبقاء الصورة الأصلية مباشرة ومفهومة.
- source_word: ἐκ δεξιῶν
  choice: عن يمين
  rationale: التعبير الكتابي العربي المألوف للمكان الدال على الكرامة والسلطان، ويحفظ صدى مزمور 110.
- source_word: τῆς δυνάμεως
  choice: قدرة
  rationale: تنقل معنى القوة والاقتدار، وتلائم الإضافة إلى الله من غير تحويل الاسم العام صراحةً إلى لقب إلهي.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: إضافة صريحة تحدد أن القدرة لله، وفق تركيب النص اليوناني.
theological_decisions:
- issue: صيغة تمجيد ابن الإنسان ودعوى السلطان الإلهي
  choice: سيكون ابن الإنسان جالسًا عن يمين قدرة الله
  alternative: سيجلس ابن الإنسان عن يمين قوة الله
  rationale: تحفظ الصياغة صورة الجلوس في موضع الكرامة والسلطان، مع أصداء مزمور 110 ودانيال 7، من غير شرح لاهوتي زائد أو تخفيف لقوة الدعوى.
- issue: احتمال استعمال «القدرة» تعبيرًا توقيريًا عن الله
  choice: قدرة الله
  alternative: القدرة
  rationale: يُبقي المتن الإضافة الصريحة «الله» الموجودة في اليونانية، بينما تُذكر في الحاشية القراءة التي تفهم «القدرة» تعبيرًا توقيريًا عن الله.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «من الآن فصاعدًا» لطبيعته في العربية، وحُفظت العبارة الكتابية «ابن الإنسان» وصورة الجلوس «عن يمين» من غير تفكيكها بتفسير داخل المتن.
