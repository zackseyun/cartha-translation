  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: ar
  text: وإذ صار في كرب شديد، كان يصلّي بإلحاح أشد[a]؛ وصار عرقه كقطرات دم[b] تتساقط على الأرض.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «باجتهاد أشد» أو «بحرارة أشد».'
