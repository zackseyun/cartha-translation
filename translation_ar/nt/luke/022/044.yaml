  - marker: b
    text: 'اليونانية: «كقطرات/خثرات دم»؛ فالعبارة تحافظ على التشبيه ولا تقرر صراحة أن العرق نفسه كان دمًا.'
    reason: lexical_alternative
  - marker: c
    text: تحذف بعض المخطوطات لوقا 22:43–44، بينما تثبتهما مخطوطات أخرى. ويطبعهما نص SBLGNT بين قوسين معقوفين للدلالة على عدم اليقين النصي.
    reason: textual_variant
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: وإذ صار في كرب شديد
  rationale: ينقل معنى الدخول في حال من الصراع والضيق الشديدين، مع الحفاظ على دلالة γενόμενος دون جعل العبارة جامدة.
- source_word: ἐκτενέστερον
  choice: بحرارة أشد
  rationale: يحفظ صيغة المقارنة ويدل على ازدياد شدة الصلاة واستغراقها، بلغة عربية طبيعية.
- source_word: προσηύχετο
  choice: أخذ يصلّي
  rationale: يعكس الاستمرار الذي تفيده صيغة الماضي الناقص في اليونانية.
- source_word: ἐγένετο ὁ ἱδρὼς αὐτοῦ
  choice: وصار عرقه
  rationale: يحفظ القوة الفعلية لـἐγένετο بوصفها دالة على صيرورة أو حال ناتجة.
- source_word: ὡσεὶ θρόμβοι αἵματος
  choice: كقطرات دم
  rationale: تحافظ الكاف على التشبيه الصريح في ὡσεὶ، وتؤدي «قطرات» الصورة الطبيعية في السياق، مع بيان احتمال «كتل/خثرات» في الحاشية.
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: تتساقط على الأرض
  rationale: صياغة عربية طبيعية تنقل الحركة إلى أسفل ووصول القطرات إلى الأرض.
theological_decisions:
- issue: طبيعة التشبيه في عبارة «كقطرات دم»
  choice: 'الإبقاء على التشبيه: كان العرق كقطرات دم.'
  alternative: التصريح بأن العرق نفسه كان دمًا.
  rationale: الأداة اليونانية ὡσεὶ تدل صراحة على المشابهة، فلا ينبغي للترجمة أن تحوّلها إلى تقرير هوية أو إلى دعوى طبية أو إعجازية لا يصرح بها النص.
- issue: موثوقية إدراج العدد ضمن النص
  choice: إدراج العدد مع حاشية توضّح عدم اليقين النصي.
  alternative: حذف العدد من المتن.
  rationale: مصدر SBLGNT يطبع لوقا 22:43–44 بين علامتي شك نصي، ولذلك يُحفظ النص المقدم مع تنبيه القارئ إلى اختلاف المخطوطات.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير «كرب شديد» لتجنب غرابة «في عذاب» مع إبقاء وطأة ἀγωνία، واختير «بحرارة أشد» لصياغة طبيعية تحفظ المقارنة. وُضعت علامات الحواشي [a] و[b] و[c] جميعها في المتن.
