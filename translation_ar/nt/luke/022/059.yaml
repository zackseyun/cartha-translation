lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: وبعد نحو ساعة
  rationale: ينقل التركيب المطلق في المضاف إليه مرور مدة تقارب الساعة بصياغة عربية طبيعية وموجزة.
- source_word: ἄλλος τις
  choice: شخص آخر
  rationale: يحافظ على تنكير التعبير اليوناني وعدم تحديد جنس المتكلم صراحة، بدل تقييده بكلمة «رجل».
- source_word: διϊσχυρίζετο
  choice: أخذ ... يؤكِّد
  rationale: ينقل قوة الإصرار التي في الفعل، كما تعكس صيغة الماضي الناقص طابعه المستمر في ذلك الموقف.
- source_word: Ἐπ’ ἀληθείας
  choice: حقًّا
  rationale: تعبير عربي واضح يفيد التوكيد القوي على صدق القول.
- source_word: οὗτος
  choice: هذا
  rationale: يحفظ الإشارة المباشرة إلى بطرس وما فيها من نبرة اتهامية محتملة، من دون إضافة اسم غير موجود في الأصل.
- source_word: μετ’ αὐτοῦ ἦν
  choice: كان ... معه
  rationale: ترجمة مباشرة تحفظ معنى المصاحبة من غير تفسير زائد لطبيعة الارتباط.
- source_word: καὶ γὰρ
  choice: فهو أيضًا
  rationale: الفاء تبيّن التعليل، و«أيضًا» تنقل دلالة καί الإضافية.
- source_word: Γαλιλαῖός ἐστιν
  choice: جليليّ
  rationale: ينقل النسبة الإقليمية بصياغة عربية مباشرة وطبيعية.
