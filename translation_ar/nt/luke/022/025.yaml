  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: ar
  text: 'فقال لهم: «إن ملوك الأمم[a] يتسلّطون عليهم، والذين يمارسون السلطة عليهم يُدعون «محسنين»[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير «الأمم» هنا إلى الشعوب غير اليهودية.
    reason: lexical_alternative
  - marker: b
    text: كان «المحسنون» لقبًا تشريفيًا يُطلق على الحكام أو أصحاب النفوذ الذين كان يُنظر إليهم على أنهم يقدمون منافع عامة.
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: ملوك
  rationale: يحافظ على الدلالة السياسية المحددة للاسم اليوناني، بدل تعميمه إلى «حكام».
- source_word: τῶν ἐθνῶν
  choice: الأمم
  rationale: تعبير عربي كتابي واضح يحفظ مجال اللفظة بين معنى الشعوب عمومًا والإشارة في السياق إلى غير اليهود، مع بيان ذلك في الحاشية.
- source_word: κυριεύουσιν
  choice: يتسلّطون
  rationale: ينقل معنى ممارسة السيادة بقوة، ويلائم المقابلة التي يقيمها يسوع بين نمط الحكم الدنيوي ونمط القيادة بين تلاميذه.
- source_word: ἐξουσιάζοντες
  choice: الذين يمارسون السلطة
  rationale: صياغة فعلية تحفظ معنى المشاركة اليونانية بوصفها ممارسة فعلية للسلطة، لا مجرد شغل منصب.
- source_word: εὐεργέται
  choice: محسنين
  rationale: المقابل العربي الموجز لمعنى صانعي الخير، مع توضيح استعمال الكلمة كلقب تشريفي في الحاشية.
- source_word: καλοῦνται
  choice: يُدعون
  rationale: ينقل المبني للمجهول ودلالة الاسم أو اللقب الذي يُطلق عليهم.
- source_word: δὲ
  choice: فقال
  rationale: الفاء تربط القول بالسياق السابق ربطًا طبيعيًا في العربية، بينما يفهم التقابل من مضمون جواب يسوع.
theological_decisions:
- issue: دلالة ἐθνῶν في السياق
  choice: الأمم
  alternative: غير اليهود
  rationale: «الأمم» تحافظ على الاتساع المعجمي للفظة اليونانية، في حين توضح الحاشية أن المقصود المحتمل في سياق لوقا هو الشعوب غير اليهودية، من غير حسم ما يحتمله النص بصمت.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «يتسلّطون» لإظهار قوة κυριεύουσιν، ووُضعت علامتا الحاشيتين بعد اللفظتين اللتين تشرحهما كل حاشية مباشرة.
