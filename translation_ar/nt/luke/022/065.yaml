lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل هذه الجملة بما سبق من إساءة، وهو الأنسب للسياق السردي.
- source_word: ἕτερα πολλὰ
  choice: أقوالًا أخرى كثيرة
  rationale: ينقل معنى الكثرة والإضافة إلى ما سبق، مع إظهار المفعول المفهوم من السياق بصياغة عربية طبيعية.
- source_word: βλασφημοῦντες
  choice: فيها تجديف
  rationale: يحفظ قوة الفعل اليوناني الدال على الكلام المشين أو التجديفي، ويصوغه على نحو طبيعي مع فعل القول، من غير حصر معناه المعجمي في مجرد الشتيمة.
- source_word: ἔλεγον
  choice: كانوا يقولون
  rationale: صيغة «كانوا يقولون» تنقل دلالة الماضي الناقص على الفعل المستمر أو المتكرر.
- source_word: εἰς αὐτόν
  choice: عليه
  rationale: يفيد توجيه الكلام العدائي ضده في هذا السياق، وهو تعبير عربي موجز وطبيعي.
theological_decisions:
- issue: مدى الاحتفاظ بالقوة اللاهوتية للفعل βλασφημέω
  choice: فيها تجديف
  alternative: فيها إهانة أو إساءة
  rationale: اختير «تجديف» لأنه يحفظ كامل قوة اللفظ اليوناني، مع إثبات البدائل الأوسع دلالة في الحاشية حتى لا يُطمس اتساع المجال المعجمي أو يُحسم بما يتجاوز النص.
