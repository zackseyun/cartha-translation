    text: 'أو: «وهم يوجّهون إليه إهانات كثيرة أخرى» أو «وهم يسيئون إليه بأشياء كثيرة أخرى». قد يدل الفعل اليوناني على التجديف أو الكلام الشاتم والمسيء بوجه أعم.'
