base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: ar
  text: 'فقال لهم: «أمّا الآن، فمن له كيس نقود فليأخذه، وكذلك حقيبة سفر[a]؛ ومن لا سيف له فليبع رداءه ويشترِ سيفًا[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة πήρα: «جراب» أو «مزود».'
    reason: lexical_alternative
  - marker: b
    text: قد تدل الكلمة اليونانية μάχαιρα أيضًا على نصل أقصر، مثل خنجر أو سيف قصير.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: أمّا الآن
  rationale: تُبرز المقابلة القوية مع التعليمات السابقة، وتحافظ على الدلالة الزمنية من غير زيادة تفسيرية.
- source_word: ὁ ἔχων
  choice: مَن له
  rationale: صياغة عامة طبيعية في العربية تحافظ على معنى اسم الفاعل المعرّف من غير تقييد غير لازم بالجنس.
- source_word: βαλλάντιον
  choice: كيس نقود
  rationale: يدل اللفظ على وعاء لحمل المال، وهذه العبارة واضحة للقارئ الحديث.
- source_word: ἀράτω
  choice: فليأخذه
  rationale: تحافظ صيغة الأمر على معنى الأخذ أو الاصطحاب في سياق الاستعداد للسفر.
- source_word: ὁμοίως καὶ πήραν
  choice: وكذلك حقيبة سفر
  rationale: تنقل ὁμοίως بلفظ «كذلك»، وتوضح وظيفة πήρα بوصفها حقيبة يحملها المسافر مع إبقاء البدائل في الحاشية.
- source_word: ὁ μὴ ἔχων
  choice: ومن ليس له
  rationale: تحافظ العبارة على الإيجاز والحذف الموجودين في اليونانية بدل تعيين مفعول غير مصرّح به.
- source_word: πωλησάτω τὸ ἱμάτιον αὐτοῦ
  choice: فليبع رداءه
  rationale: «رداء» مقابل عربي طبيعي للثوب الخارجي، وصيغة «فليبع» تنقل الأمر مباشرة.
- source_word: ἀγορασάτω μάχαιραν
  choice: ويشترِ سيفًا
  rationale: تنقل الأمر والاسم نقلاً مباشرًا، من غير تضييق مدلول μάχαιρα إلى نوع محدد من النصال.
theological_decisions:
- issue: هل ينبغي تلطيف الأمر بشراء السيف أو تفسيره مجازيًا داخل الترجمة؟
  choice: 'الإبقاء على الأمر المباشر: «ويشترِ سيفًا»'
  alternative: صياغته بمعنى الاستعداد المجازي للخطر أو استبدال «سيف» بلفظ عام مثل «سلاح»
  rationale: النص اليوناني يستعمل μάχαιρα وصيغة أمر صريحة؛ لذلك تُحفظ قوة العبارة والتوتر التفسيري من غير إدخال موقف عقائدي من العنف أو المجاز في متن الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغ الأمر العربية المباشرة، وحُفظ الحذف في «ومن ليس له» كما في اليونانية، ووُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما.
