lexical_decisions:
- source_word: ἐχάρησαν
  choice: فرحوا
  rationale: ينقل الفعل اليوناني استجابتهم العاطفية القوية بصياغة عربية طبيعية وفصيحة، من غير إضافة معنى غير مصرح به.
- source_word: συνέθεντο
  choice: اتفقوا معه
  rationale: صيغة الفعل المتوسطة هنا تدل على التوصل إلى اتفاق مع شخص؛ ولفظ «اتفقوا» موجز وطبيعي، أما «وعدوا» فأضيق دلالة وأكثر تفسيرًا.
- source_word: αὐτῷ
  choice: معه ... يعطوه
  rationale: الضمير يعود إلى يهوذا في السياق. اقترانه بـ«اتفقوا» يُصاغ طبيعيًا «معه»، ثم يظهر بوصفه المفعول غير المباشر في «يعطوه».
- source_word: ἀργύριον
  choice: مالًا
  rationale: مع أن اللفظ يعني حرفيًا «فضة»، فإنه يُستعمل في سياق المعاملات بمعنى المال. «مالًا» أوضح للقارئ الحديث، مع حفظ البديل الحرفي في الحاشية.
- source_word: δοῦναι
  choice: أن يعطوه
  rationale: المصدر يبيّن مضمون الاتفاق، و«أن يعطوه» يقابل معنى «أن يعطوا له» بصورة عربية سليمة، من غير تفسيره على أنه «يدفعوا له».
