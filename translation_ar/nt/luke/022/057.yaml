  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: ar
  text: 'فَأَنْكَرَ قَائِلًا: «لَا أَعْرِفُهُ، يَا امْرَأَةَ[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «يا امرأة» ترجمة مباشرة للمنادى اليوناني γύναι، وهو خطاب موجَّه إلى امرأة. أما «يا سيدتي» فتضيف تلطيفًا غير مصرَّح به في الأصل.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσατο
  choice: أَنْكَرَ
  rationale: الفعل يعني أنكر أو نفى. واستعمال «أنكر» دون مفعول به يحافظ على عدم ذكر اليونانية لمفعول صريح، وهو سائغ في العربية لأن مضمون الإنكار يأتي بعده.
- source_word: λέγων
  choice: قَائِلًا
  rationale: يحافظ اسم الفاعل المنصوب على الصلة الحالية في النص اليوناني، ويقدّم مضمون الإنكار بعبارة عربية طبيعية.
- source_word: Οὐκ οἶδα
  choice: لَا أَعْرِفُ
  rationale: ترجمة مباشرة وواضحة لفعل المعرفة المنفي، ملائمة للسياق وللفصحى المعاصرة.
- source_word: αὐτόν
  choice: ـهُ
  rationale: ضمير الغائب يعود مباشرة إلى يسوع، ولا مبرر لتوسيعه إلى «هذا الرجل».
- source_word: γύναι
  choice: يَا امْرَأَةُ
  rationale: ينقل المنادى اليوناني بصورته المباشرة دون تلطيف تفسيري مثل «يا سيدتي».
theological_decisions:
- issue: هل يُذكر مفعول صريح لإنكار بطرس؟
  choice: تُرك «أَنْكَرَ» بلا مفعول صريح
  alternative: فأنكر ذلك / فأنكره
  rationale: لا يذكر النص اليوناني مفعولًا للفعل. والعربية تسمح بحذف المفعول مع بيان مضمون الإنكار بعد «قائلًا»، وبذلك لا تُحسم دلالة الإنكار أهو إنكار للقول الموجَّه إليه أم تنصّل مباشر من يسوع.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُعملت «فـ» لربط الرد بالسياق، وحُفظ الإيجاز والتوتر في جواب بطرس. وُضع marker الحاشية في المتن كما هو مطلوب.
