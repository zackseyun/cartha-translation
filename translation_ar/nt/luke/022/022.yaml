base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: ar
  text: لأن ابن الإنسان يمضي وفقًا لما قد تقرَّر، ولكن الويل لذلك الإنسان الذي على يده يُسلَّم![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي على يده يُخان». يمكن أن يعني الفعل اليوناني «يُسلَّم» أو «يُخان» بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تربط الآية بما قبلها بوصفها تعليلًا، وهو الاستعمال الأنسب هنا.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: الصياغة العربية الراسخة لهذا اللقب، وتحفظ صداه الكتابي.
- source_word: μέν ... πλὴν
  choice: '... ولكن'
  rationale: تحفظ المقابلة بين سير ابن الإنسان بحسب ما تقرر وبين الويل الواقع على من يسلّمه، من غير إثقال العبارة بترجمة مستقلة لـμέν.
- source_word: κατὰ τὸ ὡρισμένον
  choice: وفقًا لما قد تقرَّر
  rationale: تحفظ معنى المطابقة لتقرير سابق وصيغة المجهول، من غير إضافة فاعل غير مذكور صراحة.
- source_word: πορεύεται
  choice: يمضي
  rationale: تعبير عربي طبيعي يدل على مواصلة المسار المقصود، وفي السياق مسيره نحو الموت.
- source_word: οὐαὶ
  choice: الويل
  rationale: يحفظ قوة إعلان الويل النبوي بما قد يتضمنه من رثاء ودينونة.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: لذلك الإنسان
  rationale: ينقل الإشارة إلى شخص بعينه بلفظ مطابق للاسم اليوناني، من غير الحاجة إلى تفسير هويته داخل النص.
- source_word: δι’ οὗ
  choice: الذي على يده
  rationale: صياغة عربية مألوفة تحفظ معنى الوساطة أو الوكالة الذي تؤديه διά مع المضاف إليه.
- source_word: παραδίδοται
  choice: يُسلَّم
  rationale: يحفظ المعنى الأساسي للفعل وصيغة المبني للمجهول، ويتلاءم مع موضوع تسليم يسوع دون حصر اللفظ في معنى الخيانة وحده.
theological_decisions:
- issue: العلاقة بين التقرير السابق ومسؤولية الإنسان
  choice: الإبقاء معًا على أن مسير ابن الإنسان يجري وفق ما قد تقرر، وأن الويل معلن على الإنسان الذي على يده يُسلَّم.
  alternative: تلطيف معنى التقرير السابق، أو تلطيف مسؤولية من يسلّمه.
  rationale: النص اليوناني يضع الأمرين جنبًا إلى جنب ولا يحل التوتر بينهما؛ لذلك تحفظهما الترجمة دون فرض إطار لاهوتي معين.
- issue: الفاعل الضمني في «ما قد تقرر»
  choice: الإبقاء على صيغة المجهول دون تسمية من قرر.
  alternative: «وفقًا لما قرره الله».
  rationale: السياق قد يدل على الترتيب الإلهي، لكن اليونانية لا تصرّح بالفاعل، فالأدق عدم إضافته إلى المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «يمضي» بدل تعبير حرفي أثقل، وحُفظت صيغة المجهول والغموض المقصود في الفاعل، مع إبراز المقابلة الطبيعية بواسطة «ولكن».
