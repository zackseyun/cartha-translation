  text: καὶ ἐξωμολόγησεν, καὶ ἐζήτει εὐκαιρίαν τοῦ παραδοῦναι αὐτὸν ⸂ἄτερ ὄχλου αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: ar
  text: فوافق، وأخذ يبحث عن فرصة ليسلّمه إليهم بعيدًا عن الجموع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في غياب الجمع».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: فوافق
  rationale: يفيد الفعل هنا، في ضوء عرض رؤساء الكهنة في السياق السابق، قبول يهوذا واتفاقه معهم، لا معنى الاعتراف الشائع في سياقات أخرى.
- source_word: ἐζήτει
  choice: وأخذ يبحث
  rationale: صيغة الماضي الناقص تدل على فعل متواصل أو على الشروع فيه؛ و«أخذ يبحث» تنقل تطور الحدث واستمرار السعي بلغة عربية طبيعية.
- source_word: εὐκαιρίαν
  choice: عن فرصة
  rationale: تنقل معنى الوقت أو الظرف الملائم لتنفيذ الفعل بإيجاز ووضوح.
- source_word: τοῦ παραδοῦναι αὐτόν
  choice: ليسلّمه
  rationale: يحافظ «يسلّمه» على المعنى المباشر للفعل παραδίδωμι وعلى اتساقه في رواية الآلام، من غير أن يفرض منذ البداية التفسير السياقي «يخونه».
- source_word: ἄτερ ὄχλου
  choice: بعيدًا عن الجموع
  rationale: يفيد أن التسليم المطلوب سيكون في غياب جمهور الناس؛ وجاء الجمع «الجموع» طبيعيًا في العربية للإشارة إلى الحشود، مع أن اليونانية تستعمل اسم جمع مفردًا.
- source_word: αὐτοῖς
  choice: إليهم
  rationale: تبيّن أن المذكورين سابقًا، أي رؤساء الكهنة وقادة حرس الهيكل، هم متلقو التسليم.
theological_decisions:
- issue: هل يُترجم παραδοῦναι بمعنى التسليم أم الخيانة؟
  choice: ليسلّمه
  alternative: ليخونه
  rationale: «يسلّمه» أقرب إلى الدلالة المعجمية ويحفظ الترابط اللفظي في رواية الآلام، بينما «يخونه» تفسير صحيح سياقيًا لكنه يصرّح بدلالة أخلاقية ضمنية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «أخذ يبحث» لإبراز بدء السعي واستمراره، و«بعيدًا عن الجموع» لتقديم صياغة طبيعية لمعنى غياب الحشد.
