  text: Καὶ οἱ ἄνδρες οἱ συνέχοντες ⸀αὐτὸν ἐνέπαιζον αὐτῷ δέροντες,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: ar
  text: وكان الرجال الذين يحتجزونه يسخرون منه وهم يضربونه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين يمسكون به».'
    reason: بديل معجمي يحفظ المعنى الحسي المباشر للفعل συνέχω، في حين يبرز المتن دلالة الاحتجاز في السياق.
lexical_decisions:
- source_word: Καὶ
  choice: وكان
  rationale: تربط الواو الآية بسياق السرد، ويجعل استعمال «كان» الجملة طبيعية بالعربية مع الأفعال المستمرة في الماضي.
- source_word: οἱ ἄνδρες
  choice: الرجال
  rationale: يحافظ على اللفظ العام في اليونانية من غير تضييقه إلى «الحرس» أو «الجنود».
- source_word: οἱ συνέχοντες αὐτόν
  choice: الذين يحتجزونه
  rationale: يدل الفعل هنا على إبقاء يسوع تحت السيطرة أو الحراسة؛ و«يحتجزونه» واضح وطبيعي ويحفظ معنى الإمساك به في هذا السياق.
- source_word: ἐνέπαιζον αὐτῷ
  choice: يسخرون منه
  rationale: ينقل معنى الاستهزاء العدائي، كما أن «يسخرون منه» هو التركيب العربي المألوف.
- source_word: δέροντες
  choice: وهم يضربونه
  rationale: ينقل الضرب الجسدي بوصفه فعلًا مصاحبًا ومستمرًا، من غير تخصيصه بالجلد.
theological_decisions:
- issue: تحديد هوية الذين أساؤوا إلى يسوع
  choice: الرجال الذين يحتجزونه
  alternative: الحرس الذين يحتجزونه
  rationale: النص اليوناني يقول «الرجال» ولا يحدد وظيفتهم، لذلك لا تُضاف هوية أضيق اعتمادًا على السياق وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة؛ الصياغة تحافظ على تتابع السرد وعلى تزامن السخرية والضرب، من غير إضافة تحديد مهني للرجال أو نوع مخصوص من العقوبة.
