  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: ar
  text: 'قائلًا: «يا أبتِ، إن شئتَ، فأبعِد عني هذه الكأس[a]. ولكن لا تكن مشيئتي، بل لتكن مشيئتك[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«الكأس» صورة كتابية للنصيب المعيَّن، وكثيرًا ما تشير بوجه خاص إلى الألم أو الدينونة. ويمكن أيضًا ترجمة العبارة: «انزع عني هذه الكأس».'
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: 'أو: «لا يكن ما أريده أنا، بل ما تريده أنت».'
    reason: alternative_rendering
lexical_decisions:
- source_word: λέγων
  choice: قائلًا
  rationale: اسم فاعل حالي يقدّم مضمون صلاة يسوع ويحافظ على ارتباطها النحوي بما قبلها.
- source_word: Πάτερ
  choice: يا أبتِ
  rationale: نداء مباشر لله؛ وهذه صياغة عربية فصيحة واضحة تحفظ معنى الأبوة من غير زيادة.
- source_word: εἰ βούλει
  choice: إن شئتَ
  rationale: تنقل معنى الإرادة أو الرغبة في صيغة شرطية طبيعية وموجزة.
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: فأبعِد عني
  rationale: ينقل فعل الأمر ومعنى إزاحة الكأس بعيدًا عن المتكلم بصياغة عربية طبيعية.
- source_word: τοῦτο τὸ ποτήριον
  choice: هذه الكأس
  rationale: يحافظ على الصورة الكتابية المقصودة بدل تفسيرها داخل المتن بأنها ألم أو دينونة.
- source_word: πλὴν
  choice: ولكن
  rationale: تؤدي التحول الاستدراكي القوي من الطلب إلى الخضوع، بلغة عربية واضحة غير متكلفة.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: لا تكن مشيئتي، بل مشيئتك
  rationale: تحافظ على التعبير الاسمي والتقابل الصريح بين مشيئة يسوع ومشيئة الآب، مع إظهار المحذوف المفهوم في اليونانية.
- source_word: γινέσθω
  choice: تكن
  rationale: فعل أمر للغائب يفيد أن تتحقق المشيئة أو تصير نافذة؛ و«تكن» تلائم «مشيئتي/مشيئتك» وتحافظ على الإيجاز.
theological_decisions:
- issue: علاقة مشيئة يسوع بمشيئة الآب
  choice: لا تكن مشيئتي، بل مشيئتك
  alternative: لا يكن ما أريده أنا، بل ما تريده أنت
  rationale: يحفظ النص التمييز والتوتر اللاهوتي كما يوردهما الأصل، من غير تفسير عقائدي زائد أو تخفيف للتقابل.
- issue: الدلالة المجازية للكأس
  choice: الإبقاء على «هذه الكأس» في المتن
  alternative: هذا الألم أو هذه المحنة
  rationale: الصورة المجازية ذات صدى كتابي مهم، وتفسيرها داخل المتن سيحصر دلالتها ويزيل شيئًا من غناها.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. استُعمل «يا أبتِ» للنداء المباشر، وحُفظت صورة «الكأس» والتقابل بين المشيئتين من غير شرح مذهبي داخل المتن.
