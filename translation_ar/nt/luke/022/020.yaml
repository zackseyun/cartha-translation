  source_fidelity: 'النص ينقل عناصر اليونانية كلها بأمانة: «وكذلك» لـὡσαύτως، و«بعد العشاء» للتركيب الزمني، و«العهد الجديد في دمي» للعبارة المركزية. إضافة «أخذ» تملأ الحذف المفهوم من السياق السابق في تركيب عربي سليم، ولا تضيف معنى لاهوتيًا أو حدثًا غريبًا عن السياق. و«الذي يُسفك من أجلكم» يعبّر طبيعيًا عن المعنى المقصود، أي الدم المسفوك، مع التنبيه إلى موضع الالتباس التركيبي في الأصل.'
