  text: ⸄καὶ τὸ ποτήριον ὡσαύτως⸅ μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: ar
  text: 'وكذلك أخذ الكأس بعد العشاء وقال: «هذه الكأس هي العهد الجديد في دمي، الذي يُسفك من أجلكم[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تقع عبارة «الذي يُسفك من أجلكم» في اليونانية بعد الجملة كلها، وصيغتها يمكن أن توافق «الكأس» نحويًا؛ غير أن المعنى الأرجح في السياق هو أن دم يسوع هو الذي يُسفك من أجلهم.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ποτήριον
  choice: الكأس
  rationale: اللفظ العربي المألوف للإناء الذي يُشرب منه، من غير إدخال دلالة طقسية زائدة.
- source_word: ὡσαύτως
  choice: وكذلك
  rationale: يحفظ الصلة بالفعل السابق ويؤدي معنى المماثلة بعبارة عربية طبيعية.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: بعد العشاء
  rationale: ينقل التتابع الزمني بإيجاز ووضوح، والمقصود العشاء أو الوجبة المسائية المذكورة في السياق.
- source_word: λέγων
  choice: وقال
  rationale: تحويل اسم الفاعل اليوناني إلى فعل معطوف أنسب للسرد العربي ولا يغيّر علاقته بالفعل السابق.
- source_word: καινὴ διαθήκη
  choice: العهد الجديد
  rationale: «العهد» يحفظ الخلفية الكتابية لعهد يُقام بالدم، وهو أدق هنا من «الوصية».
- source_word: ἐν τῷ αἵματί μου
  choice: في دمي
  rationale: ترجمة قريبة من تركيب الأصل، تحفظ مجال دلالة حرف الجر من غير حسمه تفسيريا إلى «بواسطة دمي» أو «بدمي».
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: الذي يُسفك من أجلكم
  rationale: «يُسفك» هو التعبير العربي الطبيعي عن إراقة الدم، و«من أجلكم» تنقل معنى ὑπέρ النيابي أو النفعي من غير فرض صياغة مذهبية أضيق.
theological_decisions:
- issue: دلالة διαθήκη في سياق العشاء ودم العهد
  choice: العهد الجديد
  alternative: الوصية الجديدة
  rationale: السياق يستحضر إقامة العهد بالدم، ولذلك فـ«العهد» أوفى بالدلالة الكتابية من معنى الوصية القانونية.
- issue: مرجع العبارة τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: جعلها في المتن وصفا للدم
  alternative: ربطها بالكأس بحسب التجاور والتركيب النحوي اليوناني
  rationale: في اليونانية يمكن من جهة الصيغة المحايدة أن تتصل العبارة بـ«الكأس»، كما أن موضعها يأتي بعد الجملة كلها؛ لكن المعنى السياقي الأرجح هو أن الدم يُسفك. ولأن العربية لا تحفظ هذا الالتباس النحوي طبيعيا، أُثبت الوجه الأرجح في المتن ووُضح الأمر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. أُضيف الفعل «أخذ» المفهوم من «وكذلك» ومن الفعل السابق في السياق، لأن إبقاء التركيب اليوناني المحذوف الفعل ينتج عبارة مبتورة في العربية. حُفظ التعبير «في دمي» لقربه من الأصل، مع تجنب مصطلحات طقسية أو مذهبية زائدة.
