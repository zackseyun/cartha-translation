  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: ar
  text: لكن ها إن يدَ الذي يسلّمني معي على المائدة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: لكن
  rationale: تفيد هنا الاستدراك والانتقال إلى حقيقة صادمة، و«لكن» صياغة عربية واضحة وطبيعية.
- source_word: ἰδοὺ
  choice: ها إن
  rationale: تحافظ على وظيفة التنبيه والإبراز في الأصل، بعبارة عربية فصيحة مفهومة.
- source_word: τοῦ παραδιδόντος με
  choice: الذي يسلّمني
  rationale: اسم فاعل حاضر يفيد الفعل الجاري أو الوشيك؛ و«يسلّمني» يحافظ على معنى التسليم إلى أيدي الخصوم من غير حصره في لفظ تفسيري مثل «يخونني».
- source_word: μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: معي على المائدة
  rationale: نقل مباشر يحفظ صورة اليد المشتركة مع يسوع في المائدة ودلالة القرب أثناء الأكل.
theological_decisions:
- issue: دلالة παραδιδόντος
  choice: يسلّمني
  alternative: يخونني
  rationale: اختير اللفظ الأوسع والأقرب معجميًا إلى الأصل، لأنه يصوّر تسليم يسوع إلى خصومه ولا يختزل العبارة في توصيف أخلاقي وحده.
translation_notes:
  register: عربية فصحى حديثة، موجزة ومهيبة، مع الحفاظ على صورة «اليد» وعلى ترتيب عناصر الجملة بقدر تسمح به طبيعية العربية.
