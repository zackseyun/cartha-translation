  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: ar
  text: وضرب واحدٌ منهم عبدَ رئيس الكهنة، فقطع أذنه اليمنى.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خادم رئيس الكهنة». يمكن أن تدل الكلمة اليونانية δοῦλος على عبد أو خادم بحسب السياق.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: ضرب
  rationale: ينقل فعل πατάσσω بوصفه ضربة فعلية قوية، بلفظ عربي فصيح واضح غير متكلّف.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: واحدٌ منهم
  rationale: تعبير عربي طبيعي يحفظ التنكير وعدم ذكر هوية الفاعل في صياغة لوقا.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: عبدَ رئيس الكهنة
  rationale: لفظ «عبد» هو الأقرب إلى δοῦλος في دلالته الاجتماعية الحرفية، ولا يلطّف احتمال وضع الاستعباد إلى مجرد خدمة وظيفية.
- source_word: ἀφεῖλεν
  choice: قطع
  rationale: مع الأذن بوصفها مفعولًا به، يدل السياق على إبانتها بضربة؛ و«قطع» أوضح وأطبع من ترجمة عامة مثل «أزال».
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: أذنه اليمنى
  rationale: صياغة عربية طبيعية تحفظ تحديد العضو والجهة كما في النص اليوناني.
theological_decisions:
- issue: ترجمة δοῦλος
  choice: عبد
  alternative: خادم
  rationale: استُعملت «عبد» لأنها تحفظ الدلالة الاجتماعية المباشرة للفظ اليوناني وإمكان كونه مملوكًا، مع إثبات «خادم» في الحاشية بوصفها ترجمة سياقية محتملة دون حسم ما لا يصرّح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على تتابع الفعلين وعلى عدم تسمية الشخص الذي ضرب.
