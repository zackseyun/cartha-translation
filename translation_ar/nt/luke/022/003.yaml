base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: ar
  text: فدخل الشيطان في يهوذا، المدعوّ إسخريوطي، وكان من جملة الاثني عشر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: كان واحدًا من الاثني عشر. وحرفيًا: «كان من عدد الاثني عشر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: فدخل
  rationale: الفاء تلائم تقدّم السرد في العربية، و«دخل» مع «في» يحفظ معنى الدخول الصريح الذي تفيده صيغة الفعل مع εἰς.
- source_word: Σατανᾶς
  choice: الشيطان
  rationale: هو المقابل العربي المألوف للاسم أو اللقب في الاستعمال الكتابي، واضح للقارئ المعاصر.
- source_word: εἰς Ἰούδαν
  choice: في يهوذا
  rationale: يحفظ حرف الجر والتصوير الصريح لدخول الشيطان في يهوذا، من غير تخفيفه إلى مجرد التأثير فيه.
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: المدعوّ إسخريوطي
  rationale: صياغة عربية موجزة وطبيعية تؤدي وظيفة اسم المفعول اليوناني في تعريف يهوذا وتمييزه.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: وكان من جملة الاثني عشر
  rationale: «من جملة» تحافظ على دلالة الانتماء إلى المجموعة المعدودة في العبارة اليونانية، مع سلاسة عربية أفضل من النقل الحرفي «من عدد».
theological_decisions:
- issue: طبيعة فعل الشيطان في يهوذا
  choice: دخل الشيطان في يهوذا
  alternative: أثّر الشيطان في يهوذا / استولى الشيطان على يهوذا
  rationale: النص اليوناني يستعمل بوضوح εἰσῆλθεν مع εἰς، ولذلك تُحفظ قوة تعبير الدخول من غير تفسير إضافي لطبيعة الحدث أو حسم العلاقة بين فعل الشيطان ومسؤولية يهوذا.
- issue: تسمية جماعة الرسل
  choice: الاثني عشر
  alternative: الرسل الاثنا عشر / الاثنا عشر بحروف أو معالجة طباعية خاصة
  rationale: اليونانية تقول «الاثني عشر» فقط. تُحفظ التسمية المعروفة من غير إدخال لفظ «الرسل» غير الموجود في الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «المدعوّ» للتعريف، و«من جملة الاثني عشر» للجمع بين قربها من تركيب الأصل وطبيعية الأسلوب. وُضع مؤشر الحاشية بعد العبارة التي يشرحها.
