  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: ar
  text: أمّا أنتم فلا تكونوا هكذا[a]، بل ليصِرِ الأكبر بينكم كالأصغر[b]، والقائد كالذي يخدم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمّا أنتم فليس الأمر هكذا بينكم». العبارة اليونانية موجزة، وتضع تلاميذ يسوع في مقابلة حادة مع نمط السعي إلى المكانة المذكور قبلها.'
    reason: alternative_reading
  - marker: b
    text: لا تشير عبارة «الأصغر» هنا إلى الأقل سنًّا فحسب، بل إلى من هو أدنى منزلة اجتماعية أيضًا.
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: أمّا أنتم فلا تكونوا هكذا
  rationale: ينقل المقابلة المؤكدة والعبارة اليونانية الموجزة، ويُظهر أن المقصود رفض نمط طلب المكانة المذكور في السياق السابق.
- source_word: ἀλλ’
  choice: بل
  rationale: أداة استدراك طبيعية وقوية تمهّد للتوجيه الإيجابي المقابل.
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: الأكبر بينكم
  rationale: يحافظ على صيغة المقارنة وعلى دلالة علو المكانة داخل الجماعة، من غير تحويلها إلى صيغة التفضيل القصوى أو إلى منصب مؤسسي.
- source_word: γινέσθω
  choice: ليصِرِ
  rationale: يحفظ معنى الصيرورة وقوة الأمر في الفعل اليوناني، بدل الاكتفاء بوصف حالة ثابتة.
- source_word: ὡς ὁ νεώτερος
  choice: كالأصغر
  rationale: ينقل المقارنة بالشخص الأدنى سنًّا أو منزلة اجتماعية في السياق، لا معنى «الأصغر سنًّا» وحده.
- source_word: ὁ ἡγούμενος
  choice: القائد
  rationale: تعبير عربي واضح يدل على من يتولى القيادة، من غير تحميله إيحاءات سياسية أو كنسية زائدة.
- source_word: ὡς ὁ διακονῶν
  choice: كالذي يخدم
  rationale: يحافظ على المعنى الفعلي المستمر للخدمة، ولا يحوّل اللفظ إلى لقب أو وظيفة دينية.
theological_decisions:
- issue: طبيعة تعليم يسوع بشأن المكانة والقيادة
  choice: صياغة الآية بوصفها قلبًا لمقاييس المكانة داخل جماعة التلاميذ، إذ يُدعى صاحب المكانة والقيادة إلى اتخاذ هيئة الأدنى والخادم.
  alternative: استخدام لغة مؤسسية أشد عن المنصب أو السلطان والحكم.
  rationale: يقابل النص اليوناني بين «الأكبر» و«القائد» من جهة، و«الأصغر» و«الذي يخدم» من جهة أخرى؛ لذلك تحافظ الصياغة على التوتر بين وجود القيادة ووجوب ممارستها في تواضع وخدمة، بلا استيراد لبنى كنسية لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «ليصِرِ» للمحافظة على معنى الصيرورة والأمر، و«القائد» و«الذي يخدم» لتجنب المصطلحات المؤسسية أو الطائفية الزائدة.
