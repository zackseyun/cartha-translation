  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: ar
  text: 'قائلين: «إن كنتَ أنتَ المسيح، فقل لنا». فقال لهم: «إن قلتُ لكم، فلن تصدقوا قطعًا؛»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: قائلين
  rationale: اسم فاعل حالي يربط مضمون كلام المجلس بالسياق السابق، وصيغة «قائلين» موجزة وفصيحة وتحافظ على الصلة التركيبية.
- source_word: Εἰ σὺ εἶ
  choice: إن كنتَ أنتَ
  rationale: يحافظ على الصيغة الشرطية الصريحة وعلى توكيد الضمير σὺ، بدل تحويل العبارة إلى سؤال مباشر.
- source_word: ὁ χριστός
  choice: المسيح
  rationale: ينقل اللقب اليوناني بصيغته العربية الراسخة، مع إبقاء دلالته المسيانية في سياق الاستجواب.
- source_word: εἰπὸν ἡμῖν
  choice: فقل لنا
  rationale: ترجمة طبيعية مباشرة لفعل الأمر مع المفعول غير المباشر، والفاء تلائم جواب الشرط في العربية.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: فقال لهم
  rationale: تنقل δέ بوصفها انتقالًا مع مسحة مقابلة خفيفة، من غير تضخيمها إلى استدراك حاد.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: إن قلتُ لكم
  rationale: تحافظ على البنية الشرطية واحتمال الفعل كما في ἐάν مع صيغة الالتزام، بأسلوب عربي طبيعي.
- source_word: οὐ μὴ πιστεύσητε
  choice: فلن تؤمنوا أبدًا
  rationale: «لن» مع «أبدًا» ينقلان النفي اليوناني المؤكد οὐ μή بوضوح وقوة في العربية المعاصرة.
theological_decisions:
- issue: ترجمة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός ويحفظ دلالته بوصفه الممسوح المنتظر في هذا السياق اليهودي، من غير إضافة تفسير مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، مع الحفاظ على الشرط الصريح، وتوكيد الضمير في «أنتَ»، وقوة النفي في جواب يسوع. لم تُضف حاشية لأن «المسيح» في العربية يجمع اللقب والترجمة التقليدية، فلا يوجد هنا بديل عربي لازم من نوع «Christ/Messiah» في الإنجليزية.
