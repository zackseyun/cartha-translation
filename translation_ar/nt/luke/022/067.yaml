  to: 'قائلين: «إن كنتَ أنتَ المسيح، فقل لنا». فقال لهم: «إن قلتُ لكم، فلن تصدقوا قطعًا؛»'
  rationale: 'تعديل محدود في ختام الجواب فقط: «تصدقوا قطعًا» ينقل فعل πιστεύσητε في سياق تصديق كلام المتكلم، و«قطعًا» ينقل قوة οὐ μή من غير توسيعها إلى معنى زمني مطلق. وتبقى البنية الشرطية، وتوكيد الضمير، واللقب، والربط السردي كما هي.'
  reviewer_model: gpt-5.6-terra
