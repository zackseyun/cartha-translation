    rationale: تركيب οὐ μὴ πιστεύσητε يؤكد عدم التصديق في الحالة المفترضة، لا يلزم منه تقرير دوام عدم الإيمان عبر الزمن. «قطعًا» ينقل التأكيد من دون هذه الزيادة.
