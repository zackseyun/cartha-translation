review_pass:
  verdict: revise
  source_fidelity: 'الترجمة تحافظ بدقة على اسم الفاعل الرابط، وصيغة الشرط، وتوكيد «أنتَ»، ولقب «المسيح»، والأمر «فقل لنا». غير أن «أبدًا» قد تُفهم بوصفها حكمًا زمنيًا مطلقًا («لن يؤمنوا مطلقًا في أي وقت»)، بينما οὐ μή هنا نفي مؤكد لنتيجة الشرط: إن قال لهم فلن يصدقوه يقينًا.'
  naturalness: الصياغة فصيحة وواضحة عمومًا. واستبدال «فلن تؤمنوا أبدًا» بـ«فلن تصدقوا قطعًا» أوضح في العربية المعاصرة داخل هذا الجواب الجدلي، ويجعل متعلَّق الإيمان المفهوم هو قول يسوع من غير زيادة زمنية.
  terminology: «المسيح» مقابل عربي راسخ ومناسب للقب ὁ χριστός. ولا تستلزم الآية حاشية؛ فلا يوجد في النص العربي اختيار بديل يحتاج إلى توثيق.
  issues:
