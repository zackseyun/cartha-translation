  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: ar
  text: ولمّا طلع النهار[a]، اجتمع مجلس شيوخ الشعب، من رؤساء الكهنة والكتبة، واقتادوه إلى مجلسهم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حين صار نهارًا»، أو: «عند الفجر».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «إلى موضع اجتماع مجلسهم»، أو: «أمام مجلسهم». فاللفظ اليوناني قد يدل على المجلس نفسه، أو على اجتماعه أو موضع انعقاده.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: لمّا طلع النهار
  rationale: تعبير عربي طبيعي يحفظ الدلالة الزمنية وبنية صيرورة النهار، من غير حصرها في لحظة دقيقة بعينها.
- source_word: συνήχθη
  choice: اجتمع
  rationale: ينقل معنى اجتماع الهيئة، ويأتي طبيعيًا مع «مجلس شيوخ الشعب» في العربية.
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: مجلس شيوخ الشعب
  rationale: يدل πρεσβυτέριον هنا على هيئة مؤلفة من الشيوخ، لا على صفة الشيخوخة أو منصب مجرد.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: من رؤساء الكهنة والكتبة
  rationale: يفهم التركيب على أنه يبيّن مكوّنات مجلس الشيوخ؛ و«رؤساء الكهنة» و«الكتبة» مقابلان عربيان واضحان ومستقران.
- source_word: ἀπήγαγον
  choice: اقتادوه
  rationale: يحفظ معنى أخذه وقيادته إلى جهة أخرى في سياق قضائي، من غير إضافة عنف غير مصرّح به.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: إلى مجلسهم
  rationale: يحفظ إمكان دلالة συνέδριον على الهيئة أو جلستها، ويتجنب الجزم بأنها قاعة مادية أو استعمال اسم تاريخي منقول صوتيًا.
theological_decisions:
- issue: هوية الهيئة اليهودية ودلالة συνέδριον
  choice: مجلسهم
  alternative: السنهدريم؛ قاعة مجلسهم؛ أمام مجلسهم
  rationale: اللفظ اليوناني قد يشير إلى المجلس نفسه أو إلى اجتماعه ومكان انعقاده. اختير تعبير عربي مباشر مع حاشية تحفظ هذا الاتساع، من غير فرض تسمية مؤسسية منقولة أو معنى مكاني حصري.
- issue: علاقة رؤساء الكهنة والكتبة بمجلس شيوخ الشعب
  choice: من رؤساء الكهنة والكتبة
  alternative: أي رؤساء الكهنة والكتبة؛ ومعهم رؤساء الكهنة والكتبة
  rationale: يرجح أن العبارة تشرح تكوين الهيئة، لكن الصياغة لا تجعل «أي» تفسيرًا حصريًا ولا توحي بأنهم جماعة منفصلة أضيفت إليها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «الكتبة» للمصطلح التاريخي الكتابي، وتُركت دلالة «مجلسهم» مرنة بما يوافق تعدد احتمالات اللفظ اليوناني.
