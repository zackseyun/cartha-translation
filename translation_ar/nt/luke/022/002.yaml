  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: ar
  text: وكان رؤساء الكهنة والكتبة يبحثون كيف يقتلونه[a]، لأنهم كانوا يخافون الشعب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كيف يقضون عليه».'
    reason: بديل تعبيري للفعل اليوناني ἀναιρέω في هذا السياق؛ وهو أقل مباشرة من «يقتلونه» لكنه يدل على التخلص منه بالموت.
lexical_decisions:
- source_word: ἐζήτουν
  choice: كانوا يبحثون
  rationale: ينقل صيغة الماضي الناقص بوصفها فعلًا مستمرًّا في الماضي، مع تعبير عربي طبيعي.
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: المقابل العربي المألوف للقيادة الكهنوتية في أورشليم، ولا يوهم بوجود عدة أشخاص يشغلون منصب رئيس الكهنة منفردًا.
- source_word: γραμματεῖς
  choice: الكتبة
  rationale: ترجمة مباشرة وراسخة في سياق الأناجيل، من غير إضافة تفسير وظيفي مثل «معلّمي الشريعة».
- source_word: τὸ πῶς
  choice: عن طريقة
  rationale: ينقل التعبير الاصطلاحي الدال على الكيفية أو الوسيلة بصياغة عربية سلسة، ويرتبط طبيعيًّا بالفعل «يبحثون».
- source_word: ἀνέλωσιν
  choice: يقتلونه
  rationale: الفعل هنا يدل بوضوح على إزهاق الحياة؛ وهذه الصياغة تحفظ شدة قصدهم من غير افتراض إجراء قضائي محدد.
- source_word: ἐφοβοῦντο
  choice: كانوا يخافون
  rationale: يحفظ دلالة الحالة المستمرة في الماضي التي تفيدها صيغة الماضي الناقص.
- source_word: τὸν λαόν
  choice: الشعب
  rationale: يحفظ المرجع الجمعي الواسع للفظ، ولا يضيّقه إلى حشد حاضر بعينه.
theological_decisions:
- issue: دلالة ἀνέλωσιν في وصف قصد القادة
  choice: يقتلونه
  alternative: يميتونه / يتخلصون منه
  rationale: يحفظ وضوح القصد العدائي وشدته، من غير تلطيفه أو تحديد طريقة قانونية للإعدام لم يذكرها النص.
- issue: مرجع λαός
  choice: الشعب
  alternative: الجمع / الجموع
  rationale: يبقي الدلالة الجماعية العامة ويحفظ التوتر السردي الناتج من خوف القادة من رد فعل الناس.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُخدم التركيب «كانوا يبحثون» و«كانوا يخافون» لإبراز الاستمرار في الماضي، مع الإبقاء على المصطلحين الإنجيليين المألوفين «رؤساء الكهنة» و«الكتبة».
