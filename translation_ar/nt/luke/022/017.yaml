  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: ar
  text: 'وبعد أن تلقّى كأسًا، قدّم الشكر وقال: «خذوا هذه واقتسموها بينكم».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خذوا هذه ووزّعوها بينكم». يمكن أن يعني الفعل اليوناني «اقتسموا» أو «وزّعوا» بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεξάμενος
  choice: ثم أخذ
  rationale: اسم فاعل ماضٍ يدل على فعل سابق للقول. «ثم أخذ» تعبير عربي طبيعي يوضح تتابع الحدث، ويوافق سياق تناول الكأس من غير إثقال الصياغة.
- source_word: ποτήριον
  choice: كأسًا
  rationale: الاسم في اليونانية نكرة بلا أداة تعريف، ولذلك تحافظ «كأسًا» على صورته، مع أن سياق المائدة قد يشير إلى كأس بعينها.
- source_word: εὐχαριστήσας
  choice: شكر الله
  rationale: يفيد الفعل تقديم الشكر قبل الكلام. ذِكر الله، المفهوم ضمنًا بوصفه متلقي الشكر، يجعل العبارة طبيعية وواضحة بالعربية من غير إدخال مصطلح طقسي لاحق.
- source_word: εἶπεν
  choice: وقال
  rationale: يحافظ على بساطة اليونانية التي لا تذكر مفعولًا غير مباشر، فلا تُضاف عبارة «لهم».
- source_word: Λάβετε
  choice: خذوا
  rationale: أمر جمع، و«خذوا» هو التعبير الطبيعي في سياق تناول شيء على المائدة.
- source_word: τοῦτο
  choice: هذه
  rationale: اسم الإشارة المحايد يعود إلى الكأس المذكورة، والعربية تتطلب مطابقته لجنس «كأس» المؤنث، من غير تكرار الاسم.
- source_word: διαμερίσατε
  choice: اقتسموها
  rationale: الفعل يحتمل التقسيم والتوزيع. «اقتسموها» ينقل معنى المشاركة في ما بينهم بصورة موجزة وطبيعية، مع إبقاء «وزعوها» بديلًا ممكنًا في الحاشية.
- source_word: εἰς ἑαυτούς
  choice: بينكم
  rationale: ينقل المعنى التبادلي للتوزيع داخل الجماعة بعبارة عربية مألوفة، ولا يوحي بأن كل واحد يحتفظ بها لنفسه.
theological_decisions:
- issue: هل تُستخدم لغة إفخارستية طقسية في ترجمة εὐχαριστήσας وποτήριον؟
  choice: 'استخدام لغة سردية عادية: «كأسًا» و«شكر الله»'
  alternative: «الكأس» أو صياغة تحمل دلالة طقسية اصطلاحية أقوى
  rationale: النص يروي فعل يسوع على المائدة، ولا يفرض في هذا الموضع مصطلحات كنسية لاحقة. وتحافظ الصياغة على المشهد التاريخي من غير استيراد تقرير عقائدي غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «كأسًا» نكرة اتباعًا لصيغة الأصل، و«شكر الله» للإفصاح الطبيعي في العربية عن متلقي الشكر المفهوم ضمنًا. وُضعت علامة الحاشية [a] في المتن بعد الجملة التي تتعلق بها.
