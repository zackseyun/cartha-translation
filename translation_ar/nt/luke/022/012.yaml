  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: ar
  text: وهو سيريكما عُلِّيَّةً كبيرةً مفروشةً[a]؛ فهناك أَعِدّا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عُلِّيَّةً كبيرةً مُعَدَّةً سلفًا»، أو: «عُلِّيَّةً كبيرةً قد رُتِّبت فيها مواضع الاتكاء».'
    reason: يحمل ἐστρωμένον معنى الفرش أو الترتيب المكتمل، وقد يدل في السياق على تجهيز مواضع الاتكاء أو ترتيبات الطعام، دون أن يحدد النص التفاصيل.
lexical_decisions:
- source_word: κἀκεῖνος
  choice: وهو
  rationale: تجمع الكلمة بين معنى العطف والإشارة إلى الرجل المذكور سابقًا؛ و«وهو» تؤدي الاستمرار والإحالة بعبارة عربية طبيعية.
- source_word: ὑμῖν δείξει
  choice: سيريكما
  rationale: الفعل مستقبل، والضمير لجمع المخاطبين، وهنا المقصود التلميذان المرسلان؛ لذلك جاءت صيغة المثنى العربية بحسب السياق.
- source_word: ἀνάγαιον μέγα
  choice: عُلِّيَّةً كبيرةً
  rationale: ἀνάγαιον غرفة في طابق علوي، و«عُلِّيَّة» المقابل العربي الموجز والدقيق، وμέγα تصف كبرها.
- source_word: ἐστρωμένον
  choice: مفروشةً
  rationale: اسم المفعول التام من στρώννυμι يدل حرفيًا على حالة ناتجة عن الفرش أو الترتيب، وقد يشير إلى بسط الموائد أو تجهيز أماكن الاتكاء؛ «مفروشة» تحفظ هذه الصورة ولا تحسم كل تفاصيل التجهيز.
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: فهناك أَعِدّا
  rationale: ἐκεῖ ظرف مكان، وἑτοιμάσατε أمر لجمع المخاطبين؛ استُعمل المثنى العربي لأن المخاطبَين في السياق اثنان، مع إبقاء مفعول «أَعِدّا» مفهومًا من السياق.
