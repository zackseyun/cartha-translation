lexical_decisions:
- source_word: οἱ δὲ
  choice: فقالوا
  rationale: أداة التعريف هنا اسمية وتشير في السياق إلى التلاميذ، وδέ أداة وصل خفيفة؛ نُقلت بالفاء لربط جوابهم بالأمر السابق ربطًا طبيعيًا من غير إحداث معنى استدراكي.
- source_word: εἶπαν αὐτῷ
  choice: قالوا له
  rationale: يحافظ هذا على المعنى المباشر للفعل والداتيف، كما أن صيغة السؤال في الكلام المباشر توضح أنهم يسألون.
- source_word: Ποῦ
  choice: أين
  rationale: مقابل عربي واضح وطبيعي لظرف الاستفهام عن المكان.
- source_word: θέλεις
  choice: تريد
  rationale: ينقل معنى الإرادة أو الرغبة بلغة عربية فصيحة معاصرة من غير تكلّف.
- source_word: ἑτοιμάσωμεν
  choice: أن نُعِدَّه
  rationale: صيغة المضارع المنصوب بعد «تريد» تؤدي وظيفة صيغة المتكلم الجمع في المصدر اليوناني، وأُضيف ضمير المفعول لأن المقصود، أي الفصح أو عشاء الفصح، مفهوم من الآية السابقة.
