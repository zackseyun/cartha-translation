id: LUK.22.35
reference: Luke 22:35
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: ar
  text: 'وقال لهم: «حين أرسلتكم بلا كيس نقود ولا حقيبة سفر[a] ولا نعال، هل أعوزكم شيء؟» فقالوا: «لا شيء».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مِزود».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄτερ
  choice: بلا
  rationale: تفيد انعدام المصاحبة أو عدم وجود الشيء، و«بلا» موجزة وطبيعية في هذا السياق.
- source_word: βαλλαντίου
  choice: كيس نقود
  rationale: يدل اللفظ على وعاء لحمل المال، وهذه العبارة واضحة ودقيقة للقارئ المعاصر.
- source_word: πήρας
  choice: حقيبة سفر
  rationale: يدل على حقيبة أو جراب تُحمل فيه مؤونة الطريق؛ و«حقيبة سفر» تنقل وظيفته بوضوح مع إبقاء البديل الحرفي في الحاشية.
- source_word: ὑποδημάτων
  choice: نعال
  rationale: النعال هي المقابل الملائم تاريخيًا وسياقيًا لأحذية السفر المذكورة في سياق الأناجيل.
- source_word: μή τινος ὑστερήσατε
  choice: هل أعوزكم شيء؟
  rationale: ينقل معنى الافتقار إلى شيء، ويحافظ على صيغة السؤال التي تتوقع جوابًا بالنفي، بلغة عربية فصيحة واضحة.
- source_word: Οὐθενός
  choice: لا شيء
  rationale: جواب عربي موجز وطبيعي يطابق إيجاز الأصل ومعناه.
- source_word: ἀπέστειλα
  choice: أرسلتكم
  rationale: ينقل معنى الإيفاد في سياق المهمة بوضوح، ولا تحتاج العربية هنا إلى إضافة تقابل «out» الإنجليزية.
theological_decisions: []
translation_notes:
  register: عربية فصحى معاصرة، واضحة وموقرة. استُخدمت «أعوزكم» للدلالة الدقيقة على الافتقار، و«حقيبة سفر» لتوضيح وظيفة πήρα مع إثبات البديل «مِزود» في الحاشية.
