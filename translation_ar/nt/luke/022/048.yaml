base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: ar
  text: 'لكن يسوع قال له: «يا يهوذا، أتخون ابن الإنسان بقبلة؟»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: لكن
  rationale: أداة ربط خفيفة تحمل هنا مسحة استدراكية، إذ تمهّد لردّ يسوع على فعل يهوذا.
- source_word: εἶπεν αὐτῷ
  choice: قال له
  rationale: يحافظ على الضمير الصريح في اليونانية ويبيّن أن الكلام موجّه إلى يهوذا.
- source_word: Ἰούδα
  choice: يا يهوذا
  rationale: صيغة نداء لاسم العلم، ونُقلت بالصيغة العربية المألوفة.
- source_word: φιλήματι
  choice: بقبلةٍ
  rationale: اسم في حالة تدل على الوسيلة؛ وهذه الصياغة موجزة وطبيعية وتحافظ على الفعل الملموس.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  rationale: يحافظ على لقب يسوع الراسخ في الأناجيل وعلى بنيته اللفظية وصلته بخلفيته الكتابية.
- source_word: παραδίδως
  choice: تخون
  rationale: الفعل مضارع مفرد مخاطب في سؤال توبيخي، وسياق تسليم يسوع إلى خصومه يمنحه معنى الخيانة؛ أما المعنى الحرفي الأوسع فمذكور في الحاشية.
theological_decisions:
- issue: ترجمة τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ابن الإنسان
  alternative: الإنسان
  rationale: الترجمة المختارة تصون اللقب الذي يستعمله يسوع عن نفسه وتحافظ على صداه الكتابي، من غير اختزاله إلى تعبير عام.
- issue: الدلالة السياقية للفعل παραδίδως
  choice: تخون
  alternative: تُسلِّم
  rationale: السياق يجعل التسليم فعل خيانة، لكن الحاشية تحفظ المعنى المعجمي الأقرب إلى اللفظ ولا تلغي التوتر بين التسليم والخيانة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل الاستفهام المسبوق بالباء «أبقبلةٍ» لإبراز المفارقة والتوبيخ مع الحفاظ على إيجاز الأصل.
