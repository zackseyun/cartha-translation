  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: ar
  text: ولمّا قبضوا عليه، اقتادوه وأدخلوه إلى بيت رئيس الكهنة؛ أمّا بطرس فكان يتبعه من بعيد[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على مسافة».'
    reason: بديل معجمي للظرف μακρόθεν يحفظ دلالة البعد المكاني.
lexical_decisions:
- source_word: Συλλαβόντες
  choice: ولمّا قبضوا عليه
  rationale: ينقل اسم الفاعل الأوريستي بوصفه فعلًا سابقًا للفعلين الرئيسيين، و«قبضوا عليه» يلائم سياق الاحتجاز دون مبالغة في العنف.
- source_word: ἤγαγον
  choice: اقتادوه
  rationale: يفيد سوقه تحت الحراسة، ويحافظ على معنى الحركة مع صياغة عربية طبيعية.
- source_word: εἰσήγαγον
  choice: أدخلوه إلى
  rationale: يحفظ دلالة الحركة إلى داخل مكان، ويتجنب تكرار «اقتادوه».
- source_word: οἰκίαν
  choice: بيت
  rationale: المقصود هنا المكان المادي، و«بيت» هو المقابل العربي المباشر والطبيعي.
- source_word: ἀρχιερέως
  choice: رئيس الكهنة
  rationale: هو المقابل العربي المستقر للمصطلح الدال على صاحب منصب الكاهن الأعلى.
- source_word: ἠκολούθει
  choice: كان يتبعه
  rationale: ينقل صيغة الماضي الناقص التي تصور فعلًا مستمرًا في ذلك الوقت.
- source_word: μακρόθεν
  choice: من بعيد
  rationale: تعبير عربي طبيعي يحفظ دلالة البعد المكاني من غير إضافة تفسير لدافع بطرس.
- source_word: δὲ
  choice: أمّا
  rationale: يُظهر المقابلة الخفيفة بين إدخال يسوع إلى البيت واستمرار بطرس في اتباعه على بُعد.
theological_decisions:
- issue: وصف علاقة بطرس بيسوع أثناء اقتياده
  choice: كان يتبعه من بعيد
  alternative: تبعه من بعيد / ظل يتبعه من بعيد
  rationale: تحفظ الصياغة استمرارية الفعل والبعد المكاني، ولا تضيف حكمًا على دافع بطرس مثل الخوف أو التستر.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «اقتادوه» للسياق الاحتجازي، مع الحفاظ على تتابع الأفعال وعلى التوتر السردي من غير تفسير نفسي لموقف بطرس.
