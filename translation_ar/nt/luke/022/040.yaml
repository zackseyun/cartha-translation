  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: ar
  text: 'ولمّا وصل إلى المكان، قال لهم: «صلّوا لئلّا تدخلوا في تجربة[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «امتحان» أو «ابتلاء». يمكن أن تشير الكلمة اليونانية إلى الإغراء بالشر، أو إلى ظرف امتحان أو ابتلاء بمعنى أوسع.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ἐπὶ τοῦ τόπου
  choice: ولمّا وصل إلى المكان
  rationale: يفيد التركيب وصوله إلى الموقع المعروف من السياق، وصيغة «ولمّا» تربط الحدث زمنيًا بالفعل الرئيس بلغة عربية طبيعية.
- source_word: εἶπεν αὐτοῖς
  choice: قال لهم
  rationale: نقل مباشر ودقيق للفعل λέγω مع المفعول غير المباشر.
- source_word: Προσεύχεσθε
  choice: صلّوا
  rationale: صيغة أمر طبيعية وواضحة، ولا يلزم إبراز الاستمرار الكامن في صيغة المضارع اليونانية بعبارة تفسيرية.
- source_word: μὴ εἰσελθεῖν
  choice: لئلّا تدخلوا
  rationale: تحافظ العبارة على صورة «الدخول» في اليونانية، وتعبّر بإيجاز عن مضمون الصلاة أو غايتها دون إضافة معنى «السقوط».
- source_word: πειρασμόν
  choice: تجربة
  rationale: تلائم التحذير من التعرض لإغراء روحي، مع بقاء احتمال معنى الامتحان أو الابتلاء محفوظًا في الحاشية.
theological_decisions:
- issue: دلالة πειρασμός في تحذير يسوع
  choice: تجربة
  alternative: امتحان أو ابتلاء
  rationale: يرجّح السياق المباشر معنى التجربة التي قد تقود إلى الفشل الروحي، لكن اللفظ اليوناني قد يدل أيضًا على ظرف امتحان أو ابتلاء؛ لذلك لم تُحسم الدلالة الأوسع بلا تنبيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «لئلّا» لصياغة موجزة وطبيعية، ووُضع مؤشر الحاشية بعد «تجربة» لأنه يشرح لفظ πειρασμός.
