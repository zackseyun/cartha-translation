  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: ar
  text: 'فأرسل بطرس ويوحنا قائلًا: «اذهبا وأعدّا لنا الفصح[a] لنأكله».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عشاء الفصح». قد تشير الكلمة اليونانية إلى الفصح بمعناه الأوسع، لكن سياق الإعداد والأكل هنا يرجّح الوجبة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: أرسل
  rationale: ينقل الفعل الماضي السردي بمعناه المباشر والطبيعي من غير زيادة في درجة الرسمية.
- source_word: εἰπών
  choice: قائلًا
  rationale: يحافظ على الصلة الحالية بين الإرسال والكلام، ويأتي فصيحًا وطبيعيًا في العربية.
- source_word: Πορευθέντες
  choice: اذهبا
  rationale: مع أن الصيغة اليونانية اسم فاعل ماضٍ، فإنها تؤدي هنا قوة الأمر التمهيدي؛ واستُعمل المثنى لأن المخاطبَين بطرس ويوحنا.
- source_word: ἑτοιμάσατε
  choice: أعدّا
  rationale: أمر واضح بإجراء الاستعدادات اللازمة، وصيغة المثنى تطابق المخاطبَين.
- source_word: ἡμῖν
  choice: لنا
  rationale: تفيد اللام معنى المنفعة المقصود في الداتيف، من غير إضافة «جميعًا» غير المذكورة.
- source_word: τὸ πάσχα
  choice: الفصح
  rationale: يحافظ على سعة مدلول المصطلح اليوناني، الذي قد يدل على الفصح عمومًا أو طعامه أو ما يرتبط بذبيحته، بينما يرجّح سياق الإعداد والأكل معنى الوجبة.
- source_word: ἵνα φάγωμεν
  choice: لنأكله
  rationale: تنقل لام التعليل غرض الإعداد، ويعود ضمير المفعول إلى الفصح كما يقتضيه السياق.
theological_decisions:
- issue: مدلول «الفصح»
  choice: إبقاء اللفظ «الفصح» من غير حصره صراحة في الوجبة أو الذبيحة
  alternative: عشاء الفصح؛ خروف الفصح
  rationale: سياق الإعداد والأكل يرجّح وجبة الفصح، لكن اللفظ اليوناني أوسع دلالة؛ لذلك تُحفظ سعته في المتن ويُوضح الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت صيغتا المثنى «اذهبا» و«أعدّا» لإظهار أن الأمر موجّه إلى بطرس ويوحنا، وحُفظ تركيب «قائلًا» القريب من بنية الأصل من غير تكلف.
