source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: ar
  text: 'فقال: «أقول لك يا بطرس: لن يصيح ديك اليوم حتى تنكر ثلاث مرات أنك تعرفني».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لن يصيح الديك اليوم قبل أن تنكر ثلاث مرات أنك تعرفني».'
    reason: بديل معجمي ونحوي في ترجمة ἀλέκτωρ وἕως.
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: فقال
  rationale: الفاء طبيعية في سياق الحوار وتفيد الانتقال إلى جواب يسوع، من غير إثقال العربية بترجمة حرفية لـ δέ.
- source_word: Λέγω σοι
  choice: أقول لك
  rationale: صيغة عربية واضحة ومباشرة تحفظ زمن الفعل الحاضر وقوة العبارة اليونانية.
- source_word: Πέτρε
  choice: يا بطرس
  rationale: نُقل الاسم بصيغته العربية المألوفة، مع أداة النداء التي تقتضيها العربية الطبيعية.
- source_word: οὐ φωνήσει ... ἀλέκτωρ
  choice: لن يصيح ديك
  rationale: الفعل «يصيح» هو التعبير العربي المألوف لصوت الديك، و«ديك» نكرة توافق كون الاسم اليوناني غير معرّف.
- source_word: σήμερον
  choice: اليوم
  rationale: المقابل الزمني المباشر والطبيعي.
- source_word: ἕως
  choice: حتى
  rationale: تحفظ البنية الزمنية التي يستمر فيها نفي صياح الديك إلى وقوع الإنكار؛ ويمكن من جهة المعنى التعبير عنها بـ«قبل أن».
- source_word: τρίς
  choice: ثلاث مرات
  rationale: تعبير عربي حديث وواضح عن تكرار الفعل ثلاثًا.
- source_word: ἀπαρνήσῃ
  choice: تنكر
  rationale: «تنكر» تؤدي معنى النفي والجحود في هذا السياق، من غير توسيع الدلالة إلى كل وجوه التنصل أو قطع الولاء.
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: تنكر ... أنك تعرفني
  rationale: تحفظ العبارة مضمون الإنكار الذي يحدده المصدر εἰδέναι، أي إنكار معرفة يسوع، ولا تختزله في «تنكرني» فقط.
theological_decisions:
- issue: طبيعة إنكار بطرس المتنبأ به
  choice: «تنكر ثلاث مرات أنك تعرفني»
  alternative: «تنكرني ثلاث مرات» أو «تنكر ثلاث مرات معرفتك بي»
  rationale: وجود εἰδέναι في اليونانية يحدد مضمون الإنكار بأنه معرفة يسوع. تحافظ الصياغة المختارة على هذا التحديد من غير استنتاج معنى لاهوتي أوسع لا تصرح به الآية.
- issue: العلاقة الزمنية بين صياح الديك والإنكار
  choice: «لن يصيح ديك اليوم حتى...»
  alternative: «لن يصيح الديك اليوم قبل أن...»
  rationale: تحفظ «حتى» تركيب ἕως مع النفي والتوتر الزمني في النص، بينما تظل صيغة «قبل أن» بديلًا دلاليًا ممكنًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت صياغة حوارية طبيعية، مع إبقاء التحديد الصريح لمضمون إنكار بطرس. وُضعت علامة الحاشية بعد الاقتباس لأنها تتعلق بصياغة الجملة الزمنية داخله.
