  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: ar
  text: 'وقال لهم: «لماذا أنتم نائمون؟ قوموا وصلّوا لئلا تدخلوا في تجربة».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί καθεύδετε;
  choice: لماذا أنتم نائمون؟
  rationale: ينقل السؤال المباشر بصياغة عربية طبيعية وواضحة، مع إبقاء دلالة الفعل على النوم في تلك اللحظة.
- source_word: ἀναστάντες
  choice: قوموا
  rationale: اسم فاعل ظرفي ذو قوة أمر في السياق؛ و«قوموا» تؤدي معنى النهوض من النوم بوضوح.
- source_word: προσεύχεσθε
  choice: صلّوا
  rationale: أمر صريح بالصلاة، وصيغة «صلّوا» هي التعبير العربي المألوف والدقيق.
- source_word: ἵνα μὴ εἰσέλθητε εἰς πειρασμόν
  choice: لئلا تدخلوا في تجربة
  rationale: يحافظ على صورة «الدخول في» وعلى إمكان دلالة πειρασμός على التجربة أو الامتحان دون حصرها في إغراء الخطيئة وحده.
theological_decisions:
- issue: دلالة πειρασμός
  choice: تجربة
  alternative: إغراء
  rationale: «تجربة» أوسع دلالة وتحفظ التوتر المعجمي في اليونانية بين الامتحان والإغراء، بينما «إغراء» يحسم المعنى في اتجاه أضيق.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع أمر مباشر وإيقاع موجز يوافق الأصل.
