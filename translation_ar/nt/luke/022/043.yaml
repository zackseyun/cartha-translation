  text: ⸂ὤφθη δὲ αὐτῷ ἄγγελος ⸀ἀπ’ οὐρανοῦ ἐνισχύων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: ar
  text: فظهر له ملاك من السماء يقوّيه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تحذف بعض المخطوطات الآيتين 43 و44.
    reason: textual_variant
lexical_decisions:
- source_word: ὤφθη
  choice: ظهر
  rationale: صيغة المبني للمجهول تُستعمل هنا في أسلوب الظهور، ويؤديها الفعل العربي «ظهر» بوضوح وطبيعية من غير تحويل التركيز إلى مَن رآه.
- source_word: δὲ
  choice: الفاء في «فظهر»
  rationale: تفيد أداة الربط هنا تقدّم السرد، والفاء العربية تصل الحدث بما قبله اتصالًا طبيعيًا من غير أن توحي بتعارض.
- source_word: αὐτῷ
  choice: له
  rationale: 'تؤدي دلالة المجرور في تركيب الظهور: ظهر له.'
- source_word: ἄγγελος
  choice: ملاك
  rationale: السياق السماوي يعيّن معنى الكائن الملائكي، لا الرسول البشري.
- source_word: ἀπ’ οὐρανοῦ
  choice: من السماء
  rationale: يحفظ العبارة الدالة على المصدر أو المنشأ السماوي بصياغة عربية مألوفة.
- source_word: ἐνισχύων
  choice: يقوّيه
  rationale: يعبّر الفعل المضارع عن الفعل المصاحب للظهور، ويحفظ معنى إمداده بالقوة دون تضييقه إلى مجرد التشجيع.
- source_word: αὐτόν
  choice: ـه في «يقوّيه»
  rationale: ضمير المفعول به العائد إلى يسوع، ويُؤدّى طبيعيًا بضمير متصل في العربية.
theological_decisions:
- issue: الوضع النصي للوقا 22:43
  choice: إثبات الآية في المتن وفق نص SBLGNT المقدَّم
  alternative: تحذف بعض المخطوطات الآيتين 43 و44
  rationale: تُترجم القراءة اليونانية المقدَّمة، مع توثيق الاختلاف النصي المهم في الحاشية بدل تجاهله أو حسمه ضمنًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير التركيب الموجز «فظهر له ملاك من السماء يقوّيه» للمحافظة على تتابع السرد والفعل المصاحب، مع إبقاء هوية الملاك غير معرّفة كما في اليونانية.
