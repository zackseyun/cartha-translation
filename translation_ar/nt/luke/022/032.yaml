source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: ar
  text: أَمَّا أَنَا فَقَدْ صَلَّيْتُ مِنْ أَجْلِكَ، لِئَلَّا يَفْشَلَ إِيمَانُكَ[a]. وَأَنْتَ، مَتَى رَجَعْتَ[b]، ثَبِّتْ إِخْوَتَكَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ثقتك» أو «أمانتك». تحمل الكلمة اليونانية معاني متداخلة.
    reason: alternative_reading
  - marker: b
    text: أو «متى عدت» أو «متى رجعت ثانيةً». توحي العبارة برجوع بطرس بعد إخفاقه المرتقب.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: صَلَّيْتُ
  rationale: يفيد الفعل التضرع والطلب الجاد. و«صلّيت» تعبير عربي طبيعي في سياق شفاعة يسوع، من غير مبالغة قد يوحي بها «توسلت».
- source_word: περὶ σοῦ
  choice: مِنْ أَجْلِكَ
  rationale: مع فعل الصلاة، تدل العبارة على الصلاة لأجل شخص، لا مجرد الكلام عنه.
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: لِئَلَّا يَخِيبَ
  rationale: يمكن أن يعني الفعل أن يفشل الشيء أو ينقطع أو ينفد. و«يخيب» يلائم الإيمان في العربية ويحفظ احتمال التعثر دون الجزم بزواله كليًا.
- source_word: πίστις
  choice: إِيمَانُكَ
  rationale: «الإيمان» يحفظ سعة اللفظ اليوناني، الذي قد يتداخل هنا مع الثقة والأمانة، دون تضييقه على معنى واحد.
- source_word: ποτε
  choice: مَتَى
  rationale: تشير الكلمة في هذا السياق إلى وقت لاحق غير محدد؛ و«متى» تربط الرجوع بالأمر الذي يليه بوضوح.
- source_word: ἐπιστρέψας
  choice: رَجَعْتَ
  rationale: يحفظ معنى الرجوع أو العودة، مع السماح بإيحاء التوبة والاسترداد بعد سقوط بطرس، دون إدخال مصطلح عقائدي أضيق.
- source_word: στήρισον
  choice: ثَبِّتْ
  rationale: ينقل معنى جعل الآخرين راسخين أو أقوياء، وهو تعبير عربي واضح ومناسب للسياق الروحي.
- source_word: ἀδελφούς
  choice: إِخْوَتَكَ
  rationale: الجمع مذكر، والمرجع المباشر في المشهد هو رفاق بطرس من التلاميذ؛ لذلك يحافظ اللفظ على دقة السياق.
theological_decisions:
- issue: دلالة πίστις بين الإيمان والثقة والأمانة
  choice: إِيمَانُكَ
  alternative: ثقتك أو أمانتك
  rationale: «الإيمان» هو المقابل الأوسع، بينما يتيح الهامش إبراز التداخل الدلالي من غير حسم التوتر لصالح معنى أضيق.
- issue: دلالة ἐπιστρέψας على حالة بطرس اللاحقة
  choice: مَتَى رَجَعْتَ
  alternative: متى عدت أو متى رجعت ثانيةً
  rationale: يحفظ التصوير الحركي للرجوع وإيحاء الاسترداد بعد الإنكار، ولا يفرض في المتن لفظ «تبت» الذي يصرح بما يظل ضمنيًا في اليونانية.
- issue: مرجع ἀδελφούς وصيغته الجندرية
  choice: إِخْوَتَكَ
  alternative: الإخوة والأخوات
  rationale: المرجع المباشر هو جماعة التلاميذ الذكور في هذا المشهد، ولذلك لا ينبغي توسيع اللفظ إلى جماعة مختلطة دون قرينة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية كريمة. استُخدم «أما أنا فقد» لإبراز المقابلة في ἐγὼ δὲ، وحُفظت المخاطبة المفردة لبطرس. جميع علامات الهوامش واردة في المتن.
