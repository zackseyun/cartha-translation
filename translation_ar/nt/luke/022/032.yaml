  to: أَمَّا أَنَا فَقَدْ صَلَّيْتُ مِنْ أَجْلِكَ، لِئَلَّا يَفْشَلَ إِيمَانُكَ[a]. وَأَنْتَ، مَتَى رَجَعْتَ[b]، ثَبِّتْ إِخْوَتَكَ.
  rationale: استُبدلت «يخيب» بـ«يفشل» لتقابل فعل ἐκλίπῃ بدقة ووضوح في العربية، مع عدم الجزم بزوال الإيمان كليًا. وحُذفت علامة الاقتباس غير المتوازنة، وصُقلت صياغة الهامش b. ولم يتغير المعنى أو موضع مرساة أي هامش.
