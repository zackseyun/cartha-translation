review_pass:
  verdict: revise
  source_fidelity: ينقل النص المقابلة في «ἐγὼ δὲ»، والصلاة لأجل بطرس، وغرض ثبات إيمانه، ثم رجوعه المستقبلي وأمره بتثبيت إخوته. لكن «يخيب إيمانك» ليست المقابلة العربية الأدق أو الأكثر طبيعية لفعل ἐκλίπῃ في هذا السياق؛ إذ توحي «يخيب» غالبًا بخيبة الأمل، لا بفشل الإيمان أو انقطاعه.
  naturalness: الصياغة فصيحة في الجملة، و«ثبّت إخوتك» مناسبة جدًا. «لئلا يفشل إيمانك» أوضح وأقرب إلى الاستعمال العربي المعاصر. كما ينبغي حذف علامة الاقتباس الختامية غير المفتوحة في هذا المقتطف المستقل.
  terminology: «الإيمان» ترجمة سليمة لـ πίστις مع حفظ بدائله في الهامش. و«رجعت» تحفظ دلالة ἐπιστρέψας دون فرض «تبت». و«إخوتك» ملائمة للمرجع الذكوري المباشر.
  issues:
  - severity: medium
    issue: «يخيب إيمانك» لا يؤدي ἐκλίπῃ بأفضل دقة عربية.
    rationale: الفعل اليوناني يعني أن يفشل الشيء أو ينقطع أو ينفد. أما «خاب» فيشيع مع الرجاء أو التوقع، وقد يجعل العبارة تفهم على أنها خيبة الإيمان لا عدم فشله. «يفشل إيمانك» ينقل المعنى مباشرة مع بقاء مدى اللفظ اليوناني.
  - severity: low
    issue: علامة الاقتباس الختامية «» غير متوازنة.
    rationale: لا توجد علامة اقتباس افتتاحية في النص المقدم، والمقتطف يبدأ في أثناء قول سابق؛ لذلك تكون العلامة الختامية زائدة في عرض الآية منفردة.
  - severity: low
    issue: 'صياغة الهامش b: «باسترداد بطرس» غير طبيعية ودقيقة بما يكفي.'
