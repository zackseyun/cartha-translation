  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: ar
  text: ولمّا قام من الصلاة، جاء إلى التلاميذ فوجدهم نائمين بسبب الحزن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «نائمين من الحزن».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: ولمّا قام
  rationale: اسم الفاعل الأوريستي يدل على فعل سبق مجيئه إلى التلاميذ؛ و«ولمّا قام» توضح تتابع الحدثين بلغة عربية طبيعية.
- source_word: ἀπὸ τῆς προσευχῆς
  choice: من الصلاة
  rationale: تحافظ العبارة على دلالة ἀπό وعلى صورة النهوض من الصلاة، من غير تحويلها تفسيريًا إلى «بعدما صلّى».
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: جاء إلى التلاميذ
  rationale: تعبّر عن الحركة نحو التلاميذ، وصياغتها بفعل تام تجعل تسلسل الأفعال واضحًا في العربية.
- source_word: μαθητὰς
  choice: التلاميذ
  rationale: هو المقابل العربي المألوف والدقيق للكلمة في سياق الأناجيل.
- source_word: εὗρεν
  choice: فوجدهم
  rationale: «وجد» هو المقابل المباشر والطبيعي هنا، والفاء تصل النتيجة بما سبقها.
- source_word: κοιμωμένους αὐτούς
  choice: نائمين
  rationale: تنقل حالتهم عند أن وجدهم، وتحافظ على الدلالة المستمرة لاسم الفاعل الحاضر بصياغة عربية موجزة.
- source_word: ἀπὸ τῆς λύπης
  choice: بسبب الحزن
  rationale: تستعمل ἀπό هنا للدلالة على السبب؛ و«بسبب الحزن» توضح هذه العلاقة في العربية من غير إضافة تفسير نفسي إلى النص.
theological_decisions:
- issue: سبب نوم التلاميذ
  choice: يعرض النص نومهم بوصفه ناتجًا عن الحزن.
  alternative: كانوا نائمين وهم حزانى، من غير تشديد واضح على السببية.
  rationale: تفيد عبارة ἀπὸ τῆς λύπης السبب على الأرجح. أُبقيت العبارة مقتصرة على هذه الصلة من غير تفسير كيفية تسبب الحزن في نومهم.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم «ولمّا» لبيان التتابع الزمني، و«بسبب الحزن» لإظهار العلاقة السببية التي تحملها العبارة اليونانية بصورة طبيعية.
