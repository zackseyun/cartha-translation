  verdict: revise
  source_fidelity: ينقل المسودّة معنى الشرط، وفعل السؤال، وجواب المخاطَبين بصيغة الجمع، وتوكيد النفي على نحو سليم إجمالًا. لكن «وَ» لا تُظهر بوضوح القوة التقابلية لـδὲ، والأدق في هذا الموضع استعمال «لكن/ولكن».
  naturalness: العبارة مفهومة وفصيحة. «فلن تجيبوا البتة» تعبير عربي معاصر وطبيعي عن النفي المؤكد، وهو أسلس هنا من «مطلقًا».
  terminology: «تجيبوا» مقابل مناسب لـἀποκριθῆτε في سياق الاستجواب. وإبقاء «سألتكم» مناسب سياقيًا لفعل ἐρωτήσω ولصيغة المخاطبين الجمع.
  issues:
