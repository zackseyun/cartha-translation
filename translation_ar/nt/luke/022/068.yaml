    issue: ضعف إظهار الأداة التقابلية δὲ
    rationale: اختيار «وَ» يكتفي بالوصل، في حين أن δὲ هنا ذات قيمة استدراكية/تقابلية، كما يعكسها مسار التدقيق الإنجليزي بـ«But». «ولكن» تحافظ على هذا الفرق من دون زيادة تفسيرية.
  - severity: low
    issue: صياغة توكيد النفي
    rationale: «مطلقًا» ممكنة، لكن «البتة» أكثر التصاقًا بالاستعمال العربي المألوف لنفي مؤكد، وتنقل قوة οὐ μὴ بوضوح.
