  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: إِنْ
  rationale: تُدخل جملة شرطية، و«إنْ» هي المقابل العربي الفصيح الطبيعي من غير إضافة توكيد غير لازم.
- source_word: δὲ
  choice: وَ
  rationale: أداة انتقال وربط ذات مسحة تقابلية هنا؛ والواو تلائم اتصال العبارة بما قبلها، بينما يظهر التقابل من بنية السياق نفسه.
- source_word: ἐρωτήσω
  choice: سَأَلْتُكُمْ
  rationale: ينقل معنى السؤال مباشرة، وأُظهر المفعول به «كم» الذي يفهمه السياق وصيغة الجمع في جواب المخاطَبين.
- source_word: οὐ μὴ
  choice: فَلَنْ ... مُطْلَقًا
  rationale: ينقل النفي اليوناني المؤكد بصياغة عربية واضحة وقوية، من غير تحويله إلى نفي زمني مطلق مثل «أبدًا».
- source_word: ἀποκριθῆτε
  choice: تُجِيبُوا
  rationale: المعنى هنا «تجيبوا/تردوا»، و«تجيبوا» هو الأنسب مع فعل السؤال في هذا السياق القضائي.
