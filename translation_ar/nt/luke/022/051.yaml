  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: ar
  text: 'فأجاب يسوع: «دعوا الأمر عند هذا الحد!» ثم لمس أذنه وشفاه.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: فقال يسوع ردًّا عليهم
  rationale: ينقل تركيب الاستجابة اليوناني بصياغة عربية طبيعية، مع إبقاء معنى أن قول يسوع جاء ردًّا على الموقف.
- source_word: Ἐᾶτε ἕως τούτου
  choice: كفى، دعوا الأمر عند هذا الحد!
  rationale: العبارة اليونانية موجزة وملتبسة نسبيًّا، ويمكن أن تعني الكف عن الفعل أو السماح بما يحدث إلى هذا الحد. تجمع الصياغة بين معنى «كفى» الواضح في السياق ودلالة Ἐᾶτε الحرفية «دعوا» دون حسم زائد.
- source_word: ἁψάμενος τοῦ ὠτίου
  choice: لمس أذنه
  rationale: ترجمة مباشرة وطبيعية؛ والضمير يُفهم من السياق على أنه يعود إلى الرجل المصاب.
- source_word: ἰάσατο αὐτόν
  choice: شفاه
  rationale: يحافظ على الفعل الدال صراحة على الشفاء وعلى كون الشخص نفسه هو مفعول الشفاء.
theological_decisions:
- issue: المقصود بقول يسوع Ἐᾶτε ἕως τούτου
  choice: كفى، دعوا الأمر عند هذا الحد!
  alternative: دعوا هذا يحدث إلى هذا الحد
  rationale: يحتمل التركيب أمر التلاميذ بالكف عن المقاومة، وربما طلب إتاحة المجال في اللحظة الراهنة. اختيرت صياغة تحفظ هذا التوتر قدر الإمكان ولا تحوله إلى تقرير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت جملة قصيرة قوية لقول يسوع، ثم سرد مباشر للمس والشفاء.
