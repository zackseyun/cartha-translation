base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: ar
  text: 'فقال يسوع لرؤساء الكهنة وقادة حرس الهيكل والشيوخ الذين جاؤوا ضدّه: «أخرجتم لمواجهتي كما لو كنتُ لصًّا[a]، بسيوف وعِصيّ؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قاطع طريق». قد تشير الكلمة اليونانية إلى لصّ أو قاطع طريق، وربما إلى خارج عن القانون ذي طابع تمرّدي؛ والمقصود هنا إبراز أنهم جاؤوا مسلحين كما لو كانوا يواجهون مجرمًا خطيرًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: فقال
  rationale: أُدمجت أداة الانتقال الخفيفة في الفاء لربط جواب يسوع بالمشهد السابق ربطًا طبيعيًّا، من غير تشديد غير لازم على معنى الاستدراك.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: الذين جاؤوا للقبض عليه
  rationale: ينقل اتجاه مجيئهم العدائي في سياق الاعتقال بعبارة عربية واضحة، بدل تعبير حرفي ملتبس مثل «جاؤوا عليه».
- source_word: ἀρχιερεῖς
  choice: رؤساء الكهنة
  rationale: التعبير العربي المألوف للجماعة القيادية الكهنوتية، لا لمجموعة من شاغلي منصب رئيس كهنة في وقت واحد.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: قادة حرس الهيكل
  rationale: يوضح أنهم مسؤولو القوة المكلفة بأمن الهيكل، مع الحفاظ على دلالة القيادة في στρατηγοί.
- source_word: πρεσβυτέρους
  choice: الشيوخ
  rationale: يدل السياق على أصحاب المكانة والقيادة في الجماعة، لا على كبار السن عمومًا.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: كأنني لصّ
  rationale: صياغة عربية طبيعية تحفظ المقارنة الاستنكارية؛ ولفظ λῃστής أوسع من «لص» وحدها، لذلك ذُكر البديل في الحاشية.
- source_word: ἐξήλθατε
  choice: أخرجتم عليَّ
  rationale: ينقل فعل خروج الجماعة لمواجهة يسوع، ويحتفظ بقوة السؤال المتعلق بما فعلوه للتو.
- source_word: μαχαιρῶν
  choice: بسيوف
  rationale: المقابل المعتاد والملائم لسلاح يُحمل في مشهد قبض.
- source_word: ξύλων
  choice: وعِصيّ
  rationale: السياق يدل على أدوات خشبية تُستعمل للضرب، و«عِصيّ» أوضح وأطبع في العربية من الترجمة الحرفية «أخشاب».
