  source_fidelity: 'يلزم تصحيح «أخرجتم عليَّ»: فالفعل العربي «أخرجتم» متعدٍّ ولا يؤدي هنا معنى اليونانية ἐξήλθατε («خرجتم»). كما أن «للقبض عليه» يحدد غرض المجيء أكثر مما يصرح به النص، وإن كان السياق سياق اعتقال. الصياغة المقترحة تحافظ على الاتجاه العدائي دون هذه الزيادة.'
