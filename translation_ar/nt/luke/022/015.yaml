  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: ar
  text: 'وقال لهم: «اشتقتُ اشتياقًا شديدًا[a] أن آكل هذا الفصح[b] معكم قبل أن أتألّم.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «اشتقتُ اشتياقًا»؛ يستخدم اليوناني تركيبًا توكيديًا للتعبير عن شدة شوق يسوع.'
    reason: lexical_alternative
  - marker: b
    text: قد يشير «هذا الفصح» هنا بوجه خاص إلى عشاء الفصح.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: وقال لهم
  rationale: صيغة سردية مباشرة وطبيعية في العربية، تنقل معنى القول الموجَّه إليهم.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: اشتقتُ اشتياقًا شديدًا
  rationale: يحافظ المصدر المؤكد مع الفعل من الجذر نفسه على قوة التركيب اليوناني ذي الصبغة السامية، وتضيف «شديدًا» بيانًا طبيعيًا للتوكيد المقصود.
- source_word: τοῦτο τὸ πάσχα
  choice: هذا الفصح
  rationale: يحافظ على لفظ النص دون إضافة «العشاء» أو «الوجبة»، مع أن سياق الأكل يدل على أن عشاء الفصح هو المقصود.
- source_word: φαγεῖν
  choice: أن آكل
  rationale: ترجمة مباشرة وطبيعية للمصدر اليوناني.
- source_word: μεθ’ ὑμῶν
  choice: معكم
  rationale: ينقل معنى المصاحبة بإيجاز ووضوح.
- source_word: πρὸ τοῦ με παθεῖν
  choice: قبل أن أتألّم
  rationale: ينقل الدلالة الزمنية للمصدر المسبوق بـ πρό، ويحفظ الإشارة العامة إلى آلام يسوع المقبلة دون تفصيل زائد.
theological_decisions:
- issue: دلالة πάσχα في السياق
  choice: إبقاء «هذا الفصح» في المتن
  alternative: «عشاء الفصح هذا» أو «وجبة الفصح هذه»
  rationale: سياق الأكل يرجّح أن المراد عشاء الفصح، لكن اللفظ اليوناني نفسه يمكن أن يدل على الفصح، فالإبقاء عليه يحفظ صياغة المصدر ولا يحسم اتساع الدلالة في المتن.
- issue: قوة التركيب التوكيدي Ἐπιθυμίᾳ ἐπεθύμησα
  choice: «اشتقتُ اشتياقًا شديدًا»
  alternative: «رغبتُ رغبةً شديدة» أو «تمنّيتُ بشدة»
  rationale: الصياغة المختارة تحفظ التوكيد الاشتقاقي وقوة التوق الشخصي بلغة عربية طبيعية، من غير إضافة معنى لاهوتي غير مصرّح به.
- issue: مدلول πάσχω
  choice: «أتألّم»
  alternative: «أعاني»
  rationale: «أتألّم» تعبير عربي واضح يحفظ المعنى العام لآلام يسوع المقبلة دون قصره في المتن على حدث مفرد أو صيغة مبني للمجهول.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم المصدر المؤكد المألوف عربيًا لصون شدة العبارة الأصلية، وأُبقي «الفصح» دون توسعة تفسيرية في المتن.
