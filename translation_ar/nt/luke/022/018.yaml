  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: ar
  text: 'فإني أقول لكم: من الآن لن أشرب البتة من ثمر الكرمة[a] إلى أن يأتي ملكوت الله.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الخمر». يرد في اليونانية حرفيًا «ثمر الكرمة»، وهو تعبير أوسع يُرجَّح أنه يشير إلى محتوى الكأس من غير استعمال الكلمة المعتادة للخمر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: فإني أقول لكم
  rationale: ينقل «فـ/إن» الصلة التفسيرية التي تؤديها γάρ، و«أقول لكم» صيغة عربية واضحة وقريبة من تركيب الأصل.
- source_word: οὐ μὴ πίω
  choice: لن أشرب البتة
  rationale: يجمع «لن» مع «البتة» لنقل النفي المستقبلي المؤكد في οὐ μή، من غير تحويله إلى نفي زمني مطلق يتجاهل عبارة «إلى أن».
- source_word: ἀπὸ τοῦ νῦν
  choice: من الآن
  rationale: تعبير عربي طبيعي يحدد ابتداء الامتناع من اللحظة الحاضرة.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: من ثمر الكرمة
  rationale: يحافظ على التعبير الأوسع في اليونانية، الذي يدل على نتاج الكرمة، ولا يستبدله صراحة بكلمة «خمر».
- source_word: ἕως οὗ
  choice: إلى أن
  rationale: ينقل الحد الزمني للنفي بوضوح وطبيعية في العربية.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: '«ملكوت الله» تعبير كتابي عربي راسخ يحفظ البعدين: سلطان الله الملكي ومجال ملكه، من غير تضييق المعنى إلى أحدهما.'
- source_word: ἔλθῃ
  choice: يأتي
  rationale: المضارع بعد «إلى أن» طبيعي في العربية للدلالة على حدث مستقبلي منتظر، من غير تحديد كيفية مجيء الملكوت أو مرحلته.
theological_decisions:
- issue: هل يُترجم γενήματος τῆς ἀμπέλου بلفظ «الخمر» أم بالتعبير الأقرب إلى الأصل؟
  choice: ثمر الكرمة
  alternative: الخمر
  rationale: النص اليوناني لا يستخدم اللفظ المعتاد للخمر، بل تعبيرًا أوسع هو «نتاج/ثمر الكرمة»؛ لذا حُفظ التعبير من غير تضييق دلالته، مع بيان البديل في الحاشية.
- issue: دلالة مجيء ملكوت الله
  choice: إلى أن يأتي ملكوت الله
  alternative: إلى أن يكتمل مجيء ملكوت الله
  rationale: يذكر النص حدًا زمنيًا مستقبليًا من غير أن يحدد طور المجيء أو كيفيته؛ لذلك لا تضيف الترجمة تفسيرًا أخرويًا يحسم هذا التوتر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «البتة» لتأكيد النفي بقوة مع بقائه مفهومًا، وحُفظ التعبير الكتابي «ثمر الكرمة» و«ملكوت الله» لما فيهما من دقة واتساع دلالي.
