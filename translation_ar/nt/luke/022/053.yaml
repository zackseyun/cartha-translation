  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: ar
  text: كلَّ يوم، حين كنتُ معكم في الهيكل، لم تمدّوا أيديكم عليَّ[a]. لكن هذه ساعتكم، وسلطان الظلمة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تعبير يوناني يُستعمل هنا للدلالة على اتخاذ إجراء عدائي، في سياق القبض.
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قوة الظلمة».'
    reason: alternative_translation
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: كلَّ يوم
  rationale: تعبير توزيعي يفيد التكرار اليومي، و«كل يوم» صياغة عربية طبيعية واضحة.
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: حين كنتُ معكم
  rationale: نُقلت صيغة المضاف إليه المطلقة إلى جملة زمنية عربية تحفظ معناها الظرفي.
- source_word: ἐν τῷ ἱερῷ
  choice: في الهيكل
  rationale: تشير ἱερόν إلى مجمّع الهيكل، و«في الهيكل» هي العبارة العربية المألوفة من غير توسع تفسيري.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: لم تمدّوا أيديكم عليَّ
  rationale: تحفظ الصورة اليونانية والفعل العدائي المقصود في سياق القبض، مع وضوحها في العربية.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: لكن هذه ساعتكم
  rationale: تحفظ «الساعة» دلالة اللحظة المحددة ذات النبرة الجليلة، من دون اختزالها إلى وقت عادي.
- source_word: ἐξουσία
  choice: سلطان
  rationale: «سلطان» يؤدي معنى الصلاحية أو النفوذ الفاعل، ويلائم التركيب العربي «سلطان الظلمة».
- source_word: τοῦ σκότους
  choice: الظلمة
  rationale: تحفظ الاستعارة اللاهوتية وتشخيص مجال الظلام أو نفوذه من غير تعيين تفسيري زائد.
theological_decisions:
- issue: هل يُصرَّح بأن «سلطان الظلمة» هو سلطان الشيطان أو الشر؟
  choice: الإبقاء على «سلطان الظلمة» كما في النص
  alternative: قوة الظلمة؛ سلطان الشيطان؛ سيادة الشر
  rationale: النص يذكر الظلمة ولا يسمّي الشيطان صراحة؛ لذلك تحفظ الصياغة الاستعارة والتوتر اللاهوتي من غير فرض تفسير مذهبي.
- issue: علاقة «ساعتكم» بـ«سلطان الظلمة»
  choice: 'الإبقاء على العطف: «هذه ساعتكم، وسلطان الظلمة»'
  alternative: هذه ساعتكم، أي ساعة سلطان الظلمة
  rationale: العطف اليوناني يتيح تقارب المعنيين من غير أن يحسم نحويًا أن العبارة الثانية تفسير مطابق للأولى؛ فحُفظ هذا الانفتاح.
translation_notes:
  register: عربية فصحى حديثة، واضحة وجليلة. استُخدم «الهيكل» وفق الاصطلاح الكتابي الشائع، و«سلطان الظلمة» للحفاظ على الاستعارة ودلالة ἐξουσία. جميع علامات الحواشي مثبتة في المتن.
