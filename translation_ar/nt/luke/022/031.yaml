  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: ar
  text: «سمعان، سمعان، ها إن الشيطان قد طلب أن يغربلكم كالحنطة.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: ها إن
  rationale: أداة تنبيه عربية طبيعية تحافظ على لفت الانتباه في الأصل من غير إقحام فعل زائد.
- source_word: ἐξῃτήσατο
  choice: قد طلب
  rationale: يفيد الفعل طلبًا قويًا أو مطالبة، لكن النص لا يصرّح ممن طُلب الإذن؛ لذا يحافظ «طلب» على هذا القدر من الغموض.
- source_word: ὑμᾶς
  choice: كم في «يغربلكم»
  rationale: ضمير جمع، يبيّن أن الخطاب، مع توجيهه إلى سمعان، يشمل جماعة المخاطَبين.
- source_word: σινιάσαι
  choice: يغربلكم
  rationale: ينقل صورة نخل الحبوب وهزّها لفصلها، وهي الاستعارة المركزية في العبارة.
- source_word: ὡς τὸν σῖτον
  choice: كالحنطة
  rationale: صياغة عربية موجزة ومألوفة تحافظ على التشبيه الزراعي.
theological_decisions:
- issue: هل يتضمن طلب الشيطان حصوله على إذن إلهي؟
  choice: قد طلب
  alternative: قد طالب بأن تكونوا له
  rationale: الأصل يعبّر عن طلب شديد، لكنه لا يسمّي الجهة التي وُجّه إليها الطلب ولا يصرّح هنا بمنح الإذن؛ لذلك لم تُضف هذه التفاصيل.
- issue: نطاق ضمير المخاطَب
  choice: يغربلكم بصيغة الجمع
  alternative: يغربلك بصيغة المفرد
  rationale: اليونانية ὑμᾶς جمع، ويجب إبراز أن المقصودين جماعة، رغم نداء سمعان بالاسم.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. أُبقي تكرار الاسم للتوكيد، واستُخدمت صيغة الجمع الظاهرة في «يغربلكم» لصون التباين بين نداء سمعان المفرد وشمول الطلب للجماعة.
