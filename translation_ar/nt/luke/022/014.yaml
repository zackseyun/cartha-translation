lexical_decisions:
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: لمّا حانت الساعة
  rationale: تعبير عربي طبيعي يحفظ لفظ «الساعة» ودلالة حلول الموعد المحدد في السياق، من غير تعميمه إلى «الوقت».
- source_word: ἀνέπεσεν
  choice: اتكأ إلى المائدة
  rationale: الفعل يدل على اتخاذ وضع الاتكاء المعتاد عند تناول الطعام قديمًا. وإضافة «إلى المائدة» توضح المقصود للقارئ المعاصر من غير تحويله إلى «جلس»، وهي أقل دقة تاريخيًا.
- source_word: οἱ ἀπόστολοι
  choice: الرسل
  rationale: نقل مباشر للاسم المعرّف، ويشير إلى الجماعة المعروفة في السياق من غير إضافة «رسله» غير الموجودة صراحة في اليونانية.
- source_word: σὺν αὐτῷ
  choice: معه
  rationale: مقابل عربي موجز وطبيعي يؤدي معنى المصاحبة بوضوح.
- source_word: Καὶ
  choice: و
  rationale: يحفظ أداة الربط واستمرار السرد بأسلوب عربي طبيعي.
theological_decisions:
- issue: هيئة تناول الطعام في سياق العشاء
  choice: اتكأ إلى المائدة
  alternative: جلس إلى المائدة
  rationale: يحفظ الاختيار الهيئة التاريخية التي يدل عليها الفعل اليوناني، بدل تسويتها إلى طريقة الجلوس الحديثة؛ وهذا توضيح لغوي ثقافي لا تقرير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «حانت الساعة» لصياغة عربية سلسة مع إبقاء التحديد، ووُضعت علامة الحاشية بعد «المائدة» لأنها تشرح فعل الاتكاء.
