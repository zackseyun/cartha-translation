  source_fidelity: 'المسودة تنقل عناصر اليونانية الأساسية بأمانة: حلول «الساعة»، واتكاء يسوع، ووجود الرسل معه. لكن «اتكأ إلى المائدة» يوحي بحركةٍ نحو المائدة أكثر من كونه هيئة تناول الطعام التي يدل عليها ἀνέπεσεν.'
  naturalness: «حانت الساعة» تعبير فصيح طبيعي. والأفصح والأوضح لوصف هيئة الطعام هنا هو «اتكأ عند المائدة». كما أن إعادة الفعل مع «الرسل» تجعل الإسناد المشترك المفهوم من التركيب اليوناني واضحًا في العربية.
  terminology: «الرسل» مقابل مناسب لـ οἱ ἀπόστολοι، و«الساعة» يحافظ على اللفظ المحدد في النص. و«اتكأ» يحفظ الخصوصية التاريخية للفعل أفضل من «جلس».
  issues:
