    rationale: «إلى» يدل عادة على الاتجاه أو الوصول، بينما المقصود هو الاتكاء في موضع الطعام. «عند المائدة» أوضح وأفصح في العربية الحديثة لهذه الهيئة.
  - severity: low
    issue: موضع علامة الحاشية
    rationale: الحاشية تشرح معنى فعل «اتكأ» لا معنى «المائدة»، ولذلك ينبغي أن تتبع الفعل مباشرة.
  - severity: low
