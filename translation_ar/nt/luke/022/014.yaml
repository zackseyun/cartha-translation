    rationale: التركيب اليوناني يعطف «الرسل معه» على حالة اتكائه. تكرار الفعل في العربية لا يضيف معنى جديدًا، بل يزيل احتمال فهم العبارة على أنها مجرد مرافقة غير مرتبطة بالاتكاء.
  revised_text: ولمّا حانت الساعة، اتكأ[a] عند المائدة، واتكأ الرسل معه.
