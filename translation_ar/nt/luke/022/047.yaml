  to: وبينما كان لا يزال يتكلم، وإذا بجمعٍ، وكان الذي يُدعى يهوذا، أحد الاثني عشر، يتقدمهم[a]، فاقترب من يسوع ليقبّله.
  rationale: نُقحت الصياغة لتكون أسلس في العربية («وإذا بجمعٍ»)، ولإظهار استمرارية الفعل الماضي في «كان يتقدمهم». ونُقلت علامة الحاشية إلى «يتقدمهم» لأن بدائلها تخص προήρχετο αὐτούς، مع إبقاء احتمال «يقودهم» في الحاشية من غير فرضه على النص.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:02Z'
