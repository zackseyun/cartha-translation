  naturalness: «إذا جمعٌ» مفهومة لكنها مقتضبة على نحو غير سلس في العربية الفصحى الحديثة؛ «وإذا بجمعٍ» أيسر وأوضح في السرد. وإدخال «كان» قبل «يتقدمهم» يحسن ترابط الجملة مع المحافظة على التتابع السردي.
  terminology: «يهوذا»، «الاثني عشر»، «يسوع»، و«يقبّله» سليمة ومناسبة. لا حاجة إلى إضافة تفسير للخيانة أو إلى تقرير أن يهوذا كان قائد الجماعة.
