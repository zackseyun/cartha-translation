base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: ar
  text: وبينما كان لا يزال يتكلم، وإذا بجمعٍ، وكان الذي يُدعى يهوذا، أحد الاثني عشر، يتقدمهم[a]، فاقترب من يسوع ليقبّله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يسير أمامهم»؛ وقد يُفهم أيضًا: «يقودهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: وبينما كان لا يزال يتكلم
  rationale: يحفظ تركيب المضاف إليه المطلق الدال على فعل مستمر متزامن مع الحدث التالي، بصياغة عربية طبيعية.
- source_word: ἰδοὺ
  choice: إذا
  rationale: تؤدي وظيفة لفت الانتباه إلى الظهور المفاجئ للجمع في سياق سردي، من غير إثقال العبارة بلفظ قديم.
- source_word: ὄχλος
  choice: جمعٌ
  rationale: ينقل معنى جمهور من الناس، مع إبقاء العبارة مقتضبة كما في اليونانية، إذ يفهم مجيئهم من السياق.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: الذي يُدعى يهوذا
  rationale: تعريف مباشر قريب من الصياغة اليونانية من غير إيحاء زائد تحمله عبارة مثل «المدعو» في بعض الاستعمالات.
- source_word: εἷς τῶν δώδεκα
  choice: أحد الاثني عشر
  rationale: الصياغة العربية المألوفة التي تحفظ هوية يهوذا بوصفه من الاثني عشر وما في السياق من مفارقة.
- source_word: προήρχετο αὐτούς
  choice: يتقدمهم
  rationale: يحفظ معنى السير أمامهم وصيغة الماضي الناقص الدالة على الحدث الجاري، من غير الجزم بأنه كان يقودهم رسميًا.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: فاقترب من يسوع
  rationale: تعبير عربي واضح ينقل فعل الاقتراب، مع ربط الحدث بما سبقه.
- source_word: φιλῆσαι αὐτόν
  choice: ليقبّله
  rationale: ينقل الغرض من الاقتراب والمعنى المباشر للفعل، من غير إضافة تفسير الخيانة إلى نص الآية.
theological_decisions:
- issue: التصوير السردي لفعل يهوذا
  choice: وصف اقترابه وقصده أن يقبّل يسوع من غير إضافة لفظ «يخونه».
  alternative: ليخونه بقبلة
  rationale: سياق الخيانة واضح في المقطع، لكن ألفاظ هذه الآية نفسها تصف التقدم والاقتراب والقبلة؛ لذلك تُحفظ دلالة النص وتوتره السردي بلا توسع تفسيري.
- issue: دلالة προήρχετο αὐτούς
  choice: يتقدمهم
  alternative: يقودهم
  rationale: يمكن أن يفهم الفعل على أنه السير أمام الجماعة أو قيادتها؛ فاختير التعبير الأوسع الذي لا يحسم معنى القيادة الرسمية، مع إثبات البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «إذا» الفجائية لنقل قوة ἰδοὺ في السرد، وحُفظ ترتيب المشهد وتتابعه قدر الإمكان من دون تراكيب متكلفة.
