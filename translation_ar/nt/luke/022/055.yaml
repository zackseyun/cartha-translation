- source_word: ἐκάθητο
  choice: كان بطرس جالسًا
  rationale: صيغة الماضي الناقص تصوّر حالة مستمرة في المشهد، ولذلك تنقلها «كان ... جالسًا» بوضوح.
- source_word: μέσος αὐτῶν
