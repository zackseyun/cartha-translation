  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: ar
  text: 'ولمّا رأى الذين حوله ما أوشك أن يحدث، قالوا: «يا رب، هل نضرب بالسيف[a]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسيف». وقد تشير الكلمة اليونانية إلى سيف أو إلى نصل أقصر، أي خنجر.'
    reason: بيان احتمال التنكير واتساع الدلالة المعجمية لكلمة μάχαιρα.
lexical_decisions:
- source_word: ἰδόντες
  choice: ولمّا رأى
  rationale: صيغ اسم الفاعل الماضي بوصفه جملة زمنية طبيعية في العربية، مع الحفاظ على علاقته بالفعل الرئيس.
- source_word: οἱ περὶ αὐτὸν
  choice: الذين حوله
  rationale: ينقل التعبير اليوناني من غير أن يحدد هؤلاء صراحة بأنهم التلاميذ أو الرفاق، وهو ما لا يصرح به النص.
- source_word: τὸ ἐσόμενον
  choice: ما أوشك أن يحدث
  rationale: يعبر عن الحدث الوشيك الذي يدل عليه اسم الفاعل المستقبلي المعرّف، بلغة عربية واضحة وطبيعية.
- source_word: εἶπαν
  choice: قالوا
  rationale: يحافظ على المعنى المعتاد للفعل λέγω، بينما تتضح دلالة السؤال من صيغة الكلام المباشر.
- source_word: Κύριε
  choice: يا رب
  rationale: ترجمة لقب المخاطبة κύριε ترجمة مباشرة تحافظ على وقاره ورنينه اللاهوتي.
- source_word: εἰ
  choice: هل
  rationale: تؤدي أداة الاستفهام العربية معنى السؤال التشاوري الذي تؤديه εἰ هنا، من غير الترجمة الحرفية المربكة «إن».
- source_word: πατάξομεν
  choice: نضرب
  rationale: ينقل معنى πατάσσω وصيغة السؤال التشاوري من دون توسيعه إلى «نهاجم».
- source_word: ἐν μαχαίρῃ
  choice: بالسيف
  rationale: الباء تفيد الآلة على نحو طبيعي، و«السيف» ترجمة مألوفة لـ μάχαιρα مع إثبات الاحتمال المعجمي الآخر في الحاشية.
theological_decisions:
- issue: ترجمة κύριος عند مخاطبة يسوع
  choice: يا رب
  alternative: يا معلّم
  rationale: يحفظ «رب» ثقل اللقب واحتماله اللاهوتي، ولا يحصره في معنى اجتماعي مثل «معلّم».
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «ما أوشك أن يحدث» لإبراز قرب الحدث، ووُضعت علامة الحاشية بعد «السيف» لأنها تتعلق بلفظ السلاح.
