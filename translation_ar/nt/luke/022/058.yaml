  text: καὶ μετὰ βραχὺ ἕτερος ἰδὼν αὐτὸν ἔφη· Καὶ σὺ ἐξ αὐτῶν εἶ· ὁ δὲ Πέτρος ⸀ἔφη· Ἄνθρωπε, οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: ar
  text: 'وبعد وقت قصير، رآه رجل آخر فقال: «أنت أيضًا واحد منهم». فقال بطرس: «يا رجل، لستُ منهم».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لستُ». ترك النص اليوناني الخبر محذوفًا لأنه مفهوم من الاتهام السابق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: بعد وقت قصير
  rationale: تعبير زمني يدل على انقضاء مدة وجيزة، وهذه صياغة عربية واضحة وطبيعية.
- source_word: ἕτερος
  choice: رجل آخر
  rationale: تعني اللفظة «آخر» أو «شخص آخر». أُضيف «رجل» لأن المرجع مذكر مفرد، ولأن بطرس يخاطبه بصيغة «يا رجل».
- source_word: ἰδὼν αὐτὸν
  choice: رآه
  rationale: اسم الفاعل اليوناني الماضي يقدّم ظرفًا مصاحبًا؛ وتحويله إلى فعل عربي متتابع يحفظ المعنى بسلاسة.
- source_word: ἔφη
  choice: فقال
  rationale: الفعل هنا أداة سردية بسيطة لتقديم الكلام، و«قال» هو المقابل العربي الطبيعي.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: أنت أيضًا واحد منهم
  rationale: العبارة تفيد الانتماء إلى جماعة يسوع، لا مجرد الأصل أو المصدر؛ و«واحد منهم» تؤدي هذا المعنى بوضوح.
- source_word: Ἄνθρωπε
  choice: يا رجل
  rationale: تحفظ النداء المباشر ونبرة جواب بطرس المقتضبة والدفاعية.
- source_word: οὐκ εἰμί
  choice: لستُ منهم
  rationale: اليونانية تقول حرفيًا «لستُ» وتحذف الخبر المفهوم من الاتهام السابق. في العربية لا تستقيم «لستُ» وحدها عادةً، لذلك أُظهر المحذوف في المتن مع توثيق الإيجاز الأصلي في الحاشية.
