base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: ar
  text: 'وتقولان لربِّ البيت: «يقول لك المعلِّم: أين غرفة الضيوف التي آكل فيها الفصح مع تلاميذي؟»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «موضع الضيافة». فاللفظ اليوناني يدل على موضع للنزول أو غرفة للضيوف، ولا يعني هنا تحديدًا «خانًا»، أما كون المكان عِلِّيّة فيرد في الآية التالية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: لربِّ البيت
  rationale: يدلّ التعبير على ربّ الأسرة أو صاحب السلطان في البيت. و«ربّ البيت» تعبير عربي طبيعي موجز يحفظ دلالة رئاسة المنزل، من غير أن يجزم بملكيته القانونية.
- source_word: ὁ διδάσκαλος
  choice: المعلِّم
  rationale: ترجمة مباشرة للقب الذي يعرّف به يسوع نفسه في القول المنقول، وهي أوضح من استعمال لقب آخر قد يحمل إيحاءات إضافية.
- source_word: κατάλυμα
  choice: غرفة الضيوف
  rationale: يدل اللفظ هنا على موضع نزول أو ضيافة في سياق بيت، لذلك تلائم «غرفة الضيوف» السياق، ولا توحي بخان، ولا تستبق وصف «العِلِّيّة» في الآية التالية.
- source_word: τὸ πάσχα
  choice: الفصح
  rationale: يمكن أن يدل πάσχα على العيد أو ذبيحته أو وجبته؛ وفعل الأكل يجعل وجبة الفصح حاضرة في السياق، لكن «الفصح» يحفظ اتساع اللفظ اليوناني من غير زيادة تفسيرية في المتن.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: مع تلاميذي
  rationale: «تلاميذي» تؤدي معنى الأتباع المتعلّمين المرتبطين بمعلّمهم، وهو الاستعمال الطبيعي في سياق الأناجيل.
- source_word: φάγω
  choice: آكل
  rationale: المضارع العربي بعد الموصول المكاني ينقل بسلاسة الفعل المتوقَّع أو المقصود الذي عبّر عنه اليوناني بصيغة الاحتمال، من غير إدخال معنى الإذن.
- source_word: ἐρεῖτε
  choice: تقولان
  rationale: صيغة المستقبل اليونانية تؤدي هنا وظيفة التوجيه. واختير المثنى لأن المخاطَبين هما بطرس ويوحنا بحسب الآية السابقة، وهو تمييز يقتضيه النظام الصرفي العربي.
theological_decisions:
- issue: لقب يسوع διδάσκαλος في تعريفه لنفسه
  choice: المعلِّم
  alternative: السيد
  rationale: يحفظ «المعلِّم» المعنى المعجمي والوظيفة اللقبية من غير تحميل النص دلالة سيادية ليست هي الدلالة المباشرة للفظ هنا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل المثنى «تقولان» اتساقًا مع المخاطَبَين في السياق السابق، وحُفظ القول داخل القول بعلامات اقتباس متداخلة.
