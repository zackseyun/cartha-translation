  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: ar
  text: فبدأوا يتناقشون فيما بينهم في مَن منهم عسى أن يكون هو الذي على وشك أن يفعل هذا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في مَن عسى أن يكون منهم هو الذي على وشك أن يفعل هذا». ويتضح من السياق أن «هذا» يشير إلى فعل الخيانة المُعلَن عنه في الآية السابقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: فبدأوا
  rationale: يحفظ معنى الشروع في الفعل الذي تدل عليه الصيغة مع المصدر، وهو تعبير عربي طبيعي.
- source_word: συζητεῖν
  choice: يتناقشون
  rationale: يدل على تبادل الحديث والفحص المشترك، من غير أن يبالغ فيوحي بخصومة أو جدال حاد.
- source_word: πρὸς ἑαυτούς
  choice: فيما بينهم
  rationale: ينقل المعنى التبادلي داخل الجماعة بعبارة عربية مألوفة.
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: تُرى مَن منهم يكون
  rationale: «مَن منهم» يحفظ السؤال عن فرد من جماعة معلومة، و«تُرى» تنقل قوة ἄρα التداولية والاستفهامية، أما «يكون» فتحفظ صيغة الخطاب غير المباشر من دون إزالة عدم اليقين.
- source_word: μέλλων πράσσειν
  choice: المزمع أن يفعل
  rationale: ينقل معنى الفعل المرتقب والقريب، مع أسلوب عربي فصيح وواضح، من غير تحويله إلى مجرد نية.
- source_word: τοῦτο
  choice: هذا
  rationale: يحفظ الإحالة العامة في اليونانية إلى الفعل المذكور في السياق السابق، من غير إدخال لفظ «الخيانة» في متن الآية.
theological_decisions:
- issue: هل تُذكر الخيانة صراحة في متن الآية؟
  choice: الإبقاء على العبارة العامة «أن يفعل هذا».
  alternative: «أن يخونه» أو «أن يفعل فعل الخيانة هذا».
  rationale: النص اليوناني يقول حرفيًا ما معناه «يفعل هذا»، مع أن السياق يبيّن أن المشار إليه هو الخيانة. إبقاء الإحالة غير المصرّح بها يحفظ صياغة الآية وتوترها من غير توسع تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُعملت «تُرى» لنقل نبرة التساؤل والتداول، و«المزمع» للمحافظة على معنى الفعل المرتقب مع تجنب التصريح بالخيانة في المتن.
