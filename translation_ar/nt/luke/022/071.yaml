  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: ar
  text: 'فقالوا: «لماذا لا نزال نحتاج إلى شهادة؟ فنحن أنفسنا قد سمعنا من فمه».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أية حاجة أخرى لنا إلى شهادة؟»'
    reason: بديل لفظي أقرب إلى البنية الحرفية لعبارة Τί ἔτι ... χρείαν.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: فقالوا
  rationale: الفاء تلائم العربية في وصل الكلام بما قبله ودفع السرد إلى الأمام، من غير أن تضيف تضادًا قويًا لا يقتضيه δέ.
- source_word: Τί ἔτι
  choice: لماذا لا نزال
  rationale: ينقل صيغة السؤال البلاغي طبيعيًا في العربية، مع الحفاظ على معنى الاستمرار الذي يفيده ἔτι.
- source_word: ἔχομεν μαρτυρίας χρείαν
  choice: نحتاج إلى شهادة
  rationale: تعبير عربي واضح ومعاصر يقابل تركيب χρείαν ἔχειν، ويحفظ الدلالة القضائية لكلمة μαρτυρία.
- source_word: αὐτοὶ γὰρ
  choice: فنحن أنفسنا
  rationale: يحفظ توكيد αὐτοὶ، ويبين أنهم سمعوا مباشرة بأنفسهم.
- source_word: ἠκούσαμεν
  choice: قد سمعنا
  rationale: ينقل الحدث الماضي ذا النتيجة الحاضرة في هذا السياق، وتفيد «قد» تحقق السماع.
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: من فمه
  rationale: يحافظ على الصورة الأصلية المباشرة بلا إضافة «نفسه»، إذ إن التوكيد قائم بالفعل في «نحن أنفسنا».
theological_decisions:
- issue: تحديد مضمون ما سمعوه من يسوع
  choice: الإبقاء على الفعل «سمعنا» بلا مفعول به مصرح به
  alternative: سمعنا الشهادة من فمه / سمعنا ادعاءه من فمه
  rationale: النص اليوناني لا يذكر مفعولًا به بعد ἠκούσαμεν؛ لذلك تُحفظ صياغته المقتضبة وقوتها القضائية من غير تفسير لطبيعة القول المسموع.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، بصياغة طبيعية تحفظ الإيجاز والسياق القضائي والتوكيد في الأصل.
