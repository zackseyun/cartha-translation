  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: ar
  text: 'فقال له: «يا رب، أنا مستعد أن أذهب معك إلى السجن وإلى الموت».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: فقال
  rationale: أُدّي الضمير المستفاد من أداة التعريف بسياق الفعل العربي، ونقلت δέ بالفاء التي تلائم التعقيب مع وجود مقابلة خفيفة بكلام يسوع السابق.
- source_word: εἶπεν αὐτῷ
  choice: قال له
  rationale: ترجمة مباشرة تحفظ الضمير ولا تصرّح بمرجعه أكثر مما يفعل النص اليوناني.
- source_word: Κύριε
  choice: يا رب
  rationale: صيغة نداء عربية طبيعية تحفظ لقب κύριος وما يحمله من توقير ورنين لاهوتي دون اختزاله في معنى المعلّم وحده.
- source_word: μετὰ σοῦ
  choice: معك
  rationale: تنقل معنى المصاحبة الذي تدل عليه μετά مع المضاف إليه.
- source_word: ἕτοιμός εἰμι
  choice: أنا مستعد
  rationale: تعبير عربي واضح ينقل الاستعداد والإرادة، مع إبراز ضمير المتكلم بما يناسب ثقة بطرس المؤكدة.
- source_word: καὶ ... καὶ
  choice: إلى السجن وإلى الموت أيضًا
  rationale: تحفظ اقتران الوجهتين وتوكيد الثانية بصياغة عربية طبيعية؛ وتجنب تركيب «كلا... و...» غير الملائم هنا.
- source_word: εἰς φυλακὴν
  choice: إلى السجن
  rationale: تنقل دلالة الاتجاه في εἰς ومعنى الحبس في φυλακή بصورة مألوفة.
- source_word: εἰς θάνατον
  choice: إلى الموت
  rationale: تحفظ التوازي مع «إلى السجن» وتفيد الاستعداد للمضي حتى الموت.
- source_word: πορεύεσθαι
  choice: أن أذهب
  rationale: مقابل عربي طبيعي للمصدر اليوناني في موقع المتمم لعبارة الاستعداد.
theological_decisions:
- issue: ترجمة κύριος لقبًا ليسوع
  choice: يا رب
  alternative: يا معلّم
  rationale: «يا رب» تحفظ اللقب المباشر وثقله المسيحاني المحتمل، من غير أن تحسم وحدها جميع أبعاده اللاهوتية أو تختزله إلى سلطة التعليم.
