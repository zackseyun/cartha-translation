  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: ar
  text: 'فمَن هو الأعظم: المتكئ عند المائدة[a] أم الذي يخدم؟ أليس المتكئ عند المائدة؟ أمّا أنا فبينكم كالذي يخدم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «المتكئ». كان الآكلون في الولائم يتكئون، بينما يقوم الخادمون بخدمتهم.'
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: فمَن هو الأعظم
  rationale: تحافظ «فـ» على صلة التعليل بما قبلها، وتؤدي «مَن» الاستفهام عن الشخص، بينما تنقل «الأعظم» المقارنة في المنزلة من غير تفسير زائد.
- source_word: ὁ ἀνακείμενος
  choice: المتكئ إلى المائدة
  rationale: الفعل في سياق الطعام يدل على الاتكاء بحسب عادة الولائم القديمة؛ وإضافة «إلى المائدة» توضح السياق الضمني للقارئ المعاصر.
- source_word: ὁ διακονῶν
  choice: الذي يخدم
  rationale: صيغة الفاعل المضارع تصف من يقوم بالخدمة، ولا تستعمل اسمًا قد يوحي بمنصب كنسي أو بوضع العبودية.
- source_word: οὐχὶ
  choice: أليس
  rationale: تنقل السؤال البلاغي الذي يتوقع جوابًا بالإيجاب بصورة عربية واضحة وموجزة.
- source_word: ἐγὼ δὲ
  choice: أمّا أنا فـ
  rationale: تبرز المقابلة بين العرف الاجتماعي وسلوك يسوع، وتحافظ على توكيد الضمير اليوناني.
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: بينكم
  rationale: تعبير عربي طبيعي ينقل معنى الحضور في وسط الجماعة من غير تكلف.
- source_word: ὡς ὁ διακονῶν
  choice: كالذي يخدم
  rationale: تحافظ الكاف على معنى التشبيه أو الكيفية في ὡς، وتبقي التركيز على فعل الخدمة.
theological_decisions:
- issue: وصف يسوع لنفسه بلغة الخدمة
  choice: أمّا أنا فبينكم كالذي يخدم
  alternative: أمّا أنا ففي وسطكم كالخادم
  rationale: الأصل يستعمل اسم الفاعل من διακονέω لا اسمًا يدل بذاته على عبد أو على منصب ديني؛ لذلك تحافظ الصياغة الفعلية على صورة خدمة المائدة وعلى اتضاع يسوع من غير تحميل اللفظ دلالة عقدية زائدة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «المتكئ إلى المائدة» لإيضاح عادة الولائم القديمة، و«بينكم» بدل الصياغة الأشد حرفية «في وسطكم» لسلاسة التعبير.
