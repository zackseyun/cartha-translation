  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: ar
  text: ثم جاء يوم الفطير، الذي كان لا بدّ فيه من ذبح الفصح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خروف الفصح» أو «ذبيحة الفصح». يمكن أن تشير الكلمة اليونانية إلى الاحتفال بالفصح، أو، في هذا السياق، إلى الذبيحة نفسها.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: جاء
  rationale: الفعل مستعمل اصطلاحيًا لوصول يوم أو وقت، و«جاء» تعبير عربي طبيعي يحافظ على الصورة الزمنية.
- source_word: δὲ
  choice: ثم
  rationale: تفيد هنا تقدّم السرد وتسلسله، و«ثم» توضح الانتقال الزمني من غير إثقال.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: يوم الفطير
  rationale: يحافظ التعبير على إفراد «اليوم»، ويستعمل الاسم العربي المألوف للعيد المرتبط بالخبز غير المخمّر.
- source_word: ᾗ
  choice: الذي ... فيه
  rationale: تركيب عربي طبيعي يحفظ عود الاسم الموصول على «اليوم» ودلالته الزمنية.
- source_word: ἔδει
  choice: كان لا بدّ
  rationale: ينقل معنى الضرورة أو الوجوب في صيغة الماضي بوضوح، من غير تحديد زائد لمصدر الإلزام.
- source_word: θύεσθαι
  choice: ذبح
  rationale: في هذا السياق الشعائري يدل الفعل على ذبح الذبيحة؛ و«ذبح» يلائم الفصح في العربية ويحفظ الفعل المباشر دون إضافة تفسيرية إلى المتن.
- source_word: τὸ πάσχα
  choice: الفصح
  rationale: يحافظ على سعة اللفظ اليوناني، الذي قد يدل على العيد أو، في هذا السياق، ذبيحته، بينما يوضح فعل «ذبح» المقصود السياقي.
theological_decisions:
- issue: مرجع τὸ πάσχα في سياق الذبح الشعائري
  choice: إبقاء «الفصح» في المتن، مع حمل فعل «ذبح» للدلالة على الذبيحة في السياق.
  alternative: خروف الفصح؛ ذبيحة الفصح
  rationale: اللفظ اليوناني أوسع من «الخروف»، وقد يدل على الاحتفال أو الطعام أو الذبيحة. لذلك يحافظ «الفصح» على الغموض المعجمي الحقيقي، فيما تعرض الحاشية القراءتين الأكثر تصريحًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يوم الفطير» بوصفه التعبير الكتابي العربي المألوف، وحُفظت سعة «الفصح» مع توضيحها في الحاشية.
