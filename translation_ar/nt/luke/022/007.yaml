  source_fidelity: النص العربي ينقل بدقة تسلسل السرد في «ثم»، ووصول يوم الفطير، والضرورة المرتبطة بذلك اليوم. وعبارة «كان لا بدّ فيه من ذبح الفصح» تؤدي بصورة سليمة معنى ἔδει θύεσθαι τὸ πάσχα، من غير أن تفرض تحديدًا زائدًا لمرجع «الفصح».
  naturalness: «ثم جاء يوم الفطير» و«الذي كان لا بدّ فيه من ذبح الفصح» فصيحتان واضحتان في العربية المعيارية الحديثة. وتركيب «يوم الفطير» مألوف في الاستعمال الكتابي العربي ومناسب للسجل الوقور.
  terminology: المصطلحان «الفطير» و«الفصح» مستقران ومناسبان. واختيار «ذبح» ملائم للسياق الشعائري، بينما تبقي «الفصح» في المتن على السعة المعجمية للنص اليوناني. الحاشية تعرض البدائل التفسيرية المشروعة («خروف الفصح» و«ذبيحة الفصح») بوضوح.
