  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: ar
  text: 'فقالوا: «يا رب، انظر، هنا سيفان». فقال لهم: «يكفي».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كفى من هذا». وقد يكون المقصود إنهاء الحديث، لا أن سيفين كانا كافيين.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: فقالوا
  rationale: تؤدي الفاء وظيفة δέ بوصفها رابطًا سرديًا خفيفًا، وتصل الكلام بما قبله طبيعيًا من غير مبالغة في إفادة الاستدراك.
- source_word: Κύριε
  choice: يا رب
  rationale: صيغة النداء العربية الطبيعية، وتحفظ دلالة κύριος في مخاطبة يسوع واستعماله اللقبي في العهد الجديد.
- source_word: ἰδοὺ
  choice: انظر
  rationale: ينقل أداة التنبيه والإشارة بعبارة عربية حديثة واضحة، من غير اللجوء إلى «هوذا» الأشد تراثية.
- source_word: μάχαιραι
  choice: سيفان
  rationale: «سيف» المقابل العام المألوف لـ μάχαιρα، أما «خنجر» أو «سيف قصير» فيضيفان تحديدًا لا يفرضه السياق.
- source_word: ὧδε δύο
  choice: ههنا سيفان
  rationale: تحفظ دلالة المكان والعدد في ترتيب عربي طبيعي، مع تثنية الاسم كما تقتضي العربية.
- source_word: Ἱκανόν ἐστιν
  choice: هذا يكفي
  rationale: 'صياغة عربية موجزة وطبيعية تحفظ قدرًا من غموض العبارة: فقد يعود «هذا» إلى السيفين أو إلى الكلام الدائر، من غير حسم تفسيري في المتن.'
theological_decisions:
- issue: غموض جواب يسوع Ἱκανόν ἐστιν
  choice: هذا يكفي
  alternative: كفى من هذا
  rationale: قد تُفهم العبارة على أن السيفين كافيان، أو على أنها إنهاء للحديث. يحفظ المتن هذا التوتر، وتوضح الحاشية الاحتمال الآخر من غير فرضه.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. اختيرت «انظر» بدل «هوذا» لسهولة الفهم، و«ههنا» لإبراز الدلالة المكانية من غير إطالة. وُضعت علامة الحاشية بعد جواب يسوع لأنها تتعلق بعبارته.
