  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: ar
  text: 'فلمّا رأته إحدى الخادمات جالسًا عند الضوء[a]، حدّقت إليه وقالت: «هذا أيضًا كان معه».


    [a] أو: «في الضوء». يمكن أن تدل العبارة اليونانية على الجلوس قرب مصدر الضوء، كما يمكن أن تدل على الجلوس في المكان المضاء.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الضوء». يمكن أن تدل العبارة اليونانية على الجلوس قرب مصدر الضوء، كما يمكن أن تدل على الجلوس في المكان المضاء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα δὲ
  choice: فلمّا رأته
  rationale: صيغت أداة الانتقال السردي مع اسم الفاعل الماضي في تركيب عربي طبيعي يبيّن أن رؤيتها له سبقت تدقيقها فيه وقولها.
- source_word: παιδίσκη τις
  choice: إحدى الخادمات
  rationale: تنقل معنى فتاة تعمل خادمة مع دلالة التنكير في τις، من غير مبالغة في إبراز وضعها القانوني بوصفها أَمَة.
- source_word: καθήμενον πρὸς τὸ φῶς
  choice: جالسًا عند الضوء
  rationale: يحافظ «عند» على علاقته المكانية بالضوء من غير أن يحدّد أن المقصود داخل البقعة المضيئة أو بجوار مصدرها؛ وقد أُثبت البديل في الحاشية.
- source_word: ἀτενίσασα αὐτῷ
  choice: حدّقت إليه
  rationale: ينقل النظر المركز والمتواصل الذي يدل عليه الفعل، بصياغة عربية واضحة وموجزة.
- source_word: Καὶ οὗτος
  choice: هذا أيضًا
  rationale: يحفظ قوة اسم الإشارة ودلالة الإضافة في καί من غير إضافة «الرجل» التي لا يصرّح بها النص.
- source_word: σὺν αὐτῷ ἦν
  choice: كان معه
  rationale: ترجمة مباشرة لدلالة المصاحبة، مع إبقاء مرجع الضمير كما هو في الأصل.
