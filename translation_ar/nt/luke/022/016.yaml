source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: ar
  text: 'فإني أقول لكم: لن آكله البتة حتى يتحقق في ملكوت الله.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لن آكله مرة أخرى حتى يتحقق في ملكوت الله». ينفي التعبير اليوناني الأكل في المستقبل نفيًا مؤكدًا؛ وقد تُفهم «مرة أخرى» من السياق، لكنها غير مذكورة صراحة في النص اليوناني.'
    reason: lexical_alternative
  - marker: b
    text: يعود الضمير إلى الفصح المذكور في الآية السابقة.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: فإني أقول لكم
  rationale: تحفظ «فـ» الصلة التفسيرية التي تفيدها γάρ بما قبلها، و«أقول لكم» صيغة عربية طبيعية وقريبة من تركيب الأصل.
- source_word: ὅτι
  choice: ':'
  rationale: أُديت أداة إدخال مضمون القول بعلامة النقطتين، وهي صياغة عربية طبيعية لا تُسقط وظيفتها التركيبية.
- source_word: οὐ μὴ φάγω
  choice: لن آكله البتة
  rationale: يجمع «لن» و«البتة» للتعبير عن النفي المستقبلي المؤكد الذي تؤديه οὐ μή مع صيغة الالتزام، من غير إدخال «مرة أخرى» في المتن.
- source_word: αὐτό
  choice: ـه
  rationale: الضمير يعود بحسب السياق إلى الفصح المذكور في الآية السابقة، مع إبقاء الإحالة موجزة كما في اليونانية.
- source_word: ἕως ὅτου
  choice: حتى
  rationale: تؤدي الحد الزمني بوضوح وطبيعية في العربية.
- source_word: πληρωθῇ
  choice: يتحقق
  rationale: ينقل معنى بلوغ الشيء تمامه أو وفاءه، مع الحفاظ على دلالة التحقيق الأخروية من غير تحديد كيفية هذا التحقيق.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: في ملكوت الله
  rationale: «ملكوت الله» تعبير عربي كتابي مألوف يحفظ ارتباط βασιλεία بسلطان الله وحيز حكمه، وتحفظ «في» حرف الجر الوارد في الأصل.
theological_decisions:
- issue: مرجع الضمير αὐτό
  choice: إبقاء الضمير في المتن، على أن مرجعه بحسب السياق هو الفصح المذكور في الآية السابقة.
  alternative: التصريح بعبارة «هذا الفصح» أو قصر المرجع على وجبة الفصح وحدها.
  rationale: الإبقاء على الضمير يحفظ إيجاز الأصل ولا يحسم هل المقصود وجبة الفصح تحديدًا أم الاحتفال بالفصح على نحو أوسع.
- issue: معنى تحقق الفصح في ملكوت الله
  choice: 'صياغة مفتوحة: «حتى يتحقق في ملكوت الله».'
  alternative: تفسيره بأنه يتحقق بمجيء الملكوت أو في الوليمة المسيانية.
  rationale: يشير النص إلى تمام أخروي، لكنه لا يحدد هنا الحدث أو الكيفية؛ لذلك لا تُفرض قراءة عقائدية أضيق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «البتة» لتأكيد النفي مع بقائه مفهومًا، وحُفظ «ملكوت الله» بوصفه مصطلحًا كتابيًا عربيًا راسخًا. وُضعت علامتا الحاشيتين في المتن كما يلزم.
