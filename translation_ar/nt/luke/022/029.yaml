  source_fidelity: الفعل «أجعل» لا ينقل بدقة كافية في العربية معنى διατίθεμαι هنا، إذ قد يُفهم منه إنشاء ملكوت أو صنعه، لا منحه أو إسناده. «أمنح» ينقل بأمانة معنى الإسناد/المنح في السياق، مع الحفاظ على إمكان القراءة العهدية في الحاشية. وتكرار «ملكوتًا» في العربية أوضح وأفصح من تعليق المفعول المؤخر بالفعلين.
  naturalness: الصياغة الحالية «أجعل لكم، كما جعل لي أبي، ملكوتًا» متكلفة في العربية المعاصرة، ويجعل تأخير «ملكوتًا» علاقة المفعول بالفعلين غير واضحة. الصياغة المعدلة طبيعية ومباشرة وتحفظ المقابلة.
  terminology: «ملكوت» مناسب في السجل الكتابي العربي لـ βασιλεία. و«أمنح» مناسب لمعنى الإسناد أو التفويض من غير فرض معنى «العهد» في المتن. أما «أعهد» فيبقى بديلًا مشروعًا في الحاشية.
