translation:
  language: ar
  text: وأنا أمنحكم ملكوتًا، كما منحني أبي ملكوتًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأنا أعهد إليكم بملكوت، كما عهد إليَّ أبي بملكوت». قد يحمل الفعل اليوناني معنى إقامة عهد، كما قد يدل على الترتيب أو التخصيص أو الإسناد.'
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ
  choice: وأنا
  rationale: تحفظ الواو صلة الكلام بما قبله، ويُبرز الضمير المتكلم شخص يسوع من غير مبالغة بإضافة «أيضًا».
- source_word: διατίθεμαι
  choice: أجعل لكم
  rationale: «أجعل» عربية واضحة تحتمل معنى التخصيص والإسناد، وتناسب كون «ملكوتًا» مفعولًا مشترك الدلالة مع الفعل الموازي، من غير أن تفرض في المتن معنى عهديًا صريحًا.
- source_word: ὑμῖν
  choice: لكم
  rationale: تنقل دلالة المتلقين في صيغة عربية موجزة وطبيعية.
- source_word: καθὼς
  choice: كما
  rationale: تُظهر المقابلة المباشرة بين فعل يسوع وفعل الآب.
- source_word: διέθετό
  choice: جعل
  rationale: تكرار الفعل نفسه يحفظ التوازي اللفظي المقصود مع διατίθεμαι، ويعبّر الماضي عن فعل الآب السابق.
- source_word: μοι
  choice: لي
  rationale: صيغة عربية مباشرة لدلالة المتلقي.
- source_word: ὁ πατήρ μου
  choice: أبي
  rationale: تعبير عربي طبيعي يحفظ علاقة البنوة.
- source_word: βασιλείαν
  choice: ملكوتًا
  rationale: «ملكوت» لفظ واضح في السياق الكتابي يدل على السلطان الملكي أو نطاقه، ووضعه في ختام الجملة يحفظ ترتيب اليونانية ويتيح تعلّقه دلاليًا بالفعلين.
theological_decisions:
- issue: هل يُصرَّح بالمعنى العهدي للفعل διατίθεμαι؟
  choice: أجعل
  alternative: أعهد إليكم بملكوت، كما عهد إليَّ أبي به
  rationale: يمكن أن يحمل الفعل معنى العهد أو الترتيب والتخصيص. اختير فعل أوسع في المتن كيلا يُحسم الاحتمال اللاهوتي، مع إثبات القراءة العهدية في الحاشية.
- issue: تعلّق «ملكوتًا» بالفعلين
  choice: إبقاء «ملكوتًا» في آخر الجملة بوصفه متعلقًا دلاليًا بفعل يسوع وفعل الآب
  alternative: وأنا أجعل لكم ملكوتًا، كما جعل أبي لي مثله
  rationale: يحفظ هذا ترتيب المصدر وتوازي الفعلين، لكنه قد يبدو أقل اعتيادًا قليلًا في العربية؛ لذلك ذُكر البديل الأوضح في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة وموقرة. حُفظ ترتيب الجملة اليونانية بوضع «ملكوتًا» في الختام، وحُفظ التوازي بتكرار «جعل»، مع بيان الاحتمال العهدي والصياغة العربية الأكثر تصريحًا في الحاشيتين.
