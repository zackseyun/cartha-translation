  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: ar
  text: 'وبعد أن غطّوه[a]، ظلّوا يسألونه قائلين: «تنبّأ! مَن الذي ضربك؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عصبوا عينيه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: بعد أن غطّوه
  rationale: ينقل معنى التغطية أو الحجب من غير أن يحدّد وسيلته، بينما يدل السياق على حجب النظر؛ لذلك يُذكر «عصبوا عينيه» بديلًا في الحاشية.
- source_word: ἐπηρώτων
  choice: ظلّوا يسألونه
  rationale: يعكس صيغة الماضي الناقص الدالة هنا على الاستمرار أو التكرار، ولا يختزل الفعل في سؤال وقع مرة واحدة.
- source_word: λέγοντες
  choice: قائلين
  rationale: صياغة عربية طبيعية تحافظ على اسم الفاعل الذي يقدّم مضمون سؤالهم التهكمي.
- source_word: Προφήτευσον
  choice: تنبّأ!
  rationale: أمر مباشر يحفظ نبرة التهكم والتحدي في اليونانية من غير إضافة «لنا» غير الواردة في النص.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: مَن الذي ضربك؟
  rationale: ينقل اسم الفاعل المعرّف ὁ παίσας بصيغة موصولية عربية طبيعية، ويؤدي معنى الضرب بوضوح ووقار.
theological_decisions:
- issue: هل يُصرَّح بأن عيني يسوع كانتا معصوبتين؟
  choice: الإبقاء على التعبير الأوسع «غطّوه» في المتن
  alternative: «عصبوا عينيه»
  rationale: يفيد السياق أنهم حجبوا عنه الرؤية، لكن الفعل اليوناني نفسه يعني التغطية أو الحجب ولا يعيّن طريقة ذلك؛ لذا يحافظ المتن على عموم اللفظ، وتعرض الحاشية القراءة السياقية الشائعة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ظلّوا» لإظهار استمرار الفعل، وحُفظ إيجاز الأمر التهكمي «تنبّأ!» وغموض طريقة التغطية في الأصل.
