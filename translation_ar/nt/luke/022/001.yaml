  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: ar
  text: وكان عيد الفطير[a]، الذي يُدعى الفصح، يقترب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان الفصح وعيد الفطير مناسبتين وثيقتي الصلة، وكان من الممكن في الاستعمال اليهودي أن يُشار إليهما معًا أو بأسماء متداخلة.
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: كان يقترب
  rationale: ينقل صيغة الماضي الناقص اليونانية، التي تصوّر اقتراب العيد بوصفه حدثًا جاريًا، في تعبير عربي طبيعي.
- source_word: δὲ
  choice: وَ
  rationale: أداة انتقال سردي خفيفة؛ تنقلها الواو العربية بسلاسة من غير إضفاء معنى زمني أو تقابلي زائد.
- source_word: ἡ ἑορτὴ τῶν ἀζύμων
  choice: عيد الفطير
  rationale: تعبير عربي واضح ومستقر لاسم العيد اليهودي، و«الفطير» يدل على الخبز غير المخمّر في هذا السياق.
- source_word: ἡ λεγομένη
  choice: الذي يُدعى
  rationale: يحافظ على القوة التفسيرية للتركيب الوصفي، مع عود الضمير إلى «عيد».
- source_word: Πάσχα
  choice: الفصح
  rationale: الاسم العربي الشائع للعيد اليهودي المقصود، وهو أوضح من النقل الصوتي.
theological_decisions:
- issue: العلاقة بين عيد الفطير والفصح
  choice: إبقاء صياغة لوقا التي تعرّف عيد الفطير بأنه «يُدعى الفصح».
  alternative: الفصل الاصطلاحي الصارم بين الفصح وعيد الفطير في الترجمة.
  rationale: يعرض النص الاسمين في علاقة تعريفية، بما ينسجم مع تداخل استعمالهما للدلالة على موسم العيد، ولا ينبغي للترجمة أن تفرض تمييزًا زمنيًا أدق مما تقوله العبارة اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «عيد الفطير» لكونه موجزًا ومألوفًا، وحُفظت البنية التفسيرية والتدرج المستمر في اقتراب العيد.
