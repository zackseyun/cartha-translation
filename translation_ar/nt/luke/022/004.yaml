source:
  edition: SBLGNT
  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: ar
  text: فذهب وتباحث مع رؤساء الكهنة وقادة حرس الهيكل في كيفية تسليمه إليهم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خيانته». يمكن أن يعني الفعل اليوناني «يسلِّم» أو «يدفع إلى أيدي آخرين»، وفي هذا السياق يحمل معنى الخيانة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθὼν
  choice: فذهب
  rationale: اسم فاعل ماضٍ يفيد فعلًا سابقًا للفعل الرئيس، وتؤدي الفاء تتابع الحدثين بإيجاز طبيعي في العربية.
- source_word: συνελάλησεν
  choice: وتباحث مع
  rationale: يدل الفعل على الحديث المشترك والتشاور، و«تباحث مع» تنقل المعنى التداولي لا مجرد الكلام.
- source_word: ἀρχιερεῦσιν
  choice: رؤساء الكهنة
  rationale: التعبير العربي المألوف للسلطات الكهنوتية العليا، لا لعدة أشخاص يشغلون منصب رئيس الكهنة في وقت واحد.
- source_word: στρατηγοῖς
  choice: قادة حرس الهيكل
  rationale: السياق اللوقاوي في أورشليم يشير إلى القادة المرتبطين بحرس الهيكل، لا إلى قادة عسكريين رومانيين؛ والتصريح بالإضافة أوضح للقارئ العربي.
- source_word: τὸ πῶς
  choice: في كيفية
  rationale: ينقل تركيب المقالة مع أداة الكيفية بوصفه مضمون التباحث، بصياغة عربية سليمة.
- source_word: παραδῷ
  choice: تسليمه
  rationale: يحافظ على المعنى الأساسي، أي جعله في أيديهم، من غير أن يحصر اللفظ في المعنى التفسيري «خيانته».
- source_word: αὐτοῖς ... αὐτόν
  choice: تسليمه إليهم
  rationale: يميّز بوضوح بين المفعول به، أي يسوع، والجهة التي سيُسلَّم إليها.
theological_decisions:
- issue: دلالة παραδῷ في فعل يهوذا
  choice: تسليمه إليهم
  alternative: خيانته
  rationale: السياق يجعل الفعل خيانة، لكن اللفظ اليوناني أوسع ويفيد التسليم أو الدفع إلى يد آخرين؛ لذا حُفظ المعنى المعجمي في المتن، وذُكر البديل التفسيري في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. أُدرج معنى حرس الهيكل في المتن لأن «القادة» أو «الضباط» وحدهما قد يوحيان في العربية بقوات رومانية أو حديثة؛ وبذلك لا تلزم حاشية ثقافية ثانية.
