review_pass:
  verdict: revise
  source_fidelity: 'ينقل النص عناصر اليونانية الأساسية بأمانة: غاية الأكل والشرب على مائدة يسوع في ملكوته، ثم الجلوس على عروش مع قضاء أسباط إسرائيل الاثني عشر. لكن «تجلسون» بعد «لكي» قد تُقرأ في العربية امتدادًا للغرض المنصوب، بينما καθήσεσθε فعل مستقبل خبري مستقل؛ لذا يلزم إظهار الاستقبال بـ«وستجلسون».'
  naturalness: الصياغة فصيحة وواضحة عمومًا. إضافة السين تجعل العلاقة النحوية والزمنية بين شطري الآية طبيعية وغير ملتبسة. «على مائدتي» و«في ملكوتي» و«أسباط إسرائيل الاثني عشر» تعبيرات معيارية مناسبة.
  terminology: «ملكوتي» و«عروش» و«أسباط إسرائيل الاثني عشر» مناسبة. «تدينون» يحافظ على المعنى القضائي المباشر لـκρίνω من غير فرض تفسير مذهبي. بديل «تحكمون في» في الحاشية غير سلس؛ والأدق والأيسر «تحكمون أسباط إسرائيل الاثني عشر» أو «تتولون حكم أسباط إسرائيل الاثني عشر».
  issues:
