  rationale: عُدِّلت صيغة «تجلسون» إلى «وستجلسون» لإظهار المستقبل الخبري المستقل في اليونانية، ونُقِّحت صياغة البديل الحاشي لتكون عربية طبيعية. ولا تغيّر هذه التعديلات معنى المقطع أو تحفظه اللاهوتي.
