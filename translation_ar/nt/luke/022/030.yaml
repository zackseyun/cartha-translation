    rationale: الفعل اليوناني καθήσεσθε مستقبل خبري، وهو معطوف بعد جملة ἵνα لا داخلها. قد توهم الصياغة الحالية بأن الجلوس غاية منصوبة مثل «تأكلوا وتشربوا». «وستجلسون» تحفظ الاستقلال والخبرية المستقبلية.
  - severity: low
    issue: صياغة البديل الحاشي «تحكمون في».
    rationale: هي أقل سلاسة في العربية مع مفعول مباشر مثل «أسباط إسرائيل». حذف حرف الجر يقدّم بديلًا عربيًا طبيعيًا من دون تغيير مدى الدلالة.
