  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: ar
  text: لكي تأكلوا وتشربوا على مائدتي في ملكوتي، وستجلسون على عروش تدينون أسباط إسرائيل الاثني عشر[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «تحكمون» أو «تتولون حكم» أسباط إسرائيل الاثني عشر.
    reason: بدائل معجمية تحفظ إمكان أن يشمل κρίνω القضاء أو ممارسة الحكم.
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ دلالة الغاية أو النتيجة المرتبطة بالوعد السابق، بصياغة عربية واضحة وطبيعية.
- source_word: ἔσθητε καὶ πίνητε
  choice: تأكلوا وتشربوا
  rationale: ينقل الفعلان بصيغة المضارع المنصوب بعد «لكي» قوة صيغة الاحتمال اليونانية الواقعة تحت ἵνα من غير تكلّف.
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: على مائدتي
  rationale: تعبير عربي مألوف يحفظ صورة الشركة حول المائدة.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: في ملكوتي
  rationale: «ملكوتي» تحافظ على معنى المجال الملكي والسلطان معًا، وتلائم سياق الوليمة والعروش.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: تجلسون على عروش
  rationale: صياغة مباشرة تحفظ زمن المستقبل وصورة الجلوس على العروش بما فيها من دلالة ملكية وقضائية.
- source_word: κρίνοντες
  choice: تدينون
  rationale: ينقل المعنى القضائي المباشر للفعل، مع إبقاء احتمال الحكم أو الإدارة في الحاشية كي لا يُحسم اتساع الدلالة اليونانية.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: أسباط إسرائيل الاثني عشر
  rationale: صياغة عربية معيارية شفافة تحفظ الإشارة العهدية إلى إسرائيل بأسباطه الاثني عشر.
theological_decisions:
- issue: طبيعة الدور المستقبلي للتلاميذ تجاه أسباط إسرائيل الاثني عشر
  choice: الإبقاء على اللفظ القضائي «تدينون» في المتن
  alternative: «تحكمون في» أو «تتولون حكم» أسباط إسرائيل الاثني عشر
  rationale: يمكن أن يدل κρίνω على القضاء، وقد يتسع للحكم والسلطة الإدارية. لذلك يحافظ المتن على المعنى القضائي الأقرب، وتعرض الحاشية البدائل من غير حصر الدور في الإدانة وحدها أو في الإدارة وحدها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. وُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة، وحُفظت صور المائدة والملكوت والعروش والأسباط.
