    text: 'يمكن أن تدل الكلمة اليونانية على وعاء فخاري تحديدًا؛ ومن ثم يمكن ترجمتها: «جرّة فخارية فيها ماء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ها إنكما
  rationale: تنقل أداة التنبيه والإشارة بصياغة عربية فصيحة طبيعية، وتلفت النظر إلى العلامة الآتية دون استعمال تعبير متكلّف.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: حين تدخلان المدينة
  rationale: تفيد العبارة اليونانية الظرف الزمني، والمخاطبان اثنان بحسب سياق إرسال التلميذين في العدد السابق.
- source_word: συναντήσει ὑμῖν
  choice: سيلقاكما
  rationale: صياغة عربية موجزة وطبيعية تحفظ زمن المستقبل ودلالة اللقاء.
- source_word: ἄνθρωπος
  choice: رجل
  rationale: الاسم مذكّر ويشير هنا إلى شخص ذكر بعينه.
- source_word: κεράμιον ὕδατος
  choice: جرّة ماء
  rationale: تعبير واضح وطبيعي يدل على وعاء للماء، مع بيان احتمال كونه فخاريًا في الحاشية دون زيادة التحديد في المتن.
- source_word: βαστάζων
  choice: يحمل
  rationale: يحفظ معنى الفعل المستمر المصاحب للقاء بصياغة سردية مألوفة.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: اتبعاه
  rationale: أمر مباشر بصيغة المثنى الملائمة للمخاطبين.
- source_word: οἰκίαν
  choice: البيت
  rationale: مقابل مباشر وطبيعي للاسم في سياق الحركة إلى مبنى محدد.
- source_word: εἰς ἣν εἰσπορεύεται
  choice: الذي يدخله
  rationale: تحدد جملة الصلة البيت المقصود وتحفظ معنى الدخول إليه بعبارة عربية سلسة.
