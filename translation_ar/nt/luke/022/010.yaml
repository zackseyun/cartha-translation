  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: ar
  text: 'فقال لهما: «ها إنكما حين تدخلان المدينة سيلقاكما رجل يحمل جرّة ماء[a]؛ فاتبعاه إلى البيت الذي يدخله.»'
  philosophy: optimal-equivalence
  footnotes:
