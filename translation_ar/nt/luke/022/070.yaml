  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: ar
  text: 'فقالوا جميعًا: «أفأنت إذًا ابن الله؟» فقال لهم: «أنتم تقولون إني أنا هو».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي بصياغة عربية أكثر اصطلاحية: «كما تقولون» أو «أنتم تقولون ذلك». يفيد جواب يسوع الإقرار في هذا السياق، لكن اليونانية حرفيًا أقرب إلى: «أنتم تقولون إني أنا هو».'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: جميعًا
  rationale: ينقل الصفة المستعملة اسميًا وإحاطتها بأفراد الجماعة بصياغة عربية طبيعية.
- source_word: οὖν
  choice: إذًا
  rationale: تحفظ دلالة الاستنتاج في السؤال بناءً على الكلام السابق.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ابن الله
  rationale: الصياغة العربية المألوفة والدقيقة للقب المسيحاني، مع بقاء التعريف بالإضافة.
- source_word: ἔφη
  choice: فقال
  rationale: مقابل عربي طبيعي ومحايد لفعل القول في هذا السياق.
- source_word: Ὑμεῖς
  choice: أنتم
  rationale: إظهار الضمير المنفصل يحفظ توكيد الضمير الصريح في اليونانية ويعيد صياغة القول إلى السائلين.
- source_word: λέγετε
  choice: تقولون
  rationale: يحفظ زمن المضارع وتعدد المخاطَبين بصورة مباشرة.
- source_word: ὅτι
  choice: إنَّ
  rationale: تُدخل مضمون ما يقولونه في عربية فصيحة طبيعية.
- source_word: ἐγώ εἰμι
  choice: إني أنا هو
  rationale: يحفظ توكيد ἐγώ ويستكمل الخبر المفهوم من السياق في العربية، من غير تحويل الجواب إلى تقرير صريح مستقل.
theological_decisions:
- issue: هل يُصاغ جواب يسوع إقرارًا صريحًا أم جوابًا غير مباشر يرد العبارة إلى سائليه؟
  choice: أنتم تقولون إني أنا هو
  alternative: 'نعم، أنا هو؛ أو: هو كما تقولون'
  rationale: تحفظ الصياغة بنية اليونانية وتوكيد الضمير والتوتر المقصود، مع بيان القوة الإقرارية المحتملة في الحاشية بدل حسمها داخل المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «أفأنت إذًا» لنقل الاستنتاج في السؤال بسلاسة، وأُبقي جواب يسوع قريبًا من تركيبه اليوناني مع حاشية توضح المعنى الاصطلاحي.
