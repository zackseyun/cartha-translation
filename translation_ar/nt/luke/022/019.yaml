base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: ar
  text: 'وأخذ خبزًا، وشكر، وكسره، وأعطاهم إياه قائلًا: «هذا هو جسدي، الذي يُبذل لأجلكم.[a] داوموا على فعل هذا لذكري».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'بعض المخطوطات تحذف: «الذي يُبذل لأجلكم. داوموا على فعل هذا لذكري».'
    reason: textual_variant
  - marker: b
    text: 'يمكن أيضًا ترجمة «يُبذل»: «يجري بذله». أما عبارة «هذا هو جسدي» فمترجمة كما وردت؛ إذ يستعمل النص اليوناني فعل «يكون»، مع أن بعضهم يفسرها بمعنى «هذا يرمز إلى جسدي».'
    reason: lexical_and_interpretive_alternative
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: وأخذ خبزًا
  rationale: صياغة سردية عربية طبيعية تحفظ تعاقب الأفعال، و«خبزًا» ترجمة مباشرة للاسم النكرة في سياق المائدة.
- source_word: εὐχαριστήσας
  choice: وشكر
  rationale: ينقل فعل الشكر السابق لكسر الخبز بإيجاز طبيعي، من غير إضافة مفعول غير مصرّح به في النص اليوناني.
- source_word: ἔκλασεν καὶ ἔδωκεν αὐτοῖς
  choice: وكسره، وأعطاهم إياه
  rationale: تُظهر الضمائر العربية أن المكسور والمُعطى هو الخبز، وتحفظ ترتيب الفعلين.
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: هذا هو جسدي
  rationale: يحفظ فعل الكينونة الصريح ولا يستبدله بتفسير مثل «يرمز إلى»، وبذلك يبقي التوتر اللاهوتي قائمًا.
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: الذي يُبذل لأجلكم
  rationale: «يُبذل» تعبير عربي مفهوم يلائم إعطاء الجسد في هذا السياق، و«لأجلكم» تنقل الدلالة النفعية في ὑπέρ من دون حصرها في نظرية تفسيرية بعينها.
- source_word: τοῦτο ποιεῖτε
  choice: داوموا على فعل هذا
  rationale: يُظهر الأمر الحاضر معنى الممارسة المستمرة أو المتكررة، مع بقاء العبارة واضحة في العربية الحديثة.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: لذكري
  rationale: صياغة عربية موجزة وطبيعية تدل على التذكّر التذكاري المرتبط بالفعل المتكرر، لا على مجرد خاطر ذهني عابر.
theological_decisions:
- issue: دلالة «هذا هو جسدي» في سياق العشاء
  choice: الإبقاء على «هذا هو جسدي» كما يدل عليه فعل الكينونة اليوناني
  alternative: «هذا يرمز إلى جسدي» أو «هذا يمثل جسدي»
  rationale: النص نفسه يقول «هو»، ولا ينبغي للترجمة أن تحسم خلافًا أسراريًا بإدخال تفسير مذهبي.
- issue: الوضع النصي للعبارة الأطول في لوقا 22:19
  choice: إثبات العبارة في المتن مع تنبيه هامشي إلى حذفها في بعض المخطوطات
  alternative: إنهاء الآية بعد «هذا هو جسدي»
  rationale: النص المقدم في SBLGNT يورد العبارة الأطول مع علامة على وجود نقاش نصي؛ لذلك يُحفظ النص العامل ويُذكر البديل المهم بشفافية.
- issue: قوة صيغة الأمر الحاضر ποιεῖτε
  choice: داوموا على فعل هذا
  alternative: افعلوا هذا
  rationale: تُظهر الصياغة إمكان الدلالة على الاستمرار أو التكرار في هذا السياق من غير بناء عقيدة تفصيلية على الجانب الصرفي وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، بتراكيب سردية طبيعية. استُخدم «داوموا على فعل هذا» لإبراز قوة الممارسة المتكررة، وحُفظت عبارة «هذا هو جسدي» بلا تفسير مذهبي. وُضعت علامتا الحاشيتين في المتن، مع دمج البديل المعجمي والتنبيه التفسيري في الحاشية [b].
