  source_fidelity: 'ينقل النص بنية اليونانية ومعانيها الأساسية بأمانة: أداة التعليل، وضرورة إتمام المكتوب، وعبارة الاقتباس، والعبارة الختامية ذات الدلالة المحتملة للنهاية/الاكتمال. إلا أن «الخارجين عن الشريعة» أضيق وأشد إيحاءً بالتمرّد من ἀνόμων، التي تصف على نحو أعمّ من يخالفون الشريعة أو الأثمة.'
