  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: ar
  text: 'لأنني أقول لكم: لا بد أن يتمّ فيَّ هذا المكتوب: «وأُحصي مع مخالفي الشريعة». فإن ما يتعلق بي يبلغ نهايته[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وعُدَّ مع الأثمة» (إشعياء 53:12). ويمكن ترجمة الجملة الأخيرة أيضًا: «فإن ما يتعلق بي يتمّ» أو «يبلغ تمامه».'
    reason: حفظ الصياغة التقليدية لاقتباس إشعياء وبيان المجال الدلالي المحتمل لعبارة τέλος ἔχει.
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: لأني أقول لكم
  rationale: يحفظ أداة التعليل γάρ وصيغة القول المباشرة بعبارة عربية واضحة وطبيعية.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: هذا المكتوب
  rationale: يحافظ على اسم الإشارة واسم المفعول من غير إضافة لفظ «الكتاب» غير الصريح في اليونانية.
- source_word: δεῖ τελεσθῆναι
  choice: لا بد أن يتمّ
  rationale: ينقل معنى الضرورة في δεῖ، ويتيح للفعل τελεσθῆναι معنى الإتمام والتحقق في سياق النص النبوي دون الإفراط في التفسير.
- source_word: ἐν ἐμοί
  choice: فيَّ
  rationale: ترجمة مباشرة لحرف الجر، وتحفظ إمكان فهم العبارة بمعنى التحقق في شخص يسوع أو في ما يجري له.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: وأُحصي مع الخارجين عن الشريعة
  rationale: «أُحصي» يقابل ἐλογίσθη، و«الخارجون عن الشريعة» ينقل ἄνομοι بوضوح أكبر من اللفظ الحرفي الملتبس «بلا شريعة»، مع إبقاء الصياغة التقليدية في الحاشية.
- source_word: τὸ περὶ ἐμοῦ
  choice: ما يخصّني
  rationale: صياغة عربية طبيعية للتركيب الاسمي، من غير تحديد زائد لما يتعلق بيسوع.
- source_word: τέλος ἔχει
  choice: يبلغ نهايته
  rationale: يحفظ صورة بلوغ النهاية أو الاكتمال، ولا يحصر العبارة في «التحقق» وحده مع أن السياق يسمح به.
theological_decisions:
- issue: صياغة اقتباس إشعياء 53:12
  choice: وأُحصي مع الخارجين عن الشريعة
  alternative: وعُدَّ مع المذنبين
  rationale: الاختيار الرئيس أقرب إلى ἀνόμων، في حين تحفظ الحاشية الصياغة العربية التقليدية والمألوفة للاقتباس.
- issue: دلالة τέλος ἔχει
  choice: ما يخصّني يبلغ نهايته
  alternative: ما يخصّني يتمّ / يبلغ تمامه
  rationale: العبارة اليونانية تحتمل النهاية والاكتمال أو التحقق. تحافظ الصياغة الرئيسة على هذا التوتر الدلالي، وتعرض الحاشية بدائل ممكنة دون حسم لاهوتي زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي إبقاء الصلة التعليلية، وضرورة إتمام المكتوب، والغموض المقصود في العبارة الأخيرة، مع تجنب المصطلحات الطائفية أو التفسير العقائدي الزائد.
