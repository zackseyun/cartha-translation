source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: ar
  text: 'فقال بطرس: «يا رجل، لا أعرف ما تقول». وفي الحال، وبينما كان لا يزال يتكلم، صاح ديك.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي أطلق الديك صياحه.
    reason: إيضاح لغوي للعبارة التي تفيد صياح الديك، مع الحفاظ في المتن على التعبير العربي الموجز والطبيعي.
lexical_decisions:
- source_word: δὲ
  choice: فـ
  rationale: تربط الجملة بسياق الإنكار السابق وتُبرز رد بطرس وتعاقب الحدث من غير إثقال الأسلوب بأداة استدراك أقوى مما يقتضيه السياق.
- source_word: Ἄνθρωπε
  choice: يا رجل
  rationale: نداء مباشر لرجل مفرد، يحفظ نبرة الخطاب الصريحة من غير تحويله إلى لقب تهذيبي مثل «يا سيدي».
- source_word: οὐκ οἶδα
  choice: لا أعرف
  rationale: ينقل المعنى الحاضر للفعل οἶδα مع النفي بصياغة عربية واضحة ومباشرة.
- source_word: ὃ λέγεις
  choice: ما تقول
  rationale: ترجمة مباشرة تحافظ على مضمون إنكار بطرس دون تفسيره بعبارة مثل «ما تقصده».
- source_word: παραχρῆμα
  choice: في الحال
  rationale: تؤدي معنى وقوع الحدث بلا تأخير، بلغة عربية طبيعية ذات سجل سردي رصين.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: وبينما كان لا يزال يتكلم
  rationale: تحفظ التزامن الذي تفيده صيغة المضاف المطلق، كما تُبقي توكيد ἔτι على استمرار كلامه.
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: صاح ديك
  rationale: الفعل «صاح» تعبير عربي طبيعي لصوت الديك، و«ديك» يقابل ἀλέκτωρ بوضوح.
theological_decisions: []
