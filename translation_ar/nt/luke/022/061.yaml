  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: ar
  text: 'فالتفت الرب ونظر إلى بطرس[a]، فتذكّر بطرس كلام الرب، كيف قال له: «اليوم، قبل أن يصيح ديك، ستنكرني ثلاث مرات».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأمعن النظر في بطرس»؛ فقد يدل الفعل اليوناني على نظرة مباشرة أو ثابتة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: التفت
  rationale: ينقل اسم الفاعل الأُحادي بوصفه فعلًا سابقًا للنظر، بصياغة عربية طبيعية تحافظ على تسلسل الحدثين.
- source_word: κύριος
  choice: الرب
  rationale: يحفظ اللقب المستعمل ليسوع هنا وقوته في سياق العهد الجديد، من غير تضييقه إلى معنى «المعلّم» أو «السيد» فحسب.
- source_word: ἐνέβλεψεν
  choice: نظر إلى
  rationale: ترجمة واضحة وطبيعية، مع إبقاء احتمال دلالة الفعل على نظرة مباشرة أو متفحصة في الحاشية دون المبالغة في المتن.
- source_word: ὑπεμνήσθη
  choice: تذكّر
  rationale: يعبر تعبيرًا عربيًا مألوفًا عن استحضار بطرس للقول؛ وصيغة الأصل قد تُفهم أيضًا بمعنى «ذُكِّر».
- source_word: λόγου
  choice: كلام
  rationale: يشير هنا إلى القول المحدد الذي سبق أن قاله الرب، و«كلام الرب» تركيب عربي طبيعي في هذا السياق.
- source_word: ὡς
  choice: كيف
  rationale: تقدّم مضمون ما تذكّره بطرس وطريقة القول بصياغة تحافظ على مرونة الأداة اليونانية.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: قبل أن يصيح ديك
  rationale: ينقل علاقة الزمن السابق التي تفيدها πρίν مع المصدر، ويحافظ على تنكير ἀλέκτορα في الأصل.
- source_word: σήμερον
  choice: اليوم
  rationale: المقابل المباشر الواضح الذي يحفظ فورية النبوءة.
- source_word: ἀπαρνήσῃ
  choice: ستنكرني
  rationale: «أنكر» هو المقابل الدقيق والمألوف في سياق إنكار بطرس، ويحافظ على صيغة المخاطب المستقبلية.
- source_word: τρίς
  choice: ثلاث مرات
  rationale: صياغة عربية حديثة واضحة تنقل العدد والتكرار بلا تكلّف.
theological_decisions:
- issue: ترجمة κύριος لقبًا ليسوع
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ الاستعمال السردي والثقل المسيحاني للقب من غير حصره في معنى السيادة البشرية.
- issue: دلالة ὑπεμνήσθη بين التذكّر والتذكير
  choice: تذكّر
  alternative: ذُكِّر
  rationale: السياق يركّز على استرجاع بطرس كلام الرب، و«تذكّر» أفصح وأطبع هنا، مع عدم بناء تفسير سببي زائد على الصيغة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «فـ» لإظهار تعاقب الالتفات والنظر ثم التذكّر، مع تجنب الأسلوب الحرفي المتثاقل والمحافظة على تنكير «ديك» كما في الأصل.
