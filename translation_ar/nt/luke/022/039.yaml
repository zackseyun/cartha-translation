  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: ar
  text: وخرج، ومضى كعادته إلى جبل الزيتون، وتبعه التلاميذ أيضًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: وخرج
  rationale: اسم الفاعل الأوريستي يدل على فعل سبق الفعل الرئيس؛ وصيغة العطف بالفعل الماضي طبيعية في السرد العربي وتحفظ تتابع الحدث.
- source_word: ἐπορεύθη
  choice: ومضى
  rationale: ينقل فعل الذهاب في سياق سردي، ويجنب ثقل تكرار «ذهب» بعد «خرج».
- source_word: κατὰ τὸ ἔθος
  choice: كعادته
  rationale: تعبير عربي موجز وطبيعي لمعنى الممارسة المعتادة؛ وضمير الغائب مفهوم من فاعل الجملة، وإن لم يرد ضمير مستقل في اليونانية.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: إلى جبل الزيتون
  rationale: الاسم الجغرافي العربي الشائع والواضح للمكان.
- source_word: ἠκολούθησαν
  choice: تبعه
  rationale: يحفظ المعنى الحركي المباشر للفعل ἀκολουθέω، مع بقاء دلالته الملائمة لعلاقة التلاميذ به.
- source_word: οἱ μαθηταί
  choice: التلاميذ
  rationale: ينقل أداة التعريف والاسم دون إضافة «تلاميذه»، لأن ضمير الملكية غير مصرح به في النص اليوناني.
- source_word: καί ... δὲ καί
  choice: و... أيضًا
  rationale: «الواو» تصل الآية بالسياق وتتابع السرد، و«أيضًا» تحفظ القوة الإضافية لكلمة καί الثانية.
theological_decisions:
- issue: هل يُصرَّح بأن العادة عادة يسوع؟
  choice: كعادته
  alternative: بحسب العادة
  rationale: السياق النحوي يربط العبارة بفاعل «مضى»، والتعبير المختار طبيعي في العربية. لكنه يجعل الإحالة الضميرية صريحة نحويًا أكثر من العبارة اليونانية الموجزة، من غير تغيير مدلول السياق.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة، بصياغة سردية طبيعية. استُخدم «مضى» بعد «خرج» لتفادي التكرار الثقيل، وحُفظت «أيضًا» لإبراز مشاركة التلاميذ في الاتباع.
