  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: ar
  text: وابتعد هو عنهم مسافة رمية حجر تقريبًا[a]، وجثا على ركبتيه[b]، وكان يصلّي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: على بُعد يقارب المسافة التي يمكن أن يُرمى إليها حجر.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «واضعًا الركبتين»، أي جاثيًا على ركبتيه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: ابتعد
  rationale: الفعل المبني للمجهول في اليونانية يُستعمل هنا بمعنى انفصل عنهم أو تنحّى عنهم؛ و«ابتعد» عربية طبيعية تحفظ الحركة المقصودة من غير حرفية متكلّفة.
- source_word: ὡσεὶ λίθου βολήν
  choice: مسافة نحو رمية حجر
  rationale: يحفظ التعبير صورة رمي الحجر بوصفها تقديرًا تقريبيًا للمسافة، وتؤدي «نحو» معنى التقريب في ὡσεὶ.
- source_word: θεὶς τὰ γόνατα
  choice: جثا على ركبتيه
  rationale: العبارة حرفيًا «واضعًا الركبتين»، وهي تعبير عن اتخاذ هيئة الركوع على الركبتين؛ و«جثا على ركبتيه» واضحة وفصيحة ولا توحي بالسجود.
- source_word: προσηύχετο
  choice: أخذ يصلّي
  rationale: صيغة الماضي الناقص تصوّر الصلاة فعلًا مستمرًا؛ و«أخذ يصلّي» تنقل بدء المشهد واستمراره دون اختزاله إلى فعل لحظي.
- source_word: αὐτὸς
  choice: هو
  rationale: إثبات الضمير المنفصل يحفظ قدرًا من التوكيد الموجود في αὐτός من غير مبالغة.
- source_word: καὶ
  choice: و / ثم
  rationale: تُرجمت الأولى بالواو لحفظ اتصال السرد، والثانية بـ«ثم» لتوضيح تعاقب الابتعاد والجثو في عربية طبيعية دون إضافة معنى لاهوتي.
theological_decisions:
- issue: هيئة الصلاة وتصوير يسوع
  choice: وصف ابتعاده وجثوه وصلاته وصفًا مباشرًا
  alternative: إضافة تفسير تعبدي أو عقائدي لدلالة الهيئة
  rationale: النص يروي حركة يسوع وهيئته وصلاته، ولا يفسّر دلالتها العقائدية؛ لذلك تُحفظ الصورة ووقارها بلا توسع تفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت صورة «رمية حجر» وجرى شرحها في الحاشية، واستُعمل «جثا على ركبتيه» لتعيين الهيئة الجسدية بدقة.
