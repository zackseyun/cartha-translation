  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: ar
  text: أَمَّا أَنْتُمْ فَأَنْتُمُ الَّذِينَ بَقِيتُمْ مَعِي فِي مِحَني[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في تجاربي» أو «في اختباراتي». يمكن أن تدل الكلمة اليونانية على التجربة أو الإغراء أو الاختبار أو المحنة؛ ويبدو أنها تشير هنا إلى الشدائد التي اجتازها يسوع.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: أَنْتُمْ
  rationale: الضمير في صدر الجملة للتوكيد، وقد حُفظ بروزه في العربية بتركيب «أمّا أنتم فأنتم».
- source_word: δέ
  choice: أَمَّا
  rationale: تفيد هنا الانتقال مع إبراز المقابلة بالسياق السابق، وصيغة «أمّا... فـ» طبيعية وواضحة في العربية.
- source_word: οἱ διαμεμενηκότες
  choice: الَّذِينَ ثَبَتُوا
  rationale: اسم الفاعل المعرّف بصيغة التام يصف جماعة استمرّت وبقيت حتى وقت الكلام؛ و«ثبتوا» تؤدي معنى الاستمرار والوفاء في الشدائد دون إطالة ثقيلة.
- source_word: μετ’ ἐμοῦ
  choice: مَعِي
  rationale: ترجمة مباشرة لمعنى المصاحبة والارتباط.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: فِي تَجَارِبِي
  rationale: «تجاربي» تحافظ على سعة πειρασμός بين المحن والاختبارات والتجارب، مع إيضاح البدائل في الحاشية كيلا يُحسم التوتر الدلالي صمتًا.
theological_decisions:
- issue: دلالة πειρασμοῖς عند إسنادها إلى يسوع
  choice: تجاربي، بمعنى ما اجتازه من محن واختبارات مع إبقاء اللفظ واسع الدلالة
  alternative: مِحَني؛ أو اختباراتي؛ أو ما تعرضت له من تجارب وإغراءات
  rationale: السياق يركّز على ثبات التلاميذ مع يسوع وسط ما واجهه في خدمته، لكن اللفظة اليونانية قد تدل على المحنة أو الاختبار أو الإغراء؛ لذلك اختير لفظ عربي واسع مع حاشية تحفظ الاحتمالات.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ثبتوا معي» بدل تعبير حرفي أثقل مثل «ظلّوا باقين معي»، وحُفظ توكيد الضمير والمقابلة في مطلع الآية.
