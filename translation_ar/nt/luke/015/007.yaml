  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: ar
  text: 'أقول لكم: هكذا يكون في السماء فرحٌ بخاطئٍ واحدٍ يتوب، أكثرَ من الفرح بتسعةٍ وتسعين بارًّا[a] لا يحتاجون إلى التوبة.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يقول النص «بارًّا»، وقد تُفهم الكلمة على ظاهرها أو على سبيل المفارقة في سياق المثل؛ لذلك أبقت الترجمة اللفظ من غير حسم المقصود.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: صيغة عربية طبيعية تحفظ القول المباشر والتوكيد الواردين في العبارة اليونانية.
- source_word: οὕτως
  choice: هكذا
  rationale: تربط القول بما سبق من المثل، وتحفظ إمكان فهمها بمعنى «على هذا النحو».
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: يكون في السماء فرحٌ
  rationale: تحفظ زمن الاستقبال الدلالي وصراحة العبارة المكانية، بصياغة عربية سلسة.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: بخاطئٍ واحدٍ
  rationale: الباء تعبّر طبيعيًّا عن سبب الفرح ومناسبته في هذا السياق.
- source_word: μετανοοῦντι
  choice: يتوب
  rationale: «يتوب» هو المقابل العربي المألوف والدقيق للفعل في هذا السياق، ويحفظ كونه وصفًا فعليًّا للخاطئ.
- source_word: ἢ
  choice: أكثرَ مما يكون
  rationale: السياق مقارن؛ أُظهر وجه المقارنة الذي تفهمه اليونانية، تجنبًا لالتباس «أو» الحرفية في العربية.
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: بتسعةٍ وتسعين بارًّا
  rationale: «بارًّا» يحفظ الوصف الصريح في اليونانية من غير إضافة تفسير مثل «مَن يظنون أنفسهم أبرارًا».
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: لا يحتاجون إلى التوبة
  rationale: صياغة عربية واضحة وطبيعية تنقل معنى عدم الحاجة إلى التوبة كاملًا.
theological_decisions:
- issue: هل وصف «الأبرار» حقيقي أم تهكمي أو يشير إلى أبرار في نظر أنفسهم؟
  choice: بارًّا
  alternative: مَن يظنون أنفسهم أبرارًا
  rationale: النص اليوناني يصفهم بأنهم «أبرار» من غير علامة صريحة على التهكم؛ لذلك تُحفظ المعضلة التفسيرية ولا تُحسم داخل الترجمة.
- issue: مَن الذي يفرح في السماء؟
  choice: يكون في السماء فرحٌ
  alternative: يفرح الله أو الملائكة
  rationale: الآية تحدد موضع الفرح ولا تصرّح بصاحبه؛ فتجنبنا استيراد فاعل غير مذكور.
- issue: طبيعة المقارنة بين فرح السماء بالواحد وبالتسعة والتسعين
  choice: أكثرَ مما يكون
  alternative: لا يكون فرح بالتسعة والتسعين
  rationale: الأداة ἢ في السياق تفيد المقارنة، ولا تستلزم نفي كل فرح بالآخرين.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختير ترتيب عربي طبيعي، مع إبقاء «هكذا» لربط الآية بالمثل السابق، والحفاظ على الغموض المقصود في وصف التسعة والتسعين بأنهم أبرار.
