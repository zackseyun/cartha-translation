  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: ar
  text: 'فأجاب أباه: «ها أنا أخدمك كعبد[a] كل هذه السنين، ولم أعصِ لك أمرًا قط، ومع ذلك لم تعطني قط حتى جديًا لأفرح مع أصدقائي.»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أخدمك». يدل الفعل اليوناني على الخدمة، وقد يحمل معنى أقوى هو العمل كعبد؛ وتناسب العبارة الأقوى نبرة الابن الأكبر الساخطة هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: أجاب ... قائلًا
  rationale: ينقل التركيب اليوناني بعبارة عربية طبيعية، مع إبقاء معنى الجواب والقول.
- source_word: Ἰδοὺ
  choice: انظر
  rationale: أداة تنبيه ذات نبرة احتجاجية؛ و«انظر» واضحة ومعاصرة وتحفظ قوة الاستهلال.
- source_word: τοσαῦτα ἔτη
  choice: منذ سنين طويلة
  rationale: تعبير عربي طبيعي عن مدة ممتدة حتى زمن الكلام.
- source_word: δουλεύω σοι
  choice: أخدمك كعبد
  rationale: يحفظ معنى الخدمة المتضمنة للخضوع في فعل δουλεύω، ويبرز مرارة الابن الأكبر من غير الجزم بأنه عبد حرفيًا.
- source_word: ἐντολήν σου παρῆλθον
  choice: أخالف لك وصية
  rationale: يفيد الفعل هنا تجاوز الوصية أو مخالفتها؛ والصياغة واضحة وتحافظ على المفرد في الأصل.
- source_word: ἔριφον
  choice: جديًا صغيرًا
  rationale: يدل اللفظ على صغير المعز، وهذه العبارة مفهومة بوضوح للقارئ الحديث.
- source_word: ἵνα ... εὐφρανθῶ
  choice: لأفرح
  rationale: يحفظ غرض العبارة ودلالة الفرح الاحتفالي، من دون أن يضيف إلى النص ذكر وليمة صراحة.
- source_word: μετὰ τῶν φίλων μου
  choice: مع أصدقائي
  rationale: مقابل مباشر وطبيعي لعبارة المصاحبة.
theological_decisions:
- issue: دلالة δουλεύω في وصف الابن الأكبر لعلاقته بأبيه
  choice: أخدمك كعبد
  alternative: أخدمك
  rationale: الفعل من حقل العبودية والخدمة التابعة، وسياق الشكوى يعطي العبارة نبرة مريرة. أُبقي هذا التوتر من غير تحويل كلام الابن إلى تقرير عقائدي عن كونه عبدًا حرفيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أخدمك كعبد» لإظهار النبرة القوية في الأصل، مع حاشية تحفظ البديل الأخف. ووُضع مؤشر الحاشية في المتن كما هو مطلوب.
