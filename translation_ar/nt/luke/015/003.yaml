  rationale: أداة ربط خفيفة تصل جواب يسوع بالسياق السابق من غير أن تضيف تعارضًا قويًا.
- source_word: πρὸς αὐτοὺς
  choice: لهم
  rationale: تدل πρός مع المنصوب على المخاطَبين، ويؤديها حرف الجر «لـ» بوضوح وإيجاز في العربية.
- source_word: τὴν παραβολὴν ταύτην
  choice: هذا المثل
  rationale: «المثل» هو المقابل الراسخ لـ παραβολή في سياق الأناجيل، واسم الإشارة يحفظ دلالة ταύτην.
- source_word: λέγων
  choice: محذوف أسلوبيًا قبل النقطتين
  rationale: اسم الفاعل اليوناني يقدّم مضمون المثل؛ وتؤدي النقطتان هذه الوظيفة طبيعيًا في العربية، بينما تكون ترجمة «قائلًا» هنا ثقيلة وتكرارية.
