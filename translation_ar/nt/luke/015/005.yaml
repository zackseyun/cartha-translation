lexical_decisions:
- source_word: εὑρὼν
  choice: ومتى وجده
  rationale: اسم فاعل ماضٍ يفيد سبق العثور على الفعل الرئيس؛ وصياغته جملة زمنية طبيعية في العربية. أُثبت ضمير المفعول عائدًا إلى الخروف الضال المذكور في السياق السابق.
- source_word: ἐπιτίθησιν
  choice: حمله
  rationale: الفعل يدل على الوضع على شيء، لكن «حمله على كتفيه» هو التعبير العربي الطبيعي الواضح عن فعل الراعي، ويحفظ صورة الحركة إلى أعلى الكتفين.
- source_word: ἐπὶ τοὺς ὤμους αὐτοῦ
  choice: على كتفيه
  rationale: تحفظ «على» دلالة الوضع فوق، ويعكس المثنى العربي صيغة الجمع اليونانية الدالة هنا على الكتفين، والضمير يعود إلى الراعي.
- source_word: χαίρων
  choice: فرحًا
  rationale: حال تعبّر بإيجاز وطبيعية عن الفرح المصاحب لحمل الخروف، مع إبقاء التركيز العاطفي في ختام العبارة.
theological_decisions:
- issue: إظهار مفعول «وجد» المحذوف في اليونانية
  choice: إثبات الضمير في «وجده» وإرجاعه إلى الخروف الضال
  alternative: ومتى وجد، حمل على كتفيه فرحًا
  rationale: يجوز في اليونانية حذف المفعول لوضوحه من السياق، أما إثبات الضمير في العربية فيجعل المرجع واضحًا وطبيعيًا من غير إضافة معنى لاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. اختير «حمله على كتفيه» بدل الترجمة الحرفية الأثقل «وضعه على كتفيه»، مع الحفاظ على تسلسل العثور ثم الحمل وعلى الفرح المصاحب.
