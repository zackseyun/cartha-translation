  rationale: عُدّلت صياغة الضرورة لتظل غير شخصية كما في اليونانية، ونُقحت الحاشية لتعرض البديل المعجمي لـἔζησεν من دون فرض تفسير على صورة الموت والحياة في المثل. ولم يتغير معنى الآية أو مقابلاتها الأساسية.
