base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: ar
  text: لكن كان لا بد من الاحتفال والفرح، لأن أخاك هذا كان ميتًا فعاد إلى الحياة[a]، وكان ضالًّا فوُجد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حَيِيَ» أو «عاش».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: نحتفل
  rationale: ينقل معنى الفرح الاحتفالي في سياق الوليمة، بصياغة عربية طبيعية ومعاصرة.
- source_word: χαρῆναι
  choice: نفرح
  rationale: يحفظ التعبير الثاني المقترن بالفعل الأول، من غير دمج اللفظين في معنى واحد.
- source_word: ἔδει
  choice: كان لا بد
  rationale: يؤدي معنى الضرورة أو الوجوب الظرفي والأخلاقي، مع بقاء الفاعل مفهومًا من سياق كلام الأب.
- source_word: ὁ ἀδελφός σου οὗτος
  choice: أخاك هذا
  rationale: يحفظ اسم الإشارة والملكية، ويبرز تذكير الأب للابن الأكبر برابطة الأخوّة.
- source_word: νεκρὸς ἦν
  choice: كان ميتًا
  rationale: ترجمة مباشرة تحافظ على صورة الموت كما وردت، من غير تفسيرها داخل المتن.
- source_word: ἔζησεν
  choice: عاد إلى الحياة
  rationale: يعكس المقابلة مع «كان ميتًا» ويعبّر طبيعيًا عن استعادة الحياة، مع بقاء الصورة المجازية في سياق المثل.
- source_word: ἀπολωλὼς
  choice: كان ضالًّا
  rationale: ينقل حالة الفقد في سياق الابن الذي غاب ثم عاد؛ و«ضال» مألوفة وواضحة عربيًا، مع إمكان فهمها مكانيًا وأخلاقيًا بحسب السياق.
- source_word: εὑρέθη
  choice: فوُجد
  rationale: يحفظ صيغة المبني للمجهول والمقابلة الموجزة بين الضياع والوجدان.
theological_decisions:
- issue: هل تُفسَّر صورة الموت والحياة صراحةً على أنها استرداد روحي أو علاقي؟
  choice: الإبقاء على «كان ميتًا فعاد إلى الحياة»
  alternative: كان كالميت ثم استُردّ / عاد إلينا
  rationale: يحفظ صورة النص وحدّتها ولا يحسم طبيعة المجاز بتفسير لاهوتي زائد.
- issue: دلالة ἔδει بين الضرورة والملاءمة
  choice: كان لا بد
  alternative: كان يليق بنا
  rationale: يحفظ قوة الضرورة في الفعل اليوناني، مع الاعتراف بأن معنى الملاءمة الأخلاقية حاضر في السياق.
translation_notes:
  register: عربية فصحى واضحة وكريمة النبرة. استُخدم «نحتفل ونفرح» لمجاراة الفعلين اليونانيين، و«كان لا بد» لصياغة الضرورة بصورة طبيعية. وُضعت علامة الحاشية [a] في المتن مباشرة بعد العبارة المعنية.
