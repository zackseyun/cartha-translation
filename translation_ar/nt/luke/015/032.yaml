review_pass:
  verdict: revise
  source_fidelity: 'المتن ينقل بدقة المقابلات الرئيسة في اليونانية: ضرورة الفرح، و«أخاك هذا»، والموت/الحياة، والضياع/الوجدان. غير أن الحاشية الحالية تشرح العبارة بتحديدٍ تفسيري («كان كالميت») أوسع من اللفظ اليوناني، الذي يبقي صورة «كان ميتًا ... عاش/حيي» قائمة في المثل.'
  naturalness: الصياغة فصيحة واضحة وطبيعية. واستبدال «أن نحتفل ونفرح» بـ«من الاحتفال والفرح» يحافظ على الأسلوب غير الشخصي في «ἔδει» من دون إقحام ضمير «نحن»، مع بقاء المعنى سلسًا.
  terminology: «الاحتفال والفرح» يؤديان الفعلين المتقاربين εὐφρανθῆναι وχαρῆναι. و«عاد إلى الحياة» عربية سليمة للمقابلة مع «كان ميتًا»، وتبقى «ضالًّا فوُجد» مقابلة موجزة ومألوفة لـἀπολωλὼς καὶ εὑρέθη.
  issues:
  - severity: low
    issue: الحاشية تقيّد الصورة المجازية بقولها «بعد أن كان كالميت».
    rationale: النص اليوناني يقول «كان ميتًا وعاش»، وإن كان سياق المثل يرجح المعنى المجازي. ينبغي أن تعرض الحاشية البديل اللفظي من غير إعادة وصف «ميتًا» على أنه «كالميت» أو تقرير المقصود على نحو أضيق من النص.
  - severity: low
    issue: «أن نحتفل ونفرح» يجعل الفاعل جمع المتكلمين صريحًا.
    rationale: «ἔδει» تعبير غير شخصي. الجمع مفهوم من السياق وليس خطأً في المعنى، لكن «كان لا بد من الاحتفال والفرح» أقرب إلى بنية المصدر ولا يضيف فاعلًا.
  revised_text: لكن كان لا بد من الاحتفال والفرح، لأن أخاك هذا كان ميتًا فعاد إلى الحياة[a]، وكان ضالًّا فوُجد.
