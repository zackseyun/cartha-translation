base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: ar
  text: 'وحين يدخل البيت[a]، يجمع أصدقاءه وجيرانه، قائلاً لهم: «افرحوا معي[b]، لأني وجدت خروفي، ذاك الذي كان ضالًّا[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصياغة أكثر اصطلاحية: «وحين يعود إلى بيته». واليونانية حرفيًّا: «حين يدخل إلى البيت».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «شاركوني فرحتي». فالفعل اليوناني يعني أن يفرح المرء مع شخص آخر.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «خروفي الضال». واليونانية حرفيًّا: «خروفي، ذاك الذي كان ضالًّا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: ومتى دخل البيت
  rationale: يؤدي اسم الفاعل الأوريستي بوصفه جملة زمنية، ويحافظ على لفظ «البيت» واتجاه الدخول في اليونانية، بصياغة عربية طبيعية.
- source_word: συγκαλεῖ
  choice: دعا
  rationale: الفعل يدل على استدعاء أشخاص للاجتماع. وتفيد «دعا أصدقاءه وجيرانه» هذا المعنى طبيعيًّا من غير النبرة الآمرة التي قد توحي بها «استدعى».
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: أصدقاءه وجيرانه
  rationale: ترجمة مباشرة وطبيعية للاسمين في هذا السياق الاجتماعي.
- source_word: λέγων αὐτοῖς
  choice: وقال لهم
  rationale: تحويل اسم الفاعل إلى فعل معطوف يلائم السرد العربي ويحفظ تتابع الدعوة والكلام.
- source_word: Συγχάρητέ μοι
  choice: افرحوا معي
  rationale: يحفظ معنى الأمر بمشاركة المتكلم فرحه، من غير توسيع المعنى إلى احتفال غير مصرّح به.
- source_word: ὅτι εὗρον
  choice: لأني وجدت
  rationale: تفيد اللام السببية سبب الدعوة إلى الفرح، والماضي «وجدت» يقابل الأوريست بوضوح وطبيعية.
- source_word: τὸ πρόβατόν μου
  choice: خروفي
  rationale: «خروف» هو المقابل العربي المألوف للمفرد πρόβατον في صورة الراعي والغنم.
- source_word: τὸ ἀπολωλός
  choice: ذاك الذي كان ضالًّا
  rationale: 'يحافظ على البنية التفسيرية: «خروفي، ذاك الذي كان ضالًّا»، وعلى حالة الضياع السابقة التي يدل عليها اسم الفاعل التام، بدل دمجها تمامًا في صفة مختصرة.'
theological_decisions:
- issue: الصورة المَثَلية لاسترداد الضال
  choice: 'الإبقاء على الصورة الحسية: «خروفي، ذاك الذي كان ضالًّا»'
  alternative: خروفي الضال
  rationale: لا يُستبدل الخروف بخاطئ أو إنسان مخلَّص، لأن تفسير المثل يظهر في السياق. والصياغة المختارة تحفظ أيضًا إبراز العبارة اليونانية للاسم ثم وصفه باسم الفاعل.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة سردية كريمة. استُخدمت «ومتى» لربط الآية بما قبلها، و«دعا» بدل تعبير أثقل مثل «استدعى». وُضعت علامات الحواشي في النص وفق ترتيب ظهورها.
