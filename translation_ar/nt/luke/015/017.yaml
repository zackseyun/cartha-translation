    rationale: لا تستعمل العربية «يفيض عن» بهذا المعنى للدلالة على امتلاك الشخص خبزًا زائدًا؛ والصياغة لا تبيّن بوضوح أن الأجراء هم الذين لديهم وفرة من الخبز.
  - severity: low
