base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: ar
  text: 'فرجع إلى نفسه[a] فقال: «كم من أُجراء أبي لديهم من الخبز ما يزيد على حاجتهم[b]، وأنا هنا أهلك من الجوع[c]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عاد إلى رشده». واليونانية تقول حرفيًا: «جاء إلى نفسه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لديهم خبز فائض».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «أموت من الجوع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: فرجع إلى نفسه
  rationale: يحفظ الصورة اليونانية الدالة على عودة الوعي الصافي وإدراك المرء لحاله، مع بقاء العبارة مفهومة في العربية؛ ويُذكر البديل التفسيري في الحاشية.
- source_word: ἔφη
  choice: وقال
  rationale: الفعل الماضي السردي يُنقل طبيعيًا بالماضي البسيط في العربية.
- source_word: μίσθιοι
  choice: أجير
  rationale: يدل على عامل يعمل بأجر، لا على عبد من عبيد البيت، ويحافظ على هذا الفرق الدلالي.
- source_word: περισσεύονται ἄρτων
  choice: يفيض عنه الخبز
  rationale: ينقل معنى الوفرة التي تزيد على الحاجة، مع المحافظة على لفظ الخبز الملموس في الأصل.
- source_word: ἄρτων
  choice: الخبز
  rationale: يحافظ على اللفظ الملموس في اليونانية بدل تعميمه إلى الطعام.
- source_word: λιμῷ
  choice: جوعًا
  rationale: يدل السياق هنا على الجوع الشديد لا على المجاعة بوصفها ظرفًا عامًا، وصيغة «أهلك جوعًا» عربية طبيعية.
- source_word: ὧδε
  choice: هنا
  rationale: يبرز التباين بين حاله الراهنة وحال أجراء أبيه.
- source_word: ἀπόλλυμαι
  choice: أهلك
  rationale: يحافظ على شدة الفعل واستمرار الخطر من غير أن يحصره تفسيرًا في الموت الحرفي وحده.
