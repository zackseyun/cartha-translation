source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: ar
  text: أو أيّة امرأة لها عشرة دراهم[a]، إن أضاعت درهمًا واحدًا، ألا توقد سراجًا وتكنس البيت وتبحث عنه بعناية[b] حتى تجده؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الدرهم هنا عملة فضية يونانية.
    reason: cultural_note
  - marker: b
    text: 'أو: «تبحث عنه باجتهاد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: أم
  rationale: تربط هذا المثل بالمثل السابق وتلائم العربية في الانتقال إلى سؤال بلاغي موازٍ.
- source_word: τίς γυνὴ
  choice: أيّة امرأة
  rationale: صياغة استفهامية عربية طبيعية تحفظ الطابع البلاغي من غير إضافة «منكن»، إذ لا ترد في اليونانية.
- source_word: δραχμὰς / δραχμὴν
  choice: دراهم / درهمًا
  rationale: يحفظ اسم العملة المحددة تاريخيًا، مع إيضاحها في الحاشية بدل تسطيحها إلى «نقود» عامة.
- source_word: ἐὰν ἀπολέσῃ
  choice: إن أضاعت
  rationale: ينقل الشرط العام بصياغة عربية موجزة وطبيعية.
- source_word: οὐχὶ
  choice: ألا
  rationale: تؤدي السؤال البلاغي الذي يتوقع جوابًا بالإيجاب.
- source_word: ἅπτει λύχνον
  choice: توقد سراجًا
  rationale: «توقد» واضح ودقيق في سياق إشعال السراج، والتنكير يوافق غياب أداة التعريف في الأصل.
- source_word: σαροῖ τὴν οἰκίαν
  choice: تكنس البيت
  rationale: ترجمة مباشرة وطبيعية للمشهد المنزلي.
- source_word: ζητεῖ ἐπιμελῶς
  choice: تبحث عنه بعناية
  rationale: تعبير عربي معاصر ينقل معنى البحث الدقيق الجاد، مع إظهار المفعول المفهوم من السياق.
- source_word: ἕως οὗ εὕρῃ
  choice: حتى تجده
  rationale: يحفظ غاية البحث، والضمير يوضح أن المقصود هو الدرهم المفقود.
