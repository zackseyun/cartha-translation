  text: And calling one of the servants[a], he asked what these things might be.
translation:
  language: ar
  text: فدعا واحدًا من الخدم وسأله عمّا عسى أن تكون هذه الأمور.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عمّا قد يعنيه هذا». واليونانية حرفيًا أقرب إلى: «عمّا عسى أن تكون هذه الأمور».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: فدعا
  rationale: اسم فاعل ماضٍ من προσκαλέομαι يدل على أنه دعا الخادم إليه قبل أن يسأله؛ والفاء تنقل تتابع الحدثين طبيعيًا في العربية.
- source_word: παίδων
  choice: الخدم
  rationale: يمكن أن تعني παῖς «ولدًا» أو «خادمًا»، لكن سياق البيت واستدعاء أحدهم للاستفسار عن الاحتفال يرجّح معنى الخدم.
- source_word: ἐπυνθάνετο
  choice: وسأله
  rationale: الفعل يدل على الاستفسار وطلب المعلومة. صيغة «سأله» عربية طبيعية، ولا يقتضي السياق إبراز الاستمرار الذي قد تدل عليه صيغة الماضي الناقص اليونانية.
- source_word: τί ἂν εἴη ταῦτα
  choice: عمّا عسى أن تكون هذه الأمور
  rationale: تحافظ الصياغة على صيغة السؤال غير المباشر، وعلى جمع «هذه الأمور»، وعلى مسحة الاحتمال في ἂν εἴη، من غير اختزالها تفسيريًا إلى «ماذا يعني هذا».
theological_decisions: []
