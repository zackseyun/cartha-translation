  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: ar
  text: 'ولمّا وجدتها، دعت صديقاتها وجاراتها وقالت: «افرحْنَ معي، لأني وجدتُ الدرهمَ[a] الذي أضعتُه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كان الدرهم قطعة نقدية يونانية من الفضة، وكان يعادل تقريبًا أجرة يوم لعامل في سياقات كثيرة.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: ولمّا وجدتها
  rationale: اسم فاعل ماضٍ مؤنث يفيد حدثًا سابقًا للدعوة؛ صيغته الزمنية بالعربية طبيعية، والضمير يعود إلى الدراخما المفقودة.
- source_word: συγκαλεῖ
  choice: دعت
  rationale: يفيد استدعاء الصديقات والجارات للاجتماع إليها؛ «دعت» عربية واضحة غير متكلفة، والسياق يبيّن معنى الجمع.
- source_word: φίλας καὶ γείτονας
  choice: صديقاتها وجاراتها
  rationale: حُفظ التأنيث الصريح في φίλας، وفُهمت γείτονας المنسقة معها على أنها تشير إلى نساء من محيط المرأة الاجتماعي.
- source_word: Συγχάρητέ μοι
  choice: افرحْنَ معي
  rationale: أمر لجماعة مؤنثة بالمشاركة في الفرح، ويحفظ المعنى المباشر للفعل المركب συγχαίρω.
- source_word: ὅτι
  choice: لأني
  rationale: تُدخل سبب الدعوة إلى الفرح بصياغة عربية طبيعية ومباشرة.
- source_word: εὗρον
  choice: وجدتُ
  rationale: ماضٍ بسيط يطابق صيغة الماضي اليونانية ويلائم الكلام المباشر.
- source_word: δραχμὴν
  choice: الدرهمَ
  rationale: استُعمل «الدرهم» بوصفه اسمًا عربيًا مألوفًا لقطعة نقدية من هذا النوع، مع حاشية توضّح قيمتها التاريخية التقريبية.
- source_word: ἣν ἀπώλεσα
  choice: الذي أضعتُه
  rationale: صلة موصول تحدد الدرهم؛ «أضعتُه» تنقل كون المتكلمة هي التي فقدته، من غير إضافة دلالة غير موجودة.
theological_decisions: []
