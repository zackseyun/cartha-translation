  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: ar
  text: لكن حين جاء ابنك هذا، الذي التهم مالك مع البغايا، ذبحت له العجل المسمَّن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «التهم مورد عيشك» أو «أكل ثروتك». الفعل اليوناني قوي وحرفيًّا يفيد «الالتهام»، والاسم قد يعني مورد العيش أو الممتلكات أو الثروة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: لكن حين
  rationale: تنقل «حين» الدلالة الزمنية، وتحفظ «لكن» النبرة التقابلية في شكوى الابن الأكبر.
- source_word: ὁ υἱός σου οὗτος
  choice: ابنك هذا
  rationale: صياغة عربية طبيعية تحفظ اسم الإشارة وما يوحي به من جفاء وابتعاد؛ فهو لا يقول «أخي».
- source_word: ὁ καταφαγών
  choice: الذي التهم
  rationale: يحفظ الصورة القوية في الفعل اليوناني، أي الأكل أو الابتلاع بنهم، من غير استبدالها بتفسير أهدأ مثل «بدَّد».
- source_word: σου τὸν βίον
  choice: مالك
  rationale: يشير βίος هنا إلى ما يملكه الأب أو ما تقوم به معيشته، لا إلى حياته البيولوجية. و«مالك» واضحة وطبيعية وتلائم صورة الالتهام.
- source_word: μετὰ πορνῶν
  choice: مع البغايا
  rationale: ترجمة مباشرة وواضحة تحفظ اتهام الابن الأكبر من غير تلطيف.
- source_word: ἦλθεν
  choice: جاء
  rationale: يلتزم بالفعل اليوناني البسيط ولا يضيف معنى «عاد» رغم أن السياق يدل عليه.
- source_word: ἔθυσας
  choice: ذبحت
  rationale: الفعل هنا يدل على ذبح الحيوان لإعداد الوليمة، لا على تقديم ذبيحة شعائرية.
- source_word: τὸν σιτευτὸν μόσχον
  choice: العجل المسمَّن
  rationale: تعبير عربي مألوف ودقيق لعجل جرى تسمينه خصيصًا للولائم.
- source_word: αὐτῷ
  choice: له
  rationale: 'تحفظ دلالة المستفيد: ذُبح العجل لأجله وتكريمًا له.'
theological_decisions:
- issue: هل يُعرض كلام الابن الأكبر بوصفه حقيقة مقررة أم اتهامًا منه؟
  choice: إبقاء الاتهام بصيغته المباشرة داخل كلام الابن الأكبر
  alternative: إضافة قيد مثل «كما يزعم» أو إعادة صياغته بوصفه وصفًا محايدًا
  rationale: النص اليوناني يورد هذا بوصفه اتهام الابن الأكبر، ولا يصرّح الراوي هنا بتأكيد تفاصيله. نقل الكلام مباشرة يحفظ التوتر السردي من غير تصديقه أو التشكيك فيه بإضافة تفسيرية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وكريمة. اختيرت «ابنك هذا» لحفظ نبرة الجفاء، و«التهم مالك» للحفاظ على الصورة الحادة في الأصل مع بقاء العبارة مفهومة للقارئ العام.
