revisions:
- from: 'لكن الابن قال له: «يا أبي، أخطأتُ إلى السماء[a] وأمامك. ولستُ مستحقًّا بعدُ أن أُدعى ابنك».[b]'
  to: 'فقال له الابن: «يا أبي، أخطأتُ في حق السماء[a] وأمامك. ولستُ مستحقًّا بعدُ أن أُدعى ابنك»[b]'
  rationale: تُصحَّح العبارة المركزية إلى «أخطأتُ في حق السماء» لتكون عربية فصيحة واضحة وتؤدي معنى الخطيئة ضد السماء، مع الحفاظ على التعبير التوقيري غير المباشر في اليونانية وعدم تفسيره في المتن بـ«الله». ويُستبدل الرابط الأقوى «لكن» بالصياغة السردية الطبيعية «فقال له الابن»، وتُضبط علامة الحاشية النصية عند نهاية القول. ولا يتغير مدى القول في النص الرئيسي.
