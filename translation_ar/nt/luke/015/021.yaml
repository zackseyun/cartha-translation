base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: ar
  text: 'فقال له الابن: «يا أبي، أخطأتُ في حق السماء[a] وأمامك. ولستُ مستحقًّا بعدُ أن أُدعى ابنك»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تَرِد عبارة «السماء» في اليونانية بوصفها أسلوبًا توقيريًّا للإشارة إلى الله؛ وتترجمها بعض الترجمات تفسيريًّا: «الله».'
    reason: lexical_alternative
  - marker: b
    text: 'تُكمل بعض المخطوطات كلام الابن بعبارة معناها: «اجعلني كواحد من أُجرائك»، موافقةً لما في الآية 19؛ أما نص SBLGNT فينهي الجملة عند «ابنك».'
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ ὁ υἱὸς αὐτῷ
  choice: لكن الابن قال له
  rationale: تنقل «لكن» أداة الربط δέ بوصفها انتقالًا خفيفًا يحمل شيئًا من المقابلة، مع إبقاء «له» كما في اليونانية من غير استبدالها بتفسير صريح.
- source_word: Πάτερ
  choice: يا أبي
  rationale: صيغة النداء العربية الطبيعية للأب هي «يا أبي»، وهي تؤدي معنى المنادى اليوناني من غير زيادة تفسيرية.
- source_word: ἥμαρτον
  choice: أخطأتُ
  rationale: فعل ماضٍ مباشر يلائم صيغة الاعتراف ويعبّر عن الذنب المُقَرّ به.
- source_word: εἰς τὸν οὐρανὸν
  choice: إلى السماء
  rationale: يحافظ على صورة التعبير اليوناني وعلى الإشارة التوقيرية غير المباشرة إلى الله، بدل إحلال التفسير «إلى الله» محل النص.
- source_word: καὶ ἐνώπιόν σου
  choice: وأمامك
  rationale: ينقل المعنى الأساسي لـἐνώπιον، أي «في حضرتك/أمامك»، ويحفظ التوتر بين الحضور الشخصي ومعنى الإساءة من غير تحويله صراحة إلى «إليك».
- source_word: οὐκέτι εἰμὶ ἄξιος
  choice: ولستُ مستحقًّا بعدُ
  rationale: صياغة عربية واضحة وطبيعية تعبّر عن انعدام الاستحقاق من الآن فصاعدًا.
- source_word: κληθῆναι υἱός σου
  choice: أن أُدعى ابنك
  rationale: يحافظ المبني للمجهول «أُدعى» على صيغة المصدر المبني للمجهول، ويؤدي «ابنك» العلاقة البنوية بوضوح.
theological_decisions:
- issue: دلالة «السماء» في الاعتراف
  choice: إبقاء «إلى السماء» في المتن بوصفه تعبيرًا توقيريًّا غير مباشر عن الله
  alternative: 'ترجمته تفسيريًّا: «إلى الله»'
  rationale: النص اليوناني يذكر «السماء»، وإبقاء العبارة يصون أسلوب المصدر وما فيه من دلالة ضمنية بدل حسمها داخل المتن.
- issue: مدى كلام الابن في هذه الآية
  choice: إنهاء كلامه عند «ابنك» وفق نص SBLGNT
  alternative: 'إضافة: «اجعلني كواحد من أُجرائك» أو ما يعادلها'
  rationale: المصدر المعتمد ينتهي عند «ابنك»؛ وتُذكر القراءة الأطول في الحاشية بوصفها اختلافًا نصيًّا، لا جزءًا من المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع علامات ترقيم عربية وصيغة اعتراف طبيعية. حُفظ التعبير «إلى السماء» و«أمامك» لتجنب الإفراط في التفسير، ووُضعت علامتا الحاشيتين عند الموضعين اللذين تتعلقان بهما مباشرة.
