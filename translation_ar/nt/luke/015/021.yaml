review_pass:
  verdict: revise
  source_fidelity: تحتاج عبارة εἰς τὸν οὐρανόν إلى نقلٍ عربي أوضح لمعنى الإساءة «ضد/في حق السماء». أما بقية عناصر الآية—الاعتراف، و«أمامك»، و«لست مستحقًا»، والمبني للمجهول في «أُدعى»، وانتهاء الكلام عند «ابنك»—فمنقولة بأمانة.
  naturalness: «أخطأتُ إلى السماء» محاكاة حرفية غير طبيعية في العربية المعاصرة وقد تُفهم على أنها حركة باتجاه السماء. و«فقال له الابن» أنسب من «لكن الابن قال له» لأن δέ هنا رابط سردي خفيف لا يقتضي مقابلة قوية. كما يُضبط موضع علامة الحاشية النصية ليقع بعد نهاية القول مباشرة.
  terminology: «السماء» تحافظ على التورية التوقيرية في الأصل من غير استبدالها بـ«الله»، و«في حق السماء» تؤدي معنى الخطيئة ضدها بعبارة عربية سليمة. وتبقى «يا أبي»، و«مستحقًا»، و«أُدعى ابنك» مناسبة للسجل الفصيح الواضح.
  issues:
  - severity: medium
    issue: «أخطأتُ إلى السماء» غير طبيعية وملتبسة دلاليًا.
    rationale: حرف الجر «إلى» في العربية يدل غالبًا على الاتجاه أو الغاية، ولا يؤدي بوضوح معنى εἰς الاصطلاحي في اعتراف الخطيئة. «أخطأتُ في حق السماء» ينقل معنى الإساءة مع إبقاء لفظ «السماء» والتورية المقصودة.
  - severity: low
    issue: «لكن» أقوى من دلالة δέ في هذا الموضع السردي.
    rationale: δἐ هنا أداة وصل سردية خفيفة؛ «فقال له الابن» عربية طبيعية ولا تفرض تعارضًا غير مصرح به.
  - severity: low
    issue: موضع الحاشية b وعلامة الوقف خارج الاقتباس يحتاجان إلى ضبط طباعي.
    rationale: الحاشية تتصل بنهاية كلام الابن عند «ابنك»، ولذلك توضع مباشرة بعد علامة الاقتباس الختامية، من دون نقطة زائدة بعدها.
