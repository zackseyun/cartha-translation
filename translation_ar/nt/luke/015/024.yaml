  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: ar
  text: لأن ابني هذا كان ميتًا فعاد إلى الحياة، وكان ضائعًا فوُجد. وبدأوا يحتفلون.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تُدخل تعليل الأب للاحتفال، وتحافظ على العلاقة السببية بعبارة عربية واضحة.
- source_word: οὗτος ὁ υἱός μου
  choice: ابني هذا
  rationale: صياغة عربية طبيعية تُبقي على إبراز الابن باسم الإشارة οὗτος.
- source_word: νεκρὸς ἦν
  choice: كان ميتًا
  rationale: تنقل حالة الماضي مباشرة، وتحافظ على صورة الموت القوية من غير تخفيف أو تفسير.
- source_word: ἀνέζησεν
  choice: فعاد إلى الحياة
  rationale: تفيد الرجوع إلى الحياة، وتناسب المقابلة المباشرة مع «كان ميتًا» في عربية معاصرة واضحة.
- source_word: ἦν ἀπολωλὼς
  choice: كان ضائعًا
  rationale: تحافظ على معنى الفقد وعلى محور الضياع والوجدان في الإصحاح، من غير تحويل العبارة إلى حكم أخلاقي صريح.
- source_word: εὑρέθη
  choice: فوُجد
  rationale: تحافظ على المبني للمجهول وعلى عدم تعيين فاعل الوجدان، كما تقابل «ضائعًا» بإيجاز.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: وبدأوا يحتفلون
  rationale: تحفظ دلالة البدء، وتنقل الفرح الاحتفالي الملائم لسياق الوليمة بلغة حديثة.
theological_decisions:
- issue: القوة المجازية للموت والعودة إلى الحياة في المثل
  choice: الإبقاء على ألفاظ الموت والحياة كما وردت، من غير شرح داخل النص.
  alternative: تفسيرها في المتن بأنها موت وعودة إلى الحياة روحيًا أو اجتماعيًا.
  rationale: تستعمل كلمات الأب صورة الموت والحياة لوصف رجوع الابن من اغترابه، لكن النص يتعمد إبقاء الصورة قوية ومفتوحة الدلالة؛ لذلك لا ينبغي حسمها بتفسير زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُعمل «ضائعًا» بدل «ضالًّا» لتقوية مقابلة الضياع والوجدان وتجنب حصر اللفظ في معنى الانحراف الأخلاقي، مع بقاء سياق المثل ظاهرًا.
