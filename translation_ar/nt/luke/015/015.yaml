lexical_decisions:
- source_word: πορευθεὶς
  choice: فذهب
  rationale: ينقل اسم الفاعل الأوريستي المستعمل ظرفيًا بحركة تسبق الفعل الرئيس، بصياغة عربية طبيعية موجزة.
- source_word: ἐκολλήθη
  choice: التصق بواحد
  rationale: يحفظ الصورة القوية في الفعل، أي الالتحام أو التعلق الوثيق بشخص، وما قد تنطوي عليه هنا من اعتماد عليه، بدل صياغة محايدة مثل «التحق».
- source_word: ἑνὶ τῶν πολιτῶν
  choice: بواحد من مواطني
  rationale: «مواطن» هو المقابل المباشر لـ πολίτης بوصفه عضوًا في جماعة البلد، ويحفظ دلالة النص الاجتماعية.
- source_word: τῆς χώρας ἐκείνης
  choice: تلك البلاد
  rationale: «البلاد» تعبير عربي طبيعي لـ χώρα في هذا السياق، ويتسق مع الإشارة إلى البلد البعيد في سياق المثل.
- source_word: ἔπεμψεν αὐτὸν
  choice: فأرسله
  rationale: ينقل الفعل والضمير بإيجاز، ويظل مرجع الفاعل، أي المواطن المذكور، واضحًا من السياق.
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: إلى حقوله
  rationale: يحفظ صيغة الجمع وملكية المواطن، و«الحقول» مقابل واضح وطبيعي لـ ἀγροί.
- source_word: βόσκειν
  choice: ليرعى
  rationale: «يرعى» يشمل سوق الحيوانات إلى المرعى والعناية بإطعامها، وهو أنسب عربيًا مع الخنازير من التعبير الحرفي «يطعم».
- source_word: χοίρους
  choice: الخنازير
  rationale: المقابل العربي الحديث المباشر للاسم اليوناني، من غير استعمال لفظ قديم أو ملطف.
theological_decisions:
- issue: قوة دلالة ἐκολλήθη وحالة الابن
  choice: التصق بواحد من مواطني تلك البلاد
  alternative: التحق بواحد من مواطني تلك البلاد
  rationale: يحفظ الاختيار قوة الفعل اليوناني وإيحاء التعلق الاعتمادي، من غير أن يضيف صراحةً عقد عمل أو استعبادًا لا يذكرهما النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «التصق» للمحافظة على الصورة الأصلية القوية، مع حاشية تشرح مجال الدلالة من غير حسم طبيعة العلاقة بما يتجاوز النص.
