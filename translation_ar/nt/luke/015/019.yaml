source:
  edition: SBLGNT
  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: ar
  text: لستُ مستحقًّا بعدُ أن أُدعى ابنك. اجعلني كواحدٍ من أُجرائك.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كواحد من عمّالك المأجورين». تشير الكلمة اليونانية إلى عمّال يعملون لقاء أجر، لا إلى عبيد البيت.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: لستُ ... بعدُ
  rationale: تعبير عربي فصيح وطبيعي يدل على زوال حال سابقة، ويحفظ معنى النفي الزمني.
- source_word: ἄξιος
  choice: مستحقًّا
  rationale: ينقل معنى الأهلية والاستحقاق المرتبط بالمكانة العائلية والاجتماعية.
- source_word: κληθῆναι
  choice: أن أُدعى
  rationale: يحفظ صيغة المبني للمجهول ومعنى أن يُسمّى أو يُعَدّ بهذه الصفة.
- source_word: υἱός
  choice: ابنك
  rationale: يحفظ التحديد المذكر المفرد وعلاقة البنوة الواردة صراحة في اليونانية.
- source_word: ποίησόν
  choice: اجعلني
  rationale: ينقل فعل الأمر المباشر وطلب الانتقال إلى وضع جديد، من غير استبداله بتفسير مثل «عاملني».
- source_word: ὡς
  choice: كـ
  rationale: تفيد التشبيه هنا بصورة طبيعية وموجزة.
- source_word: ἕνα τῶν μισθίων σου
  choice: كواحدٍ من أُجرائك
  rationale: «الأُجراء» عمال يعملون لقاء أجر، وبذلك تُحفظ دلالة μίσθιοι وتمييزهم من عبيد البيت.
theological_decisions:
- issue: لغة المكانة في اعتراف الابن
  choice: الإبقاء على «مستحقًّا» و«ابنك» من دون تلطيف
  alternative: لا أستحق بعد الآن أن أُدعى ولدك
  rationale: النص يعبّر عن شعور الابن بعدم أهليته لمكانة البنوة، لا عن خجل عام فحسب؛ وهذه الصياغة تحفظ البعد العائلي والاجتماعي دون استنتاج عقائدي زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «بعدُ» مع النفي للدلالة على «لم أعد»، و«أُجرائك» لإيجاز معنى العمال المأجورين مع إيضاحه في الحاشية.
