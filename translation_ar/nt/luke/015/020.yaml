  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: ar
  text: فقام وجاء إلى أبيه. وبينما كان لا يزال بعيدًا[a]، رآه أبوه فتحنَّن عليه، وركض وارتمى على عنقه، وقبَّله بحرارة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على مسافة بعيدة».'
    reason: lexical_alternative
  - marker: b
    text: قد يفيد الفعل اليوناني شدة المودة في التقبيل، وربما يعني أنه قبَّله مرارًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: فقام
  rationale: اسم فاعل ماضٍ من ἀνίστημι يبيّن نهوض الابن بوصفه الفعل الحاسم السابق لمجيئه؛ و«فقام» موجزة وطبيعية وتحفظ تتابع السرد.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: وجاء إلى أبيه
  rationale: الفعل ἔρχομαι يحتمل «جاء» أو «ذهب» بحسب منظور السرد، و«جاء إلى أبيه» يلائم تركيز العبارة على الأب؛ أما الضمير الانعكاسي فتعبر عنه العربية طبيعيًا بضمير الملكية.
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: وبينما كان لا يزال بعيدًا
  rationale: التركيب يفيد ظرفًا متزامنًا، وهذه الصياغة واضحة ومعاصرة وتحفظ معنى استمرار وجوده على بُعد.
- source_word: ἐσπλαγχνίσθη
  choice: فتحنَّن عليه
  rationale: يدل الفعل على رحمة عميقة متحركة من الداخل؛ و«تحنَّن عليه» تحافظ على القوة الوجدانية من غير شرح زائد.
- source_word: δραμὼν
  choice: وركض
  rationale: نقل مباشر وطبيعي للفعل الدال على الجري.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: وارتمى على عنقه
  rationale: تحفظ «ارتمى على عنقه» الصورة الحية للتعبير اليوناني من غير إضافة صريحة للذراعين أو استبداله بلفظ عام مثل «عانقه».
- source_word: κατεφίλησεν
  choice: وقبَّله بحرارة
  rationale: قد يحمل الفعل المركب معنى شدة التقبيل ومودته، وربما تكراره؛ و«بحرارة» تنقل القوة العاطفية من غير الجزم بالتكرار.
theological_decisions:
- issue: تصوير حنان الأب في المثل
  choice: نقل استجابة الأب بلغة وجدانية حية من غير تفسير رمزي صريح
  alternative: تخفيف الشحنة العاطفية، أو توسيع النص ليصرّح بأن الأب يرمز إلى الله
  rationale: يعرض النص مبادرة الأب الرحيمة بأفعال سردية قوية؛ لذلك ينبغي حفظ قوتها من غير إدخال تفسير عقائدي لا تصرّح به الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت أفعال سردية مألوفة، مع إبقاء الصورة الملموسة في «ارتمى على عنقه» والقوة الوجدانية في «تحنَّن عليه» و«قبَّله بحرارة».
