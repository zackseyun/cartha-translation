  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: ar
  text: 'وكان الفريسيون والكتبة معًا يتذمّرون، قائلين: «هذا الرجل يرحّب بالخطاة ويأكل معهم».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يستقبل الخطاة ويأكل معهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγόγγυζον
  choice: كانوا يتذمّرون
  rationale: الماضي الناقص يدل على فعل مستمر أو متكرر، و«يتذمّرون» يحفظ معنى الشكوى الخافتة ذات النبرة السلبية.
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: الفريسيون والكتبة، كلاهما
  rationale: يحفظ «كلاهما» القوة الترابطية للتركيب τε ... καί، فيما «الكتبة» هو المقابل العربي المألوف في سياق الأناجيل.
- source_word: λέγοντες
  choice: قائلين
  rationale: ينقل اسم الفاعل المصاحب للفعل الرئيس بصياغة عربية طبيعية وموجزة.
- source_word: Οὗτος
  choice: هذا الرجل
  rationale: ينقل اسم الإشارة مع ما قد يحمله في هذا السياق من نبرة إبعاد أو انتقاص، من غير مبالغة تفسيرية.
- source_word: ἁμαρτωλοὺς
  choice: الخطاة
  rationale: ترجمة مباشرة للصفة المستعملة اسميًا، وتحفظ دلالتها بوصفها تصنيفًا دينيًا واجتماعيًا في الاتهام.
- source_word: προσδέχεται
  choice: يرحّب بـ
  rationale: يعبّر طبيعيًا عن استقبال الأشخاص بقبول وحفاوة؛ أما «يقبل» فقد يحتمل معنى أوسع أو أكثر تجريدًا.
- source_word: συνεσθίει αὐτοῖς
  choice: يأكل معهم
  rationale: صياغة مباشرة تحفظ دلالة مشاركة المائدة وما تنطوي عليه اجتماعيًا، من غير إضافة تفسيرية.
theological_decisions:
- issue: القوة الاجتماعية واللاهوتية لمخالطة يسوع للخطاة
  choice: 'إبقاء الاتهام بصيغة مباشرة: يرحّب بالخطاة ويأكل معهم.'
  alternative: يستقبل الخطاة ويأكل معهم.
  rationale: تحفظ الصياغة ما في مشاركة المائدة من مدعاة للاعتراض في نظر المتكلمين، من غير تخفيف للمفارقة أو إضافة حكم مذهبي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «الكتبة» بوصفها التسمية الإنجيلية المألوفة، وحُفظ استمرار التذمر بالماضي الناقص. وُضع «كلاهما» بين فاصلتين لتأكيد اشتمال التذمر على الفئتين مع تجنب تركيب عربي متكلف.
