lexical_decisions:
- source_word: Ἦν δὲ
  choice: وكان
  rationale: تؤدي الواو وظيفة الانتقال السردي الذي تؤديه δέ من غير أن تضيف معنى زمنيًا صريحًا أو توحي بتعارض قوي.
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: ابنه الأكبر
  rationale: πρεσβύτερος صيغة مقارنة، والمقصود الابن الأكبر سنًا في مقابل الابن الأصغر، لا إثبات أنه الأكبر بين عدة أبناء.
- source_word: ἐν ἀγρῷ
  choice: في الحقل
  rationale: ترجمة مباشرة وطبيعية لـἀγρός في هذا السياق الزراعي.
- source_word: ὡς ἐρχόμενος
  choice: حين أقبل
  rationale: تنقل الحركة الجارية نحو البيت بعبارة عربية طبيعية، من غير إضافة أنه كان عائدًا، إذ لا يصرح المصدر بذلك.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: اقترب من البيت
  rationale: تعكس معنى ἐγγίζω بوضوح وتحافظ على ذكر الاقتراب مستقلًا عن مجرد الإقبال.
- source_word: ἤκουσεν
  choice: سمع
  rationale: الماضي البسيط هو المقابل الطبيعي للفعل السردي في صيغة الأوريست، من غير افتراض معنى الشروع.
- source_word: συμφωνίας
  choice: موسيقى
  rationale: اللفظ قد يدل على الموسيقى أو العزف، ولا سيما عزف الآلات؛ و«موسيقى» أوضح في المتن ولا تحمل الإيحاء الحديث غير المناسب لكلمة «سيمفونية».
- source_word: χορῶν
  choice: رقصًا
  rationale: يمكن أن يدل χορός على الرقص أو على جماعة من الراقصين؛ و«رقصًا» تلائم اقترانه بالموسيقى مع إبقاء البديل الأخص في الحاشية.
