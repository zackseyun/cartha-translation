  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: ar
  text: وأحضروا العجلَ المُسمَّن[a]، واذبحوه، ولنأكل ونحتفل،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قدّموه ذبيحة»؛ فالفعل اليوناني قد يعني ذبح حيوان، وقد يحمل في بعض السياقات دلالة قربانية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρετε
  choice: أحضروا
  rationale: فعل أمر للجمع من φέρω؛ و«أحضروا» ينقل معنى جلب الشيء إلى المتكلم من غير إضافة «إلى هنا» أو «إلى الخارج»، وهما غير مصرّح بهما في اليونانية.
- source_word: μόσχον τὸν σιτευτόν
  choice: العجل المُسمَّن
  rationale: μόσχος يدل على عجل أو بقري صغير، وσιτευτός على ما عُلِف وسُمِّن لمناسبة؛ و«العجل المُسمَّن» تعبير عربي واضح يحفظ دلالة الاستعداد للوليمة.
- source_word: θύσατε
  choice: اذبحوه
  rationale: يمكن أن يدل θύω على ذبح الحيوان، وقد يستعمل للذبح القرباني. وفي سياق إعداد وليمة البيت، «اذبحوه» هو المعنى المباشر من غير فرض طابع شعائري غير صريح.
- source_word: φαγόντες
  choice: لنأكل
  rationale: هو اسم فاعل ماضٍ يُفهم حرفيًا «إذ نأكل/بعد أن نأكل»، لكنه مرتبط دلاليًا بصيغة الحث التالية؛ وصياغة «لنأكل ونحتفل» طبيعية في العربية وتحفظ تسلسل الفعل والاحتفال من غير تحويله إلى «لنولم».
- source_word: εὐφρανθῶμεν
  choice: نحتفل
  rationale: صيغة حث للمتكلم الجمع، وتدل على الفرح والابتهاج. «نحتفل» تلائم سياق الوليمة وتأتي بلغة عربية معاصرة واضحة.
- source_word: καὶ ... καὶ
  choice: و... و
  rationale: تكرار أداة العطف يربط الأمرين ثم الدعوة المشتركة، وحفظ الواو يصون الحركة التراكمية في كلام الأب.
theological_decisions:
- issue: الإيحاء القرباني المحتمل في θύσατε
  choice: ترجمة الفعل «اذبحوه» بوصفه أمرًا بإعداد الحيوان للوليمة.
  alternative: «قدّموه ذبيحة» أو «ضحّوا به» لإبراز معنى شعائري محتمل.
  rationale: للفعل مجال دلالي قد يشمل الذبح القرباني، لكن السياق القصصي يركّز على إعداد احتفال عائلي. لذلك لا تُفرض دلالة شعائرية في المتن، مع إثبات الاحتمال في الحاشية حفظًا للغموض المعجمي الحقيقي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «المُسمَّن» بوصفه التعبير الطبيعي، و«لنأكل ونحتفل» لصياغة الحث الجماعي بسلاسة مع الحفاظ على معنى الأصل.
