  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: ar
  text: أما هو فغضب، ولم يُرِد أن يدخل[a]. فخرج أبوه وأخذ يناشده[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لم يشأ أن يدخل»، أو: «رفض أن يدخل».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة الفعل: «يحثه» أو «يلتمس منه». وصيغة الفعل اليوناني توحي بأن الأب كان يواصل مناشدته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: غضب
  rationale: ينقل الفعل حدوث الغضب ودخوله في هذه الحالة، من غير تشديد زائد مثل «استشاط غضبًا».
- source_word: δὲ
  choice: لكن
  rationale: تفيد أداة الربط هنا مقابلةً لطيفة بين فرح البيت وموقف الابن الأكبر، و«لكن» تؤدي هذا المعنى طبيعيًا.
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: لم يُرِد أن يدخل
  rationale: يحافظ على معنى الإرادة في θέλω من غير أن يحسم العبارة بوصفها رفضًا صريحًا، وإن كان ذلك ممكنًا سياقيًا.
- source_word: ὁ δὲ πατὴρ αὐτοῦ ἐξελθὼν
  choice: فخرج أبوه
  rationale: تنقل الفاء استجابة الأب للموقف، ويعبّر «خرج» بوضوح عن حركته من داخل البيت إلى ابنه.
- source_word: παρεκάλει αὐτόν
  choice: أخذ يتوسل إليه
  rationale: «يتوسل إليه» تنقل الالتماس الجاد، و«أخذ» مع المضارع تبرز الاستمرار الذي يوحي به زمن الماضي الناقص في اليونانية.
theological_decisions:
- issue: نبرة التماس الأب في المثل
  choice: أخذ يتوسل إليه
  alternative: كان يحثه؛ أخذ يناشده
  rationale: تحفظ الصياغة مبادرة الأب الجادة والودودة تجاه ابنه من غير إضافة مدلول عقائدي لا يصرح به النص.
translation_notes:
  register: صياغة عربية فصحى واضحة ومعاصرة، تحافظ على المقابلة السردية وعلى استمرار التماس الأب، وتتجنب المبالغة في شدة غضب الابن أو تحويل عدم رغبته إلى رفض صريح حتمي.
