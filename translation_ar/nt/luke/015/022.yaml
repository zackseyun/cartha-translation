source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: ar
  text: 'لكن الأب قال لعبيده[a]: «أخرجوا سريعًا أفضل حُلّة[b] وألبسوه إياها، وضعوا خاتمًا[c] في يده، ونعلين في قدميه».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «خدمه». تدل الكلمة اليونانية على عبيد أو مماليك يعملون في البيت، ولذلك اختيرت «عبيده» لإبقاء هذا الواقع الاجتماعي ظاهرًا.'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «الحُلّة الأولى»؛ والمقصود على الأرجح الحُلّة الأولى منزلةً، أي الأفضل أو الأرفع.'
    reason: lexical_alternative
  - marker: c
    text: يقول الأصل اليوناني «خاتمًا» فقط. ويرى بعضهم أنه خاتم خَتْم يرمز إلى استعادة المكانة، لكن النص لا يحدد ذلك.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: عبيده
  rationale: تدل الكلمة على عبيد أو مماليك تابعين للبيت، لا على خدم أحرار فحسب. وتحافظ «عبيده» على واقعهم الاجتماعي مع بقائها طبيعية في سياق ربّ البيت.
- source_word: Ταχὺ
  choice: أسرعوا
  rationale: استُعملت حالًا للحث على التنفيذ العاجل؛ وصيغة «أسرعوا» العربية تنقل الإلحاح بوضوح.
- source_word: ἐξενέγκατε
  choice: أخرجوا
  rationale: الفعل أمر جمع بمعنى إخراج شيء من داخل البيت أو موضع حفظه.
- source_word: στολὴν τὴν πρώτην
  choice: أفضل حُلّة
  rationale: المعنى السياقي المرجح هو الحُلّة الأولى منزلةً أو الأفضل، لا الأولى في ترتيب زمني. و«حُلّة» تدل طبيعيًا على ثوب فاخر.
- source_word: ἐνδύσατε αὐτόν
  choice: ألبسوه إياها
  rationale: ينقل فعل الإلباس بوضوح، ويعيد الضمير إلى الحُلّة المذكورة.
- source_word: δακτύλιον
  choice: خاتمًا
  rationale: اللفظ اليوناني يعني خاتمًا دون أن يحدد أنه خاتم خَتْم أو سلطة.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: في يده
  rationale: صياغة عربية طبيعية تحفظ ذكر اليد، من غير تحويلها تفسيرًا إلى الإصبع.
- source_word: ὑποδήματα
  choice: نعلين
  rationale: يشير اللفظ إلى ما يُنتعل في القدم، ولا سيما النعال في البيئة المتوسطية القديمة؛ والتثنية طبيعية لزوج النعال.
- source_word: εἰς τοὺς πόδας
  choice: في قدميه
  rationale: تعبير عربي موجز وطبيعي عن وضع النعلين على القدمين.
- source_word: δὲ
  choice: لكن
  rationale: تُظهر أداة الاستدراك التحول السردي من كلام الابن إلى استجابة الأب العملية.
theological_decisions:
- issue: هل تُنقل δούλους بما يدل على العبيد أم بما يدل على الخدم عمومًا؟
  choice: عبيده
  alternative: خدمه
  rationale: السياق المنزلي لا يلغي وضعهم المملوك أو المقيّد، ولذلك تحافظ «عبيده» على الواقع الاجتماعي الذي يدل عليه الأصل من غير إضافة دلالة لاهوتية.
- issue: هل تُترجم πρώτην ترجمة حرفية بمعنى «الأولى» أم سياقية بمعنى «الأفضل»؟
  choice: أفضل حُلّة
  alternative: الحُلّة الأولى
  rationale: العبارة تشير على الأرجح إلى الحُلّة الأولى منزلةً أو جودةً. اختير المعنى السياقي مع إثبات الحرفي في الحاشية حفاظًا على قدر الاحتمال.
- issue: هل يُخصَّص δακτύλιον بأنه خاتم خَتْم؟
  choice: خاتمًا
  alternative: خاتم خَتْم
  rationale: قد يُفهم الخاتم علامةً على استرداد المكانة أو السلطة، لكن اللفظ نفسه لا يحدد نوعه، فلا ينبغي إدخال هذا الاستنتاج في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة سردية كريمة. استُخدمت «حُلّة» بدل «ثوب» لنقل دلالة الرداء المميز، و«نعلين» للدقة التاريخية. حوفظ على أوامر الجمع الموجهة إلى عبيد البيت وعلى الإلحاح في «أسرعوا».
