  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: ar
  text: 'فقال له: «يا بُنَيَّ، أنت معي دائمًا، وكلُّ ما لي هو لك.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον
  choice: يا بُنَيَّ
  rationale: نداء عائلي حنون موجَّه إلى ابن ذكر في السياق. «يا بُنَيَّ» تنقل المودة التي في اللفظة اليونانية، من غير إضافة ضمير ملكية مستقل.
- source_word: πάντοτε
  choice: دائمًا
  rationale: تنقل معنى الاستمرار في «في كل وقت» بصياغة عربية طبيعية واضحة.
- source_word: μετ’ ἐμοῦ
  choice: معي
  rationale: مقابل مباشر وطبيعي لمعنى المصاحبة في μετά مع المضاف إليه.
- source_word: πάντα τὰ ἐμὰ
  choice: كلُّ ما لي
  rationale: تعبير عربي جامع وطبيعي يدل على جميع ممتلكات الأب دون حصر قانوني زائد.
- source_word: σά ἐστιν
  choice: هو لك
  rationale: يحافظ على اتساع العبارة اليونانية؛ فقد تفيد أن ما للأب متاح للابن أو عائد إليه، من غير فرض صياغة قانونية مثل «ملكك».
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: فقال له
  rationale: الفاء تلائم تتابع الحوار في العربية، وتسمح باستشعار الردّ على شكوى الابن دون تضخيم δέ إلى استدراك قوي.
theological_decisions:
- issue: صيغة نداء الأب لابنه الأكبر
  choice: «يا بُنَيَّ»
  alternative: «يا ابني» أو «يا ولدي»
  rationale: اللفظة τέκνον أوسع من υἱός، لكنها هنا خطاب حنون لابن ذكر معلوم من السياق. التصغير التحبيبي «بُنَيَّ» يصون دفء النداء وعلاقته الأبوية من غير تحميله دلالة مذهبية.
- issue: طبيعة قول الأب «كل ما لي هو لك»
  choice: 'الإبقاء على العبارة عامة: «هو لك»'
  alternative: «ملكك» أو «سيؤول إليك»
  rationale: النص لا يحدد بدقة هل المقصود حق الملكية القانوني الحالي أم الانتفاع والمآل ضمن سياق المثل؛ لذلك تُحفظ سعة العبارة وتوترها السردي.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدم «يا بُنَيَّ» بوصفه نداءً أبويًا حنونًا مألوفًا، مع الحفاظ على إيجاز الجملة اليونانية وتوازن عبارتي «أنت معي دائمًا» و«كل ما لي هو لك».
