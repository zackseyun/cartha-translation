  source_fidelity: 'النص العربي ينقل عناصر اليونانية كاملة: جواب الأب، والنداء العائلي الحنون، ودوام الكون معه، وشمول ما للأب، وكونه للابن. «يا بُنَيَّ» مناسبة في السياق لأن المخاطَب ابنٌ ذكر معلوم، وتحمل حنان النداء دون أن تفرض تفسيرًا قانونيًا لعبارة «هو لك».'
