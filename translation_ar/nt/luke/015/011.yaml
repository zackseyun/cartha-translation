lexical_decisions:
- source_word: Εἶπεν δέ
  choice: ثم قال
  rationale: يجمع هذا التعبير بين فعل القول وأداة الانتقال الخفيفة δέ، فيستأنف كلام يسوع بسلاسة من غير أن يحمّل الأداة معنى التعارض.
- source_word: Ἄνθρωπός τις
  choice: لرجلٍ
  rationale: التنكير في «رجلٍ» يؤدي معنى τις طبيعيًا في العربية، ولا يستلزم التعبير الأثقل «رجل معيّن». وأُبقيت دلالة الذكورة لأن السياق يتحدث عن أبٍ لابنين.
- source_word: εἶχεν
  choice: كان لـ
  rationale: الماضي الناقص يصف الحالة التي تُفتتح بها القصة، وصيغة «كان لـ» هي التعبير العربي الطبيعي عن الملكية هنا.
- source_word: δύο υἱούς
  choice: ابنان
  rationale: يحفظ العدد ودلالة υἱούς المحددة على الأبناء الذكور، مع رفع «ابنان» لأنه اسم كان مؤخر.
theological_decisions:
- issue: درجة التخصيص في Ἄνθρωπός τις
  choice: رجلٍ
  alternative: رجلٍ معيّن
  rationale: التنكير العربي ينقل إدخال شخصية غير مسماة في المثل بوضوح وطبيعية. وتُذكر الصيغة الأكثر حرفية في الحاشية حفاظًا على الفارق الممكن من غير إقحام دلالة رمزية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة قصصية وقورة. قُدّم الجار والمجرور في «كان لرجلٍ ابنان» لأنه الأسلوب العربي الطبيعي في التعبير عن الملكية، مع الحفاظ على بنية افتتاح المثل.
