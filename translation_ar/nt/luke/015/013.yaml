  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: ar
  text: وبعد أيام قليلة[a]، جمع الابن الأصغر كلَّ ما له ورحل إلى بلد بعيد. وهناك بدَّد ثروته[b] وهو يعيش باستهتار[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بعد أيام غير كثيرة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ممتلكاته» أو «أمواله».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «بإسراف». لا يحدد النص هنا خطايا بعينها، بل يصف أسلوب عيش طائشًا ومبددًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: وبعد أيام قليلة
  rationale: تعبير عربي طبيعي ينقل معنى العبارة اليونانية المنفية «بعد أيام غير كثيرة»، مع إثبات الصيغة الحرفية في الحاشية.
- source_word: συναγαγὼν πάντα
  choice: جمع كلَّ ما له
  rationale: يحفظ دلالة الفعل على الجمع والتهيؤ قبل الرحيل، ويفهم «كل شيء» في سياق نصيبه وممتلكاته من غير تحديد كيفية جمعها أو تحويلها.
- source_word: ὁ νεώτερος υἱός
  choice: الابن الأصغر
  rationale: المقابل العربي الواضح والطبيعي لصيغة المقارنة في السياق.
- source_word: ἀπεδήμησεν
  choice: رحل
  rationale: ينقل معنى مغادرة الموطن إلى مكان بعيد، وتكمل شبه الجملة التالية جهة الرحيل.
- source_word: εἰς χώραν μακράν
  choice: إلى بلد بعيد
  rationale: «بلد» مقابل عربي طبيعي لـ χώρα في هذا السياق، و«بعيد» يحفظ معنى μακράν.
- source_word: διεσκόρπισεν
  choice: بدَّد
  rationale: الفعل يعني حرفيًا «شتّت»، لكنه مع الثروة يدل اصطلاحيًا على إضاعتها وإنفاقها بلا تدبير.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: ثروته
  rationale: ينقل معنى ما كان يملكه من مال وممتلكات من غير قصره على النقود وحدها.
- source_word: ζῶν ἀσώτως
  choice: وهو يعيش باستهتار
  rationale: يحفظ دلالة الحال وطريقة العيش الطائشة المبدِّدة، من غير أن يضيف خطايا محددة لا يذكرها النص.
theological_decisions:
- issue: مدى دلالة ἀσώτως على نوع الخطايا
  choice: باستهتار
  alternative: في الفجور
  rationale: الآية تصف نمط عيش منفلتًا ومبددًا، لكنها لا تحدد هنا خطايا جنسية أو نوعًا بعينه من الفجور؛ لذلك تُرك التوتر الدلالي من غير تضييق غير مسند.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة سردية رصينة. قُسّمت الجملة إلى جملتين لتيسير القراءة، مع الحفاظ على تسلسل الأفعال والعلاقة الحالية في العبارة الختامية.
