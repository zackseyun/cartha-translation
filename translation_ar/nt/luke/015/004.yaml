source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: ar
  text: «أيُّ رجلٍ منكم له مئة خروف، فإذا أضاع واحدًا منها، ألا يترك التسعة والتسعين في البرية[a]، ويذهب وراء الضال حتى يجده؟»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الأرض المفتوحة» أو «في مكان مقفر». يمكن للكلمة اليونانية أن تدل على البرية أو الأرض غير المأهولة أو الريف المفتوح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: أيُّ رجلٍ منكم
  rationale: يحافظ على صيغة السؤال التمثيلي وعلى المفرد المذكر في اليونانية، بعبارة عربية طبيعية.
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: له مئة خروف
  rationale: صياغة عربية واضحة وطبيعية تؤدي معنى الملكية في اسم الفاعل اليوناني دون تثقيل الجملة.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: فإذا أضاع واحدًا منها
  rationale: يفيد الفعل هنا فقدان خروف من القطيع، لا إهلاكه. وتربط «فإذا» الحالة بالسؤال ربطًا عربيًا سلسًا مع بقاء الحدث سابقًا للترك والذهاب.
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: ألا يترك التسعة والتسعين
  rationale: ينقل الاستفهام المنفي الذي يتوقع جوابًا بالإيجاب ويحافظ على قوته البلاغية.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: «البرية» مقابل عربي موجز وشائع لـ ἔρημος، مع إبقاء اتساع الدلالة بين الأرض المفتوحة والمكان المقفر في الحاشية.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλὸς
  choice: ويذهب وراء الضال
  rationale: «وراء» تنقل اتجاه السعي والتعقب، و«الضال» يحافظ على اسمية اسم الفاعل وعلى حالة الخروف المفقود.
- source_word: ἕως εὕρῃ αὐτό
  choice: حتى يجده
  rationale: ترجمة مباشرة وطبيعية للغاية الزمنية، والضمير يعود بوضوح إلى الخروف الضال.
theological_decisions:
- issue: صيغة المذكر التمثيلية في السؤال المَثَلي
  choice: أيُّ رجلٍ منكم
  alternative: أيُّ شخصٍ منكم
  rationale: النص اليوناني يستعمل ἄνθρωπος بالمفرد المذكر في مثال تمثيلي؛ فأُبقيت الصيغة المذكرة من غير أن يُفهم منها حصر التطبيق في الرجال.
- issue: وصف الخروف بأنه ضال
  choice: الضال
  alternative: المفقود
  rationale: كلاهما ممكن سياقيًا؛ اختير «الضال» لأنه يصف حال الخروف الذي خرج عن القطيع من غير أن يحسم سبب ضياعه أو يحمّله قصدًا أخلاقيًا.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدم «مئة» وفق الرسم الإملائي الحديث، وصيغ السؤال بأسلوب عربي طبيعي مع الحفاظ على بنيته البلاغية وتوتره الدلالي.
