  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: ar
  text: 'هكذا[a]، أقول لكم: يكون هناك فرحٌ أمام ملائكة الله[b] لأجل خاطئٍ واحدٍ يتوب.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كذلك» أو «وعلى هذا النحو».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في حضرة ملائكة الله». ولا يصرّح اللفظ بأن الملائكة أنفسهم هم الذين يفرحون.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: وعلى هذا النحو
  rationale: تربط العبارة تطبيق القول بالمثل السابق وتحفظ معنى المماثلة، بصياغة عربية واضحة وطبيعية.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: تنقل صيغة الخطاب المباشر كما هي، بأسلوب عربي فصيح ومألوف.
- source_word: γίνεται χαρά
  choice: يكون فرحٌ
  rationale: تعبّر عن حدوث الفرح أو وجوده من غير تعيين فاعل له، محافظةً على تركيب المصدر اليوناني.
- source_word: ἐνώπιον
  choice: أمام
  rationale: تنقل دلالة الحضور والمثول من غير أن تجعل الملائكة صراحةً أصحاب الفرح.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: ملائكة الله
  rationale: ترجمة مباشرة وطبيعية للتركيب الإضافي اليوناني.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: لأجل خاطئٍ واحدٍ
  rationale: تبيّن أن توبة الخاطئ هي مناسبة الفرح وسببه، مع إبراز العدد «واحد» كما في الأصل.
- source_word: μετανοοῦντι
  choice: يتوب
  rationale: ينقل اسم الفاعل المضارع بجملة صلة عربية طبيعية، ويحفظ المعنى الكتابي الواسع للتوبة من غير شرح عقائدي زائد.
theological_decisions:
- issue: معنى لغة التوبة
  choice: يتوب
  alternative: يغيّر فكره؛ يرجع
  rationale: لفظ «يتوب» هو المقابل العربي الكتابي الطبيعي، ويحفظ اتساع المفهوم من غير اختزاله في تغيير ذهني أو توسيعه بتفسير مذهبي.
- issue: موضع الفرح وصاحبه
  choice: يكون فرحٌ أمام ملائكة الله
  alternative: يفرح ملائكة الله؛ يكون فرح بين ملائكة الله
  rationale: النص اليوناني يذكر أن الفرح يكون «أمام» الملائكة، ولا يصرّح بأن الملائكة أنفسهم هم الفاعل؛ لذلك حُفظ هذا الاحتمال والتوتر الدلالي.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُخدم «وعلى هذا النحو» لإظهار الصلة بالمثل السابق، ووُضعَت علامة الحاشية الثانية عند العبارة التي تشرحها مباشرةً.
