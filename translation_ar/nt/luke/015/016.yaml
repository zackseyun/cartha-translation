  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: ar
  text: وكان يشتهي أن يملأ بطنه من قرون الخَرّوب التي كانت الخنازير تأكلها[a]، ولم يكن أحد يعطيه شيئًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي ثمار الخَرّوب القرنية، وكانت تُستعمل عادةً علفًا للحيوانات.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐπεθύμει
  choice: كان يشتهي
  rationale: صيغة الماضي الناقص تدل على رغبة مستمرة وشديدة، و«كان يشتهي» تعبير عربي طبيعي يحفظ هذا المعنى.
- source_word: γεμίσαι
  choice: أن يملأ
  rationale: يحفظ المعنى الحسي المباشر للفعل من غير تحويله إلى معنى تفسيري مثل «أن يشبع».
- source_word: τὴν κοιλίαν αὐτοῦ
  choice: بطنه
  rationale: تشير κοιλία هنا إلى البطن بوصفه موضع الجوع؛ و«بطنه» واضحة وطبيعية في العربية المعاصرة.
- source_word: ἀπὸ τῶν κερατίων
  choice: من قرون الخَرّوب
  rationale: تحافظ «من» على دلالة حرف الجر اليوناني، وتحدد «قرون الخروب» نوع الثمر المقصود.
- source_word: κερατίων
  choice: قرون الخَرّوب
  rationale: اللفظ اليوناني يدل تحديدًا على ثمار الخروب القرنية التي كانت تُستعمل علفًا للحيوانات.
- source_word: οἱ χοῖροι
  choice: الخنازير
  rationale: المقابل العربي المعاصر الواضح والمباشر.
- source_word: ἤσθιον
  choice: كانت ... تأكلها
  rationale: ينقل الماضي الناقص مشهد الأكل المستمر، مع ضمير يعود بوضوح إلى قرون الخروب.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: لم يكن أحد يعطيه شيئًا
  rationale: تعكس الصيغة الاستمرارية في الماضي، و«شيئًا» تستكمل المفعول المفهوم ضمنًا على نحو طبيعي في العربية.
