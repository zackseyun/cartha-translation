revisions:
- from: وَبَعْدَ أَنْ أَنْفَقَ كُلَّ شَيْءٍ، حَدَثَتْ مَجَاعَةٌ شَدِيدَةٌ فِي تِلْكَ الْبِلَادِ، فَبَدَأَ هُوَ نَفْسُهُ يَحْتَاجُ.
  to: وبعد أن أنفق كل شيء، حلّت مجاعة شديدة في تلك البلاد، فبدأ يعاني العوز.
  rationale: تُبقي المراجعة البنية الزمنية والمعنى المعجمي للنص اليوناني، وتحسّن السلاسة العربية. حُذف التوكيد المطوّل «هو نفسه» لأنه ليس لازمًا لإيصال الإبراز اليوناني في هذا الموضع، واستُبدل التعبير الأقل طبيعية «يحتاج» بـ«يعاني العوز» لنقل ἤρξατο ὑστερεῖσθαι بوضوح. لا تستلزم الآية حواشي؛ ولا تُنقل حواشي المسار الإنجليزي لأن مراسيها هناك غير متسقة مع العبارات التي تشرحها، ولأن بدائلها لا تحتاج إلى توثيق في النص العربي.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: إنفاق كل شيء، ثم وقوع مجاعة شديدة في تلك المنطقة، ثم بدء معاناة الابن من العوز. لكن «هو نفسه» أقوى وأثقل من اللازم في العربية؛ فـ αὐτός قد يحمل إبرازًا للسياق، ولا يقتضي هنا صيغة توكيدية مطوّلة. كما أن «يحتاج» صحيح في الجملة، لكنه أقل سلاسة من التعبير العربي المباشر عن العوز.'
  naturalness: '«وبعد أن أنفق كل شيء» و«مجاعة شديدة» سليمتان وطبيعيتان. والأفصح والأكثر سلاسة سرديًا: «حلّت مجاعة شديدة في تلك البلاد» و«بدأ يعاني العوز».'
  terminology: «أنفق» يوافق δαπανάω من غير إدخال الحكم التقويمي في «بدّد»، و«مجاعة شديدة» تقابل λιμὸς ἰσχυρά بدقة. وتصلح «تلك البلاد» لـ χώρα في هذا السياق، مع أن «تلك المنطقة» ممكنة أيضًا.
  issues:
  - severity: low
    issue: صيغة «فبدأ هو نفسه يحتاج» ثقيلة وأشدّ توكيدًا مما تقتضيه العربية المعاصرة.
    rationale: الأداة αὐτός ظاهرة في اليونانية، لكن يكفي في العربية الضمير المستتر أو الفعل المسند إليه ضمن تسلسل السرد؛ و«يعاني العوز» أوضح وأفصح من الاستعمال المطلق لـ«يحتاج».
  - severity: low
    issue: «حدثت مجاعة» مفهومة، لكن «حلّت مجاعة» أنسب لسياق نزول كارثة على بلد أو منطقة.
    rationale: يعكس «حلّت» بصورة طبيعية دلالة ἐγένετο مع λιμός، من دون إضافة معنى غير موجود في الأصل.
  revised_text: وبعد أن أنفق كل شيء، حلّت مجاعة شديدة في تلك البلاد، فبدأ يعاني العوز.
