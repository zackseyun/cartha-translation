  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: ar
  text: وبعد أن أنفق كل شيء، حلّت مجاعة شديدة في تلك البلاد، فبدأ يعاني العوز.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: وَبَعْدَ أَنْ أَنْفَقَ كُلَّ شَيْءٍ
  rationale: صيغ التركيب اليوناني المطلق بالمضاف إليه بوصفه جملة زمنية طبيعية. واختير «أنفق» لأنه يعكس الفعل δαπανάω من غير أن يضيف حكمًا تقويميًا مثل «بدّد» لا يفرضه لفظ هذه الآية وحده.
- source_word: δέ
  choice: وَ
  rationale: تؤدي الواو انتقال السرد في العربية بسلاسة، بينما يتضح التحول من الوفرة إلى الأزمة من مضمون الجملة نفسها، فلا يلزم تشديده باستدراك صريح.
- source_word: ἐγένετο
  choice: حَدَثَتْ
  rationale: يدل الفعل هنا على وقوع المجاعة وبدئها، و«حدثت» تعبير عربي واضح ومباشر.
- source_word: λιμὸς ἰσχυρά
  choice: مَجَاعَةٌ شَدِيدَةٌ
  rationale: الصفة ἰσχυρά تقوّي معنى المجاعة؛ و«شديدة» هي المقابل العربي الطبيعي في هذا السياق.
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: فِي تِلْكَ الْبِلَادِ
  rationale: يفيد κατά مع المنصوب الامتداد المكاني، وتؤدي «في تلك البلاد» المعنى بوضوح من غير صياغة عربية متكلفة. و«البلاد» تلائم χώρα بوصفها الأرض أو المنطقة المقصودة.
- source_word: καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι
  choice: فَبَدَأَ هُوَ نَفْسُهُ يَحْتَاجُ
  rationale: تحفظ «بدأ» الدلالة الابتدائية للتركيب، ويعبّر «يحتاج» عن دخوله في حالة العوز. وأُظهر توكيد αὐτός بعبارة «هو نفسه» لإبراز أنه صار شخصيًا محتاجًا بعد مجاعة البلاد.
