  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: ar
  text: 'فقال أصغرهما لأبيه: «يا أبي، أعطني النصيب الذي يؤول إليَّ من الممتلكات». فقسَّم بينهما موارد عيشه.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «المعيشة» أو «أسباب الحياة»؛ والمقصود هنا ممتلكات الأب وموارد عيشه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: أصغرهما
  rationale: صفة مقارنة مستعملة استعمال الاسم، ومع وجود ابنين في السياق تؤدي «أصغرهما» المعنى بوضوح من غير إضافة كلمة «ابن» غير المذكورة صراحة في الآية.
- source_word: δός μοι
  choice: أعطني
  rationale: نقل مباشر وطبيعي لصيغة الأمر مع ضمير المتكلم في العربية المعاصرة.
- source_word: τὸ ἐπιβάλλον μέρος
  choice: النصيب الذي يؤول إليَّ
  rationale: يحفظ معنى النصيب الواقع للشخص أو المستحق له، ويلائم سياق تقسيم ممتلكات الأسرة من غير أن يحدد آلية قانونية لا يصرح بها النص.
- source_word: οὐσία
  choice: الممتلكات
  rationale: تشير هنا إلى المال أو الملك، و«الممتلكات» عربية واضحة تلائم السياق، بخلاف «التركة» التي قد توحي بأن الأب قد مات.
- source_word: διεῖλεν
  choice: قسَّم
  rationale: المقابل العربي المباشر للفعل الدال على التقسيم أو التوزيع.
- source_word: αὐτοῖς
  choice: بينهما
  rationale: الضمير جمع في اليونانية، والسياق يحدد الشقيقين؛ وصيغة المثنى العربية أدق وأطبع.
- source_word: βίον
  choice: ما كان يملكه ويعيش منه
  rationale: يحفظ المجال الدلالي للفظ βίος، الذي يمكن أن يعني أسباب العيش أو الممتلكات، ويبيّن تداخل المعنيين في هذا السياق بدل اختزاله إلى «مال» فقط.
