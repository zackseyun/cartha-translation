lexical_decisions:
- source_word: ἀναστὰς
  choice: سأقوم
  rationale: اسم الفاعل الأوريستي يسبق الفعل المستقبلي ويعبّر عن أول خطوة في عزم الابن؛ وصيغة المستقبل المنسقة طبيعية في العربية وتحفظ ترتيب الفعلين.
- source_word: πορεύσομαι
  choice: وأذهب
  rationale: يدل الفعل على الحركة نحو الأب، و«أذهب» أوضح تعبير عربي طبيعي دون إضافة معنى الاستعداد للسفر.
- source_word: πρὸς τὸν πατέρα μου
  choice: إلى أبي
  rationale: يفيد حرف الجر مع النصب الاتجاه إلى شخص، و«إلى أبي» موجزة وطبيعية في السياق.
- source_word: ἐρῶ αὐτῷ
  choice: وأقول له
  rationale: تحفظ العبارة فعل القول والمفعول غير المباشر كما في اليونانية، من غير إيحاء بسرد مطوّل.
- source_word: Πάτερ
  choice: يا أبي
  rationale: صيغة نداء مباشرة؛ وإضافة «يا» أداة النداء الطبيعية، و«أبي» هي الصيغة العربية المألوفة لمخاطبة الأب شخصيًا.
- source_word: ἥμαρτον
  choice: أخطأت
  rationale: الفعل الأوريستي يقرّ بفعل واقع؛ و«أخطأت» تعبير عربي واضح عن الاعتراف بالخطيئة، ويحمل السياق دلالته الأخلاقية والدينية.
- source_word: εἰς τὸν οὐρανὸν
  choice: إلى السماء
  rationale: تحفظ العبارة حرف الجر والصورة الأصلية، حيث يُرجّح أن «السماء» كناية توقيرية عن الله، من غير استبدال التفسير بالنص.
- source_word: ἐνώπιόν σου
  choice: وأمامك
  rationale: تنقل المعنى المكاني والمجازي لعبارة «في حضرتك/أمامك»، وتحافظ على اختلافها عن العبارة السابقة بدل تحويلها إلى «ضدك».
theological_decisions:
- issue: هل تُفسَّر «السماء» في المتن بأنها الله صراحة؟
  choice: 'الإبقاء على «السماء»: «أخطأت إلى السماء وأمامك»'
  alternative: «أخطأت إلى الله وإليك» أو «أخطأت إلى الله وأمامك»
  rationale: النص اليوناني يذكر «السماء»، ويُرجّح أنها كناية توقيرية عن الله. إبقاؤها يصون صورة المصدر وما فيها من دلالة لاهوتية من غير حسمها بتفسير داخل المتن.
- issue: العلاقة الدلالية في ἐνώπιόν σου
  choice: «أمامك»
  alternative: «إليك» أو «ضدك»
  rationale: اللفظ يعني حرفيًا «أمامك/في حضرتك»، وقد يتضمن الاعتراف بالإساءة إلى الأب، لكن ترجمته «ضدك» تسوّي بينه وبين العبارة السابقة وتحسم دلالة أوسع من اللفظ نفسه.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. استُخدم «سأقوم وأذهب» لصياغة العزم بصورة طبيعية، وأُبقيت «السماء» و«أمامك» حفاظًا على التعبير اليوناني وغموضه المقصود. لا توجد علامات حواشٍ لأن المسودة لا تتضمن حواشي.
