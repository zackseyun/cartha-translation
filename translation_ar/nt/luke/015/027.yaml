base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: ar
  text: 'فقال له: «جاء أخوك، وذبح أبوك العجل المسمَّن، لأنه استعاده سالمًا معافًى[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صحيحًا». يمكن أن يعني اللفظ اليوناني ὑγιαίνοντα «متمتعًا بالصحة»، أو، على نحو أوسع في هذا السياق، «سالمًا معافًى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: جاء
  rationale: يفيد الفعل وصول الأخ مع بقاء نتيجة الوصول، و«جاء» تعبير عربي طبيعي في السياق، إذ يدل المقام على أنه حاضر الآن.
- source_word: ἔθυσεν
  choice: ذبح
  rationale: يدل الفعل هنا على ذبح الحيوان لإعداد وليمة، و«ذبح» أدق من «قتل» ولا يوحي بالضرورة بذبيحة شعائرية كما قد يفعل «قدَّم ذبيحة».
- source_word: μόσχον τὸν σιτευτόν
  choice: العجل المسمَّن
  rationale: تعبير عربي واضح عن العجل الذي سُمّن خصوصًا للولائم والاحتفال.
- source_word: ὑγιαίνοντα
  choice: سالمًا معافًى
  rationale: يحمل اللفظ معنى كونه صحيحًا أو سليمًا؛ و«سالمًا معافًى» ينقل في سياق العودة معنى السلامة والعافية معًا من غير حصره في الصحة وحدها.
- source_word: ἀπέλαβεν
  choice: استعاده
  rationale: يحفظ معنى التلقي من جديد أو الاسترجاع، وهو أنسب لعودة الابن من مجرد «استقبله».
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: 'فقال له:'
  rationale: الفاء تصل الكلام بسياقه بسلاسة، أما ὅτι فتقدّم قولًا مباشرًا، لذا تُنقل بعلامات الاقتباس لا بلفظ «إنّ» الحرفي.
