  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: ar
  text: وكان جُباة الضرائب والخاطئون جميعًا يقتربون منه ليسمعوه[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كانوا يأتون إليه». يفيد التركيب اليوناني فعلًا متواصلًا أو متكررًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: وكان
  rationale: تنقل «كان» الزمن الماضي المستمر في التركيب، وتؤدي الواو وظيفة δέ الانتقالية الخفيفة من غير إدخال ظرف زمان غير موجود في اليونانية.
- source_word: αὐτῷ ἐγγίζοντες
  choice: يقتربون منه
  rationale: مع «كان» يحفظ الفعل المضارع معنى الاقتراب المتكرر أو المستمر في البناء المحيطي اليوناني، وهو تعبير عربي واضح وطبيعي.
- source_word: πάντες
  choice: جميعُ
  rationale: تحفظ شمول الفئتين المذكورتين، مع صياغة عربية فصيحة ملائمة للإضافة.
- source_word: οἱ τελῶναι
  choice: جُباة الضرائب
  rationale: تعبير عربي واضح عن القائمين بتحصيل الضرائب والإيرادات في السياق الروماني.
- source_word: οἱ ἁμαρτωλοὶ
  choice: الخاطئين
  rationale: ينقل الوصف الاسمي للفئة التي عُدّت آثمة أو سيئة السمعة أخلاقيًا، من غير توسيع تفسيري.
- source_word: ἀκούειν αὐτοῦ
  choice: ليسمعوه
  rationale: 'اللام تنقل غرض الاقتراب، والفعل يحفظ المعنى المباشر المحتمل: سماعه أو الإصغاء إليه.'
theological_decisions:
- issue: الدلالة الاجتماعية والدينية لعبارة «جُباة الضرائب والخاطئين»
  choice: الإبقاء على الفئتين كما سماهما النص من غير شرح تفسيري
  alternative: جُباة الضرائب وسائر المنبوذين، أو جُباة الضرائب والخطاة سيئو السمعة
  rationale: يسمي النص فئتين معروفتين في السياق الإنجيلي؛ وإضافة «المنبوذين» أو «سيئي السمعة» تحسم دلالتهما اجتماعيًا بما يتجاوز اللفظ اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «جُباة الضرائب» بدل مصطلحات تاريخية أقل شيوعًا، وحُفظت استمرارية الفعل في «كان... يقتربون».
