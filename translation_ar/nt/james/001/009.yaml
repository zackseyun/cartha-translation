  yaml_path: translation/nt/james/001/009.yaml
  text: But let the lowly brother boast in his exaltation[b][a],
translation:
  language: ar
  text: أمّا الأخ[a] المتواضع المكانة، فليفتخر برفعته[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الأخ أو الأخت المتواضعان المكانة». اللفظ اليوناني مفرد مذكر، «الأخ»، وقد يُستعمل تمثيلًا للمؤمن أو المؤمنة.
    reason: lexical_alternative
  - marker: b
    text: أو «بمكانته العالية». قد تشير العبارة إلى مقام المؤمن المتواضع المكرّم أمام الله، مع احتمال أن تشمل انقلاب الحال في الحاضر أو المستقبل.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: فليفتخر
  rationale: صيغة أمر تحضّ المؤمن على الافتخار، وتحافظ «يفتخر» على القوة المعجمية للفعل من غير تليينه إلى مجرد الفرح.
- source_word: δὲ
  choice: أمّا
  rationale: تفيد انتقالًا ذا مسحة تقابلية، وتمهّد في العربية للمقابلة بين الأخ المتواضع المكانة والغني في العدد التالي.
- source_word: ὁ ἀδελφὸς
  choice: الأخ
  rationale: يحافظ على المفرد المذكر في اليونانية، مع بيان إمكان استعماله تمثيليًا للمؤمن أو المؤمنة في الحاشية.
- source_word: ὁ ταπεινὸς
  choice: المتواضع المكانة
  rationale: ينقل دلالة انخفاض الحال أو المنزلة، ولا يحصرها في الفقر المادي ولا يفهمها على أنها فضيلة التواضع وحدها.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: برفعته
  rationale: تحافظ «رفعته» على صورة العلو والرفع، وتترك مفتوحًا ما إذا كان المقصود مقامه المكرّم أمام الله الآن أو الرفع الآتي ضمن انقلاب الأحوال.
theological_decisions:
- issue: معنى رفعة الأخ المتواضع المكانة
  choice: الإبقاء على «رفعته» بوصفها مقامًا أو كرامة مرتفعة أمام الله، مع عدم حصرها في الحاضر أو المستقبل.
  alternative: مكانته الاجتماعية العالية الآن، أو مقامه الروحي أمام الله، أو رفعه الأخروي وحده.
  rationale: سياق العددين 9–10 قائم على انقلاب الأحوال، واللفظ اليوناني يحتمل امتداد المعنى بين الكرامة الحاضرة والرفع المستقبلي؛ لذلك لا تحسم الترجمة هذا التوتر.
- issue: الدلالة الجندرية لكلمة ἀδελφός
  choice: ترجمتها «الأخ» في المتن مع توضيح الاستعمال التمثيلي المحتمل في الحاشية.
  alternative: الأخ أو الأخت؛ المؤمن.
  rationale: يحافظ ذلك على صيغة المفرد المذكر في المصدر من غير إنكار أن اللفظ قد يشمل كل مؤمن في هذا السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل تركيب «المتواضع المكانة» لتجنب الإيحاء بأن المقصود مجرد فضيلة التواضع، و«برفعته» للمحافظة على إيجاز الأصل واتساع دلالته.
