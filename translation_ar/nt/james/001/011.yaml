source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: ar
  text: لأن الشمس أشرقت مع الحرّ اللافح[a]، فيبّست العشب، فسقط زهره وزال جمال منظره؛ هكذا أيضًا سيذبل الغني في مساعيه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مع الريح الحارّة». يمكن أن تدل الكلمة اليونانية على الحرّ المحرق، وفي بعض السياقات على الريح الحارّة المصاحبة له.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «في أسفاره». وقد تشير الكلمة اليونانية إلى الرحلات، أو بمعنى أوسع إلى مسار الإنسان في نشاطه ومساعيه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: أشرقت
  rationale: ينقل الفعل الماضي صورة طلوع الشمس بعبارة عربية واضحة ومألوفة.
- source_word: σὺν τῷ καύσωνι
  choice: مع الحرّ اللافح
  rationale: يحافظ على معنى الحرارة المحرقة، مع إبقاء احتمال الإشارة إلى الريح الحارة في الحاشية.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: فيبّست العشب
  rationale: يعبّر عن أثر الحرارة في النبات ويحافظ على الصورة الحسية المتتابعة.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: فسقط زهره
  rationale: يحافظ على المعنى المادي للفعل وعلى عود الضمير إلى العشب بوصفه نباتًا مزهرًا.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: جمال منظره
  rationale: ينقل معنى الحسن الظاهر دون استعمال «وجهه» استعمالًا مستغربًا في وصف الزهر.
- source_word: ἀπώλετο
  choice: زال
  rationale: يفيد فناء الجمال واختفاءه في سياق الذبول، بصياغة عربية طبيعية.
- source_word: ὁ πλούσιος
  choice: الغني
  rationale: يحافظ على المفرد المذكر التمثيلي في النص اليوناني من غير أن يحصر التحذير في الرجال.
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: في مساعيه
  rationale: ينقل المعنى الأوسع لمسار نشاط الإنسان وأعماله، مع ذكر المعنى الحرفي «أسفاره» في الحاشية.
- source_word: μαρανθήσεται
  choice: سيذبل
  rationale: يحافظ على استعارة النبات وعلى دلالة المستقبل وحتمية المصير الموصوف.
theological_decisions:
- issue: دلالة المفرد المذكر في ὁ πλούσιος
  choice: الغني
  alternative: الشخص الغني
  rationale: أُبقي المفرد المذكر التمثيلي كما في اليونانية، من غير أن يُفهم منه استثناء المرأة الغنية من التحذير.
- issue: مدى معنى πορείαις في التحذير الموجّه إلى الغني
  choice: مساعيه
  alternative: أسفاره
  rationale: قد تدل الكلمة على الرحلات حرفيًا أو على مجرى النشاط والأعمال؛ والسياق يرجّح المعنى الأوسع، مع حفظ المعنى الحرفي في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. حوفظ على تتابع صورة الشمس والعشب والزهر والذبول، وعلى الغموض المعجمي الحقيقي في «الحرّ/الريح الحارّة» و«المساعي/الأسفار» بواسطة الحواشي.
