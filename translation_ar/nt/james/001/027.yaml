  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: ar
  text: 'الدِّيانة الطاهرة غير المدنَّسة في نظر الله الآب هي هذه: أن يعتني الإنسان باليتامى والأرامل في ضيقهم[a]، وأن يحفظ نفسه بلا دنس من العالم[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يفتقد اليتامى والأرامل في ضيقهم»؛ فالفعل اليوناني قد يشمل الزيارة والتفقد مع تقديم الرعاية العملية.'
    reason: lexical_alternative
  - marker: b
    text: يشير «العالم» هنا إلى النظام الأخلاقي الفاسد المقاوم لله، لا إلى الخليقة في ذاتها.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: الدِّيانة
  rationale: يدل اللفظ هنا على ممارسة التدين الظاهرة والعملية، لا على الإيمان بمعناه العام؛ و«الدِّيانة» واضحة وتحافظ على هذا المعنى.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: الطاهرة غير المدنَّسة
  rationale: يحافظ التعبيران على التوازي بين النقاء وعدم التلوث، بما في ذلك الإيحاء الأخلاقي والتعبدي.
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: في نظر الله الآب
  rationale: تفيد παρά مع المجرور التقييم في حضرة الله أو بحسب نظره، كما أن اقتران «الله» و«الآب» يرجح فهمهما لقبين للمرجع نفسه.
- source_word: ἐπισκέπτεσθαι
  choice: أن يعتني
  rationale: الفعل قد يعني الزيارة، لكنه في هذا السياق يشمل التفقد والرعاية العملية، ولذلك تنقل «يعتني» المقصود بوضوح مع إثبات البديل في الحاشية.
- source_word: ὀρφανοὺς καὶ χήρας
  choice: باليتامى والأرامل
  rationale: مقابل عربي مباشر وطبيعي لفئتين معرضتين للضعف والحاجة.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: في ضيقهم
  rationale: «الضيق» ينقل معنى الشدة والمحنة بلغة عربية واضحة وموجزة.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: أن يحفظ نفسه بلا دنس
  rationale: يحافظ على صورة صون النفس من التلوث الأخلاقي، ويجعل المفرد المذكر ذا قوة تعميمية كما في الأصل.
- source_word: ἀπὸ τοῦ κόσμου
  choice: من العالم
  rationale: يحافظ على عبارة النص الموجزة وعلى توترها الدلالي، من غير توسيع تفسيري داخل المتن.
theological_decisions:
- issue: دلالة «العالم» (κόσμος) في السياق الأخلاقي
  choice: إبقاء «العالم» في المتن، مع بيان أن المقصود هنا النظام الأخلاقي الفاسد المقاوم لله.
  alternative: فساد العالم؛ النظام العالمي الحاضر
  rationale: السياق أخلاقي، لكن توسيع العبارة في المتن قد يوحي بأن التفسير جزء من اللفظ نفسه أو بأن الخليقة في ذاتها مدنسة.
- issue: القوة التعميمية للضمير ἑαυτόν
  choice: 'أن يحفظ الإنسان نفسه، مصوغة في المتن: «أن يحفظ نفسه» بعد ذكر «الإنسان».'
  alternative: أن يحفظ المرء نفسه؛ أن يحفظ نفسه من دون فاعل مصرح به
  rationale: المفرد المذكر اليوناني يؤدي وظيفة المبدأ العام؛ وإدخال «الإنسان» يوضح العموم في العربية ولا يقصر الوصية على الرجال.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «الدِّيانة» للدلالة على التدين العملي، و«في ضيقهم» بدل صياغة أثقل، مع الحفاظ على الإيجاز والتوازي في الجملة اليونانية. وُضعت علامتا الحاشيتين في المتن عند موضعيهما الدلاليين.
