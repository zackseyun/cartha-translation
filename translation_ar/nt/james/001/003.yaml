lexical_decisions:
- source_word: γινώσκοντες
  choice: لأنكم تعلمون
  rationale: اسم فاعل حالي مرفوع للجمع، مرتبط بسياق الأمر في الآية السابقة. والصياغة السببية توضّح أن معرفتهم هذه هي أساس اعتبار التجارب فرحًا، مع الحفاظ على الصلة النحوية الطبيعية بالعربية.
- source_word: ὅτι
  choice: أن
  rationale: تُدخل مضمون ما يعلمه المخاطبون، وقد أُدِّي المعنى السببي في ترجمة γινώσκοντες.
- source_word: τὸ δοκίμιον
  choice: اختبار
  rationale: يمكن أن يدل اللفظ اليوناني على عملية الاختبار أو على الأصالة التي يكشفها الاختبار. يلائم معنى العملية سياق التجارب مباشرة، مع حفظ الاحتمال الآخر في الحاشية.
- source_word: ὑμῶν τῆς πίστεως
  choice: إيمانكم
  rationale: يدل التركيب على الإيمان الذي يخص المخاطبين ويخضع للاختبار. و«الإيمان» هو المقابل العربي الواضح والمألوف لـ πίστις في هذا السياق.
- source_word: κατεργάζεται
  choice: يُنتج
  rationale: 'الفعل هنا ذو معنى فعّال ونتائجي: الاختبار يُحدث نتيجة. و«يُنتج» تعبير عربي واضح ومباشر.'
- source_word: ὑπομονήν
  choice: الثبات
  rationale: يدل اللفظ على الصمود المستمر تحت المشقة. و«الثبات» طبيعي في العربية ويحفظ معنى المثابرة دون أن يوحي بمجرد الانتظار السلبي.
theological_decisions:
- issue: ترجمة πίστις
  choice: الإيمان
  alternative: الثقة أو الأمانة
  rationale: السياق يتحدث عن إيمان القرّاء الذي تمتحنه التجارب، ولا يفرض تخصيص المعنى بالثقة وحدها أو بالأمانة السلوكية.
- issue: دلالة δοκίμιον
  choice: عملية اختبار الإيمان
  alternative: أصالة الإيمان المثبتة بالاختبار
  rationale: تتصل عملية الاختبار بالتجارب المذكورة في السياق وتؤدي إلى الثبات، لكن اللفظ اليوناني يحتمل أيضًا الصفة التي يبرهن عليها الاختبار؛ لذلك حُفظ الاحتمال في الحاشية بدل حسمه لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. استُخدم «الثبات» لإبراز الصمود الفاعل تحت التجارب، وأُبقي الاحتمال المعجمي في δοκίμιον ظاهرًا في الحاشية.
