  text: لأنكم تعلمون أن اختبار إيمانكم يُنتج الثبات[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أصالة إيمانكم المثبتة بالاختبار». يمكن أن يشير اللفظ اليوناني إلى عملية الاختبار أو إلى الصفة التي يكشفها الاختبار.
