id: JAS.1.21
reference: James 1:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: ar
  text: لذلك، اطرحوا عنكم كلَّ دنسٍ ووفرةَ الشر[a]، وتقبَّلوا بوداعةٍ[b] الكلمةَ المغروسةَ[c] القادرةَ أن تخلِّص نفوسكم[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كثرة الشر»، أو: «زيادة الخبث».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بلطف»، أو: «بتواضع».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «الكلمة الفطرية»؛ وتقليديًا: «الكلمة المطعَّمة».'
    reason: lexical_alternative
  - marker: d
    text: 'أو: «حياتكم»، أو: «أنفسكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: لذلك
  rationale: تحفظ علاقة الاستنتاج بما سبق بصياغة عربية واضحة وموجزة.
- source_word: ἀποθέμενοι
  choice: اطرحوا عنكم
  rationale: تعبر طبيعيًا عن صورة خلع الشيء أو التخلص منه، وتؤدي في العربية فعلًا مصاحبًا للأمر الرئيس دون إثقال الصياغة بتركيب اسمي.
- source_word: πᾶσαν ῥυπαρίαν
  choice: كلَّ دنسٍ
  rationale: يحفظ «الدنس» الصورة الحسية والمعنى الأخلاقي معًا، وهو أفصح وأوضح من «القذارة» في هذا السياق.
- source_word: περισσείαν κακίας
  choice: كلَّ فيضٍ من الشر
  rationale: «فيض» يحفظ دلالة الكثرة أو الزيادة في περισσεία، و«الشر» ينقل κακία دون حصرها في الحقد أو الخبث.
- source_word: ἐν πραΰτητι
  choice: بوداعةٍ
  rationale: تؤدي πραΰτης بوصفها لطفًا متواضعًا وقابلية للتلقي، مع بقاء بدائل مثل اللطف والتواضع ممكنة.
- source_word: δέξασθε
  choice: تقبَّلوا
  rationale: ينقل الأمر باستقبال الكلمة وقبولها عن طواعية، وهو طبيعي مع «الكلمة» في العربية المعاصرة.
- source_word: τὸν ἔμφυτον λόγον
  choice: الكلمةَ المغروسةَ فيكم
  rationale: «المغروسة» تحفظ صورة شيء جُعل في الداخل ونما فيه، و«فيكم» يوضح الدلالة الكامنة في الصفة اليونانية دون تحديد كيفية الغرس.
- source_word: τὸν δυνάμενον σῶσαι
  choice: القادرةَ أن تخلِّص
  rationale: يحفظ وصف قدرة الكلمة على الخلاص دون زيادة تفسير لآلية ذلك.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: نفوسكم
  rationale: يحفظ المقابل التقليدي والدلالة اللاهوتية المحتملة لـ ψυχή، مع توثيق احتمال معنى الحياة أو الذات.
theological_decisions:
- issue: دلالة τὰς ψυχὰς ὑμῶν في سياق الخلاص
  choice: نفوسكم
  alternative: 'حياتكم؛ أو: إياكم أنتم'
  rationale: «نفوسكم» تحفظ ثقل لغة الخلاص ولا تختزل ψυχή في الحياة الجسدية، مع إبقاء سعة اللفظ اليوناني موثقة في الحاشية.
- issue: دلالة τὸν ἔμφυτον λόγον
  choice: الكلمة المغروسة فيكم
  alternative: 'الكلمة الفطرية؛ أو تقليديًا: الكلمة المطعَّمة فيكم'
  rationale: تحفظ «المغروسة» احتمال كون الكلمة قد غُرست من الله أو صارت راسخة في السامعين، من غير حسم للكيفية.
- issue: العلاقة الزمنية في ἀποθέμενοι مع δέξασθε
  choice: 'أمران منسقان: «اطرحوا... وتقبّلوا»'
  alternative: بعد أن تطرحوا... تقبّلوا
  rationale: الصياغة العربية المنسقة تحفظ قوة الحث وتسمح بأن يكون الطرح سابقًا أو مصاحبًا للتلقي بدل فرض تعاقب زمني صارم.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «اطرحوا عنكم» بدل ترجمة حرفية ثقيلة للمشاركة، و«المغروسة فيكم» للحفاظ على الصورة مع وضوح المقصود. أُثبتت جميع علامات الحواشي في المتن، وجُمعت بعد الجملة لتجنب قطع انسيابها.
