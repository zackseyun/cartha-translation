  text: For a man's anger does not produce God's righteousness.
translation:
  language: ar
  text: لِأَنَّ غَضَبَ الإِنْسَانِ لَا يُحَقِّقُ بِرَّ اللهِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ ἀνδρός
  choice: غَضَبَ الإِنْسَانِ
  rationale: تفيد العبارة غضب الإنسان على وجه العموم، لا غضب الذكر في مقابل الأنثى؛ وهذه صياغة عربية واضحة وموجزة.
- source_word: δικαιοσύνην θεοῦ
  choice: بِرَّ اللهِ
  rationale: 'يحافظ هذا التعبير على الإضافة واحتمال دلالتها: البر الذي يخص الله أو يطلبه أو يحققه، من غير حصرها في تفسير واحد.'
- source_word: οὐκ ἐργάζεται
  choice: لَا يَصْنَعُ
  rationale: الفعل يدل على العمل الذي يُحدث نتيجة أو يحققها؛ و«لا يصنع» طبيعي في هذا السياق ويحافظ على العلاقة بين الغضب والبر بوصفه نتيجة لا يحققها.
theological_decisions:
- issue: دلالة «بِرّ الله»
  choice: الإبقاء على العبارة الإضافية «بِرَّ اللهِ»
  alternative: «البر الذي يريده الله» أو «بر الله في الإنسان»
  rationale: النص اليوناني موجز، ويمكن أن تشير الإضافة إلى البر المتصف به الله أو الصادر عنه أو الموافق لمشيئته؛ لذلك لا ينبغي تقييدها بتفسير واحد.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة، مع الحفاظ على إيجاز النص اليوناني وترتيبه السببي.
