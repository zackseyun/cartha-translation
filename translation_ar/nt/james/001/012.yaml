  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: ar
  text: طُوبَى لِلرَّجُلِ الَّذِي يَثْبُتُ فِي الْمِحْنَةِ[a]، لِأَنَّهُ بَعْدَ أَنْ يَجْتَازَ الِاخْتِبَارَ وَيُزَكَّى، سَيَنَالُ إِكْلِيلَ الْحَيَاةِ[b] الَّذِي وَعَدَ بِهِ اللهُ الَّذِينَ يُحِبُّونَهُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «التجربة» أو «الاختبار» أو «الإغراء». فاللفظ اليوناني يتسع لهذه المعاني، لكن السياق هنا يبرز الثبات في المحنة والاختبار.'
    reason: lexical_alternative
  - marker: b
    text: قد يشير «الإكليل» هنا إلى إكليل الظفر الذي كان يُمنح للفائز، لا إلى تاج المَلِك بالضرورة.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: طُوبَى لِـ
  rationale: صيغة عربية فصيحة وطبيعية تحفظ طابع التطويب وقوته، ولا تختزله في شعور ذاتي بالسعادة.
- source_word: ἀνὴρ
  choice: الرجل
  rationale: يحفظ المفرد المذكر الوارد في اليونانية، وهو هنا ذو دلالة تمثيلية عامة.
- source_word: ὑπομένει
  choice: يثبت في
  rationale: ينقل معنى الصمود والمثابرة تحت الضغط بعبارة عربية واضحة وطبيعية.
- source_word: πειρασμόν
  choice: التجربة
  rationale: للكلمة اليونانية مجال دلالي يشمل المحنة والاختبار والإغراء؛ و«التجربة» تحفظ شيئًا من هذا الاتساع، بينما يرجح السياق معنى المحنة التي يُثبَت فيها.
- source_word: δόκιμος γενόμενος
  choice: بعد أن يثبت أنه مزكّى
  rationale: ينقل القوة الزمنية للعبارة ومعنى الخروج من الاختبار مقبولًا وثابت الأصالة، من غير جعله مستحقًا بذاته.
- source_word: λήμψεται
  choice: سينال
  rationale: تعبير عربي مباشر عن الاستقبال المستقبلي للمكافأة الموعودة.
- source_word: στέφανον
  choice: إكليل
  rationale: «إكليل» هو المقابل العربي المألوف لـστέφανος، ويمكن أن يدل على إكليل الظفر لا تاج المُلك.
- source_word: τῆς ζωῆς
  choice: الحياة
  rationale: يحفظ تركيب الإضافة اليوناني «إكليل الحياة» دون تفسير زائد لطبيعة العلاقة.
- source_word: ἐπηγγείλατο
  choice: وعد به الله
  rationale: الفعل ماضٍ، والفاعل الضمني يُفهم طبيعيًا أنه الله؛ إظهاره بالعربية يزيل التباس الضمير الناشئ من اختلاف الجنس النحوي بين «إكليل» ومرجع الفاعل.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: الذين يحبونه
  rationale: ينقل الداتيف بوصفه متلقي الوعد، ويحفظ المضارع الدال على المحبة المميزة المستمرة.
theological_decisions:
- issue: الدلالة المقصودة من πειρασμός في يعقوب 1:12
  choice: التجربة، مع بيان المحنة والاختبار في الحاشية
  alternative: التجربة بمعنى الإغراء أو الفتنة إلى الخطية
  rationale: سياق الثبات والتزكية والمكافأة يرجح المحنة الاختبارية، لكن اللفظ اليوناني نفسه أوسع ويمكن أن يتصل بالإغراء؛ لذلك لا تُمحى هذه الدلالة البديلة.
- issue: فاعل ἐπηγγείλατο الضمني
  choice: إظهار «الله» في النص
  alternative: إبقاء الفاعل ضميرًا مستترًا في «وعد»
  rationale: اليونانية لا تسمي الفاعل صراحة، لكنه يُفهم من السياق أنه الله. إظهاره ضروري تقريبًا لوضوح العربية، ولا يضيف تمييزًا مذهبيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدمت «طوبى» و«إكليل الحياة» لصلاحيتهما الطبيعية في هذا المقام، مع تجنب الألفاظ المذهبية الخاصة. وُضعت علامتا الحاشيتين [a] و[b] في المتن.
