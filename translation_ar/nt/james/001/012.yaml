  to: طُوبَى لِلرَّجُلِ الَّذِي يَثْبُتُ فِي الْمِحْنَةِ[a]، لِأَنَّهُ بَعْدَ أَنْ يَجْتَازَ الِاخْتِبَارَ وَيُزَكَّى، سَيَنَالُ إِكْلِيلَ الْحَيَاةِ[b] الَّذِي وَعَدَ بِهِ اللهُ الَّذِينَ يُحِبُّونَهُ.
