  text: ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: ar
  text: وأما الغنيّ ففي ذُلّه[a]، لأنه كزهر العشب[b] يزول.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بإثبات الفعل المحذوف المفهوم من الآية السابقة: «وأما الغني فليفتخر في ذُلّه».'
    reason: alternative_reading
  - marker: b
    text: «زهر العشب» نقل قريب من الصورة اليونانية، ويؤكد سرعة زوال الغني كما يذبل النبات وهو في زهره.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: وأما الغنيّ
  rationale: استُعملت «أما» لإظهار الانتقال المقابل إلى الغني مع إبقاء الصلة بالآية السابقة، وجاء «الغنيّ» اسمًا مفردًا مذكرًا وفق صيغة اليونانية.
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: ففي ذُلّه
  rationale: تنقل «ذُلّه» معنى خفض المكانة وما يصاحبه من هوان، وتتجنب أن توحي «تواضعه» بأن المقصود أساسًا فضيلة اختيارية.
- source_word: ὅτι
  choice: لأنه
  rationale: تُبقي الأداة على دلالتها السببية، إذ تشرح زوال الغني سبب الافتخار بحال ذلّه المفهومة من السياق.
- source_word: ὡς ἄνθος χόρτου
  choice: كزهر العشب
  rationale: صياغة قريبة من الصورة اليونانية وتحافظ على تشبيه سرعة الزوال بالنبات حين يزهر، من غير إضافة «الحقل» غير الموجودة في النص.
- source_word: παρελεύσεται
  choice: يزول
  rationale: «يزول» تعبير عربي طبيعي عن الفناء وذهاب المكانة، وهو أنسب هنا من المعنى المكاني «يمرّ».
theological_decisions:
- issue: الحذف المعتمد على الآية السابقة
  choice: أُبقي الفعل المفهوم «ليفتخر» غير مصرّح به في المتن، كما في اليونانية.
  alternative: وأما الغني فليفتخر في ذُلّه.
  rationale: تعتمد العبارة نحويًا على فعل الأمر في الآية السابقة. إبقاء الحذف يحافظ على بنية المصدر وعلى قابلية مراجعة الترجمة، مع بيان التقدير في الحاشية.
- issue: دلالة ذلّ الغني
  choice: تشير العبارة إلى خفض الغني وزوال منزلته في ضوء قِصر حياته ومكانته.
  alternative: أن يكون المقصود تواضعًا إراديًا أو مجرد منزلة اجتماعية متدنية.
  rationale: التعليل التالي، «لأنه كزهر العشب يزول»، يرجّح معنى الخفض المرتبط بفناء الغنى والحياة، من غير حصر العبارة في بناء لاهوتي خاص.
translation_notes:
  register: العربية فصحى حديثة واضحة وموقّرة. حوفظ على الإيجاز والحذف الموجودين في الأصل، واستُخدمت «ذُلّه» بدل «تواضعه» لتجنب تحويل الخفض إلى فضيلة إرادية، و«يزول» لسلامة الصورة في الاستعمال العربي.
