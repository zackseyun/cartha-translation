  terminology: «الغنيّ»، و«ذُلّه»، و«زهر العشب»، و«يزول» اختيارات متسقة ودقيقة. لا تحمل الصياغة تفسيرًا مذهبيًا زائدًا، وتحافظ على تمييز خفض المكانة من فضيلة التواضع.
