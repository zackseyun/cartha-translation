lexical_decisions:
- source_word: ἀνὴρ
  choice: رجلٌ
  rationale: يحفظ صيغة المذكر المفرد في اليونانية، وهي هنا ذات دلالة تمثيلية تعود إلى طالب الحكمة في السياق، ولا تقصر المعنى على الذكور.
- source_word: δίψυχος
  choice: منقسم النفس
  rationale: ينقل صورة اللفظ اليوناني، أي الانقسام الداخلي أو ازدواج الولاء، بعبارة عربية طبيعية، من غير حصر المعنى في مجرد التردد الفكري.
- source_word: ἀκατάστατος
  choice: غير ثابت
  rationale: يعبّر بوضوح عن عدم الاستقرار والاتساق، وهو أنسب في السياق من ألفاظ قد توحي بالفوضى الاجتماعية أو الاضطراب الحركي.
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: في جميع طرقه
  rationale: يحافظ على استعارة «الطرق» التي تشير إلى مسالك الإنسان ونمط حياته كله، من غير استبدالها بتفسير مباشر مثل «سلوكه».
theological_decisions:
- issue: لغة المذكر ذات القوة التمثيلية
  choice: إبقاء «رجل» وضمير المذكر في النص الرئيس
  alternative: «شخص منقسم النفس، غير ثابت في جميع طرقه»
  rationale: النص اليوناني مذكر مفرد، لكنه في السياق يصف طالب الحكمة على نحو عام. يحفظ النص الرئيس الصيغة الأصلية، وتوضح الحاشية أن المعنى تمثيلي لا يختص بالرجال.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة الأسلوب. أُبقي التركيب جملة اسمية موجزة موافقة لبنية الأصل، واستُخدمت «منقسم النفس» لإبراز الانقسام الداخلي مع تجنب العبارة الخشبية «ذو نفسين».
