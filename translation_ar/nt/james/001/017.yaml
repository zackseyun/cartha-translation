base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: ar
  text: كلُّ عطاءٍ صالحٍ وكلُّ هبةٍ كاملةٍ مصدرُهما من فوق؛ وهما نازلان من عند أبي الأنوار، الذي لا تغيُّر عنده ولا ظلٌّ ناشئٌ عن دوران[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'يمكن أيضًا: «ولا ظلُّ دوران» أو «ولا ظلٌّ متحوّل». ويُرجَّح أن العبارة تلمّح إلى الظلال المتغيّرة المرتبطة بحركة الأنوار السماوية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: كلُّ عطاءٍ صالح
  rationale: «عطاء» يمكن أن يدل على فعل العطاء وعلى ما يُعطى، فيحفظ مجال δόσις الدلالي ويميّزه نسبيًا من «هبة» في العبارة التالية.
- source_word: πᾶν δώρημα τέλειον
  choice: كلُّ هبةٍ كاملة
  rationale: «هبة» تدل طبيعيًا على الشيء الممنوح، و«كاملة» تحفظ معنى τέλειον من جهة التمام والكمال.
- source_word: ἄνωθέν ἐστιν
  choice: هو من فوق
  rationale: صياغة مباشرة تحافظ على دلالة المصدر العلوي وعلى فعل الكينونة الصريح.
- source_word: καταβαῖνον
  choice: نازلًا
  rationale: يحفظ صورة النزول المستمر من المصدر الإلهي، ويوافق المفرد المحايد في اليونانية العائد إلى مجموع العبارة.
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: من عند أبي الأنوار
  rationale: يحفظ استعارة «أبي الأنوار» دون تفسير الأنوار صراحة في المتن على أنها الأجرام السماوية.
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: الذي لا تغيُّر عنده
  rationale: تعبير عربي واضح يحفظ علاقة παρά ومعنى النفي الوجودي ودلالة παραλλαγή على التغيّر أو التبدّل.
- source_word: τροπῆς ἀποσκίασμα
  choice: ظلٌّ ناشئ عن دوران
  rationale: يحفظ صورة الظل وعلاقة العبارة بالدوران أو التحول، مع صياغة مفهومة في العربية المعاصرة.
theological_decisions:
- issue: صورة «أبي الأنوار» وثبات الله
  choice: الإبقاء على الاستعارة وعلى نفي التغيّر دون تحويلهما إلى تقرير عقائدي تفسيري.
  alternative: التصريح في المتن بأن الأنوار هي الأجرام السماوية، أو اختزال العبارة الأخيرة إلى «الذي لا يتغيّر».
  rationale: النص يقابل ضمنيًا بين ثبات الله وتغيّر الأنوار وظلالها؛ والإبقاء على الصورة يحفظ التوتر البلاغي واللاهوتي في الأصل.
- issue: مرجع اسم الفاعل καταβαῖνον
  choice: استعمال «نازلًا» عائدًا إلى مضمون العطاء والهبة مجتمعين.
  alternative: 'استعمال المثنى «نازلَين» أو إعادة الصياغة: «وينزلان».'
  rationale: اليونانية تستعمل اسم فاعل مفردًا محايدًا، والأصل يحتمل النظر إلى كل ما سبق بوصفه مجموعًا واحدًا؛ لذلك لم يُفرض تثنية غير موجودة في النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «عطاء» و«هبة» لإظهار الفرق النسبي بين الاسمين اليونانيين، وحُفظت استعارتا «أبي الأنوار» و«الظل الناشئ عن دوران» دون توسع تفسيري في المتن.
