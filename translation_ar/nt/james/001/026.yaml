id: JAS.1.26
reference: James 1:26
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: ar
  text: إن كان أحد يظن[a] أنه متديّن، وهو لا يُلجِم[b] لسانه بل يخدع قلبه، فتديُّن هذا الإنسان عديم الجدوى[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يبدو متديّنًا».'
    reason: lexical_alternative
  - marker: b
    text: اللفظ اليوناني يعني حرفيًا وضع اللجام أو الضبط باللجام، كما يُضبط الحيوان.
    reason: lexical_alternative
  - marker: c
    text: 'أو: «باطل» أو «عقيم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: يظن
  rationale: ينقل هنا تقدير الإنسان لنفسه، مع إبقاء احتمال معنى «يبدو» في الحاشية.
- source_word: θρησκὸς / θρησκεία
  choice: متديّن / تديُّن
  rationale: يحافظ على الصلة اللفظية بين الصفة والاسم، ويركّز على ممارسة الإنسان الدينية دون أن يوحي بأن المقصود منظومة دينية بعينها.
- source_word: χαλιναγωγῶν
  choice: يُلجِم
  rationale: يحفظ صورة اللجام المستعملة لضبط الحيوان، وهي صورة يعود إليها يعقوب في 3:2.
- source_word: γλῶσσαν αὐτοῦ
  choice: لسانه
  rationale: ترجمة حسية مباشرة تحفظ موضوع اللسان وصلته بالكلام.
- source_word: ἀπατῶν καρδίαν αὐτοῦ
  choice: يخدع قلبه
  rationale: يحفظ لفظ «القلب» بوصفه دالًا على باطن الإنسان، بدل تسوية العبارة إلى «يخدع نفسه».
- source_word: τούτου
  choice: هذا الإنسان
  rationale: يُظهر قوة اسم الإشارة العائد إلى الشخص الموصوف، بصياغة عربية طبيعية.
- source_word: μάταιος
  choice: عديم الجدوى
  rationale: يعبّر بوضوح معاصر عن انعدام النفع والفاعلية، مع ذكر البدائل الممكنة في الحاشية.
theological_decisions:
- issue: الإحالة المفردة ذات الدلالة العامة
  choice: إن كان أحد ... لسانه ... قلبه
  alternative: إن كان أناس ... ألسنتهم ... قلوبهم
  rationale: يحافظ المفرد على بناء النص اليوناني، بينما تجعل «أحد» دلالته العامة واضحة من غير حصرها في جنس بعينه.
- issue: دلالة θρησκεία وθρησκός
  choice: متديّن / تديُّن
  alternative: تقيّ / عبادة، أو ممارس للشعائر / ممارسة دينية
  rationale: هذا الاختيار يحفظ الرابط الاشتقاقي وينقل الحديث عن التدين المعلن وممارسته، من غير إدخال مفهوم طائفي أو قصر المعنى على التقوى الباطنة.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُعمل «تديُّن» بدل «ديانة» لأن السياق يقيّم ممارسة الشخص الدينية، واستُبقيت صورتا اللسان والقلب كما في الأصل.
