source:
  edition: SBLGNT
  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: ar
  text: 'اعلموا هذا[a]، يا إخوتي الأحباء[b]: وليكن كل إنسان سريعًا في الاستماع، بطيئًا في الكلام، بطيئًا في الغضب.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «أنتم تعلمون هذا»؛ فصيغة الفعل اليوناني تحتمل أن تكون خبرًا أو أمرًا.'
    reason: alternative_reading
  - marker: b
    text: قد يشمل النداء الإخوة والأخوات؛ فلفظ «الإخوة» في اليونانية قد يُستعمل لجماعة المؤمنين كلها.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴστε
  choice: اعلموا هذا
  rationale: تحتمل الصيغة اليونانية الأمر «اعلموا» والخبر «أنتم تعلمون». اختير الأمر لأنه يلائم سياق الوصايا التالية، وأضيف اسم الإشارة لتأدية وظيفة العبارة طبيعيًا في العربية.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: يا إخوتي الأحباء
  rationale: تحافظ العبارة على صيغة الخطاب المذكرة في اليونانية وعلى معنى المحبة في ἀγαπητοί، مع صياغة عربية طبيعية رصينة. وقد يشمل النداء جماعة المؤمنين كلها.
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: وليكن كل إنسان
  rationale: «ليكن» تنقل قوة فعل الأمر للغائب، والواو تؤدي الربط الخفيف في δέ. أما «كل إنسان» فتؤدي الاستعمال العام للمفرد ἄνθρωπος بوضوح ومن غير حصره في الذكور.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: سريعًا في الاستماع
  rationale: صياغة عربية واضحة تنقل الاستعداد والسرعة إلى الإصغاء المقصود، من غير الحرفية الثقيلة في «سريعًا إلى أن يسمع».
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: بطيئًا في الكلام
  rationale: يحافظ على التوازي مع العبارة السابقة ويؤدي معنى التريث في التكلم بلغة عربية مألوفة.
- source_word: βραδὺς εἰς ὀργήν
  choice: بطيئًا في الغضب
  rationale: ينقل العبارة اليونانية الموجزة بمعنى عدم سرعة الانفعال، ويحافظ على التوازي البلاغي بين أوصاف الآية الثلاثة.
theological_decisions:
- issue: 'دلالة Ἴστε: أمر أم خبر'
  choice: 'الأمر: «اعلموا هذا»'
  alternative: 'الخبر: «أنتم تعلمون هذا»'
  rationale: الصيغة اليونانية تحتمل الوجهين صرفيًا. رجّح المتن الأمر بسبب السياق الوعظي، مع إبقاء الوجه الخبري في الحاشية حتى لا يُحسم الغموض الأصيل بصمت.
- issue: شمول النداء ἀδελφοί
  choice: إبقاء الصيغة النصية «إخوتي»
  alternative: «إخوتي وأخواتي»
  rationale: اللفظ اليوناني مذكر جمع، لكنه قد يخاطب جماعة مختلطة من المؤمنين. أبقى المتن الصورة اللغوية للمصدر، وبيّنت الحاشية احتمال الشمول.
- issue: القوة العامة في πᾶς ἄνθρωπος
  choice: «كل إنسان»
  alternative: «كل واحد»
  rationale: «إنسان» في العربية اسم جنس عام يطابق الاستعمال العام للكلمة اليونانية ويشمل كل فرد، من غير إدخال تخصيص جنسي لا يقتضيه السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ التوازي الثلاثي في «سريعًا... بطيئًا... بطيئًا»، واستُخدمت «في» بدل النقل الحرفي الثقيل لحرف الجر اليوناني. جاءت علامات الحواشي في المتن عند موضع الغموض أو البديل الذي تشرحه.
