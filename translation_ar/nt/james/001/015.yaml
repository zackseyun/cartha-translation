source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: ar
  text: ثم إن الشهوة، بعدما تحبل، تلد خطية؛ والخطية، متى اكتمل نموها[a]، تلد موتًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «متى اكتملت» أو «متى بلغت تمامها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: ثم
  rationale: تفيد تتابع المراحل في انتقال التجربة إلى الخطية ثم الموت، وهي صياغة عربية طبيعية ومباشرة.
- source_word: ἐπιθυμία
  choice: الشهوة
  rationale: تدل هنا على الرغبة الخاطئة عمومًا، لا على الرغبة الجنسية وحدها. و«الشهوة» مألوفة في العربية الكتابية، بينما يوضح السياق دلالتها الأخلاقية.
- source_word: συλλαβοῦσα
  choice: بعدما تحبل
  rationale: يحفظ صورة الحبل، ويبين أن هذا الفعل سابق للولادة التي يعبر عنها الفعل الرئيس، من غير تحويل الصورة إلى سببية مجردة.
- source_word: τίκτει
  choice: تلد
  rationale: ينقل صورة الولادة بوضوح وإيجاز طبيعيين في العربية.
- source_word: ἁμαρτίαν
  choice: خطية
  rationale: مقابل عربي كتابي واضح ودقيق للشر الأخلاقي الناتج من الشهوة.
- source_word: δὲ
  choice: و
  rationale: تواصل تسلسل الصورة أكثر مما تفيد استدراكًا حادًا.
- source_word: ἀποτελεσθεῖσα
  choice: متى اكتمل نموها
  rationale: يجمع بين معنى بلوغ الاكتمال وصورة النمو العضوي، مع إبقاء احتمال «اكتملت» ظاهرًا في الحاشية.
- source_word: ἀποκύει
  choice: تلد
  rationale: يحفظ استعارة الولادة المتواصلة في النص اليوناني؛ والتكرار في العربية واضح ومقصود بلاغيًا.
- source_word: θάνατον
  choice: موتًا
  rationale: ترجمة مباشرة تترك طبيعة الموت ومداه من غير تقييد لاهوتي غير مذكور في النص.
theological_decisions:
- issue: طبيعة الصورة التي تربط الشهوة بالخطية والموت
  choice: الإبقاء على صورة الحبل والولادة وتشخيص الشهوة والخطية
  alternative: «ثم تؤدي الشهوة إلى الخطية، والخطية إلى الموت»
  rationale: الصياغة السببية المجردة تزيل الصورة الإنجابية وقوتها البلاغية، بينما يرسم الأصل تدرجًا عضويًا من الشهوة إلى الخطية فالموت.
- issue: دلالة θάνατος
  choice: «موتًا» من غير وصف إضافي
  alternative: «موتًا روحيًا» أو «موتًا أبديًا»
  rationale: الأصل لا يقيد نوع الموت، لذلك ينبغي الحفاظ على سعته وثقله بدل إدخال تحديد عقائدي غير مصرح به.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت استعارة الحبل والولادة، واستُخدم «خطية» بوصفها لفظًا كتابيًا مألوفًا. وُضعت علامة الحاشية [a] في المتن كما يلزم.
