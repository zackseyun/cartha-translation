  text: Do not be deceived[a], my beloved brothers.
translation:
  language: ar
  text: لا تنخدعوا، يا إخوتي الأحباء.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن يكون المعنى: «يا إخوتي وأخواتي»؛ فاللفظ اليوناني المترجَم «إخوتي» قد يُستعمل في مخاطبة المؤمنين جميعًا، بمن فيهم النساء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: لا
  rationale: تدخل «لا» على المضارع هنا فتؤدي معنى النهي بوضوح، من غير إضافة دلالة زمنية أو استمرارية لا يقتضيها السياق.
- source_word: πλανᾶσθε
  choice: تضلّوا
  rationale: يحتمل الفعل معنى الوقوع في الخداع أو الانقياد إلى الضلال. و«تضلّوا» عربية طبيعية تحفظ اتساع التعبير اليوناني، وتناسب التحذير من تبنّي تصور خاطئ عن مصدر التجربة والشر.
- source_word: ἀδελφοί
  choice: إخوتي
  rationale: «إخوة» المقابل المباشر لصيغة الجمع المذكر، وقد تُستعمل في خطاب جماعة المؤمنين بما يشمل النساء؛ ويُوضَّح ذلك في الحاشية.
- source_word: μου
  choice: ـي في «إخوتي»
  rationale: أُدي ضمير المتكلم بالإضافة العربية الطبيعية، وهو يعبّر عن القرب والمودة.
- source_word: ἀγαπητοί
  choice: الأحباء
  rationale: تنقل «الأحباء» معنى المحبة والحميمية في النداء بلغة عربية واضحة وكريمة.
theological_decisions:
- issue: الخطاب المذكر لجماعة المؤمنين
  choice: إبقاء «إخوتي» في المتن مع بيان شمول الاستعمال للنساء في الحاشية
  alternative: «إخوتي وأخواتي»
  rationale: الصيغة اليونانية مذكرة جمعًا، لكنها قد تخاطب جماعة مختلطة على نحو تمثيلي. يحافظ المتن على صورة الأصل، وتمنع الحاشية فهم الخطاب على أنه مقصور على الرجال.
translation_notes:
  register: عربية فصحى حديثة، موجزة ومباشرة، مع نبرة رعوية ودودة. وُضع النداء بعد النهي وفق الأسلوب العربي الطبيعي، وحُفظت علامة الحاشية في المتن.
