  yaml_path: translation/nt/james/001/007.yaml
  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: ar
  text: فلا يظنَّ ذلك الإنسان[a] أنه سينال شيئًا من الرب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ذلك الشخص». جاءت العبارة اليونانية بصيغة المفرد المذكر («ذلك الإنسان»)، لكنها تشير على سبيل التمثيل إلى كل فرد شاكّ وُصف في الآية السابقة.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γὰρ
  choice: فلا
  rationale: تنقل الفاءُ الصلةَ التفسيرية بالآية السابقة، ويؤدي النهيُ بـ«لا» مع الفعل معنى التحذير بصياغة عربية طبيعية.
- source_word: οἰέσθω
  choice: يظنَّ
  rationale: الفعل يعني أن يظن أو يحسب؛ و«يظن» يحافظ على فعل الاعتقاد نفسه من غير تحويله إلى مجرد توقّع.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: ذلك الإنسان
  rationale: يحافظ على الإشارة إلى الفرد المذكور في السياق السابق، وعلى صيغة المفرد المذكر في اليونانية، مع بقاء «الإنسان» تعبيرًا عربيًا فصيحًا ذا دلالة تمثيلية عامة.
- source_word: ὅτι
  choice: أنه
  rationale: تدخل «أن» على مضمون الظن بصورة طبيعية وواضحة في العربية.
- source_word: λήμψεταί
  choice: سينال
  rationale: ينقل المستقبل ومعنى التلقي من مصدر، و«ينال» أفصح في هذا السياق من «يحصل على» وأقل إيحاءً بالفعل المادي المباشر من «يأخذ».
- source_word: τι
  choice: شيئًا
  rationale: وقوع النكرة في سياق النهي يفيد العموم، أي إنه لا ينبغي أن يظن أنه سينال أي شيء.
- source_word: παρὰ τοῦ κυρίου
  choice: من الرب
  rationale: حرف الجر مع المضاف إليه يدل على المصدر، و«الرب» يحافظ على لقب κύριος من غير تعيين مرجعه بأكثر مما يصرح به النص.
theological_decisions:
- issue: مرجع «الرب» (τοῦ κυρίου)
  choice: الرب
  alternative: الله؛ الرب الإله
  rationale: النص اليوناني يستعمل κύριος من غير تحديد إضافي؛ لذا تُحفظ صيغة اللقب ولا يُصرَّح بهوية المرجع بما يتجاوز ألفاظ الآية.
- issue: صياغة ὁ ἄνθρωπος ἐκεῖνος من جهة الجنس والتمثيل
  choice: ذلك الإنسان
  alternative: ذلك الشخص
  rationale: الصيغة اليونانية مفرد مذكر، وتشير إلى الفرد الشاك المذكور قبلها بوصفه مثالًا تمثيليًا. تحافظ «ذلك الإنسان» على البنية والدلالة، وتوضح الحاشية أن المقصود كل فرد تنطبق عليه الصفة.
translation_notes:
  register: صياغة عربية فصحى حديثة واضحة وموقرة. استُعمل «فلا يظنَّ» لإبراز صلة التعليل بالسياق السابق وقوة النهي، مع تجنب ألفاظ مذهبية أو تفسير مرجع «الرب» داخل المتن.
