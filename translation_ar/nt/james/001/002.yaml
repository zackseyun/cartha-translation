lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: كلَّه فرحًا
  rationale: العبارة في موقع المفعول الثاني لـ«احسبوا»، وتفيد اعتبار الأمر فرحًا كله. يحافظ هذا التركيب على قربه من اليونانية من غير تفسيره بعبارة مثل «فرحًا خالصًا».
- source_word: ἡγήσασθε
  choice: احسبوه
  rationale: فعل أمر جمع يدعو إلى تقدير ذهني وتقويم للأمر؛ و«احسبوه» عربي طبيعي يحفظ قوة الأمر ومعنى الاعتبار.
- source_word: ἀδελφοί μου
  choice: يا إخوتي
  rationale: يحفظ صيغة النداء وصلة المتكلم بالمخاطبين. وقد يُراد به عموم جماعة المؤمنين، لذلك ذُكر المعنى الشامل في الحاشية.
- source_word: ὅταν
  choice: متى
  rationale: مع صيغة الاحتمال في اليونانية يدل على زمن غير محدد، أي «كلما/متى». واختيار «متى» موجز ويحفظ عدم التحديد.
- source_word: πειρασμοῖς
  choice: تجارب
  rationale: السياق هنا يدل أساسًا على شدائد تختبر الإيمان، مع بقاء المجال الدلالي للكلمة شاملًا للاختبار، وفي سياقات أخرى للإغراء؛ لذا أُثبت الإيضاح في الحاشية.
- source_word: περιπέσητε
  choice: وقعتم في
  rationale: ينقل الصورة الحية للفعل، أي الوقوع في أمر أو مصادفته، وهو تعبير عربي سليم في سياق الشدائد.
- source_word: ποικίλοις
  choice: متنوعة
  rationale: يدل على اختلاف الأنواع وتعددها، و«متنوعة» مقابِل موجز وقريب من بنية الأصل.
theological_decisions:
- issue: شمول النداء ἀδελφοί لجماعة المؤمنين
  choice: إبقاء «يا إخوتي» في المتن مع بيان احتمال الشمول في الحاشية
  alternative: يا إخوتي وأخواتي
  rationale: يحافظ المتن على الصورة النحوية المذكرة في الأصل، بينما تبين الحاشية أن النداء يُحتمل أن يشمل جماعة المؤمنين كلها، من غير حسم زائد أو إدخال صياغة تفسيرية في المتن.
- issue: دلالة πειρασμοῖς بين المحن والإغراءات
  choice: «تجارب» بمعنى شدائد تختبر الإيمان
  alternative: اختبارات؛ إغراءات
  rationale: يتحدث السياق القريب عن امتحان الإيمان، بينما يميز العدد 13 الإغراء إلى الشر. ومع ذلك تُحفظ السعة المعجمية للكلمة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «احسبوه» للدلالة على التقويم الذهني، و«وقعتم في» للمحافظة على الصورة اليونانية، مع تجنب التوسع التفسيري في المتن.
