  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: ar
  text: أمّا مَن أمعن النظر في الشريعة الكاملة، شريعة الحرية[a]، وثبت فيها، ولم يكن سامعًا ينسى بل عاملًا بالعمل، فسيكون مباركًا في عمله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شريعة الحرية الكاملة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: أمعن النظر في
  rationale: ينقل معنى الانحناء للنظر أو التطلع بعناية، لا مجرد النظرة العابرة، بصياغة عربية طبيعية.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: الشريعة الكاملة، شريعة الحرية
  rationale: يحفظ تركيب البدل في اليونانية بتكرار «شريعة»، ويبقي «الكاملة» و«الحرية» من دون تفسير لاهوتي زائد.
- source_word: παραμείνας
  choice: ثبت فيها
  rationale: يدل على الاستمرار والملازمة، والضمير يعود طبيعيًا إلى الشريعة.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: لم يكن سامعًا ينسى
  rationale: صياغة عربية واضحة تحافظ على مقابلة السماع بالعمل؛ ويُذكر البديل الأقرب إلى صورة الإضافة في الحاشية.
- source_word: ποιητὴς ἔργου
  choice: عاملًا يعمل
  rationale: يحافظ على دلالة الفعل والعمل وعلى المقابلة مع «سامع»، مع تجنب العبارة العربية المتكلفة «فاعل عمل».
- source_word: μακάριος
  choice: مباركًا
  rationale: يحفظ الرنين الديني للنص، وهو أنسب هنا من «سعيدًا» أو «محظوظًا».
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: في عمله
  rationale: ينقل معنى الممارسة والفعل، ويربط خاتمة الآية بعبارة «عاملًا يعمل».
- source_word: ὁ ... οὗτος
  choice: مَن ... فـ
  rationale: ينقل البناء التمثيلي المفرد من غير قصره على الذكور، وبأسلوب عربي سليم.
theological_decisions:
- issue: معنى «شريعة الحرية»
  choice: إبقاء العبارة «شريعة الحرية» من دون حسم المقصود اللاهوتي الدقيق
  alternative: الشريعة التي تمنح الحرية
  rationale: الإضافة اليونانية تحتمل ثراءً دلاليًا ولا تفرض وحدها تفسيرًا بأنها الإنجيل أو الشريعة الأخلاقية أو التعليم الإلهي بمعناه الأوسع.
- issue: القوة التمثيلية للمذكر المفرد
  choice: استخدام «مَن» مع إبقاء المرجع مفردًا
  alternative: الرجل الذي
  rationale: المذكر هنا عام تمثيلي لا يختص بالذكور، و«مَن» تؤدي ذلك طبيعيًا في العربية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «أمّا مَن ... فـ» لإبراز بناء ὁ ... οὗτος، وحُفظت مقابلة السماع بالعمل، مع تجنب التفسير المذهبي لعبارة «شريعة الحرية».
