  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: ar
  text: لِأَنَّهُ تَأَمَّلَ نَفْسَهُ، ثُمَّ انْصَرَفَ، وَنَسِيَ فِي الْحَالِ مَا كَانَ عَلَيْهِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كيف كان». تشير العبارة اليونانية إلى ما كان عليه الشخص من صفة أو هيئة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: تأمّل
  rationale: يفيد الفعل النظر بانتباه أو الملاحظة المتأنية. و«تأمّل نفسه» طبيعي في سياق المرآة ويحفظ معنى النظر المقصود، مع بقاء المفارقة في أن هذا النظر لم يترك أثرًا دائمًا.
- source_word: γὰρ
  choice: لأنه
  rationale: تربط الأداة الجملة بما قبلها بوصفها تفسيرًا أو تعليلًا، و«لأنه» تؤدي هذه الصلة بوضوح.
- source_word: ἑαυτὸν
  choice: نفسه
  rationale: الضمير انعكاسي ومعناه المباشر «نفسه». لم تُضف كلمة «وجهه» لأن هذه الآية لا تكررها، رغم ورودها في سياق تشبيه المرآة.
- source_word: ἀπελήλυθεν
  choice: مضى
  rationale: الفعل يعني الذهاب أو الانصراف. و«مضى» موجزة وفصيحة وطبيعية في تسلسل الأفعال، من غير إثقال العربية بمحاولة تمثيل صيغة التام اليونانية تمثيلًا آليًا.
- source_word: εὐθέως
  choice: في الحال
  rationale: ينقل معنى الفورية بعبارة عربية واضحة وطبيعية.
- source_word: ἐπελάθετο
  choice: نسي
  rationale: المعنى المباشر للفعل هو النسيان أو الكف عن التذكر، و«نسي» أدق المقابلات وأبسطها.
- source_word: ὁποῖος ἦν
  choice: كيف كان
  rationale: ὁποῖος يدل على الصفة أو الهيئة أو النوع، لا على مجرد الهوية. وتحفظ «كيف كان» هذا الاتساع والغموض الطبيعي من غير أن تضيف كلمة «شخص» غير الموجودة صراحة في اليونانية.
theological_decisions:
- issue: الدلالة العامة للمذكر في مثال المرآة
  choice: كيف كان
  alternative: أيَّ نوع من الناس كان
  rationale: الصياغة اليونانية مفردة مذكرة نحويًا، لكن المثال عام ويمثل أي سامع للكلمة. وتتفادى «كيف كان» حصر المعنى في الذكور، مع الحفاظ على المفرد وعلى الدلالة النوعية أو الوصفية.
- issue: طبيعة ما نسيه الناظر
  choice: 'الإبقاء على العبارة المفتوحة: «كيف كان»'
  alternative: نسي حاله الروحية أو حقيقته الأخلاقية
  rationale: النص لا يحدد صراحة أن المنسي هو المظهر الجسدي وحده أو الحالة الأخلاقية وحدها. لذلك لا تُحسم الدلالة لاهوتيًا، بل تبقى ضمن تشبيه المرآة وسياقه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «تأمّل» لإبراز النظر المنتبه في تشبيه المرآة، و«مضى» لتسلسل سردي طبيعي. وُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
