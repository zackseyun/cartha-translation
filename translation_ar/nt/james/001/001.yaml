source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: ar
  text: 'يعقوب، عبدُ[a] الله والربِّ يسوع المسيح، إلى الأسباط الاثني عشر في الشتات[b]: تحية.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خادم». يدل اللفظ اليوناني على شخص ينتمي إلى سيد ويخضع له؛ واختيرت «عبد» للمحافظة على هذه الدلالة الأقوى.'
    reason: lexical_alternative
  - marker: b
    text: كان «الشتات» يُطلق خصوصًا على اليهود المقيمين خارج أرض إسرائيل؛ وقد تُستعمل العبارة هنا أيضًا بدلالة أوسع، لذلك أُبقيت من غير تفسير حاسم في المتن.
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: يعقوب
  rationale: هذا هو المقابل العربي المباشر للاسم اليوناني Ἰάκωβος، وهو الاسم المستقر في التقليد العربي للعهد الجديد.
- source_word: θεοῦ
  choice: الله
  rationale: مضاف إليه متعلق بـ«عبد»، من غير حاجة إلى توسيع أو إعادة صياغة.
- source_word: κυρίου
  choice: الرب
  rationale: يحفظ لقب السلطان المستقر في الاستعمال الكتابي عند الإشارة إلى يسوع.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: ينقل الاسم واللقب نقلًا عربيًا طبيعيًا؛ و«المسيح» يؤدي المعنى اللقبي لـΧριστός.
- source_word: δοῦλος
  choice: عبد
  rationale: يحفظ معنى الانتماء والخضوع لسيد، وهو في العربية تعبير كتابي طبيعي وأقوى دلالة من «خادم»، مع إثبات البديل في الحاشية.
- source_word: ταῖς δώδεκα φυλαῖς
  choice: إلى الأسباط الاثني عشر
  rationale: يحفظ لغة أسباط إسرائيل وصيغة العدد، ولا يعممها إلى جماعات أو شعوب.
- source_word: διασπορᾷ
  choice: الشتات
  rationale: مصطلح عربي واضح ذو دلالة يهودية شبه اصطلاحية، مع إبقاء مدى استعماله في السياق مفتوحًا.
- source_word: χαίρειν
  choice: تحية
  rationale: ينقل الصيغة الاصطلاحية في افتتاح الرسائل، بدل الترجمة الحرفية «افرحوا» التي لا تلائم وظيفتها هنا.
theological_decisions:
- issue: دلالة Χριστός في التعريف بيسوع
  choice: المسيح
  alternative: الكريستوس
  rationale: «المسيح» هو المقابل العربي الدلالي والكتابي المستقر، ويحفظ كونه لقبًا لا مجرد عنصر اسمي.
- issue: دلالة δοῦλος في تعريف يعقوب بنفسه
  choice: عبد
  alternative: خادم
  rationale: «عبد» يحفظ قوة الانتماء الكامل والخضوع التي يحملها اللفظ اليوناني، بينما يظل «خادم» بديلًا ممكنًا بحسب المقام.
- issue: هوية «الأسباط الاثني عشر في الشتات»
  choice: الإبقاء على الصورة الإسرائيلية من دون تفسيرها داخل المتن
  alternative: تفسيرها صراحة بأنها اليهود خارج أرض إسرائيل أو جماعة المؤمنين المتشتتين
  rationale: العبارة قد تستدعي إسرائيل التاريخية وقد تُفهم أيضًا ضمن خطاب ديني أوسع؛ لذلك لا تُحسم دلالتها التفسيرية في المتن.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة، تحافظ على هيئة عنوان الرسالة القديمة. استُعملت «تحية» بوصفها صيغة افتتاحية، وحُفظت العبارة الإسرائيلية «الأسباط الاثنا عشر» من غير تعميم تفسيري.
