  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: ar
  text: ولكن ليطلب بإيمان[a]، من غير أن يرتاب في شيء؛ لأن المرتاب يشبه موجةً من أمواج البحر، تسوقها الريح وتقذفها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بثقة». يمكن أن تحمل الكلمة اليونانية المترجمة «إيمان» هنا معنى الاتكال الواثق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: ليطلب
  rationale: صيغة أمر للغائب في المضارع، و«ليطلب» تحافظ على قوة الحث، كما تلائم سياق طلب الحكمة من الله في الآية السابقة.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد انتقالًا فيه مقابلة خفيفة بين وعد الله بالعطاء وكيفية الطلب.
- source_word: ἐν πίστει
  choice: بإيمان[a]
  rationale: تنقل العبارة اليونانية بإيجاز طبيعي، مع إبقاء «الإيمان» في المتن وحفظ معنى الثقة المتضمن في السياق في الحاشية.
- source_word: μηδὲν διακρινόμενος
  choice: من غير أن يرتاب في شيء
  rationale: الفعل هنا يدل على التردد الداخلي والشك، والصياغة تحافظ على شمول μηδέν مع وضوحها بالعربية.
- source_word: ὁ γὰρ διακρινόμενος
  choice: لأن المرتاب
  rationale: اسم الفاعل المعرّف يدل دلالة عامة على كل من يرتاب، ولا يقتضي تخصيصًا بالذكر.
- source_word: ἔοικεν
  choice: يشبه
  rationale: مقابل عربي مباشر وطبيعي للتشبيه.
- source_word: κλύδωνι θαλάσσης
  choice: موجةً من أمواج البحر
  rationale: ينقل صورة الموج البحري المضطرب بعبارة عربية واضحة، ويتجنب غرابة «موجة من البحر».
- source_word: ἀνεμιζομένῳ καὶ ῥιπιζομένῳ
  choice: تسوقها الريح وتقذفها
  rationale: يحافظ على الفعلين المبنيين للمجهول وعلى صورة الموجة الواقعة تحت قوة الريح واضطرابها، بصياغة عربية حية غير متكلفة.
theological_decisions:
- issue: دلالة πίστις في سياق الطلب من الله
  choice: إيمان
  alternative: ثقة
  rationale: «إيمان» هو المقابل الرئيس ويحفظ الصلة الاصطلاحية في الرسالة، بينما يدل السياق أيضًا على الاتكال الواثق على الله؛ لذلك أُثبت هذا الوجه البديل في الحاشية من غير حسم التداخل الدلالي بينهما.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «المرتاب» بدل تعبير أطول في الجملة التعليلية للمحافظة على تكرار الجذر الدلالي في اليونانية، وجاءت صورة البحر بأفعال حركية مألوفة.
