  rationale: حُذفت الإحالة البديلة عند «إذ شاء» لأن الهامش المقترح لا يقدم قراءة بديلة حقيقية، بل يعيد صياغة المعنى مع إضافة «بمحض» غير المنصوص عليها. ونُقل موضع الهامش الثقافي إلى «باكورة» مع الحفاظ على علامة واحدة سليمة. التعديل لا يحدد ماهية «كلمة الحق» ولا يضيّق «مخلوقاته» إلى البشر.
