base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: ar
  text: إذ شاء، أخرجنا إلى الوجود بكلمة الحق، لكي نكون باكورةً ما من مخلوقاته.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الباكورة» هي أول جزء من الحصاد، وكان يُخصَّص ويُقدَّم لله؛ وهي تصوّر المؤمنين هنا جزءًا أوليًا مكرسًا لله من بين مخلوقاته.
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: إذ شاء ذلك
  rationale: ينقل اسم الفاعل اليوناني الدال على إرادة الله السابقة للفعل الرئيس، بصياغة عربية طبيعية، من غير إدخال تصور مذهبي تفصيلي.
- source_word: ἀπεκύησεν
  choice: وَلَدَنا
  rationale: يحافظ على صورة الولادة الواضحة في الفعل اليوناني وعلى صلتها الأدبية بما ورد عن ولادة الخطية في يعقوب 1:15.
- source_word: λόγῳ ἀληθείας
  choice: بكلمة الحق
  rationale: الباء تنقل دلالة الوسيلة في حالة المجرور اليونانية، و«كلمة الحق» تحافظ على التعبير الكتابي من غير حصر مرجعه بتفسير زائد.
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: لكي نكون
  rationale: ينقل تركيب الغاية أو النتيجة المقصودة بوضوح وطبيعية في العربية.
- source_word: ἀπαρχήν
  choice: الباكورة
  rationale: تحافظ على استعارة أول الحصاد المخصص لله وعلى أصدائها الكتابية والثقافية.
- source_word: τινα
  choice: نوعًا من
  rationale: ينقل وظيفة اللفظة في تقييد الخبر، أي إن المؤمنين باكورة بمعنى تمثيلي ما، لا أنها عدد مبهم.
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: بين مخلوقاته
  rationale: يحافظ على جمع الكائنات أو الأشياء المخلوقة وعلى سعة العبارة، بينما تجعل «بين» العلاقة المقصودة طبيعية بالعربية ولا تحصرها في البشر.
theological_decisions:
- issue: المبادرة الإلهية في الولادة الجديدة
  choice: إذ شاء ذلك، وَلَدَنا
  alternative: بمحض إرادته أوجدنا ولادةً جديدة
  rationale: تُظهر الصياغة أن مشيئة الله سابقة للفعل ومصدر له، لكنها لا تستورد نظامًا مذهبيًا في الاختيار أو التجديد لا يصرح به النص.
- issue: مدى مدلول κτισμάτων
  choice: مخلوقاته
  alternative: البشر الذين خلقهم
  rationale: أُبقي اللفظ واسعًا ليشمل دائرة المخلوقات، ولم يُضيَّق إلى البشر وحدهم من دون قرينة صريحة.
- issue: طبيعة صورة ἀπαρχή
  choice: نوعًا من الباكورة
  alternative: أول المؤمنين زمنيًا
  rationale: تحافظ الصياغة على الصورة الزراعية والتكريسية وعلى عدم تعيين وجه الشبه بدقة، بدل اختزالها في الأسبقية الزمنية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. ضُبطت «وَلَدَنا» بالشكل الجزئي لتفادي قراءتها «وُلِدنا»، ووُضع هامش الباكورة عند اللفظة التي يشرحها.
