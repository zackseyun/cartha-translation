  source_fidelity: 'المعنى الأساسي محفوظ: تقابل الآية بين الله في السياق السابق وبين كون الإنسان يُغرى بسبب شهوته الخاصة، كما حُفظت صورتا الجذب والإغراء. لكن «تُجرِّبه رغبتُه» تجعل الرغبة فاعلًا مباشرًا بصياغة أقل قربًا من المبني للمجهول اليوناني مع ὑπό، و«التجربة» قد تُفهم عربيًا على أنها اختبار. الأنسب في هذا السياق: «يُغرى ... بشهوته الخاصة».'
