  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: ar
  text: لكن كلَّ واحدٍ يُغرى بشهوته الخاصة، حين تجتذبه وتستدرجه.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رغبته الخاصة» أو «توقه الخاص». يمكن للكلمة اليونانية أن تدل على رغبة قوية عمومًا، لا على الرغبة الجنسية وحدها.'
    reason: lexical_alternative
  - marker: b
    text: يوحي الفعلان بصورة من يُجتذب بعيدًا ثم يُغرى بالطُّعم، كما في الصيد أو القنص.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: كلَّ واحدٍ
  rationale: يحافظ على القوة التوزيعية للمفرد في اليونانية، ويبرز مسؤولية كل شخص على حدة بصياغة عربية طبيعية.
- source_word: δὲ
  choice: لكن
  rationale: 'تُظهر المقابلة الخفيفة مع الآية السابقة: ليس الله هو الذي يجرّب، بل تنشأ التجربة من رغبة الشخص الخاصة.'
- source_word: πειράζεται
  choice: تُجرِّبه
  rationale: السياق يتحدث عن الإغراء إلى الخطيئة، لا عن الاختبار بمعناه العام؛ واختيار المبني للمعلوم يجعل «رغبته» فاعلًا واضحًا كما تقتضيه العبارة اليونانية.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: رغبتُه الخاصة
  rationale: تنقل مصدر التجربة وتؤكد أن الرغبة تخص الشخص نفسه. و«الرغبة» أوسع من «الشهوة» في الاستعمال الحديث ولا تحصر المعنى في المجال الجنسي.
- source_word: ἐξελκόμενος
  choice: إذ تجتذبه
  rationale: تنقل صورة سحبه إلى الخارج أو بعيدًا، مع الحفاظ على سلاسة العربية وعدم المبالغة في شدة الفعل.
- source_word: καὶ δελεαζόμενος
  choice: وتستدرجه
  rationale: ينقل معنى الإغراء بالطُّعم أو الجذب إلى الفخ، ويتآلف طبيعيًا مع «تجتذبه» مع إبقاء الصورة المجازية قابلة للشرح في الحاشية.
theological_decisions:
- issue: مصدر التجربة وعلاقته بالله
  choice: نُسبت التجربة إلى رغبة الشخص الخاصة، لا إلى الله.
  alternative: فهم الكلام على أنه مجرد اختبار ناتج من ظروف خارجية.
  rationale: السياق المباشر في الآية 13 ينفي أن الله يجرّب أحدًا، وتشرح هذه الآية المصدر القريب للإغراء إلى الخطيئة من غير أن تحسم مسائل أوسع عن السببية لا يتناولها النص.
- issue: صيغة المفرد التمثيلي
  choice: استُخدمت صيغة المفرد المذكر في «كل واحد» والضمائر العائدة إليه.
  alternative: استخدام صيغة الجمع الشاملة مثل «كل شخص تجرّبه رغباتهم».
  rationale: اليونانية مفردة وتؤدي وظيفة عامة؛ وتحافظ العربية بهذه الصياغة على الإفراد والتوكيد الشخصي بصورة فصيحة طبيعية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير التركيب الفعلي «تُجرِّبه رغبتُه» لتوضيح العلاقة النحوية دون فقدان معنى الأصل، وحُفظت صورة الاجتذاب والاستدراج في المتن مع شرحها في الحاشية.
