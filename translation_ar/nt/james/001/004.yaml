  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: ar
  text: ولْيكن للصبر عمله الكامل[a]، لكي تكونوا ناضجين ومتكاملين، غير ناقصين في شيء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أثره التام». تفيد العبارة اليونانية عملًا يبلغ غايته المقصودة ويكتمل.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: الصبر
  rationale: يدل اللفظ في سياق التجارب على الثبات والمثابرة تحت الضغط؛ و«الصبر» هو التعبير العربي الطبيعي، مع دلالة السياق على الصبر الفاعل لا الانتظار السلبي.
- source_word: ἔργον τέλειον ἐχέτω
  choice: ولْيكن للصبر عمله الكامل
  rationale: يحافظ هذا التركيب على صورة «العمل» وعلى صيغة الأمر للغائب، ويفيد أن يُتاح للصبر أن يبلغ عمله غايته المقصودة.
- source_word: τέλειοι
  choice: ناضجين
  rationale: عند وصف الأشخاص يمكن أن يدل τέλειος على بلوغ النضج أو الغاية، لا بالضرورة على كمال مطلق بلا خطيئة.
- source_word: ὁλόκληροι
  choice: متكاملين
  rationale: يشدد اللفظ على السلامة والشمول في جميع الأجزاء؛ و«متكاملين» تميّزه عن «ناضجين» مع إبقاء التقارب المقصود بينهما.
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: غير ناقصين في شيء
  rationale: صياغة عربية واضحة تحفظ القوة الشاملة لعبارة «في لا شيء» ومعنى عدم القصور.
- source_word: ἵνα ἦτε
  choice: لكي تكونوا
  rationale: تحفظ دلالة الغاية أو النتيجة التي تحملها ἵνα مع صيغة الاحتمال التابعة.
- source_word: δὲ
  choice: و
  rationale: تصل الكلام بما قبله في سياق متتابع من غير إبراز مقابلة حادة.
theological_decisions:
- issue: دلالة τέλειος في سياق نمو المؤمنين
  choice: ناضجين
  alternative: كاملين
  rationale: «ناضجين» تعبّر عن بلوغ الغاية المقصودة في هذا السياق من غير أن تحسم اللفظ في معنى العصمة أو الكمال المطلق، بينما توضح الحاشية الصلة الدلالية بالكمال والتمام.
- issue: العلاقة بين τέλειοι وὁλόκληροι
  choice: ناضجين ومتكاملين
  alternative: كاملين وتامّين
  rationale: 'يحافظ الاختيار على لفظين متقاربين لكن غير مترادفين تمامًا: الأول يبرز بلوغ الغاية والنضج، والثاني يبرز سلامة الكل وعدم نقص أجزائه.'
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت صيغة الأمر «ولْيكن» للمحافظة على قوة ἐχέτω، مع تركيب مفهوم للقارئ العام، وحُفظ التوازي بين النضج والتكامل من غير إدخال تفسير مذهبي.
