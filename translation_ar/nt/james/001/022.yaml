source:
  edition: SBLGNT
  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: ar
  text: ولكن كونوا عاملين بالكلمة، ولا تكونوا سامعين فقط، خادعين أنفسكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مضلّلين أنفسكم»، أو: «موقعين أنفسكم في الخطأ باستدلال زائف».'
    reason: بدائل معجمية تُظهر أن παραλογιζόμενοι قد يدل على خداع الذات بواسطة تفكير أو استدلال مغلوط.
lexical_decisions:
- source_word: Γίνεσθε
  choice: كونوا
  rationale: فعل أمر للجمع يدل في السياق على سلوك مستمر؛ و«كونوا» صياغة عربية واضحة تحفظ قوة الأمر من غير أن تحصره في بدء التحول فقط.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد انتقالًا فيه مقابلة خفيفة مع الاكتفاء بسماع الكلمة في السياق السابق.
- source_word: ποιηταὶ λόγου
  choice: عاملين بالكلمة
  rationale: تنقل معنى ممارسة ما تقوله الكلمة، وتحافظ على المقابلة بين العمل والسماع. كما تُبقي «الكلمة» صلة السياق بعبارة «الكلمة المغروسة» في العدد السابق.
- source_word: ἀκροαταὶ μόνον
  choice: سامعين فقط
  rationale: صياغة موجزة وطبيعية تحفظ معنى الاسم وقوة الحصر في μόνον.
- source_word: παραλογιζόμενοι ἑαυτούς
  choice: فتخدعوا أنفسكم
  rationale: تؤدي معنى خداع الذات، وتربط النتيجة طبيعيًا بالنهي السابق. ويُبيَّن في الحاشية ما في الفعل من إيحاء بالاستدلال المغلوط.
theological_decisions:
- issue: دلالة λόγος في يعقوب 1:22
  choice: الكلمة
  alternative: الرسالة أو التعليم
  rationale: «الكلمة» تحافظ على الصلة المباشرة بـ«الكلمة المغروسة» في 1:21 وعلى الرنين الكتابي، من غير أن تفرض تحديدًا عقائديًا أضيق.
- issue: قوة الأمر Γίνεσθε
  choice: دعوة مستمرة إلى أن يكون المخاطبون عاملين بالكلمة
  alternative: «صيروا» بوصفها دعوة إلى بدء حالة جديدة
  rationale: صيغة الأمر الحاضر تلائم نمط حياة متواصل، و«كونوا» تؤدي ذلك بوضوح في العربية.
- issue: العلاقة النحوية للمشاركة παραλογιζόμενοι
  choice: 'نتيجة ملازمة للاكتفاء بالسماع: «فتخدعوا أنفسكم»'
  alternative: 'وصف حالي مباشر: «خادعين أنفسكم»'
  rationale: الفاء تجعل العربية طبيعية وتوضح أن الاكتفاء بالسماع يفضي إلى خداع الذات، من غير تغيير جوهر العلاقة في اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت المقابلة المتوازنة «عاملين... سامعين» مع تجنب التعبير الحرفي غير الطبيعي «صانعي الكلمة».
