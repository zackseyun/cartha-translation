  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: ar
  text: لأن من يسمع الكلمة ولا يعمل بها يشبه رجلًا يتأمل وجهه الذي وُلد به[a] في مرآة،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «وجه ميلاده»؛ والمقصود وجهه الطبيعي الذي وُلد به.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροατὴς λόγου
  choice: من يسمع الكلمة
  rationale: صياغة عربية طبيعية تحفظ معنى السماع، وتُبقي «الكلمة» ترجمة مباشرة لـλόγος واتصالها بالسياق.
- source_word: οὐ ποιητής
  choice: ولا يعمل بها
  rationale: يُفهم الاسم ποιητής هنا في مقابل السماع بوصفه العمل بمقتضى الكلمة؛ وإضافة الضمير لازمة لوضوح العربية من غير تغيير المرجع.
- source_word: ἔοικεν ἀνδρὶ
  choice: يشبه رجلًا
  rationale: ينقل التشبيه بوضوح ويحفظ اللفظ المذكر المحدد ἀνήρ.
- source_word: κατανοοῦντι
  choice: يتأمل
  rationale: يفيد النظر بانتباه، وهو أدق من مجرد «ينظر» وأوجز وأفصح من عبارة تفسيرية مطولة.
- source_word: τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: وجهه الذي وُلد به
  rationale: ينقل دلالة العبارة اليونانية على الوجه الطبيعي الذي للإنسان منذ ولادته، مع إبقاء غرابة الإضافة الحرفية في الحاشية بدل إثقال المتن.
- source_word: ἐν ἐσόπτρῳ
  choice: في مرآة
  rationale: الترجمة العربية المعاصرة المباشرة والواضحة.
theological_decisions:
- issue: اللغة التمثيلية المذكرة في ἀνδρὶ
  choice: رجلًا
  alternative: شخصًا
  rationale: يحفظ الترجمةُ التذكير الصريح في ἀνήρ، مع بقاء انطباق المثل العام مفهومًا من السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «من يسمع... ولا يعمل» بدل الاسمين الصناعيين «سامع/عامل» لأن ذلك أجزل وأوضح للقارئ المعاصر، مع الحفاظ على المقابلة الأخلاقية بين السماع والعمل.
