base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: ar
  text: 'لا يقل أحد، وهو يتعرض للإغراء: «إن الله هو الذي يغريني»، لأن الله لا يمكن أن يُغرى بالشر[a]، وهو نفسه لا يُغري أحدًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أقرب إلى حرفية اليونانية: «غير قابل للإغراء بالشرور». والنص اليوناني يستعمل هنا صيغة الجمع: «بالشرور».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ... λεγέτω
  choice: لا يَقُلْ أحدٌ
  rationale: صيغة نهي عربية طبيعية تحفظ القوة الأمرية للتركيب اليوناني.
- source_word: πειραζόμενος
  choice: حين يُجرَّب
  rationale: اسم فاعل مضارع مبني للمجهول؛ والسياق اللاحق المتعلق بالشهوة والخطيئة يرجّح معنى الإغراء بالشر، مع إبقاء المبني للمجهول.
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: إنَّ اللهَ هو الذي يُجرِّبني
  rationale: يؤدي معنى المصدر أو الفاعلية في ἀπό بعبارة عربية واضحة، ويحفظ الصيغة المبنية للمجهول دلاليًا وإن صيغت عربيًا بالمعلوم على نحو طبيعي.
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: لا يمكن أن يُجرَّب بالشرور
  rationale: يفيد عدم قابلية الله للتجربة بالشر، مع الحفاظ في المتن على جمع κακῶν ودون تبني معنى «عديم الخبرة بالشرور» الأقل ملاءمة للسياق.
- source_word: πειράζει
  choice: يُجرِّب
  rationale: يُفهم هنا بمعنى يغري بالشر، لا بمعنى يمتحن، بسبب سياق الآية وما يليها.
- source_word: αὐτὸς οὐδένα
  choice: وهو نفسه لا يُجرِّب أحدًا
  rationale: يحفظ توكيد الضمير αὐτός والنفي الشامل في οὐδένα.
theological_decisions:
- issue: دلالة πειράζω في الآية
  choice: استعمال «يُجرِّب» في جميع المواضع، مع فهمه سياقيًا بمعنى الإغراء بالشر.
  alternative: «يفتن» أو «يغري بالشر»، أو التمييز بين «يمتحن» و«يجرّب».
  rationale: يحفظ تكرار الجذر اليوناني والتوتر الدلالي، بينما يوضح السياق أن المقصود ليس امتحان الإيمان بل الاستدراج إلى الشر.
- issue: معنى ἀπείραστός ἐστιν κακῶν
  choice: «لا يمكن أن يُجرَّب بالشرور».
  alternative: «لا يُجرَّب بالشر» أو «لا خبرة له بالشرور».
  rationale: المعنى الأرجح سياقيًا أن الله غير قابل للإغراء بالشر، وهو ما يمهّد لنفي كونه يغري أحدًا؛ وقد حُفظ جمع κακῶν في المتن ووُضعت الصياغة العربية الأسلس في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يُجرِّب» للمحافظة على تكرار الجذر في الأصل، مع اعتماد السياق لتحديد معنى الإغراء بالشر، ووُضعت علامة الحاشية [a] في المتن.
