revisions:
- from: وَإِنْ كَانَ أَحَدٌ مِنْكُمْ تَنْقُصُهُ الْحِكْمَةُ، فَلْيَطْلُبْ مِنَ اللهِ، الَّذِي يُعْطِي الْجَمِيعَ بِسَخَاءٍ وَلَا يُعَيِّرُ، فَسَتُعْطَى لَهُ.
  to: وَإِنْ كَانَ أَحَدٌ مِنْكُمْ يَفْتَقِرُ إِلَى الْحِكْمَةِ، فَلْيَطْلُبْهَا مِنَ اللهِ، الَّذِي يُعْطِي الْجَمِيعَ بِسَخَاءٍ وَلَا يُعَيِّرُ أَحَدًا، فَسَتُعْطَى لَهُ.
  rationale: توضح المراجعة الشيء المطلوب في «فليطلبها»، وتستبدل تركيبًا أثقل بتعبير فصيح معاصر، وتتمم مفعول «يعيّر» بما يلائم الاستعمال العربي. وتحافظ على الشرط، والأمر المفرد ذي الدلالة العامة، ووصف الله بأنه يعطي الجميع بسخاء ومن غير تعيير، والوعد المبني للمجهول بأن الحكمة ستُعطى للسائل.
