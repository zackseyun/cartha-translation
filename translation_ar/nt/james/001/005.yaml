review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، لكن «فليطلب من الله» لا يبيّن في العربية مفعول الطلب، وقد يُفهم على أنه مجرد الدعاء لا طلب الحكمة المقصودة. وإظهار الضمير في «فليطلبها» يوضح الإحالة التي يؤكدها أيضًا «فستُعطى له».
  naturalness: «وإن كان أحد منكم تنقصه الحكمة» ممكنة، لكنها أثقل وأقل سلاسة في الفصحى الحديثة من «وإن كان أحد منكم يفتقر إلى الحكمة». كما أن «ولا يعيّر» يحتاج إلى مفعولٍ مقدّر في العربية؛ وإضافة «أحدًا» طبيعية ولا تغيّر المعنى.
  terminology: '«الحكمة»، «بسخاء»، و«يعيّر» اختيارات مناسبة لـ σοφία وἁπλῶς وὀνειδίζω. لا يلزم نقل الحاشيتين الإنجليزيتين: فالمعنى البديل لـ«من غير أن يعيّر» غير ضروري هنا، وصيغة العربية لا تستدعي ملاحظة عن التذكير التمثيلي.'
  issues:
  - severity: medium
    issue: مفعول «فليطلب» غير مذكور
    rationale: المفعول مفهوم من السياق اليوناني ومن الوعد اللاحق، لكن حذفه في العربية يضعف الربط الدلالي وقد يجعل العبارة تُفهم بمعنى «ليدعُ الله». الضمير «ها» يبين أن المطلوب هو الحكمة.
  - severity: low
    issue: الصياغة الشرطية والفعلية ثقيلة قليلًا
    rationale: استبدال «تنقصه الحكمة» بـ«يفتقر إلى الحكمة» أوضح في العربية المعيارية المعاصرة ويحفظ معنى الافتقار دون تضييق.
  - severity: low
    issue: «ولا يعيّر» بلا مفعول ظاهر
    rationale: إضافة «أحدًا» تجعل النفي طبيعيًا في العربية، وتحافظ على اتساع πᾶσιν وعلى معنى عدم التعيير دون تخصيص مذهبي أو تفسيري.
