  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: ar
  text: وَإِنْ كَانَ أَحَدٌ مِنْكُمْ يَفْتَقِرُ إِلَى الْحِكْمَةِ، فَلْيَطْلُبْهَا مِنَ اللهِ، الَّذِي يُعْطِي الْجَمِيعَ بِسَخَاءٍ وَلَا يُعَيِّرُ أَحَدًا، فَسَتُعْطَى لَهُ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ δέ
  choice: وإن كان
  rationale: تنقل أداة الربط انتقالًا لطيفًا من الكلام السابق من غير مبالغة في معنى الاستدراك، وتلائم الشرط العربي الطبيعي.
- source_word: τις ὑμῶν
  choice: أحد منكم
  rationale: تحافظ على معنى النكرة مع الإضافة الجزئية وعلى توجيه الخطاب مباشرة إلى القراء.
- source_word: λείπεται σοφίας
  choice: تنقصه الحكمة
  rationale: تعبير عربي واضح وطبيعي يفيد افتقار الشخص إلى الحكمة، من غير تضييق مدلول الحكمة على جانب واحد.
- source_word: αἰτείτω
  choice: فليطلب
  rationale: صيغة أمر للغائب تقابل الأمر اليوناني المفرد، ولا تُحمّل زمن المضارع دلالة الاستمرار حتمًا.
- source_word: παρὰ τοῦ διδόντος θεοῦ
  choice: من الله، الذي يعطي
  rationale: تنقل παρά مع المضاف إليه بوصف الله مصدر الطلب، وتحفظ وصفه بأنه المعطي.
- source_word: πᾶσιν
  choice: الجميع
  rationale: تحافظ على الشمول الذي في اللفظ اليوناني من غير تقييد غير مذكور.
- source_word: ἁπλῶς
  choice: بسخاء
  rationale: في سياق العطاء، يدل اللفظ على الجود وعدم الإمساك؛ و«بسخاء» واضحة وشائعة في العربية المعاصرة.
- source_word: μὴ ὀνειδίζοντος
  choice: ولا يعيّر
  rationale: ينقل معنى عدم توبيخ السائل أو تعييره وإشعاره بالخزي، بصياغة عربية مباشرة.
- source_word: δοθήσεται αὐτῷ
  choice: فستُعطى له
  rationale: تحفظ صيغة المستقبل المبني للمجهول، ويعود الضمير المستتر في «تُعطى» على الحكمة.
theological_decisions:
- issue: صيغة المفرد ذات الدلالة العامة
  choice: أحد منكم ... فليطلب ... له
  alternative: من كان منكم ... فليطلب ... له
  rationale: يحافظ المفرد على بنية الأصل ودلالته التمثيلية العامة، بينما لا تفرض العربية هنا ضميرًا مذكرًا ظاهرًا في الجملة الختامية.
- issue: دلالة عطاء الله في ἁπλῶς
  choice: بسخاء
  alternative: ببساطة / بسماحة
  rationale: «بسخاء» تنقل على الأرجح معنى العطاء بحرية ومن غير إمساك، من دون إدخال وعد بالثراء أو توسيع الوعد إلى غير الحكمة المطلوبة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «يعيّر» بدل العبارة الاسمية الأثقل «من غير تعيير»، وحُفظ الإيقاع الشرطي والأمر والوعد في جملة مترابطة.
