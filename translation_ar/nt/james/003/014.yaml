revisions:
- from: ولكن إن كان في قلوبكم حسدٌ مُرّ وطموحٌ أناني، فلا تفتخروا ولا تكذبوا على الحق.[a][b]
  to: ولكن إن كان في قلوبكم حسدٌ مرير وطموحٌ أناني، فلا تفتخروا ولا تكذبوا مناقضين الحق.[a][b][c]
  rationale: عُدِّلت العبارة الأخيرة لتبيّن أن الكذب يقع في معارضة الحق لا لمجرد الحديث عنه، مع الحفاظ على اتساع «الحق» وعدم تفسيره تفسيرًا عقائديًا محددًا. وحُسّنت صفة الحسد إلى «مرير» لسلامة الاستعمال العربي، وأضيفت الحاشية المعجمية ذات الصلة بالفعل الأخير.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:09:13Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام محفوظ: الشرط المقابل، والحسد/الغيرة السلبية، والطموح الأناني، والقلب الجمعي، والنهي عن الافتخار حاضرة كلها. لكن «تكذبوا على الحق» قد تُفهم عربيًا على أنها اختلاق كذب بشأن الحق، ولا تُظهر بوضوح دلالة المعارضة في κατὰ τῆς ἀληθείας. «تكذبوا مناقضين الحق» أوضح وأقرب إلى «تكذبوا ضدّ الحق/خلافًا للحق».'
  naturalness: النص فصيح ومفهوم إجمالًا. ويُستحسن «حسدٌ مرير» في العربية الحديثة بدل «حسدٌ مُرّ»، كما أن «تكذبوا مناقضين الحق» أكثر سلاسة ودقة من «تكذبوا على الحق».
  terminology: «طموح أناني» ينقل ἐριθεία نقلًا مقبولًا في ضوء مسار التدقيق الإنجليزي، مع إبقاء البدائل الاجتماعية في الحاشية. يُحافَظ على «الحق» عامًا. أُضيفت حاشية للبديل المتصل بالفعل الأخير، الموافق لمسار التدقيق الإنجليزي، وربطت بموضعها.
  issues:
