  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: ar
  text: ولكن إن كان في قلوبكم حسدٌ مرير وطموحٌ أناني، فلا تفتخروا ولا تكذبوا مناقضين الحق.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غيرة مريرة» أو «حماسة مريرة» بدلًا من «حسد مرير».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تنافس» أو «تحزّب» بدلًا من «طموح أناني».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «ولا تكذبوا خلافًا للحق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ولكن إن كان
  rationale: تنقل «δέ» المقابلة مع الكلام السابق، وتقدّم الشرط بصياغة عربية طبيعية.
- source_word: ζῆλον πικρὸν
  choice: حسدٌ مُرّ
  rationale: «ζῆλος» قد تعني الغيرة أو الحماسة أو الحسد، لكن اقترانها هنا بالمرارة والطموح الأناني يرجّح المعنى السلبي؛ و«حسد مُرّ» واضح وطبيعي.
- source_word: ἐριθείαν
  choice: طموحٌ أناني
  rationale: تعبّر عن السعي إلى التقدّم الذاتي بما قد ينطوي عليه من تنافس وتحزّب، من غير حصر اللفظ في أثر اجتماعي واحد.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: في قلوبكم
  rationale: اليونانية تستعمل المفرد «القلب» مع ضمير جمع استعمالًا توزيعيًا؛ والجمع في العربية أوضح عند خطاب جماعة.
- source_word: μὴ κατακαυχᾶσθε
  choice: فلا تفتخروا
  rationale: يحفظ المعنى الأساسي للفعل، أي التباهي أو الافتخار المتعالي، بصياغة عربية موجزة.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: ولا تكذبوا على الحق
  rationale: يحفظ فعل الكذب ودلالة «κατά» على الوقوف ضد الحق؛ و«الكذب على الحق» تعبير عربي مفهوم دون تضييق المقصود بالحق.
theological_decisions:
- issue: طبيعة «الحق»
  choice: 'إبقاء اللفظ عامًا: «الحق»'
  alternative: «حق الإنجيل» أو «طريق الحكمة الحق» أو مجرد الصدق في الكلام
  rationale: النص لا يقيّد «ἀλήθεια» بصيغة عقائدية محددة ولا يحصره في الصدق اللفظي؛ لذا تُحفظ سعته ولا يُحسم توتره الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل الجمع «قلوبكم» لمخاطبة الجماعة بوضوح، مع إبقاء «الحق» واسع الدلالة. وُضعت علامتا الحاشيتين مباشرة بعد العبارتين اللتين تشرحان بدائلهما.
