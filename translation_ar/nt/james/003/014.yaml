    issue: صياغة «ولا تكذبوا على الحق» ملتبسة دلاليًا.
    rationale: حرف الجر «على» في العربية قد يدل على أن الكذب واقع بشأن الحق، لا على معارضة الحق التي يفيدها κατά مع المضاف إليه في اليونانية. الصياغة المنقحة تبقي فعل الكذب وتُظهر المخالفة.
  - severity: low
    issue: غياب حاشية البديل لعبارة ψεύδεσθε κατὰ τῆς ἀληθείας.
