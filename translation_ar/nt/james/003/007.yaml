base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: ar
  text: فكلُّ نوعٍ من الحيوانات البرية والطيور والزواحف والكائنات البحرية يُروَّض وقد رُوِّض على يد البشر[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا فهم العبارة اليونانية بمعنى «بالطبيعة البشرية». أمّا المتن فيفهمها بمعنى جمعي، أي على يد البشر عامةً أو الجنس البشري.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: كلُّ نوعٍ
  rationale: تدل φύσις في هذا التعداد الحيواني على النوع أو الصنف، لا على «الطبيعة» بمعناها المجرّد؛ وتحفظ «كل نوع» القوة التوزيعية لـ πᾶσα بصياغة عربية طبيعية.
- source_word: γὰρ
  choice: فـ
  rationale: تربط الفاء الآية بما قبلها بوصفها تعليلًا أو تفسيرًا، من غير أن تجعل الآية العربية جملة مبتورة كما قد يحدث مع البدء بـ«لأن».
- source_word: θηρίων
  choice: الحيوانات البرية
  rationale: يناسب التعبير معنى الحيوانات أو الوحوش، وهو أوضح للقارئ الحديث من «الوحوش» التي قد توحي بالضراوة وحدها.
- source_word: πετεινῶν
  choice: الطيور
  rationale: هو المقابل العربي الطبيعي الموجز للمخلوقات الطائرة المقصودة في هذا التعداد.
- source_word: ἑρπετῶν
  choice: الزواحف
  rationale: ينقل المصطلح بصيغة فئوية حديثة مفهومة، مع أن اللفظ اليوناني قد يشمل على نحو أوسع ما يدب أو يزحف.
- source_word: ἐναλίων
  choice: الكائنات البحرية
  rationale: ينقل الصفة المستعملة اسميًا للدلالة على ما يعيش في البحر، ويحافظ على شمول العبارة.
- source_word: δαμάζεται
  choice: يُروَّض
  rationale: يحفظ المبني للمجهول ودلالة الحاضر على العملية الجارية أو المتكررة بوجه عام.
- source_word: δεδάμασται
  choice: قد رُوِّض
  rationale: تحفظ «قد» مع الماضي دلالة التمام والنتيجة القائمة في صيغة الكامل اليونانية، مع إبقاء الفعل مبنيًا للمجهول مثل الأصل.
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: على يد البشر
  rationale: يفهم السياق العبارة على الأرجح فهمًا جمعيًا، أي إن البشر هم القائمون بالترويض. وهذه الصياغة طبيعية في العربية وتحفظ معنى الفاعل، مع توثيق احتمال «الطبيعة البشرية» في الحاشية.
theological_decisions:
- issue: هل تشير τῇ φύσει τῇ ἀνθρωπίνῃ إلى البشر جماعةً أم إلى الطبيعة البشرية بمعناها المجرّد؟
  choice: على يد البشر
  alternative: بالطبيعة البشرية؛ أو على يد الجنس البشري
  rationale: المقابلة بين أنواع الحيوان والجانب البشري ترجّح المعنى الجمعي، لكن التركيب اليوناني يسمح بالقراءة الأكثر تجريدًا؛ لذلك لم تُحذف هذه الإمكانية بل ذُكرت في الحاشية.
translation_notes:
  register: 'صياغة عربية فصحى معاصرة واضحة ومحترمة. استُخدمت «الحيوانات البرية» بدل «الوحوش» لزيادة الوضوح، وحُفظ التوازي بين الفعلين المبنيين للمجهول: «يُروَّض وقد رُوِّض».'
