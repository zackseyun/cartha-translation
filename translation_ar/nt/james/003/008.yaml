id: JAS.3.8
reference: James 3:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: ar
  text: وأمّا اللسان فلا أحد من البشر يستطيع أن يروِّضه[a]؛ إنّه شرٌّ لا يهدأ[b]، مملوءٌ سمًّا مميتًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أكثر سلاسة: «لا يستطيع أي إنسان أن يروّض اللسان».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «شرّ غير مستقر»، أو «شرّ جامح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: اللسان
  rationale: أُبقي اسم عضو الجسد لأن يعقوب يستخدمه صورةً للكلام البشري، ولأنه يحافظ على ترابط الصورة في السياق القريب.
- source_word: οὐδεὶς ... ἀνθρώπων
  choice: لا أحد من البشر
  rationale: 'يعكس التركيبَ التجزيئي: «لا أحد من البشر»، بلغة عربية طبيعية شاملة لجميع الناس من غير تكرار ثقيل.'
- source_word: δαμάσαι
  choice: يروِّضه
  rationale: يحافظ «يروِّض» على الصلة اللفظية والسياقية بترويض الحيوانات في الآية السابقة، وهو أوضح من «يضبطه» وأكثر تصويرًا.
- source_word: ἀκατάστατον
  choice: لا يهدأ
  rationale: ينقل في هذا السياق معنى القلق وعدم الاستقرار أو الانضباط بصياغة عربية طبيعية، مع إبقاء البدائل الممكنة في الحاشية.
- source_word: κακόν
  choice: شرّ
  rationale: يحفظ القوة الأخلاقية والتدميرية للكلمة، بدل اختزالها في مجرد الضرر.
- source_word: μεστὴ
  choice: مملوء
  rationale: صياغة مباشرة تحافظ على الصورة القوية في النص؛ وجاء التذكير تبعًا لجنس «اللسان» في العربية.
- source_word: ἰοῦ θανατηφόρου
  choice: سمًّا مميتًا
  rationale: السياق يقتضي السم لا الصدأ، و«مميت» ينقل بوضوح معنى ما يجلب الموت.
theological_decisions:
- issue: دلالة οὐδεὶς مع ἀνθρώπων
  choice: لا أحد من البشر
  alternative: لا يستطيع أي إنسان أن يروّض اللسان
  rationale: يحافظ المختار على العلاقة التجزيئية في اليونانية، من غير أن يوحي بأن العجز مقصور على الرجال؛ والبديل أكثر سلاسة لكنه أقل محاكاة لبنية الأصل.
- issue: وصف اللسان بأنه ἀκατάστατον κακόν
  choice: شرّ لا يهدأ
  alternative: شرّ غير مستقر؛ شرّ جامح
  rationale: لا يحسم الأصل بين ظلال عدم الاستقرار والقلق والانفلات؛ لذلك اختير تعبير مفهوم يحفظ الصورة، وأُثبتت البدائل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «يروِّض» للمحافظة على صورة ترويض الحيوان في السياق، وتُرك التوتر بين عدم الاستقرار والجموح ظاهرًا في الحاشية بدل حسمه تفسيرًا.
