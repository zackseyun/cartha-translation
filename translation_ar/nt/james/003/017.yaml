source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: ar
  text: 'أما الحكمة التي من فوق فهي أولًا طاهرة، ثم مسالمة، مترفقة، مستعدة للإصغاء، ممتلئة بالرحمة والثمار الصالحة، غير متحيزة[a]، وبلا رياء.


    [a] أو «غير منقسمة» أو «بلا تردد أو شك». تحتمل الصفة اليونانية ἀδιάκριτος هذه المعاني أيضًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «غير منقسمة» أو «بلا تردد أو شك». تحتمل الصفة اليونانية ἀδιάκριτος هذه المعاني أيضًا.
    reason: بدائل معجمية تحفظ تعدد دلالات اللفظ اليوناني الصعب.
lexical_decisions:
- source_word: ἄνωθεν
  choice: التي من فوق
  rationale: يحافظ على التعبير المكاني المجازي في اليونانية وعلى مقابلته للحكمة الأرضية في السياق، من غير تخصيصه بلفظ «السماء».
- source_word: σοφία
  choice: الحكمة
  rationale: المقابل العربي المباشر والطبيعي، ويدل هنا على نوع الحكمة الموصوفة.
- source_word: πρῶτον μὲν
  choice: أولًا
  rationale: ينقل ترتيب الصفات بوضوح وإيجاز.
- source_word: ἁγνή
  choice: طاهرة
  rationale: يعبر عن النقاوة الأخلاقية والنزاهة غير المشوبة، وهو طبيعي في العربية الفصحى المعاصرة.
- source_word: ἔπειτα
  choice: ثم
  rationale: يحفظ الانتقال من الصفة الأولى إلى الصفات التالية.
- source_word: εἰρηνική
  choice: مسالمة
  rationale: يدل على الميل إلى السلام وصنعه، لا على مجرد حالة من الهدوء.
- source_word: ἐπιεικής
  choice: مترفقة
  rationale: ينقل معنى اللين والرفق والتسامح، مع تجنب حصر اللفظ في الوداعة وحدها.
- source_word: εὐπειθής
  choice: مستعدة للإصغاء
  rationale: يفيد القابلية للاستماع والاستجابة وعدم العناد، من غير إيحاء بالسذاجة أو الانقياد الأعمى.
- source_word: μεστὴ ἐλέους
  choice: مملوءة رحمة
  rationale: يحافظ على صورة الامتلاء وعلى وفرة الرحمة المقصودة.
- source_word: καρπῶν ἀγαθῶν
  choice: ثمارًا صالحة
  rationale: يحفظ صيغة الجمع واستعارة الثمار بوصفها نتائج ظاهرة، بدل تفسيرها مباشرة بأنها أعمال.
- source_word: ἀδιάκριτος
  choice: غير متحيزة
  rationale: يناسب السياق الأخلاقي واهتمام الرسالة بالمحاباة، مع إثبات الاحتمالات المعجمية الأخرى في الحاشية.
- source_word: ἀνυπόκριτος
  choice: بلا رياء
  rationale: ينقل صراحة غياب النفاق والتظاهر، وهو تعبير عربي واضح ومألوف.
theological_decisions:
- issue: دلالة ἀδιάκριτος
  choice: غير متحيزة
  alternative: غير منقسمة؛ بلا تردد أو شك
  rationale: يمكن أن يدل اللفظ على عدم التحيز، كما يمكن أن يفيد عدم الانقسام أو التردد. يلائم «غير متحيزة» سياق الرحمة والثمار الصالحة ورفض المحاباة في الرسالة، لكن الحاشية تحفظ الاحتمالات الأخرى ولا تحسم التوتر الدلالي بصمت.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ إيقاع قائمة الصفات واستعارة «الثمار»، ووُضع رابط العطف قبل الصفة الأخيرة لتكون العبارة طبيعية. نُقلت علامة الحاشية إلى «غير متحيزة» لأنها تخص ἀδιάκριτος لا ἁγνή.
