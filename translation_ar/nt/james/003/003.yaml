    text: أو «الأعِنّة»؛ لكن المقصود المباشر هنا، على نحو أدق، هو القطعة التي توضع في فم الحصان.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: إن كنا
  rationale: تفيد العبارة شرطًا تمثيليًا مع انتقال خفيف في سياق الكلام. تؤدي «إن كنا» معنى الشرط طبيعيًا، ولا تستلزم إضافة «والآن» غير الموجودة صراحة في المصدر.
- source_word: χαλινοὺς
  choice: اللُّجُم
  rationale: مع أن اللفظة قد تدل على أداة اللجام عمومًا، فإن ذكر وضعها في الأفواه يشير هنا تحديدًا إلى القطع التي تُجعل في أفواه الخيل؛ و«اللُّجُم» هي العبارة العربية الطبيعية في هذا السياق.
- source_word: εἰς τὰ στόματα
  choice: في أفواه الخيل
  rationale: تفيد εἰς مع βάλλομεν الإدخال إلى داخل الأفواه. وفي العربية، «نضع في أفواه» تعبير طبيعي يؤدي اتجاه الحركة دون تكلف.
- source_word: βάλλομεν
  choice: نضع
  rationale: الفعل هنا بمعنى الوضع أو الإدخال، لا الرمي؛ لذلك «نضع» أدق وأفصح في السياق.
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: لكي تطيعنا
  rationale: المصدر المسبوق بـεἰς يفيد الغرض أو النتيجة، وπείθεσθαι مع ضمير المفعول غير المباشر يعني الطاعة هنا. تحفظ «لكي تطيعنا» معنى الغرض من غير مبالغة في السببية.
- source_word: μετάγομεν
  choice: نوجِّه
  rationale: يدل الفعل على تحويل المسار أو توجيه الحركة. تلائم «نوجِّه» صورة قيادة الخيل وحجة الكاتب عن التحكم في الكبير بواسطة الصغير.
- source_word: ὅλον τὸ σῶμα αὐτῶν
  choice: أجسامها كلها
  rationale: جاء «الجسم» في اليونانية مفردًا على وجه توزيعي مع ضمير الجمع، أما العربية الطبيعية فتستعمل جمع «أجسام» مع ضمير الخيل الجمع غير العاقل، أي «أجسامها كلها».
