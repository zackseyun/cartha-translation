  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: ar
  text: إن كنا نضع اللُّجُم في أفواه الخيل لكي تطيعنا[a]، فإننا نوجِّه أجسامها كلها أيضًا.
  philosophy: optimal-equivalence
  footnotes:
