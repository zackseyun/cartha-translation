  text: ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ⸂ἀνέμων σκληρῶν⸃ ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ⸂ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: ar
  text: 'انظروا أيضًا إلى السفن: مع أنها ضخمة، وتسوقها رياح شديدة[a]، فإن دفة صغيرة جدًا توجهها إلى حيث يريد من يقودها.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى حيث يريد الربّان أن يذهب». واليونانية حرفيًا أقرب إلى: «إلى حيث تشاء نزعةُ من يوجهها».'
    reason: بيان بديل طبيعي مع حفظ الصياغة اليونانية الأكثر حرفية لعبارة ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται.
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: انظروا أيضًا إلى السفن
  rationale: صيغة طبيعية لجذب الانتباه وتقديم مثال ثانٍ موازٍ لما سبقه، من غير استعمال تعبير عتيق.
- source_word: τηλικαῦτα ὄντα
  choice: مع أنها ضخمة
  rationale: تنقل ضخامة السفن والعلاقة الاستدراكية بينها وبين صغر الدفة.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: تسوقها رياح شديدة
  rationale: «شديدة» تلائم وصف الرياح، و«تسوقها» تحفظ معنى القوة الخارجية التي تدفع السفن.
- source_word: μετάγεται ὑπὸ ἐλαχίστου πηδαλίου
  choice: فإن دفة صغيرة جدًا توجهها
  rationale: يحفظ التباين بين كبر السفن وصغر الدفة، ويؤدي المعنى الملاحي بوضوح في العربية.
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: إلى حيث يريد من يقودها
  rationale: صياغة عربية واضحة تنقل الوجهة التي تحددها إرادة القائم بالتوجيه، مع بيان الحرفية الأشد في الحاشية.
theological_decisions:
- issue: درجة الحرفية في وصف إرادة القائم بالتوجيه
  choice: إلى حيث يريد من يقودها
  alternative: إلى حيث يشاء اندفاعُ من يوجهها
  rationale: الترجمة المختارة طبيعية وواضحة، ولا تحول ὁρμή إلى مصطلح نفسي أو لاهوتي أدق مما يقتضيه سياق الملاحة؛ والحاشية تحفظ غرابة البنية اليونانية واحتمالها المعجمي.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «دفة» للمصطلح الملاحي، و«من يقودها» بدل لقب تقني في المتن لأن الأصل يستعمل اسم فاعل وصفيًا.
