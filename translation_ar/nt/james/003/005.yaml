  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: ar
  text: هكذا اللسان أيضًا عضو صغير، لكنه يتباهى بأمور عظيمة. انظروا ما أعظم نارًا[a] تشعل غابة عظيمة[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحسب فهم العبارة في سياق التشبيه: «ما أصغر نارًا تشعل غابة عظيمة!» يمكن أن تُفهم العبارة اليونانية على نحو تعجبي: «ما أعظم نارًا»، أو على أنها تُبرز صِغَر السبب وضخامة أثره، وهو ما يلائم تشبيه اللسان بالعضو الصغير.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «خشبًا كثيرًا»، أو «حطبًا كثيرًا»، أو «أحراشًا واسعة». يمكن للكلمة اليونانية أن تشير إلى مادة قابلة للاحتراق أو إلى أرض كثيرة الأشجار؛ و«غابة» أوضح في هذه الصورة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: اللسان
  rationale: يحافظ على صورة عضو الجسد الملموسة التي يقوم عليها التشبيه، بدلًا من تفسيرها مباشرةً بمعنى الكلام.
- source_word: μικρὸν μέλος
  choice: عضو صغير
  rationale: صياغة موجزة وطبيعية تحافظ على الصورة الجسدية وعلى صلتها بالسياق السابق.
- source_word: μεγάλα αὐχεῖ
  choice: يتباهى بأمور عظيمة
  rationale: ينقل معنى الافتخار أو التباهي بما هو عظيم، مع إبقاء متعلَّق التباهي عامًا كما في اليونانية.
- source_word: Ἰδοὺ
  choice: انظروا
  rationale: أداة تنبيه عربية حديثة واضحة تسترعي انتباه القراء إلى المثال التالي، من غير استعمال صياغة عتيقة.
- source_word: ἡλίκον πῦρ
  choice: نار صغيرة
  rationale: يفهم الوصف في ضوء المقابلة المباشرة بين صغر السبب وضخامة أثره، موازيًا لكون اللسان عضوًا صغيرًا؛ وتُذكر القراءة التعجبية البديلة في الحاشية.
- source_word: ἡλίκην ὕλην
  choice: غابة عظيمة
  rationale: يمكن أن تدل ὕλη على الغابة أو الخشب أو مادة الوقود؛ و«غابة» تنقل بوضوح صورة مساحة كبيرة تلتهمها النار، مع إثبات البدائل المعجمية في الحاشية.
- source_word: ἀνάπτει
  choice: تُضرم
  rationale: فعل عربي فصيح جارٍ في الاستعمال يعبّر بوضوح عن إشعال النار وانتشارها في الغابة.
