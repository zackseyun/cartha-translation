  register: عربية فصحى حديثة واضحة ذات نبرة كريمة ومباشرة. حُفظت استعارة اللسان بوصفه عضوًا من الجسد، واستُعملت صياغة حيوية في صورة النار والغابة، مع إبقاء الاحتمال الدلالي في الشطر الأخير ظاهرًا في الحاشية.
