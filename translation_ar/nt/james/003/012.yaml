base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: ar
  text: يا إخوتي[a]، هل يمكن لشجرة تينٍ أن تُنتج زيتونًا، أو لكرمة أن تُنتج تينًا؟ ولا يمكن لماء مالح أن يُنتج ماءً عذبًا[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يا إخوتي وأخواتي». تستعمل اليونانية لفظ «إخوة» بصيغة جمع مذكر، ويمكن أن يُخاطَب به رجال ونساء معًا.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «ماءً حلوًا»؛ والمقصود في هذا السياق «ماءً عذبًا» في مقابل الماء المالح.'
    reason: lexical_alternative
  - marker: c
    text: 'العبارة الأخيرة موجزة في اليونانية، ويمكن أيضًا فهمها على ضوء صورة النبع في الآية السابقة: «ولا يمكن لنبع مالح أن يُنتج ماءً عذبًا».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: يا إخوتي
  rationale: ينقل صيغة النداء والجمع المذكر في اليونانية بلغة عربية طبيعية؛ وقد يُراد به جماعة تضم الرجال والنساء، كما توضّح الحاشية.
- source_word: μὴ δύναται
  choice: هل يمكن
  rationale: تبدأ اليونانية بسؤال بلاغي يتوقع جوابًا بالنفي؛ وصيغة «هل يمكن...؟» تؤدي ذلك بوضوح من غير تحويل السؤال إلى تقرير صريح.
- source_word: συκῆ
  choice: شجرة تين
  rationale: الاسم يدل على الشجرة لا على الثمرة، وهذا التعبير واضح وطبيعي في العربية المعاصرة.
- source_word: ἐλαίας ποιῆσαι
  choice: أن تُنتج زيتونًا
  rationale: الفعل هنا يفيد إثمار الشجرة أو إنتاجها الثمر؛ و«تُنتج» تعبير عربي واضح يحافظ على الصورة الزراعية.
- source_word: ἄμπελος
  choice: كرمة
  rationale: «كرمة» هي المقابل العربي المألوف لشجرة العنب، وتلائم الموازاة مع شجرة التين.
- source_word: σῦκα
  choice: تينًا
  rationale: نقل مباشر لاسم الثمر في صيغة الجمع اليونانية، ويجوز في العربية استعمال اسم الجنس «تينًا» للدلالة على الثمار.
- source_word: οὔτε ἁλυκὸν
  choice: ولا يمكن لماء مالح
  rationale: التركيب اليوناني موجز، وفيه الصفة «مالح» مستعملة استعمال الاسم مع محذوف يُفهم من السياق. أُضيف «ماء» في المتن لسلامة العربية، مع بيان احتمال «نبع مالح» في الحاشية.
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: أن يُنتج ماءً عذبًا
  rationale: المعنى الحرفي للصفة هو «حلو»، لكنها في وصف الماء تقابل الملوحة وتفيد الماء العذب؛ لذا فـ«عذب» هو التعبير العربي الطبيعي الدقيق.
