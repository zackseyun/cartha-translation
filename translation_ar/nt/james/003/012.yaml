  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ السؤال البلاغي بدل التصريح بجوابه، واستُعملت ألفاظ زراعية ومائية مألوفة. وُضعت علامات الحواشي عند المواضع التي تفسرها مباشرة، ولا سيما الحاشية [c] عند الجملة الأخيرة.
