base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: ar
  text: بِهَا نُبَارِكُ الرَّبَّ وَالْآبَ[a]، وَبِهَا نَلْعَنُ النَّاسَ[b] الَّذِينَ خُلِقُوا عَلَى شَبَهِ اللهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الرب والآب»؛ ويمكن فهم العبارة بمعنى «الرب، أي الآب»، أو بوصفها لقبين مقترنين لله.'
    reason: alternative_reading
  - marker: b
    text: أي البشر عمومًا؛ فاللفظ اليوناني لا يقتصر هنا على الذكور.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: بها
  rationale: يعود الضمير على اللسان في السياق السابق، والباء هي الصياغة العربية الطبيعية للدلالة على الأداة.
- source_word: εὐλογοῦμεν
  choice: نبارك
  rationale: يحفظ المقابلة اللفظية والأخلاقية مع «نلعن»، كما يحافظ على لغة البركة الكتابية الموجَّهة إلى الله.
- source_word: τὸν κύριον καὶ πατέρα
  choice: الرب والآب
  rationale: ينقل العطف اليوناني مباشرة من غير حسم ما إذا كان اللقبان على سبيل البيان أم التسمية المزدوجة.
- source_word: καταρώμεθα
  choice: نلعن
  rationale: مقابل عربي مباشر وطبيعي يحفظ حدة التضاد مع «نبارك».
- source_word: τοὺς ἀνθρώπους
  choice: الناس
  rationale: يدل على البشر عامة، ولا يقصر المرجع على الذكور.
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: على شبه الله
  rationale: تعبير عربي واضح يحفظ معنى المطابقة أو المشابهة ويستدعي لغة الخلق.
- source_word: γεγονότας
  choice: خُلِقوا
  rationale: يفيد سياق شبه الله الإشارة إلى خلق البشر، والصيغة المبنية للمجهول تحفظ الفاعل الإلهي الضمني، مع كون اللفظ اليوناني أعم حرفيًا من فعل الخلق.
theological_decisions:
- issue: دلالة ἀνθρώπους العامة
  choice: الناس
  alternative: البشر / أناس
  rationale: المراد الإنسانية عمومًا بوصفها مخلوقة على شبه الله، ولذلك لا تُستعمل صياغة قد توهم تخصيص الذكور.
- issue: العلاقة بين «الرب» و«الآب»
  choice: الرب والآب
  alternative: الرب، أي الآب / الرب الذي هو الآب
  rationale: يحفظ العطف الوارد في اليونانية ولا يفرض تفسيرًا بيانيًا واحدًا، إذ يمكن فهم اللقبين على سبيل البيان أو بوصفهما تسمية مزدوجة لله.
- issue: إيحاء γεγονότας بالخلق
  choice: خُلِقوا
  alternative: صاروا / وُجدوا
  rationale: سياق «شبه الله» يرجح صدى رواية الخلق، لكن الحاشية تنبه إلى أن الفعل اليوناني في ذاته أعم من «خُلِقوا».
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «بها» لعودة الضمير إلى اللسان، وحُفظ التضاد الصريح بين «نبارك» و«نلعن». وُضعت علامتا الحاشية بعد العبارتين اللتين تفسرانهما.
