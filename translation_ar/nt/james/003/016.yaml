source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: ar
  text: فحيث توجد الغيرة[a] والطموح الأناني، يوجد الاضطراب وكل عمل رديء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الحسد». ويمكن للكلمة اليونانية أيضًا أن تعني «الحماسة»، لكن السياق هنا سلبي بوضوح.
    reason: lexical_alternative
  - marker: b
    text: 'أو «كل فعل شرير». وحرفيًا: «كل أمر رديء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: حيث
  rationale: تُدخل حالة مكانية عامة، وتحافظ مع «يوجد» على بنية «حيث... يوجد...» من غير إضافة معنى زائد.
- source_word: γὰρ
  choice: فـ
  rationale: تنقل الصلة التفسيرية بما سبق بإيجاز وطبيعية في العربية.
- source_word: ζῆλος
  choice: الغيرة
  rationale: السياق في الآيات 14-15 يفرض المعنى السلبي. و«الغيرة» لفظ عربي طبيعي يمكن أن يدل هنا على الغيرة المذمومة، مع بيان «الحسد» كبديل في الحاشية.
- source_word: ἐριθεία
  choice: الطموح الأناني
  rationale: يعبّر بوضوح عن السعي إلى التقدم الشخصي بدافع أناني وما يصاحبه من تنافس وتحزّب.
- source_word: ἐκεῖ
  choice: يوجد
  rationale: دُمج معنى «هناك» في جواب «حيث» على نحو عربي طبيعي؛ فقول «حيث... يوجد» يؤدي الارتباط المكاني نفسه من غير تكلّف.
- source_word: ἀκαταστασία
  choice: الاضطراب
  rationale: يدل على اختلال النظام والبلبلة في الجماعة، لا على مجرد الحيرة الذهنية.
- source_word: πᾶν
  choice: كل
  rationale: المقابل العربي المباشر والطبيعي مع الاسم المفرد.
- source_word: φαῦλον
  choice: رديء
  rationale: يحفظ معنى الدناءة أو السوء الأخلاقي من غير تضخيم، مع إمكان «شرير» بحسب فهم العبارة.
- source_word: πρᾶγμα
  choice: عمل
  rationale: مع أن اللفظ أوسع وقد يعني «أمرًا» أو «شيئًا»، فإن «عمل» ينقل في سياق الرذائل معنى السلوك الرديء بوضوح.
theological_decisions:
- issue: القوة الأخلاقية للفظ ζῆλος في السياق
  choice: فُهم بوصفه رذيلة سلبية وتُرجم «الغيرة»
  alternative: «الحسد»، أو «الحماسة» بمعنى محايد أو إيجابي
  rationale: السياق المباشر يصف غيرة مُرّة وطموحًا أنانيًا بوصفهما من سمات الحكمة الأرضية غير الروحية؛ لذلك لا يستقيم هنا المعنى الإيجابي، مع بقاء «الحسد» بديلًا معجميًا مشروعًا.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة وذات نبرة حكمية. استُخدمت «حيث» بدل «حيثما» لتجنب إضافة قوة توزيعية غير لازمة، وحُفظ التوازي العام في العبارة من غير تركيب عربي متكلّف.
