  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: ar
  text: مَنْ منكم حكيمٌ وعارفٌ؟ فليُرِ أعماله بسيرته الحسنة، بوداعة الحكمة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالوداعة التي تنشأ عن الحكمة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: مَنْ هو حكيم وعارف بينكم؟
  rationale: «مَنْ» تنقل السؤال البلاغي، و«حكيم وعارف» تحافظ على التمييز بين σοφός، أي الحكيم عمليًا وأخلاقيًا، وἐπιστήμων، أي صاحب المعرفة والفهم، بصياغة عربية طبيعية.
- source_word: δειξάτω
  choice: فليُرِ
  rationale: تنقل صيغة الأمر للغائب المفرد، مع بقاء المفرد المذكر ذا دلالة تمثيلية على أي شخص في الجماعة.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: بسيرته الحسنة
  rationale: «السيرة» تعبّر عن السلوك ونهج الحياة، والباء تنقل دلالة المصدر أو الوسيلة في ἐκ هنا دون إقحام معنى زائد.
- source_word: τὰ ἔργα αὐτοῦ
  choice: أعماله
  rationale: «أعماله» المقابل المباشر الطبيعي، وتحافظ على الصلة المعجمية بموضوع الأعمال في رسالة يعقوب.
- source_word: ἐν πραΰτητι σοφίας
  choice: في وداعة الحكمة
  rationale: 'تحافظ الصياغة على تركيب الإضافة اليوناني وغموضه الدلالي: وداعة تتصف بها الحكمة أو تصدر عنها، بدل حصره في تفسير واحد.'
theological_decisions:
- issue: صيغة الأمر المذكرة المفردة وقوتها التمثيلية
  choice: فليُرِ أعماله
  alternative: فليُظهر مثل هذا الشخص أعماله
  rationale: يحافظ النص على صيغة المفرد المذكر في اليونانية من غير أن يقصر الخطاب لاهوتيًا على الرجال؛ والسياق يجعلها صيغة تمثيلية لأي شخص تنطبق عليه الصفتان.
- issue: العلاقة بين الوداعة والحكمة في πραΰτητι σοφίας
  choice: في وداعة الحكمة
  alternative: بالوداعة الناشئة عن الحكمة
  rationale: الإضافة اليونانية تحتمل وصف الوداعة بأنها وداعة تتسم بالحكمة أو اعتبار الحكمة مصدرًا لها؛ لذا أبقينا التركيب موجزًا غير حاسم، وذكرنا البديل التفسيري في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «السيرة الحسنة» لتشمل السلوك المعتاد ونهج الحياة، و«وداعة» بوصفها لفظًا أخلاقيًا مفهومًا لا يعني الضعف. وُضع مؤشر الحاشية عقب العبارة التي يشرحها.
