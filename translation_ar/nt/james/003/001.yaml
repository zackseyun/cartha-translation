base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: ar
  text: لا يَصِرْ كثيرون منكم معلّمين، يا إخوتي[a]، إذ تعلمون أننا سننال دينونةً أعظم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لفظ «إخوتي» هنا يُرجَّح أنه يخاطب الجماعة كلها، بمن فيها الأخوات.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ ... γίνεσθε
  choice: لا يَصِرْ كثيرون منكم
  rationale: ينقل صيغة النهي مع فعل «يصير»، ويحافظ على التحذير من الدخول في دور المعلّم. أُضيف «منكم» لإظهار أن فعل المخاطب الجمع موجَّه إلى السامعين.
- source_word: διδάσκαλοι
  choice: معلّمين
  rationale: مقابل عربي مباشر وطبيعي لا يفترض أن المقصود منصب كنسي رسمي يتجاوز دلالة النص.
- source_word: ἀδελφοί μου
  choice: يا إخوتي
  rationale: يحافظ على صورة القرابة في اليونانية وصيغة الخطاب المذكرة، مع بيان احتمال شمول الجماعة كلها في الحاشية.
- source_word: εἰδότες
  choice: عالمين
  rationale: يحافظ على الصيغة الحالية الظرفية في الأصل، من غير حسمها سببيًا إلى «لأنكم تعلمون».
- source_word: μεῖζον κρίμα
  choice: دينونةً أعظم
  rationale: «أعظم» تقابل صيغة المقارنة على نحو مباشر، و«دينونة» تُبقي معنى الحكم والمساءلة من غير التصريح بأن المقصود حتمًا هلاك نهائي.
- source_word: λημψόμεθα
  choice: سننال
  rationale: ينقل المستقبل وصيغة المتكلم الجمع بإيجاز، ويحفظ إدراج الكاتب نفسه ضمن من ينطبق عليهم التحذير.
theological_decisions:
- issue: نطاق ἀδελφοί μου في جماعة قد تضم الرجال والنساء
  choice: «يا إخوتي» في المتن مع حاشية توضّح المعنى الشامل المحتمل
  alternative: «يا إخوتي وأخواتي»
  rationale: يحافظ المتن على الصيغة المذكرة في الأصل، بينما تمنع الحاشية فهمها على أنها تستبعد النساء بالضرورة.
- issue: قوة κρίμα في التحذير الموجَّه إلى المعلّمين
  choice: «دينونة»
  alternative: «إدانة» أو «حكم»
  rationale: «دينونة» تلائم سياق المساءلة الإلهية، لكنها لا تحسم وحدها أن الحديث عن إدانة نهائية؛ وبذلك تبقى حدة التحذير والتوتر اللاهوتي قائمين.
- issue: دلالة μεῖζον مع κρίμα
  choice: «دينونة أعظم»
  alternative: «دينونة أشد»
  rationale: «أعظم» أقرب إلى المقارنة الصريحة في μεῖζον، ولا تحدد وجه الزيادة تحديدًا زائدًا؛ وقد يُفهم منها ازدياد الشدة أو المسؤولية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «لا يَصِرْ» بدل تراكيب أثقل، وحُفظ التركيب «عالمين» لإبقاء الصلة الدلالية مفتوحة كما في اليونانية.
