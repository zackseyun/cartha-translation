base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: ar
  text: مِنَ الفم نفسه تخرج البركة واللعنة. يا إخوتي[a]، لا ينبغي أن تكون هذه الأمور هكذا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يا إخوتي وأخواتي»؛ يقول النص اليوناني «إخوتي»، لكن يعقوب يقصد على الأرجح جماعة المؤمنين كلها في هذا السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: مِنَ الفم نفسه
  rationale: يحافظ على صورة الفم بوصفه مصدر الكلام، ويعبّر عن αὐτοῦ طبيعيًا بلفظ «نفسه».
- source_word: ἐξέρχεται
  choice: تخرج
  rationale: فعل مباشر وطبيعي يصون صورة خروج الكلام من الفم؛ وجاء مؤنثًا مفردًا موافقةً لأقرب الفاعلين في التركيب العربي.
- source_word: εὐλογία καὶ κατάρα
  choice: البركة واللعنة
  rationale: ترجمة مباشرة تحفظ التقابل بين قول البركة وقول اللعنة من غير إضافة تفسيرية.
- source_word: οὐ χρή
  choice: لا ينبغي
  rationale: ينقل معنى عدم اللياقة أو الوجوب الأخلاقي بصياغة عربية فصيحة واضحة، من غير تشديده إلى معنى الاستحالة.
- source_word: ἀδελφοί μου
  choice: يا إخوتي
  rationale: يحافظ على صيغة النداء العائلية المذكرة في اليونانية، مع بيان احتمال شمول الجماعة كلها في الحاشية.
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: أن تكون هذه الأمور هكذا
  rationale: يحفظ اسم الإشارة الجمع ومعنى οὕτως «هكذا»، بصياغة عربية طبيعية قريبة من بنية الأصل.
theological_decisions:
- issue: مدى شمول الخطاب في ἀδελφοί μου
  choice: يا إخوتي
  alternative: يا إخوتي وأخواتي
  rationale: الصيغة اليونانية مذكرة جمعًا، لذلك أُبقي شكلها في المتن؛ لكن الاستعمال في السياق قد يشمل جماعة المؤمنين كلها، فذُكر البديل الشامل في الحاشية من غير حسم ما يتركه اللفظ مفتوحًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صورة الفم والتقابل الموجز بين البركة واللعنة، واستُعملت «لا ينبغي» لإبراز الحكم الأخلاقي من دون صياغة متكلفة.
