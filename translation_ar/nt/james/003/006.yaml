  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: ar
  text: واللسان نار. وهو بين أعضائنا عالَمٌ من الإثم، يلطّخ الجسد كله[a]، ويُشعل عجلة النشأة[b]، وتُشعله جهنم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يدنّس الجسد كله».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا فهم «عجلة النشأة» بمعنى «مسار الحياة» أو «دورة الحياة».
    reason: lexical_alternative
  - marker: c
    text: «جهنم» تنقل اللفظة اليونانية «γέεννα»؛ وتُترجم تقليديًا «الجحيم».
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: اللسان
  rationale: أُبقيت صورة عضو الجسد الملموسة التي يستخدمها يعقوب، مع دلالتها السياقية على الكلام.
- source_word: πῦρ
  choice: نار
  rationale: صياغة عربية طبيعية تحفظ الاستعارة المباشرة وقوتها التدميرية.
- source_word: κόσμος τῆς ἀδικίας
  choice: عالَم من الإثم
  rationale: يحفظ التعبير اليوناني المكثف بدل تسطيحه إلى «مملوء شرًّا». واختير «الإثم» للدلالة الأخلاقية الواسعة لـἀδικία في هذا السياق.
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: قائم بين أعضائنا
  rationale: يعبّر عن موضع اللسان وحاله ضمن أعضاء الجسد دون حسم زائد لدلالة الفعل بين الجعل والقيام.
- source_word: σπιλοῦσα
  choice: يلطّخ
  rationale: يحفظ صورة البقعة أو التلطيخ، مع إثبات معنى التدنيس بوصفه بديلًا في الحاشية.
- source_word: ὅλον τὸ σῶμα
  choice: الجسد كله
  rationale: ترجمة مباشرة تحفظ شمول ὅλον.
- source_word: φλογίζουσα
  choice: يُضرِم
  rationale: يحفظ صورة النار المتكررة ويدل على إشعالها وإثارتها.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: عجلة النشأة
  rationale: صياغة قريبة من اللفظ اليوناني تحفظ غرابة الاستعارة؛ «عجلة» تقابل τροχός و«النشأة» تنقل مجال γένεσις من الولادة والنشوء والوجود، مع ذكر التفسيرات الأسلس في الحاشية.
- source_word: φλογιζομένη
  choice: وهو نفسه تُضرمه
  rationale: تحفظ صيغة المبني للمجهول وتوضح أن اللسان الذي يشعل غيره يستمد اشتعاله من مصدر آخر.
- source_word: ὑπὸ τῆς γεέννης
  choice: جهنم
  rationale: «جهنم» هي المقابل العربي المألوف للاسم اليوناني γέεννα، مع بيان خلفيته الاصطلاحية في الحاشية.
theological_decisions:
- issue: دلالة γέεννα
  choice: جهنم
  alternative: وادي هنوم؛ الجحيم
  rationale: اختير المقابل العربي المباشر والمستقر للاسم، من غير توسيعه إلى وصف منهجي لعالم العقاب؛ وتوضح الحاشية أصل المصطلح.
- issue: دلالة τὸν τροχὸν τῆς γενέσεως
  choice: عجلة النشأة
  alternative: مسار الحياة؛ دورة الحياة
  rationale: حُفظت الاستعارة غير المألوفة والتوتر الدلالي في الأصل، بدل حصرها في تفسير واحد سلس.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الاستعارات الجسدية والنارية، كما أُبقيت غرابة «عجلة النشأة» المقصودة مع شرحها في الحاشية، من غير إدخال تفسير مذهبي.
