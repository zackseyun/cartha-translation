lexical_decisions:
- source_word: μήτι
  choice: أَلَعَلَّ
  rationale: تُدخِل سؤالًا إنكاريًّا يُنتظر أن تكون إجابته بالنفي، وتحافظ على القوة البلاغية بأسلوب عربي فصيح طبيعي.
- source_word: πηγή
  choice: النَّبْع
  rationale: يدل اللفظ هنا على مصدر ماء طبيعي، و«النبع» أوضح وأشيع من «الينبوع» في العربية المعاصرة.
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: مِنَ الْفُوَّهَةِ نَفْسِهَا
  rationale: تنقل «الفوّهة» معنى الفتحة التي يخرج منها ماء النبع، من غير اللجوء إلى «الثقب» الخشنة أو «الفم» المجازية.
- source_word: βρύει
  choice: يُفِيضُ
  rationale: يفيد خروج الماء وتدفقه من مصدره، وهو طبيعي في وصف النبع ويحفظ صورة الأصل.
- source_word: τὸ γλυκύ
  choice: مَاءً عَذْبًا
  rationale: الصفة اليونانية مستعملة استعمال الاسم، والمقصود ضمنًا الماء؛ و«عذب» هو التعبير العربي الطبيعي عن الماء المستساغ، مع بقاء المقابلة مع المر.
- source_word: τὸ πικρόν
  choice: مَاءً مُرًّا
  rationale: يُصرَّح بـ«ماء» لتوضيح الاسم المقدر، وتُنقل دلالة المرارة مباشرة.
