id: JAS.3.2
reference: James 3:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: ar
  text: لأننا جميعًا نعثر في نواحٍ كثيرة. إن كان أحدٌ لا يعثر في كلامه[b]، فهو رجل[c] ناضج[a]، قادر أيضًا على أن يُلجِم الجسد كله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «كامل» أو «تام». يمكن أن تدل الكلمة اليونانية على الكمال أو التمام أو النضج؛ والمقصود هنا على الأرجح نضج الخلق، لا العصمة المطلقة من كل خطأ.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «في الكلام»، أي في ما يقوله أو في حديثه.'
    reason: lexical_alternative
  - marker: c
    text: يقول الأصل اليوناني «رجل»، ويَرِد اللفظ هنا بقوة تمثيلية ضمن قول عام ينطبق على أي شخص.
    reason: cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: في أمور كثيرة
  rationale: استعمال حيادي جمع منصوب بوظيفة ظرفية، ويفيد أن العثار يقع في نواحٍ أو أمور كثيرة، لا أنه مفعول به مباشر.
- source_word: γὰρ
  choice: لأننا
  rationale: يحفظ معنى التعليل والربط بما سبق، إذ يبيّن سبب التحذير السابق.
- source_word: πταίομεν / πταίει
  choice: نعثر / يعثر
  rationale: يحفظ صورة التعثر المجازية التي تعبّر عن الإخفاق الأخلاقي، من غير اختزالها في لفظ تفسيري مثل «يخطئ».
- source_word: ἅπαντες
  choice: جميعًا
  rationale: ينقل الشمول المؤكد مع بقاء المتكلم ضمن الجماعة في «نعثر».
- source_word: εἴ τις
  choice: إن كان أحد
  rationale: صياغة شرطية عامة واضحة تقابل التعبير اليوناني غير المحدد.
- source_word: ἐν λόγῳ
  choice: في كلامه
  rationale: يبيّن أن λόγος هنا يشير إلى الكلام أو ما يقوله الإنسان، مع صياغة عربية طبيعية.
- source_word: οὗτος
  choice: فهو
  rationale: الفاء والضمير يعيدان الإشارة بوضوح إلى الشخص المفترض في جملة الشرط؛ والصياغة العربية الطبيعية تغني عن الترجمة الحرفية «هذا».
- source_word: τέλειος
  choice: ناضج
  rationale: ينقل معنى اكتمال الخلق ونضجه في هذا السياق، من غير أن يوحي بالعصمة المطلقة؛ وتُذكر دلالة «كامل» الممكنة في الحاشية.
- source_word: ἀνήρ
  choice: رجل
  rationale: يحفظ الاسم المذكر الصريح في اليونانية، مع بيان أن استعماله هنا تمثيلي ضمن قضية عامة بدأت بعبارة «إن كان أحد».
- source_word: δυνατὸς
  choice: قادر
  rationale: مقابل مباشر واضح لمعنى الاستطاعة والتمكن.
- source_word: χαλιναγωγῆσαι
  choice: أن يُلجِم
  rationale: يحفظ استعارة اللجام التي تتواصل في الآيات التالية، بدل تسطيحها إلى معنى «يسيطر» فقط.
- source_word: καὶ
  choice: أيضًا
  rationale: 'يحفظ القوة الإضافية: من يضبط كلامه يستطيع كذلك أن يضبط الجسد كله.'
- source_word: ὅλον τὸ σῶμα
  choice: جسده كله
  rationale: الضمير المضاف مفهوم من رجوع العبارة إلى الشخص نفسه، وهو أوضح وأطبع في العربية من «الجسد كله» مجردًا.
theological_decisions:
- issue: دلالة τέλειος في السياق الأخلاقي
  choice: ناضج، أي مكتمل الخلق أو بالغ النضج
  alternative: كامل أو تام
  rationale: يركز السياق على نضج ضبط النفس، ولا سيما اللسان. أما «كامل» في الاستعمال الحديث فقد يُفهم على أنه خلو مطلق من الخطأ، وهو فهم يشد العبارة إلى ما وراء ما يقتضيه السياق، مع أن الأصل يحتمل معنى الكمال أو التمام.
- issue: القوة التمثيلية للمذكر ἀνήρ
  choice: رجل مع توضيح أن القول عام
  alternative: شخص أو إنسان
  rationale: الأصل يستعمل اسمًا مذكرًا صريحًا، لكن الشرط «إن كان أحد» يدل على أن القضية عامة؛ لذلك حُفظت صيغة المصدر مع بيان قوتها التمثيلية في الحاشية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. حُفظت استعارتا التعثر واللجام، واستُعمل «ناضج» في المتن لتجنب إيحاء العصمة المطلقة، مع إثبات البدائل الدلالية في الحاشية.
