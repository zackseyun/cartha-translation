  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: ar
  text: هذه الحكمة ليست نازلة من فوق، بل هي أرضية، غير روحية[a]، شيطانية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «طبيعية». يمكن أن تصف الكلمة اليونانية ما يخص الحياة الطبيعية وحدها، في مقابل ما هو روحي.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: هذه الحكمة
  rationale: ينقل اسم الإشارة مع الاسم المعرّف مباشرة، ويشير في السياق إلى الحكمة التي وُصفت في الآيات السابقة من غير إضافة تفسيرية مثل «هذا النوع من الحكمة».
- source_word: ἄνωθεν
  choice: من فوق
  rationale: يحافظ على الدلالة المكانية وعلى الإيحاء بأصل إلهي، كما في يعقوب 1:17، من غير تحويلها تفسيرياً إلى «من السماء».
- source_word: κατερχομένη
  choice: نازلة
  rationale: اسم الفاعل العربي ينقل معنى اسم الفاعل اليوناني في صيغة الحاضر، ويعبّر بإيجاز وطبيعية عن النزول من فوق.
- source_word: ἐπίγειος
  choice: أرضية
  rationale: يحفظ التقابل اللفظي المباشر مع «من فوق»، ولا يضيف الدلالة الأخلاقية الأوسع التي قد تحملها كلمة «دنيوية».
- source_word: ψυχική
  choice: غير روحية
  rationale: يبيّن بوضوح التقابل في الاستعمال العهدي الجديد بين ما يقتصر على الحياة الطبيعية وما هو روحي، مع إثبات البديل «طبيعية» في الحاشية لصون المجال الدلالي.
- source_word: δαιμονιώδης
  choice: شيطانية
  rationale: تعبير عربي موجز ومفهوم عما يتصف بطابع الشياطين أو ينتمي إلى مجالها، من غير استعمال صياغة مطوّلة تزيد على النص.
theological_decisions:
- issue: دلالة ψυχική في التقابل بين الطبيعي والروحي
  choice: غير روحية
  alternative: طبيعية؛ نفسانية
  rationale: «غير روحية» تنقل القوة السلبية للكلمة في هذا السياق وتوضح تقابلها مع الحكمة الآتية من فوق، من غير ربطها بمذهب لاهوتي خاص. أما «طبيعية» فتحفظ جانباً مهماً من معناها لكنها قد تبدو محايدة أخلاقياً، و«نفسانية» أقرب شكلاً لكنها غامضة لكثير من القراء المعاصرين.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وموجزة، تحافظ على تتابع الصفات الثلاث وعلى التقابل بين «من فوق» و«أرضية». وُضعت علامة الحاشية بعد «غير روحية» لأنها تشرح ψυχική تحديداً.
