  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: ar
  text: وثمرُ البرِّ يُزرَع في سلام على أيدي صانعي السلام[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثمر العدل». فاللفظة اليونانية قد تدل على البر الأخلاقي وعلى العدل في العلاقات أو الأحكام.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لصانعي السلام». فصيغة الداتيف في اليونانية تحتمل الوجهين، وإن كان معنى «على أيدي صانعي السلام» أنسب مع الفعل المبني للمجهول هنا.'
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: ثمر
  rationale: يحفظ صورة الثمر في اليونانية، وهو طبيعي في العربية وأدق من «حصاد» هنا.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة في السياق، لا تقتضي مقابلة قوية مثل «لكن».
- source_word: δικαιοσύνης
  choice: البر
  rationale: «البر» المقابل الكتابي العربي الواضح لـ δικαιοσύνη، ويشمل هنا الاستقامة الأخلاقية، مع إثبات احتمال معنى العدل في الحاشية.
- source_word: ἐν εἰρήνῃ
  choice: في سلام
  rationale: صياغة قريبة من الأصل تحفظ احتمال دلالتها على جوّ الزرع أو طريقته.
- source_word: σπείρεται
  choice: يُزرَع
  rationale: ينقل المضارع المبني للمجهول بعبارة عربية طبيعية، مع إبقاء استعارة البذر.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: على أيدي صانعي السلام
  rationale: يُظهر فهم صيغة المجرور اليونانية على أنها دالة على الفاعل مع المبني للمجهول، ويعكس تركيب «يصنعون السلام» من غير غموض عربي ثقيل.
theological_decisions:
- issue: دلالة «ثمر البر»
  choice: الإبقاء على التركيب الإضافي «ثمر البر» من غير حسم نوع العلاقة بين الثمر والبر.
  alternative: «ثمر هو البر» أو «ثمر يؤدي إلى البر».
  rationale: يمكن أن يدل المضاف إليه على ثمر يتصف بالبر، أو يتكون منه، أو يفضي إليه؛ ويحفظ التركيب العربي الموجز هذا التوتر الدلالي.
- issue: دلالة τοῖς ποιοῦσιν εἰρήνην
  choice: 'فهمها على أنها تشير إلى القائمين بفعل الزرع: «على أيدي صانعي السلام».'
  alternative: «لصانعي السلام».
  rationale: مع الفعل المبني للمجهول، تفيد قراءة الفاعل معنى متماسكًا في السياق، لكن صيغة المجرور اليونانية تحتمل قراءة المستفيد، ولذلك أُثبت البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «على أيدي» لتوضيح الفاعل مع المبني للمجهول، و«صانعي السلام» للحفاظ على الصلة اللفظية بفعل صنع السلام.
