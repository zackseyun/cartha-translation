source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: ar
  text: ها إن أجرة العمال الذين حصدوا حقولكم، التي حجزتموها عنهم، تصرخ، وقد دخلت صرخات الحاصدين إلى أذني رب الجنود[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الرب ساباؤوت». تحفظ اليونانية هنا اللقب العبري «ساباؤوت»، ومعناه «الجنود» أو «الجموع».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ها إن
  rationale: أداة تنبيه وتوكيد طبيعية في العربية الفصحى، وتحافظ على قوة الاستهلال من غير اللجوء إلى تعبير مهجور.
- source_word: μισθὸς
  choice: أجرة
  rationale: يدل على العوض المستحق للعمال؛ والمفرد يوافق صيغة الأصل ويتيح إبقاء الفعل مفردًا.
- source_word: ἐργατῶν
  choice: العمال
  rationale: لفظ عربي واضح ومعاصر يناسب سياق العمل الزراعي.
- source_word: ἀμησάντων
  choice: حصدوا
  rationale: ينقل معنى قطع المحصول وجمعه في سياق الحقول بوضوح.
- source_word: χώρας
  choice: حقولكم
  rationale: يشير السياق إلى الأراضي المزروعة التابعة للمخاطبين، و«حقول» هو التعبير الطبيعي هنا.
- source_word: ἀφυστερημένος ἀφ’ ὑμῶν
  choice: التي حجزتموها عنهم
  rationale: يحافظ على معنى منع الأجرة المستحقة، ويصرّح بمرجع الضمير العربي دفعًا للالتباس من غير إضافة حكم يتجاوز النص.
- source_word: κράζει
  choice: تصرخ
  rationale: يحفظ تشخيص الأجرة وصيغة الفعل المفرد في اليونانية، وينقل نداءها الحي طلبًا للعدل.
- source_word: βοαὶ
  choice: صرخات
  rationale: يعبر عن نداءات شديدة ملحّة طلبًا للنجدة أو الإنصاف.
- source_word: θερισάντων
  choice: الحاصدين
  rationale: صياغة موجزة وطبيعية للمشاركين في الحصاد، مع تمييز اللفظ عن الفعل السابق حيث يستعمل الأصل فعلًا آخر قريب المعنى.
- source_word: εἰς τὰ ὦτα
  choice: إلى أذني
  rationale: يحافظ على الصورة السامية الملموسة في النص، مع استعمال المثنى العربي الموافق لـ«الأذنين».
- source_word: Κυρίου Σαβαὼθ
  choice: رب الجنود
  rationale: يترجم اللقب الإلهي بمعناه الموروث من الخلفية العبرية، بدل ترك «ساباؤوت» بلا تفسير في المتن.
- source_word: εἰσεληλύθασιν
  choice: قد دخلت
  rationale: يحفظ استعارة الدخول ودلالة الفعل التام ذي الأثر الحاضر، وتؤنث صيغة الفعل مع جمع غير العاقل في العربية.
theological_decisions:
- issue: ترجمة اللقب الإلهي Κυρίου Σαβαὼθ
  choice: رب الجنود
  alternative: الرب ساباؤوت
  rationale: «ساباؤوت» نقل يوناني للفظ عبري يعني الجنود أو الجموع. ترجمة اللقب في المتن توضح معناه للقارئ، مع إثبات النقل الصوتي التقليدي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حافظت الصياغة على التشخيص البلاغي للأجرة وعلى صورة دخول الصرخات إلى أذني الرب، مع تجنب التفسير المذهبي.
