lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: يا إخوتي
  rationale: صيغة نداء لجمع مذكر، وضمير المتكلم فيها طبيعي بالعربية؛ وقد يُراد بها جميع أفراد الجماعة، ويُبيَّن ذلك في الحاشية.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: إن ضلَّ أحدٌ منكم
  rationale: «إن» تحفظ الشرط المحتمل، و«أحد منكم» تنقل التنكير والإفراد بصورة عربية طبيعية.
- source_word: πλανηθῇ
  choice: ضلَّ
  rationale: الفعل اليوناني المبني للمجهول قد يدل على الضلال أو الوقوع في التضليل. «ضلَّ» عربي موجز وطبيعي يحفظ معنى الانحراف دون أن يحسم جهة التسبب.
- source_word: ἀπὸ τῆς ἀληθείας
  choice: عن الحق
  rationale: «عن الحق» يقابل حرف الجر ومعنى الابتعاد، من غير تخصيص «الحق» بالإنجيل أو بطريقة الحياة المسيحية صراحةً.
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: وردَّه أحدٌ
  rationale: ينقل معنى إرجاع الضال إلى الطريق أو الحق، ويحفظ فاعلًا بشريًا غير معيَّن ومفعولًا مفردًا مذكرًا.
theological_decisions:
- issue: دلالة صيغة النداء المذكرة
  choice: إبقاء «يا إخوتي» في المتن
  alternative: يا إخوتي وأخواتي
  rationale: النص اليوناني يستعمل جمعًا مذكرًا، مع احتمال شموله الجماعة كلها؛ لذلك تُحفظ الصيغة في المتن ويُذكر الشمول المحتمل في الحاشية.
- issue: دلالة πλανηθῇ بين الضلال والتضليل
  choice: ضلَّ
  alternative: أُضلَّ أو انخدع
  rationale: الصيغة اليونانية تحتمل معنى الانحراف ومعنى التعرض للتضليل. «ضلَّ» لا يفرض فاعلًا خارجيًا ولا يلغي إمكانه، فيحفظ التوتر الدلالي بصورة عربية طبيعية.
- issue: فاعل الرد وطبيعته
  choice: وردَّه أحدٌ
  alternative: وأرجعه أحدٌ
  rationale: «ردَّه» يحفظ صورة العودة من الضلال، من غير تحديد وسيلة الرد أو إسناد التحول النهائي إلى قدرة بشرية مستقلة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «ضلَّ عن الحق» لتعبير عربي مألوف يحفظ الاحتمال الدلالي في الأصل، و«ردَّه» للصلة الطبيعية بالعودة في سياق الآية التالية. تُركت الجملة منتهية بفاصلة لأنها تتصل نحويًا بالآية 20.
