base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: ar
  text: هل أحدٌ من بينكم مريض[a]؟ فليدعُ شيوخَ الكنيسة، وليصلّوا عليه وهم يمسحونه بالزيت[b] باسم الرب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ضعيف». قد يدل الفعل اليوناني على الضعف بمعنى أوسع، لكن سياق الصلاة والمسح بالزيت والشفاء في الآية التالية يرجّح أن المقصود هنا المرض.'
    reason: lexical_alternative
  - marker: b
    text: قد يُفهم المسح بالزيت على أنه علاجي أو رمزي أو كلاهما؛ والنص نفسه لا يحدد وظيفته.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: أمريضٌ
  rationale: يفيد الفعل الضعف عمومًا، لكن سياق الصلاة والمسح بالزيت والشفاء في الآية التالية يرجّح المرض الجسدي هنا.
- source_word: τις ἐν ὑμῖν
  choice: أحدٌ بينكم
  rationale: صياغة عربية طبيعية تحفظ معنى الاستفهام العام من غير تقييد بالجنس.
- source_word: προσκαλεσάσθω
  choice: فليدعُ
  rationale: يحفظ قوة الأمر للغائب ويفيد طلب حضور الشيوخ.
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: شيوخ الكنيسة
  rationale: يشير التركيب إلى قادة الجماعة المعترف بهم، لا إلى كبار السن فحسب.
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: وليصلّوا عليه
  rationale: يحفظ دلالة الصلاة فوق المريض أو بحضرته من غير اختزالها إلى مجرد الصلاة لأجله.
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: ويمسحوه بالزيت
  rationale: صياغة واضحة للفعل المادي، ولا تحسم هل استعمال الزيت طبي أو رمزي أو كلاهما.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: باسم الرب
  rationale: يحفظ الاصطلاح الكتابي وصلته بشخص الرب وسلطانه.
theological_decisions:
- issue: دلالة ἀσθενεῖ
  choice: المرض الجسدي هو المعنى الأرجح في المتن
  alternative: الضعف العام أو الروحي
  rationale: الصلاة والمسح بالزيت وسياق الشفاء في الآية التالية ترجّح المرض، مع إثبات المجال الدلالي الأوسع في الحاشية.
- issue: وظيفة المسح بالزيت
  choice: وصف الفعل بحياد من غير تحديد آليته
  alternative: علاج طبي فقط، أو رمز فقط، أو طقس ذو مفعول أسراري محدد
  rationale: النص يذكر المسح ولا يفسر وظيفته، فلا ينبغي إدخال حسم مذهبي.
- issue: هوية πρεσβύτεροι
  choice: شيوخ الكنيسة بوصفهم قادة الجماعة
  alternative: كبار السن عمومًا
  rationale: الإضافة «الكنيسة» تجعل المعنى القيادي الكنسي هو الأنسب.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «أمريضٌ أحدٌ بينكم؟» لاستبقاء صيغة السؤال اليونانية، و«فليدعُ» و«ليصلّوا» لحفظ قوة الأمر. وُزعت علامتا الحاشية على الموضعين اللذين تفسرهما الحاشيتان مباشرة.
