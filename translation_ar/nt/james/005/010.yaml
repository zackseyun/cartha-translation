lexical_decisions:
- source_word: ὑπόδειγμα λάβετε
  choice: اتخذوا ... مثالًا
  rationale: ينقل تركيب الفعل مع الاسم معنى اتخاذ شخص قدوةً أو مثالًا، بصياغة عربية طبيعية تحافظ على قوة الأمر.
- source_word: ἀδελφοί
  choice: يا إخوتي
  rationale: يحافظ على صيغة النداء المذكرة في اليونانية، مع ضمير المتكلم الذي يلائم خطاب يعقوب المباشر.
- source_word: κακοπαθίας
  choice: احتمال المشقة
  rationale: يدل الاسم على معاناة الشدائد والمشقات؛ وإضافة «احتمال» توضح جهة الاقتداء التي يحددها تركيب «مثالًا في» دون اختزال اللفظ في الألم وحده.
- source_word: μακροθυμίας
  choice: طول الأناة
  rationale: تعبير عربي واضح وموقر ينقل معنى الصبر المتأني والثبات طويل النفس، ويميّزه نسبيًا من مجرد احتمال المشقة.
- source_word: τοὺς προφήτας
  choice: الأنبياء
  rationale: نقل مباشر للمفعول به الذي يقدمه يعقوب مثالًا للاقتداء.
- source_word: ἐλάλησαν
  choice: تكلموا
  rationale: ينقل المعنى العادي للفعل من غير إضافة دلالة «نادى» أو «أعلن» غير المصرح بها.
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: باسم الرب
  rationale: يحافظ على التعبير الكتابي الدال على التكلم بسلطان الرب وبصفته ممثلًا له، وهو تعبير عربي طبيعي.
theological_decisions:
- issue: صيغة النداء المذكرة ἀδελφοί ومدى شمولها
  choice: «يا إخوتي» في المتن، مع بيان احتمال شمول الجماعة المؤمنة كلها في الحاشية
  alternative: «يا إخوتي وأخواتي»
  rationale: الصيغة اليونانية مذكرة جمعًا، ولذلك تُحفظ في المتن، لكن استعمالها في الخطاب الرسائلي قد يشمل الرجال والنساء، فيُذكر ذلك دون حسم الصيغة الأصلية بصياغة توسعية.
- issue: علاقة الأنبياء بـ ὑπόδειγμα والمضافين κακοπαθίας وμακροθυμίας
  choice: الأنبياء هم المثال، و«في احتمال المشقة وطول الأناة» يبين مجال الاقتداء
  alternative: اعتبار المشقة وطول الأناة نفسيهما المثال مباشرةً
  rationale: النصب في «الأنبياء» يجعله مفعول «اتخذوا»، أما المضافان إليه فيحددان الناحية التي يكونون فيها مثالًا؛ والصياغة العربية تحفظ هذه العلاقة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «طول الأناة» للمحافظة على التمييز بين معاناة المشقة والصبر الطويل، مع تجنب الألفاظ القديمة الغامضة أو التفسير الطائفي.
