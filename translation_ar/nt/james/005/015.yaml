id: JAS.5.15
reference: James 5:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: ar
  text: وصلاة الإيمان ستخلّص المريض[a]، والرب سيقيمه. وإن كان قد ارتكب خطايا[b]، فستُغفر له.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ستشفي المريض» أو «ستعيد إليه العافية»؛ واللفظ اليوناني هو «ستخلّص».
    reason: lexical_alternative
  - marker: b
    text: أو «حتى إن كان قد ارتكب خطايا».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: صلاة
  rationale: في سياق صلاة الشيوخ من أجل المريض في العدد السابق، تدل الكلمة على الصلاة لا على النذر.
- source_word: πίστεως
  choice: الإيمان
  rationale: تحافظ عبارة «صلاة الإيمان» على تركيب الإضافة اليوناني، وتدل في السياق على صلاة تتسم بالإيمان والثقة بالله.
- source_word: σώσει
  choice: ستخلّص
  rationale: يحفظ هذا الاختيار المعنى الأساسي الواسع للفعل، مع أن سياق المرض يبرز معنى الشفاء والعافية؛ وتوضح الحاشية البدائل السياقية.
- source_word: τὸν κάμνοντα
  choice: المريض
  rationale: مع أن الفعل قد يدل على التعب أو الوهن، فإن سياق المرض والمسح وإقامة الشخص يجعل «المريض» التعبير العربي الطبيعي الأرجح.
- source_word: ἐγερεῖ
  choice: سيقيمه
  rationale: يحفظ صورة الإقامة في الأصل، مع دلالتها السياقية على النهوض من المرض أو استعادة العافية.
- source_word: κύριος
  choice: الرب
  rationale: هو المقابل العربي المألوف للكلمة في الاستعمال الإلهي في العهد الجديد.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: وإن كان قد ارتكب خطايا
  rationale: تنقل «إن» الشرط، وتوحي الواو مع الصياغة بإمكان المعنى التنازلي «حتى إن»، من غير أن تجعل الخطايا سببًا لازمًا لكل مرض.
- source_word: ἀφεθήσεται αὐτῷ
  choice: فستُغفر له
  rationale: تحافظ الصيغة المبنية للمجهول على الفعل الإلهي غير المصرح بفاعله، ويعود المعنى على الخطايا المذكورة.
theological_decisions:
- issue: هل يُحصر σώσει في الشفاء الجسدي أم يُحفظ اتساع معنى الخلاص والاستعادة؟
  choice: ستخلّص
  alternative: ستشفيه / ستعيد إليه العافية
  rationale: السياق يتعلق بالمرض، لكن الفعل اليوناني أوسع من فعل طبي محض؛ لذلك يحفظ المتن اتساع اللفظ وتبين الحاشية المعنى السياقي.
- issue: هل تتضمن الآية ضمانًا آليًا للشفاء عند كل صلاة؟
  choice: إبقاء صيغ المستقبل المباشرة كما وردت بلا تقييد أو تشديد تفسيري
  alternative: يمكن أن تشفيه / ستشفيه حتمًا في كل حالة
  rationale: يحافظ النص على قوة الخبر اليوناني، من غير إدخال تصور مذهبي عن شفاء آلي ولا إضعاف الوعد بإضافات غير موجودة.
- issue: هل تربط الآية كل مرض بخطيئة شخصية؟
  choice: 'صياغة الخطايا في جملة شرطية: «وإن كان قد ارتكب خطايا»'
  alternative: اعتبار الخطايا سببًا لازمًا للمرض
  rationale: يعرض الأصل ارتكاب الخطايا بوصفه احتمالًا مشروطًا، لا تفسيرًا عامًا لكل مرض.
- issue: الدلالة المحتملة لإضافة πίστεως
  choice: صلاة الإيمان
  alternative: الصلاة المتسمة بالثقة / الأمانة
  rationale: تحفظ الإضافة الأصلية والتوتر الدلالي، بينما يفهم السياق الإيمان هنا أساسًا بوصفه ثقة بالله لا أمانة بشرية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «ستخلّص» للمحافظة على اتساع الفعل اليوناني، و«سيقيمه» لصون الصورة الأصلية. جرى تجنب صياغة توحي بأن المرض ناتج دائمًا من خطيئة شخصية.
