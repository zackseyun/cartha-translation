id: JAS.5.12
reference: James 5:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: ar
  text: ولكن قبل كل شيء، يا إخوتي[a]، لا تحلفوا، لا بالسماء ولا بالأرض ولا بأي قسم آخر. بل ليكن «نعم» عندكم نعم، و«لا» لا، لئلا تقعوا تحت الدينونة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يا إخوتي وأخواتي»؛ اللفظ اليوناني هو «إخوة»، ويُرجَّح أنه يخاطب جماعة المؤمنين كلها.
    reason: lexical_alternative
  - marker: b
    text: أو «لئلا تقعوا تحت الإدانة».
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: قبل كل شيء
  rationale: تعبير عربي طبيعي يحفظ معنى الأولوية والتوكيد في الوصية، من غير أن يفترض ترتيبًا زمنيًا محضًا.
- source_word: ἀδελφοί μου
  choice: يا إخوتي
  rationale: يحفظ صيغة الجمع المذكر في اليونانية، وهي هنا على الأرجح خطاب تمثيلي يشمل جماعة المؤمنين كلها؛ ويُوضَّح ذلك في الحاشية.
- source_word: μὴ ὀμνύετε
  choice: لا تحلفوا
  rationale: ينقل النهي العام بإيجاز ووضوح، ويبيّن السياق اللاحق أن المقصود الحلف بالأقسام لا التلفظ بالكلام البذيء.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον
  choice: لا بالسماء ولا بالأرض ولا بأي قسم آخر
  rationale: يحافظ على تتابع النفي وشمول النهي، مع صياغة عربية سليمة تستعمل الباء في المحلوف به.
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: بل ليكن «نعم» عندكم نعم، و«لا» لا
  rationale: يحفظ الإيجاز والأثر الحكمي في العبارة اليونانية، ويجعل «عندكم» مقابلًا طبيعيًا لـὑμῶν دون زيادة تفسيرية.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: لئلا تقعوا تحت الدينونة
  rationale: يحفظ صورة الوقوع تحت حكم قضائي، وتؤدي «الدينونة» هنا معنى κρίσις من غير أن تحسم بذاتها أن المقصود إدانة نهائية.
theological_decisions:
- issue: 'مدى قوة معنى κρίσις: الدينونة أم الإدانة'
  choice: الدينونة
  alternative: الإدانة
  rationale: يمكن أن تدل κρίσις على القضاء أو الحكم على وجه عام، بينما قد توحي «الإدانة» بحكم سلبي نهائي على نحو أضيق. لذلك اختيرت «الدينونة» وأُبقي البديل في الحاشية حفاظًا على سعة الدلالة.
- issue: هل يشمل ἀδελφοί النساء في جماعة المخاطبين
  choice: يا إخوتي
  alternative: يا إخوتي وأخواتي
  rationale: النص اليوناني يستعمل جمعًا مذكرًا، لكنه يُرجَّح أن يخاطب به جماعة المؤمنين كلها. حُفظت الصيغة الأصلية في المتن، ووُضّح شمولها المحتمل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «تحلفوا» للتمييز من معنى السباب الشائع في بعض اللغات، و«قسم» للدلالة على اليمين. وُضعت «نعم» و«لا» بين علامتي تنصيص لتوضيح أنهما اللفظان المنطوقان، مع إبقاء العبارة موجزة كما في الأصل.
