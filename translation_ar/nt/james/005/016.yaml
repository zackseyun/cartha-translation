  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: ar
  text: لذلك اعترفوا بعضكم لبعض بخطاياكم، وصلّوا بعضكم من أجل بعض، لكي تُشفَوا. إن دعاء الإنسان البار ذو قوة عظيمة حين يكون فعّالًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «إن تضرع الإنسان البار له قوة عظيمة وهو عامل».'
    reason: تحفظ صياغة بديلة البنية الفعلية في πολὺ ἰσχύει، وتعرض وجهًا مباشرًا لدلالة ἐνεργουμένη دون الجزم بكونها وسطى أو مبنية للمجهول.
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: اعترفوا
  rationale: يفيد الفعل الإقرار العلني، ومع «الخطايا» يكون «اعترفوا» المقابل العربي الطبيعي، من غير افتراض إطار طقسي أو كهنوتي محدد.
- source_word: οὖν
  choice: لذلك
  rationale: تربط الأداة الوصية بما سبق من حديث عن الصلاة والخطية والشفاء، وتحافظ «لذلك» على معنى الاستنتاج.
- source_word: ἀλλήλοις
  choice: بعضكم لبعض
  rationale: ينقل بوضوح معنى التبادل في ضمير المعاملة بالمثل.
- source_word: τὰς ἁμαρτίας
  choice: بخطاياكم
  rationale: إضافة ضمير المخاطبين مفهومة من الوصية المتبادلة، و«الخطايا» هي المقابل المباشر والواضح.
- source_word: εὔχεσθε ὑπὲρ ἀλλήλων
  choice: صلّوا بعضكم لأجل بعض
  rationale: صياغة عربية طبيعية تحفظ معنى الصلاة الشفاعية والتبادل بين أفراد الجماعة.
- source_word: ὅπως ἰαθῆτε
  choice: لكي تُشفَوا
  rationale: تحفظ غرض العبارة وصيغة المبني للمجهول، وتبقي الشفاء واسع الدلالة دون حصره في الجسد أو الروح.
- source_word: πολὺ ἰσχύει
  choice: قوة عظيمة
  rationale: ينقل معنى القدرة والفاعلية الشديدتين بصياغة عربية واضحة، دون تحويل العبارة إلى وعد بنتيجة محددة.
- source_word: δέησις
  choice: دعاء
  rationale: يدل على الصلاة التي تتضمن طلبًا أو تضرعًا؛ و«دعاء» لفظ عربي واضح يلائم السياق.
- source_word: δικαίου
  choice: الإنسان البار
  rationale: الصفة اليونانية مستعملة استعمال الاسم بمعنى شخص بار؛ وإظهار «الإنسان» يحافظ على العموم ولا يقصرها على الذكور.
- source_word: ἐνεργουμένη
  choice: حين يكون فاعلًا
  rationale: يحفظ الصلة بين الدعاء وعمله أو فاعليته، مع إبقاء شيء من الاحتمال النحوي في صيغة اسم الفاعل اليونانية الوسطى/المبنية للمجهول.
theological_decisions:
- issue: هل تأمر الآية باعتراف طقسي للكهنة أم باعتراف متبادل بين المؤمنين؟
  choice: 'اعتراف متبادل: «بعضكم لبعض»'
  alternative: اعتراف يتوسط فيه رجال الدين المرسومون
  rationale: الضمير المتبادل ἀλλήλοις يصرح بالتبادل بين المخاطبين، فلا تُحمَّل العبارة وحدها إطارًا كنسيًا أضيق من نصها.
- issue: نطاق الشفاء في ἰαθῆτε
  choice: «تُشفَوا» بمعناها الواسع
  alternative: الشفاء الجسدي وحده، أو الشفاء الروحي وحده
  rationale: السياق القريب يتناول المرض الجسدي، لكن ذكر الخطايا يمنع تضييق الدلالة بلا ضرورة؛ لذلك تُترك طبيعة الشفاء مفتوحة كما في الأصل.
- issue: الدلالة الجنسانية في δικαίου
  choice: «الإنسان البار» بمعنى عام
  alternative: «الرجل البار»
  rationale: المذكر المفرد هنا ذو استعمال حكمي عام، ولا يقتضي قصر المعنى على الذكور.
- issue: دلالة ἐνεργουμένη وصلتها بقوة الدعاء
  choice: «حين يكون فاعلًا»
  alternative: «إذا أُعمِل» أو «وهو فعّال»
  rationale: الصيغة اليونانية تحتمل ظلالًا وسطى أو مبنية للمجهول، والترجمة المختارة تحفظ فكرة الدعاء العامل من غير أن تنسب تفعيله صراحةً إلى عامل مذكور أو تحوّلها إلى وصف ثابت فقط.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «بعضكم لبعض» لإبراز التبادل، و«دعاء» للدلالة على صلاة الطلب، مع تجنب المصطلحات الطائفية أو حصر الشفاء في جانب واحد.
