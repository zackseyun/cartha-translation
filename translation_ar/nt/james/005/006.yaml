  text: κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον. οὐκ ἀντιτάσσεται ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: ar
  text: حَكَمْتُم على البارّ، وقتلتموه. أفلا يقاومكم؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة الجملة: «وهو لا يقاومكم». أمّا بحسب ترقيم SBLGNT فهي سؤال: «أفلا يقاومكم؟»'
    reason: غموض في ترقيم العبارة وقوتها البلاغية؛ فاليونانية القديمة لم تكن تحمل علامات الترقيم الأصلية، وصيغة السؤال هنا قد تؤدي معنى يختلف عن القراءة الخبرية.
lexical_decisions:
- source_word: κατεδικάσατε
  choice: حَكَمْتُم على
  rationale: ينقل المعنى القضائي للفعل بصياغة عربية واضحة ومباشرة، مع إبقاء الماضي الدال على الاتهام بأفعال واقعة.
- source_word: ἐφονεύσατε
  choice: قتلتموه
  rationale: الفعل اليوناني يدل على القتل المجرَّم أخلاقيًا؛ والسياق الاتهامي يمنح «قتلتموه» هذه القوة في العربية من غير تعبير متكلّف، والضمير يوضح عود الفعل على البارّ.
- source_word: τὸν δίκαιον
  choice: البارّ
  rationale: صفة مفردة مذكرة مستعملة استعمال الاسم، ويمكن أن تدل على شخص بار ممثِّل للمظلومين، من غير أن تحسم كونها لقبًا مسيانيًا.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: أفلا يقاومكم؟
  rationale: يحافظ على صيغة السؤال في نص SBLGNT وعلى معنى أن يضع المرء نفسه في مواجهة آخر أو يقاومه. وإدخال الفاء يصل الجملة بما قبلها طبيعيًا في العربية.
theological_decisions:
- issue: مرجع «البارّ»
  choice: 'إبقاء التعبير مفردًا عامًا: «البارّ»'
  alternative: فهمه إشارة ضمنية إلى يسوع بوصفه «البارّ»
  rationale: السياق المباشر يندد بالأغنياء الذين يظلمون البار، ويمكن للمفرد أن يكون تمثيليًا. أما الصياغة نفسها فلا تفرض تعيين يسوع، لذلك تُبقي الترجمة الاحتمالين مفتوحين.
- issue: قوة العبارة الختامية
  choice: 'إبقاء السؤال: «أفلا يقاومكم؟»'
  alternative: 'صياغتها خبرًا: «وهو لا يقاومكم»'
  rationale: 'علامة الاستفهام في SBLGNT واللفظ اليوناني οὐκ يسمحان بسؤال بلاغي يتوقع جوابًا مثبتًا من جهة الصياغة: بلى، يقاومكم. وهذا يختلف عن التقرير بأنه لا يقاوم؛ لذا ينبغي عدم إلغاء التوتر أو قلب دلالة السؤال في المتن.'
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «البارّ» لأنه موجز وطبيعي في السياق الكتابي، وحُفظ الاستفهام الوارد في الطبعة اليونانية بدل تسويته إلى خبر. وُضع مؤشر الحاشية في المتن.
