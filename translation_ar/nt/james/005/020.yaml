  rationale: عُدِّل التعبير عن ψυχὴν αὐτοῦ لتجنّب الضمير الانعكاسي العربي الذي يفرض مرجعًا واحدًا. وتحفظ «نفسًا» السعة الدلالية للنفس/الحياة، بينما توثق الحاشيتان المعنى المعجمي وموضع الالتباس في الضمير اليوناني. كما نُقلت المرستان إلى اللفظ الذي تشرحه الحواشي.
