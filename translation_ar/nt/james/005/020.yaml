  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: ar
  text: فليعلم أن من يَرُدُّ خاطئًا عن ضلال طريقه سيُخلِّص نفسًا[a][b] من الموت، ويستر خطايا كثيرة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيُنقذ حياةً من الموت». فاللفظة اليونانية قد تعني «النفس» أو «الحياة».'
    reason: lexical_alternative
  - marker: b
    text: تتضمن اليونانية ضميرَ ملكيةٍ في هذا الموضع، وقد يعود إلى الخاطئ الذي رُدَّ؛ ويرى بعضهم أنه يعود إلى من ردَّه.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: فليعلم
  rationale: صيغة أمر للغائب المفرد، ونقلها بهذه الصياغة يحفظ قوة الحث بعبارة عربية فصيحة وطبيعية.
- source_word: ὁ ἐπιστρέψας
  choice: من يَرُدُّ ... عن
  rationale: اسم فاعل مسبوق بأداة التعريف ويؤدي معنى عامًا. واختيار «يردّ» يعبّر عن إعادة الخاطئ بعد ضلاله من غير تحميل اللفظ دلالة اصطلاحية زائدة.
- source_word: ἁμαρτωλὸν
  choice: خاطئًا
  rationale: اسم نكرة مستعمل استعمالًا عامًا؛ و«خاطئ» لفظ واضح ومألوف يدل على من يرتكب الخطية.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: عن ضلال طريقه
  rationale: يحفظ «ضلال» معنى الخطأ والتيه، كما يحفظ «طريقه» الصورة المجازية الدالة على نهج الحياة والسلوك.
- source_word: σώσει
  choice: سيُخلِّص
  rationale: يحفظ صيغة المستقبل والثقل الدلالي للفعل σῴζω، من غير قصر الخلاص على معنى جسدي أو روحي وحده.
- source_word: ψυχὴν αὐτοῦ
  choice: نفسه
  rationale: «نفس» تقابل ψυχή وتحفظ إمكان دلالتها على النفس أو الحياة. وأُبقي الضمير في المتن، مع بيان احتمال مرجعه في الحاشية.
- source_word: ἐκ θανάτου
  choice: من الموت
  rationale: ترجمة مباشرة لا تحسم ما إذا كان المقصود موتًا جسديًا أم روحيًا.
- source_word: καλύψει
  choice: يستر
  rationale: يحفظ الصورة الكتابية لفعل التغطية بصياغة عربية طبيعية، من غير تفسير كيفية ستر الخطايا.
- source_word: πλῆθος ἁμαρτιῶν
  choice: خطايا كثيرة
  rationale: صياغة عربية طبيعية تنقل معنى الكثرة الذي يفيده πλῆθος، وتتجنب التركيب الأثقل «كثرة من الخطايا».
theological_decisions:
- issue: مرجع الضمير αὐτοῦ في ψυχὴν αὐτοῦ
  choice: إبقاء الضمير في «نفسه» مع توضيح الاحتمالين في الحاشية
  alternative: التصريح بأنها نفس الخاطئ، أو نفس من يرده
  rationale: يمكن أن يعود الضمير اليوناني إلى الخاطئ الذي رُدَّ، ويمكن عند بعضهم أن يعود إلى من ردَّه. لا يحسم المتن المرجع بما يتجاوز صياغة الأصل، وتوثق الحاشية الاحتمال الآخر.
- issue: دلالة ψυχή وθάνατος
  choice: «نفسه من الموت» بألفاظ واسعة الدلالة
  alternative: «حياته من الموت»، أو تفسير الموت بأنه موت روحي
  rationale: قد يدل الكلام على إنقاذ الحياة، أو الخلاص الروحي، أو يشمل البعدين؛ لذلك تُحفظ سعة التعبير من غير تقييده بمنظومة عقائدية بعينها.
- issue: معنى ستر الخطايا
  choice: الإبقاء على الصورة «يستر خطايا كثيرة»
  alternative: تفسير الستر صراحةً بأنه الغفران أو المحو
  rationale: الأصل يستخدم صورة الستر ولا يشرح آليتها أو يحدد بدقة خطايا مَن المقصودة؛ لذا لا يضيف المتن حسمًا لاهوتيًا غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. اختيرت تراكيب مألوفة للقارئ العام، مع الحفاظ على صورتي الطريق والستر وعلى مواطن الغموض المقصودة في الأصل.
