source:
  edition: SBLGNT
  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: ar
  text: ثم صلى من جديد، فأعطت السماء مطرًا، وأنبتت الأرض ثمرها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فأخرجت الأرض غلتها» أو «فأنبتت الأرض محصولها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: من جديد
  rationale: تفيد تكرار الفعل، و«من جديد» تعبير عربي طبيعي موجز، والمقصود صلاة إيليا اللاحقة.
- source_word: προσηύξατο
  choice: صلى
  rationale: الفعل يعني ببساطة أنه صلى؛ ولا يُنقل إليه معنى «بحرارة» الوارد في سياق الآية السابقة.
- source_word: ὁ οὐρανὸς
  choice: السماء
  rationale: تشير هنا إلى السماء المنظورة في سياق المطر، مع إبقاء اللفظ العربي الطبيعي الذي يقابل οὐρανός.
- source_word: ὑετὸν ἔδωκεν
  choice: أعطت السماء مطرًا
  rationale: يحافظ على صورة النص الحرفية، «أعطى مطرًا»، من غير استبدالها بعبارة تصرح بفاعل إلهي لم تذكره الآية صراحة.
- source_word: ἡ γῆ
  choice: الأرض
  rationale: تلائم الموازاة مع «السماء»، وتشمل المعنى الزراعي للأرض من غير تضييقه إلى بقعة أو تربة بعينها.
- source_word: ἐβλάστησεν
  choice: أنبتت
  rationale: ينقل معنى الإنبات والإخراج الزراعي بصورة عربية طبيعية، وهو أدق هنا من تعبير عام مثل «أنتجت».
- source_word: τὸν καρπὸν αὐτῆς
  choice: ثمرها
  rationale: يحافظ على معنى καρπός وصيغة الإضافة، ويُفهم في السياق على أنه غلة الأرض ومحصولها.
theological_decisions:
- issue: صلة صلاة إيليا بنزول المطر
  choice: وصف النتيجة المرئية بعبارة «أعطت السماء مطرًا» من غير إضافة فاعل إلهي صريح
  alternative: «فأرسل الله المطر»
  rationale: السياق يدل على الاستجابة الإلهية، لكن صياغة الآية نفسها تسند إعطاء المطر إلى السماء وإنبات الثمر إلى الأرض؛ لذلك تُحفظ صورة النص من غير شرح لاهوتي مضاف.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «ثم» لربط الصلاة اللاحقة بما قبلها، و«فـ» لإظهار تعاقب النتائج من غير تقرير علاقة سببية تتجاوز صياغة الأصل.
