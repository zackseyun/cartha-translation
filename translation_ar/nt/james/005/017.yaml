  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: ar
  text: كان إيليا إنسانًا مثلنا في طبيعته[a]، وصلّى بحرارة ألا ينزل المطر، فلم ينزل المطر على الأرض ثلاث سنوات وستة أشهر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كان إيليا إنسانًا مثلنا»، أو: «كانت له مشاعر وأهواء مثلنا».'
    reason: بدائل معجمية لعبارة ὁμοιοπαθὴς ἡμῖν، التي قد تشير على وجه واسع إلى الاشتراك في الحال البشرية أو، على نحو أضيق، إلى المشاعر والأهواء.
lexical_decisions:
- source_word: Ἠλίας
  choice: إيليا
  rationale: الصيغة العربية المألوفة لاسم النبي في التراث الكتابي.
- source_word: ἄνθρωπος
  choice: إنسانًا
  rationale: تُبرز أن إيليا بشر عادي، وهي هنا أفصح وأدق من «رجلًا» لأن التركيز على بشريته المشتركة مع القرّاء.
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: مثلنا في طبيعته
  rationale: تنقل اشتراك إيليا معنا في الطبيعة والحال البشرية، من غير حصر المعنى في المشاعر أو الأهواء وحدها.
- source_word: προσευχῇ προσηύξατο
  choice: صلّى بحرارة
  rationale: تنقل قوة التركيب الاشتقاقي المؤكد في اليونانية بصياغة عربية طبيعية؛ أما النقل الحرفي «صلّى صلاة» فركيك.
- source_word: τοῦ μὴ βρέξαι
  choice: ألا ينزل المطر
  rationale: صياغة عربية طبيعية تعبّر عن مضمون الصلاة أو غايتها، من غير حسم الفرق الدقيق بينهما.
- source_word: οὐκ ἔβρεξεν
  choice: فلم ينزل المطر
  rationale: تعبير عربي واضح وطبيعي يقابل الفعل اليوناني المستعمل استعمالًا غير شخصي.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: تحافظ «الأرض» على السعة المعجمية لكلمة γῆ، ويمكن أن تُفهم بحسب السياق على أنها أرض البلاد، من غير فرض دلالة كونية.
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: ثلاث سنوات وستة أشهر
  rationale: تنقل مدة انقطاع المطر بوضوح، ويؤدي السياق وظيفة بيان الاستمرار من غير حاجة إلى إضافة «لمدة».
theological_decisions:
- issue: دلالة ὁμοιοπαθὴς في وصف بشرية إيليا
  choice: إيليا إنسان يشترك معنا في الطبيعة والحال البشرية
  alternative: إيليا له المشاعر أو الأهواء نفسها التي لنا
  rationale: سياق التشجيع على الصلاة يبرز أن إيليا، رغم مكانته النبوية، كان بشرًا مثل القرّاء. وتحافظ الصياغة المختارة على هذا المعنى الواسع من غير قصره على الجانب العاطفي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة الأسلوب. استُعملت «إنسانًا» لإبراز البشرية المشتركة، و«صلّى بحرارة» لنقل توكيد التركيب اليوناني من غير حرفية ركيكة. وُضع مؤشر الحاشية [a] مباشرة بعد العبارة التي يشرحها.
