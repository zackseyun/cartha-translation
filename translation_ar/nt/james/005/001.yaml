  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: ar
  text: هلمّوا الآن، أيها الأغنياء، ابكوا وأنتم تولولون[a] على الشدائد[b] الآتية عليكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «تصرخون نائحين». يدل اللفظ اليوناني على نواح مرتفع ومسموع.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «المصائب» أو «الضيقات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: هلمّوا الآن
  rationale: تعبير استهلالي يحمل نبرة استدعاء حادّة وتمهّد للتوبيخ؛ وصيغة الجمع تلائم المخاطَبين في العربية.
- source_word: οἱ πλούσιοι
  choice: أيها الأغنياء
  rationale: الاسم في اليونانية يؤدي وظيفة النداء، وهذه الصياغة العربية تحافظ على الخطاب المباشر ونبرته النبوية.
- source_word: κλαύσατε
  choice: ابكوا
  rationale: فعل أمر يدعو إلى حزن ظاهر، و«ابكوا» هو المقابل العربي المباشر والطبيعي.
- source_word: ὀλολύζοντες
  choice: وأنتم تولولون
  rationale: اسم الفاعل اليوناني يصوّر بكاءً مرتفع الصوت ويقوّي الأمر السابق؛ وتحافظ الجملة الحالية في العربية على تبعيته للأمر بدل تحويله إلى أمر مستقل.
- source_word: ἐπὶ
  choice: على
  rationale: تفيد هنا سبب النواح أو مناسبته، و«على» طبيعية في العربية مع البكاء على ما يحل بالإنسان.
- source_word: ταλαιπωρίαις
  choice: الشدائد
  rationale: تدل الكلمة على أحوال قاسية وبؤس شديد؛ و«الشدائد» واضحة وفصيحة وتحفظ سعة الدلالة دون حصرها في نوع محدد من المصائب.
- source_word: ταῖς ἐπερχομέναις
  choice: الآتية عليكم
  rationale: تحافظ على صورة الشدائد وهي مقبلة على المخاطَبين، من غير المبالغة في تحديد مدى قربها الزمني.
theological_decisions:
- issue: هوية الأغنياء وطبيعة الخطاب الموجّه إليهم
  choice: إبقاء الخطاب توبيخًا نبويًا عامًا للأغنياء الذين ستأتي عليهم الشدائد، من غير تحديد ما إذا كانوا مؤمنين أم غير مؤمنين.
  alternative: قصر الخطاب على ملاك الأراضي الظالمين غير المؤمنين، أو على الأغنياء داخل الجماعة المسيحية.
  rationale: الآية نفسها تخاطب «الأغنياء» مباشرة وتعلن شدائد آتية، لكنها لا تحدد في هذا السطر وحده وضعهم الإيماني؛ لذلك لا تحسم الترجمة ما أبقاه النص مفتوحًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة وحادّة تناسب التوبيخ النبوي. استُعمل «هلمّوا» لما فيه من قوة الاستدعاء، مع بقاء بقية العبارة سهلة الفهم. وُضعت علامتا الحاشيتين عند اللفظين اللذين تشرحانهما فعليًا.
