base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: ar
  text: اصبروا أنتم أيضًا، وثبِّتوا قلوبكم، لأن مجيء الرب[a] قد اقترب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حضور الرب». يمكن للكلمة اليونانية أن تعني «الحضور» أو «المجيء»؛ وهي تشير في هذا السياق إلى وصول الرب الأخروي.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: اصبروا
  rationale: فعل أمر للجمع يدل على الصبر المتأني والثبات تحت المشقة أو الاستفزاز. «اصبروا» واضح وطبيعي في العربية، ويلائم سياق انتظار الثمر واحتمال المشقة.
- source_word: καὶ ὑμεῖς
  choice: أنتم أيضًا
  rationale: 'يحفظ توكيد الضمير ويربط المخاطَبين بالمثال السابق: كما يصبر الزارع، عليهم هم أيضًا أن يصبروا.'
- source_word: στηρίξατε
  choice: ثبِّتوا
  rationale: يفيد التقوية والإرساء على الثبات. و«ثبِّتوا قلوبكم» تعبير عربي طبيعي يحفظ صورة النص عن ترسيخ العزم الداخلي.
- source_word: τὰς καρδίας ὑμῶν
  choice: قلوبكم
  rationale: ترجمة مباشرة تحفظ الاستعارة الكتابية؛ فالقلب هنا يشمل باطن الإنسان وإرادته وشجاعته، لا العاطفة وحدها.
- source_word: ὅτι
  choice: لأن
  rationale: تُدخل علة الأمرين السابقين بوضوح.
- source_word: ἡ παρουσία
  choice: مجيء
  rationale: يمكن أن تعني الكلمة «الحضور» أو «المجيء»، لكن سياق يعقوب 5:7–8 يتحدث عن انتظار وصول الرب الأخروي، لذلك يلائم «مجيء» السياق مع إثبات البديل في الحاشية.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: يحفظ اللقب المعتاد κύριος في سياق الإشارة إلى يسوع ووصوله الأخروي.
- source_word: ἤγγικεν
  choice: قد اقترب
  rationale: الفعل في صيغة التام ويدل على قرب تحقق وصار قائمًا. «قد اقترب» يحفظ هذه الدلالة بصورة موجزة وطبيعية.
theological_decisions:
- issue: دلالة παρουσία في القول الأخروي عن الرب
  choice: مجيء الرب
  alternative: حضور الرب
  rationale: للكلمة مجال دلالي يشمل الحضور والمجيء، ولا ينبغي إخفاء ذلك. غير أن سياق انتظار الزارع إلى مجيء الرب يجعل معنى الوصول الأخروي هو الأرجح في المتن، مع حفظ «الحضور» بديلًا معجميًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت استعارة «القلوب» وصيغة الأمر الموجهة إلى الجماعة، ووُضع مؤشر الحاشية بعد العبارة التي تشرحها مباشرة.
