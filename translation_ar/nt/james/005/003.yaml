  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: ar
  text: قد صدئ[a] ذهبكم وفضتكم، وسيكون صدؤهما شهادةً عليكم، وسيأكل لحومكم كالنار[b]. لقد كنزتم كنوزًا في الأيام الأخيرة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «قد تآكل ذهبكم وفضتكم». اللفظ اليوناني يستعمل صورة الصدأ، مع أن الذهب والفضة لا يصدآن بالمعنى العلمي الدقيق، ويمكن أن يدل هنا على التآكل أو فساد المعدن.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن وصل «كالنار» بما بعدها بدلًا من ربطها بـ«سيأكل لحومكم»، فيكون المعنى نحو: «لقد كنزتم نارًا في الأيام الأخيرة».'
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: قد صدئ
  rationale: ينقل صيغة التام اليونانية حالةً حاضرة ناتجة من فعل سابق. والصدأ هنا صورة نبوية تشمل فساد المعادن وتآكلها، مع بقاء غرابة إسناده إلى الذهب والفضة كما في الأصل.
- source_word: ὁ ἰὸς αὐτῶν
  choice: صدؤهما
  rationale: يدل ἰός في سياق المعادن على الصدأ أو ناتج التآكل، لا على السم. واختيار «صدؤهما» يحافظ على تكرار الصورة اللفظية في اليونانية.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: شهادةً عليكم
  rationale: يحافظ على الاستعارة القضائية في μαρτύριον وعلى دلالة العبارة في السياق بوصفها شهادة إدانة ضد المخاطَبين.
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: سيأكل لحومكم
  rationale: ترجمة حسية مباشرة تحفظ قوة صورة الأكل المروعة، ولا تستبدل بها تعبيرًا تجريديًا مثل «يهلك أجسادكم».
- source_word: ὡς πῦρ
  choice: كالنار
  rationale: تتصل في القراءة الأرجح بالفعل السابق، فيكون الصدأ آكلًا لحومهم كما تفعل النار.
- source_word: ἐθησαυρίσατε
  choice: كنزتم كنوزًا
  rationale: يعبّر الفعل «كنز» عن جمع الثروة وتخزينها، وإظهار المفعول المطلق الاسمي يجعل المعنى واضحًا في العربية من غير إضافة حكم تفسيري مثل «احتكرتم».
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: في الأيام الأخيرة
  rationale: مقابل عربي مباشر وواضح للعبارة الأخروية اليونانية، من غير إضافة اسم إشارة غير موجود في النص.
theological_decisions:
- issue: موضع تعلق ὡς πῦρ في الجملة
  choice: 'ربط «كالنار» بما قبلها: «وسيأكل لحومكم كالنار».'
  alternative: 'ربطها بما بعدها: «لقد كنزتم كنارٍ في الأيام الأخيرة» أو «كنزتم نارًا في الأيام الأخيرة».'
  rationale: ترجيح تعلقها بالفعل «سيأكل» أوفق بالتتابع النحوي ويعطي صورة مفهومة للدينونة، لكن موضع العبارة في اليونانية يسمح بقدر من الاحتمال أن تبدأ بها الجملة التالية؛ لذلك ذُكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة ونبوية. حُفظت الصور الحسية القوية في الأصل («الصدأ»، «سيأكل لحومكم»، «كالنار»)، مع توثيق الغرابة المعدنية والاحتمال النحوي الحقيقي في الحواشي.
