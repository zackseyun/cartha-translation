base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: ar
  text: لا تتذمّروا على بعضكم بعضًا، يا إخوتي[a]، لئلّا تُحاكَموا. ها إنّ الديّان واقف عند الأبواب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «إخوتي» ترجمة للكلمة اليونانية ἀδελφοί، وهي صيغة مذكرة قد تُستعمل لمخاطبة جماعة المؤمنين كلها، رجالًا ونساءً، بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: تتذمّروا
  rationale: يفيد الفعل هنا، مع «بعضكم على بعض»، الشكوى الناشئة عن الضيق والموجّهة إلى الآخرين؛ و«تتذمّروا» أوضح عربيًا من الترجمة الحرفية «تئنّوا» في هذا السياق.
- source_word: ἀδελφοί
  choice: يا إخوتي
  rationale: تحافظ على صيغة النداء المذكرة في اليونانية، ويمكن أن تشمل جماعة المؤمنين رجالًا ونساءً بحسب السياق، كما توضّح الحاشية.
- source_word: κατ’ ἀλλήλων
  choice: بعضكم على بعض
  rationale: تنقل معنى المعارضة أو الشكوى الموجّهة ضد الآخر، بصياغة عربية طبيعية.
- source_word: κριθῆτε
  choice: تُدانوا
  rationale: تنقل المبني للمجهول من κρίνω في سياق التحذير من الوقوع تحت القضاء، من غير إضافة فاعل غير مصرّح به. وقد تحمل «الإدانة» بالعربية إيحاءً بنتيجة سلبية، لكن السياق القضائي يجعلها طبيعية، مع بقاء «تُحاكَموا» بديلًا أوسع.
- source_word: κριτὴς
  choice: الديّان
  rationale: لفظ عربي واضح ذو قوة لقبية يشير إلى صاحب القضاء، من غير تعيين صريح لهوية المرجع بما يتجاوز النص.
- source_word: πρὸ τῶν θυρῶν
  choice: عند الأبواب
  rationale: يحفظ جمع «الأبواب» في الأصل ويؤدي صورة القرب والوشوك.
- source_word: ἕστηκεν
  choice: واقف
  rationale: 'يعبر طبيعيًا عن الحالة الراهنة الناتجة التي يدل عليها perfect اليوناني: لقد اتخذ موقفه وهو الآن واقف.'
theological_decisions:
- issue: مرجع «الديّان»
  choice: الإبقاء على اللقب من غير تعيين، بما يسمح بفهمه بوصفه الديّان الإلهي الآتي للقضاء
  alternative: التصريح بأنه الرب أو المسيح، أو بأنه الله على نحو عام
  rationale: السياق السابق يتحدث عن مجيء الرب، لكن اليونانية هنا تقول «الديّان» فقط؛ لذلك يحفظ النص الصلة السياقية والتوتر اللاهوتي من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة. استُخدمت «لا تتذمّروا» لتأدية القوة الأخلاقية والعلاقية للفعل، وحُفظ جمع «الأبواب» وصورة الديّان الواقف قريبًا.
