  rationale: حُذفت إضافة ضمير المتكلم من النداء، وحُسّنت صياغة صبر الفلّاح لتكون عربية طبيعية وتحافظ على صلة العبارة بتكرار μακροθυμ-. كما عُدّلت الحاشية لتبيّن حذف لفظ المطر من اليونانية من غير تقديم إسناد الثمر بوصفه احتمالًا مكافئًا للإسناد النحوي الأرجح إلى الفلّاح.
