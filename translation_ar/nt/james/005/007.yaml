  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: ar
  text: فاصبروا، إذن، أيها الإخوة[a]، إلى مجيء الرب[b]. هوذا الفلّاح ينتظر ثمر الأرض الثمين، ويصبر من أجله إلى أن ينال المطر المبكر والمتأخر[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أيها الإخوة والأخوات»؛ فاللفظ اليوناني يقول «الإخوة»، وكثيرًا ما يخاطب به جماعة المؤمنين كلها.'
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا ترجمة «مجيء» بـ«حضور»؛ لكن السياق هنا يرجّح الإشارة إلى وصول الرب المنتظر.
    reason: lexical_alternative
  - marker: c
    text: لا يذكر النص اليوناني لفظ «المطر» صراحة، لكنه مفهوم من وصفي «المبكر» و«المتأخر». والفاعل المفهوم لـ«ينال» هو الفلّاح.
    reason: source_ambiguity
lexical_decisions:
- source_word: Μακροθυμήσατε / μακροθυμῶν
  choice: اصبروا / صابرًا
  rationale: يحافظ على تكرار جذر الصبر في الأمر ووصف الفلّاح، وينقل معنى طول الأناة بلغة عربية طبيعية.
- source_word: οὖν
  choice: إذن
  rationale: تُظهر النتيجة المترتبة على السياق السابق بوضوح وإيجاز.
- source_word: ἀδελφοί
  choice: يا إخوتي
  rationale: يحافظ على صيغة النداء المذكرة في اليونانية، مع بيان شمول الخطاب للجماعة المؤمنة في الحاشية.
- source_word: παρουσίας
  choice: مجيء
  rationale: في هذا السياق الأخروي يدل اللفظ طبيعيًا على مجيء الرب المنتظر، مع بقاء معنى الحضور ممكنًا معجميًا.
- source_word: ἰδοὺ
  choice: هوذا
  rationale: يحفظ قوة التنبيه في النص بأسلوب عربي فصيح مألوف في السرد الكتابي.
- source_word: γεωργὸς
  choice: الفلّاح
  rationale: مقابل عربي واضح وطبيعي للعامل الذي يزرع الأرض وينتظر محصولها.
- source_word: ἐκδέχεται
  choice: ينتظر
  rationale: ينقل معنى الترقب المستمر المتصل بموضوع الصبر.
- source_word: τίμιον καρπὸν τῆς γῆς
  choice: ثمر الأرض الثمين
  rationale: يحفظ صورة الثمر وقيمته من غير تضييقها إلى محصول بعينه.
- source_word: ἐπ’ αὐτῷ
  choice: عليه
  rationale: يعود الضمير على ثمر الأرض، وتعبير «صابرًا عليه» موجز ومفهوم في العربية.
- source_word: πρόϊμον καὶ ὄψιμον
  choice: المطر المبكر والمتأخر
  rationale: الموصوف «المطر» مفهوم من السياق الزراعي ومحذوف في اليونانية، وإظهاره ضروري لوضوح العربية.
- source_word: λάβῃ
  choice: ينال
  rationale: الفعل المفرد بلا فاعل مصرح به؛ وصيغة العربية المذكرة تُبقي إمكان عوده إلى الفلّاح أو الثمر بدل حسم الالتباس.
theological_decisions:
- issue: الخطاب بصيغة ἀδελφοί
  choice: يا إخوتي
  alternative: أيها الإخوة والأخوات
  rationale: أُبقيت الصيغة النحوية المذكرة في المتن، مع توضيح الاستعمال الجامع للجماعة المؤمنة في الحاشية.
- issue: παρουσία τοῦ κυρίου
  choice: مجيء الرب
  alternative: حضور الرب
  rationale: «مجيء» أنسب للسياق الذي يحث على الصبر إلى وصول الرب مستقبلًا، من غير فرض تفصيل مذهبي إضافي.
- issue: فاعل λάβῃ
  choice: صياغة تحتمل عود الفاعل إلى الفلّاح أو الثمر
  alternative: حتى يتلقى الثمر المطر المبكر والمتأخر
  rationale: اليونانية لا تصرّح بالفاعل، والصياغة المختارة تصون هذا القدر من الالتباس بدل حسمه بلا ضرورة.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة وقورة. استُخدم «هوذا» للمحافظة على أداة التنبيه، وتُرك تركيب «حتى ينال» محتمل الإسناد حفاظًا على غموض النص اليوناني الحقيقي.
