  naturalness: «صابرًا عليه» ممكنة، لكنها أقل سلاسة وقد توحي بالصبر على الثمر لا بالصبر انتظارًا له. «ويصبر من أجله» أوضح وأقرب إلى الاستعمال العربي الحديث، مع حفظ تكرار معنى الصبر.
  terminology: «مجيء الرب»، و«الفلّاح»، و«ثمر الأرض الثمين»، و«المطر المبكر والمتأخر» مقابلات مناسبة. واستعمال «أيها الإخوة» يحفظ النداء المذكر دون إضافة معنى الملكية.
