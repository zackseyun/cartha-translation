    rationale: مع أن الضمير/الفاعل غير مذكور لفظًا في الجملة التابعة، فالفاعل المستتر يُفهم نحويًا على الأرجح من «الفلّاح» بوصفه فاعل «ينتظر» والمشارك «صابرًا». ولا يلزم إبقاء هذا الاحتمال الضعيف في الحاشية.
