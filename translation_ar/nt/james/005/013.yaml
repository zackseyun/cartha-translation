  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: ar
  text: هل يعاني أحدٌ بينكم؟ فليصلِّ. هل أحدٌ مبتهج؟ فليرنّم تسبيحًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «فليرنّم بالمزامير»؛ فقد يدل الفعل اليوناني، على نحو أخص، على ترنيم المزامير، أو على نحو أوسع على إنشاد التسبيح.
    reason: بديل معجمي
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: يعاني
  rationale: يفيد الفعل اختبار المشقة أو المعاناة عمومًا، وهذه الصياغة العربية طبيعية ولا تحصر المعنى في المرض أو الاضطهاد.
- source_word: τις
  choice: أحد
  rationale: ينقل ضمير النكرة المفرد ذا الدلالة العامة بعبارة عربية موجزة وطبيعية.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: يحدد أن الشخص المفترض واحد من الجماعة المخاطبة، وهو المقابل العربي المباشر والطبيعي.
- source_word: προσευχέσθω
  choice: فليصلِّ
  rationale: يحفظ قوة الأمر في صيغة المفرد، وتفيد الفاء الاستجابة المناسبة للحالة المذكورة.
- source_word: εὐθυμεῖ
  choice: مبتهج
  rationale: ينقل معنى طيب النفس أو حسن المعنويات بلفظ عربي واضح يلائم المقابلة مع المعاناة.
- source_word: ψαλλέτω
  choice: فليرنّم بالتسبيح
  rationale: ينقل فعل الترنيم الموجَّه إلى الله بوضوح، مع إبقاء احتمال الإشارة الأخص إلى ترنيم المزامير في الحاشية.
theological_decisions:
- issue: صيغة المفرد في الوصيتين العامتين
  choice: 'الحفاظ على المفرد: «أحد... فليصلِّ» و«أحد... فليرنّم»'
  alternative: استخدام صيغة الجمع العامة
  rationale: النص اليوناني يستعمل ضمير نكرة وأمرين بصيغة المفرد؛ والعربية تستطيع حفظ المفرد مع بقاء الدلالة شاملة لكل فرد دون تخصيصها بالذكور.
- issue: دلالة ψαλλέτω
  choice: فليرنّم بالتسبيح
  alternative: فليرنّم بالمزامير
  rationale: المعنى الأوسع، وهو الترنيم بحمد الله، مناسب للسياق ولا يفرض قصر الوصية على المزامير، مع التصريح بالاحتمال الأضيق في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموجزة وذات نبرة إرشادية كريمة. استُخدم الاستفهام المباشر والتوازي بين الجملتين للمحافظة على إيقاع الأصل.
