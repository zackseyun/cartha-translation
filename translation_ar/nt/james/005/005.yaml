id: JAS.5.5
reference: James 5:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: ar
  text: عِشْتُمْ في الترف على الأرض، وانغمستم في الملذات[a][b]؛ وسَمَّنْتُمْ قلوبكم في يوم الذبح[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عِشْتُمْ في النعيم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عِشْتُمْ في الانغماس وإرضاء الشهوات» بدل «انغمستم في الملذات».'
    reason: lexical_alternative
  - marker: c
    text: تستحضر العبارة صورة حيوانات تُسمَّن قبل ذبحها، ويُرجَّح أنها تلمّح إلى دينونة وشيكة.
    reason: cultural_note
  - marker: d
    text: 'أو: «ليوم الذبح».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: عِشْتُمْ في الترف
  rationale: ينقل معنى العيش المترف المنغمس في النعمة واللذة، ويحافظ على نبرة التوبيخ من غير استعمال تعبير قديم أو غامض.
- source_word: ἐπὶ τῆς γῆς
  choice: على الأرض
  rationale: ترجمة مباشرة وطبيعية للمعنى الأوسع لكلمة γῆ في سياق إدانة الترف الدنيوي.
- source_word: ἐσπαταλήσατε
  choice: انغمستم في الملذات
  rationale: يفيد الإفراط في إرضاء الشهوات والعيش المنغمس في اللذة، ويقوّي الفعل السابق كما في اليونانية.
- source_word: ἐθρέψατε
  choice: سَمَّنْتُمْ
  rationale: مع أن الفعل قد يعني غذّى أو أطعم، فإن صورة الذبح اللاحقة ترجّح هنا معنى التسمين، بما يستحضر تسمين الحيوان قبل ذبحه.
- source_word: τὰς καρδίας ὑμῶν
  choice: قلوبكم
  rationale: يحفظ الصورة الكتابية وقوتها البلاغية بدل تحويلها إلى شرح مثل «ذواتكم من الداخل».
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: في يوم الذبح
  rationale: يحافظ على حرف الجر ἐν وعلى الصورة الصادمة، من غير أن يحسم هل المقصود يومًا حاضرًا موصوفًا بالذبح أم التهيؤ ليوم آتٍ.
theological_decisions:
- issue: الدلالة المجازية لعبارة «يوم الذبح»
  choice: إبقاء صورة الذبح بما توحي به من دينونة وشيكة من غير التصريح بمرجعها في المتن.
  alternative: التصريح بأنها «يوم دينونة الله»، أو فهمها إشارة مباشرة إلى ذبح الأبرياء في السياق.
  rationale: تلمّح الصورة بقوة إلى الدينونة، لكن النص اليوناني لا يصرّح بذلك؛ لذلك تُحفظ الصورة والتوتر الدلالي من غير زيادة تفسيرية.
- issue: العلاقة الزمنية أو الغائية في ἐν ἡμέρᾳ σφαγῆς
  choice: «في يوم الذبح»
  alternative: «ليوم الذبح»
  rationale: المعنى الغائي ممكن في ضوء صورة تسمين الحيوان، لكن ἐν يدل مباشرة على الظرفية؛ فأُبقيت في المتن، ووُضع البديل التفسيري في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة وحادة تناسب التوبيخ النبوي. استُعمل «الترف» و«انغمستم في الملذات» لتجنب الألفاظ المهجورة، وحُفظت الصورة الحسية في «سمّنتم قلوبكم» و«يوم الذبح». وُضعت العلامات [a] و[b] عند العبارة التي تتناولها البدائل المعجمية، و[c] و[d] عند صورة الذبح وقراءتها البديلة.
