id: JAS.5.11
reference: James 5:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: ar
  text: ها إننا نعدّ الذين صبروا مطوَّبين. قد سمعتم بصبر أيوب، ورأيتم عاقبة الرب، وأن الرب كثير التحنّن ورحيم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρίζομεν
  choice: نعدّ ... مطوَّبين
  rationale: يحافظ على معنى إعلانهم سعداء أو ذوي غبطة، بصياغة عربية كتابية مفهومة من غير تحويل الفعل إلى مجرد شعور بالسعادة.
- source_word: ὑπομείναντας / ὑπομονήν
  choice: الذين صبروا / صبر
  rationale: ينقل الثبات والاحتمال تحت الشدة، ويُبقي الصلة اللفظية بين الجماعة وأيوب.
- source_word: τέλος κυρίου
  choice: عاقبة الرب
  rationale: لفظ τέλος هنا يمكن أن يدل على النهاية أو النتيجة أو المآل؛ «عاقبة» تحفظ هذا الاتساع وتناسب ما أظهره الرب في ختام محنة أيوب، من غير حصره في «قصد» فقط.
- source_word: πολύσπλαγχνος
  choice: كثير التحنّن
  rationale: ينقل قوة اللفظ المركب الدال على وفرة الشفقة العميقة، مع تمييزه نسبيًا عن οἰκτίρμων.
- source_word: οἰκτίρμων
  choice: رحيم
  rationale: المقابل العربي الطبيعي المباشر للرحمة والإشفاق.
theological_decisions:
- issue: دلالة «عاقبة الرب» (τὸ τέλος κυρίου)
  choice: عاقبة الرب
  alternative: غاية الرب / قصد الرب / ما آل إليه أمر الرب
  rationale: التركيب يحتمل ما أحدثه الرب في النهاية أو النتيجة التي جاء بها، وربما الغاية؛ لذلك اختير تعبير لا يحسمه في القصد الإلهي وحده ولا يجعله إشارة إلى نهاية حياة الرب.
- issue: مرجع الرب في العبارة الختامية
  choice: الرب
  alternative: يهوه
  rationale: النص اليوناني يكرر κύριος بلا اقتباس صريح، و«الرب» يحافظ على الصياغة المصدرية وعلى احتمال الإحالة إلى إله إسرائيل في قصة أيوب.
translation_notes:
  register: عربية فصحى حديثة ذات نبرة كتابية كريمة. استُعمل «ها إننا» مقابل ἰδού لإبراز الالتفات من غير ثقل «هوذا»، وحُفظ تكرار «الرب» والتوازي بين الصبر والرحمة.
