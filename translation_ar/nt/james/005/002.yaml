  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῦτος
  choice: ثروتكم
  rationale: «الثروة» لفظ عربي معاصر وطبيعي يدل على الأموال والممتلكات المتراكمة، ويلائم توبيخ الأغنياء في السياق.
- source_word: σέσηπεν
  choice: قد تعفنت
  rationale: ينقل الفعل بصيغة الماضي مع «قد» معنى الحالة الحاضرة الناتجة عن التعفن، ويحافظ على الصورة الحسية القوية.
- source_word: ἱμάτια
  choice: ثيابكم
  rationale: «الثياب» لفظ فصيح واضح وشائع يشمل قطع الملابس عمومًا، من غير تخصيصها بأردية معينة.
- source_word: σητόβρωτα
  choice: أكلها العث
  rationale: تعبير عربي طبيعي يحفظ الصورة المادية الدقيقة للثياب التي التهمها العث، وهو أوضح للقارئ العام من تركيب وصفي مصطنع.
- source_word: γέγονεν
  choice: قد أكلها
  rationale: يفيد التركيب مع «قد» حصول الفعل وبقاء نتيجته، وإن كانت العربية تعبّر عن الوصف المركب والفعل الرابط اليونانيين بجملة فعلية واحدة طبيعية.
