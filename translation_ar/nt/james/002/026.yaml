id: JAS.2.26
reference: James 2:26
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: ar
  text: فكما أن الجسد بلا روح[a] ميت، كذلك أيضًا الإيمان[b] بلا أعمال ميت.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «نَفَس». يمكن أن تعني الكلمة اليونانية «روحًا» أو «نَفَسًا».
    reason: lexical_alternative
  - marker: b
    text: أو «الأمانة». يمكن أن تدل الكلمة اليونانية أيضًا على الثقة أو الأمانة؛ ويتبع المتن هنا الترجمة المعتادة «الإيمان».
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: فكما أن
  rationale: تؤدي الفاء وظيفة الرابط التفسيري الذي يحمله γὰρ، وتفتتح «كما أن» طرف التشبيه الأول بعبارة عربية طبيعية وواضحة.
- source_word: τὸ σῶμα
  choice: الجسد
  rationale: المقابل العربي المباشر للجسد المادي في هذا التشبيه.
- source_word: χωρὶς πνεύματος
  choice: بلا روح
  rationale: تفيد «بلا» معنى الانفصال أو الافتقار في χωρίς، وتحافظ «روح» على الدلالة الأساسية لـπνεῦμα، مع إثبات احتمال «نَفَس» في الحاشية.
- source_word: νεκρόν ἐστιν
  choice: ميت
  rationale: خبر مباشر يحافظ على قوة وصف الموت، ولا تستلزم العربية هنا إظهار فعل الكينونة في الزمن الحاضر.
- source_word: οὕτως καὶ
  choice: كذلك أيضًا
  rationale: تحافظ على المقابلة بين طرفي التشبيه وعلى دلالة καὶ الإضافية أو التوكيدية.
- source_word: ἡ πίστις
  choice: الإيمان
  rationale: هو المقابل المعتاد لـπίστις في هذا السياق، مع إبقاء احتمال «الأمانة» في الحاشية دون حسم الجدل الدلالي داخل المتن.
- source_word: χωρὶς ἔργων
  choice: بلا أعمال
  rationale: ترجمة مباشرة تحفظ الصلة اللفظية والحجاجية بحديث يعقوب عن الأعمال.
- source_word: νεκρά ἐστιν
  choice: ميت
  rationale: يكرر اللفظ نفسه الوارد في طرف التشبيه الأول، محافظًا على التوازي والقوة البلاغية.
theological_decisions:
- issue: دلالة πνεύματος في تشبيه الجسد
  choice: روح
  alternative: نَفَس
  rationale: «روح» تحفظ المجال الدلالي الأوسع للفظ اليوناني وصورة المبدأ المحيي، بينما يظل «نَفَس» احتمالًا معجميًا مناسبًا لصورة الجسد الذي فارقته الحياة، ولذلك ذُكر في الحاشية.
- issue: دلالة πίστις في يعقوب 2:26
  choice: الإيمان
  alternative: الأمانة
  rationale: اختير «الإيمان» بوصفه المقابل الافتراضي والأوضح في سياق الحجة، مع عدم إلغاء إمكان دلالة اللفظ على الأمانة؛ أُبقي البديل في الحاشية حفاظًا على التوتر الدلالي واللاهوتي.
translation_notes:
  register: 'عربية فصحى معاصرة واضحة وموقرة. استُخدم تركيب اسمي موجز يحاكي التوازي في الأصل: «الجسد... ميت / الإيمان... ميت»، مع إبقاء الروابط المنطقية ظاهرة من غير تكلّف.'
