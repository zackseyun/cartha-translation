id: JAS.2.8
reference: James 2:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: ar
  text: 'ولكن إن كنتم تتمّمون الناموس الملوكي[a] بحسب ما يقول الكتاب: «أحبب قريبك كنفسك»، فأنتم تفعلون حسنًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «الناموس الذي للملك»، وربما «ناموس الملكوت». يقول اليوناني حرفيًا: «الناموس الملوكي»، وقد يشير الوصف إلى مصدره الملوكي أو إلى منزلته السامية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: ولكن إن كنتم
  rationale: ينقل أداة الشرط εἰ مع نبرة الاستدراك أو التقييد في μέντοι، بعبارة عربية واضحة وطبيعية.
- source_word: νόμον ... βασιλικὸν
  choice: الناموس الملوكي
  rationale: يحافظ «الملوكي» على الدلالة المباشرة للصفة βασιλικός من غير حصرها في مصدر الناموس أو منزلته أو صلته بالملكوت.
- source_word: τελεῖτε
  choice: تتمّمون
  rationale: ينقل معنى تنفيذ المطلوب وإتمامه، ويحافظ على صيغة الحاضر في اليونانية.
- source_word: κατὰ τὴν γραφήν
  choice: بحسب ما يقول الكتاب
  rationale: يعبّر طبيعيًا عن موافقة الفعل لما يقوله نص الكتاب، مع الحفاظ على المفرد المعرّف γραφή.
- source_word: Ἀγαπήσεις
  choice: أحبب
  rationale: الفعل اليوناني مستقبل ذو قوة أمر في الاقتباس الكتابي؛ وصيغة الأمر العربية تنقل الوظيفة الإلزامية بوضوح.
- source_word: τὸν πλησίον σου
  choice: قريبك
  rationale: «القريب» هو المقابل الكتابي العربي المألوف للجار أو الإنسان القريب في المعنى الأخلاقي المقصود.
- source_word: ὡς σεαυτόν
  choice: كنفسك
  rationale: يحافظ على إيجاز المقارنة اليونانية من غير إضافة فعل غير مذكور.
- source_word: καλῶς ποιεῖτε
  choice: فأنتم تفعلون حسنًا
  rationale: ينقل الاستحسان الأخلاقي في العبارة ويحافظ على دلالة الحاضر.
theological_decisions:
- issue: معنى «الناموس الملوكي»
  choice: الإبقاء على الوصف «الملوكي» من دون تفسيره داخل المتن
  alternative: الناموس الذي للملك؛ الناموس الأسمى؛ ناموس الملكوت
  rationale: تسمح الصفة βασιλικός بفهم العبارة من جهة مصدر الناموس الملوكي أو منزلته العليا أو صلته بالملكوت؛ لذلك يحفظ المتن هذا الاتساع، وتعرض الحاشية أبرز الاحتمالات.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «الناموس» للمصطلح νόμος و«الكتاب» للمفرد γραφή، مع تجنب تفسير الوصف «الملوكي» تفسيرًا مذهبيًا داخل المتن.
