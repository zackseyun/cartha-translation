  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: ar
  text: ولكن هل تريد أن تعرف، يا أيها الإنسان الفارغ[a]، أن الإيمان من دون أعمال عديم الجدوى[b]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يا أيها الإنسان الفارغ». ويمكن أن يفيد التعبير أيضًا: «يا أيها الإنسان الجاهل» أو «الباطل».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عاطل» أو «غير فعّال». يدل اللفظ اليوناني على ما هو خامل أو غير منتج.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: ولكن هل تريد أن تعرف
  rationale: تنقل «θέλεις» معنى الإرادة بصيغة سؤال طبيعية، وتحمل «δέ» على الاستدراك بـ«ولكن»، وتترجم «γνῶναι» ترجمة مباشرة بـ«تعرف».
- source_word: ὦ ἄνθρωπε κενέ
  choice: يا أيها الإنسان الفارغ
  rationale: تحافظ على النداء المفرد المذكر في «ἄνθρωπε»، وعلى الصورة الأصلية في «κενέ» بمعنى الفارغ أو الخالي من المضمون، من غير حصرها في تفسير «الجاهل».
- source_word: ὅτι
  choice: أن
  rationale: تُدخل مضمون ما يُراد من المخاطَب أن يعرفه.
- source_word: ἡ πίστις
  choice: الإيمان
  rationale: هو المقابل العربي المألوف والأقل تحميلًا بتفسير إضافي في سياق رسالة يعقوب.
- source_word: χωρὶς τῶν ἔργων
  choice: من دون أعمال
  rationale: تنقل معنى الانفصال أو الافتقار الذي تدل عليه «χωρίς» مع المضاف إليه، وتحافظ على «الأعمال» بوصفها اللفظ المحوري في الحجة.
- source_word: ἀργή ἐστιν
  choice: عديم الجدوى
  rationale: تعبر بوضوح في العربية المعاصرة عن كون الإيمان بلا أعمال غير منتج ولا فعّال، مع إثبات المعاني الأقرب حرفيًا في الحاشية.
theological_decisions:
- issue: العلاقة بين الإيمان والأعمال في حجة يعقوب
  choice: وصف الإيمان من دون أعمال بأنه «عديم الجدوى» وفق لفظ هذه الآية.
  alternative: ترجمته بـ«عاطل» أو تقويته إلى «ميت».
  rationale: اللفظ هنا هو «ἀργή» الدال على الخمول أو انعدام الفاعلية، لا «νεκρά» أي «ميت». لذلك لا تُدمج صياغة هذه الآية في ألفاظ الآيات المجاورة، ولا يُفرض عليها تفسير مذهبي لاحق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. أُبقي النداء المفرد وصورة «الفارغ»، واستُخدم «عديم الجدوى» لسلامة التعبير ووضوح قوة «ἀργή» في السياق.
