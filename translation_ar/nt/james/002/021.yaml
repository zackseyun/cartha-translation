  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: ar
  text: أَلَمْ يُبَرَّرْ إبراهيمُ أبونا بالأعمال حين قدَّم ابنه إسحاق على المذبح؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يُظهَر بارًّا» أو «يُثبَت أنه بارّ». يمكن أن يدل الفعل اليوناني، بحسب السياق، على التبرير أو على إظهار البر وإثباته.
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: أبونا
  rationale: يحفظ الاستعارة العائلية ولغة الهوية العهدية في صياغة عربية طبيعية وموجزة، بدل تسطيحها إلى «سلفنا».
- source_word: ἐξ ἔργων
  choice: بالأعمال
  rationale: الباء العربية تؤدي هنا معنى الوسيلة أو الأساس بصورة مألوفة، وتحفظ العبارة اللاهوتية المحورية في السياق.
- source_word: ἐδικαιώθη
  choice: يُبَرَّرْ
  rationale: يحفظ الصلة اللفظية بمبحث التبرير والتوتر الدلالي في النص، من غير حصر الفعل في معنى إعلاني أو إظهاري واحد.
- source_word: ἀνενέγκας
  choice: حين قدَّم
  rationale: يؤدي اسم الفاعل الماضي بقوة زمنية طبيعية، ويحفظ في السياق معنى تقديم الذبيحة.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: ابنه
  rationale: صياغة عربية طبيعية واضحة تحافظ على علاقة البنوة المذكورة في اليونانية.
- source_word: θυσιαστήριον
  choice: المذبح
  rationale: المقابل العربي القياسي الواضح لمذبح الذبيحة.
- source_word: οὐκ ... ἐδικαιώθη;
  choice: أَلَمْ يُبَرَّرْ ...؟
  rationale: يحفظ السؤال الإنكاري اليوناني الذي يتوقع جوابًا بالإيجاب، في تركيب عربي فصيح وطبيعي.
theological_decisions:
- issue: دلالة δικαιόω في يعقوب 2:21 وعلاقتها بالأعمال
  choice: يُبَرَّرْ
  alternative: يُظهَر بارًّا؛ تثبت براءته؛ يُعلَن بارًّا
  rationale: اختيار «يُبَرَّرْ» يحفظ الرابط المعجمي مع نقاش التبرير ولا يحسم التوتر اللاهوتي لصالح معنى إظهاري محض أو قضائي محض؛ وتُذكر أبرز الاحتمالات في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «أبونا» للمحافظة على البعد العائلي والعهدي، و«حين قدَّم» لسلاسة نقل اسم الفاعل اليوناني، مع إبقاء مصطلح «يُبَرَّرْ» في المتن وصون اتساعه الدلالي بالحاشية.
