source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: ar
  text: ما الفائدة، يا إخوتي[a]، إن قال أحد إن له إيمانًا[b]، ولكن ليست له أعمال؟ أيقدر ذلك الإيمان أن يخلّصه[c]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «يا إخوتي وأخواتي». يستعمل اليوناني جمع المذكر «إخوة» صيغةَ خطاب تمثّل جماعة المؤمنين.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تدل الكلمة اليونانية πίστις أيضًا على «الثقة»، وفي بعض السياقات على «الأمانة»؛ أما هنا فـ«الإيمان» أنسب، لأن الكلام عن إيمان يقول الشخص إن له إياه.
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «أيقدر إيمان كهذا أن يخلّصه؟» يقول اليوناني حرفيًا «الإيمان»، مشيرًا إلى الإيمان المذكور آنفًا، أي الإيمان الذي يقال بوجوده من دون أعمال.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: ما الفائدة
  rationale: صياغة عربية طبيعية للسؤال البلاغي، وتحفظ معنى النفع العملي.
- source_word: ἀδελφοί μου
  choice: يا إخوتي
  rationale: تحفظ صيغة النداء وجمع المذكر في الأصل، وهي تُستعمل هنا خطابًا لجماعة المؤمنين.
- source_word: πίστιν
  choice: إيمانًا
  rationale: «إيمان» هو المقابل الأنسب في سياق ادعاء امتلاك الإيمان، مع إمكان معنى الثقة في سياقات أخرى.
- source_word: λέγῃ τις ἔχειν
  choice: إن قال أحد إن له
  rationale: قريبة من تركيب الأصل، ولا تزيد عليه لفظ «يدّعي» التفسيري.
- source_word: ἔργα
  choice: أعمال
  rationale: تحفظ المصطلح وصلته بحجة يعقوب المحيطة بشأن الإيمان والأعمال.
- source_word: μὴ ἔχῃ
  choice: ليست له
  rationale: تنقل نفي الامتلاك بعبارة عربية واضحة وطبيعية.
- source_word: μὴ δύναται
  choice: أيقدر ...؟
  rationale: تحفظ السؤال البلاغي الذي يتوقع جوابًا بالنفي من غير تحويله إلى تقرير صريح.
- source_word: ἡ πίστις
  choice: ذلك الإيمان
  rationale: تنقل القوة الإحالية لأداة التعريف اليونانية إلى الإيمان المذكور للتو، أي الإيمان المقول بوجوده من دون أعمال.
- source_word: σῶσαι αὐτόν
  choice: أن يخلّصه
  rationale: «يخلّص» المقابل المألوف الذي يحفظ الثقل اللاهوتي للفعل في هذا السياق.
theological_decisions:
- issue: علاقة الإيمان بالأعمال في السؤال البلاغي
  choice: ذلك الإيمان
  alternative: الإيمان؛ أو إيمان كهذا
  rationale: تشير أداة التعريف في ἡ πίστις إلى الإيمان الموصوف قبلها، من غير جعل العبارة نفيًا عامًا لقدرة الإيمان على الخلاص، ومن غير حسم التوتر اللاهوتي بما يتجاوز النص.
- issue: صيغة الخطاب المذكرة ودلالتها
  choice: يا إخوتي
  alternative: يا إخوتي وأخواتي
  rationale: تحفظ صيغة جمع المذكر في اليونانية، مع بيان أن الخطاب يمكن أن يشمل جماعة المؤمنين كلها.
- issue: مرجع الضمير في الخلاص
  choice: يخلّصه
  alternative: يخلّص ذلك الشخص
  rationale: يحفظ ضمير المفرد المذكر الوارد في الأصل بوصفه عائدًا إلى الشخص المفترض في السؤال.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «ذلك الإيمان» لإظهار الإحالة إلى النوع المذكور من الإيمان، مع إبقاء السؤال البلاغي وتوقعه جوابًا بالنفي من غير التصريح بالجواب.
