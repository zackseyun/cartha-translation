  terminology: «لا تزنِ» مناسبة للاقتباس الوصائي المألوف وتحافظ على المقصود في السياق. واستُبدلت ترجمة φονεύω بـ«ترتكب جريمة قتل» للدقة. «الشريعة» مناسبة لـ νόμος في هذا السياق.
