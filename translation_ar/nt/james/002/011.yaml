id: JAS.2.11
reference: James 2:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: ar
  text: 'لأن الذي قال: «لا تزنِ»، قال أيضًا: «لا ترتكب جريمة قتل». فإن كنت لا تزني ولكنك ترتكب جريمة قتل، فقد صرت مخالفًا للشريعة.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: الذي قال
  rationale: اسم موصول مع فعل يحاكي عمل اسم الفاعل المعرّف في اليونانية، ويحفظ الإشارة الشخصية إلى قائل الوصيتين من غير إضافة اسم «الله» إلى المتن.
- source_word: Μὴ μοιχεύσῃς
  choice: لا تزنِ
  rationale: صيغة نهي عربية واضحة وموجزة، وتوافق الصياغة المألوفة للوصية مع نقل معنى μοιχεύω المتعلق بالزنى.
- source_word: καί
  choice: أيضًا
  rationale: تبيّن أن القائل نفسه أصدر الوصية الثانية كذلك، وهو محور الحجة.
- source_word: Μὴ φονεύσῃς
  choice: لا تقتل
  rationale: الصياغة العربية المألوفة لوصية القتل؛ والسياق الوصائي يدل على القتل المحرّم، لا على كل إزهاق للنفس بلا تمييز.
- source_word: εἰ δὲ
  choice: فإن كنت
  rationale: تنقل الانتقال إلى الحالة الشرطية وتربطها طبيعيًا بالتعليل السابق.
- source_word: οὐ μοιχεύεις ... φονεύεις δέ
  choice: لا تزني، ولكنك تقتل
  rationale: المضارع مناسب للمثال العام، و«لكن» تحفظ التضاد الذي تؤديه δέ.
- source_word: γέγονας
  choice: فقد صرت
  rationale: «صار» مع «قد» ينقل دلالة التغيّر والحالة الناتجة في صيغة اليونانية التامة، بدل الاكتفاء بقول «أنت».
- source_word: παραβάτης νόμου
  choice: متعديًا على الشريعة
  rationale: «متعدٍّ» يدل على تجاوز الحد أو الوصية، و«الشريعة» تحافظ على السجل القانوني الأخلاقي وعلى وحدة الناموس في حجة يعقوب.
- source_word: νόμου
  choice: الشريعة
  rationale: التعريف مناسب للإشارة إلى شريعة الله المعروفة التي تنتمي إليها الوصيتان المذكورتان.
theological_decisions:
- issue: هوية قائل الوصيتين
  choice: الإبقاء على «الذي قال» دون التصريح باسم الله
  alternative: لأن الله الذي قال...
  rationale: السياق يفيد أن الله هو القائل، لكن اليونانية تستخدم اسم فاعل معرفًا ولا تذكر اسم الله صراحة؛ لذلك يحفظ النص دقة العبارة من غير توسع تفسيري.
- issue: نطاق التعدي على الشريعة
  choice: «متعديًا على الشريعة»
  alternative: متعديًا على تلك الوصية
  rationale: العبارة اليونانية تشير إلى الشريعة، لا إلى الوصية المفردة وحدها، فتحفظ الترجمة قوة الحجة القائلة إن خرق وصية يجعل المرء متعديًا على الشريعة.
- issue: دلالة وصية Μὴ φονεύσῃς
  choice: «لا تقتل» بصفتها الصياغة الوصائية العربية المألوفة
  alternative: لا ترتكب جريمة قتل
  rationale: الفعل اليوناني يدل على القتل الإجرامي، لكن الصياغة المختصرة «لا تقتل» أليق باقتباس الوصية في العربية؛ ولا ينبغي فهمها هنا تعميمًا على كل صور إزهاق النفس.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم «الشريعة» بدل «الناموس» لسهولة الفهم العام، مع الحفاظ على الصلة القانونية والأخلاقية. لا توجد حواشٍ، ولذلك لا توجد علامات حواشٍ في المتن.
