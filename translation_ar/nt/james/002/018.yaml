  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: ar
  text: 'لكن سيقول قائل[d]: «لك إيمان، ولي أعمال». أرني إيمانك[c] بمعزل عن الأعمال[a]، وأنا سأريك إيماني بأعمالي[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من دون أعمال». تفيد العبارة اليونانية الانفصال عن الأعمال أو غيابها.'
    reason: lexical_alternative
  - marker: b
    text: 'حرف الجر اليوناني قد يفيد المصدر أو الوسيلة؛ ولذلك يمكن أيضًا ترجمتها ترجمة حرفية: «من أعمالي». والمعنى في السياق أن الأعمال تُظهر الإيمان.'
    reason: lexical_alternative
  - marker: c
    text: اليونانية pistis؛ ويمكن أن تعني أيضًا «الثقة»، وفي بعض السياقات «الأمانة».
    reason: alternative_reading
  - marker: d
    text: لا تحسم المخطوطات اليونانية القديمة بعلامات اقتباس أين ينتهي كلام القائل المفترض ويبدأ الرد؛ لذلك يمكن ترقيم الحوار على نحو آخر.
    reason: discourse_ambiguity
lexical_decisions:
- source_word: Ἀλλ’
  choice: لكن
  rationale: تفيد الاستدراك والانتقال إلى اعتراض مفترض، وهي صياغة عربية موجزة وطبيعية.
- source_word: ἐρεῖ τις
  choice: سيقول قائل
  rationale: تحافظ على صيغة المستقبل وعلى أسلوب المحاورة الجدلية الذي يُدخل متكلمًا مفترضًا.
- source_word: πίστιν / πίστιν
  choice: إيمان / إيماني
  rationale: «إيمان» هو المقابل العربي المألوف هنا، ويحفظ التوتر بين ادعاء الإيمان وظهوره في الأعمال من غير حسمه بمعنى «الأمانة» أو «الثقة».
- source_word: ἔργα / ἔργων
  choice: أعمال
  rationale: تحافظ على المصطلح المحوري المتكرر في حجة يعقوب وعلى صلته بالسياق القريب.
- source_word: δεῖξόν μοι
  choice: أرني
  rationale: أمر مباشر وطبيعي يعبّر عن طلب إظهار الإيمان إظهارًا ملموسًا، من غير إضافة معنى «الإثبات» صراحة.
- source_word: χωρὶς τῶν ἔργων
  choice: بمعزل عن الأعمال
  rationale: تنقل معنى الانفصال أو الغياب، وتحافظ على المقابلة مع إظهار الإيمان بالأعمال.
- source_word: κἀγώ σοι δείξω
  choice: وأنا سأريك
  rationale: إبراز الضمير «أنا» يعكس توكيد κἀγώ ويحافظ على التوازي الجدلي.
- source_word: ἐκ τῶν ἔργων μου
  choice: بأعمالي
  rationale: صياغة عربية طبيعية تفيد أن الأعمال وسيلة إظهار الإيمان أو دليله، مع توثيق احتمال دلالة المصدر في الحاشية.
theological_decisions:
- issue: دلالة πίστις في جدال الإيمان والأعمال
  choice: إيمان
  alternative: ثقة؛ أمانة
  rationale: اختيار «إيمان» يحفظ المصطلح اللاهوتي والسياقي المعتاد، ولا يحسم مسبقًا إن كان التركيز على التصديق أو الاتكال أو الأمانة.
- issue: حدود كلام القائل المفترض
  choice: اعتبار «لك إيمان، ولي أعمال» كلام القائل، وما بعده ردًا عليه
  alternative: مدّ كلام القائل ليشمل بقية الآية، أو وضع حدود الاقتباس على نحو آخر
  rationale: النص اليوناني القديم لا يضع علامات اقتباس تحسم انتقال المتكلم. الاختيار الرئيس شائع ويجعل التحدي اللاحق ردًا مباشرًا، مع إبقاء الغموض النصي في الحاشية.
translation_notes:
  register: العربية فصحى معاصرة واضحة وموقرة. استُعمل التركيب الموجز «لك إيمان، ولي أعمال» للمحافظة على التوازي، و«أرني» لإبقاء قوة التحدي المباشر. حُفظت المصطلحات المحورية «إيمان» و«أعمال» اتساقًا مع حجة الرسالة.
