  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: ar
  text: وكذلك أيضًا، أَلَمْ تُبَرَّر راحاب العاهرة بالأعمال[a]، إذ استقبلت المبعوثين[b] وأرسلتهما عن طريقٍ آخر؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُظهِر أنها بارة»، أو «أُعلِن أنها بارة». يقول اليوناني حرفيًا: «بُرِّرت»، وقد أُبقي هذا اللفظ من غير حسم دلالته اللاهوتية هنا.'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «المرسَلين» أو «المبعوثين». والمقصود في السياق الرجلان اللذان استقبلتهما راحاب (يشوع 2)، لا ملائكة سماويون.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: وكذلك أيضًا
  rationale: تحفظ العبارة معنى الربط والمقارنة بالمثال السابق، إبراهيم، وتضيف راحاب مثالًا ثانيًا، بصياغة عربية طبيعية.
- source_word: Ῥαὰβ
  choice: راحاب
  rationale: نقل صوتي للاسم وفق الصيغة العربية الكتابية الشائعة.
- source_word: ἡ πόρνη
  choice: البَغِيّ
  rationale: يدل اللفظ اليوناني على امرأة تمارس البغاء؛ و«البَغِيّ» لفظ عربي واضح وموجز يحفظ الدلالة الاجتماعية والأخلاقية، بخلاف «الزانية» التي قد تُفهم على معنى أوسع.
- source_word: οὐκ ... ἐδικαιώθη
  choice: أَلَمْ تُبَرَّر
  rationale: تحفظ «تُبَرَّر» الصلة اللفظية بحجة يعقوب وبمصطلح δικαιόω، من غير حسم ما إذا كان المراد إعلان البر أم إظهاره.
- source_word: ἐξ ἔργων
  choice: بالأعمال
  rationale: الباء تنقل بإيجاز معنى الوسيلة أو الأساس الذي تؤديه ἐκ في هذا السياق، وتتسق مع خطاب يعقوب عن الإيمان والأعمال.
- source_word: ὑποδεξαμένη
  choice: إذ استقبلت
  rationale: يفيد الفعل القبول والترحيب، و«إذ» تصل الفعلين بحجة السؤال من غير إثقال الصياغة.
- source_word: τοὺς ἀγγέλους
  choice: المبعوثين
  rationale: يمكن أن يعني ἄγγελος ملاكًا أو رسولًا بشريًا. والسياق يشير إلى الرجلين اللذين بعث بهما يشوع، لذلك تتجنب «المبعوثين» توهّم الملائكة أو الرسل بالمعنى الاصطلاحي.
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: وأرسلتهما من طريق أخرى
  rationale: يأتي ἐκβάλλω هنا بمعنى الإخراج أو الصرف لا الطرد العنيف، و«من طريق أخرى» تحفظ معنى الطريق المختلفة التي سلكاها.
theological_decisions:
- issue: دلالة δικαιόω في يعقوب 2:25 وعلاقتها بالإيمان والأعمال
  choice: إبقاء «تُبَرَّر» في المتن من غير تقييدها بتبرير قضائي أولي أو بإظهار البر لاحقًا.
  alternative: أُظهِر برّها؛ أُعلِن أنها بارة
  rationale: يحمل كلام يعقوب توترًا مقصودًا في حديثه عن التبرير والأعمال. وتحافظ الصياغة المختارة على المصطلح وعلى صلته بالسياق، بدل أن تحسم الخلاف اللاهوتي بعبارة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ تركيب السؤال البلاغي، واستُعمل «البَغِيّ» للدلالة الدقيقة على المومس، و«المبعوثين» لتجنب الالتباس الاصطلاحي في «الرسل» أو الفهم السماوي لكلمة «الملائكة».
