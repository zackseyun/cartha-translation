translation:
  language: ar
  text: أنت ترى أن الإيمان[a] كان يعمل مع أعماله، وبالأعمال أُكمِل الإيمان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الأمانة» أو «الثقة»؛ فاللفظة اليونانية (πίστις) قد تحمل هذه الدلالات أيضًا.
    reason: lexical_alternative
  - marker: b
