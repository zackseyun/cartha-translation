    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: أنت ترى
  rationale: يحافظ على صيغة المخاطب المفرد المباشرة وعلى الأسلوب الجدلي في كلام يعقوب، بصياغة عربية واضحة وطبيعية.
- source_word: πίστις
  choice: الإيمان
  rationale: هو المقابل العربي المألوف والأقرب في هذا السياق، مع إبقاء احتمالَي «الأمانة» و«الثقة» في الحاشية دون حسم زائد.
- source_word: συνήργει
  choice: كان يعمل مع
  rationale: تنقل الصيغة الماضية المستمرة ومعنى المشاركة الكامن في الفعل، من غير أن تضيف تفسيرًا لاهوتيًا لطبيعة العلاقة.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: مع أعماله
  rationale: يحافظ على لفظ «الأعمال» المتكرر في حجة يعقوب، ويعبّر عن علاقة المصاحبة التي يقتضيها الفعل.
- source_word: ἐκ τῶν ἔργων
  choice: بالأعمال
  rationale: الباء العربية تؤدي هنا معنى الوسيلة أو المصدر المؤثر بصورة طبيعية وموجزة.
- source_word: ἐτελειώθη
  choice: اكتمل
  rationale: ينقل بلوغ التمام أو الغاية المقصودة بلغة عربية طبيعية، ويتجنب أن يوحي بأن الإيمان كان معيبًا أخلاقيًا؛ وتُذكر الصياغة الأقرب إلى المبني للمجهول في الحاشية.
theological_decisions:
- issue: العلاقة بين الإيمان والأعمال في حجة يعقوب
  choice: إبقاء القول إن الإيمان كان يعمل مع الأعمال وإنه اكتمل بالأعمال
  alternative: أن الأعمال لا تفعل سوى إظهار الإيمان للناس، أو أنها تنضجه، أو أنها تتعاون معه بوصفها تعبيره الضروري
  rationale: النص اليوناني يصرح بالمشاركة والاكتمال، لكنه لا يقدم هنا وحده شرحًا مذهبيًا كاملًا للتبرير؛ لذلك لا تحسم الترجمة التوتر اللاهوتي لمصلحة تفسير طائفي.
- issue: دلالة πίστις في سياق لاهوتي محل نقاش
  choice: الإيمان
  alternative: الأمانة أو الثقة
  rationale: «الإيمان» أنسب لسياق يعقوب 2 ويحافظ على المصطلح المتداول، بينما توضع الدلالات المعجمية البديلة في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «الأعمال» للمحافظة على ترابط حجة يعقوب ومصطلحاتها، وجاء ترتيب الجملة قريبًا من حركة النص اليوناني من عمل الإيمان مع الأعمال إلى اكتماله بها.
