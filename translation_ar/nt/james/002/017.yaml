translation:
  language: ar
  text: وهكذا أيضًا الإيمان[a]، إن لم يكن له أعمال، فهو ميت بمفرده.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الثقة»؛ والأقل احتمالًا هنا «الأمانة». يمكن للكلمة اليونانية πίστις أن تحمل هذه المعاني، لكن «الإيمان» هو الأنسب لحجة يعقوب في هذه الآية.
    reason: بديل معجمي
lexical_decisions:
- source_word: οὕτως καὶ
  choice: وهكذا أيضًا
  rationale: تنقل أداة المقارنة والاستنتاج οὕτως مع دلالة الإضافة في καί، وتربط القول بالمثال السابق ربطًا طبيعيًا واضحًا.
- source_word: ἡ πίστις
  choice: الإيمان
  rationale: «الإيمان» هو الأنسب لسياق حجة يعقوب عن الإيمان المزعوم وعلاقته بالأعمال، مع بقاء «الثقة» و«الأمانة» احتمالين معجميين يُذكران في الحاشية.
- source_word: ἐὰν μὴ ἔχῃ
  choice: إن لم تكن له
  rationale: صياغة شرطية عربية طبيعية تحافظ على معنى عدم امتلاك الإيمان للأعمال أو اقترانه بها، من غير توسع تفسيري.
- source_word: ἔργα
  choice: أعمال
  rationale: تحافظ «أعمال» على الصلة اللفظية بسياق يعقوب 2، وتشير إلى الأفعال الظاهرة دون تضييق المعنى إلى نوع محدد منها.
- source_word: νεκρά
  choice: ميت
  rationale: يحافظ «ميت» على قوة الاستعارة الصريحة في النص اليوناني.
- source_word: καθ’ ἑαυτήν
  choice: في ذاته
  rationale: تعبّر العبارة عن الإيمان منظورًا إليه منفردًا ومنعزلًا عن الأعمال، مع تجنب إضافة حكم تفسيري غير مصرح به.
theological_decisions:
- issue: ترجمة πίστις في سياق محوري للنقاش حول الإيمان والأعمال
  choice: الإيمان
  alternative: الثقة؛ الأمانة
  rationale: يحفظ «الإيمان» التوتر اللفظي واللاهوتي في حجة يعقوب دون حسم مذهبي مسبق لطبيعة العلاقة بين الإيمان والأعمال. وتُحفظ الاحتمالات المعجمية الأخرى في الحاشية.
- issue: دلالة καθ’ ἑαυτήν على عزلة الإيمان عن الأعمال
  choice: في ذاته
  alternative: بمفرده؛ وحده
  rationale: الصياغة المختارة قريبة من اليونانية وسليمة عربيًا، وتترك للنص قوته الجدلية دون أن تستبدل العبارة بتفسير مثل «إيمان صوري» أو «إيمان غير حقيقي».
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع الحفاظ على بنية المقارنة والشرط، وعلى العبارة الحادة «ميت» من غير إدخال تفسير مذهبي.
