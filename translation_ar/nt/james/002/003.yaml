  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: ar
  text: 'وتلتفتوا إلى لابس الثوب اللامع[a] وتقولوا له: «اجلس أنت هنا في مكانٍ جيّد»، وتقولوا للرجل الفقير: «قف، أو اجلس تحت مسند قدميَّ هناك[b]»،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الثوب البهي» أو «الثوب الفاخر».'
    reason: lexical_alternative
  - marker: b
    text: 'تختلف بعض المخطوطات في موضع «هناك»؛ وفي قراءة أخرى: «قف هناك، أو اجلس تحت مسند قدميَّ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: تلتفتوا إلى
  rationale: يفيد الفعل هنا توجيه الانتباه والاعتناء بالشخص، لا مجرد رؤيته. وتحافظ الصياغة على وصف الفعل الملموس من غير أن تستبدله صراحةً بعبارة تفسيرية مثل «تحابوا» أو «تحابوا الأغنياء».
- source_word: φοροῦντα
  choice: لابس
  rationale: ترجمة مباشرة وطبيعية لاسم الفاعل الذي يدل على ارتداء الثوب.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: الثوب اللامع
  rationale: «الثوب» يحافظ على صيغة المفرد، و«اللامع» ينقل المعنى المباشر لـλαμπρός مع إبقاء احتمال دلالته على البهاء والفخامة في السياق.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: اجلس أنت هنا في مكان حسن
  rationale: يحافظ على فعل الأمر وعلى إبراز المخاطب بالضمير، ويعبّر عن كون الموضع المعروض موضعًا مفضّلًا من غير إضافة مفهوم «المقعد» غير المذكور صراحةً.
- source_word: τῷ πτωχῷ
  choice: للرجل الفقير
  rationale: الصيغة اليونانية مفرد مذكر معرّف، وتشير في المشهد إلى زائر فقير بعينه؛ لذلك حُفظ التذكير والإفراد.
- source_word: στῆθι
  choice: قف
  rationale: أمر مباشر بالوقوف، من غير زيادة تفسيرية.
- source_word: ἢ κάθου ἐκεῖ
  choice: أو اجلس هناك
  rationale: تحافظ العبارة على الأمر البديل وعلى دلالة البعد في ἐκεῖ، وفق نص SBLGNT المطبوع.
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: تحت مسند قدميَّ
  rationale: «تحت» تقابل ὑπό مع النصب وتحفظ الإهانة والمفارقة المكانية المقصودة، وإن بدت الصورة غير مألوفة؛ و«مسند قدميَّ» تعبير عربي واضح عن ὑποπόδιον.
theological_decisions:
- issue: لغة المحاباة الاجتماعية
  choice: عرض التفاوت في المعاملة من خلال الالتفات إلى الغني والكلام الموجَّه إلى كل واحد، من غير تسمية الفعل هنا صراحةً بالمحاباة.
  alternative: ترجمة ἐπιβλέψητε بعبارة تفسيرية مثل «تخصّوه بالاهتمام» أو «تحابوه».
  rationale: الآية تصوّر السلوك الذي يكشف المحاباة، بينما يصرّح السياق الأوسع بالحكم عليه؛ فالصياغة المختارة تترك الدلالة اللاهوتية تنشأ من المشهد والسياق.
- issue: تذكير πτωχῷ وإفراده
  choice: الرجل الفقير
  alternative: الشخص الفقير أو الفقير وحدها
  rationale: تحفظ الترجمة الإفراد والتذكير النحويين في مشهد شخصين محددين، من غير تعميم أو تحييد غير لازم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «مكان حسن» لإبقاء المقابلة بين الموضع المكرَّم والموضع المهين، وحُفظ التعبير الصادم «تحت مسند قدميَّ» بدل تلطيفه إلى «بجانب».
