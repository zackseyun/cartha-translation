base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: ar
  text: 'وتمَّ قولُ الكتاب الذي يقول: «صدَّق إبراهيمُ اللهَ، فحُسِبَ له برًّا[a]»، ودُعي صديقَ الله.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «حُسِبَ» بـ«عُدَّ» أو «احتُسب».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπληρώθη
  choice: تمَّ
  rationale: يحافظ على معنى بلوغ قول الكتاب تمامه، بصياغة عربية طبيعية لا تضيف تفسيرًا لكيفية هذا الإتمام.
- source_word: ἡ γραφὴ ἡ λέγουσα
  choice: قولُ الكتاب
  rationale: صياغة عربية موجزة وطبيعية لصيغة الاستشهاد، مع إبقاء «الكتاب» دالًّا على الكتاب المقدس لا على مجرد كتابة.
- source_word: Ἐπίστευσεν ... τῷ θεῷ
  choice: صدَّق إبراهيمُ اللهَ
  rationale: ينقل تركيب الفعل مع المفعول غير المباشر بمعنى أن إبراهيم صدّق الله وأخذ كلامه على محمل الثقة، بدل أن يقتصر على معنى الإيمان بوجوده.
- source_word: ἐλογίσθη αὐτῷ
  choice: حُسِبَ ذلك له
  rationale: يحفظ الصورة الحسابية والقضائية المحتملة في الفعل اليوناني، و«ذلك» يعود طبيعيًا إلى تصديق إبراهيم.
- source_word: εἰς δικαιοσύνην
  choice: برًّا
  rationale: «البر» هو المقابل العربي الراسخ والمناسب لـ δικαιοσύνη في سياق اقتباس تكوين 15:6، بخلاف «العدل» الذي لا يلائم هذا التركيب.
- source_word: φίλος θεοῦ
  choice: صديقًا لله
  rationale: ينقل المعنى العلاقي المباشر من غير استيراد إيحاءات خاصة قد يحملها اللقب الاصطلاحي «خليل الله».
- source_word: ἐκλήθη
  choice: دُعي
  rationale: يحافظ على سعة الفعل اليوناني، سواء أفاد التسمية أو الاعتراف بهذه الصفة.
theological_decisions:
- issue: علاقة إيمان إبراهيم بأعماله في حجة يعقوب
  choice: الإبقاء على أن قول الكتاب «تمَّ» من غير شرح آلية إتمامه داخل الآية
  alternative: تفسير الإتمام صراحة بأنه تبرير قائم على الأعمال أو فصله تمامًا عن الأعمال
  rationale: النص يربط اقتباس تكوين 15:6 بسياق طاعة إبراهيم، لكنه لا يحسم في هذه الجملة وحدها الجدل العقائدي الأوسع؛ لذلك تحافظ الترجمة على التوتر القائم.
- issue: دلالة δικαιοσύνη
  choice: برًّا
  alternative: عدلًا
  rationale: السياق هو احتساب إيمان إبراهيم له برًّا، لا ممارسة العدل بين الناس.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «صدَّق إبراهيمُ اللهَ» للمحافظة على كون الله متعلَّق التصديق، و«صديقًا لله» لتجنب تحويل العبارة إلى لقب اصطلاحي أضيق من اليونانية.
