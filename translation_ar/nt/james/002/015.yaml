  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: ar
  text: إن كان أخٌ أو أختٌ بلا كسوةٍ كافية[a] ويفتقر إلى قوت يومه،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عاريًا أو عارية»؛ قد تعني الكلمة اليونانية العري حرفيًا، لكنها تشير هنا على الأرجح إلى عدم كفاية اللباس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: إن كان
  rationale: تُدخل أداة الشرط اليونانية حالة افتراضية، و«إن كان» صياغة عربية طبيعية تحفظ قوتها الشرطية.
- source_word: ἀδελφὸς ἢ ἀδελφὴ
  choice: أخٌ أو أختٌ
  rationale: تنقل الزوج المذكر والمؤنث صراحة، وتحفظ لغة القرابة التي يستخدمها يعقوب.
- source_word: γυμνοὶ ὑπάρχωσιν
  choice: بلا كسوةٍ كافية
  rationale: يمكن أن تدل γυμνοί على العري حرفيًا، لكنها في سياق الفاقة تقبل معنى الافتقار إلى اللباس الكافي؛ والصياغة المختارة واضحة من غير أن تجعلهم بالضرورة عراة تمامًا.
- source_word: λειπόμενοι
  choice: محتاجَين إلى
  rationale: يدل اسم الفاعل على نقص مستمر وافتقار، و«محتاجَين إلى» تعبير عربي طبيعي يؤدي هذا المعنى.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: قوت يومهما
  rationale: تشير العبارة إلى الطعام أو القوت اللازم لذلك اليوم؛ و«قوت يومهما» يحفظ معنى الإعاشة اليومية الأساسية ويتوافق مع المثنى العربي.
theological_decisions:
- issue: نطاق عبارة ἀδελφὸς ἢ ἀδελφὴ داخل الجماعة المسيحية
  choice: الإبقاء على «أخٌ أو أختٌ» بوصفها لغة القرابة التي يستعملها يعقوب، ويرجح في السياق أنها تشير إلى مؤمن أو مؤمنة.
  alternative: توسيعها صراحة لتشمل أي إنسان محتاج.
  rationale: يحفظ النص العربي لفظ الأصل من غير تضييق عقائدي زائد أو تعميم تفسيري لا تصرح به الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُخدم المثنى في «محتاجَين» و«يومهما» مراعاةً للتركيب العربي «أخ أو أخت» بوصفه احتمالين معطوفين، مع إبقاء الجملة مفتوحة لأنها مقدمة الشرط التي يكتمل جوابها في العدد التالي.
