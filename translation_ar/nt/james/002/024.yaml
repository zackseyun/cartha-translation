  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: ar
  text: ترون أن الإنسان[b] يتبرَّر[a] بالأعمال، لا بالإيمان[c] وحده.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يُظهَر أنه بار»، أو «تثبت براءته». أُبقي تعبير يعقوب من غير حسم الجدل التفسيري بشأن صلته باستعمال بولس لفعل «برَّر».
    reason: alternative_reading
  - marker: b
    text: 'اليونانية: «إنسان»، والمقصود هنا الإنسان بوجه عام.'
    reason: cultural_note
  - marker: c
    text: ويمكن أن تأتي الكلمة اليونانية أيضًا بمعنى «الأمانة» أو «الثقة»، غير أن «الإيمان» هو ترجمتها الأساسية هنا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: ترون
  rationale: فعل مضارع مخاطب للجمع، وهو هنا تقرير مباشر لما يتبين من المثال السابق؛ و«ترون» تحافظ على صيغته الخبرية من غير تحويلها إلى أمر.
- source_word: ἐξ ἔργων
  choice: بالأعمال
  rationale: تفيد ἐξ هنا الأساس أو الوسيلة في سياق الحجة، والباء العربية تنقل هذا المعنى بوضوح وطبيعية.
- source_word: δικαιοῦται
  choice: يتبرَّر
  rationale: يحافظ هذا اللفظ على الثقل الاصطلاحي للفعل δικαιόω وعلى الصلة اللفظية بمواضع العهد الجديد الأخرى، من غير حسم ما إذا كان المقصود إعلان البر أم إظهاره وإثباته.
- source_word: ἄνθρωπος
  choice: الإنسان
  rationale: الاسم اليوناني مفرد ويُستعمل هنا استعمالًا تمثيليًا عامًا. و«الإنسان» هو المقابل العربي الطبيعي الدال على البشر عمومًا، من غير قصر المعنى على الذكر.
- source_word: πίστεως
  choice: الإيمان
  rationale: «الإيمان» هو المقابل الافتراضي الطبيعي لـ πίστις هنا، ويلائم المقابلة في السياق بين الأعمال والإيمان إذا انفرد.
- source_word: μόνον
  choice: وحده
  rationale: ينقل معنى الحصر، ووضعه بعد «الإيمان» عربي طبيعي ويحافظ على عبارة «الإيمان وحده».
theological_decisions:
- issue: دلالة δικαιοῦται وصلتها بلاهوت التبرير
  choice: إبقاء «يتبرَّر» في المتن، بحيث يظل تعبير يعقوب قائمًا من غير تسوية تفسيرية.
  alternative: يُظهَر أنه بار؛ أو تثبت براءته
  rationale: يحتمل الفعل في هذا السياق معنى الإعلان بالبر أو إظهار أن المرء على حق وإثبات ذلك. إبقاء المصطلح الرئيس يصون التوتر اللاهوتي واللفظي، وتعرض الحاشية البدائل من غير فرض واحد منها.
- issue: الدلالة العامة لـ ἄνθρωπος
  choice: «الإنسان» بوصفه اسم جنس شاملًا للبشر.
  alternative: شخص؛ إنسان ما
  rationale: السياق يقرر حكمًا عامًا لا يختص بالرجال، و«الإنسان» يحفظ المفرد والصفة التمثيلية مع وضوح الشمول في العربية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة ومباشرة، تحافظ على ترتيب الحجة وعلى التقابل بين الأعمال والإيمان. استُعمل «الإنسان» للدلالة العامة الطبيعية في العربية، و«يتبرَّر» لصون المصطلح اللاهوتي مع إبقاء احتماله الدلالي موضحًا في الحاشية.
