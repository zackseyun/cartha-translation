  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: ar
  text: لِأَنَّ الدَّيْنُونَةَ بِلَا رَحْمَةٍ عَلَى مَنْ لَمْ يُظْهِرْ رَحْمَةً؛ وَالرَّحْمَةُ تَنْتَصِرُ عَلَى الدَّيْنُونَةِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الرحمة تتباهى على الدينونة». يمكن أن يحمل الفعل اليوناني معنى التباهي أو الابتهاج بالغلبة على؛ وقد تُرجم هنا بحسب المعنى الاصطلاحي في السياق: «تنتصر على».'
    reason: بديل معجمي يبيّن الصورة البلاغية للفعل اليوناني κατακαυχᾶται، مع الحفاظ على الصياغة العربية الطبيعية في المتن.
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: الْحُكْم / الْحُكْمِ
  rationale: ينقل معنى التقييم القضائي أو الإلهي دون تضييقه إلى الإدانة وحدها، ويحافظ على تكرار اللفظ في طرفي الآية.
- source_word: ἀνέλεος
  choice: بِلَا رَحْمَةٍ
  rationale: صياغة عربية واضحة تحفظ الصلة اللفظية المتكررة مع ἔλεος، وتصف الحكم بأنه خالٍ من الرحمة.
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: عَلَى مَنْ لَمْ يَعْمَلْ رَحْمَةً
  rationale: يحافظ على صورة التعبير اليوناني ذي الخلفية السامية، «يعمل رحمة»، وهو تعبير عربي مفهوم يبرز ممارسة الرحمة لا مجرد الشعور بها.
- source_word: κατακαυχᾶται
  choice: تَفْتَخِرُ عَلَى
  rationale: يحفظ الاستعارة الأصلية ومعنى التباهي أو الافتخار على شيء، بدل أن يحسمها تفسيرياً بمعنى الغلبة فقط.
- source_word: ἔλεος
  choice: الرَّحْمَة
  rationale: المقابل العربي الطبيعي والمألوف، ويحفظ التكرار والتقابل الداخلي في الآية.
theological_decisions:
- issue: دلالة العبارة الختامية κατακαυχᾶται ἔλεος κρίσεως
  choice: «والرحمة تفتخر على الحكم» بوصفها عبارة حكمية موجزة
  alternative: «والرحمة تنتصر على الحكم» أو تخصيص الرحمة بأنها رحمة الله أو الرحمة التي يمارسها المؤمن
  rationale: الصياغة الحرفية الطبيعية تحفظ الصورة البلاغية والغموض المقصود، فلا تعيّن صاحب الرحمة ولا تنشئ مذهباً آلياً في الاستحقاق. وتوضح الحاشية المعنى الاصطلاحي المحتمل دون إحلاله محل النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «يعمل رحمة» للمحافظة على الصياغة السامية الملموسة، و«تفتخر على» لحفظ الصورة اليونانية، مع شرح دلالتها في الحاشية.
