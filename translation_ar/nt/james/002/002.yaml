  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: ar
  text: فإن دخل إلى مجمعكم[a] رجل يلبس خواتم من ذهب وثيابًا لامعة، ودخل أيضًا فقير بثياب قذرة،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كنيسكم». اللفظ اليوناني هو «سيناغوغي»، ويعني «كنيسًا» أو «مجمعًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: مجمعكم
  rationale: «مجمع» لفظ عربي طبيعي يدل على موضع الاجتماع أو جماعة المجتمعين، ويحافظ على الصلة الدلالية بلفظ συναγωγή من غير أن يحصر المشهد في مؤسسة يهودية رسمية؛ وتُذكر «كنيسكم» في الحاشية بوصفها احتمالًا أكثر حرفية.
- source_word: ἀνὴρ
  choice: رجل
  rationale: اللفظ اليوناني مذكر مفرد، والمثال يتحدث صراحة عن رجل.
- source_word: χρυσοδακτύλιος
  choice: يلبس خواتم من ذهب
  rationale: الصفة تعني حرفيًا التحلي بالذهب في الأصابع؛ وهذه الصياغة العربية تنقل صورة الثراء الظاهر بصورة طبيعية، مع إبقاء احتمال المفرد ضمن الدلالة الجماعية غير المحددة للفظ.
- source_word: ἐσθῆτι λαμπρᾷ
  choice: ثيابًا لامعة
  rationale: تحافظ «لامعة» على القوة البصرية للصفة λαμπρός، التي قد تفيد أيضًا البهاء والفخامة.
- source_word: πτωχὸς
  choice: فقير
  rationale: الصفة مستعملة استعمال الاسم بصيغة المذكر المفرد، وهي تقابل «رجل» في صدر المثال.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: بثياب قذرة
  rationale: «قذرة» تنقل المعنى القوي للصفة ῥυπαρός، بدل تخفيفه إلى مجرد ثياب بالية أو رثة.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: دخل ... ودخل أيضًا
  rationale: تكرار الفعل في العربية يحفظ التوازي المقصود في النص اليوناني بين دخول الرجلين.
- source_word: γὰρ
  choice: فإن
  rationale: الفاء تصل المثال بما قبله، و«إن» تنقل طابعه الافتراضي الشرطي؛ وهذا أنسب عربيًا من افتتاح الجملة بـ«لأن إذا».
theological_decisions:
- issue: ترجمة συναγωγή في سياق رسالة موجّهة إلى جماعة مؤمنة
  choice: مجمعكم
  alternative: كنيسكم
  rationale: لا يحسم النص طبيعة المؤسسة أو نظام الجماعة، و«مجمعكم» يبقي معنى الاجتماع واسعًا ولا يفرض هوية مؤسسية يهودية أو كنسية. أما «كنيسكم» فتحفظه الحاشية لأنه المقابل الأكثر حرفية وقد يعكس لغة الاجتماع لدى المؤمنين اليهود الأوائل.
translation_notes:
  register: صياغة عربية فصحى معاصرة واضحة وكريمة. حُفظت بنية المثال الشرطي، والتوازي بين دخولي الرجلين، والتباين الحاد بين الثياب اللامعة والثياب القذرة، مع تجنب تحميل «المجمع» دلالة طائفية أو مؤسسية غير محسومة.
