    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν
  choice: وقال لهم أحدٌ منكم
  rationale: ينقل المثال الافتراضي بصياغة عربية طبيعية، ويحفظ معنى الانتماء الجزئي في ἐξ ὑμῶν، أي واحد من جماعة المخاطَبين.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: اذهبوا بسلام
  rationale: عبارة وداع أو تمنٍّ مألوفة، وتحفظ المفارقة بين الكلام الطيب والامتناع عن تقديم العون.
- source_word: θερμαίνεσθε καὶ χορτάζεσθε
  choice: استدفئوا واشبعوا
  rationale: صياغة عربية واضحة ومباشرة تلائم الحاجة إلى اللباس والطعام. ولأن الصيغتين اليونانيتين تحتملان معنى الوسط أو المبني للمجهول، أُثبت البديل الحرفي في الحاشية.
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: ولكنكم لم تعطوهم
  rationale: تُظهر «لكن» التضاد بين التمنّي اللفظي وعدم تقديم المعونة، ويؤدي الماضي العربي هنا وظيفة طبيعية داخل المثال الافتراضي.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: ما يحتاج إليه الجسد
  rationale: ينقل معنى المؤن أو الضروريات اللازمة للجسد بعبارة عربية حديثة واضحة، مع إبقاء التركيز على الاحتياج المادي.
- source_word: τί ὄφελος;
  choice: فما الفائدة؟
  rationale: سؤال موجز يحفظ قوة الاستفهام البلاغي ومعنى النفع العملي.
theological_decisions:
- issue: دلالة صيغتي θερμαίνεσθε وχορτάζεσθε من جهة المبني للمجهول أو معنى الوسط
  choice: استدفئوا واشبعوا
  alternative: تدفّأوا وأُشبعوا
  rationale: المقصود الرئيس هو بطلان الأقوال التقوية حين لا تصحبها معونة مادية، لا تحديد كيفية حصول الدفء والشبع. اختيرت صياغة عربية طبيعية، مع حفظ الاحتمال النحوي الآخر في الحاشية وعدم بناء استنتاج لاهوتي على صيغة الفعل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت عبارة «ما يحتاج إليه الجسد» بدل تركيب اسمي أثقل، وحُفظت المفارقة البلاغية بين السلام اللفظي وغياب العطاء العملي.
