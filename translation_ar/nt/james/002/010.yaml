  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: ar
  text: لِأَنَّ مَنْ يَحْفَظُ الشَّرِيعَةَ كُلَّهَا، ثُمَّ يَعْثُرُ فِي أَمْرٍ وَاحِدٍ[a]، فَقَدْ صَارَ مُذْنِبًا فِي حَقِّ الشَّرِيعَةِ كُلِّهَا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يُخْفِقُ فِي أَمْرٍ وَاحِدٍ» أو «يَتَعَدَّى وَصِيَّةً وَاحِدَةً». يقول اليوناني حرفيًا «يَعْثُرُ فِي وَاحِدٍ»، مستعملًا صورة التعثر للإخفاق الأخلاقي.
    reason: lexical_alternative
  - marker: b
    text: أو «فَقَدْ صَارَ مَسْؤُولًا عَنِ الشَّرِيعَةِ كُلِّهَا». المعنى أن مخالفة أمر واحد تجعل الإنسان مذنبًا أو مسؤولًا في حق الشريعة كلها، لا أنه ارتكب كل مخالفة على حدة.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: مَنْ
  rationale: اسم شرط عام طبيعي في العربية، يحفظ شمول المبدأ لكل شخص ينطبق عليه الوصف.
- source_word: γὰρ
  choice: لِأَنَّ
  rationale: يفيد التعليل والربط بما سبق، وهو واضح في العربية المعاصرة.
- source_word: ὅλον τὸν νόμον
  choice: الشَّرِيعَةَ كُلَّهَا
  rationale: ينقل معنى الشمول في ὅλον، ويستعمل «الشريعة» للدلالة على الناموس بوصفه منظومة إلهية من الوصايا في السياق.
- source_word: τηρήσῃ
  choice: يَحْفَظُ
  rationale: يفيد مراعاة الشريعة والعمل بها، وهو مقابل مباشر شائع لـτηρέω في سياق الوصايا.
- source_word: πταίσῃ
  choice: يَعْثُرُ
  rationale: يحفظ استعارة التعثر في اليونانية مع دلالتها السياقية على الإخفاق أو التعدي الأخلاقي.
- source_word: ἐν ἑνί
  choice: فِي وَصِيَّةٍ وَاحِدَةٍ
  rationale: المذكور اليوناني حرفيًا «في واحدة/واحد» ويُفهم مرجعه من أجزاء الشريعة؛ التصريح بـ«وصية» يوضح المعنى الطبيعي دون حصره في نوع مخصوص من الأحكام.
- source_word: γέγονεν
  choice: فَقَدْ صَارَ
  rationale: 'ينقل صيغة التمام والنتيجة القائمة: أدى التعثر إلى حالة من المسؤولية والذنب.'
- source_word: πάντων
  choice: إِلَى الشَّرِيعَةِ كُلِّهَا
  rationale: يُظهر أن المسؤولية تتعلق بمجموع الشريعة المذكورة، بدل أن يوهم أن الشخص ارتكب كل مخالفة على حدة.
- source_word: ἔνοχος
  choice: مُذْنِبًا
  rationale: ينقل الدلالة القضائية والأخلاقية للكلمة بعبارة عربية واضحة؛ وتشرح الحاشية معنى المسؤولية تجاه الكل.
theological_decisions:
- issue: نطاق الذنب بالنسبة إلى الشريعة
  choice: مخالفة وصية واحدة تجعل الإنسان مذنبًا ومسؤولًا تجاه الشريعة كلها.
  alternative: أن مخالفة وصية واحدة تعني ارتكاب كل وصية على حدة أو مساواة جميع الخطايا في الدرجة.
  rationale: عبارة πάντων ἔνοχος تدل طبيعيًا على المسؤولية تجاه الكل، ولا تستلزم أن جميع الوصايا قد انتُهكت فرديًا أو أن كل الخطايا متساوية في جسامتها.
- issue: مدى دلالة «الشريعة» في السياق
  choice: الإبقاء على لفظ عام يشير إلى الشريعة كلها كما يصرح النص.
  alternative: حصر القول في وصية عدم المحاباة وحدها ضمن سياق يعقوب 2.
  rationale: السياق المباشر يتناول المحاباة، لكن صياغة الآية نفسها تقدم مبدأ عامًا عن «الشريعة كلها»؛ لذلك لا تُضيَّق الدلالة في الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الشريعة» بدل الصيغة المعرَّبة «الناموس» لسهولة الفهم لدى القارئ المعاصر، مع الحفاظ على المعنى القانوني والأخلاقي. حُفظت استعارة التعثر، وأُضيفت «وصية» لتوضيح المرجع المضمر في ἐν ἑνί. وُضع التشكيل الجزئي/الكامل في نص الآية لتحسين القراءة ومنع الالتباس.
