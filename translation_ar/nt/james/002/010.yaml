  source_fidelity: المسودة تنقل البنية الأساسية للنص اليوناني ومعنى التعثر في أمر واحد، وتحافظ على نتيجة الفعل بصيغة «فقد صار». لكن عبارة «مُذنبًا إلى الشريعة كلها» غير سليمة دلاليًا وتركيبيًا في العربية؛ فحرف الجر «إلى» لا يؤدي معنى ἔνοχος مع المضاف إليه، وقد يحجب المقصود، وهو الذنب في حق الشريعة كلها أو المسؤولية تجاهها.
