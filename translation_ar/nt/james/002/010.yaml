  terminology: يبقى «الشريعة» اختيارًا واضحًا ومناسبًا لـνόμος في هذا السياق. وتبقى «يعثر» محافظة على الاستعارة اليونانية. و«مذنبًا في حق» ينقل ἔνοχος دون الادعاء بأن الشخص ارتكب كل وصية منفردة.
