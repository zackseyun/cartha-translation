  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: ar
  text: أنت تؤمن أن الله واحد[a]؛ حسنًا تفعل. حتى الشياطين تؤمن، وترتعد!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن إلهًا واحدًا موجود». تحتمل اليونانية المعنيين، لكن «الله واحد» أقرب إلى صياغتها، وقد تردد صدى إقرار اليهود بوحدانية الله.'
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ
  choice: أنت
  rationale: إثبات الضمير المنفصل يحفظ توكيد المخاطب المفرد الظاهر في اليونانية، وهو طبيعي في هذا السياق الجدلي.
- source_word: πιστεύεις
  choice: تؤمن
  rationale: الفعل هنا يتعدى إلى مضمون اعتقادي أدخلته ὅτι، ولذلك «تؤمن» أدق من ألفاظ قد توحي بالثقة الشخصية وحدها.
- source_word: ὅτι
  choice: أن
  rationale: تُدخل مضمون الإيمان بصورة طبيعية وواضحة في العربية.
- source_word: εἷς ἐστιν ὁ θεός
  choice: الله واحد
  rationale: يحافظ على صيغة الإسناد في اليونانية وعلى الصدى المحتمل لإقرار التوحيد اليهودي، من غير توسيع تفسيري.
- source_word: καλῶς ποιεῖς
  choice: حسنًا تفعل
  rationale: تعبير عربي موجز يحفظ معنى الاستحسان الظاهر، مع إبقاء أثره البلاغي في ضوء الجملة التالية.
- source_word: καὶ
  choice: حتى
  rationale: 'ينقل القوة التصاعدية لـ καί هنا: فالشياطين أيضًا تبلغ هذا المستوى من التصديق، وهو لب المقارنة البلاغية.'
- source_word: τὰ δαιμόνια
  choice: الشياطين
  rationale: المقابل العربي المباشر والمألوف، ويحفظ التعريف دون استبداله بتفسير مثل «الأرواح الشريرة».
- source_word: πιστεύουσιν
  choice: تؤمن
  rationale: تكرار «تؤمن» يحفظ التكرار المعجمي المقصود مع πιστεύεις، وهو أساسي لحجة يعقوب.
- source_word: φρίσσουσιν
  choice: ترتعد
  rationale: ينقل رد الفعل الجسدي المشوب بالخوف الذي يدل عليه الفعل، بلغة عربية معاصرة رصينة.
theological_decisions:
- issue: صياغة إقرار التوحيد εἷς ἐστιν ὁ θεός
  choice: الله واحد
  alternative: لا إله إلا إله واحد / يوجد إله واحد
  rationale: الصياغة المختارة أقرب إلى البنية اليونانية وتحفظ الصدى المحتمل لإقرار إسرائيل بوحدانية الله، من غير إدخال صياغة عقدية لاحقة أو تحويل الإسناد إلى مجرد تقرير وجودي.
- issue: قوة المقارنة بين إيمان المخاطب وإيمان الشياطين
  choice: حتى الشياطين تؤمن، وترتعد!
  alternative: والشياطين أيضًا تؤمن وترتعد
  rationale: '«حتى» تُبرز القوة التصاعدية، وعلامة التعجب تنقل حدة الخاتمة البلاغية من غير إضافة مضمون. وتبقى المفارقة كما هي: صحة الاعتقاد المجرد لا تميّز صاحبها عن الشياطين.'
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظت المواجهة المباشرة بإثبات «أنت»، والتكرار بين «تؤمن» و«تؤمن»، والتصعيد البلاغي بـ«حتى». لم تُضف حاشية مستقلة لـ«ترتعد» لأن البديل «تقشعر» أقل طبيعية مع الشياطين، ولأن «ترتعد» ينقل المعنى بوضوح.
