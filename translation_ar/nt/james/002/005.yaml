reference: James 2:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: ar
  text: 'اسمعوا، يا إخوتي الأحباء[a]: ألم يختر الله الفقراء في نظر العالم[b] ليكونوا أغنياء في الإيمان[c] وورثة الملكوت الذي وعد به للذين يحبونه؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يا إخوتي وأخواتي الأحباء»؛ اللفظ اليوناني هو «إخوة»، وقد يشمل جماعة المؤمنين كلها.
    reason: alternative_reading
  - marker: b
    text: أو «الفقراء بحسب مقاييس العالم» أو «الفقراء في أعين أهل العالم».
    reason: lexical_alternative
  - marker: c
    text: يمكن أيضًا ترجمة «الإيمان» بـ«الثقة»، أو، على احتمال أضعف هنا، «الأمانة».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: اسمعوا
  rationale: فعل أمر للجمع يستدعي الانتباه مباشرة، و«اسمعوا» صياغة عربية واضحة وطبيعية تحافظ على قوة الخطاب.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: يا إخوتي الأحباء
  rationale: تحافظ «إخوتي» على صيغة الجمع المذكر في اليونانية، وتنقل «الأحباء» معنى ἀγαπητοί، مع بيان احتمال الشمول في الحاشية.
- source_word: οὐχ ... ἐξελέξατο
  choice: ألم يختر
  rationale: صيغة استفهام إنكاري تتوقع جوابًا مثبتًا، وتؤدي وظيفة οὐχ في السؤال من غير إضافة تفسير عقائدي إلى فعل الاختيار.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: الفقراء في نظر العالم
  rationale: 'تفهم داتيف τῷ κόσμῳ على معنى الاعتبار أو المقياس: الفقراء بحسب تقدير العالم. وهذه العبارة أوضح في العربية من النقل الحرفي «في العالم»، مع حفظ البدائل في الحاشية.'
- source_word: πλουσίους ἐν πίστει
  choice: أغنياء في الإيمان
  rationale: تحافظ على التضاد بين الفقر بحسب العالم والغنى في الإيمان، وتستعمل «الإيمان» بوصفه المقابل الأرجح لـ πίστις هنا.
- source_word: κληρονόμους τῆς βασιλείας
  choice: ورثة الملكوت
  rationale: «ورثة» تنقل الاستعارة القانونية والعائلية في κληρονόμοι، و«الملكوت» مصطلح عربي كتابي واضح لـ βασιλεία في هذا السياق.
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: الذي وعد به الذين يحبونه
  rationale: ينقل ضمير الوصل مرجعه «الملكوت»، ويحافظ على كون الذين يحبون الله هم متلقّي الوعد، وعلى دلالة اسم الفاعل الحاضر بوصفها صفة مميزة لهم.
theological_decisions:
- issue: احتمال تحميل اختيار الله معنى عقائديًا تقنيًا زائدًا
  choice: ترجمة ἐξελέξατο ببساطة «يختر»
  alternative: صياغة تفسيرية تربطه صراحة بمذهب سابق التعيين
  rationale: سياق يعقوب يعالج تقويم الله للفقراء وتناقض المحاباة، فلا ينبغي للترجمة أن تحسم جدلًا عقائديًا أوسع من العبارة نفسها.
- issue: مدى شمول ἀδελφοί
  choice: إبقاء «إخوتي» في المتن وذكر احتمال شمول الجماعة كلها في الحاشية
  alternative: «إخوتي وأخواتي» في المتن
  rationale: اللفظ اليوناني مذكر جمع، لكنه قد يستعمل في مخاطبة جماعة المؤمنين بأسرها؛ لذلك تحفظ الترجمة الصيغة وتوضح الشمول المحتمل.
- issue: معنى πίστις
  choice: الإيمان
  alternative: الثقة، أو الأمانة بدرجة أضعف هنا
  rationale: «الإيمان» هو الأنسب في تركيب «أغنياء في الإيمان» وفي هذا السياق، مع عدم إخفاء المجال الدلالي الأوسع للكلمة.
translation_notes:
  register: عربية فصحى معاصرة، واضحة وموقرة. استُعمل الاستفهام الإنكاري «ألم» لإبراز الجواب المتوقع، ووُضعت علامات الحواشي عند الألفاظ التي تتناولها مباشرة.
