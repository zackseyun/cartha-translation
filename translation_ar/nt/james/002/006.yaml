id: JAS.2.6
reference: James 2:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: ar
  text: أَمَّا أَنْتُمْ فَقَدْ أَهَنْتُمُ الْفَقِيرَ[a]. أَلَيْسَ الْأَغْنِيَاءُ هُمُ الَّذِينَ يَسْتَبِدُّونَ بِكُمْ، وَهُمْ أَنْفُسُهُمْ يَجُرُّونَكُمْ إِلَى الْمَحَاكِمِ[b]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الرجل الفقير»، أو بمعنى أعم: «الفقراء». اللفظ اليوناني مفرد، ويرجّح أنه يعود إلى المثال المحدد في الأعداد السابقة، مع تمثيله للفقراء عمومًا.'
    reason: lexical_alternative
  - marker: b
    text: أي المحاكم أو المجالس القضائية.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: أهنتم
  rationale: ينقل معنى المعاملة بلا كرامة أو باحتقار، ويحفظ بُعد الكرامة والعار في الفعل اليوناني بصياغة عربية طبيعية.
- source_word: τὸν πτωχόν
  choice: الفقير
  rationale: يحفظ صيغة المفرد المعرّف، ويربط الكلام بالرجل الفقير المذكور في المثال السابق، مع إمكان دلالته التمثيلية على الفقراء عمومًا.
- source_word: οἱ πλούσιοι
  choice: الأغنياء
  rationale: مقابل عربي موجز وطبيعي للصفة اليونانية المستعملة استعمال الاسم، ويحفظ الإشارة إلى الفئة الاجتماعية.
- source_word: καταδυναστεύουσιν
  choice: يستبدّون بكم
  rationale: يعبّر عن ممارسة السلطة القاسية على الآخرين، وهو أقوى وأدق هنا من مجرد «يظلمونكم» دون تحديد وسيلة الاضطهاد.
- source_word: ἕλκουσιν
  choice: يجرّونكم
  rationale: يحفظ صورة السحب بالقوة وما في السياق القضائي العدائي من إكراه.
- source_word: κριτήρια
  choice: المحاكم
  rationale: يدل السياق على جهات القضاء أو مجالسه، و«المحاكم» تعبير عربي حديث واضح.
- source_word: καὶ αὐτοὶ
  choice: وهم أنفسهم
  rationale: يحفظ توكيد الضمير اليوناني بأن الأغنياء أنفسهم، لا غيرهم، هم الذين يفعلون ذلك.
- source_word: οὐχ ... ;
  choice: أليس ...؟
  rationale: ينقل السؤال الإنكاري الذي يتوقع جوابًا بالإيجاب في صياغة عربية مألوفة.
theological_decisions:
- issue: مرجع المفرد «الفقير»
  choice: فقير بعينه في مشهد اجتماع الجماعة، يمثّل الفقراء على نطاق أوسع
  alternative: اعتبار المفرد اسم جنس بمعنى «الفقراء» عمومًا
  rationale: يتصل المفرد مباشرة بمثال الرجل الفقير في يعقوب 2:2–3؛ لذا يحفظ النص المفرد من غير أن يمنع دلالته التمثيلية العامة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «أمّا أنتم» لإبراز المقابلة في ὑμεῖς δὲ، وحُفظ توكيد «هم» و«أنفسهم» الوارد في السؤال اليوناني.
