  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: ar
  text: ولكن إن كنتم تُظهرون المحاباة[a]، فإنكم ترتكبون خطيئة، ويثبت الناموس أنكم متعدّون.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تتحيزون» أو «تحابون الناس»؛ أي تحكمون على الناس أو تعاملونهم بحسب مكانتهم الظاهرة أو مظهرهم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يبكّتكم الناموس بوصفكم متعدّين» أو «يكشف الناموس ذنبكم»؛ فاللفظ اليوناني يفيد إظهار الخطأ وإثبات الذنب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ولكن إن
  rationale: تحفظ أداة الشرط مع دلالة δέ على الانتقال المقابل المتصل بالسياق السابق.
- source_word: προσωπολημπτεῖτε
  choice: كنتم تحابون
  rationale: «تحابون» تعبير عربي موجز يدل على تفضيل أشخاص بسبب مكانتهم أو مظهرهم، وهو مناسب لسياق يعقوب.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: فإنكم ترتكبون خطيئة
  rationale: ينقل التركيب اليوناني اصطلاحيًا وبوضوح، إذ يعني الفعل مع «خطيئة» ارتكابها لا العمل بها بمعناه الحرفي.
- source_word: ἐλεγχόμενοι
  choice: ويدينكم
  rationale: صيغ الفعل المحدود المنسق طبيعيًا في العربية، وتنقل فعل الناموس في كشف الذنب وإثباته، مع بقاء البديل «يبكّتكم» في الحاشية.
- source_word: ὑπὸ τοῦ νόμου
  choice: الناموس
  rationale: «الناموس» لفظ كتابي عربي معروف يشير إلى المعيار التشريعي في السياق، من غير إضافة تحدده بأنه الموسوي أو غيره.
- source_word: ὡς παραβάται
  choice: بوصفكم متعدّين
  rationale: يحفظ معنى تجاوز الحد أو مخالفة الحكم، من غير تكرار كلمة «الناموس» داخل الاسم.
theological_decisions:
- issue: طبيعة الناموس في حجة يعقوب الأخلاقية
  choice: الناموس
  alternative: ناموس الله؛ الشريعة الموسوية
  rationale: لا يحدد النص اليوناني هنا نطاق الناموس تحديدًا عهديًا أضيق؛ لذلك تُترك دلالته للسياق من غير استيراد بناء لاهوتي خاص.
- issue: قوة ἐλεγχόμενοι القضائية أو التوبيخية
  choice: ويدينكم الناموس
  alternative: موبَّخين من الناموس؛ إذ يكشف الناموس ذنبكم
  rationale: السياق الذي يصف المخاطبين بأنهم متعدون يرجح معنى إثبات الذنب، لكن الحاشية تحفظ مجال اللفظ الذي يشمل الكشف والتبكيت.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «تحابون» و«الناموس» لرسوخهما في الأسلوب الكتابي العربي، مع شرح الأول في الحاشية. وُضعت علامتا الحاشية في نهاية الآية بحسب ترتيب ظهورهما، وكلتاهما مشار إليهما في المتن.
