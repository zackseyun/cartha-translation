  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: ar
  text: أليسوا هم أنفسهم يجدّفون على الاسم الكريم[a] الذي دُعي به عليكم؟[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الاسم الحسن» أو «الاسم النبيل».
    reason: lexical_alternative
  - marker: b
    text: أو «الذي دُعي عليكم»، وقد تعني العبارة الاسم الذي يُعرَف به المؤمنون، وربما تحمل صدى لغة عَهْدية أو معمودية.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: أليسوا هم أنفسهم
  rationale: تفيد οὐκ في هذا السياق سؤالًا إنكاريًا يُنتظر أن تكون إجابته بالإيجاب، وتؤكد αὐτοὶ أن الفاعلين هم بعينهم المذكورون قبلاً؛ لذلك حُفظ التأكيد بعبارة «هم أنفسهم».
- source_word: βλασφημοῦσιν
  choice: يجدّفون على
  rationale: يمكن أن يدل الفعل على الشتم أو الافتراء، لكنه هنا متعلق بالاسم الذي يحمله المؤمنون ويرتبط على الأرجح بالرب يسوع؛ لذا تنقل «يجدّفون على» قوة الإهانة الدينية من غير حصر المرجع صراحةً.
- source_word: τὸ καλὸν ὄνομα
  choice: الاسم الكريم
  rationale: تدل καλός هنا على ما هو حسن ومكرّم ونبيل. و«الكريم» تعبير عربي طبيعي يحفظ معنى الشرف والقدر الرفيع من غير أن يحدد صاحب الاسم بما يتجاوز النص.
- source_word: τὸ ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: الذي دُعي به عليكم
  rationale: تحفظ الصياغة صورة الاسم المدعو به على جماعة، بدل تحويلها في المتن إلى مجرد تسمية. وهي تُبقي احتمال الإشارة إلى هوية عَهْدية أو إلى اسم نُطق به عليهم، مع توضيح البديل العربي الطبيعي في الحاشية.
theological_decisions:
- issue: مرجع «الاسم الكريم»
  choice: الإبقاء على العبارة عامة كما في اليونانية، مع احتمال قوي أنها تشير إلى اسم يسوع/الرب الذي ينتسب إليه المؤمنون.
  alternative: التصريح بعبارة «اسم المسيح» أو تفسيرها بأنها اسم الله أو اسم الهوية المسيحية.
  rationale: لا يذكر النص اليوناني يسوع صراحةً في هذه الآية، وإن كان سياق يعقوب 2:1 يرجح المرجع المسيحاني. لذلك لا يُضاف اسم غير مذكور، وتُصان سعة الدلالة والتوتر اللاهوتي.
- issue: دلالة «دُعي به عليكم»
  choice: الحفاظ على صورة اسم دُعي به على المخاطبين.
  alternative: «الذي سُمّيتم به»، وهي أوضح في معنى الانتساب لكنها تزيل صورة الدعاء بالاسم على الجماعة.
  rationale: قد تحمل العبارة صدى عهديًا أو طقسيًا، وربما معموديًا، لكن النص لا يحسم السياق المقصود؛ لذلك تُحفظ الصورة الأصلية ويُذكر البديل في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. استُخدم السؤال الإنكاري الطبيعي «أليسوا» مع إبراز الضمير، وحُفظت العبارة الاصطلاحية اليونانية بقدر يسمح به العربية من غير حسم مرجع الاسم أو خلفية الدعاء به.
