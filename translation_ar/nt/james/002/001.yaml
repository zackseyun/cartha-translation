source:
  edition: SBLGNT
  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: ar
  text: يا إخوتي[a]، لا تجمعوا بين الإيمان بربنا يسوع المسيح[b]، ربِّ المجد[c]، والمحاباة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أيضًا: «يا إخوتي وأخواتي»؛ اللفظ اليوناني مذكّر، لكنه يخاطب جماعة المؤمنين عمومًا.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تُفهم العبارة اليونانية أيضًا: «إيمان ربنا يسوع المسيح» أو «الإيمان الذي لربنا يسوع المسيح».'
    reason: alternative_reading
  - marker: c
    text: 'أو: «ربنا يسوع المسيح المجيد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: يا إخوتي
  rationale: نداء طبيعي فصيح يحافظ على صيغة الجمع المذكر في اليونانية، مع بيان شمول الجماعة المؤمنة في الحاشية.
- source_word: μὴ ... ἔχετε
  choice: لا تجمعوا بين ... و...
  rationale: صيغة نهي تعبّر عربيًا بوضوح عن منع ممارسة الإيمان في إطار المحاباة، وتتجنب تركيبًا حرفيًا متعثرًا مثل «لا تحملوا الإيمان في محاباة».
- source_word: ἐν προσωπολημψίαις
  choice: المحاباة
  rationale: لفظ عربي مألوف ودقيق يدل على تفضيل الأشخاص بحسب المكانة أو المظهر؛ وصيغة الجمع اليونانية تُؤدَّى هنا باسم جنس طبيعي في العربية.
- source_word: τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: الإيمان بربنا يسوع المسيح
  rationale: هذا هو التعبير العربي الطبيعي عن الإيمان المتجه إلى الرب يسوع، مع إثبات إمكان فهم الإضافة اليونانية على وجه آخر في الحاشية.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: يُترجم اللقب بمعناه، «المسيح»، وهو في العربية لقب معروف لا يحتاج إلى إضافة أداة تعريف مستقلة بعد اسم يسوع.
- source_word: τῆς δόξης
  choice: ربِّ المجد
  rationale: يحافظ على الإضافة السامية في الأصل ويربط «المجد» بالرب يسوع من غير اختزالها إلى مجرد صفة «المجيد».
theological_decisions:
- issue: علاقة المضاف إليه في πίστιν τοῦ κυρίου
  choice: الإيمان بربنا يسوع المسيح في المتن
  alternative: الإيمان الذي لربنا يسوع المسيح، أو إيمان ربنا يسوع المسيح
  rationale: الإضافة اليونانية تحتمل أكثر من علاقة. اختير في المتن الوجه الطبيعي والأرجح سياقيًا في العربية، مع حفظ الوجه الإضافي في الحاشية بدل إخفاء الغموض الأصلي.
- issue: تعلّق τῆς δόξης
  choice: ربِّ المجد
  alternative: ربنا يسوع المسيح المجيد
  rationale: «رب المجد» يحفظ قوة الإضافة واحتمال كونها لقبًا أو بدلًا وصفيًا، بينما «المجيد» صياغة أكثر تفسيرًا.
- issue: مدلول Ἀδελφοί من جهة المخاطَبين
  choice: إخوتي
  alternative: إخوتي وأخواتي
  rationale: يحافظ المتن على الصيغة المذكرة في الأصل، وتوضح الحاشية أن النداء موجّه سياقيًا إلى جماعة المؤمنين الأوسع.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة ومباشرة. استُخدم «لا تجمعوا بين... والمحاباة» لتأدية النهي بصورة طبيعية، مع إبقاء مواضع الاحتمال النحوي واللاهوتي في الحواشي.
