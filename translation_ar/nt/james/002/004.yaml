  footnotes:
  - marker: a
    text: 'أو: «أفلم تفرِّقوا فيما بينكم؟» ويمكن أن يدل الفعل أيضًا على الانقسام أو، في سياقات أخرى، على الشك؛ لكن السياق هنا يرجّح التمييز التفريقي بين الناس.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «قضاة أفكارٍ/استدلالاتٍ شريرة». ويمكن فهم العبارة على أن أفكارًا شريرة تميّز أحكامهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: تميِّزوا
  rationale: الفعل هنا يدل، في سياق تفضيل الغني على الفقير (يعقوب 2:1–3)، على إجراء تمييز تفريقي بين الناس. وهذه الصياغة أوضح في السياق من معنى الشك أو الانقسام، مع إبقاء البدائل في الحاشية.
- source_word: ἐν ἑαυτοῖς
  choice: بين بعضكم وبعض
  rationale: تنقل العبارة المعنى الجماعي «في ما بينكم» بما يلائم سلوك الجماعة، بدل حصرها في معنى داخلي نفسي.
- source_word: ἐγένεσθε
  choice: صرتم
  rationale: 'تعبّر طبيعيًا عن النتيجة التي آل إليها فعلهم: لقد صاروا نوعًا معينًا من القضاة.'
- source_word: κριταὶ
  choice: قضاةً
  rationale: المقابل العربي المباشر الذي يحفظ القوة القضائية والأخلاقية في توبيخ يعقوب.
- source_word: διαλογισμῶν πονηρῶν
  choice: ذوي أفكار شريرة
  rationale: صياغة عربية واضحة تحفظ معنى الأفكار أو الاستدلالات الشريرة، وتفهم الإضافة اليونانية على أنها تصف القضاة وما يتسم به حكمهم دون تضييقها إلى «دوافع» فقط.
- source_word: οὐ
  choice: أفلم
  rationale: تحفظ صيغة السؤال الإنكاري الذي يتوقع جوابًا بالإيجاب، وتؤدي نبرة التوبيخ باختصار طبيعي.
theological_decisions:
- issue: دلالة διακρίνω وعلاقتها بالمحاباة
  choice: الآية توبّخ إجراء تمييز تفريقي داخل جماعة المؤمنين.
  alternative: أن يكون الكلام عن الانقسام الداخلي أو التردد والشك.
  rationale: السياق المباشر في يعقوب 2:1–3 هو تفضيل الغني على الفقير، ولذلك يرجح معنى التمييز بين الناس، مع عدم إخفاء المجال الدلالي الآخر للفعل.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة توبيخية رصينة. استُعمل «تميِّزوا بين بعضكم وبعض» لإظهار البعد الاجتماعي في السياق، و«ذوي أفكار شريرة» للموازنة بين قرب الصياغة من الإضافة اليونانية وسلامة التعبير العربي.
