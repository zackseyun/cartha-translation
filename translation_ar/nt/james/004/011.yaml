source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: ar
  text: لا يتكلم بعضكم على بعض بالسوء[a]، أيها الإخوة[b]. فمَن يتكلم بالسوء على أخٍ أو يحكم على أخيه، يتكلم بالسوء على الشريعة ويحكم على الشريعة. ولكن إن كنت تحكم على الشريعة، فلست عاملًا بالشريعة، بل قاضيًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لا تذمّوا بعضكم بعضًا»؛ فالفعل اليوناني يدل على الكلام ضد شخص بكلام مسيء أو تشهيري.'
    reason: lexical_alternative
  - marker: b
    text: صيغة «إخوة» في اليونانية جمع مذكر، ويُرجَّح أن الخطاب يشمل جماعة المؤمنين كلها، رجالًا ونساءً.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: تتكلموا بالسوء على / يتكلم بالسوء على
  rationale: ينقل معنى الكلام العدائي أو التشهيري على شخص، ويحافظ على تكرار الفعل في الحجة من غير حصره في الافتراء الصريح وحده.
- source_word: ἀλλήλων
  choice: بعضكم على بعض
  rationale: تعبير عربي طبيعي واضح عن المعنى التبادلي في النهي.
- source_word: ἀδελφοί
  choice: يا إخوة
  rationale: يحافظ على صيغة النداء المذكرة وصورة القرابة في اليونانية، مع بيان شمول الخطاب المرجح للجماعة كلها في الحاشية.
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: أخيه / أخاه
  rationale: يحافظ على الاستعارة العائلية وعلى الاتساق المعجمي مع «يا إخوة».
- source_word: ἢ
  choice: أو
  rationale: ينقل العطف التخييري في النص، حيث يورد التكلم بالسوء والإدانة فعلين متوازيين.
- source_word: κρίνων / κρίνει / κρίνεις
  choice: يدين / تدين
  rationale: «يدين» هنا فعل عربي واضح للحكم على شخص أو على الشريعة، ويحافظ على تكرار الجذر في العبارة من دون إضافة معنى العقوبة.
- source_word: νόμου / νόμον
  choice: الشريعة
  rationale: «الشريعة» أنسب في هذا السياق للإرشاد الإلهي الملزم، مع إبقاء مرجعها غير محدد كما في الآية.
- source_word: ποιητὴς
  choice: عاملًا بالشريعة
  rationale: صياغة عربية طبيعية تؤدي معنى من يعمل بمقتضى الشريعة، وتحفظ المقابلة بين العمل بها والحكم عليها.
- source_word: κριτής
  choice: ديّانًا
  rationale: اسم فاعل صريح يحفظ المقابلة النحوية والدلالية مع «عاملًا»، ويميز من يتخذ موقع الحاكم عن مجرد ممارسة حكم عابر.
theological_decisions:
- issue: نطاق المخاطبين بكلمة ἀδελφοί
  choice: «يا إخوة» في المتن، مع توضيح الشمول المرجح في الحاشية.
  alternative: «أيها الإخوة والأخوات» أو «يا إخوتي»
  rationale: الصيغة اليونانية جمع مذكر، لكنها تُستعمل على الأرجح لخطاب جماعة المؤمنين كلها. يحفظ المتن شكل المصدر، وتمنع الحاشية فهمه على أنه مقصور على الرجال.
- issue: مرجع νόμος
  choice: «الشريعة» من غير تقييد إضافي.
  alternative: «شريعة موسى» أو «الشريعة الملكية» أو «شريعة الله»
  rationale: السياق في الرسالة يرجح الإرشاد الإلهي الأخلاقي، ولا سيما محبة القريب، لكن الآية نفسها لا تعيّن المرجع تعيينًا أضيق.
- issue: طبيعة κρίνω في الحكم على الأخ والشريعة
  choice: الحفاظ على اللفظ المتكرر «يدين» من غير تفسير نوع الحكم.
  alternative: «يحكم على» أو «يحكم بإدانة»
  rationale: النص يربط إدانة الأخ بإدانة الشريعة، ولا يحدد في هذه الآية وحدها هل المقصود كل تقييم أم الحكم المتعالي المخالف للشريعة؛ لذلك لا تُحسم الدلالة بتوسيع تفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وعظية كريمة. حوفظ على التكرار البلاغي بين الكلام بالسوء والإدانة والشريعة، وعلى صورة الأخوّة، من غير تعيين مذهبي لمرجع الشريعة.
