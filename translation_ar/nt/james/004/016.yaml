  source_fidelity: النص العربي ينقل المقابلة في νῦν δὲ («أمّا الآن»)، وفعل καυχᾶσθε («تفتخرون»)، ودلالة ἀλαζονείαις بوصفها ادعاءات متعالية/متبجحة، ثم الحكم الأخلاقي العام في πᾶσα καύχησις τοιαύτη πονηρά ἐστιν. ولا يقيّد اللفظ بالمخططات، مع بقاء صلته بالسياق السابق مفهومة في الحاشية.
  naturalness: 'الصياغة فصيحة واضحة وذات نبرة مناسبة للنص الرسائلي: «أمّا الآن فأنتم تفتخرون...» سليمة، و«وكل افتخار من هذا النوع شرّ» مفهومة وطبيعية في العربية الحديثة.'
  terminology: «ادعاءاتكم المتكبرة» اختيار جائز لـἀλαζονείαις، إذ يحفظ معنى الادعاء المتعالي ولا يفرض تفسير «الخطط» في المتن. والحاشية تعرض بدائل عربية مناسبة («بغروركم»، «بتبجحاتكم») وتوضح الصلة السياقية دون تحويلها إلى معنى حصري.
