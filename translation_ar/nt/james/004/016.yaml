  text: νῦν δὲ καυχᾶσθε ἐν ταῖς ἀλαζονείαις ὑμῶν· πᾶσα καύχησις τοιαύτη πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: ar
  text: أَمَّا الآنَ فَأَنْتُمْ تَفْتَخِرُونَ بِادِّعَاءَاتِكُمُ الْمُتَكَبِّرَةِ.[a] وَكُلُّ افْتِخَارٍ مِنْ هَذَا النَّوْعِ شَرٌّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بِغُرُورِكُمْ»، أو «بِتَبَجُّحَاتِكُمْ». يمكن أن تدل الكلمة اليونانية على الادعاء المتعالي والثقة المتبجحة عمومًا، ويبدو أنها تشير هنا خصوصًا إلى الخطط الواثقة المذكورة في الآيات السابقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: أَمَّا الآنَ
  rationale: تؤدي معنى الانتقال الاستدراكي إلى واقع المخاطَبين الحاضر، في مقابل موقف الاتكال المتواضع المذكور في الآية السابقة.
- source_word: καυχᾶσθε
  choice: تَفْتَخِرُونَ
  rationale: ترجمة مباشرة وطبيعية لفعل يدل على التباهي أو الافتخار، وتحافظ على الصلة بالاسم καύχησις في الجملة التالية.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: بِادِّعَاءَاتِكُمُ الْمُتَكَبِّرَةِ
  rationale: تحفظ صيغة الجمع ودلالة التظاهر المتعالي والثقة المتبجحة، من غير أن تضيف إلى النص صراحةً مفهوم «المخططات»، وإن كان السياق يشير إلى خطط واثقة بذاتها.
- source_word: πᾶσα καύχησις τοιαύτη
  choice: كُلُّ افْتِخَارٍ مِنْ هَذَا النَّوْعِ
  rationale: تنقل التعميم الوصفي في πᾶσα وτοιαύτη بعبارة عربية واضحة، وتُبقي الحكم متعلقًا بهذا النوع من الافتخار.
- source_word: πονηρά
  choice: شَرٌّ
  rationale: تنقل الحكم الأخلاقي القوي في الصفة اليونانية، لا مجرد معنى الرداءة أو عدم الملاءمة.
theological_decisions:
- issue: طبيعة الافتخار المُدان
  choice: إدانة الثقة المتبجحة بالادعاءات والخطط البشرية بمعزل عن الخضوع لمشيئة الرب، مع إبقاء العبارة عامة كما في اليونانية.
  alternative: اعتبارها إدانة لكل ثقة بالنفس عمومًا، أو حصرها في التخطيط التجاري وحده.
  rationale: السياق السابق يتناول التخطيط الواثق للمستقبل، لكن لفظ ἀλαζονείαις أوسع من «المخططات» وحدها، ولذلك لم تُحصر الترجمة فيها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ادعاءاتكم المتكبرة» للمحافظة على جمع الاسم اليوناني وعلى دلالة الغرور المتجسد في أقوال أو مزاعم، مع شرح البدائل والسياق في الحاشية.
