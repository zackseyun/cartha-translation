  source_fidelity: 'الترجمة أمينة للنص اليوناني: تحافظ على النداء المؤنث الجمع «أيتها الزانيات»، وعلى المقابلة بين «صداقة/صديق» و«عداوة/عدو»، وتنقل κόσμος بلفظ «العالم» دون تفسير زائد في المتن. و«عداوة لله» و«عدوًا لله» يعكسان بصورة سليمة اتجاه العداوة في السياق.'
