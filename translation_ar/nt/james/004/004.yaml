source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: ar
  text: أَيَّتُهَا الزَّانِيَاتُ[a]، أَمَا تَعْلَمْنَ أَنَّ صَدَاقَةَ الْعَالَمِ[b] عَدَاوَةٌ لِلَّهِ[c]؟ فَمَنْ يَشَأْ أَنْ يَكُونَ صَدِيقًا لِلْعَالَمِ يَصِيرُ عَدُوًّا لِلَّهِ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني مؤنث جمع وحرفيًا «الزانيات». ويُرجَّح أنه صورة مجازية للخيانة الروحية وعدم الأمانة لله، على مثال لغة العهد عند الأنبياء.
    reason: lexical_alternative
  - marker: b
    text: المقصود بـ«العالم» هنا النظام البشري وقيمه في معارضة الله، لا الخليقة في ذاتها.
    reason: cultural_note
  - marker: c
    text: 'ويجوز: «عداوة مع الله».'
    reason: alternative_reading
  - marker: d
    text: 'ويجوز: «يجعل نفسه عدوًّا لله».'
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: أَيَّتُهَا الزَّانِيَاتُ
  rationale: نُقلت صيغة النداء المؤنثة الجمع نقلًا مباشرًا، محافظةً على حدّة الصورة وعلى صيغتها النحوية، من غير استبدالها بتفسير مثل «أيها الناس غير الأمناء».
- source_word: οὐκ οἴδατε
  choice: أَمَا تَعْلَمْنَ
  rationale: صياغة عربية طبيعية للسؤال الإنكاري، مع مطابقة جمع المؤنث في المخاطبة.
- source_word: φιλία
  choice: صَدَاقَة
  rationale: تحفظ المعنى العلاقي وتُبقي الصلة اللفظية الواضحة مع φίλος، المترجمة لاحقًا «صديقًا».
- source_word: κόσμου
  choice: الْعَالَم
  rationale: نقل مباشر للفظ اليوناني من غير إدخال تفسير موسّع في المتن؛ والسياق هو الذي يبيّن أن المقصود العالم بوصفه نظامًا بشريًا معارضًا لله.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: عَدَاوَةٌ لِلَّهِ
  rationale: تعبير عربي موجز وطبيعي يفيد العداوة الموجّهة إلى الله، مع الإقرار بأن تركيب المضاف إليه اليوناني يحتمل أيضًا إبراز حالة العداء مع الله.
- source_word: ὃς ἐὰν οὖν
  choice: فَمَنْ ... إِذًا
  rationale: «مَنْ» تؤدي معنى الموصول الشرطي العام، والفاء و«إذًا» تنقلان الاستنتاج الذي تفيده οὖν.
- source_word: βουληθῇ
  choice: أَرَادَ
  rationale: ينقل فعل الإرادة والاختيار بعبارة عربية مألوفة من غير المبالغة في تحميله معنى القرار النهائي.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: أَنْ يَكُونَ صَدِيقًا لِلْعَالَمِ
  rationale: يحافظ على البنية الاسمية وعلى المقابلة اللفظية بين «صداقة» و«صديق».
- source_word: ἐχθρὸς τοῦ θεοῦ
  choice: عَدُوًّا لِلَّهِ
  rationale: نقل مباشر وقوي يقابل «صديقًا للعالم» ويحفظ البنية العلاقية في النص.
- source_word: καθίσταται
  choice: يَصِيرُ
  rationale: يفيد الدخول في حالة أو منزلة العدو، من غير أن يحسم ما إذا كان التركيز على النتيجة أو على جعل المرء نفسه كذلك؛ وقد ذُكر البديل في الحاشية.
theological_decisions:
- issue: القوة المجازية للفظ μοιχαλίδες
  choice: إبقاء «أيتها الزانيات» في المتن
  alternative: أيتها الخائنات / أيها الناس غير الأمناء لله
  rationale: يرجّح أن اللفظ يستعمل الزنى مجازًا للخيانة الروحية أو خيانة العهد، على مثال لغة الأنبياء؛ لكن استبدال الصورة بتفسيرها يحذف مجاز النص وحدّته وصيغته المؤنثة.
- issue: دلالة κόσμος في السياق
  choice: ترجمته «العالم» مع بيان المقصود في الحاشية
  alternative: نظام العالم المعارض لله
  rationale: لا يُراد بالخليقة في ذاتها، بل بالنظام البشري وقيمه في معارضة الله؛ ومع ذلك يحسن إبقاء اللفظ العام في المتن تجنبًا لتوسيع النص بالتفسير.
- issue: دلالة ἔχθρα τοῦ θεοῦ
  choice: «عداوة لله»
  alternative: «عداوة مع الله»
  rationale: السياق يرجّح العداوة الموجّهة إلى الله، لكن تركيب المضاف إليه اليوناني موجز ويمكن أن يبرز أيضًا حالة الخصومة مع الله، لذلك لم يُخفَ البديل.
- issue: قوة καθίσταται من جهة الفاعلية والنتيجة
  choice: «يصير عدوًا لله»
  alternative: «يجعل نفسه عدوًا لله»
  rationale: الصياغة المختارة تحفظ معنى الانتقال إلى حالة العداوة ولا تزيد ضميرًا انعكاسيًا غير مصرّح به، في حين أن الإرادة المذكورة قبلها تُبقي المسؤولية الأخلاقية ظاهرة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة وقورة ومباشرة. استُعملت صيغة جمع المؤنث في النداء والسؤال مراعاةً للصيغة اليونانية، وحُفظ التقابل البلاغي بين «صداقة/صديق» و«عداوة/عدو».
