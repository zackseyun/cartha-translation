source:
  edition: SBLGNT
  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: ar
  text: 'أم تظنون أن الكتاب يقول عبثًا: «الروح الذي أسكنه فينا يشتاق بغيرة»؟[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز أيضًا: «الروح الذي أسكنه فينا يشتاق بحسد». يحتمل اليوناني أن يكون المقصود الروح القدس أو روح الإنسان، كما أن العبارة المترجمة «بغيرة» يمكن أن تعني «بحسد».'
    reason: alternative_reading
lexical_decisions:
- source_word: κενῶς
  choice: عبثًا
  rationale: تفيد أن قول الكتاب ليس بلا غاية أو أثر، وتحافظ على قوة السؤال الاستنكاري بلغة عربية موجزة وطبيعية.
- source_word: ἡ γραφὴ
  choice: الكتاب
  rationale: تعبير عربي مألوف عن الكتاب المقدس بوصفه وحيًا مكتوبًا ذا سلطان، مع الحفاظ على المفرد المعرّف.
- source_word: Πρὸς φθόνον
  choice: بغيرة
  rationale: تعكس دلالة الغيرة أو الحسد المحتملة، وتناسب في المتن قراءة الروح القدس واشتياقه الغيور، مع إثبات معنى الحسد البديل في الحاشية.
- source_word: ἐπιποθεῖ
  choice: يشتاق
  rationale: ينقل معنى الرغبة القوية والحنين الشديد بصياغة عربية واضحة وكريمة.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: يجوز نحويًا أن يكون الروح القدس أو روح الإنسان. أبقيت اللفظ العربي بلا وصف إضافي كي لا تُحسم هوية المرجع داخل الترجمة، ووضحت الاحتمالين في الحاشية.
- source_word: κατῴκισεν
  choice: أسكنه
  rationale: يحفظ المعنى السببي للفعل اليوناني وصيغته الماضية، ويشير إلى فاعل مستتر من غير إضافة اسم غير مصرح به في النص.
- source_word: ἐν ἡμῖν
  choice: فينا
  rationale: هو المقابل الطبيعي الذي يدل غالبًا على السكن الداخلي، مع بقاء إمكان الفهم الجماعي بحسب السياق.
theological_decisions:
- issue: مرجع τὸ πνεῦμα
  choice: إبقاء «الروح» في المتن من غير تعيين صريح، مع إمكان فهمه على أنه الروح القدس
  alternative: روح الإنسان التي أسكنها الله فينا
  rationale: التركيب اليوناني يحتمل القراءتين احتمالًا حقيقيًا. وعدم إضافة «القدس» يحفظ التوتر اللاهوتي، بينما تعرض الحاشية البديل بوضوح.
- issue: القيمة الأخلاقية لعبارة Πρὸς φθόνον
  choice: بغيرة
  alternative: بحسد أو إلى الحسد
  rationale: «الغيرة» تلائم إمكان إسناد الاشتياق إلى الروح القدس ولا تنسب إليه رذيلة الحسد حتمًا، لكن الحاشية تحفظ المعنى السلبي الممكن للفظ اليوناني.
- issue: طبيعة العبارة بعد النقطتين
  choice: عرضها بوصفها القول الذي ينسبه يعقوب إلى الكتاب
  alternative: فهمها كتقرير أو سؤال مستقل لا بوصفها اقتباسًا كتابيًا مباشرًا
  rationale: علامات الوقف ليست جزءًا من المخطوطات الأولى، كما لا يوجد اقتباس مطابق معروف في العهد القديم. مع ذلك، بنية λέγει تتيح تقديم العبارة التالية بوصفها مضمون قول الكتاب، من غير تعيين مصدر بعينه.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. استُخدم «عبثًا» لقوة الاستفهام الاستنكاري، وأُبقي «الروح» دون إضافة «القدس» لصون الغموض الأصيل. وُضعت علامة الحاشية في المتن كما يلزم.
