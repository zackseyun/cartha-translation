id: JAS.4.7
reference: James 4:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ’ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: ar
  text: فاخضعوا لله[a]، وقاوموا إبليس، فيهرب منكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كونوا خاضعين لله».'
    reason: بديل معجمي يحفظ الصيغة المبنية للمجهول في اليونانية، في حين أن «اخضعوا» أكثر طبيعية في العربية وتحمل قوة الأمر المقصودة.
lexical_decisions:
- source_word: ὑποτάγητε
  choice: اخضعوا
  rationale: فعل أمر يفيد وضع النفس تحت سلطان الله وطاعته؛ وصيغة «اخضعوا» عربية طبيعية ومباشرة، وتحفظ قوة الوصية من غير إضافة ضمير انعكاسي لا تحتاج إليه العربية.
- source_word: οὖν
  choice: فـ
  rationale: تفيد الفاء النتيجة والاستنتاج مما سبق، وتنقل الصلة المنطقية بإيجاز طبيعي في العربية.
- source_word: τῷ θεῷ
  choice: لله
  rationale: اللام تلائم تعدية «خضع» في العربية وتؤدي معنى المتمم في صيغة الداتيف اليونانية.
- source_word: ἀντίστητε
  choice: قاوموا
  rationale: أمر بالوقوف في وجه الخصم وعدم الاستسلام له؛ و«قاوموا» واضحة وشائعة في سياق المواجهة الروحية والأخلاقية.
- source_word: δὲ
  choice: الواو
  rationale: تدل δέ هنا على انتقال ذي مقابلة خفيفة بين الخضوع لله ومقاومة إبليس؛ والواو أكثر سلاسة في العربية، والمقابلة ظاهرة من الفعلين نفسيهما.
- source_word: τῷ διαβόλῳ
  choice: إبليس
  rationale: اللفظ اليوناني هنا لقب شخصي للخصم الروحي. و«إبليس» اسم عربي مألوف وواضح لهذا الكائن الشخصي، لا لمجرد مبدأ الشر أو النميمة.
- source_word: καὶ
  choice: فـ
  rationale: 'تصل الفاء المقاومة بالنتيجة الموعودة على نحو طبيعي: عند مقاومته تكون النتيجة أنه يهرب.'
- source_word: φεύξεται
  choice: يهرب
  rationale: ينقل صيغة المستقبل اليونانية بوصفها نتيجة مؤكدة في هذا التركيب الشرطي الضمني، والفاعل مفهوم من «إبليس».
- source_word: ἀφ’ ὑμῶν
  choice: منكم
  rationale: تنقل حركة الابتعاد التي تدل عليها ἀπό مع المضاف إليه، من غير حشو؛ فالابتعاد متضمن في «يهرب».
theological_decisions:
- issue: دلالة διάβολος
  choice: إبليس بوصفه خصمًا روحيًا شخصيًا
  alternative: المفتري أو النمام بمعنى عام، أو قوة شر غير شخصية
  rationale: ورود الاسم معرفًا وسياق مقاومته وهربه يؤيدان الإشارة إلى خصم شخصي، مع تجنب تحميل الآية تفاصيل عقدية لا يصرح بها النص.
- issue: العلاقة بين الخضوع لله ومقاومة إبليس
  choice: الإبقاء على المقابلة النصية من غير تفسير سببي زائد
  alternative: التصريح بأن الخضوع لله هو الوسيلة التي تمكّن من مقاومة إبليس
  rationale: النص يضع الأمرين متجاورين ويربط المقاومة بوعد الهرب، لكنه لا يصرح تفصيلاً بطبيعة العلاقة السببية بين الأمرين.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت جملة قصيرة مباشرة توافق إيقاع الوصية، مع إبقاء علامة الحاشية [a] في المتن، وتجنب الألفاظ القديمة أو الشروح المضافة.
