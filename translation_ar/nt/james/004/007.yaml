  source_fidelity: 'النص العربي ينقل الأوامر اليونانية وترتيبها وعلاقتها الاستنتاجية بأمانة: «فاخضعوا لله» لـὑποτάγητε οὖν τῷ θεῷ، و«قاوموا إبليس» لـἀντίστητε δὲ τῷ διαβόλῳ، و«فيهرب منكم» للنتيجة المستقبلية φεύξεται ἀφ’ ὑμῶν. لا يضيف تفسيرًا سببيًا أو عقائديًا غير مذكور في الآية.'
  naturalness: 'الصياغة فصيحة حديثة، موجزة، ومناسبة لسجل الوصية: «فاخضعوا لله، وقاوموا إبليس، فيهرب منكم». استعمال الفاء في الموضعين طبيعي ويُظهر الاستنتاج ثم النتيجة.'
  terminology: «إبليس» تسمية عربية راسخة ومفهومة للمقصود بـὁ διάβολος في هذا السياق الشخصي. و«اخضعوا لله» تؤدي معنى الخضوع الاختياري المقصود بالفعل اليوناني على نحو طبيعي. الحاشية تقدم بديلًا معجميًا مشروعًا دون تغيير المعنى.
