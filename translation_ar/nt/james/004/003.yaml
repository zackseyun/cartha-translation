base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: ar
  text: تطلبون ولا تنالون، لأنكم تطلبون بطريقة خاطئة[a]، لكي تنفقوا ذلك على ملذّاتكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تطلبون على نحوٍ غير صائب». وقد يُفهم أيضًا: «بدوافع خاطئة».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تحمل «الملذّات» أيضًا معنى الرغبات أو الأهواء المنغمسة في إرضاء الذات.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: تطلبون
  rationale: فعل مضارع مخاطب للجمع؛ «تطلبون» هو المقابل العربي المباشر والطبيعي، مع إبقاء الجهة المطلوب منها غير مصرّح بها كما في اليونانية.
- source_word: οὐ λαμβάνετε
  choice: ولا تنالون
  rationale: «تنالون» فصيحة واضحة في سياق الطلب والحصول، وتحافظ على التقابل بين الطلب والنوال.
- source_word: διότι
  choice: لأنكم
  rationale: تؤدي العلاقة السببية بوضوح في العربية المعاصرة.
- source_word: κακῶς
  choice: طلبًا سيئًا
  rationale: ينقل المعنى الأخلاقي والكيفي للظرف من غير حصره في الدوافع وحدها؛ والجملة التالية تبيّن وجه السوء.
- source_word: αἰτεῖσθε
  choice: تطلبون
  rationale: لا يقتضي البناء المتوسط في هذا السياق إضافة معنى انعكاسي صريح، وتكرار الفعل يحفظ موازاة النص اليوناني.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ القوة الغائية الواضحة في الأصل، مع بقاء احتمال تداخل الغاية والنتيجة السياقية.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: على ملذّاتكم
  rationale: «ملذّات» تنقل معنى المتع والرغبات المنغمسة في إرضاء الذات، وحرف «على» طبيعي عربيًا مع فعل الإنفاق.
- source_word: δαπανήσητε
  choice: تنفقوا ما تنالونه
  rationale: «تنفقوا» مقابل محايد ودقيق للفعل. أُظهر مفعوله بوصفه ما يُنال استنادًا إلى السياق، لتستقيم العبارة العربية من غير إضافة حكم أقوى مثل «تبدّدوا».
theological_decisions:
- issue: هل يُصرَّح بأن الطلب موجَّه إلى الله في الصلاة؟
  choice: 'إبقاء الجهة غير مصرّح بها: «تطلبون ولا تنالون»'
  alternative: تطلبون من الله ولا تنالون
  rationale: السياق يدل على الصلاة، لكن الآية اليونانية لا تذكر الله صراحة، لذلك لا تُضاف الكلمة إلى المتن.
- issue: هل يُحصر κακῶς في فساد الدوافع؟
  choice: «تطلبون طلبًا سيئًا» في المتن
  alternative: تطلبون بدوافع خاطئة
  rationale: الظرف أوسع من الدافع وحده، أما الغاية الخاطئة فتشرحها الجملة التالية؛ لذا ينبغي عدم تضييق الدلالة قبل أوانها.
- issue: دلالة ἡδοναῖς الأخلاقية
  choice: «ملذّاتكم» مع إيضاح في الحاشية
  alternative: شهواتكم / أهوائكم
  rationale: «ملذّات» أقرب إلى الدلالة المعجمية المباشرة، بينما يوضح السياق والحاشية أنها قد تحمل معنى الرغبات المنغمسة في إرضاء الذات، من غير فرض لفظ أشد في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي بين «تطلبون» و«تنالون»، ولم يُذكر الله صراحة لأن الأصل يترك جهة الطلب مضمرة. استُعمل «طلبًا سيئًا» بدل «بسوء» لتجنب التباسها بمعنى سوء الأدب وحده، وأُضيف «ما تنالونه» لتوضيح المفعول المضمر لفعل الإنفاق في العربية.
