  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: ar
  text: فمَن يعرف أن يفعل الخير ولا يفعله، فذلك خطيئة له.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لذلك، مَن يعرف الخير الذي ينبغي أن يفعله ولا يفعله، فهو خطيئة له».'
    reason: بديل يصرّح بدلالة الاستنتاج وبفهم الخير بوصفه خيرًا معلومًا ينبغي فعله، مع أن لفظ «ينبغي» غير مذكور صراحةً في اليونانية.
lexical_decisions:
- source_word: εἰδότι
  choice: مَن يعرف
  rationale: اسم الفاعل المفرد في حالة المجرور/الداتيف مستعمل استعمالًا اسميًا عامًا؛ وصيغة «مَن يعرف» تنقل الإحالة إلى كل شخص يتصف بهذه المعرفة بصورة عربية طبيعية.
- source_word: οὖν
  choice: فـ
  rationale: تفيد الاستنتاج مما سبق، والفاء تربط القول بالسياق السابق بوضوح وإيجاز.
- source_word: καλὸν ποιεῖν
  choice: أن يفعل الخير
  rationale: ينقل التركيب معنى فعل ما هو صالح أخلاقيًا، مع إبقاء دلالة «الخير» واسعة من غير حصرها في واجب معين.
- source_word: μὴ ποιοῦντι
  choice: ولا يفعله
  rationale: يحافظ على المقابلة بين معرفة الخير والامتناع عن فعله، والضمير يعود بوضوح إلى الخير المعروف.
- source_word: ἁμαρτία
  choice: خطيئة
  rationale: الاسم هنا خبر غير معرّف ذو قوة وصفية؛ واختيار «خطيئة» يقرر الطبيعة الأخلاقية للفعل من غير إضافة تصنيف مذهبي.
- source_word: αὐτῷ ἐστιν
  choice: فذلك خطيئة له
  rationale: «له» تنقل داتيف الإحالة، أي إن هذا الامتناع يُعَدّ خطيئة بالنسبة إلى الشخص الذي يعرف، و«ذلك» يوضح أن المشار إليه هو عدم فعل الخير.
theological_decisions:
- issue: طبيعة الحكم على ترك الخير المعلوم
  choice: تقرر الآية أن من يعرف الخير ولا يفعله يكون ذلك خطيئة له، بصياغة عامة مرتبطة بالسياق السابق.
  alternative: قصر القول على التخطيط المتكبر الوارد في السياق المباشر، أو صياغته صراحةً كقاعدة عقائدية شاملة عن «خطايا الترك».
  rationale: السياق المباشر يتناول التخطيط المتعالي، لكن صياغة الآية عامة. لذلك تُحفظ سعتها الأخلاقية من غير فصلها عن السياق أو تحميلها إطارًا مذهبيًا محددًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. استُعملت الفاء للاستنتاج، وحُفظ المفرد العام بصيغة «مَن». وُضع مؤشر الحاشية في المتن كما هو مطلوب.
