  source_fidelity: النص العربي ينقل بدقة الاستفهامين المتكررين Πόθεν، ويميّز بين πόλεμοι («الحروب») وμάχαι («الخصومات») دون إلغاء الصورة العسكرية. كما يحافظ على الاستفهام الإنكاري في οὐκ ἐντεῦθεν وعلى المصدر «لذّاتكم» وعلى صورة اللذّات التي «تحارب في أعضائكم». وترجمة ἐν ὑμῖν بـ«بينكم» وἐν τοῖς μέλεσιν ὑμῶν بـ«في أعضائكم» تحفظ التوتر المقصود بين النزاعات الجماعية والدوافع الداخلية.
