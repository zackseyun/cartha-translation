id: JAS.4.1
reference: James 4:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: ar
  text: 'مِن أين تأتي الحروب، ومِن أين تأتي الخصومات بينكم؟ أليست من هنا: من لذّاتكم التي تحارب في أعضائكم؟[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الصراعات ... المعارك». يستعمل النص اليوناني ألفاظًا عسكرية، حرفيًّا «الحروب» و«المعارك»، لوصف النزاعات داخل الجماعة.
    reason: lexical_alternative
  - marker: b
    text: أو «فيكم» في العبارة الأولى؛ فاللفظ اليوناني قد يشير إلى النزاع بين المخاطَبين أو إلى النزاع في داخلهم. وتربط الآية في مجملها بين الخصام الظاهر والرغبات الداخلية.
    reason: alternative_reading
  - marker: c
    text: «الأعضاء» ترجمة حرفية، وقد يُقصد بها أعضاء الجسد أو، بمعنى أوسع، قوى الإنسان وملكاته.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: مِن أين تأتي
  rationale: يحفظ معنى السؤال عن المصدر، ويُبقي تكرار أداة الاستفهام في اليونانية وقوته البلاغية بصياغة عربية طبيعية.
- source_word: πόλεμοι
  choice: الحروب
  rationale: ينقل اللفظ العسكري المباشر ويحفظ الصورة البلاغية القوية للنزاعات الخطيرة داخل الجماعة.
- source_word: μάχαι
  choice: الخصومات
  rationale: يميّزه عن «الحروب» بلفظ عربي طبيعي يدل على المشاجرات والنزاعات، مع بيان المعنى الحرفي البديل في الحاشية.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: يلائم السياق الجماعي للنزاعات بين المخاطَبين، مع إبقاء احتمال «فيكم» في الحاشية.
- source_word: οὐκ ἐντεῦθεν
  choice: أليست من هنا
  rationale: يحفظ السؤال الإنكاري الذي ينتظر جوابًا بالإيجاب، ويجعل العبارة تشير إلى المصدر المذكور بعدها مباشرة.
- source_word: ἡδονῶν
  choice: لذّاتكم
  rationale: مقابل مباشر لـἡδονή، ويحمل في السياق إيحاء اللذات التي يطلبها المرء لإرضاء نفسه من غير تحويل اللفظ إلى تفسير مثل «الشهوات».
- source_word: στρατευομένων
  choice: التي تحارب
  rationale: يحفظ الصورة العسكرية واستمرار الصراع، ويربطها بصورة «الحروب» في أول الآية.
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: في أعضائكم
  rationale: يحافظ على الاستعارة الجسدية وعلى احتمال الإشارة إلى أعضاء الجسد أو إلى قوى الإنسان وملكاته، من غير حسم تفسيري.
theological_decisions:
- issue: هل النزاعات في مطلع الآية داخلية فقط أم نزاعات بين أفراد الجماعة؟
  choice: تُرجمت ἐν ὑμῖν أولًا «بينكم»، والعبارة الأخيرة «في أعضائكم»، حفاظًا على الصلة بين النزاع الخارجي والرغبات الداخلية.
  alternative: يمكن ترجمة الأولى «فيكم»، أو ترجمة الأخيرة تفسيريًا «في داخلكم».
  rationale: سياق يعقوب يربط الخصومات الواقعة في الجماعة بالدوافع المتصارعة داخل الإنسان؛ لذلك لا تُختزل الآية في البعد الاجتماعي وحده ولا النفسي وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظ تكرار «مِن أين تأتي» والصور العسكرية والجسدية، مع استعمال «الخصومات» لتمييز μάχαι عن πόλεμοι في صياغة طبيعية مفهومة.
