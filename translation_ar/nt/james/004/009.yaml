base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: ar
  text: تألَّموا، ونوحوا، وابكوا. ليتحوَّل ضحككم إلى حزن، وفرحكم إلى كآبة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وجوم». تدل الكلمة اليونانية على حال من الانكسار والحزن والوجه المنكّس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: تألَّموا
  rationale: فعل أمر حادّ يدعو المخاطَبين إلى اختبار الشقاء والضيق والاعتراف بهما. «تألَّموا» عربية طبيعية تحفظ قوة الدعوة من غير أن توحي بطلب إيقاع الأذى بالنفس.
- source_word: πενθήσατε
  choice: نوحوا
  rationale: يحمل الفعل معنى الحزن العميق والحداد؛ واختيار «نوحوا» يميّزه من «تألَّموا» ومن البكاء المذكور بعده، ويحفظ التدرج الثلاثي.
- source_word: κλαύσατε
  choice: ابكوا
  rationale: المقابل العربي المباشر والطبيعي لفعل البكاء، مع بقاء النبرة الجادة.
- source_word: ὁ γέλως ὑμῶν εἰς πένθος
  choice: ضحككم إلى نوح
  rationale: يحافظ على الاسمين المحسوسين وعلى التوازي، ويربط πένθος بالفعل πενθήσατε عبر الجذر العربي نفسه.
- source_word: μετατραπήτω
  choice: ليتحوَّل
  rationale: أمر غائب مبني للمجهول من حيث المعنى، يدل على الانتقال من حال إلى حال؛ وهذه الصياغة طبيعية في العربية ولا تحدد فاعل التحويل.
- source_word: ἡ χαρὰ
  choice: فرحكم
  rationale: مع أن ضمير الملكية مصرح به مع «ضحككم» فقط، فهو مفهوم أيضًا في الشطر الموازي، وإظهاره بالعربية يوضح التوازي من غير تغيير المعنى.
- source_word: εἰς κατήφειαν
  choice: إلى كآبة
  rationale: تشير الكلمة إلى حال من الانكسار والوجوم والحزن المنكّس للرأس؛ «كآبة» موجزة ومفهومة، مع بيان البديل في الحاشية لتجنب حصرها في الدلالة السريرية الحديثة.
theological_decisions:
- issue: قوة لغة التوبة والحزن
  choice: الإبقاء على الأوامر بوصفها دعوة حادة إلى الحزن والانكسار، من غير إضافة لفظ «توبوا» غير الوارد في الآية.
  alternative: تلطيف العبارة إلى دعوة عامة للجدية، أو إدخال التوبة صراحة في المتن.
  rationale: السياق يحمل بوضوح نبرة التواضع والرجوع إلى الله، لكن ألفاظ الآية نفسها تأمر بالتألم والنوح والبكاء وتحول الضحك والفرح؛ لذلك تُحفظ شدتها من غير تفسير عقائدي زائد.
translation_notes:
  register: 'عربية فصحى معاصرة، واضحة ومهيبة. حُفظ البناء الإيقاعي: ثلاثة أوامر متتابعة، ثم مقابلتان بين الضحك والنوح، والفرح والكآبة. وُضعت علامة الحاشية في المتن كما يلزم.'
