id: JAS.4.14
reference: James 4:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: ar
  text: وأنتم لا تعرفون ما سيحدث غدًا. فما حياتكم؟ إنكم بخار[a] يظهر وقتًا قصيرًا ثم يختفي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: ضباب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασθε
  choice: تعرفون
  rationale: يفيد الفعل المعرفة أو الإدراك، و«تعرفون» هي العبارة العربية المباشرة والطبيعية في سياق جهل الإنسان بالمستقبل.
- source_word: τὸ τῆς αὔριον
  choice: ما سيحدث غدًا
  rationale: التركيب اليوناني موجز ومحذوف التقدير، ويشير إلى ما يخص الغد؛ وهذه الصياغة توضّح المعنى في العربية من غير توسع تفسيري.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: فما حياتكم؟
  rationale: يحافظ السؤال الموجز على القوة البلاغية للاستفهام عن طبيعة الحياة وقيمتها، من غير تحويل الصورة إلى تقرير تفسيري.
- source_word: ἀτμὶς
  choice: بخار
  rationale: «بخار» مقابل عربي مباشر للصورة اليونانية، ويعبّر عن شيء يظهر سريعًا ثم يزول؛ ويمكن أيضًا فهم اللفظ بمعنى الضباب.
- source_word: πρὸς ὀλίγον
  choice: وقتًا قصيرًا
  rationale: ينقل بوضوح معنى المدة الوجيزة بأسلوب عربي طبيعي.
- source_word: φαινομένη
  choice: يظهر
  rationale: ينقل معنى صيرورة البخار مرئيًا، ويلائم الصورة في العربية.
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: ثم يختفي
  rationale: يحفظ تتابع الظهور والزوال، ويؤدي المعنى بإيجاز ووضوح.
theological_decisions:
- issue: الصورة المجازية لقِصر حياة الإنسان وعدم يقينها
  choice: الإبقاء على صورة البخار كما هي، بوصفها وصفًا بلاغيًا لقِصر الحياة ومحدودية معرفة الإنسان.
  alternative: 'صياغة تفسيرية مثل: «إن حياتكم زائلة».'
  rationale: يحافظ المجاز على قوة النص الأدبية وعلى التوتر بين خطط الإنسان وجهله بالمستقبل، من غير إضافة أحكام عقائدية عن الموت أو الدينونة لا يصرّح بها العدد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعملت «وأنتم» لإبقاء صلة الجملة بسياق العدد السابق، ووُضع الاستفهام في صيغة موجزة تحفظ إيقاع الأصل. علامة الحاشية موضوعة عند اللفظ الذي تتعلق به.
