  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: ar
  text: تشتهون ولا تملكون[a]؛ تقتلون[b] وتحسدون[c] ولا تقدرون أن تنالوا؛ تتخاصمون وتحاربون. لا تملكون لأنكم لا تسألون[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ترغبون بشدة» أو «تشتهون ما لغيركم»؛ يدل اليوناني على رغبة قوية، وغالبًا ما تكون مذمومة في هذا السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ترتكبون القتل». الفعل اليوناني يدل عادةً على القتل المتعمد، وإن كان بعض المفسرين يفهمون العبارة على سبيل البلاغة أو المبالغة.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «تغارون».'
    reason: lexical_alternative
  - marker: d
    text: المفهوم من السياق أن السؤال موجَّه إلى الله، مع أن النص اليوناني لا يذكر ذلك صراحة هنا.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: تشتهون
  rationale: يفيد الفعل رغبة شديدة، وهي في هذا السياق رغبة منحرفة. و«تشتهون» يحفظ قوة اللفظ واتساعه من غير حصره في الشهوة الجنسية أو في اشتهاء ممتلكات الغير وحدها.
- source_word: ἔχετε
  choice: تملكون
  rationale: ترجمة عربية طبيعية ومباشرة في سياق عدم الحصول على المرغوب، وتوصل معنى ἔχω هنا بوضوح.
- source_word: φονεύετε
  choice: تقتلون
  rationale: يحفظ اللفظ شدة الفعل اليوناني من غير أن يحسم في المتن هل المراد قتل فعلي أم استعمال بلاغي؛ وتوضح الحاشية إمكان ترجمته «ترتكبون القتل».
- source_word: ζηλοῦτε
  choice: تحسدون
  rationale: السياق العدائي والرغبة المحبطة يرجحان المعنى السلبي للفعل، أي الحسد، مع بقاء «تغارون» بديلًا معجميًا ممكنًا.
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: لا تقدرون أن تنالوا
  rationale: ينقل معنى العجز عن بلوغ الشيء المرغوب أو الحصول عليه، بعبارة عربية واضحة وقريبة من التركيب اليوناني.
- source_word: μάχεσθε
  choice: تتخاصمون
  rationale: يمكن أن يدل μάχομαι على القتال أو الخصام. واختيار «تتخاصمون» يميزه عن الفعل الأقوى التالي، مع إبقاء تصاعد العبارة.
- source_word: πολεμεῖτε
  choice: تحاربون
  rationale: يحفظ دلالة الحرب والعداء المستمر في πολεμέω، ويصون قوة اقترانه بالفعل السابق.
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: لأنكم لا تطلبون
  rationale: المصدر المسبوق بـ διά يؤدي معنى السببية. والمطلوب منه مفهوم من السياق أنه الله، لكن النص اليوناني لا يذكر المفعول صراحة.
theological_decisions:
- issue: هل يُفسَّر φονεύετε تفسيرًا مجازيًا أو يُخفَّف في المتن؟
  choice: الإبقاء على اللفظ القوي «تقتلون»
  alternative: «ترتكبون القتل»، أو إضافة تفسير مثل «تقتلون في قلوبكم»
  rationale: الفعل اليوناني قوي ولا ينبغي تخفيفه أو إدخال تفسير مجازي في المتن. أما احتمال المبالغة البلاغية أو المعنى المجازي فينتمي إلى التفسير.
- issue: هل يُصرَّح بالله مفعولًا لـ αἰτεῖσθαι؟
  choice: 'إبقاء المفعول ضمنيًا: «لا تطلبون»'
  alternative: «لا تطلبون من الله»
  rationale: السياق يدل على أن الطلب موجَّه إلى الله، ولا سيما في العدد التالي، لكن اليونانية لا تذكر الله صراحة هنا؛ لذلك يُحفظ الإضمار في المتن وتوضحه الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حافظت الصياغة على تتابع الجمل وقوة التوبيخ، واستُعملت الفواصل المنقوطة لإظهار بنية العبارات اليونانية المتوازية. جميع علامات الحواشي مثبتة في المتن.
