  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ταπεινώθητε ἐνώπιον ⸀κυρίου, καὶ ὑψώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: ar
  text: اتَّضِعوا أمام الرب[a]، فيرفعكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في حضرة الرب».'
    reason: lexical_alternative
  - marker: b
    text: 'أي: يعلي شأنكم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: اتَّضِعوا
  rationale: صيغة أمر ماضية مبنية للمجهول يمكن أن تؤدي هنا معنى انعكاسيًا أو وسطيًا في سياق الوصايا؛ و«اتَّضِعوا» تعبير عربي طبيعي يدعو المخاطَبين إلى التواضع طوعًا.
- source_word: ἐνώπιον
  choice: أمام
  rationale: 'تنقل بإيجاز المعنى المكاني والعلاقي: «أمام» أو «في حضرة».'
- source_word: κυρίου
  choice: الرب
  rationale: تحافظ على اللفظ اليوناني وعلى عدم حسم ما إذا كان المقصود هنا الله أم الرب يسوع.
- source_word: ὑψώσει
  choice: يرفعكم
  rationale: يحفظ صورة الرفع في الأصل، ويفيد في السياق الإعلاء والتكريم في مقابل الاتضاع، من غير تقييده بمعنى جسدي.
- source_word: ὑμᾶς
  choice: كم في «يرفعكم»
  rationale: ضمير مخاطب جمع، وقد حافظت العربية على دلالة الجمع صراحة.
theological_decisions:
- issue: مرجع «الرب»
  choice: الإبقاء على «الرب» من غير تعيين إضافي
  alternative: الله؛ أو الرب يسوع
  rationale: يمكن أن يستعمل يعقوب «الرب» في الإشارة إلى الله أو إلى يسوع، ولا يفرض السياق المباشر حسم المرجع؛ لذلك تحفظ الترجمة ما في النص من احتمال.
- issue: دلالة الرفع
  choice: «يرفعكم» مع بيان معنى الإعلاء في الحاشية
  alternative: يعلي شأنكم
  rationale: اللفظ اليوناني يحتفظ بصورة الرفع ويحمل معنى مجازيًا هو الإعلاء أو التكريم؛ فاختيرت العبارة الأوسع مع توضيح البديل.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة وذات نبرة وقورة. استُخدم فعل الجمع «اتَّضِعوا» وضمير الجمع «كم» لإظهار أن الخطاب موجَّه إلى جماعة، وحُفظ التوازي بين الاتضاع والرفع.
