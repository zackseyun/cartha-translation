base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: ar
  text: 'والآن، اسمعوا، يا من تقولون: «اليوم أو غدًا سنذهب إلى هذه المدينة[a]، ونقضي هناك سنة، ونتاجر ونربح».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تُفهم أيضًا على نحو اصطلاحي: «إلى مدينة كذا». لكن اليونانية تقول حرفيًا «هذه المدينة»، مستعملةً اسم إشارة لمدينة معينة في خطة المتكلمين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: اسمعوا الآن
  rationale: تعبير استهلالي للفت الانتباه يحمل نبرة المواجهة والتنبيه. تؤدي «اسمعوا الآن» هذه الوظيفة بوضوح في العربية المعاصرة من غير حرفية غير طبيعية.
- source_word: οἱ λέγοντες
  choice: يا من تقولون
  rationale: اسم الفاعل المعرّف مستعمل في مقام النداء المباشر؛ والصياغة المختارة تحفظ توجيه الخطاب إلى المخاطَبين.
- source_word: Σήμερον ἢ αὔριον
  choice: اليوم أو غدًا
  rationale: تُترجم ἢ بأداة التخيير «أو»، فتحفظ معنى التخطيط لأحد وقتين قريبين.
- source_word: πορευσόμεθα
  choice: سنذهب
  rationale: الفعل يدل هنا على الذهاب، والسين تُظهر دلالة المستقبل الواضحة في الصيغة اليونانية.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: إلى هذه المدينة
  rationale: تحفظ «هذه» اسم الإشارة الذي يدل على مدينة معينة ضمن خطة المتكلمين، وتأتي «إلى» طبيعية مع فعل الذهاب في العربية.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: ونقضي هناك سنة
  rationale: الفعل ποιέω مع مدة زمنية تعبير اصطلاحي بمعنى قضاء تلك المدة؛ وهذه صياغة عربية واضحة وطبيعية.
- source_word: ἐμπορευσόμεθα
  choice: ونتاجر
  rationale: ينص الفعل على مزاولة التجارة أو النشاط التجاري، و«نتاجر» موجزة ودقيقة.
- source_word: κερδήσομεν
  choice: ونربح
  rationale: يفيد الفعل في هذا السياق التجاري تحقيق الربح، وتحفظ «نربح» المعنى من غير زيادة تفسيرية.
theological_decisions:
- issue: نبرة التوبيخ في الخطاب المباشر
  choice: «يا من تقولون» بوصفها مخاطبة مباشرة
  alternative: «الذين يقولون» بوصفها وصفًا غير مباشر
  rationale: السياق النحوي والبلاغي يواجه أصحاب هذا القول مباشرة، فتحفظ صيغة النداء قوة التنبيه من غير إضافة موقف مذهبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة مباشرة ومهيبة. استُعملت صيغ المستقبل للمحافظة على سلسلة الأفعال المستقبلية في اليونانية، ووُضع رمز الحاشية بعد العبارة التي يشرحها.
