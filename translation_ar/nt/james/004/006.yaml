id: JAS.4.6
reference: James 4:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: ar
  text: 'لكنه يعطي نعمةً أعظم. لذلك قيل[a]: «الله يقاوم المتكبرين، وأما المتواضعون فيعطيهم نعمةً».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لذلك يقول»، أو: «لذلك يقول الكتاب». فاعل «يقول» غير مصرّح به في اليونانية.'
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: أعظم
  rationale: تحفظ صيغة المقارنة وتأتي طبيعية مع «نعمة» في العربية، من غير تحويلها إلى مجرد كمية.
- source_word: δίδωσιν χάριν
  choice: يعطي نعمةً
  rationale: ترجمة مباشرة تحافظ على تكرار العبارة مرتين في الآية وعلى أثره البلاغي.
- source_word: διὸ
  choice: لذلك
  rationale: تبيّن الاستنتاج مما سبق بعبارة عربية موجزة وواضحة.
- source_word: λέγει
  choice: قيل
  rationale: صيغة المبني للمجهول العربية تترك القائل غير مصرّح به، كما يفعل اليوناني، وتلائم إدخال الاقتباس الكتابي.
- source_word: ὑπερηφάνοις
  choice: المتكبرين
  rationale: تنقل معنى الكبرياء والتعالي بوضوح، وتحافظ على المقابلة مع «المتواضعون».
- source_word: ἀντιτάσσεται
  choice: يقاوم
  rationale: تعبر عن المعارضة الفعلية بلفظ عربي واضح ومألوف في هذا السياق.
- source_word: ταπεινοῖς
  choice: المتواضعون
  rationale: تنقل المعنى الأخلاقي المرجح في السياق، من غير قصره على انخفاض المكانة الاجتماعية.
- source_word: δὲ
  choice: لكن / وأما
  rationale: تحفظ قوة المقابلة في مطلع الآية وداخل الاقتباس، مع صياغة عربية طبيعية.
theological_decisions:
- issue: فاعل λέγει في صيغة إدخال الاقتباس
  choice: لذلك قيل
  alternative: لذلك يقول / لذلك يقول الكتاب
  rationale: اليونانية تضمر الفاعل؛ لذا تتجنب صيغة المبني للمجهول تعيينه بأنه الله أو الكتاب، وتحافظ على الإبهام الحقيقي مع وضوح أن الكلام اقتباس.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «قيل» بدل صيغة غير طبيعية مثل «يقول» بلا فاعل، مع إبقاء البدائل في الحاشية. وحُفظ تكرار «يعطي نعمةً» والمقابلة بين المتكبرين والمتواضعين.
