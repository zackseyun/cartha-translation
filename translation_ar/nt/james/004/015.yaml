  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: ar
  text: 'بل[a] ينبغي أن تقولوا: «إن شاء الرب، فسنحيا ونفعل هذا أو ذاك».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكبر: «عوضًا عن أن تقولوا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: بل كان ينبغي أن تقولوا
  rationale: التركيب الحرفي هو «عوضًا عن أن تقولوا»، لكنه يؤدي هنا قوة تصحيحية في مقابل كلام العدد السابق؛ والصياغة المختارة طبيعية وواضحة في العربية مع حفظ هذه القوة. وتوضح الحاشية الصياغة الأقرب إلى اللفظ.
- source_word: Ἐὰν
  choice: إن
  rationale: تدخل أداة شرط على الفعل θελήσῃ، و«إن» هي المقابل العربي الفصيح الطبيعي في هذا السياق.
- source_word: ὁ κύριος
  choice: الرب
  rationale: يحفظ المقابل المعتاد للفظ κύριος ولا يحدد مرجعه بما يتجاوز النص اليوناني.
- source_word: θελήσῃ
  choice: شاء
  rationale: «إن شاء الرب» تعبير عربي طبيعي ودقيق يفيد تعلق الأمر بإرادة الرب، من غير إضعاف معنى المشيئة.
- source_word: καὶ ζήσομεν
  choice: فسنحيا
  rationale: يحفظ المستقبل ويبين أن استمرار الحياة نفسه متعلق بشرط مشيئة الرب؛ والفاء تربط جواب الشرط ربطًا عربيًا طبيعيًا.
- source_word: καὶ ποιήσομεν
  choice: ونفعل
  rationale: الفعل «نفعل» هو المقابل المباشر الواسع لـ ποιέω، والواو تحفظ العطف من غير إضافة توكيد غير لازم.
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: هذا أو ذاك
  rationale: تعبير عربي مألوف يحفظ الإبهام المقصود في الإشارة إلى مختلف الخطط والأعمال.
theological_decisions:
- issue: مرجع «الرب» ودلالة الشرط
  choice: الإبقاء على «الرب» دون تعيين المرجع على نحو أخص
  alternative: الله؛ أو الرب يسوع
  rationale: النص اليوناني يقول ὁ κύριος فقط. وتحفظ الترجمة اعتماد الحياة والعمل على مشيئة الرب من غير حسم ما إذا كان يعقوب يقصد الآب تحديدًا أم الرب يسوع تحديدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل التعبير المألوف «إن شاء الرب» مع الحفاظ على ترتيب اعتماد الحياة ثم العمل على مشيئته، ووُضعت علامة الحاشية [a] في المتن.
