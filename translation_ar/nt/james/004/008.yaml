base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: ar
  text: اقتربوا من الله، وسيقترب منكم. طهِّروا أيديكم، أيها الخطاة، ونقُّوا قلوبكم، يا من انقسم ولاؤكم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يا ذوي النفسين». يصف التعبير شخصًا منقسمًا في ولائه أو التزامه الداخلي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: اقتربوا
  rationale: فعل أمر للجمع يحافظ على معنى الدنو من الله وعلى القوة المباشرة للوصية.
- source_word: τῷ θεῷ
  choice: من الله
  rationale: يتطلب الفعل «اقترب» في العربية حرف الجر «من»، وهو المقابل الطبيعي للمتمم اليوناني هنا.
- source_word: ἐγγιεῖ
  choice: سيقترب
  rationale: صيغة المستقبل تحفظ الوعد الوارد في اليونانية، وتكرار جذر «اقترب» يصون التوازي اللفظي بين الشطرين.
- source_word: καθαρίσατε
  choice: طهِّروا
  rationale: فعل أمر قوي يتسع لإيحاءات التطهير الطقسي والأخلاقي من غير أن يحصر الصورة في تفسير واحد.
- source_word: χεῖρας
  choice: أيديكم
  rationale: إضافة ضمير المخاطبين طبيعية في العربية، مع إبقاء صورة الأيدي وما قد تحمله من دلالة على السلوك الظاهر.
- source_word: ἁμαρτωλοί
  choice: أيها الخطاة
  rationale: يحفظ النداء المباشر وصيغة الجمع ونبرة التوبيخ.
- source_word: ἁγνίσατε
  choice: نقُّوا
  rationale: يميز اللفظ عن «طهِّروا» ويحافظ على تنويع يعقوب بين تطهير الأيدي وتنقية القلوب.
- source_word: καρδίας
  choice: قلوبكم
  rationale: يحفظ الصورة الكتابية للقلوب بوصفها موضع الدوافع والولاء الداخلي، من غير تحويلها إلى شرح تفسيري.
- source_word: δίψυχοι
  choice: يا من انقسم ولاؤكم
  rationale: صياغة عربية واضحة تنقل معنى الانقسام الداخلي في الولاء، مع حفظ الصورة اليونانية الحرفية في الحاشية.
theological_decisions:
- issue: هل تُفسَّر صورتا الأيدي والقلوب تفسيرًا أخلاقيًا صريحًا؟
  choice: الإبقاء على «أيديكم» و«قلوبكم» كما هما.
  alternative: استبدالهما بتعبير عن الأعمال الظاهرة والدوافع الباطنة.
  rationale: قد تجمع لغة التطهير بين أصداء طقسية وقوة أخلاقية؛ وإبقاء الصورتين يصون هذا الاتساع ولا يحسمه بتفسير زائد.
- issue: كيفية نقل δίψυχοι إلى عربية واضحة
  choice: يا من انقسم ولاؤكم
  alternative: يا ذوي النفسين؛ يا ذوي الرأيين
  rationale: الاختيار يوضح الانقسام في الالتزام الداخلي بلغة معاصرة، بينما تحفظ الحاشية الصورة اليونانية اللافتة ولا تفرض تصورًا عقائديًا عن وجود نفسين.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ إيقاع الأوامر المباشرة والتوازي بين اقتراب الإنسان من الله واقتراب الله منه، مع تجنب العبارات المذهبية أو الشروح المدرجة في المتن.
