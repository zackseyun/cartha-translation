  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: ar
  text: إن واضع الشريعة والقاضي واحدٌ، وهو القادر على أن يخلّص ويُهلك. فأنت، من تكون وأنت تحكم على قريبك؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: واضع الشريعة
  rationale: ينقل معنى مَن يسنّ الشريعة أو يضعها بعبارة عربية واضحة، من غير اللجوء إلى «الناموس» الأقل شيوعًا في العربية المعاصرة.
- source_word: κριτής / κρίνων
  choice: الديّان / تدين
  rationale: يحافظ على الصلة اللفظية بين وظيفة الحكم وفعل إدانة القريب، مع أسلوب عربي ديني رصين ومفهوم.
- source_word: ἀπολέσαι
  choice: يُهلك
  rationale: يقابل معنى الإهلاك في موازاة «يخلّص»، ولا يخفف حدّة التضاد الموجود في اليونانية.
- source_word: πλησίον
  choice: قريبك
  rationale: المقصود هو القريب بمعنى الإنسان الآخر، وهي الصياغة العربية المألوفة في هذا السياق الأخلاقي.
theological_decisions:
- issue: هوية واضع الشريعة والديّان
  choice: عدم إضافة لفظ «الله» صراحةً
  alternative: «الله وحده هو واضع الشريعة والديّان»
  rationale: النص اليوناني يصرّح بأن واضع الشريعة والديّان واحد، لكنه لا يورد اسم الله في هذه الجملة؛ لذلك تُحفظ دلالة السياق من غير إضافة تفسيرية.
- issue: صيغة العبارة الختامية ὁ κρίνων
  choice: «يا من تدين قريبك»
  alternative: «حتى تدين قريبك»
  rationale: الصيغة المختارة تعكس اسم الفاعل اليوناني المعرّف بوصفه وصفًا مباشرًا للمخاطَب، وتحافظ على النبرة التوبيخية من غير تحويلها إلى تعبير عن الأهلية فقط.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «الشريعة» بدل «الناموس» لسهولة الفهم، مع إبقاء الإيقاع المكثف والتقابل بين الخلاص والهلاك، والحفاظ على المواجهة البلاغية في ختام الآية.
