    rationale: الفعل κρίνω قد يشمل الحكم أو إصدار الحكم، وليس مقصورًا على الإدانة؛ و«تحكم على» أوسع وأقرب إلى اللفظ اليوناني في هذا الموضع.
  - severity: low
    issue: العبارة الختامية بصيغة النداء «يا من تدين قريبك» ثقيلة أسلوبيًا.
    rationale: التركيب «فمن أنت، وأنت تحكم على قريبك؟» ينقل اسم الفاعل اليوناني بوصفه ملابسًا للمخاطب ويحافظ على النبرة الاستنكارية بصورة أكثر طبيعية.
  revised_text: إن واضع الشريعة والقاضي واحدٌ، وهو القادر على أن يخلّص ويُهلك. فأنت، من تكون وأنت تحكم على قريبك؟
