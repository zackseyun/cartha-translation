  source_fidelity: المعنى العام محفوظ، بما في ذلك وحدانية واضع الشريعة والقاضي، وقدرته على الخلاص والإهلاك. لكن «تدين» أضيق دلالة من κρίνων، إذ تميل في العربية إلى الإدانة تحديدًا، بينما الفعل اليوناني هنا هو «يحكم» في سياق التوبيخ.
  naturalness: «واحد هو» و«يا من تدين قريبك» مفهومتان، لكنهما أقرب إلى الصياغة الحرفية وأقل سلاسة في العربية الفصحى المعاصرة. الصياغة المنقحة تحافظ على البنية البلاغية مع تعبير عربي طبيعي.
  terminology: «واضع الشريعة» مناسب لـ νομοθέτης. واستعمال «القاضي» و«تحكم على» يترجم κριτής/κρίνων بوضوح ويحافظ على الصلة المعجمية بينهما من غير حصر الفعل في معنى الإدانة. «يُهلك» مناسب لـ ἀπολέσαι.
  issues:
