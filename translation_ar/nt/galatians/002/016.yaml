  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: ar
  text: لكننا نعلم أن الإنسان لا يُبرَّر بأعمال الشريعة إلا بالإيمان بيسوع المسيح[a]. ونحن أيضًا آمنا بالمسيح يسوع لكي نُبرَّر بالإيمان بالمسيح[b]، لا بأعمال الشريعة، لأنه بأعمال الشريعة لن يُبرَّر أيُّ بشر[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأمانة يسوع المسيح».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «بأمانة المسيح».'
    reason: alternative_reading
  - marker: c
    text: 'حرفيًّا: «كل جسد لن يُبرَّر». والمعنى: لن يُبرَّر أي إنسان.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: يُبرَّر / نُبرَّر / يُبرَّر
  rationale: يحافظ على المصطلح البولسي ذي الدلالة القضائية بصياغة عربية مألوفة ومتسقة، من غير تضييقه إلى شرح تفسيري مثل «يُحسَب بارًّا».
- source_word: ἄνθρωπος
  choice: الإنسان
  rationale: ينقل المفرد العام في اليونانية بصياغة عربية طبيعية تشمل الإنسان بوجه عام.
- source_word: ἐξ ἔργων νόμου
  choice: بأعمال الشريعة
  rationale: يحافظ على العبارة البولسية المميزة، ولا يوسّعها إلى «الأعمال الصالحة» أو يختزلها في مجرد حفظ الوصايا.
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: بالإيمان بيسوع المسيح
  rationale: يفهم الإضافة على أنها متعلقة بموضوع الإيمان في المتن، مع إثبات احتمال «أمانة يسوع المسيح» في الحاشية لأن التركيب اليوناني محتمل الوجهين.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: آمنا بالمسيح يسوع
  rationale: تعبير عربي طبيعي عن πιστεύω مع εἰς، ويحفظ ترتيب اللقب والاسم في المصدر.
- source_word: ἐκ πίστεως Χριστοῦ
  choice: بالإيمان بالمسيح
  rationale: يتسق مع القرار المتخذ في العبارة السابقة، مع حفظ قراءة «بأمانة المسيح» في الحاشية.
- source_word: Χριστός
  choice: المسيح
  rationale: ينقل اللقب اليوناني بمعناه العربي المتعارف عليه بدل نسخه صوتيًا.
- source_word: πᾶσα σάρξ
  choice: أيُّ بشر
  rationale: ينقل مدلول التعبير الكتابي بوضوح في العربية المعاصرة، مع ذكر اللفظ الحرفي في الحاشية.
- source_word: εἰδότες δὲ
  choice: لكننا نعلم
  rationale: يؤدي قوة δέ الاستدراكية الخفيفة، ويحوّل التركيب الوصفي إلى جملة عربية واضحة متصلة بالسياق.
- source_word: ἐὰν μὴ
  choice: بل
  rationale: في هذا السياق الجدلي تؤدي «بل» المقابلة بين أعمال الشريعة والإيمان بصورة عربية سليمة، من غير الإيحاء بأن الإيمان نوع من أعمال الشريعة.
theological_decisions:
- issue: دلالة πίστεως Ἰησοῦ Χριστοῦ / πίστεως Χριστοῦ
  choice: الإيمان بيسوع المسيح / الإيمان بالمسيح
  alternative: أمانة يسوع المسيح / أمانة المسيح
  rationale: 'الإضافة اليونانية محل خلاف حقيقي: قد تدل على الإيمان الموجَّه إلى المسيح أو على أمانة المسيح نفسه. اختيرت القراءة الأولى في المتن وحُفظت الثانية في الحواشي دون حسم التوتر التفسيري.'
- issue: العلاقة التي تفيدها ἐὰν μὴ
  choice: 'مقابلة استدراكية: «بل بالإيمان»'
  alternative: «إلا بالإيمان»
  rationale: «بل» أوضح في العربية هنا، إذ تمنع فهم العبارة على أن الإيمان استثناء داخل فئة «أعمال الشريعة»، وتحفظ المقابلة المقصودة في السياق.
- issue: المفرد العام ἄνθρωπος
  choice: الإنسان
  alternative: إنسان / المرء
  rationale: «الإنسان» صياغة عربية جامعة وطبيعية تحفظ المفرد العام من غير تخصيصه بالذكر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «الشريعة» لـ νόμος في العبارة البولسية «أعمال الشريعة»، و«المسيح» لقبًا لـ Χριστός. وُضعت علامات الحواشي عقب العبارات التي تشرحها مباشرة، مع الحفاظ على التوازي والتكرار البلاغي في الآية.
