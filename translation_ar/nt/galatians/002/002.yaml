  verdict: revise
  source_fidelity: تحتاج المسودة إلى تصحيح محدود. «بَلْ» تفيد إضرابًا لا يسنده δέ هنا. كما أن «بِمُوجَبِ إِعْلَانٍ» ذات نبرة إدارية غير طبيعية، و«الذين لهم مكانة» أصرح من اللازم في إقرار مكانتهم، في حين أن τοῖς δοκοῦσιν يشير إلى من يُعَدّون كذلك.
  naturalness: 'الصياغة المقترحة أكثر سلاسة في العربية الفصحى المعاصرة: «استجابةً لوحي» و«على انفراد» و«بلا جدوى». ويزيل ترتيبها التباسًا ممكنًا في علاقة العرض الخاص بأصحاب الشأن.'
  terminology: «البشارة» و«غير اليهود» مناسبان للسياق. استُبدل «إعلان» بـ«وحي» لأنه المقابل العربي الأوضح والأشيع لـἀποκάλυψις في هذا السياق، من دون تحميله معنى مذهبيًا إضافيًا. وتحفظ «يُعَدّون ذوي شأن» مسافة δοκοῦσιν الدلالية.
  issues:
  - severity: medium
    issue: استعمال «بَلْ» في افتتاح الآية
    rationale: δὲ أداة وصل/انتقال هنا، ولا تدل على إضراب يصح نقله بـ«بل».
  - severity: medium
    issue: «بِمُوجَبِ إِعْلَانٍ»
    rationale: التعبير غير طبيعي في هذا السياق ويحمل نبرة قانونية أو إدارية؛ «استجابةً لوحي» ينقل علاقة الدافع التي في κατὰ ἀποκάλυψιν بوضوح.
  - severity: low
    issue: «الَّذِينَ لَهُمْ مَكَانَةٌ»
    rationale: قد يبدو تقريرًا مباشرًا لمكانتهم، بينما τοῖς δοκοῦσιν يصف من يُنظر إليهم أو يُعَدّون ذوي شأن.
  - severity: low
    issue: «عَبَثًا» في خاتمة الآية
    rationale: يمكن أن تفيد السعي بلا هدف، أما εἰς κενόν فتؤكد عدم الجدوى أو الثمر؛ «بلا جدوى» أدق وأوضح.
