base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: ar
  text: فَصَعِدْتُ اسْتِجَابَةً لِوَحْيٍ[a]، وَعَرَضْتُ عَلَيْهِمِ الْبِشَارَةَ الَّتِي أُبَشِّرُ بِهَا بَيْنَ غَيْرِ الْيَهُودِ؛ وَلَكِنْ عَرَضْتُهَا عَلَى انْفِرَادٍ عَلَى الَّذِينَ يُعَدُّونَ ذَوِي شَأْنٍ[b]، لِئَلَّا أَكُونَ أَسْعَى، أَوْ قَدْ سَعَيْتُ، بِلَا جَدْوَى[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بِسَبَبِ وَحْيٍ».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الَّذِينَ يَبْدُونَ ذَوِي نُفُوذٍ».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «خَوْفًا مِنْ أَنْ أَكُونَ أَسْعَى، أَوْ قَدْ سَعَيْتُ، بِلَا جَدْوَى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: صَعِدْتُ
  rationale: يحافظ على المعنى المكاني البسيط للفعل من غير إضافة الوجهة، لأنها مفهومة من السياق وليست مذكورة في هذه الآية.
- source_word: κατὰ ἀποκάλυψιν
  choice: بِمُوجَبِ إِعْلَانٍ
  rationale: ينقل أن الإعلان كان أساس الصعود أو الدافع إليه، مع إبقاء طبيعة العلاقة السببية غير محصورة في صياغة واحدة.
- source_word: ἀνεθέμην
  choice: عَرَضْتُ عَلَيْهِمْ
  rationale: يفيد وضع الأمر أمام الآخرين للنظر فيه، من غير أن يوحي حتمًا بالخضوع لسلطة تصحيحية أو بطلب اعتماد رسمي.
- source_word: τὸ εὐαγγέλιον
  choice: الْبِشَارَةَ
  rationale: تعبير عربي واضح وموجز يؤدي معنى الخبر السار في الاستعمال المسيحي المبكر.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: بَيْنَ غَيْرِ الْيَهُودِ
  rationale: المقصود في السياق الجماعات غير اليهودية، لا الأمم بوصفها كيانات سياسية.
- source_word: κατ’ ἰδίαν
  choice: عَلَى انْفِرَادٍ
  rationale: ينقل بوضوح أن العرض على أصحاب المكانة جرى في إطار خاص.
- source_word: τοῖς δοκοῦσιν
  choice: الَّذِينَ لَهُمْ مَكَانَةٌ
  rationale: يحفظ معنى الأشخاص المعتبرين أو ذوي الشأن، من غير الجزم بأن بولس يؤكد منزلتهم أو يلمّح إلى التحفظ عليها.
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: خَشْيَةَ أَنْ أَكُونَ أَسْعَى، أَوْ قَدْ سَعَيْتُ، عَبَثًا
  rationale: يحفظ صورة السعي ويميّز بين العمل الجاري والعمل السابق، مع نقل معنى انعدام الثمر.
theological_decisions:
- issue: هل كان عرض بولس لبشارته خضوعًا منه لتصحيح الرسل أو طلبًا لاعتمادهم؟
  choice: استُعمل «عَرَضْتُ عَلَيْهِمْ» بصياغة محايدة.
  alternative: «قَدَّمْتُهَا لَهُمْ لِيُقِرُّوهَا» أو «أَخْبَرْتُهُمْ بِهَا» بلا أي بُعد تقويمي.
  rationale: الفعل اليوناني يدل على وضع الأمر أمامهم، لكنه لا يحسم أنه طلب اعتماد رسمي، كما لا يستبعد تمامًا النظر والمداولة؛ لذلك تحفظ الصياغة التوتر القائم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «غير اليهود» لرفع الالتباس المعاصر في «الأمم»، وحُفظت استعارة السعي بدل تفسيرها مباشرة بالعمل أو الخدمة. وُضعت جميع علامات الحواشي في المتن.
