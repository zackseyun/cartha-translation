  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: ar
  text: لأن الذي عمل من خلال بطرس لأجل رسالة رسولية إلى أهل الختان[a]، عمل من خلالي أيضًا لأجل الأمم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لأجل رسالة الختان».'
    reason: lexical_alternative
  - marker: b
    text: 'أي غير اليهود؛ ويمكن ترجمتها: «الشعوب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: عمل / عمل
  rationale: حُفظ تكرار الفعل اليوناني نفسه لإبراز التوازي المقصود بين خدمة بطرس وخدمة بولس، من غير إضافة معنى «مكَّن» أو «عمل بفاعلية» غير المصرَّح به.
- source_word: Πέτρῳ / ἐμοὶ
  choice: بواسطة بطرس / بواسطتي
  rationale: 'فُهمت صيغة المجرور اليونانية هنا على المعنى الأداتي في السياق: الذي عمل مستخدمًا بطرس عمل مستخدمًا بولس أيضًا. وتحفظ «بواسطة» هذا المعنى بوضوح.'
- source_word: εἰς ἀποστολὴν
  choice: لأجل رسالة
  rationale: تعكس «رسالة» معنى ἀποστολή بوصفها مهمة وإرسالية رسولية، بينما تعبّر «لأجل» عن اتجاه العمل وغايته دون إثقال العبارة.
- source_word: τῆς περιτομῆς
  choice: إلى أهل الختان
  rationale: التركيب حرفيًا «رسالة الختان»، لكن «الختان» مستعمل مجازًا للدلالة على اليهود المختونين. أُبقيت صورة الختان بدل استبدالها مباشرة بكلمة «اليهود»، مع توضيح المقصود بلفظ «أهل».
- source_word: τὰ ἔθνη
  choice: الأمم
  rationale: «الأمم» ترجمة مباشرة تحفظ المصطلح البولسي والتقابل مع أهل الختان، ويُوضح الهامش أن المقصود في السياق غير اليهود.
theological_decisions:
- issue: هل يُصرَّح بأن الفاعل هو الله؟
  choice: الذي عمل
  alternative: الله الذي عمل
  rationale: النص اليوناني يستعمل اسم فاعل معرّفًا، أي «الذي عمل»، ولا يذكر اسم الله صراحة في هذه الآية. حُفظ هذا الأسلوب كي لا يُضاف اسم غير وارد، مع بقاء المرجع الإلهي مفهومًا من السياق.
- issue: طبيعة عمل الفاعل في بطرس وبولس
  choice: عمل بواسطة بطرس... وبواسطتي
  alternative: عمل في بطرس... وفيَّ
  rationale: اختير المعنى الأداتي الملائم لسياق الرسالة الرسولية، من غير توسيع العبارة إلى تمكين خاص أو حصرها في عمل داخلي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على التوازي اللفظي بين بطرس وبولس وعلى عدم التصريح باسم الفاعل، كما أبقت مصطلحي «الختان» و«الأمم» مع إيضاحهما في الهوامش.
