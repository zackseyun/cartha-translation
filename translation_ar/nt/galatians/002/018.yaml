  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: ar
  text: فَإِنَّنِي إِنْ عُدْتُ أَبْنِي مَا هَدَمْتُهُ، أُثْبِتُ نَفْسِي مُتَعَدِّيًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُظْهِرُ نَفْسِي مُتَعَدِّيًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: لأَنِّي إِنْ
  rationale: تحفظ «لأن» الصلة التفسيرية التي تؤديها γάρ بما سبق، وتحفظ «إن» القوة الشرطية لـ εἰ، مع تقديم ضمير المتكلم لسلامة الأسلوب العربي.
- source_word: ἃ ... ταῦτα
  choice: مَا ... ـهُ
  rationale: تؤدي «ما» الموصولة مع الضمير العائد بنية الارتباط بين ἃ وταῦτα في عربية طبيعية، من غير إثقال العبارة بتكرار «الأشياء».
- source_word: κατέλυσα
  choice: هَدَمْتُهُ
  rationale: يحفظ «هدم» صورة البناء المقابلة للفعل οἰκοδομῶ، ولا يفرض التفسير الأوسع «أبطلت» أو «ألغيت».
- source_word: πάλιν οἰκοδομῶ
  choice: عُدْتُ أَبْنِي
  rationale: تعبير عربي طبيعي ينقل معنى πάλιν مع المضارع οἰκοδομῶ، ويُبقي فعل البناء حاضرًا بدل اختزاله في تعبير قد يضعف الصورة البلاغية.
- source_word: παραβάτην
  choice: مُتَعَدٍّ
  rationale: ينقل الدلالة الأخلاقية والقانونية العامة لمن يتجاوز حدًّا أو وصية، من غير تضييق المرجع صراحةً إلى «الشريعة» حيث لم يذكرها النص في هذه الجملة.
- source_word: ἐμαυτὸν συνιστάνω
  choice: أُثْبِتُ أَنِّي
  rationale: ينقل معنى إظهار المرء نفسه أو إقامة الدليل على صفته، ويحافظ على قوة الإدانة الذاتية في تركيب عربي واضح.
theological_decisions:
- issue: تحديد ماهية ما هدمه بولس ثم يعيد بناءه
  choice: الإبقاء على التعبير العام «ما هدمته»
  alternative: التصريح بأنه نظام الشريعة أو الالتزام بأحكامها
  rationale: النص اليوناني يستعمل موصولًا عامًا وصورة هدم وبناء، أما تحديد المرجع تفصيلًا فمن السياق والتفسير؛ لذلك لا ينبغي إدخاله في المتن.
- issue: هل παραβάτης يعني تحديدًا كاسر الشريعة الموسوية؟
  choice: «متعدٍّ» من دون مضاف إليه
  alternative: «متعدٍّ على الشريعة» أو «كاسر للشريعة»
  rationale: يحفظ الاختيار المجال القانوني والأخلاقي للكلمة مع عدم إضافة مفعول لم يرد صراحةً، وبذلك يبقى التوتر التفسيري في سياق الرسالة قائمًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظت صورة الهدم والبناء، واستُعمل الضبط الجزئي لتفادي التباس «إن» و«أني» وقراءة «متعدٍّ».
