  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: ar
  text: ولكن بسبب الإخوة الكذبة[a] الذين أُدخلوا خفيةً، أولئك الذين تسلَّلوا ليتجسَّسوا على حريتنا التي لنا في المسيح يسوع، لكي يستعبدونا—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يحفظ تعبير «الإخوة الكذبة» وصف بولس العائلي؛ والمقصود أشخاص قدَّموا أنفسهم على أنهم من جماعة المؤمنين.
    reason: cultural_note
lexical_decisions:
- source_word: παρεισάκτους
  choice: الذين دُسُّوا بيننا
  rationale: يحفظ معنى إدخال أشخاص خفيةً من الخارج، ويُبقي الصيغة المبنية للمجهول، مع تمييزه عن الفعل التالي الدال على تسللهم.
- source_word: ψευδαδέλφους
  choice: الإخوة الكذبة
  rationale: ينقل الاستعارة العائلية وقوة وصف بولس، بدل تذويبها في تعبير عام مثل «المؤمنين الزائفين».
- source_word: παρεισῆλθον
  choice: تسلَّلوا
  rationale: تعبير عربي طبيعي ينقل الدخول سرًّا، ويظل متميزًا عن «دُسُّوا» السابقة.
- source_word: κατασκοπῆσαι
  choice: ليتجسَّسوا على
  rationale: يحفظ معنى المراقبة السرية ذات القصد المعادي.
- source_word: ἐλευθερίαν
  choice: حريتنا
  rationale: المقابل العربي المباشر والطبيعي، ويحفظ القوة اللاهوتية والاجتماعية للمصطلح.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: «المسيح» ترجمة لقب Χριστός في العربية، وترتيب العبارة يتبع الأصل اليوناني ويحفظ قوتها اللقبية.
- source_word: καταδουλώσουσιν
  choice: يستعبدونا
  rationale: ينقل بوضوح معنى إخضاع أشخاص للعبودية، من غير تلطيف صورة الاسترقاق.
- source_word: ἵνα ... καταδουλώσουσιν
  choice: لكي يستعبدونا
  rationale: ينقل غرض التسلل بعبارة عربية موجزة وطبيعية، مع أن اليونانية تستعمل صيغة مستقبلية بعد ἵνα.
theological_decisions:
- issue: هل يُنقل Χριστός بوصفه لقبًا أم اسمًا جامدًا؟
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: يحفظ ترتيب الأصل ويُسمع «المسيح» لقبًا ليسوع؛ ولا تحتاج العربية إلى مقابلة مختلفة بين «Messiah» و«Christ» لأن «المسيح» هو اللفظ العربي الطبيعي لكليهما.
- issue: هوية «الإخوة الكذبة»
  choice: الإبقاء على الوصف العائلي الجدلي من غير تقرير وضعهم الروحي تفصيلًا
  alternative: المؤمنون الزائفون
  rationale: النص يصفهم بأنهم ψευδάδελφοι، أي يقدمون أنفسهم ضمن جماعة الإخوة، لكنه لا يشرح هنا جميع الآثار اللاهوتية لهويتهم؛ لذلك تُحفظ حدة العبارة وغموضها.
translation_notes:
  register: صياغة فصحى معاصرة واضحة ومحترمة. أُبقيت الشرطة الختامية لأن الآية جزء من تركيب نحوي يستمر في الآية التالية، كما في النص اليوناني.
