id: GAL.2.21
reference: Galatians 2:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: ar
  text: لا أُبطِل نعمة الله؛ لأنه إن كان البرّ يأتي بواسطة الشريعة، فقد مات المسيح عبثًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بلا داعٍ» أو «من غير جدوى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: أُبطِل
  rationale: ينقل معنى إلغاء الفاعلية أو إبطال المفعول، وهو ملائم لحجة بولس أكثر من تعبير قد يقتصر على مجرد الرفض.
- source_word: χάριν
  choice: نعمة
  rationale: المقابل العربي المألوف والدقيق في هذا السياق البولسي، ويحفظ معنى إحسان الله غير المستحق.
- source_word: διὰ νόμου
  choice: بواسطة الشريعة
  rationale: يحفظ دلالة διά مع المضاف إليه على الوساطة، مع صياغة عربية واضحة؛ وحذف أداة التعريف في اليونانية لا يقتضي تنكير الشريعة هنا في سياق الرسالة.
- source_word: δικαιοσύνη
  choice: البرّ
  rationale: هو المقابل العربي الكتابي والطبيعي في الاستعمال البولسي، ويترك مدى المصطلح اللاهوتي دون توسيع تفسيري.
- source_word: Χριστὸς
  choice: المسيح
  rationale: ينقل اللقب اليوناني بمعناه المسّياني المألوف في العربية، بدل معاملته اسمًا مجردًا.
- source_word: δωρεὰν
  choice: عبثًا
  rationale: يعبّر في هذا السياق عن انعدام الجدوى، وهو موجز وطبيعي ويحفظ قوة نتيجة الشرط.
theological_decisions:
- issue: علاقة البرّ بالشريعة في حجة بولس
  choice: 'صياغة الشرط كما في اليونانية: إن كان البرّ يأتي بواسطة الشريعة، لزم أن موت المسيح كان عبثًا.'
  alternative: فهم δικαιοσύνη بمعنى العدل، أو توسيع العبارة لتصرّح بكيفية نوال التبرير.
  rationale: يحفظ النص حدة الاستدلال والتوتر اللاهوتي من غير أن يضيف إليه شرحًا مذهبيًا أو يحسم المجال الدلالي للمصطلح بما يتجاوز الأصل.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. استُعمل «البرّ» و«الشريعة» و«المسيح» بوصفها ألفاظًا كتابية مألوفة، مع تجنب التفسير العقائدي الزائد.
