translation:
  language: ar
  text: وكان الطلب الوحيد أن نذكر الفقراء، وهذا بعينه ما حرصتُ على فعله.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: فقط
  rationale: تفيد أن تذكّر الفقراء كان الشرط أو الطلب الوحيد المضاف إلى الاتفاق، و«فقط» أوضح مقابل عربي طبيعي.
- source_word: τῶν πτωχῶν
  choice: الفقراء
  rationale: تشير إلى الأشخاص المفتقرين ماديًا، و«الفقراء» هي العبارة المباشرة والمألوفة في سياق الرعاية العملية.
- source_word: ἵνα μνημονεύωμεν
  choice: أن نذكر
  rationale: تبيّن مضمون الطلب الوحيد. وتحافظ «نذكر» على صورة الأصل، مع دلالة السياق على الاهتمام العملي لا مجرد الاستحضار الذهني.
- source_word: ὃ
  choice: وهذا
  rationale: يعود الضمير الموصول على الطلب السابق كله؛ وصيغته في العربية بـ«وهذا» تحقق ربطًا طبيعيًا واضحًا.
- source_word: ἐσπούδασα
  choice: حرصتُ
  rationale: ينقل الفعل معنى الجد والاستعداد المقترن بالسعي، بصياغة عربية فصيحة وطبيعية.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: بعينه ما حرصتُ على فعله
  rationale: يحفظ توكيد العبارة اليونانية على أن هذا الأمر نفسه، لا أمرًا آخر، هو ما كان بولس حريصًا على فعله.
theological_decisions:
- issue: مدلول «نذكر الفقراء»
  choice: الإبقاء على «نذكر» دون توسيعها داخل النص إلى إعانة أو تبرع
  alternative: أن نهتم بالفقراء أو نعين الفقراء
  rationale: اللفظ اليوناني هو «نذكر»، وإن كان السياق يرجّح تذكّرًا يتجسد في الرعاية العملية؛ إبقاء اللفظ يصون دلالة الأصل من غير حصر كيفية العمل.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموقرة. استُعمل التركيب «على أن» لعرض الشرط الوحيد المتبقي بصورة طبيعية، وحُفظ الانتقال من صيغة الجمع «نذكر» إلى المتكلم المفرد «حرصتُ» كما في الأصل.
