id: GAL.2.17
reference: Galatians 2:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: ar
  text: ولكن إن كنا، ونحن نسعى أن نتبرّر في المسيح[a]، قد وُجدنا نحن أيضًا خطاة، أفَيكون المسيح إذًا خادمًا للخطيئة؟ حاشا!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» تعني «الممسوح»، أي المسيّا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: ونحن نسعى
  rationale: يحافظ على دلالة اسم الفاعل المعاصر للفعل الرئيس، بصياغة عربية طبيعية.
- source_word: δικαιωθῆναι
  choice: أن نتبرّر
  rationale: ينقل المصطلح البولسي بصيغة المبني للمجهول، من غير حسم تفسيري زائد مثل «أن نُعلَن أبرارًا».
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: يحافظ على العبارة البولسية الموجزة وعلى ما فيها من سعة دلالية تتصل بالعلاقة بالمسيح، دون شرحها داخل المتن.
- source_word: εὑρέθημεν
  choice: قد وُجدنا
  rationale: يصون المبني للمجهول والقوة البلاغية للنص، من غير تحويله إلى «ثبت أننا» بما قد يزيد التفسير.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: نحن أيضًا خطاة
  rationale: يُبرز توكيد αὐτοὶ بالضمير المنفصل، ويحافظ على καὶ بمعنى «أيضًا».
- source_word: ἁμαρτίας διάκονος
  choice: خادمًا للخطيئة
  rationale: «خادم» مقابل طبيعي لـ διάκονος هنا، وينقل علاقة الخدمة من غير إيحاء بمنصب كنسي رسمي.
- source_word: μὴ γένοιτο
  choice: حاشا!
  rationale: صيغة عربية راسخة وقوية للرفض القاطع، تلائم القوة الإنشائية للعبارة اليونانية.
theological_decisions:
- issue: هل تفيد العبارة أن المسيح يسبّب الخطيئة؟
  choice: أفَيكون المسيح إذًا خادمًا للخطيئة؟
  alternative: أفالمسيح إذًا خادم للخطيئة؟
  rationale: تُبقي الصياغة الكلام في صورة سؤال استنكاري عن نتيجة محتملة، لا تقريرًا عقائديًا بأن المسيح يُنشئ الخطيئة.
- issue: دلالة ἐν Χριστῷ
  choice: في المسيح
  alternative: بالمسيح
  rationale: «في المسيح» تحفظ الغموض الدلالي المقصود في حرف الجر، ولا تختزله في الوسيلة وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «حاشا» لقوة الرفض وشيوعها في الأسلوب الكتابي العربي، مع إبقاء تركيب «في المسيح» والتوتر اللاهوتي في السؤال من غير تفسير زائد.
