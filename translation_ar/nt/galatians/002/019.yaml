  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: ar
  text: فإني بالشريعة متُّ عن الشريعة لكي أحيا لله؛ وقد صُلِبتُ مع المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: فإنني
  rationale: تفيد تعليل الكلام السابق وتحافظ على ترابط الحجة بصياغة عربية طبيعية.
- source_word: διὰ νόμου
  choice: بالشريعة
  rationale: تنقل διά مع المضاف إليه بمعناها الوسيلي، وتفهم νόμος في السياق البولسي على أنها الشريعة دون زيادة تفسيرية.
- source_word: νόμῳ
  choice: للشريعة
  rationale: تحافظ على العبارة المكثفة «متُّ للشريعة» وعلى دلالة انقطاع العلاقة بسلطانها، من غير شرح تفسيري داخل النص.
- source_word: ἀπέθανον
  choice: متُّ
  rationale: ينقل الفعل الماضي حدثًا حاسمًا في حجة بولس.
- source_word: ἵνα
  choice: لكي
  rationale: تعبّر بوضوح عن الغاية المقصودة.
- source_word: θεῷ ζήσω
  choice: أحيا لله
  rationale: تحافظ على اتجاه الحياة نحو الله وعلاقتها به، ولا تختزل العبارة في معنى المنفعة وحده.
- source_word: Χριστῷ
  choice: مع المسيح
  rationale: المسيح هو المقابل العربي الطبيعي للقب Χριστός، وحرف «مع» جزء من معنى الفعل المركب συνεσταύρωμαι.
- source_word: συνεσταύρωμαι
  choice: قد صُلِبتُ مع
  rationale: البناء للمجهول يحفظ وقوع الصلب على المتكلم، و«قد» مع الماضي تساعد على إبراز الحدث السابق ذي الأثر القائم، بما يلائم صيغة التام اليونانية.
theological_decisions:
- issue: هل تُشرح عبارة «بالشريعة متُّ للشريعة» داخل المتن؟
  choice: الإبقاء على العبارة الموجزة كما هي
  alternative: بالشريعة وحكمها متُّ لسلطان الشريعة
  rationale: النص اليوناني موجز ويحمل توترًا لاهوتيًا مقصودًا؛ والتوسيع سيحسم تفسيرًا لا يصرح به النص.
- issue: دلالة صيغة التام في συνεσταύρωμαι
  choice: وقد صُلِبتُ مع المسيح
  alternative: أنا مصلوب مع المسيح
  rationale: الصياغة المختارة تجمع بين حدث الصلب السابق والإيحاء بأثره القائم، من غير تحويل الفعل إلى وصف ساكن فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الشريعة» بدل «الناموس» لقربها من القارئ المعاصر، مع الحفاظ على الإيجاز والتركيب اللاهوتي الكثيف في الأصل.
