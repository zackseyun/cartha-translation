source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: ar
  text: ولمّا أدرك يعقوب وكيفا[a] ويوحنا، الذين يُعَدّون أعمدةً، النعمة التي وُهِبت لي، مدّوا إليّ وإلى برنابا أيديهم اليمنى للشركة[b]، لكي نذهب نحن إلى الأمم[c]، وهم إلى أهل الختان[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي بطرس.
    reason: توضيح الاسم السامي المنقول في النص اليوناني.
  - marker: b
    text: 'حرفيًا: «أعطوا ... الأيدي اليمنى للشركة»، وهي عبارة تدل على مصافحةٍ علامةً على الاتفاق والمشاركة.'
    reason: بيان الصورة الاصطلاحية والمحافظة على الجمع في الأصل.
  - marker: c
    text: 'أي غير اليهود؛ ويمكن ترجمتها أيضًا: «الشعوب».'
    reason: بيان الدلالة السياقية والبديل المعجمي.
  - marker: d
    text: 'حرفيًا: «الختان»، والمقصود هنا اليهود.'
    reason: توضيح المجاز المرسل في الأصل.
lexical_decisions:
- source_word: γνόντες
  choice: أدركوا
  rationale: يفيد الفعل هنا معرفة النعمة والاعتراف بها أساسًا لما تلا؛ و«أدركوا» تؤدي معنى التبيّن دون إضافة تفسير عقائدي.
- source_word: χάριν
  choice: النعمة
  rationale: يحافظ على لفظ بولس الواسع للدلالة على عطاء الله وتفضله، من غير حصره في التكليف الرسولي وحده.
- source_word: δοθεῖσάν μοι
  choice: التي وُهِبت لي
  rationale: صيغة المبني للمجهول تحفظ كون النعمة عطية سابقة على اتفاقهم، و«وُهِبت» عربية طبيعية في هذا السياق.
- source_word: Κηφᾶς
  choice: كيفا
  rationale: ينقل الاسم الوارد في النص اليوناني بدل استبداله بالاسم المقابل الأشهر «بطرس»؛ وتوضح الحاشية هويته.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: الذين يُعَدّون أعمدة
  rationale: يحفظ معنى مكانتهم المعترف بها من غير أن يضفي على العبارة نبرة ازدراء أو شك غير لازمة.
- source_word: δεξιὰς ... κοινωνίας
  choice: أيديهم اليمنى توثيقًا للشركة
  rationale: يحفظ جمع «الأيدي اليمنى» ويعبّر عربيًا عن المصافحة بوصفها علامة اتفاق ومشاركة في العمل.
- source_word: ἔθνη
  choice: الأمم
  rationale: هو المقابل العربي المألوف، ويشير في السياق إلى غير اليهود مع إبقاء اللفظ الأوسع ظاهرًا.
- source_word: περιτομήν
  choice: أهل الختان
  rationale: ينقل المجاز الذي يطلق «الختان» على اليهود، مع صياغة عربية واضحة لا تحوّل المقصود إلى فعل الختان نفسه.
theological_decisions:
- issue: دلالة κοινωνία في اتفاق الرسل
  choice: الشركة
  alternative: الشراكة
  rationale: «الشركة» تحافظ على معنى المشاركة والارتباط في الرسالة، بينما قد توحي «الشراكة» الحديثة بعلاقة تجارية؛ وتوضح العبارة أن مد الأيدي وثّق الاتفاق.
- issue: قوة οἱ δοκοῦντες في وصف يعقوب وكيفا ويوحنا
  choice: الذين يُعَدّون أعمدة
  alternative: الذين بدا أنهم أعمدة
  rationale: العبارة تشير إلى مكانتهم المعترف بها، ولا يلزم منها أن بولس ينفي حقيقة تلك المكانة أو يسخر منها.
- issue: تقسيم مجال الرسالة بين الأمم وأهل الختان
  choice: على أن نتوجّه نحن إلى الأمم، وهم إلى أهل الختان
  alternative: لكي نذهب نحن إلى الأمم، وهم إلى الختان
  rationale: يحافظ على الاتفاق في وجهة العمل من غير أن يضيف حصرًا مطلقًا أو انفصالًا لاهوتيًا لا ينص عليه العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «مدّ ... أيديهم اليمنى» بدل النقل الحرفي الجامد، مع إبقاء صورة المصافحة وجمع الأيدي، وحُفظ التوازي بين «الأمم» و«أهل الختان».
