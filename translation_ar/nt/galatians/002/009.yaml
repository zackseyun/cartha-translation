  source_fidelity: 'المعنى العام أمين للنص اليوناني: النعمة الموهوبة لبولس، والأسماء، ومكانتهم المعترف بها، وإشارة الأيدي اليمنى، والتوزيع بين الأمم وأهل الختان كلها محفوظة. لكن «توثيقًا للشركة» توسّع تفسيري يجعل الشركة هي الشيء الموثَّق، في حين أن الإضافة اليونانية تصف الأيدي بأنها أيدٍ «للشركة/علامةً للشركة».'
