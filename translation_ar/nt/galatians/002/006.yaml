id: GAL.2.6
reference: Galatians 2:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: ar
  text: أَمّا الذين كانوا يُعَدّون ذوي شأن[a]—فمهما كانت منزلتهم من قبل، لا فرق عندي؛ فالله لا يحابي أحدًا[b]—فإن أولئك المعتبرين لم يضيفوا إليَّ شيئًا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين كانوا يبدون ذوي شأن».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «الله لا يأخذ وجه إنسان»، وهو تعبير اصطلاحي معناه أن الله لا يحابي أحدًا.'
    reason: cultural_note
  - marker: c
    text: 'أو: «لم يفرضوا عليَّ شيئًا إضافيًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: الذين كانوا يُعَدّون ذوي شأن / أولئك المعتبرين
  rationale: ينقل هذا التعبير مكانتهم في نظر الناس مع إبقاء مسافة بولس البلاغية، من غير إنكار صريح لقيادتهم أو تحويل العبارة إلى تهكم حاد.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: مهما كانت منزلتهم من قبل
  rationale: يعبّر عن عدم اعتداد بولس بمنزلتهم السابقة، ويؤدي ποτε بعبارة عربية طبيعية من غير المبالغة في تقرير تغير زمني حاد.
- source_word: οὐδέν μοι διαφέρει
  choice: لا فرق عندي
  rationale: تعبير عربي موجز وطبيعي يحفظ معنى أن منزلتهم لا تؤثر في حكم بولس.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: فالله لا يحابي أحدًا
  rationale: ينقل معنى الاصطلاح اليوناني، أي إن الله لا يفضّل شخصًا لمكانته أو مظهره، بدل ترجمته الحرفية المضللة.
- source_word: ἐμοὶ γὰρ
  choice: فإن ... إليَّ
  rationale: أُبقيت دلالة الغرض الشخصي في «إليَّ»، وأدّت الفاء مع «إن» وظيفة γάρ في وصل النتيجة بتجربة بولس.
- source_word: οὐδὲν προσανέθεντο
  choice: لم يضيفوا إليَّ شيئًا
  rationale: يحفظ العبارة موجزة وقريبة من الأصل، ولا يحسم هل المقصود إضافة إلى رسالة بولس أم فرض متطلبات أخرى عليه.
theological_decisions:
- issue: هل تحمل العبارة ازدراءً لقادة أورشليم أم تؤكد استقلال بولس عن مكانتهم؟
  choice: صياغة تحافظ على نبرة التباعد التي عند بولس من غير الطعن الصريح في شرعية قيادتهم.
  alternative: 'يمكن أن تُصاغ بحدة أكبر: «الذين كانوا يبدون مهمين»، أو بلطف أكبر: «القادة المعترف بهم».'
  rationale: محور كلام بولس أن مكانتهم لم تحدد صحة إنجيله ولم تضف إليه، لا أنه يصرح ببطلان قيادتهم.
- issue: تحديد معنى προσανέθεντο
  choice: لم يضيفوا إليَّ شيئًا
  alternative: لم يفرضوا عليَّ شيئًا إضافيًا
  rationale: الصياغة المختارة تبقي المجال الدلالي مفتوحًا بين عدم الإضافة إلى رسالة بولس وعدم إلزامه بشروط أخرى، فلا تحسم توتر النص لمصلحة تفسير واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت الشرطتان للاحتفاظ بالجملة الاعتراضية وبشيء من تركيب الأصل المتقطع، مع ترتيب علامات الحواشي بحسب مواضعها في النص العربي.
