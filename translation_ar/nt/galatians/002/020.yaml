source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: ar
  text: فما عدتُ أنا أحيا، بل المسيح يحيا فيَّ. والحياة التي أحياها الآن في الجسد، أحياها بالإيمان بابن الله[a]، الذي أحبني وبذل نفسه من أجلي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأمانة ابن الله».'
    reason: قراءة بديلة لتركيب يوناني يحتمل «الإيمان بابن الله» أو «أمانة ابن الله».
lexical_decisions:
- source_word: Χριστός
  choice: المسيح
  rationale: ترجمة اللقب اليوناني بمعناه العربي المألوف، مع الحفاظ على وظيفته المسيانية في السياق.
- source_word: ὃ δὲ νῦν ζῶ
  choice: والحياة التي أحياها الآن
  rationale: التركيب اليوناني الموصول محايد وموجز، ويُفهم منه «الحياة التي أحياها»؛ صيغ بالعربية على نحو طبيعي من غير زيادة تفسيرية.
- source_word: ἐν σαρκί
  choice: في الجسد
  rationale: يدل السياق على الوجود البشري الأرضي المتجسد، لا على «الطبيعة الخاطئة» تحديدًا؛ و«في الجسد» تعبير عربي واضح يحفظ المصطلح البولسي.
- source_word: πίστει
  choice: بالإيمان
  rationale: يحفظ المعنى المعجمي المعتاد، مع إبقاء احتمال «الأمانة» في الحاشية بسبب غموض تركيب المضاف إليه.
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: بابن الله
  rationale: 'اعتمد المتن قراءة المضاف إليه على أنه متعلَّق الإيمان: الإيمان بابن الله، وهي قراءة واضحة وشائعة؛ وحُفظت القراءة الذاتية البديلة في الحاشية.'
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: بذل نفسه من أجلي
  rationale: «بذل نفسه» تعبير عربي طبيعي ودقيق عن التسليم الذاتي الطوعي، و«من أجلي» تنقل الدلالة النيابية/النفعية لـ ὑπέρ من غير الإفراط في تفسيرها.
theological_decisions:
- issue: دلالة πίστις مع المضاف إليه في τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: بالإيمان بابن الله
  alternative: بأمانة ابن الله
  rationale: التركيب اليوناني يحتمل أن يكون ابن الله متعلَّق الإيمان أو صاحب الأمانة. اختيرت القراءة الأولى في المتن لوضوحها وشيوعها، مع إثبات الثانية في الحاشية حفاظًا على الغموض الحقيقي والتوتر اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «بَعْدُ» بمعنى «فيما بعد/من الآن فصاعدًا»، و«الجسد» للوجود الأرضي المتجسد. وُضع مؤشر الحاشية مباشرة بعد العبارة موضع الغموض.
