  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: ar
  text: فإنه، قبل أن يأتي أناسٌ من عند يعقوب[a]، كان يأكل مع الأمم؛ ولكن لما أتوا، أخذ يتراجع ويعزل نفسه، خوفًا من أهل الختان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: من جهة يعقوب أو من جماعته؛ واليونانية لا تحدد بذاتها هل أرسلهم يعقوب رسميًا.'
    reason: alternative_reading
  - marker: b
    text: 'ويجوز: جماعة الختان.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ γὰρ ἐλθεῖν
  choice: فلأنه قبل أن يأتي
  rationale: يحفظ العلاقة التعليلية التي تفيدها γάρ، ويؤدي تركيب πρό مع المصدر المعرّف بصياغة عربية زمنية طبيعية.
- source_word: τινας
  choice: أناسٌ
  rationale: يدل الضمير اليوناني المذكر الجمع على أشخاص غير معيّنين؛ و«أناس» عربية واضحة لا تضيف تحديدًا غير موجود في النص.
- source_word: ἀπὸ Ἰακώβου
  choice: من عند يعقوب
  rationale: تنقل معنى المصدر أو جهة القدوم، مع إبقاء احتمال الصلة بيعقوب دون الجزم بأنه أرسلهم رسميًا أو أقر موقفهم.
- source_word: μετὰ τῶν ἐθνῶν
  choice: مع الأمم
  rationale: «الأمم» المقابل العربي الكتابي الواضح لاستعمال ἔθνη في هذا السياق، ولا يضيف وصف «المؤمنين» غير المذكور صراحة.
- source_word: συνήσθιεν
  choice: كان يأكل
  rationale: تركيب «كان» مع المضارع ينقل دلالة الماضي الناقص على العادة أو الاستمرار.
- source_word: ὑπέστελλεν
  choice: أخذ يتراجع
  rationale: يعبر عن الشروع والحركة المتدرجة إلى الوراء، بما يلائم دلالة الفعل وصيغة الماضي الناقص في السياق.
- source_word: ἀφώριζεν ἑαυτόν
  choice: ويعتزل
  rationale: يؤدي معنى فصل نفسه اجتماعيًا عنهم بصياغة عربية طبيعية، والفاعل المستتر يحفظ القوة الانعكاسية في السياق.
- source_word: φοβούμενος
  choice: خوفًا من
  rationale: مصدر تعليلي موجز يبيّن أن الخوف كان دافع سلوكه، كما يفيده اسم الفاعل اليوناني في السياق.
- source_word: τοὺς ἐκ περιτομῆς
  choice: أهل الختان
  rationale: تعبير عربي موجز يعرّف الجماعة بالختان من غير أن يضيف صراحة مفهوم الحزب أو الفصيل.
theological_decisions:
- issue: هل تفيد عبارة ἀπὸ Ἰακώβου أن يعقوب أرسل هؤلاء رسميًا أو أيّدهم؟
  choice: من عند يعقوب
  alternative: مرسَلون من يعقوب
  rationale: النص يدل على جهة القدوم أو الصلة، لكنه لا يصرّح بالتكليف الرسمي؛ لذلك تُحفظ المسؤولية المحتملة ليعقوب دون حسم.
- issue: هل يُسمّى المذكورون في τοὺς ἐκ περιτομῆς حزبًا محددًا؟
  choice: أهل الختان
  alternative: جماعة الختان
  rationale: اليونانية تعرّفهم بعلاقتهم بالختان ولا تستخدم لفظًا صريحًا بمعنى الحزب؛ فالصياغة المختارة تتجنب فرض توصيف اجتماعي أقوى من النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «كان يأكل» لإظهار العادة الماضية، و«أخذ يتراجع» لإبراز التدرج، مع إبقاء الغموض المتعلق بصلة القادمين بيعقوب وطبيعة أهل الختان.
