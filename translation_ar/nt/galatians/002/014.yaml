  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: ar
  text: 'لكن حين رأيت أنهم لا يسيرون باستقامة في انسجام مع حق البشارة[a]، قلت لكِيفَا أمام الجميع: «إن كنت أنت، مع أنك يهودي، تعيش كغير اليهود لا كاليهود، فكيف تُلزم غير اليهود أن يعيشوا كاليهود[b]؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بصورة أقرب إلى اللفظ: «لا يمشون باستقامة بما يوافق حق البشارة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أن يتهودوا»، أي أن يتخذوا طريقة عيش اليهود.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: يسلكون بما يتفق
  rationale: يحمل الفعل صورة المشي في طريق مستقيم، ويشير في السياق إلى سلوك منسجم مع معيار الحق. تحفظ «يسلكون» صورة السلوك، وتوضح «بما يتفق» معنى الاستقامة والانسجام في عربية طبيعية.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: بما يتفق مع حق البشارة
  rationale: تفيد πρός مع فعل ὀρθοποδεῖν موافقة السلوك لحق البشارة، لا مجرد الاتجاه المكاني نحوه.
- source_word: Κηφᾷ
  choice: كِيفَا
  rationale: نُقل الاسم الآرامي الذي استخدمه بولس بدل استبداله باسم بطرس.
- source_word: ἐθνικῶς
  choice: كغير اليهود
  rationale: الظرف يصف طريقة العيش. وهذه الصياغة واضحة للقارئ العربي وتحفظ المقابلة العرقية والاجتماعية في السياق.
- source_word: Ἰουδαϊκῶς
  choice: كاليهود
  rationale: حُفظ التوازي المقابل مع «كغير اليهود» في عبارة عربية موجزة وطبيعية.
- source_word: ἀναγκάζεις
  choice: تُلزم
  rationale: تعبر «تُلزم» عن الضغط والإكراه العملي الذي يفيده الفعل، من غير مبالغة في تصويره كقوة مادية مباشرة.
- source_word: Ἰουδαΐζειν
  choice: أن يعيشوا كاليهود
  rationale: المقصود اتخاذ طريقة عيش يهودية، ولا سيما في سياق الممارسات الفاصلة بين اليهود وغير اليهود. الصياغة واضحة ولا تُدخل في النص دلالات جدلية لاهوتية متأخرة.
theological_decisions:
- issue: كيفية ترجمة Ἰουδαΐζειν من غير تحميله جدلًا عقائديًا متأخرًا
  choice: أن يعيشوا كاليهود
  alternative: أن يتهودوا
  rationale: يبقي الاختيار التركيز على طريقة العيش والممارسات اليهودية في السياق المباشر، بينما تُذكر الترجمة اللفظية المألوفة في الحاشية من غير فرض معنى التحول الديني الكامل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «حق البشارة» للمحافظة على الإضافة اليونانية، و«غير اليهود» لتوضيح المقصود من «الأمم» للقارئ المعاصر. بقي سؤال بولس مباشرًا بصيغة «فكيف» دون تحويله إلى سؤال عن القدرة.
