  text: And the rest of the Jews also joined him in hypocrisy[b][a], so that even Barnabas was carried away by their hypocrisy.
translation:
  language: ar
  text: وشاركَه سائرُ اليهود أيضًا في الرياء، حتى إن برنابا نفسه انساق وراء ريائهم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حتى إن برنابا نفسه انجرف معهم في ريائهم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: شاركَه ... في الرياء
  rationale: ينقل الفعل المركب معنى الاشتراك مع بطرس في السلوك المرائي، مع الحفاظ على القوة الجماعية للسابقة σύν- بصياغة عربية طبيعية.
- source_word: αὐτῷ
  choice: ـه في «شاركَه»
  rationale: تدل صيغة المجرور اليونانية على المصاحبة والاشتراك مع بطرس، ويؤديها الضمير المتصل في العربية بوضوح.
- source_word: οἱ λοιποὶ Ἰουδαῖοι
  choice: سائرُ اليهود
  rationale: «سائر» تدل هنا على بقية اليهود المذكورين ضمنيًا في الجماعة، لا على سكان اليهودية فحسب.
- source_word: συναπήχθη
  choice: انجرف معهم
  rationale: يحافظ على معنى التأثر بالآخرين والانقياد معهم، ويعبّر بصورة طبيعية عن الضغط الاجتماعي الكامن في المبني للمجهول اليوناني.
- source_word: τῇ ὑποκρίσει
  choice: بسبب ريائهم
  rationale: يُفهم التركيب على أن رياءهم كان الوسيلة أو العامل الذي جرّ برنابا معهم؛ وتبقي «الرياء» المصطلح الأخلاقي الصريح في الأصل.
theological_decisions:
- issue: طبيعة سلوك بطرس واليهود الآخرين
  choice: الرياء
  alternative: التظاهر أو عدم الإخلاص
  rationale: يسمي النص السلوك رياءً صراحة، ولذلك لا ينبغي تخفيف حكم بولس الأخلاقي عليه.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ومهيبة. استُخدم «شاركَه ... في الرياء» لإبراز الفعل الجماعي، و«انجرف معهم» لنقل أثر الجماعة في برنابا دون تحميل العبارة معنى عقائديًا زائدًا.
