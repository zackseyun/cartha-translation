  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: ar
  text: ولكن حين جاء كيفا إلى أنطاكية[a]، واجهته وجهًا لوجه، لأنه كان مُدانًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: كيفا هو الاسم الآرامي لبطرس.
    reason: cross_reference
  - marker: b
    text: 'أو: «لأنه كان واضح الخطأ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: ولكن لما
  rationale: ينقل الانتقال الزمني مع معنى المقابلة الخفيف في δέ بصياغة عربية طبيعية.
- source_word: Κηφᾶς
  choice: كيفا
  rationale: ينقل صيغة الاسم الواردة في النص اليوناني بدل استبدالها ببطرس، مع توضيح هويته في الحاشية.
- source_word: ἦλθεν
  choice: جاء
  rationale: مقابل عربي مباشر وطبيعي للفعل في هذا السياق.
- source_word: εἰς Ἀντιόχειαν
  choice: إلى أنطاكية
  rationale: الصياغة العربية المألوفة للحركة نحو مدينة.
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: مواجهةً
  rationale: تؤدي معنى المواجهة المباشرة والصريحة بإيجاز طبيعي، من غير أن توهم مجرد وجود الشخصين وجهًا لوجه.
- source_word: ἀντέστην
  choice: قاومته
  rationale: يحفظ قوة الوقوف ضده علنًا، وهو تعبير عربي واضح في السياق.
- source_word: ὅτι
  choice: لأنه
  rationale: يقدم سبب مقاومة بولس بوضوح.
- source_word: κατεγνωσμένος ἦν
  choice: كان مستحقًّا للوم
  rationale: يعكس الحالة الناتجة التي تدل عليها الصيغة المركبة، ويحفظ احتمال أن المعنى هو ثبوت الخطأ أو استحقاق الإدانة دون الجزم بأن حكمًا قضائيًا صدر عليه.
theological_decisions:
- issue: هوية وصياغة Κηφᾶς
  choice: إبقاء «كيفا» في المتن
  alternative: استعمال «بطرس» لكونه أشهر لدى القراء
  rationale: النص اليوناني يورد Κηφᾶς، فالحفاظ على صورة الاسم أقرب إلى المصدر، بينما توضح الحاشية أنه الاسم الآرامي لبطرس.
- issue: دلالة κατεγνωσμένος ἦν
  choice: كان مستحقًّا للوم
  alternative: كان مُدانًا؛ أو كان مخطئًا بوضوح
  rationale: العبارة اليونانية تحتمل معنى كونه واقعًا تحت الإدانة أو ثبوت خطئه. يحافظ المتن والحاشية على هذا التوتر من غير تحميل العبارة حكمًا عقائديًا أوسع.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت «مواجهةً» لنقل صراحة المواجهة، وأُبقي اسم «كيفا» وفق صورة المصدر مع بيان الاسم الأشهر في الحاشية.
