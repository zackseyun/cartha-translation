lexical_decisions:
- source_word: Ἡμεῖς
  choice: نحن
  rationale: أُبقي الضمير الصريح للمحافظة على النبرة الشخصية وما فيها من توكيد خفيف، من غير مبالغة في إظهاره.
- source_word: φύσει
  choice: بالولادة
  rationale: تدل الكلمة هنا على الأصل القومي الطبيعي، لا على الطبيعة الأخلاقية الباطنة. و«بالولادة» تعبير عربي واضح يؤدي المعنى المقصود.
- source_word: Ἰουδαῖοι
  choice: يهودٌ
  rationale: ينقل الاسم الهوية القومية مباشرة ويحفظ المقابلة مع الأمم.
- source_word: ἐξ ἐθνῶν
  choice: من بين الأمم
  rationale: تحفظ الصياغة معنى حرف الجر والمقابلة القومية مع اليهود. و«الأمم» هو التعبير الكتابي العربي المألوف لغير اليهود في هذا السياق.
- source_word: ἁμαρτωλοί
  choice: خطاةً
  rationale: يحفظ المصطلح المباشر والمألوف، ويعكس صيغة التمييز اليهودية الواردة في السياق من غير تلطيف تفسيري.
theological_decisions:
- issue: هل ينبغي أن تبدو العبارة إقرارًا من بولس بتفوق اليهود الأخلاقي على غير اليهود؟
  choice: حُفظت المقابلة القومية المقتضبة كما وردت، من غير تحويلها إلى تقرير عن برّ فطري لليهود.
  alternative: لسنا ممن يُعَدّون خطاةً مثل الأمم
  rationale: النص اليوناني يذكر المقابلة مباشرة وبإيجاز، والسياق اللاحق يقيّد دلالتها؛ لذلك لا ينبغي إدخال ذلك التقييد التفسيري في هذه الآية نفسها.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. استُعمل «بالولادة» بدل «بالطبيعة» لتجنب إيحاء أخلاقي غير مقصود، مع إثبات المعنى الحرفي في الحاشية. وُضعت علامتا الحاشيتين في المتن.
