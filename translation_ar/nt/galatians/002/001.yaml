  register: عربية فصحى معاصرة واضحة وكريمة. حوفظ على «صعدتُ» بدل تسويته إلى «ذهبتُ»، وعلى ترتيب المعنى الذي يميّز مصاحبة برنابا عن اصطحاب تيطس.
