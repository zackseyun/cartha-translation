  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: ar
  text: ثم بعد أربع عشرة سنة صعدتُ مرة أخرى إلى أورشليم مع برنابا، وأخذتُ معي تيطس أيضًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: ثم
  rationale: أداة ربط طبيعية تواصل تسلسل رواية بولس وتحافظ على معنى التعاقب.
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: بعد أربع عشرة سنة
  rationale: ينقل الاستعمال الزمني لـδιά مع المضاف إليه بوصفه مدة انقضت قبل الحدث التالي.
- source_word: πάλιν
  choice: مرة أخرى
  rationale: يبيّن تكرار الصعود إلى أورشليم بعبارة عربية واضحة وطبيعية.
- source_word: ἀνέβην
  choice: صعدتُ
  rationale: يحافظ على التعبير المألوف عن التوجه إلى أورشليم، بما يلائم موقعها الجغرافي والاستعمال الكتابي.
- source_word: εἰς Ἱεροσόλυμα
  choice: إلى أورشليم
  rationale: ينقل معنى الوجهة الذي تؤديه εἰς، مع اعتماد الاسم العربي الكتابي الشائع.
- source_word: μετὰ Βαρναβᾶ
  choice: مع برنابا
  rationale: يعبّر مباشرة عن المصاحبة دون زيادة تفسيرية.
- source_word: συμπαραλαβὼν
  choice: وأخذتُ معي
  rationale: ينقل الفعل المصاحب للصعود بصياغة عربية سلسة، ويفيد أن بولس اصطحب تيطس.
- source_word: καὶ Τίτον
  choice: تيطس أيضًا
  rationale: يعكس القوة الإضافية المحتملة لـκαί، أي إن تيطس كان برفقة بولس إلى جانب برنابا.
theological_decisions: []
