  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: ar
  text: ولم نُبدِ لهم أيَّ خضوع، ولو لساعة واحدة، لكي تبقى حقيقةُ البشارة لكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي تبقى حقيقةُ البشارة عندكم».'
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: لهم
  rationale: يعود ضمير الوصل في صيغة المجرور إلى المذكورين في السياق السابق، و«لهم» تؤدي الإحالة بوضوح وطبيعية في العربية.
- source_word: οὐδὲ πρὸς ὥραν
  choice: ولو لحظة واحدة
  rationale: التعبير اليوناني حرفيًا «ولا لساعة»، وهو اصطلاح يفيد نفي الاستجابة ولو مدة وجيزة جدًا؛ والصياغة المختارة تنقل قوته في العربية المعاصرة.
- source_word: εἴξαμεν τῇ ὑποταγῇ
  choice: نخضع لهم بالتنازل
  rationale: الفعل يدل على الإذعان أو إفساح المجال، والاسم يدل على الخضوع. تجمع الصياغة العربية بين الفكرتين من غير حصر الرفض في بعد شخصي أو مؤسسي بعينه.
- source_word: ἵνα
  choice: لكي
  rationale: تفيد أداة الغاية هنا قصد بولس من عدم التنازل.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: حقُّ البشارة
  rationale: «حقّ البشارة» تعبير عربي واضح يحفظ الإضافة اليونانية ومعنى صدق مضمون الخبر المعلن؛ و«البشارة» تنقل εὐαγγέλιον بلغة دينية مفهومة من غير توسع تفسيري.
- source_word: διαμείνῃ
  choice: يبقى محفوظًا
  rationale: يفيد الفعل الاستمرار والثبات؛ وإضافة «محفوظًا» توضح أن المقصود استمرار الحق من غير أن تحدد آلية ذلك.
- source_word: πρὸς ὑμᾶς
  choice: لكم
  rationale: يمكن أن تفيد العبارة الاتجاه نحو المخاطبين أو الصلة بهم أو المنفعة لهم. «لكم» مناسبة للسياق، مع إثبات البديل المحتمل في الحاشية.
theological_decisions:
- issue: مدى رفض بولس الخضوع للمخالفين
  choice: يقرر بولس أنه لم يذعن لهم بأي تنازل، لكي يصون حق البشارة للمخاطبين.
  alternative: قد يُفهم الكلام على أنه رفض لخضوع شخصي أو لامتياز مؤسسي محدد.
  rationale: النص يتحدث بوجه عام عن عدم الإذعان في الخضوع، فلا يحصر الأمر صراحةً في البعد الشخصي أو المؤسسي؛ لذلك تحافظ الترجمة على هذا الاتساع.
- issue: دلالة πρὸς ὑμᾶς
  choice: لكم
  alternative: عندكم
  rationale: يحتمل حرف الجر هنا معنى المنفعة أو التوجه إلى المخاطبين، كما يحتمل معنى بقاء الحق لديهم؛ أُبقي الاحتمال البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. اختيرت صياغة طبيعية تحفظ شدة النفي وغرض الجملة، مع توثيق احتمال πρὸς ὑμᾶς في الحاشية. أُدمج معنى «ولا لساعة» اصطلاحيًا في «ولو لحظة واحدة»، فلا تلزم حاشية مستقلة له.
