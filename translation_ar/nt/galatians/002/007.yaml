lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: بل على العكس
  rationale: ينقل قوة الاستدراك والتضاد في التعبير اليوناني المركب بلغة عربية طبيعية.
- source_word: ἰδόντες
  choice: إذ رأوا
  rationale: يعبر عن اسم الفاعل الأوريستي بوصفه ظرفًا ملازمًا لإدراكهم، من غير إثقال الأسلوب.
- source_word: πεπίστευμαι
  choice: اؤتمنت
  rationale: المبني للمجهول من الفعل هنا يدل على إسناد أمانة أو تكليف إلى بولس؛ والصيغة العربية تحافظ على ذلك دون التصريح بمن ائتمنه.
- source_word: τὸ εὐαγγέλιον
  choice: إنجيل
  rationale: اللفظ العربي الراسخ المقابل لـ εὐαγγέλιον في السياق البولسي.
- source_word: τῆς ἀκροβυστίας
  choice: غير المختونين
  rationale: ينقل الدلالة على الجماعة بحسب علامة الختان، بدل استبدالها بتفسير إثني أوسع مثل «الأمم».
- source_word: καθὼς
  choice: كما
  rationale: يحفظ المقارنة المتوازية بين تكليف بولس وتكليف بطرس.
- source_word: Πέτρος
  choice: بطرس
  rationale: الصيغة العربية الكتابية الشائعة للاسم.
- source_word: τῆς περιτομῆς
  choice: المختونين
  rationale: يحافظ على التقابل اللفظي والعهدي مع «غير المختونين» من غير اختزاله في «اليهود».
- source_word: '[ellipsis after Πέτρος τῆς περιτομῆς]'
  choice: اؤتمن ... على إنجيل
  rationale: استكمال عربي طبيعي للمحذوف المفهوم من الجملة الأولى، دون إضافة معنى جديد.
theological_decisions:
- issue: هل تُترجم ἀκροβυστία وπεριτομή ترجمة إثنية أم بحسب علامة الختان الواردة في اليونانية؟
  choice: غير المختونين / المختونين
  alternative: الأمم / اليهود؛ أو عدم الختان / الختان
  rationale: يحفظ الاختيار تصوير بولس نفسه للجماعتين بحسب علامة الختان، ولا يحسمه إلى توصيف إثني تفسيري.
- issue: هل يفيد النص إنجيلين مختلفين أم إنجيلًا واحدًا موجَّهًا إلى جماعتين؟
  choice: أُبقي تركيب «إنجيل غير المختونين ... إنجيل المختونين» في المتن مع توضيح المقصود في الحاشية.
  alternative: الإنجيل لغير المختونين ... للمختونين
  rationale: يحافظ هذا على تركيب الإضافة اليوناني وعلى ما قد يبدو فيه من توتر، بينما تمنع الحاشية فهمه بالضرورة على أنه رسالتان مختلفتان.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «اؤتمنت/اؤتمن» بصيغة المبني للمجهول للحفاظ على بنية الأصل، ووُضع مؤشر الحاشية بعد المقارنة التي تشرحها.
