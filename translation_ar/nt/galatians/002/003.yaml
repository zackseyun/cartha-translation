base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: ar
  text: لكن حتى تيطس، الذي كان معي، مع أنه يوناني[a]، لم يُجبَر على أن يُختَن.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وهو يوناني».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: لكن
  rationale: تفيد الاستدراك والتباين مع السياق السابق، و«لكن» هي الصياغة العربية الموجزة والطبيعية.
- source_word: οὐδὲ
  choice: حتى ... لم
  rationale: تنقل النفي المؤكد المتمركز على تيطس بصياغة عربية سليمة، بما يعادل معنى «ولا حتى» دون تركيب متكلف.
- source_word: Τίτος
  choice: تيطس
  rationale: نقل صوتي للاسم وفق الصيغة العربية الكتابية الشائعة.
- source_word: ὁ σὺν ἐμοί
  choice: الذي كان معي
  rationale: تنقل الوصف التعريفي بوضوح من غير إضافة معنى «رفيقي» غير المصرح به.
- source_word: Ἕλλην ὤν
  choice: مع أنه يوناني
  rationale: تفهم العبارة الحالية في السياق على وجه concessive، أي رغم كونه يونانيًا؛ وتحافظ الصياغة على هذا التوتر بصورة طبيعية.
- source_word: Ἕλλην
  choice: يوناني
  rationale: يحافظ على الدلالة الإثنية الثقافية المحددة في اليونانية بدل تعميمها إلى «أممي».
- source_word: ἠναγκάσθη
  choice: لم يُجبَر
  rationale: ينقل المبني للمجهول والضغط الخارجي أو الإكراه بلفظ عربي واضح ومباشر.
- source_word: περιτμηθῆναι
  choice: على أن يُختَن
  rationale: ترجمة مباشرة وشفافة للمصدر المبني للمجهول، وتلائم تعدية الفعل «أُجبر» في العربية.
theological_decisions:
- issue: ترجمة Ἕλλην بوصفه تحديدًا إثنيًا أم اختصارًا دينيًا تفسيريًا
  choice: يوناني
  alternative: أممي
  rationale: النص يصف تيطس بأنه يوناني تحديدًا. ومع أن ذلك يدل سياقيًا على كونه غير مختون ومن الأمم، ينبغي إبقاء اللفظ المحدد بدل استبداله بتعميم تفسيري.
- issue: العلاقة المنطقية للعبارة Ἕλλην ὤν
  choice: مع أنه يوناني
  alternative: إذ كان يونانيًا / وكان يونانيًا
  rationale: 'السياق يرجح الدلالة التنازلية: على الرغم من يونانيته لم يُجبر على الختان. ومع ذلك، لا تحسم البنية النحوية وحدها هذه الدلالة، ولذلك تُذكر الصياغة الأقل تفسيرًا في الحاشية.'
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ لفظ «يوناني» كما في الأصل، واستُخدمت صياغة «حتى تيطس ... لم» لنقل توكيد οὐδὲ بصورة عربية طبيعية.
