  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: ar
  text: أفهل صرتُ، إذًا، عدوًّا لكم لأنني أقول لكم الحق؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنني أتكلم إليكم بصدق». يمكن أن يدل الفعل اليوناني على «قول الحق» أو «التكلم بصدق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: أفـ... إذًا
  rationale: تفيد الاستنتاج مما سبق، وصيغة «إذًا» مع همزة الاستفهام تنقل الانتقال الاستنتاجي والسؤال البلاغي بصورة طبيعية.
- source_word: ἐχθρὸς
  choice: عدوًّا
  rationale: تؤدي معنى الشخص الذي يُعَدّ خصمًا أو عدوًّا، وهي العبارة العربية الواضحة المألوفة.
- source_word: ὑμῶν
  choice: لكم
  rationale: الضمير في اليونانية مضاف إليه متعلق بـ«عدو»، والتعبير العربي الطبيعي هو «عدوًّا لكم».
- source_word: γέγονα
  choice: صرتُ
  rationale: الفعل في صيغة التام يدل على حدوث التحول مع بقاء نتيجته؛ و«صرتُ» تنقل معنى الانتقال إلى حال العداوة في هذا السؤال.
- source_word: ἀληθεύων
  choice: لأنني أقول ... الحق
  rationale: اسم الفاعل يدل على قول الحق أو التكلم بصدق. تفيد «لأنني أقول لكم الحق» العلاقة السببية المرجحة في السياق، مع إبقاء البديل الدلالي في الحاشية.
- source_word: ὑμῖν
  choice: لكم
  rationale: يشير ضمير الداتيف إلى المخاطَبين الذين يوجه إليهم بولس كلامه الصادق.
theological_decisions:
- issue: دلالة ἀληθεύων في خطاب بولس
  choice: يسأل بولس هل صار عدوًّا لهم لأنه يقول لهم الحق.
  alternative: يسأل هل صار عدوًّا لهم لأنه يتكلم معهم بصدق أو يعاملهم بالصدق عمومًا.
  rationale: يرجح السياق معنى توجيه كلام صادق إليهم، من غير إضافة مضمون عقائدي غير مصرّح به، وتُحفظ السعة المعجمية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ السؤال البلاغي، ووُضع الاستنتاج في «إذًا»، واستُعملت صياغة مألوفة للقارئ العام مع إثبات البديل المعجمي في الحاشية.
