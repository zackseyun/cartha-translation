id: GAL.4.12
reference: Galatians 4:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: ar
  text: صيروا مثلي[a]، لأني أنا أيضًا صرت مثلكم[b]، أيها الإخوة[c]، أرجوكم. لم تسيئوا إليَّ في شيء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «على مثالي».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا، العبارة اليونانية موجزة: «لأني أنا أيضًا مثلكم»؛ والفعل «صرت» مقدَّر من السياق.'
    reason: alternative_reading
  - marker: c
    text: لفظ «الإخوة» هنا يخاطب جماعة المؤمنين، ويشمل على الأرجح الرجال والنساء.
    reason: cultural_note
lexical_decisions:
- source_word: Γίνεσθε
  choice: صيروا
  rationale: فعل أمر حاضر للجمع من γίνομαι، ويدل على الانتقال إلى حال أو موقف، لذلك «صيروا» أدق من «كونوا» هنا.
- source_word: ὡς ἐγώ
  choice: مثلي
  rationale: تعبير مقارنة طبيعي ومباشر في العربية، ويحفظ معنى ὡς مع ضمير المتكلم.
- source_word: ὅτι
  choice: لأني
  rationale: تفيد ὅτι هنا التعليل، فتقدم سبب المناشدة السابقة.
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: أنا أيضًا صرت مثلكم
  rationale: العبارة اليونانية موجزة ومحذوف منها الفعل؛ أُضيف «صرت» من الفعل السابق لتستقيم العربية، مع إبقاء القراءة غير المقدَّر فيها الفعل في الحاشية.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: نداء مذكر جمع مطابق لصيغة الأصل، وهو في السياق موجَّه إلى جماعة المؤمنين.
- source_word: δέομαι ὑμῶν
  choice: أرجوكم
  rationale: ينقل معنى الطلب الملح بلغة عربية حالية وكريمة من غير تكلف أو صياغة قديمة.
- source_word: οὐδέν με ἠδικήσατε
  choice: لم تسيئوا إليَّ في شيء
  rationale: يحفظ النفي الشامل في οὐδέν وعلاقة الفعل بضمير المتكلم، ويأتي بصياغة عربية طبيعية.
theological_decisions:
- issue: دلالة ἀδελφοί الشاملة في خطاب كنائس غلاطية
  choice: إبقاء «أيها الإخوة» في المتن مع شرح شمول الخطاب للجماعة في الحاشية.
  alternative: أيها الإخوة والأخوات
  rationale: الصيغة اليونانية مذكر جمع، لكنها تُستعمل في هذا السياق لمخاطبة جماعة المؤمنين كلها؛ يحفظ المتن صورة الأصل ولا يحجب الدلالة السياقية.
- issue: الفعل المحذوف في κἀγὼ ὡς ὑμεῖς
  choice: تقدير الفعل الماضي «صرت» في المتن.
  alternative: لأني أنا أيضًا مثلكم
  rationale: اليونانية تحتمل إبقاء الجملة اسمية بلا فعل ظاهر، لكن استعادة معنى γίνομαι من الأمر السابق تلائم السياق الذي يشير إلى تمثل بولس بحال مخاطبيه؛ أثبتت الحاشية البديل للمحافظة على الإيجاز والالتباس الأصليين.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «صيروا» لإبراز التحول المقصود في فعل الأمر، و«أرجوكم» لنقل حرارة المناشدة من دون أسلوب عتيق. وُزعت علامات الحواشي بحسب مواضعها في المتن.
