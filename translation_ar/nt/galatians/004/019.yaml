base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/019.yaml
  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: ar
  text: يا أولادي، الذين أعاني من أجلهم آلام المخاض من جديد، إلى أن يتشكَّل المسيح فيكم[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بينكم»، في إشارة أوضح إلى المعنى الجماعي المحتمل.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أتمخَّض بكم من جديد» أو «أعاني آلام الولادة من جديد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα μου
  choice: يا أولادي
  rationale: نداء حميم يدل على علاقة بولس الأبوية بالمخاطَبين، من غير إضافة معنى التصغير غير الصريح في اللفظ اليوناني.
- source_word: οὓς
  choice: الذين أعاني من أجلهم
  rationale: يحفظ صلة الموصول بالمخاطَبين، ويصوغ علاقتها بصورة المخاض صياغة عربية طبيعية.
- source_word: πάλιν ὠδίνω
  choice: أعاني من أجلهم آلام المخاض من جديد
  rationale: ينقل صورة آلام الولادة الحية ومعنى التكرار الذي تفيده πάλιν، مع وضوح العبارة في العربية المعاصرة.
- source_word: μέχρις οὗ
  choice: إلى أن
  rationale: يؤدي معنى الغاية الزمنية بصورة مباشرة وطبيعية.
- source_word: μορφωθῇ
  choice: يتشكَّل
  rationale: يحفظ معنى التكوّن التدريجي والصيغة المبنية للمجهول دلاليًا، من غير تحويل الاستعارة إلى تقرير عقائدي تقني.
- source_word: Χριστὸς
  choice: المسيح
  rationale: المقابل العربي الطبيعي للقب Χριστός، وهو يحفظ دلالة الممسوح مع موافقته للاستعمال الكتابي العربي المألوف.
- source_word: ἐν ὑμῖν
  choice: فيكم
  rationale: هو المقابل المباشر، ويسمح بفهم التشكّل في المؤمنين مع بقاء المخاطَبين جمعًا؛ أما المعنى الجماعي «بينكم» فمذكور في الحاشية.
theological_decisions:
- issue: معنى تشكُّل المسيح في المخاطَبين
  choice: الإبقاء على استعارة تشكُّل المسيح فيهم من غير شرحها بعقيدة تقنية محددة
  alternative: فهم العبارة أساسًا على أنها تشكُّل المسيح بينهم بوصفهم جماعة، أو حصرها في صورة الاهتداء والولادة الجديدة
  rationale: النص اليوناني يحتمل بُعدًا داخليًا وبُعدًا جماعيًا، ولا يحدد آلية عقائدية؛ لذلك تحافظ الترجمة على الاستعارة والتوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. اختيرت «يا أولادي» للمودة، و«آلام المخاض» لصون الصورة الأمومية القوية في الأصل، ووضعت علامات الحواشي في المتن بحسب ترتيبها.
