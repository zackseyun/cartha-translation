  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: ar
  text: أمّا أورشليم التي فوق فهي حُرّة، وهي أمّنا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: أمّا
  rationale: تفيد المقابلة مع أورشليم الحاضرة في السياق السابق، وصيغة «أمّا» تُبرز هذا الانتقال التقابلي بوضوح وطبيعية.
- source_word: ἄνω
  choice: التي فوق
  rationale: تحافظ على الدلالة المكانية والصورة الأصلية، من غير تفسيرها تفسيرًا زائدًا بلفظ «السماوية».
- source_word: Ἰερουσαλήμ
  choice: أورشليم
  rationale: الصيغة العربية الكتابية الشائعة للاسم العلم.
- source_word: ἐλευθέρα
  choice: حُرّة
  rationale: صفة خبرية تحافظ على التقابل المحوري بين العبودية والحرية في السياق، من غير إضافة «امرأة» غير الموجودة صراحة هنا.
- source_word: ἥτις
  choice: وهي
  rationale: ينقل الاستمرار مع إبراز تشخيص أورشليم بوصفها أمًّا، وهو تعبير عربي طبيعي يحفظ وظيفة الموصول في السياق.
- source_word: μήτηρ
  choice: أمّ
  rationale: ينقل الاستعارة الأمومية المركزية في حجة بولس مباشرة.
- source_word: ἡμῶν
  choice: نا
  rationale: ضمير الملكية المتصل هو الصياغة العربية الطبيعية لـ«أمّنا».
theological_decisions:
- issue: مرجع «أورشليم التي فوق» وتشخيصها
  choice: «وهي أمّنا» بصيغة المؤنث المشخَّص
  alternative: «التي هي أمّنا» بصياغة موصولية أكثر حرفية
  rationale: السياق المجازي يشخّص أورشليم في صورة أم تقابل سارة والمرأة الحرة. وصيغة «وهي» توضّح هذا التشخيص من غير إضافة مضمون لاهوتي غير مذكور.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت الصورة المكانية في «التي فوق»، واستُعملت «أمّا» لإظهار المقابلة، مع الإبقاء على الجملة موجزة كما في اليونانية.
