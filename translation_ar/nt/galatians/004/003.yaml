  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: ar
  text: وهكذا نحن أيضًا، لما كنا قاصرين، كنا مستعبَدين تحت المبادئ الأولية للعالم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأرواح الأولية للعالم». قد تشير الكلمة اليونانية إلى المبادئ أو العناصر الأساسية، أو إلى قوى روحية كونية.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: وهكذا ... أيضًا
  rationale: تحفظ قوة التشبيه بما سبق، أي حال الوارث القاصر الخاضع للأوصياء والوكلاء.
- source_word: ἡμεῖς
  choice: نحن
  rationale: إبراز ضمير المتكلم الجمع كما في اليونانية.
- source_word: ὅτε ἦμεν νήπιοι
  choice: لما كنا قاصرين
  rationale: «قاصرين» تلائم سياق الوارث الذي لم يبلغ السن المحددة، وتحفظ معنى عدم النضج القانوني والسياقي دون حصره في الطفولة المبكرة.
- source_word: ὑπὸ
  choice: تحت
  rationale: تحفظ صورة الخضوع والسيطرة، وتنسجم مع تكرار تعبير «تحت» في السياق.
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: مبادئ العالم الأولية
  rationale: صياغة مفهومة تحفظ احتمال الدلالة على المبادئ أو العناصر الأساسية، من غير أن تحسم إمكان الإشارة إلى قوى روحية كونية؛ وقد ذُكر هذا الاحتمال في الحاشية.
- source_word: ἤμεθα δεδουλωμένοι
  choice: كنا مستعبَدين
  rationale: تنقل بوضوح وقوة حالة الاستعباد المستمرة التي تفيدها الصيغة اليونانية المركبة.
theological_decisions:
- issue: دلالة τὰ στοιχεῖα τοῦ κόσμου
  choice: مبادئ العالم الأولية
  alternative: أرواح العالم الأولية، أو عناصر العالم الأساسية
  rationale: العبارة موضع خلاف، وقد تدل على مبادئ أو عناصر أساسية، وربما على قوى روحية كونية. أبقى المتن على قراءة غير شخصية ملائمة لسياق القصور والخضوع، مع حفظ الاحتمال الآخر في الحاشية بدل حسم التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختيرت «قاصرين» لربط الآية مباشرة بمثال الوارث في الآيتين السابقتين، و«مستعبَدين» لصون قوة استعارة العبودية.
