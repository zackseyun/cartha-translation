  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: ar
  text: لكنني كنت أودّ أن أكون معكم الآن، وأن أغيّر نبرة حديثي[a]، لأنني حائر بشأنكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأغيّر صوتي». يقول اليوناني حرفيًا: «صوتي»، لكن المقصود هنا على الأرجح نبرة بولس أو طريقته في الكلام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: كنت أودّ لو أكون
  rationale: ينقل صيغة الماضي الناقص التي تعبّر هنا عن رغبة حاضرة متعذّرة أو غير متحققة، مع إبقاء العبارة عربية طبيعية.
- source_word: δὲ
  choice: ولكنني
  rationale: تفيد الأداة انتقالًا ذا مسحة استدراكية من الكلام السابق، و«لكن» تؤدي هذا المعنى بوضوح.
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: أكون معكم
  rationale: تعبير عربي طبيعي يحفظ معنى الحضور الشخصي لديهم.
- source_word: ἄρτι
  choice: الآن
  rationale: ينقل دلالة الزمن الحاضر العاجل من غير إثقال الأسلوب.
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: أغيّر نبرة كلامي
  rationale: φωνή تعني حرفيًا «صوت»، لكن السياق يرجّح هيئة الخطاب أو نبرته؛ وإضافة «كلامي» توضّح المقصود مع إثبات البديل الحرفي في الحاشية.
- source_word: ὅτι
  choice: لأنني
  rationale: تقدّم سبب رغبة بولس في الحضور وتغيير طريقة خطابه.
- source_word: ἀποροῦμαι
  choice: متحيّر
  rationale: يحفظ معنى الحيرة والعجز عن معرفة كيفية التعامل مع الوضع، من غير تفسير زائد.
- source_word: ἐν ὑμῖν
  choice: من جهتكم
  rationale: ينقل معنى المرجع أو المجال المتعلق بالمخاطَبين، ويحافظ على شيء من سعة التعبير اليوناني أكثر من صياغة سببية حاسمة.
theological_decisions:
- issue: دلالة φωνή في السياق
  choice: نبرة الكلام أو أسلوب الخطاب
  alternative: الصوت بمعناه الحرفي
  rationale: سياق العتاب والرعاية يرجّح أن بولس يقصد تغيير طريقة مخاطبتهم إن حضر، لا مجرد تغيير صوت جسده؛ ومع ذلك يُذكر المعنى الحرفي في الحاشية.
- issue: قوة ἀποροῦμαι ἐν ὑμῖν
  choice: الحيرة من جهتهم
  alternative: الشك فيهم أو اليأس منهم
  rationale: النص يعبّر عن حيرة بولس بشأنهم، ولا يقتضي وحده حكمًا أشد كالشك في إيمانهم أو اليأس منهم.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «متحيّر من جهتكم» للمحافظة على غموض ἐν النسبي وتجنب تحميل العبارة معنى الشك أو الإدانة.
