  text: بَلْ هُوَ خَاضِعٌ لِأَوْصِيَاءَ وَمُدَبِّرِينَ[a] إِلَى الْمَوْعِدِ الَّذِي حَدَّدَهُ أَبُوهُ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وكلاء»؛ فاللفظة اليونانية تشير إلى من يدير شؤون البيت أو الممتلكات.
    reason: lexical_alternative
  - marker: b
    text: أو «إلى الموعد الذي عيَّنه الأب».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بَلْ
  rationale: تفيد الاستدراك والمقابلة مع حال الوارث المذكورة في الآية السابقة، و«بل» موجزة وطبيعية في هذا السياق.
- source_word: ὑπὸ
  choice: تَحْتَ سُلْطَةِ
  rationale: تفيد الخضوع لإشراف أشخاص وسلطتهم، وهذه الصياغة أوضح في العربية من الاكتفاء بـ«تحت».
- source_word: ἐπιτρόπους
  choice: أَوْصِيَاءَ
  rationale: تشير إلى أشخاص مؤتمنين على رعاية القاصر والإشراف عليه.
- source_word: ἐστὶ
  choice: يَكُونُ
  rationale: الفاعل مفهوم من السياق السابق، أي الوارث؛ وصيغة «يكون» تلائم بناء الجملة العربية.
- source_word: καὶ
  choice: وَ
  rationale: تربط ببساطة بين فئتين من القائمين على شؤون الوارث.
- source_word: οἰκονόμους
  choice: وُكَلَاءَ
  rationale: تشير هنا إلى المسؤولين عن تدبير شؤون البيت أو الممتلكات، و«وكلاء» تحافظ على معنى الائتمان والإدارة مع إيضاح البديل في الحاشية.
- source_word: ἄχρι
  choice: إِلَى
  rationale: تحدد النهاية الزمنية لهذا الوضع، وتأتي طبيعيًا مع «الموعد» في العربية.
- source_word: τῆς προθεσμίας
  choice: الْمَوْعِدِ الَّذِي حَدَّدَهُ
  rationale: تفيد وقتًا معينًا أو محددًا سلفًا، والصياغة واضحة وحديثة.
- source_word: τοῦ πατρός
  choice: أَبُوهُ
  rationale: يفهم السياق الأب بوصفه من عيّن الموعد، والضمير يوضح علاقته بالوارث المذكور.
theological_decisions:
- issue: دلالة المضاف إليه في τοῦ πατρός
  choice: 'فُهم على أن الأب هو الذي حدّد الموعد: «الذي حدده أبوه»'
  alternative: «إلى موعد الأب» أو «إلى الموعد المحدد من الأب»
  rationale: سياق تشبيه الوارث القاصر يرجّح أن الأب هو الذي يعيّن نهاية مدة خضوعه للأوصياء والوكلاء. وهذا قرار سياقي لا يضيف دعوى لاهوتية إلى النص.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُخدمت «تحت سلطة» لإظهار معنى الخضوع للإشراف، وحوفظ على التمييز بين رعاية القاصر في «أوصياء» وإدارة شؤونه أو ممتلكاته في «وكلاء».
