  source_fidelity: 'ينقل النص المقابلة اليونانية بدقة: «الأَمَة/الحُرّة» تحفظان التباين الاجتماعي في παιδίσκη وἐλευθέρα، و«بحسب الجسد» تقابل κατὰ σάρκα دون تحميلها معنى أخلاقيًا، و«بواسطة وعد» تؤدي δι’ ἐπαγγελίας مع بقاء «وعد» نكرة كما في اليونانية. والتصريح بـ«الابن» في الشقين توضيح عربي مشروع للمرجع المفهوم من السياق القريب.'
