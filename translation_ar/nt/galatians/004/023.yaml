  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: ar
  text: أَمَّا الابنُ مِنَ الأَمَةِ فَقَدْ وُلِدَ بِحَسَبِ الْجَسَدِ[a]، وَأَمَّا الابنُ مِنَ الْحُرَّةِ فَبِوَاسِطَةِ وَعْدٍ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: بالطريقة البشرية المعتادة، أو بوسائل بشرية. والعبارة اليونانية حرفيًا: «بحسب الجسد».'
    reason: lexical_alternative
  - marker: b
    text: 'ويجوز: «بوعد». أي إن ولادته تحققت نتيجة وعد الله، لا بمجرد الإنجاب البشري المعتاد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: الأَمَة
  rationale: تحفظ دلالة وضع هاجر غير الحر، وهو تقابل اجتماعي ولاهوتي محوري في السياق، وهي أفصح وأوضح من ألفاظ قديمة أو مخففة مثل «الجارية» و«الخادمة».
- source_word: κατὰ σάρκα
  choice: بِحَسَبِ الْجَسَدِ
  rationale: يحفظ مصطلح بولس الأساسي σάρξ والتقابل المقصود مع الوعد، من غير أن يفسره خطأً على أنه يشير إلى خطية الولادة الجسدية.
- source_word: γεγέννηται
  choice: فَقَدْ وُلِدَ
  rationale: صياغة عربية طبيعية تؤدي معنى التام المبني للمجهول في هذا الخبر المقارن.
- source_word: ἐλευθέρα
  choice: الْحُرَّة
  rationale: الصفة مستعملة استعمال الاسم، وتقابل «الأمة» بوضوح؛ وذكر «الابن من الحرة» يجعل المرجع المضمر جليًا من غير إضافة معنى جديد.
- source_word: δι’ ἐπαγγελίας
  choice: بِوَاسِطَةِ وَعْدٍ
  rationale: تحفظ معنى الوساطة أو السببية في διά، كما تحافظ على تنكير ἐπαγγελίας، مع إحالة السياق إلى وعد الله.
- source_word: ὁ μὲν ... ὁ δὲ
  choice: أَمَّا الابنُ ... وَأَمَّا الابنُ
  rationale: تركيب «أما... وأما...» ينقل المقابلة اليونانية طبيعيًا، والتصريح بـ«الابن» في الطرفين يوضح المحذوف المفهوم من السياق.
theological_decisions:
- issue: التقابل بين κατὰ σάρκα وδι’ ἐπαγγελίας
  choice: الإبقاء على «بحسب الجسد» في المتن، في مقابل «بواسطة وعد»
  alternative: «بالطريقة البشرية المعتادة» في مقابل «نتيجةً لوعد الله»
  rationale: يحافظ هذا الاختيار على المصطلح البولسي والتوتر بين الولادة البشرية الطبيعية والولادة التي تحققت بفعل الوعد، من غير أن يوحي بأن الجسد أو الإنجاب الطبيعي خاطئ في ذاته.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الأمة/الحرة» لصون التقابل القانوني والاجتماعي، و«بحسب الجسد» للمحافظة على الاصطلاح البولسي مع شرحه في الحاشية. أُثبتت علامتا الحاشيتين في المتن بترتيبهما الطبيعي.
