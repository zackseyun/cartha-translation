source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: ar
  text: ولكن الآن، بعدما عرفتم الله، أو بالأحرى بعدما عرفكم الله، كيف تعودون مرة أخرى إلى العناصر الأولية الضعيفة والفقيرة[a] التي تريدون أن تستعبدوا لها من جديد؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «العناصر الأولية»: «المبادئ الأولية»، أو «الأرواح الأولية»، أو «الأشياء الأولية».'
    reason: تحفظ الحاشية تعدد الدلالات الممكنة للفظة στοιχεῖα في هذا السياق.
lexical_decisions:
- source_word: γνόντες θεόν
  choice: بعد أن عرفتم الله
  rationale: ينقل اسم الفاعل الأوريستي بوصفه حدثًا سابقًا للفعل الرئيس، مع إبقاء معنى المعرفة العلائقية من غير إضافة تفسير عقائدي.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: 'بل الأصح: بعد أن عرفكم الله'
  rationale: «بل الأصح» تؤدي قوة التصحيح في μᾶλλον δέ، وصيغة المعلوم العربية الطبيعية تُبقي الله فاعل المعرفة بوضوح وتحفظ أولوية عمله التي يبرزها النص.
- source_word: πῶς ἐπιστρέφετε πάλιν
  choice: كيف تعودون مرة أخرى
  rationale: تحفظ السؤال الاستنكاري وفعل الرجوع والتوكيد الذي تضيفه πάλιν، بصياغة عربية واضحة.
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: العناصر الأولية الضعيفة والفقيرة
  rationale: «العناصر الأولية» تبقي στοιχεῖα مصطلحًا واسع الدلالة نسبيًا، فلا تحسم هل المراد مبادئ أساسية أم عناصر أو قوى كونية. ونُقلت الصفتان حرفيًا تقريبًا للمحافظة على حدة تقويم بولس.
- source_word: δουλεύειν
  choice: أن تُستعبَدوا
  rationale: يحفظ صورة العبودية القوية في δουλεύω بدل تخفيفها إلى مجرد الخدمة.
- source_word: πάλιν ἄνωθεν
  choice: مرة أخرى من البداية
  rationale: ينقل اجتماع معنى التكرار في πάλιν ومعنى البدء من جديد في ἄνωθεν، مع إبقاء التوكيد المتعمد في الأصل.
- source_word: θέλετε
  choice: تريدون
  rationale: ترجمة مباشرة واضحة لمعنى الإرادة أو الرغبة في السياق التوبيخي.
theological_decisions:
- issue: دلالة στοιχεῖα في غلاطية 4:9
  choice: العناصر الأولية
  alternative: المبادئ الأولية؛ قوى العالم الأولية؛ الأشياء الأولية
  rationale: اللفظة اليونانية تحتمل المبادئ أو المكوّنات الأساسية، وقد تُفهم أيضًا على أنها قوى كونية. أبقى المتن قدرًا من هذا الاتساع، وتعرض الحاشية البدائل من غير فرض قراءة تعليمية محضة أو قراءة روحانية محضة.
- issue: قوة عبارة «عرفكم الله»
  choice: جعل معرفة الله لهم تصحيحًا ذا أولوية لمعرفتهم إياه
  alternative: اعتبار العبارتين متوازيتين بلا دلالة تصحيحية
  rationale: μᾶλλον δέ تصحح العبارة السابقة وتعمقها. تُظهر الصياغة العربية الله فاعلًا، من غير تحميل النص نظامًا لاهوتيًا يتجاوز عبارته.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموقرة. أُبقي التكرار في «تعودون مرة أخرى» و«مرة أخرى من البداية» لأنه يعكس التوكيد المتعمد في النص اليوناني، ووُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
