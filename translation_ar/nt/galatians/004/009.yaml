  source_fidelity: 'ينقل النص بنية الآية ومعانيها الرئيسة بأمانة: المعرفة بالله ثم التصحيح بأن الله عرفهم، والسؤال الاستنكاري عن الرجوع إلى στοιχεῖα، وصورة الاستعباد. لكن «مرة أخرى من البداية» أقل سلاسة في العربية من التعبير الذي يؤدي πάλιν ἄνωθεν بوصفه تجدّدًا للاستعباد.'
