  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: ar
  text: لكنْ من الحسن أن يُسعى إليكم بحماس[a] لغرضٍ صالح[b] في كل حين، وليس فقط حين أكون حاضرًا معكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تكونوا متحمسين» أو «أن تُظهروا الحماس». يمكن فهم المصدر اليوناني ζηλοῦσθαι على أكثر من وجه، لكن معنى المبني للمجهول يلائم المقابلة المباشرة مع الذين يسعون إلى الغلاطيين في العدد السابق.'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «في أمر صالح». ويُرجَّح أن العبارة تعني بدافع صالح أو لغرض صالح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: حسنٌ
  rationale: صفة خبرية تُستعمل هنا استعمالًا غير شخصي مع المصدر، وتحافظ «حسنٌ» على الإيجاز والوضوح.
- source_word: δὲ
  choice: لكنْ
  rationale: تفيد الانتقال المقابل لدوافع الساعين إلى الغلاطيين في العدد السابق.
- source_word: ζηλοῦσθαι
  choice: أن يُسعى إليكم بغيرةٍ
  rationale: صيغة مصدر مبني للمجهول؛ ينسجم معناها مع استعمال الفعل في العدد السابق بشأن من يسعون إلى الغلاطيين بحماسة. أُضيف «إليكم» لإظهار متعلق الفعل المفهوم من السياق.
- source_word: ἐν καλῷ
  choice: لغرضٍ صالح
  rationale: تعبير موجز حرفيًا «في أمر صالح»، ويرجح أنه يصف صلاح الغاية أو الدافع.
- source_word: πάντοτε
  choice: في كل حين
  rationale: يحفظ المقابلة الزمنية مع قصر الأمر على وقت حضور بولس.
- source_word: καὶ μὴ μόνον
  choice: لا ... فقط
  rationale: صياغة عربية طبيعية للقيد اليوناني، مع اعتبار الواو هنا رابطة يمكن أن تُفهم من بنية الجملة دون ترجمة مستقلة.
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: حين أكون حاضرًا معكم
  rationale: المصدر المعرّف المسبوق بـἐν ذو دلالة زمنية، وهذه صياغة عربية واضحة تحافظ على معنى الحضور.
theological_decisions:
- issue: صيغة ζηλοῦσθαι ودلالتها
  choice: 'المبني للمجهول: أن يكون الغلاطيون موضع سعيٍ حماسي من الآخرين'
  alternative: أن تكونوا غيورين / أن تُظهروا الغيرة
  rationale: السياق المباشر في العددين 17–18 يكرر لغة ζηλόω عن سعي آخرين إلى الغلاطيين؛ لذلك تحافظ القراءة المبنية للمجهول على المقابلة بين سعي ذي دوافع سيئة وسعي لغرض صالح، مع إثبات الاحتمال الآخر في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «بغيرة» لنقل عنصر الحماسة في الجذر اليوناني من غير الإيحاء بالحسد، ووُضعت علامتا الحاشيتين بعد العبارة التي تتناولانها.
