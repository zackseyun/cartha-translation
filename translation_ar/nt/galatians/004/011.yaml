  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: ar
  text: أخاف عليكم لئلا أكون قد تعبت فيكم عبثًا بطريقة ما.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβοῦμαι
  choice: أخاف
  rationale: فعل مضارع يعبّر عن مخاوف بولس الحالية، وصيغة «أخاف» واضحة ومباشرة.
- source_word: ὑμᾶς
  choice: عليكم
  rationale: المفعول به مع φοβοῦμαι يدل هنا، بحسب السياق، على الأشخاص الذين يقلق بولس على حالهم، لا على خوفه منهم؛ و«أخاف عليكم» هو التعبير العربي الطبيعي لذلك.
- source_word: μή πως
  choice: أن
  rationale: تدخل على مضمون الخوف والاحتمال المقلق. وتنقل «أن» هذا المعنى طبيعيًا في العربية بعد «أخاف»، من غير الجزم بأن التعب كان بلا ثمرة.
- source_word: εἰκῇ
  choice: عبثًا
  rationale: تفيد أن الجهد ربما كان بلا نتيجة أو جدوى، و«عبثًا» موجزة وفصيحة.
- source_word: κεκοπίακα
  choice: أكون قد تعبت
  rationale: تحفظ دلالة الفعل التام على جهد سبق بذله وما زالت نتيجته موضع اهتمام، كما تعبّر صيغة «أن أكون قد» عن الأمر الذي يخشاه بولس من غير تحويل صيغة الأصل إلى جزم مستقل.
- source_word: εἰς ὑμᾶς
  choice: من أجلكم
  rationale: تبيّن أن جهد بولس كان موجّهًا نحو الغلاطيين ولمصلحتهم، وهي عبارة عربية طبيعية في هذا السياق.
theological_decisions:
- issue: طبيعة خوف بولس
  choice: قلق رعوي من أن يكون جهده المبذول من أجل الغلاطيين قد صار بلا ثمرة
  alternative: مجرد قلق شخصي عام لا يركّز على احتمال ضياع ثمرة خدمته
  rationale: تركيب φοβοῦμαι ... μή πως ... εἰκῇ κεκοπίακα يربط خوفه صراحة باحتمال أن يكون تعبه فيهم بلا جدوى، مع إبقاء ذلك في صيغة التخوف لا التقرير القطعي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختيرت «أخاف عليكم» لأنها مألوفة وتمنع فهم الكلام على أنه خوف من الغلاطيين، مع إثبات البديل في الحاشية.
