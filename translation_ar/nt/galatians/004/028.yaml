lexical_decisions:
- source_word: ὑμεῖς
  choice: أنتم
  rationale: ضمير مخاطب جمع صريح يفيد إبراز المخاطَبين، وقد أُبقي عليه في العربية، بل تكرر في جملة الخبر على نحو طبيعي نسبيًا لتأكيد المقابلة.
- source_word: δέ
  choice: أمّا
  rationale: تفيد انتقالًا مع مقابلة خفيفة في سياق الحجة؛ و«أمّا أنتم» تنقل هذا الأثر الخطابي بوضوح من غير إضافة معنى زمني.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: نداء بصيغة جمع المذكر. حُفظت صورة اللفظ الأصلية، مع بيان استعمالها التمثيلي المرجح للجماعة كلها في الحاشية.
- source_word: κατὰ Ἰσαὰκ
  choice: مثل إسحاق
  rationale: تفيد العبارة المطابقة من جهة المثال أو النمط؛ فإسحاق هو وجه المقارنة، و«مثل إسحاق» عربية واضحة وطبيعية.
- source_word: ἐπαγγελίας
  choice: الموعد
  rationale: مضاف إليه يصف الأولاد؛ وعبارة «أولاد الموعد» تحفظ الصياغة البولسية وصلتها بالوعد الإلهي دون بسط تفسيري زائد.
- source_word: τέκνα
  choice: أولاد
  rationale: اسم جمع لا يختص بالذكور هنا، ويدل على الانتساب والبنوة. «أولاد» أوضح في التعبير الاصطلاحي «أولاد الموعد» من البدائل الأثقل.
- source_word: ἐστέ
  choice: أنتم ... أولاد
  rationale: فعل الكينونة في المضارع يُعبَّر عنه في العربية الفصحى بجملة اسمية؛ وأُعيد الضمير في الخبر لتثبيت الربط وإبراز المخاطَبين.
theological_decisions:
- issue: مماثلة المؤمنين لإسحاق في حجة بولس
  choice: «فمثل إسحاق، أنتم أولاد الموعد»
  alternative: «أنتم أولاد موعود بهم مثل إسحاق»
  rationale: الصياغة المختارة تُبقي إسحاق مثالًا للمقارنة، و«أولاد الموعد» خبرًا عن المخاطَبين، فتحفظ بنية اليونانية ودلالتها اللاهوتية من غير تحويل الوعد صراحةً إلى وصف لكونهم موعودًا بهم.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أمّا» لنقل الانتقال المقارِن الذي تؤديه δέ، وحُفظ التعبير اللاهوتي الموجز «أولاد الموعد» مع تجنب التفسير المذهبي الزائد.
