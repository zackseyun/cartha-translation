id: GAL.4.27
reference: Galatians 4:27
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: ar
  text: 'فإنه مكتوب: «افرحي أيتها العاقر التي لا تلد، انطلقي بالهتاف واصرخي، يا من لا تعاني آلام المخاض؛ لأن أولاد المرأة المهجورة أكثر من أولاد المرأة التي لها زوج».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اقتباس من إشعياء 54:1.
    reason: cross_reference
lexical_decisions:
- source_word: γέγραπται
  choice: مكتوب
  rationale: صيغة عربية مألوفة ودقيقة للاقتباس الكتابي، وتحافظ في السياق على معنى ثبوت المكتوب واستمرار سلطانه.
- source_word: Εὐφράνθητι
  choice: افرحي
  rationale: أمر بالفرح يلائم نبرة الاقتباس النبوي، وهو واضح وطبيعي في العربية المعاصرة.
- source_word: στεῖρα
  choice: أيتها العاقر
  rationale: الصفة مستعملة استعمال الاسم في النداء؛ وهذه الصياغة موجزة وتحافظ على الصورة الأصلية.
- source_word: ἡ οὐ τίκτουσα
  choice: التي لا تلد
  rationale: تنقل وصف عدم الإنجاب بصورة مباشرة وطبيعية، من غير إضافة «أولاد» غير الموجودة صراحة في هذا الشطر.
- source_word: ῥῆξον καὶ βόησον
  choice: اهتفي واصرخي
  rationale: ينقل الفعلان اندفاع الصوت وعلوَّه بصياغة عربية نبوية طبيعية؛ «اهتفي» تعبّر عن الانطلاق المفاجئ بالهتاف، و«اصرخي» عن النداء العالي.
- source_word: ἡ οὐκ ὠδίνουσα
  choice: يا من لا تعاني آلام المخاض
  rationale: يصرّح بالمعنى الخاص للفعل، أي اختبار أوجاع الولادة، ويحافظ على الصورة الأمومية.
- source_word: πολλὰ τὰ τέκνα
  choice: أولاد ... أكثر
  rationale: إعادة ترتيب طبيعية في العربية تُظهر المقارنة العددية بوضوح من دون تغيير مضمونها.
- source_word: τῆς ἐρήμου
  choice: المرأة المهجورة
  rationale: في الصورة المجازية للاقتباس يدل اللفظ على امرأة متروكة أو مقفرة الحال؛ «المهجورة» واضحة وتحفظ معنى الترك.
- source_word: μᾶλλον ἢ
  choice: أكثر من
  rationale: المقابل العربي المباشر للمقارنة العددية.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: التي لها زوج
  rationale: يحافظ على البنية الحرفية نسبيًا وعلى المقابلة مع المرأة المهجورة، من غير اختزالها إلى وصف «المتزوجة».
theological_decisions:
- issue: اقتباس إشعياء 54:1 ضمن السياق الرمزي في غلاطية 4
  choice: ترجمة صورة الاقتباس النبوي كما وردت، من غير إدخال هوية المرأة المقصودة في تفسير بولس ضمن ألفاظ الآية نفسها.
  alternative: صياغة الاقتباس بما يصرّح مسبقًا بارتباطه بسارة أو بأورشليم العليا.
  rationale: النص يقدّم اقتباسًا صريحًا من الكتاب، ثم يترك للسياق المحيط مهمة بيان تطبيقه؛ والتصريح بالتفسير داخل الاقتباس يطمس التوتر والصورة الأصليين.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُخدم «العاقر» و«آلام المخاض» لصون الصورة الأمومية، و«المهجورة» لإبقاء دلالة الترك المجازية. وُضع مؤشر الحاشية [a] في المتن بعد الاقتباس كاملًا.
