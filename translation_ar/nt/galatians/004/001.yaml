  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: ar
  text: 'وأقول: ما دام الوارث قاصرًا[a]، فلا يختلف في شيء عن العبد، مع أنه سيد كل شيء،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «طفلًا». يمكن أن تشير الكلمة اليونانية νήπιος إلى طفل غير ناضج، وهي في هذا السياق تدل على من لم يبلغ سن الرشد.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: وأقول
  rationale: تفيد λέγω إدخال بيان أو توضيح، أما δέ فأداة وصل خفيفة؛ وتنقل «وأقول» الانتقال من غير مبالغة في معنى الاستدراك أو إدخال معنى زمني غير موجود.
- source_word: ἐφ’ ὅσον χρόνον
  choice: ما دام
  rationale: تعبير يفيد امتداد الحال مدةً تنتهي عند حد معين، و«ما دام» صياغة عربية طبيعية ودقيقة.
- source_word: ὁ κληρονόμος
  choice: الوارث
  rationale: تشير الكلمة إلى من تؤول إليه التركة، و«الوارث» هو المقابل العربي المألوف.
- source_word: νήπιος
  choice: قاصرًا
  rationale: قد تدل الكلمة على طفل صغير أو غير ناضج، لكن سياق الميراث والوصاية يبرز عدم بلوغ السن القانونية؛ لذلك تنقل «قاصرًا» المقصود بدقة، مع إثبات البديل الأوسع في الحاشية.
- source_word: οὐδὲν διαφέρει
  choice: فلا يختلف في شيء
  rationale: تحافظ الصياغة على النفي الشامل في اليونانية وتأتي واضحة وطبيعية بالعربية.
- source_word: δούλου
  choice: العبد
  rationale: تدل δοῦλος هنا على شخص مملوك أو مستعبَد، والمقارنة قائمة على خضوعه وعدم تمتعه بحرية التصرف؛ لذلك «العبد» أدق من «الخادم».
- source_word: κύριος πάντων ὤν
  choice: مع أنه سيد كل شيء
  rationale: تشير κύριος هنا إلى السيادة والملكية لا إلى لقب إلهي، وتُظهر «مع أنه» الدلالة التنازلية التي يحملها اسم الفاعل بحسب السياق.
theological_decisions:
- issue: دلالة δοῦλος في تشبيه بولس
  choice: العبد
  alternative: الخادم
  rationale: يعتمد التشبيه على انعدام الفرق العملي مؤقتًا بين الوارث القاصر والشخص المستعبَد الخاضع للسلطة. و«العبد» يحفظ قوة المقارنة ووضع الرق الذي تدل عليه الكلمة، من غير تلطيفها إلى مجرد خدمة.
- issue: دلالة κύριος πάντων
  choice: سيد كل شيء
  alternative: مالك كل شيء
  rationale: تحفظ «سيد» مفارقة النص وصياغته الواسعة، مع أن المقصود في سياق الميراث هو صاحب الحق والسلطة في الممتلكات، لا لقبًا إلهيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «قاصرًا» لأنها تلائم الإطار القانوني للميراث، مع حاشية تحفظ المجال الدلالي الأوسع. وأُبقيت الجملة مفتوحة بفاصلة لأن الآية جزء من تركيب يستمر في العدد التالي.
