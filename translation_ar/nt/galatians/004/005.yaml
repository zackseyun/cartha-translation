  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «التبنّي» فقط. واللفظ اليوناني يعني حرفيًّا نيل منزلة الأبناء، مشيرًا إلى كامل مكانة البنوة وحقوق الميراث؛ ويشمل جميع المؤمنين، نساءً ورجالًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα ... ἵνα
  choice: لِيَفْتَدِيَ ... وَلِنَنَالَ
  rationale: تحافظ لام التعليل في الموضعين على دلالة الغرض، مع عطف عربي طبيعي يبرز الغايتين المتتابعتين.
- source_word: τοὺς ὑπὸ νόμον
  choice: الَّذِينَ تَحْتَ النَّامُوسِ
  rationale: صياغة عربية واضحة تحفظ صورة الخضوع لسلطان الناموس؛ و«الناموس» ملائم هنا للإشارة السياقية إلى شريعة موسى.
- source_word: ἐξαγοράσῃ
  choice: يَفْتَدِيَ
  rationale: «يفتدي» ينقل معنى التحرير بدفع ثمن، ويحافظ على الدلالة التجارية والتحريرية للفعل.
- source_word: τὴν υἱοθεσίαν
  choice: التَّبَنِّيَ أَبْنَاءً
  rationale: ينقل لفظ «التبني» المفهوم الرئيس، وتوضح «أبناءً» منزلة البنوة الكاملة وحقوق الميراث التي يحملها المصطلح اليوناني.
- source_word: ἀπολάβωμεν
  choice: نَنَالَ نَحْنُ
  rationale: «ننال» تعبير عربي طبيعي عن التلقي والحصول هنا، وإظهار «نحن» يبرز انتقال العبارة من «الذين» إلى جماعة المتكلمين من دون تحميل المركب معنى «نسترد» غير البارز في السياق.
theological_decisions:
- issue: دلالة υἱοθεσία واللغة المذكرة
  choice: التبني أبناءً
  alternative: التبني؛ أو منزلة البنين
  rationale: تحفظ الصياغة عنصر البنوة المذكر المرتبط في السياق القديم بكامل منزلة الابن وحق الميراث، من غير قصر المرجع على الرجال؛ وتوضح الحاشية أن الوعد يشمل المؤمنين والمؤمنات.
- issue: مرجع «الذين تحت الناموس»
  choice: إبقاء العبارة كما هي مع استعمال «الناموس»
  alternative: الخاضعين للشريعة
  rationale: السياق يرجح شريعة موسى، لكن إبقاء الصورة المصدرية يمنع تضييق العبارة تفسيريًا أكثر مما يقتضيه النص، ويحفظ قدرًا من اتساع التعبير البولسي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. اختير «الناموس» للمحافظة على الاستعمال الكتابي المميز لشريعة موسى، مع تجنب ألفاظ مذهبية تفسيرية. ضُبط النص بالشكل الجزئي لتيسير القراءة.
