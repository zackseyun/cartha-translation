base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: ar
  text: إنهم يتوددون إليكم[a]، ولكن ليس بطريقة حسنة؛ بل يريدون أن يعزلوكم[b] لكي تتوددوا إليهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «إنهم يغارون عليكم، ولكن ليس على نحو حسن». فالفعل اليوناني قد يدل على الغيرة أو الاهتمام الشديد، وقد يدل على السعي الحثيث إلى كسب شخص أو استمالته.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يُقصوكم». والأرجح في السياق أنهم يريدون قطعكم عن بولس ورفقائه لكي تسعوا إلى رضاهم هم.'
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν / ζηλοῦτε
  choice: يُبْدُونَ غَيْرَةً / تُبْدُوا غَيْرَةً
  rationale: يحفظ التكرار البلاغي للفعل اليوناني نفسه، وينقل معنى الاهتمام الحار والسعي إلى استمالة الطرف الآخر من غير حصره في دلالة عاطفية أو مذهبية.
- source_word: ὑμᾶς
  choice: عليكم / يعزلوكم
  rationale: ضمير المخاطبين جمع؛ وجاء مع التعبير العربي «غيرة على»، ثم مفعولًا به مع فعل العزل.
- source_word: οὐ καλῶς
  choice: لا لغرض حسن
  rationale: يوضح أن غيرة الخصوم ليست محمودة من جهة القصد، مع بقاء العبارة طبيعية ودون تحديد دافع لم يصرح به النص.
- source_word: ἀλλὰ
  choice: بل
  rationale: ينقل قوة الاستدراك والتصحيح، إذ تكشف الجملة التالية حقيقة مقصدهم.
- source_word: ἐκκλεῖσαι
  choice: أن يعزلوكم
  rationale: ينقل معنى الإقصاء والقطع عن علاقة أو دائرة، مع عدم تعيين الجهة التي يُعزلون عنها في المتن.
- source_word: θέλουσιν
  choice: يريدون
  rationale: مقابل عربي مباشر وطبيعي لفعل الإرادة.
- source_word: ἵνα
  choice: لكي
  rationale: يحافظ على دلالة الغرض في الجملة.
- source_word: αὐτοὺς
  choice: عليهم
  rationale: يرجع بوضوح إلى أولئك الذين يسعون إلى استمالة الغلاطيين.
theological_decisions:
- issue: الجهة التي يريد الخصوم عزل الغلاطيين عنها في ἐκκλεῖσαι ὑμᾶς
  choice: تركها غير مصرّح بها في المتن، مع الإشارة في الحاشية إلى أن السياق يرجح عزلهم عن بولس ورفقائه
  alternative: أن يكون المقصود إقصاءهم عن بركة الله أو عن جماعة المؤمنين بوجه عام
  rationale: الفعل اليوناني لا يذكر مفعولًا يحدد الجهة التي يقع عنها العزل. وسياق الآيات 16–20 وغرض استمالتهم للخصوم يرجحان المعنى العلائقي، لكن لا ينبغي إدخال هذا التحديد في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ التوازي بين الفعلين اليونانيين المتكررين بتكرار «يبدون غيرة»، واستُعمل «يعزلوكم» لإبقاء جهة الإقصاء غير محددة في المتن.
