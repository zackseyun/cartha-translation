    text: 'أو: «أما هاجر هذه فهي جبل سيناء في بلاد العرب». تَرِد في اليونانية أداة تعريف قبل «هاجر»، مما يجعل تركيب العبارة عسيرًا، ولذلك تعكسه بعض الترجمات بصورة أوضح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: فَهَاجَرُ
  rationale: تؤدي الفاء وظيفة δέ الانتقالية الخفيفة وتصل الكلام بسياقه، مع إبقاء اسم هاجر واضحًا. أما أداة التعريف المحايدة τὸ قبل الاسم فتركيبها عسير ولا مقابل طبيعيًا مباشرًا لها في العربية، ولذلك تُذكر إمكانيتها في الحاشية.
- source_word: Σινᾶ ὄρος
  choice: جَبَلُ سِينَاءَ
  rationale: الصياغة العربية المألوفة لاسم الموضع، وتحافظ على المساواة المباشرة في الحجة الرمزية.
- source_word: ἐν τῇ Ἀραβίᾳ
  choice: فِي بِلَادِ الْعَرَبِ
  rationale: تعبير عربي واضح عن الإقليم الجغرافي، من غير حصره في حدود سياسية حديثة أو في تعريف إداري روماني مخصوص.
- source_word: συστοιχεῖ
  choice: تُقَابِلُ
  rationale: يدل الفعل على الوقوف في الصف أو الفئة المقابلة والمناظرة ضمن المقارنة؛ و«تقابل» موجزة وطبيعية وتحفظ علاقة المطابقة المقصودة.
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: أُورُشَلِيمَ الْحَالِيَّةَ
  rationale: ينقل الوصف الزمني νῦν ويميّز أورشليم الأرضية في زمن بولس من «أورشليم العليا» في الآية التالية.
- source_word: δουλεύει
  choice: مُسْتَعْبَدَةٌ
  rationale: يُبرز حالة العبودية التي يقوم عليها تقابل العبودية والحرية في المقطع، بدل تخفيفها إلى مجرد الخدمة.
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: مَعَ أَوْلَادِهَا
  rationale: ينقل معنى المصاحبة في μετά مع الدلالة العائلية والرمزية لـτέκνα بصياغة عربية طبيعية.
theological_decisions:
- issue: المساواة الرمزية بين هاجر وسيناء ثم مقابلتها بأورشليم الحالية
  choice: 'صياغة المساواة مباشرة: «هاجر هي جبل سيناء»، ثم «تقابل أورشليم الحالية».'
  alternative: «هاجر ترمز إلى جبل سيناء» أو «تمثل جبل سيناء».
  rationale: يستعمل اليوناني فعل الكينونة في العبارة الأولى وفعل المقابلة في الثانية؛ لذلك تحافظ الترجمة على قوة التعبير المباشر ولا تضيف تفسيرًا رمزيًا غير مصرح به.
- issue: دلالة δουλεύει في تقابل العبودية والحرية
  choice: «مستعبدة»
  alternative: «في العبودية» أو «تخدم كأَمَة»
  rationale: «مستعبدة» عربية مباشرة تبرز الحالة المقيدة المقصودة في سياق بولس، من غير تحويلها إلى خدمة عامة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «بلاد العرب» بوصفه تعبيرًا جغرافيًا غير محكوم بحدود الدولة الحديثة، وحُفظت صيغة المساواة المباشرة والتوتر بين العبودية والحرية.
