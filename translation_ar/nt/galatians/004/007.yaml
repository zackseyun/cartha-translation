base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: ar
  text: لذلك، لستَ بعدُ عبدًا، بل ابنًا[a]؛ وإن كنتَ ابنًا، فأنتَ أيضًا وارثٌ بواسطة الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تُترجم الكلمة أيضًا «ولدًا». لكن لفظ «ابن» في اليونانية يحفظ ترابط البنوة والتبنّي والميراث في هذا المقطع، وهذا الوضع يشمل جميع المؤمنين، رجالًا ونساءً.
    reason: lexical_alternative
  - marker: b
    text: 'تقرأ بعض المخطوطات: «وارثٌ لله بالمسيح» بدلًا من «وارثٌ بواسطة الله».'
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: لذلك
  rationale: تفيد النتيجة المترتبة على الحجة السابقة، و«لذلك» تؤدي هذا المعنى بوضوح وطبيعية.
- source_word: οὐκέτι
  choice: لستَ بعدُ
  rationale: 'تنقل النفي الزمني الدال على تغيّر الحال: لم تعد في الوضع السابق.'
- source_word: εἶ
  choice: لستَ / كنتَ / فأنتَ
  rationale: الفعل في اليونانية للمخاطب المفرد؛ صيغت الجملة العربية بما يلائم تركيب النفي والشرط والنتيجة.
- source_word: δοῦλος
  choice: عبدًا
  rationale: يحفظ معنى الخضوع والعبودية المقابل لوضع الابن والوارث، وهو لفظ عربي مألوف في هذا السياق.
- source_word: ἀλλὰ
  choice: بل
  rationale: «بل» هي الأنسب بعد النفي لتقرير الوضع الجديد في مقابل الوضع المنفي.
- source_word: υἱός
  choice: ابنًا
  rationale: يحفظ لفظ البنوة المذكر ومنطق التبنّي والميراث في السياق، مع توضيح شمول هذا الوضع لجميع المؤمنين في الحاشية.
- source_word: εἰ δὲ
  choice: وإن كنتَ
  rationale: تنقل الانتقال إلى الخطوة التالية من الاستدلال الشرطي بصورة عربية سلسة.
- source_word: καὶ
  choice: أيضًا
  rationale: تضيف صفة الوارث إلى صفة الابن كما في الأصل.
- source_word: κληρονόμος
  choice: وارثٌ
  rationale: المقابل العربي المباشر لمن ينال ميراثًا، ويناسب محور البنوة والميراث في المقطع.
- source_word: διὰ θεοῦ
  choice: بعمل الله
  rationale: تفيد أن صيرورة المخاطب وارثًا تحققت بواسطة الله وفعله. وهي أوضح في العربية من الترجمة الحرفية الثقيلة «بواسطة الله»، من غير إدخال وسيط غير مذكور في القراءة المعتمدة.
theological_decisions:
- issue: لغة البنوة المذكرة في υἱός
  choice: ابنًا
  alternative: ولدًا / واحدًا من أولاد الله
  rationale: «ابن» يحفظ الصيغة المذكرة ومنطق الوضع القانوني المتصل بالتبنّي والميراث، بينما تبقى دلالة الكلام شاملة للمؤمنين والمؤمنات كما توضّح الحاشية.
- issue: القراءة النصية في خاتمة الآية
  choice: بعمل الله
  alternative: وارثٌ لله بالمسيح / وارثٌ لله بواسطة المسيح
  rationale: النص اليوناني المعتمد يقرأ διὰ θεοῦ، ولذلك يتبع المتن هذه القراءة ولا يضيف «المسيح». وتُذكر القراءة المخطوطية الأخرى في الحاشية.
- issue: دلالة διὰ مع المضاف إليه
  choice: بعمل الله
  alternative: من خلال الله / بواسطة الله / بفضل الله
  rationale: الصياغة المختارة تحفظ معنى الوساطة أو الفاعلية الإلهية بلغة عربية طبيعية، وتتجنب «بفضل الله» لما قد تضيفه من تخصيص لمعنى النعمة غير المصرّح به هنا.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقّرة. استُخدم خطاب المفرد المذكر موافقةً لصيغة الأصل، وحُفظت بنية الاستنتاج ثم الشرط والنتيجة. وُضعت علامتا الحاشيتين في المتن عند الموضعين اللذين تشرحانهما.
