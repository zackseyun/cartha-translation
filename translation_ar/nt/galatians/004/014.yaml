  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: ar
  text: ومع أن حالتي الجسدية كانت امتحانًا لكم[a]، لم تزدروني ولم تنبذوني باشمئزاز[b]، بل استقبلتموني كما لو كنتُ ملاكًا من الله، وكما لو كنتُ المسيح يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا، يمكن أن تُقرأ العبارة: «امتحانكم في جسدي»؛ والنص اليوناني وتركيب العبارة يحتملان أكثر من فهم.'
    reason: alternative_reading
  - marker: b
    text: الفعل اليوناني يعني حرفيًا «تبصقون» أو «تلفظون بالبصق»، وهو تعبير عن النفور والرفض.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν
  choice: امتحانًا
  rationale: يدل السياق على محنة أو اختبار سبّبته حالة بولس الجسدية للغلاطيين، لا على إغراء بالخطية.
- source_word: ὑμῶν ἐν τῇ σαρκί μου
  choice: حالتي الجسدية كانت امتحانًا لكم
  rationale: صياغة عربية طبيعية تنقل أن ما كان في جسد بولس صار اختبارًا لهم، مع إبقاء الصعوبة النصية والتركيبية في الحاشية.
- source_word: ἐξουθενήσατε
  choice: تزدروني
  rationale: الفعل يفيد الاحتقار والنظر إلى الشخص باستخفاف.
- source_word: ἐξεπτύσατε
  choice: تنبذوني باشمئزاز
  rationale: ينقل قوة صورة البصق الدالة على النفور والرفض في عبارة عربية مفهومة، مع ذكر المعنى الحرفي في الحاشية.
- source_word: ἐδέξασθέ
  choice: استقبلتموني
  rationale: يفيد القبول الشخصي الحار، وهو أنسب من مجرد «أخذتموني» أو «قبلتموني» في هذا السياق.
- source_word: ἄγγελον θεοῦ
  choice: ملاكًا من الله
  rationale: يحافظ على المعنى الرفيع للمقارنة وعلى الموازاة مع استقبال المسيح يسوع، مع أن اللفظ اليوناني قد يعني أيضًا رسولًا.
- source_word: Χριστὸν Ἰησοῦν
  choice: المسيح يسوع
  rationale: يحافظ على «المسيح» بوصفه لقبًا، وعلى ترتيب اللفظين في اليونانية، بصياغة عربية كتابية واضحة.
theological_decisions:
- issue: 'دلالة المقارنة: «كما تستقبلون ملاكًا من الله... المسيح يسوع»'
  choice: تصف المقارنة مقدار الإكرام وحسن الاستقبال اللذين لقيهما بولس.
  alternative: قد تُفهم الجملة الثانية على أنها تصعيد بلاغي للمقارنة الأولى.
  rationale: أداتا التشبيه ὡς تصفان كيفية استقبال بولس، ولا تساويان بين هويته وهوية المسيح. تكرار «كما تستقبلون» يوضح ذلك من غير إضعاف العبارة.
- issue: معنى σάρξ
  choice: الحالة الجسدية لبولس
  alternative: الطبيعة الخاطئة
  rationale: السياق يتحدث عن ضعف أو علة جسدية كانت اختبارًا للغلاطيين؛ ولا يسند قراءة أخلاقية أو لاهوتية لكلمة «الجسد» هنا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدمت صياغة تفسيرية محدودة في صدر الآية لتجنب تركيب عربي ملتبس، مع حفظ الغموض الحقيقي في الحاشية. وتكرار «كما تستقبلون» يبيّن أن الكلام تشبيه في كيفية الاستقبال لا تعريف لهوية بولس.
