  text: لكنكم تعرفون أنني بشّرتكم أول مرة بسبب ضعفٍ جسدي،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسبب مرض». والعبارة اليونانية حرفيًا: «بسبب ضعف الجسد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: تعرفون
  rationale: الفعل οἶδα بصيغة التمام يؤدي معنى حاضرًا، و«تعرفون» تنقل بصورة طبيعية احتكام بولس إلى معرفة الغلاطيين السابقة.
- source_word: δὲ
  choice: لكنكم
  rationale: تدل δέ على انتقال مع مقابلة خفيفة بالسياق السابق؛ و«لكن» مناسبة هنا، مع إلحاق ضمير المخاطبين بالفعل في العربية.
- source_word: ὅτι
  choice: أنني
  rationale: تُدخل ὅτι مضمون ما يعرفه المخاطبون، وتقابلها «أنّ»؛ واتصل بها ضمير المتكلم بحسب التركيب العربي.
- source_word: δι’ ἀσθένειαν
  choice: بسبب مرضٍ
  rationale: διά مع النصب تفيد السبب، وἀσθένεια قد تعني الضعف أو المرض. يرجح السياق علة جسدية، ولذلك اختير «مرض» في المتن مع حفظ البديل في الحاشية.
- source_word: τῆς σαρκὸς
  choice: في الجسد
  rationale: تشير σάρξ هنا إلى جسد بولس لا إلى معنى أخلاقي مثل الطبيعة الخاطئة. وعبارة «مرض في الجسد» عربية طبيعية وتحافظ على ذكر الجسد صراحة.
- source_word: εὐηγγελισάμην
  choice: بشّرتكم
  rationale: ينقل الفعل «بشّر» معنى إعلان الخبر السار بوضوح وإيجاز، واتصل به ضمير المفعول المقابل لـὑμῖν.
- source_word: ὑμῖν
  choice: ـكم
  rationale: نُقل المفعول غير المباشر بضمير المخاطبين المتصل بالفعل «بشّرتكم»، وهو الأسلوب العربي الطبيعي.
- source_word: τὸ πρότερον
  choice: أول مرة
  rationale: يشير التعبير إلى المناسبة الأولى التي بشّر فيها بولس الغلاطيين، و«أول مرة» أوضح من «سابقًا» وتحفظ هذا الاحتمال الزمني.
theological_decisions:
- issue: معنى σάρξ في عبارة ἀσθένειαν τῆς σαρκὸς
  choice: 'المعنى الجسدي الحرفي: «مرض في الجسد»'
  alternative: ضعف جسدي؛ أو ضعف على نحو عام
  rationale: يتحدث بولس عن ظروف تبشيره السابق للغلاطيين، فيُفهم التعبير على أنه حالة بدنية لا فساد أخلاقي. ومع ذلك، لا يحسم الأصل هل كانت الحالة مرضًا محددًا أم ضعفًا بدنيًا، ولذلك ذُكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «بشّرتكم» بدل تركيب أطول، وحُفظت دلالة الجسد من غير إدخال معنى أخلاقي على σάρξ.
