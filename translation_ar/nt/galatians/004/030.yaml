  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: ar
  text: لكن ماذا يقول الكتاب؟ «اطرد الأَمَة وابنها، لأن ابن الأَمَة لن يرث قطعًا مع ابن الحرة».[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«الأَمَة»: أي المرأة المستعبدة؛ فالتقابل بين العبودية والحرية محوري في هذا السياق.'
    reason: lexical_alternative
  - marker: b
    text: الاقتباس يحيل إلى تكوين 21:10.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكن
  rationale: أداة استدراك تنقل إلى الحجة المقابلة بعبارة عربية طبيعية ومباشرة.
- source_word: τί λέγει ἡ γραφή
  choice: ماذا يقول الكتاب؟
  rationale: يحافظ على المضارع وصيغة الاستشهاد التي تشخّص الكتاب بوصفه المرجع الناطق؛ و«الكتاب» تعبير عربي كتابي واضح عن النص المقدس.
- source_word: Ἔκβαλε
  choice: اطرد
  rationale: فعل أمر قوي يفيد الإخراج القسري، ويحفظ حدّة ἐκβάλλω دون تلطيفه إلى «أرسل».
- source_word: παιδίσκην
  choice: الجارية
  rationale: تدل هنا على امرأة مملوكة أو أَمَة، و«الجارية» لفظ عربي واضح في سياق قصة هاجر ويحفظ وضع العبودية، مع بيان البديل الصريح في الحاشية.
- source_word: υἱὸν αὐτῆς
  choice: ابنها
  rationale: نقل مباشر وموجز للتركيب الإضافي.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: لأن ... لن يرث قطعًا
  rationale: ينقل النفي اليوناني المؤكد οὐ μή مع المستقبل بصياغة عربية معاصرة قوية.
- source_word: μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας
  choice: مع ابن الحُرّة
  rationale: يحافظ على المشاركة في الميراث وعلى التقابل المركزي بين الجارية والحُرّة، مع إبقاء الاسم الموصوف محذوفًا كما تسمح العربية.
theological_decisions:
- issue: دلالة παιδίσκη في مقابلة العبودية والحرية
  choice: الجارية
  alternative: الأَمَة؛ المرأة المستعبدة
  rationale: السياق يجعل وضع العبودية عنصرًا حاسمًا في حجة بولس. «الجارية» طبيعية في العربية وقريبة من لغة قصة التكوين، والحاشية تمنع فهمها بمعناها الحديث الأوسع فقط.
- issue: قوة النفي في οὐ μὴ κληρονομήσει
  choice: لن يرث قطعًا
  alternative: لن يرث بأي حال؛ لن يرث أبدًا
  rationale: النص يقرر استبعادًا مؤكدًا. «قطعًا» تحفظ قوة النفي من غير إدخال تفسير لاهوتي زائد أو تحويله بالضرورة إلى نفي زمني مطلق.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُخدم «اطرد» للمحافظة على قوة الأمر، و«لن يرث قطعًا» لإظهار النفي المؤكد. وُضعت علامتا الحاشية في ختام الاقتباس بترتيب متسلسل.
