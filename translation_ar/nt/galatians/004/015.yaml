  text: ⸀ποῦ ⸀οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ⸀ἐξορύξαντες ἐδώκατέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: ar
  text: فأين إذن غبطتكم[a]؟ فإني أشهد لكم أنكم، لو كان ذلك ممكنًا، لاقتلعتم[b] عيونكم وأعطيتموني إياها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُترجم: «تطويبكم» أو «اعتباركم أنفسكم مباركين». فاللفظة اليونانية قد تشير إلى حالة الغبطة أو إلى إعلان بركة شخص ما.'
    reason: lexical_alternative
  - marker: b
    text: الفعل اليوناني قوي، ومعناه قلع العين أو نزعها. ولعل الصورة مبالغة في وصف تفانيهم السابق، وقد يرى بعضهم فيها تلميحًا إلى حالة بولس الجسدية؛ لكن النص لا يحسم ذلك.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: ποῦ οὖν
  choice: فأين إذن
  rationale: يحافظ على صيغة السؤال البلاغي وعلى القوة الاستنتاجية أو الاستئنافية لـ οὖν، من غير أن يضيف صراحةً معنى «ماذا حلّ بـ».
- source_word: ὁ μακαρισμὸς ὑμῶν
  choice: غبطتكم
  rationale: تنقل «الغبطة» حالة اعتبار المرء نفسه مباركًا أو سعيد الحظ، مع إبقاء احتمال أن تشير الكلمة إلى إعلان البركة أو التطويب.
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: فإني أشهد لكم
  rationale: صياغة عربية طبيعية تحتفظ بالنبرة الجازمة والشهادية للفعل μαρτυρέω، ويمكن أن تُفهم بوصفها شهادة موجّهة إليهم أو مؤدّاة لصالحهم.
- source_word: εἰ δυνατὸν
  choice: لو كان ذلك ممكنًا
  rationale: تنقل العبارة الشرطية الموجزة بما يلائم السياق الماضي الذي يفيد امتناع الفعل عمليًا، من غير إضافة سبب للامتناع.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: لاقتلعتم عيونكم
  rationale: يحفظ الصورة الحسية الشديدة والفعل الدال على نزع العين أو قلعها، ولا يستبدلها بتعبير عام عن الكرم أو التفاني.
- source_word: ἐδώκατέ μοι
  choice: وأعطيتموني إياها
  rationale: ينقل الفعل الرئيسي بوضوح، ويصرّح بالضمير العائد إلى العيون وفق الأسلوب العربي الطبيعي.
theological_decisions:
- issue: هل تُفهم صورة اقتلاع العيون كتلميح إلى علة جسدية عند بولس أم كمبالغة في وصف تفاني الغلاطيين السابق؟
  choice: الإبقاء على الصورة الحرفية «لاقتلعتم عيونكم» من غير تحديد سببها.
  alternative: تعميمها إلى «لبذلتم لي كل شيء»، أو تفسيرها صراحةً بأنها إشارة إلى مرض في عيني بولس.
  rationale: النص اليوناني يذكر العيون ويستعمل فعلًا قويًا، لكنه لا يبيّن هل وراء الصورة حالة جسدية بعينها؛ لذلك تُحفظ الصورة والتوتر التفسيري.
- issue: مدلول μακαρισμός
  choice: «غبطتكم» مع حاشية تبقي احتمال التطويب أو إعلان البركة.
  alternative: «تطويبكم» أو «شعوركم بالبركة».
  rationale: اللفظة قد تدل على حالة الغبطة أو على إعلان كون شخص مباركًا؛ ولا ينبغي حصرها في معنى واحد دون تنبيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة وجادة. استُخدمت «غبطة» لدقتها مع شرحها في الحاشية، وحُفظت الصورة العنيفة في الأصل من غير تلطيف أو تفسير مذهبي.
