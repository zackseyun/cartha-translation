  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: ar
  text: 'فإنه مكتوب: كان لإبراهيم ابنان، أحدهما من الأَمَة والآخر من الحُرّة.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: كُتب
  rationale: صيغة عربية مألوفة لإدخال ما يقوله الكتاب، وتحافظ على دلالة اليونانية في كون المكتوب ثابتًا وذا سلطان.
- source_word: γὰρ
  choice: فقد
  rationale: تربط الجملة بحجة بولس السابقة وتفيد التعليل، بصياغة عربية طبيعية.
- source_word: ὅτι
  choice: أن
  rationale: تُدخل مضمون المكتوب مباشرة.
- source_word: Ἀβραὰμ
  choice: إبراهيم
  rationale: الصيغة العربية الكتابية المعيارية للاسم.
- source_word: δύο υἱοὺς
  choice: ابنين
  rationale: تنقل دلالة «ابنين» تحديدًا لا مجرد ولدين أو طفلين.
- source_word: ἔσχεν
  choice: لإبراهيم
  rationale: التعبير الاسمي «لإبراهيم ابنان» طبيعي في العربية ويؤدي معنى امتلاكه/إنجابه ابنين من غير زيادة تفسيرية.
- source_word: ἕνα ... καὶ ἕνα
  choice: أحدهما ... والآخر
  rationale: يُظهر التوازي والمقابلة بوضوح وطبيعية في العربية.
- source_word: ἐκ
  choice: من
  rationale: يحافظ على صورة الأصل في النسب والأصل الأمومي، وهو تعبير عربي واضح.
- source_word: παιδίσκης
  choice: الجارية
  rationale: «الجارية» تدل هنا على امرأة في منزلة العبودية، وتناسب السياق التاريخي والمقابلة مع الحُرّة؛ وتُذكر إمكانية «الأَمَة» في الحاشية.
- source_word: ἐλευθέρας
  choice: الحُرّة
  rationale: صفة مستعملة اسمًا، تقابل «الجارية» وتحافظ على محور الحرية والعبودية في حجة بولس.
theological_decisions:
- issue: المقابلة الاجتماعية التي تقوم عليها حجة بولس
  choice: الجارية / الحُرّة
  alternative: الأَمَة / الحُرّة؛ الخادمة / الحُرّة
  rationale: يحافظ الاختيار على التباين بين العبودية والحرية من غير إقحام تفسير يتجاوز النص. و«الخادمة» قد توحي في الاستعمال الحديث بعمل مأجور لا بكونها غير حرة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «فقد كُتب» بوصفها صيغة كتابية طبيعية، وحُفظ التوازي بين الابنين والمقابلة بين الجارية والحُرّة.
