base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: ar
  text: لكن كما كان آنذاك المولود بحسب الجسد[a] يضطهد المولود بحسب الروح[b]، فالأمر كذلك الآن أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «المولود بوسائل بشرية عادية»؛ وحرفيًا: «المولود بحسب الجسد».'
    reason: lexical_alternative
  - marker: b
    text: أو «الذي بحسب الروح»؛ فكلمة «المولود» مفهومة من الشطر الأول، وقد أُثبتت هنا لإظهار التوازي بوضوح.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: لكن
  rationale: تفيد الاستدراك والانتقال في سياق الحجة، وهي صياغة عربية موجزة وطبيعية.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: كما كان آنذاك ... فكذلك الآن أيضًا
  rationale: تحفظ بنية المقارنة الترابطية والتقابل الزمني بين الماضي والحاضر، مع إضمار الخبر بعد «الآن» على نحو عربي طبيعي.
- source_word: ὁ ... γεννηθεὶς
  choice: المولود
  rationale: ينقل اسم الفاعل اليوناني المبني للمجهول بعبارة اسمية عربية واضحة وموجزة.
- source_word: κατὰ σάρκα
  choice: بحسب الجسد
  rationale: يحفظ لفظ بولس والتقابل المقصود مع الروح، من غير أن يفسره على أنه «الطبيعة الخاطئة»؛ والسياق يشير إلى الولادة بالوسائل البشرية العادية.
- source_word: ἐδίωκε
  choice: يضطهد
  rationale: ينقل معنى المعاداة والاضطهاد، ويعبّر المضارع العربي داخل السرد الماضي مع «كان» عن الفعل المستمر أو المعتاد الذي يدل عليه الناقص اليوناني.
- source_word: τὸν κατὰ πνεῦμα
  choice: المولود بحسب الروح
  rationale: أُعيدت كلمة «المولود» المفهومة من الشطر الأول لإظهار التوازي بوضوح في العربية، مع إبقاء «بحسب» لتجنب حصر κατά في معنى الوسيلة وحده.
- source_word: πνεῦμα
  choice: الروح
  rationale: السياق الخلاصي والعهدي في غلاطية يرجّح الإشارة إلى الروح القدس؛ ولفظ «الروح» في العربية يحافظ على إيجاز الأصل.
- source_word: νῦν
  choice: الآن
  rationale: ينقل الظرف الزمني المباشر الذي يربط النمط القديم بوضع المخاطَبين الحاضر.
theological_decisions:
- issue: معنى κατὰ σάρκα في المقابلة بين إسماعيل وإسحاق
  choice: يشير إلى الولادة بالنسل البشري والوسائل البشرية العادية، لا إلى «الطبيعة الخاطئة» تحديدًا.
  alternative: المولود بحسب الطبيعة الخاطئة؛ أو المولود بطريقة دنيوية محضة.
  rationale: السياق المباشر في غلاطية 4:23 و29 يقابل الولادة الطبيعية بالولادة المرتبطة بالوعد والروح. ويحفظ المتن لفظ «الجسد» كي لا يزيل الصلة اللفظية أو يحسم المعنى بأكثر مما يقتضيه السياق.
- issue: مرجع πνεῦμα
  choice: الروح القدس
  alternative: روح الإنسان؛ أو مبدأ/مجال روحي.
  rationale: في سياق رمزية هاجر وسارة وعلاقة الوعد بهوية المؤمنين، الأرجح أن المقصود هو روح الله؛ ومع ذلك بقيت العبارة قريبة من الأصل من غير إضافة «القدس» إلى المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حُفظت عبارتا «بحسب الجسد» و«بحسب الروح» لإبقاء التوازي والتوتر اللاهوتي في الأصل، مع توضيح البدائل في الحواشي. وُضعت علامتا الحاشيتين بعد العبارة التي تتصلان بها مباشرة.
