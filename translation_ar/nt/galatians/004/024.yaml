  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: ar
  text: 'وهذه الأمور تُؤوَّل تأويلًا رمزيًا[a]، لأن هاتين المرأتين هما عهدان: أحدهما من جبل سيناء، يُنجب أبناءً إلى العبودية[b]، وهو هاجر.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُتحدَّث عن هذه الأمور على سبيل الرمز»، أو: «هذه الأمور رمزية». يدل التعبير اليوناني على أن بولس يوظف الرواية السابقة توظيفًا رمزيًا.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «للعبودية» أو «في العبودية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: وهذه الأمور
  rationale: ضمير موصول محايد جمع يعود إلى الرواية السابقة؛ وصياغة «وهذه الأمور» طبيعية وتحفظ الإحالة إلى ما سبق.
- source_word: ἀλληγορούμενα
  choice: تُفسَّر على سبيل الرمز
  rationale: يحفظ البناء المبني للمجهول ويدل على توظيف الرواية بطريقة رمزية، من غير نفي مرجعيتها التاريخية.
- source_word: αὗται
  choice: هاتين المرأتين
  rationale: اسم الإشارة مؤنث جمع ويعود إلى هاجر وسارة؛ وإظهار «المرأتين» يزيل الالتباس في العربية.
- source_word: διαθῆκαι
  choice: عهدين
  rationale: «عهد» هو المقابل الكتابي والسياقي الأنسب، ولا سيما مع الإشارة إلى سيناء.
- source_word: μία μὲν
  choice: أحدهما
  rationale: يفتتح الطرف الأول من مقابلة تستمر في الآية التالية، وصيغة «أحدهما» عربية طبيعية.
- source_word: ἀπὸ ὄρους Σινᾶ
  choice: من جبل سيناء
  rationale: ينقل معنى المصدر أو المنشأ بوضوح وبالصياغة العربية المألوفة.
- source_word: γεννῶσα
  choice: يلد أولادًا
  rationale: يحافظ على صورة الولادة في الاستعارة؛ وجاء الفعل مذكرًا لأن مرجعه النحوي «العهد».
- source_word: εἰς δουλείαν
  choice: للعبودية
  rationale: ينقل اتجاه الولادة ونتيجتها المقصودة ضمن السياق، مع إبراز حالة الاستعباد القوية في δουλεία.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: وهو هاجر
  rationale: يعود الضمير في العربية إلى «العهد» المذكر، مع إبقاء التطابق الرمزي المباشر بين العهد وهاجر.
theological_decisions:
- issue: طبيعة استخدام بولس لرواية هاجر وسارة
  choice: تُفسَّر على سبيل الرمز
  alternative: هذه الأمور رمز / هي حكاية رمزية
  rationale: تعكس الصياغة طريقة تفسير الرواية أو توظيفها، ولا تفترض أن بولس ينفي تاريخية الأشخاص والأحداث.
- issue: دلالة δουλεία
  choice: العبودية
  alternative: الاستعباد أو الرق
  rationale: «العبودية» واضحة ومألوفة في هذا السياق، وتحفظ قوة التقابل اللاهوتي بين العهدين من غير تلطيف معنى الخضوع المقيد.
- issue: هوية العهد مع هاجر
  choice: وهو هاجر
  alternative: وهي هاجر
  rationale: المطابقة النحوية العربية تتطلب رجوع الضمير إلى «العهد» المذكر، بينما تبقى هوية الصورة الرمزية صريحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «تمثّلان» لإيضاح العلاقة بين المرأتين والعهدين من غير إلغاء التطابق الرمزي الذي تصرّح به العبارة الختامية. وُضعت علامتا الحاشية [a] و[b] في المتن.
