  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: ar
  text: 'ولأنكم أبناءٌ[a]، أرسل الله روح ابنه إلى قلوبنا[b]، وهو يصرخ: «أبّا[c]، يا أبتِ!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لفظ «أبناء» يحفظ لغة بولس عن البنوة والميراث في هذا السياق، والمقصود به جميع المؤمنين، رجالًا ونساءً.
    reason: cultural_note
  - marker: b
    text: تقرأ بعض المخطوطات «قلوبكم» بدلًا من «قلوبنا».
    reason: textual_variant
  - marker: c
    text: «أبّا» لفظ آرامي للنداء بمعنى «يا أبتِ»، وقد أبقاه النص اليوناني بلفظه لما يحمله من توكيد وقرب.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δέ
  choice: ولأنكم
  rationale: تنقل الواو قوة δέ الرابطة الخفيفة، وتنقل «لأن» وظيفة ὅτι التعليلية، مع وصل العبارة بما قبلها اتصالًا طبيعيًا.
- source_word: ἐστε υἱοί
  choice: أنكم أبناءٌ
  rationale: يحافظ «أبناء» على لغة البنوة والميراث التي يقوم عليها سياق غلاطية 3–4، وتشمل هنا جميع المؤمنين لا الذكور وحدهم.
- source_word: ἐξαπέστειλεν ὁ θεὸς
  choice: أرسل الله
  rationale: صياغة عربية واضحة تحفظ الفعل الإلهي المكتمل الذي يدل عليه الماضي اليوناني.
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: روح ابنه
  rationale: تحفظ علاقة الإضافة ووزن العبارة اللاهوتي دون تفسير زائد.
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: إلى قلوبنا
  rationale: 'ترجمة مباشرة وطبيعية تحفظ لفظ «القلوب» بوصفه تعبيرًا كتابيًا عن باطن الإنسان، وتتبع قراءة SBLGNT: ἡμῶν.'
- source_word: κρᾶζον
  choice: صارخًا
  rationale: اسم الحال المفرد يطابق «الروح» ويجعله الصارخ صراحة، كما في نحو النص اليوناني، ويحفظ حيوية الفعل.
- source_word: Αββα
  choice: أبّا
  rationale: نقل صوتي للفظ الآرامي الذي أبقاه النص اليوناني، مع بيان معناه في الحاشية.
- source_word: ὁ πατήρ
  choice: يا أبتِ
  rationale: أداة النداء والصيغة العربية الفصيحة تنقلان الوظيفة الندائية للعبارة، بدل الترجمة الحرفية الجامدة «الآب».
theological_decisions:
- issue: ترجمة υἱοί في سياق التبنّي والميراث
  choice: أبناء
  alternative: أولاد
  rationale: «أبناء» تحافظ على خيط البنوة وحق الميراث في حجة بولس، مع توضيح أن المقصود جميع المؤمنين.
- issue: الضمير المتصل بلفظ «القلوب»
  choice: قلوبنا
  alternative: قلوبكم
  rationale: النص المقدم من SBLGNT يقرأ ἡμῶν، أي «نا»، ولذلك تُتبع هذه القراءة في المتن، وتُذكر القراءة الأخرى في الحاشية.
- issue: هوية الصارخ
  choice: الروح هو الصارخ
  alternative: المؤمنون يصرخون بالروح
  rationale: κρᾶζον محايد مفرد يطابق τὸ πνεῦμα نحويًا، فيجعل الروح فاعل الصراخ في هذه الجملة، من غير نفي أن المؤمنين يخاطبون الله به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت لغة البنوة والميراث، ونُقل النداء بصيغة عربية طبيعية. جُمعت المعلومتان المعجمية والنصية في الحاشية [b] لتجنب إقحام علامة منفصلة في موضع لا يخص قراءة «قلوبنا»، مع ظهور جميع علامات الحواشي المستخدمة في المتن.
