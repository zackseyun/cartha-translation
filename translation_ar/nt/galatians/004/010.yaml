theological_decisions:
- issue: هل يُصرَّح بأن المذكور مناسبات يهودية أو دينية؟
  choice: إبقاء ألفاظ الزمن في المتن بلا أوصاف مثل «المقدسة» أو «الدينية».
  alternative: أنتم تراعون الأيام الدينية والشهور والمواسم والسنين.
  rationale: النص اليوناني يعدد وحدات زمنية بلا نعت؛ أما طبيعة المراعاة التقويمية فتُفهم من السياق، ولا ينبغي أن يضيف المتن تحديدًا غير مصرح به.
- issue: درجة التشديد في παρατηρεῖσθε
  choice: تراعون ... بدقة
  alternative: تراعون
  rationale: للفعل دلالة محتملة على الملاحظة أو المراعاة الدقيقة، وإظهارها هنا يحفظ قوة اللفظ مع بقاء طبيعة الممارسة غير محددة.
