  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: ar
  text: ولكن لما جاء ملء الزمان[a]، أرسل[b] الله ابنه، مولودًا من امرأة[c]، مولودًا تحت الشريعة[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لما اكتمل الزمان» أو «لما تمّ الوقت».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «بعث»؛ والفعل اليوناني المركب يفيد الإرسال أو الإيفاد إلى الخارج.'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا أيضًا: «من امرأة»؛ والعبارة تؤكد ولادة الابن البشرية الحقيقية.'
    reason: lexical_alternative
  - marker: d
    text: أي تحت سلطان شريعة موسى.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ولكن لما
  rationale: تنقل ὅτε معنى الزمن، وتنقل δέ انتقالًا سياقيًا ذا مقابلة خفيفة مع ما سبق دون المبالغة في حدة التضاد.
- source_word: ἦλθεν τὸ πλήρωμα τοῦ χρόνου
  choice: جاء ملء الزمان
  rationale: صياغة عربية موجزة تحفظ صورة مجيء الملء، وتدل على بلوغ الزمن تمامه أو موعده المحدد.
- source_word: ἐξαπέστειλεν
  choice: أرسل
  rationale: الفعل العربي الطبيعي للمهمة والإيفاد، وهو يؤدي معنى الإرسال من غير إضافة وجهة لم يذكرها النص.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: ابنه
  rationale: ينقل المفعول والملكية بعبارة عربية طبيعية، ويحفظ دلالة أن الابن كان ابنه حين أرسله.
- source_word: γενόμενον ἐκ γυναικός
  choice: مولودًا من امرأة
  rationale: في هذا التركيب يدل γενόμενον مع ἐκ γυναικός على الولادة البشرية؛ و«من امرأة» تحفظ معنى المصدر الذي تفيده ἐκ.
- source_word: γενόμενον ὑπὸ νόμον
  choice: مولودًا تحت الشريعة
  rationale: تكرار «مولودًا» يحفظ التوازي بين العبارتين، و«تحت الشريعة» تنقل الخضوع لسلطانها مع إبقاء تعبير بولس موجزًا.
theological_decisions:
- issue: إنسانية الابن الحقيقية في γενόμενον ἐκ γυναικός
  choice: مولودًا من امرأة
  alternative: صائرًا من امرأة
  rationale: «مولودًا» يوضح الولادة البشرية الحقيقية بحسب دلالة التركيب، من غير أن ينفي سبق وجود الابن الذي يوحي به قول النص إن الله أرسله.
- issue: مرجع νόμος في ὑπὸ νόμον
  choice: تحت الشريعة
  alternative: تحت ناموس أو تحت قانون على وجه عام
  rationale: سياق غلاطية يرجح شريعة موسى وسلطانها العهدي، لكن المتن يحافظ على إيجاز الأصل، ويأتي التحديد في الحاشية بدل توسيع العبارة داخله.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ومهيبة. استُعمل «الزمان» في العبارة الاصطلاحية «ملء الزمان»، و«الشريعة» لأنها أوضح للقارئ المعاصر من «الناموس»، مع إبقاء تحديد شريعة موسى في الحاشية. وُضعت علامات الحواشي بحسب ترتيب ظهورها في النص.
