lexical_decisions:
- source_word: Λέγετέ μοι
  choice: قولوا لي
  rationale: يحافظ على صيغة الأمر الموجَّهة إلى جماعة وعلى نبرة التحدي المباشر، وهو تعبير عربي طبيعي وواضح.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: يا من تريدون أن تكونوا تحت الناموس
  rationale: تنقل العبارة الوصفية الموجَّهة إلى المخاطبين، وتحفظ صورة بولس القانونية «تحت الناموس» دون شرحها داخل المتن.
- source_word: νόμον / τὸν νόμον
  choice: الناموس
  rationale: اختير المصطلح نفسه في الموضعين للمحافظة على التلاعب الدلالي بين الخضوع للناموس والإصغاء إلى ما يقوله الناموس. و«الناموس» في العربية الكتابية المعاصرة يدل طبيعيًا على شريعة موسى ويمكن أن يشير أيضًا إلى نص التوراة.
- source_word: οὐκ ἀκούετε
  choice: ألا تسمعون ما يقوله
  rationale: الفعل ἀκούω يحتمل السماع والإصغاء. هذه الصياغة عربية طبيعية، وتحفظ فعل السماع مع إظهار أن المقصود الانتباه إلى مضمون النص الذي سيستشهد به بولس.
theological_decisions:
- issue: مرجع νόμος في الاستعمالين
  choice: استعمال «الناموس» في الموضعين مع إبقاء الصلة بين السلطان العهدي والنص الكتابي
  alternative: «الشريعة» أو التصريح بـ«شريعة موسى»/«التوراة»
  rationale: السياق يرجّح شريعة موسى، ولا سيما رواية التكوين التي تلي، لكن التصريح بذلك في المتن يضيّق عمدًا ازدواج استعمال بولس للمصطلح أكثر مما يفعل اليوناني.
- issue: دلالة ἀκούετε
  choice: «تسمعون ما يقوله» بما يشمل السماع الواعي والإصغاء للحجة
  alternative: «ألا تصغون إلى الناموس؟» أو «ألا تسمعون الناموس؟»
  rationale: لا ينبغي حسم التوتر بين السماع والإصغاء حسمًا كاملًا؛ الصياغة المختارة مفهومة وتحافظ على صورة سماع النص، والحاشية تذكر البديل الأقرب لفظًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «الناموس» للمحافظة على مصطلح بولس المتكرر وعلى الصلة بين شريعة موسى ونصها الكتابي، مع تجنّب إدخال تفسير طائفي أو حسم الازدواج الدلالي في المتن.
