  text: قولوا لي، يا من تريدون أن تكونوا تحت الناموس، ألستم تسمعون الناموس؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ألا تصغون إلى الناموس؟» فالفعل اليوناني قد يعني السماع أو الإصغاء، والمراد بالناموس هنا على الأرجح شريعة موسى، ولا سيما الرواية الكتابية التي يستشهد بها بولس بعد ذلك.'
