base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: ar
  text: لكنكم آنذاك[a]، إذ لم تكونوا تعرفون الله، استُعبِدتم لِلذين ليسوا آلهةً بطبيعتهم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكنكم سابقًا، وأنتم لا تعرفون الله، كنتم عبيدًا لِلذين ليسوا آلهةً في حقيقتهم».'
    reason: بديل معجمي وتركيبي لـ τότε μὲν ولصياغة علاقة φύσει بالنفي.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: لكنكم
  rationale: تفيد المقابلة مع الكلام السابق، وأُلحقت بها واو الجماعة لتستقيم العبارة العربية مع المخاطَبين.
- source_word: τότε μὲν
  choice: آنذاك
  rationale: تشير إلى المرحلة السابقة من حياة الغلاطيين، بينما تمهّد μέν للمقابلة الواردة في الآية التالية.
- source_word: οὐκ εἰδότες θεὸν
  choice: إذ لم تكونوا تعرفون الله
  rationale: تنقل التركيب الحالي بوصفه ظرفًا ملازمًا لحالتهم السابقة، وتحافظ «تعرفون» على معنى المعرفة بالله دون اختزاله في مجرد الإقرار بوجوده.
- source_word: ἐδουλεύσατε
  choice: استُعبِدتم
  rationale: تحافظ على دلالة العبودية البارزة في حجة الرسالة عن العبودية والحرية، بدل تخفيفها إلى مجرد الخدمة.
- source_word: τοῖς ... οὖσι θεοῖς
  choice: لِما ليس آلهةً
  rationale: يبقي المرجع غير محدد، فلا يضيف النص «أصنامًا» أو «شياطين»، ويصوغ نفي ألوهتها بوضوح.
- source_word: φύσει μὴ
  choice: ليس ... بطبيعته
  rationale: يفيد نفي الألوهية من جهة الحقيقة والطبيعة، لا مجرد نفي الاسم أو السمعة.
theological_decisions:
- issue: ماهية ما كان الغلاطيون مستعبَدين له سابقًا
  choice: لِما ليس آلهةً بطبيعته
  alternative: لأوثان أو لقوى شيطانية
  rationale: ينفي بولس ألوهية تلك المعبودات من جهة طبيعتها، لكنه لا يحدد هنا هل يقصد أصنامًا أم قوى روحية؛ لذلك تُرك المرجع عامًا حفاظًا على توتر النص ودقته.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل المبني للمجهول «استُعبِدتم» لإبراز قيد العبودية، واستُعملت «ما» لإبقاء المعبودات السابقة غير مشخصة وغير محددة كما في المصدر.
