lexical_decisions:
- source_word: τοσαῦτα
  choice: كلَّ هذا
  rationale: ينقل صيغة الجمع المحايد الدالة إجمالًا على كثرة ما مرّ به الغلاطيون، وهو تعبير عربي طبيعي في هذا السياق.
- source_word: ἐπάθετε
  choice: تألَّمتم
  rationale: الفعل اليوناني قد يعني التألم أو الاختبار عمومًا. اختير «تألَّمتم» لأنه يحفظ المعنى الأرجح المتعلق بالمشقات، مع إثبات البديل الأوسع في الحاشية.
- source_word: εἰκῇ
  choice: عبثًا
  rationale: تفيد الكلمة انعدام الجدوى أو الغاية، و«عبثًا» موجزة وطبيعية وتحفظ قوتها البلاغية.
- source_word: εἴ γε
  choice: إن كان حقًّا
  rationale: يحفظ العبارة الشرطية المتحفظة التي يراجع بها بولس الحكم السابق ولا يجزم بأن ما جرى كان بلا ثمرة.
- source_word: καὶ
  choice: حقًّا
  rationale: نُقلت دلالتها التوكيدية في هذا التركيب بلفظ «حقًّا» بدل ترجمة حرفية غير طبيعية مثل «حتى».
- source_word: εἰκῇ
  choice: عبثًا
  rationale: أُبقي تكرار اللفظة كما في اليونانية حفاظًا على الأثر البلاغي والتوتر بين احتمال ضياع ما مضى وعدم الجزم بذلك.
theological_decisions:
- issue: هل يقرر بولس أن تألمهم كان عبثًا؟
  choice: 'صياغة شرطية متحفظة: «إن كان حقًّا عبثًا»'
  alternative: الجزم بأن تألمهم كان عبثًا
  rationale: النص اليوناني يستخدم εἴ γε، فيترك باب الرجاء مفتوحًا ويؤهل السؤال السابق بدل أن يحسم النتيجة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «أهكذا» لإبراز الاستفهام الاستنكاري، مع المحافظة على تكرار «عبثًا» وعلى التحفظ الشرطي في خاتمة الآية.
