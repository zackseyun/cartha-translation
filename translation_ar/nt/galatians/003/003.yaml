  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: ar
  text: أإلى هذا الحد أنتم عديمو الفهم؟ أبعدما بدأتم بالروح[a]، تُستكمَلون الآن بالجسد[b]؟
