lexical_decisions:
- source_word: οὕτως
  choice: أهكذا
  rationale: تلائم الاستفهام التوبيخي، وتجمع معنى الدرجة والحال في صياغة عربية طبيعية.
- source_word: ἀνόητοί
  choice: عديمو الفهم
  rationale: تنقل نقص الإدراك والتمييز بوضوح، من غير استعمال لفظ قد يوحي بشتيمة عامية أو بمحدودية عقلية.
- source_word: ἐναρξάμενοι
  choice: بعدما بدأتم
  rationale: تعكس سبق فعل البدء بالنسبة إلى الفعل الرئيس وتحافظ على المقابلة بين البداية والمسار الحالي.
- source_word: πνεύματι
  choice: بالروح
  rationale: الباء هي الأرجح للدلالة على الوسيلة أو الفاعلية في مقابل «بالجسد»، والسياق يشير إلى روح الله.
- source_word: νῦν
  choice: الآن
  rationale: تحافظ على التباين الزمني الحاد في توبيخ بولس.
- source_word: σαρκὶ
  choice: بالجسد
  rationale: تحافظ على مصطلح بولس وصورته المقابلة للروح، من غير حصر المعنى في الجهد البشري أو الطبيعة الخاطئة.
- source_word: ἐπιτελεῖσθε
  choice: تُستكمَلون
  rationale: تنقل صيغة المضارع المبني للمجهول على نحو طبيعي وتحفظ فكرة الوصول إلى الإتمام، من غير افتراض أن الكمال قد تحقق.
theological_decisions:
- issue: مرجع πνεύματι
  choice: روح الله، مع التعبير «بالروح»
  alternative: في الروح؛ أو الروح الإنساني
  rationale: يتناول السياق القريب نوال الروح وعمل الله بين المؤمنين، ولذلك فالإشارة إلى روح الله هي الأرجح، مع إبقاء احتمال الدلالة الظرفية في الحاشية.
- issue: معنى σάρξ في مقابل الروح
  choice: الجسد
  alternative: الجهد البشري؛ أو الطبيعة الخاطئة
  rationale: يحفظ اللفظ الحرفي اتساع المصطلح البولسي والتوتر المقصود بين فاعلية الروح والوسيلة البشرية الجسدية، بدل اختزاله في تفسير واحد.
- issue: دلالة صيغة ἐπιτελεῖσθε
  choice: تُستكمَلون، بصيغة مبنية للمجهول
  alternative: تُكمِلون؛ أو تبلغون الكمال
  rationale: الصيغة اليونانية تحتمل المبني للمجهول أو المتوسط، لكن القراءة المبنية للمجهول مناسبة للسياق وتحافظ على سؤال الكيفية التي يُستكمل بها ما بدأ.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة توبيخية رصينة. استُعمل «عديمو الفهم» بدل ألفاظ أشد تجريحًا، وحُفظت المقابلة البولسية بين «الروح» و«الجسد». جميع علامات الحواشي الواردة مثبتة في المتن.
