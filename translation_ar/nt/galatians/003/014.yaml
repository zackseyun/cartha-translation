base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: ar
  text: لكي تصل بركة إبراهيم إلى الأمم في المسيح يسوع[a]، ولكي ننال بالإيمان وعد الروح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في يسوع المسيح».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الروح الموعود به».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تدل على الغاية وتحافظ على البنية الغائية المتكررة في الجملتين.
- source_word: εἰς τὰ ἔθνη
  choice: للأمم
  rationale: لفظ «الأمم» طبيعي في العربية الكتابية المعاصرة ويدل في السياق البولسي على غير اليهود، مع إبقاء الصياغة قريبة من اليونانية.
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: بركة إبراهيم
  rationale: ينقل تركيب الإضافة بوضوح، ويشير إلى البركة المرتبطة بإبراهيم في سياق الحجة.
- source_word: γένηται
  choice: تصير
  rationale: يحافظ على الدلالة الأساسية للفعل γίνομαι وعلى شيء من انفتاحه الدلالي، بدل حصره في معنى الوصول وحده.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: «المسيح» ترجمة عربية راسخة للقب Χριστός، وتحافظ العبارة على صيغة الاتحاد أو المجال التي تؤديها ἐν دون شرح تفسيري زائد.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: وعد الروح
  rationale: يحافظ على الإضافة اليونانية ولا يحسم هل المقصود الوعد المتعلق بالروح أم الروح الموعود؛ ويُذكر البديل التفسيري في الحاشية.
- source_word: λάβωμεν
  choice: ننال
  rationale: فعل عربي طبيعي ورصين لمعنى التلقي، وتؤدي «لكي» قوة صيغة الغاية مع الفعل التابع.
- source_word: διὰ τῆς πίστεως
  choice: بالإيمان
  rationale: صياغة عربية موجزة وطبيعية تنقل معنى الوساطة في διά وتحافظ على المعنى المعتاد لـ πίστις هنا.
theological_decisions:
- issue: 'دلالة Χριστός: لقب أم صيغة اسمية'
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: يحافظ ترتيب «المسيح يسوع» على ترتيب الأصل وعلى قوة اللقب، و«المسيح» هو المقابل العربي الدلالي الراسخ لا مجرد نقل صوتي.
- issue: دلالة إضافة τοῦ πνεύματος
  choice: وعد الروح
  alternative: الروح الموعود به
  rationale: الصياغة الرئيسة تحافظ على غموض الإضافة في الأصل، بينما البديل محتمل في السياق لكنه يحسم أن الروح نفسه هو مضمون الوعد.
- issue: هوية τὰ ἔθνη في السياق
  choice: الأمم
  alternative: غير اليهود
  rationale: «الأمم» أقرب إلى اللفظ اليوناني وتحفظ الصدى العهدي، مع توضيح المقصود السياقي في الحاشية دون استبداله بتفسير داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حوفظ على تكرار «لكي» المقابل لتكرار ἵνα، وعلى ترتيب «المسيح يسوع». استُعمل «الأمم» بوصفه تعبيرًا مفهومًا في السياق، وهو هنا يشير إلى غير اليهود.
