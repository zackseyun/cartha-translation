base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: ar
  text: وَإِنْ كُنْتُمْ لِلْمَسِيحِ[a]، فَأَنْتُمْ إِذًا نَسْلُ إِبْرَاهِيمَ[b]، وَرَثَةٌ بِحَسَبِ وَعْدٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: إن كنتم تنتمون إلى المسيح.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ذُرِّيَّةُ إبراهيم»؛ واللفظ اليوناني مفرد في صيغته وجمعي في دلالته، ويردد اللفظ الذي استعمله بولس سابقًا في هذا الأصحاح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: لِلْمَسِيحِ
  rationale: نُقلت صيغة المضاف إليه الدالة على الانتماء بعبارة عربية موجزة ومباشرة، مع إبقاء «المسيح» لقبًا لا اسمًا مجردًا.
- source_word: σπέρμα
  choice: نَسْلُ
  rationale: «نسل» اسم جمع مفرد الصيغة، فيحفظ الدلالة الجماعية وصلة اللفظ بحجة بولس السابقة عن نسل إبراهيم، من غير غرابة «بذرة» في العربية.
- source_word: κληρονόμοι
  choice: وَرَثَةٌ
  rationale: هو المقابل العربي الطبيعي في السياق العائلي والعهدي، ويحفظ صورة نيل الميراث.
- source_word: κατ’ ἐπαγγελίαν
  choice: بِحَسَبِ وَعْدٍ
  rationale: يحفظ العبارة موجزة ونكرة كما في اليونانية، ولا يحسم هل المراد المعيار أم الأساس أم ما يوافق الوعد.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: وَإِنْ كُنْتُمْ ... فَأَنْتُمْ إِذًا
  rationale: يحفظ أداة الربط وبنية الشرط والنتيجة والاستنتاج في عربية واضحة.
theological_decisions:
- issue: هل يُترجم σπέρμα بلفظ جمع صريح أم باسم جمع مفرد يحفظ الصلة بحجة الأصحاح؟
  choice: نَسْلُ
  alternative: ذُرِّيَّةُ / أَحْفَادُ
  rationale: «نسل» يحافظ على المفرد الجمعي وعلى الصلة اللفظية بحجة بولس السابقة بشأن نسل إبراهيم، من غير أن يفرض أن المقصود فرد واحد هنا.
- issue: كيفية التعبير عن الانتماء في Χριστοῦ
  choice: لِلْمَسِيحِ
  alternative: تَنْتَمُونَ إِلَى الْمَسِيحِ
  rationale: الصياغة المختارة أقرب إلى إيجاز اليونانية وتحفظ معنى الملكية أو الانتماء من غير توسيع تفسيري.
translation_notes:
  register: عربية فصحى معاصرة، واضحة وموقرة. استُعملت «للمسيح» للإيجاز والقرب من تركيب الأصل، و«نسل» للمحافظة على الخيط اللفظي واللاهوتي في غلاطية 3، و«بحسب وعد» لإبقاء العبارة نكرة وغير مفرطة في التفسير.
