id: GAL.3.13
reference: Galatians 3:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: ar
  text: 'افتدانا المسيح من لعنة الشريعة بأن صار لعنةً لأجلنا[a]، لأنه مكتوب[b]: «ملعون كل من عُلِّق على خشبة[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «نيابةً عنا»، وربما «بدلًا منا».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «فإنه مكتوب».'
    reason: alternative_reading
  - marker: c
    text: تعني ξύλον حرفيًا «خشبًا»، وقد تدل على شجرة أو شيء من الخشب؛ و«خشبة» تحافظ هنا على صورة الاقتباس الكتابي.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: المسيح
  rationale: اللفظ العربي المألوف للقب اليوناني، ويحفظ دلالته المسيانية من غير حاجة إلى نقل صوتي غريب.
- source_word: ἐξηγόρασεν
  choice: افتدانا
  rationale: ينقل معنى التحرير بثمن في صياغة عربية كتابية واضحة، ويحفظ القوة الخلاصية والاستعمال التجاري الكامن في الفعل.
- source_word: κατάρας
  choice: لعنة
  rationale: يحفظ المعنى القضائي والعهدي المباشر للاسم اليوناني بلا شرح تفسيري زائد.
- source_word: νόμου
  choice: الشريعة
  rationale: صياغة عربية معاصرة واضحة تشير في السياق إلى شريعة موسى، من غير إضافة اسم موسى إلى النص.
- source_word: γενόμενος
  choice: بأن صار
  rationale: يربط اسم الفاعل بالفعل الرئيس بوصفه وسيلة الافتداء، مع الحفاظ على صياغة طبيعية في العربية.
- source_word: ὑπὲρ ἡμῶν
  choice: لأجلنا
  rationale: يحفظ سعة ὑπέρ الدلالية، فيفيد المنفعة والنيابة من غير أن يفرض في المتن معنى «بدلًا منا» وحده.
- source_word: κατάρα
  choice: لعنةً
  rationale: يحافظ على الاسم الخبري الصادم في تعبير بولس، ولا يخففه بتحويله إلى مجرد صفة مثل «ملعونًا».
- source_word: ὅτι γέγραπται
  choice: لأنه مكتوب
  rationale: يعكس القراءة السببية للنص ويقدم الاقتباس بوصفه تعليلًا؛ أما معنى «فإنه مكتوب» فممكن أيضًا ومذكور في الحاشية.
- source_word: Ἐπικατάρατος
  choice: ملعون
  rationale: المقابل العربي المباشر والطبيعي، ويحفظ قوة صيغة الاقتباس الكتابي.
- source_word: κρεμάμενος
  choice: من عُلِّق
  rationale: ينقل دلالة التعليق في صياغة عربية عامة ملائمة للاقتباس، من غير تحديد أداة التعليق أو طريقته بما يتجاوز الأصل.
- source_word: ξύλου
  choice: خشبة
  rationale: ξύλον قد يعني الخشب أو الشجرة أو شيئًا مصنوعًا من الخشب؛ و«خشبة» طبيعية في هذا السياق وتحفظ صورة الاقتباس من التثنية من غير أن تستبدل بها لفظ «صليب» التفسيري.
theological_decisions:
- issue: مدى دلالة ὑπὲρ ἡμῶν في لغة الكفارة
  choice: لأجلنا
  alternative: نيابةً عنا؛ بدلًا منا
  rationale: العبارة تثبت أن عمل المسيح كان لمصلحتنا ويحمل إمكان معنى النيابة، لكن حرف الجر نفسه أوسع من أن يُلزم المتن بصياغة بدلية أضيق.
- issue: قوة التعبير γενόμενος κατάρα
  choice: صار لعنةً
  alternative: صار ملعونًا
  rationale: الأصل يستعمل اسمًا لا صفة، ولذلك تُحفظ صياغته القوية وما فيها من توتر لاهوتي بدل تلطيفها أو شرح كيفية حمل المسيح اللعنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «الشريعة» بدل اللفظ التراثي الأقل تداولًا «الناموس»، وحُفظت العبارة الاسمية القوية «صار لعنةً». جميع علامات الحواشي الواردة مثبتة في المتن بحسب ترتيب ظهورها.
