  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: ar
  text: ومن الواضح أن لا أحد يُبرَّر أمام الله بالناموس، لأن «البارّ بالإيمان يحيا».[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «البارّ بالأمانة يحيا».'
    reason: lexical_alternative
  - marker: b
    text: يقتبس بولس هنا من حبقوق 2:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι δὲ
  choice: وواضحٌ أن
  rationale: تنقل δὲ بوصفها أداة انتقال خفيفة في سياق الحجة، من غير جعلها «الآن» زمنية، وتدمج ὅτι مع العبارة العربية الطبيعية.
- source_word: ἐν νόμῳ
  choice: بالناموس
  rationale: الباء تعبّر بوضوح عن الوسيلة في هذا السياق القضائي، و«الناموس» هو اللفظ العربي الكتابي المألوف للشريعة الموسوية هنا.
- source_word: οὐδεὶς
  choice: لا أحد
  rationale: يحفظ النفي العام بصياغة عربية واضحة مباشرة.
- source_word: δικαιοῦται
  choice: يُبرَّر
  rationale: يحفظ الدلالة القضائية للفعل وصيغته المبنية للمجهول، من غير شرح تفسيري داخل النص.
- source_word: παρὰ τῷ θεῷ
  choice: أمام الله
  rationale: تعبّر عن منزلة الإنسان في حكم الله وتحفظ الإيحاء القضائي.
- source_word: δῆλον
  choice: واضحٌ
  rationale: صياغة عربية طبيعية تنقل تقرير بولس أن النتيجة بيّنة.
- source_word: Ὁ δίκαιος
  choice: البارّ
  rationale: ينقل الصفة المستعملة اسماً بصيغة عربية كتابية واضحة.
- source_word: ἐκ πίστεως
  choice: بالإيمان
  rationale: يحافظ على القراءة المباشرة الشائعة في استشهاد بولس، مع إثبات احتمال «الأمانة» في الحاشية.
- source_word: ζήσεται
  choice: يحيا
  rationale: المضارع العربي في الاقتباس الحكمي يؤدي معنى المستقبل اليوناني بصورة طبيعية وموجزة.
theological_decisions:
- issue: تعلّق عبارة ἐκ πίστεως في الاقتباس
  choice: «البارّ بالإيمان يحيا» مع إبقاء التعلّق النحوي غير محسوم تماماً
  alternative: «من يتبرر بالإيمان يحيا» أو «البارّ يحيا بالأمانة»
  rationale: ترتيب العربية قريب من اليونانية ويتيح فهم العبارة مع «البارّ» أو مع «يحيا»، فلا يحسم توتراً تفسيرياً لا تحسمه الصياغة اليونانية وحدها.
- issue: دلالة πίστις
  choice: الإيمان
  alternative: الأمانة
  rationale: «الإيمان» هو المقابل المباشر المألوف في هذا السياق البولسي، لكن المجال الدلالي يسمح بـ«الأمانة»، لذلك حُفظ البديل في الحاشية.
- issue: التعريف بأن العبارة اقتباس كتابي
  choice: إضافة «لأن الكتاب يقول»
  alternative: «لأن» ثم الاقتباس مباشرة
  rationale: الإضافة التفسيرية الوجيزة توضح وظيفة ὅτι الثانية في تقديم الدليل الكتابي؛ وهي ليست جزءاً لفظياً مستقلاً من اليونانية، ولذلك تُذكر طبيعتها في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية وقورة. استُعمل «الناموس» لاتساق السياق البولسي، و«يُبرَّر» للمحافظة على المصطلح القضائي. وُضعت علامتا الحاشيتين بعد الاقتباس الذي تتصلان به.
