revisions:
- from: 'وواضحٌ أن لا أحد يُبرَّر أمام الله بالناموس، لأن الكتاب يقول: «البارُّ بالإيمان يحيا».[a][b]'
  to: ومن الواضح أن لا أحد يُبرَّر أمام الله بالناموس، لأن «البارّ بالإيمان يحيا».[a][b]
  rationale: حُذفت إضافة «الكتاب يقول» لأنها غير موجودة في النص اليوناني، وحُذفت الحاشية التي كانت تبررها. كما اختُصرت حاشية البديل المعجمي لتسجل «الأمانة» من غير شرح تفسيري زائد. وتحافظ الصياغة المنقحة على المصطلحات الرئيسة وعلى قابلية تعلّق «بالإيمان» بكل من «البارّ» و«يحيا»، من غير حسم تفسيري.
