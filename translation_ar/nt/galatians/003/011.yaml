review_pass:
  verdict: revise
  source_fidelity: تضيف المسودة عبارة «الكتاب يقول» إلى المتن، مع أن اليونانية لا تتضمن فعلاً من قبيل «يقول» ولا لفظ «الكتاب» في هذه الآية؛ بل تقدّم ὅτι الثانية الاستشهاد دليلاً. هذه الإضافة، حتى مع التنبيه إليها في الحاشية، تتجاوز التكافؤ الأمثل. أما «بالناموس»، و«يُبرَّر»، و«أمام الله»، وصيغة الاقتباس «البارّ بالإيمان يحيا» فتمثّل النص اليوناني تمثيلاً أميناً وتحفظ الإيجاز والالتباس التركيبي في الاقتباس.
  naturalness: «ومن الواضح أن» فصيحة معاصرة وطبيعية، وتؤدي الانتقال الخفيف الذي تفيده δέ دون تحويله إلى ظرف زمني أو مقابلة قوية. وحذف العبارة التفسيرية الزائدة يجعل الجملة أكثر سلاسة ومباشرة.
  terminology: «الناموس» مصطلح كتابي عربي راسخ ومناسب في السياق البولسي، و«يُبرَّر» يحافظ على المصطلح القضائي دون تفسير مذهبي. «البارّ» و«الإيمان» مناسبان، وتبقى «الأمانة» بديلاً معجمياً موجزاً في الحاشية من غير توسيع تفسيري غير لازم.
