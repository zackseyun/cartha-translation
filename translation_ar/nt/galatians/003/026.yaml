  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: ar
  text: لأنكم جميعًا أبناءُ الله[a] بالإيمان بالمسيح يسوع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أولاد الله». يقول اليوناني حرفيًا «أبناء»، وهو تعبير يشمل هنا جميع المؤمنين ويحافظ على دلالة مكانة البنوة والميراث.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: جميعًا
  rationale: تؤكد شمول جميع المخاطَبين، ويتضح ارتباطها بضمير الجمع في «أنتم».
- source_word: γὰρ
  choice: فَـ
  rationale: تفيد التعليل وربط الآية بما قبلها، وحرف الفاء طبيعي وواضح في العربية.
- source_word: υἱοὶ θεοῦ
  choice: أبناءُ الله
  rationale: يحافظ «أبناء» على اللفظ البنوي في اليونانية وعلى دلالة المكانة والميراث، مع شمول جماعة المؤمنين كلها كما يدل «جميعًا».
- source_word: διὰ τῆς πίστεως
  choice: بالإيمان
  rationale: تعبير عربي طبيعي يؤدي معنى الوسيلة الذي تفيده διά مع المضاف إليه.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: بالمسيح يسوع
  rationale: ترجمة طبيعية للتركيب عند اتصاله بالإيمان؛ و«المسيح» ينقل Χριστός بوصفه لقبًا، مع إبقاء ترتيب اللقب والاسم كما في الأصل.
theological_decisions:
- issue: اللغة البنوية المذكرة
  choice: أبناء الله
  alternative: أولاد الله
  rationale: استُبقيت دلالة υἱοί الصريحة وما تحمله في السياق البولسي من مكانة البنوة والميراث، من غير قصر الوعد على الذكور؛ فالسياق نفسه يقول «جميعًا».
- issue: تعلّق عبارة ἐν Χριστῷ Ἰησοῦ
  choice: بالإيمان بالمسيح يسوع
  alternative: بالإيمان، في المسيح يسوع
  rationale: الأقرب في العربية والسياق أن العبارة تحدد متعلَّق الإيمان، مع بقاء مفهوم الوجود في المسيح حاضرًا في السياق الأوسع؛ تجنبت الصياغة البديلة لأنها ثقيلة وقد توحي بفصل نحوي جازم لا يفرضه اليوناني.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: خريستوس
  rationale: Χριστός لقب ذو معنى، و«المسيح» ترجمته العربية الراسخة، لا مجرد نقل صوتي.
translation_notes:
  register: صياغة عربية فصحى معاصرة وموقرة. استُعمل «فأنتم» لبيان قوة التعليل والربط، ووُضعت فاصلة قبل عبارة الوسيلة لتيسير القراءة من غير تفكيك الجملة.
