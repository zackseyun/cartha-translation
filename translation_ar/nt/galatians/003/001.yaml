- from: يَا أَيُّهَا الْغَلَاطِيُّونَ الْأَغْبِيَاءُ، مَنْ سَحَرَكُمْ[a]، أَنْتُمُ الَّذِينَ أَمَامَ أَعْيُنِكُمْ صُوِّرَ يَسُوعُ الْمَسِيحُ عَلَنًا مَصْلُوبًا[b]؟
  to: يَا أَيُّهَا الْغَلَاطِيُّونَ الْحُمْقَى، مَنْ سَحَرَكُمْ، وَقَدْ عُرِضَ أَمَامَ أَعْيُنِكُمْ يَسُوعُ الْمَسِيحُ مَصْلُوبًا بِوُضُوحٍ[b]؟
  rationale: أزيلت صلة الموصول العربية المتعثرة، واستُعيض عنها بجملة حالية («وقد عُرض أمام أعينكم») تؤدي بوضوح علاقة المخاطَبين بالعرض في اليونانية. كما استُبدل «علنًا» بـ«بوضوح» لتقريب دلالة προεγράφη في السياق من دون افتراض عرض عام أو صورة مرئية حرفية. نُقل مرساة الحاشية إلى نهاية العبارة التي تشرحها. لا يلزم تثبيت علامة a في النص لأن الحاشية a في المسودة غير مربوطة بعلامة ظاهرة؛ ولحل هذا الخلل المحتمل، ينبغي إدراجها بعد «سحركم» في النص المنشور.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:25Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما في ذلك الاستعارة الحادة في «سحركم» ولقب «المسيح». لكن تركيب «أنتم الذين أمام أعينكم» غير سليم ولا يؤدي صلة الموصول اليونانية بصورة عربية مفهومة، كما أن «علنًا» قد يحوّل التركيز من العرض الواضح أمام المخاطَبين إلى العلنية العامة.
  naturalness: 'الصياغة الحالية متعثرة، ولا سيما بعد الفاصلة: «أنتم الذين أمام أعينكم صُوِّر...». الصياغة المعدلة فصحى حديثة واضحة وتحفظ نبرة التوبيخ والسؤال البلاغي.'
  terminology: «يسوع المسيح» مقابل طبيعي ودقيق لـ Ἰησοῦς Χριστός. واستعمال «سحركم» يحفظ صورة βασκαίνω، مع إيراد «خدعكم» بديلًا في الحاشية. استبدلت «الأغبياء» بـ«الحمقى» لأنه أقرب إلى توبيخ ἀνόητοι في هذا النداء وأفصح في هذا السياق، من غير تحميل اللفظ حكمًا أخلاقيًا إضافيًا.
  issues:
  - severity: high
    issue: 'تركيب صلة الموصول غير سليم: «أنتم الذين أمام أعينكم صُوِّر...»'
    rationale: οἷς κατ’ ὀφθαλμοὺς يحدد المخاطَبين الذين عُرض المسيح أمام أعينهم، أما الصياغة العربية فتضيف ضميرًا وموصولًا زائدين وتنتج جملة غير طبيعية ومبهمة.
  - severity: medium
    issue: «علنًا» ليس أدق تعبير عن προεγράφη في هذا الموضع
    rationale: المقصود عرضٌ واضح وحيوي أمامهم؛ وقد توحي «علنًا» في العربية أساسًا بأنه تم في مكان عام، وهي دلالة ليست لازمة في النص.
  - severity: low
    issue: موضع علامة الحاشية الخاصة بـ προεγράφη/ἐσταυρωμένος متأخر
    rationale: وضع العلامة بعد «مصلوبًا» يجعلها تبدو خاصة بالصلب وحده، مع أن بدائل الحاشية تشرح فعل العرض ووصف المصلوب معًا؛ فالأوضح وضعها بعد عبارة العرض كاملة.
