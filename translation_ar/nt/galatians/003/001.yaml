  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: ar
  text: يَا أَيُّهَا الْغَلَاطِيُّونَ الْحُمْقَى، مَنْ سَحَرَكُمْ، وَقَدْ عُرِضَ أَمَامَ أَعْيُنِكُمْ يَسُوعُ الْمَسِيحُ مَصْلُوبًا بِوُضُوحٍ[b]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'يمكن أيضًا ترجمة العبارة: «وُضع أمام أعينكم بوضوح يسوع المسيح مصلوبًا»، أو: «عُرض أمامكم كأنه على لافتة، مصلوبًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητοι
  choice: الْأَغْبِيَاءُ
  rationale: تنقل التوبيخ على انعدام الفهم أو التعقل، من غير أن تضيف حكمًا أخلاقيًا أشد مما تفيده الصفة اليونانية.
- source_word: Γαλάται
  choice: الْغَلَاطِيُّونَ
  rationale: الصيغة العربية المعيارية لاسم أهل غلاطية، وتلائم النداء المباشر.
- source_word: ἐβάσκανεν
  choice: سَحَرَكُمْ
  rationale: تحفظ الصورة البلاغية الحادة التي توحي بالسحر أو التأثير الخبيث، بدل تسطيحها إلى مجرد الخداع.
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: أَنْتُمُ الَّذِينَ أَمَامَ أَعْيُنِكُمْ
  rationale: تحافظ على صلة الموصول وبنية الجملة اليونانية، وتعبّر عربيًا عن الوضوح والمواجهة المباشرة.
- source_word: Ἰησοῦς Χριστός
  choice: يَسُوعُ الْمَسِيحُ
  rationale: يُترجم Χριστός بوصفه لقبًا ذا معنى، لا اسمًا عائليًا، مع إبقاء اسم يسوع بصيغته العربية المألوفة.
- source_word: προεγράφη
  choice: صُوِّرَ ... عَلَنًا
  rationale: يجمع بين العرض الواضح أمام المخاطَبين والطابع العلني الذي يحتمله الفعل في هذا السياق، من غير حصره في معنى الكتابة السابقة.
- source_word: ἐσταυρωμένος
  choice: مَصْلُوبًا
  rationale: حال خبرية تصف الهيئة التي عُرض بها يسوع، وتلائم وظيفة اسم المفعول اليوناني.
theological_decisions:
- issue: دلالة Χριστός في التعبير Ἰησοῦς Χριστός
  choice: يَسُوعُ الْمَسِيحُ
  alternative: يَسُوعُ الْمَسِيح / يَسُوعُ كَرِيسْتُوس
  rationale: «المسيح» هو المقابل العربي الطبيعي الذي يحفظ معنى اللقب، ولا يحوله إلى اسم مجرد من دلالته.
- issue: كيفية عرض صلب يسوع أمام الغلاطيين
  choice: صُوِّرَ ... عَلَنًا مَصْلُوبًا
  alternative: أُعلن بوضوح أنه مصلوب / عُرض كأنه في لافتة مصلوبًا
  rationale: يحفظ الاختيار قوة الإعلان أو التصوير العلني الواضح من غير أن يقرر هل المقصود رسم بصري حرفي أم كرازة حية مجازية.
translation_notes:
  register: فصحى حديثة واضحة ذات نبرة خطابية مهيبة. أُبقي السؤال جملة واحدة اتباعًا للبنية اليونانية، مع صياغة الموصول صراحة لتجنب الغموض في العربية. استُخدم الضبط الجزئي/الكامل في نص الآية لتحسين وضوح الإعراب والقراءة.
