  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: ar
  text: لا يوجد يهوديٌّ ولا يونانيٌّ، ولا يوجد عبدٌ ولا حرٌّ، ولا يوجد ذكرٌ وأنثى[a]؛ لأنكم جميعًا واحدٌ في المسيح يسوع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تُصاغ العبارة بحسب المعنى: «لا يوجد ذكرٌ ولا أنثى». لكن اليونانية تقول حرفيًّا: «ذكرٌ وأنثى»، ولعلها تلمّح إلى تكوين 1:27.'
    reason: يوضح اختلاف حرف العطف في الزوج الثالث والتلميح النصي المحتمل.
  - marker: b
    text: 'اليونانية: «في المسيح يسوع»؛ و«المسيح» هنا لقب، أي الممسوح أو المسيّا.'
    reason: يوضح القوة اللقبية للفظ Χριστός.
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: ليس
  rationale: يحافظ على النفي الوجودي المتكرر وإيقاع العبارة، بصياغة عربية موجزة وواضحة.
- source_word: Ἰουδαῖος
  choice: يهوديّ
  rationale: المعنى العرقي الديني هو الأرجح في مقابل «يوناني».
- source_word: Ἕλλην
  choice: يونانيّ
  rationale: ينقل اللفظ اليوناني المحدد دون توسيعه إلى «أممي».
- source_word: δοῦλος
  choice: عبد
  rationale: يدل هنا على وضع العبودية، ويتضح ذلك من مقابلته بالحر.
- source_word: ἐλεύθερος
  choice: حرّ
  rationale: المقابل العربي الطبيعي والموجز لـ«عبد».
- source_word: ἄρσεν καὶ θῆλυ
  choice: ذكرٌ وأنثى
  rationale: يحفظ الدلالة الجنسية للألفاظ، كما يحفظ حرف العطف «و» والتلميح المحتمل إلى تكوين 1:27.
- source_word: πάντες ὑμεῖς
  choice: أنتم جميعًا
  rationale: يحفظ خطاب الجمع والتوكيد الشامل بصياغة عربية طبيعية.
- source_word: εἷς
  choice: واحد
  rationale: يبقي خبر المفرد كما في الأصل، من غير توسيعه تفسيريًا إلى «متحدون» أو «شخص واحد».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، وتحفظ العبارة معنى الوجود والاتحاد فيه.
theological_decisions:
- issue: كيفية نقل ἄρσεν καὶ θῆλυ بعد استعمال οὐδὲ في الزوجين السابقين
  choice: ليس ذكرٌ وأنثى
  alternative: ليس ذكرٌ ولا أنثى
  rationale: يحفظ «و» الواردة في الأصل بدل تسوية الأزواج الثلاثة، ويُبقي التلميح المحتمل إلى «ذكرًا وأنثى» في تكوين 1:27.
- issue: مدى تفسير εἷς ἐστε
  choice: أنتم جميعًا واحدٌ
  alternative: أنتم جميعًا متحدون
  rationale: يحفظ إيجاز النص وتوتره اللاهوتي من غير أن يحدد على نحو زائد طبيعة الوحدة أو يدّعي محو جميع الفروق.
- issue: نقل Χριστός بوصفه لقبًا
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: يحافظ على ترتيب الأصل وعلى قوة «المسيح» بوصفه لقبًا، مع استعمال الصيغة العربية الكتابية المفهومة والراسخة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع تكرار «ليس» للمحافظة على البنية البلاغية. أُبقي «ذكرٌ وأنثى» رغم غرابته النسبية لأنه فرق مقصود في الصياغة اليونانية، ووُضّح في الحاشية.
