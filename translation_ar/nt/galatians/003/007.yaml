  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: فاعلموا
  rationale: صيغة أمر جمع في السياق، و«اعلموا» تنقل الطلب المباشر بوضوح، مع الفاء لربط «إذًا» بالاستنتاج السابق.
- source_word: οἱ ἐκ πίστεως
  choice: الذين هم من الإيمان
  rationale: يحافظ على تركيب ἐκ الذي يدل على الانتساب أو الانطلاق من الإيمان، من غير اختزاله تفسيريًا إلى «الذين يؤمنون».
- source_word: οὗτοι
  choice: أولئك
  rationale: يحفظ اسم الإشارة التوكيدي المنفصل في اليونانية ويبرز أن هذه الفئة بعينها هي المقصودة.
- source_word: υἱοί
  choice: أبناء
  rationale: ترجمة طبيعية ودقيقة لصيغة الجمع، وتحفظ معنى البنوة والانتساب إلى إبراهيم.
theological_decisions:
- issue: دلالة عبارة «من الإيمان»
  choice: الإبقاء على الصياغة «الذين هم من الإيمان»
  alternative: «الذين يؤمنون» أو «أهل الإيمان»
  rationale: الصياغة المختارة تحافظ على اتساع التعبير اليوناني وعلى التوتر اللاهوتي المتعلق بالهوية والانتماء الناشئين من الإيمان، بدل حصره في وصف فعل ذهني.
- issue: التوكيد في «οὗτοι»
  choice: إظهاره بعبارة «أولئك هم»
  alternative: حذفه والاكتفاء بـ«هم أبناء إبراهيم»
  rationale: النص اليوناني يقدّم اسم إشارة صريحًا للتخصيص والتوكيد؛ وإظهاره يمنع تسطيح المقابلة التي يقيمها بولس.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حوفظ على بنية الاستنتاج والتوكيد في الأصل، وعلى العبارة اللاهوتية الكثيفة «من الإيمان» دون شرح زائد داخل المتن.
