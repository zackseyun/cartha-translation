  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: ar
  text: 'وقيلت الوعود لإبراهيم ولنسله[a]. لا يقول: «وللأنسال»[b]، كما لو كان يشير إلى كثيرين، بل كما لو كان يشير إلى واحد: «ولنسلك»، الذي هو المسيح[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة اللفظ اليوناني بـ«بذره» في جميع مواضع هذه الآية؛ وهو اسم مفرد ذو دلالة جمعية، وتقوم عليه حجة بولس.
    reason: lexical_alternative
  - marker: b
    text: 'في اليونانية: «وللبذور/للأنسال». يلفت بولس الانتباه إلى صيغة الجمع في العبارة.'
    reason: lexical_alternative
  - marker: c
    text: يمكن أيضًا نقل اللقب بصيغة «كريستوس».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: قيلت
  rationale: ينقل المبني للمجهول في اليونانية مباشرة وبصياغة عربية طبيعية، من غير إضافة دلالة زمنية غير موجودة في المصدر.
- source_word: ἐπαγγελίαι
  choice: الوعود
  rationale: المقابل العربي الواضح والمألوف لمعنى وعود الله في هذا السياق البولسي.
- source_word: σπέρμα / σπέρματι
  choice: نسل / نسلك
  rationale: «نسل» اسم جمع ذي صيغة مفردة، فيحفظ طبيعة اللفظ التي يقوم عليها استدلال بولس، وهو أفصح وأوضح من النقل الحرفي «بذرة» في سياق الذرية.
- source_word: τοῖς σπέρμασιν
  choice: لأنسال
  rationale: أُبقيت صيغة الجمع ظاهرة لأن الحجة تقوم على المقابلة بين المفرد والجمع، مع أن هذا الجمع قليل الدوران في العربية.
- source_word: ὡς ἐπὶ πολλῶν
  choice: كأنّه يتحدث عن كثيرين
  rationale: صياغة عربية طبيعية توضّح أن المقصود هو الإحالة إلى عدة أشخاص، من غير تحميل حرف الجر اليوناني معنى زائدًا.
- source_word: ἀλλ’ ὡς ἐφ’ ἑνός
  choice: بل عن واحد
  rationale: يحفظ التقابل الصريح بين الكثيرين والواحد بإيجاز عربي واضح.
- source_word: Χριστός
  choice: المسيح
  rationale: اللفظ العربي التقليدي الدقيق للقب اليوناني، ويحفظ هنا دلالته المسيانية في صيغة التعريف.
theological_decisions:
- issue: تعيين النسل الموعود في عبارة ὅς ἐστιν Χριστός
  choice: الذي هو المسيح
  alternative: الذي هو مسيح / الذي هو الكريستوس
  rationale: «المسيح» ينقل اللقب المسياني الطبيعي في العربية من غير تحويله إلى مجرد اسم عَلَم أو إدخال تفسير مذهبي زائد.
- issue: الحفاظ على استدلال بولس من صيغة المفرد والجمع
  choice: نسل / أنسال، ثم «عن واحد»
  alternative: ذرية / ذريات أو أحفاد
  rationale: يحافظ هذا الاختيار على التوتر بين كون «نسل» اسمًا جمعيًا وبين قراءة بولس له هنا من جهة الواحد، من غير محاولة حل هذا التوتر تفسيريًا داخل النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «أمّا» لإظهار قوة δὲ الانتقالية/التقابلية دون إدخال ظرف زمني مثل «الآن». وحُفظت المقابلة النحوية المقصودة بين «نسل» و«أنسال» رغم ندرة الجمع، لأنها مركز الحجة.
