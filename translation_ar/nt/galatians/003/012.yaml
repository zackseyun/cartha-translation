    rationale: 'النص اليوناني يقول «ὁ ποιήσας αὐτά»: «الذي يفعلها/يعملها»، حيث αὐτά مفعول مباشر. وتأتي «ἐν αὐτοῖς» لاحقًا في «يحيا بها». إبقاء الباء في الموضعين يطمس هذا الفرق التركيبي، وإن كان المعنى العام مفهومًا.'
