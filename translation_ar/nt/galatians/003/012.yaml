  to: 'أَمَّا النَّامُوسُ فَلَيْسَ مِنَ الإِيمَانِ، بَلْ: «مَنْ يَعْمَلُهَا يَحْيَا بِهَا».[a]'
  rationale: صُحِّح ضمير «يعملها» ليؤدي المفعول المباشر αὐτά، مع الإبقاء على «بها» لترجمة ἐν αὐτοῖς بحسب الدلالة الوسيلية في الاقتباس، وعلى البديل الحرفي «فيها» في الحاشية. ولا يغيّر ذلك التوتر المقصود بين الناموس والإيمان.
