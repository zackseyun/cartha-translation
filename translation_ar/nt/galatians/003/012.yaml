  source_fidelity: 'تحتاج الترجمة إلى تصحيح آمن في ضمير المفعول الأول: αὐτά في «ὁ ποιήσας αὐτά» تعني «يفعلها»، لا «يعمل بها». أما «ἐν αὐτοῖς» فيمكن نقلها بـ«بها»، مع إبقاء «فيها» بديلاً في الحاشية.'
  naturalness: «مَنْ يَعْمَلُهَا يَحْيَا بِهَا» عربية فصحى واضحة وطبيعية، وتحافظ على التمييز بين فعل الوصايا والحياة بها. وصيغة «أَمَّا النَّامُوسُ فَلَيْسَ مِنَ الإِيمَانِ» سليمة وتحفظ إيجاز الأصل.
  terminology: «الناموس» اصطلاح كتابي عربي راسخ ومناسب هنا. و«الإيمان» و«يحيا» ملائمان للسجل الكتابي الحديث. لا يلزم تفسير العبارة على أنها حصرٌ لمعنى بولس اللاهوتي.
