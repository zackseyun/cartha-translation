  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: ar
  text: 'أَمَّا النَّامُوسُ فَلَيْسَ مِنَ الإِيمَانِ، بَلْ: «مَنْ يَعْمَلُهَا يَحْيَا بِهَا».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يَحْيَا فِيهَا». والعبارة اقتباس من اللاويين 18: 5.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: νόμος
  choice: النَّامُوس
  rationale: اختير اللفظ الكتابي العربي الشائع للدلالة على الشريعة، مع إبقاء التعبير عامًا كما في اليونانية، في حين يوضح السياق أن شريعة موسى مقصودة.
- source_word: ἐκ πίστεως
  choice: مِنَ الإِيمَانِ
  rationale: ترجمة قريبة من تركيب الأصل تحفظ تقابل المصدر أو المبدأ بين الناموس والإيمان من غير تفسير زائد.
- source_word: ἀλλ’
  choice: بَلْ
  rationale: تفيد الاستدراك الانتقالي الحاد وتقدّم الاقتباس المقابل بصورة طبيعية.
- source_word: ὁ ποιήσας
  choice: مَنْ يَعْمَلُ
  rationale: صياغة عربية طبيعية تحفظ المعنى العام للمفرد الموصوف في اسم الفاعل اليوناني.
- source_word: αὐτά
  choice: بِهَا
  rationale: يعود الضمير إلى أحكام الناموس أو وصاياه من غير التصريح بما تركه النص اليوناني ضمنيًا.
- source_word: ζήσεται
  choice: يَحْيَا
  rationale: مضارع عربي ذو دلالة مستقبلية في هذا السياق، وهو أنسب للاقتباس الشرطي العام من صياغة أثقل تتضمن سوف.
- source_word: ἐν αὐτοῖς
  choice: بِهَا
  rationale: 'تفيد الباء الوسيلة أو الأساس، بما يلائم دلالة الاقتباس: يحيا الإنسان بعمل تلك الأحكام؛ وتُذكر الترجمة الحرفية البديلة في الحاشية.'
theological_decisions:
- issue: تقابل الناموس والإيمان عند بولس
  choice: ليس من الإيمان
  alternative: ليس قائمًا على الإيمان؛ لا يعمل وفق مبدأ الإيمان
  rationale: تحفظ الصياغة توتر العبارة البولسية وقربها من الأصل، من غير أن تحصر معنى ἐκ في تفسير لاهوتي واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «الناموس» لاتساقه مع الاصطلاح العربي الكتابي، وصيغ الاقتباس بعبارة موجزة وطبيعية.
