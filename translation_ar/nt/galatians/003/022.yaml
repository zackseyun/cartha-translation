base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: ar
  text: لكنّ الكتاب حبس كلَّ شيء[b] تحت الخطيئة، لكي يُعطى الوعد عن طريق الإيمان بيسوع المسيح[a] للذين يؤمنون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عن طريق أمانة يسوع المسيح».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «حبس الأشياء كلَّها تحت الخطيئة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέκλεισεν
  choice: حبس
  rationale: ينقل صورة الإحاطة والتقييد التي يحملها الفعل اليوناني، بلغة عربية واضحة، من غير إضافة تفسير مثل «تحت سلطان».
- source_word: ἡ γραφή
  choice: الكتاب
  rationale: يحافظ على صيغة المفرد وعلى تشخيص الكتاب بوصفه شاهدًا فاعلًا في العبارة البولسية.
- source_word: τὰ πάντα
  choice: كلَّ شيء
  rationale: يحفظ شمول صيغة الجمع المحايد ولا يقصرها على البشر وحدهم؛ وتُذكر الصياغة البديلة في الحاشية.
- source_word: ὑπὸ ἁμαρτίαν
  choice: تحت الخطيئة
  rationale: يحافظ على استعارة الخضوع في اليونانية من غير توسيع تفسيري مثل «تحت سلطان الخطيئة».
- source_word: ἡ ἐπαγγελία
  choice: الوعد
  rationale: هو المقابل المباشر والطبيعي للاسم اليوناني، من غير تحويله تفسيريًا إلى «الموعود» أو «عطية الوعد».
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: على أساس الإيمان بيسوع المسيح
  rationale: يعرض في المتن القراءة الشائعة للمضاف إليه بوصفه مفعوليًا، ويعبّر عن ἐκ بوضوح من غير جعل الإيمان استحقاقًا؛ أما قراءة «أمانة يسوع المسيح» فمحفوظة في الحاشية.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: اللفظ العربي المألوف للقب المسياني، ويحفظ هنا اقترانه باسم يسوع.
- source_word: δοθῇ
  choice: يُعطى
  rationale: يحفظ المبني للمجهول، وتؤدي «لكي» مع المضارع الغرض المقصود من صيغة ἵνα مع فعل الاحتمال اليوناني.
- source_word: τοῖς πιστεύουσιν
  choice: للذين يؤمنون
  rationale: يحفظ القوة الوصفية المستمرة لاسم الفاعل اليوناني، بدل تحويله إلى مجرد تسمية ثابتة مثل «للمؤمنين».
theological_decisions:
- issue: دلالة تركيب πίστεως Ἰησοῦ Χριστοῦ
  choice: 'المضاف إليه المفعولي: «الإيمان بيسوع المسيح»'
  alternative: 'المضاف إليه الفاعلي: «أمانة يسوع المسيح»'
  rationale: 'التركيب اليوناني محل خلاف حقيقي: فقد يدل على إيمان البشر بيسوع، أو على أمانة يسوع نفسه. اختيرت القراءة المفعولية في المتن لوضوحها وشيوعها، مع إبقاء القراءة الفاعلية في الحاشية حتى لا يُحسم التوتر اللاهوتي الذي يسمح به الأصل.'
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حوفظ على تشخيص «الكتاب» وعلى استعارة الحبس والخضوع، وتُركت بنية الجملة سببية وغائية كما في الأصل، مع علامات ترقيم تساعد القارئ على إدراك تعلق عبارة الإيمان بالوعد.
