base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: ar
  text: 'هذا وحده أريد أن أعرفه منكم: أبأعمال الشريعة نلتم الروح، أم بسماع الإيمان؟[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بسماعٍ مصحوبٍ بالإيمان»؛ وقد تعني العبارة أيضًا سماع الرسالة بإيمان.'
    reason: alternative_reading
  - marker: b
    text: يمكن أن تحمل الكلمة اليونانية المترجمة «الإيمان» معنى «الأمانة»، لكنه احتمال أضعف هنا بسبب إيجاز التركيب اليوناني.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: هذا وحده
  rationale: يحفظ تقديم العبارة للتوكيد وحدّة السؤال البلاغي بصياغة عربية طبيعية.
- source_word: θέλω μαθεῖν
  choice: أريد أن أعرفه
  rationale: ينقل معنى الرغبة في تحصيل الجواب من المخاطَبين؛ و«أعرف» أسلس في هذا السؤال العربي من الترجمة الحرفية «أتعلّم».
- source_word: ἀφ’ ὑμῶν
  choice: منكم
  rationale: مقابل مباشر لحرف الجر والضمير الجمع.
- source_word: ἐξ ἔργων νόμου
  choice: بأعمال الشريعة
  rationale: تحافظ «أعمال الشريعة» على التعبير البولسي الموجز، وتؤدي الباء معنى الوسيلة أو الأساس في المقابلة.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: السياق يدل على روح الله؛ ولا تُضاف صفة «القدس» لأنها غير مذكورة صراحة في اليونانية.
- source_word: ἐλάβετε
  choice: نلتم
  rationale: ينقل الفعل الماضي الدال على التلقي بصياغة عربية موجزة وطبيعية، مع إبقاء الروح عطية متلقاة.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: بسماعٍ مقترنٍ بالإيمان
  rationale: يعبّر بوضوح عن التركيب الإضافي اليوناني المضغوط من غير حسم زائد لموضوع السماع، ويحفظ المقابلة مع أعمال الشريعة.
- source_word: πίστεως
  choice: الإيمان
  rationale: هو المعنى الأرجح في السياق؛ أما «الأمانة» فاحتمال أضعف يُذكر في الحاشية.
theological_decisions:
- issue: مرجع «الروح»
  choice: روح الله الذي ناله المؤمنون
  alternative: اختبار روحي أو قوة روحية بوجه عام
  rationale: سياق غلاطية 3 يتحدث عن منح الله روحه للغلاطيين، لذلك يُفهم المرجع الشخصي الإلهي، من دون إضافة «القدس» إلى المتن.
- issue: علاقة πίστεως بـ ἀκοῆς
  choice: سماع مقترن بالإيمان
  alternative: سماع الإيمان، أو سماع رسالة الإيمان
  rationale: التركيب اليوناني موجز ويحتمل أكثر من علاقة دلالية؛ يحافظ المتن على المعنى الأرجح وتعرض الحاشية البدائل الحقيقية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم الاستفهام المقابل «أبـ... أم بـ...» للمحافظة على قوة السؤال البلاغي، ووُضعت علامتا الحاشيتين في المتن كما هو مطلوب.
