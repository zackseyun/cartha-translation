  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: ar
  text: 'والكتاب، إذ رأى مسبقًا أن الله يبرّر الأمم[a] بالإيمان، سبق فبشّر إبراهيم[b]: «فيك ستُبارَك جميع الأمم».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا أن تُفهم بمعنى «غير اليهود»؛ فاللفظ اليوناني ἔθνη قد يعني «الأمم» أو «الأمم غير اليهودية».
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بشّر إبراهيم بالإنجيل مسبقًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: سبق فرأى
  rationale: ينقل دلالة الرؤية المسبقة في اسم الفاعل الماضي، مع إبقاء «الكتاب» فاعلًا مُشخَّصًا كما في اليونانية.
- source_word: ἡ γραφή
  choice: الكتاب
  rationale: هو التعبير الاصطلاحي عن الكتاب المقدس في هذا السياق البولسي، لا عن كتابة عامة.
- source_word: ἐκ πίστεως
  choice: بالإيمان
  rationale: صياغة عربية طبيعية تدل على الوسيلة أو الأساس، من غير حسم ما لا يحسمه التركيب نفسه.
- source_word: δικαιοῖ
  choice: يبرِّر
  rationale: يحافظ على المصطلح البولسي الموجز ودلالته القضائية، من غير توسيعه إلى شرح تفسيري.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: الأمم ... جميع الأمم
  rationale: يحفظ تكرار اللفظ اليوناني والصلة الظاهرة بين تقرير بولس واقتباس وعد إبراهيم، مع توثيق احتمال معنى غير اليهود في الحاشية.
- source_word: προευηγγελίσατο
  choice: سبق فبشَّر
  rationale: يجمع بين معنى الإعلان بالبشارة ومعنى السبق الزمني الكامن في الفعل اليوناني.
- source_word: τῷ Ἀβραὰμ
  choice: إبراهيم
  rationale: جُعل مفعولًا به للفعل «بشَّر» وفق الاستعمال العربي الطبيعي؛ فالمعنى أن البشارة وُجِّهت إليه.
- source_word: Ἐνευλογηθήσονται
  choice: ستُبارَك
  rationale: ينقل المستقبل المبني للمجهول مباشرة، ويحافظ على صيغة الوعد.
- source_word: ἐν σοὶ
  choice: فيك
  rationale: يحافظ على حرف الجر وصياغة الاقتباس الإبراهيمي من غير فرض تفسير إضافي للعلاقة.
theological_decisions:
- issue: هل تُترجم ἔθνη بمعنى «الأمم» أم «غير اليهود»؟
  choice: «الأمم» في الموضعين
  alternative: «غير اليهود» في الموضع الأول و«الأمم» في الاقتباس، أو «غير اليهود» في الموضعين
  rationale: اختيار «الأمم» يحفظ التكرار اللفظي في اليونانية ويُظهر ارتباط التبرير بالإيمان بوعد إبراهيم لجميع الأمم، بينما تُذكر الدلالة البديلة في الحاشية من غير إخفائها.
- issue: كيفية نقل δικαιοῖ
  choice: «يبرِّر»
  alternative: «يعلن أبرارًا» أو «يحسب أبرارًا»
  rationale: «يبرِّر» يحفظ المصطلح اللاهوتي والقضائي الموجز، ويتجنب قصره على شرح واحد أوسع من اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ تشخيص «الكتاب» بوصفه الذي سبق فرأى وبشَّر، كما حُفظ تكرار «الأمم» وصيغة الوعد المبنية للمجهول. وُضعت علامتا الحاشيتين عند اللفظين اللذين تتناولهما الحاشيتان.
