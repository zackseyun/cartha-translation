  source_fidelity: ينقل المتن الحجة الشرطية والمقابلة بين «من الناموس» و«من وعد» بأمانة، ويحافظ على معنى العطاء المتفضل في κεχάρισται. تُحسَّن صياغة النفي الزمني لتؤدي οὐκέτι بعبارة عربية أكثر مباشرة.
