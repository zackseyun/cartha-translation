  to: لِأَنَّ الْمِيرَاثَ إِنْ كَانَ مِنَ النَّامُوسِ، فَلَا يَعُودُ مِنْ وَعْدٍ؛ لَكِنَّ اللهَ أَنْعَمَ[a] بِهِ عَلَى إِبْرَاهِيمَ بِوَعْدٍ.
