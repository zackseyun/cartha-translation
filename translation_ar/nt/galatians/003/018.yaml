  terminology: «الميراث»، و«الناموس»، و«وعد» مناسبة للسياق البولسي. و«أنعم به على إبراهيم» يحفظ، في العربية، دلالة التفضل الملازمة للفعل اليوناني دون تحميل النص تفسيرًا عقائديًا زائدًا.
