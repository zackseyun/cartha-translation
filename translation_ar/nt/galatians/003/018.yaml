source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: ar
  text: لِأَنَّ الْمِيرَاثَ إِنْ كَانَ مِنَ النَّامُوسِ، فَلَا يَعُودُ مِنْ وَعْدٍ؛ لَكِنَّ اللهَ أَنْعَمَ[a] بِهِ عَلَى إِبْرَاهِيمَ بِوَعْدٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وَهَبَهُ اللهُ لِإِبْرَاهِيمَ بِوَعْدٍ».
    reason: بديل لفظي أبسط لـ κεχάρισται، لكنه لا يُظهر معنى التفضل بالوضوح نفسه.
lexical_decisions:
- source_word: κληρονομία
  choice: الْمِيرَاثَ
  rationale: اللفظ العربي المألوف لما يناله الوارث، ويحفظ صلة العبارة بحجة بولس عن الوعد والورثة.
- source_word: ἐκ νόμου
  choice: مِنَ النَّامُوسِ
  rationale: تحفظ «مِن» دلالة المصدر أو الأساس، وتُبقي المقابلة اللفظية مع «مِنْ وَعْدٍ». واختير «الناموس» للدلالة السياقية على شريعة موسى.
- source_word: οὐκέτι ἐξ ἐπαγγελίας
  choice: فَلَا يَكُونُ بَعْدُ مِنْ وَعْدٍ
  rationale: تنقل «بعدُ» معنى οὐκέτι، وتحفظ العبارة تعارض مصدر الميراث من الناموس مع مصدره من الوعد.
- source_word: δι’ ἐπαγγελίας
  choice: بِوَعْدٍ
  rationale: الباء العربية تؤدي هنا معنى الوسيلة في διά، وتأتي العبارة طبيعية موجزة من غير تحويل الوعد إلى استحقاق.
- source_word: κεχάρισται
  choice: أَنْعَمَ بِهِ عَلَى
  rationale: تعبر عن العطاء التفضلي الكامن في χαρίζομαι، لا عن مجرد إعطاء محايد؛ والمفعول المحذوف مفهوم من «الميراث».
- source_word: τῷ Ἀβραὰμ
  choice: عَلَى إِبْرَاهِيمَ
  rationale: تلائمها العربية مع الفعل «أنعم»، وتحفظ إبراهيم متلقيًا لعطية الله.
theological_decisions:
- issue: إظهار معنى التفضل في κεχάρισται
  choice: «أَنْعَمَ بِهِ عَلَى إِبْرَاهِيمَ»
  alternative: «وَهَبَهُ لِإِبْرَاهِيمَ»
  rationale: يحفظ الاختيار صلة الفعل بالنعمة والعطاء المجاني في سياق المقابلة بين الناموس والوعد، من غير إضافة تقرير عقائدي غير مصرح به.
- issue: تحديد مدلول νόμος
  choice: «النَّامُوس»
  alternative: «شريعة» بلا أداة تعريف
  rationale: السياق البولسي يشير إلى الناموس الموسوي، لكن الصياغة لا توسع النص بشرح تفسيري داخل المتن.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة، مع الحفاظ على توازي «مِنَ النَّامُوسِ / مِنْ وَعْدٍ» وعلى الإيجاز الجدلي للنص اليوناني. وُضع هامش البديل عند الفعل الذي يخصه، مع إثبات علامته في المتن.
