base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: ar
  text: 'فإن كل الذين يعتمدون على أعمال الشريعة هم تحت لعنة[a]، لأنه مكتوب: «ملعون كل من لا يداوم على العمل بجميع ما كُتب في كتاب الشريعة[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أقرب إلى الحرفية: «الذين هم من أعمال الشريعة».'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «كل من لا يثبت في جميع الأمور المكتوبة في كتاب الشريعة ليعمل بها».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: لأن جميع الذين
  rationale: تحفظ شمول الجمع في ὅσοι والقوة التفسيرية لأداة γάρ، بصياغة عربية واضحة.
- source_word: ἐξ ἔργων νόμου
  choice: هم من أعمال الشريعة
  rationale: صياغة قريبة من تركيب اليونانية وتحافظ على توتره التفسيري، من غير أن تحسمه بمعنى الاعتماد أو الاتكال.
- source_word: ὑπὸ κατάραν
  choice: واقعون تحت لعنة
  rationale: تعبير عربي طبيعي يدل على الخضوع للعنة، من غير تخصيصها بلعنة بعينها لعدم وجود أداة تعريف في اليونانية.
- source_word: γέγραπται
  choice: مكتوب
  rationale: صيغة عربية مألوفة للاقتباس الكتابي، وتعكس دلالة الحالة المستمرة الناتجة عن فعل الكتابة.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: ملعون كل من
  rationale: تنقل معنى اللعنة والقوة الشاملة في العبارة بصياغة موجزة وواضحة.
- source_word: ἐμμένει
  choice: يثبت في
  rationale: يحفظ معنى الاستمرار والمواظبة ضمن ما هو مطلوب، مع إبقاء صورة حرف الجر في النص اليوناني.
- source_word: πᾶσιν τοῖς γεγραμμένοις
  choice: جميع الأمور المكتوبة
  rationale: يحفظ صيغة الجمع وشمول المطلوب كله، ويتجنب تحويلها إلى طاعة جزئية.
- source_word: ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: في كتاب الشريعة
  rationale: «كتاب» هو المقابل الحديث الطبيعي لـ βιβλίον هنا، و«الشريعة» تلائم السياق اليهودي العهدي لـ νόμος.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: ليعمل بها
  rationale: تنقل غرض الالتزام بالنصوص إلى التنفيذ العملي، وتحافظ على مرجع الضمير الجمعي.
theological_decisions:
- issue: دلالة ἐξ ἔργων νόμου
  choice: هم من أعمال الشريعة
  alternative: يعتمدون على أعمال الشريعة
  rationale: أُبقي التركيب قريبًا من الأصل لأن العبارة محمّلة بدلالة لاهوتية، ولئلا تُحسم في المتن بوصفها اعتمادًا نفسيًا أو عقديًا فقط.
- issue: مدى الطاعة المطلوبة في الاقتباس
  choice: جميع الأمور المكتوبة ... ليعمل بها
  alternative: كل ما هو مكتوب ... ليعمل به
  rationale: تحفظ الصياغة شمول πᾶσιν وصيغة الجمع في αὐτά، فلا توحي بأن المطلوب بعض أحكام الشريعة دون بعض.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. حُفظ التركيب اللاهوتي الملتبس «من أعمال الشريعة» في المتن، مع بيان القراءة التفسيرية الأشهر في الحاشية، كما روعي إيقاع الاقتباس الكتابي من غير استعمال ألفاظ مهجورة.
