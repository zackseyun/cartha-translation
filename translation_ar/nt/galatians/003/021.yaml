id: GAL.3.21
reference: Galatians 3:21
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: ar
  text: فهل الشريعة إذًا ضد وعود الله؟ حاشا! لأنه لو أُعطيت شريعة قادرة على أن تهب الحياة، لكان البر حقًّا من الشريعة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العدالة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: الشريعة
  rationale: يحافظ هذا اللفظ على صدى الشريعة الموسوية في السياق، مع بقاء الاستعمال هنا قابلًا لفهم الشريعة بوصفها فئة عامة، ولا سيما في العبارة الشرطية «لو أُعطيت شريعة».
- source_word: κατὰ
  choice: ضد
  rationale: تفيد κατά مع المضاف إليه معنى المعارضة، و«ضد» واضحة وطبيعية في السؤال البلاغي.
- source_word: ἐπαγγελιῶν
  choice: وعود
  rationale: يحفظ صيغة الجمع الصريحة في اليونانية، ويشير إلى وعود الله التي سبق ذكرها.
- source_word: μὴ γένοιτο
  choice: حاشا!
  rationale: صيغة عربية راسخة وموجزة للرفض القاطع الذي تعبّر عنه عبارة بولس.
- source_word: ἐδόθη
  choice: أُعطيت
  rationale: يحفظ المبني للمجهول في الفعل اليوناني وينسجم طبيعيًا مع الشرط غير المتحقق.
- source_word: δυνάμενος
  choice: قادرة على
  rationale: ينقل معنى القدرة، ويطابق «شريعة» في التأنيث.
- source_word: ζῳοποιῆσαι
  choice: أن تهب الحياة
  rationale: تعبير عربي طبيعي ودقيق لمعنى إحياء الغير أو منحه الحياة.
- source_word: ὄντως
  choice: حقًّا
  rationale: ينقل توكيد النتيجة بعبارة فصيحة واضحة.
- source_word: ἐκ νόμου
  choice: من الشريعة
  rationale: يحافظ على دلالة المصدر في ἐκ دون تحويلها إلى مجرد وسيلة، ويبقي صياغة بولس الجدلية.
- source_word: δικαιοσύνη
  choice: البر
  rationale: «البر» هو المقابل العربي المألوف في السياق البولسي، ويحفظ اتساع المصطلح المتعلق بالاستقامة والقبول أمام الله من غير حصره في العدالة القضائية.
theological_decisions:
- issue: دلالة δικαιοσύνη في حجة بولس
  choice: البر
  alternative: العدالة
  rationale: يلائم «البر» سياق المقابلة بين الشريعة والوعد وما يتصل بالقبول أمام الله، مع إبقاء «العدالة» احتمالًا معجميًا في الحاشية حتى لا يُطمس اتساع اللفظ.
- issue: هل νόμος هنا الشريعة الموسوية وحدها أم الشريعة بوصفها مبدأً عامًا؟
  choice: 'استعمال «الشريعة» مع التنكير في العبارة الشرطية: «لو أُعطيت شريعة»'
  alternative: الناموس
  rationale: السياق يستحضر الشريعة الموسوية، لكن صياغة الشرط تتحدث عن شريعة قادرة على منح الحياة على نحو افتراضي؛ لذلك تحفظ العربية كلا البعدين من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعملت «حاشا» لقوة الرفض، و«تهب الحياة» لسلاسة العبارة، مع الحفاظ على ترتيب الحجة الشرطية وعلى التوتر بين الشريعة والوعود دون تفسير مذهبي مضاف.
