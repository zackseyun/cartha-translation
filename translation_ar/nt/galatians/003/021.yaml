  source_fidelity: النص العربي ينقل بدقة السؤال البلاغي في اليونانية، ومعنى المعارضة في «ضد»، وصيغة الرفض القاطع «حاشا!»، وبنية الشرط المخالف للواقع. ويحافظ على الجمع في «وعود»، وعلى دلالة القدرة في «قادرة على أن تهب الحياة»، وعلى توكيد ὄντως في «حقًّا»، وعلى علاقة المصدر في «من الشريعة».
