base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: ar
  text: 'أيها الإخوة[a]، أتكلم على نحو بشري: فحتى عهدًا أبرمه إنسان لا يبطله أحد ولا يضيف إليه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظة اليونانية «إخوة» جمع مذكر، وبولس يخاطب المؤمنين معه، ويُرجَّح أن النساء مشمولات في الخطاب أيضًا.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀδελφοί
  choice: أيها الإخوة
  rationale: صيغة نداء جمع مذكر، نُقلت بصياغة عربية فصيحة طبيعية، مع توضيح شمول المخاطَبين المحتمل للنساء في الحاشية.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: أتكلم وفقًا لما يجري بين البشر
  rationale: تعبير اصطلاحي يقدّم مثالًا من المعاملات البشرية المعتادة؛ وهذه الصياغة توصل المعنى بوضوح من غير أن تحصره في رأي بشري مجرد.
- source_word: ὅμως
  choice: حتى
  rationale: 'تفيد هنا تقوية الحجة بالانتقال إلى الحالة البشرية: حتى في مثل هذه الحالة يصح المبدأ المذكور.'
- source_word: ἀνθρώπου
  choice: أبرمه إنسان
  rationale: حُفظ المفرد اليوناني الملموس «إنسان»، وربط بالفعل المبني للمجهول دلاليًا لإنتاج تركيب عربي طبيعي.
- source_word: κεκυρωμένην
  choice: أبرمه
  rationale: يدل اسم المفعول التام على عهد جرى تثبيته وصار نافذًا؛ و«أبرمه» تعبير قانوني عربي واضح يفيد الإتمام والإلزام.
- source_word: διαθήκην
  choice: عهدًا
  rationale: «العهد» أنسب للسياق المباشر المتعلق بوعد الله لإبراهيم، مع إثبات الدلالة القانونية البديلة في الحاشية.
- source_word: ἀθετεῖ
  choice: يبطله
  rationale: ينقل بوضوح معنى الإلغاء أو التجريد من النفاذ في هذا السياق القانوني.
- source_word: ἐπιδιατάσσεται
  choice: يضيف إليه
  rationale: ينقل معنى إلحاق أحكام أو شروط أخرى بالعهد، بصياغة موجزة وطبيعية.
theological_decisions:
- issue: 'دلالة διαθήκη: أهي «عهد» أم «وصية»؟'
  choice: عهد
  alternative: وصية
  rationale: سياق غلاطية 3 هو وعد الله لإبراهيم والعهد المرتبط به، ولذلك تحافظ «عهد» على استمرارية الحجة. ومع ذلك، فالدلالة القانونية «وصية» ممكنة معجميًا، لذا ذُكرت في الحاشية من غير حسم الغموض المعجمي بصمت.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت صياغة قانونية مفهومة («أبرمه»، «يبطله»، «يضيف إليه») من غير إفراط في المصطلحات الفنية، وحُفظت صورة المفرد «إنسان» مع سلاسة التركيب العربي.
