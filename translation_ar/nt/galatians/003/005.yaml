source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: ar
  text: إذًا، هل الذي يمدّكم بالروح ويصنع معجزات بينكم[a] يفعل ذلك بأعمال الشريعة، أم بالسماع المصحوب بالإيمان[b]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «فيكم».
    reason: lexical_alternative
  - marker: b
    text: أو «سماع الإيمان»، أو «الرسالة التي سُمعت بإيمان».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: يمدّكم
  rationale: ينقل معنى الإمداد والعطاء المستمر الذي يدل عليه اسم الفاعل المضارع، بصياغة عربية واضحة وموجزة.
- source_word: τὸ πνεῦμα
  choice: بالروح
  rationale: يحافظ على الإشارة المعرّفة إلى الروح من غير إضافة «القدس»، إذ ليست هذه الإضافة صريحة في النص اليوناني.
- source_word: ἐνεργῶν δυνάμεις
  choice: ويصنع معجزات
  rationale: تعبير عربي طبيعي ينقل معنى إجراء أعمال قدرة خارقة في هذا السياق، بدل الترجمة الحرفية الملتبسة «يعمل قوات».
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: يلائم سياق المعجزات الواقعة في جماعات الغلاطيين؛ وتبقى دلالة «فيكم» ممكنة ومحفوظة في الحاشية.
- source_word: ἐξ ἔργων νόμου
  choice: بسبب أعمال الشريعة
  rationale: ينقل ἐξ هنا بوصفها دالة على الأساس أو الوسيلة التي يجري بها الفعل، ويحافظ على العبارة البولسية المعروفة «أعمال الشريعة».
- source_word: ἀκοῆς πίστεως
  choice: السماع المصحوب بالإيمان
  rationale: يوضح في العربية قراءة السماع المقترن بالإيمان، مع إبقاء الاحتمالات النحوية الأخرى في الحاشية.
- source_word: πίστεως
  choice: الإيمان
  rationale: هو المقابل الأنسب لـ πίστις في هذه المقابلة بين أعمال الشريعة والسماع المؤمن.
theological_decisions:
- issue: التركيب ἀκοῆς πίστεως موجز ويحتمل أكثر من علاقة نحوية بين السماع والإيمان.
  choice: السماع المصحوب بالإيمان
  alternative: «سماع الإيمان» أو «الرسالة التي سُمعت بإيمان»
  rationale: القراءة المختارة تعبّر بوضوح عن سماع يقترن بالإيمان، لكنها لا تحسم الاحتمالات الأخرى بصمت، ولذلك أُثبتت في الحاشية.
- issue: قد تشير العبارة ἐν ὑμῖν إلى المجال الجماعي «بينكم» أو إلى العمل الداخلي «فيكم».
  choice: بينكم
  alternative: فيكم
  rationale: سياق صنع المعجزات يرجّح المجال المشاهد وسط الجماعات، مع بقاء معنى العمل فيهم احتمالًا لغويًا حقيقيًا.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة، ذات نبرة كتابية رصينة. استُعملت «الشريعة» للدلالة على νόμος في السياق البولسي، وتجنبت الترجمة توسيع «الروح» إلى «الروح القدس» أو تعيين فاعل غير مصرح به في اليونانية.
