  yaml_path: translation/nt/galatians/003/020.yaml
  text: A mediator is not of one[b][a], but God is one.
translation:
  language: ar
  text: أَمَّا الْوَسِيطُ فَلَيْسَ لِوَاحِدٍ[a]، لَكِنَّ اللهَ وَاحِدٌ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكبر: «الوسيط ليس لواحد». وقد يكون المعنى: «لا يعمل لواحد وحده» أو «لا يكون لطرف واحد وحده».'
    reason: alternative_reading
  - marker: b
    text: يرجَّح أن عبارة «الله واحد» تردّد صدى إقرار إسرائيل بوحدانية الله؛ قارن التثنية 6:4.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: الوسيط
  rationale: لفظ عربي واضح ودقيق لمن يقف بين أطراف، ويحافظ على الدلالة العهدية أو القانونية من غير شرح زائد.
- source_word: ἑνὸς
  choice: لواحد
  rationale: يحافظ على إيجاز العبارة اليونانية وغموضها المقصود، بدل حسمها بإضافة «طرف واحد» في المتن.
- source_word: οὐκ ἔστιν
  choice: فليس
  rationale: ترجمة مباشرة للعبارة المنفية، مع الفاء لربط صدر الجملة بأسلوب «أمّا» العربي.
- source_word: δὲ … δὲ
  choice: أمّا … لكنّ
  rationale: ينقل الانتقال في الجملة الأولى والتباين في الثانية بلغة عربية طبيعية، من غير إدخال معنى زمني غير موجود في الأصل.
- source_word: ὁ θεὸς εἷς ἐστιν
  choice: الله واحد
  rationale: صياغة مباشرة موجزة تحفظ توكيد وحدانية الله والصدى المحتمل لإقرار إسرائيل بوحدانيته.
theological_decisions:
- issue: إيجاز حجة بولس وغموض الشطر الأول
  choice: الوسيط فليس لواحد
  alternative: الوسيط لا يكون لطرف واحد وحده
  rationale: تُبقي الصياغة توتر النص وغموضه الحقيقيين، ولا تحسم ما إذا كان المقصود أن الوسيط لا يعمل لواحد وحده أو لا يكون لطرف واحد وحده، ولا تُدخل تفسيرًا خاصًّا للناموس أو موسى أو المسيح.
- issue: دلالة «الله واحد»
  choice: الله واحد
  alternative: الله إله واحد
  rationale: تحافظ الصياغة المختارة على بنية الأصل الموجزة وعلى الإقرار بوحدانية الله دون إضافة اسم غير مصرح به في العبارة.
