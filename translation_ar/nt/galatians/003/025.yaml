  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: ar
  text: أمّا وقد جاء الإيمان[a]، فلسنا بعدُ خاضعين لقيّم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تشير العبارة إلى مجيء الإيمان، أو إلى بدء المرحلة التي صار الإيمان سمتها المميِّزة.
    reason: alternative_reading
  - marker: b
    text: تشير الكلمة اليونانية إلى شخص في البيت يتولى حراسة القاصر والإشراف عليه، لا إلى معلّم صف في المقام الأول.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: وقد جاء
  rationale: اسم الفاعل الأوريستي في تركيب المضاف إليه المطلق يؤدي معنى زمنيًا؛ وصياغة «وقد جاء» عربية طبيعية تفيد وقوع المجيء وبقاء أثره في الوضع الحاضر.
- source_word: δὲ
  choice: أمّا
  rationale: تفيد انتقالًا تقابليًا لطيفًا عمّا سبق، وتلائم في العربية الانتقال من مدة الوصاية السابقة إلى الحال الراهنة.
- source_word: πίστεως
  choice: الإيمان
  rationale: «الإيمان» هو المقابل العربي الطبيعي لـ πίστις هنا، مع إبقاء احتمال أن تكون الإشارة إلى الإيمان نفسه أو إلى المرحلة الخلاصية التي اتسمت بمجيئه.
- source_word: οὐκέτι
  choice: لسنا بعدُ
  rationale: تنقل بوضوح انتهاء الحالة السابقة واستمرار عدم الخضوع لها الآن.
- source_word: ὑπὸ
  choice: تحت سلطة
  rationale: تحافظ على صورة الخضوع لمن يتولى الإشراف، مع جعل العبارة واضحة وطبيعية في العربية.
- source_word: παιδαγωγόν
  choice: وصيّ
  rationale: يشير اللفظ في سياقه القديم إلى من يتولى حراسة القاصر والإشراف عليه، لا إلى معلّم صف في المقام الأول؛ و«وصيّ» أقرب إلى هذه الوظيفة في العربية المعاصرة.
- source_word: ἐσμεν
  choice: لسنا
  rationale: نُقل فعل الكينونة بصيغة عربية اسمية منفية تلائم اقترانه بـ οὐκέτι.
theological_decisions:
- issue: دلالة «مجيء الإيمان» في السياق
  choice: الإبقاء على عبارة «جاء الإيمان» دون تفسيرها داخل المتن
  alternative: التصريح بـ«جاء عهد الإيمان» أو «حلّ زمن الإيمان»
  rationale: السياق يحمل بُعدًا خلاصيًا تاريخيًا، لكن إضافة «عهد» أو «زمن» تحسم ما تركه التعبير اليوناني قابلًا لأن يُفهم على أكثر من وجه؛ لذلك حُفظ التعبير مع بيان الاحتمال في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة موجزة ووقورة. استُعملت «أمّا وقد» لإظهار الانتقال الزمني التقابلي، و«تحت سلطة وصيّ» لتوضيح الاستعارة الاجتماعية القديمة من غير تحويلها إلى مصطلح تعليمي حديث.
