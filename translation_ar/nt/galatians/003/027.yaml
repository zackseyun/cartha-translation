lexical_decisions:
- source_word: ὅσοι
  choice: كلَّ مَن ... منكم
  rationale: يحفظ شمول العبارة اليونانية مع إبقاء الخطاب موجَّهًا إلى جماعة الغلاطيين، ويأتي بصياغة عربية طبيعية.
- source_word: γὰρ
  choice: فإن
  rationale: يبقي الصلة التفسيرية بما قبل الآية ولا يحذف أداة الربط.
- source_word: εἰς
  choice: في
  rationale: تعبير «اعتمد في المسيح» واضح ومألوف بالعربية في هذا السياق، ويشير إلى الدخول في علاقة بالمسيح؛ وتوضح الحاشية أن اللفظ اليوناني يفيد الاتجاه حرفيًا.
- source_word: Χριστόν
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، ويصلح في الموضعين من غير الحاجة إلى التفريق العربي بين «المسيح» و«Christ».
- source_word: ἐβαπτίσθητε
  choice: اعتمد
  rationale: «اعتمد» هو المصطلح العربي القياسي، ويحفظ معنى المبني للمجهول في الأصل من خلال السياق من غير تحديد طريقة المعمودية.
- source_word: ἐνεδύσασθε
  choice: اكتسى بالمسيح
  rationale: ينقل استعارة ارتداء الثوب بلغة عربية طبيعية، مع إبقاء المسيح نفسه صورةً لما يكتسي به المؤمن.
theological_decisions:
- issue: هل تُصاغ المعمودية بما يحسم فاعليتها اللاهوتية أو طريقتها؟
  choice: اعتمد منكم في المسيح
  alternative: غُمس في المسيح؛ اعتمد للمسيح
  rationale: تحافظ الصياغة على دلالة الارتباط بالمسيح والدخول فيه، من غير أن تحسم جدلًا لاحقًا بشأن كيفية المعمودية أو فاعليتها الأسرارية.
- issue: كيفية نقل استعارة ارتداء المسيح
  choice: اكتسى بالمسيح
  alternative: لبس المسيح
  rationale: تحفظ الاستعارة واتحادها الوثيق بالمسيح من غير تحويلها إلى شرح عقائدي؛ وتورد الحاشية الصياغة الحرفية الأقرب.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل تركيب المفرد العام «كل من ... منكم» بدل محاكاة الجمع اليوناني محاكاةً ثقيلة، مع الحفاظ على شمول المخاطَبين. ولم تُضف الحاشية الإنجليزية الخاصة بالاختيار بين “Messiah” و“Christ”، لأن العربية تعبّر عن كليهما طبيعيًا بلفظ «المسيح».
