base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: ar
  text: ولكن قبل أن يأتي الإيمان[a][d]، كنا نُحرَس تحت الناموس[b]، محصورين[c] إلى أن يُعلَن الإيمان المزمع أن يُعلَن.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «قبل أن يأتي ذلك الإيمان»؛ فأداة التعريف في اليونانية قد تشير إلى عهد الإيمان الذي افتُتح بمجيء المسيح.'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا: «كنا محتجَزين» بدلًا من «كنا نُحرَس».'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «مغلَقًا علينا» أو «مسجونين» بدلًا من «محصورين».'
    reason: lexical_alternative
  - marker: d
    text: يمكن أن تعني الكلمة اليونانية أيضًا «الأمانة» أو «الثقة»، لكن «الإيمان» أنسب للسياق هنا.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ ... ἐλθεῖν
  choice: قبل أن يأتي
  rationale: ينقل التركيب الزمني مع المصدر المسبوق بـ πρό إلى صياغة عربية طبيعية وواضحة.
- source_word: δὲ
  choice: ولكن
  rationale: تعكس الانتقال التقابلي الخفيف مع الحجة السابقة.
- source_word: τὴν πίστιν
  choice: الإيمان
  rationale: يحافظ على أداة التعريف في اليونانية وعلى إمكان أن يشير اللفظ إلى الإيمان بوصفه واقعًا ظهر في مرحلة الخلاص الجديدة، من غير حسم دلالته في اتجاه تفسيري واحد.
- source_word: ὑπὸ νόμον
  choice: تحت الناموس
  rationale: تعبير واضح يحفظ صورة الخضوع لسلطان الناموس في الاستعمال البولسي.
- source_word: ἐφρουρούμεθα
  choice: كنا نُحرَس
  rationale: يحفظ صيغة المبني للمجهول ودلالة الفعل الماضي المستمر، مع إبقاء صورة الحراسة بما فيها من حماية واحتجاز محتملين.
- source_word: συγκλειόμενοι
  choice: محصورين
  rationale: ينقل معنى الإغلاق والإحاطة من غير أن يفرض صورة السجن حرفيًا.
- source_word: εἰς
  choice: إلى أن
  rationale: يناسب في السياق الامتداد الزمني نحو إعلان الإيمان، ويحفظ اتجاه العبارة إلى الحدث المنتظر.
- source_word: τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι
  choice: الإيمان الذي كان وشيكًا أن يُعلَن
  rationale: يحفظ معنى μέλλω المستقبلي وصيغة ἀποκαλυφθῆναι المبنية للمجهول، ويبرز أن الإيمان هو ما سيُعلَن.
theological_decisions:
- issue: هل πίστις تعني فعل الإيمان الشخصي أم واقع الإيمان المرتبط بمرحلة مجيء المسيح؟
  choice: الإيمان
  alternative: الأمانة؛ الثقة؛ عهد الإيمان أو مرحلته
  rationale: السياق يحمل بُعدًا تاريخيًا خلاصيًا، لكن لفظ «الإيمان» يحفظ التوتر بين فعل التصديق والواقع الجديد الذي أُعلن، من غير إدخال شرح مذهبي في المتن.
- issue: هل صورة الناموس هنا حماية أم احتجاز؟
  choice: كنا نُحرَس ... محصورين
  alternative: كنا محتجزين ... مسجونين
  rationale: 'الجمع بين «نُحرَس» و«محصورين» يحفظ وجهي الصورة: الحراسة المستمرة والتقييد، من غير طمس أحدهما بالآخر.'
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعمل «الناموس» للمصطلح البولسي νόμος، وحُفظ المبني للمجهول والتدرج بين الحراسة والحصر. تكرار «يُعلَن» في آخر العبارة ثقيل قليلًا، لكنه يحفظ البنية الدلالية التي تجعل الإيمان نفسه موضوع الإعلان، ويمكن في تحرير أسلوبي لاحق بحث صياغة أخف من غير فقد هذا المعنى.
