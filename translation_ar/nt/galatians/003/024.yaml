  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: ar
  text: إذًا، صار الناموس وصيَّنا[a] إلى المسيح[b]، لكي نُبَرَّر بالإيمان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي «مشرفَنا» أو «قيِّمَنا»؛ وتُترجم تقليديًّا «مؤدِّبَنا». كانت الكلمة اليونانية تشير إلى وصيّ أو مشرف في البيت يلازم الطفل ويشرف عليه، لا إلى معلّم في الفصل أساسًا.
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «إلى المسيح». ويمكن فهم العبارة أيضًا بمعنى «حتى مجيء المسيح» أو «ليقودنا إلى المسيح».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: وهكذا
  rationale: تفيد هنا النتيجة والاستنتاج مما سبق، و«وهكذا» تنقل هذا الربط بوضوح وطبيعية.
- source_word: ὁ νόμος
  choice: الناموس
  rationale: يشير السياق إلى ناموس موسى بوصفه فئة معروفة، و«الناموس» هو التعبير العربي الكتابي المستقر والدقيق.
- source_word: παιδαγωγὸς ἡμῶν
  choice: وصيًّا علينا
  rationale: كان παιδαγωγός في المجتمع اليوناني الروماني مشرفًا على القاصر وملازمًا له، لا معلّمًا في الفصل أساسًا؛ لذا يعبّر «وصيًّا علينا» عن وظيفته الاجتماعية بوضوح.
- source_word: γέγονεν
  choice: صار
  rationale: ينقل معنى الدخول في حالة قائمة؛ وتؤدي العربية هذا المعنى طبيعيًّا بالفعل «صار» دون حاجة إلى تركيب ثقيل لمقابلة صيغة التام اليونانية.
- source_word: εἰς Χριστόν
  choice: حتى مجيء المسيح
  rationale: ينقل هذا التعبير في السياق البعد الزمني لوظيفة الناموس المؤقتة، مع إبقاء الدلالة الحرفية والاتجاهية الممكنة في الحاشية.
- source_word: Χριστόν
  choice: المسيح
  rationale: يُنقل اللقب اليوناني Χριστός بمقابله العربي الطبيعي والمستقر «المسيح».
- source_word: ἵνα
  choice: لكي
  rationale: تدخل ἵνα هنا على غاية، و«لكي» تعبّر عن ذلك بوضوح.
- source_word: ἐκ πίστεως
  choice: بالإيمان
  rationale: تفيد العبارة الوسيلة أو الأساس في هذا السياق، و«بالإيمان» هي الصياغة العربية الطبيعية الدقيقة.
- source_word: δικαιωθῶμεν
  choice: نتبرَّر
  rationale: تحافظ الصيغة المبنية للمجهول دلاليًّا على كون التبرير واقعًا علينا، وتبقي المصطلح القضائي اللاهوتي من غير شرح زائد داخل النص.
theological_decisions:
- issue: دلالة εἰς Χριστόν في وصف وظيفة الناموس
  choice: حتى مجيء المسيح
  alternative: 'إلى المسيح؛ أو: ليقودنا إلى المسيح'
  rationale: يركّز السياق القريب على وظيفة الناموس المؤقتة قبل مجيء الإيمان، ولذلك يوضح المتن البعد الزمني. لكن حرف الجر εἰς يحتمل أيضًا اتجاهًا نحو غاية، فذُكر ذلك في الحاشية لئلا يُحسم التوتر الدلالي بلا تنبيه.
- issue: طبيعة التبرير في δικαιωθῶμεν
  choice: نتبرَّر
  alternative: نُعلَن أبرارًا
  rationale: يحفظ المصطلح العربي المألوف الصياغة القضائية المكثفة عند بولس، من غير توسيع تفسيري قد يضيّق مدلوله.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «الناموس» و«المسيح» و«نتبرَّر» للمحافظة على المصطلحات المستقرة، مع شرح الصورة الاجتماعية القديمة والاحتمال الدلالي لعبارة εἰς Χριστόν في الحواشي.
