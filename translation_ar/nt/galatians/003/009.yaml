  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: ar
  text: إذًا، فالذين من أهل الإيمان يُبارَكون مع إبراهيم المؤمن[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إبراهيم الأمين» أو «إبراهيم الوفيّ».'
    reason: يمكن أن تحمل πιστός معنى «المؤمن» أو «الأمين/الوفيّ» بحسب السياق؛ يحفظ المتن المعنى المرتبط بسياق الإيمان، وتوثّق الحاشية المعنى الآخر دون تحويل الصفة إلى فعل ماضٍ.
lexical_decisions:
- source_word: ὥστε
  choice: إذًا، فـ
  rationale: ينقل معنى الاستنتاج من الحجة السابقة بصياغة عربية واضحة وطبيعية.
- source_word: οἱ ἐκ πίστεως
  choice: الذين من أهل الإيمان
  rationale: يحافظ على دلالة العبارة في وصف جماعة تتسم بالإيمان، مع تجنب صياغة حرفية ثقيلة مثل «الذين هم من الإيمان».
- source_word: πίστεως
  choice: الإيمان
  rationale: السياق يتناول إيمان إبراهيم ومن يشاركونه هذا الإيمان، لا صفة الأمانة في المقام الأول.
- source_word: εὐλογοῦνται
  choice: يُبارَكون
  rationale: صيغة مبنية للمجهول تحفظ كون البركة متلقاة، وتعكس المضارع اليوناني دون تقييده بزمن مرحلي.
- source_word: σὺν
  choice: مع
  rationale: تنقل بوضوح اشتراك أهل الإيمان مع إبراهيم في البركة.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: إبراهيم المؤمن
  rationale: يناسب محور السياق المباشر، وهو إيمان إبراهيم، مع إبقاء احتمال معنى «الأمين» في الحاشية.
theological_decisions:
- issue: دلالة πιστός في وصف إبراهيم ضمن سياق يركز على الإيمان
  choice: إبراهيم المؤمن
  alternative: إبراهيم الأمين
  rationale: يمكن أن يدل πιστός على الإيمان أو الأمانة. ويرجح السياق هنا معنى الإيمان، لكن الحاشية تحفظ الاحتمال الآخر ولا تحسم التوتر الدلالي بصمت.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «من أهل الإيمان» لتقريب البنية اليونانية إلى القارئ مع الحفاظ على قوتها في وصف الهوية، ووُضعت علامة الحاشية عند موضع العبارة الملتبسة.
