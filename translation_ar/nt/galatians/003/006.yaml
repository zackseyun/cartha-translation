  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: ar
  text: كما أن إبراهيم آمن بالله، فحُسِبَ ذلك له برًّا[أ]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'أو: «عدلًا».'
    reason: بديل معجمي لـ δικαιοσύνη، موافق للحاشية الإنجليزية التي تحفظ «justice» بديلًا لـ «righteousness» في هذا الموضع البولسي.
lexical_decisions:
- source_word: καθὼς
  choice: كما أن
  rationale: تحفظ أداة المقارنة التي يستند بها بولس إلى مثال إبراهيم، وتأتي عربية طبيعية في سياق الحجة المتصلة بالآية التالية.
- source_word: Ἀβραὰμ
  choice: إبراهيم
  rationale: الصيغة العربية الكتابية المعيارية للاسم.
- source_word: ἐπίστευσεν τῷ θεῷ
  choice: آمن بالله
  rationale: تنقل الفعل مع المفعول غير المباشر بصياغة عربية مألوفة؛ والسياق يفيد تصديق إبراهيم لله وقبول قوله، من غير إضافة تفسيرية مثل «اتكل».
- source_word: ἐλογίσθη αὐτῷ
  choice: فحُسِبَ له ذلك
  rationale: المبني للمجهول يحفظ صيغة اليونانية، و«حُسِبَ له» يؤدي معنى الاحتساب؛ وأُضيف اسم الإشارة لإيضاح مرجع الفعل في العربية، أي إيمان إبراهيم.
- source_word: εἰς δικαιοσύνην
  choice: برًّا
  rationale: «البر» هو المقابل العربي الراسخ والملائم لـ δικαιοσύνη في هذا الاقتباس، ويحفظ دلالة القبول أو المكانة البارة دون التوسع في تفسيرها.
theological_decisions:
- issue: دلالة δικαιοσύνη في اقتباس بولسي
  choice: برًّا
  alternative: عدلًا
  rationale: «برًّا» أنسب لسياق احتساب إيمان إبراهيم وله صلة مباشرة بصياغة تكوين 15:6 وتطور حجة بولس. أما «عدلًا» فممكن معجميًا في سياقات أخرى، لكنه هنا قد يوحي أساسًا بالإنصاف أو العدالة الاجتماعية بدل المكانة البارة المحتسبة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظت الجملة مفتوحة بفاصلة لأن تركيبها وحجة بولس يستمران في الآية التالية. لم تُضف حاشية لأن البديل «عدلًا» ليس مرجحًا في هذا السياق العربي، ولأن النص الرئيس لا يحتوي أي علامة حاشية.
