source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: ar
  text: فَلِمَاذَا إِذًا الشَّرِيعَةُ؟ أُضِيفَتْ بِسَبَبِ التَّعَدِّيَاتِ[b]، إِلَى أَنْ يَأْتِيَ النَّسْلُ[a] الَّذِي وُعِدَ لَهُ، وَقَدْ رُتِّبَتْ[c] بِوَاسِطَةِ مَلَائِكَةٍ عَلَى يَدِ وَسِيطٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الذُّرِّيَّة» أو «السَّلِيل».
    reason: lexical_alternative
  - marker: b
    text: قد تعني عبارة «بسبب التعديات» أن الشريعة أُضيفت لمعالجة التعديات أو كشفها أو كبحها؛ واليونانية لا تحدد المعنى على نحو أضيق.
    reason: alternative_reading
  - marker: c
    text: أو «نُظِّمَت» أو «وُضِعَت موضع التنفيذ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: فَلِمَاذَا إِذًا الشَّرِيعَةُ؟
  rationale: يفهم السؤال الإهليلجي على أنه سؤال عن غرض الشريعة في سياق الحجة، لا عن تعريف ماهيتها.
- source_word: νόμος
  choice: الشَّرِيعَةُ
  rationale: المقصود هنا الشريعة الموسوية بوصفها كيانًا عهديًا معروفًا في السياق البولسي.
- source_word: τῶν παραβάσεων χάριν
  choice: بِسَبَبِ التَّعَدِّيَاتِ
  rationale: يحفظ التعبير احتمال الدافع أو الغرض من غير أن يحدد إن كانت الشريعة تكشف التعديات أو تكبحها أو تعالجها.
- source_word: προσετέθη
  choice: أُضِيفَتْ
  rationale: ينقل المبني للمجهول ومعنى كون الشريعة إضافة لاحقة في مسار الحجة.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: إِلَى أَنْ يَأْتِيَ
  rationale: صياغة عربية طبيعية تنقل الحد الزمني والحدث المنتظر.
- source_word: τὸ σπέρμα
  choice: النَّسْلُ
  rationale: يحفظ الصلة اللغوية بوعد إبراهيم مع كونه أوضح في العربية المعاصرة من الترجمة الحرفية «البذرة».
- source_word: ᾧ ἐπήγγελται
  choice: الَّذِي قُطِعَ لَهُ الْوَعْدُ
  rationale: يجعل متعلق الوعد واضحًا وينقل دلالة الوعد السابق القائم، مع استعمال عربي فصيح شائع.
- source_word: διαταγεὶς
  choice: رُتِّبَتْ
  rationale: ينقل معنى التنظيم أو الترتيب الرسمي من غير توسيع العبارة إلى تفسير لاهوتي.
- source_word: δι’ ἀγγέλων
  choice: بِوَاسِطَةِ مَلَائِكَةٍ
  rationale: يحفظ معنى الوساطة أو الأداة في διά مع المضاف إليه.
- source_word: ἐν χειρὶ μεσίτου
  choice: عَلَى يَدِ وَسِيطٍ
  rationale: مقابل عربي طبيعي يحفظ الصورة اليونانية الدالة على الوكالة المتوسطة.
theological_decisions:
- issue: دلالة «بسبب التعديات»
  choice: الإبقاء على العبارة العامة «بسبب التعديات».
  alternative: لردع التعديات؛ لكشف التعديات؛ فيما يتعلق بالتعديات.
  rationale: العبارة اليونانية موجزة وتحتمل أكثر من تحديد وظيفي، فلا ينبغي حسم التوتر التفسيري في المتن.
- issue: ترجمة σπέρμα في حجة بولس
  choice: النَّسْلُ
  alternative: الذرية؛ السليل؛ البذرة.
  rationale: «النسل» يحافظ على الصلة بوعد إبراهيم وعلى إمكان الدلالة الجمعية أو المفردة بحسب السياق، من غير غرابة «البذرة» في العربية.
- issue: وساطة الملائكة والوسيط
  choice: بواسطة ملائكة على يد وسيط
  alternative: بملائكة في يد وسيط؛ عن طريق ملائكة ووسيط.
  rationale: تحفظ الصياغة مرحلتي الوساطة وصورة «اليد» من غير تعيين هوية الوسيط، إذ لا يعيّنها النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. رُتبت علامات الحواشي عند مواضع الألفاظ التي تشرحها، وحُفظ إيجاز السؤال الافتتاحي وصورة الوساطة في الأصل.
