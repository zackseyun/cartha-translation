id: GAL.3.17
reference: Galatians 3:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: ar
  text: 'وهذا ما أقوله: إن الشريعة، التي جاءت بعد أربعمئة وثلاثين عامًا، لا تُبطل[a] عهدًا سبق أن ثبَّته الله، بحيث تُلغي[b] الوعد.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تنقض».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «تُبطل مفعول الوعد» أو «تنحّيه جانبًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: وهذا ما أقوله
  rationale: صياغة عربية طبيعية تُبقي وظيفة العبارة في تقديم توضيح بولس، وتنقل أداة الربط δέ من غير إضافة معنى زمني غير موجود في الأصل.
- source_word: διαθήκην
  choice: عهدًا
  rationale: السياق يتناول وعد الله السابق لإبراهيم، ولذلك ينقل «عهد» المعنى العهدي المقصود أفضل من «وصية» أو «اتفاق».
- source_word: προκεκυρωμένην ὑπὸ τοῦ θεοῦ
  choice: سبق أن ثبَّته الله
  rationale: تنقل الصياغة أسبقية تثبيت العهد وقوته الملزمة، مع بيان أن الله هو الفاعل.
- source_word: ὁ ... γεγονὼς νόμος
  choice: الشريعة، التي جاءت
  rationale: تعبير مفهوم يدل على مجيء الشريعة في مرحلة لاحقة من التاريخ، وهو المقصود في المقابلة الزمنية عند بولس.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: بعد أربعمئة وثلاثين عامًا
  rationale: نقل مباشر وواضح للفاصل الزمني المذكور في النص.
- source_word: οὐκ ἀκυροῖ
  choice: لا تُبطل
  rationale: يحافظ الفعل على الدلالة القانونية المتمثلة في نزع صلاحية العهد أو نقض قوته.
- source_word: εἰς τὸ καταργῆσαι
  choice: بحيث تُلغي
  rationale: تحافظ «بحيث» على إمكان فهم التركيب من جهة الغاية أو النتيجة، من غير حسم زائد، وتنقل معنى جعل الوعد بلا أثر.
- source_word: τὴν ἐπαγγελίαν
  choice: الوعد
  rationale: هو المقابل العربي المباشر والدقيق في سياق وعد الله لإبراهيم.
theological_decisions:
- issue: دلالة διαθήκη في حجة بولس
  choice: عهد
  alternative: وصية قانونية أو اتفاق
  rationale: محور السياق هو وعد الله السابق لإبراهيم؛ لذلك يحفظ «عهد» البعد التاريخي اللاهوتي للنص من غير فرض تفسير مذهبي خاص.
- issue: العلاقة المنطقية في εἰς τὸ καταργῆσαι
  choice: بحيث تُلغي
  alternative: حتى تُلغي
  rationale: الصياغة المختارة تترك المجال لدلالة الغاية أو النتيجة التي قد يحملها التركيب اليوناني، بدل حصره في إحداهما.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُعملت «الشريعة» بدل المصطلح التراثي الأقل تداولًا «الناموس»، مع الحفاظ على الطابع القانوني للحجة. وُضعت علامتا الحاشيتين مباشرة بعد اللفظ الذي تشرحانه.
