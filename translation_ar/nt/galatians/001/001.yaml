revisions:
- from: بولس، رسولٌ لا من الناس ولا بوساطة إنسان، بل بوساطة يسوع المسيح[a] والله الآب، الذي أقامه من بين الأموات،
  to: بولس، رسولٌ، ليس من الناس ولا بوساطة إنسان، بل بوساطة يسوع المسيح[a] والله الآب، الذي أقامه من بين الأموات،
  rationale: أُضيف «ليس» لتحسين سلامة العبارة العربية ووضوحها، واستُبدلت الحاشية بتفسير معجمي طبيعي للقب «المسيح». ولم يُغيَّر المقصود من المصدر أو الوساطة أو إسناد القيامة.
