  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: ar
  text: بولس، رسولٌ، ليس من الناس ولا بوساطة إنسان، بل بوساطة يسوع المسيح[a] والله الآب، الذي أقامه من بين الأموات،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «المسيح» لقب يعني «الممسوح».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: رسول
  rationale: يحفظ اللقب الدال على التكليف والإرسال، وهو التعبير العربي الكتابي الواضح والمستقر.
- source_word: ἀπ’ ἀνθρώπων
  choice: من الناس
  rationale: ينقل ἀπό الدالة على المصدر، ويحفظ الجمع في مقابل المفرد اللاحق بصياغة عربية طبيعية شاملة.
- source_word: δι’ ἀνθρώπου
  choice: بوساطة إنسان
  rationale: ينقل διά مع المضاف إليه بمعنى الوساطة أو الوكالة، ويحفظ المفرد والتقابل البلاغي مع «الناس».
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: بوساطة يسوع المسيح
  rationale: يكرر «بوساطة» لحفظ التوازي المقصود في اليونانية، ويترجم Χριστός باللقب العربي الراسخ «المسيح» دون جعله مجرد اسم عائلة.
- source_word: θεοῦ πατρὸς
  choice: الله الآب
  rationale: صياغة عربية واضحة ومألوفة تحفظ اللقب وعطفه على يسوع المسيح ضمن العبارة نفسها.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: الذي أقامه من بين الأموات
  rationale: تجعل جملة الصلة عائدة إلى الله الآب كما في التركيب اليوناني، وتنقل دعوى القيامة بعبارة عربية طبيعية.
theological_decisions:
- issue: دلالة Χριστοῦ في Ἰησοῦ Χριστοῦ
  choice: المسيح
  alternative: الكلمة منقولة صوتيًا بوصفها اسمًا مجردًا
  rationale: «المسيح» هو المقابل العربي للقب Χριστός، ويحفظ قوته اللقبية في هذا الاستهلال مع بقائه طبيعيًا في العربية.
- issue: جهة إسناد عبارة «الذي أقامه من بين الأموات»
  choice: إلى الله الآب
  alternative: إلى يسوع المسيح والله الآب معًا
  rationale: اسم الفاعل اليوناني المفرد τοῦ ἐγείραντος يطابق θεοῦ πατρὸς ويصف الله الآب مباشرة.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُخدمت «بوساطة» مرتين لإظهار التقابل بين نفي الوساطة البشرية وإثبات الوساطة الإلهية، مع تجنب صياغة «من رجال» لأنها قد توهم حصر المعنى في الذكور.
