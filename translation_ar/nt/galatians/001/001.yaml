    rationale: «المشيح» نقل صوتي غير مستقر في العربية الفصحى المعاصرة، والحاشية لا توضح بجلاء العلاقة اللقبية لكلمة «المسيح». استبدالها بشرح موجز للمصطلح يحقق الغرض المعجمي بوضوح.
  - severity: low
    issue: حذف فعل النفي بعد «رسول» يجعل العبارة أقل سلاسة.
    rationale: عبارة «رسولٌ لا من الناس» مفهومة على طريقة الاختصار، لكن «رسولٌ، ليس من الناس...» أوضح في النثر العربي المعاصر ويحافظ تمامًا على بنية النفي الأصلية.
