  source_fidelity: 'الترجمة تنقل عناصر اليونانية كلها بدقة: «أتعجب» لِـΘαυμάζω، و«بهذه السرعة» لتأكيد οὕτως ταχέως، و«تنصرفون عن» لمعنى التحول/الانفضاض في μετατίθεσθε، مع الحفاظ على الداعي غير المسمّى. كما أن «في نعمة المسيح» تحفظ سعة دلالة ἐν، و«إلى بشارة مغايرة» تمثل εἰς ἕτερον εὐαγγέλιον دون تسوية الفرق الذي سيعالجه السياق التالي.'
