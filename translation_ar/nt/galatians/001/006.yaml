id: GAL.1.6
reference: Galatians 1:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: ar
  text: أتعجب من أنكم بهذه السرعة تنصرفون عن الذي دعاكم في نعمة المسيح[a] إلى بشارة مغايرة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بنعمة المسيح». قد يدل حرف الجر على المجال أو الوسيلة.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «إلى بشارة أخرى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: أتعجب
  rationale: ينقل دهشة بولس المشوبة بالاستنكار بعبارة عربية واضحة وطبيعية.
- source_word: οὕτως ταχέως
  choice: بهذه السرعة
  rationale: يحفظ التشديد على السرعة المفاجئة في تحوّل المخاطَبين.
- source_word: μετατίθεσθε
  choice: تنصرفون عن
  rationale: يفيد التحول والانفضاض عن شخص، ويحفظ البعد العلاقي للفعل من غير مبالغة تفسيرية.
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: الذي دعاكم
  rationale: يحفظ الإشارة إلى دعوة سابقة ولا يصرّح بهوية الداعي التي تركها النص اليوناني ضمنية.
- source_word: ἐν χάριτι Χριστοῦ
  choice: في نعمة المسيح
  rationale: ترجمة شفافة نسبيًا تحفظ احتمال دلالة ἐν على المجال أو الوسيلة، مع إثبات البديل في الحاشية.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: اللفظ العربي الطبيعي المقابل للقب Χριστός، ويحفظ دلالته المسيانية.
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: إلى بشارة مغايرة
  rationale: تحفظ εἰς بوصفها حركة نحو غاية، وتبرز مغايرة ἕτερον تمهيدًا للمقابلة في العدد التالي.
theological_decisions:
- issue: هوية «الذي دعاكم»
  choice: إبقاء الداعي غير مصرّح به
  alternative: التصريح بأنه الله أو المسيح
  rationale: فاعل الدعوة مفهوم ضمنًا في اليونانية لكنه غير مسمّى صراحة؛ لذلك لا تحسم الترجمة ما تركه النص ضمنيًا.
- issue: دلالة ἐν في عبارة النعمة
  choice: في نعمة المسيح
  alternative: بنعمة المسيح
  rationale: الصياغة الرئيسة تحفظ معنى المجال، بينما تسجل الحاشية احتمال الوسيلة من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «البشارة» لإبراز المعنى الحي لكلمة εὐαγγέλιον، و«مغايرة» لحفظ الفرق المقصود في ἕτερον، مع إبقاء هوية الداعي ضمنية كما في المصدر.
