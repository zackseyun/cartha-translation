  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: ar
  text: ولا صعدتُ إلى أورشليم إلى الذين كانوا رسلًا قبلي، بل انطلقتُ إلى العربية، ثم رجعتُ من جديد إلى دمشق.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: ولا
  rationale: تصل النفي بما قبله وتحافظ على قوة العبارة الاستدراكية في عربية طبيعية.
- source_word: ἀνῆλθον
  choice: صعدتُ
  rationale: يحافظ على التعبير المألوف عن التوجه إلى أورشليم، بما فيه دلالته الجغرافية والتقليدية.
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: لأقابل الذين كانوا رسلًا قبلي
  rationale: تفيد πρός هنا التوجه إلى أشخاص، فجاء «لأقابل» واضحًا وطبيعيًا، وتحفظ «قبلي» معنى الأسبقية الزمنية.
- source_word: ἀλλὰ ἀπῆλθον
  choice: بل ذهبتُ
  rationale: «بل» تنقل المقابلة بوضوح، و«ذهبت» تؤدي حركة الانطلاق من غير إثقال الأسلوب.
- source_word: Ἀραβίαν
  choice: بلاد العرب
  rationale: تسمية عربية واضحة للإقليم التاريخي، من غير حصر مداه الجغرافي فيما لا يحدده النص.
- source_word: καὶ πάλιν ὑπέστρεψα
  choice: ثم عدتُ
  rationale: «عدت» تتضمن معنى الرجوع من جديد، و«ثم» تلائم تتابع الرحلة في العربية مع عدم الإخلال بالمعنى.
- source_word: Δαμασκόν
  choice: دمشق
  rationale: الاسم العربي المعياري للمدينة.
theological_decisions:
- issue: دلالة «قبلي» في وصف الرسل
  choice: الأسبقية الزمنية في الرسالة
  alternative: التفوق في الرتبة أو السلطة
  rationale: عبارة πρὸ ἐμοῦ تدل طبيعيًا على من كانوا رسلًا قبل بولس زمنيًا، ولا يقرر النص بها أنهم أعلى منه رتبة.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، تحافظ على المقابلة بين عدم الصعود إلى أورشليم والذهاب إلى بلاد العرب، وتتجنب تحميل «قبلي» معنى هرميًا لا يصرح به النص.
