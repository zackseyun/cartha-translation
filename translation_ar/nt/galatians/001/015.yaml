  text: ὅτε δὲ ⸀εὐδόκησεν ὁ ἀφορίσας με ἐκ κοιλίας μητρός μου καὶ καλέσας διὰ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: ar
  text: لكن لما سُرَّ الذي أفرزني من بطن أمي[a]، ودعاني بنعمته،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «منذ ولادتي»؛ قارن بلغة دعوة الأنبياء في إرميا 1:5 وإشعياء 49:1.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: لكن لما
  rationale: تحفظ الدلالة الزمنية لـὅτε والانتقال المقابل الخفيف في δέ، وتبقي الآية مرتبطة بما يليها.
- source_word: εὐδόκησεν
  choice: سُرَّ
  rationale: ينقل معنى المسرة والمشيئة الحسنة، من غير اختزاله إلى مجرد اتخاذ قرار.
- source_word: ὁ ἀφορίσας με
  choice: الذي أفرزني
  rationale: «أفرزني» تعبر بإيجاز عن التخصيص ووضع الشخص جانبًا لغرض، من غير إدخال معنى عقدي أضيق مثل «اختارني» أو «عيّنني».
- source_word: ἐκ κοιλίας μητρός μου
  choice: من بطن أمي
  rationale: يحفظ الصورة الحسية والتعبير الكتابي في الأصل، بدل تفسيره داخل المتن بعبارة «منذ ولادتي» أو «قبل أن أولد».
- source_word: καλέσας
  choice: دعاني
  rationale: الترجمة الطبيعية المباشرة التي تتسع لمعنى الدعوة الإلهية من غير شرح زائد.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: بنعمته
  rationale: الباء العربية طبيعية في الدلالة على الواسطة أو الوسيلة هنا، وتحفظ كون النعمة وسيلة الدعوة.
theological_decisions:
- issue: هل يُترجم ἀφορίσας بما يقرر عقيدة مخصوصة في الاختيار السابق؟
  choice: أفرزني
  alternative: اختارني / عيّنني / فصلني
  rationale: اللفظ يدل على أن الله خص بولس ووضعه جانبًا، ويرجح صدى لغة دعوة الأنبياء، لكنه لا يوجب صياغة مذهبية أكثر تحديدًا.
- issue: هل يُصرَّح باسم الله مع أن الفاعل في اليونانية وصف موصول؟
  choice: الذي
  alternative: الله الذي
  rationale: الإبقاء على البنية الوصفية أقرب إلى النص ويجنب إضافة اسم غير مصرح به في هذه العبارة، مع أن السياق يحدد المرجع بوضوح.
translation_notes:
  register: عربية فصحى واضحة وموقرة. أُبقيت الآية جملة غير مكتملة تنتهي بفاصلة لأنها تتصل نحويًا بالآية التالية، كما في الأصل. وُضع رمز الحاشية بعد العبارة التي يشرحها مباشرة.
