  text: And they glorified God because of me[a].
translation:
  language: ar
  text: وكانوا يمجِّدون الله بسببي[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو حرفيًّا أكثر: «فيَّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف يواصل سرد بولس، وتؤديه الواو طبيعيًّا في العربية.
- source_word: ἐδόξαζον
  choice: كانوا يمجِّدون
  rationale: الفعل يدل على تمجيد الله وإكرامه، وصيغة الماضي الناقص اليونانية تفيد عملًا مستمرًّا أو متكررًا؛ لذا تنقل «كانوا يمجِّدون» هذا الجانب بوضوح.
- source_word: ἐν ἐμοὶ
  choice: بسببي
  rationale: 'حرف الجر ἐν يعني حرفيًّا «في»، لكنه هنا يحتمل معنى سببيًّا أو ارتباطيًّا: كانوا يمجِّدون الله استجابةً لما فعله في شأن بولس. وتحفظ الحاشية الصياغة الحرفية وما فيها من احتمال.'
- source_word: τὸν θεόν
  choice: الله
  rationale: مفعول به مباشر للفعل، وترجمته المعيارية الدقيقة هي «الله».
theological_decisions:
- issue: دلالة ἐν ἐμοὶ
  choice: 'المعنى السببي أو الارتباطي: «بسببي»'
  alternative: 'المعنى الحرفي أو المجالي: «فيَّ»'
  rationale: يتحدث السياق عن استجابة كنائس اليهودية لخبر تحوّل بولس وخدمته، فتوضح «بسببي» أنهم مجّدوا الله بسبب ما حدث في شأنه، مع إبقاء «فيَّ» في الحاشية حفظًا للغموض الحقيقي في العبارة اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة الأسلوب. استُخدم التركيب «كانوا يمجِّدون» لإظهار الاستمرار الذي تفيده صيغة الماضي الناقص، مع تجنب لغة طائفية أو تفسيرية زائدة.
