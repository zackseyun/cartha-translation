  language: ar
  text: ثم ذهبتُ إلى نواحي سورية وكيليكية.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα
  choice: ثم
  rationale: تفيد التتابع الزمني في سرد بولس، و«ثم» صياغة عربية طبيعية وموجزة.
- source_word: ἦλθον
  choice: ذهبتُ
  rationale: مع أن الفعل يمكن أن يعني حرفيًا «أتيتُ»، فالسياق يصف انتقال المتكلم من موضعه السابق إلى وجهة أخرى، لذا «ذهبتُ» هي الأنسب في العربية.
- source_word: εἰς
  choice: إلى
  rationale: تعبّر طبيعيًا عن الاتجاه نحو وجهة جغرافية، ولا تقتضي العربية هنا ترجمتها بما يفيد الدخول الحرفي.
- source_word: κλίματα
  choice: نواحي
  rationale: تشير الكلمة إلى مناطق أو أقاليم جغرافية؛ و«نواحي» واضحة وطبيعية وتحافظ على صيغة الجمع.
- source_word: Συρίας
  choice: سورية
  rationale: الاسم الجغرافي العربي المعياري.
- source_word: Κιλικίας
  choice: كيليكية
  rationale: الصيغة العربية الشائعة للاسم الجغرافي القديم.
