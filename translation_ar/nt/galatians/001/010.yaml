  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: ar
  text: فهل أسعى الآن إلى إقناع الناس أم الله؟ أم أسعى إلى إرضاء الناس؟ لو كنت لا أزال أُرضي الناس، لما كنت عبدًا للمسيح.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خادمًا للمسيح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: الآن
  rationale: تنقل الدلالة الزمنية المباشرة، مع الإيحاء بالمقابلة بين موقف بولس الحاضر وسلوكه السابق.
- source_word: πείθω
  choice: أسعى إلى إقناع
  rationale: تحافظ على المعنى الأساسي للفعل، وتعبّر صيغة «أسعى إلى» طبيعيًا عن الاستفهام المتعلق بالقصد؛ ويبقى تركيب «إقناع الله» الحاد مقصودًا في السؤال البلاغي ولا يُسوّى بتفسير أحادي.
- source_word: ἀνθρώπους
  choice: الناس
  rationale: تشمل البشر عمومًا ولا تقصر المرجع على الذكور.
- source_word: τὸν θεόν
  choice: الله
  rationale: المقابل العربي المباشر والطبيعي للمفعول به في التضاد البلاغي.
- source_word: ζητῶ
  choice: أسعى
  rationale: ينقل معنى الطلب والمحاولة المستمرة في المضارع بصياغة عربية موجزة.
- source_word: ἀρέσκειν / ἤρεσκον
  choice: إرضاء / أُرضي
  rationale: المقابل الطبيعي المباشر في سياق طلب رضا الناس واستحسانهم.
- source_word: εἰ ἔτι
  choice: لو كنت لا أزال
  rationale: «لو» تلائم الشرط المخالف للواقع هنا، و«لا أزال» تحفظ معنى الاستمرار والإشارة إلى نمط سابق.
- source_word: Χριστοῦ
  choice: للمسيح
  rationale: يحفظ اللقب المسياني بصيغته العربية الراسخة، ويعبّر حرف الجر عن الانتماء إليه.
- source_word: δοῦλος
  choice: عبدًا
  rationale: «عبد» أقوى وأدق من «خادم» في التعبير عن الملكية والولاء الكاملين، وهو لفظ عربي كتابي مفهوم دون إيحاء «العبادة» الذي قد ينشأ من «عابد».
theological_decisions:
- issue: دلالة πείθω في المقابلة بين الناس والله
  choice: إقناع الناس أم الله
  alternative: طلب رضا الناس أم رضا الله
  rationale: أُبقي المعنى المعجمي المباشر وما في عبارة «إقناع الله» من توتر بلاغي، بدل حسمها تفسيرًا بمعنى طلب الاستحسان، ولا سيما أن الجملة التالية تصرّح بفكرة الإرضاء.
- issue: ترجمة Χριστοῦ δοῦλος
  choice: عبدًا للمسيح
  alternative: خادمًا للمسيح
  rationale: السياق يقابل إرضاء الناس بالانتماء الكامل إلى المسيح؛ لذلك يحفظ «عبد» قوة δοῦλος، بينما يحفظ «المسيح» اللقب من غير إدخال صياغة طائفية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم استفهام بلاغي طبيعي، وحُفظ التوازي بين «الناس» في السؤالين والشرط. أُثبتت علامة الحاشية [a] في المتن.
