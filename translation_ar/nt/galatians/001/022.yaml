lexical_decisions:
- source_word: δὲ
  choice: ولكنني
  rationale: تفيد δέ انتقالًا أو مقابلة خفيفة مع الكلام السابق، و«لكن» تنقل هذا الربط بوضوح من غير مبالغة في قوة الاستدراك.
- source_word: ἀγνοούμενος τῷ προσώπῳ
  choice: غير معروف شخصيًا
  rationale: التركيب اليوناني اصطلاحي ويدل على أن تلك الكنائس لم تكن تعرف بولس معرفةً شخصية عن طريق رؤيته أو لقائه، لا على أنها كانت تجهل أمره مطلقًا.
- source_word: ἐκκλησίαις
  choice: كنائس
  rationale: تشير الكلمة في هذا السياق البولسي إلى جماعات المؤمنين المحلية، و«كنائس» هي الصياغة العربية الأوضح والأشيع.
- source_word: Ἰουδαίας
  choice: اليهودية
  rationale: اسم الإقليم الجغرافي، وقد نُقل بالاسم العربي الكتابي المألوف.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: تحافظ الصياغة على حرف الجر وعلى العبارة البولسية الموجزة التي تصف علاقة هذه الكنائس بالمسيح، من غير تفكيك دلالتها أو حصرها في تفسير واحد.
theological_decisions:
- issue: دلالة ἐν Χριστῷ
  choice: في المسيح
  alternative: المنتمية إلى المسيح
  rationale: «في المسيح» تحفظ التعبير البولسي نفسه وما فيه من كثافة لاهوتية واحتمال دلالي، بدل اختزاله إلى مجرد الانتماء المؤسسي أو الاجتماعي.
- issue: القوة اللقبية لكلمة Χριστός
  choice: المسيح
  alternative: كريستوس
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب اليوناني Χριστός، ويحفظ معنى الممسوح من غير معاملته كاسم علم منقول صوتيًا.
