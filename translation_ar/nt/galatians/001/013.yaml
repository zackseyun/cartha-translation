  rationale: عُدّلت عبارة الفعل الثاني لتؤدي ἐπόρθουν مباشرةً وبقوة مناسبة، مع الحفاظ على دلالة الاستمرار في الماضي بواسطة «كنت». كما استُبدل «كيف» بـ«أنني» لمزيد من المطابقة للتركيب اليوناني، واستُخدمت «إلى حدٍّ بالغ» لتأدية καθ’ ὑπερβολὴν بوضوح طبيعي.
