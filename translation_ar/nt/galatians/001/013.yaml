  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: ar
  text: لقد سمعتم عن سيرتي السابقة في اليهودية[a]، أنني كنت أضطهد كنيسة الله إلى حدٍّ بالغ[b] وكنت أدمّرها[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في الديانة اليهودية».
    reason: lexical_alternative
  - marker: b
    text: أو «بإفراط» أو «بصورة مفرطة».
    reason: lexical_alternative
  - marker: c
    text: أو «وكنت أخرّبها» أو «وكنت أسعى إلى القضاء عليها».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν ποτε
  choice: سيرتي السابقة
  rationale: تعبّر «السيرة» عن نهج العيش والسلوك على نحو أوسع من الأفعال المنفردة، وتؤدي «السابقة» الدلالة الزمنية لـ ποτε بسلاسة.
- source_word: Ἰουδαϊσμῷ
  choice: اليهودية
  rationale: مقابل عربي واضح ومستقر يشير هنا إلى انتماء بولس الديني ونمط حياته وممارسته آنذاك.
- source_word: καθ’ ὑπερβολὴν
  choice: بإفراط
  rationale: يحفظ معنى تجاوز الحد وشدة الاضطهاد من غير إضافة مقدار غير مذكور في الأصل.
- source_word: ἐδίωκον
  choice: كنت أضطهد
  rationale: صيغة «كنت» مع المضارع تنقل الفعل المستمر أو المتكرر في الماضي الذي تفيده صيغة الناقص اليونانية.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: كنيسة الله
  rationale: «كنيسة» هي العبارة العربية المألوفة للجماعة المؤمنة المقصودة، مع بقاء إمكان المعنى المعجمي «جماعة».
- source_word: ἐπόρθουν
  choice: أعمل على تدميرها
  rationale: ينقل قوة الفعل الدال على التخريب والهلاك، ويحفظ إمكان فهم الناقص بوصفه محاولة متواصلة لا يلزم منها تحقق التدمير الكامل.
theological_decisions:
- issue: 'ترجمة ἐκκλησία: «كنيسة» أم «جماعة»'
  choice: كنيسة الله
  alternative: جماعة الله
  rationale: «كنيسة الله» أوضح وأشيع في العربية للإشارة إلى جماعة المؤمنين التي اضطهدها بولس، من غير تحميل اللفظ تحديدًا طائفيًا.
- issue: هل يفيد ἐπόρθουν وقوع التدمير أم السعي إليه؟
  choice: أعمل على تدميرها
  alternative: كنت أدمّرها
  rationale: هذه الصياغة تحفظ شدة القصد والنشاط المستمر، ولا توحي بأن كنيسة الله دُمّرت بالفعل؛ وهي بذلك تصون التوتر الدلالي في الفعل الناقص.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «سيرتي السابقة» بصياغة طبيعية، وحُفظ توازي الفعلين الماضيين المستمرين في «كنت أضطهد... وأعمل». جميع علامات الحواشي مثبتة في المتن.
