base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: ar
  text: 'وكما سبق أن قلنا، أقول الآن مرة أخرى: إن كان أحدٌ يبشّركم بخلاف ما تسلّمتم[a]، فليكن ملعونًا[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بما يتجاوز ما تسلّمتم»؛ يمكن أن تدل العبارة على مجاوزة الرسالة المتسلَّمة أو الانحراف عنها.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فليكن تحت اللعنة»؛ واليونانية: ἀνάθεμα ἔστω.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: كما سبق أن قلنا
  rationale: ينقل معنى القول السابق مع بقاء أثره في الحاضر، بصياغة عربية واضحة وطبيعية.
- source_word: ἄρτι πάλιν λέγω
  choice: أقول الآن أيضًا
  rationale: تحفظ «الآن» دلالة ἄρτι على اللحظة الحاضرة، وتحفظ «أيضًا» معنى التكرار في πάλιν.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: إن كان أحدٌ يبشّركم
  rationale: الفعل «يبشّر» يقابل الفعل اليوناني المتصل بإعلان البشارة، والسياق يحدد أن المقصود هو رسالة الإنجيل.
- source_word: παρ’ ὃ
  choice: بخلاف ما
  rationale: تفيد العبارة هنا الانحراف عن الرسالة التي تسلّمها المخاطبون، مع إبقاء البديل الممكن «بما يتجاوز» في الحاشية.
- source_word: παρελάβετε
  choice: تسلّمتم
  rationale: «تسلّمتم» مناسبة لتلقي رسالة أو تقليد منقول، وتحافظ على دلالة παραλαμβάνω دون جعلها مجرد قبول ذهني.
- source_word: ἀνάθεμα ἔστω
  choice: فليكن ملعونًا
  rationale: تنقل الصيغة العربية قوة الحكم واللعنة في العبارة اليونانية من غير استخدام اللفظ المعرّب الغامض «أناثيما» أو إضافة تحديد غير مصرّح به.
theological_decisions:
- issue: قوة الحكم في ἀνάθεμα ἔστω
  choice: فليكن ملعونًا
  alternative: فليكن تحت اللعنة
  rationale: تحافظ الصياغة المختارة على شدة التحذير، من غير أن تضيف إلى النص تحديدًا صريحًا لمصدر اللعنة أو تفصيلًا عقائديًا غير مذكور.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. استُعمل «تسلّمتم» للدلالة على تلقي الرسالة المنقولة، و«ملعونًا» لصون النبرة القضائية الصارمة دون توسع تفسيري.
