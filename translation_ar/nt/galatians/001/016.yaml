  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: ar
  text: أن يكشف ابنه فيَّ[a] لكي أبشّر به بين الأمم، لم أستشر فورًا لحمًا ودمًا[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لي»، أو «من خلالي».'
    reason: alternative_reading
  - marker: b
    text: «لحمًا ودمًا» تعبير اصطلاحي يعني إنسانًا أو بشرًا.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: أن يكشف
  rationale: ينقل معنى الإظهار والكشف الإلهي بعبارة عربية واضحة، ويحافظ على تعلق المصدر بما سبق في الآية السابقة.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: ابنه
  rationale: صياغة عربية طبيعية تحفظ لقب البنوة وقوته المسيحانية من غير توسع تفسيري.
- source_word: ἐν ἐμοὶ
  choice: فيَّ
  rationale: يحافظ على الدلالة الحرفية لحرف الجر وعلى الاحتمال المقصود بين الكشف في داخل بولس، أو له، أو من خلاله.
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: لكي أبشّر به
  rationale: الفعل يدل على إعلان البشارة، والضمير يعود مباشرة إلى الابن؛ و«أبشّر به» عربية طبيعية تحفظ كونه محور البشارة دون تحويله صراحة إلى «البشارة عنه».
- source_word: ἐν τοῖς ἔθνεσιν
  choice: بين الأمم
  rationale: «الأمم» هو المقابل الكتابي العربي الواضح للشعوب غير اليهودية في هذا السياق البولسي، مع إبقاء صورة الجمع.
- source_word: εὐθέως
  choice: فورًا
  rationale: مقابل عربي حديث وموجز يفيد المباشرة الزمنية.
- source_word: οὐ προσανεθέμην
  choice: لم أستشر
  rationale: ينقل معنى الرجوع إلى آخرين للتشاور، ويلائم المفعول غير المباشر الذي يليه.
- source_word: σαρκὶ καὶ αἵματι
  choice: لحمًا ودمًا
  rationale: يحفظ التعبير التصويري البولسي كما هو، مع بيان معناه الاصطلاحي في الحاشية.
theological_decisions:
- issue: دلالة ἐν ἐμοὶ في كيفية كشف الابن
  choice: الإبقاء على «فيَّ» في المتن
  alternative: «لي» أو «من خلالي»
  rationale: التركيب اليوناني يحتمل الكشف الباطني في بولس، أو الكشف له، أو ظهوره من خلاله في رسالته؛ لذلك لا تُحسم الدلالة في المتن بل تُذكر البدائل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حُفظت العبارة المجازية «لحمًا ودمًا» والغموض الحقيقي في «فيَّ»، مع شرح موجز في الحواشي.
