  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: ar
  text: ولكن حتى إن بشَّرنا نحن أو ملاك من السماء ببشارة تخالف ما بشَّرناكم به[a]، فليكن ملعونًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «تختلف عما بشَّرناكم به» أو «تتجاوز ما بشَّرناكم به».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «فليكن تحت اللعنة». واللفظ اليوناني هو «أناثيما»، ولا يلزم أن يكون هنا مصطلحًا فنيًا للحرمان الكنسي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: ولكن حتى لو
  rationale: تنقل قوة الاستدراك في ἀλλά والتوكيد في καί مع الشرط في ἐάν، بصياغة عربية واضحة وطبيعية.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: نحن، أو ملاك من السماء
  rationale: تحفظ إدراج بولس نفسه على سبيل التوكيد، ثم المقابلة التصاعدية مع رسول سماوي، من غير زيادة تفسيرية.
- source_word: εὐαγγελίζηται ὑμῖν
  choice: بشَّرناكم ببشارة
  rationale: يعكس الفعل اليوناني الدال على إعلان الخبر السار، ويحافظ في العربية على الصلة اللفظية مع الفعل اللاحق.
- source_word: παρ’ ὃ
  choice: تخالف ما
  rationale: ينقل في هذا السياق معنى الانحراف عن البشارة السابقة وقوته الجدلية، مع إبقاء البدائل الممكنة في الحاشية.
- source_word: εὐηγγελισάμεθα ὑμῖν
  choice: بشَّرناكم به
  rationale: يحافظ على تكرار الجذر المقصود في الفعلين اليونانيين، بصياغة عربية غير متكلفة.
- source_word: ἀνάθεμα ἔστω
  choice: فليكن ملعونًا
  rationale: ينقل قوة صيغة الحكم واللعنة بعبارة عربية مباشرة ومفهومة، من غير تحميلها معنى كنسيًا اصطلاحيًا متأخرًا.
theological_decisions:
- issue: دلالة صيغة اللعنة ἀνάθεμα ἔστω
  choice: فليكن ملعونًا
  alternative: فليكن تحت اللعنة؛ فليكن محرومًا
  rationale: النص يصدر حكمًا شديدًا على أيّ مبشّر برسالة تخالف البشارة الرسولية. وتحفظ «ملعونًا» هذه القوة من غير قصر المعنى على الحرمان الكنسي.
- issue: دلالة παρ’ ὃ على علاقة الرسالة الأخرى بالبشارة السابقة
  choice: تخالف ما
  alternative: تختلف عما؛ تتجاوز ما
  rationale: السياق الجدلي يرجّح معنى المخالفة، لكن حرف الجر يسمح بظلال مثل الاختلاف أو التجاوز، ولذلك ذُكرت في الحاشية بدل محو التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدم «بشَّر... ببشارة» للمحافظة على الصلة الاشتقاقية بين الفعلين اليونانيين، ووضعت علامتا الحاشية بعد العبارة التي تتناولان بدائلها.
