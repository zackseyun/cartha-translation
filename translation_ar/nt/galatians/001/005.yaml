  language: ar
  text: له المجد إلى أبد الآبدين. آمين.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: له
  rationale: اسم الموصول في صيغة المجرور بالداتيف يعود إلى «إلهنا وأبينا» في الآية السابقة؛ و«له» صياغة عربية طبيعية موجزة في التمجيد.
- source_word: ἡ δόξα
  choice: المجد
  rationale: «المجد» هو المقابل العربي المألوف والدقيق في سياق التمجيد، ويحفظ جلال العبارة من غير شرح زائد.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: إلى أبد الآبدين
  rationale: تعبير عربي كتابي راسخ ينقل قوة الاصطلاح اليوناني الدال على الدوام الذي لا نهاية له، مع الحفاظ على النبرة التعبدية.
- source_word: ἀμήν
  choice: آمين
  rationale: نقل صوتي عربي مستقر للكلمة، وتأتي هنا توكيدًا ختاميًا للتمجيد.
theological_decisions:
- issue: الفعل المحذوف في صيغة التمجيد
  choice: له المجد
  alternative: ليكن له المجد
  rationale: اليونانية لا تذكر فعلًا صريحًا. تحافظ الجملة الاسمية العربية «له المجد» على هذا الإيجاز، ويمكن فهمها إقرارًا باستحقاق الله للمجد أو تمجيدًا دعائيًا، من غير حسم الدلالة بإضافة فعل.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة، تستخدم العبارة التعبدية المألوفة «إلى أبد الآبدين» وتحافظ على إيجاز الأصل اليوناني.
