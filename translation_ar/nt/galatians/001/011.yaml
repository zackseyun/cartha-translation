  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: ar
  text: فإني أُعلِمكم، أيها الإخوة[a]، أن الإنجيل الذي بشَّرتُ به ليس من مصدر بشري.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'قد يُراد: الإخوة والأخوات؛ فاللفظ اليوناني بصيغة المذكر الجمع وقد يشمل الجماعة كلها.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «ليس بحسب الإنسان»؛ وقد تعني العبارة أيضًا: «ليس وفقًا لمعايير بشرية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: أُعلِمكم
  rationale: ينقل معنى «أجعل الأمر معروفًا لكم» بصياغة عربية فصيحة وطبيعية، ويحافظ على قوة التصريح الذي يفتتح به بولس توضيحه.
- source_word: γὰρ
  choice: فإني
  rationale: الفاء تربط الآية بما قبلها بوصفها تعليلًا أو تفسيرًا، و«إني» تلائم بناء الجملة العربية.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة الجمع المذكر في اليونانية وعلى أسلوب النداء، مع بيان احتمال شمول جماعة المؤمنين كلها في الحاشية.
- source_word: εὐαγγέλιον
  choice: الإنجيل
  rationale: هو المقابل العربي المستقر، ويلائم الاستعمال الاصطلاحي عند بولس.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: الذي بشَّرتُ به
  rationale: صياغة عربية طبيعية تنقل المبني للمجهول اليوناني ومعنى إعلان بولس للإنجيل، من غير إضافة مفعول غير مصرح به.
- source_word: κατὰ ἄνθρωπον
  choice: من مصدر بشري
  rationale: يفهم السياق اللاحق العبارة من جهة المصدر، إذ ينفي بولس أنه تسلّم الإنجيل أو تعلّمه من إنسان؛ وتُحفظ الدلالة الحرفية واحتمال معيار البشر في الحاشية.
theological_decisions:
- issue: هل تشير عبارة κατὰ ἄνθρωπον إلى المصدر البشري أم إلى المعيار البشري؟
  choice: ليس من مصدر بشري
  alternative: 'ليس بحسب الإنسان؛ أو: ليس وفقًا لمعايير بشرية'
  rationale: ترجّح الآية التالية معنى المصدر، لأنها تنفي تلقّي بولس الإنجيل من إنسان أو تعلّمه على يده. ومع ذلك، لا تُلغى دلالة العبارة الأوسع، ولذلك تُذكر في الحاشية.
- issue: مدى شمول ἀδελφοί للنساء في الجماعة
  choice: الإخوة
  alternative: الإخوة والأخوات
  rationale: النص اليوناني بصيغة المذكر الجمع، لكن هذا النداء قد يشمل جماعة المؤمنين رجالًا ونساءً؛ فحُفظت الصيغة في المتن وبُيّن الشمول المحتمل في الحاشية.
translation_notes:
  register: العربية فصحى حديثة واضحة ووقورة. استُخدم «أُعلِمكم» بدل تركيب حرفي ثقيل، وحُفظت صلة التعليل بالفاء. روعي وضوح معنى المصدر في المتن مع إبقاء الغموض الدلالي الحقيقي لعبارة κατὰ ἄνθρωπον في الحاشية.
