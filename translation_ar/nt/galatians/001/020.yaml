  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἃ δὲ γράφω ὑμῖν
  choice: وأمّا ما أكتبه إليكم
  rationale: تنقل «ما» الموصول اليوناني بصياغة عربية طبيعية، وتؤدي «وأمّا» وظيفة δέ الانتقالية الخفيفة من غير افتراض دلالة زمنية، بينما يحافظ المضارع «أكتبه» على السياق الرسائلي.
- source_word: ἰδοὺ
  choice: فها إني أقول
  rationale: تُظهر «ها» التنبيه والتوكيد في ἰδού، وتأتي «إني أقول» تتمة عربية طبيعية تمهّد للتصريح التالي من غير استعمال تعبير مهجور.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: أمام الله
  rationale: تعبير موجز وطبيعي يحفظ معنى الوقوف في حضرة الله وتحت نظره، وما في العبارة من جدية ومساءلة.
- source_word: ὅτι οὐ ψεύδομαι
  choice: إني لا أكذب
  rationale: تؤدي «إني» مضمون القول الذي تقدمه ὅτι، ويحافظ المضارع «لا أكذب» على النفي المباشر المؤكد.
theological_decisions:
- issue: قوة الاحتجاج بحضور الله
  choice: 'أمام الله: إني لا أكذب'
  alternative: في حضرة الله، لا أكذب
  rationale: تحفظ الصياغة طابع الاحتجاج الجاد والمسؤولية أمام الله، من غير تحويل العبارة إلى صيغة قسم رسمية لا يصرح بها النص اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حوفظ على أداة التنبيه اليونانية بصيغة «ها»، وعلى الانتقال الخفيف في δέ بصيغة «وأمّا»، مع تجنب إدخال ظرف زمني غير موجود في الأصل.
