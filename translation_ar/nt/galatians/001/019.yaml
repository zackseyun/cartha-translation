  text: ἕτερον δὲ τῶν ἀποστόλων οὐκ εἶδον, εἰ μὴ Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: ar
  text: ولكنني لم أرَ أحدًا من الرسل الآخرين إلا يعقوب، أخا الرب.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولم أرَ رسولًا آخر، وإنما رأيت يعقوب، أخا الرب». يفهم بعضهم هذه الصياغة على أنها لا تَعُدّ يعقوب من الرسل.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἕτερον
  choice: أحدًا من ... الآخرين
  rationale: في التركيب التبعيضي مع τῶν ἀποστόλων يدل على شخص آخر من بين الرسل، وهذه الصياغة عربية طبيعية وتحفظ المعنى.
- source_word: δέ
  choice: ولكنني
  rationale: تفيد انتقالًا ذا مقابلة خفيفة مع الكلام السابق، و«لكن» مناسبة للسياق.
- source_word: ἀποστόλων
  choice: الرسل
  rationale: المصطلح العربي المستقر للدائرة الرسولية المقصودة في السياق البولسي.
- source_word: οὐκ εἶδον
  choice: لم أرَ أحدًا
  rationale: ينقل النفي والفعل الماضي بوضوح، وينسجم طبيعيًا مع العبارة التبعيضية اللاحقة.
- source_word: εἰ μὴ
  choice: إلا
  rationale: تؤدي هنا معنى الاستثناء لا الشرط، وهي المقابل العربي المباشر والطبيعي.
- source_word: Ἰάκωβον
  choice: يعقوب
  rationale: الصيغة العربية الكتابية المستقرة للاسم اليوناني Ἰάκωβος.
- source_word: ἀδελφὸν
  choice: أخا
  rationale: يحفظ المعنى العائلي المباشر للكلمة من غير توسيعه إلى قريب أو نسيب بلا قرينة.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: يحفظ اللقب κύριος بصيغته العربية المستقرة، وتأتي العبارة «أخا الرب» طبيعية وموجزة.
theological_decisions:
- issue: هل يُعَدّ يعقوب ضمن «الرسل» في هذا التركيب؟
  choice: 'يحافظ النص الرئيس على القراءة النحوية الأرجح: لم يرَ بولس أحدًا آخر من الرسل إلا يعقوب، بما يوحي بأن يعقوب داخل في الاستثناء.'
  alternative: يفهم بعضهم العبارة بمعنى أن بولس لم يرَ رسولًا آخر غير بطرس، لكنه رأى أيضًا يعقوب من غير أن يصنّفه بالضرورة رسولًا.
  rationale: تدخل εἰ μὴ في الأغلب استثناءً على عبارة «أحدًا من الرسل الآخرين». أُبقي هذا التركيب في النص، مع توثيق الفهم الآخر في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «الرسل» و«الرب» بوصفهما مصطلحين كتابيين مألوفين، وحُفظ غموض علاقة يعقوب بفئة الرسل بواسطة الحاشية.
