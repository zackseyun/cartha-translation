  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: ar
  text: الذي بذل نفسه من أجل خطايانا، لينقذنا من العصر الحاضر الشرير[a]، وفقًا لمشيئة إلهنا وأبينا،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العالم الحاضر الشرير».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δόντος ἑαυτὸν
  choice: الذي بذل نفسه
  rationale: الفعل δίδωμι يعني «أعطى»، لكن التعبير العربي «بذل نفسه» طبيعي في سياق التضحية، ويحفظ معنى الفعل الطوعي من غير تحديد آلية لاهوتية إضافية.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: من أجل خطايانا
  rationale: ينقل معنى ὑπέρ التمثيلي أو الفدائي بصياغة عربية واضحة، من غير حصر العبارة في نظرية معينة للكفارة.
- source_word: ἐξέληται
  choice: لينقذنا
  rationale: يفيد ἐξαιρέω الإخراج من خطر أو من وضع مسيطر؛ و«ينقذنا» واضحة ومعاصرة وتحفظ قوة الفعل.
- source_word: αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: العصر الحاضر الشرير
  rationale: αἰών يدل أساسًا على عصر أو دهر، لا على العالم المادي؛ و«العصر» أوضح لعامة القراء، مع إبقاء الوصف الأخلاقي «الشرير» متعلقًا به.
- source_word: κατὰ τὸ θέλημα
  choice: وفقًا لمشيئة
  rationale: تنقل معنى المطابقة لقصد الله بدقة وبلغة عربية طبيعية.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: إلهنا وأبينا
  rationale: تحفظ الإشارة إلى شخص واحد هو إلهنا وأبونا، وتأتي بصياغة عربية موجزة وواضحة.
theological_decisions:
- issue: مدى تخصيص معنى ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν في سياق الكفارة
  choice: من أجل خطايانا
  alternative: عن خطايانا
  rationale: الصياغة المختارة تحفظ القوة الفدائية والتمثيلية، ولا تفرض على العبارة نظرية تفصيلية للكفارة لا يصرح بها النص.
- issue: ترجمة αἰών بوصفه مفهومًا زمانيًا-كونيًا
  choice: العصر الحاضر الشرير
  alternative: العالم الحاضر الشرير
  rationale: «العصر» أقرب إلى الدلالة الأصلية من «العالم»، ويحفظ التقابل البولسي بين الدهر الحاضر والنظام الآتي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. اختير «بذل نفسه» لطبيعته في العربية مع الحفاظ على طوعية الفعل، و«العصر» لتقديم الدلالة الأصلية لـ αἰών على الصياغة التقليدية «العالم».
