base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah,[a]
translation:
  language: ar
  text: نِعْمَةٌ لَكُمْ وَسَلَامٌ مِنَ اللهِ الآبِ وَرَبِّنَا يَسُوعَ الْمَسِيحِ،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: نِعْمَةٌ
  rationale: اللفظ المألوف في التحية الرسولية، ويحفظ معنى الإحسان الإلهي وما للكلمة من عمق لاهوتي.
- source_word: ὑμῖν
  choice: لَكُمْ
  rationale: ينقل دلالة المفعول غير المباشر في صيغة بركة عربية طبيعية وموجزة.
- source_word: εἰρήνη
  choice: سَلَامٌ
  rationale: يحفظ خلفية التحية الكتابية ومعاني السلامة والمصالحة والطمأنينة.
- source_word: ἀπό
  choice: مِنَ
  rationale: يدل بوضوح على مصدر النعمة والسلام.
- source_word: θεοῦ πατρὸς
  choice: اللهِ الآبِ
  rationale: ترجمة مباشرة للسلسلة الإضافية كما يوردها النص اليوناني المعطى، من غير نقل ضمير «نا» إلى «الآب».
- source_word: κυρίου ἡμῶν
  choice: رَبِّنَا
  rationale: موضع ἡμῶν في النص اليوناني المعطى يجعله متعلقًا بـ«الرب»، والصياغة العربية «ربنا» طبيعية ودقيقة.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: «المسيح» هو المقابل العربي الراسخ لـΧριστός، ويحفظ دلالته بوصفه لقبًا مسيانيًا مع كونه جزءًا مألوفًا من هذا الاسم المركب.
theological_decisions:
- issue: تعلّق الضمير ἡμῶν في السلسلة «θεοῦ πατρὸς καὶ κυρίου ἡμῶν»
  choice: رَبِّنَا يَسُوعَ الْمَسِيحِ
  alternative: اللهِ أَبِينَا وَالرَّبِّ يَسُوعَ الْمَسِيحِ
  rationale: بحسب ترتيب النص اليوناني المقدم، يأتي ἡμῶν بعد κυρίου مباشرة، لذلك نُسب الضمير إلى «ربنا» بدل نقله إلى «أبينا».
- issue: ترجمة Χριστός كلقب أو إبقاؤه بصيغة اسمية تقليدية
  choice: الْمَسِيحِ
  alternative: لا يوجد في العربية تمييز لفظي طبيعي موازٍ تمامًا للفرق الإنجليزي بين Messiah وChrist
  rationale: اللفظ العربي «المسيح» هو الترجمة التقليدية والدلالية معًا، ولذلك يحفظ اللقب من غير حاجة إلى حاشية بديلة مصطنعة.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة، قريبة من بنية الأصل من غير تكلّف. استُخدم الضبط الجزئي لتوضيح الإعراب في عبارة قصيرة قد يلتبس فيها تعلّق الإضافات، ولم تُضف حاشية لأن «المسيح» في العربية يؤدي دلالة اللقب والصيغة التقليدية معًا.
