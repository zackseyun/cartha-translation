id: GAL.1.18
reference: Galatians 1:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: ar
  text: ثم بعد ثلاث سنوات صعدتُ إلى أورشليم لأتعرّف إلى كيفا[a][b]، وأقمتُ عنده خمسة عشر يومًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمتها: «لأزور كيفا»؛ فالفعل اليوناني قد يدل على زيارة شخص ولقائه للتعرّف إليه شخصيًا.'
    reason: lexical_alternative
  - marker: b
    text: كيفا هو الاسم الآرامي لبطرس.
    reason: name_explanation
lexical_decisions:
- source_word: Ἔπειτα
  choice: ثم
  rationale: تدل على الحدث التالي في تسلسل رواية بولس، و«ثم» صياغة عربية طبيعية موجزة.
- source_word: μετὰ ἔτη τρία
  choice: بعد ثلاث سنوات
  rationale: تنقل العبارة الزمنية اليونانية مباشرة وبأسلوب عربي فصيح.
- source_word: ἀνῆλθον
  choice: صعدتُ
  rationale: تحفظ دلالة الصعود التي يتضمنها الفعل، وهي ملائمة للسفر إلى أورشليم.
- source_word: Ἱεροσόλυμα
  choice: أورشليم
  rationale: الصيغة العربية الكتابية المألوفة لاسم المدينة.
- source_word: ἱστορῆσαι
  choice: لأتعرّف إلى
  rationale: يفيد الفعل لقاء شخص والتعرّف إليه معرفة شخصية، لا مجرد زيارة عابرة؛ وتحفظ هذه الصياغة هذا المعنى من غير توسع.
- source_word: Κηφᾶν
  choice: كيفا
  rationale: تنقل الاسم الآرامي الذي استخدمه بولس بدل توحيده مع «بطرس».
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: أقمتُ عنده
  rationale: تعبير عربي طبيعي يدل على البقاء لديه طوال المدة المذكورة، من غير الجزم بتفاصيل ترتيبات السكن.
- source_word: ἡμέρας δεκαπέντε
  choice: خمسة عشر يومًا
  rationale: تنقل مفعول الزمان الدال على مدة الإقامة بصياغة عربية سليمة.
theological_decisions:
- issue: هوية كيفا
  choice: إبقاء «كيفا» في المتن مع بيان أنه الاسم الآرامي لبطرس في الحاشية
  alternative: استبداله في المتن بـ«بطرس»
  rationale: يحفظ الاسم الوارد في النص اليوناني ولا يطمس اختيار بولس اللفظي، مع مساعدة القارئ على معرفة صاحبه.
- issue: دلالة ἱστορῆσαι
  choice: لأتعرّف إلى
  alternative: لأزور
  rationale: يحفظ احتمال أن الغرض كان لقاء كيفا والتعرّف إليه شخصيًا، من غير تحميل العبارة معنى الاستعلام الرسمي أو التلمذة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ ترتيب الأحداث ودلالة الصعود، واستُعمل «كيفا» وفق الاسم الوارد في الأصل. وُضعت علامتا الحاشيتين بعد الاسم المتصل بالفعل، مع ترتيب الحاشية المعجمية أولًا ثم حاشية تعريف الاسم.
