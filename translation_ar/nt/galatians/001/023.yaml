  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: ar
  text: 'إنما كانوا يسمعون: «إن الذي كان يضطهدنا سابقًا يبشّر الآن بالإيمان[a] الذي كان من قبل يدمّره».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «البشارة». واللفظ اليوناني هو «الإيمان»، ويُرجَّح هنا أنه يشير إلى الإيمان المسيحي أو رسالته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον
  choice: فقط
  rationale: تفيد الحصر، إذ كان علم كنائس اليهودية ببولس مقتصرًا على ما سمعوه عنه.
- source_word: ἀκούοντες ἦσαν
  choice: كانوا يسمعون
  rationale: يحفظ التركيب معنى الاستمرار أو التكرار في الماضي دون إثقال العبارة العربية.
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: الذي كان يضطهدنا سابقًا
  rationale: ينقل اسم الفاعل المستعمل اسميًا مع الدلالة الزمنية لـποτε بصياغة عربية طبيعية.
- source_word: νῦν εὐαγγελίζεται
  choice: يبشّر الآن
  rationale: الفعل ذو دلالة إعلان البشارة، و«يبشّر» تعبير عربي واضح ومألوف يحافظ على هذه الدلالة.
- source_word: τὴν πίστιν
  choice: الإيمان
  rationale: يحافظ على المقابل المباشر لـπίστις، والمقصود في السياق على الأرجح الإيمان بوصفه الرسالة المسيحية المعلنة، مع توضيح البديل في الحاشية.
- source_word: ἣν ποτε ἐπόρθει
  choice: الذي كان من قبل يسعى إلى تدميره
  rationale: ينقل قوة πορθέω الدالة على التخريب أو التدمير، وتوضح «يسعى إلى» أن الحديث عن حملة بولس العدائية دون أن توحي العبارة بأنه نجح في القضاء على الإيمان.
theological_decisions:
- issue: دلالة τὴν πίστιν
  choice: «الإيمان» بمعنى الإيمان المسيحي أو رسالته التي صار بولس يبشّر بها
  alternative: فعل الإيمان الباطني، أو «البشارة» بوصفها ترجمة سياقية
  rationale: 'التعريف والسياق، ولا سيما كونه مفعولًا لفعل البشارة وشيئًا سبق أن هاجمه بولس، يرجحان المعنى الموضوعي: مضمون الإيمان أو الرسالة المسيحية. أبقينا لفظ «الإيمان» في المتن لصون التعبير اليوناني وعدم حسمه ضمنيًا.'
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة ذات نبرة كتابية كريمة. استُخدم «بل» لربط الجملة بسياق المقابلة السابق، وحُفظت بنية الخبر المقتبس وعلامة الحاشية في المتن.
