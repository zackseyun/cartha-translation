  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: ar
  text: لأني لم أتلقَّه من إنسان، ولا تلقَّيتُ تعليمًا فيه، بل بإعلان يسوع المسيح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تعني العبارة إعلانًا صادرًا من يسوع المسيح، أو إعلانًا عنه.
    reason: يحمل المضاف إليه في اليونانية احتمال المصدر واحتمال الموضوع، والإضافة العربية تحتمل الوجهين كذلك.
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: من إنسان
  rationale: 'يحافظ المفرد النكرة على المعنى العام: لم يكن مصدر الإنجيل إنسانًا، من غير الإيحاء بشخص بعينه.'
- source_word: παρέλαβον
  choice: أتلقَّه
  rationale: الفعل «تلقّى» ملائم لسياق تسلُّم تعليم أو تقليد من جهة أخرى، ويحفظ فكرة انتقال الخبر إلى بولس.
- source_word: ἐδιδάχθην
  choice: تعلَّمتُه
  rationale: صيغة عربية طبيعية تؤدي معنى المبني للمجهول اليوناني، أي إن بولس لم يتلقَّ الإنجيل عن طريق تعليم بشري.
- source_word: δι’ ἀποκαλύψεως
  choice: بإعلان
  rationale: الباء تعبّر بوضوح عن الوسيلة، و«إعلان» تؤدي معنى كشف ما كان مستورًا دون زيادة تفسيرية.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: الإضافة العربية في «إعلان يسوع المسيح» تحافظ طبيعيًا على احتمال أن يكون يسوع المسيح مصدر الإعلان أو موضوعه، كما أن «المسيح» تنقل Χριστός بوصفه لقبًا.
theological_decisions:
- issue: دلالة المضاف إليه في ἀποκαλύψεως Ἰησοῦ Χριστοῦ
  choice: إعلان يسوع المسيح
  alternative: إعلان صادر من يسوع المسيح؛ أو إعلان عن يسوع المسيح
  rationale: التركيب اليوناني يحتمل أن يكون يسوع المسيح هو مصدر الإعلان أو موضوعه. تحافظ الإضافة العربية على هذا التوتر بدل حسمه في المتن، وتوضح الحاشية الاحتمالين.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة وكريمة النبرة. استُخدمت «من إنسان» بدل تعبير تجريدي مثل «من مصدر بشري»، لقربها من النص اليوناني ووضوحها للقارئ العام، ووُضعت علامة الحاشية عقب العبارة التي تتناولها مباشرة.
