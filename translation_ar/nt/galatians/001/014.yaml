  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: ar
  text: وكنتُ أتقدَّم في اليهودية[a] على كثيرين من أترابي بين قومي، إذ كنتُ أشدَّ غيرةً بكثير على تقاليد آبائي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «اليهودية»: «الديانة اليهودية» أو «طريقة الحياة اليهودية»، بحسب مدى دلالة الكلمة اليونانية في هذا السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: كنتُ أتقدَّم
  rationale: يحفظ صيغة الماضي المستمر في الفعل الناقص، ويدل على تقدّم متواصل في السياق المقارن.
- source_word: Ἰουδαϊσμῷ
  choice: اليهودية
  rationale: مقابل عربي موجز وشائع يدل هنا على المنظومة الدينية وطريقة العيش اليهودية، مع إبقاء سعة المصطلح في الحاشية.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: على كثيرين من أترابي
  rationale: تفيد ὑπέρ المقارنة، و«أترابي» تعبّر طبيعيًا عن الأشخاص المساوين له في السن.
- source_word: ἐν τῷ γένει μου
  choice: بين قومي
  rationale: تنقل الدلالة الاجتماعية والإثنية لكلمة γένος من غير الإيحاءات الحديثة الملتبسة التي قد تصاحب لفظ «العرق».
- source_word: περισσοτέρως ζηλωτὴς ὑπάρχων
  choice: إذ كنتُ أشدَّ منهم بكثير غيرةً
  rationale: تحفظ تركيب الحال وقوة المقارنة، وتجعل المقارَنين المفهومين من السياق صريحين بما يلائم العربية.
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: على تقاليد آبائي
  rationale: ترجمة قريبة وطبيعية تحافظ على معنى التقاليد الموروثة عن الآباء والأسلاف.
theological_decisions:
- issue: مدى دلالة Ἰουδαϊσμός
  choice: اليهودية
  alternative: الديانة اليهودية؛ طريقة الحياة اليهودية
  rationale: اختير اللفظ العربي المألوف من دون حصر المصطلح في العقائد وحدها أو توسيعه صراحةً إلى كامل نمط الحياة؛ وأُبقي الاحتمال الدلالي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «أترابي» لإيجاز معنى المساواة في السن، و«تقاليد آبائي» للمحافظة على الصلة اللفظية بالموروث الأبوي. وُضع مؤشر الحاشية بعد «تقاليد آبائي» بوصفه مؤشرًا عامًا للآية، مع أن الحاشية تتعلق بلفظ «اليهودية».
