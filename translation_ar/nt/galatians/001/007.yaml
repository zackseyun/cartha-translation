  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: ar
  text: وهو ليس إنجيلًا آخر، غير أن هناك أناسًا يربكونكم ويريدون تحريف إنجيل المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλο
  choice: إنجيلًا آخر
  rationale: جاءت «آخر» في اليونانية بلا اسم مصرح به، لكن «الإنجيل» مفهوم بوضوح من الآية السابقة؛ وإظهاره بالعربية يحقق الوضوح من غير إضافة معنى جديد.
- source_word: εἰ μή
  choice: غير أن
  rationale: تقدّم العبارة هنا استدراكًا وتفسيرًا لما سبق، لا شرطًا بالمعنى الضيق؛ و«غير أن» عربية طبيعية تحافظ على هذا الترابط.
- source_word: ταράσσοντες
  choice: يزعجونكم
  rationale: تنقل معنى إحداث الاضطراب والقلق بعبارة واضحة ومباشرة، من دون المبالغة إلى حد وصفهم صراحة بأنهم يضلّلون المخاطبين.
- source_word: θέλοντες
  choice: يريدون
  rationale: تحافظ على دلالة القصد والإرادة في اسم الفاعل اليوناني بصياغة عربية طبيعية.
- source_word: μεταστρέψαι
  choice: تحريف
  rationale: يفيد الفعل تغيير الشيء وقلبه عن وجهه حتى يصير مخالفًا؛ و«تحريف» واضح وثقيل الدلالة في السياق من غير توسع تفسيري.
- source_word: εὐαγγέλιον
  choice: إنجيل
  rationale: هو المقابل العربي الراسخ والمفهوم للمصطلح البولسي، ويحافظ هنا على طابعه الاصطلاحي.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، ويحفظ الإطار المسياني من غير الحاجة إلى بديل أجنبي أو شرح داخل النص.
theological_decisions:
- issue: دلالة تركيب «إنجيل المسيح» الإضافي
  choice: إنجيل المسيح
  alternative: الإنجيل المتعلق بالمسيح / الإنجيل الصادر عن المسيح
  rationale: الإضافة اليونانية قد تفيد تعلق الإنجيل بالمسيح أو صدوره عنه أو اختصاصه به. تحافظ الإضافة العربية على هذا الاتساع ولا تحسمه تفسيريًا.
- issue: هل ὃ οὐκ ἔστιν ἄλλο ينفي وجود إنجيل آخر حقيقي أم يصف الرسالة المنافسة؟
  choice: وهو ليس إنجيلًا آخر
  alternative: وما هو بإنجيل آخر
  rationale: 'الصياغة المختارة تحفظ مفارقة بولس: ما يدعى إنجيلًا مغايرًا ليس في الحقيقة إنجيلًا آخر، من غير إدخال حكم عقائدي زائد.'
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «غير أن» للاستدراك الطبيعي، وحُفظت الإضافة في «إنجيل المسيح» لما فيها من إيجاز واحتمال دلالي أصيل.
