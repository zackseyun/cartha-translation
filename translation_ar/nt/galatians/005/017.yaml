source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: ar
  text: لِأَنَّ الْجَسَدَ يَشْتَهِي مَا يُعَادِي الرُّوحَ[a]، وَالرُّوحُ مَا يُعَادِي الْجَسَدَ؛ فَهذَانِ يُقَاوِمُ كُلٌّ مِنْهُمَا الآخَرَ[b]، لِئَلَّا تَفْعَلُوا مَا تُرِيدُونَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الطبيعة الخاطئة». الكلمة اليونانية هي σάρξ (ساركس)، وتُستعمل هنا بمعنى أخلاقي أوسع من البدن المادي وحده.
    reason: lexical_alternative
  - marker: b
    text: أو «الروح» بمعنى روح الإنسان؛ أمّا السياق فيرجّح أن المقصود روح الله.
    reason: alternative_reading
lexical_decisions:
- source_word: σὰρξ
  choice: الجسد
  rationale: يحفظ استعارة بولس ومفرداته اللاهوتية، ولا يختزل المعنى الأخلاقي المقصود في تفسير مثل «الطبيعة الخاطئة».
- source_word: ἐπιθυμεῖ
  choice: يشتهي
  rationale: ينقل معنى الرغبة القوية في هذا السياق، من غير حصر الفعل في الشهوة الجنسية.
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: ما يعادي الروح / ما يعادي الجسد
  rationale: إضافة «ما» تجعل العبارة عربية طبيعية، وتحفظ دلالة العداء في κατά مع المضاف إليه.
- source_word: πνεῦμα
  choice: الروح
  rationale: السياق القريب في غلاطية 5 يرجّح أن المقصود روح الله، مع بقاء الرسم العربي غير حاسم من جهة التكبير الطباعي.
- source_word: ἀλλήλοις ἀντίκειται
  choice: يقاوم أحدهما الآخر
  rationale: تعبير واضح يحفظ معنى التقابل والمقاومة المتبادلة.
- source_word: ἵνα μὴ
  choice: حتى لا
  rationale: يحفظ احتمال الغاية أو النتيجة العملية في تركيب يوناني طبيعي بعربية واضحة.
- source_word: ἃ ἐὰν θέλητε ... ποιῆτε
  choice: تفعلوا ما تريدون
  rationale: ينقل التركيب الموصول غير المحدد بإيجاز طبيعي من دون إضافة معنى الاعتياد.
theological_decisions:
- issue: معنى σάρξ في السياق الأخلاقي عند بولس
  choice: الإبقاء على «الجسد» في المتن
  alternative: الطبيعة الخاطئة
  rationale: يحفظ صورة بولس الاصطلاحية والتوتر بين الجسد والروح، بينما البديل تفسير محتمل أضيق من اللفظ اليوناني.
- issue: مرجع πνεῦμα
  choice: روح الله هو المرجع الأرجح
  alternative: روح الإنسان
  rationale: سياق غلاطية 5، ولا سيما الحديث عن السلوك بالروح وثمر الروح، يرجّح روح الله؛ لكن العربية لا تستخدم الحرف الكبير للتمييز، لذلك تُذكر المسألة في الحاشية.
- issue: دلالة ἵνα μὴ
  choice: «حتى لا» مع إبقاء التداخل بين الغاية والنتيجة
  alternative: والنتيجة أنكم لا تفعلون
  rationale: التركيب اليوناني يحتمل توجيهًا غائيًا أو بيان الأثر العملي للصراع، فلا يُحسم في المتن بتفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «يشتهي» بالمعنى العام للرغبة القوية، وحُفظت مفردة «الجسد» البولسية بدل استبدالها بتفسير مذهبي. وُضع كل مؤشّر حاشية في المتن.
