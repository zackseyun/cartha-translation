  - severity: medium
    issue: «حتى لا» أضعف دقة من «لئلا» في نقل ἵνα μή.
    rationale: «حتى» قد توحي بحدّ زمني في العربية، بينما «لئلا» تنقل بوضوح علاقة الغاية، مع إمكان فهمها في السياق بوصفها الأثر العملي للتعارض.
  - severity: low
    issue: الحاشية [a] تفسّر «الجسد» تفسيرًا أخلاقيًا بإطلاق زائد.
    rationale: الأفضل أن تبيّن أن اللفظ في هذا السياق يتجاوز البدن المادي، من دون تعريفه تعريفًا حصريًا أو إقحام تفسير مذهبي.
