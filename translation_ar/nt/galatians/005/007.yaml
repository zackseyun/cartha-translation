source:
  edition: SBLGNT
  text: Ἐτρέχετε καλῶς· τίς ὑμᾶς ἐνέκοψεν ⸀τῇ ἀληθείᾳ μὴ πείθεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/007.yaml
  text: You were running well[a]. Who hindered you from obeying the truth?
translation:
  language: ar
  text: كنتم تجرون حسنًا. فمَن أعاقكم عن طاعة الحق؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عن الاقتناع بالحق». يمكن أن يعني الفعل اليوناني «يطيع» أو «يقتنع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: كنتم تجرون
  rationale: ينقل صيغة الماضي المستمر في اليونانية ويحافظ على استعارة الجري من غير إضافة «في السباق»، لأنها غير مذكورة صراحة.
- source_word: καλῶς
  choice: حسنًا
  rationale: حال يصف كيفية الجري، وهو تعبير عربي واضح وطبيعي يفيد أنهم كانوا يتقدمون على الوجه الصحيح.
- source_word: τίς
  choice: مَن
  rationale: اسم استفهام عن شخص، كما يدل السياق.
- source_word: ἐνέκοψεν
  choice: أعاقكم
  rationale: ينقل معنى العرقلة والمنع بوضوح، مع بقاء صلته المفهومة بصورة عدّاء يعترضه عائق.
- source_word: τῇ ἀληθείᾳ
  choice: الحق
  rationale: يحافظ على أداة التعريف وعلى الإشارة المرجحة إلى حق البشارة الذي سبق أن قبلوه.
- source_word: μὴ πείθεσθαι
  choice: عن طاعة
  rationale: يفيد الفعل هنا الاستجابة للحق والانقياد له، وصياغة «أعاقكم عن طاعة» عربية طبيعية؛ أما معنى الاقتناع فمحفوظ في الحاشية.
theological_decisions:
- issue: دلالة πείθεσθαι مع τῇ ἀληθείᾳ
  choice: طاعة الحق
  alternative: الاقتناع بالحق
  rationale: يركز السياق على استجابة الغلاطيين العملية للحق وانحرافهم عنه، ولذلك تلائم «طاعة الحق» السياق. ولأن الفعل يمكن أيضًا أن يدل على الاقتناع أو التأثر بالإقناع، لم يُستبعد هذا الوجه بل أُثبت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على استعارة الجري، وتُجنبت إضافة كلمة «السباق» غير الصريحة في الأصل.
