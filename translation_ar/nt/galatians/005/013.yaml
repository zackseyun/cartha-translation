  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: ar
  text: فأنتم دُعيتم إلى الحرية، أيها الإخوة[a]؛ غير أنه لا تجعلوا الحرية فرصةً للجسد[b]، بل بالمحبة اخدموا[c] بعضكم بعضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: صيغة «الإخوة» في اليونانية مذكّرة جمعًا، وهي في هذا الخطاب موجّهة إلى جماعة المؤمنين كلها، بمن فيهم النساء.
    reason: lexical_alternative
  - marker: b
    text: 'ليس «الجسد» هنا مجرد البدن، بل يشير إلى الميول البشرية الساقطة والرغبات المنحرفة؛ ويمكن أن تُشرح العبارة: «لا تجعلوا الحرية ذريعةً للرغبات الخاطئة».'
    reason: alternative_reading
  - marker: c
    text: الفعل المترجم «اخدموا» مرتبط بلفظ «العبد» في اليونانية، ويحمل معنى تكريس الذات لخدمة الآخرين؛ فتظهر مفارقة مقصودة بين الحرية وخدمة بعضكم بعضًا بالمحبة.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς γὰρ
  choice: لأنكم أنتم
  rationale: تفيد «γὰρ» تعليل ما سبق، ويُبرز الضمير المنفصل «أنتم» حضور الضمير اليوناني الصريح من غير مبالغة في توكيده.
- source_word: ἐπ’ ἐλευθερίᾳ ἐκλήθητε
  choice: دُعيتم إلى الحرية
  rationale: تحفظ صيغة المبني للمجهول في «ἐκλήθητε»، وتعبّر «إلى الحرية» طبيعيًا عن الغاية أو الحالة التي وُجّهت إليها الدعوة.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحفظ اللفظ المذكر الجمع في اليونانية وصيغة النداء الرسائلية، مع بيان شموله لجماعة المؤمنين كلها في الحاشية.
- source_word: μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί
  choice: ولكن لا تجعلوا الحرية فرصةً للجسد
  rationale: يقتضي التركيب اليوناني فعلًا محذوفًا يُفهم من السياق؛ و«لا تجعلوا» يستكمله بوضوح. أما «فرصة» فتحفظ معنى المنطلق أو المناسبة الذي تحمله «ἀφορμή».
- source_word: σάρξ
  choice: الجسد
  rationale: يحفظ المصطلح البولسي وصورته المقصودة بدل اختزاله تفسيريًا في «الطبيعة الخاطئة»، مع توضيح دلالته الأخلاقية في الحاشية.
- source_word: διὰ τῆς ἀγάπης
  choice: بالمحبة
  rationale: الباء العربية تؤدي المعنى الوسيلي لـ«διά» مع المضاف إليه، في أسلوب عربي طبيعي وموجز.
- source_word: δουλεύετε ἀλλήλοις
  choice: اخدموا بعضكم بعضًا
  rationale: «اخدموا» هي العبارة العربية الطبيعية في الوصية المتبادلة، مع إبراز صلة الفعل بخدمة العبد في الحاشية حتى لا تضيع قوة الصورة اليونانية.
theological_decisions:
- issue: مدلول «ἀδελφοί» عند مخاطبة جماعة مختلطة
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: يحافظ المتن على الصيغة المذكرة في الأصل، من غير إنكار أن هذا النداء الرسائلي يشمل النساء أيضًا؛ ويُبيَّن الشمول في الحاشية.
- issue: دلالة «σάρξ» في السياق الأخلاقي البولسي
  choice: الجسد
  alternative: الطبيعة الخاطئة
  rationale: لا يقتصر اللفظ هنا على البدن المادي، لكن ترجمته بتفسير عقائدي واحد قد تمحو اتساع الصورة والتوتر القائم بين الحرية والجسد؛ لذلك حُفظ المصطلح وشُرح.
- issue: قوة صورة العبودية في «δουλεύετε»
  choice: اخدموا بعضكم بعضًا
  alternative: استعبدوا أنفسكم بعضكم لبعض
  rationale: تحقق الصياغة المختارة وضوح الوصية وطبيعية العربية، بينما تحفظ الحاشية المفارقة البلاغية بين الحرية وخدمة العبد من دون إيحاء قسري غير مقصود.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة رسائلية كريمة. حُفظت مصطلحات «الحرية» و«الجسد» و«المحبة»، واستُخدمت صياغة عربية طبيعية لإكمال الفعل المفهوم ضمنًا في العبارة اليونانية. وُضعت جميع علامات الحواشي [a] و[b] و[c] في المتن.
