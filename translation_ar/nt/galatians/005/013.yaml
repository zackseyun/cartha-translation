  rationale: تُبقي المراجعة مصطلحات المسودة الأساسية ومعنى الأصل، لكنها تستبدل «ولكن» بـ«غير أنه» لتمثيل القيد الذي تفيده μόνον، وتستعمل «فأنتم» لتقديم وصل γάρ وإبراز الضمير من غير ثقل، وتقدّم «بالمحبة» وفق ترتيب الأصل. كما تُنقل علامة الحاشية الخاصة بالفعل إلى «اخدموا»، وتُصاغ حاشية «الجسد» بصيغة توضيحية غير اختزالية.
