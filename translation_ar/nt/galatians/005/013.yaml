review_pass:
  verdict: revise
  source_fidelity: 'المعنى الرئيس محفوظ: الدعوة إلى الحرية، والتحذير من جعلها منطلقًا للجسد، ثم الأمر بالخدمة المتبادلة بالمحبة. لكن «لأنكم أنتم» تثقل الافتتاح وتحوّل γάρ إلى تعليل مباشر أقوى من اللازم في العربية؛ و«ولكن» لا تمثل μόνον على نحو دقيق، إذ هي أداة تقييد («غير أن/فقط لا»)، لا مقابلة مع ما قبلها. كما أن موضع الحاشية المتعلقة بالخدمة ينبغي أن يكون عند «اخدموا»، لا عند «بالمحبة».'
  naturalness: 'الصياغة مفهومة وفصيحة عمومًا. والأكثر سلاسة ودقة في الأسلوب الرسائلي المعاصر: «فأنتم دُعيتم إلى الحرية...» و«غير أنه لا تجعلوا...». وتقديم «بالمحبة» قبل «اخدموا» يطابق ترتيب العبارة اليونانية ويجعل مرجع الحاشية واضحًا.'
  terminology: «الحرية»، «الإخوة»، «الجسد»، و«المحبة» اختيارات سليمة وتحفظ المصطلحات المحورية. «اخدموا بعضكم بعضًا» اختيار طبيعي لـ δουλεύετε ἀλλήλοις، مع بيان إيحاء العبودية في الحاشية. ينبغي تجنب وصف «الجسد» بأنه «الإنسان من جهة...» بوصفه تعريفًا حصريًا؛ فالأصل يترك الصورة أوسع، والأدق القول إنه يشير إلى الميول البشرية الساقطة لا إلى البدن وحده.
  issues:
  - severity: medium
    issue: تمثيل μόνον بـ«ولكن»
    rationale: 'μόνον هنا أداة قيد وتحذير: «فقط/غير أن لا»، وليست أداة استدراك مقابِلًا لما قبلها. «غير أنه لا...» يحفظ الوظيفة النحوية والمعنى.'
  - severity: low
    issue: الافتتاح «لأنكم أنتم»
    rationale: يجمع بين تعليل عربي قوي وتوكيد ثقيل. γάρ وصلي تفسيري في السياق، والضمير اليوناني صريح للتوكيد، لكن «فأنتم» أنسب وأخف مع بقاء الأثر.
  - severity: medium
    issue: مرساة الحاشية [c]
    rationale: الحاشية تشرح الفعل «اخدموا»، لكن علامتها موضوعة بعد «بالمحبة». يلزم وضعها بعد «اخدموا» لتطابق المرساة مع المشروح.
  - severity: low
    issue: صياغة شرح «الجسد» في الحاشية
    rationale: عبارة «بل الإنسان من جهة...» قد تبدو تعريفًا نظريًا حصريًا. الأفضل توضيح أن المراد لا يقتصر على البدن بل يشمل الميول البشرية الساقطة والرغبات المنحرفة، من دون اختزال المصطلح.
