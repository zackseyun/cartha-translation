  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: ar
  text: قليلٌ من الخميرة يُخمِّر العجين كلَّه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خميرة قليلة تُخمِّر كتلة العجين كلَّها».'
    reason: بديل معجمي يحافظ على الدلالة الأقرب لـ φύραμα بوصفه كتلةً من العجين.
lexical_decisions:
- source_word: μικρὰ
  choice: قليلٌ من
  rationale: تفيد الصفة هنا مقدارًا صغيرًا من الخميرة، وصياغة «قليل من» عربية طبيعية تحافظ على الإيجاز المَثَلي.
- source_word: ζύμη
  choice: الخميرة
  rationale: تشير إلى مادة التخمير المستعملة في العجين. «الخميرة» واضحة في العربية المعاصرة وتحفظ الصورة الحسية والاستعمال الكتابي المجازي.
- source_word: ὅλον
  choice: كلَّه
  rationale: تنقل شمول أثر الخميرة في كامل العجين، مع عود الضمير بوضوح إلى «العجين».
- source_word: φύραμα
  choice: العجين
  rationale: يدل اللفظ على كتلة العجين المخلوطة أو المعجونة. «العجين» هو المقابل العربي الطبيعي الواضح، من غير إدخال معنى تفسيري زائد.
- source_word: ζυμοῖ
  choice: يُخمِّر
  rationale: مقابل مباشر للفعل بمعنى يجعل العجين مختمرًا، ويحافظ على التوازي اللفظي الموجز بين «الخميرة» و«يخمّر».
theological_decisions:
- issue: القوة المجازية للمثل
  choice: الإبقاء على الصورة المحسوسة للخميرة والعجين من غير التصريح بتطبيقها الضمني.
  alternative: قليل من التعليم الباطل ينتشر في الجماعة كلها.
  rationale: الآية نفسها تسوق مثلًا موجزًا ولا تشرح المقصود منه صراحة؛ لذلك يحفظ إبقاء الصورة توتر النص وقوته البلاغية، ويتجنب إدخال تفسير السياق في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة ذات نبرة مَثَلية كريمة. استُعملت «الخميرة» بدل لفظ تقليدي أقل تداولًا، وحُفظت الصورة الأصلية من دون شرح زائد.
