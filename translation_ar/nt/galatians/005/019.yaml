  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: ar
  text: 'أمّا أعمال الجسد[a] فظاهرة، وهي: الفجور الجنسي، والنجاسة، والتهتّك،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الطبيعة الخاطئة». الكلمة اليونانية هي «الجسد» (σάρξ)، ويستعملها بولس هنا استعمالًا مجازيًّا للدلالة على ميول الإنسان الساقط وتوجّهه.
    reason: alternative_reading
lexical_decisions:
- source_word: φανερὰ
  choice: ظاهرة
  rationale: تفيد الكلمة ما هو بيّن ومكشوف للعيان، و«ظاهرة» تعبير عربي واضح وطبيعي يحفظ هذا المعنى.
- source_word: δέ
  choice: أمّا... فـ
  rationale: تشير δέ إلى انتقال أو مقابلة خفيفة مع الكلام السابق؛ وينقل تركيب «أمّا... فـ» هذا الدور في العربية من غير المبالغة في معنى الاستدراك.
- source_word: τὰ ἔργα
  choice: أعمال
  rationale: تحفظ «أعمال» الصلة اللفظية والدلالية بين الأفعال الناتجة عن الجسد و«ثمر الروح» في السياق اللاحق.
- source_word: τῆς σαρκός
  choice: الجسد
  rationale: يحفظ اللفظ استعارة بولس والتوتر اللاهوتي في المقابلة بين الجسد والروح، بدل اختزال المعنى في تفسير واحد.
- source_word: ἅτινά ἐστιν
  choice: 'وهي:'
  rationale: يقدّم هذا التركيب القائمة الآتية بصورة طبيعية، مع الحفاظ على معنى «وهي» التعريفي.
- source_word: πορνεία
  choice: الفجور الجنسي
  rationale: يدل اللفظ على السلوك الجنسي غير المشروع بوجه عام؛ وهذا التعبير أوضح وأوسع من «الزنى» الذي قد يُفهم بمعنى أضيق.
- source_word: ἀκαθαρσία
  choice: النجاسة
  rationale: تنقل المعنى الأخلاقي لعدم الطهارة، وهي مألوفة في العربية الكتابية مع بقائها مفهومة للقارئ المعاصر.
- source_word: ἀσέλγεια
  choice: التهتّك
  rationale: يفيد اللفظ الانغماس الوقح والمنفلت في الشهوات، ولا سيما في المجال الجنسي؛ و«التهتّك» يحفظ معنى الوقاحة والانفلات.
theological_decisions:
- issue: ترجمة σάρξ في سياق بولسي أخلاقي
  choice: الجسد
  alternative: الطبيعة الخاطئة
  rationale: المقابلة بين الجسد والروح محورية في السياق. يحفظ «الجسد» استعارة بولس ولا يحصرها في شرح لاهوتي واحد، مع ذكر القراءة التفسيرية البديلة في الحاشية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُخدم تركيب «أمّا... فـ» لإبراز الانتقال والمقابلة الخفيفة، وأُبقيت الفاصلة الأخيرة لأن قائمة أعمال الجسد تستمر في الآيات التالية.
