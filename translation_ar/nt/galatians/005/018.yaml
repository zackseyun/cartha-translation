lexical_decisions:
- source_word: εἰ
  choice: إن كان
  rationale: تُدخل جملة شرطية، وصياغة «إن كان... يقودكم» عربية طبيعية وتحفظ معنى الشرط.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد مقابلة لطيفة مع سياق أعمال الجسد وقيادة الروح.
- source_word: πνεύματι
  choice: الروح
  rationale: تشير في سياق غلاطية 5 إلى الروح القدس، وتسمح العربية بذكر «الروح» من غير إضافة تفسيرية داخل النص.
- source_word: ἄγεσθε
  choice: يقودكم
  rationale: ينقل معنى المضارع المبني للمجهول من حيث كون الروح هو القائد، بصياغة عربية واضحة وطبيعية؛ وتوضح الحاشية إمكان إبراز الاستمرار.
- source_word: οὐκ ἐστὲ
  choice: فلستم
  rationale: صياغة عربية موجزة ومباشرة للنفي مع ربط جواب الشرط بالفاء.
- source_word: ὑπὸ νόμον
  choice: تحت الشريعة
  rationale: يحفظ الاستعارة المكانية في التعبير اليوناني، وتشير «الشريعة» في السياق إلى شريعة موسى بوصفها سلطانًا أو نظامًا حاكمًا.
theological_decisions:
- issue: مرجع πνεύματι
  choice: الروح القدس
  alternative: روح الإنسان
  rationale: المقابلة المتكررة في غلاطية 5 بين الجسد والروح تدل على الروح الإلهي، من غير حاجة إلى إدخال لفظ «القدس» تفسيرًا في متن الآية.
- issue: دلالة ὑπὸ νόμον
  choice: الخضوع لسلطان الشريعة أو ولايتها
  alternative: الخضوع لقانون بمعنى عام
  rationale: يشير التعبير في سياق غلاطية إلى شريعة موسى بوصفها نظامًا حاكمًا، مع إبقاء العبارة المجازية الموجزة في المتن وعدم توسيعها إلى تقرير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «الشريعة» للدلالة السياقية على شريعة موسى، وحُفظت صورة «تحت الشريعة». وُضعت علامتا الحاشيتين في المتن، مع ترتيب منطقي بحسب موضع ظهورهما.
