  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: ar
  text: فَإِنَّنَا، بِالرُّوحِ[a] وَمِنَ الْإِيمَانِ[b]، نَنْتَظِرُ بِشَوْقٍ رَجَاءَ الْبِرِّ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الروح». يمكن أن تدل صيغة πνεύματι على الوسيلة («بالروح») أو على المجال («في الروح»).'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «على أساس الإيمان». حرفيًا: «من الإيمان». وقد تُفهم πίστις في بعض السياقات بمعنى «الثقة» أو «الأمانة».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «العدل». ويمكن أن يُفهم «رجاء البر» أيضًا بمعنى «البر المرجو»، من غير أن تحسم العبارة اليونانية العلاقة على نحو كامل.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: إِنَّنَا نَحْنُ
  rationale: يُظهر الضمير المنفصل «نحن» ما في الضمير اليوناني الصريح والمتقدم من توكيد ومقابلة، مع صياغة عربية مفهومة.
- source_word: γὰρ
  choice: فَإِنَّ
  rationale: أداة تفسير وتعليل تربط هذه الجملة بما قبلها، و«فإن» تلائم مسار الحجة في العربية.
- source_word: πνεύματι
  choice: بِالرُّوحِ
  rationale: تحافظ الباء على المعنى الأداتي المرجح، أي بعمل الروح، مع إبقاء معنى المجال «في الروح» احتمالًا مذكورًا في الحاشية.
- source_word: ἐκ πίστεως
  choice: عَلَى أَسَاسِ الْإِيمَانِ
  rationale: تنقل قوة ἐκ الدالة على المصدر أو الأساس بصورة عربية طبيعية، من غير اختزالها في أداة قد تلتبس مع πνεύματι.
- source_word: ἐλπίδα
  choice: رَجَاءَ
  rationale: مفعول الفعل، و«الرجاء» هو المقابل العربي الطبيعي لتوقع الخير المنتظر.
- source_word: δικαιοσύνης
  choice: الْبِرِّ
  rationale: «البر» هو المقابل الأشيع والأوفق في سياق بولس، مع إثبات احتمال «العدل» في الحاشية.
- source_word: ἀπεκδεχόμεθα
  choice: نَنْتَظِرُ بِشَوْقٍ
  rationale: يعبّر عن الانتظار المصحوب بالتطلع والترقب، لا عن مجرد الانتظار المحايد.
theological_decisions:
- issue: مرجع πνεύματι
  choice: الروح القدس، مع التعبير عنه بـ«الروح»
  alternative: روح الإنسان
  rationale: سياق غلاطية 5، ولا سيما المقابلة بين الروح والجسد، يرجح بوضوح الإشارة إلى روح الله، من غير إضافة كلمة «القدس» غير الموجودة صراحة في الآية.
- issue: وظيفة حالة الجر في πνεύματι
  choice: 'المعنى الأداتي: «بالروح»'
  alternative: 'معنى المجال: «في الروح»'
  rationale: المعنى الأداتي مرجح في السياق، لكن اليونانية تسمح بفهم العبارة على أنها مجال الوجود أو العمل؛ لذلك حُفظ البديل في حاشية.
- issue: معنى ἐλπίδα δικαιοσύνης
  choice: «رجاء البر» مع إبقاء علاقة المضاف بالمضاف إليه مفتوحة
  alternative: «البر المرجو» أو «الرجاء الناتج من البر»
  rationale: الصياغة القريبة من اليونانية تحفظ التوتر بين كون البر مضمون الرجاء وكونه مرتبطًا به على وجه آخر، ولا تفرض تفسيرًا أخرويًا مفصلًا داخل المتن.
- issue: مدلول πίστις
  choice: الإيمان
  alternative: الأمانة أو الثقة
  rationale: «الإيمان» هو المعنى الأنسب في هذا السياق البولسي، مع الاعتراف في الحاشية بأن اللفظة قد تدل بحسب السياق على الثقة أو الأمانة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. أُبقي توكيد «نحن»، واستُعمل «على أساس الإيمان» لتأدية معنى ἐκ بصورة طبيعية، مع الحفاظ في الحواشي على البدائل المعجمية والنحوية الحقيقية.
