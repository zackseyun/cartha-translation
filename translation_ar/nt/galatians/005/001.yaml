source:
  edition: SBLGNT
  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: ar
  text: لِلْحُرِّيَّةِ حَرَّرَنَا الْمَسِيحُ[a]؛ فَاثْبُتُوا إِذًا، وَلَا تَخْضَعُوا مِنْ جَدِيدٍ لِنِيرِ الْعُبُودِيَّةِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الحرية حرَّرنا المسيح». العبارة الافتتاحية في اليونانية موجزة، ويمكن فهمها على أكثر من وجه متقارب.'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا ترجمة الفعل: «ولا تكونوا من جديد تحت نير العبودية» أو «ولا تقعوا من جديد تحت نير العبودية». يحمل الفعل معنى الخضوع لشيء أو الوقوع في قبضته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: لِلْحُرِّيَّةِ
  rationale: تحفظ لام الغاية إيجاز العبارة اليونانية وتوكيدها، مع إبقاء احتمال فهم الداتيف بمعنى المجال أو الحالة في الحاشية.
- source_word: Χριστὸς
  choice: الْمَسِيحُ
  rationale: ترجمة اللقب بمعناه العربي المألوف تحفظ دلالته المسيانية بدل معاملته كاسم منقول صوتيًا.
- source_word: ἠλευθέρωσεν
  choice: حَرَّرَنَا
  rationale: ينقل معنى الإعتاق بوضوح، ويحافظ مع «الحرية» على التجانس الاشتقاقي والقوة البلاغية في الأصل.
- source_word: στήκετε
  choice: فَاثْبُتُوا
  rationale: صيغة أمر عربية طبيعية تدل على مواصلة الثبات والرسوخ.
- source_word: οὖν
  choice: إِذًا
  rationale: تُظهر أن الوصية نتيجة مترتبة على إعلان التحرير السابق.
- source_word: πάλιν
  choice: مِنْ جَدِيدٍ
  rationale: تدل بوضوح على الرجوع إلى حالة سابقة.
- source_word: ζυγῷ δουλείας
  choice: لِنِيرِ الْعُبُودِيَّةِ
  rationale: تحفظ صورة النير المجازية والمعنى القوي للعبودية والخضوع.
- source_word: ἐνέχεσθε
  choice: تَخْضَعُوا
  rationale: ينقل في السياق معنى الوقوع تحت سلطان شيء أو الارتباط به، ويتلاءم طبيعيًا مع صورة النير، مع بيان البديل التصويري في الحاشية.
theological_decisions:
- issue: هل يُترجم Χριστός بوصفه لقبًا أم يُعامل كصيغة اسمية منقولة؟
  choice: الْمَسِيحُ
  alternative: كريستوس / المسيح بوصفه اسمًا مجردًا من دلالة اللقب
  rationale: اللفظ اليوناني يحمل هنا دلالة اللقب المسياني؛ و«المسيح» هو المقابل العربي الدلالي الطبيعي من غير إضافة تفسير مذهبي.
- issue: قوة معنى δουλεία
  choice: الْعُبُودِيَّةِ
  alternative: الرِّقّ / الاستعباد
  rationale: «العبودية» تقابل الحرية مباشرة وتحفظ ثقل الصورة اللاهوتي والاجتماعي من غير تضييقها على مؤسسة قانونية بعينها.
- issue: دلالة الداتيف الافتتاحي τῇ ἐλευθερίᾳ
  choice: لِلْحُرِّيَّةِ
  alternative: فِي الْحُرِّيَّةِ
  rationale: قراءة الغاية أو النتيجة هي الأرجح بلاغيًا، لكن تركيب الأصل موجز ويحتمل معنى المجال أو الحالة؛ لذلك حُفظ البديل في الحاشية بدل حسمه ضمنيًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ التوازي الاشتقاقي بين «الحرية» و«حررنا»، وكذلك استعارة «نير العبودية». وُضعت الحركات الجزئية/الكاملة لتيسير القراءة من غير استعمال ألفاظ كنسية غامضة أو تعبيرات قديمة.
