source:
  edition: SBLGNT
  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: ar
  text: 'لِأَنَّ النَّامُوسَ كُلَّهُ قَدْ تَمَّ فِي قَوْلٍ وَاحِدٍ: «أَحِبَّ قَرِيبَكَ كَنَفْسِكَ».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في كلمة واحدة». يمكن أن تعني الكلمة اليونانية «كلمة» أو «قولًا»، والمقصود هنا قول أو وصية واحدة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قد أُكمِل» أو «قد تحقَّق تمامه». الفعل اليوناني تامٌّ مبنيٌّ للمجهول، ويفيد حالةً حاضرة ناتجة من تمام التحقّق. وقد يُفهَم أيضًا أن غاية الناموس تبلغ تمامها في هذه الوصية، لا أنه يُلخَّص فيها فحسب.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: لِأَنَّ
  rationale: تُدخِل γάρ تعليلًا أو تفسيرًا لما سبق، و«لأنَّ» تؤدي هذا الربط بوضوح وإيجاز.
- source_word: πᾶς νόμος
  choice: النَّامُوسَ كُلَّهُ
  rationale: تحافظ العبارة على شمول πᾶς وعلى الإشارة إلى الناموس بوصفه كُلًّا واحدًا.
- source_word: ἐν ἑνὶ λόγῳ
  choice: فِي قَوْلٍ وَاحِدٍ
  rationale: يمكن أن تعني λόγος كلمة أو قولًا؛ و«قول» أوضح هنا لأن ما يلي وصية كاملة لا لفظة مفردة.
- source_word: πεπλήρωται
  choice: قَدْ تَمَّ
  rationale: تنقل صيغة التام المبني للمجهول اليونانية معنى بلوغ الناموس تمامه مع بقاء أثر ذلك، من غير اختزال المعنى إلى مجرد التلخيص.
- source_word: ἐν τῷ
  choice: النقطتان بعد «قول واحد»
  rationale: تقدمان مضمون القول في العربية بصورة طبيعية بدل تكرار حرف الجر.
- source_word: Ἀγαπήσεις
  choice: أَحِبَّ
  rationale: المستقبل اليوناني في الاقتباس يؤدي وظيفة الأمر؛ وصيغة الأمر العربية واضحة وطبيعية وتحفظ قوة الوصية.
- source_word: τὸν πλησίον σου
  choice: قَرِيبَكَ
  rationale: «قريبك» المقابل الكتابي العربي الطبيعي للمقصود الأخلاقي من πλησίον، أي الإنسان الذي يعامله المرء بوصفه قريبًا له.
- source_word: ὡς σεαυτόν
  choice: كَنَفْسِكَ
  rationale: تنقل المقارنة بإيجاز ودقة، وهي صياغة عربية مستقرة ومفهومة.
theological_decisions:
- issue: دلالة علاقة الناموس بوصية محبة القريب
  choice: يبلغ الناموس كله تمامه في وصية محبة القريب.
  alternative: الناموس كله مُلخَّص في هذه الوصية.
  rationale: الفعل πληρόω أقوى من مجرد «يُلخَّص»، لذلك حُفظ معنى التمام من غير استنتاج حكم عقائدي أوسع عن إبطال الناموس أو قصره على قسم بعينه.
- issue: القيمة الزمنية لصيغة πεπλήρωται
  choice: قَدْ تَمَّ
  alternative: يَتِمُّ
  rationale: «قد تم» تُبرز حالة حاضرة ناتجة من تمام تحقق، بما يلائم صيغة التام اليونانية، مع التنبيه في الحاشية إلى إمكان الصياغة العربية الحاضرة.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية وقورة. استُعمل «الناموس» محافظةً على المصطلح البولسي المألوف، و«قول» لتجنب الإيهام بأن الاقتباس لفظة واحدة. وُضعت علامتا الحاشيتين في المتن كما طُلب.
