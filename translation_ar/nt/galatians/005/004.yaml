base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: ar
  text: أنتم الذين تطلبون أن تُبرَّروا بالناموس، قد انقطعتم عن المسيح[a]؛ وسقطتم من النعمة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد تعطَّلت صلتكم بالمسيح»، أو: «قد انفصلتم عن المسيح». ويمكن ترجمة العبارة السابقة ترجمة أكثر حرفية: «أنتم الذين تُبرَّرون بالناموس». والمقصود في السياق الذين يطلبون التبرير على أساس الناموس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθητε
  choice: قد انقطعتم
  rationale: يفيد الفعل مع ἀπό الانفصال عن المسيح أو زوال الصلة الفاعلة به. «انقطعتم» يحفظ حدة الصورة وعلاقتها من غير أن يضيف حكمًا لاهوتيًا يتجاوز النص.
- source_word: ἀπὸ Χριστοῦ
  choice: عن المسيح
  rationale: تدل ἀπό على الانفصال، و«المسيح» هو المقابل العربي الراسخ للقب Χριστός.
- source_word: οἵτινες
  choice: أنتم الذين
  rationale: يحدد الفعل جماعة المخاطبين الذين ينطبق عليهم الوصف، ويحفظ الخطاب المباشر بصياغة عربية طبيعية.
- source_word: ἐν νόμῳ
  choice: بالناموس
  rationale: تفيد العبارة الوسيلة أو الأساس الذي يُطلب عليه التبرير. واختيار «الناموس» واضح في سياق بولس ويحافظ على المصطلح الكتابي المألوف.
- source_word: δικαιοῦσθε
  choice: تطلبون أن تُبرَّروا
  rationale: الصيغة مضارع مبني للمجهول، ويمكن ترجمتها حرفيًا «تُبرَّرون». لكن السياق يبين أن بولس يخاطب من يعتمدون على الناموس طلبًا للتبرير؛ لذا تنقل هذه الصياغة قوة الحجة مع إبقاء التبرير مبنيًا للمجهول.
- source_word: τῆς χάριτος
  choice: من النعمة
  rationale: يتطلب ἐκπίπτω هنا متممًا يدل على ما حدث السقوط منه، والتعبير العربي «سقط من النعمة» موجز ويحفظ الاستعارة.
- source_word: ἐξεπέσατε
  choice: سقطتم
  rationale: يحفظ صورة السقوط في اليونانية وقوة صيغة الماضي، من غير شرح زائد مثل «تركتم طريق النعمة».
theological_decisions:
- issue: هل تحسم العبارة الجدل حول فقدان الخلاص أو تفسر النعمة بوصفها مبدأ فقط؟
  choice: 'الإبقاء على التحذير المباشر: «قد انقطعتم عن المسيح؛ وسقطتم من النعمة».'
  alternative: 'تخفيف العبارة إلى «اغتربتم عن المسيح»، أو تفسيرها: «تركتم طريق النعمة».'
  rationale: النص شديد ويحمل توترًا لاهوتيًا حقيقيًا. تحافظ الترجمة على صورتي الانفصال والسقوط من غير أن تفرض نتيجة مذهبية بشأن المصير النهائي أو تحصر «النعمة» في مبدأ مجرد.
- issue: 'دلالة δικαιοῦσθε: خبر واقع أم مسعى يدعيه المخاطبون؟'
  choice: «تطلبون أن تُبرَّروا» بحسب السياق الجدلي.
  alternative: «تُبرَّرون بالناموس» بوصفها ترجمة أكثر شكلية للمضارع المبني للمجهول.
  rationale: الترجمة المختارة لا تقر بأن الناموس يحقق التبرير، وهو ما يناقض حجة بولس المباشرة، بل تبين اعتماد المخاطبين عليه طلبًا لذلك. وتثبت القراءة الشكلية البديلة في الحاشية حفظًا لاحتمال الصيغة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «الناموس» للمصطلح البولسي νόμος، و«المسيح» للقب Χριστός. وُضعت علامة الحاشية [a] في المتن، وجُمعت فيها البدائل المتصلة بالفعلين والعبارة الجدلية دون إثقال الآية.
