lexical_decisions:
- source_word: ὄφελον
  choice: ليت
  rationale: أداة تمنٍّ عربية طبيعية وموجزة تنقل قوة التمني في اليونانية.
- source_word: καὶ
  choice: حتى
  rationale: 'تفيد هنا التصعيد البلاغي في سياق الختان: ليتهم يتمادون إلى ما هو أبعد منه، لا مجرد العطف البسيط.'
- source_word: ἀποκόψονται
  choice: يجدعوا أنفسهم
  rationale: ينقل الفعل معنى القطع والتشويه الجسدي، مع إبقاء التلميح السياقي إلى تجاوز الختان نحو الخصاء من غير حصر المتن في صياغة طبية صريحة.
- source_word: οἱ ἀναστατοῦντες
  choice: الذين يثيرون الاضطراب
  rationale: يعبّر بوضوح عن أشخاص يزعزعون الجماعة ويبلبلونها، لا عن مجرد إزعاج عابر.
- source_word: ὑμᾶς
  choice: بينكم
  rationale: صياغة عربية طبيعية مع «يثيرون الاضطراب»، وتحفظ الإشارة إلى المخاطَبين بصيغة الجمع.
theological_decisions:
- issue: دلالة أمنية بولس الحادة في سياق الختان
  choice: تُفهم بوصفها تمنيًا ساخرًا حادًا بأن يتمادى دعاة الختان في القطع حتى يجدعوا أنفسهم.
  alternative: أن يكون المعنى فقط أن يقطعوا أنفسهم عن الجماعة.
  rationale: سياق غلاطية 5 يدور مباشرة حول الختان، ولذلك يرجح التلاعب البلاغي بمعنى القطع والتشويه؛ لكن الحاشية تحفظ احتمال معنى الانفصال أو الاستئصال.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كريمة، مع الحفاظ على حدة العبارة الأصلية والتورية المرتبطة بالختان دون تهذيبها أو الإفراط في تخصيصها.
