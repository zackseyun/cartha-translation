  text: ليت الذين يبلبلونكم[b] يذهبون إلى حدّ تشويه أنفسهم[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أكثر حرفية: «يقطعون أنفسهم». وفي سياق الكلام عن الختان، يُرجَّح أن بولس يشير إلى التمادي إلى تشويه الأعضاء أو الخصاء.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الذين يثيرون الاضطراب بينكم».'
