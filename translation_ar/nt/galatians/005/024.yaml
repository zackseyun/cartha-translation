base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: ar
  text: وَأَمَّا الَّذِينَ يَنْتَمُونَ إِلَى الْمَسِيحِ، فَقَدْ صَلَبُوا الْجَسَدَ مَعَ أَهْوَائِهِ وَشَهَوَاتِهِ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وحرفيًا: «الذين هم للمسيح»، أي الذين يخصّونه أو ينتمون إليه.'
    reason: alternative_reading
  - marker: b
    text: يشير «الجسد» هنا إلى الطبيعة البشرية الساقطة حين تقاوم الروح؛ وتترجمه بعض الترجمات بـ«الطبيعة الخاطئة».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ τοῦ Χριστοῦ
  choice: وَأَمَّا الَّذِينَ يَنْتَمُونَ إِلَى الْمَسِيحِ
  rationale: تفيد أداة δέ انتقالًا مع شيء من المقابلة، فنُقلت بـ«وأما». ويدل التركيب الإضافي τοῦ Χριστοῦ على الانتماء إلى المسيح، فصيغ بعبارة عربية واضحة وطبيعية. ولفظ «المسيح» يحفظ اللقب اليوناني Χριστός في العربية.
- source_word: τὴν σάρκα
  choice: الْجَسَدَ
  rationale: أُبقيت صورة «الجسد» البولسية بدل تفسيرها داخل المتن بـ«الطبيعة الخاطئة»، حفاظًا على المصطلح وعلى التوتر القائم في السياق بين الجسد والروح.
- source_word: ἐσταύρωσαν
  choice: فَقَدْ صَلَبُوا
  rationale: يحمل الفعل اليوناني صورة الصلب صراحة، لذلك لم يُخفف إلى «أماتوا». وتفيد «قد» وقوع الفعل على نحو حاسم، من غير فرض قيمة زمنية أدق مما يتيحه الماضي اليوناني.
- source_word: σὺν τοῖς παθήμασιν
  choice: مَعَ أَهْوَائِهِ
  rationale: تفيد σύν المصاحبة. وفي هذا السياق الأخلاقي تشير παθήματα إلى الانفعالات أو الأهواء المرتبطة بالجسد، لا إلى الآلام بمعنى المعاناة.
- source_word: καὶ ταῖς ἐπιθυμίαις
  choice: وَشَهَوَاتِهِ
  rationale: تشير ἐπιθυμίαι إلى رغبات قوية ذات دلالة سلبية في السياق. و«شهوات» لفظ عربي مألوف لا يحصر المعنى بالضرورة في المجال الجنسي.
theological_decisions:
- issue: دلالة Χριστοῦ بوصفه لقبًا أو اسمًا
  choice: الْمَسِيحِ
  alternative: لا يوجد في العربية فرق لفظي معتاد بين «Messiah» و«Christ»، فكلاهما يُنقل عادةً بـ«المسيح».
  rationale: الترجمة العربية «المسيح» تحفظ اللقب المسياني، ولا تضطر إلى حسم ما إذا كان الاستعمال اليوناني هنا لقبيًا تمامًا أم صار قريبًا من الاسم العلم.
- issue: دلالة σάρξ في المقابلة الأخلاقية البولسية
  choice: الْجَسَدَ
  alternative: الطبيعة الخاطئة
  rationale: اختيار «الجسد» يحفظ مفردات بولس وصورتها اللاهوتية بدل إدخال تفسير محدد في صلب النص؛ ويُذكر المعنى التفسيري المحتمل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «وأما... فقد» لإظهار الانتقال والمقابلة الخفيفة اللذين تؤديهما δέ، مع إبقاء البنية موجزة. أُضيف ضمير المفرد في «أهوائه وشهواته» لبيان رجوعهما إلى الجسد كما يقتضيه السياق.
