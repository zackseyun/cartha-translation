  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: ar
  text: 'لكنني أقول: اسلكوا بالروح، ولن تنفّذوا أبدًا رغبة الجسد[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الطبيعة الخاطئة». اللفظة اليونانية هي «الجسد»، وقد تدل عند بولس على طبيعة الإنسان الساقطة حين تقاوم الروح.'
    reason: بيان المعنى البديل المحتمل مع الحفاظ على لفظ الأصل في المتن.
lexical_decisions:
- source_word: Λέγω δέ
  choice: لكنني أقول
  rationale: تنقل δέ بوصفها انتقالًا فيه مقابلة خفيفة، وتحافظ على صيغة بولس الخطابية من غير مبالغة في حدّة التعارض.
- source_word: πνεύματι
  choice: بالروح
  rationale: تحتمل صيغة المجرور اليونانية معنى الوسيلة أو المجال؛ و«بالروح» عربية موجزة وطبيعية، كما أن السياق يرجّح أن المقصود هو الروح القدس.
- source_word: περιπατεῖτε
  choice: اسلكوا
  rationale: تحافظ على استعارة المشي الدالة على نهج الحياة، وهي صياغة عربية مفهومة وراسخة من غير استبدال الصورة بتفسيرها.
- source_word: ἐπιθυμίαν
  choice: رغبة
  rationale: اللفظة اليونانية عامة في أصلها وقد تكون إيجابية أو سلبية بحسب السياق؛ و«رغبة» تحافظ على هذا الاتساع، بينما يبيّن ارتباطها بالجسد معناها السلبي هنا.
- source_word: σαρκὸς
  choice: الجسد
  rationale: تحافظ على مصطلح بولس وعلى التوتر القائم بين الجسد والروح، بدل اختزال اللفظة في تفسير واحد مثل «الطبيعة الخاطئة».
- source_word: οὐ μὴ τελέσητε
  choice: لن تنفّذوا أبدًا
  rationale: تنقل النفي اليوناني المؤكد، وتعبّر «تنفّذوا» عن إتمام الرغبة ووضعها موضع الفعل بوضوح في العربية المعاصرة.
theological_decisions:
- issue: مرجع πνεύματι
  choice: الروح القدس
  alternative: روح الإنسان أو مبدأ روحي عام
  rationale: المقابلة المتواصلة بين الروح والجسد في سياق غلاطية 5 ترجّح الإشارة إلى الروح القدس، مع إبقاء عبارة «بالروح» موجزة وقريبة من بنية الأصل.
- issue: دلالة σάρξ
  choice: الجسد
  alternative: الطبيعة الخاطئة
  rationale: للكلمة هنا دلالة أخلاقية سلبية في مقابل الروح، لكن إبقاء «الجسد» يحفظ فئة بولس اللاهوتية واتساعها ولا يحسمها بتعبير تفسيري واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. احتُفظ باستعارة السلوك وبمصطلح «الجسد»، وصيغ النفي بعبارة قوية وطبيعية تنقل توكيد الأصل.
