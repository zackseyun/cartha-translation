  text: ⸀φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν ⸀καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: ar
  text: 'الحسد، والسُّكر، والعربدة، وما أشبه ذلك. وأحذّركم من هذه الأمور، كما حذّرتكم من قبل: إن الذين يمارسون مثل هذه الأمور لن يرثوا ملكوت الله.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνοι
  choice: الحسد
  rationale: اسم جمع يدل على الاستياء من خير الآخرين وتمنّي زواله؛ وصيغة اسم الجنس العربية طبيعية وواضحة في تعداد الرذائل.
- source_word: μέθαι
  choice: السُّكر
  rationale: يدل على حالات الإفراط في شرب المسكر والوصول إلى الثمالة؛ و«السُّكر» تعبير عربي موجز ومألوف.
- source_word: κῶμοι
  choice: العربدة
  rationale: يدل على اللهو الصاخب المنفلت والاحتفال المفرط، وغالبًا ما يرتبط بالشرب؛ و«العربدة» تحفظ هذا المعنى من غير حصره في نشاط جنسي.
- source_word: τὰ ὅμοια τούτοις
  choice: ما أشبه ذلك
  rationale: صياغة عربية طبيعية تحفظ امتداد القائمة إلى رذائل مماثلة غير مذكورة بالاسم.
- source_word: ἃ προλέγω ὑμῖν
  choice: وأحذّركم من هذه الأمور
  rationale: يحمل προλέγω هنا قوة التحذير المسبق في سياق الوعظ الأخلاقي؛ والتصريح بالمرجع يزيل التثاقل التركيبي في العربية دون تغيير المعنى.
- source_word: καθὼς προεῖπον
  choice: كما حذّرتكم من قبل
  rationale: يشير الفعل إلى تحذير سابق، وتكرار «حذّرتكم» يحفظ الصلة البلاغية بالفعل السابق.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: الذين يمارسون مثل هذه الأمور
  rationale: «يمارسون» تنقل دلالة السلوك المتّصف بالاستمرار أو الاعتياد في اسم الفاعل المضارع، من غير جعل النص حكمًا صريحًا على زلّة منفردة.
- source_word: βασιλείαν θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي راسخ يحفظ المصطلح اللاهوتي وتميّزه.
- source_word: οὐ κληρονομήσουσιν
  choice: لن يرثوا
  rationale: ينقل مباشرة صورة الميراث وقوة النفي المستقبلية ذات البعد الأخروي.
theological_decisions:
- issue: هل يتناول التحذير أفعالًا منفردة أم نمطًا مستمرًا من السلوك؟
  choice: «الذين يمارسون مثل هذه الأمور»
  alternative: «الذين يفعلون مثل هذه الأمور»
  rationale: اسم الفاعل المضارع πράσσοντες في سياق تعداد الرذائل يرجّح السلوك المميّز أو المعتاد. وتحفظ «يمارسون» جدية التحذير من غير إضافة تقرير عقائدي عن كل سقطة منفردة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «العربدة» للدقة والإيجاز، وقُسّمت الجملة الطويلة بعلامة وقف ثم نقطتين كي يتضح انتقال الكلام من تعداد الرذائل إلى التحذير ونتيجته.
