  text: Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: ar
  text: 'ها أنا، بولس، أقول لكم: إن خضعتم للختان[a]، فلن ينفعكم المسيح[b] شيئًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن اختتنتم» أو «إن سمحتم بأن تُختنوا».'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: Χριστός، وهو لقب معناه «المسيح».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: 'انتبهوا:'
  rationale: أداة لتنبيه المخاطَبين وتشديد التحذير؛ و«انتبهوا» عربية معاصرة واضحة تحفظ القوة الخطابية.
- source_word: ἐγὼ Παῦλος
  choice: أنا بولس
  rationale: إثبات الضمير مع الاسم يحفظ توكيد بولس لهويته في العبارة اليونانية.
- source_word: λέγω ὑμῖν
  choice: أقول لكم
  rationale: نقل مباشر وطبيعي للفعل مع ضمير المخاطَبين.
- source_word: ἐὰν περιτέμνησθε
  choice: إن قبلتم الختان
  rationale: ينقل معنى الخضوع لإجراء الختان الذي تدل عليه الصيغة المبنية للمجهول، مع إبقاء البدائل الأقرب إلى البنية اليونانية في الحاشية.
- source_word: Χριστὸς
  choice: المسيح
  rationale: اللفظ العربي الطبيعي للقب Χριστός، ويحفظ دلالته المسيانية في هذا السياق.
- source_word: οὐδὲν ὠφελήσει
  choice: فلن ينفعكم ... شيئًا
  rationale: صياغة عربية واضحة تحفظ النفي الكلي وصيغة الاستقبال في اليونانية.
theological_decisions:
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: كريستوس/المسيح بوصفه اسمًا عَلَمًا
  rationale: يعمل اللفظ هنا بوصفه لقبًا ذا دلالة، و«المسيح» هو المقابل العربي الطبيعي الذي يحفظ هذه الدلالة.
- issue: مدى تحذير بولس بشأن الختان
  choice: إبقاء العبارة على قبول الختان في سياق حجة الرسالة دون توسيعها داخل المتن
  alternative: صياغتها كإدانة لكل ختان طبي أو عرقي في جميع الأحوال
  rationale: النص نفسه يطلق التحذير بصيغة موجزة، بينما يوضح السياق أن القضية هي اتخاذ الختان التزامًا دينيًا متعلقًا بالناموس؛ لذلك لا تُضاف قيود تفسيرية إلى المتن ولا يُوسَّع الحكم أبعد من الحجة السياقية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل الجمع في «انتبهوا» و«لكم» وفق المخاطَبين، وحُفظ توكيد «أنا بولس» والنفي المطلق في خاتمة الآية.
