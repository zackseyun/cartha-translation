source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: ar
  text: 'أَمَّا ثَمَرُ الرُّوحِ فَهُوَ: الْمَحَبَّةُ، وَالْفَرَحُ، وَالسَّلَامُ، وَالصَّبْرُ، وَاللُّطْفُ، وَالصَّلَاحُ، وَالْإِيمَانُ[a]،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الأمانة». يمكن أن تعني الكلمة اليونانية الإيمان أو الثقة أو الأمانة؛ وسياق تعداد الفضائل يسمح هنا بمعنى الاتصاف بالوفاء والجدارة بالثقة.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: أَمَّا
  rationale: تُبرز الانتقال التقابلي من أعمال الجسد في الآيات السابقة إلى ثمر الروح، بصياغة عربية طبيعية.
- source_word: καρπὸς
  choice: ثَمَرُ
  rationale: تحفظ الصورة المجازية وصيغة المفرد التي تعرض الفضائل بوصفها نتاجًا واحدًا مترابطًا.
- source_word: τοῦ πνεύματός
  choice: الرُّوحِ
  rationale: السياق المباشر في غلاطية 5 يشير إلى روح الله في مقابل الجسد؛ والتعريف في العربية يلائم هذا المرجع.
- source_word: ἀγάπη
  choice: الْمَحَبَّةُ
  rationale: المقابل العربي الواضح والمألوف الذي ينقل معنى المحبة دون تقييدها بنوع أضيق.
- source_word: χαρά
  choice: الْفَرَحُ
  rationale: مقابل موجز وطبيعي للفظ اليوناني في سياق تعداد الفضائل.
- source_word: εἰρήνη
  choice: السَّلَامُ
  rationale: يحفظ اتساع المعنى، بما فيه السلام الداخلي والعلاقات المسالمة، من غير تخصيص زائد.
- source_word: μακροθυμία
  choice: الصَّبْرُ
  rationale: لفظ عربي حديث وواضح يدل على طول الأناة واحتمال الاستفزاز، مع تجنب تعبيرات أثقل.
- source_word: χρηστότης
  choice: اللُّطْفُ
  rationale: ينقل المعاملة الرحيمة الكريمة المقصودة في تعداد الفضائل، ويميّزه عن الصلاح التالي.
- source_word: ἀγαθωσύνη
  choice: الصَّلَاحُ
  rationale: يعبر عن الجودة الخُلُقية وفعل الخير على نحو واسع وموجز.
- source_word: πίστις
  choice: الْإِيمَانُ
  rationale: يحفظ المقابل الأساسي للفظ πίστις، مع إبقاء معنى الأمانة الممكن سياقيًا في الحاشية بدل حسم الالتباس.
theological_decisions:
- issue: مرجع πνεῦμα
  choice: روح الله (الرُّوح)
  alternative: الروح البشرية
  rationale: المقابلة المباشرة مع الجسد في غلاطية 5 وسياق حث المؤمنين على السلوك بالروح يرجحان أن المقصود روح الله.
- issue: دلالة πίστις في تعداد الفضائل
  choice: الإيمان
  alternative: الأمانة
  rationale: يحتمل اللفظ اليوناني الإيمان والثقة والأمانة. أُبقي «الإيمان» في المتن بوصفه المقابل الأساسي، وحُفظت «الأمانة» في الحاشية لأن سياق الصفات الخُلُقية يجعلها احتمالًا قويًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظت استعارة «الثمر» وصيغة المفرد، واستُخدمت بنية «أمّا... فهو» لإظهار التقابل الطبيعي مع أعمال الجسد. وُضع التشكيل الكامل لرفع اللبس وتحسين قابلية القراءة.
