  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: ar
  text: أنا واثق في الرب من جهتكم أن لن يكون لكم رأي آخر[a]؛ أما الذي يُربككم فسيتحمّل الحكم، أيًّا كان[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لن تتبنّوا رأيًا آخر». قد يدل الفعل اليوناني على التفكير عمومًا، أو على اتخاذ توجّه أو رأي معيّن.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مهما يكن شخصه» أو «مَن يكن». يفيد التعبير اليوناني أن هوية هذا الشخص أو منزلته لا تغيّر الأمر.'
    reason: alternative_rendering
lexical_decisions:
- source_word: πέποιθα
  choice: أنا واثق
  rationale: الفعل في صيغة التام يدل هنا اصطلاحيًا على حالة راسخة من الثقة؛ و«أنا واثق» عربية طبيعية تحفظ قوته الحاضرة.
- source_word: εἰς ὑμᾶς
  choice: من جهتكم
  rationale: تبيّن العبارة أن ثقة بولس متجهة إلى المخاطَبين ومتعلقة باستجابتهم، من غير أن توحي بأنهم هم الأساس النهائي لهذه الثقة.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: تحفظ العبارة البولسية التي تشير إلى المجال أو الأساس الذي تقوم فيه الثقة، من غير حصرها في معنى سببي واحد.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: لن تفكّروا على نحو آخر
  rationale: يحفظ هذا التعبير النفي ومعنى φρονέω الواسع المتعلق بالتفكير أو التوجّه الذهني، بدل قصره في المتن على تبنّي رأي محدد.
- source_word: ὁ ταράσσων ὑμᾶς
  choice: الذي يزعجكم
  rationale: ينقل اسم الفاعل الحاضر الشخص الذي يحدث اضطرابًا قائمًا بينهم بلغة عربية واضحة ومباشرة.
- source_word: βαστάσει
  choice: فسيتحمّل
  rationale: يحفظ صورة حمل التبعة التي في βαστάζω، ويلائم مفعوله «الحكم» من غير تحديد مسبق لطبيعة العقوبة.
- source_word: τὸ κρίμα
  choice: الحكم
  rationale: «الحكم» يبقي مجال اللفظة مفتوحًا بين القضاء الصادر وتبعته، ولا يرفعها تلقائيًا إلى معنى الهلاك الأبدي.
- source_word: ὅστις ἐὰν ᾖ
  choice: أيًّا كان
  rationale: تؤدي قوة التركيب الموصولي غير المحدد، فتفيد أن هوية المزعج أو منزلته لا تغيّر الحكم عليه.
theological_decisions:
- issue: طبيعة ثقة بولس بشأن الغلاطيين
  choice: ثقة تتعلق بتوجّههم المقبل ومؤسَّسة في الرب
  alternative: يقين مطلق غير مشروط بثبات جميع الغلاطيين، أو مجرد تفاؤل شخصي
  rationale: يجمع النص بين ثقة بولس الصريحة وكونها «في الرب» وبين توقع مستقبلي بشأن تفكيرهم؛ لذلك تُحفظ هذه العناصر معًا من غير تحويلها إلى تقرير حتمي أو شعور بشري مجرد.
- issue: مدلول τὸ κρίμα
  choice: حكم يقع على مثير الاضطراب من غير تحديد نوعه النهائي
  alternative: دينونة أبدية حصرًا، أو مجرد عاقبة اجتماعية وتأديب كنسي
  rationale: اللفظة تحتمل الحكم أو القضاء وما ينشأ عنه، ولا يحدد العدد نفسه إن كان المقصود عقوبة أخروية أو صورة أخرى من القضاء.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة. استُعملت «من جهتكم» للمحافظة على توجّه الثقة نحو المخاطَبين، مع إبقاء أساسها «في الرب». وحُفظت سعة «الحكم» بدل تخصيصها بـ«الدينونة الأبدية»، كما حُفظ المعنى المفتوح لفعل التفكير في المتن وذُكر البديل الأدق سياقيًا في الحاشية.
