  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: ar
  text: وأشهد مرة أخرى لكل إنسان يختتن[a] أنه مُلزَم بأن يعمل بكل الشريعة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُختَن» أو «يدع نفسه يُختَن». تحتمل الصيغة اليونانية هذه التعبيرات المتقاربة، والسياق يتصل بمن يخضع للختان في هذا النزاع.'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًا: «إنه مدين بأن يعمل بكل الشريعة»، أي إنه واقع تحت الالتزام بإتمامها كلها. ويمكن ترجمة «يعمل» هنا: «يحفظ» أو «يمارس».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: أشهد
  rationale: تنقل معنى التصريح المؤكد والشهادة الشخصية بصياغة عربية واضحة ورصينة، من غير تحويلها تفسيريًا إلى «أحذّر».
- source_word: δὲ
  choice: الواو في «وأشهد»
  rationale: تفيد هنا الربط والاستمرار الخفيف مع الكلام السابق، ولا تستلزم مقابلة قوية تقتضي «لكن».
- source_word: πάλιν
  choice: أيضًا
  rationale: تفيد تجدد الشهادة وإضافتها إلى ما سبق. و«أيضًا» طبيعية هنا، مع إمكان فهم معنى التكرار الذي يحمله اللفظ اليوناني.
- source_word: παντὶ ἀνθρώπῳ
  choice: لكل إنسان
  rationale: تحافظ على الدلالة التوزيعية المفردة، وتنقل الاستعمال البشري العام للفظ ἄνθρωπος بوضوح في العربية.
- source_word: περιτεμνομένῳ
  choice: يقبل الختان
  rationale: المضارع الوصفي في السياق يشير إلى من يخضع للختان في هذا النزاع، لا إلى كل من كان مختونًا منذ الطفولة. والصياغة لا تضيف دافعًا غير مصرح به.
- source_word: ὀφειλέτης ἐστὶν
  choice: أنه مُلزَم
  rationale: ينقل المعنى المقصود، أي وقوع الشخص تحت التزام، من غير الإيحاء بدين مالي الذي قد ينشأ من الترجمة الحرفية «مدين».
- source_word: ὅλον τὸν νόμον
  choice: الشريعة كلها
  rationale: 'تحفظ التشديد على الشمول: الالتزام لا يقتصر على الختان بل يمتد إلى الشريعة بأسرها.'
- source_word: ποιῆσαι
  choice: بأن يعمل
  rationale: يحافظ على الفعل اليوناني العام «يفعل» في تركيب عربي طبيعي مع الشريعة. ويمكن توضيح معنى الحفظ والطاعة في الحاشية.
theological_decisions:
- issue: نطاق القول عن الختان والالتزام بالشريعة
  choice: المقصود كل من يقبل الختان في سياق النزاع الغلاطي، فيصبح ملتزمًا بالعمل بالشريعة كلها.
  alternative: أن يكون القول عامًا في كل ذكر مختون، بمن فيهم من خُتنوا في طفولتهم.
  rationale: سياق غلاطية 5:2-3 وصيغة اسم الفاعل περιτεμνομένῳ يرجحان الحديث عمن يخضع للختان بوصفه مطلبًا دينيًا في النزاع القائم، من غير أن يصرح النص نفسه بالدافع؛ لذلك أبقت الصياغة هذا القدر من الانفتاح.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «إنسان» للدلالة البشرية العامة، و«الشريعة» للمفرد اليوناني المعرّف νόμος في هذا السياق البولسي. أُبقيت نبرة الشهادة المؤكدة من غير زيادة لفظ مثل «أحذّر»، وحُفظ التوتر بين الصورة الحرفية «مدين» والمعنى السياقي «مُلزَم» في الحاشية.
