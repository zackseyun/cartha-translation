  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: ar
  text: إِنْ كُنَّا نَحْيَا بِالرُّوحِ، فَلْنَسْلُكْ أَيْضًا بِحَسَبِ الرُّوحِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن كنا نحيا في الروح، فلنساير الروح أيضًا خطوةً بخطوة»؛ ويمكن أن تُفهم صيغة «بالروح» بمعنى أن الروح مصدر الحياة وقوتها، أو أن الحياة تجري في نطاقه، والفعل الأخير يفيد السير في انتظام وموافقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: إِنْ
  rationale: تحافظ أداة الشرط العربية على صيغة العبارة اليونانية ومنطق الانتقال من واقع الحياة إلى الحث على السلوك، من غير تحويلها تفسيريًا إلى «بما أننا».
- source_word: ζῶμεν
  choice: كُنَّا نَحْيَا
  rationale: ينقل المضارع معنى الحياة المستمرة؛ وجاء تركيب «إن كنا نحيا» عربيًا طبيعيًا في الشرط، والمقصود في السياق حياة مصدرها الروح لا مجرد الوجود الجسدي.
- source_word: πνεύματι
  choice: بِالرُّوحِ
  rationale: تفيد الباء معنى الوسيلة أو المصدر، وهو ملائم لفكرة الحياة التي يهبها الروح. وتعيين «الروح» يفهم سياقيًا على أنه روح الله في مقابلة الجسد، مع بقاء الصياغة العربية دون إضافة لفظ «القدس» غير الموجود صراحة في اليونانية.
- source_word: καὶ
  choice: أَيْضًا
  rationale: تبرز المطابقة المقصودة بين الحياة بالروح والسلوك الموافق لها.
- source_word: στοιχῶμεν
  choice: فَلْنَسْلُكْ بِحَسَبِ
  rationale: صيغة الحث تُنقل بـ«فلنسلك». وإضافة «بحسب» توضح أن الفعل يعني السير في انتظام وموافقة لمعيار الروح، لا مجرد المشي، مع حفظ الصورة الأخلاقية الطبيعية في العربية.
theological_decisions:
- issue: مرجع πνεύματι
  choice: روح الله، مصوغًا «الروح»
  alternative: الروح البشرية
  rationale: المقابلة المتكررة بين الجسد والروح في غلاطية 5 ترجح بوضوح روح الله. لم تُضف كلمة «القدس» إلى المتن لأن الأصل يقول «الروح»، فتحافظ الصياغة على اقتصاد النص مع نقل دلالته السياقية.
- issue: دلالة στοιχῶμεν
  choice: السلوك بحسب الروح
  alternative: أن نساير الروح خطوة بخطوة / أن نسير في صف واحد مع الروح
  rationale: يحمل الفعل معنى الانتظام أو السير على نهج ومعيار. اختير تعبير عربي واضح وطبيعي، وأُبقي المعنى التصويري الأدق في الحاشية بدل حصر المتن في صورة واحدة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على الشرط وعلى تكرار «الروح»، واستعملت «فلنسلك» للحث الجماعي. وُضع البديل الأكثر تصويرًا، «نساير الروح خطوةً بخطوة»، في الحاشية لصون دقة στοιχέω من غير إثقال المتن.
