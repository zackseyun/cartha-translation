  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: ar
  text: ولكن إن يعضّ بعضكم بعضًا ويلتهم بعضكم بعضًا، فاحذروا لئلا يفني بعضكم بعضًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: ولكن إن كنتم
  rationale: تنقل «ولكن» التحول المقابل الذي تفيده δέ، وتدخل «إن» جملة الشرط؛ وإضافة «كنتم» تلائم العربية وتتيح إبراز الفعل الجاري من غير إثقال.
- source_word: ἀλλήλους
  choice: بعضكم بعضًا
  rationale: تعبير عربي فصيح واضح يحفظ معنى التبادل داخل الجماعة.
- source_word: δάκνετε
  choice: يعضّ بعضكم بعضًا
  rationale: يحفظ المعنى الحرفي والصورة الحيوانية العنيفة، كما يمكن للمضارع العربي أن يصور سلوكًا جاريًا أو معتادًا.
- source_word: κατεσθίετε
  choice: يلتهم بعضكم بعضًا
  rationale: «يلتهم» أقوى من مجرد الأكل، ويحفظ تصاعد الصورة من العض إلى الافتراس.
- source_word: βλέπετε
  choice: فاحذروا
  rationale: صيغة أمر طبيعية ومباشرة تنقل الدعوة الملحّة إلى الانتباه والاحتراز.
- source_word: μὴ
  choice: لئلا
  rationale: تؤدي معنى التحذير من نتيجة محتملة مع صيغة الفعل التابعة.
- source_word: ὑπ’ ἀλλήλων
  choice: بعضكم بعضًا
  rationale: بُني الفعل للمعلوم في العربية لأن المبني للمجهول مع بيان الفاعل ثقيل وغير طبيعي هنا، مع الحفاظ على الفاعلية المتبادلة كاملة.
- source_word: ἀναλωθῆτε
  choice: يُفني بعضكم بعضًا
  rationale: ينقل معنى الاستهلاك حتى النفاد أو الهلاك، ويحافظ على ذروة صورة الدمار المتبادل من دون مطابقته لفظيًا مع «يلتهم».
theological_decisions:
- issue: العنف المجازي داخل الجماعة المسيحية
  choice: 'الإبقاء على الصور الحيوانية الحرفية: العض والالتهام والإفناء.'
  alternative: إن كنتم تؤذون بعضكم بعضًا وتهلكون بعضكم بعضًا.
  rationale: بلاغة بولس متعمدة في حدتها، وتخفيفها إلى ألفاظ عامة عن الأذى أو النزاع يضعف التحذير من التدمير الذاتي للجماعة.
- issue: دلالة ἀναλωθῆτε بين الاستهلاك والهلاك
  choice: «يُفني بعضكم بعضًا» بوصفها نتيجة محتملة للتحذير.
  alternative: «يلتهم بعضكم بعضًا» أو «يهلك بعضكم بعضًا».
  rationale: «يفني» يجمع معنى الاستهلاك حتى النهاية والدمار، ويحفظ التمييز بين ἀναλίσκω وκατεσθίω من غير حسم زائد لطبيعة العاقبة.
translation_notes:
  register: 'عربية فصحى حديثة، واضحة ومهيبة. حُفظ توازي «بعضكم بعضًا» والتدرج البلاغي: يعضّ، يلتهم، يُفني. لم تُضف حاشية لأن البديل الوارد في طبقة الاستشارة الإنجليزية يعيد صياغة جملة التحذير نفسها ولا يمثل اختلافًا نصيًا أو معنىً ضروريًا يحتاجه القارئ العربي.'
