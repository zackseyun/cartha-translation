  verdict: revise
  source_fidelity: 'يحفظ النص المراجع الشرط المقترن بـ δέ، والتبادل في «ἀλλήλους»، والصور المتصاعدة: العضّ ثم الالتهام ثم الفناء. وصياغة النتيجة بالفعل المعلوم «يفني بعضكم بعضًا» عربية سليمة وتنقل عمليًا فاعلية ὑπ’ ἀλλήλων المتبادلة في المبني للمجهول اليوناني.'
  naturalness: 'في المسودة خلل نحوي في «إن كنتم يعضّ ... ويلتهم»: دخول «كنتم» يقتضي خبرًا مناسبًا، والفعلان الواردان بصيغة المفرد لا يطابقان المخاطبين الجمع. حذف «كنتم» يجعل الجملة شرطية فصيحة ومباشرة، ويستبقي دلالة المضارع.'
  terminology: «يعضّون»، «يلتهمون»، و«يفني» ألفاظ فصيحة حديثة تحافظ على الصورة الافتراسية والتدرج البلاغي من غير تلطيف أو تحميل تفسيري. ولا تحتاج الآية إلى حاشية؛ فبديل الحاشية الإنجليزية إعادة صياغة لا اختلاف نصي أو دلالة لازمة في العربية.
  issues:
