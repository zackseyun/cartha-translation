lexical_decisions:
- source_word: πραΰτης
  choice: الوداعة
  rationale: تدل الكلمة في سياق قائمة الفضائل على خُلُق هادئ متواضع غير عنيف. و«الوداعة» تعبير عربي فصيح ومألوف يحفظ قوتها الأخلاقية دون أن يوحي بالضعف.
- source_word: ἐγκράτεια
  choice: ضبط النفس
  rationale: تشير إلى السيطرة على الرغبات والنزعات؛ و«ضبط النفس» أوضح تعبير عربي معاصر وأوسع من «العفة» التي قد تُفهم في نطاق أضيق.
- source_word: κατὰ τῶν τοιούτων
  choice: ضد أمثال هذه
  rationale: يحافظ هذا التعبير على إحالة العبارة إلى الخصال المذكورة، مع إبقاء قدر من الاحتمال النحوي القائم في اليونانية، إذ يمكن أن يعود اللفظ من حيث الصيغة إلى الأشياء أو الأشخاص.
- source_word: νόμος
  choice: شريعة
  rationale: وردت νόμος بلا أداة تعريف، لذلك جاءت «شريعة» نكرة، بما يحفظ الطابع العام للقول ولا يحصره صراحة في شريعة موسى، مع بقاء تلك الخلفية حاضرة في سياق الرسالة.
theological_decisions:
- issue: نطاق معنى νόμος في قول بولس
  choice: «شريعة» بصيغة النكرة، في معنى عام
  alternative: «الشريعة» في إشارة مخصوصة إلى شريعة موسى
  rationale: 'مع أن جدال الرسالة يرتبط ارتباطًا وثيقًا بشريعة موسى، فإن غياب أداة التعريف في اليونانية يسمح بصياغة أعم: لا توجد شريعة تقف ضد هذه الخصال. وهكذا لا يُستبعد صدى شريعة موسى ولا يُجعل التحديد صريحًا أكثر مما يسمح به النص.'
- issue: مرجع τῶν τοιούτων
  choice: الخصال المذكورة بوصفها ثمر الروح
  alternative: الأشخاص الذين تتصف حياتهم بهذه الخصال
  rationale: السياق المباشر، وهو تعداد ثمر الروح، يرجح الإحالة إلى الخصال؛ لكن الصيغة اليونانية في ذاتها تحتمل أيضًا الإحالة إلى الأشخاص، ولذلك ذُكر الاحتمال في الحاشية.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة، تلائم كون الآية خاتمة قائمة. استُعملت «الوداعة» و«ضبط النفس» لرسوخ الأولى ووضوح الثانية، وحُفظت «شريعة» نكرة لتجنب حسم نطاق νόμος. أما «أمثال هذه» فتحيل طبيعيًا إلى الخصال السابقة من غير إضافة تفسيرية إلى المتن.
