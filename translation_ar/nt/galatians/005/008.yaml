lexical_decisions:
- source_word: πεισμονὴ
  choice: الإقناع
  rationale: اسم نادر يدل على الإقناع أو أثره وحالة الاقتناع. يحافظ «الإقناع» على الصيغة المجرّدة من غير توسيع تفسيري، مع إثبات البديل «التأثير» في الحاشية.
- source_word: ἐκ
  choice: من
  rationale: تفيد ἐκ المصدر أو المنشأ، و«من» هي المقابل العربي الطبيعي المباشر هنا.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: الذي يدعوكم
  rationale: اسم الفاعل المضارع مستعمل استعمالًا اسميًا، وهذه الصياغة تحفظ الفعل المستمر ولا تصرّح بأن الفاعل هو الله مع أن السياق يرجّح ذلك.
- source_word: οὐκ
  choice: ليس
  rationale: نفي مباشر صيغ مع الجملة الاسمية بالعربية صياغة طبيعية تحافظ على قوة الإنكار.
theological_decisions:
- issue: هوية «الذي يدعوكم»
  choice: إبقاء التعبير «الذي يدعوكم» من غير إضافة «الله».
  alternative: «الله الذي يدعوكم» كتوسيع تفسيري.
  rationale: يرجّح سياق غلاطية أن المقصود هو الله، لكن النص اليوناني لا يذكر اسم الله صراحة، بل يستخدم اسم فاعل معرّفًا؛ لذلك تُحفظ صياغة النص ويُترك تعيين المرجع للسياق.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. اختيرت صياغة رسمية طبيعية تحافظ على تجريد πεισμονή وعلى الغموض المقصود في هوية الداعي.
