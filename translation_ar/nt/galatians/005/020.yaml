lexical_decisions:
- source_word: εἰδωλολατρία
  choice: عبادة الأوثان
  rationale: تعبير واضح ودقيق يدل على عبادة الأصنام وخدمتها، ويحافظ على القوة الدينية والأخلاقية للمصطلح.
- source_word: φαρμακεία
  choice: السحر
  rationale: يدل المصطلح في سياق قائمة الرذائل على الممارسات السحرية، لا على استعمال الأدوية عمومًا. و«السحر» هو التعبير العربي الأوضح والأوسع تداولًا.
- source_word: ἔχθραι
  choice: العداوات
  rationale: صيغة الجمع تشير إلى حالات العداء ومظاهره المتكررة، و«العداوات» تنقل هذا المعنى بصورة طبيعية.
- source_word: ἔρις
  choice: الخصام
  rationale: يدل اللفظ على النزاع القائم على المشاحنة، و«الخصام» موجز وملائم لقائمة الرذائل.
- source_word: ζῆλος
  choice: الغيرة
  rationale: يقتضي السياق السلبي معنى الغيرة التنافسية المذمومة، لا الحماسة الإيجابية.
- source_word: θυμοί
  choice: نوبات الغضب
  rationale: صيغة الجمع تبرز فورات غضب متكررة، لا مجرد حالة داخلية ثابتة؛ لذلك يوضح تعبير «نوبات الغضب» القوة الحدثية للكلمة.
- source_word: ἐριθεῖαι
  choice: الطموح الأناني
  rationale: يشير المصطلح إلى طلب التقدم أو المكسب بدافع المصلحة الذاتية، وتؤدي العبارة المعنى الأخلاقي المقصود بوضوح.
- source_word: διχοστασίαι
  choice: الانقسامات
  rationale: يدل اللفظ على تباعد الناس ووقوفهم في جماعات متعارضة، و«الانقسامات» تعبير عربي واضح وواسع الدلالة.
- source_word: αἱρέσεις
  choice: التحزبات
  rationale: المعنى المباشر هنا هو تكوين الأحزاب أو الجماعات المتنازعة، لا المعنى الاصطلاحي الكنسي اللاحق المتعلق بالهرطقة.
theological_decisions:
- issue: دلالة αἱρέσεις
  choice: التحزبات
  alternative: الفرق، أو «الهرطقات» بحسب الاستعمال الكنسي اللاحق
  rationale: السياق قائمة برذائل تفسد العلاقات والجماعة، ولذلك يُقدَّم المعنى الاجتماعي الانقسامي. أما «الهرطقات» فقد تُدخل معنى عقائديًا اصطلاحيًا تطور في الاستعمال الكنسي اللاحق ولا يفرضه السياق هنا.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، تحافظ على إيقاع قائمة الرذائل وعلى صيغ الجمع حيث تكون ذات دلالة. وُضع مؤشر الحاشية [a] بعد «السحر» لأنه يخص φαρμακεία، رغم موضعه المختلف في طبقة الاستشارة الإنجليزية.
