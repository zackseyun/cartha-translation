id: GAL.5.11
reference: Galatians 5:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: ar
  text: أَمَّا أَنَا أَيُّهَا الإِخْوَةُ[a]، فَإِنْ كُنْتُ لا أَزَالُ أَكْرِزُ بِالْخِتَانِ، فَلِمَاذَا لا أَزَالُ أُضْطَهَدُ؟ إِذًا قَدْ أُبْطِلَتْ عَثْرَةُ الصَّلِيبِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تعني أيضًا: «أيها الإخوة والأخوات»؛ فالكلمة اليونانية المترجمة «الإخوة» قد تُستعمل لمخاطبة جماعة تضم رجالًا ونساءً.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ما في الصليب من إساءة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: أَيُّهَا الإِخْوَةُ
  rationale: مقابل عربي مباشر لصيغة النداء المذكرة الجمع، مع بيان إمكان شمولها المؤمنات في الحاشية.
- source_word: περιτομήν
  choice: الْخِتَانِ
  rationale: المقابل العربي المألوف والدقيق، ويحفظ الإشارة إلى الممارسة ومطلبها الديني في سياق غلاطية.
- source_word: ἔτι
  choice: لا أَزَالُ
  rationale: يحفظ الدلالة الاستمرارية في موضعيها ويُظهر منطق سؤال بولس.
- source_word: κηρύσσω
  choice: أَكْرِزُ
  rationale: فعل عربي كتابي واضح يدل على الإعلان العلني للرسالة.
- source_word: διώκομαι
  choice: أُضْطَهَدُ
  rationale: يحفظ المبني للمجهول ودلالة التعرض للاضطهاد بسبب الرسالة.
- source_word: ἄρα
  choice: إِذًا
  rationale: أداة استنتاج عربية طبيعية تنقل نتيجة الفرض السابق مباشرة.
- source_word: κατήργηται
  choice: قَدْ أُبْطِلَتْ
  rationale: يحفظ صيغة المبني للمجهول والنتيجة القائمة للفعل التام، أي صيرورة العثرة بلا مفعول.
- source_word: σκάνδαλον
  choice: عَثْرَةُ
  rationale: ينقل صورة ما يسبب التعثر والرفض، ويحفظ المجاز اللاهوتي دون تسويته إلى مجرد شعور بالإساءة.
- source_word: σταυροῦ
  choice: الصَّلِيبِ
  rationale: المقابل العربي القياسي في الاستعمال البولسي.
theological_decisions:
- issue: مدى شمول ἀδελφοί لجمهور مختلط
  choice: أَيُّهَا الإِخْوَةُ
  alternative: أَيُّهَا الإِخْوَةُ وَالأَخَوَاتُ
  rationale: أُبقيت الصيغة المذكرة الظاهرة في اليونانية، مع توضيح استعمالها الشامل المحتمل في الحاشية.
- issue: دلالة σκάνδαλον τοῦ σταυροῦ
  choice: عَثْرَةُ الصَّلِيبِ
  alternative: مَا فِي الصَّلِيبِ مِنْ إِسَاءَةٍ
  rationale: «عثرة» تحافظ على الصورة الأصلية وعلى التوتر القائل إن الصليب يثير الرفض، من غير قصر المعنى على الإساءة الشعورية.
- issue: قوة κατήργηται في الاستنتاج الافتراضي
  choice: قَدْ أُبْطِلَتْ
  alternative: قَدْ أُزِيلَتْ
  rationale: «أُبطلت» تنقل معنى جعل العثرة عديمة المفعول في النتيجة التي يستخلصها بولس، من غير الزعم بأنها زالت فعليًا خارج الفرض الجدلي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رسائلية كريمة. استُخدم «أما أنا» لإبراز ἐγὼ δέ، وكُرر «لا أزال» كما في الأصل، وحُفظ السؤال الجدلي ثم الاستنتاج الموجز.
