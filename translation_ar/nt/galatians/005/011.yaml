  source_fidelity: 'النص العربي ينقل بدقة البنية الجدلية في اليونانية: التشديد في «أمّا أنا»، والنداء «أيها الإخوة»، واستمرار الفعل في «لا أزال» في الموضعين، والمبني للمجهول في «أُضطهد»، والاستنتاج في «إذًا»، ونتيجة الفعل التام المبني للمجهول في «قد أُبطلت». و«عَثرة الصليب» تمثّل σκάνδαλον τοῦ σταυροῦ تمثيلًا أمينًا وتحفظ الصورة المجازية.'
