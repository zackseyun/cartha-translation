source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: ar
  text: لأنه في المسيح يسوع لا الختان له أيُّ اعتبار، ولا عدم الختان، بل الإيمان العامل بالمحبة.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «في المسيّا يسوع»؛ فاللفظة اليونانية Χριστός لقب معناه «الممسوح».'
    reason: alternative_reading
  - marker: b
    text: يمكن أن تُترجم πίστις أيضًا «الأمانة» أو «الثقة».
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا: «الإيمان الفاعل بالمحبة»، أو «الإيمان الذي يُظهر فاعليته بالمحبة»، أو «الإيمان الذي يُفعَّل بالمحبة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: أُبقي حرف الجر «في» حفاظًا على لغة بولس عن الاتحاد بالمسيح، وتُرجم Χριστός باللقب العربي المألوف «المسيح».
- source_word: γὰρ
  choice: لأنه
  rationale: تُدخل الأداة تعليلًا أو تفسيرًا لما سبق، و«لأنه» تؤدي هذه الصلة بوضوح في العربية.
- source_word: περιτομή / ἀκροβυστία
  choice: الختان / عدم الختان
  rationale: يحافظ التعبيران على التقابل بين حالتي الهوية اللتين يذكرهما النص من غير إضافة تفسيرية.
- source_word: τι ἰσχύει
  choice: له أيُّ اعتبار
  rationale: المقصود هنا الأهمية أو الفاعلية، لا القوة الجسدية؛ وهذه الصياغة عربية طبيعية وتحفظ عموم النفي.
- source_word: πίστις
  choice: الإيمان
  rationale: هو المقابل العربي الأساسي، مع إثبات إمكان دلالة اللفظة على الأمانة أو الثقة في الحاشية.
- source_word: δι’ ἀγάπης
  choice: بالمحبة
  rationale: تؤدي الباء معنى الوسيلة في διά مع المضاف إليه، وتأتي العبارة موجزة وطبيعية.
- source_word: ἐνεργουμένη
  choice: العامل
  rationale: تحفظ الصفة معنى النشاط والفاعلية، من غير حسم قاطع بين الدلالة الوسطى والدلالة المبنية للمجهول في الصيغة اليونانية.
theological_decisions:
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός ويحفظ طبيعته اللقبية في عبارة «المسيح يسوع».
- issue: دلالة πίστις
  choice: الإيمان
  alternative: الأمانة أو الثقة
  rationale: اختير المقابل المعتاد في المتن، مع إبقاء السعة الدلالية في الحاشية بدل حسمها لاهوتيًا.
- issue: دلالة ἐνεργουμένη وصيغتها
  choice: العامل
  alternative: الفاعل، أو الذي يُفعَّل
  rationale: تتيح الصيغة اليونانية معنى العمل والنشاط، وقد تُفهم وسطية أو مبنية للمجهول؛ لذلك اختير تعبير موجز لا يبالغ في حسم هذا التوتر.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظ توازي «الختان / عدم الختان» وتركيب «في المسيح»، ووُضعت علامات الحواشي في المتن بالترتيب الموافق لموضوعاتها.
