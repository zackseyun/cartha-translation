reference: Galatians 6:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: ar
  text: لِأَنَّ مَنْ يَزْرَعُ لِجَسَدِهِ سَيَحْصُدُ مِنَ الْجَسَدِ فَسَادًا[a][b]، أَمَّا مَنْ يَزْرَعُ لِلرُّوحِ[c] فَسَيَحْصُدُ مِنَ الرُّوحِ حَيَاةً أَبَدِيَّةً.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لطبيعته الخاطئة». يمكن أن تعني الكلمة اليونانية «الجسد» حرفيًّا، كما قد تشير في مقابلات بولس الأخلاقية إلى التوجّه البشري الساقط المناقض للروح.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «هلاكًا» أو «بِلًى». تدل الكلمة اليونانية على الفساد أو الخراب أو البلى بحسب السياق.'
    reason: lexical_alternative
  - marker: c
    text: أي روح الله. ويمكن من حيث الرسم اليوناني أن تُفهم «الروح» بمعنى آخر، لكن المقابلة بين الجسد والروح في رسالة غلاطية تشير غالبًا إلى روح الله.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: لأنَّ
  rationale: تفيد الأداة تعليل الحث السابق وبيان أساسه، و«لأنَّ» تنقل هذه القوة التفسيرية طبيعيًّا.
- source_word: ὁ σπείρων
  choice: مَنْ يزرع
  rationale: ينقل اسم الفاعل المعرَّف المستعمل استعمالًا اسميًّا بمعنى عام، ويحافظ على الطابع الحكمي للقول.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: لجسده
  rationale: اللام طبيعية مع صورة الزرع الموجَّه لغرض أو مجال، و«جسده» تحفظ مصطلح بولس وإضافة الضمير العائد إلى الفاعل من غير تحويله مباشرة إلى تفسير «الطبيعة الخاطئة».
- source_word: ἐκ τῆς σαρκὸς
  choice: من الجسد
  rationale: تنقل ἐκ الدالة على المصدر، وتحفظ التوازي مع «من الروح».
- source_word: θερίσει
  choice: يحصد
  rationale: يحافظ على الصورة الزراعية المقابلة لفعل «يزرع»؛ والسياق اليوناني يجعل دلالته مستقبلية رغم صيغة المضارع العربية الطبيعية في جواب الشرط العام.
- source_word: φθοράν
  choice: فسادًا
  rationale: «فساد» لفظ واسع يمكن أن يدل على البلى والخراب والعاقبة الفاسدة، فلا يضيّق المعنى إلى الفناء أو التحلل الجسدي وحده.
- source_word: ὁ δὲ σπείρων
  choice: أمّا مَنْ يزرع
  rationale: «أمّا» تبرز المقابلة المتوازنة بين شطري الآية، مع تكرار البنية نفسها.
- source_word: εἰς τὸ πνεῦμα
  choice: للروح
  rationale: السياق في غلاطية، ولا سيما مقابلة الجسد بالروح، يرجّح أن المقصود روح الله؛ وأداة التعريف في العربية تلائم هذا المرجع.
- source_word: ἐκ τοῦ πνεύματος
  choice: من الروح
  rationale: تحفظ دلالة المصدر والتوازي الدقيق مع «من الجسد».
- source_word: ζωὴν αἰώνιον
  choice: حياةً أبديةً
  rationale: تعبير عربي راسخ ودقيق ينقل المعنى الأخروي للعبارة دون شرح زائد.
theological_decisions:
- issue: دلالة σάρξ في المقابلة الأخلاقية عند بولس
  choice: الجسد
  alternative: الطبيعة الخاطئة
  rationale: اختير «الجسد» للمحافظة على مصطلح بولس وعلى التوتر الدلالي بين البعد الجسدي والتوجّه البشري الساقط، مع بيان البديل التفسيري في الحاشية.
- issue: مرجع πνεῦμα
  choice: الروح، أي روح الله
  alternative: الروح الإنسانية
  rationale: مقابلة الجسد بالروح في سياق الرسالة ترجّح روح الله، لكن الحاشية تصرّح بالقرار لأن الرسم اليوناني القديم لا يميّز بين الحرف الكبير والصغير.
- issue: طبيعة φθορά في العاقبة
  choice: الفساد
  alternative: الهلاك أو البلى
  rationale: يحفظ اللفظ اتساع المعنى، فلا يحسم وحده إن كانت العاقبة موصوفة من جهة الخراب أو البلى أو الهلاك الأخروي.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة، مع الحفاظ على التوازي البلاغي بين الزرع والحصاد وبين الجسد والروح. استُعمل المضارع «يحصد» في جواب «مَنْ» لأنه التعبير العربي الطبيعي عن نتيجة مستقبلية مؤكدة في قاعدة عامة، بينما يحمل الأصل اليوناني صيغة المستقبل. أُثبتت جميع علامات الحواشي في مواضعها من المتن.
