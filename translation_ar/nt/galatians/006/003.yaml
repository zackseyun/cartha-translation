  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, ⸂φρεναπατᾷ ἑαυτόν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: ar
  text: لأن من يظن أنه شيء، وهو لا شيء، يخدع نفسه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُوهِم نفسه».'
    reason: بديل معجمي يبرز أن φρεναπατᾷ هو خداع يقع في الفكر أو الوهم الذاتي.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: لأن من
  rationale: تفيد γάρ التعليل والربط بما سبق، بينما يحمل تركيب «من يظن» معنى الشرط العام الذي تؤديه εἰ مع τις، وهو أسلوب عربي طبيعي موجز.
- source_word: δοκεῖ
  choice: يظن
  rationale: الفعل هنا يدل على تقدير المرء لنفسه، لا على ظهوره في نظر الآخرين؛ و«يظن» ينقل هذا المعنى بوضوح.
- source_word: τις
  choice: من
  rationale: اسم الشرط «من» يؤدي الدلالة العامة غير المحددة ويحافظ على الإفراد في العربية.
- source_word: εἶναί τι
  choice: أنه شيء
  rationale: تحافظ العبارة على التقابل الموجز المقصود بين «شيء» و«لا شيء»، من غير تفسير «شيء» صراحةً بمعنى مهم أو عظيم.
- source_word: μηδὲν ὤν
  choice: وهو لا شيء
  rationale: تنقل الجملة الحالية معنى اسم الفاعل ὤν بصورة عربية طبيعية، وتحفظ قدرًا من الانفتاح بين الدلالة الحالية والإيحائية بالمفارقة دون تحويلها صراحة إلى «مع أنه».
- source_word: φρεναπατᾷ
  choice: يخدع
  rationale: يفيد الفعل خداع الذهن أو تضليله؛ و«يخدع» هو المقابل العربي الواضح والأوسع، مع إثبات البديل الأدق دلاليًا في الحاشية.
- source_word: ἑαυτόν
  choice: نفسه
  rationale: ضمير انعكاسي يعود إلى الفاعل المفرد العام، و«نفسه» هو المقابل العربي الطبيعي.
theological_decisions:
- issue: الإحالة المذكرة العامة
  choice: من ... نفسه
  alternative: مَن ... أنفسهم / الشخص ... نفسه
  rationale: تستعمل اليونانية صيغة المفرد المذكر استعمالًا تمثيليًا عامًا. واسم الشرط العربي «من» عام بطبيعته، ثم يعود إليه ضمير المفرد المذكر وفق المطابقة النحوية من غير حصر المعنى في الرجال.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات نبرة كتابية رصينة. حُفظ التقابل البلاغي بين «شيء» و«لا شيء»، ووُضعت علامة الحاشية [a] في المتن كما يلزم.
