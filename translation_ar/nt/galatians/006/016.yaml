  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: ar
  text: وكل الذين سيسلكون[a] بحسب هذه القاعدة، عليهم سلام ورحمة، وعلى[c] إسرائيل الله[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل الذين سيتبعون هذا المعيار». يدل الفعل على السير في صف منتظم أو مواصلة السلوك وفق قاعدة.'
    reason: lexical_alternative
  - marker: b
    text: 'عبارة «إسرائيل الله» موضع خلاف: فقد يُقصد بها اليهود المؤمنون، أو الكنيسة كلها، أو شعب الله بمعنى أوسع. وتُبقي الترجمة الصياغة اليونانية دون حسم هذا الخلاف.'
    reason: alternative_reading
  - marker: c
    text: 'قد تُفهم الواو الأخيرة على أنها تضيف جماعة أخرى: «وعلى إسرائيل الله»، أو تعيد وصف الجماعة نفسها: «أي على إسرائيل الله».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: كل الذين
  rationale: تعبير عربي طبيعي يحفظ شمول اسم الموصول وقوته التوزيعية.
- source_word: κανόνι
  choice: القاعدة
  rationale: يدل هنا على معيار منضبط يُسلك بمقتضاه؛ و«القاعدة» موجزة وتحفظ صورة الأصل دون توسع تفسيري.
- source_word: στοιχήσουσιν
  choice: سيسلكون بحسب
  rationale: يحفظ استعارة السير المنضبط وفق معيار، وهي ملائمة للاستعمال الأخلاقي عند بولس، مع صياغة عربية واضحة.
- source_word: εἰρήνη
  choice: سلام
  rationale: المقابل المألوف في صيغة البركة.
- source_word: ἔλεος
  choice: رحمة
  rationale: المقابل المباشر المألوف، وهو مقترن هنا بالسلام في دعاء البركة.
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: عليهم ... وعلى
  rationale: يحفظ تكرار حرف الجر ونبرة البركة في اليونانية.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: إسرائيل الله
  rationale: ترجمة تركيبية شفافة تحفظ الإضافة ولا تحسم هوية المشار إليهم.
theological_decisions:
- issue: المقصود بعبارة «إسرائيل الله»
  choice: أُبقيت العبارة حرفية دون تحديد مرجعها.
  alternative: اليهود المؤمنون تحديدًا؛ أو الكنيسة كلها؛ أو شعب الله بمعناه الأوسع.
  rationale: العبارة موضع خلاف، والنص اليوناني لا يفرض وحده تفسيرًا واحدًا؛ لذلك تحافظ الصياغة على التوتر الدلالي واللاهوتي.
- issue: دلالة καί الأخيرة قبل «إسرائيل الله»
  choice: تُرجمت «وعلى» بوصفها عطفًا غير محسوم الدلالة.
  alternative: أن تفيد إضافة جماعة أخرى، أو أن تكون تفسيرية بمعنى «أي على إسرائيل الله».
  rationale: العطف في السياق يحتمل الإضافة ويحتمل إعادة التسمية؛ وترجمة «و» تحفظ الاحتمالين.
translation_notes:
  register: العربية فصحى حديثة واضحة وذات نبرة كتابية وقورة. حُفظت استعارة السلوك، وتكرار حرف الجر، وغموض العطف الأخير وهوية «إسرائيل الله».
