  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: ar
  text: انظروا ما أكبر الحروف التي كتبتُ بها إليكم بيدي أنا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انظروا كم هي طويلة الرسالة التي كتبتها إليكم بيدي أنا».'
    reason: قراءة بديلة لعبارة πηλίκοις γράμμασιν؛ إذ يمكن أن تُفهم على أنها تشير إلى طول الرسالة بدلًا من حجم الحروف.
lexical_decisions:
- source_word: Ἴδετε
  choice: انظروا
  rationale: فعل أمر للجمع يُستعمل للفت الانتباه، و«انظروا» يحافظ على المباشرة والإيجاز.
- source_word: πηλίκοις
  choice: بأي... كبيرة
  rationale: تدل الكلمة على المقدار أو الحجم، ومع γράμμασιν يُرجَّح أنها تصف كِبَر الحروف المكتوبة.
- source_word: γράμμασιν
  choice: حروف
  rationale: المقصود على الأرجح حروف الكتابة أو علاماتها، لا الرسالة بوصفها مؤلَّفًا كاملًا.
- source_word: ὑμῖν
  choice: إليكم
  rationale: 'الضمير في حالة المجرور اليونانية يؤدي معنى المفعول غير المباشر: كتب بولس إلى المخاطَبين.'
- source_word: ἔγραψα
  choice: كتبت
  rationale: الماضي العربي الطبيعي ينقل صيغة الماضي اليونانية بوضوح، ويصلح سواء أُشير إلى ما كتبه الآن أو إلى الرسالة القائمة أمام القراء.
- source_word: τῇ ἐμῇ χειρί
  choice: بيدي أنا
  rationale: ينقل العبارة الآلية مع إبراز الضمير ἐμῇ، ويؤكد أن بولس كتب شخصيًا.
theological_decisions:
- issue: دلالة πηλίκοις γράμμασιν
  choice: حجم الحروف المكتوبة
  alternative: طول الرسالة التي كتبها
  rationale: التركيب مع ذكر الكتابة باليد يرجّح الإشارة إلى كِبَر خط الكتابة، لكن إمكان فهمه على طول الرسالة قائم تاريخيًا، ولذلك حُفظ في الحاشية.
