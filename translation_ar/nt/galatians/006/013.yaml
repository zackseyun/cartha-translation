revisions:
- from: لِأَنَّ الَّذِينَ يَخْتَتِنُونَ هُمْ أَنْفُسُهُمْ لَا يَحْفَظُونَ النَّامُوسَ، بَلْ يُرِيدُونَ أَنْ تَخْتَتِنُوا أَنْتُمْ لِكَيْ يَفْتَخِرُوا بِأَجْسَادِكُمْ.[a]
  to: فَحَتَّى الَّذِينَ يُخْتَنُونَ هُمْ أَنْفُسُهُمْ لَا يَحْفَظُونَ الشَّرِيعَةَ، بَلْ يُرِيدُونَ أَنْ تُخْتَنُوا لِكَيْ يَفْتَخِرُوا بِأَجْسَادِكُمْ.[a]
  rationale: أُبرزت قوة «حتى» في οὐδὲ مع وظيفة الربط التي تؤديها γάρ، واستُعمل المبني للمجهول في «يُختنون» و«تُختنوا» لمضاهاة جهة الفعل في الأصل. كما استُبدلت «الناموس» بـ«الشريعة» لتكون العبارة أوضح في الفصحى المعاصرة من دون تغيير المعنى. وبقيت «بأجسادكم» محافظة على الدلالة الجسدية الحرفية لـσάρξ في سياق الختان.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:21Z'
review_pass:
  verdict: revise
  source_fidelity: المسودة تنقل البنية الأساسية والمعنى المقصود جيدًا، لكنها لا تُظهر توكيد οὐδὲ («حتى/ولا حتى») بوضوح كافٍ. كذلك، «يختتنون» و«تختتنوا» قد يُفهمان في العربية بصيغة انعكاسية أو فعلية، بينما صيغة الأصل في الموضعين مبنية للمجهول/متوسطة؛ فالصيغة المبنية للمجهول أدق وأوضح.
  naturalness: الصياغة المقترحة فصحى معاصرة واضحة. «الشريعة» أيسر في العربية المعاصرة من «الناموس» مع بقائها أمينة لـ νόμος في هذا السياق.
  terminology: يُحافَظ على الختان بوصفه المصطلح الدقيق، وعلى «الشريعة» لترجمة νόμος. وتُترجم σάρξ بـ«أجسادكم» لأن الإحالة هنا إلى العلامة الجسدية للختان، لا إلى معنى أخلاقي مجازي.
  issues:
