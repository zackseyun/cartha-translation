  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: ar
  text: فَحَتَّى الَّذِينَ يُخْتَنُونَ هُمْ أَنْفُسُهُمْ لَا يَحْفَظُونَ الشَّرِيعَةَ، بَلْ يُرِيدُونَ أَنْ تُخْتَنُوا لِكَيْ يَفْتَخِرُوا بِأَجْسَادِكُمْ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «الذين يُختنون» بـ«المختونين». تستعمل اليونانية اسم فاعل مضارعًا معرّفًا، ومعناه الحرفي: «الذين يُختنون / الذين هم مختونون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: لِأَنَّ ... لَا
  rationale: تنقل «لأن» وظيفة γάρ التفسيرية التي تصل الآية بما قبلها، ويعبّر النفي مع السياق والتوكيد «هم أنفسهم» عن قوة οὐδέ من غير تركيب عربي متكلّف.
- source_word: οἱ περιτεμνόμενοι
  choice: الذين يختتنون
  rationale: اسم الفاعل اليوناني المضارع المعرّف مستعمل استعمال الاسم. وهذه الصياغة تحافظ على جانبه اللفظي/الاستمراري، ولا تحوّله تفسيرًا إلى «الداعين إلى الختان».
- source_word: αὐτοὶ
  choice: هم أنفسهم
  rationale: يحفظ التوكيد الصريح على أن هؤلاء أنفسهم لا يعملون بما يطالبون به غيرهم.
- source_word: νόμον φυλάσσουσιν
  choice: يحفظون الناموس
  rationale: «يحفظون» تعبير عربي كتابي واضح عن مراعاة أحكام الشريعة، و«الناموس» يحافظ على المصطلح البولسي المألوف في هذا السياق.
- source_word: ἀλλὰ θέλουσιν
  choice: بل يريدون
  rationale: «بل» تنقل المقابلة التصحيحية، و«يريدون» تؤدي معنى الإرادة مباشرة بلغة عربية معاصرة.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: أن تختتنوا أنتم
  rationale: صياغة عربية طبيعية تحفظ معنى الخضوع للختان، مع إبراز ضمير المخاطبين بما يلائم المقابلة مع «هم أنفسهم».
- source_word: ἵνα
  choice: لكي
  rationale: تدل بوضوح على الغاية المقصودة.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: بأجسادكم
  rationale: السياق يتحدث عن الختان وعلامته الجسدية؛ والباء مع «يفتخر» عربية طبيعية لنطاق الافتخار، و«أجسادكم» توضح المعنى الحرفي المقصود من σάρξ هنا.
- source_word: καυχήσωνται
  choice: يفتخروا
  rationale: اختيار عربي فصيح شائع ينقل معنى التباهي واتخاذ الأمر موضعًا للفخر.
theological_decisions:
- issue: دلالة σάρξ في هذا الموضع
  choice: الجسد الحرفي الذي تظهر فيه علامة الختان
  alternative: الطبيعة الخاطئة أو «الجسد» بالمعنى الأخلاقي المجازي
  rationale: السياق المباشر هو الختان؛ لذلك تتعلق العبارة بأجساد الغلاطيين بوصفها موضع العلامة الظاهرة التي يريد الآخرون أن يفتخروا بها، ولا يسوغ إدخال معنى «الطبيعة الخاطئة» هنا.
- issue: دلالة اسم الفاعل περιτεμνόμενοι
  choice: الذين يختتنون
  alternative: المختونون؛ أو الداعون إلى الختان
  rationale: النص يصف الجماعة بصيغة اسم فاعل مضارع يمكن أن تدل على من يخضعون للختان أو يتخذونه ممارسة. أما «الداعون إلى الختان» فيستفاد من السياق لكنه أصرح من لفظ الأصل، ولذلك لم يُدرج في المتن.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل «الناموس» حفاظًا على المصطلح البولسي المتداول، وتجنبت الصياغة نسبة معنى «الداعين إلى الختان» إلى اسم الفاعل نفسه. وُضعت علامة الحاشية [a] في المتن وربطت ببديل لفظي يحفظ غموض الصيغة اليونانية.
