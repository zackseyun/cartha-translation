    rationale: تتضمن οὐδέ معنى «حتى/ولا حتى»، ويؤكد بولس أن هؤلاء أنفسهم لا يحفظون الشريعة. افتتاح الجملة بـ«فحتى» ينقل الربط التفسيري والتوكيد معًا.
  - severity: medium
    issue: «الذين يختتنون» و«أن تختتنوا» قد لا يبينان جهة المبني للمجهول في اليونانية.
    rationale: περιτεμνόμενοι وπεριτέμνεσθαι صيغتان متوسطتان/مبنيتان للمجهول. «الذين يُختنون» و«أن تُختنوا» تحافظان على كون الأشخاص متلقين للختان، دون تحويل العبارة إلى وصف تفسيري للداعين إليه.
  revised_text: فَحَتَّى الَّذِينَ يُخْتَنُونَ هُمْ أَنْفُسُهُمْ لَا يَحْفَظُونَ الشَّرِيعَةَ، بَلْ يُرِيدُونَ أَنْ تُخْتَنُوا لِكَيْ يَفْتَخِرُوا بِأَجْسَادِكُمْ.[a]
