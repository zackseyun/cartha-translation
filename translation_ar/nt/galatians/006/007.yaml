  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: ar
  text: 'لا تنخدعوا: الله لا يُستهزأ به[أ]؛ فما يزرعه الإنسان، إياه أيضًا سيحصد.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'أو: «لا يُعامَل باحتقار». تحمل الكلمة اليونانية معنى السخرية المصحوبة بالازدراء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: لا تنخدعوا
  rationale: يحفظ صيغة النهي المبني للمجهول الموجَّه إلى الجمع، وينقل نبرة التحذير بعبارة عربية واضحة ومباشرة.
- source_word: θεὸς
  choice: الله
  rationale: المقابل العربي المألوف للاسم θεός في هذا السياق، حيث يشير الكلام إلى الله الواحد.
- source_word: οὐ μυκτηρίζεται
  choice: لا يُستهزأ به
  rationale: يحفظ البناء للمجهول والمعنى الذي يجمع بين السخرية وإظهار الاحتقار، مع الإبقاء على قوة العبارة الموجزة.
- source_word: ὃ γὰρ ἐὰν
  choice: فما
  rationale: تنقل أداة التعليل والمعنى الموصول غير المحدد الذي يمهّد لقاعدة عامة.
- source_word: σπείρῃ
  choice: يزرعه
  rationale: يحافظ على صورة الزرع الزراعية حرفيًا ويهيئ لصورة الحصاد المقابلة.
- source_word: ἄνθρωπος
  choice: الإنسان
  rationale: ينقل المفرد التمثيلي العام طبيعيًا في العربية، فيشمل الإنسان أيًّا كان جنسه من غير إخلال بصيغة المفرد.
- source_word: τοῦτο καὶ θερίσει
  choice: إياه أيضًا سيحصد
  rationale: يحفظ توكيد اسم الإشارة والترابط الدقيق بين المزروع والمحصول، كما ينقل καί بمعنى «أيضًا».
theological_decisions:
- issue: عمومية ἄνθρωπος في صيغة المفرد
  choice: الإنسان
  alternative: المرء أو إنسان
  rationale: اللفظة اليونانية مفرد مذكر نحويًا لكنها تشير هنا إلى البشر عمومًا. و«الإنسان» تعبير عربي مفرد طبيعي ذو دلالة عامة، فلا يحصر المبدأ في الرجال.
- issue: دلالة عدم استهزاء البشر بالله
  choice: الله لا يُستهزأ به
  alternative: الله لا يُعامَل باحتقار
  rationale: أُبقيت العبارة بصيغة تقريرية قوية من غير إضافة تفسير عقائدي يحدد كيفية تحققها؛ فهي تنفي إمكان الاستهانة بالله بلا عاقبة ضمن سياق الزرع والحصاد.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة تحذيرية وقوة مَثَلية. حُفظت استعارتا الزرع والحصاد، واستُعمل «إياه» لإبراز التطابق المؤكد بين ما يُزرع وما يُحصد.
