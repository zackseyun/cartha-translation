  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: ar
  text: ولا نَفْتُرْ في فِعل الخير، لأننا سنحصد في الوقت المناسب إن لم نَكِلّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن لم نَخُرْ»؛ أي إن لم نضعف من الإعياء أو نفقد عزيمتنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: في فِعل الخير
  rationale: التركيب يدل اصطلاحيًا على ممارسة ما هو صالح أو حسن، و«فعل الخير» تعبير عربي طبيعي يحفظ المعنى الأخلاقي واستمرارية الفعل.
- source_word: μὴ ἐγκακῶμεν
  choice: لا نَفْتُرْ
  rationale: الفعل يدل على الوهن أو فقدان العزم بما يقود إلى التراجع؛ و«نفتر» موجز وفصيح ويناسب الحث على المثابرة.
- source_word: καιρῷ ... ἰδίῳ
  choice: في الوقت المناسب
  rationale: يفيد التعبير الوقت الخاص الملائم أو المعيَّن للحصاد، من غير أن يحدد صراحةً مَن عيّنه.
- source_word: θερίσομεν
  choice: سنحصد
  rationale: يحفظ صورة الحصاد الزراعية المتصلة بسياق الزرع في الآيات المحيطة.
- source_word: μὴ ἐκλυόμενοι
  choice: إن لم نَكِلّ
  rationale: للمشاركة معنى عدم الوهن أو الانهيار من الإعياء، وتؤدي «إن لم نكلّ» القوة الشرطية المفهومة في السياق مع تمييزها نسبيًا عن «نفتر».
theological_decisions:
- issue: العلاقة بين تعبيري المثابرة ἐγκακῶμεν وἐκλυόμενοι
  choice: «لا نفتر» ثم «إن لم نكلّ»
  alternative: «لا نفقد عزيمتنا» ثم «إن لم نستسلم»
  rationale: استُخدم تعبيران عربيان متقاربان غير متطابقين حفاظًا على تكرار بولس البلاغي مع عدم تسوية اللفظين في معنى واحد، ومن دون إضافة تحديد عقائدي إلى شرط المثابرة.
- issue: دلالة καιρῷ ἰδίῳ
  choice: «في الوقت المناسب»
  alternative: «في وقته الخاص» أو «في الموعد المعيَّن»
  rationale: يحفظ الاختيار معنى الوقت الملائم من غير أن يحسم هل الإضافة تشير إلى وقت الحصاد نفسه أم إلى موعد عيّنه الله ضمنًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة ومباشرة. اختير «نفتر» و«نكلّ» للمحافظة على التوازي والتمايز بين الفعلين اليونانيين، مع وضع حركة جزئية حيث تمنع الالتباس في القراءة.
