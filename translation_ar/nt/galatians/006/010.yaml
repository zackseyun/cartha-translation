base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: ar
  text: فإذًا، ما دامت لنا فرصة[a]، فلنعمل الخير للجميع، ولا سيما لأهل بيت الإيمان[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما دام لنا الوقت». تشير الكلمة اليونانية إلى وقت ملائم أو فرصة سانحة، لا إلى الزمن عمومًا فحسب.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عائلة الإيمان» أو «المنتمين إلى بيت الإيمان». تستخدم اليونانية صورة البيت للدلالة على المنتمين إلى جماعة المؤمنين.'
    reason: lexical_alternative
  - marker: c
    text: قد يُفهم «الإيمان» أيضًا بمعنى «العقيدة الإيمانية المشتركة».
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: فإذًا
  rationale: تفيد الأداتان معًا استخلاص نتيجة مما سبق، و«فإذًا» تؤدي هذا الربط الاستنتاجي بعبارة عربية موجزة وطبيعية.
- source_word: ὡς καιρὸν ἔχομεν
  choice: ما دامت لنا فرصة
  rationale: تشير καιρός إلى وقت ملائم أو فرصة متاحة للعمل، لا إلى الزمن بإطلاقه. وتحافظ الصياغة على البعد الزمني مع إبراز إمكان العمل.
- source_word: ἐργαζώμεθα τὸ ἀγαθὸν
  choice: فلنعمل الخير
  rationale: صيغة الفعل حثية تدعو الجماعة إلى فعل مستمر، و«نعمل الخير» تعبير عربي طبيعي يؤدي معنى الصفة المحايدة المستعملة اسمًا، τὸ ἀγαθόν.
- source_word: πρὸς πάντας
  choice: للجميع
  rationale: تدل العبارة على توجيه فعل الخير إلى جميع الناس، و«للجميع» واضحة وموجزة ولا تقصر النطاق على فئة بعينها.
- source_word: μάλιστα δὲ
  choice: ولا سيما
  rationale: تبيّن العبارة أولوية خاصة داخل النطاق العام، لا استثناء الآخرين منه.
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: أهل بيت الإيمان
  rationale: تحافظ الصياغة على صورة البيت الكامنة في οἰκεῖοι، وتعرض الإيمان بوصفه ما يحدد هذا البيت، من غير تحويل العبارة إلى وصف مؤسسي زائد.
theological_decisions:
- issue: نطاق فعل الخير وأولوية المؤمنين
  choice: فعل الخير موجَّه إلى الجميع، مع أولوية خاصة لأهل بيت الإيمان.
  alternative: قصر فعل الخير على المؤمنين وحدهم، أو نفي أي أولوية خاصة لهم.
  rationale: تجمع اليونانية بين النطاق الشامل πρὸς πάντας والتخصيص المؤكد μάλιστα، فتحفظ الترجمة كلا الجانبين من غير أن يلغي أحدهما الآخر.
- issue: دلالة τῆς πίστεως
  choice: الإيمان بوصفه السمة التي يتحدد بها البيت.
  alternative: «الإيمان» بمعنى العقيدة المشتركة تحديدًا، أو «الأمانة» بوصفها صفة.
  rationale: لفظ πίστις يحتمل هنا الإيمان الشخصي أو الإيمان المشترك الذي تنتمي إليه الجماعة، ولا يفرض السياق تضييق المعنى إلى صيغة عقائدية مؤسسية أو تحويله إلى «الأمانة».
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة وموقرة. استُخدمت «فإذًا» للربط الاستنتاجي، و«فلنعمل الخير» للحث الجماعي الطبيعي، وحُفظت استعارة البيت في «أهل بيت الإيمان» مع إيضاح البدائل في الحاشية.
