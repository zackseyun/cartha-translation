  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: ar
  text: فليُشرك مَن يتلقّى تعليم الكلمة معلّمه في كل الخيرات[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فليشارك مَن يتلقّى تعليم الكلمة معلّمه في كل الخيرات». ويُرجَّح أن تشمل هذه الخيرات الدعم المادي، من غير أن تقتصر عليه.'
    reason: بديل معجمي لصياغة فعل المشاركة؛ يوضح الفهم العملي المحتمل من غير حصر معنى «الخيرات» في المال.
lexical_decisions:
- source_word: Κοινωνείτω
  choice: وليشارك
  rationale: صيغة الأمر المضارع تدعو إلى ممارسة مستمرة. ويحافظ «يشارك» على سعة المعنى، فلا يحصر المشاركة في المال وحده مع إبقائه ضمن ما يحتمله السياق بقوة.
- source_word: δὲ
  choice: الواو في «وليشارك»
  rationale: تفيد δέ انتقالًا خفيفًا لا تضادًا قويًا؛ وتؤدي الواو هذا الربط طبيعيًا في العربية من غير إضافة ظرف زمني غير موجود في الأصل.
- source_word: ὁ κατηχούμενος τὸν λόγον
  choice: مَن يتلقّى التعليم في الكلمة
  rationale: ينقل اسم الفاعل المبني للمجهول معنى الشخص الذي يتلقى تعليمًا مستمرًا، وتحافظ «الكلمة» على التعبير البولسي المألوف من غير تحويله إلى مصطلح كنسي تقني متأخر.
- source_word: τῷ κατηχοῦντι
  choice: مَن يعلّمه
  rationale: ينقل اسم الفاعل معنى القائم بالتعليم، ويُظهر التقابل اللفظي مع الشخص الذي يتلقى التعليم.
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: في كل الخيرات
  rationale: صياغة قريبة من اليونانية تحفظ اتساع العبارة، التي يُرجح أن تشمل الخيرات المادية والعملية من غير قصرها عليها.
theological_decisions:
- issue: طبيعة المشاركة المأمور بها
  choice: مشاركة المعلّم في كل الخيرات، بما يُرجح أنه يشمل الدعم المادي والعملي
  alternative: أن يكون المقصود مجرد الشركة الروحية العامة دون دعم مادي
  rationale: اقتران κοινωνέω بمن يتلقى المشاركة بصيغة المجرور، مع عبارة «في كل الخيرات»، يرجح المشاركة العملية، لكن النص أوسع من أن يحصرها في المال؛ لذلك أبقت الترجمة هذا التوتر الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «يتلقّى التعليم» بدل مصطلح كنسي تقني، وحُفظت «الكلمة» و«كل الخيرات» لقربهما من الأصل واتساع دلالتهما.
