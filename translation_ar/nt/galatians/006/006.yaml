  rationale: تستبدل المراجعة «يشارك» بـ«يُشرك» لتوضيح أن الشخص المتلقي للتعليم يجعل معلّمه شريكًا في الخيرات، وهو الأقرب إلى البنية اليونانية في هذا السياق. كما تُسلس العبارة الخاصة بتعليم الكلمة، وتحافظ على اتساع «كل الخيرات» وعلى موضع مرساة الحاشية.
