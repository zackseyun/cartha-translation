source:
  edition: SBLGNT
  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: ar
  text: مِنَ الآنَ فصاعدًا، لا يُسبِّبْ لي أحدٌ متاعبَ، لأنني أحمل في جسدي علاماتِ يسوعَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «وسوم يسوع»؛ فقد تدل الكلمة على علامات في الجسد تُعرِّف بملكية الشخص أو بانتمائه.
    reason: بديل معجمي يوضح الدلالة الخاصة المحتملة لكلمة στίγματα من غير فرضها في المتن.
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: مِنَ الآنَ فصاعدًا
  rationale: تعبير زمني اصطلاحي يفيد «من الآن فصاعدًا»، وهو واضح وطبيعي في العربية المعاصرة.
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: لا يُسبِّبْ لي أحدٌ متاعبَ
  rationale: التركيب κόπους παρέχειν يعني إحداث المتاعب أو الإزعاج، وصيغة النهي مع μηδείς محفوظة بوضوح.
- source_word: τὰ στίγματα
  choice: علاماتِ
  rationale: لفظ محايد يحفظ إمكان أن تكون العلامات آثار جراح جسدية أو سمات دالة على الملكية والانتماء، من غير حسم زائد.
- source_word: τοῦ Ἰησοῦ
  choice: يسوعَ
  rationale: الإضافة «علامات يسوع» تحافظ على سعة دلالة المضاف إليه اليوناني، دون تقييده بمعنى «لأجل يسوع» أو «الدالة على الانتماء إلى يسوع».
- source_word: ἐν τῷ σώματί μου
  choice: في جسدي
  rationale: ترجمة مباشرة وطبيعية لحرف الجر ἐν، وتلائم كون العلامات محمولة في الجسد.
- source_word: βαστάζω
  choice: أحمل
  rationale: ينقل معنى الحمل أو التحمل بعبارة عربية واضحة، مع بقاء النبرة الجادة للنص.
theological_decisions:
- issue: طبيعة علامات بولس (στίγματα)
  choice: «علامات يسوع» بصياغة محايدة
  alternative: «ندوب يسوع» أو «وسوم تدل على أنني ملك ليسوع»
  rationale: قد تشير الكلمة إلى آثار جسدية ناجمة عن الاضطهاد، وإلى علامات انتماء ليسوع، أو إلى الأمرين معًا. أبقت الترجمة هذا التوتر الدلالي واللاهوتي دون حسمه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغة النهي «لا يُسبِّبْ» وحُفظت الإضافة الموجزة «علامات يسوع» لتجنب الإفراط في التفسير.
