  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: ar
  text: أيها الإخوة[a]، وإن وقع إنسان، على حين غرّة، في زلّة[b]، فأنتم يا من أنتم روحيون أعيدوا مثل هذا إلى الصواب بروح الوداعة، وانتبه أنت إلى نفسك، لئلّا تُجرَّب أنت أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«الإخوة» ترجمة لصيغة جمع مذكر قد تُستعمل لمخاطبة جماعة المؤمنين رجالًا ونساءً؛ ويمكن التعبير عن المقصود: «الإخوة والأخوات».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «إن ضُبط إنسان في زلّة» أو «إن أدركته زلّة». قد يفيد الفعل أن الزلّة باغتته أو أدركته، وقد يفيد أنه ضُبط فيها.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδελφοί
  choice: أيها الإخوة
  rationale: صيغة نداء طبيعية وفصيحة في العربية، وتحافظ على الجمع المذكر في الأصل، مع بيان إمكان شموله المؤمنات في الحاشية.
- source_word: ἐὰν καὶ
  choice: حتى إن
  rationale: تنقل القوة الشرطية ذات النبرة الاستدراكية أو التنازلية، بأسلوب عربي واضح.
- source_word: προλημφθῇ
  choice: وقع ... على حين غرّة
  rationale: تعكس احتمال أن يكون الشخص قد أدركته الزلة أو باغتته، ولا تحصر المعنى في اكتشاف الآخرين له وهو يرتكبها.
- source_word: ἄνθρωπος
  choice: إنسان
  rationale: ينقل الاسم اليوناني العام الدال على شخص بشري، مع إبقاء الإفراد الذي يتابعه النص.
- source_word: ἔν τινι παραπτώματι
  choice: في زلّة
  rationale: «زلّة» تنقل صورة الخطوة الخاطئة والدلالة الأخلاقية لكلمة παράπτωμα دون مصطلح تقني ثقيل؛ والتنكير يؤدي معنى τινι في هذا السياق.
- source_word: οἱ πνευματικοὶ
  choice: يا من أنتم روحيون
  rationale: يحافظ على الوصف الواسع في اليونانية، فلا يحصره صراحة في النضج الروحي ولا يستبدله بتفسير مثل «المنقادون بالروح».
- source_word: καταρτίζετε
  choice: فأصلحوا
  rationale: فعل أمر يدل على ردّ الشخص إلى حال سليمة وتقويم ما اختل، وهو موجز وطبيعي في العربية.
- source_word: τὸν τοιοῦτον
  choice: مثل هذا
  rationale: يحافظ على الإشارة المفردة إلى الشخص المذكور دون زيادة تفسيرية.
- source_word: ἐν πνεύματι πραΰτητος
  choice: بروح الوداعة
  rationale: يحفظ تركيب «الروح» وإمكان دلالته على خُلُق الإنسان أو على وداعة يصوغها روح الله، دون حسم غير لازم.
- source_word: σκοπῶν σεαυτόν
  choice: وانتبه أنت إلى نفسك
  rationale: يحافظ على انتقال الأصل المقصود من خطاب الجمع إلى مخاطبة الفرد بالمفرد، ويؤدي معنى المراقبة الحذرة للنفس بعبارة عربية واضحة.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: لئلّا تُجرَّب أنت أيضًا
  rationale: يحفظ صيغة الغاية التحذيرية والمبني للمجهول، كما يبقي معنى πειράζω مفتوحًا بين التجربة المؤدية إلى السقوط والامتحان، وإن كان سياق الإغراء بالخطيئة هو الأرجح.
theological_decisions:
- issue: شمول صيغة Ἀδελφοί
  choice: إبقاء «الإخوة» في المتن مع توضيح شمول الخطاب المحتمل في الحاشية
  alternative: أيها الإخوة والأخوات
  rationale: الأصل يستعمل جمعًا مذكرًا يمكن أن يخاطب جماعة مختلطة؛ إبقاء الصيغة في المتن أكثر شفافية، والحاشية تمنع فهمها على أنها تستبعد المؤمنات.
- issue: معنى προλημφθῇ
  choice: وقع ... على حين غرّة
  alternative: ضُبط في زلّة؛ أو أدركته زلّة
  rationale: للفعل احتمال أن يدل على مباغتة الزلة للشخص أو إدراكها له، كما قد يُفهم بمعنى ضبطه فيها. اختيرت صياغة لا تختزل المعنى في اكتشاف الجرم، مع حفظ البدائل في الحاشية.
- issue: دلالة πνεύματι في «روح الوداعة»
  choice: إبقاء «بروح الوداعة» دون تعيين صريح
  alternative: بوداعة يصنعها الروح القدس؛ أو بروح إنسانية وديعة
  rationale: التركيب اليوناني يسمح بفهمه على أنه هيئة الإنسان الداخلية، مع صدى واضح لعمل الروح في سياق الرسالة. الترجمة لا تحسم هذا التوتر.
- issue: الانتقال من الجمع إلى المفرد في التحذير
  choice: 'الحفاظ على المفرد: «وانتبه أنت إلى نفسك»'
  alternative: ولينتبه كل واحد منكم إلى نفسه
  rationale: يحافظ الاختيار على المواجهة الشخصية المباشرة في σκοπῶν σεαυτόν وμὴ καὶ σὺ، بينما البديل أوضح أسلوبيًا لكنه يضيف عبارة غير موجودة صراحة.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعمل «أيها الإخوة» للنداء الكنسي الطبيعي، و«زلّة» للدلالة الأخلاقية المفهومة، مع الإبقاء على التحول اللافت من خطاب الجمع إلى المفرد. جميع علامتي الحاشية [a] و[b] واردتان في المتن.
