  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: ar
  text: فَإِنَّ الْخِتَانَ لَا قِيمَةَ لَهُ، وَلَا عَدَمَ الْخِتَانِ، بَلِ الْخَلِيقَةُ الْجَدِيدَةُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بل خليقة جديدة»؛ ويجوز، على نحو أقل ترجيحًا في السياق: «بل مخلوق جديد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: فَلَا
  rationale: الفاء تنقل وظيفة γάρ التفسيرية والارتباط بما سبق، و«لا... ولا» تؤدي تركيب οὔτε... οὔτε طبيعيًّا في العربية.
- source_word: περιτομή
  choice: الختان
  rationale: المقابل العربي المألوف الذي يحفظ دلالة الشعيرة المادية وما تشير إليه من هوية في السياق البولسي.
- source_word: τί ἐστιν
  choice: له أية قيمة
  rationale: ينقل التعبير الاصطلاحي الدال على انعدام القيمة الحاسمة، بصياغة عربية واضحة من غير توسيع المعنى.
- source_word: οὔτε ἀκροβυστία
  choice: ولا عدم الختان
  rationale: يعبّر عن حالة غير المختون بوصفها الطرف المقابل للختان، ويتجنب اللفظ التشريحي المضلل في هذا السياق.
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد الإضراب والمقابلة القوية، فتبرز ما له الاعتبار الحقيقي بعد نفي القيمة عن الحالتين.
- source_word: καινὴ κτίσις
  choice: الخليقة الجديدة
  rationale: تحفظ سعة κτίσις التي قد تشير إلى فعل الخلق أو الواقع المخلوق الجديد، ولا تحصرها في فرد بوصفه «مخلوقًا جديدًا».
theological_decisions:
- issue: دلالة المقابلة بين الختان وعدم الختان والخليقة الجديدة
  choice: ينفي النص القيمة الحاسمة لكلتا الحالتين، ويجعل موضع الاعتبار في الخليقة الجديدة.
  alternative: أن يكون الكلام محصورًا في العلامات الاجتماعية، أو أن تكون كلتا الحالتين طريقين متكافئين.
  rationale: المقابلة اليونانية تنفي أن يكون أي من الوضعين «شيئًا» ذا اعتبار، ثم تقابلهما بالخليقة الجديدة؛ والصياغة تحافظ على ذلك من غير إضافة إطار مذهبي.
- issue: مدى دلالة καινὴ κτίσις
  choice: الخليقة الجديدة
  alternative: مخلوق جديد
  rationale: «الخليقة» تبقي مفتوحًا ما إذا كان التركيز على واقع الخلق الجديد الواسع أو على الشخص المتجدد، وهو الأنسب لغموض العبارة الموجزة.
translation_notes:
  register: لغة عربية فصحى واضحة وموجزة ذات نبرة كتابية كريمة. استُخدمت «الخليقة» للمحافظة على اتساع العبارة اليونانية، ووُضع مؤشر الحاشية في المتن كما يلزم.
