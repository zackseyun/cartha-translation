  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: ar
  text: احملوا أثقال بعضكم بعضًا، وبهذه الطريقة ستتمّمون شريعة المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλήλων
  choice: بعضكم ... بعض
  rationale: تعبير عربي متبادل يحفظ معنى المشاركة المتبادلة داخل الجماعة.
- source_word: τὰ βάρη
  choice: أثقال
  rationale: ينقل صورة الأوزان التي يحملها المرء، مع دلالتها المجازية على المتاعب والمشقات.
- source_word: βαστάζετε
  choice: احملوا
  rationale: فعل أمر للجمع، واضح وطبيعي، ويحافظ على صورة حمل الأثقال.
- source_word: οὕτως
  choice: بهذه الطريقة
  rationale: يربط تنفيذ الوصية بالنتيجة التالية ربطًا صريحًا وطبيعيًا.
- source_word: ἀναπληρώσετε
  choice: ستتمّمون
  rationale: يحفظ صيغة المستقبل في النص اليوناني، ويفيد بلوغ مقتضى الناموس وإتمامه.
- source_word: τὸν νόμον
  choice: ناموس
  rationale: يحفظ المصطلح القانوني واللاهوتي في سياق بولس، مع ذكر «شريعة» بوصفها صياغة عربية بديلة.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: ينقل اللقب Χριστός بمعناه، وهو التعبير العربي الطبيعي الراسخ.
theological_decisions:
- issue: معنى «ناموس المسيح»
  choice: ناموس المسيح
  alternative: شريعة المسيح
  rationale: أُبقيت علاقة الإضافة في اليونانية من غير تحديد ما إذا كان المقصود الناموس الصادر عن المسيح أو الخاص به أو المتصف بتعليمه.
- issue: ترجمة Χριστοῦ
  choice: المسيح
  alternative: لا يوجد في العربية تمييز طبيعي موازٍ للفرق الإنجليزي بين Messiah وChrist
  rationale: كلا اللفظين الإنجليزيين يرجعان في العربية إلى اللقب «المسيح»، لذلك لا تُنشأ مغايرة مصطنعة لا يدل عليها النص اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صورة حمل الأثقال، وصيغة الأمر للجمع، ومستقبل النتيجة، كما تُركت إضافة «ناموس المسيح» على اتساعها الدلالي من غير تفسير مذهبي.
