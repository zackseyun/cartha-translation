- source_word: τὸ ἴδιον
  choice: حِملَه الخاصَّ
  rationale: ينقل معنى ما يخص الشخص نفسه، مع إبقاء الصيغة المفردة المذكرة الموافقة للبنية اليونانية.
- source_word: φορτίον
  choice: حِمل
  rationale: يدل على ما يُحمَل، واختيار «حِمل» يميزه من «الأثقال» في العدد 2، من غير أن يفرض تفسيرًا لاهوتيًا محددًا للعلاقة بين العددين.
- source_word: βαστάσει
  choice: سيحمل
  rationale: ينقل صيغة المستقبل المعلوم بعبارة عربية مباشرة وطبيعية، ويلائم الاسم «حِمل».
theological_decisions:
- issue: علاقة غلاطية 6:5 بغلاطية 6:2
  choice: الحفاظ على التمييز المعجمي بين «الأثقال» في العدد 2 و«الحِمل» هنا، مع إبقاء التوتر الدلالي في النص.
  alternative: ترجمة اللفظين بكلمة «ثِقل» أو تفسير هذا العدد صراحةً على أنه يتحدث عن المسؤولية في الدينونة الأخيرة.
  rationale: يستعمل بولس اسمين يونانيين مختلفين في السياق القريب. يحفظ هذا الاختيار الفرق من غير افتعال تناقض أو إدخال حل عقائدي غير مصرَّح به في النص.
translation_notes:
