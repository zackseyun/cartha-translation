id: GAL.6.12
reference: Galatians 6:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: ar
  text: إن الذين يريدون أن يظهروا بمظهر حسن في الجسد[a] هم الذين يُلزمونكم أن تختتنوا، وما ذلك إلا لئلا يُضطهدوا بسبب صليب المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن يتركوا انطباعًا حسنًا في الظاهر».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «من أجل صليب المسيح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: إن الذين
  rationale: تفيد شمول كل من ينطبق عليهم الوصف، وتأتي في العربية المعاصرة بصياغة طبيعية تمهّد للجملة المؤكدة.
- source_word: θέλουσιν
  choice: يريدون
  rationale: تنقل دلالة الإرادة نقلًا مباشرًا وواضحًا.
- source_word: εὐπροσωπῆσαι
  choice: أن يظهروا بمظهر حسن
  rationale: تؤدي معنى تقديم النفس بصورة مستحسنة أو مثيرة للإعجاب، مع إبقاء نقد الاهتمام بالمظهر الخارجي.
- source_word: ἐν σαρκί
  choice: في الجسد
  rationale: تحافظ على لفظ بولس المميز وعلى احتماله اللاهوتي، بينما توضّح الحاشية دلالته السياقية الخارجية.
- source_word: οὗτοι
  choice: هم الذين
  rationale: تحفظ توكيد اسم الإشارة اليوناني بإبراز أن هؤلاء أنفسهم هم أصحاب هذا الفعل.
- source_word: ἀναγκάζουσιν
  choice: يُلزمونكم
  rationale: تفيد ممارسة الضغط والإكراه المستمر، وهي أفصح وأطبع هنا من صياغة حرفية ثقيلة.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: أن تختتنوا
  rationale: تنقل الأمر المطلوب منهم بوضوح؛ وصيغة الافتعال العربية هي التعبير المألوف عن الخضوع للختان.
- source_word: μόνον ἵνα
  choice: وما ذلك إلا لئلا
  rationale: تحفظ قصر الدافع عليهم، وتوصل غاية تجنب الاضطهاد بصياغة عربية طبيعية.
- source_word: τῷ σταυρῷ
  choice: بسبب صليب
  rationale: تجعل العلاقة السببية أوضح في العربية؛ أي إنهم يتجنبون الاضطهاد الناشئ عن صليب المسيح.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: لفظ Χριστός هنا لقب في تركيب إضافي، و«المسيح» ينقل معناه المتداول عربيًا دون تحويله إلى اسم مجرد.
- source_word: μὴ διώκωνται
  choice: لئلا يُضطهدوا
  rationale: تنقل المبني للمجهول وغرض تجنب الاضطهاد بدقة وإيجاز.
theological_decisions:
- issue: دلالة ἐν σαρκί
  choice: في الجسد
  alternative: في الظاهر / في الأمور الخارجية
  rationale: أُبقي تعبير بولس «الجسد» في المتن كي لا تُختزل دلالته في المظهر الخارجي وحده، مع بيان المعنى السياقي المحتمل في الحاشية.
- issue: دلالة Χριστοῦ في τῷ σταυρῷ τοῦ Χριστοῦ
  choice: صليب المسيح
  alternative: صليب الممسوح
  rationale: «المسيح» هو المقابل العربي الطبيعي والراسخ للقب Χριστός، ويحافظ هنا على صفته اللقبية.
- issue: علاقة الداتيف τῷ σταυρῷ بالفعل διώκωνται
  choice: بسبب صليب المسيح
  alternative: من أجل صليب المسيح / فيما يتعلق بصليب المسيح
  rationale: 'يرجح السياق الدلالة السببية: غايتهم تفادي الاضطهاد الذي يترتب على التمسك برسالة الصليب، مع الإقرار بأن الصياغة اليونانية موجزة ويمكن فهمها بوصفها علاقة أو مرجعًا.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوكيد في οὗτοι بصيغة «هم الذين»، وحُفظ مصطلح «الجسد» في المتن مع شرح دلالته السياقية في الحاشية.
