  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: ar
  text: ولكن ليمتحن كلُّ واحدٍ عمله هو، وحينئذٍ يكون له ما يفتخر به فيما يخص نفسه وحده، لا فيما يخص الآخر[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «لا فيما يخص الآخر»؛ والمقصود شخص آخر في مقابل المرء نفسه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργον
  choice: عمله
  rationale: «العمل» أوسع مقابل عربي طبيعي، ويشمل هنا ما يفعله المرء أو مسلكه دون حصر المعنى في فعل واحد.
- source_word: δοκιμαζέτω
  choice: ليَمتحن
  rationale: يحفظ معنى فحص الشيء للتحقق من صفته، من غير افتراض مسبق أن نتيجة الفحص ستكون إيجابية.
- source_word: ἕκαστος
  choice: كلُّ واحدٍ
  rationale: يحافظ على القوة التوزيعية للمفرد وعلى اتساقها مع الضمائر والأفعال المفردة في الآية.
- source_word: ἑαυτοῦ
  choice: عمله هو
  rationale: 'إضافة ضمير الفصل «هو» تُبرز القوة الانعكاسية: عمل الشخص نفسه، في مقابل مقارنة نفسه بغيره.'
- source_word: καύχημα
  choice: ما يفتخر به
  rationale: صياغة عربية طبيعية تبقي اللفظ محتملًا لموضوع الافتخار أو أساسه، ولا تحوّله إلى مفهوم إيجابي حديث مثل الاعتزاز بالنفس.
- source_word: εἰς ἑαυτὸν μόνον
  choice: في نفسه وحده
  rationale: ينقل التركيز الانعكاسي وقوة μόνον، ويبيّن أن موضع التقييم هو الشخص نفسه لا المقارنة بغيره.
- source_word: τὸν ἕτερον
  choice: الآخر
  rationale: مقابل موجز وأمين لعبارة «الآخر»، والمقصود شخص آخر في مقابل الذات؛ وقد وُضّح ذلك في الحاشية.
- source_word: δέ
  choice: ولكن
  rationale: تدل على انتقال تقابلي لطيف مع السياق السابق.
theological_decisions:
- issue: دلالة καύχημα في السياق البولسي
  choice: «ما يفتخر به»
  alternative: «سبب للافتخار» أو «موضع افتخار»
  rationale: تحفظ الصياغة التوتر الدلالي بين فعل الافتخار وأساسه، ولا تحسم إن كان الكلام عن رضا مشروع عن النفس أم أساس للثقة أمام الله.
- issue: المفرد المذكر ذو الدلالة العامة
  choice: الإبقاء على صيغة المفرد المذكر في «عمله» و«له» و«نفسه»
  alternative: صياغة جمع محايدة مثل «أعمالهم» و«لهم»
  rationale: اليونانية تستعمل مفردًا مذكرًا ذا قوة عامة، والعربية الفصحى تستخدم المفرد المذكر كذلك للدلالة العامة من غير اضطراب أسلوبي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «ليَمتحن» للحفاظ على معنى الفحص، و«ما يفتخر به» لصياغة καύχημα طبيعيًّا مع إبقاء اتساعه الدلالي. وُضع مؤشر الحاشية بعد العبارة التي تشرحها مباشرة.
