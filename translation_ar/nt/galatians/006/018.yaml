  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: ar
  text: نِعْمَةُ رَبِّنَا يَسُوعَ الْمَسِيحِ مَعَ رُوحِكُمْ، أَيُّهَا الإِخْوَةُ[a]. آمِين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يخاطب لفظ «الإخوة» هنا جماعة المؤمنين، وقد يشمل الرجال والنساء؛ ويمكن أن يقال: «أيها الإخوة والأخوات».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: نِعْمَةُ
  rationale: المقابل العربي المألوف في بركات بولس الختامية، ويحفظ معنى الإحسان الإلهي ووزنه اللاهوتي.
- source_word: κυρίου
  choice: رَبِّنَا
  rationale: «الرَّب» هو المقابل العربي الطبيعي للقب κύριος في الاستعمال الاعترافي المسيحي، والضمير يترجم ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: «يسوع» اسم منقول، و«المسيح» يترجم اللقب Χριστός ترجمة راسخة في العربية وتحفظ دلالته اللقبية.
- source_word: μετὰ
  choice: مَعَ
  rationale: حافظت الصياغة العربية الاسمية على أسلوب البركة اليوناني الخالي من الفعل، وهي طبيعية من غير إضافة «لتكن».
- source_word: πνεύματος ὑμῶν
  choice: رُوحِكُمْ
  rationale: ترجمة مباشرة تحفظ المفرد «روح» مع ضمير المخاطبين الجمع، فلا تُسوّى العبارة إلى مجرد «معكم».
- source_word: ἀδελφοί
  choice: أَيُّهَا الإِخْوَةُ
  rationale: صيغة نداء عربية طبيعية تحافظ على الجمع المذكر في الأصل، مع بيان إمكان شموله المؤمنات في الحاشية.
- source_word: ἀμήν
  choice: آمِين
  rationale: النقل العربي الكنسي المألوف لصيغة التصديق والختام.
theological_decisions:
- issue: دلالة Χριστός في البركة الختامية
  choice: الْمَسِيحِ
  alternative: كريستوس
  rationale: اللفظ اليوناني لقب ذو معنى، و«المسيح» هو المقابل العربي الدلالي والراسخ، فلا يُعامل كجزء ثانٍ من الاسم ولا يُكتفى بنقله صوتيًا.
- issue: مدى المخاطَبين بلفظ ἀδελφοί
  choice: الإِخْوَةُ
  alternative: الإخوة والأخوات
  rationale: حُفظت الصيغة المذكرة في النص، مع عدم حصر الخطاب في الرجال؛ إذ قد يستعمل الجمع المذكر في اليونانية لمجمل جماعة المؤمنين، وقد وُضّح ذلك في الحاشية.
translation_notes:
  register: عربية فصحى واضحة ووقورة بصياغة بركة اسمية موجزة تماثل تركيب الأصل. استُخدم الضبط الجزئي لتيسير القراءة، وحُفظت «روحكم» كما في اليونانية بدل تعميمها إلى «معكم».
