revisions:
- from: أَمَّا أَنَا، فَحَاشَا لِي أَنْ أَفْتَخِرَ إِلَّا بِصَلِيبِ رَبِّنَا يَسُوعَ الْمَسِيحِ؛ وَبِهِ[a] قَدْ صُلِبَ الْعَالَمُ لِي، وَأَنَا لِلْعَالَمِ.
  to: أَمَّا أَنَا، فَحَاشَا لِي أَنْ أَفْتَخِرَ إِلَّا بِصَلِيبِ رَبِّنَا يَسُوعَ الْمَسِيحِ؛ وَبِهِ[a] قَدْ صُلِبَ الْعَالَمُ بِالنِّسْبَةِ إِلَيَّ، وَأَنَا بِالنِّسْبَةِ إِلَى الْعَالَمِ.
  rationale: توضّح «بالنسبة إليّ/إلى العالم» علاقة الانفصال المقصودة بالداتيف اليوناني من غير تفسير زائد، وتحفظ حذف الفعل في الشطر الثاني وتوازيه مع الشطر الأول. ويُعدَّل الهامش ليعكس أولوية البنية اليونانية مع إبقاء الاحتمال التفسيري الآخر.
