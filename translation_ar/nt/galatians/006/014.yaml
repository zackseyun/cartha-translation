review_pass:
  verdict: revise
  source_fidelity: 'الترجمة تنقل البنية الأساسية للآية بأمانة: الرفض الشخصي الشديد، والقصر في الافتخار على الصليب، وصيغة المبني للمجهول التام في «ἐσταύρωται»، والتوازي الحذفي في الشطر الأخير. غير أن «صُلِبَ العالَمُ لي» قد تُفهم في العربية المعاصرة على أنها «صُلِبَ لأجلي»، بينما دلالة الداتيف هنا هي علاقة الانفصال/الاعتبار: العالم صار مصلوبًا بالنسبة إلى بولس، وهو بالنسبة إلى العالم. كما أن الإحالة الأقرب نحويًا للضمير اليوناني هي «الصليب»، مع بقاء قراءة عوده إلى المسيح احتمالًا تفسيريًا ينبغي أن يظل في الهامش لا أن يُسوّى بالقراءة النحوية المباشرة.'
  naturalness: «فحاشا لي أن أفتخر» فصيحة ملائمة للسجل الوقور. وتحتاج علاقة «لي/للعالم» إلى صياغة أوضح في الفصحى الحديثة لتفادي معنى النفع («لأجلي»).
  terminology: «الصليب»، «ربنا»، و«يسوع المسيح» مقابلات مستقرة ودقيقة. و«وبه» تحافظ في المتن على إمكان الإحالة، لكن الهامش ينبغي أن يبيّن أن «الصليب» هو المرجع النحوي الأقرب، لا مجرد أحد احتمالين متكافئين.
  issues:
  - severity: medium
    issue: التعبير «قَدْ صُلِبَ الْعَالَمُ لِي» ملتبس في العربية الحديثة.
    rationale: 'قد يحمل «لي» معنى «لأجلي»، بخلاف الداتيف اليوناني الذي يصف انفصالًا متبادلًا أو علاقة اعتبار: العالم مصلوب بالنسبة إلى المتكلم، وهو مصلوب بالنسبة إلى العالم.'
  - severity: low
    issue: صياغة الهامش لا تبيّن ترجيح المرجع النحوي المباشر للضمير.
    rationale: الضمير ὅς مذكّر مفرد ويطابق «σταυρῷ» (الصليب) نحويًا؛ أما إحالته إلى الرب يسوع المسيح فقراءة ممكنة تفسيريًا، لا المرجع الأقرب في التركيب.
  revised_text: أَمَّا أَنَا، فَحَاشَا لِي أَنْ أَفْتَخِرَ إِلَّا بِصَلِيبِ رَبِّنَا يَسُوعَ الْمَسِيحِ؛ وَبِهِ[a] قَدْ صُلِبَ الْعَالَمُ بِالنِّسْبَةِ إِلَيَّ، وَأَنَا بِالنِّسْبَةِ إِلَى الْعَالَمِ.
