  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: ar
  text: أَمَّا أَنَا، فَحَاشَا لِي أَنْ أَفْتَخِرَ إِلَّا بِصَلِيبِ رَبِّنَا يَسُوعَ الْمَسِيحِ؛ وَبِهِ[a] قَدْ صُلِبَ الْعَالَمُ بِالنِّسْبَةِ إِلَيَّ، وَأَنَا بِالنِّسْبَةِ إِلَى الْعَالَمِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'المرجع النحوي الأقرب للضمير هو «الصليب»، فيكون المعنى: «وبالصليب». ويمكن أن يُفهم أيضًا على أنه عائد إلى الرب يسوع المسيح، فيكون المعنى: «وبه».'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: فَحَاشَا لِي
  rationale: تعبير عربي فصيح وطبيعي يدل على الرفض الشديد، ويحفظ الصيغة الشخصية في اليونانية.
- source_word: καυχᾶσθαι
  choice: أَنْ أَفْتَخِرَ
  rationale: ينقل معنى التباهي أو الاعتزاز الذي يتكرر عند بولس، وهو واضح في سياق مقابلة الافتخار بالصليب بالافتخار بعلامات الجسد.
- source_word: εἰ μὴ
  choice: إِلَّا
  rationale: تفيد الاستثناء، أي إن الصليب هو وحده موضع الافتخار المقبول هنا.
- source_word: σταυρῷ
  choice: بِصَلِيبِ
  rationale: المقابل العربي المألوف والدقيق في سياق آلام يسوع وفي الاستعمال البولسي.
- source_word: κυρίου
  choice: رَبِّنَا
  rationale: يحفظ اللقب الاعترافي والسياق العهدي لعبارة «ربنا».
- source_word: Χριστοῦ
  choice: الْمَسِيحِ
  rationale: يترجم اللقب Χριστός بمعناه، بدل الاكتفاء بنقله صوتيًا.
- source_word: δι’ οὗ
  choice: وَبِهِ
  rationale: يحفظ معنى الوساطة أو الأداة، كما يحافظ الضمير العربي على إمكان عوده إلى الصليب أو إلى الرب يسوع المسيح.
- source_word: κόσμος
  choice: الْعَالَمُ
  rationale: المقابل القياسي الواسع، مع بقاء دلالة النظام العالمي المناوئ لله مستفادة من السياق.
- source_word: ἐσταύρωται
  choice: قَدْ صُلِبَ
  rationale: يحفظ صورة الصلب، وتساعد «قد» مع الماضي على التعبير عن الفعل المكتمل ذي الأثر القائم.
- source_word: κἀγὼ κόσμῳ
  choice: وَأَنَا لِلْعَالَمِ
  rationale: يحفظ حذف الفعل في الأصل والتوازي المكثف، مع فهم «صُلِبت» من العبارة السابقة.
theological_decisions:
- issue: دلالة Χριστοῦ في «Ἰησοῦ Χριστοῦ»
  choice: يَسُوعَ الْمَسِيحِ
  alternative: يسوع المسيح من حيث استعمال «المسيح» كاسم مألوف دون إبراز دلالته اللقبية
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، ويحفظ مضمونه المسياني دون إضافة مذهبية.
- issue: مرجع الضمير في δι’ οὗ
  choice: وَبِهِ، مع إبقاء الضمير محتمِلًا للصليب وللرب يسوع المسيح
  alternative: 'وبهذا الصليب؛ أو: وبالذي/بمَن به، على أن المرجع هو المسيح'
  rationale: الضمير اليوناني المذكر يمكن من جهة الصيغة أن يعود إلى «الصليب» أو إلى «الرب يسوع المسيح»، وكلاهما مذكر. والصياغة العربية «وبه» تحافظ على هذا الاحتمال بدل حسمه داخل المتن.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «فحاشا لي» لقوة الرفض، وحُفظ الإيجاز والتوازي في «والعالم لي، وأنا للعالم». وُضع الهامش عند الضمير نفسه لتوضيح موضع الاحتمال النحوي.
