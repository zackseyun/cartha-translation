  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: ar
  text: 'افرحوا في الرب دائمًا[a]؛ سأقول مرة أخرى[b]: افرحوا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ابتهجوا في الرب في كل حين».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «مرة أخرى سأقول: افرحوا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε
  choice: افرحوا
  rationale: فعل أمر حاضر للمخاطبين بصيغة الجمع. «افرحوا» ينقل قوة الحث بوضوح ويحافظ على دلالة χαίρω الطبيعية في وصايا بولس.
- source_word: ἐν
  choice: في
  rationale: تفيد على الأرجح المجال أو العلاقة هنا؛ أي الفرح في صلة بالرب واتحاد به. وتحافظ «في» على هذا الاتساع من غير حسمه في معنى سببي أو وسائلي.
- source_word: κυρίῳ
  choice: الرب
  rationale: المقابل العربي المألوف والدقيق لـ κύριος في هذا السياق، حيث تشير العبارة في استعمال بولس إلى المسيح.
- source_word: πάντοτε
  choice: دائمًا
  rationale: تعبير عربي طبيعي موجز ينقل معنى الاستمرار الذي يحمله الظرف.
- source_word: πάλιν
  choice: أيضًا
  rationale: في تركيب «وأقول أيضًا» تدل على إعادة القول وتأتي عربية سليمة، مع بيان الحرفية الأقرب في الحاشية.
- source_word: ἐρῶ
  choice: أقول
  rationale: المضارع العربي هنا أسلس في صيغة الإعلان الخطابي، مع أن اليونانية تستعمل المستقبل «سأقول»؛ لذلك أُثبت الفرق في الحاشية بدل إثقـال المتن.
- source_word: χαίρετε
  choice: افرحوا
  rationale: تكرار صيغة الأمر نفسها يحفظ توكيد بولس البلاغي.
theological_decisions:
- issue: معنى «في الرب»
  choice: 'الإبقاء على «في الرب» بما يسمح بفهمها بوصفها مجالًا أو علاقة: يفرح المؤمنون في صلتهم بالرب واتحادهم به، لا لمجرد الفرح بشأنه.'
  alternative: أن تكون للوسيلة، أي بقوة الرب؛ أو للسبب، أي بسبب الرب.
  rationale: عبارة ἐν κυρίῳ عند بولس كثيرًا ما تدل على المجال أو العلاقة. والصياغة العربية الحرفية الطبيعية تحفظ هذا الاتساع والتوتر اللاهوتي من غير تفسير زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. حوفظ على تكرار فعل الأمر وعلى عبارة «في الرب» دون توسيع تفسيري، مع وضع علامتي الحاشية [a] و[b] في المتن.
