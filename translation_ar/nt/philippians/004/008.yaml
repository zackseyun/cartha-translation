  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: ar
  text: وأخيرًا، أيها الإخوة[a]، كل ما هو حق، وكل ما هو جدير بالاحترام، وكل ما هو عادل، وكل ما هو طاهر، وكل ما هو مُحبَّب، وكل ما هو حسن الذكر، إن وُجدت فضيلة، وإن وُجد ما يستحق المدح، ففي هذه الأمور فكّروا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أيها الإخوة والأخوات»؛ فلفظة «الإخوة» اليونانية قد يُخاطَب بها مجتمع المؤمنين كله.'
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: وأخيرًا
  rationale: أداة انتقال إلى وصية ختامية؛ «وأخيرًا» عربية طبيعية وتحفظ القوة الانتقالية، مع احتمال معنى «أما بعد» أو «فيما بقي» بحسب السياق.
- source_word: ἀδελφοί
  choice: أيها الإخوة[a]
  rationale: يحافظ على صيغة الجمع المذكر في اليونانية وعلى أسلوب الخطاب الرسولي، مع بيان إمكان شمول جماعة المؤمنين كلها في الحاشية.
- source_word: ὅσα
  choice: كل ما هو
  rationale: يحفظ التكرار التوزيعي في القائمة ويأتي واضحًا وطبيعيًا في العربية.
- source_word: ἀληθῆ
  choice: حق
  rationale: ينقل المعنى الواسع لما هو صادق وحقيقي في هذا السياق الأخلاقي والفكري.
- source_word: σεμνά
  choice: جدير بالاحترام
  rationale: يعبّر بوضوح عن الوقار والقيمة الأخلاقية اللذين يستحقان التقدير، دون حصر اللفظ في معنى رسمي ضيق.
- source_word: δίκαια
  choice: عادل
  rationale: ينقل معنى الاستقامة والعدل في سياق قائمة الفضائل، من غير إضفاء اصطلاح لاهوتي أضيق من السياق.
- source_word: ἁγνά
  choice: طاهر
  rationale: يحفظ الدلالة الأخلاقية والباطنية الواسعة للفظ اليوناني.
- source_word: προσφιλῆ
  choice: محبوب
  rationale: يدل على ما يستدعي المحبة والقبول، وهو مقابل عربي موجز وطبيعي.
- source_word: εὔφημα
  choice: حسن الذكر
  rationale: يقارب معنى ما يُقال عنه كلام حسن أو يتمتع بسمعة طيبة، ويحافظ على تميّزه عن «المدح» الآتي لاحقًا.
- source_word: εἴ τις ἀρετὴ
  choice: إن كانت فضيلة
  rationale: يحافظ على الصيغة الشرطية وعلى الاسم الموجز الدال على الخُلُق الفاضل أو التميز الأخلاقي.
- source_word: εἴ τις ἔπαινος
  choice: وإن كان مدح
  rationale: ترجمة مباشرة تحافظ على التوازي مع العبارة السابقة وعلى احتمال كون المقصود ما يستحق المدح.
- source_word: ταῦτα λογίζεσθε
  choice: ففي هذه الأمور فكّروا
  rationale: ينقل الأمر بالتركيز الذهني المتعمد والتأمل، بصياغة عربية واضحة وطبيعية.
