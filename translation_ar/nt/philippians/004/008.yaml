- from: وأخيرًا، أيها الإخوة[a]، كل ما هو حق، وكل ما هو جدير بالاحترام، وكل ما هو عادل، وكل ما هو طاهر، وكل ما هو محبوب، وكل ما هو حسن الذكر، إن كانت فضيلة وإن كان مدح، ففي هذه الأمور فكّروا.
  to: وأخيرًا، أيها الإخوة[a]، كل ما هو حق، وكل ما هو جدير بالاحترام، وكل ما هو عادل، وكل ما هو طاهر، وكل ما هو مُحبَّب، وكل ما هو حسن الذكر، إن وُجدت فضيلة، وإن وُجد ما يستحق المدح، ففي هذه الأمور فكّروا.
