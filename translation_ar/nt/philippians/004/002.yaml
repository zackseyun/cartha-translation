  choice: أن تتّحدا في الفكر
  alternative: أن تكونا على فكر واحد؛ أن تتّفقا
  rationale: الاختيار يبقي البعد الذهني والموقفي في φρονεῖν، من غير افتراض أن المقصود تطابق الرأي في كل شيء أو مجرد تسوية خلاف محدد.
