- source_word: τὸ αὐτὸ φρονεῖν
  choice: أن تتّحدا في الفكر
  rationale: تحافظ على دلالة التماثل في التوجّه الذهني والموقف، ولا تختزل العبارة في مجرد الاتفاق على مسألة بعينها.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: صياغة موجزة وقريبة من الأصل، وتبقي مجال العلاقة بالرب أو الاتحاد به أساسًا للوحدة المطلوبة.
theological_decisions:
