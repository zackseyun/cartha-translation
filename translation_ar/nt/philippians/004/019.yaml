  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: ar
  text: وإلهي سيسدّ كل احتياج لكم بحسب غناه، في المجد، في المسيح يسوع.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيُوفّر كل ما تحتاجون إليه».'
    reason: بديل تعبيري طبيعي لـπληρώσει πᾶσαν χρείαν ὑμῶν.
  - marker: b
    text: تفيد عبارة «بحسب غناه» أن غنى الله هو مقياس عطائه، لا أن العطاء يأتي من غناه فحسب.
    reason: إيضاح دلالة κατά مع النصب.
  - marker: c
    text: يمكن أيضًا فهم «في المجد» بمعنى «بمجد» أو «على نحو مجيد»، وتبقى صلتها بما يليها محتملة لأكثر من تحليل.
    reason: حفظ الغموض الحقيقي في ἐν δόξῃ وتسلسل العبارتين الجارّتين.
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: وإلهي
  rationale: δέ أداة وصل خفيفة في السياق، فتنقلها الواو طبيعيًا مع الحفاظ على الصيغة الشخصية «إلهي».
- source_word: πληρώσει
  choice: سيسدّ
  rationale: الفعل πληρόω يدل هنا على توفير ما ينقص؛ و«يسدّ الاحتياج» تعبير عربي واضح وطبيعي قريب من المعنى السياقي.
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: كل احتياج لكم
  rationale: تحافظ الصياغة على القوة الشمولية لـπᾶσαν وعلى إضافة الاحتياجات إلى المخاطَبين، من غير أن توحي بأن كل رغبة مشمولة.
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: بحسب غناه
  rationale: κατά مع النصب تفيد هنا المقياس أو المعيار، لا مجرد المصدر؛ لذا «بحسب» أدق من «من غناه».
- source_word: ἐν δόξῃ
  choice: في المجد
  rationale: أُبقيت العبارة الجارّة على صورتها لأن دلالتها وعلاقتها النحوية بما حولها تحتمل أكثر من وجه.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، ويحفظ هنا طابعه المسياني مع وضوح العبارة للقارئ العربي.
theological_decisions:
- issue: العلاقة النحوية والدلالية لعبارتي ἐν δόξῃ وἐν Χριστῷ Ἰησοῦ
  choice: في المجد، في المسيح يسوع
  alternative: 'بمجد، في المسيح يسوع؛ أو: في المجد في المسيح يسوع'
  rationale: يحافظ النص على العبارتين من غير حسم كامل لما إذا كانت «في المجد» تصف كيفية السدّ أو مجاله، ومن غير جعل «في المسيح يسوع» نعتًا محصورًا في «المجد». وُضعت فاصلة لتيسير القراءة لا لفرض تحليل نحوي قاطع.
- issue: هل الوعد يشمل الرغبات أم الاحتياجات
  choice: كل احتياج لكم
  alternative: كل ما تريدونه
  rationale: χρεία تعني الحاجة أو الضرورة، فلا ينبغي توسيع الوعد ليشمل كل رغبة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «يسدّ كل احتياج» بدل الصياغة الحرفية الثقيلة «يملأ كل حاجة»، وأُبقي «في المجد» رسميًا لصون الانفتاح الدلالي في الأصل.
