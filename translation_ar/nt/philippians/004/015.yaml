id: PHP.4.15
reference: Philippians 4:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: ar
  text: وأنتم أيضًا تعلمون، يا أهل فيلبي، أنه في بداية البشارة، حين غادرتُ مكدونية، لم تشاركني أيّة كنيسة في حساب العطاء والأخذ[a] إلا أنتم وحدكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في شأن العطاء والأخذ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδατε δὲ καὶ ὑμεῖς
  choice: وأنتم أيضًا تعلمون
  rationale: يحافظ على الاستمرار الخطابي في δὲ، وعلى القوة الإضافية في καί، وعلى إبراز الضمير ὑμεῖς، بصياغة عربية طبيعية.
- source_word: Φιλιππήσιοι
  choice: يا أهل فيلبي
  rationale: ينقل النداء إلى سكان المدينة بوضوح، وهو أفصح للقارئ العربي من صيغة منقولة قد تُفهم اسمًا لطائفة.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: في بداية البشارة
  rationale: يحفظ صياغة المصدر من غير أن يحدد تأويليًا هل المقصود بدء كرازة بولس عمومًا أم بدء عمله بينهم.
- source_word: ἐξῆλθον ἀπὸ Μακεδονίας
  choice: غادرتُ مكدونية
  rationale: تعبير عربي واضح ودقيق عن حدث الخروج من الإقليم.
- source_word: οὐδεμία μοι ἐκκλησία ἐκοινώνησεν
  choice: لم تشاركني أيّة كنيسة
  rationale: ينقل معنى المشاركة العملية مع بولس من غير حصر الفعل في مجرد التبرع أو إضفاء معنى تجاري صرف.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: في حساب العطاء والأخذ
  rationale: ينقل λόγος بمعناه المحاسبي المحتمل، ويحافظ على الصيغة الثنائية الملموسة δόσεως καὶ λήμψεως؛ ويُذكر البديل الأوسع في الحاشية.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: إلا أنتم وحدكم
  rationale: يحفظ الاستثناء والتوكيد القوي للحصرية في ὑμεῖς μόνοι.
theological_decisions:
- issue: طبيعة العطاء والأخذ
  choice: الإبقاء على صورة الحساب المتبادل من دون شرح اتجاه كل طرف
  alternative: تفسير العبارة مباشرة بأنها دعم مالي قدمه أهل فيلبي لبولس
  rationale: السياق مالي، لكن تركيب النص نفسه يحتمل اصطلاحًا محاسبيًا أوسع؛ لذلك لا ينبغي تحميل المتن تحديدًا لاهوتيًا أو عمليًا زائدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «البشارة» لـ εὐαγγέλιον، و«أهل فيلبي» للنداء السكاني. وُضع مؤشر الحاشية مباشرة بعد العبارة التي يشرحها.
