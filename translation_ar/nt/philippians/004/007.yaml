  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: ar
  text: وسلامُ الله، الذي يفوق كلَّ إدراك، سيحرس قلوبكم وأفكاركم في يسوع المسيح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في المسيح يسوع».'
    reason: بديل يحافظ بصورة أوثق على ترتيب الألفاظ في اليونانية.
lexical_decisions:
- source_word: εἰρήνη τοῦ θεοῦ
  choice: سلامُ الله
  rationale: يحافظ على الإضافة اليونانية بصيغتها المباشرة، من غير حصرها في معنى المصدر وحده، وتؤدي «السلام» المعنى بوضوح وطبيعية.
- source_word: ἡ ὑπερέχουσα πάντα νοῦν
  choice: الذي يفوق كلَّ إدراك
  rationale: «يفوق» ينقل معنى التجاوز والتفوق، و«كل إدراك» يعبّر طبيعيًا عن حدود الفهم البشري مع إبقاء شمول العبارة اليونانية.
- source_word: φρουρήσει
  choice: سيحرس
  rationale: يحفظ الصورة الوقائية القوية في الفعل، بما فيها إيحاء الحراسة، من غير شرح زائد.
- source_word: τὰς καρδίας ὑμῶν
  choice: قلوبكم
  rationale: يحافظ على الاستعمال الكتابي للقلب بوصفه مركز الحياة الباطنة.
- source_word: τὰ νοήματα ὑμῶν
  choice: أفكاركم
  rationale: νοήματα تدل على الأفكار والتصورات أو النشاط الذهني؛ و«أفكاركم» أدق هنا من تكرار مفهوم الذهن الوارد في νοῦν.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في يسوع المسيح
  rationale: ترتيب «يسوع المسيح» عربي طبيعي ويحافظ على Χριστός بصفته لقبًا مترجمًا، مع نقل ἐν بحرف «في» من غير تفسير العلاقة تفسيرًا زائدًا.
theological_decisions:
- issue: دلالة الإضافة في «سلام الله»
  choice: سلامُ الله
  alternative: السلام الآتي من الله
  rationale: قد تتضمن الإضافة معنى المصدر، لكنها لا تنحصر فيه صراحة؛ لذلك تُحفظ الصياغة الأوسع من غير حسم زائد.
- issue: صياغة ἐν Χριστῷ Ἰησοῦ
  choice: في يسوع المسيح
  alternative: في المسيح يسوع
  rationale: «المسيح» ترجمة للقب Χριστός لا نقحرة له، بينما يحقق ترتيب «يسوع المسيح» فصاحة عربية أوضح. وتثبت الحاشية البديل الأقرب إلى ترتيب اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت «إدراك» لتجنب التباس «عقل» بين مَلَكة الذهن وعملية الفهم، و«أفكاركم» للتمييز بين νοῦς وνοήματα. وُضع مؤشر الحاشية بعد العبارة التي يخصها.
