  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: ar
  text: فرحتُ فرحًا عظيمًا في الرب لأنكم جددتم الآن أخيرًا اهتمامكم بي[a]. والحق أنكم كنتم تهتمون بي[b]، لكن لم تتح لكم الفرصة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عاد اهتمامكم بي إلى الازدهار»؛ فالفعل اليوناني يرسم حرفيًا صورة الإزهار من جديد فيما يخص بولس.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كنتم تفكرون في أمري»؛ فالفعل اليوناني قد يعني التفكير في شخص، أو التوجه نحوه، أو الاهتمام به.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: فرحتُ
  rationale: ينقل الفعل اليوناني بصيغة الماضي بوضوح، ويحافظ على استجابة بولس الشخصية المباشرة.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحافظ على التعبير البولسي الموجز وعلى إمكان دلالته على مجال الفرح أو أساسه دون حسم زائد.
- source_word: μεγάλως
  choice: فرحًا عظيمًا
  rationale: صياغة عربية طبيعية تؤدي قوة الحال اليونانية وتبرز شدة الفرح.
- source_word: ἤδη ποτὲ
  choice: الآن أخيرًا
  rationale: ينقل عودة الأمر إلى الظهور بعد انقطاع زمني، من غير أن يضيف عتابًا صريحًا.
- source_word: ἀνεθάλετε
  choice: جددتم
  rationale: يؤدي المعنى السياقي بصورة طبيعية، مع بيان صورة الإزهار من جديد في الحاشية.
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: اهتمامكم بي
  rationale: الفعل هنا لا يقتصر على التفكير الذهني، بل يدل في السياق على التوجه العملي والعناية ببولس.
- source_word: ἐφ’ ᾧ
  choice: والحق أن
  rationale: يقدم توضيح بولس بأن اهتمامهم كان قائمًا بالفعل، بصياغة عربية سليمة تحفظ القوة التفسيرية.
- source_word: ἐφρονεῖτε
  choice: كنتم تهتمون بي
  rationale: يحافظ على الاتساق مع «اهتمامكم بي»، مع إبقاء احتمال معنى التفكير في الحاشية.
- source_word: ἠκαιρεῖσθε
  choice: لم تتح لكم الفرصة
  rationale: يبين أن العائق كان غياب المناسبة الملائمة، لا غياب الرغبة أو الاهتمام.
theological_decisions:
- issue: دلالة «في الرب»
  choice: الإبقاء على التعبير «في الرب» بلا شرح داخل المتن
  alternative: «بسبب الرب» أو «في علاقتي بالرب»
  rationale: الأصل يحتمل دلالة المجال أو الأساس، والترجمة الحرفية الطبيعية تحفظ هذا الاتساع اللاهوتي بدل حسمه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «جددتم» في المتن لتجنب صورة نباتية متكلفة، مع حفظ استعارة الإزهار الأصلية في الحاشية. وُضعت علامتا الحاشيتين [a] و[b] في موضعيهما داخل النص.
