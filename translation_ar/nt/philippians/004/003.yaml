source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: ar
  text: نعم، وأسألك أنت أيضًا، يا شريكي الصادق[a]، أن تساعد هاتين المرأتين اللتين جاهدتا معي في الإنجيل[b]، مع إكليمندس أيضًا وسائر العاملين معي، الذين أسماؤهم في سفر الحياة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا شريكي الحقيقي في النير»؛ ويرى بعضهم أن الكلمة قد تكون اسم علم: «سيزيغس».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «ناضلتا معي» أو «عملتا إلى جانبي»؛ ويمكن أيضًا فهم العبارة: «من أجل الإنجيل» أو «في خدمة الإنجيل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: نعم
  rationale: تحافظ على الانتقال التوكيدي المباشر في مطلع الطلب.
- source_word: ἐρωτῶ
  choice: أسألك
  rationale: تنقل المعنى المباشر والفعل الشخصي من غير تشديد القوة إلى «أحثّ» أو «أناشد».
- source_word: γνήσιε σύζυγε
  choice: يا شريكي الأمين
  rationale: تأخذ σύζυγε وصفًا لمن يشترك مع بولس في العمل، لا اسم علم؛ و«الأمين» تعبر طبيعيًا عن γνήσιε بمعنى الصادق الأصيل.
- source_word: συλλαμβάνου
  choice: أن تساعد
  rationale: تعبر بوضوح عن طلب المساندة الفعلية، مع تجنب نقل الصورة الاشتقاقية نقلًا متكلفًا.
- source_word: αὐταῖς
  choice: هاتين المرأتين
  rationale: توضح صيغة المؤنث الجمع وإحالتها السياقية إلى أفودية وسنتيخي المذكورتين في الآية السابقة.
- source_word: συνήθλησάν μοι
  choice: جاهدتا معي جنبًا إلى جنب
  rationale: تحفظ صورة الكفاح أو التنافس الكامنة في συναθλέω، وتأتي بصياغة عربية واضحة وطبيعية.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: في الإنجيل
  rationale: تبقي العبارة الموجزة قريبة من اليونانية، من غير حصرها تفسيريًا في «من أجل الإنجيل» أو «في خدمة الإنجيل».
- source_word: συνεργῶν
  choice: العاملين معي
  rationale: تؤدي معنى شركاء بولس في العمل بصياغة عربية مألوفة وواضحة.
- source_word: βίβλῳ ζωῆς
  choice: سفر الحياة
  rationale: هو التعبير الكتابي العربي المألوف، ويؤدي معنى السجل أو الكتاب من غير غرابة.
theological_decisions:
- issue: تفسير γνήσιε σύζυγε
  choice: نداء وصفي لشريك أمين غير مسمى
  alternative: 'قد تكون σύζυγε اسم علم: «سيزيغس»، أو تُنقل الصورة حرفيًا: «يا رفيقي في النير»'
  rationale: يتلاءم النعت γνήσιε طبيعيًا مع نداء وصفي، وفهم σύζυγε اسمًا عامًا أنسب للسياق؛ لكن احتمال الاسم العلم وبقاء صورة النير موضع نقاش، لذلك ذُكرا في الحاشية.
- issue: دلالة ἐν τῷ εὐαγγελίῳ
  choice: في الإنجيل
  alternative: من أجل الإنجيل، أو في خدمة الإنجيل
  rationale: الصياغة اليونانية مكثفة وقد تشير إلى مجال الكفاح أو غايته؛ لذا حُفظ اتساعها بدل حسمها تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل المثنى في «هاتين المرأتين» و«جاهدتا» مراعاةً للسياق القريب، مع إبقاء التعبير اللاهوتي «سفر الحياة» بصيغته العربية الكتابية المألوفة.
