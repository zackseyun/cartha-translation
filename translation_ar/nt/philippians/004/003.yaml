  to: نعم، وأسألك أنت أيضًا، يا شريكي الصادق[a]، أن تساعد هاتين المرأتين اللتين جاهدتا معي في الإنجيل[b]، مع إكليمندس أيضًا وسائر العاملين معي، الذين أسماؤهم في سفر الحياة.
  rationale: أُعيد ترتيب العبارة الخاصة بإكليمندس وسائر العاملين لتتعلق بوضوح بكفاح المرأتين مع بولس، لا بطلب مساعدتهن. وعُدّل وصف المخاطَب من «الأمين» إلى «الصادق» لتقريب دلالة γνήσιε، مع الإبقاء على بديل «النير» واحتمال الاسم العلم في الحاشية. ولم يتغير المعنى أو سعة العبارة اليونانية في شأن «الإنجيل».
