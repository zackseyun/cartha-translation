    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: رِفْق
  rationale: يدل اللفظ على سلوك متأنٍّ ومراعي للآخرين، يتصف باللين وعدم التشدد، لا على مجرد هدوء الطبع. و«الرِّفق» تعبير عربي طبيعي يحفظ هذا المجال الدلالي الواسع نسبيًا.
- source_word: γνωσθήτω
  choice: لِيَكُنْ ... مَعْرُوفًا
  rationale: يحافظ هذا التركيب على صيغة الأمر المبني للمجهول في اليونانية، مع وضوح العبارة وسلامتها في العربية المعاصرة.
- source_word: πᾶσιν ἀνθρώποις
  choice: عِنْدَ جَمِيعِ النَّاسِ
  rationale: ينقل شمول العبارة اليونانية بوضوح ومن غير تخصيصها بالذكور.
- source_word: κύριος
  choice: الرَّبّ
  rationale: هو المقابل العربي المألوف لهذا اللقب، ويحفظ ثقله اللاهوتي في السياق.
- source_word: ἐγγύς
  choice: قَرِيب
  rationale: 'يحفظ «قريب» الإبهام المقصود في الأصل: فقد تكون الإشارة إلى قرب الرب في حضوره، أو قرب مجيئه، أو إلى المعنيين معًا.'
theological_decisions:
- issue: دلالة ὁ κύριος ἐγγύς
  choice: الرَّبُّ قَرِيبٌ
  alternative: الرَّبُّ حَاضِرٌ عَنْ قُرْبٍ؛ أو مَجِيءُ الرَّبِّ قَرِيبٌ
  rationale: تحتمل العبارة اليونانية القرب المكاني أو الحضوري، والقرب الزمني المتعلق بالمجيء، وربما تجمعهما؛ لذلك تُركت في المتن على اتساعها دون حسم.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «الرِّفق» لأنه طبيعي ومفهوم، ولأنه أوسع من وصف مجرد الوداعة، ووُضعت كل حاشية عقب العبارة التي تفسرها.
