  terminology: «الإخوة»، و«الرب»، و«إكليل» اختيارات مناسبة وثابتة. الحاشية الخاصة بالإكليل تحتاج إلى استبدال «إكليل ظفري»، وهو تركيب غير مألوف، بـ«إكليل النصر» أو ما يماثله.
