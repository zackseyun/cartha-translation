reference: Philippians 4:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: ar
  text: لذلك يا إخوتي[a] الأحباء الذين أشتاق إليهم، يا فرحي وإكليلي[b]، اثبتوا هكذا في الرب، يا أيها الأحباء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: جاءت كلمة «إخوتي» بصيغة المذكر في اليونانية، لكن بولس يخاطب في السياق جماعة المؤمنين كلها، لا الرجال وحدهم.
    reason: cultural_note
  - marker: b
    text: يمكن أيضًا ترجمتها «إكليل النصر»؛ فاللفظة اليونانية تشير إلى الإكليل الذي كان يُمنح للفائز.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: لذلك
  rationale: تفيد نتيجةً واستنتاجًا مما سبق، وتؤدي الانتقال الاستدلالي بوضوح في العربية المعاصرة.
- source_word: ἀδελφοί
  choice: إخوتي
  rationale: تحافظ على صيغة النداء المذكرة في اليونانية وعلى نبرة القرابة الروحية، مع بيان شمول الخطاب لأعضاء الجماعة في الحاشية.
- source_word: ἀγαπητοὶ
  choice: الأحباء / أحبائي
  rationale: تنقل المودة القوية وتحافظ على تكرار اللفظة في أول النداء وآخره، مع تكييف الصياغة نحويًا بحسب موقعها.
- source_word: ἐπιπόθητοι
  choice: الذين أشتاق إليهم
  rationale: تعبير عربي طبيعي يوضح أن بولس يشتاق إليهم، ويحفظ قوة الحنين التي تحملها الصفة اليونانية.
- source_word: χαρὰ
  choice: فرحي
  rationale: ترجمة مباشرة وطبيعية تفيد أن المؤمنين أنفسهم موضع فرح بولس.
- source_word: στέφανος
  choice: إكليلي
  rationale: «الإكليل» هو المقابل العربي المألوف الذي يلائم إكليل التكريم أو الظفر، مع توضيح الصورة التاريخية في الحاشية.
- source_word: οὕτως
  choice: هكذا
  rationale: تحافظ على القوة الكيفية للظرف من غير أن تحسم أكثر مما يحسمه النص صلته بما سبق.
- source_word: στήκετε
  choice: اثبتوا
  rationale: فعل أمر عربي واضح ينقل معنى الرسوخ والمثابرة.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: تحافظ على العبارة البولسية المكانية والعلاقية من غير تفسير زائد مثل «في اتحاد مع الرب».
theological_decisions:
- issue: نطاق المخاطَبين في ἀδελφοί
  choice: إبقاء «إخوتي» في المتن مع حاشية تبين أن الخطاب يشمل جماعة المؤمنين كلها.
  alternative: «إخوتي وأخواتي» أو «أيها الإخوة والأخوات»
  rationale: الصيغة اليونانية مذكرة، لكن سياق الرسالة موجَّه إلى الجماعة كلها؛ لذلك تحفظ الترجمة شكل اللفظ وتوضح شموله السياقي في الحاشية.
- issue: دلالة ἐν κυρίῳ
  choice: «في الرب»
  alternative: «متحدين بالرب»
  rationale: العبارة قد تحمل دلالة مكانية مجازية وعلاقية معًا، والترجمة الحرفية الطبيعية تحفظ هذا الاتساع اللاهوتي ولا تختزله في تفسير واحد.
- issue: مرجع οὕτως
  choice: «اثبتوا هكذا في الرب»
  alternative: «اثبتوا في الرب على هذا النحو»
  rationale: «هكذا» تحفظ الإشارة إلى الكيفية المرتبطة بسياق الوصايا السابق من غير إضافة شرح يضيّق مرجعها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ تكرار نداء المحبة في أول الآية وآخرها، واستُعملت «الذين أشتاق إليهم» بدل تركيب وصفي ثقيل، مع إبقاء العبارات البولسية الأساسية مثل «في الرب» من غير توسع تفسيري.
