  source_fidelity: 'ينقل المتن عناصر اليونانية كلها بأمانة: الاستنتاج في «لذلك»، ونداء الإخوة المحبوبين المشتاق إليهم، و«فرحي وإكليلي»، والأمر بالثبات «هكذا في الرب». لكن «يا أحبائي» في النداء الأخير تضيف ضمير المتكلم إلى لفظة لا يرد معها ضمير في اليونانية، في حين أن النداء الأول وحده مقترن بـ μου.'
