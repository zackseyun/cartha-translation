    issue: غياب التصريح بالمستقبل في «يكون معكم».
    rationale: الفعل اليوناني ἔσται مستقبل صريح؛ وقد تُفهم «يكون» في العربية على أنها خبر عام أو حاضر. «سيكون معكم» يحفظ الوعد المستقبلي بوضوح.
  - severity: low
    issue: «تسلَّمتموه» أقل طبيعية لتلقّي التعليم.
    rationale: الفعل قد يوحي غالبًا بالتسلّم المادي أو الإداري، بينما «تلقّيتموه» طبيعي في سياق التعليم، ويحفظ سعة παρελάβετε من دون إضافة مفهوم التقليد.
  - severity: low
    issue: صياغة الحاشية الثانية غير سلسة في «في قدوتي».
    rationale: «في مثالي» أو «في حياتي» أقرب إلى الاستعمال العربي الطبيعي، ويقدّم البديل التفسيري بوصفه حاشية لا جزءًا من المتن.
