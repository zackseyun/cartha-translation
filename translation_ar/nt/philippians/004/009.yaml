base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: ar
  text: وما تعلَّمتموه وتلقَّيتموه وسمعتموه ورأيتموه فيَّ، فطبِّقوا هذه الأمور[a][b]، وإله السلام سيكون معكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «افعلوا هذه الأمور».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا التعبير عن «رأيتموه فيَّ» بقول: «رأيتموه في مثالي» أو «رأيتموه في حياتي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: ما...ـه / هذه الأمور
  rationale: استُعملت «ما» لبدء جملة الصلة بصورة عربية طبيعية، ثم «هذه الأمور» لإظهار مرجع اسم الإشارة اليوناني المحايد الجمع.
- source_word: ἐμάθετε
  choice: تعلَّمتموه
  rationale: ينقل معنى التعلّم بصيغة الماضي، مع ضمير يعود إلى مضمون «ما».
- source_word: παρελάβετε
  choice: تسلَّمتموه
  rationale: «تسلَّم» يحفظ اتساع المعنى بين تلقّي التعليم وقبول ما نُقل إليهم، من غير تقييده صراحةً بالتقليد.
- source_word: ἠκούσατε
  choice: سمعتموه
  rationale: ترجمة مباشرة تحافظ على توازي الأفعال في السلسلة.
- source_word: εἴδετε ἐν ἐμοί
  choice: رأيتموه فيَّ
  rationale: صياغة قريبة من اليونانية تحفظ احتمال الإشارة إلى ما شوهد في شخص بولس أو سيرته، من غير إضافة «قدوتي» إلى المتن.
- source_word: ταῦτα πράσσετε
  choice: فمارسوا هذه الأمور
  rationale: «مارسوا» تفيد وضعها موضع العمل بصورة مستمرة، بينما تعرض الحاشية البديل الأبسط «افعلوا».
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: إله السلام
  rationale: يحفظ تركيب الإضافة البولسي الموجز من غير تفسيره بأنه «الإله الذي يمنح السلام».
- source_word: ἔσται μεθ’ ὑμῶν
  choice: يكون معكم
  rationale: ينقل الوعد المستقبلي بصياغة عربية كتابية واضحة؛ ودلالة الاستقبال مفهومة من سياق الوعد بعد الأمر.
theological_decisions:
- issue: العلاقة بين ممارسة التعليم وحضور الله
  choice: إيراد الوصية ثم الوعد موصولين بالواو، من غير تحويل العبارة إلى شرط صريح
  alternative: «إن فعلتم هذه الأمور، فسيكون إله السلام معكم»
  rationale: يربط اليوناني بين الجملتين بـκαί ولا يصوغهما بأداة شرط؛ لذا تحافظ الترجمة على قوة الحث والوعد من غير تقرير علاقة آلية سببية لا يصرّح بها النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حوفظ على التوازي بين الأفعال الأربعة، وعلى التعبير اللاهوتي الموجز «إله السلام». وُضعت علامتا الحاشيتين بعد العبارة التي تتصلان بها، مع بيان البدائل دون إدخال تفسيرها في المتن.
