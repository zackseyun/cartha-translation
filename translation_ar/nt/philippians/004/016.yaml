lexical_decisions:
- source_word: ὅτι
  choice: لأنكم
  rationale: تقدّم الجملة بوصفها تعليلًا لما سبق، وتسمح العربية بوصل الأداة مباشرة بضمير الفاعل المستتر في الفعل اليوناني.
- source_word: καὶ ἐν Θεσσαλονίκῃ
  choice: حتى حين كنتُ في تسالونيكي
  rationale: تنقل καὶ هنا بمعنى «حتى»، وتوضح طبيعيًا أن بولس هو الذي كان في تسالونيكي، من غير تغيير دلالة العبارة المكانية في سياقها.
- source_word: καὶ ἅπαξ καὶ δὶς
  choice: مرةً ومرتين
  rationale: تحافظ على الصياغة العددية المؤكدة في اليونانية، وهي تعبير عربي مفهوم يفيد تكرار الإرسال.
- source_word: εἰς τὴν χρείαν μοι
  choice: لسدّ حاجتي
  rationale: صياغة عربية طبيعية تبقي χρεία مفردة وتعبّر عن توجيه ما أُرسل إلى تلبية حاجة بولس.
- source_word: ἐπέμψατε
  choice: أرسلتم إليَّ
  rationale: يحافظ على معنى الفعل «أرسلتم»، مع إظهار جهة الإرسال التي يدل عليها السياق والضمير μοι، من غير تسمية الشيء المُرسَل.
