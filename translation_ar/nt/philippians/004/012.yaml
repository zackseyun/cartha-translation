  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: ar
  text: 'أعرف كيف أعيش في الضيق، وأعرف كيف أعيش في السعة. في كل حال وفي كل شيء تعلَّمت السرَّ[a]: أن أشبع وأن أجوع، وأن أعيش في السعة وأن أكون في عوز.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أُدخِلتُ في الأسرار» أو «لُقِّنتُ الأسرار». يستخدم بولس هنا لغة الإدخال في الأسرار على سبيل المجاز للتعبير عن تعلُّم سرّ العيش في مختلف الأحوال.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: أعرف كيف
  rationale: مع صيغ المصدر التالية، تدل العبارة على معرفة عملية مكتسبة بالخبرة، لا على معرفة نظرية مجردة.
- source_word: ταπεινοῦσθαι
  choice: أعيش في الضيق
  rationale: يحفظ معنى الانخفاض في الأحوال دون حصره في فضيلة التواضع أو في إذلال داخلي، ويأتي عربيًا طبيعيًا في مقابلة السعة.
- source_word: περισσεύειν
  choice: أعيش في السعة
  rationale: ينقل معنى امتلاك ما يزيد على الكفاية ويحفظ التقابل مع الضيق والعوز، من غير قصره على الثراء المالي.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: في كل حال وفي جميع الظروف
  rationale: يحفظ ازدواج التعبير وشموله، مع صياغة عربية واضحة وطبيعية.
- source_word: μεμύημαι
  choice: تعلَّمت السرَّ
  rationale: الفعل يستحضر لغة التلقين أو الإدخال في سر، لكنه يُستعمل هنا مجازيًا للدلالة على تعلّم كيفية العيش في مختلف الأحوال؛ وتوضح الحاشية دلالته الحرفية.
- source_word: χορτάζεσθαι
  choice: أن أشبع
  rationale: يبرز معنى الامتلاء بالطعام في مقابل الجوع، بعبارة عربية موجزة ومألوفة.
- source_word: πεινᾶν
  choice: أن أجوع
  rationale: ينقل المقابلة المباشرة والبسيطة مع الشبع.
- source_word: ὑστερεῖσθαι
  choice: أن أكون في عوز
  rationale: يدل بوضوح على الحرمان والحاجة، ويبقى أوسع من النقص المالي وحده.
