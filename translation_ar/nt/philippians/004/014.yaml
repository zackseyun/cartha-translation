lexical_decisions:
- source_word: πλὴν
  choice: ومع ذلك
  rationale: تفيد انتقالًا استدراكيًا لطيفًا عمّا سبق، مع إبقاء نبرة بولس الإيجابية.
- source_word: καλῶς ἐποιήσατε
  choice: أحسنتم
  rationale: تعبير عربي طبيعي وموجز ينقل التقييم الإيجابي للفعل، مع دلالة الفعل الماضي.
- source_word: συγκοινωνήσαντές μου
  choice: إذ شاركتموني
  rationale: ينقل معنى المشاركة الفعلية والتضامن مع بولس، ويحافظ على الصلة المباشرة التي تفيدها صيغة المشاركة مع ضمير المتكلم.
- source_word: τῇ θλίψει
  choice: في ضيقتي
  rationale: «الضيقة» تنقل معنى الضغط والشدة أو الكرب بوضوح ووقار، والملكية مستفادة من تركيب العبارة اليونانية.
