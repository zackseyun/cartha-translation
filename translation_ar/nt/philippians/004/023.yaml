  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: ar
  text: لِتَكُنْ نِعْمَةُ الرَّبِّ يَسُوعَ الْمَسِيحِ مَعَ رُوحِكُمْ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: نِعْمَة
  rationale: تحافظ «نعمة» على الدلالة البولسية الغنية للعطية الإلهية والتفضّل، وهي المقابل العربي الكتابي الطبيعي.
- source_word: κυρίου
  choice: الرَّبّ
  rationale: ينقل اللقب المسيحاني هنا بوضوح، ويلائم الصيغة الختامية المألوفة في رسائل بولس.
- source_word: Χριστοῦ
  choice: الْمَسِيح
  rationale: ترجمة للقب Χριστός لا نقحرة له، مع بقائه مرتبطًا باسم يسوع في الصيغة «الرب يسوع المسيح».
- source_word: μετὰ
  choice: مَعَ
  rationale: مع المضاف إليه يدل μετά هنا على المصاحبة أو الحضور، و«مع» هي المقابل العربي المباشر والطبيعي.
- source_word: πνεύματος
  choice: رُوح
  rationale: يشير السياق على الأرجح إلى الروح البشرية أو الحياة الباطنة للمخاطَبين، لا إلى الروح القدس صراحةً.
- source_word: ὑμῶν
  choice: ـكُمْ
  rationale: ضمير جمع المخاطبين، وقد حُفظ جمعه صراحةً في العربية.
theological_decisions:
- issue: هل πνεύματος يشير إلى روح المؤمنين أم إلى الروح القدس؟
  choice: رُوحِكُمْ
  alternative: الرُّوح الذي معكم / روحكم مع فهم الإشارة إلى الروح القدس
  rationale: وجود ضمير الملكية الجمعي ὑμῶν وصيغة البركة يرجّحان الإشارة إلى الروح البشرية أو الكيان الباطن الجماعي، مع عدم إضافة تفسير عقائدي إلى النص.
- issue: هل Χριστοῦ يُترجم لقبًا أم يُعامل كجزء من اسم ثابت؟
  choice: الْمَسِيح
  alternative: كريستوس / المسيح بوصفه جزءًا اسميًا ثابتًا
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحفظ قوة اللقب حتى داخل الصيغة الاسمية الوثيقة «يسوع المسيح».
- issue: القيمة الإنشائية للجملة الاسمية المحذوف فعلها
  choice: لِتَكُنْ
  alternative: نعمة الرب يسوع المسيح مع روحكم
  rationale: اليونانية تعبّر عن بركة أو دعاء بفعل مقدّر؛ «لتكن» توضح القوة الدعائية طبيعيًا من غير تغيير المعنى.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم جمع المخاطبين في «روحكم»، وحُفظت صيغة البركة الختامية الموجزة. أُثبتت الحاشية لأن جهاز SBLGNT يشير إلى تغاير نصي عند ὑμῶν، وأشهره إضافة πάντων («جميعًا»).
