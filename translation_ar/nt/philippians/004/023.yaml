  to: لِتَكُنْ نِعْمَةُ الرَّبِّ يَسُوعَ الْمَسِيحِ مَعَ رُوحِكُمْ.
  rationale: التعديل الآمن الوحيد هو حذف الحاشية غير المسندة. ويبقى النص نفسه محافظًا على صيغة الدعاء التي تفهم من البركة اليونانية، وعلى إضافة «الـ» في «المسيح» بوصفها ترجمة طبيعية للقب.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'النص العربي ينقل بركة بولس ومعنى الألفاظ الرئيسة بأمانة: «نعمة»، «الرب»، «يسوع المسيح»، و«روحكم». لكن الحاشية الحالية تصف إضافة «جميعًا» بأنها «قراءة نصية أخرى»، مع أن نص SBLGNT المعروض لا يثبت هذه الإضافة ولا يقدّم سياق المهمة شاهدًا نصيًا يقتضي إدراج حاشية نقدية. كما أن الحاشية الإنجليزية نفسها ليست حاشية اختلاف نصي، بل إعادة صياغة إنجليزية للجملة نفسها.'
  naturalness: الصياغة «لِتَكُنْ نِعْمَةُ الرَّبِّ يَسُوعَ الْمَسِيحِ مَعَ رُوحِكُمْ» فصيحة وطبيعية في سجل بركات الرسائل. ويمكن إبقاء التشكيل الجزئي لتيسير القراءة.
  terminology: «نعمة الرب يسوع المسيح» و«روحكم» مصطلحات عربية كتابية راسخة ومناسبة. وترجمة Χριστοῦ بـ«المسيح» تحافظ على قوة اللقب ولا تفرض تفسيرًا مذهبيًا.
  issues:
  - severity: medium
    issue: الحاشية [a] غير مطابقة للمادة المصدرية المقدمة ولا لوظيفتها في مسار التدقيق الإنجليزي.
    rationale: الحاشية العربية تزعم وجود قراءة نصية «مع روحكم جميعًا»، بينما النص اليوناني المحدد هو «μετὰ τοῦ πνεύματος ὑμῶν»، ولا يورد الطلب دليلًا نقديًا لهذه الإضافة. أما الحاشية الإنجليزية فتسجل صياغة بديلة في الإنجليزية، لا قراءة يونانية أخرى. حذف الحاشية يمنع نسبة اختلاف نصي غير موثّق.
  revised_text: لِتَكُنْ نِعْمَةُ الرَّبِّ يَسُوعَ الْمَسِيحِ مَعَ رُوحِكُمْ.
