  text: τῷ δὲ θεῷ καὶ πατρὶ ἡμῶν ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: ar
  text: ولإلهنا وأبينا المجد إلى أبد الآبدين[a]. آمين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «إلى دهور الدهور».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: الواو في «ولإلهنا»
  rationale: أداة ربط خفيفة تمهّد للخاتمة التسبيحية؛ تنقلها الواو طبيعيًا من غير أن توحي بتعارض قوي أو بزمن غير مذكور في الأصل.
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: إلهنا وأبينا
  rationale: تعبير موحّد يعود فيه ضمير المتكلمين إلى الاسمين، ويحافظ على الإشارة إلى شخص واحد بوصفه إلهنا وأبانا.
- source_word: ἡ δόξα
  choice: المجد
  rationale: الجملة اليونانية اسمية بلا فعل؛ والصياغة العربية التسبيحية «له المجد» مفهومة طبيعيًا، مع إبقاء بنية الإسناد في «ولإلهنا وأبينا المجد».
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: إلى أبد الآبدين
  rationale: صياغة عربية راسخة ومفهومة تؤدي معنى الدوام غير المنتهي وتحفظ النبرة التسبيحية السامية.
- source_word: ἀμήν
  choice: آمين
  rationale: نُقلت باللفظ الكنسي العربي المألوف لأنها هنا تصديق تعبدي ثابت.
theological_decisions:
- issue: تقدير العلاقة الخبرية في صيغة التسبيح الخالية من الفعل
  choice: ولإلهنا وأبينا المجد
  alternative: لإلهنا وأبينا يكون المجد / لإلهنا وأبينا المجد كائن
  rationale: الأصل اليوناني لا يصرّح بفعل، وقد تحتمل العبارة تقرير أن المجد له أو الدعاء بأن يكون له. الصياغة الاسمية العربية طبيعية وتحفظ هذا القدر من الانفتاح بدل حسمه بإضافة فعل.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة تسبيحية مهيبة. استُخدمت صيغة «أبد الآبدين» لشيوعها ووضوحها، مع بيان البنية الحرفية في الحاشية.
