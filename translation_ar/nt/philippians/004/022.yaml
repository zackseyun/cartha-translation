base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: ar
  text: يُسَلِّمُ عليكم جميعُ القديسين، ولا سيما الذين من بيت قيصر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: المنتسبون إلى بيت قيصر. تشير العبارة إلى أشخاص مرتبطين بالبيت الإمبراطوري، وليس بالضرورة إلى أفراد عائلة قيصر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: يُسَلِّمُ عليكم
  rationale: تعبير رسائلي عربي طبيعي ينقل معنى توجيه التحية مباشرةً، مع بقاء الفاعل بعد الفعل كما يلائم الأسلوب العربي.
- source_word: πάντες οἱ ἅγιοι
  choice: جميع القديسين
  rationale: يحافظ على المصطلح البولسي الدال على المؤمنين بوصفهم مكرَّسين لله، من غير تحويله إلى شرح تفسيري.
- source_word: μάλιστα δὲ
  choice: ولا سيما
  rationale: ينقل إبراز فئة بعينها داخل المجموعة الأكبر، ويؤدي وظيفة δέ وصليًا بأسلوب عربي فصيح وطبيعي.
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: الذين من بيت قيصر
  rationale: يحافظ على تركيب ἐκ وعلى اتساع دلالة οἰκία، التي قد تشمل المنتسبين إلى البيت الإمبراطوري وخدمه وموظفيه، لا الأقارب وحدهم.
- source_word: Καίσαρος
  choice: قيصر
  rationale: يحفظ اللقب/الاسم الإمبراطوري الوارد في اليونانية بدل استبداله بالتعبير التفسيري «الإمبراطور».
theological_decisions:
- issue: دلالة «القديسين» في الاستعمال البولسي
  choice: الإبقاء على «القديسين» بوصفها تسمية للمؤمنين/المكرَّسين لله
  alternative: شعب الله؛ المؤمنون
  rationale: لا يقتصر اللفظ هنا على نخبة ذات منزلة دينية خاصة، لكن الإبقاء على المقابل المعجمي يحفظ صياغة بولس ولا يحسم الدلالة بتفسير داخل المتن.
- issue: هوية المنتمين إلى بيت قيصر
  choice: صياغة لا تحصرهم في أفراد عائلة قيصر
  alternative: أهل قيصر؛ أفراد عائلة قيصر
  rationale: العبارة اليونانية يمكن أن تشير إلى أشخاص مرتبطين بالبيت الإمبراطوري، مثل الخدم والمعتَقين والموظفين، ولذلك تُحفظ سعة الدلالة مع توضيحها في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعمل «يُسَلِّم عليكم» بوصفه تعبيرًا رسائليًا مألوفًا، وحُفظ المصطلح «القديسين» والاسم التاريخي «قيصر». وُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
