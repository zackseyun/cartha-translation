  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: ar
  text: لا تقلقوا بشأن أيّ شيء[a]، بل في كلّ شيء، بالصلاة والتضرّع[b] مع الشكر، لتُعلَم طلباتكم لدى الله[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تهتمّوا بشيء اهتمامًا قلقًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أي: الالتماس بإلحاح.'
    reason: lexical_clarification
  - marker: c
    text: 'أو: «أمام الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: لا تقلقوا بشأن أيّ شيء
  rationale: ينقل تركيب النهي مع μηδὲν بمعنى عدم القلق بشأن أي أمر، بصياغة عربية طبيعية واضحة.
- source_word: ἐν παντὶ
  choice: في كلّ شيء
  rationale: يحافظ على شمول العبارة من غير تقييدها صراحةً بالظروف أو الأحوال.
- source_word: τῇ προσευχῇ
  choice: بالصلاة
  rationale: المقابل العربي المألوف والدقيق للصلاة الموجّهة إلى الله.
- source_word: τῇ δεήσει
  choice: التضرّع
  rationale: يميّز δέησις من الصلاة بمعناها الأعم، ويعبّر عن الالتماس الملحّ بلغة عربية مفهومة ووقورة.
- source_word: μετ’ εὐχαριστίας
  choice: مع الشكر
  rationale: يحفظ معنى المصاحبة وصيغة الاسم، ويأتي طبيعيًا في العربية الحديثة.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: طلباتكم
  rationale: تعبير موجز وطبيعي يحفظ المعنى المحسوس للأمور المطلوبة، من غير تكرار لفظ التضرّع.
- source_word: γνωριζέσθω
  choice: لتُعرَض
  rationale: صيغة مبنية للمجهول ذات قوة طلبية، وتنقل المقصود من جعل الطلبات معلومة لدى الله بصياغة عربية طبيعية، دون الإيحاء بأن الله يجهلها.
- source_word: πρὸς τὸν θεόν
  choice: على الله
  rationale: يناسب فعل «تُعرَض» في العربية وينقل اتجاه الطلبات إلى الله؛ وتُذكر دلالة «لدى الله/أمام الله» الممكنة في الحاشية.
theological_decisions:
- issue: دلالة «لتُعرَف طلباتكم» مع علم الله
  choice: لتُعرَض طلباتكم على الله
  alternative: لتُعرَف طلباتكم لدى الله
  rationale: الصياغة المختارة تحفظ فعل تقديم الطلبات إلى الله ولا توحي بأن المقصود تزويد الله بمعلومة لم تكن معلومة له، من غير إدخال تفسير عقائدي زائد.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت «تقلقوا» لأنها أصرح للقارئ المعاصر من «تهتمّوا» في الدلالة على الاهتمام المضطرب، وحُفظ الفرق بين الصلاة العامة والتضرّع المحدد.
