  to: لا تقلقوا بشأن أيّ شيء[a]، بل في كلّ شيء، بالصلاة والتضرّع[b] مع الشكر، لتُعلَم طلباتكم لدى الله[c].
  rationale: عُدّل الفعل إلى «لتُعلَم» ليقابل المبني للمجهول في γνωριζέσθω من دون استبدال معناه بفعل «العرض». واختير «لدى الله» في المتن بوصفه تركيبًا عربيًا طبيعيًا مع «تُعلَم»، مع إبقاء «أمام الله» بديلًا في الحاشية. لم يُدخل التعديل تفسيرًا متعلقًا بعلم الله، بل حافظ على صيغة النص ووظيفتها الطلبية.
