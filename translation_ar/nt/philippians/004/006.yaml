review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: النهي عن القلق، وشمول «في كل شيء»، والتمييز بين الصلاة والتضرع، واقتران ذلك بالشكر. لكن «لتُعرَض طلباتكم على الله» تضيف صورة «العرض» التي ليست في γνωριζέσθω، وهو فعل «لتُعرَف/لتُعلَم» بصيغة المبني للمجهول. الأنسب عربيًا، مع الحفاظ على المعنى، «لتُعلَم طلباتكم لدى الله».'
