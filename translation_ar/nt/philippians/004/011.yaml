base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: ar
  text: لا أقول هذا بسبب عوز، فقد تعلّمت أن أكون مكتفيًا في أي ظرف أكون فيه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مكتفيًا بذاته»؛ قد تدل الصفة اليونانية على الكفاية في الذات، لكنها تُفهم هنا بحسب السياق بمعنى «قانعًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: بسبب احتياج
  rationale: يدل التعبير على النقص أو العوز بوصفه دافعًا للكلام؛ وهذه الصياغة عربية طبيعية وتحفظ معنى أن بولس لا يتكلم مدفوعًا بحاجته الشخصية.
- source_word: λέγω
  choice: أقول
  rationale: المضارع العربي المباشر ينقل زمن الفعل اليوناني بوضوح وطبيعية.
- source_word: ἔμαθον
  choice: تعلّمت
  rationale: ينقل الفعل الماضي عملية التعلّم التي اكتملت وأثمرت حالة حاضرة، ويبيّن أن هذا الاكتفاء أمر اكتسبه بولس بالتعلّم.
- source_word: ἐν οἷς εἰμι
  choice: في أي حال أكون فيها
  rationale: التعبير اليوناني سياقي لا مكاني محض؛ والصياغة تشير طبيعيًا إلى مختلف الأحوال من غير توسع تفسيري.
- source_word: αὐτάρκης
  choice: مكتفيًا
  rationale: يحفظ «مكتفيًا» دلالة الكفاية الكامنة في اللفظ اليوناني، مع بقائه طبيعيًا في السياق العربي؛ ولا يلزم منه هنا ادعاء الاستقلال عن الله.
theological_decisions:
- issue: الإيحاء الفلسفي المحتمل في αὐτάρκης
  choice: مكتفيًا
  alternative: قانعًا أو مكتفيًا بذاتي
  rationale: يحافظ «مكتفيًا» على دلالة الأصل الأقوى من مجرد الرضا، من غير أن يضيف صراحةً مفهوم الاستقلال الذاتي. ويبين السياق اللاحق مصدر قدرة بولس، بينما تُحفظ الدلالة البديلة في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. اختير تركيب موجز قريب من بنية الأصل، مع تجنب المصطلح الفلسفي «مكتفٍ بذاته» في المتن لأنه قد يوحي باستقلال لاهوتي لا يصرح به النص.
