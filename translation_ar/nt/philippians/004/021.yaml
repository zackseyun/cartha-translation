    rationale: المتن يترجم Χριστός بـ«المسيح»، بينما يقرر مسار التدقيق الإنجليزي الأخير اعتماد «Messiah» ويعيده صراحةً بعد تعديل سابق. ينبغي أن يعكس النص العربي هذا القرار بـ«المسيّا»، مع إمكان ذكر «المسيح» بديلًا في الحاشية.
