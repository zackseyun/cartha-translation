  to: سَلِّموا على كلِّ قدِّيسٍ في المسيّا يسوع.[a] الإخوةُ الذين معي يسلِّمون عليكم.[b]
  rationale: يصحَّح لقب Χριστός إلى «المسيّا» اتباعًا للقرار المعتمد في سجلّ التدقيق مع الحفاظ على البديل العربي الشائع في الحاشية. كما تُعدَّل الحاشية (أ) لتكون بديلًا حقيقيًا، ويُرتَّب الشطر الثاني ترتيبًا عربيًا أكثر انسيابًا من غير تغيير في الفاعل أو فعل التحية أو المخاطَبين.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:58Z'
review_pass:
  verdict: revise
  source_fidelity: تُحافظ المسودة على فعلَي التحية، وعلى التوزيع في «كل قديس»، وعلى صيغة «الإخوة» المذكرة مع حاشية لا تحسم اتساع مرجعها. لكن اختيار «المسيح» في المتن لا يتبع قرار سجلّ المراجعة الإنجليزي المعتمد لترجمة Χριστός بـ«Messiah»؛ والحاشية الحالية لا تقدّم بديلًا للمتن بل تعيد التعبير عنه بصيغة «أي».
  naturalness: «سلِّموا على» و«يسلِّم عليكم» عبارتان فصيحتان وطبيعيتان في ختام الرسائل. وترتيب «الإخوة الذين معي يسلِّمون عليكم» أكثر سلاسة قليلًا في العربية مع إبقاء المعنى نفسه.
  terminology: يُستعمل «المسيّا» في المتن لمقابلة اللقب Χριστός وفق قرار الترجمة المعتمد، مع إيراد «المسيح» بديلًا عربيًا مألوفًا في الحاشية. وتبقى «الإخوة» في المتن وفية للصيغة اليونانية، ولا تُفرض قراءة شاملة في النص الأساسي.
  issues:
