base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: ar
  text: سَلِّموا على كلِّ قدِّيسٍ في المسيّا يسوع.[a] الإخوةُ الذين معي يسلِّمون عليكم.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في المسيح يسوع».'
    reason: lexical_alternative
  - marker: b
    text: قد تشير «الإخوة» هنا، بمعنى أوسع، إلى المؤمنين الذين مع بولس، بمن فيهم جماعة مختلطة من الرجال والنساء.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: سَلِّموا على
  rationale: صيغة أمر تدعو المخاطَبين إلى إبلاغ السلام، و«سلِّموا على» هي العبارة العربية الطبيعية الموجزة في ختام الرسائل.
- source_word: πάντα ἅγιον
  choice: كلِّ قدِّيسٍ
  rationale: المفرد مع πᾶς يفيد الاستغراق التوزيعي، أي كل فرد من جماعة المؤمنين؛ وتحافظ «قدّيس» على دلالة الشخص المقدَّس أو المفرَز لله.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في يسوعَ المسيحِ
  rationale: تحافظ العبارة على حرف الجر وعلى لقب Χριστός، مع ترتيب عربي طبيعي للاسم واللقب.
- source_word: ἀσπάζονται
  choice: يُسلِّم عليكم
  rationale: هذا هو المقابل الاصطلاحي الطبيعي للتحية في خاتمة الرسالة، مع إظهار المفعول ὑμᾶς بعبارة «عليكم».
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: الإخوةُ الذين معي
  rationale: تنقل «الإخوة» صيغة الجمع المذكر في الأصل، وتؤدي «الذين معي» معنى المصاحبة بوضوح وطلاقة.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي المباشر والجاري للقب اليوناني Χριστός، ويحافظ على طابعه اللقبي من غير إضافة تفسير عقائدي.
- issue: مدى دلالة ἀδελφοί
  choice: الإخوة في المتن مع إيضاح احتمال الشمول في الحاشية
  alternative: الإخوة والأخوات
  rationale: يحافظ المتن على الصيغة المذكرة في اليونانية، بينما لا يحسم ما إذا كانت الجماعة المصاحبة لبولس تضم رجالًا ونساءً؛ لذلك تُذكر الدلالة السياقية الأوسع في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم أسلوب التحية الرسائلية الطبيعي «سلِّموا على» و«يُسلِّم عليكم»، مع الحفاظ على التوزيع في «كل قديس» وعلى غموض مدى شمول «الإخوة» من خلال الحاشية.
