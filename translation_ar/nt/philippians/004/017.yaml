  text: οὐχ ὅτι ἐπιζητῶ τὸ δόμα, ἀλλὰ ἐπιζητῶ τὸν καρπὸν τὸν πλεονάζοντα εἰς λόγον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: ar
  text: ليس أني أطلب العطية، بل أطلب الثمر المتزايد لحسابكم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الثمر الذي يكثر في رصيدكم».'
    reason: بديل معجمي لعبارتي τὸν πλεονάζοντα وεἰς λόγον ὑμῶν، يبرز معنى الوفرة والقيد الدائن.
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: أطلب
  rationale: ينقل معنى السعي أو الرغبة بوضوح، ويحفظ تكرار الفعل والتقابل في العبارة اليونانية.
- source_word: τὸ δόμα
  choice: العطية
  rationale: ترجمة مباشرة للهبة التي قدمها أهل فيلبي، من غير إضافة ما ليس مصرحًا به في النص.
- source_word: τὸν καρπὸν
  choice: الثمر
  rationale: يحفظ الاستعارة الزراعية بدل اختزالها إلى منفعة أو ربح.
- source_word: τὸν πλεονάζοντα
  choice: المتزايد
  rationale: يعبر عن الثمر الذي ينمو أو يكثر، ويحفظ دلالة اسم الفاعل المستمرة.
- source_word: εἰς λόγον ὑμῶν
  choice: لحسابكم
  rationale: يحفظ لغة الحساب والتقييد المالي الحاضرة في السياق، مع بقاء التوتر بين استعارة الثمر وصورة الحساب.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: ليس أني ... بل
  rationale: يحفظ بنية التوضيح والتقابل في الأصل بصياغة عربية واضحة وموجزة.
theological_decisions:
- issue: طبيعة الثمر الذي يزداد لحساب المخاطبين
  choice: الإبقاء على «الثمر» و«الحساب» دون تفسير إضافي
  alternative: تفسيره صراحة بأنه أجر روحي أو منفعة أخروية
  rationale: النص يجمع بين استعارة الثمر ولغة الحساب من غير أن يحدد هنا طبيعة الرصيد أو زمن نيله؛ لذلك لا ينبغي حسم الدلالة لاهوتيًا داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «العطية» لتلائم سياق العطاء، و«لحسابكم» للمحافظة على الصورة التجارية. أُثبتت علامة الحاشية بعد الجملة التي تتناول بديلها.
