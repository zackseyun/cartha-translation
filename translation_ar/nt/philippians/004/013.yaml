lexical_decisions:
- source_word: πάντα
  choice: كلَّ شيء
  rationale: يحافظ هذا التعبير على شمول اللفظ اليوناني، مع أن السياق يتناول القدرة على الثبات في شتى الأحوال.
- source_word: ἰσχύω
  choice: أستطيع
  rationale: يدل الفعل على امتلاك القدرة أو القوة؛ و«أستطيع» ينقل معنى الاقتدار بوضوح من غير مبالغة.
- source_word: ἐν
  choice: بـ
  rationale: مع اسم الفاعل الدال على شخص، تفيد الأداة هنا الوسيلة أو مصدر التمكين، و«بـ» صياغة عربية طبيعية موجزة.
- source_word: τῷ ἐνδυναμοῦντί με
  choice: الذي يقوّيني
  rationale: تحافظ الصياغة على اسم الفاعل المعرّف وعلى دلالته الفعلية المستمرة، من غير إضافة اسم «المسيح» غير المذكور صراحة في نص الآية.
theological_decisions:
- issue: مرجع عبارة «الذي يقوّيني» الضمني
  choice: إبقاء العبارة من غير إضافة اسم «المسيح» إلى المتن
  alternative: بالمسيح الذي يقوّيني
  rationale: يرجّح السياق أن المقصود هو المسيح، لكن النص اليوناني لهذه الآية لا يسمّيه صراحة؛ لذلك تُحفظ دلالة النص كما وردت، مع توضيح المرجع المحتمل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة وذات نبرة كريمة. اختيرت «أستطيع كلَّ شيء» للمحافظة على سعة التعبير اليوناني، و«بالذي يقوّيني» لنقل معنى التمكين بصياغة طبيعية من غير تسمية المرجع الضمني في المتن.
