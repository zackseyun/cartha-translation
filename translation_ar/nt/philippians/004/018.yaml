  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: ar
  text: 'أمّا أنا فقد تسلّمت كلَّ شيء[a]، وأنا في وفرة. وقد امتلأتُ، إذ تسلّمتُ من أبفرودتس ما جاءني منكم: رائحةً عطرةً، وذبيحةً مقبولةً، مرضيّةً لله.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لديَّ كلُّ شيء»؛ وربما: «تسلّمتُ مستحقّاتي كاملةً».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχω
  choice: تسلّمت
  rationale: يفيد الفعل في سياق العطاء أن الشيء صار في حيازة بولس، وقد يحمل أيضًا إيحاء الاستيفاء الكامل. «تسلّمت» واضحة وطبيعية، مع إبقاء المعنى التجاري المحتمل في الحاشية.
- source_word: πάντα
  choice: كلَّ شيء
  rationale: ينقل شمول صيغة الجمع المحايد، ويشير طبيعيًا إلى مجمل ما أرسله أهل فيلبي.
- source_word: περισσεύω
  choice: صار لديَّ فائض
  rationale: يعبّر عن الوفرة التي تتجاوز حد الكفاية، ويحافظ على تصاعد العبارة من التسلّم إلى الفائض ثم الامتلاء.
- source_word: πεπλήρωμαι
  choice: قد امتلأت
  rationale: يحافظ على صورة الامتلاء في الأصل وعلى الحالة الحاضرة الناتجة من العطية، من غير حصر المعنى في التموين المادي وحده.
- source_word: δεξάμενος
  choice: إذ تسلّمت
  rationale: يبيّن الظرف المصاحب أو السبب الذي به صار بولس ممتلئًا، بصياغة عربية سلسة.
- source_word: παρὰ Ἐπαφροδίτου
  choice: من أبفرودتس
  rationale: يحدّد أبفرودتس بوصفه الشخص المباشر الذي تسلّم بولس منه العطية، فيما توضّح العبارة التالية أن مصدرها أهل فيلبي.
- source_word: τὰ παρ’ ὑμῶν
  choice: ما جاءني منكم
  rationale: صياغة عربية طبيعية تبيّن أن العطية صادرة منهم، من غير إضافة فعل «أرسلتم» غير المصرّح به لفظًا.
- source_word: ὀσμὴν εὐωδίας
  choice: رائحةً عطرة
  rationale: يحفظ الصورة التعبدية المتصلة بلغة الذبائح في العهد القديم، بعبارة واضحة ومألوفة في العربية الحديثة.
- source_word: θυσίαν δεκτήν
  choice: ذبيحةً مقبولةً
  rationale: يبقي الاستعارة القربانية صريحة وينقل قبول الله للعطية.
- source_word: εὐάρεστον τῷ θεῷ
  choice: مرضيّةً لله
  rationale: ينقل بوضوح كون الذبيحة موضع رضا الله، ويحافظ على صلتها النحوية المباشرة بـ«ذبيحة».
theological_decisions:
- issue: التصوير القرباني لعطية أهل فيلبي المادية
  choice: 'الإبقاء على لغة العبادة القربانية: «رائحةً عطرة، وذبيحةً مقبولةً مرضيّةً لله».'
  alternative: تسطيح الصورة إلى مجرد شكر على العطية، أو صياغتها إجمالًا بأنها «تقدمة يقبلها الله».
  rationale: يصف بولس العطية عمدًا بلغة الذبائح والعبادة؛ لذا يحفظ النص تتابع الرائحة والذبيحة ورضا الله من غير إضافة تقرير عقائدي يتجاوز العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أمّا أنا» لإبراز التحول الذي تؤديه δέ، و«بل» لإظهار التصاعد البلاغي. حُفظت صورة الامتلاء واللغة القربانية بدل استبدالهما بتفسير مالي مباشر.
