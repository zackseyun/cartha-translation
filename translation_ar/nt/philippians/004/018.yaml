  terminology: «أبفرودتس»، و«رائحة عطرة»، و«ذبيحة مقبولة مرضية لله» ألفاظ سليمة وتحفظ المجاز القرباني. تُعدَّل الحاشية لتعرض البديل المعجمي المحتمل لـἀπέχω بصورة أدق وأقل التباسًا.
