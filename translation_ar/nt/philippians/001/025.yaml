source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: ar
  text: وإذ أنا مقتنع بهذا، أعلم أنني سأبقى، وسأواصل البقاء معكم جميعًا، لأجل تقدُّمكم وفرحكم في الإيمان.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فرح الإيمان»، أو: «الفرح الآتي من الإيمان».'
    reason: alternative_reading
lexical_decisions:
- source_word: πεποιθὼς
  choice: واثق
  rationale: اسم الفاعل التام يدل على حالة راسخة من الثقة أو الاقتناع؛ و«واثق» عربية طبيعية تحافظ على هذه الدلالة.
- source_word: μενῶ
  choice: سأبقى
  rationale: ينقل معنى الفعل المستقبل، ويحافظ على التمييز بين البقاء في ذاته والاستمرار مع المؤمنين في الفعل التالي.
- source_word: παραμενῶ
  choice: أواصل البقاء معكم
  rationale: يُظهر معنى الاستمرار إلى جانبهم الذي يضيفه الفعل المركب، بدل دمجه تمامًا في معنى μενῶ السابق.
- source_word: πᾶσιν ὑμῖν
  choice: معكم جميعًا
  rationale: يحفظ شمول πᾶσιν، ويعبّر طبيعيًا عن علاقة المصاحبة التي يفيدها المجرور مع παραμενῶ.
- source_word: προκοπὴν
  choice: تقدُّمكم
  rationale: يدل اللفظ على المضي إلى الأمام أو الارتقاء، و«تقدُّم» واضحة وملائمة للنمو في سياق الإيمان.
- source_word: χαρὰν τῆς πίστεως
  choice: فرحكم في الإيمان
  rationale: صياغة عربية طبيعية تربط الفرح بالإيمان من غير حسم العلاقة الإضافية المرنة في اليونانية حسمًا سببيًا.
- source_word: πίστεως
  choice: الإيمان
  rationale: «الإيمان» هو المعنى الأنسب هنا في سياق حياة أهل فيلبي وتصديقهم، ولا يقتضي السياق معنى الأمانة.
theological_decisions:
- issue: دلالة الإضافة في χαρὰν τῆς πίστεως
  choice: فرحكم في الإيمان
  alternative: فرح إيمانكم؛ أو الفرح الآتي من إيمانكم
  rationale: تحتمل الإضافة اليونانية أكثر من علاقة دلالية. يحافظ المتن على تعبير عربي طبيعي غير سببي صراحة، وتورد الحاشية البدائل كي لا يُحسم الغموض الأصيل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أواصل البقاء» لإبراز الفرق بين الفعلين اليونانيين المتجاورين، مع أن في العبارة قدرًا مقصودًا من التكرار.
