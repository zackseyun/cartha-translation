- from: وإذ أنا واثق بهذا، أعلم أنني سأبقى وأواصل البقاء معكم جميعًا، لأجل تقدُّمكم وفرحكم في الإيمان.[a]
  to: وإذ أنا مقتنع بهذا، أعلم أنني سأبقى، وسأواصل البقاء معكم جميعًا، لأجل تقدُّمكم وفرحكم في الإيمان.[a]
  rationale: تقتصر المراجعة على تحسين الدقة الدلالية لـπεποιθώς، وإيضاح زمن الفعل المعطوف، وضبط بدائل الحاشية كي تحافظ على مرونة الإضافة اليونانية بلا إضافة تخصيص غير لازم. ولا يتغير معنى الآية.
