review_pass:
  verdict: revise
  source_fidelity: 'ينقل النص ترتيب المعاني الرئيسة بدقة: القناعة الراسخة، والبقاء والاستمرار مع الجماعة، وغاية تقدّمهم وفرحهم المرتبط بالإيمان. غير أن «واثق بهذا» تميل إلى معنى الثقة أكثر من معنى الاقتناع الذي يفيده πεποιθώς في هذا السياق، ولذلك فـ«مقتنع بهذا» أدق.'
  naturalness: الصياغة فصحى واضحة في الجملة. وإظهار الاستقبال في الفعل الثاني («وسأواصل») يجعل العطف أوضح وأشد سلاسة، مع الإبقاء على التمييز المقصود بين «سأبقى» و«أواصل البقاء».
  terminology: «تقدُّمكم» و«الإيمان» مناسبان. وتحافظ «فرحكم في الإيمان» على علاقة غير محسومة تمامًا بين الفرح والإيمان. ينبغي أن تعكس الحاشية البديل الحرفي الأقرب، «فرح الإيمان»، بدل إضافة ضمير المخاطبين في «فرح إيمانكم» دون أن يورده التركيب اليوناني صراحة.
  issues:
  - severity: low
    issue: اختيار «واثق» لـπεποιθώς
    rationale: الفعل في السياق يدل على حالة مستقرة من الاقتناع؛ «مقتنع بهذا» أقرب إلى المعنى وإلى مسار التدقيق الإنجليزي («convinced»).
  - severity: low
    issue: صياغة البديل الأول في الحاشية
    rationale: «فرح إيمانكم» تضيف ضميرًا غير ظاهر في عبارة χαρὰν τῆς πίστεως. «فرح الإيمان» يحافظ على الإضافة اليونانية كما هي، مع بقاء البديل السببي في الحاشية.
  revised_text: وإذ أنا مقتنع بهذا، أعلم أنني سأبقى، وسأواصل البقاء معكم جميعًا، لأجل تقدُّمكم وفرحكم في الإيمان.[a]
