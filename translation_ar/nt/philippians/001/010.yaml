id: PHP.1.10
reference: Philippians 1:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: ar
  text: لكي تميّزوا ما هو أفضل[a]، فتكونوا أنقياء وبلا عثرة إلى يوم المسيح،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكي تختبروا الأمور الأهم»، أو «لكي تقرّوا بما هو ممتاز»؛ وحرفيًا: «لكي تختبروا الأمور المختلفة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμάζειν
  choice: تميّزوا
  rationale: يفيد الفعل الاختبار والفحص المؤديين إلى حكم واعٍ؛ و«تميّزوا» تنقل هذا المعنى التقويمي بعبارة عربية طبيعية في هذا السياق.
- source_word: τὰ διαφέροντα
  choice: ما هو أفضل
  rationale: العبارة تعني حرفيًا «الأمور المختلفة»، ويمكن أن تدل سياقيًا على ما يتفوق أو ما له أهمية أكبر. ينقل «ما هو أفضل» القوة المقارِنة، مع إثبات الاحتمالات الأخرى في الحاشية.
- source_word: εἰλικρινεῖς
  choice: أنقياء
  rationale: يمكن أن تصف الكلمة النقاء أو الإخلاص الأصيل؛ و«أنقياء» تلائم السياق الأخلاقي والاقتران بالعبارة التالية.
- source_word: ἀπρόσκοποι
  choice: بلا عثرة
  rationale: تحافظ العبارة على صورة العثرة وعلى قدر من احتمال المعنى بين عدم التعثر وعدم التسبب في عثرة، بدل حصرها في معنى «بلا لوم».
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: إلى يوم المسيح
  rationale: تنقل «إلى» الاتجاه نحو اليوم الأخروي، وقد تحمل الامتداد الزمني أو الغاية. و«المسيح» هو المقابل العربي الطبيعي للقب Χριστός.
theological_decisions:
- issue: 'دلالة ἀπρόσκοποι: عدم التعثر أم عدم التسبب في عثرة'
  choice: بلا عثرة
  alternative: بلا لوم
  rationale: يحافظ الاختيار على التوتر الدلالي في اللفظ اليوناني، في حين أن «بلا لوم» ترجّح النتيجة الأخلاقية العامة.
- issue: دلالة εἰς في العبارة الأخروية
  choice: إلى يوم المسيح
  alternative: استعدادًا ليوم المسيح
  rationale: «إلى» أقرب إلى الصياغة المصدرية وتحفظ إمكان الدلالة الزمنية والغائية، أما البديل فيصرّح بالغاية وحدها.
translation_notes:
  register: صياغة عربية فصحى معاصرة واضحة وموقرة. روعي ترابط العبارة مع سياق الآية السابقة واللاحقة، ولذلك أُبقيت في صورة جملة غائية منتهية بفاصلة. لا حاجة إلى حاشية تميّز بين Messiah وChrist، لأن «المسيح» هو المقابل العربي الطبيعي لكليهما.
