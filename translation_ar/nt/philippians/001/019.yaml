id: PHP.1.19
reference: Philippians 1:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: ar
  text: فإني أعلم أن هذا سيؤول إلى نجاتي[a]، بدعائكم وإمداد روح يسوع المسيح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «خلاصي» أو «تبرئتي».'
    reason: يحمل اللفظ اليوناني معنى النجاة، وقد يدل أيضًا على الخلاص أو التبرئة بحسب فهم السياق.
lexical_decisions:
- source_word: οἶδα
  choice: أعلم
  rationale: ينقل معنى المعرفة الواثقة في صيغة عربية طبيعية ومباشرة.
- source_word: τοῦτό
  choice: هذا
  rationale: يحافظ على الإشارة العامة إلى مجمل وضع بولس الحاضر من غير تقييدها بتفصيل محدد.
- source_word: ἀποβήσεται
  choice: سيؤول إلى
  rationale: يعبّر بوضوح عن المآل أو النتيجة التي ستنتهي إليها الظروف.
- source_word: σωτηρίαν
  choice: نجاتي
  rationale: تلائم سياق سجن بولس وما ينتظره من إنقاذ أو فرج، مع إبقاء معنى الخلاص والتبرئة ممكنًا في الحاشية.
- source_word: δεήσεως
  choice: دعائكم
  rationale: لفظ عربي واضح يدل على التضرع والطلب الموجَّه إلى الله.
- source_word: ἐπιχορηγίας
  choice: إمداد
  rationale: يحافظ على صورة العون أو المؤونة المقدَّمة، من غير اختزالها في معنى عام مثل المساندة.
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: روح يسوع المسيح
  rationale: ينقل تركيب الإضافة اليوناني مباشرة، ويترجم Χριστός باللقب العربي المألوف «المسيح».
theological_decisions:
- issue: دلالة σωτηρίαν في سياق سجن بولس
  choice: نجاتي
  alternative: خلاصي أو تبرئتي
  rationale: يرجح السياق معنى النجاة من المحنة أو ما تؤول إليه قضية بولس، لكن اللفظ اليوناني يحتمل أيضًا معنى الخلاص الأوسع أو التبرئة؛ لذلك لم تُحسم الدلالة في اتجاه لاهوتي واحد، وأُثبتت البدائل في الحاشية.
- issue: علاقة الإضافة في ἐπιχορηγίας τοῦ πνεύματος
  choice: إمداد روح يسوع المسيح
  alternative: الإمداد بالروح، أو الإمداد الذي يمنحه الروح
  rationale: يحافظ تركيب المتن على قدر من الاحتمال بين كون الروح هو العطية الممدّ بها وكونه مصدر الإمداد، بدل حسم الإضافة اليونانية لمصلحة تفسير واحد.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُعمل «سيؤول إلى» للتعبير الطبيعي عن النتيجة، وحُفظ تركيب «روح يسوع المسيح» بصيغة الإضافة المباشرة. وُضعت علامة الحاشية [a] في المتن عند اللفظ ذي الدلالة المحتملة.
