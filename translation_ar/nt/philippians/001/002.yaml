  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: ar
  text: نعمة لكم وسلام من الله أبينا والرب يسوع المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: نعمة
  rationale: «نعمة» هي المقابل العربي الطبيعي الذي يحفظ دلالة الإحسان الإلهي وصيغة التحية البولسية من غير توسع تفسيري.
- source_word: ὑμῖν
  choice: لكم
  rationale: يحفظ صيغة الجمع في الضمير، ويؤدي وظيفة المجرور في البركة والتحية بعبارة عربية موجزة وطبيعية.
- source_word: εἰρήνη
  choice: سلام
  rationale: «سلام» هو المقابل المباشر، ويحفظ أصداء التحية الكتابية ومعنى الطمأنينة والخير.
- source_word: ἀπό
  choice: من
  rationale: تدل «من» بوضوح على المصدر كما يفعل حرف الجر اليوناني.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: الله أبينا
  rationale: تفهم العبارة على أن «أبينا» بدل أو وصف لله، وهذه الصياغة العربية واضحة وتحافظ على ترتيب العبارة وعلاقتها.
- source_word: κυρίου
  choice: الرب
  rationale: «الرب» هو المقابل الكتابي العربي الراسخ، ويحفظ الثقل المسيحاني للقب من غير اختزاله إلى معنى السيادة البشرية وحدها.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» ترجمة عربية دلالية وراسخة للقب Χριστός، وتفيد الممسوح مع بقائها الصيغة الطبيعية المعروفة في العربية.
theological_decisions:
- issue: دلالة Χριστοῦ في صيغة التحية البولسية
  choice: المسيح
  alternative: اعتباره جزءًا من اسم مركب من غير إبراز دلالته اللقبية
  rationale: الصيغة العربية «المسيح» راسخة وطبيعية، وفي الوقت نفسه تحفظ معنى اللقب ولا تحسم تمامًا مقدار تحوله إلى اسم ملازم في استعمال بولس.
- issue: علاقة ἀπό بالطرفين الموصولين بالواو
  choice: جعل «من» مصدرًا لكل من «الله أبينا» و«الرب يسوع المسيح»
  alternative: تكرار «من» قبل «الرب» للتوضيح
  rationale: اليونانية تستعمل حرف جر واحدًا يحكم الطرفين؛ والإبقاء على حرف واحد في العربية يحفظ بنية النص من غير إحداث فصل غير موجود في الأصل.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة، مع الحفاظ على إيجاز التحية الاسمية في اليونانية وعدم إضافة فعل مثل «لتكن». استُعملت الواو قبل «الرب» وفق تركيب الأصل، من غير إدخال علامات تفسيرية أو حواشٍ لا تقتضيها العربية.
