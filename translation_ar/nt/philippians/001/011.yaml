id: PHP.1.11
reference: Philippians 1:11
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: ar
  text: مَمْلُوئِينَ بِثَمَرِ الْبِرِّ[a] الَّذِي يَأْتِي بِوَاسِطَةِ يَسُوعَ الْمَسِيحِ[b]، لِمَجْدِ اللهِ وَحَمْدِهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثَمَرِ الْعَدْلِ».'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «يسوع خريستوس»؛ و«المسيح» ترجمة للقب خريستوس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: مَمْلُوئِينَ
  rationale: اسم مفعول يفيد حالة ناتجة مستمرة، ويحافظ على الصلة النحوية بما قبل الآية.
- source_word: καρπὸν
  choice: بِثَمَرِ
  rationale: يحافظ على الصورة المجازية التي تصف الناتج الأخلاقي والروحي.
- source_word: δικαιοσύνης
  choice: الْبِرِّ
  rationale: «البر» هو المقابل العربي المألوف في هذا السياق، مع إبقاء «العدل» احتمالًا معجميًا في الحاشية.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: الَّذِي يَأْتِي بِوَاسِطَةِ يَسُوعَ الْمَسِيحِ
  rationale: تُظهر «بواسطة» معنى الوسيلة أو الوساطة في διά مع المضاف إليه، وتربط العبارة بالثمر من غير حسم زائد لطبيعة الإضافة في «ثمر البر».
- source_word: Χριστοῦ
  choice: الْمَسِيحِ
  rationale: تنقل معنى اللقب اليوناني Χριστός بصيغة عربية طبيعية ومألوفة.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: لِمَجْدِ اللهِ وَحَمْدِهِ
  rationale: اللام تنقل غاية العبارة أو نتيجتها، وتحافظ «المجد» و«الحمد» على الاسمين في الأصل.
theological_decisions:
- issue: دلالة «ثمر البر»
  choice: الإبقاء على تركيب «ثمر البر» من غير تحديد ما إذا كان الثمر متصفًا بالبر أو مكوَّنًا منه.
  alternative: ثمر ينتجه البر، أو ثمر هو البر نفسه، أو ثمر يُحسب برًا.
  rationale: الإضافة اليونانية تحتمل أكثر من علاقة دلالية، والترجمة المباشرة تحفظ هذا الاتساع بدل حسمه تفسيريًا.
- issue: صلة عبارة «بواسطة يسوع المسيح»
  choice: ربطها بالثمر بوصفه آتيًا بواسطة يسوع المسيح.
  alternative: ربطها بالبر على نحو أضيق.
  rationale: ترتيب العبارة وسياق الصلاة يرجحان أن الثمر المقصود يتحقق بوساطة يسوع المسيح، مع تجنب شرح كيفية هذه الوساطة.
translation_notes:
  register: صياغة عربية فصحى واضحة ووقورة، تحافظ على كون الآية جزءًا تابعًا لما قبلها، وعلى استعارة الثمر، وعلى ألفاظ المصدر في الخاتمة.
