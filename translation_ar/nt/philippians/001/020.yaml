revisions:
- from: وذلك وفق انتظاري المتلهّف ورجائي أنني لن أُخزى في شيء[a]، بل إن المسيح سيتعظّم في جسدي بكل جرأة، كما في كل حين كذلك الآن أيضًا، سواء بالحياة أم بالموت.
  to: وذلك بحسب انتظاري المتلهّف ورجائي أنني لن أُخزى في أيّ شيء[a]، بل بكل جرأة، كما في كل حين، كذلك الآن أيضًا، سيُعظَّم المسيح في جسدي، سواء بالحياة أم بالموت.
  rationale: عُدِّل الفعل إلى «سيُعظَّم» للمحافظة على المبني للمجهول في الأصل، وأعيد ترتيب عبارات الجرأة والزمن لسلامة التعلّق والأسلوب. واستُبدلت «في شيء» بـ«في أيّ شيء» لإظهار شمول النفي بوضوح، من دون تغيير المعنى.
  reviewer_model: gpt-5.6-terra
