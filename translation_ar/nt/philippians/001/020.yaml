id: PHP.1.20
reference: Philippians 1:20
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: ar
  text: وذلك بحسب انتظاري المتلهّف ورجائي أنني لن أُخزى في أيّ شيء[a]، بل بكل جرأة، كما في كل حين، كذلك الآن أيضًا، سيُعظَّم المسيح في جسدي، سواء بالحياة أم بالموت.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لن أخجل».'
    reason: يحتمل الفعل αἰσχυνθήσομαι معنى الوقوع في الخزي ومعنى الشعور بالخجل؛ اختير الأول في المتن مع إثبات الثاني في الحاشية.
lexical_decisions:
- source_word: κατὰ
  choice: وفق
  rationale: تفيد مطابقة ما يرجوه بولس لما ينتظره، و«وفق» موجزة وطبيعية في العربية.
- source_word: ἀποκαραδοκίαν
  choice: انتظاري المتلهّف
  rationale: ينقل الاسم النادر معنى الترقب الشديد المتطلع إلى ما سيأتي، من غير إضعاف قوة التعبير.
- source_word: ἐλπίδα
  choice: رجائي
  rationale: «الرجاء» هو المقابل الكتابي العربي الطبيعي هنا، ويحافظ على اقترانه بالانتظار المتلهف.
- source_word: ἐν οὐδενὶ
  choice: في شيء
  rationale: يحافظ على النفي الشامل بصياغة عربية واضحة.
- source_word: αἰσχυνθήσομαι
  choice: لن أُخزى
  rationale: يحفظ احتمال المعنى المبني للمجهول، أي التعرض للخزي أو الافتضاح، مع بقاء احتمال الشعور بالخجل في الحاشية.
- source_word: παρρησίᾳ
  choice: بكل جرأة
  rationale: يناسب سياق الشهادة العلنية الشجاعة، ويحفظ قوة عبارة ἐν πάσῃ.
- source_word: μεγαλυνθήσεται
  choice: سيتعظّم
  rationale: يحافظ على صورة إظهار عظمة المسيح بدل استبدالها بتفسير مثل «سيتمجد» أو «يُرفع».
- source_word: Χριστὸς
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός ويحفظ دلالته المسيانية.
- source_word: ἐν τῷ σώματί μου
  choice: في جسدي
  rationale: ترجمة مباشرة واضحة تحفظ تركيز بولس على شهادته المتجسدة، في الحياة أو الموت.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: سواء بالحياة أم بالموت
  rationale: تنقل التوازي وتدع دلالة الوسيلة أو الظرف مفتوحة كما في διά مع المضاف إليه.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا مسيانيًا
  choice: المسيح
  alternative: المسيا
  rationale: «المسيح» لقب عربي راسخ وشفاف دلاليًا، ولا يحوّل اللفظ هنا إلى مجرد اسم علم ولا يحتاج إلى النقل الصوتي «المسيا».
- issue: كيفية تعظّم المسيح في جسد بولس
  choice: الإبقاء على «في جسدي» و«بالحياة أم بالموت»
  alternative: «من خلال جسدي» أو تفسير الحياة والموت بوصفهما وسيلتين حصريًا
  rationale: الصياغة المختارة تحافظ على الغموض المقصود في حروف الجر ولا تحسم ما إذا كان الجسد مجال التعظيم أم أداته، أو ما إذا كانت الحياة والموت وسيلة أم ظرفًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي التوازي البلاغي في «كما في كل حين كذلك الآن أيضًا» وفي «سواء بالحياة أم بالموت»، وتُركت التوترات الدلالية في المبني للمجهول وحروف الجر بلا حسم تفسيري زائد.
