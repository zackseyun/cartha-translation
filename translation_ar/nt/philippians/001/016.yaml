  source_fidelity: النص العربي ينقل بدقة البنية المقابِلة في οἱ μὲν بواسطة «أمّا هؤلاء»، ويُظهر فعل الكرازة المفهوم من السياق القريب دون تغيير المعنى. و«عن محبة»، و«عالمين»، و«للدفاع عن البشارة»، و«مُعيَّن» تؤدي عناصر النص اليوناني ودلالة κεῖμαι السياقية على نحو ملائم. لا يضيف النص فاعلًا للتعيين ولا تقريرًا لاهوتيًا زائدًا.
