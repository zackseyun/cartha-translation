base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/016.yaml
  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: ar
  text: أَمَّا هَؤُلَاءِ فَيُبَشِّرُونَ بِالْمَسِيحِ عَنْ مَحَبَّةٍ[a]، عَالِمِينَ أَنِّي مُعَيَّنٌ لِلدِّفَاعِ عَنِ الْبِشَارَةِ[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «أمّا هؤلاء فعن محبة»؛ والفعل «يبشّرون بالمسيح» مفهوم من السياق.'
    reason: implicit_action
  - marker: b
    text: 'أو: «أنني موضوع هنا للدفاع عن البشارة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν
  choice: أَمَّا هَؤُلَاءِ
  rationale: تحافظ «أمّا» على طرف المقابلة التي يكملها οἱ δέ في العدد التالي، و«هؤلاء» طبيعية في العربية ولا تفرض وصفهم بالسابقين أو اللاحقين.
- source_word: ἐξ ἀγάπης
  choice: عَنْ مَحَبَّةٍ
  rationale: تنقل الدافع الذي تفيده ἐξ مع الاسم المجرّد، بصياغة عربية واضحة وطبيعية.
- source_word: εἰδότες
  choice: عَالِمِينَ
  rationale: تحافظ على الصيغة الحالية وعلى ارتباط المعرفة بدافع عملهم من غير تحويلها إلى جملة سببية صريحة.
- source_word: εἰς ἀπολογίαν
  choice: لِلدِّفَاعِ
  rationale: تنقل الغاية التي تفيدها εἰς، وتحفظ معنى ἀπολογία بوصفه دفاعًا معللًا أو قضائيًا.
- source_word: τοῦ εὐαγγελίου
  choice: عَنِ الْبِشَارَةِ
  rationale: «البشارة» تعبير عربي واضح للمضمون الذي يدل عليه εὐαγγέλιον، وتلائم تركيب «الدفاع عن» الطبيعي في العربية.
- source_word: κεῖμαι
  choice: مُعَيَّنٌ
  rationale: تنقل الدلالة الاصطلاحية على كون بولس موضوعًا أو مكرسًا لهذه المهمة، بدل الترجمة المكانية الحرفية التي تبدو غامضة في العربية.
theological_decisions:
- issue: دلالة κεῖμαι في سياق سجن بولس
  choice: مُعَيَّنٌ
  alternative: مَوْضُوعٌ هُنَا
  rationale: تفيد الصياغة أن وضع بولس الراهن يخدم مهمة الدفاع عن البشارة، من غير التصريح بفاعل التعيين أو إضافة تقرير عقائدي لا يذكره النص صراحة.
- issue: الفعل المحذوف بعد οἱ μὲν
  choice: فَيُبَشِّرُونَ بِالْمَسِيحِ
  alternative: فَيَفْعَلُونَ ذَلِكَ
  rationale: الفعل مستفاد من سياق العددين السابقين حيث يدور الكلام على التبشير بالمسيح؛ إظهاره يجعل العربية مكتملة، مع التنبيه في الحاشية إلى الحذف في اليونانية.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُخدمت «أمّا» لإبراز المقابلة، وأُظهر الفعل المحذوف اعتمادًا على السياق مع توثيق ذلك في الحاشية. أُبقيت دلالة κεῖμαι مفتوحة بين التعيين والوضع في الظرف الراهن بواسطة حاشية بديلة.
