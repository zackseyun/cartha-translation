  terminology: «الحسد»، و«المنافسة»، و«حسن النية»، و«المسيح» مقابلات سليمة في السياق. «المنافسة» تحافظ على معنى التزاحم/التنافس في ἔρις دون تحميله تفسيرًا مذهبيًا.
