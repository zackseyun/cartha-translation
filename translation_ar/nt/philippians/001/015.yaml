  verdict: revise
  source_fidelity: تنقل الصياغة المقابلة بين «بعض... وبعض»، وسببَي الكرازة غير السليمين، والدافع الإيجابي المقابل، وتحافظ على «المسيح» لقبًا. لكن «يُنَادُونَ بِالْمَسِيح» قد تُفهم في العربية على أنها الدعاء إلى المسيح أو المناداة باسمه، ولا تؤدي بوضوح فعل κηρύσσουσιν المتعدي إلى «المسيح» بمعنى إعلان المسيح أو الكرازة به.
