base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: ar
  text: إن بعضهم يُعلِنون المسيح بدافع الحسد والمنافسة، وبعضهم بدافع حسن النية.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: بَعْضُهُمْ ... وبعضهم
  rationale: تنقل المقابلة بين جماعتين بعبارة عربية طبيعية وواضحة.
- source_word: διὰ φθόνον
  choice: بدافع الحسد
  rationale: تفيد διά مع النصب السببية هنا، والعبارة توضّح أن الحسد هو الدافع.
- source_word: ἔριν
  choice: المنافسة
  rationale: تلائم سياق التنافس الشخصي على المناداة بالمسيح، مع بقاء معنى الخصومة حاضرًا.
- source_word: δι’ εὐδοκίαν
  choice: بدافع حُسن النية
  rationale: تعبّر بوضوح عن الدافع الإيجابي المقابل للحسد والمنافسة، من غير إفراط في التحديد.
- source_word: τὸν Χριστόν
  choice: المسيح
  rationale: Χριστός لقب هنا، و«المسيح» هو المقابل العربي الراسخ والدقيق.
- source_word: κηρύσσουσιν
  choice: يُنَادُونَ بِـ
  rationale: تنقل معنى الإعلان العلني الذي يحمله الفعل، من غير حصره في الوعظ المؤسسي.
