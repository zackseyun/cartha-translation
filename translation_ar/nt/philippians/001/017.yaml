revisions:
- from: أَمَّا الآخَرُونَ فَيُنَادُونَ بِالْمَسِيحِ بِدَافِعِ الطُّمُوحِ الأَنَانِيِّ، لَا بِنِيَّةٍ خَالِصَةٍ، ظَانِّينَ أَنَّهُمْ يَزِيدُونَ ضِيقِي فِي قُيُودِي.[a]
  to: أَمَّا الآخَرُونَ فَيُعْلِنُونَ الْمَسِيحَ بِدَافِعِ الطُّمُوحِ الأَنَانِيِّ، لَا بِنِيَّةٍ خَالِصَةٍ، ظَانِّينَ أَنَّهُمْ يُضِيفُونَ إِلَى قُيُودِي ضِيقًا.[a]
  rationale: استُبدل «ينادون بالمسيح» بـ«يعلنون المسيح» لتأدية معنى الإعلان العلني في καταγγέλλουσιν بعبارة عربية واضحة. كما استُبدلت العبارة الأخيرة بـ«يضيفون إلى قيودي ضيقًا» لتقريب θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου مع إبقاء العلاقة الموجزة بين الضيق والقيود من دون افتراض أن المقصود هو زيادة ضيق قائم أو تقييده بظرف «في».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:22Z'
review_pass:
  verdict: revise
  source_fidelity: ينقل النص المقابلة بين «الآخرين» والفريق السابق، ودافع الأنانية/التنافس، وغياب نقاء الدافع، وظنهم أنهم يسببون ضيقًا متعلقًا بقيود بولس. لكن «ينادون بالمسيح» لا تؤدي بوضوح فعل καταγγέλλουσιν المتعدي («يعلنون/يكرزون بالمسيح»)، و«يزيدون ضيقي في قيودي» تجعل الضيق ضيقًا قائمًا لبولس وتحدد العلاقة الزمنية/المكانية أكثر من العبارة اليونانية.
  naturalness: الصياغة فصيحة عمومًا، إلا أن «ينادون بالمسيح» أقل سلاسة ودقة في العربية المعاصرة بهذا المعنى، و«يزيدون ضيقي في قيودي» أضعف من حيث التركيب. «يعلنون المسيح» و«يضيفون إلى قيودي ضيقًا» أوضحان وأقربان إلى البنية الأصلية.
  terminology: «المسيح» مقابل عربي سليم لـ Χριστόν. و«الطموح الأناني» مقبول لـ ἐριθεία، مع أن العبارة تحمل أيضًا إيحاء السعي التنافسي أو التحزبي. «بنية خالصة» تؤدي ἁγνῶς على نحو مناسب.
  issues:
  - severity: medium
    issue: الفعل «ينادون بالمسيح» غير دقيق بما يكفي لـ καταγγέλλουσιν.
    rationale: الفعل اليوناني يعني الإعلان أو الكرازة العلنية بالمسيح، مع كون «المسيح» مفعوله المباشر. أما «ينادي بـ» فيوحي بالنداء أو الدعوة إلى شيء، ولا يبين فعل الإعلان بوضوح.
  - severity: medium
    issue: «يزيدون ضيقي في قيودي» يفسر تركيب θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου تفسيرًا أضيق.
    rationale: الأصل يتكلم عن إثارة/إضافة ضيق «لقيودي»، لا يصرح بأن الضيق الحالي لبولس يزداد ولا يجعل «في القيود» ظرفًا زمنيًا أو مكانيًا مباشرًا. الصياغة المنقحة تحفظ صلة الضيق بالقيود دون هذا التضييق.
  revised_text: أَمَّا الآخَرُونَ فَيُعْلِنُونَ الْمَسِيحَ بِدَافِعِ الطُّمُوحِ الأَنَانِيِّ، لَا بِنِيَّةٍ خَالِصَةٍ، ظَانِّينَ أَنَّهُمْ يُضِيفُونَ إِلَى قُيُودِي ضِيقًا.[a]
