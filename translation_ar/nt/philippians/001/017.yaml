base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: ar
  text: أَمَّا الآخَرُونَ فَيُعْلِنُونَ الْمَسِيحَ بِدَافِعِ الطُّمُوحِ الأَنَانِيِّ، لَا بِنِيَّةٍ خَالِصَةٍ، ظَانِّينَ أَنَّهُمْ يُضِيفُونَ إِلَى قُيُودِي ضِيقًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «إلى قيودي». والقيود تشير هنا إلى سجن بولس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: الطموح الأناني
  rationale: ينقل معنى السعي إلى المصلحة الذاتية بروح تنافسية أو تحزبية، لا مجرد الأنانية العامة.
- source_word: Χριστόν
  choice: المسيح
  rationale: اللفظ هنا يحمل دلالته اللقبية، إذ إن المسيح هو مضمون المناداة.
- source_word: καταγγέλλουσιν
  choice: ينادون بـ
  rationale: يحفظ معنى الإعلان العلني من غير قصره على الوعظ الرسمي.
- source_word: ἁγνῶς
  choice: بنية خالصة
  rationale: يشير السياق إلى نقاء الدافع؛ وهذه الصياغة أوضح عربيًا من النقل الحرفي «بطهارة».
- source_word: οἰόμενοι
  choice: ظانين
  rationale: يبقي معنى اعتقادهم أو تصورهم من غير الجزم بتحقق قصدهم.
- source_word: θλῖψιν ἐγείρειν
  choice: يزيدون ضيقي
  rationale: ينقل طبيعيًا في العربية معنى إثارة الضيق أو التسبب في مزيد منه، مع ملاءمة السياق الشخصي.
- source_word: τοῖς δεσμοῖς μου
  choice: في قيودي
  rationale: يحافظ على صورة القيود الواردة في اليونانية، وهي كناية سياقية واضحة عن السجن.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيح يسوع / لقب بصياغة تفسيرية
  rationale: «المسيح» هو المقابل العربي الطبيعي الذي يحفظ الصفة اللقبية من غير إضافة اسم غير وارد في الآية.
- issue: علاقة الضيق بالقيود في θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου
  choice: يزيدون ضيقي في قيودي
  alternative: يثيرون ضيقًا لقيودي / يضيفون ضيقًا إلى قيودي
  rationale: التركيب اليوناني موجز ويمكن فهمه باعتباره إحداث ضيق مرتبط بقيود بولس؛ تحافظ الصياغة على هذا الارتباط من غير تحديد آلية الضرر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظت صورة «القيود» في المتن، ووُضّح مدلولها السياقي في الحاشية. لم توضع علامة حاشية بعد «المسيح» لأن البديل الإنجليزي «Christ» لا يمثل اختلافًا ذا معنى في العربية.
