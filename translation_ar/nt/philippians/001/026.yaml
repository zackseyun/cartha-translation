  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: ar
  text: لكي يزداد افتخاركم[a] في المسيح يسوع بسببي[b]، من خلال مجيئي[c] إليكم من جديد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «سبب افتخاركم». فقد يدل الاسم اليوناني على الافتخار نفسه أو على سببه وموضوعه.
    reason: lexical_alternative
  - marker: b
    text: حرفيًا «فيَّ»؛ والمعنى هنا على الأرجح «بسببي» أو «من جهتي».
    reason: lexical_alternative
  - marker: c
    text: أو «بحضوري بينكم من جديد». فاللفظ اليوناني قد يعني المجيء أو الحضور.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تُبقي دلالة الغاية أو النتيجة المتصلة بما سبق، بصياغة عربية واضحة.
- source_word: τὸ καύχημα ὑμῶν
  choice: افتخاركم
  rationale: ينقل الاسم بصيغة موجزة وطبيعية، مع إبقاء احتمال أن يكون المقصود سبب الافتخار في الحاشية.
- source_word: περισσεύῃ
  choice: يزداد
  rationale: يؤدي معنى الكثرة والنماء في هذا السياق، ويحافظ تركيب «لكي يزداد» على قوة صيغة الاحتمال التابعة لـἵνα.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: ترجمة مباشرة وطبيعية تحفظ الارتباط بالمسيح يسوع من غير حسم زائد لطبيعة هذا الارتباط.
- source_word: ἐν ἐμοὶ
  choice: بسببي
  rationale: يبين أن بولس هو مناسبة الافتخار أو سببه، بينما تُذكر الصيغة الحرفية «فيَّ» في الحاشية لصون احتمال البنية اليونانية.
- source_word: διὰ τῆς ἐμῆς παρουσίας
  choice: بمجيئي
  rationale: يفهم παρουσία هنا على أنها مجيء بولس الشخصي إلى المؤمنين، وتؤدي الباء معنى الوسيلة أو المناسبة بإيجاز طبيعي.
- source_word: πάλιν πρὸς ὑμᾶς
  choice: إليكم من جديد
  rationale: صياغة عربية مألوفة تحفظ معنى الزيارة المتجددة.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: '«المسيح» هو المقابل العربي الدال على اللقب، مع الحفاظ على ترتيب الأصل: المسيح يسوع.'
- issue: تعلّق عبارة ἐν Χριστῷ Ἰησοῦ
  choice: 'ربطها بالافتخار: «افتخاركم في المسيح يسوع»'
  alternative: 'ربطها بالفعل: «يزداد في المسيح يسوع»'
  rationale: الربط بالافتخار هو الأرجح نحويًا ويتفق مع الاستعمال البولسي، من دون إضافة تفسير مذهبي.
- issue: معنى ἐν ἐμοὶ
  choice: بسببي
  alternative: فيَّ
  rationale: السياق يرجح أن بولس هو مناسبة الافتخار بسبب عودته، لكن الحاشية تحفظ اللفظ الحرفي وما فيه من احتمال.
