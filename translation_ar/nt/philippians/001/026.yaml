  register: فصحى معاصرة واضحة وموقرة. حوفظ على ترتيب الأفكار في اليونانية قدر الإمكان، مع تجنب تتابع جارّ ومجرور ثقيل، وإثبات البدائل الدلالية الحقيقية في الحواشي.
