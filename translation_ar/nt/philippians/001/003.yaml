lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: أشكر
  rationale: فعل مضارع خبري متكلم مفرد؛ و«أشكر» تعبير عربي مباشر وطبيعي يحفظ القوة الفعلية في الأصل.
- source_word: τῷ θεῷ μου
  choice: إلهي
  rationale: المجرور اليوناني متعلق بفعل الشكر، ويؤديه العربية طبيعيًا مفعولًا به، مع الحفاظ على ضمير الملكية.
- source_word: ἐπὶ πάσῃ τῇ μνείᾳ
  choice: كلما تذكرت
  rationale: تفيد العبارة مناسبة الشكر المتكررة؛ وصيغة «كلما» تنقل معنى ἐπὶ مع πάσῃ والاسم المفرد بسلاسة، من غير إثبات علاقة سببية ليست صريحة.
- source_word: ὑμῶν
  choice: كم
  rationale: الضمير في الأصل جمع، وقد نُقل بضمير جمع المخاطبين في «تذكرتكم».
