source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: ar
  text: فقط، اسلكوا سلوكًا يليق ببشارة المسيح[a]، لكي أسمع عنكم، سواء أتيت ورأيتكم أم كنت غائبًا، أنكم ثابتون بروح واحدة[b]، وبنفس واحدة تجاهدون معًا من أجل إيمان البشارة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عيشوا كمواطنين». يحمل الفعل اليوناني إيحاءات تتصل بالمواطنة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «في روح واحد»، وقد يُفهم أنه الروح القدس.'
    reason: alternative_reading
  - marker: c
    text: 'يمكن أيضًا: «تجاهدون جنبًا إلى جنب من أجل الإيمان بالبشارة».'
    reason: alternative_reading
lexical_decisions:
- source_word: Μόνον
  choice: فقط
  rationale: يحفظ التقديم والتوكيد في اليونانية من غير إضافة تفسيرية.
- source_word: ἀξίως
  choice: كما يليق بـ
  rationale: تعبير عربي طبيعي يؤدي معنى السلوك على نحو جدير بالبشارة.
- source_word: πολιτεύεσθε
  choice: عيشوا
  rationale: يؤدي معنى السلوك في الحياة بوضوح، مع بيان الإيحاء المدني الممكن في الحاشية.
- source_word: τοῦ εὐαγγελίου τοῦ Χριστοῦ
  choice: بشارة المسيح
  rationale: «البشارة» عربية واضحة وشائعة، و«المسيح» يقابل اللقب Χριστός في الاستعمال العربي الكتابي المستقر.
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: أسمع عنكم
  rationale: صياغة عربية طبيعية تحافظ على معنى العبارة اليونانية.
- source_word: στήκετε
  choice: أنكم ثابتون
  rationale: ينقل معنى الرسوخ والثبات في سياق الخبر الذي يرجو بولس سماعه.
- source_word: ἐν ἑνὶ πνεύματι
  choice: بروح واحدة
  rationale: يبقي «روح» بلا حسم صريح بين الروح المشترك والروح القدس، مع إيراد الاحتمال في الحاشية.
- source_word: μιᾷ ψυχῇ
  choice: بنفس واحدة
  rationale: يحافظ على صورة ψυχή وعلى موازاتها لعبارة «بروح واحدة».
- source_word: συναθλοῦντες
  choice: تجاهدون معًا
  rationale: يحفظ معنى المشاركة في الكفاح والإيحاء التنافسي في الفعل اليوناني بصياغة عربية مفهومة.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: لأجل إيمان البشارة
  rationale: يبقي تركيب الإضافة اليوناني محتمل الدلالة بدل حصره في «الإيمان بالبشارة».
theological_decisions:
- issue: هل πνεύματι يشير إلى الروح القدس أم إلى روح أو عزم مشترك؟
  choice: بروح واحدة
  alternative: في روح واحد، أي الروح القدس
  rationale: الموازاة مع «بنفس واحدة» ترجح الوحدة في الروح والعزم، لكن النص لا يمنع الإشارة إلى الروح القدس؛ لذلك تُحفظ الإمكانية في الحاشية.
- issue: دلالة τῇ πίστει τοῦ εὐαγγελίου
  choice: لأجل إيمان البشارة
  alternative: لأجل الإيمان بالبشارة
  rationale: الإضافة اليونانية تحتمل الإيمان المتصل بالبشارة أو الإيمان بها؛ حافظ النص الرئيس على هذا الاتساع وذكرت الحاشية البديل.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «عيشوا» طبيعيًا في المتن، مع إبقاء النبرة الأمرية الجامعة؛ ويحمل الفعل اليوناني πολιτεύεσθε إيحاءً مدنيًا، أي العيش بوصفهم مواطنين، لكن إدخاله حرفيًا في المتن يثقل العربية. حُفظت التوترات الدلالية الرئيسة في πνεύματι وفي تركيب «إيمان البشارة» دون حسم زائد.
