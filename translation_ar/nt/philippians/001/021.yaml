  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: ar
  text: لِأَنَّ أَنْ أَحْيَا، بِالنِّسْبَةِ إِلَيَّ، هُوَ الْمَسِيحُ، وَأَنْ أَمُوتَ رِبْحٌ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμοὶ
  choice: عندي
  rationale: تنقل الداتيف الشخصي وتبرز منظور بولس الذاتي بعبارة عربية موجزة وطبيعية.
- source_word: γὰρ
  choice: لأنَّ
  rationale: تُظهر أن العبارة تعليل للفكر السابق، وتحافظ على ترابط الحجة.
- source_word: τὸ ζῆν
  choice: الحياة
  rationale: المصدر المؤول بأداة التعريف مستعمل استعمال الاسم؛ و«الحياة» عربية واضحة وتحافظ على الإيجاز والتوازي.
- source_word: Χριστὸς
  choice: المسيح
  rationale: الترجمة العربية المألوفة للقب Χριστός، وهي هنا تلائم أيضًا استعماله الشبيه بالاسم عند بولس.
- source_word: τὸ ἀποθανεῖν
  choice: الموت
  rationale: ينقل المصدر المؤول استعمالًا اسميًا ويحافظ على الموازاة الموجزة مع «الحياة».
- source_word: κέρδος
  choice: ربح
  rationale: ينقل معنى المنفعة أو المكسب بإيجاز ووضوح من غير شرح زائد.
theological_decisions:
- issue: طبيعة العلاقة الاسمية في «τὸ ζῆν Χριστός»
  choice: الْحَيَاةَ عِنْدِي هِيَ الْمَسِيحُ
  alternative: أَنْ أَحْيَا هُوَ الْمَسِيحُ
  rationale: يحافظ هذا التركيب على التكثيف اللاهوتي في الأصل من غير تفسير معنى كون المسيح غاية الحياة أو مصدرها أو مضمونها، وتساعد «هي» على وضوح الجملة الاسمية بالعربية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة، مع ضبط أواخر الكلمات اللازمة لبيان عمل «لأنَّ» والتوازي بين شطري الآية. لم تُضف حاشية «المسيّا» لأن «المسيح» هو المقابل العربي اللقبي المباشر والمستقر لـΧριστός، فلا تمثل «المسيّا» هنا معنى عربيًا بديلًا مستقلًا.
