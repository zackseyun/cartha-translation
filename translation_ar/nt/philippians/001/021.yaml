  source_fidelity: ينقل النص العلاقة الشخصية في ἐμοὶ، والتعليل في γάρ، والتوازي بين «العيش/الموت»، ومعنى κέρδος. لكن «الحياة عندي» أقل دقة وطبيعية من جعل المنظور الشخصي متعلقًا بالجملة كلها، كما أن «الحياة» قد تُضعف قليلًا مقابلة المصدرين «أن أحيا/أن أموت».
