  terminology: «المسيح» المقابل العربي المستقر لـΧριστός، و«ربح» مقابل مناسب لـκέρδος. لا تحتاج «المسيّا» إلى حاشية هنا، لأنها ليست بديلًا عربيًا أوضح أو أكثر فائدة للقارئ من «المسيح».
