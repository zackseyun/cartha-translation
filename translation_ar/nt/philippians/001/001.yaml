base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: ar
  text: بولس وتيموثاوس، عبدا المسيح يسوع، إلى جميع القديسين في المسيح يسوع الذين في فيلبي، مع المشرفين والشمامسة:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «عبدا» بـ«خادما»، و«المشرفين» بـ«الأساقفة».
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: عبدا
  rationale: المثنى المضاف يطابق بولس وتيموثاوس، ويحفظ دلالة الانتماء والخضوع الملزم في اللفظة اليونانية، بخلاف «خادما» التي قد توحي بخدمة طوعية عامة.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: المسيح يسوع
  rationale: «المسيح» المقابل العربي الطبيعي للقب Χριστός، ويحفظ طابعه اللقبي مع إبقاء يسوع اسمًا.
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: إلى جميع القديسين
  rationale: صياغة عربية موجزة ومألوفة تحفظ شمول الخطاب وهوية المخاطبين بوصفهم مقدسين.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: الإبقاء على «في» يحفظ عبارة بولس الدالة على الارتباط بالمسيح ولا يحولها إلى شرح تفسيري.
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: الذين في فيلبي
  rationale: جملة صلة عربية طبيعية تحفظ التحديد المكاني الصريح من غير تثقيل بترجمة حرفية للفعل الكينوني.
- source_word: σὺν
  choice: مع
  rationale: المقابل العربي الطبيعي الذي يؤدي معنى المصاحبة والاشتمال في التحية.
- source_word: ἐπισκόποις
  choice: المشرفين
  rationale: يترجم المعنى الوظيفي الشفاف للفظة، ويتجنب حصرها في التصور الكنسي المتأخر المرتبط بلفظ «الأساقفة».
- source_word: διακόνοις
  choice: الشمامسة
  rationale: في اقترانها بالمشرفين تدل على خدمة كنسية معروفة، و«الشمامسة» هو المقابل العربي الراسخ في هذا السياق.
theological_decisions:
- issue: دلالة δοῦλοι في وصف بولس وتيموثاوس
  choice: عبدا
  alternative: خادما
  rationale: اختير «عبدا» لحفظ معنى التبعية والملكية الكامن في اللفظة، مع إبقاء البديل الأخف في الحاشية لأن «عبد» قد تُفهم في العربية ضمن مجال دلالي قوي.
- issue: ترجمة Χριστός في صيغة التحية البولسية
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: يحفظ الترتيب اليوناني ويعامل «المسيح» بوصفه لقبًا، من غير تحويله إلى اسم شخصي محض.
- issue: هوية ἐπισκόποις الكنسية
  choice: المشرفين
  alternative: الأساقفة
  rationale: الترجمة الوظيفية تحفظ المعنى المباشر وتتفادى إسقاط بنية كنسية لاحقة على النص، مع إثبات المقابل التقليدي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ البناء الرسائلي الموجز، واستُخدم المثنى «عبدا» لمطابقة الاسمين، مع تجنب ألفاظ مذهبية تفسيرية زائدة.
