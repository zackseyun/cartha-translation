translation:
  language: ar
  text: بسبب مشاركتكم في الإنجيل منذ اليوم الأول إلى الآن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأجل الإنجيل». يمكن للعبارة اليونانية أن تدل إما على مجال مشاركتهم المشتركة وإما على غايتها أو هدفها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ ὑμῶν
  choice: بسبب مشاركتكم
  rationale: تفيد ἐπί مع المجرور هنا أساس الشكر أو سببه في سياق الجملة، وتدل κοινωνία على إسهام مشترك فعّال، لا على مجرد الألفة؛ لذا تنقل «بسبب مشاركتكم» المعنى بوضوح وطبيعية.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: في الإنجيل
  rationale: يمكن لعبارة εἰς هنا أن تدل على مجال المشاركة أو غايتها. يحافظ «في الإنجيل» على الصلة الوثيقة بين المشاركة والإنجيل من غير حسم الدلالة الغائية الممكنة، وهي مذكورة في الحاشية.
- source_word: εὐαγγέλιον
  choice: الإنجيل
  rationale: «الإنجيل» هو المقابل العربي الراسخ الذي يحفظ الثقل الاصطلاحي للكلمة في رسائل بولس.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας
  choice: منذ اليوم الأول
  rationale: تحدد العبارة نقطة بدء مشاركة أهل فيلبي، و«منذ» عربية طبيعية توحي باستمرارها.
- source_word: ἄχρι τοῦ νῦν
  choice: إلى الآن
  rationale: تنقل امتداد المشاركة حتى زمن كتابة الرسالة بصياغة عربية واضحة ومألوفة.
theological_decisions:
- issue: دلالة εἰς τὸ εὐαγγέλιον
  choice: في الإنجيل
  alternative: لأجل الإنجيل
  rationale: يحتمل التركيب أن يصف مجال المشاركة أو هدفها. أُبقي الاحتمال الأول في المتن لقربه من البنية اليونانية وسلاسته، مع إثبات الاحتمال الغائي في الحاشية بدل إلغاء التوتر الدلالي.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، تحافظ على إيجاز الأصل ووقاره، وتستخدم «مشاركة» للدلالة على الإسهام المشترك الفعّال دون تحميل العبارة معنى طائفيًا خاصًا.
