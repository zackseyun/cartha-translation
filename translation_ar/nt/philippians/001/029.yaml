  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: ar
  text: لأنه قد أُنعِم عليكم، من أجل المسيح، لا أن تؤمنوا به فقط، بل أن تتألّموا من أجله أيضًا.[أ]
  philosophy: optimal-equivalence
  footnotes:
  - marker: أ
    text: 'يمكن أيضًا ترجمة العبارة: «لأنه قد وُهِب لكم، من أجل المسيح، لا أن تؤمنوا به فقط، بل أن تتألّموا من أجله أيضًا».'
    reason: بديل معجمي لـ«أُنعِم عليكم» يحافظ على معنى العطية في ἐχαρίσθη وعلى شمولها الإيمان والتألّم، من غير إعادة صياغة τὸ ὑπὲρ Χριστοῦ بمعنى أضيق أو مختلف.
lexical_decisions:
- source_word: ὅτι
  choice: لأنكم
  rationale: تُدخل ὅτι هنا تعليلًا لما سبق، و«لأنكم» تؤدي هذا الربط بوضوح في العربية.
- source_word: ἐχαρίσθη
  choice: قد أُنعِم عليكم
  rationale: يحفظ التعبير معنى العطية المتفضَّل بها الكامن في الفعل، لا مجرد السماح، مع إبقاء الفاعل الإلهي مفهومًا من صيغة المبني للمجهول كما في اليونانية.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: من أجل المسيح
  rationale: تفيد ὑπέρ هنا الصلة بالمسيح بوصفه سبب العطية ومحورها، ويظل «المسيح» في العربية لقبًا مفهومًا وطبيعيًا.
- source_word: πιστεύειν εἰς αὐτόν
  choice: أن تؤمنوا به
  rationale: هذه الصياغة هي المقابل العربي الطبيعي لوضع الإيمان في شخص، وتحفظ اتجاه التركيب اليوناني.
- source_word: πάσχειν
  choice: أن تتألّموا
  rationale: ينقل الفعل مباشرة معنى معاناة الألم، مع موازاة المصدر السابق في بنية الجملة.
- source_word: ὑπὲρ αὐτοῦ
  choice: من أجله
  rationale: يعبّر بوضوح عن التألم بسبب المسيح ولأجله، من دون حصر ὑπέρ في معنى النيابة.
theological_decisions:
- issue: هل تشمل العطية الإلهية الإيمان والتألّم معًا؟
  choice: صيغت الجملة بحيث يقع كلٌّ من الإيمان بالمسيح والتألّم من أجله ضمن ما أُنعِم به عليهم.
  alternative: تخفيف ἐχαρίσθη إلى معنى «سُمح لكم»، أو تركيب العبارة بما يوحي بأن العطية لا تشمل إلا أحد الأمرين.
  rationale: يجعل النص اليوناني المصدرين، الإيمان والتألّم، متعلقين بالفعل ἐχαρίσθη؛ لذلك ينبغي إبقاء التوتر اللاهوتي الصريح وعدم تلطيفه.
- issue: نطاق عبارة τὸ ὑπὲρ Χριστοῦ
  choice: «من أجل المسيح» مرتبطة بالعطية كلها، مع إبقاء صياغة موجزة.
  alternative: فهمها على أنها متعلقة بفعل الإيمان وحده أو إعادة صياغتها بما يحسم تركيبها أكثر مما يسمح به الأصل.
  rationale: التركيب اليوناني مكثف ويمكن أن يُفهم عنوانًا لما يأتي بعده؛ لذا تحافظ الترجمة والحاشية على هذا الاتساع من غير فرض تفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. اختير «أُنعِم عليكم» لإبراز معنى النعمة والعطية في ἐχαρίσθη، واستُخدم التوازي «أن تؤمنوا... أن تتألّموا» للمحافظة على بنية المصدرين اليونانيين.
