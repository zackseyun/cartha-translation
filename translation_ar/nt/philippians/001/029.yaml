  terminology: «المسيح» ترجمة طبيعية ودقيقة للقب Χριστός في هذا الموضع. و«أُنعِم عليكم» تؤدي، في هذا السياق، معنى العطية المتفضَّل بها في ἐχαρίσθη، و«من أجل» تؤدي ὑπέρ دون تحميلها معنى نيابيًا محددًا.
