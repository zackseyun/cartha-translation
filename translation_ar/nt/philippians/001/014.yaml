  to: ومعظم الإخوة[a]، وقد وثقوا في الرب بسبب قيودي، يجرؤون أكثر فأكثر على التكلُّم بالكلمة بلا خوف.
  rationale: يُصحَّح وصف الثقة لتفادي الإيحاء بأن النص يقول إن مقدارها ازداد، مع الحفاظ على دلالة الحالة الناتجة من الفعل التام اليوناني بواسطة «وقد وثقوا». كما يُستعمل «معظم» لإظهار معنى «الأغلبية» بوضوح. ولم يُغيَّر أي مصطلح لاهوتي أو موضع الحاشية أو معنى القيود والجرأة والكلام.
