review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما في ذلك «في الرب»، والسببية المرتبطة بقيود بولس، وازدياد الجرأة على الكلام بلا خوف. لكن «إذ ازدادت ثقتهم» يصرّح بازدياد مقدار الثقة، في حين أن اسم الفاعل التام πεποιθότας يصف الإخوة بوصفهم قد صاروا/أصبحوا واثقين في حالة قائمة؛ ولا يلزم منه أن الثقة نفسها ازدادت.
