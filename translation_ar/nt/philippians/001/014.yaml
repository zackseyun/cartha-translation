  terminology: «الرب»، و«قيودي»، و«الكلمة»، و«بلا خوف» مقابلات مناسبة ومحافظة على ألفاظ المصدر من غير إضافة تفسيرية. وحاشية «الإخوة والأخوات» مناسبة وتحافظ على صيغة المتن المذكرة مع بيان اتساع المرجع المحتمل.
