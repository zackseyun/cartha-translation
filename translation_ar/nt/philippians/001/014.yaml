reference: Philippians 1:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: ar
  text: ومعظم الإخوة[a]، وقد وثقوا في الرب بسبب قيودي، يجرؤون أكثر فأكثر على التكلُّم بالكلمة بلا خوف.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات»؛ فاللفظ يُرجَّح أنه يشير هنا إلى جماعة المؤمنين على نحو أوسع.
    reason: بديل معجمي يوضح أن صيغة الجمع المذكر قد تكون شاملة في هذا السياق.
lexical_decisions:
- source_word: πλείονας
  choice: أكثرُ
  rationale: مع أداة التعريف والمضاف إليه الدال على التبعيض، يشير التعبير إلى أكثر الإخوة أو غالبيتهم، لا إلى مجرد زيادة عددية مبهمة.
- source_word: ἀδελφῶν
  choice: الإخوة
  rationale: يحافظ على صيغة الجمع المذكر في اليونانية، مع بيان احتمال شمول المؤمنات في الحاشية.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحفظ العبارة البولسية كما هي، ويعبّر عن المجال أو الأساس الذي تقوم فيه ثقتهم.
- source_word: πεποιθότας
  choice: إذ ازدادت ثقتهم
  rationale: ينقل دلالة اسم الفاعل التام على بلوغ حالة راسخة من الثقة نتيجة تطور سابق، بصياغة عربية طبيعية.
- source_word: τοῖς δεσμοῖς μου
  choice: بسبب قيودي
  rationale: يحافظ على الصورة الحسية للقيود، ويعبّر عن الدلالة السببية المناسبة للسياق.
- source_word: περισσοτέρως
  choice: أكثر فأكثر
  rationale: تعبير عربي طبيعي يحفظ معنى الزيادة الملحوظة في الجرأة.
- source_word: τολμᾶν
  choice: يجرؤون
  rationale: ينقل معنى الإقدام الجريء على الفعل من غير إضافة معنى الوعظ أو الكرازة غير المصرح به في الفعل نفسه.
- source_word: ἀφόβως
  choice: بلا خوف
  rationale: يحفظ المعنى الصريح لانعدام الخوف، بدل الاكتفاء بتعبير أعم مثل «بجرأة».
- source_word: τὸν λόγον
  choice: الكلمة
  rationale: هو المقابل الأقرب للنص، ويحفظ احتمال الإشارة إلى رسالة الإنجيل من غير إضافة «الله»، غير الموجودة في هذه الصيغة من النص اليوناني.
- source_word: λαλεῖν
  choice: التكلُّم
  rationale: مقابل مباشر للفعل العام الدال على الكلام، من غير تقويته إلى «الكرازة» أو «الإعلان».
theological_decisions:
- issue: نطاق مدلول ἀδελφῶν
  choice: الإخوة في المتن، مع حاشية تذكر احتمال شمول الإخوة والأخوات
  alternative: الإخوة والأخوات؛ أو المؤمنون
  rationale: الصيغة اليونانية جمع مذكر، لذلك حُفظت في المتن، مع عدم حجب احتمال استعمالها عن جماعة المؤمنين الأوسع التي قد تضم الرجال والنساء.
- issue: متعلَّق عبارة ἐν κυρίῳ
  choice: 'رُبطت بازدياد الثقة: «ازدادت ثقتهم في الرب»'
  alternative: 'فهمها بمعنى أن الرب هو الفاعل أو الوسيلة: «بواسطة الرب»'
  rationale: التركيب الأقرب يجعل «في الرب» مجال الثقة أو أساسها، مع بقاء «بسبب قيودي» سببًا لزيادتها؛ وهذا يحفظ التوتر اللافت في كون القيود قد شجعت الآخرين.
translation_notes:
  register: صياغة عربية فصحى معاصرة واضحة ووقورة. حُفظت «الكلمة» و«في الرب» لقربهما من ألفاظ المصدر، واستُعمل «أكثر فأكثر» لسلاسة المقارنة في العربية. وُضع مؤشر الحاشية [a] مباشرة بعد اللفظ المعني.
