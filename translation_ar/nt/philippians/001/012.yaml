lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: أريد أن تعرفوا
  rationale: صياغة عربية طبيعية تحفظ قصد الكاتب الصريح في إطلاع المخاطَبين.
- source_word: δὲ
  choice: وَ
  rationale: تفيد انتقالًا خفيفًا في السياق، والواو العربية تؤديه طبيعيًا من غير إقحام ظرف زمني غير موجود في الأصل.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: تحفظ صيغة النداء المذكرة في اليونانية، مع بيان احتمال شمولها جماعة المؤمنين كلها في الحاشية.
- source_word: τὰ κατ’ ἐμὲ
  choice: ما جرى لي
  rationale: تعبير واضح وموجز يشمل أحوال بولس وما وقع له، بدل الترجمة الحرفية الجامدة «الأمور المتعلقة بي».
- source_word: μᾶλλον
  choice: بالحري
  rationale: ينقل معنى النتيجة المخالفة لما قد يكون متوقعًا، مع بقاء قدر من المرونة بين «بل» و«بالأحرى».
- source_word: εἰς προκοπὴν
  choice: أسهم ... في تقدُّم
  rationale: يحفظ تركيب الغاية أو النتيجة الدال على أن الظروف آلت إلى دفع البشارة إلى الأمام.
- source_word: τοῦ εὐαγγελίου
  choice: البشارة
  rationale: لفظ عربي مفهوم وديني راسخ ينقل معنى الخبر السار، مع إثبات البديل التفسيري في الحاشية.
- source_word: ἐλήλυθεν
  choice: قد أسهم
  rationale: تؤدي «قد» مع الفعل معنى النتيجة المتحققة القائمة من أحداث سابقة، بينما تتطلب العربية إعادة صياغة الفعل اليوناني اصطلاحيًا.
