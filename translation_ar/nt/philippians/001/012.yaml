  source_fidelity: 'ينقل النص عناصر الآية الأساسية بأمانة: قصد بولس في الإعلام، والنداء «الإخوة»، وما جرى له، ونتيجته في تقدُّم البشارة. لكن تركيب «أسهم بالحري» لا يؤدي بوضوح دلالة μᾶλλον هنا بوصفها نتيجة مخالفة للتوقع، كما أنه أقل سلاسة من التعبير العربي المباشر.'
