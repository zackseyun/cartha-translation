  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: ar
  text: 'وأنا على يقين من هذا الأمر عينه: أن الذي بدأ بينكم[a] عملًا صالحًا سيُتمّه إلى يوم المسيح يسوع.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فيكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: وأنا على يقين
  rationale: ينقل معنى الثقة الراسخة في صياغة عربية طبيعية، مع إظهار منظور المتكلم الذي يُفهم من سياق الجملة اليونانية.
- source_word: αὐτὸ τοῦτο
  choice: هذا الأمر عينه
  rationale: يحفظ توكيد العبارة اليونانية من غير صياغة حرفية متكلفة.
- source_word: ὁ ἐναρξάμενος
  choice: الذي بدأ
  rationale: يحافظ على الفاعل الشخصي من غير التصريح بأنه الله، إذ يترك النص اليوناني ذلك مفهومًا من السياق.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: ضمير المخاطبين جمع، والسياق موجَّه إلى جماعة فيلبي؛ لذا تُبرز «بينكم» البعد الجماعي، مع إثبات «فيكم» بوصفها احتمالًا معجميًا أصيلًا في الحاشية.
- source_word: ἔργον ἀγαθὸν
  choice: عملًا صالحًا
  rationale: ترجمة مباشرة ومألوفة لا تضيف تحديدًا لطبيعة العمل لم يذكره النص.
- source_word: ἐπιτελέσει
  choice: سيُتمّه
  rationale: تفيد إيصال العمل إلى تمامه، بعبارة عربية موجزة وواضحة.
- source_word: ἄχρι ἡμέρας
  choice: إلى يوم
  rationale: تحفظ الدلالة الزمنية للعبارة اليونانية، ويمكن أن تشمل استمرار العمل حتى ذلك اليوم وبلوغه غايته عنده من غير حسم زائد.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: «المسيح» المقابل العربي الطبيعي للقب Χριστός، مع إبقاء ترتيب الاسمين كما في النص اليوناني المعتمد.
theological_decisions:
- issue: هل عمل الله المقصود فردي أم جماعي؟
  choice: بينكم
  alternative: فيكم
  rationale: صيغة الجمع وسياق مخاطبة الكنيسة يرجحان إبراز المجال الجماعي، من غير نفي عمل الله في الأفراد؛ وقد حُفظ الاحتمال الآخر في الحاشية.
- issue: هل يُصرَّح بأن الفاعل هو الله؟
  choice: الذي بدأ
  alternative: الله الذي بدأ
  rationale: هوية الفاعل مفهومة لاهوتيًا وسياقيًا، لكن اليونانية لا تسميه صراحة في هذه العبارة، لذلك لا تضيف الترجمة الاسم.
- issue: هل يُفهم تمام العمل على أنه يقع في اليوم نفسه أم يستمر حتى ذلك اليوم؟
  choice: إلى يوم
  alternative: في يوم
  rationale: ἄχρι تدل أساسًا على الحد الزمني؛ وصياغة «إلى يوم» تحفظ قدرًا من التوتر بين الاستمرار حتى اليوم والتمام المرتبط به بدل حصر المعنى في لحظة واحدة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «على يقين» بدل تركيب اسمي جامد، و«هذا الأمر عينه» لإبقاء التوكيد، مع تجنب الألفاظ الطائفية أو التوسعات التفسيرية.
