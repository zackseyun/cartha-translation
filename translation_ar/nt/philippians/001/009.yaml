  to: 'وهذه صلاتي: أن تفيض محبتكم أكثر فأكثر في المعرفة وفي كل بصيرة،'
  rationale: صُحِّح تركيب فعل الصلاة إلى تعبير عربي فصيح، واختير «تفيض» لإبراز معنى الوفرة في περισσεύῃ، ووُضّح عطف «المعرفة» و«كل بصيرة» بتكرار حرف الجر. وحُفظ عدم تعيين متعلَّق المحبة، وكذلك اتساع العلاقة التي يفيدها ἐν.
