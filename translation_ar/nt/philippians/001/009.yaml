  text: καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/009.yaml
  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: ar
  text: 'وهذه صلاتي: أن تفيض محبتكم أكثر فأكثر في المعرفة وفي كل بصيرة،'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ τοῦτο
  choice: وهذا ما
  rationale: يحفظ أداة الربط واسم الإشارة، ويقدّم الانتقال إلى مضمون الصلاة بتركيب عربي طبيعي.
- source_word: προσεύχομαι
  choice: أصلّيه
  rationale: المضارع العربي يلائم دلالة الفعل اليوناني الحاضر على صلاة بولس المستمرة، والضمير العائد يجعل العبارة طبيعية بعد «وهذا ما».
- source_word: ἵνα
  choice: أن
  rationale: تقدّم مضمون الصلاة وغرضها بصورة عربية واضحة من غير الفصل القسري بين الدلالتين.
- source_word: ἡ ἀγάπη ὑμῶν
  choice: محبتكم
  rationale: ترجمة مباشرة ومألوفة تحفظ إسناد المحبة إلى المخاطبين من غير تحديد موضوعها، إذ لم يذكره النص صراحة.
- source_word: ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ
  choice: تزداد أكثر فأكثر
  rationale: تحفظ معنى النمو المتواصل والتكرار التوكيدي، بينما «تفيض» قد توحي بصورة مجازية أقوى مما يلزم في العربية.
- source_word: ἐν ἐπιγνώσει
  choice: في المعرفة
  rationale: تحفظ حرف الجر والبنية اليونانية، ولا تبالغ بترجمة ἐπίγνωσις إلى «المعرفة الكاملة».
- source_word: πάσῃ αἰσθήσει
  choice: كل بصيرة
  rationale: تنقل معنى الإدراك العملي أو الأخلاقي، لا مجرد الإحساس الحسي؛ و«بصيرة» واضحة ورصينة في هذا السياق.
theological_decisions:
- issue: متعلَّق المحبة
  choice: الإبقاء على «محبتكم» بلا مفعول محدد
  alternative: محبتكم لله أو بعضكم لبعض
  rationale: النص اليوناني لا يصرّح بمتعلَّق المحبة، وتحديده يزيل عمدًا اتساع العبارة واحتمالها.
- issue: دلالة ἐν مع المعرفة والبصيرة
  choice: في المعرفة وكل بصيرة
  alternative: بالمعرفة وكل بصيرة
  rationale: «في» تحافظ على الصياغة الأصلية التي قد تدل على المجال أو الارتباط الوثيق، من غير حصرها في معنى الوسيلة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختير تركيب طبيعي يحفظ مضمون الصلاة، مع إبقاء اتساع «المحبة» وغموض علاقة حرف الجر بالمعرفة والبصيرة دون تفسير مذهبي زائد.
