  text: τὸ δὲ ἐπιμένειν ⸀ἐν τῇ σαρκὶ ἀναγκαιότερον δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: ar
  text: ولكن أن أبقى في الجسد أكثر ضرورةً من أجلكم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن أواصل الحياة في الجسد».'
    reason: بديل معجمي يوضح أن المقصود هو استمرار الحياة الجسدية.
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: أن أبقى
  rationale: ينقل المصدر المعرّف المستعمل استعمال الاسم بصياغة عربية طبيعية، ويحافظ في السياق على معنى استمرار بولس في حياته الحاضرة.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد الأداة هنا الانتقال التقابلي من رغبة بولس في الرحيل ليكون مع المسيح إلى ضرورة بقائه لأجل المؤمنين.
- source_word: ἐν τῇ σαρκὶ
  choice: في الجسد
  rationale: تشير العبارة في هذا السياق إلى الوجود الأرضي المتجسد، لا إلى معنى أخلاقي مثل الطبيعة الخاطئة؛ ولفظ «الجسد» يحافظ على صورة الأصل.
- source_word: ἀναγκαιότερον
  choice: أكثر ضرورةً
  rationale: يحافظ على صيغة التفضيل في اليونانية بدل تسويتها إلى مجرد «ضروري».
- source_word: δι’ ὑμᾶς
  choice: من أجلكم
  rationale: تعبّر بوضوح وطبيعية عن كون بقاء بولس لمنفعة المخاطَبين.
theological_decisions:
- issue: معنى σάρξ في هذه الآية
  choice: الوجود الأرضي المتجسد («في الجسد»)
  alternative: المعنى الأخلاقي المجازي («الطبيعة الخاطئة») أو التفسير الموسع («أبقى حيًّا في هذا العالم»)
  rationale: يقابل بولس في السياق بين الرحيل ليكون مع المسيح وبين مواصلة حياته الجسدية لأجل أهل فيلبي؛ لذلك لا يسند السياق معنى أخلاقيًا للكلمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. حوفظ على التقابل، وعلى صيغة التفضيل، وعلى صورة «الجسد» من غير تحميلها معنى مذهبيًا غير مسند بالسياق.
