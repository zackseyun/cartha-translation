  yaml_path: translation/nt/philippians/001/030.yaml
  text: having the same struggle that you saw in me and now hear that I still have.
translation:
  language: ar
  text: وأنتم تخوضون الصراع نفسه الذي رأيتموني أخوضه، وتسمعون الآن أنني ما زلت أخوضه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγῶνα
  choice: الصراع
  rationale: يدل اللفظ هنا على الكفاح أو الصراع الذي يواجهه المؤمن بسبب الإنجيل، و«الصراع» واضح وطبيعي في العربية المعاصرة.
- source_word: ἔχοντες
  choice: وأنتم تخوضون
  rationale: المعنى الحرفي «ولكم/وأنتم تملكون» لا يلائم العربية مع «الصراع»؛ و«تخوضون» ينقل معنى المشاركة الفعلية المستمرة فيه، مع إبقاء الصيغة مرتبطة بسياق الجملة السابقة.
- source_word: ἐν ἐμοί
  choice: رأيتموني أخوضه ... أنني ما زلت أخوضه
  rationale: العبارة اليونانية حرفيًا «فيَّ»، لكنها تشير طبيعيًا إلى الصراع المتحقق في خبرة بولس. صيغ الفعل تجعل المعنى واضحًا بالعربية، و«ما زلت» تنقل استمرار الصراع من وقت رؤيتهم له إلى وقت سماعهم عنه الآن.
theological_decisions:
- issue: طبيعة الصراع واستمراره
  choice: عدم تحديد نوع الصراع، مع بيان أنه لا يزال قائمًا في خبرة بولس
  alternative: تفسيره صراحة بأنه اضطهاد أو سجن
  rationale: النص نفسه لا يحصر ἀγών في صورة واحدة، لذلك تُحفظ سعته الدلالية ولا يُستورد تحديد عقائدي أو تاريخي زائد، بينما يدل «الآن» مع المقابلة الزمنية على استمرار خبرة بولس.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة. استُخدمت «تخوضون الصراع» بوصفها عبارة طبيعية للقارئ المعاصر، مع الحفاظ على اتصال العبارة بما قبلها من خلال «وأنتم».
