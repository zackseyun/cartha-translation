  naturalness: «وأنتم تخوضون الصراع نفسه» عربية فصحى حديثة سليمة في سياقها المتصل بالآية السابقة. كما أن «رأيتموني أخوضه» و«تسمعون الآن أنني ما زلت أخوضه» أوضح وأيسر من النقل الحرفي لعبارة «فيَّ» مع حفظ مدلولها المقصود.
  terminology: «الصراع» مقابل مناسب وواسع لـ ἀγών هنا؛ فلا يقيّده بالاضطهاد أو السجن. والفعل «تخوضون» ملائم اصطلاحيًا في العربية للصراع ولا يحمل تقريرًا لاهوتيًا زائدًا.
