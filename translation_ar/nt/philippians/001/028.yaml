  rationale: توضح المراجعة أن الدليل المذكور يتعلق بمصير الطرفين، فتكرار «دليل» في الشق الثاني يزيل غموضًا نحويًا عربيًا من غير زيادة تفسيرية. واستُبدلت عبارتا «في شيء» و«المقاومين لكم» بتعابير أفصح وأشيع في الفصحى المعاصرة. وبقيت إحالة «هذا» مفتوحة كما في اليونانية.
