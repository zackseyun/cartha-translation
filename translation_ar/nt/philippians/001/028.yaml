  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: ar
  text: ولا ترتاعوا من أيّ شيء من الذين يعارضونكم[a]. فهذا دليل لهم على الهلاك[b]، ودليل لكم على الخلاص؛ وهذا من الله[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تفزعوا» أو «تُرهبوا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «علامة» أو «برهان» على الهلاك.'
    reason: lexical_alternative
  - marker: c
    text: قد يشير «هذا» إلى الخلاص خاصة، أو، على نحو أوسع، إلى الدليل السابق كله.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: ترتاعوا
  rationale: يفيد الفعل الاضطراب من الخوف أو الترويع أمام الخصوم. و«ترتاعوا» تعبير عربي موجز يحفظ قوة المعنى من غير مبالغة.
- source_word: ἐν μηδενί
  choice: في شيء
  rationale: يحافظ على الصياغة الشاملة في اليونانية، أي ألّا يكون خوفهم في أي أمر أو وجه.
- source_word: τῶν ἀντικειμένων
  choice: المقاومين لكم
  rationale: اسم الفاعل يدل على أشخاص يقفون في مواجهتهم ويعارضونهم، وإضافة «لكم» تُظهر العلاقة المفهومة من السياق.
- source_word: ἔνδειξις
  choice: دليل
  rationale: تدل الكلمة على علامة ذات قيمة استدلالية أو برهانية؛ و«دليل» واضحة وطبيعية في العربية.
- source_word: ἀπωλείας
  choice: الهلاك
  rationale: ينقل معنى الخراب أو المصير المدمر، مع إبقاء مدى الكلمة الأخروي من غير تفصيل زائد.
- source_word: σωτηρίας
  choice: الخلاص
  rationale: يحفظ الثقل اللاهوتي المعتاد للكلمة في سياق بولس، ولا يحصرها في نجاة ظرفية فحسب.
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: وهذا من الله
  rationale: يحافظ على اسم الإشارة وعلى إيجاز الأصل، ويترك مرجعه محتملًا بين الخلاص وحده والدلالة السابقة بأسرها.
theological_decisions:
- issue: مرجع اسم الإشارة τοῦτο («هذا»)
  choice: 'أُبقي واسعًا في المتن: «وهذا من الله».'
  alternative: قد يعود «هذا» إلى الخلاص خاصة، أو إلى الدليل السابق بجملته بما يشمله ثبات المؤمنين ومآل الطرفين.
  rationale: لا يحسم التركيب اليوناني مرجع اسم الإشارة حسمًا قاطعًا، لذلك ينبغي إبقاء الاحتمال اللاهوتي بدل اختيار تفسير واحد في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «ترتاعوا» لنقل شدة الخوف المقصودة، وحُفظ التوازي بين «لهم» و«لكم»، كما أُبقي إيجاز «وهذا من الله» لصون غموض مرجع اسم الإشارة.
