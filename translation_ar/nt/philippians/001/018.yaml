base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: ar
  text: فماذا إذًا؟ ليس المهم إلا أن المسيح يُعلَن بكل وسيلة، سواء بذريعة[a] أم بصدق، وبهذا أفرح. بل وسأفرح أيضًا.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بتظاهر».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بل وسأظل أفرح»؛ غير أن اليونانية تصرّح بالمستقبل، أما معنى الاستمرار فمفهوم محتمل من السياق.'
    reason: translation_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: فماذا إذًا؟
  rationale: يحفظ السؤال البلاغي القصير وانتقال بولس إلى خلاصة كلامه، من غير إضافة تفسيرية.
- source_word: πλὴν ὅτι
  choice: ليس المهم إلا أن
  rationale: ينقل قوة الحصر في العبارة اليونانية بصياغة عربية طبيعية؛ فمهما تكن الدوافع، تبقى الحقيقة التالية هي موضع اهتمام بولس.
- source_word: παντὶ τρόπῳ
  choice: بكل وسيلة
  rationale: يحفظ المعنى التوزيعي للعبارة، أي بأي وجه أو أسلوب يقع به الإعلان.
- source_word: προφάσει
  choice: بذريعة
  rationale: يقابل الدافع الظاهري أو غير الصادق من غير توسيع المعنى إلى حكم تفصيلي على نيات المبشرين.
- source_word: ἀληθείᾳ
  choice: بصدق
  rationale: يؤدي التضاد مع «بذريعة» بعبارة عربية موجزة وطبيعية.
- source_word: Χριστὸς
  choice: المسيح
  rationale: اللفظ اليوناني يحمل هنا معنى اللقب المعلَن؛ و«المسيح» هو المقابل العربي الراسخ الذي يحفظ هذا المعنى.
- source_word: καταγγέλλεται
  choice: يُعلَن
  rationale: يحفظ المبني للمجهول ودلالة الإعلان العلني، مع إمكان فهم المضارع بوصفه فعلًا جاريًا.
- source_word: ἐν τούτῳ
  choice: وبهذا
  rationale: يربط فرح بولس مباشرة بحقيقة إعلان المسيح، كما تفعل العبارة اليونانية من غير تحديد زائد.
- source_word: χαίρω
  choice: أفرح
  rationale: يحفظ دلالة الفرح المباشرة وقوة الفعل في السياق.
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: بل وسأفرح أيضًا
  rationale: ينقل القوة الاستدراكية والإضافية مع صيغة المستقبل، من غير تحويلها إلى معنى الاستمرار الصريح الذي لا تذكره الصيغة وحدها.
theological_decisions:
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: كريستوس/المسيح بوصفه اسمًا علمًا
  rationale: يَرِد اللفظ هنا في سياق مضمون الكرازة، ولذلك تُحفظ دلالته اللقبية في المقابل العربي المألوف «المسيح» من غير حسم مسائل تتجاوز النص.
- issue: موضوع فرح بولس
  choice: ربط الفرح بإعلان المسيح نفسه
  alternative: ربطه بصحة دوافع جميع المعلنين
  rationale: النص يميّز صراحة بين الذريعة والصدق، لكنه يجعل إعلان المسيح سبب الفرح؛ فلا ينبغي أن يُفهم منه تصديق بولس لجميع الدوافع.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وموقرة. استُعملت «فماذا إذًا؟» للإيجاز البلاغي، و«ليس المهم إلا أن» لتوضيح الحصر طبيعيًا، مع إبقاء التضاد بين الدافع الزائف والصدق، والمحافظة على المبني للمجهول وصيغة المستقبل.
