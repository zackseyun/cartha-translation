  rationale: تُصحَّح إضافةٌ تفسيرية غير مصرَّح بها («الأمرين»)، وتُستبدل صياغة عربية ملتبسة بتعبير أوضح يحافظ على إيجاز الأصل وعلاقته بين الثمر والعمل. كما تُنقل علامات الحاشية إلى مواضعها الصحيحة.
