    issue: إضافة «الأمرين» في «أيَّ الأمرين سأختار»
    rationale: لا يذكر النص اليوناني لفظًا يدل صراحة على «اثنين»؛ إذ يستعمل τί («ما الذي»). ويُفهم التخيير الثنائي من السياق، لكن لا يلزم إدخاله في متن هذه الآية.
  - severity: medium
    issue: صياغة «يثمر لي عملًا»
    rationale: قد تجعل «عملًا» مفعولًا لما يُثمر، في حين أن العبارة اليونانية تربط «الثمر» بـ«العمل» ارتباطًا مضغوطًا. «تعني لي ثمر عمل» أوضح وأقرب إلى البنية الدلالية.
  - severity: low
