  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: ar
  text: ولكن إن كانت الحياة في الجسد[a] تعني لي ثمرَ عملٍ[b]، فما الذي سأختاره لا أعلم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «في اللحم»؛ أي في الحياة الجسدية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عملًا مثمرًا». والعبارة اليونانية موجزة، وحرفيًّا: «ثمر عمل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: بقائي حيًّا
  rationale: يفيد المصدر المعرّف استمرار بولس في الحياة الحاضرة، وهذه الصياغة عربية طبيعية تُظهر معنى الاستمرار من غير توسع تفسيري.
- source_word: ἐν σαρκί
  choice: في الجسد
  rationale: تشير σάρξ هنا إلى الوجود الجسدي الأرضي في مقابل الرحيل والكون مع المسيح، لا إلى معنى الطبيعة الخاطئة. واختيار «الجسد» أوضح للقارئ العربي، مع إثبات البديل الحرفي في الحاشية.
- source_word: καρπὸς ἔργου
  choice: يثمر لي عملًا
  rationale: التركيب اليوناني موجز وملتبس نحويًّا بعض الشيء. تحفظ الصياغة صلته بكل من الثمر والعمل، وتعبّر طبيعيًّا عن عمل منتج، مع ذكر الصيغ الأقرب إلى ظاهر التركيب في الحاشية.
- source_word: αἱρήσομαι
  choice: سأختار
  rationale: يدل الفعل في السياق على الاختيار بين البقاء والرحيل، و«سأختار» هو المقابل العربي المباشر الواضح.
- source_word: οὐ γνωρίζω
  choice: لا أعرف
  rationale: مع أن γνωρίζω قد يعني «أُعرّف»، فإنه هنا يفيد عدم العلم أو عدم القدرة على الجزم في سياق المفاضلة.
theological_decisions:
- issue: معنى σάρξ في هذه الآية
  choice: الوجود الجسدي الأرضي («في الجسد»)
  alternative: الطبيعة الخاطئة
  rationale: يقابل السياق بين استمرار الحياة الأرضية والرحيل للكون مع المسيح؛ لذلك لا يحمل اللفظ هنا دلالة الفساد الأخلاقي.
- issue: العلاقة النحوية في عبارة καρπὸς ἔργου
  choice: 'صياغتها فعليًّا: «يثمر لي عملًا»'
  alternative: «ثمر عمل» أو «عمل مثمر»
  rationale: النص اليوناني مضغوط، ويحتمل أن يكون استمرار الحياة ثمرةً في صورة عمل، أو أن يعني عملًا مثمرًا. اختيرت صياغة عربية مفهومة مع إبقاء البدائل في الحاشية بدل حسم التركيب بلا تنبيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. قُدِّمت «في الجسد» على «في اللحم» لتجنب إيحاء مادي غريب في العربية، وحُفظت دقة اللفظ في الحاشية. كما صيغ الشطر الأول بصورة طبيعية مع إبقاء غموض «ثمر/عمل» موضحًا في الحاشية.
