  terminology: «القيود»، «الدفاع»، «تثبيت الإنجيل»، و«النعمة» مناسبة. «شركائي في النعمة» تعبير طبيعي لـ συγκοινωνούς ... τῆς χάριτος، مع إظهار اشتراكهم مع بولس بعبارة «معي».
