    rationale: قد توحي العبارة بحق شخصي، بينما السياق يتحدث عن كون هذا الموقف صوابًا أو لائقًا. «من الصواب» يحفظ المعنى بصورة أدق.
  revised_text: فمن الصواب أن أفكّر هذا التفكير في جميعكم، لأنني أحملكم في قلبي[a]، إذ إنكم جميعًا شركائي معي في النعمة، في قيودي وفي الدفاع عن الإنجيل وتثبيته.
