  source_fidelity: 'المسودة تنقل المعنى العام جيدًا وتحفظ غموض عبارة القلب في الحاشية. لكن ترتيب «سواء ... أم ...» في العربية يوحي بأن القيود والدفاع/التثبيت بديلان حصريان، في حين أن اليونانية تجمع بين المجالين: «في قيودي، وفي الدفاع عن الإنجيل وتثبيته». كما أن «من حقّي» أضيق قليلًا من δίκαιον التي تفيد الملاءمة أو الصواب، و«من الصواب» أدق هنا.'
