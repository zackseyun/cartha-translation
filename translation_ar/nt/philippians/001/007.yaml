  rationale: عُدِّلت عبارة δίκαιον إلى «من الصواب» لتفادي الإيحاء بحق شخصي، واستُبدلت البنية الثنائية «سواء ... أم» بالتوازي «في ... وفي ...» لتعكس اقتران المجالين في اليونانية. وأُضيفت «معي» لإبراز علاقة الاشتراك التي يدل عليها συγκοινωνούς μου، دون تغيير معنى «الشراكة في النعمة».
