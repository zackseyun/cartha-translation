language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: ar
  text: فمن الصواب أن أفكّر هذا التفكير في جميعكم، لأنني أحملكم في قلبي[a]، إذ إنكم جميعًا شركائي معي في النعمة، في قيودي وفي الدفاع عن الإنجيل وتثبيته.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنكم تحملونني في قلوبكم». تحتمل العبارة اليونانية الوجهين.'
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: من حقّي
  rationale: ينقل معنى ما هو صائب ومبرَّر في موقف بولس، بصياغة عربية طبيعية وواضحة.
- source_word: φρονεῖν
  choice: أن أفكّر في هذا
  rationale: يحافظ على معنى التفكير والموقف الذهني، مع ترك المجال للدلالة الأوسع التي يحملها الفعل في السياق.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: من جهة جميعكم
  rationale: تفيد العبارة هنا توجّه فكر بولس نحو جميع المخاطَبين، لا النيابة عنهم.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: لأنني أحملكم في قلبي
  rationale: قراءة راجحة سياقيًا وطبيعية بالعربية، مع إثبات الاحتمال النحوي الآخر في الحاشية.
- source_word: δεσμοῖς
  choice: قيودي
  rationale: يحفظ الصورة الحسية للقيود التي تشير إلى سجن بولس، بدل تحويلها إلى تعبير تجريدي.
- source_word: ἀπολογίᾳ
  choice: الدفاع
  rationale: ينقل معنى الدفاع العلني أو القضائي عن الإنجيل بوضوح.
- source_word: βεβαιώσει
  choice: تثبيته
  rationale: يفيد إرساء الإنجيل وتأكيد صدقه وثباته، ويلائم اقترانه بالدفاع عنه.
- source_word: συγκοινωνούς
  choice: شركائي
  rationale: تعبير عربي موجز وطبيعي يدل على الاشتراك الفعلي مع بولس، وتُبيّن صلة «في النعمة» مجال هذه الشراكة.
- source_word: χάριτος
  choice: النعمة
  rationale: المقابل اللاهوتي العربي المألوف لـχάρις، ويحفظ الإشارة إلى عطية الله التي يشتركون فيها.
theological_decisions:
- issue: الغموض النحوي في عبارة القلب
  choice: لأنني أحملكم في قلبي
  alternative: لأنكم تحملونني في قلوبكم
  rationale: كل من «με» و«ὑμᾶς» في حالة النصب حول المصدر، ولذلك يمكن نحويًا فهم أيهما فاعلًا والآخر مفعولًا به. القراءة المختارة تلائم سياق محبة بولس، مع حفظ البديل الصادق في الحاشية.
- issue: نطاق الاشتراك في النعمة
  choice: جميعكم شركائي في النعمة، سواء في قيودي أم في الدفاع عن الإنجيل وتثبيته
  alternative: جميعكم مشتركون معي في النعمة في قيودي وفي الدفاع عن الإنجيل وتثبيته
  rationale: تحافظ الصياغة المختارة على صلة الشراكة بالنعمة وعلى شمولها ظروف القيود وخدمة الإنجيل، دون حصر النعمة في مفهوم مذهبي أضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «من حقّي» بدل تركيب حرفي ثقيل، وحُفظت صورة «القيود» ومصطلح «النعمة». وُضعت علامة الحاشية [a] في المتن عند موضع الغموض مباشرة.
