source:
  edition: SBLGNT
  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: ar
  text: فإن الله شاهدٌ لي كم أشتاق إليكم جميعًا بحنان المسيح يسوع.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وحرفيًا: «بأحشاء المسيح يسوع»؛ والمقصود عواطفه العميقة أو شفقته.'
    reason: يوضح الصورة الجسدية في اللفظة اليونانية ويحفظ البديل الدلالي بين الحنان والعواطف العميقة والشفقة.
lexical_decisions:
- source_word: μάρτυς
  choice: شاهدٌ
  rationale: يحافظ على صيغة الاحتجاج الجليلة «الله شاهد لي»، وفيها يستشهد بولس بالله على صدق مشاعره.
- source_word: γάρ
  choice: فإن
  rationale: تنقل الصلة التفسيرية بما قبلها بصورة طبيعية في العربية.
- source_word: ὡς
  choice: كم
  rationale: تفيد هنا مقدار الاشتياق وشدته، لا مجرد تقرير وقوعه.
- source_word: ἐπιποθῶ
  choice: أشتاق
  rationale: تعبير عربي طبيعي يدل على التوق القوي والشخصي.
- source_word: πάντας ὑμᾶς
  choice: إليكم جميعًا
  rationale: يحفظ توكيد الشمول في πάντας مع صياغة عربية سلسة.
- source_word: ἐν σπλάγχνοις
  choice: بحنان
  rationale: اللفظة اليونانية تشير حرفيًا إلى الأحشاء بوصفها موطن العاطفة العميقة؛ و«بحنان» تنقل معناها الاصطلاحي بوضوح من غير حرفية مستغلقة.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: ينقل Χριστός بوصفه لقبًا، «المسيح»، ويحافظ على ترتيب العبارة اليونانية.
theological_decisions:
- issue: هل الحنان صادر من بولس أم من المسيح يسوع؟
  choice: بحنان المسيح يسوع
  alternative: بحنان نحو المسيح يسوع
  rationale: الإضافة في اليونانية تجعل الأرجح أن هذا الحنان منسوب إلى المسيح أو مميز به؛ لذلك لم تُحوَّل العبارة إلى حنان موجَّه نحو المسيح.
- issue: نقل Χριστός في تركيب Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: حُفظ ترتيب الأصل ودلالة Χριστός اللقبية، من غير جعله مجرد جزء غير مترجم من اسم مركب.
translation_notes:
  register: عربية فصحى معاصرة واضحة وجليلة. استُخدمت «كم أشتاق» لنقل شدة ὡς ἐπιποθῶ، وتُجنبت حرفية «الأحشاء» في المتن لأنها غير طبيعية بهذا المعنى في الاستعمال العربي الحديث، مع إثباتها في الحاشية.
