source:
  edition: SBLGNT
  text: ὥστε τοὺς δεσμούς μου φανεροὺς ἐν Χριστῷ γενέσθαι ἐν ὅλῳ τῷ πραιτωρίῳ καὶ τοῖς λοιποῖς πᾶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/013.yaml
  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: ar
  text: حتى صارت قيودي في المسيح معروفة لدى الحرس الإمبراطوري كله ولدى سائر الناس[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قيودي من أجل المسيح» أو «بسبب المسيح».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «في البريتوريوم كله»؛ وقد يدل اللفظ على الحرس الإمبراطوري أو على المقر الإمبراطوري أو دار الحاكم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: حتى
  rationale: تفيد النتيجة المترتبة على ما سبق، وهي صياغة عربية طبيعية تحافظ على قوة الربط.
- source_word: τοὺς δεσμούς μου
  choice: قيودي
  rationale: تحافظ على الصورة الحرفية للقيود، التي تشير في السياق أيضًا إلى السجن.
- source_word: φανεροὺς ... γενέσθαι
  choice: صارت ... معروفة
  rationale: تنقل معنى التحول إلى أمر ظاهر ومعلوم، بصياغة عربية واضحة وطبيعية.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: تحافظ على تركيب الأصل وعلى احتماله الدلالي، بدل حصره في معنى سببي مثل «من أجل المسيح».
- source_word: Χριστῷ
  choice: المسيح
  rationale: اللفظ العربي «المسيح» يحفظ اللقب المسياني ولا يعامله بوصفه اسمًا مجردًا.
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: لدى الحرس الإمبراطوري كله
  rationale: ينقل المرجع الأرجح للمصطلح في هذا السياق، مع إثبات الاحتمال المكاني في الحاشية.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: لدى سائر الناس
  rationale: تعبير عربي موجز يشمل جميع من عدا الجماعة المذكورة أولًا.
theological_decisions:
- issue: دلالة ἐν Χριστῷ وصلتها بقيود بولس
  choice: في المسيح
  alternative: من أجل المسيح / بسبب المسيح
  rationale: يحافظ المتن على العبارة المكانية أو العلاقية في الأصل وعلى توترها اللاهوتي، بينما توضح الحاشية إمكان فهمها سببيًا، أي أن القيود بسبب الانتماء إلى المسيح.
- issue: مرجع πραιτώριον
  choice: الحرس الإمبراطوري
  alternative: دار الولاية أو المقر الإمبراطوري (البريتوريوم)
  rationale: الحرس الإمبراطوري هو المرجع المرجح في سياق الرسالة، لكن اللفظ اليوناني قد يدل أيضًا على مقر رسمي أو إقامة حاكم، لذلك حُفظ البديل في الحاشية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. أُبقيت صورة «القيود» بدل تفسيرها مباشرة بالسجن، وحُفظ تركيب «في المسيح» في المتن لصون غموض الأصل المشروع، مع شرح البدائل في الحواشي.
