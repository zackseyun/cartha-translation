    issue: صياغة «واقع تحت ضغط من الأمرين» غير طبيعية نسبيًا.
    rationale: هي ترجمة مفهومة لـ συνέχομαι، لكن «محصور بين الأمرين» أفصح وأسلس في العربية المعاصرة، مع بقاء صورة التقييد بين بديلين.
  - severity: medium
    issue: «فهذا أفضل جدًا» لا يبرز المقارنة بوضوح كافٍ.
    rationale: الأصل κρεῖσσον صيغة مقارنة مقوّاة بـ πολλῷ μᾶλλον؛ و«فذلك أفضل بكثير» ينقل المقارنة والتشديد بدقة.
  - severity: low
    issue: الحاشية تصوغ «أموت» بوصفه تفسيرًا مباشرًا لا بديلًا للترجمة.
    rationale: 'الأصل يقول حرفيًا «أن أرحل» في سياق يدل على الموت؛ فصيغة «أو: أموت» أوضح في بيان أن ذلك بديل تفسيري دون إدخاله في المتن.'
