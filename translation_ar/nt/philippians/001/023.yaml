    reason: lexical_alternative
lexical_decisions:
- source_word: συνέχομαι
  choice: واقع تحت ضغط
  rationale: ينقل معنى الوقوع تحت ضغط خيارين متعارضين، من غير أن يحوّل الفعل إلى مجرد حيرة نفسية.
- source_word: ἐκ τῶν δύο
  choice: من الأمرين
  rationale: يفيد السياق أن الضغط ناشئ من البديلين المذكورين؛ وهذه صياغة عربية طبيعية تحفظ الإشارة إلى كليهما.
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: لي رغبة
  rationale: يحافظ على الاسم الصريح «الرغبة» في اليونانية، مع صياغة عربية واضحة وموجزة.
- source_word: ἀναλῦσαι
  choice: أن أرحل
  rationale: يحفظ صورة الرحيل الواردة في الأصل، وهي هنا تعبير لطيف عن الموت، من غير استبدالها بتفسير صريح داخل المتن.
- source_word: Χριστῷ
  choice: المسيح
  rationale: «المسيح» المقابل العربي الطبيعي للقب اليوناني Χριστός، ويحافظ على طابعه اللقبي.
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: فهذا أفضل جدًا
  rationale: ينقل التشديد القوي في العبارة المقارنة بصياغة عربية طبيعية ومفهومة.
theological_decisions:
- issue: دلالة الرحيل والوجود مع المسيح بعد الموت
  choice: أن أرحل وأكون مع المسيح
  alternative: أن أموت وأذهب فورًا إلى السماء
  rationale: 'تلتزم الصياغة بما يقوله النص صراحة: الرحيل والوجود مع المسيح، ولا تضيف تحديدًا عقائديًا للمكان أو الكيفية أو التسلسل الزمني.'
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدمت النقطتان لإظهار أن ما يلي يشرح طبيعة الضغط، من غير إزالة التوتر بين الخيارين.
