  rationale: تُحسّن المراجعة سلاسة التعبير العربي عن الضغط بين البديلين، وتُبقي التركيب والمعنى دون زيادة عقائدية. واستُبدلت «أفضل جدًا» بـ«أفضل بكثير» لإظهار المقارنة المشددة في اليونانية، وعُدلت الحاشية لتفصل بين اللفظ الحرفي والبديل التفسيري بوضوح.
