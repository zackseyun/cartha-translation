  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: ar
  text: ولي ثقة في الرب أنني أنا أيضًا سآتي قريبًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأنا واثق في الرب أنني أنا أيضًا سآتي قريبًا».'
    reason: بديل أسلوبي ينقل πέποιθα بصيغة وصفية مباشرة مع الحفاظ على معنى الثقة المستقرة.
lexical_decisions:
- source_word: πέποιθα
  choice: لي ثقة
  rationale: يفيد الفعل في صيغة التام حالة مستقرة من الثقة؛ وهذه الصياغة عربية طبيعية وتحافظ على القوة الحاضرة للفعل.
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل السياق، وترجمتها بالواو تلائم الأسلوب العربي من غير إضفاء معنى استدراكي قوي.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: تحافظ على التعبير البولسي الذي يجعل الثقة قائمة في نطاق الرب ومرتكزة عليه، من غير حصر الدلالة في السببية وحدها.
- source_word: ὅτι
  choice: أن
  rationale: تُدخل مضمون الثقة بصورة طبيعية في العربية.
- source_word: καὶ αὐτὸς
  choice: أنا أيضًا
  rationale: تحافظ «أنا» على توكيد شخص بولس، وتنقل «أيضًا» المعنى الإضافي بالنسبة إلى إرسال تيموثاوس.
- source_word: ταχέως
  choice: قريبًا
  rationale: السياق يدل على القرب الزمني، لا على سرعة الحركة.
- source_word: ἐλεύσομαι
  choice: سآتي
  rationale: تحافظ على المنظور الإشاري للفعل اليوناني كما يخاطب بولس أهل فيلبي.
- source_word: κυρίῳ
  choice: الرب
  rationale: الترجمة المعتادة والملائمة للاستعمال البولسي هنا.
theological_decisions:
- issue: طبيعة ثقة بولس وصلتها بالرب
  choice: لي ثقة في الرب
  alternative: أثق بالرب أنني أنا أيضًا سآتي قريبًا
  rationale: تحافظ الصياغة المختارة على كون توقع بولس قائمًا في الرب ومرتبطًا به، من غير أن تحوّله إلى ادعاء بوحي مباشر أو يقين مستقل عن مشيئة الرب.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعملت «لي ثقة» لتجنب الثقل النسبي في «أنا واثق» مع إبقاء البديل في الحاشية، وحُفظ توكيد αὐτός بذكر الضمير المنفصل «أنا».
