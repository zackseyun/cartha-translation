  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: ar
  text: وأن يعترف كل لسان بأن يسوع المسيح هو الرب، لمجد الله الآب.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: كل لسان
  rationale: يحافظ على الصورة الجسدية الدالة على الاعتراف الشامل، وهي عبارة عربية واضحة ومألوفة في هذا السياق.
- source_word: ἐξομολογήσηται
  choice: يعترف
  rationale: ينقل معنى الإقرار المعلن من غير إضافة قيد تفسيري مثل «علانية». وصيغة المضارع تناسب اتصاله بسياق الغاية في الآية السابقة.
- source_word: κύριος
  choice: الرب
  rationale: هو المقابل العربي الطبيعي لـ κύριος، ويحفظ قوة الإقرار بشأن يسوع والصدى الكتابي لعبادة الله الشاملة.
- source_word: Ἰησοῦς Χριστός
  choice: يسوع المسيح
  rationale: «يسوع» اسم، و«المسيح» اللقب العربي الراسخ الذي ينقل دلالة Χριστός بوضوح من غير تحويله إلى اسم مجرد.
- source_word: εἰς δόξαν
  choice: لمجد
  rationale: 'تعبير عربي موجز وطبيعي ينقل اتجاه الإقرار وغايته: أن يكون لمجد الله.'
- source_word: θεοῦ πατρός
  choice: الله الآب
  rationale: صياغة عربية واضحة تحفظ تركيب العبارة اليونانية وتميّز وصف «الآب» من غير زيادة تفسيرية.
theological_decisions:
- issue: تعيين المسند والمسند إليه في κύριος Ἰησοῦς Χριστός
  choice: يسوع المسيح هو الرب
  alternative: الرب هو يسوع المسيح
  rationale: مع أن الاسمين في اليونانية مرفوعان، فإن الاسم الشخصي المركب «يسوع المسيح» هو الأرجح بوصفه المسند إليه، وκύριος هو الخبر المتقدم للتوكيد. أُدخل ضمير الفصل «هو» لسلامة العربية ووضوح الإقرار، من غير تغيير مضمونه.
- issue: نقل Χριστός في صيغة الإقرار
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو اللقب العربي الراسخ والمفهوم، ويحفظ دلالة «الممسوح» ولا يضيف تحديدًا مذهبيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظت صورة «كل لسان»، وجاءت الجملة معطوفة بالواو لتبقى متصلة نحويًا بغرض الآية السابقة، كما في النص اليوناني.
