  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: ar
  text: لِذَلِكَ أَيْضًا رَفَعَهُ اللهُ رَفْعًا عَظِيمًا، وَأَنْعَمَ عَلَيْهِ بِالِاسْمِ الَّذِي فَوْقَ كُلِّ اسْمٍ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وهبه الاسم».'
    reason: lexical_alternative
  - marker: b
    text: قد يدل «الاسم» على الاسم المنطوق، وقد يشمل أيضًا المقام أو الرتبة أو اللقب؛ ولا تحدد هذه الآية بعدُ أيَّ اسم هو المقصود.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: لذلك ... أيضًا
  rationale: يحفظ معنى الاستنتاج في διό ومعنى الإضافة في καί، مع ترتيب عربي طبيعي.
- source_word: ὁ θεὸς
  choice: الله
  rationale: فاعل صريح ومعرّف في اليونانية، والمقابل العربي المألوف هو «الله».
- source_word: ὑπερύψωσεν
  choice: رفعه ... إلى أسمى مقام
  rationale: ينقل قوة المبالغة في الفعل المركب بصياغة عربية واضحة، من غير اللجوء إلى تركيب غير مألوف مثل «رفعه رفعًا فائقًا».
- source_word: ἐχαρίσατο
  choice: وهبه بنعمته
  rationale: يحفظ فعل العطاء، ويُظهر صلة اللفظة بمعنى النعمة، بخلاف «منحه» وحدها التي قد لا تنقل هذا الإيحاء.
- source_word: τὸ ὄνομα
  choice: الاسم
  rationale: يحافظ على اللفظ اليوناني من غير حسمه إلى «اللقب» أو «المقام»، مع إبقاء دلالته المحتملة مفتوحة.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: الاسم الذي فوق كل اسم
  rationale: يحفظ البنية المقارِنة في الأصل، وهو تعبير عربي واضح ومهيب.
theological_decisions:
- issue: هوية «الاسم»
  choice: إبقاء «الاسم» دون تعيينه في متن الآية
  alternative: تعيينه باسم «يسوع»، أو باللقب الإلهي «الرب» الوارد في الآيات التالية
  rationale: هذه الآية نفسها لا تحدد الاسم، لذلك ينبغي ألا تستبق الترجمة ما يرد في فيلبي 2:10–11 أو تحسم دلالة لاهوتية يتركها النص هنا مفتوحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «إلى أسمى مقام» لنقل شدة ὑπερύψωσεν بصورة طبيعية، و«وهبه بنعمته» لإبراز إيحاء النعمة في ἐχαρίσατο. وُضعت علامتا الحاشيتين بعد «الاسم» والعبارة المتعلقة به، مع ترتيب [a] للبديل اللفظي و[b] للتنبيه الدلالي.
