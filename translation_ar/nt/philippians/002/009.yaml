  - severity: low
    issue: «إلى أسمى مقام» يعبّر عن نتيجة مكانية/رتبية محددة أكثر من الفعل اليوناني نفسه.
    rationale: الفعل ὑπερύψωσεν يدل على رفعٍ مكثف؛ و«رفعًا عظيمًا» ينقل التكثيف من غير إضفاء تعيين إضافي للمقام.
