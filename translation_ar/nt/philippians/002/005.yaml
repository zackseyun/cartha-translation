  text: Have this mindset among yourselves[a], which was also in Messiah Jesus[b],
translation:
  language: ar
  text: ليكن في ما بينكم هذا الفكر[a] الذي كان أيضًا في المسيح يسوع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليكن في ما بينكم هذا الفكر الذي لكم أيضًا في المسيح يسوع».'
    reason: قراءة بديلة ممكنة للتركيب اليوناني الموجز، تفهم العبارة في ضوء كون المؤمنين في المسيح.
  - marker: b
    text: 'اليونانية: Χριστός، أي «المسيح»؛ وهي هنا لقب.'
    reason: توضيح القيمة اللقبية للكلمة اليونانية.
lexical_decisions:
- source_word: τοῦτο
  choice: هذا
  rationale: يحافظ اسم الإشارة على إيجاز اليونانية، ويشير إلى نمط التفكير الذي توضحه الآيات التالية.
- source_word: φρονεῖτε
  choice: ليكن ... الفكر
  rationale: الفعل في هذا السياق يدل على توجّه ذهني وموقف مستمر، لا على مجرد عملية التفكير؛ والصياغة العربية تنقل قوة الأمر بصورة طبيعية.
- source_word: ἐν ὑμῖν
  choice: في ما بينكم
  rationale: ضمير المخاطبين جمع، وسياق فيلبي 2:1–4 جماعي؛ لذلك تُبرز العبارة علاقة المؤمنين بعضهم ببعض، مع إبقاء احتمال معنى «فيكم» قريبًا.
- source_word: ὃ
  choice: الذي
  rationale: يربط الاسم الموصول الفكر المطلوب بما كان في يسوع، من غير إضافة تفسير غير موجود في النص.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: أُبقي حرف الجر «في» لصون اتساع دلالته، وتُرجم Χριστός باللقب العربي المألوف «المسيح».
theological_decisions:
- issue: هل تشير العبارة الأخيرة إلى الفكر الذي مثّله يسوع، أم إلى الفكر الذي للمؤمنين بحكم كونهم فيه؟
  choice: 'القراءة المثالية: «الذي كان أيضًا في المسيح يسوع».'
  alternative: 'القراءة التشاركية: «الذي لكم أيضًا في المسيح يسوع».'
  rationale: ينتقل السياق مباشرة إلى اتضاع المسيح مثالًا للمؤمنين، مما يرجّح القراءة المثالية؛ لكن تركيب اليونانية موجز ويحتمل أيضًا معنى المشاركة في المسيح، لذلك حُفظ الاحتمال الآخر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «هذا الفكر» للتعبير عن نمط التفكير أو التوجّه، و«في ما بينكم» لإبراز البعد الجماعي في السياق، مع الحفاظ على إيجاز الآية والتوتر التفسيري في عبارتها الأخيرة.
