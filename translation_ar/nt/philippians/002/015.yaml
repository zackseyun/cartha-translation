source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: ar
  text: لكي تصيروا بلا لوم وأنقياء، أولادًا لله بلا عيب في وسط جيل أعوج ومنحرف[a]، تضيئون[b] بينهم كأنوار[c] في العالم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يرجَّح أن عبارة «جيل أعوج ومنحرف» تردّد صدى تثنية 32:5، فتقابل بين أولاد الله والجيل الفاسد.
    reason: cross_reference
  - marker: b
    text: 'أو: «تظهرون».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «كأجرام منيرة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تدل على الغاية أو النتيجة، و«لكي» واضحة وطبيعية في العربية وتحفظ ترابط الآية بما قبلها.
- source_word: γένησθε
  choice: تصيروا
  rationale: تحفظ معنى الصيرورة في الفعل اليوناني، بدل تحويله إلى مجرد حالة ثابتة.
- source_word: ἄμεμπτοι
  choice: بلا لوم
  rationale: تعبير عربي واضح يدل على انتفاء ما يستوجب الملامة، ويلائم السياق الأخلاقي.
- source_word: ἀκέραιοι
  choice: أنقياء
  rationale: ينقل معنى الصفاء والاستقامة الأخلاقية بلغة مفهومة، من غير حصره في مجرد البراءة القانونية.
- source_word: τέκνα θεοῦ
  choice: أولادًا لله
  rationale: τέκνα لفظ شامل للذكور والإناث، و«أولاد الله» يحفظ دلالة البنوة العائلية من غير تخصيصها بالذكور.
- source_word: ἄμωμα
  choice: بلا عيب
  rationale: يحافظ على صورة الخلو من العيب ويميّزها عن «بلا لوم» التي ترجمت ἄμεμπτοι.
- source_word: μέσον γενεᾶς
  choice: في وسط جيل
  rationale: ينقل موقع المؤمنين داخل الجماعة المحيطة بهم بعبارة عربية مباشرة.
- source_word: σκολιᾶς καὶ διεστραμμένης
  choice: أعوج ومنحرف
  rationale: يحفظ الوصفين الأخلاقيين القويين وصداهما الكتابي، مع تجنب ألفاظ قد تكتسب إيحاءات حديثة أضيق من المقصود.
- source_word: ἐν οἷς
  choice: بينهم
  rationale: يعامل أفراد الجيل بوصفهم أشخاصًا، وهو المرجع الأرجح للضمير في السياق.
- source_word: φαίνεσθε
  choice: تضيئون
  rationale: المعنى الضوئي هو الأنسب مع φωστῆρες، مع إبقاء معنى «تظهرون» الممكن في الحاشية.
- source_word: φωστῆρες
  choice: أنوار
  rationale: لفظ واضح وشائع يعبّر عن مصادر الضوء دون تضييق المعنى إلى النجوم وحدها.
- source_word: ἐν κόσμῳ
  choice: في العالم
  rationale: «العالم» هو المقابل الطبيعي هنا، ويشير إلى المجال البشري الذي يعيشون فيه.
theological_decisions:
- issue: صلة «بلا عيب» بعبارة «أولاد الله» والصدى المحتمل لتثنية 32:5
  choice: «أولادًا لله بلا عيب»
  alternative: ربط «بلا عيب» بالعبارة الوصفية كلها على نحو أعم، أو التصريح بالإشارة إلى تثنية 32:5 في المتن
  rationale: ترتيب اليونانية يربط الوصف مباشرة بأولاد الله، بينما يتيح تقابلهم مع الجيل الأعوج والمنحرف سماع الصدى العهدي دون فرض تفسيره داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت تراكيب مألوفة للقارئ العام، مع الحفاظ على تمييز الألفاظ اليونانية المتقاربة وعلى الاحتمال الدلالي في φαίνεσθε بواسطة الحاشية.
