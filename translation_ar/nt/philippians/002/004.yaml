lexical_decisions:
- source_word: σκοποῦντες
  choice: ينظر ... إلى
  rationale: يفيد الفعل توجيه الانتباه والاهتمام نحو أمر ما؛ وهذا التعبير عربي طبيعي ويحافظ على معنى الاعتناء العملي.
- source_word: τὰ ἑαυτῶν
  choice: مصالحه
  rationale: التركيب اليوناني المحايد الجمع أوسع من الممتلكات، ويشمل شؤون الإنسان ومنافعه واهتماماته؛ و«مصالحه» تؤدي المعنى بوضوح في السياق.
- source_word: ἕκαστοι
  choice: كلُّ واحدٍ منكم
  rationale: تنقل العبارة القوة التوزيعية للكلمة وتوضح أن الخطاب موجَّه إلى كل فرد داخل الجماعة.
- source_word: ἀλλὰ καὶ
  choice: بل ... أيضًا
  rationale: تحافظ الصياغة على الجمع بين المقابلة والإضافة، من غير أن توحي بإهمال المصالح الشخصية كليًا.
- source_word: τὰ ἑτέρων
  choice: مصالح الآخرين
  rationale: تشير العبارة إلى شؤون الآخرين ومنافعهم واهتماماتهم على نحو عام، لا إلى ممتلكاتهم وحدها.
theological_decisions:
- issue: هل تنهى الآية عن كل اهتمام بالمصالح الشخصية؟
  choice: «لا ... وحده، بل ... أيضًا»
  alternative: «لا ينظر ... بل ينظر ...»
  rationale: وجود καί مع جملة المقابلة يُبقي الاهتمام بالشؤون الشخصية ضمنًا، لكنه يرفض حصر النظر فيها ويدعو إلى الاهتمام بشؤون الآخرين أيضًا.
