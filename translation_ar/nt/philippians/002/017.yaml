source:
  edition: SBLGNT
  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: ar
  text: بل حتى إن كنتُ أُسكب سكيبًا[a] على ذبيحة إيمانكم[c] وخدمتِه التعبدية[b]، فإني أفرح وأفرح معكم جميعًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُراق سكيبًا».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «خدمتِه التعبدية» بـ«خدمتِه» أو «خدمتِه الكهنوتية»؛ فاللفظ اليوناني يحتفظ هنا بلغة العبادة.
    reason: lexical_alternative
  - marker: c
    text: 'أو: «أمانتكم».'
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: أُسكب سكيبًا
  rationale: يحافظ هذا التعبير على صورة السكيب القرباني التي يدل عليها الفعل المبني للمجهول، من غير أن يحوّل الاستعارة إلى تصريح مباشر بالموت.
- source_word: ἐπὶ
  choice: على
  rationale: تنقل «على» المعنى المكاني المجازي المحتمل، أي سكب السكيب على الذبيحة أو إضافةً إليها، وتحافظ على ترابط الصورة القربانية.
- source_word: θυσίᾳ
  choice: ذبيحة
  rationale: «ذبيحة» هي المقابل الطبيعي للمصطلح القرباني، وتحفظ لغة العبادة الواضحة في السياق.
- source_word: λειτουργίᾳ
  choice: خدمته في العبادة
  rationale: يبيّن هذا التعبير ظلال العبادة في الكلمة ضمن سياق الذبيحة والسكيب، مع تجنب قصرها بالضرورة على خدمة كهنوتية رسمية.
- source_word: πίστεως
  choice: إيمانكم
  rationale: «الإيمان» هو المعنى الأرجح هنا، مع بقاء احتمال دلالة الكلمة على الأمانة مذكورًا في الحاشية.
- source_word: χαίρω
  choice: أفرح
  rationale: يحفظ اللفظ موضوع الفرح المتكرر في الرسالة وصيغة الفعل الحاضرة.
- source_word: συγχαίρω
  choice: أفرح معكم
  rationale: ينقل مباشرة معنى الفرح المشترك، ويحافظ على الصلة اللفظية بين χαίρω وσυγχαίρω.
- source_word: πᾶσιν ὑμῖν
  choice: معكم جميعًا
  rationale: صياغة عربية طبيعية تحافظ على التشديد الصريح على شمول الجماعة كلها.
theological_decisions:
- issue: الصورة القربانية لاحتمال موت بولس
  choice: يصف بولس نفسه مجازيًا بأنه يُسكب سكيبًا على ذبيحة إيمان المؤمنين وخدمته في العبادة.
  alternative: أن يكون انسكاب حياته مجرد خدمة مضافة إلى خدمتهم من غير تشديد صريح على الصورة القربانية.
  rationale: اجتماع ألفاظ السكيب والذبيحة والخدمة التعبدية يقتضي إبقاء صورة العبادة والقربان، مع عدم الجزم بأن الفعل يصرّح هنا بموته حتمًا.
- issue: العلاقة بين الإيمان والذبيحة والخدمة
  choice: أُبقي تركيب «ذبيحة إيمانكم وخدمته» قريبًا من الإضافة اليونانية، بحيث يمكن فهم الإيمان مصدرًا للذبيحة والخدمة أو وصفًا لهما.
  alternative: «الذبيحة والخدمة اللتان تقدّمونهما بسبب إيمانكم».
  rationale: الصياغة البديلة أوضح تفسيرًا، لكنها تحسم العلاقة الدلالية التي يتركها تركيب المضاف إليه في الأصل أكثر انفتاحًا.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة موقرة. حُفظت ألفاظ السكيب والذبيحة والعبادة لتبقى الصورة القربانية ظاهرة، وحُفظ تكرار «أفرح» ليعكس التوازي اللفظي في اليونانية.
