  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: ar
  text: فإن كان في المسيح أيُّ تشجيع، وإن كانت أيُّ تعزية نابعة من المحبة، وإن كانت أيُّ شركة للروح[a]، وإن كان أيُّ حنان ورأفة،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الاشتراك في الروح»؛ وعلى احتمال أضعف: «شركة في الروح» بمعنى روحي أو في روح واحدة.'
    reason: يحمل تركيب κοινωνία πνεύματος أكثر من احتمال في تحديد علاقة «الشركة» بـ«الروح»، مع رجحان الإشارة إلى الروح القدس.
lexical_decisions:
- source_word: οὖν
  choice: إذًا
  rationale: تنقل الاستنتاج والانتقال المنطقي من السياق السابق من غير أن تثقل العبارة.
- source_word: παράκλησις
  choice: تشجيع
  rationale: يدل اللفظ هنا على التقوية المعنوية والحث المشجّع؛ و«تشجيع» أوسع من التعزية العاطفية وحدها وأقل تضييقًا من «حثّ».
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: يحافظ على دلالة ἐν الأساسية وعلى الاستعمال اللقبي لكلمة Χριστός بصياغة عربية كتابية طبيعية.
- source_word: παραμύθιον
  choice: تعزية
  rationale: يشير إلى الكلام المواسي أو الراحة، وتفصله «تعزية» دلاليًا عن παράκλησις المترجمة «تشجيع».
- source_word: ἀγάπης
  choice: نابعة من المحبة
  rationale: توضح على نحو طبيعي أن المحبة مصدر التعزية، مع الإقرار بأن علاقة المضاف إليه في اليونانية موجزة.
- source_word: κοινωνία
  choice: شركة
  rationale: تحفظ البعد العلائقي والجماعي للفظ، كما تسمح عبارة «شركة الروح» ببقاء قدر من إيجاز الأصل وغموض علاقة المضاف إليه.
- source_word: πνεύματος
  choice: الروح
  rationale: الأرجح في السياق أن المقصود هو الروح القدس؛ أما طبيعة العلاقة بينه وبين «الشركة» فمبيّنة ببدائلها في الحاشية.
- source_word: σπλάγχνα
  choice: حنان
  rationale: اللفظ، مع أن معناه الحرفي يتعلق بالأحشاء، يُستعمل مجازيًا للعاطفة العميقة والرقة؛ و«حنان» ينقل هذا المعنى طبيعيًا.
- source_word: οἰκτιρμοί
  choice: رأفة
  rationale: تنقل معنى الشفقة الرحيمة بوضوح، وتأتلف طبيعيًا مع «حنان».
theological_decisions:
- issue: هل يشير πνεύματος إلى الروح القدس، وما طبيعة علاقة المضاف إليه مع κοινωνία؟
  choice: شركة الروح
  alternative: 'الاشتراك في الروح؛ وعلى احتمال أضعف: شركة في الروح بمعنى روحي أو في روح واحدة'
  rationale: يرجح سياق البركات المسيحية أن الإشارة إلى الروح القدس، لكن التركيب اليوناني لا يصرح هل المقصود شركة يمنحها الروح أم اشتراكًا فيه؛ لذلك بقيت العبارة الرئيسية موجزة وحُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على تتابع جمل الشرط في الأصل، وعلى الفاصلة الختامية لأن الآية تمهّد لجواب الشرط في الآية التالية. وُضع مؤشر الحاشية [a] عند العبارة التي تتناولها الحاشية.
