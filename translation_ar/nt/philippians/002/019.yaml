source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: ar
  text: لكني أرجو في الرب يسوع أن أرسل إليكم تيموثاوس قريبًا، لكي أطيب نفسًا أنا أيضًا حين أعرف أخباركم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλπίζω
  choice: أرجو
  rationale: ينقل الرجاء أو التوقع الحاضر بصياغة عربية طبيعية، من غير تحويله إلى يقين.
- source_word: δὲ
  choice: لكني
  rationale: تؤدي الانتقال المصحوب بمقابلة خفيفة مع السياق السابق.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: في الرب يسوع
  rationale: تحافظ على التعبير البولسي الذي يجعل الرجاء قائمًا ضمن علاقة بولس بالرب يسوع واعتماده عليه.
- source_word: Τιμόθεον
  choice: تيموثاوس
  rationale: النقل العربي المألوف للاسم الشخصي.
- source_word: ταχέως
  choice: قريبًا
  rationale: المعنى هنا زمني، أي الإرسال في وقت قريب، لا مجرد سرعة فعل الإرسال.
- source_word: πέμψαι ὑμῖν
  choice: أن أرسل إليكم
  rationale: صياغة عربية مباشرة وطبيعية تحفظ معنى المصدر والجهة المقصودة.
- source_word: ἵνα κἀγὼ
  choice: لكي ... أنا أيضًا
  rationale: تحفظ دلالة الغرض والتوكيد الموجود في κἀγώ.
- source_word: εὐψυχῶ
  choice: أطيب نفسًا
  rationale: يعبر عن صيرورة بولس حسن النفس أو مطمئنها، وهو أقرب إلى الدلالة النفسية للفظ من التعبير العام «أتشجع».
- source_word: γνοὺς
  choice: حين أعرف
  rationale: يؤدي اسم الفاعل الماضي بوظيفة زمنية طبيعية في العربية من غير إثقال حرفي.
- source_word: τὰ περὶ ὑμῶν
  choice: أخباركم
  rationale: تعبير عربي موجز وطبيعي يشمل ما يتعلق بأحوال المخاطبين، من غير حصره في سؤال «كيف حالكم».
theological_decisions:
- issue: ترجمة κύριος في ἐν κυρίῳ Ἰησοῦ
  choice: الرب
  alternative: السيد
  rationale: «الرب» هو اللقب المسيحاني العربي المألوف ويحفظ قوة الاستعمال في النص، بينما قد تبدو «السيد» مجرد وصف اجتماعي.
- issue: علاقة الرجاء بالرب يسوع في ἐν κυρίῳ Ἰησοῦ
  choice: في الرب يسوع
  alternative: بمعونة الرب يسوع
  rationale: أُبقي تركيب «في» لئلا يُختزل المعنى العلائقي الواسع إلى معنى الوسيلة وحده.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التركيب اللاهوتي «في الرب يسوع»، واستُعمل «أخباركم» بوصفه مقابلاً طبيعيًا غير مفرط في التفسير لعبارة τὰ περὶ ὑμῶν.
