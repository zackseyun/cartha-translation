  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: ar
  text: فإنهم جميعًا يطلبون مصالحهم الخاصة، لا مصالح يسوع المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πάντες
  choice: هم جميعًا
  rationale: تفيد العبارة جماعة الأشخاص المقصودين في السياق مع التشديد على شمولهم، وصياغة «هم جميعًا» واضحة وطبيعية في العربية.
- source_word: γὰρ
  choice: فإن
  rationale: تربط «فإن» الآية بما قبلها بوصفها تعليلًا لقول بولس السابق، وتحافظ على الصلة التفسيرية التي تؤديها γάρ.
- source_word: τὰ ἑαυτῶν
  choice: مصالحهم الخاصة
  rationale: العبارة اليونانية المحايدة الجمع تشير اصطلاحيًا إلى ما يخص الإنسان وشؤونه؛ و«مصالحهم الخاصة» توضح المقابلة الأخلاقية من غير تضييقها على الممتلكات.
- source_word: ζητοῦσιν
  choice: يطلبون
  rationale: ينقل الفعل معنى السعي إلى الشيء والاهتمام به، ويلائم طرفي المقابلة في الآية.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: مصالح يسوع المسيح
  rationale: المحايد الجمع يحيل إلى المعنى نفسه في «مصالحهم الخاصة». وتكرار «مصالح» في العربية أوضح من تركيب موصول قد يبدو ملتبسًا، مع إبقاء «المسيح» لقبًا ليسوع.
theological_decisions:
- issue: دلالة Χριστοῦ في Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع الممسوح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός ويحفظ دلالته اللقبية، أما «الممسوح» فترجمة تفسيرية حرفية أقل طبيعية وقد توهم أن المقصود وصف عابر.
- issue: تحديد المقصود من τὰ Ἰησοῦ Χριστοῦ
  choice: مصالح يسوع المسيح
  alternative: ما ليسوع المسيح
  rationale: يفهم التركيب في ضوء المقابلة مع τὰ ἑαυτῶν، لكنه يظل واسعًا ليشمل ما يخص المسيح ويهمه؛ لذا لا تُضاف عبارات أضيق مثل «خدمة الإنجيل».
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة، بنبرة كتابية رصينة. استُخدم التكرار «مصالح... مصالح...» لإظهار المقابلة التي يحملها التركيب اليوناني، وتُركت الآية موجزة كما في الأصل.
