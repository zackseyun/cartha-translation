  text: πληρώσατέ μου τὴν χαρὰν ἵνα τὸ αὐτὸ φρονῆτε, τὴν αὐτὴν ἀγάπην ἔχοντες, σύμψυχοι, τὸ ἓν φρονοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/002.yaml
  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: ar
  text: فأتمّوا فرحي بأن تفكّروا بالطريقة نفسها، وتكون لكم المحبة نفسها، متّحدين في النفس[a]، ومفكّرين في أمر واحد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من نفس واحدة»؛ أو: «متآلفي النفوس».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «قاصدين غرضًا واحدًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: فأتمّوا فرحي
  rationale: ينقل فعل الامتلاء إلى معنى بلوغ فرح بولس تمامه، بعبارة عربية طبيعية تحافظ على صورة الإكمال.
- source_word: ἵνα
  choice: بأن
  rationale: تقدّم هنا مضمون الكيفية التي يتمّ بها فرح بولس، من غير حصر الأداة في دلالة الغاية وحدها.
- source_word: τὸ αὐτὸ φρονῆτε
  choice: تفكّروا بالطريقة نفسها
  rationale: يحفظ معنى φρονέω بوصفه توجّهًا ذهنيًا مشتركًا، لا مجرد اتفاق عابر في رأي منفرد.
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: تكون لكم المحبة نفسها
  rationale: صياغة عربية واضحة تحافظ على معنى امتلاك المحبة المشتركة وعلى ارتباط العبارة بسلسلة أوصاف الوحدة.
- source_word: σύμψυχοι
  choice: متّحدين في النفس
  rationale: يحافظ على صورة النفس الواردة في اللفظ اليوناني المركب، مع التعبير عن وحدة الحياة الداخلية.
- source_word: τὸ ἓν φρονοῦντες
  choice: مفكّرين في أمر واحد
  rationale: يكرر جذر «فكّر» كما يكرر النص اليوناني φρονέω، ويحفظ العبارة المفتوحة من غير تحويلها حتمًا إلى غرض مؤسسي أو عقائدي محدد.
theological_decisions:
- issue: مدى صراحة دعوة بولس إلى الوحدة في تكرار لغة φρονέω
  choice: تفكّروا بالطريقة نفسها ... مفكّرين في أمر واحد
  alternative: تكونوا على فكر واحد ... قاصدين غرضًا واحدًا
  rationale: يحفظ الاختيار التكرار البلاغي في الأصل، ويعرض الوحدة بوصفها توافقًا في التوجّه من غير أن يساويها بتطابق كامل في كل رأي أو يحدد لها غرضًا لم يصرّح به النص.
- issue: معنى σύμψυχοι وصورة النفس المشتركة
  choice: متّحدين في النفس
  alternative: 'من نفس واحدة؛ أو: متآلفي النفوس'
  rationale: يبقي الاختيار الصورة المعجمية اللاهوتية والإنسانية للنفس، من غير تفسيرها حصرًا على أنها «الروح» أو مجرد تعاون عملي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تكرار «فكّر» لتعكس الصلة اللفظية بين صيغتي φρονέω، واستُعملت «النفس» للإبقاء على صورة σύμψυχοι مع توضيح البدائل في الحاشية.
