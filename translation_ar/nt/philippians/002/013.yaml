  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: ar
  text: لأن الله هو الذي يعمل فيكم، في الإرادة والعمل معًا، لأجل مسرّته[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أن تريدوا وأن تعملوا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بحسب مسرّته».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: لأن
  rationale: تفيد تعليل الوصية السابقة وتحافظ على الصلة المنطقية بصورة طبيعية في العربية.
- source_word: ὁ ἐνεργῶν
  choice: هو العامل
  rationale: اسم الفاعل المعرّف في اليونانية مستعمل استعمالًا اسميًّا؛ وهذه الصياغة تحفظ قوة الفعل المستمر ولا تحوّله إلى تقرير جامد.
- source_word: ἐν ὑμῖν
  choice: فيكم
  rationale: تحافظ على العبارة اليونانية وتبقي المجال مفتوحًا للمعنى الفردي والجماعي، إذ إن ضمير الجمع يحتمل كليهما.
- source_word: τὸ θέλειν
  choice: الإرادة
  rationale: المصدر المعرّف يدل على فعل الإرادة؛ واختيار الاسم يحافظ على التناظر النحوي مع «العمل».
- source_word: τὸ ἐνεργεῖν
  choice: العمل
  rationale: يحفظ الصلة اللفظية مع ἐνεργῶν المترجمة «العامل»، كما يصون التوازي الموجز بين الإرادة والعمل.
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: لأجل مسرّته
  rationale: تفيد ὑπέρ مع المضاف إليه الغاية أو المصلحة هنا. و«مسرّته» تنقل εὐδοκία بوضوح، مع إظهار عود الضمير المفهوم إلى الله.
theological_decisions:
- issue: عمل الله وإرادة الإنسان وعمله
  choice: 'الإبقاء على العنصرين معًا: «سواء الإرادة أو العمل» بوصفهما مجال عمل الله في المؤمنين.'
  alternative: أن يريدوا وأن يعملوا؛ أو الرغبة والقدرة على الفعل.
  rationale: تنسب الآية إلى الله عملًا يبلغ الإرادة والفعل معًا، من غير إلغاء مسؤولية المخاطبين في السياق أو فرض تفسير مذهبي يحدد كيفية اجتماع الجانبين.
- issue: دلالة ὑπέρ في العبارة الختامية
  choice: لأجل مسرّته
  alternative: بحسب مسرّته
  rationale: المعنى الغائي أو النفعي هو الأرجح، لكن الدلالة المعيارية «بحسب» ممكنة، ولذلك حُفظت في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «سواء... أو...» هنا بمعنى الجمع بين الأمرين، مع حاشية تقدم الصياغة الفعلية الأكثر سلاسة. وحُفظ «فيكم» بدل «بينكم» لإبقاء الاحتمالين الفردي والجماعي مفتوحين.
