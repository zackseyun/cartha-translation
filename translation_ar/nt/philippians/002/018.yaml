lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: وبالطريقة نفسها
  rationale: يؤدي التعبير وظيفة ظرفية ويربط الوصية بما سبق. وتحافظ «بالطريقة نفسها» على الإحالة السابقة بصياغة عربية واضحة، بينما تنقل الواو قوة δὲ الانتقالية في السياق.
- source_word: χαίρετε
  choice: افرحوا
  rationale: فعل أمر مضارع موجَّه إلى جماعة. و«افرحوا» تعبير عربي طبيعي يحفظ القوة الفعلية وموضوع الفرح المتكرر في الرسالة.
- source_word: συγχαίρετέ
  choice: افرحوا معي
  rationale: يفيد الفعل المركب المشاركة في الفرح، و«افرحوا معي» ينقل هذا المعنى مباشرة ويحافظ على تمييزه عن الأمر السابق.
- source_word: μοι
  choice: معي
  rationale: يبيّن ضمير المتكلم في حالة الداتيف أن بولس هو الشخص الذي يُطلب منهم أن يشاركوه الفرح.
