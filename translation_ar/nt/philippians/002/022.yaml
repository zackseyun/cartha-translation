  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: ar
  text: لكنكم تعرفون معدنه الذي ثبت بالاختبار[a]، وأنه خدم معي لأجل البشارة، كولدٍ مع أبيه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «جدارته المثبتة»؛ تشير الكلمة إلى ما ظهر أصيلًا وثابتًا بعد الاختبار.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: لكنكم
  rationale: تنقل التحول المصحوب بمقابلة خفيفة مع الكلام السابق، وتربطه طبيعيًا بضمير المخاطبين المستتر في الفعل اليوناني.
- source_word: δοκιμὴν αὐτοῦ
  choice: معدنه الذي ثبت بالاختبار
  rationale: تعبير عربي طبيعي يدل على حقيقة شخصية تيموثاوس التي ظهرت وأُثبتت بعد الاختبار، لا على مجرد السمعة أو الاختبار نفسه.
- source_word: γινώσκετε
  choice: تعرفون
  rationale: يحافظ على زمن المضارع الدال على معرفة المخاطبين القائمة بتيموثاوس.
- source_word: ὅτι
  choice: وأنه
  rationale: يقدّم مضمون ما يعرفه المخاطبون، مع ربط عربي واضح بالجملة السابقة.
- source_word: ὡς πατρὶ τέκνον
  choice: كولدٍ مع أبيه
  rationale: يحافظ على صورة القرابة وعلى قوة التشبيه، ويترجم τέκνον بلفظ لا يضيف تحديدًا ذكوريًا غير لازم إلى معنى الكلمة، مع بقاء الإشارة السياقية إلى تيموثاوس.
- source_word: σὺν ἐμοὶ
  choice: معي
  rationale: ينقل معنى المصاحبة والمشاركة المباشرة في الخدمة.
- source_word: ἐδούλευσεν
  choice: خدم
  rationale: يؤدي المعنى الفعلي الملائم لسياق العمل للبشارة من غير تحويله إلى تعبير عربي قاسٍ مثل «استُعبد».
- source_word: εἰς τὸ εὐαγγέλιον
  choice: لأجل البشارة
  rationale: ينقل اتجاه الخدمة وغايتها بوضوح، مع استعمال «البشارة» مقابلاً عربيًا مفهومًا لـ εὐαγγέλιον.
