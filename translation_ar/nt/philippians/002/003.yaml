  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: ar
  text: لا تفعلوا شيئًا بدافع الطموح الأناني أو الغرور الفارغ[a]، بل ليعدَّ بعضكم بعضًا، بتواضع، أفضلَ من نفسه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «المجد الباطل».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أسمى من نفسه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: لا تفعلوا شيئًا
  rationale: صياغة نهي عربية واضحة تستوعب «لا شيء» في سياق الوصية، مع إبقاء شمول النهي.
- source_word: κατ’ ἐριθείαν
  choice: بدافع التحزُّب
  rationale: تنقل معنى السعي الأناني ذي النزعة الحزبية أو التنافسية، كما أن «بدافع» يبرز معنى الدافع في κατά.
- source_word: κατὰ κενοδοξίαν
  choice: أو الغرور الفارغ
  rationale: يحفظ عنصر الخواء في اللفظة المركبة، ويعبّر بلغة معاصرة عن الاعتداد بالنفس وطلب المجد الباطل.
- source_word: τῇ ταπεινοφροσύνῃ
  choice: بتواضع
  rationale: تنقل دلالة الكيفية أو الوسيلة في صياغة عربية موجزة وطبيعية.
- source_word: ἀλλήλους ἡγούμενοι
  choice: ليَعُدَّ بعضُكم بعضًا
  rationale: «يَعُدّ» يؤدي المعنى التقييمي للفعل، و«بعضكم بعضًا» هو التعبير العربي المألوف للتبادل.
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: أفضلَ من نفسه
  rationale: يحفظ المقارنة ومعنى التفوق دون أن يحصره صراحة في القيمة الجوهرية أو المكانة الاجتماعية.
theological_decisions:
- issue: طبيعة التفوق في ὑπερέχοντας
  choice: أفضلَ من نفسه
  alternative: أهمَّ من نفسه؛ أسمى من نفسه
  rationale: النص يطلب تقدير الآخرين على أنهم متفوقون أو متقدمون على الذات، لكنه لا يحدد هل المقصود الأهمية العملية أم الأفضلية العامة؛ لذا اختير تعبير واسع مع إثبات البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة حَضّية كريمة. استُخدم خطاب الجمع، ثم أُفرد الضمير في «نفسه» لموافقته «بعضكم» في التركيب العربي.
