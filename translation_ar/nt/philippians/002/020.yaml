lexical_decisions:
- source_word: γὰρ
  choice: فـ
  rationale: تنقل الوظيفة التفسيرية التي تربط القول بما سبقه، في صياغة عربية موجزة وطبيعية.
- source_word: οὐδένα ... ἔχω
  choice: ليس عندي أحدٌ
  rationale: تعبير عربي طبيعي يحافظ على معنى عدم وجود شخص لدى بولس لهذه المهمة.
- source_word: ἰσόψυχον
  choice: يشبهه في النفس
  rationale: ينقل معنى التماثل في التوجّه الداخلي مع إبقاء التعبير قريبًا من الصورة اليونانية، دون اختزاله في مجرد اتفاق فكري.
- source_word: ὅστις
  choice: ـ، يهتمّ
  rationale: تؤدي الجملة الوصفية معنى الموصول اليوناني بسلاسة في العربية، وتصف الشخص المقصود.
- source_word: γνησίως
  choice: بصدق
  rationale: يفيد أصالة الاهتمام وإخلاصه، وهو ملائم للسياق الرعوي.
- source_word: τὰ περὶ ὑμῶν
  choice: بما يخصّكم
  rationale: يحافظ على اتساع العبارة اليونانية، التي قد تشمل أحوال المخاطَبين ومصالحهم وكل ما يتعلق بهم.
- source_word: μεριμνήσει
  choice: يهتمّ
  rationale: ينقل هنا معنى العناية والانشغال الإيجابي، لا القلق المذموم؛ ويُفهم الاستقبال من سياق الإرسال الوارد في الآيات المحيطة.
theological_decisions:
- issue: مرجع التماثل في ἰσόψυχον
  choice: يشبهه في النفس
  alternative: يشاركني النفس نفسها / مماثلٌ لي في النفس
  rationale: السياق المباشر يقدّم تيموثاوس بوصفه الشخص الذي لا نظير له، لكن الصفة اليونانية لا تصرّح بأداة المقارنة؛ لذلك تجنبت الصياغة العقائدية أو التفسيرية الموسعة، وأثبتُّ المعنى السياقي مع حاشية تحفظ الصورة الحرفية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة. استُعمل «في النفس» للمحافظة على صورة ψυχή مع شرحها في الحاشية، واستُعمل «بما يخصّكم» كي لا تُحصر العبارة في الرفاه أو الظروف وحدها.
