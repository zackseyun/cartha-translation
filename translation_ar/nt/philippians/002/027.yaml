id: PHP.2.27
reference: Philippians 2:27
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: ar
  text: فقد مرض فعلًا حتى قارب الموت[a]، لكن الله رحمه، ولم يرحمه وحده بل رحمني أنا أيضًا، لئلا يكون لي حزن فوق حزن[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حتى صار قريبًا من الموت» أو «إلى حد الموت».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «حزن فوق حزن»، وهو تعبير يفيد تراكم الحزن وتضاعفه.'
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: مرض
  rationale: يشير الفعل في السياق إلى مرض جسدي أصاب أبفرودتس، و«مرض» تعبير عربي مباشر وطبيعي.
- source_word: παραπλήσιον θανάτῳ
  choice: حتى قارب الموت
  rationale: ينقل معنى الاقتراب الشديد من الموت من غير أن يفيد وقوعه، وهو تعبير عربي واضح وسلس.
- source_word: ἠλέησεν
  choice: رحمه
  rationale: يحفظ معنى الرحمة الإلهية وثقلها اللاهوتي، ولا يخففها إلى مجرد الشفقة.
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: ولم يرحمه وحده بل رحمني أنا أيضًا
  rationale: يُظهر أن فعل الرحمة يمتد إلى أبفرودتس وإلى بولس، ويحفظ المقابلة والتوكيد في الأصل.
- source_word: ἵνα μὴ
  choice: لئلا
  rationale: تنقل الغاية السلبية بإيجاز فصيح ومفهوم في العربية المعاصرة.
- source_word: λύπην ἐπὶ λύπην
  choice: حزن فوق حزن
  rationale: يحافظ على تكرار الاسم والصورة التراكمية التي تفيد تضاعف الحزن.
- source_word: σχῶ
  choice: يكون لي
  rationale: صياغة عربية طبيعية للفعل العام ἔχω مع الحزن، من غير إضافة تفسير غير موجود في النص.
theological_decisions:
- issue: صلة رحمة الله بشفاء أبفرودتس وتخفيف حزن بولس
  choice: الإبقاء على الرحمة بوصفها ممتدة إلى كليهما من غير شرح آليتها
  alternative: التصريح بأن شفاء أبفرودتس كان هو رحمة الله لبولس
  rationale: النص يربط رحمة الله بكليهما، لكنه لا يصوغ تفسيرًا عقائديًا تفصيليًا لكيفية عمل هذه الرحمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «فقد» لنقل καὶ γὰρ التفسيرية والتوكيدية، وحُفظت صورة «حزن فوق حزن» مع بيانها في الحاشية.
