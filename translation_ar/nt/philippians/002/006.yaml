translation:
  language: ar
  text: الذي، مع أنه كان في صورة الله[a]، لم يعتبر مساواته لله[b] شيئًا يتمسّك به[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذي، إذ كان في صورة الله». يمكن فهم ὑπάρχων على معنى التنازل: «مع أنه كان»، أو على معنى الحال: «إذ كان» أو «كائنًا».'
    reason: lexical_alternative
  - marker: b
