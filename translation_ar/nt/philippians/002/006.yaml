    reason: alternative_reading
lexical_decisions:
- source_word: ὃς
  choice: الذي
  rationale: اسم موصول يصل الآية بما قبلها ويحافظ على تركيب النص اليوناني.
- source_word: ἐν μορφῇ θεοῦ
  choice: في صورة الله
  rationale: تحافظ «صورة» على لفظ μορφή دون اختزاله في صياغة ميتافيزيقية أضيق أو إدخال مصطلحات عقائدية لاحقة.
- source_word: ὑπάρχων
  choice: مع أنه كان
  rationale: يُفهم اسم الفاعل هنا على وجه التنازل، بما يبرز المقابلة مع إخلاء الذات في الآية التالية، مع حفظ القراءة الحالية في الحاشية.
- source_word: ἡγήσατο
  choice: لم يعتبر
  rationale: ترجمة عربية طبيعية قريبة من معنى عَدَّ أو رأى أو اعتبر.
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: مساواته لله
  rationale: 'صياغة عربية موجزة تؤدي معنى المصدر المؤول: كونه مساويًا لله، من غير حسم طبيعة هذه المساواة بما يتجاوز العبارة.'
- source_word: ἁρπαγμὸν
  choice: شيئًا يتمسّك به
  rationale: يحافظ هذا التعبير على صورة الأخذ أو القبض الكامنة في اللفظ، مع بقاء احتمال معنى الاستغلال أو الانتزاع مذكورًا في الحاشية بسبب الخلاف المعجمي المعروف.
theological_decisions:
- issue: الدلالة المسيحولوجية لعبارة ἐν μορφῇ θεοῦ
  choice: الإبقاء على «في صورة الله»
  alternative: في طبيعة الله / إلهًا في طبيعته
  rationale: النص ذو دلالة مسيحولوجية سامية، لكن ترجمة μορφή بـ«صورة» تصون تعبير بولس نفسه ولا تستبدله باختصار عقائدي لاحق.
- issue: معنى ἁρπαγμός وعلاقته بالمساواة لله
  choice: شيئًا يتمسّك به
  alternative: شيئًا يستغله / غنيمة ينتزعها
  rationale: اللفظ موضع خلاف حقيقي؛ المتن يحافظ على استعارة القبض دون حسم كامل، والحاشية تعرض احتمال الاستغلال واحتمال الانتزاع صراحة.
- issue: القوة النحوية لـ ὑπάρχων
  choice: مع أنه كان
  alternative: إذ كان / كائنًا
  rationale: القراءة التنازلية تلائم الانتقال إلى الإخلاء في الآية التالية، لكن اليونانية تسمح بصياغة حالية أقل تفسيرًا، ولذلك حُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «صورة الله» لصون التعبير اليوناني، و«يتمسّك به» في المتن مع حاشية تحفظ البدائل التفسيرية الرئيسية. جميع علامات الحواشي واردة في المتن.
