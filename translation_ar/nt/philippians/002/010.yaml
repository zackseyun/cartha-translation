review_pass:
  verdict: revise
  source_fidelity: تحتاج عبارة ἐν τῷ ὀνόματι Ἰησοῦ إلى تعديل في المتن. فـ«باسم يسوع» في العربية الحديثة يُفهم في المقام الأول بمعنى النيابة أو التفويض («باسم فلان»)، وهو أضيق وأقل ملاءمة لسياق السجود من المعنى المقصود هنا، أي عند ذكر اسم يسوع/إزاء اسمه. أما «كل ركبة» والتقسيم الثلاثي الكوني فمحفوظان.
  naturalness: «تجثو ... كل ركبة» صياغة فصيحة مألوفة في الأسلوب الديني. لكن تتابع «ممن في السماء وعلى الأرض وتحت الأرض» قد يوهم بأن «ممن» لا تتعلق إلا بالشطر الأول. يزيل تكرار «ممن» هذا الالتباس ويحافظ على البنية الجامعة.
  terminology: يُفضَّل «عند اسم يسوع» هنا على «باسم يسوع». ولا حاجة إلى تسمية الفئات السماوية أو الأرضية أو التي تحت الأرض تفسيرًا؛ فـ«مَن في/على/تحت» تحفظ اتساع العبارة اليونانية دون تحميلها تحديدًا عقائديًا زائدًا.
  issues:
  - severity: medium
    issue: عبارة «باسم يسوع» في المتن غير دقيقة دلاليًا في هذا السياق.
    rationale: التركيب العربي الغالب لـ«باسم» يدل على الفعل بالنيابة أو بالسلطة، بينما ἐν τῷ ὀνόματι مع فعل السجود يمكن أن يدل على الاستجابة لدى/عند اسم يسوع. والبديل الأنسب موجود أصلًا في الحاشية.
  - severity: low
    issue: العطف بعد «ممن في السماء» غير متوازٍ صراحةً.
    rationale: إعادة «ممن» قبل المجالين الثاني والثالث تجعل تعلق كل مجال بـ«كل ركبة» واضحًا، وتعبّر بسلامة عن الصفات اليونانية المستعملة استعمال الأسماء.
