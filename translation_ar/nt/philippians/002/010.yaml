translation:
  language: ar
  text: لكي تجثو عند اسم يسوع كلُّ ركبةٍ، ممَّن في السماء وممَّن على الأرض وممَّن تحت الأرض،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تفيد الغاية أو النتيجة المتصلة بما سبق، وتحافظ «لكي» على هذا المعنى بعبارة عربية طبيعية.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: باسم يسوع
  rationale: ينقل حرف الجر ἐν وصيغة «الاسم» بإيجاز، مع إبقاء احتمال فهم العبارة بوصفها المجال الذي يقع فيه الخضوع؛ وتوضح الحاشية احتمال معنى الاستجابة عند اسم يسوع.
- source_word: πᾶν γόνυ
  choice: كلُّ ركبة
  rationale: يحافظ على الصورة الجسدية الحية التي تعبّر عن الخضوع الشامل، بدل تحويلها إلى تعبير تجريدي عن كل شخص.
- source_word: κάμψῃ
  choice: تجثو
  rationale: «تجثو الركبة» تعبير عربي فصيح وطبيعي عن الانحناء خضوعًا وتكريمًا، ويناسب صيغة الغاية بعد «لكي».
- source_word: ἐπουρανίων
  choice: ممَّن في السماء
  rationale: ينقل الصفة اليونانية المستعملة استعمال الاسم من غير تعيين هوية الموجودين في هذا المجال.
- source_word: ἐπιγείων
  choice: على الأرض
  rationale: يحافظ على المجال الثاني في التقسيم الكوني الثلاثي بصياغة عربية طبيعية.
- source_word: καταχθονίων
  choice: تحت الأرض
  rationale: يحفظ الصورة المكانية في اليونانية ولا يستبدل بها مصطلحًا تفسيريًا مثل «العالم السفلي».
theological_decisions:
- issue: مدلول ἐν في عبارة ἐν τῷ ὀνόματι Ἰησοῦ
  choice: «باسم يسوع» في المتن، مع ذكر «عند اسم يسوع» في الحاشية
  alternative: «عند اسم يسوع» في المتن
  rationale: تحتمل العبارة اليونانية معنى وقوع السجود في اسم يسوع أو استجابةً لاسمه؛ لذلك لم تُحسم الدلالة في اتجاه واحد من غير تنبيه إلى البديل.
- issue: نطاق العبارة الثلاثية ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: الإبقاء على النطاق الكوني الشامل من غير تسمية فئات بعينها
  alternative: التصريح بأنها تشير إلى الملائكة والبشر والأموات أو الشياطين
  rationale: يشدد النص على شمول الخضوع، لكنه لا يحدد صراحة هوية كل فئة؛ لذا تتجنب الصياغة إدخال تفسير زائد.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. حُفظت صورة «كل ركبة»، واستُعملت «تجثو» لسلامة التلازم العربي، مع إبقاء التقسيم الكوني الثلاثي والغموض الدلالي في عبارة «باسم يسوع» بواسطة الحاشية.
