  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: ar
  text: لذلك أرسلته بمزيد من الحرص، لكي تفرحوا حين ترونه من جديد، وأكون أنا أقل حزنًا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: بمزيد من الحرص
  rationale: ينقل صيغة المقارنة في الظرف، بما تدل عليه من ازدياد الجِدّ والرغبة في إرساله، بعبارة عربية طبيعية من غير مبالغة.
- source_word: οὖν
  choice: لذلك
  rationale: يحفظ الصلة الاستنتاجية بالسياق السابق بوضوح.
- source_word: ἔπεμψα
  choice: أرسلته
  rationale: ينقل صيغة الماضي في الفعل اليوناني نقلًا مباشرًا وموجزًا.
- source_word: ἵνα
  choice: لكي
  rationale: يبين غرض الإرسال، مع إبقاء العلاقة الغائية ظاهرة.
- source_word: ἰδόντες
  choice: حين ترونه
  rationale: يعبّر طبيعيًا عن الملابسة الزمنية لاسم الفاعل اليوناني داخل جملة الغرض.
- source_word: πάλιν
  choice: من جديد
  rationale: يفيد تجدد رؤيتهم له، وهو المقصود في السياق.
- source_word: χαρῆτε
  choice: تفرحوا
  rationale: يحفظ معنى الفرح وصيغة الفعل التابعة لأداة الغرض.
- source_word: κἀγὼ
  choice: وأكون أنا
  rationale: يحفظ عطف المتكلم مع إبراز الضمير الموجود في اليونانية من غير إضافة معنى «أيضًا» صراحة.
- source_word: ἀλυπότερος
  choice: أقل حزنًا
  rationale: يحفظ صيغة المقارنة ومعنى تخفف الحزن، من غير حصره في القلق أو الضيق وحدهما.
- source_word: ὦ
  choice: أكون
  rationale: ينقل فعل الكينونة بصيغة تلائم الغرض المقصود في السياق.
theological_decisions: []
