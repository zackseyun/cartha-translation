base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: ar
  text: لأنه بسبب عمل المسيح[a] اقترب من الموت[c]، مخاطِرًا بحياته، لكي يُتمَّ ما كان ينقص من خدمتكم لي[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «عمل المسيح»؛ و«المسيح» لقب معناه «الممسوح».'
    reason: alternative_reading
  - marker: b
    text: لا يعني «ما كان ينقص» أنهم أحجموا عن خدمته، بل يشير إلى الخدمة التي لم يستطيعوا تقديمها له بأنفسهم بسبب بُعدهم عنه.
    reason: cultural_note
  - marker: c
    text: 'يمكن أيضًا صياغة التعليل: «لأنه بسبب عمل المسيح بلغ حدَّ الموت».'
    reason: previous_rendering
lexical_decisions:
- source_word: ὅτι διὰ τὸ ἔργον Χριστοῦ
  choice: لأنه من أجل عمل المسيح
  rationale: تفيد ὅτι التعليل، وتفيد διά مع النصب السبب أو العمل لأجل غاية؛ وصياغة «لأنه من أجل» تحفظ العنصرين من غير أن تجعل العبارة العربية ثقيلة. و«المسيح» تنقل Χριστός بوصفه لقبًا.
- source_word: μέχρι θανάτου ἤγγισεν
  choice: اقترب من الموت
  rationale: تعبير واضح وقريب من صورة الأصل، ويفيد أنه بلغ حدًّا صار فيه الموت وشيكًا.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: مخاطِرًا بحياته
  rationale: الفعل يدل على تعريض النفس للخطر، وψυχή هنا هي الحياة الأرضية لا «النفس» بمعناها غير المادي.
- source_word: ἵνα ἀναπληρώσῃ
  choice: لكي يعوِّض
  rationale: تحفظ «لكي» دلالة الغرض في ἵνα، و«يعوِّض» تفيد سدّ ما تعذّر توفيره.
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: ما كان ناقصًا
  rationale: صياغة لا توحي بتقصير أخلاقي، بل بشيء لم يكن في وسعهم تقديمه بأنفسهم.
- source_word: τῆς πρός με λειτουργίας
  choice: في خدمتكم لي
  rationale: λειτουργία هنا خدمة عملية موجّهة إلى بولس، و«خدمتكم» أوسع وأنسب من حصرها في معنى طقسي أو كنسي.
theological_decisions:
- issue: نقل Χριστοῦ في العبارة البولسية
  choice: المسيح
  alternative: كريستوس (نقل صوتي)
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب اليوناني Χριστός، ويحفظ دلالته اللقبية من غير تحويله إلى اسم علم محض.
- issue: دلالة «ما كان ناقصًا»
  choice: نقص في حضور خدمتهم المباشرة لا اتهام لهم بالتقصير
  alternative: فهم العبارة على أنها لوم لهم على خدمة قاصرة
  rationale: السياق يمدح أبفرودتس والكنيسة؛ فالنقص عملي سببه غيابهم، وقد سدّه ممثلهم، لا فتور إرادتهم.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ تسلسل التعليل والغرض في اليونانية، مع استعمال تعبير عربي طبيعي في «مخاطِرًا بحياته» وتجنّب ألفاظ قد توحي بلوم أهل فيلبي.
