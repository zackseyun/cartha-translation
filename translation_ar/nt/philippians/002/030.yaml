  terminology: «المسيح» مقابل عربي طبيعي لـ Χριστοῦ ويحفظ دلالة اللقب في هذا السياق. و«مخاطرًا بحياته» نقل مناسب لـ παραβολευσάμενος τῇ ψυχῇ، و«خدمتكم لي» مناسب لـ λειτουργίας.
