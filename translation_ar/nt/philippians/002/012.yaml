  verdict: revise
  source_fidelity: 'المعنى العام مطابق للنص اليوناني: الاستنتاج، والنداء الحميم، والطاعة في الحضور والغياب، والأمر المتعلق بالخلاص، وعبارة «بخوف ورعدة». لكن «بالأولى جدًا» ليست المقابل العربي الطبيعي الواضح لـ νῦν πολλῷ μᾶλλον، ويمكن تحسينها إلى «بل الآن، وأكثر بكثير في غيابي».'
  naturalness: الأسلوب فصيح في الجملة، غير أن «بالأولى جدًا» ثقيلة وغير مألوفة في الاستعمال العربي المعاصر. كما أن الحاشية الأولى تتضمن شرحًا تفسيريًا يمكن صياغته بحذر أكبر كي لا تحسم مسألة لاهوتية لا تفصلها الآية وحدها.
  terminology: «يا أحبّائي»، «خلاصكم»، و«بخوف ورعدة» مناسبة وتحفظ نبرة النص ومصطلحاته. و«اعملوا على إتمام خلاصكم» مقبولة بوصفها نقلًا لمعنى κατεργάζεσθε، مع عدم جعلها تقريرًا عن كيفية نيل الخلاص.
