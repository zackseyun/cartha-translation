source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: ar
  text: لذلك، يا أحبّائي، كما أطعتم دائمًا، لا في حضوري فقط، بل الآن، وأكثر بكثير في غيابي، اعملوا على إتمام خلاصكم بخوف ورعدة[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «اعملوا على إتمام» تفيد العمل الجاد الذي يُمضي الخلاص إلى غايته في الحياة. والعبارة نفسها لا تفصّل وحدها كيفية العلاقة بين هذا العمل والخلاص.
    reason: alternative_reading
  - marker: b
    text: «بخوف ورعدة» تعبير عن رهبة جليلة وجدية متواضعة أمام الله، لا عن احترام سطحي ولا عن ذعر مجرد.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: لذلك
  rationale: تفيد نتيجةً واستنتاجًا مما سبق، وتحافظ على الصلة المنطقية بالسياق السابق بصياغة عربية طبيعية.
- source_word: ἀγαπητοί μου
  choice: يا أحبّائي
  rationale: نداء حميم كريم ينقل عاطفة بولس الرعوية بوضوح في العربية المعاصرة.
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: كما أطعتم دائمًا
  rationale: يحافظ على إيجاز اليونانية ويعرض الطاعة بوصفها نهجًا ثابتًا معروفًا عن المخاطَبين.
- source_word: μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ
  choice: لا في حضوري فقط، بل
  rationale: ينقل تركيب المقابلة بصورة عربية واضحة؛ وعدم ترجمة ὡς ترجمة حرفية يتجنب عبارة متكلفة، إذ تؤدي البنية العربية معنى المقارنة المقصود.
- source_word: παρουσίᾳ / ἀπουσίᾳ
  choice: حضوري / غيابي
  rationale: زوج لفظي مباشر وطبيعي يحفظ المقابلة البلاغية في الأصل.
- source_word: πολλῷ μᾶλλον
  choice: بالأولى جدًا
  rationale: تنقل قوة صيغة التفضيل المكثفة، أي أن الطاعة مطلوبة في الغياب بدرجة أشد.
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: خلاصكم
  rationale: تحفظ الدلالة اللاهوتية المعتادة لـσωτηρία؛ وصيغة الملكية العربية تنقل الإحالة إلى المخاطَبين، بينما يُشرح تشديد ἑαυτῶν في الحاشية دون إثقال المتن.
- source_word: κατεργάζεσθε
  choice: اعملوا على إتمام
  rationale: يعبر عن المثابرة في إنجاز الأمر وحمله إلى غايته، من غير أن يحسم وحده مسألة كيفية ارتباط العمل بالخلاص.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: بخوف ورعدة
  rationale: يحفظ قوة التعبير المزدوج ووقاره، ولا يخففه إلى مجرد احترام ولا يقصره على الرعب.
theological_decisions:
- issue: معنى «اعملوا على إتمام خلاصكم»
  choice: إبقاء الأمر قويًا بوصفه دعوة إلى مباشرة الخلاص بجدية وإيصاله إلى غايته في الحياة
  alternative: ترجمته بما يفيد صراحةً كسب الخلاص بالأعمال، أو بما يحصره صراحةً في إظهار خلاص مكتمل سابقًا
  rationale: κατεργάζεσθε يدل على العمل المؤدي إلى نتيجة أو إتمام، لكن الآية نفسها لا تفصل وحدها كل أبعاد العلاقة بين عمل الإنسان وعمل الله؛ لذلك تحفظ الصياغة التوتر، مع التنبيه إلى أن اللفظ لا يعني بذاته شراء الخلاص أو استحقاقه.
- issue: دلالة «بخوف ورعدة»
  choice: الإبقاء على العبارة الحسية القوية التي تفيد الجدية المهيبة والتواضع أمام الله
  alternative: «بوقار» فقط، أو «برعب مذعور»
  rationale: التعبير يحمل رهبةً وانفعالًا جادًا؛ وتخفيفه إلى احترام مجرد يضعف النص، وقصره على الذعر يضيّق دلالته.
- issue: دلالة ἑαυτῶν في «خلاصكم»
  choice: فهمها توكيدًا لمسؤولية المخاطَبين عن خلاصهم هم
  alternative: فهمها دعوة إلى فردانية منعزلة أو إلى خلاص جماعي حصري
  rationale: الضمير العائد يؤكد أن الأمر متعلق بخلاص المخاطَبين أنفسهم، لكنه لا يحسم بمفرده إن كان التركيز فرديًا أم جماعيًا؛ لذا لا تُفرض قراءة مذهبية.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وكريمة. حوفظ على طول الجملة وترابطها البلاغي، مع فواصل تسهّل القراءة. استُخدمت «يا أحبّائي» للمودة الرعوية، و«اعملوا على إتمام» لتجنب الغموض غير الطبيعي لعبارة «تمّموا خلاصكم» مع إبقاء القوة اللاهوتية للأصل.
