  rationale: تُبقي المراجعة جميع عناصر النص اليوناني وتسلسل أوصاف أبفرودتس، لكنها تزيل صياغة عربية زائدة وتحسّن التعبير عن خدمته لحاجة بولس. كما تُنقل علامة الحاشية المعجمية إلى «خادم»، وهو موضع اللفظ اليوناني الذي تشرحه.
