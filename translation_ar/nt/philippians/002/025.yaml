    rationale: اليونانية تقابل بين «لي» و«لكم» ضمن سلسلة أوصاف، من غير جملة اسمية مستقلة أو ضمير فصل. العطف المباشر يحفظ البنية والمعنى بصورة أوضح.
  - severity: medium
    issue: «خادم لي في حاجتي» تعبير غير طبيعي ومبهم نسبيًا.
    rationale: τῆς χρείας μου تصف الحاجة التي تتجه إليها خدمته؛ «خادم لحاجتي» ينقل ذلك بعبارة عربية فصيحة موجزة.
  - severity: low
    issue: موضع علامة الحاشية b بعد «حاجتي» بدل اللفظ الدال على الخدمة.
    rationale: البديل المعجمي يتعلق أساسًا بـλειτουργός («خادم»)، لذا يوضع المرساة بعد «خادم».
