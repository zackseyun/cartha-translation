  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: ar
  text: لكنني رأيت من الضروري أن أرسل إليكم أبفرودتس، أخي وشريكي في العمل ورفيقي في الجندية، ورسولكم[a] وخادم[b] لحاجتي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: مبعوثكم، الشخص الذي أرسلتموه.'
    reason: alternative_reading
  - marker: b
    text: 'أو: القائم بخدمة حاجتي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: من الضروري
  rationale: ينقل معنى الضرورة التي حكم بها بولس، بصياغة عربية طبيعية مع «رأيت».
- source_word: ἡγησάμην
  choice: رأيت
  rationale: يفيد هنا التقدير والحكم بعد النظر، لا مجرد الرؤية الحسية.
- source_word: πέμψαι
  choice: أن أرسل
  rationale: يتبع فعل التقدير في اليونانية، ولا يضيف معنى «إعادة الإرسال» غير المصرح به في العبارة.
- source_word: ἀδελφὸν
  choice: أخي
  rationale: يحافظ على التعبير العائلي المباشر عن شريك في الإيمان.
- source_word: συνεργὸν
  choice: شريكي في العمل
  rationale: تعبير عربي واضح عن العامل إلى جانب بولس، من غير حصر نوع العمل بما لم تصرح به الآية.
- source_word: συστρατιώτην
  choice: رفيقي في الجندية
  rationale: يحفظ الاستعارة العسكرية صراحة، مع صياغة عربية مفهومة وكريمة.
- source_word: ἀπόστολον
  choice: رسولكم
  rationale: السياق يدل على ممثل أرسله أهل فيلبي؛ و«رسولكم» يحفظ معنى الإرسال من غير أن يحسم أنه صاحب المنصب الرسولي الاصطلاحي.
- source_word: λειτουργὸν
  choice: خادم
  rationale: يعبر عن أداء خدمة ذات شأن من غير الإيحاء بمنصب كنسي حديث.
- source_word: τῆς χρείας μου
  choice: لي في حاجتي
  rationale: يبين أن خدمة أبفرودتس كانت موجهة إلى حاجة بولس العملية، بصياغة عربية طبيعية نسبيًا.
theological_decisions:
- issue: هل تُفهم ἀπόστολον بالمعنى الاصطلاحي «رسول» أم بالمعنى الأوسع «مبعوث»؟
  choice: رسولكم
  alternative: مبعوثكم
  rationale: الإضافة إلى المخاطبين تشير إلى أن أبفرودتس أرسله أهل فيلبي ممثلًا لهم. أبقت الترجمة لفظ «رسول» لقربه من الأصل، وأوضحت في الحاشية إمكان فهمه بمعنى المبعوث، من غير إسناد المنصب الرسولي الخاص إليه أو نفيه بمجرد الترجمة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. حافظت الصياغة على تتابع أوصاف أبفرودتس وعلى الاستعارة العسكرية، واستعملت «وأما من جهتكم» لإظهار التحول من علاقته ببولس إلى علاقته بأهل فيلبي. وُضعت علامتا الحاشيتين مباشرة بعد اللفظين المعنيين.
