translation:
  language: ar
  text: بل أخلى نفسه[a]، آخذًا صورة عبد[b]، وصائرًا في شبه البشر[c]؛ وإذ وُجد في هيئة إنسان[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «جعل نفسه لا شيء». تحافظ عبارة «أخلى نفسه» على استعارة الأصل اليوناني، ولا تحدد الآية هنا ممَّ أخلى نفسه.'
    reason: lexical_alternative
  - marker: b
    text: اليونانية δοῦλος تعني عبدًا خاضعًا لسيّد، ويمكن أن تُترجم في بعض السياقات «خادمًا»، لكن «عبد» يحفظ قوة المقابلة هنا.
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «صائرًا في شبه البشر». لا يلزم من كلمة «شبه» أن إنسانيته كانت مجرد مظهر.'
    reason: source_clarification
  - marker: d
    text: 'يمكن أيضًا: «وإذ وُجد في المظهر كإنسان». لفظ ἄνθρωπος هنا عام، أي إنسان، وليس خاصًا بالذكر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد مقابلة قوية بما قبلها، وتلائم انتقال العبارة من عدم التمسك إلى إخلاء النفس.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: أخلى نفسه
  rationale: يحفظ الاستعارة المباشرة في الفعل κενόω من غير أن يحدد ممَّ أخلى نفسه أو يضيف نظرية لاهوتية غير مصرَّح بها؛ وتوضح العبارتان الحاليتان التاليتان كيفية هذا الإخلاء.
- source_word: μορφὴν δούλου
  choice: صورة عبد
  rationale: تحافظ «صورة» على المقابلة اللفظية مع μορφή في العدد السابق، بينما تنقل «عبد» وضع δοῦλος الخاضع والمملوك بقوة أكبر من «خادم».
- source_word: λαβών
  choice: آخذًا
  rationale: صيغة حالية طبيعية تحفظ ارتباط اسم الفاعل بالفعل الرئيس، ويمكن فهمها على أنها تبين كيفية إخلائه نفسه.
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: صائرًا في شبه البشر
  rationale: تنقل γενόμενος بمعنى الصيرورة أو المجيء إلى حال، وتحفظ ὁμοίωμα بلفظ «شبه» والجمع الإنساني العام ἀνθρώπων بلفظ «البشر»، من غير تحويل العبارة صراحة إلى «مولودًا».
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: وإذ وُجد في الهيئة كإنسان
  rationale: تميّز «الهيئة» الدالة على المظهر أو الوضع المشاهد عن «الصورة» التي ترجمت μορφή، وتحفظ تركيب «كإنسان» وعموم ἄνθρωπος غير المختص بالذكور.
theological_decisions:
- issue: معنى «أخلى نفسه» في السياق المسيحاني
  choice: الإبقاء على استعارة الإخلاء وترك العبارتين التاليتين تبينان كيفيته
  alternative: جعل نفسه لا شيء؛ أو التصريح بأنه تخلى عن صفات إلهية
  rationale: النص لا يذكر شيئًا أزيل من المسيح، بل يصل الإخلاء بأخذ صورة عبد والصيرورة في شبه البشر؛ لذلك لا تُفرض عليه نظرية كينوسية بعينها.
- issue: دلالة «شبه البشر»
  choice: الحفاظ على لفظ الشبه من دون تفسيره على أنه مجرد مظهر زائف
  alternative: مماثلة كاملة مصاغة بعبارة أقوى من اليونانية؛ أو شبه ظاهري ينفي الإنسانية الحقيقية
  rationale: يحفظ هذا الاختيار توتر العبارة اليونانية، بينما تكملها الجملة التالية ولا تبرر نفي إنسانيته الحقيقية.
- issue: العلاقة بين μορφή وσχῆμα
  choice: ترجمة الأولى «صورة» والثانية «هيئة»
  alternative: ترجمة اللفظين بالكلمة العربية نفسها
  rationale: يحفظ التمييز المعجمي في الأصل من غير بناء تباين ميتافيزيقي زائد لا تصرح به الآية.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية رصينة. استُعملت «صائرًا» لصون معنى الصيرورة في γενόμενος مع بقاء العبارة مفهومة، وفُضّلت «الهيئة» على «المظهر» في المتن لتجنب إيحاء أن الإنسانية كانت ظاهرًا فقط، مع إثبات البديل في الحاشية.
