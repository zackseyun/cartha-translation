  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: ar
  text: لأنه كان مشتاقًا إليكم جميعًا، وكان في ضيق شديد لأنكم سمعتم أنه مرض[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأنه علم أنكم قد سمعتم أنه كان مريضًا».'
    reason: 'قراءة تفسيرية بديلة لسبب ضيقه؛ أما ظاهر النص اليوناني فيقول مباشرة: «لأنكم سمعتم».'
lexical_decisions:
- source_word: ἐπειδὴ
  choice: لأنه
  rationale: تُدخل العبارة سبب إرسال أبفرودتس، وتحافظ على الدلالة السببية بوضوح وطبيعية.
- source_word: ἐπιποθῶν ἦν
  choice: كان مشتاقًا
  rationale: يحفظ التركيب المحيطي، المؤلف من اسم فاعل مع فعل «كان» في الماضي، معنى الحالة المستمرة في الزمن الماضي.
- source_word: πάντας ὑμᾶς
  choice: إليكم جميعًا
  rationale: يحافظ على توكيد πάντας وشمول الاشتياق لجميع المخاطَبين.
- source_word: ἀδημονῶν
  choice: كان في ضيق شديد
  rationale: ينقل شدة الاضطراب النفسي التي يدل عليها اللفظ، من غير مبالغة توحي بعذاب جسدي.
- source_word: διότι
  choice: لأن
  rationale: أداة سببية مباشرة تبيّن علة ضيقه.
- source_word: ἠκούσατε
  choice: سمعتم
  rationale: ترجمة مباشرة لصيغة المخاطب الجمع في الماضي، من غير إضافة معنى غير مصرح به.
- source_word: ὅτι ἠσθένησεν
  choice: أنه مرض
  rationale: يدل الفعل هنا على المرض الجسدي؛ و«مرض» موجزة وطبيعية وتحفظ دلالة الحدث الماضي.
