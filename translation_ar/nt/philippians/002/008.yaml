lexical_decisions:
- source_word: ἐταπείνωσεν ἑαυτὸν
  choice: وَضَعَ نَفْسَهُ
  rationale: ينقل الفعل المتعدي مع ضمير الانعكاس صراحةً، ويحفظ معنى خفض المكانة الطوعي من غير أن يحصره في مجرد التواضع الخُلقي أو يستخدم تعبيرًا عربيًا جارحًا مثل «أذل نفسه».
- source_word: γενόμενος
  choice: إِذْ صَارَ
  rationale: يربط اسم الفاعل بالفعل السابق ربطًا طبيعيًا، ويُظهر أن الطاعة هي الهيئة أو الكيفية التي اقترن بها وضعه لنفسه، من غير الجزم بتتابع زمني صارم.
- source_word: ὑπήκοος
  choice: مُطِيعًا
  rationale: المقابل العربي المباشر والواضح للصفة، ويحفظ قوة معنى الطاعة دون إضافة مفعول غير مذكور في النص اليوناني.
- source_word: μέχρι θανάτου
  choice: حَتَّى الْمَوْتِ
  rationale: صياغة عربية موجزة وطبيعية تحفظ امتداد الطاعة إلى الموت نفسه، كما تُبقي احتمال التعبير «إلى الموت» ظاهرًا في الحاشية.
- source_word: δὲ
  choice: بَلْ
  rationale: تؤدي هنا وظيفة التصعيد البلاغي، إذ تنتقل العبارة من الموت عمومًا إلى نوع الموت الصادم المذكور بعده.
- source_word: θανάτου ... σταυροῦ
  choice: مَوْتِ الصَّلِيبِ
  rationale: يحفظ التركيب الإضافي المكثف في الأصل وصورة الصليب الملموسة، مع توضيح معناه العربي المقصود في الحاشية.
theological_decisions:
- issue: قوة العبارة الختامية θανάτου δὲ σταυροῦ
  choice: 'تصعيد توكيدي: «بَلْ مَوْتِ الصَّلِيبِ»'
  alternative: «بل الموت على صليب» أو «نعم، موت الصليب»
  rationale: تحفظ «بل» بلوغ العبارة ذروتها في موت الصليب، من غير إضافة تفسير عقدي غير مصرح به، بينما تُبقي الإضافة «موت الصليب» ضغط العبارة اليونانية وقوتها.
- issue: المشار إليه بالطاعة
  choice: عدم إضافة مفعول مثل «لله»
  alternative: «مطيعًا لله»
  rationale: النص اليوناني يصفه بأنه مطيع من غير أن يذكر هنا مَن أُطيع؛ لذلك يُحفظ هذا الإيجاز ولا يُستكمل تفسيرًا داخل المتن.
translation_notes:
  register: لغة عربية فصحى معاصرة ذات نبرة كتابية رصينة. استُبقي التركيب الموجز «وضع نفسه» لأنه واضح ويحفظ فعل الخفض الطوعي، واستُخدمت «إذ صار» لربط الجملة الحالية طبيعيًا من غير حسم زائد لعلاقتها الزمنية.
