- source_word: τοὺς τοιούτους
  choice: أمثاله
  rationale: تدل طبيعيًا على أشخاص من صنفه، مع بقاء أبفرودتس المثال المباشر؛ ويبيّن الهامش أن التعبير اليوناني بصيغة جمع المذكر.
- source_word: ἐντίμους ἔχετε
  choice: أكرموا
  rationale: تنقل المقصود العملي من اعتبار هؤلاء ذوي كرامة ومعاملتهم على هذا الأساس، بإيجاز عربي سليم.
