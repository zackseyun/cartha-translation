base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: ar
  text: متمسّكين بكلمة الحياة[a]، ليكون لي ما أفتخر به في يوم المسيح[b]، لأني لم أركض عبثًا ولا تعبت عبثًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مقدّمين كلمة الحياة» أو «عارضين كلمة الحياة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يوم المسيّا».'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: كلمة الحياة
  rationale: تحفظ العبارة اليونانية الموجزة، وتبقي احتمال كونها الكلمة المانحة للحياة أو الكلمة المتعلقة بالحياة.
- source_word: ἐπέχοντες
  choice: متمسّكين
  rationale: يمكن أن يدل الفعل على التمسك أو على التقديم للآخرين. يلائم «متمسّكين» سياق الثبات والطاعة السابق، مع حفظ المعنى الآخر في الحاشية.
- source_word: καύχημα
  choice: ما أفتخر به
  rationale: صياغة عربية طبيعية تبين أن المؤمنين سيكونون سبب افتخار بولس المشروع، من غير إثقال العبارة بحرفية اسمية جامدة.
- source_word: ἡμέραν Χριστοῦ
  choice: يوم المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، والعبارة تحمل دلالة أخروية.
- source_word: οὐκ εἰς κενὸν
  choice: لم ... عبثًا
  rationale: «عبثًا» تقابل بوضوح معنى الخواء وانعدام الثمر، وتحفظ التوازي البلاغي في الجملتين.
- source_word: ἔδραμον
  choice: أركض
  rationale: يحفظ استعارة السباق التي يستخدمها بولس لوصف سعيه وخدمته.
- source_word: ἐκοπίασα
  choice: تعبت
  rationale: ينقل معنى العمل المجهد في κοπιάω بلغة عربية واضحة، ويحافظ على اقترانه بصورة الركض.
theological_decisions:
- issue: دلالة Χριστοῦ في العبارة الأخروية
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» في العربية لقب ذو مضمون مسياني، وهو الصياغة الكتابية الطبيعية والشائعة، بينما «المسيّا» نقل صوتي أقل سلاسة ويمكن ذكره للتوضيح.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي بين «لم أركض عبثًا» و«ولا تعبت عبثًا»، كما حُفظ غموض ἐπέχοντες في حاشية بدل حسمه داخل النص.
