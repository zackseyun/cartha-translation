  text: فإني أرجو أن أرسله من فوره، حالما أتبين أحوالي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حالما أتبين الأمور المتعلقة بي».'
    reason: يحافظ البديل بصورة أقرب إلى اللفظ على معنى الرؤية أو التبيّن في ἀφίδω، وعلى الصياغة الاسمية في τὰ περὶ ἐμέ.
lexical_decisions:
- source_word: τοῦτον
  choice: أرسله
  rationale: اسم الإشارة في حالة النصب يعود إلى تيموثاوس في السياق السابق؛ والضمير المتصل هو التعبير العربي الطبيعي من غير تكرار اسمه.
- source_word: μὲν οὖν
  choice: فـ... إذن
  rationale: ينقل هذا التركيب الانتقال الاستنتاجي والربط بما سبق، مع توزيع دلالته في صياغة عربية طبيعية.
- source_word: ἐλπίζω πέμψαι
  choice: أرجو أن أرسل
  rationale: يحافظ على معنى الرجاء أو التوقع الذي يفيده ἐλπίζω، وعلى علاقة الفعل بالمصدر المتمم πέμψαι.
- source_word: ὡς ἂν ἀφίδω
  choice: حالما أعرف
  rationale: يفيد التركيب زمنًا مستقبليًا غير محدد يتوقف على تبيّن بولس لمآل وضعه؛ و«حالما» تنقل معنى التوقيت المرتقب بصياغة عربية واضحة.
- source_word: τὰ περὶ ἐμέ
  choice: ما سيؤول إليه أمري
  rationale: يشير التعبير إلى وضع بولس وما ستنتهي إليه قضيته، وهذه الصياغة طبيعية وتحفظ ارتباط الكلام بظروفه الشخصية من غير تفصيل غير موجود في النص.
- source_word: ἐξαυτῆς
  choice: حالما
  rationale: يفيد التعجيل والفورية، وقد أُدمج مع العبارة الزمنية في «حالما» بدل ترجمته بظرف مستقل ثقيل الأسلوب.
