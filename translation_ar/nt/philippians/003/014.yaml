base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: ar
  text: 'أواصل السعي نحو الهدف، طلبًا لجائزة دعوة الله إلى العُلى في المسيح يسوع.[a]


    [a] يمكن أيضًا ترجمة «دعوة الله إلى العُلى»: «دعوة الله السماوية» أو «الدعوة الآتية من فوق».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «دعوة الله إلى العُلى»: «دعوة الله السماوية» أو «الدعوة الآتية من فوق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: نحو الهدف
  rationale: يؤدي التعبير في سياق السباق معنى التوجّه إلى غاية محددة، وصياغة «نحو الهدف» طبيعية وتحفظ الصورة الرياضية.
- source_word: διώκω
  choice: أواصل السعي
  rationale: يفيد الفعل هنا المثابرة الجادة في التقدم، لا الاضطهاد؛ و«أواصل السعي» ينسجم مع السياق السابق ويحفظ دلالة الاستمرار.
- source_word: εἰς τὸ βραβεῖον
  choice: طلبًا للجائزة
  rationale: تبيّن الصياغة أن الجائزة هي غاية السعي، من غير أن تضيف صراحةً معنى الفوز غير المذكور في اليونانية.
- source_word: ἄνω
  choice: إلى العُلى
  rationale: تحفظ العبارة الاتجاه إلى فوق والصورة الحركية في السياق، مع إبقاء القراءات الأخرى الممكنة في الحاشية.
- source_word: κλήσεως τοῦ θεοῦ
  choice: دعوة الله
  rationale: تنقل تركيب الإضافة اليوناني بوضوح وإيجاز، من غير حسم زائد لما إذا كان يركّز على مصدر الدعوة أو ملكيتها لله.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: تحفظ العبارة البولسية «في» كما هي، وتستعمل «المسيح» بوصفه اللقب العربي المألوف المقابل لـΧριστός.
theological_decisions:
- issue: دلالة ἄνω κλήσεως
  choice: دعوة الله إلى العُلى
  alternative: دعوة الله السماوية؛ أو الدعوة الآتية من فوق
  rationale: تنسجم «إلى العُلى» مع صورة السباق والتقدم نحو الغاية، لكنها لا تستنفد احتمال أن تكون الدعوة سماوية أو صادرة من فوق؛ لذلك ذُكرت البدائل في الحاشية بدل حسم التوتر الدلالي.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُعملت «أواصل السعي» لإظهار الاستمرار الذي يبرزه السياق، و«المسيح» هو المقابل العربي الطبيعي للقب Χριστός، فلا تحتاج دلالته اللقبية إلى حاشية مستقلة.
