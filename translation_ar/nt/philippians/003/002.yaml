lexical_decisions:
- source_word: Βλέπετε
  choice: احذروا
  rationale: الفعل هنا أمر يفيد التنبه والتحرز، وقد تكرر ثلاث مرات لإبراز شدة التحذير؛ و«احذروا» واضحة وطبيعية وتحافظ على الإيقاع المتكرر.
- source_word: τοὺς κύνας
  choice: الكلاب
  rationale: أُبقيت الاستعارة الحادة كما هي من غير إضافة صفة تفسيرية لا يذكرها النص اليوناني.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: فَعَلَةَ الشر
  rationale: يحافظ التعبير على معنى العمل وعلى الحكم الأخلاقي الذي تحمله صفة κακούς، بصياغة عربية موجزة ومفهومة.
- source_word: τὴν κατατομήν
  choice: القطع المشوِّه
  rationale: κατατομή اسم يفيد القطع أو البتر على نحو مشوِّه، وقد استعمله بولس تهكمًا في مقابل περιτομή، «الختان»، في الآية التالية. تحافظ الصياغة على حدة اللفظ من غير تحويله في المتن إلى اسم فاعل.
theological_decisions:
- issue: دلالة κατατομή وصلتها بالختان في السياق
  choice: القطع المشوِّه
  alternative: المشوِّهون؛ الختان الزائف؛ البتر
  rationale: لا يستخدم بولس اللفظ المعتاد للختان، بل لفظًا ازدرائيًا يقابله ويكشف تقويمه اللاهوتي الحاد للممارسة التي يهاجمها. و«القطع المشوِّه» يبقي الاسم المجرد وصدمته، مع بيان المقابلة في الحاشية بدل توسيع المتن تفسيريًا.
