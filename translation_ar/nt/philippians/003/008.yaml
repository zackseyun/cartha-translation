language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: ar
  text: بل أكثر من ذلك، أعدّ كلَّ شيء خسارة بسبب القيمة الفائقة لمعرفة المسيح يسوع ربي، الذي من أجله تكبّدت خسارة كل الأشياء، وأعدّها نفايات[a]، لكي أربح المسيح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «نفايات» تترجم لفظًا قويًّا قد يعني أيضًا الفضلات أو الروث.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: بل أكثر من ذلك
  rationale: تنقل قوة الانتقال والتوكيد في مجموعة الأدوات اليونانية بصياغة عربية طبيعية، وتدفع الحجة إلى ما هو أبعد من العبارة السابقة.
- source_word: ἡγοῦμαι
  choice: أعدّ
  rationale: يفيد الفعل تقدير الشيء والحكم على قيمته، و«أعدّ» يلائم مجاز الربح والخسارة ويحافظ على اتساق الورودين.
- source_word: πάντα
  choice: كلَّ شيء / كل الأشياء
  rationale: يحافظ التعبيران على الشمول المقصود؛ استُعمل المفرد الجمعي أولًا وفق الأسلوب العربي الطبيعي، ثم «كل الأشياء» مع أداة التعريف في الورود الثاني.
- source_word: ζημίαν
  choice: خسارة
  rationale: تنقل بدقة لغة الحساب والموازنة بين الربح والخسارة.
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: بسبب القيمة الفائقة لمعرفة
  rationale: تعكس الصياغة كون ὑπερέχον مستعملًا استعمال الاسم للدلالة على التفوق أو القيمة التي لا تضاهى، مع إبقاء «معرفة المسيح» قريبة من التركيب اليوناني.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، ويحفظ ترتيبه قبل الاسم يسوع.
- source_word: τοῦ κυρίου μου
  choice: ربي
  rationale: يحفظ معنى κύριος والمضاف إليه الشخصي في عبارة عربية موجزة وطبيعية.
- source_word: δι’ ὃν
  choice: الذي من أجله
  rationale: ينقل السببية الشخصية وما تتضمنه العبارة من تضحية لأجله.
- source_word: ἐζημιώθην
  choice: تكبّدت خسارة
  rationale: يحفظ معنى وقوع الخسارة على المتكلم في صيغة المبني للمجهول اليونانية، بدل تصويرها مجرد تغيير اختياري في الرأي.
- source_word: σκύβαλα
  choice: نفايات
  rationale: لفظ ازدرائي قوي يشير إلى ما يُطرح ولا قيمة له؛ أُثبت مدى قوته الدلالية في الحاشية.
- source_word: ἵνα Χριστὸν κερδήσω
  choice: لكي أربح المسيح
  rationale: «لكي» تنقل الغاية، و«أربح» تواصل بوضوح مجاز الربح والخسارة.
theological_decisions:
- issue: دلالة Χριστός في العبارة البولسية
  choice: المسيح
  alternative: لا يوجد في العربية تمييز شائع مقابل بين «المسيح» بوصفه لقبًا ولفظ آخر بوصفه اسمًا
  rationale: اللفظ العربي «المسيح» يحفظ اللقب المسياني ولا يفرض تمييزًا اصطلاحيًا أجنبيًا على العربية.
- issue: طبيعة «معرفة المسيح»
  choice: معرفة المسيح
  alternative: أن أعرف المسيح
  rationale: تحافظ الصياغة الاسمية على تركيب γνώσεως Χριστοῦ وعلى ما فيه من كثافة دلالية، من غير اختزال المعرفة إلى معلومات عنه أو حسم جميع علاقات الإضافة الممكنة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حُفظ مجاز الحساب الممتد بين الخسارة والربح، واستُعملت ألفاظ مفهومة للقارئ العام من دون تخفيف قوة σκύβαλα، التي وُضّحت في الحاشية.
