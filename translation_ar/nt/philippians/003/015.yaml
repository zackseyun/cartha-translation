  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: ar
  text: إذن، فليكن هذا فكرَنا جميعًا، نحن الناضجين[a]؛ وإن كنتم تفكرون بخلاف ذلك في شيء، فسيكشف الله لكم هذا أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الكاملين». يمكن أن تعني الكلمة اليونانية «الكاملين»، لكنها تشير هنا على الأرجح إلى النضج الروحي.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: لذلك
  rationale: تُظهر أداة الاستنتاج انتقال بولس المنطقي من كلامه السابق إلى الحثّ الذي يليه.
- source_word: ὅσοι
  choice: لنا جميعًا، نحن
  rationale: تنقل شمول العبارة وإحالتها إلى الجماعة التي يضم بولس نفسه إليها، بصياغة عربية طبيعية.
- source_word: τέλειοι
  choice: الناضجين
  rationale: يفيد اللفظ هنا بلوغ النضج في التوجّه الروحي، في ضوء إقرار بولس قبل ذلك بأنه لم يبلغ الغاية بعد؛ وتُذكر دلالة «الكاملين» في الحاشية حفاظًا على المجال الدلالي.
- source_word: τοῦτο φρονῶμεν
  choice: فليكن ... هذا الفكر
  rationale: تنقل صيغة الحث في المضارع، وتحافظ على معنى التوجّه الذهني والإرادي في φρονέω، مع إحالة «هذا» إلى الموقف المبيّن في السياق السابق.
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: وإن كنتم تفكرون بخلاف ذلك في شيء
  rationale: تحافظ على الشرط، وعلى عدم تحديد الأمر الذي قد يختلف فيه المخاطبون، وعلى معنى اختلاف التوجّه أو التفكير.
- source_word: ἀποκαλύψει
  choice: فسيكشف
  rationale: مقابل مباشر يحفظ معنى الإعلان الإلهي دون شرح زائد.
theological_decisions:
- issue: دلالة τέλειοι في الحث
  choice: الناضجين
  alternative: الكاملين
  rationale: السياق المباشر يجمع بين وصف المخاطبين بهذا اللفظ وبين قول بولس إنه لم يبلغ الكمال بعد؛ لذا تعبّر «الناضجين» عن الدلالة السياقية من غير أن تُفهم على أنها ادعاء كمال مطلق، مع إبقاء البديل الحرفي في الحاشية.
- issue: مرجع τοῦτο الأخير
  choice: هذا أيضًا
  alternative: هذا الأمر أيضًا / الفهم الصحيح أيضًا
  rationale: أُبقي اسم الإشارة عامًا كما في اليونانية، من غير تعيين ما سيكشفه الله أو تفسير كيفية الكشف، حفاظًا على الغموض الأصيل.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وكريمة النبرة. استُخدمت «فليكن لنا ... هذا الفكر» لنقل الحث الجماعي مع إبراز أن بولس يشمل نفسه، وأُبقي التحول اللاحق إلى ضمير المخاطبين كما في النص اليوناني.
