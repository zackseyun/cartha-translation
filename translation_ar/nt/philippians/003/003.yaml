  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: ar
  text: لأننا نحن الختان، نحن الذين نعبد بروح الله[a]، ونفتخر بالمسيح يسوع[b]، ولا نضع ثقتنا في الجسد[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات العبارة بما يمكن ترجمته: «نعبد الله بالروح».'
    reason: textual_variant
  - marker: b
    text: «المسيح» ترجمة اللقب اليوناني خريستوس، ومعناه «الممسوح».
    reason: lexical_alternative
  - marker: c
    text: يشير «الجسد» هنا إلى الأسس الجسدية أو البشرية للثقة، مثل الختان والنسب والمكانة الدينية.
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: الختان
  rationale: أُبقي التعبير العهدي المحسوس كما هو، لأن مفارقة بولس تقوم على وصف جماعة المؤمنين نفسها بأنها «الختان»، لا على مجرد علامة جسدية.
- source_word: πνεύματι θεοῦ
  choice: بروح الله
  rationale: بحسب نص SBLGNT، تشير العبارة على الأرجح إلى روح الله بوصفه واسطة العبادة أو مجالها؛ وحرف الباء ينقل هذه الدلالة بوضوح وطبيعية.
- source_word: λατρεύοντες
  choice: نعبد
  rationale: الفعل يدل على خدمة دينية مقدمة لله، و«نعبد» هو المقابل العربي الطبيعي الواضح في هذا السياق.
- source_word: καυχώμενοι
  choice: نفتخر
  rationale: يحفظ الفعل حدة المقابلة بين الافتخار بالمسيح والاتكال على المؤهلات البشرية، من غير تخفيفه إلى مجرد الفرح.
- source_word: Χριστῷ
  choice: بالمسيح
  rationale: نُقل اللقب اليوناني Χριστός إلى المقابل العربي الراسخ «المسيح»، مع إبقاء طبيعته كلقب ظاهرة في الحاشية.
- source_word: σαρκί
  choice: الجسد
  rationale: يحفظ اللفظ التداخل بين المعنى الجسدي والمعنى المجازي المتعلق بالمزايا البشرية، من غير حصره في معنى «الطبيعة الخاطئة».
- source_word: πεποιθότες
  choice: لا نضع ثقتنا
  rationale: ينقل معنى الاتكال الراسخ الذي يفيده اسم الفاعل التام، ويأتي عربيًا سليمًا مع «في الجسد».
- source_word: γάρ
  choice: لأن
  rationale: يحفظ الصلة التفسيرية بما سبق، وهو رابط عربي واضح وطبيعي.
theological_decisions:
- issue: دلالة «الجسد» (σάρξ) في الآية
  choice: يشير أساسًا إلى الأسس الجسدية والبشرية للثقة الدينية، ومنها الختان والنسب والمكانة والإنجاز
  alternative: الطبيعة الخاطئة بوصفها مبدأً أخلاقيًا باطنيًا
  rationale: يسرد بولس بعد ذلك مباشرة الختان والنسب والالتزام بالشريعة وسائر المؤهلات؛ لذلك يتقدم هنا معنى الهوية والمزايا البشرية، مع إبقاء لفظ «الجسد» على اتساعه.
- issue: دلالة «بروح الله» (πνεύματι θεοῦ)
  choice: روح الله هو واسطة العبادة أو مجالها
  alternative: روح الإنسان، أو عبادة الله عبادة روحية فحسب
  rationale: قراءة SBLGNT التي تتضمن θεοῦ تشير طبيعيًا إلى الروح الإلهي، مع بقاء حرف الجر اليوناني قابلًا لدلالة الوساطة أو المجال؛ لذلك لا تُحسم هاتان الدلالتان في الصياغة العربية.
- issue: هوية «الختان»
  choice: يصف بولس جماعة المتكلمين بأنها «الختان» على نحو عهدي ومفارِق
  alternative: قصر اللفظ على المختونين جسديًا أو التصريح في المتن بأن المقصود «المختونون حقًا»
  rationale: الصياغة الاسمية المباشرة في اليونانية مقصودة بلاغيًا؛ لذا حُفظت من غير إضافة تفسير يحسم ماهية الجماعة أو يستبدل المجاز.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم التكرار «نحن... نحن الذين» لتقوية الضمير اليوناني البارز ἡμεῖς ولربط الخبر بالصفات اللاحقة طبيعيًا. حُفظت مصطلحات «الختان» و«الجسد» و«المسيح» بدل شرحها داخل المتن، ووُضعت الإيضاحات الضرورية في الحواشي.
