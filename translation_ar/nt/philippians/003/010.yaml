base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: ar
  text: لِأَعْرِفَهُ، وَقُوَّةَ قِيَامَتِهِ، وَالْمُشَارَكَةَ فِي آلَامِهِ[a]، مُتَشَبِّهًا بِمَوْتِهِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الشركة في آلامه».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «متشكِّلًا على مثال موته».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι
  choice: لِأَعْرِفَهُ
  rationale: يحفظ صيغة المصدر الدالة على الغاية في السياق، ويؤدي المعرفة الشخصية الاختبارية من غير توسع تفسيري.
- source_word: δύναμιν
  choice: قُوَّةَ
  rationale: المقابل العربي المباشر والواضح، ويشير هنا إلى القوة الفاعلة المتجلية في القيامة.
- source_word: ἀναστάσεως
  choice: قِيَامَتِهِ
  rationale: «القيامة» هي العبارة العربية الراسخة والدقيقة للحدث المقصود في هذا السياق.
- source_word: κοινωνίαν
  choice: الْمُشَارَكَةَ فِي
  rationale: تنقل معنى الاشتراك الفعلي في الآلام بوضوح، وتحافظ على كون اللفظة اسمًا ضمن سلسلة الأسماء في اليونانية.
- source_word: παθημάτων
  choice: آلَامِهِ
  rationale: «الآلام» تعبير مباشر وطبيعي عن معاناة المسيح المقصودة هنا.
- source_word: συμμορφιζόμενος
  choice: صَائِرًا عَلَى صُورَةِ
  rationale: ينقل معنى التشكل المتدرج على مثال شيء آخر، ويحافظ على الصيغة الحالية الدالة على مسار مستمر من غير حسم ما إذا كان التركيز على الفعل أو النتيجة.
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: مَوْتِهِ
  rationale: يربط التشكل بموت المسيح نفسه بصورة موجزة وطبيعية في العربية.
theological_decisions:
- issue: دلالة κοινωνίαν παθημάτων αὐτοῦ
  choice: مشاركة حقيقية في آلام المسيح
  alternative: شركة مع آلامه بمعنى أعمّ أو أكثر تجريدًا
  rationale: البناء اليوناني وسياق بولس يرجحان معنى الاشتراك في نمط آلام المسيح، من غير تقييده بمنظومة عقائدية أضيق.
- issue: دلالة συμμορφιζόμενος
  choice: مسار مستمر يصير فيه بولس على صورة موت المسيح
  alternative: حالة مكتملة من المطابقة لموته
  rationale: صيغة اسم الفاعل الحاضر ترجح معنى جارياً أو متدرجًا، ولذلك تجنبت الصياغة التي توحي بأن المطابقة قد اكتملت.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ توازي العناصر الاسمية في اليونانية، واستُعملت «المشاركة» بدل «الشركة» في المتن لأنها أوضح للقارئ المعاصر في الدلالة على الاشتراك الفعلي، مع إثبات البديل في الحاشية. وضُبطت الكلمات بالشكل الجزئي/الكامل لتجنب التباس القراءة.
