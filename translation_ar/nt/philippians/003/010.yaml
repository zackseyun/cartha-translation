  terminology: «قيامة»، و«آلام»، و«المشاركة» مصطلحات سليمة وواضحة. وتبقى «الشركة في آلامه» بديلًا معجميًا مناسبًا في الحاشية. «متشبِّهًا بموته» ينقل المعنى دون تحميله تفسيرًا مذهبيًا.
