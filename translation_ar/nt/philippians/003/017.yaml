  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: ar
  text: اقتدوا بي معًا، أيها الإخوة[a]، ولاحظوا الذين يسلكون هكذا، كما أنكم تجدون فينا قدوة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ فالصيغة اليونانية مذكرة جمع، لكنها على الأرجح تخاطب جماعة المؤمنين كلها.
    reason: ملاحظة لغوية وسياقية
  - marker: b
    text: أو «مثالًا» أو «نموذجًا».
    reason: بديل معجمي
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: اقتدوا بي معًا
  rationale: ينقل الأمر الطبيعي في العربية مع الحفاظ على دلالة المشاركة الجماعية التي يحملها الاسم Συμμιμηταί، وعلى مرجعية «بي» المفردة.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة النداء المذكرة الجمع في اليونانية، مع توضيح شمول الخطاب للجماعة في الحاشية.
- source_word: σκοπεῖτε
  choice: راقبوا
  rationale: يفيد توجيه الانتباه بعناية إلى أشخاص يُحتذى بهم، وهو أمر مستمر بحسب السياق.
- source_word: οὕτω περιπατοῦντας
  choice: الذين يسلكون هكذا
  rationale: يحفظ استعارة «السلوك» الشائعة كتابيًا للدلالة على نهج الحياة، ولا يحولها إلى تعبير تفسيري صرف.
- source_word: τύπον
  choice: قدوة
  rationale: تؤدي معنى المثال أو النموذج الذي يُقتدى به بصورة طبيعية وواضحة في العربية.
- source_word: ἡμᾶς
  choice: فينا
  rationale: يحافظ على ضمير الجمع، فلا يُختزل إلى بولس وحده، وتنسجم الصياغة مع الفعل العربي «تجدون».
theological_decisions:
- issue: شمول لفظ ἀδελφοί
  choice: إبقاء «الإخوة» في المتن مع بيان الشمول المحتمل في الحاشية
  alternative: «الإخوة والأخوات» في المتن
  rationale: الصيغة اليونانية مذكرة جمع، لكن سياق مخاطبة الكنيسة كلها يرجح شمول النساء أيضًا؛ فتُحفظ الصيغة في المتن ويُوضح مداها السياقي في الحاشية.
- issue: هوية النموذج في ἡμᾶς
  choice: الإبقاء على الجمع «فينا»
  alternative: 'إفراد المرجع: «فيَّ»'
  rationale: النص اليوناني ينتقل من «بي» المفرد إلى «فينا» الجمع، وينبغي حفظ هذا التوتر بدل تسويته بافتراض أن بولس وحده هو المقصود.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «اقتدوا بي معًا» لإظهار البعد الجماعي، و«يسلكون» لحفظ الاستعارة الأصلية، مع تجنب الصياغة الحرفية الثقيلة.
