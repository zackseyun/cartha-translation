lexical_decisions:
- source_word: Ἀλλὰ
  choice: لكن
  rationale: تفيد انتقالًا تقابليًا قويًا عن أسباب الثقة المذكورة سابقًا، وهي صياغة عربية موجزة وطبيعية.
- source_word: ἅτινα ἦν μοι κέρδη
  choice: ما كان لي من مكاسب
  rationale: تحفظ شمول اسم الموصول وتعبّر بوضوح عن جملة الامتيازات السابقة، مع إبقاء صورة الحساب في لفظ «مكاسب».
- source_word: ταῦτα
  choice: فقد ... ـه
  rationale: أُحيل إلى مجموع ما سبق بضمير المفرد الدال على ذلك المجموع، وهي صياغة عربية أكثر سلاسة من تكرار اسم الإشارة.
- source_word: ἥγημαι
  choice: عددتُه
  rationale: الفعل في صيغة التام يدل على تقويم حاسم تمّ وما زال أثره قائمًا؛ و«عددتُه» يحفظ معنى التقدير والحساب من غير إثقال العبارة.
- source_word: διὰ τὸν Χριστὸν
  choice: بسبب المسيح
  rationale: διά مع النصب تفيد هنا السبب، و«المسيح» تنقل Χριστός بوصفه لقبًا مفهوم المعنى في العربية.
- source_word: ζημίαν
  choice: خسارةً
  rationale: تحفظ المقابلة التجارية المباشرة بين المكاسب والخسارة، ويوافق المفرد اليوناني تقويم تلك المكاسب كلها بوصفها خسارة واحدة.
theological_decisions:
- issue: دلالة Χριστόν
  choice: المسيح
  alternative: المسيح المنتظر؛ أو كريستوس بنقل صوتي
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحفظ دلالته اللقبية من غير إدخال تفسير طائفي.
- issue: دلالة διὰ مع النصب
  choice: بسبب المسيح
  alternative: من أجل المسيح
  rationale: السياق يجيز إبراز السبب، وهو الأقرب مباشرةً إلى هذا التركيب؛ لكن «من أجل» قد تجمع معنى السبب والغاية، لذلك أُثبتت بديلًا في الحاشية حفاظًا على سعة الدلالة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حافظت الصياغة على استعارة المكاسب والخسارة وعلى التقابل البلاغي، مع تجنب تركيب حرفي ثقيل مثل «وأما الأشياء التي كانت لي مكاسب، فهذه حسبتها خسارة».
