  text: Only[a], let us keep in step with what we have attained.
translation:
  language: ar
  text: لكن، فلنواصل السير وَفقَ ما قد بلغناه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فلنسلك بحسب المقياس نفسه» أو «فلنلتزم المستوى نفسه». ويترك النص اليوناني اسم المقياس أو النهج ضمنيًا؛ وتضيف بعض المخطوطات «بحسب القاعدة نفسها».'
    reason: توضح الصياغات الممكنة للعنصر المحذوف في اليونانية، وتبيّن بإيجاز أن ذكر «القاعدة» الصريح وارد في قراءة مخطوطية دون إدخاله في المتن.
lexical_decisions:
- source_word: πλήν
  choice: أَمَّا
  rationale: تؤدي هنا وظيفة انتقالية تقييدية تُركّز الوصية على ما تحقق بالفعل، من غير أن تجعلها استثناءً صريحًا.
- source_word: εἰς ὃ
  choice: ما... إليه
  rationale: تشير العبارة إلى النقطة أو المستوى الذي بلغه المؤمنون، وتأتي هذه الصياغة طبيعية مع «وصلنا».
- source_word: ἐφθάσαμεν
  choice: قد وصلنا
  rationale: تفيد بلوغ نقطة أو مستوى، و«قد» تُبرز أن هذا الوصول تحقق وله صلة بالحاضر من غير المبالغة في معنى الإنجاز.
- source_word: τῷ αὐτῷ
  choice: على نهجه
  rationale: تُبقي المرجع إلى ما وصلوا إليه ضمنيًا، كما في النص اليوناني الأقصر، ولا تُدخل اسمًا صريحًا مثل «قاعدة» أو «مقياس».
- source_word: στοιχεῖν
  choice: فلنواصل السير
  rationale: تحفظ صورة السير المنتظم في خط واحد، وتعبّر عن الاستمرار في السلوك الموافق لما تم بلوغه.
theological_decisions:
- issue: هل يُضاف اسم صريح مثل «قاعدة» أو «مقياس» مع τῷ αὐτῷ؟
  choice: 'عدم إضافة اسم صريح في المتن، وصوغ المعنى: «فلنواصل السير على نهجه».'
  alternative: «فلنسلك بحسب القاعدة نفسها» أو «فلنلتزم المقياس نفسه».
  rationale: النص اليوناني المعطى يترك الأمر الذي يُسار بحسبه ضمنيًا؛ وإضافة «قاعدة» قد تعكس توسعات نصية لاحقة أو تقليدًا ترجميًا أكثر مما تعكس هذه الصيغة اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «أمّا» للانتقال التقييدي، وحُفظت استعارة السير مع تجنب إدخال «القاعدة» في المتن لأن الاسم غير مصرح به في قراءة SBLGNT.
