revisions:
- from: مع أن لي أنا أيضًا ثقةً في الجسد. إن ظنّ أحدٌ غيري أن له ثقةً في الجسد[a]، فأنا أحقّ منه بذلك.
  to: مع أن لي أنا ثقةً حتى في الجسد. إن كان أحدٌ آخر يظن أن له ثقةً في الجسد[a]، فأنا أولى بذلك.
  rationale: تُظهر المراجعة قوة «حتى» في καὶ ἐν σαρκί، وتستبدل تعبيرًا قد يفيد الاستحقاق بتعبير عربي يطابق المقارنة في μᾶλλον. كما تُضبط الحاشية لتكون موازية لتركيب المتن، مع صون لفظ «الجسد» وعدم فرض تفسير مذهبي.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'يحفظ المسودّة البنية التنازلية، وتكرار «الثقة في الجسد»، والمقارنة الختامية. لكن «أنا أيضًا» أضعف دلالة καὶ المرتبطة بـ«في الجسد»، إذ قد تُفهم بمعنى: أنا بدوري؛ والأدق هنا إظهار معنى «حتى»/«حتى في الجسد». كما أن «أحقّ منه بذلك» تميل إلى معنى الاستحقاق، في حين أن μᾶλλον تفيد أن لبولس قدرًا أكبر من أسس هذه الثقة أو موجبًا أقوى لها.'
  naturalness: الأسلوب فصيح ومفهوم. «مع أن» مناسبة في افتتاح جملة تابعة للسياق السابق، و«إن كان أحد آخر يظن...» و«فأنا أولى بذلك» صيغتان طبيعيتان واضحتان في العربية المعاصرة.
  terminology: الإبقاء على «الجسد» صائب؛ فلا ينبغي استبداله في المتن بـ«الطبيعة الخاطئة» أو بـ«المؤهلات». وتوضح الحاشية، بعد ضبطها، المعنى السياقي المحتمل من غير تحويله إلى تفسير ملزم.
  issues:
  - severity: medium
    issue: موضع «أيضًا» في العبارة الأولى
    rationale: في καὶ ἐν σαρκί تتجه καὶ إلى تقوية العبارة «حتى في الجسد». أما «لي أنا أيضًا» فقد تجعل الإضافة متعلقة بالمتكلم، لا بمجال الثقة.
  - severity: low
    issue: «أحقّ منه بذلك» مقابل μᾶλλον
    rationale: «أحق» قد تدل على أهلية أو استحقاق؛ والسياق يقارن مقدار ما لدى بولس من دواعي الثقة. «أولى بذلك» أقرب وأقل إيحاءً قانونيًا.
  - severity: low
    issue: صياغة البدائل في الحاشية
    rationale: الأفضل أن تبقى البدائل اسمية موازية لعبارة «ثقة في...»، لا أن تتحول إلى فعل «أن يعتمد»، مع الحفاظ على أن العبارة اليونانية حرفيًا «في الجسد».
