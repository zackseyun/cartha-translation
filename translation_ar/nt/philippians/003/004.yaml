  text: καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: ar
  text: مع أن لي أنا ثقةً حتى في الجسد. إن كان أحدٌ آخر يظن أن له ثقةً في الجسد[a]، فأنا أولى بذلك.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ثقة في مؤهلات بشرية» أو «ثقة في مكانة ظاهرة». واللفظ اليوناني حرفيًا: «في الجسد».'
    reason: بيان المعنى السياقي المحتمل مع الحفاظ على اللفظ الحرفي في المتن.
lexical_decisions:
- source_word: καίπερ
  choice: مع أن
  rationale: تفيد التنازل بوضوح في صدر العبارة، وتلائم اتصال الآية بما قبلها.
- source_word: ἐγὼ ἔχων πεποίθησιν καὶ
  choice: لي أنا أيضًا ثقة
  rationale: تحوّل التركيب الاشتقاقي إلى جملة عربية طبيعية، مع إبراز ضمير المتكلم ونقل معنى الإضافة في καὶ.
- source_word: πεποίθησιν
  choice: ثقة
  rationale: تنقل معنى الاطمئنان أو الاستناد دون توسيع تفسيري إلى «المؤهلات» في المتن.
- source_word: σαρκί
  choice: الجسد
  rationale: تحافظ على اللفظ المصدري الملموس وعلى امتداده اللاهوتي، بينما توضّح الحاشية أن السياق يشير إلى المكانة والمزايا البشرية الظاهرة.
- source_word: δοκεῖ
  choice: يظنّ
  rationale: ينقل هنا معنى اعتبار المرء نفسه صاحب ثقة، وهو تعبير عربي واضح وطبيعي.
- source_word: ἄλλος
  choice: غيري
  rationale: يبيّن المقارنة التي ينشئها السياق بين بولس وأي شخص آخر، وهو المقصود من τις... ἄλλος.
- source_word: πεποιθέναι
  choice: أن له ثقة
  rationale: يعبّر عن حالة الثقة المستقرة التي يدل عليها المصدر التام، بصياغة عربية غير متكلّفة.
- source_word: μᾶλλον
  choice: فأنا أحقّ منه بذلك
  rationale: 'ينقل المقارنة المضمرة بصورة عربية سليمة: لبولس، بحسب حجته، أساس أقوى لمثل هذه الثقة، من غير ادعاء أنه يتبناها فعليًا.'
theological_decisions:
- issue: دلالة σάρξ في فيلبي 3:4
  choice: إبقاء «الجسد» في المتن، مع فهمه هنا بوصفه أساسًا بشريًا أو ظاهريًا للثقة
  alternative: المؤهلات البشرية / المكانة الظاهرة / الطبيعة الخاطئة
  rationale: تعدّد الآيات 5–6 الختان والنسب والالتزام بالشريعة والغيرة، مما يرجّح الإشارة إلى الامتيازات البشرية والدينية الظاهرة، لا إلى «الطبيعة الخاطئة». وإبقاء «الجسد» يصون لفظ النص وتوتره الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ تكرار «الثقة في الجسد» لصلته البلاغية بالنص اليوناني، واستُعمل «أحقّ منه بذلك» لتجنب العبارة العربية المبتورة «فأنا أكثر» مع صون قوة المقارنة.
