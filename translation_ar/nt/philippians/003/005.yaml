lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: مختونٌ في اليوم الثامن
  rationale: ينقل العبارة اليونانية المكثفة بصياغة عربية طبيعية، مع الحفاظ على الإشارة إلى علامة العهد اليهودية وتوقيت الختان.
- source_word: ἐκ γένους Ἰσραήλ
  choice: من نسل إسرائيل
  rationale: يدل γένος هنا على الأصل والانحدار القومي؛ و«من نسل إسرائيل» واضحة وتحافظ على دعوى النسب الإسرائيلي دون توسيع المعنى إلى مجرد الانتماء الاجتماعي.
- source_word: φυλῆς Βενιαμίν
  choice: من سبط بنيامين
  rationale: تحدد العبارة الانتساب القبلي، و«سبط بنيامين» هو التعبير العربي الكتابي الواضح والمألوف.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: عبرانيٌّ من عبرانيين
  rationale: يحافظ هذا التعبير على إيجاز الأصل وتوكيده، ويترك مدى الإشارة إلى النسب والهوية العبرانية دون حسم تفسيري زائد.
- source_word: κατὰ νόμον
  choice: من جهة الشريعة
  rationale: تفيد κατά هنا بيان الاعتبار أو المجال الذي يندرج تحته الوصف التالي؛ و«من جهة الشريعة» عربية طبيعية وأدق في وصل العبارة بكون بولس فريسيًا.
- source_word: Φαρισαῖος
  choice: فريسيٌّ
  rationale: هو المقابل العربي الراسخ لاسم الجماعة اليهودية، ويحافظ على دلالة الهوية الدينية التاريخية.
