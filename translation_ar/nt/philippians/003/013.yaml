base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: ar
  text: 'أيها الإخوة[a]، أنا لا أحسب نفسي قد أمسكت به. لكن أمرٌ واحدٌ: أنسى ما ورائي، وأمتدّ نحو ما أمامي،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الإخوة» ترجمة لصيغة النداء اليونانية المذكرة adelphoi، وكان بولس كثيرًا ما يستعملها مخاطبًا جماعة المؤمنين كلها، نساءً ورجالًا.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة النداء المذكرة في اليونانية، مع بيان شمول الاستعمال لجماعة المؤمنين كلها في الحاشية.
- source_word: λογίζομαι
  choice: أحسب
  rationale: تعبير عربي فصيح وطبيعي يدل على التقدير أو الحكم الشخصي، من غير إيحاء بحساب عددي.
- source_word: κατειληφέναι
  choice: قد أمسكت به
  rationale: يحفظ صورة الأخذ أو الإمساك الواردة في السياق القريب، ويترك مرجع الضمير مفهومًا من السياق من غير تحديد تفسيري زائد.
- source_word: ἓν δέ
  choice: لكن أمرًا واحدًا
  rationale: يحافظ قدر الإمكان على الانتقال المقتضب والجملة الناقصة في اليونانية، مع إضافة «أمرًا» لتكون العبارة واضحة وطبيعية بالعربية.
- source_word: τὰ μὲν ὀπίσω
  choice: ما ورائي
  rationale: ينقل المقابلة المكانية بإيجاز طبيعي، من غير حصرها في أحداث أو إنجازات بعينها.
- source_word: ἐπιλανθανόμενος
  choice: أنسى
  rationale: ينقل المعنى المعجمي المباشر، وصيغة المضارع العربية تُظهر الفعل الجاري في سياق السعي.
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: ما أمامي
  rationale: يحافظ على التقابل الواضح مع «ما ورائي» وعلى انفتاح المرجع دون تفسير زائد.
- source_word: ἐπεκτεινόμενος
  choice: أمتدّ نحو
  rationale: يحفظ صورة مدّ النفس إلى الأمام، وهي أقرب إلى اللفظ اليوناني من تعبير قد يضيف معنى الجهد الشديد صراحة.
theological_decisions:
- issue: المفعول المحذوف مع κατειληφέναι
  choice: إيراد ضمير عام في «أمسكت به»
  alternative: تسمية المفعول مثل «الغاية» أو «الكمال»، أو حذف الضمير
  rationale: اليونانية لا تصرّح بالمفعول هنا. الضمير يجعل العربية سليمة ويربط العبارة بالسياق السابق، من غير حسم هوية الشيء المقصود.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. حُفظ الإيجاز والانتقال المفاجئ في «لكن أمرًا واحدًا»، كما حُفظت صورة الإمساك والحركة إلى الأمام دون تفسير المقصود تفسيرًا عقائديًا محددًا.
