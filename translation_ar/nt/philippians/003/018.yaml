  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: ar
  text: 'فَإِنَّ كَثِيرِينَ يَسْلُكُونَ[a]، وَقَدْ كُنْتُ أُخْبِرُكُمْ عَنْهُمْ مِرَارًا، وَالآنَ أَقُولُ وَأَنَا أَبْكِي: إِنَّهُمْ أَعْدَاءُ لِصَلِيبِ الْمَسِيحِ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: يعيشون أو يتصرّفون؛ فالسلوك هنا صورة لنهج الحياة.'
    reason: توضيح الاستعارة في περιπατοῦσιν مع إبقائها في المتن
lexical_decisions:
- source_word: πολλοὶ
  choice: كَثِيرِينَ
  rationale: الصفة مستعملة استعمال الاسم، فتدل ببساطة على جماعة كثيرة العدد.
- source_word: γὰρ
  choice: فَإِنَّ
  rationale: تحفظ الأداة وظيفة الجملة في تعليل الحث السابق وربطها به ربطًا طبيعيًا في العربية.
- source_word: περιπατοῦσιν
  choice: يَسْلُكُونَ
  rationale: يحفظ اللفظ استعارة المشي التي يستعملها بولس للدلالة على نهج الحياة، مع إيضاحها في الحاشية.
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: كُنْتُ أُحَدِّثُكُمْ عَنْهُمْ مِرَارًا
  rationale: «كنت» مع «مرارًا» تنقل دلالة الماضي المتكرر في صيغة الفعل الناقص، والضمير الموصول يقتضي في العربية معنى الحديث عنهم.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: وَالآنَ أَقُولُ ذَلِكَ وَأَنَا أَبْكِي
  rationale: تنقل العبارة زمن القول الحاضر وحال المتكلم المستمرة من غير تحويل البكاء إلى مجرد وصف عاطفي عام.
- source_word: ἐχθροὺς
  choice: أَعْدَاءً
  rationale: مقابل عربي مباشر قوي يدل على معارضة الصليب، وجاء منصوبًا على الحال لبيان الهيئة التي يسلكون بها.
- source_word: τοῦ σταυροῦ
  choice: لِصَلِيبِ
  rationale: «الصليب» هو المقابل العربي المباشر المستقر، واللام تعبّر طبيعيًا عن جهة العداوة.
- source_word: τοῦ Χριστοῦ
  choice: الْمَسِيحِ
  rationale: يحفظ معنى اللقب اليوناني Χριστός، وهو المقابل العربي الطبيعي من غير اضطرار إلى المفاضلة الإنجليزية بين Messiah وChrist.
theological_decisions:
- issue: العلاقة النحوية بين «يسلكون» و«أعداء صليب المسيح»
  choice: أَعْدَاءً لِصَلِيبِ الْمَسِيحِ، على أنها حال من فاعل «يسلكون»
  alternative: وَهُمْ أَعْدَاءُ صَلِيبِ الْمَسِيحِ
  rationale: النص اليوناني يضع «الأعداء» بعد جملة اعتراضية بوصفها تعريفًا لأولئك الكثيرين. النصب على الحال يحفظ ارتباط العبارة بسلوكهم من غير إضافة فعل صريح غير موجود، مع بقاء معنى تعريفهم بأنهم أعداء الصليب.
- issue: دلالة Χριστοῦ أهي لقب أم اسم عَلَم
  choice: الْمَسِيحِ بوصفه لقبًا
  alternative: لا يوجد في العربية مقابل اسمي مغاير شائع يوازي Christ الإنجليزية
  rationale: السياق لا يقتضي إفراغ اللفظ من دلالة اللقب، والعربية تستعمل «المسيح» طبيعيًا في هذه العبارة.
translation_notes:
  register: صياغة عربية فصحى حديثة ذات نبرة رسولية جليلة. حُفظ امتداد الجملة اليونانية واعتراضها العاطفي بشرطتين، مع تجنب تركيب الموصول الحرفي المتعثر. استُعمل «أحدّثكم عنهم» لسلامة العربية، و«وأنا أبكي» لصراحة الفعل وحضوره.
