revisions:
- from: فَإِنَّ كَثِيرِينَ يَسْلُكُونَ[a]—وَهُمُ الَّذِينَ كُنْتُ أُحَدِّثُكُمْ عَنْهُمْ مِرَارًا، وَالآنَ أَقُولُ ذَلِكَ وَأَنَا أَبْكِي—أَعْدَاءً لِصَلِيبِ الْمَسِيحِ.
  to: 'فَإِنَّ كَثِيرِينَ يَسْلُكُونَ[a]، وَقَدْ كُنْتُ أُخْبِرُكُمْ عَنْهُمْ مِرَارًا، وَالآنَ أَقُولُ وَأَنَا أَبْكِي: إِنَّهُمْ أَعْدَاءُ لِصَلِيبِ الْمَسِيحِ.'
  rationale: أعيدت صياغة الجملة بحيث يكون «إنهم أعداء لصليب المسيح» مضمون القول الحالي، وهو ما يطابق وظيفة العبارة اليونانية ويزيل إبهام «ذلك». وحُفظت دلالة الماضي المتكرر في «كنت أخبركم ... مرارًا»، وحال البكاء الحاضر، واستعارة «يسلكون»، ولقب «المسيح».
