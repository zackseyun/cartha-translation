revisions:
- from: نِهَايَتُهُمُ الْهَلَاكُ، وَإِلَهُهُمْ بَطْنُهُمْ[a]، وَمَجْدُهُمْ فِي خِزْيِهِمْ؛ هُمُ الَّذِينَ يَهْتَمُّونَ بِالْأُمُورِ الْأَرْضِيَّةِ.[b]
  to: نِهَايَتُهُمُ الْهَلَاكُ، وَإِلَهُهُمْ بَطْنُهُمْ[a]، وَمَجْدُهُمْ فِي خِزْيِهِمْ؛ الَّذِينَ يُفَكِّرُونَ فِي الْأُمُورِ الْأَرْضِيَّةِ.[b]
  rationale: عُدّلت العبارة الختامية وحدها لتقريب φρονοῦντες من دلالة التفكير أو التوجّه الذهني، وحُذف الضمير الاستئنافي الزائد لتبقى العبارة وصفًا متصلًا للأشخاص كما في اليونانية. أُبقيت الحواشي ومواضعها؛ وهي متسقة مع الألفاظ العربية المشار إليها.
