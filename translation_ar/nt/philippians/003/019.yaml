review_pass:
  verdict: revise
  source_fidelity: الشق الختامي «هُمُ الَّذِينَ يَهْتَمُّونَ» أضعف من دلالة φρονοῦντες، التي تصف توجّه الفكر أو الانشغال الذهني المستمر. والصياغة المنقحة «الذين يفكّرون في» أقرب إلى الأصل وتحفظ وظيفته الوصفية. أمّا سائر العبارات فتنقل المعنى اليوناني بإيجاز ودقة، بما في ذلك الصورة المجازية «إلههم بطنهم».
  naturalness: النص فصيح ومفهوم. حذف «هم» قبل الموصول يجعل الخاتمة أشد اندماجًا في سلسلة أوصاف الأشخاص وأقرب إلى إيقاع العربية الحديثة الرصينة.
  terminology: «الهلاك»، و«بطنهم»، و«مجدهم»، و«خزيهم»، و«الأمور الأرضية» اختيارات مناسبة وتحافظ على المفارقة والصورة البلاغية دون تحميل مذهبي. حاشية (أ) مناسبة لموضعها في العربية، وكذلك حاشية (ب).
  issues:
  - severity: low
    issue: «يهتمون بالأمور الأرضية» لا يعبّر بوضوح كافٍ عن توجّه الفكر في φρονοῦντες.
    rationale: الفعل قد يدل على العناية أو الاهتمام العملي، في حين أن الأصل يصف نمط التفكير والتوجّه الذهني. «يفكّرون في» أقرب، مع بقاء دلالة الاستمرار مفهومة من اسم الفاعل والسياق.
