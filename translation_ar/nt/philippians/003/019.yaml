id: PHP.3.19
reference: Philippians 3:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: ar
  text: نِهَايَتُهُمُ الْهَلَاكُ، وَإِلَهُهُمْ بَطْنُهُمْ[a]، وَمَجْدُهُمْ فِي خِزْيِهِمْ؛ الَّذِينَ يُفَكِّرُونَ فِي الْأُمُورِ الْأَرْضِيَّةِ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلههم شهيتهم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عقولهم منصرفة إلى الأمور الأرضية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: نهايتهم
  rationale: تحافظ «النهاية» على إيجاز اليونانية، ويمكن أن تشير إلى خاتمة مسارهم ومآله النهائي من غير إضافة تفسير مثل «مصيرهم».
- source_word: ἀπώλεια
  choice: الهلاك
  rationale: «الهلاك» تعبير عربي واضح وشديد، ينقل معنى الدمار أو الضياع النهائي ويحفظ البعد الأخروي المحتمل.
- source_word: κοιλία
  choice: بطنهم
  rationale: يحفظ اللفظ الصورة الجسدية الصريحة في الأصل، بدل اختزالها تفسيريًا في «شهوتهم» أو «شهيتهم».
- source_word: δόξα
  choice: مجدهم
  rationale: المقابل المباشر الذي يصون المفارقة البلاغية بين المجد والخزي، دون تحويل «المجد» إلى «الافتخار» تفسيرًا.
- source_word: αἰσχύνη
  choice: خزيهم
  rationale: ينقل معنى العار والمهانة الأخلاقية بصياغة عربية موجزة، ويتلاءم مع المقابلة البلاغية مع «مجدهم».
- source_word: τὰ ἐπίγεια
  choice: الأمور الأرضية
  rationale: صياغة طبيعية قريبة من الجمع المحايد اليوناني، وتشمل ما يتصل بالأرض دون تضييق المعنى على الماديات وحدها.
- source_word: φρονοῦντες
  choice: يهتمون بـ
  rationale: ينقل توجه الفكر والاهتمام المستمر، وهو أوسع من مجرد التفكير العابر. وصيغة الموصول تحافظ على وظيفة اسم الفاعل المعرّف في اليونانية.
- source_word: ὧν ... ὧν
  choice: نهايتهم ... وإلههم
  rationale: الضمائر العربية أكثر سلاسة من تكرار تركيب «الذين نهايتهم... والذين إلههم»، مع إبقاء الوصف المتتابع العائد إلى المذكورين في السياق السابق.
theological_decisions:
- issue: القوة المجازية لعبارة «إلههم بطنهم»
  choice: الإبقاء على الصورة الحسية «بطنهم» في المتن
  alternative: إلههم شهيتهم / شهوتهم
  rationale: يستعمل الأصل مجازًا جسديًا حادًا قد يشمل النهم أو الشهوات الحسية أو الخضوع للرغبات. إبقاء الصورة يمنع حصرها في تفسير واحد.
- issue: دلالة «الهلاك»
  choice: عدم تقييدها بشرح عقائدي داخل المتن
  alternative: الدمار الأبدي / الضياع
  rationale: يحمل ἀπώλεια قوة أخروية في السياق، لكن الآية نفسها تصوغه بإيجاز؛ لذلك تُحفظ شدته وغموض مداه دون تفصيل مذهبي زائد.
- issue: صلة العبارة الختامية بما قبلها
  choice: 'ترجمتها وصفًا للأشخاص: «هم الذين يهتمون...»'
  alternative: «وعقولهم منصرفة إلى الأمور الأرضية»
  rationale: يحفظ هذا البناء قيمة οἱ مع اسم الفاعل بوصفه توصيفًا لهؤلاء، ولا يحوّل فعل φρονέω صراحةً إلى حديث عن «العقول» مع أن المعنى الذهني حاضر.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم الضبط الجزئي الكامل في نص الآية لتيسير القراءة، مع الحفاظ على التوازي المكثف في الجمل الثلاث الأولى، ثم إبراز الوصف الختامي بعد الفاصلة المنقوطة.
