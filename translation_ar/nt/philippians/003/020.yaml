    reason: lexical_alternative
lexical_decisions:
- source_word: πολίτευμα
  choice: مواطنتنا
  rationale: يحفظ هذا اللفظ الدلالة المدنية والسياسية للكلمة، ويعبّر بوضوح عن انتماء المؤمنين وحقوقهم بوصفهم مواطنين، من غير اختزالها في مجرد مكان الإقامة.
- source_word: ἐν οὐρανοῖς
  choice: في السماوات
  rationale: يحافظ على صيغة الجمع في اليونانية، وهي صياغة عربية كتابية طبيعية وواضحة.
- source_word: ὑπάρχει
  choice: هي
  rationale: تفيد الوجود الحاضر الثابت في تركيب عربي طبيعي، من غير إثقال العبارة بالفعل «توجد».
- source_word: ἐξ οὗ
  choice: ومنها
  rationale: 'يعيد الضمير على السماوات ويحفظ المعنى المكاني: منها يأتي المخلّص المنتظَر.'
- source_word: ἀπεκδεχόμεθα
  choice: ننتظر بشوق
  rationale: ينقل معنى الانتظار المستمر المفعم بالتطلع والتوقع.
- source_word: σωτῆρα
  choice: مخلِّصًا
  rationale: هو المقابل العربي المألوف الذي يحفظ الدلالة الخلاصية والوزن المسيحاني للكلمة.
- source_word: κύριον
  choice: الرب
  rationale: الترجمة العربية الطبيعية الملائمة للاستعمال المسيحاني في العهد الجديد.
- source_word: Χριστόν
  choice: المسيح
  rationale: ينقل معنى اللقب، أي الممسوح أو المسيّا، وفي الوقت نفسه يوافق الصيغة العربية الراسخة «يسوع المسيح».
theological_decisions:
- issue: العلاقة النحوية بين «مخلِّصًا» و«الرب يسوع المسيح»
  choice: إضافة «هو» لبيان أن الرب يسوع المسيح هو المخلّص المنتظَر
  alternative: «ننتظر بشوق مخلِّصًا، الربَّ يسوع المسيح»
  rationale: «هو» توضيح نحوي طبيعي في العربية ولا يضيف هوية غير موجودة في النص؛ فالعبارة اليونانية تجعل «الرب يسوع المسيح» بدلًا يعيّن المخلّص.
- issue: دلالة Χριστόν ضمن العبارة κύριον Ἰησοῦν Χριστόν
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» في العربية يحمل معنى اللقب ويحافظ على الصيغة المسيحية العربية المألوفة، فلا يلزم الاختيار المصطنع بين «Christ» و«Messiah» الموجود في الإنجليزية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ جمع «السماوات» كما في اليونانية، واستُعملت «مواطنتنا» لإبراز الدلالة المدنية، مع توضيح البدائل في الحاشية.
