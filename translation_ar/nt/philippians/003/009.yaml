source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: ar
  text: وأُوجَد فيه، غير متحلٍّ ببرٍّ خاصّ بي مصدره الشريعة، بل بالبرّ الذي بالإيمان بالمسيح[a]، أي البرّ الآتي من الله والقائم على الإيمان.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بأمانة المسيح».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «العدل» بدل «البرّ» في الموضعين.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρεθῶ
  choice: أُوجَد
  rationale: يحافظ المبني للمجهول على صيغة الأصل وعلى معنى أن يتبيّن بولس أو يُرى في هذه الحال، من غير إضافة تفسير.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: ينقل العبارة البولسية الموجزة ويحفظ سعتها الدلالية المتعلقة بالاتحاد بالمسيح من غير حصرها في شرح واحد.
- source_word: μὴ ἔχων
  choice: لا وأنا أملك
  rationale: صياغة عربية طبيعية تؤدي وظيفة اسم الفاعل اليوناني في وصف الحال التي يُوجَد فيها بولس.
- source_word: δικαιοσύνην
  choice: برًّا / البرّ
  rationale: «البرّ» هو المقابل العربي الراسخ والملائم في هذا السياق البولسي، مع إثبات «العدل» بديلًا دلاليًا في الحاشية.
- source_word: τὴν ἐκ νόμου
  choice: مصدره الشريعة
  rationale: يُظهر بوضوح معنى المصدر أو المنشأ الذي تدل عليه ἐκ، ويستعمل «الشريعة» للدلالة السياقية على الناموس.
- source_word: διὰ πίστεως Χριστοῦ
  choice: بالإيمان بالمسيح
  rationale: يعرض في المتن قراءة الإضافة الموضوعية، أي الإيمان الموجَّه إلى المسيح، مع حفظ قراءة الإضافة الذاتية في الحاشية.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: يحافظ على القيمة اللقبية للكلمة اليونانية Χριστός وعلى الأسلوب العربي الكتابي الطبيعي.
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: البرّ الآتي من الله
  rationale: يحفظ إعادة تعريف البرّ من حيث مصدره الإلهي، بصياغة عربية واضحة.
- source_word: ἐπὶ τῇ πίστει
  choice: القائم على الإيمان
  rationale: ينقل معنى الأساس أو الارتكاز الذي تفيده ἐπί مع المجرور، من غير توسيع تفسيري.
theological_decisions:
- issue: دلالة πίστεως Χριστοῦ
  choice: الإيمان بالمسيح
  alternative: أمانة المسيح
  rationale: التركيب اليوناني محتمل للإضافة الموضوعية والإضافة الذاتية. اختيرت الأولى للمتن، وأُثبتت الثانية في الحاشية حفاظًا على الغموض الحقيقي والتوتر اللاهوتي.
- issue: دلالة δικαιοσύνη في السياق البولسي
  choice: البرّ
  alternative: العدل
  rationale: «البرّ» أنسب للسياق وللاستعمال اللاهوتي العربي الشائع، لكن المجال الدلالي قد يشمل «العدل»، ولذلك ذُكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ إيجاز الأصل وترابط عباراته، واستُعمل «المسيح» بوصفه لقبًا، مع وضع علامتي الحاشيتين عند العبارتين اللتين تتعلقان بهما مباشرة.
