lexical_decisions:
- source_word: εἴ πως
  choice: لعلّي... بوجهٍ ما
  rationale: يحفظ التعبير معنى التطلع المتواضع وعدم تحديد الكيفية، من غير أن يحمّله إنكارًا لوعد الله. وفصل جزأيه حول الفعل طبيعي في العربية وواضح.
- source_word: καταντήσω
  choice: أبلغ
  rationale: يدل الفعل هنا على الوصول إلى غاية؛ و«أبلغ» تعبير عربي طبيعي يحفظ صورة بلوغ المقصد.
- source_word: εἰς
  choice: أبلغ القيامة
  rationale: يتعدى «بلغ» بنفسه في العربية، فلا تُنقل أداة الجر اليونانية ترجمةً حرفية تخل بطبيعية العبارة.
- source_word: ἐξανάστασιν
  choice: القيامة
  rationale: الاسم يدل على النهوض أو القيامة، و«القيامة» هي العبارة العربية الواضحة المألوفة؛ أما خصوصية الصيغة اليونانية فتُذكر في الحاشية دون استحداث لفظ غامض.
- source_word: τὴν ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: ينقل العبارة بوضوح مع إبراز معنى الخروج من وسط الأموات، وهو أدق هنا من الاكتفاء بعبارة «من الأموات».
theological_decisions:
- issue: هل تقتضي صيغة ἐξανάστασις غير المألوفة تمييز هذه القيامة تمييزًا حادًا عن ἀνάστασις بما يوحي بقيامة خاصة؟
  choice: القيامة من بين الأموات
  alternative: القيامة الخارجة من بين الأموات
  rationale: يثبت النص القيامة من بين الأموات، لكن الصيغة اليونانية غير المألوفة لا تكفي وحدها لفرض مصطلح عربي مستحدث أو تقرير عقيدة مخصوصة. تحافظ الصياغة الأساسية على الوضوح، وتبيّن الحاشية البنية اللفظية الأشد حرفية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعمل «لعلّي» مع «بوجهٍ ما» لحفظ التطلع والاحتمال المتعلق بكيفية بلوغ الغاية، واستُعمل «من بين الأموات» لإظهار قوة ἐκ دون إثقال النص.
