- from: الذي سيغيّر جسد مذلّتنا ليصير على صورة جسد مجده، بحسب عمل قدرته التي بها يستطيع أيضًا أن يُخضع لنفسه كلَّ شيء.
  to: الذي سيحوّل جسد مذلّتنا ليكون مماثلًا لجسد مجده، بحسب الفاعلية التي بها يستطيع أيضًا أن يُخضع لنفسه كلَّ شيء.
  rationale: 'يحافظ التعديل على بنية النص ومعناه: تحويل جسد المذلة إلى مماثلة جسد المجد، وفق الفاعلية التي يستطيع بها المسيح إخضاع كل شيء لنفسه. وهو يزيل دمجًا غير لازم بين «العمل» و«القدرة»، ويجعل العربية أسلس، من غير إضافة تفسير عن كيفية القيامة أو طبيعة الإخضاع.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:49Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام منقول بأمانة، لكن «عمل قدرته» يدمج بين «الفاعلية/العمل» (ἐνέργεια) و«الاستطاعة» في العبارة التالية أكثر مما يفعل النص. كما أن «ليصير على صورة» أضعف قليلًا من دلالة المطابقة في الهيئة التي تفيدها σύμμορφον.
  naturalness: الصياغة مفهومة وفصيحة عمومًا، إلا أن «بحسب عمل قدرته التي بها يستطيع» ثقيلة وغير محكمة الإحالة؛ إذ تبدو «التي» عائدة إلى «القدرة» مع أن التركيب اليوناني يصف فاعلية استطاعته. والصياغة المقترحة أكثر سلاسة في العربية المعاصرة.
  terminology: «جسد مذلّتنا» و«جسد مجده» يحافظان على الإضافة المقصودة ولا يفرضان تفسيرًا مذهبيًا. و«يُخضع لنفسه كل شيء» مناسب ودقيق. استُبدلت «على صورة» بـ«مماثلًا لـ» لإبراز المطابقة المقصودة دون الإيحاء بأنها مجرد صورة أو مظهر.
  issues:
