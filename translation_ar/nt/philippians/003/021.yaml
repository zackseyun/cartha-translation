base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: ar
  text: الذي سيحوّل جسد مذلّتنا ليكون مماثلًا لجسد مجده، بحسب الفاعلية التي بها يستطيع أيضًا أن يُخضع لنفسه كلَّ شيء.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετασχηματίσει
  choice: سيغيّر
  rationale: يفيد الفعل إحداث تغيير حقيقي في الهيئة أو الحال؛ و«سيغيّر» تعبير عربي طبيعي يحافظ على دلالة المستقبل وقوة الفعل.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: جسد مذلّتنا
  rationale: يحافظ هذا التعبير على تركيب الإضافة اليوناني وعلى معنى حالة المذلة الراهنة، من غير اختزالها إلى مجرد ضعف جسدي.
- source_word: σύμμορφον
  choice: ليصير على صورة
  rationale: ينقل معنى المطابقة في الصورة مع صياغة عربية واضحة، ولا يوحي بمجرد شبه سطحي.
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: جسد مجده
  rationale: ترجمة قريبة من تركيب الأصل، وتبقي علاقة الجسد بالمجد مفتوحة كما صاغها اليوناني، بدل تحويلها بلا ضرورة إلى صفة تفسيرية.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: بحسب عمل قدرته
  rationale: يجمع بين معنى ἐνέργεια بوصفه عملًا فعّالًا وبين سياق القدرة الذي توضحه العبارة التالية، مع إبقاء دلالة «بحسب».
- source_word: τοῦ δύνασθαι αὐτὸν
  choice: التي بها يستطيع
  rationale: يصوغ البناء المصدري اليوناني صياغة عربية سليمة، ويربط العمل الفعّال بقدرة المسيح.
- source_word: ὑποτάξαι αὑτῷ τὰ πάντα
  choice: أن يُخضع لنفسه كلَّ شيء
  rationale: يحفظ معنى الإخضاع وشمول τὰ πάντα، كما يحفظ رجوع الفعل إلى الفاعل نفسه.
theological_decisions:
- issue: علاقة مذلة الجسد الحاضرة بمجده الآتي
  choice: وُصف التحول المستقبلي للجسد ليصير على صورة جسد مجد المسيح، من غير إضافة مصطلحات تشرح آلية القيامة.
  alternative: التصريح بأن المقصود هو إقامة أجساد المؤمنين وتمجيدها.
  rationale: النص يقرر تحولًا جسديًا ومطابقة لجسد مجد المسيح، لكنه لا يفصّل هنا آلية ذلك؛ لذا تُحفظ قوة العبارة وحدودها معًا.
- issue: طبيعة قدرة المسيح وسلطانه
  choice: حُفظ الربط بين تحويل الجسد وقدرته على إخضاع كل شيء لنفسه.
  alternative: تفسير الإخضاع بعبارة «إدخال كل شيء تحت سلطانه».
  rationale: «يُخضع» أقرب إلى الفعل اليوناني، وتبقي مدى «كل شيء» وعلاقة السلطان بالفعل من دون توسع تفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختيرت صياغة قريبة من بنية الأصل، مع تجنب التراكيب المتكلفة. لا توجد حواشٍ لأن البدائل الممكنة لا تبدو لازمة لفهم النص في هذه الصياغة.
