    rationale: النص يتكلم عن فاعلية/عمل يستطيع بها المسيح أن يُخضع كل شيء، لا عن «عمل قدرة» مضافٍ على هذا النحو. كما أن الإحالة في الموصول ثقيلة عربيًا.
  - severity: low
    issue: «ليصير على صورة جسد مجده» لا يبرز تمامًا قوة σύμμορφον.
    rationale: التعبير مفهوم، لكنه قد يُفهم على أنه اتخاذ صورة فحسب. «ليكون مماثلًا لجسد مجده» ينقل المطابقة في الهيئة بصورة أوضح.
