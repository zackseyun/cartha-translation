  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: ar
  text: وأخيرًا[a]، يا إخوتي[b]، افرحوا في الرب. أمّا أن أكتب إليكم الأمور نفسها، فليس شاقًّا عليّ[c]، وهو أمانٌ لكم[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أمّا ما بقي»، أو «من الآن فصاعدًا».
    reason: lexical_alternative
  - marker: b
    text: لفظ «الإخوة» هنا يخاطب جماعة المؤمنين كلها، أي الإخوة والأخوات.
    reason: cultural_note
  - marker: c
    text: أو «ليس عبئًا عليّ»، أو «لا يضجرني».
    reason: lexical_alternative
  - marker: d
    text: أو «ضمانٌ لسلامتكم».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: وأخيرًا
  rationale: تؤدي العبارة وظيفة الانتقال في الخطاب. و«أخيرًا» عربية طبيعية، مع إبقاء معاني «أمّا ما بقي» و«من الآن فصاعدًا» في الحاشية لأن العبارة لا تعني بالضرورة أن الرسالة أوشكت على الانتهاء.
- source_word: ἀδελφοί μου
  choice: يا إخوتي
  rationale: تحافظ على صيغة الجمع المذكر في اليونانية، مع بيان أن الخطاب موجّه إلى جماعة المؤمنين كلها.
- source_word: χαίρετε
  choice: افرحوا
  rationale: صيغة أمر للجمع، و«افرحوا» تنقل قوة الحث ومعنى الفرح بوضوح.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: نقل مباشر يحفظ الإطار اللاهوتي للفرح بوصفه قائمًا في العلاقة بالرب.
- source_word: τὰ αὐτά
  choice: الأمور نفسها
  rationale: صياغة شفافة تُبقي مرجع العبارة غير محدد، كما في الأصل اليوناني.
- source_word: γράφειν
  choice: أن أكتب
  rationale: يناسب تركيب المصدر اليوناني ويأتي طبيعيًا في العربية.
- source_word: οὐκ ὀκνηρόν
  choice: ليس شاقًّا عليّ
  rationale: ينقل أن تكرار الكتابة لا يثقل على بولس ولا يثنيه، من غير حصر المعنى في الملل.
- source_word: ἀσφαλές
  choice: أمانٌ لكم
  rationale: يعبر بإيجاز عن معنى السلامة والثبات الوقائي، مع ذكر البديل «ضمان لسلامتكم» في الحاشية.
theological_decisions:
- issue: صيغة خطاب جماعة المؤمنين من حيث الجنس
  choice: يا إخوتي
  alternative: يا إخوتي وأخواتي
  rationale: الأصل اليوناني جمع مذكر من الناحية النحوية، لذلك حُفظ في المتن، مع توضيح أن المقصود جماعة المؤمنين كلها، رجالًا ونساءً.
- issue: دلالة تكرار الكتابة بوصفه حماية
  choice: أمانٌ لكم
  alternative: ضمانٌ لسلامتكم
  rationale: تحفظ الصياغة المختارة المعنى المباشر للصفة اليونانية من دون إضافة صورة تفسيرية زائدة، بينما يوضح البديل البعد الوقائي.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم تركيب «أمّا... فـ...» لإظهار المقابلة في μὲν... δὲ بصورة طبيعية، مع تجنب ألفاظ تراثية عسيرة أو توسعات تفسيرية.
