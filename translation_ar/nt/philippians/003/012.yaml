base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: ar
  text: لا أقول إنني نلتُها بالفعل[a]، أو إنني قد أُكمِلتُ بالفعل[b]؛ بل أسعى لعلي أدرك أيضًا ما لأجله[c] أُدرِكتُ أنا أيضًا من قِبَل المسيح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حصلت عليها». المفعول به غير مذكور صراحة في اليونانية، ويُفهم من السياق المحيط.
    reason: lexical_alternative
  - marker: b
    text: أو «صرت كاملًا» أو «بلغت التمام». الفعل اليوناني هنا بصيغة تامة مبنية للمجهول.
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أن يُفهم التركيب اليوناني أيضًا بمعنى سببي: «لأني أنا أيضًا أُدرِكت من قِبَل المسيح».'
    reason: ambiguity
lexical_decisions:
- source_word: ἔλαβον
  choice: نلتها
  rationale: يناسب السياق معنى نيل الغاية المقصودة، مع إضافة ضمير المفعول في العربية لوضوح العبارة، لأن المفعول متروك ضمنيًا في اليونانية.
- source_word: τετελείωμαι
  choice: صرت كاملًا
  rationale: صياغة عربية طبيعية تعبّر عن بلوغ حالة الاكتمال مع إبقاء طبيعة هذا الكمال غير محددة، كما في الأصل.
- source_word: διώκω
  choice: أواصل السعي
  rationale: ينقل معنى الملاحقة والمثابرة المستمرة بعبارة عربية واضحة وطبيعية في هذا السياق.
- source_word: καταλάβω / κατελήμφθην
  choice: أدرك / أدركني
  rationale: يحافظ تكرار الجذر العربي على التلاعب اللفظي المقصود بين سعي بولس إلى الإمساك بالغاية وكون المسيح قد أمسك به أو أدركه.
- source_word: ἐφ’ ᾧ
  choice: ما من أجله
  rationale: يفهم العبارة على أنها تشير إلى الغاية التي كان استيلاء المسيح على بولس من أجلها، مع التنبيه إلى الاحتمال السببي في الحاشية.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: هو المقابل العربي الطبيعي للقب Χριστός، الذي يُستعمل هنا استعمالًا قريبًا من الاسم في كلام بولس.
theological_decisions:
- issue: هل يدل τετελείωμαι على كمال بلا خطية أو على اكتمال أوسع معنى؟
  choice: صرت كاملًا
  alternative: أُكمِلت / بلغت التمام
  rationale: ينفي بولس بلوغ حالة الكمال أو الاكتمال، لكن النص لا يحدد هذه الحالة وفق منظومة لاهوتية لاحقة؛ لذلك تُترك دلالة الكمال مفتوحة.
- issue: دلالة ἐφ’ ᾧ بين الغاية والسبب
  choice: ما من أجله
  alternative: لأني أنا أيضًا قد أدركني المسيح / بسبب ما
  rationale: قراءة الغاية تلائم حركة العبارة نحو الهدف في السياق، لكن التركيب اليوناني يحتمل دلالة سببية، ولذلك لا ينبغي إخفاء البديل.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. استُخدمت «أواصل السعي» لتصوير الاستمرار، وحُفظ التوازي اللفظي بين «أدرك» و«أدركني» قدر الإمكان، من غير حسم معنى الكمال أو إزالة غموض ἐφ’ ᾧ.
