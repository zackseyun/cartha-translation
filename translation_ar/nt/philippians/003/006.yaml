  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: ar
  text: مِن جهة الغيرة، كنتُ أضطهد الكنيسة؛ ومِن جهة البرّ الذي في الشريعة[a]، صرتُ بلا لوم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «البرّ بحسب الشريعة». وحرفيًا: «البرّ الذي في الشريعة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: مِن جهة
  rationale: تُدخل العبارةُ مجالَ التقييم، وتحافظ على التوازي البلاغي بتكرارها في شطري الآية.
- source_word: ζῆλος
  choice: الغيرة
  rationale: تنقل شدة الحماسة الدينية في سياق التزام بولس السابق، وهي لفظة عربية واضحة ومألوفة كتابيًا.
- source_word: διώκων
  choice: كنتُ أضطهد
  rationale: السياق يدل على الملاحقة العدائية للمؤمنين. واستُخدمت صيغة «كنتُ أضطهد» لتؤدي وظيفة اسم الفاعل اليوناني بصورة عربية طبيعية ضمن تعداد سيرة المتكلم.
- source_word: τὴν ἐκκλησίαν
  choice: الكنيسة
  rationale: تشير هنا إلى جماعة المؤمنين بالمسيح، لا إلى مجرد اجتماع عام، و«الكنيسة» هي المقابل العربي المباشر المفهوم.
- source_word: δικαιοσύνην
  choice: البرّ
  rationale: «البرّ» هو المقابل العربي الراسخ لـδικαιοσύνη، ويلائم هنا الاستقامة المقوَّمة في نطاق الشريعة من غير أن يحسم كل أبعاد المصطلح اللاهوتية.
- source_word: τὴν ἐν νόμῳ
  choice: الذي في الشريعة
  rationale: يحافظ على صورة اليونانية الحرفية «في الشريعة» وعلى إمكان فهمها بوصفها نطاقًا أو معيارًا، بدل تحويلها صراحة إلى «تحت الشريعة».
- source_word: γενόμενος
  choice: صرتُ
  rationale: ينقل الفعل الدال على الصيرورة بوضوح، ويحفظ كونه وصفًا لما آل إليه حال بولس ضمن الإطار المذكور.
- source_word: ἄμεμπτος
  choice: بلا لوم
  rationale: يفيد عدم وجود مأخذ عليه بحسب معيار البرّ المذكور، من غير أن يوحي بعصمة مطلقة من الخطية.
theological_decisions:
- issue: نطاق قول بولس إنه «بلا لوم»
  choice: يصف بولس حاله من جهة البرّ الذي في الشريعة، أي بحسب المجال أو المعيار المذكور.
  alternative: أن يكون مدّعيًا كمالًا أخلاقيًا مطلقًا وخلوًا تامًا من الخطية أمام الله.
  rationale: يربط التركيب اليوناني «بلا لوم» مباشرةً بالبرّ «الذي في الشريعة»، ولذلك ينبغي إبقاء الادعاء ضمن هذا الإطار وعدم توسيعه إلى كمال مطلق.
- issue: دلالة ἐν νόμῳ
  choice: الإبقاء على «في الشريعة» في النص.
  alternative: «تحت الشريعة» أو «بحسب الشريعة».
  rationale: الصياغة الحرفية تحتفظ بالغموض الحقيقي بين المجال والمعيار، في حين قد تحسم البدائل العلاقة تفسيرًا أكثر مما يفعل الأصل.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. حُفظ التوازي بتكرار «مِن جهة»، واستُخدم ضمير المتكلم الذي يقتضيه السياق العربي مع أن اليونانية تعتمد على أسماء الفاعل والتراكيب الوصفية.
