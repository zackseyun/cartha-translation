  rationale: يحفظ الصورة الحسية للقيود، مع صياغة عربية واضحة تدل أيضًا على حال السجن.
- source_word: Ὀνήσιμον
  choice: أنسيمس
  rationale: نقل صوتي شائع وواضح للاسم اليوناني في العربية.
theological_decisions:
- issue: طبيعة علاقة بولس بأنسيمس
  choice: الإبقاء على استعارة الأبوة والولادة الروحية من غير التصريح بأن بولس هداه إلى الإيمان
  alternative: الذي صرت له أبًا في السجن
  rationale: النص يلمّح بقوة إلى نشوء علاقة روحية على يد بولس، لكنه يعبّر عن ذلك بالفعل «ولدت» لا بصيغة عقائدية تفسيرية صريحة.
