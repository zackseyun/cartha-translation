  text: εἰ δέ τι ἠδίκησέν σε ἢ ὀφείλει, τοῦτο ἐμοὶ ⸀ἐλλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/018.yaml
  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: ar
  text: ولكن إن كان قد أساء إليك في شيء أو كان مدينًا لك بشيء، فاحسب ذلك عليَّ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قيِّد ذلك في حسابي». يحمل الفعل معنى محاسبيًا، أي احتساب شيء على شخص أو تسجيله في حسابه.'
    reason: بديل معجمي يوضح الصورة المحاسبية في الفعل اليوناني.
lexical_decisions:
- source_word: εἰ δέ
  choice: ولكن إن كان
  rationale: تنقل «إن» الشرط، بينما تعبّر «لكن» عن الانتقال المقابل اللطيف المرتبط بالآية السابقة. وأُضيف «كان» لتستقيم صياغة الشرط مع الفعل الماضي والحالة القائمة في العربية.
- source_word: τι
  choice: في شيء
  rationale: تحافظ العبارة على عدم التحديد في الأصل، من غير أن تقيّد نوع الإساءة أو مقدارها.
- source_word: ἠδίκησέν σε
  choice: قد أساء إليك
  rationale: تعبير عربي طبيعي وواسع يشمل الظلم أو الإضرار الشخصي أو المادي من غير تخصيص لا يقتضيه السياق.
- source_word: ἢ ὀφείλει
  choice: أو كان مدينًا لك بشيء
  rationale: يُظهر معنى الدَّين أو الالتزام، ويصرّح بالمفعول غير المباشر المفهوم من السياق، مع إبقاء مقدار الدَّين غير محدد.
- source_word: τοῦτο
  choice: ذلك
  rationale: يشير بوضوح إلى الإساءة أو الدَّين المذكورين قبلَه، وهو الأنسب في العربية للإحالة إلى ما سبق.
- source_word: ἐμοὶ
  choice: عليَّ
  rationale: تؤدي معنى إسناد التبعة أو الدَّين إلى بولس، وتنسجم طبيعيًا مع فعل «احسب» ومع صورة الحساب المالي.
- source_word: ἐλλόγα
  choice: فاحسب
  rationale: 'يحفظ الفعل معنى القيد والمحاسبة: احتساب الأمر على شخص أو تسجيله في حسابه، بلغة عربية واضحة غير اصطلاحية لاهوتيًا.'
