    reason: alternative_reading
lexical_decisions:
- source_word: δέσμιος
  choice: أسير
  rationale: يدل اللفظ على شخص مقيَّد أو مسجون. و«أسير» صياغة عربية موجزة وطبيعية تلائم الإضافة اليونانية التالية من غير أن تحسم هل المقصود الانتماء أم السبب.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: ترجمة اللقب اليوناني بمعناه المعروف في العربية، مع إبقاء وظيفته بوصفه لقبًا لا اسم عائلة.
- source_word: Ἰησοῦ
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم الشخصي.
- source_word: ὁ ἀδελφὸς
  choice: الأخ
  rationale: يحافظ على أداة التعريف الموجودة في اليونانية، وتُفهم الأخوّة هنا في إطار الجماعة المؤمنة من غير إضافة ضمير غير مصرح به.
- source_word: Φιλήμονι
  choice: إلى فليمون
  rationale: صياغة عربية طبيعية لداتيف المخاطَب في افتتاح الرسالة.
- source_word: ἀγαπητῷ
  choice: حبيبنا
  rationale: ينقل المودة التي يفيدها الوصف، ويعبّر مع الضمير عن ἡμῶν الذي يتصل بالوصفين اللاحقين.
- source_word: συνεργῷ
  choice: شريكنا في العمل
  rationale: ينقل معنى من يعمل مع آخر بعبارة عربية واضحة، ويحافظ على دلالة المشاركة في العمل.
- source_word: ἡμῶν
  choice: نا في «حبيبنا وشريكنا»
  rationale: الضمير جمع في الأصل، لذلك أُبقي بصيغة الجمع مع الوصفين بدل تحويله إلى المفرد.
theological_decisions:
- issue: دلالة الإضافة في δέσμιος Χριστοῦ Ἰησοῦ
  choice: أسير المسيح يسوع
  alternative: أسير من أجل المسيح يسوع
  rationale: الإضافة اليونانية موجزة ويمكن أن تشير إلى علاقة الأسير بالمسيح أو إلى كون سجنه بسببه؛ يحافظ المتن على الإضافة ويذكر الاحتمال السببي في الحاشية.
- issue: ترجمة Χριστός في التحية
  choice: المسيح
  alternative: كريستوس
  rationale: اللفظ يؤدي هنا وظيفة اللقب المسياني، و«المسيح» هو المقابل العربي الدلالي الراسخ الذي يحفظ هذه الوظيفة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حوفظ على إيجاز التحية الرسولية وعلى غموض الإضافة اليونانية، واستُعملت «شريكنا في العمل» بدل تركيب حرفي ثقيل.
