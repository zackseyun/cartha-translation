  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: ar
  text: من بولس، أسير المسيح يسوع[a]، وتيموثاوس الأخ، إلى فليمون حبيبنا وشريكنا في العمل،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
