  text: لذلك، مع أن لي في المسيح جرأةً كبيرةً لآمرك أن تفعل ما يليق،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: لذلك
  rationale: أداة استنتاج تربط الكلام بما سبق، و«لذلك» تؤدي هذا الربط بوضوح وطبيعية.
- source_word: πολλὴν ... παρρησίαν
  choice: جرأة كبيرة
  rationale: تحفظ معنى الثقة والجرأة في الكلام أو التصرف، مع نقل دلالة التكثير في πολλήν دون تضييق المعنى إلى مجرد الصراحة.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: «المسيح» ترجمة عربية راسخة للقب Χριστός وتحفظ طابعه اللقبي، أما «في» فتبقي العبارة البولسية العلاقية من غير حصرها في معنى أداتي أو سببي.
- source_word: ἔχων
  choice: مع أن لي
  rationale: يفهم اسم الفاعل هنا على وجه الاستدراك تمهيدًا للمقابلة في العدد التالي؛ وهذه الصياغة عربية طبيعية وتحفظ تعلق الجرأة بالمتكلم.
- source_word: ἐπιτάσσειν
  choice: أن آمرك
  rationale: ينقل الفعل معنى إصدار أمر بسلطان، وتلائم الصياغة العربية المفعول المخاطب المستفاد من σοι.
- source_word: σοι
  choice: كاف الخطاب في «آمرك»
  rationale: أُدمج ضمير المخاطب في الفعل وفق الأسلوب العربي الطبيعي مع الحفاظ على كونه متلقي الأمر.
- source_word: τὸ ἀνῆκον
  choice: بما يليق
  rationale: التركيب يدل على ما هو لائق أو مناسب. «بما يليق» موجزة وطبيعية، وتحفظ قدرًا من الإبهام بشأن الفعل المحدد المطلوب.
theological_decisions:
- issue: ترجمة Χριστῷ
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» في العربية ترجمة لقبية لا مجرد نقل صوتي، وهي الصيغة الكتابية العربية المألوفة التي تحفظ الدلالة المسيانية من غير إدخال تمييز لاهوتي زائد.
- issue: القوة المنطقية لاسم الفاعل ἔχων
  choice: مع أن لي
  alternative: إذ إن لي
  rationale: 'السياق الممتد إلى العدد 9 يرجح الدلالة الاستدراكية: مع امتلاك بولس سلطان الأمر، يختار أن يطلب. أبقيت المقابلة دون تفسير مصدر السلطان تفسيرًا إضافيًا.'
translation_notes:
  register: صياغة عربية فصحى واضحة وكريمة، تتبع ترتيب الحجة اليونانية قدر الإمكان من غير تكلف. تُركت الجملة منتهية بفاصلة لأنها تتصل نحويًا وفكريًا بالعدد التالي.
