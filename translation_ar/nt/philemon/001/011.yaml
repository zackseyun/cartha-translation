translation:
  language: ar
  text: الذي كان من قبل غير نافع لك[a]، أما الآن فهو نافع لك وليّ على السواء،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يُرجَّح أن بولس يلمّح إلى اسم أُنِسيمُس، المرتبط بمعنى النفع أو الفائدة.
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: الذي
  rationale: أداة التعريف في حالة النصب مستعملة استعمالًا اسميًا إحاليًا إلى أُنِسيمُس المذكور في الآية السابقة، واسم الموصول هو الصياغة العربية الطبيعية لاستمرار الجملة.
- source_word: ποτέ
  choice: من قبل
  rationale: تدل على زمن سابق، وتقابل νυνὶ «الآن» بوضوح في العربية المعاصرة.
- source_word: σοι
  choice: لك
  rationale: تنقل دلالة المجرور اليوناني في علاقته بالمنفعة بصورة موجزة وطبيعية.
- source_word: ἄχρηστον
  choice: غير نافع
  rationale: يحفظ المعنى المباشر، أي عدم النفع، ويحافظ على التضاد اللفظي مع εὔχρηστον وعلى التلميح المحتمل إلى معنى اسم أُنِسيمُس.
- source_word: νυνὶ δὲ
  choice: أما الآن
  rationale: تُبرز المقابلة الزمنية القوية بين الماضي والحاضر، وتنقل القوة الاستدراكية لـ δέ بأسلوب عربي فصيح طبيعي.
- source_word: σοὶ καὶ ἐμοὶ
  choice: لك ولي كليكما
  rationale: يحافظ على الطرفين وعلى معنى اقتران المنفعة بكليهما، مع إبراز «كليكما» دلالة البناء المزدوج بوضوح.
- source_word: εὔχρηστον
  choice: نافع
  rationale: مقابل عربي معاصر ودقيق لمعنى المفيد أو الصالح للاستعمال، ويقيم تضادًا لفظيًا مباشرًا مع «غير نافع».
theological_decisions:
- issue: التلاعب اللفظي المحتمل باسم أُنِسيمُس ودلالة التحول
  choice: الإبقاء على التضاد البسيط بين «غير نافع» و«نافع» في المتن
  alternative: إبراز التورية بتفسير زائد، مثل «لم يكن يوافق معنى اسمه، أما الآن فهو نافع حقًا»
  rationale: النص اليوناني يصرح بالتضاد دون شرح التورية. والصياغة المختارة تحفظ الأثر الأدبي المحتمل ولا تضيف تفسيرًا غير منصوص عليه.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة الأسلوب. حُفظت المقابلة المتوازنة بين الماضي والحاضر وبين «غير نافع» و«نافع»، مع وصل الآية نحويًا بما قبلها بواسطة «الذي».
