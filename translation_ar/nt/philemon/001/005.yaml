lexical_decisions:
- source_word: ἀκούων
  choice: إذ أسمع
  rationale: اسم الفاعل متعلق بسياق الشكر السابق؛ و«إذ أسمع» يحافظ على صلته بالسياق وعلى دلالته الحالية، من غير أن يحسم هل العلاقة سببية أم زمنية.
- source_word: ἀγάπην
  choice: محبتك
  rationale: «المحبة» هي المقابل المألوف والواضح لـἀγάπη، وأضيف ضمير المخاطب تعبيرًا طبيعيًا عن σου.
- source_word: πίστιν
  choice: إيمانك
  rationale: «الإيمان» هو المقابل الأساسي لـπίστις، مع إثبات احتمال «الأمانة» في الحاشية بسبب سعة المجال الدلالي للكلمة.
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: تجاه الرب يسوع
  rationale: «تجاه» يحفظ معنى التوجه نحو شخص، ويميّز πρός من εἰς اللاحقة بدل تسوية العبارتين.
- source_word: κύριον
  choice: الرب
  rationale: يحفظ اللقب المسيحاني المألوف لكلمة κύριος.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: ولجميع القديسين
  rationale: اللام عربية طبيعية في التعبير عن المحبة الموجّهة إلى أشخاص، مع إبقاء اختلاف حرف الجر عن «تجاه».
- source_word: ἁγίους
  choice: القديسين
  rationale: هو المقابل الموجز الراسخ للتسمية الجماعية البولسية ἅγιοι.
theological_decisions:
- issue: علاقة «المحبة» و«الإيمان» بالعبارتين التاليتين
  choice: الإبقاء على ترتيب اليونانية السطحي، بحيث تسبق المحبة والإيمان عبارتي «تجاه الرب يسوع» و«لجميع القديسين» من غير إعادة توزيع صريحة.
  alternative: «إيمانك بالرب يسوع ومحبتك لجميع القديسين».
  rationale: 'يرجح كثيرون التوزيع التقاطعي: الإيمان متعلق بالرب يسوع والمحبة بالقديسين، وهو معنى ملائم للسياق؛ لكن تركيب اليونانية لا يصرح بهذا التوزيع، لذلك أبقى المتن التوتر التركيبي وأثبت التفسير الأوضح في الحاشية.'
- issue: دلالة πίστις في هذا السياق
  choice: إيمان
  alternative: أمانة
  rationale: «الإيمان» هو المقابل الافتراضي، لكن الكلمة قد تدل أيضًا على الثقة أو الأمانة، ولذلك حُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل المثنى «اللذين» لربط الصلة بالاسمين معًا، وحُفظ اختلاف حرفي الجر والتباس توزيع المحبة والإيمان بدل حسمه في المتن.
