  text: because I hear of your love and faith that you have toward the Lord Jesus and for all the saints[c][b][a],
translation:
  language: ar
  text: لأنني أسمع عن المحبة والإيمان اللذين لديك تجاه الرب يسوع ولجميع القديسين[a][b][c]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتوضيح المعنى المحتمل: «إيمانك بالرب يسوع ومحبتك لجميع القديسين».'
