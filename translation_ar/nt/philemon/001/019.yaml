  to: 'أنا بولس كتبتُ هذا بيدي أنا: أنا سأردّ—ولا أقول لك إنك مدين لي حتى بنفسك.'
  rationale: استُبدلت «سأفي بالدَّين» بـ«سأردّ» للمحافظة على عدم ذكر المفعول في اليونانية وعلى اتساع مرجعه السياقي. وأضيف «أنا» بعد «بيدي» لإظهار التوكيد الشخصي في العبارة اليونانية. بقيت المفارقة البلاغية في «ولا أقول لك»، وبقيت طبيعة المديونية الشخصية غير مفسَّرة.
