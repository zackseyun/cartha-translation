  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: ar
  text: 'أنا بولس كتبتُ هذا بيدي أنا: أنا سأردّ—ولا أقول لك إنك مدين لي حتى بنفسك.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: كتبتُ
  rationale: صيغة الماضي توافق الفعل اليوناني الماضي وتحافظ على إبراز أن بولس دوّن الضمان بنفسه، وهي طبيعية في العربية في سياق الرسالة.
- source_word: τῇ ἐμῇ χειρί
  choice: بيدي
  rationale: تعبير عربي موجز وطبيعي يدل على أن بولس كتب العبارة بخط يده، مع بقاء التوكيد ظاهرًا من الضمير.
- source_word: ἀποτίσω
  choice: سأفي بالدَّين
  rationale: الفعل يدل على دفع ما هو مستحق أو ردّه. هذه الصياغة تلائم احتمال أن المقصود دَين أو خسارة مذكورة ضمنًا في العدد السابق، من غير إضافة مفعول غير مصرح به هنا.
- source_word: ἵνα μὴ λέγω σοι
  choice: ولا أقول لك
  rationale: يحافظ على صورة العبارة اليونانية وعلى مفارقتها البلاغية؛ إذ يقول بولس ضمنًا ما يعلن أنه لن يقوله، من غير تحويلها إلى غرض حرفي جامد.
- source_word: καὶ σεαυτόν
  choice: حتى بنفسك
  rationale: تنقل καί هنا بوصفها أداة تصعيد بمعنى «حتى»، وتحفظ قوة ضمير الانعكاس من غير تفسير طبيعة هذا الدَّين الشخصي.
- source_word: προσοφείλεις
  choice: مدين لي
  rationale: تعبير واضح يفيد المديونية. أما معنى الزيادة أو الدَّين الإضافي فيظهر من «حتى بنفسك» ومن المقابلة مع الدَّين المالي.
theological_decisions:
- issue: طبيعة دَين فليمون الشخصي لبولس
  choice: الإبقاء على القول إن فليمون مدين لبولس حتى بنفسه من غير تحديد سبب ذلك
  alternative: تفسير الدَّين بأنه اهتداء فليمون على يد بولس، أو إنقاذ حياته، أو دَين شخصي عام
  rationale: النص اليوناني يؤكد المديونية الشخصية لكنه لا يحدد أساسها، ولذلك تحفظ الصياغة الغموض المقصود ولا تستورد تفسيرًا تاريخيًا أو عقائديًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حوفظ على التوكيد المتكرر في «أنا بولس» و«أنا سأفي»، وعلى المفارقة اللبقة في «ولا أقول لك»، مع تجنب شرح طبيعة مديونية فليمون داخل النص.
