base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ar
  text: نعمةٌ لكم وسلامٌ من الله أبينا والرب يسوع المسيح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظة اليونانية Χριστός تعني «المسيح»، وقد تُستعمل لقبًا، أو تصبح في بعض السياقات أقرب إلى جزء من اسم «يسوع المسيح».
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: نعمة
  rationale: 'تحفظ اللفظة العربية المعنى المزدوج في التحية البولسية: عطية الله المجانية والتحية ذات الثقل اللاهوتي، من غير اختزالها إلى مجرد حظوة.'
- source_word: ὑμῖν
  choice: لكم
  rationale: صياغة عربية طبيعية للداتيف في سياق التحية والبركة، وهي موجهة إلى جماعة المخاطَبين.
- source_word: εἰρήνη
  choice: سلام
  rationale: تقابل المعنى المباشر وتحفظ صدى مفهوم السلام الكتابي الشامل.
- source_word: ἀπὸ
  choice: من
  rationale: تدل على مصدر النعمة والسلام.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: الله أبينا
  rationale: 'تعكس التركيب الإبدالي الطبيعي: الله، أي أبونا، من دون إدخال عطف غير موجود في اليونانية.'
- source_word: κυρίου
  choice: الرب
  rationale: تحفظ القوة التكريمية والمسيحانية للفظ κύριος في الاستعمال البولسي.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «يسوع» نقل للاسم، و«المسيح» الترجمة العربية الراسخة للقب Χριστός، مع بقاء إمكان أن يكون اللقب قد صار في هذا السياق أقرب إلى جزء ثابت من الاسم.
theological_decisions:
- issue: دلالة Χριστοῦ في العبارة Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع كريستوس
  rationale: «المسيح» ينقل معنى اللقب اليوناني بوضوح وفصاحة في العربية، بينما «كريستوس» نقل صوتي غير مألوف. وتوضح الحاشية أن Χριστός قد يؤدي وظيفة لقبية أو يكون أقرب إلى اسم ثابت، من غير حسم ما يتركه الاستعمال اليوناني مرنًا.
translation_notes:
  register: عربية فصحى واضحة وموقرة، بصياغة موجزة تلائم التحية الرسولية. استُبقي ترتيب «الله أبينا» لقربه من بنية الأصل مع بقائه طبيعيًا في العربية، ووُضع التنوين لإبراز صيغة الدعاء الاسمية من غير إضافة فعل غير موجود في النص.
