  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: ar
  text: أرسلُه[a] إليك من جديد—هو نفسه، أي قلبي[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة الفعل: «أرسلته إليك من جديد» أو «قد أرسلته إليك من جديد». جاء الفعل في اليونانية بصيغة الماضي، أما المضارع هنا فيعرض الحدث من منظور فليمون عند وصول الرسالة إليه.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «أحشائي»؛ وهي في اليونانية تعبير عن العاطفة العميقة والحنان.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: ـه
  rationale: ضمير موصول مذكر مفرد في حالة النصب يعود إلى أنسيمس؛ أُدمج طبيعيًا في الفعل العربي «أُعيده».
- source_word: ἀνέπεμψά
  choice: أُعيدُه
  rationale: الفعل يعني الإرسال إلى الجهة السابقة أو الإرجاع. استُخدم المضارع بحسب منظور الرسالة عند وصولها، مع بيان دلالة الماضي اليوناني في الحاشية.
- source_word: σοι
  choice: إليك
  rationale: ينقل بوضوح دلالة المخاطب المفرد بوصفه جهة الإرسال.
- source_word: αὐτόν
  choice: هو نفسه
  rationale: يحفظ التوكيد الناتج من تكرار الضمير في اليونانية، بصياغة عربية طبيعية.
- source_word: τοῦτ’ ἔστιν
  choice: أي
  rationale: أداة تفسير عربية موجزة وطبيعية تؤدي معنى الصيغة التوضيحية اليونانية.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: قلبي العزيز
  rationale: «الأحشاء» هي الصورة الحرفية، لكنها تدل اصطلاحيًا على موضع العاطفة العميقة والحنان. هذه الصياغة تنقل شدة محبة بولس وتعامله مع أنسيمس كمن هو عزيز على قلبه، من غير تعبير تشريحي غامض.
theological_decisions:
- issue: الصورة الأنثروبولوجية في σπλάγχνα
  choice: قلبي العزيز
  alternative: أحشائي؛ أعزّ ما في قلبي؛ موضع حناني
  rationale: الاختيار اصطلاحي لا عقائدي؛ فهو يحفظ قوة الارتباط العاطفي من غير أن يفرض تصورًا لاهوتيًا خاصًا أو أن يجعل العبارة غريبة على القارئ العربي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حُفظ توكيد الضمير اليوناني بعبارة «هو نفسه»، ونُقلت الصورة الاصطلاحية إلى تعبير وجداني مفهوم، مع إبقاء المعنى الحرفي في الحاشية.
