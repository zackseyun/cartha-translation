  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: ar
  text: وفي الوقت نفسه، هيِّئ لي أيضًا مكانًا للضيافة[a]، لأني أرجو أن أُمنَح لكم بواسطة صلواتكم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «منزلًا» أو «ضيافةً»؛ فاللفظة اليونانية قد تدل على مكان نزول الضيف أو على استضافته.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أُوهَب لكم» أو «أُعطى لكم»؛ يحمل الفعل اليوناني معنى أن يُعطى المرء عطيّةً أو يُمنح بسخاء، من غير تسمية الواهب صراحةً.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: وفي الوقت نفسه... أيضًا
  rationale: ينقل معنى الطلب الإضافي المصاحب لما سبق، مع صياغة عربية طبيعية تحفظ دلالة ἅμα وκαὶ، وتؤدي δέ بأداة الربط.
- source_word: ἑτοίμαζέ
  choice: هيِّئ
  rationale: فعل أمر مباشر وطبيعي، يلائم إعداد مكان الإقامة عمليًا.
- source_word: μοι
  choice: لي
  rationale: تؤدي دلالة المستفيد في صياغة عربية موجزة وطبيعية.
- source_word: ξενίαν
  choice: مكانًا للضيافة
  rationale: يحفظ الصياغة قدرًا من المجال الدلالي بين مكان الإقامة والضيافة، مع ترجيح المعنى الملموس الذي يقتضيه فعل التهيئة في السياق.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: لأني أرجو أن
  rationale: تبيّن اللام التعليلية سبب الطلب، وتدخل «أن» على مضمون الرجاء بوضوح.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: بفضل صلواتكم
  rationale: تعبير عربي طبيعي يؤدي معنى الوسيلة أو السببية في διά مع المضاف إليه، من غير جعل الصلوات فاعلًا مستقلًا للحدث.
- source_word: χαρισθήσομαι
  choice: أُوهَب
  rationale: يحفظ المبني للمجهول وفكرة العطية المتضمنة في الفعل، من غير التصريح بفاعل لم يذكره النص أو اختزال المعنى في الإفراج من السجن.
- source_word: ὑμῖν
  choice: لكم
  rationale: يحفظ دلالة المتلقين ويشير إلى رجوع بولس إليهم من غير إضافة تفسيرية.
theological_decisions:
- issue: دلالة χαρισθήσομαι والفاعل الضمني
  choice: أُوهَب لكم
  alternative: أُمنَح لكم / أُعاد إليكم
  rationale: يحفظ الاختيار المبني للمجهول وصورة بولس بوصفه عطية تُمنح للمخاطبين، مع إبقاء الفاعل غير مصرح به كما في اليونانية؛ ولا يقيّد الفعل بمعنى الإفراج رغم أن سياق الرسالة يسمح باستحضاره.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُعمل «مكانًا للضيافة» بدل «غرفة ضيوف» لأن الأصل لا يحدد نوع المكان، واستُعمل «أُوهَب» للمحافظة على المبني للمجهول ودلالة العطية من غير الإفصاح عن الفاعل الضمني.
