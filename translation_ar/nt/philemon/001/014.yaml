  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: ar
  text: لكنني لم أُرِدْ أن أفعل شيئًا من دون موافقتك[a]، لكيلا يكون إحسانك كأنه عن إكراه، بل عن طواعية.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من دون رأيك»، أو «من دون رضاك».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أن تعني «إحسانك» أيضًا: «عملك الصالح» أو «صلاحك». وعبارة «عن طواعية» تعني: بمحض إرادتك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: من دون موافقتك
  rationale: يمكن أن تدل γνώμη على الرأي أو الحكم أو القصد أو الموافقة. وفي السياق تشير إلى امتناع بولس عن التصرف من غير موافقة فليمون، و«موافقتك» واضحة وطبيعية في العربية.
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: لم أُرِدْ أن أفعل شيئًا
  rationale: يحافظ هذا التعبير على معنى الإرادة في ἠθέλησα من غير تحويله إلى قرار رسمي أو حاسم.
- source_word: ἵνα μὴ
  choice: لكيلا
  rationale: تنقل أداة الغاية اليونانية بإيجاز ووضوح، وتحافظ على كون ما يلي غرضًا لامتناع بولس.
- source_word: ὡς κατὰ ἀνάγκην
  choice: كأنه عن إكراه
  rationale: «عن إكراه» تنقل معنى الضغط أو الإجبار، و«كأنه» تقابل ὡς وتحافظ على التلطيف الموجود في النص.
- source_word: τὸ ἀγαθόν σου
  choice: إحسانك
  rationale: يحفظ «إحسانك» قدرًا من المرونة بين الفعل الحسن الملموس والصفة الخيّرة، من غير تحديد الفعل المقصود أكثر مما يحدده اليوناني.
- source_word: ᾖ
  choice: يكون
  rationale: جاء الفعل ضمن تركيب الغاية بعد ἵνα، وتنقله العربية طبيعيًا بالمضارع المنصوب بعد «لكيلا».
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: بل عن طواعية
  rationale: تعبير عربي طبيعي يبرز المقابلة المباشرة بين الإكراه والفعل الصادر طوعًا.
theological_decisions:
- issue: طبيعة استجابة فليمون
  choice: صياغة استجابة فليمون بوصفها إحسانًا يصدر طوعًا لا إكراهًا، من غير تحديد ماهية الفعل.
  alternative: «عملك الصالح» لفعل ملموس، أو «صلاحك» لصفة أعم.
  rationale: يركز النص على الصفة الإرادية لاستجابة فليمون، بينما يترك τὸ ἀγαθόν الفعل المحدد ضمنيًا؛ لذلك لا ينبغي للترجمة أن تحسم ما أبقاه النص مفتوحًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «إحسانك» للحفاظ على المرونة الدلالية، و«عن طواعية» لإقامة مقابلة طبيعية ومباشرة مع «عن إكراه».
