  text: Εὐχαριστῶ τῷ θεῷ μου πάντοτε μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/004.yaml
  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: ar
  text: أشكر إلهي دائمًا، ذاكرًا إياك[a] في صلواتي،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «صانعًا ذكرًا لك»؛ أي: «إذ أذكرك في صلواتي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: أشكر
  rationale: فعل مضارع خبري بصيغة المتكلم المفرد. و«أشكر» تعبير عربي مباشر وطبيعي يحفظ قوة الفعل.
- source_word: τῷ θεῷ μου
  choice: إلهي
  rationale: المجرور اليوناني يبيّن من يتلقى الشكر، وتؤدي «إلهي» المعنى بإيجاز وتحفظ ضمير الملكية بوصفه تعبيرًا تعبديًا شخصيًا.
- source_word: πάντοτε
  choice: دائمًا
  rationale: يدل الظرف على الاستمرار أو المواظبة، و«دائمًا» أوضح مقابل عربي في صيغة الشكر هذه.
- source_word: μνείαν σου ποιούμενος
  choice: ذاكرًا إياك
  rationale: التركيب يعني حرفيًا «صانعًا ذكرًا لك»، أي يذكر فليمون في صلاته. تحافظ صيغة الحال «ذاكرًا» على تزامن الفعل مع الشكر، مع عربية طبيعية.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: في صلواتي
  rationale: يفيد هذا التركيب الاصطلاحي الذكر في أثناء الصلاة؛ و«في صلواتي» واضحة وطبيعية وتحفظ صيغة الجمع وضمير المتكلم.
