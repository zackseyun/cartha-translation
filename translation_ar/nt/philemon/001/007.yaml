source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: ar
  text: فَقَدْ كَانَ لِي فَرَحٌ كَثِيرٌ وَتَشْجِيعٌ بِسَبَبِ مَحَبَّتِكَ، لِأَنَّ قُلُوبَ الْقِدِّيسِينَ[a] قَدِ انْتَعَشَتْ بِوَاسِطَتِكَ، يَا أَخِي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «أحشاء القديسين»، أي أعماق كيانهم وعواطفهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρὰν
  choice: فَرَحٌ
  rationale: المعنى المألوف هو الفرح والسرور، و«فرح» المقابل العربي الطبيعي في هذا السياق الوجداني.
- source_word: πολλὴν ἔσχον
  choice: كَانَ لِي ... كَثِيرٌ
  rationale: ينقل التعبير اليوناني الدال على امتلاك الفرح أو اختباره، مع الحفاظ على صياغة عربية واضحة وطبيعية.
- source_word: παράκλησιν
  choice: تَشْجِيعٌ
  rationale: قد تعني الكلمة التشجيع أو التعزية أو المواساة؛ و«تشجيع» يلائم هنا الأثر المقوّي الذي أحدثته محبة فليمون.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: بِسَبَبِ مَحَبَّتِكَ
  rationale: يفيد حرف الجر مع المجرور هنا أساس الفرح وسببه، ولذلك تنقل «بسبب» العلاقة السببية بوضوح.
- source_word: σπλάγχνα
  choice: قُلُوبَ
  rationale: المعنى الحرفي هو الأحشاء، لكنها تُستعمل مجازًا لموضع العواطف العميقة وباطن الإنسان؛ و«القلوب» تعبير عربي طبيعي، مع حفظ الدلالة الحرفية في الحاشية.
- source_word: τῶν ἁγίων
  choice: الْقِدِّيسِينَ
  rationale: يحافظ هذا اللفظ على مصطلح بولس الذي يصف المؤمنين بأنهم مكرسون لله، من غير استبداله بتفسير أوسع.
- source_word: ἀναπέπαυται
  choice: قَدِ انْتَعَشَتْ
  rationale: ينقل صيغة التام اليونانية أثرًا تحقق ولا تزال نتيجته قائمة، كما يعبّر عن الراحة والتجدد في هذا السياق الرعوي.
- source_word: διὰ σοῦ
  choice: عَلَى يَدَيْكَ
  rationale: ينقل معنى الوساطة أو الفاعلية الذي تفيده διά مع المضاف إليه، بصياغة عربية مألوفة.
- source_word: ἀδελφέ
  choice: يَا أَخِي
  rationale: يحفظ النداء الأخوي المباشر من غير إضافة وصف غير موجود في النص.
theological_decisions:
- issue: دلالة τῶν ἁγίων
  choice: القديسين
  alternative: المؤمنين أو شعب الله
  rationale: «القديسين» يحفظ لغة بولس عن جماعة المكرسين لله، ولا يلزم منه مفهوم التقنين الكنسي اللاحق.
- issue: الصورة الأنثروبولوجية في σπλάγχνα
  choice: قلوب
  alternative: أحشاء أو أعماق كيان
  rationale: المقصود باطن الإنسان وعواطفه العميقة لا العضو الجسدي وحده؛ و«قلوب» أوضح في العربية، بينما توضح الحاشية الصورة الأصلية.
- issue: دلالة ἀναπέπαυται
  choice: قد انتعشت
  alternative: قد استراحت أو وجدت راحة
  rationale: «انتعشت» تجمع معنى الراحة والتجدد وتحفظ النتيجة المستمرة لصيغة التام، من غير حصرها في الراحة الجسدية.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كريمة. وُضع رمز الحاشية بعد «قلوب القديسين» لأنه يشرح اللفظ اليوناني σπλάγχνα، لا كلمة «محبتك».
