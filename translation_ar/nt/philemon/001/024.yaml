  text: Mark, Aristarchus, Demas, and Luke, my fellow workers.
translation:
  language: ar
  text: مَرْقُسُ، وأَرِسْتَرْخُسُ، ودِيمَاسُ، ولُوقَا، العاملون معي.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μᾶρκος
  choice: مَرْقُسُ
  rationale: النقل العربي المعياري للاسم الشخصي اليوناني، كما هو شائع في التراث الكتابي العربي.
- source_word: Ἀρίσταρχος
  choice: أَرِسْتَرْخُسُ
  rationale: نقل صوتي عربي واضح للاسم اليوناني Ἀρίσταρχος، مع الحفاظ على صورته المعروفة كتابيًا.
- source_word: Δημᾶς
  choice: دِيمَاسُ
  rationale: النقل العربي الشائع للاسم الشخصي اليوناني Δημᾶς.
- source_word: Λουκᾶς
  choice: لُوقَا
  rationale: الصيغة العربية الراسخة للاسم اليوناني Λουκᾶς.
- source_word: οἱ συνεργοί
  choice: رفاقي في العمل
  rationale: تعبير عربي طبيعي يفيد المشاركة الفعلية في العمل، ويحفظ معنى التعاون الملازم لكلمة συνεργός من غير إيحاء مؤسسي حديث أو صياغة قديمة ثقيلة.
- source_word: μου
  choice: ـي في «رفاقي»
  rationale: ضمير المتكلم في حالة المضاف إليه يدل على الارتباط ببولس؛ وقد أُدمج طبيعيًا في الاسم العربي «رفاقي».
