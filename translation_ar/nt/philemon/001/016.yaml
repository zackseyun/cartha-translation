source:
  edition: SBLGNT
  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: ar
  text: 'لا بعد الآن كعبد[a]، بل أكثر من عبد: أخًا محبوبًا، ولا سيما لي؛ فكم بالأحرى لك، في الجسد[b] وفي الرب.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يُترجم اللفظ أيضًا «خادم» أو «عبد مملوك». وهو يشمل نطاقًا من أوضاع الخدمة والتبعية، لكنه يشير هنا على الأرجح إلى وضع أنسيمس الاجتماعي المقيَّد.
    reason: alternative_reading
  - marker: b
    text: المقصود بعبارة «في الجسد» هنا على الأرجح العلاقة الأرضية أو الاجتماعية، أو العلاقة الشخصية المباشرة، لا «الطبيعة الخاطئة».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: لا ... بعد الآن
  rationale: تعبير عربي طبيعي يحفظ دلالة النفي الزمني والتحول عن الوضع السابق.
- source_word: ὡς δοῦλον
  choice: كعبدٍ
  rationale: «عبد» هو المقابل العربي المباشر الذي يلائم وضع أنسيمس الاجتماعي ويُبقي قوة المقابلة اللاحقة، مع التنبيه إلى مجال دلالة اللفظ اليوناني في الحاشية.
- source_word: ὑπὲρ δοῦλον
  choice: أكثر من عبد
  rationale: ينقل معنى تجاوز المنزلة أو القيمة، لا معنى النيابة، بصياغة عربية واضحة.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: أخًا محبوبًا
  rationale: يحفظ الاستعارة العائلية والعلاقة داخل جماعة المؤمنين دون تفسير زائد.
- source_word: μάλιστα ἐμοί
  choice: ولا سيما عندي
  rationale: صياغة فصيحة ومألوفة تعبّر عن درجة الخصوصية التي تفيدها μάλιστα.
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: فكم بالحري عندك
  rationale: يحفظ القوة البلاغية التصاعدية للمقارنة بين علاقة بولس به وعلاقة فليمون به.
- source_word: ἐν σαρκὶ
  choice: في الجسد
  rationale: يحافظ على العبارة البولسية الملموسة وعلى احتمال دلالتها على العلاقة الأرضية أو الاجتماعية، بدل حصرها في تفسير واحد.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحفظ التعبير البولسي عن نطاق العلاقة أو الاتحاد المسيحي دون إضافة اسم غير وارد في النص.
theological_decisions:
- issue: ترجمة δοῦλος في سياق أنسيمس
  choice: عبد
  alternative: خادم أو عبد مملوك
  rationale: السياق الاجتماعي للرسالة يجعل حالة التبعية بارزة، و«عبد» يحفظ هذه الحقيقة وقوة عبارة «أكثر من عبد»، من غير أن يحدد قانونيًا كل تفاصيل وضع أنسيمس.
- issue: معنى ἐν σαρκὶ καὶ ἐν κυρίῳ
  choice: في الجسد وفي الرب كليهما
  alternative: في العلاقة الأرضية وفي الرب، أو شخصيًا وفي الرب
  rationale: تبقي الصياغة على التوازي والتوتر بين العلاقة البشرية أو الاجتماعية والعلاقة في الرب، ولا تجعل «الجسد» مرادفًا للطبيعة الخاطئة في هذا الموضع.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فكم بالحري» للمحافظة على التصعيد البلاغي، وأُبقيت عبارتا «في الجسد» و«في الرب» متوازيتين. وُضعت علامة الحاشية في نهاية الجملة لأنها تتناول عبارتين معجميتين في الآية.
