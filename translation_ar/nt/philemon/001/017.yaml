  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: ar
  text: فإن كنتَ تعتبرني شريكًا، فاقبله[a] كما تقبلني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «فرحّب به». يمكن أن يفيد الفعل استقبال شخص بحفاوة أو قبوله في الشركة.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: فإن
  rationale: تجمع الفاء بين الاستنتاج والارتباط بما سبق، وتحفظ «إن» الصيغة الشرطية في عربية طبيعية موجزة.
- source_word: ἔχεις κοινωνόν
  choice: تعتبرني شريكًا
  rationale: تفيد κοινωνός مَن يشارك غيره في أمر أو علاقة. و«تعتبرني شريكًا» تنقل التعبير اليوناني بصورة عربية طبيعية من غير تحويله إلى مصطلح عقائدي فني.
- source_word: προσλαβοῦ
  choice: فاقبله
  rationale: صيغة أمر تدل على قبول الشخص واستقباله برضا. و«اقبله» تحافظ على اتساع الدلالة، مع إمكان فهم الترحيب به وإدخاله في دائرة الشركة.
- source_word: αὐτὸν
  choice: ـه
  rationale: ضمير مفعول به يعود في السياق إلى أنسيمس.
- source_word: ὡς ἐμέ
  choice: كما تقبلني
  rationale: 'أُعيد فعل «تقبل» في العربية لإيضاح المقارنة الطبيعية: أن يُعامَل أنسيمس في القبول كما كان فليمون سيقبل بولس.'
theological_decisions:
- issue: القوة العلاقية للفظ κοινωνός في طلب بولس
  choice: شريكًا
  alternative: رفيقًا؛ مشاركًا
  rationale: «شريك» تنقل معنى المشاركة والعلاقة المتبادلة بين بولس وفليمون، من غير إقحام مفهوم طائفي أو عقائدي تقني.
- issue: مدى دلالة προσλαβοῦ
  choice: فاقبله
  alternative: فرحّب به
  rationale: «اقبله» تُبقي المعنى مفتوحًا على الاستقبال الحسن والقبول في العلاقة، بدل حصره في ضيافة أولية فحسب.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعملت صيغة الشرط كما في الأصل، وجاءت الفاء لتحفظ صلة الاستنتاج بالسياق السابق. وُضع مؤشر الحاشية بعد «فاقبله» لأنه يشرح البديل المعجمي للفعل προσλαβοῦ.
