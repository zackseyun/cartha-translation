  text: ⸀Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: ar
  text: يُسَلِّم عليك أبفراس، رفيقي في الأسر في المسيح يسوع.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: يُسَلِّم عليك
  rationale: الفعل ἀσπάζομαι هنا يفيد توجيه التحية. وهذه صياغة عربية طبيعية وموجزة مع الفاعل المفرد.
- source_word: σε
  choice: عليك
  rationale: ضمير مخاطب مفرد، يعود مباشرة إلى فليمون، ويظهر في تركيب «يُسَلِّم عليك».
- source_word: Ἐπαφρᾶς
  choice: أبفراس
  rationale: نقل للاسم وفق الصيغة العربية الكتابية الشائعة.
- source_word: ὁ συναιχμάλωτός μου
  choice: رفيقي في الأسر
  rationale: الاسم المركب يدل على شخص يشترك مع المتكلم في الأسر؛ و«رفيقي في الأسر» واضحة وطبيعية، وتحفظ معنى المشاركة دون افتراض أنهما كانا في السجن نفسه في اللحظة ذاتها.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: حُفظ حرف الجر «في» لصون العبارة البولسية ودلالتها اللاهوتية، وتُرجم Χριστός باللقب العربي الراسخ «المسيح»، مع نقل Ἰησοῦ إلى «يسوع».
theological_decisions:
- issue: دلالة العبارة ἐν Χριστῷ Ἰησοῦ وصلتها بالأسر
  choice: في المسيح يسوع
  alternative: من أجل المسيح يسوع
  rationale: الترجمة الحرفية تحافظ على صياغة بولس وعلى احتمال أن تصف هوية الرفيق وعلاقته بالمسيح، بدل أن تحسمها سببيًا بمعنى «من أجل».
- issue: ترجمة Χριστός في الصيغة البولسية
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الواضح والراسخ للقب Χριστός، ويحفظ معناه اللقبي في العربية دون تحويله إلى اسم مجرد.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. قُدِّم فعل التحية لتأتي الجملة طبيعية، مع الإبقاء على العبارة اللاهوتية «في المسيح يسوع» دون شرح زائد.
