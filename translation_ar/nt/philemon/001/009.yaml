  to: 'فإنّي ألتمس منك، من أجل المحبة، إذ أنا، بولس، على هذه الحال: رجل متقدم في السن، والآن أيضًا سجين المسيح يسوع—'
  rationale: استبدلت «أفضّل أن ألتمس» بـ«ألتمس ... من أجل المحبة» مع ترتيب طبيعي يتيح لـ«فإنّي» ولبنية السياق السابق أن يحملا المقابلة التي تفيدها μᾶλλον؛ وأضفت «على هذه الحال» لتمثيل الصيغة الوصفية الإهليلجية. كما استبدلت «شيخ» بـ«رجل متقدم في السن» لتقديم المعنى المعجمي المرجح في المتن نفسه. وتُوضع العلامات في النص بعد «منك» و«السن» و«يسوع» بحسب الحواشي المقابلة.
