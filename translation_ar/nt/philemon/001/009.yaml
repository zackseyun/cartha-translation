  source_fidelity: 'المعنى العام محفوظ: التعليل بالمحبة، والالتماس بدل الأمر، ووصف بولس وسجنه للمسيح يسوع. لكن «أفضّل أن ألتمس» تجعل μᾶλλον فعل تفضيل عربيًا مستقلًا أكثر مما هي أداة مقابلة لِما سبق في الآية 8؛ و«وأنا بولس» لا تنقل بوضوح الصياغة الوصفية الإهليلجية τοιοῦτος ὢν ὡς Παῦλος.'
