  terminology: «المسيح يسوع» مناسب ومألوف للقب Χριστός هنا، و«سجين المسيح يسوع» يحافظ على إيجاز الإضافة واتساعها. ينبغي استعمال «رجل متقدم في السن» في المتن لتفادي الالتباس غير الموجود في πρεσβύτης في هذا الموضع.
