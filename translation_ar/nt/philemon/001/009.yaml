  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: ar
  text: 'فإنّي ألتمس منك، من أجل المحبة، إذ أنا، بولس، على هذه الحال: رجل متقدم في السن، والآن أيضًا سجين المسيح يسوع—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: من أجل المحبة
  rationale: تنقل διά مع النصب بوصفها دالة على السبب أو الدافع، وتحافظ على إطلاق ἀγάπη من غير تعيين طرف المحبة في موضع يحتمل أكثر من وجه.
- source_word: μᾶλλον
  choice: أفضّل
  rationale: يُظهر المفاضلة بين ما كان يمكن لبولس أن يفعله، أي أن يأمر في الآية السابقة، وبين اختياره أن يلتمس.
- source_word: παρακαλῶ
  choice: أن ألتمس منك
  rationale: يناسب الطلب الشخصي القائم على العلاقة، وهو ألين من الأمر وأقوى دلالة من مجرد السؤال.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: وأنا بولس
  rationale: التركيب اليوناني إهليلجي، والترجمة العربية الحرفية من قبيل «إذ أكون مثل هذا، كبولس» غامضة ومتعسرة. يصوغ الاختيار التعريف الذاتي طبيعيًا مع إبقاء الأوصاف التالية لبولس.
- source_word: πρεσβύτης
  choice: شيخ
  rationale: المعنى الطبيعي للكلمة هنا رجل متقدم في السن، لا صاحب رتبة كنسية. و«شيخ» عربية موجزة وكريمة السياق، مع توضيح البديل في الحاشية.
- source_word: νυνὶ δὲ καὶ
  choice: والآن أيضًا
  rationale: 'يحفظ التوكيد الزمني والإضافة: إلى كونه شيخًا صار الآن كذلك سجينًا.'
- source_word: δέσμιος
  choice: سجين
  rationale: المقابل المباشر لمن هو في الحبس، من غير تحويل الاسم إلى صورة مجازية مثل «مقيّد بالسلاسل».
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحافظ هنا على قوة اللقب في تركيب الإضافة الدال على الانتماء أو أن سجنه من أجل يسوع المسيح.
theological_decisions:
- issue: دلالة πρεσβύτης
  choice: شيخ، أي رجل متقدم في السن
  alternative: سفير؛ أو شيخ بوصفه صاحب منصب كنسي
  rationale: اللفظة في النص هي πρεσβύτης ودلالتها الطبيعية متصلة بالعمر؛ أما «سفير» فتوافق عادة لفظة يونانية أخرى هي πρεσβευτής، ولا يقتضي السياق إدخال منصب كنسي.
- issue: دلالة إضافة δέσμιος إلى Χριστοῦ Ἰησοῦ
  choice: سجين المسيح يسوع
  alternative: سجين من أجل المسيح يسوع
  rationale: تُبقي الإضافة العربية الإيجاز والاتساع الدلالي في الأصل، إذ قد تشير إلى الانتماء للمسيح وإلى كون السجن بسببه أو في خدمته، بدل حصرها في علاقة واحدة.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: كريستوس/الممسوح
  rationale: «المسيح» هو اللقب العربي التاريخي والواضح الذي ينقل معنى Χριστός بوصفه لقبًا، من غير جعله مجرد اسم علم أو استعمال صياغة غير مألوفة.
translation_notes:
  register: العربية فصحى معاصرة، واضحة وذات نبرة كريمة. استُعمل «ألتمس منك» لإبراز رقة الطلب في مقابل الأمر، و«شيخ» بالمعنى العمري مع حاشية مانعة للالتباس. أبقيت الشرطة الختامية لأن الجملة تستمر في الآية التالية.
