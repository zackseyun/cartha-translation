lexical_decisions:
- source_word: τάχα
  choice: فلعلَّه
  rationale: تنقل طابع الاستنتاج المتحفّظ والاحتمالي في كلام بولس، من غير تحويله إلى يقين.
- source_word: γὰρ
  choice: الفاء في «فلعلَّه»
  rationale: تحافظ على الصلة التفسيرية بما سبق بأسلوب عربي طبيعي.
- source_word: διὰ τοῦτο
  choice: لهذا السبب
  rationale: تُظهر دلالة السبب، مع إبقاء احتمال الغاية التدبيرية الذي يتضح في بقية الجملة.
- source_word: ἐχωρίσθη
  choice: أُبعِد عنك
  rationale: صيغة المبني للمجهول تحفظ عدم التصريح بالفاعل، فلا تلقي اللوم مباشرة على أنسيمس ولا تسمّي الله فاعلًا، وتعبّر طبيعيًا عن الانفصال المكاني أو العلاقي.
- source_word: πρὸς ὥραν
  choice: إلى حين
  rationale: تعبير عربي مألوف عن مدة محدودة، ويحافظ على المقابلة مع «إلى الأبد» دون حمل ὥρα على ساعة حرفية.
- source_word: ἵνα
  choice: لكي
  rationale: تنقل دلالة الغاية أو النتيجة المقصودة بوضوح.
- source_word: αἰώνιον
  choice: إلى الأبد
  rationale: تؤدي الوظيفة الظرفية للصفة هنا وتبرز المقابلة بين الانفصال المؤقت والاستعادة الدائمة، مع إبقاء أصدائها الروحية الممكنة.
- source_word: αὐτὸν
  choice: ـه في «تستعيده»
  rationale: ضمير المفعول العائد إلى أنسيمس.
- source_word: ἀπέχῃς
  choice: تستعيده
  rationale: تفيد أن يصير أنسيمس لدى فليمون من جديد، وهي صياغة عربية موجزة وطبيعية تلائم سياق استعادة العلاقة.
theological_decisions:
- issue: الفاعل المضمر في المبني للمجهول ἐχωρίσθη
  choice: 'الإبقاء على المبني للمجهول: «أُبعِد عنك»'
  alternative: «ابتعد عنك» أو «أبعده الله عنك»
  rationale: صياغة بولس لا تعيّن الفاعل؛ وقد تلمّح برفق إلى العناية الإلهية من غير التصريح بها، وفي الوقت نفسه تتجنب إسناد الفعل كله مباشرة إلى أنسيمس. لذلك تُحفظ هذه المواربة والتوتر اللاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُخدم «إلى حين» في مقابلة «إلى الأبد»، وحُفظ المبني للمجهول لعدم حسم هوية الفاعل أو طبيعة التدبير.
