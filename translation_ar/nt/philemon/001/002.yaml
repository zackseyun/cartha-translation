  rationale: التعديل الضروري الوحيد في المعنى هو استبدال «رفيقنا في الجهاد» بـ«رفيقنا في الجندية» لصون الاستعارة العسكرية في συστρατιώτῃ من غير الإيحاء بأن أرخبس جندي حرفي أو فرض دلالة اصطلاحية معاصرة. كما بُسّط رسم الاسمين لملاءمة العربية الفصحى الحديثة. وتبقى قراءة «الأخت» والحاشية المطابقتان للنص اليوناني المعتمد.
