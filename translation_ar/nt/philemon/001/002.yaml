  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: ar
  text: 'وإلى أفية الأخت[a]، وإلى أرخبس رفيقنا في الجندية، وإلى الكنيسة التي في بيتك:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «أختنا» بدلًا من «الأخت».'
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: أَفْفِيَّةَ
  rationale: نقل صوتي للاسم اليوناني إلى العربية، مع ضبطه بما يساعد على النطق.
- source_word: ἀδελφῇ
  choice: الأختِ
  rationale: يحافظ على معنى الاسم وعلى أداة التعريف في النص اليوناني المعتمد، من غير إضافة ضمير «نا» غير الموجود فيه.
- source_word: Ἀρχίππῳ
  choice: أَرْخِبُّسَ
  rationale: نقل صوتي للاسم الشخصي اليوناني بصيغة عربية واضحة.
- source_word: συστρατιώτῃ
  choice: رفيقِنا في الجهاد
  rationale: ينقل صورة المشاركة في الخدمة بوصفها جهادًا، وهو تعبير عربي طبيعي وموقر، مع الاحتفاظ بضمير الجمع الوارد في ἡμῶν.
- source_word: ἐκκλησίᾳ
  choice: الكنيسةِ
  rationale: المقابل العربي الراسخ للجماعة المسيحية المجتمعة في هذا السياق الرسائلي.
- source_word: κατ’ οἶκόν σου
  choice: التي في بيتك
  rationale: صياغة عربية طبيعية تظل قريبة من العبارة اليونانية ولا تضيف صراحةً فعل «تجتمع» المستفاد من السياق.
- source_word: καὶ
  choice: وإلى
  rationale: تكرار العطف مع حرف الجر يوضح تعدد المخاطَبين ويحفظ البنية الإضافية للتحية.
theological_decisions:
- issue: هل يُضاف ضمير المتكلمين إلى «الأخت»؟
  choice: الأخت
  alternative: أختنا
  rationale: النص المقدم من SBLGNT يقرأ τῇ ἀδελφῇ بلا ἡμῶν، لذلك يتبع المتن القراءة المعتمدة ويحفظ التعريف بدل أن يضيف ضميرًا من قراءة أخرى. يُذكر البديل في الحاشية لأنه اختلاف نصي لا مسألة مذهبية.
- issue: كيفية نقل الاستعارة العسكرية في συστρατιώτῃ
  choice: رفيقنا في الجهاد
  alternative: الجندي معنا
  rationale: الصياغة المختارة تحافظ على دلالة المشاركة وعلى صورة الكفاح العسكري بصيغة عربية مألوفة، من غير أن توحي بخدمة عسكرية حرفية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. أُبقي تكرار «وإلى» لبيان سلسلة المخاطَبين، واستُعملت «التي في بيتك» من غير توسيع تفسيري إلى «التي تجتمع في بيتك».
