  naturalness: «رفيقنا في الجندية» عربية فصحى واضحة في سياق التحية، وأدق من «رفيقنا في الجهاد» التي قد تُفهم اصطلاحيًا بمعنى أوسع. وتبقى «الكنيسة التي في بيتك» طبيعية ومقتصدة.
