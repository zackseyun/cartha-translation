  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: ar
  text: لكي تصير شركةُ إيمانك فعّالةً في معرفة كل خيرٍ موجودٍ فينا لأجل المسيح[a][b][c][d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مشاركتك في الإيمان»، أو «الشراكة الناشئة عن إيمانك».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تحمل الكلمة اليونانية المترجمة «إيمان» أيضًا معنى «الأمانة» أو «الثقة» في بعض السياقات.
    reason: alternative_reading
  - marker: c
    text: تقرأ بعض المخطوطات «فيك» بدلًا من «فينا».
    reason: textual_variant
  - marker: d
    text: 'أو: «للمسيح». والكلمة اليونانية Χριστός لقب يُترجم «المسيح».'
    reason: lexical_alternative
  - marker: e
    text: يمكن فهم الخاتمة على أنها تصف «كل خيرٍ موجودٍ فينا» بوصفه لأجل المسيح.
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὅπως
  choice: لكي
  rationale: تؤدي معنى الغاية أو المقصد في صلاة بولس، بصياغة عربية طبيعية موجزة.
- source_word: κοινωνία
  choice: شركة
  rationale: تحافظ «شركة» على اتساع اللفظ بين المشاركة والاتحاد والشراكة، من غير قصره على تبليغ الإيمان للآخرين.
- source_word: πίστεώς
  choice: إيمانك
  rationale: هو المقابل الأوضح في السياق، مع إبقاء احتمال معنى الأمانة أو الثقة في الحاشية.
- source_word: ἐνεργὴς γένηται
  choice: تصير ... فعّالة
  rationale: تنقل معنى الدخول في حالة من النشاط أو التأثير، وتحافظ على صيغة الرجاء أو الغاية.
- source_word: ἐν ἐπιγνώσει
  choice: في معرفة
  rationale: تعكس حرف الجر ἐν مباشرة وتحافظ على إمكان فهم المعرفة بوصفها المجال أو الوسيلة، من غير فرض معنى «المعرفة الكاملة».
- source_word: παντὸς ἀγαθοῦ
  choice: كل خير
  rationale: صياغة عربية طبيعية للاسم المحايد، ولا تضيف تخصيصًا مثل «عطية» غير موجود في النص.
- source_word: τοῦ ἐν ἡμῖν
  choice: فينا
  rationale: يتبع النص المطبوع الذي يقرأ «فينا»، ويربط العبارة بكل خير، مع ذكر قراءة «فيك» في الحاشية.
- source_word: εἰς Χριστόν
  choice: لأجل المسيح
  rationale: تنقل اتجاه العبارة أو غايتها نحو المسيح بصياغة عربية محتملة الدلالة، من غير تفصيل زائد.
theological_decisions:
- issue: معنى κοινωνία τῆς πίστεώς σου
  choice: شركة إيمانك
  alternative: مشاركتك في الإيمان؛ أو الشراكة الناشئة عن إيمانك
  rationale: التركيب اليوناني محتمل، ولذلك اختير تركيب عربي قريب يحافظ على التوتر بين المشاركة في الإيمان والتعبير العملي عنه.
- issue: مرجع «فينا»
  choice: الإبقاء على صيغة الجمع «فينا»
  alternative: «فيك» بحسب قراءة بعض المخطوطات
  rationale: هذه هي قراءة SBLGNT، ويمكن أن تشمل بولس وفليمون وسائر المؤمنين من غير حصر الخير في شخص واحد.
- issue: تعلّق εἰς Χριστόν
  choice: إبقاء «لأجل المسيح» بعد «فينا»
  alternative: فهمها على أنها تصف الخير الكائن فينا والموجَّه إلى المسيح
  rationale: التركيب موجز وصعب، ولا ينبغي حسم تعلّقه أو نوع علاقته بالمسيح أكثر مما يسمح به اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. أُبقي تركيب «شركة إيمانك» قريبًا من اليونانية بسبب تعدد وجوهه، وشرحت البدائل في الحواشي بدل حسمها داخل المتن.
