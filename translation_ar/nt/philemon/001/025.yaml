  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «نعمة» لـ χάρις، و«الرب يسوع المسيح» للقب والاسم، و«مع روحكم» لـ μετὰ τοῦ πνεύματος ὑμῶν. وصيغة الدعاء «لتكن» إضافة عربية سليمة لتكوين جملة طبيعية من البركة اليونانية الاسمية.'
