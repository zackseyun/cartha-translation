  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: ar
  text: لِتَكُنْ نِعْمَةُ الرَّبِّ يَسُوعَ الْمَسِيحِ مَعَ رُوحِكُمْ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الضمير في «روحكم» بصيغة الجمع؛ فالبركة الختامية تشمل جماعة متلقّي الرسالة، لا فليمون وحده.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: نِعْمَة
  rationale: المقابل العربي المألوف والملائم في بركات بولس الختامية، ويدل هنا على إحسان الرب وعطيته المبارِكة.
- source_word: κυρίου
  choice: الرَّبّ
  rationale: يحفظ دلالة اللقب ووزنه المسيحاني في صيغة البركة.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يَسُوعَ الْمَسِيحِ
  rationale: «يسوع» اسم منقول، و«المسيح» هو المقابل العربي الراسخ للقب Χριστός، مع إبقاء قوة اللقب ظاهرة.
- source_word: μετὰ
  choice: مَعَ
  rationale: ينقل معنى المصاحبة مباشرة، وقد أُضيف «لِتَكُنْ» لأن العبارة اليونانية اسمية بلا فعل، ولصياغة دعاء عربي طبيعي.
- source_word: πνεύματος
  choice: رُوح
  rationale: تُرك اللفظ من غير تفسير زائد، وهو في هذا التركيب يشير على الأرجح إلى روح المخاطَبين أو باطنهم، دون فرض إحالة صريحة إلى الروح القدس.
- source_word: ὑμῶν
  choice: ـكُمْ
  rationale: صيغة الجمع العربية تُظهر مباشرة أن البركة موجَّهة إلى جماعة المخاطَبين، لا إلى فليمون وحده.
theological_decisions:
- issue: دلالة Χριστοῦ في البركة الختامية
  choice: الْمَسِيح
  alternative: المسيح بوصفه عنصرًا اسميًا ثابتًا بلا إبراز معنى اللقب
  rationale: الصياغة العربية التقليدية «يسوع المسيح» طبيعية، وفي الوقت نفسه تحتفظ «المسيح» بدلالتها اللقبية ولا تختزلها إلى لقب عائلي.
- issue: مرجع «روحكم»
  choice: روح المخاطَبين/باطنهم، مع إبقاء العبارة موجزة كما في اليونانية
  alternative: الروح القدس
  rationale: ضمير الملكية الجمع «كم» يرجّح روح المخاطَبين، لكن الترجمة لا تضيف شرحًا عقائديًا إلى المتن ولا تستبدل اللفظ بتفسير.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية مهيبة. استُخدمت صيغة الدعاء «لِتَكُنْ» لإتمام العبارة اليونانية الخالية من الفعل، وأظهرت العربية جمع المخاطَبين في «روحكم» دون حاجة إلى تعبير تفسيري داخل المتن.
