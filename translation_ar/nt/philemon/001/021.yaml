  text: πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ⸀ἃ λέγω ποιήσεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: ar
  text: وإذ أنا واثق بطاعتك، كتبتُ إليك، عالمًا أنك ستفعل أكثر مما أقول[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما يتجاوز ما أقوله». قد يلمّح بولس إلى أن فليمون سيفعل أكثر من الطلب المحدد الذي قدّمه، لكن النص لا يصرّح بكيفية ذلك.'
    reason: بديل معجمي وإيضاح للغموض المقصود
lexical_decisions:
- source_word: πεποιθὼς
  choice: وإذ أنا واثق
  rationale: اسم فاعل تام يدل على حالة راسخة من الثقة، وصياغة «وإذ أنا واثق» تحافظ على علاقته الظرفية بالفعل الرئيس بلغة عربية طبيعية.
- source_word: τῇ ὑπακοῇ σου
  choice: بطاعتك
  rationale: تحفظ معنى الطاعة والاستجابة للتوجيه، بما فيه من قوة علائقية وأخلاقية، من غير تليينه إلى مجرد المجاملة أو الاستعداد.
- source_word: ἔγραψά σοι
  choice: كتبتُ إليك
  rationale: الماضي البسيط يقابل صيغة الماضي في اليونانية بوضوح، ويصلح أيضًا في السياق الرسائلي.
- source_word: εἰδὼς
  choice: عالمًا
  rationale: يحافظ على الصيغة الحالية الظرفية التي تعبّر عن معرفة واثقة مصاحبة للكتابة.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: أكثر مما أقول
  rationale: تفيد ὑπέρ مع الموصول في حالة النصب معنى التجاوز أو الزيادة على المذكور. وهذه الصياغة طبيعية وتبقي الأمر الإضافي غير محدد.
- source_word: ποιήσεις
  choice: ستفعل
  rationale: ينقل المستقبل ودلالة ποιέω العامة، من غير تحديد الفعل الذي يتوقعه بولس.
theological_decisions:
- issue: قوة ὑπακοή في سياق التماس بولس
  choice: الطاعة
  alternative: الامتثال أو الاستعداد للاستجابة
  rationale: اللفظ اليوناني يدل صراحة على الطاعة؛ وإبقاؤه يحفظ بُعد سلطة بولس في الرسالة من غير أن يضيف إكراهًا لا يصرح به النص.
- issue: المقصود بما هو أكثر مما يقوله بولس
  choice: 'إبقاء العبارة مفتوحة: «أكثر مما أقول»'
  alternative: تحديده بتحرير أنسيمس أو بحسن استقباله فقط
  rationale: يوحي النص بأن فليمون سيتجاوز الطلب المعلن، لكنه لا يحدد كيف؛ لذلك تُصان دلالته البلاغية وتوتره التفسيري من غير حسم.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُعملت تراكيب مألوفة مثل «وإذ أنا واثق» و«عالمًا» للحفاظ على تتابع اسمي الفاعل في الأصل من غير تكلف، وأُبقيت الخاتمة عامة كما في اليونانية.
