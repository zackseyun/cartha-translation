  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: ar
  text: الَّذي كنت أودُّ أن أُبقيه عندي، لكي يخدمني نيابةً عنك في قيود الإنجيل[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «القيود من أجل الإنجيل»، أي القيود التي يتحملها بسبب الإنجيل.'
    reason: قراءة تفسيرية بديلة لعلاقة المضاف إليه في العبارة اليونانية.
lexical_decisions:
- source_word: ὃν
  choice: الَّذي
  rationale: اسم موصول مذكر مفرد في حالة النصب يعود إلى أنسيمس؛ ويُفهم موقعه الإعرابي من صلته بالفعل «أُبقيه».
- source_word: ἐβουλόμην
  choice: كنت أودُّ
  rationale: ينقل دلالة الماضي الناقص على رغبة بولس القائمة آنذاك، بصياغة عربية طبيعية من غير تحميل الزمن أكثر مما يحتمل.
- source_word: πρὸς ἐμαυτὸν
  choice: عندي
  rationale: مع «أُبقيه» تدل العبارة على الاحتفاظ بأنسيمس في صحبة بولس وقربه؛ و«عندي» عربية واضحة وموجزة.
- source_word: κατέχειν
  choice: أن أُبقيه
  rationale: يفيد هنا الاحتفاظ بأنسيمس لدى بولس، لا مجرد الإمساك به أو منعه.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ معنى الغرض الذي تدخله الأداة اليونانية.
- source_word: ὑπὲρ σοῦ
  choice: نيابةً عنك
  rationale: تبيّن أن خدمة أنسيمس لبولس تقوم مقام الخدمة التي كان يمكن لفليمون أن يقدمها، من غير تقرير معنى استبدالي صارم.
- source_word: μοι διακονῇ
  choice: يخدمني
  rationale: ينقل معنى تقديم الخدمة والمساعدة بصورة عامة وطبيعية، من غير قصره على خدمة كنسية رسمية.
- source_word: ἐν τοῖς δεσμοῖς
  choice: في قيود
  rationale: تحافظ «قيود» على الصورة الحسية في اليونانية، مع إمكان فهمها دلالةً على السجن.
- source_word: τοῦ εὐαγγελίου
  choice: الإنجيل
  rationale: إضافة «قيود» إلى «الإنجيل» تقابل صيغة المضاف إليه اليونانية وتحفظ إيجازها واحتمالها الدلالي، بدل حسم العلاقة بأنها سببية في المتن.
theological_decisions:
- issue: دلالة τοῦ εὐαγγελίου مع δεσμοῖς
  choice: قيود الإنجيل
  alternative: القيود من أجل الإنجيل
  rationale: تُبقي الصياغة الرئيسة علاقة الإضافة اليونانية على إيجازها، إذ قد تصف القيود بارتباطها بالإنجيل أو تشير إلى أن الإنجيل سببها؛ وتوضح الحاشية القراءة السببية الممكنة من غير فرضها على المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ ترتيب الفكرة اليونانية قدر الإمكان، مع استعمال «عندي» و«يخدمني» لطبيعيتهما في العربية، والإبقاء على العبارة المكثفة «قيود الإنجيل» مع حاشية تشرح احتمالها السببي.
