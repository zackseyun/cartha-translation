  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: ar
  text: نعم، يا أخي، ليكن لي منك نفع في الرب[a]؛ أَرِحْ قلبي[b] في المسيح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ليكن لي منك فرح». ولعل بولس يلمّح إلى اسم أنسيمس وإلى معنى النفع والفائدة المرتبط به.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «أحشائي»، وهو تعبير عن أعماق العاطفة أو الكيان الباطن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: نعم
  rationale: تفيد التصديق وتستهل طلب بولس بحرارة، وهي المقابل العربي المباشر الطبيعي.
- source_word: ἀδελφέ
  choice: يا أخي
  rationale: نداء مفرد موجَّه إلى فليمون بوصفه أخًا في الإيمان.
- source_word: ἐγώ σου ὀναίμην
  choice: دعني أنتفع بك
  rationale: يحافظ على معنى الانتفاع أو نيل الفائدة وعلى صيغة الالتماس، وقد يتضمن تلاعبًا لفظيًّا باسم أنسيمس المرتبط بفكرة النفع.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحفظ التعبير البولسي الذي يجعل هذا الانتفاع واقعًا في نطاق العلاقة بالرب.
- source_word: ἀνάπαυσόν
  choice: أَرِحْ
  rationale: أمر مباشر بطلب منح الراحة والانتعاش الداخلي، ويربط العبارة بما سبق في الآية 7.
- source_word: μου τὰ σπλάγχνα
  choice: قلبي
  rationale: اللفظ يعني حرفيًّا الأحشاء، لكنه يُستعمل للدلالة على أعماق العاطفة والكيان الباطن؛ و«قلبي» هو التعبير العربي الطبيعي هنا.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، والعبارة تحدد نطاق الشركة والعمل المسيحيين.
theological_decisions:
- issue: دلالة κυρίῳ
  choice: الرب
  alternative: السيد
  rationale: «الرب» يحفظ اللقب المألوف في الاستعمال البولسي ولا يضيّق العبارة إلى علاقة السيد بالعبد.
- issue: دلالة Χριστῷ
  choice: المسيح
  alternative: المسيح الممسوح
  rationale: «المسيح» هو اللقب العربي الطبيعي والراسخ، ويحفظ دلالة Χριστός اللقبية من غير شرح زائد داخل المتن.
translation_notes:
  register: صياغة عربية فصحى واضحة وكريمة، تحافظ على حرارة النداء وصراحة الطلب. اختير «دعني أنتفع بك» لإبقاء الصلة اللفظية المحتملة باسم أنسيمس، مع بيان البدائل في الحاشية، ورُوعي التوازي مع معنى الراحة في سياق الرسالة.
