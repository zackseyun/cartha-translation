  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: ar
  text: 'لأن فيه خُلِقَت جميع الأشياء: ما في السماوات وما على الأرض، ما يُرى وما لا يُرى، سواء أكانت عروشًا أم سيادات أم رئاسات أم سلطات؛ جميع الأشياء قد خُلِقَت به وله.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وإليه»؛ فالعبارة اليونانية تفيد أن الخلق يتجه إليه بوصفه غايته.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تفيد الأداة هنا التعليل لما سبق، و«لأن» تؤدي قوتها السببية بوضوح في العربية.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: تحافظ «فيه» على دلالة ἐν المتميزة من δι’ αὐτοῦ لاحقًا، بدل اختزال العبارتين كلتيهما في معنى الوساطة.
- source_word: ἐκτίσθη / ἔκτισται
  choice: خُلِقَت / قد خُلِقَت
  rationale: صيغتان للمبني للمجهول؛ روعي الفرق بين الماضي في الأولى والتام ذي النتيجة المستمرة في الثانية بإضافة «قد».
- source_word: τὰ πάντα
  choice: جميع الأشياء
  rationale: تعبير شامل وواضح يحفظ عموم الأصل دون توسيعه إلى تفسير مثل «الكون كله».
- source_word: ἐν τοῖς οὐρανοῖς καὶ ἐπὶ τῆς γῆς
  choice: ما في السماوات وما على الأرض
  rationale: حُفظ جمع «السماوات» والتقابل المكاني مع الأرض، وأضيفت «ما» لتأتي العبارة طبيعية بوصفها بيانًا لجميع الأشياء.
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: ما يُرى وما لا يُرى
  rationale: صياغة عربية طبيعية ودقيقة للتقابل بين المرئي وغير المرئي.
- source_word: θρόνοι
  choice: عروش
  rationale: مقابل مباشر يحفظ الصورة الأصلية واحتمال دلالتها على مراتب من السلطان.
- source_word: κυριότητες
  choice: سيادات
  rationale: تحفظ معنى السيادة أو الربوبية بوصفها فئة من القوى، من غير تفسير ماهيتها تفسيرًا زائدًا.
- source_word: ἀρχαὶ
  choice: رئاسات
  rationale: مصطلح عربي مفهوم نسبيًا يميز هذه الفئة من «السلطات»، ويحفظ معنى الرتبة أو الحكم.
- source_word: ἐξουσίαι
  choice: سلطات
  rationale: مقابل مباشر يدل على أصحاب السلطان أو مراتب السلطة مع إبقاء طبيعتها غير محددة.
- source_word: δι’ αὐτοῦ καὶ εἰς αὐτόν
  choice: به وله
  rationale: «به» تعبّر عن الوساطة، و«له» تعبّر طبيعيًا عن كونه غاية الخلق؛ وتوضح الحاشية البديل الأقرب حرفيًا للعبارة الأخيرة.
theological_decisions:
- issue: علاقة الابن بالخليقة في ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν
  choice: فيه ... به ... له
  alternative: به ... على يده ... إليه
  rationale: 'يحفظ الاختلاف المقصود بين حروف الجر: المجال أو الارتباط، ثم الوساطة، ثم الغاية، من غير دمجها في عبارة تفسيرية واحدة.'
- issue: ماهية العروش والسيادات والرئاسات والسلطات
  choice: إبقاء أسماء مراتب السلطان عامة
  alternative: تحديدها صراحة بأنها رتب ملائكية أو أنظمة سياسية بشرية
  rationale: السياق يدرجها ضمن الخليقة المرئية وغير المرئية، لكنه لا يحصر هويتها هنا؛ لذلك لا ينبغي إضافة تحديد عقائدي لا ينص عليه العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت الجملة الواحدة ببنية متوازنة، واستُعملت النقطتان لبيان تفصيل «جميع الأشياء»، والفاصلة المنقوطة للفصل بين قسمي القول. وُضعت علامة الحاشية [a] في المتن.
