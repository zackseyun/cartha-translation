lexical_decisions:
- source_word: ἀκούσαντες
  choice: إذ سمعنا
  rationale: اسم الفاعل اليوناني في صيغة الماضي يرتبط بفاعل الآية السابقة ويبيّن ما كان أساس الشكر؛ و«إذ سمعنا» تحافظ على هذا الارتباط بصورة عربية طبيعية.
- source_word: πίστιν
  choice: إيمانكم
  rationale: «الإيمان» هو المقابل الأساسي الواضح هنا، مع إبقاء احتمالي «الثقة» و«الأمانة» في الحاشية لأن اللفظة اليونانية قد تدل على هذه المعاني المتقاربة.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: تحافظ «في» على الصياغة المكانية/العلاقية المميزة عند بولس بدل تحويلها إلى مجرد اتجاه، وتترجم Χριστός بوصفه لقبًا إلى «المسيح».
- source_word: ἀγάπην
  choice: المحبة
  rationale: مقابل عربي مألوف ودقيق لـἀγάπη في هذا السياق.
- source_word: ἣν ἔχετε
  choice: التي تحملونها
  rationale: تُثبت جملة الصلة الموجودة في النص اليوناني، وتؤدي معنى الامتلاك القائم بعبارة عربية طبيعية دون إضعاف دلالة ممارسة المحبة.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: لجميع القديسين
  rationale: اللام تؤدي بصورة عربية طبيعية اتجاه المحبة نحو جميع المؤمنين، و«القديسين» تحافظ على مصطلح بولس المعتاد.
theological_decisions:
- issue: ترجمة Χριστῷ بوصفه لقبًا أو صيغة شبيهة بالاسم
  choice: المسيح يسوع
  alternative: كريستوس يسوع
  rationale: Χριστός لقب ذو معنى («الممسوح») مقترن بالاسم الشخصي يسوع؛ و«المسيح يسوع» هو التعبير العربي الواضح والمستقر الذي يحفظ قوة اللقب.
- issue: الدلالة المحتملة لكلمة πίστις
  choice: إيمانكم
  alternative: ثقتكم أو أمانتكم
  rationale: السياق يصف استجابة أهل كولوسي في علاقتهم بالمسيح يسوع، ولذلك يلائم «الإيمان» المتن، مع عدم حسم المجال الدلالي الواسع للكلمة وإثبات البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رسائلية رصينة. أبقيت الجملة مفتوحة بفاصلة لأنها جزء نحوي تابع لما قبلها، واستُعملت «تحملونها» لتجنب تركيب جامد مع الحفاظ على جملة الصلة.
