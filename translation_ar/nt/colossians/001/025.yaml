  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: ar
  text: التي صرتُ أنا خادمًا لها، بحسب التدبير الذي من الله، المعطى لي لأجلكم، لأتمّم كلمة الله[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأعلن كلمة الله إعلانًا كاملًا»، أو: «لأكمل كلمة الله».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: التي ... لها
  rationale: ضمير موصول مؤنث مفرد يعود إلى «الكنيسة» في الآية السابقة؛ وتُظهر «لها» تعلق الخدمة بها بوضوح.
- source_word: ἐγενόμην ἐγὼ διάκονος
  choice: صرتُ أنا خادمًا
  rationale: يحفظ معنى الدخول في دور الخدمة، مع إبراز الضمير ἐγώ من غير تحميل διάκονος معنى منصب كنسي لاحق.
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ
  choice: بحسب التدبير الذي من الله
  rationale: «التدبير» يؤدي معنى المسؤولية أو المهمة الموكلة، و«من الله» يحفظ احتمال دلالة الإضافة على المصدر دون حصرها في صياغة تفسيرية.
- source_word: τὴν δοθεῖσάν μοι εἰς ὑμᾶς
  choice: المعطى لي لأجلكم
  rationale: يربط اسم المفعول بـ«التدبير»، ويعبّر عن كون أهل كولوسي المستفيدين والمقصودين بهذه المهمة.
- source_word: πληρῶσαι
  choice: لأتمّم
  rationale: يحفظ اتساع دلالة الفعل بين الإتمام، والتحقيق، والإبلاغ الكامل، بدل حصر المعنى في تفسير واحد.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: كلمة الله
  rationale: صياغة عربية راسخة تحفظ دلالة رسالة الله وصداها الكتابي.
theological_decisions:
- issue: دلالة πληρῶσαι τὸν λόγον τοῦ θεοῦ
  choice: لأتمّم كلمة الله
  alternative: 'لأعلن كلمة الله إعلانًا كاملًا؛ أو: لأكمل كلمة الله'
  rationale: النص قد يشير إلى تنفيذ كلمة الله أو إتمام خدمتها بإعلانها كاملًا. أبقت الصياغة الرئيسة هذا التوتر الدلالي، وأثبتت القراءات الأوضح تفسيريًا في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «التدبير» للمحافظة على استعارة المسؤولية الموكلة، مع ترتيب عربي طبيعي نسبيًا، وأُثبتت علامة الحاشية في المتن.
