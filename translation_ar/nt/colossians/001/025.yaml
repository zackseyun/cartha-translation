  source_fidelity: 'النص العربي يطابق اليونانية بدقة مناسبة: يعود «التي ... لها» إلى الكنيسة المؤنثة في الآية السابقة، و«صرتُ أنا خادمًا» يعكس ἐγενόμην ἐγὼ διάκονος دون افتراض منصب كنسي لاحق. كما أن «بحسب التدبير الذي من الله، المعطى لي لأجلكم» يحافظ على علاقة التدبير بالله وعلى كونه معطًى لبولس لفائدة المخاطَبين. و«لأتمّم كلمة الله» يحفظ اتساع πληρῶσαι دون ترجيح تفسير محدد.'
