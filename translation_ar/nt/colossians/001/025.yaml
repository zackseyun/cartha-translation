  terminology: «خادم»، و«التدبير»، و«كلمة الله» اختيارات سليمة ومناسبة للسجل العربي الحديث. لا تفرض «التدبير» تفسيرًا مذهبيًا، وتحفظ معنى المسؤولية/الإدارة الموكلة. الحاشية تعرض البدائل التفسيرية اللازمة لمعنى πληρῶσαι.
