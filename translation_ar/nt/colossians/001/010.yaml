lexical_decisions:
- source_word: περιπατῆσαι
  choice: تسلكوا
  rationale: يحفظ الاستعارة البولسية الشائعة التي تعبّر بالسلوك عن طريقة الحياة، وهو تعبير عربي كتابي واضح وطبيعي.
- source_word: ἀξίως τοῦ κυρίου
  choice: كما يليق بالرب
  rationale: ينقل معنى السلوك على نحو جدير بالرب بصياغة عربية طبيعية، من غير أن يوحي بأن الأشخاص مستحقون للرب في ذواتهم.
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: مرضيين له في كل شيء
  rationale: العبارة اليونانية تفيد التوجه إلى إرضاء كامل أو شامل، والضمير يعود بحسب السياق إلى الرب مع أنه غير مصرح به في الأصل؛ وقد نُبّه إلى ذلك في الحاشية.
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες
  choice: مثمرين في كل عمل صالح
  rationale: يحفظ صورة الإثمار وصيغة التوزيع في «كل عمل صالح»، ويربط الحال بالسلوك المقصود.
- source_word: αὐξανόμενοι τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: نامين في معرفة الله
  rationale: يأخذ الداتيف على أنه مجال النمو، ويحفظ التوازي مع «مثمرين» والصورة العضوية للفعل.
theological_decisions:
- issue: المفعول الضمني في ἀρεσκείαν
  choice: إظهار المرجع السياقي بعبارة «مرضيين له في كل شيء» مع حاشية تبين أن الضمير غير مذكور صراحة في اليونانية.
  alternative: «إلى كل إرضاء» أو «لكل مرضاة» من غير ضمير.
  rationale: الإبقاء الحرفي على التجريد غير طبيعي وملتبس في العربية، بينما السياق يجعل الرب المرجع الواضح؛ والحاشية تصون عدم التصريح في الأصل.
- issue: دلالة ἐπίγνωσις
  choice: «معرفة» في المتن.
  alternative: «المعرفة التامة» أو «المعرفة الأعمق».
  rationale: قد تحمل الكلمة معنى المعرفة الأتم أو الأعمق، لكن السياق لا يوجب تحويل هذا الظل الدلالي إلى تمييز اصطلاحي؛ لذلك يُحفظ في الحاشية.
- issue: وظيفة الداتيف τῇ ἐπιγνώσει
  choice: 'اعتباره دالًا على مجال النمو: «في معرفة الله».'
  alternative: 'اعتباره وسيلة: «بمعرفة الله».'
  rationale: كلا الوجهين ممكن نحويًا، لكن معنى المجال ينسجم مباشرة مع فعل النمو ومع الصياغة السابقة في السياق، من غير إلغاء البديل.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «تسلكوا» للحفاظ على الاستعارة الأصلية، و«كما يليق بالرب» لتجنب تركيب حرفي متكلف. صيغتا الحال «مثمرين» و«نامين» تحفظان التوازي النحوي في اليونانية.
