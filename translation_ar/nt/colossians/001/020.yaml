  source_fidelity: 'المعنى الأساسي منقول بأمانة: المصالحة الشاملة تتم «به»، ومرجع «نفسه» يحافظ على القراءة السياقية التي يكون فيها الله هو الفاعل الضمني، كما حُفظت عبارتا «دم صليبه» و«السماوات» بالجمع. لكن «صانعًا السلام» لا يعكس بوضوح كون اسم الفاعل اليوناني بصيغة الماضي (aorist) سابقًا/ممهِّدًا لفعل المصالحة، والأفضل صياغة عربية صريحة وطبيعية.'
