source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: ar
  text: وأن يصالح به[a] كلَّ الأشياء[b] مع نفسه، بعد أن صنع السلام بدم صليبه — به[c] — سواء ما على الأرض أم ما في السماوات[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يجوز أيضًا ترجمة «به» في الموضعين بـ«بواسطته».
    reason: lexical_alternative
  - marker: b
    text: 'تُركت عبارة «كل الأشياء» على سعتها، وفقًا لليونانية ولما يليها: «ما على الأرض... ما في السماوات». ولا تحدد الآية نفسها كيفية ارتباط هذه المصالحة بالخلاص النهائي.'
    reason: alternative_reading
  - marker: c
    text: تحذف بعض المخطوطات عبارة «به» الثانية.
    reason: textual_variant
  - marker: d
    text: «السماوات» في اليونانية بصيغة الجمع.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: به
  rationale: تفيد διά مع المضاف إليه الوسيلة أو الوكالة. و«به» عربية طبيعية موجزة، وتحفظ دور الابن وسيطًا في المصالحة.
- source_word: ἀποκαταλλάξαι
  choice: أن يصالح
  rationale: ينقل معنى إعادة العلاقة إلى الوفاق من غير تحميل السابقة ἀπο- معنى تكثيفيًا غير محسوم مثل «مصالحة تامة».
- source_word: τὰ πάντα
  choice: كلَّ الأشياء
  rationale: يحفظ شمول الجمع اليوناني المحايد وصلته بسياق الخلق في الآيات السابقة، من غير حصره في البشر أو تفسيره بأنه خلاص نهائي شامل.
- source_word: εἰς αὐτόν
  choice: مع نفسه
  rationale: الفعل العربي «صالح» يجري طبيعيًا مع «مع»، و«نفسه» توضح العلاقة الانعكاسية التي يرجحها السياق، حيث الله يصالح الأشياء مع نفسه بالابن.
- source_word: εἰρηνοποιήσας
  choice: صانعًا السلام
  rationale: اسم الفاعل المنصوب يحفظ ارتباط العبارة بالفعل السابق، ويترك المجال للدلالة الحالية أو الوسيلية للمشاركة اليونانية من غير تحويلها إلى جملة مستقلة.
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: بدم صليبه
  rationale: يحفظ «الدم» و«الصليب» بصورتهما الملموسة والتاريخية، وتفيد الباء وسيلة صنع السلام كما تفيد διά.
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: به
  rationale: أُبقي التكرار المحفوظ بين قوسين في النص النقدي، ووُضع بين شرطتين لإظهار نبرته الاستئنافية التوكيدية.
- source_word: εἴτε ... εἴτε
  choice: سواء ... أم
  rationale: صياغة عربية فصيحة وطبيعية تنقل التقابل الجامع بين المجالين.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: ما على الأرض
  rationale: «ما» مناسبة للجمع المحايد، و«الأرض» تلائم المقابلة الكونية مع السماوات.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: ما في السماوات
  rationale: يحفظ جمع οὐρανοῖς والتعبير الكوني الكتابي بدل تسويته إلى المفرد.
theological_decisions:
- issue: نطاق المصالحة في τὰ πάντα
  choice: «كل الأشياء» بمدلولها الواسع، من غير تضييقها أو مساواتها صراحة بالخلاص النهائي الشامل.
  alternative: «كل الناس» أو «الكون كله خلاصًا»
  rationale: النص يشرح النطاق بذكر ما على الأرض وما في السماوات، لكنه لا يحدد في هذه الآية كيفية ارتباط المصالحة بالمصير الخلاصي النهائي للكائنات الشخصية؛ لذلك تُحفظ سعة العبارة والتوتر اللاهوتي.
- issue: مرجع εἰς αὐτόν
  choice: «مع نفسه»، على أن الله هو الذي يصالح الأشياء مع نفسه بالابن.
  alternative: أن المسيح يصالح كل الأشياء مع نفسه
  rationale: الأقرب نحويًا في امتداد العبارة من الآية 19 أن الفاعل الضمني هو الله، مع بقاء الابن وسيط المصالحة. والصياغة الانعكاسية مطلوبة في العربية لسلامة المعنى.
- issue: دلالة «دم صليبه»
  choice: الإبقاء على لغة الدم والصليب حرفيًا.
  alternative: «بموته على الصليب»
  rationale: الأصل يذكر الدم والصليب كليهما؛ والإبقاء عليهما يحفظ القوة الذبائحية والتاريخية من غير فرض نظرية مخصوصة للكفارة.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «كل الأشياء» بدل «كل شيء» لإبراز المقابلة مع مجموعتي الأشياء الأرضية والسماوية، وحُفظ تكرار «به» والعدد الجمعي في «السماوات». وُزعت علامات الحواشي في مواضعها المباشرة في المتن.
