  text: καὶ ὑμᾶς ποτε ὄντας ἀπηλλοτριωμένους καὶ ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς—
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: ar
  text: وأنتم، الذين كنتم قبلاً مغتربين ومعادين في أذهانكم، في أعمالكم الشريرة[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'العبارة اليونانية موجزة، ويمكن أيضًا ترجمتها: «معادين في أذهانكم، عاملين أعمالًا شريرة». ولا يحدد التركيب صراحةً هل الأعمال الشريرة مجال العداوة أم مظهرها أم سببها.'
    reason: بيان غموض العلاقة النحوية بين العداوة والأعمال الشريرة وتقديم صياغة عربية بديلة.
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: وأنتم أيضًا
  rationale: يحفظ عطف المخاطَبين على السياق السابق وإدخالهم في الكلام عن مصالحة المسيح.
- source_word: ποτε ὄντας
  choice: إذ كنتم قبلاً
  rationale: ينقل الحال الماضية بصياغة عربية طبيعية، مع إبقاء المقابلة الضمنية بحالتهم الحاضرة.
- source_word: ἀπηλλοτριωμένους
  choice: منفصلين
  rationale: يدل اسم المفعول اليوناني على حالة من الانفصال والاغتراب العلاقي؛ و«منفصلين» أوضح للقارئ العربي المعاصر من «مغتربين» التي قد تُفهم جغرافيًا.
- source_word: ἐχθροὺς
  choice: معادين
  rationale: ينقل معنى العداوة بصيغة وصفية تلائم ارتباطها بما في الفكر، من غير أن يضيف مفعولًا غير مصرّح به في هذه العبارة.
- source_word: τῇ διανοίᾳ
  choice: في أفكاركم
  rationale: يفيد المجال أو الجهة التي تقوم فيها العداوة، و«أفكاركم» تعبير عربي واضح عن التوجه الذهني الداخلي.
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: في أعمالكم الشريرة
  rationale: يحافظ على حرف الجر وبنية اليونانية الموجزة، فلا يحسم هل الأعمال مجال العداوة أو مظهرها أو ذات صلة سببية بها.
- source_word: ἔργοις
  choice: أعمال
  rationale: مقابل عربي طبيعي وشامل للأفعال والممارسات.
- source_word: πονηροῖς
  choice: الشريرة
  rationale: ينقل الحكم الأخلاقي المباشر في الصفة اليونانية بوضوح ومن دون تهويل.
theological_decisions:
- issue: علاقة العداوة الداخلية بالأعمال الشريرة
  choice: 'الإبقاء على الصياغة الموجزة: «معادين في أفكاركم، في أعمالكم الشريرة»'
  alternative: «معادين في أفكاركم، عاملين أعمالًا شريرة»
  rationale: التركيب اليوناني لا يحدد صراحةً هل الأعمال سبب العداوة أم مجالها أم مظهرها؛ لذلك لا تُضاف علاقة سببية أو تفسيرية قاطعة.
- issue: متعلَّق الانفصال والعداوة
  choice: عدم إضافة «عن الله» أو «لله» في نص الآية
  alternative: «منفصلين عن الله ومعادين له»
  rationale: السياق اللاهوتي يدل على الله، لكن العبارة اليونانية هنا لا تذكر المتعلَّق صراحةً؛ فتركه ضمنيًا يحفظ اقتصاد النص واتصاله بما يليه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «منفصلين» بدل «مغتربين» لتجنب المعنى الجغرافي الشائع، وأُبقيت غرابة خفيفة في العبارة الأخيرة حفاظًا على إيجاز الأصل وغموض علاقته النحوية. تنتهي الآية بشرطة طويلة لأنها جزء من جملة تستمر في الآية التالية.
