base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: ar
  text: أمّا الآن فقد صولحتم في جسده البشري بالموت[a]، ليقدّمكم أمامه قديسين وبلا عيب وبلا لوم[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فقد صالحكم». الفعل اليوناني مبني للمجهول.'
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا ترجمة «بلا عيب» بـ«بلا عاهة»، بما يحفظ الإيحاء بلغة الذبائح الخالية من العيب. وتحمل «بلا لوم» أيضًا معنى عدم إمكان توجيه اتهام.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: أمّا الآن
  rationale: تُبرز المقابلة بين حالهم السابقة في الآية 21 وحالهم الحاضرة، بصياغة عربية فصيحة وطبيعية.
- source_word: ἀποκατηλλάγητε
  choice: فقد صالحكم
  rationale: الفعل اليوناني مبني للمجهول، لكن السياق يتيح التعبير العربي بالمعلوم مع فاعل مستتر عائد إلى المذكور في السياق؛ وتوضح الحاشية الصيغة اليونانية.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: في جسد بشريته
  rationale: تنقل العبارة معنى الجسد المادي البشري الحقيقي، وتتجنب الإيحاء بأن σάρξ تعني الطبيعة الخاطئة هنا.
- source_word: διὰ τοῦ θανάτου
  choice: بالموت
  rationale: صياغة عربية موجزة تنقل معنى الوسيلة في διά مع المضاف إليه.
- source_word: παραστῆσαι
  choice: ليُحضركم أمامه
  rationale: تنقل غرض المصالحة وصورة الوقوف في حضرته، بصورة أوضح في العربية من الاستعمال الحرفي الجامد «ليقدّمكم».
- source_word: ἁγίους
  choice: قديسين
  rationale: تحافظ على معنى القداسة والتكريس في وصف المخاطَبين.
- source_word: ἀμώμους
  choice: بلا عيب
  rationale: تحفظ الدلالة الأخلاقية، كما تُبقي الصلة الممكنة بلغة الذبيحة الخالية من العيب.
- source_word: ἀνεγκλήτους
  choice: ولا موضع لاتّهام
  rationale: 'تُظهر الدلالة القضائية: عدم وجود تهمة يمكن إقامتها عليهم، مع عربية مفهومة وطبيعية.'
- source_word: κατενώπιον αὐτοῦ
  choice: أمامه
  rationale: تحافظ على مرجع الضمير كما هو من غير الجزم في المتن أهو الله أم المسيح.
theological_decisions:
- issue: جهة الفعل في ἀποκατηλλάγητε المبني للمجهول
  choice: 'صياغته بالمعلوم: «فقد صالحكم»، مع حاشية تبين المبني للمجهول'
  alternative: «فقد صولحتم»
  rationale: المعلوم طبيعي في العربية ويسنده السياق، لكن الحاشية تحفظ الغموض النحوي الأصيل ولا تجعل تعيين الفاعل جزءًا صريحًا من النص اليوناني.
- issue: دلالة σάρξ في العبارة
  choice: «بشرية» بمعنى الجسد البشري المادي
  alternative: «الجسد» حرفيًا أو «الطبيعة الخاطئة» مجازيًا
  rationale: السياق يتحدث عن الجسد الذي وقع به الموت، فلا يسوغ إدخال مفهوم «الطبيعة الخاطئة».
- issue: تمييز ἀμώμους عن ἀνεγκλήτους
  choice: «بلا عيب ولا موضع لاتّهام»
  alternative: «بلا لوم ولا ملامة»
  rationale: يحفظ الاختيار فرقًا بين صورة الخلو من العيب والدلالة القضائية المتعلقة بالاتهام، بدل تسطيحهما إلى مترادفين.
- issue: مرجع الضمير في κατενώπιον αὐτοῦ
  choice: الإبقاء على «أمامه» من غير تفسير
  alternative: تعيينه بقول «أمام الله» أو «أمام المسيح»
  rationale: الضمير اليوناني لا يسمّي مرجعه في هذه الجملة، ولذلك تُحفظ إمكانية الإحالة كما هي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «جسد بشريته» لتأكيد التجسد المادي من غير تركيب حرفي ثقيل، وحُفظت النبرة القضائية في «لا موضع لاتّهام». تظهر علامتا الحاشيتين في المتن.
