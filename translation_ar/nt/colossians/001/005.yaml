  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διὰ τὴν ἐλπίδα τὴν ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς, ἣν προηκούσατε ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/005.yaml
  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: ar
  text: بسبب الرجاء المُدَّخر لكم في السماوات[a]، الذي سبق أن سمعتم به[b] في كلمة الحق[c]، أي البشارة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «في السماء». وردت الكلمة في اليونانية بصيغة الجمع: «السماوات».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «الذي كنتم قد سمعتم به من قبل» أو «الذي سمعتم به مسبقًا».'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن ترجمة «كلمة الحق» أيضًا: «رسالة الحق»؛ و«البشارة» بيان يحدد تلك الكلمة أو الرسالة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: بسبب الرجاء
  rationale: تفيد διά مع النصب السبب أو الأساس هنا، و«الرجاء» هو المقابل العربي المباشر لـἐλπίς مع إبقاء معناه الموضوعي في السياق دون اختزاله في مجرد التفاؤل.
- source_word: ἀποκειμένην
  choice: المُدَّخر
  rationale: ينقل معنى الشيء الموضوع جانبًا والمحفوظ للمستقبل، ويحافظ على صورة الادخار بأسلوب عربي طبيعي.
- source_word: ὑμῖν
  choice: لكم
  rationale: تعبر اللام عن جهة المنفعة أو التخصيص، كما أن صيغة الجمع في العربية تطابق الضمير اليوناني.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: في السماوات
  rationale: يحافظ الجمع على صيغة النص اليوناني، مع الإشارة في الحاشية إلى البديل العربي الشائع بالمفرد.
- source_word: ἣν
  choice: الذي
  rationale: يعود الاسم الموصول على «الرجاء» بحسب المطابقة النحوية في اليونانية؛ وجاء مذكرًا في العربية لمطابقة «الرجاء».
- source_word: προηκούσατε
  choice: سبق أن سمعتم به
  rationale: ينقل دلالة السماع السابق في الفعل المركب προακούω، وتلائم الباء في العربية سماعهم عن الرجاء المذكور.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: في كلمة الحق
  rationale: يحافظ على تركيب λόγος وἀλήθεια القريب من الأصل، مع بيان احتمال معنى «رسالة الحق» في الحاشية.
- source_word: τοῦ εὐαγγελίου
  choice: أي البشارة
  rationale: فُهم المضاف إليه على أنه بدل بياني يحدد «كلمة الحق». و«البشارة» عربية واضحة تنقل معنى εὐαγγέλιον دون الاعتماد على مصطلح كنسي خاص.
theological_decisions:
- issue: مرجع الاسم الموصول ἣν
  choice: إرجاع «الذي» إلى «الرجاء»
  alternative: إرجاع العبارة على نحو أوسع إلى مضمون البشارة كله
  rationale: الضمير اليوناني مؤنث مفرد ويطابق ἐλπίδα مباشرة؛ لذا يحفظ النص العربي الصلة النحوية ولا يوسع المرجع بلا ضرورة.
- issue: دلالة τοῦ εὐαγγελίου
  choice: اعتبار «البشارة» بيانًا لـ«كلمة الحق»
  alternative: اعتبارها مضافًا إليه بمعنى «كلمة حق البشارة»
  rationale: البدل البياني هو الأرجح سياقيًا ويعطي تركيبًا عربيًا واضحًا، مع إبقاء تحديد الرسالة بأنها البشارة نفسها.
- issue: صيغة οὐρανοῖς
  choice: السماوات بالجمع
  alternative: السماء بالمفرد
  rationale: اختير الجمع اتباعًا لصيغة المصدر، من غير بناء تصور لاهوتي تفصيلي على العدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت بنية الجملة بوصفها تعليلًا متصلًا بما قبلها، واستُخدمت «المُدَّخر» لصون صورة النص، مع حواشٍ موجزة للبدائل الحقيقية دون حسم زائد.
