lexical_decisions:
- source_word: καθὼς
  choice: كما
  rationale: تحفظ أداة الربط والمقابلة مع الكلام السابق بصياغة عربية طبيعية.
- source_word: ἐμάθετε ἀπὸ
  choice: تعلَّمتم من
  rationale: ينقل الفعل الماضي ومصدر تلقّيهم للبشارة من غير إضافة مفعول غير مصرَّح به في اليونانية.
- source_word: Ἐπαφρᾶ
  choice: أبفراس
  rationale: نقل صوتي للاسم وفق الصيغة العربية الكتابية الشائعة.
- source_word: τοῦ ἀγαπητοῦ συνδούλου ἡμῶν
  choice: شريكنا المحبوب في العبودية
  rationale: يحفظ معنى المشاركة تحت سيادة سيد واحد الكامن في σύνδουλος، ولا يخفف صورة العبودية إلى مجرد الخدمة.
- source_word: πιστὸς
  choice: أمين
  rationale: يعبّر هنا عن الثبات والجدارة بالثقة في أداء الخدمة.
- source_word: διάκονος
  choice: خادم
  rationale: يدل في السياق على من يقوم بخدمة المسيح، من غير افتراض منصب كنسي تقني.
- source_word: τοῦ Χριστοῦ
  choice: للمسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός ويحفظ دلالته اللقبية.
- source_word: ὑπὲρ ἡμῶν
  choice: نيابةً عنا
  rationale: يبرز معنى التمثيل أو العمل بالنيابة الذي يحتمله ὑπέρ مع المضاف إليه، مع توثيق احتمال «لأجلنا» والقراءة النصية الأخرى في الحاشية.
theological_decisions:
- issue: صورة العبودية في σύνδουλος
  choice: شريكنا المحبوب في العبودية
  alternative: رفيقنا المحبوب في الخدمة
  rationale: الاختيار يثبت علاقة الانتماء المشترك إلى سيد واحد ولا يحوّل اللفظ إلى مجرد زمالة في عمل تطوعي، مع شرح الصورة في الحاشية.
- issue: دلالة Χριστός
  choice: المسيح
  alternative: كريستوس
  rationale: المسيح ترجمة عربية راسخة لمعنى اللقب اليوناني، لا مجرد نقل صوتي له.
- issue: دلالة ὑπὲρ ἡμῶν والاختلاف النصي في الضمير
  choice: نيابةً عنا
  alternative: 'لأجلنا؛ وفي قراءة مخطوطية: نيابةً عنكم'
  rationale: يتبع النص المثبت في SBLGNT بضمير المتكلمين ويحافظ على دلالة النيابة الممكنة، من غير إخفاء المرونة الدلالية أو القراءة المخطوطية المهمة.
translation_notes:
  register: صياغة عربية فصحى حديثة وواضحة، تحافظ على وقار النص وعلى صورة العبودية الأصلية دون استعمال تعبير غامض مثل «العبد معنا». وُضعت علامات الحواشي في مواضعها داخل المتن، ووُثِّقت القراءتان المخطوطيتان اللتان تشير إليهما علامات SBLGNT.
