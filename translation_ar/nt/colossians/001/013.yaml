id: COL.1.13
reference: Colossians 1:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: ar
  text: الذي أنقذنا من سلطان الظلمة، ونقلنا إلى ملكوت ابن محبته،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ابنه المحبوب»، أو: «الابن الذي يحبه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρύσατο
  choice: أنقذنا
  rationale: يفيد الفعل إنقاذًا حاسمًا من خطر أو قوة معادية، و«أنقذ» تعبير عربي واضح وطبيعي يحفظ هذا المعنى.
- source_word: ἐξουσίας
  choice: سلطان
  rationale: يدل اللفظ على السلطة أو القوة الحاكمة. و«سلطان» يلائم المقابلة بين حكم الظلمة وملكوت الابن، من غير تحويله صراحة إلى معنى «النطاق».
- source_word: σκότους
  choice: الظلمة
  rationale: ترجمة مباشرة تحفظ الإيحاءات الأخلاقية والروحية في السياق من غير شرح زائد.
- source_word: μετέστησεν
  choice: نقلنا
  rationale: يفيد الانتقال من موضع أو حال أو سلطان إلى آخر؛ و«نقلنا» عربي طبيعي ويحفظ صورة الانتقال إلى الملكوت.
- source_word: βασιλείαν
  choice: ملكوت
  rationale: ينقل معنى المملكة أو الحكم، وهو التعبير الكتابي العربي المألوف هنا، ويلائم دخول المحكومين في دائرة حكم الابن.
- source_word: υἱοῦ
  choice: ابن
  rationale: ترجمة مباشرة للفظ، والسياق يبيّن أن المقصود ابن الله.
- source_word: ἀγάπης
  choice: محبته
  rationale: تحفظ معنى المحبة والبنية الإضافية في العبارة اليونانية τῆς ἀγάπης αὐτοῦ.
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: ابن محبته
  rationale: يحفظ التركيب الإضافي المميز في اليونانية بدل حسمه في صياغة تفسيرية واحدة، مع بيان البدائل العربية الطبيعية في الحاشية.
theological_decisions:
- issue: صياغة العبارة τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: ابن محبته
  alternative: ابنه المحبوب؛ الابن الذي يحبه
  rationale: الصياغة المختارة تحافظ على نسيج العبارة اليونانية وعلى صلتها الخاصة بمحبة الآب، بينما تعرض الحاشية القراءتين الاصطلاحيتين الممكنتين دون حصر المعنى في إحداهما.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «سلطان» و«ملكوت» لملاءمتهما لصورة الانتقال بين حكمين، مع إبقاء العبارة اللافتة «ابن محبته» في المتن وشرح بدائلها الطبيعية في الحاشية.
