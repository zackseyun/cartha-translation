lexical_decisions:
- source_word: αὐτός
  choice: هو
  rationale: الضمير في اليونانية بارز للتوكيد، و«هو» في هذا السياق العربي يحفظ الإحالة والتوكيد من غير إضافة تفسيرية مثل «هو نفسه».
- source_word: πρὸ πάντων
  choice: قبل كلّ الأشياء
  rationale: يفيد حرف الجر πρό مع المضاف إليه الأولوية، والأولوية الزمنية هي الدلالة الأبرز هنا؛ أما معنى السيادة فيُحتمل ضمن السياق ولا ينبغي أن يحل محل الصياغة الأصلية.
- source_word: τὰ πάντα
  choice: كلّ الأشياء
  rationale: تعبير شامل يحافظ على اتساع العبارة اليونانية وعلى تكرارها في السياق، من غير حصرها صراحة في «الخليقة».
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: تحفظ «فيه» حرف الجر ἐν وغموض العلاقة المقصودة، بدل تحويلها تفسيريًا إلى «به» أو «بواسطته».
- source_word: συνέστηκεν
  choice: تتماسك
  rationale: ينقل الفعل حالة التماسك القائمة الناتجة عن فعل سابق، وهي دلالة صيغة التام اليونانية؛ و«تتماسك» عربية واضحة وأقرب من «تتكوّن» إلى معنى الترابط والاستمرار.
theological_decisions:
- issue: علاقة المسيح بالخليقة في πρὸ πάντων
  choice: 'إبراز الأولوية: «قبل كلّ الأشياء»'
  alternative: 'السيادة في المرتبة: «فوق كلّ الأشياء»'
  rationale: الصياغة اليونانية تدل في المقام الأول على الأولوية، ويسهم السياق في بيان مكانة المسيح من غير أن تفرض الترجمة تفسيرًا عقائديًا موسعًا.
- issue: دلالة συνέστηκεν
  choice: تماسك الخليقة واستمرار ترابطها
  alternative: تكوّن الأشياء أو قيامها الوجودي فيه
  rationale: «تتماسك» تعبّر بوضوح عن الحالة المستمرة التي تفيدها الصيغة اليونانية، مع إبقاء إمكان معنى «تقوم فيه» أو «يترابط بعضها ببعض فيه» في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «كائن» لإظهار أن ἐστιν فعل مستقل في العبارة، لا مجرد رابط اسمي، وللتعبير عن وجوده السابق من غير توسع تفسيري. رُتبت علامتا الحاشيتين بحسب موضع ظهورهما في النص العربي.
