  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: ar
  text: لهذا السبب، نحن أيضًا، منذ اليوم الذي سمعنا فيه، لا نكفّ عن الصلاة لأجلكم، ونطلب أن تمتلئوا بمعرفة[a] مشيئته، بكل حكمةٍ وفهمٍ روحيَّين[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بمعرفة كاملة»؛ فقد تدل الكلمة اليونانية على معرفة أوفى أو أعمق.'
    reason: lexical_alternative
  - marker: b
    text: قد تعني «روحيَّين» أنهما روحيان في طبيعتهما، أو أن الروح القدس يمنحهما.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: لهذا السبب
  rationale: ينقل الدلالة السببية والاستنتاجية، ويربط الصلاة بما سبق من خبر إيمان أهل كولوسي ومحبتهم.
- source_word: καὶ ἡμεῖς
  choice: نحن أيضًا
  rationale: يحفظ توكيد الضمير وإضافة بولس ورفقائه إلى الاستجابة المذكورة في السياق.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: منذ اليوم الذي سمعنا فيه
  rationale: يبيّن نقطة ابتداء الصلاة المستمرة بصياغة عربية طبيعية وواضحة.
- source_word: οὐ παυόμεθα
  choice: لا نكفّ
  rationale: ينقل معنى الاستمرار في الفعل حتى وقت الكلام، وهو تعبير عربي فصيح ومألوف.
- source_word: ὑπὲρ ὑμῶν
  choice: لأجلكم
  rationale: يؤدي معنى الصلاة لمنفعتهم ونيابةً عنهم دون إثقال العبارة.
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: الصلاة لأجلكم والطلب
  rationale: 'يحفظ الفعلين المتقاربين من غير دمجهما: الأول للصلاة عمومًا، والثاني للالتماس المحدد.'
- source_word: ἵνα πληρωθῆτε
  choice: أن تمتلئوا
  rationale: يحفظ صورة الامتلاء وصيغة المبني للمجهول، فلا يصرّح بالفاعل الذي تركه النص ضمنيًا.
- source_word: τὴν ἐπίγνωσιν
  choice: بمعرفة
  rationale: صياغة عربية طبيعية مع فعل الامتلاء، وتحفظ معنى المعرفة دون فرض دلالة «المعرفة الكاملة» في المتن.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: مشيئته
  rationale: مقابل مباشر ومألوف للتركيب اليوناني، والضمير يعود إلى الله في السياق.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: بكل حكمة وفهم روحيَّين
  rationale: تفيد الباء المصاحبة أو الكيفية، ويجعل التثنية في الصفة «روحيَّين» تعلقها بالحكمة والفهم معًا، كما يرجح التركيب اليوناني.
- source_word: σοφίᾳ
  choice: حكمة
  rationale: المقابل العربي المباشر، ويشمل الإدراك السليم وتطبيقه.
- source_word: συνέσει
  choice: فهم
  rationale: لفظ واضح يدل على الاستيعاب وإدراك العلاقات، وينسجم طبيعيًا مع «حكمة».
theological_decisions:
- issue: دلالة ἐπίγνωσις ودرجة التكثيف فيها
  choice: معرفة
  alternative: معرفة كاملة أو أعمق
  rationale: قد تحمل الكلمة معنى المعرفة الأوفى أو الأعمق، لكن هذا التكثيف ليس لازمًا على نحو يبرر إدخاله صراحةً في المتن؛ لذلك حُفظ في الحاشية.
- issue: مرجع الصفة πνευματικῇ
  choice: روحيَّين، وصفًا للحكمة والفهم دون تسمية الروح القدس صراحةً
  alternative: حكمة وفهم يمنحهما الروح
  rationale: يمكن أن تصف الصفة طبيعتهما الروحية أو علاقتهما بالروح القدس. أبقى المتن العبارة موجزة ومفتوحة كما في اليونانية، وذكرت الحاشية الاحتمالين.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ امتداد الجملة بوصفها صلاة متواصلة، مع استخدام ألفاظ مألوفة مثل «لا نكفّ» و«تمتلئوا». وُضع مؤشرا الحاشيتين عند اللفظين اللذين تتعلق بهما البدائل مباشرةً.
