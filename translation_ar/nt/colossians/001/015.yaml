lexical_decisions:
- source_word: ὅς ἐστιν
  choice: هو
  rationale: يعود الضمير الموصول على الابن في الآية السابقة، وافتتاح الجملة العربية بـ«هو» طبيعي ويحفظ معنى فعل الكينونة في هذا الوصف.
- source_word: εἰκὼν
  choice: صورة
  rationale: ترجمة مباشرة تحفظ دلالتي التمثيل والإظهار من غير توسع تفسيري.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: الله الذي لا يُرى
  rationale: صياغة عربية واضحة تحافظ على وصف الله بأنه غير منظور، من غير الإيحاء بأن المقصود مجرد عدم رؤيته في مناسبة بعينها.
- source_word: πρωτότοκος
  choice: البكر
  rationale: يحفظ اللفظ المجازي وخلفيته الكتابية المتصلة بالمكانة والإرث، بدل استبداله بتفسير مثل «الأسمى».
- source_word: πάσης κτίσεως
  choice: على كل الخليقة
  rationale: يفيد في السياق السيادة والمقام بالنسبة إلى الخليقة، مع إبقاء الصياغة الحرفية الممكنة «بكر كل الخليقة» في الحاشية حفاظًا على موضع الاحتمال النحوي.
theological_decisions:
- issue: دلالة πρωτότοκος πάσης κτίσεως وعلاقة الابن بالخليقة
  choice: البكر على كل الخليقة
  alternative: بكر كل الخليقة
  rationale: السياق اللاحق يعرض الابن بوصفه الذي خُلق به وله كل شيء، ولذلك تُفهم العبارة على الأرجح من جهة الرتبة والسيادة وحق الإرث، لا على أنه فرد من الخليقة. ومع ذلك، تُذكر الصياغة الأقرب إلى البنية اليونانية في الحاشية حتى لا يُطمس الاحتمال اللغوي أو التوتر التفسيري.
