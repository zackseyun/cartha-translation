lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: شاكرين
  rationale: اسم فاعل حالي مرفوع بالجمع، يواصل تركيب الآيات السابقة ويحافظ على معنى الشكر المستمر بصياغة عربية موجزة وطبيعية.
- source_word: τῷ πατρὶ
  choice: الآب
  rationale: ينقل اللقب العلاقي المعرّف كما ورد، من غير إضافة «الله» غير الموجودة صراحة في هذه الآية.
- source_word: τῷ ἱκανώσαντι
  choice: الذي أهَّلكم
  rationale: الفعل ἱκανόω يعني جعله كفؤًا أو صالحًا لنيل شيء؛ و«أهَّل» طبيعي في العربية ويحفظ كون الآب هو الذي منح الأهلية.
- source_word: ὑμᾶς
  choice: كم (أنتم)
  rationale: يتبع نص SBLGNT الذي يقرأ ضمير المخاطبين «أنتم»، مع إثبات قراءة «نا» في الحاشية.
- source_word: εἰς τὴν μερίδα τοῦ κλήρου
  choice: لنصيبٍ من ميراث
  rationale: «نصيب من ميراث» عربية واضحة تحفظ تراكب صورتي الحصة والميراث في μερίς وκλῆρος، من غير صياغة ثقيلة مثل «حصة نصيب».
- source_word: τῶν ἁγίων
  choice: القديسين
  rationale: مقابل موجز ومألوف في الاستعمال الكتابي لـἅγιοι، ويشير إلى شعب الله المكرّس له.
- source_word: ἐν τῷ φωτί
  choice: في النور
  rationale: يحفظ الاستعارة وموقع العبارة اليونانية من غير حسم زائد لما إذا كانت تصف الميراث أو القديسين أو مجال الاشتراك كله.
theological_decisions:
- issue: اختلاف نصي في ضمير المفعول به
  choice: أهَّلكم
  alternative: أهَّلنا
  rationale: النص اليوناني المعطى يقرأ ὑμᾶς «إياكم»، بينما تقرأ مخطوطات أخرى ἡμᾶς «إيانا»؛ اتُّبعت قراءة المصدر في المتن وحُفظ البديل في الحاشية.
- issue: العلاقة بين النصيب والميراث
  choice: لنصيبٍ من ميراث القديسين
  alternative: للحصة المعيَّنة للقديسين في النور
  rationale: الصياغة المختارة تحفظ دلالتي النصيب والميراث وتظل طبيعية، فيما تُذكر في الحاشية دلالة الاقتراع والتخصيص الكامنة في κλῆρος.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «شاكرين» للحفاظ على الصلة النحوية بالسياق السابق، و«أهَّلكم» للتعبير عن فعل الآب المانح للأهلية، مع إبقاء صورة النصيب والميراث وإبهام تعلّق «في النور» دون تفسير مذهبي زائد.
