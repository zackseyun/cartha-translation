  source_fidelity: المتن ينقل البنية والمعنى الأساسيين بأمانة، ويحافظ على التمييز المفيد بين πάθημα («آلام») وθλίψεις («ضيقات»). لكن «أُكمِّل» أضعف من الصورة الاستعارية في ἀνταναπληρῶ، و«في جسدي» لا يُظهر بوضوح، في العربية، أن σάρξ هنا «الجسد البشري/الفاني» في مقابل σῶμα («جسده») في العبارة التالية.
