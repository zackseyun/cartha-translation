  - severity: low
    issue: «في جسدي» قد يطمس التمييز بين σάρξ وσῶμα في الآية نفسها.
    rationale: إضافة «البشري» تبيّن أن المقصود وجود بولس الجسدي المتألم، بينما يظل «جسده» في العبارة التالية استعارةً للكنيسة.
  - severity: low
