  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: ar
  text: الآن أفرح في آلامي لأجلكم، وأملأ في جسدي البشري ما ينقص من ضيقات المسيح[a] لأجل جسده، الذي هو الكنيسة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وأملأ ما بقي من ضيقات المسيح». لا تفصّل الآية طبيعة هذا «النقص»، لكنها تربط آلام بولس بجسد المسيح، أي الكنيسة.'
    reason: alternative_reading
  - marker: b
    text: «الكنيسة» هنا هي جماعة المؤمنين، لا مبنى العبادة.
    reason: lexical_clarification
lexical_decisions:
- source_word: Νῦν
  choice: الآن
  rationale: أداة زمنية تشير إلى حال بولس الحاضرة، و«الآن» ترجمة موجزة وطبيعية.
- source_word: χαίρω
  choice: أفرح
  rationale: تحافظ على صيغة المضارع وعلى موقف بولس القائم من آلامه دون مبالغة في إبراز الاستمرارية.
- source_word: ἐν τοῖς παθήμασιν
  choice: في آلامي
  rationale: السياق المتكلم وعبارة «في جسدي» يبينان أن المقصود آلام بولس؛ وإضافة ضمير المتكلم لازمة لطبيعية العربية.
- source_word: ὑπὲρ ὑμῶν
  choice: لأجلكم
  rationale: تنقل المعنى النفعي، أي إن آلامه تصب في منفعة المخاطَبين.
- source_word: ἀνταναπληρῶ
  choice: أُكمِّل
  rationale: ينقل معنى إتمام ما بقي أو ملء النقص، ويحافظ على قوة العبارة من غير أن يحسم وحده طبيعة ذلك النقص.
- source_word: τὰ ὑστερήματα
  choice: ما ينقص
  rationale: صياغة عربية طبيعية تحفظ معنى المقدار الباقي أو الناقص دون تحويله إلى مصطلح عقائدي.
- source_word: τῶν θλίψεων
  choice: ضيقات
  rationale: تميّز θλῖψις عن πάθημα المترجمة «آلام»، وتحفظ دلالة الشدة والكرب.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός ويحفظ دلالته المسيانية.
- source_word: ἐν τῇ σαρκί μου
  choice: في جسدي
  rationale: في هذا السياق تشير σάρξ إلى وجود بولس الجسدي الذي يحتمل الألم؛ و«جسدي» أوضح للقارئ العربي من «لحمي» ولا تستورد معنى الطبيعة الخاطئة.
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: لأجل جسده
  rationale: يحفظ المعنى النفعي واستعارة الجسد في آن واحد.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: الذي هو الكنيسة
  rationale: يعرّف الجسد صراحة بأنه الكنيسة، مع إبقاء صورة بولس الكنسية.
theological_decisions:
- issue: معنى «ما ينقص من ضيقات المسيح»
  choice: أُبقيت العبارة القوية كما هي، بوصفها مشاركة بولس في الضيقات المرتبطة بالمسيح وخدمة جسده، لا تقرير نقص في عمل المسيح الكفاري.
  alternative: أن تكون آلام بولس استكمالًا لآلام المسيح الفدائية، أو أن تشير العبارة حصريًا إلى مقدار محدد من ضيقات آخر الزمان.
  rationale: النص يربط ضيقات بولس بخدمة جسد المسيح، أي الكنيسة، ويستعمل θλίψεις؛ لذلك ينبغي حفظ التوتر الحقيقي في المتن مع منع استنتاج أن كفارة المسيح كانت ناقصة، بدل تلطيف العبارة في الترجمة.
- issue: دلالة Χριστοῦ
  choice: المسيح
  alternative: كريستوس أو استعماله بوصفه اسمًا مجردًا من دلالة اللقب
  rationale: الصيغة العربية «المسيح» تحفظ اللقب ودلالته اليهودية المسيانية، وهي التعبير العربي المألوف والدقيق.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت «آلامي» و«ضيقات» للمحافظة على التمييز بين πάθημα وθλῖψις، واختيرت «في جسدي» لأن المقصود هنا الوجود الجسدي المتألم لا «الطبيعة الخاطئة». وُضع الهامش [a] عند العبارة اللاهوتية الملتبسة، والهامش [b] عند تعريف الجسد بالكنيسة.
