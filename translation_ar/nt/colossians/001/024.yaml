  terminology: «المسيح» و«الكنيسة» و«ضيقات» مناسبة. أُبقيت «الكنيسة» لأنها المقابل الاصطلاحي الطبيعي لـἐκκλησία في هذا السياق. عُدّل الهامش الأول ليكون أوضح في بيان البديل الترجمـي، ومن دون تقديم تفسير لاهوتي على أنه المعنى الوحيد للنص.
