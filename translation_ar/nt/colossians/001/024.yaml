  to: الآن أفرح في آلامي لأجلكم، وأملأ في جسدي البشري ما ينقص من ضيقات المسيح[a] لأجل جسده، الذي هو الكنيسة[b].
  rationale: 'التعديل محدود وآمن: استُبدل «أُكمِّل» بـ«أملأ» لموافقة صورة الفعل اليوناني، وأضيف «البشري» لتوضيح مرجع σάρξ في سياق يقابل بين جسد بولس وجسد المسيح الذي هو الكنيسة. كما أُعيدت صياغة الهامش لتقديم بديل ترجمي وشرح الصلة السياقية دون فرض حلّ تفسيري أو عقائدي على العبارة المتنازع عليها.'
