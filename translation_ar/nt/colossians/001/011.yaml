  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: ar
  text: مُقَوَّيْنَ بِكُلِّ قُوَّةٍ، بِحَسَبِ قُدْرَةِ مَجْدِهِ[a]، لِكُلِّ ثَبَاتٍ وَطُولِ أَنَاةٍ بِفَرَحٍ،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «بحسب قدرته المجيدة». واليونانية حرفيًا أقرب إلى: «بحسب قدرة مجده».'
    reason: بديل معجمي وتركيبي
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει
  choice: بِكُلِّ قُوَّةٍ
  rationale: تفيد ἐν هنا الوسيلة أو المجال؛ وهذه الصياغة عربية طبيعية وتحفظ شمول πᾶς.
- source_word: δυναμούμενοι
  choice: مُتَقَوِّينَ
  rationale: اسم فاعل في معنى المبني للمجهول يدل على عملية مستمرة، والفاعل المفهوم من سياق الصلاة هو الله.
- source_word: κατὰ τὸ κράτος
  choice: بِحَسَبِ قُدْرَةِ
  rationale: تفيد κατά المقياس أو المقدار، وتحفظ «قدرة» دلالة القوة الفاعلة مع تمييزها نسبيًا من «قوة» المقابلة لـδύναμις.
- source_word: τῆς δόξης αὐτοῦ
  choice: مَجْدِهِ
  rationale: يحفظ تركيب الإضافة اليوناني حرفيًا في «قدرة مجده»، من غير تحويل المجد ضمنيًا إلى مجرد صفة للقدرة.
- source_word: εἰς πᾶσαν ὑπομονὴν
  choice: لِكُلِّ ثَبَاتٍ
  rationale: تفيد εἰς الغاية أو النتيجة، ويعبّر «الثبات» عن الصمود المستمر تحت الشدة.
- source_word: μακροθυμίαν
  choice: طُولِ أَنَاةٍ
  rationale: يحفظ المعنى المميز للصبر المتأني، ولا سيما تجاه الناس، ويظل مختلفًا من ὑπομονή.
- source_word: μετὰ χαρᾶς
  choice: بِفَرَحٍ
  rationale: صياغة موجزة تحافظ على الاسم χαρά وعلى احتمال تعلق العبارة بما قبلها أو بما يليها في السياق.
theological_decisions:
- issue: علاقة تقوية المؤمنين بصفات الله
  choice: «بحسب قدرة مجده»
  alternative: «بحسب قدرته المجيدة»
  rationale: تحفظ الصياغة كثافة تركيب بولس وإضافة القدرة إلى المجد، من غير حسم العلاقة بينهما بتحويل «المجد» إلى صفة.
- issue: تعلّق عبارة «بفرح»
  choice: إبقاؤها في آخر العبارة من غير تفسير نحوي زائد
  alternative: «ثابتين وطويلي الأناة بفرح» أو وصلها بالشكر في العدد التالي
  rationale: موضع العبارة اليونانية يسمح بتعلّقها بالصبر وطول الأناة، وقد يُنظر أيضًا إلى اتصالها بما يلي؛ لذلك تُحفظ قابلية التركيب ولا يُحسم الاحتمال بعلامات تفسيرية زائدة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. اختير «طول أناة» لتمييز μακροθυμία من «الثبات» في ὑπομονή، مع تجنب الألفاظ الأشد قدمًا مثل «احتمال» حين قد توحي بمجرد التحمل السلبي.
