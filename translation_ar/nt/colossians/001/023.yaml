source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: ar
  text: إن كنتم حقًّا تستمرّون في الإيمان، مؤسَّسين وثابتين، وغير متزحزحين عن رجاء الإنجيل الذي سمعتموه، والذي أُعلن في الخليقة كلّها تحت السماء[a]، والذي صرتُ أنا بولس خادمًا له[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بين كل مخلوق تحت السماء». يمكن أن تعني κτίσις «الخليقة» أو «مخلوقًا» بحسب السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «وزيرًا». يمكن أن تدل διάκονος على خادم أو وزير بحسب السياق، ولا تفرض هنا منصبًا كنسيًا محددًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: إن كنتم حقًّا
  rationale: تحفظ أداة الشرط مع نبرة التوكيد التي تضيفها γε، من غير تحويل الشرط إلى تقرير يقيني أو تحميله نتيجة لاهوتية مسبقة.
- source_word: ἐπιμένετε τῇ πίστει
  choice: تستمرّون في الإيمان
  rationale: تنقل معنى الاستمرار الجاري في مجال الإيمان، بصياغة عربية واضحة وطبيعية.
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: مؤسَّسين وثابتين
  rationale: «مؤسَّسين» تحفظ صورة الأساس والصيغة المبنية للمجهول، و«ثابتين» تنقل معنى الرسوخ والاستقرار.
- source_word: μὴ μετακινούμενοι
  choice: ولا تتزحزحون
  rationale: تحفظ صورة الانتقال عن موضع ثابت، مع دلالة الاستمرار في عدم الابتعاد.
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: عن رجاء الإنجيل
  rationale: تبقي علاقة الإضافة كما في اليونانية من غير حسم ما إذا كان الرجاء مضمون الإنجيل أو ناشئًا عنه.
- source_word: τοῦ κηρυχθέντος
  choice: الذي أُعلن
  rationale: تنقل معنى الإعلان العلني مع الحفاظ على المبني للمجهول، وتتجنب تعبيرًا كنسيًا اصطلاحيًا غير لازم.
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: في الخليقة كلّها تحت السماء
  rationale: تحفظ القراءة الكونية الواسعة للعبارة، مع إثبات البديل المعجمي «بين كل مخلوق» في الحاشية.
- source_word: οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος
  choice: والذي صرتُ أنا بولس خادمًا له
  rationale: يعيد الموصول إلى الإنجيل، وينقل ἐγενόμην بمعنى «صرت»، ويترجم διάκονος بلفظ غير مثقل بدلالة منصب كنسي محدد.
theological_decisions:
- issue: القوة الشرطية لعبارة εἴ γε وصلتها بالثبات
  choice: إن كنتم حقًّا تستمرّون
  alternative: ما دمتم تستمرّون / شريطة أن تستمرّوا
  rationale: النص اليوناني يعرض شرطًا مؤكدًا، لكنه لا يحسم وحده الخلافات اللاهوتية الأوسع بشأن الارتداد أو ضمان المثابرة؛ لذلك تُحفظ دلالة الشرط والتوتر القائم.
- issue: دلالة πίστις في τῇ πίστει
  choice: الإيمان
  alternative: الأمانة / الثقة
  rationale: «الإيمان» هو المعنى الأرجح في هذا السياق، سواء أُفهم بوصفه إيمان المؤمنين أو دائرة الإيمان التي يثبتون فيها، ولا توجد ضرورة لحسم هذا التفصيل في الصياغة.
- issue: مدى إعلان الإنجيل في ἐν πάσῃ κτίσει
  choice: في الخليقة كلّها تحت السماء
  alternative: بين كل مخلوق تحت السماء
  rationale: تحفظ الصياغة الرئيسية الاتساع الكوني والأسلوب البلاغي من غير تحويل العبارة إلى تحديد جغرافي أو تاريخي أدق مما يسمح به النص.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ووقورة. استُخدم «الإنجيل» للمصطلح εὐαγγέλιον، وحُفظت صورة التأسيس والثبات والتزحزح قدر الإمكان من غير تكلف، كما وُضعت علامتا الحاشيتين في موضعي اللفظين اللذين تتناولهما الحاشيتان.
