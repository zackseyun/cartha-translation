  rationale: أُبقيت جميع الخيارات الرئيسة التي تحافظ على دلالة الأصل اليوناني والإنجليزية المرجعية، مع جعل «غير متزحزحين» أنسب للصفة التشاركية اليونانية ولسياق الأوصاف المتتابعة. وصُححت حاشية διάκονος لتقدم بديلًا معجميًا عربيًا طبيعيًا ودقيقًا بلا إيحاء بمنصب كنسي مفروض.
