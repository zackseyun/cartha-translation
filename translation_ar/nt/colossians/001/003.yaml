id: COL.1.3
reference: Colossians 1:3
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: ar
  text: نشكر دائمًا الله، أبا ربنا يسوع المسيح، حين نصلّي لأجلكم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: نشكر
  rationale: ينقل معنى التعبير عن الامتنان بعبارة عربية طبيعية ومباشرة تلائم سياق الشكر الرسولي.
- source_word: τῷ θεῷ πατρὶ
  choice: الله، أبا
  rationale: عُدَّ «أبا» بدلًا يوضح هوية الله المذكور، بما يحفظ علاقة البدل في اليونانية من غير تحويلها إلى عطف.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ربنا
  rationale: يحفظ اللقب κύριος وصيغة الإضافة والضمير الجمعي بإيجاز عربي طبيعي.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ لـΧριστός، ويحفظ دلالة اللقب الماسياني مع الصيغة العربية المألوفة للاسم واللقب.
- source_word: πάντοτε
  choice: دائمًا
  rationale: المعنى المباشر هو الاستمرار أو الدوام، ووضعها بعد الفعل يربطها طبيعيًا بفعل الشكر.
- source_word: περὶ ὑμῶν
  choice: لأجلكم
  rationale: مع فعل الصلاة تدل περί مع المضاف إليه على جهة التضرع والشفاعة، لا على مجرد موضوع الحديث.
- source_word: προσευχόμενοι
  choice: حين نصلّي
  rationale: ينقل اسم الفاعل المضارع بوصفه ظرفًا مصاحبًا لفعل الشكر، في صياغة عربية واضحة من غير حسم زائد لطبيعة العلاقة الظرفية.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا أو عنصرًا اسميًا
  choice: المسيح
  alternative: لا يوجد في العربية هنا بديل اصطلاحي طبيعي يوازي التمييز الإنجليزي بين Messiah وChrist
  rationale: اللفظ العربي «المسيح» هو الترجمة التاريخية والدلالية لـΧριστός، ويظل قادرًا على حمل معنى اللقب من غير إدخال تمييز مصطنع لا تتيحه العربية.
- issue: تعلّق πάντοτε بالفعل الرئيسي أو بالصلاة
  choice: ربط «دائمًا» بفعل الشكر
  alternative: حين نصلّي دائمًا لأجلكم
  rationale: موضع πάντοτε في اليونانية يرجح تعلقه بـ«نشكر»، مع بقاء الصلاة ظرفًا مصاحبًا؛ وهذه القراءة توافق بنية الجملة من غير نفي إمكان امتداد معنى الدوام إلى ممارسة الصلاة في السياق الأوسع.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقرة. استُعملت «نشكر» بدل تركيب أثقل مثل «نرفع الشكر»، وحُفظ البدل في «الله، أبا ربنا». لم تُنقل الحاشية الإنجليزية الخاصة بالفرق بين Messiah وChrist لأن العربية تستخدم «المسيح» في الحالتين، ولأن إنشاء بديل لفظي عربي لن يضيف قراءة حقيقية.
