  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: ar
  text: ولهذا أيضًا أَكِدُّ، مجاهدًا بحسب عمله، الذي يعمل فيَّ بقوة.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولأجل هذا» أو «وإلى هذه الغاية».'
    reason: lexical_alternative
  - marker: b
    text: النص اليوناني يقول «عمله» من غير أن يصرّح هنا هل يعود الضمير إلى الله أم إلى المسيح.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: ولهذا
  rationale: تشير العبارة إلى الغاية أو الأمر المذكور سابقًا، و«ولهذا» عربية طبيعية تحفظ الإحالة إلى ما سبق من غير زيادة في التحديد.
- source_word: καὶ
  choice: أيضًا
  rationale: تنقل المعنى الإضافي، إذ يربط بولس تعبه بما سبق أن ذكره.
- source_word: κοπιῶ
  choice: أتعبُ
  rationale: يفيد الفعل بذل جهد شاق قد يبلغ حد الإعياء؛ و«أتعب» واضحة وتحفظ شدة العمل.
- source_word: ἀγωνιζόμενος
  choice: مجاهدًا
  rationale: تنقل معنى بذل الجهد والمكابدة في صراع أو منافسة، وتلائم اقترانها بالتعب.
- source_word: κατὰ
  choice: بحسب
  rationale: 'تحفظ علاقة المقياس أو التناسب: جهاد بولس جارٍ بحسب العمل الفاعل فيه، لا بمجرد قدرته الذاتية.'
- source_word: ἐνέργειαν
  choice: عمله
  rationale: يدل الاسم على الفعل المؤثر أو القدرة العاملة؛ و«عمله» يتجاوب طبيعيًا مع الفعل التالي من الجذر اليوناني نفسه.
- source_word: αὐτοῦ
  choice: ـه
  rationale: الإبقاء على الضمير من غير التصريح بأن مرجعه الله أو المسيح يحفظ عدم التعيين الموجود في نص الآية.
- source_word: τὴν ἐνεργουμένην
  choice: الذي يعمل
  rationale: صياغة عربية مباشرة تعبّر عن الفعل المستمر وتحافظ على الصلة الاشتقاقية مع «عمله».
- source_word: ἐν ἐμοὶ
  choice: فيَّ
  rationale: تنقل المعنى المكاني المباشر لحرف الجر وتحفظ صورة الفعل الباطني من غير تحويله إلى «بي» أو «من خلالي».
- source_word: ἐν δυνάμει
  choice: بقوة
  rationale: صياغة عربية طبيعية تفيد كيفية العمل أو شدته، مع إبقاء معنى القوة صريحًا.
theological_decisions:
- issue: مرجع الضمير في αὐτοῦ («ـه»)
  choice: الإبقاء على الضمير من غير تسمية مرجعه
  alternative: «عمل الله» أو «عمل المسيح»
  rationale: لا تسمّي الآية نفسها مرجع الضمير صراحة، مع أن السياق يتيح الاحتمالين؛ لذلك لا تحسم الترجمة ما تركه النص ضمنيًا.
- issue: العلاقة بين جهد بولس والعمل الإلهي
  choice: «مجاهدًا بحسب عمله»
  alternative: «مجاهدًا بعمله»
  rationale: «بحسب» تحفظ دلالة المقياس أو التناسب في κατά، فلا تختزل العبارة في معنى الوسيلة وحده، وتحافظ على التوتر بين جهد بولس والعمل الفاعل فيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «أتعب» للدلالة على العمل الشاق، و«مجاهدًا» لحفظ صورة المكابدة، مع تكرار «عمله، الذي يعمل» للمحافظة على التجانس الاشتقاقي في الأصل اليوناني.
