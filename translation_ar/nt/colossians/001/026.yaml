lexical_decisions:
- source_word: μυστήριον
  choice: السِّرّ
  rationale: يدلّ اللفظ في هذا السياق البولسي على قصد إلهي كان مخفيًّا ثم كُشف، و«السِّرّ» عربية طبيعية واضحة ولا توحي هنا بسرّ باطني لا يُعلَن.
- source_word: ἀποκεκρυμμένον
  choice: الذي ظلَّ مخفيًّا
  rationale: تنقل هذه الصياغة حالة الخفاء الناتجة من فعل سابق، وهي دلالة اسم المفعول التام المبني للمجهول.
- source_word: ἀπὸ τῶν αἰώνων
  choice: منذ الدهور
  rationale: «منذ» تلائم العربية مع امتداد الخفاء من الدهور الماضية إلى وقت الإعلان، و«الدهور» تحافظ على معنى الحقب والأزمنة.
- source_word: καὶ ἀπὸ τῶν γενεῶν
  choice: ومنذ الأجيال
  rationale: تحافظ الصياغة على التوازي المقصود مع «منذ الدهور» من غير إضافة معنى «كل» غير الصريح في اليونانية.
- source_word: νῦν δὲ
  choice: أمّا الآن
  rationale: تُبرز المقابلة القوية بين الخفاء السابق والإظهار الحاضر بلغة عربية سليمة وطبيعية.
- source_word: ἐφανερώθη
  choice: فقد أُظهِر
  rationale: تحافظ على المبني للمجهول وعلى معنى الصيرورة إلى الظهور، من غير فرض فاعل غير مصرح به في العبارة.
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: لقدّيسيه
  rationale: «القدّيسون» مصطلح عربي كتابي مألوف يدل في الاستعمال البولسي على المؤمنين المكرسين لله، لا على فئة نخبوية لاحقة.
theological_decisions:
- issue: مدلول «قدّيسيه»
  choice: يشير إلى جماعة المؤمنين بوصفهم مكرسين لله، من غير حصر اللفظ في أفراد مُعترف بهم كنسيًّا ضمن فئة خاصة.
  alternative: لمقدَّسيه / لأتقيائه
  rationale: يحافظ «قدّيسيه» على المصطلح البولسي ووزنه اللاهوتي، وتوضح الحاشية المعنى المقصود في السياق.
- issue: هوية فاعل الإظهار
  choice: 'الإبقاء على المبني للمجهول: «أُظهِر».'
  alternative: «أظهره الله»
  rationale: الفعل اليوناني مبني للمجهول ولا يسمّي الفاعل في هذه العبارة؛ لذلك لا تُضاف كلمة «الله» إلى النص، مع أن السياق قد يدل عليه.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «السِّرّ» بدل تعريب «الغموض» لأن السياق يشرح أمرًا إلهيًّا كان مخفيًّا ثم أُظهر. وحُفظ التوازي بين «الدهور» و«الأجيال»، كما حُفظ المبني للمجهول في «أُظهِر».
