source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: ar
  text: هو الذي نعلن عنه، محذّرين كل إنسان ومعلّمين كل إنسان بكل حكمة، لكي نُحضر كل إنسان ناضجًا في المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: نعلن به
  rationale: ينقل معنى الإعلان الجهري الواضح، مع إبراز أن الضمير ὃν يعود إلى المسيح موضوع الإعلان.
- source_word: νουθετοῦντες
  choice: محذّرين
  rationale: يفيد تنبيه الذهن مع التحذير والتقويم؛ و«محذّرين» عربية واضحة توافق السياق وتحافظ على جانب الإنذار.
- source_word: πάντα ἄνθρωπον
  choice: كل إنسان
  rationale: يحافظ على التكرار الثلاثي المقصود وعلى شمول الخدمة لكل فرد.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: بكل حكمة
  rationale: صياغة طبيعية قريبة من دلالة الأداة أو المجال في العبارة اليونانية.
- source_word: παραστήσωμεν
  choice: نُحضر
  rationale: يحفظ معنى إحضار الشخص وإقامته أمام جهة ما، من غير إضافة مفعول له غير مذكور صراحة.
- source_word: τέλειον
  choice: ناضجًا
  rationale: في هذا السياق يدل على بلوغ النضج أو الاكتمال الروحي، لا على العصمة أو الكمال المطلق.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: يحافظ على صيغة الاتحاد أو المجال في النص، دون تحويلها إلى تعبير سببي أو أداتي.
theological_decisions:
- issue: دلالة τέλειον
  choice: ناضجًا
  alternative: كاملًا
  rationale: «ناضجًا» تتجنب إيحاء الكمال المطلق، وتناسب غاية التعليم والتحذير مع إبقاء مفهوم بلوغ التمام حاضرًا.
- issue: المرجع الذي يُحضَر إليه كل إنسان
  choice: عدم التصريح بجهة الإحضار
  alternative: نُحضره أمام الله
  rationale: الفعل παραστήσωμεν لا يذكر في هذه الآية جهة الإحضار صراحة، لذلك لا تُضاف «أمام الله» تفسيرًا داخل المتن.
- issue: دلالة ἐν Χριστῷ
  choice: في المسيح
  alternative: بالمسيح
  rationale: تحافظ «في المسيح» على الغموض الدلالي المشروع بين الاتحاد به والمجال الذي يتحقق فيه النضج.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. حُفظ التكرار البلاغي لعبارة «كل إنسان» ثلاث مرات، كما حُفظ ترتيب التحذير والتعليم والغاية.
