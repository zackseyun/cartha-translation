source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: ar
  text: وهو رأس الجسد، أي الكنيسة، وهو البداية[a]، والبكر من بين الأموات، لكي يصير هو صاحب المقام الأول في كل شيء[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأصل»، أو: «الحاكم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الذي له الأولوية في كل شيء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: هو / هو نفسه دلاليًا
  rationale: يُبرز الضمير اليوناني شخص المسيح. جاء «هو» صريحًا في العربية، وتكراره في الخاتمة يحفظ نبرة التوكيد من غير تركيب ثقيل.
- source_word: κεφαλή
  choice: رأس
  rationale: يحفظ الاستعارة التي تربط المسيح بالجسد من غير حصر معناها في السلطة أو المصدر.
- source_word: σῶμα
  choice: الجسد
  rationale: المقابل العربي الطبيعي للاستعارة الجماعية، ويحافظ على اقترانه بـ«الرأس».
- source_word: ἐκκλησία
  choice: الكنيسة
  rationale: اللفظ المستقر والملائم في هذا السياق البولسي للدلالة على جماعة المؤمنين بوصفها جسد المسيح.
- source_word: ἀρχή
  choice: البداية
  rationale: يتلاءم مع العبارة التالية «البكر من بين الأموات»، ويشير إلى افتتاح نظام القيامة، مع إبقاء البدائل المعجمية في الحاشية.
- source_word: πρωτότοκος
  choice: البكر
  rationale: يحفظ الصيغة الكتابية وما تتضمنه من أولوية في الترتيب والمقام، بدل اختزالها في مجرد كونه أول من قام.
- source_word: ἐκ τῶν νεκρῶν
  choice: من بين الأموات
  rationale: يُظهر معنى الخروج من وسط الأموات بعبارة عربية طبيعية في سياق القيامة.
- source_word: ἵνα γένηται
  choice: لكي يصير
  rationale: يحفظ معنى الغاية أو النتيجة في ἵνα، ويعكس دلالة الصيرورة في γένηται بوضوح.
- source_word: ἐν πᾶσιν
  choice: في كل شيء
  rationale: صياغة عربية طبيعية تحفظ المدى الشامل للعبارة اليونانية المحايدة الجمع.
- source_word: πρωτεύων
  choice: المتقدِّم
  rationale: ينقل معنى احتلال المرتبة الأولى مع إبقاء البديل التفسيري الأكثر وضوحًا في الحاشية.
theological_decisions:
- issue: معنى κεφαλή في استعارة المسيح والجسد
  choice: الإبقاء على «رأس» بلا تفسير إضافي
  alternative: القائد أو مصدر الجسد
  rationale: الاستعارة أوسع من أن تُحصر في السلطة وحدها أو المصدر وحده، ولذلك يحفظ النص توترها الدلالي.
- issue: معنى ἀρχή في علاقته بالقيامة والخليقة الجديدة
  choice: البداية
  alternative: الأصل أو الرئيس
  rationale: السياق المباشر، ولا سيما «البكر من بين الأموات»، يرجّح معنى البداية، لكن اللفظ اليوناني يسمح بدلالات أخرى ذُكرت في الحاشية.
- issue: دلالة πρωτότοκος ἐκ τῶν νεκρῶν
  choice: البكر من بين الأموات
  alternative: أول من قام من الأموات
  rationale: يحفظ اللفظ الكتابي ودلالته على الأولوية في القيامة والمقام، من غير تحويله إلى عبارة تفسيرية أضيق.
- issue: قوة ἵνα γένηται
  choice: لكي يصير
  alternative: حتى يكون
  rationale: «لكي» تبقي الغاية والنتيجة الممكنتين في السياق، و«يصير» تنقل عنصر الصيرورة في الفعل دون تقرير تفسير عقائدي زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم «أي الكنيسة» لبيان عطف البدل في العبارة اليونانية، وحُفظت استعارتا الرأس والجسد وصيغة «البكر» دون توسع تفسيري.
