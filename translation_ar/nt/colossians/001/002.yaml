  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: ar
  text: 'إِلَى الْإِخْوَةِ الْقِدِّيسِينَ وَالْأَوْفِيَاءِ فِي الْمَسِيحِ، الَّذِينَ فِي كُولُوسِّي: نِعْمَةٌ لَكُمْ وَسَلَامٌ مِنَ اللهِ أَبِينَا.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: الَّذِينَ فِي كُولُوسِّي
  rationale: تنقل العبارة جهة المخاطَبين ومكانهم بصياغة عربية طبيعية، مع إبقاء الدلالة المكانية لحرف الجر ἐν.
- source_word: ἁγίοις
  choice: الْقِدِّيسِينَ
  rationale: تحافظ على الصفة الدالة على الاختصاص بالله والقداسة، وتوافق «الإخوة» في الإعراب والجمع.
- source_word: πιστοῖς
  choice: الْأُمَنَاءِ
  rationale: تنقل معنى الثبات والأمانة، مع إثبات احتمال معنى «المؤمنين» في الحاشية لأن اللفظة اليونانية تحتمل الوجهين.
- source_word: ἀδελφοῖς
  choice: الْإِخْوَةِ
  rationale: تعكس صيغة الجمع المذكر في اليونانية، مع توضيح أن الخطاب في هذا السياق يُرجَّح أن يشمل جماعة المؤمنين كلها، نساءً ورجالًا.
- source_word: ἐν Χριστῷ
  choice: فِي الْمَسِيحِ
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، وتحافظ عبارة «في المسيح» على صياغة بولس الدالة على الارتباط به.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: نِعْمَةٌ لَكُمْ وَسَلَامٌ
  rationale: تحافظ على ترتيب التحية اليونانية وصيغتها مع عربية واضحة ومألوفة.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: مِنَ اللهِ أَبِينَا
  rationale: تفهم «أبينا» بدلًا أو بيانًا لـ«الله»، من غير إضافة عطف غير موجود في النص اليوناني.
theological_decisions:
- issue: الدلالة المزدوجة للفظة πιστοῖς
  choice: الْأُمَنَاءِ
  alternative: الْمُؤْمِنِينَ
  rationale: السياق لا يحسم تمامًا بين الإيمان والأمانة؛ لذلك اختير معنى الأمانة في المتن وحُفظ معنى الإيمان في الحاشية.
- issue: مدلول صيغة ἀδελφοῖς من جهة الجنس
  choice: الْإِخْوَةِ
  alternative: الْإِخْوَةِ وَالْأَخَوَاتِ
  rationale: المتن يعكس صيغة الجمع المذكر في الأصل، بينما توضّح الحاشية أن الخطاب الجماعي يُرجَّح أن يشمل النساء أيضًا.
- issue: نقل اللقب Χριστός
  choice: الْمَسِيحِ
  alternative: الْمَمْسُوحِ
  rationale: «المسيح» هو اللقب العربي الراسخ والدقيق، وتوضح الحاشية معناه الاشتقاقي بدل استبداله بعبارة تفسيرية في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رسائلية كريمة. حُفظ ترتيب التحية وقرب التركيب من الأصل، مع تأخير عبارة المكان قليلًا لتحسين السلاسة العربية. استُخدم الضبط الجزئي الكامل في نص الآية لتوضيح الإعراب والقراءة، ولا سيما في «القديسين والأمناء» و«أبينا».
