  yaml_path: translation/nt/colossians/001/014.yaml
  text: in whom we have redemption[a], the forgiveness of sins.
translation:
  language: ar
  text: الذي لنا فيه الفداء[a]، غفران الخطايا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «التحرير». ويمكن أن يحمل كلٌّ من «الفداء» و«الغفران» معنى الإطلاق؛ ويبدو أن بولس يبيّن هنا أن هذا الفداء يتمثل في غفران الخطايا.
    reason: بديل معجمي وبيان العلاقة بين الاسمين المتجاورين في اليونانية.
lexical_decisions:
- source_word: ἐν ᾧ
  choice: الذي لنا فيه
  rationale: يعود الضمير الموصول المذكر المفرد على الابن المحبوب في الآية السابقة. وتحفظ صياغة «فيه» الدلالة الشخصية والعلائقية، من غير تحويلها إلى معنى آلي مثل «به».
- source_word: ἔχομεν
  choice: لنا
  rationale: تؤدي معنى الامتلاك الحاضر الذي يفيده المضارع، وهي صياغة عربية طبيعية وموجزة لعبارة «لنا فيه».
- source_word: ἀπολύτρωσιν
  choice: الفداء
  rationale: «الفداء» هو المقابل العربي الراسخ الذي يحفظ معنى التحرير المرتبط ببذل ثمن، ولا يختزله في مجرد النجاة أو الإطلاق.
- source_word: ἄφεσιν
  choice: غفران
  rationale: في سياق الخطايا، «غفران» هو المقابل العربي الواضح والطبيعي، وتأتي العبارة بدلًا يبيّن الفداء دون إضافة أداة تفسيرية غير موجودة في اليونانية.
- source_word: τῶν ἁμαρτιῶν
  choice: الخطايا
  rationale: الإضافة العربية في «غفران الخطايا» تؤدي بوضوح كون الخطايا متعلَّق الغفران، وتحافظ على الجمع والتعريف في النص اليوناني.
theological_decisions:
- issue: العلاقة بين «الفداء» و«غفران الخطايا»
  choice: 'إبقاء العبارة الثانية بدلًا بيانيًا: «الفداء، غفران الخطايا»'
  alternative: «الفداء، أي غفران الخطايا»
  rationale: يضع اليوناني τὴν ἄφεσιν τῶν ἁμαρτιῶν بدلًا من τὴν ἀπολύτρωσιν. وتحفظ الفاصلة هذه العلاقة من غير إدخال «أي» التفسيرية، فلا توسّع المطابقة ولا تقيّدها بما يتجاوز صياغة الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. قُدِّمت الصلة بصيغة «الذي لنا فيه» لتتصل طبيعيًا بالابن المذكور في السياق السابق، مع الحفاظ على ترتيب المعنيين والعلاقة البدلّية بينهما.
