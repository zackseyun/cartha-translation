  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: ar
  text: أراد الله أن يعرّفهم ما هو غنى مجد هذا السر بين الأمم، أي المسيح فيكم[a]، رجاء المجد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بينكم». يمكن أن تدل العبارة اليونانية على وجود المسيح في المؤمنين، أو على حضوره بينهم بوصفهم جماعة.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: أن يعرّفهم
  rationale: أُدمج ضمير الصلة في مفعول الفعل العربي، وهو يعود إلى القديسين المذكورين في السياق السابق، فتكون الصياغة طبيعية وواضحة.
- source_word: ἠθέλησεν ὁ θεὸς
  choice: أراد الله
  rationale: تعكس «أراد» معنى القصد والمشيئة الإلهية من غير إضافة معنى الاختيار الذي ليس لازمًا في اللفظ اليوناني.
- source_word: γνωρίσαι
  choice: أن يعرّفهم
  rationale: 'تنقل المعنى المباشر للفعل: أن يجعل الأمر معلومًا لهم.'
- source_word: τί τὸ πλοῦτος τῆς δόξης
  choice: ما هو غنى مجد
  rationale: تحافظ الصياغة على بنية العبارة المكثفة وعلى اسمي «الغنى» و«المجد»، من غير توسيع تفسيري مثل «كم هو عظيم».
- source_word: μυστηρίου
  choice: السر
  rationale: يدل اللفظ هنا على قصد إلهي كان خفيًا ثم صار معروفًا، و«السر» أوضح في العربية الحديثة من «اللغز» الذي يوحي بأمر مبهم يُراد حله.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: بين الأمم
  rationale: السياق البولسي يشير إلى الشعوب غير اليهودية؛ و«الأمم» هو المقابل العربي المألوف الذي يحفظ هذا التقابل.
- source_word: ὅ ἐστιν
  choice: أي
  rationale: تقدم «أي» التحديد التفسيري الذي تؤديه العبارة اليونانية، وتتفادى ثقل جملة الصلة العربية.
- source_word: Χριστὸς
  choice: المسيح
  rationale: اللفظ يحمل هنا قوة اللقب ويحدد مضمون السر، لذلك نُقل بـ«المسيح».
- source_word: ἐν ὑμῖν
  choice: فيكم
  rationale: هذا هو المقابل المباشر، مع بقاء احتمال المعنى الجماعي «بينكم» مذكورًا في الحاشية حتى لا يُحسم الغموض.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: رجاء المجد
  rationale: تحفظ العبارة الإضافة اليونانية المكثفة من غير تفسيرها مسبقًا بأنها رجاء نوال المجد أو رجاء قائم على المجد.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيح بوصفه اسمًا عَلَمًا مجردًا
  rationale: يأتي اللفظ في عبارة تفسر مضمون السر، ولذلك تبقى دلالته اللقبية حاضرة من غير إدخال صياغة مذهبية إضافية.
- issue: دلالة ἐν ὑμῖν
  choice: فيكم
  alternative: بينكم
  rationale: يمكن أن تشير العبارة إلى حضور المسيح في المؤمنين أو إلى حضوره بينهم بوصفهم جماعة؛ أُبقي المقابل المباشر في المتن، ووُضع الاحتمال الجماعي في الحاشية.
- issue: دلالة ἡ ἐλπὶς τῆς δόξης
  choice: رجاء المجد
  alternative: رجاء نوال المجد
  rationale: الإضافة اليونانية موجزة وقد تحمل علاقة الرجاء بالمجد المنتظر؛ إبقاؤها موجزة يحفظ كثافة العبارة ولا يفرض تفسيرًا واحدًا.
