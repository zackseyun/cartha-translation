  text: τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ ⸀κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: ar
  text: الذي وصل إليكم[a]، كما أنه يثمر وينمو في العالم كله[b]، كذلك يثمر وينمو بينكم[c]، منذ اليوم الذي سمعتم فيه وعرفتم نعمة الله بالحق[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الحاضر عندكم»، أو «الذي وصل إلى وسطكم».
    reason: lexical_alternative
  - marker: b
    text: أو «في جميع أنحاء العالم».
    reason: lexical_alternative
  - marker: c
    text: أو «فيكم»؛ فقد تشير العبارة اليونانية إلى الجماعة في مجموعها أو إلى عمل الإنجيل في داخلهم.
    reason: lexical_alternative
  - marker: d
    text: أو «حقًّا»، أو «في الحق».
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: الذي وصل إليكم
  rationale: اسم الفاعل المعرّف يواصل وصف الإنجيل المذكور في الآية السابقة. ويعبّر «وصل إليكم» بوضوح عن مجيئه إلى المخاطَبين، مع إثبات بدائل الحضور والوصول بينهم في الحاشية.
- source_word: καθὼς καὶ ἐν παντὶ τῷ κόσμῳ
  choice: كما أنه في العالم كله
  rationale: يحافظ التعبير على المقارنة وعلى أداة الربط καί، وينقل النطاق العالمي الواسع دون إضافة تحديد جغرافي غير موجود في النص.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: يثمر وينمو
  rationale: يحفظ الصورتين الزراعيتين ويدل، بصيغة المضارع العربية، على العمل المستمر الذي تفيده الصيغة اليونانية المركبة.
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: وكذلك بينكم
  rationale: «بينكم» عربية طبيعية في خطاب جماعة، وتفيد عمل الإنجيل في وسطهم، مع إبقاء احتمال «فيكم» في الحاشية.
- source_word: ἀφ’ ἧς ἡμέρας
  choice: منذ اليوم الذي
  rationale: يحدد نقطة بدء عمل الإنجيل بينهم بصياغة عربية واضحة.
- source_word: ἠκούσατε καὶ ἐπέγνωτε
  choice: سمعتم ... وعرفتم
  rationale: يحافظ على الفعلين وعلى الحدث الماضي دون إضافة معنى «لأول مرة» غير المصرح به، وتنقل «عرفتم» بلوغ معرفة حقيقية دون المبالغة إلى «عرفتم معرفة كاملة».
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: نعمة الله
  rationale: ترجمة مستقرة وواضحة للعبارة البولسية، وتحفظ ثقلها اللاهوتي دون شرح زائد.
- source_word: ἐν ἀληθείᾳ
  choice: بالحق
  rationale: صياغة عربية موجزة تحتمل معنى المعرفة الحقيقية أو الصادقة، مع بيان البديل الأقرب إلى معنى المجال، «في الحق»، في الحاشية.
theological_decisions:
- issue: نطاق «العالم كله»
  choice: الإبقاء على العبارة العالمية الواسعة كما وردت
  alternative: فهمها تقريرًا حرفيًا بأن كل فرد وكل إقليم في الكرة الأرضية كان قد بلغه الإنجيل
  rationale: لغة بولس تؤكد اتساع انتشار الإنجيل، ولا ينبغي للترجمة أن تضيق هذا العموم أو تحوله إلى شرح جغرافي صارم.
- issue: دلالة ἐν ἀληθείᾳ
  choice: بالحق، مع إبقاء الدلالة مفتوحة نسبيًا
  alternative: حقًا؛ أو في الحق
  rationale: يمكن أن تصف العبارة طريقة معرفتهم، أي معرفة حقيقية، أو المجال والمضمون المرتبطين بالحق؛ لذلك لم تُحسم الدلالة في اتجاه تفسيري واحد.
- issue: دلالة ἐν ὑμῖν
  choice: بينكم، في إشارة إلى عمل الإنجيل وسط الجماعة
  alternative: فيكم، بما قد يشمل عمله داخلهم أفرادًا أو جماعة
  rationale: الخطاب موجّه إلى جماعة، و«بينكم» طبيعية في العربية وتحفظ البعد الجماعي، بينما تُذكر الصياغة الحرفية المحتملة في الحاشية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. حُفظ تتابع المقارنتين وصورتا الإثمار والنمو، ووُضعت علامات الحواشي عند العبارات التي تشرحها مباشرة.
