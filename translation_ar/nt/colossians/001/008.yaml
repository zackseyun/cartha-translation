  text: and who also made known to us your love in the Spirit[a].
translation:
  language: ar
  text: وهو أيضًا الذي أخبرنا بمحبتكم في الروح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «محبتكم الروحية».'
    reason: قراءة بديلة لعبارة ἐν πνεύματι، التي قد تشير إلى الروح القدس أو إلى الطابع الروحي للمحبة.
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: وهو أيضًا الذي أخبرنا
  rationale: أداة التعريف مع اسم الفاعل الأوريستي تؤدي وظيفة اسمية وتشير إلى أبفراس المذكور في الآية السابقة؛ وصياغة الجملة الموصولة طبيعية في العربية. والفعل δηλόω هنا يعني الإخبار أو التعريف بأمر.
- source_word: καὶ
  choice: أيضًا
  rationale: تفيد καί الإضافة إلى ما سبق من وصف أبفراس، وتؤدي «أيضًا» هذا المعنى بوضوح.
- source_word: ἡμῖν
  choice: نا في «أخبرنا»
  rationale: الداتيف هنا مفعول غير مباشر، وقد أُدمج في الفعل العربي بضمير المتكلمين، أي إن أبفراس أخبر بولس ورفاقه.
- source_word: τὴν ὑμῶν ἀγάπην
  choice: بمحبتكم
  rationale: تُترجم ἀγάπη ترجمتها المباشرة «محبة»، والضمير المضاف إليه يحفظ معنى ὑμῶν. واستعمال الباء مع «أخبر» عربي طبيعي للدلالة على مضمون الخبر.
- source_word: ἐν πνεύματι
  choice: في الروح
  rationale: العبارة تحتمل الإشارة إلى الروح القدس، وهو الأرجح في هذا السياق البولسي، كما تحتمل وصف المحبة بأنها روحية. تحافظ «في الروح» على الصياغة المقتضبة ولا تحسم الاحتمال بإضافة «القدس».
theological_decisions:
- issue: مرجع πνεύματι
  choice: «في الروح»، مع احتمال أن يكون المقصود الروح القدس
  alternative: «في الروح» بمعنى في الناحية الروحية، أو «محبتكم الروحية»
  rationale: الاسم اليوناني غير مسبوق بأداة تعريف، لكن ذلك لا يمنع في استعمال بولس أن يشير إلى الروح القدس. ولأن العبارة تحتمل أيضًا معنى الصفة أو المجال الروحي، أُبقيت صياغة المتن موجزة ووُضع البديل في الحاشية حفاظًا على التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. رُبطت الآية بما قبلها بعبارة «وهو أيضًا الذي»، واستُعمل «أخبرنا بمحبتكم» بوصفه تعبيرًا عربيًا طبيعيًا ودقيقًا.
