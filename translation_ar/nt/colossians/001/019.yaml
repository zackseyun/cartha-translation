  source_fidelity: 'النص العربي يحافظ على البنية الأساسية للنص اليوناني: «فإنّ» تؤدي الوظيفة التعليلية لـὅτι، و«كل الملء» يحافظ على كون πᾶν τὸ πλήρωμα الفاعل النحوي، و«ارتضى أن يحل فيه» ينقل εὐδόκησεν ... κατοικῆσαι من غير إدخال «الله» أو «الآب» في المتن. كما يبقى الضمير في «فيه» موافقًا لإحالة αὐτῷ إلى الابن في السياق.'
  naturalness: الصياغة فصيحة ومفهومة في العربية المعيارية الحديثة. ترتيب «كل الملء ارتضى» ذو نبرة كتابية مقصودة، لكنه سليم ويخدم الحفاظ على الفاعل النحوي وعلى عدم تعيين فاعل تفسيري خارجي.
  terminology: «الملء» مناسب لـπλήρωμα ويحفظ ثقله الاصطلاحي من دون توسيع غير ملفوظ إلى «ملء الله». و«يحل» ترجمة فصيحة مناسبة لـκατοικῆσαι في هذا السياق. الحواشي واضحة، وتعرض القراءة التي تجعل الله أو الآب فاعلًا بوصفها تفسيرًا لا بوصفها نص المتن.
