  yaml_path: translation/nt/colossians/001/019.yaml
  text: For in him all the fullness was pleased to dwell[c][b][a],
translation:
  language: ar
  text: فإنَّ[a] كلَّ الملء[c] ارتضى[b] أن يحلَّ فيه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن كل الملء ارتضى أن يحل فيه». تحتمل أداة الربط أكثر من وجه تعليلي أو تفسيري في السياق.'
    reason: lexical_alternative
  - marker: b
    text: 'تُظهر ترجمات كثيرة الفاعل المفهوم فتقول: «فقد ارتضى الله أن يحل فيه كل ملئه»، أو: «فقد ارتضى الآب…». أما اليونانية فلا تذكر الفاعل بهذا التصريح.'
    reason: alternative_reading
  - marker: c
    text: يُفهم «كل الملء» غالبًا بمعنى ملء الله؛ قارن كولوسي 2:9.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: فإنَّ
  rationale: تفيد الأداة هنا التعليل أو التفسير لما سبق، و«فإنَّ» تؤدي هذه الصلة بسلاسة، مع التنبيه في الحاشية إلى إمكان ترجمتها على وجه آخر.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: الضمير عائد إلى الابن في السياق القريب. والإبقاء عليه ضميرًا يحفظ صياغة اليونانية من غير إدخال لقب غير مذكور في الآية.
- source_word: εὐδόκησεν
  choice: ارتضى
  rationale: ينقل الفعل معنى الرضا والقصد الحسن، ولا يضيف فاعلًا مثل «الله» أو «الآب» لا يصرّح به النص اليوناني.
- source_word: πᾶν τὸ πλήρωμα
  choice: كلَّ الملء
  rationale: تحفظ العبارة شمول πᾶν وثقل πλήρωμα اللاهوتي، من غير إضافة «الله» التي تُفهم غالبًا من السياق لكنها غير مذكورة هنا.
- source_word: κατοικῆσαι
  choice: أن يحلَّ
  rationale: «يحلّ» تعبير عربي فصيح ومألوف للإقامة والاستقرار، ويلائم النبرة اللاهوتية الرفيعة للنص.
theological_decisions:
- issue: فاعل εὐδόκησεν غير المصرّح به
  choice: إبقاء «كل الملء» فاعلًا ظاهرًا بحسب أقرب قراءة نحوية مباشرة، من غير إضافة «الله» أو «الآب».
  alternative: 'فقد ارتضى الله أن يحل فيه كل ملئه؛ أو: فقد ارتضى الآب أن يحل فيه كل الملء.'
  rationale: لا يذكر النص اليوناني «الله» ولا «الآب» صراحة. ومع أن إضمارهما تفسير شائع، فإن إدخالهما في المتن يحسم غموضًا حقيقيًا في المصدر؛ لذلك حُفظ التركيب الأشد مباشرة، مع بيان القراءة الشائعة في الحاشية.
- issue: مرجع «الملء»
  choice: كل الملء
  alternative: 'كل ملء الله؛ أو: كل ملئه'
  rationale: يدعم السياق، ولا سيما كولوسي 2:9، فهم العبارة على أنها ملء الله، لكن هذه الإضافة ليست ملفوظة في الآية نفسها؛ لذلك لم تُدرج في المتن.
translation_notes:
  register: صياغة عربية فصحى حديثة، موجزة ومهيبة. أُبقي التركيب غير المألوف نسبيًا «كل الملء ارتضى» لصون الغموض النحوي واللاهوتي في الأصل، بدل تسويته بإضافة فاعل تفسيري.
