lexical_decisions:
- source_word: Παῦλος
  choice: بولس
  rationale: الصيغة العربية المعيارية الراسخة للاسم اليوناني.
- source_word: ἀπόστολος
  choice: رسول
  rationale: تنقل اللقب والوظيفة في هذا التعريف الافتتاحي، لا مجرد معنى حامل رسالة عابر.
- source_word: Χριστοῦ Ἰησοῦ
  choice: المسيح يسوع
  rationale: تحافظ «المسيح» على دلالة Χριστός كلقب، مع إبقاء ترتيب الاسمين كما في النص اليوناني.
- source_word: διὰ θελήματος θεοῦ
  choice: بمشيئة الله
  rationale: تعبير عربي طبيعي ودقيق يدل على أن رسولية بولس قائمة بمشيئة الله.
- source_word: Τιμόθεος
  choice: تيموثاوس
  rationale: النقل العربي المعياري للاسم اليوناني.
- source_word: ὁ ἀδελφὸς
  choice: أخونا
  rationale: صياغة عربية طبيعية تُظهر العلاقة الجماعية المفهومة من سياق افتتاح الرسالة، مع بيان الصيغة الحرفية في الحاشية.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو اللقب العربي الراسخ، ويحفظ الدلالة المسيانية دون تحويل اللقب إلى اسم مجرد.
- issue: القوة العلائقية لعبارة ὁ ἀδελφός
  choice: أخونا
  alternative: الأخ
  rationale: «أخونا» أوضح وأطبع في العربية بوصفه وصفًا للعلاقة الإيمانية المشتركة، بينما تبقى الصيغة اليونانية الحرفية مذكورة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع الحفاظ على بنية افتتاح الرسالة وترتيب «المسيح يسوع». استُخدمت «بمشيئة الله» لسلامتها ودقتها في هذا السياق.
