  text: الذي فيه جميع كنوز الحكمة والمعرفة مخفية[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: قد يعود «الذي» على «سرّ الله» بالمعنى الأوسع، لا على المسيح شخصيًا؛ فيكون المعنى: «سرّ الله الذي فيه...»'
    reason: alternative_reading
  - marker: b
