    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: الذي فيه
  rationale: يحافظ على تركيب الصلة وعلى قوة ἐν المكانية، ويعود بحسب الأقرب والأرجح إلى المسيح المذكور في 2:2. صيغت العبارة «الذي فيه» لتناسب المرجع الشخصي، مع إثبات احتمال عودتها إلى «سرّ الله» في الحاشية.
- source_word: πάντες οἱ θησαυροὶ
  choice: جميع كنوز
  rationale: ينقل المعنى الجمعي الشامل للعبارة اليونانية، وتأتي الإضافة العربية طبيعية من غير أداة تعريف قبل «كنوز».
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: الحكمة والمعرفة
  rationale: يحافظ على التمييز بين σοφία وγνῶσις وعلى اقترانهما، من غير دمجهما في مفهوم واحد.
- source_word: ἀπόκρυφοι
  choice: تكمن
  rationale: تنقل في العربية معنى كون الكنوز خفية أو مودعة في موضع، بصياغة طبيعية لا تحسم هل المقصود خفاؤها أم حفظها وادخارها؛ وتورد الحاشية البديل الأقرب إلى الدلالة اللفظية المباشرة.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: تكمن
  rationale: صياغة عربية فعلية طبيعية تؤدي معنى الفعل الرابط مع الصفة الخبرية، مع بقاء فكرة وجود الكنوز خفية أو مودعة في المسيح.
theological_decisions:
- issue: مرجع الضمير الموصول في ἐν ᾧ
  choice: اعتباره عائدًا إلى المسيح شخصيًا
  alternative: عودته على نطاق أوسع إلى «سرّ الله»
  rationale: المسيح هو المرجع الشخصي الأقرب في السياق السابق، لكن الصيغة النحوية تسمح بفهم أوسع؛ لذلك حُفظ البديل في الحاشية من غير حسم زائد.
- issue: هل تدل ἀπόκρυφοι على سرية باطنية أم على كون الكنوز محفوظة في المسيح
  choice: 'صياغة محايدة نسبيًا: «تكمن»'
  alternative: «مخفية» لتشديد الخفاء، أو «مدَّخرة» لتشديد الحفظ والإتاحة
  rationale: لا تفرض الصفة اليونانية وحدها تفسيرًا كاملًا لطبيعة هذا الخفاء؛ لذلك لا ينبغي أن توحي الترجمة بأن الحكمة ممتنعة على المؤمنين أو بأنها مجرد معرفة سرية خاصة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختيرت «تكمن» لتجنب العبارة الأثقل «تكون مخفية»، مع إبقاء الاحتمالين الدلاليين في الحاشية. جميع علامات الحواشي مثبتة في المتن.
