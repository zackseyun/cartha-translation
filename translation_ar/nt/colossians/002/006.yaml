  text: فكما تسلَّمتم المسيحَ يسوعَ الربَّ، اسلكوا فيه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς οὖν
  choice: فكما
  rationale: تجمع الفاء الاستنتاجية معنى οὖν («لذلك/إذًا») وتحفظ «كما» قوة المقارنة في ὡς، بصياغة عربية موجزة وطبيعية تصل ما يأتي بالحجة السابقة.
- source_word: παρελάβετε
  choice: تسلَّمتم
  rationale: يحفظ اتساع الفعل الذي قد يشمل تلقّي التعليم الرسولي وقبول شخص المسيح، من غير حصره في معنى ذهني أو عاطفي وحده.
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: المسيحَ يسوعَ
  rationale: «المسيح» هو المقابل العربي المألوف للقب Χριστός ويحفظ معناه اللقبي، و«يسوع» ينقل الاسم. وضبط الكلمتين بالنصب يوضح علاقتهما بالفعل.
- source_word: τὸν κύριον
  choice: الربَّ
  rationale: ينقل اللقب المسيحاني κύριος بالمقابل العربي الراسخ «الرب»، ويُبقيه بدلًا أو عطف بيان من «المسيح يسوع».
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: يحفظ تعبير بولس المكثف عن علاقة المؤمنين بالمسيح من غير توسيعه تفسيريًا إلى «في اتحاد معه».
- source_word: περιπατεῖτε
  choice: اسلكوا
  rationale: ينقل صيغة الأمر الحاضر للجمع ويحفظ استعارة السير للدلالة على نهج الحياة والتصرف، وهي استعارة مفهومة وراسخة في العربية الكتابية.
theological_decisions:
- issue: دلالة Χριστός في تركيب اللقب والاسم
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: ترتيب المصدر هو «المسيح يسوع»، وفيه يسبق اللقب الاسم؛ لذلك حُفظ الترتيب والدور اللقبي من غير معاملته كلقب عائلي.
- issue: لغة الاتحاد البولسية في ἐν αὐτῷ
  choice: فيه
  alternative: متحدين به
  rationale: العبارة اليونانية موجزة وتحتمل غنى مكانيًا وعلاقاتيًا ولاهوتيًا؛ والإبقاء على «فيه» يصون هذا التوتر بدل حسمه بشرح تفسيري.
- issue: متعلَّق فعل παραλαμβάνω
  choice: تسلَّمتم المسيح يسوع الرب
  alternative: قبلتم المسيح يسوع الرب
  rationale: «تسلَّمتم» تترك مفتوحًا تداخل تلقّي التعليم الرسولي مع قبول شخص الرب، فلا تختزل العبارة في قبول شخصي محض ولا في تعلّم عقيدة محضة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة وموجزة. استُعملت «فكما» لضم الاستنتاج إلى المقارنة من غير إثقال، وحُفظت استعارة السلوك ولغة «فيه». لا حاجة إلى حاشية تقابل بين Messiah وChrist، لأن «المسيح» في العربية يؤدي المعنى اللقبي نفسه طبيعيًا.
