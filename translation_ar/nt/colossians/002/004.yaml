  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: ar
  text: أقول هذا لئلّا يخدعكم أحد بحجّة مقنعة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بكلام مقنع»، أو «بحجّة تبدو معقولة».
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο λέγω
  choice: أقول هذا
  rationale: يحافظ على اسم الإشارة المفرد وعلى مباشرة الفعل المضارع، من غير تحديد زائد لما يعود إليه «هذا».
- source_word: ἵνα μηδεὶς ὑμᾶς παραλογίζηται
  choice: لئلّا يخدعكم أحد
  rationale: تنقل «لئلّا» غرض القول مع النفي، ويعبّر «يخدعكم» بوضوح عن التضليل القائم على الاستدلال المضلِّل، مع إبقاء ضمير المخاطبين بصيغة الجمع.
- source_word: ἐν πιθανολογίᾳ
  choice: بحجّة مقنعة
  rationale: تفيد الباء معنى الوسيلة أو الأسلوب، وتنقل العبارة معنى الكلام أو الاستدلال الذي له قوة إقناع، من غير الزعم بأن الحجة صحيحة فعلًا.
theological_decisions:
- issue: تحديد طبيعة التحذير في παραλογίζηται ἐν πιθανολογίᾳ
  choice: تحذير عام من الخداع بحجّة تبدو مقنعة
  alternative: تخصيص التحذير بالفلسفة الباطلة أو بمجرد البلاغة اللفظية
  rationale: لا يسمّي نص الآية هنا مذهبًا بعينه، بل يحذّر من التضليل بواسطة كلام أو استدلال مقنع؛ لذلك لا ينبغي تضييق المقصود بإضافة غير موجودة في النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «لئلّا» لصياغة الغرض المنفي بصورة طبيعية، و«حجّة مقنعة» لنقل البعد الاستدلالي والبلاغي للفظ اليوناني مع إبقاء بدائله في الحاشية.
