translation:
  language: ar
  text: وأنتم قد مُلِئتم فيه[a]، وهو رأس[b] كل رئاسة وكل سلطان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أنتم فيه ممتلئون» أو «نلتم الملء فيه».
    reason: lexical_alternative
  - marker: b
    text: تحافظ كلمة «رأس» على الاستعارة اليونانية؛ والمعنى هنا أنه الأسمى على كل رئاسة وسلطان.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: أُبقي حرف العطف لربط الآية بما قبلها واستمرار حجة بولس.
- source_word: ἐστὲ ἐν αὐτῷ πεπληρωμένοι
  choice: أنتم فيه ممتلئون
  rationale: تنقل الصياغة حالة الامتلاء الحاضرة الناتجة من فعل سابق، وتحافظ على عبارة «فيه» وعلى صلة المعنى بملء المسيح في الآية السابقة، من غير حصره في تفسير عقائدي واحد.
- source_word: ὅς ἐστιν
  choice: وهو
  rationale: إحالة عربية طبيعية وموجزة إلى المسيح المذكور في عبارة «فيه».
- source_word: ἡ κεφαλή
  choice: رأس
  rationale: تحافظ على الاستعارة اليونانية بدل استبدالها بتفسير مثل «الحاكم» أو «المتسلط».
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: كل رئاسة وسلطان
  rationale: «رئاسة» و«سلطان» ينقلان فئتي القوى أو السلطات المشار إليهما، مع الحفاظ على شمول πάσης وعلى الاقتران بين المصطلحين.
theological_decisions:
- issue: معنى امتلاء المؤمنين في المسيح
  choice: تقرر العبارة أن المؤمنين في حالة امتلاء في المسيح، مع إبقاء طبيعة هذا الامتلاء واسعة كما في النص.
  alternative: أنهم كاملون بمعنى أنهم لا يحتاجون إلى شيء للخلاص، أو أنهم نالوا ملء الله باتحادهم بالمسيح.
  rationale: «ممتلئون» تحفظ صورة الملء وعلاقتها بالآية السابقة، ولا تفرض مفهومًا تقنيًا عن الكمال أو زوال الخطية.
- issue: دلالة «الرأس» بالنسبة إلى الرئاسات والسلاطين
  choice: تُحفظ استعارة «الرأس»، وفي السياق تدل على سمو المسيح وسيادته على جميع الرئاسات والسلاطين.
  alternative: أن المسيح هو مصدر كل رئاسة وسلطان.
  rationale: مع أن استعارة الرأس قد تحتمل دلالات متعددة في بعض السياقات، فإن سياق كولوسي والقوى الكونية يرجح السيادة، مع إبقاء الاستعارة نفسها في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع نبرة كتابية رصينة. استُخدمت «ممتلئون» لصياغة طبيعية تعبّر عن الحالة الناتجة، وأُبقيت استعارة «الرأس» والتعبيران «رئاسة وسلطان» حفاظًا على لغة المصدر وتوترها الدلالي.
