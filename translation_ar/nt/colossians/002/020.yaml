  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: ar
  text: 'إن كنتم قد متم مع المسيح عن المبادئ الأولية للعالم[a]، فلماذا، كأنكم تعيشون في العالم، تخضعون لأحكام[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «القوى الروحية الأولية للعالم»؛ ويجوز أيضًا: «عناصر العالم الأساسية».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «تُفرَض عليكم أحكام؟»'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: إن كنتم
  rationale: تحافظ «إن» على صيغة الشرط في اليونانية، من غير أن تحسم ما إذا كان بولس يفترض تحقق الشرط بلاغيًا.
- source_word: ἀπεθάνετε
  choice: قد متم
  rationale: تنقل الفعل الماضي بوصفه حدثًا حاسمًا وقع باتحاد المخاطَبين بالمسيح، وتأتي الصياغة طبيعية في العربية مع «كنتم».
- source_word: σὺν Χριστῷ
  choice: مع المسيح
  rationale: تحافظ على معنى المصاحبة والاتحاد، وتترجم Χριστός بلقبه العربي المألوف «المسيح».
- source_word: ἀπὸ
  choice: عن
  rationale: تعبّر «مات عن» في العربية عن الانفصال والتحرر من سلطان شيء، وهو المقصود هنا.
- source_word: τῶν στοιχείων τοῦ κόσμου
  choice: مبادئ العالم الأولية
  rationale: تحافظ هذه العبارة على معنى στοιχεῖα بوصفها مبادئ أو أصولًا أولية، من غير أن تنفي احتمال الإشارة إلى قوى روحية أو إلى عناصر أساسية.
- source_word: τί
  choice: فلماذا
  rationale: تنقل الاستفهام الإنكاري بصورة عربية مباشرة وطبيعية.
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: كأنكم تعيشون في العالم
  rationale: تحافظ «كأنكم» على معنى المقارنة أو الافتراض الذي تؤديه ὡς مع اسم الفاعل.
- source_word: δογματίζεσθε
  choice: تخضعون لأحكام
  rationale: صياغة عربية طبيعية تنقل معنى الاحتكام إلى مقررات أو لوائح ملزمة، مع إبقاء احتمال الدلالة المبنية للمجهول في الحاشية.
theological_decisions:
- issue: دلالة στοιχεῖα في الاستعمال البولسي
  choice: مبادئ العالم الأولية
  alternative: القوى الروحية الأولية للعالم؛ أو عناصر العالم الأساسية
  rationale: اللفظ اليوناني متعدد الدلالة، وقد يشير إلى أصول النظام العالمي أو عناصره الأساسية أو قوى كونية روحية. يحافظ المتن على قدر من هذا الغموض، وتورد الحاشية الاحتمالات المهمة دون فرض تصور كوني بعينه.
- issue: دلالة الصيغة δογματίζεσθε
  choice: تخضعون لأحكام
  alternative: تُفرَض عليكم أحكام
  rationale: تسمح الصيغة اليونانية بفهم وسطي أو مبني للمجهول. اختيرت صياغة تُبرز مشاركة المخاطَبين، مع حفظ القراءة المبنية للمجهول في الحاشية.
translation_notes:
  register: فصحى معاصرة واضحة ورصينة. استُعملت «أحكام» بدل ألفاظ أشد تخصصًا مثل «مراسيم»، وحُفظت النقطتان في آخر الآية لأنها تمهّد للأحكام المذكورة في الآية التالية.
