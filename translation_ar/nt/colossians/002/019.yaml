  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: ar
  text: ولا يتمسّك بالرأس[a]، الذي منه ينال الجسد كله الإمداد ويتماسك بواسطة المفاصل والأربطة[b]، فينمو بالنمو الذي من الله[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ولا يتشبّث بالرأس».
    reason: lexical_alternative
  - marker: b
    text: أو «ينال الغذاء وتُضمّ أجزاؤه بعضها إلى بعض بواسطة المفاصل والأربطة».
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًّا: «ينمو النموَّ لله» أو «نموَّ الله»؛ ويُرجَّح أن المقصود نموّ مصدره الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: يتمسّك
  rationale: يفيد إحكام التعلّق والثبات عليه، لا مجرد اللمس أو الإمساك العابر.
- source_word: τὴν κεφαλήν
  choice: بالرأس
  rationale: يحفظ الاستعارة التي تشير في السياق إلى المسيح بوصفه رأس الجسد، ولا تحتاج العربية إلى تمييزه بحرف كبير.
- source_word: ἐξ οὗ
  choice: الذي منه
  rationale: يعود الضمير المذكر إلى «الرأس»، ويحافظ التعبير على كون الرأس مصدر ما يناله الجسد.
- source_word: πᾶν τὸ σῶμα
  choice: الجسد كله
  rationale: صياغة عربية طبيعية تؤكد الجسد الواحد بكامل أجزائه.
- source_word: διὰ τῶν ἁφῶν καὶ συνδέσμων
  choice: بواسطة المفاصل والأربطة
  rationale: يحفظ الصورة التشريحية؛ فـ«المفاصل» نقاط الاتصال، و«الأربطة» ما يربط الأجزاء بعضها ببعض.
- source_word: ἐπιχορηγούμενον
  choice: ينال الإمداد
  rationale: ينقل معنى تزويد الجسد بما يحتاج إليه من دون حصره في الغذاء وحده.
- source_word: συμβιβαζόμενον
  choice: يتماسك
  rationale: يعبّر بإيجاز طبيعي عن ضم أجزاء الجسد بعضها إلى بعض وإبقائها في وحدة مترابطة.
- source_word: αὔξει
  choice: فينمو
  rationale: يتابع صورة الجسد الحي، وهو أوضح من «يزداد» في هذا السياق.
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: بالنمو الذي من الله
  rationale: يفهم الإضافة على أنها تفيد المصدر، مع إبقاء ملاحظة عن الصياغة اليونانية الأوجز والأكثر احتمالًا للتعدد.
theological_decisions:
- issue: دلالة الإضافة في τὴν αὔξησιν τοῦ θεοῦ
  choice: النمو الذي من الله، أي إن الله مصدر نمو الجسد
  alternative: «نمو الله» أو «النمو الإلهي»
  rationale: السياق يصوّر الجسد آخذًا حياته ونموه من الرأس، وعبارة «الذي من الله» تمنع توهّم أن الله نفسه ينمو. وتوثّق الحاشية الصياغة الحرفية حتى لا يُطمس ما في الإضافة اليونانية من إيجاز واحتمال.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. حُفظت استعارة الرأس والجسد ومصطلحاتها التشريحية، واستُخدمت أفعال مبنية للمعلوم ذات دلالة تلقٍّ («ينال») لتجنّب ثقل تتابع المبني للمجهول في العربية من غير تغيير جهة الإمداد.
