    text: 'ترتيب «عيد، وهلال، وسبوت» يستحضر التقويم الديني اليهودي: السنوي، ثم الشهري، ثم الأسبوعي.'
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ οὖν τις ὑμᾶς κρινέτω
  choice: فلا يَحكُمَنَّ عليكم أحدٌ
  rationale: الفاء تنقل الاستنتاج الذي تفيده οὖν، وصيغة النهي المؤكدة تنقل Μὴ مع فعل الأمر، و«يحكم عليكم» تعبر طبيعيًا عن إصدار حكم سلبي بشأن المخاطَبين من غير أن تضيف إدانة صريحة ليست لازمة في اللفظ.
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: بسبب طعامٍ أو شرابٍ
  rationale: βρῶσις وπόσις قد يدلان على الأكل والشرب أو على الطعام والشراب. وفي سياق فئات الممارسات، تُفهمان طبيعيًا بوصفهما ما يتعلق بالطعام والشراب؛ و«بسبب» توضح صلتهما بالحكم من غير تقرير ماهية الأحكام المقصودة.
- source_word: ἐν μέρει ἑορτῆς
  choice: من جهة عيدٍ
  rationale: العبارة الاصطلاحية ἐν μέρει تعني هنا «من جهة/في شأن»، لا «في جزء من». و«عيد» لفظ عربي واضح لمناسبة دينية دورية.
- source_word: νουμηνίας
  choice: هلالٍ جديدٍ
  rationale: اللفظ يدل على ظهور القمر الجديد وما يرتبط به من احتفال شهري. «هلال جديد» يحافظ على الصورة المباشرة، وتوضح الحاشية دلالته التقويمية.
- source_word: σαββάτων
  choice: سبوتٍ
  rationale: 'يحافظ الجمع العربي على صيغة الجمع اليونانية وعلى موقع اللفظ في الثلاثية التقويمية: عيد، هلال جديد، سبوت.'
theological_decisions:
- issue: طبيعة الممارسات المذكورة وحكمها
  choice: يركز النص على منع الآخرين من الحكم على المؤمنين بسبب أمور الطعام والشراب والمواعيد الدينية.
  alternative: أن تكون الآية في ذاتها إلغاءً مطلقًا لكل هذه الممارسات، أو أن تقتصر حصرًا على فرائض بشرية لا كتابية.
  rationale: الآية تنهى صراحةً عن الحكم في هذه الأمور، لكنها لا تحسم وحدها كل الأسئلة اللاهوتية المتعلقة باستمرار تلك الممارسات أو بطلانها؛ لذلك لا تضيف الترجمة نتيجة عقائدية أوسع من منطوق النص.
translation_notes:
  register: صياغة عربية فصحى معاصرة ومهيبة، سهلة للقارئ العام. استُعملت «فلا يحكمنّ» لنقل قوة النهي والاستنتاج، مع تجنب ألفاظ فقهية أو طائفية قد تحسم ما أبقاه النص مفتوحًا.
