  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: ar
  text: فلا يَحكُمَنَّ عليكم أحدٌ في أمر طعامٍ أو شرابٍ، أو من جهة عيدٍ أو هلالٍ أو سبوتٍ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
