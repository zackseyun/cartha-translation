  source_fidelity: ينقل النص النهي والاستنتاج («فلا»)، وفعل الحكم، وقائمة الطعام والشراب والمواعيد على نحو أمين عمومًا. لكن «بسبب طعام أو شراب» تميل إلى التعبير عن العلة، في حين أن ἐν هنا تحدد المجال أو الأمر الذي يقع فيه الحكم. كما أن «هلال جديد» غير مألوفة ومكررة دلاليًا في العربية، لأن «الهلال» يدل أصلًا على القمر الجديد.
