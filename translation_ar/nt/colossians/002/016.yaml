  rationale: تضبط المراجعة علاقة الطعام والشراب بفعل الحكم لتطابق دلالة ἐν السياقية، وتستبدل «هلال جديد» بـ«هلال» لاستعمال عربي طبيعي ينقل معنى νουμηνία من غير زيادة. وتبقى بنية النهي وقائمة المناسبات والجمع في «سبوت» كما في المصدر، من دون تقرير لاهوتي إضافي.
