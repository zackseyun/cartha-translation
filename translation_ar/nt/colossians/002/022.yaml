  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: ar
  text: وكلُّها تفنى بالاستعمال،[a] وفقًا لوصايا البشر وتعاليمهم.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وكلُّها صائرة إلى الفناء باستعمالها». تفيد اليونانية أن الأشياء المقصودة مؤقتة وتُستهلك عند استعمالها.'
    reason: lexical_alternative
  - marker: b
    text: يُحتمل أن تكون عبارة «وصايا البشر وتعاليمهم» صدى لإشعياء 29:13، وهي تؤكد أن مصدر هذه الأحكام بشري.
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: وكلُّها
  rationale: يعود الضمير الموصول المحايد الجمع إلى الأشياء التي تناولتها المحظورات في الآية السابقة. صيغت العبارة بالعربية على نحو طبيعي مع إبقاء مرجعها مفتوحًا للسياق.
- source_word: εἰς φθορὰν τῇ ἀποχρήσει
  choice: تزول بالاستعمال
  rationale: تفيد العبارة أن هذه الأشياء مآلها الفناء أو النفاد حين تُستعمل. و«تزول بالاستعمال» موجزة وطبيعية، وتحفظ الصلة بين زوالها واستعمالها دون المبالغة في معنى الهلاك.
- source_word: κατὰ
  choice: وفقًا لـ
  rationale: تدل هنا على المعيار أو الأساس الذي تقوم عليه تلك الضوابط.
- source_word: ἐντάλματα
  choice: وصايا
  rationale: تنقل المعنى التنظيمي الرسمي للكلمة، وتحافظ على الصدى المحتمل لإشعياء 29:13.
- source_word: διδασκαλίας
  choice: تعاليم
  rationale: مقابل عربي واضح ومألوف، ولا يحمّل اللفظة معنى اصطلاحيًا مذهبيًا زائدًا.
- source_word: τῶν ἀνθρώπων
  choice: البشر
  rationale: المقصود الأصل البشري لهذه الوصايا في مقابل ما هو من الله؛ و«البشر» تشمل الناس عمومًا بوضوح في العربية المعاصرة.
theological_decisions:
- issue: علاقة العبارة التفسيرية بالأحكام التقشفية المذكورة في السياق
  choice: تصف الآية الأشياء الخاضعة للمحظورات بأنها تزول بالاستعمال، ثم تصف الأحكام بأنها قائمة على وصايا بشرية وتعاليم بشرية.
  alternative: يمكن فهم العبارة بحدة أكبر على أنها ازدراء للأحكام نفسها لأنها تنشغل بأشياء فانية.
  rationale: ظاهر التركيب اليوناني يجعل «كلها» عائدة إلى الأشياء، مع بقاء نقد الأحكام البشرية واضحًا. لا تفصل الصياغة العربية أكثر مما يفصل النص بين نقد الأشياء المنظمة ونقد التنظيمات ذاتها.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ورصينة. استُعملت «البشر» بدل «الناس» لإبراز المقابلة بين المصدر البشري والمصدر الإلهي، من غير إيحاء بأن المقصود الذكور وحدهم.
