  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: ar
  text: فمع أني غائب عنكم بالجسد، فأنا معكم بالروح[a]، فرحًا وأنا أرى حسن نظامكم ورسوخ إيمانكم بالمسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «بروحي». والمقابلة مع «بالجسد» ترجّح أن بولس يقصد حضوره الشخصي غير الجسدي، مع بقاء احتمال الإشارة إلى الروح القدس.'
    reason: theological_ambiguity
  - marker: b
    text: 'أو: «رسوخ أمانتكم للمسيح».'
    reason: alternative_reading
lexical_decisions:
- source_word: τῇ σαρκί
  choice: بالجسد
  rationale: يشير السياق إلى الغياب الجسدي أو المكاني، لا إلى المعنى الأخلاقي لكلمة «الجسد»، كما يحافظ هذا التعبير على المقابلة مع «بالروح».
- source_word: τῷ πνεύματι
  choice: بالروح
  rationale: يحافظ على المقابلة المباشرة مع «بالجسد» وعلى قدر من الغموض في اليونانية، من غير الجزم بآلية هذا الحضور غير الجسدي.
- source_word: χαίρων καὶ βλέπων
  choice: فرحًا إذ أرى
  rationale: ينقل الفعلين المعاصرين للفعل الرئيس بصياغة عربية طبيعية، مع إبقاء الفرح مرتبطًا برؤية حال الجماعة.
- source_word: τὴν τάξιν
  choice: حسن نظامكم
  rationale: تفيد τάξις الترتيب والانضباط المحمودين؛ وإضافة «حسن» تُظهر دلالة المديح التي يقتضيها السياق.
- source_word: τὸ στερέωμα
  choice: رسوخ
  rationale: ينقل معنى الصلابة والثبات بصورة عربية مألوفة عند الحديث عن الإيمان.
- source_word: πίστεως
  choice: إيمانكم
  rationale: «الإيمان» هو المعنى الأرجح في تركيب الإيمان بالمسيح، مع حفظ احتمال معنى الأمانة في حاشية.
- source_word: εἰς Χριστόν
  choice: بالمسيح
  rationale: تدل εἰς هنا على متعلَّق الإيمان ووجهته، ويعبّر حرف الباء عن ذلك طبيعيًا في العربية. و«المسيح» لقب عربي راسخ يقابل Χριστός.
theological_decisions:
- issue: مرجع «الروح» في المقابلة بين الجسد والروح
  choice: الإبقاء على «بالروح» في المتن
  alternative: «بروحي»، أو فهم العبارة على أنها إشارة إلى الروح القدس
  rationale: المقابلة مع الغياب بالجسد ترجّح حضور بولس الشخصي غير الجسدي، لكن التعبير اليوناني لا يصرّح بضمير الملكية ولا يحسم تمامًا احتمال الصلة بالروح القدس؛ لذلك حُفظ الغموض مع توضيحه في الحاشية.
- issue: دلالة πίστις الموجَّهة إلى المسيح
  choice: إيمانكم بالمسيح
  alternative: أمانتكم للمسيح
  rationale: الإيمان هو القراءة الأشيع والأطبع في هذا التركيب، بينما يظل معنى الأمانة ممكنًا معجميًا ويُذكر في الحاشية بدل فرضه في المتن.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: لا بديل دلالي مطلوب في العربية
  rationale: «المسيح» هو المقابل العربي اللقبي المباشر لـΧριστός ويحافظ على وظيفته بوصفه لقبًا.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة، ذات نبرة كريمة من غير تكلف. استُخدم «فمع أن» لنقل البنية التنازلية εἰ γὰρ καί طبيعيًا، وحُفظت المقابلة بين الجسد والروح، كما نُقلت صورتا النظام والرسوخ دون صبغة عسكرية زائدة.
