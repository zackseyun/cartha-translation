base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: ar
  text: احذروا أن يسبيكم أحد بالفلسفة والخداع الباطل، وفقًا لتقليد البشر، ووفقًا لمبادئ العالم الأولية[a]، لا وفقًا للمسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قوى العالم الروحية الأولية». فالعبارة اليونانية قد تشير إلى المبادئ أو العناصر الأولية، أو إلى قوى روحية كونية.
    reason: alternative_reading
  - marker: b
    text: اليونانية «خريستوس»، وهو لقب يعني «الممسوح».
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: احذروا أن... أحد
  rationale: صيغة الأمر تفيد التحذير من خطر محتمل، وهذه صياغة عربية طبيعية تحافظ على قوة التنبيه.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: يسبيكم
  rationale: الفعل يصوّر حمل الناس أسرى أو غنيمة؛ و«يسبيكم» يحفظ صورة الأسر بإيجاز ووضوح.
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: بالفلسفة والخداع الفارغ
  rationale: الباء تؤدي معنى الوسيلة، والعطف يبقي «الفلسفة» و«الخداع الفارغ» عبارتين مرتبطتين من غير الجزم بأن الثانية بدل تفسيري من الأولى.
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: وفقًا لتقليد البشر
  rationale: تحفظ العبارة معنى المعيار أو النهج، و«البشر» تعبير عام غير مقصور على الذكور.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: وفقًا لأركان العالم
  rationale: «أركان» تحتمل العناصر أو المبادئ الأساسية، فلا تحسم وحدها الإشارة إلى مبادئ مجردة أو قوى كونية؛ وتوضح الحاشية الاحتمال الآخر.
- source_word: οὐ κατὰ Χριστόν
  choice: لا وفقًا للمسيح
  rationale: تحافظ «المسيح» على معنى اللقب في Χριστός وعلى المقابلة بينه وبين التقليد البشري وأركان العالم.
theological_decisions:
- issue: دلالة στοιχεῖα τοῦ κόσμου
  choice: أركان العالم
  alternative: قوى العالم الروحية الأولية
  rationale: العبارة اليونانية محتملة الدلالة، فقد تشير إلى العناصر أو المبادئ الأساسية، وقد تشير إلى قوى روحية كونية. اختير تعبير موجز لا يحسم الخلاف، مع إثبات البديل في الحاشية.
- issue: دلالة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني، ويحفظ هنا معناه اللقبي من غير تحويله إلى مجرد اسم علم.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «احذروا» لقوة التحذير، و«يسبيكم» للمحافظة على استعارة الأسر، مع تكرار «وفقًا» لإظهار التوازي في الأصل.
