  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: ar
  text: إذ دُفنتم معه في المعمودية[a]، وفيها أُقمتم أيضًا معه، بالإيمان[b] بعمل الله الذي أقامه من بين الأموات.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «فيه»، إذا عُدَّ الضمير عائدًا إلى المسيح لا إلى المعمودية.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «بالثقة». وقد تحمل الكلمة اليونانية أيضًا معنى «الأمانة» في بعض السياقات، لكن «الإيمان» هو الأرجح هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες αὐτῷ
  choice: إذ دُفنتم معه
  rationale: يحفظ معنى الدفن مع المسيح الذي تدل عليه السابقة συν-، ويصوغ اسم المفعول اليوناني تركيبًا عربيًا طبيعيًا مرتبطًا بالسياق السابق.
- source_word: ἐν τῷ βαπτισμῷ
  choice: في المعمودية
  rationale: تحافظ «في» على التداخل المكاني والوسائلي في ἐν من غير حسم لطبيعة فاعلية المعمودية حسمًا مذهبيًا.
- source_word: ἐν ᾧ
  choice: وفيها
  rationale: المرجع النحوي الأقرب هو «المعمودية»، ولذلك جاء الضمير مؤنثًا في العربية، مع إثبات احتمال عوده إلى المسيح في الحاشية.
- source_word: καὶ συνηγέρθητε
  choice: أُقمتم أيضًا معه
  rationale: تفيد صيغة المبني للمجهول أن الله هو المقيم، وتُظهر «معه» دلالة السابقة συν- على المشاركة والاتحاد.
- source_word: διὰ τῆς πίστεως
  choice: بالإيمان
  rationale: تنقل διά معنى الوسيلة، و«الإيمان» هو المقابل الأرجح لـ πίστις هنا، مع ذكر البديل المعجمي في الحاشية.
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: بعمل الله
  rationale: تعبر «عمل» عن نشاط الله الفاعل، لا عن قدرة مجردة، وتحافظ على ارتباط الإيمان بهذا العمل.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: الذي أقامه من بين الأموات
  rationale: صياغة عربية واضحة تحفظ وصف الله بأنه الذي أقام المسيح، وتنقل تعبير القيامة الاصطلاحي ἐκ νεκρῶν.
theological_decisions:
- issue: مرجع ἐν ᾧ
  choice: 'عود الضمير إلى المعمودية: «وفيها»'
  alternative: 'عود الضمير إلى المسيح: «وفيه»'
  rationale: «المعمودية» هي السابقة النحوية الأقرب، لكن صورة الضمير اليونانية تحتمل من حيث الصيغة عوده إلى المسيح؛ لذلك لم يُطمس الاحتمال البديل.
- issue: دلالة لغة المعمودية
  choice: الإبقاء على الصلة القوية بين الدفن والإقامة مع المسيح وبين المعمودية والإيمان
  alternative: تفسيرها تفسيرًا أسراريًا حصريًا أو رمزيًا محضًا
  rationale: النص يجمع هذه العناصر من غير أن يفصل نظرية مذهبية لاحقة عن كيفية فاعلية المعمودية، فحافظت الصياغة على هذا التوتر.
- issue: علاقة الإيمان بعمل الله
  choice: «بالإيمان بعمل الله»
  alternative: «بأمانة عمل الله» أو فهم الإضافة على أنها إيمان ناشئ من عمل الله
  rationale: السياق يرجح أن عمل الله هو متعلق الإيمان، مع بقاء المجال الدلالي لـ πίστις أوسع من مقابل واحد في جميع السياقات.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُخدم المبني للمجهول «دُفنتم» و«أُقمتم» لإبراز فعل الله من غير إثقال، وأُبقيت لغة المشاركة مع المسيح والمعمودية والإيمان كما في الأصل من غير إضافة تفسير طائفي.
