  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: ar
  text: إن هذه الأمور لها مظهر الحكمة[a] في عبادة يبتدعها الإنسان[b]، وتواضع، ومعاملة قاسية للجسد[d]، لكنها لا قيمة لها في مقاومة إشباع رغبات الجسد.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لها بالفعل صيت بالحكمة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عبادة يفرضها الإنسان على نفسه»؛ وحرفيًا تقريبًا: «عبادة الإرادة».'
    reason: lexical_alternative
  - marker: c
    text: 'العبارة الختامية عسيرة. ويمكن ترجمتها أيضًا: «وليست في كرامة ما، لإشباع الجسد»، أو: «ولا تنطوي على أي إكرام للجسد في مواجهة إشباعه».'
    reason: alternative_reading
  - marker: d
    text: قد يشير «الجسد» هنا إلى الرغبات البشرية الساقطة؛ وقارن استعمال بولس للكلمة في سياقات أخرى.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: هذه
  rationale: تعود على الفرائض المذكورة في الآيتين السابقتين، وتحافظ على قوة الإحالة في اليونانية.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: لها بالفعل مظهر الحكمة
  rationale: ينقل التعبير معنى السمعة أو المظهر، وتحفظ «بالفعل» النبرة الإقرارية التي تمهّد للمقابلة اللاحقة.
- source_word: ἐθελοθρησκίᾳ
  choice: عبادة من ابتداع الإنسان
  rationale: يدل اللفظ النادر على ممارسة تعبدية منشؤها إرادة الإنسان، لا على العبادة المأمور بها؛ وهذه الصياغة واضحة من غير تحميل مذهبي.
- source_word: ταπεινοφροσύνῃ
  choice: تواضع
  rationale: يحافظ على المعنى المعجمي المباشر، ويترك للسياق أن يبيّن ما قد يكون فيه من تصنع أو نزعة نسكية.
- source_word: ἀφειδίᾳ σώματος
  choice: معاملة قاسية للجسد
  rationale: ينقل معنى الشدة وعدم الرفق بالجسد بصياغة عربية طبيعية.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: لا قيمة لها
  rationale: يفهم τιμή هنا بمعنى القيمة أو الجدوى، بما يلائم المقابلة بين مظهر الحكمة والعجز الفعلي، مع إثبات غموض العبارة في الحاشية.
- source_word: πρὸς πλησμονὴν
  choice: في مقاومة إشباع رغبات
  rationale: يفهم πρός في معنى المواجهة أو الكبح، ويفسر الإشباع بوصفه إرضاء الرغبات؛ لأن «إشباع الجسد» وحدها قد توهم مجرد سد الحاجة البدنية.
- source_word: τῆς σαρκός
  choice: الجسد
  rationale: يحافظ على اللفظ البولسي المتوتر دلاليًا من غير استبداله بتفسير عقائدي مثل «الطبيعة الخاطئة»، مع توضيح الاحتمال المقصود في الحاشية.
theological_decisions:
- issue: معنى العبارة الختامية الصعبة οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός
  choice: هذه الممارسات لا قيمة لها في مقاومة إشباع رغبات الجسد.
  alternative: ليست لها كرامة ما، بل تؤدي إلى إشباع الجسد؛ أو لا تنطوي على إكرام للجسد، مع قصد الحد من إشباعه.
  rationale: تركيب اليونانية موجز وملتبس. القراءة المختارة تلائم سياق نقد الفرائض النسكية التي تبدو حكيمة من غير أن تملك قوة لكبح الرغبات، بينما تحفظ الحاشية القراءات النحوية الأخرى.
- issue: دلالة σάρξ في السياق
  choice: الجسد، مع احتمال الإشارة إلى الرغبات البشرية الساقطة
  alternative: الطبيعة الخاطئة
  rationale: الترجمة الحرفية النسبية تصون التوتر اللاهوتي والدلالي في استعمال بولس، ولا تحسم أن المراد كيان أنثروبولوجي محدد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «عبادة من ابتداع الإنسان» بدل المصطلحات التراثية الغامضة، وحُفظت صعوبة الخاتمة في حاشية بدل طمسها. وُزعت علامات الحواشي في مواضعها الدلالية داخل النص.
