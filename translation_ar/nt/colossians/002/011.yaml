  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «وفيه» لـἐν ᾧ، والمبني للمجهول «خُتِنتم»، والختان غير المصنوع بيد، وصورة خلع «جسد اللحم»، ثم الإضافة المفتوحة في «ختان المسيح». واستعمال الباء في «بخلع» و«بختان» عربي سليم للدلالة الملابِسة أو الوسيلية الممكنة لـἐν، ولا يحسم ما تركه الأصل مفتوحًا.'
