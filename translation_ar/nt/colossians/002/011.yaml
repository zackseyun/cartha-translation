  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: ar
  text: وفيه أيضًا خُتِنتم ختانًا غير مصنوع بيدٍ[a]، بخلع جسد اللحم[b][c]، بختان المسيح[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ختانًا لم تصنعه الأيدي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بنزع جسد اللحم» أو «بتجريد جسد اللحم».'
    reason: lexical_alternative
  - marker: c
    text: يمكن تفسير «اللحم» تفسيريًا بمعنى «الطبيعة الخاطئة»، لكن الترجمة تُبقي اللفظ أقرب إلى اليونانية.
    reason: lexical_alternative
  - marker: d
    text: 'أو: «في ختان المسيح». وقد تعني العبارة الختان الذي يجريه المسيح، أو الذي يخصه، أو المرتبط به.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: وفيه
  rationale: يعود الضمير الموصول إلى المسيح في السياق السابق، و«فيه» عربية طبيعية تحفظ معنى الاتحاد بالمسيح.
- source_word: περιετμήθητε
  choice: خُتِنتم
  rationale: فعل ماضٍ مبني للمجهول يدل على فعل مكتمل، وتُحفظ فيه استعارة الختان من غير شرح تفسيري.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: ختانًا غير مصنوع بيدٍ
  rationale: يحفظ التعبير المقابلة الكتابية بين ما تصنعه اليد البشرية وما ليس من صنع البشر، مع صياغة عربية واضحة.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: بخلع
  rationale: الاسم اليوناني يفيد النزع أو التجريد؛ و«خلع» يحفظ الصورة المجازية، كما أن الباء تلائم الدلالة الوسيلية المحتملة لـἐν.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: جسد اللحم
  rationale: صياغة قريبة من تركيب الأصل، تُبقي العلاقة بين «الجسد» و«اللحم» مفتوحة ولا تستبدلها بتفسير عقائدي مثل «الطبيعة الخاطئة».
- source_word: σαρκός
  choice: اللحم
  rationale: اختيار حرفي واضح يحفظ النسيج البولسي والغموض الدلالي، بدل تضييق المعنى إلى تفسير أخلاقي واحد.
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: بختان المسيح
  rationale: 'يحفظ المضاف إليه «المسيح» انفتاح العلاقة: ختان يجريه المسيح، أو يخصه، أو يرتبط به؛ والباء عربية سائغة مع بقاء البديل «في ختان المسيح» في الحاشية.'
theological_decisions:
- issue: معنى «ختان المسيح»
  choice: 'الإبقاء على الإضافة المفتوحة: «ختان المسيح»'
  alternative: الختان الذي يجريه المسيح؛ أو ختان المسيح نفسه؛ أو الختان الخاص بالمسيح وشعبه
  rationale: الإضافة اليونانية τοῦ Χριστοῦ متعددة الاحتمال، فلا يُحسم المقصود لصالح قراءة لاهوتية واحدة.
- issue: معنى «جسد اللحم»
  choice: الإبقاء على العبارة القريبة من الأصل
  alternative: الجسد اللحمي؛ طبيعة الخطية؛ الجسد الخاضع للحم
  rationale: التركيب صعب تفسيريًا، والترجمة الحرفية نسبيًا تتجنب إدخال توسعات مخطوطية لاحقة أو حسم أنثروبولوجي غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم «المسيح» مقابل Χριστός بوصفه اللقب العربي المألوف، وحُفظت استعارات الختان والخلع واللحم من غير تفكيك تفسيري.
