  terminology: «المسيح» هو المقابل العربي المألوف لـΧριστός. كما أن «اللحم» يحافظ على دلالة σάρξ من غير اختزالها إلى «الطبيعة الخاطئة»، و«ختان المسيح» يترك الإضافة اليونانية متعددة الاحتمال كما ينبغي.
