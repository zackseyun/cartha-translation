  yaml_path: translation/nt/colossians/002/009.yaml
  text: For in him all the fullness of deity dwells bodily,[a]
translation:
  language: ar
  text: لأن ملء الألوهية كله يسكن فيه جسديًا،[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن كل ملء اللاهوت يحل فيه جسديًا».'
    reason: بديل لفظي يحافظ على الصياغة العربية الكنسية المألوفة وعلى ترتيب أقرب إلى بنية اليونانية.
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تؤدي الأداة معنى التعليل الذي يربط هذه العبارة بما قبلها، من غير إضافة معنى غير موجود في النص.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: ترجمة مكانية مباشرة للعبارة العائدة إلى المسيح، بلا إضافة ما يفيد الحصر.
- source_word: κατοικεῖ
  choice: يسكن
  rationale: تفيد سكنًا ثابتًا ومستمرًا، وهي واضحة في العربية المعاصرة وتحافظ على قوة الفعل.
- source_word: πᾶν τὸ πλήρωμα
  choice: الملء كله
  rationale: يحافظ هذا التركيب على معنى الشمول التام، مع ترتيب عربي طبيعي.
- source_word: τῆς θεότητος
  choice: الألوهية
  rationale: تنقل اللفظة اليونانية الدالة على حقيقة كون الله إلهًا، لا على مجرد صفات إلهية عامة.
- source_word: σωματικῶς
  choice: جسديًا
  rationale: ترجمة موجزة ومباشرة للظرف، وتحفظ مجال دلالته من غير تقييده بتفسير تجسدي أو أسراري بعينه.
theological_decisions:
- issue: قوة دلالة θεότης وσωματικῶς في الحديث عن المسيح
  choice: تقرر الآية أن ملء الألوهية كله يسكن في المسيح جسديًا.
  alternative: أن يكون الكلام عن صفات إلهية أو عن حضور الله في المسيح بمعنى أضعف.
  rationale: لفظة θεότης أقوى من مجرد وصف صفات إلهية، وσωματικῶς تصف هذا السكن بأنه جسدي؛ لذلك ينبغي إبقاء العبارة بقوتها مع عدم تجاوز ما يقوله النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «يسكن» بدل «يحل» في المتن لتجنب التباس الفعل غير المشكول في القراءة الحديثة، مع إثبات الصياغة التقليدية في الحاشية.
