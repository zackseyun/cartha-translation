  source_fidelity: 'ينقل المتن عناصر اليونانية كلها بأمانة: «لأن» للتعليل في ὅτι، و«فيه» لـἐν αὐτῷ، و«يسكن» للفعل κατοικεῖ بصيغته المستمرة، و«ملء الألوهية كله» للشمول في πᾶν τὸ πλήρωμα τῆς θεότητος، و«جسديًا» لـσωματικῶς. ولا يضيف قصرًا أو تفسيرًا عقائديًا زائدًا.'
  naturalness: 'الصياغة فصيحة واضحة ومناسبة للعربية المعاصرة: «لأن ملء الألوهية كله يسكن فيه جسديًا». وترتيب «ملء الألوهية كله» طبيعي ويؤكد الشمول من غير إطالة.'
  terminology: «الألوهية» مناسبة لـθεότης، إذ تحفظ دلالة حقيقة الألوهية ولا تختزلها إلى صفات إلهية. و«جسديًا» ترجمة مباشرة مقتضبة لـσωματικῶς. والحاشية تقدم «اللاهوت» بوصفه بديلًا كنسيًا مألوفًا دون أن تجعل المصطلح التقليدي إلزاميًا.
