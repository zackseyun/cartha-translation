  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: ar
  text: لا يحرمنّكم أحدٌ من الجائزة، مولَعًا بالتواضع وعبادة الملائكة[a]، خائضًا فيما رآه[b]، ومنتفخًا باطلًا بعقل جسده،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «ديانة الملائكة»، أو «العبادة مع الملائكة». تحتمل العبارة اليونانية أكثر من معنى.
    reason: alternative_reading
  - marker: b
    text: 'الفعل اليوناني نادر وصعب، وقد يُترجم: «متوغّلًا فيما رآه» أو «داخلًا فيما رآه». وتقرأ بعض المخطوطات «فيما لم يره»، فيكون المعنى نحو: «خائضًا فيما لم يره».'
    reason: lexical_and_textual_variant
lexical_decisions:
- source_word: καταβραβευέτω
  choice: يَحرِمْكم من الجائزة
  rationale: يحفظ صورة الفعل المرتبطة بالحَكَم الذي يقضي على شخص بحرمانه من الجائزة، وهو أوضح عربيًا من «يستبعدكم» في هذا السياق.
- source_word: θέλων
  choice: راغبًا في
  rationale: ينقل معنى الميل والاختيار المتعمّد من غير أن يحسم إن كان المقصود التلذذ أو الإصرار.
- source_word: ταπεινοφροσύνῃ
  choice: التواضع
  rationale: هو المقابل المباشر للاسم اليوناني، مع ترك السياق يُظهر أن التواضع المذكور قد يكون متكلَّفًا أو زائفًا.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: عبادة الملائكة
  rationale: يتبع القراءة الإضافية الموضوعية الشائعة، أي العبادة الموجَّهة إلى الملائكة، مع إثبات الاحتمالات الأخرى في الحاشية.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: مستغرقًا فيما رآه
  rationale: الفعل نادر ومشكل؛ وهذه الصياغة تحافظ على معنى الخوض أو التوغّل في المرئيات من غير إضافة تفسير مطوّل عن الرؤى.
- source_word: εἰκῇ
  choice: باطلًا
  rationale: يدل على انتفاخ بلا أساس أو جدوى، و«باطلًا» موجزة وطبيعية.
- source_word: φυσιούμενος
  choice: منتفخًا
  rationale: يحفظ استعارة بولس للتكبّر والغرور.
- source_word: νοὸς
  choice: ذهن
  rationale: مقابل عربي مباشر يحافظ على تركيب العبارة ومفارقتها.
- source_word: σαρκὸς
  choice: جسد
  rationale: يحافظ على اللفظ الأنثروبولوجي الحسي ولا يستبدله بتفسير مذهبي مثل «الطبيعة الخاطئة».
theological_decisions:
- issue: دلالة θρησκείᾳ τῶν ἀγγέλων
  choice: عبادة موجَّهة إلى الملائكة
  alternative: عبادة الملائكة أنفسهم، أو العبادة مع الملائكة
  rationale: الإضافة اليونانية تحتمل أكثر من علاقة. اختيرت القراءة الموضوعية الشائعة في المتن، مع إبقاء البدائل في الحاشية صونًا للغموض الحقيقي.
- issue: دلالة σάρξ في τῆς σαρκὸς αὐτοῦ
  choice: جسد
  alternative: الطبيعة الخاطئة أو التفكير الجسدي
  rationale: الترجمة الحرفية تحفظ التوتر في اصطلاح بولس ولا تُدخل شرحًا لاهوتيًا في صلب النص.
- issue: الاختلاف النصي في ἃ ἑόρακεν
  choice: فيما رآه
  alternative: فيما لم يره
  rationale: يتبع المتن نص SBLGNT، ويُذكر اختلاف بعض المخطوطات في الحاشية.
translation_notes:
  register: عربية فصحى حديثة ذات نبرة كتابية كريمة. حُفظت استعارتا الحرمان من الجائزة والانتفاخ، كما أُبقي تركيب «ذهن جسده» على غرابته النسبية لصيانة التوتر الدلالي في الأصل.
