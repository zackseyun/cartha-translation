  - severity: low
    issue: عدم تكرار «في» قبل «غُرلة جسدكم»
    rationale: حرف الجر ἐν يحكم الاسمين المعطوفين. يجوز الحذف عربيًا، لكن التكرار هنا أوضح وأقرب إلى البنية المصدرية.
  - severity: low
    issue: «زلات» قد تضعف دلالة παραπτώματα
    rationale: «تعديات» تؤدي بصورة أوضح معنى المخالفات/التجاوزات المقصودة في السياق، مع إمكان إيراد «زلات» بديلًا في الحاشية.
  - severity: low
