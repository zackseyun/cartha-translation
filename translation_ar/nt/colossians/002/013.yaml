  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: ar
  text: وأنتم، أمواتًا في تعدياتكم[a] وفي غُرلة جسدكم[b]، أحياكم معه، إذ غفر لنا[c] جميع تعدياتنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «زلاتكم».'
    reason: lexical_alternative
  - marker: b
    text: تشير «غُرلة جسدكم» مباشرةً إلى حالتهم الجسدية بوصفهم غير مختونين، مع أن لها في السياق دلالة روحية أيضًا.
    reason: cultural_note
  - marker: c
    text: 'ينتقل النص اليوناني هنا من ضمير المخاطبين «كم» إلى ضمير المتكلمين «لنا»: «إذ غفر لنا جميع تعدياتنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: إذ كنتم أمواتًا
  rationale: ينقل تركيب الحال اليوناني بعبارة عربية طبيعية، ويحافظ على وصف حالتهم بالموت دون تحويله إلى تعليل.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: في زلاتكم
  rationale: تحافظ «في» على صورة ἐν بوصفها حالة أو نطاقًا، و«زلات» تؤدي معنى παραπτώματα من غير حصره في سبب مباشر.
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: غُرلة جسدكم
  rationale: «الغُرلة» تعبر عن حالة عدم الختان، و«الجسد» يحفظ الدلالة البدنية المباشرة لـσάρξ من غير تفسيرها بأنها الطبيعة الخاطئة.
- source_word: συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ
  choice: أحياكم معه
  rationale: الفعل العربي مع «معه» ينقل معنى الإحياء بالمشاركة الذي يجمعه الفعل المركب مع σύν، من غير تكرار عربي ثقيل.
- source_word: χαρισάμενος
  choice: إذ غفر
  rationale: ينقل معنى الغفران المتفضل به ويربطه بالفعل الرئيس مع إبقاء العلاقة الظرفية في اليونانية غير محصورة في ترتيب زمني صارم.
- source_word: ἡμῖν
  choice: لنا
  rationale: يحفظ التحول الصريح في اليونانية من خطاب «أنتم/كم» إلى المتكلم الجمع «لنا» ولا ينسقه على ضمير المخاطبين.
- source_word: πάντα τὰ παραπτώματα
  choice: جميع الزلات
  rationale: يحافظ على شمول πάντα وعلى الاتساق المعجمي مع ورود παραπτώματα الأول.
theological_decisions:
- issue: دلالة σάρξ في «غُرلة جسدكم»
  choice: الجسد بالمعنى البدني المباشر مع إمكان وجود صدى روحي في السياق
  alternative: الطبيعة الخاطئة
  rationale: سياق الختان في كولوسي 2:11 يجعل الدلالة الجسدية هي الأقرب، أما «الطبيعة الخاطئة» فتحسم معنى مجازيًا لا يفرضه النص.
- issue: مرجع αὐτῷ في «معه»
  choice: الإبقاء على الضمير، ومرجعه السياقي المسيح
  alternative: التصريح بلفظ «المسيح» أو إرجاع الضمير إلى الله بمعنى أوسع
  rationale: السياق السابق يتحدث عن الدفن والقيامة مع المسيح، لكن حفظ الضمير يلتزم بصياغة النص ولا يستبدل المرجع المفسَّر بالضمير.
- issue: التحول من ὑμᾶς إلى ἡμῖν
  choice: حفظ الانتقال من «كم» إلى «لنا»
  alternative: توحيد الضمائر إلى «لكم» أو توسيعها إلى «لنا جميعًا»
  rationale: التحول موجود في النص اليوناني وقد يكون ذا دلالة خطابية أو لاهوتية؛ توحيده يزيل توترًا نصيًا حقيقيًا.
translation_notes:
  register: عربية فصحى حديثة ذات نبرة كتابية رصينة ومفهومة. استُعملت «غُرلة» لدقتها في سياق الختان، مع شرحها في الحاشية، وحُفظ اختلاف الضمائر والغموض التركيبي دون تسويتهما.
