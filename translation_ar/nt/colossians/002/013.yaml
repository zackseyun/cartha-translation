review_pass:
  verdict: revise
  source_fidelity: يلزم حذف «أيضًا» لأنها زيادة لا يقابلها عنصر في النص اليوناني. كما أن إعادة حرف الجر «في» قبل العبارة الثانية توضح أن «في» تحكم كلاً من «التعديات» و«غُرلة الجسد». ويستحسن أن يُظهر التركيب العربي بوضوح أن الغفران يتناول تعديات «نا»، مع الحفاظ على الانتقال اليوناني من المخاطَب إلى المتكلمين.
  naturalness: «وأنتم، أمواتًا...» صياغة عربية فصيحة وطبيعية تؤدي الحال اليونانية من غير أن توحي بسببية أقوى مما في الأصل. و«غُرلة جسدكم» مصطلح دقيق، وتكفي الحاشية لبيانه.
  terminology: «تعديات» أدق في هذا السياق من «زلات»، إذ إن «زلات» قد توحي بهفوات عارضة. وتُستعمل «غُرلة» مع الشرح، ويُحافَظ على «الجسد» دون إدخال تفسير «الطبيعة الخاطئة».
