translation:
  language: ar
  text: إذ محا سندَ الدَّين القائم علينا[a]، بما فيه من أحكام[b]، وكان ضدَّنا، وقد أزاله من الطريق، إذ سمَّره على الصليب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «صكَّ المديونية» أو «الوثيقة المكتوبة». يمكن أن يدل اللفظ اليوناني على سند دين مكتوب بخط اليد أو على وثيقة تثبت التزامًا قانونيًا.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «في أحكام» أو «مؤلَّفًا من أحكام». وقد تعني العبارة أن سند الدين كان مدوَّنًا في أحكام أو متجسدًا فيها.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαλείψας
  choice: إذ محا
  rationale: ينقل صورة إزالة كتابة أو طمسها، ويحافظ على ارتباط اسم الفاعل اليوناني بالفعل الرئيس من غير تكلف في العربية.
- source_word: χειρόγραφον
  choice: سندَ الدَّين
  rationale: يدل اللفظ على وثيقة مكتوبة بخط اليد تثبت التزامًا أو مديونية؛ و«سند الدين» يحفظ جانبي الوثيقة والالتزام.
- source_word: καθ’ ἡμῶν
  choice: القائم علينا
  rationale: تعبير عربي طبيعي يفيد أن السند يحمل مطالبة ضدنا، مع بقاء معنى المواجهة القانونية.
- source_word: τοῖς δόγμασιν
  choice: بما فيه من أحكام
  rationale: صياغة مفهومة تنقل صلة الأحكام بسند الدين، مع التنبيه في الحاشية إلى الاحتمالات النحوية الأخرى وعدم حصر الأحكام في نظام لاهوتي بعينه.
- source_word: ὑπεναντίον
  choice: ضدَّنا
  rationale: يحفظ قوة المعارضة بعبارة مباشرة وواضحة.
- source_word: ἦρκεν ἐκ τοῦ μέσου
  choice: وقد أزاله من بيننا
  rationale: ينقل كمال الفعل ونتيجته المستمرة، ويعبّر طبيعيًا عن إزالة الشيء من الوسط بوصفه عائقًا قائمًا.
- source_word: προσηλώσας αὐτὸ τῷ σταυρῷ
  choice: إذ سمَّره على الصليب
  rationale: يحافظ على صورة التسمير وعلى علاقة الفعل الوسيلية أو المصاحبة بإزالة السند.
theological_decisions:
- issue: معنى χειρόγραφον τοῖς δόγμασιν
  choice: سند دين مرتبط بأحكام كانت مضمَّنة فيه أو مكوِّنة لمضمونه
  alternative: الشريعة الموسوية نفسها، أو قائمة بالخطايا، أو لائحة اتهام قانونية
  rationale: العبارة مجازية وتركيب الداتيف فيها محتمل. تحافظ الترجمة على صورة الوثيقة الملزمة من غير مساواتها صراحةً بالشريعة أو تبني تفسير مذهبي محدد.
- issue: فاعل ἦρκεν
  choice: فاعل مستتر يعود إلى الله بحسب سياق الجملة الأوسع
  alternative: ترك الفاعل غير محدد على نحو أقرب إلى صيغة إلهية ضمنية
  rationale: العربية تسمح بضمير مستتر في «أزاله»، والسياق السابق يدل على الله بوصفه الفاعل، من غير حاجة إلى إضافة الاسم صراحةً.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «سند الدين» للمحافظة على الصورة الوثائقية والقانونية، و«أزاله من بيننا» لنقل التعبير الاصطلاحي اليوناني بصورة طبيعية. وُضعت الحاشيتان عند موضعي الغموض المعجمي والنحوي مباشرةً.
