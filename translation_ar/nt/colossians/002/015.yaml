id: COL.2.15
reference: Colossians 2:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: ar
  text: وإذ جرَّد الرئاسات والسلطات من سلاحها، شهَّر بهم علنًا، واقتادهم في موكب نصره فيه.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«فيه»: قد يعود الضمير إلى المسيح؛ ويمكن أيضًا أن يُفهم: «به»، أي بالصليب المذكور في الآية السابقة.'
    reason: لأن مرجع الضمير اليوناني ἐν αὐτῷ محتمل، ولا يصح حسمه بلا تنبيه.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: جرَّد ... من سلاحها
  rationale: ينقل في السياق معنى نزع القوة والسلاح من الرئاسات والسلطات، مع أن المعنى الحرفي للفعل هو النزع أو التجريد.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: الرئاسات والسلطات
  rationale: يحافظ على المصطلحين اللذين يستعملهما بولس للقوى ذات السلطان، وهما هنا قوى روحية معادية بحسب السياق.
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: شهَّر بهم علنًا
  rationale: تعبير عربي طبيعي ينقل معنى عرضهم للعيان وإخزائهم على الملأ.
- source_word: θριαμβεύσας αὐτούς
  choice: اقتادهم في موكب نصره
  rationale: يحفظ صورة الموكب الروماني الانتصاري، بدل اختزالها في مجرد «انتصر عليهم».
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: يحافظ على الإحالة الضميرية الموجودة في اليونانية، من غير أن يحسم داخل المتن هل المقصود المسيح أم الصليب.
theological_decisions:
- issue: فاعل الأفعال في الآية
  choice: أُبقي الفاعل ضميرًا مستترًا يعود، بحسب السياق النحوي السابق، إلى الله
  alternative: اعتبار المسيح هو الفاعل
  rationale: الأفعال المتتابعة في كولوسي 2:13-15 تجعل الله أقرب مرجع نحوي، لكن عدم التصريح بالاسم في هذه الآية يحفظ صياغة الأصل ولا يحمّلها حسمًا زائدًا.
- issue: مرجع العبارة ἐν αὐτῷ
  choice: «فيه» في المتن مع بيان الاحتمالات في الحاشية
  alternative: «بالصليب» أو «في المسيح» صراحةً
  rationale: يمكن للضمير اليوناني أن يُفهم بمعنى «فيه»، عائدًا إلى المسيح، أو «به/فيه»، عائدًا إلى الصليب المذكور في الآية السابقة؛ لذلك ينبغي إبقاء التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت صورة «موكب النصر» لإبراز الدلالة التاريخية للفعل θριαμβεύω، ووُضع مؤشر الحاشية في المتن كما يلزم.
