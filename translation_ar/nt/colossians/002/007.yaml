  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: ar
  text: وقد تأصّلتم فيه، وتُبنَون فيه، وتُثبَّتون في الإيمان[a] كما عُلِّمتم، وتفيضون بالشكر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهمها: «بالإيمان»؛ أو: «في الأمانة». فاللفظة اليونانية قد تعني الإيمان أو الثقة أو الأمانة، غير أن «الإيمان» هنا يُرجَّح أن يشير إلى الإيمان الذي تعلّموه.'
    reason: بيان المجال الدلالي للفظة πίστις وحفظ قراءة بديلة ممكنة من غير إضافة ضمير ملكية أو فرضها على المتن.
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: إذ قد تأصّلتم
  rationale: اسم فاعل تام مبني للمجهول في اليونانية، يدل على فعل تمّ وبقي أثره. يحفظ التعبير صورة امتداد الجذور، وتؤدي «قد» دلالة الحالة الناتجة المستمرة بعبارة عربية طبيعية.
- source_word: ἐποικοδομούμενοι
  choice: وأنتم تُبنَون
  rationale: اسم فاعل مضارع مبني للمجهول، فيصوّر عملية بناء مستمرة. أبقينا استعارة البناء ولم نحوّلها إلى معنى عام مثل النمو أو التقوية.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: الضمير يعود إلى المسيح في السياق السابق، والنص اليوناني يستعمل ضميرًا، لذلك حُفظ الضمير من غير استبداله باسم أو لقب.
- source_word: βεβαιούμενοι
  choice: وتُثبَّتون
  rationale: ينقل معنى الجعل ثابتين أو راسخين، ويحفظ صيغة المبني للمجهول والاستمرار في اسم الفاعل المضارع.
- source_word: τῇ πίστει
  choice: في الإيمان
  rationale: وجود أداة التعريف، مع العبارة التالية «كما عُلِّمتم»، يرجّح الإشارة إلى الإيمان الذي تلقّوه تعليمًا، مع إبقاء اللفظ العربي قادرًا على الدلالة على الثقة المؤمنة أيضًا.
- source_word: καθὼς ἐδιδάχθητε
  choice: كما عُلِّمتم
  rationale: ترجمة مباشرة تحفظ المقارنة وصيغة المبني للمجهول، وتربط الثبات في الإيمان بالتعليم الذي تلقّوه.
- source_word: περισσεύοντες
  choice: وتفيضون
  rationale: يحفظ صورة الوفرة المتجاوزة والحدث المستمر، وهو تعبير عربي حي وطبيعي مع الشكر.
- source_word: ἐν εὐχαριστίᾳ
  choice: بالشكر
  rationale: الباء هي الصياغة العربية المألوفة مع «تفيضون»، وتنقل معنى εὐχαριστία بوصفه شكرًا لا مجرد شعور داخلي بالامتنان.
theological_decisions:
- issue: دلالة τῇ πίστει
  choice: «في الإيمان»، مع ترجيح الإيمان المعلَّم أو مضمون الإيمان
  alternative: «في إيمانكم» بمعنى الثقة الشخصية، أو «في الأمانة»
  rationale: أداة التعريف والقول «كما عُلِّمتم» يرجّحان معنى الإيمان الذي تلقّوه في التعليم، لكن اللفظة اليونانية πίστις قد تدل أيضًا على الإيمان أو الثقة أو الأمانة؛ لذلك لم يُحسم مدى الدلالة في المتن بتفسير زائد، وذُكرت البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت جملة «إذ قد… وأنتم…» لإظهار الفرق بين التأصّل الذي تمّ وبقي أثره، وبين البناء والتثبيت المستمرين. وحُفظت استعارتا الجذور والبناء، مع تكرار «فيه» منعًا لالتباس تعلّق شبه الجملة.
