translation:
  language: ar
  text: لكي تتشجّع قلوبهم[a]، وهم متّحدون في المحبّة، وينالوا كل الغنى الذي في اليقين التامّ الناشئ عن الفهم، ويصلوا إلى معرفة[b] سرّ الله، المسيح[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لكي تتعزّى قلوبهم» أو «لكي تتقوّى قلوبهم». يدل الفعل هنا على التشجيع والتثبيت، وقد يشمل التعزية.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «معرفة وافية»، لأن اللفظ اليوناني قد يفيد معرفة أتمّ أو أعمق.'
    reason: lexical_alternative
  - marker: c
    text: 'العبارة اليونانية موجزة وصعبة: «سرّ الله، المسيح». وقد يكون «المسيح» بدلًا يبيّن أن سرّ الله هو المسيح؛ ويمكن عندئذ ترجمتها: «سرّ الله، أي المسيح».'
    reason: alternative_reading
  - marker: d
    text: تورد بعض المخطوطات قراءة أطول، مثل «سرّ الله، الآب، والمسيح». تتبع الترجمة هنا القراءة الأقصر في النص اليوناني المقدم.
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν
