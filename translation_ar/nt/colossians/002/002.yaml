  rationale: صيغة اسم الفاعل اليونانية تعود إلى الأشخاص، وتدل هنا على ضمّهم بعضهم إلى بعض في رابطة وثيقة؛ وهذا أنسب مع عبارة «بالمحبّة».
- source_word: ἐν ἀγάπῃ
  choice: بالمحبّة
  rationale: تعبير عربي طبيعي يدل على المحبة بوصفها الرابطة أو المجال الذي يتم فيه الاتحاد.
- source_word: εἰς πᾶν πλοῦτος
  choice: فيبلغوا كل غنى
  rationale: يجعل εἰς غايةً مقصودة ويحافظ على صورة الغنى، مع صياغة عربية واضحة.
- source_word: πληροφορίας τῆς συνέσεως
  choice: اليقين التامّ الذي يمنحه الفهم
  rationale: ينقل πληροφορία بمعنى الثقة الراسخة أو اليقين الكامل، ويوضح علاقة الإضافة بالفهم من دون اختزالها في مجرد وفرة المعلومات.
- source_word: ἐπίγνωσιν
  choice: معرفة
  rationale: المقابل العربي الطبيعي؛ وقد يحمل اللفظ اليوناني معنى المعرفة الوافية أو العميقة، وهو مبيّن في الحاشية.
- source_word: μυστηρίου
  choice: سرّ
  rationale: في الاستعمال البولسي يدل على قصد إلهي كان خفيًا ثم أُعلن؛ و«سرّ» واضحة وطبيعية في العربية.
- source_word: θεοῦ, Χριστοῦ
  choice: الله، المسيح
  rationale: يحافظ على إيجاز النص اليوناني وتركيبه الاحتمالي بدل إدخال «أي» في المتن وحسم علاقة البدل صراحةً.
theological_decisions:
- issue: علاقة Χριστοῦ بعبارة «سرّ الله»
  choice: 'الإبقاء على الصياغة الموجزة: «سرّ الله، المسيح»'
  alternative: «سرّ الله، أي المسيح»
  rationale: يمكن فهم «المسيح» بدلًا يعرّف سر الله بأنه المسيح، لكن النص اليوناني موجز وصعب ولا يشتمل على أداة تفسير صريحة؛ لذلك تُحفظ الصياغة في المتن ويُشرح الاحتمال في الحاشية.
- issue: القراءة النصية في خاتمة العبارة
  choice: 'اتباع القراءة القصيرة الواردة في SBLGNT: τοῦ θεοῦ, Χριστοῦ'
  alternative: قراءات أطول، منها ما يفيد «سرّ الله الآب والمسيح»
  rationale: المسودة تتبع نص المصدر المقدم، مع التنبيه إلى القراءات المخطوطية الأخرى دون إدخالها في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «المسيح» بوصفه لقبًا، وحُفظ تكرار حركة الغاية في εἰς بالفعل «يبلغوا» من غير افتعال تركيب عربي حرفي. كما حُفظ إيجاز خاتمة الآية وغموضها النحوي الحقيقي، مع شرحه في الحواشي.
