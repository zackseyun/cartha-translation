  text: “Do not handle[a], nor taste, nor touch,”
translation:
  language: ar
  text: «لا تمسكْ، ولا تذقْ، ولا تلمسْ»[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تلمسْ، ولا تذقْ، ولا تمسَسْ». يمكن أن يعني الفعل الأول (ἅψῃ) «تلمس» أو «تمسك»، لكن «تمسك» استُعملت هنا لتمييزه عن الفعل الأخير (θίγῃς)، الذي يعني أيضًا «تلمس».'
    reason: بديل معجمي
lexical_decisions:
- source_word: Μὴ ἅψῃ
  choice: لا تمسكْ
  rationale: الفعل ἅπτω هنا يفيد اللمس أو الإمساك بالشيء. اختير «تمسك» لتمييزه عن θίγῃς في آخر السلسلة، مع إبقاء صيغة النهي الموجزة.
- source_word: μηδὲ γεύσῃ
  choice: ولا تذقْ
  rationale: γεύομαι يعني مباشرةً «يذوق»، وتكرار «ولا» يحافظ على تراكم النواهي وإيقاعها.
- source_word: μηδὲ θίγῃς
  choice: ولا تلمسْ
  rationale: θιγγάνω يعني «يلمس» أو «يمسّ». اختير «تلمس» بوصفه التعبير العربي الواضح، مع الحفاظ على التمييز عن فعل الإمساك الأول.
theological_decisions:
- issue: طبيعة النواهي في السياق
  choice: إيراد سلسلة النواهي المقتضبة كما هي، في صيغة تشبه الاقتباس، من غير إضافة مفعولات أو شروح سياقية.
  alternative: 'توسيع العبارة مثل: «لا تمسك هذا، ولا تذق ذاك، ولا تلمس» أو ربطها صراحةً بالفرائض البشرية.'
  rationale: النص اليوناني في هذه الآية لا يتضمن سوى النواهي الثلاثة، ولذلك ينبغي صون إيجازه وحدّته وعدم حسم دلالته بإضافات تفسيرية من السياق.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة، مع الحفاظ على الإيقاع الثلاثي للنواهي وعلى الغموض الناتج من غياب المفعولات. وُضعت علامة الحاشية بعد الاقتباس كله لأنها تشرح التمييز بين الفعلين الأول والثالث.
