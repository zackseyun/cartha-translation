  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: ar
  text: فهذه الأمور ظلٌّ للأمور الآتية، أمّا الجسد فللمسيح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يُفهم «الجسد» هنا، في مقابل «الظل»، على أنه الحقيقة؛ لكن المتن يُبقي اللفظ الحرفي والاستعارة الأصلية.
    reason: توضيح الاستعارة مع إبقاء اللفظ الأصلي في المتن
lexical_decisions:
- source_word: ἅ
  choice: فهذه الأمور
  rationale: يعود الضمير الموصول المحايد الجمع على أمور الطعام والشراب والأعياد ورأس الشهر والسبت المذكورة في الآية السابقة. أُظهر المرجع بلفظ «الأمور» لوضوح العربية، مع الفاء لربط الجملة بما قبلها.
- source_word: σκιὰ
  choice: ظلٌّ
  rationale: يحافظ على صورة الظل في الأصل وعلى مقابلتها بما هو ثابت وملموس.
- source_word: τῶν μελλόντων
  choice: للأمور الآتية
  rationale: ينقل صيغة الجمع والاتجاه المستقبلي من غير حصرها في تفسير أخروي أو تاريخي بعينه.
- source_word: δὲ
  choice: أمّا
  rationale: تُبرز المقابلة بين «الظل» و«الجسد» في تركيب عربي طبيعي، ويأتي جوابها مقترنًا بالفاء.
- source_word: σῶμα
  choice: الجسد
  rationale: ترجمة مباشرة تحفظ الاستعارة الأصلية والتوتر الدلالي في مقابلة الظل بالجسد، بدل استبدالها تفسيرًا مثل «الحقيقة» أو «الجوهر».
- source_word: τοῦ Χριστοῦ
  choice: فللمسيح
  rationale: ينقل المضاف إليه اليوناني بصيغة ملكية عربية موجزة، ويحافظ على حذف فعل الكينونة في الشطر الثاني. واختيار «المسيح» ينقل Χριστός بوصفه لقبًا.
theological_decisions:
- issue: دلالة σῶμα في مقابل σκιὰ
  choice: الجسد
  alternative: الحقيقة أو الجوهر
  rationale: قد يُفهم «الجسد» هنا مجازيًا على أنه الحقيقة الملموسة التي يقابلها الظل، لكن إبقاء اللفظ الحرفي يصون الصورة واحتمالها التفسيري ولا يفرض شرحًا لاهوتيًا داخل النص.
- issue: علاقة τοῦ Χριστοῦ بـ σῶμα
  choice: الجسد للمسيح
  alternative: الجسد هو المسيح، أو الحقيقة في المسيح
  rationale: المضاف إليه اليوناني موجز ويحتمل التعبير عن الملكية أو الارتباط. صيغة «للمسيح» تحافظ على هذا الإيجاز ولا تحوّلها إلى جملة تطابق صريحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التوازي والاستعارة، واستُخدم «المسيح» لقبًا. لا تُضاف ألفاظ تفسيرية تحسم المقصود من «الجسد».
