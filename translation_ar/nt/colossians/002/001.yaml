  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: ar
  text: فإني أريد أن تعلموا ما أعظم الجهاد الذي أخوضه من أجلكم، ومن أجل الذين في لاودكية، ومن أجل جميع الذين لم يلتقوا بي شخصيًا[a].
  philosophy: optimal-equivalence
  footnotes:
