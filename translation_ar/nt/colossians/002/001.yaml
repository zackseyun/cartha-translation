    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: فإني أريد أن تعلموا
  rationale: تربط «فإن» الكلام بما قبله وتحافظ على وظيفة γάρ، أما «أريد أن تعلموا» فتنقل تركيب θέλω مع المصدر بعبارة عربية مباشرة وطبيعية.
- source_word: ἡλίκον ἀγῶνα ἔχω
  choice: ما أعظم الجهاد الذي أخوضه
  rationale: تنقل «ما أعظم» دلالة ἡλίκον على شدة المقدار، ويعبّر «الجهاد الذي أخوضه» طبيعيًا عن ἀγών بوصفه كفاحًا شاقًا لا مسابقة رياضية حرفية.
- source_word: ὑπὲρ ὑμῶν
  choice: من أجلكم
  rationale: تؤدي معنى ὑπέρ الدال هنا على العمل لمصلحة المخاطَبين ومنفعتهم.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: الذين في لاودكية
  rationale: ينقل التركيب الاسمي المكوّن من أداة التعريف وشبه الجملة بوضوح ومن دون زيادة تفسيرية.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: جميع الذين لم يروا
  rationale: تحافظ «جميع» على الشمول في ὅσοι، ويؤدي الماضي العربي معنى عدم حصول الرؤية حتى وقت الكلام بصورة طبيعية.
- source_word: τὸ πρόσωπόν μου
  choice: وجهي
  rationale: يحافظ على الصورة الحرفية في اليونانية، وهي مفهومة في العربية، بدل استبدالها مباشرة بتفسير مثل «يلتقوا بي».
- source_word: ἐν σαρκί
  choice: في الجسد
  rationale: يحافظ على التعبير الحرفي وعلى دلالة الحضور الجسدي الفعلي هنا، دون إقحام معنى أخلاقي أو معنى «الطبيعة الخاطئة».
theological_decisions:
- issue: دلالة σάρξ في سياق غير مجازي
  choice: في الجسد
  alternative: شخصيًا؛ بالجسد
  rationale: تشير العبارة هنا إلى الحضور الجسدي المباشر، لا إلى الطبيعة الخاطئة. أُبقي التعبير الحرفي في المتن، مع توضيح البدائل الدلالية في الحاشية.
translation_notes:
  register: العربية فصحى حديثة واضحة وذات نبرة رسائلية كريمة. اختير «أخوضه» لتجنب العبارة الجامدة «لي جهاد»، مع الحفاظ على شدة صورة الكفاح. وُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
