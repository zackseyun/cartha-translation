  source_fidelity: 'ينقل المسودة ترتيب العناصر الأساسية ومعانيها بدقة جيدة: اتصال العبارة بما قبلها، عِظَم ἀγών، ودلالة ὑπέρ، والشمول في ὅσοι. لكن «لم يروا وجهي في الجسد» ترجمة حرفية غير مألوفة في العربية الحديثة وقد توهم أن الوجه هو الذي يكون «في الجسد». المقصود في اليونانية عدم اللقاء ببولس حضورًا جسديًا.'
