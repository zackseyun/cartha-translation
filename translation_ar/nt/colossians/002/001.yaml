  terminology: «لاودكية» مناسبة، و«الجهاد» ممكن في هذا السياق بوصفه كفاحًا شاقًا، وإن كان «الصراع» أقل قابلية لإيحاءات اصطلاحية. أُبقي «الجهاد» لأنه لا يخل بالمعنى. تُنقل σάρξ في الحاشية حرفيًا مع بيان أن المراد الحضور الجسدي، بينما يستعمل المتن تعبيرًا عربيًا طبيعيًا.
