translation:
  language: ar
  text: لكي أُظهِرَهُ بوضوح[a] كما ينبغي لي أن أتكلَّم[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُعلِنَه» أو «أجعله معروفًا». يعود الضمير إلى «سرّ المسيح» المذكور في الآية السابقة.'
