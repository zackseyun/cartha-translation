    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تفيد الغاية، و«لكي» تؤدي هذا المعنى بوضوح وطبيعية في العربية الفصحى المعاصرة.
- source_word: φανερώσω
  choice: أُظهِرَهُ بوضوح
  rationale: الفعل يعني الإظهار أو الإعلان وجعل الأمر معلومًا؛ وتعبير «أُظهِرَهُ بوضوح» يلائم سياق إعلان السر مع إبقاء البدائل المعجمية في الحاشية.
- source_word: αὐτὸ
  choice: ـهُ
  rationale: الضمير يعود في السياق إلى السر المذكور في الآية السابقة، والحفاظ على الضمير يصون الصياغة اليونانية ولا يستبدل المرجع به في المتن.
- source_word: ὡς
  choice: كما
  rationale: تدل هنا على الكيفية أو المعيار، و«كما» موجزة وطبيعية.
- source_word: δεῖ
  choice: ينبغي لي
  rationale: تعبّر عن اللزوم أو الواجب دون حسم درجة القوة بين «ينبغي» و«يجب»، ويُذكر البديل الأقوى في الحاشية.
- source_word: με
  choice: لي
  rationale: المعنى النحوي هو أن بولس هو فاعل الكلام الواجب؛ وصيغة «ينبغي لي» عربية سليمة وطبيعية.
- source_word: λαλῆσαι
  choice: أن أتكلَّم
  rationale: مقابل مباشر للفعل العام الدال على الكلام، من غير إضافة تخصيص مثل «أبشّر» أو «أنادي» لا يفرضه هذا الشطر وحده.
theological_decisions:
- issue: مرجع الضمير αὐτό
  choice: إبقاء الضمير في المتن
  alternative: التصريح بعبارة «السر»
  rationale: مرجعه السياقي هو السر المذكور في كولوسي 4:3، لكن النص اليوناني يستعمل ضميرًا؛ لذلك يُحفظ الضمير ويُوضَّح مرجعه في الحاشية.
- issue: درجة الإلزام في δεῖ
  choice: «ينبغي لي»
  alternative: «يجب عليَّ»
  rationale: كلاهما ممكن، و«ينبغي لي» يحفظ معنى الالتزام مع تجنب تشديد النبرة على نحو قد يتجاوز ما يلزم؛ ويُعرض البديل في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «أُظهِرَهُ بوضوح» لنقل معنى الإعلان الواضح في السياق، مع إبقاء الضمير والغموض النسبي في درجة الإلزام، وبيان البدائل في الحواشي.
