source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: ar
  text: ويسوع المدعو يسطس. هؤلاء وحدهم من أهل الختان[a] الذين يعملون معي لأجل ملكوت الله[b]، وقد صاروا لي تعزيةً.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من اليهود». حرفيًّا: «من الختان».'
    reason: lexical_alternative
  - marker: b
    text: 'ويجوز: «هؤلاء هم العاملون معي وحدهم لأجل ملكوت الله ممن هم من أهل الختان».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Ἰησοῦς
  choice: يَسوع
  rationale: النقل العربي المألوف للاسم في سياق العهد الجديد، مع أن الاسم يقابل «يشوع» في العبرية.
- source_word: ὁ λεγόμενος Ἰοῦστος
  choice: المدعوّ يُسْطُس
  rationale: تعبير عربي طبيعي يحفظ دلالة الاسم الآخر أو اللقب الروماني.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: من أهل الختان
  rationale: يحفظ صورة العبارة اليونانية بوصفها علامة هوية يهودية، من غير حسمها في المتن إلى تسمية تفسيرية مثل «اليهود».
- source_word: οὗτοι μόνοι
  choice: هؤلاء وحدهم
  rationale: يحفظ توكيد الحصر وموقعه بالنسبة إلى الجماعة المذكورة، أي أهل الختان.
- source_word: συνεργοὶ
  choice: الذين يعملون معي
  rationale: صياغة عربية واضحة وطبيعية لمعنى الشركاء في العمل والخدمة.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: لأجل ملكوت الله
  rationale: ينقل معنى الغاية أو الخدمة المقصودة في εἰς مع συνεργοί، ويحفظ التعبير الكتابي «ملكوت الله».
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: صاروا لي تعزيةً
  rationale: 'يعكس مباشرة فعل الصيرورة في ἐγενήθησαν، مع إبقاء παρηγορία في معناها الأساسي: التعزية أو المواساة والتشجيع.'
theological_decisions:
- issue: مدلول «أهل الختان»
  choice: إبقاء التعبير الدال على الخلفية اليهودية من دون تحويله في المتن إلى تسمية تفسيرية
  alternative: «اليهود» أو «جماعة الختان» بمعناها الحزبي الأضيق
  rationale: السياق يتحدث عن عاملين مع بولس، ويرجح أن العبارة تحدد ذوي الخلفية اليهودية منهم؛ لكن اللفظ اليوناني نفسه لا يصرح بكل تفاصيل هذا التحديد، لذلك حُفظت صورته.
- issue: نطاق الحصر في «هؤلاء وحدهم»
  choice: 'الحصر داخل جماعة أهل الختان: هؤلاء وحدهم منها يعملون مع بولس لأجل الملكوت'
  alternative: أن يكونوا العاملين الوحيدين معه على الإطلاق، ثم يوصفوا بأنهم من أهل الختان
  rationale: ترتيب اليونانية يقدّم «الذين من الختان» ثم يقول «هؤلاء وحدهم عاملون معي»، مما يرجح تعلق الحصر بتلك الجماعة مع بقاء احتمال اختلاف الربط النحوي جديرًا بالتنبيه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أهل الختان» لحفظ الاستعارة الأصلية، و«يعملون معي» بدل تركيب اسمي أثقل. وُضعت علامتا الحاشيتين في نهاية الآية كي تظهر كلتاهما في المتن من غير قطع الجملة.
