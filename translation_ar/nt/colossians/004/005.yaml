    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: بحكمة
  rationale: تؤدي معنى مجال السلوك وطريقته بعبارة عربية طبيعية، مع إبقاء اسم «الحكمة» حاضرًا دلاليًا.
- source_word: περιπατεῖτε
  choice: اسلكوا
  rationale: يحفظ الاستعارة البولسية التي تصف طريقة العيش والتصرف، وهو استعمال عربي فصيح ومفهوم.
- source_word: πρὸς τοὺς ἔξω
  choice: تجاه الذين هم من خارج
  rationale: يعكس πρός بوصفها توجيهًا للسلوك نحو فئة معينة، ويحفظ التعبير المكاني المجازي دون اختزاله ابتداءً في تفسير «غير المؤمنين».
- source_word: τὸν καιρὸν
  choice: كل فرصة
  rationale: يدل καιρός هنا على الوقت الملائم أو الفرصة المتاحة، لا على الزمن المجرد؛ وإضافة «كل» ضمن التعبير العربي تنقل معنى الاستفادة القصوى الذي تولده العبارة كاملة.
- source_word: ἐξαγοραζόμενοι
  choice: مغتنمين
  rationale: ينقل المعنى الاصطلاحي للمشاركة، أي انتهاز الفرص والاستفادة منها، من غير إيحاء غير مقصود بالفداء الخلاصي؛ وتُذكر الصورة الحرفية التجارية في الحاشية.
theological_decisions:
- issue: احتمال تحميل ἐξαγοραζόμενοι معنى الفداء الخلاصي
  choice: فهمها حثًّا على اغتنام الفرص في السلوك الحكيم مع من هم خارج الجماعة
  alternative: 'ترجمتها حرفيًا: «مفتدين الوقت»'
  rationale: السياق يتناول حسن استثمار الوقت الملائم أو الفرصة، لا الفداء الكفاري؛ لذلك تتجنب الصياغة إدخال دلالة عقدية لا يقتضيها النص، مع حفظ الحرفية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظت استعارة السلوك في «اسلكوا»، كما حُفظ قدر من حرفية «الذين هم من خارج»، بينما صيغت العبارة الأخيرة بحسب معناها الاصطلاحي الطبيعي في العربية.
