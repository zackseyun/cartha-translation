translation:
  language: ar
  text: اسلكوا بحكمة تجاه الذين هم من خارج[a]، مغتنمين الفرصة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الذين هم خارج جماعة المؤمنين.
    reason: lexical_alternative
  - marker: b
