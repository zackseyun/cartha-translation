  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: ar
  text: مُصَلِّينَ في الوقت نفسه من أجلنا أيضًا، لكي يفتح الله لنا بابًا للكلمة[a]، لنتكلم بسرِّ المسيح[b]، الذي من أجله أنا أيضًا مقيَّد[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بابًا للرسالة»، أي فرصةً لإعلان الكلمة.'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «سرّ المسيح»، أي قصد الله الذي كان خفيًّا ثم أُعلن في المسيح.'
    reason: clarification
  - marker: c
    text: 'أو: «أنا أيضًا في القيود».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευχόμενοι
  choice: مُصَلِّينَ
  rationale: اسم فاعل حالي يواصل الحث الوارد في الآية السابقة، ويحافظ على الارتباط النحوي دون تحويله إلى جملة مستقلة.
- source_word: ἅμα καὶ
  choice: في الوقت نفسه ... أيضًا
  rationale: ينقل معنى التزامن في ἅμα والإضافة في καὶ، مع ترتيب عربي طبيعي.
- source_word: περὶ ἡμῶν
  choice: من أجلنا
  rationale: مع فعل الصلاة، هذا هو التعبير العربي الطبيعي عن الصلاة لأجل أشخاص.
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ
  choice: لكي يفتح الله
  rationale: تحافظ «لكي» على دلالة الغاية أو مضمون الطلب التي تؤديها ἵνα مع صيغة الاحتمال.
- source_word: ἡμῖν θύραν τοῦ λόγου
  choice: يفتح الله لنا بابًا للكلمة
  rationale: يحفظ استعارة الباب وترتيب العلاقات في العبارة اليونانية، مع فهم «الكلمة» بوصفها الرسالة المعلنة.
- source_word: λαλῆσαι
  choice: فنتكلم
  rationale: ينقل الغاية العملية لفتح الباب، ويحافظ على المعنى المباشر للفعل λαλέω من غير إضافة دلالة اصطلاحية خاصة بالوعظ.
- source_word: τὸ μυστήριον
  choice: سرّ
  rationale: «السر» هو المقابل العربي المألوف في الاستعمال البولسي لما كان خفيًا ثم أعلنه الله، ولا يعني هنا أمرًا باطنيًا لا يُكشف.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: Χριστός هنا لقب ذو دلالة، و«المسيح» هو المقابل العربي الطبيعي والدقيق.
- source_word: δι’ ὃ
  choice: الذي من أجله
  rationale: ينقل علاقة السبب التي تفيدها διά مع النصب، مع إبقاء مرجع الموصول مرتبطًا بالسر المذكور.
- source_word: δέδεμαι
  choice: أنا ... مقيَّد
  rationale: يحافظ على الحالة الحاضرة الناتجة من فعل سابق التي تدل عليها صيغة التام المبني للمجهول، من دون أن يفرض لفظ السلاسل في المتن.
theological_decisions:
- issue: دلالة τοῦ Χριστοῦ
  choice: المسيح
  alternative: المسيح بوصفه اسمًا عَلَمًا صرفًا
  rationale: اللفظ اليوناني يحتفظ هنا بقيمته اللقبية، والترجمة العربية «المسيح» تنقل ذلك طبيعيًا من غير إدخال تمييز مذهبي.
- issue: استعارة θύραν τοῦ λόγου
  choice: بابًا للكلمة
  alternative: فرصة لإعلان الرسالة
  rationale: حُفظت استعارة الباب بدل حلها في تفسير واحد، مع إثبات البديل التفسيري في الحاشية.
- issue: مرجع δι’ ὃ
  choice: السر الذي من أجله أنا مقيَّد
  alternative: الرسالة أو إعلان السر الذي بسببه أنا في السجن
  rationale: صيغة الموصول المفرد المحايد توافق μυστήριον نحويًا، لكن المجال الدلالي يسمح بفهم السبب على أنه السر المعلن أو التكليف بإعلانه؛ لذلك لم تُوسَّع العبارة في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ التركيب التابع للآية السابقة، واستعارة الباب، وغموض مدى الإشارة في سبب التقييد، مع تجنب التفسير الطائفي أو التوسّع غير الموجود في المصدر.
