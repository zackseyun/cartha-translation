translation:
  language: ar
  text: سيُطلعكم تيخيكس على كل ما يخصني[a]، وهو الأخ الحبيب، والخادم الأمين[b]، وزميلنا في العبودية[c] في الرب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل الأمور المتعلقة بي»، أو: «كل أحوالي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الخادم الموثوق». ويمكن أن تعني الكلمة اليونانية διάκονος «خادمًا» أو «من يقوم بخدمة»، وفي بعض السياقات «شمّاسًا» بوصفه صاحب وظيفة كنسية.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «رفيقنا في الخدمة»، أو: «عبد معنا». فالكلمة اليونانية σύνδουλος مبنية على δοῦλος، التي قد تدل على العبد المملوك أو الملتزم بخدمة سيده.'
