lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: كل ما يخصني
  rationale: ينقل التعبير الاصطلاحي الدال على جميع الأمور المتعلقة ببولس، من غير حصره في أحواله الشخصية وحدها.
- source_word: γνωρίσει ὑμῖν
  choice: سيُطلعكم
  rationale: صياغة عربية طبيعية تؤدي معنى جعل الأمر معلومًا لهم أو إخبارهم به، مع دلالة المستقبل.
- source_word: Τυχικὸς
  choice: تيخيكس
  rationale: نقل صوتي عربي للاسم اليوناني.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: الأخ الحبيب
  rationale: يحفظ دفء ἀγαπητός وصيغة الأخوّة المفردة المذكرة في وصف تيخيكس.
- source_word: πιστὸς διάκονος
  choice: الخادم الأمين
  rationale: لفظة διάκονος هنا تصف خدمته الموثوقة، ولا يفرض السياق فهمها بوصفها اسمًا لوظيفة كنسية محددة؛ و«الأمين» تؤدي معنى πιστός الملائم للسياق.
- source_word: σύνδουλος
  choice: شريكي في العبودية
  rationale: يحفظ عنصر المشاركة في σύν- وقوة δοῦλος الدالة على العبودية والانتماء في الخدمة، بصياغة عربية مفهومة.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحافظ على العبارة البولسية وما فيها من معنى المجال والعلاقة، من غير تفسير زائد.
theological_decisions:
- issue: دلالة σύνδουλος وعلاقتها بلغة العبودية
  choice: شريكي في العبودية
  alternative: رفيقي في الخدمة / العبد معي
  rationale: الاختيار يحفظ معنى المشاركة في منزلة العبد وخدمته تحت سلطان الرب، بدل تليين اللفظة إلى مجرد خدمة؛ وتبقى البدائل في الحاشية لأن العربية المعاصرة قد تستقبل لغة العبودية بدلالات حديثة ليست كلها مقصودة في السياق.
- issue: دلالة ἐν κυρίῳ
  choice: في الرب
  alternative: في خدمة الرب
  rationale: تُركت العبارة على سعتها اللاهوتية والعلاقية، ولم تُحصر في معنى أداء الخدمة وحده.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «سيُطلعكم على» بدل ترجمة حرفية ثقيلة، وحُفظت العبارة اللاهوتية «في الرب». وُضعت علامات الحواشي مباشرة بعد الألفاظ التي تشرحها.
