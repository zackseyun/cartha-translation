    text: اللفظ اليوناني يدل على قريب من درجة ابن العمومة، لكنه لا يحدّد جهة القرابة؛ لذلك لا يبيّن هل كان ابنَ عمٍّ أو عمة أو خال أو خالة. وترجمه بعض الترجمات القديمة بلفظ يفيد «ابن الأخ أو الأخت».
    reason: lexical_alternative
  - marker: b
    text: أو «اقبلوه». قد يدل الفعل اليوناني على استقبال شخص بترحاب وضيافة.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: يُسَلِّمُ عليكم
  rationale: هذه صيغة عربية طبيعية وموجزة للتحية في الرسائل، وتحافظ على كون التحية فعلًا مباشرًا.
- source_word: συναιχμάλωτός μου
  choice: رفيقي في الأسر
  rationale: تنقل معنى الأسير مع شخص آخر بصياغة عربية واضحة، من غير أن تحدد هل الأسر حرفي أم مجازي.
- source_word: ἀνεψιὸς
  choice: ابنُ عمِّ
  rationale: المقصود في اليونانية قريب من درجة ابن العمومة، لا «ابن الأخ» أو «ابن الأخت». ولأن العربية تفصّل جهة القرابة أكثر من اللفظ اليوناني، توضّح الحاشية أن جهة القرابة غير محددة في الأصل.
- source_word: ἐλάβετε ἐντολάς
  choice: تسلَّمتم بشأنه تعليمات
  rationale: «تعليمات» تلائم سياق السفر واستقبال الشخص، وتحفظ معنى التوجيه ذي الصبغة السلطوية من غير مبالغة في الشدة.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: إن جاء إليكم
  rationale: صياغة عربية طبيعية للشرط المستقبلي الذي تعبّر عنه ἐάν مع صيغة الاحتمال.
- source_word: δέξασθε αὐτόν
  choice: فرحِّبوا به
  rationale: ينقل بوضوح معنى قبوله بحفاوة في سياق الضيافة، وهو أوضح للقارئ المعاصر من «اقبلوه» وحدها.
theological_decisions:
- issue: طبيعة علاقة بولس بأرسترخس في συναιχμάλωτός μου
  choice: رفيقي في الأسر
  alternative: الأسير معي في الرب؛ رفيقي في احتمال المشقة
  rationale: يحافظ النص على المعنى المباشر للفظ من غير أن يحسم هل الأسر حرفي أم مجازي، ومن غير إضافة «في الرب» غير الواردة هنا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت صيغة «يُسَلِّم عليكم» المألوفة في سياق الرسائل، وحُفظ الاعتراض بين قوسين كما في النص المصدر. ضُبطت بعض الكلمات بالشكل الجزئي لتيسير قراءة الأسماء والتراكيب من غير إثقال النص.
