lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: على الصلاة
  rationale: أداة التعريف في اليونانية تأتي هنا في تركيب اصطلاحي يشير إلى ممارسة الصلاة عمومًا، والصياغة العربية الطبيعية مع «واظبوا» هي «على الصلاة».
- source_word: προσκαρτερεῖτε
  choice: واظِبوا
  rationale: فعل الأمر المضارع يدل على الاستمرار والثبات في الممارسة؛ و«واظبوا» موجزة وطبيعية وتحفظ قوة الأمر.
- source_word: γρηγοροῦντες
  choice: ساهرين
  rationale: اسم الفاعل يبيّن الكيفية المصاحبة للمواظبة على الصلاة، و«ساهرين» يحفظ صورة اليقظة الروحية دون أن يقتصر المعنى على الامتناع الحرفي عن النوم.
- source_word: ἐν αὐτῇ
  choice: فيها
  rationale: الضمير يعود على الصلاة، وتحفظ «فيها» الإحالة الضميرية الواضحة في الأصل.
- source_word: ἐν εὐχαριστίᾳ
  choice: بالشكر
  rationale: العبارة تصف ما يصاحب السهر في الصلاة من شكر؛ و«بالشكر» تعبير عربي طبيعي وموجز.
