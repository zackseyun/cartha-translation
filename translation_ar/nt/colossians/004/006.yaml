  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: ar
  text: ليكن كلامكم دائمًا بنعمة[a]، مُتبَّلًا بالملح[b]، لكي تعرفوا كيف ينبغي لكم أن تجيبوا كلَّ واحدٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بلطف». يمكن أن تدل عبارة «بنعمة» على كلام يتصف باللطف والإحسان والقبول.
    reason: lexical_alternative
  - marker: b
    text: «مُتبَّلًا بالملح» استعارة لكلام ملائم وجذّاب وحكيم، لا لكلام باهت أو فاسد.
    reason: cultural_note
lexical_decisions:
- source_word: λόγος
  choice: كلامكم
  rationale: يشير في هذا السياق الإرشادي إلى طريقة المؤمنين في الكلام، لا إلى كلمة مفردة أو رسالة رسمية.
- source_word: ἐν χάριτι
  choice: بنعمة
  rationale: يحافظ على صورة العبارة اليونانية وعلى احتمال وصف الكلام باللطف والقبول، مع إبقاء صدى معنى النعمة الأوسع.
- source_word: ἅλατι ἠρτυμένος
  choice: مُملَّحًا بملح
  rationale: يحفظ استعارة إعداد الكلام بالملح، كما يعكس اسم المفعول حالةً ثابتة تميّز الكلام.
- source_word: εἰδέναι
  choice: لكي تعرفوا
  rationale: يفهم المصدر على أنه يفيد الغاية أو النتيجة المتصلة بالحث السابق، مع أن تركيبه يحتمل صلة أقل تحديدًا.
- source_word: δεῖ
  choice: ينبغي
  rationale: ينقل معنى اللزوم والملاءمة من غير تشديد يفوق نبرة الإرشاد في السياق.
- source_word: ἑνὶ ἑκάστῳ
  choice: كلَّ واحد
  rationale: يحافظ على القوة التوزيعية التي تؤكد مراعاة كل فرد عند الإجابة.
- source_word: ἀποκρίνεσθαι
  choice: أن تجيبوا
  rationale: مقابل مباشر للفعل في سياق حواري يتطلب تقديم جواب.
- source_word: πάντοτε
  choice: دائمًا
  rationale: ينقل بوضوح الشمول الزمني في الظرف اليوناني.
theological_decisions:
- issue: دلالة ἐν χάριτι
  choice: بنعمة
  alternative: بلطف / لطيفًا
  rationale: أُبقيت العبارة مفتوحة لتشمل الكلام المتصف باللطف والقبول، من غير حصرها في معنى أخلاقي واحد أو إلغاء صدى النعمة البولسي.
- issue: العلاقة النحوية للمصدر εἰδέναι
  choice: لكي تعرفوا
  alternative: عارفين كيف / أن تعرفوا كيف
  rationale: صيغة الغاية أو النتيجة توضح الصلة بالإرشاد السابق، مع الإقرار بأن تركيب المصدر في اليونانية موجز وقابل لأكثر من تحليل.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حُفظت استعارة الملح وبنية «بنعمة»، ووُضع التنوين في «مُملَّحًا» لموافقته «كلامكم» الواقع اسمَ يكن، مع تجنب التفسير الطائفي أو توسيع المعنى داخل المتن.
