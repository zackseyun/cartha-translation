  naturalness: الصياغة سليمة إجمالًا، لكن «مُتبَّلًا بالملح» أفصح وأكثر سلاسة من «مُملَّحًا بملح»، ويحفظ الصورة المجازية الأصلية دون إقحام تفسير في المتن. ويُستحسن إثبات تنوين «واحدٍ» لأنه مضافٌ إليه.
