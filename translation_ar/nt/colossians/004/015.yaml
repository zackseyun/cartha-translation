  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: ar
  text: سَلِّموا على الإخوة الذين في لاودكية، وعلى نِمفا والكنيسة التي في بيتها.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تؤيد بعض المخطوطات أو القراءات: «نِمفاس والكنيسة التي في بيته»، وتؤيد أخرى: «الكنيسة التي في بيتهم».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: سَلِّموا على
  rationale: فعل أمر موجَّه إلى جماعة، و«سَلِّموا على» تعبير عربي طبيعي يحفظ قوة الأمر ومعنى إبلاغ التحية.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: الإخوة الذين في لاودكية
  rationale: تحفظ «الإخوة» الصيغة المذكرة في الأصل، ويمكن أن تشمل في الاستعمال البولسي جماعة المؤمنين من الرجال والنساء. وأُبقي التركيب المكاني قريبًا من اليونانية مع صياغة عربية واضحة.
- source_word: Νύμφαν
  choice: نِمفا
  rationale: تتبع القراءة المطبوعة في SBLGNT، حيث يُفهم الاسم بصيغة مؤنثة، مع إثبات القراءة المذكرة البديلة في الحاشية.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: الكنيسة التي في بيتها
  rationale: صياغة عربية واضحة وقريبة من تركيب الأصل، وتشير إلى جماعة الكنيسة الموجودة أو المجتمعة في بيتها من غير إضافة تفسيرية غير لازمة.
- source_word: ἐκκλησίαν
  choice: الكنيسة
  rationale: هي المقابل العربي المألوف في السياق الرسولي للجماعة المسيحية المجتمعة، وهي أنسب هنا من «الجماعة» أو «المحفل».
theological_decisions:
- issue: هوية نِمفا وجنس الاسم والضمير العائد إليه
  choice: نِمفا ... الكنيسة التي في بيتها
  alternative: 'نِمفاس ... الكنيسة التي في بيته؛ أو: الكنيسة التي في بيتهم'
  rationale: تتبع العبارة الرئيسية نص SBLGNT المطبوع، وفيه الضمير المؤنث المفرد αὐτῆς. ولأن الشواهد النصية تتضمن قراءتين مذكّرة وجمعية، حُفظ هذا التباين في الحاشية بدل حسمه ضمنًا.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «سَلِّموا على» بصفتها الصياغة الطبيعية للأمر، وحُفظت بنية الآية الموجزة والتباين النصي المتعلق بالاسم والضمير.
