  text: μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει ⸂πολὺν πόνον⸃ ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: ar
  text: فإني أشهد له بأنه يبذل جهدًا كبيرًا من أجلكم ومن أجل الذين في لاودكية والذين في هيرابوليس.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كدًّا كثيرًا»، أو «اهتمامًا شديدًا»، أو «معاناة عميقة». يمكن للتعبير اليوناني أن يدل على الكدّ الشاق، وأن يدل بحسب السياق على شدة الاهتمام.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ γὰρ αὐτῷ
  choice: فإني أشهد له
  rationale: تحافظ «فإن» على الصلة التفسيرية، وتنقل «أشهد له» صيغة الشهادة المؤيدة لأبفراس من غير إضافة معنى احتمالي.
- source_word: ὅτι ἔχει πολὺν πόνον
  choice: أن له تعبًا عظيمًا
  rationale: ينقل التعبير اليوناني بمعناه الأساسي، أي الكدّ والمشقة، مع إبقاء احتمال العناية الشديدة أو المعاناة الوجدانية الذي يسمح به السياق.
- source_word: ὑπὲρ ὑμῶν
  choice: من أجلكم
  rationale: تعبير عربي طبيعي يوضح أن تعبه موجَّه إلى منفعتهم والعناية بهم.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: الذين في لاودكية
  rationale: صياغة موجزة تحافظ على تركيب النص، ويُفهم من السياق أنهم المؤمنون هناك.
- source_word: τῶν ἐν Ἱεραπόλει
  choice: الذين في هيرابوليس
  rationale: يحافظ على التوازي مع العبارة السابقة وينقل اسم المدينة نقلًا صوتيًا شائعًا.
theological_decisions:
- issue: دلالة πόνος في خدمة أبفراس
  choice: تعبًا عظيمًا
  alternative: كدًّا كثيرًا؛ اهتمامًا شديدًا؛ معاناة عميقة
  rationale: المعنى الأساسي للكلمة هو التعب والكد، بينما قد يوحي سياق الجهاد في الصلاة باهتمام شديد أو معاناة داخلية. يحفظ المتن المعنى الأوسع، وتعرض الحاشية الاحتمالات من غير حصره في الجانب الوجداني أو في الصلاة وحدها.
- issue: دلالة αὐτῷ مع μαρτυρῶ
  choice: أشهد له
  alternative: أشهد عنه
  rationale: تحتمل صيغة الداتيف الشهادة المؤيدة للشخص أو الشهادة بشأنه. اختيرت «له» لأنها تحافظ بصورة قريبة على البنية اليونانية وعلى معنى تزكيته، من غير استبعاد أن مضمون الشهادة يتعلق به.
translation_notes:
  register: لغة عربية فصحى واضحة وموقرة. استُعمل «تعبًا عظيمًا» بدل تعبيرات أكثر تفسيرًا، للمحافظة على اتساع الدلالة في الأصل، مع تكرار «من أجل» لإبراز توازي الجماعات الثلاث.
