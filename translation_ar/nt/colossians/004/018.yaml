  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: ar
  text: هذه التحية بخط يدي أنا، بولس.[a] اذكروا قيودي.[b] النعمة معكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «السلام». تشير العبارة اليونانية إلى التحية الختامية التي كتبها بولس بنفسه بخط يده.
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «سجني» أو «وثاقي». والمعنى الحرفي: «قيودي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: التحية
  rationale: تدل الكلمة هنا على التحية الختامية في الرسالة، و«التحية» تعبير عربي طبيعي وواضح.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: بخطّي أنا، بولس
  rationale: ينقل هذا التعبير معنى أن بولس كتب التحية الختامية شخصيًا بخط يده، ويحافظ على توكيد ضمير المتكلم في اليونانية.
- source_word: μνημονεύετέ
  choice: اذكروا
  rationale: صيغة الأمر تحث المخاطبين على إبقاء قيود بولس في ذاكرتهم؛ و«اذكروا» موجزة وطبيعية من غير مبالغة في نقل دلالة الاستمرار المحتملة.
- source_word: μου τῶν δεσμῶν
  choice: قيودي
  rationale: تحافظ «قيودي» على الصورة الحسية للكلمة اليونانية، التي تشير حرفيًا إلى القيود وتُستعمل كناية عن السجن.
- source_word: ἡ χάρις
  choice: النعمة
  rationale: تحافظ على صيغة البركة البولسية من غير إضافة مصدر للنعمة لم يصرّح به النص.
- source_word: μεθ’ ὑμῶν
  choice: معكم
  rationale: نقل مباشر ومألوف لعبارة البركة اليونانية الموجزة الخالية من الفعل.
theological_decisions:
- issue: البركة الختامية بلا فعل صريح
  choice: النعمة معكم
  alternative: لتكن النعمة معكم
  rationale: الأصل اليوناني جملة اسمية بلا فعل؛ والصياغة العربية المختارة طبيعية وتحافظ على إيجاز النص وغموضه النحوي من غير إضافة فعل دعائي صريح.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «بخطّي أنا» لتوكيد الكتابة الشخصية، واحتُفظ بالصورة الحسية في «قيودي» وبالإيجاز الاسمي في البركة الختامية.
