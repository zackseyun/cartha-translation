  source_fidelity: المعنى العام منقول بأمانة، بما في ذلك انتماء أبفراس إلى المخاطَبين، وكونه عبدًا للمسيح، ومثابرته في الصلاة، وغرض صلاته. لكن «مجاهدًا» جاءت منصوبة على نحو غير منسجم نحويًا مع تركيب الجملة، و«ممتلئين يقينًا» أقل سلاسة ودقة في العربية من صياغة تدل مباشرة على حالة اليقين التام.
  naturalness: «يُسَلِّم عليكم» و«وهو واحد منكم» طبيعيان. ويجعل تحويل اسم الفاعل إلى صلة موصول («الذي يجاهد») التركيب العربي سليمًا وواضحًا. كما أن «متيقنين تمامًا» أفصح وأكثر مباشرة من «ممتلئين يقينًا».
