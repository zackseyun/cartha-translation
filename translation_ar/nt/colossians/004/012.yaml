source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: ar
  text: يُسَلِّم عليكم أبفراس، وهو واحدٌ منكم، عبدُ المسيح[a]، الذي يجاهد دائمًا لأجلكم في صلواته، لكي تثبتوا ناضجين ومتيقنين تمامًا[b] في مشيئة الله كلِّها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «المسيح يسوع».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «مقتنعين تمامًا»، أو «راسخين تمامًا». يمكن أن يدل اللفظ اليوناني على اليقين الكامل أو على تمام الرسوخ والاستقرار.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: يُسَلِّمُ عليكم
  rationale: تعبير عربي طبيعي يؤدي المعنى الرسائلي المعتاد للفعل، أي توجيه التحية.
- source_word: ὁ ἐξ ὑμῶν
  choice: وهو واحدٌ منكم
  rationale: يوضح انتماء أبفراس إلى جماعة كولوسي بعبارة عربية مألوفة، من غير حصر المعنى في مكان المنشأ.
- source_word: δοῦλος
  choice: عبدُ
  rationale: لفظ «عبد» يحفظ معنى الانتماء والخضوع التام الكامن في اليونانية، وهو أيضًا التعبير العربي المألوف في سياق العبودية لله أو للمسيح.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: ينقل اللقب اليوناني بمعناه، ولا يضيف اسم «يسوع» إلى النص الأساسي إذ لا يرد في قراءة SBLGNT المعتمدة هنا.
- source_word: ἀγωνιζόμενος
  choice: مجاهدًا
  rationale: يحفظ معنى بذل الجهد الشديد والمكابدة، ويلائم سياق الشفاعة في الصلاة من غير تخصيص الصورة بالمصارعة.
- source_word: ἐν ταῖς προσευχαῖς
  choice: في صلواته
  rationale: يبين أن الصلوات هي صلوات أبفراس، ويحفظ صيغة الجمع الدالة على التكرار.
- source_word: ἵνα σταθῆτε
  choice: لكي تثبتوا
  rationale: ينقل معنى الوقوف والثبات في صياغة عربية موجزة، من غير إضافة مفعول أو تفسير غير مصرح به.
- source_word: τέλειοι
  choice: ناضجين
  rationale: يعبر عن النضج والاكتمال المقصودين في هذا السياق، ويتجنب أن تُفهم «كاملين» بالضرورة على أنها عصمة من كل نقص.
- source_word: πεπληροφορημένοι
  choice: ممتلئين يقينًا
  rationale: ينقل حالة الامتلاء بالثقة أو الاقتناع التي يدل عليها اسم المفعول التام، مع إبقاء احتمال الرسوخ مذكورًا في الحاشية.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: في مشيئة الله كلِّها
  rationale: يحفظ شمول العبارة ويترك علاقة حرف الجر واسعة، بحيث يمكن أن تدل على المجال أو التوافق أو المحتوى من غير حسم زائد.
theological_decisions:
- issue: دلالة δοῦλος في وصف علاقة أبفراس بالمسيح
  choice: عبدُ المسيح
  alternative: خادم المسيح
  rationale: «عبد» أقوى في الدلالة على الانتماء والخضوع التام، مع كونه تعبيرًا دينيًا عربيًا طبيعيًا؛ أما «خادم» فقد يضعف معنى التبعية الكامن في الأصل.
- issue: نقل Χριστοῦ وعدم إضافة اسم يسوع
  choice: المسيح
  alternative: المسيح يسوع
  rationale: النص المعتمد يقرأ Χριστοῦ وحدها، ولذلك تُترجم «المسيح» بوصفها لقبًا. وتُذكر القراءة الأطول في الحاشية بدل إدخالها في المتن.
- issue: دلالة πεπληροφορημένοι
  choice: ممتلئين يقينًا
  alternative: راسخين تمامًا
  rationale: اختير معنى اليقين والاقتناع الكامل لأنه قيمة معجمية قوية في السياق، مع حفظ احتمال الدلالة على الترسخ والاستقرار في الحاشية وعدم إخفاء التوتر التفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية وقورة. استُعمل «يُسَلِّم عليكم» للتحية الرسائلية، و«مجاهدًا» لقوة ἀγωνιζόμενος، مع تجنب ألفاظ مذهبية خاصة. وُضع كل مؤشر حاشية عند العبارة التي يفسرها مباشرة.
