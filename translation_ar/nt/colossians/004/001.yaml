  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: ar
  text: أيها السادة، قدِّموا لعبيدكم ما هو عادل ومنصف[a]، عالمين أن لكم أنتم أيضًا سيدًا في السماء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «العدل والمساواة». فاللفظة اليونانية المترجمة «منصف» يمكن أن تعني أيضًا «المساواة» أو «الإنصاف».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: أيها السادة
  rationale: في سياق نظام البيت، يشير اللفظ إلى السادة البشر في علاقتهم بالعبيد. و«السادة» تعبير عربي واضح يحفظ المقابلة مع «عبيدكم».
- source_word: τὸ δίκαιον
  choice: ما هو عادل
  rationale: الصفة المستعملة استعمال الاسم تدل على ما هو حق أو عادل. وهذه الصياغة واضحة وتحفظ القوة الأخلاقية للنص.
- source_word: τὴν ἰσότητα
  choice: منصف
  rationale: يمكن أن يدل اللفظ على المساواة أو الإنصاف والعدل في المعاملة. و«منصف» طبيعي في الاقتران بـ«عادل»، مع إثبات احتمال «المساواة» في الحاشية.
- source_word: τοῖς δούλοις
  choice: لعبيدكم
  rationale: العلاقة الاجتماعية بالسادة صريحة هنا، ولذلك تُحفظ دلالة الرق في δοῦλοι ولا تُلطَّف إلى «خدم».
- source_word: παρέχεσθε
  choice: قدِّموا
  rationale: فعل الأمر يطلب من السادة أن يمنحوا العبيد أو يوفروا لهم هذه المعاملة؛ و«قدِّموا» واضح وطبيعي مع المفعول.
- source_word: εἰδότες
  choice: عالمين
  rationale: تحفظ الصياغة البنية الحالية للمشاركة، وتترك علاقتها بالأمر محتملة بين بيان الأساس والمصاحبة.
- source_word: καὶ ὑμεῖς
  choice: لكم أنتم أيضًا
  rationale: يحفظ هذا الترتيب توكيد الضمير ودلالة «أيضًا»، مبرزًا أن السادة أنفسهم خاضعون لسلطان أعلى.
- source_word: κύριον
  choice: سيدًا
  rationale: «سيد» يقابل κύριος طبيعيًا في العربية، ويحفظ الصلة اللفظية المقصودة بين السادة البشر والسيد السماوي من غير إضافة اسم غير موجود في النص.
- source_word: ἐν οὐρανῷ
  choice: في السماء
  rationale: ترجمة عربية معيارية واضحة للمفرد اليوناني مع حرف الجر.
theological_decisions:
- issue: ترجمة δοῦλοι في سياق نظام البيت
  choice: عبيدكم
  alternative: خدمكم
  rationale: ذكر السادة يجعل وضع العبودية الاجتماعي بارزًا؛ لذلك تحافظ «عبيدكم» على واقع النص التاريخي ولا تخففه.
- issue: دلالة ἰσότητα
  choice: منصف
  alternative: المساواة
  rationale: يمكن أن يعني اللفظ المساواة أو الإنصاف. المتن يصوغ الوصية عربيًا على نحو طبيعي بوصفها معاملة عادلة ومنصفة، بينما تحفظ الحاشية احتمال «المساواة» ذي الأهمية التفسيرية.
- issue: المقابلة بين κύριοι وκύριον
  choice: السادة ... سيدًا
  alternative: الأرباب ... ربًّا
  rationale: تحافظ «السادة/سيدًا» على التكرار البلاغي وخضوع السادة البشر لسيد سماوي، مع تجنب ما قد توحي به «الأرباب» من تعدد الآلهة في العربية المعاصرة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حُفظت دلالة العبودية الصريحة، كما حُفظت المقابلة اللفظية بين السادة البشر والسيد في السماء. وُضع مؤشر الحاشية مباشرة بعد اللفظ الذي يشرح احتمال ἰσότητα.
