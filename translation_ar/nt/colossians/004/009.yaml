  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: ar
  text: مع أنسيمس، الأخ الأمين المحبوب، وهو منكم[a]. وسيخبرانكم بكل ما يجري هنا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وهو واحد منكم»، أو: «وهو من بينكم».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «بكل الأمور هنا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν Ὀνησίμῳ
  choice: مع أنسيمس
  rationale: تفيد σύν المصاحبة، وأنسيمس هو المرافق لتيخيكس المذكور في الآية السابقة. نُقل الاسم بصيغته العربية الشائعة.
- source_word: τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ
  choice: الأخ الأمين المحبوب
  rationale: تحفظ «الأمين» معنى πιστός من جهة الأمانة والموثوقية، وتنقل «المحبوب» دفء ἀγαπητός، مع إبقاء لغة القرابة الإيمانية في «الأخ» بلا شرح زائد.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: وهو منكم
  rationale: صياغة موجزة تحفظ احتمال دلالة ἐξ ὑμῶν على الانتماء إلى الجماعة أو المنشأ من بين المخاطبين، من غير استيراد تفاصيل من رسالة فليمون.
- source_word: γνωρίσουσιν
  choice: سيخبرانكم
  rationale: الفعل جمع، وفاعله المفهوم تيخيكس وأنسيمس معًا. «سيخبرانكم» عربية طبيعية تؤدي معنى الإبلاغ وجعل الأمر معلومًا.
- source_word: πάντα ... τὰ ὧδε
  choice: بكل ما يجري هنا
  rationale: العبارة تشير إجمالًا إلى الأمور والأحوال في موضع بولس. أُثبت البديل الأقرب إلى البنية اليونانية في الحاشية للمحافظة على سعة التعبير.
theological_decisions:
- issue: الدلالة الكنسية لكلمة ἀδελφῷ
  choice: الأخ
  alternative: الأخ في الإيمان
  rationale: السياق يدل على أخ في جماعة المؤمنين، لكن النص يقول «الأخ» فقط؛ لذلك تُحفظ الصورة العائلية من غير إضافة تفسيرية.
- issue: دلالة ἐξ ὑμῶν
  choice: وهو منكم
  alternative: وهو واحد منكم / وهو من بينكم
  rationale: تحفظ العبارة انتماء أنسيمس إلى المخاطبين، مع إبقاء احتمال المنشأ أو الانتساب وعدم تقرير وضع اجتماعي لا تصرح به الآية.
- issue: مرجع صيغة الجمع γνωρίσουσιν
  choice: سيخبرانكم
  alternative: سيعرّفانكم
  rationale: صيغة الجمع تعود طبيعيًا إلى تيخيكس المذكور في الآية السابقة وأنسيمس المذكور هنا؛ لا حاجة إلى إدخال الاسمين من جديد في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رسائلية وقورة. روعي اتصال مطلع الآية بما قبلها، واستُعمل المثنى في «سيخبرانكم» لإظهار صيغة الجمع اليونانية طبيعيًا.
