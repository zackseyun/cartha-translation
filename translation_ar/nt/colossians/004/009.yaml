  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة: «مع» للمصاحبة في σὺν، و«الأخ الأمين المحبوب» لأوصاف أنسيمس، و«وهو منكم» لعبارة ὅς ἐστιν ἐξ ὑμῶν. كما أن «سيخبرانكم» يعكس صيغة الجمع في γνωρίσουσιν، والمثنى مفهوم طبيعيًا من تيخيكس في الآية السابقة وأنسيمس هنا. و«بكل ما يجري هنا» يؤدي المعنى الإجمالي لـ πάντα ... τὰ ὧδε في سياق الأخبار عن أحوال موضع بولس، دون إضافة دعوى تاريخية محددة.'
