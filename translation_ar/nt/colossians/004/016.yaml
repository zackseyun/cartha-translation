id: COL.4.16
reference: Colossians 4:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: ar
  text: ومتى قُرئت هذه الرسالة عندكم[a]، فاحرصوا على أن تُقرأ أيضًا في كنيسة اللاودكيين، وأن تقرؤوا أنتم أيضًا الرسالة التي من لاودكية[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يرجح أن المقصود قراءة الرسالة على مسامع الجماعة، وإن كان الفعل اليوناني يعني في ذاته «قرأ» من غير أن يصرح بلفظ «جهرًا».
    reason: lexical_alternative
  - marker: b
    text: هوية هذه الرسالة غير معلومة. واليونانية تقول حرفيًا «التي من لاودكية»، فلا يلزم من ذلك أنها كانت موجهة أصلًا إلى أهل لاودكية؛ فقد تكون رسالة موجودة هناك أو مرسلة منها.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: قُرئت / تقرؤوا
  rationale: الفعل يعني «قرأ»، ويرجح في سياق الكنائس أن تكون القراءة جهرية أمام الجماعة، لكن النص لا يصرح بلفظ «جهرًا»، لذلك أُبقي المعنى الأوسع في المتن.
- source_word: παρ’ ὑμῖν
  choice: عندكم
  rationale: تفيد العبارة وجود القراءة لدى جماعة المؤمنين في كولوسي؛ و«عندكم» عربية طبيعية تستوعب معنى «بينكم» أو «في جماعتكم» من غير حصرها في فاعلية المخاطَبين.
- source_word: ἡ ἐπιστολή
  choice: هذه الرسالة
  rationale: أداة التعريف تشير سياقيًا إلى الرسالة الحاضرة التي يكتبها بولس، واسم الإشارة يوضح هذه الإحالة في العربية.
- source_word: ποιήσατε ἵνα
  choice: فاحرصوا على أن
  rationale: هذا التركيب يحث المخاطَبين على ضمان وقوع الفعل؛ و«احرصوا على أن» يحفظ قوة الأمر ويأتي طبيعيًا في العربية.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: في كنيسة اللاودكيين
  rationale: تحافظ الصياغة على بنية اليونانية التي تنسب الكنيسة إلى أهل لاودكية، بدل تحويل النسبة إلى صفة قد تكون أقل وضوحًا.
- source_word: τὴν ἐκ Λαοδικείας
  choice: الرسالة التي من لاودكية
  rationale: يحذف اليوناني اسم «الرسالة» اعتمادًا على السياق، لكن إظهاره في العربية لازم تقريبًا للوضوح. أما «من لاودكية» فتحافظ على دلالة ἐκ ولا تحوّلها إلى «إلى لاودكية».
theological_decisions:
- issue: هوية الرسالة التي من لاودكية
  choice: 'إبقاء هويتها غير محددة، مع ترجمة علاقتها المكانية حرفيًا: «التي من لاودكية».'
  alternative: اعتبارها رسالة موجهة إلى اللاودكيين، أو رسالة أُرسلت من لاودكية، أو رسالة دورية مرتبطة بها وربما كانت أفسس.
  rationale: لا يحدد النص اليوناني هوية الوثيقة ولا يقول صراحة إنها كانت موجهة إلى لاودكية؛ لذلك لا ينبغي حسم مسألة تاريخية أو قانونية لا يحسمها النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فاحرصوا» لصياغة الأمر بصورة طبيعية، وحُفظت عبارة «من لاودكية» لتجنب حسم هوية الرسالة أو وجهتها. وُضع كل من علامتي الحاشية [a] و[b] في المتن.
