base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: ar
  text: 'أرسلته إليكم لهذا الغرض عينه: لكي تعرفوا أحوالنا[a]، ولكي يشجّع قلوبكم.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «لكي نعرف أحوالكم».'
