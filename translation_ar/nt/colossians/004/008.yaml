lexical_decisions:
- source_word: ὃν ἔπεμψα πρὸς ὑμᾶς
  choice: أرسلته إليكم
  rationale: الضمير المتصل يعود إلى تيخيكس المذكور في الآية السابقة، وصيغة الماضي البسيط تنقل الفعل اليوناني طبيعيًا، و«إليكم» تعبّر عن اتجاه الإرسال.
- source_word: εἰς αὐτὸ τοῦτο
  choice: لهذا الغرض عينه
  rationale: تحافظ العبارة على معنى الغرض وعلى التوكيد الذي يفيده αὐτὸ τοῦτο، بلغة عربية فصيحة واضحة.
- source_word: ἵνα γνῶτε τὰ περὶ ἡμῶν
  choice: لكي تعرفوا أحوالنا
  rationale: «لكي» تصرّح بالغرض، و«أحوالنا» تنقل بإيجاز العبارة الاصطلاحية الدالة على أخبار بولس ورفقائه وظروفهم.
- source_word: παρακαλέσῃ
  choice: يشجّع
  rationale: الفعل قد يعني التشجيع أو التعزية أو الحث؛ وفي سياق إيفاد تيخيكس بالأخبار، «يشجّع» يحفظ اتساع المعنى دون تخصيص زائد.
- source_word: τὰς καρδίας ὑμῶν
  choice: قلوبكم
  rationale: ترجمة مباشرة تحفظ التعبير الكتابي عن باطن الإنسان ولا تستبدله بتفسير شارح.
theological_decisions:
- issue: الاختلاف النصي في اتجاه المعرفة ضمن جملة الغرض
  choice: لكي تعرفوا أحوالنا
  alternative: لكي نعرف أحوالكم
  rationale: 'يتبع المتن قراءة SBLGNT المقدمة: γνῶτε τὰ περὶ ἡμῶν. وتُذكر القراءة التي تعكس اتجاه المعرفة في الحاشية حفاظًا على الشفافية النصية.'
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعملت «أحوالنا» بدل الترجمة الحرفية الثقيلة «الأمور المتعلقة بنا»، وحُفظ تعبير «قلوبكم» وتوكيد «عينه».
