  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: ar
  text: يُسَلِّمُ عليكم لوقا، الطبيب المحبوب، وديماس.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: يُسَلِّمُ عليكم
  rationale: صيغة عربية طبيعية لتحية الرسائل، تنقل معنى إبلاغ السلام، مع أن الفعل اليوناني مفرد ومتقدم على فاعل مركب.
- source_word: ὑμᾶς
  choice: عليكم
  rationale: ضمير جمع للمخاطبين، ظاهر في لاحقة الجمع في «عليكم».
- source_word: Λουκᾶς
  choice: لوقا
  rationale: الصيغة العربية المألوفة للاسم اليوناني.
- source_word: ἰατρὸς
  choice: الطبيب
  rationale: المقابل العربي المباشر والطبيعي للمهنة التي يدل عليها اللفظ اليوناني.
- source_word: ἀγαπητὸς
  choice: المحبوب
  rationale: يحفظ دلالة المحبة والتقدير والنبرة الدافئة في وصف لوقا.
- source_word: καὶ
  choice: و
  rationale: حرف عطف بسيط يصل ديماس بلوقا في إرسال التحية.
- source_word: Δημᾶς
  choice: ديماس
  rationale: نقل صوتي عربي واضح للاسم اليوناني، موافق للاستعمال الكتابي الشائع.
theological_decisions:
- issue: نطاق وصف «المحبوب»
  choice: يصف «الطبيب المحبوب» لوقا وحده.
  alternative: إبقاء احتمال تعلق «المحبوب» بديماس أيضًا.
  rationale: التركيب اليوناني Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς يجعل «الطبيب» و«المحبوب» وصفين تابعين للوقا، ثم يعطف ديماس بعدهما.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعملت صيغة «يُسَلِّم عليكم» المألوفة في سياق الرسائل، وحُفظ ترتيب النص اليوناني الذي يقدّم فعل التحية ثم يسمّي لوقا وديماس.
