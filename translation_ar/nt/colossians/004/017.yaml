  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: ar
  text: 'وقولوا لأرخبس: «انتبه إلى الخدمة التي تسلَّمتها في الرب[a]، لكي تتمِّمها».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «الخدمة التي تسلَّمتها من الرب».'
    reason: قراءة تفسيرية بديلة لعبارة ἐν κυρίῳ.
lexical_decisions:
- source_word: εἴπατε
  choice: قولوا
  rationale: فعل أمر موجَّه إلى جماعة، و«قولوا لـ» تعبير عربي طبيعي يحفظ قوة الأمر وبنية الخطاب المباشر.
- source_word: Ἀρχίππῳ
  choice: لأرخبُّس
  rationale: نقل صوتي للاسم الشخصي اليوناني بصيغة عربية واضحة.
- source_word: Βλέπε
  choice: انتبه إلى
  rationale: أمر مفرد مضارع يفيد العناية واليقظة المستمرتين؛ و«انتبه إلى» واضحة ومعاصرة من غير صياغة عتيقة.
- source_word: διακονίαν
  choice: الخدمة
  rationale: اللفظة قد تعني خدمة أو مهمة موكولة. «الخدمة» تلائم السياق المسيحي من غير أن تفترض منصبًا كنسيًا محددًا.
- source_word: παρέλαβες
  choice: تسلَّمتها
  rationale: تفيد تلقي مسؤولية أو أمانة موكولة، و«تسلَّمتها» أوضح في الدلالة على التكليف من مجرد «أخذتها».
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحافظ على حرف الجر ἐν وعلى الاحتمال الدلالي المتعلق بالنطاق أو الارتباط، من غير حصره في معنى المصدر.
- source_word: ἵνα
  choice: لكي
  rationale: أداة غاية عربية طبيعية تحافظ على القوة الغرضية للعبارة.
- source_word: πληροῖς
  choice: تتمِّمها
  rationale: تفيد إنجاز الخدمة وإيفاءها حقها؛ وتحافظ «تتمِّمها» على معنى الإكمال والتنفيذ الكامل.
theological_decisions:
- issue: دلالة ἐν κυρίῳ
  choice: في الرب
  alternative: من الرب
  rationale: النص اليوناني يستعمل ἐν، ويمكن أن تشير العبارة إلى النطاق أو الارتباط بالرب، مع احتمال فهم المصدر ضمنًا. أُبقيت الصياغة الأقرب إلى اليونانية في المتن، ووُضع البديل في الحاشية للمحافظة على الانفتاح الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الخدمة» من غير تخصيصها بمنصب كنسي، وحُفظت صيغة الأمر المباشر والإيقاع الموجز للنص.
