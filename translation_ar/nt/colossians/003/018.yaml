  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: ar
  text: أَيَّتُهَا الزَّوْجَاتُ، اخْضَعْنَ[a] لِأَزْوَاجِكُنَّ، كَمَا يَلِيقُ[b] فِي الرَّبِّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كُنَّ خاضعاتٍ لأزواجكن».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كما كان يليق في الرب»؛ فالفعل اليوناني جاء بصيغة الماضي الناقص، لكنه يُفهم هنا على الأرجح بمعنى عام حاضر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: أيتها الزوجات
  rationale: في سياق إرشادات الأسرة، وبمقابلتها مع ἀνδράσιν، تدل الكلمة على الزوجات لا على النساء عمومًا. وصيغة النداء العربية واضحة وطبيعية.
- source_word: ὑποτάσσεσθε
  choice: اخضعن
  rationale: تنقل صيغة الأمر معنى وضع النفس تحت ترتيب أو سلطة في إطار العلاقة، من غير أن تُصاغ بصيغة مبني للمجهول توحي بالإخضاع القسري.
- source_word: ἀνδράσιν
  choice: لأزواجكن
  rationale: في هذا السياق الأسري تعني ἀνήρ الزوج، وضمير المخاطبات يبيّن العلاقة التي يحملها السياق.
- source_word: ὡς
  choice: كما
  rationale: تفيد معيار ملاءمة الفعل أو وجهه، لا العلة؛ ولذلك فـ«كما» أدق من «لأن».
- source_word: ἀνῆκεν
  choice: يليق
  rationale: مع أن الصيغة اليونانية ماضية من حيث الشكل، فهي هنا تعبير اصطلاحي ذو دلالة عامة حاضرة على ما هو لائق أو مناسب.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحافظ التعبير على الصلة المباشرة بالرب، ويجعل ملاءمة الوصية واقعة ضمن العلاقة به من غير توسع تفسيري.
theological_decisions:
- issue: نطاق الوصية وأساسها
  choice: «كما يليق في الرب»
  alternative: اعتبارها قاعدة اجتماعية مطلقة بلا قيد لاهوتي، أو وصل «في الرب» بالزوجات وحدهن
  rationale: يحفظ ترتيب العبارة اليونانية كون ملاءمة الفعل مؤطَّرة بالعلاقة بالرب، من غير تحويل الآية إلى تقرير عقائدي أوسع مما تقوله.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «اخضعن» لكونه مباشرًا ومألوفًا، مع حاشية تحفظ البديل الوصفي، وأُبقي تعبير «في الرب» حرفيًا لصون كثافته اللاهوتية وغموض نطاقه المشروع.
