  text: Whatever you do[a], work from the soul, as for the Lord and not for men[c][b],
translation:
  language: ar
  text: ومهما فعلتم، فاعملوه من أعماق أنفسكم[a]، على أنه للرب[b] لا للناس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من القلب» أو «بكل إخلاص»؛ وحرفيًّا: «من النفس».'
