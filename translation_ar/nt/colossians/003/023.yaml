lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: ومهما فعلتم
  rationale: التركيب الموصول مع ἐάν يفيد العموم وعدم التعيين؛ و«مهما فعلتم» تعبير عربي طبيعي يحفظ معنى «أيًّا يكن ما تفعلونه».
- source_word: ἐκ ψυχῆς
  choice: من أعماق النفس
  rationale: يحفظ صورة ψυχή في الأصل، مع صياغة عربية واضحة تدل على الإخلاص الداخلي وبذل النفس بكاملها، بدل اختزالها في حال مثل «بحماسة».
- source_word: ἐργάζεσθε
  choice: فاعملوا
  rationale: صيغة الأمر المستمر تحث على أداء العمل بجد، و«اعملوا» أوسع المقابلات العربية وأنسبها للسياق.
- source_word: ὡς
  choice: كما
  rationale: 'تفيد منظور العمل وطريقته: أن يعملوا على النحو الذي يعملون به للرب، من غير إضافة «كأن» التي قد توحي بأنه ليس للرب حقًّا.'
- source_word: τῷ κυρίῳ
  choice: للرب
  rationale: «الرب» يحفظ اللقب المسيحاني المرجح في السياق، مع إمكان حضور دلالة السيد في خلفية التعليم المنزلي.
- source_word: ἀνθρώποις
  choice: للناس
  rationale: ἀνθρώποις جمع عام يشير إلى البشر في مقابل الرب، و«الناس» في العربية أدق وأطبع من «الرجال» هنا، إذ لا يقصد الذكور وحدهم.
theological_decisions:
- issue: دلالة κύριος في سياق تعليم العبيد وأسيادهم
  choice: الرب
  alternative: السيد
  rationale: المرجع الأرجح هو الرب المسيح، لا مجرد سيد بشري، ولذلك حُفظ اللقب «الرب». ومع ذلك تشير الحاشية إلى ظلال معنى «السيد» التي يبرزها السياق المنزلي دون أن تستبدل القراءة الأساسية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُعملت «من أعماق النفس» للموازنة بين صورة الأصل ووضوح الدلالة، و«الناس» للدلالة العامة على البشر. وُضعت علامتا الحاشية في المتن، ولا حاجة إلى حاشية مستقلة لـ«الناس» لأن عمومها ظاهر في العربية.
