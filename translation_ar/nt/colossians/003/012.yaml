  text: Ἐνδύσασθε οὖν ὡς ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι, σπλάγχνα οἰκτιρμοῦ, χρηστότητα, ταπεινοφροσύνην, πραΰτητα, μακροθυμίαν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: ar
  text: فالبسوا إذن، بوصفكم مختاري الله، قديسين ومحبوبين، أحشاءَ رأفةٍ[a]، ولطفًا، وتواضعًا، ووداعةً[b]، وطولَ أناةٍ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «أحشاء رأفة»؛ وكانت الأحشاء تُستعمل للدلالة على المشاعر الداخلية العميقة، أي رأفة نابعة من الأعماق.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «حِلمًا».'
    reason: lexical_alternative
  - marker: c
    text: أي صبرًا طويلًا، ولا سيما في معاملة الآخرين.
    reason: lexical_clarification
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: البسوا
  rationale: يحفظ استعارة ارتداء الثياب في صيغة أمر عربية واضحة ومباشرة.
- source_word: οὖν
  choice: إذن
  rationale: تُظهر الاستنتاج والارتباط بما سبق من وصايا.
- source_word: ὡς ἐκλεκτοὶ τοῦ θεοῦ
  choice: بوصفكم مختاري الله
  rationale: ينقل هوية المخاطَبين بصفتهم مختارين من الله، من غير إدخال تصور مذهبي عن كيفية الاختيار.
- source_word: ἅγιοι καὶ ἠγαπημένοι
  choice: قديسين ومحبوبين
  rationale: يحافظ على الوصفين المتوازيين؛ و«محبوبين» ينقل حالة ثابتة ناشئة عن المحبة.
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: أحشاءَ رأفةٍ
  rationale: يحفظ الصورة الجسدية الأصلية الدالة على عاطفة رحيمة عميقة، مع إيضاح معناها في الحاشية.
- source_word: χρηστότητα
  choice: لطفًا
  rationale: لفظ عربي طبيعي يدل على حسن المعاملة والإحسان في سياق قائمة الفضائل.
- source_word: ταπεινοφροσύνην
  choice: تواضعًا
  rationale: ينقل معنى اتضاع الفكر بعبارة عربية مألوفة وواضحة.
- source_word: πραΰτητα
  choice: وداعةً
  rationale: تنقل الخلق الهادئ غير العنيف، وتحافظ على تميزه عن مجرد اللطف.
- source_word: μακροθυμίαν
  choice: طولَ أناةٍ
  rationale: يعكس على نحو أدق الصبر الممتد، ولا سيما تجاه الآخرين، ويحافظ على تميزه الدلالي.
theological_decisions:
- issue: صياغة ἐκλεκτοὶ τοῦ θεοῦ دون تحميلها مذهبًا محددًا في الاختيار
  choice: مختاري الله
  alternative: الذين اختارهم الله
  rationale: الصياغة المختارة تحفظ لغة الهوية والمبادرة الإلهية، بينما لا تشرح آلية الاختيار أو ترتيبه، وهو ما لا تفعله الآية.
- issue: نقل σπλάγχνα οἰκτιρμοῦ مع الحفاظ على صورتها المجازية
  choice: أحشاء رأفة
  alternative: قلبًا رحيمًا / رأفة عميقة
  rationale: يحفظ الاختيار الصورة الأصلية الغريبة نسبيًا بدل استبدالها سرًا بصورة «القلب»، وتوضح الحاشية المقصود.
- issue: تمييز πραΰτης عن الضعف أو الاستكانة
  choice: وداعة
  alternative: حِلم / لطف
  rationale: «وداعة» لفظ أخلاقي راسخ يدل على الرفق وضبط القوة، دون أن يفرض معنى الضعف.
translation_notes:
  register: عربية فصحى حديثة ذات نبرة كتابية كريمة وواضحة. حُفظت استعارة اللباس والصورة الجسدية في «أحشاء رأفة»، مع حاشية تمنع غموضها. استُعمل النصب في قائمة المفعولات التابعة لفعل «البسوا»، وحُفظت ألفاظ الهوية دون توسع مذهبي.
