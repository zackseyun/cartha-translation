  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: ar
  text: عالمين أنكم ستنالون من الرب مكافأة الميراث. أنتم تخدمون الربَّ المسيحَ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة الجملة الأخيرة: «اخدموا الربَّ المسيحَ». فالصيغة اليونانية يمكن أن تُفهم خبرًا أو أمرًا.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'أي: المسيح الرب؛ ويجوز من حيث ترتيب اللقبين أن تُصاغ: «المسيحَ الربَّ».'
    reason: alternative_rendering
lexical_decisions:
- source_word: εἰδότες
  choice: عالمين
  rationale: يحفظ صيغة اسم الفاعل واتصالها بما قبلها، من غير أن يفرض صراحة معنى سببيًّا مثل «لأنكم تعلمون».
- source_word: ἀπὸ κυρίου
  choice: من الرب
  rationale: ينقل ἀπό مع المضاف إليه بوصفه دالًّا على مصدر المكافأة، ويحفظ «الرب» كلقب.
- source_word: ἀπολήμψεσθε
  choice: ستنالون
  rationale: ينقل المستقبل ومعنى التلقّي بصياغة عربية طبيعية، بينما يعبّر الاسم التالي عن معنى الجزاء.
- source_word: ἀνταπόδοσιν
  choice: مكافأة
  rationale: تؤدي معنى الجزاء الإيجابي بلفظ عربي واضح ومعاصر؛ و«الجزاء» بديل ممكن لكنه قد يكون إيجابيًّا أو سلبيًّا.
- source_word: τῆς κληρονομίας
  choice: الميراث
  rationale: أُبقي التركيب الإضافي «مكافأة الميراث» ليحفظ إيجاز علاقة المضاف إليه في اليونانية من غير حسم ما إذا كان الميراث هو المكافأة نفسها أو وصفًا لها.
- source_word: τῷ κυρίῳ Χριστῷ
  choice: الربَّ المسيحَ
  rationale: ينقل اللقبين ويحفظ عمل الفعل في المفعول به؛ و«المسيح» في العربية يحمل الدلالة اللقبية المألوفة.
- source_word: δουλεύετε
  choice: أنتم تخدمون
  rationale: يقدّم القراءة الخبرية الممكنة في السياق بوصفها تذكيرًا بمن يخدمونه حقًّا. ولأن الصيغة اليونانية يمكن من جهة الشكل أن تكون خبرية أو أمرية، ذُكر البديل في الحاشية.
theological_decisions:
- issue: القوة النحوية لـ δουλεύετε
  choice: 'خبرية: «أنتم تخدمون»'
  alternative: 'أمرية: «اخدموا الرب المسيح»'
  rationale: الصيغة اليونانية مشتركة شكليًّا بين المضارع الخبري للمخاطبين جمعًا والأمر المضارع لهم. القراءة الخبرية تلائم التذكير المحفّز في سياق خطاب العبيد، لكن القراءة الأمرية ممكنة، لذلك لم تُخفَ في الحاشية.
- issue: دلالة Χριστῷ اللقبية
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الطبيعي الراسخ للقب Χριστός، ويحافظ هنا على دلالته اللقبية لا على كونه اسمًا شخصيًّا مجردًا.
- issue: علاقة المكافأة بالميراث
  choice: مكافأة الميراث
  alternative: المكافأة التي هي الميراث
  rationale: الإضافة اليونانية موجزة وتحتمل أن يكون الميراث مضمون المكافأة أو مميزًا لها؛ لذا حُفظ التركيب المضغوط من غير تفسير زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة. استُعمل «تنالون» بدل ألفاظ أشد تقادمًا، وحُفظت العبارة الإضافية الموجزة «مكافأة الميراث». وُضع الضبط الجزئي في «الربَّ المسيحَ» لتوضيح أنهما مفعول به ولقبان لشخص واحد.
