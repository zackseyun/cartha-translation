source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: ar
  text: أيها العبيد[a]، أطيعوا في كل شيء سادتكم بحسب الجسد[b]، لا بخدمةٍ للعين[c]، كمن يبتغون مرضاة الناس، بل بإخلاص القلب، وأنتم تخافون الرب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تُترجم الكلمة اليونانية δοῦλοι أيضًا «خدمًا» أو «عبيدًا مملوكين»، لكنها تدل عادةً على أناس مستعبَدين خاضعين لسلطة سيد.
    reason: lexical_alternative
  - marker: b
    text: يمكن ترجمة «بحسب الجسد» إلى «الأرضيين»؛ والمقصود أن سلطان هؤلاء السادة محصور في نطاق العلاقات البشرية في هذا العالم.
    reason: lexical_alternative
  - marker: c
    text: «خدمة للعين» هي خدمة أو عمل لا يُؤدَّى إلا عند مراقبة الآخرين أو طلبًا لاستحسانهم.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: أيها العبيد
  rationale: يدل اللفظ في سياق نظام البيت القديم على أشخاص مستعبَدين خاضعين لسلطة سادة، لذلك يحفظ «العبيد» الواقع الاجتماعي ولا يلطّفه إلى علاقة عمل حديثة.
- source_word: ὑπακούετε κατὰ πάντα
  choice: أطيعوا ... في كل شيء
  rationale: ينقل صيغة الأمر ومدى الطاعة الوارد في العبارة اليونانية بوضوح طبيعي.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: سادتكم بحسب الجسد
  rationale: «سادتكم» يبيّن المرجع البشري، و«بحسب الجسد» يحفظ تعبير بولس والمقابلة الضمنية مع الرب، من غير اختزاله إلى «الدنيويين».
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: لا بخدمة العين
  rationale: يحفظ الصورة المركبة النادرة التي تصف خدمة تؤدَّى بقصد الظهور أمام عين الرقيب، وتوضحها الحاشية.
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: كمن يطلبون رضا الناس
  rationale: تعبير عربي طبيعي ينقل معنى السعي المذموم إلى استرضاء البشر.
- source_word: ἀλλ’ ἐν ἁπλότητι καρδίας
  choice: بل بإخلاص القلب
  rationale: تفيد ἁπλότης هنا صدق القصد وعدم ازدواجه، لا السذاجة أو البساطة الذهنية.
- source_word: φοβούμενοι τὸν κύριον
  choice: خائفين الرب
  rationale: يحفظ مفهوم مخافة الرب وقوة اسم الفاعل الدال على الهيئة أو الدافع، كما يميّز الرب الإلهي من السادة البشريين.
theological_decisions:
- issue: التوجيه الأخلاقي في سياق العبودية
  choice: التصريح بالواقع الاجتماعي بلفظي «العبيد» و«سادتكم»، مع إبقاء التمييز بين السادة بحسب الجسد والرب.
  alternative: استعمال «الخدم» أو تصوير السادة بوصفهم أرباب عمل حديثين.
  rationale: النص يتحدث عن العبودية في نظام البيت القديم؛ وتحديث المصطلحات إلى علاقة وظيفية يحجب التوتر التاريخي والأخلاقي من غير سند لغوي.
- issue: معنى مخافة الرب
  choice: «خائفين الرب»
  alternative: «موقّرين الرب»
  rationale: الترجمة المختارة لا تختزل φόβος في التوقير وحده، بل تحفظ سعة المفهوم الكتابي من غير شرح عقائدي زائد.
translation_notes:
  register: صياغة عربية فصحى واضحة وكريمة، تحافظ على مصطلحات النص التاريخية وعلى المقابلة بين السادة البشريين والرب. استُعملت «خدمة العين» حفاظًا على الصورة الأصلية مع حاشية شارحة، وتُجنبت مساواة العبودية القديمة بعلاقة العمل الحديثة.
