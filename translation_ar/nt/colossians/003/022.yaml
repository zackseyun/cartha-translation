    issue: موضع «بحسب الجسد» في الجملة العربية ملتبس نحويًا.
    rationale: في الأصل اليوناني κατὰ σάρκα يصف κυρίοις («السادة بحسب الجسد»)، لا نطاق الأمر κατὰ πάντα («في كل شيء»). وضعه قبل «في كل شيء» بعد «سادتكم» قد يسمح بقراءة غير مقصودة؛ فجعله وصفًا مباشرًا للسادة يزيل الالتباس.
  - severity: low
    issue: «خائفين الرب» صياغة مختزلة وأقل انسيابًا.
    rationale: هي مفهومة، لكن «وأنتم تخافون الرب» ينقل اسم الفاعل اليوناني بوصفه هيئة/دافعًا بعبارة عربية فصيحة واضحة.
  - severity: low
    issue: الحاشية (ج) تشرح «خدمة العين» بتركيز على الظهور الحسن أكثر من فعل الخدمة عند المراقبة.
    rationale: الأصل يدل على أداء الخدمة طلبًا لما تراه العين أو عند المراقبة؛ ويمكن جعل الشرح أدق وأقصر.
