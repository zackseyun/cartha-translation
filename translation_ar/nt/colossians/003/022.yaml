  to: أيها العبيد[a]، أطيعوا في كل شيء سادتكم بحسب الجسد[b]، لا بخدمةٍ للعين[c]، كمن يبتغون مرضاة الناس، بل بإخلاص القلب، وأنتم تخافون الرب.
  rationale: تُعيد المراجعة ترتيب «في كل شيء» و«سادتكم بحسب الجسد» ليظهر بوضوح أن الوصف «بحسب الجسد» متعلق بالسادة، كما في اليونانية. وتستبدل «بخدمة العين» بـ«بخدمةٍ للعين» لتحسين السلاسة مع الحفاظ على الصورة، وتصوغ اسم الفاعل الأخير بعبارة عربية طبيعية من غير تغيير في المعنى أو في درجة العبارة الأصلية. الحواشي تبقى مثبّتة عند الألفاظ ذاتها ومعانيها.
