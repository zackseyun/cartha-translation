review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: «العبيد»، والأمر بالطاعة «في كل شيء»، و«السادة بحسب الجسد»، ورفض الخدمة لمجرد المراقبة، وإخلاص القلب ومخافة الرب. لكن ترتيب «سادتكم بحسب الجسد في كل شيء» قد يوهم بأن «بحسب الجسد» يقيّد «في كل شيء» بدل أن يصف السادة، وتعبير «خائفين الرب» أقل سلاسة في العربية الفصحى المعاصرة من «وأنتم تخافون الرب».'
  naturalness: «خدمة العين» مفهوم في الترجمة الكتابية وتدعمه الحاشية، لكنه أيسر في الجملة بصيغة «خدمةٍ للعين». كما أن «كمن يطلبون رضا الناس» سليم، لكن «ابتغاء مرضاة الناس» أوضح في ربطه بالنهي عن الدافع. إعادة ترتيب العبارة تجعل العلاقة النحوية أوضح وأكثر طبيعية.
  terminology: «العبيد» و«السادة» مناسبان للسياق التاريخي ولا يخففان واقع العبودية. «بحسب الجسد» يحافظ على العبارة البولسية. «الرب» مناسب لـ κύριον. تُبقي المراجعة «إخلاص القلب» لمعنى ἁπλότης هنا.
  issues:
