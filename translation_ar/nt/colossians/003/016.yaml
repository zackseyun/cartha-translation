source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: ar
  text: لِتَسْكُنْ كلمةُ المسيح فيكم بغنى[a]، بكل حكمة، معلِّمين ومنذرين بعضكم بعضًا بالمزامير والتسابيح والأغاني الروحية، ومرنِّمين بالنعمة[b] في قلوبكم لله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الضمير في «فيكم» جمع؛ وقد يُفهم منه سكن كلمة المسيح في الجماعة كلها، أو في المؤمنين أفرادًا.
    reason: alternative_reading
  - marker: b
    text: 'أو: «بشكر» أو «بامتنان». يمكن أن تدل العبارة اليونانية هنا على النعمة أو على الشكر والامتنان بحسب السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος
  choice: كلمة
  rationale: تحفظ «كلمة» سعة اللفظ اليوناني، إذ يمكن أن تشير إلى القول أو الرسالة المتعلقة بالمسيح من غير حصرها في معنى واحد.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، كما أن تركيب «كلمة المسيح» يحفظ انفتاح الإضافة على معنى المصدر أو المضمون.
- source_word: ἐνοικείτω
  choice: لِتَسْكُنْ
  rationale: تحفظ صورة السكن المستمر التي يفيدها فعل الأمر المضارع، وهي صياغة عربية واضحة وطبيعية.
- source_word: ἐν ὑμῖν
  choice: فيكم
  rationale: تنقل حرف الجر والضمير الجمع مباشرة، وتبقي المجال مفتوحًا للسكن في الجماعة بوصفها كلًّا أو في أفرادها.
- source_word: πλουσίως
  choice: بغنى
  rationale: تعبّر عن الوفرة والامتلاء مع الحفاظ على الصورة المجازية في الأصل.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: بكل حكمة
  rationale: صياغة قريبة من اليونانية، وتبقي احتمال تعلق العبارة بسكن الكلمة أو بالتعليم والإنذار التاليين.
- source_word: διδάσκοντες καὶ νουθετοῦντες
  choice: معلِّمين ومنذرين
  rationale: «معلِّمين» تنقل التعليم بوضوح، و«منذرين» تحافظ على البعد التصحيحي والتحذيري في νουθετέω.
- source_word: ἑαυτοὺς
  choice: بعضكم بعضًا
  rationale: الضمير الانعكاسي الجمع يُستعمل هنا استعمالًا تبادليًا، وهذه هي الصياغة العربية الطبيعية للعمل المتبادل داخل الجماعة.
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: بالمزامير والتسابيح والأغاني الروحية
  rationale: تحافظ على تمييز الأنواع الثلاثة، وعلى ارتباط صفة «الروحية» بالأغاني بحسب ترتيب اليونانية.
- source_word: ἐν χάριτι
  choice: بالنعمة
  rationale: تحفظ الصلة اللفظية الأساسية بـχάρις ولا تحسم وحدها بين النعمة والامتنان؛ ويُذكر البديل السياقي في الحاشية.
- source_word: ᾄδοντες
  choice: مرنِّمين
  rationale: «الترنيم» تعبير عربي طبيعي عن الغناء التعبدي المقصود في السياق.
theological_decisions:
- issue: دلالة Χριστοῦ
  choice: المسيح
  alternative: لا بديل دلالي لازم في العربية؛ فاللفظ نفسه يحمل معنى اللقب المسياني
  rationale: العربية تنقل اللقب اليوناني مباشرة بكلمة «المسيح»، من غير تحويله إلى اسم مجرد أو إضعاف خلفيته المسيانية.
- issue: الدلالة الجماعية أو الفردية لعبارة ἐν ὑμῖν
  choice: فيكم، مع بيان الاحتمالين في الحاشية
  alternative: بينكم
  rationale: «فيكم» أقرب إلى تركيب الأصل، والضمير الجمع يسمح بفهم السكن في الجماعة كلها أو في المؤمنين أفرادًا؛ لذلك لم يُحسم التوتر لصالح أحد الوجهين.
- issue: معنى ἐν χάριτι
  choice: بالنعمة
  alternative: بشكر أو بامتنان
  rationale: يمكن أن تدل χάρις هنا على النعمة أو على الشكر والامتنان. أُبقي اللفظ الأقرب في المتن وحُفظ البديل في الحاشية.
translation_notes:
  register: العربية فصحى معاصرة واضحة ذات نبرة كتابية وقورة. حُفظت بنية الجملة اليونانية بقدر يسمح به الأسلوب العربي، مع تجنب الألفاظ الطائفية الخاصة وعدم حسم مواضع الغموض النصي والدلالي.
