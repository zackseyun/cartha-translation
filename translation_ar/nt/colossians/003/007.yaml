  text: وفي هذه الأمور[a] سلكتم أنتم أيضًا فيما مضى، حين كنتم تعيشون فيها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الأمور التي سلكتم فيها أنتم أيضًا فيما مضى، حين كنتم تعيشون فيها». ويمكن ترجمة الضمير الموصول اليوناني ترجمة أقرب إلى اللفظ: «في الأمور التي».'
