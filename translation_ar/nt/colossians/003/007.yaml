lexical_decisions:
- source_word: ἐν οἷς
  choice: وفي هذه الأمور
  rationale: أُعيد الضمير الموصول اليوناني على الأمور المذكورة في السياق السابق بصياغة عربية طبيعية، مع إبقاء دلالة ἐν على المجال الذي جرى فيه السلوك.
- source_word: καὶ ὑμεῖς
  choice: أنتم أيضًا
  rationale: إظهار الضمير المنفصل يحفظ توكيد ὑμεῖς، و«أيضًا» تنقل معنى καί الذي يفيد اشتراك المخاطَبين سابقًا في هذا السلوك.
- source_word: περιεπατήσατε
  choice: سلكتم
  rationale: «سلك» تعبير عربي واضح يحفظ الاستعارة البولسية الدالة على نهج الحياة، ويظل متميزًا من فعل العيش الآتي في الجملة.
- source_word: ποτε
  choice: فيما مضى
  rationale: تنقل الإشارة إلى زمن سابق بصورة عربية طبيعية ومحددة بما يكفي من غير زيادة على النص.
- source_word: ὅτε
  choice: حين
  rationale: أداة زمنية طبيعية تربط سلوكهم السابق بحال حياتهم السابقة.
- source_word: ἐζῆτε
  choice: كنتم تعيشون
  rationale: صيغة «كنتم تعيشون» تعكس الاستمرار الماضي في الفعل الناقص، وتحفظ الفرق بين ζάω وبين الاستعمال المجازي لفعل περιπατέω.
- source_word: ἐν τούτοις
  choice: فيها
  rationale: الضمير يعود إلى الأمور أو الممارسات المذكورة، ويتجنب تكرار «هذه الأمور» مع الحفاظ على معنى الوجود ضمن مجالها.
theological_decisions:
- issue: العلاقة بين «سلكتم» و«كنتم تعيشون» في الوصف الأخلاقي
  choice: الحفاظ على التمييز بين السلوك السابق ومجال الحياة السابق.
  alternative: تسوية الفعلين وترجمتهما كليهما بمعنى «عشتم».
  rationale: يعكس هذا الاختيار اختلاف الفعلين اليونانيين περιπατέω وζάω، ويحفظ طبقتي الوصف من غير تحميل العبارة تقريرًا عقائديًا زائدًا.
- issue: مرجع ἐν οἷς وصيغته النحوية
  choice: «في هذه الأمور» على أنها إحالة إلى الأمور أو الرذائل المذكورة قبلًا.
  alternative: «في التي» أو «بين الذين»، مع إبقاء الموصول أقرب إلى صورته اليونانية واحتمالات مرجعه النحوي.
  rationale: السياق يرجح الإحالة إلى الممارسات السابقة، لكن الحاشية تحفظ الصياغة الموصولية الأقرب إلى اليونانية ولا تخفي ما في التركيب من قابلية للترجمة الحرفية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختير «سلكتم» للحفاظ على الاستعارة الأخلاقية المألوفة، و«كنتم تعيشون» لإبراز الاستمرار والتمييز المعجمي. وُضعت علامة الحاشية بعد الجملة لأنها تتعلق بصياغة صدر الآية.
