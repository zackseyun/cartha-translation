  source_fidelity: المسودة دقيقة إجمالًا في الأمر بطرح القائمة وفي تمييز الغضب عن الانفعال الغاضب. لكن «التجديف» في العربية المعاصرة ينصرف غالبًا إلى الإساءة إلى الله، بينما βλασφημία هنا، في سياق الرذائل المتعلقة بالعلاقات والكلام، أوسع ويرجح أن تعني الكلام المسيء أو التشهيري؛ ولا يقيّد النص متعلَّقه صراحة.
  naturalness: «اطرحوا أنتم أيضًا هذه كلَّها» مفهومة لكنها أقل سلاسة في العربية الحديثة. «تخلَّصوا أنتم أيضًا من كل هذه الأمور» طبيعية وتحفظ صورة التخلي المقصودة. كما أن وصل «من أفواهكم» مباشرة بالكلام البذيء يزيل احتمال تعلّقه بالقائمة كلها.
  terminology: «الغيظ» أنسب من «السخط» لـ θυμός في مقابلة «الغضب» لـ ὀργή، إذ يدل على ثورة الغضب أو حدته. و«الكلام المسيء» يحفظ اتساع βλασφημία دون تحميله معنى دينيًا حصريًا.
