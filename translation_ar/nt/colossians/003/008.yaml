  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: ar
  text: 'أما الآن، فتخلَّصوا أنتم أيضًا من كل هذه الأمور: الغضب، والغيظ، والخبث، والكلام المسيء، والكلام البذيء الذي يخرج من أفواهكم.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: اطرحوا
  rationale: فعل يفيد نزع الشيء والتخلّص منه، ويحافظ على صورة خلع السلوك القديم في السياق.
- source_word: ὀργήν
  choice: الغضب
  rationale: يدل على الغضب بوصفه حالة أو موقفًا مستقرًّا نسبيًّا.
- source_word: θυμόν
  choice: السخط
  rationale: يميّزه عن ὀργή، مع الإبقاء على دلالة الانفعال الغاضب الحاد دون حصره في فوران لحظي فقط.
- source_word: κακίαν
  choice: الخبث
  rationale: ينقل معنى الشر وسوء القصد في هذا السياق الأخلاقي.
- source_word: βλασφημίαν
  choice: التجديف
  rationale: يحفظ اتساع اللفظ اليوناني الذي قد يشمل الكلام المسيء إلى الله أو إلى الناس، دون تقييده صراحةً بالقذف وحده.
- source_word: αἰσχρολογίαν
  choice: الكلام البذيء
  rationale: تعبير عربي طبيعي يدل على القول المخزي أو الفاحش.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: من أفواهكم
  rationale: ترجمة مباشرة وطبيعية لصورة خروج الكلام من الفم، مع الجمع الملائم للمخاطَبين.
theological_decisions:
- issue: مدى معنى βλασφημία
  choice: التجديف
  alternative: الافتراء أو الكلام المسيء
  rationale: أُبقي اللفظ واسعًا كما في الأصل، إذ يمكن أن يدل على كلام مهين أو تشهيري بحسب متعلَّقه، ولا يذكر النص هنا متعلَّقًا صريحًا.
