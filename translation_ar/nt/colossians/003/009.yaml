translation:
  language: ar
  text: لا يكذب بعضكم على بعض، لأنكم خلعتم الإنسان العتيق مع أعماله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارة: «إذ خلعتم الإنسان العتيق مع أعماله» أو «بعد أن خلعتم الإنسان العتيق مع أعماله». الصيغة اليونانية اسم فاعل، وقد تُنقل بصورة أقرب إلى اللفظ؛ والأرجح في السياق أنها تبيّن أساس النهي. ويمكن ترجمة «الإنسان العتيق» تفسيرياً: «الذات القديمة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: لا تكذبوا
  rationale: نهي مباشر وطبيعي في العربية، ينقل معنى ψεύδομαι من غير افتراض أن المخاطبين كانوا مستمرين في الكذب.
- source_word: εἰς ἀλλήλους
  choice: بعضكم على بعض
  rationale: تعبير عربي مألوف يحفظ المعنى التبادلي للكذب في علاقة المؤمنين بعضهم ببعض.
- source_word: ἀπεκδυσάμενοι
  choice: لأنكم خلعتم
  rationale: اسم الفاعل اليوناني الماضي يعود على المخاطبين، ويرجح في السياق أنه يبين أساس النهي. وفعل «خلع» يحفظ استعارة نزع الثوب ودلالة الفعل المكتمل.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: الإنسان العتيق
  rationale: يحفظ الاسم المفرد وصورة بولس المقابلة لـ«الإنسان الجديد» في الآية التالية؛ و«العتيق» أنسب هنا من «القديم» لأنه يدل على الحالة السابقة البالية دون أن يعني مجرد التقدم في السن.
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: مع أعماله
  rationale: «مع» تنقل المصاحبة، و«أعماله» تعبر بوضوح عن πράξεις وتطابق مرجع الضمير المفرد المذكر «الإنسان العتيق».
theological_decisions:
- issue: دلالة «الإنسان العتيق»
  choice: الإبقاء على صورة الإنسان العتيق
  alternative: الذات القديمة
  rationale: الصياغة المختارة تحفظ المقابلة الأنثروبولوجية المقصودة مع الإنسان الجديد، ولا تختزل العبارة تفسيريا في الجانب النفسي الفردي.
- issue: العلاقة النحوية لاسم الفاعل ἀπεκδυσάμενοι
  choice: 'سببية: «لأنكم خلعتم»'
  alternative: 'صيغة ظرفية أقرب إلى اللفظ: «إذ خلعتم» أو «وقد خلعتم»'
  rationale: السياق يرجح أن خلع الإنسان العتيق هو أساس النهي، لكن الحاشية تبقي المجال الدلالي للصيغة اليونانية التي يمكن نقلها بصورة أقل تحديدا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظت استعارة خلع الثوب والمقابلة بين الإنسان العتيق والجديد، مع تجنب لغة مذهبية خاصة.
