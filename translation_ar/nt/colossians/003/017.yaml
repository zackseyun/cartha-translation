  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: ar
  text: وكلُّ ما تفعلونه، في قولٍ أو فعلٍ، فافعلوا كلَّ شيءٍ باسم الرب يسوع، شاكرين الله الآب به.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: كلُّ ما تفعلونه
  rationale: ينقل التركيب اليوناني الدال على الشمول غير المحدود بعبارة عربية طبيعية وواضحة.
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: قولًا أو فعلًا
  rationale: يحافظ على التقابل الموجز بين الكلام والعمل، ويأتي بأسلوب عربي فصيح وطبيعي.
- source_word: πάντα
  choice: كلَّ شيء
  rationale: يلخّص ما سبق ويؤكد شمول الوصية لجميع جوانب السلوك.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: باسم الرب يسوع
  rationale: ترجمة مباشرة تحفظ سعة التعبير الكتابي، بما قد يشمله من السلطان والنيابة والانتساب، من غير حصره في معنى واحد.
- source_word: κυρίου
  choice: الرب
  rationale: ينقل اللقب المسيحاني وثقله في سياق العهد الجديد، ولا يختزله في معنى اجتماعي مثل السيد أو المعلّم.
- source_word: εὐχαριστοῦντες
  choice: شاكرين
  rationale: يحفظ صيغة اسم الفاعل المصاحبة للوصية ويدل على أن الشكر ملازم لكل ما يفعلونه.
- source_word: τῷ θεῷ πατρὶ
  choice: الله الآب
  rationale: ينقل البدل اليوناني بعبارة عربية واضحة ومستقرة، من غير إضافة عطف غير موجود في النص.
- source_word: δι’ αὐτοῦ
  choice: بواسطته
  rationale: يبيّن معنى الوساطة الذي تؤديه διά مع المضاف إليه، مع إبقاء الضمير عائدًا طبيعيًا إلى الرب يسوع.
theological_decisions:
- issue: دلالة «باسم الرب يسوع»
  choice: الإبقاء على التعبير «باسم الرب يسوع» في المتن.
  alternative: تحت سلطان الرب يسوع؛ أو بصفتي ممثلين للرب يسوع.
  rationale: للتعبير مدى كتابي واسع يشمل السلطان والتمثيل والانتساب؛ والإبقاء عليه يحفظ هذا الثراء ولا يحسمه في تفسير أضيق.
- issue: مرجع الضمير في «بواسطته»
  choice: يعود الضمير إلى الرب يسوع، الذي يُرفع الشكر إلى الله الآب بواسطته.
  alternative: اعتبار الضمير إحالة عامة بلا إبراز واضح لوساطة يسوع.
  rationale: الرب يسوع هو المرجع الأقرب نحويًا، وهذه القراءة تتفق مع تركيب الجملة من غير إضافة صياغة عقائدية إلى النص.
translation_notes:
  register: العربية فصحى معاصرة واضحة وذات نبرة كريمة. حُفظ الإيقاع المتوازن في «قولًا أو فعلًا»، كما أُبقي التعبير الكتابي «باسم الرب يسوع» مع شرح مداه في الحاشية بدل تضييق معناه في المتن.
