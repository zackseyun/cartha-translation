lexical_decisions:
- source_word: οἱ πατέρες
  choice: يا أيها الآباء
  rationale: ينقل المخاطَب المحدد في اليونانية، أي الآباء، من غير تعميمه إلى الوالدين، وتلائم أداة النداء العربية سياق الوصايا المباشرة.
- source_word: μὴ ἐρεθίζετε
  choice: لا تغيظوا
  rationale: يفيد الفعل إثارة الأولاد واستفزازهم على نحو سلبي؛ و«تغيظوا» تعبير عربي واضح وموجز يحفظ هذا المعنى السببي.
- source_word: τὰ τέκνα ὑμῶν
  choice: أولادكم
  rationale: لفظ «أولادكم» طبيعي وشامل للأبناء والبنات، وينقل معنى الذرية المقصود في τέκνα.
- source_word: ἵνα μὴ
  choice: لئلا
  rationale: تحفظ «لئلا» دلالة الغاية أو النتيجة المقصودة في التركيب ἵνα μή بعبارة عربية فصيحة ومباشرة.
- source_word: ἀθυμῶσιν
  choice: يفشلوا
  rationale: يعبّر الفعل هنا عن فقدان الشجاعة والهمة والإصابة بالإحباط؛ و«يفشلوا» في العربية الفصحى يحمل معنى الجبن وذهاب القوة المعنوية، لا مجرد عدم النجاح.
theological_decisions:
- issue: نطاق المخاطَبين في οἱ πατέρες ضمن تعليمات الأسرة
  choice: الخطاب موجَّه تحديدًا إلى الآباء
  alternative: تعميم الخطاب ليشمل الوالدين
  rationale: النص اليوناني يذكر الآباء صراحة. وقد يمتد تطبيق المبدأ إلى غيرهم، لكن الترجمة تحفظ هوية المخاطَبين ولا تستبدل بها تعبيرًا أعم.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُخدمت صيغة النداء الطبيعية في العربية، وحُفظ إيجاز الوصية والتقابل بين سلوك الآباء وأثره النفسي في الأولاد.
