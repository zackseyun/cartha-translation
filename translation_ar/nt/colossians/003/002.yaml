lexical_decisions:
- source_word: τὰ ἄνω
  choice: ما فوق
  rationale: يحافظ على الاستعمال الاسمي للتعبير اليوناني وعلى المقابلة المكانية مع «ما على الأرض»، من غير إضافة تفسير صريح مثل «الأمور السماوية».
- source_word: φρονεῖτε
  choice: وجِّهوا اهتمامكم إلى
  rationale: ينقل معنى توجيه الفكر والاهتمام والتوجّه الداخلي، لا مجرد التفكير العابر، كما يلائم صيغة الأمر الحاضر الدالة على توجّه مستمر.
- source_word: μὴ
  choice: لا
  rationale: ينفي متعلَّق الأمر الثاني في مقابلة مباشرة وموجزة.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: ما على الأرض
  rationale: يحفظ البناء الاسمي والمقابلة المحسوسة بين فوق والأرض، ولا يحوّل العبارة إلى الصفة الأكثر تفسيرًا «الأمور الأرضية».
- source_word: γῆς
  choice: الأرض
  rationale: السياق الكوني المقابل لـ«فوق» يدل على الأرض، لا على بلد أو إقليم بعينه.
theological_decisions:
- issue: طبيعة الوصية في φρονεῖτε
  choice: دعوة إلى توجيه الفكر والاهتمام والتوجّه الداخلي نحو ما فوق
  alternative: أمر أضيق بمجرد التفكير الذهني فيما فوق
  rationale: الفعل اليوناني يشمل العقلية والاهتمام والتوجّه، وتعبير «وجِّهوا اهتمامكم» يحفظ هذه السعة الأخلاقية والروحية من غير إدخال مضمون عقائدي زائد.
