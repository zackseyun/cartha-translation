  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: ar
  text: وفوق هذا كلِّه، البسوا المحبة، فهي رباط الكمال.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رباط التمام»، أو: «رباط النضج».'
    reason: بدائل معجمية لكلمة τελειότης، مع بقاء علاقة الإضافة محتملة لأكثر من وجه.
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: وفوق هذا كلِّه
  rationale: يحافظ على صورة اللباس المستمرة من السياق، إذ تُلبس المحبة فوق سائر الخصال، كما ينقل معنى الأولوية والتوكيد.
- source_word: τὴν ἀγάπην
  choice: المحبة
  rationale: المقابل العربي الطبيعي والدقيق لـἀγάπη في هذا السياق، حيث تُعرض بوصفها الخصلة الجامعة.
- source_word: '[فعل مقدَّر من السياق: ἐνδύσασθε في ع 12]'
  choice: البسوا
  rationale: المفعول به في اليونانية متعلق بفعل الأمر السابق «البسوا». وإظهاره بالعربية ضروري لاكتمال الجملة ويحفظ استعارة اللباس.
- source_word: ὅ
  choice: فهي
  rationale: الضمير اليوناني المحايد يعلّق على مفهوم المحبة أو الوصية السابقة بوصفها وحدة. والصياغة العربية «فهي» طبيعية وتحيل إلى «المحبة» من غير تحميل العبارة تفسيرًا زائدًا.
- source_word: σύνδεσμος
  choice: رباط
  rationale: يدل على ما يربط ويجمع. و«رباط» موجز وفصيح ويحفظ الصورة المجازية دون حصرها في المعنى التشريحي.
- source_word: τῆς τελειότητος
  choice: الكمال
  rationale: يحفظ اتساع τελειότης، التي قد تدل على الكمال أو التمام أو النضج، كما يبقي علاقة المضاف بالمضاف إليه موجزة وغير محسومة تفسيريًا.
theological_decisions:
- issue: دلالة «رباط الكمال» (σύνδεσμος τῆς τελειότητος)
  choice: الإبقاء على العبارة الموجزة «رباط الكمال» بحيث تظهر المحبة رباطًا جامعًا في صلة بالكمال.
  alternative: الرباط الذي يحقق التمام؛ أو رباط النضج؛ أو الرباط المنتمي إلى الكمال.
  rationale: 'صيغة الإضافة اليونانية تحتمل علاقات متقاربة: أن تكون المحبة رباطًا يجمع الخصال في تمام، أو رباطًا يفضي إلى النضج، أو رباطًا يخص الكمال. تحافظ الترجمة على هذا التوتر بدل حسمه.'
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «البسوا» لإبقاء استعارة اللباس من السياق، و«وفوق هذا كلِّه» لنقل معنى الأولوية وما يُلبس فوق سائر الخصال. وُضعت علامة الحاشية بعد العبارة التي تشرحها مباشرة.
