reference: Colossians 3:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: ar
  text: 'فَأَمِيتُوا إِذًا الأَعْضَاءَ الَّتِي عَلَى الأَرْضِ[a]: الفُجُورَ الجِنْسِيَّ، وَالنَّجَاسَةَ، وَالشَّهْوَةَ، وَالرَّغْبَةَ الشِّرِّيرَةَ، وَالطَّمَعَ[b] الَّذِي هُوَ عِبَادَةُ الأَوْثَانِ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما هو أرضيٌّ فيكم». واليونانية حرفيًّا: «الأعضاء التي على الأرض».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الجشع».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: فَأَمِيتُوا
  rationale: صيغة أمر ماضٍ في اليونانية تدعو إلى فعل حاسم؛ و«أميتوا» تحفظ صورة الإماتة وقوة الأمر.
- source_word: οὖν
  choice: إِذًا
  rationale: تفيد الاستنتاج مما سبق، و«إذًا» تربط الوصية بحجة السياق السابق ربطًا طبيعيًا.
- source_word: μέλη
  choice: أَعْضَاءَكُم
  rationale: تحفظ استعارة أعضاء الجسد. أُضيف ضمير المخاطبين في العربية لإيضاح المقصود الذي يدل عليه السياق، مع أن اليونانية تقول حرفيًا «الأعضاء».
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: الَّتِي عَلَى الْأَرْضِ
  rationale: ترجمة قريبة من البنية اليونانية، تحفظ الصورة المكانية ولا تستبدلها بتفسير تجريدي مثل «الطبيعة الأرضية».
- source_word: πορνείαν
  choice: الزِّنَى
  rationale: لفظ عربي واضح وشائع للدلالة على العلاقات الجنسية غير المشروعة، وهو مناسب في تعداد الرذائل هنا.
- source_word: ἀκαθαρσίαν
  choice: النَّجَاسَةَ
  rationale: يحفظ المعنى الأخلاقي الواسع لعدم الطهارة، وهو تعبير كتابي عربي مفهوم.
- source_word: πάθος
  choice: الْهَوَى
  rationale: يدل هنا على الانفعال الشهواني المضطرب، و«الهوى» أوجز وأدق في هذا السياق من «العاطفة» المحايدة في العربية الحديثة.
- source_word: ἐπιθυμίαν κακήν
  choice: الشَّهْوَةَ الشِّرِّيرَةَ
  rationale: ينقل صراحةً كون الرغبة شريرة، ويحافظ على التمييز بينها وبين πάθος السابق.
- source_word: πλεονεξίαν
  choice: الطَّمَعَ
  rationale: يعبر بوضوح حديث عن التطلع الجشع إلى المزيد، وهو أيسر من ألفاظ أقل تداولًا مثل «الجشع في الاقتناء».
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: الَّذِي هُوَ عِبَادَةُ أَوْثَانٍ
  rationale: يعود الموصول بحسب المطابقة والسياق الأقرب إلى «الطمع»، ويحفظ التحديد القاطع دون تلطيفه إلى «بمنزلة عبادة أوثان».
theological_decisions:
- issue: مرجع عبارة «الذي هو عبادة أوثان»
  choice: تعود العبارة إلى «الطمع» تحديدًا.
  alternative: أن تلخص العبارة قائمة الرذائل كلها بوصفها عبادة أوثان.
  rationale: الضمير الموصول اليوناني مؤنث مفرد، ويطابق أقرب اسم مؤنث مفرد، πλεονεξίαν؛ أما تذكير الموصول بالعربية فسببه أن «الطمع» مذكر.
- issue: تفسير «الأعضاء التي على الأرض»
  choice: الإبقاء على استعارة أعضاء الجسد في المتن.
  alternative: «ما هو أرضي فيكم» أو «طبيعتكم الأرضية».
  rationale: النص اليوناني يذكر «الأعضاء» صراحة، ويمكن فهم الرذائل التالية على أنها بيان لها؛ والإبقاء على الصورة يمنع فرض تجريد تفسيري غير مصرح به.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ومهيبة. حُفظت استعارة «الأعضاء» وصورة الإماتة، واستُعمل ضبط جزئي لتيسير القراءة ومنع التباس الصيغ.
