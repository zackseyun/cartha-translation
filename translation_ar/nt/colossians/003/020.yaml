base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: ar
  text: أيها الأبناء، أطيعوا والديكم في كل شيء، لأن هذا مرضيّ[a] في الرب.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مقبول».'
    reason: lexical_alternative
  - marker: b
    text: يمكن فهم «في الرب» على أنها تصف ما هو مرضي ضمن علاقة الإنسان بالرب، لا أنها تعني ببساطة «مرضيّ للرب».
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: أيها الأبناء
  rationale: τέκνα نداء إلى أولاد الأسرة، ويشمل الأبناء والبنات. ولفظ «الأبناء» عربي فصيح وطبيعي في هذا السياق ولا يقصر الخطاب على الذكور.
- source_word: ὑπακούετε
  choice: أطيعوا
  rationale: صيغة الأمر من ὑπακούω تدل هنا على الطاعة والانقياد لتوجيه الوالدين؛ و«أطيعوا» أوضح من «اسمعوا» وألائم لسياق علاقة الأبناء بوالديهم.
- source_word: τοῖς γονεῦσιν
  choice: والديكم
  rationale: γονεῖς تعني الوالدين، وضمير المخاطبين مفهوم من النداء والسياق، وإظهاره في العربية لازم للصياغة الطبيعية.
- source_word: κατὰ πάντα
  choice: في كل شيء
  rationale: تفيد العبارة الشمول من جهة الأمور التي تتناولها الطاعة، لا الاستمرار الزمني؛ لذلك «في كل شيء» أدق من «دائمًا».
- source_word: τοῦτο
  choice: هذا
  rationale: اسم الإشارة يعود إلى الطاعة المأمور بها، والإبقاء عليه يحفظ إيجاز النص وبنيته.
- source_word: γὰρ
  choice: لأن
  rationale: تقدم γάρ سبب الأمر السابق، و«لأن» توضح الصلة التعليلية بصورة طبيعية في العربية.
- source_word: εὐάρεστόν ἐστιν
  choice: مرضيّ
  rationale: εὐάρεστος يدل على ما يبعث على الرضا أو يكون مقبولًا. و«مرضيّ» يحفظ المعنى التقويمي، مع إثبات البديل «مقبول» في الحاشية.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: تحفظ «في الرب» حرف الجر ἐν والتعبير البولسي من غير تضييقه إلى معنى «للرب» وحده، وبذلك تبقى دلالته العلاقية أو النطاقية مفتوحة.
theological_decisions:
- issue: مدى عبارة «في كل شيء» وعلاقتها بعبارة «في الرب»
  choice: إبقاء العبارتين كما وردتا من غير إضافة قيد استثنائي، وربط «في الرب» نحويًا بجملة كون الطاعة مرضية.
  alternative: فهم «في الرب» قيدًا مباشرًا للطاعة، أي الطاعة فقط فيما يوافق مشيئة الرب، أو ترجمتها «للرب» لتحديد جهة الرضا.
  rationale: لا يورد اليوناني استثناء صريحًا بعد «في كل شيء»، كما أن موضع ἐν κυρίῳ يتصل بصورة طبيعية بخبر «هذا مرضيّ». وتحفظ الصياغة العربية التوتر الدلالي ولا تضيف إلى الآية قيدًا تفسيريًا، مع بيان احتمال الدلالة العلاقية في الحاشية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعمل «أيها الأبناء» خطابًا جامعًا لأولاد الأسرة، وحُفظ التعبير البولسي «في الرب» كما هو لتجنب حسم دلالته تفسيرًا.
