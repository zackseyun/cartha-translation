  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: «لأنكم» تؤدي γάρ بوظيفتها التعليلية، و«قد مُتُّم» تنقل الماضي الحاسم ἀπεθάνετε دون شرح زائد، و«حياتكم قد أُخفيت» تحافظ على المبني للمجهول والتام في κέκρυπται، و«مع المسيح في الله» تقابل σὺν τῷ Χριστῷ ἐν τῷ θεῷ مع إبقاء حرفي الجر المتميزين.'
