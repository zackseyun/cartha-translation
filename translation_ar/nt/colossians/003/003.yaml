  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: ar
  text: لأنكم قد مُتُّم، وحياتكم قد أُخفيت مع المسيح في الله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وحياتكم مستترة مع المسيح في الله». يمكن للصيغة اليونانية التامة أن تبرز الحالة الحاضرة الناتجة من فعل تمّ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: قد مُتُّم
  rationale: فعل ماضٍ يدل في السياق على موت حاسم وقع للمؤمنين؛ وتفيد «قد» تحقق هذا الحدث من غير أن تضيف تفسيرًا إلى النص.
- source_word: γάρ
  choice: لأنكم
  rationale: تُظهر «لأن» أن الآية تعليل لما سبق، وهو الاستعمال التفسيري للأداة اليونانية γάρ.
- source_word: ἡ ζωὴ ὑμῶν
  choice: حياتكم
  rationale: نقل مباشر وموجز للعبارة، مع إبقاء معنى «الحياة» بلا توسع تفسيري.
- source_word: κέκρυπται
  choice: قد أُخفيت
  rationale: صيغة المبني للمجهول مع «قد» تنقل الفعل التام ونتيجته القائمة؛ وتُذكر صياغة الحالة الحاضرة في الحاشية لأنها احتمال عربي طبيعي.
- source_word: σὺν τῷ Χριστῷ
  choice: مع المسيح
  rationale: «مع» تقابل σύν وتفيد المصاحبة والاتحاد، و«المسيح» تنقل Χριστός بوصفه لقبًا ذا معنى في العربية.
- source_word: ἐν τῷ θεῷ
  choice: في الله
  rationale: تحافظ «في» على دلالة المجال أو الموضع في ἐν، من غير تحويلها إلى «مع الله» أو شرحها.
theological_decisions:
- issue: هل يُنقل Χριστός بوصفه لقبًا أم اسمًا عَلَمًا؟
  choice: المسيح
  alternative: المسيح الموعود
  rationale: اللفظ العربي «المسيح» يحفظ اللقب اليوناني ومعناه المتعارف عليه، ولا تستدعي الآية إضافة «الموعود» داخل المتن.
- issue: كيفية تمثيل تمام κέκρυπται وحالته المستمرة
  choice: قد أُخفيت
  alternative: مستترة
  rationale: يحفظ الاختيار وقوع الفعل مع بقاء نتيجته، بينما يبرز البديل الحالة الحاضرة؛ ولا يغيّر أي منهما المعنى اللاهوتي المقصود.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ الربط التعليلي في أول الآية، واستُعمل «المسيح» كلقب عربي مفهوم، مع تجنب أي توسع مذهبي أو تفسيري.
