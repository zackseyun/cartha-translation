  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: ar
  text: عندما يظهر المسيح، الذي هو حياتكم[a]، فحينئذ ستظهرون أنتم أيضًا معه في المجد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'في بعض المخطوطات: «حياتنا».'
    reason: textual_variant
lexical_decisions:
- source_word: ὅταν
  choice: عندما
  rationale: تقدّم جملة زمنية تتعلق بحدث مستقبلي متوقَّع؛ و«عندما» هي الصياغة العربية الطبيعية هنا.
- source_word: ὁ Χριστὸς
  choice: المسيح
  rationale: ينقل اللقب اليوناني Χριστός بمعناه المعروف في العربية، ويحافظ على أداة التعريف.
- source_word: φανερωθῇ
  choice: يظهر
  rationale: ينقل معنى صيرورته ظاهرًا علنًا بصياغة عربية طبيعية، من غير أن يقيّده بمعنى الإعلان اللفظي.
- source_word: ἡ ζωὴ ὑμῶν
  choice: الذي هو حياتكم
  rationale: يوضّح البدل اليوناني «المسيح، حياتكم» بعبارة موصولة طبيعية، مع إبقاء التعريف القوي للمسيح بأنه حياة المؤمنين.
- source_word: τότε καὶ ὑμεῖς
  choice: فحينئذ ستظهرون أنتم أيضًا
  rationale: تحفظ «حينئذ» التتابع الزمني، وتنقل «أيضًا» مع الضمير الصريح توكيد مشاركة المخاطَبين.
- source_word: σὺν αὐτῷ
  choice: معه
  rationale: ترجمة موجزة وطبيعية لمعنى المصاحبة والاشتراك.
- source_word: φανερωθήσεσθε
  choice: ستظهرون
  rationale: تستعمل الجذر العربي نفسه المستعمل في صدر الآية، فتحافظ على التوازي بين ظهور المسيح وظهور المؤمنين.
- source_word: ἐν δόξῃ
  choice: في المجد
  rationale: تحافظ على العبارة الجارّة وعلى احتمال دلالتها على المجال أو الهيئة التي يقع فيها الظهور.
theological_decisions:
- issue: ترجمة Χριστός بوصفه لقبًا أو اسمًا منقولًا صوتيًا
  choice: المسيح
  alternative: كريستوس
  rationale: «المسيح» هو المقابل العربي الدلالي الراسخ للقب اليوناني، ويحفظ طابعه اللقبي.
- issue: العلاقة البدلّية في «المسيح، حياتكم»
  choice: الذي هو حياتكم
  alternative: المسيح، حياتكم
  rationale: العبارة الموصولة توضّح في العربية أن المسيح نفسه هو حياة المخاطَبين، من دون إضافة تفسير عقائدي إلى النص.
- issue: البناء للمجهول في فعلي φανερόω
  choice: يظهر ... ستظهرون
  alternative: يُظهَر ... ستُظهَرون
  rationale: الصياغة المختارة أفصح وأوضح للقارئ العام، وتحفظ معنى الظهور العلني والتوازي اللفظي، مع عدم تعيين فاعل الإظهار.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعمل «يظهر/ستظهرون» للمحافظة على تكرار الجذر اليوناني نفسه بصياغة عربية طبيعية، وأُبقي «في المجد» موجزًا من غير تفسير زائد.
