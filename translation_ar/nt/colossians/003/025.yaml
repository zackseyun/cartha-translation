  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: ar
  text: فإنَّ مَن يَظلِم سينال جزاءَ الظلم الذي اقترف[a]، ولا محاباة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «سيتلقّى ما فعله من ظلم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ولا تفضيلَ لأحد». وتدلّ «المحاباة» على تفضيل شخص أو معاملته على أساس مكانته أو مظهره الخارجي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: لأنَّ مَن يَظلِم
  rationale: اسم الفاعل المضارع المعرَّف مستعمل استعمال الاسم للدلالة العامة على كل من يرتكب الظلم، و«لأنَّ» تنقل وظيفة γάρ التعليلية أو التفسيرية.
- source_word: κομίσεται
  choice: سيَنالُ جزاءَ
  rationale: الفعل هنا يدل على تلقّي ما يعود إلى الإنسان مقابل فعله. ولفظ «جزاء» يوضح معنى المقابلة من غير أن يحدد آليتها أو توقيتها.
- source_word: ὃ ἠδίκησεν
  choice: ما ظَلَمَ به
  rationale: تحافظ الصياغة على الصلة اللفظية بين اسم الفاعل والفعل اليونانيين المشتقين من ἀδικέω، وتشمل الضرر أو الخطأ الذي ارتكبه الشخص.
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: ليس عند الله محاباةٌ
  rationale: «المحاباة» تعبر بوضوح عن تفضيل شخص بسبب منزلته أو مظهره الخارجي. أُضيف «عند الله» لإيضاح صاحب الحكم المفهوم من سياق الجزاء، مع التنبيه في الحاشية إلى أن اللفظ اليوناني لا يصرّح به.
theological_decisions:
- issue: طبيعة الجزاء وعدم المحاباة في الحكم
  choice: إبقاء العبارة مبدأً عامًا للجزاء العادل بلا تحديد لآليته أو توقيته
  alternative: قصرها على الدينونة الأخروية، أو على علاقة العبيد بالسادة وحدها
  rationale: النص يقرر أن الظالم ينال مقابل ظلمه وأن لا محاباة، لكنه لا يصرح هنا بوقت الجزاء ولا يحصر المبدأ في علاقة اجتماعية بعينها.
- issue: الفاعل الضمني في عبارة عدم المحاباة
  choice: إيضاح المرجع المفهوم بعبارة «عند الله»
  alternative: 'الترجمة الحرفية: «وليس هناك محاباة»'
  rationale: السياق اللاهوتي للحكم والجزاء يجعل الله المرجع المفهوم، لكن الحاشية تحفظ حقيقة أن اسمه غير مذكور صراحة في اليونانية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «مَن» للمفرد العام من غير إثقال بضمير مذكر، وحوفظ على التكرار الدلالي لجذر الظلم. وُضعت علامتا الحاشية في المتن وطابقتا الحاشيتين.
