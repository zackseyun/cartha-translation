  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: ar
  text: وليحكم في قلوبكم سلامُ المسيح، الذي دُعيتم إليه أيضًا في جسد واحد. وكونوا شاكرين.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρήνη
  choice: سلام
  rationale: المقابل العربي الطبيعي الذي يحفظ معنى السلام العلاقي والجماعي في سياق الحث.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: ينقل اللقب اليوناني Χριστός نقلًا دلاليًا طبيعيًا في العربية ويحفظ معناه المسياني.
- source_word: βραβευέτω
  choice: ليحكمْ
  rationale: صيغة أمر غير مباشر تحافظ على صورة السلام بوصفه القوة الحاكمة أو الفاصلة، من غير إثقال العبارة بتعبير حرفي مثل «يقوم بدور الحَكَم».
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: في قلوبكم
  rationale: تعبير عربي كتابي واضح يحفظ الجمع اليوناني ويشير إلى باطن الإنسان وإرادته، مع بقاء البعد الجماعي للسياق.
- source_word: εἰς ἣν καὶ ἐκλήθητε
  choice: وهو السلام الذي دُعيتم إليه أيضًا
  rationale: يصرّح بمرجع اسم الموصول تجنبًا للالتباس النحوي في العربية، ويحفظ دلالة الغاية أو الاتجاه في εἰς مع قيمة καί التأكيدية أو الإضافية.
- source_word: ἐν ἑνὶ σώματι
  choice: في جسد واحد
  rationale: ترجمة مباشرة تحفظ استعارة الجسد ووحدة الجماعة من غير تفسيرها صراحة بالكنيسة.
- source_word: εὐχάριστοι γίνεσθε
  choice: كونوا شاكرين
  rationale: صيغة حث عربية طبيعية تحافظ على معنى الاتصاف المستمر بالشكر، مع إمكان أن يحمل γίνεσθε إيحاء الصيرورة.
theological_decisions:
- issue: دلالة Χριστοῦ
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو اللقب العربي الراسخ والدال على الممسوح، فيحفظ البعد المسياني من غير شرح عقائدي زائد.
- issue: مدلول «جسد واحد»
  choice: الإبقاء على الاستعارة من دون توسيع تفسيري
  alternative: التصريح بأن المقصود هو الكنيسة
  rationale: السياق يفيد الوحدة الجماعية، لكن النص نفسه يقول «جسد واحد»؛ لذلك تُحفظ الصورة والتوتر الدلالي ولا يُدرج تفسيرها في المتن.
- issue: وظيفة سلام المسيح
  choice: ليحكم
  alternative: ليفصل أو ليكن حَكَمًا
  rationale: يحفظ الاختيار دلالة السلطة الحاكمة أو الفاصلة في βραβευέτω، من غير حصرها في صورة تحكيم تقنية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت «المسيح» بوصفها الترجمة العربية الطبيعية للقب Χριστός، وحُفظت استعارتا القلب والجسد. وُضع كل مؤشري الحاشيتين في المتن.
