source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: ar
  text: حيث لا يوجد يوناني ولا يهودي، ولا ختان ولا غرلة، ولا بربري[a] ولا سكيثي، ولا عبد ولا حر، بل المسيح[b] هو الكل، وفي الجميع[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تدل الكلمة اليونانية، من المنظور اليوناني القديم، على من عُدّ غريب اللغة أو الثقافة عن العالم اليوناني؛ وليست تسمية لجماعة إثنية حديثة.
    reason: توضيح الخلفية اللغوية والثقافية للمصطلح وتفادي حمله على دلالة حديثة أو إثنية مخصوصة.
  - marker: b
    text: 'اليونانية: «خريستوس»، أي «المسيح» أو «الممسوح».'
    reason: بيان معنى اللقب اليوناني مع الحفاظ على المقابل العربي الراسخ.
  - marker: c
    text: 'تُترجم العبارة اليونانية حرفيًا: «في الكل». والسياق يرجّح «في الجميع» أي أعضاء الجماعة المتجددة، لكن إيجاز اليونانية قد يسمح بفهم أوسع، مثل «في كل شيء».'
    reason: بيان أن الصياغة العربية تتبع الإحالة الشخصية الراجحة في السياق، مع الحفاظ على سعة العبارة اليونانية في الحاشية.
lexical_decisions:
- source_word: ὅπου οὐκ ἔνι
  choice: حيث لا يوجد
  rationale: تعبير عربي طبيعي يحفظ معنى غياب هذه الفوارق في نطاق الإنسان الجديد المذكور في السياق السابق.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: يوناني ولا يهودي
  rationale: حُفظ التحديد الإثني في «يوناني» بدل تعميمه إلى «أممي»، واستُعملت «لا... ولا» لأن العربية تعبّر بها طبيعيًا عن نفي الطرفين.
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: ختان ولا غرلة
  rationale: يحفظ الاسمين المجردين بوصفهما علامتي هوية دينية واجتماعية، بدل تحويلهما إلى وصفين للأشخاص.
- source_word: βάρβαρος
  choice: أعجمي
  rationale: ينقل وصف الخارج عن العالم اليوناني من جهة اللغة والثقافة، ويتجنب «بربري» التي قد تُفهم في العربية الحديثة اسمًا إثنيًا مخصوصًا.
- source_word: Σκύθης
  choice: سكيثي
  rationale: نقل صوتي لاسم شعب محدد، من غير تعميمه إلى وصف ثقافي.
- source_word: δοῦλος
  choice: عبد
  rationale: المقابلة الصريحة مع «حر» تجعل وضع الاستعباد الاجتماعي هو المعنى البارز، لا مجرد الخدمة.
- source_word: ἐλεύθερος
  choice: حر
  rationale: المقابل العربي المباشر والموجز لـ«عبد» في هذا التقابل الاجتماعي.
- source_word: τὰ πάντα
  choice: الكل
  rationale: يحفظ إيجاز العبارة اليونانية وشمولها من غير إضافة تفسير ميتافيزيقي غير مصرّح به.
- source_word: ἐν πᾶσιν
  choice: في الكل
  rationale: صياغة موجزة تحافظ قدر الإمكان على انفتاح اليونانية بين الإحالة إلى جميع أعضاء الجماعة والإحالة الأوسع.
- source_word: Χριστός
  choice: المسيح
  rationale: ينقل معنى اللقب اليوناني، وهو «الممسوح»، بالصيغة العربية الراسخة.
theological_decisions:
- issue: نطاق ἐν πᾶσιν
  choice: في الكل
  alternative: في الجميع / في كل واحد
  rationale: السياق يرجّح أعضاء الجماعة المتجددة، لكن العبارة اليونانية موجزة وقابلة لدلالة أوسع؛ لذلك لم تُحصر في «كل واحد».
- issue: دلالة τὰ πάντα
  choice: هو الكل
  alternative: هو كل شيء
  rationale: «الكل» تحافظ على التركيب المكثف وعلى التوتر اللاهوتي في العبارة دون شرح زائد.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: كريستوس
  rationale: الكلمة تؤدي هنا وظيفة اللقب، وترجمتها الدلالية العربية مستقرة وواضحة.
- issue: دلالة δοῦλος
  choice: عبد
  alternative: خادم
  rationale: اقترانها بـ«حر» يبرز الوضع القانوني والاجتماعي للاستعباد، ولذلك تكون «عبد» أدق من «خادم».
translation_notes:
  register: فصحى معاصرة واضحة وموجزة، مع الحفاظ على إيقاع التقابلات في الأصل. تكرار «لا» طبيعي في العربية ويبيّن نفي طرفي كل تقابل. استُعملت «أعجمي» بدل «بربري» لتفادي الخلط الحديث مع الأمازيغ، وأُبقي «الختان والغرلة» اسمين مجردين كما في اليونانية.
