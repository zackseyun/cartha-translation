  source_fidelity: يلزم تعديل محدود. «أعجمي» في الاستعمال العربي يحدد غير العربي من منظور عربي، بينما βάρβαρος وصف يوناني لمن عُدّ غريب اللغة/الثقافة، فلا ينقل المرجع الثقافي في الأصل بدقة. كذلك «في الكل» غير طبيعية في العربية الحديثة وقد تُفهم بمعنى «في المجموع/في تمامه» لا بوصفها محمولًا على أفراد. «وفي الجميع» أنسب للسياق المباشر وللاستعمال العربي، مع بيان سعة اليونانية في الحاشية.
