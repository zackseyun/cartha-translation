lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: لبستم
  rationale: يحفظ استعارة ارتداء الثوب، ويعبّر بصيغة الماضي عن الفعل السابق المرتبط سياقيًا بخلع الإنسان العتيق.
- source_word: τὸν νέον
  choice: الإنسان الجديد
  rationale: الصفة في اليونانية مستعملة استعمال الاسم، والسياق السابق يكمّلها دلاليًا بـ«الإنسان» في مقابلة الإنسان العتيق. وهذه الصياغة طبيعية في العربية ولا يلزم منها حصر المرجع في الذكور.
- source_word: ἀνακαινούμενον
  choice: الذي يتجدّد
  rationale: يحفظ معنى العملية المستمرة وصيغة المبني للمجهول من غير تعيين الفاعل صراحة.
- source_word: εἰς ἐπίγνωσιν
  choice: إلى معرفة
  rationale: تحفظ «إلى» اتجاه عملية التجديد نحو غايتها أو نتيجتها، بينما تترك «معرفة» احتمال دلالة اللفظة على المعرفة الأتم في الحاشية.
- source_word: κατ’ εἰκόνα
  choice: وفق صورة
  rationale: تعبّر «وفق» عن المطابقة لمعيار أو نموذج، وتحفظ لفظ «صورة» وما قد يحمله من صدى للغة الخلق في سفر التكوين.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: الذي خلقه
  rationale: تحافظ العبارة على بنية اسم الفاعل اليونانية وعلى عود الضمير إلى الإنسان الجديد، من غير استبدالها بتفسير أوسع.
theological_decisions:
- issue: دلالة τὸν νέον في السياق الإنساني
  choice: الإنسان الجديد
  alternative: الذات الجديدة
  rationale: السياق المباشر يقابل الإنسان العتيق بالإنسان الجديد، ولذلك يبيّن الاسم المحذوف في اليونانية من غير جعل العبارة مقصورة على رجل ذكر. وتُذكر الصياغة البديلة لأنها تبرز الهوية الشخصية.
- issue: قوة دلالة ἐπίγνωσις
  choice: معرفة
  alternative: معرفة تامة أو أعمق
  rationale: قد تدل الكلمة على معرفة أتم أو أعمق، لكن التصريح بذلك في المتن قد يزيد على ما تحسمه الصيغة اليونانية، لذا حُفظ الاحتمال في الحاشية.
- issue: اتجاه التجديد في εἰς ἐπίγνωσιν
  choice: إلى معرفة
  alternative: في المعرفة؛ لأجل المعرفة
  rationale: تحفظ «إلى» معنى الاتجاه أو النتيجة الكامن في εἰς، من غير حسم العلاقة على أنها مجال التجديد وحده أو غايته وحدها.
translation_notes:
  register: صياغة عربية فصحى واضحة وموقّرة، تحفظ استعارة اللباس، واستمرار التجديد، واتجاهه نحو المعرفة. استُعمل «الإنسان» بالمعنى البشري العام، ووُضعت البدائل الدلالية غير المحسومة في الحواشي.
