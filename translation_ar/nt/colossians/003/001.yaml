id: COL.3.1
reference: Colossians 3:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: ar
  text: فإنْ[a] كنتم قد أُقِمتم مع المسيح[b]، فاطلبوا ما هو فوق، حيث المسيح جالس عن يمين الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «فبما أنكم قد أُقِمتم مع المسيح». تحتفظ اليونانية بصيغة الشرط («إنْ»)، مع أن السياق يرجح أن الشرط مفترض الصحة في الحجة.'
    reason: alternative_reading
  - marker: b
    text: اليونانية Χριστός، أي «المسيح» أو «الممسوح»؛ واللفظ هنا يحمل دلالة اللقب.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: فإنْ
  rationale: تحافظ «إنْ» على الصيغة الشرطية في اليونانية، وتؤدي الفاء معنى الاستنتاج والانتقال الذي تحمله οὖν في هذا السياق، من غير تحويل الشرط صراحةً إلى تقرير.
- source_word: συνηγέρθητε
  choice: كنتم قد أُقِمتم مع
  rationale: صيغة ماضٍ مبني للمجهول، وجاء معنى المشاركة والاتحاد في العربية بواسطة «مع المسيح». و«أُقِمتم» تلائم سياق القيامة من الموت، بينما تفيد «قد» وقوع الحدث السابق.
- source_word: τῷ Χριστῷ / ὁ Χριστός
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، ويحفظ دلالة الممسوح من الله من غير معاملته هنا بوصفه مجرد اسم منقول صوتيًا.
- source_word: τὰ ἄνω
  choice: ما هو فوق
  rationale: تنقل العبارة الاسمية اليونانية الدالة على الأمور التي في العلو بصياغة عربية طبيعية، من غير تضييقها تفسيرياً إلى «الأمور السماوية».
- source_word: ζητεῖτε
  choice: فاطلبوا
  rationale: تنقل فعل الأمر الحاضر بمعناه الأساسي؛ ويمكن أن يدل السياق على الاستمرار في الطلب من غير إضافة لفظ «داوموا» إلى النص.
- source_word: οὗ
  choice: حيث
  rationale: تحفظ الدلالة المكانية لأداة الوصل، وتربط موضع المسيح بما هو «فوق».
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: عن يمين الله
  rationale: تعبير عربي كتابي وطبيعي يحفظ صورة مقام السلطان والكرامة.
- source_word: καθήμενος
  choice: جالس
  rationale: ينقل اسم الفاعل الدال على وضع المسيح الحاضر من غير توسيع تفسيري إلى «متربع على العرش».
theological_decisions:
- issue: قوة الشرط في Εἰ
  choice: 'الإبقاء على الشرط: «فإنْ كنتم»'
  alternative: «فبما أنكم» أو «فإذ قد»
  rationale: يرجح أن بولس يفترض صحة الشرط في سياق حجته، لكن النص اليوناني صاغه شرطًا؛ لذلك تُحفظ الصيغة وما فيها من توتر بلاغي من غير حسمها إلى تقرير صريح.
- issue: دلالة Χριστός في السياق البولسي
  choice: المسيح
  alternative: نقل صوتي يعامل اللفظ كاسم مجرد
  rationale: يحفظ اللفظ العربي معنى اللقب، أي الممسوح، ويلائم الحديث عن اتحاد المؤمنين بالمسيح المرفوع وصاحب المقام عن يمين الله.
- issue: دلالة «ما هو فوق»
  choice: الإبقاء على التعبير المكاني الواسع
  alternative: «الأمور السماوية»
  rationale: لا يحدد النص المقصود تفصيلاً في هذه الآية، ولذلك لا تُختزل العبارة في تفسير لاهوتي أضيق من صياغتها الأصلية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. حُفظ الشرط اليوناني، واستُعمل «المسيح» بصفته اللقب العربي الطبيعي، وتُركت عبارة «ما هو فوق» واسعة كما في الأصل.
