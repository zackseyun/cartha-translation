  text: οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: ar
  text: أيها الأزواج، أحبّوا زوجاتكم، ولا تكونوا قساةً عليهن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تضمروا المرارة نحوهن». يمكن أن يدل الفعل اليوناني على أن يصير المرء مريرًا أو ممتلئًا بالمرارة، ويشير هنا على الأرجح إلى موقف أو معاملة قاسية مشوبة بالاستياء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: أيها الأزواج
  rationale: 'يمكن أن تعني ἀνήρ «رجلًا» أو «زوجًا»، لكن سياق وصايا الأسرة وذكر الزوجات يحددان المعنى العلاقي: الأزواج.'
- source_word: ἀγαπᾶτε
  choice: أحبّوا
  rationale: ينقل فعل الأمر اليوناني مباشرة، ويحافظ على الدلالة الأساسية للفعل ἀγαπάω دون شرح زائد.
- source_word: τὰς γυναῖκας
  choice: زوجاتكم
  rationale: يمكن أن تعني γυνή «امرأة» أو «زوجة»، والسياق يقتضي «الزوجات». وأضيف ضمير المخاطبين في العربية لإظهار العلاقة المقصودة طبيعيًا.
- source_word: μὴ πικραίνεσθε
  choice: لا تكونوا قساةً
  rationale: للفعل صلة حرفية بالمرارة، وقد يدل على أن يصير المرء مريرًا أو يضمر المرارة؛ لكنه مع πρὸς αὐτάς هنا يصف على الأرجح موقفًا أو معاملة قاسية مشوبة بالاستياء. هذه الصياغة عربية واضحة مع حفظ البديل في الحاشية.
- source_word: πρὸς αὐτάς
  choice: عليهن
  rationale: تفيد πρός مع النصب اتجاه الموقف أو الفعل نحو الزوجات، وتأتي «قساةً عليهن» سليمة وطبيعية في العربية.
theological_decisions:
- issue: الخطاب الأسري المحدد بحسب الجنس والعلاقة الزوجية
  choice: الإبقاء على الخطاب الموجَّه إلى الأزواج وذكر زوجاتهم صراحةً.
  alternative: تعميم الخطاب باستعمال «الرجال» و«النساء».
  rationale: النص اليوناني في هذا السياق يخاطب الرجال بوصفهم أزواجًا في علاقتهم بزوجاتهم، لا الرجال والنساء بوجه عام.
- issue: دلالة المرارة والقسوة في النهي
  choice: إبراز الأثر العلاقي بصيغة «لا تكونوا قساةً عليهن».
  alternative: «لا تصيروا مُرّين تجاههن» أو «لا تضمروا المرارة نحوهن».
  rationale: لا يحصر السياق النهي يقينًا في شعور داخلي أو سلوك خارجي وحده؛ لذلك اختير تعبير طبيعي يشمل الموقف والمعاملة، مع إثبات المعنى الحرفي المحتمل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل النداء «أيها الأزواج» لإبراز المخاطَبين طبيعيًا، واختيرت صياغة موجزة تحافظ على قوة فعلي الأمر والنهي.
