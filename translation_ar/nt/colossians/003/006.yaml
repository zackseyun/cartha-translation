  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: ar
  text: بِسَبَبِ هذِهِ الأُمُورِ يَأْتِي غَضَبُ اللهِ عَلَى أَبْنَاءِ العِصْيَانِ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أولاد العصيان»، أي أناس يتصفون بالعصيان.
    reason: lexical_alternative
  - marker: b
    text: تغيب عبارة «على أبناء العصيان» في بعض الشواهد القديمة.
    reason: textual_variant
lexical_decisions:
- source_word: δι’ ἃ
  choice: بسبب هذه الأمور
  rationale: تفيد διά مع ضمير الوصل في حالة النصب السببية، وتشير صيغة الجمع إلى الرذائل المذكورة في الآية السابقة.
- source_word: ἔρχεται
  choice: يأتي
  rationale: يحافظ المضارع العربي على صورة الفعل اليوناني وعلى دلالة مجيء الغضب، من غير حصر المعنى في زمن تفسيري أدق مما يسمح به النص.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: غضب الله
  rationale: ينقل ὀργή بوصفه غضبًا إلهيًّا ذا بُعد قضائي، ويحافظ على الإضافة بعبارة عربية طبيعية ورصينة.
- source_word: ἐπὶ
  choice: على
  rationale: تدل ἐπί مع النصب هنا على جهة وقوع الغضب أو هدفه، و«على» هي المقابل العربي الطبيعي في سياق الدينونة.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: أبناء العصيان
  rationale: يحافظ على التعبير الإضافي السامي وعلى الاسم المذكر υἱούς، مع توضيح دلالته الوصفية في الحاشية.
theological_decisions:
- issue: هل يُحافَظ على التعبير الاصطلاحي «أبناء العصيان» أم يُفسَّر داخل المتن؟
  choice: إبقاء «أبناء العصيان» في المتن
  alternative: العصاة؛ الذين يتصفون بالعصيان
  rationale: يحافظ هذا على نسيج التعبير اليوناني ذي الخلفية السامية، بينما توضّح الحاشية أنه وصف لأناس يتسمون بالعصيان، من غير تسطيح العبارة أو تحميلها دلالة بنوّة حرفية.
- issue: القيمة الزمنية للفعل ἔρχεται
  choice: يأتي
  alternative: آتٍ؛ سيأتي
  rationale: صيغة المضارع في الأصل يمكن أن تحمل قوة حاضرة أو مستقبلية وشيكة في سياق أخروي؛ لذا تُركت بصيغة «يأتي» للمحافظة على هذا القدر من الانفتاح بدل حسمه.
translation_notes:
  register: فصحى معاصرة واضحة ورصينة. استُعملت «الأمور» بدل «الأشياء» لملاءمة الإحالة إلى السلوكيات السابقة، وحُفظ التعبير الاصطلاحي «أبناء العصيان» مع شرحه في الحاشية.
