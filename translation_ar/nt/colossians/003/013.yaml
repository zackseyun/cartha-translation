  to: محتملين بعضكم بعضًا، ومسامحين بعضكم بعضًا إن كان لأحد على أحد شكوى[a]؛ وكما سامحكم الرب، فكذلك سامحوا أنتم أيضًا[b].
  rationale: أُظهر فعل «سامحوا» في الخاتمة لجعل العربية سليمة وواضحة، مع بيان الحذف اليوناني في الحاشية، ونُقلت علامة الحاشية (أ) إلى موضع العبارة التي تشرحها. ولم يُغيَّر معنى الآية أو مرجع لقب «الرب».
