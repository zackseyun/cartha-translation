  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: ar
  text: محتملين بعضكم بعضًا، ومسامحين بعضكم بعضًا إن كان لأحد على أحد شكوى[a]؛ وكما سامحكم الرب، فكذلك سامحوا أنتم أيضًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن كان لأحد تظلُّم من آخر».'
    reason: lexical_alternative
  - marker: b
    text: 'الفعل محذوف في اليونانية ومفهوم من السياق؛ والمعنى: «فكذلك سامحوا أنتم أيضًا».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι ἀλλήλων
  choice: محتملين بعضكم بعضًا
  rationale: يحفظ معنى الاحتمال المتبادل المستمر في سياق العلاقات داخل الجماعة، بصياغة عربية مألوفة ورصينة.
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: ومسامحين بعضكم بعضًا
  rationale: الفعل هنا يدل على المسامحة عن الإساءة، مع إيحاء بالنعمة؛ و«مسامحين» أوضح مقابل عربي مباشر ويحافظ على الصلة بالفعل اللاحق.
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: إن كانت لأحد شكوى على أحد
  rationale: ينقل الشرط العام غير المحدد، ويعبّر «شكوى» طبيعيًا عن سبب اللوم أو التظلم من غير تحويله إلى اتهام رسمي.
- source_word: καθὼς καὶ
  choice: وكما
  rationale: ينقل المقارنة التي تجعل مسامحة الرب أساسًا ونموذجًا لمسامحة المؤمنين، من دون إثقال الأسلوب العربي.
- source_word: ὁ κύριος
  choice: الرب
  rationale: يحفظ اللقب كما في اليونانية من غير التصريح بهوية المرجع داخل متن الآية.
- source_word: ἐχαρίσατο ὑμῖν
  choice: سامحكم
  rationale: يقابل الفعل السابق دلاليًا ويبرز أن مسامحة الرب سابقة ومؤسِّسة للمسامحة المتبادلة.
- source_word: οὕτως καὶ ὑμεῖς
  choice: كذلك أنتم أيضًا
  rationale: يحفظ الإيجاز والحذف الفعلي في اليونانية، إذ يُفهم فعل المسامحة من السياق من غير إضافة صيغة إلزام غير منطوقة.
theological_decisions:
- issue: مرجع ὁ κύριος
  choice: الإبقاء على «الرب» بلا تفسير داخل المتن
  alternative: التصريح بـ«المسيح» أو فهم اللقب على أنه يشير إلى الله على نحو عام
  rationale: يرجح السياق البولسي الإشارة إلى المسيح، لكن النص نفسه يورد اللقب فقط؛ لذا تحافظ الترجمة على قدر الالتباس الموجود في الأصل.
- issue: الحذف في العبارة الختامية
  choice: «كذلك أنتم أيضًا» مع إبقاء الفعل مقدرًا
  alternative: «كذلك سامحوا أنتم أيضًا» أو «كذلك يجب عليكم أن تفعلوا»
  rationale: اليونانية تحذف الفعل اعتمادًا على السياق. إبقاء الحذف يحفظ توتر العبارة وإيجازها ولا يضيف فعلًا أو صيغة وجوب صريحة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم التركيب «بعضكم بعضًا» لإظهار التبادل داخل الجماعة، وحُفظ الإيجاز اليوناني في الخاتمة مع توضيحه في الحاشية.
