  source_fidelity: 'المعنى الأساسي منقول بأمانة: «محتملين» تلائم ἀνεχόμενοι، و«مسامحين» تلائم χαριζόμενοι في سياق الغفران، و«الرب» يحافظ على قراءة SBLGNT من غير تعيينٍ تفسيري للمرجع. لكن العبارة الختامية في العربية تحتاج إلى فعل ظاهر لتكون جملة سليمة وطبيعية؛ وإظهاره بوصفه «سامحوا» يعبّر عن الفعل المفهوم من السياق من غير إضافة وجوب غير وارد في اليونانية.'
