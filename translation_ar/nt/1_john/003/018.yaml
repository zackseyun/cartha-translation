  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: ar
  text: يا أولادي الصغار، لا نُحِبّ بالكلام ولا باللسان، بل بالعمل والحق.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τεκνία
  choice: يا أولادي الصغار
  rationale: صيغة نداء حنونة تصغيرية؛ «أولادي» تلائم خطاب الكاتب الأبوي، و«الصغار» تحفظ أثر التصغير من غير إدخال معنى «الأحباء» غير المصرح به.
- source_word: μὴ ἀγαπῶμεν
  choice: لا نحبَّ
  rationale: 'تحفظ صيغة الحث في المتكلم الجمع: دعوة مشتركة إلى الامتناع عن محبة تقتصر على القول.'
- source_word: λόγῳ
  choice: بالكلام
  rationale: ينقل التعبير اللفظي بصياغة عربية طبيعية وموجزة.
- source_word: μηδὲ τῇ γλώσσῃ
  choice: ولا باللسان
  rationale: يحفظ الصورة الحسية في اليونانية والتوازي البلاغي، مع وضوح استعمال اللسان كناية عن القول.
- source_word: ἀλλὰ
  choice: بل
  rationale: أداة استدراك قوية تلائم الانتقال من النفي إلى المقابلة الإيجابية.
- source_word: ἐν ἔργῳ
  choice: بالعمل
  rationale: ترجمة طبيعية لـἔργον في سياق مقابلة القول بالممارسة الفعلية.
- source_word: καὶ ἀληθείᾳ
  choice: والحق
  rationale: تحفظ المعنى المعجمي والعمق اليوحناوي، ولا تحصره في الإخلاص النفسي وحده.
theological_decisions:
- issue: دلالة ἀληθείᾳ في عبارة «بالعمل والحق»
  choice: الحق
  alternative: الإخلاص أو الصدق العملي
  rationale: 'يبقي «الحق» المجال مفتوحًا للقوة المزدوجة في العبارة: محبة حقيقية تتجسد في العمل، ومحبة منسجمة مع حق الله، من غير تضييقها إلى مجرد صدق الشعور.'
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظ النداء العائلي الحنون والصورة البلاغية «باللسان»، مع توازٍ موجز بين الكلام والعمل.
