lexical_decisions:
- source_word: ἐν τούτῳ
  choice: بهذا
  rationale: تعبير عربي طبيعي يحفظ القوة الإشارية ويدل على الوسيلة أو الأساس الذي به تتحقق المعرفة.
- source_word: γνωσόμεθα
  choice: نعرف
  rationale: المضارع العربي مناسب في هذا السياق للدلالة على النتيجة المتحققة أو المتوقعة، من غير إضافة معنى البدء في المعرفة غير اللازم من الصيغة اليونانية.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: أننا من الحق
  rationale: يحفظ دلالة ἐκ على المصدر أو المنشأ، ويبقي العبارة اليوحناوية موجزة من غير تفسيرها صراحةً بمعنى الانتماء.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: أمامَه
  rationale: ينقل المعنى المكاني والعلاقي لعبارة «قدّامه/في حضرته» بوضوح وكرامة في العربية المعاصرة.
- source_word: πείσομεν
  choice: نُطمئن
  rationale: لأن مفعول الفعل هو القلب، يدل السياق على تسكين القلب وتثبيته أمام الله؛ و«نطمئن» تؤدي هذا المعنى طبيعيًا، مع إبقاء المعنى الحرفي «نقنع» في الحاشية.
- source_word: τὴν καρδίαν ἡμῶν
  choice: قلوبنا
  rationale: استُعمل الجمع التوزيعي الطبيعي في العربية مع الفاعل الجمع، مع إثبات المفرد اليوناني في الحاشية.
theological_decisions:
- issue: دلالة «من الحق» في اللاهوت اليوحناوي
  choice: الإبقاء على «من الحق» بما تحتمله من المصدر والانتماء
  alternative: أننا ننتمي إلى الحق؛ أو أننا حقًا شعب الله
  rationale: النص لا يصرّح هنا بكل ما يترتب لاهوتيًا على العبارة، لذلك لا تُستبدل بتفسير عقائدي أضيق أو أوسع.
- issue: معنى πείσομεν حين يكون القلب مفعوله
  choice: نُطمئن قلوبنا أمام الله
  alternative: نُقنع قلوبنا؛ أو نُسكّن قلوبنا
  rationale: السياق يتناول ثبات القلب في حضرة الله، لكن الحاشية تحفظ الدلالة الأقرب إلى اللفظ اليوناني كي لا يُخفى مجال المعنى أو يُحسم التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت العبارة اليوحناوية «من الحق» من غير توسيع عقائدي، واستُخدم «نُطمئن قلوبنا» لصياغة عربية طبيعية، مع توثيق اللفظ الأقرب إلى اليونانية في الحاشية. تنتهي الآية بفاصلة لأنها تتصل نحويًا بما يليها في 1 يوحنا 3:20.
