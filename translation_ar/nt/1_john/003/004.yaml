source:
  edition: SBLGNT
  text: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/004.yaml
  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: ar
  text: كلُّ مَن يمارس الخطيئة[a] يمارس أيضًا التعدّي على الشريعة، والخطيئة هي التعدّي على الشريعة.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل من يرتكب الخطيئة»؛ وصيغ المضارع اليونانية يمكن نقلها بصورة أبسط، لكن «يمارس» تُظهر احتمال دلالتها في السياق على سلوك جارٍ أو مميِّز.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «التعدّي على الشريعة» بـ«الإثم» أو «مخالفة الشريعة». وقد اختير التعبير الوارد في المتن لإبقاء الصلة بمفهوم الشريعة ظاهرة، من غير تحديد المقصود بها أكثر مما يفعله النص.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν
  choice: كلُّ مَن يمارس
  rationale: يفيد التركيب العام «كل من»، وصيغة المضارع في هذا السياق تحتمل السلوك الجاري أو المميِّز. واختيار «يمارس» يبرز هذا المعنى من غير تحويل الصيغة إلى تقرير نحوي صريح عن العادة.
- source_word: τὴν ἁμαρτίαν
  choice: الخطيئة
  rationale: الاسم هنا يدل على الخطيئة بوصفها مفهومًا وسلوكًا، لا على فعل بعينه سبق ذكره. واستعمال التعريف طبيعي في العربية في هذا المقام.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: يمارس أيضًا التعدّي على الشريعة
  rationale: تكرار «يمارس» يحفظ التوازي مع الفعل الأول، و«التعدّي على الشريعة» يُبقي الصلة الدلالية بين ἀνομία وνόμος ظاهرة، من غير تحديد الشريعة بأنها الموسوية أو المدنية.
- source_word: ἀνομία
  choice: التعدّي على الشريعة
  rationale: هذا التعبير أوضح للقارئ المعاصر من «الإثم»، ويحفظ عنصر الشريعة الكامن في اللفظة اليونانية. وهو أقل تحميلًا للنص من «التمرّد على شريعة الله».
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: والخطيئة هي التعدّي على الشريعة
  rationale: يحفظ العبارة التعريفية المكثفة والمساواة التي يقررها النص، من غير تخفيفها إلى مجرد نتيجة أو مثال.
theological_decisions:
- issue: هل تشير صيغ المضارع إلى مجرد وقوع فعل أم إلى سلوك جارٍ أو مميِّز؟
  choice: يمارس
  alternative: يرتكب / يفعل
  rationale: يساعد «يمارس» على إظهار القوة السياقية المحتملة للمضارع بوصفه سلوكًا جاريًا أو مميِّزًا، لكنه لا يجعل ذلك حكمًا عقائديًا على كل فعل منفرد.
- issue: مدلول ἀνομία في العبارة التعريفية
  choice: التعدّي على الشريعة
  alternative: الإثم / مخالفة الشريعة / الخروج على الشريعة
  rationale: يحفظ الاختيار صلة اللفظة بمفهوم الشريعة ويترك هوية الشريعة ونطاقها من دون حسم تفسيري زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة وقورة. تجنّب النص ألفاظًا تراثية أقل وضوحًا مثل «الإثم» في المتن، كما تجنّب إضافة «شريعة الله» لأن لفظ «الله» غير مذكور صراحة في الجملة اليونانية.
