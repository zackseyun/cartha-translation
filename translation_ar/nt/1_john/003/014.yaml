  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: ar
  text: نحن نعرف أننا قد انتقلنا من الموت إلى الحياة، لأننا نحب الإخوة[a]. ومن لا يحب يبقى في الموت.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الإخوة والأخوات»؛ فاليونانية تقول «الإخوة»، ويُرجَّح أن المقصود في هذا السياق عموم المؤمنين.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: نعرف
  rationale: صيغة οἶδα التامة تؤدي في اليونانية الكوينه معنى حالة حاضرة؛ و«نعرف» هي المقابل العربي الطبيعي.
- source_word: μεταβεβήκαμεν
  choice: قد انتقلنا
  rationale: تفيد صيغة التام انتقالًا تمّ وما زالت نتيجته قائمة، وتحافظ «قد انتقلنا» على معنى الحركة والحالة الناتجة عنها.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: من الموت إلى الحياة
  rationale: يحفظ هذا التركيب اتجاه الانتقال من مجال الموت إلى مجال الحياة بصياغة عربية واضحة، من غير توسيع تفسيري.
- source_word: ἀγαπῶμεν
  choice: نحب
  rationale: يدل المضارع على سلوك مستمر أو مميّز، و«نحب» تعبير عربي مباشر وطبيعي.
- source_word: τοὺς ἀδελφούς
  choice: الإخوة
  rationale: يحافظ على صيغة الجمع المذكر في الأصل، مع بيان دلالتها الشاملة المرجحة سياقيًا في الحاشية.
- source_word: ὁ μὴ ἀγαπῶν
  choice: من لا يحب
  rationale: ينقل اسم الفاعل المعرّف الدال على الشخص المتصف بهذا السلوك في عبارة عربية عامة وموجزة.
- source_word: μένει
  choice: يبقى
  rationale: ينقل معنى استمرار الحالة بلفظ عربي مألوف، ويحافظ على دلالة الفعل اليوحناوي دون استعمال لفظ متكلّف.
- source_word: ἐν τῷ θανάτῳ
  choice: في الموت
  rationale: يحفظ الاستعارة المكانية الموجزة في الأصل من غير تفسيرها بأنها نوع محدد من الموت.
theological_decisions:
- issue: مرجع ἀδελφοί وقوته من جهة الجنس
  choice: «الإخوة» في المتن، مع توضيح الدلالة الشاملة المحتملة في الحاشية.
  alternative: «الإخوة والأخوات»
  rationale: اللفظ اليوناني مذكر جمع، لكنه في هذا السياق يرجح أن يشير إلى جماعة المؤمنين عمومًا، بمن فيهم النساء؛ لذلك حُفظ شكل الأصل في المتن وذُكر الاحتمال الشامل في الحاشية.
- issue: طبيعة «الموت» و«الحياة»
  choice: الإبقاء على «الموت» و«الحياة» بلا إضافة تفسيرية.
  alternative: «الموت الروحي والحياة الأبدية» أو «مجال الموت ومجال الحياة»
  rationale: يعرض النص انتقالًا لاهوتيًا عميقًا في صورة موجزة، لكنه لا يحدد هذه المصطلحات هنا بمزيد من التفصيل؛ لذا تُحفظ سعة الدلالة والتوتر اللاهوتي في الأصل.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «قد انتقلنا» لإبراز الانتقال المكتمل ذي النتيجة المستمرة، و«يبقى» للوضوح مع الحفاظ على معنى الاستمرار. وُضعت علامة الحاشية بعد «الإخوة» لأنها تتعلق بهذا اللفظ تحديدًا.
