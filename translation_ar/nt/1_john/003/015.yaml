  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: ar
  text: كُلُّ مَنْ يُبْغِضُ أَخَاهُ فَهُوَ قَاتِلٌ[a]، وَأَنْتُمْ تَعْلَمُونَ أَنَّ كُلَّ قَاتِلٍ لَيْسَتْ لَهُ حَيَاةٌ أَبَدِيَّةٌ بَاقِيَةٌ فِيهِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود بـ«أخاه» في هذا السياق على الأرجح أخٌ في جماعة المؤمنين؛ واللفظ اليوناني مفرد مذكر.
    reason: cultural_note
  - marker: b
    text: 'أو: «ثابتة فيه». الفعل اليوناني μένω من ألفاظ يوحنا المتكررة، ويدل على البقاء أو الثبات.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: كُلُّ مَنْ يُبْغِضُ
  rationale: ينقل التركيب الدال على فئة عامة، مع إبقاء قوة اسم الفاعل المضارع التي تصف موقفًا مستمرًّا أو مميِّزًا.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: أَخَاهُ
  rationale: يحافظ على صيغة المفرد المذكر في اليونانية، من غير أن يحسم في المتن أن المقصود حصراً الأخ الجسدي أو يوسّع العبارة صراحةً.
- source_word: ἀνθρωποκτόνος
  choice: قَاتِلٌ
  rationale: لفظ عربي طبيعي قوي أخلاقيًّا يدل على قاتل الإنسان؛ أما «سفّاك دم» فأبعد عن الصيغة المعجمية وقد يضيف إيحاءً بالتكرار.
- source_word: οἴδατε
  choice: أَنْتُمْ تَعْلَمُونَ
  rationale: إظهار الضمير يبيّن بوضوح أن الخطاب للجمع، مع بقاء العبارة طبيعية في العربية.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: كُلَّ قَاتِلٍ لَيْسَتْ لَهُ
  rationale: يحافظ على صيغة العموم المنفية في المصدر، وتأتي العربية واضحة من غير تحويلها إلى تركيب ملتبس.
- source_word: ζωὴν αἰώνιον
  choice: حَيَاةٌ أَبَدِيَّةٌ
  rationale: المقابل العربي المألوف الذي يحفظ دلالة الدوام والبُعد اللاهوتي في كتابات يوحنا.
- source_word: ἐν αὐτῷ μένουσαν
  choice: بَاقِيَةٌ فِيهِ
  rationale: يحفظ معنى الاستمرار الملازم للفعل اليوحنّاوي μένω بلغة عربية حديثة وطبيعية؛ وتُذكر «ثابتة فيه» بديلاً في الحاشية.
theological_decisions:
- issue: نطاق «أخاه»
  choice: إبقاء «أخاه» في المتن، مع بيان احتمال الإشارة السياقية إلى أخ في جماعة المؤمنين.
  alternative: أخاه في الإيمان / أخاه أو أخته
  rationale: السياق يتناول المحبة داخل الجماعة، لكن اللفظ اليوناني مفرد مذكر؛ لذلك لا يُحسم المدى الدلالي بتفسير صريح داخل المتن.
- issue: دلالة μένω عند يوحنا
  choice: بَاقِيَةٌ فِيهِ
  alternative: ثَابِتَةٌ فِيهِ
  rationale: «باقية» تنقل معنى الاستمرار بوضوح، بينما «ثابتة» بديل معتبر يحفظ الصلة بالمصطلح المتكرر في كتابات يوحنا؛ لذا يُصان في الحاشية.
- issue: العلاقة بين البغض والقتل
  choice: فَهُوَ قَاتِلٌ
  alternative: هو قاتل نفس
  rationale: تُترك المساواة الأخلاقية الحادة كما صاغها النص، من غير تخفيفها إلى مجرد تشبيه أو تفسيرها بأنها قتل فعلي.
translation_notes:
  register: عربية فصحى واضحة وكريمة النبرة، مع تشكيل جزئي شامل للنص القصير منعًا للالتباس. حُفظ التوازي بين «كل من» و«كل قاتل»، واستُعملت «قاتل» بدل ألفاظ تراثية أقل تداولًا. وُضعت كل علامة حاشية في المتن بجوار العبارة التي تشرحها.
