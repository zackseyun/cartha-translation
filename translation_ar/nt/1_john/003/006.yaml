  verdict: revise
  source_fidelity: يُحافظ النص على العموم في πᾶς ὁ، وعلى «يثبت فيه» لمعنى ἐν αὐτῷ μένων، وعلى الضمائر غير المعيَّنة. كما أن «لم يره ولم يعرفه» نقل عربي سليم لنفي فعلي التام، وإن لم يكن للعربية مقابل مطابق تمامًا للتام اليوناني. لكن الفعل المضبوط «يُخْطِئُ» هو في الاستعمال العربي المعاصر الفعل الشائع لمعنى «يرتكب خطأ»، لا «يخطئ/يذنب» بمعنى ἁμαρτάνω؛ ولذلك يلزم تصحيحه لتفادي تحويل الخطيئة إلى مجرد خطأ.
  naturalness: «يرتكب الخطيئة» عبارة فصيحة واضحة في العربية المعيارية المعاصرة، وتحافظ على جدية المصطلح الأخلاقي والديني. والتوازي بين شطري الآية يبقى واضحًا.
  terminology: استبدال «يُخْطِئُ» بـ«يرتكب الخطيئة» ضروري لأن الضبط المعطى يعيّن صيغة «أخطأ يُخطئ» المرتبطة عادة بالخطأ أو الزلل. «الخطيئة» هي المقابل العربي الواضح والمستقر لـἁμαρτία/ἁμαρτάνω هنا. ولا ينبغي تعيين مرجع الضمير.
