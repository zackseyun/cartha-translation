source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: ar
  text: كُلُّ مَنْ يَثْبُتُ فِيهِ لَا يَرْتَكِبُ الْخَطِيئَةَ[a]؛ وَكُلُّ مَنْ يَرْتَكِبُ الْخَطِيئَةَ لَمْ يَرَهُ وَلَمْ يَعْرِفْهُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحسب فهم صيغ المضارع اليونانية على أنها تصف فعلًا مستمرًا أو سلوكًا مميِّزًا: «لا يستمر في ارتكاب الخطيئة ... وكل من يستمر في ارتكاب الخطيئة».'
    reason: بيان احتمال دلالي لصيغ المضارع مع عدم حسمه داخل المتن.
lexical_decisions:
- source_word: πᾶς ὁ
  choice: كُلُّ مَنْ
  rationale: ينقل التركيب اليوناني العام وقوته الشاملة بصياغة عربية طبيعية.
- source_word: ἐν αὐτῷ μένων
  choice: يَثْبُتُ فِيهِ
  rationale: يحافظ «يثبت» على معنى الاستمرار الملازم لاستعمال μένω عند يوحنا، مع إبقاء تعبير «فيه» العلائقي كما هو في المصدر.
- source_word: οὐχ ἁμαρτάνει
  choice: لَا يُخْطِئُ
  rationale: ترجمة مباشرة لصيغة المضارع اليونانية، من غير أن تُدرج في المتن تفسيرًا حصريًا لها بوصفها فعلًا مستمرًا أو اعتياديًا؛ ويُذكر هذا الاحتمال في الحاشية.
- source_word: ὁ ἁμαρτάνων
  choice: مَنْ يُخْطِئُ
  rationale: يحافظ على التوازي مع الجملة الأولى وعلى الصياغة العامة، مع إبقاء الدلالة الزمنية أو الاعتيادية المحتملة للمضارع موضحة في الحاشية.
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: لَمْ يَرَهُ
  rationale: ينقل نفي صيغة التام اليونانية إلى العربية تعبيرًا عن عدم تحقق الرؤية، من دون إضافة «قط» غير الموجودة صراحة.
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: وَلَمْ يَعْرِفْهُ
  rationale: يعكس ترابط النفي في οὐδέ، ويحفظ معنى المعرفة الذي قد يتجاوز الإدراك الذهني إلى المعرفة العلائقية.
- source_word: αὐτῷ / αὐτόν
  choice: فِيهِ / ـهُ
  rationale: تُبقي الضمائر كما في النص اليوناني ولا تعيّن مرجعها صراحة بأنه الله أو الابن.
theological_decisions:
- issue: هل تنفي الآية وقوع أي خطيئة من المؤمن نفيًا مطلقًا؟
  choice: أُبقيت الصياغة المباشرة «لا يخطئ / من يخطئ» في المتن، مع بيان احتمال دلالة المضارع على السلوك المستمر أو المميِّز في الحاشية.
  alternative: «لا يستمر في ارتكاب الخطيئة / من يستمر في ارتكاب الخطيئة».
  rationale: 'صيغة المضارع اليونانية تسمح بقراءة مستمرة أو اعتيادية، لكن إدراج هذه القراءة وحدها في المتن قد يحسم دلالة لا تعبّر عنها الصيغة اللفظية بمفردها. المتن والحاشية معًا يحفظان حدة القول والتوتر مع 1 يوحنا 1: 8–2: 2.'
- issue: مرجع الضمير في «فيه / يره / يعرفه»
  choice: الإبقاء على الضمير من غير التصريح بمرجعه.
  alternative: تعيين المرجع بأنه الله أو الابن أو المسيح.
  rationale: النص اليوناني يستعمل الضمير، وتحديد مرجعه صراحة يتجاوز ما تقوله هذه الآية نفسها.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «يثبت فيه» للمحافظة على تعبير يوحنا المحوري وعلى صورة العلاقة والاستمرار، وأُبقي التوازي اللفظي بين شطري الآية.
