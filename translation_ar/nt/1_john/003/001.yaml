id: 1JN.3.1
reference: 1 John 3:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: ar
  text: انظروا أيةَ محبةٍ أعطانا الآب حتى نُدعى أولادَ الله، ونحن كذلك[b]. لهذا لا يعرفنا العالم[c]، لأنه لم يعرفه[d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: تحذف بعض المخطوطات عبارة «ونحن كذلك».
    reason: textual_variant
  - marker: c
    text: أو «لا يتعرف إلينا ... لم يتعرف إليه».
    reason: lexical_alternative
  - marker: d
    text: يعود الضمير «ـه» على الأرجح إلى الآب في هذه الآية؛ ويفهمه بعضهم على أنه يشير إلى المسيح في السياق اليوحناوي.
    reason: alternative_reading
  - marker: e
    text: 'يمكن أيضًا وصل العبارة هكذا: «لهذا لا يعرفنا العالم: لأنه لم يعرفه».'
    reason: punctuation_alternative
lexical_decisions:
- source_word: ἴδετε
  choice: انظروا
  rationale: صيغة أمر للجمع تسترعي الانتباه، و«انظروا» عربية فصيحة معاصرة تحفظ الدعوة المباشرة دون نبرة مهجورة.
- source_word: ποταπὴν ἀγάπην
  choice: أية محبة
  rationale: تنقل التعجب من نوع المحبة وصفتها، لا من مقدارها وحده، مع إبقاء العبارة طبيعية وموجزة.
- source_word: δέδωκεν ἡμῖν
  choice: أعطانا
  rationale: الفعل اليوناني في صيغة التام يشير إلى عطاء وقع وبقي أثره؛ والسياق العربي يؤدي هذا المعنى طبيعيًا بالماضي، فيما توحي «أعطانا» أيضًا بأن العطية صارت لنا.
- source_word: ὁ πατὴρ
  choice: الآب
  rationale: المصطلح العربي الكتابي الواضح للقب الإلهي في هذا السياق اليوحناوي.
- source_word: τέκνα θεοῦ
  choice: أولاد الله
  rationale: τέκνα لفظ شامل للذكور والإناث، و«أولاد الله» تعبير عربي طبيعي لا يخصص المعنى بالبنين.
- source_word: κληθῶμεν
  choice: نُدعى
  rationale: تحفظ صيغة المبني للمجهول بعد ἵνα، ويبيّن السياق أنها نتيجة محبة الآب وليست احتمالًا مشكوكًا فيه.
- source_word: καὶ ἐσμέν
  choice: ونحن كذلك
  rationale: تنقل التوكيد المقتضب بأن المؤمنين ليسوا مدعوين أولاد الله بالاسم فقط، بل هم كذلك حقًا.
- source_word: διὰ τοῦτο
  choice: لهذا
  rationale: تؤدي الرابط الاستنتاجي بوضوح واقتصاد.
- source_word: ὁ κόσμος
  choice: العالم
  rationale: تبقي اللفظ اليوحناوي دون تفسيره في المتن بأنه النظام البشري المقاوم لله.
- source_word: οὐ γινώσκει ἡμᾶς
  choice: لا يعرفنا
  rationale: تحفظ الموازاة اللفظية مع «لم يعرفه»، مع الإشارة في الحاشية إلى احتمال معنى «لا يتعرف إلينا».
theological_decisions:
- issue: مرجع الضمير αὐτόν
  choice: يُفهم في المتن طبيعيًا على أنه الآب
  alternative: قد يُفهم على أنه المسيح في السياق اليوحناوي الأوسع
  rationale: الآب هو أقرب اسم صريح سابق في الآية، لكن الضمير اليوناني لا يصرح بالمرجع، ولذلك تُحفظ القراءة المسيحانية البديلة في الحاشية.
- issue: إثبات καὶ ἐσμέν
  choice: إثبات «ونحن كذلك» في المتن
  alternative: حذف العبارة بحسب بعض المخطوطات
  rationale: نص SBLGNT يثبت العبارة، وهي توكيد دال على حقيقة بنوة المؤمنين لله، مع توثيق الحذف في الحاشية.
- issue: دلالة ἵνα في العبارة
  choice: صياغتها بعد النقطتين بوصفها مضمونًا ونتيجة لمحبة الآب
  alternative: «لكي نُدعى» بصياغة غائية صريحة
  rationale: تحتمل ἵνα الغاية أو النتيجة/المضمون هنا؛ والصياغة المختارة تحفظ الصلة دون أن تجعل مجرد التسمية هي الغاية الوحيدة للمحبة.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ومهيبة. استُخدمت «الآب» للقب الإلهي و«أولاد الله» للشمول الطبيعي. وُضعت العلامات [a]–[e] كلها في المتن، وجُمعت حاشيتا الضمير والوصل عند نهاية الجملة ذات الصلة.
