  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: ar
  text: لا تتعجبوا، أيها الإخوة[a]، إن كان العالم يبغضكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: جاءت كلمة «الإخوة» في اليونانية بصيغة جمع المذكر، ويُرجَّح أن الخطاب هنا موجَّه إلى جماعة المؤمنين كلها، بمن فيهم النساء.
    reason: توضيح الصيغة اللفظية وشمول المخاطَبين
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: لا تتعجبوا
  rationale: صيغة نهي بالمضارع، و«لا تتعجبوا» تؤدي معنى الاستغراب بعبارة عربية واضحة وطبيعية.
- source_word: ἀδελφοί
  choice: يا إخوتي
  rationale: نداء بصيغة جمع المذكر. تحافظ «يا إخوتي» على صيغة الأصل، مع توضيح شمول الخطاب لجماعة المؤمنين في الحاشية.
- source_word: εἰ
  choice: إن كان
  rationale: تحافظ العبارة على القوة الشرطية للأداة اليونانية، وتأتي طبيعية مع الجملة الدالة على حال مستمرة.
- source_word: μισεῖ
  choice: يبغضكم
  rationale: فعل مضارع يدل هنا على موقف مستمر أو واقع عام، و«يبغض» لفظ عربي واضح وملائم للسياق.
- source_word: ὁ κόσμος
  choice: العالم
  rationale: يحافظ هذا المقابل على سعة التعبير اليوحناوي من غير إضافة تفسيرية مثل «النظام المعادي لله» إلى صلب النص.
theological_decisions:
- issue: صيغة المذكر التمثيلية في ἀδελφοί
  choice: إبقاء «يا إخوتي» في المتن
  alternative: يا إخوتي وأخواتي؛ أيها الإخوة والأخوات
  rationale: الأصل يستعمل جمع المذكر، لكنه يُرجح أن يخاطب جماعة المؤمنين كلها. لذلك حُفظت الصيغة في المتن، ووُضح شمولها في الحاشية.
- issue: الدلالة اليوحناوية لكلمة κόσμος
  choice: ترجمتها «العالم» بلا توسع تفسيري
  alternative: النظام العالمي؛ المجتمع المعادي لله
  rationale: قد تشير الكلمة في رسائل يوحنا إلى البشر أو النظام الواقع في معارضة الله، لكن «العالم» يحفظ اتساع الدلالة والتوتر اللاهوتي ويترك للسياق تحديدها.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعمل النداء «يا إخوتي» بصورة طبيعية، وحُفظ الشرط والدلالة اليوحناوية الواسعة لكلمة «العالم» من غير شرح زائد في المتن.
