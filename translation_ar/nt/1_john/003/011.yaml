  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: ar
  text: 'لِأَنَّ هذِهِ هِيَ الرِّسَالَةُ الَّتِي سَمِعْتُمُوهَا مِنَ الْبَدْءِ: أَنْ نُحِبَّ بَعْضُنَا بَعْضًا.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لِكَيْ نُحِبَّ بَعْضُنَا بَعْضًا»، أو: «لِنُحِبَّ بَعْضُنَا بَعْضًا».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτι
  choice: لِأَنَّ
  rationale: تؤدي هنا وظيفة تعليلية تفسيرية تربط الآية بما قبلها، و«لأن» هي الصياغة العربية الطبيعية المباشرة.
- source_word: ἡ ἀγγελία
  choice: الرِّسَالَةُ
  rationale: لفظ عربي واضح يجمع معنى الخبر والتعليم المُبلَّغ، وهو أنسب في هذا السياق من «الإعلان» أو «البشارة».
- source_word: ἣν ἠκούσατε
  choice: الَّتِي سَمِعْتُمُوهَا
  rationale: يحافظ على زمن الفعل اليوناني الماضي وعلى كون الرسالة قد تلقاها المخاطبون بالسماع.
- source_word: ἀπ’ ἀρχῆς
  choice: مِنَ الْبَدَايَةِ
  rationale: يحفظ العبارة اليوحناوية المألوفة وصداها عبر كتابات يوحنا.
- source_word: ἵνα ἀγαπῶμεν
  choice: أَنْ نُحِبَّ
  rationale: تأتي «أن» بعد النقطتين لتعرض مضمون الرسالة، مع بقاء صيغة المضارع المنصوب قابلة لحمل القوة الحثية من غير زيادة «ينبغي» غير الموجودة لفظًا.
- source_word: ἀλλήλους
  choice: بَعْضُنَا بَعْضًا
  rationale: المقابل العربي الطبيعي للضمير التبادلي، ويبيّن أن المحبة متبادلة داخل الجماعة.
theological_decisions:
- issue: دلالة ἵνα ἀγαπῶμεν ἀλλήλους
  choice: أَنْ نُحِبَّ بَعْضُنَا بَعْضًا
  alternative: «لِكَيْ نُحِبَّ بَعْضُنَا بَعْضًا» أو «لِنُحِبَّ بَعْضُنَا بَعْضًا»
  rationale: السياق يرجّح أن الجملة تبيّن مضمون الرسالة ووجهتها الأخلاقية، لكن ἵνα تحتمل أيضًا الغاية أو الحث؛ لذلك أُبقي البديل في الحاشية بدل حسم التوتر الدلالي تمامًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت النقطتان لإظهار أن العبارة الأخيرة تشرح مضمون الرسالة، مع حاشية تحفظ احتمال الغاية أو الحث في ἵνα.
