  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: ar
  text: وأنتم تعلمون أنه ظهر[a] لكي يزيل الخطايا[b]، وليس فيه خطية.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُظهر».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يرفع الخطايا» أو «يحملها بعيدًا». يمكن للفعل اليوناني أن يعني الإزالة أو الرفع أو الحمل بعيدًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: تعلمون
  rationale: صيغة οἶδα التامة تؤدي معنى الحاضر في اليونانية الكوينية، و«تعلمون» هي المقابل العربي الطبيعي.
- source_word: ἐκεῖνος
  choice: أنه
  rationale: الضمير يعود في السياق إلى يسوع المسيح. ويؤدي الضمير العربي المرجع بوضوح من غير إضافة اسم غير مصرح به في الآية.
- source_word: ἐφανερώθη
  choice: ظهر
  rationale: يشير الفعل هنا إلى ظهور المسيح في التاريخ. و«ظهر» تعبير عربي واضح وطبيعي، مع إثبات احتمال «أُظهر» في الحاشية للمحافظة على صيغة المبني للمجهول.
- source_word: ἵνα
  choice: لكي
  rationale: تحفظ «لكي» دلالة الغرض التي تؤديها ἵνα.
- source_word: ἁμαρτίας
  choice: الخطايا
  rationale: تحفظ صيغة الجمع اليونانية وتشير إلى الخطايا بوصفها أفعالًا متعددة.
- source_word: ἄρῃ
  choice: يزيل
  rationale: يمكن أن يعني αἴρω الرفع أو الحمل أو الإزالة. و«يزيل» يوضح المقصود السياقي من دون حصر الكيفية اللاهوتية، مع ذكر الاحتمال الآخر في الحاشية.
- source_word: ἁμαρτία
  choice: خطية
  rationale: تحفظ الاسم المفرد في العبارة المطلقة التي تنفي وجود الخطية فيه.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: مقابل موجز وطبيعي يحفظ التعبير اليوحناوي «فيه».
theological_decisions:
- issue: مرجع ἐκεῖνος
  choice: الضمير عائد إلى يسوع المسيح
  alternative: «ذاك» بعبارة أكثر حرفية
  rationale: السياق المباشر يحدد الذي ظهر ليزيل الخطايا والذي لا خطية فيه بأنه يسوع المسيح. والإبقاء على الضمير يتجنب إدخال اسم تفسيري في صلب النص.
- issue: معنى αἴρω عند اتصاله بالخطايا
  choice: إزالة الخطايا
  alternative: حمل الخطايا أو رفعها بعيدًا
  rationale: يركز السياق على غرض الظهور، أي التخلص من الخطايا. وتحفظ «يزيل» هذا المعنى من غير قصر العبارة على تصور بعينه لعمل الكفارة، بينما تسجل الحاشية المجال الدلالي الأوسع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «خطية» للمفرد و«الخطايا» للجمع، وحُفظ إيجاز العبارة اليونانية وتوترها اللاهوتي من غير إضافة تفسير مذهبي.
