  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: ar
  text: 'ومن يحفظ وصاياه يثبت فيه[a]، وهو يثبت فيه. وبهذا نعرف أنه يثبت فينا: من الروح[b] الذي أعطانا إياه.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يشير الضمير بحسب السياق إلى الله، لكن الأصل اليوناني يستعمل الضمير ولا يذكر الاسم صراحة.
    reason: referent_clarification
  - marker: b
    text: 'يمكن أيضًا: «بالروح الذي أعطانا إياه». فحرف الجر اليوناني قد يدل على المصدر أو الأساس، كما قد يُفهم منه معنى الوسيلة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: يحفظ
  rationale: يحفظ هو المقابل المألوف لـτηρέω في السياق اليوحناوي، ويشمل مراعاة الوصايا والعمل بها من غير اختزال المعنى في مجرد الطاعة أو الحراسة.
- source_word: ἐντολάς
  choice: وصاياه
  rationale: «الوصايا» تحافظ على القوة الأخلاقية والعهدية للكلمة، وتنسجم مع استعمالها في سياق الرسالة.
- source_word: μένει
  choice: يثبت
  rationale: الفعل «يثبت» واضح ومألوف في العربية الكتابية، وينقل الاستمرار العلاقي الذي يميز μένω في كتابات يوحنا. وقد روعي تكراره ثلاث مرات في الآية.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: الإبقاء على الضمير يحفظ صياغة اليونانية ولا يستبدل به الاسم «الله»، مع أن السياق يرجح أن مرجعه هو الله.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: وبهذا نعرف
  rationale: صياغة عربية طبيعية تنقل وسيلة المعرفة أو أساسها، وتحافظ على المضارع الدال على المعرفة الحاضرة.
- source_word: ἐκ τοῦ πνεύματος
  choice: من الروح
  rationale: «من» تحافظ مباشرة على دلالة ἐκ التي قد تشير إلى المصدر أو الأساس، بدل حصرها في معنى الوسيلة وحده.
- source_word: πνεύματος
  choice: الروح
  rationale: السياق، ولا سيما كونه عطية من الله للمؤمنين، يدل على الروح القدس؛ ولا حاجة إلى إضافة وصف غير موجود صراحة في النص.
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: الذي أعطانا إياه
  rationale: يحافظ على الفعل الماضي في ἔδωκεν وعلى الإحالة الشخصية المناسبة للروح، مع تركيب عربي سليم.
theological_decisions:
- issue: مرجع الضمائر في «فيه، وهو يثبت فيه، يثبت فينا»
  choice: الإبقاء على الضمائر كما في اليونانية، مع فهم الله مرجعًا راجحًا لها في السياق.
  alternative: التصريح باسم «الله»، أو فهم العبارة الأخيرة في ضوء سكنى المسيح في المؤمنين.
  rationale: السياق السابق يميز الابن يسوع المسيح من صاحب الوصايا وواهب الروح. لكن استبدال الضمائر باسم صريح يحسم ما أبقاه النص بالضمير، لذلك حُفظت الصياغة الأصلية والتوتر اللاهوتي.
- issue: هوية πνεῦμα
  choice: فهمه على أنه الروح القدس وصياغته «الروح».
  alternative: فهمه بمعنى روح بشري أو مبدأ روحي عام.
  rationale: عبارة «الذي أعطانا إياه» والسياق اليوحناوي يدلان على روح الله الموهوب للمؤمنين، من غير حاجة إلى إدخال تفصيل عقائدي إضافي.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. حُفظ التكرار المقصود للفعل «يثبت»، واستُكمل الفعل المحذوف تقديرًا في العبارة الثانية لأن العربية الطبيعية تستلزمه هنا، مع إبقاء الضمائر وعدم استبدالها بأسماء تفسيرية.
