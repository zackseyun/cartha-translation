source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: ar
  text: 'بهذا عرفنا المحبة: أنه بذل حياته لأجلنا، فعلينا نحن أيضًا أن نبذل حياتنا لأجل الإخوة.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «الإخوة» هنا يُراد بها على الأرجح جماعة المؤمنين عمومًا، رجالًا ونساءً.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: بهذا
  rationale: تؤدي معنى الوسيلة أو الأساس الذي به تُعرَف المحبة، وهي صياغة عربية طبيعية موجزة.
- source_word: ἐγνώκαμεν
  choice: عرفنا
  rationale: الماضي العربي مع السياق يفيد معرفة تحققت ولا يزال أثرها قائمًا، من غير إثقال العبارة بصياغة حرفية للزمن التام.
- source_word: τὴν ἀγάπην
  choice: المحبة
  rationale: المقابِل العربي المباشر والطبيعي، ويحافظ على كون محبة المسيح هي المعيار المبيَّن في الجملة التالية.
- source_word: ἐκεῖνος
  choice: أنه
  rationale: أُضمر الفاعل في الفعل العربي «بذل»، كما يسمح السياق اليوناني بأن يُعرَف مرجعه من الخطاب؛ والمقصود في السياق هو المسيح.
- source_word: ὑπὲρ ἡμῶν
  choice: لأجلنا
  rationale: تنقل معنى العمل لمصلحتنا ومن أجلنا من غير حصر العبارة في نظرية محددة للكفارة.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: بذل حياته
  rationale: هذا هو المقابل العربي الاصطلاحي الطبيعي لعبارة وضع النفس، وψυχή هنا تعني الحياة في سياق التضحية الطوعية.
- source_word: ὀφείλομεν
  choice: فعلينا نحن أيضًا
  rationale: تعبّر «علينا» عن الالتزام الأخلاقي، وتُظهر «نحن أيضًا» المقابلة المؤكدة بين بذله وبين واجب المؤمنين.
- source_word: τῶν ἀδελφῶν
  choice: الإخوة
  rationale: يحافظ على الصيغة المذكرة في اليونانية، مع توضيح مدلولها الكنسي الشامل بحسب السياق في الحاشية.
- source_word: τὰς ψυχὰς θεῖναι
  choice: أن نبذل حياتنا
  rationale: يحافظ على التوازي المعجمي والدلالي مع «بذل حياته»، وصيغة الجمع العربية «حياتنا» طبيعية مع ضمير الجماعة.
theological_decisions:
- issue: مرجع ἐκεῖνος
  choice: الإبقاء على المرجع ضمنيًا في «بذل حياته»، على أن يحدده السياق بأنه المسيح.
  alternative: 'التصريح: «أن المسيح بذل حياته».'
  rationale: اليونانية تستعمل ضمير الإشارة من غير تسمية صريحة؛ والإبقاء على الضمير المستتر يحفظ بنية النص ولا يضيف اسمًا غير مذكور، مع وضوح المرجع من سياق الرسالة.
- issue: مدلول ἀδελφῶν
  choice: «الإخوة» في المتن، مع بيان شموله للمؤمنين والمؤمنات في الحاشية.
  alternative: «الإخوة والأخوات».
  rationale: يحفظ الاختيار الصيغة اليونانية المذكرة، بينما تمنع الحاشية إساءة فهمها على أنها تستبعد النساء في سياق جماعة المؤمنين.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «بذل حياته» بوصفه تعبيرًا عربيًا طبيعيًا عن التضحية بالنفس، وحُفظ التوازي بين فعل المسيح والواجب الواقع على المؤمنين.
