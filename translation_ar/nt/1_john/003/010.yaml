base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: ar
  text: 'بهذا يتبيّن أولاد الله وأولاد إبليس: كل من لا يمارس البرّ[a] فليس من الله، ولا يكون من الله من لا يحب أخاه[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «العدل». يمكن للكلمة اليونانية أن تدل على البر أو العدل، لكن «البر» أنسب للتقابل الأخلاقي هنا.
    reason: lexical_alternative
  - marker: b
    text: 'أي أخاه أو أخته في الإيمان. يرد النص اليوناني بصيغة المذكر المفرد: «أخاه».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: بهذا
  rationale: تحفظ العبارة قوة اسم الإشارة وتدل طبيعيًا على العلامة أو الأساس الذي به يظهر التمييز، من غير حسم زائد بين معنى الوسيلة والاستدلال.
- source_word: φανερά ἐστιν
  choice: يتبيّن
  rationale: صياغة عربية واضحة تدل على كون الفئتين ظاهرتين وقابلتين للتمييز، من غير إيحاء بحدوث إعلان خاص.
- source_word: τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου
  choice: أولاد الله وأولاد إبليس
  rationale: تحفظ الصورة العائلية الصريحة والتقابل اللاهوتي في النص اليوناني، و«إبليس» هو الاسم العربي المألوف للشخص المقصود هنا.
- source_word: πᾶς ὁ μὴ ποιῶν δικαιοσύνην
  choice: كل من لا يمارس البرّ
  rationale: المضارع في صيغة اسم الفاعل يدل على سلوك مميّز أو مستمر، ولذلك تنقل «يمارس» المعنى أدق من فعل قد يُفهم على واقعة منفردة.
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: فليس من الله
  rationale: تحفظ «من» دلالة المصدر أو الانتماء في ἐκ، مع تركيب عربي طبيعي وموجز.
- source_word: καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ
  choice: وكذلك من لا يحب أخاه
  rationale: تُظهر «وكذلك» أن الحكم السابق مقدّر في الشق الثاني، وتحفظ «أخاه» صيغة المذكر المفرد في الأصل.
theological_decisions:
- issue: اللغة العائلية للهوية الروحية والأخلاقية
  choice: أولاد الله وأولاد إبليس
  alternative: المنتمون إلى الله والمنتمون إلى إبليس
  rationale: الأصل يستعمل τέκνα صراحة، فالحفاظ على «أولاد» يصون صورة البنوة والانتماء المميزة لرسالة يوحنا بدل تحويلها إلى تصنيف عام.
- issue: مدى لفظ ἀδελφός المذكر
  choice: أخاه
  alternative: أخاه أو أخته؛ أو أخاه في الإيمان
  rationale: النص اليوناني مذكر مفرد، لذلك أُبقي في المتن، مع بيان إمكان شموله للمؤمن أو المؤمنة في الحاشية دون فرض التفسير على النص.
- issue: دلالة δικαιοσύνην الأخلاقية
  choice: البرّ
  alternative: العدل
  rationale: في هذا السياق اليوحناوي يدل اللفظ أساسًا على السلوك القويم الموافق لله، مع بقاء «العدل» معنى معجميًا ممكنًا يُذكر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. اختيرت تراكيب مألوفة مثل «بهذا يتبيّن» و«يمارس البرّ»، مع الحفاظ على التوازي والصورة العائلية في الأصل وتجنب المصطلحات الطائفية.
