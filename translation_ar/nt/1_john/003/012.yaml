base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: ar
  text: لا نكن مثل قايين، الذي كان من الشرير[a] وذبح[b] أخاه. ولماذا ذبحه؟ لأن أعماله كانت شريرة، أما أعمال أخيه فكانت بارة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «من الشر». يمكن أن تُفهم العبارة اليونانية بمعنى مجرد، لكن استعمالها في كتابات يوحنا يشير غالبًا إلى الشرير بصفته شخصًا.
    reason: alternative_reading
  - marker: b
    text: أو «قتل». الفعل اليوناني أشد تصويرًا من لفظ عام يعني القتل، ومعناه الحرفي «ذبح».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: لا نكن مثل قايين
  rationale: يفيد التركيب مقارنة منفية مرتبطة بالحث السابق على المحبة. أُظهر الفعل المفهوم من السياق لتأتي العبارة عربية واضحة من غير تغيير المقابلة.
- source_word: ἐκ τοῦ πονηροῦ
  choice: من الشرير
  rationale: تحافظ «من» على دلالة المصدر أو المنشأ في ἐκ، و«الشرير» هو الفهم الشخصي الأرجح في استعمال يوحنا، مع إثبات القراءة المجردة الممكنة في الحاشية.
- source_word: ἔσφαξεν
  choice: ذبح
  rationale: الفعل σφάζω أقوى وأشد تصويرًا من مجرد «قتل»، و«ذبح» ينقل عنفه بوضوح ومن دون تعبير قديم.
- source_word: ἀδελφὸν αὐτοῦ
  choice: أخاه
  rationale: صياغة عربية مباشرة وطبيعية تحفظ أهمية رابطة الأخوة في المقابلة الأخلاقية.
- source_word: χάριν τίνος
  choice: ولماذا
  rationale: مقابل عربي طبيعي لعبارة السؤال عن السبب.
- source_word: ὅτι
  choice: لأن
  rationale: تقدم السبب الصريح لفعل قايين.
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: لأن أعماله كانت شريرة
  rationale: «أعمال» تحافظ على لفظ ἔργα وعلى صلته باللغة الأخلاقية في رسائل يوحنا، و«شريرة» تنقل الوصف الأخلاقي πονηρά.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: أما أعمال أخيه فكانت بارة
  rationale: أُعيدت «أعمال» لتجنب إحالة ملتبسة في العربية، واستُعملت «بارة» لأن δίκαια تصف استقامة الأعمال أخلاقيًا لا عدالة حكم قضائي.
theological_decisions:
- issue: هل τοῦ πονηροῦ يدل على شخص «الشرير» أم على الشر بمعناه المجرد؟
  choice: 'القراءة الشخصية: «الشرير»'
  alternative: 'القراءة المجردة: «الشر»'
  rationale: الصفة المعرفة πονηρός في كتابات يوحنا كثيرًا ما تشير إلى الشرير بصفته شخصًا، لكن التركيب يحتمل من جهة اللغة معنى مجردًا؛ لذلك حُفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُكمل الفعل المفهوم من سياق الآية السابقة في «لا نكن» لتستقيم العبارة عربيًا، مع إبقاء المقابلة والاستفهام السببي وحدّة الفعل اليوناني.
