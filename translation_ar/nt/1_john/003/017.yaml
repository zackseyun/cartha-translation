reference: 1 John 3:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: ar
  text: وَأَمَّا مَنْ كَانَتْ لَدَيْهِ مُمْتَلَكَاتُ هَذَا الْعَالَمِ، وَرَأَى أَخَاهُ[a] مُحْتَاجًا، ثُمَّ أَغْلَقَ قَلْبَهُ عَنْهُ[b]، فَكَيْفَ تَبْقَى مَحَبَّةُ اللهِ فِيهِ؟[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أيضًا: «أخاه أو أخته». يقول اليوناني «أخاه»، وقد يُراد به تمثيليًا أحد المؤمنين.'
    reason: lexical_alternative
  - marker: b
    text: 'أيضًا: «حجب عنه حنانه». وحرفيًا: «أغلق أحشاءه عنه»، وهو تعبير عن حبس الرحمة القلبية وعدم إظهارها.'
    reason: lexical_alternative
  - marker: c
    text: قد تعني «محبة الله» محبة الله الحاضرة فيه، أو محبته هو لله.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: خَيْرَاتُ هَذَا الْعَالَمِ
  rationale: تدل βίος هنا على أسباب المعيشة أو الممتلكات المادية، وسياق سد حاجة الأخ يرجّح هذا المعنى. والتعبير العربي المختار طبيعي وواضح، مع إبقاء صلة الموارد المادية بالعالم الحاضر.
- source_word: θεωρῇ
  choice: رَأَى
  rationale: يفيد الفعل المعاينة والإدراك المباشر للحال، و«رأى» يؤدي المعنى بوضوح من غير تكلّف.
- source_word: ἀδελφὸν
  choice: أَخَاهُ
  rationale: اللفظ اليوناني مذكر مفرد، ولذلك حُفظ في المتن. وقد يُستعمل تمثيليًا للمؤمن أو المؤمنة، وهو موضح في الحاشية.
- source_word: χρείαν ἔχοντα
  choice: مُحْتَاجًا
  rationale: صياغة عربية موجزة وطبيعية لعبارة «له حاجة»، وتعبّر عن افتقاره إلى الضروريات.
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: أَغْلَقَ قَلْبَهُ عَنْهُ
  rationale: العبارة اليونانية تذكر الأحشاء حرفيًا بوصفها موضع العواطف والرحمة. و«أغلق قلبه عنه» يحفظ صورة الإغلاق والامتناع المتعمد بلغة عربية مفهومة.
- source_word: πῶς
  choice: فَكَيْفَ
  rationale: يحفظ صيغة السؤال الإنكاري من غير إضافة فعل إمكان غير مصرح به في الأصل.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: مَحَبَّةُ اللهِ
  rationale: تحافظ الإضافة العربية، مثل اليونانية، على احتمال أن تكون المحبة الصادرة من الله أو محبة الإنسان لله، من غير حسم التوتر الدلالي.
- source_word: μένει ἐν αὐτῷ
  choice: تَثْبُتُ فِيهِ
  rationale: «تثبت» تؤدي معنى الاستمرار والمكث الذي يحمله μένω، وهي فصيحة وميسرة في هذا السياق.
theological_decisions:
- issue: دلالة الإضافة في ἡ ἀγάπη τοῦ θεοῦ
  choice: مَحَبَّةُ اللهِ
  alternative: محبة الله له؛ أو محبته لله
  rationale: الإضافة اليونانية تحتمل المحبة التي مصدرها الله والمحبة المتجهة إلى الله، ولا يقتضي السياق حسم أحد الوجهين. لذلك حُفظ التركيب المحتمل للمعنيين مع بيان ذلك في الحاشية.
- issue: التعبير عن ἀδελφὸν المذكر المفرد
  choice: أَخَاهُ
  alternative: أخاه أو أخته؛ أو أخاه في الإيمان
  rationale: يحافظ المتن على الصيغة المذكرة المفردة في المصدر، بينما توضّح الحاشية إمكان الاستعمال التمثيلي لأحد المؤمنين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «خيرات هذا العالم» للموارد المادية، و«أغلق قلبه عنه» لنقل الصورة الاصطلاحية من غير غرابة حرفية. وُضعت علامات الحواشي عند الألفاظ التي تشرحها مباشرة.
