    rationale: يمكن أن تُفهم «الخيرات» على نحو أوسع من الممتلكات. والسياق يتكلم عن الموارد/الممتلكات المادية اللازمة لسد حاجة الأخ، لذا «ممتلكات هذا العالم» أشد تحديدًا.
