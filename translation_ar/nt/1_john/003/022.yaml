  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: ar
  text: وكل ما نطلبه نناله منه، لأننا نحفظ وصاياه ونعمل ما هو مرضي في عينيه.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ ἐὰν αἰτῶμεν
  choice: مهما نطلب
  rationale: 'تركيب الموصول مع ἐάν يفيد العموم: «كل ما» أو «مهما». وهذه الصياغة عربية طبيعية وموجزة.'
- source_word: λαμβάνομεν ἀπ’ αὐτοῦ
  choice: ننلْه منه
  rationale: الفعل يدل هنا على التلقي أو الحصول، وἀπό مع المضاف إليه يبيّن المصدر. والضمير في «ننلْه» يعود إلى ما نطلبه.
- source_word: τὰς ἐντολὰς αὐτοῦ τηροῦμεν
  choice: نحفظ وصاياه
  rationale: «نحفظ» يصون دلالة τηρέω على الحفظ والمراعاة، كما يحافظ «وصاياه» على المفردات اليوحناوية المتكررة.
- source_word: τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν
  choice: نعمل ما يرضيه
  rationale: الصفة المحايدة المجموعة المستعملة اسميًا تشير إلى الأمور المرضية لديه. والصياغة العربية تنقل معنى «نفعل ما هو مرضي أمامه» بوضوح وطبيعية.
theological_decisions:
- issue: العلاقة بين استجابة الطلب وحفظ الوصايا
  choice: 'الإبقاء على العلاقة السببية الصريحة: «لأننا»'
  alternative: صياغة توحي بمجرد المصاحبة بين الأمرين من غير سببية
  rationale: تؤدي ὅτι هنا معنى التعليل. لذلك تُحفظ حدة العبارة اللاهوتية كما وردت، من غير تليين للسببية ولا تحويلها إلى قاعدة آلية لاستجابة الصلاة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «مهما نطلب» للعموم، و«نعمل ما يرضيه» لتجنب تركيب حرفي ثقيل مع الحفاظ على معنى العبارة اليونانية.
