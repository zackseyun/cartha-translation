  source_fidelity: 'المعنى العام منقول بأمانة: الولادة من الله، وعدم ممارسة الخطيئة، وبقاء «زرعه» في الشخص، وعدم القدرة على الاستمرار في الخطيئة. لكن عبارة «زرعه» في العربية الحديثة قد تُفهم في المقام الأول على أنها زرعٌ زراعي أو نبات، ولا تنقل استعارة σπέρμα (البذر/النسل) بوضوح كافٍ. «بذره» تحفظ الصورة المجازية الأقرب إلى اليونانية من دون تفسير مرجعها المتنازع عليه.'
