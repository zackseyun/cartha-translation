  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: ar
  text: كُلُّ مَن وُلِدَ مِنَ اللهِ لا يمارس الخطيئة[a]، لأن بذره باقٍ فيه[b]؛ ولا يستطيع الاستمرار في الخطيئة[c]، لأنه قد وُلِدَ مِنَ اللهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصورة أقرب إلى اللفظ: «لا يفعل الخطيئة» أو «لا يرتكب الخطيئة». ويرجح أن الصياغة اليونانية تشير هنا إلى ممارسة الخطيئة باستمرار، لا إلى فعل واحد منفرد.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ثابتٌ فيه».'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «لا يستطيع أن يخطئ». ويرجح في السياق أن صيغة المضارع اليونانية تحمل معنى الاستمرار في الخطيئة أو المضي فيها.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος
  choice: كُلُّ مَن وُلِدَ
  rationale: تنقل العبارة حكمًا عامًا يشمل كل من نال الولادة من الله، وتحافظ صيغة الماضي على معنى الحدث ذي النتيجة المستمرة الذي تفيده صيغة التمام اليونانية.
- source_word: ἐκ τοῦ θεοῦ
  choice: مِنَ اللهِ
  rationale: تفيد ἐκ المصدر أو الأصل في لغة يوحنا عن الولادة الجديدة، و«مِنَ الله» تعبير عربي طبيعي ودقيق.
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: لا يمارس الخطيئة
  rationale: تحافظ «يمارس» على دلالة السلوك المتكرر أو النمط المستمر التي يرجحها السياق، بدل أن توحي العبارة بفعل منفرد فقط.
- source_word: σπέρμα αὐτοῦ
  choice: زرعه
  rationale: تُبقي الترجمة استعارة «الزرع» من غير تعيين المقصود بها، إذ قد تُفهم على أنها كلمة الله أو حياته أو مبدأ الولادة منه، والنص لا يصرح بذلك.
- source_word: ἐν αὐτῷ μένει
  choice: باقٍ فيه
  rationale: تنقل «باقٍ» معنى الاستمرار في μένω بلغة عربية واضحة، مع إبقاء الضمير كما في النص اليوناني.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: لا يستطيع أن يستمر في ارتكاب الخطيئة
  rationale: تعكس العبارة دلالة المصدر المضارع على الفعل المستمر في هذا السياق، مع بيان الصياغة الحرفية الأقصر في الحاشية.
- source_word: γεγέννηται
  choice: قد وُلِدَ
  rationale: تفيد «قد» مع الماضي وقوع الولادة وبقاء نتيجتها، بما يلائم صيغة التمام اليونانية.
theological_decisions:
- issue: هل تعني الآية استحالة صدور أي خطيئة منفردة ممن وُلِد من الله، أم تنافي الولادة من الله مع الاستمرار في ممارسة الخطيئة؟
  choice: يعرض المتن تنافي الولادة من الله مع الاستمرار في ممارسة الخطيئة.
  alternative: الاستحالة المطلقة لارتكاب أي خطيئة ولو مرة واحدة.
  rationale: 'يرجح السياق والصيغ المضارعة في ποιεῖ وἁμαρτάνειν معنى السلوك المتواصل. ومع ذلك تُحفظ الصياغة الحرفية «لا يستطيع أن يخطئ» في الحاشية، فلا يُطمس التوتر القائم مع 1 يوحنا 1: 8–2: 1.'
- issue: تحديد المقصود بـ«زرعه»
  choice: الإبقاء على الاستعارة من غير تفسيرها في المتن.
  alternative: تفسيرها بأنها كلمة الله، أو حياة الله، أو طبيعته.
  rationale: لا يحدد النص نفسه مرجع σπέρμα تحديدًا صريحًا، ولذلك يتجنب المتن إدخال تفسير عقائدي خاص.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ورصينة. استُعملت «يمارس الخطيئة» لبيان النمط المستمر، وأُبقيت استعارة «زرعه» وضمائرها بلا تفسير زائد. تظهر جميع علامات الحواشي في المتن بترتيبها.
