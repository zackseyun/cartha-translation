  source_fidelity: 'الترجمة تنقل عناصر اليونانية بدقة: النداء الحميم في «يا أولادي»، والنهي المستمر «لا يخدعكم أحد»، والدلالة السلوكية المعتادة في «مَن يعمل البرّ»، والتوازي المقصود بين «البرّ» و«بارّ»، والمقارنة في «كما أن»، واسم الإشارة في «ذاك». ولا تضيف تعيينًا تفسيريًا لمرجع ἐκεῖνος في المتن.'
  naturalness: الصياغة عربية فصحى حديثة واضحة ووقورة. «يا أولادي» مناسبة لنداء الكاتب الأبوي، و«مَن يعمل البرّ فهو بارّ» سليمة ومتماسكة. واستعمال «ذاك» أفصح من استبداله بضمير قد يخفف قيمة اسم الإشارة اليوناني، وإن كان ذا نبرة كتابية ملائمة للسياق.
  terminology: اختيار «البرّ/بارّ» موفق؛ فهو يحافظ على الارتباط اللفظي والدلالي بين δικαιοσύνη وδίκαιος، ويلائم السياق الأخلاقي اليوحناوي. والحاشية الخاصة بـ«العدالة» تبيّن البديل من غير تشويش على المعنى الأساسي. وحاشية «ذاك» تحفظ عدم الجزم بمرجعه مع بيان القراءة الأرجح.
