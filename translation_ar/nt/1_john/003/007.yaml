source:
  edition: SBLGNT
  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: ar
  text: يا أولادي، لا يخدعكم أحد[a]. مَن يعمل البرّ[b] فهو بارّ، كما أن ذاك[c] بارّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا يضلّلكم أحد».'
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تأتي الكلمة بمعنى «العدالة»، لكن المقصود هنا السلوك القويم الموافق لصفة البارّ.
    reason: lexical_alternative
  - marker: c
    text: 'اليونانية: «ذاك». والأرجح أن الإشارة إلى المسيح، مع أن بعضهم يفهمها على أنها إشارة إلى الله.'
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: يا أولادي
  rationale: نداء أبوي حميم يحفظ معنى القرابة والتحبب في صيغة الجمع، ويأتي في عربية فصيحة طبيعية من غير إضافة صفة غير موجودة في اليونانية.
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: لا يخدعكم أحد
  rationale: ينقل صيغة النهي بوضوح، ويفيد πλανάω هنا الخداع المؤدي إلى الضلال في الفهم والسلوك؛ وأُثبت البديل «يضلّلكم» في الحاشية.
- source_word: ὁ ποιῶν
  choice: مَن يعمل
  rationale: صيغة الموصول مع المضارع تعبّر في العربية عن الفعل المتصف بالاستمرار أو الاعتياد، من غير حصر المعنى في فعل واحد عابر.
- source_word: τὴν δικαιοσύνην
  choice: البرّ
  rationale: «البرّ» هو الأنسب هنا للسلوك القويم، ويحفظ الصلة الاشتقاقية والدلالية مع «بارّ» في الجملة التالية أكثر مما تفعل «العدالة».
- source_word: δίκαιός ἐστιν
  choice: فهو بارّ
  rationale: يحفظ الوصف الأخلاقي للشخص والتوازي مع «البرّ»، مع صياغة عربية واضحة وطبيعية.
- source_word: καθὼς
  choice: كما أن
  rationale: تؤدي المقارنة المباشرة التي تفيدها الأداة اليونانية.
- source_word: ἐκεῖνος
  choice: ذاك
  rationale: يحفظ اسم الإشارة اليوناني ولا يستبدله باسم تفسيري مثل «المسيح» أو «الله»، وبذلك يبقى مرجعه مفتوحًا كما في الأصل.
theological_decisions:
- issue: مرجع ἐκεῖνος
  choice: الإبقاء على اسم الإشارة «ذاك» في المتن، مع بيان أن المرجع الأرجح هو المسيح.
  alternative: فهمه على أنه يشير إلى الله/الآب، أو استعمال «هو» من غير إظهار قوة اسم الإشارة.
  rationale: يرجّح الاستعمال اليوحناوي والسياق القريب الإشارة إلى المسيح، لكن النص اليوناني لا يذكره بالاسم. لذلك يحفظ المتن الضمير الإشاري وتوضح الحاشية الاحتمالين من غير حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يا أولادي» للمخاطبة الأبوية الحميمة، وحُفظ التوازي بين «البرّ» و«بارّ». أما «ذاك» فصياغة مقصودة تحافظ على اسم الإشارة وعلى قدر من الغموض الحقيقي في مرجعه.
