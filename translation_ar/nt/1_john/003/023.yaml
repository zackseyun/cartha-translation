source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: ar
  text: 'وهذه هي وصيته: أن نؤمن باسم ابنه يسوع المسيح[a]، وأن نحب بعضنا بعضًا، كما أوصانا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي إن «المسيح» لقب ليسوع، ومعناه الممسوح أو المسيّا.
    reason: توضيح دلالة اللقب اليوناني Χριστός من غير تحويله إلى اسم عائلة.
lexical_decisions:
- source_word: ἐντολή
  choice: وصية
  rationale: «وصية» لفظ عربي طبيعي ذو قوة إلزامية، ويحافظ على تكرار الاسم اليوناني في صدر الآية ومعناه في ختامها.
- source_word: ἵνα πιστεύσωμεν
  choice: أن نؤمن
  rationale: تُبيّن «أن» مضمون الوصية، ويؤدي المضارع المنصوب معنى صيغة الالتزام المقصودة من صيغة الاحتمال اليونانية.
- source_word: πιστεύω τῷ ὀνόματι
  choice: نؤمن باسم
  rationale: تعبير موجز يحافظ على الدلالة اليوحناوية للإيمان الموجّه إلى الشخص كما يكشفه اسمه، من غير إضافة حرف جر غير لازم في العربية.
- source_word: υἱοῦ αὐτοῦ
  choice: ابنه
  rationale: ينقل علاقة البنوة مباشرة، والضمير يعود إلى الله بحسب السياق.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، وهو هنا لقب ليسوع لا اسم عائلة.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: يحب بعضنا بعضًا
  rationale: 'صياغة عربية فصيحة وطبيعية للتبادل المقصود: أن يوجّه المؤمنون المحبة بعضهم إلى بعض.'
- source_word: καθὼς ἔδωκεν ἐντολὴν ἡμῖν
  choice: كما أوصانا
  rationale: ينقل المقارنة وقوة الأمر بصورة عربية سليمة؛ أما النقل الحرفي «أعطانا وصية» فأثقل ولا يضيف دلالة لازمة.
theological_decisions:
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيح بوصفه لقبًا مشروحًا، أو «كريستوس» بالنقل الصوتي
  rationale: «المسيح» هو المقابل العربي الدلالي المألوف، ويحفظ وظيفة اللفظ اليوناني بوصفه لقبًا مسيانيًا.
- issue: قوة πιστεύω τῷ ὀνόματι
  choice: نؤمن باسم
  alternative: نثق باسم
  rationale: «نؤمن» يحافظ على معجم يوحنا المتكرر، في حين أن «نثق» احتمال دلالي صحيح لكنه أضيق وقد يخفف صلة العبارة بموضوع الإيمان في الرسالة.
- issue: وحدة الوصية وتعدد مضمونها
  choice: وصية مفردة تتضمن الإيمان والمحبة
  alternative: وصيتان منفصلتان
  rationale: النص يستعمل المفرد ἡ ἐντολή ثم يربط الفعلين بـ«و»، لذلك تُحفظ صيغة الوصية الواحدة ذات المضمون المركب.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُعملت «وصية» لما لها من رسوخ كتابي مع بقائها مفهومة، وصيغ الختام بالفعل «أوصانا» لتجنب تركيب حرفي متكلف، مع الحفاظ على معنى الأمر المفرد.
