  terminology: استُبقيت صورة «القلب» بدل تفسيرها بـ«الضمير»، وهو أدق للنص. و«يديننا» مناسب للطابع القضائي في καταγινώσκῃ، مع توفير البدائل المعجمية في الحاشية. و«الله» و«أعظم» و«كل شيء» اختيارات معيارية لا تفرض تفسيرًا مذهبيًا محددًا.
