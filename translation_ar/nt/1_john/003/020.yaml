source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: ar
  text: لأنه إن كان قلبنا يديننا[a]، فالله أعظم من قلبنا[b]، وهو يعرف كل شيء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يلومنا»، أو «يجد علينا مأخذًا».'
    reason: lexical_alternative
  - marker: b
    text: قد تشير عبارة «الله أعظم من قلبنا» إلى أن معرفته بحقيقتنا أكمل، وقد تتضمن أيضًا أن سلطانه أعلى من إدانتنا لأنفسنا.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: لأنه
  rationale: تفيد ὅτι الأولى التعليل أو بيان الأساس لما سبق، و«لأنه» تنقل هذه الصلة بوضوح في العربية.
- source_word: ἐὰν
  choice: إن
  rationale: تدخل ἐὰν مع صيغة المضارع الاحتمالية على حالة شرطية؛ و«إن» هي المقابل العربي الطبيعي هنا.
- source_word: καταγινώσκῃ
  choice: يديننا
  rationale: يفيد الفعل الحكم على الشخص أو مؤاخذته وإيجاد مأخذ عليه. و«يديننا» يحفظ الطابع القضائي الداخلي، مع ذكر البدائل في الحاشية.
- source_word: ἡ καρδία
  choice: قلبنا
  rationale: يحافظ على صورة «القلب» بوصفه مركز الحياة الباطنة، بدل تفسيره مباشرةً بلفظ «الضمير».
- source_word: ὅτι
  choice: فـ
  rationale: تُفهم ὅτι الثانية على أنها تقدم مضمون التعليل أو أساس الطمأنينة. وتنقل الفاء العربية اتصال الجواب بما قبله من غير تكرار ثقيل لـ«لأن».
- source_word: μείζων
  choice: أعظم
  rationale: يحفظ اللفظ اتساع المقارنة ولا يقصرها على الرحمة أو السلطان أو المعرفة وحدها، وإن كانت الجملة التالية تبرز المعرفة.
- source_word: ὁ θεὸς
  choice: الله
  rationale: المقابل العربي المعياري لـθεός في هذا السياق.
- source_word: τῆς καρδίας ἡμῶν
  choice: من قلبنا
  rationale: تأتي «من» بعد أفعل التفضيل في العربية، وتكرار «قلبنا» يحفظ المقارنة الصريحة في اليونانية.
- source_word: γινώσκει πάντα
  choice: وهو يعرف كل شيء
  rationale: تنقل شمول πάντα بوضوح، والضمير المنفصل «هو» يبرز أن الله هو صاحب المعرفة الكاملة.
theological_decisions:
- issue: معنى كون الله «أعظم من قلبنا»
  choice: إبقاء العبارة واسعة من غير قصر عظَمة الله على الرحمة أو السلطان أو المعرفة وحدها.
  alternative: أن يكون المعنى حصرًا أن الله أرحم من ضميرنا، أو أن حكمه يبطل إدانتنا لأنفسنا، أو أن معرفته أكمل من تقديرنا الجزئي لأنفسنا.
  rationale: النص اليوناني يقرر على نحو واسع أن الله أعظم من قلبنا، ثم يضيف أنه يعرف كل شيء. تؤكد الجملة اللاحقة بُعد المعرفة، لكنها لا تستنفد دلالة المقارنة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة الأسلوب. حُفظت صورة «القلب» والتوتر الدلالي في «أعظم»، مع استعمال تركيب شرطي طبيعي وإبقاء الحواشي موجزة.
