reference: 1 John 3:2
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: ar
  text: أيها الأحباء، نحن الآن أولاد الله، ولم يُعلَن بعد ماذا سنكون. ونعلم أنه إن أُعلِن[a][b]، فسنكون مثله، لأننا سنراه كما هو.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن يكون المعنى: «إن أُعلِن ما سنكونه»؛ فالفاعل غير مذكور صراحة في اليونانية، غير أن السياق يرجّح أن المقصود هو المسيح.'
    reason: alternative_reading
  - marker: b
    text: 'تترجم نسخ كثيرة هذه العبارة: «متى ظهر». أما اليونانية فحرفيًا أقرب إلى «إن أُعلِن»، وفيها الفعل نفسه المستعمل سابقًا في الآية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: أيها الأحباء
  rationale: نداء جمع يحمل المودة ويحافظ على الصلة الدلالية بالمحبة، وهو تعبير عربي فصيح ومألوف.
- source_word: νῦν
  choice: الآن
  rationale: يبيّن الحالة الحاضرة في مقابل ما لم يُعلَن بعد عن المستقبل.
- source_word: τέκνα θεοῦ
  choice: أولاد الله
  rationale: ينقل علاقة البنوة دون تخصيص الجنس أو الإيحاء بصغر السن، وهو واضح للقارئ العربي.
- source_word: οὔπω ἐφανερώθη
  choice: لم يُعلَن بعد
  rationale: يحافظ على المبني للمجهول وعلى معنى الإظهار والكشف، مع صياغة عربية طبيعية.
- source_word: τί ἐσόμεθα
  choice: ماذا سنكون
  rationale: ينقل السؤال عن حال المؤمنين أو طبيعتهم في المستقبل، لا عن هويتهم الشخصية فحسب.
- source_word: οἴδαμεν
  choice: نعلم
  rationale: ترجمة مباشرة للفعل ذي المعنى الحاضر.
- source_word: ἐὰν φανερωθῇ
  choice: إن أُعلِن
  rationale: يحافظ على أداة الشرط وعلى المبني للمجهول، ويترك الفاعل الضمني كما في اليونانية بدل تحويل العبارة إلى «متى ظهر».
- source_word: ὅμοιοι αὐτῷ
  choice: سنكون مثله
  rationale: يفيد المشابهة لا التطابق، ويحافظ على قوة الوعد دون الإيحاء بوحدة الهوية أو الجوهر.
- source_word: ὀψόμεθα αὐτὸν
  choice: سنراه
  rationale: صياغة عربية مباشرة للمستقبل وللمفعول العائد إلى الشخص المذكور ضمنًا.
- source_word: καθώς ἐστιν
  choice: كما هو
  rationale: يحافظ بإيجاز على معنى رؤيته بحسب حقيقته كما هو.
theological_decisions:
- issue: مرجع الفاعل الضمني في ἐὰν φανερωθῇ
  choice: 'تُرك الفاعل ضمنيًا في المتن: «إن أُعلِن»، مع بيان أن السياق يرجّح المسيح.'
  alternative: «إن أُعلِن ما سنكونه» أو الصياغة التفسيرية «متى ظهر».
  rationale: الحديث اللاحق عن رؤيته والصيرورة مثله يرجّح أن المرجع هو المسيح، لكن اليونانية لا تصرّح بالفاعل؛ لذلك تحافظ الصياغة العربية على الغموض الحقيقي وتشرحه الحاشية.
- issue: طبيعة مشابهة المؤمنين المستقبلية للمسيح
  choice: «سنكون مثله» بمعنى مشابهة حقيقية لا تطابق في الهوية أو الجوهر.
  alternative: «سنصير كما هو».
  rationale: تدل ὅμοιοι على المشابهة، أما البديل فقد يوحي بمساواة أو تطابق لا يصرّح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «أيها الأحباء» للنداء الحميم، وحوفظ على التوازي اللفظي بين موضعي φανερόω بصيغة «يُعلَن/أُعلِن»، مع إبقاء الغموض النحوي المقصود في الجملة الشرطية.
