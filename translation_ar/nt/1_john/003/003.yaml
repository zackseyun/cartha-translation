  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: ar
  text: وَكُلُّ مَنْ يُعَلِّقُ هَذَا الرَّجَاءَ عَلَيْهِ[a] يُطَهِّرُ نَفْسَهُ، كَمَا أَنَّ ذَاكَ[b] طَاهِرٌ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «له هذا الرجاء فيه». يمكن أن تفيد العبارة اليونانية أن الرجاء متعلّق به أو قائم فيه.'
    reason: lexical_alternative
  - marker: b
    text: يرجّح السياق أن «ذاك» يشير إلى الابن، أي المسيح، لكن الأصل اليوناني يترك المرجع في اسم إشارة.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: كُلُّ مَنْ لَهُ
  rationale: ينقل التركيب الاسمي العام والمشاركة الحاضرة بصياغة عربية طبيعية، مع إبقاء المعنى صفةً ملازمة لكل من يتصف بهذا الرجاء.
- source_word: ἐλπίδα ταύτην
  choice: هَذَا الرَّجَاءُ
  rationale: «الرجاء» المقابل المعياري لـἐλπίς، واسم الإشارة يحيل إلى الرجاء المذكور في السياق السابق.
- source_word: ἐπ’ αὐτῷ
  choice: مُعَلَّقًا بِهِ
  rationale: يبيّن أن الشخص المشار إليه هو متعلَّق الرجاء أو مرتكزه، مع إثبات البديل الممكن «فيه» في الحاشية.
- source_word: ἁγνίζει ἑαυτὸν
  choice: يُطَهِّرُ نَفْسَهُ
  rationale: يحفظ الفعل الانعكاسي ودلالة التنقية الأخلاقية، كما يصون الصلة اللفظية والدلالية مع ἁγνός في ختام الآية.
- source_word: καθὼς
  choice: كَمَا أَنَّ
  rationale: صياغة عربية واضحة تؤدي المقارنة المباشرة.
- source_word: ἐκεῖνος
  choice: ذَاكَ
  rationale: يحفظ قوة اسم الإشارة اليوناني ولا يستبدله صراحةً بلقب «المسيح»، وبذلك يبقى مرجعه الضميري كما في المصدر.
- source_word: ἁγνός
  choice: طَاهِرٌ
  rationale: يناسب السياق الأخلاقي ويحافظ على التجانس الاشتقاقي العربي مع «يطهّر».
theological_decisions:
- issue: مرجع الضمير في αὐτῷ واسم الإشارة ἐκεῖνος
  choice: 'الإبقاء على الإحالة الضميرية: «به» و«ذاك»'
  alternative: التصريح بـ«المسيح» أو «الابن»، أو فهم الضمير على أنه يعود إلى الله الآب
  rationale: السياق القريب يرجّح الابن/المسيح، لكن النص اليوناني لم يسمِّ المرجع صراحةً. لذلك تحفظ الترجمة مقدار الإبهام الموجود في الأصل ولا تحسمه بإضافة لقب.
- issue: الصيغة الانعكاسية المذكرة المفردة ἑαυτὸν
  choice: «نفسه» بعد «كل من»
  alternative: إعادة الصياغة بالجمع أو بتعبير غير محدد النوع
  rationale: «كل من... نفسه» تركيب عربي عام طبيعي، ويحفظ الإفراد والتذكير النحويين في المصدر من غير قصر الدلالة على الرجال.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «ذاك» للمحافظة على الإشارة في ἐκεῖνος، ووُضعت علامتا الحاشية عند العبارتين اللتين تتصل بهما الملاحظتان مباشرة.
