  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: ar
  text: 'مَن يمارس الخطيئة[a] فهو من إبليس[b]، لأن إبليس يخطئ منذ البدء. ولهذا الغرض أُعلِن ابن الله[c]: لكي يُبطل أعمال إبليس[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «مَن يفعل الخطيئة» أو «مَن يرتكب الخطيئة». تدل صيغة اسم الفاعل المضارع في اليونانية هنا على ممارسة مستمرة أو سمة مميِّزة، لا بالضرورة على فعل منفرد.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «فهو لإبليس» أو «فهو من جهة إبليس». تفيد «من» في الأصل اليوناني المصدر أو الانتماء الأخلاقي الروحي، لا تولّدًا وجوديًا حرفيًا.'
    reason: alternative_reading
  - marker: c
    text: 'يمكن أيضًا: «ظهر ابن الله» أو «أُظهِر». تفيد الكلمة اليونانية الظهور والإظهار أو الإعلان.'
    reason: lexical_alternative
  - marker: d
    text: 'يمكن أيضًا: «لكي يفكك أعمال إبليس» أو «يهدمها». معنى الفعل الأصلي «يحلّ» أو «يفكّ»، ومنه الإبطال والتفكيك في هذا السياق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: مَن يمارس الخطيئة
  rationale: اسم الفاعل المضارع يدل في هذا السياق على ممارسة مستمرة أو سمة مميِّزة، و«يمارس الخطيئة» تنقل هذا المعنى بوضوح من غير أن تحوّل العبارة إلى حكم على فعل منفرد.
- source_word: ἐκ τοῦ διαβόλου
  choice: فهو من إبليس
  rationale: تحافظ «من» على صورة المصدر أو المنشأ الأخلاقي الروحي التي تفيدها ἐκ، من غير إيحاء بتولّد وجودي حرفي.
- source_word: ὁ διάβολος
  choice: إبليس
  rationale: اللفظة هنا لقب شخصي معروف، و«إبليس» هي المقابل العربي الطبيعي الواضح، لا المعنى المعجمي العام «المشتكي» أو «المفتري».
- source_word: ἀπ’ ἀρχῆς ... ἁμαρτάνει
  choice: يخطئ منذ البدء
  rationale: المضارع مع «منذ البدء» يصوّر نشاطًا مستمرًا ومميِّزًا؛ والصياغة العربية بالمضارع بعد «منذ» طبيعية وتحفظ الامتداد من الماضي دون تقييد المقصود بالبدء.
- source_word: εἰς τοῦτο
  choice: ولهذا
  rationale: تشير العبارة إلى الغاية الآتية في جملة ἵνα؛ و«ولهذا» صياغة عربية موجزة طبيعية تحمل معنى «لهذه الغاية».
- source_word: ἐφανερώθη
  choice: أُظهِر
  rationale: تحفظ المبني للمجهول ومعنى الظهور والإعلان معًا، بخلاف «ظهر» التي قد تضعف دلالة الإظهار.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ابن الله
  rationale: نقل مباشر ودقيق للقب المسيح الوارد في النص.
- source_word: ἵνα λύσῃ
  choice: لكي ينقض
  rationale: الفعل λύω يعني أصلًا الحلّ أو الفكّ، ويفيد هنا تفكيك أعمال إبليس وإبطالها؛ «ينقض» يحفظ هذه الصورة أفضل من لفظ قد يوحي فقط بالإبادة المادية.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: أعمال إبليس
  rationale: يحفظ الجمع وعلاقة الإضافة، ويظل واسعًا ليشمل أفعال إبليس وآثارها.
theological_decisions:
- issue: قوة صيغة المضارع في الكلام عن الخطيئة
  choice: 'التعبير عن الفعل بوصفه ممارسة مستمرة أو سمة مميِّزة: «يمارس الخطيئة»'
  alternative: فهم العبارة على أنها حكم مطلق بسبب ارتكاب فعل واحد منفرد
  rationale: اسم الفاعل المضارع وسياق الرسالة يرجّحان الفعل المستمر أو المميِّز. تحفظ الصياغة التوتر مع اعتراف الرسالة بأن المؤمنين قد يخطئون، من غير أن تضيف قيدًا تفسيريًا إلى المتن.
- issue: معنى «من إبليس»
  choice: مصدر أو انتماء أخلاقي روحي مع إبقاء استعارة المصدر
  alternative: اشتقاق أو تولّد وجودي حرفي من إبليس
  rationale: ἐκ تصف هنا المصدر أو الاصطفاف في الثنائية الأخلاقية عند يوحنا، ولا تدل على بنوّة وجودية حرفية.
- issue: غاية إظهار ابن الله
  choice: تفكيك أعمال إبليس وإبطالها إبطالًا حاسمًا
  alternative: مجرد كشف أعمال إبليس أو فضحها
  rationale: تركيب ἵνα مع λύσῃ غائي، والفعل يدل في هذا السياق على الحلّ والنقض والإبطال، لا مجرد الكشف.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختيرت «إبليس» لكونها التسمية الشخصية العربية الطبيعية، و«ينقض» للمحافظة قدر الإمكان على صورة الحلّ والتفكيك في الفعل اليوناني. جميع علامات الحواشي واردة في المتن بترتيبها.
