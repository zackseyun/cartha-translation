  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: ar
  text: يا أحبّائي، إن كان قلبنا لا يديننا، فلنا ثقة أمام الله.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «القلب» هنا يشير إلى الذات الباطنة أو الوعي الأخلاقي، وهو قريب في المعنى من «الضمير».
    reason: cultural_note
  - marker: b
    text: 'أو: «فلنا جرأة لدى الله» أو «فلنا اطمئنان أمام الله».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: يا أحبّائي
  rationale: صيغة نداء جمع تعبّر عن المحبة؛ وتحافظ «أحبّائي» على الصلة بألفاظ المحبة في الرسالة، مع أسلوب عربي طبيعي كريم.
- source_word: ἐὰν
  choice: إن كان
  rationale: تنقل أداة الشرط مع صيغة الاحتمال في الأصل، وتلائم الجملة الاسمية العربية مع فعل المضارع.
- source_word: ἡ καρδία
  choice: قلبنا
  rationale: تحافظ على استعارة «القلب» في الأصل، مع كون المراد هنا الذات الباطنة أو الوعي الأخلاقي، من غير اختزالها في «الضمير».
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: لا يديننا
  rationale: ينقل المعنى القضائي والأخلاقي للفعل، أي إصدار حكم ضدنا أو لومنا، ويتسق مع السياق السابق.
- source_word: παρρησίαν
  choice: ثقة
  rationale: تؤدي معنى الانفتاح والجرأة الواثقة في العلاقة بالله، من غير إيحاء بالتحدي أو التهوّر.
- source_word: πρὸς τὸν θεόν
  choice: أمام الله
  rationale: تعبير عربي طبيعي يدل على الوقوف الواثق في حضرة الله وعلاقتنا به.
theological_decisions:
- issue: دلالة القلب بوصفه الجهة الداخلية التي تدين الإنسان
  choice: قلبنا
  alternative: ضميرنا
  rationale: يحفظ الاختيار صورة النص وألفاظ يوحنا، ولا يحصر «القلب» في مفهوم نفسي أضيق، مع توضيح وظيفته الأخلاقية في الحاشية.
- issue: دلالة παρρησία في العلاقة بالله
  choice: ثقة أمام الله
  alternative: جرأة لدى الله
  rationale: تعبر «ثقة» عن الوقوف المنفتح غير الخجلان في حضرة الله، مع إبقاء التوازن بين الاطمئنان والوقار.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم النداء «يا أحبّائي» بصورة طبيعية، وحُفظت استعارة القلب والصبغة القضائية في «يديننا» من غير تفسير زائد داخل المتن.
