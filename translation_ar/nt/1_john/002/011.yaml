  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: ar
  text: أَمَّا مَنْ يُبْغِضُ أَخَاهُ[a] فَهُوَ فِي الظُّلْمَةِ، وَفِي الظُّلْمَةِ يَسْلُكُ، وَلَا يَعْرِفُ إِلَى أَيْنَ يَذْهَبُ، لِأَنَّ الظُّلْمَةَ أَعْمَتْ عَيْنَيْهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أخاه أو أخته»؛ يقول النص اليوناني «أخاه»، ويُرجَّح أن المقصود أخًا أو أختًا في الإيمان ضمن جماعة المؤمنين.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: مَنْ يُبْغِضُ
  rationale: اسم الفاعل المضارع المسبوق بأداة التعريف يفيد الشخص المتصف بهذا الموقف؛ وهذه الصياغة عربية طبيعية وتحفظ دلالة الاستمرار أو السمة.
- source_word: ἀδελφὸν
  choice: أَخَاهُ
  rationale: يحفظ المفرد المذكر الوارد في اليونانية، مع توضيح امتداد المرجع المحتمل إلى المؤمن أو المؤمنة في الحاشية.
- source_word: ἐν τῇ σκοτίᾳ
  choice: فِي الظُّلْمَةِ
  rationale: يحفظ أداة التعريف والتكرار المقصودين، ويبقي صورة الظلمة الأخلاقية والروحية دون تفسيرها داخل المتن.
- source_word: περιπατεῖ
  choice: يَسْلُكُ
  rationale: «يسلك» تعبير عربي كتابي مفهوم يحفظ استعارة المشي بوصفها نمط حياة وتصرف، ولا يسطحها إلى مجرد «يعيش».
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: لَا يَعْرِفُ إِلَى أَيْنَ يَذْهَبُ
  rationale: صياغة عربية واضحة تحفظ صورة الاتجاه والحركة في الفعل اليوناني.
- source_word: ἐτύφλωσεν
  choice: أَعْمَتْ
  rationale: الماضي العربي ينقل الحدث التام في اليونانية، بينما يوضح السياق أن أثر العمى ما زال قائمًا.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: عَيْنَيْهِ
  rationale: يحفظ الصورة الجسدية الملموسة وصيغة المثنى الطبيعية في العربية.
theological_decisions:
- issue: الدلالة الأخلاقية والروحية للظلمة في ثنائية يوحنا
  choice: ترجمة σκοτία حرفيًا بـ«الظلمة»
  alternative: الشر؛ ظلمة الخطية
  rationale: تحفظ الترجمة الصورة الرمزية والتوتر اللاهوتي مع النور من غير حصرها في تفسير عقائدي أضيق.
- issue: مرجع «الأخ»
  choice: إبقاء «أخاه» في المتن
  alternative: أخاه أو أخته؛ أخاه المؤمن
  rationale: الأصل مفرد مذكر، مع احتمال استعماله تمثيليًا لعضو في جماعة المؤمنين؛ تُذكر هذه السعة المرجعية في الحاشية بدل إدخالها تفسيرًا في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يسلك» للمحافظة على الاستعارة اليوحناوية، وحُفظ تكرار «في الظلمة» للتوكيد والبنية البلاغية في الأصل.
