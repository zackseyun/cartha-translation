source:
  edition: SBLGNT
  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: ar
  text: خرجوا من بيننا، لكنهم لم يكونوا منا؛ فلو كانوا منا لبقوا معنا[a]. لكن حدث هذا لكي ينكشف أنهم ليسوا جميعًا منا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لاستمروا معنا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لكي يُكشف عنهم» أو «لكي يظهروا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: من بيننا / منا
  rationale: استُعمل «من بيننا» مع فعل الخروج لتوضيح الانفصال عن الجماعة، ثم «منا» في المواضع اللاحقة للحفاظ على معنى الانتماء من غير حسم طبيعته لاهوتيًا. وهكذا يبقى تكرار العبارة اليونانية ظاهرًا بقدر ما تسمح به العربية الطبيعية.
- source_word: ἐξῆλθαν
  choice: خرجوا
  rationale: ينقل الفعل معنى الخروج المباشر من غير أن يضيف إليه تفسيرًا مثل «ارتدّوا».
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: لم يكونوا منا
  rationale: صياغة موجزة وقريبة من اليونانية، تحفظ لغة الهوية والانتماء ولا توسعها إلى حكم عقائدي صريح.
- source_word: εἰ γὰρ ἐξ ἡμῶν ἦσαν
  choice: فلو كانوا منا
  rationale: '«لو» تلائم الشرط المخالف للواقع في العربية، وتُبقي العبارة العلائقية نفسها: «منا».'
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: لبقوا معنا
  rationale: تنقل النتيجة المخالفة للواقع وتحفظ المعنى الأساسي للفعل μένω، أي البقاء، بصياغة عربية طبيعية.
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: لكن حدث هذا لكي يتضح
  rationale: أُضيف «حدث هذا» لاستكمال الربط المفهوم من السياق، كما في طبقة المراجعة الإنجليزية. و«يتضح» تؤدي معنى الانكشاف أو الظهور بصياغة عربية سلسة، مع إثبات البديل الأقرب إلى المبني للمجهول في الحاشية.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: أنهم ليسوا جميعًا منا
  rationale: 'تحفظ العبارة نطاق النفي في الأصل: ليس الجميع «منا»، ولا تستبدل بلغة الانتماء ألفاظًا تفسيرية مثل «مؤمنين حقًا».'
theological_decisions:
- issue: هل تُفسَّر عبارة «منا» بما يحسم طبيعة العضوية الظاهرة أو الحقيقية في الجماعة؟
  choice: الإبقاء على «منا» بوصفها عبارة علائقية مفتوحة الدلالة.
  alternative: «لم يكونوا مؤمنين حقًا» أو «لم ينتموا حقًا إلى الكنيسة».
  rationale: يميّز النص بين الخروج وبين كون الأشخاص «منا»، لكنه لا يصوغ هذا التمييز بمصطلحات لاهوتية منهجية لاحقة. لذلك تحفظ الترجمة التوتر الموجود في النص ولا تستورد موقفًا طائفيًا.
- issue: هل ἵνα هنا للغاية أم للنتيجة؟
  choice: «لكي» مع إبقاء صياغة الغاية/النتيجة كما هي.
  alternative: «فنتج عن ذلك أن اتضح».
  rationale: تحافظ «لكي» على قوة ἵνα ولا تحسم العلاقة باعتبارها نتيجة محضة، مع أن السياق قد يسمح بفهم النتيجة إلى جانب الغاية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. استُعمل «من بيننا» أولًا لتجنب غموض جهة الخروج، ثم «منا» للمحافظة على العبارة العلائقية المتكررة. وُضعت علامتا الحاشيتين بعد العبارتين اللتين تشرحهما الحاشيتان مباشرة.
