  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: ar
  text: إن كنتم تعلمون أنه بارّ[a]، فأنتم تعلمون[b] أن كل من يعمل البر قد وُلد منه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يعود الضمير في «أنه» و«منه» إلى الله الآب أو إلى الابن؛ فاليونانية لا تعيّن المرجع صراحة.
    reason: alternative_reading
  - marker: b
    text: 'أو: «فاعلموا». تحتمل الصيغة اليونانية هنا أن تكون خبرًا أو أمرًا.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: إن كنتم تعلمون
  rationale: تنقل أداة الشرط مع معنى المعرفة الحاضرة نقلاً طبيعيًا، من غير تحويل الشرط إلى معنى زمني مثل «كلما».
- source_word: δίκαιός
  choice: بارّ
  rationale: «بارّ» تلائم الوصف الأخلاقي واللاهوتي هنا، وتحافظ على الصلة اللفظية والدلالية مع «البر» في بقية الآية.
- source_word: γινώσκετε
  choice: فأنتم تعلمون
  rationale: صيغته اليونانية تحتمل الخبر والأمر؛ اختير الخبر لأنه ينسجم مع توازي عبارتي المعرفة ومع سياق الاستدلال، مع إثبات الاحتمال الآخر في حاشية.
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: كل من يعمل البر
  rationale: اسم الفاعل المضارع يدل على السلوك المتصف بالاستمرار أو الاعتياد، و«يعمل البر» عبارة عربية واضحة تحفظ صورة الفعل في الأصل من غير تعبير اصطلاحي زائد.
- source_word: ἐξ αὐτοῦ γεγέννηται
  choice: قد وُلد منه
  rationale: تحفظ صيغة المبني للمجهول وصورة الولادة، وتعبّر «قد وُلد» عن حدث مكتمل ذي نتيجة باقية كما تفيد صيغة التام اليونانية، بينما تنقل «منه» معنى المصدر.
theological_decisions:
- issue: مرجع الضمير في «أنه بارّ ... منه»
  choice: الإبقاء على الضمير المفرد من غير تسمية مرجعه
  alternative: تعيين المرجع بأنه الله الآب أو الابن
  rationale: لا تسمّي الآية المرجع صراحة، ويسمح السياق بإرجاع الضمير إلى الآب أو إلى الابن؛ لذلك يحفظ النص هذا الاحتمال اللاهوتي بدل حسمه تفسيريًا.
- issue: هل γινώσκετε خبر أم أمر؟
  choice: 'قراءتها خبرًا: «فأنتم تعلمون»'
  alternative: 'قراءتها أمرًا: «فاعلموا»'
  rationale: الصيغة اليونانية واحدة في الخبر والأمر هنا. القراءة الخبرية تحافظ على التوازي مع «إن كنتم تعلمون»، لكن القراءة الأمرية ممكنة، ولذلك ذُكرت في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ووقورة. استُخدم «بارّ/البر» للمحافظة على الترابط اللفظي في الأصل، وأُبقي الضمير مبهم المرجع كما في اليونانية.
