lexical_decisions:
- source_word: ἐν τούτῳ
  choice: وبهذا
  rationale: تعبير طبيعي يحفظ قوة اسم الإشارة ويدل على العلامة أو الدليل الذي به تتحقق المعرفة.
- source_word: γινώσκομεν
  choice: نعرف
  rationale: المضارع يدل على معرفة أو يقين قائمين الآن، و«نعرف» هي الصياغة العربية المباشرة الطبيعية.
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: أننا قد عرفناه
  rationale: «قد» مع الماضي تنقل دلالة صيغة التام اليونانية على معرفة تحققت وبقي أثرها، من غير إضافة تفسير غير صريح إلى المتن.
- source_word: αὐτόν
  choice: ـه في «عرفناه»
  rationale: الإبقاء على الضمير يصون عدم تعيين مرجعه صراحة في اليونانية، فلا يُستبدل به «الله» أو «المسيح».
- source_word: ἐὰν
  choice: إن كنا
  rationale: تنقل الشرط بصياغة عربية فصيحة وطبيعية، مع فعل جماعي يطابق الأصل.
- source_word: ἐντολάς
  choice: وصاياه
  rationale: «وصايا» تحمل الثقل الأخلاقي والعهدي الملائم للاستعمال اليوحناوي، وهي مألوفة وواضحة في العربية الكتابية الحديثة.
- source_word: τηρῶμεν
  choice: نحفظ
  rationale: «نحفظ» تجمع معنى الالتزام والمراعاة الأمينة، وتحافظ على المجال الدلالي للفعل اليوناني بدل اختزاله في مجرد الامتثال.
theological_decisions:
- issue: مرجع الضمير αὐτόν («ـه»)
  choice: الإبقاء على الضمير من غير تعيين المرجع في المتن.
  alternative: التصريح بـ«الله» أو «يسوع/المسيح».
  rationale: الأصل اليوناني يستعمل ضميرًا، وسياق الرسالة يقيم صلة وثيقة بين معرفة الله والعلاقة بالابن؛ لذلك لا ينبغي حسم ما لم يحسمه نص الآية.
- issue: دلالة التام في ἐγνώκαμεν
  choice: «قد عرفناه» مع شرح الدلالة المحتملة في الحاشية.
  alternative: «صرنا نعرفه» أو «قد جئنا إلى معرفته».
  rationale: يحفظ المتن صياغة عربية موجزة قريبة من الأصل، بينما توضّح الحاشية أن التام قد يشير إلى بلوغ المعرفة مع استمرار نتيجتها، دون فرض هذه الدقة التفسيرية وحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «وصايا» و«نحفظ» لما لهما من رسوخ كتابي من غير تقادم، وأُبقي الضمير كما في الأصل لصون الغموض المرجعي المقصود.
