  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: ar
  text: أكتب إليكم[a]، يا أولادي الصغار، لأن[b] قد غُفرت لكم خطاياكم من أجل اسمه[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «إنني أكتب إليكم». يحتمل المضارع اليوناني أن يُفهم مضارعًا بسيطًا أو دالًا على فعل الكتابة الجاري في سياق الرسالة.'
    reason: lexical_alternative
  - marker: b
    text: أو قد تكون الأداة بمعنى «أن»، فتقدّم مضمون ما يكتبه يوحنا، مع أن السياق هنا يرجّح أنها تبيّن سبب الكتابة.
    reason: alternative_reading
  - marker: c
    text: يمكن أن يُفهم مرجع «اسمه» من السياق على أنه الله أو يسوع؛ أما اليونانية هنا فلا تصرّح به.
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: أكتب إليكم
  rationale: المضارع اليوناني يدل هنا على فعل الكتابة الجاري في سياق الرسالة، وصيغة «أكتب إليكم» طبيعية في العربية وتحافظ كذلك على إمكان فهمه مضارعًا بسيطًا.
- source_word: τεκνία
  choice: يا أولادي الصغار
  rationale: اللفظ صيغة تصغير حنونة في النداء، وقد اختيرت عبارة أسرية تحفظ معنى البنوة ونبرة المودة من غير قصر المرجع بالضرورة على صغار السن.
- source_word: ὅτι
  choice: لأن
  rationale: تُفهم الأداة في سياق هذا المقطع على الأرجح تعليلًا للكتابة، مع بقاء إمكان قراءتها على أنها تقدّم مضمون ما يكتبه يوحنا.
- source_word: ἀφέωνται
  choice: قد غُفرت
  rationale: الفعل تام مبني للمجهول، فيدل على غفران تمّ وبقي أثره؛ وتؤدي «قد غُفرت» هذا المعنى بوضوح وإيجاز.
- source_word: αἱ ἁμαρτίαι ... ὑμῖν
  choice: خطاياكم قد غُفرت لكم
  rationale: تجعل الإضافة في «خطاياكم» العلاقة التي تفيدها بنية الغفران مع ضمير المخاطبين واضحة وطبيعية في العربية، بينما تحفظ «لكم» دلالة ὑμῖν.
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: من أجل اسمه
  rationale: تفيد διά مع النصب السبب أو الأساس، وتحافظ «من أجل اسمه» على دلالة الاسم الشخصية والكتابية الأوسع من مجرد السمعة.
- source_word: ὄνομα
  choice: اسم
  rationale: يحفظ «اسم» الدلالة الشخصية واللاهوتية للنص، ولا يختزلها في معنى السمعة.
theological_decisions:
- issue: مرجع الضمير في «اسمه»
  choice: الإبقاء على الضمير من غير تعيين مرجعه في المتن
  alternative: التصريح بأنه الله أو يسوع المسيح
  rationale: لا تسمّي الآية نفسها مرجع الضمير صراحة، ويمكن فهمه من السياق على أنه الله أو يسوع؛ لذلك تُحفظ صياغة النص وما فيها من احتمال بدل حسمها تفسيريًا.
- issue: دلالة ὅτι
  choice: 'تعليل الكتابة: «لأن»'
  alternative: 'بيان مضمون الكتابة: «أن»'
  rationale: نسق الكلام في الآيات المحيطة يرجّح التعليل، لكن الأداة اليونانية تحتمل من حيث الاستعمال أن تقدّم مضمون الكتابة، ولذلك ذُكر البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم النداء «يا أولادي الصغار» للمحافظة على الحنان الأسري في τεκνία، واستُبقي الضمير في «اسمه» تجنبًا لحسم ما تركه النص غير مصرّح به.
