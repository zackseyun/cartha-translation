  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: ar
  text: مَن يقول إنه في النور، وهو يبغض أخاه، فهو في الظلمة إلى الآن.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أخاه أو أخته». في اليونانية وردت كلمة «أخ» بالمفرد المذكر، وقد تُستعمل هنا استعمالًا تمثيليًا يشمل الذكر والأنثى في هذا السياق الأخلاقي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: مَن يقول
  rationale: أداة التعريف مع اسم الفاعل تؤدي معنى اسميًا عامًا يشير إلى شخص ممثِّل؛ و«مَن يقول» صياغة عربية طبيعية تحفظ هذا العموم.
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: إنه في النور
  rationale: بعد فعل القول تقتضي العربية تركيب «إنه»، مع إبقاء صورة الوجود «في النور» بوصفها مجالًا روحيًا وأخلاقيًا.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: أخاه
  rationale: يحفظ المفرد المذكر في اليونانية وصيغة العلاقة من غير أن يفسرها في المتن تفسيرًا أضيق مثل «أخاه في الإيمان».
- source_word: μισῶν
  choice: وهو يبغض
  rationale: اسم الفاعل المضارع يدل على موقف مستمر أو سمة قائمة؛ والجملة الحالية «وهو يبغض» تحفظ تزامنه وتناقضه مع الادعاء السابق.
- source_word: ἐν τῇ σκοτίᾳ
  choice: في الظلمة
  rationale: تحفظ المقابلة اليوحناوية المباشرة بين «النور» و«الظلمة».
- source_word: ἕως ἄρτι
  choice: إلى الآن
  rationale: ترجمة مباشرة وطبيعية للتعبير الزمني، وتفيد استمرار الحالة حتى الوقت الحاضر.
theological_decisions:
- issue: دلالة ἀδελφός في قول أخلاقي تمثيلي مفرد
  choice: أخاه
  alternative: أخاه أو أخته؛ أو أخاه في الإيمان
  rationale: «أخاه» يحفظ الصيغة اليونانية المذكرة المفردة ولا يفرض في المتن تحديدًا تفسيريًا لنطاق العلاقة. وتوضح الحاشية إمكان الاستعمال التمثيلي الشامل.
- issue: العلاقة بين ادعاء الوجود في النور وبغض الأخ
  choice: وهو يبغض أخاه
  alternative: ويبغض أخاه
  rationale: إضافة ضمير الفصل الحالي «وهو» تبرز التناقض المتزامن في اليونانية من غير أن تحسم مسائل أوسع عن طبيعة ادعاء الشخص أو حالته الروحية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يبغض» بدل «يكره» للمحافظة على قوة μισέω وعلى النبرة الكتابية من غير غموض، مع بناء عربي طبيعي يبرز التعارض بين القول والسلوك.
