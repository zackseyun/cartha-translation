  source_fidelity: 'المعنى العام أمين للنص اليوناني: الأمر بالثبات، والإعلان/الظهور الآتي، والثقة، والخزي عند المجيء كلها منقولة. لكن «تكون لنا ثقة» بعد «حتى إذا» أضعف في العربية من صيغة الغاية الصريحة، وقد يوهم بأن الثقة ستنشأ حينئذ لا أنها تكون حاصلة عند الظهور. كما أن «ولا نتراجع عنه خجلًا» تركيب ممكن، لكنه أقل سلاسة وأقل دقة في تصوير الخزي المرتبط به من «ولا نرتدَّ عنه خجلين».'
  naturalness: '«يا أولادي الصغار» مفهومة، لكنها ثقيلة قليلًا في النداء العربي المعاصر؛ «يا أطفالي» تؤدي التصغير والمودة بصياغة أفصح وأسلس في هذا السياق الرعوي. وينبغي وصل الغاية بالفعل: «لكي تكون لنا ثقة».'
  terminology: «اثبتوا فيه» يحفظ الاستعمال اليوحناوي على نحو جيد، و«مجيئه» مناسب لـ παρουσία في السياق الأخروي. «يُعلَن» يحافظ على المبني للمجهول، مع أن «يُظهَر» أقل ملاءمة هنا لأنه قد يُفهم متعديًا في العربية؛ تكفي الإشارة في الحاشية إلى «حين يظهر».
