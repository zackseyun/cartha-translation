  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: ar
  text: والآن، يا أطفالي، اثبتوا فيه، لكي تكون لنا ثقة إذا أُعلِن[a]، ولا نرتدَّ عنه خجلين[b] عند مجيئه[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حين يظهر». الفعل اليوناني مبني للمجهول، ومعناه حرفيًا: «يُعلَن» أو «يُجعَل ظاهرًا».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ولا نخجل أمامه». يمكن أن تُفهم العبارة على أنها خجل في حضرته، لا ارتداد وابتعاد عنه بالضرورة.'
    reason: alternative_reading
  - marker: c
    text: 'أو: «عند حضوره». تحمل الكلمة اليونانية هنا دلالة أخروية، ولذلك تُرجمت «مجيئه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: يا أولادي الصغار
  rationale: نداء رعوي حميم بصيغة التصغير. تحافظ العبارة على صورة البنوة وعلى المودة، مع بقاء العربية واضحة وطبيعية.
- source_word: μένετε
  choice: اثبتوا
  rationale: فعل يوحنا المحوري هنا يدل على الاستمرار والثبات في علاقة قائمة. «اثبتوا» عربية واضحة وتحفظ قوة الأمر والاستمرارية أفضل من تعبير تفسيري مطوّل.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: ترجمة مباشرة تحفظ الاستعارة العلائقية في النص من غير تفسيرها مسبقًا بعبارة مثل «متحدين به».
- source_word: φανερωθῇ
  choice: أُعلِن
  rationale: تحفظ الصيغة المبنية للمجهول في اليونانية وتشير إلى انكشافه وظهوره علنًا. وُضعت «يظهر» بوصفها صياغة عربية أكثر مألوفية في الحاشية.
- source_word: σχῶμεν παρρησίαν
  choice: تكون لنا ثقة
  rationale: تنقل معنى الجرأة الواثقة وحرية المثول دون أن توحي بالمواجهة أو الوقاحة. وهي صياغة طبيعية في سياق الوقوف أمامه عند مجيئه.
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: نتراجع عنه خجلًا
  rationale: تجمع بين الخجل ودلالة الابتعاد المحتملة في حرف الجر ἀπό. أما الفهم الأبسط «نخجل أمامه» فمحفوظ في الحاشية كي لا يُحسم التركيب المختلف في تفسيره.
- source_word: παρουσίᾳ
  choice: مجيئه
  rationale: في هذا السياق الأخروي تدل الكلمة على مجيء المسيح المنتظر. «مجيئه» أوضح للقارئ العربي، مع حفظ المعنى الأكثر حرفية «حضوره» في الحاشية.
theological_decisions:
- issue: مرجع الضمائر وطبيعة الإعلان الأخروي
  choice: تُركت الضمائر كما في اليونانية، ويفهم السياق أنها تعود إلى الابن/يسوع المسيح وأن الكلام عن إعلانه ومجيئه في المستقبل.
  alternative: أن يكون المرجع هو الله بوجه عام من غير تعيين الابن.
  rationale: السياق القريب يتناول الثبات في الابن وظهوره. لا تضيف الترجمة اسم «المسيح» إلى متن الآية، فتحفظ طريقة النص في الإحالة، بينما تنقل παρουσία بـ«مجيئه» وفق دلالتها الأخروية في السياق.
- issue: دلالة الخجل عند المجيء
  choice: صُوِّر الاحتمال بوصفه تراجعًا عنه بدافع الخجل، من غير التصريح بأنه إدانة نهائية.
  alternative: أن يكون المعنى فقط «نخجل أمامه» دون إيحاء بالابتعاد.
  rationale: اقتران فعل الخجل بحرف الجر ἀπό يتيح معنى الانكفاء أو الابتعاد عنه، لكنه لا يوجب فهمًا قضائيًا محددًا. لذلك ذُكر الوجه الآخر في الحاشية.
- issue: القيمة الشرطية لعبارة ἐὰν φανερωθῇ
  choice: «إذا أُعلِن»
  alternative: «حين يظهر»
  rationale: تحفظ «إذا» البنية الشرطية اليونانية ولا تجعلها تشكيكًا صريحًا في وقوع المجيء؛ فالشرط يتعلق بوقت الإعلان وموقف المؤمنين عنده.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «اثبتوا فيه» للمحافظة على التعبير اليوحناوي الموجز، و«يا أولادي الصغار» لإبقاء النبرة الأبوية والتصغير. وُزعت علامات الحواشي على الألفاظ التي تشرحها مباشرة.
