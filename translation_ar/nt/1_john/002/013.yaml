source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: ar
  text: أكتب إليكم يا آباء، لأنكم قد عرفتم الذي هو منذ البدء[a]. أكتب إليكم يا شبّان، لأنكم قد غلبتم الشرير.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الذي منذ البدء». يُرجَّح أن العبارة تشير إلى الابن، مع أن بعضهم يفهمها على نحو أوسع بوصفها إشارة إلى الله.
    reason: alternative_reading
lexical_decisions:
- source_word: γράφω
  choice: أكتب
  rationale: مضارع خبري يلائم أسلوب الرسائل، وتؤديه العربية طبيعيًا بالمضارع البسيط مع الحفاظ على مباشرة الخطاب.
- source_word: πατέρες
  choice: يا آباء
  rationale: يحفظ اللفظ الحرفي للمنادى الجمع، من غير حصره تفسيرًا في الآباء الجسديين أو استبداله بعبارة «كبار السن».
- source_word: ἐγνώκατε
  choice: قد عرفتم
  rationale: '«قد» مع الماضي تنقل معنى الفعل التام: معرفة تحققت وما زال أثرها قائمًا، من غير إضافة معنى التطور الصريح.'
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: الذي هو منذ البدء
  rationale: يحفظ التركيب الاسمي والإشارة الشخصية، مع إبقاء المرجع غير مصرّح باسمه كما في اليونانية.
- source_word: νεανίσκοι
  choice: يا شبّان
  rationale: ينقل الاسم المذكر الجمع بعبارة عربية واضحة وطبيعية.
- source_word: νενικήκατε
  choice: قد غلبتم
  rationale: ينقل الفعل التام بوصفه غلبة تحققت ولها نتيجة مستمرة، ويحافظ على الصدى اليوحناوي لفعل الغلبة.
- source_word: τὸν πονηρόν
  choice: الشرير
  rationale: أداة التعريف مع الصفة المذكرة المستعملة اسمًا ترجّح خصمًا شريرًا شخصيًا لا الشر المجرد، من غير إضافة اسم «الشيطان» إلى النص.
theological_decisions:
- issue: مرجع «الذي هو منذ البدء»
  choice: الإبقاء على العبارة من غير تسمية المرجع في المتن
  alternative: التصريح بأنه الابن/المسيح، أو فهمها إشارة أوسع إلى الله
  rationale: السياق اليوحناوي يرجّح الإشارة إلى الابن، لكن اليونانية لا تسمّيه هنا؛ لذلك تحافظ الصياغة على الغموض المقصود والتوتر اللاهوتي.
- issue: دلالة «الشرير»
  choice: خصم شرير شخصي
  alternative: الشر بوصفه مفهومًا مجردًا
  rationale: الصيغة اليونانية المذكرة المفردة المعرّفة ترجّح مرجعًا شخصيًا، مع تجنب إدخال اسم علم غير موجود في النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم النداء «يا آباء» و«يا شبّان» لطبيعية العربية، وحُفظ التوازي بين شطري الآية، كما حُفظت دلالة الفعلين التامين باستعمال «قد» مع الماضي.
