  text: καὶ ὑμεῖς χρῖσμα ἔχετε ἀπὸ τοῦ ἁγίου ⸀καὶ οἴδατε ⸀πάντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: ar
  text: أَمَّا أَنْتُمْ فَلَكُمْ مَسْحَةٌ مِنَ الْقُدُّوسِ، وَكُلُّكُمْ تَعْرِفُونَ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وفي قراءة نصية أخرى: «وتعرفون كلَّ شيء». أمّا قراءة SBLGNT فتؤيد: «وكلكم تعرفون».'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: أَمَّا
  rationale: تفيد καί هنا المقابلة مع المذكورين في الآية السابقة؛ وصيغة «أمّا أنتم» تُظهر هذا الانتقال التقابلي بوضوح وطبيعية في العربية.
- source_word: ὑμεῖς
  choice: أَنْتُمْ
  rationale: الضمير مصرح به للتوكيد والمقابلة، ولذلك أُبقي ظاهرًا في العربية ضمن «أمّا أنتم».
- source_word: χρῖσμα
  choice: مَسْحَةٌ
  rationale: تحفظ «مسحة» صورة المسح ودلالتها اللاهوتية، من غير تفسيرها صراحة بأنها الروح القدس أو أثره.
- source_word: ἔχετε
  choice: فَلَكُمْ
  rationale: تؤدي معنى الامتلاك في تركيب عربي طبيعي، مع إبراز أن المسحة ممنوحة لهم.
- source_word: ἀπὸ τοῦ ἁγίου
  choice: مِنَ الْقُدُّوسِ
  rationale: تنقل اللقب كما هو من غير تعيين ما إذا كان المقصود الآب أم الابن.
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف مباشر يصل بين امتلاك المسحة والمعرفة.
- source_word: οἴδατε
  choice: تَعْرِفُونَ
  rationale: ترجمة عربية واضحة ومباشرة لفعل المعرفة في هذا السياق.
- source_word: πάντες
  choice: كُلُّكُمْ
  rationale: 'وفق نص SBLGNT، اللفظة مرفوعة وتشير إلى جميع المخاطَبين: «كلكم تعرفون»، لا إلى مفعول به بمعنى «تعرفون كل شيء».'
theological_decisions:
- issue: مرجع لقب «القدوس»
  choice: الإبقاء على «القدوس» من غير تحديد المرجع
  alternative: الآب، أو الابن/يسوع المسيح
  rationale: لا يحدد النص المرجع صراحة، ويمكن أن يُفهم اللقب في السياق اليوحناوي على أكثر من وجه؛ فالإبقاء عليه يحفظ الغموض الأصيل.
- issue: دلالة χρῖσμα
  choice: «مسحة» مع إبقاء الاستعارة
  alternative: الروح القدس، أو مسحة الروح، أو عطية المسحة
  rationale: قد تشير المسحة إلى الروح القدس أو عمله، لكن النص يستعمل لفظًا استعاريًا؛ لذلك لا ينبغي حسم تفسيره داخل الترجمة.
- issue: قراءة πάντες النصية
  choice: «كلكم تعرفون»
  alternative: «تعرفون كل شيء»
  rationale: قراءة SBLGNT πάντες اسمية مرفوعة، فتصف جميع المخاطَبين، بينما تنشأ القراءة البديلة من شاهد نصي آخر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «أمّا أنتم» لإبراز المقابلة، وحُفظت عبارتا «مسحة» و«القدوس» من غير توسع تفسيري. وُضع مؤشر الحاشية بعد الجملة التي تتعلق بها القراءة النصية.
