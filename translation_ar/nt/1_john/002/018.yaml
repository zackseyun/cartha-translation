  verdict: revise
  source_fidelity: 'المعنى العام أمين للنص اليوناني: النداء الرعوي، «الساعة الأخيرة»، المقابلة بين المفرد المتوقع والجمع الحاضر، والاستدلال الختامي كلها محفوظة. لكن «فقد ظهر الآن» قد توحي بأن الظهور وقع لتوّه، كما أن الفاء أقوى استنتاجًا من καὶ («و/وحتى الآن»). تُستبدل بصياغة تُبقي الربط والإطار الزمني الحاضر بوضوح.'
