  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: ar
  text: يا أولادي، إنها الساعة الأخيرة. وكما سمعتم أن ضدَّ المسيح آتٍ[a]، والآن قد ظهر أضدادُ المسيح كثيرون[b]. ومن هذا نعرف أنها الساعة الأخيرة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: الاسم اليوناني «ضدّ المسيح» غير مسبوق بأداة التعريف. ويمكن أن يُفهم في السياق على أنه لقب أو شخصية منتظرة سبق أن سمع بها القراء، من غير أن يحسم النص هنا مدى تحديده.
    reason: alternative_reading
  - marker: b
    text: أو «برزوا» أو «نشأوا». يدل الفعل اليوناني بصيغة التام على أن أضدادًا كثيرين ظهروا ولا يزالون حاضرين الآن.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: يا أولادي
  rationale: نداء رعوي أُسَري. «يا أولادي» طبيعي في العربية المعاصرة ويحفظ نبرة المودة من غير أن يفترض أن المخاطَبين أطفال صغار حرفيًا.
- source_word: ἐσχάτη ὥρα
  choice: الساعة الأخيرة
  rationale: يحفظ الصورة الزمنية والأفق الأخروي في اليونانية من غير تحويلها إلى مدة حرفية محددة أو إلى صياغة تفسيرية.
- source_word: καθὼς ἠκούσατε
  choice: وكما سمعتم
  rationale: ينقل المقارنة والإحالة إلى التعليم السابق بعبارة عربية واضحة ومباشرة.
- source_word: ἀντίχριστος
  choice: ضدَّ المسيح
  rationale: يحفظ الصلة اللفظية بالمسيح ومعنى المعارضة أو الحلول محلّه المحتمل في السابقة ἀντί، ويتجنب التعبير المحمّل بتقاليد دينية لاحقة «المسيح الدجال».
- source_word: ἔρχεται
  choice: آتٍ
  rationale: 'ينقل الحاضر ذا الدلالة الاستقبالية بإيجاز طبيعي: الشخص المتوقع في طريقه إلى المجيء.'
- source_word: καὶ νῦν
  choice: فقد ظهر الآن
  rationale: يجعل الانتقال من المجيء المتوقع إلى الواقع الحاضر واضحًا، مع بقاء «الآن» بارزًا في الجملة.
- source_word: ἀντίχριστοι πολλοὶ
  choice: أضدادٌ كثيرون للمسيح
  rationale: يحفظ الجمع والتوازي المعجمي مع المفرد السابق، من غير تفسير هؤلاء الأشخاص تفسيرًا مذهبيًا إضافيًا.
- source_word: γεγόνασιν
  choice: ظهر
  rationale: الفعل التام يدل على أنهم برزوا إلى الوجود وهم حاضرون الآن؛ و«ظهر» عربية طبيعية تؤدي هذا المعنى، مع بيان البدائل في الحاشية.
- source_word: ὅθεν γινώσκομεν
  choice: ومن هذا نعرف
  rationale: يحفظ الاستدلال الصريح من ظهور الأضداد الكثيرين إلى معرفة أن الساعة الأخيرة حاضرة.
theological_decisions:
- issue: دلالة «الساعة الأخيرة»
  choice: الإبقاء على الصورة الأخروية «الساعة الأخيرة» من غير تحديد مدتها
  alternative: تفسيرها بأنها لحظة زمنية وشيكة حرفيًا، أو مجرد وصف بلاغي لأزمة
  rationale: النص يعلن بلوغ مرحلة حاسمة أخيرة، لكنه لا يحدد هنا مدة هذه «الساعة» ولا يقدّم جدولًا زمنيًا؛ لذلك ينبغي حفظ التوتر الأخروي.
- issue: العلاقة بين «ضد المسيح» المفرد و«أضداد المسيح» الجمع
  choice: الإبقاء على المفرد المتوقع والجمع الحاضر معًا
  alternative: جعل المفرد مجرد فئة عامة، أو التصريح بأنه فرد أخروي محدد تمامًا
  rationale: يقابل يوحنا عمدًا ما سمعه القراء عن الآتي بظهور أضداد كثيرين الآن، ولا ينبغي للترجمة أن تحسم هوية المفرد أو تنظّم العلاقة بينهما ضمن تصور مذهبي.
- issue: تعريف ἀντίχριστος المفرد
  choice: صياغة «ضد المسيح» مع التنبيه إلى غياب أداة التعريف في اليونانية
  alternative: «ضدٌّ للمسيح» بوصفه نكرة، أو صياغة تجعل اللقب لشخص معروف محددًا صراحة
  rationale: الاسم اليوناني غير مسبوق بأداة تعريف، لكن السياق يشير إلى شخصية أو تسمية سبق أن سمع بها القراء. التركيب العربي يظل قريبًا من اللفظ ولا يبالغ في حسم درجة التعريف.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رعوية وقورة. استُعملت «يا أولادي» للخطاب الأُسَري، و«ضد المسيح/أضداد للمسيح» للمحافظة على الرابط المعجمي في الأصل وتجنب المصطلحات ذات الحمولة الدينية اللاحقة. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسرهما الحاشيتان.
