  terminology: «ضدّ المسيح / أضداد المسيح» يحافظ على الرابط المعجمي بين ἀντίχριστος المفرد والجمع، ويتجنب تحميل النص تعريفًا مذهبيًا لاحقًا. والأفضل توحيد الصيغة الإضافية في الجمع بدل «أضدادٌ ... للمسيح». ينبغي أن تصون الحاشية (أ) إمكان فهم المفرد كلقب أو شخصية منتظرة دون تقرير ذلك.
  issues:
