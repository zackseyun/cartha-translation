reference: 1 John 2:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: ar
  text: يا أولادي الصغار، أكتب إليكم هذه الأمور لكيلا تخطئوا. ولكن إن أخطأ أحد، فلنا شفيع[a] لدى الآب، هو يسوع المسيح[b] البارّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يُفهم اللفظ اليوناني παράκλητος أيضًا بمعنى أوسع، مثل «المعين» أو «الناصر» أو «المعزّي».
    reason: lexical_alternative
  - marker: b
    text: اللفظ اليوناني Χριστός لقب معناه «المسيح»، وقد يُستعمل أيضًا استعمالًا قريبًا من اسم العَلَم.
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: يا أولادي الصغار
  rationale: تحافظ العبارة على صورة البنوة وعلى نبرة التصغير الحنونة في Τεκνία، مع صياغة عربية واضحة ومباشرة.
- source_word: ταῦτα γράφω ὑμῖν
  choice: أكتب إليكم هذا
  rationale: ينقل المضارع γράφω بصيغة عربية طبيعية، ويُبقي إحالة ταῦτα عامة من غير تحديد زائد.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: لكيلا تخطئوا
  rationale: تؤدي غرض الكتابة الذي تعبّر عنه ἵνα مع صيغة الاحتمال، من غير أن تضيف دعوى عقائدية عن بلوغ العصمة من الخطية.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: ولكن إن أخطأ أحد
  rationale: تُفهم καὶ هنا على نحو استدراكي في السياق؛ وتحافظ صيغة الشرط على احتمال وقوع الخطية وعلى التوتر مع الغرض السابق.
- source_word: παράκλητον
  choice: شفيع
  rationale: «شفيع» لفظ عربي طبيعي يدل هنا على من يقوم بالمؤازرة والتمثيل لدى الآب، مع إبقاء الاتساع الدلالي للفظ اليوناني في الحاشية.
- source_word: πρὸς τὸν πατέρα
  choice: لدى الآب
  rationale: تنقل معنى الحضور والتوجّه العلاقي نحو الآب، ولا تحصر العبارة في دلالة مكانية محضة.
- source_word: Ἰησοῦν Χριστὸν
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، وتبقى العبارة مألوفة وواضحة من غير تحويل اللقب إلى اسم شخصي مبهم.
- source_word: δίκαιον
  choice: البارّ
  rationale: الصفة العربية توافق يسوع المسيح وتؤدي معنى δίκαιον بوضوح، مع إبراز وصفه المميّز في هذا السياق.
theological_decisions:
- issue: مدى دلالة παράκλητος
  choice: شفيع
  alternative: معين أو نصير أو مدافع
  rationale: السياق، ولا سيما عبارة «لدى الآب»، يرجّح معنى المؤازرة والتمثيل، لكن اللفظ اليوناني أوسع من مصطلح قانوني ضيق؛ لذلك حُفظت البدائل في الحاشية.
- issue: دلالة Χριστός كلقب مسياني
  choice: المسيح
  alternative: استعمال اللفظ كأنه اسم عَلَم، أي «كريستوس/Christ» في بعض اللغات
  rationale: يحافظ المقابل العربي «المسيح» على دلالة اللقب، وهو كذلك الصيغة العربية الطبيعية الراسخة.
- issue: احتمال فهم ἵνα μὴ ἁμάρτητε على أنه تقرير للعصمة من الخطية
  choice: 'صياغته بوصفه غرضًا: «لكيلا تخطئوا»'
  alternative: صياغة توحي بأن المخاطَبين لن يخطئوا مطلقًا
  rationale: النص يعلن غرض الكاتب، ثم يحفظ احتمال وقوع الخطية في جملة الشرط التالية؛ فبقي هذا التوتر من غير حسم عقائدي زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة رعوية كريمة. استُعمل «يا أولادي الصغار» لإظهار الحنان في النداء، و«شفيع لدى الآب» لصياغة طبيعية تحافظ على البعد التمثيلي من غير تضييق المعنى على صورة قانونية بحتة. وُضعت علامتا الحاشيتين عند اللفظين اللذين تفسّرهما الحاشيتان.
