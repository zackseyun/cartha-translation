base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: ar
  text: كلُّ مَن يُنكر الابن فليس له الآب أيضًا؛ ومَن يعترف بالابن له الآب أيضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'بعض المخطوطات تحذف: «ومَن يعترف بالابن له الآب أيضًا».'
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: كلُّ مَن يُنكر
  rationale: ينقل التركيب الوصفي العام ودلالته الشاملة بصياغة عربية طبيعية، مع إبقاء الفعل في المضارع للدلالة العامة المستمرة.
- source_word: ἀρνούμενος
  choice: يُنكر
  rationale: «يُنكر» هو المقابل المباشر الملائم للسياق الاعترافي، ولا يضيف معنى أوسع مثل الرفض أو معنى اجتماعيًا مثل التنكر لشخص.
- source_word: τὸν υἱὸν
  choice: الابن
  rationale: يحافظ على اللقب المسيحاني المعرّف كما ورد، من غير توسيعه إلى «ابن الله» رغم صحة ذلك سياقيًا.
- source_word: οὐδὲ
  choice: لا ... أيضًا
  rationale: 'تنقل امتداد النفي من الابن إلى الآب في عربية واضحة: من ينكر الابن لا يكون له الآب أيضًا.'
- source_word: τὸν πατέρα ἔχει
  choice: يكون له الآب
  rationale: يحافظ على التعبير اليوحناوي ودلالته العلائقية الواسعة من غير حصره في تفسير مثل الشركة أو الانتماء؛ واستُخدم «يكون له» لأنه أفصح طبيعيًا بالعربية من «يملك الآب».
- source_word: ὁ ὁμολογῶν
  choice: مَن يعترف
  rationale: صياغة عربية طبيعية للفاعل العام، وتحفظ معنى الإقرار الصريح الذي يحمله الفعل في هذا السياق.
- source_word: καὶ
  choice: أيضًا
  rationale: 'تبرز المقابلة المتوازنة مع οὐδὲ في الشطر الأول: مَن يعترف بالابن يكون له الآب أيضًا.'
theological_decisions:
- issue: وجود الشطر الثاني بين علامتي التنوع النصي في النص اليوناني المطبوع
  choice: 'إدراجه في المتن: «ومَن يعترف بالابن يكون له الآب أيضًا»'
  alternative: حذف الشطر الثاني لغيابه من بعض المخطوطات
  rationale: النص المزوَّد يثبت الشطر الثاني، وإن كان يشير إلى اختلاف نصي؛ لذلك أُدرج في المتن ووُثّق غيابه من بعض المخطوطات في الحاشية.
- issue: الدلالة العلائقية لعبارة τὸν πατέρα ἔχει
  choice: الإبقاء على التعبير «يكون له الآب» من غير شرح تفسيري
  alternative: «تكون له شركة مع الآب» أو «ينتمي إلى الآب»
  rationale: تحافظ الصياغة على قوة العبارة اليوحناوية وعلى التلازم اللاهوتي بين الاعتراف بالابن وكون الآب للإنسان، من غير اختزالها في فئة علائقية واحدة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت المقابلة المتوازنة «كل من ينكر... ومن يعترف...» وحُفظت الألقاب «الابن» و«الآب» بلا توسع تفسيري.
