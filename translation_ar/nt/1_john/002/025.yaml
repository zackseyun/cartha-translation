    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία / ἐπηγγείλατο
  choice: الوعد / وعدنا
  rationale: يحافظ اختيار اللفظين من الجذر العربي نفسه على الصلة الاشتقاقية المقصودة بين الاسم والفعل في اليونانية، بصياغة عربية واضحة وطبيعية.
- source_word: αὐτός
  choice: هو نفسه
  rationale: الضمير في اليونانية مؤكد، ولذلك تُحفظ نبرة التوكيد بعبارة «هو نفسه» بدل الاكتفاء بضمير مستتر أو بلفظ «هو» وحده.
- source_word: ἡμῖν
  choice: نا في «وعدنا به»
  rationale: 'يُعبَّر عن المفعول غير المباشر في العربية بضمير المتكلمين المتصل بالفعل، وتأتي الباء مع الاسم الموصول على نحو طبيعي: «وعدنا به».'
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: الحياة الأبدية
  rationale: العبارة بدل يبيّن مضمون الوعد، والتعريف في «الحياة الأبدية» يعكس أداتي التعريف في اليونانية ويلائم الاستعمال العربي المألوف.
- source_word: καὶ αὕτη ἐστίν
  choice: وهذا هو
  rationale: صياغة مباشرة تحفظ أداة الربط والإشارة وتقدّم تعريف الوعد من غير إضافة تفسيرية.
theological_decisions:
- issue: مرجع الضمير المؤكد αὐτός
  choice: الإبقاء على «هو نفسه» من غير تسمية المرجع
  alternative: تعيينه بالآب أو بالابن
  rationale: الآية لا تعيد التصريح بمرجع الضمير، وقد يُفهم في السياق على الآب أو الابن؛ لذلك لا تحسم الترجمة ما تركه النص غير مصرّح به.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. رُتبت عبارة «الذي هو نفسه وعدنا به» لإبراز توكيد الضمير مع بقاء الصياغة مفهومة، واستُخدمت النقطتان لإظهار أن «الحياة الأبدية» هي مضمون الوعد.
