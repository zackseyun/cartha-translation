id: 1JN.2.16
reference: 1 John 2:16
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: ar
  text: لأن كل ما في العالم—شهوة الجسد[a]، وشهوة العيون، وتفاخر المعيشة[b]—ليس من الآب، بل هو من العالم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «رغبة الجسد». تدل الكلمة اليونانية على رغبة قوية أو اشتهاء، ولا ينحصر معناها هنا في الشهوة الجنسية. ويمكن أن يُفهم «الجسد» في هذا السياق إشارةً إلى الطبيعة البشرية المائلة إلى الخطية.
    reason: lexical_alternative
  - marker: b
    text: أو «كبرياء الحياة» أو «غرور المعيشة». قد تشمل العبارة التباهي بالمكانة أو الممتلكات أو أسلوب العيش.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تفيد الأداة التعليل، إذ تبيّن أساس الوصية السابقة بألا يحب المؤمنون العالم.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: كل ما في العالم
  rationale: ينقل التركيب المحايد الجامع بصياغة عربية طبيعية وموجزة.
- source_word: κόσμῳ / κόσμου
  choice: العالم
  rationale: يحافظ على اللفظ اليوحناوي وعلى اتساع دلالته دون إدخال تفسير مثل «نظام العالم» في صلب النص.
- source_word: ἐπιθυμία
  choice: شهوة
  rationale: تدل في هذا السياق السلبي على رغبة قوية، ولا تقتصر في العربية بالضرورة على الرغبة الجنسية.
- source_word: τῆς σαρκὸς
  choice: الجسد
  rationale: يحفظ الصورة الأصلية والتوتر الدلالي في σάρξ دون حسمها بتفسير لاهوتي مثل «الطبيعة الخاطئة».
- source_word: τῶν ὀφθαλμῶν
  choice: العيون
  rationale: ترجمة مباشرة تحفظ صيغة الجمع والتوازي البلاغي.
- source_word: ἀλαζονεία τοῦ βίου
  choice: تفاخر المعيشة
  rationale: «تفاخر» ينقل الغرور المتباهي والادعاء، و«المعيشة» تعكس βίος بوصفه وسائل العيش ومظاهره وممتلكاته، مع بقاء مجال العبارة واسعًا.
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός
  choice: ليس من الآب
  rationale: يحفظ معنى المصدر أو المنشأ والتعبير العلاقي «الآب».
- source_word: ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: بل هو من العالم
  rationale: 'يحافظ على المقابلة المتوازية بين المصدرين: الآب والعالم.'
theological_decisions:
- issue: دلالة σάρξ في قائمة ذات طابع أخلاقي
  choice: الجسد
  alternative: الطبيعة الخاطئة
  rationale: الترجمة الحرفية مفهومة وتحفظ الغموض المقصود، بينما البديل يحسم العبارة ضمن تصور أنثروبولوجي بعينه.
- issue: دلالة κόσμος
  choice: العالم
  alternative: نظام العالم الساقط
  rationale: يبقي اللفظ واسعًا كما في اليونانية، ويترك للسياق بيان أنه العالم من حيث معارضته للآب.
- issue: دلالة ἀλαζονεία τοῦ βίου
  choice: تفاخر المعيشة
  alternative: كبرياء الحياة
  rationale: الاختيار يبرز الادعاء المتباهي المرتبط بأحوال العيش أو موارده، فيما البديل أكثر حرفية لكنه قد يكون غامضًا أو يوحي بالكبرياء بالحياة ذاتها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التوازي الثلاثي في العبارة، واستُعملت مصطلحات كتابية مألوفة من غير إدخال توسعات تفسيرية في المتن.
