base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: ar
  text: مَن يحب أخاه يثبت في النور، وليس فيه ما يسبّب العثرة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا يوجد له ما يعثره». يمكن أن تُفهم العبارة اليونانية إما على أنها تصف ما ليس موجودًا فيه، وإما ما لا يواجهه فيكون سبب عثرة له.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: مَن يحب
  rationale: اسم الفاعل المضارع المعرّف مستعمل استعمالًا اسميًا عامًا؛ و«مَن يحب» تنقل المعنى المستمر العام بلغة عربية طبيعية.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: أخاه
  rationale: يحافظ على المفرد المذكر في الأصل وعلى صورة الأخوّة، من غير توسيع تفسيري إلى «المؤمن الآخر».
- source_word: ἐν τῷ φωτὶ
  choice: في النور
  rationale: يحفظ الصورة المجازية اليوحناوية بصياغة عربية مألوفة وواضحة.
- source_word: μένει
  choice: يثبت
  rationale: ينقل الدلالة الاستمرارية والعلائقية للفعل μένω، وهو فعل محوري في كتابات يوحنا، بصياغة عربية رصينة.
- source_word: σκάνδαλον
  choice: ما يسبّب العثرة
  rationale: ينقل معنى سبب التعثر أو الوقوع مع الحفاظ على الاستعارة، ويتجنب حصر اللفظ في عائق مادي.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: الترجمة المباشرة للضمير وحرف الجر، ويرجع الضمير طبيعيًا إلى مَن يحب، مع إبقاء وجه آخر محتمل في الحاشية.
- source_word: οὐκ ἔστιν
  choice: ليس
  rationale: صياغة وجودية عربية طبيعية ضمن العبارة «ليس فيه».
theological_decisions:
- issue: دلالة العبارة καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν ومرجعها
  choice: ليس في مَن يحب أخاه ما يسبّب العثرة
  alternative: لا يوجد له ما يعثره
  rationale: يمكن أن تدل ἐν αὐτῷ على ما هو موجود في الشخص، ويمكن أن تُفهم بمعنى ما يواجهه أو يكون سبب عثرة له. يحافظ المتن على الصياغة الداخلية الأقرب إلى التركيب، وتثبت الحاشية الاحتمال الآخر دون حسم التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «يثبت» للمحافظة على المفردة اليوحناوية المحورية، و«ما يسبّب العثرة» لصون الاستعارة مع وضوح المعنى. وُضعت علامة الحاشية بعد الجملة التي تتناولها.
