id: 1JN.2.14
reference: 1 John 2:14
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: ar
  text: كتبتُ إليكم[a]، يا أولاد، لأنكم قد عرفتم الآب. كتبتُ إليكم، يا آباء، لأنكم قد عرفتم الذي هو منذ البدء[b]. كتبتُ إليكم، أيها الشبان، لأنكم أقوياء، وكلمة الله تبقى فيكم[c]، وقد غلبتم الشرير.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد كتبتُ إليكم» في المواضع الثلاثة من الآية. يدل الماضي اليوناني على فعل مكتمل، وقد يبرز السياق الرسائلي صلته الحاضرة.'
    reason: lexical_alternative
  - marker: b
    text: يرجح أن عبارة «الذي هو منذ البدء» تشير إلى الابن السابق الوجود في الاستعمال اليوحناوي، لكن النص لا يسمّي المرجع صراحة.
    reason: alternative_reading
  - marker: c
    text: 'أو: «تمكث فيكم» أو «تظل فيكم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: كتبتُ إليكم
  rationale: صيغة الماضي اليونانية تدل على فعل كتابة مكتمل، والعربية الفصحى تعبّر عنه طبيعيًا بالماضي. وتوضح الحاشية إمكان فهمه في سياق الرسالة بمعنى «قد كتبتُ» ذي الصلة الحاضرة.
- source_word: παιδία
  choice: يا أولاد
  rationale: يحفظ النداء العائلي وصيغة الجمع من غير إضافة وصف عاطفي غير مصرّح به.
- source_word: ἐγνώκατε
  choice: قد عرفتم
  rationale: «قد» مع الماضي تنقل نتيجة المعرفة المستقرة التي تفيدها صيغة التام اليونانية.
- source_word: τὸν πατέρα
  choice: الآب
  rationale: لقب إلهي واضح في الاستعمال اليوحناوي، وصيغته العربية المألوفة هي «الآب».
- source_word: πατέρες
  choice: يا آباء
  rationale: يحفظ اللفظ الأصلي وبنية النداءات الثلاثية، من دون حصره تفسيريًا في كبار السن.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: الذي هو منذ البدء
  rationale: يحفظ الإحالة الشخصية الضمنية ولا يصرّح باسم المسيح أو الابن، كما يحافظ على دلالة العبارة المستمرة.
- source_word: νεανίσκοι
  choice: أيها الشبان
  rationale: مقابل عربي فصيح طبيعي للجمع المذكر، ويحفظ المقابلة مع الآباء والأولاد.
- source_word: ἰσχυροί
  choice: أقوياء
  rationale: ترجمة مباشرة وطبيعية في السياق الروحي والأخلاقي.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: كلمة الله
  rationale: صياغة كتابية عربية مألوفة تترك مفتوحًا ما إذا كان المقصود رسالة الله عمومًا أم البشارة المعلنة خصوصًا.
- source_word: μένει
  choice: ثابتة
  rationale: تنقل معنى البقاء والاستمرار بعبارة عربية طبيعية، مع ذكر البديل الأقرب لفظيًا في الحاشية.
- source_word: νενικήκατε
  choice: قد غلبتم
  rationale: تنقل فعل الغلبة المكتمل ذا الأثر المستمر الذي تفيده صيغة التام.
- source_word: τὸν πονηρόν
  choice: الشرير
  rationale: أداة التعريف والصيغة المذكرة ترجحان الإحالة الشخصية، لا الشر المجرد.
theological_decisions:
- issue: مرجع عبارة «الذي هو منذ البدء»
  choice: إبقاء المرجع ضمنيًا كما في اليونانية
  alternative: التصريح بأنه المسيح أو الابن، أو فهمه على أنه الله عمومًا
  rationale: يرجح الاستعمال اليوحناوي أن المقصود هو الابن السابق الوجود، لكن الآية لا تسميه صراحة؛ لذلك تحافظ الترجمة على الإبهام المقصود.
- issue: جنس الفئات المخاطبة في الثلاثية
  choice: «أولاد» ثم «آباء» و«شبان»
  alternative: تحويل الألفاظ كلها إلى فئات عمرية محايدة أو إلى تعبيرات تشمل الجميع صراحة
  rationale: 'يحفظ هذا الاختيار النمط اليوناني: لفظ عائلي عام نسبيًا، يتبعه اسمان مذكران، من غير تسوية الفروق الصرفية أو فرض تفسير للفئات.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يا» و«أيها» بحسب سلاسة النداء، وحُفظ التكرار البلاغي لعبارة «كتبتُ إليكم» وبنية الفئات الثلاث.
