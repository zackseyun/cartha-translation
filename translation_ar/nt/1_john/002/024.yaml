  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: ar
  text: أمّا أنتم، فليبقَ فيكم ما سمعتموه منذ البدء.[a] إن بقي فيكم ما سمعتموه منذ البدء، فأنتم أيضًا ستبقون في الابن وفي الآب.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: تشير عبارة «ما سمعتموه منذ البدء» على الأرجح إلى الرسالة الرسولية الأصلية عن الابن، لكن الأصل لا يسمّيها صراحةً.
    reason: lexical_alternative
  - marker: b
    text: تُترجم صيغ الفعل اليوناني μένω الثلاث في هذه الآية بصيغ من «بقي»؛ ويمكن أيضًا ترجمتها بصيغ من «ثبت».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: أمّا أنتم
  rationale: الضمير متقدّم في اليونانية للتوكيد وإبراز المقابلة؛ وصيغة «أمّا أنتم» تنقل ذلك بوضوح وطبيعية في العربية.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: ما سمعتموه منذ البدء
  rationale: تحافظ «ما» على عموم اسم الموصول المحايد من غير أن تحدده بأنه «الإنجيل» أو «التعليم»، مع أن السياق يشير إلى البشارة الرسولية الأصلية عن الابن.
- source_word: ἀπ’ ἀρχῆς
  choice: منذ البدء
  rationale: تعبير عربي طبيعي يحفظ دلالة الاستمرار من نقطة البداية، كما يصون الصدى اليوحناوي لعبارة «منذ البدء».
- source_word: ἐν ὑμῖν μενέτω
  choice: فليثبت فيكم
  rationale: ينقل صيغة الأمر الدالة على الاستمرار. واختيار «يثبت» واضح ومعاصر ويلائم وجود القول أو التعليم في المؤمنين.
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: إن ثبت فيكم
  rationale: يحافظ على الشرط كما هو، ويكرر الجذر العربي نفسه المستخدم لترجمة μένω.
- source_word: καὶ ὑμεῖς
  choice: فأنتم أيضًا
  rationale: يحفظ الضمير الصريح المؤكد ودلالة καί بمعنى «أيضًا»، مع ربط طبيعي بجواب الشرط.
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: في الابن وفي الآب
  rationale: تكرار حرف الجر يحفظ التوازي العلاقي المقصود بين الابن والآب.
- source_word: μενεῖτε
  choice: ستثبتون
  rationale: ينقل صيغة المستقبل بوضوح ويحافظ على تكرار فعل μένω في أجزاء الآية الثلاثة.
theological_decisions:
- issue: طبيعة الوعد المشروط في الجملة الأخيرة
  choice: فأنتم أيضًا ستثبتون في الابن وفي الآب
  alternative: صياغة الجملة بوصفها حثًّا، أو تفسيرها وفق مذهب لاحق في المثابرة أو الضمان
  rationale: النص اليوناني يورد خبرًا مستقبليًا مشروطًا بثبات ما سمعوه فيهم؛ لذلك تُحفظ العلاقة الشرطية والتوتر اللاهوتي من غير حسمه ضمن إطار مذهبي.
- issue: مرجع «ما سمعتموه منذ البدء»
  choice: إبقاء العبارة عامة في المتن
  alternative: الإنجيل الذي سمعتموه، أو التعليم الرسولي الذي سمعتموه
  rationale: السياق يرجّح الرسالة الرسولية الأصلية عن الابن، لكن اليونانية تستعمل اسم موصول عامًا ولا تصرّح باسم الرسالة؛ لذا لا يضيّق المتن معناها.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «أمّا أنتم» لإظهار التوكيد والمقابلة، وحُفظ تكرار فعل μένω بصيغ من «ثبت»، كما حُفظ تكرار «في» قبل الابن والآب.
