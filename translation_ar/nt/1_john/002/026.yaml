  text: I have written these things to you concerning those who are leading you astray[a].
translation:
  language: ar
  text: كتبتُ إليكم هذه الأمور عن الذين يضلّونكم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الذين يخدعونكم» أو «الذين يحاولون تضليلكم». قد يصف اسم الفاعل اليوناني فعل الإضلال أو السعي إليه، من غير أن يقتضي أن الإضلال قد نجح.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: هذه الأمور
  rationale: اسم إشارة محايد جمع يعود طبيعيًا إلى ما سبق أن كتبه المؤلف، وتعبير «هذه الأمور» واضح وفصيح في العربية المعاصرة.
- source_word: ἔγραψα
  choice: كتبتُ
  rationale: الفعل اليوناني ماضٍ خبري يدل على فعل الكتابة المنجز؛ والماضي العربي ينقل ذلك مباشرة، مع بقاء صلته بالحاضر مفهومة من السياق.
- source_word: ὑμῖν
  choice: إليكم
  rationale: ضمير في حالة المجرور غير المباشر يعيّن متلقي الكتابة؛ و«إليكم» هو المقابل العربي الطبيعي مع الفعل «كتب».
- source_word: περὶ
  choice: عن
  rationale: يقدّم موضوع الكتابة، و«عن» تعبير عربي واضح وطبيعي دون تكلف.
- source_word: τῶν πλανώντων ὑμᾶς
  choice: الذين يضلّونكم
  rationale: اسم الفاعل المضارع يصف أشخاصًا بحسب نشاطهم الموجّه إلى المخاطَبين. ويحفظ فعل «يضلّون» معنى إبعادهم عن الحق، من غير أن يضيف صراحةً أن المحاولة نجحت أو لم تنجح.
theological_decisions:
- issue: هل يدل πλανώντων على خداع ناجح أم على محاولة إضلال؟
  choice: الذين يضلّونكم
  alternative: الذين يحاولون إضلالكم؛ الذين يخدعونكم
  rationale: الصيغة اليونانية تصف الفاعلين ونشاطهم، لكنها لا تحسم بذاتها مقدار نجاحه. لذلك يحافظ النص على التعبير المباشر، وتوضح الحاشية أن المقصود قد يشمل السعي إلى الإضلال دون الجزم بتحقق نتيجته.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات نبرة كتابية كريمة. استُعمل «يضلّونكم» للمحافظة على الصورة الدلالية للفعل اليوناني وتجنب حسم نجاح الإضلال في متن الآية.
