id: 1JN.2.7
reference: 1 John 2:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: ar
  text: أيها الأحباء، لا أكتب إليكم وصية جديدة، بل وصية قديمة كانت لكم منذ البدء. والوصية القديمة هي الرسالة[a] التي سمعتموها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الكلمة».'
    reason: بديل معجمي مباشر للفظ اليوناني λόγος، الذي يمكن أن يدل هنا على القول أو الرسالة المسموعة.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: أيها الأحباء
  rationale: صيغة نداء جمع تعبّر عن المحبة والمودة الرعوية، وتحافظ على الصلة اللفظية بجذر المحبة دون اللجوء إلى تعبير تفسيري مثل «يا أصدقائي الأعزاء».
- source_word: ἐντολήν
  choice: وصية
  rationale: «وصية» هي المقابل العربي المألوف في السياق الكتابي، وتحافظ على الثقل اللاهوتي للكلمة وعلى تكرارها في كتابات يوحنا.
- source_word: καινήν
  choice: جديدة
  rationale: تنقل المقابلة المباشرة مع «قديمة» دون إضافة معنى «مستحدثة» أو «متجددة».
- source_word: γράφω
  choice: أكتب
  rationale: المضارع العربي ملائم لفعل الكتابة الجاري في سياق الرسالة.
- source_word: παλαιάν / παλαιά
  choice: قديمة
  rationale: تحافظ على التضاد المباشر مع «جديدة»، ولا توحي بالقِدم السحيق كما قد يفعل تعبير «عتيقة».
- source_word: εἴχετε
  choice: كانت لكم
  rationale: تنقل معنى امتلاك المخاطَبين للوصية في الزمن الماضي، مع دلالة السياق على استمرارها منذ البدء، بصياغة عربية طبيعية.
- source_word: ἀπ’ ἀρχῆς
  choice: منذ البدء
  rationale: تحافظ على العبارة اليوحناوية وعلى عدم تعيين المقصود بالبدء تعيينًا أضيق مما يسمح به النص.
- source_word: λόγος
  choice: الرسالة
  rationale: يشير السياق إلى مضمون ما تلقّاه القرّاء بالسماع؛ و«الرسالة» واضحة للقارئ المعاصر، مع إثبات البديل الحرفي «الكلمة» في الحاشية.
- source_word: ἠκούσατε
  choice: سمعتموها
  rationale: ينقل الماضي البسيط واقعة سماع المخاطَبين للمضمون المعلن، ويعود الضمير طبيعيًا إلى «الرسالة».
theological_decisions:
- issue: مرجع عبارة «منذ البدء»
  choice: الإبقاء على «منذ البدء» بلا تحديد إضافي
  alternative: منذ بداية إيمانكم، أو منذ بدء إعلان البشارة
  rationale: يرجّح السياق بداية تلقي القرّاء للتعليم، لكن العبارة نفسها لا تحدد ذلك صراحة؛ لذلك تُصان سعتها اليوحناوية.
- issue: علاقة «الوصية القديمة» بما سمعه المخاطَبون
  choice: 'إبقاء المطابقة المباشرة: «الوصية القديمة هي الرسالة التي سمعتموها»'
  alternative: تفسير الرسالة بأنها وصية المحبة أو توسيع العبارة بمواد من السياق القريب
  rationale: النص اليوناني يطابق بين الوصية القديمة والقول المسموع من غير شرح إضافي، فلا تُحسم هوية الوصية بإضافة تفسير غير وارد في الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «أيها الأحباء» للمحافظة على حرارة الخطاب، و«وصية» للاتساق مع الاستعمال الكتابي الشائع، مع تجنب الصياغات المذهبية أو الشروح المضافة.
