source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: ar
  text: 'أمّا مَن يحفظ كلمته، فقد تكمّلت فيه حقًّا محبّة الله[a]. وبهذا نعرف أنّنا فيه:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تعني «محبّة الله» محبّة الله العاملة في المؤمن، أو محبّة المؤمن لله. ويمكن ترجمة «فيه» ترجمة أقرب إلى اللفظ: «في هذا» أو «في هذا الشخص»، إذ قد تشير العبارة اليونانية إلى الشخص الذي يحفظ كلمته أو إلى هذا الأمر بوصفه دليلًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: أمّا مَن
  rationale: تؤدي معنى الشرط العام غير المحدد، وتحفظ δέ بوصفها انتقالًا ذا مسحة من المقابلة مع الكلام السابق.
- source_word: τηρῇ
  choice: يحفظ
  rationale: يحافظ على الاستعمال اليوحنّاوي الدال على حفظ الكلمة والعمل بها، من غير حصر المعنى في الطاعة الخارجية وحدها.
- source_word: αὐτοῦ τὸν λόγον
  choice: كلمته
  rationale: يحفظ المفرد λόγος والإحالة بالضمير، كما يصون الصدى اليوحنّاوي الأوسع من مجرد «القول».
- source_word: ἀληθῶς
  choice: حقًّا
  rationale: ينقل قوة التوكيد في الظرف اليوناني بعبارة عربية طبيعية وفصيحة.
- source_word: ἐν τούτῳ
  choice: فيه
  rationale: يفهم اسم الإشارة على أنه عائد إلى الشخص الذي يحفظ الكلمة؛ وهو تعبير عربي واضح، مع التنبيه في الحاشية إلى إمكان القراءة الحرفية أو الإشارية.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: محبّة الله
  rationale: صياغة عربية طبيعية تبقي إضافة المصدر إلى «الله» محتملة لمحبة الله للإنسان أو محبة الإنسان لله.
- source_word: τετελείωται
  choice: تكمّلت
  rationale: تنقل حالة الاكتمال الناتجة التي يفيدها الفعل في صيغة التام، وتحفظ دلالة بلوغ المحبة تمامها أو غايتها.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: وبهذا نعرف
  rationale: تعبير عربي طبيعي للصيغة اليوحنّاوية التي تقدم الدليل أو الوسيلة التي بها تتحقق المعرفة.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: أنّنا فيه
  rationale: يحفظ العبارة اليوحنّاوية الموجزة «فيه» من غير توسيع تفسيري إلى الاتحاد أو الشركة.
theological_decisions:
- issue: دلالة الإضافة في ἡ ἀγάπη τοῦ θεοῦ
  choice: محبّة الله
  alternative: محبّة الله للمؤمن؛ أو محبّة المؤمن لله
  rationale: الإضافة اليونانية محتملة للمعنيين، وتعبير «محبة الله» في العربية يحفظ هذا التوتر اللاهوتي بدل حسمه.
- issue: مرجع ἐν τούτῳ في الجملة الأولى
  choice: فيه، أي في الشخص الذي يحفظ كلمته
  alternative: في هذا الأمر؛ أو في هذا الشخص
  rationale: السياق القريب يرجح الإحالة الشخصية، وصيغة «فيه» أوضح عربيًا، لكن اسم الإشارة اليوناني يمكن أن يدل أيضًا على هذا الأمر بوصفه دليلًا، ولذلك حُفظ الاحتمال في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «أمّا مَن» للمقابلة الطبيعية، و«تكمّلت» بدل الصياغة الأثقل «قد صارت كاملة»، مع إبقاء العبارة اليوحنّاوية المفتاحية «أننا فيه». وُضع موضع الحاشية بعد «محبة الله» لأنها تشرح غموض الإضافة وكذلك مرجع «فيه» في الجملة نفسها.
