  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: ar
  text: لا تحبّوا العالم ولا ما في العالم.[a] إن كان أحد يحبّ العالم، فليست فيه[c] محبّة الآب.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولا الأشياء التي في العالم».'
    reason: lexical_alternative
  - marker: b
    text: 'قد تعني «محبّة الآب»: محبّة الإنسان للآب؛ وقد تعني، على احتمال أضعف، محبّة الآب للإنسان.'
    reason: alternative_reading
  - marker: c
    text: يستعمل النص اليوناني ضميرًا مفردًا مذكّرًا بمعنى عام، وكذلك «أحد» و«فيه» هنا، فيشمل التعبير كل إنسان.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε
  choice: لا تحبّوا
  rationale: ينقل النهي بصيغة واضحة عامة، من غير أن يحسم ما إذا كان المقصود إيقاف فعل جارٍ أو الامتناع عنه على وجه الدوام.
- source_word: κόσμον
  choice: العالم
  rationale: يحافظ على اللفظ اليوحنّاوي الواسع، ويترك للسياق بيان أن المقصود هنا العالم بوصفه واقعًا معارضًا لله، لا الخليقة المادية في ذاتها.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: ولا ما في العالم
  rationale: صياغة عربية طبيعية وموجزة تنقل النهي عن متعلقات العالم وما يشتمل عليه، مع إثبات بديل أكثر حرفية في الحاشية.
- source_word: ἐάν τις ἀγαπᾷ
  choice: إن كان أحد يحبّ
  rationale: تحافظ «أحد» على العموم الذي تفيده τις، وتؤدي الجملة الشرطية اليونانية بوضوح.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: محبّة الآب
  rationale: الإضافة العربية، مثل المضاف إليه اليوناني، تترك المجال لفهم العبارة على أنها محبة موجّهة إلى الآب أو محبة صادرة منه، وإن كان السياق يرجّح الأول.
- source_word: πατρὸς
  choice: الآب
  rationale: ينقل اللقب العلاقي في الاستعمال اليوحنّاوي من غير إضافة تفسيرية مثل «الله الآب».
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: يطابق الضمير المفرد المذكر في اليونانية ويرجع إلى «أحد»، وهو مستعمل هنا استعمالًا عامًا يشمل كل إنسان.
theological_decisions:
- issue: دلالة «العالم» في الأخلاق اليوحنّاوية
  choice: إبقاء «العالم» بلا توسيع تفسيري في المتن
  alternative: نظام العالم أو العالم المتمرّد على الله
  rationale: اللفظ لا يذم خليقة الله أو البشر في ذاتهم، بل يدل في السياق على المجال المعارض لله. إبقاؤه كما هو يصون اتساع التعبير وتوتره اللاهوتي ويجعل السياق يحدّد المراد.
- issue: دلالة الإضافة في «محبّة الآب»
  choice: الحفاظ على الإضافة الملتبسة في المتن
  alternative: محبة الإنسان للآب؛ أو محبة الآب للإنسان
  rationale: التركيب اليوناني يحتمل أن تكون المحبة متجهة إلى الآب أو صادرة منه. المقابلة مع محبة العالم ترجّح المحبة للآب، لكن لا ينبغي حسم الاحتمال الآخر داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُعملت «ما في العالم» لسلاستها وشمولها، وحُفظت إضافة «محبّة الآب» لتجنّب حسم الغموض الأصيل في التركيب اليوناني. وُضعت علامات الحواشي جميعها في المتن عند العبارات التي تشرحها.
