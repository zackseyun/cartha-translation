  text: ὁ λέγων ἐν αὐτῷ μένειν ὀφείλει καθὼς ἐκεῖνος περιεπάτησεν καὶ ⸀αὐτὸς περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: ar
  text: مَنْ يقول إنه يبقى فيه، يجب عليه هو أيضًا أن يسلك كما سلك ذاك[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«ذاك» يشير إلى يسوع، ويحفظ قوة اسم الإشارة في اليونانية؛ ويمكن أن تُترجم العبارة: «كما سلك هو».'
    reason: alternative_reading
  - marker: b
    text: «يسلك» استعارة كتابية تعني نهج الإنسان في حياته؛ أي يجب عليه أن يعيش كما عاش يسوع.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: مَنْ يقول
  rationale: ينقل اسم الفاعل المعرَّف المستعمل استعمال الاسم للدلالة العامة على أي شخص يدّعي ذلك، بصياغة عربية طبيعية موجزة.
- source_word: ἐν αὐτῷ μένειν
  choice: إنه ثابتٌ فيه
  rationale: الفعل μένω من الألفاظ المحورية في كتابات يوحنا، ويفيد البقاء والاستمرار في علاقة. واختيار «ثابت فيه» واضح بالعربية ويحافظ على البعد العلاقي والاستمراري، مع إبقاء الضمير كما في اليونانية.
- source_word: ὀφείλει
  choice: يجب عليه
  rationale: يفيد ὀφείλω هنا التزامًا أخلاقيًا؛ و«يجب عليه» تعبير عربي طبيعي يؤدي قوة الواجب من غير صياغة قانونية ثقيلة.
- source_word: καθὼς
  choice: كما
  rationale: تدل καθώς على المطابقة في الكيفية أو المثال، و«كما» تؤدي المقارنة بوضوح وطبيعية.
- source_word: ἐκεῖνος
  choice: ذاك
  rationale: يحفظ اسم الإشارة القوة الإشارية والتوكيدية في ἐκεῖνος بدل تسويته بضمير بسيط، والمرجع في السياق هو يسوع.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: سلك ... أن يسلك
  rationale: «سلك» يحفظ الاستعارة الكتابية للمشي بمعنى نهج الحياة، وهو أفصح وأطبع في العربية من النقل الحرفي «مشى» في هذا السياق.
- source_word: καὶ αὐτὸς
  choice: هو أيضًا
  rationale: يحفظ الضمير المنفصل «هو» توكيد αὐτός، وتنقل «أيضًا» القوة الإضافية التي تفيد وجوب مماثلة المدّعي لذاك في السلوك.
theological_decisions:
- issue: مرجع αὐτῷ وἐκεῖνος
  choice: أُبقي الضمير «فيه» واسم الإشارة «ذاك»، ويُفهم من السياق أن المرجع هو يسوع المسيح.
  alternative: 'التصريح بالمرجع: «ثابت في المسيح... كما سلك يسوع»، أو تسوية ἐκεῖνος إلى «هو».'
  rationale: السياق السابق يعيّن المرجع، لكن النص اليوناني نفسه يستعمل ضميرًا واسم إشارة. إبقاؤهما يصون بنية النص وقوة ἐκεῖνος من غير إدخال تصريح تفسيري في المتن.
- issue: طبيعة التشبيه بسلوك يسوع
  choice: الحفاظ على صيغة «كما سلك ذاك» بوصفها دعوة إلى مماثلة نهج حياته.
  alternative: 'التفسير المباشر: «أن يعيش كما عاش يسوع».'
  rationale: يحفظ هذا الاختيار الاستعارة الأخلاقية الكتابية والتوتر القوي في معيار الاقتداء، من غير حصر معنى السلوك أو تخفيفه.
- issue: الدلالة العامة للصيغة المذكرة المفردة
  choice: استعمال «مَنْ يقول» ثم الضمائر المذكرة المفردة وفق البنية النحوية العربية.
  alternative: 'إعادة الصياغة بالجمع: «الذين يقولون... يجب عليهم».'
  rationale: «مَنْ» عامة تشمل كل شخص، مع المحافظة على المفرد التمثيلي الموافق للمصدر، من غير تضييق الدلالة على الرجال.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «ثابت فيه» للمصطلح اليوحناوي μένω، و«سلك» للمجاز الأخلاقي المألوف كتابيًا. وُضعت علامتا الحاشيتين في المتن، مع تجنب تكثير الحواشي حين يكفي الاختيار العربي لإيصال المعنى.
