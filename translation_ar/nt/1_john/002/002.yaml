  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: ar
  text: وهو نفسه كفّارةٌ عن خطايانا[a]، لا عن خطايانا وحدها، بل عن خطايا العالم كله أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذبيحة كفّارية». ويمكن أن يُفهم اللفظ اليوناني أيضًا بمعنى ما يمحو الخطايا، أو ما يسترضي الغضب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: هو نفسه
  rationale: ينقل الاستعمال التوكيدي للضمير، فيبرز أن المسيح نفسه هو المعني، من غير إضافة معنى الحصر.
- source_word: ἱλασμός
  choice: كفّارة
  rationale: لفظ عربي موجز ومألوف نسبيًا في السياق الكتابي، يدل على ما يرفع أثر الخطية ويعالجها، مع إبقاء جوانب المعنى الأخرى في الحاشية.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: عن خطايانا
  rationale: تركيب عربي طبيعي مع «كفّارة»، ويحافظ على دلالة περί المتعلقة بالخطايا دون إثقال العبارة.
- source_word: τῶν ἡμετέρων
  choice: خطايانا
  rationale: فُكّ الحذف الذي في اليونانية لأن تكرار الاسم أوضح وأفصح في العربية من استعمال ضمير مستقل قد يلتبس مرجعه.
- source_word: ὅλου τοῦ κόσμου
  choice: العالم كله
  rationale: يحافظ على الشمول الصريح في ὅλου، من غير تضييق «العالم» بحسب إطار لاهوتي معين.
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: لا ... وحدها، بل ... أيضًا
  rationale: ينقل بنية المقابلة والترابط في اليونانية بأسلوب عربي واضح وطبيعي.
theological_decisions:
- issue: مدى عبارة «العالم كله»
  choice: 'إبقاء العبارة شاملة كما هي: «العالم كله»'
  alternative: أناس من العالم كله؛ أو المختارون في أنحاء العالم
  rationale: النص اليوناني يصرّح بالشمول ولا يذكر قيدًا يبرر تضييقه؛ لذلك تُحفظ سعة العبارة والتوتر التفسيري من غير فرض موقف مذهبي.
- issue: دلالة ἱλασμός
  choice: كفّارة
  alternative: ذبيحة كفّارية؛ استرضاء؛ تكفير يمحو الخطايا
  rationale: «كفّارة» تؤدي المعنى المركزي بعبارة عربية كريمة ومفهومة، فيما توضّح الحاشية أن اللفظ اليوناني قد يُبرز الذبيحة الكفّارية أو رفع الخطايا أو استرضاء الغضب، فلا يُحسم الجدل الدلالي داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية كريمة. استُعملت «كفّارة» في المتن للإيجاز وسلاسة القراءة، وفُكّ الحذف في «خطايانا» منعًا للالتباس. وُضعت علامة الحاشية مباشرة بعد العبارة التي تشرحها.
