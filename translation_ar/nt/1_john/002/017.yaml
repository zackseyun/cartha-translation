  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: ar
  text: وَالْعَالَمُ آخِذٌ فِي الزَّوَالِ[a]، وَكَذَلِكَ رَغْبَتُهُ[b]؛ أَمَّا مَنْ يَعْمَلُ مَشِيئَةَ اللهِ فَيَبْقَى إِلَى الْأَبَدِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «والعالم يمضي». وصيغة الفعل اليوناني تصور زوالًا جاريًا.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «شهوته». اللفظ اليوناني يدل على رغبة قوية، وهو سلبي هنا بحسب السياق، لكنه لا يقتصر على المعنى الجنسي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: الْعَالَمُ
  rationale: يحافظ على اللفظ الواسع في اليونانية، بينما يوضح سياق 1 يوحنا 2:15–16 أن المقصود هنا العالم بما فيه من قيم ورغبات معارضة لله، لا الخليقة المادية في ذاتها.
- source_word: παράγεται
  choice: يَمْضِي
  rationale: ينقل معنى الزوال الجاري في صيغة المضارع، بعبارة عربية طبيعية توحي بأن العالم في طريقه إلى الانقضاء.
- source_word: ἐπιθυμία
  choice: رَغْبَتُهُ
  rationale: «الرغبة» أوسع من «الشهوة» في الاستعمال العربي المعاصر، فلا تحصر المعنى في الشهوة الجنسية، بينما يحدد السياق طابعها المنحرف.
- source_word: ὁ δὲ ποιῶν
  choice: أَمَّا مَنْ يَعْمَلُ
  rationale: يؤدي اسم الفاعل المسبوق بأداة التعريف بوصفه شخصًا يتميز بفعل مشيئة الله، وتأتي «أما» بالمقابلة الواضحة والطبيعية.
- source_word: θέλημα τοῦ θεοῦ
  choice: مَشِيئَةَ اللهِ
  rationale: «مشيئة الله» هي العبارة العربية المألوفة والدقيقة، وتحافظ على الدلالة اللاهوتية دون اختزالها إلى مجرد ما يريده الله.
- source_word: μένει
  choice: فَيَبْقَى
  rationale: «يبقى» واضح ومعاصر، ويحفظ معنى الاستمرار والثبات الذي يحمله الفعل في كتابات يوحنا.
- source_word: εἰς τὸν αἰῶνα
  choice: إِلَى الْأَبَدِ
  rationale: تعبير عربي فصيح ومألوف يؤدي معنى الدوام غير المنتهي في هذا السياق.
theological_decisions:
- issue: دلالة «العالم» في السياق اليوحناوي
  choice: إبقاء لفظ «العالم» في النص مع فهمه سياقيًا بوصفه النظام البشري العابر المعارض لله
  alternative: تخصيصه في الترجمة بعبارة «نظام العالم الحاضر» أو فهمه على أنه الخليقة المادية
  rationale: الآيتان السابقتان تحددان معنى العالم من خلال شهوة الجسد وشهوة العيون وتعظم المعيشة. وإبقاء اللفظ الواسع يحفظ صياغة الأصل من غير تضييق تفسيري.
- issue: قوة العبارة «يبقى إلى الأبد»
  choice: إثبات الدوام للشخص الذي يعمل مشيئة الله من غير شرح آليته العقائدية
  alternative: تفسير العبارة صراحة بأنها نيل الحياة الأبدية
  rationale: النص يقرر البقاء الدائم، لكنه لا يفصل في هذه الآية وحدها العلاقة العقائدية بين الطاعة والحياة الأبدية؛ لذلك تُحفظ قوة العبارة وتوترها دون إضافة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «يمضي» بدل صياغة جامدة مثل «يزول»، و«رغبته» لتجنب حصر الدلالة في الشهوة الجنسية، مع بيان البديل في الحاشية.
