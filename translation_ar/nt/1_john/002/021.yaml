source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: ar
  text: لَمْ أَكْتُبْ إِلَيْكُمْ لِأَنَّكُمْ لَا تَعْرِفُونَ الْحَقَّ، بَلْ لِأَنَّكُمْ تَعْرِفُونَهُ، وَلِأَنَّ أَيَّ كَذِبٍ لَيْسَ مِنَ الْحَقِّ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: لَمْ أَكْتُبْ
  rationale: صيغة الماضي اليونانية تُنقل طبيعيًا بالماضي المنفي في العربية، من غير حاجة إلى تركيب يحاكي المضارع التام الإنجليزي.
- source_word: οἴδατε
  choice: تَعْرِفُونَ
  rationale: تنقل معنى المعرفة المباشرة، ويُظهر التقابل بين النفي والإثبات في السياق التوكيد من غير إضافة لفظية.
- source_word: ἡ ἀλήθεια
  choice: الْحَقّ
  rationale: يحافظ على أداة التعريف وعلى سعة التعبير اليوحناوي دون تضييقه إلى «الرسالة الحقة» أو «الإنجيل».
- source_word: πᾶν ψεῦδος
  choice: أَيُّ كَذِبٍ
  rationale: مع النفي اللاحق يفيد نفي كل فرد من أفراد الكذب، ويحافظ على البنية الجامعة في اليونانية بصياغة عربية سليمة.
- source_word: ἐκ τῆς ἀληθείας
  choice: مِنَ الْحَقِّ
  rationale: تحافظ «مِن» على دلالة المصدر أو المنشأ في ἐκ، من غير توسيع تفسيري.
theological_decisions:
- issue: مدلول «الحق» في الاستعمال اليوحناوي
  choice: الْحَقّ
  alternative: الرسالة الحقة؛ حق الإنجيل
  rationale: للتعبير عمق لاهوتي محتمل، لكن الآية لا تحدده بعبارة أضيق؛ لذلك أُبقي كما ورد.
- issue: صلة الكذب بالحق
  choice: لَيْسَ مِنَ الْحَقِّ أَيُّ كَذِبٍ
  alternative: لا يصدر أي كذب عن الحق؛ لا كذب ينتمي إلى الحق
  rationale: تحافظ الصياغة على معنى المصدر في ἐκ وعلى التوتر المباشر بين الحق والكذب، دون تحويل القول إلى شرح ميتافيزيقي أوسع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. اختير ترتيب «ليس من الحق أي كذب» ليحافظ على دلالة الأصل وعلى النفي الشامل، مع تجنب الحشو والتفسير المذهبي.
