review_pass:
  verdict: revise
  source_fidelity: ينقل النص التقابل بين عدم معرفة الحق ومعرفته، ويحافظ على دلالة «مِن» للمصدر/المنشأ في ἐκ τῆς ἀληθείας. غير أن تركيب الجملة الأخيرة في المسودة («ولأنه ليس من الحق أي كذب») يوهم بضمير ذي مرجع غير محدد ويضعف تمثيل الجملة الخبرية اليونانية.
  naturalness: الصياغة فصيحة عمومًا، لكن تقديم «ليس من الحق» قبل «أي كذب» بعد «لأنه» غير سلس في العربية المعاصرة. تقديم المبتدأ المنفي عنه يجعل العبارة أوضح وأقرب إلى الاستعمال الطبيعي.
  terminology: «الحق» مقابل ἀλήθεια اختيار دقيق ومألوف في العربية الكتابية، و«كذب» يفي بـ ψεῦδος. لا حاجة إلى تضييق «الحق» بتفسير لاهوتي.
