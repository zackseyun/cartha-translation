id: 1JN.2.8
reference: 1 John 2:8
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: ar
  text: ومن جهة أخرى، أكتب إليكم وصية جديدة، وهذا حقٌّ فيه[a] وفيكم، لأن الظلمة آخذة في الزوال، والنور الحقيقي يضيء بالفعل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فيها وفيكم»، إذا أُعيد الضمير إلى الوصية لا إليه شخصيًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: ومع ذلك
  rationale: تأتي هنا لتبيّن المفارقة مع وصف الوصية في العدد السابق بأنها ليست جديدة؛ و«مع ذلك» تنقل هذا التحول بوضوح من غير أن تحسم طبيعة الجِدّة.
- source_word: ἐντολὴν καινὴν
  choice: وصية جديدة
  rationale: صياغة عربية مألوفة تحفظ معنى الجِدّة في الصفة أو الكيفية، وتنسجم مع الاستعمال اليوحناوي.
- source_word: γράφω
  choice: أكتب
  rationale: المضارع العربي الطبيعي يعبّر عن فعل الكتابة الجاري في سياق الرسالة.
- source_word: ὅ ἐστιν ἀληθὲς
  choice: وهي حقٌّ
  rationale: الضمير اليوناني المحايد يعود على مضمون الوصية أو الأمر المذكور بوصفه فكرة كلية؛ و«حقٌّ» تنقل صدقه وواقعيته بإيجاز.
- source_word: ἐν αὐτῷ
  choice: فيه
  rationale: يحفظ الضمير المذكر الإشارة الأرجح إلى المسيح من غير إضافة الاسم صراحة.
- source_word: ἐν ὑμῖν
  choice: فيكم
  rationale: يحافظ على التوازي مع «فيه» وعلى احتمال تحقق الأمر داخل المخاطَبين وفي حياتهم.
- source_word: ὅτι
  choice: لأن
  rationale: تفيد تعليل كون الوصية حقًّا فيه وفيهم.
- source_word: ἡ σκοτία παράγεται
  choice: الظلمة تزول
  rationale: تنقل العملية الجارية التي تفيدها صيغة المضارع، بلغة عربية واضحة وطبيعية.
- source_word: τὸ φῶς τὸ ἀληθινὸν
  choice: النور الحقيقي
  rationale: يحفظ التعبير اليوحناوي والتقابل اللاهوتي مع الظلمة.
- source_word: ἤδη φαίνει
  choice: يضيء الآن بالفعل
  rationale: «الآن بالفعل» تبرز أن الإضاءة قد بدأت وصارت واقعًا حاضرًا، وهو معنى ἤδη مع المضارع.
theological_decisions:
- issue: مرجع الضمير في ἐν αὐτῷ
  choice: 'الإشارة إلى المسيح: «فيه وفيكم»'
  alternative: 'الإشارة إلى مضمون الوصية: «فيها وفيكم»'
  rationale: الضمير اليوناني مذكر، والإشارة الشخصية إلى المسيح هي الأرجح في السياق اليوحناوي. أما إرجاعه إلى الوصية فغير مباشر نحويًا، ولذلك لا يلزم إثقال النص بحاشية قد توحي بتكافؤ الاحتمالين.
- issue: العلاقة بين «ليست وصية جديدة» في العدد 7 و«وصية جديدة» هنا
  choice: استخدام «ومع ذلك» لإبراز المفارقة من غير حلّها تفسيريًا
  alternative: «أيضًا» أو «من جهة أخرى»
  rationale: 'يحفظ النص التوتر المقصود: الوصية قديمة من جهة وجديدة من جهة أخرى، من غير إدخال تفسير مذهبي أو شرح غير منصوص عليه.'
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع الحفاظ على الإيجاز والتوازي اليوحناوي. لا توجد حواشٍ في هذه الصياغة، ومن ثم لا توجد علامات حواشٍ في المتن.
