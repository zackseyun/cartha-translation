  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: ar
  text: 'مَن هو الكذّاب إلا الذي ينكر أن يسوع هو المسيح؟ هذا هو ضدّ المسيح: الذي ينكر الآب والابن.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «المسيّا». اللفظ اليوناني ὁ χριστός لقب معناه «الممسوح».'
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا نقل المصطلح «أنتيخريستوس». وجود أداة التعريف في اليونانية يجيز: «ضدّ المسيح». وفي رسائل يوحنا قد يدل المصطلح على مَن يتصف بإنكار الآب والابن، من غير أن تحسم الآية هنا هل المقصود فرد أخروي واحد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: الكذّاب
  rationale: جاء الاسم مع أداة التعريف، فيدل هنا على الكذّاب المقصود بوصفه النموذج الذي يحدده السياق، لا على مجرد كذّاب.
- source_word: ἀρνούμενος
  choice: الذي ينكر
  rationale: اسم الفاعل اليوناني مستعمل استعمالًا اسميًا ويصف سمة مستمرة أو مميزة؛ وهذه الصياغة طبيعية وواضحة بالعربية.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: أن يسوع هو المسيح
  rationale: 'فعل «ينكر» يجعل العبارة التالية هي الأمر المنكَر؛ لذلك تصوغ العربية المضمون طبيعيًا: ينكر أن يسوع هو المسيح، من غير الحاجة إلى إبقاء النفي اليوناني داخل الجملة التابعة.'
- source_word: ὁ χριστός
  choice: المسيح
  rationale: «المسيح» هو اللقب العربي الراسخ الذي ينقل معنى اللقب اليوناني ويحافظ على دلالته المسيانية.
- source_word: ἀντίχριστος
  choice: ضدّ المسيح
  rationale: ترجمة دلالية شفافة للمصطلح، وتتفادى حصره مسبقًا في تصور أخروي بعينه؛ وأُثبت التعريف في «هذا هو ضدّ المسيح» موافقة لأداة التعريف اليونانية.
- source_word: πατέρα
  choice: الآب
  rationale: اللفظ يشير إلى الله في علاقة الآب بالابن، و«الآب» هو التعبير العربي الكتابي الواضح في هذا السياق.
- source_word: υἱόν
  choice: الابن
  rationale: يشير إلى الابن في علاقة الآب والابن المحورية في الرسالة.
- source_word: οὗτός ἐστιν
  choice: هذا هو
  rationale: يحافظ على قوة التعيين والإشارة إلى الشخص الموصوف في العبارة السابقة.
theological_decisions:
- issue: دلالة ὁ χριστός في صيغة الإقرار أو الإنكار
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» لقب عربي راسخ ومفهوم، وينقل دلالة الممسوح والمنتظَر من غير جعله مجرد جزء من اسم شخصي.
- issue: مرجع ἀντίχριστος
  choice: ضدّ المسيح
  alternative: المسيح الدجّال
  rationale: الصياغة المختارة تحافظ على لفظ النص وعلى إمكان دلالته في رسائل يوحنا على صاحب الموقف المعادي للمسيح أو النموذج الذي يمثله، من غير قصره على شخصية أخروية واحدة؛ أما «المسيح الدجّال» فقد يضيّق المرجع بما يتجاوز هذه الآية.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُعملت صيغة السؤال البلاغي «مَن هو... إلا...» لقربها من البناء اليوناني وطبيعتها في العربية، وحُفظ التوازي بين «الآب والابن».
