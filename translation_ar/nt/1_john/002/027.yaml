reference: 1 John 2:27
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: ar
  text: وأمّا أنتم، فالمسحة التي نلتموها منه تبقى فيكم، ولا حاجة بكم إلى أن يعلّمكم أحد. لكن كما أن مسحته تعلّمكم بشأن كل شيء، وهي حق وليست كذبًا، وكما علّمتكم، فابقوا فيه[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم الصيغة اليونانية الأخيرة فهمًا خبريًا: «فأنتم باقون فيه».'
    reason: grammatical_ambiguity
  - marker: b
    text: يرد الفعل اليوناني نفسه ثلاث مرات في الآية؛ ويمكن ترجمته أيضًا بـ«يمكث فيكم» و«امكثوا فيه».
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: المسحة
  rationale: تحفظ صورة المسح الواردة في اليونانية من غير أن تفسّرها صراحةً بأنها الروح القدس أو الرسالة.
- source_word: ἀπ’ αὐτοῦ
  choice: منه
  rationale: تحافظ على الضمير كما في النص، وتترك تعيين مرجعه للسياق السابق.
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: تثبت فيكم / اثبتوا فيه
  rationale: يحافظ فعل «ثبت» على تكرار الفعل اليوناني μένω وعلى الصلة اللفظية بين بقاء المسحة ودعوة المخاطَبين إلى الثبات.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: لا حاجة بكم إلى أن يعلّمكم أحد
  rationale: صياغة عربية واضحة وقريبة من بنية الأصل، من غير تلطيف العبارة أو تحويلها إلى تقرير تفسيري مطلق.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: يعلّمكم / تعلّمكم / علّمتكم
  rationale: يحفظ تكرار جذر التعليم وقوته البلاغية في الآية.
- source_word: περὶ πάντων
  choice: بشأن كل شيء
  rationale: ينقل اتساع العبارة من غير تقييد تفسيري لمجالها.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: هي حق وليست كذبًا
  rationale: يحفظ التقابل الحاد بين الحق والكذب بصياغة عربية طبيعية ومباشرة.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: وكما علّمتكم
  rationale: يبقي أداة المقارنة ويربط الوصية الختامية بما سبق أن علّمته المسحة.
theological_decisions:
- issue: مرجع «المسحة» (χρῖσμα)
  choice: الإبقاء على «المسحة» من غير تعيين صريح لمرجعها
  alternative: الروح القدس؛ أو الرسالة/البشارة التي تلقوها
  rationale: مع أن السياق قد يشير إلى حضور الروح وعمله في التكريس والتعليم، فإن النص يستعمل صورة «المسحة»، ولذلك حُفظت الصورة من غير حسم تفسيري زائد.
- issue: دلالة «لا حاجة بكم إلى أن يعلّمكم أحد»
  choice: نقل العبارة كما وردت من غير تلطيف أو إطلاق تفسيري
  alternative: نفي مطلق لكل تعليم بشري؛ أو نفي الحاجة إلى تعليم المنشقين تحديدًا
  rationale: تحفظ الترجمة توتر العبارة، وتترك للسياق تحديد مداها بدل فرض تفسير عقائدي في المتن.
- issue: صيغة الفعل الأخير μένετε
  choice: 'صيغة أمر: «فاثبتوا فيه»'
  alternative: 'صيغة خبر: «فأنتم ثابتون فيه»'
  rationale: تلائم صيغة الأمر سياق النص المطبوع في SBLGNT، مع إثبات القراءة الخبرية التي تشهد لها بعض المخطوطات في الحاشية.
- issue: مرجع الضمير في ἐν αὐτῷ
  choice: «فيه» بضمير مذكر
  alternative: «فيها» أي في المسحة
  rationale: يحفظ جنس الضمير اليوناني ومرجعه الشخصي المرجح في السياق، من غير استبداله بتفسير صريح.
translation_notes:
  register: العربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «ثبت» للمحافظة على التكرار اليوحنّاوي، و«المسحة» لصون الاستعارة من غير إدخال تفسير مذهبي في المتن.
