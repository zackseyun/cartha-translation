revisions:
- from: وأمّا أنتم، فالمسحة التي نلتموها منه تثبت فيكم، ولا حاجة بكم إلى أن يعلّمكم أحد. لكن كما أن مسحته تعلّمكم بشأن كل شيء، وهي حق وليست كذبًا، وكما علّمتكم، فاثبتوا فيه[a][b].
  to: وأمّا أنتم، فالمسحة التي نلتموها منه تبقى فيكم، ولا حاجة بكم إلى أن يعلّمكم أحد. لكن كما أن مسحته تعلّمكم بشأن كل شيء، وهي حق وليست كذبًا، وكما علّمتكم، فابقوا فيه[a][b].
  rationale: 'تُحسَّن ترجمة μένω إلى «تبقى/ابقوا» لتكون أوضح وأقرب إلى الاستعمال العربي المعاصر مع صون التكرار المقصود في الأصل. وتُصحَّح الحاشيتان: الأولى تحفظ الاحتمال الخبري بوصفه غموضًا نحويًا لا ادعاءً غير مسند عن المخطوطات، والثانية تذكر التكرار الفعلي للفعل في المواضع الثلاثة. ولا يتغير معنى المقطع أو مرجع «المسحة» أو الضمائر.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:26:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'المتن ينقل عناصر اليونانية الأساسية بأمانة: «المسحة»، وضمير «منه»، وتكرار فعل μένω، والتعليم، وعمومية «كل شيء»، والتقابل بين الحق والكذب، ثم النداء الختامي. لكن الحاشية (ب) تصف الفعل بأنه مستعمل في «الموضعين» مع أنه يرد ثلاث مرات في الآية، والحاشية (أ) تقدّم الإمكان الخبري بوصفه قراءة مخطوطية، بينما صيغة μένετε نفسها تحتمل الأمر والخبر من حيث الصيغة؛ لذا ينبغي صوغها بوصفها احتمالًا نحويًا دون ادعاء غير متحقق عن المخطوطات.'
  naturalness: «تبقى فيكم» و«ابقوا فيه» أوضح في العربية الفصحى الحديثة من «تثبت فيكم» و«اثبتوا فيه»، إذ يتجنب «تثبت» احتمال فهمه بمعنى تتأكد أو تُثبِت، مع الحفاظ على تكرار جذر واحد يقابل μένω.
  terminology: «المسحة» مناسبة وتحفظ الاستعارة بلا تفسير عقائدي زائد. و«هي حق وليست كذبًا» عربية سليمة وتحافظ على المقابلة اليوحناوية. واستعمال «تبقى/ابقوا» يحفظ اتساق μένω في المواضع الثلاثة.
  issues:
  - severity: medium
    issue: الحاشية (أ) تنسب الفهم الخبري إلى «بعض المخطوطات».
    rationale: الصيغة اليونانية μένετε يمكن أن تُفهم أمرًا أو خبرًا بحسب التحليل النحوي والسياق؛ فلا ينبغي أن تنسب الحاشية هذا الاحتمال إلى شاهد مخطوطي من دون بيان نصي ثابت. يلزم الإبقاء على الغموض في الحاشية.
  - severity: medium
    issue: الحاشية (ب) تقول إن الفعل نفسه مستعمل «في الموضعين».
    rationale: 'فعل μένω يرد ثلاث مرات في الآية: μένει، وμένετε في الختام، مع أن بنية الحاشية ينبغي أن تشير إلى التكرار في الآية كلها. كما أن صياغة البدائل تكون أوضح بذكر «يمكث/امكثوا» بدل تكرار صياغة المتن.'
