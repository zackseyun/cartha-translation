  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: ar
  text: 'مَن يقول: «قد عرفتُه»[a]، ولا يحفظ وصاياه، فهو كاذب، وليس الحق فيه[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أنا أعرفه». تدل صيغة الفعل اليوناني على معرفة تحققت في السابق ولها أثر حاضر، ويمكن في العربية التعبير عنها ببساطة بصيغة المضارع.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «وليس الحق في هذا». أي: في هذا الشخص.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λέγων
  choice: مَن يقول
  rationale: اسم الفاعل المعرّف مستعمل استعمالًا اسميًا عامًا؛ و«مَن يقول» تعبير عربي طبيعي يحفظ العموم.
- source_word: ὅτι
  choice: علامتا الاقتباس
  rationale: تُدخل ὅτι هنا كلامًا مباشرًا، وعلامتا الاقتباس تؤديان هذا المعنى في العربية بوضوح.
- source_word: Ἔγνωκα
  choice: قد عرفتُه
  rationale: الفعل في صيغة التام يدل على معرفة تحققت ولها أثر حاضر؛ وتفيد «قد» هذا التحقق، مع بقاء «أعرفه» بديلًا عربيًا أبسط.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: وصاياه
  rationale: «الوصايا» المقابل الكتابي الطبيعي لـἐντολάς، وتحفظ صلته باستعمال يوحنا للأوامر الإلهية.
- source_word: μὴ τηρῶν
  choice: ولا يحفظ
  rationale: يحفظ المعنى المستمر لصيغة المضارع ودلالة τηρέω على مراعاة الوصايا والعمل بها، من غير اختزالها في لفظ تفسيري محض مثل «يطيع».
- source_word: ψεύστης
  choice: كاذب
  rationale: خبر اسمي يصف الشخص مباشرة، وهو المقابل العربي الطبيعي الدقيق.
- source_word: ἐν τούτῳ
  choice: فيه
  rationale: يعود اسم الإشارة في السياق إلى الشخص المذكور؛ والضمير هو الصياغة العربية الطبيعية، مع التنبيه إلى الصياغة الأصرح في الحاشية.
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: ليس الحق
  rationale: صياغة موجزة تحفظ أداة التعريف والكثافة الأخلاقية واللاهوتية لعبارة «الحق» في كتابات يوحنا.
theological_decisions:
- issue: مرجع αὐτόν / αὐτοῦ
  choice: 'الإبقاء على الضميرين: «عرفتُه» و«وصاياه»'
  alternative: التصريح بـ«الله» أو «المسيح»
  rationale: السياق المباشر يرجح الإشارة إلى الله، مع وثاقة الصلة بين الله والابن في لاهوت يوحنا؛ لذلك لا تُحسم الإشارة بما يتجاوز لفظ النص.
- issue: دلالة المعرفة في Ἔγνωκα
  choice: «قد عرفتُه» بما يفيد معرفة تحققت وبقي أثرها
  alternative: «أنا أعرفه»
  rationale: يحفظ الاختيار جانبًا من دلالة صيغة التام وعلاقة المعرفة المستمرة، من غير أن يحصرها في الإدراك الذهني أو يحمّلها معنى صوفيًا زائدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «مَن يقول» للعموم، و«يحفظ وصاياه» حفاظًا على العبارة اليوحناوية المألوفة، مع تجنب التصريح بمرجع الضمير حيث أبقاه الأصل ضمنيًا.
