reference: 1 John 4:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: ar
  text: بهذا[a] اكتملت المحبة معنا[b]، لكي تكون لنا ثقة[c] في يوم الدينونة، لأنه كما هو[d]، هكذا نحن أيضًا في هذا العالم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في هذا» أو «على هذا النحو».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمتها: «بيننا»؛ فالعبارة قد تشير إلى المحبة في علاقتها بنا أو في وسطنا.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «جرأة»؛ والمقصود ثقة حرة من الخوف.'
    reason: lexical_alternative
  - marker: d
    text: يرجَّح أن الضمير «هو» يشير إلى يسوع، ويرى بعضهم أنه يشير إلى الله بوجه أعم.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: بهذا
  rationale: تحافظ «بهذا» على الإشارة التي يمكن أن تتجه إلى ما يلي، وتنسجم مع التعليل اللاحق، مع إبقاء «في هذا» بديلًا ممكنًا في الحاشية.
- source_word: τετελείωται
  choice: قد تكمَّلت
  rationale: تنقل صيغة التام المبني للمجهول بوصفها فعلًا بلغ غايته وله نتيجة مستمرة، وتحافظ على صلة اللفظ بفكرة الكمال في السياق.
- source_word: ἡ ἀγάπη
  choice: المحبة
  rationale: المقابل العربي الطبيعي المباشر، من غير حصرها في محبة الله لنا أو محبتنا له.
- source_word: μεθ’ ἡμῶν
  choice: معنا
  rationale: تنقل المعنى الأساسي لحرف الجر μετά مع المضاف إليه، ولا تحسم هل المقصود المحبة في المؤمنين أم بينهم أم في علاقة الله بهم.
- source_word: ἵνα
  choice: لكي
  rationale: تعبّر بوضوح عن الغاية أو النتيجة المقصودة.
- source_word: παρρησίαν
  choice: ثقة
  rationale: في هذا السياق الأخروي تدل الكلمة على حرية واطمئنان بلا خوف أمام الدينونة؛ و«ثقة» أوضح في العربية المعاصرة، مع ذكر «جرأة» في الحاشية.
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: في يوم الدينونة
  rationale: صياغة عربية راسخة وواضحة للتعبير الأخروي، وتحافظ على حرف الجر اليوناني.
- source_word: ὅτι
  choice: لأن
  rationale: تبيّن القوة السببية التي تجعل مماثلتنا له أساس الثقة.
- source_word: καθὼς ἐκεῖνός ἐστιν
  choice: كما هو
  rationale: تحافظ على الضمير غير المصرّح بمرجعه وعلى زمن الحاضر، كما في اليونانية.
- source_word: καὶ ἡμεῖς ἐσμεν
  choice: هكذا نحن أيضًا
  rationale: تنقل الارتباط المقارن بين καθώς وκαί بصياغة عربية طبيعية.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: في هذا العالم
  rationale: المقابل السياقي الطبيعي لـκόσμος، ويشير إلى مجال الوجود الحاضر.
theological_decisions:
- issue: مرجع الضمير في ἐκεῖνος
  choice: إبقاء الضمير «هو» دون تسمية مرجعه في المتن، مع ترجيح الإشارة إلى المسيح/الابن في الحاشية
  alternative: فهم الضمير على أنه يشير إلى الله بوجه أعم
  rationale: استعمال ἐκεῖνος في رسالة يوحنا الأولى يرجّح الإشارة إلى يسوع، لكن النص نفسه يورد ضميرًا بلا اسم صريح؛ لذلك يحافظ المتن على هذا القدر من الإبهام.
- issue: معنى اكتمال المحبة
  choice: المحبة تبلغ غايتها في علاقتها بالمؤمنين، وينتج عن ذلك ثقتهم يوم الدينونة
  alternative: أن المقصود حصرًا كمال محبتنا لله، أو حصرًا اكتمال محبة الله لنا
  rationale: التركيب اليوناني لا يفرض اتجاهًا واحدًا للمحبة، ولذلك لا ينبغي أن تضيف الترجمة تحديدًا لاهوتيًا غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «الدينونة» لأنها مألوفة في السياق الكتابي، و«ثقة» لأنها أوضح للقارئ المعاصر من «جرأة» في مقام الوقوف أمام الحكم. أُبقي تركيب «المحبة معنا» قريبًا من اليونانية للمحافظة على الغموض المقصود، مع توضيح البديل في الحاشية.
