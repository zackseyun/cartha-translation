  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: ar
  text: 'ولدينا منه هذه الوصية: أن يحبَّ من يحب الله أخاه[a] أيضًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أخاه أو أخته». يقول النص اليوناني «أخاه» بصيغة المفرد المذكر، ويمكن أن تُستعمل هذه الصيغة استعمالًا تمثيليًا للدلالة على مؤمن أو مؤمنة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: الوصية
  rationale: تحفظ القوة الأخلاقية والسلطان الملزم للكلمة في الاستعمال اليوحناوي، وهي صياغة عربية مألوفة في هذا السياق.
- source_word: ἀπ’ αὐτοῦ
  choice: منه
  rationale: تحافظ على الضمير الوارد في اليونانية بدل التصريح باسم الله، مع وضوح عوده إلى الله من السياق المباشر.
- source_word: ἵνα
  choice: أن
  rationale: تقدّم مضمون الوصية هنا، لا غايتها، ولذلك فـ«أن» هي المقابل العربي الطبيعي.
- source_word: ὁ ἀγαπῶν τὸν θεόν
  choice: من يحب الله
  rationale: تنقل اسم الفاعل المعرّف بصياغة عربية عامة وطبيعية من غير إدخال تقييد غير موجود في المصدر.
- source_word: ἀγαπᾷ
  choice: يحب
  rationale: يُفهم الإلزام من كون العبارة مضمون «الوصية»، فلا حاجة إلى إضافة «ينبغي أن»؛ وهذا يحفظ إيجاز اليونانية وقوتها.
- source_word: ἀδελφὸν αὐτοῦ
  choice: أخاه
  rationale: تحافظ على المفرد المذكر في النص اليوناني، مع بيان دلالته التمثيلية في الحاشية.
- source_word: καὶ
  choice: أيضًا
  rationale: 'تنقل القوة الإضافية للرابط الثاني: محبة الأخ تضاف إلى محبة الله ولا تنفصل عنها.'
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: يحب
  rationale: يحافظ على الاتساق اللفظي والموضوعي بين فعلي المحبة في الآية.
theological_decisions:
- issue: الدلالة الجندرية للمفرد المذكر ἀδελφὸν αὐτοῦ
  choice: إبقاء «أخاه» في المتن مع توضيح الدلالة الشاملة في الحاشية.
  alternative: «أخاه أو أخته» أو «أخاه في الإيمان»
  rationale: الأصل اليوناني مذكر مفرد، وقد يُستعمل استعمالًا تمثيليًا للمؤمنين عمومًا. يحفظ المتن صورة المصدر، بينما تمنع الحاشية فهمها على أنها تستبعد المؤمنات.
- issue: قوة الإلزام في ἀγαπᾷ بعد ἵνα
  choice: ترجمة الفعل «يحب» ضمن صياغة مضمون الوصية.
  alternative: «ينبغي أن يحب» أو «يجب أن يحب»
  rationale: السياق النحوي، ولا سيما لفظ «الوصية»، يحمل معنى الإلزام بوضوح. الصياغة العربية المباشرة لا تحوّل العبارة إلى مجرد خبر، ولا تزيد درجة الإلزام على النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «هذه هي الوصية التي لنا منه» للحفاظ على بنية المصدر وإبرازه، مع تجنب التفسير الزائد في المتن.
