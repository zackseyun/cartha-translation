  text: The one who does not love has not known God[a], because God is love.
translation:
  language: ar
  text: مَن لا يحبّ لم يعرف الله[a]، لأن الله محبة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَن لا يحبّ لا يعرف الله». وصيغة الماضي اليونانية قد تُنقل بالمضارع في هذا السياق، لكن «لم يعرف» تحافظ على معنى أنه لم يدخل في معرفة الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: مَن لا يحبّ
  rationale: صيغة «مَن» مع المضارع تعبّر طبيعيًا في العربية عن الشخص المتصف بعدم المحبة، وتحفظ الدلالة العامة والاستمرارية التي يحملها اسم الفاعل اليوناني في هذا السياق.
- source_word: ἀγαπῶν
  choice: يحبّ
  rationale: اختير الفعل من الجذر نفسه المستعمل في «محبة» للمحافظة على الصلة اللفظية بين ἀγαπῶν وἀγάπη.
- source_word: οὐκ ἔγνω
  choice: لم يعرف
  rationale: «لم» مع المضارع ترجمة عربية طبيعية للماضي المنفي، وتفيد أنه لم يدخل في معرفة الله؛ ولا تحصر المعرفة في الإدراك الذهني.
- source_word: τὸν θεόν
  choice: الله
  rationale: المفعول به المباشر للفعل ἔγνω، وترجمته العربية المعيارية «الله».
- source_word: ὅτι
  choice: لأن
  rationale: تدخل هنا على علة القول السابق، ولذلك تُظهر «لأن» العلاقة السببية بوضوح.
- source_word: ὁ θεὸς
  choice: الله
  rationale: هو مبتدأ الجملة الاسمية، والاسم الإلهي في العربية لا يحتاج إلى أداة تعريف إضافية.
- source_word: ἀγάπη
  choice: محبة
  rationale: اسم مجرد واقع خبرًا، وتُبقي «محبة» الصلة الاشتقاقية بالفعل «يحبّ» ظاهرة، من غير إضعاف العبارة إلى مجرد «مُحبّ».
- source_word: ἐστίν
  choice: 'الجملة الاسمية: «الله محبة»'
  rationale: العربية الفصحى لا تُظهر فعل الكينونة عادة في الجملة الاسمية الحاضرة؛ فحذف «هو» أو «يكون» هو المقابل الطبيعي لفعل الربط اليوناني هنا.
theological_decisions:
- issue: قوة العبارة «الله محبة»
  choice: الإبقاء على «الله محبة» بوصف «الله» مبتدأ و«محبة» خبرًا، من غير تحويلها إلى تعريف عكسي شامل.
  alternative: الله مُحبّ؛ أو المحبة هي الله
  rationale: تركيب اليونانية يجعل «الله» الموضوع و«محبة» الخبر. وتحفظ الصياغة الاسمية الثقل اللاهوتي والصلة اللفظية داخل الآية، فيما تضعف «الله مُحبّ» دلالة الاسم، ويعكس قول «المحبة هي الله» اتجاه الإسناد خطأ.
- issue: دلالة معرفة الله
  choice: «لم يعرف الله» بمعنى أنه لم يدخل في معرفته، وهي معرفة علائقية تظهر في السلوك.
  alternative: لا يعرف الله؛ أو لم يفهم الله
  rationale: الفعل ἔγνω ماضٍ يوناني يمكن أن يبرز عدم تحقق المعرفة. وتحفظ «لم يعرف» هذه الدلالة من غير اختزال المعرفة إلى فهم ذهني، بينما يمكن توضيح البديل العربي الأبسط في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة وذات نبرة كتابية كريمة. استُعملت «مَن» للجنس من غير إدخال تمييز جندري غير موجود في الأصل، وحُفظ التوازي الاشتقاقي بين «يحبّ» و«محبة».
