  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: ar
  text: مَن يعترف بأن يسوع هو ابن الله، فالله يثبت فيه، وهو في الله.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فالله يقيم فيه، وهو يقيم في الله». الفعل اليوناني μένω من الألفاظ المحورية في كتابات يوحنا، ويمكن أن يعني «يثبت» أو «يقيم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: مَن
  rationale: «مَن» اسم شرط عام طبيعي في العربية، ينقل معنى «كل من» من غير إطالة.
- source_word: ὁμολογήσῃ
  choice: يعترف
  rationale: ينقل معنى الإقرار الصريح بحقيقة تخص يسوع، ويحافظ على الثقل اللاهوتي للفعل في سياق يوحنا.
- source_word: Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ
  choice: يسوع هو ابن الله
  rationale: إثبات الضمير «هو» يوضح الجملة الاسمية ويحافظ على قوة اللقب المسيحاني «ابن الله».
- source_word: ἐν αὐτῷ μένει
  choice: يثبت فيه
  rationale: «يثبت» لفظ عربي واضح يحفظ دلالة الاستمرار والاستقرار العلائقي التي يحملها μένω في كتابات يوحنا.
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: وهو في الله
  rationale: يحافظ على حذف الفعل في الشطر الثاني كما في اليونانية، مع وضوح أن «يثبت» مفهوم من الشطر الأول.
theological_decisions:
- issue: الثبوت المتبادل
  choice: فالله يثبت فيه، وهو في الله
  alternative: فالله يقيم فيه، وهو يقيم في الله
  rationale: تحافظ الصياغة على التبادل وعلى حذف الفعل في الشطر الثاني، من غير تفسير طبيعة هذا الاتحاد أو اختزاله.
- issue: اللقب المسيحاني
  choice: ابن الله
  alternative: ابنٌ لله
  rationale: الصياغة المعرفة بالإضافة تحفظ القوة اللقبية لعبارة ὁ υἱὸς τοῦ θεοῦ ولا تضيف تفسيرًا عقائديًا إلى النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يثبت» للمحافظة على المصطلح اليوحناوي ودلالة الاستمرار، ووُضع رابط الشرط «فـ» لتكون الجملة طبيعية في العربية.
