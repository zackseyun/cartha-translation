  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: ar
  text: لم يرَ أحدٌ اللهَ قطّ. إن أحببنا بعضنا بعضًا، فالله يثبت فينا، ومحبته[a] قد تكمّلت فينا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن يُفهم التعبير بمعنى: «محبتنا له». فالإضافة في اليونانية قد تدل على محبة الله لنا أو محبتنا نحن لله، لكن السياق يرجّح محبة الله.'
    reason: غموض نحوي وتفسيري أصيل في عبارة ἡ ἀγάπη αὐτοῦ.
  - marker: b
    text: 'أي: بلغت كمالها فينا.'
    reason: بديل معجمي يوضح معنى τετελειωμένη بوصفه بلوغًا للكمال أو الاكتمال.
lexical_decisions:
- source_word: τεθέαται
  choice: يرَ
  rationale: ينقل معنى الرؤية أو المعاينة بصياغة عربية طبيعية، وتؤدي «لم... قطّ» مع πώποτε قوة النفي الممتد إلى كل وقت.
- source_word: πώποτε
  choice: قطّ
  rationale: تأتي مع النفي لتفيد «في أي وقت مضى»، وهي موجزة وفصيحة في العربية المعاصرة.
- source_word: ἐὰν ἀγαπῶμεν
  choice: إن أحببنا
  rationale: يحفظ الشرط الذي تعبّر عنه ἐάν مع المضارع المنصوب، من غير تحميل الصيغة معنى زائدًا.
- source_word: ἀλλήλους
  choice: بعضنا بعضًا
  rationale: تعبير عربي واضح وطبيعي عن التبادل بين المؤمنين.
- source_word: μένει
  choice: يثبت
  rationale: يحفظ الدلالة اليوحناوية على الاستمرار والإقامة في علاقة، وهو أفصح هنا من «يسكن» التي قد تضيق المعنى إلى السكنى وحدها.
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: محبته
  rationale: يحافظ على إيجاز اليونانية وعلى إمكان فهم الإضافة أساسًا على أنها محبة الله الصادرة منه، مع بيان الوجه الآخر في الحاشية.
- source_word: τετελειωμένη ἐστιν
  choice: قد تكمّلت
  rationale: ينقل حالة الكمال الناتجة عن فعل تمّ، كما في التركيب اليوناني الدال على نتيجة قائمة، ويحافظ على الصلة اللفظية بجذر الكمال.
- source_word: ἐν ἡμῖν
  choice: فينا
  rationale: يحافظ على تكرار العبارة اليونانية وعلى موضوع ثبات الله وعمل محبته في المؤمنين.
theological_decisions:
- issue: دلالة «ἡ ἀγάπη αὐτοῦ»
  choice: محبة الله لنا تتكمّل فينا
  alternative: محبتنا لله تتكمّل فينا
  rationale: السياق القريب، ولا سيما الآيتان 10–11، يشدد على محبة الله المبادرة؛ لذلك رُجّح معنى المحبة الصادرة من الله، مع إبقاء الاحتمال الآخر في الحاشية لأن تركيب الإضافة اليوناني يحتمله.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «يثبت» للمحافظة على المصطلح اليوحناوي المتكرر، و«قد تكمّلت» لإبراز النتيجة القائمة من غير اللجوء إلى تعبير مذهبي خاص.
