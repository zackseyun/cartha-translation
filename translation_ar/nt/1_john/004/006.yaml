reference: 1 John 4:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: ar
  text: نَحْنُ مِنَ اللهِ. مَنْ يَعْرِفُ اللهَ يُصْغِي إِلَيْنَا، وَمَنْ لَيْسَ مِنَ اللهِ لَا يُصْغِي إِلَيْنَا.[a] بِهَذَا نَعْرِفُ رُوحَ الْحَقِّ[b][c] وَرُوحَ الضَّلَالِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يَسْمَعُنَا» في الموضعين. يمكن أن يدل الفعل اليوناني على السماع، لكنه هنا يُرجَّح أن يعني الإصغاء المتقبِّل للشهادة الرسولية.'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن عبارة «روح الحق» تشير هنا إلى الروح القدس، مع أن الصياغة يمكن أن تُفهم بمعنى أعم.
    reason: alternative_reading
  - marker: c
    text: 'تَرِد عبارة «روح الحق» أيضًا في يوحنا 14: 17؛ 15: 26؛ 16: 13.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: مِنَ اللهِ
  rationale: تحفظ «مِن» دلالة ἐκ على المصدر أو المنشأ، بدل تحويلها إلى مجرد ملكية.
- source_word: ὁ γινώσκων τὸν θεόν
  choice: مَنْ يَعْرِفُ اللهَ
  rationale: صياغة عربية طبيعية تحافظ على المعنى العام والصفة المستمرة لاسم الفاعل اليوناني.
- source_word: ἀκούει ἡμῶν
  choice: يُصْغِي إِلَيْنَا
  rationale: السياق لا يصف مجرد السماع الحسي، بل تقبّل الشهادة الرسولية والانتباه إليها، من غير المبالغة بترجمتها «يطيعنا».
- source_word: ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: مَنْ لَيْسَ مِنَ اللهِ
  rationale: تحافظ الصياغة على العموم وعلى دلالة المصدر في ἐκ، وتأتي عربية واضحة وموازية للعبارة السابقة.
- source_word: ἐκ τούτου
  choice: بِهَذَا
  rationale: تؤدي العبارة الاستدلالية المألوفة عند يوحنا، إذ تجعل ما سبق معيارًا للمعرفة والتمييز.
- source_word: γινώσκομεν
  choice: نَعْرِفُ
  rationale: تحافظ على الصلة اللفظية بالفعل γινώσκω الوارد قبلها، مع أن السياق يتضمن معنى التمييز.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: رُوحَ الْحَقِّ
  rationale: ترجمة مباشرة تحتمل في العربية الإشارة إلى الروح القدس، كما تحتمل من حيث الصياغة قراءة أعم؛ ويبيّن الحاشية هذا الاحتمال دون حسم زائد.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: رُوحَ الضَّلَالِ
  rationale: «الضلال» يقابل «الحق» بوضوح، وينقل معنى πλάνη بوصفه انحرافًا عن الحق وتأثيرًا مضلِّلًا.
theological_decisions:
- issue: هل «روح الحق» لقب للروح القدس أم تعبير أعم؟
  choice: رُوحَ الْحَقِّ، مع بيان الاحتمال في الحاشية
  alternative: الرُّوحَ، رُوحَ الْحَقِّ؛ أو فهم العبارة بمعنى روح يتصف بالحق
  rationale: الاستعمال اليوحناوي والسياق المباشر لاختبار الأرواح يرجحان الإشارة إلى الروح القدس، لكن العربية لا تستعمل الحروف الكبيرة لتمييز هذا الترجيح، ولذلك تُحفظ الصياغة الأصلية ويُشرح الاحتمال في الحاشية.
- issue: هل ἀκούει ἡμῶν يعني مجرد السماع أم التقبّل المستجيب للشهادة الرسولية؟
  choice: يُصْغِي إِلَيْنَا
  alternative: يَسْمَعُ لَنَا / يَسْمَعُنَا
  rationale: الفعل في هذا السياق يدل على الاستماع المتقبّل للشهادة، لكن «يصغي» لا يضيف معنى الطاعة الصريحة الذي يتجاوز اللفظ.
translation_notes:
  register: العربية فصحى حديثة واضحة وموقرة. استُعملت جمل متوازية قصيرة تعكس بناء النص اليوناني، وحُفظت المقابلة بين «روح الحق» و«روح الضلال» من غير إدخال تعبير طائفي أو تفسير عقائدي زائد.
