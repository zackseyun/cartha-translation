  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: ar
  text: ونحن قد رأينا ونشهد أن الآب أرسل الابنَ مخلِّصَ العالم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكثر: «الآب أرسل الابنَ، مخلِّصَ العالم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθεάμεθα
  choice: قد رأينا
  rationale: ينقل صيغة التام اليوناني فعل الرؤية الذي تمّ وبقي أثره، مع الحفاظ على قوة المعاينة بلغة عربية طبيعية.
- source_word: μαρτυροῦμεν
  choice: نشهد
  rationale: يعبر المضارع عن شهادة مستمرة نابعة من المعاينة السابقة، وهو اللفظ العربي المباشر والمألوف.
- source_word: ὅτι
  choice: أن
  rationale: تُدخل مضمون الشهادة، لا سببها.
- source_word: ὁ πατήρ
  choice: الآب
  rationale: يحفظ اللقب العلائقي الإلهي في الاستعمال اليوحناوي من غير توسعة تفسيرية.
- source_word: ἀπέσταλκεν
  choice: أرسل
  rationale: الفعل العربي الماضي هو التعبير الطبيعي عن الإرسال المكتمل؛ وتُفهم دلالته المستمرة من السياق، بينما قد يوحي «قد أرسل» بتوكيد زائد غير لازم.
- source_word: τὸν υἱόν
  choice: الابن
  rationale: يحفظ أداة التعريف واللقب العلائقي من غير إضافة ضمير ملكية غير موجود صراحة في اليونانية.
- source_word: σωτῆρα
  choice: مخلِّصًا
  rationale: هو المقابل العربي الراسخ والدقيق لمعنى المنقذ أو المخلّص في هذا السياق.
- source_word: τοῦ κόσμου
  choice: للعالم
  rationale: تؤدي اللام علاقة المخلِّص بمن يخلّصهم بصورة عربية طبيعية، مع إبقاء نطاق «العالم» واسعًا كما في الأصل.
- source_word: καὶ ἡμεῖς
  choice: ونحن
  rationale: يحفظ الواو وتركيز الضمير الصريح بدرجة طبيعية في العربية.
- source_word: σωτῆρα τοῦ κόσμου
  choice: مخلِّصًا للعالم
  rationale: يحافظ على النصب البدلي أو الوصفي في الأصل من غير إدخال «بصفته»، التي قد تزيد في تفسير العلاقة.
theological_decisions:
- issue: نطاق عبارة «مخلِّص العالم»
  choice: الإبقاء على التعبير الواسع «مخلِّصًا للعالم» من غير تقييد
  alternative: مخلِّصًا للمختارين، أو مخلِّصًا محتملًا للعالم
  rationale: النص يذكر اللقب والنطاق مباشرة، ولا يحدد هنا نظرية بعينها للخلاص أو للكفارة.
- issue: لغة العلاقة بين الآب والابن
  choice: الآب والابن
  alternative: الله الآب ويسوع المسيح
  rationale: يحفظ اللقبين اللذين يستعملهما النص نفسه، من غير إضافة أسماء أو ألقاب غير واردة في هذه الآية.
- issue: العلاقة النحوية بين «الابن» و«مخلِّصًا للعالم»
  choice: 'صياغتها حالًا أو وصفًا منصوبًا: «أرسل الابن مخلِّصًا للعالم»'
  alternative: «أرسل الابن بصفته مخلِّص العالم» أو الصياغة الحرفية «أرسل الابن، مخلِّص العالم»
  rationale: الصياغة المختارة طبيعية في العربية وتحفظ إمكان فهم «مخلِّصًا» بوصفه بيانًا لدور الابن، مع إثبات البديل الأقرب حرفيًا في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «ونحن قد رأينا ونشهد» لإبراز المعاينة السابقة والشهادة المستمرة، وحُفظت ألقاب «الآب» و«الابن» والصياغة اللاهوتية الواسعة من غير تضييق مذهبي.
