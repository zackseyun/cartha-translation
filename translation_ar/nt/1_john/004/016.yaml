  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: ar
  text: ونحن قد عرفنا المحبة التي لله فينا[a] وآمنا بها. الله محبة، ومن يثبت في المحبة يثبت في الله، والله يثبت فيه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُفهم: «المحبة التي لله بيننا». وقد يدل التعبير اليوناني على المحبة الحاضرة في المؤمنين أو الظاهرة في جماعتهم؛ أما «محبة الله لنا» فهي معنى محتمل في السياق، لكنها أقل حرفية.'
    reason: alternative_reading
  - marker: b
    text: الضمير في اليونانية مفرد مذكر، ويعود إلى كل من يثبت في المحبة، فهو ذو دلالة عامة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: قد عرفنا
  rationale: صيغة التام اليونانية تدل على معرفة تحققت وما زال أثرها قائمًا؛ وتؤدي «قد عرفنا» هذا المعنى بعبارة عربية واضحة.
- source_word: πεπιστεύκαμεν
  choice: آمنا بها
  rationale: يحافظ الفعل الماضي مع سياق «قد» على معنى الإيمان المستقر الناتج عن فعل سابق، والضمير «بها» يعيد بوضوح إلى المحبة التي هي مفعول الفعلين في اليونانية.
- source_word: τὴν ἀγάπην
  choice: المحبة
  rationale: ترجمة مباشرة للاسم المعرّف، وتشير إلى محبة محددة سبق الحديث عنها في السياق.
- source_word: ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: التي لله فينا
  rationale: تحافظ هذه الصياغة على قوة ἐν المكانية وعلى إمكان فهمها بوصفها محبة حاضرة في المؤمنين، من غير تحويلها في المتن إلى معنى «لنا» أو «نحونا».
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: الله محبة
  rationale: صياغة عربية موجزة ومباشرة تطابق جملة الخبر الاسمي اليونانية من غير شرح زائد.
- source_word: ὁ μένων
  choice: من يثبت
  rationale: «يثبت» لفظ عربي طبيعي يحفظ دلالة μένω على الاستمرار والبقاء، كما يلائم الاستعمال اليوحناوي المتكرر.
- source_word: ἐν τῇ ἀγάπῃ
  choice: في المحبة
  rationale: يحفظ صورة الوجود ضمن مجال المحبة، مع تعريف الاسم كما في اليونانية.
- source_word: ἐν τῷ θεῷ μένει
  choice: يثبت في الله
  rationale: يحافظ على حرف الجر وعلى تكرار فعل μένω، وهو مهم لموضوع الثبات المتبادل.
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: والله يثبت فيه
  rationale: يحافظ على التوازي وعلى ضمير المفرد المذكر في الأصل، العائد إلى «من يثبت» بمدلول تمثيلي عام.
theological_decisions:
- issue: دلالة ἐν ἡμῖν في العبارة الأولى
  choice: «فينا» في المتن
  alternative: «بيننا» للدلالة الجماعية، أو «لنا/نحونا» للدلالة على محبة الله الموجهة إلينا
  rationale: المعنى المكاني «فينا» هو الأقرب إلى اللفظ اليوناني وإلى موضوع السكن المتبادل في السياق. ومع ذلك، يمكن أن يشمل التعبير حضور المحبة داخل الجماعة، لذلك تُذكر «بيننا» في الحاشية، أما «لنا» فهي تفسير غائي أكثر من كونها مقابلة مباشرة لحرف ἐν.
- issue: مدلول الضمير αὐτῷ
  choice: «فيه» مع الإبقاء على صيغة المفرد المذكر
  alternative: «في ذلك الإنسان» أو صياغة جمع شاملة
  rationale: الضمير اليوناني مفرد مذكر ويعود إلى الاسم الموصول ذي القوة العامة. تحفظ الترجمة بنيته، وتوضح الحاشية أن المقصود كل من يثبت في المحبة لا الرجال وحدهم.
- issue: العلاقة المتبادلة بين الثبات في الله وثبات الله في الإنسان
  choice: الإبقاء على الجملتين المتوازيتين من غير تفسير
  alternative: شرح الثبات بأنه اتحاد أو سكن روحي على نحو تفصيلي
  rationale: النص يقرر الثبات المتبادل بلغة موجزة ولا يحدد آليته هنا؛ لذلك لا ينبغي للترجمة أن تستورد تحديدًا لاهوتيًا زائدًا.
translation_notes:
  register: استُخدمت عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ تكرار «يثبت» لإبراز الترابط اللفظي في الأصل، وتُركت عبارة «التي لله فينا» على قدر من الكثافة المقصودة لصون الاحتمال المكاني واللاهوتي بدل حسمه بتفسير واحد.
