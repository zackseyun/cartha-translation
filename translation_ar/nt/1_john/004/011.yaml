  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: ar
  text: أيها الأحبّاء، إن كان الله قد أحبّنا هكذا[a]، فعلينا نحن أيضًا أن نحبّ بعضنا بعضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بما أن الله أحبّنا بهذه الطريقة». يستعمل النص اليوناني صيغة شرطية («إن كان»)، ويبدو من السياق أنها تفترض تحقق الشرط.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητοί
  choice: أيها الأحبّاء
  rationale: نداء لجماعة بصيغة تحمل معنى المحبة، ويحافظ على الصلة اللفظية بفعل «أحبّ» المتكرر في الآية، مع أسلوب عربي طبيعي كريم.
- source_word: εἰ
  choice: إن كان
  rationale: يحافظ على الصيغة الشرطية في اليونانية، مع أن السياق يفترض حقيقة محبة الله ولا يشكك فيها.
- source_word: οὕτως
  choice: هكذا
  rationale: تحتمل الإشارة إلى كيفية محبة الله أو مقدارها، وتعود طبيعيًا إلى السياق السابق من غير حسم زائد.
- source_word: ὁ θεὸς
  choice: الله
  rationale: نقل مباشر وطبيعي للفاعل.
- source_word: ἠγάπησεν
  choice: قد أحبّ
  rationale: ينقل الفعل الماضي بوصفه فعلًا متحققًا، ويحافظ على تكرار مفردات المحبة في الآية.
- source_word: ἡμᾶς
  choice: نا
  rationale: ضمير المفعول به للجمع، منقول بصورة عربية طبيعية في «أحبّنا».
- source_word: καὶ ἡμεῖς
  choice: نحن أيضًا
  rationale: يحافظ على عطف الجماعة المخاطَبة وعلى توكيد الضمير الصريح في الأصل.
- source_word: ὀφείλομεν
  choice: علينا
  rationale: يفيد الالتزام الأخلاقي الواجب من غير توسيع المعنى إلى مديونية حرفية أو تحويل العبارة إلى أمر مباشر.
- source_word: ἀλλήλους
  choice: بعضنا بعضًا
  rationale: التعبير العربي المألوف عن التبادل بين أفراد الجماعة.
- source_word: ἀγαπᾶν
  choice: أن نحبّ
  rationale: مصدر مؤول طبيعي بعد «علينا»، ويحافظ على اللفظ المحوري المتعلق بالمحبة.
theological_decisions:
- issue: دلالة العبارة الشرطية εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς
  choice: 'الإبقاء على الصيغة الشرطية: «إن كان الله قد أحبّنا هكذا»'
  alternative: «بما أن الله أحبّنا بهذه الطريقة»
  rationale: السياق يفترض أن محبة الله حقيقة ثابتة، لكن الكاتب يصوغ الاستدلال في صورة شرط بلاغي. إبقاء الشرط يصون بنية الأصل ولا يحوّله صراحةً إلى تعليل.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «أيها الأحبّاء» للنداء، و«فعلينا نحن أيضًا» لإبراز الالتزام وتوكيد الجماعة كما في الأصل، مع الحفاظ على التكرار المقصود لجذر «حبّ».
