base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: ar
  text: أيها الأحباء[a]، لا تصدّقوا كلَّ روح، بل اختبروا الأرواح لتروا هل هي من الله[b]، لأن أنبياء كذبة كثيرين قد خرجوا إلى العالم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا أحبّاء». واللفظ اليوناني يعني حرفيًا «أيها المحبوبون».'
    reason: lexical_alternative
  - marker: b
    text: أي اختبروا المصدر الروحي وراء الادعاءات النبوية؛ فالجملة التالية تتحدث عن «أنبياء كذبة» بوصفهم الناطقين بها من البشر.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: يا أحبّائي
  rationale: نداء جمع حميم يحفظ صلة اللفظ اليوناني بالمحبة، ويأتي طبيعيًا وموقرًا في العربية المعاصرة.
- source_word: παντὶ πνεύματι
  choice: كلَّ روح
  rationale: يحافظ على التعبير الروحي الصريح وعلى الإفراد ذي الدلالة العامة، من غير اختزاله في المعلّمين أو الأقوال.
- source_word: πιστεύετε
  choice: تصدّقوا
  rationale: يلائم سياق قبول الادعاءات على أنها حق، وهو هنا أوضح من «تؤمنوا» التي قد تُفهم بمعناها الديني الأوسع.
- source_word: δοκιμάζετε
  choice: اختبروا
  rationale: ينقل معنى الفحص للتحقق من الأصالة أو المصدر، مع الحفاظ على قوة صيغة الأمر.
- source_word: τὰ πνεύματα
  choice: الأرواح
  rationale: ترجمة مباشرة تحفظ الإطار فوق الطبيعي والتقابل السياقي مع الأنبياء الكذبة.
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: لتروا هل هي من الله
  rationale: يبين غرض الاختبار بأسلوب عربي طبيعي؛ والضمير «هي» يعود إلى جمع غير العاقل «الأرواح» وفق المطابقة العربية.
- source_word: ἐκ τοῦ θεοῦ
  choice: من الله
  rationale: ينقل بوضوح معنى المصدر أو المنشأ الذي تفيده ἐκ.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: أنبياء كذبة كثيرين
  rationale: يحافظ على المصطلح الكتابي المباشر، مع نصب الصفة والعدد لأن المركب اسم «أنّ» المؤخر.
- source_word: ἐξεληλύθασιν
  choice: قد خرجوا
  rationale: يحفظ صورة الخروج، وتفيد «قد» تحقق الفعل، بينما يوضح السياق أنهم صاروا ناشطين في العالم.
- source_word: εἰς τὸν κόσμον
  choice: إلى العالم
  rationale: ترجمة طبيعية تحافظ على سعة مدلول κόσμος من غير إضافة تفسير مثل «نظام العالم».
theological_decisions:
- issue: مرجع «الأرواح»
  choice: أرواح أو مصادر روحية وراء الادعاءات النبوية، يُكشف عنها من خلال الأنبياء البشر
  alternative: المعلّمون البشر وحدهم، أو الأقوال النبوية بوصفها أفكارًا مجردة
  rationale: يفرق النص بين «الأرواح» و«الأنبياء الكذبة»، ولذلك تُحفظ لغته الروحية من غير حصر المقصود في تفسير واحد؛ وتوضح الحاشية الصلة العملية بين المصدر الروحي والناطق البشري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «يا أحبّائي» بوصفه نداءً حميمًا طبيعيًا، مع إبقاء «الروح/الأرواح» حرفيًا لصون الغموض المقصود والتوتر اللاهوتي في النص.
