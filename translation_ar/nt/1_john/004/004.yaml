  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: ar
  text: أَمَّا أَنْتُمْ فَمِنَ اللهِ، يَا أَيُّهَا الأَبْنَاءُ الصِّغَارُ، وَقَدْ غَلَبْتُمُوهُمْ[a]، لِأَنَّ الَّذِي فِيكُمْ أَعْظَمُ مِنَ الَّذِي فِي الْعَالَمِ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي إنكم غلبتم المعارضين المذكورين قبلًا، ولا سيما الأنبياء الكذبة.
    reason: cross_reference
  - marker: b
    text: أبقت اليونانية هوية الاثنين ضمنية. ويشير السياق على الأرجح إلى الله أو روحه في العبارة الأولى، وإلى الشرير الكامن وراء العالم في الثانية.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς
  choice: أَمَّا أَنْتُمْ
  rationale: الضمير مصرح به للتوكيد والمقابلة؛ وتحافظ «أما أنتم» على هذا البروز بصورة عربية طبيعية.
- source_word: ἐκ τοῦ θεοῦ
  choice: فَمِنَ اللهِ
  rationale: تفيد ἐκ المصدر أو الانتماء الناشئ من الله، و«من الله» هي المقابل العربي المباشر والطبيعي.
- source_word: τεκνία
  choice: يَا أَوْلَادِي الصِّغَارَ
  rationale: صيغة تصغير ودّية في خطاب يوحنا؛ وإضافة ضمير المتكلم تُظهر العلاقة الأبوية المفهومة من النداء، مع إبقاء معنى الصغر والحنان.
- source_word: νενικήκατε
  choice: وَقَدْ غَلَبْتُمُوهُمْ
  rationale: «قد» مع الماضي تنقل الإنجاز المتحقق ذي الأثر المستمر الذي تدل عليه صيغة التام اليونانية، و«غلب» ملائم لاستعمال يوحنا المتكرر.
- source_word: αὐτούς
  choice: ـهُمْ
  rationale: أُبقي الضمير دون التصريح بمرجعه، كما في اليونانية، مع توضيحه في الحاشية من السياق السابق.
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تقدم سبب غلبتهم بوضوح في العربية المعاصرة.
- source_word: μείζων
  choice: أَعْظَمُ
  rationale: تحافظ على المقارنة العامة في اليونانية ولا تحصرها في القوة وحدها كما قد تفعل «أقوى».
- source_word: ὁ ἐν ὑμῖν
  choice: الَّذِي فِيكُمْ
  rationale: تنقل العبارة الاسمية الشخصية مع إبقاء هوية المشار إليه ضمنية كما في الأصل.
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: الَّذِي فِي الْعَالَمِ
  rationale: توازي العبارة السابقة وتحفظ المقابلة البلاغية دون التصريح بهوية المشار إليه.
- source_word: κόσμῳ
  choice: الْعَالَمِ
  rationale: هو المقابل الأساسي لـ κόσμος، ويحفظ الدلالة اليوحناوية دون إدخال تفسير مثل «نظام العالم» في المتن.
theological_decisions:
- issue: هوية «الذي فيكم» و«الذي في العالم»
  choice: 'إبقاء العبارتين ضمنيتين في المتن: «الذي فيكم» و«الذي في العالم».'
  alternative: تعيين الأول صراحة بأنه الله أو الروح القدس، والثاني بأنه الشرير أو الشيطان.
  rationale: يرجح السياق هذه الهويات، لكن اليونانية لا تسميهما صراحة. إبقاء التعبير ضمنيًا يصون بلاغة النص وتوتره اللاهوتي دون تحميل المتن تفسيرًا زائدًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «أما أنتم» لإبراز الضمير اليوناني، وحُفظ التوازي بين «الذي فيكم» و«الذي في العالم». وُضعت العلامة [a] بعد الضمير الذي تحتاج الحاشية إلى تفسيره، والعلامة [b] بعد المقابلة التي تتناولها الحاشية.
