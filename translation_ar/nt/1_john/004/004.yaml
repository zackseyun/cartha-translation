  terminology: «الله»، «الأنبياء الكذبة»، «الشرير»، و«العالم» مصطلحات سليمة. أبقت الترجمة هوية «الذي فيكم» و«الذي في العالم» غير مصرّح بها في المتن، كما في اليونانية. والحاشيتان توضحان المرجع والسياق دون فرض تحديد عقائدي في النص.
  issues:
