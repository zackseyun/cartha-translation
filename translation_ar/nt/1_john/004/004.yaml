  source_fidelity: 'الترجمة دقيقة في بنية الآية ومعانيها الرئيسة: «من الله»، وتمام الغلبة بـ«قد غلبتموهم»، وسببها، والمقابلة بين «الذي فيكم» و«الذي في العالم». غير أن «أولادي الصغار» تضيف ضمير المتكلم («ـي») غير الموجود في τεκνία. وتجنّب هذه الإضافة أدق، مع إمكان الحفاظ على النداء الحنون.'
