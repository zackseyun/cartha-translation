reference: 1 John 4:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: ar
  text: 'بهذا أُظهرت محبة الله بيننا: أن الله قد أرسل ابنه الوحيد إلى العالم لكي نحيا به[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فينا». يمكن أن تدل العبارة اليونانية على ظهور محبة الله داخل المؤمنين أو بينهم بوصفهم جماعة.'
    reason: lexical_alternative
  - marker: b
    text: 'والصياغة التقليدية: «ابنه الوحيد المولود». تؤكد الكلمة اليونانية μονογενής فرادة الابن؛ وتحفظ عبارة «الوحيد المولود» التعبير الكنسي التاريخي.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: بهذا
  rationale: تعبير عربي طبيعي يحفظ وظيفة الصيغة اليوحناوية في تقديم الكيفية التي ظهرت بها المحبة، وتشرحها جملة «أن» التالية.
- source_word: ἐφανερώθη
  choice: أُظهرت
  rationale: يحفظ صيغة المبني للمجهول ومعنى صيرورة المحبة ظاهرة ومعلنة، بلغة عربية واضحة.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: محبة الله
  rationale: إضافة طبيعية في العربية، والمراد في السياق محبة الله التي صدرت عنه وتجلّت في إرساله الابن.
- source_word: ἐν ἡμῖν
  choice: بيننا
  rationale: ينقل المعنى الجماعي المحتمل، أي ظهور محبة الله في وسط الجماعة أو في علاقتها بنا، مع إثبات «فينا» في الحاشية بوصفه احتمالًا حقيقيًا.
- source_word: ὅτι
  choice: أن
  rationale: تقدّم مضمون الكيفية التي أُظهرت بها المحبة، بدل حصر العبارة في التعليل السببي.
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: ابنه الوحيد
  rationale: «الوحيد» تعبير عربي مباشر عن فرادة الابن ووحدانيته في هذه العلاقة، من غير أن يحمّل اللفظ اليوناني وحده تحديدًا لكيفية الولادة.
- source_word: ἀπέσταλκεν
  choice: قد أرسل
  rationale: «قد» مع الماضي تفيد تحقق الإرسال، وتؤدي بوضوح الدلالة الإنجازية للفعل التام اليوناني من غير صياغة عربية متكلفة.
- source_word: εἰς τὸν κόσμον
  choice: إلى العالم
  rationale: مقابل عربي مألوف يدل على العالم الذي أُرسل الابن إليه.
- source_word: ἵνα ζήσωμεν
  choice: لكي نحيا
  rationale: ينقل غرض الإرسال بصياغة عربية طبيعية، ولا يفرض على صيغة الاحتمال اليونانية معنى الشك.
- source_word: δι’ αὐτοῦ
  choice: به
  rationale: الباء هنا أوجز وأفصح في الدلالة على الوساطة أو السببية، أي أن حياتنا تتحقق بواسطة الابن.
theological_decisions:
- issue: دلالة μονογενής في وصف الابن
  choice: الابن الوحيد
  alternative: الابن الوحيد المولود؛ الابن الفريد
  rationale: يحفظ النص الرئيس فرادة علاقة الابن بالله من دون إدخال صياغة عقائدية لاحقة في المعنى المعجمي نفسه، بينما تذكر الحاشية الصياغة الكنسية التقليدية لما لها من أهمية تاريخية.
- issue: دلالة ἐν ἡμῖν
  choice: بيننا
  alternative: فينا
  rationale: «بيننا» تبرز ظهور محبة الله في وسط الجماعة، لكن التركيب اليوناني يحتمل أيضًا الظهور داخل المؤمنين؛ لذلك حُفظ البديل في الحاشية ولم يُحسم الغموض تأويليًا.
- issue: وساطة الابن في الحياة
  choice: نحيا به
  alternative: نحيا من خلاله
  rationale: الباء تنقل بإيجاز معنى διά مع المضاف إليه، أي الوساطة أو السببية، من غير تحديد زائد لطبيعة هذه الحياة في هذا الموضع.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت تراكيب مألوفة مثل «بهذا أُظهرت» و«لكي نحيا به»، مع الحفاظ على الإيجاز والبنية التفسيرية للآية. جميع علامات الحواشي مثبتة في المتن.
