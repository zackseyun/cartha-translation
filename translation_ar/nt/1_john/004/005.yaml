base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: ar
  text: هُمْ مِنَ الْعَالَمِ[a]؛ لِذَلِكَ يَتَكَلَّمُونَ انْطِلَاقًا مِنَ الْعَالَمِ، وَالْعَالَمُ يَسْمَعُ لَهُمْ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «هم من العالم ... ويتكلمون من العالم». يكرر الأصل اليوناني تعبير «من العالم»، مشددًا على المصدر أو المنشأ.'
    reason: lexical_alternative
  - marker: b
    text: «العالم» هنا هو النظام البشري المناوئ لله، لا الكون المخلوق في ذاته. و«يسمع لهم» تعني أنه يصغي إليهم ويتقبل كلامهم.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτοὶ
  choice: هُمْ
  rationale: الضمير يعود إلى الأنبياء الكذبة في السياق، ويحافظ موقعه في صدر الجملة على المقابلة مع «نحن» في الآية التالية من غير إضافة توكيد قد يبدو زائدًا.
- source_word: ἐκ τοῦ κόσμου
  choice: مِنَ الْعَالَمِ
  rationale: يحافظ حرف «مِن» على دلالة المصدر أو المنشأ في ἐκ، وعلى التكرار المحوري لفكرة صدورهم وكلامهم عن العالم.
- source_word: κόσμος
  choice: الْعَالَم
  rationale: اللفظ العربي المألوف يحفظ اتساع المصطلح اليوحناوي، بينما يوضح الهامش أن المراد هنا النظام البشري المناوئ لله لا الكون المخلوق في ذاته.
- source_word: διὰ τοῦτο
  choice: لِذَلِكَ
  rationale: تؤدي العلاقة السببية بوضوح وإيجاز، إذ يصل النص بين منشئهم ومصدر كلامهم.
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: مَا يَتَكَلَّمُونَ بِهِ يَصْدُرُ مِنَ الْعَالَمِ
  rationale: صياغة عربية طبيعية نسبيًا تُبقي معنى الكلام ودلالة المصدر في ἐκ، وتتجنب العبارة الحرفية الملتبسة «يتكلمون من العالم».
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: الْعَالَمُ يَسْمَعُ لَهُمْ
  rationale: «يسمع لهم» تدل في العربية على الإصغاء والقبول، لا على مجرد وصول الصوت إلى الأذن، وتحافظ على الفعل السمعي في الأصل.
theological_decisions:
- issue: دلالة κόσμος في السياق اليوحناوي
  choice: العالم بوصفه النظام البشري المنفصل عن الله والمناوئ له
  alternative: الكون المادي، أو البشر بمعنى محايد
  rationale: يقابل السياق بين مَن هم «من الله» ومَن هم «من العالم»، فالمقصود منشأ روحي وأخلاقي واتجاه متلقٍّ للكلام. أُبقي لفظ «العالم» في المتن منعًا لإدخال شرح تفسيري موسع فيه.
- issue: قوة التوكيد في αὐτοὶ
  choice: عدم إضافة «أنفسهم» في المتن
  alternative: هُمْ أَنْفُسُهُمْ مِنَ الْعَالَمِ
  rationale: يتحقق التباين الخطابي بوضع «هم» في أول الجملة، أما «أنفسهم» فقد توحي بتوكيد أشد مما يقتضيه السياق.
- issue: دلالة ἀκούει
  choice: السمع بمعنى الإصغاء والقبول
  alternative: يسمعهم بمعنى الإدراك السمعي المجرد
  rationale: السياق يصف تجاوب العالم معهم وقبوله كلامهم، ولذلك تؤدي عبارة «يسمع لهم» هذا المعنى من غير تحويله إلى شرح عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ التكرار المقصود للفظ «العالم» ولدلالة المصدر، مع إعادة بناء العبارة الوسطى لتكون مفهومة طبيعيًا بالعربية من غير حسم زائد للمعنى.
