  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: ar
  text: 'في هذا تكمن المحبة: ليس في أننا أحببنا الله، بل في أنه هو أحبنا وأرسل ابنه كفّارةً عن خطايانا[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذبيحةً تكفّر عن خطايانا»؛ أو: «استرضاءً عن خطايانا». يشير اللفظ اليوناني إلى تعامل الابن مع الخطايا بعمله الذبيحي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: في هذا تتجلّى المحبة
  rationale: ينقل التعبير اليوحناوي الذي يشير إلى ما يأتي بوصفه المظهر المحدِّد للمحبة، بصياغة عربية طبيعية تحفظ معنى التركيب دون جمود حرفي.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: لا في أن... بل في أن
  rationale: يحفظ المقابلة التي تعرّف موضع تجلّي المحبة، ولا يحوّلها إلى تعليل سببي.
- source_word: ἠγαπήκαμεν
  choice: أحببنا
  rationale: الماضي العربي هو الأنسب هنا؛ والسياق المقابل لفعل الله الحاسم يبيّن المقصود من الصيغة اليونانية التامة دون تركيب عربي ثقيل.
- source_word: αὐτὸς ἠγάπησεν ἡμᾶς
  choice: أنه هو أحبنا
  rationale: إثبات ضمير الفصل «هو» يُظهر توكيد αὐτός والمقابلة بين فعل البشر وفعل الله.
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: وأرسل ابنه
  rationale: ترجمة مباشرة وطبيعية تحفظ لغة الإرسال والبنوّة.
- source_word: ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: كفّارةً عن خطايانا
  rationale: «كفّارة» مصطلح عربي موجز ومألوف يدل على معالجة الخطايا بعمل ذبيحي، و«عن» تلائم الاستعمال القرباني مع περί.
theological_decisions:
- issue: دلالة ἱλασμός في سياق الكفارة
  choice: كفّارةً عن خطايانا
  alternative: 'ذبيحةً تكفّر عن خطايانا؛ أو: تكفيرًا عن خطايانا'
  rationale: تحفظ «كفّارة» المجال الدلالي المتعلق بالذبيحة وإزالة أثر الخطايا دون حصر اللفظ اليوناني في تفسير واحد لمسألة استرضاء الغضب أو محو الذنب. وتوضح الحاشية البدائل الممكنة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «تتجلّى» لجعل العبارة الافتتاحية طبيعية مع إبقاء الإشارة إلى ما يلي، ووُضع ضمير «هو» لإبراز المقابلة اليونانية. أُبقي المصطلح اللاهوتي «كفّارة» في المتن مع شرحه بلغة ميسّرة في الحاشية.
