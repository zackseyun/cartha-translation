base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: ar
  text: 'إن قال أحد: «أنا أحب الله»، وهو يبغض أخاه[a]، فهو كاذب؛ لأن من لا يحب أخاه الذي قد رآه لا يقدر أن يحب الله الذي لم يره.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أخاه أو أخته». يقول النص اليوناني «أخاه» (ἀδελφόν)، وهي صيغة مفرد مذكر يمكن أن تُستعمل هنا استعمالًا تمثيليًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: إن قال أحد
  rationale: تنقل أداة الشرط مع صيغة الاحتمال قولًا عامًا، وهي عبارة عربية طبيعية وموجزة.
- source_word: Ἀγαπῶ
  choice: أنا أحب
  rationale: تحافظ على دلالة المضارع وعلى الصلة اللفظية بتكرار فعل المحبة في الآية.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: أخاه
  rationale: تحافظ على المفرد المذكر في اليونانية، مع إمكان استعماله تمثيليًا بحسب السياق.
- source_word: μισῇ
  choice: يبغض
  rationale: ينقل المضارع بدقة وبأسلوب عربي فصيح واضح.
- source_word: ψεύστης ἐστίν
  choice: فهو كاذب
  rationale: يحافظ على الاسم الخبري وعلى حدة الحكم الأخلاقي، بدل تحويله إلى مجرد فعل كذب.
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: لأن من لا يحب
  rationale: ينقل γάρ تعليلًا، ويصوغ اسم الفاعل المعرّف في تركيب عربي عام وطبيعي.
- source_word: ὃν ἑώρακεν
  choice: الذي رآه
  rationale: الماضي العربي هو الأنسب هنا للسياق، ويعبّر بوضوح عن كون الأخ منظورًا ومحسوسًا.
- source_word: οὐ δύναται ἀγαπᾶν
  choice: لا يقدر أن يحب
  rationale: يحافظ صراحة على معنى القدرة أو الإمكان في δύναται وعلى قوة النفي.
theological_decisions:
- issue: دلالة ἀδελφός في سياق قد يشمل جماعة المؤمنين عمومًا
  choice: أخاه
  alternative: أخاه أو أخته؛ أو أخاه في الإيمان
  rationale: المتن يحافظ على صيغة المفرد المذكر في الأصل من غير تضييقها اصطلاحيًا إلى «المؤمن»، وتوضح الحاشية إمكان الاستعمال التمثيلي.
- issue: قوة οὐ δύναται ἀγαπᾶν
  choice: لا يقدر أن يحب الله
  alternative: لا يستطيع أن يحب الله
  rationale: يحفظ النص دعوى عدم القدرة القوية ضمن حجة يوحنا، من غير إضافة تفسير لطبيعة هذه الاستحالة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «يبغض» و«لا يقدر» للمحافظة على قوة الأصل، مع إبقاء «أخاه» في المتن وشرح شموله المحتمل في الحاشية.
