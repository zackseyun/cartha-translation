  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν, ὅτι ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: ar
  text: 'بهذا نعرف أننا نثبت فيه، وهو فينا: لأنه قد أعطانا من روحه[a][b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في هذا نعرف…». فالعبارة اليونانية تحتمل هذه الصياغة الأكثر حرفية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «نبقى فيه». والفعل اليوناني μένω لفظ محوري عند يوحنا، ويدل هنا على الاستمرار في علاقة ثابتة بالله.'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «من روحه»، وفي ذلك إبراز لمصدر العطية؛ ويمكن في العربية أيضًا أن تُفهم بمعنى أنه أعطانا نصيبًا أو عطية من روحه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: بهذا
  rationale: تؤدي الصيغة العربية الطبيعية معنى الوسيلة أو الدليل في العبارة اليوحناوية، مع إبقاء إمكان الترجمة الأكثر حرفية في الحاشية.
- source_word: γινώσκομεν
  choice: نعرف
  rationale: تنقل المضارع الدال على معرفة قائمة ومتواصلة، وهي صياغة عربية واضحة ومباشرة.
- source_word: ἐν αὐτῷ μένομεν
  choice: نثبت فيه
  rationale: «نثبت» تحفظ معنى الاستمرار العلائقي الذي يحمله الفعل μένω في كتابات يوحنا، من غير تحويله إلى مجرد إقامة مكانية.
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: وهو فينا
  rationale: تحفظ إيجاز اليونانية التي لا تكرر الفعل، مع وضوح أن معنى «يثبت» مفهوم من الشطر السابق.
- source_word: ὅτι
  choice: لأن
  rationale: تفيد هنا أساس المعرفة أو دليلها، وتأتي طبيعية بعد النقطتين في العربية.
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: من روحه
  rationale: تحفظ «من» دلالة ἐκ على المصدر، وربما الإعطاء مما هو من الروح، بدل تسوية العبارة إلى «روحه» فقط.
- source_word: δέδωκεν
  choice: قد أعطانا
  rationale: «قد» مع الماضي تنقل الفعل المنجز ذي الأثر القائم الذي يفيده التام اليوناني.
- source_word: ἡμῖν
  choice: أعطانا
  rationale: أُدمج ضمير المفعول غير المباشر في الفعل وفق الأسلوب العربي الطبيعي.
theological_decisions:
- issue: مرجع الضمير في «روحه» وهوية الروح
  choice: يُفهم «روحه» على أنه روح الله، مع إبقاء اللفظ من غير إضافة تفسيرية مثل «القدس» داخل المتن.
  alternative: «من الروح القدس» أو فهم «الروح» بوصفه عطية أو نزعة روحية عامة.
  rationale: السياق يجعل روح الله هو المرجح، لكن النص اليوناني يقول حرفيًا «روحه» ولا يضيف صفة «القدس»، لذلك تُحفظ صياغته بلا توسع.
- issue: لغة الثبات المتبادل
  choice: «نثبت فيه، وهو فينا» مع عدم تكرار الفعل في الشطر الثاني.
  alternative: «نثبت فيه، وهو يثبت فينا» أو «نقيم فيه، وهو يقيم فينا».
  rationale: يحافظ هذا على التبادل اللاهوتي وعلى إيجاز التركيب اليوناني، من غير حسم زائد لطبيعة هذا الحلول المتبادل أو شرحه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «نثبت» للمحافظة على المصطلح اليوحناوي وعلى معنى الاستمرار العلائقي، وحُفظ التركيب الموجز «وهو فينا». وُضعت جميع علامات الحواشي في المتن.
