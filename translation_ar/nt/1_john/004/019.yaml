  text: ἡμεῖς ⸀ἀγαπῶμεν, ὅτι αὐτὸς πρῶτος ἠγάπησεν ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/019.yaml
  text: We love because he first loved us[a].
translation:
  language: ar
  text: نحن نحب، لأنه هو أحبنا أولًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «نحن نحبه، لأنه هو أحبنا أولًا».'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: نحن
  rationale: ذِكر ضمير المتكلم الجمع صراحةً يحفظ ما في اليونانية من توكيد أو مقابلة، وهو طبيعي في العربية هنا.
- source_word: ἀγαπῶμεν
  choice: نحب
  rationale: فعل مضارع مرفوع للمتكلم الجمع؛ تُبقي الصياغة على الفعل بلا مفعول به كما في النص اليوناني المعتمد، وتحفظ الصلة اللفظية بمحور المحبة في السياق.
- source_word: ὅτι
  choice: لأنه
  rationale: تُفهم الأداة هنا سببية، إذ تبيّن أن محبة الله السابقة هي أساس محبتنا.
- source_word: αὐτὸς
  choice: هو
  rationale: يعود الضمير في السياق إلى الله، وإظهاره يحفظ قدرًا من التوكيد الموجود في اليونانية.
- source_word: πρῶτος
  choice: أولًا
  rationale: 'تفيد الأسبقية الزمنية: محبته سبقت محبتنا وأسستها.'
- source_word: ἠγάπησεν
  choice: أحب
  rationale: الفعل ماضٍ في اليونانية ويشير إلى فعل محبة سابق وحاسم؛ والماضي العربي هو المقابل الطبيعي.
- source_word: ἡμᾶς
  choice: نا
  rationale: ضمير المتكلمين مفعول به مباشر، وقد أُلحق بالفعل على نحو عربي طبيعي.
theological_decisions:
- issue: هل يُضاف مفعول به إلى «نحب»؟
  choice: 'إبقاء المفعول به غير مذكور: «نحن نحب»'
  alternative: «نحن نحبه» أو «نحن نحب الله»
  rationale: قراءة SBLGNT لا تتضمن مفعولًا به بعد ἀγαπῶμεν. وإضافة «إياه» أو «الله» تحسم ما أبقاه النص مفتوحًا، في حين أن السياق يبيّن أن محبتنا تنبع من محبة الله السابقة دون أن يحدد هذا العدد وحده جهة محبتنا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة. حُفظ تكرار جذر «حب» والبنية السببية، كما حُفظ عدم تعيين مفعول «نحب». استُعملت «لأنه هو» لإظهار الضمير المؤكد في الأصل دون إثقال العبارة.
