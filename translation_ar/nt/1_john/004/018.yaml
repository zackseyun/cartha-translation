  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: ar
  text: لا خوف في المحبة، بل المحبة الكاملة[a] تطرد الخوف، لأن الخوف له عقاب[b]. أما من يخاف فلم يكتمل في المحبة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا فهم «الكاملة» بمعنى «التامة» أو «التي بلغت غايتها».
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «الخوف له عقاب»؛ وقد يُفهم أيضًا بمعنى أن الخوف مقترن بالعقاب أو بتوقّعه.'
    reason: lexical_alternative
  - marker: c
    text: 'الفعل اليوناني تام مبني للمجهول؛ والمعنى الحرفي الأقرب: «لم يُكمَّل في المحبة».'
    reason: grammatical_clarification
lexical_decisions:
- source_word: φόβος
  choice: الخوف
  rationale: المقابل العربي المباشر والطبيعي، ويحافظ على تكرار اللفظ ثلاث مرات وعلى صلته بسياق الدينونة والعقاب.
- source_word: ἀγάπῃ / ἀγάπη
  choice: المحبة
  rationale: ترجمة مستقرة وطبيعية تحفظ تكرار المصطلح المحوري في الآية.
- source_word: τελεία
  choice: الكاملة
  rationale: تنقل معنى بلوغ المحبة تمامها أو غايتها، وتحافظ قدر الإمكان على الصلة اللفظية بالفعل اللاحق «يكتمل» من غير أن تفرض مفهوم العصمة من الخطية.
- source_word: ἔξω βάλλει
  choice: تطرد
  rationale: تعبير عربي طبيعي يدل على الإخراج القوي؛ ولا حاجة إلى إضافة «إلى الخارج» لأن معنى الطرد يتضمن ذلك.
- source_word: κόλασιν ἔχει
  choice: له عقاب
  rationale: يحافظ على الصياغة اليونانية المباشرة، حرفيًا «له عقاب»، من غير حسم ما إذا كان المقصود توقع العقاب أم ملازمته للخوف.
- source_word: ὁ δὲ φοβούμενος
  choice: أما من يخاف
  rationale: ينقل اسم الفاعل المعرّف بصياغة عربية جامعة وطبيعية، ويبرز المقابلة التي تفيدها δέ.
- source_word: οὐ τετελείωται
  choice: فلم يكتمل
  rationale: صياغة عربية واضحة تعبّر عن الحالة الناتجة عن عدم بلوغ التمام، وتحافظ على الصلة بين τελεία وτετελείωται؛ وتوضح الحاشية أن الصيغة اليونانية مبنية للمجهول.
- source_word: ἐν τῇ ἀγάπῃ
  choice: في المحبة
  rationale: ترجمة موجزة وطبيعية تحفظ سعة الدلالة المكانية أو المجالية لحرف الجر.
theological_decisions:
- issue: معنى «المحبة الكاملة» وعدم الاكتمال في المحبة
  choice: استعمال «الكاملة» و«لم يكتمل» مع الحفاظ على الصلة بين اللفظين
  alternative: «الناضجة» و«لم ينضج في المحبة» أو «التامة» و«لم يُتمَّم في المحبة»
  rationale: النص يتحدث عن المحبة وقد بلغت غايتها، وعن شخص لم يبلغ هذه الحالة فيها. تحافظ الصياغة المختارة على التوتر اللاهوتي من غير اختزال المعنى في النضج النفسي أو استيراد عقيدة الكمال الخالي من الخطية.
- issue: علاقة الخوف بالعقاب
  choice: «الخوف له عقاب»
  alternative: «الخوف يقترن بالعقاب» أو «الخوف ينطوي على توقع العقاب»
  rationale: الصياغة المباشرة تحفظ غرابة العبارة الأصلية واتساعها، ولا تقرر من تلقاء نفسها أن الخوف هو الذي يُعاقَب أو أنه مجرد توقع للعقاب.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تكرار «الخوف» و«المحبة»، وكذلك الصلة الدلالية واللفظية بين «الكاملة» و«يكتمل». اختيرت العبارة المباشرة «له عقاب» لصون غموض الأصل بدل توسيعه تفسيريًا.
