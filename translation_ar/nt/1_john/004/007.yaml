  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: ar
  text: أيها الأحباء[a]، لنحب بعضنا بعضًا، لأن المحبة من الله، وكل من يحب قد وُلد من الله ويعرف الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا أحبائي». واللفظ اليوناني يعني حرفيًا «المحبوبين»، ويردد مجموعة ألفاظ المحبة المتكررة في الآية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: أيها الأحباء
  rationale: نداء جمع يفيد المودة، ويحافظ لفظ «الأحباء» على الصلة الاشتقاقية والدلالية المتكررة مع «نحب» و«المحبة» في الآية.
- source_word: ἀγαπῶμεν
  choice: لنحب
  rationale: صيغة المضارع الالتزامي هنا للحث بصيغة المتكلم الجمع؛ و«لنحب» تؤدي معنى الحث طبيعيًا من غير أن تضيف صراحة معنى الاستمرار المحتمل في الهيئة.
- source_word: ἀλλήλους
  choice: بعضنا بعضًا
  rationale: تعبير عربي فصيح وطبيعي عن الضمير التبادلي.
- source_word: ὅτι
  choice: لأن
  rationale: تقدم علة الحث على المحبة بوضوح.
- source_word: ἡ ἀγάπη
  choice: المحبة
  rationale: الاسم هنا عام الدلالة، و«المحبة» هي المقابل العربي الطبيعي وتحافظ على تكرار جذر المحبة في الآية.
- source_word: ἐκ τοῦ θεοῦ
  choice: من الله
  rationale: حرف ἐκ يدل على المصدر أو المنشأ، و«من الله» يحفظ هذا المعنى مباشرة.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: كل من يحب
  rationale: ينقل اسم الفاعل المسبوق بـπᾶς بوصفه وصفًا عامًا لكل من يتصف بالمحبة.
- source_word: γεγέννηται
  choice: قد وُلد
  rationale: ينقل المبني للمجهول في صيغة التام، مشيرًا إلى حدث تم وله نتيجة قائمة، من غير استعمال تعبير عربي متكلف.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: قد وُلد من الله
  rationale: يحفظ صورة الولادة ومصدرها الإلهي، مع إبقاء المبني للمجهول والنبرة اليوحناوية.
- source_word: γινώσκει τὸν θεόν
  choice: يعرف الله
  rationale: ترجمة مباشرة للمضارع الذي يدل على معرفة قائمة؛ ولا تضيف معنى البدء في المعرفة غير المصرح به.
theological_decisions:
- issue: العلاقة بين المحبة والولادة من الله ومعرفة الله
  choice: 'إبقاء الربط المباشر في النص: من يحب قد وُلد من الله ويعرفه، من غير تحويل العبارة إلى صياغة عقائدية تقنية.'
  alternative: تفسيرها اختبارًا تقنيًا حاسمًا للتجدد، أو فصلها عن الولادة من الله وجعلها موعظة أخلاقية محضة.
  rationale: النص اليوناني يربط هذه الحقائق صراحة، لكنه لا يحدد هنا ترتيبًا خلاصيًا اصطلاحيًا ولا يفصل السلوك عن المصدر الإلهي.
- issue: تكرار مجموعة ألفاظ ἀγαπ-
  choice: استخدام «الأحباء/نحب/المحبة/يحب» بصورة متسقة.
  alternative: تنويع الألفاظ، مثل «يا أصدقائي الأعزاء»، بما يحجب الصلة اللفظية.
  rationale: التكرار مقصود بلاغيًا ولاهوتيًا في الآية، ومن المهم إظهاره قدر ما تسمح به العربية الطبيعية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «أيها الأحباء» للمحافظة على نبرة النداء وعلى تكرار ألفاظ المحبة، و«لنحب» للحث الطبيعي، مع صياغة مباشرة لا تفرض تفسيرًا مذهبيًا.
