  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: ar
  text: وَإِنْ كُنَّا نَعْلَمُ أَنَّهُ يَسْمَعُنَا فِي كُلِّ مَا نَطْلُبُهُ[a]، فَإِنَّنَا نَعْلَمُ أَنَّ لَنَا الطَّلَبَاتُ الَّتِي طَلَبْنَاهَا مِنْهُ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيًّا كان ما نطلبه». تفيد الصيغة اليونانية معنى مفتوحًا شاملًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: يَسْمَعُنَا
  rationale: ينقل معنى سماع الله لصلواتنا بوضوح، من غير أن يفسره مسبقًا بمعنى «يستجيب لنا».
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: فِي كُلِّ مَا نَطْلُبُهُ
  rationale: يحفظ معنى الموصول غير المحدد، أي شمول «كل ما» يُطلب، ويربطه طبيعيًا بفعل السماع.
- source_word: αἰτώμεθα
  choice: نَطْلُبُهُ
  rationale: «طلب» هو المقابل العربي المباشر والطبيعي في سياق الصلاة.
- source_word: ἔχομεν
  choice: لَنَا
  rationale: يعبّر عن معنى الحيازة في المضارع من غير تحويله إلى «ننال» أو «نستلم»، وهما أوسع تفسيرًا من الأصل.
- source_word: τὰ αἰτήματα
  choice: الطِّلْبَاتِ
  rationale: يحافظ على الاسم الدال على الأمور المطلوبة، وعلى الصلة اللفظية بالفعل «نطلب».
- source_word: ἃ ᾐτήκαμεν
  choice: الَّتِي طَلَبْنَاهَا
  rationale: ينقل الفعل التام اليوناني بصيغة عربية طبيعية تدل على طلب سابق ذي صلة بالحاضر.
- source_word: ἀπ’ αὐτοῦ
  choice: مِنْهُ
  rationale: يحفظ دلالة المصدر والجهة التي وُجّه إليها الطلب.
- source_word: οἴδαμεν
  choice: نَعْلَمُ
  rationale: يحافظ على تكرار فعل المعرفة المحوري في رسالة يوحنا من غير توسيع تفسيري.
theological_decisions:
- issue: هل يُترجم ἀκούει بمعنى السماع أم بمعنى الاستجابة؟
  choice: يَسْمَعُنَا
  alternative: يستجيب لنا
  rationale: الأصل يصرّح بالسماع ثم يبني عليه العلم بأن الطلبات لنا؛ أما «يستجيب» فيدمج النتيجة في فعل السماع ويحسم دلالة لا يصرّح بها اللفظ اليوناني.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ تكرار «نعلم» والصلة بين «نطلب» و«الطلبات»، كما حُفظ التركيب «أن لنا الطلبات» لأنه ينقل معنى الحيازة الحاضر من دون إدخال معنى الاستلام أو الاستجابة.
