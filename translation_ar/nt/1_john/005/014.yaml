source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: ar
  text: 'وهذه هي الثقة[a] التي لنا أمامه: إن طلبنا شيئًا بحسب مشيئته، يسمعنا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الجرأة» أو «الاطمئنان».'
    reason: بدائل معجمية لكلمة παρρησία، التي تدل هنا على الثقة المنفتحة في الاقتراب إلى الله.
lexical_decisions:
- source_word: παρρησία
  choice: الثقة
  rationale: تفيد هنا الثقة المنفتحة في الاقتراب إلى الله، لا مجرد الجرأة العلنية، وهي طبيعية وواضحة في سياق الصلاة.
- source_word: πρὸς αὐτόν
  choice: أمامه
  rationale: تنقل التوجّه العلاقي والحضور بين يدي الله في سياق الصلاة، من غير حرفية ثقيلة مثل «نحوه».
- source_word: ὅτι
  choice: ':'
  rationale: تقدّم الجملة التالية مضمون الثقة؛ وتؤدي النقطتان هذا الربط بوضوح وطبيعية في العربية.
- source_word: ἐάν τι αἰτώμεθα
  choice: إن طلبنا شيئًا
  rationale: تحفظ الشرط العام والمدى المفتوح للطلب، بصياغة عربية فصيحة ومباشرة.
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: بحسب مشيئته
  rationale: تحفظ معنى المطابقة لمشيئة الله والوزن اللاهوتي للفظ θέλημα دون توسع تفسيري.
- source_word: ἀκούει ἡμῶν
  choice: يسمع لنا
  rationale: صياغة عربية مألوفة في سياق الدعاء تفيد الإصغاء إلى الطلب، مع عدم تحويل السماع إلى وعد صريح بإجابة كل طلب أو منحه.
theological_decisions:
- issue: معنى سماع الله للصلاة
  choice: يسمع لنا
  alternative: يستجيب لنا / يمنحنا ما نطلب
  rationale: النص يثبت سماع الله للطلبات الموافقة لمشيئته، ولا يصرّح في هذه الآية وحدها بأن السماع يعني منح كل طلب فورًا؛ لذلك تُحفظ المسافة والتوتر في التعبير اليوناني.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «مشيئته» حفاظًا على المصطلح الكتابي المألوف، و«يسمع لنا» لصون دلالة النص من غير مبالغة تفسيرية.
