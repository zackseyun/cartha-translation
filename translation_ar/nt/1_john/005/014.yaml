  source_fidelity: 'المعنى العام مضبوط: «الثقة» تنقل παρρησία في سياق الاقتراب إلى الله، و«بحسب مشيئته» تنقل κατὰ τὸ θέλημα αὐτοῦ، والجملة الشرطية محفوظة. لكن «يسمع لنا» في العربية قد تُفهم اصطلاحيًا على أنها يستجيب لنا، وهو أوسع من ἀκούει ἡμῶν في هذه الآية؛ «يسمعنا» أدق وأوضح في إثبات السماع دون تقرير الاستجابة أو المنح.'
