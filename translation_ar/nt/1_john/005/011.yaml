  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: ar
  text: 'وهذه هي الشهادة[a]: أن الله قد أعطانا[b] حياة أبدية، وهذه الحياة هي في ابنه[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تترجم: «ما شهد به».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «أعطانا»؛ فصيغة الماضي اليونانية تدل على فعل تم، و«قد أعطانا» تبرز نتيجته الحاضرة في السياق.'
    reason: lexical_alternative
  - marker: c
    text: 'حرفيًا: «في ابنه»؛ وقد أبقينا التعبير اليوناني كما هو بدل تفسيره بـ«بواسطة ابنه» أو «مع ابنه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: الشهادة
  rationale: تنقل معنى مضمون الشهادة في السياق اليوحناوي، لا شخص الشاهد، وهي صياغة عربية واضحة ومألوفة.
- source_word: ὅτι
  choice: أن
  rationale: تقدّم مضمون الشهادة مباشرة من غير إضافة تفسيرية.
- source_word: ζωὴν αἰώνιον
  choice: حياة أبدية
  rationale: تعبير طبيعي يحفظ دلالة الحياة الآتية من الله ودوامها، من غير حصرها في مجرد طول الزمن.
- source_word: ἔδωκεν
  choice: قد أعطانا
  rationale: تفيد «قد» تمام فعل العطاء مع بقاء نتيجته حاضرة، مع المحافظة على بساطة الفعل اليوناني.
- source_word: ὁ θεὸς ἡμῖν
  choice: الله قد أعطانا
  rationale: يحفظ الله فاعلًا صريحًا، ويؤدي ضمير المتكلمين في ἡμῖν من غير تضييق مرجعه أو توسيعه.
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: هذه ... وهذه الحياة
  rationale: يحفظ تكرار اسم الإشارة الذي يربط مضمون الشهادة بالحياة المذكورة ويؤكده.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: في ابنه
  rationale: يحفظ حرف الجر ἐν والتعبير اليوحناوي المكثف، بدل تحويله تفسيريًا إلى «بواسطة ابنه» أو إضعافه إلى معنى المصاحبة.
theological_decisions:
- issue: دلالة صيغة الماضي ἔδωκεν وصلتها بالامتلاك الحاضر للحياة
  choice: قد أعطانا حياة أبدية
  alternative: أعطانا حياة أبدية
  rationale: الصياغتان ممكنتان؛ اختيرت «قد أعطانا» لإبراز تمام العطية ونتيجتها القائمة في السياق، من غير بناء حكم عقائدي يتجاوز نص الآية.
- issue: معنى كون الحياة «في ابنه»
  choice: الإبقاء على «في ابنه»
  alternative: «بواسطة ابنه» أو «مع ابنه»
  rationale: يحفظ هذا الاختيار العبارة اليونانية والتوتر الدلالي بين موضع الحياة ومصدرها والاتحاد بالابن، من غير اختزالها إلى وسيلة أو مصاحبة فقط.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ تكرار «هذه»، واستُعملت «قد» استعمالًا طبيعيًا لإظهار تمام العطاء، مع إبقاء العبارة اليوحناوية «في ابنه» من غير شرح داخل المتن.
