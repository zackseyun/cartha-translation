lexical_decisions:
- source_word: ὅτι
  choice: لِأَنَّ
  rationale: تؤدي هنا معنى التعليل والتفسير لما سبق، و«لأنَّ» تنقل هذه الصلة بوضوح في العربية.
- source_word: τρεῖς
  choice: ثَلَاثَةٌ
  rationale: نقل مباشر للعدد، وجاء بصيغة المذكر لأن المعدود المقصود عاقل أو مُشخَّص.
- source_word: εἰσιν
  choice: هُمْ
  rationale: 'أُبرز معنى فعل الكينونة بضمير الفصل في تركيب عربي طبيعي: «الذين يشهدون هم ثلاثة».'
- source_word: οἱ μαρτυροῦντες
  choice: الَّذِينَ يَشْهَدُونَ
  rationale: اسم الفاعل المعرّف المستعمل استعمال الاسم يدل على القائمين بالشهادة؛ والصلة الفعلية تحافظ على دلالة فعل الشهادة المستمر بدل تحويلها إلى الاسم الجامد «الشهود».
theological_decisions:
- issue: الصيغة النصية ليوحنا الأولى 5:7 والفاصلة اليوحناوية
  choice: 'ترجمة نص SBLGNT الأقصر وحده في المتن: «لأن الذين يشهدون هم ثلاثة»'
  alternative: 'تضيف مخطوطات متأخرة العبارة: «في السماء: الآب والكلمة والروح القدس، وهؤلاء الثلاثة هم واحد. والذين يشهدون في الأرض ثلاثة...»'
  rationale: النص اليوناني المزوَّد هو القراءة النقدية الأقصر. أما التوسعة ذات الصياغة الثالوثية فغائبة عن أقدم الشواهد اليونانية ولا يوردها متن SBLGNT؛ لذلك تُذكر بشفافية في الحاشية ولا تُدمج في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حافظت الصياغة على الجملة الموصولة ذات الدلالة الفعلية، وعلى الفاصلة التي تبين أن الكلام يستمر في العدد التالي.
