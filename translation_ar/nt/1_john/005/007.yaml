  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تضيف مخطوطات متأخرة قراءة أطول تُعرَف غالبًا باسم «الفاصلة اليوحناوية»: «في السماء: الآب والكلمة والروح القدس، وهؤلاء الثلاثة هم واحد. والذين يشهدون في الأرض ثلاثة...». وهذه العبارة غائبة عن أقدم شواهد المخطوطات اليونانية، ولا تَرِد في متن SBLGNT.'
