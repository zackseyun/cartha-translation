  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: ar
  text: كلُّ من يؤمن بأن يسوع هو المسيح قد وُلِد من الله[a]، وكلُّ من يحب الوالد يحب أيضًا المولود منه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تستعمل اليونانية صيغًا من الفعل نفسه في «وُلِد» و«الوالد» و«المولود». أو في الشطر الأخير: «كلُّ من يحب مَن أنجب يحب أيضًا مَن أُنجِب منه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: كلُّ من يؤمن
  rationale: ينقل التركيب الاسمي العام الدال على كل شخص يتصف بالإيمان، بصياغة عربية طبيعية.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: بأن يسوع هو المسيح
  rationale: «المسيح» لقب يسوع هنا، وتحافظ «هو» على وضوح الجملة الإقرارية وعلى دلالة اللقب.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: قد وُلِد من الله
  rationale: تعكس «قد» مع الماضي حالةً ناتجة من فعل سابق، بما يلائم صيغة التام اليونانية، وتحافظ «من الله» على دلالة المصدر.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: كلُّ من يحب
  rationale: صياغة عامة طبيعية موازية لعبارة «كل من يؤمن».
- source_word: τὸν γεννήσαντα
  choice: الوالد
  rationale: يحافظ على المعنى الفاعل لفعل γεννάω وعلى المقابلة مع «المولود»، من غير استبدال اللفظ صراحةً بـ«الآب».
- source_word: ἀγαπᾷ καὶ
  choice: يحب أيضًا
  rationale: 'تنقل καί معنى الإضافة: محبة المولود إلى جانب محبة الوالد.'
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: المولود منه
  rationale: يحافظ على الصلة اللفظية بفكرة الولادة وعلى دلالة المصدر في ἐξ αὐτοῦ، من غير حسم هوية المولود بلفظ تفسيري مثل «ابن الله» أو «أولاد الله».
theological_decisions:
- issue: لغة الولادة من الله والعلاقة بين الوالد والمولود
  choice: قد وُلِد من الله ... الوالد ... المولود منه
  alternative: قد أنجبه الله ... من أنجب ... من أنجبه
  rationale: اختير جذر «ولد» في المواضع الثلاثة لإظهار الترابط اللفظي في اليونانية، مع إبقاء «المولود منه» عامًا كما في النص، فلا يُحسم بتفسير زائد أنه المسيح أو المؤمن الآخر.
- issue: لقب ὁ χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب اليوناني، وهو مفهوم بوصفه لقبًا ليسوع من دون تحويله إلى تعبير تفسيري غير مألوف.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. روعي التوازي بين «كل من يؤمن» و«كل من يحب»، وحُفظ تكرار جذر الولادة والتعميم المقصود في «المولود منه».
