  text: Little children[a], guard yourselves from idols.
translation:
  language: ar
  text: يا أولادي الصغار[a]، احفظوا أنفسكم من الأصنام.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يا أولاد» أو «يا أبنائي الأحباء». اللفظ اليوناني صيغة تصغير حانية يستعملها يوحنا في النداء المباشر.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: يا أولادي الصغار
  rationale: صيغة نداء جمع تصغيرية تحمل مودة أبوية في استعمال يوحنا. «أولادي» تنقل العلاقة الرعوية الأبوية، و«الصغار» تحفظ دلالة التصغير، مع أداة النداء اللازمة طبيعيًا في العربية.
- source_word: φυλάξατε
  choice: احفظوا
  rationale: فعل أمر للجمع يدعو إلى حراسة يقظة وحاسمة. «احفظوا أنفسكم» تركيب عربي فصيح مباشر يحافظ على معنى الوقاية والتيقظ.
- source_word: ἑαυτὰ
  choice: أنفسكم
  rationale: ينقل الضمير الانعكاسي بوصفه مفعولًا به من غير شرح زائد.
- source_word: ἀπὸ
  choice: من
  rationale: تدل على الانفصال والابتعاد، و«من» هي المقابل العربي المباشر والطبيعي مع فعل الحفظ.
- source_word: εἰδώλων
  choice: الأصنام
  rationale: المصطلح الواضح والمألوف للدلالة على الأصنام أو موضوعات العبادة الباطلة، من غير توسيع تفسيري إلى كل ما قد يحل محل الله.
theological_decisions:
- issue: نطاق معنى «الأصنام»
  choice: 'ترجمة اللفظ ترجمة مباشرة: «الأصنام»'
  alternative: كل ما يصير صنمًا؛ أو العبادة الباطلة عمومًا
  rationale: النص اليوناني يسمّي الأصنام مباشرة. وقد يمتد التحذير ضمنًا إلى الوثنية بأشكالها، لكن لا ينبغي للترجمة أن توسّع العبارة بما يتجاوز اللفظ المصدر.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «يا أولادي الصغار» للمحافظة على الصورة العائلية والحنان في صيغة التصغير، مع إبقاء التحذير موجزًا وحاسمًا.
