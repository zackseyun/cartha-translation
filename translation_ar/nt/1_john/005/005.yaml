  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: ar
  text: فمَن هو الذي يَغلِبُ العالَمَ إلا الذي يؤمن بأنَّ يسوع هو ابنُ الله؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبحرفية أكبر: «الغالبُ... المؤمنُ». يستعمل النص اليوناني صيغتي اسم فاعل مذكرتين مفردتين استعمالًا تمثيليًا عامًا؛ فالمقصود كل مَن يَغلِب وكل مَن يؤمن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς δέ ἐστιν
  choice: فمَن هو الذي
  rationale: تُبقي صيغة السؤال البلاغي، وتنقل δέ بربط خفيف بالفاء استنادًا إلى السياق السابق، من غير أن تحوّلها إلى تضاد حاد.
- source_word: ὁ νικῶν
  choice: الذي يَغلِبُ
  rationale: تنقل اسم الفاعل اليوناني المستعمل اسميًا بصلة موصولية عربية طبيعية، مع الحفاظ على الدلالة المستمرة أو المميِّزة للفعل في المضارع.
- source_word: τὸν κόσμον
  choice: العالَمَ
  rationale: تنقل اللفظ كما هو من غير إضافة تفسيرية مثل «نظام العالم»، وبذلك تُترك دلالته اليوحناوية للسياق.
- source_word: εἰ μὴ
  choice: إلا
  rationale: هي المقابل العربي الاصطلاحي الطبيعي في هذا السؤال البلاغي، وتحفظ معنى الاستثناء والحصر.
- source_word: ὁ πιστεύων
  choice: الذي يؤمن
  rationale: تحفظ القوة الفعلية لاسم الفاعل اليوناني ودلالته المستمرة أو المميِّزة، بدل اختزاله في اسم جامد مثل «المؤمن».
- source_word: ὅτι
  choice: بأنَّ
  rationale: تقدّم مضمون الإيمان، لا سببَه؛ واستخدام الباء مع «يؤمن» تعبير عربي طبيعي.
- source_word: Ἰησοῦς
  choice: يسوع
  rationale: الصيغة العربية المعيارية للاسم في سياق الكتاب المقدس.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ابنُ الله
  rationale: تحفظ اللقب المسيحاني وصيغته التعريفية المباشرة من غير توسيع لاهوتي أو اختزال.
theological_decisions:
- issue: دلالة صيغتي ὁ νικῶν وὁ πιστεύων المذكر المفرد
  choice: الذي يَغلِبُ / الذي يؤمن، مع إيضاح الدلالة العامة في الحاشية
  alternative: الغالب / المؤمن؛ أو مَن يَغلِب / مَن يؤمن
  rationale: الصيغتان مذكرتان مفردتان نحويًا في اليونانية، لكنهما مستعملتان استعمالًا تمثيليًا عامًا. تحافظ الصلة الموصولة العربية على بنية المفرد وعلى القوة الفعلية من غير قصر المعنى على الذكور.
- issue: الإقرار المسيحاني في ὁ υἱὸς τοῦ θεοῦ
  choice: يسوع هو ابنُ الله
  alternative: يسوع ابنُ الله
  rationale: إثبات الضمير «هو» ينقل ἐστιν بوضوح ويحفظ صيغة الإقرار بهوية يسوع من غير إضافة مضمون عقائدي غير مصرَّح به في النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت الفاء للربط الطبيعي بما قبل الآية، وحُفظ إيقاع السؤال البلاغي والحصر بـ«إلا». ضُبطت كلمات محدودة فقط لتفادي اللبس في القراءة.
