  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: ar
  text: 'لأن كلَّ مَن وُلد من الله[a] يغلب العالم. وهذه هي الغلبة التي غلبت العالم: إيماننا[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل ما وُلد من الله». جاءت العبارة اليونانية بصيغة المحايد لتشمل جماعة المولودين من الله كلها.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أمانتنا». قد تدل الكلمة اليونانية بحسب السياق على الإيمان أو الثقة أو الأمانة؛ والمتن يتبع هنا المعنى الأرجح: «الإيمان».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تُدخل الأداة هنا تعليلًا لما سبق، و«لأن» تنقل القوة السببية بوضوح في العربية.
- source_word: πᾶν τὸ γεγεννημένον
  choice: كلَّ مَن وُلد
  rationale: العبارة اليونانية مفرد محايد من حيث الصيغة، لكنها تشير في السياق إلى مجموع الأشخاص المولودين من الله. و«كل من» عربية طبيعية تحفظ العموم والإحالة الشخصية.
- source_word: γεγεννημένον
  choice: وُلد
  rationale: الفعل المبني للمجهول ينقل صورة الولادة، وصيغة الأصل التامة تدل على حدث تم وله أثر باقٍ؛ ويؤدي السياق العربي هذا المعنى من غير إثقال العبارة.
- source_word: ἐκ τοῦ θεοῦ
  choice: من الله
  rationale: تحفظ «من» معنى المصدر أو المنشأ في الولادة الروحية، وهي صياغة عربية واضحة وطبيعية.
- source_word: νικᾷ
  choice: يغلب
  rationale: «يغلب» أنسب مقابل عربي حاضر، ويحافظ على الصلة اللفظية مع «الغلبة» و«غلبت» في بقية الآية.
- source_word: τὸν κόσμον
  choice: العالم
  rationale: يحفظ اللفظ دون حصره تفسيريًا في الخليقة المادية أو في نظام الشر، تاركًا للسياق اليوحناوي تحديد دلالته.
- source_word: ἡ νίκη
  choice: الغلبة
  rationale: «الغلبة» تنقل معنى النصر وتحافظ على الاشتقاق المشترك مع الفعل «يغلب».
- source_word: ἡ νικήσασα
  choice: التي غلبت
  rationale: تنقل صيغة الحدث المنجز في الأصل، وتحافظ على التكرار الاشتقاقي المقصود.
- source_word: ἡ πίστις ἡμῶν
  choice: إيماننا
  rationale: «الإيمان» هو المعنى الأرجح هنا، والضمير المتصل ينقل الإضافة بوضوح وإيجاز.
theological_decisions:
- issue: مرجع πᾶν τὸ γεγεννημένον المحايد صياغةً
  choice: 'إحالة شخصية جامعة: «كل من وُلد من الله»'
  alternative: «كل ما وُلد من الله»
  rationale: مع أن الصياغة اليونانية محايدة مفردة، فإن السياق يتناول المؤمنين؛ لذلك توضح «كل من» المرجع الشخصي، مع حفظ الصياغة الحرفية البديلة في الحاشية.
- issue: دلالة πίστις
  choice: إيماننا
  alternative: أمانتنا أو ثباتنا في الأمانة
  rationale: السياق يعرّف الغلبة بإيمان المؤمنين، وهو المعنى المعتاد والأقرب هنا، مع الإقرار بأن اللفظة قد تحمل معنى الأمانة في سياقات أخرى.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التكرار الاشتقاقي في νικᾷ / νίκη / νικήσασα بواسطة «يغلب / الغلبة / غلبت»، كما حُفظ التعليل في مطلع الآية، ووُضعت علامتا الحاشية عند اللفظتين اللتين تتعلقان بهما.
