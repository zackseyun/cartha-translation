  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: ar
  text: 'فَإِنَّ هذِهِ هِيَ مَحَبَّةُ اللهِ[a]: أَنْ نَحْفَظَ وَصَايَاهُ، وَوَصَايَاهُ لَيْسَتْ شَاقَّةً.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «محبتنا لله». وقد تُفهم أيضًا: «محبة الله لنا». تحتمل العبارة اليونانية المحبة الموجَّهة إلى الله والمحبة الصادرة منه، وإن كان السياق المباشر يرجّح «محبتنا لله».'
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: هِيَ هذِهِ
  rationale: اسم الإشارة يحيل إلى الأمام، إلى العبارة التي تشرح ما تتجلى فيه محبة الله. وهذه الصياغة واضحة وتحافظ على بنية التعريف في اليونانية.
- source_word: γάρ
  choice: لِأَنَّ
  rationale: تفيد الأداة تعليل الكلام السابق أو شرحه، و«لأن» تؤدي هذه الصلة بوضوح في العربية.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: مَحَبَّةَ اللهِ
  rationale: تحافظ العبارة العربية على تركيب الإضافة وعلى إمكان فهمها أساسًا بوصفها المحبة الموجَّهة إلى الله، مع بقاء احتمال دلالتها على المحبة الصادرة منه؛ لذلك أُثبت الهامش.
- source_word: ἵνα
  choice: أَنْ
  rationale: تدخل هنا على مضمون يبيّن ما تقوم عليه محبة الله، لا على غاية فحسب؛ و«أن» هي الصياغة العربية الطبيعية الموجزة.
- source_word: ἐντολάς
  choice: وَصَايَاهُ
  rationale: «وصايا» تنقل الثقل الدلالي الديني للكلمة وتحافظ على الاستعمال اليوحناوي المألوف دون غموض.
- source_word: τηρῶμεν
  choice: نَحْفَظَ
  rationale: الفعل اليوناني يدل في هذا السياق على مراعاة الوصايا والعمل بها. و«نحفظ» يحافظ على الصلة المعجمية المألوفة مع وضوح المعنى.
- source_word: βαρεῖαι
  choice: ثَقِيلَةً
  rationale: يحافظ اللفظ على صورة الثقل في الأصل، ويفيد في السياق أنها ليست شاقة أو مُرهِقة الحمل.
theological_decisions:
- issue: دلالة الإضافة في ἡ ἀγάπη τοῦ θεοῦ
  choice: «محبة الله» مع ترجيح معنى محبتنا لله في السياق
  alternative: محبة الله لنا، أو إبقاء الدلالتين معًا دون ترجيح
  rationale: تربط الآية السابقة بين محبة الله والعمل بوصاياه، ثم تعرّف هذه الآية المحبة بحفظ وصاياه؛ لذلك يرجح أن المقصود محبتنا لله. لكن تركيب الإضافة اليوناني يحتمل أيضًا المحبة الصادرة من الله، فحافظ المتن العربي على الاحتمال وأوضحه الهامش.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «وصايا» و«نحفظ» لاتساقهما مع الأسلوب الكتابي المألوف من غير تقادم، وأُبقي وصف الوصايا بأنها «ليست ثقيلة» حفاظًا على صورة الأصل وقوته.
