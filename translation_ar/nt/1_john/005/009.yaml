  source_fidelity: 'النص العربي ينقل البنية الأساسية لليونانية بأمانة: قبول شهادة الناس في مقابل شهادة الله الأعظم، مع المحافظة على تكرار «شهادة». و«لأن هذه هي شهادة الله: أنه قد شهد عن ابنه» تمثل على نحو سليم القراءة الأرجح التي تجعل ὅτι الثانية مفسِّرة لمضمون الشهادة. كما أن «قد شهد» ملائم لتامّ μεμαρτύρηκεν دون تحميله دلالة زائدة.'
  naturalness: الصياغة عربية فصحى حديثة واضحة ومتماسكة. «نقبل شهادة الناس» و«شهادة الله أعظم» و«شهد عن ابنه» تعبيرات طبيعية في هذا السجل. استعمال «الناس» مناسب للدلالة العامة المقصودة في مقابلة البشر بالله.
  terminology: اختيار «شهادة» متسق مع تكرار μαρτυρία/μεμαρτύρηκεν، و«ابنه» يحافظ على الإحالة النصية دون إضافة تفسير عقائدي. الحاشية تنقل بإيجاز القراءة السببية الممكنة للعبارة الأخيرة وتحافظ على الغموض النحوي محل البحث.
