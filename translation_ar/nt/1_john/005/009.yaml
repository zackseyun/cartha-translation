id: 1JN.5.9
reference: 1 John 5:9
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: ar
  text: 'إن كنا نقبل شهادة الناس، فشهادة الله أعظم، لأن هذه هي شهادة الله: أنه قد شهد عن ابنه.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا فهم العبارة الأخيرة على أنها سببية: «لأنه قد شهد عن ابنه».'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: شهادة
  rationale: تحافظ على تكرار اللفظ اليوناني وعلى معناه الإثباتي في السياق، وهي طبيعية وواضحة بالعربية.
- source_word: ἀνθρώπων
  choice: الناس
  rationale: اللفظ اليوناني عام هنا ويقابل شهادة البشر بشهادة الله؛ و«الناس» تنقل هذا العموم طبيعيًا من غير حصره في الذكور.
- source_word: λαμβάνομεν
  choice: نقبل
  rationale: في سياق الشهادة، يدل الفعل على قبولها والاعتداد بها؛ و«نقبل» أفصح من النقل الحرفي «نأخذ» في العربية المعاصرة.
- source_word: μείζων
  choice: أعظم
  rationale: تنقل المقارنة المباشرة، أي إن شهادة الله تفوق شهادة الناس قدرًا وسلطانًا.
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: هذه هي شهادة الله
  rationale: تحافظ على الإشارة والتوكيد وعلى تكرار «شهادة» كما في اليونانية.
- source_word: μεμαρτύρηκεν
  choice: قد شهد
  rationale: تعكس صيغة التام اليونانية فعل الشهادة المنجز ذا الأثر القائم، وتبقي الصلة اللفظية بـ«شهادة».
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: عن ابنه
  rationale: «عن» تؤدي معنى περί مع المضاف إليه بوضوح وطبيعية في العربية.
theological_decisions:
- issue: دلالة ἀνθρώπων العامة
  choice: الناس
  alternative: البشر / الرجال
  rationale: المقصود شهادة الإنسان عمومًا في مقابل شهادة الله، لا شهادة الذكور على وجه الخصوص؛ لذلك تحافظ «الناس» على المقابلة المقصودة بلا تضييق.
- issue: وظيفة ὅτι الثانية
  choice: 'جملة مفسِّرة لمضمون الشهادة: «أنه قد شهد عن ابنه»'
  alternative: 'جملة سببية: «لأنه قد شهد عن ابنه»'
  rationale: الأقرب نحويًا وسياقيًا أن الجملة تبيّن ماهية شهادة الله، مع بقاء القراءة السببية ممكنة؛ لذلك ذُكرت في الحاشية بدل حسم الغموض بصمت.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. حُفظ تكرار «شهادة» المقصود في الأصل، واستُعملت «الناس» للدلالة البشرية العامة، مع إثبات الاحتمال النحوي للعبارة الأخيرة في الحاشية.
