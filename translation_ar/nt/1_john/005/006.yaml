reference: 1 John 5:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: ar
  text: هذا هو الذي جاء بالماء والدم[a]، يسوع المسيح[b]؛ لا بالماء وحده، بل بالماء والدم. والروح هو الذي يشهد، لأن[c] الروح هو الحق.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من خلال الماء والدم». والعبارة موضع خلاف؛ فمن المفسرين من يربطها بمعمودية يسوع وموته، أو بولادته وموته، أو بصور أسرارية. وقد أُبقي التعبير كما هو من غير ترجيح أحد هذه التفسيرات.'
    reason: alternative_reading
  - marker: b
    text: 'اليونانية: «يسوع خريستوس»؛ وΧριστός لقب معناه «المسيح» أو «الممسوح»، وليس اسم عائلة.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «أن الروح هو الحق». يمكن أن تفيد الأداة اليونانية مضمون الشهادة أو سببها؛ وقد اختير هنا المعنى السببي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: هذا هو الذي جاء
  rationale: يحفظ أسلوب التعريف والتوكيد في اليونانية، ويصوغ اسم الفاعل الماضي بصياغة عربية طبيعية تشير إلى مجيء تاريخي.
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: بالماء والدم
  rationale: الباء تؤدي معنى الوسيلة أو الملابسة الذي تفيده διά مع المضاف إليه، مع إبقاء العبارة مفتوحة دلاليًا من غير تعيين المقصود بالماء والدم.
- source_word: Ἰησοῦς Χριστός
  choice: يسوع المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، وتحافظ العبارة على كونها بدلًا يحدد هوية الآتي.
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: لا بالماء وحده، بل بالماء والدم
  rationale: يحفظ التقابل بين الماء وحده وبين الماء والدم، ويكرر العنصرين بوضوح من غير تفسير لرمزيتهما.
- source_word: τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν
  choice: الروح هو الذي يشهد
  rationale: تفيد الصياغة العربية أن الروح هو القائم بالشهادة، وتحفظ القوة الفعلية والاستمرارية في اسم الفاعل اليوناني.
- source_word: ὅτι
  choice: لأن
  rationale: قُرئت الأداة قراءة سببية بوصف ما يليها أساسًا لشهادة الروح، مع إثبات القراءة المضمونية البديلة في الحاشية.
- source_word: ἡ ἀλήθεια
  choice: الحق
  rationale: يحفظ التعريف في العبارة اليونانية، و«الحق» تعبير عربي طبيعي ذو قوة تعريفية، بدل تخفيفه إلى مجرد وصف الروح بأنه صادق.
theological_decisions:
- issue: المقصود بالروح
  choice: الروح القدس، ويشار إليه اختصارًا بـ«الروح»
  alternative: روح على نحو عام
  rationale: سياق الشهادة الإلهية واستعمال الرسالة يؤيدان الإشارة إلى الروح القدس، من غير إضافة لفظ «القدس» غير الموجود صراحة في الآية.
- issue: دلالة الماء والدم
  choice: الإبقاء على «الماء والدم» بلا تفسير داخل المتن
  alternative: معمودية يسوع وموته، أو ولادته وموته، أو دلالة أسرارية
  rationale: النص اليوناني لا يشرح العنصرين، وتعيين أحد التفسيرات في المتن يحسم توترًا تفسيريًا أصيلًا لا يحسمه اللفظ نفسه.
- issue: دلالة Χριστός
  choice: المسيح بوصفه لقبًا
  alternative: نقل صوتي للاسم اليوناني على نحو يوحي بأنه جزء اسمي محض
  rationale: السياق البدلي يعرّف يسوع بلقبه المسياني، و«المسيح» هو اللفظ العربي الراسخ والدقيق لهذا اللقب.
- issue: وظيفة ὅτι
  choice: 'سببية: «لأن»'
  alternative: 'مضمونية: «أن الروح هو الحق»'
  rationale: القراءة السببية تلائم تدفق الحجة، لكن الأداة اليونانية تحتمل إدخال مضمون الشهادة، ولذلك حُفظ البديل في الحاشية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُعملت الباء بإيجاز في «بالماء والدم»، وحُفظ تكرار العبارة والتقابل البلاغي من غير إدخال تفسير عقائدي في المتن. جميع علامات الحواشي مثبتة في مواضعها.
