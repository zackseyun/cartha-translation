  text: نعلم أننا من الله، وأن العالم كله واقع تحت سلطان الشرير.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أقرب إلى اللفظ اليوناني: «وأن العالم كله واقع في الشرير».'
