    reason: alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: نعلم
  rationale: تعبّر عن معرفة راسخة ويقين، وتحافظ على نبرة التوكيد في الرسالة.
- source_word: ἐκ τοῦ θεοῦ
  choice: من الله
  rationale: تنقل معنى المصدر أو الانتماء من غير إضافة معنى «مولودون من الله»، وهو غير مصرّح به في هذه العبارة.
- source_word: ὁ κόσμος ὅλος
  choice: العالم كله
  rationale: صياغة عربية طبيعية تنقل شمول ὅλος وتحافظ على لفظ κόσμος اليوحناوي.
- source_word: ἐν τῷ πονηρῷ
  choice: تحت سلطان الشرير
  rationale: توضح في العربية حالة خضوع العالم لنفوذ الشرير، مع إبقاء الصياغة الأقرب إلى البنية اليونانية في الحاشية.
- source_word: κεῖται
  choice: واقع
  rationale: يحافظ على صورة الاستقرار في حالة قائمة، ويأتلف طبيعيًا مع «تحت سلطان» في العربية.
theological_decisions:
- issue: هل يشير τῷ πονηρῷ إلى الشر المجرد أم إلى شخص «الشرير»؟
  choice: 'المعنى الشخصي: «الشرير»'
  alternative: 'المعنى المجرد: «الشر»'
  rationale: يغلب في استعمال يوحنا أن يدل ὁ πονηρός على الشرير بوصفه شخصًا (انظر 1 يوحنا 2:13-14؛ 3:12؛ 5:18)، لكن تُذكر إمكانية المعنى المجرد في الحاشية صونًا لقدر الالتباس.
- issue: هل تُترجم ἐν ترجمة حرفية أم يُصرّح بدلالة النفوذ؟
  choice: «تحت سلطان الشرير» في المتن
  alternative: «في الشرير»
  rationale: الترجمة المختارة واضحة وطبيعية للقارئ العربي وتبيّن الحالة المقصودة، في حين تحفظ الحاشية البنية الأكثر حرفية من غير الادعاء بأن لفظ «سلطان» وارد صراحة في اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «واقع تحت سلطان» لتجنب غرابة التعبير الحرفي «كائن في الشرير»، مع توثيق الصياغة الحرفية والاحتمال الدلالي البديل في الحاشيتين.
