  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: ar
  text: مَنْ له الابن فله الحياة[a]، ومَنْ ليس له ابن الله فليست له الحياة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الحياة الأبدية»؛ ففي استعمال يوحنا تشير «الحياة» هنا إلى الحياة التي في الابن.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: مَنْ له
  rationale: اسم الموصول «مَنْ» مع شبه الجملة يصوغ العبارة صياغة عربية طبيعية وعامة، ويحفظ معنى اسم الفاعل اليوناني المستعمل استعمال الاسم للدلالة على كل شخص يتصف بأن له الابن.
- source_word: τὸν υἱόν
  choice: الابن
  rationale: يحفظ الصيغة الأقصر في الجملة الأولى، كما في اليونانية، من غير إضافة «الله»، مع وضوح المرجع من السياق.
- source_word: ἔχει
  choice: له
  rationale: تؤدي معنى ἔχω هنا بعبارة عربية فصيحة وطبيعية، وتحافظ على دلالة العلاقة والامتلاك من غير تفسير زائد.
- source_word: τὴν ζωήν
  choice: الحياة
  rationale: وجود أداة التعريف في اليونانية ينسجم طبيعيًا مع «الحياة» في العربية، ويُبقي اللفظ دون توسيعه في المتن إلى «الحياة الأبدية».
- source_word: ὁ μὴ ἔχων
  choice: مَنْ ليس له
  rationale: صياغة عربية طبيعية تقابل العبارة الأولى وتحفظ نفي اتصاف الشخص بأن له الابن.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: ابن الله
  rationale: ينقل اللقب الكامل في الجملة الثانية ويحفظ علاقة الإضافة الصريحة في الأصل.
- source_word: οὐκ ἔχει
  choice: فليست له
  rationale: يحفظ النفي الصريح والتوازي التقابلي، مع صياغة عربية طبيعية تناسب الاسم المؤنث «الحياة».
theological_decisions:
- issue: معنى «الحياة» في السياق اليوحناوي
  choice: إبقاء ζωή بصيغة «الحياة» في المتن
  alternative: الحياة الأبدية
  rationale: غالبًا ما تحمل ζωή عند يوحنا معنى الحياة الأبدية الموجودة في الابن، لكن هذه الآية تقول «الحياة» فقط؛ لذلك يحفظ المتن لفظ الأصل، وتوضح الحاشية الدلالة السياقية من غير إدخال تفسير في النص.
- issue: عموم اسمي الفاعل المذكرين ὁ ἔχων وὁ μὴ ἔχων
  choice: استخدام «مَنْ له» و«مَنْ ليس له»
  alternative: الذي له / الذي ليس له
  rationale: «مَنْ» تشمل كل شخص مقصود بالحكم، وتحفظ الإفراد العام من غير حصر المعنى في الذكور أو تحويله إلى جمع.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. روعي التوازي بين شطري الآية، مع إبقاء التنويع الأصلي بين «الابن» أولًا و«ابن الله» ثانيًا، وتجنب الألفاظ القديمة مثل «مَن له الابن له الحياة» إذا أضعفت السلاسة.
