review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام منقول بأمانة: الكتابة إلى المؤمنين بغرض أن يعلموا أن لهم حياة أبدية. لكن «المؤمنين باسم» أضعف من البناء اليوناني πιστεύειν εἰς («يؤمنون بابن الله/به»)، إذ إن «الاسم» في العربية لا يصلح عادةً مفعولًا للإيمان بالباء من دون تكلّف. كما أن «أنتم المؤمنين» غير سليمة إعرابيًا في هذا الموضع؛ والصواب «أنتم المؤمنون» إن استعملت جملة اعتراضية، أو الأفضل وصلها مباشرة بالمخاطبين: «إلى الذين يؤمنون...»'
  naturalness: الصياغة مفهومة، لكن «أنتم المؤمنين» خطأ نحوي؛ إذ تكون «أنتم» مبتدأ و«المؤمنون» خبرًا مرفوعًا. كذلك فإن وضع الوصف بين «إليكم» و«لكي» ممكن لكنه أثقل من «إلى الذين يؤمنون... لكي».
  terminology: '«حياة أبدية» و«ابن الله» مصطلحان دقيقان ومألوفان. ولحفظ «الاسم» بوصفه تعبيرًا كتابيًا، تُصاغ العبارة طبيعيًا: «الذين يؤمنون بابن الله، أي باسمه»، من دون اختزال الاسم أو الإيحاء بأن الإيمان موجّه إلى لفظ الاسم وحده.'
