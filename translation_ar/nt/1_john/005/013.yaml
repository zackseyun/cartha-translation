  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: ar
  text: كتبتُ إليكم هذه الأمور، يا من تؤمنون بابن الله، أي باسمه، لكي تعلموا أن لكم حياةً أبدية.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبترتيب أقرب إلى اليونانية: «كتبتُ إليكم هذه الأمور لكي تعلموا أن لكم حياةً أبدية، أنتم المؤمنون باسم ابن الله».'
    reason: بديل نحوي يحفظ احتمال تعلّق العبارة الأخيرة وترتيبها في النص اليوناني.
lexical_decisions:
- source_word: Ταῦτα
  choice: هذه الأمور
  rationale: يحافظ على صيغة الجمع المحايد، ويشير طبيعيًا إلى مضمون الرسالة أو ما سبق من حديث.
- source_word: ἔγραψα
  choice: كتبتُ
  rationale: الماضي العربي ينقل الفعل التام في سياق الرسالة بوضوح وطبيعية.
- source_word: ὑμῖν
  choice: إليكم
  rationale: مقابل عربي مباشر وطبيعي للمفعول غير المباشر.
- source_word: ἵνα εἰδῆτε
  choice: لكي تعلموا
  rationale: يُظهر معنى الغاية الذي تؤديه ἵνα، مع نقل المعرفة المقصودة بوضوح.
- source_word: ζωὴν αἰώνιον
  choice: حياة أبدية
  rationale: تعبير عربي كتابي واضح يحفظ معنى الدوام وطبيعة الحياة المرتبطة بالله.
- source_word: ἔχετε
  choice: لكم
  rationale: يفيد امتلاك الحياة الأبدية في الحاضر، لا مجرد رجائها مستقبلًا.
- source_word: τοῖς πιστεύουσιν
  choice: أنتم المؤمنين
  rationale: جُعلت العبارة بدلًا أو بيانًا للمخاطَبين مع إبقاء موقعها المتأخر نسبيًا قريبًا من ترتيب اليونانية.
- source_word: πιστεύουσιν εἰς
  choice: المؤمنين باسم
  rationale: ينقل الاصطلاح اليوحناوي للإيمان الموجَّه إلى شخص؛ وفي العربية الفصيحة يشيع تعدية الإيمان بالباء.
- source_word: τὸ ὄνομα
  choice: اسم
  rationale: يحفظ التعبير الكتابي الذي يدل على الشخص المعلَن وسلطانه، بدل إذابته في شرح تفسيري.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: ابن الله
  rationale: نقل مباشر للقب المسيحاني مع الحفاظ على ثقله اللاهوتي.
theological_decisions:
- issue: موضع τοῖς πιστεύουσιν وعلاقته النحوية
  choice: اعتبار «أنتم المؤمنين باسم ابن الله» بيانًا للمخاطَبين «إليكم»، مع وضعه قبل جملة الغاية في العربية
  alternative: 'إبقاء العبارة في آخر الآية: «لكي تعلموا أن لكم حياة أبدية، أنتم المؤمنين باسم ابن الله»'
  rationale: تحديد المؤمنين بوصفهم المخاطَبين هو الفهم الأرجح والأوضح، لكن ترتيب اليونانية يسمح بتعلّق استئنافي متأخر؛ لذلك تُحفظ هذه الإمكانية في الحاشية دون بناء فرق عقائدي عليها.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «لكم حياة أبدية» بدل «تمتلكون» لصياغة طبيعية مع الحفاظ على معنى الحيازة الحاضرة، وأُبقي اصطلاح «اسم ابن الله» دون تفسير زائد.
