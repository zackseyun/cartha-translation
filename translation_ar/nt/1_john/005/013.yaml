  to: كتبتُ إليكم هذه الأمور، يا من تؤمنون بابن الله، أي باسمه، لكي تعلموا أن لكم حياةً أبدية.[a]
  rationale: صُحِّح الإعراب، وأعيدت صياغة عبارة الإيمان لتكون عربية فصيحة طبيعية مع الحفاظ على «ابن الله» و«الاسم». وتبقى الحاشية، بصياغة نحوية سليمة، شاهدةً على إمكان إبقاء العبارة الأخيرة في موضعها اليوناني المتأخر، دون فرض تفسير عقائدي.
