    rationale: إذا جاءت «أنتم» ضمير فصل/مبتدأ في تركيب مستقل، فخبرها «المؤمنون» مرفوع. ولا يستقيم النصب هنا.
  - severity: medium
    issue: تعدية «المؤمنين» بـ«باسم» غير طبيعية ولا تنقل εἰς على نحو واضح.
    rationale: في العربية الفصحى يقال «يؤمنون بابن الله» أو «يؤمنون به». وللحفاظ على عنصر «الاسم» اليوناني يمكن إيضاحه بعبارة «أي باسمه».
