id: 1JN.5.10
reference: 1 John 5:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: ar
  text: مَن يؤمن بابن الله، فله الشهادة في نفسه[b]؛ ومَن لا يصدّق الله فقد جعله كاذبًا[a]، لأنه لم يصدّق الشهادة التي شهد بها الله عن ابنه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فقد عَدَّه كاذبًا». واليونانية حرفيًا: «فقد جعله كاذبًا»، أي إن رفض شهادة الله يعامل الله كما لو كان غير صادق.'
    reason: lexical_alternative
  - marker: b
    text: تقرأ بعض المخطوطات «فيه» بدلًا من «في نفسه»، وقد تُفهم بمعنى «في الابن» لا «في المؤمن نفسه».
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: مَن يؤمن
  rationale: اسم الفاعل المعرّف مستعمل استعمالًا اسميًا عامًا؛ وصيغة «مَن يؤمن» عربية طبيعية وتحفظ المعنى العام.
- source_word: εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: بابن الله
  rationale: الفعل πιστεύω مع εἰς يدل هنا على الإيمان الموجَّه إلى شخص والثقة به؛ والباء هي الصياغة العربية المألوفة.
- source_word: τὴν μαρτυρίαν
  choice: الشهادة
  rationale: تحفظ اللفظة معنى الشهادة المقدَّمة ومجازها القضائي في الاستعمال اليوحناوي.
- source_word: ἐν αὑτῷ
  choice: في نفسه
  rationale: الضمير الانعكاسي يعود طبيعيًا إلى المؤمن المذكور قبله، مع إبقاء دلالة امتلاك الشهادة داخليًا.
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: مَن لا يصدّق الله
  rationale: المفعول غير المباشر مع πιστεύω يعني قبول قول الله وشهادته بوصفهما صادقين، لا مجرد الإيمان بوجود الله؛ و«يصدّق الله» يوضح هذا الفرق طبيعيًا.
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: فقد جعله كاذبًا
  rationale: ترجمة قريبة من تركيب الأصل، وتحفظ صيغة التام التي تفيد فعلًا ذا نتيجة حاضرة؛ وتوضح الحاشية المقصود الاصطلاحي.
- source_word: οὐ πεπίστευκεν
  choice: لم يصدّق
  rationale: السياق يختص بعدم قبول الشهادة الإلهية، ولذلك تلائم «يصدّق» العربية أكثر من تكرار «يؤمن» هنا.
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς
  choice: التي شهد بها الله
  rationale: تحافظ الصياغة على الصلة الاشتقاقية بين «الشهادة» و«شهد» وعلى توكيد يوحنا البلاغي.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: عن ابنه
  rationale: حرف الجر περί مع المضاف إليه يعني «عن/بشأن»، و«عن ابنه» تعبير عربي واضح ومباشر.
theological_decisions:
- issue: مرجع عبارة «الشهادة في نفسه»
  choice: الشهادة موجودة في داخل المؤمن
  alternative: الشهادة في الابن، وفق قراءة نصية أخرى «فيه»
  rationale: نص SBLGNT المعطى يقرأ ἐν αὑτῷ، وهو ضمير انعكاسي يعود على الأرجح إلى المؤمن المذكور؛ تُترجم العبارة مباشرة بلا إضافة تفسير عقائدي.
- issue: دلالة «لا يصدّق الله»
  choice: رفض شهادة الله وعدم قبولها على أنها حق
  alternative: عدم الإيمان بوجود الله على نحو عام
  rationale: جملة السبب اللاحقة تعرّف عدم التصديق بأنه عدم تصديق الشهادة التي شهد بها الله عن ابنه.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «يؤمن بابن الله» للإيمان الشخصي الموجَّه إلى الابن، و«يصدّق الله» لقبول شهادة الله، حفاظًا على التمييز النحوي والدلالي في الأصل. وُضعت علامة [b] عند موضع الاختلاف النصي و[a] عند العبارة ذات البديل المعجمي، موافقةً لمضمون الحاشيتين.
