  text: ἐν τούτῳ γινώσκομεν ὅτι ἀγαπῶμεν τὰ τέκνα τοῦ θεοῦ, ὅταν τὸν θεὸν ἀγαπῶμεν καὶ τὰς ἐντολὰς αὐτοῦ ⸀ποιῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: ar
  text: 'بهذا نعرف أننا نحب أولاد الله: حين نحب الله ونعمل بوصاياه[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ونحفظ وصاياه» أو «ونطيع وصاياه». الفعل اليوناني هنا يعني حرفيًا «نعمل/نفعل» (ποιῶμεν)، وليس الفعل المعتاد بمعنى «نحفظ» (τηρέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: بهذا
  rationale: تعبير عربي موجز وطبيعي يحفظ قوة اسم الإشارة ويقدّم الأساس أو العلامة التي بها تُعرف المحبة.
- source_word: γινώσκομεν
  choice: نعرف
  rationale: ينقل المضارع اليوناني بوضوح، من غير أن يفرض معنى البدء في المعرفة أو مجرد الإدراك العابر.
- source_word: ἀγαπῶμεν
  choice: نحب
  rationale: يحافظ على اللفظ نفسه في موضعيه وعلى الترابط المقصود بين محبة أولاد الله ومحبة الله.
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: أولاد الله
  rationale: ينقل τέκνα بصيغة جامعة للذكور والإناث، ويحفظ البناء الإضافي والتعبير اليوحناوي.
- source_word: ὅταν
  choice: حين
  rationale: يؤدي المعنى الزمني الشرطي في السياق بسلاسة، مع إبقاء إمكان معنى «كلما» قائمًا دون تشديده.
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: نعمل بوصاياه
  rationale: صياغة عربية طبيعية تحافظ على دلالة ποιέω، أي الفعل والعمل، بدل استبداله ضمنًا بفعل «يحفظ» الوارد عادةً بلفظ يوناني آخر.
theological_decisions:
- issue: العلاقة بين محبة أولاد الله ومحبة الله والعمل بوصاياه
  choice: أُبقيت العبارة معيارًا موجزًا تُعرف به محبة أولاد الله، من غير تحديد هل العلاقة دليلية أم سببية أم تعريفية.
  alternative: يمكن تفسيرها بوصفها اختبارًا دليليًا صرفًا، أو أساسًا سببيًا لمحبة المؤمنين، أو تعريفًا متبادلًا للمحبتين.
  rationale: النص اليوناني لا يحسم هذه التصنيفات، ولذلك تحافظ الترجمة على توتر العبارة واتساعها اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «نعمل بوصاياه» لأنها مألوفة وطبيعية في العربية وتحفظ في الوقت نفسه الفارق المعجمي في الأصل. وُضعت النقطتان لإظهار أن ما يلي يبيّن «بهذا» من غير زيادة تفسيرية.
