reference: 1 John 5:18
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: ar
  text: نحن نعلم أن كلَّ مولودٍ من الله لا يواصل ارتكاب الخطيئة[a]، بل إن الذي وُلِد من الله يحفظه[b]، والشرير لا يمسّه[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي لا يستمر في ممارسة الخطيئة أو يجعلها عادته. فالمضارع اليوناني يُرجَّح أن يدل هنا على فعل متواصل أو معتاد، لا على أن المؤمنين لا يرتكبون أي خطيئة قط. قارن 1 يوحنا 1: 8-10؛ 2: 1.'
    reason: توضيح دلالة الصيغة مع إحالات سياقية
  - marker: b
    text: 'ويجوز فهم العبارة: «بل إن المولود من الله يحفظ نفسه». غير أن كثيرين يفهمون «الذي وُلِد من الله» على أنه يسوع، الابن، الذي يحفظ المؤمن.'
    reason: حفظ الغموض النحوي والتفسيري الأصيل
  - marker: c
    text: يمكن أن يحمل «يمسّه» معنى الإمساك به أو التمكن منه بقصد إيذائه.
    reason: بيان بديل دلالي
lexical_decisions:
- source_word: Οἴδαμεν
  choice: نحن نعلم
  rationale: الفعل اليوناني οἶδα، مع أنه ذو صيغة تامة، يؤدي هنا معنى حالة حاضرة؛ لذلك نُقل بفعل مضارع عربي واضح.
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: كل مولود من الله
  rationale: ينقل التعبير التوزيعي «كل من...» وحالة الولادة من الله الناتجة عن اسم الفاعل التام المبني للمجهول، مع الحفاظ على الاصطلاح اليوحناوي.
- source_word: οὐχ ἁμαρτάνει
  choice: لا يداوم على فعل الخطيئة
  rationale: تعكس «يداوم» القيمة الاستمرارية المرجحة للمضارع اليوناني، فلا تجعل العبارة نفيًا مطلقًا لوقوع أي خطيئة، مع إبقاء الفعل الأخلاقي صريحًا.
- source_word: ἀλλ’
  choice: بل
  rationale: أداة استدراك عربية طبيعية تُظهر المقابلة التصحيحية في اليونانية.
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: الذي وُلِد من الله
  rationale: تحافظ الصياغة على عبارة النص ولا تُدخل «يسوع» أو «الابن» في المتن، لأن مرجعها قابل لأكثر من فهم.
- source_word: τηρεῖ αὐτόν
  choice: يحفظه
  rationale: «يحفظ» تقابل معنى τηρέω في الحراسة والصون، والضمير المفرد يحافظ على صياغة αὐτόν وعلى غموض العلاقة بين الفاعل والمفعول.
- source_word: ὁ πονηρὸς
  choice: الشرير
  rationale: وجود أداة التعريف والاستعمال اليوحناوي يرجحان أن المقصود شخص شرير، أي الشيطان، لا الشر المجرد؛ و«الشرير» تحافظ على ذلك من غير إضافة تفسيرية.
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: لا يمسّه
  rationale: يحافظ «يمسّه» على الصورة اللفظية للفعل ἅπτομαι، بينما توضح الحاشية إمكان دلالته على التمكن المؤذي.
theological_decisions:
- issue: دلالة المضارع في οὐχ ἁμαρτάνει
  choice: نفي المداومة على الخطيئة
  alternative: نفي ارتكاب المؤمن أي خطيئة على الإطلاق
  rationale: 'صيغة المضارع تسمح بالدلالة على الفعل المستمر أو المعتاد، وهذا ينسجم مع إقرار الرسالة بإمكان خطيئة المؤمنين في 1 يوحنا 1: 8-10؛ 2: 1، من غير إلغاء قوة العبارة الأخلاقية هنا.'
- issue: مرجع ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: إبقاء عبارة «الذي وُلِد من الله» غير محسومة في المتن
  alternative: أن يكون المقصود المؤمن نفسه، أو أن يكون المقصود يسوع ابن الله
  rationale: التركيب اليوناني لا يسمّي المرجع صراحة. لذلك لم تُدرج هوية تفسيرية في المتن، وذُكرت القراءتان في الحاشية.
- issue: العلاقة بين αὐτόν وفاعل τηρεῖ
  choice: ترجمة الضمير «ـه» بحسب صورته غير الانعكاسية في النص
  alternative: 'فهمه بمعنى انعكاسي: «يحفظ نفسه»'
  rationale: قراءة SBLGNT هي αὐτόν، لا ضميرًا انعكاسيًا، لكن بعضهم يفهم العبارة على أن المولود من الله يحفظ نفسه. تحفظ الترجمة صيغة النص وتوثق البديل في الحاشية.
- issue: مدى سلطان الشرير في οὐχ ἅπτεται αὐτοῦ
  choice: الإبقاء على صورة «لا يمسّه» مع بيان معنى الأذى المحتمل
  alternative: 'التفسير المباشر: «لا يتمكن منه» أو «لا يؤذيه»'
  rationale: تجنبت الترجمة حسم طبيعة هذا المسّ أو مداه، وحافظت على اللفظ اليوناني مع توضيح قوته السياقية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. استُعملت «الخطيئة» و«الشرير» بوصفهما تعبيريْن كتابييْن مألوفيْن، مع تجنب الألفاظ القديمة مثل «يلده» والتوسعات العقائدية غير المصرح بها في النص. وُضعت جميع علامات الحواشي [a] و[b] و[c] في المتن بترتيب منطقي.
