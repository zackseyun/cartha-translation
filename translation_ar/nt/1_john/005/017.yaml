  text: πᾶσα ἀδικία ἁμαρτία ἐστίν, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/017.yaml
  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: ar
  text: كُلُّ إِثْمٍ خَطِيئَةٌ، وَتُوجَدُ خَطِيئَةٌ لَا تُؤَدِّي إِلَى الْمَوْتِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا تفضي إلى الموت»، وبصياغة أقرب إلى اللفظ: «ليست إلى الموت».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ἀδικία
  choice: كُلُّ إِثْمٍ
  rationale: تفيد πᾶσα مع الاسم المفرد غير المعرّف شمول كل ما يندرج تحت ἀδικία. و«الإثم» تعبير عربي واضح وذو دلالة أخلاقية واسعة تشمل فعل الشر ومجانبة البر، من غير حصر المعنى في الظلم الاجتماعي.
- source_word: ἁμαρτία
  choice: خَطِيئَةٌ
  rationale: المقابل العربي المعياري والدقيق لـἁμαρτία في الموضعين، ويحافظ على تكرار اللفظة اليونانية.
- source_word: καὶ
  choice: وَ
  rationale: أداة ربط بسيطة تصل التقرير العام بالإيضاح اللاحق من غير إضافة دلالة تفسيرية.
- source_word: ἔστιν ἁμαρτία
  choice: تُوجَدُ خَطِيئَةٌ
  rationale: صياغة عربية طبيعية تنقل معنى الوجود في ἔστιν، وتوضح أن المقصود وجود خطيئة من هذا النوع.
- source_word: οὐ πρὸς θάνατον
  choice: لَا تُؤَدِّي إِلَى الْمَوْتِ
  rationale: تنقل الدلالة الاتجاهية أو الناتجية لحرف الجر πρός في هذا السياق بلغة عربية حديثة واضحة، مع إبقاء «الموت» بلا تقييد تفسيري.
theological_decisions:
- issue: طبيعة «الموت» في عبارة οὐ πρὸς θάνατον
  choice: إبقاء اللفظ «الموت» من غير وصف
  alternative: الموت الجسدي، أو الموت الروحي، أو الدينونة النهائية
  rationale: لا يحدد النص اليوناني نوع الموت، ولذلك تحفظ الترجمة الانفتاح التفسيري ولا تحسم الخلاف لاهوتيًا.
- issue: دلالة ἀδικία الأخلاقية
  choice: الإثم
  alternative: الشر، أو فعل السوء، أو الظلم
  rationale: «الإثم» يحفظ البعد الأخلاقي والديني الواسع للكلمة، بينما قد يُفهم «الظلم» على نحو أضيق يقتصر على التعدي على حقوق الآخرين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «تؤدي إلى» لتوضيح العلاقة التي تعبّر عنها πρός، مع حاشية تحفظ الصياغة الأقرب إلى المبنى اليوناني. وُضع مؤشر الحاشية بعد العبارة التي يشرحها.
