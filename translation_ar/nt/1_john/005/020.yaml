revisions:
- from: ونحن نعلم أن ابن الله قد جاء، وأعطانا فهمًا لنعرف الحق؛ ونحن في الحق، في ابنه يسوع المسيح. هذا هو الإله الحق والحياة الأبدية.[a]
  to: ونحن نعلم أن ابن الله قد جاء، وأعطانا فهمًا لنعرف الإله الحق؛ ونحن في الإله الحق، في ابنه يسوع المسيح. هذا هو الإله الحق والحياة الأبدية.[a]
  rationale: التعديل يزيل الالتباس المحتمل في «الحق» بإظهار المرجع الشخصي الذي تقتضيه الصفة اليونانية المستعملة استعمال الاسم، مع الحفاظ على تكرار العبارة في الموضعين وعلى غموض مرجع «هذا». ولا يضيف المتن حكمًا تفسيريًا بشأن ما إذا كان اسم الإشارة يعود إلى الابن أو إلى الآب؛ وتبقى الحاشية لعرض الاحتمالين.
