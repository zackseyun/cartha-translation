  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: ar
  text: ونحن نعلم أن ابن الله قد جاء، وأعطانا فهمًا لنعرف الإله الحق؛ ونحن في الإله الحق، في ابنه يسوع المسيح. هذا هو الإله الحق والحياة الأبدية.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد يشير «هذا» إلى يسوع المسيح، وهو المرجع الأقرب، وقد يفهمه بعضهم على أنه يعود إلى «الإله الحق»، أي الآب، في العبارة السابقة.
    reason: بيان الاحتمالين في مرجع اسم الإشارة اليوناني οὗτός من غير حسم الغموض التفسيري.
lexical_decisions:
- source_word: οἴδαμεν
  choice: نعلم
  rationale: صيغة οἶδα التامة تؤدي هنا معنى الحالة الحاضرة الراسخة، ولذلك فالمضارع العربي هو الأنسب.
- source_word: ἥκει
  choice: قد جاء
  rationale: تفيد المجيء الذي تم وله أثر حاضر، و«قد جاء» تنقل هذا المعنى بوضوح.
- source_word: δέδωκεν
  choice: أعطانا
  rationale: الماضي العربي طبيعي في السياق، ويدل السياق على أن عطية الفهم ما زال أثرها قائمًا.
- source_word: διάνοιαν
  choice: فهمًا
  rationale: المقصود قدرة على إدراك الحق، لا مجرد الذهن بوصفه ملكة مجردة.
- source_word: ἵνα γινώσκωμεν
  choice: لنعرف
  rationale: تنقل لام التعليل غرض العطية بإيجاز وطبيعية.
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: الحق
  rationale: الصفة اليونانية مستعملة استعمال الاسم وتشير إلى شخص؛ و«الحق» تعبير عربي موجز يحافظ على تكرار اللفظ، مع إمكان فهمه بمعنى «الإله الحق» من السياق.
- source_word: ἐσμὲν ἐν
  choice: نحن في
  rationale: يحافظ على لغة يوحنا العلائقية من غير توسيعها إلى «نثبت» أو «نتحد».
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: في ابنه
  rationale: صياغة عربية طبيعية تحفظ حرف الجر وعلاقة البنوة والملكية.
- source_word: Ἰησοῦ Χριστῷ
  choice: يسوع المسيح
  rationale: «المسيح» المقابل العربي المألوف للقب Χριστός، ويحافظ هنا على دلالته اللقبية.
- source_word: οὗτός
  choice: هذا
  rationale: يحافظ على قوة اسم الإشارة اليوناني وعلى احتمال مرجعه بدل تحويله إلى ضمير يحسمه أسلوبيًا.
- source_word: ὁ ἀληθινὸς θεὸς
  choice: الإله الحق
  rationale: ترجمة مباشرة ودقيقة للعبارة الخبرية، وتنسجم مع أسلوب يوحنا.
- source_word: ζωὴ αἰώνιος
  choice: الحياة الأبدية
  rationale: التعبير العربي الكتابي الطبيعي الذي ينقل دوام الحياة وطبيعتها.
theological_decisions:
- issue: مرجع اسم الإشارة οὗτός في الجملة الأخيرة
  choice: الإبقاء على «هذا» في المتن، بما يجعل يسوع المسيح، وهو المرجع الشخصي الأقرب، القراءة الأظهر من غير تصريح تفسيري زائد.
  alternative: قد يعود اسم الإشارة إلى «الحق»، أي الآب، المذكور في العبارة السابقة.
  rationale: اسم الإشارة اليوناني يميل نحويًا إلى أقرب مرجع شخصي، لكنه ظل موضع نقاش تفسيري. تحافظ الصياغة الحرفية والحاشية على هذا التوتر بدل حسمه.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حوفظ على تكرار «الحق» وعلى تركيب «نحن في» المميز للغة يوحنا، مع تجنب الشرح المذهبي داخل المتن.
