id: 1JN.1.7
reference: 1 John 1:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: ar
  text: ولكن إن سلكنا في النور، كما هو نفسه في النور، فلدينا شركة بعضنا مع بعض[a]، ودم يسوع ابنه يطهّرنا من كل خطيئة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يفهم بعض المفسرين عبارة «بعضنا مع بعض» على أنها تشير إلى الشركة بين المؤمنين والله، لكن الضمير التبادلي في اليونانية يدل بطبيعته على الشركة المتبادلة بين المؤمنين.
    reason: alternative_reading
  - marker: b
    text: 'أو: «من كل الخطية» أو «من الخطية كلها». يمكن فهم اليونانية على نحو توزيعي («كل خطيئة») أو جمعي («الخطية كلها»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: ولكن إن
  rationale: تحفظ «لكن» قوة المقابلة مع قول العدد السابق عن السلوك في الظلمة، وتؤدي «إن» معنى الشرط.
- source_word: ἐν τῷ φωτὶ
  choice: في النور
  rationale: تحافظ العبارة على صورة النور المحورية في السياق اليوحناوي من غير تفسير زائد.
- source_word: περιπατῶμεν
  choice: سلكنا
  rationale: يحفظ «سلك» الاستعارة الأخلاقية في الأصل، وهو تعبير عربي واضح ومألوف، بدل اختزالها في «عشنا».
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: كما هو نفسه في النور
  rationale: تعكس «نفسه» بروز الضمير αὐτός، وتحفظ «كما» المقارنة من غير أن تفرض تماثلًا يتجاوز النص.
- source_word: κοινωνίαν ἔχομεν
  choice: تكون لنا شركة
  rationale: تنقل «شركة» معنى المشاركة والعلاقة المشتركة، من غير حصره في دلالة طقسية أو مذهبية.
- source_word: μετ’ ἀλλήλων
  choice: بعضنا مع بعض
  rationale: صياغة عربية طبيعية تحفظ التبادلية التي يدل عليها الضمير اليوناني.
- source_word: τὸ αἷμα Ἰησοῦ τοῦ υἱοῦ αὐτοῦ
  choice: دم يسوع ابنه
  rationale: تحفظ ترتيب الفكرة وعلاقة يسوع بالله بصفته ابنه، من غير إضافة تفسير إلى تركيب المضاف إليه.
- source_word: καθαρίζει
  choice: يطهّرنا
  rationale: ينقل «يطهّر» البعدين الأخلاقي والتطهيري للفعل، والمضارع العربي ملائم للدلالة الجارية أو المطّردة من غير توسيعها إلى «يظل يطهّر».
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: من كل خطيئة
  rationale: تظهر هذه الصياغة الوجه التوزيعي المحتمل للعبارة، مع بقاء القراءة الجمعية «من كل الخطية» ممكنة.
theological_decisions:
- issue: مرجع «بعضنا مع بعض» (μετ’ ἀλλήλων)
  choice: الشركة المتبادلة بين المؤمنين
  alternative: الشركة بين المؤمنين والله
  rationale: الضمير التبادلي ἀλλήλων يدل في الاستعمال الطبيعي على علاقة متبادلة بين الجماعة. أما السياق الأوسع فيذكر الشركة مع الله، ولذلك تُذكر القراءة الأخرى في الحاشية من غير إدخالها في المتن.
- issue: دلالة المضارع في καθαρίζει
  choice: «يطهّرنا» بصيغة المضارع البسيط
  alternative: «يواصل تطهيرنا» أو فهمه كتطهير نقطي
  rationale: قد يدل المضارع اليوناني هنا على فعل جارٍ أو مطّرد، لكن المضارع العربي يؤدي ذلك طبيعيًا من غير فرض صيغة استمرارية مشددة لا يقتضيها النص صراحة.
- issue: دلالة πάσης ἁμαρτίας
  choice: 'قراءة توزيعية: «كل خطيئة»'
  alternative: 'قراءة جمعية: «كل الخطية» أو «الخطية كلها»'
  rationale: يسمح تركيب πάσης مع الاسم المفرد بالوجهين التوزيعي والجمعي؛ اختيرت الصياغة التوزيعية الواضحة، مع حفظ البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. حُفظت استعارتا السلوك والنور، واستُعملت «شركة» بمعناها العلائقي العام. وُضعت علامتا الحاشيتين عند العبارتين اللتين تتعلقان بهما مباشرة.
