  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: ar
  text: إن اعترفنا بخطايانا، فهو أمين وبارّ[a] لكي يغفر لنا خطايانا ويطهّرنا من كل إثم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو «عادل»: «فهو أمين وعادل لكي يغفر لنا خطايانا ويطهّرنا من كل إثم».'
    reason: بديل معجمي معتبر للكلمة اليونانية δίκαιος، يبرز جانب العدل من غير أن يكون المعنى الوحيد الممكن.
lexical_decisions:
- source_word: ἐὰν
  choice: إن
  rationale: تحافظ «إن» على قوة الشرط الاحتمالي من غير أن تضيف معنى التكرار الذي قد توحي به «كلما».
- source_word: ὁμολογῶμεν
  choice: اعترفنا
  rationale: «اعترف» هو التعبير العربي الطبيعي في سياق الخطايا، ويدل على الإقرار الصريح بها.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: بخطايانا
  rationale: صياغة عربية موجزة وطبيعية تؤدي المفعول به مع ضمير الملكية، ويتطلب الفعل «اعترف» الباء في الاستعمال العربي.
- source_word: πιστός
  choice: أمين
  rationale: تنقل «أمين» معنى الثبات والجدارة بالثقة والوفاء، وتلائم وصف الله في هذا السياق.
- source_word: δίκαιος
  choice: بارّ
  rationale: تحفظ «بارّ» الدلالة الأخلاقية الواسعة للكلمة، مع إبقاء «عادل» بديلًا ممكنًا في الحاشية لعدم حصر المعنى في الجانب القضائي.
- source_word: ἵνα
  choice: فـ
  rationale: تربط الفاء الغفران والتطهير بكون الله أمينًا وبارًّا بأسلوب عربي طبيعي، من غير أن تفرض تمييزًا حادًا بين الغاية والنتيجة في تركيب ἵνα هنا.
- source_word: ἀφῇ
  choice: يغفر
  rationale: المعنى المعتاد والدقيق للفعل في سياق الخطايا هو الغفران.
- source_word: ἡμῖν τὰς ἁμαρτίας
  choice: يغفر لنا خطايانا
  rationale: ينقل الداتيف والمفعول المباشر بتركيب عربي واضح ومألوف.
- source_word: καθαρίσῃ
  choice: يطهّرنا
  rationale: يحفظ صورة إزالة الدنس الأخلاقي، وهو أنسب من تعبيرات أقل مباشرة مثل «ينقّينا» في هذا السياق.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: من كل إثم
  rationale: «الإثم» تعبير عربي طبيعي واسع عن الشر الأخلاقي ومخالفة الحق، ويتجنب تضييق ἀδικία إلى الظلم الواقع على الآخرين وحده.
theological_decisions:
- issue: دلالة δίκαιος وعلاقتها بغفران الله
  choice: بارّ
  alternative: عادل
  rationale: يربط النص الغفران والتطهير بصفة الله. وتحفظ «بارّ» الاستقامة الأخلاقية الواسعة، بينما تظل «عادل» قراءة معجمية معتبرة قد تبرز البعد القضائي؛ لذلك أُثبتت في الحاشية بدل استبعادها.
- issue: العلاقة التي تفيدها ἵνα بعد «أمين وبارّ»
  choice: الفاء في «فيغفر... ويطهّر»
  alternative: لكي يغفر... ويطهّر
  rationale: يحتمل التركيب اليوناني الغاية أو النتيجة المقصودة، والفاء تؤدي الارتباط في العربية بسلاسة من غير أن تحسم هذا التوتر الدلالي أكثر مما يسمح به الأصل.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة وموقرة. استُعملت ألفاظ مألوفة في السياق الكتابي من غير تراكيب قديمة ثقيلة، ووُضعت علامة الحاشية مباشرة بعد اللفظ الذي تتعلق به.
