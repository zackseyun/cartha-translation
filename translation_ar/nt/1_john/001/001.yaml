id: 1JN.1.1
reference: 1 John 1:1
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: ar
  text: ما كان منذ البدء[a]، وما سمعناه، وما رأيناه بعيوننا، وما تأملناه ولمسته أيدينا، بشأن كلمة الحياة[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: استُعملت «ما» لأن اليونانية تأتي بضمير موصول محايد، قد يشير على نحو واسع إلى مضمون الشهادة الرسولية بشأن الابن، بدل أن تسميه مباشرةً بقولها «مَن».
    reason: alternative_reading
  - marker: b
    text: يمكن أن تشير «كلمة الحياة» شخصيًا إلى الابن، في صدى مقصود ليوحنا 1:1، أو إلى الرسالة المانحة للحياة بشأنه. ولا تملك العربية تمييز الحرف الكبير الموجود في بعض الترجمات.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: ما
  rationale: تؤدي «ما» وظيفة اسم الموصول لغير العاقل أو للمعنى الواسع، فتحفظ اتساع الضمير اليوناني المحايد ولا تحوّله صراحةً إلى إحالة شخصية مثل «مَن».
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: كان منذ البدء
  rationale: صياغة عربية طبيعية تحافظ على دلالة الماضي المستمر وعلى الصدى اليوحناوي لعبارة «منذ البدء».
- source_word: ἀκηκόαμεν
  choice: سمعناه
  rationale: الماضي العربي هو الأنسب هنا للشهادة عن خبرة واقعة، ولا يلزم إدخال فعل مساعد لمحاكاة التام اليوناني؛ والضمير المتصل يحافظ على المفعول الموصول.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: رأيناه بعيوننا
  rationale: أُبقي التوكيد الحسي الصريح «بعيوننا»، مع صياغة عربية واضحة وطبيعية.
- source_word: ἐθεασάμεθα
  choice: تأملناه
  rationale: «تأمل» يفيد النظر المقصود والمتفحص، وهو أدق من مجرد «رأى» وأوضح للقارئ الحديث من ألفاظ عربية مهجورة.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: لمسته أيدينا
  rationale: تحافظ العبارة على واقعية اللمس وعلى إبراز «أيدينا» بوصفها الفاعل، من دون المبالغة التي قد توحي بها صياغات مثل «تفحصته أيدينا».
- source_word: περὶ
  choice: بشأن
  rationale: تقدّم موضوع الشهادة بعبارة عربية فصيحة وواضحة تلائم افتتاحية الرسالة.
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: كلمة الحياة
  rationale: تحافظ «كلمة» على إمكان الإشارة إلى الكلمة/الابن وعلى معنى الخبر أو الرسالة، بدل حصر العبارة في أحد الوجهين. والعربية لا تستخدم الحرف الكبير للتمييز بين الدلالة الشخصية وغير الشخصية.
theological_decisions:
- issue: مرجع الجمل الموصولة المحايدة ومعنى λόγος
  choice: استعمال «ما» في المطلع و«كلمة الحياة» في المتن، من غير تحويل المرجع صراحةً إلى «مَن» أو استبدال «كلمة» بـ«رسالة».
  alternative: «مَن كان منذ البدء» أو «رسالة الحياة».
  rationale: السياق يحمل شهادة مسيانية واضحة، لكن النص اليوناني يستعمل ضمائر موصولة محايدة، كما أن λόγος يمكن أن يدل على الشخص وعلى الكلمة المعلنة. تحفظ الصياغة هذا التوتر المقصود ولا تحسمه بما يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. حوفظ على التكرار الإيقاعي لـ«ما» وعلى التدرج الحسي من السماع إلى الرؤية المتأملة ثم اللمس، كما حوفظت الشرطة الختامية لأن الجملة تستمر في الآيات التالية.
