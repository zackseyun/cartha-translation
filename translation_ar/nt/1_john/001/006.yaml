  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: ar
  text: إِنْ قُلْنَا إِنَّ لَنَا شَرِكَةً مَعَهُ، وَنَسْلُكُ فِي الظُّلْمَةِ[a]، فَإِنَّنَا نَكْذِبُ وَلَا نُمَارِسُ الْحَقَّ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «في ظلمة». في اليونانية أداة تعريف، وقد تشير «الظلمة» في استعمال يوحنا إلى المجال الأخلاقي الروحي المناقض لله.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «لا نفعل الحق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: إِنْ قُلْنَا
  rationale: يحافظ على صيغة الشرط واحتمالها من غير إضافة معنى «ادّعينا» التفسيري.
- source_word: κοινωνίαν ἔχομεν
  choice: لَنَا شَرِكَةٌ
  rationale: صياغة عربية طبيعية تحافظ على معنى المشاركة والعلاقة الكامن في اللفظ اليوناني.
- source_word: μετ’ αὐτοῦ
  choice: مَعَهُ
  rationale: يحافظ على الضمير كما في الأصل، من غير التصريح بمرجعه الذي يبيّنه السياق.
- source_word: καὶ
  choice: وَمَعَ ذَلِكَ
  rationale: 'تُظهر القوة التقابلية التي تحملها الواو في هذا السياق: القول بوجود الشركة يقابله السلوك في الظلمة.'
- source_word: ἐν τῷ σκότει
  choice: فِي الظُّلْمَةِ
  rationale: يحافظ على أداة التعريف وعلى الصورة الأخلاقية الروحية المميزة للاستعمال اليوحناوي.
- source_word: περιπατῶμεν
  choice: نَسْلُكُ
  rationale: يحفظ استعارة المشي بوصفه نهجًا مستمرًا في الحياة، وهي استعارة مفهومة في العربية الكتابية المعاصرة.
- source_word: ψευδόμεθα
  choice: نَكْذِبُ
  rationale: تعبير عربي مباشر يحافظ على الفعل في الزمن الحاضر وعلى المقابلة مع ممارسة الحق.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: لَا نُمَارِسُ الْحَقَّ
  rationale: ينقل التعبير اليوحناوي «لا نفعل الحق» بلغة عربية طبيعية، مع إبقاء الحق أمرًا يُمارَس لا مجرد فكرة يُصدَّق بها.
theological_decisions:
- issue: الصورة الأخلاقية الروحية للظلمة
  choice: الإبقاء على «نسلك في الظلمة»
  alternative: نعيش في الخطيئة
  rationale: الظلمة في السياق اليوحناوي تشمل الشر والباطل والابتعاد عن الله، ولا ينبغي اختزالها في تفسير عقائدي واحد.
- issue: العلاقة بين الحق والسلوك
  choice: «لا نمارس الحق»
  alternative: «لا نفعل الحق»
  rationale: تحافظ الصياغة على البعد العملي للحق من غير أن تحصره في مجرد قول الصدق، بينما تُذكر الصيغة الحرفية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت استعارتا «السلوك» و«الظلمة» لما لهما من أهمية في خطاب يوحنا، واستُخدمت «نمارس الحق» لتجنب التركيب الحرفي غير المألوف مع إبقاء معناه العملي.
