  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: ar
  text: إن قلنا إننا لم نخطئ[a]، فإننا نجعله كاذبًا، وكلمته[b] ليست فينا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «ما أخطأنا». استُعمل في اليونانية فعل بصيغة التام، فيشير إلى فعل ماضٍ له دلالة حاضرة؛ وتؤدي «لم نخطئ» هذا المعنى بأقرب صياغة عربية طبيعية.'
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة «كلمته» بـ«رسالته». فاللفظة اليونانية λόγος تحتمل المعنيين، وأُبقيت «كلمته» حفاظًا على أسلوب يوحنا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: إن قلنا
  rationale: تنقل أداة الشرط مع فعل القول بصياغة عربية طبيعية، من غير إضافة معنى الادعاء غير المصرَّح به في اللفظ اليوناني.
- source_word: οὐχ ἡμαρτήκαμεν
  choice: لم نخطئ
  rationale: الفعل اليوناني في صيغة التام يدل على خطيئة وقعت في الماضي ولها دلالة حاضرة. لا تملك العربية مقابلاً صرفيًا مطابقًا، و«لم نخطئ» هي الصياغة الأوضح، مع بيان الفرق الدلالي في الحاشية، ومن دون المبالغة بقول «لم نخطئ قط».
- source_word: ψεύστην
  choice: كاذبًا
  rationale: يحافظ على قوة الاسم اليوناني الذي يصف الشخص بأنه كاذب، ولا يلطّفه إلى مجرد كون قوله غير صحيح.
- source_word: ποιοῦμεν αὐτὸν
  choice: نجعله
  rationale: 'ينقل تركيب الفعل مع الخبر المنصوب مباشرة وبصورة عربية سليمة: نجعله كاذبًا، أي ننسب إليه الكذب.'
- source_word: ὁ λόγος αὐτοῦ
  choice: كلمته
  rationale: تحفظ اللفظة اليوحناوية وصداها الأوسع، مع إمكان فهمها بمعنى رسالته أو قوله، وهو مبيَّن في الحاشية.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: ليست فينا
  rationale: ترجمة مباشرة تحفظ البعد الداخلي للتعبير، من غير إضافة صورة «السكنى» التي لا يصرح بها النص هنا.
theological_decisions:
- issue: مرجع الضميرين αὐτόν وαὐτοῦ
  choice: الإبقاء على الضمير في «نجعله» و«كلمته»، ومرجعه في السياق هو الله.
  alternative: 'التصريح بالاسم: «نجعل الله كاذبًا، وكلمة الله ليست فينا».'
  rationale: يشير السياق القريب إلى الله بوصفه صاحب الشهادة والكلمة، لكن إبقاء الضمير يحافظ على بنية النص اليوناني ولا يحسم في المتن أكثر مما صرّح به.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. أُضيفت الفاء في جواب الشرط («فإننا») لسلاسة الربط العربي، من غير تغيير العلاقة المنطقية. وُضعت علامة الحاشية [b] بعد «كلمته» لأنها تخص معنى λόγος.
