source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: ar
  text: ما رأيناه وسمعناه نعلنه لكم أنتم أيضًا، لكي تكون لكم أنتم أيضًا شركة[a] معنا؛ وشركتنا نحن هي حقًّا مع الآب ومع ابنه يسوع المسيح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا فهم «الشركة» بمعنى المشاركة أو الاشتراك في حياة وعلاقة مشتركة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: ما رأيناه وسمعناه
  rationale: تحافظ «ما» على الإحالة المحايدة الواسعة في اليونانية، ويؤدي الماضي العربي معنى الشهادة القائمة على الرؤية والسماع دون افتعال صيغة زمنية غير طبيعية.
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: نعلنه لكم أنتم أيضًا
  rationale: «نعلن» تنقل معنى الإخبار والإعلان العلني، و«أيضًا» تمثل καὶ، مع إبراز ضمير المخاطبين بصورة طبيعية.
- source_word: ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν
  choice: لكي تكون لكم أنتم أيضًا شركة معنا
  rationale: «لكي» تبين الغاية، و«شركة» لفظ عربي مألوف كتابيًا يجمع معنى المشاركة والعلاقة المشتركة دون قصره على الصحبة الاجتماعية.
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: وشركتنا نحن هي حقًّا
  rationale: «حقًّا» تبرز القوة التفسيرية والتوكيدية لـ δέ في السياق، و«نحن» يعكس توكيد صفة الملكية ἡ ἡμετέρα.
- source_word: μετὰ τοῦ πατρὸς
  choice: مع الآب
  rationale: «الآب» هو اللقب العربي الواضح والمتعارف عليه لله في هذا السياق اليوحناوي.
- source_word: μετὰ τοῦ υἱοῦ αὐτοῦ
  choice: مع ابنه
  rationale: صياغة عربية طبيعية تحفظ علاقة البنوة وعود الضمير إلى الآب.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» يترجم Χριστός بوصفه لقبًا ذا معنى مسياني، وهو في العربية لقب معرف لا مجرد نقل صوتي للاسم.
theological_decisions:
- issue: دلالة κοινωνία
  choice: شركة
  alternative: مشاركة أو اتحاد
  rationale: «شركة» تحفظ معًا البعد العلائقي والتشاركي في علاقة المؤمنين بالشهود وفي علاقتهم بالآب والابن، من غير حصر المعنى في مفهوم اجتماعي أو طقسي.
- issue: ترجمة Χριστοῦ
  choice: المسيح
  alternative: كريستوس (نقل صوتي)
  rationale: 'اللفظ اليوناني لقب يعني الممسوح/المسيح؛ والترجمة العربية المألوفة «المسيح» تحفظ معنى اللقب في عبارة طبيعية: «يسوع المسيح».'
- issue: صلة الشركة بالآب والابن
  choice: وشركتنا نحن هي حقًّا مع الآب ومع ابنه
  alternative: أي إن شركتنا مع الآب ومع ابنه
  rationale: أُبقي البناء تقريرًا مستقلًا كما في الأصل، دون تفسير طبيعة هذه الشركة أو دمجها منطقيًا في جملة الغاية بما يزيل التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أنتم أيضًا» لإظهار καὶ ὑμεῖς، و«حقًّا» لنقل النبرة التوكيدية في καὶ...δέ. وُضع مؤشر الحاشية بعد «يسوع المسيح» مع أن الحاشية تشرح لفظ «الشركة»؛ والأدق نشرًا نقله إلى أول ورود للفظ، لكن النص المقدم يلتزم بوجود المؤشر في المتن.
