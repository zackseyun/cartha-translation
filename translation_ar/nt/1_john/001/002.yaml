  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: ar
  text: وقد أُظهرت الحياة[a]، وقد رأينا ونشهد ونعلن لكم الحياة الأبدية[b]، التي كانت عند الآب وأُظهرت لنا—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ظهرت» أو «تجلّت»؛ فالفعل اليوناني (ἐφανερώθη) يدل على صيرورة ما كان غير ظاهر ظاهرًا أو معلومًا.'
    reason: lexical_alternative
  - marker: b
    text: تَرِد عبارة «الحياة الأبدية» نحويًا بصيغة اسم لشيء، لكن سياقها يشير إلى الابن على نحو شخصي، الذي كان عند الآب وأُظهر لنا.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: الحياة
  rationale: حُفظ الاسم المعرّف وتكراره، لأن يوحنا لا يتحدث هنا عن الحياة بوصفها مفهومًا مجردًا فحسب، بل عن حقيقة محددة ذات دلالة شخصية مرتبطة بالابن.
- source_word: ἐφανερώθη
  choice: أُظهرت
  rationale: صيغة المبني للمجهول تعكس الفعل اليوناني وتحافظ على معنى إظهار ما لم يكن ظاهرًا، مع إبقاء «ظهرت» بديلًا معجميًا ممكنًا في الحاشية.
- source_word: ἑωράκαμεν
  choice: قد رأينا
  rationale: «قد» مع الماضي تنقل تمام الرؤية وثبوتها وأثرها المستمر في شهادة المتكلمين.
- source_word: μαρτυροῦμεν
  choice: نشهد
  rationale: تعبير عربي طبيعي وموجز يحفظ معنى الشهادة المباشرة.
- source_word: ἀπαγγέλλομεν
  choice: نعلن
  rationale: يميّز الإعلان الموجَّه إلى المخاطبين عن فعل الشهادة السابق، ويحفظ قوة الإبلاغ العلني.
- source_word: ὑμῖν
  choice: لكم
  rationale: نقل صريح للمفعول غير المباشر في اليونانية.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: الحياة الأبدية
  rationale: يحفظ التعريف والتحديد الوصفي في تركيب عربي طبيعي، ويشير إلى حياة بعينها لا إلى معنى مجرد غير محدد.
- source_word: ἥτις
  choice: التي
  rationale: يوافق سابقه النحوي «الحياة» المؤنث، ولا يستبدله بضمير شخصي يصرّح بما تركه النص في صيغة اسمية.
- source_word: ἦν πρὸς τὸν πατέρα
  choice: كانت عند الآب
  rationale: «عند» تعبير عربي موجز وطبيعي يدل على المعية والقرب العلائقي، مع الحفاظ على الصلة بأسلوب يوحنا دون توسيع تفسيري.
- source_word: τὸν πατέρα
  choice: الآب
  rationale: استُعمل اللقب الإلهي العربي المألوف في هذا السياق.
- source_word: ἡμῖν
  choice: لنا
  rationale: يحفظ جهة الإظهار ويؤكد موقع المتكلمين بوصفهم شهودًا.
theological_decisions:
- issue: هل تُصاغ «الحياة» صياغة غير شخصية أم يُصرَّح بأن المقصود هو الابن؟
  choice: الإبقاء على «الحياة» و«الحياة الأبدية» في المتن
  alternative: استبدالها بضمير شخصي مثل «هو»، أو إضافة «أي الابن»
  rationale: يستخدم اليوناني الاسم ζωή ولا يسمّي الابن صراحة في هذه الجملة. يحفظ هذا الاختيار الصورة اللاهوتية اليوحناوية ويترك المرجع الشخصي يظهر من السياق بدل حسمه بإضافة تفسيرية.
- issue: مدى التصريح بالوجود السابق في πρὸς τὸν πατέρα
  choice: كانت عند الآب
  alternative: كانت في حضرة الآب
  rationale: تنقل «عند الآب» المعية والعلاقة كما في التعبير اليوناني، من غير تحويل العبارة إلى شرح عقائدي موسع.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. حُفظ تتابع الأفعال «رأينا ونشهد ونعلن» وإيقاع العطف في الأصل، كما حُفظت الشرطة الختامية لأن الآية جزء من جملة ممتدة إلى ما بعدها.
