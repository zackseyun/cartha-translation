  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: ar
  text: 'وهذه هي الرسالة التي سمعناها منه ونعلنها لكم: إن الله نور، وليس فيه أي ظلمة على الإطلاق.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία
  choice: الرسالة
  rationale: تنقل معنى الخبر أو المضمون المُبلَّغ، وهي طبيعية في سياق الرسالة.
- source_word: ἀκηκόαμεν
  choice: سمعناها
  rationale: يدل الماضي العربي هنا على السماع السابق الذي يقوم عليه الإعلان الحاضر؛ وتعود الهاء على «الرسالة».
- source_word: ἀπ’ αὐτοῦ
  choice: منه
  rationale: يحافظ على الضمير كما في اليونانية من غير تعيين مرجعه تفسيرياً.
- source_word: ἀναγγέλλομεν
  choice: نعلنها
  rationale: يعبّر عن نقل الرسالة إلى المخاطَبين، ويحافظ قدر الإمكان على الصلة الدلالية بين الرسالة والإعلان.
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: الله نور
  rationale: يحفظ الاستعارة الخبرية الموجزة والطابع النوعي للمحمول دون إضافة «هو النور» أو أوصاف تفسيرية.
- source_word: σκοτία
  choice: ظلمة
  rationale: تحفظ المجالين الحرفي والمجازي في الاستعمال اليوحناوي.
- source_word: ἐν αὐτῷ οὐκ ἔστιν οὐδεμία
  choice: ليس فيه أي ظلمة على الإطلاق
  rationale: صياغة عربية واضحة تحفظ النفي المؤكد وقوة οὐδεμία.
theological_decisions:
- issue: الخبر المجازي «الله نور»
  choice: إبقاء العبارة «الله نور» بلا شرح
  alternative: الله نور مقدس / الله هو النور
  rationale: النص اليوناني يقرر الاستعارة مباشرة، وإضافة «مقدس» تضيق دلالتها، أما التعريف في «هو النور» فقد يحول الوصف النوعي إلى تعيين.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على إيجاز الأصل وتوكيده. لم تُضف حاشية لأن البديل الإنجليزي المذكور يخص فعل «نعلن»، لا استعارة «النور»، ويبدو موضع علامته في طبقة الاستشارة الإنجليزية غير متسق.
