  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: ar
  text: إِنْ قُلْنَا إِنَّهُ لَيْسَ فِينَا خَطِيئَةٌ[a]، فَإِنَّنَا نَخْدَعُ أَنْفُسَنَا، وَلَيْسَ الْحَقُّ فِينَا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بتعبير تفسيري أكثر: «نزعة إلى الخطيئة»؛ واليونانية تقول حرفيًا: «خطيئة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: إِنْ قُلْنَا
  rationale: ينقل تركيب الشرط مع صيغة الاحتمال في اليونانية إلى شرط عربي طبيعي ومباشر.
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: لَيْسَ فِينَا خَطِيئَةٌ
  rationale: يحافظ على «الخطيئة» بصيغة المفرد الدالة هنا على وجود الخطيئة وحضورها، لا على خطيئة منفردة ولا على مجرد ارتكاب أفعال في الماضي. وصياغة «فينا» أوضح وأفصح عربيًا من النقل الحرفي «لنا خطيئة» في هذا السياق.
- source_word: ἑαυτοὺς πλανῶμεν
  choice: نَخْدَعُ أَنْفُسَنَا
  rationale: يؤدي معنى التضليل الواقع على الذات بعبارة عربية واضحة وطبيعية.
- source_word: ἡ ἀλήθεια
  choice: الْحَقُّ
  rationale: «الحق» تعبير عربي راسخ يحتفظ بإيحاء العبارة اليوحناوية بين الحقيقة الموضوعية والصدق الداخلي من غير تقييد المعنى بأحدهما.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: لَيْسَ الْحَقُّ فِينَا
  rationale: يحفظ صورة وجود الحق «فينا» وبُعدها الداخلي والشخصي، من غير توسيع تفسيري.
theological_decisions:
- issue: معنى الخطيئة في القول إنها ليست فينا
  choice: الإبقاء على «خطيئة» بالمفرد للدلالة على وجود الخطيئة في الإنسان
  alternative: «لسنا خطاة» أو «لم نرتكب خطيئة» أو «ليس فينا ميل إلى الخطيئة»
  rationale: النص اليوناني يقول حرفيًا إننا «لا نملك خطيئة»، وهو يختلف عن إنكار ارتكاب الخطايا في العدد 10. لذلك لا يُحوَّل المعنى إلى إنكار أفعال ماضية ولا يُفسَّر بمصطلح أضيق.
- issue: دلالة «الحق فينا»
  choice: ليس الحق فينا
  alternative: «ليست حقيقة الله فينا» أو «لسنا صادقين» أو «لا نحيا بحسب الحق»
  rationale: تحتمل العبارة اليونانية صدى الحق الإلهي والصدق معًا؛ لذا تُحفظ بصورتها الموجزة من غير حسم لهذا التوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة، مع ضبط كامل للنص القصير. استُخدمت «ليس فينا خطيئة» بدل صياغة الملكية الحرفية لتكون طبيعية في العربية مع الحفاظ على معنى حضور الخطيئة. وُضع مؤشر الحاشية [a] في المتن كما هو مطلوب.
