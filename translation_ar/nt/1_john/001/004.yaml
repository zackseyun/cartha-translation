lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف طبيعي يصل هذه العبارة بالشهادة السابقة.
- source_word: ταῦτα
  choice: بهذه الأمور
  rationale: يحافظ على دلالة اسم الإشارة المحايد الجمع، ويشير طبيعيًا إلى مضمون ما يكتبه الرسول.
- source_word: γράφομεν
  choice: نكتب إليكم
  rationale: المضارع يدل على فعل الكتابة الجاري في سياق الرسالة. أُضيف «إليكم» للإفصاح الطبيعي عن جهة الكتابة المفهومة من المقام من غير تغيير المعنى.
- source_word: ἡμεῖς
  choice: نحن
  rationale: ذِكر الضمير المنفصل يحفظ توكيد الضمير الصريح في اليونانية، مع أن صيغة الفعل العربية تدل عليه أيضًا.
- source_word: ἵνα
  choice: لكي
  rationale: تؤدي معنى الغاية، مع إمكان تضمن السياق دلالة النتيجة.
- source_word: χαρά
  choice: فرح
  rationale: المقابل العربي المعياري والطبيعي، ويحافظ على التعبير اليوحناوي.
- source_word: ἡμῶν
  choice: فرحنا
  rationale: ينقل قراءة نص SBLGNT، «لنا/نا»، مباشرة، مع إثبات القراءة البديلة المهمة في الحاشية.
- source_word: ᾖ πεπληρωμένη
  choice: يكتمل
  rationale: ينقل حالة الامتلاء أو التمام الناتجة عن تركيب فعل الكينونة في صيغة الاحتمال مع اسم المفعول التام المبني للمجهول، بعبارة عربية واضحة وطبيعية.
theological_decisions:
- issue: الضمير في ἡ χαρὰ ἡμῶν
  choice: فرحنا
  alternative: فرحكم
  rationale: النص اليوناني المعطى يقرأ ἡμῶν، أي «فرحنا». ولأن «فرحكم» قراءة مخطوطية معروفة ومؤثرة في المعنى، حُفظت في الحاشية بدل إدخالها في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «يكتمل» بدل الصياغة الحرفية الأثقل «يكون مملوءًا» لإيصال معنى بلوغ الفرح تمامه، مع الحفاظ على القراءة النصية «فرحنا» والتعريف ببديلها في الحاشية.
