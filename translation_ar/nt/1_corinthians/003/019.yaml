  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: ar
  text: 'لِأَنَّ حِكْمَةَ هٰذَا الْعَالَمِ حَمَاقَةٌ عِنْدَ اللهِ، لِأَنَّهُ مَكْتُوبٌ: «الْآخِذُ الْحُكَمَاءَ بِمَكْرِهِمْ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بِدَهَائِهِمْ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: حِكْمَة
  rationale: المقابل العربي المباشر، ويشير هنا إلى ما يدّعيه العالم حكمةً، لا إلى مجرد الذكاء.
- source_word: κόσμου τούτου
  choice: هٰذَا الْعَالَمِ
  rationale: يحافظ على معنى κόσμος بوصفه العالم أو النظام البشري الحاضر، من غير تحويله إلى «هذا الدهر».
- source_word: μωρία
  choice: حَمَاقَة
  rationale: لفظ عربي واضح يحمل التقابل القوي الذي يقيمه بولس بين حكمة العالم وحكم الله عليها.
- source_word: παρὰ τῷ θεῷ
  choice: عِنْدَ اللهِ
  rationale: 'تعبير عربي طبيعي يحفظ المنظور التقويمي: في نظر الله وحكمه.'
- source_word: γέγραπται
  choice: كُتِبَ
  rationale: صيغة عربية مألوفة لتقديم اقتباس كتابي، وتحفظ المبني للمجهول في اليونانية.
- source_word: δρασσόμενος
  choice: يَأْخُذُ
  rationale: ينقل معنى القبض على الشخص أو الإمساك به، ويلائم الصياغة الاقتباسية هنا.
- source_word: σοφοὺς
  choice: الْحُكَمَاءَ
  rationale: يحفظ وصف الأشخاص بالحكمة من غير زيادة دلالة جنسية غير لازمة.
- source_word: πανουργίᾳ
  choice: مَكْرِهِمْ
  rationale: يعبر بوضوح عن الدهاء ذي البعد السلبي المقصود في السياق.
theological_decisions:
- issue: تحديد فاعل الصفة الاسمية ὁ δρασσόμενος في الاقتباس من أيوب 5:13
  choice: هُوَ الَّذِي يَأْخُذُ الْحُكَمَاءَ
  alternative: الآخِذُ الْحُكَمَاءَ
  rationale: الضمير يعود سياقيًا إلى الله المذكور قبل الاقتباس، وإظهاره بهذه الصياغة يجعل العربية تامة وطبيعية من غير إضافة دعوى لاهوتية جديدة.
- issue: دلالة παρὰ τῷ θεῷ التقويمية
  choice: عِنْدَ اللهِ
  alternative: فِي نَظَرِ اللهِ
  rationale: «عند الله» تحافظ على إيجاز الأصل وتبقي معنى المنظور أو الحكم الإلهي حاضرًا من غير تفسير زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «عند الله» لصون إيجاز الأصل ودلالته التقويمية، و«مكرهم» لنقل الشحنة السلبية في πανουργία. وُضعت علامة الحاشية بعد الاقتباس مباشرة.
