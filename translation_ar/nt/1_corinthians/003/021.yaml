lexical_decisions:
- source_word: ὥστε
  choice: لذلك
  rationale: تفيد استخلاص نتيجة مما سبق، و«لذلك» تنقل قوة الاستنتاج بوضوح في العربية المعاصرة.
- source_word: μηδεὶς
  choice: لا... أحدٌ
  rationale: صيغة نهي عامة تشمل كل شخص، وهذا التركيب عربي واضح وطبيعي.
- source_word: καυχάσθω
  choice: يفتخرنَّ
  rationale: ينقل فعل الافتخار بصيغة نهي مؤكدة، من غير تحويله إلى تفسير أوسع مثل التعصب أو الاتكال.
- source_word: ἐν ἀνθρώποις
  choice: بالبشر
  rationale: الباء تعبّر طبيعيًا عن الجهة أو الأساس الذي يقوم عليه الافتخار، و«البشر» لفظ عام غير مقصور على الذكور، مع إبقاء احتمال أن يكون المقصود في السياق قادةً من البشر.
- source_word: πάντα
  choice: كلَّ شيءٍ
  rationale: يحفظ الشمول الذي يفيده الجمع المحايد في اليونانية، ويأتي طبيعيًا في العربية.
- source_word: γὰρ
  choice: لأنَّ
  rationale: تقدّم العلة التي يقوم عليها النهي، وهو المقصود من الأداة هنا.
- source_word: ὑμῶν ἐστιν
  choice: لكم
  rationale: تعبير عربي موجز ومباشر عن الملك أو الاختصاص، مع إبقاء مدى هذا الاختصاص مفتوحًا كما في الأصل.
theological_decisions:
- issue: مدلول «البشر» في سياق الانقسامات حول خدام الكنيسة
  choice: الإبقاء على اللفظ العام «البشر» في المتن
  alternative: «القادة البشر» أو «الناس»
  rationale: النص اليوناني عام لفظًا، وإن كان السياق يرجّح الإشارة إلى قادة مثل بولس وأبلوس وصفا؛ لذا لا يُحصر المعنى السياقي في المتن، بل يُذكر في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وموقّرة. استُخدمت نون التوكيد في «يفتخرنَّ» لإبراز قوة النهي، وحُفظت عمومية «البشر» مع بيان الاحتمال السياقي في الحاشية.
