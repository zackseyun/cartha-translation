  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: ar
  text: لذلك، لا يفتخرنَّ أحدٌ بالبشر[a]، لأنَّ كلَّ شيءٍ لكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالناس». وقد يكون المقصود في السياق على وجه أخص: «بالقادة البشر».'
