  - marker: b
    text: الكلمة اليونانية تعني الطعام عمومًا، والمقصود في السياق طعام أكثر قوامًا في مقابل الحليب.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: حليبًا
  rationale: المقابل العربي المباشر والواضح للحليب، ويحفظ صورة التغذية المجازية والتباين مع الطعام.
- source_word: ἐπότισα
  choice: سقيتكم
  rationale: الفعل اليوناني يعني حرفيًا إعطاء شيء للشرب؛ و«سقيتكم» تعبير عربي طبيعي يحافظ على صورة النص دون تحويلها إلى شرح تعليمي.
- source_word: βρῶμα
  choice: طعامًا
  rationale: الكلمة اليونانية عامة الدلالة على الطعام، ولذلك لم تُقيَّد في المتن بعبارة «طعامًا صلبًا»، مع بيان المعنى السياقي في الحاشية.
- source_word: οὔπω γὰρ ἐδύνασθε
  choice: لأنكم لم تكونوا قادرين بعد
  rationale: يحفظ النفي الزمني وصيغة الماضي، كما يبقي متعلَّق القدرة محذوفًا كما في اليونانية.
- source_word: ἀλλ’ οὐδὲ ἔτι νῦν δύνασθε
  choice: بل إنكم حتى الآن لا تزالون غير قادرين
  rationale: صياغة عربية طبيعية تنقل الاستدراك والتوكيد على استمرار العجز إلى الزمن الحاضر.
theological_decisions:
- issue: دلالة استعارة الحليب والطعام
  choice: الإبقاء على الاستعارة كما وردت من غير تفسيرها بأنها تعاليم أولية ومتقدمة
  alternative: 'صياغتها تفسيرًا، مثل: «علّمتكم الأمور الأساسية لا التعاليم المتقدمة»'
  rationale: النص اليوناني يعرض صورة غذائية ولا يصرّح بهذا الشرح؛ إبقاء الصورة يصون اتساع دلالتها ويمنع إدخال تفسير مذهبي في المتن.
- issue: متعلَّق فعل القدرة المحذوف
  choice: الإبقاء على عبارة «قادرين» من غير إضافة مفعول أو تفسير
  alternative: «قادرين على تناوله» أو «قادرين على فهمه»
  rationale: اليونانية تحذف ما لم يكونوا قادرين عليه، والسياق يرشحه دون أن يصرح به؛ لذلك يحفظ النص العربي هذا الإيجاز والتوتر الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «حليب» لكونه أوضح في الاستعمال الحديث، و«سقيتكم» لمطابقة فعل الشرب في الأصل. حُفظ التوازي بين العجز السابق واستمراره في الحاضر، مع تجنب توسيع الاستعارة أو تعيين متعلَّق القدرة المحذوف.
