  text: καὶ πάλιν· Κύριος γινώσκει τοὺς διαλογισμοὺς τῶν σοφῶν ὅτι εἰσὶν μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: ar
  text: 'وأيضًا: «الرَّبُّ يَعْلَمُ أفكارَ الحكماء، وأنها باطلة».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «استدلالات الحكماء» أو «خواطرهم» بدلًا من «أفكار الحكماء»، و«عديمة الجدوى» أو «فارغة» بدلًا من «باطلة».'
    reason: lexical_alternative
  - marker: b
    text: اقتباس من المزمور 94:11 بحسب الترقيم العبري (93:11 في السبعينية).
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: وأيضًا
  rationale: تُدخل العبارة اقتباسًا كتابيًا ثانيًا مؤيدًا للحجة، وصياغة «وأيضًا» موجزة وطبيعية في العربية.
- source_word: Κύριος
  choice: الرَّبّ
  rationale: المقابل العربي المألوف والمباشر للفظ κύριος في هذا السياق الكتابي.
- source_word: γινώσκει
  choice: يَعْلَمُ
  rationale: ينقل المعنى المباشر للفعل من دون توسيع تفسيري.
- source_word: διαλογισμοὺς
  choice: أفكار
  rationale: لفظ واضح ومعاصر يشمل النشاط الذهني الداخلي؛ ويمكن أن يدل اللفظ اليوناني أيضًا على الاستدلالات أو الخواطر.
- source_word: τῶν σοφῶν
  choice: الحكماء
  rationale: ينقل الصفة المستعملة اسمًا بصيغة عربية طبيعية، مع إبقاء دلالتها مرتبطة بسياق الحكمة في المقطع.
- source_word: ὅτι
  choice: وأنها
  rationale: تُفهم ὅτι هنا على أنها تقدم مضمون ما يعلمه الرب، لا سبب العلم؛ وإعادة الضمير المؤنث الجمع توافق «أفكار» في العربية.
- source_word: μάταιοι
  choice: باطلة
  rationale: تنقل معنى الخواء وعدم الجدوى بلفظ عربي فصيح ومفهوم، مع إبقاء بدائل دلالية في الحاشية.
theological_decisions:
- issue: طبيعة الحكمة المنسوبة إلى «الحكماء»
  choice: إبقاء «الحكماء» بلا قيد تفسيري
  alternative: حكماء هذا العالم
  rationale: النص اليوناني في هذه الآية يقول «الحكماء» فقط، والسياق يوضح المقصود؛ إضافة «هذا العالم» هنا ستستورد تفسيرًا غير مصرح به في الاقتباس.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حوفظ على بنية الاقتباس وعلى كون ὅτι تقدم مضمون العلم، مع تجنب إضافة قيد عقائدي أو تفسيري إلى «الحكماء».
