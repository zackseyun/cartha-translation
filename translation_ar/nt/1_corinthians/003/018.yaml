  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: ar
  text: لا يَخْدَعَنَّ أحدٌ نفسَه. إن كان أحدٌ منكم يظنّ أنه حكيمٌ في هذا الدهر[a]، فليَصِرْ أحمقًا[b] لكي يصير حكيمًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يظنّ أنه حكيم بحسب مقاييس هذا الدهر».'
    reason: يوضح إمكان فهم العبارة بوصفها تقييدًا لمعيار الحكمة، مع الحفاظ على كون «يظنّ» حكمًا ذاتيًا كما في δοκεῖ.
  - marker: b
    text: 'أو: «غبيًّا».'
    reason: بديل معجمي لـ«أحمقًا» في نقل μωρός؛ وتحافظ الصياغة الرئيسة على الصفة الخبرية والمفارقة المقصودة.
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: لا يَخْدَعَنَّ أحدٌ نفسَه
  rationale: يحافظ على النهي العام وعلى المفعول الانعكاسي الصريح، بصياغة عربية فصيحة قوية وطبيعية.
- source_word: δοκεῖ σοφὸς εἶναι
  choice: يظنّ أنه حكيم
  rationale: ينقل معنى التقييم الذاتي في السياق بوضوح، بدل معنى الظهور للآخرين.
- source_word: ἐν ὑμῖν
  choice: منكم
  rationale: صياغة عربية موجزة وطبيعية تدل على فرد داخل جماعة المخاطَبين.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: في هذا الدهر
  rationale: تحفظ البعد الزمني والحضاري لكلمة αἰών، وتلائم مقابلة بولس بين حكمة الدهر الحاضر وحكمة الله.
- source_word: μωρὸς γενέσθω
  choice: فليَصِرْ جاهلًا
  rationale: يحفظ صيغة الأمر والمفارقة المقصودة، مع إبقاء الصفة خبرًا لا تحويلها حتمًا إلى هوية ثابتة.
- source_word: ἵνα γένηται σοφός
  choice: لكي يصير حكيمًا
  rationale: يحافظ على جملة الغاية وعلى التكرار المقصود للفعل γίνομαι في طرفي المفارقة.
theological_decisions:
- issue: دلالة αἰών في مقابلة الحكمة
  choice: هذا الدهر
  alternative: 'هذا العالم؛ أو: حكيمًا بحسب مقاييس هذا الدهر'
  rationale: «الدهر» يحفظ الدلالة الزمنية لعصر حاضر ذي مقاييس مخصوصة، من غير اختزال اللفظ في المكان أو حسم ضمني تفسيري.
- issue: طبيعة وصف μωρός
  choice: جاهلًا
  alternative: 'أحمق؛ أو: كالأحمق'
  rationale: اختيرت صفة خبرية تحفظ المفارقة ولا تجعلها لقب هوية ثابتًا. ولم تُضف أداة التشبيه لأن الأصل يقول إن عليه أن يصير μωρός، لا مجرد أن يبدو كذلك.
- issue: المرجع المفرد ذي الصيغة المذكرة
  choice: أحدٌ... نفسه... أنه
  alternative: إعادة صياغة جمعيّة محايدة
  rationale: تحافظ الصياغة على المفرد التمثيلي في اليونانية، وهي في العربية صيغة عامة تشمل كل فرد من المخاطَبين.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كتابية وقورة. استُخدمت نون التوكيد في «لا يخدعنّ» لتأدية قوة النهي، وحُفظ التوازي بين «فليصر» و«لكي يصير». تظهر علامتا الحاشيتين [a] و[b] في موضعيهما في المتن.
