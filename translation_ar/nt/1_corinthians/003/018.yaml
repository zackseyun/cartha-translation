  to: لا يَخْدَعَنَّ أحدٌ نفسَه. إن كان أحدٌ منكم يظنّ أنه حكيمٌ في هذا الدهر[a]، فليَصِرْ أحمقًا[b] لكي يصير حكيمًا.
