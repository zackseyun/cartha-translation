  source_fidelity: 'المعنى العام محفوظ: النهي عن خداع الذات، والتقييم الذاتي للحكمة ضمن هذا الدهر، ثم مفارقة صيرورة المرء حكيمًا عبر صيرورته μωρός. لكن «جاهلًا» يدل أساسًا على فاقد المعرفة، بينما μωρός هنا يدل على الأحمق/الغبي أو من يُعَدّ كذلك؛ لذلك لا ينقل المفارقة البولسية بدقة كافية.'
