lexical_decisions:
- source_word: εἴ
  choice: إن
  rationale: تدخل على شرط بسيط، و«إن» هي المقابل العربي الطبيعي الموجز.
- source_word: τινος
  choice: أحدٍ
  rationale: الضمير غير المحدد في صيغة المضاف إليه يفيد أن العمل يعود إلى أي شخص؛ وتؤدي «عمل أحد» هذا المعنى بوضوح.
- source_word: τὸ ἔργον
  choice: عملُ
  rationale: «العمل» لفظ واسع يلائم استعارة البناء في السياق من غير حصره في فعل أخلاقي أو نشاط خدمي بعينه.
- source_word: μενεῖ
  choice: بقي
  rationale: يحافظ على المعنى الأساسي، أي الاستمرار وعدم الزوال؛ وجاء ماضيًا بعد «إن» وفق الأسلوب العربي مع دلالة الشرط على المستقبل.
- source_word: ὃ ἐποικοδόμησεν
  choice: الذي بناه على الأساس
  rationale: الفعل المركب يدل على البناء فوق شيء سابق، وهو الأساس المذكور في السياق. أُظهر «الأساس» بالعربية لإتمام التعدية الطبيعية وتوضيح صورة البناء، دون تحديد ماهية الأساس من جديد.
- source_word: μισθὸν
  choice: مكافأةً
  rationale: تلائم سياق التقويم الإلهي، مع إبقاء معنى المقابل أو الجزاء؛ وتُذكر البدائل الاقتصادية الأقرب حرفيًا في الحاشية.
- source_word: λήμψεται
  choice: فسينال
  rationale: صيغة مستقبلية طبيعية وفصيحة تؤدي معنى التلقي، وربطت بالفاء بوصفها جواب الشرط.
theological_decisions:
- issue: هل μισθός مكافأة أم أجرة؟
  choice: مكافأة
  alternative: أجرة أو مقابل
  rationale: السياق يتحدث عن نتيجة فحص العمل، لذلك «مكافأة» طبيعية ولا تفرض أن المقصود استحقاق تعاقدي؛ وتُحفظ البدائل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. حافظت الصياغة على المفرد المذكر العام في «أحد» وعلى استعارة البناء، وأُثبتت علامتا الحاشيتين في المتن بالترتيب [a][b].
