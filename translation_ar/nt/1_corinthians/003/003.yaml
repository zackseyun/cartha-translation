source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: ar
  text: لأنكم لا تزالون جسديين. فحيث توجد بينكم غيرة وخصام، أفلستم جسديين وتسلكون بحسب البشر[a]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وتسلكون على طريقة بشرية محضة؟»'
    reason: بديل معجمي تفسيري لعبارة κατὰ ἄνθρωπον.
lexical_decisions:
- source_word: ἔτι
  choice: لا تزالون
  rationale: تنقل استمرار حالتهم إلى وقت الخطاب، وتحافظ على نبرة التوبيخ.
- source_word: γὰρ
  choice: لأنَّ / فـ
  rationale: تُظهر القوة التعليلية في الموضعين؛ صُرِّح بها أولًا، وجاءت الفاء في الجملة الثانية على نحو عربي طبيعي يواصل التعليل.
- source_word: σαρκικοί
  choice: جسديين
  rationale: تحافظ على الصلة اللفظية واللاهوتية بـ«الجسد» ولا تستبدلها بتفسير مثل «دنيويين» أو «خاضعين للطبيعة الخاطئة».
- source_word: ὅπου
  choice: ما دامت
  rationale: يؤدي في العربية معنى وجود الغيرة والخصام بينهم بوصفه دليلًا على استمرار حالتهم، مع صياغة طبيعية غير حرفية.
- source_word: ζῆλος
  choice: غيرة
  rationale: السياق السلبي إلى جانب الخصام يرجّح الغيرة المذمومة لا الحماسة المحمودة.
- source_word: ἔρις
  choice: خصام
  rationale: لفظ موجز وطبيعي يدل على النزاع والشقاق من غير حصره في المشاجرة الكلامية وحدها.
- source_word: οὐχὶ
  choice: أفلستم
  rationale: يحافظ على السؤال الإنكاري الذي ينتظر جوابًا بالإيجاب.
- source_word: κατὰ ἄνθρωπον
  choice: بحسب البشر
  rationale: يحافظ قدر الإمكان على صورة العبارة اليونانية وعلى المقابلة بين السلوك البشري المحض والسلوك الذي يشكّله الروح، من غير توسيع تفسيري في المتن.
- source_word: περιπατεῖτε
  choice: تسلكون
  rationale: يحفظ استعارة المشي الأخلاقية الشائعة عند بولس، وهي مفهومة وفصيحة في العربية الكتابية المعاصرة.
theological_decisions:
- issue: ترجمة اللفظ المرتبط بـσάρξ في σαρκικοί
  choice: جسديين
  alternative: دنيويين؛ غير روحيين؛ خاضعين للطبيعة الخاطئة
  rationale: النص يوبّخ المؤمنين على سلوك يتسم بالجسد، لكن اللفظ نفسه لا يصرّح بكل ما تتضمنه البدائل التفسيرية؛ لذلك حُفظت لغة «الجسد» والتوتر اللاهوتي فيها.
- issue: ترجمة κατὰ ἄνθρωπον
  choice: بحسب البشر
  alternative: على طريقة بشرية محضة
  rationale: المتن يحافظ على قربه من تركيب الأصل من غير أن يحسم مدى الشحنة الأخلاقية في العبارة، وتورد الحاشية البديل الأوضح تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «تسلكون» لحفظ الصورة البولسية، و«جسديين» لصون مفردات الجسد، مع وضع علامة الحاشية بعد العبارة التي تشرحها مباشرة.
