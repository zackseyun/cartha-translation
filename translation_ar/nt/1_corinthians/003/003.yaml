revisions:
- from: لأنكم لا تزالون جسديين. فما دامت بينكم غيرة وخصام، أفلستم جسديين وتسلكون بحسب البشر؟[a]
  to: لأنكم لا تزالون جسديين. فحيث توجد بينكم غيرة وخصام، أفلستم جسديين وتسلكون بحسب البشر[a]؟
  rationale: يستبدل التعديل التعبير الزمني «ما دامت» بـ«حيث توجد» لمطابقة دلالة ὅπου، مع إبقاء لغة «الجسد» واستعارة «السلوك» والعمومية المقصودة في «البشر». كما نُقلت علامة الحاشية لتلتحق بالعبارة التي تخصها.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:18Z'
review_pass:
  verdict: revise
  source_fidelity: تحتاج «فما دامت» إلى تعديل؛ إذ إن ὅπου تعني حرفيًا «حيث/حيثما»، وتشير إلى وجود الغيرة والخصام بينهم، لا إلى امتداد زمني مشروط («ما دامت»). أما «جسديين» و«تسلكون بحسب البشر» فيحافظان جيدًا على ألفاظ الأصل وصورته البلاغية.
  naturalness: الصياغة فصيحة وواضحة عمومًا. و«فحيث توجد بينكم غيرة وخصام» طبيعية في العربية المعاصرة وتحافظ على علاقة الاستدلال في السياق.
  terminology: «جسديين» اختيار مناسب لـσαρκικοί، إذ يصون صلته بـ«الجسد» من دون تحميله تفسيرًا مذهبيًا. و«تسلكون بحسب البشر» قريب من κατὰ ἄνθρωπον، مع فائدة الحاشية في بيان البديل التفسيري.
  issues:
  - severity: medium
    issue: ترجمة ὅπου بـ«ما دامت»
    rationale: «ما دامت» تفيد استمرارًا زمنيًا أو شرطًا زمنيًا، في حين أن ὅπου هنا أداة مكان/موضع («حيث»)، تُقدِّم وجود الغيرة والخصام بينهم دليلًا على كونهم جسديين. لذلك يلزم استعمال «حيث توجد» أو ما يقاربه.
  - severity: low
    issue: موضع علامة الحاشية
    rationale: ينبغي أن تتصل العلامة مباشرة بعبارة «بحسب البشر» التي تشرحها الحاشية، لا أن تأتي بعد علامة الاستفهام.
