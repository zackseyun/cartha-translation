  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: ar
  text: وأنا أيضًا، أيها الإخوة[a]، لم أستطع أن أكلّمكم كروحيين، بل كجسديين، كأطفال في المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ واللفظ اليوناني مذكّر وصيغته الحرفية «الإخوة».
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا نقل اللقب بمعناه «المسيّا»؛ أما «المسيح» فهو المقابل العربي المألوف للكلمة اليونانية.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: وأنا أيضًا
  rationale: يحفظ قوة العطف في καί مع إبراز ضمير المتكلم من غير مبالغة في التشديد.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: ينقل صيغة النداء المذكرة في اليونانية نقلًا مباشرًا، مع بيان احتمال شمولها الإخوة والأخوات في الحاشية.
- source_word: οὐκ ἠδυνήθην
  choice: لم أستطع
  rationale: تعبير عربي طبيعي يحفظ معنى عدم القدرة في الفعل اليوناني.
- source_word: λαλῆσαι ὑμῖν
  choice: أن أكلّمكم
  rationale: صياغة عربية واضحة ومباشرة للمصدر مع المفعول غير المباشر.
- source_word: πνευματικοῖς
  choice: كروحيين
  rationale: الصفة مستعملة استعمال الاسم، والجمع العربي يعبّر طبيعيًا عن أشخاص يتصفون بالروحانية دون زيادة تفسيرية.
- source_word: σαρκίνοις
  choice: كجسديين
  rationale: يحفظ الصلة اللفظية بـ«الجسد» والتقابل مع «روحيين»، من غير تحويله إلى تعبير تفسيري مثل «دنيويين» أو «خطاة».
- source_word: νηπίοις
  choice: كأطفال
  rationale: ينقل استعارة صغر السن وعدم النضج بلغة عربية واضحة ولائقة؛ والسياق يبيّن أن المقصود أطفال صغار لا مجرد أبناء.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: «المسيح» هو المقابل العربي الراسخ للقب Χριστός، ويحفظ هنا الصيغة البولسية «في المسيح» دون حسم ما إذا كان اللقب قد اكتسب قوة اسمية.
theological_decisions:
- issue: دلالة Χριστῷ بوصفه لقبًا أو اسمًا
  choice: في المسيح
  alternative: في المسيّا
  rationale: اللفظ العربي «المسيح» هو اللقب الكتابي الطبيعي ويقابل معنى «الممسوح»، كما أنه يلائم الاستعمال البولسي الاصطلاحي «في المسيح» ويحفظ قدرًا من التوتر بين اللقب والاستعمال الاسمي.
- issue: التقابل بين πνευματικοῖς وσαρκίνοις
  choice: كروحيين، بل كجسديين
  alternative: كأناس روحيين، بل كأناس من لحم
  rationale: يحفظ التقابل المعجمي من غير أن يساوي «جسديين» تلقائيًا بـ«دنيويين» أو يضيف حكمًا عقائديًا غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدم «أكلّمكم» بدل صياغة أثقل، وحُفظ التوازي بين «كروحيين» و«كجسديين» ثم التشبيه «كأطفال». وُضعت علامتا الحاشيتين في موضعيهما الدلاليين داخل النص.
