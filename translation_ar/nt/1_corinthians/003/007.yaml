  text: ὥστε οὔτε ὁ φυτεύων ἐστίν τι οὔτε ὁ ποτίζων, ἀλλ’ ὁ αὐξάνων θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: ar
  text: فإذًا ليس الغارسُ شيئًا، ولا الساقي، بل اللهُ الذي يُنمّي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بل الله الذي يمنح النمو»؛ وتقليديًا: «الذي يعطي الزيادة».'
    reason: بدائل معجمية للفعل ὁ αὐξάνων، مع الحفاظ على أن الله هو مصدر النمو.
lexical_decisions:
- source_word: ὥστε
  choice: فإذًا
  rationale: تفيد النتيجة المستخلصة مما سبق، وتحافظ على قوة الاستدلال بصياغة عربية واضحة.
- source_word: ὁ φυτεύων
  choice: الغارس
  rationale: اسم فاعل طبيعي في العربية يحفظ صورة الغرس وبنية المقابلة في الآية.
- source_word: ἐστίν τι
  choice: ليس ... شيئًا
  rationale: ينقل التعبير اليوناني بصورة مباشرة، من غير تحويله تفسيريًا إلى معنى مثل «لا يُعتدّ به».
- source_word: ὁ ποτίζων
  choice: الساقي
  rationale: اسم فاعل موجز يوازي «الغارس» ويحفظ الصورة الزراعية والتوازن البلاغي.
- source_word: ἀλλ’
  choice: بل
  rationale: تُظهر الاستدراك والمقابلة الحادة بين دور العاملين البشريين وعمل الله.
- source_word: ὁ αὐξάνων
  choice: الذي يُنمّي
  rationale: يحفظ الصيغة الفعلية ويدل على أن الله هو الذي يُحدث النمو، من غير إضافة مفعول غير مصرّح به في النص.
- source_word: θεός
  choice: الله
  rationale: المقابل العربي المباشر، مع إبقاء الاسم في موضع بارز بعد أداة الاستدراك.
theological_decisions:
- issue: نفي الأهمية عن الغارس والساقي في مقابل عمل الله
  choice: ليس الغارس شيئًا، ولا الساقي
  alternative: لا يُعتدّ بالغارس ولا بالساقي
  rationale: الصياغة المختارة تحافظ على حدة التعبير اليوناني وتوتره البلاغي، ولا تلطفه بتفسير يقتصر على المكانة أو الاعتداد.
translation_notes:
  register: عربية فصحى حديثة، موجزة وكريمة النبرة. استُخدم اسما الفاعل «الغارس» و«الساقي» للموازاة، وأُبقي الحذف في الشطر الثاني كما في الأصل مع وضوح المعنى بالعربية.
