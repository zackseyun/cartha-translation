id: 1CO.3.10
reference: 1 Corinthians 3:10
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: ar
  text: بحسب نعمة الله التي وُهِبت لي، وضعتُ أساسًا كبنّاءٍ رئيسيّ حكيم[a]، وآخر يبني عليه. ولكن لينتبه كل واحد[b] كيف يبني[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كمهندسٍ معماريّ حكيم». يدل اللفظ اليوناني على بنّاء رئيسي يشرف على عملية البناء.'
    reason: lexical_alternative
  - marker: b
    text: 'صيغة المفرد المذكر في اليونانية مستعملة هنا استعمالًا تمثيليًا عامًا: «كل واحد ... كيف يبني».'
    reason: cultural_note
  - marker: c
    text: 'أي: «كيف يبني عليه»، أي على الأساس.'
    reason: previous_rendering
lexical_decisions:
- source_word: Κατὰ
  choice: بحسب
  rationale: تفيد الموافقة والاتساق مع النعمة الموهوبة لبولس، لا مجرد الوسيلة.
- source_word: χάριν
  choice: نعمة
  rationale: تحفظ الدلالة البولسية على عطاء الله وتفضله وتمكينه.
- source_word: τὴν δοθεῖσάν μοι
  choice: التي وُهِبت لي
  rationale: تبيّن أن النعمة عطاء من الله، وصيغة «وُهِبت» فصيحة وطبيعية في السياق.
- source_word: ὡς σοφὸς ἀρχιτέκτων
  choice: كبَنّاءٍ رئيسيّ حكيم
  rationale: تنقل التشبيه، وتحفظ معنى الحكمة ودور المسؤول عن البناء والإشراف عليه، من غير قصر اللفظ على مفهوم المعماري الحديث.
- source_word: θεμέλιον ἔθηκα
  choice: وضعتُ أساسًا
  rationale: تعبير عربي طبيعي يحافظ على تنكير «أساس» في اليونانية وعلى صورة البناء.
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: وآخر يبني عليه
  rationale: الفعل المركب يدل على البناء فوق أساس موضوع سابقًا؛ والضمير يوضح المتعلَّق المفهوم من السياق.
- source_word: ἕκαστος δὲ βλεπέτω
  choice: ولكن لينتبه كل واحد
  rationale: «لينتبه» تؤدي قوة الأمر الداعي إلى اليقظة والحذر، و«كل واحد» تحفظ المعنى التوزيعي للمفرد.
- source_word: πῶς ἐποικοδομεῖ
  choice: كيف يبني
  rationale: تكرار «يبني» يحفظ الصلة بالفعل السابق، مع ترك متعلَّقه مفهومًا من الأساس المذكور.
theological_decisions:
- issue: دلالة صيغة المفرد المذكر في ἕκαστος والفعل التابع لها
  choice: كل واحد ... كيف يبني
  alternative: كل شخص ... كيف يبني؛ أو كل رجل ... كيف يبني
  rationale: المذكر المفرد هنا تمثيلي عام، لا يقتصر على الرجال. والصياغة العربية المختارة تحفظ العدد والصيغة النحوية من غير تضييق نطاق الخطاب.
- issue: طبيعة النعمة المعطاة لبولس
  choice: الإبقاء على «نعمة» بلا تفسير إضافي داخل المتن
  alternative: عطية أو تمكين إلهي
  rationale: اللفظ اليوناني يحتمل التفضل الإلهي والتمكين الممنوح للخدمة؛ لذلك لا ينبغي حصره في وجه واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت صورة البناء بألفاظ مألوفة، مع الحفاظ على إيجاز النص اليوناني وتكراره البلاغي، وإيضاح البدائل الحقيقية في الحواشي.
