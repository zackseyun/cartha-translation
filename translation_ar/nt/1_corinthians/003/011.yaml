  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: ar
  text: لأنه لا يستطيع أحد أن يضع أساسًا آخر غير الأساس الموضوع، وهو يسوع المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεμέλιον
  choice: أساسًا
  rationale: ينقل صورة البناء المباشرة في السياق، وهو المقابل العربي الطبيعي للاسم اليوناني.
- source_word: γὰρ
  choice: لأنه
  rationale: تربط الجملة بما قبلها بوصفها تعليلًا أو تفسيرًا، مع تعبير عربي واضح.
- source_word: ἄλλον
  choice: آخر
  rationale: يحفظ معنى أساس إضافي أو مختلف.
- source_word: οὐδεὶς δύναται
  choice: لا يستطيع أحد
  rationale: ينقل النفي الشامل ومعنى القدرة بصياغة عربية طبيعية.
- source_word: θεῖναι
  choice: أن يضع
  rationale: فعل مناسب لوضع الأساس في صورة البناء، ويحافظ على بساطة الأصل.
- source_word: παρὰ τὸν κείμενον
  choice: غير الأساس الموضوع
  rationale: تنقل παρά معنى الاستثناء، ويحفظ اسم المفعول حالة الأساس القائم الموضوع دون إضافة «بالفعل» التي ليست لازمة في العربية.
- source_word: ὅς ἐστιν
  choice: وهو
  rationale: تربط الأساس بهوية يسوع ربطًا مباشرًا وطبيعيًا في العربية.
- source_word: Ἰησοῦς Χριστός
  choice: يسوع المسيح
  rationale: «يسوع» نقل للاسم، و«المسيح» الترجمة العربية الراسخة للقب Χριστός وتحفظ دلالته اللقبية.
theological_decisions:
- issue: دلالة Χριστός في Ἰησοῦς Χριστός
  choice: يسوع المسيح
  alternative: يسوع الممسوح
  rationale: «المسيح» لقب عربي مفهوم وراسخ، ينقل الدلالة المسيانية دون التعامل مع Χριστός كلقب عائلي أو استيراد تفسير مذهبي خاص.
- issue: تعيين الأساس بيسوع
  choice: وهو يسوع المسيح
  alternative: الذي هو يسوع المسيح
  rationale: تحفظ الصياغة التعريف الصريح في اليونانية، مع تجنب الإيحاء بأن المقصود مجرد تشبيه فضفاض.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظت استعارة البناء والتعليل والنفي المطلق، ولم تُضف حاشية لأن «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، بخلاف الحاجة الإنجليزية إلى بيان بديل بين Messiah وChrist.
