  source_fidelity: 'المعنى العام محفوظ بدقة: عمل كل واحد سيظهر، واليوم سيُظهره، واليوم يُعلَن في النار، والنار نفسها تمتحن العمل. لكن الضمير في «إذ إنّه يُعلَن» يمكن أن يُفهم عربيًا على أنه عائد إلى «عمل» لا إلى «اليوم»، مع أن الفاعل في اليونانية في ἀποκαλύπτεται هو «اليوم».'
  naturalness: 'الأسلوب فصيح في معظمه. تكرار «اليوم» في الجملة الثالثة يزيل اللبس المرجعي من دون إضافة تفسيرية، ويجعل تسلسل الجملة أوضح للقارئ المعاصر. كما أن «لتبيّن ما نوعه» أيسر عربيًا من «ستمتحن نوع عمل كل واحد» مع حفظ المقصود: اختبار طبيعة/نوعية العمل.'
  terminology: «عمل»، و«اليوم»، و«النار نفسها»، و«ستمتحن» اختيارات مناسبة وتحافظ على المصطلحات والتوكيد في الأصل. تُبقي الحاشية بديل «بالنار» المشروع للتركيب ἐν πυρί، ولا تفرض تفسيرًا مذهبيًا لعبارة «اليوم».
