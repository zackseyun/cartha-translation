  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: ar
  text: سيتبيّن عملُ كلِّ واحد، لأن اليومَ[b] سيكشفه، إذ إن اليوم يُعلَن في النار[a]، والنار نفسها ستمتحن عملَ كل واحد لتبيّن ما نوعه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالنار». يمكن أن تعني العبارة اليونانية «في النار» أو أن تكون النار أداة الكشف.'
    reason: lexical_alternative
  - marker: b
    text: يرجّح أن «اليوم» يشير إلى اليوم الآتي للتقييم أو الدينونة الإلهية.
    reason: cross_reference
lexical_decisions:
- source_word: ἑκάστου
  choice: كلِّ واحد / كل واحد
  rationale: يحفظ الاستعمال التوزيعي الذي يخصّ كل شخص على حدة، من غير تقييد غير موجود في اليونانية.
- source_word: τὸ ἔργον
  choice: عمل
  rationale: لفظ واسع وطبيعي يشمل ما أنجزه كل بانٍ في السياق، ولا يحصر المعنى في فعل منفرد أو في مجرد الجهد.
- source_word: φανερὸν γενήσεται
  choice: سيتبيّن
  rationale: صياغة عربية طبيعية تنقل صيرورة العمل ظاهرًا في المستقبل، لا مجرد كونه ظاهرًا الآن.
- source_word: ἡ ἡμέρα
  choice: اليوم
  rationale: يحافظ على أداة التعريف وعلى الإشارة السياقية إلى يوم التقييم الإلهي، من غير إضافة وصف تفسيري إلى المتن.
- source_word: δηλώσει
  choice: سيكشفه
  rationale: ينقل معنى الإظهار والإبانة، مع إبقائه متميزًا أسلوبيًا عن ἀποκαλύπτεται في العبارة التالية.
- source_word: ἐν πυρὶ
  choice: في النار
  rationale: ترجمة مباشرة تحفظ إمكان فهم العبارة على أنها ظرفية «في النار» أو أداتية «بالنار»؛ وقد ذُكر البديل في الحاشية.
- source_word: ἀποκαλύπτεται
  choice: يُعلَن
  rationale: يحفظ صيغة المبني للمجهول ودلالة الانكشاف. كما أن الضمير في «إنّه» لا يحسم في العربية أكثر مما يلزم ما يعود إليه ضمن ترابط الجملة.
- source_word: ὁποῖόν ἐστιν
  choice: نوعَ عمل
  rationale: يعبّر بوضوح عن طبيعة العمل أو نوعيته، وهو المقصود من الاختبار في السياق.
- source_word: δοκιμάσει
  choice: ستمتحن
  rationale: ينقل معنى الاختبار بغرض تبيّن حقيقة العمل أو جودته.
- source_word: αὐτὸ
  choice: نفسها
  rationale: 'يحفظ توكيد الضمير اليوناني: النار ذاتها هي التي تمتحن العمل.'
theological_decisions:
- issue: هل ἡ ἡμέρα يوم عادي أم اليوم الأخروي للتقييم أو الدينونة؟
  choice: اليوم، مع حاشية توضيحية
  alternative: يوم الدينونة / ذلك اليوم
  rationale: السياق يرجّح اليوم الآتي للتقييم الإلهي، لكن الاكتفاء بلفظ «اليوم» في المتن يحافظ على صياغة المصدر ولا يضيف تسمية تفسيرية صريحة.
- issue: 'دلالة ἐν πυρὶ: ظرفية أم أداتية؟'
  choice: في النار
  alternative: بالنار
  rationale: التركيب اليوناني يحتمل المعنيين؛ لذلك اختيرت الصياغة الأقرب إلى البنية الأصلية مع إثبات البديل في الحاشية بدل حسم الاحتمال.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. روعي تكرار «عمل كل واحد» كما في اليونانية، وحُفظ توكيد «النار نفسها»، ووُضعت علامتا الحاشية عند اللفظين اللذين تتناولهما الحاشيتان فعلًا.
