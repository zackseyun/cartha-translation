  rationale: اقتصر التعديل على إزالة اللبس في مرجع الضمير الذي يعود إلى «اليوم» في الأصل، وعلى تسهيل صياغة اختبار نوع العمل. وحُفظت الحاشيتان وموضعا علامتيهما، كما حُفظ احتمال «في النار/بالنار» من دون حسمه في المتن.
