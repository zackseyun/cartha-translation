base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: ar
  text: فما أَبُلُّوس إذن؟ وما بولس؟[a] خادمان[b] آمنتم على أيديهما، كما أعطى الرب لكل واحد.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فمَن أبلوس إذن؟ ومَن بولس؟» غير أن اليونانية تستعمل «ما»، مركّزةً على دورهما لا على هويتهما.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «عاملان في الخدمة». لا يدل اللفظ اليوناني هنا بالضرورة على رتبة الشمّاس الكنسية.'
    reason: lexical_alternative
  - marker: c
    text: 'العبارة اليونانية موجزة، ومفعول «أعطى» غير مذكور. ويمكن تفسيرها: «بحسب ما عيّن الرب لكل واحد».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: ما
  rationale: اسم الاستفهام اليوناني محايد، ويركّز هنا على دور أبلوس وبولس ومكانتهما لا على هويتهما؛ لذلك حُفظ الاستفهام بـ«ما» بدل «مَن».
- source_word: οὖν
  choice: إذن
  rationale: تنقل «إذن» القوة الاستنتاجية والانتقالية للأداة اليونانية بصياغة عربية طبيعية.
- source_word: δέ
  choice: و
  rationale: تفيد الأداة هنا استمرار المقابلة الخفيفة بين أبلوس وبولس، والواو أنسب رابط عربي موجز.
- source_word: διάκονοι
  choice: خادمان
  rationale: يدل اللفظ هنا على شخصين يقومان بالخدمة بوصفهما وسيلتين أو عاملين، لا بالضرورة على رتبة «شمّاس» الكنسية.
- source_word: δι’ ὧν
  choice: على أيديهما
  rationale: تعبير عربي طبيعي يحفظ معنى الوساطة أو الوسيلة الذي تؤديه διά مع المضاف إليه، من غير جعلهما مصدر الإيمان.
- source_word: ἐπιστεύσατε
  choice: آمنتم
  rationale: تنقل الفعل الماضي مباشرة من غير إضافة تفسير مثل «أتيتم إلى الإيمان» أو تحديد مضمون الإيمان في النص.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: وكلُّ واحد كما أعطى الرب
  rationale: تحافظ الصياغة على إيجاز العبارة اليونانية وحذف مفعول «أعطى»، فلا تضيف «مهمة» أو «دورًا» أو «موهبة» إلى المتن.
- source_word: κύριος
  choice: الرب
  rationale: المقابل العربي المألوف للقب κύριος، مع إبقاء مرجعه غير مصرّح به زيادةً على الأصل.
theological_decisions:
- issue: مرجع «الرب» (κύριος)
  choice: إبقاء اللقب «الرب» في المتن من غير تسمية المرجع صراحةً
  alternative: تفسيره صراحةً بأنه الرب يسوع، أو بأنه الله على وجه عام
  rationale: يرجّح السياق البولسي الإشارة إلى الرب يسوع بوصفه موزّع الخدمة، لكن الأصل نفسه يكتفي باللقب؛ لذلك لا يُحسم المرجع بإضافة تفسيرية في المتن.
- issue: الحذف في عبارة «كما أعطى الرب»
  choice: حفظ حذف مفعول الفعل في المتن
  alternative: «كما عيّن الرب لكل واحد» أو «كما أعطى الرب كل واحد دورًا»
  rationale: لا يذكر اليوناني صراحةً ما الذي أعطاه الرب؛ وإضافة «دور» أو «مهمة» تحسم ما تركه النص مفتوحًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل المثنى لأن أبلوس وبولس هما المقصودان بـ«خادمان» و«على أيديهما»، وحُفظ الاستفهام بـ«ما» والتعبير الختامي الموجز لإبراز تركيز الأصل على الدور وحفظ الحذف فيه.
