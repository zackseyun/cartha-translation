  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: ar
  text: سواء أكان بولس أم أبلّوس أم صفا، أم العالم أم الحياة أم الموت، أم الأمور الحاضرة أم الآتية، فكلها لكم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: سواء ... أم
  rationale: تحافظ هذه الصياغة على تكرار البدائل في السلسلة الخطابية، مع حذف «سواء» بعد العنصر الأول على نحو عربي طبيعي والإبقاء على «أم» بين العناصر.
- source_word: Παῦλος
  choice: أبولس
  rationale: الصيغة العربية الكتابية الشائعة للاسم اليوناني Παῦλος.
- source_word: Ἀπολλῶς
  choice: أبلّوس
  rationale: نقل صوتي واضح للاسم اليوناني، مع التشديد للدلالة على اللام المشددة.
- source_word: Κηφᾶς
  choice: صفا
  rationale: يحافظ على الاسم السامي الذي يستعمله النص بدل استبداله بالاسم المكافئ «بطرس».
- source_word: κόσμος
  choice: العالم
  rationale: مقابل عربي طبيعي واسع الدلالة يلائم العالم أو نظامه في سياق الحجة.
- source_word: ζωή
  choice: الحياة
  rationale: مقابل مباشر وطبيعي في هذه القائمة.
- source_word: θάνατος
  choice: الموت
  rationale: مقابل معجمي مباشر يحفظ التضاد مع الحياة.
- source_word: ἐνεστῶτα
  choice: الحاضر
  rationale: اسم جمع محايد في اليونانية يشير إلى الوقائع الحاضرة؛ والمفرد الجنسي العربي «الحاضر» موجز وطبيعي ويقابل «الآتي».
- source_word: μέλλοντα
  choice: الآتي
  rationale: ينقل معنى ما هو آتٍ أو مستقبلي، ويحافظ على المقابلة البلاغية مع «الحاضر».
- source_word: πάντα
  choice: كلّها
  rationale: الضمير المؤنث المفرد يعود على عناصر القائمة بوصفها مجموعة، ويبرز شمول الحكم من غير حصره في الأشياء لأن القائمة تضم أشخاصًا أيضًا.
- source_word: ὑμῶν
  choice: لكم
  rationale: ينقل دلالة الملك أو الاختصاص في تركيب عربي موجز، مع إبقاء المخاطَب جمعًا.
theological_decisions:
- issue: دلالة كون الأشخاص والوقائع «لكم»
  choice: الإبقاء على العبارة الموجزة «فكلّها لكم»
  alternative: «فكلّها في خدمتكم» أو «فكلّها ملككم»
  rationale: الأصل يعبّر بالملكية أو الاختصاص من غير أن يحدد بدقة طبيعة هذه العلاقة؛ لذلك لا تُحسم الدلالة إلى خدمة أو ملكية حرفية.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموقرة. حُفظ الإيقاع التعدادي للنص اليوناني والذروة الختامية، مع شرطة فاصلة قبل الخلاصة.
