    issue: ترجمة Παῦλος بـ«أبولس»
    rationale: Παῦλος هو «بولس»، لا «أبولس». أما Ἀπολλῶς فهو «أبلّوس». الصياغة الحالية تكرر الاسم الثاني فعليًا وتُسقط اسم بولس.
  - severity: low
    issue: «الحاضر» و«الآتي» قد يوحيان بمفردين مجردين
    rationale: الأصل يستعمل صيغتين محايدتين جمعيتين بوصفهما اسمين للأمور الحاضرة والآتية؛ وإضافة «الأمور» توضح المرجع الجمعي وتحافظ على المقابلة.
  revised_text: سواء أكان بولس أم أبلّوس أم صفا، أم العالم أم الحياة أم الموت، أم الأمور الحاضرة أم الآتية، فكلها لكم.
