revisions:
- from: سواء أبولس أم أبلّوس أم صفا، أم العالم أم الحياة أم الموت، أم الحاضر أم الآتي—فكلّها لكم.
  to: سواء أكان بولس أم أبلّوس أم صفا، أم العالم أم الحياة أم الموت، أم الأمور الحاضرة أم الآتية، فكلها لكم.
  rationale: التصحيح اللازم هو استبدال «أبولس» بـ«بولس» لأمانة الاسم اليوناني Παῦλος. كما عُدلت «الحاضر» و«الآتي» إلى «الأمور الحاضرة» و«الآتية» لتجسيد الاستعمال الاسمي الجمعي في الأصل بعبارة عربية واضحة، دون تفسير لمدى كون هذه الأمور «لكم».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:27Z'
review_pass:
  verdict: revise
  source_fidelity: المسودة تحافظ عمومًا على تعداد εἴτε المتكرر، وعلى اسم «صفا» بدل «بطرس»، وعلى الخلاصة الجامعة «فكلها لكم». لكن الاسم الأول Παῦλος تُرجم خطأً «أبولس»، وهو خلط بين بولس وأبلّوس؛ وهذا يخل بأمانة النص على نحو جوهري.
  naturalness: التركيب التعدادي عربي مفهوم، لكن تصحيح الاسم الأول، وإظهار دلالة الصيغتين الاسميتين ἐνεστῶτα وμέλλοντα بعبارة «الأمور الحاضرة ... الآتية» يجعلان العبارة أوضح في الفصحى الحديثة من المفردين «الحاضر» و«الآتي» دون زيادة تفسيرية.
  terminology: «بولس»، «أبلّوس»، و«صفا» نقلٌ مناسب للأسماء الواردة في اليونانية. و«العالم، الحياة، الموت» مقابلات سليمة. تُحفظ دلالة الاختصاص غير المفسَّرة في «فكلها لكم».
  issues:
