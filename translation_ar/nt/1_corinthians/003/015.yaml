  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: ar
  text: إن احترق عملُ أحدٍ، فسيتكبّد خسارة، لكنه هو نفسه سيخلُص، ولكن كمن يمرّ عبر نار.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكنه لا يخلُص إلا كما يمرّ عبر نار»، أو: «ولكن كمن ينجو عبر النار».'
    reason: بدائل ممكنة لفهم العبارة اليونانية الموجزة οὕτως δὲ ὡς διὰ πυρός، ولا سيما دلالة النجاة بصعوبة.
lexical_decisions:
- source_word: εἴ τινος
  choice: إن... أحدٍ
  rationale: تنقل أداة الشرط والضمير غير المحدد بعبارة عربية طبيعية، من غير إضافة توكيد غير موجود في اليونانية.
- source_word: τὸ ἔργον
  choice: عملُ
  rationale: تحافظ على اللفظ العام وعلى صلته بصورة البناء في السياق السابق، من غير حصره في فعل بعينه.
- source_word: κατακαήσεται
  choice: احترق
  rationale: يفيد الاحتراق المؤدي إلى التلف؛ والسياق يجعل تمام الاحتراق مفهومًا من غير إثقال العبارة.
- source_word: ζημιωθήσεται
  choice: فسوف يخسر
  rationale: يعبر عن وقوع الخسارة أو الحرمان من غير تحديد أن المفقود مكافأة، لأن ذلك غير مصرح به في هذه الجملة.
- source_word: αὐτὸς δὲ σωθήσεται
  choice: لكنه هو نفسه سيخلُص
  rationale: يحفظ توكيد αὐτός والتباين بين تلف العمل وخلاص الشخص.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: ولكن كمن يمرّ من خلال نار
  rationale: يحافظ على صورة المرور عبر النار وعلى إيجازها، ولا يحسم هل المقصود مجرد النجاة بصعوبة أم معنى آخر للصورة.
theological_decisions:
- issue: هل تُفسَّر عبارة المرور عبر النار على أنها تطهير عقائدي مخصوص أم نجاة بصعوبة؟
  choice: 'الإبقاء على الصورة: «كمن يمرّ من خلال نار»'
  alternative: «ولكنه لا يخلُص إلا كما ينجو المرء من النار»
  rationale: النص اليوناني يقدم تشبيهًا موجزًا ولا يشرح طبيعة النار أو وظيفتها؛ لذلك تحافظ الصياغة على التوتر والاحتمالين ولا تستورد قراءة مذهبية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت «سيخلُص» بمعنى ينال الخلاص، مع الضبط الجزئي دفعًا لالتباسها بالفعل «يَخلُص» بمعنى ينتهي.
