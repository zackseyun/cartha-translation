  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: ar
  text: وَأَنْتُمْ لِلْمَسِيحِ، وَالْمَسِيحُ لِلَّهِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: أَنْتُمْ
  rationale: ضمير مخاطب للجمع، ونقله صراحةً يحفظ المقابلة والتوكيد الناشئين من وروده في اليونانية.
- source_word: δὲ
  choice: وَ
  rationale: تؤدي الواو هنا معنى الاستمرار مع المقابلة الخفيفة في سلسلة الانتماء، من غير إثقال العبارة بأداة استدراك أقوى مما يقتضيه السياق.
- source_word: Χριστοῦ
  choice: لِلْمَسِيحِ
  rationale: اللام تعبّر بإيجاز وطبيعية عن الإضافة الدالة على الانتماء، و«المسيح» هو المقابل العربي الراسخ للقب Χριστός.
- source_word: Χριστὸς
  choice: الْمَسِيحُ
  rationale: حُفظ اللقب نفسه في الجملة الثانية للمحافظة على التوازي البلاغي في الأصل.
- source_word: θεοῦ
  choice: لِلَّهِ
  rationale: اللام تنقل علاقة الإضافة والانتماء بصياغة عربية موجزة، من غير تفسير طبيعة هذه العلاقة أو حسم دلالتها اللاهوتية.
theological_decisions:
- issue: كيفية نقل إضافتي Χριστοῦ وθεοῦ مع الحفاظ على الإيجاز والتوتر العلاقي في النص.
  choice: وَأَنْتُمْ لِلْمَسِيحِ، وَالْمَسِيحُ لِلَّهِ.
  alternative: وأنتم تنتمون إلى المسيح، والمسيح ينتمي إلى الله.
  rationale: الصياغة باللام أقرب إلى إيجاز الأصل وتوازيه، وتحافظ على معنى الاختصاص أو الانتماء من غير أن تشرح طبيعة علاقة المسيح بالله أو تحسمها.
translation_notes:
  register: فصحى معاصرة واضحة وموجزة، مع الحفاظ على التوازي الشديد في الأصل. لا حاجة إلى حاشية بشأن «المسيح/Christ»، لأن «المسيح» هو المقابل العربي الطبيعي والراسخ للفظ اليوناني.
