base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: ar
  text: أَمَا تَعْلَمُونَ أَنَّكُمْ[b] هَيْكَلُ اللهِ[a]، وَأَنَّ رُوحَ اللهِ يَسْكُنُ فِيكُمْ[c]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَقْدِسُ اللهِ».'
    reason: lexical_alternative
  - marker: b
    text: ضمائر الخطاب والأفعال هنا بصيغة الجمع؛ فبولس يخاطب الجماعة كلها.
    reason: cultural_note
  - marker: c
    text: 'أو: «بَيْنَكُمْ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: أَمَا تَعْلَمُونَ
  rationale: ينقل صيغة السؤال الاستنكاري وقوتها الخطابية بلغة عربية فصيحة وطبيعية.
- source_word: ναὸς θεοῦ
  choice: هَيْكَلُ اللهِ
  rationale: «هيكل» هو التعبير العربي الواضح للمكان المقدس المقصود، ويحفظ صورة الجماعة بوصفها موضع حضور الله؛ أما ναός فيشير إلى المقدس نفسه لا إلى مجمل حرم المعبد.
- source_word: ἐστε
  choice: أَنَّكُمْ ... هَيْكَلُ
  rationale: يحفظ ضمير المخاطبين بصيغة الجمع، كما في اليونانية، من غير إضافة لفظ مثل «معًا» ليس موجودًا صراحة في النص.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: رُوحَ اللهِ
  rationale: إضافة «روح» إلى اسم الجلالة صياغة عربية طبيعية ودقيقة للعلاقة الإضافية في الأصل.
- source_word: οἰκεῖ
  choice: يَسْكُنُ
  rationale: يدل على الإقامة المستمرة، وينسجم مع صورة الهيكل أكثر من تعبير عام مثل «يعيش».
- source_word: ἐν ὑμῖν
  choice: فِيكُمْ
  rationale: هو المقابل المباشر للعبارة اليونانية، مع إبقاء احتمال الدلالة الجماعية «بينكم» ظاهرًا في الحاشية.
theological_decisions:
- issue: هل يتحدث العدد أساسًا عن المؤمنين أفرادًا أم عن الكنيسة جماعة؟
  choice: أُبقيت صيغة الجمع «أنكم» و«فيكم» من غير إضافة تفسيرية، مع توضيح البعد الجماعي في الحاشية.
  alternative: «أنتم معًا هيكل الله» أو صياغة فردية مثل «كل واحد منكم هيكل الله».
  rationale: الأصل يخاطب جماعة كورنثوس بصيغة الجمع، لكن لا يرد فيه لفظ صريح بمعنى «معًا»، كما أنه لا يقول «كل واحد منكم». لذلك تحافظ الصياغة على توتر النص ولا تحسمه بإضافة تفسيرية.
- issue: دلالة ἐν ὑμῖν المكانية أو الجماعية
  choice: «فيكم» في المتن.
  alternative: «بينكم».
  rationale: كلا المعنيين ممكن في السياق، و«فيكم» أقرب إلى البنية اللفظية للأصل، بينما تُذكر «بينكم» بوصفها احتمالًا مشروعًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم السؤال الاستنكاري «أما تعلمون» للمحافظة على النبرة الرسولية، وحُفظت صيغ الجمع الظاهرة في الأصل، مع وضع علامات الحواشي عند الألفاظ التي تشرحها.
