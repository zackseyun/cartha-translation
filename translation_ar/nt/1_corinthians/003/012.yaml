lexical_decisions:
- source_word: εἰ δέ
  choice: وإن
  rationale: تنقل أداة الشرط مع الانتقال الخفيف الذي تفيده δέ من غير إثقال العربية بأداة استدراك قوية.
- source_word: τις
  choice: أحدٌ
  rationale: تؤدي معنى النكرة العامة، وهي صياغة عربية طبيعية في جملة الشرط.
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: يبني على الأساس
  rationale: تحافظ على صورة البناء وعلى علاقة البناء بالأساس المذكور في السياق.
- source_word: χρυσόν, ἄργυρον
  choice: ذهبًا أو فضةً
  rationale: ترجمة مباشرة لاسمي المادتين، مع استعمال «أو» عربيًا لبيان المواد البديلة في تعداد واقع داخل شرط.
- source_word: λίθους τιμίους
  choice: حجارةً كريمةً
  rationale: تحافظ على احتمال أن يكون المقصود حجارة بناء نفيسة أو أحجارًا ثمينة، من غير حصرها في الجواهر الصغيرة.
- source_word: ξύλα
  choice: خشبًا
  rationale: اسم جنس طبيعي في العربية لهذه المادة.
- source_word: χόρτον
  choice: حشيشًا
  rationale: اللفظ اليوناني يدل أساسًا على العشب أو الحشيش، وفي قائمة مواد البناء يشير إلى مادة نباتية سريعة الاحتراق؛ «حشيش» أقرب إلى الدلالة المصدرية من تخصيصه بالتبن.
- source_word: καλάμην
  choice: قشًّا
  rationale: يناسب سيقان النبات الجافة أو بقاياها المستعملة مادةً واهية، ويحافظ على تمييزها من χόρτον.
