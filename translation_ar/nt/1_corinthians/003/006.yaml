  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: ar
  text: أنا غرست، وأبلوس سقى، لكن الله كان يُنمي الزرع[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكن الله أعطى النمو»؛ أو: «لكن الله جعل الزرع ينمو».'
    reason: بدائل عربية لمعنى الفعل اليوناني، تتفاوت في إبراز التسبب وفي نقل دلالة الاستمرار في الماضي.
lexical_decisions:
- source_word: ἐγὼ
  choice: أنا
  rationale: إثبات الضمير المنفصل يحفظ توكيد الضمير اليوناني، ويقيم الموازنة الطبيعية بين دور بولس ودور أبلّوس ودور الله.
- source_word: ἐφύτευσα
  choice: غرست
  rationale: يحفظ صورة الزراعة بلفظ عربي طبيعي، وهو أدق هنا من «زرعت» التي قد تُفهم على أنها بذر الحبوب خاصة.
- source_word: Ἀπολλῶς
  choice: أبلّوس
  rationale: نقل صوتي للاسم اليوناني وفق الصيغة العربية الشائعة.
- source_word: ἐπότισεν
  choice: سقى
  rationale: تعبير عربي موجز وطبيعي يحفظ صورة الاعتناء بالنبات بعد غرسه.
- source_word: ἀλλὰ
  choice: لكن
  rationale: تنقل المقابلة القوية بين عمل الخادمين البشريين وعمل الله الحاسم.
- source_word: ὁ θεὸς
  choice: الله
  rationale: يحدد الله بوصفه فاعل الإنماء، من غير إضافة تفسير عقائدي إلى النص.
- source_word: ηὔξανεν
  choice: كان ينمّي
  rationale: يحفظ معنى التسبب في النمو، كما ينقل صيغة الماضي الناقص الدالة على فعل كان جاريا في الزمن الماضي؛ وتُذكر البدائل الطبيعية في الحاشية.
theological_decisions:
- issue: فاعلية الله وعمل الخدام البشر
  choice: يعرض النص بولس غارسا وأبلّوس ساقيا، في مقابل الله الذي كان يُحدث النمو.
  alternative: «الله أعطى النمو»
  rationale: يحفظ الاختيار كلا من حقيقة العمل البشري وكون النمو من فعل الله، من غير تحويل المقابلة إلى تقرير مذهبي أوسع مما يقوله النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة، مع الحفاظ على الاستعارة الزراعية وعلى التوازي بين الأفعال الثلاثة. استُعمل «كان ينمّي» لنقل دلالة الماضي الناقص مع بقاء العبارة مفهومة للقارئ العام.
