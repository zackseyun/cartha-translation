id: 1CO.3.17
reference: 1 Corinthians 3:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: ar
  text: إن كان أحدٌ يُفسِد هيكلَ الله[a]، فسوف يُفسِده الله؛ لأن هيكلَ الله مقدَّس، وأنتم ذلك الهيكل[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُخرِّب» أو «يُدمِّر». ويَرِد الفعل اليوناني نفسه في «فسوف يُفسِده الله».'
    reason: lexical_alternative
  - marker: b
    text: «أنتم» بصيغة الجمع؛ أي إن بولس يصف الجماعة مجتمعةً بأنها هيكل الله الواحد.
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: هيكل
  rationale: «هيكل» هو المقابل العربي الطبيعي للمقدس الذي يسكن فيه الله، ويحافظ على صورة الجماعة بوصفها هيكل الله.
- source_word: φθείρει / φθερεῖ
  choice: يُفسِد / سوف يُفسِده
  rationale: يحافظ هذا الاختيار على تكرار الفعل اليوناني نفسه وعلى اتساع دلالته، التي قد تشمل الإفساد والتخريب والتدمير، من غير حصرها في الهدم المادي.
- source_word: τοῦτον
  choice: ـه في «يُفسِده»
  rationale: يعود ضمير المفرد على «أحد»، وينقل مباشرةً المفعول الشخصي الذي يشير إليه اسم الإشارة اليوناني.
- source_word: ἅγιος
  choice: مقدَّس
  rationale: ينقل معنى الاختصاص بالله والحرمة، وهو تعبير عربي واضح وملائم لوصف الهيكل.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: وأنتم ذلك الهيكل
  rationale: صياغة عربية طبيعية توضّح أن المخاطَبين أنفسهم، بصيغة الجمع، هم الهيكل الواحد المذكور.
theological_decisions:
- issue: هل يشير هيكل الله أساسًا إلى المؤمن الفرد أم إلى الجماعة؟
  choice: 'تُفهم العبارة هنا فهمًا جماعيًا: المخاطَبون بصيغة الجمع هم معًا هيكل الله الواحد.'
  alternative: قد تُطبَّق صورة الهيكل على المؤمن الفرد استنادًا إلى مواضع كتابية أخرى.
  rationale: يجمع النص بين «الهيكل» المفرد و«أنتم» الجمع، كما أن سياق الأصحاح يتناول الجماعة وبنيانها.
- issue: مدى فعل φθείρω في التحذير والجزاء
  choice: استُعمل «يُفسِد» في الموضعين للمحافظة على التكرار وعلى المجال الدلالي الواسع.
  alternative: «يُدمِّر» أو «يُخرِّب» في الموضعين.
  rationale: الفعل اليوناني قد يدل على الإفساد أو الإهلاك بحسب السياق؛ و«يُفسِد» يحفظ التوتر الدلالي ولا يقصر المعنى على التدمير المادي، بينما تبقى شدة القصاص واضحة من مقابلة الفعل بالفعل.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقرة. استُخدمت «إن كان أحد» لصياغة الشرط، و«سوف» لإظهار دلالة المستقبل في جواب الشرط. وُضع كل من علامتي الحاشية في المتن عند الموضع الذي تشرحه.
