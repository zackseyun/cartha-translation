  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: ar
  text: 'فكلما قال أحد: «أنا لبولس»، وقال آخر: «أنا لأبلّوس»، أفلستم بشرًا[a]؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أفلستم مجرد بشر؟»، أو: «أفلستم تتصرفون تصرف البشر؟»'
    reason: بدائل تفسيرية تبين القوة التوبيخية المحتملة للفظ ἄνθρωποι في السياق، مع إبقاء اللفظ الصريح في المتن.
lexical_decisions:
- source_word: ὅταν
  choice: كلما
  rationale: تفيد ظرفًا غير محدد يتكرر أو يتحقق كلما وقع الفعل، وهو ما ينقل قوة الأداة اليونانية بوضوح وطبيعية.
- source_word: γὰρ
  choice: لأنه
  rationale: تحفظ الصلة التفسيرية بين هذه الجملة والحجة السابقة.
- source_word: λέγῃ τις
  choice: قال أحد
  rationale: ينقل البناء المفرد غير المحدد بصياغة عربية طبيعية ذات دلالة عامة.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: أنا لبولس
  rationale: تحفظ صيغة الإضافة الموجزة الدالة في السياق على الانتساب الحزبي، من غير توسيع تفسيري.
- source_word: ἕτερος δέ
  choice: وقال آخر
  rationale: تنقل المقابلة بين الشخص الأول والآخر، مع إظهار فعل القول المحذوف في اليونانية لسلامة العربية.
- source_word: Ἐγὼ Ἀπολλῶ
  choice: أنا لأبلّوس
  rationale: تستعيد الفعل المفهوم من العبارة السابقة وتحافظ على التوازي في صيغة الانتساب.
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: أفلستم بشرًا؟
  rationale: تحافظ على اللفظ الصريح «بشر» وعلى صيغة السؤال الإنكاري، من غير إدخال معنى «مجرد» أو «تتصرفون» في المتن.
theological_decisions:
- issue: دلالة وصف المخاطَبين بأنهم ἄνθρωποι في السؤال الإنكاري
  choice: أفلستم بشرًا؟
  alternative: أفلستم مجرد بشر؟ / أفلستم تتصرفون تصرف البشر؟
  rationale: المتن يحفظ الغموض الموجز في اليونانية، بينما تورد الحاشية القراءتين التفسيريتين اللتين تبرزان التوبيخ على السلوك البشري المحض.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت «كلما» لإبراز التكرار غير المحدد، وحوفظ على الصيغة الموجزة «أنا لبولس… أنا لأبلّوس» وعلى السؤال الإنكاري دون حسم دلالته التفسيرية في المتن.
