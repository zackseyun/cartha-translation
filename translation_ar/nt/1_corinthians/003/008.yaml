  verdict: revise
  source_fidelity: ينقل النص بدقة التوازي بين الغارس ومن يسقي، ووحدتهما، واستقلال مكافأة كل واحد بحسب كدحه. لكن تركيب «ولكن كلَّ واحد» غير سليم من دون تشديد «لكنّ»؛ والتعديل يزيل هذا الخلل مع إبراز التوكيد المتكرر في ἴδιον بصورة أوضح.
  naturalness: «الغارس والساقي» فصيحان ومناسبان للصورة الزراعية، وإن كان السياق هو الذي يحدد أن «الساقي» هو من يسقي الزرع. واستبدال أداة الاستدراك بـ«غير أن» يجعل الجملة سليمة وسلسة في العربية الفصحى الحديثة.
  terminology: «أجر» مقابل مناسب لـμισθός، و«تعب» ينقل κόπος نقلًا جيدًا. وتعبير «أجره الخاص ... تعبه الخاص» يحفظ التشديد الفردي في تكرار ἴδιον من غير إضافة تفسير لاهوتي. الحاشية تحافظ على بدائل الوحدة دون حسمها في المتن.
