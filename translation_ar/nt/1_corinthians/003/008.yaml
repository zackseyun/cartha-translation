  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: ar
  text: والغارس والساقي هما واحد[a]، غير أن كلَّ واحدٍ سينال أجره الخاص بحسب تعبه الخاص.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «متحدان»، أو: «لهما هدف واحد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: الغارس
  rationale: اسم الفاعل المعرّف ينقل الاستعمال الاسمي للمشاركة اليونانية ويحفظ الصورة الزراعية بوضوح.
- source_word: ποτίζων
  choice: الساقي
  rationale: يحفظ الصورة الزراعية ويقابل اسم الفاعل «الغارس» في صياغة عربية موجزة وطبيعية.
- source_word: ἕν
  choice: هما واحد
  rationale: يحافظ على إيجاز اليونانية وعلى صيغة المحايد الدالة على الوحدة لا على كونهما شخصًا واحدًا؛ وتوضح الحاشية المعنى المحتمل.
- source_word: μισθὸν
  choice: أجره
  rationale: «أجر» يشمل الجزاء المستحق في هذا السياق من غير حصره في دفعة مالية.
- source_word: λήμψεται
  choice: سينال
  rationale: ينقل المستقبل بصياغة عربية فصيحة وطبيعية، ويفيد تلقي الأجر.
- source_word: κατὰ
  choice: بحسب
  rationale: يحفظ علاقة الأجر بمقدار تعب كل عامل.
- source_word: κόπον
  choice: تعبه
  rationale: ينقل معنى العمل الشاق والجهد الذي يتضمنه اللفظ اليوناني، وهو أنسب من «عمل» وحدها.
- source_word: ἴδιον
  choice: أجره ... تعبه هو
  rationale: يحفظ التشديد الفردي الناتج من تكرار ἴδιον، مع إضافة «هو» بعد «تعبه» لإبراز أن الجزاء يتعلق بتعب كل واحد نفسه.
theological_decisions:
- issue: معنى ἕν εἰσιν («هما واحد»)
  choice: الإبقاء على العبارة الموجزة «هما واحد» مع بيان الوحدة في الحاشية
  alternative: «هما متحدان» أو «لهما غرض واحد»
  rationale: صيغة المحايد المفرد تشير إلى الوحدة، لا إلى التطابق الشخصي أو محو اختلاف الدور. والإبقاء على العبارة في المتن يصون توتر النص وإيجازه، بينما تعرض الحاشية البدائل التفسيرية دون فرض أحدها.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم التوازي بين «الغارس» و«الساقي»، وحُفظت الصورة الزراعية وإيجاز العبارة اليونانية، مع تجنب تفسير الوحدة تفسيرًا مذهبيًا داخل المتن.
