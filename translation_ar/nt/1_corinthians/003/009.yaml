  text: For we are God’s fellow workers; you are God’s field[a], God’s building.
translation:
  language: ar
  text: لأننا نعمل معًا في خدمة الله[a]، وأنتم حقل الله وبناء الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «نحن عاملون مع الله».'
    reason: تحتمل عبارة θεοῦ συνεργοί أيضًا أن يكون المعنى أن العاملين يعملون مع الله؛ وهو احتمال نحوي وتفسيري معتبر.
lexical_decisions:
- source_word: γάρ
  choice: لأننا
  rationale: تنقل الأداة التعليلية التي تربط القول بالحجة السابقة، مع اتصالها طبيعيًا بالضمير التالي.
- source_word: συνεργοί
  choice: عاملون معًا
  rationale: تعبير عربي واضح يحفظ معنى الاشتراك في العمل وصيغة الجمع.
- source_word: θεοῦ (مع συνεργοί)
  choice: لله
  rationale: يحفظ إمكان فهم الإضافة على أن العاملين تابعون لله وفي خدمته، من غير أن يحسم وحده أنهم شركاء لله في العمل على المستوى نفسه.
- source_word: γεώργιον
  choice: حقل
  rationale: يحفظ الاستعارة الزراعية بلفظ موجز ومألوف، ويفيد أرضًا تُفلح وتُزرع.
- source_word: οἰκοδομή
  choice: بناء
  rationale: لفظ طبيعي يمهّد لاستعارة البناء التي تتوسع فيها الآيات التالية، ويمكن أن يدل على المنشأة وعلى عمل تشييدها.
- source_word: ἐστε
  choice: أنتم
  rationale: يُظهر بوضوح ضمير المخاطبين بصيغة الجمع الوارد في اليونانية.
theological_decisions:
- issue: هل تعني θεοῦ συνεργοί «عاملون معًا لله» أم «عاملون مع الله»؟
  choice: عاملون معًا لله
  alternative: عاملون مع الله
  rationale: صيغة الإضافة اليونانية تحتمل النقاش. وفي السياق المباشر يؤكد بولس أن الخدام لله وأن الجماعة ملك لله؛ لذلك يحفظ المتن معنى الانتساب والخدمة، بينما تُثبت الحاشية البديل الحقيقي من غير طمس للتوتر التفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. تكرار «الله» مقصود، إذ يقابل التكرار البلاغي ثلاث مرات في النص اليوناني ويؤكد أن العاملين والحقل والبناء جميعًا له.
