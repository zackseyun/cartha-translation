  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: ar
  text: لكن ليست هذه المعرفة لدى الجميع. فبعضهم، بسبب أُلفتهم بالصنم إلى الآن[a]، يأكلون الطعام على أنه مما ذُبح لصنم، فيتدنّس ضميرهم، وهو ضعيف[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'العبارة اليونانية عسرة، ويمكن ترجمتها حرفيًا: «بسبب العادة أو الأُلفة بالصنم إلى الآن». والمقصود أن بعضهم ما زال واقعًا تحت تأثير صلته السابقة بعبادة الأصنام.'
    reason: lexical_alternative
  - marker: b
    text: تقرأ بعض المخطوطات «بضمير الصنم»، وتوجد صيغ نصية أخرى في هذا الموضع؛ ويتبع المتن قراءة SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: المعرفة
  rationale: تحافظ على الصلة بالسياق القريب، حيث يدور الكلام على معرفة أن الصنم لا شيء.
- source_word: συνήθεια
  choice: أُلفتهم
  rationale: تفيد الاعتياد والارتباط المترسخ بالصنم، مع إبقاء العبارة موجزة وقريبة من الأصل.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: بالصنم إلى الآن
  rationale: يحفظ عنصر الاستمرار الزمني في ἕως ἄρτι وصلته بالصنم، من غير حسم زائد لعبارة يونانية عسرة.
- source_word: εἰδωλόθυτον
  choice: مما ذُبح لصنم
  rationale: ينقل الدلالة القربانية بوضوح، ويصف نظرة الآكل إلى الطعام دون الإقرار بألوهية الصنم.
- source_word: συνείδησις
  choice: ضميرهم
  rationale: المقابل العربي المألوف للوعي الأخلاقي في هذا السياق البولسي.
- source_word: ἀσθενής
  choice: ضعيفًا
  rationale: يحفظ مصطلح بولس المحوري في هذا الأصحاح من غير تفسيره بأنه مجرد حساسية نفسية.
- source_word: μολύνεται
  choice: فيتدنّس
  rationale: ينقل معنى التلوث الأدبي الذي يصيب الضمير، بصياغة عربية طبيعية.
theological_decisions:
- issue: كيفية وصف الطعام المرتبط بالصنم دون الإيحاء بأن الصنم إله حقيقي
  choice: يأكلون الطعام على أنه مما ذُبح لصنم
  alternative: يأكلون ما ذُبح لصنم
  rationale: تُبقي عبارة «على أنه» منظور الآكل إلى الدلالة الطقسية للطعام، وتحفظ التوتر في السياق بين كون الصنم لا شيء وبين إمكان تدنّس الضمير.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «أُلفة» للحفاظ على معنى الاعتياد والارتباط، وأُبقي تركيب «إلى الآن» لتمثيل العنصر الزمني الصريح في اليونانية. تظهر علامتا الحاشيتين [a] و[b] في المتن.
