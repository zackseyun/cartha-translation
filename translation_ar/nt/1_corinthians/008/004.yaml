  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: ar
  text: فإذًا، من جهة أكل ما ذُبح للأوثان، نعلم أن الوثن لا شيء في العالم[a]، وأنه لا إله إلا واحد[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليس للوثن وجود حقيقي في العالم».'
    reason: بديل دلالي يوضح وجهًا محتملًا للعبارة اليونانية الموجزة οὐδὲν εἴδωλον ἐν κόσμῳ.
  - marker: b
    text: 'أو: «وأنه لا يوجد إله إلا واحد».'
    reason: بديل تركيبي يصرّح بفعل الوجود المقدر في العبارة اليونانية.
lexical_decisions:
- source_word: βρώσεως
  choice: أكل
  rationale: يدل الاسم على فعل الأكل، لا على الطعام في ذاته؛ وجاء المصدر العربي طبيعيًّا بعد «من جهة».
- source_word: εἰδωλοθύτων
  choice: ما ذُبح للأوثان
  rationale: ينقل معنى ما قُدِّم ذبيحةً للأوثان من غير تقييده بكلمة «لحم»، مع صياغة عربية واضحة ومألوفة.
- source_word: οἴδαμεν
  choice: نعلم
  rationale: يحفظ المعنى الحاضر للفعل وصيغة الجمع التي يستند بها بولس إلى معرفة مشتركة.
- source_word: οὐδὲν εἴδωλον
  choice: الوثن لا شيء
  rationale: يحافظ على إيجاز العبارة اليونانية وقوتها، وعلى احتمال دلالتها على بطلان الوثن أو انعدام حقيقته.
- source_word: ἐν κόσμῳ
  choice: في العالم
  rationale: مقابل عربي طبيعي لـκόσμος في هذا السياق، ويشير إلى مجال الواقع أو العالم المخلوق.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: لا إله إلا واحد
  rationale: صياغة عربية موجزة ومباشرة تحفظ تقرير وحدانية الله، من غير أن تفرض العربية تمييزًا كتابيًّا بين «God» و«god» غير موجود فيها.
- source_word: οὖν
  choice: فإذًا
  rationale: تُظهر الفاء الصلة بما سبق، وتفيد «إذًا» الانتقال الاستنتاجي الذي تؤديه οὖν.
theological_decisions:
- issue: دلالة القول إن الوثن «لا شيء»
  choice: الإبقاء على العبارة الموجزة «الوثن لا شيء»
  alternative: «ليس للوثن وجود حقيقي في العالم»
  rationale: النص اليوناني موجز ويمكن أن يفيد بطلان الوثن أو عدم وجود حقيقة إلهية وراءه؛ لذلك لم يُحسم هذا التوتر بتوسيع تفسيري داخل المتن.
- issue: صياغة تقرير الوحدانية
  choice: «لا إله إلا واحد»
  alternative: «لا يوجد إله إلا واحد»
  rationale: تحفظ الصياغة المباشرة قوة οὐδεὶς θεὸς εἰ μὴ εἷς، ولا تضيف تفصيلًا عقائديًّا يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «من جهة» لربط الآية بموضوع النقاش، وحُفظ إيجاز عبارتي بطلان الوثن ووحدانية الله. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحانهما مباشرة.
