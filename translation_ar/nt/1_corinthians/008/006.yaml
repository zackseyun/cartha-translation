id: 1CO.8.6
reference: 1 Corinthians 8:6
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: ar
  text: لكن لنا إله واحد، هو الآب، الذي منه كل شيء، ونحن له[b]؛ ورب واحد، هو يسوع المسيح[a]، الذي به كل شيء، ونحن به[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا فهم العبارة بمعنى «يسوع المَسيّا». فاللفظة اليونانية Χριστός قد تؤدي وظيفة اللقب، أي «المسيّا»، وقد تستعمل في بعض السياقات استعمالًا قريبًا من الاسم، أي «المسيح».
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا أن تُفهم: «ونحن إليه». فالعبارة قد تدل على الاتجاه أو الغاية أو القصد؛ واختيرت «له» لإبقاء هذه الدلالات متاحة في العربية.'
    reason: lexical_alternative
  - marker: c
    text: تحافظ عبارتا «منه كل شيء» و«به كل شيء» على التمييز بين الآب بوصفه المصدر، ويسوع المسيح بوصفه الوسيط، من غير فصل الإقرار بـ«رب واحد» عن الإقرار بـ«إله واحد».
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: لكن
  rationale: تفيد الاستدراك والمقابلة مع ذكر «الآلهة» و«الأرباب» في السياق السابق، وهي صياغة عربية واضحة وطبيعية.
- source_word: ἡμῖν
  choice: لنا
  rationale: 'دالّ على جهة الاعتبار: أي من جهة إيماننا وإقرارنا.'
- source_word: εἷς θεὸς ὁ πατήρ
  choice: إله واحد، هو الآب
  rationale: يحافظ على قوة الإقرار بوحدانية الله، ويبيّن أن «الآب» بدل أو تعريف للإله الواحد.
- source_word: ἐξ οὗ τὰ πάντα
  choice: الذي منه كل شيء
  rationale: تحافظ «منه» على دلالة المصدر أو المنشأ في ἐξ، و«كل شيء» تعبير عربي جامع وسلس.
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: ونحن له
  rationale: صياغة موجزة تحافظ على حذف الفعل في اليونانية، وتحتمل معنى الاتجاه والغاية والقصد دون حصره في تفسير واحد.
- source_word: καὶ εἷς κύριος
  choice: ورب واحد
  rationale: يحفظ التوازي المقصود مع «إله واحد» والوزن الاعترافي للفظ κύριος.
- source_word: Ἰησοῦς Χριστός
  choice: يسوع المسيح
  rationale: «المسيح» المقابل العربي الراسخ لـΧριστός، ويمكن أن يُفهم لقبًا أو استعمالًا قريبًا من الاسم، كما توضّح الحاشية.
- source_word: δι’ οὗ τὰ πάντα
  choice: الذي به كل شيء
  rationale: الباء تنقل بإيجاز دلالة الوساطة أو الفاعلية في διά مع المضاف إليه، مع إبقاء الصياغة موازية لعبارة «منه كل شيء».
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: ونحن به
  rationale: يحافظ على إيجاز الأصل وحذف الفعل، فلا يعيّن إن كان المقصود وجود المؤمنين أو حياتهم أو خلاصهم من خلاله.
theological_decisions:
- issue: العلاقة بين «إله واحد» و«رب واحد» في صيغة إقرار توحيدية
  choice: 'الإبقاء على التوازي: «إله واحد، هو الآب ... ورب واحد، هو يسوع المسيح».'
  alternative: إضعاف دلالة «رب» أو إضافة شرح عقائدي يجعل العلاقة أكثر تحديدًا مما يقوله النص.
  rationale: يميّز النص بين الآب ويسوع المسيح، مع منح العبارتين وزنًا اعترافيًا متوازيًا. لذلك تُحفظ الصياغة وتوترها اللاهوتي من غير اختزال أو توسع مذهبي.
- issue: دلالة حروف الجر في وصف علاقة الآب والمسيح بكل شيء وبالمؤمنين
  choice: ترجمة ἐξ بـ«من»، وεἰς بـ«لـ»، وδιά بـ«الباء».
  alternative: توحيد حروف الجر أو تفسيرها بعبارات شارحة مثل «خلق» و«نعيش لأجله».
  rationale: يحفظ هذا الاختيار التمييز النصي بين المصدر أو المنشأ، والاتجاه أو الغاية، والوساطة، من غير إدخال أفعال غير مصرّح بها في الأصل.
translation_notes:
  register: عربية فصحى معاصرة، واضحة ووقورة. حُفظ التوازي والإيجاز والحذف الموجود في اليونانية، واستُعملت «هو» لتوضيح البدل في العربية من غير إضافة مضمون جديد.
