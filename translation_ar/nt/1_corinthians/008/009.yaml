  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: ar
  text: لكن احذروا أن يصير حقكم هذا، بطريقة ما، حجر عثرة للضعفاء[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «حريتكم هذه» أو «سلطانكم هذا». يمكن للكلمة اليونانية أن تعني «سلطانًا» أو «حقًا» أو «حرية»؛ وهي تشير هنا إلى الحرية التي ادّعى بعض المؤمنين أن لهم أن يمارسوها في أكل طعام مرتبط بالأوثان.
    reason: lexical_alternative
  - marker: b
    text: المقصود بـ«الضعفاء» هنا مَن كان ضميره ضعيفًا في هذه المسألة.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: احذروا
  rationale: فعل أمر يدعو إلى اليقظة إزاء نتيجة محتملة؛ و«احذروا» عربية واضحة تحفظ قوة التحذير.
- source_word: δὲ
  choice: لكن
  rationale: تفيد انتقالًا ذا مسحة استدراكية من تقرير الحق إلى التحذير من إساءة استعماله.
- source_word: μή πως
  choice: أن... بطريقة ما
  rationale: تدخل غاية احترازية من احتمال وقوع نتيجة غير مرغوبة، وتحفظ دلالة πως على الاحتمال دون جزم بكيفيته.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: حقكم هذا
  rationale: تشير في السياق إلى ما يعدّه بعض المؤمنين حقًا أو حرية في الأكل؛ و«الحق» طبيعي ومحدد، مع إثبات البدائل الدلالية في الحاشية.
- source_word: πρόσκομμα
  choice: حجر عثرة
  rationale: يحفظ الاستعارة التي تصف ما يتسبب في تعثر الآخر روحيًا أو أخلاقيًا، وهو تعبير كتابي عربي مفهوم.
- source_word: γένηται
  choice: يصير
  rationale: ينقل معنى الصيرورة البسيط في صيغة التحذير.
- source_word: τοῖς ἀσθενέσιν
  choice: للضعفاء
  rationale: يحافظ على إيجاز الأصل، فيما توضح الحاشية أن الضعف هنا متعلق بالضمير في هذه المسألة.
theological_decisions:
- issue: دلالة ἐξουσία في السياق
  choice: حق المؤمنين المدَّعى في شأن الطعام المرتبط بالأوثان
  alternative: سلطة أو حرية بمعنى أوسع
  rationale: سياق الأصحاح يتناول حرية الأكل عند من لديهم معرفة؛ واختيار «حق» يصور المسألة الأخلاقية العملية من غير إدخال معنى السلطة المؤسسية، مع إبقاء البدائل في الحاشية.
- issue: المقصود بـ τοῖς ἀσθενέσιν
  choice: المؤمنون الضعفاء في ضميرهم تجاه هذه المسألة
  alternative: الضعفاء بوجه عام أو جسديًا
  rationale: تكرار لغة الضمير الضعيف في الأصحاح يحدد المرجع، لكن المتن يبقي عبارة «الضعفاء» الموجزة ويحيل الإيضاح إلى الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة ذات نبرة تحذيرية رصينة. حُفظت استعارة «حجر عثرة»، وأُبقي وصف «الضعفاء» موجزًا كما في الأصل، مع توضيح دلالته السياقية في الحاشية.
