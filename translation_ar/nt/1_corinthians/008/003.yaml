  text: But if anyone loves God[a], this one is known by him.
translation:
  language: ar
  text: أَمَّا مَنْ يُحِبُّ اللهَ، فَهُوَ مَعْرُوفٌ لَدَيْهِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فقد عرفه الله»، أو: «فهو معترَفٌ به لديه». وقد تدل صيغة التام المبني للمجهول في اليونانية على حالة مستمرة من كون الشخص معروفًا لدى الله.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: أَمَّا مَنْ
  rationale: تنقل الشرط العام مع المقابلة اللطيفة بالسياق السابق، وتأتي في العربية أفصح وأطبع من الصياغة الحرفية «ولكن إن كان أحد».
- source_word: τις
  choice: مَنْ
  rationale: اسم شرط عام يشمل أي شخص من غير تخصيص بالذكر.
- source_word: ἀγαπᾷ
  choice: يُحِبُّ
  rationale: مقابل مباشر وطبيعي للمضارع ἀγαπᾷ، ويحفظ معنى المحبة دون شرح زائد.
- source_word: τὸν θεόν
  choice: اللهَ
  rationale: المقابل العربي الطبيعي للاسم المعرّف في هذا السياق.
- source_word: οὗτος
  choice: فَهُوَ
  rationale: فاء الجواب مع الضمير تعيدان بوضوح إلى الشخص المذكور، وتؤديان وظيفة اسم الإشارة اليوناني في عربية سليمة؛ أما «فهذا» فقد توهم الإشارة القريبة إلى مذكّر بعينه.
- source_word: ἔγνωσται
  choice: مَعْرُوفٌ
  rationale: يحفظ المبني للمجهول والحالة الحاضرة الناتجة عن فعل سابق التي يفيدها التام اليوناني، من غير حصر المعرفة في العلم الذهني أو القبول.
- source_word: ὑπ’ αὐτοῦ
  choice: لَدَيْهِ
  rationale: تعبير عربي طبيعي لمعنى كونه معروفًا عند الله، مع بقاء مرجع الضمير واضحًا. وهو يتجنب ثقل «معروف من قِبَله» دون حذف الفاعل الدلالي.
theological_decisions:
- issue: دلالة معرفة الله للشخص
  choice: مَعْرُوفٌ لَدَيْهِ
  alternative: مقبول لديه / معترف به منه / قد عرفه الله معرفة خلاصية
  rationale: قد تتضمن γινώσκω حين يكون الله هو العارف معنى علائقيًا أو معنى الاعتراف والقبول، لكن النص لا يفرض تحديدًا عقائديًا أضيق؛ لذلك تُترك الدلالة واسعة.
- issue: دلالة صيغة التام المبني للمجهول ἔγνωσται
  choice: 'صياغة اسمية: «فهو معروف»'
  alternative: «فقد عرفه» أو «كان معروفًا»
  rationale: الصياغة الاسمية تبرز الحالة المستمرة الناتجة عن معرفة سابقة، وتحافظ على المبني للمجهول، بينما قد توحي البدائل بزمن ماضٍ محض أو تغيّر زاوية العبارة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت بنية «أما من... فهو...» لتأدية الشرط والمقابلة بصورة طبيعية، مع الحفاظ على إيجاز الأصل وغموض معنى المعرفة الإلهية المقصود.
