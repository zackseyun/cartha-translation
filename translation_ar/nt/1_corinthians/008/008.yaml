  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: ar
  text: أَمَّا الطَّعَامُ فَلَا يُقَرِّبُنَا إِلَى اللهِ؛ لِأَنَّنَا إِنْ أَكَلْنَا لَا نَزْدَادُ، وَإِنْ لَمْ نَأْكُلْ لَا نَنْقُصُ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أمّا الطعام فلا يقدّمنا أمام الله؛ لأننا لا نكون أفضل حالًا إن أكلنا، ولا أسوأ حالًا إن لم نأكل».'
    reason: بديل لغوي يوضح الاحتمال الآخر للفعل παραστήσει والمعنى السياقي للفعلين περισσεύομεν وὑστερούμεθα.
lexical_decisions:
- source_word: βρῶμα
  choice: الطعام
  rationale: لفظ عام يدل على الطعام، ولا يقتصر في ذاته على اللحم أو نوع بعينه.
- source_word: παραστήσει
  choice: يُقَرِّبنا إلى الله
  rationale: ينقل في السياق معنى الوصول إلى منزلة أو قرب لدى الله، مع إبقاء احتمال معنى التقديم أو الإحضار أمامه في الحاشية.
- source_word: περισσεύομεν
  choice: نزداد
  rationale: يحافظ على المقابلة اللفظية مع «ننقص» من غير أن يحدد هل المقصود فضل أم منفعة أم منزلة.
- source_word: ὑστερούμεθα
  choice: ننقص
  rationale: يعبر عن الافتقار أو التأخر في مقابل الزيادة، ويحفظ صياغة بولس المتوازية.
- source_word: δὲ ... γὰρ
  choice: أمّا ... فلأنّ
  rationale: «أمّا» انتقال تقابلي لطيف، و«لأنّ» تبين أن الجملتين التاليتين تعللان الحكم السابق.
theological_decisions:
- issue: هل يتحدث النص عن القبول لدى الله أم القرب منه أم مجرد المنفعة الروحية؟
  choice: صياغة عامة تفيد أن الطعام لا يقرب الإنسان إلى الله، وأن الأكل والامتناع لا يحدثان في ذاتهما زيادة أو نقصانًا.
  alternative: «لا يجعلنا الطعام مقبولين لدى الله» أو «لا يقدّمنا الطعام أمام الله».
  rationale: الفعل παραστήσει يحتمل التقديم أو الإحضار أمام شخص، وقد يفيد في السياق المنزلة لديه. تجنبت الترجمة حصر المعنى في حكم طقسي أو عقائدي أدق مما يقتضيه اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، مع توازٍ إيقاعي بين «إن أكلنا» و«إن لم نأكل»، وبين «نزداد» و«ننقص». أُثبتت علامة الحاشية في المتن.
