  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: ar
  text: فحتى إن وُجدت آلهة[a] يُقال عنها إنها آلهة، سواء في السماء أم على الأرض—كما توجد بالفعل آلهة كثيرة وأرباب كثيرون[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «التي تُدعى آلهة». يمكن لاسم المفعول اليوناني أن يدل على من يُطلق عليهم هذا الاسم، وقد تفيد العبارة في السياق معنى «ما يُسمّى آلهة»، بما يُظهر ابتعاد بولس عن الإقرار بألوهيتهم.'
    reason: lexical_alternative
  - marker: b
    text: «أرباب» ترجمة جمع الكلمة اليونانية نفسها التي تُترجم غالبًا «الرب». والمقصود هنا الكائنات أو القوى الكثيرة التي يطلق الناس عليها هذا اللقب، لا الرب الواحد المذكور في العدد 6.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: فحتى
  rationale: تؤدي الفاء معنى التعليل والربط في γάρ، وتؤدي «حتى» قوة καί الإضافية في سياق الشرط التنازلي.
- source_word: εἴπερ
  choice: إن كان
  rationale: تنقل الشرط الذي يسلّم به بولس جدلًا، من غير تحويله إلى تقرير قطعي.
- source_word: λεγόμενοι θεοὶ
  choice: ما يُسمّى آلهة
  rationale: تحافظ على دلالة التسمية في اسم المفعول اليوناني وعلى مسافة بولس من دعوى ألوهتها، من غير أن تحسم اللفظ بقدر يفوق الأصل.
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: سواء في السماء أم على الأرض
  rationale: صياغة عربية طبيعية تحفظ التقابل والنطاق الكوني للعبارة.
- source_word: ὥσπερ
  choice: كما أن ... بالفعل
  rationale: تنقل معنى الإقرار التأكيدي بالواقع المشاهد، مع إبقاء الفرق بين الوجود بوصفهم مسمَّين كذلك وبين الألوهية الحقيقية.
- source_word: θεοὶ πολλοὶ καὶ κύριοι πολλοί
  choice: آلهة كثيرين وأربابًا كثيرين
  rationale: تحفظ التوازي والتكرار في اليونانية، وتترجم κύριοι بما يميّزه هنا عن «الرب» الواحد في العدد التالي.
theological_decisions:
- issue: مسافة بولس البلاغية من الآلهة الوثنية
  choice: ما يُسمّى آلهة
  alternative: آلهة مزعومة؛ المدعوّون آلهة
  rationale: هذه الصياغة تحفظ غموض λεγόμενοι بين «المسمّى» و«ما يُسمّى» وتنسجم مع إنكار الألوهية الحقيقية للأصنام في السياق، من غير إضافة حكم أشد من اللفظ.
- issue: ذكر آلهة وأرباب كثيرين مع الإقرار بإله واحد ورب واحد في العدد 6
  choice: إبقاء «آلهة كثيرين وأربابًا كثيرين» مع توضيح المقصود في الحاشية
  alternative: معبودات كثيرة وسادة كثيرون
  rationale: يحافظ ذلك على مفردات الأصل وعلى التوتر المقصود بين الألقاب أو القوى المعترف بها وبين الاعتراف المسيحي في العدد التالي، من غير تسوية هذا التوتر داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «فحتى إن كان» لصون الربط والتنازل، وحُفظت الجملة الاعتراضية والشرطة الختامية لأن الآية تتصل نحويًا بما يليها. وُضعت علامتا الحاشية كلتاهما في موضعيهما داخل المتن.
