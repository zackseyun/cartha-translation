  source_fidelity: 'يحفظ المشروع البنية الأساسية للنص: الرابط التفسيري والتوكيدي في καὶ γάρ، والشرط التنازلي في εἴπερ، ودلالة التسمية/الادعاء في λεγόμενοι، والتقابل بين السماء والأرض، ثم الإقرار بوجود آلهة وأرباب كثيرين بوصفها تسميات وقوى معترفًا بها. لكن إسناد «كثيرين» إلى «آلهة» غير سليم في العربية الفصحى؛ فـ«آلهة» جمع لغير العاقل ويعامَل هنا معاملة المفرد المؤنث في الوصف: «آلهة كثيرة».'
  naturalness: «فحتى إن كان هناك» ثقيلة قليلًا في العربية المعاصرة، بينما «فحتى إن وُجدت...» أسلس وتحافظ على القوة التنازلية. وصياغة «كما توجد بالفعل آلهة كثيرة وأرباب كثيرون» طبيعية وتحفظ الجملة الاعتراضية المفتوحة التي تتصل بالعدد التالي.
