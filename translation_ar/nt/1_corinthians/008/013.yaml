id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: ar
  text: لذلك، إن كان طعامٌ يجعل أخي يتعثّر، فلن آكل لحمًا أبدًا، لئلّا أجعل أخي يتعثّر.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  choice: طعام
  rationale: لفظ عام يقابل الطعام أو المأكول، ويحافظ على الانتقال في الجملة إلى «لحمًا» بوصفه النوع المحدد.
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: يجعل... يتعثّر / أجعل... يتعثّر
  rationale: ينقل الصورة المجازية اليونانية بوضوح، ويحافظ على تكرار الفعل نفسه وعلى معناه الأخلاقي والسياقي دون حصره في مجرد الإساءة أو الإغضاب.
- source_word: οὐ μὴ φάγω
  choice: فلن آكل
  rationale: صيغة نفي قوية في اليونانية؛ «لن» تؤدي النفي المؤكد مستقبلًا، ويعززه «أبدًا» الآتي ترجمةً للعبارة الزمنية.
- source_word: κρέα
  choice: لحمًا
  rationale: المقصود اللحم، لا الطعام على إطلاقه.
- source_word: εἰς τὸν αἰῶνα
  choice: أبدًا
  rationale: تعبير عربي طبيعي وقوي يؤدي المعنى الحرفي «إلى الأبد» في هذا السياق، أي الامتناع الدائم، من غير إضافة «مرة أخرى» غير الموجودة في النص.
- source_word: ἀδελφόν
  choice: أخي
  rationale: يحافظ على لغة القرابة التي يستعملها بولس، مع بقاء إمكان فهمها في سياق جماعة المؤمنين.
theological_decisions:
- issue: طبيعة التعثّر
  choice: يجعل أخي يتعثّر
  alternative: يُغري أخي بالسقوط في الخطية / يسيء إلى أخي
  rationale: الصياغة المختارة تحفظ اتساع σκανδαλίζω وصورته المجازية، فلا تقصر التعثّر على الشعور بالإساءة ولا تفسره تفسيرًا عقائديًا أضيق من اللفظ.
- issue: مدى الامتناع عن اللحم
  choice: لن آكل لحمًا أبدًا
  alternative: لن آكل لحمًا مرة أخرى
  rationale: يحافظ «أبدًا» على قوة εἰς τὸν αἰῶνα وعلى التعهد البلاغي كما ورد، بدل تلطيفه أو إعادة تفسيره.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. حوفظ على تكرار «أخي» و«يتعثّر» لما له من توكيد بلاغي في الأصل، ولم تُضف علامة حاشية لعدم الحاجة إلى حاشية نصية أو تفسيرية.
