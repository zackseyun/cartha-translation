source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν εἰδωλοθύτων, οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν. ἡ γνῶσις φυσιοῖ, ἡ δὲ ἀγάπη οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: ar
  text: وأما الطعام المقدَّم ذبيحةً للأوثان[a]، فنحن نعلم أن لنا جميعًا معرفة[b]. المعرفة تنفخ، أما المحبة فتبني.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ما قُدِّم ذبيحةً للأوثان»، أو: «اللحم المقدَّم للأوثان».'
    reason: lexical_alternative
  - marker: b
    text: 'قد يكون بولس هنا يردّد عبارةً شائعة لدى أهل كورنثوس: «لنا جميعًا معرفة».'
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: وأما
  rationale: صيغة عربية طبيعية لافتتاح موضوع جديد، تنقل الانتقال الخطابي من غير إضافة معنى زمني غير موجود في اليونانية.
- source_word: τῶν εἰδωλοθύτων
  choice: الطعام المقدَّم ذبيحةً للأوثان
  rationale: ينقل المعنى المتصل بما قُدِّم في عبادة الأوثان، ويُظهر أن المقصود في السياق طعام، من غير حصره صراحةً في اللحم.
- source_word: οἴδαμεν
  choice: فنحن نعلم
  rationale: ترجمة مباشرة طبيعية للفعل ذي الدلالة الحاضرة، مع الفاء لربط العبارة بالموضوع المفتتح.
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: أن لنا جميعًا معرفة
  rationale: يحافظ على شمول «جميعًا» وعلى لفظ «معرفة»، من غير حسم ما إذا كانت العبارة تقريرًا لبولس أم صدى لقول شائع لدى أهل كورنثوس.
- source_word: ἡ γνῶσις
  choice: المعرفة
  rationale: يحافظ على الصلة اللفظية مع «معرفة» في الجملة السابقة وعلى الاستعمال العام للاسم المعرّف.
- source_word: φυσιοῖ
  choice: تنفخ
  rationale: يحفظ صورة الانتفاخ المجازية القوية في كلام بولس بدل تسويتها إلى شرح مثل «تجعل الإنسان متكبرًا».
- source_word: ἡ δὲ ἀγάπη
  choice: أما المحبة
  rationale: ينقل المقابلة بوضوح ويحافظ على اللفظ اللاهوتي والعام «المحبة» من غير تخصيص زائد.
- source_word: οἰκοδομεῖ
  choice: فتبني
  rationale: يحفظ استعارة البناء في الأصل بلفظ عربي واضح ومألوف، من غير تقييد المفعول المحذوف في اليونانية.
theological_decisions:
- issue: هل عبارة «لنا جميعًا معرفة» تقرير عام غير مقيّد أم قول كورنثي يتناوله بولس؟
  choice: 'إبقاء العبارة في المتن كما وردت: «أن لنا جميعًا معرفة»'
  alternative: تمييزها صراحةً بوصفها اقتباسًا أو قولًا لأهل كورنثوس
  rationale: لا يتضمن النص اليوناني علامة اقتباس أو أداة صريحة تنسب العبارة إلى أهل كورنثوس؛ لذلك يُحفظ التوتر البلاغي في المتن، وتُذكر الإمكانية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت مقابلة موجزة بين «تنفخ» و«تبني» للمحافظة على الصورتين البلاغيتين المتوازيتين في الأصل، ووُضعت علامتا الحاشيتين عند اللفظ والعبارة اللذين تشرحهما كل حاشية.
