id: 1CO.8.12
reference: 1 Corinthians 8:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: ar
  text: وهكذا[c]، إذ تخطئون في حقّ الإخوة[a] وتجرحون ضميرهم الضعيف، فإنكم تخطئون في حقّ المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لفظ «الإخوة» هنا يشير إلى رفقاء الإيمان، وقد يشمل الرجال والنساء.
    reason: lexical_alternative
  - marker: b
    text: اليونانية Χριστός، أي «المسيح» أو «الممسوح».
    reason: alternative_reading
  - marker: c
    text: 'يمكن أيضًا صياغة العبارة: «وإذ تخطئون في حقّ الإخوة على هذا النحو…».'
    reason: previous_rendering
lexical_decisions:
- source_word: οὕτως δὲ
  choice: وهكذا
  rationale: تربط العبارة بما سبق وتدل على الكيفية أو النتيجة من غير إبراز تعارض قوي؛ و«وهكذا» عربية طبيعية تحفظ الإحالة إلى السياق السابق.
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: إذ تخطئون في حقّ الإخوة
  rationale: اسم الفاعل اليوناني يبيّن الظرف المصاحب للفعل الرئيس، و«يخطئ في حقّ» تعبير عربي طبيعي ينقل دلالة الإساءة الموجّهة إلى أشخاص.
- source_word: τύπτοντες
  choice: تجرحون
  rationale: الفعل في السياق مجازي، و«تجرحون» يحفظ أثر الضرب والإيذاء مع وضوحه عند إسناده إلى الضمير.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: ضميرهم الضعيف
  rationale: حُفظ إفراد «الضمير» كما في اليونانية مع الضمير الجمعي، ونُقلت الحال الوصفية ἀσθενοῦσαν بصفة «الضعيف» في صياغة عربية مألوفة.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: فإنكم تخطئون في حقّ المسيح
  rationale: تكرار «تخطئون في حقّ» يحفظ التوازي البلاغي، و«المسيح» هو المقابل العربي المعياري للقب Χριστός.
theological_decisions:
- issue: مدلول ἀδελφοὺς في سياق جماعة المؤمنين
  choice: الإخوة
  alternative: الإخوة والأخوات؛ المؤمنون
  rationale: الصيغة اليونانية مذكرة جمعًا، لذا حُفظت في المتن، مع بيان احتمال شمولها المؤمنين والمؤمنات في الحاشية.
- issue: نقل Χριστός
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» هو اللقب العربي الراسخ والدقيق، بينما «الممسوح» يشرح معناه الاشتقاقي لكنه أقل ملاءمة في المتن.
- issue: العلاقة بين الإساءة إلى المؤمن والإساءة إلى المسيح
  choice: 'الإبقاء على التقرير المباشر: تخطئون في حقّ المسيح'
  alternative: إضافة تفسير مثل «كأنكم تخطئون»
  rationale: النص اليوناني يقرر العلاقة مباشرة بلا أداة تشبيه أو تخفيف، ولذلك لم تُضف عبارة تفسيرية تحسم طبيعتها اللاهوتية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُخدم «في حقّ» بدل النقل الحرفي لحرف الجر كي يأتي التعبير طبيعيًا، مع الحفاظ على تكرار فعل الخطية في طرفي الآية وعلى قوة الربط بين جرح ضمير المؤمن والخطية في حقّ المسيح.
