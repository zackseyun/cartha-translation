  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: ar
  text: لأنه إن رآك أحد، أنت الذي لك معرفة، متكئًا للطعام في معبد وثن، أفلا يُبنى ضميره، وهو ضعيف، حتى يأكل ما ذُبح للأوثان؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أفلا يتشجّع ضميره، وهو ضعيف، على الأكل؟». يقول اليوناني حرفيًا: «يُبنى»، مستعملًا لغة بولس المعتادة عن البنيان، ويُحتمل أن في ذلك مفارقة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: لأنه
  rationale: تربط الآية بما قبلها بوصفها تعليلًا أو مثالًا يشرح التحذير السابق.
- source_word: τις
  choice: أحد
  rationale: تحفظ دلالة المفرد النكرة والطابع الافتراضي للشرط بصياغة عربية طبيعية.
- source_word: ἴδῃ
  choice: رآك
  rationale: صيغة الماضي بعد «إن» مناسبة في العربية للتعبير عن الشرط المحتمل، وتقابل تركيب ἐὰν مع صيغة الالتزام.
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: أنت الذي لك معرفة
  rationale: تحفظ توجيه الكلام إلى المخاطب ووصفه بأنه صاحب معرفة، مع إبقاء «المعرفة» مصطلحًا محوريًا في سياق الأصحاح.
- source_word: ἐν εἰδωλείῳ
  choice: في معبد وثن
  rationale: ينقل المكان التعبدي المرتبط بالوثن دون توسيع تفسيري.
- source_word: κατακείμενον
  choice: متكئًا للطعام
  rationale: يحفظ صورة الاتكاء الحرفية، ويبيّن في الوقت نفسه أن المقصود هو الاتكاء عند تناول الطعام.
- source_word: οὐχὶ
  choice: أفلا
  rationale: تؤدي الاستفهام الإنكاري الذي يتوقع جوابًا بالإيجاب وتحافظ على قوة الحجة.
- source_word: ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος
  choice: ضميره، وهو ضعيف
  rationale: ينسب الضعف إلى الشخص وضميره في هذا السياق بصياغة عربية موجزة، من غير إزالة العلاقة التركيبية المحتملة.
- source_word: οἰκοδομηθήσεται
  choice: يُبنى
  rationale: يحفظ استعارة البناء المعتادة عند بولس والمفارقة المحتملة هنا، بدل استبدالها مباشرةً بتفسير مثل «يتشجع».
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: على أكل ما ذُبح للأوثان
  rationale: ينقل اتجاه النتيجة إلى الأكل، ويعبّر بوضوح عن الأطعمة المقدمة ذبائح للأوثان.
theological_decisions:
- issue: معنى οἰκοδομηθήσεται في سياق يؤدي فيه الاقتداء إلى فعل ضار
  choice: يُبنى
  alternative: يتجرأ أو يتشجع
  rationale: اللفظ اليوناني هو لفظ البناء والتقوية الذي يستخدمه بولس عادةً، ويبدو هنا ذا مفارقة مقصودة. إبقاء الاستعارة يحفظ التوتر البلاغي، مع توضيح المعنى السياقي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «متكئًا للطعام» للجمع بين الصورة التاريخية والوضوح، وحُفظت استعارة «يُبنى» رغم غرابتها النسبية لأنها مقصودة بلاغيًا في الأصل. وُضع مؤشر الحاشية بعد الجملة التي تشرحها.
