base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: ar
  text: فإن الضعيف يهلك[a] بمعرفتك—الأخ[b] الذي مات المسيح[c] لأجله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة الفعل: «يُدمَّر» أو «يتعرض للخراب». وقد يدل اللفظ اليوناني على خراب أو هلاك شديد، من غير أن يحسم هنا هل المقصود ضررًا روحيًا حاضرًا أم هلاكًا أخرويًا أم كليهما.'
    reason: alternative_reading
  - marker: b
    text: «الأخ» هنا هو الأخ في الإيمان؛ وقد يشمل التطبيق أخًا أو أختًا في الإيمان.
    reason: lexical_alternative
  - marker: c
    text: اللفظ اليوناني Χριστός لقب معناه «المسيح».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: يهلك
  rationale: فعل مضارع يحافظ على قوة معنى الهلاك أو الدمار من غير أن يحسم هل المقصود خراب روحي حاضر أم هلاك أخروي أم كلاهما.
- source_word: γάρ
  choice: فإن
  rationale: تربط الآية بما قبلها بوصفها تعليلًا وتحافظ على سلاسة الأسلوب العربي.
- source_word: ὁ ἀσθενῶν
  choice: الضعيف
  rationale: 'ينقل اسم الفاعل المستعمل استعمال الاسم: الشخص الذي هو ضعيف، من غير إدخال لفظ «الأخ» قبل موضعه في النص اليوناني.'
- source_word: ἐν τῇ σῇ γνώσει
  choice: بمعرفتك
  rationale: الباء تعبّر طبيعيًا عن الوسيلة أو السبب المرتبط باستعمال المخاطب لمعرفته، وتحافظ على المفارقة في أن المعرفة المزعومة تصير أداة أذى.
- source_word: ὁ ἀδελφός
  choice: ذلك الأخ
  rationale: يحافظ على المفرد المذكر وعلى علاقة البدل أو التوضيح بين «الضعيف» و«الأخ»، مع بيان المعنى الإيماني الجامع في الحاشية.
- source_word: δι’ ὃν
  choice: لأجله
  rationale: صياغة عربية طبيعية تدل على أن هذا الأخ هو الذي مات المسيح من أجله.
- source_word: Χριστός
  choice: المسيح
  rationale: ينقل اللقب اليوناني بمعناه المعروف في العربية، بدل معاملته على أنه مجرد اسم علم.
- source_word: ἀπέθανεν
  choice: مات
  rationale: ماضٍ بسيط مباشر يوافق الفعل اليوناني في السياق.
theological_decisions:
- issue: هل يدل ἀπόλλυται حتمًا على الهلاك الأبدي؟
  choice: يهلك
  alternative: يُدمَّر؛ يتعرض للخراب
  rationale: «يهلك» يحافظ على شدة اللفظ اليوناني وعلى توتره الدلالي، من غير إضافة قيد يحصره في ضرر زمني أو في دينونة أخروية.
- issue: هل يُصاغ ἀδελφός بصيغة محايدة جندريًا؟
  choice: الأخ
  alternative: المؤمن الآخر؛ الأخ أو الأخت
  rationale: يحافظ المتن على المفرد المذكر الوارد في المصدر، وتوضح الحاشية أن المقصود أخ في الإيمان وأن التطبيق يشمل المؤمنين والمؤمنات.
- issue: هل يُفهم Χριστός اسمًا أم لقبًا؟
  choice: المسيح
  alternative: —
  rationale: اللفظ هنا يحمل دلالته اللقبية، ولا سيما في العبارة التي تشير إلى موته من أجل الأخ.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت الشرطة لإظهار البدل التوضيحي في النص اليوناني، مع إبقاء الجملة موجزة وقوية.
