  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: ar
  text: إنْ ظنَّ أحدٌ أنه يعرف شيئًا[a]، فهو لم يعرف بعدُ كما ينبغي أن يعرف.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إنْ ظنَّ أحدٌ أنه قد عرف شيئًا، فهو لم يعرف بعدُ بالطريقة التي ينبغي أن يعرف بها».'
    reason: بديل معجمي وصرفي يُظهر بصورة أوضح دلالة صيغة التمام في ἐγνωκέναι ودلالة الطريقة في καθὼς.
lexical_decisions:
- source_word: εἴ τις
  choice: إنْ ظنَّ أحدٌ
  rationale: تحافظ «إنْ» على الشرط، وتنقل «أحد» دلالة الضمير النكرة العامة من غير حصرها في الذكور.
- source_word: δοκεῖ
  choice: ظنَّ
  rationale: يدل الفعل هنا على تقدير المرء لنفسه واعتقاده، لا على مجرد الظهور؛ و«ظنَّ» عربية طبيعية في هذا التركيب.
- source_word: ἐγνωκέναι τι
  choice: أنه يعرف شيئًا
  rationale: ينقل المضارع العربي حالة المعرفة الناتجة التي يفيدها المصدر التام، مع إبقاء «شيئًا» نكرة كما في اليونانية.
- source_word: οὔπω ἔγνω
  choice: فهو لم يعرف بعدُ
  rationale: تحفظ العبارة معنى عدم بلوغ المعرفة المطلوبة إلى الآن، كما تحافظ صيغة الماضي على التغاير الصرفي بين ἐγνωκέναι وἔγνω من غير تكلف.
- source_word: καθὼς δεῖ γνῶναι
  choice: كما ينبغي أن يعرف
  rationale: تنقل «كما» معيار المعرفة أو طريقتها، ويؤدي «ينبغي» القوة المعيارية لـ δεῖ بوضوح ووقار.
theological_decisions:
- issue: عموم الإشارة إلى الشخص
  choice: أحدٌ ... فهو ... يعرف
  alternative: مَن ... فإنه ... يعرف
  rationale: الضمير اليوناني τις مفرد عام، والصياغة العربية تبقي الإفراد والعموم من غير دلالة على أن المقصود ذكر دون أنثى.
- issue: طبيعة نقد بولس للمعرفة
  choice: لم يعرف بعدُ كما ينبغي أن يعرف
  alternative: لا يعرف شيئًا على الإطلاق
  rationale: النص ينتقد ادعاء اكتمال المعرفة أو طريقتها الناقصة، ولا ينفي كل معرفة؛ لذلك حُفظ التوتر بين وجود معرفة مزعومة وعدم بلوغ المعرفة كما ينبغي.
- issue: دلالة صيغ γινώσκω
  choice: يعرف ... لم يعرف ... يعرف
  alternative: قد عرف ... لم يتعرّف ... يعرف
  rationale: اختيرت صياغة عربية طبيعية مع إبقاء إمكان فهم المعرفة بوصفها حالة أو بلوغًا لها في الحاشية، من غير فرض تمييز لاهوتي لا يحسمه السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «بعدُ» بالضم بمعنى «إلى الآن»، وحُفظ التكرار المقصود لجذر المعرفة كما في الأصل.
