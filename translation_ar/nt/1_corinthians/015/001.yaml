lexical_decisions:
- source_word: Γνωρίζω
  choice: أُعرِّفكم
  rationale: 'ينقل المعنى المباشر للفعل في المضارع: أُعلِمكم أو أُعرِّفكم، من غير تحويله إلى «أُذكِّركم»، إذ ليس هذا هو الفعل اليوناني المعتاد للتذكير.'
- source_word: δὲ
  choice: الواو في «وأُعرِّفكم»
  rationale: أداة انتقال خفيفة لا تقتضي تعارضًا قويًا؛ الواو العربية تؤدي الانتقال طبيعيًا من السياق السابق من غير إضافة ظرف زمني مثل «الآن».
- source_word: ἀδελφοί
  choice: أيها الإخوة[a]
  rationale: يحافظ على صيغة النداء المذكرة في النص، مع بيان شمول الخطاب لجماعة المؤمنين في الحاشية.
- source_word: τὸ εὐαγγέλιον
  choice: البشارة
  rationale: لفظ عربي واضح ودال على الخبر السار، وهو طبيعي في السياق المسيحي من غير أن يفقد المعنى المعجمي للكلمة.
- source_word: εὐηγγελισάμην
  choice: بشَّرتكم بها
  rationale: يحافظ على الصلة اللفظية والدلالية مع «البشارة»، ويعبّر عن إعلانها لهم بوصفها خبرًا سارًا.
- source_word: παρελάβετε
  choice: قبلتموها
  rationale: يدل هنا على تلقي الرسالة وتسلمها؛ «قبلتموها» عربية طبيعية، ولا يلزم منها تحميل الفعل معنى ذاتيًا يتجاوز السياق.
- source_word: ἐν ᾧ
  choice: التي ... فيها
  rationale: يحافظ على دلالة ἐν المكانية المجازية، إذ تُصوَّر البشارة مجالًا يثبتون فيه، ولا يستبق معنى الآية التالية بترجمتها «بها».
- source_word: ἑστήκατε
  choice: تثبتون
  rationale: يعبّر عن الحالة الراهنة الناتجة من فعل سابق التي تفيدها صيغة التام، ويحمل معنى الوقوف بثبات في عربية طبيعية.
theological_decisions:
- issue: دلالة ἀδελφοί عند مخاطبة جماعة قد تضم رجالًا ونساءً
  choice: «أيها الإخوة» في المتن مع حاشية توضيحية
  alternative: «أيها الإخوة والأخوات»
  rationale: يحفظ المتن الصيغة المذكرة الظاهرة في اليونانية، بينما توضّح الحاشية أن الاستعمال الرسولي كثيرًا ما يشمل جماعة المؤمنين كلها.
- issue: طبيعة الثبات في البشارة في ἐν ᾧ καὶ ἑστήκατε
  choice: «والتي تثبتون فيها أيضًا»
  alternative: «وبها تقومون» أو «وعليها تثبتون»
  rationale: تبقي الترجمة صورة «في» كما في اليونانية، ولا تحسم هل المراد المجال أم الأساس بصياغة تفسيرية أضيق.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «البشارة/بشَّرتكم» للمحافظة على الصلة الاشتقاقية في الأصل، وحُفظ تكرار «أيضًا» والبنية النسبية بقدر تسمح به سلاسة العربية.
