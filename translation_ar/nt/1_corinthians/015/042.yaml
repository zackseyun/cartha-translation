source:
  edition: SBLGNT
  text: Οὕτως καὶ ἡ ἀνάστασις τῶν νεκρῶν. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: ar
  text: 'وهكذا أيضًا قيامة الأموات: يُزرع في فساد[a]، ويُقام في عدم فساد.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في قابلية للفناء... في عدم قابلية للفناء».'
    reason: بديل معجمي يوضح أن φθορά وἀφθαρσία تدلان هنا على قابلية الفناء وعدمها، مع أن «فساد/عدم فساد» يحافظان بصورة أوضح على التضاد اللفظي في الأصل.
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: وهكذا أيضًا
  rationale: تنقل القوة المقارِنة والاستنتاجية التي تصل قيامة الأموات بتشبيه البذرة في السياق السابق، بصياغة عربية موجزة وطبيعية.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: قيامة الأموات
  rationale: ترجمة مباشرة ودقيقة للتركيب اليوناني، وتحافظ على تركيز السياق في قيامة الموتى دون تحويله إلى «القيامة من بين الأموات»، وهو تركيب يغيّر العلاقة النحوية قليلًا.
- source_word: σπείρεται
  choice: يُزرع
  rationale: يحافظ على المبني للمجهول وعلى صورة زرع البذرة، ويوازي «يُقام» في الشطر التالي من غير إضافة تفسيرية مثل «يُدفن الجسد».
- source_word: ἐν φθορᾷ
  choice: في فساد
  rationale: يحافظ على الاسم المجرّد وعلى التضاد اللفظي المباشر مع «عدم فساد». والمراد في السياق قابلية الجسد للفساد والفناء، لذلك تُذكر الصياغة التفسيرية الأوضح في الحاشية.
- source_word: ἐγείρεται
  choice: يُقام
  rationale: يبقي الفعل مبنيًّا للمجهول، فيدل على أن الميت يُقام ولا يقيم نفسه، ويلائم استعمال الفعل في سياق القيامة.
- source_word: ἐν ἀφθαρσίᾳ
  choice: في عدم فساد
  rationale: ينقل نفي الفساد ويحافظ على المقابلة المتوازية مع «في فساد»، من غير تضييق الدلالة على مجرد عدم التحلل الجسدي.
theological_decisions:
- issue: طبيعة القيامة في مقابلة الزرع والإقامة
  choice: الإبقاء على استعارة الزرع وعلى الفعلين المبنيين للمجهول، من غير استبدالهما بعبارة تفسيرية مثل «يُدفن الجسد ويُبعث غير فانٍ».
  alternative: التصريح بالجسد والدفن، أو تفسير المقابلة تفسيرًا روحيًا أو أخلاقيًا محضًا.
  rationale: السياق يدافع عن قيامة الموتى مستخدمًا صورة البذرة ليجمع بين الاستمرار والتحول. والنص اليوناني لا يذكر «الجسد» صراحة في هذه الجملة، لذلك تحافظ الترجمة على إيجازه وتوتره الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُخدم «وهكذا أيضًا» للربط بالسياق السابق، وحُفظ التوازي الإيقاعي بين «يُزرع» و«يُقام» وبين «فساد» و«عدم فساد».
