  text: ἔπειτα ὤφθη Ἰακώβῳ, εἶτα τοῖς ἀποστόλοις πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/007.yaml
  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: ar
  text: ثم ظهر ليعقوب[a]، ثم لجميع الرسل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحرفية أكبر: «ثم شوهد من يعقوب... ومن جميع الرسل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: ثم
  rationale: ظرف زمني يدل على تعاقب أحداث الظهور، و«ثم» تعبير عربي طبيعي يحفظ هذا التسلسل.
- source_word: ὤφθη
  choice: ظهر
  rationale: صيغة ماضٍ مبني للمجهول من ὁράω تُستعمل اصطلاحيًا في أخبار الظهور بعد القيامة. «ظهر» أوضح وأفصح في العربية من النقل الحرفي «شوهد»، مع بيان البديل الحرفي في الحاشية.
- source_word: Ἰακώβῳ
  choice: ليعقوب
  rationale: اسم في حالة المجرور الدالة هنا على من حدث له الظهور؛ واللام تؤدي معنى الداتيف بصورة طبيعية.
- source_word: εἶτα
  choice: ثم
  rationale: ظرف تسلسلي ثانٍ؛ وتكرار «ثم» يحفظ أسلوب بولس القائم على تعداد الأحداث المتعاقبة.
- source_word: ἀποστόλοις
  choice: الرسل
  rationale: يشير السياق إلى شهود معروفين بوصفهم رسلًا، لا إلى مجرد مبعوثين؛ لذلك يحفظ «الرسل» المعنى الاصطلاحي.
- source_word: πᾶσιν
  choice: جميع
  rationale: تؤكد الكلمة شمول جماعة الرسل، و«جميع الرسل» نقل مباشر وطبيعي.
theological_decisions:
- issue: هوية «جميع الرسل» ونطاقها بالنسبة إلى يعقوب
  choice: إبقاء العبارة «جميع الرسل» من غير تحديد أفراد الجماعة أو تضييق نطاقها.
  alternative: اعتبارهم الاثني عشر تحديدًا، أو جماعة أوسع من الشهود المكلَّفين تختلف عن الاثني عشر.
  rationale: النص اليوناني لا يحدد بدقة أعضاء هذه الجماعة. لذلك تحافظ الترجمة على صياغته وعلى التمييز بين الظهور ليعقوب والظهور اللاحق لجميع الرسل، من غير فرض توفيق تفسيري.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموجزة وذات نبرة كتابية كريمة. استُعمل «ظهر» بوصفه التعبير العربي الطبيعي للظهورات، مع حفظ الصيغة الأقرب إلى الحرفية في الحاشية.
