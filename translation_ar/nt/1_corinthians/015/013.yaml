translation:
  language: ar
  text: 'ولكن إن لم تكن هناك قيامة الأموات، فحتى المسيح لم يُقَم.[a]


    [a] أو: «لم يَقُم». والصيغة اليونانية مبنية للمجهول: «لم يُقَم»، وقد تلمّح إلى أن الله هو الذي أقامه من غير أن تذكر الفاعل صراحةً.'
  philosophy: optimal-equivalence
  footnotes:
