lexical_decisions:
- source_word: εἰ δὲ
  choice: ولكن إن
  rationale: تحفظ أداة الشرط والتحول الاستدلالي الخفيف الذي تدل عليه δέ، بصياغة عربية واضحة.
- source_word: ἀνάστασις νεκρῶν
  choice: قيامة للأموات
  rationale: تنقل العبارة بوصفها إنكارًا لوجود قيامة تخص الأموات عمومًا، من غير تحويل المضاف إليه إلى معنى المصدر «من بين الأموات».
- source_word: οὐκ ἔστιν
  choice: لم تكن هناك
  rationale: تؤدي النفي الوجودي في جملة الشرط بأسلوب عربي طبيعي.
- source_word: οὐδὲ
  choice: فحتى ... لم
  rationale: تُظهر نتيجة الشرط وقوة «ولا حتى» في سياق حجة بولس.
- source_word: Χριστὸς
  choice: المسيح
  rationale: «المسيح» ترجمة عربية مستقرة للقب اليوناني Χριστός وتحفظ معناه اللقبي.
- source_word: ἐγήγερται
  choice: لم يُقَم
  rationale: تحفظ البناء للمجهول، كما تنقل الحالة الناتجة عن فعل الإقامة، من غير التصريح بالفاعل المحذوف في اليونانية.
theological_decisions:
- issue: البناء للمجهول في ἐγήγερται
  choice: لم يُقَم
  alternative: لم يَقُم
  rationale: الصيغة المختارة تحافظ على كون القيامة فعلًا واقعًا على المسيح، وقد توحي بعمل الله من غير إضافته صراحةً إلى النص.
- issue: دلالة Χριστός
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الطبيعي والمفهوم للقب، ويحفظ دلالته بوصفه الممسوح من غير معاملته كاسم منقول صوتيًا.
