  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: ar
  text: لذلك، يا إخوتي الأحباء[a]، كونوا راسخين غير متزعزعين، مكثرين دائمًا في عمل الرب، عالمين أن تعبكم في الرب ليس باطلًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن يشير اللفظ اليوناني المترجم «إخوتي» إلى جماعة المؤمنين كلها، بمن فيهم النساء، بحسب السياق.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: لذلك
  rationale: أداة استنتاج تربط الوصية بحجة القيامة السابقة، و«لذلك» تحفظ قوتها المنطقية بعبارة عربية طبيعية.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: يا إخوتي الأحباء
  rationale: تحفظ صيغة الجمع المذكر ولفظ المحبة، مع بيان شمول الخطاب للمؤمنات بحسب السياق في الحاشية.
- source_word: ἑδραῖοι γίνεσθε
  choice: كونوا راسخين
  rationale: «راسخين» تنقل معنى الثبات والاستقرار. وصيغة «كونوا» هي الأسلس عربيًا في الأمر بالحالة، من غير تحميل γίνεσθε معنى تطور زمني غير لازم في السياق.
- source_word: ἀμετακίνητοι
  choice: غير متزعزعين
  rationale: تنقل معنى عدم الإزاحة عن الموقف، وتأتي طبيعية مع «راسخين» من دون إيهام الجمود الحرفي.
- source_word: περισσεύοντες
  choice: مكثرين
  rationale: تحفظ معنى الزيادة والوفرة المستمرة في العمل، لا مجرد الجودة أو التفوق.
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου
  choice: في عمل الرب
  rationale: صياغة واسعة تحافظ على إضافة العمل إلى الرب من غير قصره على خدمة كنسية بعينها.
- source_word: πάντοτε
  choice: دائمًا
  rationale: مقابل عربي مباشر وطبيعي يفيد الاستمرار في كل حين.
- source_word: εἰδότες
  choice: عالمين
  rationale: يحافظ على الصلة الحالية دون أن يحسم صراحة هل دلالتها سببية أو مصاحبة.
- source_word: ὁ κόπος ὑμῶν
  choice: تعبكم
  rationale: κόπος يدل على الجهد الشاق المصحوب بالكلال؛ و«تعبكم» يحفظ هذه القوة أكثر من «عملكم».
- source_word: οὐκ ἔστιν κενὸς
  choice: ليس باطلًا
  rationale: تعبير عربي موجز يفيد أن الجهد غير عديم الجدوى أو الثمر، وهو أنسب سياقيًا من النقل الحرفي «فارغًا».
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحفظ العبارة البولسية واتساعها الدلالي من غير تضييقها إلى «بسبب الرب» أو توسيعها تفسيريًا إلى «في الاتحاد بالرب».
theological_decisions:
- issue: مرجع ἀδελφοί من جهة الجنس
  choice: «إخوتي» في المتن مع بيان الشمول السياقي في الحاشية.
  alternative: «إخوتي وأخواتي»
  rationale: اللفظ اليوناني جمع مذكر، لكنه في خطاب الكنيسة قد يشمل المؤمنين والمؤمنات. يحفظ المتن الصيغة ويبيّن الحاشية نطاقها المقصود.
- issue: تعلّق ἐν κυρίῳ في ختام الآية
  choice: «تعبكم في الرب ليس باطلًا»، بحيث تصف العبارة التعب الواقع في الرب.
  alternative: «تعبكم ليس باطلًا بسبب الرب»
  rationale: الأقرب أنها تحدد مجال تعب المؤمنين وصلته بالرب، مع إبقاء الاتساع اللاهوتي للتعبير البولسي وعدم تحويله إلى تعليل صريح.
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: «الرب» المقابل العربي الراسخ في هذا السياق المسيحاني، ولا توجد قرينة تستلزم العدول عنه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت تراكيب مألوفة مثل «راسخين غير متزعزعين» و«ليس باطلًا»، مع الحفاظ على التوازي الإيقاعي والتعبيرات البولسية المفتوحة دلاليًا.
