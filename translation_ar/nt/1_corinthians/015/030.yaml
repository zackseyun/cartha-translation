  text: Why are we also in danger every hour?[a]
translation:
  language: ar
  text: فلماذا نكون نحن أيضًا في خطر كلَّ ساعة؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، أقرب إلى اللفظ: «وما أيضًا بشأن كوننا نحن في خطر كلَّ ساعة؟» ويمكن أن تُترجم τί بـ«ما»، لكن السياق يجعل السؤال البلاغي بمعنى: «فلماذا نكون نحن أيضًا في خطر كلَّ ساعة؟»'
    reason: بديل لفظي يبيّن إمكان ترجمة τί بـ«ما» ويحفظ القوة السياقية للاستفهام من غير إضافة علاقة سببية.
lexical_decisions:
- source_word: τί
  choice: فلماذا
  rationale: تأتي τί هنا في سؤال بلاغي عن الغاية أو السبب ضمن حجة بولس، و«فلماذا» تنقل هذه القوة السياقية، مع وصل السؤال بما قبله.
- source_word: καὶ
  choice: أيضًا
  rationale: تفيد الإضافة، إذ يضم بولس نفسه ورفقاءه إلى الأمثلة السابقة.
- source_word: ἡμεῖς
  choice: نحن
  rationale: أُثبت الضمير الصريح للمحافظة على بروزه في اليونانية، ووُضع بعد الفعل على نحو طبيعي في العربية.
- source_word: κινδυνεύομεν
  choice: نُعرِّض أنفسنا للخطر
  rationale: ينقل معنى الوقوع في الخطر أو مجابهته، ويلائم كون السؤال عن جدوى قبول الرسل لهذا الخطر؛ لكنه لا يضيف تحديدًا بأن الخطر هو الموت حصرًا.
- source_word: πᾶσαν ὥραν
  choice: كلَّ ساعة
  rationale: يحافظ على الصورة الزمنية اليونانية الدالة على التعرض المستمر للخطر، وهو تعبير عربي واضح وطبيعي.
theological_decisions:
- issue: القوة البلاغية في سياق حجة القيامة
  choice: صيغت الآية سؤالًا بلاغيًا عن جدوى تعرّض الرسل المستمر للخطر إن لم تكن قيامة.
  alternative: وما الذي يجعلنا نحن أيضًا في خطر كل ساعة؟
  rationale: السياق والتركيب يدعمان معنى «لماذا» من غير أن يُحسم في الترجمة أكثر مما تقتضيه حجة بولس أو تُضاف دعوى عقائدية غير مصرّح بها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «نُعرِّض أنفسنا للخطر» لتوضيح قبول الخطر في سياق السؤال البلاغي، مع إبقاء «كل ساعة» حفاظًا على صورة الأصل.
