base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: ar
  text: الإنسان الأول من الأرض، ترابيّ؛ والإنسان الثاني من السماء.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτος
  choice: الأول
  rationale: يحفظ ترتيب طرفي المقابلة بين آدم والمسيح بصياغة عربية طبيعية.
- source_word: ἄνθρωπος
  choice: الإنسان
  rationale: المفرد هنا يشير تمثيليًا إلى آدم ثم إلى المسيح، و«الإنسان» يحفظ الدلالة البشرية والتوازي المقصود.
- source_word: ἐκ γῆς
  choice: من الأرض
  rationale: ينقل دلالة المصدر والمنشأ، ويحافظ على صدى رواية خلق آدم.
- source_word: χοϊκός
  choice: ترابيّ
  rationale: صفة موجزة تقابل الأصل اليوناني وتحمل معنى المنتمي إلى التراب أو المصنوع منه، مع إبقاء الصلة اللفظية بالأرض والتراب.
- source_word: δεύτερος
  choice: الثاني
  rationale: يحفظ المقابلة الصريحة مع «الأول».
- source_word: ἐξ οὐρανοῦ
  choice: من السماء
  rationale: ينقل المنشأ السماوي دون اختزاله إلى معنى السماء المرئية.
theological_decisions:
- issue: الدلالة المسيحانية لعبارة «الإنسان الثاني»
  choice: الإبقاء على «الإنسان الثاني» من غير إضافة اسم المسيح
  alternative: الإنسان الثاني، المسيح، من السماء
  rationale: السياق يحدد المقصود، لكن النص اليوناني لا يذكر اسم المسيح في هذه الآية؛ لذلك لا تُضاف عبارة تفسيرية.
- issue: زمن الجملة الثانية مع غياب فعل الكينونة في اليونانية
  choice: 'صياغة اسمية: «الإنسان الثاني من السماء»'
  alternative: الإنسان الثاني هو من السماء / كان من السماء
  rationale: الجملة الاسمية العربية طبيعية وتحفظ غياب الرابط الصريح في الأصل، كما لا تفرض زمنًا لم يصرّح به النص.
- issue: العلاقة بين ἐκ γῆς وχοϊκός
  choice: «من الأرض، ترابيّ» بوصفهما تعبيري منشأ ووصف متعاقبين
  alternative: «من الأرض، مصنوع من التراب»
  rationale: يحفظ التركيب الموجز والتوتر الدلالي في الأصل بين المنشأ الأرضي والصفة الترابية، دون دمجهما في تفسير واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. حُفظ التوازي البلاغي بين «الإنسان الأول» و«الإنسان الثاني»، واستُعملت الجملة الاسمية الملائمة للعربية ولإيجاز الأصل.
