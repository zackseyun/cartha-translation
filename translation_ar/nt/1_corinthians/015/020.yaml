  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: ar
  text: أَمَّا الآنَ، فَقَدْ أُقِيمَ الْمَسِيحُ مِنْ بَيْنِ الْأَمْوَاتِ، بَاكُورَةَ الرَّاقِدِينَ[a].
  philosophy: optimal-equivalence
  footnotes:
