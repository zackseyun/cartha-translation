    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: أَمَّا الآنَ
  rationale: تنقل التحول الاستدراكي القوي من افتراض عدم القيامة في السياق السابق إلى تقرير واقع قيامة المسيح.
- source_word: Χριστὸς
  choice: الْمَسِيحُ
  rationale: ترجمة للقب اليوناني لا مجرد نقل صوتي له، وهو ملائم للسياق اللاهوتي والتمثيلي هنا.
- source_word: ἐγήγερται
  choice: فَقَدْ أُقِيمَ
  rationale: تحافظ صيغة المبني للمجهول مع «قد» على كون الفعل تامًّا ذا نتيجة باقية، من غير التصريح بالفاعل الذي لم يذكره النص.
- source_word: ἐκ νεκρῶν
  choice: مِنْ بَيْنِ الْأَمْوَاتِ
  rationale: تُظهر أن القيامة إخراج من جماعة الموتى، مع بقاء العبارة عربية واضحة وطبيعية.
- source_word: ἀπαρχὴ
  choice: بَاكُورَةَ
  rationale: تحفظ صورة أول ما يُجنى من الحصاد، بما فيها معنى الأولوية واستباق الحصاد الآتي.
- source_word: τῶν κεκοιμημένων
  choice: الرَّاقِدِينَ
  rationale: تحافظ على استعارة النوم للموت الملائمة لسياق القيامة، بدل تسويتها إلى «الذين ماتوا».
theological_decisions:
- issue: صيغة القيامة والفاعل
  choice: أُقِيمَ
  alternative: قامَ
  rationale: المبني للمجهول يطابق الصيغة اليونانية ويحفظ الإيحاء بعمل الله من غير إضافة فاعل صريح.
- issue: ترجمة اللقب Χριστός
  choice: الْمَسِيحُ
  alternative: كريستوس/المسيح بوصفه اسمًا مجردًا
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب، ويحفظ دلالته المسيانية في هذا السياق.
- issue: استعارة النوم للموت
  choice: الرَّاقِدِينَ
  alternative: الذين ماتوا
  rationale: الإبقاء على الاستعارة يصون صلة العبارة برجاء القيامة ولا يفسر المجاز داخل المتن.
translation_notes:
  register: عربية فصحى واضحة وموقرة. استُعمل «أما الآن» لإبراز الانتقال الحجاجي، و«باكورة» للمصطلح الزراعي ذي الدلالة التمثيلية. أُثبتت علامة الحاشية [a] في المتن.
