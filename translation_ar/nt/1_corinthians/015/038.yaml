  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: ar
  text: أَمَّا اللهُ فَيُعْطِيهِ جَسَدًا كَمَا شَاءَ، وَلِكُلِّ بَذْرَةٍ جَسَدُهَا الْخَاصُّ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ولكلِّ واحدةٍ من البذور جسدُها الخاص». والنص اليوناني يقول حرفيًّا: «ولكلِّ واحدٍ من البذور جسدٌ خاصّ»، وقد يُستعمل هذا التركيب بمعنى التوزيع على كل بذرة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίδωσιν
  choice: يُعطيه / يُعطي
  rationale: الفعل المضارع «يُعطي» ينقل الزمن والصورة الزراعية مباشرة، وتكراره في العربية يوضح تعلّق الفعل بكل من المفعولين من غير تغيير المعنى.
- source_word: αὐτῷ
  choice: ـه في «يُعطيه»
  rationale: ضمير المفرد يعود إلى ما زُرع في السياق السابق، وصيغة «يُعطيه جسمًا» عربية طبيعية وتحفظ دلالة المفعول غير المباشر.
- source_word: σῶμα
  choice: جسمًا
  rationale: «جسم» هو المقابل المباشر لـσῶμα، ويحفظ الصلة اللفظية بموضوع الأجسام والقيامة في الإصحاح.
- source_word: καθὼς ἠθέλησεν
  choice: كما شاء
  rationale: تعبير عربي موجز وطبيعي يدل على إرادة الله واختياره، ويحافظ على صيغة الماضي في اليونانية دون إضافة تفسير عقدي.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: كلَّ واحدةٍ من البذور
  rationale: ينقل البنية التوزيعية مع المضاف إليه التبعيضي. استُعمل المؤنث مراعاةً لجنس «بذرة» المفرد المفهوم من «البذور».
- source_word: ἴδιον
  choice: جسمها الخاص
  rationale: يعبّر عن الجسم الذي يخص كل بذرة بعينها، من غير إدخال معنى «النوع» غير المصرح به.
theological_decisions:
- issue: فاعلية الله وإرادته في تشبيه البذرة والجسم
  choice: إبراز أن الله هو الذي يعطي الجسم وفق مشيئته، وأن لكل بذرة جسمًا يخصها.
  alternative: إضافة «لكل نوع من البذور» لتأكيد اختلاف الأنواع.
  rationale: النص يصرّح بفاعلية الله ومشيئته وبالتوزيع على البذور، لكنه لا يذكر لفظ «نوع»؛ لذلك تُحفظ دلالته من غير توسيع تفسيري.
translation_notes:
  register: عربية فصحى واضحة وموقرة. صيغت الجملة بفعلين متوازيين لتجنب ثقل حذف الفعل في العربية، مع الحفاظ على تكرار مفهوم العطاء الإلهي. وُضعت علامة الحاشية بعد الجملة التي تتعلق بها.
