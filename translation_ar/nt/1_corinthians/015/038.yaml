    rationale: رغم إمكانها من حيث المعنى، فإن «لكل بذرة» أوضح وأشيع، وتؤدي القوة التوزيعية لـἑκάστῳ من غير تغيير في المعنى.
  - severity: low
    issue: تكرار «ويعطي» ليس لازمًا في العربية.
    rationale: الأصل يذكر فعلًا واحدًا ثم يعطف «ولكل...»، وحذف الفعل الثاني في العربية يحاكي البنية ويحسن الإيجاز.
