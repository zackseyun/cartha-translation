review_pass:
  verdict: revise
  source_fidelity: 'المعنى الأساسي منقول بأمانة: الله هو الفاعل، ويمنح ما زُرع جسدًا بحسب مشيئته، ولكل بذرة جسد يخصها. لكن «كل واحدة من البذور» أقل سلاسة في العربية من الصياغة التوزيعية المباشرة «لكل بذرة»، ولا حاجة إلى تكرار فعل «يعطي» لأن العطف في الأصل اليوناني يصل شبه الجملة بالفعل الأول.'
  naturalness: التعديل يجعل العبارة أفصح وأوجز في العربية المعاصرة، ويزيل الثقل في «ويعطي كل واحدة من البذور». واختيار «جسد» أنسب في سياق 1 كورنثوس 15 ويحافظ على الترابط الاصطلاحي في حديث الرسول عن الجسد والقيامة.
  terminology: «جسد» مقابل مناسب لـσῶμα في هذا السياق، و«كما شاء» ينقل الإرادة الإلهية بلا تحميل تفسيري. «جسدها الخاص» يحفظ قوة ἴδιον، ولا يضيف مفهوم النوع أو الفصيلة.
  issues:
