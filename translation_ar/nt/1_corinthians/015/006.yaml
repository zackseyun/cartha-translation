  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: ar
  text: ثم ظهر لأكثر من خمسمئة من الإخوة معًا[a]، أكثرهم باقون إلى الآن، ولكن بعضهم قد رقدوا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «لأكثر من خمسمئة من الإخوة والأخوات معًا»؛ يقول اليوناني «إخوة»، وقد تُستعمل هذه الكلمة في الخطاب المسيحي المبكر للدلالة على جماعة المؤمنين الأوسع.
    reason: lexical_alternative
  - marker: b
    text: أي إنهم ماتوا. يستعمل بولس «رقدوا»، وهو تعبير مسيحي مبكر شائع عن الموت في ضوء رجاء القيامة.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: ثم
  rationale: تفيد التتابع في سرد ظهورات المسيح، وهي موجزة وطبيعية.
- source_word: ὤφθη
  choice: ظهر
  rationale: الصيغة المبنية للمجهول من ὁράω تُستعمل في سياق ظهورات القيامة بمعنى الظهور؛ والفاعل المفهوم من السياق السابق هو المسيح.
- source_word: ἐπάνω πεντακοσίοις
  choice: لأكثر من خمسمئة
  rationale: 'ἐπάνω مع العدد تفيد التجاوز: أكثر من.'
- source_word: ἀδελφοῖς
  choice: أخٍ
  rationale: حُفظت الصيغة المذكرة في الأصل، مع بيان احتمال شمولها جماعة المؤمنين الأوسع في الحاشية.
- source_word: ἐφάπαξ
  choice: معًا
  rationale: تفيد هنا أن الظهور للجماعة الكبيرة وقع لهم في وقت واحد، لا مجرد وقوعه مرة واحدة.
- source_word: οἱ πλείονες
  choice: أكثرهم
  rationale: صيغة المقارنة المستعملة اسميًا تعني الأكثرية، و«أكثرهم» عربية واضحة وطبيعية.
- source_word: μένουσιν ἕως ἄρτι
  choice: باقون إلى الآن
  rationale: تحفظ معنى الاستمرار حتى زمن كتابة بولس، مع بقاء دلالة أنهم أحياء مفهومة من المقابلة.
- source_word: τινὲς δὲ
  choice: ولكن بعضهم
  rationale: δέ تفيد مقابلة خفيفة بين الأكثرية الباقية والأقلية التي رقدت.
- source_word: ἐκοιμήθησαν
  choice: قد رقدوا
  rationale: يحفظ استعارة الرقاد للموت، وهي ذات صلة مباشرة برجاء القيامة في هذا الأصحاح.
theological_decisions:
- issue: دلالة ἀδελφοῖς على جماعة قد تكون مختلطة
  choice: أخٍ
  alternative: إخوة وأخوات
  rationale: يحفظ النص صيغة الأصل المذكرة ولا يحسم مدى شمول المرجع، بينما توضح الحاشية أن الاستعمال المسيحي المبكر قد يشمل عموم المؤمنين.
- issue: استعارة النوم في ἐκοιμήθησαν ضمن سياق القيامة
  choice: قد رقدوا
  alternative: قد ماتوا
  rationale: الإبقاء على الاستعارة يصون صياغة بولس وصلتها الموضوعية برجاء القيامة، مع شرح المقصود في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «خمسمئة» بالرسم المعاصر، وحُفظت استعارة الرقاد. وُضع «معًا» بعد المجموعة لتوضيح التزامن من غير إيهام أن المقصود مجرد «مرة واحدة».
