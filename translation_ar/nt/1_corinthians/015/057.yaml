  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: ar
  text: ولكن الشكر لله، الذي يمنحنا النصر بربنا يسوع المسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ولكن
  rationale: تفيد انتقالًا ذا مسحة تقابل مع الكلام السابق عن الموت والغلبة، و«لكن» العربية تنقل هذه الالتفاتة البلاغية بوضوح.
- source_word: χάρις
  choice: الشكر
  rationale: تأتي هنا في صيغة إسناد الشكر إلى الله، فلا يُراد بها «النعمة» في هذا السياق، بل عبارة حمد وشكر.
- source_word: τῷ θεῷ
  choice: لله
  rationale: الداتيف يحدد من يُوجَّه إليه الشكر، وتؤديه اللام العربية بصورة طبيعية.
- source_word: τῷ διδόντι
  choice: الذي يمنحنا
  rationale: اسم الفاعل اليوناني معرّف ويصف الله بأنه واهب النصر؛ و«يمنح» تحافظ على معنى العطاء المستمر أو العام بأسلوب عربي فصيح طبيعي.
- source_word: τὸ νῖκος
  choice: النصر
  rationale: يشير التعريف إلى النصر المحدد الذي سبق الحديث عنه، أي الغلبة على الموت؛ و«النصر» لفظ واضح وشائع في العربية المعاصرة.
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: بربنا
  rationale: تفيد διά مع المضاف إليه الواسطة أو الوسيلة. والباء هنا موجزة وطبيعية وتحافظ على هذا المعنى، مع نقل κύριος إلى اللقب المسياني المألوف «الرب».
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «يسوع» نقل للاسم، و«المسيح» ترجمة عربية راسخة للقب Χριστός وتحافظ على دلالته اللقبية من غير تحويله إلى مجرد اسم غير مفسَّر.
theological_decisions:
- issue: دلالة Χριστός في العبارة Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  alternative: يسوع الممسوح أو يسوع المشيح
  rationale: اختير «المسيح» لأنه المقابل العربي الراسخ للقب اليوناني الذي يعني الممسوح، وهو مفهوم بوصفه لقبًا في الاستعمال العربي الكتابي، بينما «الممسوح» حرفي لكنه غير طبيعي هنا، و«المشيح» نقل عن العبرية لا عن اللفظ اليوناني الوارد.
- issue: وساطة الرب يسوع في منح النصر
  choice: بربنا يسوع المسيح
  alternative: من خلال ربنا يسوع المسيح
  rationale: تحافظ الباء على معنى الوسيلة أو الوساطة في διά من دون حسم زائد لطبيعتها، كما أنها أفصح وأوجز من التعبير التفسيري «من خلال».
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة ومهيبة، تحافظ على نبرة الشكر وعلى التعريف في «النصر». لم تُضف حاشية لأن «المسيح» هو الترجمة العربية الطبيعية والراسخة للقب Χριστός، فلا توجد هنا قراءة بديلة لازمة لفهم النص.
