  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: ar
  text: ولكن متى أُخضِعت له الأشياء كلّها[a]، فحينئذ سيُخضَع الابن نفسه لِمَن أخضع له الأشياء كلّها، لكي يكون الله الكلَّ في الكل[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «كل شيء». يكرر اليوناني عبارة «الأشياء كلها» (τὰ πάντα)، بما يحفظ المدى الكوني لحجة بولس.'
    reason: lexical_alternative
  - marker: b
    text: 'ويجوز: «كلَّ شيء في الجميع». العبارة اليونانية موجزة، ويمكن نقلها بحرفية أكبر: «الأشياء كلها في الكل»؛ أما «الكل في الكل» فتحفظ إيجازها وقوتها البلاغية من غير تعيين مرجع «الكل» الأخير.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ولكن متى
  rationale: تنقل «متى» دلالة الجملة الزمنية، وتؤدي «لكن» وظيفة δέ الانتقالية ذات المقابلة الخفيفة في سياق الحجة السابقة.
- source_word: ὑποταγῇ / ὑποταγήσεται
  choice: أُخضِعت / سيُخضَع
  rationale: يحافظ الفعلان المبنيان للمجهول على صيغة ὑποτάσσω في الموضعين وعلى الترابط اللفظي بين خضوع الأشياء وخضوع الابن.
- source_word: τὰ πάντα
  choice: الأشياء كلّها
  rationale: تحفظ العبارة صيغة الجمع المحايد المتكررة واتساعها الكوني، بدل اختزالها في لفظ قد يُفهم على نحو أضيق.
- source_word: αὐτὸς ὁ υἱὸς
  choice: الابن نفسه
  rationale: تنقل «نفسه» توكيد αὐτός الواقع على الابن شخصيًا.
- source_word: τῷ ὑποτάξαντι
  choice: لِمَن أخضع
  rationale: صياغة عربية طبيعية تؤدي اسم الفاعل اليوناني المعرّف المستعمل استعمال الاسم، من غير إضافة هوية تفسيرية غير مصرّح بها في العبارة نفسها.
- source_word: ἵνα ᾖ
  choice: لكي يكون
  rationale: تحفظ دلالة الغاية أو النتيجة المقصودة التي تحملها ἵνα مع صيغة الالتزام.
- source_word: πάντα ἐν πᾶσιν
  choice: الكلَّ في الكل
  rationale: تحافظ على إيجاز العبارة البولسية وإيقاعها وشمولها، من غير حسم مرجع πᾶσιν في البشر وحدهم أو في الأشياء وحدها.
theological_decisions:
- issue: خضوع الابن للذي أخضع له الأشياء كلها
  choice: إثبات الخضوع بصيغة المبني للمجهول كما في اليونانية، من غير شرح عقائدي مضاف
  alternative: إعادة الصياغة بما ينفي كل معنى للخضوع، أو إضافة تمييز صريح بين الخضوع التدبيري والذاتي
  rationale: النص يصرح بخضوع الابن في تمام التسلسل الأخروي. تحافظ الترجمة على هذا التوتر ولا تستنتج منه تفاوتًا في الجوهر، كما لا تُدخل في المتن مصطلحات لاهوتية لاحقة.
- issue: مدى τὰ πάντα والعبارة πάντα ἐν πᾶσιν
  choice: الأشياء كلها؛ الكل في الكل
  alternative: كل شيء؛ كل شيء في الجميع
  rationale: التكرار الشامل جزء أساسي من حجة بولس، والصياغة المختارة تحفظ سعته وغموض العبارة الختامية الحقيقي من غير قصرها على الأشخاص أو الموجودات.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل البناء للمجهول في الفعلين للمحافظة على البنية اليونانية، وحُفظ تكرار «الأشياء كلها» والعبارة الختامية المكثفة. جميع علامات الحواشي [a] و[b] مثبتة في المتن.
