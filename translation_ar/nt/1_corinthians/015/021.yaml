  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ δι’ ἀνθρώπου ⸀θάνατος, καὶ δι’ ἀνθρώπου ἀνάστασις νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: ar
  text: فبما أن الموت جاء عن طريق إنسان[a][b]، جاءت قيامة الأموات أيضًا عن طريق إنسان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بإنسان» في العبارتين؛ فقد يدل حرف الجر اليوناني على الفاعلية كما يدل على الوساطة.'
    reason: lexical_alternative
  - marker: b
    text: يبين السياق أن الإنسانين هما آدم والمسيح (انظر 15:22، 45).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: فبما أن
  rationale: تحفظ الفاء الوظيفة التفسيرية لـγάρ، وتؤدي «بما أن» معنى التعليل والافتراض المقرر في ἐπειδή، بصياغة عربية واضحة.
- source_word: δι’ ἀνθρώπου
  choice: عن طريق إنسان
  rationale: تنقل διά مع المضاف إليه بوصفها دالة على الوساطة أو الفاعلية، وتحفظ نكرة المفرد والموازاة المقصودة بين الإنسانين.
- source_word: θάνατος
  choice: الموت جاء
  rationale: العبارة اليونانية اسمية بلا فعل مصرح به؛ أضيف «جاء» لسلامة العربية وللدلالة الطبيعية على دخول الموت، من غير تغيير الحجة.
- source_word: ἀνάστασις νεκρῶν
  choice: قيامة الأموات
  rationale: تعبير مباشر يحفظ معنى القيامة الفعلية للأموات في سياق الأصحاح، ولا يحوله إلى مفهوم عام عن الحياة بعد الموت.
- source_word: καὶ
  choice: أيضًا
  rationale: تبرز المقابلة المناظرة في الشطر الثاني وتحفظ التوازي بين مجيء الموت ومجيء قيامة الأموات.
- source_word: δι’ ἀνθρώπου
  choice: عن طريق إنسان
  rationale: تكررت الصياغة نفسها للمحافظة على التوازي اللفظي والحججي المتعمد بين الإنسان الذي جاء الموت عن طريقه والإنسان الذي جاءت القيامة عن طريقه.
theological_decisions:
- issue: المقابلة التمثيلية بين آدم والمسيح
  choice: الإبقاء على «إنسان» نكرة مفردة في الشطرين من غير تسمية الشخصين في المتن.
  alternative: عن طريق إنسان واحد... عن طريق إنسان واحد؛ أو عن طريق آدم... عن طريق المسيح.
  rationale: السياق القريب يحدد الشخصين، لكن الآية نفسها تصوغ المبدأ في موازاة موجزة. ولا يصرح النص هنا بالعدد «واحد» ولا بالاسمين.
- issue: طبيعة القيامة
  choice: ترجمة ἀνάστασις νεκρῶν بـ«قيامة الأموات».
  alternative: قيامة روحية؛ أو حياة بعد الموت.
  rationale: يناقش بولس في هذا السياق قيامة الأموات الحقيقية؛ لذلك تُحفظ العبارة الملموسة ولا تُخفف إلى تصور عام عن البقاء بعد الموت.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة وموقرة. استُعملت «فبما أن» لحفظ التعليل والربط التفسيري، وكُررت «عن طريق إنسان» للمحافظة على التوازي المقصود في الأصل.
