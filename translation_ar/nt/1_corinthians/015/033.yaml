lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: لا تضلّوا
  rationale: ينقل صيغة النهي مع إبقاء احتمال أن يكون الضلال ناشئًا من خداع النفس أو تأثير الآخرين، من غير تقييده بأحدهما.
- source_word: φθείρουσιν
  choice: تُفسد
  rationale: يفيد الفعل إحداث التلف أو التدهور، وهنا يناسبه الفساد الأخلاقي، كما يحافظ هذا اللفظ على إيجاز العبارة المَثَلية.
- source_word: ἤθη
  choice: الأخلاق
  rationale: يدل الجمع اليوناني هنا على السجايا والعادات الأخلاقية، و«الأخلاق» تعبير عربي طبيعي جامع لا يقتصر على آداب السلوك الاجتماعي.
- source_word: χρηστὰ
  choice: الحسنة
  rationale: ينقل المعنى الأخلاقي البسيط للصفة من غير إضافة دلالة تفسيرية زائدة.
- source_word: ὁμιλίαι
  choice: المعاشرات
  rationale: يمكن أن يدل اللفظ على المخالطة أو الحديث، لكن «المعاشرات» يلائم المعنى العلائقي الأوسع في سياق التحذير، مع إثبات احتمال الحديث في الحاشية.
- source_word: κακαί
  choice: الرديئة
  rationale: يصف المخالطات المؤذية أخلاقيًا بعبارة طبيعية، من غير المبالغة التي قد يوحي بها «الشريرة»، ومن غير تكرار جذر «تفسد».
