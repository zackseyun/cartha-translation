  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: ar
  text: لكن ليس الروحي أولًا[a]، بل الطبيعي[b]؛ ثم الروحي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليس الجسد الروحي أولًا... بل الجسد الطبيعي... ثم الجسد الروحي». يحذف بولس هنا كلمة «الجسد»، مع أنها مذكورة صراحة في السياق المحيط.'
    reason: alternative_reading
  - marker: b
    text: '«الطبيعي» ترجمة للكلمة اليونانية ψυχικόν، أي ما يتصل بالحياة البشرية المعتادة؛ ويمكن ترجمتها ترجمة حرفية أكثر: «النفساني».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον
  choice: أولًا
  rationale: استعمال ظرفي يبيّن ترتيب التعاقب، و«أولًا» أقرب مقابل عربي مباشر وطبيعي.
- source_word: πνευματικόν
  choice: الروحي
  rationale: صفة مفردة محايدة مع أداة التعريف، مستعملة استعمال الاسم. يحافظ «الروحي» على إيجاز اليونانية وعلى صلتها بالسياق، من غير إدخال كلمة «الجسد» التي لم ترد صراحة في هذه الآية.
- source_word: ψυχικόν
  choice: الطبيعي
  rationale: يدل هنا على ما ينتمي إلى الحياة الحية العادية، في مقابل ما هو روحي. «الطبيعي» واضح ولا يضيّق المعنى إلى المادي وحده ولا يضفي حكمًا أخلاقيًا غير لازم.
- source_word: ἔπειτα
  choice: ثم
  rationale: تفيد التعاقب اللاحق بوضوح وإيجاز في العربية.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: لكن ليس ... بل
  rationale: تنقل البنية التصحيحية التقابلية في اليونانية بصورة عربية فصيحة وطبيعية.
theological_decisions:
- issue: مدلول التقابل بين ψυχικόν وπνευματικόν
  choice: إبقاء التقابل بين «الطبيعي» و«الروحي» بوصفهما مرحلتين متعاقبتين في حجة بولس عن القيامة.
  alternative: التصريح بـ«الجسد الطبيعي» و«الجسد الروحي»، أو فهمهما على أنهما الشخص غير الروحي والشخص الروحي.
  rationale: السياق القريب يذكر الجسد الطبيعي والجسد الروحي، لكن الآية نفسها تحذف كلمة «جسد». لذلك تُحفظ الصفتان المستعملتان استعمال الاسم، فلا يُحصر القول فيما لم تصرّح به الآية، مع بقاء صلته بحجة القيامة واضحة.
