id: 1CO.15.52
reference: 1 Corinthians 15:52
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: ar
  text: في لحظة، في طرفة عين[a]، عند البوق الأخير. فسيُنفخ في البوق، ويُقام الموتى غير قابلين للفساد، ونحن سنُغيَّر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في لمح البصر». يدل التعبير اليوناني على سرعة خاطفة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: في لحظة
  rationale: تدل العبارة على نقطة زمنية بالغة القِصر؛ و«في لحظة» تنقل معناها الزمني بوضوح وطبيعية من غير استعمال تعبير تقني مثل «في لحظة لا تنقسم».
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: في طرفة عين
  rationale: تعبير عربي طبيعي يدل على السرعة الخاطفة، ويقابل الصورة اليونانية المرتبطة بحركة العين.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: عند البوق الأخير
  rationale: تحافظ «عند» على الدلالة الزمنية لحرف الجر في السياق، وتُبقي «الأخير» كما في اليونانية من غير إدخال نظام أخروي تفصيلي.
- source_word: σαλπίσει
  choice: فسيُنفخ في البوق
  rationale: الفعل اليوناني يعني النفخ في البوق أو إطلاق صوته. وهذه الصياغة عربية طبيعية، ويرجع البوق المعرّف إلى البوق المذكور قبلها مباشرة.
- source_word: οἱ νεκροὶ
  choice: الموتى
  rationale: تنقل اللفظة الجماعية الدالة على الأشخاص الذين ماتوا بعبارة عربية موجزة ومألوفة.
- source_word: ἐγερθήσονται
  choice: يُقام
  rationale: يحافظ المبني للمجهول على صيغة الأصل وعلى معنى الإقامة في سياق القيامة.
- source_word: ἄφθαρτοι
  choice: غير قابلين للفساد
  rationale: توضح العبارة أنهم سيُقامون في حال لا يلحقها فساد أو بِلًى، مع الحفاظ على صلة اللفظ بحجة بولس في سياق الأصحاح.
- source_word: ἡμεῖς
  choice: نحن
  rationale: أُبقي الضمير الصريح لما فيه من توكيد ومقابلة مع «الموتى»، من غير تفسيره بإضافة «الأحياء» إلى النص.
- source_word: ἀλλαγησόμεθα
  choice: سنُغيَّر
  rationale: تحافظ الصياغة على المبني للمجهول وعلى المعنى المباشر للفعل، من غير توسيعه إلى تفسير لطبيعة التغيير.
theological_decisions:
- issue: عبارة البوق الأخير وعلاقتها بالتصورات الأخروية
  choice: عند البوق الأخير
  alternative: عند البوق النهائي
  rationale: يصف النص البوق بأنه الأخير، لكن لا يحدد هنا نظامًا تفصيليًا لأحداث الأزمنة الأخيرة؛ لذلك تُنقل العبارة مباشرة وتُترك دلالتها اللاهوتية مفتوحة ضمن السياق.
- issue: مرجع ضمير المتكلمين وعلاقته بالقيامة والتغيير
  choice: ونحن سنُغيَّر
  alternative: والباقون منا أحياء سيُغيَّرون
  rationale: يحافظ الاختيار على ضمير المتكلمين الصريح في اليونانية وعلى المقابلة مع الموتى، من غير إضافة تفسير لا يصرح به هذا العدد.
- issue: دلالة المبني للمجهول في الإقامة والتغيير
  choice: يُقام الموتى... ونحن سنُغيَّر
  alternative: سيقوم الموتى... ونحن سنتغيّر
  rationale: الإبقاء على المبني للمجهول يصون صيغة الأصل ولا يصرح بالفاعل داخل العدد، مع أن السياق اللاهوتي الأوسع يفهم الفعل الإلهي.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ومهيبة. حُفظ التوازي الإيقاعي بين «في لحظة» و«في طرفة عين»، كما حُفظ المبني للمجهول في فعلي الإقامة والتغيير، وتُجنبت المصطلحات التقنية والتوسعات المذهبية.
