  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: ar
  text: إِنِّي أَمُوتُ كُلَّ يَوْمٍ[a]، وَحَقَّ مَا لِي مِنِ افْتِخَارٍ بِكُمْ فِي الْمَسِيحِ يَسُوعَ رَبِّنَا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو حرفيًّا: «يوميًّا أموت».'
    reason: lexical_alternative
  - marker: b
    text: 'العبارة اليونانية صيغةُ قسم، وتركيبها موضع نقاش. وقد يُفهم الضمير أيضًا على أنه يشير إلى «افتخاركم»؛ كما يمكن ترجمة العبارة: «كما أن افتخاري بكم في المسيح يسوع ربنا حق».'
    reason: alternative_reading
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: كُلَّ يَوْمٍ
  rationale: تعبير عربي طبيعي يحفظ معنى التكرار اليومي، بدل صياغة حرفية أثقل.
- source_word: ἀποθνῄσκω
  choice: أَمُوتُ
  rationale: يحفظ المضارع الخبري والصورة البلاغية الحية، من غير تفسيره بمعنى «أواجه الموت».
- source_word: νὴ
  choice: وَحَقَّ
  rationale: صيغة عربية قسمية موجزة تقابل أداة التوكيد القَسَمية في اليونانية وتحافظ على قوة العبارة.
- source_word: τὴν ὑμετέραν καύχησιν
  choice: افْتِخَارِي بِكُمْ
  rationale: تفهم العبارة، في ضوء جملة الصلة «الذي لي»، على أنها افتخار بولس بشأن المخاطَبين. وتبقى الاحتمالات النحوية الأخرى موثقة في الحاشية.
- source_word: ἣν ἔχω
  choice: الَّذِي لِي
  rationale: صياغة موجزة قريبة من الأصل تفيد أن هذا الافتخار لبولس، من دون إضافة تفسير زائد.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: فِي الْمَسِيحِ يَسُوعَ
  rationale: 'تحفظ «في» ذات الدلالة البولسية المهمة، وتنقل Χριστός بوصفه لقبًا: «المسيح».'
- source_word: τῷ κυρίῳ ἡμῶν
  choice: رَبِّنَا
  rationale: المقابل العربي المألوف والدقيق للقب κύριος مع ضمير المتكلمين.
theological_decisions:
- issue: هل يُنقل Χριστός بوصفه لقبًا أم كعنصر اسمي؟
  choice: الْمَسِيحِ يَسُوعَ
  alternative: يسوع المسيح، أو صياغة تعامل «المسيح» كجزء اسمي محض
  rationale: يحافظ ترتيب الأصل على اللقب قبل الاسم، و«المسيح» في العربية ينقل الدلالة اللقبية من غير حاجة إلى تعريب أجنبي.
- issue: مرجع الافتخار في τὴν ὑμετέραν καύχησιν
  choice: افتخار بولس بالمؤمنين في كورنثوس
  alternative: افتخار أهل كورنثوس أنفسهم، أو صيغة قسم بمعنى «كما أن افتخاري بكم حق»
  rationale: جملة الصلة «الذي لي» ترجح أن الافتخار لبولس ومتعلق بهم، لكن تركيب العبارة القَسَمية وضمير ὑμετέραν يسمحان بنقاش نحوي، ولذلك لم يُطمس البديل بل ذُكر في الحاشية.
- issue: قوة عبارة «أموت كل يوم»
  choice: الإبقاء على صورة الموت المباشرة
  alternative: أواجه الموت كل يوم
  rationale: الأصل يقول «أموت» بوضوح بلاغي، ولا يلزم حصره في مجرد التعرض للخطر، ولا فهمه حرفيًا بمعزل عن سياق الحجة.
translation_notes:
  register: لغة عربية فصحى واضحة ذات نبرة كتابية مهيبة. استُعملت صيغة «وحقَّ» لنقل القسم باقتضاب، وأُبقي ترتيب «المسيح يسوع» موافقًا للأصل. ضُبط النص جزئيًا لتسهيل القراءة، ولا سيما مواضع الإعراب التي قد يلتبس نطقها.
