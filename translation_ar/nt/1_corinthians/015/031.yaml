  to: إِنِّي أَمُوتُ كُلَّ يَوْمٍ[a]، وَحَقَّ مَا لِي مِنِ افْتِخَارٍ بِكُمْ فِي الْمَسِيحِ يَسُوعَ رَبِّنَا[b].
  rationale: تُعدَّل العبارة القسمية تعديلًا أسلوبيًا محدودًا إلى «وحقَّ ما لي من افتخار بكم»، لتؤدي بوضوح وطبيعية معنى الافتخار الذي لبولس بشأن المخاطَبين، مع عدم إلغاء الغموض التركيبي الموثق في الحاشية. ولا يتغير المعنى أو المصطلح اللاهوتي أو ترتيب «المسيح يسوع».
