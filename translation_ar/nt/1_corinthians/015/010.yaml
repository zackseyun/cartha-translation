  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: ar
  text: ولكن بنعمة الله أنا ما أنا، ونعمته نحوي لم تكن باطلة[a]؛ بل تعبت أكثر منهم جميعًا، ولكن لا أنا، بل نعمة الله التي معي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «لم تَصِر فارغة»؛ ويمكن أيضًا: «لم تكن بلا ثمر» أو «لم تذهب سُدًى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: لكِنْ بِنِعْمَةِ اللهِ
  rationale: تفيد الباء الوسيلة أو السبب، وتحفظ «لكن» المقابلة الخفيفة التي تؤديها δέ في السياق، مع إبقاء «النعمة» بوصفها اللفظ البولسي المحوري.
- source_word: εἰμι ὅ εἰμι
  choice: أَنَا مَا أَنَا
  rationale: صياغة عربية موجزة تحفظ التكرار الاصطلاحي في اليونانية، وتشير إلى حال بولس وهويته الحاضرة كما صاغتها النعمة.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: نِعْمَتُهُ الَّتِي لِي
  rationale: تنقل توجّه النعمة إلى بولس بعبارة عربية طبيعية من غير إضافة معنى غير منصوص عليه.
- source_word: οὐ κενὴ ἐγενήθη
  choice: لَمْ تَكُنْ بِلَا ثَمَرٍ
  rationale: تنقل معنى κενός هنا بوصفه الخلو من النتيجة أو الجدوى، مع الإشارة في الحاشية إلى الصورة الحرفية والبدائل الممكنة.
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: بَلْ تَعِبْتُ أَكْثَرَ مِنْهُمْ جَمِيعًا
  rationale: «تعبت» تؤدي معنى العمل المجهد في κοπιάω، و«منهم جميعًا» تحفظ صيغة المقارنة من غير حسم ما إذا كان المراد أكثر من كل واحد منهم أو أكثر منهم مجتمعين.
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: وَلَكِنْ لَا أَنَا، بَلْ نِعْمَةُ اللهِ
  rationale: 'تحفظ التصحيح الحاد في العبارة: يؤكد بولس تعبه الحقيقي ثم ينسب فاعليته إلى نعمة الله.'
- source_word: ἡ σὺν ἐμοί
  choice: الَّتِي مَعِي
  rationale: ترجمة مباشرة لـ σύν مع المجرور، وربط العبارة بنعمة الله كما يقتضي التركيب اليوناني.
theological_decisions:
- issue: العلاقة بين تعب بولس ونعمة الله
  choice: إثبات تعب بولس الفعلي مع نسبة الفاعلية الحاسمة إلى نعمة الله التي معه
  alternative: صياغة تجعل الله وبولس شريكين على نحو صريح، أو صياغة تلغي حقيقة تعب بولس
  rationale: النص اليوناني يجمع عمدًا بين «تعبت» و«لا أنا، بل نعمة الله»، ولذلك تُحفظ هذه المفارقة اللاهوتية من غير تسويتها وفق منظومة لاحقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «بلا ثمر» لبيان انعدام النتيجة المقصود من صورة الفراغ، مع حفظ الصورة الحرفية في الحاشية. وُضع مؤشر الحاشية مباشرة بعد العبارة التي يشرحها.
