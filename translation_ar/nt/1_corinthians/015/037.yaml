source:
  edition: SBLGNT
  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: ar
  text: وما تزرعه، فإنك لا تزرع الجسم الذي سيكون، بل حبةً عاريةً، ربما من القمح أو من أحد الأنواع الأخرى.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεις
  choice: تزرعه
  rationale: الفعل «زرع» هو المقابل العربي الطبيعي في هذا السياق الزراعي، ويحافظ على صورة البذر التي يقوم عليها تشبيه بولس.
- source_word: σῶμα
  choice: الجسم
  rationale: يحافظ «الجسم» على المصطلح المحوري في نقاش القيامة، ويجنّب الخلط بين σῶμα وσάρξ الذي كثيرًا ما يُترجم «الجسد».
- source_word: τὸ γενησόμενον
  choice: الذي سيوجد
  rationale: ينقل الدلالة المستقبلية للفعل γίνομαι، أي الجسم الذي سيأتي إلى الوجود، من غير حصر الصورة في نمو نباتي فقط.
- source_word: γυμνὸν
  choice: مجردة
  rationale: تفيد أن الحبة تُزرع بلا الهيئة أو الجسم الذي سيكون لها لاحقًا، وهي أفصح في العربية هنا من الوصف الحرفي «عارية»؛ وقد ذُكر هذا البديل في الحاشية.
- source_word: κόκκον
  choice: حبة
  rationale: «حبة» مقابل طبيعي لـκόκκος، ويلائم القمح وغيره من أنواع البذور في المثال.
- source_word: εἰ τύχοι
  choice: مثلًا
  rationale: يؤدي القوة التمثيلية والاحتمالية للعبارة اليونانية في عربية طبيعية، فلا يجعلها شرطًا صارمًا.
- source_word: σίτου
  choice: القمح
  rationale: المقصود هنا على الأرجح القمح تحديدًا، لا الحبوب على وجه العموم.
- source_word: τινος τῶν λοιπῶν
  choice: من نوع آخر
  rationale: صياغة عربية واضحة تؤدي معنى واحد من سائر الأنواع، مع إبقاء نوع الحبة غير محدد.
theological_decisions:
- issue: صلة الحبة بالجسم في القيامة
  choice: الإبقاء على لفظ «الجسم» وعلى التعبير المستقبلي «الذي سيوجد» من غير شرح زائد للاستعارة
  alternative: 'صياغة المعنى نباتيًا: «النبتة التي ستنمو»'
  rationale: يستعمل بولس صورة زراعية لإبراز التحول مع نوع من الاستمرار، لكن الآية نفسها تقول «الجسم». لذلك لا تُختزل العبارة في نمو النبات ولا يُحمَّل النص شرح عقائدي يتجاوز ألفاظه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «الجسم» بوصفه مصطلحًا دقيقًا في سياق القيامة، وجاء ترتيب الجملة قريبًا من اليونانية مع قدر لازم من السلاسة العربية.
