revisions:
- from: وما تزرعه، فإنك لا تزرع الجسم الذي سيوجد، بل حبةً مجردةً[a]، من القمح مثلًا أو من نوع آخر.
  to: وما تزرعه، فإنك لا تزرع الجسم الذي سيكون، بل حبةً عاريةً، ربما من القمح أو من أحد الأنواع الأخرى.
  rationale: تُستبدل العبارة الأقل سلاسة «الذي سيوجد» بـ«الذي سيكون»، ويُعتمد الوصف المباشر «حبة عارية» لـγυμνὸν κόκκον. كما تُصاغ خاتمة المثال بحيث تحفظ دلالة الاحتمال في εἰ τύχοι وإحالة «أحد الأنواع الأخرى» في τινος τῶν λοιπῶν. أزيلت الحاشية لأن بديلها صار هو النص المعتمد ولا تبقى حاجة إلى بديل مستقل.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام محفوظ: ما يُبذر ليس «الجسم» المستقبلي بل حبّة بلا الهيئة التي ستكون لها. لكن «الذي سيوجد» أقل سلاسة في هذا الموضع من «الذي سيكون»، و«مجرّدة» لا تؤدي هنا وصف γυμνὸν الزراعي بأوضح عبارة عربية.'
  naturalness: «حبة عارية» وصف مباشر ومفهوم في الاستعارة الزراعية، وهو أنسب من «حبة مجردة». كما أن «ربما من القمح أو من أحد الأنواع الأخرى» ينقل εἰ τύχοι وτινος τῶν λοιπῶν بوضوح دون تحويل المثال إلى تقرير محدد.
  terminology: يُحافَظ على «الجسم» لـσῶμα، وعلى «حبة» لـκόκκον، وعلى «القمح» لـσίτου. ولا يلزم تعليق تفسيري أو بديل معجمي في الحاشية بعد اعتماد «عارية».
  issues:
  - severity: medium
    issue: «حبةً مجردةً»
    rationale: «مجرّدة» ممكنة نظريًا، لكنها أقل طبيعية وأقل تحديدًا من «عارية» في نقل γυμνὸν، الذي يصف الحبّة بوصفها عارية/بلا الغطاء أو الهيئة اللاحقة.
  - severity: low
    issue: «الجسم الذي سيوجد»
    rationale: يفهم المعنى المستقبلي، لكنه ثقيل نسبيًا في العربية الفصحى الحديثة. «الجسم الذي سيكون» طبيعي ويحفظ اتساع τὸ γενησόμενον من غير قصره على نمو نباتي.
  - severity: low
    issue: «من القمح مثلًا أو من نوع آخر»
    rationale: صياغة مفهومة، لكن وضع «مثلًا» بعد القمح قد يضعف ارتباط الاحتمال بالمثال كله، و«نوع آخر» أقل صراحة في الإحالة إلى أحد الأنواع الباقية.
  revised_text: وما تزرعه، فإنك لا تزرع الجسم الذي سيكون، بل حبةً عاريةً، ربما من القمح أو من أحد الأنواع الأخرى.
