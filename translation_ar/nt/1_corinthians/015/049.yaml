  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: ar
  text: وكما حملنا صورة الترابي، سنحمل أيضًا صورة السماوي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «فلنحمل أيضًا صورة السماوي».'
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: كما
  rationale: تُدخل أداةُ التشبيه المقابلة بين حمل صورة الترابي وحمل صورة السماوي، وصياغة «كما... أيضًا» عربية واضحة وطبيعية.
- source_word: ἐφορέσαμεν
  choice: حملنا
  rationale: ينقل الفعل معنى حمل الصورة أو الاتصاف بها، ويحافظ الماضي العربي على صيغة الماضي اليونانية من غير فرض دلالة زمنية زائدة.
- source_word: εἰκόνα
  choice: صورة
  rationale: المقابل العربي المباشر الذي يحفظ صلة اللفظ بموضوع الشَبَه والتمثيل في المقابلة بين آدم والمسيح.
- source_word: τοῦ χοϊκοῦ
  choice: الترابي
  rationale: صفة اسمية تعني المنتمي إلى التراب أو المصنوع منه، وتستبقي صدى رواية الخلق والمقابلة السياقية من غير إضافة «الإنسان» إلى النص صراحة.
- source_word: φορέσομεν
  choice: سنحمل
  rationale: تعكس قراءة SBLGNT بصيغة المستقبل الخبرية، وتعرض حمل صورة السماوي بوصفه أمرًا مستقبليًا.
- source_word: τοῦ ἐπουρανίου
  choice: السماوي
  rationale: صفة اسمية تقابل «الترابي» بإيجاز وتوازٍ، وتحافظ على الإحالة السياقية من غير توسيع تفسيري.
- source_word: καὶ
  choice: أيضًا
  rationale: تُظهر القوة الإضافية للأداة في الجملة الثانية وتتمم البناء المقارن «كما... أيضًا».
theological_decisions:
- issue: صيغة المستقبل الخبرية أم صيغة الحث في الفعل الثاني
  choice: سنحمل أيضًا
  alternative: فلنحمل أيضًا
  rationale: النص المطبوع في SBLGNT يقرأ φορέσομεν، وهي صيغة مستقبل خبرية منسجمة مع سياق التحول في القيامة. ولأهمية القراءة النصية الأخرى، أُثبتت في الحاشية بدل إدخالها في المتن.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة ووقورة. استُخدم «الترابي» و«السماوي» بوصفهما صفتين اسميتين متوازيتين، بما يلائم السياق ويحفظ قدرًا من إيجاز الأصل وغموضه الحقيقي.
