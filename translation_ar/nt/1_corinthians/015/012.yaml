id: 1CO.15.12
reference: 1 Corinthians 15:12
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: ar
  text: فإن كان يُعلَن أن المسيح[a] قد أُقيم من بين الأموات، فكيف يقول بعضكم إنه لا قيامة للأموات؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني Χριστός لقبٌ معناه «المسيح»؛ وقد يُستعمل في بعض السياقات استعمال الاسم أو اللقب الثابت.
    reason: توضيح دلالة اللقب مع الحفاظ على مرونة استعماله في النص اليوناني.
lexical_decisions:
- source_word: Χριστὸς
  choice: المسيح
  rationale: نقلٌ للقب اليوناني بمعناه المألوف في العربية، لا بوصفه اسمًا شخصيًا مجردًا.
- source_word: κηρύσσεται
  choice: يُعلَن
  rationale: يحفظ صيغة المبني للمجهول ومعنى الإعلان العلني المستمر، بلغة عربية واضحة.
- source_word: ἐκ νεκρῶν
  choice: من بين الأموات
  rationale: يعبّر بوضوح عن الخروج من وسط الموتى، ويحافظ على صيغة الجمع في الأصل.
- source_word: ἐγήγερται
  choice: قد أُقيم
  rationale: 'يحفظ المبني للمجهول وقوة الزمن التام: حدثت الإقامة وما زالت نتيجتها قائمة.'
- source_word: πῶς
  choice: فكيف
  rationale: ينقل قوة السؤال الاستنكاري الذي يبرز التناقض بين الكرازة وإنكار القيامة.
- source_word: ἐν ὑμῖν τινες
  choice: بعضكم
  rationale: صياغة عربية طبيعية تدل على فئة من داخل جماعة المخاطَبين.
- source_word: ἀνάστασις νεκρῶν
  choice: قيامة للأموات
  rationale: يحفظ المعنى العام المتعلق بقيامة الموتى، لا بقيامة فرد واحد فقط.
- source_word: οὐκ ἔστιν
  choice: لا ... للأموات
  rationale: 'ينقل النفي الوجودي بصورة عربية موجزة وطبيعية: لا توجد قيامة للأموات.'
theological_decisions:
- issue: دلالة Χριστός في خطاب بولس
  choice: المسيح
  alternative: المسيح الموعود
  rationale: «المسيح» هو المقابل العربي الراسخ للقب، ويحفظ دلالته اللاهوتية دون إضافة وصف تفسيري غير موجود صراحة في النص.
- issue: المبني للمجهول في ἐγήγερται
  choice: قد أُقيم
  alternative: قد قام
  rationale: يحفظ المبني للمجهول في اليونانية، الذي يترك القائم بالفعل غير مصرَّح به، بدل تحويل العبارة إلى صيغة معلومة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «يُعلَن» بدل المصطلح الكنسي الأضيق «يُكرَز» لتيسير الفهم، مع الحفاظ على معنى الإعلان العلني. وحُفظ السؤال الاستنكاري والتوتر المنطقي في الحجة دون تفسير زائد.
