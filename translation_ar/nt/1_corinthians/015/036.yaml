lexical_decisions:
- source_word: ἄφρων
  choice: يا غبي
  rationale: ينقل النداء التوبيخي المباشر بعبارة عربية معاصرة واضحة، من غير تخفيف حدّة تصحيح بولس. ويبيّن النداء أن الوصف موجّه إلى المخاطَب لا إلى الزرع.
- source_word: σὺ
  choice: أنت
  rationale: أُثبت الضمير المنفصل بعد الفعل لإبراز التوكيد الموجود في اليونانية، مع الحفاظ على سلاسة التركيب العربي.
- source_word: ὃ σπείρεις
  choice: ما تزرعه
  rationale: صياغة عربية طبيعية تحافظ على صورة البذر الزراعية، ولا تستبدلها بتعبير تفسيري.
- source_word: ζῳοποιεῖται
  choice: لا يُحيا
  rationale: يحافظ المبني للمجهول على صورة منح الحياة الموجودة في الفعل اليوناني، كما يلائم سياق القيامة من غير إضافة فاعل غير مذكور صراحة.
- source_word: ἐὰν μὴ
  choice: ما لم
  rationale: أداة شرط عربية طبيعية ودقيقة تفيد أن حصول الإحياء متوقف على الموت.
- source_word: ἀποθάνῃ
  choice: يمت
  rationale: ينقل فعل الموت ببساطة ضمن الشرط، من غير إضافة «أولًا» التي يفهمها السياق ولا يصرّح بها النص.
theological_decisions:
- issue: العلاقة المجازية بين موت البذرة وحياة القيامة
  choice: الإبقاء على الصورة الزراعية كما وردت، من غير تحويلها إلى صياغة عقائدية تفسيرية.
  alternative: التصريح بأن الكلام قاعدة مباشرة عن قيامة الجسد.
  rationale: يستخدم بولس صورة الزرع ردًّا على الاعتراض على القيامة؛ لذلك ينبغي أن تبقى العلاقة الدلالية والتوتر المجازي في النص من غير شرح زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، بنبرة توبيخ مباشرة تليق بالسياق الجدلي. أُبقي ضمير المخاطب ظاهرًا للتوكيد، وحُفظ المبني للمجهول في فعل الإحياء والصورة الزراعية من غير توسع تفسيري.
