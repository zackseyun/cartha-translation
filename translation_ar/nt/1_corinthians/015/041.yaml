base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: ar
  text: فللشمس مجد[a]، وللقمر مجد آخر، وللنجوم مجد آخر؛ فإن نجمًا يختلف عن نجم في المجد.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بهاء» أو «سطوع» في جميع مواضع «مجد» في هذه الآية؛ فاللفظة اليونانية δόξα قد تدل هنا على الإشراق المرئي، لكن «مجد» يحفظ تكرار لفظ بولس وصلته بسياق كلامه.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλη
  choice: شيء... شيء آخر
  rationale: يفيد تكرار ἄλλη التمييز بين أمجاد الأجرام السماوية. وهذه الصياغة عربية طبيعية وتحافظ على تسلسل المقابلة.
- source_word: δόξα
  choice: مجد
  rationale: يدل اللفظ هنا على البهاء أو الإشراق المرئي، لكن «مجد» يحفظ تكرار المصطلح وصلته بحجة بولس المحيطة عن أجساد القيامة.
- source_word: ἡλίου / σελήνης / ἀστέρων
  choice: الشمس / القمر / النجوم
  rationale: 'تُترجم صيغ المضاف إليه بتراكيب الإضافة العربية المباشرة: «مجد الشمس»، و«مجد القمر»، و«مجد النجوم».'
- source_word: ἀστὴρ ... ἀστέρος
  choice: نجمًا ... نجم
  rationale: تحفظ المقارنة بين مفردين، أي الاختلاف داخل الفئة نفسها.
- source_word: γὰρ
  choice: لأن
  rationale: تقدم γάρ تعليلًا أو تفسيرًا للقول السابق، و«لأن» واضحة وطبيعية هنا.
- source_word: διαφέρει
  choice: يختلف
  rationale: ينقل معنى التمايز دون أن يفرض معنى التفوق الذي قد يحتمله اللفظ في سياقات أخرى.
- source_word: ἐν δόξῃ
  choice: في المجد
  rationale: يبين وجه الاختلاف ويحفظ تكرار المصطلح المحوري δόξα.
theological_decisions:
- issue: ترجمة δόξα في تشبيه كوني ضمن الحديث عن القيامة
  choice: مجد
  alternative: بهاء أو سطوع
  rationale: مع أن المقصود المباشر يشمل الإشراق المرئي للأجرام السماوية، فإن «مجد» يصون الصلة اللفظية واللاهوتية بسياق أجساد القيامة، من غير حصر المعنى في الضوء الفيزيائي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم تركيب «شيء... شيء آخر» لتأدية التباين المتكرر بصورة طبيعية، مع إبقاء «مجد» مصطلحًا موحدًا في الآية.
