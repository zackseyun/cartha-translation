source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: ar
  text: لأنه «أخضع كلَّ شيء تحت قدميه». ولكن حين يُقال إن «كلَّ شيء قد أُخضع»، فمن الواضح أن هذا لا يشمل الذي أخضع له كلَّ شيء.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فمن الواضح أن الذي أخضع له كلَّ شيء مستثنى».'
    reason: بديل تعبيري مباشر لعبارة الاستثناء اليونانية ἐκτός، في مقابل صياغة «لا يشمل» الأيسر في العربية.
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: كلَّ شيء
  rationale: صيغة الجمع المحايد شاملة، وتشير إلى الأشياء كلها لا إلى جميع الناس خصوصًا، كما تحافظ على صدى المزمور 8.
- source_word: ὑπέταξεν
  choice: أخضع
  rationale: ينقل معنى جعل الأشياء في منزلة الخضوع، ويحافظ على قوة الفعل وصيغة الاقتباس الكتابي.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: تحت قدميه
  rationale: تعبير كتابي مألوف يدل على السلطان والإخضاع، لذلك حُفظ بصورته الحرفية.
- source_word: ὅταν δὲ εἴπῃ
  choice: ولكن حين يقول
  rationale: يحافظ على صيغة المفرد في اليونانية من غير تعيين صريح لفاعل القول، إذ يمكن فهمه من السياق على أنه الله أو القول الكتابي بصياغة موجزة.
- source_word: ὑποτέτακται
  choice: قد أُخضع
  rationale: البناء للمجهول مع «قد» ينقل الفعل التام والنتيجة المستمرة التي تفيدها صيغة التام اليونانية.
- source_word: δῆλον
  choice: فمن الواضح
  rationale: ينقل الاستنتاج الذي يعرضه بولس بوصفه بيّنًا للقارئ بلغة عربية طبيعية.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: أن هذا لا يشمل الذي أخضع له كلَّ شيء
  rationale: 'يعبّر بوضوح وطبيعية عن الاستثناء: فالذي أخضع الأشياء للمسيح ليس داخلًا في «كل شيء» الخاضع له.'
- source_word: αὐτῷ
  choice: له
  rationale: تنقل الداتيف بوصفه دالًا على من أُخضعت له الأشياء، وهو الابن أو المسيح في السياق.
theological_decisions:
- issue: العلاقة بين الابن والذي أخضع له كل شيء
  choice: التصريح بأن «كل شيء» لا يشمل الذي أخضع الأشياء للابن
  alternative: 'صياغة الاستثناء مباشرة: «باستثناء الذي أخضع له كل شيء»'
  rationale: يحفظ النص التمييز الذي يقيمه بولس بين الابن وبين الله الذي أخضع له كل شيء، من غير إضافة تفسير عقائدي يتجاوز العبارة.
- issue: فاعل εἴπῃ غير المصرح به
  choice: «حين يقول» من غير تسمية الفاعل
  alternative: «حين يُقال» أو «حين يقول الكتاب»
  rationale: اليونانية لا تسمّي الفاعل صراحة؛ لذلك تُرك التعبير موجزًا للمحافظة على هذا القدر من الإبهام بدل حسمه تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ اقتباس «تحت قدميه» لما له من صدى كتابي، واستُعملت «أخضع» باستمرار لإبراز تكرار الجذر اليوناني ὑποτάσσω.
