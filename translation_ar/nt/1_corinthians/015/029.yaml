source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: ar
  text: وإلا، فماذا يفعل الذين يعتمدون لأجل الأموات[a]؟ إن كان الأموات لا يُقامون البتة، فلماذا يعتمدون لأجلهم؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نيابة عن الأموات»، أو «بسبب الأموات»، وعلى احتمال أضعف: «فوق الأموات». يحتمل حرف الجر اليوناني أكثر من معنى، ولا يُعرف على وجه اليقين ما الممارسة التي يشير إليها بولس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: وإلا
  rationale: تؤدي الانتقال الاستدلالي من الحجة السابقة، وتعرض النتيجة المترتبة على إنكار قيامة الأموات.
- source_word: τί ποιήσουσιν
  choice: فماذا يفعل
  rationale: تحافظ على عموم فعل ποιέω وعلى قوة السؤال البلاغي من غير تضييق معناه إلى «يحقق» أو تفسيره بعبارة مخصوصة.
- source_word: οἱ βαπτιζόμενοι
  choice: الذين يعتمدون
  rationale: صيغة عربية طبيعية تدل على الذين يتلقون المعمودية، من غير حكم على مشروعية الممارسة أو تحديد كيفيتها.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: لأجل الأموات
  rationale: تنقل معنى ὑπέρ مع المضاف إليه بصياغة عربية مرنة، وتتفادى حسم العبارة في معنى النيابة وحده؛ وتُذكر الاحتمالات في الحاشية.
- source_word: εἰ ὅλως
  choice: إن كان ... البتة
  rationale: تنقل ὅλως بوصفها أداة توكيد للشرط، و«البتة» عربية فصيحة واضحة في سياق النفي.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: الأموات لا يُقامون
  rationale: تحافظ على المبني للمجهول في ἐγείρονται وعلى لغة بولس المعتادة عن القيامة، من غير تحويله إلى فعل لازم.
- source_word: τί καὶ
  choice: فلماذا
  rationale: تنقل القوة البلاغية والنتيجة الاستدلالية طبيعيًا في العربية؛ والفاء تصل السؤال بما قبله.
- source_word: βαπτίζονται
  choice: يعتمدون
  rationale: تحافظ على التوازي اللفظي مع العبارة الأولى وتصف الممارسة الجارية من غير إضافة تفسير.
- source_word: ὑπὲρ αὐτῶν
  choice: لأجلهم
  rationale: تعيد اللفظ نفسه إحالةً إلى الأموات، فتحافظ على توازي الجملتين وعلى الغموض الدلالي في ὑπέρ.
theological_decisions:
- issue: معنى الاعتماد ὑπὲρ الأموات
  choice: 'إبقاء العبارة في صيغة قليلة التفسير: «يعتمدون لأجل الأموات»'
  alternative: «يعتمدون نيابة عن الأموات» أو «بسبب الأموات» أو، على احتمال أضعف، «فوق الأموات»
  rationale: الإشارة التاريخية والممارسة المقصودة موضع خلاف كبير. لا يشرح بولس الممارسة هنا، بل يوظفها في حجته عن القيامة؛ لذلك لا تتبنى الترجمة ممارسة بعينها ولا عقيدة طائفية، بل تحفظ مجال دلالة حرف الجر والتوتر التفسيري.
translation_notes:
  register: العربية فصحى معاصرة واضحة ووقورة. استُخدمت «يُقامون» للمبني للمجهول و«البتة» لحفظ التوكيد، واختيرت «لأجل» بدل صيغة تحسم معنى النيابة، مع إثبات علامة الحاشية [a] في المتن.
