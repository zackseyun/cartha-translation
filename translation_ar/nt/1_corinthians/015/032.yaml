revisions:
- from: إن كنتُ، بحسب الكلام البشري، قد حاربتُ الوحوش في أفسس[a]، فما الفائدة لي؟ إن كان الأموات لا يُقامون[b]، «فلنأكل ونشرب، لأننا غدًا نموت»[c].
  to: إن كنتُ، من وجهة نظر بشرية[a]، قد حاربتُ الوحوش[b] في أفسس، فما الفائدة لي؟ إن كان الأموات لا يُقامون، «فلنأكل ونشرب، لأننا غدًا نموت»[c].
  rationale: يصحح التعديل دلالة العبارة الاصطلاحية κατὰ ἄνθρωπον إلى عربية فصيحة لا تحصرها في «الكلام»، ويضع علامات الحواشي عند العبارات التي تفسرها، ويحسن وصف الحاشية للصورة المترجمة. ولا يغير ذلك الحجة البلاغية أو الالتباس التاريخي المتعمد في «حاربتُ الوحوش».
  reviewer_model: gpt-5.6-terra
