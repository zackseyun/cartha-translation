  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: ar
  text: إن كنتُ، من وجهة نظر بشرية[a]، قد حاربتُ الوحوش[b] في أفسس، فما الفائدة لي؟ إن كان الأموات لا يُقامون، «فلنأكل ونشرب، لأننا غدًا نموت»[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو ربما: «إن كنتُ قد حاربتُ الوحوش في أفسس من وجهة نظر بشرية…». قد تتعلق العبارة بطريقة كلام بولس أو بالمنظور الذي يتكلم منه.'
    reason: lexical_alternative
  - marker: b
    text: يمكن فهم «حاربتُ الوحوش» حرفيًا أو بوصفها صورة لمواجهة خصوم بشريين عنيفين؛ وقد حُفظت الصورة اللفظية في المتن.
    reason: alternative_reading
  - marker: c
    text: اقتباس أو تلميح إلى إشعياء 22:13.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: بحسب الكلام البشري
  rationale: صياغة عربية طبيعية تنقل معنى العبارة الاصطلاحي بوصفها تقييدًا لطريقة الكلام أو المنظور البشري المحض، مع إبقاء موضع تعلقها قابلًا للنقاش.
- source_word: ἐθηριομάχησα
  choice: حاربتُ الوحوش
  rationale: يحفظ الصورة اليونانية الحية من غير أن يحسم هل المقصود قتال حيوانات فعلًا أم مجابهة خصوم بشريين متوحشين.
- source_word: ἐν Ἐφέσῳ
  choice: في أفسس
  rationale: الصيغة العربية الشائعة لاسم المدينة.
- source_word: τί μοι τὸ ὄφελος
  choice: فما الفائدة لي؟
  rationale: تعبير عربي واضح يحفظ معنى المنفعة وقوة السؤال البلاغي.
- source_word: νεκροὶ
  choice: الأموات
  rationale: ينقل الصفة المستعملة اسميًا بصياغة عربية طبيعية ملائمة لسياق القيامة.
- source_word: ἐγείρονται
  choice: لا يُقامون
  rationale: يحفظ المبني للمجهول في اليونانية ولا يضيف فاعلًا غير مصرح به، مع إبقاء معنى الإقامة من الموت.
- source_word: Φάγωμεν καὶ πίωμεν
  choice: فلنأكل ونشرب
  rationale: ينقل صيغة الحث في فعلي المضارع الالتزاميين اليونانيين بصورة عربية موجزة وقوية.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: لأننا غدًا نموت
  rationale: ينقل الدلالة المستقبلية الطبيعية للقول ويحافظ على صدى إشعياء 22:13.
theological_decisions:
- issue: هل يشير ἐθηριομάχησα إلى قتال وحوش حقيقي أم إلى مقاومة بشرية وحشية؟
  choice: الإبقاء على الصورة الحرفية «حاربتُ الوحوش» في المتن من غير حسم المقصود.
  alternative: 'تفسيرها مجازيًا: «صارعتُ خصومًا متوحشين».'
  rationale: اللفظ اليوناني يتيح بقاء الصورة على ظاهرها، وحجة الآية لا تقتضي أن يحسم المترجم المسألة التاريخية؛ لذلك تُصان احتمالات النص وتوتره التفسيري.
- issue: ما الذي تقيده عبارة κατὰ ἄνθρωπον؟
  choice: صياغتها «بحسب الكلام البشري» مع بيان الاحتمال في الحاشية.
  alternative: «من وجهة نظر بشرية محضة».
  rationale: قد تتصل العبارة بطريقة بولس في الكلام أو بالمنظور الذي يصف منه صراعه؛ فلا ينبغي إخفاء هذا الالتباس التركيبي الحقيقي.
translation_notes:
  register: فصحى معاصرة واضحة وكريمة النبرة. حافظت الصياغة على السؤال البلاغي، والمبني للمجهول في «لا يُقامون»، والصورة الحيوانية من غير تفسير مذهبي أو تاريخي زائد.
