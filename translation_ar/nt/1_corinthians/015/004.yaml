lexical_decisions:
- source_word: ἐτάφη
  choice: دُفن
  rationale: فعل ماضٍ مبني للمجهول ينقل مباشرة معنى الدفن، من غير إضافة تحديد مثل وضعه في قبر أو لحد.
- source_word: ἐγήγερται
  choice: قد أُقيم
  rationale: يحافظ على المبني للمجهول، وتفيد «قد» تمام الحدث؛ أما الأثر المستمر لصيغة التام اليونانية فيوضحه الهامش لأن العربية لا تقابله بصيغة مطابقة تمامًا.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: في اليوم الثالث
  rationale: تعبير عربي طبيعي ودقيق للظرف الزمني، من غير إضافة «بعد» التي لا يصرح بها النص اليوناني.
- source_word: κατὰ τὰς γραφάς
  choice: وفقًا للكتب المقدّسة
  rationale: ينقل معنى الموافقة لشهادة الأسفار الكتابية، ويحافظ على إيجاز العبارة وتكرارها الاصطلاحي في السياق.
- source_word: γραϕάς
  choice: الكتب المقدّسة
  rationale: يدل الجمع في هذا السياق على الأسفار المعترف بقداستها، لا على كتابات عامة.
- source_word: ὅτι
  choice: أنّه
  rationale: يحافظ على بنية عبارات المضمون المتتابعة وعلى الإيقاع الإقراري للنص.
- source_word: καὶ
  choice: و
  rationale: يحافظ على أداة العطف المتكررة في الصيغة الأصلية.
theological_decisions:
- issue: دلالة صيغة القيامة من جهة الزمن والبناء
  choice: قد أُقيم
  alternative: أُقيم
  rationale: يحافظ الاختيار على المبني للمجهول وعلى كون القيامة حدثًا تمّ، مع ترك دلالة الأثر المستمر لصيغة التام اليونانية ظاهرة في الهامش بدل إدخال شرح عقائدي في المتن.
- issue: مرجع «الكتب المقدّسة»
  choice: الكتب المقدّسة
  alternative: الأسفار المقدّسة
  rationale: يشير النص إلى مجموعة الأسفار المعترف بها من غير أن يحددها بعبارة تفسيرية مثل «الكتب اليهودية»، لذلك أبقي المرجع موجزًا كما في اليونانية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة، تحافظ على تتابع «وأنّه» في الصيغة الإقرارية. استُعمل «أُقيم» بدل «قام» لصون المبني للمجهول، ووُضعت علامتا الهامش عند العبارتين اللتين تشرحهما الحاشيتان.
