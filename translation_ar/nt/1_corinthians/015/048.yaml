  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: ar
  text: كما هو الترابي، كذلك أيضًا الترابيون؛ وكما هو السماوي، كذلك أيضًا السماويون.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أوضح: «على مثال الترابي يكون الترابيون أيضًا، وعلى مثال السماوي يكون السماويون أيضًا».'
    reason: توضح الحاشية قوة تركيب المطابقة οἷος ... τοιοῦτοι من غير تغيير التوازي في المتن.
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: كما هو ... كذلك أيضًا ...
  rationale: يحافظ هذا التركيب العربي الطبيعي على علاقة المطابقة بين الشخص الممثِّل والمنتمين إلى فئته، وعلى التوازي البلاغي في الأصل.
- source_word: χοϊκός
  choice: ترابي
  rationale: ينقل معنى المتكوّن من التراب أو المتصف به، ويحفظ صلة اللفظ بأصل آدم من التراب في السياق السابق، من غير اختزاله إلى معنى «أرضي» الأوسع.
- source_word: ὁ χοϊκός
  choice: الترابي
  rationale: اسم الصفة المذكر المفرد طبيعي في العربية، ويشير في السياق إلى الإنسان الترابي، أي آدم، من غير حاجة إلى إضافة لفظ غير موجود صراحة في هذه الآية.
- source_word: οἱ χοϊκοί
  choice: الترابيون
  rationale: يحفظ التكرار الاشتقاقي مع «الترابي» ويدل على البشر الذين يشاركونه صفته.
- source_word: ἐπουράνιος
  choice: سماوي
  rationale: ينقل الصفة بمعنى المنتمي إلى السماء أو المتصف بالسماوية، ويحافظ على مقابلتها الصرفية والبلاغية مع «ترابي».
- source_word: ὁ ἐπουράνιος
  choice: السماوي
  rationale: اسم الصفة المفرد يحفظ إيجاز اليونانية، ويُفهم من السياق أنه المسيح في مقابل آدم من غير إدخال الاسم في نص الآية.
- source_word: οἱ ἐπουράνιοι
  choice: السماويون
  rationale: يحفظ الصيغة الوصفية والتوازي مع «السماوي»، ويشير في السياق إلى البشر المطابقين للسماوي لا إلى الملائكة.
theological_decisions:
- issue: هل تُضاف كلمة «الإنسان» إلى الوصفين المفردين لتصريح مقابلة آدم بالمسيح؟
  choice: 'إبقاء الوصفين اسمَي صفة: «الترابي» و«السماوي»'
  alternative: «الإنسان الترابي» و«الإنسان السماوي»
  rationale: العربية تسمح باستعمال الصفة معرفةً للدلالة على الشخص، وبذلك يُحفظ إيجاز النص اليوناني وتبقى هوية الشخصين مستفادة من السياق المباشر من غير إضافة تفسيرية داخل المتن.
- issue: هل «السماويون» كائنات سماوية أم بشر يطابقون السماوي؟
  choice: صياغة الجمع «السماويون» مع إبقاء دلالته البشرية مفهومة من السياق
  alternative: «الذين هم سماويون»
  rationale: موضوع السياق هو آدم والمسيح وقيامة البشر؛ لذا يدل الجمع على أناس يشاركون السماوي صفته أو صورته، مع تجنب توسيع النص بما يحسم كيفية هذه المشاركة.
translation_notes:
  register: فصحى معاصرة واضحة وموجزة ذات نبرة كتابية رصينة. حُفظ التوازي، والتكرار الاشتقاقي بين المفرد والجمع، والمقابلة بين الترابي والسماوي.
