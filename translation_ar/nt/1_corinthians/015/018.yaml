lexical_decisions:
- source_word: ἄρα
  choice: فإذًا
  rationale: أداة استنتاج تربط هذه النتيجة بالحجة الافتراضية السابقة، وتحافظ على تتابع منطق بولس.
- source_word: καὶ
  choice: أيضًا
  rationale: 'تفيد الإضافة: فإلى جانب النتائج السابقة، تشمل العاقبة الذين ماتوا وهم في المسيح.'
- source_word: οἱ κοιμηθέντες
  choice: الذين رقدوا
  rationale: يحافظ «رقدوا» على الاستعارة اليونانية الشائعة للموت، وهو تعبير عربي كتابي واضح وموقر.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: يترجم Χριστός بوصفه لقبًا، ويحافظ على صيغة الاتحاد بالمسيح من غير تفسير زائد.
- source_word: ἀπώλοντο
  choice: قد هلكوا
  rationale: ينقل معنى الوقوع في الهلاك بوصفه النتيجة المترتبة، وتفيد «قد» تحقق النتيجة في سياق الحجة الافتراضية.
theological_decisions:
- issue: دلالة ἐν Χριστῷ في حديث بولس عن الاتحاد بالمسيح
  choice: في المسيح
  alternative: في المسيّا
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب اليوناني Χριστός، كما أن العبارة تحفظ الغموض المقصود في علاقة المؤمنين بالمسيح دون اختزالها إلى معنى واحد.
- issue: مدى دلالة ἀπώλοντο
  choice: قد هلكوا
  alternative: قد ضاعوا
  rationale: «هلكوا» يحافظ على قوة اللفظ اليوناني وعلى التوتر اللاهوتي في الاستدلال، من غير تحديد لطبيعة الهلاك بما يتجاوز النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظت استعارة الرقاد، ووُضع «أيضًا» قريبًا من الفئة التي يضيفها النص إلى نتائج الحجة. استُعمل «المسيح» بوصفه ترجمة اللقب، لذلك لا حاجة إلى حاشية بديلة من نوع «في المسيح» كما في الطبقة الإنجليزية.
