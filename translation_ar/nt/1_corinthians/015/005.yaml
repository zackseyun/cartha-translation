  text: καὶ ὅτι ὤφθη Κηφᾷ, εἶτα τοῖς δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/005.yaml
  text: and that he appeared to Cephas[c][b][a], then to the twelve.
translation:
  language: ar
  text: وَأَنَّهُ ظَهَرَ لِكَيْفَا[a][b]، ثُمَّ لِلِاثْنَيْ عَشَرَ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «رآه كيفا». الفعل اليوناني مبني للمجهول من حيث الصيغة، ويجوز التعبير عن معناه حرفيًا بما يفيد أنه صار منظورًا؛ لكنه يُترجم عادةً في سياق القيامة بـ«ظهر».'
    reason: lexical_alternative
  - marker: b
    text: «كيفا» هو الاسم الآرامي المقابل لـ«بطرس».
    reason: cross_reference
  - marker: c
    text: «الاثنا عشر» تسمية مستقرة لجماعة رسل يسوع، حتى حين لم يكن عدد أفراد الجماعة اثني عشر في كل وقت.
    reason: cultural_note
lexical_decisions:
- source_word: ὤφθη
  choice: ظَهَرَ
  rationale: الفعل اليوناني صيغة ماضٍ مبني للمجهول من ὁράω، لكنه يُستعمل اصطلاحيًا في روايات ظهور القائم من الموت. «ظهر» تعبير عربي طبيعي يحافظ على معنى أن المسيح جعل نفسه منظورًا، من غير تحديد كيفية الظهور.
- source_word: Κηφᾷ
  choice: لِكَيْفَا
  rationale: نُقل الاسم العلم Κηφᾶς صوتيًا إلى العربية بصيغة «كيفا» بدل استبداله بالاسم الأشهر «بطرس» أو ترجمته إلى «صفا»، حفاظًا على الصيغة الواردة في النص اليوناني.
- source_word: εἶτα
  choice: ثُمَّ
  rationale: تفيد الترتيب الزمني في سلسلة الشهود، و«ثم» موجزة وطبيعية وتحافظ على هذا التتابع.
- source_word: τοῖς δώδεκα
  choice: لِلِاثْنَيْ عَشَرَ
  rationale: أُبقي التعبير بوصفه اللقب الجماعي المعروف لدائرة رسل يسوع، من غير تغييره إلى «الرسل» أو «الأحد عشر» توفيقًا مع روايات أخرى.
- source_word: καὶ ὅτι
  choice: وَأَنَّهُ
  rationale: يحافظ على اتصال هذه العبارة بسلسلة الجمل المضمونية السابقة التي يسرد بها بولس التقليد الذي تسلّمه.
theological_decisions:
- issue: لغة ظهور المسيح بعد القيامة
  choice: ظَهَرَ
  alternative: رآه كيفا / شوهد من كيفا
  rationale: يثبت النص حدوث ظهور منظور بعد القيامة، لكنه لا يشرح كيفيته. «ظهر» ينقل الادعاء من غير إضافة تفسير لطبيعة الظهور، مع الإشارة في الحاشية إلى البنية اليونانية المبنية للمجهول.
- issue: تسمية الجماعة «الاثني عشر» مع غياب يهوذا
  choice: الاثني عشر
  alternative: الرسل / الأحد عشر
  rationale: النص اليوناني يستعمل التسمية الجماعية الثابتة «الاثني عشر». إبقاؤها يتجنب التوفيق الصامت مع تصورات تاريخية مستمدة من نصوص أخرى.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة، تحافظ على بنية «وأنه» المتصلة بالسياق وعلى التتابع بـ«ثم». استُخدم «كيفا» نقلًا صوتيًا للاسم، وأُبقي لقب «الاثني عشر» كما هو دون مواءمة تفسيرية.
