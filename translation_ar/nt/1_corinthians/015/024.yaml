  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: ar
  text: ثم تأتي النهاية[a]، حين يسلِّم الملكوت إلى الله الآب[b]، وحين يُبطِل كلَّ رئاسةٍ وكلَّ سلطانٍ وكلَّ قوةٍ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «التمام». يمكن للكلمة اليونانية أن تعني النهاية أو الغاية أو التمام.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا أيضًا: «إلى الله والآب».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يجعل بلا أثر» كلَّ رئاسةٍ وكلَّ سلطانٍ وكلَّ قوةٍ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: ثم
  rationale: تفيد الانتقال إلى المرحلة التالية في تسلسل القيامة عند بولس، وهي موجزة وطبيعية في العربية.
- source_word: τὸ τέλος
  choice: النهاية
  rationale: تحفظ المعنى الزمني المباشر في السياق الأخروي، مع بيان احتمال «التمام» في الحاشية.
- source_word: ὅταν παραδιδῷ
  choice: حين يسلِّم
  rationale: تنقل حدثًا مستقبليًا في التسلسل، وفعل «يسلِّم» واضح في معنى إحالة الملك أو وضعه في يد آخر.
- source_word: τὴν βασιλείαν
  choice: الملكوت
  rationale: المقابل العربي الكتابي الواضح لـ βασιλεία، ويمكن أن يشمل المملكة وسلطان المُلك دون حصر المعنى في أحدهما.
- source_word: τῷ θεῷ καὶ πατρί
  choice: إلى الله الآب
  rationale: 'تفهم التركيب على أنه بياني: الله، أي الآب؛ والصياغة عربية طبيعية ومألوفة.'
- source_word: ὅταν καταργήσῃ
  choice: وحين يُبطِل
  rationale: ينقل معنى إنهاء الفاعلية أو الإلغاء الحاسم من غير أن يفرض معنى الإبادة الوجودية.
- source_word: πᾶσαν ἀρχὴν
  choice: كلَّ رئاسة
  rationale: تحفظ إمكان دلالة ἀρχή على سلطة حاكمة أو قوة ذات رياسة، وتنسجم مع ثلاثية الرئاسة والسلطان والقوة.
- source_word: πᾶσαν ἐξουσίαν
  choice: كلَّ سلطان
  rationale: «سلطان» مقابل عربي دقيق ومألوف للسلطة المخوَّلة أو الممارسة.
- source_word: δύναμιν
  choice: قوة
  rationale: تحفظ المعنى الواسع للكلمة بوصفها العنصر الثالث في قائمة القوى.
theological_decisions:
- issue: العلاقة بين «الله» و«الآب» في τῷ θεῷ καὶ πατρί
  choice: 'تركيب بياني: «الله الآب»'
  alternative: «الله والآب»
  rationale: السياق يفهم الآب على أنه المقصود بالله هنا، لكن الحاشية تحفظ الصورة التنسيقية الأكثر حرفية ولا تجعل الترجمة أساسًا لاستنتاج يتجاوز العبارة.
- issue: دلالة καταργήσῃ في شأن الرئاسات والسلطات والقوى
  choice: '«يُبطِل»: إنهاء فاعليتها وسلطانها على نحو حاسم'
  alternative: «يفني» أو «يجعل بلا أثر»
  rationale: يحفظ قوة الفعل من غير الجزم بأن المقصود إبادة هذه القوى في ذاتها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «الملكوت» و«الرئاسة والسلطان والقوة» لما لها من دقة مفهومية ورسوخ كتابي، مع تجنب الألفاظ المذهبية أو تفسير هوية القوى بما لا يصرح به النص.
