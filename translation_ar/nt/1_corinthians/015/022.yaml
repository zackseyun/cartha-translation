  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: ar
  text: فكما يموت الجميع في آدم، كذلك أيضًا سيُجعَل الجميع أحياء في المسيح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني Χριστός لقب معناه «المسيح» أو «الممسوح».
    reason: توضيح معنى اللقب اليوناني مع الحفاظ على المقابل العربي المألوف في المتن.
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: فكما
  rationale: تنقل «فـ» الصلة التفسيرية أو الاستدلالية التي تؤديها γάρ، وتنقل «كما» المقارنة التي تؤديها ὥσπερ، بصياغة عربية طبيعية مرتبطة بالسياق السابق.
- source_word: ἐν τῷ Ἀδὰμ
  choice: في آدم
  rationale: صياغة قريبة من الأصل تحفظ إيجاز العلاقة التمثيلية أو الجماعية من غير تحويل ἐν إلى معنى سببي أو وسائطي صريح.
- source_word: πάντες
  choice: الجميع
  rationale: تحفظ عموم اللفظ اليوناني والتوازي المقصود بين وروده في شطري الآية، من غير تقييد لنطاقه.
- source_word: ἀποθνῄσκουσιν
  choice: يموت
  rationale: المضارع العربي البسيط يعبّر طبيعيًا عن الحقيقة العامة التي يدل عليها المضارع اليوناني هنا؛ وجاء الفعل مفردًا لتقدمه على الفاعل الجمع.
- source_word: οὕτως καὶ
  choice: كذلك أيضًا
  rationale: تحفظ البنية المقابلة مع «كما» وقوة الإضافة في καί، بعبارة عربية واضحة.
- source_word: ἐν τῷ Χριστῷ
  choice: في المسيح
  rationale: تحفظ حرف الجر والتوازي مع «في آدم»، وتستعمل المقابل العربي المألوف للقب Χριστός من غير توسيع تفسيري.
- source_word: ζῳοποιηθήσονται
  choice: سيُجعَل الجميع أحياء
  rationale: تحفظ دلالة المستقبل والبناء للمجهول ومعنى الإحياء، بصياغة عربية أوضح من الفعل المبني للمجهول المحتمل التباس ضبطه عند القارئ.
theological_decisions:
- issue: نطاق «الجميع» في الشطرين
  choice: إبقاء «الجميع» بلا تقييد في كلا الشطرين
  alternative: تفسير «الجميع» الثانية صراحة بأنها تعني المؤمنين وحدهم، أو الجزم بأن اللفظين يشيران إلى جميع البشر بالمعنى نفسه تمامًا
  rationale: يقيم النص اليوناني توازيًا مقصودًا بين πάντες وπάντες، لكنه لا يحسم داخل هذه الآية وحدها كل ما يتعلق بمدى الإحياء أو آليته؛ لذلك تحفظ الترجمة التوتر اللاهوتي ولا تضيف قيدًا مذهبيًا.
- issue: طبيعة العلاقة التي تعبّر عنها ἐν
  choice: الإبقاء على «في آدم» و«في المسيح»
  alternative: «بواسطة آدم/المسيح» أو «في اتحاد مع آدم/المسيح»
  rationale: حرف الجر اليوناني موجز ويحتمل ثراءً تمثيليًا وجماعيًا؛ والتعبير الحرفي نسبيًا يحفظ هذا الاتساع بدل حصره في الوساطة أو الاتحاد صراحة.
translation_notes:
  register: فصحى معاصرة واضحة وكريمة النبرة. حُفظ التوازي بين «في آدم» و«في المسيح»، وبين «الجميع» في الشطرين، مع تجنب تفسير النطاق اللاهوتي داخل الترجمة.
