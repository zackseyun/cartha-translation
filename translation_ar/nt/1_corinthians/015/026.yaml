  rationale: تعبّر عن خصم أو قوة معادية، وتلائم تشخيص الموت بوصفه عدوًّا.
- source_word: καταργεῖται
  choice: يُبْطَلُ
  rationale: المضارع المبني للمجهول يدل على إنهاء فاعلية العدو وإبطال سلطانه، من غير حصر المعنى في الإبادة المادية.
- source_word: ὁ θάνατος
  choice: الْمَوْتُ
  rationale: التعريف يحفظ تقديم الموت بوصفه العدو المحدد والأخير.
theological_decisions:
- issue: دلالة καταργεῖται في هزيمة الموت
  choice: يُبْطَلُ
  alternative: يُقْضَى عَلَيْهِ
  rationale: «يُبْطَلُ» تحفظ معنى وضع الموت خارج الفاعلية وإنهاء سلطانه من غير فرض دعوى ميتافيزيقية أضيق من دلالة الفعل، بينما «يُقضى عليه» بديل عربي طبيعي محتمل.
