  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: ar
  text: وَآخِرَ الْجَمِيعِ، ظَهَرَ لِي أَيْضًا أَنَا، كَأَنِّي سِقْطًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: كجنينٍ أُسقِط أو خرج من الرحم قبل أوانه. يستعمل بولس هنا صورةً قاسيةً يحطّ بها من شأن نفسه. ويمكن أن تُترجم: «كمن وُلد في غير أوانه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: وَآخِرَ الْجَمِيعِ
  rationale: تؤدي العبارة وظيفة ظرفية وتشير إلى ختام تسلسل الظهورات. الواو تصل الكلام بما قبله من غير إقحام مقابلة حادة.
- source_word: ὡσπερεὶ
  choice: كَأَنِّي
  rationale: تنقل معنى التشبيه التقريبي في اليونانية، وتربطه طبيعيًا بوصف بولس لنفسه في العربية.
- source_word: τῷ ἐκτρώματι
  choice: سِقْطٌ
  rationale: «السِّقط» هو الجنين الذي يسقط قبل تمامه، ولذلك يحفظ الصورة الصادمة والحاطة من شأن الذات في الأصل من غير تفسير سبب استعمالها.
- source_word: ὤφθη
  choice: ظَهَرَ
  rationale: المبني للمجهول اليوناني من ὁράω يُستعمل هنا بمعنى الظهور المرئي، و«ظهر» هي الصياغة العربية الطبيعية في سياق ظهورات القيامة.
- source_word: κἀμοί
  choice: لِي أَنَا أَيْضًا
  rationale: تحفظ قوة الإضافة في καί، مع إبراز ضمير المتكلم على نحو عربي طبيعي يلائم خاتمة قائمة الشهود.
theological_decisions:
- issue: صورة بولس عن نفسه في ἐκτρώματι
  choice: الإبقاء على الصورة الصريحة «كأني سقط» في المتن
  alternative: كمن وُلد في غير أوانه؛ كمولود غير مكتمل
  rationale: اللفظ اليوناني أشد من مجرد الولادة المتأخرة أو غير الطبيعية، ولا يفسر بذاته وجه الشبه المقصود. إبقاء «سقط» يصون حدة استعارة بولس وتواضعه الذاتي من غير فرض تفسير لاهوتي خاص.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة. اختير «سِقط» لدقته المصدرية وقوة الصورة، مع شرح موجز في الحاشية يرفع احتمال غموض اللفظ لدى القارئ المعاصر.
