  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: ar
  text: وَإِنْ لَمْ يَكُنِ الْمَسِيحُ قَدْ أُقِيمَ مِنَ الْمَوْتِ، فَكَرَازَتُنَا إِذًا فَارِغَةٌ، وَإِيمَانُكُمْ أَيْضًا فَارِغٌ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة «فارغة» في الموضعين: «باطلة» أو «عديمة الجدوى».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: الْمَسِيحُ
  rationale: ينقل اللقب اليوناني بمعناه المَسِياني بدل معاملته كاسم مجرد، وهو تعبير عربي كتابي واضح وشائع.
- source_word: ἐγήγερται
  choice: قَدْ أُقِيمَ مِنَ الْمَوْتِ
  rationale: يحفظ صيغة المبني للمجهول ودلالة التمام المستمر في صيغة perfect، ويبيّن في العربية سياق القيامة من الموت من غير تعيين الفاعل صراحة.
- source_word: ἄρα
  choice: إِذًا
  rationale: تؤدي معنى النتيجة المنطقية المترتبة على جملة الشرط، وتأتي طبيعيًا في السياق العربي.
- source_word: κήρυγμα
  choice: كَرَازَتُنَا
  rationale: تنقل معنى الإعلان العلني المكرز به، وهي أوجز وأرسخ في الاستعمال العربي المسيحي من تركيب مطوّل مثل «إعلاننا».
- source_word: κενὸν / κενὴ
  choice: فَارِغَةٌ / فَارِغٌ
  rationale: يحفظ تكرار اللفظة وصورتها البلاغية، ويدل هنا على الخلو من المضمون أو الأساس والجدوى.
- source_word: πίστις
  choice: إِيمَانُكُمْ
  rationale: المقصود استجابة أهل كورنثوس المؤمنة، و«الإيمان» هو المقابل العربي الطبيعي والدقيق في هذا السياق.
theological_decisions:
- issue: صياغة القيامة والفاعل
  choice: قَدْ أُقِيمَ مِنَ الْمَوْتِ
  alternative: قَامَ مِنَ الْمَوْتِ
  rationale: يحفظ الاختيار صيغة المبني للمجهول في اليونانية وما فيها من إيحاء بالفعل الإلهي، من غير أن يصرّح بفاعل غير مذكور في النص.
- issue: دلالة Χριστός
  choice: الْمَسِيحُ
  alternative: الْمَسِيحُ/كَرِيسْتُوس بوصفه اسمًا منقولًا
  rationale: يبقي اللقب المَسِياني ظاهرًا في حجة بولس ولا يحوله إلى اسم علم مبهم للقارئ العربي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع الحفاظ على التوازي البلاغي بين فراغ الكرازة وفراغ الإيمان، وعلى المبني للمجهول في فعل القيامة.
