  verdict: approve
  source_fidelity: النص العربي ينقل بدقة البنية الشرطية والاستنتاجية في اليونانية، ويحافظ على المبني للمجهول في «قد أُقيم»، وعلى التوازي المقصود بين «كرازتنا» و«إيمانكم». وإضافة «من الموت» توضيح سياقي مشروع في سياق القيامة ولا تعيّن فاعلًا غير مذكور.
  naturalness: الصياغة فصيحة واضحة وطبيعية في العربية الكتابية المعاصرة. وتركيب «وإن لم يكن المسيح قد أُقيم» سليم ويؤدي، بقدر ما تسمح به العربية، دلالة الفعل التام في الأصل.
  terminology: «المسيح»، و«كرازتنا»، و«إيمانكم» مقابلات راسخة ودقيقة في هذا السياق. وتكرار «فارغة/فارغ» يحفظ الأثر البلاغي لتكرار κενός مع مراعاة المطابقة النحوية العربية.
