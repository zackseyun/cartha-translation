  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: ar
  text: فأنا أقلّ الرسل شأنًا، ولست أهلًا[a] لأن أُدعى رسولًا، لأني اضطهدت كنيسة الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: كفؤًا، أو صالحًا.'
    reason: يحمل ἱκανός معنى الأهلية أو الكفاية أو الصلاحية، ولا يقتصر بالضرورة على الاستحقاق الأخلاقي.
lexical_decisions:
- source_word: γάρ
  choice: فـ
  rationale: تحافظ الفاء على الصلة التفسيرية بما سبق، وتأتي طبيعية موجزة في العربية.
- source_word: ἐλάχιστος
  choice: أصغر
  rationale: تدل هنا على أدنى منزلة بين الرسل لا على صغر السن أو الحجم، وصيغة «أصغر الرسل» تحفظ صورة النص اليوناني مع وضوحها في السياق.
- source_word: ἀπόστολος / ἀποστόλων
  choice: رسول / الرسل
  rationale: يشير اللفظ هنا إلى جماعة الرسل المعترف بهم، لا إلى مجرد مبعوثين عاديين.
- source_word: ἱκανός
  choice: أهلًا
  rationale: «أهلًا» تعبر طبيعيًا عن الاستحقاق أو الصلاحية، مع إبقاء البدائل الدلالية في الحاشية.
- source_word: καλεῖσθαι
  choice: لأن أُدعى
  rationale: صياغة عربية طبيعية تحفظ صيغة المبني للمجهول ومعنى إطلاق اللقب.
- source_word: διότι
  choice: لأني
  rationale: تقدم السبب الصريح لشعور بولس بعدم الأهلية.
- source_word: ἐδίωξα
  choice: اضطهدت
  rationale: ينقل المعنى العدائي الواضح في حديث بولس عن أفعاله السابقة تجاه المؤمنين.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: كنيسة الله
  rationale: «كنيسة» هي المقابل العربي المألوف لجماعة المؤمنين هنا، والإضافة تحفظ التركيب اليوناني.
- source_word: ὃς
  choice: و
  rationale: استُعيض عن الموصول اليوناني بالواو والاستئناف المتصل لأن قول «أنا الذي لست أهلًا» أثقل في العربية، من غير فقدان الصلة بين وصفه بأنه أصغر الرسل وعدم أهليته.
theological_decisions:
- issue: طبيعة قول بولس عن رسوليته
  choice: يعد بولس نفسه واحدًا من الرسل، لكنه يقر بأنه أصغرهم وغير أهل لحمل اللقب بسبب اضطهاده السابق.
  alternative: أن يكون بولس منكرًا لرسوليته أصلًا، أو أن يقصد مجرد تدني منزلته الاجتماعية دون عدم الاستحقاق الأخلاقي.
  rationale: قوله «أنا أصغر الرسل» يدرجه ضمنهم، في حين أن «لست أهلًا لأن أُدعى رسولًا» يحفظ تواضعه وحكمه على ماضيه؛ لذلك أبقت الصياغة التوتر بين الرسوليّة الفعلية وعدم الأهلية التي يشعر بها.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فأنا» بدل صياغة أثقل مثل «فإني أنا»، وحُفظت المصطلحات الكنسية المألوفة دون إقحام تفسير مذهبي.
