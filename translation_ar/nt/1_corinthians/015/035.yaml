  text: 'لكن سيقول قائل: «كيف يُقام الموتى[a]، وبأيّ جسد يأتون؟»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كيف يقوم الموتى؟» الفعل اليوناني مبني للمجهول، وحرفيًا: «يُقامون»، وقد يلمّح ذلك إلى أن الله هو الذي يقيمهم.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: لكن
  rationale: تفيد انتقالًا استدراكيًا إلى سؤال أو اعتراض متوقَّع، و«لكن» واضحة وطبيعية في العربية.
- source_word: ἐρεῖ τις
  choice: قد يقول قائل
  rationale: صياغة عربية مألوفة لعرض قول محاور مفترض؛ وتحافظ «يقول» على صورة القول دون تحويله إلى السؤال صراحة.
- source_word: Πῶς
  choice: كيف
  rationale: تنقل أداة الاستفهام عن الكيفية أو الإمكان مباشرة.
- source_word: ἐγείρονται
  choice: يُقام
  rationale: تحافظ على المبني للمجهول في اليونانية وعلى احتمال دلالته الضمنية إلى فاعلية الله، من غير التصريح بما لم يصرح به النص.
- source_word: οἱ νεκροί
  choice: الموتى
  rationale: المقابل العربي الطبيعي للاسم الجمع الدال على الذين ماتوا.
- source_word: ποίῳ ... σώματι
  choice: بأي نوع من الأجساد
  rationale: تحفظ القوة النوعية لـ ποίῳ، وتستعمل الجمع العربي لأن المرجع جماعة الموتى، مع بقاء السؤال عن نوع الجسد.
- source_word: δὲ
  choice: الواو
  rationale: تصل السؤال الثاني بالأول من غير إضفاء معنى استدراكي قوي.
- source_word: ἔρχονται
  choice: يأتون
  rationale: ترجمة مباشرة للفعل، من غير تفسيره بـ«يظهرون» أو تكرار معنى الإقامة.
theological_decisions:
- issue: صيغة القيامة والفاعل الضمني
  choice: كيف يُقام الموتى
  alternative: كيف يقوم الموتى
  rationale: المبني للمجهول يطابق الصيغة اليونانية ويحفظ احتمال الإشارة إلى فاعلية إلهية من غير جعلها صريحة.
- issue: عدد كلمة الجسد في العربية
  choice: بأي نوع من الأجساد يأتون
  alternative: بأي نوع من الجسد يأتون
  rationale: الجمع أوضح في العربية مع فاعل جمع، ولا يغير السؤال النوعي الذي تحمله صيغة ποίῳ.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت صيغة «قد يقول قائل» بوصفها تعبيرًا عربيًا طبيعيًا للمحاور الافتراضي، مع إبقاء السؤالين مباشرين والمحافظة على المبني للمجهول في فعل القيامة.
