id: 1CO.15.17
reference: 1 Corinthians 15:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: ar
  text: ولكن إن لم يكن المسيح قد أُقيم[a]، فإيمانكم عديم الجدوى[b]، ولا تزالون في خطاياكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد قام».'
    reason: بديل صرفي ودلالي محتمل لصيغة ἐγήγερται، مع بقاء المبني للمجهول أقرب إلى صيغة النص.
  - marker: b
    text: 'أو: «باطل».'
    reason: بديل معجمي موجز لـ ματαία.
lexical_decisions:
- source_word: Χριστὸς
  choice: المسيح
  rationale: اللفظ العربي الطبيعي والمستقر للقب Χριστός، ويحفظ دلالته المسيانية من غير تحويله إلى اسم مجرد.
- source_word: ἐγήγερται
  choice: قد أُقيم
  rationale: يحفظ صيغة التام المبني للمجهول وما تفيده من حدث ماضٍ ذي أثر قائم، من غير التصريح بالفاعل الذي لم يذكره النص اليوناني.
- source_word: ματαία
  choice: عديم الجدوى
  rationale: تعبير عربي معاصر واضح يدل على عدم النفع والفاعلية في سياق الحجة، مع ذكر «باطل» بديلًا في الحاشية.
- source_word: πίστις
  choice: إيمانكم
  rationale: يشير السياق إلى إيمان المخاطَبين وتصديقهم، لا إلى أمانتهم أو وفائهم.
- source_word: ἔτι
  choice: لا تزالون
  rationale: ينقل معنى استمرار الحالة إلى الوقت الحاضر بصياغة عربية طبيعية.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: في خطاياكم
  rationale: يحافظ على صورة العبارة اليونانية المفتوحة دلاليًا، بما فيها البقاء في حال الخطايا وتحت أثرها، من غير شرح عقائدي زائد.
- source_word: δὲ
  choice: ولكن
  rationale: يؤدي وظيفة الربط الاستدراكي والتقابلي مع الحجة السابقة.
theological_decisions:
- issue: صياغة القيامة والفاعل
  choice: قد أُقيم
  alternative: قد قام
  rationale: الصياغة المبنية للمجهول أقرب إلى هيئة الفعل اليوناني وتحفظ الإيحاء بفاعل غير مصرّح به، بينما يبيّن البديل في الحاشية إمكان الصياغة العربية اللازمة دون حسم زائد.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: لا بديل عربي ضروري في هذا الموضع
  rationale: «المسيح» هو المقابل العربي الذي يؤدي معنى اللقب المسياني، كما أنه الصيغة العربية المألوفة لما يقابل Christ؛ لذلك لا ينشأ في العربية التقابل اللفظي نفسه الموجود في الإنجليزية بين Messiah وChrist.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل الشرط «إن لم يكن... قد» لنقل الافتراض المخالف في سياق الحجة، وحُفظ التوازي بين بطلان الإيمان واستمرار المخاطَبين في خطاياهم. وُضعت علامتا الحاشيتين [a] و[b] في المتن.
