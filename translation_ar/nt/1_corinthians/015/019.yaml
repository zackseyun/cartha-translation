  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: ar
  text: إن كان رجاؤنا في المسيح مقصورًا على هذه الحياة وحدها، فنحن أحقُّ بالرثاء من جميع الناس.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فنحن أشدُّ الناس استحقاقًا للرثاء».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: إنْ كنا
  rationale: تُدخل جملة شرطية، وصياغة «إن كنا قد...» تنقل الشرط مع دلالة الفعل التام.
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: لهذه الحياة
  rationale: تؤدي المعنى المقصود هنا، أي حصر منفعة الرجاء في الحياة الحاضرة، بصياغة عربية طبيعية واضحة.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: أُبقي حرف الجر لما للتركيب البولسي من دلالة، و«المسيح» هو المقابل العربي الطبيعي للقب Χριστός.
- source_word: ἠλπικότες ἐσμὲν
  choice: قد وضعنا رجاءنا
  rationale: ينقل التركيب التام المحيطي بوصفه رجاءً ثابتًا وموضوعًا في المسيح وما زال قائمًا.
- source_word: μόνον
  choice: وحدها
  rationale: ربطها بـ«هذه الحياة» يوضح أن القصر واقع على مدى الرجاء لا على فعل الرجاء نفسه.
- source_word: ἐλεεινότεροι
  choice: أحقُّ بالرثاء
  rationale: يعبر عن الصفة المقارنة بمعنى كون الشخص أجدر بأن يُرثى، دون تحويلها في المتن إلى صيغة تفضيل مطلقة.
- source_word: πάντων ἀνθρώπων
  choice: من جميع الناس
  rationale: يشمل البشر عمومًا، ويحافظ على المقارنة الشاملة في اليونانية.
theological_decisions:
- issue: دلالة Χριστός في العبارة البولسية ἐν Χριστῷ
  choice: في المسيح
  alternative: في المسيّا
  rationale: «المسيح» في العربية لقب ذو معنى مسياني، وهو التعبير الكتابي الطبيعي، مع إبقاء تركيب «في» وعدم اختزاله إلى مجرد اسم.
- issue: نطاق الرجاء المقصور بكلمة μόνον
  choice: الرجاء المقصور على هذه الحياة وحدها
  alternative: إن كنا في هذه الحياة وحدها قد وضعنا رجاءنا في المسيح
  rationale: السياق يرجح تعلق القصر بالحياة الحاضرة؛ وتحافظ الصياغة على قوة الشرط من غير إضافة شرح عقائدي عن القيامة أو الحياة الآتية.
- issue: قوة صيغة المقارنة ἐλεεινότεροι πάντων
  choice: أحق بالرثاء من جميع الناس
  alternative: أشد الناس استحقاقًا للرثاء
  rationale: أُبقيت المقارنة الصريحة في المتن، مع ذكر الصياغة العربية ذات المعنى التفضيلي في الحاشية، لأن التركيب اليوناني قد يُفهم اصطلاحيًا بهذا المعنى.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «وضعنا رجاءنا» بدل صياغة حرفية أقل سلاسة، وحُفظ التعبير البولسي «في المسيح» مع تجنب أي توسع تفسيري.
