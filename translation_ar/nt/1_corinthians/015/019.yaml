revisions:
- from: إنْ كنا قد وضعنا رجاءنا في المسيح لهذه الحياة وحدها، فنحن أحقُّ بالرثاء من جميع الناس.[a]
  to: إن كان رجاؤنا في المسيح مقصورًا على هذه الحياة وحدها، فنحن أحقُّ بالرثاء من جميع الناس.[a]
  rationale: تُستبدل الصياغة الفعلية التي قد يلتبس فيها تعلّق «لهذه الحياة» بصياغة اسمية تفيد الحالة القائمة التي يعبر عنها التركيب التام اليوناني، وتُظهر صراحة أن القصر واقع على الرجاء في المسيح. ولا يتغير المعنى أو المصطلح اللاهوتي أو موضع الحاشية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:18Z'
review_pass:
  verdict: revise
  source_fidelity: ينقل النص الشرط، وكون الرجاء «في المسيح»، وقصره على الحياة الحاضرة، والمقارنة الشاملة في ἐλεεινότεροι πάντων ἀνθρώπων. لكن «لهذه الحياة» أضعف في العربية من حيث مطابقة الظرف اليوناني ἐν τῇ ζωῇ ταύτῃ، وقد يوحي بغرض الرجاء أكثر من كونه قصرًا لمداه. والصياغة المعدلة تجعل القصر متعلقًا بالرجاء بوضوح.
  naturalness: النص مفهوم وفصيح إجمالًا، إلا أن تتابع «في المسيح لهذه الحياة وحدها» أقل سلاسة وقد يترك تعلّق شبه الجملة غير محكم. الصياغة الاسمية «إن كان رجاؤنا في المسيح مقصورًا على هذه الحياة وحدها» عربية حديثة واضحة وتحفظ المقصود.
  terminology: «المسيح» المقابل العربي الكتابي الطبيعي للقب Χριστός، و«في المسيح» يحافظ على التركيب البولسي. و«أحق بالرثاء» يؤدي المقارنة في ἐλεεινότεροι من دون فرض صيغة التفضيل المطلقة، بينما تبقى الصياغة التفضيلية البديلة مناسبة للحاشية.
