base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: ar
  text: 'لكن كل واحد في ترتيبه الخاص: المسيح[a] هو الباكورة، ثم الذين ينتمون إلى المسيح عند مجيئه[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Χριστός لقب يوناني يعني «الممسوح»، و«المسيح» المقابل العربي الراسخ له.
    reason: lexical_alternative
  - marker: b
    text: يمكن أيضًا ترجمة παρουσία بـ«حضوره» أو «وصوله»، لكنها تشير في هذا السياق إلى مجيئه المستقبلي.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: كل واحد
  rationale: تعبير توزيعي يعود إلى ترتيب القيامة في السياق السابق، ويحافظ على دلالة المفرد في اليونانية.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: في ترتيبه
  rationale: يدل τάγμα هنا على ترتيب أو نسق محدد، لا يلزم أن يكون رتبة عسكرية؛ والسياق يتناول تتابع القيامة.
- source_word: ἀπαρχὴ
  choice: الباكورة
  rationale: تحفظ اللفظة صورة أول محصول يُقدَّم لله وما تتضمنه من الإشارة إلى أن ما بعده سيتبعه.
- source_word: Χριστός
  choice: المسيح
  rationale: الترجمة العربية المألوفة للقب اليوناني الذي يعني «الممسوح»، وهي تلائم بروز دلالته اللقبية هنا.
- source_word: οἱ τοῦ Χριστοῦ
  choice: الذين للمسيح
  rationale: صياغة موجزة تحفظ دلالة الملكية والانتماء في تركيب المضاف إليه اليوناني.
- source_word: παρουσίᾳ
  choice: مجيئه
  rationale: 'يناسب السياق الأخروي وتسلسل الأحداث، مع الإشارة في الحاشية إلى الدلالتين المعجميتين الأخريين: الحضور والوصول.'
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا ذا أهمية أخروية
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» لقب عربي راسخ يقابل Χριστός ويحفظ هويته المسيانية، أما «الممسوح» فأنسب للشرح المعجمي منه للنص الرئيس.
- issue: هل تُترجم παρουσία بمصطلح أخروي أكثر تخصيصًا
  choice: مجيئه
  alternative: حضوره أو وصوله
  rationale: «مجيئه» يوضح الحدث المستقبلي في هذا السياق من غير أن يضيف تحديدًا عقائديًا غير مصرح به في اليونانية.
- issue: العلاقة بين المسيح والباكورة
  choice: المسيح هو الباكورة
  alternative: المسيح باكورة
  rationale: إضافة ضمير الفصل تجعل العبارة الاسمية طبيعية وواضحة بالعربية، من غير تحويلها إلى تشبيه أو إضعاف التطابق المباشر في الأصل.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة. حُفظت صورة «الباكورة» الكتابية، وتُجنب الإفراط في الطابع العسكري عند ترجمة τάγμα، كما حُفظت السمة الأخروية لـπαρουσία من غير زيادة مذهبية.
