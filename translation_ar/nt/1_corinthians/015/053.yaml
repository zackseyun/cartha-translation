  text: δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: ar
  text: فلا بد أن يلبس هذا الجسد القابل للفساد عدمَ الفساد[a]، وأن يلبس هذا الجسد المائت الخلود.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة أقرب إلى ظاهر اليونانية: «فلا بد أن يلبس هذا القابل للفساد عدمَ الفساد، وأن يلبس هذا المائت الخلود». لا تذكر اليونانية لفظ «الجسد» صراحة في هذه الآية، لكن السياق يبيّن أن المقصود هو الجسد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: لا بد أن
  rationale: تعبّر بوضوح وقوة عن الضرورة التي يقررها بولس، مع بقاء الأسلوب عربيًا طبيعيًا.
- source_word: γὰρ
  choice: فـ
  rationale: تحفظ الصلة التفسيرية بما سبق في صياغة عربية موجزة وطبيعية.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: هذا الجسد القابل للفساد
  rationale: الصفة اليونانية مستعملة استعمال الاسم وتعني ما هو خاضع للفساد. أُضيف «الجسد» إيضاحًا للمرجع الذي يبينه سياق قيامة الأجساد، مع التنبيه في الحاشية إلى أنه غير مذكور صراحة هنا.
- source_word: ἐνδύσασθαι
  choice: يلبس
  rationale: يحفظ استعارة ارتداء الثوب بصياغة عربية واضحة، من غير تحويلها إلى تعبير تفسيري مجرد.
- source_word: ἀφθαρσίαν
  choice: عدم الفساد
  rationale: يحافظ على التقابل اللفظي المباشر مع «القابل للفساد»، ويدل على حالة لا تخضع للفساد أو البِلى.
- source_word: καὶ
  choice: وأن
  rationale: تربط الشطرين المتوازيين، مع تكرار أداة المصدر الملائمة لبنية «لا بد» العربية.
- source_word: τὸ θνητὸν τοῦτο
  choice: هذا الجسد المائت
  rationale: ينقل معنى ما هو خاضع للموت، ويضيف «الجسد» من السياق لتعيين المرجع والمحافظة على التوازي.
- source_word: ἀθανασίαν
  choice: الخلود
  rationale: لفظ عربي مألوف هنا للدلالة على عدم الخضوع للموت، ويقابل «المائت» بوضوح.
theological_decisions:
- issue: إضافة لفظ «الجسد» في الشطرين مع أن σώμα غير وارد في هذه الآية
  choice: إظهار المرجع بعبارة «هذا الجسد القابل للفساد» و«هذا الجسد المائت»
  alternative: «هذا القابل للفساد لا بد أن يلبس عدم الفساد، وهذا المائت أن يلبس الخلود»
  rationale: 'السياق المباشر في 1 كورنثوس 15: 42–54 يتناول قيامة الجسد وتحوله. توضيح المرجع يزيل غموضًا أسلوبيًا في العربية من غير إضافة تقرير عقائدي جديد، بينما تحفظ الحاشية الصياغة الأكثر التزامًا بظاهر الألفاظ اليونانية.'
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظت استعارة اللباس والتوازي بين الفساد وعدم الفساد، وبين الموت والخلود؛ وأُضيف «الجسد» إيضاحًا من السياق مع توثيق ذلك في الحاشية.
