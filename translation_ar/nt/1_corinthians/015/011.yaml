  text: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι, οὕτως κηρύσσομεν καὶ οὕτως ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: ar
  text: فسواء كنتُ أنا أم كانوا هم، هكذا نكرز، وهكذا آمنتم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: فسواء ... أم
  rationale: ينقل تركيب البديلين بعبارة عربية طبيعية، مع إبقاء المقابلة بين بولس وسائر الرسل.
- source_word: οὖν
  choice: الفاء في «فسواء»
  rationale: تؤدي معنى الاستنتاج والانتقال من عرض الشهود السابق، من غير إثقال العبارة بأداة مستقلة.
- source_word: ἐγὼ
  choice: أنا
  rationale: ضمير المتكلم المفرد، وقد أُبقي ظاهرًا لإبراز مقابلته بـ«هم».
- source_word: ἐκεῖνοι
  choice: هم
  rationale: يعود إلى الرسل أو الشهود الآخرين المذكورين في السياق، والضمير واضح وطبيعي بالعربية.
- source_word: οὕτως
  choice: هكذا
  rationale: يحافظ على تكرار اللفظة وعلى إمكان دلالتها على مضمون البشارة أو الكيفية، بدل حصرها في تفسير واحد.
- source_word: κηρύσσομεν
  choice: نكرز
  rationale: فعل عربي كتابي مفهوم يدل على الإعلان العلني للرسالة، ويحفظ قوة κηρύσσω.
- source_word: καὶ
  choice: و
  rationale: يربط بين الكرازة واستجابة المخاطَبين كما في الأصل.
- source_word: οὕτως
  choice: هكذا
  rationale: تكرار الترجمة نفسها يصون التوازي المقصود بين ما يكرز به الرسل وما آمن به الكورنثيون.
- source_word: ἐπιστεύσατε
  choice: آمنتم
  rationale: ينقل الماضي الدال على فعل إيمان المخاطَبين دون إضافة مفعول أو تفسير غير مصرح به.
theological_decisions:
- issue: نطاق وحدة الكرازة الرسولية
  choice: تفيد العبارة أن بولس والرسل الآخرين يكرزون على هذا النحو، وأن الكورنثيين آمنوا على هذا النحو.
  alternative: تفسير «هكذا» تفسيرًا حصريًا بمعنى «بهذا المضمون» أو، في المقابل، بمعنى «بهذه الكيفية».
  rationale: تُبقي «هكذا» الدلالة الأصلية المرنة، فتحفظ وحدة الشهادة الرسولية وصلتها بإيمان الكورنثيين من غير إضافة دعوى كنسية أوسع أو حسم ما إذا كان التركيز على المضمون وحده أم على الكيفية.
translation_notes:
  register: عربية فصحى معاصرة موجزة وكريمة. حُفظ التوازي والتكرار في الأصل، واستُعمل «نكرز» بوصفه مصطلحًا كتابيًا مألوفًا وواضحًا.
