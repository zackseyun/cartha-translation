  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: ar
  text: يُزرَع جسدًا طبيعيًّا، ويُقام جسدًا روحيًّا. إن كان هناك جسد طبيعيّ[a]، فهناك أيضًا جسد روحيّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «جسد نفساني» ... «جسد روحي». ليست مقابلة بولس بين جسد مادي وآخر غير مادي، بل بين جسد تحييه الحياة البشرية الطبيعية وجسد يحييه الروح.
    reason: بديل معجمي وتوضيح لمنع فهم «روحي» بمعنى غير جسدي.
lexical_decisions:
- source_word: σπείρεται
  choice: يُزرَع
  rationale: يحافظ على صيغة المبني للمجهول وصورة البذر الزراعية الممتدة في السياق المباشر.
- source_word: σῶμα
  choice: جسد
  rationale: المقابل العربي المباشر، ويشير هنا إلى الإنسان في وجوده الجسدي عند الموت والقيامة.
- source_word: ψυχικόν
  choice: طبيعيًّا / طبيعيّ
  rationale: ينقل وصف الجسد بالحياة البشرية المخلوقة في مقابل الجسد المتصف بالروح، من غير أن يوحي بأن المقابلة بين المادي وغير المادي. أما «نفساني» فأقرب إلى اللفظ لكنه قد يكون غامضًا للقارئ المعاصر.
- source_word: ἐγείρεται
  choice: يُقام
  rationale: تعبير عربي واضح ومألوف للقيامة، ويحفظ صيغة المبني للمجهول.
- source_word: πνευματικόν
  choice: روحيًّا / روحيّ
  rationale: يحفظ مصطلح بولس والمقابلة مع ψυχικόν، من غير أن يعني أن الجسد المقام غير جسدي؛ ويبيّن الهامش المقصود.
- source_word: Εἰ
  choice: إن
  rationale: تحفظ صيغة الشرط في اليونانية ولا تحوّلها تفسيريًّا إلى تقرير سببي.
- source_word: καὶ
  choice: أيضًا
  rationale: 'تنقل القوة الإضافية: وجود الجسد الطبيعي يقابله وجود الجسد الروحي أيضًا.'
theological_decisions:
- issue: معنى المقابلة بين «جسد طبيعي» و«جسد روحي»
  choice: الإبقاء على مقابلة بولس بين جسد متصف بالحياة البشرية الطبيعية وجسد متصف بالروح.
  alternative: فهمها مقابلة بين جسد مادي وجسد غير مادي، أو ترجمة ψυχικόν بـ«نفساني».
  rationale: النص يكرر كلمة «جسد» في الطرفين، فلا يبرر تحويل المقابلة إلى مادي مقابل غير مادي. وتحفظ الصياغة التوتر الاصطلاحي، بينما يوضح الهامش الدلالة المحتملة من غير إثقال المتن بالتفسير.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «يُزرَع» للمحافظة على استعارة البذر، و«يُقام» بوصفه التعبير الطبيعي عن القيامة. وُضع مؤشر الهامش بعد أول ورود لعبارة «جسد طبيعي» كما في طبقة المشاورة الإنجليزية.
