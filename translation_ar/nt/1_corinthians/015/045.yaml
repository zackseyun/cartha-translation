  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: ar
  text: 'وهكذا أيضًا كُتب: «صار الإنسان الأول، آدم، نفسًا حيّة»[a]؛ وصار آدم الأخير روحًا مُحييًا[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: «كائنًا حيًا» أو «شخصًا حيًا». ولفظ «نفس» هنا لا يقتضي أن يكون المقصود جزءًا غير مادي منفصلًا عن الجسد.'
    reason: lexical_alternative
  - marker: b
    text: 'ويجوز: «روحًا يعطي الحياة». العبارة وصفية في اليونانية، وتقابل آدم الأخير بآدم الأول؛ ولا تعني بالضرورة تصريحًا بأن المسيح هو الروح القدس بوصفه أقنومًا متميزًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: وهكذا أيضًا كُتب
  rationale: تحفظ العبارة صلة الاستشهاد بما سبق وقوة καί الإضافية، وتستخدم الصيغة العربية المألوفة لتقديم نص كتابي.
- source_word: Ἐγένετο
  choice: صار
  rationale: تفيد الانتقال إلى حالة أو تحقق النتيجة، وهي طبيعية في العربية وأقرب من صياغة مبنية للمجهول مثل «جُعل».
- source_word: ὁ πρῶτος ἄνθρωπος
  choice: الإنسان الأول
  rationale: «الإنسان» تقابل ἄνθρωπος بوضوح، مع بقاء الإشارة إلى آدم بوصفه أول البشر ورأس المقابلة النموذجية.
- source_word: Ἀδὰμ
  choice: آدم
  rationale: الصيغة العربية القياسية للاسم العلم.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: نفسًا حيّة
  rationale: تحفظ الصدى المباشر لعبارة تكوين 2:7 في التقليد العربي، و«نفس» هنا تعني الكائن أو الذات الحية، لا بالضرورة جزءًا غير مادي منفصلًا.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: آدم الأخير
  rationale: تحفظ المقابلة النموذجية والأخروية بين آدم الأول والمسيح، وهي العبارة العربية الراسخة والواضحة.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: روحًا مُحييًا
  rationale: تحفظ الصياغة الوصفية غير المعرّفة في اليونانية؛ و«مُحييًا» تنقل معنى إعطاء الحياة أو الإحياء بإيجاز.
theological_decisions:
- issue: الدلالة الأنثروبولوجية لعبارة ψυχὴν ζῶσαν
  choice: «نفسًا حيّة» مع توضيح معناها في الحاشية
  alternative: «كائنًا حيًا»
  rationale: الصياغة المختارة تحفظ صدى تكوين 2:7 واللفظ التقليدي من غير أن تحسم طبيعة الإنسان إلى ثنائية أنثروبولوجية؛ لذلك توضّح الحاشية أن المقصود يمكن أن يكون الكائن الحي أو الشخص الحي.
- issue: معنى قول النص إن آدم الأخير صار πνεῦμα ζῳοποιοῦν
  choice: «روحًا مُحييًا» بوصف نوعي غير معرّف
  alternative: «الروح المُحيي» أو «روحًا يعطي الحياة»
  rationale: غياب أداة التعريف يجعل العبارة وصفية نوعية، فلا ينبغي أن تُحوَّل في الترجمة إلى تعريف صريح للمسيح بأنه الروح القدس بوصفه أقنومًا متميزًا، كما لا ينبغي تفريغ المقابلة الحرفية بالتفسير داخل المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ التوازي بين «الإنسان الأول، آدم» و«آدم الأخير»، مع تجنب الشرح العقائدي داخل المتن وإيداع البدائل الضرورية في الحواشي.
