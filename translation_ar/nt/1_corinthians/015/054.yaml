base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: ar
  text: 'ولكن متى يلبس هذا القابل للفساد عدم الفساد، ويلبس هذا المائت عدم الموت، فحينئذ يتحقق القول المكتوب: «ابتُلِع الموت في النصر».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اقتباس من إشعياء 25:8، بصياغة توافق التقليد اليوناني الذي يقتبس منه بولس. ويمكن ترجمة «يتحقق القول المكتوب»: «يصير القول المكتوب واقعًا».'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: φθαρτὸν
  choice: القابل للفساد
  rationale: صفة مستعملة استعمال الاسم وتشير إلى الجسد الحاضر المعرّض للفساد؛ وهذه الصياغة واضحة وتحافظ على مقابلتها مع «عدم الفساد».
- source_word: ἐνδύσηται
  choice: لبس
  rationale: يحفظ استعارة ارتداء اللباس الواضحة في اليونانية، ويأتي طبيعيًا مع الصفتين الجديدتين.
- source_word: ἀφθαρσίαν
  choice: عدم الفساد
  rationale: يقابل φθαρτόν مباشرة ويحافظ على التوتر اللفظي بين القابل للفساد والحالة التي لا يلحقها فساد.
- source_word: θνητὸν
  choice: المائت
  rationale: صياغة موجزة لِما هو خاضع للموت، وتقابل طبيعيًا «عدم الموت».
- source_word: ἀθανασίαν
  choice: عدم الموت
  rationale: ينقل معنى انعدام الموت مباشرة ويحافظ على الصلة اللفظية مع «المائت».
- source_word: γενήσεται
  choice: يتمّ
  rationale: يفيد أن القول المكتوب يصير واقعًا عندئذ، بصياغة عربية طبيعية، من غير إدخال صيغة اصطلاحية أقوى مما يقتضيه γίνομαι.
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: القول المكتوب
  rationale: λόγος هنا هو العبارة المقتبسة؛ و«القول المكتوب» أوضح وأطبع عربيًا من الترجمة الحرفية «الكلمة المكتوبة».
- source_word: Κατεπόθη
  choice: ابتُلِع
  rationale: يحفظ المبني للمجهول وصورة الابتلاع من غير تعيين الفاعل الضمني.
- source_word: εἰς νῖκος
  choice: في النصر
  rationale: ينقل نتيجة هزيمة الموت الكاملة، ويحافظ على الصياغة الموجزة لصيغة الاقتباس اليونانية.
theological_decisions:
- issue: دلالة γενήσεται في صلته بالاقتباس الكتابي
  choice: حينئذ يتمّ القول المكتوب
  alternative: حينئذ يحدث القول المكتوب؛ حينئذ يتحقق القول المكتوب
  rationale: «يتمّ» عربية طبيعية تفيد صيرورة القول واقعًا، من دون تحويل الفعل صراحة إلى صيغة تقنية عن إتمام النبوة.
- issue: زمن Κατεπόθη داخل السياق الأخروي المستقبلي
  choice: ابتُلِع الموت في النصر
  alternative: قد ابتُلِع الموت في النصر؛ يُبتلع الموت في النصر
  rationale: الماضي العربي يلائم الماضي اليوناني في الاقتباس ويعرض الحدث، عند بلوغ اللحظة المستقبلية، بوصفه واقعًا منجزًا، مع إبقاء المبني للمجهول.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت استعارة اللباس، والتقابل بين الفساد وعدم الفساد وبين الموت وعدم الموت، والمبني للمجهول في الاقتباس. وُضع مؤشر الحاشية [a] في المتن.
