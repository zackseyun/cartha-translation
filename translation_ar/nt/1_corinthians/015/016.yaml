translation:
  language: ar
  text: لأنه إن كان الأموات لا يُقامون، فحتى المسيح لم يُقَم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لم يُبعث». ولفظ «يُقام» يحافظ بصورة أوضح على صيغة المبني للمجهول في اليونانية وعلى الصلة اللفظية بين إقامة الأموات وإقامة المسيح.'
    reason: alternative_rendering
lexical_decisions:
- source_word: εἰ γὰρ
  choice: لأنه إن كان
  rationale: ينقل γάρ التعليلية وεἰ الشرطية بتركيب عربي طبيعي، ويحافظ على اتصال الحجة بما قبلها.
- source_word: νεκροὶ
  choice: الأموات
  rationale: الصفة اليونانية مستعملة استعمال الاسم وتشير إلى الموتى عمومًا؛ و«الأموات» أفصح مقابل عربي موجز.
- source_word: οὐκ ἐγείρονται
  choice: لا يُقامون
  rationale: يحافظ على المبني للمجهول في المضارع وعلى معنى الإقامة من الموت، من غير تحويل الفعل إلى «يقومون» اللازم.
- source_word: οὐδὲ
  choice: فحتى
  rationale: 'يبرز النتيجة المشددة في الحجة: إذا انتفت إقامة الأموات، فحتى المسيح لم يُقَم.'
- source_word: Χριστὸς
  choice: المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب اليوناني Χριστός، ويحفظ دلالته اللقبية في السياق.
- source_word: ἐγήγερται
  choice: لم يُقَم
  rationale: يحافظ على المبني للمجهول وعلى وقوع فعل الإقامة؛ والسياق العربي مع النفي يفيد أن الإقامة لم تحدث، وإن كان لا يعكس تمامًا الأثر المستمر لصيغة التام اليونانية.
theological_decisions:
- issue: دلالة Χριστός في حجة القيامة
  choice: المسيح
  alternative: الممسوح
  rationale: «المسيح» لقب عربي مفهوم وراسخ يؤدي معنى Χριστός بلا تحويله إلى اسم شخصي محض، أما «الممسوح» فحرفي لكنه غير طبيعي في هذا السياق.
- issue: الفاعل الضمني في إقامة المسيح
  choice: 'الإبقاء على المبني للمجهول: «لم يُقَم»'
  alternative: «لم يُقِمِ اللهُ المسيح»
  rationale: النص اليوناني لا يصرح بالفاعل هنا؛ لذلك لا تُضاف لفظة «الله» رغم إمكان فهمها من السياق اللاهوتي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حوفظ على التوازي اللفظي بين «لا يُقامون» و«لم يُقَم»، وعلى بنية الشرط والنتيجة المشددة دون إضافة فاعل غير مذكور في الأصل.
