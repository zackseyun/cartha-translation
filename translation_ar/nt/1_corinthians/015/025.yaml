  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: ar
  text: فلا بد أن يملك إلى أن يضع جميع أعدائه تحت قدميه.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلى أن يكون قد وضع جميع أعدائه تحت قدميه». لا تفرض الصياغة اليونانية نفسها تمييزًا حاسمًا بين هاتين الصيغتين العربيتين من جهة تمام الفعل.'
    reason: lexical_alternative
  - marker: b
    text: صورة وضع الأعداء «تحت قدميه» تعبير كتابي عن الإخضاع التام؛ قارن مزمور 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: لا بد
  rationale: تعبّر عن الضرورة أو الحتمية الإلهية بقوة ووضوح، من غير توسع تفسيري.
- source_word: γὰρ
  choice: فـ
  rationale: تحفظ الصلة التعليلية بما قبلها بصياغة عربية طبيعية موجزة.
- source_word: αὐτὸν
  choice: ضمير مستتر في «يملك»
  rationale: هو فاعل المصدر في التركيب اليوناني، وتؤديه العربية طبيعيًا بفاعل مستتر يعود إلى المسيح المذكور في السياق.
- source_word: βασιλεύειν
  choice: يملك
  rationale: ينقل معنى ممارسة الحكم الملكي بلفظ كتابي عربي واضح ومألوف.
- source_word: ἄχρι οὗ
  choice: إلى أن
  rationale: تحدد غاية زمنية، ولا تفيد بذاتها أن المُلك ينتهي بعد بلوغها.
- source_word: θῇ
  choice: يضع
  rationale: ينقل فعل τίθημι وصيغة الجملة بعد «إلى أن» بصورة عربية طبيعية؛ ولا تلزم الصياغة اليونانية هنا اختيار صيغة عربية تفيد تمام الفعل صراحة.
- source_word: πάντας τοὺς ἐχθροὺς
  choice: جميع أعدائه
  rationale: تحفظ الشمول، وتوضح طبيعيًا أن الأعداء منسوبون إليه في السياق.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: تحت قدميه
  rationale: تحفظ الصورة الكتابية الدالة على الإخضاع التام، مع صدى مزمور 110:1.
theological_decisions:
- issue: الدلالة الزمنية لعبارة ἄχρι οὗ
  choice: «إلى أن» من غير الإيحاء بأن مُلك المسيح ينتهي بعد إخضاع الأعداء.
  alternative: صياغة توحي بأن مُلكه يتوقف حين يُخضع الأعداء.
  rationale: التركيب اليوناني يحدد الغاية الزمنية التي يركز عليها الكلام، لكنه لا يقرر بذاته ما إذا كان المُلك يستمر بعدها أم لا؛ لذلك تُحفظ المسألة دون حسم زائد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «يملك» للحكم الملكي، و«فلا بد» للجمع الطبيعي بين أداة التعليل ومعنى الضرورة. أُبقيت الصورة المجازية كما هي، وحُفظ غموض «إلى أن» بشأن ما بعد الغاية الزمنية.
