  text: δι’ οὗ καὶ σῴζεσθε, τίνι λόγῳ εὐηγγελισάμην ὑμῖν, εἰ κατέχετε, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: ar
  text: وبه أيضًا تُخلَّصون[a]، إن كنتم تتمسكون بالرسالة التي بشّرتكم بها[b]—إلا إذا كنتم قد آمنتم عبثًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وبه أيضًا يجري خلاصكم»، أو: «وبه أيضًا أنتم مخلَّصون». قد يدل المضارع اليوناني على خلاص مستمر أو على حقيقة عامة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «إن كنتم تتمسكون بأيّة كلمة/رسالة بشّرتكم بها». وتُفهم العبارة في السياق على أنها تشير إلى صيغة الرسالة أو مضمونها الذي أعلنه بولس لهم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: وبه
  rationale: تحافظ الباء على معنى الوسيلة في διά مع المجرور، ويعود الضمير إلى الإنجيل المذكور في الآية السابقة.
- source_word: σῴζεσθε
  choice: تخلُصون
  rationale: صيغة المضارع المبني للمجهول تدل على الخلاص الواقع لهم، وقد تحتمل في اليونانية معنى جاريًا أو عامًا؛ العربية الطبيعية هنا لا تحسم هذا الفرق، لذلك توضحه الحاشية.
- source_word: τίνι λόγῳ
  choice: بالرسالة
  rationale: λόγος هنا هو مضمون البشارة وصيغتها التي ينبغي التمسك بها. «الرسالة» أوضح للقارئ العربي من الترجمة الحرفية «الكلمة»، مع إثبات التركيب الأقرب حرفيًا في الحاشية.
- source_word: εὐηγγελισάμην
  choice: بشّرتكم بها
  rationale: الفعل يعني إعلان الخبر السار؛ و«بشّر» المقابل العربي الطبيعي الموجز الذي يحفظ صلته بالإنجيل.
- source_word: κατέχετε
  choice: تتمسكون
  rationale: يفيد الاستمرار في الإمساك بالشيء والاحتفاظ به؛ و«تتمسكون» تعبير عربي واضح يحفظ قوة الشرط.
- source_word: ἐκτὸς εἰ μὴ
  choice: إلا إن
  rationale: ينقل تركيب الاستثناء اليوناني دون إضافة دلالة تفسيرية ليست في النص.
- source_word: εἰκῇ
  choice: عبثًا
  rationale: يفيد ما هو باطل أو عديم الجدوى أو النتيجة؛ و«عبثًا» موجزة وطبيعية وتحفظ التحذير.
- source_word: ἐπιστεύσατε
  choice: قد آمنتم
  rationale: ينقل فعل الإيمان الماضي المشار إليه بصيغة الماضي اليونانية، و«قد» تلائم السياق الشرطي الاستثنائي.
theological_decisions:
- issue: دلالة المضارع في σῴζεσθε
  choice: تخلُصون، مع حاشية تبيّن احتمال «يجري خلاصكم»
  alternative: أنتم مخلَّصون
  rationale: الصيغة اليونانية قد تُفهم على أنها عملية جارية أو تقرير عام. يحافظ النص العربي والحاشية على الاحتمالين من غير فرض مذهب بعينه في مراحل الخلاص.
- issue: الشرط εἰ κατέχετε
  choice: إن كنتم تتمسكون
  alternative: إذ إنكم تتمسكون؛ أو صياغته كعلامة تثبت صحة الإيمان
  rationale: أُبقي الشرط الحقيقي كما ورد، من غير تحويله إلى افتراض مؤكد أو تفسيره مذهبيًا على أنه مجرد دليل.
- issue: الاستثناء ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε
  choice: إلا إن كنتم قد آمنتم عبثًا
  alternative: إلا إذا كان إيمانكم بلا سبب
  rationale: يحفظ التحذير من إيمان عديم الجدوى أو النتيجة، من غير تحديد مسبق لطبيعة بطلانه.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «الرسالة» بدل «الكلمة» في المتن لوضوح الإحالة إلى مضمون الإنجيل، مع حفظ البنية الحرفية في الحاشية. وُضعت علامتا الحاشية في موضعيهما داخل النص.
