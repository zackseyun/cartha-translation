    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: أفيقوا
  rationale: فعل أمر حاسم يستحضر حرفيًا الإفاقة من السُّكر، ويُستعمل هنا مجازًا للرجوع إلى صفاء الوعي؛ و«أفيقوا» يحفظ الصورة وقوة الأمر بعبارة عربية طبيعية.
- source_word: δικαίως
  choice: كما ينبغي
  rationale: حال يبيّن كيفية الإفاقة بمعنى صحيح أو لائق، من غير تحميل اللفظ دلالة اصطلاحية أثقل عن البر.
- source_word: μὴ ἁμαρτάνετε
  choice: لا تستمروا في الخطية
  rationale: المضارع مع النهي قد يفيد الاستمرار أو الاعتياد؛ والصياغة تحافظ على هذه الدلالة من غير الجزم بأن كل المخاطبين يمارسون الفعل نفسه آنذاك.
- source_word: ἀγνωσίαν θεοῦ
  choice: يجهلون الله
  rationale: ينقل تركيب «لهم جهل بالله» إلى فعل عربي طبيعي، مع إبقاء الله مفعول المعرفة المقصودة وعدم تضييق المعنى إلى معلومات عنه فقط.
- source_word: τινες
  choice: بعضكم
  rationale: يشير إلى فئة من المخاطبين أو المرتبطين بهم؛ أُظهر ضمير الخطاب لأن السياق والعبارة الختامية يوجهان التوبيخ إلى الجماعة.
- source_word: πρὸς ἐντροπὴν ὑμῖν λαλῶ
  choice: أقول هذا لإخجالكم
  rationale: صياغة عربية مباشرة تحفظ غرض الكلام أو أثره المقصود، كما تحفظ نبرة بولس التوبيخية.
theological_decisions:
- issue: القوة الأخلاقية لكلمة δικαίως
  choice: كما ينبغي
  alternative: بالبر أو باستقامة
  rationale: العبارة تحمل توجيهًا أخلاقيًا، لكن اللفظ هنا حال يصف الإفاقة بأنها صحيحة ولائقة؛ لذا تجنبت الصياغة التي قد توحي بمفهوم بولسي اصطلاحي عن التبرير.
- issue: طبيعة الجهل بالله
  choice: يجهلون الله
  alternative: لديهم جهل بالله أو لا يعرفون عن الله
  rationale: يحفظ الاختيار قوة المضاف إليه في اليونانية وإمكان أن يكون المقصود غياب معرفة الله، لا مجرد نقص معلومات دينية عنه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أفيقوا» للإبقاء على الصورة الحية في الأصل، و«كما ينبغي» لتجنب الثقل الاصطلاحي، و«الخطية» بوصفها لفظًا كتابيًا مفهومًا وشائعًا.
