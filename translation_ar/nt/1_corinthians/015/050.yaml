base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: ar
  text: 'وأقول هذا[a]، أيها الإخوة: إن اللحم والدم لا يستطيعان أن يرثا ملكوت الله[b]، وما يفسد لا يرث ما لا يفسد.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أيها الإخوة والأخوات»؛ فاللفظ اليوناني هو «الإخوة»، وقد يُستعمل هنا خطابًا يشمل جماعة المؤمنين كلها.'
    reason: lexical_alternative
  - marker: b
    text: «اللحم والدم» تعبير عن الحياة البشرية المائتة في حالتها الحاضرة، وليس إنكارًا لقيامة الجسد.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: وأقول هذا
  rationale: تحافظ الصياغة على قول بولس المباشر، وتنقل δέ بواو استئنافية طبيعية من غير إدخال ظرف زمني غير موجود في الأصل.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: تحافظ على صيغة الجمع المذكر في اليونانية بوصفها نداءً مباشرًا، مع بيان احتمال شمولها جماعة المؤمنين كلها في الحاشية.
- source_word: σὰρξ καὶ αἷμα
  choice: اللحم والدم
  rationale: تنقل العبارة الاصطلاحية بصورتها الملموسة المألوفة، وهي تشير في السياق إلى الحياة البشرية المائتة في حالتها الحاضرة.
- source_word: βασιλείαν θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي واضح يحافظ على الإضافة وعلى الثقل اللاهوتي للعبارة.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: يرثا / يرث
  rationale: يحافظ فعل «يرث» على صورة الميراث وعلى التوازي بين شطري الآية.
- source_word: οὐ δύναται
  choice: لا يستطيعان
  rationale: ينقل معنى عدم القدرة بوضوح، مع مطابقة الفعل للمركب «اللحم والدم» باعتبار جزأيه.
- source_word: ἡ φθορά
  choice: الفساد
  rationale: يحافظ على الاسم المجرّد في اليونانية وعلى صلته بالتحلل والفناء في سياق القيامة.
- source_word: τὴν ἀφθαρσίαν
  choice: عدم الفساد
  rationale: ينقل التضاد الصرفي الدقيق بين φθορά وἀφθαρσία، ولا يساويه خطأً بعدم الموت الذي يعبّر عنه لفظ يوناني آخر.
theological_decisions:
- issue: دلالة «اللحم والدم» بالنسبة إلى القيامة
  choice: الإبقاء على العبارة الاصطلاحية مع فهمها بوصفها تشير إلى الوجود البشري المائت القابل للفساد في حالته الحاضرة.
  alternative: اعتبارها نفيًا لدخول الجسد أو المادة في ملكوت الله من حيث هما كذلك.
  rationale: السياق القريب يتحدث عن تحوّل الجسد من الفساد إلى عدم الفساد، لا عن إلغاء التجسد؛ لذلك تُحفظ العبارة ويُوضَّح معناها السياقي في الحاشية.
- issue: مدلول النداء ἀδελφοί
  choice: «أيها الإخوة» في المتن، مع التنبيه إلى إمكان شموله الرجال والنساء في الجماعة.
  alternative: «أيها الإخوة والأخوات» في المتن.
  rationale: تحفظ الصياغة جنس اللفظ اليوناني، من غير حجب استعماله المحتمل بوصفه خطابًا جامعًا لكل الكنيسة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. حُفظت العبارة الاصطلاحية «اللحم والدم» والتقابل اللفظي «الفساد/عدم الفساد»، واستُعمل «ملكوت الله» لاتساقه مع الأسلوب الكتابي العربي الشائع.
