base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: ar
  text: يُزرَع في هوان، ويُقام في مجد؛ يُزرَع في ضعف، ويُقام في قوة.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: يُزرَع
  rationale: يحافظ على صيغة المبني للمجهول وعلى استعارة البذر التي يطوّرها بولس في السياق، من غير تحويلها إلى تعبير عام مثل «يُدفن».
- source_word: ἀτιμίᾳ
  choice: هوان
  rationale: ينقل معنى انعدام الكرامة أو الشرف، ويقيم مقابلة عربية واضحة وموجزة مع «مجد» من غير حصر المعنى في شعور الخجل.
- source_word: ἐγείρεται
  choice: يُقام
  rationale: هو التعبير العربي الطبيعي في سياق القيامة، ويحفظ المبني للمجهول بحيث تبقى فاعلية الله مفهومة ضمنًا من غير إضافتها إلى النص.
- source_word: δόξῃ
  choice: مجد
  rationale: ينقل المعنى الواسع والثقيل لِـδόξα في سياق القيامة، ويحفظ المقابلة مع «هوان».
- source_word: ἀσθενείᾳ
  choice: ضعف
  rationale: مقابل مباشر وطبيعي يشمل وهن الجسد من غير تضييق الدلالة على العجز الجسدي وحده.
- source_word: δυνάμει
  choice: قوة
  rationale: يحفظ التضاد مع «ضعف»، ويمكن أن يدل على قدرة حياة القيامة المتحوّلة، لا على القوة العضلية وحدها.
theological_decisions:
- issue: الصيغة والفاعل في لغة القيامة
  choice: 'استعمال المبني للمجهول: «يُقام» من غير تسمية الله فاعلًا في المتن.'
  alternative: «يقيمه الله»
  rationale: الأصل اليوناني مبني للمجهول، والحفاظ على ذلك يترك الفاعل الإلهي مفهومًا ضمنًا كما في النص ولا يضيف تصريحًا غير وارد.
- issue: مرجع الفاعل المستتر
  choice: ترك «الجسد» مفهومًا من السياق مع أفعال مفردة مذكرة.
  alternative: تكرار «الجسد يُزرع... الجسد يُقام»
  rationale: الجسد هو المرجع المباشر في السياق السابق، والعربية تستغني طبيعيًا عن تكراره وتحافظ بذلك على إيقاع المقابلات الموجز.
- issue: دلالة حرف الجر ἐν في المقابلات الأربع
  choice: 'ترجمته بـ«في» للدلالة على الحال أو المجال: «في هوان... في مجد».'
  alternative: 'استعمال الباء: «بهوان... بمجد»'
  rationale: «في» تحافظ على سعة التركيب اليوناني، فلا تحسم إن كانت الألفاظ تصف الحال أو الكيفية، وتنتظم طبيعيًا في التوازي.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة، ذات توازٍ إيقاعي يحاكي الجمل اليونانية الأربع. استُخدمت الفاصلة المنقوطة للفصل بين ثنائيي المقابلة، مع إبقاء الاستعارة والفاعل الإلهي الضمني من غير شرح داخل المتن.
