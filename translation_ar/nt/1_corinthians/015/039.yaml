  source_fidelity: 'النص العربي ينقل المقابلة التصنيفية في اليونانية بأمانة: نفيُ تماثل الأجساد، ثم التعداد المتوازي للناس والبهائم والطيور والأسماك. واستعمال «جسد» هنا عربيٌّ طبيعي في الحديث عن صور الكائنات الحية وأجسامها، ولا يحمّل σάρξ معنىً أخلاقيًّا مجازيًّا. وعبارة «من النوع نفسه» توضح المقصود السياقي من دون تغيير المعنى.'
