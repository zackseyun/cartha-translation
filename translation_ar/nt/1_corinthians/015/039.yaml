base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: ar
  text: ليس كلُّ جسدٍ من النوع نفسه[a]، بل للناس جسدٌ، وللبهائم جسدٌ آخر، وللطيور جسدٌ آخر، وللأسماك جسدٌ آخر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «ليس كلُّ جسدٍ هو الجسد نفسه». ويمكن أن تُترجم: «ليست كل الأجساد متماثلة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὰρξ
  choice: جسد
  rationale: تَرِد الكلمة هنا بمعناها الحسي في سياق اختلاف الأجسام المخلوقة، لا بمعنى أخلاقي أو مجازي. واختيار «جسد» أوضح في العربية المعاصرة من «لحم» عند المقارنة بين أنواع الكائنات، مع الحفاظ على تكرار اللفظة في تعداد بولس.
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: ليس كلُّ جسدٍ من النوع نفسه
  rationale: صياغة عربية طبيعية تنقل نفي التطابق بين أنواع الأجساد. أُضيفت عبارة «من النوع» لإيضاح المقصود التصنيفي الذي يدل عليه السياق، مع إثبات بديل أقرب إلى تكرار اليونانية في الحاشية.
- source_word: ἄλλη
  choice: آخر
  rationale: تفيد التمييز بين فئات متعاقبة، وتكرار «آخر» يحافظ على إيقاع التعداد في النص اليوناني.
- source_word: ἀνθρώπων
  choice: الناس
  rationale: تشمل البشر عمومًا دون قصر اللفظ على الذكور، وتلائم المقابلة مع سائر المخلوقات.
- source_word: κτηνῶν
  choice: البهائم
  rationale: اللفظة اليونانية تشير في المعتاد إلى الدواب أو الحيوانات، ولا سيما ذوات الأربع؛ و«البهائم» تحافظ على تمييز هذه الفئة عن الطيور والأسماك دون استعمال «الحيوانات» بالمعنى العربي الشامل الذي قد يضمها جميعًا.
- source_word: πτηνῶν
  choice: الطيور
  rationale: المقابل العربي الطبيعي الواضح لفئة الكائنات الطائرة في هذا التعداد.
- source_word: ἰχθύων
  choice: الأسماك
  rationale: المقابل العربي المباشر للجمع اليوناني، ويؤدي المعنى التصنيفي بوضوح.
theological_decisions:
- issue: دلالة σάρξ في سياق القيامة
  choice: جسد بالمعنى الحسي
  alternative: لحم؛ أو طبيعة
  rationale: السياق يقارن بين الأجسام المخلوقة تمهيدًا للحديث عن القيامة، لذلك لا تحمل الكلمة هنا معنى «الطبيعة الخاطئة». واختيار «جسد» يمنع هذا الفهم المجازي مع بقاء الدلالة الجسدية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على التوازي البلاغي بتكرار «جسدٌ آخر»، مع تقديم الجار والمجرور في «للناس جسدٌ» لتكوين قائمة عربية سلسة. استُخدمت «البهائم» بدل «الحيوانات» لأن الأخيرة قد تشمل في الاستعمال العلمي الطيور والأسماك أيضًا.
