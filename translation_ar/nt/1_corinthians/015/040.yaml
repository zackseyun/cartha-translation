  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: ar
  text: وهناك أيضًا أجساد سماوية وأجساد أرضية؛ لكن مجد الأجساد السماوية يختلف عن مجد الأجساد الأرضية.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أجرام سماوية وأجرام أرضية».'
    reason: بديل معجمي لـ«أجساد سماوية وأجساد أرضية»؛ وقد يوحي بسياق فلكي أضيق، لذلك يبقى النص الرئيس عامًا كما في اليونانية.
lexical_decisions:
- source_word: σώματα
  choice: أجساد
  rationale: المعنى المباشر هو «أجساد»، وهذا يحفظ عموم الصورة من غير حصرها في أجرام فلكية أو كائنات بعينها.
- source_word: ἐπουράνια
  choice: سماوية
  rationale: «سماوية» لفظ طبيعي يقابل «أرضية»، ويحفظ إمكان الدلالة على ما ينتمي إلى السماء من غير تضييق المعنى على المجال الفلكي.
- source_word: ἐπίγεια
  choice: أرضية
  rationale: «أرضية» تؤدي معنى ما هو على الأرض أو منسوب إليها، وتكوّن مقابلة واضحة مع «سماوية».
- source_word: ἀλλὰ
  choice: لكن
  rationale: تنقل أداة الاستدراك والمقابلة ببساطة ووضوح.
- source_word: ἑτέρα ... ἑτέρα
  choice: من نوع ... من نوع آخر
  rationale: تبرز اختلاف الصنف أو الكيفية، بدل الاكتفاء بتكرار «مختلف»، وتلائم العربية المعاصرة.
- source_word: δόξα
  choice: مجد
  rationale: يحفظ المصطلح اللاهوتي الواسع، مع اشتماله هنا على معنى البهاء أو الروعة المميزة.
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: السماوية ... الأرضية
  rationale: يحافظ على الإيجاز الموجود في اليونانية، إذ يعود الوصفان إلى «الأجساد» المذكورة في صدر الآية.
theological_decisions:
- issue: المراد بـ«الأجساد السماوية» و«الأجساد الأرضية»
  choice: إبقاء التعبير عامًا من غير حصر المرجع
  alternative: تفسيرها صراحة بأنها أجرام سماوية وأجسام أرضية، أو بأنها كائنات سماوية وأرضية
  rationale: النص يستعمل «أجسادًا» ويقيم مقارنة بين أنواعها وأمجادها؛ لذا يحفظ التعبير العام سعة الصورة والتوتر التفسيري من غير إدخال تحديد فلكي أو ملائكي.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت المقابلة «سماوية/أرضية» وحُفظ لفظ «مجد» لاتساع دلالته، مع صياغة «من نوع... من نوع آخر» لإظهار قوة ἑτέρα ... ἑτέρα.
