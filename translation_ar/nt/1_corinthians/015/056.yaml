  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: ar
  text: شَوْكَةُ الْمَوْتِ هِيَ الْخَطِيئَةُ، وَقُوَّةُ[a] الْخَطِيئَةِ هِيَ الشَّرِيعَةُ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قدرة الخطية».'
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن تشير «الشريعة» هنا، في سياق حجة بولس، بوجه خاص إلى شريعة موسى، مع أن الصياغة تسمح أيضًا بالمعنى الأوسع لدور الشريعة في كشف الخطية وزيادة حدتها.
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: شَوْكَة
  rationale: تنقل صورة الطرف الحاد المؤذي الذي يلسع به الموت، وهي الأنسب في سياق تشخيص الموت وفي ضوء الآية السابقة، مع أن اللفظة قد تدل في سياقات أخرى على مِهْماز أو منخس.
- source_word: θανάτου
  choice: الْمَوْتِ
  rationale: تحافظ الإضافة العربية في «شوكة الموت» على علاقة الملكية أو الارتباط التي تفيدها صيغة المضاف إليه اليونانية.
- source_word: ἁμαρτία
  choice: الْخَطِيئَةُ
  rationale: أُبقي المفرد لأن بولس يتحدث عن الخطية بوصفها قوة أو مبدأ فاعلًا، لا عن خطايا منفردة فحسب.
- source_word: δύναμις
  choice: قُوَّةُ
  rationale: «قوة» لفظ عربي طبيعي ينقل معنى الفاعلية والاقتدار اللذين تنالهما الخطية، مع إمكان «قدرة» بوصفها بديلًا معجميًا.
- source_word: νόμος
  choice: الشَّرِيعَةُ
  rationale: «الشريعة» أوضح في العربية المعاصرة من «الناموس»، وتحفظ الصلة المرجحة بشريعة موسى من غير إضافة اسم موسى إلى النص، مع إبقاء إمكان المعنى الأوسع لدور الشريعة في كشف الخطية وإبرازها.
- source_word: δὲ
  choice: وَ
  rationale: تؤدي الواو الانتقال والتتابع التفسيري بين الجملتين من غير افتعال مقابلة قوية أو إضافة ظرف زمني غير موجود في الأصل.
theological_decisions:
- issue: المقصود بـ«الشريعة» في القول إنها قوة الخطية
  choice: استعمال «الشريعة» من غير تقييدها صراحةً بشريعة موسى
  alternative: «شريعة موسى» على وجه التحديد، أو «القانون» بمعنى عام
  rationale: يرجح سياق بولس صلته بشريعة موسى، لكن اللفظ اليوناني نفسه لا يصرح بهذا التقييد هنا؛ لذلك تحافظ الصياغة على التوتر بين المرجع الموسوي المرجح والدور الأوسع للشريعة في كشف الخطية وإبراز فاعليتها.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة، ببنية اسمية موجزة توازي الأصل. استُعملت «الشريعة» بدل «الناموس» لأنها أيسر للقارئ المعاصر، ووُضعت علامتا الحاشيتين عند اللفظتين اللتين تفسرهما كل حاشية.
