lexical_decisions:
- source_word: ποῦ
  choice: أين
  rationale: أداة استفهام مكانية تأتي هنا في سؤال بلاغي ينطوي على التحدي؛ و«أين» تنقل القوة المباشرة من غير إضافة توكيد غير موجود في اليونانية.
- source_word: σου
  choice: ـك
  rationale: ضمير المخاطب في حالة المضاف إليه يفيد الملكية، وتنقله لاحقة المخاطب العربية بصورة طبيعية في «نصرك» و«شوكتك».
- source_word: θάνατε
  choice: يا موت
  rationale: صيغة نداء تخاطب الموت بوصفه مُشخَّصًا؛ وأداة النداء «يا» تحفظ القوة الشعرية والخطابية بوضوح في العربية المعاصرة.
- source_word: νῖκος
  choice: نصر
  rationale: يدل اللفظ على الغلبة أو الانتصار. واختيار «نصر» واضح وموجز، ويتسق مع سياق الآية السابقة عن ابتلاع الموت في النصر.
- source_word: κέντρον
  choice: شوكة
  rationale: يمكن أن يدل اللفظ على شوكة اللسع أو المهماز، و«شوكة» هي المقابل العربي الطبيعي هنا، ولا سيما أن الآية التالية تشرح شوكة الموت.
theological_decisions:
- issue: قراءة النص النقدي في العبارة الأولى
  choice: ترجمة νῖκος بـ«نصر» في المتن
  alternative: «أين شوكتك يا موت؟» وفق قراءة مخطوطية بديلة
  rationale: نص SBLGNT المعطى يقرأ νῖκος في العبارة الأولى، فينتج التقابل «نصرك... شوكتك». وهذا يوافق أيضًا سياق الآية السابقة. حُفظت القراءة الأخرى في الحاشية لأهميتها النصية والتقليدية من دون إحلالها محل نص المصدر المعتمد.
translation_notes:
  register: عربية فصحى حديثة، موجزة وشعرية. قُدِّم المضاف «نصرك» و«شوكتك» قبل المنادى للمحافظة على ترتيب السؤال اليوناني وقوة التحدي، مع تكرار «يا موت» في العبارتين كما في نص المصدر.
