lexical_decisions:
- source_word: ἰδοὺ
  choice: ها أنا
  rationale: تؤدي وظيفة التنبيه إلى إعلان مهم، وتنسجم طبيعيًّا مع الفعل المتكلم «أقول» في العربية الفصحى المعاصرة.
- source_word: μυστήριον
  choice: سرًّا
  rationale: يدل في الاستعمال البولسي على حقيقة إلهية كانت خفية ثم أُعلنت، لا على أمر غامض يستعصي على الفهم؛ و«سرّ» واضحة وتحفظ هذا المعنى.
- source_word: ὑμῖν λέγω
  choice: أقول لكم
  rationale: صياغة مباشرة تحفظ المخاطبة وقوة التصريح في الأصل.
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: لن نرقد جميعًا
  rationale: 'تحفظ استعارة الرقاد للموت، كما تحفظ نطاق النفي في اليونانية: ليس الجميع سيرقدون، لا أن الجميع لن يرقدوا.'
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: لكننا جميعًا سنتغيّر
  rationale: تفيد ἀλλάσσω هنا التحول الآتي، وتُظهر «لكن» المقابلة بين عدم رقاد الجميع وتغيّر الجميع.
theological_decisions:
- issue: معنى «نرقد» في سياق القيامة
  choice: الإبقاء على الرقاد استعارةً للموت الجسدي في انتظار القيامة
  alternative: لن نمت جميعًا
  rationale: يحفظ هذا تعبير بولس وصلة الكلام بسياق القيامة، من غير أن يفرض رأيًا خاصًّا في حالة الإنسان بين الموت والقيامة.
- issue: الاختلاف النصي في ترتيب الجملتين ومعناهما
  choice: 'اتباع نص SBLGNT: «لن نرقد جميعًا، لكننا جميعًا سنتغيّر»'
  alternative: 'قراءة مشهورة تفيد: «سنرقد جميعًا، لكننا لن نتغيّر جميعًا»'
  rationale: النص اليوناني المقدم يؤيد بوضوح صياغة المتن، أما القراءة الأخرى فذات دلالة تفسيرية ولذلك تُذكر في الحاشية ولا تُعتمد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة مهيبة بلا تكلّف. وُضعت علامة الحاشية [a] بعد «نرقد جميعًا» لأنها تشرح استعارة الرقاد، وعلامة [b] بعد «سنتغيّر» لأنها تتعلق بالقراءة النصية البديلة.
