reference: 1 Corinthians 15:15
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: ar
  text: ونُوجَد أيضًا شهودَ زورٍ في شأن الله[a]، لأننا شهدنا ضد الله بأنه أقام المسيح[b]، الذي لم يُقِمْه إن كان الموتى حقًّا لا يُقامون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «شهود زور لله». يمكن أن يُفهم المضاف إليه بمعنى «في شأن الله» أو «فيما يتعلق بالله».'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: Χριστός، أي «المسيح»، وهو لقب هنا.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρισκόμεθα
  choice: نُوجَد
  rationale: يحافظ المبني للمجهول في المضارع على معنى انكشاف حالهم وثبوت أنهم كذلك ضمن الحجة.
- source_word: δὲ καὶ
  choice: بل ... أيضًا
  rationale: تنقل «بل» الانتقال الاستدلالي ذي النبرة التصاعدية، وتحفظ «أيضًا» القوة الإضافية.
- source_word: ψευδομάρτυρες
  choice: شهودَ زورٍ
  rationale: تعبير عربي فصيح ومألوف يدل بدقة على من يقدم شهادة كاذبة.
- source_word: τοῦ θεοῦ
  choice: على الله
  rationale: يُفهم المضاف إليه هنا على أنه متعلق بموضوع الشهادة؛ و«شهود زور على الله» صياغة عربية طبيعية تحتمل الشهادة بشأن الله، مع بقاء حدة السياق.
- source_word: ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ
  choice: شهدنا على الله
  rationale: تحفظ «على» إمكان فهم κατά مع المضاف إليه بمعنى الشهادة بشأن الله، كما يمكن أن تحمل إيحاء الشهادة المناوئة له إن كانت الدعوى باطلة، فلا تُحسم الدلالة المتوترة بلا ضرورة.
- source_word: ἤγειρεν
  choice: أقام
  rationale: فعل ماضٍ بسيط يلائم الأوريست ويعبّر اصطلاحيًا عن إقامة الله للمسيح من الموت.
- source_word: τὸν Χριστόν
  choice: المسيح
  rationale: المقابل العربي الراسخ للقب Χριστός، ويحفظ وظيفته اللقبية هنا.
- source_word: εἴπερ ἄρα
  choice: إن كان ... حقًّا
  rationale: تنقل الشرط المفترض لأجل الحجة مع توكيد واقعيته المفترضة.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: الموتى لا يُقامون
  rationale: يحفظ العموم وصيغة المبني للمجهول، بحيث تبقى القيامة فعلًا يُجرى للموتى.
theological_decisions:
- issue: دلالة κατὰ τοῦ θεοῦ
  choice: شهدنا على الله
  alternative: شهدنا ضد الله / شهدنا عن الله
  rationale: 'قد تدل κατά مع المضاف إليه على المناوأة، لكن السياق يتناول أيضًا مضمون الشهادة عن فعل الله. وتسمح «على الله» في العربية ببقاء التوتر: إنها شهادة منسوبة إلى الله، وتغدو عليه وضده إن كانت كاذبة.'
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: المسيح المنتظر / كريستوس
  rationale: «المسيح» هو المقابل العربي الطبيعي والراسخ للقب، من غير إضافة تفسير عقائدي غير موجود في النص.
- issue: المبني للمجهول في قيامة الموتى
  choice: لا يُقامون
  alternative: لا يقومون
  rationale: يحفظ المبني للمجهول في اليونانية ولا يحوّل العبارة إلى نهوض ذاتي، من غير التصريح بفاعل لم يذكره هذا الشطر.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي بين «أقام» و«لم يُقِمْه» وبين الشهادة وموضوعها، مع تجنب حسم الغموض الحقيقي في علاقة الشهادة بالله.
