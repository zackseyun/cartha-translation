source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: ar
  text: 'فإنني سلَّمتُ إليكم، في المقام الأول[a]، ما تسلَّمتُه أنا أيضًا: أنَّ المسيح مات من أجل خطايانا، بحسب الكتب المقدسة[b]،'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في جملة أول الأمور»؛ فقد تشير العبارة أيضًا إلى الترتيب، لا إلى الأهمية وحدها.'
    reason: lexical_alternative
  - marker: b
    text: 'أي: «وفقًا لما تقوله الكتب المقدسة».'
    reason: lexical_clarification
lexical_decisions:
- source_word: Παρέδωκα
  choice: سلَّمتُ
  rationale: يفيد الفعل هنا نقل تعليم أو تقليد سبق تسلّمه، و«سلَّمتُ» يحفظ التوازي المقصود مع «تسلَّمتُه» ويحمل معنى النقل الموثوق.
- source_word: γὰρ
  choice: فإنني
  rationale: تربط الفاء والإنّ الجملة بما قبلها بوصفها تعليلًا أو شرحًا، في أسلوب عربي واضح.
- source_word: ἐν πρώτοις
  choice: في المقام الأول
  rationale: يرجّح السياق معنى الأولوية في الأهمية، مع إثبات احتمال الدلالة على الترتيب في الحاشية.
- source_word: ὃ καὶ παρέλαβον
  choice: ما تسلَّمتُه أنا أيضًا
  rationale: يحفظ مضمون الموصول والتوازي بين ما تسلّمه بولس وما سلّمه للآخرين، وتفيد «أيضًا» معنى καί.
- source_word: Χριστὸς
  choice: المسيح
  rationale: اللفظ اليوناني لقب ذو دلالة مسيانية هنا، و«المسيح» هو المقابل العربي الطبيعي الراسخ الذي يحفظ قوة اللقب.
- source_word: ἀπέθανεν
  choice: مات
  rationale: الماضي البسيط يلائم صيغة الماضي اليونانية في هذا الملخص الإقراري.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: من أجل خطايانا
  rationale: صياغة عربية طبيعية تحفظ المعنى الخلاصي الواسع لعبارة ὑπέρ من غير أن تحسم نظرية محددة للكفارة.
- source_word: κατὰ τὰς γραφάς
  choice: بحسب الكتب المقدسة
  rationale: تنقل معنى المطابقة أو الموافقة، وتحفظ صيغة الجمع في γραφάς.
theological_decisions:
- issue: دلالة Χριστός بوصفه لقبًا
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» في العربية لقب واضح وراسخ، ويحفظ الدلالة اليهودية المسيانية من غير تحويل اللفظ إلى اسم شخصي محض.
- issue: قوة ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: من أجل خطايانا
  alternative: عن خطايانا
  rationale: المختار يثبت أن موته كان متعلقًا بخطايانا ولأجلها، لكنه لا يضيف إلى العبارة اليونانية تحديدًا تقنيًا لكيفية الكفارة.
- issue: معنى ἐν πρώτοις
  choice: الأولوية في الأهمية
  alternative: الأولوية في الترتيب الزمني
  rationale: سياق تلخيص جوهر البشارة يرجّح الأهمية، لكن تركيب العبارة يحتمل أيضًا معنى «من أول الأمور»، ولذلك ذُكر الاحتمال في الحاشية.
translation_notes:
  register: صياغة عربية فصحى معاصرة ذات نبرة كريمة وواضحة. استُخدم التوازي «سلَّمتُ/تسلَّمتُ» لإبراز انتقال التعليم، وحُفظت الفاصلة الختامية لأن الجملة تستمر في العدد التالي.
