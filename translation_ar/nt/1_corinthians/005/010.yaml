  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: ar
  text: لا أعني إطلاقًا أصحابَ الفجور الجنسي من هذا العالم[a]، أو الجشعين والسالبين[b]، أو عَبَدة الأوثان؛ وإلا لكان عليكم أن تخرجوا من العالم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي الذين يعيشون في هذا العالم خارج جماعة المؤمنين؛ يوضح بولس أنه لم يقصد وجوب تجنب جميع أصحاب الفجور في المجتمع.
    reason: clarification
  - marker: b
    text: 'يمكن أن تُترجم «السالبين» أيضًا: «الناهبين» أو «المبتزّين»؛ فاللفظ اليوناني قد يدل على من ينتزع ما للآخرين بالقوة أو الاستغلال. وانظر تطبيق الكلام في 1 كورنثوس 5:11.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: ولم أقصد إطلاقًا
  rationale: يفيد التعبير في السياق توضيحًا نافياً لفهمٍ مطلق للكلام السابق، لا نفيًا مجردًا؛ وهذه الصياغة عربية طبيعية تحفظ قوة التوضيح.
- source_word: πόρνοις
  choice: زناة
  rationale: يدل اللفظ على المنخرطين في الفجور الجنسي؛ و«زناة» موجزة وواضحة وتحفظ التحديد الجنسي.
- source_word: τοῦ κόσμου τούτου
  choice: هذا العالم
  rationale: يشير κόσμος هنا إلى المجتمع البشري خارج جماعة الكنيسة، و«هذا العالم» تقابل العبارة اليونانية بوضوح من غير توسيع تفسيري.
- source_word: πλεονέκταις
  choice: الجشعين
  rationale: يدل اللفظ على الطامعين إلى المزيد، وقد يتضمن الاستغلال؛ و«الجشعين» تعبير معاصر مفهوم.
- source_word: ἅρπαξιν
  choice: الخاطفين
  rationale: يدل اللفظ على من ينتزع ما للآخرين بالقوة أو الاستغلال. تحافظ «الخاطفين» على صورة الأخذ والانتهاب، مع ذكر بدائل دلالية في الحاشية.
- source_word: εἰδωλολάτραις
  choice: عَبَدة الأوثان
  rationale: صياغة عربية واضحة ومألوفة تنقل معنى الذين يعبدون الأصنام أو الأوثان.
- source_word: ἐπεὶ
  choice: وإلا
  rationale: يقدم اللفظ النتيجة اللازمة لو فُهم النهي على نحو مطلق؛ و«وإلا» تؤدي هذا الاستدلال طبيعيًا.
- source_word: ὠφείλετε
  choice: لكان عليكم
  rationale: ينقل الضرورة العملية أو الالتزام الناتج عن الفرض السابق، مع مراعاة القوة الشرطية في السياق.
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: أن تخرجوا من العالم
  rationale: 'يحفظ الصورة الحادة المقصودة: إن استحال كل اتصال بأمثال هؤلاء، للزم الخروج من العالم نفسه.'
theological_decisions:
- issue: نطاق الانفصال المطلوب في السياق المحيط
  choice: ينفي بولس أن يكون كلامه السابق قد قصد الانفصال التام عن أصحاب الخطايا من غير المؤمنين في المجتمع.
  alternative: أن يأمر بولس باعتزال اجتماعي كامل لكل أصحاب الخطايا.
  rationale: الآية نفسها تقيد الفهم المطلق، إذ تجعل نتيجته الخروج من العالم. لذلك تحفظ الترجمة قوة التوضيح ولا تضيف موقفًا انعزاليًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم «ولم أقصد إطلاقًا» لإظهار اتصال الآية بالكلام السابق ووظيفتها التوضيحية، مع إبقاء التعداد ونبرة النتيجة الحادة في ختام الآية.
