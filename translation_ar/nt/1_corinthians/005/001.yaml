  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: ar
  text: 'يُسمَع فعلًا أن بينكم فُجورًا جنسيًّا، وفُجورًا جنسيًّا من نوع لا يوجد حتى بين غير اليهود[a]: أن رجلًا له امرأة أبيه[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بين الأمم»؛ ويترجمها بعضهم: «بين الوثنيين».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًّا: «أن يكون له امرأة أبيه»؛ أي أن تكون بينه وبين امرأة أبيه علاقة جنسية. وقد تكون زوجة أبيه من غير أمه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: فعلًا
  rationale: تؤدي هنا معنى التوكيد والدهشة، لا معنى الشمول الكمي.
- source_word: ἀκούεται
  choice: يُسمَع
  rationale: يحافظ المبني للمجهول على صورة النص اليوناني، ويفيد شيوع الخبر وتناقله.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: تشير العبارة إلى وقوع الأمر داخل جماعة كورنثوس.
- source_word: πορνεία
  choice: فُجورًا جنسيًّا
  rationale: تعبير عربي معاصر واسع الدلالة على السلوك الجنسي المحرَّم، من غير تضييقه إلى نوع واحد.
- source_word: τοιαύτη πορνεία
  choice: فُجورًا جنسيًّا من نوع
  rationale: يحفظ القوة النوعية والتصعيد البلاغي في τοιαύτη.
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: لا يوجد حتى بين غير اليهود
  rationale: يفيد ἔθνη في هذا السياق الأمم من غير اليهود؛ وأُضيف «يوجد» لإتمام العبارة المحذوف فعلها في اليونانية بصورة طبيعية في العربية.
- source_word: ὥστε
  choice: ':'
  rationale: تُدخل العبارة التالية بوصفها تحديدًا لمضمون الفجور المذكور، والنقطتان تؤديان ذلك بوضوح.
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: امرأة أبيه
  rationale: يحافظ على التعبير القرابي في الأصل من دون الجزم بأنها زوجة أب بالمعنى الاصطلاحي الحديث.
- source_word: ἔχειν
  choice: له
  rationale: يحفظ الإيجاز والتعبير التلطيفي في الأصل، مع بيان المقصود المحتمل في الحاشية.
theological_decisions:
- issue: دلالة ἔθνεσιν
  choice: غير اليهود
  alternative: الأمم / الوثنيين
  rationale: «غير اليهود» يوضح التقابل اليهودي–الأممي من غير إضفاء حكم تقويمي زائد كما قد يحدث في «الوثنيين».
- issue: تحديد هوية امرأة الأب
  choice: امرأة أبيه
  alternative: زوجة أبيه
  rationale: الأصل لا يستخدم مصطلح قرابة متخصصًا، فحُفظت الصياغة الأوسع لتجنب إضافة ما لا يصرح به النص.
- issue: دلالة ἔχειν في السياق
  choice: له
  alternative: يقيم علاقة جنسية مع
  rationale: يحفظ التعبير الموجز والملطّف في اليونانية، بينما توضح الحاشية الدلالة السياقية من غير فرض صيغة تفصيلية في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختير «فجور جنسي» لاتساع دلالة πορνεία، وحُفظت الصياغة المقتضبة «له امرأة أبيه» مع حاشية تمنع الغموض غير المقصود من غير أن تستبدل تفسيرًا بالنص.
