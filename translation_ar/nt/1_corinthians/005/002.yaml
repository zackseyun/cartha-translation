  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: ar
  text: وأنتم منتفخون بالكبرياء! أفما كان الأجدر بكم أن تحزنوا، لكي يُزال من بينكم[a] مَن فعل هذا الفعل؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يُؤخَذ من وسطكم». وفي هذا السياق يُرجَّح أن المقصود إبعاده عن الجماعة عن طريق التأديب.'
    reason: بيان البديل المعجمي والإشارة إلى الدلالة السياقية من غير إدخالها صراحةً في المتن.
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: منتفخون بالكبرياء
  rationale: يحفظ صورة الانتفاخ التي يكررها بولس في الرسالة، مع إضافة «بالكبرياء» لتوضيح دلالتها للقارئ العربي، ويعبّر عن حالة مستقرة كما يقتضي اسم الفاعل التام.
- source_word: οὐχὶ μᾶλλον
  choice: أفما كان الأولى بكم
  rationale: ينقل قوة السؤال التوبيخي والمقابلة بين موقفهم الفعلي والموقف الذي كان ينبغي أن يتخذوه، بصياغة عربية طبيعية.
- source_word: ἐπενθήσατε
  choice: أن تنوحوا
  rationale: ينقل الحزن الشديد الذي تدل عليه الكلمة، وهو أقوى من مجرد الحزن العام، من غير أن يحدد وحده هل المقصود نوح جماعي أو توبة جماعية.
- source_word: ἵνα ἀρθῇ
  choice: لكي يُرفَع
  rationale: يحافظ على صيغة المبني للمجهول وعلى معنى الغاية أو النتيجة المقصودة، ولا يحسم صراحةً هوية القائم بالفعل.
- source_word: ἐκ μέσου ὑμῶν
  choice: من بينكم
  rationale: تعبير عربي واضح يحفظ المعنى الجماعي للعبارة اليونانية من غير تفسير زائد داخل المتن.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: مَن فعل هذا الفعل
  rationale: ينقل التركيب الموصولي ويحتفظ بثقل «الفعل» من غير إضافة اسم أو وصف غير وارد في النص.
theological_decisions:
- issue: طبيعة الإجراء المطلوب تجاه فاعل هذا الفعل
  choice: يُرفَع من بينكم
  alternative: يُطرَد من الجماعة، أو يأخذه الله من وسطهم
  rationale: يمكن أن يدل المبني للمجهول ἀρθῇ على الرفع أو الإزالة بوجه عام. ويرجّح السياق القريب إجراءً تأديبيًا داخل الجماعة، لكن الصياغة المختارة تبقي الفاعل وطبيعة الإزالة غير مصرّح بهما، محافظةً على سعة الأصل وتوتره.
translation_notes:
  register: فصحى معاصرة واضحة ذات نبرة توبيخية وقورة. حُفظت استعارة الانتفاخ، واستُعمل «تنوحوا» لإبقاء قوة لغة الحداد، ووُضعت علامة الحاشية عند عبارة الرفع التي تشرحها الحاشية.
