  to: وأنتم منتفخون بالكبرياء! أفما كان الأجدر بكم أن تحزنوا، لكي يُزال من بينكم[a] مَن فعل هذا الفعل؟
  rationale: عُدِّلت عبارتا الحداد والإزالة لتحسين الدقة الدلالية والطبيعية العربية. لا يحدد المتن هوية من يقوم بالإزالة ولا يصرح بتوصيف كنسي للإجراء، بينما تبقي الحاشية الإشارة السياقية بصيغة ترجيحية.
