review_pass:
  verdict: revise
  source_fidelity: 'ينقل النص ترتيب التوبيخ اليوناني ومعناه بدقة عامة: حالة الكبرياء الراسخة، والتقريع لعدم الحداد، وغاية/نتيجة إزالة فاعل هذا الفعل من الجماعة. لكن «يُرفَع» في العربية المعاصرة قد يُفهم على أنه رفع المكانة أو الرفع الحسي، ولا يؤدي بوضوح معنى ἀρθῇ في هذا السياق، وهو الإزالة مع إبقاء المبني للمجهول غير مسمّى الفاعل.'
  naturalness: 'الأسلوب فصيح ونبرة السؤال التوبيخي مناسبة. «منتفخون بالكبرياء» يحفظ الاستعارة البولسية بوضوح. ويُستحسن «تحزنوا» بدل «تنوحوا»: فهو طبيعي في هذا السياق، ويعبّر عن الحزن/الحداد المطلوب من دون أن يوحي تحديدًا بندب ميت.'
  terminology: حُفظت استعارة πεφυσιωμένοι بعبارة «منتفخون بالكبرياء». و«يُزال من بينكم» أدق وأفصح مقابل ἀρθῇ من «يُرفَع»، من غير فرض مصطلح كنسي تفسيري مثل الطرد أو الحرمان. «من بينكم» مناسب لـἐκ μέσου ὑμῶν.
  issues:
  - severity: medium
    issue: «يُرفَع من بينكم» ملتبسة في العربية
    rationale: الفعل «يُرفع» يمكن أن يدل على التعظيم أو الرفع المكاني، في حين أن αἴρω هنا تعني الإزالة. «يُزال» ينقل المعنى المقصود بوضوح ويبقي البناء للمجهول والفاعل غير المعيّن.
  - severity: low
    issue: «تنوحوا» أضيق وأشد إيحاءً بالندب من اللازم
    rationale: πενθέω يدل على الحزن والحداد الشديد، لكن «تحزنوا» في العربية الحديثة أوفق بالسياق وأقل تقييدًا بصورة النواح العلني.
