  rationale: تعبير عربي طبيعي يحافظ على صورة الأصل، ويفيد العمل تحت اسم يسوع وسلطانه من غير تحويل المعنى إلى تفسير صريح.
- source_word: κυρίου
  choice: رب
  rationale: يحفظ اللقب المسيحاني الشائع في العهد الجديد وثقله اللاهوتي، وهو أفصح من «سيد» في هذا السياق.
- source_word: Ἰησοῦ
  choice: يسوع
  rationale: النقل العربي المعياري للاسم في نصوص العهد الجديد.
- source_word: συναχθέντων ὑμῶν
  choice: حين تجتمعون
  rationale: صياغة زمنية طبيعية للمطلق الإضافي مع اسم الفاعل الماضي المبني للمجهول، وتؤدي معنى اجتماع الجماعة من غير إثقال العبارة العربية.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: ويكون روحي معكم
  rationale: يكمل التركيب اليوناني الموجز بما يلزم لسلامة العربية، مع إبقاء طبيعة حضور بولس الروحي غير محددة.
- source_word: σὺν
  choice: مع
  rationale: ينقل معنى المصاحبة ببساطة ويحافظ على انفتاح علاقة «القوة» بالفعل والاجتماع.
- source_word: δυνάμει
  choice: قوة
  rationale: يدل هنا على القدرة الفاعلة في الإجراء، ولا يختزل المعنى في مجرد السلطة الرسمية.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: ربنا يسوع
  rationale: يحافظ على الإضافة كما في اليونانية، تاركًا دلالتها بين الملكية والمصدر من غير حسم زائد.
theological_decisions:
- issue: طبيعة حضور بولس في اجتماع الجماعة
  choice: ويكون روحي معكم
  alternative: وروحي حاضر معكم؛ أو فهم «روحي» على أنه موقف بولس أو قصده فحسب
  rationale: يثبت النص مشاركة بولس غير الجسدية من غير أن يشرح آليتها أو يحسم هل المقصود حضورًا روحيًا بمعنى أقوى أم موافقته وقصده.
- issue: علاقة «مع قوة ربنا يسوع» بما قبلها
  choice: الإبقاء على العبارة متتابعة من غير إعادة صياغة تفسيرية
  alternative: أن تُربط القوة حصريًا بالاجتماع، أو بحضور روح بولس، أو بالفعل التأديبي الآتي
  rationale: تركيب اليونانية مضغوط، وإعادة ترتيب العبارة لحسم جهة التعلق ستزيل غموضًا حقيقيًا في النص.
