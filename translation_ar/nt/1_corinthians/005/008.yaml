source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: ar
  text: فَلْنَحْتَفِلْ إِذًا بِالْعِيدِ[a]، لا بِخَمِيرَةٍ عَتِيقَةٍ، وَلا بِخَمِيرَةِ الْخُبْثِ وَالشَّرِّ، بَلْ بِفَطِيرِ الإِخْلَاصِ وَالْحَقِّ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «فلنُقِم العيد» أو «فلنُعَيِّد». يحفظ التعبير اليوناني صورة عيد الفصح الممتدة من الآية السابقة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «بالأشياء الخالية من الخمير، التي هي الإخلاص والحق». استُعمل «الفطير» لإظهار صورة عيد الفصح طبيعيًا في العربية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: إذًا
  rationale: تفيد النتيجة والاستنتاج من الحجة السابقة، وتأتي في موضع طبيعي في العربية.
- source_word: ἑορτάζωμεν
  choice: فلنحتفل بالعيد
  rationale: صيغة حثّ جماعي تحفظ معنى الاحتفال أو إقامة العيد، وتُبقي صورة عيد الفصح الواردة في السياق السابق.
- source_word: ζύμῃ παλαιᾷ
  choice: بخميرة عتيقة
  rationale: تحفظ استعارة الخميرة وصداها في سياق الفصح والفطير؛ والباء تؤدي هنا معنى ἐν بصورة عربية طبيعية.
- source_word: κακίας
  choice: الخبث
  rationale: ينقل فساد الطبع وسوء القصد، مع إبقائه متميزًا عن πονηρία.
- source_word: πονηρίας
  choice: الشر
  rationale: ترجمة واضحة وشائعة تدل على الشر الأخلاقي، وتكوّن مع «الخبث» زوجًا مترابطًا غير مترادف تمامًا.
- source_word: ἀζύμοις
  choice: فطير
  rationale: اللفظ اليوناني اسمٌ وصفيّ في صيغة الجمع، أي «الأشياء الخالية من الخمير»؛ و«الفطير» في العربية يستحضر الخبز غير المخمَّر ويحفظ صورة العيد بإيجاز طبيعي.
- source_word: εἰλικρινείας
  choice: الإخلاص
  rationale: ينقل معنى الصفاء وصدق الباطن في مقابلة تأثير الخميرة المفسد، بلغة عربية مفهومة.
- source_word: ἀληθείας
  choice: الحق
  rationale: ترجمة مباشرة تحفظ اتساع اللفظ اليوناني واقترانه بالإخلاص.
theological_decisions:
- issue: صورة عيد الفصح في الحث الرسولي
  choice: فلنحتفل إذًا بالعيد ... بل بفطير الإخلاص والحق
  alternative: 'فلنحتفل ... بل بما هو خالٍ من الخمير: الإخلاص والحق'
  rationale: السياق السابق يذكر ذبيحة الفصح، ولذلك تُحفظ مفردات العيد والخميرة والفطير بدل تحويل العبارة إلى حث أخلاقي مجرد. ولا يُحسم ما إذا كان المقصود ممارسة عيد حرفية أو توظيف صورته استعاريًا لحياة الجماعة.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظ التوازي بين «الخميرة» و«الفطير»، وتُركت صورة العيد بما فيها من توتر بين المعنى الشعائري والاستعاري دون حسم تفسيري زائد.
