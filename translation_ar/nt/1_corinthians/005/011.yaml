    issue: «بل لا تأكلوا» مقابل μηδὲ συνεσθίειν
    rationale: μηδέ أداة عطف نافية تقوّي النهي بمعنى «ولا حتى»، وليست أداة استدراك بمعنى «بل». لذلك تغيّر «بل» علاقة الجملة بما قبلها.
  - severity: medium
    issue: «زانيًا» مقابل πόρνος
    rationale: قد ينصرف «الزنا» في العربية المعاصرة إلى علاقة شخص متزوج، في حين أن πόρνος أعمّ، وتشمل الفجور الجنسي دون هذا القيد.
  - severity: low
    issue: «سَلّابًا» مقابل ἅρπαξ
    rationale: اللفظ مفهوم، لكنه قليل التداول نسبيًا. «ناهبًا» أوضح في الفصحى المعاصرة ويحفظ معنى الاستيلاء الجشع على ما للغير.
  revised_text: أمّا الآن فقد كتبتُ إليكم ألّا تخالطوا مَن يُسمّى أخًا إن كان فاجرًا جنسيًا، أو طمّاعًا، أو عابدَ أوثان، أو شتّامًا، أو سكّيرًا، أو ناهبًا؛ ولا حتى تأكلوا مع مثل هذا.
