  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: ar
  text: أمّا الآن فقد كتبتُ إليكم ألّا تخالطوا مَن يُسمّى أخًا إن كان فاجرًا جنسيًا، أو طمّاعًا، أو عابدَ أوثان، أو شتّامًا، أو سكّيرًا، أو ناهبًا؛ ولا حتى تأكلوا مع مثل هذا.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναναμίγνυσθαι
  choice: تخالطوا
  rationale: ينقل معنى المعاشرة والاختلاط الاجتماعي المستمر بعبارة عربية طبيعية، من غير حصره في نوع واحد من التعامل.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: مَن يُدعى أخًا
  rationale: يحافظ على صياغة النص التي تتحدث عن شخص يحمل اسم «أخ»، من غير أن تحسم حقيقة انتمائه الإيماني.
- source_word: πόρνος
  choice: زانيًا
  rationale: لفظ عربي مباشر يدل على مَن يمارس الفجور الجنسي، وهو أنسب في هذا السياق من تعبير وصفي مطوّل.
- source_word: πλεονέκτης
  choice: طمّاعًا
  rationale: ينقل معنى الجشع والرغبة النهمة في امتلاك المزيد.
- source_word: λοίδορος
  choice: شتّامًا
  rationale: يدل على مَن يعتاد السب والإهانة اللفظية، وهو أدق من «مسيئ» العامة.
- source_word: μέθυσος
  choice: سكّيرًا
  rationale: يفيد الاعتياد على السكر، لا مجرد وقوع عابر في حالة سكر.
- source_word: ἅρπαξ
  choice: سَلّابًا
  rationale: يحفظ معنى الشخص الذي ينتزع أموال الآخرين أو يستولي عليها بجشع أو استغلال، وهو أوسع قليلًا من «محتال».
- source_word: μηδὲ συνεσθίειν
  choice: بل لا تأكلوا مع مثل هذا
  rationale: 'صياغة عربية واضحة تحفظ تشديد العبارة اليونانية: الامتناع حتى عن مؤاكلة ذلك الشخص.'
theological_decisions:
- issue: دلالة وصف الشخص بأنه أخ
  choice: مَن يُدعى أخًا
  alternative: مَن يزعم أنه أخ
  rationale: «يُدعى» يحفظ حياد ὀνομαζόμενος ولا يضيف إيحاءً بأن ادعاء الشخص كاذب، كما لا يقرر صحة انتمائه.
- issue: نطاق النهي عن الأكل
  choice: 'إبقاء العبارة عامة: «لا تأكلوا مع مثل هذا»'
  alternative: تخصيصها بعشاء الرب أو بالولائم الدينية
  rationale: النص نفسه لا يحدد نوع الطعام، ولذلك لا ينبغي حسم التوتر التفسيري بإضافة تخصيص غير مصرح به.
- issue: زمن ἔγραψα
  choice: فقد كتبتُ
  alternative: أكتب إليكم الآن
  rationale: الصيغة اليونانية ماضٍ صرفيًا، فحُفظت كما هي مع «الآن»، من غير تسوية احتمال الإشارة إلى الرسالة الحالية أو إلى فعل كتابي سابق.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُعملت ألفاظ موجزة ومفهومة في قائمة الرذائل، مع الحفاظ على بنية الشرط والتشديد الختامي في الأصل.
