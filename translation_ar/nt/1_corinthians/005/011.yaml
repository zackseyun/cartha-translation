  source_fidelity: 'تحتاج العبارة الختامية إلى تصحيح: μηδέ تعني «ولا حتى»، لا «بل»، إذ إن «بل» تفيد استدراكًا غير موجود في اليونانية. كما أن «زانيًا» أضيق من πόρνος، التي تشمل الفجور الجنسي عمومًا، و«ناهبًا» أوضح وأقرب إلى ἅρπαξ من «سَلّابًا».'
  naturalness: الترجمة فصيحة في معظمها، لكن «سَلّابًا» أقل شيوعًا في الاستعمال المعاصر، واستبدالها بـ«ناهبًا» أوضح. والصياغة الختامية المصححة أكثر سلاسة ودقة.
  terminology: «مَن يُسمّى أخًا» يحفظ دلالة ἀδελφὸς ὀνομαζόμενος المحايدة. و«فاجرًا جنسيًا» يوسّع الدلالة بما يلائم πόρνος دون تخصيصها بالزنا في المعنى العربي القانوني الشائع. وتبقى «شتّامًا» و«سكّيرًا» مناسبتين.
  issues:
