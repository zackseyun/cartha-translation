  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: ar
  text: ليس افتخاركم حسنًا. أما تعلمون أن خميرةً قليلةً تُخمِّر العجين كله[a]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كتلة العجين كلها».'
    reason: بديل معجمي للفظ φύραμα، الذي يمكن أن يدل على العجين أو كتلة العجين.
lexical_decisions:
- source_word: καλὸν
  choice: حسنًا
  rationale: تؤدي معنى التقييم الأخلاقي والعملي في السياق، وهي عربية واضحة ومباشرة دون زيادة تفسيرية.
- source_word: καύχημα
  choice: افتخاركم
  rationale: يحافظ «الافتخار» على إمكان دلالة الاسم على فعل التفاخر أو موضوعه، ويلائم نبرة التوبيخ.
- source_word: οὐκ οἴδατε
  choice: أما تعلمون
  rationale: يحافظ على صيغة السؤال البلاغي المألوفة عند بولس، مع صياغة عربية طبيعية.
- source_word: μικρὰ ζύμη
  choice: خميرةً قليلةً
  rationale: ينقل الصورة المثلية بإيجاز ويحافظ على الخميرة بوصفها صورة الخَبز القديمة.
- source_word: ὅλον τὸ φύραμα
  choice: العجين كله
  rationale: «العجين» هو المقابل الواضح المعاصر للخليط المعجون، و«كله» يحفظ التشديد على الشمول.
- source_word: ζυμοῖ
  choice: تُخمِّر
  rationale: يحافظ على الصلة الاشتقاقية والدلالية بين «خميرة» والفعل «تُخمِّر».
theological_decisions:
- issue: الصورة المجازية للخميرة
  choice: الإبقاء على صورة الخميرة من غير التصريح بمرجعها الأخلاقي في متن الآية.
  alternative: 'تفسير الصورة داخل النص بعبارة مثل: «قليل من الخطية يفسد الجماعة كلها».'
  rationale: يورد بولس قولًا تصويريًا موجزًا، ويترك للسياق تحديد تطبيقه؛ لذلك لا ينبغي أن تضيف الترجمة تفسيرًا غير مصرَّح به في الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. وُضع مؤشر الحاشية بعد «العجين كله» لأنه يخص البديل المعجمي لـ φύραμα، لا وصف الافتخار.
