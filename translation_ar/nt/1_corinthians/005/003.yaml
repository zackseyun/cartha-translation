base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: ar
  text: فإني، وإن كنت غائبًا بالجسد وحاضرًا بالروح[b]، فقد حكمتُ من قبل[a]، كأنّي حاضر، على الذي ارتكب هذا الفعل على هذا النحو.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قد أصدرتُ حكمًا من قبل».'
    reason: lexical_alternative
  - marker: b
    text: الأرجح أن عبارة «حاضرًا بالروح» تشير إلى روح بولس نفسه، لا إلى الروح القدس.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὼν τῷ σώματι
  choice: غائبًا بالجسد
  rationale: يحافظ على دلالة الغياب الجسدي وعلى المقابلة الموجزة مع الحضور بالروح، من غير أن يوحي بالموت أو بانفصال ميتافيزيقي عن الجسد.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: لكن حاضرًا بالروح
  rationale: يحفظ المقابلة البلاغية مع «غائبًا بالجسد» ويبقي المقصود من «الروح» على قدر ما يسمح به النص، مع رجحان الإشارة إلى روح بولس نفسه.
- source_word: ἤδη κέκρικα
  choice: قد حكمتُ بالفعل
  rationale: تنقل معنى الحكم الذي صدر من قبل وما زال نافذًا؛ و«حكمت» قريبة من κρίνω وملائمة لسياق التأديب.
- source_word: ὡς παρὼν
  choice: كأنّي حاضر
  rationale: صياغة عربية طبيعية تحفظ قوة المقارنة في ὡς، أي إن حكمه قائم كما لو كان حاضرًا جسديًا.
- source_word: τὸν ... κατεργασάμενον
  choice: الذي ارتكب
  rationale: ينقل اسم الفاعل المستعمل استعمال الاسم، ويوافق سياق الفعل المخالف من غير إضافة اسم غير موجود صراحة في اليونانية.
- source_word: οὕτως τοῦτο
  choice: هذا الفعل على هذا النحو
  rationale: ينقل اسم الإشارة τοῦτο والإشارة إلى الكيفية في οὕτως معًا، بدل تسطيح العبارة إلى مجرد «هذا الأمر».
- source_word: γάρ
  choice: فإنّي
  rationale: الفاء مع «إنّ» تبين الصلة التفسيرية بما سبق بأسلوب عربي فصيح وطبيعي.
- source_word: μὲν ... δὲ
  choice: وإن كنت ... لكن
  rationale: تنقل المقابلة التنازلية بين الغياب بالجسد والحضور بالروح من غير محاكاة آلية للجسيمين اليونانيين.
theological_decisions:
- issue: المقصود بعبارة «حاضرًا بالروح»
  choice: أُبقيت العبارة كما هي، مع رجحان أن بولس يتحدث عن حضوره غير الجسدي مع الجماعة في الاهتمام والحكم.
  alternative: قد تشير العبارة إلى حضور الروح القدس أو إلى نوع أقوى من الحضور الصوفي.
  rationale: المقابلة المباشرة بين σώματι وπνεύματι ترجّح روح بولس نفسه، لكن الترجمة لا تفرض نظرية محددة لطبيعة هذا الحضور.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. وُضعت علامتا الحاشيتين عند العبارتين اللتين تفسّرهما الحاشيتان، مع الحفاظ على ترتيب تعريف الحاشيتين الوارد في مادة الاستشارة.
