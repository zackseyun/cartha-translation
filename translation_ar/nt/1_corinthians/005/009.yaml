lexical_decisions:
- source_word: Ἔγραψα
  choice: كتبتُ
  rationale: الفعل اليوناني ماضٍ خبري، وأقرب ما يقابله في العربية «كتبتُ»، من غير حسم هل المقصود رسالة سابقة أم كلامًا كُتب في الرسالة الحالية.
- source_word: ὑμῖν
  choice: إليكم
  rationale: ضمير جمع في حالة المفعول غير المباشر، و«إليكم» هي الصياغة العربية الطبيعية مع فعل الكتابة.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: في الرسالة
  rationale: تحافظ الصياغة على أداة التعريف في اليونانية وعلى عدم تعيين ما إذا كانت رسالة سابقة أم الرسالة الحالية.
- source_word: μὴ συναναμίγνυσθαι
  choice: ألّا تخالطوا
  rationale: ينقل المصدر المنفي مضمون الوصية، و«تخالطوا» تعبر بوضوح عن المعاشرة والاختلاط الاجتماعي من غير إيحاء بأنها مجرد مصادفة أو اتصال عابر.
- source_word: πόρνοις
  choice: الفاسقين جنسيًّا
  rationale: اللفظة تدل على أشخاص يتصفون بالسلوك الجنسي غير الأخلاقي؛ وهذه العبارة واضحة ومعاصرة، ولا تحصر المعنى في نوع واحد من المخالفة الجنسية.
theological_decisions:
- issue: مرجع «الرسالة»
  choice: إبقاء العبارة «في الرسالة» من غير تحديد هل هي رسالة سابقة أم هذه الرسالة نفسها.
  alternative: تفسيرها صراحة بأنها رسالة سابقة مفقودة، أو بأنها موضع سابق من الرسالة الأولى إلى أهل كورنثوس.
  rationale: العبارة اليونانية معرفة، لكنها لا تحسم وحدها المرجع التاريخي؛ لذلك يحافظ النص على الغموض الحقيقي بدل أن يبتّ في المسألة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «تخالطوا» لصون دلالة المعاشرة الاجتماعية، و«الفاسقين جنسيًّا» لتوضيح المجال الدلالي من غير استعمال لفظ تقليدي قد يبدو أضيق أو أقل وضوحًا للقارئ المعاصر. رُتبت علامات الحواشي بحسب موضعها الدلالي في الجملة.
