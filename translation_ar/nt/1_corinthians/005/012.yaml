lexical_decisions:
- source_word: τί γάρ μοι
  choice: فما لي
  rationale: 'تؤدي العبارة الاصطلاحية معنى: ما شأني بهذا أو ما علاقتي به، وتحافظ «فما لي» على الإيجاز والاستفهام البلاغي وعلى دلالة γάρ السياقية.'
- source_word: τοὺς ἔξω
  choice: الذين هم من خارج
  rationale: استعمال ἔξω هنا اسمي ويشير إلى من هم خارج جماعة الكنيسة، لا إلى موقع مكاني محض؛ والصياغة تحافظ على مقابلة «من داخل».
- source_word: κρίνειν
  choice: أن أدين
  rationale: يدل κρίνω في السياق على إصدار حكم في إطار التأديب الجماعي. «أدين» واضحة وطبيعية هنا، مع بقاء مجال الحكم المقصود محددًا بالسياق.
- source_word: οὐχὶ
  choice: أليس
  rationale: تنقل السؤال الذي يتوقع جوابًا بالإيجاب وتحفظ بنيته البلاغية.
- source_word: τοὺς ἔσω
  choice: الذين هم من داخل
  rationale: تشير إلى المنتمين إلى جماعة الكنيسة، وتحافظ على التناظر اللفظي مع «الذين هم من خارج» من غير تفسير داخل المتن.
- source_word: ὑμεῖς κρίνετε
  choice: هم الذين تدينونهم
  rationale: تحافظ على صيغة المضارع الخبرية في اليونانية وعلى إبراز الضمير ὑμεῖς دلاليًا، بدل تحويلها صراحةً إلى صيغة وجوب قد تحسم التوتر بين الوصف والتكليف.
theological_decisions:
- issue: نطاق الحكم في مقابلة من هم خارج الجماعة بمن هم داخلها
  choice: أُبقيت مقابلة الداخل والخارج، بما ينسجم مع سياق التأديب داخل جماعة الكنيسة.
  alternative: فهم الآية على أنها تقرير عام عن كل حكم أخلاقي على غير المؤمنين.
  rationale: السياق في 1 كورنثوس 5:9–13 يتعلق بمسؤولية الجماعة تجاه أعضائها. لا يضيف النص حكمًا عقائديًا أوسع مما تقوله المقابلة نفسها.
- issue: هل ὑμεῖς κρίνετε وصف أم تكليف
  choice: 'صيغت العبارة بالمضارع الخبري: «تدينونهم».'
  alternative: «ينبغي لكم أن تدينوهم» أو «عليكم أن تدينوهم».
  rationale: الصيغة اليونانية خبرية، وإن أمكن أن تحمل في السؤال البلاغي قوة تكليفية بحسب السياق. إبقاء الخبرية يحفظ هذا الاحتمال ولا يحسمه بإضافة لفظ صريح للوجوب.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدمت عبارتا «من خارج» و«من داخل» للمحافظة على التقابل اليوناني، وأُبقي السؤال الثاني خبري الصياغة حفاظًا على الغموض الحقيقي بين الوصف والتكليف.
