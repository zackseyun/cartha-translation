  text: τοὺς δὲ ἔξω ὁ θεὸς ⸀κρίνει; ⸀ἐξάρατε τὸν πονηρὸν ἐξ ὑμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: ar
  text: أمّا الذين في الخارج، فالله يدينهم[a][b]. أزيلوا الشرير من بينكم[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الذين هم خارج الجماعة».'
    reason: lexical_alternative
  - marker: b
    text: 'الفعل اليوناني بصيغة المضارع («يدين»)، مع أن بعض الترجمات تصوغه بالمستقبل: «سيدين».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «اطردوا الرجل الشرير من وسطكم». وتردد العبارة صدى صيغ إزالة الشر من الجماعة في سفر التثنية.'
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: الذين في الخارج
  rationale: الظرف المعرَّف مستعمل استعمال الاسم، ويشير إلى من هم خارج جماعة المؤمنين. تحافظ العبارة على الدلالة العلائقية من غير إضافة تحديد غير وارد في النص.
- source_word: δὲ
  choice: أمّا ... فـ
  rationale: تفيد δέ هنا مقابلة لطيفة بين الذين في الداخل والذين في الخارج، ويؤدي تركيب «أمّا ... فـ» هذه المقابلة بأسلوب عربي طبيعي.
- source_word: κρίνει
  choice: يدينهم
  rationale: الفعل مضارع خبري، فحُفظ زمنه ودلالته العامة الحاضرة، بدل تحويله إلى المستقبل اعتمادًا على السياق.
- source_word: ἐξάρατε
  choice: أزيلوا
  rationale: صيغة الأمر تدعو إلى إجراء حاسم. و«أزيلوا» مباشرة وتحافظ على صدى صيغة إزالة الشر من الجماعة من غير إدخال مصطلح كنسي لاحق.
- source_word: τὸν πονηρὸν
  choice: الشرير
  rationale: الصفة المعرَّفة مستعملة استعمال الاسم، وهي في اليونانية مفرد مذكر وتشير في السياق إلى الرجل المخطئ بعينه. و«الشرير» تحفظ التوصيف الأخلاقي والإحالة المذكرة من غير حشو.
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: من بينكم
  rationale: تؤدي العبارة معنى إخراج الشخص من داخل الجماعة، وهي صياغة عربية واضحة وطبيعية.
theological_decisions:
- issue: طبيعة الأمر المتعلق بتأديب الجماعة
  choice: يأمر النص الجماعة بإزالة الرجل المخطئ من بينها، ويترك لله دينونة من هم خارجها.
  alternative: قد يُفهم الأمر على نحو أعم بوصفه إزالة الشر من الجماعة من غير دلالة صريحة على استبعاد رسمي.
  rationale: يفصل السياق بين مسؤولية الجماعة تجاه من في داخلها ودينونة الله لمن هم خارجها. لكن الصياغة تتجنب استيراد مصطلحات أو إجراءات كنسية لاحقة لا يصرح بها النص اليوناني.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ورصينة. استُعمل «أمّا ... فـ» لإظهار المقابلة، وحُفظ المضارع في «يدينهم»، كما تجنبت الترجمة مصطلحات طائفية أو مؤسسية غير موجودة في الأصل.
