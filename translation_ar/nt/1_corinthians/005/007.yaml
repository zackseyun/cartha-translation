  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: ar
  text: أزيلوا الخميرة القديمة، لكي تكونوا عجينًا جديدًا، كما أنكم بلا خمير. فإن المسيح، فصحنا[a]، قد ذُبح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «فصحنا». وقد يُفهم اللفظ اليوناني، في ضوء «قد ذُبح»، على أنه يشير إلى حَمَل الفصح أو إلى ذبيحة الفصح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: أزيلوا
  rationale: فعل أمر للجمع يفيد إخراج الشيء وتنقية الموضع منه؛ وتؤدي «أزيلوا» المعنى بوضوح في العربية، بينما يُفهم التشديد على الإزالة الكاملة من السياق.
- source_word: τὴν παλαιὰν ζύμην
  choice: الخميرة القديمة
  rationale: يحافظ هذا التعبير على صورة التخمير المرتبطة بالفصح والفطير، وعلى الإشارة المجازية إلى التأثير المفسد السابق.
- source_word: ἵνα ἦτε νέον φύραμα
  choice: لكي تكونوا كتلة عجين جديدة
  rationale: تنقل «لكي» معنى الغاية، وتوضح «كتلة عجين» صورة φύραμα بوصفها عجينًا مجموعًا لا مجرد قطعة منفردة.
- source_word: καθώς ἐστε ἄζυμοι
  choice: كما أنكم بلا خمير
  rationale: تحافظ «كما» على المقارنة والتوتر المقصود بين الأمر بأن يصيروا جددًا وبين هويتهم القائمة بوصفهم بلا خمير.
- source_word: τὸ πάσχα ἡμῶν
  choice: ذبيحة فصحنا
  rationale: النص اليوناني يقول حرفيًا «فصحنا»، لكن اقترانه بالفعل «ذُبح» يجعل الذبيحة الفصحية هي المرجع الأرجح. أُثبتت الصياغة الحرفية في الحاشية صونًا لاتساع الدلالة.
- source_word: ἐτύθη
  choice: قد ذُبح
  rationale: الفعل المبني للمجهول من θύω يدل هنا على الذبح بوصفه ذبيحة؛ و«قد ذُبح» يحفظ الحدث المنجز ودلالته الذبائحية من غير إطالة تفسيرية.
- source_word: Χριστός
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، ويحفظ دلالته اللقبية في سياق الفصح.
theological_decisions:
- issue: تحديد مدلول πάσχα عند إسناده إلى المسيح
  choice: ذبيحة فصحنا
  alternative: فصحنا
  rationale: يحتمل πάσχα الفصح نفسه أو ذبيحته، ويُرجّح فعل «ذُبح» المعنى الذبائحي. أُضيفت «ذبيحة» للإيضاح مع حاشية تُبقي اللفظ اليوناني الأوجز ظاهرًا ولا تحسم اتساعه بصمت.
- issue: العلاقة بين الأمر بالابتعاد عن الخميرة والقول إن المخاطبين بلا خمير
  choice: الإبقاء على العبارتين من غير تسوية تفسيرية
  alternative: إعادة الصياغة بما يجعل الحالة الثانية مجرد هدف مستقبلي
  rationale: 'يجمع بولس عمدًا بين التكليف الأخلاقي والهوية القائمة: عليهم إزالة الخميرة لأنهم، من جهة أخرى، «بلا خمير». تحافظ الترجمة على هذا التوتر اللاهوتي.'
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. حُفظت استعارة الخميرة والعجين والفطير، وتُجنبت المصطلحات الطائفية أو الشروح المذهبية.
