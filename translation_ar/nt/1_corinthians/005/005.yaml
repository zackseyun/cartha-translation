source:
  edition: SBLGNT
  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: ar
  text: أن تُسلِّموا مثلَ هذا إلى الشيطان لهلاك الجسد[a]، لكي تُخلَّص الروح في يوم الرب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لخراب الجسد». وقد تشير العبارة إلى عقاب جسدي شديد، أو، على نحو مجازي، إلى القضاء على النزعة الجسدية الخاطئة لدى الشخص.'
    reason: lexical_alternative
  - marker: b
    text: 'تقرأ بعض المخطوطات: «ربنا يسوع» أو «الرب يسوع» بدلًا من «الرب» فقط.'
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: أن تُسلِّموا ... إلى
  rationale: ينقل معنى التسليم إلى سلطان آخر، وهو تعبير عربي واضح يحافظ على قوة الفعل في السياق التأديبي.
- source_word: τὸν τοιοῦτον
  choice: مثلَ هذا
  rationale: يحافظ على الإشارة إلى الشخص المحدد مع النبرة التصنيفية التي في التعبير اليوناني، من غير إضافة لفظ «الرجل» غير الصريح في النص.
- source_word: τῷ Σατανᾷ
  choice: إلى الشيطان
  rationale: الصيغة العربية المعيارية للاسم، وتلائم تركيب الفعل «تُسلِّموا».
- source_word: εἰς ὄλεθρον
  choice: لهلاك
  rationale: «الهلاك» ينقل شدة ὄλεθρος ويظل قابلًا لمعنى الخراب أو الدمار دون تعيين كيفية وقوعه.
- source_word: τῆς σαρκός
  choice: الجسد
  rationale: يحفظ العبارة الموجزة وموضع التوتر التفسيري بين الجسد المادي والتوجّه الجسدي الخاطئ، بدل حسمها في المتن.
- source_word: ἵνα
  choice: لكي
  rationale: تؤدي بوضوح معنى الغاية أو النتيجة المقصودة.
- source_word: τὸ πνεῦμα
  choice: الروح
  rationale: يحافظ على أداة التعريف ولا يضيف ضمير الملكية «روحه» غير الموجود صراحة في اليونانية.
- source_word: σωθῇ
  choice: تخلُص
  rationale: تنقل المبني للمجهول اليوناني بصياغة عربية طبيعية شائعة في لغة الخلاص، مع إبقاء الغاية المقصودة.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: في يوم
  rationale: مقابل زمني مباشر وطبيعي للتركيب اليوناني.
- source_word: τοῦ κυρίου
  choice: الرب
  rationale: يتبع نص SBLGNT المعطى من غير إضافة «يسوع» أو «ربنا».
theological_decisions:
- issue: معنى «هلاك الجسد»
  choice: إبقاء عبارة «هلاك الجسد» محتملة الدلالة في المتن.
  alternative: عقاب جسدي شديد أو موت؛ أو القضاء على التوجّه الجسدي الخاطئ.
  rationale: لا يحسم النص اليوناني بين الأثر البدني والمعنى المجازي المتعلق بالنزعة الخاطئة، لذلك تُحفظ دلالته المفتوحة مع توضيحها في الحاشية.
- issue: مرجع «الروح»
  choice: «الروح» من غير إضافة ضمير ملكية.
  alternative: «روحه».
  rationale: السياق يرجح روح الشخص المعني، لكن اليونانية لا تتضمن ضمير ملكية صريحًا، فلا يُضاف في الترجمة.
- issue: صيغة «يوم الرب»
  choice: 'اتباع قراءة النص الأساس: «يوم الرب».'
  alternative: «يوم ربنا يسوع» أو «يوم الرب يسوع».
  rationale: يحافظ المتن على قراءة SBLGNT، وتُذكر القراءات الموسعة في الحاشية دون إدخالها في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدم «مثل هذا» حفاظًا على نبرة الأصل، وأُبقيت عبارتا «هلاك الجسد» و«الروح» دون إضافات تفسيرية لصون الغموض المقصود والتوتر اللاهوتي في النص.
