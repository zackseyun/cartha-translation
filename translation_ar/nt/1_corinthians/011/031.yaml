  text: εἰ ⸀δὲ ἑαυτοὺς διεκρίνομεν, οὐκ ἂν ἐκρινόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/031.yaml
  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: ar
  text: ولكن لو حكمنا على أنفسنا[a]، لما حُكم علينا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «فحصنا أنفسنا» أو «ميّزنا حالنا». يمكن أن يعني الفعل اليوناني التقييم أو التمييز، لكن «حكمنا» تحافظ على المقابلة مع «حُكم علينا» في بقية الآية.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ولكن لو
  rationale: تنقل «لو» الشرط المخالف للواقع الذي تدل عليه بنية الجملة، وتحفظ «لكن» الانتقال التقابلي الخفيف الذي تؤديه δέ.
- source_word: ἑαυτοὺς
  choice: على أنفسنا
  rationale: ترجمة طبيعية للمفعول الانعكاسي، مع حرف الجر الذي يقتضيه الفعل «حكم» في العربية.
- source_word: διεκρίνομεν
  choice: حكمنا
  rationale: يحمل الفعل هنا معنى تقييم المرء نفسه وتمييز حاله، واختيار «حكمنا» يحفظ كذلك المقابلة اللفظية مع ἐκρινόμεθα في الشطر التالي.
- source_word: οὐκ ἂν
  choice: لما
  rationale: 'تؤدي «لما» في جواب «لو» معنى النتيجة الممتنعة: «لما حُكم علينا».'
- source_word: ἐκρινόμεθα
  choice: حُكم علينا
  rationale: يحفظ صيغة المبني للمجهول والصلة اللفظية بالفعل الأول، من غير تشديد المعنى إلى «أُدِنّا» بما قد يوحي بالدينونة النهائية.
theological_decisions:
- issue: هل يشير الشطر الثاني إلى الدينونة النهائية أم إلى حكم الرب التأديبي؟
  choice: الإبقاء على التعبير العام «حُكم علينا»، مع ما يوحي به السياق من حكم إلهي تأديبي.
  alternative: «لما أُدِنّا»، بما قد يُفهم منه الحكم النهائي.
  rationale: تميّز الآية التالية بين تأديب الرب والدينونة مع العالم؛ لذلك لا ينبغي أن تحسم الترجمة هذه الآية لصالح معنى الإدانة النهائية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت صيغة «لو... لما...» لإظهار الشرط المخالف للواقع، وحُفظ التوازي اللفظي بين حكم الإنسان على نفسه ووقوع الحكم عليه.
