  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: ar
  text: ولكن إن كان أحدٌ يرى نفسه ميّالًا إلى الخصام[a]، فليست لنا عادةٌ كهذه[b]، ولا كنائسُ الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «محبًّا للنزاع»، أو «مولعًا بالخصام».'
    reason: lexical_alternative
  - marker: b
    text: قد تشير عبارة «عادة كهذه» إمّا إلى عادة الخصام، وإمّا إلى الممارسة المختلف عليها في الآيات السابقة.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: بدا
  rationale: يحفظ معنى الظهور أو الانطباع في تركيب «بدا أن...»، من غير حسم ما إذا كان الكلام عن تصوّر الشخص لنفسه أم عن ميله الظاهر.
- source_word: φιλόνεικος
  choice: ميّال إلى الخصام
  rationale: يعبّر بوضوح معاصر عن صفة الشخص المحب للنزاع أو المولع بالمجادلة، من غير حصرها في مناقشة فكرية فقط.
- source_word: τοιαύτην
  choice: كهذه
  rationale: تحافظ على الإحالة الرجعية العامة في اليونانية، ولا تعيّن مرجعها المختلف عليه.
- source_word: συνήθειαν
  choice: عادة
  rationale: تنقل معنى الممارسة المعتادة أو العرف الجاري، وتبقى واسعة بما يكفي لاحتمالي المرجع في السياق.
- source_word: οὐκ ἔχομεν
  choice: ليست لنا
  rationale: صياغة عربية طبيعية تقابل معنى «ليس عندنا/لا نملك»، من غير إضافة معنى أقوى مثل المنع أو الرفض.
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: كنائس الله
  rationale: تحافظ على تركيب الإضافة وعلى الإشارة إلى جماعات المؤمنين المنسوبة إلى الله.
theological_decisions:
- issue: مرجع عبارة «عادة كهذه»
  choice: تُركت العبارة عامة من غير تحديد مرجعها في المتن.
  alternative: قد تشير إلى الميل إلى الخصام، أو إلى الممارسة المختلف عليها في الآيات السابقة.
  rationale: العبارة اليونانية τοιαύτην συνήθειαν موجزة ومرجعها محل خلاف حقيقي؛ لذلك يحفظ النص العربي الغموض بدل أن يحسمه تفسيريًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُعمل «ميّال إلى الخصام» بدل لفظ أقل تداولًا مثل «مخاصم»، وأُبقيت «عادة كهذه» عامة للمحافظة على غموض المرجع في الأصل.
