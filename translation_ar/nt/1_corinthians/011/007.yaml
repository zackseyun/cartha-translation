base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: ar
  text: لأن الرجل[a] لا ينبغي له أن يغطّي رأسه[b]، إذ هو صورة الله ومجده؛ وأما المرأة فهي مجد الرجل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة «الرجل» و«المرأة» في الآية كلها بـ«الزوج» و«الزوجة»، بحسب السياق؛ إذ يمكن أن تحمل الكلمتان اليونانيتان هذا المعنى أو ذاك.
    reason: alternative_reading
  - marker: b
    text: 'أو: «يضع حجابًا على رأسه». لكن اليونانية تقول بوجه أعم: «يغطّي رأسه»، من غير تحديد نوع الغطاء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: الرجل
  rationale: اختير المعنى العام الدال على الذكر في سياق المقابلة بين الرجل والمرأة في العبادة؛ ويظل معنى «الزوج» ممكنًا بحسب السياق.
- source_word: ὀφείλει
  choice: ينبغي له
  rationale: ينقل معنى الالتزام المعياري بصورة عربية طبيعية من غير تشديده إلى أمر مطلق.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: أن يغطّي رأسه
  rationale: ترجمة مباشرة لا تحدد نوع الغطاء بما يتجاوز اللفظ اليوناني.
- source_word: εἰκὼν
  choice: صورة
  rationale: يحفظ المصطلح اللاهوتي والتلميح المرجح إلى لغة الخلق في سفر التكوين.
- source_word: δόξα
  choice: مجد
  rationale: استُعمل اللفظ نفسه في الموضعين حفاظًا على التوازي وعلى السعة الدلالية، بدل تضييقه إلى «كرامة» أو «شرف».
- source_word: ὑπάρχων
  choice: إذ هو
  rationale: يبين أن كونه صورة الله ومجده هو تعليل لما سبق، بصياغة عربية موجزة وطبيعية.
- source_word: ἡ γυνὴ
  choice: المرأة
  rationale: يحفظ المقابلة العامة بين صنفي الرجل والمرأة؛ أما «الزوجة» فممكنة معجميًا لكنها أضيق.
- source_word: ἀνδρός
  choice: الرجل
  rationale: يحافظ على المعنى العام وعلى التوازي مع أول الآية من غير تخصيص العلاقة بالزواج.
theological_decisions:
- issue: هل تُفهم ἀνήρ وγυνή بمعنى الرجل والمرأة أم الزوج والزوجة؟
  choice: الرجل والمرأة
  alternative: الزوج والزوجة
  rationale: سياق غطاء الرأس ولغة الخلق يقيمان مقابلة أوسع بين الذكر والأنثى، مع بقاء القراءة الزوجية ممكنة لغويًا؛ لذلك ذُكرت في الحاشية.
- issue: كيفية نقل العبارة غير المتناظرة عن المجد
  choice: «المرأة فهي مجد الرجل»
  alternative: «المرأة تعكس مجد الرجل» أو «المرأة كرامة الرجل»
  rationale: يحافظ هذا على الإسناد المباشر وعلى لفظ «المجد» في اليونانية، من غير تلطيف التوتر اللاهوتي أو تفسيره داخل الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظت بنية التعليل والمقابلة، كما حُفظ لفظ «مجد» في الموضعين من غير شرح تفسيري داخل المتن.
