  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: ar
  text: اقتدوا بي، كما أقتدي أنا أيضًا بالمسيح.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιμηταί
  choice: اقتدوا
  rationale: ينقل فعل الاقتداء والمحاكاة المقصودة، وهو أوضح وأطبع في العربية من الصياغة الاسمية الحرفية «كونوا مقلِّدين».
- source_word: μου
  choice: بي
  rationale: يتعدى فعل «اقتدى» بالباء، فتؤدي «بي» معنى المضاف إليه اليوناني في تركيب عربي طبيعي.
- source_word: γίνεσθε
  choice: اقتدوا
  rationale: أُدمجت قوة الأمر في صيغة فعلية عربية مباشرة؛ أما «صيروا مقتدين» فتحافظ على البنية حرفيًا لكنها ثقيلة وغير مألوفة.
- source_word: καθὼς
  choice: كما
  rationale: أداة مقارنة عربية طبيعية تحفظ الصلة بين اقتداء المخاطَبين ببولس واقتداء بولس بالمسيح.
- source_word: κἀγὼ
  choice: أنا أيضًا
  rationale: تحفظ «أيضًا» دلالة καί المندمجة مع ἐγώ، ويُظهر الضمير المنفصل التوكيد الموجود في اليونانية.
- source_word: Χριστοῦ
  choice: بالمسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، وتلزم الباء لأن الفعل المقدر في الشطر الثاني هو «أقتدي».
theological_decisions:
- issue: إظهار الفعل المحذوف في καθὼς κἀγὼ Χριστοῦ
  choice: كما أقتدي أنا أيضًا بالمسيح
  alternative: كما أنا أيضًا بالمسيح
  rationale: اليونانية تحذف لفظ «المقتدي» أو فعل الاقتداء اعتمادًا على الشطر الأول. لا تستقيم هذه الإضمارية نفسها في العربية بوضوح، لذلك أُظهر الفعل المفهوم من السياق من غير إضافة معنى جديد.
- issue: ترجمة Χριστοῦ
  choice: المسيح
  alternative: المسيح يسوع
  rationale: النص يذكر اللقب وحده، وترجمته «المسيح» تحفظ ذلك من غير إدخال اسم «يسوع» غير الموجود في الآية.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات نبرة أمرية مباشرة. فُضلت الجملة الفعلية الطبيعية «اقتدوا بي» على النقل الاسمي الثقيل، مع الحفاظ على المقارنة وعلى دلالة «أيضًا».
