lexical_decisions:
- source_word: συνερχομένων
  choice: حين تجتمعون
  rationale: اسم الفاعل في صيغة المضاف إليه مع ὑμῶν يؤدي معنى زمنيًا؛ و«حين تجتمعون» تعبير عربي طبيعي يحفظ معنى الاجتماع الجماعي.
- source_word: οὖν
  choice: فـ
  rationale: الفاء تربط الكلام استنتاجيًا بما سبق من توبيخ بسبب الانقسامات، وهي في العربية أوضح وأخف من «لذلك» في مطلع هذه الجملة.
- source_word: ἐπὶ τὸ αὐτό
  choice: في مكان واحد
  rationale: يحفظ هذا التعبير البعد المكاني للاصطلاح، ولا يكرر معنى الاجتماع الوارد في «تجتمعون».
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: لا يكون ذلك لأكل
  rationale: 'يحافظ على البنية المصدرية المضغوطة وعلى القوة التقويمية للعبارة: اجتماعهم، على النحو الموصوف، لا يرقى إلى أكل عشاء الرب. وتوضح الحاشية الوجه البديل المباشر.'
- source_word: κυριακὸν
  choice: الرب
  rationale: الصفة تعني ما يخص الرب أو ينتمي إليه؛ والإضافة في «عشاء الرب» تؤدي هذا المعنى طبيعيًا في العربية.
- source_word: δεῖπνον
  choice: عشاء
  rationale: «عشاء» هو المقابل العربي المألوف والدقيق في هذا السياق، ويحيل إلى الوجبة الجماعية المرتبطة بذكر الرب دون توسيع المعنى إلى أي وجبة.
- source_word: κυριακὸν δεῖπνον
  choice: عشاء الرب
  rationale: عبارة عربية راسخة وواضحة تنقل تركيب الصفة والاسم اليوناني بمعنى الوجبة الخاصة بالرب.
theological_decisions:
- issue: هل ينفي بولس إمكان أكل الوجبة، أم ينفي أن ممارستهم تستحق أن تسمى عشاء الرب؟
  choice: 'صياغة تحفظ الحكم على غاية اجتماعهم وطبيعته: «لا يكون ذلك لأكل عشاء الرب».'
  alternative: «فأنتم لا تأكلون عشاء الرب»؛ أو «لا يمكنكم أن تأكلوا عشاء الرب».
  rationale: السياق اللاحق يوبخ طريقة تناولهم للوجبة بسبب الانقسام وعدم المساواة، لا استحالة ميتافيزيقية. وتحفظ الصياغة المختارة شيئًا من ضغط التركيب اليوناني ومن التوتر بين نفي الغاية ونفي أهلية ما يفعلونه لأن يسمى عشاء الرب.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت الفاء للربط الاستنتاجي، وحُفظ التعبير الكنسي المألوف «عشاء الرب» دون إدخال تفسير طائفي.
