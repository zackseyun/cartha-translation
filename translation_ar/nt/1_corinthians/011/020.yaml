translation:
  language: ar
  text: فحين تجتمعون في مكان واحد، لا يكون اجتماعكم هذا لأكل عشاء الرب[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فأنتم لا تأكلون عشاء الرب»، أي إن تصرفكم يجعل ما تتناولونه غيرَ مُعَدٍّ عشاءَ الرب.'
