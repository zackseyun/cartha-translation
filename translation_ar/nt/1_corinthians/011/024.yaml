base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: ar
  text: 'وبعد أن شكر، كسره وقال: «هذا هو جسدي الذي هو لأجلكم[a][b]. داوموا على فعل هذا لذكري».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الذي نيابةً عنكم» أو «الذي من أجلكم».
    reason: lexical_alternative
  - marker: b
    text: 'تضيف بعض المخطوطات «المكسور»: «هذا هو جسدي المكسور لأجلكم».'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: وبعدما شكر
  rationale: اسم الفاعل اليوناني بصيغة الماضي يسبق الفعل الرئيس ويدل طبيعيًا على التعاقب؛ وهذه الصياغة العربية واضحة وتحفظ المعنى الزمني.
- source_word: ἔκλασεν
  choice: كسره
  rationale: الفعل يعني «كسر»، والضمير يعود بوضوح إلى الخبز المذكور في السياق.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: هذا هو جسدي
  rationale: نقل مباشر للتركيب الإسنادي، من غير تحويل «هو» إلى «يرمز إلى» أو إضافة تفسير عقائدي.
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: الذي لأجلكم
  rationale: تحفظ الصياغة معنى المنفعة والتوجّه نحو المخاطَبين، من غير حصر العبارة في نظرية كفارية محددة.
- source_word: τοῦτο ποιεῖτε
  choice: داوموا على فعل هذا
  rationale: صيغة الأمر الحاضر تلائم الفعل المتكرر أو المستمر في هذا السياق؛ و«داوموا» تُظهر هذه القوة في عربية طبيعية.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: لذكري
  rationale: تنقل معنى التذكّر المقصود وإحياء الذكرى بإيجاز ووضوح، من غير إيحاء جنائزي زائد قد تحمله كلمة «تذكار» منفردة في بعض الاستعمالات.
theological_decisions:
- issue: معنى «هذا هو جسدي» في سياق عشاء الرب
  choice: هذا هو جسدي
  alternative: هذا يرمز إلى جسدي
  rationale: تُحفظ العبارة اليونانية المباشرة كما هي، من غير حسم الجدل اللاحق بشأن كيفية حضور المسيح أو طبيعة الدلالة.
- issue: دلالة ὑπὲρ ὑμῶν
  choice: الذي لأجلكم
  alternative: الذي نيابة عنكم / الذي من أجلكم
  rationale: تُحفظ الدلالة النفعية أو التمثيلية المحتملة، مع تجنب فرض صياغة تقنية لنظرية بعينها عن الكفارة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «داوموا على فعل هذا» لإظهار تكرار الفعل، مع إبقاء «هذا هو جسدي» بلا تفسير مذهبي. وُضع الهامشان بعد العبارة التي يتصلان بها مباشرة.
