  source_fidelity: 'النص ينقل بنية الآية ومعناها الأساسيين بأمانة: الشرط («إن كان أحد جائعًا»)، والأمر («فليأكل»)، وغرض عدم الاجتماع للدينونة، ثم إرجاء معالجة المسائل الأخرى إلى وقت مجيء بولس. غير أن «فسأرتّبها» أضيق وأقل تحديدًا من διατάξομαι في هذا السياق؛ فالفعل يعني إعطاء توجيهات أو ترتيب ما ينبغي عمله في تلك المسائل، لا مجرد تنظيمها.'
