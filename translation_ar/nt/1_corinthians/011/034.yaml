  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: ar
  text: إن كان أحدٌ جائعًا، فليأكل في بيته، لئلّا تجتمعوا للدينونة[a]. وأمّا الأمور الباقية فسأعطي بشأنها تعليمات متى جئت.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «للإدانة». يمكن أن تعني الكلمة اليونانية κρίμα «الدينونة» أو «الإدانة». وتلائم «الدينونة» السياق القريب، حيث يتحدث بولس عن تأديب الرب الحاضر لا عن الإدانة النهائية (الآيات 29–32).'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: جائعًا
  rationale: 'ينقل المضارع الدال على حالة حاضرة بصياغة عربية طبيعية: «إن كان أحد جائعًا».'
- source_word: ἐν οἴκῳ
  choice: في بيته
  rationale: يدل السياق على الأكل في المحيط المنزلي بدلًا من اجتماع الكنيسة، و«في بيته» واضحة وطبيعية.
- source_word: ἐσθιέτω
  choice: فليأكل
  rationale: تحفظ لام الأمر قوة صيغة الأمر للغائب في اليونانية.
- source_word: εἰς κρίμα
  choice: للدينونة
  rationale: تحفظ معنى الحكم القضائي من غير أن تحسم بأنه إدانة نهائية، وهو ما يلائم سياق التأديب الإلهي في الأعداد 29–32.
- source_word: συνέρχησθε
  choice: تجتمعوا
  rationale: يحفظ اللفظ صلة الفعل باجتماع الكنيسة المتكرر ذكره في السياق.
- source_word: Τὰ δὲ λοιπὰ
  choice: وأمّا الأمور الباقية
  rationale: انتقال عربي واضح إلى المسائل التي سيؤجل الرسول تنظيمها إلى حضوره.
- source_word: ὡς ἂν ἔλθω
  choice: متى جئت
  rationale: ينقل الزمن المستقبلي غير المحدد مع بقاء الإشارة إلى الزيارة المرتقبة.
- source_word: διατάξομαι
  choice: فسأرتّبها
  rationale: يعكس معنى وضع الأمور في ترتيب أو تقرير ما ينبغي فيها، بصياغة موجزة ملائمة للسياق العملي.
theological_decisions:
- issue: معنى κρίμα في التحذير المتعلق باجتماع عشاء الرب
  choice: الدينونة، بمعنى حكم إلهي يمكن أن يشمل التأديب الحاضر دون التصريح بالإدانة النهائية
  alternative: الإدانة؛ أو الحكم القضائي بمعناه الأوسع
  rationale: السياق القريب في الأعداد 29–32 يذكر حكم الرب وتأديبه ويميّزه من الإدانة مع العالم؛ لذلك تُبقي «الدينونة» التوتر الدلالي ولا تفرض معنى الإدانة النهائية.
- issue: الضمير المفرد في τις مع فعل الأمر
  choice: أحدٌ ... فليأكل
  alternative: من كان جائعًا فليأكل؛ أو صياغة جمع
  rationale: تحافظ الصياغة على المفرد غير المعيّن وعلى قوة الأمر، وهي طبيعية في العربية ولا تستلزم تحديد جنس الشخص.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُخدمت «فليأكل» لحفظ الأمر، و«متى جئت» للحفاظ على شيء من عدم تحديد وقت الزيارة، مع تجنب ألفاظ مذهبية أو تفسيرية زائدة.
