  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: ar
  text: ولكنني أريد أن تعرفوا أن رأس كل رجل هو المسيح[a]، ورأس المرأة هو الرجل[b]، ورأس المسيح هو الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تُفهم كلمة «رأس» أيضًا بمعنى «مصدر» أو «صاحب سلطة على»؛ وقد أُبقيت الاستعارة اليونانية نفسها في المتن.
    reason: lexical_alternative
  - marker: b
    text: يمكن أن تُقرأ «المرأة» و«الرجل» هنا أيضًا بمعنى «الزوجة» و«الزوج».
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: ولكنني أريد أن تعرفوا
  rationale: صياغة عربية طبيعية تحفظ إرادة بولس الشخصية، وتجعل δὲ انتقالًا أو مقابلة خفيفة، وتنقل تركيب «أريدكم أن تعرفوا» بوضوح.
- source_word: παντὸς ἀνδρὸς
  choice: كل رجل
  rationale: ἀνήρ قد يعني «رجلًا» أو «زوجًا»، لكن العموم في παντός والتوازي بين العبارات يرجحان «كل رجل» هنا، مع إبقاء الاحتمال الزوجي في الحاشية الخاصة بالعبارة التالية.
- source_word: κεφαλή
  choice: رأس
  rationale: يحفظ الاستعارة اليونانية نفسها في العبارات الثلاث ولا يحسم الخلاف التفسيري بين معنى المصدر ومعنى السلطة أو الرئاسة.
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: المسيح
  rationale: المقابل العربي الراسخ للقب Χριστός، وقد أُبقي متسقًا في الموضعين.
- source_word: γυναικὸς
  choice: المرأة
  rationale: يمكن أن تعني γυνή المرأة أو الزوجة. اختير المعنى العام في المتن، وحُفظت القراءة الزوجية في الحاشية.
- source_word: ὁ ἀνήρ
  choice: الرجل
  rationale: يمكن أن يعني ἀνήρ الرجل أو الزوج. يحافظ «الرجل» على التوازي والالتباس المعجمي، بينما تذكر الحاشية احتمال «الزوج».
- source_word: ὁ θεός
  choice: الله
  rationale: الترجمة العربية المباشرة والمعتادة لـ θεός في هذا السياق.
theological_decisions:
- issue: دلالة κεφαλή في العبارات الثلاث المتوازية
  choice: الإبقاء على الاستعارة «رأس» من دون تفسيرها داخل المتن
  alternative: «مصدر» أو «صاحب سلطة على/رئيس»
  rationale: اللفظ اليوناني مجازي ودلالته هنا موضع خلاف تفسيري ولاهوتي؛ لذا تحفظ الترجمة توتر النص ولا تحسمه، وتعرض الاحتمالات في الحاشية.
- issue: هل ἀνήρ وγυνή يعنيان الرجل والمرأة أم الزوج والزوجة؟
  choice: الرجل والمرأة في المتن
  alternative: الزوج والزوجة
  rationale: التوازي وبداية العبارة بـ«كل رجل» يدعمان القراءة العامة، لكن السياق الأوسع وإمكان الدلالة المعجمية يقتضيان حفظ القراءة الزوجية في حاشية.
- issue: صياغة العبارة الأخيرة وعلاقتها بالفهم المسيحاني
  choice: «ورأس المسيح هو الله» بلا تخفيف أو توسع تفسيري
  alternative: إعادة صياغتها بما يقصرها صراحة على ترتيب وظيفي
  rationale: الترجمة المباشرة تحفظ قول النص من غير إدخال تفسير عقدي يحسم طبيعة العلاقة المقصودة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «ولكنني» لانتقال خفيف مع بقاء الصلة بالسياق، وحُفظ التوازي التركيبي والاستعارة المركزية. أُثبتت علامتا الحاشيتين [a] و[b] في المتن.
