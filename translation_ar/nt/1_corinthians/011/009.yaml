  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: ar
  text: فإن الرجل لم يُخلَق من أجل المرأة[a]، بل خُلِقَت المرأة من أجل الرجل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا ترجمة العبارتين: «بسبب المرأة» و«بسبب الرجل». فحرف الجر اليوناني قد يدل على السبب أو الغاية؛ وقد تُرجم هنا بـ«من أجل» مراعاةً لسياق الحجة القائمة على الخلق.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: فإن
  rationale: تفيد الفاء والإنّ التعليل والتوكيد بصورة عربية طبيعية، وتحفظ صلة الآية بالحجة السابقة دون ترجمة حرفية ثقيلة.
- source_word: ἐκτίσθη
  choice: يُخلَق
  rationale: ترجمة مباشرة للفعل κτίζω بصيغة المبني للمجهول، وتناسب إحالة بولس إلى الخلق.
- source_word: ἀνὴρ / γυνὴ
  choice: الرجل / المرأة
  rationale: السياق سياق الخلق، ولذلك يشير اللفظان هنا إلى الرجل والمرأة على نحو عام، لا إلى زوج وزوجة فحسب.
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: من أجل المرأة / من أجل الرجل
  rationale: تحفظ «من أجل» اتجاه العبارة نحو الغاية أو القصد في حجة الخلق، مع إبقاء احتمال الدلالة السببية في الحاشية.
- source_word: ἀλλὰ
  choice: بل
  rationale: «بل» تلائم المقابلة التصحيحية المباشرة بين شطري الجملة أكثر من «لكن» في هذا التركيب.
theological_decisions:
- issue: هل يُترجم ἀνήρ وγυνή بـ«الرجل والمرأة» أم بـ«الزوج والزوجة»؟
  choice: الرجل والمرأة
  alternative: الزوج والزوجة
  rationale: ذكر الخلق يجعل الإحالة أوسع من العلاقة الزوجية وحدها؛ وهذه الصياغة تحفظ نطاق الحجة الخَلْقي من غير إدخال تقييد مذهبي.
- issue: هل تدل διά مع النصب على الغاية أم السبب؟
  choice: من أجل، بما يرجّح الغاية من غير إلغاء الاحتمال السببي
  alternative: بسبب
  rationale: سياق الاستدلال بالخلق يرجّح معنى الغاية أو القصد، لكن حرف الجر اليوناني يحتمل أيضًا معنى السبب، ولذلك أُثبت البديل في الحاشية بدل حسم الغموض تمامًا.
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة ورصينة. استُخدمت «فإن» لربط التعليل بما قبله، وحوفظ على التوازي بين شطري الآية. وُضع مؤشر الحاشية بعد أول تركيب «من أجل»، والحاشية تصرّح بأنها تشمل التركيبين المتوازيين.
