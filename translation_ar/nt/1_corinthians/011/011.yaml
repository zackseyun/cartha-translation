  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: ar
  text: ولكن، في الرب، ليست المرأة بمعزل عن الرجل، ولا الرجل بمعزل عن المرأة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليست الزوجة بمعزل عن الزوج، ولا الزوج بمعزل عن الزوجة». يمكن أن تدل الكلمتان اليونانيتان على المرأة والرجل أو على الزوجة والزوج؛ وقد اختير هنا المعنى الأوسع لأن العبارة تبدو عامة وغير محصورة في الزواج.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: ولكن
  rationale: تفيد انتقالًا استدراكيًا يوازن ما سبق، و«ولكن» واضحة وطبيعية في العربية المعاصرة.
- source_word: γυνή
  choice: المرأة
  rationale: يمكن أن تعني «امرأة» أو «زوجة»، لكن سياق القول العام عن العلاقة المتبادلة في الرب يرجّح المعنى الأوسع.
- source_word: ἀνήρ
  choice: الرجل
  rationale: يمكن أن تعني «رجلًا» أو «زوجًا»، والموازاة مع γυνή في هذا التقرير العام ترجّح «الرجل».
- source_word: χωρὶς
  choice: بمعزل عن
  rationale: تحفظ معنى الانفصال أو الاستقلال النسبي من غير أن تضيف تفسيرًا زائدًا، وهي أنسب هنا من صياغة قد توحي بمجرد الغياب.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: تحفظ العبارة البولسية الموجزة وما فيها من احتمال الدلالة على المجال أو العلاقة بالرب.
- source_word: οὔτε ... οὔτε
  choice: ليست ... ولا
  rationale: تنقل النفي المترابط في عبارتين متوازيتين مع مراعاة المطابقة النحوية العربية.
theological_decisions:
- issue: هل تُترجم γυνή / ἀνήρ إلى «المرأة/الرجل» أم «الزوجة/الزوج»؟
  choice: المرأة/الرجل
  alternative: الزوجة/الزوج
  rationale: يتناول السياق الرجل والمرأة في الخلق والعبادة، وتأتي الآية تقريرًا موازنًا للتبادل والارتباط بينهما في الرب، لا تقريرًا محصورًا صراحة في الزواج. وتوضح الحاشية الاحتمال المعجمي الآخر بدل إخفائه.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. حُفظ التوازي بين شطري الآية، واستُعملت «بمعزل عن» لإبراز معنى الانفصال أو الاستقلال من غير حسم دلالي زائد.
