    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν
  choice: أولًا
  rationale: تؤدي وظيفة العبارة في تقديم النقطة الأولى من الحجة، من غير افتراض وجود مقابلة صريحة لاحقة.
- source_word: συνερχομένων ὑμῶν
  choice: حين تجتمعون
  rationale: ترجمة زمنية طبيعية للتركيب اليوناني، وتناسب سياق اجتماع الجماعة.
- source_word: ἐν ἐκκλησίᾳ
  choice: في جماعة المؤمنين
  rationale: تشير العبارة هنا إلى الجماعة المجتمعة، لا إلى مبنى؛ وهذه الصياغة واضحة في العربية المعاصرة وتحفظ المعنى الجماعي.
- source_word: ἀκούω
  choice: أسمع
  rationale: يحفظ زمن المضارع وكون معرفة بولس مستندة إلى ما بلغه.
- source_word: σχίσματα
  choice: انقسامات
  rationale: ينقل معنى التصدعات أو الانقسامات داخل الجماعة من غير الإيحاء بالضرورة بأحزاب رسمية.
- source_word: ὑπάρχειν
  choice: أن بينكم
  rationale: يعبّر التركيب العربي طبيعيًا عن وجود الانقسامات بينهم، من غير حاجة إلى فعل وجود صريح.
- source_word: καὶ μέρος τι
  choice: وإلى حدّ ما
  rationale: يبيّن أن تصديق بولس للتقرير جزئي أو متحفظ.
- source_word: πιστεύω
  choice: أصدّق هذا
  rationale: السياق يدل على تصديق الخبر المسموع؛ وإظهار اسم الإشارة يجعل العبارة العربية مكتملة وواضحة من غير إضافة مضمون جديد.
theological_decisions:
- issue: دلالة ἐκκλησία في السياق
  choice: جماعة المؤمنين المجتمعة
  alternative: الكنيسة، أو الاجتماع
  rationale: السياق هو اجتماع أهل كورنثوس للعشاء الرباني؛ لذلك تُتجنب دلالة المبنى، مع إبقاء المعنى الكنسي الجماعي.
- issue: مدى تصديق بولس للخبر
  choice: أصدّق هذا إلى حدّ ما
  alternative: أصدّق بعضه
  rationale: العبارة اليونانية يمكن أن تفيد تصديقًا جزئيًا أو متحفظًا. الصياغة المختارة تحفظ هذا القدر من الغموض ولا تحدد هل المقصود بعض تفاصيل الخبر أم درجة التصديق.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «جماعة المؤمنين» لتجنب فهم «الكنيسة» على أنها مبنى، وأُبقيت نبرة بولس المتحفظة في «إلى حدّ ما».
