  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: ar
  text: فإني، أولًا، حين تجتمعون كجماعة[a]، أسمع أن بينكم انقسامات، وأصدّق ذلك إلى حدّ ما.
