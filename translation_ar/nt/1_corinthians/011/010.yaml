  source_fidelity: المتن يحافظ بوجه عام على البنية والمعاني المعجمية للأصل اليوناني، ولا سيما إبقاء «سلطان» دون إدخال «غطاء» أو «علامة» في المتن. لكن «من أجل الملائكة» قد تُفهم غائيًا أكثر من سببيًا، في حين أن διά مع النصب هنا تفيد السبب على الأرجح. كما أن بديل الحاشية «الرُّسُل» ليس المقابل المعجمي الدقيق في هذا الموضع، وقد يلتبس بالمصطلح العربي المعتاد للرسل/الرسول.
