    rationale: البديل المعجمي لـἄγγελοι هو «المبعوثون/الرسل» بحسب السياق، لكن «الرُّسُل» في العربية مصطلح ديني قد يُفهم على أنه رسل الله أو الرسل المسيحيون؛ لذلك «المبعوثين» أدق وأقل تحميلًا تفسيريًا.
