  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: ar
  text: لِهٰذَا يَنْبَغِي لِلْمَرْأَةِ أَنْ يَكُونَ لَهَا سُلْطَانٌ عَلَى رَأْسِهَا[a]، بِسَبَبِ الْمَلَائِكَةِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بصياغة تفسيرية أكثر: «أن تضع على رأسها علامةَ سلطان». فالنص اليوناني يقول «سلطانًا»، ولا يذكر صراحة «علامة» أو «غطاء».'
    reason: alternative_reading
  - marker: b
    text: 'أو: «بسبب المبعوثين»، مع أن معنى «الملائكة» هو الأرجح هنا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لِهٰذَا
  rationale: أداة استنتاج سببي طبيعية في العربية، تصل الحُجّة بما سبق من غير زيادة تفسيرية.
- source_word: ὀφείλει
  choice: يَنْبَغِي
  rationale: تنقل معنى الالتزام أو ما يَلزم ويَليق، من غير تحويل العبارة إلى أمر قانوني صريح.
- source_word: ἡ γυνὴ
  choice: لِلْمَرْأَةِ
  rationale: تحفظ المفرد الدال على الجنس في سياق الحديث العام عن الرجل والمرأة، ولا تضيّق المعنى إلى الزوجة.
- source_word: ἐξουσίαν
  choice: سُلْطَانٌ
  rationale: ينقل اللفظ اليوناني الدال على السلطة أو الصلاحية، من غير إدخال كلمتي «علامة» أو «غطاء» غير المذكورتين صراحة.
- source_word: ἔχειν
  choice: أَنْ يَكُونَ لَهَا
  rationale: صياغة عربية طبيعية لمعنى «أن تكون لها/أن تملك»، وتتجنب استيراد معنى «تلبس» من السياق.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: عَلَى رَأْسِهَا
  rationale: تحفظ العلاقة المكانية العامة في الأصل من غير تحديد ماهية ما يكون على الرأس.
- source_word: διὰ τοὺς ἀγγέλους
  choice: مِنْ أَجْلِ الْمَلَائِكَةِ
  rationale: تنقل دلالة السبب في διά مع النصب؛ و«الملائكة» هو المعنى الأرجح لـ ἀγγέλους هنا.
theological_decisions:
- issue: معنى ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς
  choice: أن يكون لها سلطان على رأسها
  alternative: أن تضع على رأسها علامة سلطان؛ أو أن يكون على رأسها غطاء علامةً للسلطان
  rationale: الأصل يذكر «سلطانًا» ولا يذكر صراحة «علامة» أو «غطاء». لذلك تُحفظ العبارة الملتبسة في المتن ويُذكر التفسير الشائع في الحاشية.
- issue: مرجع ἀγγέλους
  choice: الملائكة
  alternative: الرُّسُل أو المبعوثون
  rationale: اللفظ يمكن معجميًا أن يدل على مبعوثين، لكن الجمع غير المقيّد في هذا السياق يُفهم على الأرجح عن الكائنات السماوية، من غير تبنّي تفسير خاص لسبب ذكرها.
- issue: نطاق γυνή
  choice: المرأة
  alternative: الزوجة
  rationale: السياق الأوسع يتناول الرجل والمرأة بصيغة تمثيلية عامة، فلا يُحصر اللفظ في العلاقة الزوجية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختير «سلطان» للمحافظة على الغموض الدلالي واللاهوتي في العبارة، ووُضعت علامتا الحاشيتين بعد العبارتين اللتين تشرحانهما مباشرة.
