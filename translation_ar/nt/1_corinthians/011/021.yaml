translation:
  language: ar
  text: لأن كلَّ واحدٍ يسبق فيأكل عشاءه الخاصَّ عند الأكل[a]، فواحدٌ جائعٌ، وآخرُ يسكر[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يتناول عشاءه الخاص قبل الآخرين»؛ قد يشدد الفعل اليوناني على أخذ الشيء مسبقًا أو على التقدم من غير انتظار الآخرين.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فالواحد جائع، والآخر سكران».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: كلَّ واحدٍ
  rationale: يحفظ القوة التوزيعية للمفرد، إذ يوجّه اللوم إلى تصرف كل فرد.
- source_word: γὰρ
  choice: لأن
  rationale: تربط الآية بما قبلها بوصفها تعليلًا للتوبيخ السابق.
- source_word: τὸ ἴδιον δεῖπνον
  choice: عشاءه الخاصَّ
  rationale: «عشاء» ينقل معنى الوجبة الرئيسة، وغالبًا المسائية، و«الخاص» يبرز مقابلتها بالوجبة المشتركة.
- source_word: προλαμβάνει
  choice: يسبق فيأكل
  rationale: يجمع بصورة طبيعية بين معنى التقدم الزمني ومعنى تناول الوجبة قبل الآخرين، مع إبقاء البديل الأوسع في الحاشية.
- source_word: ἐν τῷ φαγεῖν
  choice: عند الأكل
  rationale: ينقل الاستعمال الزمني للمصدر المعرّف من غير إضافة تفسيرية مثل «حين يحين وقت الأكل».
- source_word: ὃς μὲν ... ὃς δὲ
  choice: الواحد ... الآخر
  rationale: صياغة عربية موجزة وطبيعية للمقابلة بين فئتين من المشاركين.
- source_word: πεινᾷ
  choice: يبقى ... جائعًا
  rationale: يبيّن الحالة الناتجة في السياق، حيث لا ينال بعض المشاركين ما يكفيهم، من غير تغيير جوهر الفعل المضارع.
- source_word: μεθύει
  choice: يسكر
  rationale: ينقل بوضوح معنى السكر الفعلي، ولا يلطّفه إلى مجرد الإفراط في الأكل أو الشرب.
theological_decisions:
- issue: الإحالة التوزيعية المفردة وصيغة التذكير
  choice: كل واحد ... عشاءه
  alternative: كل شخص ... عشاءه؛ كل واحد ... وجبته
  rationale: الأصل اليوناني يستعمل مفردًا مذكرًا ذا قوة توزيعية؛ تحافظ العربية على ذلك طبيعيًا من غير تحويله إلى جمع.
- issue: طبيعة الإساءة في عشاء الرب
  choice: يسكر
  alternative: يكون سكران؛ يثمل
  rationale: النص يدل على السكر الفعلي لدى بعض المشاركين، فلا ينبغي تخفيفه إلى مجرد الشبع أو الإفراط.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت صياغة مباشرة تحافظ على التوبيخ وعلى مقابلة الجوع بالسكر، مع إثبات مواضع الاحتمال المعجمي في الحواشي.
