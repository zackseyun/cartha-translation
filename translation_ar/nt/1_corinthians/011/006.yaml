source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: ar
  text: لأن المرأة إن لم تغطِّ رأسها[a]، فلتقصَّ شعرها أيضًا. ولكن إن كان من العار على المرأة أن تقصَّ شعرها أو أن تحلق رأسها، فلتغطِّ رأسها.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الزوجة» في جميع مواضع الآية؛ فاللفظة اليونانية يمكن أن تعني «امرأة» أو «زوجة» بحسب السياق.
    reason: alternative_reading
  - marker: b
    text: 'يمكن أيضًا ترجمة الفعل: «فلتتغطَّ» أو «فلتُغطَّ»؛ فاليونانية تتحدث عن التغطية، ويفهم من السياق أن المقصود تغطية الرأس.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: تغطي رأسها / فلتغطِّ رأسها
  rationale: الفعل يعني التغطية أو الاحتجاب. ولأن الرأس مفهوم من سياق المقطع، صُرِّح به في العربية طلبًا للوضوح من غير تحديد نوع بعينه من أغطية الرأس.
- source_word: γυνή
  choice: المرأة
  rationale: يمكن أن تعني اللفظة اليونانية «امرأة» أو «زوجة». وصياغة الآية عامة ولا تذكر زوجًا صراحة، لذلك اختيرت «المرأة» مع إثبات الاحتمال الآخر في الحاشية.
- source_word: κειράσθω / τὸ κείρασθαι
  choice: فلتقصَّ شعرها / أن تقصَّ شعرها
  rationale: يدل الفعل على جزّ الشعر أو قصّه قصيرًا، وهو متميز من الحلق المذكور بعده. وهذه الصياغة طبيعية وواضحة في العربية المعاصرة.
- source_word: καί
  choice: أيضًا
  rationale: 'تحفظ التدرج الحجاجي: إن لم تتغطَّ، فلتقبل أيضًا النتيجة التالية، وهي قص الشعر.'
- source_word: αἰσχρόν
  choice: من العار
  rationale: تنقل العبارة بوضوح بُعد الخزي والعار الاجتماعي الذي تحمله اللفظة في هذا السياق.
- source_word: ξυρᾶσθαι
  choice: تحلقه
  rationale: يدل الفعل على الحلق بالموس، وضمير الشعر المستفاد من السياق يحافظ على التمييز بين قص الشعر وحلقه.
- source_word: γὰρ ... δὲ
  choice: لأن ... ولكن
  rationale: تنقل الرابطتان بنية التعليل ثم المقابلة في حجة بولس بصورة طبيعية.
theological_decisions:
- issue: هل تُترجم γυνή «امرأة» أم «زوجة»؟
  choice: المرأة
  alternative: الزوجة
  rationale: لا يذكر النص زوجًا صراحة، وعبارته في هذه الآية عامة؛ لذلك تحافظ «المرأة» على اتساع الدلالة ولا تقصر الحكم على المتزوجات، مع إبقاء «الزوجة» احتمالًا لغويًا في الحاشية.
- issue: هل تعني κατακαλύπτεται تغطية الرأس أم الاحتجاب بغطاء مخصوص؟
  choice: تغطي رأسها
  alternative: تحتجب / تضع غطاءً
  rationale: السياق يدل على تغطية الرأس، لكن النص لا يحدد هنا شكل الغطاء أو نوعه؛ لذا تجنبت الصياغة فرض لباس مخصوص.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت صيغة الأمر «فلتقصَّ / فلتغطِّ» للمحافظة على قوة الأمر اليوناني، مع تجنب ألفاظ تراثية أقل تداولًا مثل «تُجزّ» أو «تُحلق بالموس». وُضعت علامتا الحاشية في المتن كلتاهما، وأُبقي التمييز بين قص الشعر وحلقه.
