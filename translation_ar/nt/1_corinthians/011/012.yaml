source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: ar
  text: فكما أن المرأة من الرجل[a]، كذلك الرجل أيضًا بواسطة المرأة؛ وكل شيء من الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الزوجة» و«الزوج»، إذا فُهم السياق على نحو أضيق بوصفه متعلقًا بالعلاقة الزوجية، لا بعلاقة المرأة والرجل عمومًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: فكما أن
  rationale: تنقل أداة المقارنة مع γάρ التفسيرية؛ فالفاء تصل الكلام بما قبله، و«كما» تمهّد للمقابلة التي تتمّ بلفظ «كذلك».
- source_word: ἡ γυνὴ
  choice: المرأة
  rationale: يمكن أن تعني γυνή «امرأة» أو «زوجة»، لكن الإشارة إلى الخلق والولادة تجعل المعنى العام «المرأة» أنسب، مع إبقاء الاحتمال الزوجي في الحاشية.
- source_word: ἐκ τοῦ ἀνδρός
  choice: من الرجل
  rationale: تفيد ἐκ المصدر أو المنشأ، وتحافظ «من الرجل» على التلميح إلى خلق المرأة من الرجل.
- source_word: ὁ ἀνὴρ
  choice: الرجل
  rationale: يمكن أن تعني ἀνήρ «رجلًا» أو «زوجًا»، والمعنى العام هنا يوازن «المرأة» ويوافق الاستدلال بالخلق والولادة.
- source_word: διὰ τῆς γυναικός
  choice: عن طريق المرأة
  rationale: تفيد διά مع المضاف إليه الواسطة أو الوسيلة. وتوضح العبارة أن الرجل يأتي إلى الوجود عن طريق المرأة، مع عدم طمس الفرق بينها وبين ἐκ «من».
- source_word: τὰ δὲ πάντα
  choice: ولكن كل الأشياء
  rationale: تنقل δέ بوصفها انتقالًا ذا مسحة مقابلة، وتُبقي التعبير الشامل «كل الأشياء» بدل تضييقه إلى البشر وحدهم.
- source_word: ἐκ τοῦ θεοῦ
  choice: من الله
  rationale: تفيد ἐκ المصدر أو المنشأ، وتأتي العبارة ذروة تؤكد أن المصدر النهائي لكل الأشياء هو الله.
theological_decisions:
- issue: دلالة γυνή وἀνήρ في الآية
  choice: «المرأة» و«الرجل» بالمعنى العام
  alternative: «الزوجة» و«الزوج» بالمعنى الزوجي الأضيق
  rationale: تجمع الآية بين أصل المرأة في الخلق ومجيء الرجل عن طريق المرأة في الولادة، ولذلك يتجاوز نطاقها زوجين بعينهما. ومع ذلك يظل المعنى الزوجي ممكنًا لغويًا، فذُكر في الحاشية.
- issue: العلاقة بين أصلي المرأة والرجل
  choice: الحفاظ على التمييز بين «من» (ἐκ) و«عن طريق» (διά)
  alternative: ترجمة العبارتين كلتيهما بـ«من» طلبًا للسلاسة
  rationale: يميّز بولس بين كون المرأة من الرجل في الخلق وكون الرجل يأتي عن طريق المرأة في الولادة؛ والحفاظ على هذا الفرق يصون التبادل والتوتر المقصودين في النص.
- issue: مدى عبارة τὰ πάντα
  choice: «كل الأشياء» دون تقييدها بالبشر
  alternative: «الجميع» أو «كل الناس»
  rationale: العبارة اليونانية محايدة وشاملة حرفيًا، ولا ينبغي تضييق مداها تفسيرًا، حتى مع اتصالها المباشر بعلاقة الرجل والمرأة.
translation_notes:
  register: صياغة عربية فصحى معاصرة وواضحة ذات نبرة كتابية رصينة. استُعملت «عن طريق» لتمييز διά بوضوح عن ἐκ، وأُبقيت المقابلة المتوازنة «فكما... كذلك أيضًا...» والحرف الاستدراكي «ولكن».
