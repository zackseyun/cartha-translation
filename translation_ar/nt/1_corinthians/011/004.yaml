  text: πᾶς ἀνὴρ προσευχόμενος ἢ προφητεύων κατὰ κεφαλῆς ἔχων καταισχύνει τὴν κεφαλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: ar
  text: كلُّ رجلٍ يصلّي أو يتنبّأ وعلى رأسه شيءٌ، يُهين رأسه[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو بحسب الصياغة التقليدية: «ورأسه مغطّى». يقول اليوناني حرفيًا ما معناه: «وله شيء على الرأس/نازل من الرأس»، ولا يحدّد نوع الغطاء.'
    reason: lexical_alternative
  - marker: b
    text: قد تعني «رأسه» رأسه الجسدي، مع احتمال أن تردّد أيضًا صدى الاستعمال العلاقي لكلمة «رأس» في السياق المحيط.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: كلُّ رجلٍ
  rationale: تأتي ἀνήρ بمعنى «رجل» أو «زوج» بحسب السياق. وهنا تقترن العبارة العامة «كل رجل» بعبارة «كل امرأة» في الآية التالية، ولذلك يحافظ هذا الاختيار على الدلالة الذكورية الصريحة من غير أن يحمّل النص معنى الزوج خصوصًا.
- source_word: προσευχόμενος ἢ προφητεύων
  choice: يصلّي أو يتنبّأ
  rationale: ينقل الفعلان المضارعان عمل الرجل حال انشغاله بالصلاة أو التنبؤ، وصيغة المضارع العربية طبيعية وواضحة.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: وعلى رأسه شيءٌ
  rationale: العبارة اليونانية اصطلاحية وحرفيتها نحو «وله شيء على الرأس/نازل من الرأس»، من غير تسمية غطاء بعينه. والصياغة المختارة واضحة ولا تحدد ما لم يحدده الأصل.
- source_word: καταισχύνει
  choice: يُهين
  rationale: يدل الفعل على إلحاق الخزي أو العار وإسقاط الكرامة. و«يهين» تعبير عربي طبيعي مع «رأسه» ويحفظ بُعد الكرامة والعار في السياق.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: رأسه
  rationale: تحافظ الصياغة على إمكان الإشارة إلى رأس الرجل الجسدي، مع صدى الاستعمال العلاقي لكلمة «رأس» في السياق السابق، من غير حسم المقصود.
theological_decisions:
- issue: هل تشير κεφαλή في الجملة الأخيرة صراحةً إلى الرأس الجسدي أم إلى «الرأس» بالمعنى العلاقي؟
  choice: الإبقاء على الاحتمالين بترجمة «رأسه»
  alternative: رأسه الجسدي؛ أو مَن هو رأسه
  rationale: تسمح صياغة بولس بتداخل بلاغي بين الرأس الجسدي واستعمال «الرأس» العلاقي في السياق المحيط؛ لذا لا ينبغي حسم هذا التوتر في المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُعمل «يتنبّأ» بوصفه المقابل الكتابي الشفاف، وحُفظ تكرار «الرأس» والغموض المقصود في الأصل.
