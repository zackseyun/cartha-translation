  source_fidelity: 'النص العربي ينقل عناصر اليونانية كلها بأمانة: الأمر κρίνατε في «احكموا»، والتوكيد في ἐν ὑμῖν αὐτοῖς في «أنتم بأنفسكم»، وسؤال الملاءمة في «هل يليق»، ودلالة γυνή العامة في «المرأة»، وحال ἀκατακάλυπτον بعبارة واضحة سياقيًا «ورأسها غير مغطّى»، وتوجيه الصلاة إلى الله.'
  naturalness: الصياغة فصيحة معاصرة وسلسة، وتحافظ على الطابع الاستفهامي البلاغي للنص. عبارة «احكموا أنتم بأنفسكم» مفهومة طبيعيًا هنا بوصفها دعوة إلى إصدار حكمهم هم، لا حكمًا قضائيًا على ذواتهم.
  terminology: «يليق» مناسب لـ πρέπον، و«المرأة» هي الاختيار الافتراضي السليم لـ γυνή في هذه الآية دون تضييقها إلى المعنى الزوجي. الحاشية تحفظ احتمال «زوجة» بوضوح، و«رأسها غير مغطّى» يبيّن المرجع المفهوم من سياق المقطع دون تحميل اللفظ اليوناني أكثر من دلالته.
