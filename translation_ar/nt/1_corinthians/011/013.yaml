  text: ἐν ὑμῖν αὐτοῖς κρίνατε· πρέπον ἐστὶν γυναῖκα ἀκατακάλυπτον τῷ θεῷ προσεύχεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: ar
  text: 'احكموا أنتم بأنفسكم: هل يليق بالمرأة أن تصلّي إلى الله ورأسها غير مغطّى؟[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بالزوجة»، إذا فُهمت كلمة γυνή بمعناها الزوجي في السياق الأوسع لهذا المقطع.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: أنتم بأنفسكم
  rationale: ينقل التوكيد الانعكاسي في العبارة اليونانية بوضوح وطبيعية، ويجعل المخاطَبين مسؤولين عن إصدار الحكم.
- source_word: κρίνατε
  choice: احكموا
  rationale: صيغة أمر تدعو إلى التقييم، و«احكموا» تحفظ قوة الطلب المباشر.
- source_word: πρέπον ἐστὶν
  choice: هل يليق
  rationale: تؤدي معنى الملاءمة والاحتشام في صياغة عربية فصيحة ومألوفة.
- source_word: γυναῖκα
  choice: بالمرأة
  rationale: يمكن أن تعني اللفظة «امرأة» أو «زوجة»، لكن الآية تصوغ السؤال بصيغة عامة ولا تذكر زوجًا صراحة؛ لذلك اختير المعنى الأعم مع إثبات البديل في الحاشية.
- source_word: ἀκατακάλυπτον
  choice: ورأسها غير مغطّى
  rationale: المعنى الحرفي «غير مغطاة»، وسياق المقطع يبين أن المقصود هو الرأس؛ والتصريح به يمنع الغموض في العربية.
- source_word: τῷ θεῷ
  choice: إلى الله
  rationale: المجرور اليوناني مع فعل الصلاة يدل على الجهة التي تُوجَّه إليها الصلاة.
- source_word: προσεύχεσθαι
  choice: أن تصلّي
  rationale: ترجمة مباشرة وطبيعية للمصدر اليوناني الدال على الصلاة.
theological_decisions:
- issue: دلالة γυνή في سياق الحديث عن غطاء الرأس
  choice: المرأة
  alternative: الزوجة
  rationale: لا تذكر هذه الآية زوجًا صراحة، وسؤال بولس مصوغ بصيغة عامة؛ لذا لا تُضيَّق الدلالة إلى الزوجة في المتن، مع حفظ الاحتمال الزوجي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. حُفظ الأسلوب الاستفهامي البلاغي وقوة الأمر، مع إظهار الرأس الذي يفهم من السياق دون تضييق دلالة γυνή في المتن.
