  source_fidelity: 'النص العربي يحافظ بدقة على البنية الأساسية لليونانية: تكرار «يأكل ويشرب»، ودلالة κρίμα بوصفها «دينونة» لا تستلزم الإدانة النهائية، وانعكاس الأثر على الفاعل في «على نفسه». كما أن «إذ لا يميّز الجسد» تؤدي صيغة اسم الفاعل المنفي μὴ διακρίνων من غير فرض تفسير محدد.'
  naturalness: الصياغة فصيحة معاصرة وواضحة، والتكرار مقصود ومقبول لأنه يعكس تأكيد الأصل. وعبارة «يميّز الجسد» طبيعية في سجل ترجمة كتابية رصين، مع أن معناها يظل مفتوحًا على وجوهه السياقية كما في اليونانية.
  terminology: «دينونة»، «يميّز»، و«الجسد» اختيارات مناسبة ومتسقة مع المصطلح اللاهوتي وبنية النص. لا تُضاف «الرب» إلى المتن، وهو أمر مهم لأن قراءة SBLGNT هي «الجسد» فقط. الحاشية (أ) تصف المتغير النصي، والحاشية (ب) تعرض الاحتمالات التفسيرية دون ترجيح مذهبي.
