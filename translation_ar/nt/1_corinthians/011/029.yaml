base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: ar
  text: لِأَنَّ مَنْ يَأْكُلُ وَيَشْرَبُ، يَأْكُلُ وَيَشْرَبُ دَيْنُونَةً عَلَى نَفْسِهِ، إِذْ لَا يُمَيِّزُ الْجَسَدَ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «جسد الرب» بدلًا من «الجسد».'
    reason: textual_variant
  - marker: b
    text: 'أو: «إذ لا يتبيّن الجسد حقّ التبيّن». وقد تشير العبارة إلى إدراك دلالة عشاء الرب، أو تمييز جماعة المؤمنين بوصفها جسدًا، أو إلى الأمرين معًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: دَيْنُونَةً
  rationale: تدل الكلمة على حكم قضائي أو قضاء واقع، لا بالضرورة على الإدانة النهائية. ولفظ «دينونة» يحفظ هذا المعنى الأوسع، ولا سيما أن السياق اللاحق يتحدث عن تأديب إلهي.
- source_word: ἑαυτῷ
  choice: عَلَى نَفْسِهِ
  rationale: تنقل أثر الحكم الذي يجلبه الآكل والشارب على نفسه، وهي صياغة عربية واضحة ومألوفة.
- source_word: διακρίνων
  choice: يُمَيِّزُ
  rationale: الفعل يفيد التمييز وإجراء التقدير الصحيح. ويحفظ «يميّز» احتمال إدراك الجسد وإعطائه ما يليق به، من غير حسم المقصود على نحو تفسيري.
- source_word: τὸ σῶμα
  choice: الْجَسَدَ
  rationale: النص اليوناني المختار يقول «الجسد» فقط؛ لذلك تُحفظ عبارته الموجزة وغموضها المقصود، من غير إضافة «الرب» أو «جماعة المؤمنين» إلى المتن.
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: مَنْ يَأْكُلُ وَيَشْرَبُ
  rationale: «مَن» تؤدي معنى اسم الفاعل المستعمل استعمالًا عامًا، وهي طبيعية وواضحة في العربية.
- source_word: μὴ διακρίνων
  choice: إِذْ لَا يُمَيِّزُ
  rationale: تنقل صيغة الحال السببية في اليونانية من غير تحويلها إلى شرط صريح، وتبين صلة الدينونة بعدم تمييز الجسد.
theological_decisions:
- issue: المقصود بعبارة «الجسد» في سياق عشاء الرب
  choice: الإبقاء على «الجسد» من غير تحديد في المتن
  alternative: جسد الرب؛ أو جسد المؤمنين المجتمعين
  rationale: اليونانية تقول «الجسد» وحدها، والسياق يتيح الإشارة إلى جسد المسيح في العشاء، أو الكنيسة بوصفها جسده، أو كليهما. لذا ينبغي ألا تحسم الترجمة هذا التوتر التفسيري.
- issue: دلالة κρίμα
  choice: دينونة
  alternative: إدانة
  rationale: السياق، ولا سيما العدد 32، يميز بين التأديب الحاضر والإدانة مع العالم؛ لذلك لا ينبغي أن توحي الترجمة هنا حتمًا بالهلاك النهائي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حوفظ على تكرار «يأكل ويشرب» المطابق لبنية اليونانية وعلى الإيجاز والغموض الحقيقيين في عبارة «الجسد». وُضعت علامتا الحاشيتين بعد العبارة التي تتصلان بها، مع ورود كلتيهما في المتن.
