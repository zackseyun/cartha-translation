  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: ar
  text: وأمدحكم لأنكم تذكرونني في كل شيء، وتتمسكون بالتقاليد كما سلّمتها إليكم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «التعاليم» أو «الإرشادات»؛ واللفظ اليوناني هو «التقاليد»، أي ما تمّ تسليمه.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: أمدحكم
  rationale: ينقل معنى المدح أو الثناء مباشرة، مع إظهار المفعول به الجمع في العربية.
- source_word: δὲ
  choice: الواو في «وأنا»
  rationale: أداة انتقال خفيفة في السياق، فنُقلت بربط عربي لطيف من غير إقحام معنى زمني مثل «الآن» أو تقوية معنى الاستدراك.
- source_word: ὅτι
  choice: لأنكم
  rationale: تبيّن سبب مدح بولس لهم، وهو الأنسب للسياق.
- source_word: πάντα
  choice: في كل شيء
  rationale: يحفظ شمول العبارة اليونانية من غير حصرها في معنى «دائمًا».
- source_word: μου μέμνησθε
  choice: تذكرونني
  rationale: صياغة عربية طبيعية تنقل استمرار إبقائهم بولس في الذاكرة.
- source_word: καθὼς
  choice: كما
  rationale: تحفظ معنى المطابقة بين طريقة تسليم بولس وتمسّكهم بما تسلّموه.
- source_word: παρέδωκα
  choice: سلّمتها
  rationale: ينقل فعل تمرير الموروث أو التعليم إليهم، ويقيم الصلة اللفظية مع «التقاليد».
- source_word: τὰς παραδόσεις
  choice: التقاليد
  rationale: هو المقابل الأقرب لما جرى تسليمه، ويحفظ طبيعة المصطلح من غير اختزاله إلى تعليم عام أو تحميله مفهومًا طائفيًا لاحقًا.
- source_word: κατέχετε
  choice: تتمسكون
  rationale: يفيد الاحتفاظ والالتزام المستمرين بلغة عربية معاصرة واضحة.
theological_decisions:
- issue: دلالة παραδόσεις في السياق الكنسي
  choice: التقاليد
  alternative: التعاليم أو الإرشادات
  rationale: يحفظ الاختيار فئة ما سلّمه بولس إلى أهل كورنثوس، من غير أن يساويه بكل تقليد كنسي لاحق أو يطمس عنصر التسليم المتضمن في اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «وأنا أمدحكم» لتمثيل الانتقال الخفيف الذي تؤديه δέ من غير إضافة «الآن»، وحُفظت الصلة بين «التقاليد» و«سلّمتها».
