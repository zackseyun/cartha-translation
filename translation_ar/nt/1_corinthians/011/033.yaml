  text: فإذًا، يا إخوتي، حين تجتمعون لتأكلوا، انتظروا بعضكم بعضًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يا إخوتي وأخواتي»؛ فاليونانية تقول حرفيًا «إخوتي»، وكثيرًا ما تستعمل صيغة المذكّر لمخاطبة جماعة تضم رجالًا ونساءً.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: فإذًا
  rationale: أداة استنتاج تربط الوصية بما سبق من تقويم إساءة الممارسة في عشاء الرب، وتحفظ معنى النتيجة بعبارة عربية طبيعية.
- source_word: ἀδελφοί μου
  choice: يا إخوتي
  rationale: نداء جمع مع ضمير المتكلم؛ و«يا إخوتي» صياغة عربية واضحة تحفظ صورة المذكّر في اليونانية، مع بيان شمول الخطاب في الحاشية.
- source_word: συνερχόμενοι
  choice: حين تجتمعون
  rationale: اسم فاعل حالي يؤدي وظيفة ظرفية مع فعل الأمر، فيبيّن الظرف الذي تسري فيه الوصية.
- source_word: εἰς τὸ φαγεῖν
  choice: لتأكلوا
  rationale: تركيب εἰς مع المصدر المعرّف يدل على الغاية؛ واللام مع الفعل المضارع تنقل ذلك بإيجاز ومن غير تخصيص زائد لطبيعة الطعام.
- source_word: ἀλλήλους
  choice: بعضكم بعضًا
  rationale: ضمير تبادلي في موقع المفعول به، وهذه العبارة هي المقابل العربي الطبيعي الدال على المعاملة المتبادلة.
- source_word: ἐκδέχεσθε
  choice: انتظروا
  rationale: في ضوء شكوى السياق من أن بعضهم يسبق غيره إلى الأكل، يُفهم الفعل هنا على الأرجح بمعنى الانتظار قبل البدء، مع بقاء معنى الاستقبال ممكنًا معجميًا.
theological_decisions:
- issue: شمول لفظ ἀδελφοί للنساء والرجال
  choice: إبقاء «إخوتي» في المتن مع توضيح شمولها المحتمل للجماعة كلها في الحاشية.
  alternative: يا إخوتي وأخواتي
  rationale: اللفظ اليوناني مذكّر من جهة الصيغة، لكنه كثيرًا ما يُستخدم في مخاطبة جماعة مختلطة؛ فالحاشية تحفظ الصيغة الأصلية وقوة الاستعمال معًا دون حسم أحدهما على حساب الآخر.
- issue: دلالة ἐκδέχεσθε في سياق العشاء
  choice: انتظروا
  alternative: استقبلوا / اقبلوا
  rationale: السياق المباشر، ولا سيما سبق بعضهم إلى الأكل، يرجّح معنى انتظار الآخرين؛ لكن البديل المعجمي لا يُنفى من حيث أصل دلالة الفعل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «فإذًا» لإظهار الاستنتاج، و«حين تجتمعون» لصياغة الحال بصورة طبيعية، و«انتظروا بعضكم بعضًا» لنقل الأمر في سياقه العملي.
