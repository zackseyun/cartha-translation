source:
  edition: SBLGNT
  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: ar
  text: ولكنني، إذ أوصيكم بهذا[a]، لا أمدحكم، لأنكم تجتمعون لا لما هو أفضل، بل لما هو أسوأ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إذ آمركم بهذا». يمكن للفعل اليوناني أن يفيد الوصية أو التوجيه أو الأمر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: بهذا
  rationale: اسم الإشارة المحايد يعود على التوجيه الذي يقدمه بولس، وصيغة «بهذا» تتصل طبيعيًا بالفعل «أوصيكم» من غير إضافة معنى غير مصرح به.
- source_word: δὲ
  choice: ولكنني
  rationale: تفيد انتقالًا مصحوبًا بمقابلة لطيفة مع ما سبق، و«لكن» تنقل التحول إلى التوبيخ بوضوح.
- source_word: παραγγέλλων
  choice: إذ أوصيكم
  rationale: اسم فاعل حالي من παραγγέλλω، ويحتمل معنى التوجيه أو الوصية أو الأمر. «أوصيكم» يحفظ النبرة السلطوية من غير تغليظها إلى أمر صارم.
- source_word: οὐκ ἐπαινῶ
  choice: لا أمدحكم
  rationale: ترجمة مباشرة واضحة لـἐπαινέω، وتحافظ على الصلة بالمقابلة مع مدح بولس لهم في الآية 2.
- source_word: ὅτι
  choice: لأنكم
  rationale: تُفهم هنا سببية، فتقدم علة عدم المدح.
- source_word: οὐκ εἰς τὸ κρεῖσσον
  choice: لا لما هو أفضل
  rationale: يحفظ التركيب المقارن ودلالة النتيجة أو الغاية من دون حصرها في منفعة أو صلاح محدد.
- source_word: ἀλλὰ εἰς τὸ ἧσσον
  choice: بل لما هو أسوأ
  rationale: يحافظ على المقابلة المتوازية مع «أفضل» وعلى القوة المقارنة في الأصل.
- source_word: συνέρχεσθε
  choice: تجتمعون
  rationale: تعبير عربي طبيعي وواضح عن اجتماع الجماعة معًا في سياق العبادة.
theological_decisions:
- issue: درجة السلطان في παραγγέλλων
  choice: أوصيكم
  alternative: آمركم
  rationale: الفعل اليوناني يحتمل التوجيه السلطوي والأمر. اختيرت «أوصيكم» لأنها تنقل توجيه بولس الملزم دون أن تحسم النبرة لصالح أقوى معنى ممكن، مع إثبات البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على التوازي البلاغي بين «أفضل» و«أسوأ»، وعلى توبيخ بولس المباشر من غير تفسير إضافي.
