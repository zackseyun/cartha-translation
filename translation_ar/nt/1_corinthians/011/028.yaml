  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: ar
  text: ولكن ليمتحن الإنسان نفسه، وهكذا ليأكل من الخبز ويشرب من الكأس.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: ليمتحن
  rationale: ينقل معنى فحص النفس واختبارها للتثبت، بصياغة عربية واضحة ومباشرة.
- source_word: ἄνθρωπος
  choice: الإنسان
  rationale: اللفظ اليوناني عام هنا، ويشير إلى الشخص من حيث هو إنسان، لا إلى الذكر على وجه الخصوص.
- source_word: οὕτως
  choice: وهكذا
  rationale: يحافظ على الصلة بين امتحان النفس والمشاركة اللاحقة من الخبز والكأس، من غير إضافة تفسير لطبيعة هذه الصلة.
- source_word: ἐκ τοῦ ἄρτου / ἐκ τοῦ ποτηρίου
  choice: من الخبز / من الكأس
  rationale: يحافظ على حرف الجر الوارد في النص اليوناني وعلى التوازي بين العبارتين.
theological_decisions:
- issue: هل امتحان النفس يمنع المشاركة أم يهيئ لها؟
  choice: 'حُفظ تسلسل الأمرين: «ليمتحن... وهكذا ليأكل... ويشرب».'
  alternative: صياغة تفيد الامتناع عند عدم الاستحقاق أو تضيف شرطًا صريحًا.
  rationale: النص يأمر بامتحان النفس ثم بالمشاركة على هذا النحو، ولا يصرح هنا بشرط امتناع إضافي.
- issue: دلالة ἄνθρωπος من جهة الجنس
  choice: الإنسان
  alternative: الرجل
  rationale: اختير اللفظ العربي العام الموافق للاستعمال اليوناني السياقي، تجنبًا لقصر الوصية على الذكور دون سند من النص.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة، مع الحفاظ على صيغة الأمر والتوازي اللفظي بين الأكل من الخبز والشرب من الكأس.
