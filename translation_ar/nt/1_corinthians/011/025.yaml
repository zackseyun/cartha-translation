source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: ar
  text: 'وكذلك أيضًا، بعد العشاء، أخذ الكأس وقال: «هذه الكأس هي العهد الجديد[a] في دمي. افعلوا هذا كلما شربتم منها[b]، تذكارًا لي».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الوصية الجديدة». يمكن للكلمة اليونانية أن تعني «العهد» أو «الوصية»، لكن «العهد» أنسب إلى الخلفية الكتابية هنا.'
    reason: alternative_reading
  - marker: b
    text: 'أو: «كلما شربتم». المفعول به غير مصرَّح به في اليونانية، والتعبير يدل على مناسبات متكررة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: وكذلك أيضًا
  rationale: تحفظ معنى المماثلة مع الفعل السابق المتعلق بالخبز، وتنقل كذلك دلالة καί الإضافية.
- source_word: τὸ ποτήριον
  choice: الكأس
  rationale: هو المقابل العربي الواضح والمباشر، من غير إدخال نبرة طقسية لا يقتضيها اللفظ اليوناني.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: بعد العشاء
  rationale: التركيب يدل على الزمن، أي بعد تناول العشاء، وهذه صياغة عربية موجزة وطبيعية في سياق الوجبة.
- source_word: λέγων
  choice: تناول الكأس وقال
  rationale: يعني اسم الفاعل حرفيًا «قائلًا»، لكن الفعل المتعلق بالكأس مفهوم من الموازاة مع العبارة السابقة؛ وإظهاره يجعل العربية مكتملة وطبيعية من غير تغيير المعنى.
- source_word: ἡ καινὴ διαθήκη
  choice: العهد الجديد
  rationale: لفظ διαθήκη يشير هنا إلى العهد، في ضوء خلفية دم العهد، ولا سيما صدى إرميا 31. أما «الوصية الجديدة» فتُضعف هذه الخلفية.
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: في دمي
  rationale: ترجمة قريبة تحفظ حرف الجر ولا تحسم ما إذا كانت العلاقة سببية أو وسيلية بتعبير تفسيري مثل «بدمي».
- source_word: τοῦτο ποιεῖτε
  choice: استمروا في فعل هذا
  rationale: الأمر المضارع، مع عبارة التكرار التالية، يدل على ممارسة متكررة؛ والصياغة العربية تُظهر هذا الاستمرار.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: كلما شربتم منها
  rationale: 'تنقل معنى التكرار المشروط: في كل مرة يحدث فيها الشرب. أُضيفت «منها» لأن متعلق الشرب مفهوم من الكأس ولأنها طبيعية في العربية.'
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: لذكري
  rationale: تنقل معنى فعل التذكر أو الإحياء التذكاري بإيجاز، من غير اختزاله في تفسير رمزي محض.
theological_decisions:
- issue: معنى διαθήκη في قول تأسيس العشاء
  choice: العهد
  alternative: الوصية
  rationale: خلفية دم العهد والعهد الجديد في الأسفار المقدسة تجعل «العهد» أرجح، مع الإشارة إلى البديل في الحاشية.
- issue: علاقة الكأس بعبارة العهد
  choice: 'الإبقاء على صيغة التعريف المباشر: «هذه الكأس هي العهد الجديد في دمي»'
  alternative: «هذه الكأس ترمز إلى العهد الجديد المثبت بدمي»
  rationale: النص اليوناني يصرح بالتعريف ولا يشرح طبيعته تفسيرًا طقسيًا أو رمزيًا؛ لذلك تُحفظ الصياغة وما فيها من توتر لاهوتي من غير حسم مذهبي.
translation_notes:
  register: عربية فصحى حديثة، واضحة وكريمة النبرة. حُفظ التركيب اللاهوتي المباشر، وتُجنب استعمال ألفاظ طقسية خاصة أو شرح مذهبي داخل المتن.
