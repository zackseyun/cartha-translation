  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: ar
  text: فَإِنَّكُمْ كُلَّمَا أَكَلْتُمْ هَذَا الْخُبْزَ وَشَرِبْتُمْ الْكَأْسَ[a]، تُعْلِنُونَ مَوْتَ الرَّبِّ إِلَى أَنْ يَأْتِيَ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'اليونانية: «الكأس»، لا «هذه الكأس»؛ ويبيّن السياق السابق أيَّ كأس هي المقصودة.'
    reason: lexical_alternative
  - marker: b
    text: الفاعل غير مذكور صراحة في اليونانية، والمقصود من السياق هو الرب.
    reason: source_clarity
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: كُلَّمَا
  rationale: 'تؤدي معنى التكرار غير المحدد: في كل مرة يقع فيها الفعلان. وهي صياغة عربية طبيعية وموجزة.'
- source_word: γὰρ
  choice: فَإِنَّكُمْ
  rationale: الفاء مع «إنَّ» تربط الآية بما قبلها على جهة التفسير والتعليل، بصورة طبيعية في العربية.
- source_word: ἐσθίητε ... πίνητε
  choice: أَكَلْتُمْ ... وَشَرِبْتُمْ
  rationale: الفعلان المضارعان في اليونانية واقعان في جملة زمنية غير محددة؛ والماضي العربي بعد «كلما» هو الأسلوب الفصيح الطبيعي للتكرار، من غير أن يدل هنا على حدث ماضٍ واحد.
- source_word: τὸν ἄρτον τοῦτον
  choice: هَذَا الْخُبْزَ
  rationale: يحافظ على اسم الإشارة وعلى المعنى المعتاد لـἄρτος في هذا السياق.
- source_word: τὸ ποτήριον
  choice: الْكَأْسَ
  rationale: النص اليوناني يستعمل أداة التعريف ولا يضع اسم إشارة؛ لذلك «الكأس» أدق من «هذه الكأس».
- source_word: καταγγέλλετε
  choice: تُعْلِنُونَ
  rationale: ينقل معنى الإعلان الجهري أو الإشهار بعبارة عربية واضحة ورصينة، من غير إضافة تفسير طقسي.
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: مَوْتَ الرَّبِّ
  rationale: تركيب إضافي عربي مباشر يحافظ على وقار العبارة وتركيزها.
- source_word: ἄχρι οὗ ἔλθῃ
  choice: إِلَى أَنْ يَأْتِيَ
  rationale: صياغة عربية طبيعية للحد الزمني، مع إبقاء الفاعل مستترًا كما هو مفهوم من السياق.
theological_decisions:
- issue: مرجع الفاعل المستتر في «يأتي»
  choice: الرب يسوع هو المرجع المفهوم من السياق.
  alternative: التصريح بقول «إلى أن يأتي الرب».
  rationale: أقرب مرجع في العبارة هو «الرب»، والسياق يجعل المقصود واضحًا؛ لكن إبقاء الفاعل مستترًا يحافظ على إيجاز اليونانية ولا يضيف اسمًا غير مصرح به في الجملة.
- issue: الصياغة المتعلقة بعشاء الرب
  choice: نقل الأكل والشرب وإعلان موت الرب كما وردت، من غير شرح مذهبي.
  alternative: إضافة تفسير أسراري أو تذكاري إلى العبارة.
  rationale: الآية تصف الفعل بأنه إعلان لموت الرب، لكنها لا تعرض هنا نظرية كاملة عن طبيعة العشاء؛ لذلك ينبغي حفظ هذا القدر من المعنى بلا حسم طائفي زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُعمل الماضي بعد «كلما» وفق الأسلوب العربي الطبيعي للدلالة على الفعل المتكرر، مع المضارع «تعلنون» لبيان الدلالة المستمرة لكل ممارسة.
