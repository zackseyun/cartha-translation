  text: οὐ γάρ ἐστιν ἀνὴρ ἐκ γυναικός, ἀλλὰ γυνὴ ἐξ ἀνδρός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/008.yaml
  text: For man is not from woman[a], but woman from man.
translation:
  language: ar
  text: لِأَنَّ الرَّجُلَ لَيْسَ مِنَ الْمَرْأَةِ، بَلِ الْمَرْأَةُ مِنَ الرَّجُلِ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن الزوج ليس من الزوجة، بل الزوجة من الزوج». يمكن للكلمتين اليونانيتين أن تعنيا «الرجل/المرأة» أو «الزوج/الزوجة»؛ وقد فُضِّل هنا المعنى الخَلقي الأوسع.'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: لأنَّ
  rationale: تُدخل تعليلًا لما سبق، و«لأنَّ» أوجز رابط عربي طبيعي في هذا السياق الحِجاجي.
- source_word: ἀνὴρ / ἀνδρός
  choice: الرجل
  rationale: قد تعني اللفظة اليونانية «الرجل» أو «الزوج»، لكن الإحالة إلى أصل الخلق ترجّح المعنى الأعم «الرجل»، مع إبقاء البديل في الحاشية.
- source_word: γυναικός / γυνὴ
  choice: المرأة
  rationale: قد تعني اللفظة «المرأة» أو «الزوجة»، والسياق المتعلق بأصل الخلق يرجّح «المرأة» بوصفها النظير المقابل للرجل.
- source_word: ἐκ / ἐξ
  choice: مِن
  rationale: حرف الجر يدل على المصدر أو الأصل، و«مِن» يؤدي هذا المعنى بوضوح وطبيعية في العربية.
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد الاستدراك والمقابلة القوية بعد النفي، و«بل» أنسب من «لكن» في تركيب «ليس... بل...».
- source_word: ἐστιν
  choice: ليس
  rationale: جاء الفعل مع أداة النفي οὐ، ويؤدي التركيب العربي «ليس من» معنى انتفاء المصدر أو الأصل بإيجاز.
theological_decisions:
- issue: هل تُترجم ἀνήρ/γυνή إلى «رجل/امرأة» أم «زوج/زوجة»؟
  choice: الرجل/المرأة
  alternative: الزوج/الزوجة
  rationale: يعتمد قول بولس على رواية الخلق ويؤكد المصدر أو الأصل، لذلك يحفظ «الرجل/المرأة» النطاق الخَلقي الأوسع. ومع ذلك، لا يُلغى المعنى الزوجي الممكن لغويًا، بل يُذكر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، مع تركيب «ليس... بل...» الذي يحفظ المقابلة المحكمة في الأصل. وُضع رمز الحاشية بعد الجملة لأنه يخص بديل ترجمة الزوجين اللفظيين في طرفيها.
