base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: ar
  text: ولكن حين يديننا الرب، يؤدبنا، لكي لا نُدان مع العالم.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρινόμενοι
  choice: حين يديننا
  rationale: اسم الفاعل المضارع المبني للمجهول ذو دلالة زمنية في السياق؛ وصياغته بالعربية بالمعلوم مع تقديم المفعول طبيعية، وتحفظ معنى الدينونة من غير تحديد زائد لطبيعتها.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد مقابلة لطيفة مع التحذير في الآية السابقة، و«لكن» توضح هذا الانتقال.
- source_word: ὑπὸ κυρίου
  choice: الرب
  rationale: شبه الجملة تحدد فاعل الدينونة، وقد أُدمجت في الصياغة العربية المعلومة «يديننا الرب» من غير إضافة «يسوع» غير المذكورة صراحة.
- source_word: παιδευόμεθα
  choice: يؤدِّبنا
  rationale: يفيد الفعل تدريبًا أو تقويمًا تأديبيًا؛ و«يؤدِّبنا» تنقل طابعه الإصلاحي لا العقابي المحض، وهي طبيعية في العربية المعاصرة.
- source_word: ἵνα μὴ
  choice: لكي لا
  rationale: تحفظ دلالة الغاية في العبارة اليونانية بوضوح وإيجاز.
- source_word: σὺν τῷ κόσμῳ
  choice: مع العالم
  rationale: تحفظ معنى المصاحبة والاشتراك في المصير، ويشير «العالم» هنا إلى العالم بوصفه جماعة واقعة تحت الدينونة.
- source_word: κατακριθῶμεν
  choice: نُدان
  rationale: ينطوي الفعل على حكم سلبي أو إدانة. المقابلة السياقية مع «يديننا» والتأديب توضح الفرق بين الدينونة التقويمية والإدانة مع العالم، من غير إثقال العبارة.
theological_decisions:
- issue: العلاقة بين دينونة الرب الحاضرة والإدانة مع العالم
  choice: تُعرض دينونة الرب بوصفها تأديبًا تقويميًا غايته ألّا نُدان مع العالم.
  alternative: يمكن فهم الكلام على أنه عقوبة زمنية بوجه عام، من غير تقرير صريح لفصل عقدي كامل بين المؤمنين وغير المؤمنين.
  rationale: التقابل بين κρινόμενοι وκατακριθῶμεν، مع παιδευόμεθα وجملة الغاية، يميز بين تأديب حاضر وإدانة يُراد تجنبها، مع إبقاء التوتر اللاهوتي من غير فرض منظومة عقدية إضافية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدمت الصياغة المعلومة «يديننا الرب» لأنها أسلس من المبني للمجهول مع بقاء الوكالة الإلهية صريحة، وحُفظ التقابل اللفظي بين «يديننا» و«نُدان» قدر الإمكان.
