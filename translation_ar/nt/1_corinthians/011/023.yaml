source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: ar
  text: 'لأنني تسلَّمتُ من الرب ما سلَّمتُه إليكم أيضًا: أن الرب يسوع، في الليلة التي كان يُسلَّم فيها[a]، أخذ خبزًا.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بحسب الترجمة التقليدية: «في الليلة التي كان يُخان فيها».'
    reason: alternative_reading
lexical_decisions:
- source_word: παρέλαβον
  choice: تسلَّمتُ
  rationale: ينقل معنى تلقّي بولس للتقليد أو التعليم، ويحافظ على الصلة اللفظية المقصودة مع παρέδωκα.
- source_word: ἀπὸ τοῦ κυρίου
  choice: من الرب
  rationale: يحافظ على دلالة المصدر في اليونانية من غير توسيع، وتأتي العبارة التالية لتعيّن الرب بأنه يسوع.
- source_word: παρέδωκα
  choice: سلَّمتُه
  rationale: يحافظ على تقابل «تسلَّمتُ/سلَّمتُ» الدال على تلقّي التقليد ونقله، مع بقاء الصلة بالجذر نفسه في παρεδίδετο.
- source_word: ὅτι
  choice: أن
  rationale: تقدّم مضمون ما سلّمه بولس إلى المؤمنين بصياغة عربية طبيعية.
- source_word: κύριος
  choice: الرب
  rationale: يحفظ القوة التوقيرية والمسيحانية المعتادة للفظ اليوناني.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: في الليلة التي
  rationale: صياغة عربية واضحة وطبيعية تحفظ البناء الزمني والموصول.
- source_word: παρεδίδετο
  choice: كان يُسلَّم
  rationale: 'يحفظ صيغة الماضي الناقص المبني للمجهول والمدى الدلالي للفعل: التسليم أو الدفع إلى أيدي الآخرين، من غير حصره في معنى الخيانة وحده.'
- source_word: ἔλαβεν ἄρτον
  choice: أخذ خبزًا
  rationale: ترجمة مباشرة وطبيعية، ولا يقتضي تنكير ἄρτον تحديده بأنه رغيف.
theological_decisions:
- issue: ترجمة παρεδίδετο في خبر تأسيس عشاء الرب
  choice: كان يُسلَّم
  alternative: كان يُخان
  rationale: قد يدل παραδίδωμι على التسليم أو الدفع إلى أيدي الآخرين، وقد يحمل في السياق معنى الخيانة. تحفظ الصياغة المختارة اتساع العبارة ولا تقصر الفاعلية على خيانة يهوذا، بينما تُذكر القراءة التقليدية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم التقابل «تسلَّمتُ/سلَّمتُ» لإبراز الصلة البلاغية بين الفعلين، مع الإبقاء على الغموض الدلالي المقصود في «كان يُسلَّم» وشرح البديل التقليدي في الحاشية.
