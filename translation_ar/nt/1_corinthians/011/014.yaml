  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: ar
  text: أَوَلَا تُعَلِّمُكُمُ الطَّبِيعَةُ نَفْسُهَا[a] أَنَّ الرَّجُلَ إِنْ أَطَالَ شَعْرَهُ[b]، فَذَلِكَ عَارٌ لَهُ؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تشير «الطبيعة نفسها» إلى نظام الخليقة، أو الإدراك البشري العام، أو ما تعدّه ثقافة ما ملائمًا بحسب الطبيعة؛ ولا يحدد اليوناني المعنى على نحو أضيق هنا.
    reason: alternative_reading
  - marker: b
    text: أو «إن ترك شعره يطول» أو «إن كان له شعر طويل». يدل الفعل اليوناني على إطالة الشعر أو اتخاذه طويلًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: أَوَلَا
  rationale: تنقل النفي مع القوة الاستفهامية البلاغية واستمرار الحجة، بصياغة عربية طبيعية.
- source_word: ἡ φύσις αὐτὴ
  choice: الطبيعة نفسها
  rationale: تحفظ توكيد αὐτή واتساع مدلول φύσις من غير قصره على النظام البيولوجي أو العرف الاجتماعي.
- source_word: διδάσκει ὑμᾶς
  choice: تعلّمكم
  rationale: ترجمة مباشرة وطبيعية للفعل المضارع مع مفعوله.
- source_word: ἀνὴρ
  choice: الرجل
  rationale: السياق يقابل بين الرجل والمرأة، ولا يدل اللفظ هنا تحديدًا على الزوج.
- source_word: μὲν
  choice: —
  rationale: تمهّد الأداة للطرف الأول من مقابلة تتم في الآية التالية، ويؤدي إظهارها حرفيًا هنا إلى تعبير عربي متكلف؛ لذلك تُفهم المقابلة من السياق.
- source_word: ἐὰν κομᾷ
  choice: إن أطال شعره
  rationale: يعبر الفعل عن إرخاء الشعر حتى يطول أو اتخاذ الشعر طويلًا، وهذه صياغة عربية موجزة وواضحة.
- source_word: ἀτιμία αὐτῷ ἐστιν
  choice: فذلك عار له
  rationale: تحفظ معنى الخزي أو انتقاص الكرامة في سياق الشرف والعار، وتنقل الإسناد إلى الرجل بعبارة عربية سليمة.
theological_decisions:
- issue: مدلول «الطبيعة» (φύσις) في حجة بولس
  choice: الإبقاء على التعبير الواسع «الطبيعة نفسها»
  alternative: النظام المخلوق، أو الإدراك البشري العام، أو ما يعدّه المجتمع لائقًا بطبيعته
  rationale: لا يحدد النص اليوناني هنا واحدًا من هذه المعاني تحديدًا قاطعًا؛ لذا تحافظ الترجمة على الاحتمال والتوتر التفسيري بدل حسمهما.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. صيغ الاستفهام البلاغي بأسلوب طبيعي، وحُفظت سعة معنى «الطبيعة» دون تحميل النص تفسيرًا مذهبيًا.
