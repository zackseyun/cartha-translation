base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: ar
  text: لذلك، مَن يأكل الخبز أو يشرب كأس الرب بطريقة لا تليق[a] يكون مذنبًا في حق جسد الرب ودمه[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: العبارة اليونانية ظرف يصف كيفية الأكل أو الشرب، ولا تصف الشخص بأنه غير مستحق في ذاته.
    reason: lexical_alternative
  - marker: b
    text: 'وحرفيًا أيضًا: «يكون مذنبًا بجسد الرب ودمه». يفيد البناء اليوناني الذنب أو المسؤولية في ما يتعلق بجسد الرب ودمه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: لذلك
  rationale: تفيد الاستنتاج مما سبق في الحديث عن عشاء الرب، و«لذلك» تنقل هذا الربط بوضوح وفصاحة.
- source_word: ὃς ἂν
  choice: مَن
  rationale: تنقل دلالة الموصول العامة غير المحددة، أي كل شخص يفعل ذلك.
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: يأكل الخبز
  rationale: يحافظ على المضارع وعلى أداة التعريف التي تشير إلى الخبز المذكور في السياق.
- source_word: ἢ
  choice: أو
  rationale: النص اليوناني يستعمل حرف العطف التخييري، فيشمل التحذير وقوع أي من الفعلين على نحو غير لائق، ولا يصح تسويته إلى «و».
- source_word: πίνῃ τὸ ποτήριον τοῦ κυρίου
  choice: يشرب كأس الرب
  rationale: يحافظ على المجاز المرسل في الأصل، حيث تدل الكأس على ما فيها، وهو تعبير عربي مفهوم وقريب من صياغة المصدر.
- source_word: ἀναξίως
  choice: بطريقة لا تليق
  rationale: الكلمة ظرف يصف كيفية الأكل أو الشرب، لا قيمة الشخص أو استحقاقه الذاتي؛ وهذه الصياغة تبين ذلك طبيعيًا.
- source_word: ἔνοχος ἔσται
  choice: يكون مذنبًا
  rationale: ينقل معنى الذنب والمسؤولية الذي يحمله التعبير اليوناني، مع الإبقاء على الصيغة المستقبلية الدلالية في نتيجة الشرط العام.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου
  choice: في حق جسد الرب ودمه
  rationale: تنقل علاقة المسؤولية والذنب إزاء جسد الرب ودمه من غير حسم زائد لطبيعة البناء القانوني الذي يفيده المضاف إليه بعد ἔνοχος.
theological_decisions:
- issue: دلالة ἀναξίως في الاشتراك في عشاء الرب
  choice: الإدانة متعلقة بالأكل أو الشرب بطريقة لا تليق، لا بالحكم على أن الشخص غير مستحق في ذاته.
  alternative: اعتبار الآية وصفًا لشخص غير مستحق لا لطريقة اشتراك غير لائقة.
  rationale: ἀναξίως ظرف يعدّل فعلي الأكل والشرب، ولذلك ينبغي أن يحافظ النص العربي على تركيز بولس في كيفية المشاركة من دون إدخال تقرير عقائدي يتجاوز النحو.
- issue: قوة ἢ بين الأكل والشرب
  choice: التحذير ينطبق إذا وقع أي من الفعلين بطريقة لا تليق.
  alternative: قراءة الفعلين بوصفهما زوجًا ثابتًا بمعنى «و».
  rationale: الأصل يستعمل ἢ التخييرية صراحة، فحُفظت «أو» احترامًا للدليل النصي وللتوتر المحتمل مع الصياغة الليتورجية المألوفة.
- issue: معنى المسؤولية في ἔνοχος مع المضاف إليه
  choice: «مذنبًا في حق» جسد الرب ودمه، بما يدل على الذنب والمسؤولية إزاءهما.
  alternative: «مذنبًا بجسد الرب ودمه» أو «مذنبًا إلى جسد الرب ودمه».
  rationale: البناء اليوناني موجز ويمكن فهمه على أنه يحدد ما يتعلق به الذنب أو المسؤولية. تحافظ الصياغة المختارة على جسامة العبارة من غير أن تفرض تحديدًا قانونيًا أو عقائديًا أضيق من النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُعملت «بطريقة لا تليق» لتوضيح الوظيفة الظرفية، و«في حق» للتعبير الطبيعي عن المسؤولية مع إبقاء شيء من إيجاز الأصل وغموضه القانوني.
