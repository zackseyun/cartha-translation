  rationale: أُبقيت ضرورة δεῖ غير مفسَّرة، ودلالة αἱρέσεις الجماعية غير العقائدية، وإمكان الغاية أو النتيجة في «لكي». وعُدّلت عبارة δόκιμοι إلى «الذين ثبتوا في الاختبار» لتجسيد معنى الأشخاص الذين تبيّن صدقهم أو قبولهم عبر الاختبار، مع بقاء «يظهر» ناقلًا لمعنى φανεροὶ γένωνται.
