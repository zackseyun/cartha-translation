  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: ar
  text: فلا بدَّ أن تكون بينكم أيضًا تحزُّبات[a]، لكي يظهر أيضًا بينكم الذين ثبتوا في الاختبار[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «انقسامات» أو «شيع». وقد صارت الكلمة في الاستعمال اللاحق تعني «هرطقات»، لكن المرجح هنا أنها تشير إلى التحزبات داخل الجماعة.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة العبارة: «المقبولون» أو «الحقيقيون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: لا بدّ
  rationale: ينقل معنى الضرورة القوي من غير أن يحدّد هل هي ضرورة إلهية أم واقعية أم سياقية.
- source_word: γὰρ
  choice: فـ
  rationale: تحفظ الصلة التفسيرية بما سبق بأسلوب عربي طبيعي.
- source_word: καὶ αἱρέσεις
  choice: أيضًا من وجود تحزُّبات
  rationale: تشير الكلمة هنا إلى جماعات أو أحزاب متنازعة داخل الكنيسة، لا بالضرورة إلى «هرطقات» بالمعنى العقائدي المتأخر.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: تعبير عربي طبيعي يوضح أن التحزبات واقعة داخل الجماعة.
- source_word: ἵνα
  choice: لكي
  rationale: يحفظ إمكان دلالة العبارة على الغاية أو النتيجة من غير حسم زائد.
- source_word: καὶ οἱ δόκιμοι
  choice: أيضًا مَن ثبتت أصالتهم
  rationale: ينقل معنى أشخاص اجتازوا الاختبار فظهر أنهم حقيقيون أو جديرون بالقبول، ويحفظ دلالة καί الثانية.
- source_word: φανεροὶ γένωνται
  choice: يظهر
  rationale: ينقل معنى الصيرورة إلى الوضوح والعلانية بصياغة عربية موجزة وطبيعية.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: يحفظ تكرار الإطار الجماعي في ختام الآية.
theological_decisions:
- issue: دلالة αἱρέσεις
  choice: تحزُّبات
  alternative: انقسامات، شيع، هرطقات
  rationale: السياق المباشر يتناول التصدعات والأحزاب داخل جماعة كورنثوس؛ لذا تتجنب الصياغة استيراد المعنى العقائدي المتأخر، مع بيان البدائل في الحاشية.
- issue: قوة δεῖ
  choice: لا بدّ
  alternative: ينبغي، من المحتوم
  rationale: 'تحفظ ضرورة العبارة من غير تعيين مصدرها: أتدبير إلهي هي أم حتمية واقعية في الجماعة أم كلاهما.'
- issue: دلالة ἵνα
  choice: لكي
  alternative: حتى تكون النتيجة أن
  rationale: تحفظ الصياغة توتر الغاية والنتيجة في الأصل ولا تفصل بصورة قاطعة بينهما.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «تحزُّبات» لبيان تكوّن الأحزاب داخل الجماعة، و«ثبتت أصالتهم» لإبراز معنى الاختبار الكامن في δόκιμοι من غير إدخال حكم مذهبي زائد.
