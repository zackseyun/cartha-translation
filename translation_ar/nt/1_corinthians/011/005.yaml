  to: وأمّا كلُّ امرأةٍ تصلّي أو تتنبّأ ورأسُها غيرُ مغطّى[b]، فإنها تُلحق العار برأسها[a]؛ لأن الأمرَ واحدٌ بعينه كما لو كانت محلوقةَ الرأس.
  rationale: التعديل محدود ولا يغيّر معنى الآية. استُبدلت «تُهين» بـ«تُلحق العار» لإبراز دلالة العار الاجتماعي، وأعيدت صياغة الخاتمة لإظهار قوة عبارة التطابق اليونانية، ونُقلت علامة الحاشية الخاصة بالغطاء إلى موضعها الدلالي المباشر. وتحافظ الصياغة على الغموض المقصود في المرأة/الزوجة، والرأس الحرفي أو المجازي، وطبيعة الغطاء.
