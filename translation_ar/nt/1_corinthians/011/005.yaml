source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: ar
  text: وأمّا كلُّ امرأةٍ تصلّي أو تتنبّأ ورأسُها غيرُ مغطّى[b]، فإنها تُلحق العار برأسها[a]؛ لأن الأمرَ واحدٌ بعينه كما لو كانت محلوقةَ الرأس.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل زوجة تصلّي أو تتنبّأ ... تُلحق العار برأسها/زوجها». يمكن أن تعني الكلمة اليونانية «امرأة» أو «زوجة»، وقد يُفهم «الرأس» هنا حرفيًّا أو مجازيًّا بحسب السياق.'
    reason: alternative_reading
  - marker: b
    text: لا تحدد كلمة «غير مغطّى» بذاتها نوع الغطاء المقصود تحديدًا؛ لذلك يختلف المفسرون في كون المقصود خمارًا بعينه أو رأسًا غير مغطّى بمعنى أعم.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: امرأة
  rationale: يمكن أن تعني اللفظة «امرأة» أو «زوجة» بحسب السياق. يحافظ المتن على المعنى العام المباشر، مع إثبات احتمال «زوجة» في الحاشية.
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: تصلّي أو تتنبّأ
  rationale: صياغة عربية طبيعية تنقل فعلي اسم الفاعل المضارعين بوصفهما عملين تقوم بهما المرأة.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: ورأسها غير مغطّى
  rationale: تنقل حالة الرأس من غير أن تحدد نوع الغطاء، أهو خمار أم غطاء آخر أم هيئة للشعر.
- source_word: καταισχύνει
  choice: تُهين
  rationale: تفيد جلب العار والانتقاص من الكرامة في سياق الشرف الاجتماعي، وهي أوضح في العربية المعاصرة من صياغات قد توحي بمجرد الشعور بالخجل.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: رأسها
  rationale: تحافظ على اللفظ الحرفي وعلى إمكان فهم الرأس فهمًا جسديًا أو علائقيًا بحسب السياق.
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτὸ
  choice: تكون بذلك مثل ... تمامًا
  rationale: صياغة عربية طبيعية تؤدي توكيد التطابق الذي في العبارة اليونانية.
- source_word: τῇ ἐξυρημένῃ
  choice: محلوقة الرأس
  rationale: تنقل حالة ناتجة عن الحلق، وتُظهر أن المقارنة بامرأة قد حُلق رأسها.
theological_decisions:
- issue: دلالة «رأسها» الثانية
  choice: الإبقاء على «رأسها» بلا حسم
  alternative: رأسها الجسدي؛ أو رأسها بمعنى زوجها/الرجل في إطار الحجة
  rationale: العبارة اليونانية تحتمل المعنى الحرفي، بينما يفتح السياق احتمال المعنى المجازي؛ لذلك لا يحسم المتن ما لم يحسمه النص.
- issue: ماهية الغطاء
  choice: «غير مغطّى» بصيغة عامة
  alternative: بلا خمار؛ أو مكشوف الشعر/منسدل الشعر
  rationale: الصفة اليونانية تدل على عدم التغطية، لكنها لا تعيّن بذاتها نوع الغطاء أو هيئته.
- issue: دلالة γυνή من جهة الحالة الزوجية
  choice: امرأة
  alternative: زوجة
  rationale: التركيب المباشر عام، لكن احتمال الزوجة قائم مع السياق، ولذلك يُذكر في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة. استُخدمت «وأمّا» لإبراز المقابلة التي تؤديها δέ، وحُفظ الغموض المتعلق بالمرأة/الزوجة، وبمعنى الرأس، وبنوع الغطاء.
