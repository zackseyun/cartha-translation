source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: ar
  text: أفليست لكم بيوتٌ لتأكلوا وتشربوا؟ أم إنكم تحتقرون كنيسة الله وتُخجلون الذين لا يملكون شيئًا؟ ماذا أقول لكم؟ أأمدحكم؟ في هذا لا أمدحكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الفقراء»، أو: «الذين ليس عندهم طعام». واليونانية حرفيًا: «الذين لا يملكون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: بيوت
  rationale: يحافظ الجمع على الإشارة إلى الأماكن المنزلية الخاصة في مقابل جماعة الله المجتمعة.
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: لتأكلوا وتشربوا فيها
  rationale: تنقل لام التعليل غرض العبارة، وتضيف «فيها» بوضوح طبيعي لأن البيوت هي مكان الأكل والشرب المقصود.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: كنيسة الله
  rationale: تعبير عربي كتابي راسخ يشير هنا إلى جماعة المؤمنين المجتمعة، من غير حصره في مبنى أو مؤسسة.
- source_word: καταφρονεῖτε
  choice: تحتقرون
  rationale: ينقل بوضوح حدة التوبيخ ومعنى معاملة الجماعة كأنها قليلة الشأن.
- source_word: καταισχύνετε
  choice: تُخجلون
  rationale: يعبر مباشرة عن التسبب في الخزي، من غير زيادة تفسيرية مثل «تهينون» أو «تذلون».
- source_word: τοὺς μὴ ἔχοντας
  choice: الذين لا يملكون شيئًا
  rationale: يحافظ على عموم التعبير اليوناني الحرفي، مع ترك السياق يدل على الحرمان المادي أو نقص الطعام.
- source_word: τί εἴπω ὑμῖν;
  choice: ماذا أقول لكم؟
  rationale: صياغة عربية طبيعية تحفظ السؤال البلاغي الدال على الاستنكار والحيرة الخطابية.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: أأمدحكم؟
  rationale: يحفظ السؤال البلاغي والإجابة السلبية المتوقعة، مع تكرار الجذر نفسه في الجملة التالية.
- source_word: ἐν τούτῳ
  choice: في هذا
  rationale: يحافظ على الإحالة الموجزة إلى الأمر الجاري بحثه من غير توسيع تفسيري.
- source_word: οὐκ ἐπαινῶ
  choice: لا أمدحكم
  rationale: يحافظ على التكرار البلاغي للفعل ἐπαινέω الوارد في السؤال السابق.
theological_decisions:
- issue: مرجع عبارة «الذين لا يملكون» في سياق عشاء الرب
  choice: الذين لا يملكون شيئًا
  alternative: الفقراء؛ أو الذين ليس عندهم طعام
  rationale: يدل السياق بقوة على المؤمنين المحرومين ماديًا، لكن العبارة اليونانية أعمّ وحرفيًا تعني «الذين لا يملكون». لذلك يحفظ النص الرئيس عمومها، وتعرض الحاشية الاحتمالين السياقيين من غير حسم زائد.
translation_notes:
  register: العربية فصحى حديثة واضحة وكريمة النبرة. حُفظت سلسلة الأسئلة البلاغية وحدّة توبيخ بولس، مع تجنب ألفاظ قد توحي بأن «الكنيسة» مبنى لا الجماعة المجتمعة.
