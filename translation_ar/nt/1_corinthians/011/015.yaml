base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: ar
  text: أمّا المرأة، فإن كان شعرها طويلًا، فهو مجدٌ لها، لأن شعرها قد أُعطي لها بدلًا من غطاءٍ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أُعطي لها غطاءً». يمكن أن يدل حرف الجر اليوناني على المقابلة أو النيابة؛ ولا تحسم العبارة وحدها هل يقوم الشعر مقام الغطاء، أم إنه أُعطي في علاقة مقابلة به.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: المرأة
  rationale: تدلّ الكلمة على «امرأة» أو «زوجة» بحسب السياق. وهنا تأتي العبارة في صورة مبدأ عام، لذلك «المرأة» أنسب، من غير نفي إمكان معنى الزوجة في سياقات أخرى.
- source_word: κομᾷ
  choice: كان شعرها طويلًا
  rationale: يفيد الفعل أن يكون الشعر طويلًا أو أن يُترك طويلًا، لا مجرد وجود الشعر. وهذه الصياغة عربية طبيعية وتحفظ معنى الحالة.
- source_word: δόξα
  choice: مجد
  rationale: تحفظ «مجد» القوة البلاغية للكلمة اليونانية، التي تشير هنا إلى ما يكون موضع كرامة وفخر.
- source_word: κόμη
  choice: شعرها
  rationale: الاسم يدل على شعر الرأس، وغالبًا مع إيحاء بالطول. ولأن الفعل السابق صرّح بطول الشعر، تكفي هنا كلمة «شعرها» وتتفادى التكرار.
- source_word: ἀντί
  choice: بدلًا من
  rationale: المعنى الأظهر هو النيابة أو المقابلة؛ و«بدلًا من» تحفظ هذه الدلالة، مع بيان الاحتمال الآخر في الحاشية.
- source_word: περιβολαίου
  choice: غطاء
  rationale: اللفظة عامة لشيء يُلتف به أو يُستعمل غطاءً، فلا تقتضي تخصيصه بخمار أو حجاب بعينه.
- source_word: δέδοται
  choice: قد أُعطي لها
  rationale: تحفظ الصياغة المبني للمجهول ودلالة صيغة التام على عطاء تمّ وما زال أثره قائمًا.
theological_decisions:
- issue: هل يعرّف النص الشعر نفسه بأنه غطاء الرأس المقصود في سياق المقطع، أم يقدمه في علاقة مقابلة بغطاء آخر؟
  choice: ترجمة περιβόλαιον باللفظ العام «غطاء»، وἀντί بـ«بدلًا من»، مع إثبات سعة دلالة حرف الجر في الحاشية.
  alternative: «أُعطي لها غطاءً» أو تخصيص الغطاء بأنه «خمار».
  rationale: الاسم اليوناني أعم من «خمار»، وحرف الجر قد يدل على النيابة أو المقابلة. لذلك لا ينبغي أن تحسم الترجمة وحدها الخلاف بشأن كون الشعر هو الغطاء أو نظيرًا طبيعيًا له.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُعملت «أمّا» لإبراز المقابلة التي تفيدها δέ، مع تركيب شرطي طبيعي، وحُفظت عمومية «غطاء» وتوتر العبارة التفسيري.
