  text: ἀνέπαυσαν γὰρ τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν. ἐπιγινώσκετε οὖν τοὺς τοιούτους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: ar
  text: لأنهم أنعشوا روحي وروحكم. فاعترفوا إذن بفضل أمثال هؤلاء[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «اعرفوا قدر أمثال هؤلاء» أو «قدِّروا أمثال هؤلاء». وتشير العبارة هنا تحديدًا إلى الرجال المذكورين قبيلًا.'
    reason: بدائل معجمية وتوضيح الإحالة المذكرة
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: أنعشوا
  rationale: يفيد الفعل هنا الراحة والتجديد في المعنى الباطني لا الراحة الجسدية الحرفية؛ و«أنعشوا» تعبير عربي طبيعي يحفظ هذا المعنى.
- source_word: γὰρ
  choice: لأنهم
  rationale: تربط «لأن» الجملة بما قبلها بوصفها تعليلًا، مع إلحاق ضمير الجمع بالفعل وفق الأسلوب العربي.
- source_word: πνεῦμα
  choice: روح
  rationale: المقصود روح الإنسان أو باطنه وحالته الداخلية، لا الروح القدس؛ و«روح» تحافظ على اصطلاح بولس وعلى الصياغة الموجزة.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: روحي وروحكم
  rationale: يُصرَّح في العربية بالاسم المحذوف تقديرًا بعد «وروحكم»، فتأتي العبارة واضحة وتحافظ على التوازي اليوناني.
- source_word: ἐπιγινώσκετε
  choice: اعترفوا بفضل
  rationale: لا يقتصر الفعل هنا على التعرف إلى الأشخاص، بل يحث على تقديرهم ومنحهم الاعتراف اللائق؛ و«اعترفوا بفضل» يؤدي ذلك دون رفع المعنى إلى تكريم رسمي.
- source_word: οὖν
  choice: إذن
  rationale: تدل على النتيجة المستخلصة من الكلام السابق، وموقعها بعد الفعل طبيعي في العربية.
- source_word: τοὺς τοιούτους
  choice: أمثال هؤلاء
  rationale: تشير العبارة إلى الرجال المذكورين قبيلًا، إلا أن العربية لا تحتاج إلى إدخال كلمة «رجال» كي تحافظ على الإحالة المحددة؛ واسم الإشارة المذكر الجمع يبقيها ظاهرة.
theological_decisions:
- issue: دلالة جنس τοὺς τοιούτους
  choice: أمثال هؤلاء
  alternative: أمثال هؤلاء الرجال
  rationale: السياق يحيل تحديدًا إلى استفاناس وفرتوناتوس وأخائيكوس، وهم رجال. وتحافظ «هؤلاء» على الإحالة المذكرة في العربية من غير إضافة ثقيلة ليست صريحة بوصفها اسمًا في اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختير «أنعشوا روحي» للمجاز الباطني، و«اعترفوا بفضل» لإبراز معنى التقدير المستحق مع إبقاء البدائل القريبة في الحاشية.
