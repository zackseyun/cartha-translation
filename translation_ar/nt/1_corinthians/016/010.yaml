source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: ar
  text: وَإِنْ جَاءَ تِيمُوثَاوُسُ، فاحْرِصُوا عَلَى أَنْ يَكُونَ بَيْنَكُمْ بِلَا خَوْفٍ[a]، لِأَنَّهُ يَعْمَلُ عَمَلَ الرَّبِّ[b] كَمَا أَعْمَلُ أَنَا أَيْضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يكون لديكم بلا خوف». يصف التعبير اليوناني وجود تيموثاوس في علاقته بهم وهو خالٍ من الخوف.'
    reason: lexical_alternative
  - marker: b
    text: 'أو بصياغة أكثر سلاسة: «يقوم بعمل الرب، كما أفعل أنا أيضًا». يحافظ المتن على التكرار الاشتقاقي في اليونانية بين «العمل» و«يعمل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν δὲ
  choice: وَإِنْ
  rationale: تنقل أداة الشرط ἐάν، مع التعبير عن الانتقال الخفيف الذي تؤديه δέ بالواو، من غير جعلها استدراكًا قويًّا.
- source_word: ἔλθῃ Τιμόθεος
  choice: جَاءَ تِيمُوثَاوُسُ
  rationale: الماضي بعد «إن» أسلوب عربي فصيح طبيعي للتعبير عن شرط مستقبل محتمل، ويوافق صيغة الماضي الاحتمالية في اليونانية.
- source_word: βλέπετε ἵνα
  choice: فَاحْرِصُوا عَلَى أَنْ
  rationale: ينقل الأمر بالعناية الفعلية لضمان تحقق مضمون الجملة التالية، وهو أوضح عربيًّا من النقل الحرفي «انظروا لكي».
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: يَكُونَ بَيْنَكُمْ بِلَا خَوْفٍ
  rationale: يحفظ معنى وجود تيموثاوس في وسطهم في حال خالية من الخوف، من غير حصر العبارة في مجرد شعور داخلي بالأمان.
- source_word: τὸ γὰρ ἔργον κυρίου ἐργάζεται
  choice: لِأَنَّهُ يَعْمَلُ عَمَلَ الرَّبِّ
  rationale: يحفظ التعليل بـγάρ والتكرار الاشتقاقي بين «العمل» و«يعمل»، مع بقاء العبارة واضحة ومألوفة في العربية.
- source_word: ὡς κἀγώ
  choice: كَمَا أَعْمَلُ أَنَا أَيْضًا
  rationale: يفك الإضمار اعتمادًا على الفعل السابق، ويحفظ معنى καὶ في κἀγώ، أي مشاركة بولس لتيموثاوس في العمل نفسه.
theological_decisions:
- issue: مرجع «الرَّبّ» في κυρίου
  choice: الإبقاء على «الرَّبّ» دون تعيين إضافي
  alternative: التصريح في المتن بأنه الرب يسوع
  rationale: مع أن الاستعمال البولسي يرجح الإشارة إلى الرب يسوع، فإن النص اليوناني يقول «الرب» فقط؛ لذلك لا يضاف التعيين إلى المتن.
- issue: مصدر الخوف أو سببه في ἀφόβως
  choice: «بلا خوف» من غير تحديد سبب الخوف أو فاعله
  alternative: «آمنًا منكم» أو «مطمئنًا بينكم»
  rationale: النص يصف حال تيموثاوس دون أن يصرح بأن أهل كورنثوس هم مصدر الخوف أو أن المقصود مجرد الطمأنينة النفسية، فحُفظ هذا القدر من الانفتاح.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة وقورة. استُخدم «بينكم» للتعبير الطبيعي عن الحضور وسط الجماعة، وحُفظت عبارة «بلا خوف» لتجنب تفسير سبب الخوف، كما حُفظ التكرار «يعمل عمل» لقيمته النصية مع بيان البديل الأسلس في الحاشية.
