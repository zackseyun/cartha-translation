base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: ar
  text: وأفرح بمجيء استفاناس وفورتوناتوس وأخائيكوس، لأن هؤلاء سدّوا ما كان ناقصًا من جهتكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن يكون المعنى: «لأن هؤلاء عوّضوا غيابكم». والعبارة اليونانية أعمّ، فهي تقول حرفيًا ما يقارب: «سدّوا ما كان ناقصًا من جهتكم»، ولا يلزم أن تدل على تقصير أخلاقي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω δὲ
  choice: وأفرح
  rationale: يحافظ على زمن المضارع وعلى النبرة الشخصية المباشرة، ويؤدي δέ بوصفها أداة وصل خفيفة لا تفيد تضادًا قويًا.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: بمجيء
  rationale: تشير παρουσία هنا إلى وصول الأشخاص وحضورهم، لا إلى معناها الأخروي الاصطلاحي؛ و«بمجيء» تعبير عربي طبيعي في هذا السياق.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: استفاناس وفورتوناتوس وأخائيكوس
  rationale: نقل صوتي واضح للأسماء اليونانية مع إبقاء الواو المتكررة في تعداد عربي طبيعي.
- source_word: ὅτι
  choice: لأن
  rationale: تقدّم العبارة سبب فرح بولس بوضوح.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: ما كان ناقصًا من جهتكم
  rationale: يحفظ الدلالة الأساسية للفظ ὑστέρημα، أي النقص أو ما لم يكن متوافرًا من جهتهم، من غير حصرها في معنى الغياب وحده.
- source_word: οὗτοι
  choice: هؤلاء
  rationale: يحافظ على الإشارة التوكيدية إلى الرجال الثلاثة المذكورين.
- source_word: ἀνεπλήρωσαν
  choice: سدّوا
  rationale: ينقل معنى إكمال النقص أو توفير ما كان مفقودًا، وهو تعبير عربي موجز وطبيعي.
theological_decisions:
- issue: طبيعة النقص المشار إليه في τὸ ὑμέτερον ὑστέρημα
  choice: 'الإبقاء على العبارة عامة: «ما كان ناقصًا من جهتكم»'
  alternative: «عوّضوا غيابكم»
  rationale: قد يكون المقصود أن هؤلاء مثّلوا حضور أهل كورنثوس لدى بولس، لكن اليونانية لا تصرّح بالغياب، ولا ينبغي تحويل الاحتمال السياقي إلى معنى وحيد أو إلى لوم أخلاقي.
translation_notes:
  register: عربية فصحى حديثة، واضحة وموقّرة. صيغت العبارة بإيجاز رسائلي طبيعي، مع إبقاء دلالة «النقص» مفتوحة كما في اليونانية وشرح الاحتمال السياقي في الحاشية.
