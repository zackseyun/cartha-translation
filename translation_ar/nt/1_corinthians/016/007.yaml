source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: ar
  text: لأني لا أريد أن أراكم الآن في زيارة عابرة[a]، لأني أرجو أن أبقى معكم مدةً من الزمن، إن سمح الرب.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في أثناء مروري بكم»، أو: «وأنا في الطريق».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω
  choice: لا أريد
  rationale: تعبّر عن رغبة بولس وقصده بصياغة عربية طبيعية مباشرة.
- source_word: ἄρτι
  choice: الآن
  rationale: تنقل الدلالة الزمنية الحاضرة بإيجاز ووضوح.
- source_word: ἐν παρόδῳ
  choice: في زيارة عابرة
  rationale: يوضح السياق أن المقصود رؤيتهم خلال مرور قصير، مع الحفاظ على معنى العبور وعدم الإقامة.
- source_word: ἰδεῖν
  choice: أن أراكم
  rationale: يحافظ على المعنى المباشر للفعل، وهو طبيعي عربيًا في سياق اللقاء الشخصي.
- source_word: ἐλπίζω
  choice: أرجو
  rationale: ينقل رجاء بولس وتوقعه من غير إفادة اليقين.
- source_word: χρόνον τινά
  choice: مدةً من الزمن
  rationale: يدل على مدة غير محددة لكنها ليست مجرد مرور سريع.
- source_word: ἐπιμεῖναι
  choice: أن أبقى
  rationale: صياغة عربية طبيعية لمعنى الاستمرار في الإقامة.
- source_word: πρὸς ὑμᾶς
  choice: معكم
  rationale: مع فعل البقاء، تفيد الوجود في صحبتهم وحضورهم.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: إن سمح الرب
  rationale: تعبير شرطي طبيعي يحفظ تعليق الخطة على سماح الرب.
- source_word: κύριος
  choice: الرب
  rationale: يحافظ على اللفظ اليوناني من غير تعيين مرجعه بما يتجاوز النص.
theological_decisions:
- issue: مرجع «الرب»
  choice: الرب، بلا تحديد إضافي
  alternative: الرب يسوع؛ أو الله
  rationale: ورد κύριος من دون تعيين صريح، ولذلك تُحفظ مساحة النص الدلالية واللاهوتية ولا يُحسم المرجع في الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعملت «زيارة عابرة» لتجنب غرابة النقل الحرفي «في مرور»، مع توضيح البدائل الأقرب إلى صورة العبارة اليونانية في الحاشية. أُدخلت «بل» لإبراز المقابلة السياقية الطبيعية بين الزيارة العابرة والإقامة مدةً، من دون تغيير مضمون الجملتين.
