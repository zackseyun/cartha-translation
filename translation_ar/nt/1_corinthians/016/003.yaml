  rationale: يقدّم التعديل عبارة «الذين تعتمدونهم برسائل» ليعكس ارتباط δι’ ἐπιστολῶν بالفعل «تعتمدونهم» في اليونانية، مع إبقاء معنى الرسائل عامًا من غير تفسيرها بأنها رسائل توصية أو أنها مصاحبة للمرسَلين. ووُضع «إلى أورشليم» مع فعل الإرسال، و«ليحملوا» لبيان غرض الإرسال، وحُفظت الحاشية المعجمية الخاصة بـχάρις.
