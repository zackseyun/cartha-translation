  source_fidelity: تتبع المسودة المعنى العام للآية وتترجم χάρις ترجمة مناسبة في سياق التقدمة. لكن عبارة «برسائل» في اليونانية تتصل نحويًا بالفعل δοκιμάσητε («تعتمدون/توافقون») لا بالفعل πέμψω («سأرسل»). ولذلك فالمتن الحالي ينقلها على أنها رسائل تصاحب المرسَلين، وهو احتمال تبنّاه مسار التدقيق الإنجليزي، لكنه ليس الارتباط النحوي الأقرب في النص اليوناني. كما أن ضبط «برسائلَ» غير صحيح بعد الباء.
  naturalness: الصياغة فصيحة في الجملة، لكن «سأرسل برسائلَ مَن تعتمدونهم» توحي بأن الرسائل أداة الإرسال أو مرافقة للمرسَلين، وتفصلها عن الفعل الذي تتعلق به في اليونانية. إعادة ترتيبها تجعل العلاقة أوضح وأقرب إلى الاستعمال العربي المعاصر.
  terminology: «تعتمدونهم» مناسب هنا للاعتماد بعد الفحص، و«عطيتكم» مناسبة لـχάρις في سياق جمع التبرعات. وتبقى «أورشليم» تسمية عربية كتابية شائعة. تُحافظ الحاشية على البديل المعجمي ذي الصلة من دون فرض معنى لاهوتي مجرد.
