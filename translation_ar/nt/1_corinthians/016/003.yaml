translation:
  language: ar
  text: وعندما أصل، سأرسل إلى أورشليم الذين تعتمدونهم برسائل ليحملوا عطيتكم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «عطيّتكم الكريمة». والكلمة اليونانية قد تعني أيضًا «نعمة»، لكنها تشير هنا إلى التقدمة المرسلة إلى أورشليم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: وعندما أصل
  rationale: تفيد ὅταν مع صيغة الماضي الشرطية حدثًا مستقبليًا متوقعًا، فـ«عندما أصل» عربية طبيعية. ونُقلت δέ بواو وصل خفيفة من غير إظهار مقابلة أقوى مما يقتضيه السياق.
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: مَن تعتمدونهم
  rationale: يدل δοκιμάζω هنا على الفحص الذي ينتهي إلى القبول أو الاعتماد لا على مجرد الاختبار؛ و«تعتمدونهم» تلائم اختيار المندوبين.
- source_word: δι’ ἐπιστολῶν
  choice: برسائلَ
  rationale: تفيد διά مع المضاف إليه الوسيلة أو المصاحبة الأداتية؛ والمقصود أن المندوبين يُرسلون ومعهم رسائل. لم تُضف عبارة «توصية» لأنها تفسير محتمل غير مصرّح به.
- source_word: τούτους πέμψω
  choice: سأرسل ... مَن تعتمدونهم
  rationale: اسم الإشارة τούτους استئنافي توكيدي يعود إلى الأشخاص المعتمدين؛ ويؤدى معناه طبيعيًا في العربية بجعل الموصول مفعولًا مباشرًا لـ«سأرسل» من غير تكرار ثقيل.
- source_word: ἀπενεγκεῖν
  choice: ليحملوا
  rationale: المصدر يدل على الغرض من الإرسال، أي نقل العطية إلى أورشليم؛ و«ليحملوا» يعبّر بوضوح عن ذلك.
- source_word: τὴν χάριν ὑμῶν
  choice: عطيّتكم
  rationale: تشير χάρις في سياق جمع التقدمة إلى العطية المادية، مع بقاء إيحاء السخاء والنعمة؛ و«عطيّتكم» واضحة وتحافظ على كونها هبة دون تحويلها إلى مفهوم لاهوتي مجرد.
- source_word: εἰς Ἰερουσαλήμ
  choice: إلى أورشليم
  rationale: تفيد εἰς الوجهة، و«إلى أورشليم» هي الصياغة العربية الطبيعية.
theological_decisions:
- issue: دلالة χάρις في سياق التقدمة
  choice: عطية مادية مرسلة إلى المؤمنين في أورشليم
  alternative: نعمتكم؛ أو عملكم الكريم
  rationale: يحدد سياق الأصحاح أن الحديث عن جمع مال للقديسين، لذلك تشير الكلمة هنا إلى العطية نفسها، مع احتفاظها بإيحاء الكرم والنعمة. تُذكر الدلالة الأوسع في الحاشية بدل فرض معنى لاهوتي مجرد في المتن.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ورصينة. وُضع «برسائل» قريبًا من فعل الإرسال ليظهر أن الرسائل تصاحب المندوبين، مع تجنب تفسيرها صراحة بأنها رسائل توصية. استُعمل الاسم الموصول «مَن» للعاقل، وأُبقيت أورشليم وفق الاسم الكتابي العربي الشائع.
