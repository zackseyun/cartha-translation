lexical_decisions:
- source_word: θύρα
  choice: بابًا
  rationale: المعنى الحرفي هو «باب»، ويستعمله بولس هنا مجازًا للدلالة على مجال مفتوح للخدمة. إبقاء الصورة أَولى من استبدالها بتفسيرها.
- source_word: γάρ
  choice: لأَنَّ
  rationale: تفيد الأداة التعليل، إذ تبيّن سبب خطط بولس المذكورة في السياق السابق.
- source_word: μοι
  choice: لي
  rationale: تنقل الإشارة الشخصية في صيغة المجرور، وتنسجم طبيعيًا مع «فُتح».
- source_word: ἀνέῳγεν
  choice: قد فُتح
  rationale: تنقل صيغة التمام حالة الباب المفتوح الناتجة عن فتح سابق، وتحافظ صيغة المبني للمجهول على عدم تعيين الفاعل في العبارة.
- source_word: μεγάλη
  choice: عظيمًا
  rationale: تصف أهمية المجال واتساعه المجازي، وتلائم صورة الباب أكثر من صياغة تفسيرية مباشرة.
- source_word: ἐνεργής
  choice: فعّالًا
  rationale: تفيد أن هذا المجال عامل ومثمر، مع الحفاظ على التوتر البلاغي في وصف الباب نفسه بالفعالية.
- source_word: ἀντικείμενοι
  choice: مقاومون
  rationale: اسم الفاعل المستعمل اسميًا يدل على أشخاص يقفون في وجه بولس وعمله؛ و«مقاومون» يحفظ معنى المعارضة النشطة دون مبالغة.
- source_word: πολλοί
  choice: كثيرون
  rationale: مقابل عربي مباشر وطبيعي يفيد كثرة المقاومين.
theological_decisions:
- issue: استعارة «الباب» للدلالة على مجال الخدمة
  choice: الإبقاء على لفظ «باب» المجازي
  alternative: لأن فرصة عظيمة وفعّالة قد أُتيحت لي
  rationale: النص اليوناني يستعمل صورة الباب، وهي استعارة بولسية ذات دلالة خدمية. إبقاؤها يصون الصورة الأصلية ولا يحصرها في تفسير واحد.
translation_notes:
