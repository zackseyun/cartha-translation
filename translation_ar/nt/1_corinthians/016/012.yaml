source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: ar
  text: وأما أبلوس أخونا[a]، فقد ألححت عليه كثيرًا أن يأتي إليكم مع الإخوة، لكن لم تكن لديه رغبة البتة في أن يأتي الآن[b]. غير أنه سيأتي متى سنحت له الفرصة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأخ». فاليونانية تقول «الأخ» من غير ضمير ملكية صريح.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لكنه لم يكن راغبًا البتة في أن يأتي الآن». واليونانية أقرب حرفيًا إلى: «لم تكن لديه رغبة البتة في أن يأتي الآن».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: وأما
  rationale: صيغة عربية طبيعية رصينة للانتقال إلى موضوع جديد، من غير إضافة معنى زمني غير موجود هنا.
- source_word: Ἀπολλῶ
  choice: أبلوس
  rationale: نقل صوتي للاسم بحسب الصيغة العربية الكتابية الشائعة.
- source_word: τοῦ ἀδελφοῦ
  choice: أخونا
  rationale: اليونانية تقول حرفيًا «الأخ» بلا ضمير ملكية صريح، لكن «أخونا» تؤدي الاستعمال العلاقي المسيحي طبيعيًا في العربية؛ ويُذكر البديل الحرفي في الحاشية.
- source_word: πολλὰ παρεκάλεσα
  choice: ألححت عليه كثيرًا
  rationale: ينقل شدة الطلب أو تكراره بلغة عربية طبيعية، مع إبقاء دلالة التقوية في πολλὰ.
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς
  choice: أن يأتي إليكم
  rationale: يؤدي مضمون الحث واتجاه الحركة مباشرة من غير إضافة معنى الزيارة صراحة.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: مع الإخوة
  rationale: يحافظ على الجمع المذكر في السياق، الذي يرجح أنه يشير إلى رجال محددين مسافرين أو عاملين مع بولس.
- source_word: καὶ πάντως οὐκ ἦν θέλημα
  choice: لكنه لم تكن له رغبة على الإطلاق
  rationale: «على الإطلاق» تنقل توكيد النفي في πάντως، وصيغة الاسم «رغبة» تحفظ بنية θέλημα دون إيحاء بأن المقصود مشيئة الله.
- source_word: νῦν
  choice: الآن
  rationale: المقابل الزمني المباشر والواضح.
- source_word: ἐλεύσεται δὲ
  choice: غير أنه سيأتي
  rationale: ينقل المقابلة الهادئة التي تفيدها δέ بعد نفي مجيئه في الوقت الحاضر.
- source_word: ὅταν εὐκαιρήσῃ
  choice: متى سنحت له الفرصة
  rationale: تعبير عربي طبيعي يفيد توافر وقت أو فرصة مواتية، ولا يحصر المعنى في مجرد الراحة الشخصية.
theological_decisions:
- issue: مرجع الإرادة أو الرغبة في οὐκ ἦν θέλημα
  choice: الرغبة هي رغبة أبلوس في المجيء الآن.
  alternative: لم تكن مشيئة الله أن يأتي الآن.
  rationale: أبلوس هو المرجع الأقرب والطبيعي في السياق، ولا توجد قرينة على انتقال الكلام إلى مشيئة الله؛ لذلك لا تُضاف دلالة لاهوتية غير مصرّح بها.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «وأما» للانتقال الموضوعي، و«ألححت عليه كثيرًا» لنقل قوة الطلب، مع الحفاظ على الغموض المحدود في تعبير الإرادة وشرحه في الحاشية دون إدخال معنى المشيئة الإلهية.
