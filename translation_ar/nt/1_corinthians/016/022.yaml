  source_fidelity: النص العربي ينقل بدقة الشرط العام في «εἴ τις»، والنفي وفعل المحبة «οὐ φιλεῖ»، ولقب «τὸν κύριον»، ثم القوة الطلبية/الحكمية في «ἤτω ἀνάθεμα». واختيار «فليكن ملعونًا» يحافظ على الصيغة الحكمية الشديدة دون إضافة تفسير عقائدي. وإبقاء «مارانا ثا» منقولًا صوتيًا يحفظ الغموض الحقيقي في تحليل العبارة الآرامية ومعناها.
  naturalness: «إن كان أحدٌ لا يحبّ الرب، فليكن ملعونًا» فصيحة واضحة في العربية المعيارية المعاصرة، مع نبرة تحذيرية مناسبة للسياق. والنقل الصوتي «مارانا ثا» مفهوم بوصفه عبارة أجنبية، وتشرح الحاشية احتمالاته.
  terminology: '«الرب» مناسب لـ«κύριον» في السياق البولسي، و«ملعونًا» مقابل عربي طبيعي لـ«ἀνάθεμα». وتؤدي الحاشية وظيفة حفظ المصطلح التقليدي «أناثيما» وبيان معنى الوقوع تحت اللعنة. وموضعا علامتي الحاشية في العربية صحيحان: الأولى عند «ملعونًا» والثانية عند العبارة الآرامية.'
