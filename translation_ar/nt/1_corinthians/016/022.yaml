  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: ar
  text: إن كان أحدٌ لا يحبّ الرب، فليكن ملعونًا[a]. مارانا ثا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو، بالمصطلح التقليدي المنقول: «أناثيما»؛ أي واقعًا تحت اللعنة.'
    reason: lexical_alternative
  - marker: b
    text: 'عبارة آرامية؛ قد تعني: «يا ربنا، تعال!» أو: «ربنا قد جاء».'
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: يحبّ
  rationale: يفيد الفعل هنا المحبة أو المودّة الشخصية تجاه الرب. و«يحبّ» هو المقابل العربي الطبيعي الواضح، من غير تضييق المعنى على الصداقة أو العاطفة وحدها.
- source_word: κύριον
  choice: الرب
  rationale: يحفظ اللقب المألوف في العهد الجديد ووزنه المسيحاني في هذا السياق البولسي، حيث يُقصد به يسوع.
- source_word: ἤτω
  choice: فليكن
  rationale: صيغة الأمر من فعل الكينونة ذات قوة طلبية وحكمية؛ و«فليكن» تنقل هذه القوة بإيجاز وفصاحة.
- source_word: ἀνάθεμα
  choice: ملعونًا
  rationale: تدل الكلمة على من يقع تحت اللعنة أو يُفرز للهلاك. و«ملعونًا» واضحة للقارئ المعاصر وتحفظ شدة التحذير القضائية، مع إثبات المصطلح المنقول تقليديًا في الحاشية.
- source_word: Μαράνα θά
  choice: مارانا ثا
  rationale: عبارة آرامية حفظها النص اليوناني بحروف يونانية. وبما أن تقسيمها ودلالتها موضع خلاف، يحفظ نقلها صوتيًا في المتن صورتها الأصلية ولا يحسم الغموض، وتُذكر أبرز الاحتمالات في الحاشية.
theological_decisions:
- issue: معنى العبارة الآرامية Μαράνα θά
  choice: 'إبقاؤها منقولة صوتيًا في المتن: «مارانا ثا».'
  alternative: «يا ربنا، تعال!» أو «ربنا قد جاء».
  rationale: يمكن تقسيم العبارة الآرامية وفهمها على أكثر من وجه؛ لذلك يحفظ النقل الصوتي طابعها الأصلي ولا يرجّح تفسيرًا لاهوتيًا محل خلاف.
translation_notes:
  register: صياغة عربية فصحى معاصرة، واضحة ومهيبة. استُعمل «إن كان أحدٌ» لمجاراة الشرط العام، وحُفظت العبارة الآرامية منقولة صوتيًا مع بيان احتمالي معناها في الحاشية.
