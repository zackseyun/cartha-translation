    issue: قوة الفعل «أوصيت» وتركيبه
    rationale: διέταξα يفيد إعطاء توجيه أو تعليمات. «وجّهتُ كنائسَ غلاطية» أوضح في نقل هذا المعنى، بينما «أوصيت كنائس غلاطية» أضعف قليلًا وقد يبدو أن الكنائس هي مفعول الوصية لا متلقية التوجيه.
