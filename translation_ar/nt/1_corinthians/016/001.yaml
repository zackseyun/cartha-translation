  source_fidelity: 'المعنى العام منقول بأمانة: الانتقال إلى موضوع جمع الأموال، وكونه للقديسين، ومقارنة تعليم كورنثوس بما سبق أن وجّهه بولس إلى كنائس غلاطية. لكن «أوصيت كنائس غلاطية» أقل دقة في نقل قوة διέταξα، كما أن ترتيبها بعد «كما» يترك متعلق الوصية غير واضح قليلًا في العربية.'
