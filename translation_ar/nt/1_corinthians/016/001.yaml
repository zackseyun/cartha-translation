  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: ar
  text: وأمّا جمع التبرعات للقديسين[a]، فكما وجّهتُ كنائسَ غلاطية، افعلوا أنتم أيضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لشعب الله».'
    reason: بديل معجمي يوضح أن «القديسين» تسمية للمؤمنين، لا لفئة مقننة لاحقًا.
lexical_decisions:
- source_word: Περὶ δὲ
  choice: وأمّا
  rationale: تعبير عربي طبيعي لنقل الانتقال الرسائلي إلى موضوع جديد، من غير إضافة ظرف زمني صريح.
- source_word: λογείας
  choice: جمع التبرعات
  rationale: يدل اللفظ على عملية جمع المال؛ وهذه الصياغة أوضح في العربية المعاصرة من «الجمع» منفردة، ولا تخصّص المال بوصفه تقدمة طقسية.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: للقديسين
  rationale: تنقل جهة الانتفاع وتحافظ على مصطلح بولس المعتاد للمؤمنين من غير تفسير زائد.
- source_word: διέταξα
  choice: أوصيت
  rationale: تنقل إعطاء توجيه ملزم في السياق الرسائلي بلغة عربية طبيعية، من غير حدّة «أمرت».
- source_word: ταῖς ἐκκλησίαις
  choice: كنائس
  rationale: المقابل العربي الراسخ للجماعات المسيحية المحلية في الاستعمال البولسي.
- source_word: Γαλατίας
  choice: غلاطية
  rationale: الصيغة العربية الكتابية الشائعة للاسم الجغرافي.
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: فافعلوا أنتم أيضًا كما
  rationale: تحافظ على قوة صيغة الأمر وعلى المماثلة المطلوبة، مع ترتيب عربي سلس.
theological_decisions:
- issue: دلالة ἅγιοι في سياق المعونة المالية
  choice: القديسين
  alternative: شعب الله
  rationale: «القديسون» يحافظ على المصطلح البولسي وعلى استمراره اللاهوتي، ولا يحصره في مفهوم التقنين الكنسي اللاحق؛ وتوضح الحاشية البديل التفسيري الطبيعي.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «وأمّا» للانتقال الموضوعي، و«جمع التبرعات» لبيان المقصود المالي، مع إبقاء «القديسين» في المتن حفاظًا على لغة بولس.
