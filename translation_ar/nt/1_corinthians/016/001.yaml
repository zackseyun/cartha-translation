  terminology: «جمع التبرعات» مناسب لـ λογεία ولا يفرض معنى تقدمة طقسية. و«القديسين» يحافظ على المصطلح البولسي؛ والحاشية تقدم البديل بوضوح. استبدال «أوصيت» بـ«وجّهت» أدقّ لـ διέταξα من غير تحميله حدّة «أمرت».
  issues:
