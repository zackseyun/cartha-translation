source:
  edition: SBLGNT
  text: ἀσπάζονται ὑμᾶς οἱ ἀδελφοὶ πάντες. ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/020.yaml
  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: ar
  text: يسلِّم عليكم جميع الإخوة[a]. سلِّموا بعضكم على بعض بقبلة مقدسة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «جميع الإخوة والأخوات يسلِّمون عليكم»، لأن كلمة «الإخوة» قد تشير جماعيًا إلى المؤمنين والمؤمنات.'
    reason: lexical_alternative
  - marker: b
    text: كانت «القبلة المقدسة» تحية مألوفة بين المؤمنين، تعبّر عن القداسة والشركة المتبادلة.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: يسلِّم عليكم
  rationale: الفعل يدل هنا على توجيه التحية في سياق ختام الرسالة، وهذه صياغة عربية طبيعية وموجزة.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: جميع الإخوة
  rationale: يحافظ التعبير على صيغة الجمع المذكر في اليونانية، مع إمكان استعمال «الإخوة» جماعيًا للمؤمنين والمؤمنات، وهو ما توضحه الحاشية.
- source_word: ἀσπάσασθε
  choice: سلِّموا
  rationale: أمر مباشر بإلقاء التحية، مع الحفاظ على الاتساق المعجمي مع الفعل نفسه في الجملة السابقة.
- source_word: ἀλλήλους
  choice: بعضكم على بعض
  rationale: مقابل عربي فصيح وطبيعي للضمير التبادلي، ويبيّن أن التحية متبادلة بين أفراد الجماعة.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: بقبلة مقدسة
  rationale: تنقل العبارة وسيلة التحية أو طريقتها، وتحافظ على كل من الفعل الجسدي ووصفه بالقداسة.
theological_decisions:
- issue: دلالة ἀδελφοί في سياق الجماعة المؤمنة
  choice: الإخوة
  alternative: الإخوة والأخوات؛ جميع المؤمنين
  rationale: اختير المقابل المطابق لصيغة الجمع المذكر في النص، من غير حسم احتمال أن يكون الاستعمال شاملًا للمؤمنين والمؤمنات؛ وقد حُفظ هذا الاحتمال في الحاشية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم «يسلِّم عليكم» بوصفه التعبير الرسائلي الطبيعي، ووُضعت علامتا الحاشيتين عند العبارتين اللتين تفسّرهما كل حاشية.
