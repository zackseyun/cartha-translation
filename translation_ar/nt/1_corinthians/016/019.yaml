  naturalness: «تُسَلِّم عليكم كنائسُ آسِيَّا» سليمة ومألوفة في الأسلوب الرسائلي، وإن كان الفاعل جمعًا لغير العاقل. أما «ويُسَلِّم عليكم كثيرًا في الرب» فمفهومة، لكنها غير طبيعية تمامًا؛ فإسناد «كثيرًا» مباشرة إلى هذا الاصطلاح العربي يثقل العبارة.
  terminology: «كنائس»، «الرب»، و«الكنيسة التي في بيتهما» مقابلات مناسبة وواضحة. والصيغة «بِرِسْكا» تعكس Πρίσκα في النص المصدر، مع إحالة مفيدة إلى «بِرِسْكِلَّا».
