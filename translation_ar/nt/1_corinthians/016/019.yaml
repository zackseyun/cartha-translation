  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: ar
  text: تُسَلِّم عليكم كنائسُ آسِيَّا[a]. ويُسَلِّم عليكم أَكِيلا وبِرِسْكا، مع الكنيسة التي في بيتهما، سلامًا كثيرًا في الرب[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود بـ«آسِيَّا» هنا الولاية الرومانية التي كانت تقع في غربي آسيا الصغرى، لا قارة آسيا الحديثة.
    reason: cultural_note
  - marker: b
    text: 'العبارة اليونانية هي «الكنيسة التي في بيتهما»، ويُفهم منها جماعة المؤمنين التي كانت تجتمع في منزلهما. والاسم هنا «بِرِسْكا»؛ وتَرِد هذه المرأة في مواضع أخرى أيضًا باسم «بِرِسْكِلَّا» (مثل أعمال 18: 2، 18، 26؛ رومية 16: 3).'
    reason: lexical_and_contextual_note
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: تُسَلِّمُ عليكم / يُسَلِّمُ عليكم
  rationale: الفعل ἀσπάζομαι في سياق الرسائل يعني إبلاغ السلام أو التحية. والتعبير «يُسَلِّم عليكم» طبيعي في العربية الكتابية المعاصرة ويحافظ على تكرار الفعل في الجملتين.
- source_word: αἱ ἐκκλησίαι
  choice: كنائس
  rationale: تشير ἐκκλησίαι هنا إلى جماعات المؤمنين المحلية، و«كنائس» هي المقابل العربي الواضح والمألوف في هذا السياق.
- source_word: τῆς Ἀσίας
  choice: آسِيَّا
  rationale: أُبقي الاسم كما في اليونانية، مع توضيح أن المقصود الولاية الرومانية القديمة لا القارة الحديثة في الحاشية.
- source_word: ἐν κυρίῳ
  choice: في الرب
  rationale: يحافظ هذا التعبير على الصياغة البولسية وعلى دلالتها إلى الشركة والارتباط بالرب من غير زيادة تفسيرية.
- source_word: πολλὰ
  choice: كثيرًا
  rationale: وردت πολλὰ ظرفًا لتقوية فعل السلام. وتُبقي «كثيرًا» صورة الأصل واحتمال دلالتها على شدة السلام أو وفرته، بدل حصرها في معنى وجداني واحد مثل «بحرارة».
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: أَكِيلا وبِرِسْكا
  rationale: نُقل الاسمان صوتيًا عن الصيغة اليونانية الواردة، ولا سيما Πρίσκα لا الصيغة المصغرة Πρίσκιλλα.
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: مع الكنيسة التي في بيتهما
  rationale: صياغة قريبة وطبيعية تحافظ على «الكنيسة في البيت» من دون إدخال فعل «تجتمع» غير المذكور صراحة، مع أن الاجتماع المنزلي هو المعنى السياقي الأرجح.
theological_decisions:
- issue: معنى ἐκκλησία في البيت
  choice: «الكنيسة التي في بيتهما» أي جماعة المؤمنين المرتبطة ببيتهما، والأرجح أنها كانت تجتمع فيه
  alternative: اعتبار العبارة مجرد وصف لأهل البيت أو تسمية مؤسسية لاحقة
  rationale: استعمال بولس لكلمة ἐκκλησία والعبارة κατ’ οἶκον يدلان طبيعيًا على جماعة مسيحية في منزل خاص، لكن المتن لا يضيف صراحة فعل الاجتماع.
- issue: ترجمة κύριος
  choice: الرب
  alternative: السيد
  rationale: «الرب» هو المقابل العربي الراسخ هنا، ويحفظ القوة الاعترافية والعلاقية للتعبير البولسي «في الرب».
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُعمل «يُسَلِّم عليكم» بوصفه تعبيرًا رسائليًا عربيًا مألوفًا، وحُفظت الصياغتان «كثيرًا» و«في الرب» لقربهما من الأصل مع بقاء المعنى مفهومًا.
