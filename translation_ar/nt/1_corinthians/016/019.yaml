  to: تُسَلِّم عليكم كنائسُ آسِيَّا[a]. ويُسَلِّم عليكم أَكِيلا وبِرِسْكا، مع الكنيسة التي في بيتهما، سلامًا كثيرًا في الرب[b].
  rationale: 'التعديل أسلوبي محدود: نُقلت قوة πολλά إلى «سلامًا كثيرًا»، وهي عبارة عربية رسائلية أوضح من «يُسَلِّم عليكم كثيرًا»، من غير إضافة مضمون أو تخصيص وجداني مثل «بحرارة». وأُبقي الفعل مفردًا قبل الاسمين، وهو جائز في العربية عند تقدّم الفعل على الفاعل المركب، ويقارب صيغة المصدر اليوناني المفردة.'
