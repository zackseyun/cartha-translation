lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: اسهروا
  rationale: فعل أمر مضارع للجمع يدعو إلى يقظة مستمرة. و«اسهروا» تعبير عربي كتابي طبيعي يفيد التيقظ والانتباه، لا مجرد الامتناع عن النوم.
- source_word: στήκετε
  choice: اثبتوا
  rationale: يفيد الفعل الرسوخ وعدم التزعزع، لا مجرد الوقوف الجسدي؛ و«اثبتوا» تؤدي المعنى المجازي بإيجاز ووضوح.
- source_word: ἐν τῇ πίστει
  choice: في الإيمان
  rationale: وجود أداة التعريف في اليونانية يرجّح الإشارة إلى مجال الإيمان أو مضمونه المعترف به، وصيغة «في الإيمان» العربية تحتمل هذا المعنى طبيعيًا من غير تضييق مذهبي.
- source_word: ἀνδρίζεσθε
  choice: تشجَّعوا
  rationale: الفعل مشتق من لفظ «الرجل» ويحمل حرفيًا صورة التصرّف كالرجال، لكنه في الاستعمال أمر بالشجاعة والبسالة. «تشجَّعوا» تنقل المقصود الاصطلاحي بوضوح، مع حفظ الصورة الحرفية في الحاشية.
- source_word: κραταιοῦσθε
  choice: تقوَّوا
  rationale: الصيغة أمر مضارع مبني للمجهول أو متوسط دلاليًا، وتدعو إلى اكتساب القوة أو التمكّن بها. «تقوَّوا» طبيعية وموجزة، مع بيان احتمال «تشدَّدوا/ليُمنح لكم القوة» في الحاشية.
theological_decisions:
- issue: دلالة πίστις المعرّفة
  choice: في الإيمان
  alternative: في إيمانكم
  rationale: أداة التعريف ترجّح الإيمان بوصفه المجال أو المضمون المشترك، لا مجرد فعل ثقة ذاتي آني. تجنبت إضافة ضمير غير موجود في الأصل.
- issue: الصورة المذكرة في ἀνδρίζεσθε
  choice: تشجَّعوا
  alternative: كونوا رجالًا / تصرّفوا كالرجال
  rationale: المعنى الاصطلاحي في السياق هو التحلي بالشجاعة، والخطاب موجّه إلى الجماعة كلها. تُحفظ الاشتقاقية والصورة الحرفية في الحاشية بدل جعلها في المتن عبارة قد تُفهم حديثًا على أنها حصر للوصية في الذكور.
- issue: قوة المبني للمجهول في κραταιοῦσθε
  choice: تقوَّوا
  alternative: ليُمنح لكم القوة / تشدَّدوا
  rationale: «تقوَّوا» تحافظ على الأمر وتسمح بفهم تلقي القوة أو ازديادها دون تعيين فاعل لم يذكره النص؛ وتوضح الحاشية الاحتمال الأصرح للمبني للمجهول.
