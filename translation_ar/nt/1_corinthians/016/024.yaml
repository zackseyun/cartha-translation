lexical_decisions:
- source_word: ἡ ἀγάπη μου
  choice: محبتي
  rationale: ينقل الاسم ἀγάπη مع ضمير الملكية μου بعبارة عربية موجزة وطبيعية، ويعبّر عن محبة بولس الشخصية للمتلقّين.
- source_word: μετὰ πάντων ὑμῶν
  choice: معكم جميعًا
  rationale: يحفظ معنى المصاحبة والشمول في العبارة اليونانية، ويبيّن أن المحبة موجّهة إلى الجماعة كلها.
- source_word: ἐν
  choice: في
  rationale: يحافظ على التعبير البولسي الموجز الدال على الوجود أو العلاقة ضمن نطاق المسيح، من غير تضييق معناه إلى تفسير واحد.
- source_word: Χριστῷ Ἰησοῦ
  choice: المسيح يسوع
  rationale: «المسيح» ترجمة عربية راسخة للقب Χριστός، و«يسوع» نقل للاسم Ἰησοῦ؛ كما يحافظ الترتيب على ترتيب الأصل.
theological_decisions:
- issue: العبارة اليونانية اسمية بلا فعل صريح، ويمكن فهمها خبرًا أو تمنّيًا ختاميًا
  choice: محبتي معكم جميعًا
  alternative: لتكن محبتي معكم جميعًا
  rationale: الجملة الاسمية طبيعية في العربية وتحفظ غياب الفعل في الأصل وما ينشأ عنه من احتمال الخبر أو التمنّي، بدل حسمه بإضافة «لتكن».
- issue: دلالة Χριστός في الصيغة الختامية
  choice: المسيح يسوع
  alternative: يسوع المسيح
  rationale: يحفظ الاختيار معنى اللقب وترتيب «المسيح يسوع» الوارد في النص، من غير معاملته كاسم مجرد أو قلب ترتيب الكلمتين.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة وذات نبرة ختامية كريمة. أُبقيت الجملة اسمية كما في اليونانية، وهو أسلوب طبيعي في العربية يحفظ التوتر بين التقرير والدعاء. لا حاجة إلى حاشية بشأن «المسيح/Christ»، لأن «المسيح» هو المقابل العربي الدلالي والراسخ للقب اليوناني.
