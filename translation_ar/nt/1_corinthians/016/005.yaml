- source_word: ὅταν
  choice: بعدما
  rationale: مع فعل الماضي الالتزامي διέλθω تشير إلى حدث مستقبلي يسبق المجيء؛ «بعدما» تُظهر بوضوح ترتيب الحدثين في العربية.
- source_word: Μακεδονίαν
  choice: مقدونية
  rationale: الصيغة العربية المألوفة لاسم الإقليم الروماني.
- source_word: διέλθω
  choice: أعبر
  rationale: الفعل يعني الاجتياز أو المرور عبر مكان. وفي تركيب «بعدما أعبر» يحافظ السياق على كون عبور مقدونية سابقًا لمجيئه إلى المخاطبين، من غير إثقال العبارة.
- source_word: γὰρ
  choice: لأنني
  rationale: تقدّم γάρ تعليلًا لتوقيت الزيارة، و«لأن» توضح الصلة السببية طبيعيًا.
- source_word: διέρχομαι
  choice: عابرٌ في
  rationale: المضارع هنا يصف مسار الرحلة الجاري أو المقرر. والتعبير «عابرٌ في مقدونية» يحافظ على الحاضر ويميّزه من العبور السابق للمجيء في الجملة الأولى.
