- source_word: δὲ
  choice: لكنني
  rationale: تفيد انتقالًا مع مقابلة خفيفة بخطط السفر السابقة؛ و«لكن» تنقل ذلك من غير تشديد زائد.
- source_word: πρὸς ὑμᾶς
