  yaml_path: translation/nt/1_corinthians/016/016.yaml
  text: that you also submit yourselves to such people[b][a], and to everyone who works and labors.
translation:
  language: ar
  text: أن تخضعوا أنتم أيضًا لأمثال هؤلاء، ولكل من يشارك في العمل ويكدّ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: أن
  rationale: تأتي متممة لطلب بولس في الآية السابقة، وتحافظ «أن» على التبعية النحوية بصورة طبيعية في العربية.
- source_word: καὶ ὑμεῖς
  choice: أنتم أيضًا
  rationale: 'تنقل معنى الشمول والتوكيد: على المخاطبين هم أيضًا أن يستجيبوا بهذا الخضوع.'
- source_word: ὑποτάσσησθε
  choice: تخضعوا
  rationale: تفيد وضع النفس تحت ترتيب أو قيادة معترف بها؛ والفعل العربي واضح ويحفظ قوة الطلب من غير إضافة معنى الطاعة المطلقة.
- source_word: τοῖς τοιούτοις
  choice: لأمثال هؤلاء
  rationale: تشير العبارة إلى أشخاص من نوع استفاناس ومن يكرسون أنفسهم للخدمة، من غير حصر غير لازم في الذكور.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: لكل من يشارك في العمل
  rationale: يحفظ الصيغة الوصفية للفعل ومعنى التعاون أو الاشتراك في العمل، من غير افتراض مفعول أو شريك بعينه.
- source_word: καὶ κοπιῶντι
  choice: ويكدّ
  rationale: ينقل دلالة العمل المجهد التي يحملها κοπιάω، بعبارة عربية موجزة وفصيحة.
theological_decisions:
- issue: طبيعة الخضوع المطلوب
  choice: دعوة إلى الخضوع لأشخاص مثل المذكورين، ممن يشاركون في الخدمة ويكدّون فيها
  alternative: أمر عام بطاعة هرمية مطلقة
  rationale: السياق المباشر يتناول بيت استفاناس وكل من يشارك في العمل. تحافظ «تخضعوا» على قوة النص، من غير تحويلها إلى دعوى مؤسسية أو طاعة غير مشروطة لا تصرح بها الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختيرت «لأمثال هؤلاء» للإحالة الطبيعية إلى الفئة المذكورة في السياق، و«يشارك في العمل ويكدّ» للجمع بين التعاون والعمل الشاق مع تجنب الغموض غير الضروري.
