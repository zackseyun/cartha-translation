review_pass:
  verdict: approve
  source_fidelity: 'النص العربي ينقل عناصر اليونانية بدقة مناسبة: «أن» تحفظ التبعية والغرض في ἵνα في اتصالها بالآية السابقة، و«أنتم أيضًا» تنقل καὶ ὑμεῖς، و«تخضعوا» تؤدي ὑποτάσσησθε من غير توسيعها إلى طاعة مطلقة. «لأمثال هؤلاء» تؤدي τοῖς τοιούτοις بوصفها إحالة إلى فئة من الأشخاص المذكورين في السياق، و«لكل من يشارك في العمل ويكدّ» تنقل المشاركين المتعاطفين συνεργοῦντι وκοπιῶντι، مع إبراز الجهد في «يكدّ».'
  naturalness: الصياغة فصيحة حديثة واضحة ومترابطة، وتناسب كون الآية جملة تابعة لما قبلها. «لأمثال هؤلاء» و«يشارك في العمل ويكدّ» عبارتان طبيعيتان في هذا السجل الوقور.
  terminology: «تخضعوا» مصطلح مناسب لـὑποτάσσησθε ويحفظ قوة النداء دون تحميله تنظيرًا هرميًا زائدًا. أما «يكدّ» فاختيار دقيق وموجز للدلالة على الكدح في κοπιάω. لا توجد مشكلة في الأسماء أو المصطلحات اللاهوتية، ولا يلزم إدراج حواشٍ لأن النص العربي لا يعتمد قراءة متنازعًا عليها أو توسعًا تفسيريًا يحتاج إلى تقييد.
