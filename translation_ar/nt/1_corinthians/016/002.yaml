  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: ar
  text: في اليوم الأول من كل أسبوع[a]، فليضع كل واحد منكم عنده شيئًا جانبًا ويدّخره، بقدر ما يتيسّر له[c]، لكيلا تُجمع تبرعات حين آتي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في اليوم الأول من الأسبوع». تفيد العبارة اليونانية هنا التوزيع، أي ممارسة أسبوعية منتظمة.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «بحسب ما ينجح فيه» أو «وفقًا لما يناله من سعة». أي إن مقدار العطاء يتناسب مع ما يتيسّر لكل شخص.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: في اليوم الأول من كل أسبوع
  rationale: ينقل الاستعمال التوزيعي لعبارة κατά مع الزمن، أي ممارسة منتظمة تتكرر أسبوعيًا، بصياغة عربية طبيعية وواضحة.
- source_word: ἕκαστος ὑμῶν
  choice: كل واحد منكم
  rationale: يحفظ الدلالة التوزيعية التي توجّه التكليف إلى كل فرد من المخاطَبين.
- source_word: παρ’ ἑαυτῷ
  choice: عنده
  rationale: ترجمة موجزة تحافظ على معنى «لدى نفسه/عنده» من غير الجزم بأن المقصود حصرًا هو البيت، إذ قد تشير العبارة إلى ادخار كل شخص المال بصورة شخصية.
- source_word: τιθέτω θησαυρίζων
  choice: ليضع ... ويدّخره
  rationale: صيغة الأمر «ليضع» تحفظ قوة المضارع الأمري، و«يدّخره» تنقل معنى التراكم والحفظ الذي يضيفه اسم الفاعل θησαυρίζων.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: بحسب ما يتيسّر له
  rationale: 'ينقل المعنى الشرطي غير المحدد: أن يكون المقدار متناسبًا مع ما ناله الشخص من نجاح أو سعة، مع تجنب حصر اللفظ في الأجر أو الدخل وحده.'
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: لكيلا تُجرى جموعٌ حين آتي
  rationale: يحفظ غرض الترتيب الأسبوعي، وهو ألا تبدأ عمليات جمع المال عند وصول بولس.
