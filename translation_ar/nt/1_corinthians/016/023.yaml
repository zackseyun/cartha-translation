  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: نِعْمَة
  rationale: المقابل العربي الكتابي والطبيعي في بركات بولس الختامية، ويحفظ معنى الإحسان والعطاء غير المستحق وما للكلمة من ثقل لاهوتي.
- source_word: κύριος
  choice: الرَّبّ
  rationale: ينقل اللقب المسيحاني المألوف في العهد الجديد بدقة ووضوح، وهو أنسب من «السيد» في هذا السياق البركتي.
- source_word: Ἰησοῦ
  choice: يَسُوع
  rationale: الصيغة العربية المستقرة للاسم الشخصي اليوناني Ἰησοῦς.
- source_word: μεθ’ ὑμῶν
  choice: مَعَكُمْ
  rationale: ترجمة مباشرة للعبارة، مع فهمها ضمن صيغة التمنّي البركتية التي عبّر عنها الفعل العربي «لتكن».
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: الرَّبِّ يَسُوعَ
  rationale: يحافظ تركيب «نعمة الرب يسوع» على علاقة المضاف إليه في اليونانية من غير حصرها صراحةً في معنى المصدر وحده.
theological_decisions:
- issue: صيغة البركة الاسمية الخالية من فعل صريح
  choice: إظهار معنى التمنّي بعبارة «لِتَكُنْ»
  alternative: «نعمة الرب يسوع معكم»
  rationale: النص اليوناني جملة اسمية محذوفة الفعل، وصيغة «لتكن» تعبّر طبيعيًا في العربية عن قوة البركة والتمنّي، من غير إضافة مضمون لاهوتي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقّرة، بصياغة بركتية طبيعية. ضُبطت الكلمات بالشكل الجزئي لتفادي التباس الإعراب، ولا توجد حاجة إلى حاشية في هذه الآية.
