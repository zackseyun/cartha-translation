translation:
  language: ar
  text: وإن كان من المناسب أن أذهب أنا أيضًا، فسيذهبون معي.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وإن كان من المجدي أن أذهب أنا أيضًا». يمكن أن يدل التعبير اليوناني على ما هو مناسب أو ملائم أو مجدٍ بحسب الظروف.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: وإن
  rationale: تؤدي أداة الشرط مع الرابط الخفيف، وتحافظ على اتصال الكلام بما قبله من غير إبراز مقابلة قوية.
- source_word: ἄξιον ᾖ
  choice: كان من المناسب
  rationale: التركيب غير الشخصي يدل هنا على ما هو ملائم أو جدير بأن يُفعل بحسب الظروف، لا على استحقاق بولس الشخصي.
- source_word: τοῦ κἀμὲ πορεύεσθαι
  choice: أن أذهب أنا أيضًا
  rationale: ينقل مصدر الفعل المعرّف بوصفه متممًا لما يُعد مناسبًا، ويحفظ دلالة الإضافة في κἀμέ.
- source_word: σὺν ἐμοὶ
  choice: معي
  rationale: ترجمة عربية طبيعية ومباشرة لمعنى المصاحبة.
- source_word: πορεύσονται
  choice: فسيذهبون
  rationale: يحفظ تكرار فعل الذهاب في الأصل ولا يضيف معنى أقوى مثل التكليف بالمرافقة.
theological_decisions:
- issue: دلالة شرط بولس بشأن سفره مع المندوبين
  choice: إذا كان ذهاب بولس نفسه مناسبًا، فسيذهب المندوبون معه.
  alternative: إذا كانت العطية مهمة بما يكفي ليذهب بولس؛ أو إذا كان بولس مستحقًا للذهاب.
  rationale: صفة ἄξιον مستعملة استعمالًا غير شخصي، وعبارة المصدر تحدد الفعل الذي يُنظر في مدى مناسبته؛ لذلك لا يتعلق الكلام باستحقاق بولس الأخلاقي، مع إبقاء مجال اللفظ بين الملاءمة والجدوى ظاهرًا في الحاشية.
translation_notes:
  register: عربية فصحى واضحة ومعاصرة ذات نبرة كريمة. استُعمل «من المناسب» في المتن لأنه أدق للسياق العملي، مع إثبات معنى «المجدي» في الحاشية حفاظًا على سعة التعبير اليوناني.
