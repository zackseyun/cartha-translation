base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: ar
  text: 'وأطلب إليكم، أيها الإخوة[a]—وأنتم تعرفون أهل بيت استفاناس: فهم باكورة أخائية[b]، وقد كرّسوا أنفسهم لخدمة القديسين.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ فاليونانية تقول «الإخوة»، وهي صيغة خطاب شائعة قد تشمل جماعة المؤمنين كلها.
    reason: lexical_alternative
  - marker: b
    text: يُرجَّح أن «باكورة أخائية» تعني أوائل المؤمنين في أخائية، مع بقاء صورة الجزء الأول المخصَّص لله.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: أطلب إليكم
  rationale: ينقل الالتماس الجاد في الفعل دون أن يجعله أمرًا، وهو تعبير عربي فصيح ملائم للسياق الرسولي.
- source_word: δὲ
  choice: وَ
  rationale: أداة انتقال خفيفة؛ الواو العربية تؤدي الربط والانتقال من غير إدخال معنى زمني غير موجود في الأصل أو تقوية الاستدراك.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة النداء المذكرة في اليونانية، مع بيان احتمال شمول الجماعة كلها في الحاشية.
- source_word: οἴδατε
  choice: أنتم تعرفون
  rationale: الصيغة التامة تؤدي معنى الحاضر هنا، وإبراز الضمير يلائم بدء الجملة التفسيرية ويجعلها طبيعية بالعربية.
- source_word: οἰκίαν Στεφανᾶ
  choice: بيت استفاناس
  rationale: «بيت» في العربية قد يدل طبيعيًا على الأسرة وأهل المنزل، لا على المبنى وحده، ويحافظ على اتساع معنى οἰκία.
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: باكورة أخائية
  rationale: يحفظ استعارة ἀπαρχή وما قد تنطوي عليه من معنى التخصيص لله، بدل اختزالها إلى مجرد الأسبق زمنيًا.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: لخدمة القديسين
  rationale: صياغة عربية واضحة تحفظ معنى الخدمة الموجّهة إلى القديسين، من غير افتراض منصب كنسي رسمي.
- source_word: ἔταξαν ἑαυτούς
  choice: كرّسوا أنفسهم
  rationale: ينقل وضعهم أنفسهم عمدًا لهذه المهمة والتزامهم المستمر بها، لا تعيينًا رسميًا بالضرورة.
theological_decisions:
- issue: مدى شمول ἀδελφοί في خطاب الجماعة
  choice: أيها الإخوة
  alternative: أيها الإخوة والأخوات
  rationale: حُفظت الصيغة المذكرة الظاهرة في الأصل، مع عدم إنكار أن الاستعمال الخطابي قد يشمل جميع أفراد الجماعة؛ وقد بُيّن ذلك في الحاشية.
- issue: دلالة ἀπαρχὴ τῆς Ἀχαΐας
  choice: باكورة أخائية
  alternative: أوائل المؤمنين في أخائية
  rationale: تحفظ «باكورة» الصورة الاستعارية واحتمال دلالة التخصيص لله، بينما توضّح الحاشية المعنى الزمني المرجح من غير إحلاله محل الاستعارة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «بيت استفاناس» بالمعنى الأسري الجماعي، و«القديسين» حفاظًا على المصطلح البولسي المألوف. وُضعت علامتا الحاشية [a] و[b] في المتن.
