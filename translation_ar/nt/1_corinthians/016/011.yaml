  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: ar
  text: فلا يحتقره أحدٌ إذًا. بل أرسلوه في طريقه بسلام، لكي يأتي إليَّ، لأنني أنتظره مع الإخوة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «مع الإخوة والأخوات»، إذا كان لفظ «الإخوة» يُستعمل هنا بمعنى جامع لجماعة أوسع من المؤمنين أو العاملين مع بولس.
    reason: بديل معجمي يوضح احتمال الاستعمال الجامع للفظ اليوناني المذكر.
lexical_decisions:
- source_word: μή τις οὖν
  choice: فلا يَحتقره أحدٌ إذًا
  rationale: تنقل «لا» مع صيغة الاحتمال اليونانية معنى النهي، ويحفظ «إذًا» الصلة الاستنتاجية بالسياق السابق.
- source_word: ἐξουθενήσῃ
  choice: يَحتقره
  rationale: يفيد الفعل عدَّ الشخص بلا قيمة أو معاملته بازدراء؛ و«يحتقره» موجزة وقوية وطبيعية في العربية الفصحى.
- source_word: προπέμψατε
  choice: جهِّزوه للسفر
  rationale: يدل الفعل في سياقات الرحلة على توديع المسافر مع إعانته وتجهيزه لمواصلة طريقه، لا على مجرد إرساله.
- source_word: ἐν εἰρήνῃ
  choice: بسلام
  rationale: تحفظ العبارة معنى الانطلاق في سلام، بلا خصومة أو عائق، وبمساندة الجماعة.
- source_word: ἵνα ἔλθῃ πρός με
  choice: لكي يأتي إليَّ
  rationale: تحفظ «لكي» دلالة الغرض في ἵνα مع صيغة الاحتمال.
- source_word: ἐκδέχομαι
  choice: أنتظره
  rationale: ينقل المضارع معنى الانتظار القائم والمتواصل بصورة عربية طبيعية.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: مع الإخوة
  rationale: تحافظ «الإخوة» على صيغة الجمع المذكر في اليونانية، مع إبقاء احتمال دلالتها السياقية على جماعة أوسع في الحاشية.
theological_decisions:
- issue: دلالة ἀδελφῶν في جماعة مسيحية قد تضم رجالًا ونساءً
  choice: الإخوة
  alternative: الإخوة والأخوات
  rationale: اللفظ اليوناني جمع مذكر، لذلك يُحفظ في المتن من غير حسم ما إذا كان يشير إلى رجال بعينهم أم يُستعمل استعمالًا جامعًا للمؤمنين أو العاملين معه؛ ويُذكر الاحتمال الأوسع في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. اختير «جهِّزوه للسفر» لإظهار معنى الإعانة على مواصلة الرحلة، ووُضعت علامة الحاشية بعد العبارة التي تتناولها مباشرة.
