  to: فلا يحتقره أحدٌ إذًا. بل أرسلوه في طريقه بسلام، لكي يأتي إليَّ، لأنني أنتظره مع الإخوة.[a]
  rationale: استُبدلت «جهِّزوه للسفر» بـ«أرسلوه في طريقه» لإبراز معنى الإرسال للمضي في الرحلة في προπέμψατε، مع إبقاء «بسلام» ودلالة الغرض. وأعيدت صياغة الحاشية لتقتصر على بيان احتمال الدلالة الجامعة لـ«الإخوة» من غير إضافة تفسير غير محسوم لعلاقة الإخوة بفعل الانتظار.
