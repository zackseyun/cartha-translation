lexical_decisions:
- source_word: πάντα
  choice: كل ما
  rationale: تفيد الصيغة المحايدة الجمع الشمول، و«كل ما» تؤدي هذا المعنى بعبارة عربية طبيعية.
- source_word: ὑμῶν
  choice: تفعلونه
  rationale: الضمير المضاف إليه مرتبط بـ«πάντα» في تركيب موجز معناه الحرفي قريب من «أموركم كلها». وجاءت «تفعلونه» لإظهار المعنى الضمني، أي كل ما يصدر عن المخاطَبين، من غير تضييق نطاق العبارة.
- source_word: ἐν ἀγάπῃ
  choice: في محبة
  rationale: تحافظ «في محبة» على حرف الجر وصورة العبارة اليونانية، وتحتمل معنى الكيفية أو المجال الذي يجري فيه الفعل.
- source_word: γινέσθω
  choice: ليكن
  rationale: 'فعل أمر للغائب من γίνομαι يفيد الحث: «ليكن/ليحدث». وتنسجم «ليكن» طبيعيًا مع «كل ما تفعلونه» وتحفظ قوة الوصية.'
