lexical_decisions:
- source_word: ἐπιμενῶ
  choice: سأبقى
  rationale: الفعل في صيغة المستقبل، وفي سياق خطة سفر، يدل على البقاء في مكان مدة من الزمن. «سأبقى» تعبير عربي طبيعي وواضح.
- source_word: δὲ
  choice: لكني
  rationale: الأداة تفيد هنا انتقالًا مع مقابلة خفيفة لما سبق، ولذلك تنقل «لكني» دلالتها السياقية بوضوح.
- source_word: ἐν Ἐφέσῳ
  choice: في أفسس
  rationale: حرف الجر مع اسم المدينة يفيد المكان مباشرة، و«أفسس» هي الصيغة العربية المألوفة للاسم.
- source_word: ἕως τῆς πεντηκοστῆς
  choice: إلى يوم الخمسين
  rationale: تفيد العبارة استمرار المدة حتى نقطة زمنية محددة. و«يوم الخمسين» تسمية عربية كتابية مألوفة للعيد، مع إيضاح اسمه اليهودي البديل في الحاشية.
