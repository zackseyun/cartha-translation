base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: ar
  text: ولا نضعِ المسيحَ موضعَ الاختبار[a]، كما اختبره بعضٌ منهم، فكانوا يهلكون على يد الحيّات[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «الرب» بدلًا من «المسيح».'
    reason: textual_variant
  - marker: b
    text: 'أو: «الأفاعي».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: ولا
  rationale: تصل النهي بما سبقه في سلسلة التحذيرات، مع الحفاظ على قوة الحث الجماعي.
- source_word: ἐκπειράζωμεν
  choice: نضعِ ... موضعَ الاختبار
  rationale: ينقل معنى إخضاع شخص لاختبار غير مشروع، ويتجنب إيحاء «نجرّب» بالإغراء إلى الشر.
- source_word: τὸν Χριστόν
  choice: المسيح
  rationale: Χριστός لقب هنا، و«المسيح» المقابل العربي الطبيعي الراسخ له.
- source_word: καθώς
  choice: كما
  rationale: تقدم المقارنة المباشرة بمثال بعض بني إسرائيل في البرية.
- source_word: τινες αὐτῶν
  choice: بعضٌ منهم
  rationale: صياغة عربية واضحة تحافظ على دلالة أن الفعل صدر من فريق منهم، لا من الجميع.
- source_word: ἐπείρασαν
  choice: اختبره
  rationale: يحافظ على الصلة اللفظية والمعنوية بالفعل السابق، مع إظهار المفعول المفهوم من السياق.
- source_word: ὑπὸ τῶν ὄφεων
  choice: بسبب الحيّات
  rationale: «الحيّات» مقابل عربي واضح لـὄφεις، وصياغة «بسبب» طبيعية مع الفعل اللازم «يهلكون» وتدل على أنها أداة هلاكهم.
- source_word: ἀπώλλυντο
  choice: كانوا يهلكون
  rationale: يحافظ تركيب «كانوا + المضارع» على المنظور الاستمراري لصيغة الماضي الناقص اليونانية.
theological_decisions:
- issue: قراءة τὸν Χριστόν ومرجعها
  choice: المسيح
  alternative: الرب
  rationale: يثبت متن SBLGNT قراءة «المسيح»، بما يبقي التوتر اللاهوتي في إسناد حادثة البرية إليه من غير تفسير زائد. وتُذكر قراءة «الرب» المخطوطية في الحاشية بدل إدخالها في المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدم «نضع المسيح موضع الاختبار» لتفادي التباس «نجرّب المسيح»، وحُفظت دلالة الاستمرار في ἀπώλλυντο بصيغة «كانوا يهلكون».
