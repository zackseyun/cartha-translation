base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: ar
  text: «كُلُّ شَيْءٍ مُبَاحٌ»، لَكِنْ لَيْسَ كُلُّ شَيْءٍ نَافِعًا[a]. «كُلُّ شَيْءٍ مُبَاحٌ»، لَكِنْ لَيْسَ كُلُّ شَيْءٍ يَبْنِي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كل شيء جائز». يمكن أن يدل التعبير اليوناني على ما هو مسموح أو جائز قانونًا. وتعكس علامتا الاقتباس الرأي المرجَّح بأن هذه العبارة شعار لأهل كورنثوس يقيّده بولس، مع أن النص اليوناني القديم لا يضع علامات اقتباس.'
    reason: بديل معجمي وبيان قرار تفسيري في الترقيم
lexical_decisions:
- source_word: Πάντα
  choice: كُلُّ شَيْءٍ
  rationale: صفة جمع محايد مستعملة استعمال الاسم، وتشمل الأمور على نحو عام. وصيغة «كل شيء» طبيعية في العربية وتحافظ على شمول العبارة وتكرارها.
- source_word: ἔξεστιν
  choice: مُبَاحٌ
  rationale: يفيد الفعل ما هو مسموح أو جائز. و«مباح» موجزة وواضحة، وتلائم الصيغة الشعارية المحتملة من غير إضافة «لي»، إذ لا يوجد ضمير مماثل في النص اليوناني.
- source_word: ἀλλ’
  choice: لَكِنْ
  rationale: تنقل أداة الاستدراك البسيطة وتحافظ على المقابلة الموجزة في الجملتين.
- source_word: συμφέρει
  choice: نَافِعًا
  rationale: يدل على ما ينفع أو يفيد، وهذه الصياغة عربية معاصرة واضحة وتتجنب الإيحاء التجاري الذي قد تحمله ألفاظ مثل «مربح».
- source_word: οἰκοδομεῖ
  choice: يَبْنِي
  rationale: يحافظ على استعارة البناء التي يستخدمها بولس للدلالة على التقوية والتنمية، ولا يضيف مفعولًا به غير مذكور في اليونانية.
theological_decisions:
- issue: هل تُعرض عبارة Πάντα ἔξεστιν على أنها شعار مقتبس من أهل كورنثوس؟
  choice: 'وضع العبارة المتكررة بين علامتي اقتباس: «كل شيء مباح»'
  alternative: عرضها بلا علامتي اقتباس بوصفها كلام بولس المباشر غير المعلَّم
  rationale: يرى كثيرون أن العبارة شعار كان بعض أهل كورنثوس يرددونه ثم قيّده بولس. ولأن المخطوطات اليونانية القديمة لم تستخدم علامات الاقتباس الحديثة، فهذا قرار تفسيري في الترقيم لا اختلاف نصي؛ لذلك تُذكر المسألة في الحاشية ولا يُطمس الاحتمال الآخر.
- issue: المقصود غير المصرَّح به من فعل οἰκοδομεῖ
  choice: الإبقاء على العبارة المطلقة «يبني»
  alternative: التصريح بـ«يبني الآخرين» أو «يبني الجماعة»
  rationale: السياق قد يشير إلى بناء الجماعة، لكن النص لا يذكر مفعولًا به. الإبقاء على الاستعارة المطلقة يحفظ اتساع العبارة ولا يضيف تحديدًا تفسيريًا إلى المتن.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة، مع الحفاظ على التوازي البلاغي والتكرار والاستعارة. لم تُضف عبارة «لي» الشائعة في بعض الترجمات لأنها غير موجودة في هذا النص اليوناني.
