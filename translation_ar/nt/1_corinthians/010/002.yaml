lexical_decisions:
- source_word: πάντες
  choice: جميعًا
  rationale: تحافظ على شمول جميع بني إسرائيل المقصودين، وعلى تكرار بولس للتوكيد في السياق.
- source_word: εἰς τὸν Μωϋσῆν
  choice: لموسى
  rationale: صياغة عربية موجزة تبقي الصلة المباشرة بموسى في تركيب المعمودية، من غير أن تحسمها بمعنى «الولاء» أو «الاتحاد». ويشرح الهامش الحرفية غير المألوفة في اليونانية.
- source_word: ἐβαπτίσαντο
  choice: اعتمدوا
  rationale: المبني للمعلوم في العربية طبيعي مع الفعل «اعتمد»، وينقل هنا معنى الصيغة اليونانية الوسطى اصطلاحيًا من غير المبالغة في دلالتها الانعكاسية.
- source_word: ἐν τῇ νεφέλῃ
  choice: في السحابة
  rationale: يحفظ حرف الجر وصورة الخروج، ويترك مفتوحًا ما إذا كانت الدلالة ظرفية أو وسيلية أو ارتباطية.
- source_word: ἐν τῇ θαλάσσῃ
  choice: في البحر
  rationale: يحفظ ἐν والتوازي اللفظي مع «في السحابة»، بدل استبداله بتفسير «عبر البحر».
theological_decisions:
- issue: معنى اعتماد إسرائيل لموسى
  choice: الإبقاء على الصياغة التمثيلية والنمطية من غير شرحها داخل المتن
  alternative: «اتحدوا بموسى» أو «دخلوا في طاعة موسى»
  rationale: يقيم بولس موازاة بين اختبار الخروج والمعمودية المسيحية؛ لذلك ينبغي ألا تحسم الترجمة طبيعة علاقة الشعب بموسى في تفسير عقائدي واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. اختير «اعتمدوا لموسى» بوصفه تركيبًا عربيًا مفهومًا وأقل غرابة من الحرفية «إلى موسى»، مع إثبات الحرفية والبدائل في الهامش. وُضعت علامتا الهامش بعد العبارة التي تتعلقان بها.
