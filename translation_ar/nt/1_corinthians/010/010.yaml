  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: ar
  text: ولا تتذمَّروا، كما تذمَّر بعضٌ منهم فأهلكهم المُهلِك[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الملاك المُهلِك». يقول النص اليوناني: «المُهلِك»، وقد يلمّح إلى منفّذ أحكام الهلاك على إسرائيل في البرية.'
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: ولا
  rationale: تربط النهي بما سبقه في سلسلة التحذيرات، وهي الصياغة العربية الطبيعية المباشرة.
- source_word: γογγύζετε / ἐγόγγυσαν
  choice: تتذمَّروا / تذمَّر
  rationale: ينقل الفعلان معنى الشكوى الناشئة عن السخط، مع الحفاظ على تكرار اللفظ في الأصل.
- source_word: καθάπερ
  choice: كما
  rationale: تؤدي معنى المقارنة بوضوح وطبيعية في العربية.
- source_word: τινὲς αὐτῶν
  choice: بعضٌ منهم
  rationale: ترجمة مباشرة للتعبير التبعيضي الذي يشير إلى بعض بني إسرائيل المذكورين في السياق.
- source_word: ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: فأهلكهم المُهلِك
  rationale: تنقل وقوع الهلاك بفعل العامل المذكور، وتحافظ على الصلة الاشتقاقية بين الهلاك ولقب «المُهلِك» بصياغة عربية موجزة.
theological_decisions:
- issue: هوية ὁ ὀλοθρευτής
  choice: المُهلِك
  alternative: الملاك المُهلِك
  rationale: النص اليوناني يذكر لقب «المُهلِك» ولا يصرّح بأنه ملاك؛ لذلك تُحفظ دلالة الأصل غير المحددة في المتن، ويُذكر التفسير الأكثر تحديدًا في الحاشية.
translation_notes:
  register: لغة عربية فصحى واضحة وموقرة؛ استُخدم «تذمَّر» بدل ألفاظ أقدم مثل «تمتم»، وحُفظ التوازي اللفظي والتحذير المباشر في الآية.
