  yaml_path: translation/nt/1_corinthians/010/024.yaml
  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: ar
  text: لا يطلبْ أحدٌ ما لنفسه، بل ما للآخر.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: لا يطلب أحدٌ مصلحته، بل مصلحة الآخر.'
    reason: توضيح دلالة العبارتين الموجزتين في اليونانية بحسب السياق.
lexical_decisions:
- source_word: μηδεὶς
  choice: لا ... أحدٌ
  rationale: ينقل النفي العام مع صيغة الأمر، وهو أسلوب عربي فصيح طبيعي للنهي الموجَّه إلى الجميع.
- source_word: ζητείτω
  choice: يطلبْ
  rationale: يحفظ المعنى الواسع للفعل، أي السعي إلى الشيء أو ابتغاؤه، من غير تقييده بنوع معيّن من المنفعة.
- source_word: τὸ ἑαυτοῦ
  choice: ما لنفسه
  rationale: 'يحافظ على إيجاز العبارة اليونانية الناقصة دلاليًا: «ما هو لنفسه»، ولا يفرض أن المقصود مقتنيات أو مصالح مادية فقط.'
- source_word: ἀλλὰ
  choice: بل
  rationale: تؤدي المقابلة التصحيحية الواضحة بين طلب ما للنفس وطلب ما للآخر.
- source_word: τὸ τοῦ ἑτέρου
  choice: ما للآخر
  rationale: يحافظ على التوازي والإيجاز في الأصل، ويبيّن أن المقابلة بين الإنسان نفسه والشخص الآخر.
theological_decisions:
- issue: المفعول الضمني في τὸ ἑαυτοῦ وτὸ τοῦ ἑτέρου
  choice: 'إبقاء التعبير عامًا: «ما لنفسه ... ما للآخر»'
  alternative: «مصلحته ... مصلحة الآخر» أو «خيره ... خير الآخر»
  rationale: الأصل اليوناني لا يذكر «المصلحة» أو «الخير» صراحة، وإن كان السياق يدل على منفعة الآخر. والصياغة المختارة طبيعية في العربية وتحفظ سعة العبارة والتوتر الأخلاقي دون تضييق معناها.
translation_notes:
  register: عربية فصحى حديثة واضحة وموجزة، مع نبرة إرشادية كريمة. استُخدمت «الآخر» للدلالة على الشخص الآخر، وحُفظ التوازي البلاغي في شطري الآية.
