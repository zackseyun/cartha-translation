lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: نُثير غيرة
  rationale: 'ينقل معنى الفعل: حمل شخص على الغيرة أو استفزاز غيرته، وهو هنا استفهام تحذيري موجَّه إلى الجماعة.'
- source_word: τὸν κύριον
  choice: الرب
  rationale: المقابل العربي الطبيعي للقب اليوناني κύριος، مع إبقاء مرجع اللقب كما يورده النص دون زيادة تفسيرية.
- source_word: μὴ ἰσχυρότεροι αὐτοῦ ἐσμεν
  choice: ألعلنا أقوى منه؟
  rationale: يحافظ على الاستفهام البلاغي الذي تتوقع معه الأداة μὴ جوابًا بالنفي، من غير تحويله إلى تقرير صريح.
theological_decisions:
- issue: دلالة غيرة الرب
  choice: الإبقاء على التعبير «نُثير غيرة الرب»
  alternative: «نستفز الرب» أو «نُغضب الرب»
  rationale: ذكر الغيرة حاضر صراحة في الفعل اليوناني ويرتبط بسياق العبادة والولاء؛ حذفه يضيّق المعنى اللاهوتي.
- issue: قوة الاستفهام الثاني
  choice: 'صياغته سؤالًا بلاغيًا: «ألعلنا أقوى منه؟»'
  alternative: «بالتأكيد لسنا أقوى منه»
  rationale: الأصل سؤال يتوقع النفي، والصياغة المختارة تحفظ الشكل البلاغي والتوتر التحذيري.
translation_notes:
  register: عربية فصحى حديثة، موجزة ومهيبة. استُخدمت «ألعلنا» لتوضيح أن السؤال البلاغي يستبعد أن نكون أقوى من الرب، مع الحفاظ على بنيته الاستفهامية.
