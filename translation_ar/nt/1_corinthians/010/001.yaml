- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: كانوا جميعًا تحت السحابة
  rationale: ترجمة مباشرة وطبيعية تحافظ على صورة سحابة الخروج من غير إضافة تفسيرية.
- source_word: διὰ τῆς θαλάσσης διῆλθον
