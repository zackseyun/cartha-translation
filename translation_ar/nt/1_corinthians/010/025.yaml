lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: كلَّ ما يُباع
  rationale: ينقل شمول العبارة اليونانية الاسمية بصياغة عربية طبيعية، من غير إثقالها بحرفية زائدة.
- source_word: ἐν μακέλλῳ
  choice: في سوق اللحم
  rationale: يشير اللفظ إلى سوق مخصّصة لبيع اللحم، لا إلى السوق عمومًا، وهذا التحديد مهم في سياق اللحوم التي قد تكون مرتبطة بالذبائح الوثنية.
- source_word: ἐσθίετε
  choice: كُلُوا
  rationale: فعل أمر حاضر للجمع؛ وصيغة الأمر العربية المباشرة تنقل القوة العملية للنص بوضوح.
- source_word: μηδὲν ἀνακρίνοντες
  choice: من غير أن تستفسروا عن شيء
  rationale: يمكن أن يعني الفعل الفحص أو التحقيق أو السؤال؛ والاستفسار هنا يعبّر طبيعيًا عن عدم التحري عن خلفية اللحم، مع إبقاء مجال الدلالة الأوسع في الحاشية.
- source_word: διὰ τὴν συνείδησιν
  choice: من أجل الضمير
  rationale: تحافظ العبارة على معنى الدافع أو الاعتبار المتصل بالضمير من غير أن تحدد صاحب الضمير، إذ لا يصرّح به هذا العدد.
theological_decisions:
- issue: مرجع «الضمير»
  choice: الضمير
  alternative: ضميركم؛ أو ضمير الشخص الآخر
  rationale: يقول اليوناني حرفيًا «الضمير» ولا يعيّن مرجعه في هذا العدد، لذلك تُحفظ دلالة العبارة العامة إلى أن يوضح السياق اللاحق المقصود.
