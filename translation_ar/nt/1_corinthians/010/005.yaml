source:
  edition: SBLGNT
  text: ἀλλ’ οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός, κατεστρώθησαν γὰρ ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: ar
  text: لكنَّ الله لم يرضَ عن أكثرهم، فقد طُرِحوا صرعى في البرية.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: لكنَّ
  rationale: تفيد مقابلة قوية بين الامتيازات المذكورة سابقًا وما آل إليه حال أكثرهم، وهي صياغة عربية طبيعية واضحة.
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν
  choice: لم يرضَ عن أكثرهم
  rationale: نُقلت العبارة اليونانية الاصطلاحية إلى تركيب عربي سليم، مع الحفاظ على دلالة الأكثرية دون تحويلها إلى الجميع.
- source_word: ηὐδόκησεν
  choice: يرضَ
  rationale: ينقل معنى السرور أو الرضا في هذا السياق بإيجاز ووضوح، دون إضافة معنى عقدي غير مصرَّح به.
- source_word: ὁ θεός
  choice: الله
  rationale: المقابل العربي المباشر للاسم، وهو الفاعل في الجملة.
- source_word: κατεστρώθησαν
  choice: طُرِحوا صرعى
  rationale: يحافظ على الصورة القوية للفعل، أي إسقاطهم وبقاء أجسادهم مطروحة في البرية، ويُظهر نتيجة الدينونة دون تعيين وسيلتها.
- source_word: γὰρ
  choice: فقد
  rationale: تربط الجملة الثانية بالأولى بوصفها بيانًا مؤكدًا لنتيجة عدم رضا الله، في صياغة عربية طبيعية.
- source_word: ἐν τῇ ἐρήμῳ
  choice: في البرية
  rationale: التعبير الكتابي العربي المألوف في سياق تيه بني إسرائيل، ويحفظ الصدى النصي للسياق.
theological_decisions:
- issue: طبيعة ما يدل عليه κατεστρώθησαν
  choice: تصوير أكثر بني إسرائيل مطروحين صرعى في البرية نتيجة الدينونة
  alternative: صياغة أعم مثل «هلكوا» أو «سقطوا»، أو صياغة محايدة مثل «طُرحوا»
  rationale: «طُرِحوا صرعى» تحفظ الصورة الجسدية الكامنة في الفعل وقوة التحذير في السياق، من غير أن تضيف إلى النص طريقة موتهم أو تفاصيل الدينونة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. اختيرت صياغة موجزة تحافظ على المقابلة والتحذير، وعلى التمييز الدقيق بين «أكثرهم» و«جميعهم».
