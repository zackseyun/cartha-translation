  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: ar
  text: أخاطبكم بوصفكم عقلاء[a]؛ فاحكموا أنتم[b] فيما أقول.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ذوي فطنة»، أو «حكماء».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «فأنتم أنفسكم احكموا ما أقول».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: بوصفكم
  rationale: تفيد الطريقة أو الصفة التي يخاطب بها بولس سامعيه، أي إنه يتوجه إليهم على أنهم قادرون على التمييز.
- source_word: φρονίμοις
  choice: عقلاء
  rationale: تدل الكلمة على رجاحة العقل والحكمة العملية وحسن التمييز. ولفظة «عقلاء» واضحة ومعاصرة، ولا تبالغ في المدح كما قد يُفهم أحيانًا من «حكماء».
- source_word: λέγω
  choice: أخاطبكم
  rationale: ينقل هذا الفعل في السياق معنى توجيه القول إلى المخاطَبين، ويأتي طبيعيًا مع «بوصفكم» من غير تغيير لمقصد العبارة.
- source_word: κρίνατε
  choice: فاحكموا
  rationale: فعل أمر يدعو إلى تقويم ما يقوله بولس وإصدار حكم بشأنه، وتحافظ «احكموا» على قوة الأصل وصلته الدلالية بفعل الحكم.
- source_word: ὑμεῖς
  choice: أنتم
  rationale: الضمير مذكور صراحة في اليونانية للتوكيد، لذلك أُثبت في العربية بعد الفعل لإبراز مسؤولية المخاطَبين أنفسهم عن الحكم.
- source_word: ὅ
  choice: فيما
  rationale: 'تنقل اسم الموصول المحايد بوصفه متعلقًا بالحكم: الحكم في مضمون ما يقوله بولس.'
- source_word: φημι
  choice: أقول
  rationale: ترجمة مباشرة وطبيعية للفعل الدال على القول أو التصريح.
theological_decisions:
- issue: وصف المخاطَبين بأنهم φρόνιμοι
  choice: 'إبقاء الوصف إيجابيًا ومعتدلًا: «عقلاء»'
  alternative: فهم العبارة مدحًا كاملًا لحكمتهم، أو تهكمًا عليهم
  rationale: يدعو بولس أهل كورنثوس إلى فحص حجته اعتمادًا على قدرتهم على التمييز. ولا يحسم النص وحده هل في الوصف شيء من التهكم، لذلك لا تفرض الترجمة مدحًا مطلقًا ولا سخرية.
translation_notes:
  register: لغة عربية فصحى واضحة وموقرة. استُعملت «أخاطبكم بوصفكم» لتأدية تركيب ὡς مع فعل القول بصورة طبيعية، وأُبقي الضمير «أنتم» ظاهرًا حفاظًا على توكيد الأصل.
