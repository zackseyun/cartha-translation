lexical_decisions:
- source_word: καὶ
  choice: و
  rationale: حرف عطف يصل هذه العبارة بما قبلها على نحو طبيعي ومباشر.
- source_word: πάντες
  choice: جميعًا
  rationale: يحفظ شمول الجماعة كلها، مع دلالة الفعل وصيغته على ضمير الجمع من غير حاجة إلى إبرازه منفصلًا.
- source_word: τὸ αὐτὸ
  choice: نفسه
  rationale: ينقل معنى التطابق أو الاشتراك في الطعام عينه، وهو تعبير عربي طبيعي في هذا السياق.
- source_word: πνευματικὸν
  choice: الروحي
  rationale: المقابل المباشر الذي يحفظ اتساع اللفظ البولسي، من غير حصره في معنى «فائق للطبيعة» أو «المعطى من الروح».
- source_word: βρῶμα
  choice: الطعام
  rationale: لفظ عام ومباشر يدل على ما يؤكل، وهو الأنسب للسياق.
- source_word: ἔφαγον
  choice: أكلوا
  rationale: ينقل صيغة الماضي الخبرية ببساطة ووضوح.
theological_decisions:
- issue: دلالة «الطعام الروحي» في تصوير بولس لخبرة البرية
  choice: إبقاء «الطعام الروحي» في المتن من غير التصريح بأنه المنّ أو تحديد صلة أسرارية بعشاء الرب.
  alternative: المنّ الذي وهبه الله؛ أو طعام أعطاه الروح؛ أو إشارة رمزية صريحة إلى عشاء الرب.
  rationale: يرجح أن العبارة تلمّح إلى المنّ في البرية، وقد تحمل قوة رمزية في السياق، لكن إبقاء صياغة بولس يحفظ التوتر والاتساع الدلاليين ولا يفرض تفسيرًا أضيق على المتن.
translation_notes:
