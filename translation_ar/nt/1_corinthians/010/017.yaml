    text: 'أو: «لأن الرغيف واحد»، وكذلك «في الرغيف الواحد» في آخر الآية. يمكن أن تدل الكلمة اليونانية ἄρτος على رغيف بوصفه وحدة واحدة، مما يبرز صورة اشتراك الكثيرين في واحد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: لأن
  rationale: تفيد التعليل لما سبق، و«لأن» تنقل القوة السببية بوضوح في العربية المعاصرة.
- source_word: εἷς ἄρτος
  choice: الخبز واحد
  rationale: تحافظ «الخبز» على الدلالة الغذائية والليتورجية في السياق، بينما يبرز تقديم الاسم ثم وصفه بالوحدة صياغة عربية طبيعية نسبيًا ومقابلةً بين الخبز الواحد والجسد الواحد.
- source_word: ἓν σῶμα
  choice: جسد واحد
  rationale: تنقل العبارة مباشرة وتحفظ كثافتها الجماعية واللاهوتية من غير تفسير زائد.
- source_word: οἱ πολλοί
  choice: نحن الكثيرين
  rationale: تحفظ التعريف والتباين الصريح بين كثرة المؤمنين ووحدتهم، وتلائم كون «نحن» اسم «إن» في التركيب.
- source_word: γὰρ
  choice: إذ إن
  rationale: تقدم الجملة الثانية بوصفها تعليلًا وتفسيرًا للجملة الأولى، بصياغة عربية فصيحة واضحة.
- source_word: πάντες
  choice: جميعًا
  rationale: تؤكد شمول الجماعة كلها في المشاركة.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: في الخبز الواحد
  rationale: مع فعل المشاركة، العربية الطبيعية تستعمل «اشترك في». وهي تنقل المشاركة في المصدر الواحد، وإن كانت ἐκ في الأصل تبرز معنى الأخذ من الخبز الواحد.
- source_word: μετέχομεν
  choice: نشترك
  rationale: يعبر عن المشاركة الفعلية المشتركة، وهو واضح وطبيعي في العربية ضمن سياق الطعام والعشاء الرباني.
theological_decisions:
- issue: العلاقة بين الخبز الواحد والجسد الواحد
  choice: الإبقاء على الربط السببي بين اشتراك الجميع في الخبز الواحد وكون الكثيرين جسدًا واحدًا
  alternative: صياغة رمزية محضة، أو صياغة أسرارية أشد تحدد كيفية تحقق الوحدة
  rationale: النص اليوناني يربط وحدة المؤمنين بمشاركتهم جميعًا في الخبز الواحد، لكنه لا يفصل هنا طبيعة هذا الربط بما يحسم المناقشات المذهبية اللاحقة؛ لذلك تحفظ الصياغة الارتباط والتوتر اللاهوتي دون إضافة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعملت «نشترك» بدل تعبيرات أقدم مثل «نتناول منه» أو «نأكل منه» للمحافظة على معنى المشاركة في μετέχομεν، مع إبقاء عبارة «الخبز الواحد» ذات الرنين السياقي دون فرض تفسير مذهبي.
