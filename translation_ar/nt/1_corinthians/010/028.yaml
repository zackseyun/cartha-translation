  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: ar
  text: 'ولكن إن قال لكم أحد: «هذا قد قُدِّم ذبيحةً»[a]، فلا تأكلوه، مراعاةً للذي أخبركم، ومراعاةً للضمير[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هذا لحم ذبيحة». تشير الصفة اليونانية إلى شيء قُدِّم في ذبيحة.'
    reason: lexical_alternative
  - marker: b
    text: أي مراعاةً لضمير الشخص الآخر، لا لضميرك أنت؛ انظر الآية التالية.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: ولكن إن قال لكم أحد
  rationale: تنقل «إن» الحالة الشرطية، و«أحد» نكرة طبيعية في العربية، بينما تفيد «ولكن» انتقال δέ بالمقابلة مع الحالة السابقة.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: هذا قد قُدِّم ذبيحةً
  rationale: ينقل التعبير معنى الشيء المقدَّم في ذبيحة دون إدخال لفظ «صنم»، غير الموجود صراحةً في هذه الكلمة، ويحافظ على إمكان أن يكون المشار إليه طعامًا أو لحمًا مفهومًا من السياق.
- source_word: μὴ ἐσθίετε
  choice: فلا تأكلوه
  rationale: صيغة نهي واضحة، مع إظهار ضمير المفعول العائد إلى الطعام المذكور ضمنًا، وهو الأسلوب الطبيعي بالعربية.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: مراعاةً للذي أخبركم
  rationale: تؤدي «مراعاةً لـ» معنى التصرف من أجل الشخص أو اعتبارًا له، و«أخبركم» تنقل معنى الإبلاغ أو الكشف بعبارة عربية مألوفة.
- source_word: καὶ τὴν συνείδησιν
  choice: ومراعاةً للضمير
  rationale: يحافظ النص على إيجاز العبارة اليونانية، مع وصلها سببيًا بما قبلها، ولا يحدد في المتن صاحب الضمير لأن الآية التالية توضح ذلك.
theological_decisions:
- issue: لمن يعود الضمير المقصود في τὴν συνείδησιν؟
  choice: الإبقاء في المتن على «الضمير» دون إضافة صاحب، مع توضيح أن المقصود ضمير الشخص الآخر في الحاشية.
  alternative: 'ترجمة المتن: «ومراعاةً لضمير ذلك الشخص».'
  rationale: العبارة في هذه الآية موجزة من حيث اللفظ، وتوضح الآية التالية أن المقصود ليس ضمير الآكل بل ضمير الآخر؛ لذا يحفظ المتن تدرج كلام بولس ولا يستبق توضيحه.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «قُدِّم ذبيحةً» لتجنب التفسير الزائد بإدخال «للصنم»، واستُخدمت «مراعاةً» مرتين لتوضيح تعلق الاعتبار بكل من المُخبِر والضمير مع الحفاظ على الإيجاز.
