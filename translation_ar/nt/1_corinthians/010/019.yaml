translation:
  language: ar
  text: فماذا أقول إذًا؟ أأقول إن ما ذُبح للأوثان له شأنٌ ما،[a][b] أو إن للوثن شأنًا ما؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن لقربانٍ للأوثان قيمةً ما».'
    reason: lexical_alternative
  - marker: b
    text: أي إن بولس لا يقرر أن للأوثان وجودًا إلهيًا حقيقيًا، ولا أن للطعام المقدَّم للأوثان ذبيحةً دلالةً روحيةً كامنةً في ذاته.
    reason: cross_reference
lexical_decisions:
- source_word: τί οὖν φημι
  choice: فماذا أقول إذًا؟
  rationale: يحافظ على صيغة السؤال البلاغي، وزمن المضارع، وقوة المتكلم المفرد، بعبارة عربية طبيعية.
- source_word: ὅτι
  choice: أأقول إن
  rationale: يُظهر أن الجملتين التاليتين هما مضمون ما قد يُفهم أن بولس يقوله، مع تكييف التركيب ليجري طبيعيًا في العربية.
- source_word: εἰδωλόθυτόν
  choice: ما ذُبح للأوثان
  rationale: ينقل معنى الشيء المقدَّم ذبيحةً للأوثان، ويلائم سياق الأكل والذبائح دون حصر اللفظ في اللحم وحده.
- source_word: τί ἐστιν
  choice: له شأنٌ ما
  rationale: ينقل الاصطلاح الذي يسأل عن كون الشيء ذا حقيقة أو اعتبار أو دلالة، مع إبقاء نوع هذا الشأن غير محسوم.
- source_word: ἢ
  choice: أو
  rationale: يحافظ على الربط العطفي البسيط بين السؤالين المتوازيين.
- source_word: εἴδωλον
  choice: الوثن
  rationale: هو المقابل السياقي المباشر للفظ الدال على معبود أو صورة وثنية.
theological_decisions:
- issue: هل يفيد السؤال إثبات وجود حقيقي أو أهمية روحية للوثن وما ذُبح له؟
  choice: صياغة السؤالين بلاغيًا بعبارة «له شأنٌ ما» من غير تحديد طبيعة هذا الشأن.
  alternative: «أن ما ذُبح للأوثان شيء، أو أن الوثن شيء»؛ أو «له وجود حقيقي».
  rationale: يحافظ هذا على توتر العبارة اليونانية وإبهام τί ἐστιν، فلا يحوّل السؤال إلى تقرير فلسفي عن الوجود ولا يضيف تفسيرًا عقديًا إلى المتن.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختير «ما ذُبح للأوثان» للوضوح السياقي، و«له شأن ما» لصون الإبهام المقصود في السؤال البلاغي. وُضعت علامتا الحاشيتين بعد العبارة التي تفسرانها.
