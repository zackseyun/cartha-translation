id: 1CO.10.33
reference: 1 Corinthians 10:33
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καθὼς κἀγὼ πάντα πᾶσιν ἀρέσκω, μὴ ζητῶν τὸ ἐμαυτοῦ ⸀σύμφορον ἀλλὰ τὸ τῶν πολλῶν, ἵνα σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: ar
  text: كما أني أنا أيضًا أُرضي الجميع في كل شيء[a]، فلا أطلب منفعتي، بل منفعة الكثيرين[b]، لكي يخلصوا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أراعي الجميع في كل الأمور». واليونانية حرفيًا أقرب إلى «الجميع في كل شيء»، وهي تعبّر هنا عن سعة مراعاة الآخرين لأجل خيرهم.'
    reason: lexical_alternative
  - marker: b
    text: 'أي: «لا ما ينفعني أنا، بل ما ينفع الكثيرين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: كما أني أنا أيضًا
  rationale: تحفظ أداة المقارنة ومعنى «أنا أيضًا»، وتربط قدوة بولس بالوصية السابقة ربطًا طبيعيًا في العربية.
- source_word: πάντα πᾶσιν
  choice: الجميع في كل شيء
  rationale: تنقل التركيب اليوناني مباشرةً وتحفظ دلالته على سعة مراعاة الآخرين، من غير أن تستورد الصياغة المختلفة الواردة في 9:22.
- source_word: ἀρέσκω
  choice: أُرضي
  rationale: هو المقابل المباشر للفعل بمعنى إرضاء الآخرين أو مراعاتهم. وتوضح العبارة التالية أن المقصود طلب خيرهم، لا التملق أو المساومة على الحق.
- source_word: μὴ ζητῶν
  choice: فلا أطلب
  rationale: تحوّل اسم الفاعل الدال على الكيفية أو الدافع إلى جملة عربية فصيحة واضحة، مع الحفاظ على النفي وصيغة الاستمرار العامة.
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: منفعتي
  rationale: تنقل معنى ما يعود على بولس بالنفع أو الفائدة، وتتيح موازاة موجزة وواضحة مع «منفعة الكثيرين».
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: بل منفعة الكثيرين
  rationale: تُظهر الاسم المحذوف تقديرًا في اليونانية لتستقيم العربية، وتحفظ تعبير «الكثيرين» بدل تعميمه إلى «الآخرين».
- source_word: ἵνα σωθῶσιν
  choice: لكي يخلصوا
  rationale: تحفظ دلالة الغاية والمعنى الخلاصي المعتاد للفعل في سياق بولس، من غير تعيين فاعل الخلاص داخل العبارة.
theological_decisions:
- issue: مدى دلالة σωθῶσιν ومعناها
  choice: لكي يخلصوا
  alternative: لكي يُعانوا؛ لكي يُحفَظوا
  rationale: يرجح السياق التبشيري والاستعمال البولسي المعنى الخلاصي. والصياغة العربية لا تختزل الفعل إلى نفع اجتماعي، ولا تضيف تحديدًا عقديًا غير مصرّح به للفاعل.
- issue: معنى إرضاء بولس للآخرين
  choice: أُرضي الجميع، مع إبقاء القيد التفسيري في الجملة نفسها
  alternative: أجاري الجميع؛ أطلب رضا الجميع
  rationale: الفعل اليوناني يعني الإرضاء، لكن نفي طلب المنفعة الذاتية وطلب منفعة الكثيرين يبين أن المراد مراعاتهم لخيرهم، لا طلب استحسان البشر أو التنازل عن الحق.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة وموقرة. استُعملت «منفعة» لتكوين موازاة طبيعية بين مصلحة بولس ومصلحة الكثيرين، وأُبقي «الكثيرين» حفاظًا على لفظ النص. تظهر علامتا الحاشيتين [a] و[b] في المتن.
