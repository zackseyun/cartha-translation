  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: ar
  text: لا تقدرون أن تشربوا كأس الرب وكأس الشياطين؛ ولا تقدرون أن تشتركوا في مائدة الرب ومائدة الشياطين.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: لا تقدرون
  rationale: ينقل معنى عدم القدرة أو الاستحالة بصياغة عربية مباشرة، ويحافظ بتكراره على النبرة القاطعة في اليونانية.
- source_word: ποτήριον
  choice: كأس
  rationale: المقابل العربي الطبيعي والمألوف، ويحفظ دلالة الكأس في سياق العبادة والمشاركة من غير شرح زائد.
- source_word: κυρίου
  choice: الرب
  rationale: ترجمة مباشرة لـ κύριος، مع إبقاء تركيب الإضافة في «كأس الرب» و«مائدة الرب» بما يلائم العربية ويحفظ التوازي.
- source_word: πίνειν
  choice: أن تشربوا
  rationale: مصدر مؤول طبيعي بعد «لا تقدرون»، من غير إضافة دلالة استمرارية ليست لازمة في الأصل.
- source_word: δαιμονίων
  choice: الشياطين
  rationale: مقابل عربي واضح ومستقر لـ δαιμόνια، ويحفظ الإشارة إلى كائنات روحية شريرة دون تحويلها إلى تعبير تفسيري عام.
- source_word: τραπέζης
  choice: مائدة
  rationale: ينقل صورة مائدة الطعام أو الشركة بوضوح، ولا يضيف معنى «المذبح» غير المصرح به في اللفظ اليوناني.
- source_word: μετέχειν
  choice: أن تشتركوا في
  rationale: يعبر عن المشاركة الفعلية التي يدل عليها الفعل، وهو أوضح في العربية المعاصرة من صيغ قد تبدو قديمة أو ملتبسة.
- source_word: καὶ
  choice: و
  rationale: يحفظ الربط والتوازي بين كأس الرب وكأس الشياطين، وبين مائدة الرب ومائدة الشياطين.
theological_decisions:
- issue: طبيعة النفي وعلاقة مائدة الرب بالعبادة الوثنية
  choice: إبراز عدم إمكان الجمع بين المشاركة في كأس الرب ومائدته والمشاركة المرتبطة بالشياطين
  alternative: فهم الكلام على أنه مجرد تحذير بلاغي أو نصيحة غير قاطعة
  rationale: تكرار οὐ δύνασθε في الجملتين يفيد تعارضًا قاطعًا. تحافظ الترجمة على هذه القوة من غير أن تشرح كيفية هذا التعارض أو تستورد تصورًا طائفيًا عن العشاء الرباني.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ البناء المتوازي والتكرار البلاغي للنص اليوناني، واستُعملت «تشتركوا في» لتوصيل معنى المشاركة الفعلية بصورة طبيعية.
