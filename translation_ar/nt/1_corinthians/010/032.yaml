base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: ar
  text: لا تكونوا سببَ عثرةٍ[a] لليهود، ولا لليونانيين[b]، ولا لكنيسة الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كونوا بلا عثرة» أو «لا تسيئوا إلى أحد».'
    reason: lexical_alternative
  - marker: b
    text: 'يراد بـ«اليونانيين» هنا على الأرجح غير اليهود عمومًا في بيئة بولس، مع أن النص اليوناني يقول تحديدًا: «اليونانيين».'
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: لا تكونوا سبب عثرة
  rationale: ينقل هذا التعبير معنى الامتناع عن التسبب في عثرة أو إساءة للآخرين، وهو الأنسب للسياق الذي يتناول مراعاة منفعة الآخرين. وتوضح الحاشية الصياغة الأقرب إلى بنية الأصل وما فيها من سعة دلالية.
- source_word: γίνεσθε
  choice: تكونوا
  rationale: فعل أمر مضارع يفيد السلوك المستمر؛ وجاء بعد «لا» في صياغة نهي عربية طبيعية تؤدي قوة الوصية.
- source_word: Ἰουδαίοις
  choice: لليهود
  rationale: يدل هنا على اليهود بوصفهم جماعة دينية وعرقية، لا على سكان اليهودية وحدهم.
- source_word: Ἕλλησιν
  choice: لليونانيين
  rationale: يحافظ على اللفظ الصريح في الأصل، مع بيان استعماله الأوسع المحتمل في الحاشية.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: لكنيسة الله
  rationale: «كنيسة الله» هي الصياغة العربية الراسخة والدقيقة للجماعة المؤمنة المنسوبة إلى الله، وتحافظ على تركيب الإضافة في الأصل.
theological_decisions:
- issue: تقسيم المخاطَبين في الوصية الأخلاقية
  choice: 'الإبقاء على الفئات الثلاث المذكورة صراحة: اليهود واليونانيون وكنيسة الله'
  alternative: فهم «اليونانيين» بوصفه تسمية عامة لجميع غير اليهود، أو قصر الوصية على استراتيجية تبشيرية
  rationale: تذكر الآية ثلاث فئات على نحو صريح، لذلك يحافظ النص عليها من غير توسيع أو تضييق، ولا يحسم ما إذا كان المقصود مبدأ أخلاقيًا عامًا أو اهتمامًا تبشيريًا خاصًا.
- issue: 'دلالة ἀπρόσκοποι: عدم التسبب في العثرة أم الخلو من العثرة'
  choice: 'إبراز المعنى العلاقي: «لا تكونوا سبب عثرة»'
  alternative: «كونوا بلا عثرة» أو «كونوا غير معثرين»
  rationale: السياق المباشر، ولا سيما ذكر الفئات التي ينبغي مراعاتها، يرجح معنى عدم التسبب في عثرة لهم، مع حفظ السعة الدلالية في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت صيغة النهي «لا تكونوا سبب عثرة» لأنها طبيعية ومباشرة، مع الحفاظ على تكرار «لا» لإبراز الفئات الثلاث كما في بنية الوصية.
