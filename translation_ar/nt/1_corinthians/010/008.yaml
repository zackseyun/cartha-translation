source:
  edition: SBLGNT
  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: ar
  text: ولا نمارس الفجور الجنسي، كما مارس بعضهم الفجور الجنسي، فسقط[a] في يوم واحد ثلاثة وعشرون ألفًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مات» أو «صُرع». يقول اليوناني حرفيًا: «سقط»، وهو تعبير شائع عن الموت تحت الدينونة.'
    reason: lexical_alternative
  - marker: b
    text: يذكر العدد 25:9 أن الذين ماتوا كانوا أربعة وعشرين ألفًا، أما بولس فيقول هنا إن ثلاثة وعشرين ألفًا سقطوا «في يوم واحد». وقد يكون هذا تمييزًا بين من ماتوا في ذلك اليوم والعدد الإجمالي الأكبر، لكن الترجمة تُبقي كلام بولس من غير توفيق بين العددين.
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ
  choice: ولا
  rationale: تربط النهي بما سبقه في سلسلة التحذيرات، وتلائم صيغة الحث المنفي في العربية.
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: نمارس الفجور الجنسي / مارسوا الفجور الجنسي
  rationale: ينقل التعبير المعنى الواسع للسلوك الجنسي المحرَّم من غير حصره في نوع واحد، ويحافظ على تكرار الفعل اليوناني في التحذير والمثال.
- source_word: καθώς
  choice: كما
  rationale: تؤدي معنى المقارنة المباشرة بين سلوك المخاطَبين المحتمل وسلوك بعض بني إسرائيل.
- source_word: τινες αὐτῶν
  choice: بعضهم
  rationale: ترجمة موجزة وطبيعية تحافظ على الإحالة إلى بعض أفراد الجماعة المذكورة في السياق.
- source_word: ἔπεσαν
  choice: سقط
  rationale: يحافظ على الصورة اللفظية في اليونانية، مع أن المقصود في سياق الدينونة هو الموت؛ وقد ذُكر ذلك في الحاشية.
- source_word: μιᾷ ἡμέρᾳ
  choice: في يوم واحد
  rationale: ينقل الدلالة الزمنية ويبرز وقوع الحدث خلال يوم واحد.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: ثلاثة وعشرون ألفًا
  rationale: ينقل العدد الوارد صراحة في النص اليوناني من غير تعديل أو توفيق.
theological_decisions:
- issue: العلاقة بين العدد هنا والعدد الوارد في العدد 25:9
  choice: إبقاء «ثلاثة وعشرون ألفًا» في المتن
  alternative: تغييره إلى «أربعة وعشرين ألفًا» أو الجزم بأن أحد العددين جزء من الآخر
  rationale: نص كورنثوس الأولى اليوناني يذكر ثلاثة وعشرين ألفًا بوضوح. تحافظ الترجمة على كلام بولس ولا تحسم التوتر العددي، بينما تعرض الحاشية تفسيرًا محتملًا من غير تقديمه على أنه يقيني.
- issue: دلالة «سقط» في سياق الدينونة
  choice: الحفاظ على صورة السقوط في المتن
  alternative: مات أو صُرع
  rationale: اللفظ اليوناني يعني حرفيًا «سقط»، ويُستعمل هنا للدلالة على الموت تحت الدينونة. إبقاء الصورة يصون صياغة المصدر، وتوضح الحاشية المعنى السياقي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «الفجور الجنسي» بدل لفظ قديم أو أضيق دلالة، وحوفظ على التكرار المقصود وعلى التوتر العددي في النص.
