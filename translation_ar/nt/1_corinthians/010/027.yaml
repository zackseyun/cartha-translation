  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: ar
  text: إن دعاكم أحد غير المؤمنين، وأردتم أن تذهبوا، فكلوا كلَّ ما يُقدَّم لكم، من غير أن تستفسروا عن شيء[a]، مراعاةً للضمير[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «من غير أن تفحصوا شيئًا» أو «من غير أن تتحرّوا». والمقصود ألّا يبحثوا في خلفية الطعام أو مصدره.'
    reason: lexical_alternative
  - marker: b
    text: تتضح الإشارة إلى «الضمير» في الآية التالية، حيث يميّز بولس بين ضمير الشخص الآخر وضمير المخاطَب.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: غير المؤمنين
  rationale: تعبير عربي واضح وموجز يدل على أشخاص لا يؤمنون، ويحفظ التمييز الذي يقيمه السياق من غير إضافة نبرة عدائية.
- source_word: καλεῖ
  choice: دعاكم
  rationale: الفعل في سياق الطعام يعني الدعوة إلى الضيافة، و«دعاكم» هو التعبير العربي الطبيعي في هذا المقام.
- source_word: θέλετε πορεύεσθαι
  choice: أردتم أن تذهبوا
  rationale: يحفظ معنى الرغبة أو الاستعداد لقبول الدعوة، كما يحفظ صيغة الشرط.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: كلَّ ما يُقدَّم لكم
  rationale: ينقل شمول πᾶν ودلالة الطعام الموضوع أمام المدعوين بصياغة عربية طبيعية.
- source_word: ἐσθίετε
  choice: فكلوا
  rationale: أمر عام مباشر، وتؤدي صيغة الأمر العربية معناه من غير مبالغة في نقل الجانب الفعلي.
- source_word: μηδὲν ἀνακρίνοντες
  choice: من غير أن تستفسروا عن شيء
  rationale: يفيد ἀνακρίνω هنا الفحص أو الاستفسار عن خلفية الطعام ومصدره، لا مجرد طرح أي سؤال عابر.
- source_word: διὰ τὴν συνείδησιν
  choice: مراعاةً للضمير
  rationale: تنقل العبارة معنى الاعتبار الأخلاقي أو السبب المتعلق بالضمير، مع إبقاء صاحب الضمير غير محدد في هذه الآية.
theological_decisions:
- issue: مرجع «الضمير» في السياق
  choice: إبقاء «الضمير» مطلقًا بلا تحديد لصاحبه
  alternative: تحديده بضمير المؤمن نفسه، أو بضمير الشخص الآخر المذكور في الآية التالية
  rationale: العبارة اليونانية موجزة ولا تعيّن صاحب الضمير هنا، بينما تأتي الآية التالية بتوضيح إضافي؛ لذلك لا ينبغي حسم الاحتمال في متن هذه الآية.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ورصينة. استُعمل المبني للمجهول «يُقدَّم» لصياغة طبيعية في سياق الضيافة، ووُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحهما الحاشيتان.
