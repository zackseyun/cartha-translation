lexical_decisions:
- source_word: κυρίου
  choice: لِلرَّبِّ
  rationale: ينقل معنى السيادة والإضافة في تركيب τοῦ κυρίου بصياغة عربية طبيعية، ويحافظ على الصدى الاقتباسي من المزمور 24:1.
- source_word: γάρ
  choice: لِأَنَّ
  rationale: تُبيّن أن الاقتباس يقدّم أساسًا وتعليلًا للكلام السابق.
- source_word: γῆ
  choice: الأَرْضَ
  rationale: السياق الاقتباسي مع «ملئها» يدل على الأرض بمعناها الشامل، لا على أرض أو إقليم بعينه.
- source_word: πλήρωμα
  choice: مِلْأَهَا
  rationale: يحافظ على صورة ما يملأ الأرض وعلى الصياغة الكتابية الموجزة، مع بقاء المعنى مفهومًا في العربية الفصحى.
- source_word: αὐτῆς
  choice: هَا
  rationale: الضمير المؤنث يعود إلى «الأرض»، وقد أُلحق بـ«ملء» وفق الأسلوب العربي الطبيعي.
theological_decisions:
- issue: ترجمة κύριος في اقتباس كتابي ذي دلالة لاهوتية
  choice: الرَّبّ
  alternative: السَّيِّد
  rationale: «الرب» هو المقابل العربي المألوف لـκύριος، ويحفظ الصلة بالمزمور واستعمال العهد الجديد من غير إدخال تمييز طباعي غير موجود في النص اليوناني.
translation_notes:
