  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: ar
  text: لِذَلِكَ يَا أَحِبَّائِي، اهْرُبُوا مِنْ عِبَادَةِ الأَوْثَانِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διόπερ
  choice: لذلك
  rationale: أداة استنتاج تربط الوصية بالحجة السابقة، و«لذلك» تؤدي القوة المنطقية بوضوح وطبيعية.
- source_word: ἀγαπητοί μου
  choice: يا أحبائي
  rationale: نداء حميم يحفظ عاطفة بولس وصيغة الملكية من غير تكلّف.
- source_word: φεύγετε
  choice: اهربوا
  rationale: فعل أمر حاضر للجمع يحمل معنى الابتعاد العاجل عن الخطر؛ و«اهربوا» يحفظ قوة الأمر.
- source_word: ἀπὸ
  choice: من
  rationale: حرف جر يدل على الانفصال والابتعاد، وهو طبيعي بعد «اهربوا» في العربية.
- source_word: τῆς εἰδωλολατρίας
  choice: عبادة الأوثان
  rationale: يدل اللفظ على عبادة الأوثان وخدمتها؛ وهذه العبارة واضحة للقارئ المعاصر وتحفظ المعنى الديني العملي في السياق.
theological_decisions:
- issue: نطاق النهي
  choice: أمر مباشر بالابتعاد عن عبادة الأوثان والممارسات المرتبطة بها
  alternative: قصر التحذير على التعلّق الباطني بالأوثان وحده
  rationale: يحذّر السياق القريب من المشاركة في الولائم والممارسات الوثنية، واللفظ اليوناني أوسع من مجرد موقف داخلي؛ لذلك تُبقي الترجمة التعبير عامًا من غير تضييق.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعملت «يا أحبائي» لصون دفء الخطاب الرسولي، و«اهربوا» لإبراز إلحاح الأمر.
