reference: 1 Corinthians 10:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: ar
  text: ما أصابتكم تجربة إلا مما يمرّ به البشر[a]. لكن الله أمين، ولن يسمح بأن تُجرَّبوا فوق ما تقدرون عليه، بل سيجعل مع التجربة أيضًا مخرجًا[b]، لكي تقدروا على احتمالها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إلا ما هو بشري» أو «إلا ما هو مألوف للبشر». ويمكن أن تدل «التجربة» أيضًا على الاختبار أو المحنة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «منفذًا» أو «عاقبةً». والمقصود تدبير الله الذي يمكّنكم من الاحتمال.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός
  choice: تجربة
  rationale: اللفظ اليوناني يحتمل التجربة بمعنى الإغراء بالخطية أو الاختبار والمحنة. «تجربة» تحفظ هذا الاتساع، ويلائم معناها الأخلاقي سياق التحذير من الشهوة وعبادة الأصنام.
- source_word: εἴληφεν
  choice: تصبكم
  rationale: صيغة الفعل تفيد أن التجربة أدركت المخاطَبين أو حلت بهم؛ و«تصبكم» عربية طبيعية تنقل مجيئها عليهم دون مبالغة.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: إلا تجربة بشرية
  rationale: ἀνθρώπινος تعني ما هو بشري أو من شأن البشر، ولا تستلزم أن تكون التجربة شائعة إحصائيًا؛ لذلك حافظت الصياغة على الوصف المباشر.
- source_word: πιστός
  choice: أمين
  rationale: «أمين» التعبير العربي الكتابي الطبيعي عن موثوقية الله وثباته.
- source_word: ἐάσει
  choice: لن يدعكم
  rationale: ينقل معنى السماح أو الترك بوضوح وسلاسة في العربية المعاصرة.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: فوق ما تستطيعون
  rationale: صياغة قريبة من تركيب اليونانية وتحفظ عدم ذكر مفعول القدرة صراحة، مع وضوح المعنى.
- source_word: ἔκβασιν
  choice: منفذًا
  rationale: يدل اللفظ على مخرج أو سبيل للخروج، وقد يحتمل النتيجة. «منفذًا» واضح وموجز، ولا يوحي بالضرورة بإزالة التجربة فورًا لأن الغاية المذكورة هي احتمالها.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: لكي تستطيعوا أن تحتملوها
  rationale: ينقل غرض/نتيجة العبارة المصدرية، ويعبّر عن الثبات تحت التجربة لا مجرد الإفلات منها.
theological_decisions:
- issue: دلالة πειρασμός وπειρασθῆναι
  choice: «تجربة» و«تُجرَّبون» في المتن
  alternative: «اختبار» و«تُختبَرون»، أو فهم اللفظ بمعنى الإغراء بالخطية
  rationale: يحمل الأصل الدلالتين، وسياق الخطية يعطي البعد الأخلاقي وزنًا، لكن العربية «تجربة» تحفظ التوتر الدلالي ولا تنسب إلى الله إغراء الناس بالشر.
- issue: طبيعة ἔκβασις وعلاقتها بالاحتمال
  choice: '«منفذًا» مع إبقاء الغاية: «لكي تستطيعوا أن تحتملوها»'
  alternative: «مخرجًا» أو «العاقبة»
  rationale: لا تصوّر العبارة وعدًا بزوال كل ضيق فورًا؛ فالمنفذ الذي يجعله الله يمكّن من الاحتمال، وهذا يحفظ اقتران الخروج بالصمود في النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُخدم جمع المخاطبين وفق الأصل، وحُفظ التوازي بين «تجربة» و«تُجرَّبون»، مع تجنب حسم الغموض الأصيل بين الإغراء والاختبار.
