revisions:
- from: لم تصبكم تجربة إلا تجربة بشرية[a]. لكن الله أمين، ولن يدعكم تُجرَّبون فوق ما تستطيعون، بل سيجعل مع التجربة أيضًا منفذًا[b]، لكي تستطيعوا أن تحتملوها.
  to: ما أصابتكم تجربة إلا مما يمرّ به البشر[a]. لكن الله أمين، ولن يسمح بأن تُجرَّبوا فوق ما تقدرون عليه، بل سيجعل مع التجربة أيضًا مخرجًا[b]، لكي تقدروا على احتمالها.
  rationale: يستبدل التعديل الوصف العربي الملتبس «تجربة بشرية» بتعبير يوضح أن التجربة ليست استثنائية أو فوق بشرية، مع إبقاء بدائل أكثر حرفية في الحاشية. كما يحسن سلاسة فعل السماح ويستعمل «مخرجًا» بوصفه المقابل العربي الواضح لـ ἔκβασις. وتبقى غاية المخرج هي احتمال التجربة، فلا تُفرض قراءة تقول بإزالتها الفورية.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:37Z'
review_pass:
  verdict: revise
  source_fidelity: المعنى العام محفوظ، بما في ذلك أمانة الله، وحدّ التجربة، واقتران «المخرج» بالقدرة على الاحتمال. لكن «إلا تجربة بشرية» تبدو في العربية تكرارًا غير طبيعي وقد تُفهم بمعنى تجربة تخصّ البشر، لا تجربة من النوع المعتاد للبشر. التعديل يبيّن دلالة ἀνθρώπινος دون إضافة حسم لاهوتي.
  naturalness: 'الصياغة المنقحة أفصح وأسلس في العربية الفصحى الحديثة: «ما أصابتكم تجربة إلا مما يمرّ به البشر» تعبير طبيعي، و«لن يسمح بأن تُجرَّبوا» أوضح من «لن يدعكم تُجرَّبون». كما أن «مخرجًا» هو المقابل العربي المألوف لـ ἔκβασις في هذا السياق.'
  terminology: أُبقيت «تجربة» و«تُجرَّبوا» حفاظًا على التوازي اللفظي وعلى البعد الأخلاقي في السياق، مع بيان إمكان «الاختبار/المحنة» في الحاشية. واستُخدمت «أمين» لـ πιστός و«مخرجًا» لـ ἔκβασις، من دون الإيحاء بأن المخرج يقتضي زوال التجربة فورًا.
