  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: ar
  text: فَسَوَاءٌ أَكُنْتُمْ تَأْكُلُونَ أَمْ تَشْرَبُونَ أَمْ تَفْعَلُونَ أَيَّ شَيْءٍ، فَافْعَلُوا كُلَّ شَيْءٍ لِمَجْدِ اللهِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: سواء... أم... أم
  rationale: ينقل هذا التركيب حالات بديلة مع الحفاظ على البنية البلاغية المتوازية بأسلوب عربي طبيعي.
- source_word: οὖν
  choice: فَـ
  rationale: تفيد الفاء هنا التفريع والاستنتاج من المناقشة السابقة، وهي أوفق للسياق من عبارة أثقل مثل «لذلك».
- source_word: ἐσθίετε
  choice: أكلتم
  rationale: المضارع اليوناني ذو دلالة عامة؛ ويؤدي الماضي العربي الواقع بعد «سواء» هذا المعنى الشرطي العام بوضوح، دون حصره في فعل وقع في الماضي.
- source_word: πίνετε
  choice: شربتم
  rationale: يوازي «أكلتم» في الدلالة العامة، ويحافظ على توازن العبارة.
- source_word: τι
  choice: أي شيء
  rationale: يوسّع نطاق القول إلى كل فعل آخر، وهو تعبير عربي واضح عن التنكير الشامل في هذا التركيب.
- source_word: ποιεῖτε
  choice: فعلتم / فافعلوا
  rationale: استُعمل الفعل نفسه في جملة الحالات وفي الحث الختامي، مع اختلاف الصيغة الذي يقتضيه التركيب العربي؛ والفعل اليوناني الأخير يُفهم أمرًا في السياق.
- source_word: πάντα
  choice: كل شيء
  rationale: ينقل الشمول بعبارة عربية معاصرة وطبيعية.
- source_word: εἰς δόξαν
  choice: لمجد
  rationale: اللام تعبّر بإيجاز عن الغاية أو القصد الذي تدل عليه εἰς في هذا السياق، مع إبقاء احتمال كون الفعل مؤديًا إلى تمجيد الله.
- source_word: θεοῦ
  choice: الله
  rationale: جاء الاسم مضافًا إليه في «لمجد الله»، بما ينقل علاقة الإضافة اليونانية مباشرة وطبيعيًا.
theological_decisions:
- issue: نطاق الحث الرسولي
  choice: صياغة شاملة تمتد من الأكل والشرب إلى كل فعل
  alternative: قصر التوجيه على مسائل الطعام والشراب في السياق المباشر
  rationale: ينطلق النص من المثالين المحددين ثم يوسّع النطاق صراحة بعبارتي «أي شيء» و«كل شيء»، من غير فصل المبدأ العام عن قضية الأطعمة التي نشأ فيها.
- issue: دلالة εἰς δόξαν θεοῦ
  choice: «لمجد الله» بوصف المجد غاية الفعل واتجاهه
  alternative: «لتمجيد الله» بوصف العبارة أمرًا صريحًا بإسناد المجد إليه
  rationale: تحافظ «لمجد الله» على الاسم اليوناني δόξαν وعلى شيء من سعة علاقة الغاية، فلا تحوّلها بلا ضرورة إلى مصدر فعلي أكثر تفسيرًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «فسواء» لربط الآية بما قبلها، والتوازي «أكلتم... شربتم... فعلتم» لحفظ إيقاع الأصل، ثم «فافعلوا» لإبراز قوة الحث. لا توجد حاجة إلى حاشية نصية أو تفسيرية في هذه الآية.
