  naturalness: الصياغة المقترحة أدناه فصيحة وحديثة وتحافظ على توازي الحالات بوضوح. وتركيب «سواء أكنتم ... أم ...» أدق في التعبير عن «whether ... or ... or» من دون إيحاء زمني ماضٍ.
  terminology: «مجد الله» ترجمة مستقرة ودقيقة لـ δόξαν θεοῦ، واللام في «لمجد الله» مناسبة للدلالة الغائية في εἰς. ولا توجد أسماء أو مصطلحات لاهوتية تحتاج إلى معالجة إضافية.
