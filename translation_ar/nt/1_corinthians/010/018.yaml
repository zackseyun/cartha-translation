base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: ar
  text: 'تأمَّلوا إسرائيل بحسب الجسد[a]: أليس الذين يأكلون الذبائح لهم نصيب في المذبح؟[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أي إسرائيل من جهة النسب الطبيعي.
    reason: lexical_alternative
  - marker: b
    text: 'أو: شركاء المذبح؛ أو: يشتركون في المذبح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: تأمَّلوا
  rationale: صيغة أمر للجمع تدعو إلى النظر المتفكر في المثال ضمن حجة بولس، لا إلى مجرد الرؤية البصرية.
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: إسرائيل بحسب الجسد
  rationale: يحافظ على العبارة البولسية وصورة «الجسد»، مع بيان المقصود هنا، أي إسرائيل من جهة النسب الطبيعي، في الحاشية دون حسم دلالات العبارة الأوسع.
- source_word: οὐχ ... εἰσίν;
  choice: أليس ...؟
  rationale: ينقل السؤال البلاغي الذي يتوقع جوابًا بالإيجاب بصياغة عربية طبيعية.
- source_word: οἱ ἐσθίοντες
  choice: الذين يأكلون
  rationale: يحافظ على الفعل الحسي الملموس في اسم الفاعل اليوناني، من غير إدخال معنى «الاشتراك» قبل وروده في κοινωνοί.
- source_word: τὰς θυσίας
  choice: الذبائح
  rationale: مقابل عربي واضح ومألوف للذبائح المقدمة في السياق التعبدي.
- source_word: κοινωνοὶ
  choice: شركاء
  rationale: ينقل معنى الاشتراك الفعلي والنصيب المشترك في المجال التعبدي المرتبط بالمذبح.
- source_word: τοῦ θυσιαστηρίου
  choice: في المذبح
  rationale: تفيد «في» الاشتراك في ما يمثله المذبح وفي عبادته، وهي أوضح عربيًا من تركيب «شركاء المذبح» الذي قد يوهم الملكية أو يجعل المذبح شريكًا شخصيًا.
theological_decisions:
- issue: دلالة «إسرائيل بحسب الجسد»
  choice: الإبقاء على العبارة الحرفية مع تفسيرها في الحاشية بأنها تشير هنا إلى إسرائيل من جهة النسب الطبيعي
  alternative: إسرائيل الطبيعي؛ إسرائيل بحسب النسب
  rationale: السياق يستشهد بممارسة إسرائيل القومية في الذبائح، لكن إبقاء لفظ «الجسد» يصون التعبير البولسي ولا يحمّل الآية حكمًا أوسع في العلاقة بين إسرائيل والكنيسة.
- issue: طبيعة الاشتراك في المذبح
  choice: شركاء في المذبح
  alternative: مشتركون مع المذبح؛ لهم نصيب في المذبح
  rationale: المقصود مشاركة حقيقية في المجال التعبدي الذي يمثله المذبح، لا أن المذبح شخصٌ شريك؛ والصياغة المختارة تحفظ الإيجاز والتوتر الاستعاري في الأصل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم «تأمَّلوا» لاستدعاء الانتباه الاستدلالي، وحُفظ تعبير «بحسب الجسد» لما له من أهمية في أسلوب بولس، مع إيضاح موجز في الحاشية.
