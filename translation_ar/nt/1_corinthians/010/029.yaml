  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: ar
  text: وأعني ضمير الشخص الآخر[a]، لا ضميرك أنت. فلماذا يُحكَم على حريتي بضمير شخص آخر؟[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وحرفيًا: «لا ضميره هو، بل ضمير الآخر». ويفيد السياق: «لا ضميرك أنت، بل ضمير الشخص الآخر».'
    reason: lexical_alternative
  - marker: b
    text: قد يكون هذا السؤال تحديًا بلاغيًا من بولس نفسه، أو اعتراضًا ينقله على لسان غيره؛ ولا توجد في اليونانية علامات اقتباس تحسم ذلك.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν
  choice: ضمير
  rationale: يدل اللفظ في هذا السياق البولسي على الوعي الأخلاقي الذي يقيّم به الإنسان أفعاله، و«الضمير» هو المقابل العربي الطبيعي والدقيق.
- source_word: δὲ λέγω
  choice: وأعني
  rationale: يفيد التعبير توضيح المقصود في الكلام السابق، لا انتقالًا زمنيًا؛ لذلك تنقل «وأعني» وظيفته التفسيرية بإيجاز وطبيعية.
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: ضمير الشخص الآخر، لا ضميرك أنت
  rationale: يوضح السياق أن المقابلة بين ضمير المخاطَب وضمير الشخص الآخر. قُدّم «ضمير الشخص الآخر» موافقةً لمسار التوضيح في اليونانية، مع التصريح بالمحذوف لسلامة العربية.
- source_word: ἱνατί γὰρ
  choice: فلماذا
  rationale: تحفظ الفاء صلة التعليل والتفسير بما سبق، وتنقل «لماذا» قوة السؤال البلاغي.
- source_word: ἐλευθερία
  choice: حريتي
  rationale: «الحرية» هي المقابل العربي الواضح للفظ، وتناسب سياق حق الإنسان في فعل ما يراه مباحًا.
- source_word: κρίνεται
  choice: تُدان
  rationale: يمكن أن يعني الفعل الحكم أو التقييم. اختيرت «تُدان» لأنها طبيعية مع الحرية التي يصدر عليها ضمير الغير حكمًا سلبيًا في هذا السياق، مع بقاء «يُحكم عليها» احتمالًا أوسع.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: بضمير شخص آخر
  rationale: ينقل العبارة الدالة على الجهة التي يصدر عنها الحكم، ويجعل «شخص» المرجع البشري مفهومًا في العربية.
theological_decisions:
- issue: مرجع ضمير الملكية في المقابلة الأولى
  choice: المقصود ضمير الشخص الآخر لا ضمير المخاطَب نفسه
  alternative: المقصود ليس ضميره هو، بل ضمير الآخر
  rationale: صيغة ἑαυτοῦ مفرد غائب حرفيًا، لكن سياق خطاب أهل كورنثوس يجعل «ضميرك أنت» توضيحًا طبيعيًا للمقصود. أُثبت البديل الحرفي في الحاشية حفاظًا على هيئة الأصل.
- issue: هوية المتكلم ووظيفة السؤال البلاغي
  choice: إبقاء السؤال من غير حسم هل هو تحدٍّ بلاغي من بولس أم اعتراض ينقله
  alternative: اعتباره اعتراضًا على لسان محاور كورنثي، أو سؤالًا يطرحه بولس نفسه
  rationale: لا تضع اليونانية علامات اقتباس ولا تعلن انتقال المتكلم، لذلك تُحفظ المساحة التفسيرية في الحاشية ولا يُحسم الأمر في المتن.
- issue: مدى دلالة κρίνεται
  choice: تُدان
  alternative: يُحكم عليها أو تُقيَّم
  rationale: اختير التعبير العربي الطبيعي الذي يلائم الاعتراض البلاغي، من غير بناء نتيجة عقائدية على معنى الإدانة؛ وتذكر الملاحظة المعجمية أن أصل الفعل أوسع دلالة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «وأعني» للتوضيح من غير إدخال ظرف زمني غير موجود، وأُبقي السؤال البلاغي مباشرًا. وُضعت علامتا الحاشية في المتن عند الموضعين اللذين تتعلق بهما المسألتان التفسيريتان.
