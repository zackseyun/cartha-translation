source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: ar
  text: وشربوا جميعًا الشراب الروحي نفسه[a]، لأنهم كانوا يشربون من صخرة روحية كانت تتبعهم[b]، وكانت الصخرة هي المسيح[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا فهم «روحي» هنا بمعنى ما ينتمي إلى مجال الروح أو ما يقدّمه الله؛ وقد أُبقي اللفظ من غير حصره في معنى «رمزي» أو «فائق للطبيعة».
    reason: lexical_alternative
  - marker: b
    text: 'يستعمل اليوناني اسم فاعل مضارعًا يمكن ترجمته أيضًا: «التي تتبعهم»؛ وتفيد الصياغة معنى الاستمرار أو المصاحبة.'
    reason: lexical_alternative
  - marker: c
    text: 'اليونانية: Χριστός، أي «المسيح» بوصفه لقبًا.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: الشراب الروحي
  rationale: يحافظ على وصف بولس πνευματικός وعلى التوازي مع «الطعام الروحي» في الآية السابقة، من غير تضييق المعنى إلى «رمزي» أو «فائق للطبيعة».
- source_word: ἔπιον
  choice: شربوا
  rationale: صيغة الماضي تلخّص الاختبار المشترك لجماعة البرية، وهي الصياغة العربية الطبيعية هنا.
- source_word: ἔπινον
  choice: كانوا يشربون
  rationale: ينقل الفعل الماضي الناقص اليوناني بوصفه فعلًا مستمرًا أو متكررًا، ويميّزه من الفعل السابق ἔπιον.
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: من صخرة روحية كانت تتبعهم
  rationale: نُكّرت «صخرة» موافقة لغياب أداة التعريف في العبارة اليونانية، وحافظت «كانت تتبعهم» على الجانب الاستمراري لاسم الفاعل المضارع ἀκολουθούσης.
- source_word: πέτρα
  choice: صخرة
  rationale: تدل πέτρα على الصخر لا على حجر صغير، كما تحفظ الصورة النمطية في الحجة.
- source_word: ἡ πέτρα δὲ ἦν
  choice: وكانت الصخرة هي
  rationale: تنقل δέ هنا بوصفها أداة ربط تفسيرية خفيفة، وتبرز «هي» الجملة التعريفية من غير إضافة تفسير إليها.
- source_word: ὁ Χριστός
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، ويحفظ استعماله اللقبي والمسياني في هذا السياق.
- source_word: πάντες τὸ αὐτὸ
  choice: جميعًا ... نفسه
  rationale: يحفظ التشديد على اشتراك الجماعة كلها في الاختبار عينه.
theological_decisions:
- issue: 'عبارة التطابق: «كانت الصخرة هي المسيح»'
  choice: الإبقاء على صيغة التطابق المباشرة كما في اليونانية، مع الحفاظ على قوتها النمطية واللاهوتية.
  alternative: «كانت الصخرة ترمز إلى المسيح» أو «كانت تمثل المسيح».
  rationale: 'النص اليوناني يستعمل جملة مساواة صريحة: ἡ πέτρα δὲ ἦν ὁ Χριστός. وتحويلها إلى «ترمز إلى» يحسم طبيعة العلاقة تفسيرًا ويضعف التوتر المقصود في العبارة.'
- issue: دلالة «روحي» في وصف الشراب والصخرة
  choice: الإبقاء على «روحي» من غير تفسيره داخل المتن.
  alternative: «رمزي» أو «فائق للطبيعة» أو «إلهي».
  rationale: يحمل πνευματικός وزنًا لاهوتيًا وقد يشير إلى ما ينتمي إلى مجال الروح أو إلى تدبير إلهي ذي دلالة نمطية؛ واختيار بديل تفسيري واحد يضيّق مجال المعنى.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. استُخدم «الروحي» لا «الروحاني» لأنه أشيع وأوضح في العربية المعاصرة، وحُفظ الفرق الزمني بين «شربوا» و«كانوا يشربون»، كما أُبقيت جملة «الصخرة هي المسيح» بلا تخفيف تفسيري.
