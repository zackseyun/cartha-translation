  yaml_path: translation/nt/1_corinthians/010/012.yaml
  text: Therefore[a], let the one who thinks he stands watch out lest he fall.
translation:
  language: ar
  text: لذلك، مَن يظنّ أنه قائم، فليحذر لئلّا يسقط.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إذًا، مَن يظنّ أنه واقف، فلينتبه لئلّا يسقط».'
    reason: 'بديل معجمي وصياغي: «واقف» بدل «قائم»، و«فلينتبه» بدل «فليحذر»، مع الحفاظ على صورة الوقوف وقوة التحذير.'
lexical_decisions:
- source_word: ὥστε
  choice: لذلك
  rationale: أداة تفريع واستنتاج تصل التحذير بالأمثلة السابقة، و«لذلك» تؤدي هذا المعنى بوضوح وطبيعية.
- source_word: ὁ δοκῶν
  choice: مَن يظنّ
  rationale: اسم الفاعل المحلّى بأداة التعريف مستعمل استعمال الاسم للدلالة على شخص تمثيلي؛ و«مَن يظنّ» صياغة عربية طبيعية تحفظ عموم التحذير.
- source_word: ἑστάναι
  choice: أنه ثابت
  rationale: المصدر التام من ἵστημι يدل على حالة قائمة من الوقوف أو الثبات؛ و«ثابت» تنقل الحالة دون أن تضيف معنى عقائديًا محددًا.
- source_word: βλεπέτω
  choice: فلينتبه
  rationale: أمر مضارع يفيد اليقظة المستمرة، و«فلينتبه» واضحة وفصيحة وتحفظ قوة التحذير.
- source_word: μὴ πέσῃ
  choice: لئلّا يسقط
  rationale: μή مع صيغة الاحتمال بعد الأمر تفيد الغاية السلبية أو التحذير؛ و«لئلّا يسقط» موجزة وتحافظ على عموم لفظ السقوط.
theological_decisions:
- issue: طبيعة «السقوط» في التحذير
  choice: إبقاء التحذير عامًا بلفظ «يسقط»
  alternative: يسقط في الخطية؛ يقع تحت الدينونة؛ يرتدّ
  rationale: السياق يحذّر من الثقة بالنفس في ضوء إخفاقات إسرائيل، لكن πέσῃ لا يحدد وحده أهو سقوط في الخطية أم تحت الدينونة أم ارتداد؛ لذلك تُحفظ دلالة النص الواسعة وتوتره اللاهوتي.
- issue: التعبير التمثيلي المذكر
  choice: استخدام «مَن» مع ضمير المذكر المفرد في «أنه... يسقط»
  alternative: استخدام صياغة جمع أو صياغة محايدة تمامًا
  rationale: اليونانية مفرد مذكر ذو وظيفة تمثيلية عامة، والصياغة العربية المختارة طبيعية وتحفظ العدد والصيغة النحوية من غير حصر المقصود في فرد بعينه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم «ثابت» في المتن لطبيعته في العربية، مع حفظ صورة «واقف» في الحاشية. وُضعت علامة الحاشية [a] في المتن كما هو مطلوب.
