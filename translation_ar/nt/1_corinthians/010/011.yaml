source:
  edition: SBLGNT
  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: ar
  text: وهذه الأمور حدثت لهم بوصفها أمثلة[a]، لكنها كُتبت لتنبيهنا[b]، نحن الذين وصلت إلينا نهايات الدهور[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بوصفها أنماطًا» أو «على نحو رمزي»؛ يعرض بولس هذه الأحداث بصفتها أنماطًا ذات دلالة تعليمية للمؤمنين اللاحقين.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لتعليمنا التصحيحي» أو «لتحذيرنا»؛ تتضمن الكلمة اليونانية التعليم المقوِّم والتحذير معًا.'
    reason: lexical_alternative
  - marker: c
    text: 'تعبير الأصل اليوناني بالجمع حرفيًّا: «نهايات الدهور»، لا «نهاية الدهور»؛ وقد حُفظ الجمع لإبقاء صياغة بولس المتعلقة بمراحل عمل الله في التاريخ.'
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: بوصفها أمثلة
  rationale: ينقل كون الأحداث أنماطًا أو أمثلة ذات دلالة تعليمية، بلغة عربية واضحة، من غير فرض مصطلح «نموذجيًّا» التقني أو الملتبس.
- source_word: συνέβαινεν
  choice: حدثت
  rationale: صياغة عربية طبيعية تدل على وقوع الأمور المذكورة؛ وسياق الجمع يحمل تعدد الوقائع، وإن كان الفعل اليوناني في صيغة الماضي الناقص.
- source_word: ἐκείνοις
  choice: لهم
  rationale: يعود الضمير على جيل البرية المذكور في السياق، وهذه أقصر صياغة عربية طبيعية.
- source_word: ἐγράφη
  choice: كُتبت
  rationale: يبقي المبني للمجهول ودلالة تدوين هذه الأمور في الكتاب؛ وتأنيث الفعل المفرد يلائم جمع غير العاقل «الأمور» في العربية.
- source_word: πρὸς νουθεσίαν ἡμῶν
  choice: لتنبيهنا
  rationale: «التنبيه» يجمع قدرًا من التعليم التصحيحي والتحذير، ويتلاءم مع السياق الوعظي من غير حصر المعنى في مجرد نقل المعلومات.
- source_word: εἰς οὓς
  choice: نحن الذين وصلت إلينا
  rationale: يُظهر أن الواقع الأخروي المذكور قد بلغ جماعة المتكلمين، مع تركيب عربي سليم وواضح.
- source_word: τὰ τέλη τῶν αἰώνων
  choice: نهايات الدهور
  rationale: يحفظ جمع كل من «النهايات» و«الدهور»، فلا يختزل تعبير بولس الخلاصي الأخروي إلى نهاية مفردة.
- source_word: κατήντηκεν
  choice: وصلت
  rationale: ينقل معنى البلوغ والوصول؛ ويفهم من السياق أن الوصول قد وقع وأن أثره حاضر، وهي دلالة صيغة التام اليونانية.
theological_decisions:
- issue: تعبير بولس الخلاصي الأخروي τὰ τέλη τῶν αἰώνων
  choice: وصلت إلينا نهايات الدهور
  alternative: بلغتنا نهاية الدهور / جاء ملء الدهور
  rationale: تحفظ الصياغة المختارة الجمع والتوتر الأخروي في الأصل، ولا تفسره سلفًا على أنه نهاية واحدة أو مجرد اكتمال.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الدهور» بدل «العصور» لأنها أنسب للسياق الكتابي والأخروي مع بقائها مفهومة، وتُركت صيغة الجمع غير المألوفة نسبيًّا حفاظًا على توتر العبارة اليونانية.
