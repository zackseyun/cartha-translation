  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: ar
  text: فإن كنتُ أتناول بشكرٍ[a]، فلماذا يُساء إليَّ بسبب ما أشكر عليه؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن كنتُ أتناول بالنعمة، فلماذا يُساء إليَّ بسبب ما أشكر عليه؟» يمكن أن تعني الكلمة اليونانية «بالنعمة»، لكن كثيرين يفهمونها هنا بمعنى «بشكرٍ» بسبب ورود «أشكر» بعدها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: بشكرٍ
  rationale: تؤدي المعنى الحالي الدال على تناول الطعام مصحوبًا بالشكر، ويؤيده الفعل اللاحق «أشكر»، من غير إقحام معنى خلاصي غير لازم.
- source_word: μετέχω
  choice: أتناول
  rationale: في سياق الطعام، «أتناول» عربية طبيعية واضحة، وتعبّر عن الاشتراك في الأكل دون تكلّف.
- source_word: βλασφημοῦμαι
  choice: يُذَمّ كلاميًّا
  rationale: الفعل هنا يدل على التحدث بالسوء عن بولس أو الطعن فيه، لا على التجديف على الله؛ والصياغة توضّح أن المقصود ذمّ بالقول.
- source_word: ὑπὲρ οὗ
  choice: بسبب ما
  rationale: تنقل علاقة السبب أو الأساس التي تفيدها العبارة اليونانية في هذا الموضع.
- source_word: εὐχαριστῶ
  choice: أشكر عليه
  rationale: تحافظ على معنى «أقدّم الشكر» وتترك متلقّي الشكر ضمنيًا كما في اليونانية.
- source_word: ἐγὼ ... ἐγὼ
  choice: كنتُ أتناول ... أشكر
  rationale: تظهر صيغة المتكلم في تصريف الفعلين بالعربية؛ ولا يلزم تكرار الضمير المنفصل إلا بتوكيد أثقل من الأسلوب الطبيعي.
- source_word: τί
  choice: لماذا
  rationale: أداة الاستفهام هنا تفيد السؤال البلاغي عن السبب.
theological_decisions:
- issue: دلالة χάριτι في صلتها بتناول الطعام والشكر
  choice: بشكرٍ، أي مصحوبًا بالامتنان
  alternative: بالنعمة
  rationale: القرينة المباشرة، ولا سيما «أشكر»، ترجّح معنى الشكر والامتنان، مع إبقاء قراءة «بالنعمة» في الحاشية لأنها ممكنة لغويًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. اختيرت «أتناول» لملاءمة سياق الطعام، وأُبقي البديل «بالنعمة» في الحاشية حفاظًا على الاحتمال المعجمي الحقيقي.
