base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: ar
  text: 'ولا تصيروا عَبَدَةَ أوثان، كما صار بعضهم؛ كما هو مكتوب: «جلس الشعب للأكل والشرب، ثم قاموا ليلعبوا[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «ليلهوا». والعبارة مقتبسة من خروج 32:6، حيث ارتبط هذا اللهو بوليمة إسرائيل الوثنية حول العجل الذهبي.'
    reason: بديل معجمي وتوضيح سياق الاقتباس
lexical_decisions:
- source_word: μηδὲ
  choice: ولا
  rationale: تصل النهي بما قبله في سلسلة تحذيرات بولس، وهي صياغة عربية موجزة وطبيعية.
- source_word: εἰδωλολάτραι γίνεσθε
  choice: تصيروا عَبَدَةَ أوثان
  rationale: تحافظ «تصيروا» على معنى الدخول في هذه الحال، وتنقل «عَبَدَة أوثان» الاسم الدال على ممارسي عبادة الأصنام بوضوح.
- source_word: καθώς τινες αὐτῶν
  choice: كما صار بعضهم
  rationale: يُقدَّر فعل الصيرورة من العبارة السابقة، بما يلائم العربية ويحافظ على المقارنة مع بعض بني إسرائيل.
- source_word: ὥσπερ γέγραπται
  choice: كما هو مكتوب
  rationale: صيغة اقتباس مألوفة تنقل دلالة النص المكتوب القائم.
- source_word: Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν
  choice: جلس الشعب ليأكلوا ويشربوا
  rationale: ترجمة مباشرة للاقتباس، مع مراعاة أن «الشعب» اسم جمع يجوز عود ضمير الجمع إليه بحسب المعنى.
- source_word: ἀνέστησαν
  choice: قاموا
  rationale: ينقل الحركة السردية بإيجاز ووضوح.
- source_word: παίζειν
  choice: ليلعبوا
  rationale: يحافظ على المعنى اللفظي الأساسي وعلى صياغة اقتباس الخروج، من غير حسم الإيحاء السياقي باللهو الصاخب في المتن.
theological_decisions:
- issue: مدى التصريح بدلالة παίζειν في سياق وليمة العجل الذهبي في خروج 32:6
  choice: إبقاء «ليلعبوا» في المتن مع شرح الدلالة السياقية في الحاشية
  alternative: ليلهوا / ليعربدوا
  rationale: الفعل يحتمل اللعب أو اللهو، بينما سياق الاقتباس يربطه باحتفال وثني. إبقاء اللفظ الأوسع يصون غموضه الحقيقي، والحاشية تكشف قوة السياق من دون فرض تفسير أضيق.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعملت «عَبَدَة أوثان» بدل تركيب أطول، وحُفظ إيقاع الاقتباس وبنيته من غير إدخال تفسير طائفي.
