  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: ar
  text: أليست كأسُ البركة التي نباركها مشاركةً في دم المسيح؟ والخبز الذي نكسره، أليس مشاركةً في جسد المسيح؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن ترجمة «مشاركة» أيضًا: «اشتراك»؛ وتقليديًا: «شركة».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ποτήριον τῆς εὐλογίας
  choice: كأسُ البركة
  rationale: ترجمة مباشرة وطبيعية تحفظ لفظ «البركة» ولا تحصره في معنى الشكر وحده، كما تُبقي الصلة المحتملة بخلفية بركة المائدة.
- source_word: ὃ εὐλογοῦμεν
  choice: التي نباركها
  rationale: تحفظ التكرار الاشتقاقي بين «البركة» و«نباركها» من غير إضافة تفسير طقسي غير مصرّح به.
- source_word: οὐχὶ
  choice: أليست / أليس
  rationale: صيغة استفهام إنكاري تتوقع جوابًا بالإيجاب، وتطابق قوة الأداة اليونانية وصيغتها.
- source_word: κοινωνία
  choice: مشاركة في
  rationale: تنقل معنى الاشتراك الفعلي بوضوح، من غير اختزاله إلى مجرد علاقة اجتماعية أو تحميله مصطلحًا كنسيًا تقنيًا يحسم طبيعة المشاركة.
- source_word: τοῦ αἵματος
  choice: دم
  rationale: ترجمة مباشرة تحفظ الدلالة العهدية والذبيحية من غير توسع تفسيري.
- source_word: τοῦ Χριστοῦ
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، ويحفظ دلالته اللقبية من غير الحاجة إلى فصل مصطنع بين «المسيح» و«Christ» في العربية.
- source_word: τὸν ἄρτον ὃν κλῶμεν
  choice: الخبز الذي نكسره
  rationale: صياغة عربية واضحة تحفظ الفعل الحسي والطقسي الوارد في اليونانية من غير تخصيص الخبز بأنه رغيف واحد.
- source_word: τοῦ σώματος
  choice: جسد
  rationale: ترجمة مباشرة تحفظ الثقل المسيحاني والعشائي للعبارة من غير تضييق عقائدي.
theological_decisions:
- issue: دلالة κοινωνία في سياق عشاء الرب
  choice: مشاركة في
  alternative: اشتراك في؛ شركة مع/في
  rationale: «مشاركة في» تثبت وجود صلة ومشاركة حقيقية في دم المسيح وجسده، لكنها لا تحسم الخلافات المذهبية المتعلقة بكيفية هذه المشاركة أو طبيعة الحضور.
- issue: ترجمة Χριστός
  choice: المسيح
  alternative: لا بديل ضروري في العربية
  rationale: اللفظ العربي «المسيح» يؤدي معنى اللقب اليوناني نفسه، وهو أيضًا التعبير العربي المألوف في هذا السياق.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة ومهيبة. استُعملت صيغة الاستفهام الإنكاري كما في الأصل، وحُفظ التوازي بين الكأس والخبز، مع تجنب المصطلحات الطائفية التي قد تحسم طبيعة المشاركة في العشاء الرباني.
