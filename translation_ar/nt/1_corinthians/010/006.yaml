source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: ar
  text: وصارت هذه الأمور أمثلةً لنا[a]، لكيلا نكون مشتهين الشرور، كما اشتهى أولئك أيضًا الشرور.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «نماذج لنا» أو «أنماطًا لنا».'
    reason: بدائل معجمية مشروعة للفظ τύποι، الذي قد يدل على الأمثلة أو النماذج أو الأنماط.
lexical_decisions:
- source_word: Ταῦτα δὲ
  choice: وصارت هذه الأمور
  rationale: «هذه الأمور» تعود إلى وقائع البرية المذكورة سابقًا، والواو تنقل قوة δὲ الانتقالية بلغة عربية طبيعية من غير إضافة ظرف زمان غير موجود في اليونانية.
- source_word: τύποι ἡμῶν
  choice: أمثلةً لنا
  rationale: تفيد τύποι هنا سوابق أو أنماطًا ذات وظيفة تعليمية وتحذيرية؛ و«أمثلة لنا» واضحة وتحفظ دلالة التطبيق على جماعة المؤمنين.
- source_word: ἐγενήθησαν
  choice: صارت
  rationale: تحفظ معنى γίνομαι الدال على الصيرورة أو التحول إلى أداء وظيفة معينة، بدل تسويتها إلى مجرد «كانت».
- source_word: εἰς τὸ μὴ εἶναι ἡμᾶς
  choice: لكيلا نكون
  rationale: تنقل البناء الدال على الغاية أو النتيجة المقصودة، مع إبقاء فعل الكينونة الظاهر في الأصل.
- source_word: ἐπιθυμητὰς κακῶν
  choice: راغبين في الشرور
  rationale: «راغبين» تنقل الاسم الدال على أصحاب الرغبة وتحافظ على اقترانه بـ«نكون»، و«الشرور» تعبر عن جمع κακῶν بوصفه موضوع الرغبة دون حصره في نوع محدد من الشهوة.
- source_word: καθὼς κἀκεῖνοι ἐπεθύμησαν
  choice: كما رغب أولئك أيضًا
  rationale: تحفظ المقارنة وقوة «أيضًا»، وتكرر جذر «رغب» لإظهار الصلة اللفظية بين ἐπιθυμητάς وἐπεθύμησαν.
theological_decisions:
- issue: دلالة τύποι في علاقة اختبارات إسرائيل في البرية بالكنيسة
  choice: أمثلة
  alternative: نماذج أو صور رمزية
  rationale: السياق المباشر تحذيري وأخلاقي، و«أمثلة» توصل هذه الوظيفة من غير فرض مفهوم اصطلاحي ضيق للرمزية، مع إثبات البدائل الممكنة في الحاشية.
- issue: مدى دلالة ألفاظ ἐπιθυμία
  choice: راغبين / رغب
  alternative: مشتهين / اشتهوا
  rationale: الرغبة هنا متجهة إلى الشرور عمومًا، وليست بالضرورة شهوة جنسية؛ لذلك تتجنب الصياغة تضييق المجال الدلالي، مع إبقاء الحكم الأخلاقي في كلمة «الشرور».
- issue: العلاقة بين الغاية والنتيجة في εἰς τὸ μή
  choice: لكيلا
  alternative: حتى لا أو لئلا نصير
  rationale: «لكيلا» تؤدي معنى الغاية بوضوح، مع الاعتراف بأن البناء اليوناني قد يجمع في السياق بين الغاية والنتيجة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «الشرور» للمحافظة على الجمع وعلى القوة الأخلاقية، و«أولئك» لإبقاء الإشارة إلى جيل البرية واضحة. وُضع مؤشر الحاشية في المتن كما يلزم.
