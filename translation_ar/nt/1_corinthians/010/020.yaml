source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: ar
  text: بل إن ما يذبحونه يذبحونه للشياطين لا لله، وأنا لا أريد أن تصيروا شركاء مع الشياطين.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مشاركين مع الشياطين» أو «مشتركين مع الشياطين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: بل إن
  rationale: تفيد تصحيح الفهم المحتمل في الآية السابقة، وتؤدي قوة الاستدراك في العربية بوضوح من غير إضافة جواب صريح غير موجود لفظًا في اليونانية.
- source_word: ἃ θύουσιν
  choice: ما يذبحونه
  rationale: يحافظ على عموم اسم الموصول المحايد، ويشير طبيعيًا إلى الذبائح من غير زيادة تفسيرية.
- source_word: θύουσιν
  choice: يذبحونه / يذبحونها
  rationale: الفعل في السياق شعائري، و«يذبح» هو المقابل العربي المألوف لتقديم الذبيحة، مع تكراره كما في الأصل للتوكيد.
- source_word: δαιμονίοις
  choice: للشياطين
  rationale: ينقل مدلول اللفظة في استعمال العهد الجديد بوصفها كائنات شيطانية، لا آلهة صغرى محايدة.
- source_word: καὶ οὐ θεῷ
  choice: لا لله
  rationale: يجسد المقابلة الصريحة بين الشياطين والله الواحد؛ وحذف الواو قبل «لا» طبيعي في العربية ولا يضعف التقابل.
- source_word: οὐ θέλω δὲ
  choice: وأنا لا أريد
  rationale: ينقل الانتقال الاستمراري الذي تؤديه δέ، ويجعل الفاعل المتكلم بارزًا بوضوح طبيعي.
- source_word: κοινωνοὺς
  choice: شركاء
  rationale: تفيد المشاركة والارتباط الفعليين، وتنسجم مع حجة المشاركة في السياق القريب من غير حصر المعنى في مجرد الصحبة الاجتماعية.
- source_word: τῶν δαιμονίων
  choice: للشياطين
  rationale: اللام مع «شركاء» صياغة عربية طبيعية تدل على الاشتراك والارتباط، مع بقاء البديل «مشاركين مع الشياطين» مذكورًا في الحاشية.
- source_word: γίνεσθαι
  choice: أن تصيروا
  rationale: يحفظ معنى الدخول في حالة أو علاقة، بدل الاقتصار على مجرد الكينونة.
theological_decisions:
- issue: طبيعة الذبائح الوثنية
  choice: الذبائح مقدمة للشياطين لا لله
  alternative: أن يكون الكلام مجرد وصف بلاغي للمعنى الاجتماعي للولائم الوثنية
  rationale: النص يقرر المقابلة صراحة، ولذلك تُحفظ من غير تلطيف أو إضافة تكهنات عن طبيعة هذه الكائنات.
- issue: قوة κοινωνοὺς τῶν δαιμονίων
  choice: مشاركة وارتباط حقيقيان بالشياطين
  alternative: مجرد مخالطة اجتماعية لعبدة الأصنام، أو ولاء تعبدي كامل للشياطين
  rationale: سياق κοινωνία في الآيات المحيطة يدل على مشاركة حقيقية، لكن النص لا يساويها صراحة بولاء تعبدي كامل؛ لذا تحافظ «شركاء» على هذا التوتر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعمل «بل إن» للاستدراك التصحيحي، و«شركاء» لصون البعد العلائقي والتشاركي في κοινωνός. وُضع مؤشر الحاشية عقب العبارة التي يشرحها.
