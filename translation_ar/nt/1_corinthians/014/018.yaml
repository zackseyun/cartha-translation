  text: أشكر الله أنني أتكلم بألسنة أكثر منكم جميعًا[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أتكلم بلغات أكثر منكم جميعًا». يمكن أن تعني الكلمة اليونانية «لغات»، لكنها تشير في هذا السياق إلى الظاهرة موضع النقاش في 1 كورنثوس 12–14، وتُترجم تقليديًا «ألسنة».'
