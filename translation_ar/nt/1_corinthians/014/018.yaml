lexical_decisions:
- source_word: εὐχαριστῶ
  choice: أشكر
  rationale: فعل مضارع خبري بصيغة المتكلم المفرد. «أشكر» تعبير عربي طبيعي مباشر يحفظ القوة الفعلية للنص.
- source_word: τῷ θεῷ
  choice: الله
  rationale: اسم في حالة المجرور اليونانية بوصفه مفعولًا غير مباشر مع εὐχαριστέω، ويقابله في العربية مفعول به مباشر بعد «أشكر».
- source_word: πάντων ὑμῶν
  choice: منكم جميعًا
  rationale: تركيب المقارنة مع μᾶλλον يدل على المقارنة بالجماعة كلها، وتؤديه العربية بوضوح في «أكثر منكم جميعًا» من غير حسم ما إذا كان التركيز على كل فرد على حدة.
- source_word: μᾶλλον
  choice: أكثر
  rationale: ظرف مقارنة يعدّل λαλῶ، ويكتمل تركيبه في العربية بحرف «من» مع الطرف المقارَن به.
- source_word: γλώσσαις
  choice: بألسنة
  rationale: جمع γλῶσσα في سياق 1 كورنثوس 12–14 يسمّي الظاهرة الروحية موضع النقاش. «بألسنة» يحافظ على المصطلح التقليدي وعلى الغموض المتعلق بطبيعة الظاهرة، بينما «بلغات» احتمال معجمي مذكور في الحاشية.
- source_word: λαλῶ
  choice: أتكلم
  rationale: فعل مضارع خبري بصيغة المتكلم المفرد؛ والمضارع العربي الطبيعي يلائم التقرير العام في السياق.
theological_decisions:
- issue: ترجمة γλώσσαις في سياق موهبة الألسنة
  choice: بألسنة
  alternative: بلغات
  rationale: يستعمل سياق 1 كورنثوس 12–14 اللفظة تسميةً للموهبة التي يناقشها بولس. تحافظ «بألسنة» على مصطلح النص من غير أن تحسم هل المقصود لغات بشرية أم كلامًا من نوع آخر، في حين قد توحي «بلغات» بتحديد أضيق مما تصرّح به الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «بألسنة» للمحافظة على المصطلح السياقي والغموض الحقيقي في اليونانية، مع بيان البديل المعجمي في الحاشية.
