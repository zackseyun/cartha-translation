  source_fidelity: النص يحافظ على البنية الشرطية، وعلى شمول «الجميع»، وعلى التكرار المقصود لعبارة «من الجميع». وترجمة «يُبَكَّت» و«يُفحَص» تنقلان، دون إفراط، تتابع الإدانة/الكشف ثم الفحص في اليونانية. لكن «فدخل» بعد أداة الشرط أقل اتساقًا مع صياغة الشرط الجارية؛ والأوضح أن يُعطف الدخول داخل الشرط بـ«ودخل».
