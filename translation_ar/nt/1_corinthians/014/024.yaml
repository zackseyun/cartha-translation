  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: ar
  text: ولكن إن كان الجميع يتنبأون، ودخل شخص غير مؤمن أو غير مُلِمّ[a]، فإنه يُبَكَّت من الجميع، ويُفحَص من الجميع.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شخص من خارج الجماعة». قد يدل اللفظ اليوناني على من يفتقر إلى المعرفة أو الدراية، أو على من لم يُدخَل في ممارسات الجماعة، أو على من ليس من الجماعة المتكلمة.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: الجميع
  rationale: ينقل أداة الشمول بصورة مباشرة، ويشير في السياق إلى المتكلمين في اجتماع الجماعة.
- source_word: προφητεύωσιν
  choice: يتنبؤون
  rationale: يحافظ على المصطلح البولسي المتكرر في هذا الأصحاح من غير اختزاله في مجرد كلام ملهم أو شرحه داخل النص.
- source_word: ἄπιστος
  choice: غير مؤمن
  rationale: يدل في هذا السياق على شخص لا يؤمن، وهذه صياغة عربية واضحة لا توحي بمجرد عدم الأمانة.
- source_word: ἰδιώτης
  choice: غير مطّلع
  rationale: يعبّر عن شخص لا يعرف ممارسات الجماعة أو لا يفهمها، من غير أن يحسم أنه خارج الجماعة تمامًا أو يستورد تصنيفًا كنسيًا حديثًا.
- source_word: ἐλέγχεται
  choice: يُبَكَّت
  rationale: يحفظ معنى كشف الخطأ وإحداث التبكيت الأخلاقي تحت تأثير ما يسمعه، مع إبقاء صيغة المبني للمجهول.
- source_word: ἀνακρίνεται
  choice: يُفحَص
  rationale: ينقل معنى الفحص والتمحيص من غير المبالغة بجعله إدانة نهائية.
- source_word: ὑπὸ πάντων
  choice: من الجميع
  rationale: يحافظ على تكرار العبارة اليونانية وأثرها البلاغي في الجملتين.
- source_word: δέ
  choice: ولكن / فـ
  rationale: تؤدي «ولكن» وظيفة المقابلة مع الحالة السابقة، وتربط الفاء دخول الشخص بنتيجة الشرط في عربية طبيعية.
- source_word: τις
  choice: شخص
  rationale: ينقل التنكير بعبارة عربية سلسة قبل الوصفين البديلين.
theological_decisions:
- issue: دلالة ἰδιώτης في سياق اجتماع الجماعة
  choice: غير مطّلع
  alternative: شخص من خارج الجماعة؛ أو غير عارف
  rationale: يركز السياق على الفهم وقابلية الكلام للإدراك، لذلك تحافظ «غير مطّلع» على نقص المعرفة أو الألفة من غير أن تحسم ما إذا كان الشخص غير منتمٍ إلى الجماعة مطلقًا. وتُذكر القراءة السياقية الأخرى في الحاشية لصون الغموض الحقيقي.
translation_notes:
  register: لغة عربية فصحى معاصرة، واضحة ووقورة. حُفظ البناء الشرطي، وصيغة المبني للمجهول، وتكرار «من الجميع» كما في اليونانية. وُضعت علامة الحاشية بعد «غير مطّلع» لأنها تخص معنى ἰδιώτης.
