  choice: الإبقاء على التعبير العام «الآخرون»
  alternative: الأنبياء الآخرون؛ أو بقية الجماعة
  rationale: النص اليوناني لا يحدد هذه الفئة، ولذلك تُحفظ المسألة مفتوحة ولا يُحسم سؤال كنسي لا يحسمه النص.
- issue: طبيعة عمل διακρίνω تجاه الكلام النبوي
  choice: «يميّز ... ما يُقال» مع بيان البدائل في الحاشية
  alternative: يحكموا؛ يفحصوا؛ يقيّموا
  rationale: يحفظ الاختيار معنى التمييز والتقويم المتأني، من غير أن يوحي تلقائيًا بحكم قضائي أو إدانة.
