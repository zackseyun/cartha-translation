  rationale: الاسم يدل على الأنبياء أو المتكلمين بنبوّة، وصيغة المثنى ثم المفرد بعد العدد في العربية تنقل العبارة العددية بوضوح وطبيعية.
- source_word: δὲ
  choice: الواو في «وليتكلم»
  rationale: تفيد هنا انتقالًا خفيفًا ضمن سلسلة من التعليمات، وتؤديه الواو العربية دون إحداث مقابلة قوية.
- source_word: δύο ἢ τρεῖς
  choice: اثنان أو ثلاثة، مصوغةً بحسب موقع «نبيّان» الإعرابي
  rationale: نقل مباشر للتعبير العددي، مع مراعاة قواعد العدد والإعراب في العربية.
- source_word: λαλείτωσαν
  choice: ليتكلم
  rationale: صيغة الأمر للغائب تُنقل بلام الأمر، فتحفظ القوة التوجيهية وتبقى عربية طبيعية.
- source_word: οἱ ἄλλοι
  choice: الآخرون
  rationale: يحافظ هذا التعبير على عدم تعيين المرجع في اليونانية، فلا يحصرهم في الأنبياء الآخرين أو القادة أو الجماعة كلها.
- source_word: διακρινέτωσαν
  choice: ليميّز ... ما يُقال
  rationale: الفعل في هذا السياق يدل على فحص الكلام النبوي وتمييزه أو تقييمه، لا على الإدانة القضائية. وإضافة «ما يُقال» توضّح المفعول المفهوم من السياق دون تعيين معيار التقييم.
theological_decisions:
