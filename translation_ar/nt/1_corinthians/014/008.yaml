source:
  edition: SBLGNT
  text: καὶ γὰρ ἐὰν ἄδηλον ⸂φωνὴν σάλπιγξ⸃ δῷ, τίς παρασκευάσεται εἰς πόλεμον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/008.yaml
  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: ar
  text: فإن أعطى البوق صوتًا غير واضح[a]، فمن يستعد للقتال[b]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «صوتًا غير متميّز».'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «للحرب».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: فإن
  rationale: تفيد العبارة التعليل والربط بما سبق، و«فإن» تؤدي هذا المعنى بسلاسة في العربية.
- source_word: ἐὰν
  choice: إن
  rationale: تدخل على جملة شرطية افتراضية، وهو ما تؤديه «إن» بوضوح.
- source_word: ἄδηλον
  choice: غير واضح
  rationale: يدل اللفظ على ما لا يتبين أو لا يتميز، و«غير واضح» تعبير عربي طبيعي يحفظ المعنى.
- source_word: φωνὴν
  choice: صوتًا
  rationale: مع البوق تشير الكلمة إلى الصوت الصادر عنه، لا إلى الصوت البشري.
- source_word: σάλπιγξ
  choice: البوق
  rationale: المفرد المعرّف مناسب في العربية للاستعمال التمثيلي العام، ويشير إلى آلة الإشارة العسكرية.
- source_word: δῷ
  choice: أعطى
  rationale: 'يحفظ صورة الفعل اليوناني «يعطي» في تركيب عربي مفهوم: «أعطى البوق صوتًا».'
- source_word: τίς
  choice: فمن
  rationale: استفهام إنكاري مباشر مرتبط بنتيجة الشرط.
- source_word: παρασκευάσεται
  choice: يستعد
  rationale: صيغة الوسط تفيد أن المرء يهيئ نفسه؛ و«يستعد» تنقل هذه الدلالة طبيعيًا.
- source_word: εἰς πόλεμον
  choice: للقتال
  rationale: العبارة حرفيًا «للحرب»، لكن سياق إشارة البوق والاستعداد للمواجهة يجعل «للقتال» أدق وأفصح في هذا الموضع.
