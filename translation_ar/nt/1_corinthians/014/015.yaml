base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: ar
  text: فما العمل إذًا؟ سأصلّي بالروح[a]، ولكنني سأصلّي أيضًا بالعقل[b]؛ وسأرتّل[c] بالروح، ولكنني سأرتّل أيضًا بالعقل.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «في الروح» أو «بواسطة الروح». لا يصرّح اليوناني هل المقصود تحديدًا الروح القدس، أم روح المتكلم البشرية، أم نطق روحي.
    reason: lexical_alternative
  - marker: b
    text: أو «بفهم».
    reason: lexical_alternative
  - marker: c
    text: أو «سأغنّي» أو «سأنشد تسبيحًا».
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: فما العمل إذًا؟
  rationale: يؤدي التعبير هنا وظيفة سؤال بلاغي عن النتيجة العملية لما سبق، وهذه الصياغة عربية واضحة مع الحفاظ على قوة الانتقال الاستنتاجي.
- source_word: προσεύξομαι
  choice: سأصلّي
  rationale: ينقل صيغة المستقبل من προσεύχομαι نقلًا مباشرًا وطبيعيًا، ولا تقتضي الصيغة الوسطى تعبيرًا انعكاسيًا مستقلًا في العربية.
- source_word: τῷ πνεύματι
  choice: بالروح
  rationale: تحفظ الباء الدلالة المحتملة على الوسيلة أو المجال، وتُبقي لفظ «الروح» غير مقيّد، فلا تحسم هل المقصود روح الإنسان أم الروح القدس أم نطقًا روحيًا.
- source_word: τῷ νοΐ
  choice: بالعقل
  rationale: يشير νοῦς إلى ملكة الفهم والتفكير الواعي، و«بالعقل» تحافظ على الموازاة اللفظية مع «بالروح».
- source_word: ψαλῶ
  choice: سأرتّل
  rationale: يفيد الفعل هنا الغناء التعبدي أو إنشاد التسبيح؛ و«أرتّل» موجزة وطبيعية في سياق العبادة، من غير تقييده بمعنى العزف الحرفي.
- source_word: δὲ καὶ
  choice: ولكنني سأ... أيضًا
  rationale: 'تنقل الإضافة المصحوبة بمقابلة خفيفة: ليس النمط الأول وحده، بل الآخر أيضًا.'
theological_decisions:
- issue: مدلول πνεῦμα في المقابلة بين الروح والعقل
  choice: إبقاء «الروح» عامة من غير إضافة «القدس» أو ضمير المتكلم
  alternative: «بالروح القدس» أو «بروحي»
  rationale: النص اليوناني لا يصرّح هنا هل المراد الروح القدس، أم روح المتكلم، أم تعبيرًا روحيًا؛ لذلك تحافظ الصياغة على الغموض الحقيقي والتوتر التفسيري بدل حسمه.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حافظت الصياغة على التوازي الإيقاعي بين الصلاة والترتيل، وبين الروح والعقل، وعلى المقابلة الخفيفة التي تفيدها δὲ καὶ.
