  text: أم خرجت كلمةُ الله من عندكم، أم إليكم وحدكم وصلت؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: أم
  rationale: تؤدي معنى أداة العطف الاستفهامية في سياق توبيخ بلاغي، من غير إضافة لفظ تعجبي غير موجود صراحة في اليونانية.
- source_word: ἀφ’ ὑμῶν
  choice: مِن عندكم
  rationale: تحفظ دلالة المصدر أو المنشأ التي تفيدها ἀπό مع المضاف إليه، وتأتي طبيعية في العربية ضمن السؤال الإنكاري.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: كلمة الله
  rationale: صياغة عربية راسخة تحفظ اتساع العبارة، فلا تحصرها في الإنجيل وحده ولا في قول نبوي داخل الاجتماع.
- source_word: ἐξῆλθεν
  choice: خرجت
  rationale: تنقل الصورة الفعلية المباشرة للفعل ἐξέρχομαι، وتتيح للسياق أن يفيد معنى الصدور أو الابتداء من دون تفسير زائد.
- source_word: εἰς ὑμᾶς μόνους
  choice: إليكم وحدكم
  rationale: تحفظ اتجاه الوصول والتوكيد على الحصر الذي يدل عليه μόνους.
- source_word: κατήντησεν
  choice: وصلت
  rationale: تنقل بوضوح معنى بلوغ المقصد أو الوصول الذي يحمله καταντάω، وتلائم العربية الحديثة الفصيحة.
theological_decisions:
- issue: مدلول «كلمة الله»
  choice: الإبقاء على العبارة العامة «كلمة الله»
  alternative: تفسيرها صراحة بأنها رسالة الإنجيل أو القول النبوي في اجتماع الكنيسة
  rationale: يفيد السياق توبيخ أهل كورنثوس كأنهم مصدر رسالة الله أو المتلقون الوحيدون لها، لكن العبارة نفسها تحتمل نطاقًا أوسع؛ لذلك لم تُحسم دلالتها تفسيرياً في المتن.
translation_notes:
  register: عربية فصحى حديثة، واضحة ومهيبة. استُخدم استفهام إنكاري متوازٍ يحفظ حدّة التوبيخ وبنية السؤالين في الأصل، بلا إدخال تعبيرات طائفية أو تفسيرية.
