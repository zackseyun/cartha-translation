  text: σὺ μὲν γὰρ καλῶς εὐχαριστεῖς, ἀλλ’ ὁ ἕτερος οὐκ οἰκοδομεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: ar
  text: فَإِنَّكَ تُحْسِنُ الشُّكْرَ، لَكِنَّ الآخَرَ لَا يُبْنَى[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: لا يتقوّى.'
    reason: بديل دلالي لعبارة «لا يُبنى» يبيّن المقصود من الاستعارة من غير توسيع تفسيري.
lexical_decisions:
- source_word: σὺ
  choice: أنتَ
  rationale: أُبقي ضمير المخاطب المفرد ظاهرًا للتوكيد الذي يحمله وروده في اليونانية، مع ضبطه للمذكر بحسب سياق الخطاب.
- source_word: μὲν γὰρ
  choice: فإنك أنتَ
  rationale: الفاء و«إنّ» تنقلان القوة التعليلية لـγάρ، وإظهار الضمير المؤكد يمهّد للمقابلة التي تنشئها μέν مع ἀλλά، من غير إثقال العبارة بأداة زائدة.
- source_word: καλῶς
  choice: شكرًا حسنًا
  rationale: نُقل معنى الظرف «على نحو حسن/صحيح» بمفعول مطلق موصوف، وهو تركيب عربي طبيعي يحافظ على تقويم بولس الإيجابي للشكر.
- source_word: εὐχαριστεῖς
  choice: تشكر شكرًا
  rationale: الفعل مضارع خبري لا احتمالي، ويعني هنا تقديم الشكر لله في سياق العبادة الجماعية.
- source_word: ἀλλ’
  choice: ولكن
  rationale: تنقل أداة الاستدراك المقابلة بين حسن شكر المتكلم وعدم انتفاع الآخر.
- source_word: ὁ ἕτερος
  choice: الآخر
  rationale: تعبير موجز وطبيعي يشير إلى الشخص الآخر الحاضر أو السامع، من غير زيادة تفسيرية غير لازمة.
- source_word: οὐκ οἰκοδομεῖται
  choice: لا يُبنى
  rationale: يحافظ المبني للمجهول على صورة البناء البولسية، التي تفيد التقوية والنفع الروحي في الجماعة.
theological_decisions:
- issue: استعارة οἰκοδομέω في سياق اجتماع الجماعة
  choice: لا يُبنى
  alternative: لا يتقوّى روحيًّا
  rationale: أُبقيت استعارة البناء كما في الأصل، مع ترك سعتها الدلالية للنفع والتقوية الروحية بدل حصرها في تفسير عقائدي أضيق.
- issue: طبيعة قول المخاطب للشكر
  choice: تشكر
  alternative: قد تشكر
  rationale: الصيغة اليونانية خبرية في المضارع، فلا تُترجم بما يوحي بمجرد الاحتمال أو الإباحة.
translation_notes:
  register: عربية فصحى واضحة وكريمة النبرة. حافظت الصياغة على خطاب المفرد، وعلى التوكيد والمقابلة، وعلى استعارة البناء البولسية. استُخدم الضبط الجزئي عند مواضع قد يلتبس فيها المبني للمجهول أو جنس المخاطب.
