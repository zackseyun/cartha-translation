  text: εἴτε γλώσσῃ τις λαλεῖ, κατὰ δύο ἢ τὸ πλεῖστον τρεῖς, καὶ ἀνὰ μέρος, καὶ εἷς διερμηνευέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: ar
  text: إن كان أحدٌ يتكلّم بلسان[a]، فليتكلّم اثنان أو ثلاثة على الأكثر، وليكن ذلك بالتتابع، وليترجم واحدٌ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بلغة». يمكن للكلمة اليونانية أن تدل على «لسان» أو «لغة»؛ واختيار «بلسان» يحافظ على اصطلاح بولس في هذا الأصحاح من غير أن يحسم الجدل الأوسع حول طبيعة هذه الموهبة.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: بلسان
  rationale: تحافظ «بلسان» على اللفظ المحوري في حديث بولس عن هذه الموهبة في 1 كورنثوس 12–14، من غير أن تحسم هل المقصود لغة بشرية أم نوعًا آخر من الكلام.
- source_word: τις
  choice: أحدٌ
  rationale: ضمير نكرة ذو معنى عام، وتؤديه «أحد» بصورة طبيعية في الجملة الشرطية.
- source_word: λαλεῖ
  choice: يتكلّم
  rationale: المضارع هنا وارد في شرط عام، وصيغة المضارع العربية تنقل هذا المعنى بوضوح.
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: فليكن المتكلّمون اثنين أو ثلاثة على الأكثر
  rationale: العبارة تحدد عدد المتكلمين، وإظهار «المتكلّمون» يرفع الالتباس في العربية مع بقاء التحديد العددي كما في المصدر.
- source_word: ἀνὰ μέρος
  choice: وليتكلّم كلٌّ منهم بدوره
  rationale: تفيد العبارة التناوب والانفراد بالكلام، لا الكلام المتزامن؛ وإعادة فعل الكلام توضح ذلك طبيعيًا بالعربية.
- source_word: εἷς
  choice: واحدٌ
  rationale: العدد مستعمل استعمال الاسم، أي شخص واحد يتولى الترجمة.
- source_word: διερμηνευέτω
  choice: وليترجم
  rationale: الفعل يطلب نقل الكلام إلى صيغة مفهومة للجماعة. «يترجم» أوضح في العربية المعاصرة، مع بقاء «يفسّر» بديلًا ممكنًا بحسب فهم طبيعة الكلام.
theological_decisions:
- issue: دلالة γλώσσῃ في سياق المواهب الروحية
  choice: «بلسان» في المتن، في إشارة إلى الظاهرة التي يناقشها بولس، من غير تحديد طبيعتها.
  alternative: «بلغة»، أو تفسيرها تحديدًا بأنها كلام وجداني غير مألوف، أو بأنها لغات بشرية أجنبية.
  rationale: الآية تنظّم استعمال الموهبة، لكنها لا تحسم بذاتها الخلاف الأوسع بشأن طبيعة الألسنة؛ لذلك تحافظ «بلسان» على الانفتاح الدلالي والتوتر التفسيري.
- issue: دلالة διερμηνευέτω
  choice: «وليترجم» بوصفها نقلًا يجعل الكلام مفهومًا للجماعة.
  alternative: «وليفسّر» أو «وليشرح».
  rationale: السياق يؤكد أن الكلام ينبغي أن يصير مفهومًا، لكن الفعل لا يقتضي هنا شرحًا عقائديًا؛ لذا اختيرت «يترجم» مع عدم حسم طبيعة اللسان.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدمت صيغة الأمر بلام الأمر لنقل القوة التنظيمية للأفعال، وأُظهر «المتكلّمون» و«كلٌّ منهم» لتجنب الغموض من غير توسع تفسيري.
