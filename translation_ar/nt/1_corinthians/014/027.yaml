  terminology: الإبقاء على «بلسان» مع الحاشية مناسب لحفظ اصطلاح الفصل وعدم حسم طبيعة الظاهرة. و«وليترجم واحد» مقبول في هذا السياق لنقل διερμηνευέτω، ولا يفرض تحديدًا لطبيعة اللسان أكثر مما يفرضه السياق نفسه.
