  source_fidelity: ينقل النص الشرط العام، والحدّ العددي، والتتابع، والأمر بتقديم الترجمة/التفسير بأمانة. لكن صياغة العدد في المسودة تفسيرية قليلًا بإدخال «المتكلّمون» وبناء «فليكن»، بينما يمكن نقل البنية التنظيمية اليونانية مباشرة وبوضوح أكبر.
