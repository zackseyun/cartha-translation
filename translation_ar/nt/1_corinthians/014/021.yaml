source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: ar
  text: 'في الشريعة مكتوب: «بأناسٍ يتكلمون بلغاتٍ أخرى، وبشفاه غرباء، سأتكلم إلى هذا الشعب[a]، وحتى بهذه الطريقة لن يصغوا إليّ[b]»[c]، يقول الرب[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بألسنةٍ أخرى وبشفاه آخرين».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لن يستجيبوا لي».'
    reason: lexical_alternative
  - marker: c
    text: يردّد الاقتباس هنا صدى إشعياء 28:11–12.
    reason: cross_reference
  - marker: d
    text: لأن المتكلم في اقتباس إشعياء هو إله إسرائيل، فإن خلفية الاقتباس العبرية تتضمن اسم الله؛ لذلك تستخدم بعض الترجمات معالجةً طباعية مميزة للفظ «الرب».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: في الشريعة
  rationale: يحافظ على التعبير الاصطلاحي الذي يقدّم اقتباسًا من الأسفار المقدسة، مع أن الاقتباس من إشعياء لا من أسفار موسى الخمسة وحدها.
- source_word: γέγραπται
  choice: مكتوب
  rationale: الصيغة العربية المألوفة والمباشرة لعبارة الاستشهاد الكتابي، وتحفظ دلالة اليونانية على نص ثابت مكتوب.
- source_word: ἐν ἑτερογλώσσοις
  choice: بأناسٍ ذوي ألسنةٍ أخرى
  rationale: يفهم الوصف اليوناني على أنه يشير إلى متكلمين بلغات أخرى، ويعبّر حرف الجر «بـ» عن الوسيلة، مع إبقاء الصلة بموضوع الألسنة في السياق.
- source_word: ἐν χείλεσιν ἑτέρων
  choice: وبشفاه غرباء
  rationale: يحفظ صورة «الشفاه»، ويفهم «آخرين» بحسب سياق الاقتباس على أنهم غرباء في اللغة أو القوم.
- source_word: λαλήσω
  choice: سأكلّم
  rationale: فعل عربي طبيعي يتعدى إلى الشعب ويحفظ صيغة المستقبل ودلالة الخطاب الموجّه إليهم.
- source_word: τῷ λαῷ τούτῳ
  choice: هذا الشعب
  rationale: «الشعب» هو المقابل الطبيعي لـλαός، ولا سيما في سياق كلام الله إلى شعبه.
- source_word: οὐδ’ οὕτως
  choice: وحتى بهذه الطريقة لن
  rationale: 'يحفظ التشديد: لن تكون الاستجابة حتى عند استعمال هذه الوسيلة غير المعتادة.'
- source_word: εἰσακούσονταί μου
  choice: يصغوا إليّ
  rationale: ينقل معنى السماع باهتمام والاستجابة، دون أن يحصره في مجرد وصول الصوت إلى الأذن.
- source_word: λέγει κύριος
  choice: يقول الرب
  rationale: ترجمة مباشرة لصيغة الاقتباس في اليونانية، مع إبقاء κύριος «الرب» في النص الرئيس.
theological_decisions:
- issue: دلالة «الشريعة» مع كون الاقتباس من إشعياء
  choice: في الشريعة
  alternative: في الأسفار المقدسة
  rationale: استعمال νόμος هنا أوسع من أسفار موسى، لكن ترجمة اللفظ نفسه بـ«الشريعة» تحفظ طريقة بولس في الإشارة إلى النص الكتابي ولا تستبدل به تفسيرًا.
- issue: هوية المتكلم في λέγει κύριος وخلفية اسم الله في إشعياء
  choice: يقول الرب
  alternative: يقول الرَّبّ بصياغة طباعية تشير إلى اسم يهوه
  rationale: النص اليوناني يقرأ κύριος، ولذلك يبقى «الرب» في المتن؛ أما خلفية الاقتباس العبرية فيمكن بيانها في الحاشية بلا إحلال قراءة عبرية محل النص اليوناني.
- issue: مدى الاستجابة المقصودة في εἰσακούσονταί μου
  choice: يصغوا إليّ
  alternative: يطيعوني
  rationale: «يصغوا» يحفظ مجال السماع والاستجابة معًا، ولا يحسم الدلالة في الطاعة وحدها.
translation_notes:
  register: لغة عربية فصحى حديثة واضحة ووقورة. حُفظت صورة «الألسنة» و«الشفاه» لما لها من أهمية في سياق الأصحاح، مع استعمال «يصغوا» بدل تعبير قديم أو شديد التفسير. وُضعت جميع علامات الحواشي في المتن.
