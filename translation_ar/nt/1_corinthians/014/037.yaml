  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: ar
  text: إن كان أحد يظن نفسه نبيًّا أو إنسانًا روحيًّا، فليُدرك أن ما أكتبه إليكم هو من الرب[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا أن تُترجم: «هو للرب»، أو بحسب المعنى في السياق: «هو وصية من الرب». واليونانية موجزة، وحرفيًّا: «هو للرب/من الرب».'
    reason: توضيح بدائل ترجمة العبارة اليونانية الموجزة κυρίου ἐστίν من غير حسم ما تُقدّره من محذوف.
lexical_decisions:
- source_word: δοκεῖ
  choice: يظن نفسه
  rationale: ينقل معنى التقييم أو الادعاء الذاتي في السياق، ويحافظ على النبرة التصحيحية المحتملة.
- source_word: προφήτης
  choice: نبيًّا
  rationale: المقابل العربي المعياري، وهو واضح في سياق النبوة والمواهب الروحية.
- source_word: πνευματικός
  choice: إنسانًا روحيًّا
  rationale: يحافظ على اتساع الصفة اليونانية، من غير حصرها صراحة في امتلاك موهبة بعينها؛ وإضافة «إنسانًا» تجعل التركيب طبيعيًّا وواضحًا بالعربية.
- source_word: ἐπιγινωσκέτω
  choice: فليُدرك
  rationale: ينقل صيغة الأمر الداعية إلى الاعتراف الواعي بحقيقة سلطان ما يكتبه بولس.
- source_word: ἃ γράφω ὑμῖν
  choice: ما أكتبه إليكم
  rationale: صياغة عربية طبيعية وأمينة للموصول والفعل المضارع في سياق الرسالة.
- source_word: κυρίου ἐστίν
  choice: هو من الرب
  rationale: يحافظ على إيجاز العبارة اليونانية واحتمالها الدلالي، ويعبّر طبيعيًّا عن المصدر والسلطان من غير إدخال اسم «وصية» غير المذكور صراحة.
theological_decisions:
- issue: دلالة العبارة الموجزة κυρίου ἐστίν
  choice: هو من الرب
  alternative: 'هو وصية من الرب؛ أو: هو للرب'
  rationale: النص اليوناني يقول حرفيًّا ما يقارب «هو للرب/من الرب» ولا يذكر اسم «وصية». والسياق يؤيد معنى السلطان الإلهي، لكن إبقاء العبارة موجزة يصون الالتباس الحقيقي بدل حسمه داخل المتن.
- issue: صيغة المذكر في τις ... προφήτης ... πνευματικός
  choice: أحد ... نفسه نبيًّا أو إنسانًا روحيًّا
  alternative: أي شخص يَعُدّ ذاته من أصحاب النبوة أو الروحانية
  rationale: يحافظ الاختيار على صيغة المفرد الواردة في اليونانية وعلى الطبيعة العامة للشرط، مع أسلوب عربي فصيح طبيعي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «إنسانًا روحيًّا» لتجنب غموض الصفة المفردة في العربية، وأُبقيت خاتمة الآية موجزة حفاظًا على توتر الأصل الدلالي.
