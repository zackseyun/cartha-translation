  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: ar
  text: فإذًا، يا إخوتي[a]، تشوَّقوا إلى أن تتنبأوا، ولا تمنعوا التكلم بألسنة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «يا إخوتي وأخواتي»؛ اللفظ اليوناني هو «إخوة»، وقد يُستعمل هنا خطابًا شاملًا للجماعة كلها.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: فإذًا
  rationale: أداة استنتاج تلخّص ما سبق وتبني عليه؛ و«فإذًا» تؤدي قوة النتيجة بوضوح في العربية.
- source_word: ἀδελφοί μου
  choice: يا إخوتي
  rationale: نداء لجمع مذكر مع ضمير المتكلم. تحافظ «يا إخوتي» على الصيغة اليونانية الطبيعية، مع بيان احتمال شمول الجماعة كلها في الحاشية.
- source_word: ζηλοῦτε
  choice: تشوَّقوا
  rationale: فعل أمر مضارع يفيد الحرص والرغبة الجادة المستمرة؛ و«تشوَّقوا» تعبير عربي واضح وإيجابي من غير مبالغة تفسيرية.
- source_word: τὸ προφητεύειν
  choice: أن تتنبأوا
  rationale: مصدر مؤول واقع مفعولًا للحث؛ وصيغة «أن تتنبأوا» طبيعية في العربية وتحفظ المعنى الفعلي.
- source_word: μὴ κωλύετε
  choice: لا تمنعوا
  rationale: نهي مباشر؛ و«لا تمنعوا» يقابل المعنى الأساسي للفعل κωλύω ويحفظ قوة التوجيه.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: التكلم بألسنة
  rationale: يشير إلى الممارسة التي يناقشها الأصحاح. «التكلم بألسنة» صياغة عربية مألوفة وتحافظ على لفظ γλώσσαις من دون تحديد طبيعة الألسنة تفسيرًا.
theological_decisions:
- issue: دلالة النداء ἀδελφοί في سياق جماعة تضم رجالًا ونساءً
  choice: يا إخوتي
  alternative: يا إخوتي وأخواتي
  rationale: الصيغة اليونانية جمع مذكر، ويحتمل أن تكون شاملة للجماعة كلها على نحو تمثيلي. يحافظ المتن على الصيغة الظاهرة، وتوضح الحاشية احتمال الشمول من غير حسم زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. اختيرت صياغة مباشرة تحافظ على توازن الآية بين الحث على النبوة وعدم منع التكلم بألسنة، مع إبقاء احتمال شمول النداء للجنسين في الحاشية.
