theological_decisions:
- issue: دلالة «أرواح الأنبياء» وعلاقتها بضبط النبوة
  choice: الإبقاء على العبارة الحرفية «أرواح الأنبياء» مع الإشارة في الحاشية إلى احتمال الدوافع أو النشاط الروحي المرتبط بالأنبياء.
  alternative: تفسيرها في المتن بأنها الدوافع النبوية التي يضبطها الأنبياء، أو بأنها أرواح الأنبياء البشرية الخاضعة لأنبياء آخرين.
  rationale: السياق يتعلق بالنظام في ممارسة النبوة، لكن العبارة نفسها تحتمل أكثر من تحديد؛ لذلك لا ينبغي حسم التوتر التفسيري داخل المتن.
