  to: فإن اجتمعت الكنيسة كلها في مكان واحد، وكان الجميع يتكلمون بألسنة[a]، ودخل أناس غير مطَّلعين[b] أو غير مؤمنين، أفلا يقولون إنكم فاقدو صوابكم؟
  rationale: استُبدلت «فإذا» بـ«فإن» لإبراز الشرط الذي في الأصل اليوناني. ولم يُغيَّر سائر النص أو الحواشي لأنهما ينقلان المعنى، ويحافظان على التمييز المعجمي وعلى الانفتاح التفسيري في «ألسنة».
