  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: ar
  text: فإن اجتمعت الكنيسة كلها في مكان واحد، وكان الجميع يتكلمون بألسنة[a]، ودخل أناس غير مطَّلعين[b] أو غير مؤمنين، أفلا يقولون إنكم فاقدو صوابكم؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بلغات». يمكن أن يعني اللفظ اليوناني «لغات»، لكن «بألسنة» يحفظ التعبير المألوف في هذا السياق من غير أن يحسم طبيعة الظاهرة موضع النقاش.
    reason: alternative_reading
  - marker: b
    text: 'أي أناس غير عارفين أو غير مهيَّئين لفهم ما يجري في اجتماع الكنيسة؛ ويمكن ترجمتها: «غرباء عن هذه الأمور». ويميّزهم النص هنا من «غير المؤمنين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: فإذا
  rationale: تنقل الاستنتاج المرتبط بما سبق، وتنسجم طبيعيًّا مع جملة الشرط التالية من غير إثقال الأسلوب.
- source_word: συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτό
  choice: اجتمعت الكنيسة كلها في مكان واحد
  rationale: تحفظ معنى اجتماع الجماعة كلها، كما تُبقي الدلالة المكانية للعبارة ἐπὶ τὸ αὐτό.
- source_word: λαλῶσιν γλώσσαις
  choice: يتكلمون بألسنة
  rationale: «ألسنة» هي العبارة العربية الراسخة في هذا السياق، وتحفظ الانفتاح الدلالي للفظ اليوناني من غير حسم طبيعة الظاهرة بأنها لغات بشرية معروفة أو غير ذلك.
- source_word: ἰδιῶται
  choice: أناس غير مطَّلعين
  rationale: يدل اللفظ هنا على أشخاص غير عارفين بممارسات الجماعة أو غير مهيَّئين لفهمها، مع إبقاء التمييز بينهم وبين غير المؤمنين.
- source_word: ἄπιστοι
  choice: غير مؤمنين
  rationale: مقابل عربي مباشر ومألوف، ويحفظ تمييز بولس بين هذه الفئة وبين غير المطَّلعين.
- source_word: οὐκ ἐροῦσιν ὅτι μαίνεσθε
  choice: أفلا يقولون إنكم فاقدو صوابكم؟
  rationale: تحفظ صيغة السؤال البلاغي الذي يتوقع جوابًا بالإيجاب، وتنقل اتهامهم للمجتمعين بالجنون بعبارة عربية واضحة وغير عامية.
theological_decisions:
- issue: طبيعة γλώσσαι في 1 كورنثوس 14
  choice: ألسنة
  alternative: لغات
  rationale: يمكن أن يعني اللفظ اليوناني «لغات»، لكن «ألسنة» تحفظ التعبير المألوف في هذا السياق ولا تحسم الخلاف بشأن طبيعة ظاهرة الكلام المقصودة.
translation_notes:
  register: العربية فصحى معاصرة، واضحة ووقورة. استُخدمت «الكنيسة» للدلالة على الجماعة المسيحية المجتمعة، و«فاقدو صوابكم» لنقل قوة μαίνεσθε بعبارة مفهومة من غير عامية أو تعبير جارح زائد.
