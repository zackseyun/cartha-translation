review_pass:
  verdict: revise
  source_fidelity: المعنى منقول بأمانة عامة، بما في ذلك اجتماع الكنيسة كلها، والكلام بألسنة، والتمييز بين ἰδιῶται وἄπιστοι، والاستفهام البلاغي الختامي. لكن «فإذا» تميل في الاستعمال العربي إلى الظرفية الزمنية («حينما») أكثر من الشرط الاحتمالي الذي تؤديه ἐὰν؛ لذلك «فإن» أدق هنا.
  naturalness: الصياغة فصيحة وواضحة. «إنكم فاقدو صوابكم» سليمة، وإن كانت «فقدتم صوابكم» أكثر تداولًا؛ ولا تستلزم هذه الملاحظة تغييرًا. واستبقاء «وكان الجميع يتكلمون» طبيعي في أسلوب الشرط العربي.
  terminology: «الكنيسة»، و«يتكلمون بألسنة»، و«غير مؤمنين» اختيارات مناسبة وثابتة في العربية المسيحية المعاصرة. وتحافظ «بألسنة» على عدم حسم طبيعة γλώσσαι. و«غير مطَّلعين» مقبول لـἰδιῶται في ضوء الإيضاح الحاشي الذي يميزهم من غير المؤمنين.
  issues:
