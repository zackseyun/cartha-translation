  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: ar
  text: لِتَصْمُتِ النساء[a] في الكنائس، لأنَّه لا يُسمَحُ لهنَّ أن يتكلَّمن[b]، بل لِيَخضَعْنَ، كما تقول الشريعةُ أيضًا[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لِتَصْمُتِ الزوجاتُ في الكنائس»؛ فاللفظة اليونانية يمكن أن تعني «المرأة» أو «الزوجة» بحسب السياق.'
    reason: alternative_reading
  - marker: b
    text: لا تحدد الآية نفسها نوع الكلام المقصود؛ ويفهمه بعضهم فهمًا أضيق في ضوء السياق المحيط.
    reason: lexical_alternative
  - marker: c
    text: قد يُراد بـ«الشريعة» شريعة موسى تحديدًا، أو الكتاب المقدس بمعنى أوسع.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: النِّساء
  rationale: اللفظة اليونانية قد تعني «النساء» أو «الزوجات» بحسب السياق. ولأن الآية لا تذكر أزواجًا صراحةً، اختير المعنى الأوسع في المتن، مع إثبات البديل في الحاشية.
- source_word: ἐκκλησίαις
  choice: الكنائس
  rationale: تشير اللفظة في الاستعمال البولسي هنا إلى جماعات المؤمنين المجتمعة، و«الكنائس» تعبير عربي طبيعي يحفظ هذا المعنى.
- source_word: σιγάτωσαν
  choice: لِتَصْمُتْ
  rationale: صيغة الأمر تدعو إلى الصمت في السياق المذكور، وتحافظ هذه الصياغة على قوة الفعل واتساقه مع استعمال اللفظة نفسها في هذا الأصحاح.
- source_word: ἐπιτρέπεται
  choice: لا يُسمَحُ لهنَّ
  rationale: يحفظ المبني للمجهول معنى عدم الإذن بعبارة عربية واضحة وطبيعية.
- source_word: λαλεῖν
  choice: أن يتكلَّمن
  rationale: الفعل عام الدلالة على الكلام؛ لذلك لم يُضيَّق نوع الكلام في المتن.
- source_word: ὑποτασσέσθωσαν
  choice: لِيَخضَعْنَ
  rationale: تنقل صيغة الأمر الدالة على الخضوع دون إضافة جهة للخضوع لا يذكرها نص الآية.
- source_word: νόμος
  choice: الشريعة
  rationale: '«الشريعة» هي المقابل العربي الطبيعي هنا، مع إبقاء مرجعها الدقيق مفتوحًا في الحاشية: أهو شريعة موسى تحديدًا أم الكتاب المقدس بمعنى أوسع.'
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: كما تقول الشريعةُ أيضًا
  rationale: تحفظ العبارة قوة المقارنة في καθὼς ودلالة الإضافة في καί بترتيب عربي فصيح.
theological_decisions:
- issue: مرجع γυναῖκες
  choice: النساء في الكنائس
  alternative: الزوجات في الكنائس
  rationale: يجوز لغويًا كلا المعنيين، لكن الآية نفسها لا تذكر الأزواج، فاختير الأعم في المتن وأُثبت الأضيق في الحاشية.
- issue: نطاق المنع من الكلام
  choice: إبقاء «أن يتكلمن» عامةً كما في اليونانية
  alternative: قصره على الكلام المشوِّش أو على تقويم النبوءات
  rationale: لا تحدد الآية نفسها نوع الكلام المقصود، ولذلك لا يضيف المتن قيدًا تفسيريًا مختلفًا فيه.
- issue: مرجع ὁ νόμος
  choice: الشريعة دون تعيين المرجع بدقة
  alternative: شريعة موسى تحديدًا، أو الكتاب المقدس بمعنى أوسع
  rationale: المرجع المقصود موضع نقاش، فحُفظ الاحتمالان بدل حسمهما في المتن.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت لام الأمر لنقل صيغتي الأمر اليونانيتين، وتُركت مواطن الغموض المتعلقة بالنساء أو الزوجات، ونوع الكلام، ومرجع الشريعة دون حسم تفسيري.
