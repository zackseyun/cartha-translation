lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: هكذا أنتم أيضًا
  rationale: يحافظ على الصلة بالمثال السابق وعلى توجيه الخطاب مباشرة إلى المخاطَبين، بصياغة عربية موجزة وطبيعية.
- source_word: διὰ τῆς γλώσσης
  choice: باللسان
  rationale: يحفظ الصورة الحسية في اليونانية، ويؤدي معنى الوسيلة بصورة عربية مألوفة من غير تفسير اللفظة مباشرة بأنها «لغة».
- source_word: εὔσημον λόγον
  choice: كلامًا واضح الدلالة
  rationale: ينقل معنى الكلام الذي له علامة بيّنة، فيسهل تمييزه وفهمه؛ كما يحفظ جانب الوضوح والتميّز بدل قصر العبارة على مجرد الفهم.
- source_word: δῶτε
  choice: تُخرِجوا
  rationale: المعنى السياقي هو إصدار الكلام باللسان. و«تُخرِجوا» عربية طبيعية مع الكلام وتحفظ صورة إنتاج القول، في حين أن النقل الحرفي «تعطوا كلامًا» أقل سلاسة.
- source_word: πῶς γνωσθήσεται
  choice: فكيف يُعرَف
  rationale: يحافظ على الدلالة الأساسية للفعل المبني للمجهول وعلى شيء من اتساعه، مع كون المقصود في السياق معرفة الكلام وفهمه.
- source_word: τὸ λαλούμενον
  choice: ما يُقال
  rationale: صياغة عربية طبيعية للاسم الموصول المتضمن في اسم المفعول اليوناني، وتحفظ المبني للمجهول.
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: فإنكم ستكونون كمن يتكلم في الهواء
  rationale: يحفظ صورة الكلام المتجه إلى الهواء، ويعبّر طبيعيًا عن نتيجته العبثية من غير حذف الاستعارة.
