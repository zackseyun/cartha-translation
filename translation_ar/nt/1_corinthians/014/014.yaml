  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: ar
  text: فَإِنْ صَلَّيْتُ بِلِسَانٍ[a]، فَرُوحِي تُصَلِّي، أَمَّا ذِهْنِي فَغَيْرُ مُثْمِرٍ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بلغة». يمكن للكلمة اليونانية أن تعني لغة بشرية، أو «لسانًا» بالمعنى المستعمل في هذا الأصحاح للكلام بألسنة.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أمّا فهمي فلا يُثمر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: لأَنِّي إِنْ
  rationale: تنقل «لأن» قوة γάρ التفسيرية الرابطة بالسياق، وتنقل «إن» أداة الشرط ἐάν بصياغة عربية طبيعية.
- source_word: προσεύχωμαι
  choice: صَلَّيْتُ
  rationale: الفعل المضارع الالتزامي بعد ἐάν يقع في جملة شرطية؛ والماضي العربي بعد «إن» هو الأسلوب الفصيح الطبيعي للدلالة على الشرط من غير جعله حدثًا ماضيًا.
- source_word: γλώσσῃ
  choice: بِلِسَانٍ
  rationale: يحافظ «بلسان» على المفرد وعلى التعبير المتكرر في هذا الأصحاح، مع إبقاء احتمال أن يكون المراد لغةً قائمًا في الحاشية.
- source_word: τὸ πνεῦμά μου
  choice: رُوحِي
  rationale: ترجمة مباشرة للضمير والاسم، وتحفظ المقابلة بين روح المتكلم وذهنه من غير إضافة تفسيرية.
- source_word: προσεύχεται
  choice: تُصَلِّي
  rationale: المضارع العربي ينقل الفعل اليوناني الحاضر بوضوح وطبيعية.
- source_word: ὁ δὲ νοῦς μου
  choice: أَمَّا ذِهْنِي
  rationale: «ذهني» هو المقابل المباشر الواسع لـ νοῦς، و«أما» تُبرز المقابلة مع «روحي» بصورة عربية سليمة.
- source_word: ἄκαρπός ἐστιν
  choice: فَغَيْرُ مُثْمِرٍ
  rationale: يحافظ التعبير على صورة الثمر في الصفة اليونانية ἄκαρπος، بدل تفسيرها بعبارة مثل «لا ينتفع» أو «لا يفيد».
theological_decisions:
- issue: مرجع «روحي» (τὸ πνεῦμά μου)
  choice: روح المتكلم نفسه
  alternative: الروح القدس العامل في المتكلم
  rationale: ضمير الملكية «ـي» والمقابلة مع «ذهني» يرجحان الإشارة إلى روح المتكلم. ومع ذلك، تلتزم الترجمة لفظ «روحي» ولا تضيف ما يحسم كيفية صلة الروح القدس بهذه الصلاة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعمل «بلسان» للمحافظة على مصطلح الأصحاح وعلى المفرد اليوناني، و«غير مثمر» للإبقاء على الاستعارة الأصلية. وُضع قدر محدود من الضبط لتيسير القراءة ومنع الالتباس.
