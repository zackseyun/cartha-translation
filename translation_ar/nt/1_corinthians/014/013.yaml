lexical_decisions:
- source_word: Διὸ
  choice: لذلك
  rationale: أداة استنتاج تربط الوصية بما سبق، و«لذلك» واضحة وطبيعية وتحفظ قوة الاستدلال.
- source_word: ὁ λαλῶν
  choice: مَن يتكلّم
  rationale: اسم فاعل مع أداة تعريف مستعمل استعمالًا اسميًا للدلالة العامة؛ وهذه الصياغة العربية تحافظ على الإفراد والمعنى العام والفعل المستمر من غير تقييده بالذكور.
- source_word: γλώσσῃ
  choice: بلسان
  rationale: يحفظ صورة اللفظ اليوناني المفرد والاستعمال المتكرر في هذا الإصحاح لكلام يحتاج إلى ترجمة، من غير حسم طبيعته أهو لغة بشرية أم نوع آخر من الكلام.
- source_word: προσευχέσθω
  choice: عليه أن يصلّي
  rationale: فعل أمر للغائب في المضارع؛ تنقل الصياغة قوة الحث والتكليف بلغة عربية معاصرة واضحة.
- source_word: ἵνα
  choice: لكي
  rationale: تفيد الغاية، وقد تحتمل أيضًا مضمون الصلاة؛ و«لكي» تُظهر الوجه الغائي الطبيعي في السياق.
- source_word: διερμηνεύῃ
  choice: يترجم
  rationale: يدل الفعل في سياق الإصحاح على نقل الكلام بحيث يصير مفهومًا للسامعين؛ و«يترجم» أدق من «يفسّر»، التي قد توحي بشرح المعنى لا بنقل الكلام.
theological_decisions:
- issue: المفرد المذكر اليوناني بوصفه تعبيرًا عامًا
  choice: مَن يتكلّم ... يترجم
  alternative: الذي يتكلّم ... يترجم
  rationale: «مَن» في العربية عامة بطبيعتها وتشمل كل شخص من غير تحويل المفرد إلى جمع، مع بقاء الفعل مفردًا وفق البنية اليونانية.
- issue: دلالة γλώσσῃ في سياق 1 كورنثوس 12–14
  choice: بلسان
  alternative: بلغة
  rationale: «لسان» يحفظ المصطلح والصورة الأدبية في الإصحاح، ولا يحسم الجدل بشأن كون الظاهرة لغة بشرية معروفة أو كلامًا من نوع آخر يحتاج إلى ترجمة.
- issue: وظيفة ἵνα مع διερμηνεύῃ
  choice: لكي يترجم
  alternative: أن يترجم
  rationale: النص يمكن أن يُسمع بوصفه غاية للصلاة أو مضمونًا لها؛ اختيرت صياغة الغاية لأنها الأقرب إلى البنية، من دون إضافة فاعل أو مفعول غير مذكور.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدمت «على مَن ... أن» لنقل الأمر للغائب بصورة طبيعية، و«بلسان» للمحافظة على المصطلح البولسي والغموض الحقيقي في طبيعة الكلام.
