source:
  edition: SBLGNT
  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: ar
  text: أيها الإخوة[a]، لا تصيروا أطفالًا في تفكيركم، بل كونوا رُضَّعًا في الشر[b]، وأما في تفكيركم فصيروا ناضجين.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أيها الإخوة والأخوات»؛ يستعمل اليوناني جمع المذكر «الإخوة» في مخاطبة جماعة المؤمنين.
    reason: lexical_alternative
  - marker: b
    text: أو «الخبث»؛ فقد تدل الكلمة اليونانية κακία على الشر أو السوء أو الخبث.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: أيها الإخوة
  rationale: صيغة نداء لجمع ἀδελφός. تحافظ «أيها الإخوة» على الصيغة المذكرة في الأصل، مع بيان شمول الخطاب لجماعة المؤمنين في الحاشية.
- source_word: παιδία
  choice: أطفالًا
  rationale: تدل الكلمة على الأطفال عمومًا، وتلائم المقابلة البلاغية مع «رُضَّعًا» و«ناضجين» من غير تحديد زائد للعمر.
- source_word: γίνεσθε
  choice: لا تصيروا / فصيروا
  rationale: يحافظ فعل «صار» على معنى التحول أو الصيرورة في فعلي الأمر، وعلى التوازي بين أول الآية وآخرها.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: في تفكيركم
  rationale: تشير φρήν هنا إلى ملكة الفهم والتفكير. والعبارة العربية طبيعية وتحافظ على التكرار المقصود في النص.
- source_word: τῇ κακίᾳ
  choice: في الشر
  rationale: يمكن أن تدل κακία على الشر أو السوء أو الخبث. اختير «الشر» لأنه يحفظ المجال الأخلاقي العام، مع إثبات البديل الأضيق في الحاشية.
- source_word: νηπιάζετε
  choice: كونوا رُضَّعًا
  rationale: يفيد الفعل أن يكون المرء رضيعًا أو يتصرف كالرضيع. وتحفظ الصياغة التباين المقصود بين الأطفال والرُّضَّع والناضجين.
- source_word: τέλειοι
  choice: ناضجين
  rationale: يدل τέλειος في هذا السياق على اكتمال النمو والنضج، لا على الكمال المطلق أو العصمة من الخطأ.
- source_word: ἀλλὰ ... δὲ
  choice: بل ... وأما ... فـ
  rationale: تنقل هذه الصياغة حركتي المقابلة والتدرج في الأصل، وتأتي عربية واضحة وسليمة.
theological_decisions:
- issue: صيغة النداء المذكرة الموجهة إلى الجماعة
  choice: إبقاء «أيها الإخوة» في المتن، مع توضيح شمولها للإخوة والأخوات في الحاشية.
  alternative: أيها الإخوة والأخوات
  rationale: الأصل اليوناني يستعمل جمع المذكر «إخوة»، ويرجح أن الخطاب يشمل الكنيسة كلها. إبقاء الصيغة في المتن يصون ملامح الأصل، والحاشية توضح قوة الاستعمال السياقية من غير تسوية الفرق اللفظي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حُفظ التوازي بين «في تفكيركم» في طرفي الآية، كما حُفظ الفرق المقصود بين «أطفالًا» و«رُضَّعًا». استُعملت «ناضجين» بدل «كاملين» منعًا لإيحاء الكمال المطلق الذي لا يقتضيه السياق.
