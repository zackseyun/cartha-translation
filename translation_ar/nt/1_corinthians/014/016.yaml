  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: ar
  text: 'وإلّا، فإن كنتَ تبارك بالروح[b]، فكيف يقول مَن يشغل مكان غير المتعلِّم[a]: «آمين» عند تقديمك الشكر[c]، وهو لا يعرف ما تقول؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غير المختص»، أو «العامّي»، أو «غير العارف».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «في الروح»؛ لا يفرض اليوناني هنا تفسيرًا أكثر تحديدًا.'
    reason: alternative_reading
  - marker: c
    text: المقصود هنا تقديم الشكر، وليس بالضرورة المصطلح التقني اللاحق «الإفخارستيا».
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: وإلّا، فإن كنتَ
  rationale: تنقل القوة الاستدراكية الشرطية المرتبطة بالسياق السابق، بدل الاكتفاء بشرط مجرد.
- source_word: εὐλογῇς
  choice: تبارك
  rationale: تحافظ على الدلالة الأساسية للفعل، أي النطق بالبركة أو الحمد في العبادة.
- source_word: πνεύματι
  choice: بالروح
  rationale: الباء العربية تستوعب معنى المصاحبة أو الوسيلة، من غير حسم هل المقصود روح الإنسان أم كلام ممكَّن بالروح.
- source_word: ὁ ἀναπληρῶν τὸν τόπον
  choice: مَن يشغل مكان
  rationale: صياغة عربية طبيعية تحافظ على صورة شغل الموضع أو الموقع في الجماعة.
- source_word: τοῦ ἰδιώτου
  choice: غير المتعلِّم
  rationale: يشير السياق إلى شخص لا يملك المعرفة اللازمة لفهم القول، مع بقاء بدائل معجمية ممكنة مذكورة في الحاشية.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: فكيف يقول ... «آمين»
  rationale: يحفظ لفظ الاستجابة الجماعية المعروف، ويؤدي السؤال الإنكاري بوضوح.
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: على شكرك
  rationale: يفيد الاستجابة بالموافقة على تقديم الشكر، ولا يحوّل اللفظة إلى مصطلح طقسي تقني متأخر.
- source_word: ἐπειδὴ τί λέγεις οὐκ οἶδεν
  choice: وهو لا يعرف ما تقول
  rationale: ينقل سبب تعذّر قول «آمين» بصياغة مباشرة، مع إبقاء «يعرف» قريبًا من οἶδεν.
theological_decisions:
- issue: مدلول πνεύματι في سياق العبادة
  choice: بالروح
  alternative: بروحك؛ أو بروح الله
  rationale: النص اليوناني لا يحسم وحده مرجع الروح، لذلك تُرك التعبير عامًا من غير فرض تفسير عقائدي خاص.
- issue: مدلول εὐχαριστίᾳ
  choice: شكرك
  alternative: الإفخارستيا
  rationale: السياق يتناول فعل تقديم الشكر المسموع الذي تستجيب له الجماعة، ولا يقتضي المصطلح الأسراري اللاحق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم «يشغل مكان» لصون صورة الأصل مع تجنب الحرفية الثقيلة، ووُضعت «آمين» بين علامتي اقتباس لأنها استجابة منطوقة. جميع علامات الحواشي واردة في المتن.
