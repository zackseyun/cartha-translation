  source_fidelity: 'يلزم تعديلان صغيران لتحقيق دقة أقرب للنص اليوناني: «فماذا نقول إذًا» يضيف فعل «نقول» غير موجود في Τί οὖν ἐστιν، وتكرار «أو» يجعل عناصر القائمة بدائل متنافية، مع أن النص يسرد ما قد يكون لدى كل واحد. كما أن «تفسير» لـ ἑρμηνεία يحفظ سعة اللفظ اليوناني أفضل من «ترجمة» وحدها.'
