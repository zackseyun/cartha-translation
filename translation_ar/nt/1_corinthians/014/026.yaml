  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: ar
  text: فما الأمر إذًا، أيها الإخوة[a]؟ حين تجتمعون، يكون لدى كل واحد مزمور، وتعليم، وإعلان، ولسان[b]، وتفسير. فليكن كل شيء للبنيان.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: لفظ «الإخوة» هنا يخاطب جماعة المؤمنين خطابًا تمثيليًا، فيشمل النساء والرجال.
    reason: lexical_alternative
  - marker: b
    text: أو «لغة». يمكن للكلمة اليونانية أن تعني اللسان أو اللغة؛ وقد استُعمل «لسان» هنا للمحافظة على مصطلح بولس في هذا النقاش.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: فماذا نقول إذًا
  rationale: صياغة عربية طبيعية تؤدي وظيفة السؤال البلاغي الذي ينقل الكلام إلى الخلاصة العملية، من غير التزام بحرفية ثقيلة مثل «فما هو إذًا؟».
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: يحافظ على صيغة الجمع المذكر في اليونانية بوصفها خطابًا تمثيليًا للجماعة، مع توضيح شمول النساء في الحاشية.
- source_word: ὅταν συνέρχησθε
  choice: حين تجتمعون
  rationale: تعبير عربي واضح عن اجتماع الجماعة المتكرر، ويحفظ الدلالة الزمنية من غير حشو.
- source_word: ἕκαστος ... ἔχει
  choice: يكون لدى كل واحد
  rationale: ينقل القوة التوزيعية للفظ ويعرض مساهمة كل فرد بعبارة عربية سليمة.
- source_word: ψαλμὸν
  choice: مزمور
  rationale: يحافظ على اللفظ المحدد بدل توسيعه إلى «ترنيمة» أو «نشيد».
- source_word: διδαχὴν
  choice: تعليم
  rationale: واضح وملائم لمساهمة تُقدَّم في اجتماع الجماعة، وأقل إيحاءً بالتنظير المذهبي من «عقيدة».
- source_word: ἀποκάλυψιν
  choice: إعلان
  rationale: ينقل معنى الكشف أو الإفصاح الموحى به في الاجتماع، بلفظ عربي مفهوم في هذا السياق.
- source_word: γλῶσσαν
  choice: لسان
  rationale: يحفظ مصطلح بولس والنطاق الدلالي الذي قد يشير إلى لسان أو لغة، من غير حسم طبيعة الظاهرة.
- source_word: ἑρμηνείαν
  choice: ترجمة
  rationale: في سياق الكلام بلسان، تدل على نقل معناه إلى ما تفهمه الجماعة؛ وهي هنا أدق من «تفسير» الذي قد يوحي بالشرح التفسيري.
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: فليكن كل شيء للبنيان
  rationale: يحفظ صورة البناء المجازية والشمول والأمر، بصياغة عربية موجزة وطبيعية.
theological_decisions:
- issue: الخطاب بصيغة المذكر التمثيلية
  choice: الإبقاء على «أيها الإخوة» في المتن مع حاشية توضح شمول الخطاب
  alternative: «أيها الإخوة والأخوات»
  rationale: النص اليوناني مذكر جمع، لكنه يخاطب الجماعة المختلطة تمثيليًا؛ يحفظ الاختيار صورة الأصل ويوضح مدى الخطاب دون تعديل المتن توسعيًا.
- issue: معنى γλῶσσα في هذا الإصحاح
  choice: «لسان»
  alternative: «لغة»
  rationale: يحافظ «لسان» على المصطلح المتكرر وعلى التوتر الدلالي في 1 كورنثوس 12–14، فلا يحسم هل المقصود لغة بشرية معروفة أم نوع آخر من الكلام.
- issue: طبيعة ἑρμηνεία في سياق الألسنة
  choice: «ترجمة»
  alternative: «تفسير»
  rationale: ترجّح القرينة نقل مضمون اللسان ليصير مفهومًا للجماعة، مع بقاء إمكان فهم اللفظ اليوناني بمعنى التفسير أو البيان.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُخدم تكرار «أو» في القائمة لأن ἕκαστος يفيد التوزيع بين المساهمات، ولتجنب الإيحاء غير المقصود بأن كل فرد يحمل جميع العناصر المذكورة معًا. حُفظت استعارة «البنيان» المألوفة كتابيًا والمفهومة عربيًا.
