  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: ar
  text: أمّا إن لم يكن هناك مترجم، فليصمت في الجماعة[a]، وليتكلّم إلى نفسه وإلى الله.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «في الكنيسة» أو «في اجتماع المؤمنين».'
    reason: يوضح البدائل الممكنة للفظ ἐκκλησία، الذي يشير هنا إلى جماعة المؤمنين المجتمعة.
lexical_decisions:
- source_word: διερμηνευτής
  choice: مترجم
  rationale: يدلّ على من ينقل الكلام بلسان إلى كلام مفهوم للآخرين. «مترجم» هو المقابل العربي الواضح والمألوف في هذا السياق.
- source_word: σιγάτω
  choice: فليصمت
  rationale: صيغة أمر للمفرد الغائب، و«فليصمت» تنقل قوة التوجيه بإيجاز وفصاحة.
- source_word: ἐν ἐκκλησίᾳ
  choice: في الجماعة
  rationale: السياق هو اجتماع المؤمنين للعبادة، و«الجماعة» يبرز معنى الاجتماع المقصود دون حصر اللفظ في مبنى أو مؤسسة.
- source_word: ἑαυτῷ
  choice: إلى نفسه
  rationale: يحافظ على دلالة ضمير الانعكاس في صيغة المجرور، من غير إضافة ألفاظ مثل «سرًّا» أو «في داخله» قد تحسم كيفية الكلام أكثر مما يصرّح به النص.
- source_word: λαλείτω
  choice: وليتكلّم
  rationale: ينقل صيغة الأمر المستمرة في الجملة بلفظ عربي محايد وواضح.
- source_word: τῷ θεῷ
  choice: وإلى الله
  rationale: ينقل جهة الكلام الموجّه إلى الله ويحافظ على التوازي مع «إلى نفسه».
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: أمّا إن لم يكن هناك
  rationale: صياغة عربية طبيعية للشرط الذي يفترض عدم وجود مترجم، مع إبقاء المقابلة السياقية التي تفيدها δέ.
theological_decisions:
- issue: نطاق الأمر بالصمت في اجتماع الجماعة
  choice: يُمنع صاحب اللسان من الكلام الموجّه إلى الجماعة عند غياب المترجم، مع بقاء الكلام إلى نفسه وإلى الله.
  alternative: أن يمتنع عن كل كلام مطلقًا، أو أن يواصل كلامًا مسموعًا موجّهًا إلى الجماعة.
  rationale: المقابلة بين «فليصمت في الجماعة» و«وليتكلّم إلى نفسه وإلى الله» تحدد مجال الصمت من غير أن تحسم هل الكلام الأخير مسموع أم باطني؛ لذلك لم تُضف ألفاظ مثل «سرًّا» أو «في قلبه».
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. وُضع هامش البدائل بعد «الجماعة» لأنه يخص لفظ ἐκκλησία في النص اليوناني، لا لفظ «مترجم».
