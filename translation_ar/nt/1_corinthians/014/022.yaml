id: 1CO.14.22
reference: 1 Corinthians 14:22
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: ar
  text: إذًا، فالألسنة[a] علامةٌ لا للذين يؤمنون، بل لغير المؤمنين[b]؛ أما النبوة فليست لغير المؤمنين، بل للذين يؤمنون.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أيضًا ترجمة الكلمة اليونانية «لغات». ويحافظ لفظ «الألسنة» على مصطلح بولس في 1 كورنثوس 12–14 من غير حسم لطبيعة هذه الظاهرة.
    reason: lexical_alternative
  - marker: b
    text: يرى بعض المفسرين أن «العلامة» هنا قد تكون علامة دينونة، بالنظر إلى الاقتباس السابق من إشعياء 28:11–12.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: إذًا
  rationale: تفيد استخلاص نتيجة مما سبق، وتحافظ «إذًا» على قوة الاستنتاج بعبارة عربية طبيعية موجزة.
- source_word: αἱ γλῶσσαι
  choice: الألسنة
  rationale: يحافظ هذا اللفظ على مصطلح بولس المتكرر في 1 كورنثوس 12–14، من غير أن يحسم هل المقصود لغات بشرية أم نوعًا آخر من الكلام.
- source_word: εἰς σημεῖόν
  choice: علامةٌ
  rationale: ينقل المعنى الغائي أو الناتج للتركيب اليوناني بإيجاز، من غير تحديد طبيعة العلامة بأنها إيجابية أو قضائية.
- source_word: τοῖς πιστεύουσιν
  choice: للذين يؤمنون
  rationale: يعكس اسم الفاعل اليوناني المستعمل استعمال الاسم، ويُبقي فعل الإيمان ظاهرًا في العربية.
- source_word: τοῖς ἀπίστοις
  choice: لغير المؤمنين
  rationale: تعبير عربي واضح وموجز يحافظ على التقابل مع «الذين يؤمنون».
- source_word: ἡ προφητεία
  choice: النبوة
  rationale: هو المقابل المباشر والمألوف للنشاط أو الموهبة النبوية في سياق هذا الأصحاح.
- source_word: δὲ
  choice: أما
  rationale: تُبرز المقابلة بين الألسنة والنبوة بسلاسة، ويتكامل معناها مع الفاء في «فليست».
theological_decisions:
- issue: دلالة γλῶσσαι في سياق المواهب
  choice: الألسنة
  alternative: اللغات؛ أو كلام غير مألوف/وجداني
  rationale: الظاهرة المقصودة موضع خلاف، واللفظ المختار يحفظ مصطلح النص ولا يفرض تفسيرًا طائفيًا لطبيعتها.
- issue: طبيعة العلامة لغير المؤمنين
  choice: علامة، من غير وصف إضافي
  alternative: علامة إثبات؛ أو علامة دينونة
  rationale: النص اليوناني يقول «علامة» فحسب. وقد يوحي اقتباس إشعياء السابق بمعنى الدينونة، لكن إدخال ذلك في المتن يحسم توترًا تفسيريًا لا يحسمه لفظ الآية نفسه.
- issue: الإضمار في الشطر المتعلق بالنبوة
  choice: أما النبوة فليست لغير المؤمنين، بل للذين يؤمنون
  alternative: أما النبوة فليست علامة لغير المؤمنين، بل للذين يؤمنون
  rationale: حُفظ الإيجاز والإضمار الموجودان في اليونانية بدل إضافة كلمة «علامة» صراحةً إلى الشطر الثاني، لأن مدى حملها عليه قابل للنقاش النحوي والتفسيري.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدم تركيب متوازٍ لإظهار المقابلة، مع إبقاء الإيجاز والإضمار اليونانيين في الشطر الثاني. وُضع رمز الحاشية [a] بعد «الألسنة» لأنه يشرح هذا اللفظ مباشرة، ورمز [b] بعد «غير المؤمنين» لبيان احتمال فهم العلامة في ضوء السياق السابق.
