source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: ar
  text: أما الآن، أيها الإخوة[a]، فإن جئتُ إليكم متكلمًا بألسنة[b]، فبماذا أنفعكم إن لم أكلمكم بوحي أو بمعرفة أو بنبوة أو بتعليم؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «أيها الإخوة والأخوات»؛ فكلمة «الإخوة» في اليونانية قد تُستعمل لمخاطبة جماعة تضم رجالًا ونساءً.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «متكلمًا بلغات»؛ فاللفظ اليوناني قد يعني «لغات»، لكنه يشير هنا إلى الظاهرة التي يناقشها بولس في 1 كورنثوس 12–14.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: أمّا الآن
  rationale: تُظهر الانتقال إلى النقطة الحاضرة في الحجة، مع إبقاء ما في δέ من مقابلة خفيفة دون تشديد.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: تحافظ على صيغة الجمع المذكر في اليونانية وعلى أسلوب النداء الطبيعي الموقر في العربية، مع بيان شمول الخطاب للجماعة في الحاشية.
- source_word: γλώσσαις λαλῶν
  choice: متكلمًا بألسنة
  rationale: تنقل التعبير الاصطلاحي في سياق 1 كورنثوس 12–14 من غير حسم طبيعة هذه الظاهرة؛ ولفظ «لغات» ممكن معجميًا ومذكور في الحاشية.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: فأيَّ نفع أنفعكم
  rationale: صياغة عربية واضحة تحفظ الاستفهام وتركيز الأصل على النفع الذي يصل إلى المخاطبين.
- source_word: ἐὰν μὴ
  choice: إن لم
  rationale: تنقل الشرط المنفي بصورة طبيعية، وهو هنا يؤدي معنى «ما لم» أو «إلا إذا».
- source_word: ὑμῖν λαλήσω
  choice: أكلمكم
  rationale: تعبير عربي طبيعي يحفظ فعل الكلام وكون المخاطبين هم المتلقين.
- source_word: ἐν ἀποκαλύψει
  choice: بوحي
  rationale: الباء تنقل على نحو طبيعي المعنى الوسيلي أو الكيفي المحتمل لحرف ἐν، و«وحي» لفظ واضح لـἀποκάλυψις في هذا السياق.
- source_word: ἐν γνώσει
  choice: بمعرفة
  rationale: تحافظ على التوازي التركيبي وعلى دلالة المعرفة دون إضافة تفسير.
- source_word: ἐν προφητείᾳ
  choice: بنبوة
  rationale: تحافظ على فئة النبوة كما وردت، من غير تعريف لطبيعتها أو مداها.
- source_word: ἐν διδαχῇ
  choice: بتعليم
  rationale: تنقل معنى التعليم أو الإرشاد وتحافظ على إيقاع القائمة المتوازية.
theological_decisions:
- issue: دلالة ἀδελφοί في خطاب الجماعة
  choice: الإخوة
  alternative: الإخوة والأخوات
  rationale: أُبقيت الصيغة المذكرة المطابقة للأصل في المتن، مع توضيح أن الاستعمال اليوناني قد يشمل جماعة مختلطة في الحاشية.
- issue: دلالة γλώσσαις في 1 كورنثوس 12–14
  choice: بألسنة
  alternative: بلغات
  rationale: «ألسنة» تحافظ على المصطلح السياقي المتعارف عليه وعلى الغموض المتعلق بطبيعة الظاهرة، بينما تبقى دلالة «لغات» ممكنة معجميًا.
- issue: قيمة ἐν في العبارات الأربع
  choice: 'الباء: بوحي، بمعرفة، بنبوة، بتعليم'
  alternative: في وحي، وفي معرفة، وفي نبوة، وفي تعليم
  rationale: قد تكون ἐν وسيلية أو كيفية هنا؛ واستعمال الباء أكثر طبيعية في العربية ويبيّن أن هذه صور للكلام النافع، من غير فرض فصل حاد بين الوسيلة والمضمون.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حوفظ على البناء الاستفهامي والتوازي الرباعي، واستُخدمت الباء مع عناصر القائمة لسلامة الأسلوب العربي وإمكان دلالتها على الوسيلة أو الكيفية.
