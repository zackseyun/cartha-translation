source:
  edition: SBLGNT
  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: ar
  text: لِأَنَّ مَنْ يَتَكَلَّمُ بِلِسَانٍ لَا يُكَلِّمُ النَّاسَ بَلِ اللهَ، إِذْ لَا أَحَدَ يَفْهَمُهُ[a]؛ وَإِنَّمَا يَنْطِقُ بِأَسْرَارٍ بِالرُّوحِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يسمعه»؛ فالفعل اليوناني قد يعني السماع، وقد يدل في هذا السياق على الفهم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بروحه»؛ فقد تشير العبارة اليونانية إلى الروح القدس أو إلى روح المتكلم.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: مَنْ يَتَكَلَّمُ
  rationale: اسم الموصول مع الفعل المضارع يؤدي معنى اسم الفاعل المعرّف في اليونانية، ويحافظ على العموم بصياغة عربية طبيعية.
- source_word: γλώσσῃ
  choice: بِلِسَانٍ
  rationale: يحافظ على المفرد وعلى لفظ «لسان» دون تفسير الظاهرة بأنها لغة بشرية أخرى.
- source_word: ἀνθρώποις
  choice: النَّاسَ
  rationale: تعبير عربي عام يشمل البشر ولا يخص الذكور.
- source_word: θεῷ
  choice: اللهَ
  rationale: مفعول غير مباشر مع فعل الكلام في اليونانية، ويؤديه التركيب العربي «يكلّم الله» بوضوح.
- source_word: ἀκούει
  choice: يَفْهَمُهُ
  rationale: المعنى السياقي هو إدراك الكلام، مع إبقاء المعنى الحرفي «يسمعه» في الحاشية.
- source_word: πνεύματι
  choice: بِالرُّوحِ
  rationale: صياغة تحتمل الإشارة إلى الروح القدس، بينما تُذكر إمكانية الإشارة إلى روح المتكلم في الحاشية.
- source_word: μυστήρια
  choice: بِأَسْرَارٍ
  rationale: يحفظ الدلالة البولسية للأمور المستورة أو غير المكشوفة من غير تحويلها إلى شرح تفسيري.
- source_word: δὲ
  choice: وَإِنَّمَا
  rationale: 'يُظهر المقابلة والاستدراك في العربية بصورة طبيعية: لا يكلّم الناس، وإنما ينطق بأسرار.'
theological_decisions:
- issue: مرجع πνεύματι
  choice: بِالرُّوحِ
  alternative: بِرُوحِهِ / في الروح
  rationale: العبارة اليونانية تحتمل الروح القدس أو روح المتكلم. أبقى المتن القراءة التي تشير على نحو محتمل إلى الروح القدس، مع التصريح بالبديل في الحاشية لئلا يُحسم التوتر التفسيري.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «بلسان» للمفرد اليوناني، و«يفهمه» لبيان المقصود السياقي مع حفظ اللفظ الأقرب في الحاشية. وُضعت علامتا الحاشيتين في المتن كما هو مطلوب.
