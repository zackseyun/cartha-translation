  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: ar
  text: أَمَّا مَنْ يَتَنَبَّأُ فَيُكَلِّمُ النَّاسَ لِبُنْيَانِهِمْ وَتَشْجِيعِهِمْ وَتَعْزِيَتِهِمْ.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لِبُنْيَانِ النَّاسِ» أو «لِتَقْوِيَتِهِمْ».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا ترجمة «تَشْجِيعِهِمْ»: «حَثِّهِمْ»، وفي بعض السياقات: «تَعْزِيَتِهِمْ».'
    reason: lexical_alternative
  - marker: c
    text: 'يمكن أيضًا ترجمة «تَعْزِيَتِهِمْ»: «مُوَاسَاتِهِمْ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: أَمَّا مَنْ يَتَنَبَّأُ
  rationale: ينقل اسم الفاعل المعرَّف المستعمل اسميًّا بصياغة عربية طبيعية، وتؤدي «أمّا» وظيفة δέ في إظهار المقابلة اللطيفة مع الآية السابقة من غير مبالغة.
- source_word: ἀνθρώποις
  choice: النَّاسَ
  rationale: يدل جمع الاسم هنا على المخاطَبين عمومًا، لا على الذكور وحدهم؛ و«الناس» واضحة وشاملة في العربية المعاصرة.
- source_word: λαλεῖ
  choice: فَيُكَلِّمُ
  rationale: ينقل فعل الكلام في الزمن الحاضر، ومع «الناس» يعبّر طبيعيًّا عن توجيه الكلام إليهم.
- source_word: οἰκοδομὴν
  choice: لِبُنْيَانِهِمْ
  rationale: يحفظ استعارة البناء البولسية مع توضيح أن المقصود بناء المخاطَبين وتقويتهم، وتؤدي اللام معنى الغاية أو الأثر في السياق.
- source_word: παράκλησιν
  choice: تَشْجِيعِهِمْ
  rationale: للكلمة مجال دلالي يشمل التشجيع والحث والتعزية. واختيار «التشجيع» واضح حديثًا ويميّزها عن παραμυθία التالية من غير إلغاء البدائل الدلالية.
- source_word: παραμυθίαν
  choice: تَعْزِيَتِهِمْ
  rationale: تدل على الكلام الملطف أو المواسي؛ و«التعزية» تحافظ على تمايزها عن «التشجيع» في العبارة الثلاثية.
theological_decisions:
- issue: دلالة التنبؤ في سياق اجتماع الجماعة
  choice: الإبقاء على «يَتَنَبَّأُ» من غير حصره في الوعظ أو الإخبار بالمستقبل
  alternative: يَعِظ / ينطق بإعلان
  rationale: يصف النص أثر التنبؤ في السامعين، لكنه لا يعرّفه تعريفًا يحصره في وظيفة واحدة؛ لذلك تحفظ الصياغة اتساع المصطلح والتوتر اللاهوتي من غير إدخال تفسير مذهبي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كتابية كريمة. استُعملت «لبنيانهم» لحفظ الصورة الأصلية، بينما تشرح الحاشية المعنى الوظيفي. أُثبتت علامات الحواشي الثلاث في المتن.
