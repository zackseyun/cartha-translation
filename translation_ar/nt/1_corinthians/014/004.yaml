  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: ar
  text: مَنْ يتكلَّم بلسانٍ[a] يبني نفسه، أمّا مَنْ يتنبَّأ فيبني الكنيسة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بلغةٍ». وفي هذا الإصحاح يُرجَّح أن اللفظ يشير إلى موهبة الكلام بألسنة؛ أمّا طبيعة هذا الكلام على وجه الدقة فموضع نقاش.
    reason: lexical_alternative
  - marker: b
    text: أو «الجماعة» أو «جماعة المؤمنين».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: مَنْ يتكلَّم
  rationale: ينقل اسم الفاعل المسبوق بأداة التعريف بوصفه دالًّا على شخص تمثيلي، ويحافظ على التوازي مع «مَنْ يتنبَّأ».
- source_word: γλώσσῃ
  choice: بلسانٍ
  rationale: يحافظ على صيغة المفرد وعلى لفظ «لسان» المرتبط بهذه الموهبة في السياق، من غير أن يحسم طبيعة الكلام المقصود.
- source_word: ἑαυτὸν
  choice: نفسه
  rationale: ينقل الضمير الانعكاسي المفرد بوضوح، وهو عائد إلى الشخص المذكور بصيغة تمثيلية عامة.
- source_word: οἰκοδομεῖ
  choice: يبني
  rationale: يحافظ على استعارة البناء في اليونانية، والمقصود بها التقوية أو الإنماء الروحي بحسب السياق.
- source_word: ὁ δὲ προφητεύων
  choice: أمّا مَنْ يتنبَّأ
  rationale: يحافظ على البنية الموازية ويعبّر عن المقابلة الخفيفة التي تؤديها δέ.
- source_word: ἐκκλησίαν
  choice: الكنيسة
  rationale: هو التعبير العربي الطبيعي عن جماعة المؤمنين المجتمعة في هذا السياق، مع إمكان معنى «الجماعة» أو «المجمع» بحسب الاستعمال.
theological_decisions:
- issue: طبيعة الكلام المشار إليه بلفظ γλώσσῃ
  choice: «بلسانٍ» بوصفه كلام الألسنة في سياق المواهب
  alternative: «بلغةٍ»، سواء فُهمت لغة بشرية أجنبية أم نوعًا آخر من الكلام
  rationale: يتناول السياق موهبة الألسنة في العبادة، لكن النص لا يحدّد هنا طبيعة هذا الكلام تحديدًا يحسم الخلاف؛ لذلك يحافظ «بلسانٍ» على المصطلح وعلى الغموض الحقيقي.
- issue: معنى البناء في المقابلة بين الفرد والكنيسة
  choice: الإبقاء على استعارة «يبني» في الطرفين
  alternative: «يقوّي» أو «ينمّي روحيًّا»
  rationale: الإبقاء على الاستعارة يبرز التوازي المقصود من دون إضافة حكم إلى عبارة بناء المتكلم لنفسه أو تفسير كيفية حدوثه.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. حُفظ التوازي بين شطري الآية واستعارة البناء، واستُعمل «بلسانٍ» لإبقاء طبيعة الظاهرة غير محسومة. وُضعت علامتا الحاشيتين بعد اللفظ الذي تشرحانه.
