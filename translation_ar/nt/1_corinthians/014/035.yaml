source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: ar
  text: ولكن إن أردن أن يتعلَّمن شيئًا، فليسألن أزواجهن في البيت، لأنه عيب أن تتكلم المرأة[a] في الجماعة[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «الزوجة». فالكلمة اليونانية قد تعني «امرأة» أو «زوجة» بحسب السياق.
    reason: lexical_alternative
  - marker: b
    text: أو «في الكنيسة» أو «في اجتماع المؤمنين»؛ وتشير الكلمة اليونانية هنا إلى الجماعة وهي مجتمعة.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: أن يتعلَّمن
  rationale: ينقل معنى التعلُّم أو الوصول إلى المعرفة مباشرة، مع إظهار أن الفاعل هو النساء المشار إليهن في السياق.
- source_word: ἐν οἴκῳ
  choice: في البيت
  rationale: تعبير عربي طبيعي يحفظ المقابلة بين المجال المنزلي واجتماع الجماعة.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: أزواجهن
  rationale: وجود ἰδίους، أي «الخاصين بهن»، مع السياق المنزلي يرجّح المعنى الزوجي لكلمة ἄνδρας.
- source_word: ἐπερωτάτωσαν
  choice: فليسألن
  rationale: يحفظ صيغة الأمر ومعنى السؤال أو الاستفسار بعبارة عربية واضحة وموجزة.
- source_word: αἰσχρὸν
  choice: عيب
  rationale: ينقل القوة الاجتماعية والأخلاقية للكلمة اليونانية بصياغة عربية طبيعية، من غير تخفيفها إلى مجرد عدم الملاءمة.
- source_word: γυναικὶ
  choice: المرأة
  rationale: الكلمة اليونانية تحتمل «المرأة» و«الزوجة» بحسب السياق؛ اختير المعنى العام في المتن مع إثبات البديل في الحاشية.
- source_word: λαλεῖν
  choice: أن تتكلم
  rationale: ترجمة واسعة ومباشرة لا تقيّد نوع الكلام بما لا يصرّح به النص.
- source_word: ἐν ἐκκλησίᾳ
  choice: في الجماعة
  rationale: المقصود هو الجماعة المجتمعة؛ وهذه الصياغة تتجنب حصر المعنى في مبنى أو مؤسسة.
theological_decisions:
- issue: نطاق المنع المتعلق بكلام النساء
  choice: إبقاء العبارة عامة كما وردت، من غير تحديد نوع الكلام في المتن.
  alternative: قصرها على الأسئلة المشوشة، أو الحكم على النبوات، أو اعتبارها اقتباسًا من موقف أهل كورنثوس.
  rationale: النص اليوناني يقول ببساطة إن الكلام في الجماعة عيب على المرأة، ولا يحدد في هذه العبارة وحدها نوع الكلام؛ لذلك تُحفظ مساحة التوتر التفسيري.
- issue: هل تُفهم γυνή وἀνήρ بمعنى المرأة والرجل أم الزوجة والزوج؟
  choice: ترجمة ἄνδρας بـ«أزواجهن»، وγυναικὶ بـ«المرأة» في المتن، مع ذكر «الزوجة» في الحاشية.
  alternative: استعمال «الزوجة/الزوج» في الموضعين، أو «المرأة/الرجل» في الموضعين.
  rationale: السياق وعبارة «الخاصين بهن» يرجحان معنى الأزواج في الموضع الأول، بينما تبقى صيغة γυναικὶ المفردة محتملة للمعنى العام أو الزوجي.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة كريمة. استُخدمت صيغ جمع المؤنث لموافقة مرجع الضمائر في السياق، وحُفظ عموم «أن تتكلم» من غير إدخال تفسير لنوع الكلام.
