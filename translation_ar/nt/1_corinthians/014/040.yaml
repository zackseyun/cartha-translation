lexical_decisions:
- source_word: πάντα
  choice: كلُّ شيء
  rationale: ينقل شمول صيغة الجمع المحايد بعبارة عربية طبيعية، ويجعلها فاعلًا للفعل كما في تركيب المصدر.
- source_word: δὲ
  choice: ولكن
  rationale: تفيد انتقالًا ذا مسحة استدراكية إلى توجيه ختامي جامع، من غير جعل التعارض حادًّا.
- source_word: εὐσχημόνως
  choice: بلياقةٍ
  rationale: تعبّر عن كون التصرف ملائمًا وحسنًا ولائقًا بالمقام، مع إبقاء البديل «كما يليق» في الحاشية.
- source_word: κατὰ τάξιν
  choice: بحسب ترتيب
  rationale: تحافظ على معنى موافقة ترتيب أو نظام، ولا تفترض نموذجًا طقسيًّا محددًا.
- source_word: γινέσθω
  choice: ليجرِ
  rationale: ينقل صيغة الأمر للغائب ودلالة حدوث الأمور أو إجرائها، من غير إضافة فاعل بشري غير مصرّح به.
theological_decisions:
- issue: نطاق التوجيه في سياق العبادة الجماعية
  choice: توجيه عام بأن يجري كل شيء في اجتماع الجماعة بلياقة وترتيب
  alternative: اعتباره وصفًا لنظام طقسي ثابت بعينه، أو تعميمه صراحةً على كل ممارسة كنسية خارج السياق المباشر
  rationale: يلخّص النص مناقشة الكلام والنظام في اجتماع الجماعة، لكنه لا يحدد ترتيبًا طقسيًّا مذهبيًّا ولا يصرّح هنا بنطاق يتجاوز السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموجزة ذات نبرة توجيهية كريمة. اختير «ليجرِ» لموافقة صيغة الأمر اليونانية، و«بحسب ترتيب» للمحافظة على بنية العبارة ودلالتها العامة.
