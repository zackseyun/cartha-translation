  source_fidelity: 'النص العربي ينقل عناصر اليونانية الأساسية بأمانة: الأشياء غير الحية التي تصدر صوتًا، ومثالا المزمار والقيثارة، وضرورة تمييز النغمات، والاستفهام عن إمكان التعرّف إلى ما يُعزف. و«وهكذا» مقبول هنا بوصفه انتقالًا إلى مثال مماثل في الحجة، مع أن «حتى» ممكن أيضًا.'
