  text: ὅμως τὰ ἄψυχα φωνὴν διδόντα, εἴτε αὐλὸς εἴτε κιθάρα, ἐὰν διαστολὴν τοῖς φθόγγοις μὴ ⸀δῷ, πῶς γνωσθήσεται τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: ar
  text: وهكذا الأشياءُ الجامدةُ التي تُصدر صوتًا، سواءٌ أكانت مزمارًا أم قيثارةً، إن لم تُعطِ نغماتٍ متميزةً بعضها من بعض، فكيف يُعرَف ما يُعزَف بالمزمار أو بالقيثارة؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμως
  choice: وهكذا
  rationale: تؤدي هنا وظيفة الانتقال إلى مثال توضيحي مماثل، وتنسجم طبيعيًا مع سياق الحجة دون أن توحي باستدراك قوي غير لازم.
- source_word: τὰ ἄψυχα
  choice: الأشياء الجامدة
  rationale: تدل على ما لا حياة فيه، والمقصود هنا الآلات الموسيقية؛ و«الأشياء الجامدة» تعبير عربي واضح وطبيعي.
- source_word: φωνὴν διδόντα
  choice: التي تُصدر صوتًا
  rationale: ينقل معنى إعطاء الصوت بصياغة عربية معاصرة مألوفة.
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: سواء أكانت مزمارًا أم قيثارةً
  rationale: «مزمار» مناسب لآلة النفخ القديمة αὐλός، و«قيثارة» اسم عربي واضح لآلة κιθάρα الوترية القديمة، وهو أدق تاريخيًا من «الربابة» أو «الكنّارة» في هذا الموضع.
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: إن لم تُعطِ نغماتٍ متميزةً بعضها من بعض
  rationale: يحفظ معنى التفريق بين الأصوات أو النغمات، ويجعل المقصود الموسيقي واضحًا في العربية من غير تفسير زائد.
- source_word: πῶς γνωσθήσεται
  choice: فكيف يُعرَف
  rationale: يحافظ على صيغة المبني للمجهول وعلى معنى إمكان تمييز المقطوعة أو التعرف إليها.
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: ما يُعزَف بالمزمار أو بالقيثارة
  rationale: ينقل اسمي المفعول الدالين على ما يجري أداؤه بالآلتين، بصياغة عربية موجزة وطبيعية.
