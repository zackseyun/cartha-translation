id: 1CO.14.30
reference: 1 Corinthians 14:30
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἄλλῳ ἀποκαλυφθῇ καθημένῳ, ὁ πρῶτος σιγάτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/030.yaml
  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: ar
  text: ولكن إن كُشِفَ شيءٌ لآخَرَ جالسٍ[a]، فليصمتِ الأوّلُ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «إن أُعطيَ إعلانٌ لآخَرَ جالسٍ».'
    reason: lexical_alternative
  - marker: b
    text: أي إن على المتكلم الأول أن يتوقف عن الكلام ليتمكن الآخر من الكلام.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: ولكن إن
  rationale: تجمع «إن» معنى الشرط، وتفيد «لكن» الانتقال المقابل الخفيف في سياق تنظيم الكلام في الجماعة.
- source_word: ἄλλῳ
  choice: لآخَرَ
  rationale: تحافظ على دلالة شخص آخر غير المتكلم الحالي، بصياغة عربية موجزة وطبيعية.
- source_word: ἀποκαλυφθῇ
  choice: كُشِفَ شيءٌ
  rationale: الفعل مبني للمجهول، والنص اليوناني لا يذكر اسمًا صريحًا بمعنى «إعلان»؛ لذلك تحافظ الصياغة على الحدث وعلى عدم التصريح بفاعله.
- source_word: καθημένῳ
  choice: جالسٍ
  rationale: نعت لـ«آخَر» يحفظ صورة الشخص الجالس بين المجتمعين دون زيادة تفسيرية.
- source_word: ὁ πρῶτος
  choice: الأوّل
  rationale: ينقل اللفظ حرفيًا، مع توضيح المقصود بالسياق في الحاشية دون إدخال «المتكلم» في المتن.
- source_word: σιγάτω
  choice: فليصمت
  rationale: ينقل صيغة الأمر للغائب بوضوح، ويفيد في هذا السياق أن يكف المتكلم الأول عن الكلام.
theological_decisions:
- issue: طبيعة الكشف ومصدره في النبوة داخل اجتماع الكنيسة
  choice: «كُشِفَ شيءٌ» من غير تسمية الفاعل
  alternative: «أُعطي إعلانٌ» أو «كشف الله شيئًا»
  rationale: المبني للمجهول يوحي بكشف إلهي في السياق، لكن الآية لا تسمّي الله فاعلًا صراحة. وتحفظ الصياغة هذا التحفظ وكذلك إمكان فهم المفعول الضمني على أنه شيء كُشف.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة تعليمية كريمة. اختير «جالس» بدل «قاعد» لملاءمة الأسلوب، وحُفظ إيجاز الأصل وبناؤه الشرطي. وُضعت علامتا الحاشيتين عند العبارتين اللتين تشرحانهما مباشرة.
