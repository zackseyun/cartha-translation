  text: δύνασθε γὰρ καθ’ ἕνα πάντες προφητεύειν, ἵνα πάντες μανθάνωσιν καὶ πάντες παρακαλῶνται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: ar
  text: فإنكم تستطيعون جميعًا أن تتنبأوا، واحدًا فواحدًا[a]، لكي يتعلّم الجميع ويُشجَّع الجميع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «واحدًا في كل مرة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يُحَثّ الجميع» أو «يتعزّى الجميع»؛ فالفعل اليوناني قد يدل، بحسب السياق، على التشجيع أو الحث أو التعزية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: تستطيعون
  rationale: ينقل معنى القدرة أو الإمكان في صيغة عربية واضحة وطبيعية.
- source_word: γὰρ
  choice: فإنكم
  rationale: يحفظ وظيفة الأداة في تعليل التوجيه السابق وربطه به.
- source_word: καθ’ ἕνα
  choice: واحدًا فواحدًا
  rationale: تعبير عربي طبيعي يدل على التعاقب، أي أن يتكلم كل شخص في دوره.
- source_word: πάντες
  choice: جميعًا / الجميع
  rationale: يحفظ تكرار اللفظ اليوناني ثلاث مرات واتساع دلالته، من غير تقييد مرجعه بما لا يصرّح به النص.
- source_word: προφητεύειν
  choice: أن تتنبأوا
  rationale: يحفظ المصطلح البولسي المألوف من غير تضييقه بتفسير شارح.
- source_word: ἵνα
  choice: لكي
  rationale: يعبّر بوضوح عن الغاية المقصودة من تنظيم الكلام.
- source_word: μανθάνωσιν
  choice: يتعلّم الجميع
  rationale: ينقل المعنى التعليمي العام ويحافظ على شمول πάντες.
- source_word: παρακαλῶνται
  choice: يُشجَّع الجميع
  rationale: صيغة مبنية للمجهول توافق اليونانية، و«يُشجَّع» تنقل المعنى الواسع الملائم لبنيان الجماعة دون حصره في الوعظ أو التعزية.
theological_decisions:
- issue: نطاق πάντες («الجميع») في سياق اجتماع الجماعة
  choice: الإبقاء على «جميعًا/الجميع» من غير تحديده بعبارة «جميعكم» أو «جميع الأنبياء»
  alternative: جميعكم؛ أو جميع الأنبياء
  rationale: يرد πάντες ثلاث مرات؛ وقد يختلف مرجع المرة الأولى عن مرجع المرتين التاليتين بحسب السياق. لذلك تحافظ الصياغة على العموم والتكرار وتترك للسياق تعيين المرجع.
- issue: مدى معنى παρακαλῶνται
  choice: يُشجَّع الجميع
  alternative: يُوعَظ الجميع؛ أو يتعزّى الجميع
  rationale: يمكن للفعل أن يدل على التشجيع أو الحث أو التعزية. واختيار «يُشجَّع» يلائم أثر الكلام النبوي في بنيان الجماعة، مع إثبات البدائل في الحاشية وعدم إلغاء التعدد الدلالي.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ووقورة. حُفظ تكرار «الجميع» للتوكيد، واستُخدمت صيغة المبني للمجهول في «يُشجَّع» موافقةً للمصدر اليوناني.
