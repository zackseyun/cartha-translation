  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: ar
  text: وأريد أن تتكلموا جميعًا بألسنة، بل بالأكثر أن تتنبأوا. فالذي يتنبأ أعظم من الذي يتكلم بألسنة، إلا إذا فسَّر[a]، لكي تنال الكنيسة ما يبنيها[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ويجوز: «إلا إذا فسَّر شخصٌ ما». فالفعل اليوناني مفرد، وقد يعود إلى المتكلم بألسنة نفسه، أو يدل في سياق الأصحاح على أن تفسيرًا قد قُدِّم.'
    reason: alternative_reading
  - marker: b
    text: 'حرفيًّا: «لكي تنال الكنيسة بنيانًا»؛ والمقصود أن تتقوّى الجماعة المجتمعة وتنمو.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: أريد
  rationale: ينقل بصيغة مباشرة رغبة بولس الشخصية، من غير إضافة ظرف زمني غير موجود في اليونانية.
- source_word: πάντας ὑμᾶς
  choice: جميعًا
  rationale: يحفظ شمول الخطاب الموجَّه إلى جماعة المخاطَبين كلها، مع دلالة الجمع الواضحة في «تتكلموا».
- source_word: λαλεῖν γλώσσαις
  choice: أن تتكلموا بألسنة
  rationale: يحفظ لفظ «الألسنة» المستعمل في هذا السياق من الرسالة من غير حسم لطبيعة الظاهرة بأنها لغات بشرية عادية.
- source_word: μᾶλλον δὲ
  choice: لكنني أريد بالأكثر
  rationale: يعبّر عن تفضيل مقارن لا عن رفض التكلم بألسنة.
- source_word: ἵνα προφητεύητε
  choice: أن تتنبأوا
  rationale: ينقل مضمون الرغبة بصياغة عربية طبيعية ويحافظ على معنى ممارسة النبوة.
- source_word: μείζων
  choice: أعظم
  rationale: يحافظ على المقارنة الصريحة في الأصل بدل استبدالها بتفسير مثل «أنفع»، بينما تُظهر جملة الغاية أن السياق هو بنيان الكنيسة.
- source_word: ὁ προφητεύων
  choice: الذي يتنبأ
  rationale: صياغة موصولة طبيعية تحفظ اسم الفاعل اليوناني المستعمل للدلالة على من يقوم بالفعل.
- source_word: ὁ λαλῶν γλώσσαις
  choice: الذي يتكلم بألسنة
  rationale: يحافظ على التوازي التركيبي مع «الذي يتنبأ».
- source_word: ἐκτὸς εἰ μὴ
  choice: إلا إذا
  rationale: مقابل عربي طبيعي لعبارة الاستثناء الشرطية.
- source_word: διερμηνεύῃ
  choice: فسَّر
  rationale: الفعل المفرد يعود في القراءة الأقرب إلى المتكلم بألسنة، و«فسّر» ملائم لنقل مضمون الكلام المفهوم في سياق الأصحاح.
- source_word: ἡ ἐκκλησία
  choice: الكنيسة
  rationale: يشير هنا إلى جماعة المؤمنين المجتمعة، و«الكنيسة» هو المقابل العربي الجاري في الاستعمال البولسي.
- source_word: οἰκοδομὴν λάβῃ
  choice: تنال الكنيسة ما يبنيها
  rationale: ينقل صورة البنيان وعبارة التلقي بلغة عربية واضحة وطبيعية، من غير إضافة وصف عقائدي غير مصرح به.
theological_decisions:
- issue: أعظمية من يتنبأ قياسًا بمن يتكلم بألسنة
  choice: الإبقاء على «أعظم» مع ترك جملة الغاية تحدد أن المقارنة متصلة ببنيان الكنيسة
  alternative: تفسيرها في المتن بـ«أنفع للكنيسة» أو فهمها رتبةً روحية أعلى
  rationale: الأصل يستعمل لفظ المقارنة العام «أعظم»، وتربط جملة الغاية التفاضل ببنيان الجماعة؛ لذلك لا يُستبدل اللفظ بتفسير ولا تُفرض تراتبية في القداسة.
- issue: فاعل διερμηνεύῃ
  choice: 'إرجاع الفعل المفرد إلى المتكلم بألسنة: «إلا إذا فسَّر»'
  alternative: «إلا إذا فسَّر شخص آخر» أو «إلا إذا وُجد تفسير»
  rationale: أقرب مرجع نحوي للفعل المفرد هو الشخص الذي يتكلم بألسنة، لكن سياق الأصحاح يجيز أن يأتي التفسير من شخص آخر؛ لذلك حُفظ الاحتمال البديل في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية وقورة. استُعمل «بألسنة» حفاظًا على مصطلح السياق وغموضه الحقيقي، وصيغت صورة οἰκοδομή بعبارة مفهومة «ما يبنيها» مع بيان اللفظ الأقرب في الحاشية.
