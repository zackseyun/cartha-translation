source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: ar
  text: 'فتصير خفايا قلبه ظاهرة، وهكذا يخرّ على وجهه ساجدًا لله، معلنًا: «حقًّا إن الله بينكم».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «حقًّا إن الله فيكم».'
    reason: يحفظ المعنى البديل الممكن للعبارة اليونانية ἐν ὑμῖν.
lexical_decisions:
- source_word: τὰ κρυπτὰ
  choice: خفايا
  rationale: تنقل معنى الأمور المستترة في باطن الإنسان بعبارة عربية طبيعية وموجزة.
- source_word: τῆς καρδίας αὐτοῦ
  choice: قلبه
  rationale: تحافظ على اللفظ الكتابي الذي يدل هنا على موضع الأفكار والدوافع الباطنة، من غير تفسير زائد.
- source_word: φανερὰ γίνεται
  choice: تصير ... ظاهرة
  rationale: تحفظ دلالة الصيرورة في γίνεται وظهور ما كان خفيًّا في φανερά.
- source_word: καὶ οὕτως
  choice: وهكذا
  rationale: تربط انكشاف الخفايا بالاستجابة الناتجة عنه، مع إبقاء احتمال معنى الكيفية والنتيجة.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: يخرّ ... على وجهه
  rationale: تعبير عربي كتابي مفهوم يصوّر السقوط على الوجه في هيئة الخضوع.
- source_word: προσκυνήσει τῷ θεῷ
  choice: ساجدًا ... لله
  rationale: يجمع بين معنى العبادة الموجّهة إلى الله وهيئة السجود، من غير تكرار ثقيل بعد ذكر السقوط على الوجه.
- source_word: ἀπαγγέλλων
  choice: معلنًا
  rationale: يلائم الإقرار الصريح الذي ينطق به الشخص نتيجة ما اختبره.
- source_word: Ὄντως
  choice: حقًّا
  rationale: ينقل توكيد صدق الاستنتاج بصورة عربية طبيعية ومهيبة.
- source_word: ἐν ὑμῖν
  choice: بينكم
  rationale: السياق هو اجتماع الجماعة، ولذلك يفيد اللفظ حضور الله في وسطهم، مع حفظ البديل الحرفي في الحاشية.
theological_decisions:
- issue: دلالة ἐν ὑμῖν في الإقرار الختامي
  choice: بينكم
  alternative: فيكم
  rationale: يتناول السياق الكنيسة المجتمعة وإدراك الداخل الغريب حضور الله في وسط الجماعة من خلال النبوة. ومع ذلك، يمكن أن تدل العبارة اليونانية على «فيكم»، لذا حُفظ هذا الاحتمال في الحاشية من غير حسم للتوتر الدلالي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية كريمة. استُعمل «يخرّ ساجدًا على وجهه» لتصوير الفعل الجسدي والعبادة معًا، ووُضعت علامة الحاشية بعد الجملة التي تتصل بها.
