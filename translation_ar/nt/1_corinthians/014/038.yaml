translation:
  language: ar
  text: أمّا إن كان أحدٌ لا يعترف بهذا[b][a]، فلا يُعترَف به.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تقرأ بعض المخطوطات: «إن كان أحدٌ يجهل، فليجهل». أمّا النص المعتمد فيقرأ: «إن كان أحدٌ لا يعترف، فلا يُعترَف به».'
    reason: textual_variant
  - marker: b
    text: 'أو: «يتجاهل هذا ... فيُتجاهَل». استُعمل الفعل اليوناني نفسه أولًا بصيغة المعلوم ثم بصيغة المبني للمجهول لإحداث مقابلة بلاغية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: إن كان
  rationale: أداة شرط، وصياغة «إن كان أحد» عربية طبيعية تحفظ عموم الشرط من غير تقرير وقوعه.
- source_word: δέ
  choice: أمّا
  rationale: تفيد الانتقال المقابل لما سبق، وتلائم بنية الشرط والجواب في العربية الفصحى المعاصرة.
- source_word: τις
  choice: أحدٌ
  rationale: تحفظ الدلالة العامة للنكرة المفردة.
- source_word: ἀγνοεῖ
  choice: لا يعترف بهذا
  rationale: في ضوء الآية السابقة، يدل الفعل على عدم الإقرار أو الاعتراف بأن كلام بولس وصية الرب، لا على مجرد نقص المعرفة. وإضافة «بهذا» توضح المرجع السياقي، مع بيان البديل في الحاشية.
- source_word: ἀγνοεῖται
  choice: فلا يُعترَف به
  rationale: يحفظ المبني للمجهول والتجاوب البلاغي مع الفعل نفسه في صيغة المعلوم، من غير تعيين الجهة التي لا تعترف به.
theological_decisions:
- issue: دلالة المبني للمجهول ἀγνοεῖται
  choice: '«فلا يُعترَف به»: نتيجة تقابل رفض الشخص الاعتراف بالتعليم الرسولي'
  alternative: «فيُتجاهَل» أو «فهو غير معروف»
  rationale: النص المعتمد فعل مضارع مبني للمجهول، وليس فعل أمر. وتحافظ الصياغة على الغموض في هوية من لا يعترف بالشخص، فلا تحصره في الله أو الجماعة.
- issue: القراءة النصية في جواب الشرط
  choice: 'اتباع قراءة SBLGNT: ἀγνοεῖται، «فلا يُعترَف به»'
  alternative: قراءة ἀγνοείτω، «فليبقَ جاهلًا» أو «فليجهل»
  rationale: تُترجم القراءة المعتمدة في المتن، وتُذكر القراءة المخطوطية البديلة في الحاشية من غير خلط بينهما.
translation_notes:
  register: لغة عربية فصحى واضحة وموقرة. اختير «يعترف» بدل «يعرف» لتمييز معنى الإقرار المقصود في السياق من مجرد المعرفة الذهنية، وحُفظ التوازي اللفظي في «يعترف/يُعترَف».
