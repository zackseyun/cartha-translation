base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: ar
  text: لذلك، إن كنتُ لا أعرف معنى الصوت[a]، فسأكون غريبَ اللسان عند المتكلم[b]، ويكون المتكلم غريبَ اللسان عندي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «قوة الصوت»؛ أي الدلالة أو المغزى الذي ينقله الصوت.
    reason: lexical_alternative
  - marker: b
    text: اليونانية حرفيًّا «بربريًّا»، والمقصود هنا شخص غريب اللسان أو لا يُفهَم كلامه، لا بالضرورة شخصًا غير متحضّر.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: لذلك، إن
  rationale: تنقل οὖν الاستنتاجية وἐὰν الشرطية بعبارة عربية طبيعية، وتحافظ على اتصال الحجة بما سبق.
- source_word: μὴ εἰδῶ
  choice: لا أعرف
  rationale: تحافظ على الدلالة الأساسية للفعل οἶδα، مع بقاء معنى الفهم حاضرًا من السياق.
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: معنى الصوت
  rationale: تدل δύναμις هنا على ما يحمله الصوت من دلالة أو مغزى، لا على القدرة بالمعنى الحرفي؛ و«الصوت» يحفظ سعة φωνή دون تحويلها صراحة إلى «لغة».
- source_word: ἔσομαι
  choice: فسأكون
  rationale: تنقل صيغة المستقبل وتربط جواب الشرط بما قبله ربطًا عربيًا واضحًا.
- source_word: τῷ λαλοῦντι
  choice: بالنسبة إلى المتكلم
  rationale: تعبير عربي طبيعي يحفظ العلاقة المتبادلة المقصودة في النص، بدل صياغة حرفية ثقيلة.
- source_word: βάρβαρος
  choice: أجنبيًّا
  rationale: المقصود في السياق شخص غريب اللسان أو غير مفهوم الكلام، لا شخص متوحش؛ لذا تتجنب الصياغة الإيحاء التحقيري الذي قد تحمله «بربري».
- source_word: ἐν ἐμοὶ
  choice: بالنسبة إليَّ
  rationale: تنقل الاستعمال العلاقي لعبارة ἐν ἐμοί وتبرز التبادل بين المتكلم والسامع بوضوح.
