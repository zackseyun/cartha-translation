reference: 1 Corinthians 14:19
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: ar
  text: بل في الكنيسة أفضّل أن أتكلّم خمس كلمات بذهني، لكي أعلّم الآخرين أيضًا، على أن أتكلّم عشرة آلاف كلمة بلسان[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «بلغة». يمكن أن تعني الكلمة اليونانية «لسانًا» أو «لغة»، وهي هنا تشير إلى نوع الكلام الذي يناقشه بولس في 1 كورنثوس 12–14.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἐκκλησίᾳ
  choice: في الكنيسة
  rationale: يشير التعبير هنا إلى جماعة المؤمنين المجتمعة للعبادة؛ و«الكنيسة» هي الصياغة العربية الطبيعية مع بقاء المعنى الجماعي حاضرًا.
- source_word: θέλω ... ἢ
  choice: أفضّل ... على أن
  rationale: الفعل يعني في أصله «أريد»، لكن المقابلة مع ἢ تُظهر معنى التفضيل، فصيغ التعبير عربيًا بما يحفظ هذه القوة المقارِنة.
- source_word: πέντε λόγους
  choice: خمس كلمات
  rationale: يحفظ هذا الاختيار الصورة العددية المباشرة والمقابلة البلاغية مع «عشرة آلاف كلمة».
- source_word: τῷ νοΐ μου
  choice: بذهني
  rationale: يحافظ على الإشارة إلى الذهن، وفي السياق يدل على كلام واعٍ مفهوم، من غير تحويل العبارة إلى تفسير مطوّل.
- source_word: λαλῆσαι
  choice: أن أتكلّم
  rationale: صياغة عربية طبيعية للفعل الدال على الكلام العلني في هذا السياق.
- source_word: ἵνα καὶ ἄλλους κατηχήσω
  choice: لكي أعلّم الآخرين أيضًا
  rationale: الفعل κατηχέω يدل على التعليم أو الإرشاد الشفهي؛ و«أعلّم» واضحة وطبيعية ولا تستورد المعنى الاصطلاحي المتأخر للتلقين الكنسي.
- source_word: μυρίους λόγους
  choice: عشرة آلاف كلمة
  rationale: يحفظ العدد الصريح والمبالغة البلاغية في المقابلة مع خمس كلمات.
- source_word: ἐν γλώσσῃ
  choice: بلسان
  rationale: يحفظ لفظ «اللسان» واستعماله الخاص في هذا القسم، من غير حسم طبيعة الظاهرة بأنها لغة بشرية أجنبية أو كلام من نوع آخر.
theological_decisions:
- issue: دلالة γλῶσσα في سياق 1 كورنثوس 12–14
  choice: بلسان
  alternative: بلغة
  rationale: اختير «بلسان» للمحافظة على مصطلح المقطع وعلى إمكاناته الدلالية، من غير حسم الخلاف بشأن طبيعة هذا الكلام. وتُذكر «بلغة» في الحاشية بوصفها ترجمة معجمية ممكنة.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة، مع تركيب مقارن طبيعي. وُضع رمز الحاشية بعد «بلسان» لأنه اللفظ الذي تتناوله الحاشية.
