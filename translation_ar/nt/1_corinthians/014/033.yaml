  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: ar
  text: لِأَنَّ اللهَ لَيْسَ إِلَهَ فَوْضَى، بَلْ إِلَهَ سَلَامٍ[a]، كَمَا فِي جَمِيعِ كَنَائِسِ الْقِدِّيسِينَ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأن الله ليس إله تشويش، بل إله سلام».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كما هي الحال في جميع كنائس شعب الله المقدّس». ويربط بعضهم هذه العبارة بالآية التالية بدلًا من ربطها بهذه الآية.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: فوضى
  rationale: تنقل معنى الاضطراب وانعدام النظام في سياق اجتماع الكنيسة، من غير أن تحصر اللفظ في التشوش الذهني.
- source_word: εἰρήνης
  choice: سلام
  rationale: المقابل العربي المألوف الذي يحفظ التضاد مع الفوضى، ويشمل هنا السكينة والنظام المنسجم.
- source_word: ὁ θεὸς
  choice: الله
  rationale: اللفظ اليوناني معرف وشخصي، و«الله» هو التعبير العربي الطبيعي في هذا التركيب.
- source_word: ὡς
  choice: كما في
  rationale: تحفظ إيجاز المقارنة في اليونانية وتصل العبارة بما قبلها، مع إبقاء احتمال وصلها بالآية التالية في الحاشية.
- source_word: ἐκκλησίαις
  choice: كنائس
  rationale: الترجمة الكنسية العربية الراسخة للجماعات المسيحية المحلية في هذا السياق البولسي.
- source_word: τῶν ἁγίων
  choice: القديسين
  rationale: تحفظ التعبير البولسي المألوف عن المؤمنين، مع تقديم صياغة تفسيرية أوضح في الحاشية.
- source_word: γάρ
  choice: لأن
  rationale: تبيّن أن الجملة تعليل للتوجيهات السابقة بشأن النظام في اجتماع الكنيسة.
theological_decisions:
- issue: تعلّق عبارة ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων
  choice: وصلها بالآية 33 بوصفها مقارنة بما هو قائم في جميع الكنائس
  alternative: وصلها بالآية التالية لتبدأ جملة عن السلوك في الكنائس
  rationale: يؤيد ترقيم SBLGNT المعطى وصل العبارة بما قبلها، لكن تركيب اليونانية وتقاليد الترقيم يسمحان بوصلها بما بعدها؛ لذلك حُفظ الاحتمال الآخر في الحاشية دون حسم زائد.
translation_notes:
  register: عربية فصحى واضحة ذات نبرة كتابية وقورة. استُخدم تركيب «ليس إله فوضى، بل إله سلام» للحفاظ على التوازي اليوناني، ووُضعت علامتا الحاشية في المتن عند موضعي البديل المعجمي والخلاف التركيبي.
