  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: ar
  text: وهكذا أنتم أيضًا، بما أنكم متحمّسون للمواهب الروحية[a]، فاسعوا إلى أن تزدادوا لبنيان الكنيسة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اليونانية لفظ مقتضب يمكن أن يعني «أرواحًا» أو «أمورًا روحية»؛ ويشير السياق على الأرجح إلى المواهب أو المظاهر الروحية.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: وهكذا أنتم أيضًا
  rationale: تنقل الصلة الاستنتاجية بما سبق وتحافظ على إيجاز العبارة اليونانية.
- source_word: ἐπεὶ
  choice: ما دمتم
  rationale: تؤدي المعنى السببي هنا بصياغة عربية طبيعية تمهّد للحث.
- source_word: ζηλωταί
  choice: متحمّسين
  rationale: تعبّر بوضوح معاصر عن شدة الرغبة والغيرة، من غير إيحاء سلبي.
- source_word: πνευμάτων
  choice: المواهب الروحية
  rationale: سياق الأصحاحات 12–14 يتناول العطايا أو المظاهر الروحية، لكن اللفظ اليوناني المقتضب أوسع؛ لذلك حُفظت دلالته الحرفية المحتملة في الحاشية.
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: لبنيان الكنيسة
  rationale: تحافظ «بنيان» على استعارة البناء البولسية، وتدل هنا على تقوية جماعة المؤمنين.
- source_word: ζητεῖτε
  choice: فاسعوا
  rationale: تفيد الطلب الجاد والمقصود بصورة طبيعية في العربية.
- source_word: ἵνα περισσεύητε
  choice: إلى أن تفيضوا
  rationale: تحافظ على صورة الوفرة في περισσεύω، ولا تضيف مفعولًا غير مصرّح به؛ والغاية المقصودة هي بنيان الكنيسة.
theological_decisions:
- issue: دلالة πνευμάτων في السياق
  choice: المواهب الروحية
  alternative: الروحيات؛ الأرواح
  rationale: يرجّح سياق الحديث عن النبوة والألسنة وسائر المظاهر الروحية أن المقصود عطايا روحية، لكن النص اليوناني يقول حرفيًا «الأرواح» أو، بحسب فهم الصفة المحذوف موصوفها، «الروحيات». أُثبت الاحتمال في الحاشية صونًا للغموض الأصلي.
- issue: متعلَّق περισσεύητε
  choice: تفيضوا لبنيان الكنيسة
  alternative: تفيضوا فيها لبنيان الكنيسة
  rationale: 'لا يذكر اليوناني مفعولًا صريحًا بمعنى «فيها»، ولذلك لم تُضف الإحالة إلى المواهب، وبقي التركيز على الغاية: بنيان الكنيسة.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «بنيان» للمحافظة على استعارة البناء، و«تفيضوا» للمحافظة على دلالة الوفرة من غير إدخال مفعول غير موجود في الأصل.
