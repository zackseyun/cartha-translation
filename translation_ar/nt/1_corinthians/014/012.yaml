review_pass:
  verdict: revise
  source_fidelity: 'المعنى العام محفوظ: الحث موجَّه إلى من لديهم غيرة على الأمور/المواهب الروحية لكي يفيضوا أو يزدادوا بقصد بنيان الكنيسة. لكن «ما دمتم» تحمل عادةً معنى زمنيًا أو شرطيًا مستمرًا، فيما ἐπεὶ سببية هنا، و«تفيضوا» أقل ملاءمة مع غياب مفعولٍ أو مجالٍ يحدّد ما الذي يفيضون فيه.'
  naturalness: «وهكذا أنتم أيضًا» سليمة، لكن «ما دمتم ... فاسعوا إلى أن تفيضوا لبنيان الكنيسة» أثقل وأقل طبيعية في العربية الفصحى. «بما أنكم ... فاسعوا إلى أن تزدادوا لبنيان الكنيسة» أوضح وأقرب إلى الربط السببي في الأصل، مع إبقاء متعلَّق الازدياد غير مصرَّح به.
  terminology: «المواهب الروحية» اختيار سياقي جائز لـ πνευμάτων إذا أبقت الحاشية بدائله. «بنيان الكنيسة» يحفظ الاستعارة البولسية المناسبة. وتُصاغ الحاشية بدقة أكبر فلا تجعل «الأرواح» وحدها المعنى الحرفي الحاسم، بل تبيّن أن اللفظ اليوناني المقتضب يحتمل «الأرواح» أو «الأمور الروحية».
  issues:
  - severity: medium
    issue: «ما دمتم» لا ينقل السببية بوضوح.
    rationale: ἐπεὶ هنا تعني «بما أن/إذ إن»، لا استمرارًا زمنيًا أو شرطًا من نوع «ما دمتم».
  - severity: medium
    issue: «تفيضوا لبنيان الكنيسة» غير مألوفة دلاليًا في العربية.
    rationale: «يفيض» يوحي غالبًا بسائل أو بمحتوى يُذكر، بينما περισσεύητε تفيد الزيادة أو الوفرة دون مفعول مصرَّح به. «تزدادوا» يحفظ الإبهام النحوي والمقصد العام بصورة أسلس.
  - severity: low
    issue: الحاشية تحتاج إلى عرض الاحتمال المعجمي بصياغة أكثر توازنًا.
    rationale: πνευμάτων صيغة مقتضبة يمكن أن تُفهم «أرواحًا» أو «أمورًا روحية» بحسب السياق؛ فصياغة الحاشية ينبغي أن تعرض الاحتمالين دون تقرير أن أحدهما هو الحرفي الوحيد.
  revised_text: وهكذا أنتم أيضًا، بما أنكم متحمّسون للمواهب الروحية[a]، فاسعوا إلى أن تزدادوا لبنيان الكنيسة.
