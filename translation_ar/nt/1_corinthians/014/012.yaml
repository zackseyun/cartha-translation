revisions:
- from: وهكذا أنتم أيضًا، ما دمتم متحمّسين للمواهب الروحية[a]، فاسعوا إلى أن تفيضوا لبنيان الكنيسة.
  to: وهكذا أنتم أيضًا، بما أنكم متحمّسون للمواهب الروحية[a]، فاسعوا إلى أن تزدادوا لبنيان الكنيسة.
  rationale: استُبدلت أداة الربط بما يعبّر بوضوح عن سببية ἐπεὶ، واستُبدل «تفيضوا» بـ«تزدادوا» لتقديم عربية أفصح وأقرب إلى دلالة περισσεύητε، من غير إضافة مفعول مثل «في المواهب». وأبقيت «المواهب الروحية» في المتن بوصفها القراءة السياقية، مع حفظ اتساع اللفظ اليوناني في الحاشية.
