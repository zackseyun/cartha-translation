  text: Διώκετε τὴν ἀγάπην, ζηλοῦτε δὲ τὰ πνευματικά, μᾶλλον δὲ ἵνα προφητεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: ar
  text: اسْعَوْا وراءَ المحبة، وارغبوا بشدة في الأمور الروحية، ولا سيما أن تتنبأوا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بل بالأحرى أن تتنبأوا». ويمكن أن تُفهم «الأمور الروحية» أيضًا بمعنى «المواهب الروحية»؛ فالعبارة اليونانية أوسع من لفظ «المواهب»، لكن السياق يركّز على ما يمنحه الروح في الكنيسة.'
    reason: lexical_and_syntactic_alternatives
lexical_decisions:
- source_word: Διώκετε
  choice: اسْعَوْا وراءَ
  rationale: ينقل معنى الملاحقة الجادة والمستمرة في صيغة الأمر، وهو أقوى من مجرد «اطلبوا».
- source_word: τὴν ἀγάπην
  choice: المحبة
  rationale: المقابل العربي الطبيعي المستقر، ويحافظ على الصلة المباشرة بموضوع الأصحاح السابق.
- source_word: ζηλοῦτε
  choice: ارغبوا بشدة في
  rationale: يعبّر بوضوح عن الغيرة الإيجابية والرغبة الحارة المقصودة بالفعل اليوناني.
- source_word: τὰ πνευματικά
  choice: الأمور الروحية
  rationale: يحافظ على سعة الصفة اليونانية المحايدة المجموعة، من غير تقييدها صراحةً بـ«المواهب»، مع أن السياق يركّز على مظاهر يمنحها الروح في الكنيسة.
- source_word: μᾶλλον δὲ
  choice: ولا سيما
  rationale: صياغة عربية طبيعية تؤدي معنى التفضيل وزيادة التركيز على النبوة، من غير جعلها الخيار الوحيد.
- source_word: ἵνα προφητεύητε
  choice: أن تتنبأوا
  rationale: يحافظ على تركيب ἵνα مع صيغة الاحتمال/الغرض بوصفه مضمون الرغبة المقصودة، ويستخدم المصطلح الكتابي المألوف.
theological_decisions:
- issue: نطاق τὰ πνευματικά
  choice: الأمور الروحية
  alternative: المواهب الروحية
  rationale: العبارة اليونانية أوسع لفظًا من «المواهب»، ولذلك تُركت على سعتها، بينما يوضّح السياق أن الحديث منصبّ على مظاهر الروح وعطاياه في اجتماع الكنيسة.
- issue: قوة تفضيل النبوة
  choice: ولا سيما أن تتنبأوا
  alternative: بل بالأحرى أن تتنبأوا
  rationale: تنقل أولوية النبوة في السياق مع إبقاء احتمال فهم μᾶλλον δὲ على أنه تفضيل أقوى؛ وتُذكر الصياغة البديلة في الحاشية حفظًا للتوتر الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «اسعوا وراء» لإبراز قوة الأمر، و«الأمور الروحية» للمحافظة على الاتساع الحقيقي للفظ اليوناني، مع حاشية تبيّن المعنى السياقي والبديل في تركيب التفضيل.
