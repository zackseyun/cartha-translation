  text: There are perhaps many kinds of languages in the world[a], and none is without meaning.
translation:
  language: ar
  text: لعلَّ في العالم أنواعًا كثيرة من اللغات[a]، وليس منها ما هو بلا دلالة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لعلَّ في العالم أنواعًا كثيرة من الأصوات، وليس شيء منها بلا صوت».'
    reason: تحفظ هذه الصياغة المعنى الأوسع لـ φωνῶν والصورة الحرفية لـ ἄφωνον؛ إذ يمكن أن تدل اللفظتان على «الأصوات» و«ما بلا صوت»، مع أن السياق يرجح اللغات ودلالتها.
lexical_decisions:
- source_word: τοσαῦτα
  choice: كثيرة
  rationale: تفيد كثرة العدد من غير تحديده، وهذه صياغة عربية طبيعية تلائم اقترانها بالتعبير الاحتمالي εἰ τύχοι.
- source_word: εἰ τύχοι
  choice: لعلَّ
  rationale: تنقل النبرة الاحتمالية أو التقريبية للتعبير اليوناني في عبارة عربية موجزة وطبيعية.
- source_word: γένη
  choice: أنواعًا
  rationale: تقابل معنى الأصناف أو الأنواع مباشرة، وتناسب سياق تنوع الكلام.
- source_word: φωνῶν
  choice: من اللغات
  rationale: يمكن أن تعني اللفظة أصواتًا أو أصواتًا بشرية أو لغات؛ واختيار «اللغات» في المتن يلائم السياق المباشر المتعلق بالكلام المفهوم، مع حفظ المعنى الأوسع في الحاشية.
- source_word: ἐν κόσμῳ
  choice: في العالم
  rationale: ترجمة مباشرة وطبيعية للإشارة إلى العالم عمومًا.
- source_word: οὐδὲν ἄφωνον
  choice: ليس منها ما هو بلا دلالة
  rationale: 'اللفظة ἄφωνον تعني حرفيًا ما لا صوت له، لكن تقابلها هنا مع أنواع اللغات يرجح الدلالة السياقية: لا نوع منها يخلو من مدلول مفهوم؛ وتحفظ الحاشية الصورة الحرفية.'
