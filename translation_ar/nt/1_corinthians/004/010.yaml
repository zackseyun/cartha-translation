source:
  edition: SBLGNT
  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: ar
  text: نَحْنُ حَمْقَى مِنْ أَجْلِ الْمَسِيحِ[a]، أَمَّا أَنْتُمْ فَحُكَمَاءُ فِي الْمَسِيحِ[b]؛ نَحْنُ ضُعَفَاءُ، أَمَّا أَنْتُمْ فَأَقْوِيَاءُ؛ أَنْتُمْ مُكَرَّمُونَ[c]، أَمَّا نَحْنُ فَمُهَانُونَ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «بسبب المسيح». فالعبارة اليونانية قد تدل على السبب أو على كون الأمر من أجل المسيح.'
    reason: lexical_alternative
  - marker: b
    text: «في المسيح» تعبير مألوف عند بولس، وقد أُبقي هنا من غير إعادة صياغة تفسيرية.
    reason: lexical_alternative
  - marker: c
    text: يُرجَّح أن «مكرَّمون» و«مهانون» يشيران هنا إلى المكانة والكرامة أو الخزي في نظر الناس، لا إلى مشاعر داخلية فحسب.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: حَمْقَى
  rationale: تنقل حدة الوصف اليوناني وتحافظ على المقابلة البلاغية المباشرة مع «حكماء»، من غير تحويل الصفة إلى معنى تجريدي.
- source_word: διὰ Χριστόν
  choice: مِنْ أَجْلِ الْمَسِيحِ
  rationale: صياغة عربية طبيعية تحتمل معنى السبب ومعنى العمل لأجل شخص، كما تحتمله διά مع حالة النصب في هذا السياق.
- source_word: φρόνιμοι
  choice: حُكَمَاءُ
  rationale: أوضح مقابل عربي لـ«حمقى»، ويحفظ التوازي والنبرة التهكمية في العبارة.
- source_word: ἐν Χριστῷ
  choice: فِي الْمَسِيحِ
  rationale: تحافظ على التعبير البولسي المألوف بدل تفسيره أو إعادة صياغته بما يزيل سعته الدلالية.
- source_word: ἀσθενεῖς / ἰσχυροί
  choice: ضُعَفَاءُ / أَقْوِيَاءُ
  rationale: مقابلة عربية مباشرة تحفظ إيقاع الجملة واتساع الدلالة، فلا تقصر الضعف أو القوة على الجانب الجسدي أو الاجتماعي وحده.
- source_word: ἔνδοξοι / ἄτιμοι
  choice: مُكَرَّمُونَ / مُهَانُونَ
  rationale: تنقل المقابلة المتعلقة بالمكانة العلنية والكرامة الاجتماعية بعبارة واضحة ومتوازنة.
- source_word: ἡμεῖς / ὑμεῖς
  choice: نَحْنُ / أَنْتُمْ
  rationale: أُبقي الضميران الظاهران لأنهما توكيديان في اليونانية ومحوريان في المقابلة الحادة بين بولس ورفاقه والمخاطَبين.
theological_decisions:
- issue: ترجمة Χριστός
  choice: الْمَسِيح
  alternative: المسيح بوصفه اسمًا عَلَمًا مجردًا من دلالته اللقبية
  rationale: يحفظ المقابل العربي دلالة اللقب المسياني في الموضعين من غير إدخال تفسير مذهبي زائد.
- issue: النبرة التهكمية في المقابلة
  choice: إبقاء العبارات المباشرة كما وردت، من غير إضافة مثل «في زعمكم»
  alternative: التصريح بأن حكمة المخاطَبين وقوتهم وكرامتهم مزعومة
  rationale: السياق يدل على التهكم، لكن النص اليوناني يعبّر عنه بالمقابلة نفسها؛ لذلك لا ينبغي حسمه بإضافة تفسير غير ملفوظ.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة، مع توازٍ إيقاعي يحاكي المقابلات الثلاث في اليونانية. استُعمل «أما... فـ» لإظهار قوة δέ المتكررة، وأُبقيت المفارقة اللاهوتية والبلاغية بلا شرح داخل المتن.
