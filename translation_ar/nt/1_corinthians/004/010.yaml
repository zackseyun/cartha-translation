review_pass:
  verdict: approve
  source_fidelity: الترجمة تحفظ البنية التقابلية المؤكَّدة في اليونانية بين «نحن» و«أنتم»، وتنقل الصفات الست من غير تضييق لمعنى الضعف والقوة أو إضافة تفسير للنبرة التهكمية. «من أجل المسيح» تمثيل سليم لـδιὰ Χριστόν، و«في المسيح» يحافظ على العبارة البولسية ἐν Χριστῷ.
  naturalness: الصياغة فصيحة معاصرة وواضحة، والتوازي باستخدام «أمّا... فـ» طبيعي ومناسب للقوة الجدلية المتكررة لـδέ. اختيار «حمقى/حكماء» و«ضعفاء/أقوياء» و«مكرّمون/مهانون» متوازن إيقاعيًا ودلاليًا.
  terminology: «المسيح» مناسب بوصفه لقبًا في الموضعين. و«مكرّمون/مهانون» ينقلان تباين المكانة العلنية والعار الاجتماعي من دون حصره في الشعور الشخصي. حواشي الترجمة مرتبطة بمواضعها وتعكس الاحتمال الدلالي والسياق الاجتماعي بدقة.
