  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: ar
  text: ونكدّ، عاملين بأيدينا نحن. وحين نُشتَم نبارك، وحين نُضطهَد نحتمل.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοπιῶμεν
  choice: نكدّ
  rationale: يفيد بذل جهد شاقّ ومتعب، لا مجرد أداء عمل، و«نكدّ» تعبير عربي موجز وطبيعي.
- source_word: ἐργαζόμενοι
  choice: عاملين
  rationale: اسم حال يبيّن كيفية الكدّ، ويحافظ على الصلة المباشرة بالعمل اليدوي من غير إضافة غايته.
- source_word: ταῖς ἰδίαις χερσίν
  choice: بأيدينا نحن
  rationale: يحفظ توكيد ἰδίαις على أن الرسل أنفسهم كانوا يقومون بالعمل اليدوي.
- source_word: λοιδορούμενοι
  choice: حين نُشتَم
  rationale: ينقل صيغة المبني للمجهول وقوة الإساءة اللفظية بعبارة عربية واضحة، ويعبّر «حين» طبيعيًا عن الظرف الملازم للاستجابة.
- source_word: εὐλογοῦμεν
  choice: نبارك
  rationale: يحفظ المصطلح الكتابي المحوري والتقابل بين الإساءة والرد بالبركة.
- source_word: διωκόμενοι
  choice: حين نُضطهَد
  rationale: السياق يدل على الاضطهاد العدائي، وصيغة المبني للمجهول تقابل الأصل.
- source_word: ἀνεχόμεθα
  choice: نحتمل
  rationale: ينقل معنى الصبر على المعاملة العدائية من غير إضافة مفعول غير مذكور صراحة في اليونانية.
theological_decisions:
- issue: الاستجابة الأخلاقية لسوء المعاملة
  choice: 'صيغت العبارة بوصفها وصفًا مستمرًا لسلوك الرسل: يباركون عند شتمهم ويحتملون عند اضطهادهم.'
  alternative: صياغتها في صورة وصية عامة مباشرة إلى المؤمنين.
  rationale: النص يصف ممارسة رسولية في أفعال مضارعة متقابلة، ولا يورد هنا أمرًا صريحًا؛ لذلك حُفظت قوته الأخلاقية من غير تحويل الوصف إلى وصية نحوية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدم التشكيل الجزئي في «نُشتَم» و«نُضطهَد» لإزالة احتمال قراءة الفعلين على أنهما مبنيان للمعلوم. لم تُنقل الحاشية الإنجليزية لأنها لا تمثل بديلًا متعلقًا بموضع علامتها، ولأن البديل المذكور فيها يكرر معنى العبارة التالية بدل أن يشرح κοπιῶμεν.
