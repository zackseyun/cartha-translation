  rationale: عُدِّل فعل «أخذ» إلى «تلقّى» في المواضع الثلاثة ليعكس بدقة أكبر مقابلة الأصل بين ما يملكه الإنسان وما يتلقاه، من غير إضافة تفسير يحدد نوع هذه العطايا أو مصدرها. وحُفظت بنية الأسئلة، والتوكيد في «فعلًا»، ودلالة التظاهر في «كأنك لم تتلقَّه».
