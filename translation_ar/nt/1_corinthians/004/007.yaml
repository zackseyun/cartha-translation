  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: ar
  text: فمَن الذي يميِّزك[a]؟ وأيُّ شيءٍ لديك لم تتلقَّه؟ وإن كنت قد تلقيته فعلًا، فلماذا تفتخر كأنك لم تتلقَّه؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «يجعلك مختلفًا». يمكن أن يعني الفعل اليوناني «يميِّز» أو «يفرِّق» أو «يجعل مختلفًا».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: فمَن الذي يميِّزك؟
  rationale: ينقل الفعل المتعدي διακρίνω بمعناه المفتوح بين التمييز وإحداث الاختلاف، ويحافظ على قوة السؤال البلاغي. وتؤدي الفاء معنى γάρ بوصفه تعليلًا لما سبق.
- source_word: τί δὲ ἔχεις ὃ οὐκ ἔλαβες
  choice: وأيُّ شيءٍ لك لم تأخذه؟
  rationale: صياغة عربية طبيعية تحافظ على عموم السؤال وعلى مقابلة الامتلاك بالتلقي، من غير حصر المقصود في المواهب الروحية.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: وإن كنت قد أخذته فعلًا
  rationale: تحافظ أداة الشرط على صيغة الأصل، وتبرز «فعلًا» النبرة التوكيدية التي يحملها καὶ في هذا السياق. والضمير عائد إلى الشيء المذكور في السؤال السابق.
- source_word: τί καυχᾶσαι
  choice: فلماذا تفتخر
  rationale: «تفتخر» المقابل العربي الطبيعي للفعل البولسي καυχάομαι، وصيغة المضارع تلائم السلوك أو الموقف الجاري الذي يوبخه بولس.
- source_word: ὡς μὴ λαβών
  choice: كأنك لم تأخذه
  rationale: 'تنقل العبارة الحال المخالف للواقع: يتصرف المخاطب كما لو أن ما لديه لم يكن قد تلقاه.'
theological_decisions:
- issue: نطاق ما تلقاه المخاطب وأساس تميزه
  choice: أُبقيت ألفاظ الآية عامة، بحيث تشمل ما لدى المخاطب من عطايا أو مكانة أو مزايا من غير تحديد.
  alternative: حصر الكلام في المواهب الروحية أو أدوار الخدمة، أو توسيعه صراحة ليشمل كل قدرة وبركة.
  rationale: السياق القريب يتناول الخدمة الرسولية والتحزب والافتخار، لكن صياغة بولس نفسها عامة؛ لذلك لا ينبغي للترجمة أن تضيقها أو توسعها بتفسير مضاف.
translation_notes:
  register: عربية فصحى حديثة واضحة وذات نبرة وقورة. حوفظ على تتابع الأسئلة البلاغية، وعلى الشرط والتوكيد في الجملة الثالثة، مع تجنب الألفاظ الطائفية أو التفسيرية الزائدة.
