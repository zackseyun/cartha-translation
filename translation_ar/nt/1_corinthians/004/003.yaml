  source_fidelity: يحافظ المسودّة على معنى ἀνακρίνω بوصفه فحصًا أو تمحيصًا، وعلى المقابلة بين فحص المخاطَبين والفحص البشري، مع حاشية مناسبة لعبارة «يوم بشري». لكن التعبير الختامي «لا أفحص نفسي حتى» غير سليم في العربية ولا ينقل οὐδέ بوضوح.
  naturalness: الافتتاح «فأقلّ شيء عندي أن...» مفهوم، لكنه متكلّف قليلًا في العربية المعاصرة. كما أن جعل الفعل المبني للمعلوم في الموضعين ممكن، لكن «أن أخضع لفحصكم أو لفحص محكمة بشرية» أكثر سلاسة ويعكس تلقي بولس للفحص. الصياغة المنقحة فصيحة وواضحة.
  terminology: «فحص» اختيار سليم ومتسق لترجمة ἀνακρίνω، إذ لا يفرض معنى الحكم النهائي. و«محكمة بشرية» ترجمة اصطلاحية مقبولة لـἀνθρωπίνης ἡμέρας في ضوء السياق وسجلّ التدقيق الإنجليزي، مع إبقاء المعنى الحرفي في الحاشية.
