base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: ar
  text: أَمَّا أَنَا، فَلَا أَهَمِّيَّةَ تُذْكَرُ عِنْدِي لِأَنْ أَخْضَعَ لِفَحْصِكُمْ أَنْتُمْ أَوْ لِفَحْصِ مَحْكَمَةٍ بَشَرِيَّةٍ[a]؛ بَلْ لَا أَفْحَصُ نَفْسِي أَنَا أَيْضًا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا في اليونانية: «يومٌ بشريّ»، وهو تعبير يشير إلى الحكم أو التقييم البشري.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ δὲ
  choice: أَمَّا أَنَا ... عِنْدِي
  rationale: ينقل دلالة الإحالة الشخصية في ضمير المتكلم مع قوة الانتقال التي تفيدها δέ، بصياغة عربية طبيعية.
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: فَأَقَلُّ شَيْءٍ
  rationale: تعبير عربي واضح يفيد أن الأمر بالغ الضآلة في نظر بولس، ويحافظ على قوة صيغة ἐλάχιστον.
- source_word: ἵνα ὑφ’ ὑμῶν ἀνακριθῶ
  choice: أَنْ تَفْحَصُونِي أَنْتُمْ
  rationale: ينقل مضمون ما يعدّه بولس قليل الأهمية، ويُظهر جهة الفعل كما في النص اليوناني. واختيار «تفحصوني» يدل على التمحيص والتقييم دون أن يوحي بالضرورة بحكم نهائي.
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: أَوْ تَفْحَصَنِي مَحْكَمَةٌ بَشَرِيَّةٌ
  rationale: يؤدي المعنى الاصطلاحي لعبارة «يوم بشري» بوصفها هيئة أو مناسبة للحكم البشري، مع إبقاء شرح اللفظ الحرفي في الحاشية.
- source_word: ἀλλ’ οὐδὲ
  choice: بَلْ لَا ... حَتَّى
  rationale: '«بل» تحفظ الانتقال الاستدراكي، و«حتى» بعد النفي تنقل معنى οὐδέ التصاعدي: لا يفعل ذلك حتى بنفسه.'
- source_word: ἐμαυτὸν ἀνακρίνω
  choice: أَفْحَصُ نَفْسِي
  rationale: يحافظ على الضمير الانعكاسي وعلى الترابط المعجمي بتكرار الفعل المختار لترجمة ἀνακρίνω.
theological_decisions:
- issue: دلالة ἀνθρωπίνης ἡμέρας
  choice: مَحْكَمَةٌ بَشَرِيَّةٌ
  alternative: يَوْمٌ بَشَرِيٌّ؛ حُكْمٌ بَشَرِيٌّ
  rationale: التركيب اليوناني حرفيًا «يوم بشري»، لكنه في السياق يشير إلى مناسبة أو هيئة للتقييم البشري في مقابل يوم الرب وحكمه. «محكمة بشرية» توصل الدلالة الاصطلاحية بلا تحويل العبارة إلى تقرير عن الزمن، والحاشية تحفظ الصورة الأصلية.
- issue: دلالة ἀνακρίνω
  choice: فَحَصَ
  alternative: حَكَمَ؛ حَقَّقَ مَعَ
  rationale: الفعل يدل هنا على الفحص والتدقيق أو التقييم، لا بالضرورة على إصدار الحكم النهائي. لذلك يحفظ «فحص» التمييز الممكن عن ألفاظ الحكم في السياق القريب، من غير حسم زائد لطبيعة الفحص.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. استُخدم الفعل «فحص» في الموضعين للمحافظة على التكرار اليوناني، ووُضعت علامة الحاشية [a] في المتن عند العبارة الاصطلاحية.
