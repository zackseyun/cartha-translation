  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: ar
  text: فحتى إن كان لكم في المسيح مرشدون لا يُحصَون[a]، فليس لكم آباء كثيرون؛ فإني في المسيح يسوع أنجبتكم بالبشارة[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «عشرة آلاف»؛ ويُستعمل اللفظ اليوناني أيضًا للدلالة على عدد بالغ الكثرة.'
    reason: lexical_alternative
  - marker: b
    text: «أنجبتكم» تعبير مجازي؛ أي صرت أبا لكم إذ أتيتم إلى الإيمان بالبشارة.
    reason: lexical_alternative
  - marker: c
    text: «المرشدون» ترجمة للفظ يوناني يدل على مشرف أو مرافق للصبي يتولى رعايته وتأديبه، لا على معلم صفّ في المقام الأول.
    reason: cultural_note
lexical_decisions:
- source_word: μυρίους
  choice: لا يُحصَون
  rationale: اللفظ يعني حرفيًا «عشرة آلاف»، لكنه يُستعمل هنا للمبالغة في الكثرة، فتؤدي العبارة العربية القوة البلاغية مع إبقاء المقابلة مع «آباء كثيرون».
- source_word: παιδαγωγοὺς
  choice: مرشدون
  rationale: كان اللفظ في البيئة اليونانية الرومانية يدل على من يتولى الإشراف على الصبي وتهذيبه ومرافقته، لا على معلم الصف أساسًا؛ و«مرشدون» لفظ طبيعي لا يحصر الدور في التعليم.
- source_word: ἐν Χριστῷ
  choice: في المسيح
  rationale: أُبقي حرف الجر والتعبير البولسي الموجز، وتُرجم اللقب Χριστός بصيغته العربية الراسخة «المسيح».
- source_word: πατέρας
  choice: آباء
  rationale: يحفظ اللفظ استعارة الأبوة الصريحة من غير إضافة تفسيرية مثل «روحيين».
- source_word: διὰ τοῦ εὐαγγελίου
  choice: بواسطة البشارة
  rationale: تدل διά مع المضاف إليه على الوسيلة؛ و«البشارة» تنقل معنى الخبر السار في لفظ عربي كتابي واضح.
- source_word: ἐγέννησα
  choice: ولدتكم
  rationale: يحفظ هذا الاختيار صورة الولادة القوية والصريحة في الأصل، بدل تخفيفها إلى مجرد «صرت أبا لكم»، مع إيضاح مجازيتها في الحاشية.
theological_decisions:
- issue: استعارة بولس للأبوة والولادة
  choice: الإبقاء على العبارة «أنا ولدتكم» بوصفها استعارة صريحة مرتبطة بالبشارة
  alternative: «صرت أبا لكم» أو «ولدتكم روحيًا»
  rationale: الأصل يستعمل فعل الولادة نفسه، فتُحفظ قوة الصورة والتوتر فيها، من غير إضافة «روحيًا» إلى المتن أو تحميلها دلالات كهنوتية أو أسرارية غير مصرّح بها.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. اختيرت «مرشدون» لتجنب الفهم المدرسي الضيق لكلمة παιδαγωγοί، وأُبقيت استعارة الولادة في المتن لقربها من اليونانية، مع شرح موجز في الحاشية.
