base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: ar
  text: مَاذَا تُرِيدُونَ؟ أَأَجِيءُ إِلَيْكُمْ بِعَصًا، أَمْ بِالْمَحَبَّةِ وَرُوحِ الْوَدَاعَةِ؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أن تُفهم العبارة أيضًا: «بالمحبة ووداعة الروح». وقد تشير «روح الوداعة» إلى طبع بولس الوديع، ويفهمها بعضهم إشارة ضمنية إلى عمل الروح القدس.'
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: مَاذَا تُرِيدُونَ؟
  rationale: سؤال بلاغي مباشر يحفظ قوة التحدي في اليونانية، و«تريدون» تعبير عربي فصيح وطبيعي.
- source_word: ἐν ῥάβδῳ
  choice: بِعَصًا
  rationale: تحفظ «عصًا» الصورة الحسية والاستعارة التأديبية في ῥάβδος من غير أن تستبدلها بتفسير مثل «بالتأديب».
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: أَأَجِيءُ إِلَيْكُمْ
  rationale: صيغة استفهامية تداولية مناسبة للسؤال اليوناني ذي فعل المضارع الالتزامي، وتحافظ على معنى المداولة والتحدي.
- source_word: ἢ
  choice: أَمْ
  rationale: «أم» تلائم الاستفهام الذي يعرض خيارين متقابلين.
- source_word: ἐν ἀγάπῃ
  choice: بِالْمَحَبَّةِ
  rationale: الباء تحافظ على التوازي مع «بعصًا» وتعبّر عن الهيئة أو الوسيلة، و«المحبة» المقابل المألوف لـἀγάπη.
- source_word: πνεύματί τε πραΰτητος
  choice: وَرُوحِ الْوَدَاعَةِ
  rationale: تحفظ اللفظ الصريح πνεῦμα والإضافة الدالة على الصفة في πραΰτης، مع صياغة عربية طبيعية وتجنّب حسم ما إذا كانت «الروح» مزاج بولس أم إشارة ضمنية إلى عمل الروح القدس.
theological_decisions:
- issue: دلالة πνεύματι في عبارة πνεύματί τε πραΰτητος
  choice: «روح الوداعة»، وهي في السياق أقرب إلى هيئة بولس أو موقفه الوديع
  alternative: «روح الوداعة» بمعنى الروح القدس أو عمله في إحداث الوداعة
  rationale: 'السياق يقابل بين طريقتين لمجيء بولس: الحزم التأديبي، أو المحبة والوداعة. وعدم وجود أداة تعريف مع πνεῦμα لا يفرض إشارة صريحة إلى الروح القدس. أبقت الصياغة العربية «روح الوداعة» الاحتمال مفتوحًا بدل حسمه في المتن.'
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أأجيء» للحفاظ على السؤال التداولي المباشر، و«بعصًا» للإبقاء على الصورة التأديبية من غير تفسير زائد. ضُبط النص بالشكل الجزئي الكامل هنا لتيسير القراءة، ويمكن مواءمة مقدار التشكيل مع سياسة النشر العامة.
