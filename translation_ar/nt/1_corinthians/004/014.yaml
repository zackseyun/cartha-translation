  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Οὐκ ἐντρέπων ὑμᾶς γράφω ταῦτα, ἀλλ’ ὡς τέκνα μου ἀγαπητὰ ⸀νουθετῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: ar
  text: لستُ أكتب هذه الأمور لأُخجلكم[a]، بل أعظكم[b] كأولادي الأحباء.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لأجعلكم تخجلون».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أحذّركم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: لأُخجلكم
  rationale: ينقل معنى إحداث الخجل أو العار، وتوضح صيغة الغاية المقصد المنفي من الكتابة، مع إبقاء بديل في الحاشية.
- source_word: γράφω ταῦτα
  choice: أكتب هذه الأمور
  rationale: يحافظ على المضارع وعلى جمع اسم الإشارة، بصياغة عربية طبيعية.
- source_word: ἀλλ’
  choice: بل
  rationale: تلائم الانتقال من نفي الغرض الأول إلى بيان المقصد الإيجابي.
- source_word: ὡς
  choice: كـ
  rationale: تحافظ على علاقة التشبيه أو الصفة التي يقدم بها بولس وعظه.
- source_word: τέκνα μου ἀγαπητὰ
  choice: أولادي الأحباء
  rationale: تعبير عربي طبيعي دافئ يحفظ علاقة البنوة ولا يقصرها على الذكور، وينقل قوة ἀγαπητά.
- source_word: νουθετῶν
  choice: أعظكم
  rationale: يفيد النصح التصحيحي والتنبيه الأخلاقي مع نبرة أبوية محبة، دون جعله مجرد تعليم أو تهديد.
theological_decisions:
- issue: نبرة التصحيح الرعوي
  choice: بل أعظكم كأولادي الأحباء
  alternative: بل أحذّركم كأولادي الأحباء
  rationale: يحفظ «أعظكم» اجتماع النصح والتصحيح، بينما توضح الحاشية إمكان إبراز عنصر التحذير؛ ووصف المخاطَبين بالأولاد الأحباء يصون حنان السياق من غير إضعاف قوة التقويم.
- issue: علاقة الجملة الثانية بالفعل «أكتب»
  choice: أعظكم
  alternative: أكتب... لأعظكم
  rationale: يحافظ الاختيار على البنية الحالية لاسم الفاعل اليوناني المقابل للفعل الرئيس، ولا يحوّلها صراحة إلى غاية ثانية، مع بقاء المعنى العربي واضحًا.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعمل «أولادي» استعمالًا جمعيًا شاملًا في سياق البنوة الروحية، ووضعت علامتا الحاشيتين في المتن عند اللفظين المعنيين.
