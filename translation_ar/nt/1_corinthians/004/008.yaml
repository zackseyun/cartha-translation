source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: ar
  text: لقد شبعتم بالفعل! لقد اغتنيتم بالفعل! وبغيرنا حكمتم كملوك! ويا ليتكم حكمتم كملوك حقًّا، لكي نملك نحن أيضًا معكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يتكلم بولس بتهكم: فالكورنثيون يتصرفون كأنهم قد بلغوا الشبع والغنى والمُلك بالفعل. وعبارة «ويا ليتكم حكمتم كملوك حقًّا» تعبّر عن تمني أن يكون مُلكهم واقعًا، لكي يملك بولس معهم أيضًا.'
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: من الآن
  rationale: يحفظ التشديد الزمني المتكرر في صدر العبارتين، ويؤدي هنا معنى «الآن بالفعل» ضمن نبرة بولس التهكمية.
- source_word: κεκορεσμένοι ἐστέ
  choice: شبعتم
  rationale: ينقل حالة الامتلاء الناتجة عن فعل مكتمل بعبارة عربية طبيعية، ويحافظ على صورة الشبع بدل تعميمها إلى الرضا.
- source_word: ἐπλουτήσατε
  choice: استغنيتم
  rationale: يحفظ القوة الفعلية الدالة على صيرورتهم أغنياء، لا مجرد وصفهم بأنهم أغنياء.
- source_word: χωρὶς ἡμῶν
  choice: بدوننا
  rationale: ينقل بوضوح أنهم، بحسب تصورهم المتهكم عليه، بلغوا الملك مستقلين عن الرسل.
- source_word: ἐβασιλεύσατε
  choice: ملكتم
  rationale: فعل عربي موجز وصريح يحفظ صورة المُلك والحكم الملكي من غير إضافة معنى البدء غير الموجود صراحة في اليونانية.
- source_word: ὄφελόν γε
  choice: وليتكم ... حقًّا
  rationale: «ليت» تؤدي التمني غير المتحقق، و«حقًّا» تحفظ قوة γε وتبرز الانتقال من الادعاء التهكمي إلى التمني.
- source_word: ἵνα
  choice: لكي
  rationale: تؤدي علاقة الغاية الناتجة عن التمني بصورة طبيعية وواضحة.
- source_word: συμβασιλεύσωμεν
  choice: نملك ... معكم
  rationale: يحفظ معنى المشاركة في المُلك الذي يدل عليه المقطع συν-، وكذلك صيغة الاحتمال التابعة للتمني في السياق.
theological_decisions:
- issue: نبرة العبارات الثلاث الأولى
  choice: صياغتها كإعلانات تهكمية مع علامات تعجب
  alternative: قراءتها أو صياغتها كمدح حرفي مباشر
  rationale: السياق في 1 كورنثوس 4:7–13 يقابل تصور الكورنثيين عن بلوغهم الامتلاء والغنى والملك بحال الرسل المتألمين. علامات التعجب توضح النبرة البلاغية من غير إدخال تفسير مذهبي في المتن.
- issue: دلالة لغة المُلك
  choice: 'الإبقاء على صورة المُلك: «ملكتم» و«نملك معكم»'
  alternative: تخفيفها إلى النجاح أو النفوذ أو التفوق
  rationale: الفعلان βασιλεύω وσυμβασιλεύω يحملان صورة ملكية صريحة وربما إيحاءً أخرويًا؛ لذلك ينبغي عدم تسطيح الصورة إلى منزلة اجتماعية عامة.
- issue: العلاقة بين التهكم والتمني الحقيقي
  choice: حفظ التوتر بعبارة «وليتكم ملكتم حقًّا»
  alternative: اعتبار العبارة تهكمًا محضًا أو تمنيًا مجردًا من التهكم
  rationale: العبارة يمكن أن تجمع بين استمرار المفارقة ورغبة بولس الحقيقية في بلوغ الملك المشترك؛ والصياغة لا تحسم أحد البعدين على حساب الآخر.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. حافظت الصياغة على التوازي والتكرار والصورة الملكية، واستعملت علامات التعجب لإظهار التهكم الذي يثبته السياق. وُضعت الحاشية [a] في المتن وشرحت النبرة وقدمت بديلًا أكثر صراحة لصيغة التمني.
