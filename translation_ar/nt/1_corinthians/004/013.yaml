source:
  edition: SBLGNT
  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: ar
  text: وإذ يُساء إلى سمعتنا[a]، نناشد؛ وقد صرنا كأننا نفاية العالم، وحثالة كل شيء[b]، إلى الآن.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وإذ يُفتَرى علينا، نتوسل». يمكن للفعل اليوناني أن يعني «نناشد» أو «نحث» أو «نشجّع»؛ ويصف هنا على الأرجح ردًّا استعطافيًا لا يقوم على الانتقام عند التعرّض للإساءة.'
    reason: lexical_alternative
  - marker: b
    text: الكلمتان المترجمتان «نفاية» و«حثالة» نادرتان وشديدتا التعبير. وقد تشيران إلى ما يُزال أو يُكشط في التنظيف، فتؤكدان شدة الاحتقار الاجتماعي؛ وربما تحملان أيضًا إيحاءات طقسية، لكن ذلك غير محسوم في هذا السياق.
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: وإذ يُشهَّر بنا
  rationale: اسم فاعل مبني للمجهول يدل على التعرّض لكلام مسيء يلطخ السمعة؛ والصياغة الظرفية تحافظ على علاقته بالفعل التالي.
- source_word: παρακαλοῦμεν
  choice: نناشد
  rationale: الفعل واسع الدلالة، ويمكن أن يعني نحث أو نناشد أو نعزّي. في سياق مقابلة الإساءة برد غير انتقامي، تنقل «نناشد» معنى الخطاب الاستعطافي من غير إضافة «بلطف»، وهي غير مصرّح بها في اليونانية.
- source_word: ὡς
  choice: كأننا
  rationale: تُظهر أداة التشبيه ولا تحوّل العبارة إلى تقرير هوية حرفية.
- source_word: περικαθάρματα
  choice: نفاية
  rationale: يدل اللفظ النادر على ما يُزال في التنظيف ويُطرح؛ و«نفاية» عربية معاصرة قوية تنقل معنى الاحتقار والنبذ.
- source_word: τοῦ κόσμου
  choice: العالم
  rationale: إضافة «نفاية» إلى «العالم» تحفظ علاقة المضاف والمضاف إليه في الأصل.
- source_word: ἐγενήθημεν
  choice: صرنا
  rationale: تنقل التحول إلى حالة مستمرة حتى زمن الكتابة، وهو ما توضحه عبارة «إلى الآن».
- source_word: πάντων
  choice: كل شيء
  rationale: يحفظ الاتساع المقصود ولا يضيّقه إلى الأشخاص وحدهم.
- source_word: περίψημα
  choice: قذارة
  rationale: اللفظ النادر يشير إلى ما يُمسح أو يُكشط بوصفه بقايا حقيرة؛ و«قذارة» تحافظ على قوة صورة الازدراء، مع شرح خلفيتها في الحاشية.
- source_word: ἕως ἄρτι
  choice: إلى الآن
  rationale: تعبير زمني طبيعي ودقيق يدل على استمرار الحال إلى لحظة الكتابة.
theological_decisions:
- issue: دلالة اللفظين περικαθάρματα وπερίψημα
  choice: نقلهما بلغة قوية عن النفاية والقذارة الاجتماعية من غير إدخال فكرة الضحية التكفيرية في المتن
  alternative: تفسيرهما في المتن على أنهما ضحايا طقسية أو فدائية، أو نقلهما حرفيًا بصور الكنس والكشط
  rationale: السياق المباشر يبرز إذلال الرسل واحتقار الناس لهم. وقد تحمل الكلمتان خلفية متصلة بما يُزال في التطهير، وربما باستعمالات طقسية مختلف عليها، لكن الأصل لا يحسم تلك الدلالة التقنية هنا؛ لذلك تُحفظ الإشارة المحتملة في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. حُفظ التوازي القوي بين عبارتي الإذلال، وتُرك مدى الدلالة الطقسية المحتملة مفتوحًا في الحاشية. وُضعت علامتا الحاشيتين عند العبارتين المعنيتين في المتن.
