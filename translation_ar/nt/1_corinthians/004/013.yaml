  rationale: استُبدلت عبارة «يُشهَّر بنا» بعبارة أوسع وأدق في نقل الإساءة إلى السمعة، واستُبدلت «قذارة» بـ«حثالة» لتدل على بقايا مطروحة محتقرة لا على مجرد الاتساخ. كما نُقلت علامات الحواشي إلى مواضعها الدلالية وصُقلت صياغة الحاشية العربية دون تغيير معناها.
