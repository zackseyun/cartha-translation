  terminology: «نفاية» تنقل περικαθάρματα بصورة مناسبة، و«حثالة» تنقل περίψημα بوصفه ما هو وضيع ومطروح. لا يفرض المتن أي تفسير طقسي أو تكفيري مختلف عليه. و«نناشد» تظل ترجمة ممكنة لـ παρακαλοῦμεν في هذا السياق، من غير إضافة معنى «بلطف».
