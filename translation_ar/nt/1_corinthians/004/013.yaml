  source_fidelity: 'يُحافظ النص على بنية الأصل: مشارك مبني للمجهول ذي قيمة ظرفية، يليه فعل الاستجابة، ثم صورتا الاحتقار المتوازيتان، فالتحديد الزمني «إلى الآن». لكن «يُشهَّر بنا» أضيق من δυσφημούμενοι، إذ يوحي بالتشهير العلني خاصة، و«قذارة» تدل في العربية غالبًا على حالة الاتساخ لا على ما يُكنس أو يُزال بوصفه بقايا حقيرة.'
