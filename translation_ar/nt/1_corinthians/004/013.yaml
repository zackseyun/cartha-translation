  - severity: medium
    issue: «قذارة كل شيء» لا تنقل الصورة الاسمية للبقايا المزالة بوضوح.
    rationale: περίψημα يشير إلى ما يُكشط أو يُمسح ويُحتقر بوصفه بقايا؛ أما «قذارة» فتُفهم عادة بوصفها صفة أو حالة اتساخ. «حثالة» أوضح في الدلالة على الشيء المطروح المحتقر.
  - severity: low
