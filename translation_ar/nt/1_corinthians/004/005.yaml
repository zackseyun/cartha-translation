id: 1CO.4.5
reference: 1 Corinthians 4:5
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: ar
  text: فلا تحكموا في شيء قبل الأوان[a]، إلى أن يأتي الرب، فهو أيضًا سيُخرج إلى النور خفايا الظلام، ويكشف مقاصد القلوب[b]. وحينئذ يكون لكل واحد مدحه من الله[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «قبل الوقت»؛ فالعبارة اليونانية قد تدل على الحكم قبل الوقت الملائم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «نيات القلوب» أو «عزائم القلوب».'
    reason: lexical_alternative
  - marker: c
    text: أي إن المدح يصدر من الله عند تقويم الرب الأخير، حين يأتي ويكشف ما هو خفي.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: فلا
  rationale: تفيد النتيجة المستخلصة من السياق السابق، والفاء الاستنتاجية طبيعية وموجزة في العربية.
- source_word: μὴ πρὸ καιροῦ
  choice: لا تحكموا في شيء قبل الأوان
  rationale: يحافظ «قبل الأوان» على معنى الفعل قبل الوقت الملائم من غير أن يضيف صراحةً أن الوقت «مُعيَّن».
- source_word: τι κρίνετε
  choice: تحكموا في شيء
  rationale: ينقل سعة النهي التي تفيدها τι، مع إبقاء معنى إصدار الحكم واضحًا.
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: إلى أن يأتي الرب
  rationale: صياغة عربية طبيعية تحفظ الحد الزمني للنهي ولقب κύριος.
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: سيُخرج إلى النور خفايا الظلام
  rationale: ينقل الاستعارة الدالة على إظهار المستور، ويحفظ إضافة الخفايا إلى الظلام.
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: يكشف مقاصد القلوب
  rationale: «مقاصد» واسعة بما يكفي لتشمل الخطط والنيات من غير حصر المعنى في الدوافع النفسية.
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: يكون لكل واحد مدحه من الله
  rationale: يحافظ على البنية التي تجعل المدح نصيب كل واحد، وعلى كون مصدره الله، من غير تحويلها إلى صيغة مبنية للمجهول.
theological_decisions:
- issue: نطاق الحكم وتوقيته
  choice: النهي عن الحكم السابق لأوانه إلى مجيء الرب وكشفه ما هو خفي
  alternative: اعتبار العبارة حظرًا مطلقًا لكل تمييز أو حكم في كل سياق
  rationale: النص نفسه يقيّد النهي زمنيًا بمجيء الرب، ولذلك لا ينبغي توسيعه أو تضييقه بما يتجاوز العبارة.
- issue: هوية «الرب»
  choice: الإبقاء على اللقب «الرب» دون إضافة اسم تفسيري
  alternative: التصريح في المتن بأنه يسوع أو جعل الإشارة عامة إلى الله
  rationale: السياق البولسي يرجّح الإشارة إلى يسوع في مجيئه، لكن الترجمة تحفظ صياغة الأصل ولا تستبدل اللقب بتفسير.
- issue: مدح كل واحد من الله
  choice: 'إبقاء التعبير الإيجابي كما ورد: لكل واحد مدحه من الله'
  alternative: تحويل «المدح» إلى «الحكم» أو «الجزاء» لتعميم النتيجة
  rationale: ἔπαινος يعني المدح، وتوسيعه إلى حكم شامل يبدد التوتر اللاهوتي الحقيقي في صياغة الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعمل «قبل الأوان» لصياغة طبيعية دقيقة، و«خفايا الظلام» للحفاظ على الصورة الأصلية، مع إبقاء جميع علامات الحواشي في المتن.
