review_pass:
  verdict: revise
  source_fidelity: 'الترجمة تنقل البنية الأساسية للآية بأمانة: الإحالة إلى «هذه الأمور»، والتطبيق على بولس وأبلوس لأجل المخاطَبين، وغرض التعلّم من مثالهما، وصورة «الانتفاخ»، وسياق التحزّب. لكن تسمية العبارة اليونانية الناقصة «هذه القاعدة» تضيف توصيفًا غير مصرّح به، كما أن «على حساب الآخر» أضعف من الدلالة المباشرة لـ«ضد الآخر».'
  naturalness: العربية فصيحة واضحة عمومًا. والصياغة «لئلا ينتفخ أحد منكم للواحد ضد الآخر» طبيعية، وتحفظ علاقة التحزّب والخصومة بوضوح أكبر.
  terminology: «الإخوة» مناسبة مع الحاشية التوضيحية، و«أبلوس» و«ما هو مكتوب» و«ينتفخ» سليمة. ينبغي عدم تثبيت العبارة الناقصة بوصفها «قاعدة» في المتن، إذ قد تكون شعارًا أو صيغة مقتضبة متداولة.
  issues:
