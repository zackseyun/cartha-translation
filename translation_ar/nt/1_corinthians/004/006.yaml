  - severity: low
    issue: «على حساب الآخر» بدل الدلالة الخصومية المباشرة
    rationale: κατὰ τοῦ ἑτέρου تعني «ضد الآخر». و«على حساب» مفهومة في العربية، لكنها قد توحي بمفاضلة أو منفعة على حساب الغير بدل الاصطفاف ضدّه.
  - severity: low
    issue: الحاشية ب تصف التوسيع التفسيري بأنه حرفية قريبة
    rationale: «ألا تتجاوزوا ما هو مكتوب» يتضمن فعلاً مفهومًا في العربية لتأدية النهي، أما الصياغة الأقرب إلى شكل اليونانية الناقص فهي «لا فوق ما هو مكتوب». ينبغي بيان الفرق مع الإبقاء على إمكان فهمها نهيًا في المتن.
