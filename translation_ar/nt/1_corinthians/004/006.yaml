  rationale: حُذف الوصف التفسيري «القاعدة» من المتن لصون انفتاح العبارة اليونانية الناقصة، وعُدِّلت خاتمة الآية إلى «ضد الآخر» لتأدية دلالة κατὰ. كما نُقحت الحاشية لتمييز البنية اليونانية المقتضبة من صياغة النهي العربية اللازمة للوضوح.
