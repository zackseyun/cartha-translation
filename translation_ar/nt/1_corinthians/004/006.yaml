source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: ar
  text: 'فهذه الأمور، أيها الإخوة[a]، قد طبَّقتُها على نفسي وعلى أبلوس من أجلكم، لكي تتعلَّموا فينا هذا: «لا تتجاوزوا ما هو مكتوب»[b]، لئلا ينتفخ أحد منكم للواحد ضد الآخر.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تُفهم «الإخوة» هنا بمعنى «الإخوة والأخوات»، لأن صيغة الجمع المذكرة في اليونانية قد تُخاطَب بها جماعة تضم رجالًا ونساءً.
    reason: cultural_note
  - marker: b
    text: 'العبارة اليونانية مقتضبة، وحرفيتها قريبة من: «لا فوق ما هو مكتوب». وتُفهم في السياق نهيًا: «لا تتجاوزوا ما هو مكتوب». وقد تكون قولًا مأثورًا أو شعارًا متداولًا.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: هذه الأمور
  rationale: يحفظ صيغة الجمع وإحالتها إلى المناقشة السابقة، من غير إضافة أداة زمنية لا وجود لها في اليونانية.
- source_word: ἀδελφοί
  choice: أيها الإخوة
  rationale: ينقل صيغة النداء المذكرة في الأصل، مع بيان شمولها المحتمل للجماعة المختلطة في الحاشية.
- source_word: μετεσχημάτισα
  choice: قد طبَّقتُها
  rationale: يفيد نقل العرض السابق وتطبيقه تمثيليًا على بولس وأبلوس، بصياغة عربية واضحة لا تفرط في التفسير.
- source_word: εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: على نفسي وعلى أبلوس
  rationale: تعبير عربي طبيعي يحدد الشخصين اللذين جرى تطبيق الكلام عليهما.
- source_word: δι’ ὑμᾶς
  choice: من أجلكم
  rationale: ينقل دلالة الغرض والمنفعة في السياق.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: لكي تتعلَّموا فينا
  rationale: يحفظ التعبير اليوناني المضغوط، حيث يكون بولس وأبلوس المثال أو المجال الذي يتعلم القراء من خلاله.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'هذه القاعدة: «لا تتجاوزوا ما هو مكتوب»'
  rationale: يجعل وظيفة العبارة مفهومة بالعربية بوصفها درسًا أو قاعدة، ويعبّر عن القوة الزجرية للتركيب الناقص مع توثيق حرفيته في الحاشية.
- source_word: γέγραπται
  choice: هو مكتوب
  rationale: صياغة عربية مألوفة للصيغة الكتابية، وتحفظ حالة المكتوب القائمة التي تفيدها صيغة التام.
- source_word: φυσιοῦσθε
  choice: ينتفخ
  rationale: يحفظ صورة الانتفاخ المجازية المميزة لاستعمال بولس بدل تسطيحها إلى «يتكبر».
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: تأييدًا للواحد على حساب الآخر
  rationale: يوضح معنى التحزب لأحد الأشخاص ضد الآخر مع إبقاء التقابل بين الواحد والآخر.
theological_decisions:
- issue: معنى العبارة الناقصة τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'صياغتها وصيةً: «لا تتجاوزوا ما هو مكتوب»'
  alternative: «ليس فوق ما هو مكتوب» أو «لا شيء يتجاوز ما هو مكتوب» بوصفها شعارًا أو قولًا مأثورًا
  rationale: التركيب اليوناني ناقص ويحتمل أن يكون شعارًا، لكن وظيفته السياقية هي الدرس الذي ينبغي أن يتعلموه؛ لذلك تنقل صيغة النهي المعنى الأرجح، بينما تحفظ الحاشية الغموض النحوي الحقيقي.
- issue: مرجع «ما هو مكتوب»
  choice: عدم تحديد نصوص بعينها أو بناء مبدأ مذهبي أوسع داخل الترجمة
  alternative: تفسيرها صراحةً بأنها كل الأسفار المقدسة أو الاقتباسات السابقة وحدها
  rationale: الآية نفسها لا تعيّن المرجع تعيينًا قاطعًا، ولذلك ينبغي إبقاء مداه مفتوحًا بحسب السياق.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظت صورة «الانتفاخ» البولسية، واستُخدمت «هذه القاعدة» لتوضيح وظيفة أداة التعريف اليونانية قبل العبارة المقتضبة، مع إبقاء غموضها في الحاشية.
