  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: ar
  text: فَإِنِّي لَا أَعِي شَيْئًا عَلَى نَفْسِي[a]، لَكِنِّي لَسْتُ بِهَذَا مُبَرَّرًا[b]؛ وَالَّذِي يَفْحَصُنِي[c] هُوَ الرَّبُّ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لا أعرف على نفسي شيئًا»، أو: «لا أشعر في ضميري بشيء ضدي».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «لست بهذا مُبرَّأً»، أو: «لا تثبت بهذا براءتي». يستعمل اليوناني لفظًا قضائيًا يستخدمه بولس أيضًا بمعنى التبرير.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «يقيّمني» أو «يحقّق معي». قد يدل الفعل اليوناني على الفحص أو التحقيق أو التقييم في سياق قضائي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: فَإِنِّي لَا أَعِي شَيْئًا عَلَى نَفْسِي
  rationale: تنقل «فإنّي» وظيفة γάρ التفسيرية، ويعبّر «لا أعي شيئًا على نفسي» عن معنى الضمير الأخلاقي والقضائي في تركيب σύνοιδα مع ἐμαυτῷ، مع إبقاء النفي مطلقًا.
- source_word: ἀλλ’ οὐκ ἐν τούτῳ
  choice: لَكِنِّي لَسْتُ بِهَذَا
  rationale: '«لكن» تحفظ التضاد، والباء في «بهذا» تؤدي معنى الوسيلة أو الأساس: عدم وعي بولس بشيء على نفسه ليس أساس الحكم فيه.'
- source_word: δεδικαίωμαι
  choice: مُبَرَّرًا
  rationale: يحفظ المصطلح القانوني في δικαιόω وصيغته المبنية للمجهول، ولا يختزله في مجرد الشعور بالبراءة؛ أما دلالة الزمن التام فتؤديها العربية طبيعيًا في التركيب الاسمي «لست مبررًا».
- source_word: ὁ δὲ ἀνακρίνων με
  choice: بَلِ الرَّبُّ هُوَ الَّذِي يَفْحَصُنِي
  rationale: «يفحصني» يحفظ معنى التدقيق والتقييم في ἀνακρίνω من غير أن يبالغ فيجعله حكمًا نهائيًا. وصياغة «بل... هو الذي» تنقل المقابلة والتوكيد الطبيعيين في العربية.
- source_word: κύριός
  choice: الرَّبُّ
  rationale: ترجمة مباشرة للاسم المعرّف κύριος، من غير إضافة هوية لم يصرّح بها نص الآية.
theological_decisions:
- issue: الدلالة القضائية لـ δεδικαίωμαι وصلتها بتقييم بولس لنفسه
  choice: لَسْتُ بِهَذَا مُبَرَّرًا
  alternative: لست بهذا مُبرَّأً / لا تثبت بهذا براءتي
  rationale: يحافظ «مبررًا» على اللفظ البولسي ذي الثقل القانوني واللاهوتي، مع إبقاء الكلام في سياقه المباشر المتعلق بالتقييم والحكم، من غير تحويله إلى تقرير عقائدي أوسع مما تقوله الآية.
- issue: مدى الحكم الذي يدل عليه ἀνακρίνω
  choice: يَفْحَصُنِي
  alternative: يدينني / يحاكمُني / يقيّمني
  rationale: الفعل يدل على الفحص والتحقيق والتقييم، وقد يأتي في إطار قضائي. «يفحصني» يحفظ هذا الاتساع ولا يستبق نتيجة الحكم.
- issue: هوية κύριος
  choice: الرَّبُّ
  alternative: الرب يسوع
  rationale: يذكر الأصل «الرب» فقط؛ لذلك لا تُضاف هوية صريحة، ولو كان السياق البولسي قد يشير إليها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كتابية رصينة. استُخدم «أعي شيئًا على نفسي» لإبراز معنى الضمير من غير إسهاب، و«مبررًا» للمحافظة على المصطلح البولسي، و«يفحصني» لعدم حسم الفعل في معنى الإدانة أو الحكم النهائي.
