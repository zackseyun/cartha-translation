lexical_decisions:
- source_word: ὡς
  choice: كأنّي
  rationale: تفيد افتراضًا غير صحيح تقوم عليه جرأة بعضهم، وتحافظ «كأنّ» على القوة التشبيهية الافتراضية في الأصل.
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: لن آتي إليكم
  rationale: التركيب التابع لـὡς يعرض ما افترضه بعضهم، لا تقريرًا مباشرًا من بولس. وصيغة «لن آتي» عربية طبيعية تعبّر عن توقعهم امتناع مجيئه مستقبلًا.
- source_word: δέ
  choice: وقد
  rationale: نُقلت وظيفتها الانتقالية الخفيفة بالواو، وجاءت «قد» مع الماضي للدلالة على الحالة التي صار إليها بعضهم.
- source_word: ἐφυσιώθησάν
  choice: انتفخ ... كبرياءً
  rationale: يحفظ هذا التعبير صورة الانتفاخ التي يكررها بولس في الرسالة، مع بيان أن المقصود هو الكبرياء بلغة عربية واضحة.
- source_word: τινες
  choice: بعضكم
  rationale: يشير السياق إلى فئة من المخاطَبين في جماعة كورنثوس؛ و«بعضكم» موجزة وطبيعية وتوضح هذا الارتباط.
theological_decisions:
- issue: صياغة توبيخ بولس لكبرياء بعض أهل كورنثوس
  choice: الإبقاء على صورة الانتفاخ في عبارة «انتفخ بعضكم كبرياءً»
  alternative: «تكبّر بعضكم» أو «صار بعضكم متعجرفين»
  rationale: الصورة المجازية جزء من خطاب بولس المتكرر في كورنثوس الأولى، والإبقاء عليها يُظهر ترابط حجته من غير إدخال تفسير مذهبي.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حُفظ مجاز الانتفاخ مع إضافة «كبرياءً» لئلا يلتبس المعنى على القارئ العادي، وصيغ الافتراض بعبارة طبيعية لا تحوّله إلى تقرير من بولس.
