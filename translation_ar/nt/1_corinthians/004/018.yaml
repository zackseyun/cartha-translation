  text: وقد انتفخ بعضكم من الكبرياء[a][b]، كأنني لا آتي إليكم.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تكبّر بعضكم، كأنني لا آتي إليكم».'
