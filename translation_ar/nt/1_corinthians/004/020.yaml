source:
  edition: SBLGNT
  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: ar
  text: لِأَنَّ مَلَكُوتَ اللهِ لَيْسَ بِالْكَلَامِ[a]، بَلْ بِالْقُوَّةِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بالقول»، أو «بمجرد الكلام»؛ فالتقابل هنا بين الكلام الذي لا تصحبه فاعلية وبين القوة الفعلية.'
    reason: بديل معجمي يوضح مجال معنى λόγος ووجه التقابل من غير إدخال التفسير الموسع في المتن.
lexical_decisions:
- source_word: οὐ γὰρ
  choice: لأنَّ ... ليس
  rationale: تؤدي «لأنَّ» وظيفة γάρ التعليلية بوصف الآية سببًا لما قبلها، ويعبّر «ليس» بوضوح عن النفي οὐ.
- source_word: ἐν λόγῳ
  choice: بالكلام
  rationale: يمكن أن يدل λόγος على الكلمة أو القول أو الكلام. و«بالكلام» عربية طبيعية تحفظ التقابل الموجز مع «بالقوة» من غير أن تضيف إلى المتن وصف «المجرد» غير المذكور صراحة.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ملكوت الله
  rationale: «ملكوت الله» تعبير عربي راسخ يحفظ إمكان دلالة βασιλεία على المُلك أو السلطان وعلى نطاقه، من غير حصر المعنى في أحد الجانبين.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: بل بالقوة
  rationale: «بل» تنقل الاستدراك الحاد في ἀλλά، و«القوة» هي المقابل المباشر والواسع لـ δύναμις وتحفظ عدم تحديد نوع هذه القوة في الآية.
theological_decisions:
- issue: طبيعة التقابل بين الكلام والقوة
  choice: إبقاء التقابل عامًا بين الكلام الذي لا تصحبه فاعلية وبين القوة الفعلية التي يتجلى بها ملكوت الله، دون تحديد نوع القوة.
  alternative: حصر القوة في المعجزات، أو في السلوك المتغير والتأديب الكنسي، أو في السلطان الرسولي وحده.
  rationale: النص اليوناني لا يحدد هنا نوع δύναμις؛ لذلك يحفظ النقل اتساع الدلالة والتوتر اللاهوتي بدل أن يحسمه تفسيريًا.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات نبرة كتابية رصينة. استُعمل التناظر «بالكلام... بالقوة» للمحافظة على بنية العبارة اليونانية وحدّة التقابل، مع إثبات علامة الحاشية في المتن.
