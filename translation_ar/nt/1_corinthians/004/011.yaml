lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: إلى هذه الساعة بالذات
  rationale: تعبير زمني يفيد استمرار الحال حتى الوقت الحاضر، مع إبراز معنى ἄρτι ولفظ «الساعة» الوارد في الأصل.
- source_word: πεινῶμεν
  choice: نحن نجوع
  rationale: مضارع يدل على حالة مستمرة، وصياغته فعلًا تحافظ على توازي أفعال السلسلة اليونانية.
- source_word: διψῶμεν
  choice: ونعطش
  rationale: ينقل حالة الحرمان المستمرة ويحافظ على اقترانه الإيقاعي بالجوع.
- source_word: γυμνιτεύομεν
  choice: ونفتقر إلى ما يكفينا من اللباس
  rationale: الفعل قد يدل على العري، لكنه يُستعمل أيضًا لنقص الكساء؛ وهذه الصياغة لا تبالغ في حسم مقدار انعدام اللباس.
- source_word: κολαφιζόμεθα
  choice: ونُضرَب
  rationale: مضارع مبني للمجهول يصور تعرضًا متكررًا للاعتداء الجسدي؛ و«نُضرَب» واضحة وطبيعية من غير تضييق المعنى على نوع بعينه من الضرب.
- source_word: ἀστατοῦμεν
  choice: ولا مستقرَّ لنا
  rationale: يفيد عدم ثبات المكان أو انعدام المأوى المستقر، مع تجنب حصر المعنى في مفهوم اجتماعي حديث أضيق.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: و... و... و...
  rationale: تكرار الواو يحفظ الإيقاع التراكمي المتلاحق لقائمة المشقات في اليونانية.
theological_decisions:
- issue: طبيعة وصف بولس لحال الرسل
  choice: قائمة مباشرة لمشقات وحرمان واعتداء مستمرة
  alternative: وصف بلاغي يغلب عليه التهويل
  rationale: تعرض الآية أحوالًا ملموسة بأفعال مضارعة خبرية؛ لذلك تُبقي الترجمة الوصف واضحًا من غير تهوين للمعاناة أو زيادة عليها.
