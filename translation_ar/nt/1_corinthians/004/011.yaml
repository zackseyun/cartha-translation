  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: ar
  text: إلى هذه الساعة بالذات، نحن نجوع ونعطش، ونفتقر إلى ما يكفينا من اللباس[a]، ونُضرَب، ولا مستقرَّ لنا[b].
