base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: ar
  text: فإني أظن أن الله جعلنا، نحن الرسل، آخر الجميع، كأناس محكوم عليهم بالموت[a]، لأننا صرنا مشهدًا[b] للعالم، وللملائكة وللبشر.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كأشخاص معيّنين للموت». تشير الكلمة اليونانية إلى أناس خُصِّصوا للموت أو حُكم عليهم به، وقد تلمّح إلى صورة المحكوم عليهم المعروضين في ساحة عامة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «مسرحًا»؛ والمقصود مشهد علني معروض للأنظار.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: فإني أظن
  rationale: ينقل الرأي الشخصي الذي يعبّر عنه بولس، مع تمثيل γάρ بصيغة سببية تصل الكلام بما قبله.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: نا نحن الرسل
  rationale: يحفظ علاقة البدل أو البيان في اليونانية، إذ يحدد بولس المقصود بضمير المتكلمين.
- source_word: ἐσχάτους
  choice: في آخر الصف
  rationale: تعبير عربي طبيعي يحفظ معنى الوضع في المرتبة الأخيرة، ويلائم صورة العرض العلني في السياق.
- source_word: ἀπέδειξεν
  choice: أبرز
  rationale: يفيد الإظهار والتقديم للعيان، تمهيدًا لصورة المشهد العلني التالية.
- source_word: ὡς ἐπιθανατίους
  choice: كأننا محكوم علينا بالموت
  rationale: ينقل معنى أشخاص عُيّنوا للموت أو صدر عليهم حكم به، مع إبقاء أداة التشبيه ὡς.
- source_word: θέατρον ἐγενήθημεν
  choice: صرنا مشهدًا
  rationale: ينقل الاستعارة بمعناها المفهوم، أي منظرًا علنيًا يراه الآخرون، من غير حصر θέατρον في مبنى المسرح.
- source_word: τῷ κόσμῳ
  choice: للعالم
  rationale: ينقل دلالة الجمهور أو الجهة التي تشاهد هذا المشهد.
- source_word: καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: للملائكة والبشر معًا
  rationale: يحفظ المقابلة بين الكائنات الملائكية والبشر، وتؤدي «معًا» وظيفة التركيب المتلازم καὶ...καὶ.
theological_decisions:
- issue: دلالة ἀγγέλοις
  choice: الملائكة، أي الكائنات السماوية
  alternative: الرسل أو الموفدون البشريون
  rationale: اقتران اللفظة بالعالم وبالبشر يجعل الإشارة إلى الكائنات الملائكية هي القراءة الطبيعية، من غير إضافة تحديد عقائدي لا ينص عليه السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. حافظت الصياغة على نبرة بولس الشخصية، وعلى صورة العرض العلني والإذلال أمام جمهور كوني، من غير توسيع مذهبي.
