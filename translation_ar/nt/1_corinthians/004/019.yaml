  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: ar
  text: لكنني سآتي إليكم قريبًا، إن شاء الرب، وسأعرف لا كلام المتكبرين[a] بل القوة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: اللفظ اليوناني يحمل صورة أناس «منتفخين» من الكبرياء، وهو تعبير يكرره بولس في هذه الرسالة.
    reason: cross_reference
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: لكنني سآتي إليكم قريبًا
  rationale: ينقل المستقبل وحركة بولس نحو المخاطَبين، ويعبّر «لكن» عن المقابلة الخفيفة التي تفيدها δέ، بينما يدل «قريبًا» على قرب الزمن.
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: إن شاء الرب
  rationale: صياغة عربية طبيعية ودقيقة تحفظ تعليق مجيئه على مشيئة الرب، من غير تعيين مرجع اللقب بما يتجاوز النص.
- source_word: γνώσομαι
  choice: سأعرف
  rationale: يحافظ على الدلالة المباشرة للفعل، ويُفهم من السياق أنه سيتحقق شخصيًا من حقيقة الأمر عند حضوره.
- source_word: οὐ τὸν λόγον
  choice: لا كلام
  rationale: «كلام» يقابل λόγος هنا بوضوح، ويحفظ التضاد الموجز بين القول والقوة من غير حصره في البلاغة أو في مضمون التعليم.
- source_word: τῶν πεφυσιωμένων
  choice: المتكبرين
  rationale: ينقل حالة الغرور المستمرة التي يدل عليها اسم الفاعل التام المبني للمجهول، بصياغة عربية واضحة؛ وتوضح الحاشية الصورة المجازية الأصلية.
- source_word: ἀλλὰ τὴν δύναμιν
  choice: بل القوة
  rationale: يحفظ المقابلة المقتضبة والمفتوحة الدلالة في اليونانية، من غير إضافة تفسير لطبيعة القوة أو صاحبها.
theological_decisions:
- issue: مرجع لقب «الرب»
  choice: الرب
  alternative: الرب يسوع؛ الله
  rationale: النص اليوناني يقول ὁ κύριος فقط؛ لذلك تُحفظ الصيغة العامة ولا يُحسم المرجع بما ليس مصرحًا به في الآية.
- issue: طبيعة التضاد بين λόγος وδύναμις
  choice: الكلام في مقابل القوة
  alternative: البلاغة في مقابل السلطان الرسولي؛ التعليم في مقابل القوة المعجزية
  rationale: يحفظ هذا الاختيار اتساع التضاد في النص والسياق، ولا يضيّقه إلى مظهر لاهوتي واحد.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت «إن شاء الرب» لطبيعتها العربية، و«المتكبرين» لوضوحها، مع حفظ الصورة الأصلية في الحاشية. وُضع مؤشر الحاشية [a] في المتن.
