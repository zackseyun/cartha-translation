  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: ar
  text: 'هكذا فليعتبرنا الإنسان: خُدّامًا للمسيح ووكلاء أسرار الله.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὕτως
  choice: هكذا
  rationale: تنقل دلالة الكيفية الإشارية بإيجاز طبيعي، وتمهّد للطريقة التي ينبغي أن يُنظر بها إلى بولس ورفقائه.
- source_word: ἡμᾶς
  choice: نا
  rationale: ضمير المفعول به يعود في السياق إلى بولس والعاملين معه.
- source_word: λογιζέσθω
  choice: فليحسبنا
  rationale: تحافظ صيغة الأمر على القوة التوجيهية للفعل، و«يحسب» هنا بمعنى يعدّ أو يعتبر.
- source_word: ἄνθρωπος
  choice: الإنسان
  rationale: المفرد هنا ذو دلالة عامة، و«الإنسان» في العربية الفصحى تعبير طبيعي يشمل أي شخص دون الحاجة إلى تحويله إلى جمع.
- source_word: ὑπηρέτας
  choice: خُدّامًا
  rationale: تفيد الخدمة التابعة للمسيح، من غير الإيحاء بوضع العبودية الذي قد يحمله لفظ آخر مثل δοῦλος.
- source_word: Χριστοῦ
  choice: للمسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، ويحفظ دلالته اللقبية هنا.
- source_word: οἰκονόμους
  choice: وكلاء
  rationale: تنقل صورة أشخاص عُهد إليهم تدبير ما يخص صاحب البيت أو المالك.
- source_word: μυστηρίων θεοῦ
  choice: على أسرار الله
  rationale: «الأسرار» تحفظ المصطلح البولسي بلا تفسير زائد، و«على» توضّح طبيعيًا في العربية مجال الوكالة، مع إبقاء إضافة الأسرار إلى الله.
theological_decisions:
- issue: دلالة Χριστοῦ بوصفه لقبًا
  choice: المسيح
  alternative: مسيح الله
  rationale: الصيغة المعرفة «المسيح» هي المقابل العربي الطبيعي للقب، أما «مسيح الله» فتضيف تعيينًا غير موجود صراحة في النص.
- issue: دلالة μυστηρίων
  choice: أسرار الله
  alternative: حقائق الله الخفية
  rationale: الإبقاء على «أسرار» يحفظ سعة المصطلح والتوتر بين الخفاء والإعلان، ولا يفرض تفسيرًا تفصيليًا داخل المتن.
- issue: عموم ἄνθρωπος
  choice: الإنسان
  alternative: كل شخص
  rationale: «الإنسان» يحافظ على المفرد الاسمي ويؤدي في العربية دلالة عامة طبيعية، من غير قصر المعنى على الذكور.
translation_notes:
  register: صياغة عربية فصحى واضحة وموجزة ذات نبرة كريمة. حُفظ تركيب الأمر المفرد والدلالة العامة لـ«الإنسان»، واستُعملت ألفاظ كنسية مفهومة من غير تحميل النص اصطلاحات مذهبية خاصة.
