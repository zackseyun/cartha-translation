  text: إذًا، في هذا الأمر، يُطلَب من الوكلاء أن يُوجَدَ المرءُ أمينًا.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يُبحَث بين الوكلاء عن أن يُوجَد أحدٌ أمينًا». ويمكن أن تُفهم بداية الآية أيضًا: «هنا أيضًا، المطلوب...» أو «في هذا الأمر إذًا...»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε λοιπὸν
  choice: وعليه، فإن
  rationale: تؤدي العبارة وظيفة انتقالية واستنتاجية في السياق، والدمج العربي يتجنب تتابع رابطين ثقيلين مع الحفاظ على قوة الانتقال. ويمكن فهم ὧδε أيضًا بمعنى «في هذا الأمر».
- source_word: ζητεῖται
  choice: ما يُطلَب
  rationale: الفعل يعني حرفيًا «يُبحَث عنه»، لكنه في هذا التركيب يدل على ما يُنتظر أو يُشترط، و«يُطلَب» تعبير عربي طبيعي يحفظ المبني للمجهول.
- source_word: ἐν τοῖς οἰκονόμοις
  choice: من الوكلاء
  rationale: السياق يبيّن أن الصفة مطلوبة من فئة الوكلاء. وحرف الجر العربي «من» يؤدي هذا المعنى بصورة طبيعية.
- source_word: οἰκονόμοις
  choice: الوكلاء
  rationale: «الوكلاء» تحافظ على صورة أشخاص اؤتمنوا على تدبير ما لغيرهم، وتناسب سياق أسرار الله في الآية السابقة.
- source_word: ἵνα πιστός τις εὑρεθῇ
  choice: هو أن يُوجَد كلُّ واحدٍ منهم أمينًا
  rationale: يحفظ «أن يُوجَد» صيغة النص المبنية للمجهول، ويعبّر «كل واحد منهم» طبيعيًا عن المفرد النكرة ذي الدلالة العامة، بينما تنقل «أمينًا» معنى الجدارة بالثقة والوفاء بالأمانة.
theological_decisions:
- issue: المفرد التمثيلي وعدم حصر المرجع في الذكور
  choice: كلُّ واحدٍ منهم
  alternative: أن يُوجَد وكيلٌ أمينًا
  rationale: τις مفرد نكرة عام، والمذكر النحوي لا يقتضي قصر الكلام على الرجال. الصياغة المختارة تحفظ المسؤولية الفردية من غير إدخال تخصيص جنسي غير موجود في المعنى.
- issue: دلالة πιστός
  choice: أمينًا
  alternative: مخلصًا / جديرًا بالثقة
  rationale: في سياق الوكالة، يشدد الوصف على الوفاء بما اؤتمن عليه الوكيل. «أمين» تجمع معنى النزاهة والموثوقية من غير حصر اللفظ في معنى عقدي واحد.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الوكلاء» لإبقاء استعارة التدبير المؤتمن، ودُمج الرابطان اليونانيان في «وعليه، فإن» لتجنب الثقل مع حفظ الصلة الاستنتاجية بالسياق السابق.
