  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: ar
  text: لِهٰذَا أَرْسَلْتُ إِلَيْكُمْ تِيمُوثَاوُسَ، الَّذِي هُوَ ابْنِي[a] الْحَبِيبُ وَالْأَمِينُ فِي الرَّبِّ. وَهُوَ سَيُذَكِّرُكُمْ بِطُرُقِي الَّتِي فِي الْمَسِيحِ يَسُوعَ، كَمَا أُعَلِّمُ فِي كُلِّ مَكَانٍ فِي كُلِّ كَنِيسَةٍ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «طفلي» أو «ولدي». واللفظ اليوناني τέκνον لا يحدِّد الجنس في ذاته، غير أن الإشارة هنا إلى تيموثاوس الرجل؛ لذا تُرجِم «ابني».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: لِهٰذَا
  rationale: أداة سببية موجزة وطبيعية تحيل إلى ما سبق.
- source_word: ἔπεμψα
  choice: أَرْسَلْتُ
  rationale: الماضي البسيط يقابل صيغة الماضي اليونانية في السياق الرسائلي.
- source_word: Τιμόθεον
  choice: تِيمُوثَاوُسَ
  rationale: الصيغة العربية المألوفة للاسم، مع مراعاة موقعه الإعرابي.
- source_word: τέκνον
  choice: ابْنِي
  rationale: مع أن اللفظ يعني حرفيًا «ولد/طفل»، فالمقصود هنا علاقة أبوية روحية برجل معلوم، و«ابني» أفصح وأطبع عربيًا؛ ويُذكر البديل الحرفي في الحاشية.
- source_word: ἀγαπητὸν καὶ πιστὸν
  choice: الْحَبِيبُ وَالْأَمِينُ
  rationale: يحفظ الوصفان المودة والموثوقية في الخدمة.
- source_word: ἐν κυρίῳ
  choice: فِي الرَّبِّ
  rationale: يحفظ التعبير البولسي الدال على العلاقة بالرب ومجال الحياة فيه.
- source_word: ἀναμνήσει
  choice: سَيُذَكِّرُكُمْ
  rationale: مقابل مباشر وطبيعي لصيغة المستقبل.
- source_word: τὰς ὁδούς μου
  choice: بِطُرُقِي
  rationale: يحفظ استعارة «الطرق» الواسعة التي تشمل نهج بولس في الحياة والتعليم والخدمة.
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: فِي الْمَسِيحِ يَسُوعَ
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، والعبارة تصف طرق بولس المتحددة بعلاقته بالمسيح يسوع.
- source_word: καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω
  choice: كَمَا أُعَلِّمُ فِي كُلِّ مَكَانٍ، فِي كُلِّ جَمَاعَةٍ
  rationale: يحفظ المقارنة والتوكيد المزدوج على شمول تعليم بولس، ويترجم ἐκκλησία بمعناه الجماعي السياقي.
theological_decisions:
- issue: دلالة Χριστός في ἐν Χριστῷ Ἰησοῦ
  choice: الْمَسِيحِ يَسُوعَ
  alternative: الْمَسِيحِ يَسُوع / كريستوس يسوع
  rationale: «المسيح» ترجمة اللقب اليوناني ودلالته، وهي الصيغة العربية الطبيعية الراسخة دون طمس صفته اللقبية.
- issue: مدلول «طرقي»
  choice: الإبقاء على الاستعارة لتشمل نهج بولس في الحياة والتعليم والخدمة في المسيح
  alternative: سيرتي أو سلوكي أو منهجي
  rationale: السياق لا يقصر ὁδοί على الأسفار أو العادات الخاصة، كما أن الاستعارة الأصلية أوسع من بدائلها التفسيرية.
- issue: ترجمة ἐκκλησία
  choice: جَمَاعَة
  alternative: كنيسة
  rationale: «جماعة» تُبرز اجتماع المؤمنين المقصود في الأصل، مع الإشارة إلى المقابل الكنسي المألوف في الحاشية صونًا للاختلاف الاصطلاحي.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت «ابني» لطبيعتها في العربية مع توثيق المعنى الحرفي، وحُفظت استعارة «طرقي». جميع علامات الحواشي واردة في المتن.
