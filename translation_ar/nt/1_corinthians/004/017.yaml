    issue: ترجمة ἐκκλησίᾳ بـ«جماعة»
    rationale: «جماعة» ممكنة معجميًا، لكنها عامة وقد تفقد المصطلح الجماعي-الكنسي المحدد في هذا السياق. «كنيسة» أدق وأرسخ في العربية الحديثة.
  - severity: medium
    issue: الحاشية b غير متصلة اتصالًا صحيحًا بموضعها
    rationale: المتن والحاشية كلاهما يقولان «في المسيح يسوع»، ثم تنتقل الحاشية إلى شرح «طرقي». لا يوجد بديل معجمي عربي معروض، والشرح التفسيري لا يلزم هنا؛ لذا تزال العلامة والحاشية.
  - severity: low
    issue: تعلّق «في المسيح يسوع» بطرائق بولس يمكن أن يكون أوضح
    rationale: إضافة الاسم الموصول في العربية («طرقي التي في المسيح يسوع») تحافظ على البنية والمعنى دون حسم زائد لطبيعة هذه الطرق.
