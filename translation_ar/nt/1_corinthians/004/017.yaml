revisions:
- from: لِهٰذَا أَرْسَلْتُ إِلَيْكُمْ تِيمُوثَاوُسَ، الَّذِي هُوَ ابْنِي الْحَبِيبُ وَالْأَمِينُ فِي الرَّبِّ[a]. وَهُوَ سَيُذَكِّرُكُمْ بِطُرُقِي فِي الْمَسِيحِ يَسُوعَ[b]، كَمَا أُعَلِّمُ فِي كُلِّ مَكَانٍ، فِي كُلِّ جَمَاعَةٍ.
  to: لِهٰذَا أَرْسَلْتُ إِلَيْكُمْ تِيمُوثَاوُسَ، الَّذِي هُوَ ابْنِي[a] الْحَبِيبُ وَالْأَمِينُ فِي الرَّبِّ. وَهُوَ سَيُذَكِّرُكُمْ بِطُرُقِي الَّتِي فِي الْمَسِيحِ يَسُوعَ، كَمَا أُعَلِّمُ فِي كُلِّ مَكَانٍ فِي كُلِّ كَنِيسَةٍ.
  rationale: حُدِّد المقصود بـἐκκλησία بترجمتها «كنيسة»، وأُزيلت الحاشية غير المتسقة مع علامتها، ونُقلت الحاشية المعجمية الخاصة بـτέκνον إلى «ابني». كما أُضيفت «التي» لتوضيح أن «في المسيح يسوع» وصف لطرائق بولس، مع الإبقاء على اتساع الاستعارة وعدم فرض تفسير مذهبي.
