  text: παρακαλῶ οὖν ὑμᾶς, μιμηταί μου γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/016.yaml
  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: ar
  text: 'لذلك أحثّكم: صيروا مقتدين بي[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كونوا مقتدين بي».'
    reason: lexical_alternative
  - marker: b
    text: 'ويوضّح بولس في موضع آخر: «اقتدوا بي، كما أني أنا أيضًا أقتدي بالمسيح» (1 كورنثوس 11:1).'
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: أحثّ
  rationale: ينقل قوة النداء الجاد ذي الطابع الحثّي في هذا السياق، وهو تعبير عربي واضح وطبيعي.
- source_word: οὖν
  choice: لذلك
  rationale: تُظهر أداة الاستنتاج الصلة المنطقية بما سبق.
- source_word: ὑμᾶς
  choice: كم
  rationale: ضمير جمع المخاطبين، أُلحق بالفعل على نحو عربي طبيعي.
- source_word: μιμηταί
  choice: مقتدين
  rationale: يدل اللفظ على من يحاكي شخصًا ويتخذ نمطه مثالًا؛ و«مقتدين» أفصح وأطبع عربيًا من الترجمة الحرفية «مقلّدين»، من غير إضعاف للمعنى.
- source_word: μου
  choice: بي
  rationale: يعبّر عن بولس بوصفه المثال المباشر للاقتداء، ويتلاءم طبيعيًا مع «مقتدين».
- source_word: γίνεσθε
  choice: صيروا
  rationale: يحفظ معنى الدخول في حال أو اتخاذ صفة، بدل تسويته تمامًا بالفعل «كونوا».
theological_decisions:
- issue: قد يُفهم طلب بولس الاقتداء به على نحو مبالغ فيه إذا عُزل عن سياقه الأوسع المتمركز حول المسيح، لكن الآية نفسها تجعل بولس المثال المباشر.
  choice: صيروا مقتدين بي
  alternative: اقتدوا بمثالي
  rationale: تحافظ الصياغة المختارة على وضوح النص اليوناني وعلى توتره اللاهوتي، من غير تلطيف العبارة أو إدخال قيد غير مذكور في الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أحثّكم» لقوة الالتماس الرسولي، و«مقتدين بي» لتجنب الإيحاء السلبي الشائع في «مقلّدين». أُبقيت «صيروا» لإظهار دلالة γίνεσθε على اتخاذ حال، مع إثبات البديل الأبسط في الحاشية.
