  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: ar
  text: ولا السارقون، ولا الجشعون[a]، ولا السِّكِّيرون، ولا الشاتمون، ولا الناهبون[b] يرثون ملكوت الله.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الطامعون».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «السالبون»، أو «الذين يستولون على أموال غيرهم».'
    reason: lexical_alternative
  - marker: c
    text: أي إنهم لا ينالون نصيبًا في ملكوت الله.
    reason: clarification
lexical_decisions:
- source_word: κλέπται
  choice: السارقون
  rationale: المقابل العربي الطبيعي والدقيق لمن اعتادوا السرقة، ويلائم صيغة قائمة الرذائل.
- source_word: πλεονέκται
  choice: الجشعون
  rationale: يدل اللفظ على المتصفين بالطمع والرغبة النهمة في المزيد، وغالبًا في المجال المادي؛ و«الجشعون» واضحة في العربية المعاصرة.
- source_word: μέθυσοι
  choice: السِّكِّيرون
  rationale: يدل على من يتصفون بالإفراط في السكر، لا على كل من سكر مرة؛ وتحفظ الكلمة قوة الوصف في القائمة.
- source_word: λοίδοροι
  choice: الشاتمون
  rationale: يشير إلى من يسيئون إلى الآخرين بالسب والإهانة؛ و«الشاتمون» أدق من «المفترون» التي تقصر المعنى على الاتهام الكاذب.
- source_word: ἅρπαγες
  choice: المختلسون
  rationale: يدل على من ينتزعون أموال غيرهم أو يستغلونهم للكسب. ويعبّر «المختلسون» عن الاستيلاء الجائر، مع إثبات بديل أوسع في الحاشية.
- source_word: βασιλείαν θεοῦ
  choice: ملكوت الله
  rationale: تعبير عربي كتابي راسخ يحفظ الدلالة اللاهوتية لسلطان الله وملكه.
- source_word: κληρονομήσουσιν
  choice: يرثون
  rationale: يحفظ صورة نيل النصيب بوصفه ميراثًا، وهي دلالة مقصودة في الفعل اليوناني.
theological_decisions:
- issue: قوة قائمة الرذائل ولغة الميراث
  choice: تُبقي الترجمة أسماء الفئات كما وردت، وتقول إنهم لا يرثون ملكوت الله.
  alternative: تفسير الألفاظ على أنها تشير صراحةً إلى نمط حياة مستمر غير متاب عنه، أو إلى أفعال منفردة.
  rationale: صيغ الجمع الاسمية في قائمة الرذائل تصف أشخاصًا متصفين بهذه الممارسات، لكن النص نفسه لا يضيف قيد «غير التائبين». لذلك لا تُدرج الترجمة هذا التفسير في المتن، حفاظًا على التوتر اللاهوتي.
- issue: معنى وراثة ملكوت الله
  choice: يرثون ملكوت الله
  alternative: ينالون نصيبًا في ملكوت الله
  rationale: الترجمة الحرفية الطبيعية تحفظ استعارة الميراث ولا تستبدلها بتفسير، مع توضيحها في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة وقورة. حُفظ إيقاع قائمة الرذائل بتكرار «ولا»، واستُعمل «ملكوت الله» و«يرثون» لصون الرنين الكتابي والدلالة الأصلية.
