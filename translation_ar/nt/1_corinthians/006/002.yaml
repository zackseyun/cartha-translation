  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: ar
  text: أمَا تعلمون أن القديسين سيدينون العالم؟ وإذا كان العالم يُدان على أيديكم[a]، أفأنتم غير أهلٍ للفصل في أصغر القضايا[b]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فيكم» أو «بينكم». العبارة اليونانية تعني حرفيًا «فيكم» أو «بينكم»، وقد تدل في السياق على أنكم تشاركون في دينونة العالم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أصغر المحاكم». يمكن أن تدل الكلمة اليونانية على المحاكم أو على القضايا المعروضة للحكم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: أمَا
  rationale: تصل العبارة بالحجة السابقة في صيغة استفهام إنكاري حادّة وطبيعية بالعربية.
- source_word: οὐκ οἴδατε
  choice: تعلمون
  rationale: يحافظ على معنى العلم في الصيغة البولسية الاستفهامية «أما تعلمون؟».
- source_word: οἱ ἅγιοι
  choice: القديسين
  rationale: تعبير كتابي موجز عن المؤمنين بوصفهم المكرَّسين لله، من غير حصره في فئة نخبوية.
- source_word: τὸν κόσμον
  choice: العالم
  rationale: المقابل العربي الطبيعي الذي يُبقي شمول اللفظ من غير تضييق دلالته.
- source_word: κρινοῦσιν
  choice: سيدينون
  rationale: ينقل صيغة المستقبل ومعنى ممارسة الدينونة، من غير تحديد كيفيتها.
- source_word: ἐν ὑμῖν
  choice: بكم
  rationale: ينقل في السياق معنى مشاركة المخاطَبين في الدينونة، مع الإشارة في الحاشية إلى احتمال «بينكم» الأقرب حرفيًا.
- source_word: κρίνεται
  choice: يُدان
  rationale: يحافظ على المبني للمجهول، ويوافق الاستعمال المستقبلي أو العام داخل الشرط.
- source_word: ἀνάξιοί ἐστε
  choice: أفأنتم غير أهلٍ
  rationale: يؤدي معنى عدم الجدارة أو الأهلية ويحفظ حدّة السؤال الإنكاري.
- source_word: κριτηρίων ἐλαχίστων
  choice: للفصل في أصغر القضايا
  rationale: يفهم κριτήρια هنا على أنه المسائل القضائية المعروضة للحكم، وهو ملائم للسياق العربي؛ وتُذكر دلالة المحاكم البديلة في الحاشية.
theological_decisions:
- issue: هوية «القديسين»
  choice: المؤمنون، أي شعب الله، بوصفهم مشاركين في الدينونة الآتية
  alternative: فئة أضيق من المؤمنين ذوي القداسة المتميزة
  rationale: استعمال بولس المعتاد يشمل جماعة المؤمنين، والترجمة لا تضيف قيدًا يجعلهم نخبة خاصة.
- issue: كيفية دينونة القديسين للعالم
  choice: مشاركة حقيقية في دينونة مستقبلية من غير تحديد الكيفية
  alternative: تقويم أخلاقي مجازي محض، أو سلطة قضائية مستقلة كاملة
  rationale: النص يثبت المشاركة في الدينونة لكنه لا يشرح آليتها، لذلك تُترك هذه المسألة مفتوحة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت صيغة «أما تعلمون؟» للمحافظة على النبرة الجدلية، و«غير أهلٍ» لإبقاء معنى عدم الجدارة والأهلية، مع توضيح موضعي الغموض المعجمي في الحاشيتين.
