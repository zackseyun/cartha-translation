  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: ar
  text: لأنكم قد اشتُريتم بثمن؛ فمجِّدوا إذًا الله في جسدكم.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'تضيف بعض المخطوطات المتأخرة: «وفي أرواحكم التي هي لله».'
    reason: textual_variant
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: قد اشتُريتم
  rationale: يحافظ المبني للمجهول على صورة الشراء الصريحة في اليونانية، وتفيد «قد» تحقق الفعل الماضي.
- source_word: γὰρ
  choice: لأنكم
  rationale: تبيّن الأداة سبب الوصية السابقة، و«لأن» رابط سببي طبيعي وواضح في العربية.
- source_word: τιμῆς
  choice: بثمن
  rationale: ينقل التعبير كلفة الشراء بإيجاز ويحفظ الاستعارة التجارية دون تفسير زائد.
- source_word: δοξάσατε
  choice: مجِّدوا
  rationale: ينقل فعل الأمر وصلة اللفظ بالمجد، مع بقاء المعنى اللاهوتي والعملي.
- source_word: δὴ
  choice: إذًا
  rationale: تنقل القوة الاستنتاجية والإلحاح في الانتقال من السبب إلى الأمر.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: في أجسادكم
  rationale: يحافظ على حرف الجر وعلى الإشارة الملموسة إلى الجسد؛ وصيغة الجمع طبيعية في العربية مع جماعة المخاطبين، مع وجود اختلاف نصي قديم في ختام الآية.
theological_decisions:
- issue: صورة الشراء والفداء
  choice: 'الإبقاء على استعارة الشراء: «اشتُريتم بثمن»'
  alternative: «افتُديتم بكلفة»
  rationale: النص يستعمل لغة الشراء صراحة، والإبقاء عليها يحفظ الصورة الأصلية ولا يضيّقها بتفسير عقائدي مضاف.
- issue: الأخلاق المتجسدة
  choice: ترجمة σῶμα ترجمة ملموسة بـ«أجسادكم»
  alternative: «ذواتكم» أو «حياتكم»
  rationale: السياق القريب يتعلق بالسلوك الجنسي الجسدي، ولذلك لا ينبغي توسيع اللفظ إلى معنى تجريدي.
- issue: الاختلاف النصي في خاتمة الآية
  choice: 'اتباع نص SBLGNT الأقصر: «في أجسادكم»'
  alternative: إضافة «وفي أرواحكم التي هي لله» وفق قراءة متأخرة
  rationale: النص اليوناني المحدد للمهمة ينتهي بضمير «أجسادكم»، أما العبارة الأطول فليست ضمن نص SBLGNT هنا.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. اختيرت صيغة الجمع «أجسادكم» لسلامة الأسلوب العربي مع جماعة المخاطبين، مع الحفاظ على التركيز الملموس على الجسد. وُضعت علامة الحاشية بعد الجملة التي تخصها.
