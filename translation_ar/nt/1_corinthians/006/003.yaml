  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: ar
  text: أَمَا تَعْلَمُونَ أَنَّنَا سَنَدِينُ الْمَلَائِكَةَ؟ فَكَمْ بِالْأَحْرَى[a] أُمُورَ هَذِهِ الْحَيَاةِ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «فبالأولى أمور هذه الحياة»، أو: «فما بالك بأمور هذه الحياة».'
    reason: بدائل معجمية وبلاغية لنقل μήτιγε، التي تقوّي الاستدلال من الأعظم إلى الأدنى.
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: أَمَا تَعْلَمُونَ
  rationale: يحافظ على صيغة السؤال البلاغي المتكررة عند بولس، وهو تعبير عربي فصيح وطبيعي.
- source_word: ὅτι
  choice: أَنَّ
  rationale: تُدخل مضمون فعل العلم مباشرةً وبوضوح.
- source_word: ἀγγέλους
  choice: الْمَلَائِكَةَ
  rationale: السياق القضائي والأخروي يدل على الكائنات السماوية، لا الرسل البشريين.
- source_word: κρινοῦμεν
  choice: سَنَدِينُ
  rationale: تنقل صيغة المستقبل ومعنى القضاء من غير تحديد كيفية الدينونة أو نطاقها.
- source_word: μήτιγε
  choice: فَكَمْ بِالْأَحْرَى
  rationale: تنقل حجة الانتقال من الأعظم إلى الأدنى بعبارة عربية واضحة، مع إثبات البدائل الممكنة في الحاشية.
- source_word: βιωτικά
  choice: أُمُورَ هَذِهِ الْحَيَاةِ
  rationale: تنقل الصفة المستعملة اسميًا، وتشمل شؤون الحياة الأرضية العادية من غير قصرها على نوع بعينه من النزاعات.
theological_decisions:
- issue: طبيعة دينونة المؤمنين للملائكة
  choice: سَنَدِينُ الْمَلَائِكَةَ
  alternative: سنحكم الملائكة؛ سندين الملائكة الساقطين
  rationale: النص يصرّح بالفعل المستقبلي لكنه لا يحدد كيفيته ولا نطاقه ولا يقصر الملائكة على الساقطين؛ لذلك تُحفظ العبارة المباشرة والتوتر التفسيري من غير إضافة مذهبية.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «أما تعلمون» لصون النبرة البلاغية البولسية، و«أمور هذه الحياة» لتجنب التضييق التفسيري. وُضع مؤشر الحاشية [a] في المتن.
