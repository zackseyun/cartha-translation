  text: But the one who joins himself to the Lord is one spirit with him[a][b][c].
translation:
  language: ar
  text: وأمّا مَن يلتصق بالرب فهو روحٌ واحدٌ معه[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «مَن يُضَمّ إلى الرب». تحتمل الصيغة اليونانية معنى الفعل الانعكاسي، أي إن الشخص يلتصق بالرب، كما تحتمل معنى قريبًا من المبني للمجهول، أي إنه يُضَمّ إليه.'
    reason: lexical_alternative
  - marker: b
    text: 'وحرفيًّا: «فهو روح واحد». أُضيفت «معه» لإيضاح أن الوحدة هي بين الشخص والرب، وهو معنى يفهم من السياق اليوناني.'
    reason: lexical_alternative
  - marker: c
    text: قد يفهم بعضهم «روح» هنا على أنها إشارة إلى الروح القدس، لكن العبارة تُفهم على نحو أرجح بأنها تصف اتحاد المؤمن بالرب في روح واحد.
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος
  choice: يلتصق
  rationale: يدل الفعل على التعلّق أو الارتباط الوثيق. واختيار «يلتصق» يحافظ على الصلة اللفظية والمعنوية باتحاد الرجل بالمرأة في الآية السابقة، مع بيان البديل المحتمل في الحاشية.
- source_word: τῷ κυρίῳ
  choice: بالرب
  rationale: «الرب» هو المقابل المألوف والدقيق لـ κύριος هنا، ويشير في السياق البولسي إلى الرب يسوع.
- source_word: ἓν πνεῦμα
  choice: روحٌ واحدٌ
  rationale: تنقل العبارة وحدة حقيقية وقوية، ولا تختزلها في مجرد توافق في الفكر أو الغرض، كما أنها لا تساوي بين المؤمن والرب مساواةً تلغي التمييز بينهما.
- source_word: ὁ δὲ ... ἐστιν
  choice: وأمّا مَن ... فهو
  rationale: 'صياغة عربية طبيعية تنقل المقابلة التي تفيدها δέ، وتجعل اسم الفاعل اليوناني وصفًا عامًا: «مَن يلتصق».'
theological_decisions:
- issue: طبيعة الوحدة في عبارة «روح واحد»
  choice: الإبقاء على تعبير الوحدة القوي مع إضافة «معه» لبيان طرفي العلاقة
  alternative: «فهو روح واحد» دون ذكر «معه»، أو صياغة توحي بالامتزاج والهوية التامة
  rationale: يقابل بولس في السياق الاتحاد الجسدي في الآية السابقة بالاتحاد بالرب. وتحافظ الصياغة على قوة الوحدة من غير أن تجعل المؤمن والرب كيانًا واحدًا بلا تمييز.
- issue: دلالة πνεῦμα
  choice: «روح» بمعنى أن الملتصق بالرب يكون معه روحًا واحدًا
  alternative: فهم اللفظة إشارةً مباشرة إلى الروح القدس
  rationale: لا تميّز العربية، مثل المخطوطات اليونانية، بين الحرف الكبير والصغير. والأقرب في تركيب الجملة وسياق المقابلة أن العبارة تصف وحدة المؤمن بالرب، مع الإشارة في الحاشية إلى القراءة الأخرى الممكنة.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة وموقّرة. استُخدمت «وأمّا» لإبراز المقابلة، و«مَن» للحفاظ على العموم الطبيعي، و«يلتصق» لنقل معنى الارتباط الوثيق من غير صياغة اصطلاحية مذهبية.
