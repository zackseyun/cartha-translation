  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: ar
  text: أما تعلمون أن أجسادكم أعضاءُ المسيح؟ أفآخذ إذًا أعضاءَ المسيح وأجعلها أعضاءَ عاهرة؟ حاشا أن يكون ذلك![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «كلا مطلقًا». العبارة اليونانية تعبير شديد عن الرفض والاستبعاد.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: أما تعلمون
  rationale: صياغة استفهامية إنكارية طبيعية تحفظ احتجاج بولس بمعرفةٍ يُفترض أنها حاضرة لدى المخاطَبين.
- source_word: σώματα
  choice: أجسادكم
  rationale: يشير الجمع إلى الوجود الجسدي الفعلي للمؤمنين، و«أجسادكم» ترجمة مباشرة وطبيعية.
- source_word: μέλη
  choice: أعضاء
  rationale: تحفظ صورة أجزاء الجسد المنتمية إلى كلّ، وتناسب تكرار اللفظة المقصود في الآية.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب اليوناني Χριστός، ويحفظ دلالته اللقبية من غير الحاجة إلى التفريق العربي بين Messiah وChrist.
- source_word: ἄρας
  choice: آخذ
  rationale: أُدمج اسم الفاعل اليوناني في السؤال التداولي «أفآخذ» بما ينقل الفعل المتصوَّر ويمهّد للفعل التالي من غير تثقيل حرفي.
- source_word: ποιήσω
  choice: أجعلها
  rationale: تنقل المعنى المباشر للفعل وتحفظ الصدمة البلاغية في تحويل أعضاء المسيح إلى أعضاء عاهرة؛ والضمير يوضح المفعول في العربية.
- source_word: πόρνης
  choice: عاهرة
  rationale: اللفظة في السياق تدل تحديدًا على امرأة تمارس البغاء، و«عاهرة» واضحة في العربية المعاصرة ولا توسّع المعنى إلى الفجور الجنسي عمومًا.
- source_word: μὴ γένοιτο
  choice: حاشا أن يكون ذلك
  rationale: تعبير عربي قوي عن الرفض والاستبعاد، يحفظ نبرة الدعاء أو التمنّي السلبية في الصيغة اليونانية ولا يختزلها في نفي عادي.
theological_decisions:
- issue: طبيعة انتماء أجساد المؤمنين إلى المسيح في عبارة μέλη Χριστοῦ
  choice: أعضاء المسيح
  alternative: أعضاء في جسد المسيح
  rationale: تحفظ الصياغة الإضافة اليونانية وما فيها من كثافة لاهوتية، ولا تُدخل عبارة «جسد المسيح» صراحةً مع أنها تفسير محتمل للصورة.
- issue: قوة الرفض في μὴ γένοιτο
  choice: حاشا أن يكون ذلك
  alternative: كلا مطلقًا
  rationale: المختار ينقل الرفض الشديد مع مسحة الصيغة التمنّعية في الأصل، من غير إضافة تقرير عقائدي.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة ومباشرة. حُفظ تكرار «أعضاء المسيح» و«أعضاء عاهرة» لأنه محور المقابلة البلاغية في الأصل، واستُخدمت «حاشا أن يكون ذلك» لقوتها مع بقاء معناها مفهومًا للقارئ المعاصر.
