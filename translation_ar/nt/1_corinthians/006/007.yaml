  source_fidelity: 'المعنى العام منقول بأمانة: وجود النزاعات القضائية داخل الجماعة يُعدّ هزيمة، ويتبعه سؤالان بلاغيان يدعوان إلى احتمال الظلم والحرمان. لكن عبارة «تُسلَب منكم حقوقكم» تضيف «حقوقكم»، وهي غير مذكورة في اليونانية وقد تضيّق معنى ἀποστερεῖσθε الأوسع، الذي يشمل الحرمان أو السلب أو الاحتيال.'
