reference: 1 Corinthians 6:7
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: ar
  text: إذًا، فإن وجود دعاوى قضائية[b] بينكم هو في حدّ ذاته هزيمة[a] لكم بالفعل. فلماذا لا تُظلَمون بالأحرى؟ ولماذا لا تُحرَمون[c] بالأحرى؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «خسارة» أو «إخفاق». يمكن أن تدل الكلمة اليونانية ἥττημα على الخسارة أو الهزيمة؛ واختيرت «هزيمة» حفاظًا على قوة كلام بولس.
    reason: lexical_alternative
  - marker: b
    text: أو «قضايا قانونية». تشير الكلمة اليونانية κρίματα هنا إلى نزاعات تُرفع إلى القضاء.
    reason: lexical_alternative
  - marker: c
    text: أو «تُسلَبون» أو «يُحتال عليكم». يمكن أن تعني الكلمة اليونانية ἀποστερεῖσθε الحرمان أو السلب أو الاحتيال.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: بالفعل
  rationale: تدل على أن حالة الهزيمة قائمة منذ الآن، بصرف النظر عن نتيجة الدعاوى.
- source_word: μὲν οὖν
  choice: إذًا
  rationale: تنقل الاستنتاج والانتقال المؤكد قليلًا من التوبيخ السابق من غير إثقال العبارة العربية.
- source_word: ὅλως
  choice: مجرّد
  rationale: صيغت ضمن عبارة «مجرّد وجود» لإبراز أن وجود الخصومات نفسه، في حد ذاته، هو الهزيمة، وهو تعبير عربي طبيعي عن قوة السياق.
- source_word: ἥττημα
  choice: هزيمة
  rationale: تحفظ القوة البلاغية لحكم بولس بأن الجماعة خاسرة أخلاقيًا بمجرد لجوء أفرادها إلى مقاضاة بعضهم بعضًا.
- source_word: ὑμῖν ἐστιν
  choice: هو هزيمة لكم
  rationale: تحفظ دالّ الإضافة أو المرجع في ὑμῖν من غير إدخال معنى «عار» غير المصرح به.
- source_word: ὅτι
  choice: إنّ مجرّد وجود
  rationale: تُدخل مضمون الهزيمة وسببها بصياغة عربية واضحة، أي وجود الدعاوى بينهم.
- source_word: κρίματα
  choice: دعاوى قضائية
  rationale: السياق يتحدث عن نزاعات تُرفع إلى المحاكم، ولذلك فالمعنى القانوني الملموس أنسب من «أحكام».
- source_word: μεθ’ ἑαυτῶν
  choice: بينكم
  rationale: تنقل كون النزاعات داخل الجماعة نفسها، بعبارة عربية موجزة وطبيعية.
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: فلماذا لا... بالأحرى؟
  rationale: تحفظ صيغة السؤال الإنكاري وقوة المفاضلة في μᾶλλον.
- source_word: ἀδικεῖσθε
  choice: تُظلَمون
  rationale: تحفظ المبني للمجهول والمعنى الأخلاقي للوقوع تحت الظلم من غير شرح زائد.
- source_word: ἀποστερεῖσθε
  choice: تُسلَب منكم حقوقكم
  rationale: تنقل معنى الحرمان أو السلب في السياق القانوني والمالي، وتأتي أوضح في العربية الحديثة من استعمال «تُحتالون» أو صياغة مبهمة.
theological_decisions:
- issue: طبيعة تقييم بولس للتقاضي داخل الجماعة
  choice: هزيمة
  alternative: خسارة أو إخفاق
  rationale: 'تحفظ اللفظة قوة التقييم الأخلاقي في النص: فوجود هذه الدعاوى نفسه هزيمة للجماعة، من غير تعيين فئة عقائدية أو نتيجة قانونية لم يذكرها النص.'
- issue: مدى إرادية قبول الظلم أو السلب
  choice: 'الإبقاء على صيغتي المبني للمجهول: «تُظلَمون» و«تُسلَب منكم حقوقكم»'
  alternative: «تقبلون أن تُظلَموا» و«تقبلون أن تُسلَب حقوقكم»
  rationale: البديل أوضح من جهة كون السؤال دعوة إلى احتمال الضرر، لكنه يضيف فعل «تقبلون» غير الموجود صراحة؛ لذلك حُفظ توتر الصياغة اليونانية المبنية للمجهول.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُعملت «دعاوى قضائية» لتوضيح السياق القانوني، وحُفظ التوازي البلاغي بين السؤالين الإنكاريين. وُضعت علامات الحواشي عند الألفاظ التي تتعلق بها مباشرة، ولو أدى ذلك إلى ترتيب ظهور [b] قبل [a].
