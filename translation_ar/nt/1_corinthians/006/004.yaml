  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: ar
  text: فإذا كانت لديكم محاكم للفصل في شؤون هذه الحياة[a]، أفتُجلِسون للحكم مَن لا اعتبار لهم في الكنيسة[b]؟[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شؤون الحياة اليومية»؛ فاللفظ اليوناني يشير إلى الأمور الأرضية العادية أو المدنية.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «مَن هم محتقَرون في الكنيسة». قد تشير العبارة اليونانية، على سبيل التهكم، إمّا إلى أشخاص يُعَدّون قليلي الشأن داخل الكنيسة، وإمّا إلى مَن لا مكانة لهم من وجهة نظر الكنيسة.'
    reason: alternative_reading
  - marker: c
    text: 'يفهم بعضهم هذه الجملة أمرًا تهكميًا: «فأجلِسوا للحكم مَن لا اعتبار لهم في الكنيسة».'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: أمور هذه الحياة
  rationale: يدلّ اللفظ على الشؤون العادية الأرضية أو المدنية، وهذه الصياغة واضحة ولا توحي بالضرورة بحكم أخلاقي سلبي كما قد تفعل كلمة «دنيوية».
- source_word: κριτήρια
  choice: قضايا
  rationale: يمكن أن يدل الاسم على المحاكم أو أعمال القضاء أو القضايا. ومع فعل «لديكم» وسياق الخصومات، تؤدي «قضايا» معنى المسائل المعروضة للفصل فيها بصورة طبيعية في العربية.
- source_word: ἐὰν ἔχητε
  choice: إذا كانت لديكم
  rationale: صياغة شرطية عربية طبيعية تحافظ على بنية العبارة اليونانية.
- source_word: τοὺς ἐξουθενημένους
  choice: مَن لا اعتبار لهم
  rationale: يحمل اسم المفعول معنى مَن يُعامَلون كأنهم لا شيء أو يُحتقَرون. وتحفظ العبارة بُعد المكانة والتقدير دون حصر المقصود في أعضاء مهمَّشين أو أشخاص من خارج الجماعة.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: في الكنيسة
  rationale: ترجمة مباشرة تبقي مفتوحًا ما إذا كان الكلام عن مكانتهم داخل جماعة الكنيسة أو عن نظرة الكنيسة إليهم.
- source_word: τούτους καθίζετε
  choice: أفتُجلِسون للقضاء
  rationale: الفعل يعني حرفيًا «تُجلِسون»، ويمكن أن يفيد تنصيب شخص للفصل القضائي. وإضافة «للقضاء» توضّح الوظيفة التي يقتضيها السياق مع إبقاء الصورة الأصلية.
theological_decisions:
- issue: هل الجملة سؤال توبيخي أم أمر تهكمي، ومَن هم الذين لا اعتبار لهم؟
  choice: 'صيغت الجملة سؤالًا توبيخيًا: «أفتُجلِسون للقضاء مَن لا اعتبار لهم في الكنيسة؟»'
  alternative: 'يمكن فهمها أمرًا تهكميًا: «فأجلِسوا للقضاء مَن لا اعتبار لهم في الكنيسة»، كما يمكن تفسير هؤلاء بأنهم أشخاص من خارج الكنيسة لا مكانة لهم في نظرها.'
  rationale: علامة الاستفهام في SBLGNT وسياق التوبيخ في 6:1–6 يؤيدان القراءة الاستفهامية، لكن التركيب اليوناني يحتمل الأمر التهكمي؛ لذلك ذُكر البديل في الحاشية، وبقيت هوية الأشخاص غير محسومة في المتن.
translation_notes:
  register: العربية فصحى معاصرة واضحة ورصينة. استُعملت «قضايا» بدل «محاكم» لتلائم التركيب العربي وسياق المسائل المراد الفصل فيها، مع الحفاظ على النبرة الاستنكارية وعلى الغموض الحقيقي في تركيب النص اليوناني.
