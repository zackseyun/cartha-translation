revisions:
- from: 'أَمَا تَعْلَمُونَ أَنَّ مَنْ يَلْتَصِقُ بِزَانِيَةٍ يَصِيرُ مَعَهَا جَسَدًا وَاحِدًا؟ فَقَدْ قَالَ[a]: «يَصِيرُ الِاثْنَانِ جَسَدًا وَاحِدًا».[b]'
  to: 'أَوَلَا تَعْلَمُونَ أَنَّ مَنْ يَلْتَصِقُ بِمُومِسٍ يَكُونُ مَعَهَا جَسَدًا وَاحِدًا؟ فَإِنَّهُ يَقُولُ[a]: «يَصِيرُ الِاثْنَانِ جَسَدًا وَاحِدًا».[b]'
  rationale: 'التعديل يحفظ ترتيب الاستدلال ومعاني الأفعال في الأصل: «أوَلا» لـἢ οὐκ، و«يكون» لـἐστιν، و«يقول» لـφησίν. وهو كذلك يحدد πόρνη تحديدًا معجميًا مناسبًا بـ«مومس»، مع الإبقاء على تطبيق بولس لعبارة «جسدًا واحدًا» بلا إضافةٍ عقائدية أو أخلاقية.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'تحتاج الصياغة إلى ضبطٍ محدود لتطابق الزمن والبنية الحجاجية في اليونانية: ἢ οὐκ οἴδατε تُنقل بدقة بـ«أوَلا تعلمون»، وἓν σῶμά ἐστιν خبرٌ في الحاضر («يكون/هو جسدًا واحدًا») لا فعلُ صيرورة. كما أن φησίν في الحاضر («يقول») لا الماضي («قال»).'
  naturalness: النص المعدّل فصيح معاصر وموجز. و«مومس» أدق من «زانية» في تعيين πόρνη بوصفها امرأة تمارس البغاء، من غير توسيعٍ تفسيري.
  terminology: استُبدلت «زانية» بـ«مومس» لأن «زانية» في الاستعمال العربي أوسع وقد تُفهم امرأة ارتكبت الزنا دون دلالة البغاء المتخصصة. وحُفظ «جسدًا واحدًا» بوصفه المقابل الكتابي الراسخ لعبارة σάρκα μίαν.
  issues:
  - severity: medium
    issue: «أمّا تعلمون» لا تُظهر بوضوح «أو» الاستئنافية في ἢ οὐκ οἴδατε.
    rationale: «أوَلا تعلمون» تحافظ على الاستفهام الإنكاري وعلى وصلة البديل الحجاجي دون تكلّف.
  - severity: medium
    issue: «يصير معها جسدًا واحدًا» يبدّل ἐστιν (هو/يكون) إلى فعل صيرورة.
    rationale: على الرغم من أن السياق يتضمن اتحادًا ناشئًا، فإن النص اليوناني يقرر الحالة بصيغة الحاضر؛ لذا «يكون معها جسدًا واحدًا» أوفق.
  - severity: low
    issue: «قال» لا يطابق φησίν في الحاضر، و«زانية» أوسع من πόρνη.
    rationale: «يقول» يحفظ زمن الفعل اليوناني، و«مومس» يحدد معنى المرأة التي تمارس البغاء.
