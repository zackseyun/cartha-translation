source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: ar
  text: 'أَوَلَا تَعْلَمُونَ أَنَّ مَنْ يَلْتَصِقُ بِمُومِسٍ يَكُونُ مَعَهَا جَسَدًا وَاحِدًا؟ فَإِنَّهُ يَقُولُ[a]: «يَصِيرُ الِاثْنَانِ جَسَدًا وَاحِدًا».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «فإنه يقول». لا يُذكر فاعل «يقول» صراحةً في اليونانية.'
    reason: lexical_alternative
  - marker: b
    text: الاقتباس من تكوين 2:24.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ οὐκ οἴδατε
  choice: أَمَا تَعْلَمُونَ
  rationale: صيغة استفهام إنكاري عربية طبيعية تنقل العبارة البولسية وتصلها بالحجة السابقة؛ وتؤدي ἢ هنا وظيفة الانتقال إلى بديل حجاجي، وهو ما تستوعبه «أما».
- source_word: ὁ κολλώμενος
  choice: مَنْ يَلْتَصِقُ
  rationale: يحافظ «يلتصق» على معنى الانضمام والاتحاد في κολλάομαι، وعلى الصلة اللفظية المناسبة بالسياق الجنسي دون شرح زائد.
- source_word: τῇ πόρνῃ
  choice: بِزَانِيَةٍ
  rationale: πόρνη تدل تحديدًا على امرأة تمارس البغاء. وجاءت النكرة لأن أداة التعريف اليونانية هنا تفيد الجنس لا امرأة بعينها.
- source_word: ἓν σῶμά ἐστιν
  choice: يَصِيرُ مَعَهَا جَسَدًا وَاحِدًا
  rationale: يصرّح «معها» بالعلاقة المفهومة من اليونانية، ويعبّر «يصير» بوضوح عن الاتحاد الناتج في هذا السياق، مع بقاء البديل الأقرب إلى الصيغة في الحاشية.
- source_word: Ἔσονται γάρ
  choice: فَقَدْ ... يَصِيرُ
  rationale: تنقل الفاء تعليل γάρ، ويؤدي «يصير» معنى تركيب المستقبل مع εἰς في الاقتباس، أي الدخول في حالة الجسد الواحد.
- source_word: φησίν
  choice: قَالَ
  rationale: يحافظ على المفرد في النص اليوناني من غير تعيين مرجعه داخل المتن؛ وتوضح الحاشية مصدر القول.
- source_word: οἱ δύο
  choice: الِاثْنَانِ
  rationale: مقابل مباشر وموجز للعبارة اليونانية.
- source_word: εἰς σάρκα μίαν
  choice: جَسَدًا وَاحِدًا
  rationale: «جسد واحد» هو التعبير العربي المألوف والدقيق لاقتباس تكوين 2:24، ويحفظ الدلالة الجسدية والعلاقية لـσάρξ هنا.
theological_decisions:
- issue: دلالة اقتباس التكوين على الاتحاد الجنسي خارج الزواج
  choice: 'إبقاء استدلال بولس كما هو: الالتصاق بالزانية ينشئ اتحاد «جسد واحد».'
  alternative: قصر عبارة «جسد واحد» على الزواج، أو إضافة استنتاجات عقائدية وأخلاقية لا ينص عليها العدد نفسه.
  rationale: يطبّق بولس تكوين 2:24 على العلاقة مع الزانية ليؤسس حقيقة الاتحاد الجسدي. تحافظ الصياغة على هذه القوة اللاهوتية وعلى توترها، من غير توسيع أو تقييد تفسيري.
- issue: مرجع الفاعل في φησίν
  choice: «قال» مع إبقاء القائل غير مصرّح به في المتن.
  alternative: «يقول الكتاب» أو «قال الله».
  rationale: اليونانية تقول حرفيًا «يقول/قال» من غير تسمية الفاعل؛ لذلك لا ينبغي حسم المرجع داخل النص، مع إمكان بيان أن الاقتباس كتابي في الحاشية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «زانية» بمعنى امرأة تمارس البغاء، و«يلتصق» لصون صورة الاتحاد في الأصل. وُضعت علامتا الحاشية [a] و[b] كلتاهما في المتن.
