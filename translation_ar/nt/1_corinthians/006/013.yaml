reference: 1 Corinthians 6:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: ar
  text: الأطعمة للبطن، والبطن للأطعمة؛ لكن الله سيُبطل البطن والأطعمة كليهما.[b] أما الجسد فليس للفجور الجنسي، بل للرب، والرب للجسد.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: قد تكون عبارة «الأطعمة للبطن، والبطن للأطعمة» شعارًا كان بعض أهل كورنثوس يرددونه، ثم يردّ عليه بولس؛ لكن النص اليوناني لا ينص صراحة على أنها اقتباس.
    reason: alternative_reading
  - marker: b
    text: يمكن أيضًا ترجمة «سيُبطل» بـ«سيُزيل» أو «سيُهلك».
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώματα
  choice: الأطعمة
  rationale: صيغة الجمع في اليونانية طبيعية وواضحة في العربية، وتحافظ على المقابلة بين الأطعمة والبطن.
- source_word: κοιλίᾳ / κοιλία
  choice: البطن
  rationale: يدل السياق على عضو الأكل والهضم؛ و«البطن» هو المقابل العربي المباشر والطبيعي هنا.
- source_word: καταργήσει
  choice: سيُبطل
  rationale: يفيد الفعل إنهاء الفاعلية أو إزالة الشيء من العمل، و«سيُبطل» يحفظ هذا الاتساع من غير أن يحصر المعنى في الإهلاك المادي.
- source_word: ταύτην καὶ ταῦτα
  choice: هذا وتلك
  rationale: 'يحافظ اسما الإشارة على اختلاف الجنس والعدد في الأصل: «هذا» عائد إلى البطن، و«تلك» إلى الأطعمة، مع بيان المرجع في الحاشية.'
- source_word: σῶμα
  choice: الجسد
  rationale: هو المقابل المألوف في العربية لجسد الإنسان المادي ذي الدلالة اللاهوتية في السياق البولسي.
- source_word: πορνείᾳ
  choice: الزنى
  rationale: في هذا السياق يدل اللفظ على السلوك الجنسي المحرّم؛ و«الزنى» تعبير كتابي عربي موجز ومفهوم، وإن كان «الفجور الجنسي» بديلاً أوسع لفظًا.
- source_word: κυρίῳ / κύριος
  choice: الرب
  rationale: يحفظ اللقب المسيحاني المألوف وثقله اللاهوتي، مع إبقاء العلاقة المتبادلة الموجزة بين الرب والجسد.
- source_word: δὲ
  choice: لكن / أما
  rationale: نُقل التقابل الأول بـ«لكن»، والثاني ببنية «أما... فـ» العربية، لإظهار انتقال الحجة وتعارض الجسد المكرّس للرب مع الزنى.
theological_decisions:
- issue: هل العبارة الافتتاحية شعار كورنثي يقتبسه بولس أم تقرير منه؟
  choice: إيرادها بين علامتي اقتباس من غير إضافة «تقولون» أو نسبة صريحة إلى أهل كورنثوس
  alternative: إيرادها بلا علامتي اقتباس، أو إضافة «تقولون»
  rationale: النص اليوناني لا يصرّح بأنها اقتباس، لكن بنيتها الشعارية والسياق يتيحان هذا الفهم. علامتا الاقتباس تعرضان الاحتمال مع تجنب إضافة متكلم غير مذكور، وتوضح الحاشية موضع الخلاف.
- issue: دلالة καταργήσει في شأن البطن والأطعمة
  choice: التعبير عن إنهاء الفاعلية بلفظ «سيُبطل»
  alternative: «سيُهلك» أو «سيزيل»
  rationale: يحفظ الاختيار فكرة زوال الوظيفة أو انتهاء الترتيب من غير الجزم بأن المقصود فناء مادي محض.
- issue: قوة العبارة «والرب للجسد»
  choice: الإبقاء على الصياغة المتبادلة الموجزة
  alternative: «والرب يعتني بالجسد» أو «والرب لخير الجسد»
  rationale: الأصل مقتضب وموازٍ لعبارة «الجسد... للرب»، وأي توسعة ستحدد طبيعة علاقة الرب بالجسد بما يتجاوز منطوق النص.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حُفظ التوازي الموجز في الأصل، واستُعمل الجمع «الأطعمة» كما في اليونانية. وُضعت العبارة الأولى بين علامتي اقتباس مع حاشية تحفظ عدم اليقين بشأن كونها شعارًا كورنثيًا.
