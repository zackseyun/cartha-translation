base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: ar
  text: «كُلُّ شَيْءٍ مُباحٌ لِي»[a]، لكن ليس كلُّ شيءٍ نافعًا[b]. «كُلُّ شَيْءٍ مُباحٌ لِي»، لكنني لن أكون خاضعًا لسلطان أيِّ شيء[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو من دون علامتي اقتباس: كلُّ شيءٍ مباحٌ لي. ويرى كثيرون أن هذه العبارة شعارٌ لأهل كورنثوس يقتبسه بولس ثم يقيّده.'
    reason: alternative_reading
  - marker: b
    text: 'أو: مُجْدٍ، أو: مفيد.'
    reason: lexical_alternative
  - marker: c
    text: 'أو: لكنني لن أُجعَل تحت سلطان أيِّ شيء.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα μοι ἔξεστιν
  choice: كُلُّ شَيْءٍ مُباحٌ لِي
  rationale: ينقل شمول Πάντα ودلالة الإباحة في ἔξεστιν، ويحافظ على الصيغة الموجزة المتكررة التي يُحتمل أنها شعار كورنثي.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: لكن ليس كلُّ شيءٍ نافعًا
  rationale: «نافعًا» تعبّر بوضوح عن معنى الجدوى والمنفعة في συμφέρει، من غير حصره في الربح المادي، مع إبقاء تكرار «كل شيء».
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι
  choice: لكنني لن أدعَ ... يتسلَّط عليَّ
  rationale: صياغة عربية طبيعية تنقل معنى المستقبل المبني للمجهول، أي الخضوع لسلطان شيء أو سيطرته، وتحفظ إبراز موقف المتكلم.
- source_word: ὑπό τινος
  choice: شيئًا
  rationale: الضمير اليوناني غير المحدد واسع الدلالة، لكن سياق الأفعال والشهوات يرجّح المقابل غير العاقل «شيئًا» في العربية.
theological_decisions:
- issue: هل Πάντα μοι ἔξεστιν شعار كورنثي يقتبسه بولس؟
  choice: وضع العبارة المتكررة بين علامتي اقتباس بوصفها شعارًا محتملًا
  alternative: قراءتها من دون علامتي اقتباس على أنها تقرير من بولس يقيّده بما يلي
  rationale: المخطوطات اليونانية لا تحسم وجود اقتباس، غير أن فهمها شعارًا كورنثيًا واسع القبول ويلائم بنية الرد. لذلك حُفظ اللفظ نفسه ووُثّق الاحتمال الآخر في الحاشية بدل إخفاء الغموض.
- issue: طبيعة السلطان في ἐξουσιασθήσομαι
  choice: التسلط أو السيطرة من أي شيء
  alternative: أن أُجعَل تحت سلطان شيء
  rationale: كلا التعبيرين يحفظ صورة الخضوع للسلطان، ولا تُقيَّد العبارة بنوع مخصوص من الإدمان أو السلوك حتى لا يُحسم عموم النص لاهوتيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة النبرة. استُخدمت «مباح» بدل «حلال» لتجنب إيحاء اصطلاحي أضيق، و«يتسلط عليّ» لإظهار مجاز السلطة في اليونانية بصياغة طبيعية. وُضعت جميع علامات الحواشي في المتن.
