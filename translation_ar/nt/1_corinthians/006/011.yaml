  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: ar
  text: وكان بعضكم هكذا. لكنكم اغتسلتم[a]، لكنكم قُدِّستم، لكنكم بُرِّرتم باسم الرب يسوع وبروح إلهنا.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «غُسِلتم». والصيغة اليونانية وسطى، ويمكن أن تُفهم بمعنى انعكاسي، لكن كثيرين يفهمونها في هذا السياق ضمن أفعال الله الخلاصية.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: وهكذا كان بعضكم
  rationale: صياغة عربية طبيعية تُحيل إلى أصناف الأشخاص المذكورة سابقًا، وتحفظ معنى الهوية الماضية من غير التعبير الحرفي المتكلف «كنتم هذه الأشياء».
- source_word: ἀλλὰ
  choice: لكنكم ... بل ... بل
  rationale: تحفظ أدوات الاستدراك المتكررة قوة التحول وإيقاعه، مع استعمال «بل» بعد الاستدراك الأول لأن تكرار «لكن» أقل سلاسة في العربية.
- source_word: ἀπελούσασθε
  choice: اغتسلتم
  rationale: يعكس صيغة الوسط اليونانية على نحو مباشر، مع إبقاء احتمال المعنى المبني للمجهول في الحاشية بسبب سياق الفعلين المبنيين للمجهول التاليين.
- source_word: ἡγιάσθητε
  choice: تقدَّستم
  rationale: ينقل صيغة المبني للمجهول ومعنى جعلهم مقدسين أو تخصيصهم لله، ويحافظ على المصطلح الكتابي المألوف.
- source_word: ἐδικαιώθητε
  choice: تبرَّرتم
  rationale: المقابل العربي الكتابي الموجز للفعل، ويحفظ دلالته القضائية والخلاصية من غير توسيع تفسيري.
- source_word: ἐν τῷ ὀνόματι
  choice: باسم
  rationale: تعبير عربي طبيعي يحتمل معنى الوسيلة والسلطان والارتباط بالاسم.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: الرب يسوع
  rationale: نقل مباشر للقب والاسم كما يردان في المصدر.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: بروح إلهنا
  rationale: تحمل الباء معنى الوسيلة أو المجال في العربية، وتلائم توازي العبارة مع «باسم» من غير حسم زائد لدلالة ἐν.
theological_decisions:
- issue: الصوت والفاعلية في ἀπελούσασθε
  choice: اغتسلتم
  alternative: غُسِلتم أو تطهَّرتم
  rationale: الصيغة اليونانية وسطية ويمكن فهمها انعكاسيًا، لكن سياق «تقدستم» و«تبررتم» يسمح أيضًا بفهمها ضمن أفعال الله الخلاصية؛ لذلك أُبقي البديل في الحاشية.
- issue: مرجع πνεύματι
  choice: روح إلهنا، مع كتابة «روح» بما يدل سياقيًا على روح الله
  alternative: مجال روحي عام
  rationale: الإضافة الصريحة «روح إلهنا» تشير طبيعيًا إلى روح الله، من غير إضافة لفظ «القدس» غير الموجود في الآية.
- issue: دلالة ἐν في العبارتين الختاميتين
  choice: باسم ... وبروح
  alternative: في اسم ... وفي روح
  rationale: الباء أفصح عربيًا هنا وتتيح الدلالة الأداتية، بينما يظل معنى المجال أو الارتباط ممكنًا ولا يُشرح داخل النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. حُفظ التباين البلاغي بين الماضي والتحول الخلاصي، مع تجنب الحرفية غير الطبيعية، وعدم إضافة تحديدات عقائدية لا يصرح بها النص.
