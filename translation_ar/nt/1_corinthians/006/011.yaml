  naturalness: «وهكذا كان بعضكم» مفهومة، لكن «وكان بعضكم هكذا» أيسر وأفصح في الإحالة إلى الأصناف المذكورة سابقًا. وتكرار «لكنكم» مقبول ومقصود هنا لحفظ الإيقاع التقابلي في النص.
  terminology: «قُدِّستم» يحفظ مصطلح التقديس وصيغة المبني للمجهول، و«بُرِّرتم» يحفظ المصطلح القضائي اللاهوتي وصيغته. و«باسم الرب يسوع وبروح إلهنا» نقل طبيعي لا يحسم زيادةً دلالة ἐν.
