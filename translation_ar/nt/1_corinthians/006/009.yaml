language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: ar
  text: 'أوَلا تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تنخدعوا: فلا مرتكبو الفجور الجنسي، ولا عبدة الأوثان، ولا مرتكبو الخيانة الزوجية، ولا المتأنثون[a]، ولا مضاجعو الذكور[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «الرخوون» أو «الناعمون». وقد يدل اللفظ اليوناني μαλακοί على الليونة أو التأنث أو الضعف الأخلاقي، وربما قصد في هذا السياق البغايا الذكور أو الطرف المتلقي في جماع بين ذكرين.'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «الرجال الذين يمارسون الجنس مع الرجال»، أو على نحو أوسع: «الرجال الذين يمارسون جنسًا محرّمًا مع الذكور». اللفظ اليوناني ἀρσενοκοῖται نادر ودلالته موضع نقاش، ويربطه كثيرون بصياغة سفر اللاويين في الترجمة اليونانية.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: أمَا
  rationale: تستأنف الحجة بسؤال إنكاري حاد، وتحفظ صلة الكلام بما قبله.
- source_word: οὐκ οἴδατε
  choice: تعلمون
  rationale: صياغة عربية طبيعية للسؤال البلاغي البولسي المتكرر، مع إبقاء معنى المعرفة المباشر.
- source_word: ἄδικοι
  choice: الظالمين
  rationale: ينقل الفئة الأخلاقية العامة التي يدل عليها اللفظ، من غير حصرها في فعل واحد بعينه.
- source_word: θεοῦ βασιλείαν
  choice: ملكوت الله
  rationale: تعبير كتابي عربي راسخ يحفظ البعد السيادي والأخروي للعبارة اليونانية.
- source_word: κληρονομήσουσιν
  choice: لن يرثوا
  rationale: يحفظ صورة الميراث وما لها من إيحاءات عهدية وأخروية.
- source_word: μὴ πλανᾶσθε
  choice: لا تضلّوا
  rationale: يجوز أن يفيد الفعل الانخداع أو الانقياد إلى الضلال؛ وهذه الصياغة موجزة وتحفظ التحذير من كليهما.
- source_word: πόρνοι
  choice: مرتكبو الفجور الجنسي
  rationale: تعبير وصفي واسع يشمل الفجور الجنسي ولا يضيّقه في الزنى الزوجي، الذي يرد بعده بلفظ مستقل.
- source_word: εἰδωλολάτραι
  choice: عبدة الأوثان
  rationale: مقابل عربي مباشر ومفهوم يدل على عبادة الأصنام أو الأوثان.
- source_word: μοιχοὶ
  choice: مرتكبو الزنى
  rationale: يميّز الخيانة الزوجية المقصودة هنا من الفجور الجنسي الأعم في πόρνοι.
- source_word: μαλακοὶ
  choice: المتأنثون
  rationale: يحفظ على نحو موجز معنى الليونة أو التشبه بالنساء الذي قد يحمله اللفظ، من غير الجزم في المتن بأنه مصطلح تقني للشريك المتلقي في علاقة جنسية؛ وتُذكر الاحتمالات في الحاشية.
- source_word: ἀρσενοκοῖται
  choice: مضاجعو الذكور
  rationale: صياغة وصفية قريبة من مركّبي اللفظ، «ذكر» و«مضجع»، وتتجنب إسقاط تصنيفات الهوية الجنسية الحديثة على النص القديم.
theological_decisions:
- issue: دلالة μαλακοὶ وἀρσενοκοῖται في قائمة الرذائل
  choice: المتأنثون، ومضاجعو الذكور
  alternative: 'الرخوون أو المنغمسون في الترف؛ وربما البغايا الذكور أو الطرف المتلقي في جماع بين ذكرين؛ وللثاني: الرجال الذين يمارسون الجنس مع الرجال أو الذين يمارسون جنسًا محرّمًا مع الذكور'
  rationale: اللفظان موضع نقاش معجمي وتفسيري. يحافظ المتن على تمييزهما وعلى الصلة المحتملة بالممارسات الجنسية بين الذكور، لكنه لا يحوّلهما إلى فئات هوية حديثة، وتوثّق الحواشي وجوه الدلالة الأخرى بدل حسمها ضمنًا.
translation_notes:
  register: العربية فصحى معاصرة واضحة وذات نبرة كتابية رصينة. استُعمل «ملكوت الله» بوصفه اصطلاحًا كتابيًا مألوفًا، وصيغت ألفاظ قائمة الرذائل بصيغ وصفية متوازية. وُضعت علامتا الحاشيتين بعد اللفظين اليونانيين المتنازع في دلالتهما مباشرة.
