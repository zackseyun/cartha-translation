base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: ar
  text: اهربوا من الفجور الجنسي. كل خطيئة قد يرتكبها إنسان هي خارج الجسد، أما من يمارس الفجور الجنسي فيرتكب خطيئة بحق جسده الخاص.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «يخطئ إلى جسده الخاص». قد تُترجم أيضًا: «يخطئ ضد جسده الخاص».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φεύγετε
  choice: اهربوا
  rationale: فعل أمر حاضر للجمع يفيد الحث العاجل والمستمر على الابتعاد؛ و«اهربوا» يحفظ قوة الصورة والأمر.
- source_word: πορνείαν
  choice: الفجور الجنسي
  rationale: يدل اللفظ على السلوك الجنسي غير المشروع بوجه عام، لا على صورة واحدة منه فقط.
- source_word: πᾶν ἁμάρτημα
  choice: كل خطيئة
  rationale: ترجمة مباشرة وطبيعية تحفظ الصياغة العامة الشاملة في اليونانية.
- source_word: ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: قد يرتكبها إنسان
  rationale: «إنسان» ينقل الدلالة البشرية العامة لـἄνθρωπος دون قصرها على الذكر، و«قد يرتكبها» يؤدي معنى التركيب الاحتمالي مع فعل الخطيئة.
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: هي خارج الجسد
  rationale: يحفظ التعبير المكاني المجازي والتقابل الصريح مع العبارة التالية دون تفسير الخلاف التفسيري.
- source_word: ὁ δὲ πορνεύων
  choice: أما من يمارس الفجور الجنسي
  rationale: يحفظ القوة الفعلية لاسم الفاعل الحاضر ويربطه بالمصطلح نفسه في صدر الآية.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: فيخطئ إلى جسده نفسه
  rationale: تُبقي «إلى» الاتجاه غير المعتاد في εἰς وتحفظ قدرًا من غموض العبارة، بينما تؤكد «نفسه» معنى ἴδιον الانعكاسي.
theological_decisions:
- issue: الدلالة العامة لكلمة ἄνθρωπος
  choice: إنسان
  alternative: رجل
  rationale: الكلمة مفردة مذكرة نحويًا، لكنها هنا تمثيلية عامة؛ و«إنسان» عربية فصيحة طبيعية تحفظ الشمول من غير إضافة تمييز غير مقصود.
- issue: قول بولس إن كل خطيئة هي «خارج الجسد»
  choice: نقل العبارة مباشرة كما وردت
  alternative: عرضها بوصفها شعارًا مقتبسًا أو تقييد معناها تفسيريًا
  rationale: النص اليوناني يوردها مباشرة، ومعناها موضع نقاش؛ لذلك تُحفظ حدة العبارة وتوترها اللاهوتي بلا حسم تفسيري داخل المتن.
- issue: دلالة εἰς في علاقة الخطيئة بالجسد
  choice: يخطئ إلى جسده نفسه
  alternative: يخطئ ضد جسده نفسه
  rationale: «ضد» تفسير عربي مفهوم ومحتمل، لكن «إلى» أقرب إلى صورة الأصل غير المألوفة وتحفظ الغموض الحقيقي في جهة العلاقة.
translation_notes:
  register: عربية فصحى حديثة واضحة ومهيبة. استُعمل «الفجور الجنسي» لتغطية سعة πορνεία، وحُفظت صياغة «خارج الجسد» بلا تلطيف. وُضعت علامة الحاشية [a] بعد العبارة التي تشرحها.
