  text: بل أخٌ يُقاضي أخًا[a]، وذلك أمام غير المؤمنين[b]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: المقصود بالأخوين هنا عضوان في جماعة المؤمنين.
    reason: cultural_note
  - marker: b
    text: 'أو: «لدى غير المؤمنين». يُرجَّح أن العبارة تشير إلى محاكم دنيوية يتولاها أشخاص من خارج جماعة المؤمنين، لكن اليونانية تقول ببساطة: «أمام غير المؤمنين».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد مقابلة قوية مع ما كان ينبغي أن يحدث بحسب الآية السابقة، وتأتي طبيعية في هذا السياق الاستنكاري.
- source_word: ἀδελφὸς μετὰ ἀδελφοῦ
  choice: أخٌ أخاه
  rationale: تحافظ على تكرار لغة الأخوّة بصياغة عربية طبيعية، ويفيد السياق أن المقصود عضوان في جماعة المؤمنين.
- source_word: κρίνεται
  choice: يُحاكِمُ
  rationale: الفعل هنا ذو دلالة قضائية في سياق الخصومات والدعاوى؛ وهذه الصياغة توضح أن أحد الطرفين يقاضي الآخر من غير إضافة تفاصيل لا ينص عليها اليوناني.
- source_word: καὶ τοῦτο
  choice: وذلك
  rationale: 'تنقل العبارة التي تزيد الاستنكار: ليست المشكلة في الخصومة وحدها، بل في وقوعها أمام غير المؤمنين.'
- source_word: ἐπὶ ἀπίστων
  choice: أمام غير المؤمنين
  rationale: تحفظ عموم التعبير اليوناني ودلالته على الجهة التي تُعرض أمامها القضية، من غير تقييده بلفظ «القضاة» غير المذكور صراحة.
theological_decisions:
- issue: الدلالة التمثيلية للفظ ἀδελφός داخل الكنيسة
  choice: أخٌ أخاه
  alternative: مؤمنٌ مؤمنًا آخر
  rationale: حُفظت صورة الأخوّة وصيغة المذكر المفرد في النص، مع بيان أن المقصود في السياق أفراد جماعة المؤمنين.
- issue: مدى دلالة ἀπίστων
  choice: غير المؤمنين
  alternative: قضاة غير مؤمنين
  rationale: يحافظ هذا الاختيار على المقابلة بين جماعة المؤمنين ومن هم خارج الإيمان، من غير حصر اللفظ في القضاة، وإن كان السياق القضائي يرجح أنهم القائمون على المحاكم.
