translation:
  language: ar
  text: بل أنتم أنفسكم تظلمون وتسلبون الحقوق، وذلك في حق إخوتكم[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «إخوتكم وأخواتكم»؛ فاللفظ اليوناني يعني حرفيًا «الإخوة»، وقد يشير هنا إلى المؤمنين عمومًا.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: بل
  rationale: تفيد انتقالًا تقابليًا قويًا من لوم التقاضي إلى كشف أن المخاطَبين أنفسهم يرتكبون الظلم.
- source_word: ὑμεῖς
  choice: أنتم أنفسكم
  rationale: يحفظ توكيد الضمير اليوناني الصريح ويلقي المسؤولية مباشرة على أهل كورنثوس.
- source_word: ἀδικεῖτε
  choice: تَظلِمون
  rationale: فعل عربي طبيعي واسع الدلالة يعبّر عن ارتكاب الظلم أو التعدي على حقوق الآخرين دون تقييد نوع الإساءة.
- source_word: ἀποστερεῖτε
  choice: تَسلُبون الحقوق
  rationale: ينقل معنى حرمان الآخرين مما هو حق لهم أو الاحتيال عليهم، ويلائم السياق الحقوقي والقضائي دون مبالغة توحي بالسرقة القسرية.
- source_word: καὶ τοῦτο
  choice: وتفعلون ذلك
  rationale: 'صياغة عربية واضحة تحفظ التشديد البلاغي: لا يقتصر الأمر على ارتكاب الفعل، بل يقع على الإخوة أنفسهم.'
- source_word: ἀδελφούς
  choice: إخوتكم
  rationale: يحفظ الصورة العائلية واللفظ المذكر الجمع في الأصل، مع بيان إمكان شموله عموم المؤمنين في الحاشية؛ وأضيف ضمير الخطاب طبيعيًا بحسب السياق.
theological_decisions:
- issue: مدلول ἀδελφούς في سياق جماعة قد تضم الرجال والنساء
  choice: إخوتكم
  alternative: إخوتكم وأخواتكم؛ أو إخوتكم في الإيمان
  rationale: اللفظ اليوناني مذكر جمع، لكنه قد يُستعمل عن أعضاء جماعة المؤمنين عمومًا. أبقى المتن الصيغة الأقرب إلى الأصل، وتوضح الحاشية سعته السياقية دون حسم ما يتركه اللفظ محتملًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعمل «تَسلُبون الحقوق» بدل «تحتالون» لأن الفعل اليوناني يركز على حرمان الشخص مما له، مع إبقاء النبرة القضائية والأخلاقية للسياق.
