  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: ar
  text: أَيَجْرُؤُ أحدٌ منكم، إذا كانت له دعوى على آخر، أن يتحاكم أمام غير العادلين، لا أمام القديسين؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τολμᾷ
  choice: أَيَجْرُؤُ
  rationale: يحافظ على صيغة السؤال الاستنكاري وعلى معنى الإقدام الجريء الذي يحمل هنا نبرة لوم.
- source_word: τις ὑμῶν
  choice: أحدٌ منكم
  rationale: ينقل النكرة المفردة مع الإضافة التبعيضية في تعبير عربي طبيعي ومباشر.
- source_word: πρᾶγμα ἔχων
  choice: إذا كانت له دعوى
  rationale: السياق قضائي، و«دعوى» تنقل معنى القضية القانونية من غير توسع إلى تفاصيل غير مذكورة؛ وصيغة الشرط طبيعية في العربية.
- source_word: πρὸς τὸν ἕτερον
  choice: على أخيه
  rationale: «على» تلائم الدعوى القضائية، و«أخيه» يوضح أن الطرف الآخر فرد من الجماعة في ضوء السياق المباشر، مع إثبات البديل الحرفي في الحاشية.
- source_word: κρίνεσθαι
  choice: أن يتحاكم
  rationale: صيغة المطاوعة العربية تعبّر طبيعيًا عن عرض النزاع للفصل القضائي، وتحفظ كون الشخص خاضعًا للحكم دون العبارة الثقيلة «أن يُحكم فيه».
- source_word: ἐπὶ τῶν ἀδίκων
  choice: أمام الظالمين
  rationale: يحفظ الوصف الأخلاقي الصريح ἀδίκων بدل استبداله تفسيريًا بـ«غير المؤمنين»، و«أمام» ملائمة للمقام القضائي.
- source_word: καὶ οὐχὶ
  choice: لا
  rationale: تنقل المقابلة الاستنكارية بوضوح وإيجاز في العربية، حيث لا يلزم تكرار حرف العطف.
- source_word: ἐπὶ τῶν ἁγίων
  choice: أمام القديسين
  rationale: يحافظ على المصطلح البولسي المقابل للظالمين وعلى التوازي القضائي في «أمام».
theological_decisions:
- issue: المقابلة بين ἀδίκων وἁγίων
  choice: الظالمين ... القديسين
  alternative: غير المؤمنين ... المؤمنين؛ أو غير العادلين ... شعب الله المقدس
  rationale: النص اليوناني يستعمل وصفين مشحونين أخلاقيًا ولا يصرّح بلفظ «غير المؤمنين». لذلك حُفظت المقابلة الأصلية ولم تُحسم دلالتها بتفسير طائفي أو عقدي زائد.
- issue: هوية τὸν ἕτερον في سياق الجماعة
  choice: أخيه
  alternative: الآخر؛ أو شخص آخر
  rationale: الترجمة «أخيه» طبيعية في خطاب موجّه إلى أعضاء الجماعة وتنسجم مع موضوع الإصحاح، لكنها تفسير سياقي لا لفظ حرفي؛ لذلك ذُكر الأصل الأقرب في الحاشية حفاظًا على الشفافية.
- issue: دلالة ἁγίων
  choice: القديسين
  alternative: المؤمنين؛ أو شعب الله المقدس
  rationale: يُحفظ اللقب البولسي بصيغته اللاهوتية المألوفة، مع توضيح مرجعه إلى شعب الله في الحاشية من غير قصره على فئة كنسية خاصة.
translation_notes:
  register: عربية فصحى معاصرة واضحة وذات نبرة كريمة. استُعمل التشكيل الجزئي في مطلع السؤال لتفادي التباس «أيجرؤ»، وحُفظت صيغة الاستنكار والتوازي بين «أمام الظالمين» و«أمام القديسين».
