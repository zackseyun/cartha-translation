  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: ar
  text: أَمْ لَا تَعْلَمُونَ أَنَّ جَسَدَكُمْ هُوَ هَيْكَلٌ لِلرُّوحِ الْقُدُسِ الْمُقِيمِ فِيكُمْ[a]، الَّذِي لَكُمْ مِنَ اللهِ؟ وَلَسْتُمْ مِلْكًا لِأَنْفُسِكُمْ[b]،
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «هيكل للروح القدس الذي فيكم».'
    reason: lexical_alternative
  - marker: b
    text: جاءت كلمة «جسد» في اليونانية بالمفرد، وضمير «كم» بالجمع؛ وقد يُفهم ذلك على أنه يشير إلى جسد كل واحد من المخاطَبين، أو إلى الجسد بصيغة تمثيلية.
    reason: alternative_reading
lexical_decisions:
- source_word: ἢ οὐκ οἴδατε
  choice: أَمَا تَعْلَمُونَ
  rationale: صيغة استفهام إنكاري عربية طبيعية تنقل الانتقال البلاغي الحاد ووظيفة العبارة البولسية، من غير إثقالها بحرف عطف غير لازم في العربية.
- source_word: τὸ σῶμα ὑμῶν
  choice: جَسَدَكُمْ
  rationale: يحافظ على المفرد «الجسد» مع ضمير المخاطبين الجمع، كما في اليونانية، فلا يحسم هل الاستعمال توزيعي أم تمثيلي.
- source_word: ναὸς
  choice: هَيْكَلٌ
  rationale: «هيكل» هو المقابل العربي الواضح للمقدس أو المعبد الداخلي الذي يدل عليه ναός، ويحفظ قوة الاستعارة الدينية.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: لِلرُّوحِ الْقُدُسِ الَّذِي فِيكُمْ
  rationale: ينقل الإضافة وعلاقة الروح بالهيكل، ويجعل «فيكم» متعلقًا بالروح بوضوح طبيعي في العربية.
- source_word: οὗ ἔχετε ἀπὸ θεοῦ
  choice: وَالَّذِي لَكُمْ مِنَ اللهِ
  rationale: يحافظ على معنى الحيازة الحالية ومصدرها من الله، مع صوغ عربي سلس وتجنب إضافة معنى «تسلّمتم» غير المصرح به في الفعل.
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: وَأَنَّكُمْ لَسْتُمْ مِلْكًا لِأَنْفُسِكُمْ
  rationale: 'ينقل بوضوح القوة الاصطلاحية للتركيب اليوناني: أن المخاطبين لا ينتمون إلى أنفسهم، مع ربط طبيعي بالسؤال السابق.'
theological_decisions:
- issue: مرجع الضمير النسبي οὗ وشخصية الروح القدس
  choice: 'جُعل الضمير عائدًا شخصيًا إلى «الروح القدس»: «الذي ... والذي».'
  alternative: إعادة الصياغة بضمير غير شخصي أو جعل العبارة وصفًا للهيكل دون عائد صريح.
  rationale: الضمير اليوناني مرتبط نحويًا بـ«الروح القدس»، والصياغة الشخصية تحترم هذا المرجع من غير إضافة شرح عقائدي إلى النص.
- issue: المفرد «الجسد» مع جمهور بصيغة الجمع
  choice: الإبقاء على «جسدكم» بالمفرد مع ضمير الجمع.
  alternative: «أجسادكم».
  rationale: يحفظ صورة النص اليوناني وإمكان فهمه توزيعيًا، أي جسد كل واحد، أو تمثيليًا، بدل حسم التوتر في الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدمت صيغة «أما تعلمون» للاستفهام الإنكاري، وحُفظ المفرد «جسدكم». أُلحقت علامة الحاشية بالجملة التي تتصل بها الملاحظة.
