  rationale: 'تُصحح المراجعة البنية البلاغية والنحوية للنص: «أم» مع النفي، ثم السؤال الأول وحده، ثم الجملة الخبرية المعطوفة المنتهية بفاصلة. وتحافظ على مفرد «جسدكم» وعلى مرجع الضمير الشخصي إلى الروح القدس، وتستكمل الحواشي المطابقة لمسار التدقيق الإنجليزي.'
