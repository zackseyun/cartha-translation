  source_fidelity: يلزم تعديل الاستهلال ليحفظ حرف العطف الاستدراكي ἢ («أم») والنفي في οὐκ οἴδατε. كما ينبغي أن تكون العبارة الأخيرة خبرية مستقلة، لا استفهامًا ثانيًا، وأن تنتهي بفاصلة كما في النص المصدر المتصل بالآية التالية.
  naturalness: 'الصياغة المعدلة فصيحة واضحة: «أم لا تعلمون» تنقل السؤال البلاغي طبيعيًا، و«لستم ملكًا لأنفسكم» تعبير عربي سليم لمعنى عدم الانتماء إلى الذات.'
  terminology: أُبقي «جسدكم» بالمفرد و«هيكل» و«الروح القدس». واستُعمل «المقيم فيكم» مع حاشية بديلة تحافظ على إمكان التعبير الحرفي «الذي فيكم».
  issues:
