    rationale: «أَمَا تَعْلَمُونَ» سؤال إنكاري عربي ممكن، لكنه لا ينقل بوضوح «أم» ولا «لا» في ἢ οὐκ οἴδατε؛ و«أم لا تعلمون» يحفظهما.
  - severity: medium
    issue: حوّلت المسودة الجملة الختامية إلى سؤال مستقل وربطتها بـ«وأنكم».
    rationale: καὶ οὐκ ἐστὲ ἑαυτῶν جملة خبرية معطوفة، لا استفهامًا جديدًا؛ والنص اليوناني ينتهي بفاصلة.
  - severity: low
    issue: الحاشية الخاصة بالروح القدس الواردة في مسار المراجعة الإنجليزي غير ممثلة.
    rationale: تُضاف حاشية بديلة عند عبارة «المقيم فيكم»، مع إبقاء حاشية المفرد والجمع وعلامتيهما في موضعيهما.
