  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: ar
  text: أقول هذا لخزيكم. أحقًّا لا يوجد بينكم حكيم واحد سيستطيع أن يفصل في أمر أخيه[a]؟
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «أن يفصل بين أخيه». العبارة اليونانية موجزة، والطرف الآخر في النزاع مفهوم من السياق من غير أن يُسمّى. و«الأخ» هنا يشير إلى أحد المؤمنين، وقد يشمل في السياق رجلًا أو امرأة.'
    reason: توضيح الإيجاز التركيبي في اليونانية ودلالة «الأخ» السياقية، من غير إدخال طرف ثانٍ في المتن.
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν λέγω
  choice: أقول هذا لتخجيلكم
  rationale: ينقل العبارة غرض كلام بولس وقوة توبيخه بلغة عربية واضحة، من غير تخفيف معنى الخزي أو المبالغة فيه.
- source_word: οὕτως
  choice: أحقًّا
  rationale: تؤدي قوة الاستفهام الاستنكاري الذي تفيده الكلمة في السياق، بدل ترجمة حرفية جامدة مثل «هكذا».
- source_word: οὐκ ἔνι ἐν ὑμῖν οὐδεὶς σοφὸς
  choice: لا يوجد بينكم حكيم واحد
  rationale: تحافظ على النفي المؤكد وعلى الإطار الجماعي، و«حكيم» صفة اسمية عربية طبيعية لا تفرض جنسًا غير لازم في الصياغة.
- source_word: ὃς δυνήσεται διακρῖναι
  choice: يستطيع أن يفصل
  rationale: الفعل في سياق الخصومات يعني إصدار حكم أو البت بين طرفين؛ و«يفصل» تعبير عربي مألوف في الفصل في النزاع، مع نقل معنى القدرة المستقبلية بصيغة المضارع العربي الطبيعية بعد وصف الشخص المطلوب.
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: بين أخيه وخصمه
  rationale: العبارة اليونانية موجزة وملتبسة من جهة الطرف الثاني بعد «بين». أُثبت «أخيه» حفاظًا على اللغة العائلية، وأُضيف «وخصمه» لاستقامة العربية مع بيان الإضمار في الحاشية.
theological_decisions:
- issue: اللغة العائلية للمؤمنين في جماعة مختلطة
  choice: أخيه
  alternative: أحد المؤمنين
  rationale: يحفظ النص صورة الأخوّة التي يستعملها بولس، من غير استبدالها بتفسير عقائدي؛ ويمكن أن يشمل الاستعمال السياقي المؤمن أو المؤمنة.
- issue: الطرف الثاني المضمر في عبارة «بين»
  choice: وخصمه
  alternative: بين إخوته / في أمر أخيه
  rationale: اليونانية لا تصرّح بالطرف الثاني، بينما العربية تتطلب غالبًا طرفين بعد «بين». «خصمه» يوضح بنية النزاع من السياق من دون تحديد هوية ذلك الطرف، والحاشية تصون الإيجاز والالتباس الأصليين.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «أحقًّا» لإبراز الاستنكار، و«يفصل» للمعنى القضائي في السياق. وُضعت علامة الحاشية في المتن كما يلزم.
