  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: ar
  text: وأقام الله الرب، وسيقيمنا أيضًا بقدرته.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: و
  rationale: أداة ربط خفيفة تواصل الحجة ولا تستلزم هنا معنى الاستدراك القوي؛ والواو هي الأنسب في العربية الطبيعية.
- source_word: θεὸς
  choice: الله
  rationale: المقابل العربي المعياري، وهو الفاعل الصريح لعمل القيامة في الجملتين.
- source_word: τὸν κύριον
  choice: الرب
  rationale: يحفظ اللقب المسيحاني المعتاد في هذا السياق، والمقصود به يسوع.
- source_word: ἤγειρεν
  choice: أقام
  rationale: ينقل فعل الله الماضي في إقامة الرب من الموت، ويتلاءم اصطلاحيًا مع سياق القيامة.
- source_word: ἡμᾶς
  choice: نا
  rationale: ضمير المتكلمين الجمع بوصفه مفعولًا به، ويشير في السياق إلى المؤمنين على نحو شمولي.
- source_word: ἐξεγερεῖ
  choice: سيقيمنا نحن أيضًا
  rationale: يحفظ زمن المستقبل والتوازي الذي تفيده καί مع إقامة الرب؛ وذِكر «نحن» بعد الضمير المتصل يوضح موضع «أيضًا» ويجعل العبارة طبيعية.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: بقدرته
  rationale: تنقل الباء معنى الوسيلة الذي تفيده διά مع المضاف إليه، أي إن قدرة الله هي وسيلة إقامتنا.
theological_decisions:
- issue: دلالة الإقامة في العبارة المستقبلية
  choice: إقامة المؤمنين الجسدية في المستقبل
  alternative: تبرئة إلهية عامة أو إقامة روحية مجازية
  rationale: 'السياق المباشر يتناول الجسد (6: 13-20)، والتوازي مع إقامة الله للرب يرجح القيامة الفعلية للمؤمنين، من غير إضافة تفسير صريح إلى نص الآية.'
translation_notes:
  register: صياغة عربية فصحى معاصرة، موجزة وكريمة النبرة. استُخدم «أقام» في شطري التوازي للمحافظة على وحدة صورة القيامة، مع إبقاء النص بلا توسع تفسيري.
