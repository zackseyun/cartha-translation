  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: ar
  text: وهناك تنوُّعات في الأعمال[a]، لكن الله نفسه هو الذي يعمل كلَّ شيء في الجميع[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «تأثيرات» أو «صور عمل». وتشير الكلمة اليونانية إلى أعمال أو نتائج نشاط فاعل.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «في الجميع». لا يحدد النص اليوناني صراحةً من هم «الجميع»؛ ويرجّح السياق أنهم أعضاء الجماعة الذين يعمل الله فيهم بهذه المظاهر.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: تنوُّع
  rationale: يدل السياق على اختلاف الأنواع أو الصور داخل وحدة المصدر، لا على الانقسام أو النزاع.
- source_word: ἐνεργημάτων
  choice: الأعمال
  rationale: تنقل معنى أفعال القدرة ونتائجها، وتحافظ قدر الإمكان على الصلة اللفظية بالفعل ἐνεργῶν («يعمل») في آخر الآية.
- source_word: ὁ δὲ αὐτὸς θεός
  choice: لكن الله هو هو
  rationale: تحفظ «لكن» المقابلة الخفيفة بين تنوع الأعمال ووحدة مصدرها، ويؤدي «هو هو» توكيد الهوية في αὐτός بصياغة عربية مفهومة.
- source_word: ὁ ἐνεργῶν
  choice: الذي يعمل
  rationale: صياغة عربية طبيعية للمشارك الحاضر، وتحفظ الصلة الجذرية بمفردة «الأعمال».
- source_word: τὰ πάντα
  choice: كلَّ شيء
  rationale: يحفظ شمول العبارة اليونانية من غير تقييدها صراحةً بالمواهب، مع بقاء السياق المباشر حاضرًا.
- source_word: ἐν πᾶσιν
  choice: في الجميع
  rationale: يحفظ عدم ذكر الاسم صراحةً في اليونانية، وتدل صيغة الجمع والسياق على أعضاء الجماعة؛ وتوضح الحاشية هذا الاحتمال.
theological_decisions:
- issue: مدى عمل الله في τὰ πάντα ἐν πᾶσιν
  choice: «الذي يعمل كلَّ شيء في الجميع»
  alternative: «الذي يعمل كل هذه الأمور في جميع الناس»
  rationale: تُبقي الصياغة على سعة τὰ πάντα وعلى الإضمار في πᾶσιν، من غير تحويل السياق الكنسي إلى دعوى عقدية أوسع أو حصر العبارة في المواهب بما يتجاوز النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدم «الله هو هو» لإبراز وحدة الفاعل وسط التنوع، وحُفظت الصلة بين «الأعمال» و«يعمل». وُضعت علامتا الحاشية في موضعيهما داخل النص.
