    rationale: الأصل يقول ἓν πνεῦμα، وتكفي الإشارة إلى إمكان فهمها «روحًا واحدًا» بمعنى أقل تخصيصًا. كما أن توضيح غياب التمييز بالحروف الكبيرة في العربية أدق من اقتراح «واقع روحي مشترك» بوصفه بديلًا مباشرًا.
