reference: 1 Corinthians 12:13
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: ar
  text: فإننا جميعًا، في روحٍ واحدٍ[a]، تعمَّدنا إلى جسدٍ واحدٍ، سواء كنا يهودًا أم يونانيين، عبيدًا أم أحرارًا، وجميعنا سُقينا روحًا واحدًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بروحٍ واحدٍ»؛ فقد تدل أداة الجر اليونانية على المجال («في») أو الوسيلة/الفاعلية («بـ»).'
    reason: alternative_reading
  - marker: b
    text: 'يرجّح السياق أن المقصود هو الروح القدس. ولا تميّز العربية بالحروف الكبيرة بين هذا الفهم وفهم «روحٍ واحدٍ» بمعنى أقل تحديدًا. ويمكن أيضًا ترجمة العبارة: «أُعطينا جميعًا روحًا واحدًا لنشربه».'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: فلأننا
  rationale: تنقل γάρ التعليل والربط بالسياق السابق، وتُفهم نبرة التوكيد من بنية الجملة العربية من غير حشو ثقيل.
- source_word: ἐν ἑνὶ πνεύματι
  choice: في روحٍ واحد
  rationale: تحافظ «في» على الصياغة اليونانية وعلى احتمال دلالة ἐν على المجال أو الوسيلة؛ ويُذكر «بروحٍ واحد» في الحاشية.
- source_word: ἡμεῖς πάντες
  choice: نحن جميعًا
  rationale: تنقل توكيد الضمير الصريح مع πάντες، وقد أُدمج الضمير في «لأننا» مع إبقاء «جميعًا».
- source_word: ἐβαπτίσθημεν
  choice: تعمَّدنا
  rationale: اللفظ العربي المألوف في السياق المسيحي، ويحافظ على المبني للمجهول دلاليًا من خلال صيغة المطاوعة العربية من غير فرض كيفية مادية للمعمودية.
- source_word: εἰς ἓν σῶμα
  choice: إلى جسدٍ واحد
  rationale: تحافظ «إلى» على اتجاه εἰς ونتيجة الانضمام إلى الجسد الواحد.
- source_word: Ἰουδαῖοι ... Ἕλληνες
  choice: يهودًا أم يونانيين
  rationale: تنقل المقابلة العرقية والدينية المباشرة دون توسيع «اليونانيين» تفسيرًا إلى جميع الأمم.
- source_word: δοῦλοι ... ἐλεύθεροι
  choice: عبيدًا أم أحرارًا
  rationale: تعكس بوضوح المقابلة القانونية والاجتماعية بين العبودية والحرية.
- source_word: ἐποτίσθημεν
  choice: سُقينا
  rationale: صيغة عربية موجزة وطبيعية تحفظ المبني للمجهول وصورة الشرب.
- source_word: ἓν πνεῦμα
  choice: روحًا واحدًا
  rationale: السياق يرجّح الروح القدس، لكن العربية لا تستخدم الحروف الكبيرة لتمييز هذا التفسير، ولذلك توضح الحاشية الاحتمال.
theological_decisions:
- issue: 'دلالة ἐν في عبارة ἐν ἑνὶ πνεύματι: المجال أم الوسيلة/الفاعلية'
  choice: في روحٍ واحد
  alternative: بروحٍ واحد
  rationale: الترجمة المختارة أقرب إلى البنية اليونانية وتحفظ التوتر الدلالي، بينما تعرض الحاشية الاحتمال الأداتي من غير حسم مذهبي.
- issue: مرجع ἓν πνεῦμα في العبارة الأخيرة
  choice: روحًا واحدًا، والمقصود على الأرجح الروح القدس
  alternative: روحًا واحدة بمعنى واقع روحي مشترك
  rationale: تكرار πνεῦμα وسياق الأصحاح يرجحان الإشارة إلى الروح القدس، مع بقاء الاحتمال الأقل تحديدًا ممكنًا لغويًا.
- issue: طبيعة صورة السقي في ἐποτίσθημεν
  choice: سُقينا روحًا واحدًا
  alternative: أُعطينا روحًا واحدًا لنشربه
  rationale: «سُقينا» تحفظ الاستعارة والمبني للمجهول ولا تفرض تفسيرًا شعائريًا خاصًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت «تعمَّدنا» و«سُقينا» لصياغة طبيعية موجزة، مع إبقاء الغموض الحقيقي في ἐν وفي مرجع πνεῦμα ضمن الحواشي. جميع علامات الحواشي الواردة مثبتة في المتن.
