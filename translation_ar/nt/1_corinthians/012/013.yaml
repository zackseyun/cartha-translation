review_pass:
  verdict: revise
  source_fidelity: يلزم تصحيح «فلأننا»؛ فهي تجمع الفاء واللام و«لأن» فتجعل العبارة تعليلًا سببيًا («because we») بدل قوة καὶ γάρ التفسيرية المؤكدة («فإننا/فإن»). أما «في روح واحد»، و«إلى جسد واحد»، و«سُقينا روحًا واحدًا» فتنقل العناصر اليونانية الأساسية وتحفظ المبني للمجهول في العبارة الأخيرة وصورة الشرب.
  naturalness: الصياغة بعد استبدال الافتتاح بـ«فإننا» فصيحة وواضحة. و«تعمّدنا إلى جسد واحد» صياغة عربية كنسية مفهومة تحفظ اتجاه εἰς واندماج المعمَّدين في الجسد، وإن كانت أكثر حرفية من «لندخل في جسد واحد».
  terminology: «يهودًا ... يونانيين» دقيقة، و«عبيدًا ... أحرارًا» تنقل بوضوح مقابلة δοῦλοι وἐλεύθεροι. وتبقي «روح» بلا حسم طباعي غير متاح في العربية؛ وينبغي أن تشرح الحاشية الاحتمال من غير أن تجعل «الواقع الروحي المشترك» ترجمة حاسمة للنص.
