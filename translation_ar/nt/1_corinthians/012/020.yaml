  text: But as it is[a], there are many parts, yet one body.
translation:
  language: ar
  text: أَمَّا الْآنَ، فَالْأَعْضَاءُ كَثِيرَةٌ، وَلَكِنَّ الْجَسَدَ وَاحِدٌ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν
  choice: أَمَّا الْآنَ
  rationale: تأتي νῦν هنا في انتقال حِجاجي من الافتراض السابق إلى الواقع القائم؛ وتحافظ «أمّا الآن» على لفظ الزمن وعلى وظيفة الاستئناف والمقابلة.
- source_word: δὲ
  choice: فَـ / وَلَكِنَّ
  rationale: تدل δέ على انتقال تقابلي لطيف، وقد صيغ معناها عربيًا ببنية «أمّا... فـ» ثم بالمقابلة «ولكنّ» بين الكثرة والوحدة.
- source_word: πολλὰ ... μέλη
  choice: الْأَعْضَاءُ كَثِيرَةٌ
  rationale: «الأعضاء» المقابل العربي الطبيعي لـ μέλη في استعارة الجسد، وهو يحفظ المعنى التشريحي كما يظل صالحًا للدلالة على أفراد الجماعة في السياق.
- source_word: μὲν ... δὲ
  choice: '... كَثِيرَةٌ، وَلَكِنَّ ... وَاحِدٌ'
  rationale: نُقلت الموازنة التقابلية بين الكثرة والوحدة بصياغة عربية طبيعية، من غير ترجمة آلية لكل أداة على حدة.
- source_word: ἓν
  choice: وَاحِدٌ
  rationale: يحفظ العدد المفرد تشديد النص على وحدة الجسد في مقابل كثرة الأعضاء.
- source_word: σῶμα
  choice: الْجَسَدَ
  rationale: «الجسد» يحفظ صورة الجسد الممتدة في السياق وقوتها اللاهوتية في الجمع بين التنوع والوحدة.
theological_decisions:
- issue: نقل μέλη في استعارة الجسد
  choice: الأعضاء
  alternative: الأجزاء
  rationale: «الأعضاء» أكثر دقة في صورة الجسد بالعربية، وتحفظ كذلك الصلة بين أعضاء الجسد وأفراد الجماعة من غير فرض اصطلاح طائفي. أما «الأجزاء» فأعمّ وأقل حيوية تشريحيًا.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة، ذات ترتيب طبيعي. استُخدمت «أمّا الآن» لإظهار الانتقال إلى الواقع بعد الافتراض في الآية السابقة، مع إبقاء المقابلة الأساسية بين كثرة الأعضاء ووحدة الجسد.
