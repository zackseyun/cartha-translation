  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: ar
  text: 'وَإِنْ قَالَتِ الأُذُنُ: «لِأَنِّي لَسْتُ عَيْنًا، فَلَسْتُ مِنَ الْجَسَدِ[a]»، فَلَيْسَ ذٰلِكَ سَبَبًا لِأَنْ لَا تَكُونَ مِنَ الْجَسَدِ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبعبارة أكثر سلاسة: «لستُ جزءًا من الجسد» ... «فهذا لا يجعلها أقلَّ انتماءً إلى الجسد». يكرّر النص اليوناني عبارة «من الجسد» لأثر بلاغي.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: وَ
  rationale: حرف عطف يصل هذا المثال بما سبقه في تشبيه أعضاء الجسد.
- source_word: ἐὰν εἴπῃ
  choice: إِنْ قَالَتْ
  rationale: ينقل الشرط الافتراضي العام الذي تعبّر عنه ἐὰν مع صيغة الاحتمال، وهو تعبير عربي طبيعي واضح.
- source_word: τὸ οὖς
  choice: الأُذُنُ
  rationale: المعنى التشريحي المباشر، مع إبقاء تشخيص العضو في سياق التشبيه.
- source_word: Ὅτι
  choice: لِأَنِّي
  rationale: تفيد هنا تعليل ما تقوله الأذن، لا مجرد إدخال مقول القول.
- source_word: ὀφθαλμός
  choice: عَيْنًا
  rationale: المقابل التشريحي المباشر، وجاء منصوبًا خبرًا لـ«لست».
- source_word: ἐκ τοῦ σώματος
  choice: مِنَ الْجَسَدِ
  rationale: يحافظ على دلالة ἐκ وعلى تكرار العبارة في حجة بولس، بدل استبدالها في الموضعين بعبارة تفسيرية مثل «جزءًا من الجسد».
- source_word: οὐ παρὰ τοῦτο
  choice: فَلَيْسَتْ لِهَذَا السَّبَبِ
  rationale: ينفي أن يكون السبب المذكور أساسًا للنتيجة، ويحافظ على البنية الجدلية للنص.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: مِنْ غَيْرِ الْجَسَدِ
  rationale: 'صياغة عربية مفهومة تحفظ النفي المقصود: قول الأذن هذا لا يجعلها خارجة عن الجسد، مع تجنب تركيب عربي ملتبس من نوع «ليست ليست من الجسد».'
theological_decisions:
- issue: تفسير استعارة الجسد وتنعيم بنيتها البلاغية
  choice: الإبقاء في المتن على لغة «من الجسد» وعلى منطق النفي، مع صياغة عربية تمنع التباس النفي المزدوج.
  alternative: «فهذا لا يجعلها أقل انتماءً إلى الجسد» أو «فليست لذلك غيرَ جزء من الجسد».
  rationale: المقطع يوضح الانتماء داخل الجسد الواحد، لكنه يفعل ذلك بحجة بلاغية مخصوصة. إبقاء صورتها يمنع إدخال شرح كنسي أوسع مما يقوله النص نفسه، بينما تبيّن الحاشية الصياغة الاصطلاحية الممكنة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ تشخيص الأذن وتكرار «من الجسد» قدر الإمكان، وعولج النفي المزدوج بصياغة «من غير الجسد» حتى يبقى المعنى واضحًا للقارئ العادي.
