  source_fidelity: المسودة تحافظ جيدًا على الشرط الافتراضي، وتشخيص الأذن، والتعليل، وتكرار «من الجسد». لكن «فَلَيْسَتْ لِهَذَا السَّبَبِ مِنْ غَيْرِ الْجَسَدِ» لا تنقل النفي اليوناني المزدوج نقلاً سليمًا؛ فـ«من غير الجسد» تعني حرفيًا «من شيءٍ غير الجسد»، ولا تفيد بوضوح «ليست من الجسد».
