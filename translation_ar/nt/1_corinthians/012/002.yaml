  - severity: low
    issue: «من الأمم» في المتن
    rationale: يمكن أن تُفهم على أنها انتماء إلى أمم أو شعوب عمومًا، بدل الاستعمال البولسي الخاص بغير اليهود؛ «أمميين» أدق اصطلاحيًا، مع شرحها في حاشية.
