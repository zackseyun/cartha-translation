  verdict: revise
  source_fidelity: يحفظ المسودّة المعنى العام، بما فيه الانتماء السابق إلى الأمم والانقياد السلبي نحو الأصنام. لكن «كيفما اتفق أن تُقادوا» يضيف إيحاء المصادفة («اتفق») ولا ينقل التركيب اليوناني بأوضح صورة؛ فـὡς ἂν تفيد «على أي نحو/بأيّة طريقة»، لا المصادفة. كما أن اجتماع «تُساقون» ثم «تُقادوا» في الصياغة الحالية ثقيل، مع أن التكرار الدلالي في اليونانية ينبغي أن يبقى ظاهرًا دون افتعال.
  naturalness: «أنتم تعرفون» سليمة، لكن «أنتم تعلمون» أيسر في الاستهلال. والصياغة المنقحة تجعل العبارة الكيفية أكثر فصاحة ووضوحًا في العربية الفصحى الحديثة، مع إبقاء البنية غير المحددة المقصودة.
  terminology: «أمميين» هو المقابل الكنسي العربي المألوف لـἔθνη في هذا السياق، وتحسّنه الحاشية ببيان «من غير اليهود». أما «الخرساء» فمفهومة، لكن «التي لا تنطق» أوضح للأصنام في الاستعمال الحديث ويحفظ تحديد العجز عن الكلام، لا مجرد الصمت.
