  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: ar
  text: أنتم تعلمون أنه حين كنتم أمميين[a]، كنتم تُساقون إلى الأصنام التي لا تنطق، على أي نحو كنتم تُقادون[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: من غير اليهود؛ أو: «من الأمم».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «بأيّة طريقة كنتم تُقادون». يشدد التعبير اليوناني على انقيادهم السلبي السابق، ويجمع بين فعلَي «تُقادون» و«تُساقون».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: أنتم تعرفون
  rationale: ينقل فعل المعرفة المباشر بوصفه تذكيرًا بخبرة مشتركة، مع إبراز الضمير بما يلائم الاستهلال العربي.
- source_word: ἔθνη
  choice: من الأمم
  rationale: يحفظ الدلالة الإثنية الدينية في الاستعمال البولسي دون النبرة الانتقاصية المحتملة في «وثنيين».
- source_word: πρὸς τὰ εἴδωλα
  choice: إلى الأصنام
  rationale: يحفظ معنى الاتجاه والحركة الذي تؤديه πρός مع النصب.
- source_word: τὰ ἄφωνα
  choice: الخرساء
  rationale: تعبير عربي موجز يبرز عجز الأصنام عن الكلام ويحفظ المقابلة مع الأقوال الروحية في السياق.
- source_word: ὡς ἂν
  choice: كيفما اتفق
  rationale: ينقل القوة الكيفية غير المحددة للتركيب، أي على أي نحو كان يحدث أن يُقادوا.
- source_word: ἤγεσθε
  choice: تُقادوا
  rationale: يحفظ صيغة المبني للمجهول والزمن الماضي المستمر في إطار «كان».
- source_word: ἀπαγόμενοι
  choice: تُساقون
  rationale: ينقل الحركة السلبية المتكررة أو المستمرة والانقياد تحت تأثير سابق، مع تجنب تكرار «تُقادون» حرفيًا.
theological_decisions:
- issue: دلالة ἔθνη على حال الكورنثيين السابقة
  choice: من الأمم
  alternative: وثنيين
  rationale: يحافظ على البعد الإثني الديني للنص دون أن يختزل اللفظة في حكم أخلاقي أو يستورد نبرة قدحية زائدة.
- issue: المقابلة البلاغية بين الأصنام التي لا تتكلم والكلام بوحي الروح في السياق
  choice: الأصنام الخرساء
  alternative: الأصنام التي لا تستطيع الكلام
  rationale: يحفظ الإيجاز والقوة البلاغية في الأصل دون إضافة شرح تفسيري إلى المتن.
- issue: توكيد الانقياد السلبي في ἤγεσθε ἀπαγόμενοι
  choice: كنتم تُساقون... كيفما اتفق أن تُقادوا
  alternative: كنتم تنقادون... كيفما انقدتم
  rationale: يحفظ المبني للمجهول في الفعلين والتوتر القائم في الأصل بشأن وقوعهم تحت تأثير يقودهم، من غير تحديد ماهية ذلك التأثير.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «من الأمم» بدل «وثنيين» لصون الدلالة الأصلية، و«الخرساء» للمحافظة على الصورة البلاغية الموجزة. وُضع كل مؤشري الحاشيتين [a] و[b] في المتن.
