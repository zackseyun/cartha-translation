- from: أنتم تعرفون أنكم حين كنتم من الأمم[a]، كنتم تُساقون إلى الأصنام الخرساء، كيفما اتفق أن تُقادوا[b].
  to: أنتم تعلمون أنه حين كنتم أمميين[a]، كنتم تُساقون إلى الأصنام التي لا تنطق، على أي نحو كنتم تُقادون[b].
  rationale: تستبدل المراجعة عبارة «كيفما اتفق» بعبارة «على أي نحو» لتفادي إضافة معنى المصادفة، وتستخدم «أمميين» بوصفه المقابل العربي الاصطلاحي الأدق في السياق البولسي مع توضيحه في الحاشية. كما تصوغ وصف الأصنام بصيغة طبيعية صريحة تحافظ على معنى عدم القدرة على الكلام، وتبقي التوازي بين الانقياد والسَّوق في الأصل.
