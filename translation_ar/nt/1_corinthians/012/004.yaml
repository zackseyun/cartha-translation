  footnotes:
  - marker: a
    text: أو «توزيعات المواهب» أو «اختلافات في المواهب». تشدد اليونانية على التنوع بين المواهب، لا على الانقسام في الكنيسة.
    reason: بديل معجمي
lexical_decisions:
- source_word: Διαιρέσεις
  choice: أنواع
  rationale: تفيد الكلمة وجود تنوّع وفروق داخل مجموع واحد؛ و«أنواع» تعبّر عن هذا التنوع المشروع من غير أن توحي بانقسامات كنسية.
- source_word: δὲ
  choice: و... لكن
  rationale: الأولى انتقالية خفيفة صيغت بالواو في العربية، والثانية للمقابلة بين تنوع المواهب ووحدة الروح، فصيغت بـ«لكن».
- source_word: χαρισμάτων
  choice: المواهب
  rationale: تشير في السياق إلى عطايا النعمة أو القدرات التي يمنحها الروح؛ و«المواهب» هي العبارة العربية الطبيعية الواضحة.
- source_word: τὸ ... αὐτὸ
  choice: واحد
  rationale: المقصود تأكيد وحدة هوية الروح في مقابل تنوع المواهب. و«الروح واحد» صياغة عربية طبيعية تحفظ هذا التأكيد.
- source_word: πνεῦμα
  choice: الروح
  rationale: يشير السياق القريب إلى الروح القدس بوصفه مصدر المواهب، لذلك استُعمل «الروح» معرفًا.
theological_decisions:
- issue: مرجع πνεῦμα
  choice: الروح القدس
  alternative: روح الإنسان أو قوة روحية
  rationale: يحدد سياق 1 كورنثوس 12:3-11 الروح بوصفه الفاعل الإلهي الذي يمنح المواهب ويوزعها، من غير حاجة إلى إضافة «القدس» في نص هذه الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. حُفظت المقابلة بين تنوع المواهب ووحدة الروح، مع تجنب لفظ «انقسامات» في المتن لما قد يحمله من إيحاء سلبي غير مقصود هنا.
