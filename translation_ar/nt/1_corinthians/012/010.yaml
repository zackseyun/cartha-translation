  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: ar
  text: ولآخر أعمالُ قوى[a]، ولآخر نبوّةٌ، ولآخر تمييزاتُ الأرواح، ولآخر أنواعُ الألسنة[b]، ولآخر تفسيرُ الألسنة.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أعمالٌ معجزية»، أو «أعمالُ قدرة عظيمة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أنواعُ اللغات» و«تفسيرُ اللغات». يمكن أن تعني الكلمة اليونانية «الألسنة» أو «اللغات»؛ وأُبقيت «الألسنة» هنا للمحافظة على الغموض في حديث بولس عن المواهب الروحية.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα
  choice: أعمال
  rationale: تفيد النتائج أو الأعمال التي تُحدثها قدرة فاعلة، وتحافظ على صيغة الجمع وعلى ارتباطها بالمضاف إليه «قوات».
- source_word: δυνάμεων
  choice: قوات
  rationale: هذه المقابلة الأقرب إلى اللفظ اليوناني، وتُبقي مفتوحًا احتمال الإشارة في السياق إلى المعجزات أو الأعمال المقتدرة، مع بيان ذلك في الحاشية.
- source_word: προφητεία
  choice: نبوّة
  rationale: المقابل العربي المعياري الموجز للموهبة المذكورة، من غير تضييق مدلولها إلى نوع بعينه من الأقوال.
- source_word: διακρίσεις
  choice: تمييزات
  rationale: تحافظ على الجمع اليوناني، الذي قد يدل على أفعال تمييز متعددة أو ضروب منه، بدل تحويله إلى اسم مفرد مجرد.
- source_word: πνευμάτων
  choice: الأرواح
  rationale: يحفظ عموم اللفظ ولا يحدد هل المقصود أرواحًا بشرية أو شريرة أو مصادر روحية وراء الأقوال.
- source_word: γένη
  choice: أنواع
  rationale: مقابل عربي طبيعي يدل على الأصناف أو الضروب ويتلاءم مع جمع «الألسنة».
- source_word: γλωσσῶν
  choice: الألسنة
  rationale: يحافظ على إمكان دلالة اللفظ على الألسنة أو اللغات، ولا يحسم طبيعة الظاهرة الروحية محل النقاش.
- source_word: ἑρμηνεία
  choice: تفسير
  rationale: يدل طبيعيًا على جعل مضمون الألسنة مفهومًا، من غير حصره في الترجمة بين لغات بشرية معروفة.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: ولآخر
  rationale: يعكس صيغة التوزيع في الداتيف بين أشخاص مختلفين، ولا يبالغ في إبراز التحول اللفظي من ἄλλῳ إلى ἑτέρῳ.
theological_decisions:
- issue: مدلول δυνάμεων في قائمة المواهب
  choice: قوات
  alternative: معجزات؛ أعمال مقتدرة
  rationale: اختير المقابل الأقرب إلى اللفظ للمحافظة على تركيب «أعمال قوات»، بينما توضح الحاشية أن السياق قد يشير إلى أعمال إعجازية. وبذلك لا يُحسم المدلول أكثر مما يقتضيه الأصل.
- issue: مدلول γλωσσῶν
  choice: الألسنة
  alternative: اللغات
  rationale: «الألسنة» تحفظ الغموض المعجمي واللاهوتي بشأن كون الظاهرة لغات بشرية معروفة أو كلامًا من نوع آخر، وتُذكر «اللغات» في الحاشية.
- issue: مرجع πνευμάτων في عبارة «تمييزات الأرواح»
  choice: الإبقاء على «الأرواح» بمدلول واسع
  alternative: الأقوال الروحية؛ الأرواح الكامنة وراء الأقوال؛ الأرواح البشرية؛ الأرواح الشريرة
  rationale: الأصل لا يحدد المرجع، لذلك لا تضيف الترجمة تفسيرًا مذهبيًا أو تحديدًا غير مصرح به.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. حوفظ على إيقاع القائمة بتكرار «ولآخر»، وعلى صيغ الجمع في «أعمال» و«تمييزات» و«أنواع». استُعملت «الألسنة» بدل «اللغات» لصون الغموض المقصود، مع شرح البديل في الحاشية.
