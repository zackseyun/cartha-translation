  source_fidelity: ينقل النص المقابلة بين ما نعدّه أقل كرامة وبين الكرامة الأوفر التي نمنحها له، ويحافظ على وصف الأعضاء التي لا يليق إظهارها وعلى المقارنة في «لياقة أوفر». غير أن «نحيطها بكرامة» ليست أمتن تعبيرًا عربيًا عن منح الكرامة أو إسباغها، مع أن الصورة اليونانية تتضمن الوضع على العضو.
  naturalness: «نُسبغ عليها كرامةً أوفر» أفصح وأشيع في العربية المعاصرة من «نحيطها بكرامة». و«تكون لأعضائنا ... لياقةٌ أوفر» أكثر سلاسة من إسناد «تحظى بلياقة» إلى الأعضاء، مع إبقاء معنى ἔχει، أي الامتلاك/الكون، لا معنى الإكساب الصريح.
  terminology: «كرامة» و«لياقة» مناسبتان لتقابل τιμή وεὐσχημοσύνη. وعبارة «التي لا يليق إظهارها» تحافظ على الدلالة الاجتماعية المتعلقة بعدم الملاءمة للعرض، من دون إضافة حكم أخلاقي.
