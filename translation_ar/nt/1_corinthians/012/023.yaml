  - marker: b
    text: 'أو: «مظهر أكثر لياقة» أو «حُسن هيئة أوفر».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: التي نظنّ أنها
  rationale: ينقل العبارة بوصفها تقديرًا بشريًا لا وصفًا موضوعيًا ثابتًا، ويحافظ على صيغة المتكلم الجمع.
- source_word: ἀτιμότερα
  choice: أقل كرامة
  rationale: يحفظ صيغة المقارنة ويقيم التقابل اللفظي مع «كرامة أوفر» من غير تشديد المعنى إلى «أشد عارًا».
- source_word: τοῦ σώματος
  choice: أعضاء الجسد
  rationale: أُظهر معنى الأجزاء الذي يدل عليه الموصول في السياق، مع إبقاء صورة الجسد المركزية في الحجة.
- source_word: τιμὴν περισσοτέραν περιτίθεμεν
  choice: نُحيطها بكرامة أوفر
  rationale: «نحيطها» يحفظ الصورة المكانية في الفعل، الذي يعني الوضع حول الشيء أو عليه، بينما «كرامة أوفر» تنقل المقارنة بوضوح.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: أعضاؤنا التي لا يليق إظهارها
  rationale: يعبّر عن الأعضاء التي لا تُعدّ ملائمة للعرض العلني في العرف الاجتماعي، من غير تحميل اللفظ حكمًا أخلاقيًا زائدًا.
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: تحظى بلياقة أوفر
  rationale: ينقل معنى حسن الهيئة والملاءمة في الظهور، بصياغة عربية طبيعية نسبيًا، ويحفظ المقارنة من دون إضافة فعل الستر أو الإلباس إلى النص.
theological_decisions:
- issue: صورة أعضاء الجسد والكرامة الاجتماعية
  choice: الإبقاء على الكلام الملموس عن أعضاء الجسد ومعاملتها بالكرامة واللياقة
  alternative: تحويل العبارة مباشرة إلى كلام عن أعضاء الكنيسة الأضعف اجتماعيًا
  rationale: يعتمد استدلال بولس على صورة الجسد الفعلي قبل تطبيقها على الجماعة؛ لذلك ينبغي أن ينشأ التطبيق اللاهوتي من السياق لا أن يُدمج في ترجمة الآية.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُعملت «أوفر» للموازاة بين الكرامة واللياقة، وأُبقيت صورة الجسد محسوسة من غير ابتذال أو تلطيف يزيل دلالتها.
