  - severity: low
    issue: «تحظى بلياقة أوفر» أقل سلاسة عند إسناده إلى أعضاء الجسد.
    rationale: الصياغة الاسمية «تكون لأعضائنا ... لياقة أوفر» تعكس فعل «لها/تملك» في اليونانية وتبدو أرسخ في الفصحى.
