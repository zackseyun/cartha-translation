  text: وأعضاء الجسد التي نظنّ أنها أقل كرامة[a] نُسبغ عليها كرامةً أوفر، ولأعضائنا التي لا يليق إظهارها لياقةٌ أوفر[b].
  philosophy: optimal-equivalence
  footnotes:
