lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: أمّا أنتم
  rationale: الضمير مصرح به للتوكيد، وδέ تنقل الكلام من تشبيه الجسد السابق إلى تطبيقه على المخاطَبين؛ وصيغة «أمّا أنتم» تؤدي الانتقال والتوكيد معًا من غير إضافة معنى زمني.
- source_word: σῶμα Χριστοῦ
  choice: جسدُ المسيح
  rationale: يحافظ هذا التعبير على استعارة الجسد وعلى الإضافة اليونانية. و«المسيح» في العربية يؤدي لقب Χριστός بصورة طبيعية ومألوفة.
- source_word: μέλη
  choice: عضوٌ
  rationale: جاء المفرد في الصياغة العربية تبعًا لعبارة «كل واحد»، لكنه يؤدي جمع μέλη توزيعًا، ويحفظ صورة أعضاء الجسد.
- source_word: ἐκ μέρους
  choice: كلُّ واحدٍ منكم ... فيه
  rationale: 'يفيد السياق معنى توزيعيًا: المخاطَبون معًا جسد المسيح، وكل واحد منهم عضو ضمن هذا الجسد. هذه الصياغة أوضح في العربية المعاصرة من النقل الحرفي الملتبس «من جزء».'
theological_decisions:
- issue: دلالة Χριστοῦ في وصف الكنيسة بأنها جسد
  choice: المسيح
  alternative: المسيّا
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب Χριστός، ويحفظ مضمونه المسياني من غير تحويله إلى مجرد اسم علم أو إدخال تمييز مذهبي.
- issue: دلالة ἐκ μέρους
  choice: 'المعنى التوزيعي: كل واحد عضو في الجسد'
  alternative: وأعضاءٌ من جهة الجزء / وأعضاءٌ على حدة
  rationale: سياق الجسد الواحد والأعضاء الكثيرة يرجح التوزيع على الأفراد. أُبقيت الصلة بالجسد بضمير «فيه»، مع توثيق الصياغة الأقرب إلى الحرفية في الحاشية لأن العبارة اليونانية موجزة ويمكن نقلها بطرائق مختلفة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدمت «أمّا أنتم» لإبراز الضمير والانتقال الخطابي، وتُركت استعارة الجسد والأعضاء ظاهرة. أُضيف «منكم» و«فيه» لإظهار المعنى التوزيعي الذي تفيده العبارة اليونانية الموجزة، لا لإضافة دعوى لاهوتية جديدة.
