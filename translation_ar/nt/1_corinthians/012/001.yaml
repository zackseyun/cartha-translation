source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/001.yaml
  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: ar
  text: وأما المواهب الروحية[a]، أيها الإخوة[b]، فلا أريد أن تجهلوا أمرها.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأمور الروحية». اللفظ اليوناني أوسع من «المواهب»، مع أن سياق هذا الأصحاح يركّز على المواهب التي يمنحها الروح.'
    reason: alternative_reading
  - marker: b
    text: «الإخوة» هي صيغة بولس في مخاطبة الجماعة، ويُرجَّح أنها تشمل النساء أيضًا.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: وأما
  rationale: تفيد الانتقال إلى موضوع جديد مع معنى «أما بخصوص»، وهي صياغة عربية طبيعية لا تضيف معنى زمنيًا غير موجود في الأصل.
- source_word: τῶν πνευματικῶν
  choice: المواهب الروحية[a]
  rationale: الصفة اليونانية مستعملة استعمال الاسم، وهي أوسع لفظًا من «المواهب» وقد تعني «الأمور الروحية». لكن سياق الأصحاحات 12–14، ولا سيما 12:4–11، يجعل المواهب التي يمنحها الروح هي المرجع الأرجح؛ لذلك أُثبت الغموض في الحاشية.
- source_word: ἀδελφοί
  choice: أيها الإخوة[b]
  rationale: يحافظ على صيغة النداء المذكرة في الأصل، مع بيان أن الاستعمال الرسولي يخاطب به جماعة المؤمنين ومن المرجح أنه يشمل النساء أيضًا.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: فلا أريد أن تجهلوا أمرها
  rationale: ينقل التعبير اليوناني بوضوح وطبيعية؛ وأضيف الضمير «أمرها» لإتمام الأسلوب العربي مع عوده إلى الموضوع المذكور.
theological_decisions:
- issue: تفسير τῶν πνευματικῶν
  choice: المواهب الروحية
  alternative: الأمور الروحية؛ أو، على احتمال أضعف في هذا السياق، الأشخاص الروحيون
  rationale: اللفظ اليوناني مقتضب وملتبس نحويًا، لكن ما يلي يركّز على عطايا الروح وتجلّياته. اختير المرجع الأرجح في المتن مع عدم طمس سعة اللفظ الأصلية في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «وأما» للانتقال الموضوعي، وحُفظت صيغة «الإخوة» في المتن مع توضيح شمول الخطاب في الحاشية.
