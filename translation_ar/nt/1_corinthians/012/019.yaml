  yaml_path: translation/nt/1_corinthians/012/019.yaml
  text: If all were one member, where would the body be?
translation:
  language: ar
  text: فَلَوْ كَانَتِ الأَعْضَاءُ كُلُّهَا عُضْوًا وَاحِدًا، فَأَيْنَ يَكُونُ الْجَسَدُ؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: فَلَوْ
  rationale: تنقل «لو» الشرط الافتراضي، وتؤدي الفاء وظيفة الربط الخفيف والاستمرار الحِجاجي الذي تؤديه δέ في السياق.
- source_word: ἦν
  choice: كَانَتْ
  rationale: صيغة الماضي من فعل الكينونة تقع في جملة شرطية افتراضية، وتلائمها «لو كانت» في العربية الفصيحة.
- source_word: τὰ πάντα
  choice: الأَعْضَاءُ كُلُّهَا
  rationale: المقصود في سياق استعارة الجسد هو مجموع الأعضاء لا «كل الأشياء» على نحو مجرد. أُظهر المرجع بالعربية لتستقيم العبارة ويتضح معنى الجمع المحايد اليوناني.
- source_word: ἓν μέλος
  choice: عُضْوًا وَاحِدًا
  rationale: «عضو» يحافظ على استعارة أجزاء الجسد وعلى الصلة الاصطلاحية بسياق المقطع، و«واحدًا» ينقل العدد والتوكيد.
- source_word: ποῦ τὸ σῶμα
  choice: فَأَيْنَ يَكُونُ الْجَسَدُ؟
  rationale: يحافظ الاستفهام على قوته البلاغية داخل الفرضية، ويعبّر المضارع «يكون» طبيعيًا عن النتيجة المفترضة.
theological_decisions:
- issue: مدى التصريح بمرجع استعارة الجسد
  choice: الإبقاء على «الجسد» من غير إضافة «المسيح» أو «الكنيسة».
  alternative: ترجمة تفسيرية مثل «جسد المسيح» أو «الكنيسة».
  rationale: النص اليوناني في هذه الآية يقول «الجسد» فقط. أما تحديد المرجع الكنسي والمسياني فيظهر من السياق الأوسع، فلا ينبغي إدخاله هنا في صلب الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُعملت «الأعضاء كلها» بدل الترجمة الحرفية الملتبسة «الكل» لأن مرجع τὰ πάντα هو أعضاء الجسد في السياق، مع الحفاظ على السؤال البلاغي وإيجازه.
