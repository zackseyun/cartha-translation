source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: ar
  text: وقد عيَّن الله في الكنيسة أولًا رسلًا، وثانيًا أنبياء، وثالثًا معلّمين، ثم معجزات[a]، ثم مواهب شفاء، وأوجه مساعدة، وأوجه تدبير[b]، وأنواع ألسنة[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أعمال قوة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «أوجه إرشاد» أو «صور قيادة».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «أنواع لغات». يمكن للكلمة اليونانية أن تعني «ألسنة» أو «لغات»، وقد أبقى المتن صياغة بولس محتملة الدلالة في هذا السياق.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: عيَّن
  rationale: يفيد الفعل هنا أن الله خصّص أو أقام في الكنيسة أشخاصًا ووظائف وعطايا؛ و«عيَّن» ينقل معنى الترتيب الإلهي بوضوح، مع بقاء التعداد اللاحق كما في اليونانية.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: في الكنيسة
  rationale: «الكنيسة» هي المقابل العربي الجاري الواضح لجماعة المؤمنين في الاستعمال البولسي، وتناسب سياق الجسد الواحد وتوزيع الأدوار والعطايا.
- source_word: πρῶτον ... δεύτερον ... τρίτον
  choice: أولًا ... وثانيًا ... وثالثًا
  rationale: يحافظ هذا على ترتيب النص من غير أن يحدد هل المقصود رتبة في السلطة أم ترتيب زمني أم أولوية وظيفية.
- source_word: ἀποστόλους
  choice: رسلًا
  rationale: ينقل الدور الرسولي المعروف في الكنيسة، لا مجرد معنى المبعوثين بوجه عام.
- source_word: προφήτας
  choice: أنبياء
  rationale: مقابل عربي مباشر وواضح لمن يؤدون دور النبوة في الجماعة.
- source_word: διδασκάλους
  choice: معلّمين
  rationale: ينقل بوضوح وظيفة التعليم في الكنيسة.
- source_word: δυνάμεις
  choice: معجزات
  rationale: اللفظ يعني حرفيًا «قوات»، لكنه في هذا السياق يدل على أفعال خارقة تظهر القوة؛ و«معجزات» أوضح للقارئ المعاصر، مع إثبات البديل الأقرب إلى اللفظ في الحاشية.
- source_word: χαρίσματα ἰαμάτων
  choice: مواهب شفاء
  rationale: تعبير عربي طبيعي يحفظ اقتران المواهب بالشفاء. أما ترجمة جمع ἰαμάτων حرفيًا إلى «شفاءات» فتبدو متكلفة في العربية.
- source_word: ἀντιλήμψεις
  choice: أوجه مساعدة
  rationale: يدل الجمع على صور أو قدرات متنوعة من العون والمساندة؛ وهذه الصياغة أوضح من الاسم المجرد «مساعدات» في سياق تعداد الوظائف والعطايا.
- source_word: κυβερνήσεις
  choice: أوجه تدبير
  rationale: يحمل اللفظ صورة التوجيه والقيادة، و«أوجه تدبير» يشمل التنظيم والإرشاد من غير افتراض منصب هرمي محدد.
- source_word: γένη γλωσσῶν
  choice: أنواع ألسنة
  rationale: يحفظ التعبير البولسي واحتمال دلالة γλῶσσαι على الألسنة أو اللغات، من غير حسم طبيعة الظاهرة في المتن.
theological_decisions:
- issue: دلالة ترتيب «أولًا ... وثانيًا ... وثالثًا ... ثم»
  choice: إبقاء الترتيب كما ورد من غير تفسير إضافي
  alternative: اعتباره ترتيبًا دائمًا للسلطة، أو تسلسلًا زمنيًا، أو ترتيبًا بحسب الأهمية الوظيفية
  rationale: النص يقدّم ترتيبًا صريحًا، لكنه لا يشرح نوع هذا الترتيب؛ لذلك لا تضيف الترجمة وصفًا يحسم المسألة.
- issue: معنى γλῶσσαι في هذا السياق
  choice: «ألسنة» في المتن
  alternative: «لغات»
  rationale: «ألسنة» تحافظ على صياغة بولس وعلى الغموض الحقيقي بشأن طبيعة هذه الظاهرة، بينما تذكر الحاشية احتمال «لغات».
- issue: انتقال التعداد من أشخاص إلى أعمال وعطايا
  choice: الحفاظ على بنية التعداد من غير إضافة فئات تفسيرية
  alternative: تقسيم القائمة صراحة إلى مناصب ومواهب أو تكرار أفعال مختلفة لكل فئة
  rationale: اليونانية تبدأ بأشخاص ثم تنتقل إلى أعمال وعطايا في تركيب موجز؛ وإضافة تصنيف صريح قد تفرض تفسيرًا لا يقوله النص.
translation_notes:
  register: عربية فصحى معاصرة واضحة ورصينة. استُخدمت ألفاظ مألوفة كنسيًا من غير إفراط في الاصطلاح، وحُفظ إيقاع التعداد وترتيبه. وُضعت علامات الحواشي عند الألفاظ التي تشرحها مباشرة.
