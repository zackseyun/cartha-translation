source:
  edition: SBLGNT
  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: ar
  text: أَلِلْجَمِيعِ مواهبُ شِفاءاتٍ؟ أَيَتَكَلَّمُ الجميعُ بألسنةٍ؟ أَيُتَرْجِمُ الجميعُ؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πάντες
  choice: أَلِلْجَمِيعِ...؟ / أَيَفْعَلُ الجميعُ...؟
  rationale: صيغت الأسئلة استفهامًا إنكاريًا يتوقع جوابًا بالنفي، وهو ما تؤديه همزة الاستفهام طبيعيًا في العربية مع تتابع السياق.
- source_word: χαρίσματα
  choice: مواهب
  rationale: يدل اللفظ على عطايا مصدرها النعمة؛ و«مواهب» تعبير عربي طبيعي ودقيق في هذا السياق.
- source_word: ἰαμάτων
  choice: شِفاءات
  rationale: حُفظت صيغة الجمع في اليونانية، من غير تحويلها إلى معنى مجرد مفرد.
- source_word: γλώσσαις
  choice: بألسنة
  rationale: يحفظ التعبير الاصطلاح البولسي في سياق المواهب، ولا يحسم ما إذا كان المقصود لغات بشرية معروفة أو ظاهرة كلامية أخرى.
- source_word: λαλοῦσιν
  choice: يتكلَّم
  rationale: المضارع هنا يصف ممارسة عامة، فالمضارع العربي مناسب.
- source_word: διερμηνεύουσιν
  choice: يُترجِم
  rationale: في سياق الألسنة يدل الفعل على نقل الكلام إلى صيغة مفهومة للسامعين؛ و«يترجم» أوضح عربيًا من «يفسّر» مع بقاء الصلة بالكلام السابق.
theological_decisions:
- issue: دلالة الأسئلة الداخلة عليها μή
  choice: أسئلة إنكارية تتوقع جوابًا بالنفي
  alternative: أسئلة محايدة لا تُظهر الجواب المتوقع
  rationale: التركيب اليوناني يؤكد أن المواهب ليست كلها لدى كل فرد، بما يحفظ تشديد بولس على تنوع الأعضاء والمواهب.
- issue: طبيعة «الألسنة»
  choice: الإبقاء على «ألسنة» دون تحديد ماهيتها
  alternative: ترجمتها «لغات» وحصرها في اللغات البشرية
  rationale: السياق يشير إلى الموهبة المعروفة بالألسنة، لكن اللفظ وحده لا يقتضي حسم طبيعتها على نحو أضيق.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت أسئلة متوازية مقتضبة لمحاكاة الإيقاع البلاغي للنص اليوناني، مع الحفاظ على الجموع الثلاثة وعلى الجواب السلبي المتوقع.
