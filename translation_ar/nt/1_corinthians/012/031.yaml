  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: ar
  text: لكن تطلَّعوا بحماسة إلى المواهب الأعظم.[a] وفوق ذلك، أريكم طريقًا أسمى بما لا يُقاس.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لكنكم تتطلَّعون بحماسة إلى المواهب الأعظم». يمكن أن تُقرأ صيغة الفعل اليوناني هنا أمرًا أو خبرًا.'
    reason: alternative_reading
  - marker: b
    text: 'تُترجم تقليديًا: «طريقًا أفضل».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: تطلَّعوا بحماسة إلى
  rationale: ينقل شدة الرغبة التي يفيدها الفعل، بصياغة عربية واضحة لا توحي بالغيرة أو الحسد. صيغته هنا محتملة للأمر والخبر، واعتمد المتن قراءة الأمر مع إثبات الأخرى في الحاشية.
- source_word: χαρίσματα
  choice: المواهب
  rationale: «المواهب» هي العبارة العربية الطبيعية في سياق الأصحاح، وتحافظ على الإيجاز من غير إضافة «الروحية»، وهي غير مذكورة في هذه الجملة.
- source_word: μείζονα
  choice: الأعظم
  rationale: تحافظ على صيغة المقارنة وعلى احتمال أن يكون المراد الأعظم قدرًا أو أهمية، من غير تفسير زائد.
- source_word: καὶ ἔτι
  choice: وفوق ذلك
  rationale: تربط بما سبق وتفيد الانتقال إلى أمر يتجاوزه، في عبارة عربية طبيعية.
- source_word: καθ’ ὑπερβολὴν
  choice: أسمى بما لا يُقاس
  rationale: تعكس معنى التجاوز والتفوق البالغ، وتتجنب تركيبًا عربيًا حرفيًا غير سلس.
- source_word: ὁδὸν
  choice: طريقًا
  rationale: تحافظ على استعارة الطريق بوصفه نهجًا أو مسلكًا، وهي تمهّد طبيعيًا للكلام عن المحبة.
- source_word: δείκνυμι
  choice: أريكم
  rationale: يحافظ على زمن المضارع اليوناني، وهو في العربية صالح أيضًا لما يشرع المتكلم في بيانه مباشرة.
theological_decisions:
- issue: 'دلالة ζηλοῦτε: أمر أم خبر'
  choice: 'الأمر: «تطلَّعوا بحماسة»'
  alternative: 'الخبر: «وأنتم تتطلَّعون بحماسة»'
  rationale: الصيغة اليونانية تحتمل الأمر والخبر في هذا السياق. ينسجم الأمر مع الطابع الإرشادي للسياق، لكن الاحتمال الخبري حقيقي، ولذلك أُثبت في الحاشية صونًا للغموض النصي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. تجنبت الصياغات التي قد توحي بالحسد، وحافظت على استعارة «الطريق» وعلى احتمال صيغة الفعل، مع وضع علامتي الحاشيتين في موضعيهما في المتن.
