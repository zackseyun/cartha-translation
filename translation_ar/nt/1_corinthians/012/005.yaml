  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: ar
  text: وهناك تنوّعات في الخدمات[a]، ولكن الرب هو نفسه.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «أوجه الخدمة».
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: تنوَّعت
  rationale: ينقل اختلاف الأنواع وتعدّدها في سياق الوحدة، من غير أن يوحي بالانشقاق أو التحزّب. وصيغة الفعل طبيعية في العربية مع بقاء موازاة الآيات 4–6 واضحة.
- source_word: διακονιῶν
  choice: الخدمات
  rationale: يدل اللفظ على أعمال الخدمة أو وجوهها في الجماعة. «الخدمات» واضحة وواسعة، ولا تحصر المعنى في منصب كنسي محدد؛ وتُذكر «أوجه الخدمة» في الحاشية بديلًا ممكنًا.
- source_word: ὁ αὐτὸς
  choice: واحد
  rationale: في العربية، «الرب واحد» تعبير طبيعي يؤكد وحدة الرب في مقابل تنوّع الخدمات. ومع أنه ليس مقابلة حرفية لكلمة «نفسه»، فإنه يؤدي وظيفة العبارة اليونانية في هذا السياق المتوازي.
- source_word: κύριος
  choice: الربّ
  rationale: يحفظ اللقب اللاهوتي من غير توسيع المرجع داخل النص. وفي السياق يُرجَّح أنه يشير إلى الرب يسوع ضمن تتابع الروح والرب والله في الآيات 4–6.
- source_word: καὶ
  choice: و
  rationale: تحفظ أداة العطف البسيطة التي تصل الجملة بما قبلها وتربط شطري الآية.
- source_word: εἰσιν
  choice: تنوَّعت
  rationale: دُمج معنى فعل الوجود في صياغة عربية فعلية طبيعية تفيد وجود أنواع مختلفة من الخدمات.
theological_decisions:
- issue: مرجع لقب «الرب» في الصياغة الثلاثية في 1 كورنثوس 12:4–6
  choice: الإبقاء على «الرب» لقبًا من غير إضافة «يسوع» في المتن؛ والسياق يرجّح أن المقصود هو الرب يسوع.
  alternative: فهم اللقب على أنه إشارة أعمّ إلى الرب/الله.
  rationale: يذكر السياق «الروح نفسه» ثم «الرب» ثم «الله». تحافظ الترجمة على لفظ بولس وعلى قدر من عدم التصريح بالمرجع، فلا تحسم في المتن ما لم يصرّح به النص.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. اختير تركيب موجز يحافظ على مقابلة التنوّع بالوحدة في الآيات 4–6. أُثبتت علامة الحاشية [a] بعد اللفظ المعني.
