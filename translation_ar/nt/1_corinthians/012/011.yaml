  - marker: b
    text: 'أو: «مقسِّمًا لكل واحد نصيبه».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «كما يختار»؛ فالفعل اليوناني قد يدل على المشيئة أو الاختيار أو الرغبة.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: لكن هذه كلها
  rationale: تفيد العبارة شمول جميع المواهب أو المظاهر المذكورة قبلًا، وتربط δέ القائمة السابقة بمصدرها الواحد بانتقال خفيف فيه مقابلة.
- source_word: ἐνεργεῖ
  choice: يُجريها
  rationale: ينقل معنى الفعل المؤثر الذي يُحدث هذه الأمور ويعملها، بصياغة عربية طبيعية من غير تحديد زائد لكيفية العمل.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: الروح الواحد نفسه
  rationale: 'يحفظ التشديد اليوناني على وحدة الهوية: تنوع المواهب صادر عن الروح عينه.'
- source_word: διαιροῦν
  choice: موزِّعًا
  rationale: اسم الفاعل يبين كيفية عمل الروح، ومعنى التوزيع أنسب لسياق منح المواهب من الترجمة الحرفية «مقسِّمًا».
- source_word: ἰδίᾳ ἑκάστῳ
  choice: على كل واحد بمفرده
  rationale: 'يحفظ المعنى التوزيعي الفردي: ينال كل شخص نصيبه على نحو خاص.'
- source_word: καθὼς βούλεται
  choice: كما يشاء
  rationale: ينقل الإرادة والاختيار المقصودين بصياغة عربية مألوفة، مع بقاء فاعل الفعل، الروح، ظاهرًا من السياق.
theological_decisions:
- issue: مرجع πνεῦμα والفاعلية الشخصية في βούλεται
  choice: «الروح» هو الروح القدس، وتُنسب إليه المشيئة مباشرة في «كما يشاء» من غير ضمير منفصل.
  alternative: «كما يختار» أو صياغة مبنية للمجهول تحجب الفاعل.
  rationale: السياق البولسي ينسب إلى الروح فعلًا وإرادة في توزيع المواهب. ولا تحتاج العربية إلى ضمير يترجم الجنس النحوي اليوناني، فتثبت الوكالة الشخصية من غير إدخال تمييز جنسي لا يقتضيه النص العربي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «الروح الواحد نفسه» لإبراز وحدة المصدر، و«يُجريها» لتجنب غرابة «يعمل كل هذه الأشياء». وُضعت علامات الحواشي بعد الجملة مع مطابقة كل علامة لحاشيتها.
