base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: ar
  text: 'إن قالت القدم[a]: «لأنني لستُ يدًا، فلستُ من الجسد»، أفلا تظل، مع ذلك، من الجسد؟'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'وبصياغة أكثر سلاسة: «لأنني لستُ يدًا، فأنا لا أنتمي إلى الجسد». والمعنى في السؤال: «أفلا تظل، مع ذلك، منتميةً إلى الجسد؟»'
    reason: بديل تعبيري يوضح الدلالة الاصطلاحية لعبارة «من الجسد» والقوة الإنكارية للسؤال.
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: إن قالت
  rationale: تنقل أداة الشرط مع صيغة الاحتمال في اليونانية بوصفها حالة افتراضية عامة، بصياغة عربية طبيعية.
- source_word: ὁ πούς
  choice: القدم
  rationale: تحافظ على صورة عضو الجسد التي يقوم عليها تشبيه بولس؛ وجاء الفعل مؤنثًا بحسب جنس «القدم» في العربية.
- source_word: Ὅτι
  choice: لأنني
  rationale: تفيد هنا تعليل القدم لقولها، لا مجرد إدخال مضمون الكلام.
- source_word: χείρ
  choice: يدًا
  rationale: تحافظ على المقابلة الحسية المباشرة بين القدم واليد.
- source_word: ἐκ τοῦ σώματος
  choice: من الجسد
  rationale: تحافظ على حرف الجر وعلى تكرار العبارة اليونانية، مع بقاء المعنى مفهومًا في العربية.
- source_word: οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: فهل يعني هذا أنها ليست من الجسد؟
  rationale: تنقل السؤال الإنكاري ورفض النتيجة المزعومة بوضوح عربي، من غير تحويله إلى تقرير صريح أو حذف نفي العبارة الأساسية.
theological_decisions:
- issue: مقدار تلطيف التكرار والنفي في حجة أعضاء الجسد
  choice: الإبقاء على عبارة «من الجسد» في الموضعين وعلى السؤال الإنكاري، مع صياغة عربية واضحة للنفي المركب.
  alternative: «فهذا لا يجعلها أقل انتماءً إلى الجسد» أو «فهل يعني هذا أنها ليست جزءًا من الجسد؟»
  rationale: يحافظ الاختيار على ألفاظ الاستعارة وتكرار المصدر، وعلى القوة البلاغية للسؤال، من غير أن يفرض تفسيرًا كنسيًا أو مذهبيًا على صورة الجسد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وموقرة. استُخدمت «الجسد» للمحافظة على وحدة استعارة أعضاء الجسد، وحوفظ على الحوار الافتراضي والسؤال الإنكاري دون محاكاة ثقيلة لازدواج النفي اليوناني.
