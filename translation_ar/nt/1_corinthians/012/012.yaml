source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: ar
  text: فكما أن الجسد واحد وله أعضاء كثيرة، وأعضاء الجسد كلها، مع أنها كثيرة، هي جسد واحد، فكذلك أيضًا المسيح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «فكذلك أيضًا المسيح». أبقينا هذه العبارة المكثفة كما هي؛ وتوضح الآيات التالية كيف يكون الأعضاء الكثيرون جسدًا واحدًا.'
    reason: إيضاح الصياغة المكثفة من غير توسيع المتن تفسيريًا
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: فكما أن
  rationale: تنقل «كما» قوة التشبيه في καθάπερ، وتؤدي الفاء وظيفة γάρ في وصل الآية تعليليًا بما قبلها، بصياغة عربية طبيعية.
- source_word: σῶμα
  choice: الجسد
  rationale: المقابل العربي المباشر الملائم لاستعارة الجسد، ويحافظ على اتساق الصورة في الآية.
- source_word: ἕν
  choice: واحد
  rationale: يحفظ معنى الوحدة العددية والجماعية المقصودة في الحجة.
- source_word: μέλη
  choice: أعضاء
  rationale: «أعضاء» هو التعبير العربي الطبيعي لأجزاء الجسد، ويلائم التطبيق الجماعي في السياق التالي.
- source_word: πάντα δὲ τὰ μέλη τοῦ σώματος
  choice: وأعضاء الجسد كلها
  rationale: تفيد الواو هنا الانتقال المتصل الذي تؤديه δέ من غير مبالغة في معنى الاستدراك، و«كلها» تحافظ على شمول πάντα.
- source_word: πολλὰ ὄντα
  choice: مع أنها كثيرة
  rationale: تُظهر الدلالة الحالية ذات القوة التنازلية في العبارة اليونانية بصياغة عربية واضحة.
- source_word: ἕν ἐστιν σῶμα
  choice: هي جسد واحد
  rationale: يحافظ الضمير «هي» على إسناد الأعضاء الكثيرة إلى جسد واحد، مع سلامة التركيب العربي.
- source_word: οὕτως καὶ
  choice: فكذلك أيضًا
  rationale: ينقل خاتمة المقارنة بإيجاز، مع إبقاء دلالة «أيضًا» الصريحة في καί.
- source_word: ὁ Χριστός
  choice: المسيح
  rationale: «المسيح» المقابل العربي الراسخ للقب Χριστός، ويحفظ أداة التعريف ودلالة اللقب من غير تحويل العبارة إلى تفسير موسع.
theological_decisions:
- issue: تفسير عبارة «كذلك أيضًا المسيح»
  choice: الإبقاء على العبارة المكثفة «فكذلك أيضًا المسيح»
  alternative: فكذلك أيضًا جسد المسيح / فكذلك أيضًا الكنيسة
  rationale: النص اليوناني يقول ὁ Χριστός ولا يذكر صراحة «جسد المسيح» أو «الكنيسة». والإبقاء على صيغته يحفظ التكثيف والتوتر اللاهوتي اللذين يشرحهما السياق اللاحق بدل إدخال التفسير في المتن.
- issue: نقل Χριστός
  choice: المسيح
  alternative: كريستوس / المسيح بصفته اسمًا مجردًا
  rationale: اللفظ اليوناني معرف ويحتفظ هنا بقوة اللقب؛ و«المسيح» ينقل معناه واستعماله العربي المألوف معًا.
translation_notes:
  register: عربية فصحى حديثة، واضحة ووقورة. استُخدمت «أعضاء» بدل ألفاظ تقنية أو قديمة، وحُفظ تكرار «الجسد» و«واحد» لأنه محوري في بناء المقارنة اليونانية.
