  language: ar
  text: بل على العكس، فإن أعضاء الجسد التي تبدو أضعف هي أشدّ ضرورة[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «بل بالأحرى بكثير ... ضرورية». والتعبير اليوناني يؤكد بقوة المقابلة مع ما سبق؛ ويمكن أيضًا ترجمته: «بل بالأحرى بكثير، فإن أعضاء الجسد التي تبدو أضعف ضرورية».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ πολλῷ μᾶλλον
  choice: بل بالأحرى
  rationale: ينقل التصحيح القوي والتوكيد في العبارة اليونانية بصورة عربية طبيعية؛ و«بالأحرى» تفيد أن العكس هو الأصدق بدرجة أوضح.
- source_word: τὰ δοκοῦντα
  choice: التي تبدو
  rationale: يحفظ دلالة المظهر أو التقدير، من غير أن يقرر أن الضعف صفة حقيقية ثابتة.
- source_word: μέλη τοῦ σώματος
  choice: أعضاء الجسد
  rationale: «أعضاء» المقابل العربي الطبيعي في استعارة الجسد، وتحفظ الصلة السياقية بأعضاء الجماعة من غير تحويل الاستعارة إلى شرح مباشر.
- source_word: ἀσθενέστερα ὑπάρχειν
  choice: تبدو أضعف
  rationale: صياغة عربية موجزة وطبيعية تؤدي معنى المقارنة في ἀσθενέστερα وترتبط بالفعل الدال على الظهور.
- source_word: ἀναγκαῖά ἐστιν
  choice: هي ضرورية
  rationale: يحفظ معنى الضرورة بأقرب مقابل مباشر، مع إبراز الخبر في العربية بواسطة الضمير «هي».
theological_decisions:
- issue: القوة المجازية لصورة الجسد في سياق الكنيسة
  choice: الإبقاء على «أعضاء الجسد» من غير تفسيرها صراحة بأفراد الكنيسة
  alternative: ترجمة تفسيرية مثل «أعضاء الكنيسة الذين يُظن أنهم أضعف»
  rationale: النص نفسه يواصل استعارة الجسد، والسياق يتيح للقارئ فهم تطبيقها الكنسي من غير أن تُستبدل الصورة بتفسير.
- issue: هل الضعف حقيقي أم منظور إليه كذلك
  choice: «تبدو أضعف»
  alternative: «هي أضعف» أو «تُعَدّ أضعف»
  rationale: تركيب δοκοῦντα ... ὑπάρχειν يبقي الحكم في نطاق الظهور أو الانطباع، فلا ينبغي حسمه بوصفه ضعفًا حقيقيًا.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُعملت «بل بالأحرى» لصوغ المقابلة المؤكدة طبيعيًا، و«أعضاء الجسد» للمحافظة على الاستعارة الملموسة. وُضعت علامة الحاشية في المتن بعد الجملة التي تشرحها.
