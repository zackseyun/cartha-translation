  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: ar
  text: 'لكن لا تستطيع العين أن تقول لليد: «لا حاجة لي إليكِ»، ولا الرأس أيضًا أن يقول للقدمين: «لا حاجة لي إليكما».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: لا تستطيع
  rationale: تنقل معنى عدم القدرة بصياغة عربية طبيعية، لا مجرد عدم اللياقة.
- source_word: δὲ
  choice: لكن
  rationale: تحفظ قوة الاستدراك والانتقال المقابل في سياق ترابط أعضاء الجسد.
- source_word: ὁ ὀφθαλμός
  choice: العين
  rationale: تحافظ على صورة عضو الجسد التي يقوم عليها تشبيه بولس.
- source_word: εἰπεῖν
  choice: أن تقول
  rationale: صياغة عربية مباشرة وطبيعية للمصدر الواقع بعد فعل القدرة.
- source_word: τῇ χειρί
  choice: لليد
  rationale: تنقل المفعول غير المباشر وتحافظ على صورة الجسد.
- source_word: Χρείαν σου οὐκ ἔχω
  choice: لا حاجة لي إليكِ
  rationale: تحافظ على اسم «الحاجة» في الأصل، مع ضمير مؤنث مفرد ظاهر يلائم «اليد».
- source_word: ἢ πάλιν
  choice: ولا ... أيضًا
  rationale: تقدم المثال الموازي الثاني بصياغة عربية طبيعية، مع بقاء معنى الإضافة والمقابلة.
- source_word: ἡ κεφαλή
  choice: الرأس
  rationale: ترجمة مباشرة تحفظ استعارة الجسد؛ واستُعمل معه التذكير وفق جنس الاسم في العربية.
- source_word: τοῖς ποσίν
  choice: للقدمين
  rationale: تحفظ المثنى المقصود في صورة القدمين وتؤدي وظيفة المفعول غير المباشر.
- source_word: ὑμῶν
  choice: إليكما
  rationale: يبين الضمير العربي صيغة المثنى الموجهة إلى القدمين، وهي أوضح من صيغة الجمع اليونانية العامة في هذا السياق الجسدي.
theological_decisions:
- issue: لغة الجسد المجازية للدلالة على ترابط أعضاء الكنيسة
  choice: الإبقاء على أعضاء الجسد حرفيًا من غير تفسير موسع داخل النص
  alternative: التصريح بأن المقصود أعضاء الكنيسة
  rationale: حجة بولس اللاهوتية مبنية على التشبيه نفسه، وإدخال تفسيره في المتن يتجاوز الترجمة.
translation_notes:
  register: فصحى معاصرة واضحة ووقورة. أُظهر الفرق العددي الذي يحمله السياق من خلال «إليكِ» للمفرد المؤنث و«إليكما» للقدمين، لذلك لا حاجة إلى حاشية توضيحية. أُعيد فعل «أن يقول» في الشطر الثاني لتوضيح الحذف اليوناني بصياغة عربية سلسة.
