    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: وإن ... وإن
  rationale: تنقل الصيغة الارتباطية التي تعرض حالتين محتملتين، وتأتي عربيةً طبيعية من غير تحويلها إلى تقرير زمني.
- source_word: πάσχει
  choice: تألَّم
  rationale: يحفظ المعنى العام للمعاناة أو الألم في صورة الجسد، من غير تخصيص نوع الألم.
- source_word: ἓν μέλος
  choice: عضوٌ واحد
  rationale: يحافظ على صورة الجسد وعلى العدد الصريح ἓν.
- source_word: συμπάσχει
  choice: تألَّمت معه
  rationale: يُظهر معنى المشاركة الذي تحمله بادئة συν-، مع إحالة واضحة إلى العضو الواحد.
- source_word: πάντα τὰ μέλη
  choice: جميع الأعضاء
  rationale: يحفظ صورة الجسد والتكرار البلاغي في شطري الآية.
- source_word: δοξάζεται
  choice: أُكرم
  rationale: في سياق التكافل بين أعضاء الجسد، يدل اللفظ على نيل الكرامة أو التقدير؛ وهذه الصياغة واضحة ولا تفرض معنى لاهوتيًا تقنيًا.
- source_word: μέλος
  choice: عضوٌ
  rationale: لا يرد العدد ἕν في هذا الشطر بحسب النص المطبوع، لذلك لم تُضف كلمة «واحد».
- source_word: συγχαίρει
  choice: فرحت معه
  rationale: ينقل معنى الفرح المشترك الذي يتضمنه الفعل المركب، مع إبقاء الإحالة إلى العضو المفرد.
theological_decisions:
- issue: دلالة δοξάζεται في استعارة الجسد الكنسي
  choice: أُكرم
  alternative: مُجِّد
  rationale: السياق المباشر هو العناية المتبادلة والتضامن بين أعضاء الجسد، ولذلك يُرجَّح معنى نيل الكرامة، مع إبقاء البديل المعجمي في الحاشية حفظًا لسعة اللفظ.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُخدم الفعل الماضي بعد «إن» للتعبير العربي الطبيعي عن الحالة المفترضة العامة، وحُفظ التوازي والتكرار وصورة الجسد في الشطرين.
