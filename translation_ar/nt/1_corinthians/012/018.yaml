  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: ar
  text: أمّا الآن، فقد رتّب الله الأعضاء، كلَّ واحدٍ منها، في الجسد كما شاء.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «وضع» أو «جعل»، بدلًا من «رتّب».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «كما أراد».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: أمّا الآن
  rationale: تنقل العبارة التحوّل المقابل من الافتراضات السابقة إلى واقع الحال، مع الحفاظ على قوة الاستدراك من غير جعل «الآن» إشارة زمنية محضة.
- source_word: ὁ θεὸς
  choice: الله
  rationale: ترجمة مباشرة وطبيعية للفاعل المعرّف في اليونانية.
- source_word: ἔθετο
  choice: رتّب
  rationale: يفيد الفعل أصلًا الوضع أو الجعل، لكن «رتّب» يلائم استعارة الجسد هنا ويبرز القصد في موضع كل عضو ووظيفته ضمن الكل.
- source_word: τὰ μέλη
  choice: أعضاء الجسد
  rationale: إضافة «الجسد» توضح في العربية أن المقصود أجزاء الجسد، وتنسجم مع ذكر الجسد صراحة في بقية الآية من غير حصر المعنى في الأطراف.
- source_word: ἓν ἕκαστον αὐτῶν
  choice: كلَّ واحدٍ منها
  rationale: تحافظ الصياغة على التشديد التوزيعي، أي إن الترتيب يشمل كل عضو على حدة.
- source_word: ἐν τῷ σώματι
  choice: في الجسد
  rationale: ترجمة مباشرة تحافظ على صورة الجسد التي يقوم عليها السياق.
- source_word: καθὼς ἠθέλησεν
  choice: كما شاء
  rationale: صياغة عربية موجزة وطبيعية تنقل المطابقة لمشيئة الله وقصده، من غير توسع عقائدي.
theological_decisions:
- issue: قصد الله في توزيع أعضاء الجسد
  choice: تُفهم الآية على أن الله رتّب كل عضو في الجسد وفق مشيئته.
  alternative: أن يكون المعنى مجرد وضع الأعضاء من غير إبراز ترتيب مقصود.
  rationale: السياق يؤكد أن تنوع الأعضاء ومواقعها ليسا أمرًا عارضًا؛ و«رتّب» مع «كما شاء» يحفظان هذا المعنى من غير استنباط مذهب أوسع من نص الآية.
translation_notes:
  register: عربية فصحى حديثة واضحة ورصينة. استُعملت «أمّا الآن» للانتقال الاستدراكي، و«أعضاء الجسد» لتفادي غموض «الأعضاء» منفردة. وُضعت علامتا الحاشيتين بعد عبارتيهما المعنيتين في النص.
