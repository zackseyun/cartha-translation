  text: ἵνα μὴ ᾖ ⸀σχίσμα ἐν τῷ σώματι, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσι τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/025.yaml
  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: ar
  text: لكي لا يكون انقسامٌ[a] في الجسد، بل تهتمّ الأعضاء بعضها ببعض اهتمامًا متساويًا[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «شقاق». يدل اللفظ اليوناني على شقّ أو انقسام؛ والمقصود هنا انقسام داخل الجسد.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا: «تهتمّ الأعضاء بعضها ببعض الاهتمام نفسه».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تُبقي أداة الغاية، مع احتمال دلالة النتيجة في السياق، بصياغة عربية طبيعية.
- source_word: σχίσμα
  choice: انقسام
  rationale: ينقل معنى الشق أو الانقسام داخل الجسد، من غير تحميل اللفظ دلالة كنسية اصطلاحية متأخرة.
- source_word: σῶμα
  choice: الجسد
  rationale: يحفظ استعارة الجسد التي يستخدمها بولس للكنيسة في السياق المباشر.
- source_word: τὸ αὐτό
  choice: اهتمامًا متساويًا
  rationale: يفيد تماثل عناية الأعضاء بعضها ببعض؛ وهذه الصياغة عربية واضحة وتحفظ معنى المساواة في الاهتمام.
- source_word: ὑπὲρ ἀλλήλων
  choice: بعضها ببعض
  rationale: ينقل المعنى التبادلي للعناية الموجَّهة من الأعضاء إلى بعضها، لا معنى النيابة أو الاستبدال.
- source_word: μεριμνῶσι
  choice: تهتمّ
  rationale: يدل هنا على العناية الإيجابية، لا على القلق، ويلائم الفاعل الجمع غير العاقل في العربية.
- source_word: μέλη
  choice: الأعضاء
  rationale: يحفظ صورة أعضاء الجسد، ويشير في السياق إلى أفراد الجماعة من دون تسطيح الاستعارة إلى مجرد «أجزاء».
theological_decisions:
- issue: ترجمة σχίσμα ضمن استعارة الجسد الكنسية
  choice: انقسام
  alternative: شقاق
  rationale: «انقسام» واضح ومعاصر، ويحفظ معنى التمزق داخل الجسد من غير إدخال دلالة اصطلاحية مذهبية أو كنسية لاحقة.
- issue: دلالة τὸ αὐτό مع μεριμνῶσι
  choice: اهتمامًا متساويًا
  alternative: الاهتمام نفسه
  rationale: تُظهر الصياغة أن المقصود تماثل عناية الأعضاء المتبادلة. وتُذكر الصياغة الأقرب إلى ظاهر التركيب في الحاشية حفاظًا على مجال الدلالة.
translation_notes:
  register: عربية فصحى حديثة، واضحة ورصينة. حُفظت استعارة الجسد والأعضاء، واستُعمل تأنيث الفعل المفرد مع جمع غير العاقل وفق الأسلوب العربي المعياري.
