  source_fidelity: 'ينقل المسودّة المعنى الأساسي للآية بدقة: الأعضاء الحسنة/اللائقة المظهر لا تحتاج إلى عناية خاصة، والله وحّد الجسد ومنح العضو المفتقر إلى الكرامة كرامة أوفر. لكن «كان يفتقر» تضيف زمنًا ماضيًا غير ظاهر في اسم الفاعل اليوناني الحاضر τῷ ὑστεροῦντι، كما أن صياغة الحاشية الحالية لا تعبّر بدقة وطبيعية عن معنى الفعل.'
