lexical_decisions:
- source_word: εὐσχήμονα
  choice: ذات المظهر اللائق
  rationale: تنقل معنى اللياقة الظاهرة في سياق أعضاء الجسد، وتقابل الأعضاء غير اللائقة للظهور في العدد السابق من غير إيحاء بتفاوت القيمة الذاتية. وأُضيف «أعضاؤنا» لأن الصفة اليونانية المحايدة الجمع تُستعمل اسميًا ويُفهم موصوفها من السياق.
- source_word: χρείαν ἔχει
  choice: فلا حاجة لها إلى ذلك
  rationale: صياغة عربية طبيعية لعبارة «ليس لها احتياج». وتشير «إلى ذلك» إلى العناية أو التكريم المذكورين في السياق السابق من غير إفراط في التفسير.
- source_word: συνεκέρασεν
  choice: ألّف
  rationale: يفيد «ألّف» ضمّ الأجزاء بعضها إلى بعض في كلّ موحّد، ويحافظ على قصد الفعل الإلهي من غير صياغة آلية. وتورد الحاشية المعنى الحرفي البديل المتعلق بالمزج.
- source_word: σῶμα
  choice: الجسد
  rationale: يحافظ على صورة الجسد المركزية في حديث بولس من غير توسيع تفسيري.
- source_word: τῷ ὑστεροῦντι
  choice: العضو الذي كان يفتقر إلى الكرامة
  rationale: المقصود هو العضو الذي كان ينقصه التكريم في نظر الناس، لا عضو ناقص القيمة في ذاته. ذُكرت «الكرامة» صراحةً بحسب ما يوضحه المفعول به التالي.
- source_word: περισσοτέραν τιμήν
  choice: كرامةً أوفر
  rationale: تحافظ العبارة على قوة المقارنة وتأتي بأسلوب عربي واضح وموقر.
- source_word: δοὺς
  choice: فأعطى
  rationale: تُظهر الفاء صلة إعطاء الكرامة بفعل تأليف الجسد، وتؤدي معنى اسم الفاعل اليوناني بصياغة عربية طبيعية.
theological_decisions:
- issue: دلالة فعل الله في صورة الجسد
  choice: يؤلّف الله أعضاء الجسد ويمنح العضو المفتقر إلى الكرامة كرامة أوفر.
  alternative: أن يكون الكلام عن مجرد مزج أعضاء الجسد ماديًا، أو عن تشريح الجسد الطبيعي وحده دون امتداد الصورة إلى الجماعة.
  rationale: يحفظ النص صورة الجسد كما صاغها بولس، ويبيّن منح الكرامة من غير حصر مرجع الصورة في التشريح الطبيعي أو شرح تطبيقها الكنسي داخل المتن.
translation_notes:
  register: لغة عربية فصحى معاصرة واضحة وموقرة. استُعملت «ذات المظهر اللائق» بدل تعبيرات قديمة مثل «الحسنة» أو تعبيرات قد توحي بعلو القيمة الذاتية. وُضع مؤشر الحاشية بعد «ألّف» لأنه يشرح هذا الفعل تحديدًا.
