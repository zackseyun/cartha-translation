  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: ar
  text: ولكن يُعطى لكلِّ واحدٍ تجلّي الروح للمنفعة العامة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لما فيه نفع»، أو «لمنفعة الجميع».'
    reason: تحفظ الحاشية الدلالة الأوسع للعبارة اليونانية، التي يمكن أن تعني ما هو نافع عمومًا، إلى جانب الفهم الجماعي الذي يرجحه السياق.
lexical_decisions:
- source_word: ἑκάστῳ
  choice: لكلِّ واحدٍ
  rationale: يحفظ قوة التوزيع في صيغة المفرد، ويوضح أن العطية تُعطى لكل فرد داخل الجماعة.
- source_word: δὲ
  choice: ولكن
  rationale: تنقل الانتقال ذا المسحة التقابلية الخفيفة مع الكلام السابق من غير مبالغة في شدة التضاد.
- source_word: δίδοται
  choice: يُعطى
  rationale: ترجمة مباشرة للمضارع المبني للمجهول، وتحفظ كون الأمر عطية من غير إضافة فاعل غير مصرّح به.
- source_word: φανέρωσις
  choice: إعلان
  rationale: يدل اللفظ على إظهار ما يصير ظاهرًا أو بيّنًا؛ و«إعلان» لفظ عربي واضح يلائم ظهور عمل الروح في العطايا، من غير حصره في معنى الوحي اللفظي.
- source_word: τοῦ πνεύματος
  choice: الروح
  rationale: يحفظ الصياغة اليونانية من غير إضافة «القدس»، بينما يحدد السياق أن المقصود هو الروح القدس.
- source_word: πρὸς τὸ συμφέρον
  choice: لأجل المنفعة المشتركة
  rationale: ينقل معنى النفع أو الصالح، ويُبرز التوجه الجماعي الذي يقتضيه سياق الجسد والعطايا، مع إثبات المعنى الأعم في الحاشية.
theological_decisions:
- issue: مرجع «الروح»
  choice: الإشارة إلى الروح القدس مع إبقاء النص «الروح»
  alternative: فهمه بمعنى روح على نحو عام، أو التصريح في المتن بعبارة «الروح القدس»
  rationale: السياق القريب في 1 كورنثوس 12 يكرر أن العطايا من الروح الواحد نفسه، فيتعين المرجع سياقيًا، لكن عدم إضافة «القدس» يحافظ على مقدار التصريح في اليونانية.
- issue: نطاق συμφέρον
  choice: المنفعة المشتركة
  alternative: ما هو نافع، أو المنفعة على وجه عام
  rationale: يمكن للفظ أن يدل على النفع عمومًا، غير أن سياق الأعضاء والجسد والبنيان المتبادل يرجح المنحى الجماعي. وتبقى الدلالة الأعم محفوظة في الحاشية بدل إلغائها.
translation_notes:
  register: عربية فصحى حديثة واضحة وكريمة. استُخدم «إعلان الروح» بوصفه تعبيرًا موجزًا عن جعل عمل الروح ظاهرًا، و«المنفعة المشتركة» لإبراز السياق الجماعي مع إبقاء البدائل الدلالية في الحاشية.
