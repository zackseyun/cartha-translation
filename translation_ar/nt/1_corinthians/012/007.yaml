- from: ولكن يُعطى لكلِّ واحدٍ إعلانُ الروح لأجل المنفعة المشتركة.[a]
  to: ولكن يُعطى لكلِّ واحدٍ تجلّي الروح للمنفعة العامة.[a]
  rationale: استُبدل «إعلان» بـ«تجلّي» لتفادي حصر معنى φανέρωσις في الإعلان الكلامي أو الوحي، وللدلالة مباشرة على ظهور الروح في المواهب. واستُبدلت «المنفعة المشتركة» بـ«المنفعة العامة» لتحسين السلاسة مع الحفاظ على المعنى والسياق الجماعي. كما عُدلت الحاشية لتقدم البديل الأقرب إلى البنية اليونانية («لما فيه نفع») مع الإبقاء على البديل الجماعي.
  reviewer_model: gpt-5.6-terra
