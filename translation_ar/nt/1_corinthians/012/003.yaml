  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: ar
  text: 'لِذَلِكَ أُعْلِمُكُمْ أَنَّ لا أَحَدَ، وَهُوَ يَتَكَلَّمُ بِرُوحِ اللهِ، يَقُولُ: «يَسُوعُ مَلْعُونٌ»[a]، وَلا أَحَدَ يَسْتَطِيعُ أَنْ يَقُولَ: «يَسُوعُ هُوَ الرَّبُّ»[b] إِلَّا بِالرُّوحِ الْقُدُسِ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «لِيَكُنْ يَسُوعُ مَلْعُونًا»، إذا فُهِمَت العبارة اليونانية على أنها دعاء باللعنة.'
    reason: lexical_alternative
  - marker: b
    text: 'حرفيًا بحسب ترتيب اليونانية: «الرَّبُّ يَسُوعُ»؛ والمقصود في السياق اعترافٌ خبري: «يَسُوعُ هُوَ الرَّبُّ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: لذلك
  rationale: تحفظ علاقة الاستنتاج بما سبق بعبارة عربية واضحة وموجزة.
- source_word: γνωρίζω ὑμῖν
  choice: أُعلمكم
  rationale: تنقل المعنى السببي للفعل، أي جعل الأمر معلومًا، من غير إضافة معنى الإرادة غير المصرح به.
- source_word: ἐν πνεύματι θεοῦ
  choice: بروح الله
  rationale: تفيد الباء وساطة الروح أو فاعليته في الكلام، مع بقاء إمكان فهمها بوصفها كلامًا واقعًا في نطاق تأثيره.
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: يسوع ملعون
  rationale: صياغة عربية اسمية طبيعية تحفظ قوة العبارة اليونانية الخالية من فعل صريح، ولا تحولها حتمًا إلى صيغة دعاء.
- source_word: δύναται εἰπεῖν
  choice: يستطيع أن يقول
  rationale: تحفظ دلالة القدرة أو الإمكان الواردة في δύναται.
- source_word: Κύριος Ἰησοῦς
  choice: يسوع هو الرب
  rationale: تجعل العبارة اعترافًا خبريًا واضحًا بالعربية، بدل أن تُفهم على أنها لقب «الرب يسوع» أو نداء.
- source_word: εἰ μὴ ἐν πνεύματι ἁγίῳ
  choice: إلا بالروح القدس
  rationale: تحفظ بنية الاستثناء ودلالة فاعلية الروح دون توسيع المعنى إلى منظومة لاهوتية غير مصرّح بها.
theological_decisions:
- issue: دلالة κύριος في الاعتراف Κύριος Ἰησοῦς
  choice: الرب
  alternative: السيد
  rationale: «الرب» تحفظ المعنى المألوف والوزن المسيحاني واللاهوتي للقب في السياق البولسي من غير زيادة تفسيرية.
- issue: مدى دلالة القول «يسوع هو الرب» بالروح القدس
  choice: الإبقاء على ارتباط الاعتراف بفاعلية الروح القدس كما يورده النص
  alternative: قصره صراحة على التلفظ اللفظي، أو توسيعه إلى شرح كامل للتجديد والإيمان
  rationale: النص نفسه يربط هذا الاعتراف بالروح القدس، لكن لا يفصل هنا طبيعة الاعتراف أو جميع آثاره العقائدية؛ لذلك تُحفظ مساحة التوتر الدلالي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «أُعلمكم» للمحافظة على مباشرة الأصل، وصيغ الاقتباسان صياغة عربية طبيعية. جميع علامات الحواشي مثبتة في المتن.
