  source_fidelity: 'المعنى العام محفوظ، بما في ذلك دلالة «بروح الله/بالروح القدس» بوصفها فاعلية الروح، وصيغة الاعتراف «يسوع هو الرب». لكن ترتيب الجملة الحالية «لا أحد يقول، وهو يتكلم...» يجعل الحال تابعًا للفعل «يقول» في ظاهر العربية أكثر من كونه وصفًا للشخص المتكلم، بينما اليونانية تصف الشخص: «لا أحد يتكلم بروح الله ... يقول».'
