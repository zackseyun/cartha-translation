translation:
  language: ar
  text: فَإِنَّ الْجَسَدَ لَيْسَ عُضْوًا وَاحِدًا، بَلْ أَعْضَاءً كَثِيرَةً.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: فَـ
  rationale: تؤدي الفاء معنى الربط التفسيري والتعليلي بالسياق السابق على نحو طبيعي موجز، من غير تكلف في تمثيل الأداتين اليونانيتين كلتيهما بلفظين مستقلين.
- source_word: τὸ σῶμα
  choice: الْجَسَدُ
  rationale: ترجمة مباشرة للفاعل، وتحافظ على صورة الجسد الاستعارية من غير تفسيرها داخل النص بأنها الكنيسة أو جسد المسيح.
- source_word: οὐκ ἔστιν
  choice: لَيْسَ
  rationale: ينقل فعل الكينونة المنفي نقلًا مباشرًا وطبيعيًا في العربية، من غير إضافة معنى «يتكوّن من» غير المصرح به لفظًا.
- source_word: ἓν μέλος
  choice: عُضْوًا وَاحِدًا
  rationale: «عضو» هو المقابل العربي الطبيعي الذي يحفظ صورة أعضاء الجسد، و«واحدًا» ينقل ἓν بوضوح.
- source_word: ἀλλὰ πολλά
  choice: بَلْ أَعْضَاءً كَثِيرَةً
  rationale: «بل» تنقل المقابلة التصحيحية، وقد صُرّح بجمع «أعضاء» المفهوم من الصفة اليونانية المستعملة استعمال الاسم؛ لأن حذف الاسم في العربية هنا غير طبيعي وقد يوقع في الغموض.
theological_decisions:
- issue: المرجع الاستعاري لـ«الجسد»
  choice: الإبقاء على «الجسد» وحدها كما في اليونانية
  alternative: «جسد المسيح» أو «الكنيسة»
  rationale: مع أن السياق الأوسع يتحدث عن الكنيسة بوصفها جسد المسيح، فإن هذه الآية تقول «الجسد» فقط؛ لذا لا تُدرج هوية الجسد تفسيرًا في متن الترجمة.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقرة. استُعملت «أعضاء كثيرة» بدل محاكاة الحذف اليوناني بعبارة غير طبيعية مثل «بل كثيرة». لا حاجة إلى حاشية في هذه الآية.
