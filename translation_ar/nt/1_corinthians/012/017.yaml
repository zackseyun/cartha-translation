id: 1CO.12.17
reference: 1 Corinthians 12:17
language:
  code: ar
  name: Arabic
  native_name: العربية
  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: εἰ ὅλον τὸ σῶμα ὀφθαλμός, ποῦ ἡ ἀκοή; εἰ ὅλον ἀκοή, ποῦ ἡ ὄσφρησις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: ar
  text: لو كان الجسد كله عينًا، فأين تكون حاسة السمع؟ ولو كان كله سمعًا، فأين تكون حاسة الشم؟
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: الجسد كله
  rationale: صياغة عربية طبيعية تحافظ على معنى الشمول وعلى صورة الجسد في الافتراض.
- source_word: ὀφθαλμός
  choice: عينًا
  rationale: خبر «كان» منصوب، ويحفظ صورة عضو الجسد المفرد من دون زيادة.
- source_word: ποῦ
  choice: فأين تكون...؟
  rationale: ينقل سؤال المكان، وتُظهر «تكون» ارتباطه بالحالة الافتراضية، بينما تربط الفاء النتيجة بالشرط طبيعيًا.
- source_word: ἀκοή
  choice: حاسة السمع / سمعًا
  rationale: اللفظ اليوناني يدل على السمع أو ملكته لا على الأذن. ذُكرت «حاسة» في السؤال للإيضاح، وجاء «سمعًا» في الخبر حفاظًا على إيجاز الأصل.
- source_word: ὅλον
  choice: كله
  rationale: يحافظ على حذف اسم «الجسد» في الشرط الثاني مع بقاء المرجع واضحًا في العربية.
- source_word: ὄσφρησις
  choice: حاسة الشم
  rationale: ينقل ملكة الشم بوضوح، بدل تحويلها إلى العضو الجسدي «الأنف».
theological_decisions:
- issue: التعبير عن استعارة أعضاء الجسد بوظائف الحواس أم بالأعضاء الجسدية
  choice: 'ترجمة ἀκοή وὄσφρησις بوظيفتي الحاستين: «حاسة السمع» و«حاسة الشم»'
  alternative: «فأين تكون الأذن؟ ... فأين يكون الأنف؟»
  rationale: النص اليوناني يسمّي السمع والشم، لا الأذن والأنف؛ لذلك تحفظ الترجمة الوظيفية دقة الصورة من غير تجسيد زائد.
translation_notes:
  register: عربية فصحى معاصرة واضحة وكريمة النبرة. حوفظ على التوازي البلاغي والسؤالين الاستنكاريين، وعلى الحذف في الشرط الثاني، من دون حاجة إلى حاشية لأن الصياغة العربية توصل دلالة ملكتي السمع والشم مباشرة.
