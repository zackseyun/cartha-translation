  - marker: c
    text: 'أو: «بالروح عينه». يستعمل النص اليوناني هنا حرف جر مختلفًا عن المستعمل في «بواسطة الروح»، وقد يفيد الموافقة مع الروح الواحد بوصفه المصدر المشترك.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν ... ἄλλῳ δὲ
  choice: فلهذا ... ولآخر
  rationale: ينقل التقابل التوزيعي بين شخص وآخر بصياغة عربية طبيعية، من غير إضافة اسم غير موجود في اليونانية.
- source_word: διὰ τοῦ πνεύματος
  choice: بواسطة الروح
  rationale: يحفظ دلالة διά مع المضاف إليه على الوسيلة أو الوساطة، ويميّزها من κατά في العبارة اللاحقة.
- source_word: δίδοται
  choice: يُعطى
  rationale: يحفظ صيغة المضارع المبني للمجهول ودلالة كون العطية ممنوحة لا نابعة من الشخص نفسه.
- source_word: λόγος σοφίας
  choice: كلام حكمة
  rationale: «كلام» يتسع هنا للقول أو التعبير أو الرسالة، ويحفظ إيجاز التركيب الإضافي والتباسه الحقيقي من دون حصره في كلمة مفردة.
- source_word: λόγος γνώσεως
  choice: كلام معرفة
  rationale: يحافظ على التوازي مع «كلام حكمة» وعلى العلاقة الإضافية في الأصل.
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: وفقًا للروح نفسه
  rationale: ينقل معنى الموافقة أو الاتساق في κατά مع النصب، ويحفظ اختلاف حرف الجر عن διά بدل تسوية العبارتين.
- source_word: πνεύματος / πνεῦμα
  choice: الروح
  rationale: السياق المباشر في الأصحاح يشير إلى روح الله الذي يوزع العطايا؛ والتعريف يجعل الإحالة واضحة في العربية من غير إضافة لفظ «القدس» غير الموجود هنا.
theological_decisions:
- issue: مرجع «الروح»
  choice: روح الله، مع ترجمته «الروح»
  alternative: الروح البشري
  rationale: سياق 1 كورنثوس 12 يتحدث عن الروح الواحد مصدر العطايا وموزعها، لكن لا تُضاف هنا كلمة «القدس» لأنها ليست في نص الآية.
- issue: دلالة λόγος في عبارات المواهب
  choice: كلام
  alternative: كلمة؛ قول؛ رسالة
  rationale: «كلام» عربي واضح وواسع، فلا يحصر المعنى في مفردة واحدة ولا يقرر مسبقًا شكل هذه الموهبة؛ وتُذكر البدائل في الحواشي.
- issue: العلاقة التي تفيدها κατά
  choice: وفقًا للروح نفسه
  alternative: بالروح نفسه
  rationale: يحفظ هذا الاختيار التباين المقصود المحتمل بين «بواسطة الروح» و«وفقًا للروح»، ولا يطمس تنوع حرفي الجر في اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة ووقورة. استُخدم «لهذا» بدل «للواحد» لتجنب الإيحاء العددي غير الطبيعي، و«نفسه» لمطابقة «الروح» المذكر نحويًا في العربية. وُضعت علامات الحواشي في المتن جميعها.
