  text: فَلِوَاحِدٍ يُعْطَى بِوَاسِطَةِ الرُّوحِ كَلَامُ حِكْمَةٍ[a]، وَلِآخَرَ كَلَامُ مَعْرِفَةٍ[b] وَفْقًا لِلرُّوحِ عَيْنِهِ[c].
