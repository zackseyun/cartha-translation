  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: ar
  text: أفكلُّهم رُسُلٌ؟ أفكلُّهم أنبياءُ؟ أفكلُّهم مُعلِّمون؟ أفكلُّهم يصنعون معجزات؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًّا: «أفكلُّهم قُوًى؟» وتُستعمل «القُوَى» هنا للدلالة على الأعمال الخارقة أو على مَن يصنعونها.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: أَلَعَلَّ...؟
  rationale: تُدخل μή هنا أسئلة بلاغية يُنتظر عنها جواب بالنفي. وصيغة «ألعلّ...؟» العربية تنقل هذا التوقع بوضوح مع الحفاظ على تتابع الأسئلة.
- source_word: πάντες
  choice: الجميع
  rationale: تنقل معنى الشمول وتحافظ على تكرار اللفظة في كل سؤال، بما يبرز أن أعضاء الجسد لا يشتركون كلهم في الدور أو العطية نفسها.
- source_word: ἀπόστολοι
  choice: رُسُل
  rationale: المقصود هنا الدور الخدمي المعروف في قائمة بولس، لا مجرد مبعوثين بالمعنى العام.
- source_word: προφῆται
  choice: أنبياء
  rationale: المقابل العربي المألوف لمن يتنبأون في سياق مواهب الكنيسة وخدماتها.
- source_word: διδάσκαλοι
  choice: معلّمون
  rationale: تعبير عربي واضح وطبيعي عن وظيفة التعليم في هذا السياق.
- source_word: δυνάμεις
  choice: يصنعون أعمالًا معجزية
  rationale: الاسم اليوناني يعني حرفيًا «قُوًى» وقد يُطلق على الأعمال الخارقة. وفي نسق القائمة يقوم مقام ممارسة تلك الأعمال، ولذلك صيغ فعليًا بالعربية تجنبًا للإيحاء بأن الأشخاص أنفسهم «قُوًى».
theological_decisions:
- issue: دلالة δυνάμεις في قائمة الأدوار والمواهب
  choice: أَلَعَلَّ الْجَمِيعَ يَصْنَعُونَ أَعْمَالًا مُعْجِزِيَّةً؟
  alternative: أَلَعَلَّ الْجَمِيعَ أَصْحَابُ قُوًى؟
  rationale: الصياغة المختارة تنقل الاستعمال الكنائي للاسم اليوناني بوصفه إشارة إلى الأعمال الخارقة أو ممارستها، دون أن تحسم طبيعة هذه الأعمال بأكثر مما يسمح به السياق.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. حُفظ التوازي البلاغي والتكرار الرباعي في اليونانية، واستُخدم الاستفهام المتوقع جوابه بالنفي من غير إضافة جواب صريح.
