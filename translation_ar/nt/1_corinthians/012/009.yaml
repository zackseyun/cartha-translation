lexical_decisions:
- source_word: ἑτέρῳ
  choice: لآخر
  rationale: 'صيغة المجرور اليونانية تواصل نمط توزيع المواهب المفهوم من السياق: لهذا... ولآخر. وهذه الصياغة العربية طبيعية ولا تبالغ في التفريق بين ἕτερος وἄλλος هنا.'
- source_word: πίστις
  choice: إيمان
  rationale: «إيمان» هو المقابل الأوسع والأرسخ في الاستعمال البولسي، مع إبقاء احتمالَي «ثقة» و«أمانة» في الحاشية بسبب سعة مدلول اللفظة؛ والسياق يعرضه هنا موهبةً يمنحها الروح.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: بالروح نفسه
  rationale: تفيد الباء الوسيلة أو الفاعلية على نحو عربي طبيعي، وتحفظ تشديد النص على أن الروح نفسه هو مصدر تنوع المواهب.
- source_word: ἄλλῳ
  choice: لآخر
  rationale: تستمر بها صيغة التوزيع، ولا يقتضي السياق فرض فرق دلالي حاد بينها وبين ἑτέρῳ.
- source_word: χαρίσματα
  choice: مواهب
  rationale: تنقل صيغة الجمع ومعنى العطايا الممنوحة بالنعمة، وهي العبارة العربية المألوفة في هذا السياق.
- source_word: ἰαμάτων
  choice: شفاءات
  rationale: تحفظ جمع اللفظة اليونانية بدل تسويته إلى المفرد «شفاء»، رغم أن الجمع أقل شيوعًا في العربية.
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: بالروح الواحد
  rationale: تحفظ الفاعلية التي تفيدها ἐν هنا، كما تحافظ على الانتقال المقصود في اليونانية من «نفسه» إلى «الواحد» إبرازًا للوحدة وسط التنوع.
theological_decisions:
- issue: مدلول πίστις في سياق المواهب
  choice: إيمان
  alternative: ثقة أو أمانة
  rationale: لا يحدد النص نوعًا مذهبيًا بعينه من الإيمان، لذلك استُعمل المقابل العام مع إثبات البدائل المعجمية في الحاشية دون حسم زائد.
- issue: مرجع πνεύματι
  choice: الروح، أي الروح القدس بحسب السياق
  alternative: روح بمعنى غير محدد
  rationale: سياق 1 كورنثوس 12 ينسب توزيع المواهب إلى الروح القدس بوضوح، من غير حاجة إلى إضافة لفظ «القدس» الذي لا يرد صراحة في هذه العبارة.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة ومهيبة. حُفظ التوازي التوزيعي «ولآخر... ولآخر»، كما حُفظ جمع «مواهب شفاءات» والتمييز بين «الروح نفسه» و«الروح الواحد» وفق تنويع الأصل اليوناني.
