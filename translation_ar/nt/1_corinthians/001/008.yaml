  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: ar
  text: وهو أيضًا سيثبّتكم إلى النهاية، بلا لوم[a] في يوم ربّنا يسوع المسيح[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «بلا تهمة» أو «فوق المؤاخذة».'
    reason: lexical_alternative
  - marker: b
    text: 'اليونانية: «خريستوس»، ومعناها «الممسوح»؛ و«المسيح» هو المقابل العربي المألوف للقب.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: سيثبّت
  rationale: يفيد الفعل جعل المخاطَبين راسخين ثابتين؛ و«يثبّت» عربية طبيعية تحفظ معنى التقوية والتوطيد.
- source_word: ἕως τέλους
  choice: إلى النهاية
  rationale: تحفظ العبارة معنى الامتداد الزمني حتى الغاية النهائية، وهي صياغة عربية واضحة ومألوفة.
- source_word: ἀνεγκλήτους
  choice: بلا لوم
  rationale: تنقل بإيجاز معنى عدم وجود ما يوجب الاتهام أو المؤاخذة، مع بيان الظلال القضائية في الحاشية.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: في يوم
  rationale: تحافظ على التعبير الكتابي الأخروي وتبقى طبيعية في العربية.
- source_word: κυρίου
  choice: ربّ
  rationale: المقابل العربي المعتاد للقب κύριος في هذا السياق.
- source_word: Χριστοῦ
  choice: المسيح
  rationale: ينقل معنى اللقب Χριστός بدل معاملته كاسم عائلة، وهو التعبير العربي الكتابي المألوف.
theological_decisions:
- issue: مرجع الضمير الموصول ὃς
  choice: الإبقاء على اتصاله الأقرب بيسوع المسيح المذكور في الآية السابقة، بصيغة «وهو»
  alternative: أن يعود الضمير من جهة السياق الأوسع إلى الله المذكور قبل ذلك
  rationale: أقرب سابق نحوي هو «ربّنا يسوع المسيح» في الآية 7. وصيغة «وهو» تحفظ الاستمرار النحوي من غير إدخال اسم تفسيري غير موجود في اليونانية.
translation_notes:
  register: عربية فصحى حديثة واضحة وموقّرة. استُخدم «سيثبّتكم» بدل تعبير أكثر تجريدًا، وحُفظت العبارة الأخروية «في يوم ربّنا». جميع علامات الحواشي مثبتة في المتن.
