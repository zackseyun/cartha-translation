  text: Εὐχαριστῶ τῷ θεῷ ⸀μου πάντοτε περὶ ὑμῶν ἐπὶ τῇ χάριτι τοῦ θεοῦ τῇ δοθείσῃ ὑμῖν ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/004.yaml
  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: ar
  text: أشكر إلهي دائمًا من أجلكم، بسبب نعمة الله التي أُعطيت لكم في المسيح يسوع،
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: أشكر
  rationale: صيغة المضارع الخبرية تدل هنا على شكر متكرر أو مستمر، و«أشكر» ترجمة عربية مباشرة وطبيعية.
- source_word: τῷ θεῷ μου
  choice: إلهي
  rationale: الفعل العربي «شكر» يتعدى بنفسه، لذلك تنقل «أشكر إلهي» معنى المجرور اليوناني مع إبقاء ضمير الملكية الصريح.
- source_word: πάντοτε
  choice: دائمًا
  rationale: تنقل الدلالة الزمنية الواسعة للفظ اليوناني بوضوح وطبيعية.
- source_word: περὶ ὑμῶν
  choice: من أجلكم
  rationale: في سياق الشكر، تفيد العبارة أن المخاطَبين هم موضوع شكر بولس وسببه المتعلق بهم؛ و«من أجلكم» تعبير عربي طبيعي.
- source_word: ἐπὶ τῇ χάριτι
  choice: بسبب نعمة
  rationale: حرف الجر مع المجرور يبين هنا أساس الشكر أو علته، ولذلك توضح «بسبب» العلاقة من غير توسع تفسيري.
- source_word: χάριτι
  choice: نعمة
  rationale: «نعمة» هي المقابل العربي الراسخ الذي يحفظ معنى عطية الله وإحسانه المجاني في الاستعمال البولسي.
- source_word: τοῦ θεοῦ
  choice: الله
  rationale: الإضافة العربية في «نعمة الله» تحافظ على تركيب المضاف إليه وتترك دلالة الملك أو المصدر مفتوحة.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: التي أُعطيت لكم
  rationale: يحفظ البناء للمجهول معنى اسم المفعول اليوناني، مع بقاء الله مفهومًا بوصفه المعطي من السياق.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: «المسيح» ينقل اللقب Χριστός بصيغته العربية الكتابية الواضحة، و«في» تحفظ العبارة البولسية وعلاقتها التي لا ينبغي اختزالها إلى مجرد واسطة.
theological_decisions:
- issue: دلالة ἐν في عبارة ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  alternative: بالمسيح يسوع
  rationale: أُبقيت «في» للمحافظة على الاتساع اللاهوتي للاتحاد أو المجال أو الارتباط بالمسيح، بدل حصر العبارة في معنى الوسيلة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة، مع الحفاظ على ترتيب الفكرة البولسية وصيغة «المسيح يسوع» الشائعة كتابيًا. لا تستلزم الآية حاشية، إذ لا توجد في الصياغة المختارة ضرورة لعرض بديل يؤثر في المعنى.
