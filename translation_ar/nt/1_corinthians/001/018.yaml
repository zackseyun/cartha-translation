  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: ar
  text: فَإِنَّ رِسَالَةَ الصَّلِيبِ[a] حَمَاقَةٌ عِنْدَ الَّذِينَ يَهْلِكُونَ، أَمَّا عِنْدَنَا نَحْنُ الَّذِينَ نَخْلُصُ[b] فَهِيَ قُوَّةُ اللهِ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «كلمة الصليب».
    reason: lexical_alternative
  - marker: b
    text: تدل الصياغة اليونانية على أن الخلاص هنا واقع مستمر.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: رِسَالَة
  rationale: السياق يشير إلى مضمون البشارة المعلنة عن الصليب، و«رسالة» تؤدي هذا المعنى بوضوح في العربية، مع إثبات البديل الأقرب لفظيًا في الحاشية.
- source_word: σταυροῦ
  choice: الصَّلِيب
  rationale: يحافظ على تعبير بولس الموجز وعلى دلالته الراسخة، مع إمكان أن يدل مجازًا على صلب المسيح.
- source_word: ἀπολλυμένοις
  choice: الَّذِينَ يَهْلِكُونَ
  rationale: يحافظ على دلالة اسم الفاعل المضارع بوصف الهلاك واقعًا جاريًا، وهو طبيعي وواضح في العربية.
- source_word: μωρία
  choice: حَمَاقَة
  rationale: مقابل عربي واضح ومباشر ينسجم مع مقابلة بولس بين الحماقة وقوة الله.
- source_word: σῳζομένοις
  choice: الَّذِينَ نَخْلُصُ
  rationale: صيغة المضارع تحفظ تقديم الخلاص هنا بصفته واقعًا جاريًا، من غير حصره في حدث ماضٍ فقط.
- source_word: δύναμις θεοῦ
  choice: قُوَّةُ اللهِ
  rationale: ترجمة مباشرة تحفظ الثقل اللاهوتي والبنية الخبرية في العبارة اليونانية.
theological_decisions:
- issue: دلالة الجانب الزمني في σῳζομένοις
  choice: نحن الذين نخلص
  alternative: نحن المخلَّصين
  rationale: اسم الفاعل المضارع اليوناني يعرض الخلاص هنا كواقع حاضر جارٍ؛ لذلك تحافظ صيغة المضارع العربية على التوتر اللاهوتي من غير اختزاله إلى حدث ماضٍ مكتمل.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعملت «رسالة الصليب» لسلامتها الدلالية وطبيعتها في العربية، مع إبقاء «كلمة الصليب» في الحاشية. وحُفظت دلالة الاستمرار في فعلي «يهلكون» و«نخلص».
