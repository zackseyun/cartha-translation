source:
  edition: SBLGNT
  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: ar
  text: لِأَنَّ جَهَالَةَ اللهِ أَحْكَمُ مِنَ النَّاسِ، وَضَعْفَ اللهِ أَقْوَى مِنَ النَّاسِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: جَهَالَةَ اللهِ
  rationale: يحافظ على الصياغة المفارِقة في اليونانية وعلى المقابلة المباشرة مع «أحكم»، من غير إضافة تفسير يحسم المقصود.
- source_word: τῶν ἀνθρώπων
  choice: مِنَ النَّاسِ
  rationale: ينقل المقارنة بصياغة عربية طبيعية وشاملة للبشر عمومًا، لا للذكور وحدهم.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: ضَعْفَ اللهِ
  rationale: يحفظ المفارقة اللاهوتية المقصودة كما وردت، من غير تلطيفها أو تحويلها إلى عبارة تفسيرية.
- source_word: ἰσχυρότερον
  choice: أَقْوَى
  rationale: المقابل العربي الطبيعي لصيغة التفضيل، ويحافظ على التوازي مع «أحكم».
theological_decisions:
- issue: إسناد الجهالة والضعف إلى الله في صياغة مفارِقة
  choice: الإبقاء على «جهالة الله» و«ضعف الله»
  alternative: ما يبدو جهالةً من الله / ما يبدو ضعفًا من الله
  rationale: النص اليوناني يعبّر بصيغة مباشرة ومقصودة بلاغيًا؛ وإضافة «ما يبدو» تفسير صحيح محتمل لكنه غير مصرّح به، وقد يخفف حدة المفارقة.
translation_notes:
  register: فصحى معاصرة واضحة ومهيبة، مع الحفاظ على التوازي البلاغي والإيجاز في الأصل.
