lexical_decisions:
- source_word: ἵνα μή τις
  choice: لِئَلَّا يَقُولَ أَحَدٌ
  rationale: ينقل تركيب الغاية المنفية بصياغة عربية واضحة وطبيعية، مع إبقاء المعنى الاستشرافي للفعل بصيغة المضارع المنصوب.
- source_word: εἴπῃ
  choice: يَقُولَ
  rationale: الفعل اليوناني بصيغة الاحتمال بعد ἵνα، ويؤدي المضارع المنصوب بعد «لئلّا» وظيفته في العربية دون تكلف.
- source_word: εἰς
  choice: إِلَى
  rationale: يحافظ على الاتجاه الذي تدل عليه εἰς، ولا يحوّله في المتن إلى «باسم»، التي قد توحي بمعنى الوكالة أو السلطة.
- source_word: τὸ ἐμὸν ὄνομα
  choice: اسْمِي
  rationale: ترجمة عربية مباشرة وطبيعية للتركيب الإضافي الدال على الملكية.
- source_word: ἐβαπτίσθητε
  choice: تَعَمَّدْتُمْ
  rationale: صيغة «تعمّدتم» هي التعبير العربي الكتابي المألوف عن قبول المعمودية، وتحافظ على كون المخاطَبين متلقّين للفعل دون تحديد طريقة إجرائه.
theological_decisions:
- issue: دلالة εἰς τὸ ἐμὸν ὄνομα في سياق المعمودية
  choice: إِلَى اسْمِي
  alternative: بِاسْمِي
  rationale: اختيرت «إلى» لإبقاء القوة الاتجاهية لحرف الجر εἰς وما في العبارة من معنى الارتباط أو الانتساب، من غير حسم طبيعة هذا الارتباط لاهوتيًا. وأُثبتت «باسمي» في الحاشية لأنها بديل عربي محتمل، وإن كان قد يُفهم أيضًا بمعنى السلطة أو الوكالة.
translation_notes:
  register: عربية فصحى معاصرة واضحة ووقورة. استُعمل «لئلّا» لإيجاز غاية النفي، و«تعمّدتم» بوصفها الصيغة العربية المألوفة غير المحدِّدة لكيفية المعمودية.
