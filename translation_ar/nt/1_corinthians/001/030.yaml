  variant: clear Modern Standard Arabic
source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: ar
  text: ومِن عنده أنتم في المسيح يسوع، الذي صار لنا حكمةً من الله، وبرًّا[a] وتقديسًا وفداءً.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: أو «عدلًا».
    reason: بديل معجمي محتمل للفظ δικαιοσύνη، مع أن «برًّا» أنسب للسياق الخلاصي هنا.
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: مِن عنده
  rationale: تحفظ معنى المصدر والمنشأ، وتفيد أن وجود المؤمنين في المسيح يرجع إلى الله، بصياغة عربية أوضح من الترجمة الحرفية «منه».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: في المسيح يسوع
  rationale: تحافظ على تعبير بولس عن الوجود في المسيح من غير تحويله إلى شرح تفسيري مثل «متحدون بالمسيح».
- source_word: ἐγενήθη
  choice: صار
  rationale: مقابل مباشر وطبيعي للفعل، ويحفظ معنى ما صار إليه المسيح لأجل المؤمنين.
- source_word: σοφία
  choice: حكمة
  rationale: اللفظ العربي المباشر الملائم لسياق مقابلة حكمة الله بحكمة العالم.
- source_word: ἀπὸ θεοῦ
  choice: من الله
  rationale: يحفظ دلالة المصدر، مع إبقاء موضع العبارة بعد «حكمة» كما في ترتيب اليونانية.
- source_word: δικαιοσύνη
  choice: برّ
  rationale: هو المقابل اللاهوتي والسياقي المألوف في رسائل بولس، مع إثبات «عدل» بديلًا معجميًا في الحاشية.
- source_word: ἁγιασμός
  choice: تقديس
  rationale: يحفظ دلالة جعل الإنسان مقدسًا أو تخصيصه لله، وهو مصطلح عربي راسخ في هذا السياق.
- source_word: ἀπολύτρωσις
  choice: فداء
  rationale: ينقل معنى التحرير المرتبط بثمن، وهو المقابل العربي اللاهوتي الواضح والمألوف.
theological_decisions:
- issue: علاقة «من الله» بالحكمة وبالأسماء الثلاثة التالية
  choice: أُبقيت العبارة بعد «حكمة» ثم سُردت «برًّا وتقديسًا وفداءً» من غير علامات تفسيرية تفصلها أو تحسم علاقتها النحوية.
  alternative: يمكن فهم «من الله» على أنها تتعلق بالعناصر الأربعة جميعًا، أو فهم الأسماء الثلاثة الأخيرة بوصفها شرحًا للحكمة.
  rationale: ترتيب اليونانية وعطف الأسماء يسمحان بأكثر من تصور للعلاقة؛ لذلك تتجنب الصياغة حسم التوتر بإضافة شرطة أو عبارة شارحة.
- issue: دلالة Χριστός
  choice: المسيح
  alternative: لقب يُعامل كاسم علم محض بلا إبراز معناه المسياني
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب اليوناني ويحفظ مضمونه المسياني من غير إطالة تفسيرية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية رصينة. استُعمل «مِن عنده» لتأدية معنى المصدر في ἐξ αὐτοῦ بعبارة مفهومة، مع الحفاظ على المصطلحات البولسية «في المسيح»، و«البر»، و«التقديس»، و«الفداء».
