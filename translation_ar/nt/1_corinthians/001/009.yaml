source:
  edition: SBLGNT
  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: ar
  text: الله أمين، الذي به دُعيتم إلى شركة[a] مع ابنه، يسوع المسيح ربنا.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: يمكن أن تعني «الشركة» أيضًا «المشاركة» أو «الاشتراك».
    reason: lexical_alternative
  - marker: b
    text: 'أو: «الذي من خلاله دُعيتم».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: أمينٌ
  rationale: تصف الصفة الله بأنه ثابت في أمانته وجدير بالثقة؛ و«أمين» تعبير عربي كتابي فصيح ومفهوم يحفظ قوة الوصف.
- source_word: δι’ οὗ
  choice: الذي به
  rationale: تفيد διά مع المجرور الوساطة أو الفاعلية؛ و«الذي به» تحافظ على الصياغة النسبية وعلى احتمال معنى «من خلاله» دون إثقال العبارة.
- source_word: ἐκλήθητε
  choice: دُعيتم
  rationale: تحفظ صيغة المبني للمجهول ودلالة الدعوة الإلهية المألوفة عند بولس، من غير تحويلها إلى مجرد دعوة اجتماعية أو أمر قسري.
- source_word: κοινωνίαν
  choice: شركة
  rationale: تشمل «شركة» العلاقة المشتركة والمشاركة معًا، وهي موجزة ومألوفة في العربية، مع بيان البدائل الدلالية في الحاشية.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: ابنه
  rationale: أُبقي تركيب الإضافة بعد «شركة» قريبًا من اليونانية؛ ويفهم السياق أنها شركة مع الابن، مع توضيح ذلك في الحاشية.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «يسوع» اسم منقول، و«المسيح» المقابل العربي الراسخ للقب Χριστός، ويحفظ التركيب الطبيعي الموقر في العربية.
- source_word: κυρίου ἡμῶν
  choice: ربنا
  rationale: «الرب» هو المقابل العربي القياسي للقب κύριος، واتصال الضمير طبيعي وموجز.
theological_decisions:
- issue: هل تُفهم κοινωνία مع المضاف إليه على أنها شركة «مع» الابن أم اشتراك «فيه»؟
  choice: شركة ابنه
  alternative: شركة مع ابنه / مشاركة في ابنه
  rationale: يحفظ المتن بنية الإضافة اليونانية وما فيها من سعة دلالية، بينما تشرح الحاشية أن المقصود يمكن أن يصاغ عربيًا على أنه شركة مع الابن أو مشاركة فيه.
- issue: كيفية نقل Χριστός في السلسلة الاسمية Ἰησοῦ Χριστοῦ
  choice: المسيح
  alternative: كريستوس
  rationale: Χριστός لقب يعني «المسيح/الممسوح»، و«المسيح» هو المقابل العربي الدلالي الراسخ، فلا يُعامل هنا كاسم أعجمي بلا معنى.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كتابية موقرة. قُدّم الخبر «أمين» للمحافظة على توكيد الأصل اليوناني، واستُعملت «شركة» بوصفها لفظًا موجزًا يجمع البعد العلاقي والتشاركي.
