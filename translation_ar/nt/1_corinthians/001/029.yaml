  source_fidelity: الترجمة تنقل بدقة البنية الغائية في ὅπως، والنفي الشامل في μὴ مع الفعل في صيغة الاحتمال، ومعنى καυχήσηται («يفتخر»)، ودلالة πᾶσα σὰρξ على البشر في محدوديتهم، ومعنى ἐνώπιον τοῦ θεοῦ («أمام الله»). اختيار «أي بشر» عربي سليم ويؤدي المعنى السياقي من غير تحميل σάρξ معنى «الطبيعة الخاطئة».
