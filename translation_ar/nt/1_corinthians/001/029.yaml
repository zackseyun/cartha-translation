  text: ὅπως μὴ καυχήσηται πᾶσα σὰρξ ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/029.yaml
  text: so that no flesh may boast before God[a].
translation:
  language: ar
  text: لِكَيْ لَا يَفْتَخِرَ أَيُّ بَشَرٍ أَمَامَ اللهِ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «لكي لا يفتخر كل جسد أمام الله»، أي: لا يفتخر أي إنسان أمامه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: لِكَيْ
  rationale: تفيد الغاية أو النتيجة المقصودة، وتحافظ «لكي» على قوة العبارة الغائية بوضوح وطبيعية.
- source_word: μὴ καυχήσηται
  choice: لَا يَفْتَخِرَ
  rationale: النفي مع فعل الصيغة الاحتمالية في جملة غائية يدل على منع الافتخار؛ وهذه الصياغة عربية سليمة ومباشرة.
- source_word: πᾶσα σὰρξ
  choice: أَيُّ بَشَرٍ
  rationale: 'التركيب اليوناني حرفيًا «كل جسد»، لكنه تحت النفي يفيد الاستبعاد الشامل: ألّا يفتخر أي إنسان. ولفظ «بشر» يحفظ صلة التعبير بالجسد والمحدودية البشرية من غير الإيحاء بأن المقصود جسم الإنسان وحده.'
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: أَمَامَ اللهِ
  rationale: تعبير عربي موجز ومألوف يؤدي معنى الوقوف في حضرة الله أو بين يديه.
theological_decisions:
- issue: دلالة σάρξ في السياق البولسي
  choice: ترجمتها هنا «بشر» في المتن، مع إثبات الحرفي «جسد» في الحاشية.
  alternative: «جسد» في المتن، أو «إنسان»، أو «طبيعة خاطئة».
  rationale: السياق لا يتحدث عن مبدأ أخلاقي باطني يُسمّى «الطبيعة الخاطئة»، بل عن البشر في محدوديتهم وضعفهم أمام الله. «أي بشر» ينقل المرجع الإنساني بوضوح ويحافظ على النبرة الخَلْقية، بينما توثق الحاشية الصورة اللفظية الأصلية.
translation_notes:
  register: صياغة عربية فصحى حديثة، واضحة وموقرة. استُعمل «أي بشر» لتجنب غرابة «لا يفتخر كل جسد» في العربية، مع إبقاء اللفظ الحرفي في الحاشية وصون التوتر الدلالي في σάρξ.
