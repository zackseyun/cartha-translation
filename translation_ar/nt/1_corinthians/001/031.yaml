  text: 'لكي يكون الأمر كما هو مكتوب: «مَن يفتخر، فليفتخر بالرب.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: لكي
  rationale: تفيد الغاية أو النتيجة المترتبة على الكلام السابق، وتحافظ «لكي» على هذه القوة بعبارة عربية واضحة.
- source_word: καθὼς
  choice: كما
  rationale: تدل على موافقة ما سبق للشاهد الكتابي، و«كما» هي الصياغة العربية الطبيعية هنا.
- source_word: γέγραπται
  choice: هو مكتوب
  rationale: تنقل صيغة الاستشهاد اليونانية بالمبني للمجهول، وتشير إلى بقاء سلطان النص المكتوب.
- source_word: Ὁ καυχώμενος
  choice: مَن يفتخر
  rationale: تنقل اسم الفاعل المعرّف بصيغة عامة طبيعية في العربية، وتحفظ معنى الافتخار أو الاعتزاز.
- source_word: ἐν
  choice: بـ
  rationale: الباء في «يفتخر بالرب» هي الأسلوب العربي المألوف للدلالة على متعلق الافتخار، من غير تغيير المعنى المقصود.
- source_word: κυρίῳ
  choice: الرب
  rationale: تحافظ على المقابل العربي المستقر لكلمة κύριος وعلى بؤرة الاقتباس اللاهوتية.
- source_word: καυχάσθω
  choice: فليفتخر
  rationale: تنقل صيغة الأمر الثالثة مباشرة وبأسلوب عربي فصيح واضح، مع الحفاظ على قوتها الحاثّة دون تحويلها إلى تقرير خبري.
theological_decisions:
- issue: قوة صيغة الأمر في الاقتباس
  choice: فليفتخر
  alternative: يجب أن يفتخر
  rationale: «فليفتخر» تقابل صيغة الأمر اليونانية مباشرة، وتحفظ توجيه الافتخار المشروع نحو الرب، من غير زيادة إلزام تعبيري غير مصرّح به.
- issue: دلالة κύριος في الاقتباس
  choice: الرب
  alternative: السيد
  rationale: «الرب» تحافظ على الصياغة الكتابية الراسخة وعلى الإحالة اللاهوتية التي يتعمدها بولس في اقتباسه، من غير حسم زائد لهوية المرجع داخل الترجمة نفسها.
translation_notes:
  register: عربية فصحى معاصرة واضحة ومهيبة. استُخدمت صيغة «مَن... فليفتخر» لأنها طبيعية وتحفظ البنية العامة وقوة الأمر في الأصل.
