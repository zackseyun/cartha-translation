  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: ar
  text: فلا تعوزكم أية موهبة[a]، وأنتم تترقبون بشوق استعلان[b] ربنا يسوع المسيح.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «أية موهبة روحية»، أو «أية موهبة من النعمة».'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «ظهور ربنا يسوع المسيح».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: حتى إنكم
  rationale: تعبّر عن النتيجة المترتبة على ما سبق، بصياغة عربية طبيعية وواضحة.
- source_word: ὑστερεῖσθαι
  choice: لا تنقصكم
  rationale: تنقل معنى عدم الافتقار أو القصور، وتلائم «موهبة» في العربية.
- source_word: ἐν μηδενὶ χαρίσματι
  choice: أية موهبة
  rationale: «موهبة» تنقل معنى العطية الممنوحة بالنعمة من غير إضافة تفسيرية تحصرها في نوع معين.
- source_word: ἀπεκδεχομένους
  choice: وأنتم تترقبون بشوق
  rationale: تحفظ معنى الانتظار المستمر المشحون بالتوقع والتطلع.
- source_word: ἀποκάλυψιν
  choice: استعلان
  rationale: مقابل مباشر نسبيًا يدل على الانكشاف أو الكشف، ويحافظ على الطابع الأخروي للعبارة.
- source_word: κυρίου
  choice: ربنا
  rationale: «الرب» هو المقابل المألوف والملائم لـ κύριος في هذا السياق، والضمير ينقل ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: الصيغة العربية المألوفة تنقل الاسم مع اللقب المسياني، وتناسب استعمال العبارة هنا بوصفها تسمية ثابتة.
theological_decisions:
- issue: 'دلالة χαρίσματι: هل تُصرَّح الروحانية أو النعمة في المتن؟'
  choice: أية موهبة
  alternative: أية موهبة روحية؛ أية موهبة من النعمة
  rationale: اللفظ يدل على عطية موهوبة بالنعمة، لكن إضافة «روحية» في المتن تفسير ممكن وليست جزءًا صريحًا من التركيب؛ لذلك حُفظت البدائل في الحاشية.
- issue: دلالة ἀποκάλυψιν في السياق الأخروي
  choice: استعلان
  alternative: ظهور
  rationale: «استعلان» يحافظ على صورة الكشف والانكشاف في اللفظ اليوناني، بينما «ظهور» يوضح الحدث المقصود سياقيًا لكنه أكثر تفسيرًا.
- issue: نقل Χριστοῦ في Ἰησοῦ Χριστοῦ
  choice: المسيح
  alternative: لا بديل جوهري في العربية؛ فاللفظ نفسه لقب يعني الممسوح
  rationale: «يسوع المسيح» هي الصيغة العربية الطبيعية، وتحفظ اللقب المسياني من غير تحويله إلى اسم مبهم أو إدخال تمييز مذهبي.
translation_notes:
  register: عربية فصحى معاصرة واضحة ذات نبرة كريمة. استُعمل «تترقبون بشوق» لإظهار قوة التوقع في الفعل اليوناني، و«استعلان» للمحافظة على دلالة الكشف مع إثبات «ظهور» بديلًا في الحاشية.
