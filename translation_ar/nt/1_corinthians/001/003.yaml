  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ar
  text: نعمةٌ لكم وسلامٌ من الله أبينا والرب يسوع المسيح[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أي: الممسوح.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: نعمة
  rationale: اللفظ العربي المألوف الذي يحفظ دلالة المصطلح البولسي وثراءه اللاهوتي، ولا يختزله في مجرد الحظوة.
- source_word: ὑμῖν
  choice: لكم
  rationale: ينقل صيغة البركة في التحية نقلاً طبيعيًا موجزًا، مع إظهار أن المخاطَبين هم متلقّو النعمة والسلام.
- source_word: εἰρήνη
  choice: سلام
  rationale: يحفظ المعنى العلاقي والكتابي الواسع، وهو التعبير العربي الطبيعي في هذا السياق.
- source_word: ἀπὸ
  choice: من
  rationale: يبيّن المصدر مباشرة، مع إبقاء حرف جر واحد حاكمًا للطرفين المنسّقين كما في اليونانية.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: الله أبينا
  rationale: صياغة عربية طبيعية تحافظ على علاقة البدل أو اللقب في التركيب اليوناني، من غير أن تحوّله إلى «إلهنا وأبينا».
- source_word: κυρίου
  choice: الرب
  rationale: الترجمة العربية الراسخة التي تحفظ قوة اللقب في السياق المسيحي المبكر.
- source_word: Ἰησοῦ Χριστοῦ
  choice: يسوع المسيح
  rationale: «المسيح» المقابل العربي المباشر لـΧριστός، ويحفظ دلالته اللقبية مع الصياغة العربية المألوفة.
theological_decisions:
- issue: اشتراك الله الآب والرب يسوع المسيح في كونهما مصدر النعمة والسلام
  choice: إبقاء «من» واحدة قبل «الله أبينا» وعطف «الرب يسوع المسيح» عليها.
  alternative: تكرار «من» قبل «الرب يسوع المسيح».
  rationale: النص اليوناني يجعل الاسمين المنسّقين تحت حرف الجر ἀπό نفسه؛ وتحافظ الصياغة على هذا التنسيق من غير إضافة تفسير عقائدي.
- issue: 'دلالة Χριστός: لقب أم اسم مستقر'
  choice: المسيح
  alternative: كريستوس أو نقلٌ يعامله بوصفه اسمًا غير مترجم
  rationale: «المسيح» يحفظ معنى اللقب في اليونانية، وهو المقابل العربي الطبيعي والراسخ، مع بقاء احتمال أن تكون الصيغة قد اقتربت في الاستعمال الرسولي من الاسم المركب.
translation_notes:
  register: عربية فصحى واضحة ومهيبة. أُضيف الفعل الدعائي «لِتَكُنْ» لأن الجملة اليونانية الاسمية تُفهم بوصفها تحية بركة، ولأن العربية تحتاج إلى إظهار هذا المعنى على نحو طبيعي. وُضع ضبط جزئي لمنع التباس صيغة الدعاء.
