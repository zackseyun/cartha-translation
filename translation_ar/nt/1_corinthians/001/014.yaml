lexical_decisions:
- source_word: εὐχαριστῶ
  choice: أشكر الله
  rationale: صياغة عربية طبيعية لعبارة الشكر في هذا السياق؛ ذُكر «الله» اعتمادًا على القراءة النصية المشهودة في بعض المخطوطات، مع توثيق الاختلاف في الحاشية.
- source_word: ὅτι
  choice: لأنني
  rationale: تصل في العربية فعل الشكر بمضمونه وسببه بصورة طبيعية، من غير تغيير للعلاقة الدلالية في السياق.
- source_word: οὐδένα ὑμῶν
  choice: لم أعمِّد أحدًا منكم
  rationale: ينقل النفي مع المفعول به بوضوح وبترتيب عربي سليم.
- source_word: ἐβάπτισα
  choice: أعمِّد
  rationale: «عمَّد» هو المقابل العربي المعياري في سياق العهد الجديد، ولا يحسم طريقة إجراء المعمودية.
- source_word: εἰ μὴ
  choice: إلا
  rationale: أداة الاستثناء العربية المباشرة الموافقة لهذا التركيب اليوناني.
- source_word: Κρίσπον
  choice: كريسبس
  rationale: نقل صوتي واضح للاسم اليوناني، ومتسق مع الاستعمال العربي الكتابي الشائع.
- source_word: Γάϊον
  choice: غايس
  rationale: نقل صوتي مباشر للاسم اليوناني، مع تجنب الصيغة الإنجليزية الوسيطة.
theological_decisions:
- issue: المفعول به المفهوم مع εὐχαριστῶ
  choice: أشكر الله
  alternative: أشكر
  rationale: النص المعروض من SBLGNT يحذف لفظ θεῷ، ولذلك يمكن إبقاء المفعول غير مصرح به؛ إلا أن «أشكر الله» عربية طبيعية وتوافق قراءة نصية قديمة واسعة الانتشار. وُثِّق الفرق في الحاشية بدل إخفائه.
