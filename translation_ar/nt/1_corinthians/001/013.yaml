source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: ar
  text: هل انقسم المسيح؟ أفبولس صُلِبَ لأجلكم، أم باسم بولس اعتمدتم؟[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'حرفيًا: «إلى اسم بولس». وقد تدل العبارة على الدخول في الارتباط بصاحب الاسم أو الانتساب إليه.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: انقسم
  rationale: الفعل الماضي العربي ينقل وقوع الانقسام بوصفه حالةً حاصلة، ويحافظ على صورة تقسيم المسيح من غير شرحٍ تفسيري.
- source_word: ὁ Χριστός
  choice: المسيح
  rationale: «المسيح» هو المقابل العربي الطبيعي للقب اليوناني Χριστός، وأداة التعريف ظاهرة في الصياغة العربية.
- source_word: μὴ
  choice: أفـ [في السؤال الاستنكاري]
  rationale: صيغ السؤال بالهمزة بعد فاء التفريع ليبقى سؤالًا استنكاريًا ينتظر جوابًا بالنفي، من غير إضافة «حاشا» أو «بالتأكيد لا».
- source_word: ἐσταυρώθη
  choice: صُلِبَ
  rationale: صياغة مبنية للمجهول مباشرة وواضحة، توافق المبني للمجهول في اليونانية.
- source_word: ὑπὲρ ὑμῶν
  choice: لأجلكم
  rationale: تنقل المعنى النيابي أو «لصالحكم» بإيجاز، من غير حصر حرف الجر في تفسير لاهوتي أدق مما يتيحه السياق.
- source_word: ἐβαπτίσθητε
  choice: اعتمدتم
  rationale: «اعتمد» هو التعبير العربي الكنسي العام والمفهوم لفعل المعمودية، وصيغته هنا توافق المخاطب الجمع.
- source_word: εἰς τὸ ὄνομα Παύλου
  choice: باسم بولس
  rationale: هذه هي الصياغة العربية الطبيعية لعبارة المعمودية، ويمكن أن تحمل معنى الارتباط والانتساب؛ وتوضح الحاشية أن حرف الجر اليوناني ذو اتجاه أصله «إلى».
theological_decisions:
- issue: دلالة انقسام المسيح في السؤال الاستنكاري
  choice: هل انقسم المسيح؟
  alternative: هل قُسِّم المسيح؟
  rationale: يحافظ «انقسم» على إمكان فهم العبارة بوصفها سؤالًا عن صيرورة المسيح منقسمًا، من غير تعيين فاعل قام بتقسيمه؛ والسياق يجعل النبرة الاستنكارية واضحة.
- issue: العلاقة التي تعبّر عنها المعمودية εἰς τὸ ὄνομα
  choice: باسم بولس
  alternative: إلى اسم بولس
  rationale: اختيرت العبارة العربية المفهومة من غير تقرير ما إذا كان المقصود الرئيس هو الصيغة المنطوقة أم الانتساب والولاء؛ وأُبقي الاتجاه الحرفي لحرف الجر في الحاشية.
translation_notes:
  register: لغة عربية فصحى معاصرة، موجزة ومهيبة، تحافظ على تتابع الأسئلة الاستنكارية وعلى التوازي بين «لأجلكم» و«باسم بولس».
