lexical_decisions:
- source_word: ἐπειδή
  choice: لأنَّ
  rationale: تفيد الأداة هنا التعليل وتربط الآية بالحجة المحيطة بها، و«لأنَّ» تؤدي هذا المعنى بوضوح.
- source_word: Ἰουδαῖοι
  choice: اليهود
  rationale: يحافظ اللفظ على المقابلة بين الجماعة اليهودية واليونانيين بوصفهما إطارين دينيين وثقافيين معروفين.
- source_word: σημεῖα
  choice: آيات
  rationale: «آيات» هي المقابل الكتابي العربي الطبيعي، وتحتفظ بدلالة العلامات التي قد تكون عجائبية من غير أن تحصرها في المعجزات صراحة.
- source_word: αἰτοῦσιν
  choice: يطلبون
  rationale: ينقل الفعل بصيغة المضارع المستمر من غير إضافة شدة «يطالبون» أو «يشترطون» التي لا يقتضيها اللفظ وحده.
- source_word: Ἕλληνες
  choice: اليونانيون
  rationale: يحفظ التحديد الثقافي في الأصل، وهو ملائم لاقترانه بطلب الحكمة، بدل توسيعه إلى «الأمم».
- source_word: σοφίαν
  choice: حكمة
  rationale: مقابل مباشر يحافظ على اتساع المفهوم ولا يضيقه إلى الحكمة الفلسفية وحدها.
- source_word: ζητοῦσιν
  choice: يبتغون
  rationale: يعبر بوضوح وكرامة عن السعي المتواصل، ويميّزه أسلوبيًا عن «يطلبون» المقابلة لـ αἰτοῦσιν.
