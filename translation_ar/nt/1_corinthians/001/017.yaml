source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: ar
  text: لِأَنَّ الْمَسِيحَ لَمْ يُرْسِلْنِي لِأُعَمِّدَ، بَلْ لِأُبَشِّرَ، لَا بِحِكْمَةِ الْكَلَامِ[a]، لِئَلَّا يُفَرَّغَ صَلِيبُ الْمَسِيحِ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'يمكن أيضًا: «لا بفصاحةٍ حكيمة»؛ وحرفيًا: «لا بحكمةِ كلمةٍ».'
    reason: lexical_alternative
  - marker: b
    text: 'يمكن أيضًا: «لئلا يُبطَل صليبُ المسيح» أو «لئلا يُفرَّغ من قوته».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: الْمَسِيحَ / الْمَسِيحِ
  rationale: نُقل اللقب بمعناه العربي المألوف بدل معاملته اسمًا منقولًا صوتيًا، مع الحفاظ على الاتساق في الموضعين.
- source_word: βαπτίζειν
  choice: لِأُعَمِّدَ
  rationale: «عمّد» هو المصطلح العربي المستقر والدقيق هنا، ولا يضيّق المعنى إلى كيفية بعينها لإجراء المعمودية.
- source_word: εὐαγγελίζεσθαι
  choice: لِأُبَشِّرَ
  rationale: فعل عربي طبيعي وموجز ينقل معنى إعلان البشارة السارة في هذا السياق.
- source_word: σοφίᾳ λόγου
  choice: بِحِكْمَةِ الْكَلَامِ
  rationale: صياغة قريبة من اليونانية، تُبقي احتمال الإشارة إلى البلاغة أو المهارة الخطابية من غير حصر العبارة في الفصاحة وحدها.
- source_word: κενωθῇ
  choice: يُفَرَّغَ ... مِنْ قُوَّتِهِ
  rationale: حُفظت صورة الإفراغ، وأُضيف «من قوته» لإكمال التعبير العربي الطبيعي وبيان الأثر المقصود، مع توثيق اللفظ الأقرب حرفيًا في الحاشية.
- source_word: σταυρὸς
  choice: صَلِيبُ
  rationale: المقابل العربي المباشر والمستقر، ويحفظ الاستعمال البولسي اللاهوتي.
theological_decisions:
- issue: هل يُنقل Χριστός بوصفه لقبًا ذا معنى أم يُعامل كاسم منقول؟
  choice: المسيح
  alternative: كريستوس
  rationale: اللفظ اليوناني يحمل معنى اللقب، و«المسيح» هو المقابل العربي الطبيعي الموروث الذي يصون هذا المعنى.
- issue: تحديد ما يُفرَّغ منه الصليب في κενωθῇ
  choice: من قوته
  alternative: أن يُفرَّغ صليب المسيح، من غير متمم
  rationale: اليونانية لا تذكر متممًا صريحًا، لكن العربية تحتاج هنا إلى بيان طبيعي؛ «من قوته» يوضح الأثر السياقي من دون إنكار الصورة الأصلية، ولذلك ذُكر الحرفي في الحاشية.
translation_notes:
  register: عربية فصحى حديثة واضحة ذات نبرة كريمة. استُخدم «لأعمّد» و«لأبشّر» لإيجاز طبيعي، وحُفظ التقابل الحاد بين الإرسال للتعميد والإرسال للبشارة من غير أن يُفهم منه انتقاص المعمودية. وُضعت علامتا الحاشية [a] و[b] في المتن عند العبارتين المعنيتين.
