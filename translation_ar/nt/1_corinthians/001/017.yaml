  to: لِأَنَّ الْمَسِيحَ لَمْ يُرْسِلْنِي لِأُعَمِّدَ، بَلْ لِأُبَشِّرَ، لَا بِحِكْمَةِ الْكَلَامِ[a]، لِئَلَّا يُفَرَّغَ صَلِيبُ الْمَسِيحِ[b].
