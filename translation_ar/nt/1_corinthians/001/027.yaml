translation:
  language: ar
  text: لكنَّ الله اختار ما يُعَدّ أحمقَ في العالم[a] لكي يُخزي الحكماء[b]، واختار الله ما يُعَدّ ضعيفًا في العالم[c] لكي يُخزي ما هو قوي.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'أو: «الأمور الحمقاء في العالم». يستعمل اليوناني صفةً محايدةً في الجمع استعمالَ الاسم.'
    reason: lexical_alternative
  - marker: b
    text: 'أو: «يلحق العار بالحكماء» بدلًا من «يُخزي الحكماء».'
    reason: lexical_alternative
  - marker: c
    text: 'أو: «الأمور الضعيفة في العالم». يستعمل اليوناني هنا أيضًا صفةً محايدةً في الجمع استعمالَ الاسم.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: لكنَّ
  rationale: تفيد مقابلة قوية مع الكلام السابق، وهي صياغة عربية واضحة وموجزة.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: ما هو أحمق في العالم
  rationale: يحافظ استعمال «ما» على عدم تعيين المرجع أشخاصًا دون سواهم، إذ إن اليونانية تستعمل صفة محايدة جمعًا استعمال الاسم، كما ينقل العبارة ضمن نطاق العالم.
- source_word: ἐξελέξατο
  choice: اختار
  rationale: ينقل بوضوح فعل الاختيار الإلهي المقصود من الفعل اليوناني المتوسط.
- source_word: ἵνα
  choice: لكي
  rationale: تُظهر غرض الاختيار بعبارة عربية طبيعية.
- source_word: καταισχύνῃ
  choice: يُخزي
  rationale: ينقل معنى إيقاع الخزي والعار، ويحافظ على قوة المقابلة البلاغية.
- source_word: τοὺς σοφούς
  choice: الحكماء
  rationale: الصفة اليونانية هنا مذكرة جمعًا ومستعملة استعمال الاسم، فتشير طبيعيًا إلى الحكماء من الناس.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: ما هو ضعيف في العالم
  rationale: يحافظ على الصفة المحايدة المستعملة استعمال الاسم، ولا يحصر المرجع في أشخاص أو أشياء.
- source_word: τὰ ἰσχυρά
  choice: ما هو قوي
  rationale: يحافظ على المحايد الجمع في الأصل وعلى التوازي مع «ما هو ضعيف»، بدل تحويل العبارة صراحةً إلى أشخاص.
theological_decisions:
- issue: مدى شمول الصفات المحايدة للأشخاص والأشياء
  choice: استعمال «ما هو...»
  alternative: «الأشياء الحمقاء/الضعيفة/القوية» أو «الحمقى/الضعفاء/الأقوياء»
  rationale: لا يحسم الأصل اليوناني المرجع في الأشياء وحدها أو الأشخاص وحدهم؛ لذلك تحفظ الصياغة العربية هذا الاتساع والتوتر البلاغي.
translation_notes:
  register: لغة عربية فصحى حديثة، واضحة ووقورة. حُفظ التوازي بين شطري الآية، واستُعملت «ما هو» لتجنّب تضييق دلالة صيغ المحايد الجمع في اليونانية.
