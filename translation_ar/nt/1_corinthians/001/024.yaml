  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: ar
  text: أَمَّا الْمَدْعُوُّونَ، مِنَ الْيَهُودِ وَالْيُونَانِيِّينَ، فَالْمَسِيحُ هُوَ قُوَّةُ اللهِ وَحِكْمَةُ اللهِ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλητοῖς
  choice: المدعوون
  rationale: الصفة مستعملة استعمال الاسم للدلالة على جماعة يميّزها كونها مدعوة؛ وهذه الصياغة تحفظ معنى الدعوة من غير إضافة فاعل غير مصرّح به في هذه العبارة.
- source_word: Ἰουδαίοις
  choice: يهودًا
  rationale: في المقابلة البولسية مع اليونانيين، يدل اللفظ أساسًا على اليهود بوصفهم جماعة إثنية دينية، لا على سكان اليهودية وحدهم.
- source_word: Ἕλλησιν
  choice: يونانيين
  rationale: يحفظ اللفظ الصريح في المصدر، بدل توسيعه تفسيريًا إلى «الأمم».
- source_word: Χριστόν
  choice: المسيح
  rationale: ينقل اللقب اليوناني بمعناه الراسخ والطبيعي في العربية الكتابية، ولا يعامله كاسم مجرد خالٍ من دلالته اللقبية.
- source_word: θεοῦ δύναμιν
  choice: قوة الله
  rationale: تنقل الإضافة اليونانية مباشرة وتحافظ على التوازي مع العبارة التالية.
- source_word: θεοῦ σοφίαν
  choice: حكمة الله
  rationale: تنقل الإضافة مباشرة وتحفظ تكرار اسم الله والبنية البلاغية للمصدر.
- source_word: implicit copula / verbless predicate relation
  choice: فالمسيح هو قوة الله وحكمة الله
  rationale: أُثبت ضمير الفصل «هو» لإظهار العلاقة الخبرية بوضوح في العربية، مع بقاء العبارة مرتبطة دلاليًا بسياق الآية السابقة.
theological_decisions:
- issue: نقل Χριστός بوصفه لقبًا مسيانيًا
  choice: المسيح
  alternative: الممسوح أو المسيا
  rationale: «المسيح» هو المقابل العربي الطبيعي الراسخ للقب، ويحفظ مضمونه المسياني من غير إدخال تفسير مذهبي زائد.
- issue: العلاقة الخبرية في العبارة اليونانية المحذوف رابطها
  choice: المسيح هو قوة الله وحكمة الله
  alternative: نبشّر بالمسيح، قوةِ الله وحكمةِ الله
  rationale: النص اليوناني يعتمد نحويًا على سياق الآية السابقة، لكن إظهار العلاقة الخبرية يجعل الآية مفهومة منفردة ويحافظ على قوتها الدلالية من غير استيراد فعل غير وارد في هذه الآية نفسها.
translation_notes:
  register: صياغة عربية فصحى واضحة ومهيبة. استُعمل تركيب «سواء أكانوا... أم...» لتوضيح شمول اليهود واليونانيين معًا. لم تُنقل حاشية النص الإنجليزي لأن موضع علامتها ومضمونها غير متوافقين، ولأنها لا تمثل غموضًا حقيقيًا في النص اليوناني هنا.
