  terminology: «المسيح»، «قوة الله»، و«حكمة الله» مصطلحات سليمة وراسخة. و«المدعوون» مناسبة للصفة الاسمية κλητοῖς، من غير تعيين فاعل الدعوة غير المصرح به في الآية.
